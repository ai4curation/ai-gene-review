- id: PMID:25081204
  title: Negative feedback regulation of calcineurin-dependent Prz1 transcription
    factor by the CaMKK-CaMK1 axis in fission yeast.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text checked; directly supports the Ckk2-Cmk1 calcium-response
      pathway and indirect negative regulation of Prz1/calcineurin signaling.
  findings:
  - statement: Identified ppk34 as Ckk2, a second CaMKK in S. pombe. Ckk2 phosphorylates
      and activates Cmk1 in response to calcium. The Ckk2-Cmk1 cascade negatively
      regulates Prz1 transcription factor activity, counteracting calcineurin.
    supporting_text: '...we have identified a second CaMKK in fission yeast, the Ckk2
      kinase, which is involved in the activation of Cmk1 in response to Ca2+...'
    reference_section_type: ABSTRACT
  - statement: Ckk2 is most homologous to mammalian CaMKK2 (34%), followed by Ssp1
      (32%) and CaMKK1 (28%).
    supporting_text: '...Ckk2 is most homologous to mammalian CaMKK2 (34%), followed
      by Ssp1 (32%) and CaMKK1 (28%)...'
    reference_section_type: RESULTS
  - statement: Deletion of ckk2 shows phenotypes similar to cmk1 deletion during calcium
      response. Cdc25 protein levels fail to accumulate in delta-ckk2 cells treated
      with Ca2+.
    supporting_text: '...Cdc25 protein levels in Δckk2 cells were similar to those
      in Δcmk1 cells and, failed to increase during Ca2+ response...reinforcing the
      claim that Ckk2 is in the same pathway as Cmk1 during Ca2+ signalling...'
    reference_section_type: RESULTS
- id: PMID:25639242
  title: Nitrogen regulates AMPK to control TORC1 signaling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text checked; supports Ppk34-dependent stress-induced Ssp2
      activation while explicitly leaving the direct phosphorylation mechanism unresolved.
  findings:
  - statement: CaMKK(Ppk34) is specifically required for nitrogen-stress-induced AMPK
      (Ssp2) activation, distinct from the constitutive role of Ssp1 in Ssp2 T-loop
      phosphorylation.
    supporting_text: '...a second homolog CaMKK(Ppk34) is specifically required to
      stimulate AMPKα(Ssp2) activation in response to nitrogen stress...'
    reference_section_type: ABSTRACT
  - statement: Overexpression of CaMKK(Ppk34) promotes Ssp2 activation through T189
      phosphorylation and induces growth arrest in a nutrient-dependent manner.
    supporting_text: '...overexpression of CaMKKppk34+ can promote AMPKαSsp2 activation
      through T189 phosphorylation...'
    reference_section_type: RESULTS
  - statement: Nitrogen-stress-induced TORC1 inhibition requires Ssp2 (AMPK), Tsc1/2,
      and Rhb1, with Ppk34 required for the nitrogen-specific activation of this pathway.
    supporting_text: '...CaMKKPpk34 is required to induce AMPKαSsp2 activation
      following nitrogen stress...'
    reference_section_type: RESULTS
