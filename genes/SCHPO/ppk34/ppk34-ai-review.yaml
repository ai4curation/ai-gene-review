suggested_questions:
- question: Does Ckk2/ppk34 directly phosphorylate Ssp2 at T189, or does it act indirectly
    through an intermediate? The genetic evidence is clear but direct biochemical
    demonstration of kinase-substrate relationship is needed.
- question: What is the signal that activates Ckk2 specifically during nitrogen stress?
    Is it Ca2+/calmodulin-dependent as in the calcium stress context, or does nitrogen
    stress activate Ckk2 through a different mechanism?
- question: Are there additional substrates of Ckk2 beyond Cmk1, and is Ssp2 an
    as-yet-unconfirmed direct target? The gene appears at the nexus of calcium and
    nutrient signaling, suggesting possible additional targets.
suggested_experiments:
- hypothesis: Ckk2 directly phosphorylates Ssp2 at T189 in vitro.
  description: Perform in vitro kinase assay with purified Ckk2 and Ssp2 to test direct
    phosphorylation at T189, using Ssp2-T189A as a negative control.
  experiment_type: in vitro kinase assay
- hypothesis: Ckk2 activation during nitrogen stress is Ca2+/calmodulin-dependent.
  description: Test whether calmodulin inhibitors or Ca2+ chelators block nitrogen-stress-induced
    Ssp2 phosphorylation in vivo, comparing with Ca2+-stress-induced Cmk1 activation.
  experiment_type: pharmacological inhibition / epistasis analysis
