taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
aliases:
- ckk2
description: 'Ppk34 (also called Ckk2 in the calcium-signaling literature) is a
  calcium/calmodulin-dependent protein kinase kinase (CaMKK) in Schizosaccharomyces
  pombe. It is one of two CaMKK
  homologs in S. pombe (the other being Ssp1) and is most similar to mammalian CaMKK2
  (34% identity). Ckk2/ppk34 has two experimentally demonstrated signaling functions:
  (1) in calcium signaling, it phosphorylates and activates Cmk1, which in turn phosphorylates
  and inactivates the calcineurin-dependent transcription factor Prz1, forming a negative
  feedback loop; (2) in nitrogen stress, it is specifically required for the increase
  in AMPK (Ssp2) T189 phosphorylation and activation that leads to TORC1 inhibition
  and reduced cell size at division. Whether Ppk34 acts directly on Ssp2 or through
  an AMPK phosphatase remains unresolved. The protein localizes to both cytosol and
  nucleus.'
