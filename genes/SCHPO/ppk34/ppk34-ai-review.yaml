references:
- id: file:SCHPO/ppk34/ppk34-deep-research-bioreason-sft.md
  title: BioReason-Pro SFT deep research for ppk34
  findings:
  - statement: BioReason correctly identifies ppk34 as a serine/threonine kinase involved
      in calcium signaling and TORC1 regulation but makes unsupported claims about
      chronological aging and incorrectly suggests direct phosphorylation of calcineurin
      components.
- id: file:SCHPO/ppk34/ppk34-deep-research-falcon.md
  title: Falcon (Edison) deep research report for ppk34/Ckk2
  findings:
  - statement: 'Falcon confirms the gene identity: ORF SPCC1919.01/Ppk34 is a CaMKK-family

      Ser/Thr protein kinase that was renamed Ckk2 (CaM kinase kinase 2) in a

      calcium-signaling study, most similar to mammalian CaMKK2 and related to

      the other fission-yeast CaMKK-like kinase Ssp1.'
    reference_section_type: OTHER
    supporting_text: The literature retrieved consistently links **Ppk34** to *Schizosaccharomyces
      pombe* ORF **SPCC1919.01** and identifies it as a **CaMKK-family, serine/threonine
      protein kinase**; in a Ca2+-signaling study it was **renamed Ckk2** (for CaM
      kinase kinase 2).
  - statement: 'Falcon corroborates the sequence relationships: Ckk2 has 34% identity
      to

      human CaMKK2, 32% to Ssp1, and 28% to human CaMKK1, consistent with its

      assignment to the CaMKK subfamily (PANTHER PTHR43895).'
    reference_section_type: OTHER
    supporting_text: Ckk2 has **34% identity** to human CaMKK2, **32%** to Ssp1, and
      **28%** to human CaMKK1 in the Cisneros-Barroso study.
  - statement: 'Falcon supports a CaMKK-like molecular role: Ppk34/Ckk2 acts as an
      upstream

      Ser/Thr kinase activating downstream kinases (Cmk1, AMPK/Ssp2) in stress

      signaling, rather than being a catalytically uncharacterized kinase.'
    reference_section_type: OTHER
    supporting_text: Ppk34/Ckk2 functions as an upstream **serine/threonine kinase**
      in a CaMKK-like role, activating downstream kinases in stress signaling rather
      than being merely an uncharacterized kinase.
  - statement: 'Falcon notes the two CaMKK-like kinases are non-redundant: Ppk34 is

      specifically required for nitrogen-stress-induced Ssp2 activation whereas

      Ssp1 is constitutively required for basal T-loop phosphorylation.'
    reference_section_type: OTHER
    supporting_text: The paper explicitly states that a **second CaMKK homolog Ppk34
      is specifically required to stimulate activation of Ssp2 in response to nitrogen
      stress**, while **Ssp1 is constitutively required** for basal T-loop phosphorylation.
  - statement: 'Falcon quantifies the nitrogen-stress signaling phenotype: Ssp2 Thr189

      phosphorylation rises ~2.5-fold at 30 min after nitrogen stress in

      wild type, and this increase is absent in ppk34-delta cells.'
    reference_section_type: OTHER
    supporting_text: nitrogen stress led to an **average 2.5-fold increase** in **Ssp2
      Thr189 phosphorylation after 30 minutes**, and this increase was **absent in
      ppk34Δ** cells.
  - statement: 'Falcon notes the Ppk34 effect on Ssp2 phosphorylation is likely indirect

      (basal phosphorylation persists and Ssp1 appears to be the direct T-loop

      kinase), consistent with the IGI evidence type for the kinase activity

      annotation and an indirect mechanism for TORC1 inhibition.'
    reference_section_type: OTHER
    supporting_text: Davie et al. interpret the Ppk34 effect on Ssp2 phosphorylation
      as likely **indirect**
  - statement: 'Falcon reports that ppk34/SPCC1919.01 deletion is viable (non-essential

      under standard conditions) per the systematic kinase deletion analysis.'
    reference_section_type: OTHER
    supporting_text: A systematic kinase deletion analysis categorized **Ppk34 (SPCC1919.01)
      deletion as viable**
  - statement: 'Falcon notes a polarity (NETO) phenotype: ppk34 deletion is associated

      with increased bipolar growth, classifying Ppk34 as a putative negative

      regulator of NETO (new-end take-off). This is a condition-specific

      genetic-screen observation rather than a core biochemical function.'
    reference_section_type: OTHER
    supporting_text: A kinase-deletion screen for NETO (new end take-off) regulators
      identified **ppk34 deletion** as associated with **increased bipolar growth**,
      leading to its classification as a putative **negative regulator of NETO** in
      that screen.
  - statement: 'Falcon cautions that no direct imaging-based localization of Ppk34/Ckk2

      (e.g., Ppk34-GFP) was captured; the cytosolic-cascade model is a

      pathway-level inference, while the nucleus/cytosol GO annotations rest on

      the large-scale GFP localization study.'
    reference_section_type: OTHER
    supporting_text: No direct imaging-based localization (e.g., Ppk34-GFP) was captured
      in the retrieved excerpts.
