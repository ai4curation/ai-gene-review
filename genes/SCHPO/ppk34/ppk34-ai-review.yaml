    label: negative regulation of TORC1 signaling
  evidence_type: IMP
  original_reference_id: PMID:25639242
  review:
    summary: Well supported by Davie et al. 2015. Ppk34/ckk2 activates AMPK (Ssp2)
      during nitrogen stress, which then inhibits TORC1 via the Tsc1/2-Rhb1 axis.
      Note the mechanism is indirect -- ppk34 does not directly phosphorylate TORC1
      components but rather acts through AMPK. The IMP evidence is appropriate as
      it is based on mutant phenotypes (ppk34 deletion fails to reduce TORC1 activity
      upon nitrogen stress).
