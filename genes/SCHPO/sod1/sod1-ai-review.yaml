  label: Schizosaccharomyces pombe 972h-
description: sod1 encodes the copper/zinc superoxide dismutase of Schizosaccharomyces pombe, the cytosolic one of the two
  fission yeast superoxide dismutases (the other being the mitochondrial Mn enzyme sod2). Sod1 is a homodimeric enzyme that
  binds one catalytic copper and one structural zinc per subunit and dismutates superoxide to hydrogen peroxide and dioxygen
  (EC 1.15.1.1). sod1 deletion mutants grow poorly, show increased lipid peroxidation and compensatory catalase activity,
  and are hypersensitive to zinc; Sod1 activity and mRNA rise on zinc exposure. By similarity to S. cerevisiae Sod1 it may
  also occupy the mitochondrial intermembrane space and oxidize hydrogen sulfide, but these roles are not established in S.
  pombe.
