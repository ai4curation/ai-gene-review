suggested_questions:
- question: Does S. pombe Sod1 enter the mitochondrial intermembrane space, and does its copper loading depend on the S. pombe
    copper chaperone for SOD1 as in budding yeast?
suggested_experiments:
- description: Fractionate mitochondria and test protease-protected Sod1 in the intermembrane space of S. pombe, and measure
    Sod1 activity in strains lacking the CCS homolog.
