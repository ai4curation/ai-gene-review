taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: elo2 (SPAC1B2.03c) encodes the very-long-chain fatty acid elongase (ELO/ELOVL family 3-ketoacyl-CoA
  synthase) of fission yeast, a multi-pass membrane protein of the endoplasmic reticulum and the continuous
  nuclear envelope. It catalyses the condensation of long/very-long-chain acyl-CoA with malonyl-CoA to
  a 3-oxoacyl-CoA two carbons longer, the first and rate-limiting, chain-length-selective step of the
  ER elongation cycle whose remaining steps are carried out by the 3-ketoreductase ifa38, the dehydratase
  phs1 and the enoyl reductase tsc13. Elo2 produces the C24:0 fatty acid that is the acyl chain of the
  major S. pombe phytoceramide (t20:0/24:0) and hence of complex sphingolipids; S. pombe has only one
  other ELO-family elongase (elo1). Loss of elo2 is rescued by human ELOVLs, and increased Elo2 restores
  ceramide levels and suppresses lethal nuclear envelope ruptures in lem2 and bqt4 mutants, linking VLCFA
  supply to nuclear membrane integrity.
