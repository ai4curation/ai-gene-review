id: O94655
gene_symbol: ypt7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Schizosaccharomyces pombe ypt7 encodes a Rab7/Ypt7-family small GTPase.
  Prenylated Ypt7 acts as a GTP/GDP molecular switch on late endosomal and
  fungal-type vacuole membranes, where it supports endosome-to-vacuole
  transport and homotypic non-autophagic vacuole fusion.
