- term:
    id: GO:0005829
    label: cytosol
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: >-
      The high-throughput cytosol call likely reflects a C-terminal YFP
      artifact in a Rab that requires C-terminal lipidation for membrane
      targeting.
    action: REMOVE
    reason: >-
      Remove. Matsuyama et al. globally imaged proteins tagged at their 3'
      ends, whereas Ypt7 has C-terminal cysteines that are inferred to be
      geranylgeranylated and methylated for membrane targeting. A cytosolic Rab
      pool can exist in the GDP/GDI-bound state, but the active GTP-bound Ypt7
      switch works on late-endosomal and vacuolar membranes, so cytosol should
      not be retained as an active site from this HDA row.
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: >-
        we determined the localization of 4,431 proteins, corresponding to
        approximately 90% of the fission yeast proteome, by tagging each ORF
        with the yellow fluorescent protein.
      reference_section_type: ABSTRACT
    - reference_id: file:genes/SCHPO/ypt7/ypt7-uniprot.txt
      record_section: ["FT:LIPID"]
      supporting_text: S-geranylgeranyl cysteine
      reference_section_type: DATABASE_ENTRY
