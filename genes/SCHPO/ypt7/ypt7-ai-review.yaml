  review:
    summary: >-
      Fungal-type vacuole membrane is the correct active compartment for Ypt7.
    action: ACCEPT
    reason: >-
      Accept. The PMID:34805795 paper used an N-terminal GFP-Ypt7 fusion as a
      vacuolar membrane marker and reported nearly complete overlap with
      FM4-64, directly supporting the PomBase EXP row. The term itself is
      independently supported by the older PomBase IDA row and by PTN001178553
      fungal PAINT placement of Ypt7/Rab7 at the fungal-type vacuole membrane.
    additional_reference_ids:
    - PMID:16357443
    supported_by:
