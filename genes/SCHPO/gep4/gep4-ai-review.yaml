  label: Schizosaccharomyces pombe 972h-
description: Mitochondrial phosphatidylglycerophosphate (PGP) phosphatase of fission yeast (EC 3.1.3.27),
  a small (209-residue) HAD-superfamily (subfamily IIIA) phosphatase of the GEP4 family. By orthology
  to S. cerevisiae Gep4, it hydrolyses PGP made by pgs1 to phosphatidylglycerol (PG) on the matrix side
  of the inner mitochondrial membrane, supplying PG for cardiolipin synthesis by crd1. The S. pombe protein
  localises to mitochondria in a genome-wide YFP-fusion screen; its enzymatic activity has not been measured
  directly in S. pombe.
