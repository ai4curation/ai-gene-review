taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ure1 (SPAC1952.11c; UniProt O00084) encodes urease (EC 3.5.1.5), a nickel-dependent single-polypeptide
  (plant-type) enzyme that hydrolyses urea to ammonia and CO2. It lets S. pombe use urea, and urea released
  from purine and arginine catabolism, as a nitrogen source. Unlike S. cerevisiae, which degrades urea
  with the biotin-dependent urea amidolyase, fission yeast uses urease. ure2-ure4 are needed for urease
  activity, probably for nickel incorporation. The enzyme is cytosolic.
