description: arg82 (SPAC607.04; UniProt Q9US14) encodes the fission yeast inositol polyphosphate multikinase
  (IPMK; the S. cerevisiae ARG82 ortholog). It phosphorylates Ins(1,4,5)P3 at the 3- and 6-positions and
  then phosphorylates either IP4 isomer to Ins(1,3,4,5,6)P5. IP5 is the substrate of the 2-kinase ipk1,
  which makes IP6, the precursor of the inositol pyrophosphates made by kcs1 and asp1. Function is assigned
  by orthology; a genome-wide screen places it in the cytosol and nucleus.
