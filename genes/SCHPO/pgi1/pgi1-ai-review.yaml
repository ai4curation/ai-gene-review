  label: Schizosaccharomyces pombe 972h-
description: 'Glucose-6-phosphate isomerase (phosphoglucose isomerase, EC 5.3.1.9) of fission yeast, a cytosolic enzyme of
  the GPI family that reversibly interconverts glucose 6-phosphate and fructose 6-phosphate: the second step of glycolysis
  and, in reverse, a step of gluconeogenesis. By similarity to the S. cerevisiae and mammalian enzymes it also has anomerase
  and epimerase side activities on hexose 6-phosphates. Function is inferred from sequence and family; there is no published
  S. pombe-specific biochemistry.'
