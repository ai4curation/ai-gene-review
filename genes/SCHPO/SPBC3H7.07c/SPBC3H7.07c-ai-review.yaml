  review:
    summary: Curator inference of cytosol from the activity; consistent with orthologs.
    action: ACCEPT
    reason: No experimental location for this protein. The UniProt record has no SUBCELLULAR
      LOCATION comment and no signal peptide, transit peptide or transmembrane FT features (only
      CHAIN, ACT_SITE and BINDING); the protein is a soluble SerB-family HAD phosphatase, and the
      phosphorylated serine pathway it completes is a cytosolic pathway in yeasts and mammals. The
      quotes support family membership only; cytosol rests on that membership plus the absence of
      targeting or membrane features.
    supported_by:
