  review:
    summary: PAINT inference from characterised PSPs (S. cerevisiae SER2, human PSPH); sound.
    action: ACCEPT
    reason: The protein is a SerB-family HAD phosphatase (NCBIfam TIGR00338 serB) whose record
      retains the HAD nucleophile and proton-donor active sites and Mg2+ ligands by similarity, and
      UniProt annotates the O-phospho-L-serine hydrolysis reaction. Activity has not been assayed
      for this protein; the experimental evidence is that of the characterised family members.
    supported_by:
