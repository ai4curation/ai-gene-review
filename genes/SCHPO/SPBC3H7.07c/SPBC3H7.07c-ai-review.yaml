description: SPBC3H7.07c (UniProt O74382; the fission yeast SER2 ortholog) encodes phosphoserine phosphatase
  (EC 3.1.3.3), an Mg2+-dependent HAD-family enzyme that dephosphorylates O-phospho-L-serine to L-serine,
  the last step of the phosphorylated pathway of serine biosynthesis. Function is assigned by orthology.
