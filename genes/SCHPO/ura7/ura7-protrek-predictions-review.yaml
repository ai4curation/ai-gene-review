    summary: >-
      Rank 2 (score 17.22). CDP biosynthesis is the product of nucleoside diphosphate kinases and
      CMP kinases acting on CMP; CTP synthase aminates UTP directly to CTP and does not make CDP.
      With UDP biosynthesis at rank 4 and GDP biosynthesis at rank 5, three of the five calls are
      adjacent nucleotide interconversions the enzyme does not catalyse - the substrate-neighbourhood
      pattern, here within a tightly connected metabolic map.
