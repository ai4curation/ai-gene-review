  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for the single fission yeast CTP synthase. Rank 1 is the cytoophidium
  - the filamentous polymer this enzyme forms, annotated by IDA - which is the most distinctive and
  least generic thing about the protein, and the model puts it first. Rank 3 is the exact catalytic
  activity. Ranks 2, 4 and 5 work through the neighbouring nucleotide biosynthesis reactions (CDP,
  UDP, GDP) that the enzyme does not perform. The BioReason evaluation listed cytoophidium biology
  among the organism-specific features that model missed; ProTrek recovers it. Assessment: 2 correct
  not novel (CNN), 1 paralog incorrect (PLI).
