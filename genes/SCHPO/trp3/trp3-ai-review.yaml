  review:
    summary: EC/RHEA mapping; TrpE (component I) of anthranilate synthase.
    action: ACCEPT
    reason: Swiss-Prot curates the anthranilate synthase reaction (EC 4.1.3.27, RHEA:21732) for trp3 and places it in the
      anthranilate synthase component I family (NCBIfam trpE_most). Component I forms anthranilate from chorismate;
      the glutamine amidotransferase half is supplied by component II (in S. pombe, the trp1 GATase domain). The
      evidence is curated family and ortholog (S. cerevisiae TRP2) evidence, not an assay of the S. pombe protein.
