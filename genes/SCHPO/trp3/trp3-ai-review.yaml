  review:
    summary: Component I of the anthranilate synthase complex with the trp1 glutamine amidotransferase
      domain (transfer from S. cerevisiae).
    action: ACCEPT
    reason: Swiss-Prot states by similarity that anthranilate synthase is a tetramer of two component I and two component
      II subunits, and trp3 belongs to the component I family; membership of the complex (with the trp1
      amidotransferase domain as component II) rests on this family and S. cerevisiae TRP2 ortholog evidence.
    supported_by:
