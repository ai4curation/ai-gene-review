  label: Schizosaccharomyces pombe 972h-
description: trp3 (SPCC1442.09; UniProt O94582), the ortholog of S. cerevisiae TRP2, encodes anthranilate
  synthase component I (TrpE). With the glutamine amidotransferase domain of the multifunctional trp1
  protein, it forms anthranilate synthase, which converts chorismate and glutamine-derived ammonia to
  anthranilate, the first committed step of tryptophan biosynthesis and the tryptophan-feedback-regulated
  one. trp3 is a classical tryptophan auxotrophic locus. The protein is cytosolic in a genome-wide screen.
