  - SGD:S000005234
  review:
    summary: Rfc3 is a shared subunit of Ctf18-RFC.
    action: KEEP_AS_NON_CORE
    reason: Ctf18-RFC shares the four small RFC subunits (shown for S. cerevisiae and human, and propagated by PAINT
      from the SF9 ortholog S. cerevisiae RFC3 at node PTN000912313). In fission yeast, Ctf18-RFC is genetically
      required when RFC is compromised and acts redundantly with Rad17-RFC at telomeres, but direct purification
      of pombe Ctf18-RFC is not reported in the cited papers. Membership is well supported by phylogeny; its role
      (cohesion establishment, PCNA loading) is peripheral to Rfc3's core RFC function, so non-core.
    supported_by:
    - &id011
      reference_id: PMID:16040599
      supporting_text: 'In S.cerevisiae, the Ctf18–RFC comprises seven subunits: Ctf18, Rfc2, Rfc3, Rfc4, Rfc5,
        Dcc1 and Ctf8 (2).'
    - &id012
      reference_id: PMID:16040599
      supporting_text: Inactivation of Ctf18-RFC by the deletion of ctf18+, dcc1+ or ctf8+ is lethal in an rfc1-44
        background showing that full Ctf18-RFC function is required in the absence of fully functional RFC.
    - &id013
      reference_id: PMID:20505337
      supporting_text: we found that Rad17-RFC and Ctf18-RFC carry out redundant telomere maintenance functions
        in DBD-rad3 tel1 cells.
