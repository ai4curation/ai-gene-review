- term:
    id: GO:0000076
    label: DNA replication checkpoint signaling
  evidence_type: NAS
  original_reference_id: PMID:16040599
  qualifier: involved_in
  review:
    summary: Rfc3 participates in DNA replication checkpoint signaling as a subunit of the Rad17-RFC checkpoint
      clamp loader.
    action: ACCEPT
    reason: rfc3-1 cells are defective in both the hydroxyurea-triggered replication checkpoint and the MMS/gamma-ray
      damage checkpoint, and Rfc3 associates with Rad17 in vivo (PMID:10588638). As a core small subunit of Rad17-RFC,
      Rfc3 contributes to loading the 9-1-1 checkpoint clamp onto DNA, which is a step of checkpoint signaling itself
      (sensor loading), not merely a requirement for it. The NAS rows agree with this experimental picture.
    supported_by:
    - &id001
      reference_id: PMID:10588638
      supporting_text: From these results, we conclude that rfc3(+) is required not only for DNA replication but
        also for replication and damage checkpoint controls, probably functioning as a checkpoint sensor.
    - &id002
      reference_id: PMID:16040599
      supporting_text: Instead of PCNA, Rad17–RFC loads the 9-1-1 complex onto DNA.
