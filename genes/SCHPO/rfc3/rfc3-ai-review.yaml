suggested_questions:
- question: Should the PomBase IC annotation of Rfc3 to DNA clamp unloader activity (GO:0061860) carry contributes_to,
    given that unloading is driven by the Elg1 large subunit and PAINT did not propagate this activity to the shared
    small subunits?
suggested_experiments:
- description: Test whether the Walker A lysine of pombe Rfc3 is required in vivo (rfc3 K->E allele complementation)
    and for ATP-dependent PCNA loading by reconstituted RFC, and whether rfc3-1 (R216W) selectively impairs Rad17-RFC
    9-1-1 loading versus RFC PCNA loading.
