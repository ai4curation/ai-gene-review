- term:
    id: GO:0061860
    label: DNA clamp unloader activity
  evidence_type: IC
  original_reference_id: PMID:16040599
  qualifier: enables
  supporting_entities:
  - GO:0031391
  review:
    summary: Clamp unloading is an Elg1-RFC complex activity to which Rfc3 can at most contribute.
    action: KEEP_AS_NON_CORE
    reason: The IC is inferred from Rfc3 membership of Elg1-RFC (GO:0031391). The cited 2005 paper only raises unloading
      as a hypothesis; Elg1-RFC PCNA unloading was later established in budding yeast and human (ATAD5-RLC), and
      is driven by the Elg1 large subunit. PAINT curators propagated Elg1-RFC membership to the RFC small subunits
      but did not propagate clamp unloader activity to them, which is consistent with treating unloading as an Elg1-dependent,
      complex-level activity. The annotation is plausible as a contribution of a shared subunit but would be better
      expressed with contributes_to; kept as non-core rather than removed because complex membership is direct.
    supported_by:
    - reference_id: PMID:16040599
      supporting_text: Alternatively, it has been suggested that the Elg1–RFC could function as a PCNA clamp unloader
        (6).
    - *id014
