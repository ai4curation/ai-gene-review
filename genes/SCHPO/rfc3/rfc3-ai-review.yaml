id: O14003
gene_symbol: rfc3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Rfc3 is an ATP-binding small subunit shared by replication factor C and alternative RFC complexes.
  It contributes to ATP-dependent clamp handling on DNA, supports processive DNA replication and repair,
  and participates in replication and DNA-damage checkpoint signaling through the Rad17-associated machinery.
  Its principal functions act on nuclear chromatin.
