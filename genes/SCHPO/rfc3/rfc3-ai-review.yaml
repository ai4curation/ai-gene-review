id: O14003
gene_symbol: rfc3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Rfc3 (SPAC27E2.10c) is one of the four small AAA+ ATPase subunits of replication factor C (RFC), the
  heteropentameric clamp loader that, with ATP, opens the PCNA sliding clamp and loads it onto primer-template junctions
  so that DNA polymerases delta and epsilon can synthesise processively. It is the fission-yeast member of the RFC
  subunit 5 subfamily (orthologous to S. cerevisiae Rfc3 and human RFC5) and carries a Walker A ATP-binding motif.
  The same small subunits partner alternative large subunits to form the RFC-like complexes Rad17-RFC, which loads
  the Rad9-Rad1-Hus1 (9-1-1) checkpoint clamp, Ctf18-RFC, and Elg1-RFC, the last of which was purified from fission
  yeast with Rfc3 as a component. rfc3 is essential; the temperature-sensitive rfc3-1 (R216W) allele causes replication
  defects, chromosome missegregation, sensitivity to hydroxyurea, MMS and radiation, and failure of both the replication
  and DNA-damage checkpoints. Rfc3 acts in the nucleus on chromatin in chromosomal replication, repair DNA synthesis
  (including the Uve1-dependent alternative excision repair pathway) and checkpoint signaling.
