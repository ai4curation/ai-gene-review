  review:
    summary: Rfc3 participates in DNA repair by loading PCNA for repair synthesis.
    action: ACCEPT
    reason: RFC-dependent PCNA loading is needed for repair DNA synthesis in several pathways; S. pombe RFC is required
      in the reconstituted alternative excision repair reaction (PMID:10704216), and rfc3-1 cells are sensitive
      to MMS, gamma and UV irradiation. Because RFC acts in several repair pathways, the broad term is as precise
      as warranted at the family level; UV-damage excision repair is annotated separately.
    supported_by:
    - &id015
      reference_id: PMID:10704216
      supporting_text: A base mispair-containing substrate is repaired in a reaction requiring S. pombe Uve1p, Rad2p,
        DNA polymerase delta, replication factor C, proliferating cell nuclear antigen, and T4 DNA ligase.
    - *id004
