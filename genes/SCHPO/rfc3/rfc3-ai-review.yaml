  review:
    summary: Rfc3 contributes an ATPase site to the RFC clamp loader.
    action: ACCEPT
    reason: Rfc3 is an AAA+ ATPase with an intact Walker A motif; in clamp loaders ATP is hydrolysed at subunit
      interfaces after clamp closure on DNA, and processive RFC-dependent synthesis requires ATP. No isolated-subunit
      assay exists for pombe Rfc3, and the activity is coordinated across the pentamer, but ATP hydrolysis by the
      small subunits' sites is the conserved clamp-loader mechanism.
