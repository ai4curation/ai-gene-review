  review:
    summary: Genome-wide YFP ORFeome localization screen (Matsuyama et al. 2006) scoring Bgs4 as cytoplasmic.
    action: MARK_AS_OVER_ANNOTATED
    reason: Bgs4 is a 16-TM plasma membrane synthase that acts at tips and septum. A cytoplasmic call
      for an overexpressed C-terminally tagged protein in a high-throughput screen most likely reflects
      secretory/endosomal transit (Bgs4 cycles through the Golgi between tips and septum). The observation
      is not removed, but is_active_in cytoplasm is not where the enzyme works.
