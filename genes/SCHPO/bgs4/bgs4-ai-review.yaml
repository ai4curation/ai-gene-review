id: O74475
gene_symbol: bgs4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Bgs4 (also called Cwg1, Orb11 and Pbr1) is one of the four Schizosaccharomyces pombe 1,3-beta-glucan
  synthases (Bgs1-4), large plasma membrane proteins of glycosyltransferase family 48 (FKS family) with
  16 predicted transmembrane helices. Bgs4 is essential and accounts for most of the membrane 1,3-beta-glucan
  synthase activity of the cell. It is required for the major branched beta-1,3-glucan of the cell wall,
  which gives the cell its shape and mechanical integrity. Bgs4 localizes to the plasma membrane of the
  growing cell tips in interphase and moves, through the late Golgi, to the division site after contractile
  ring assembly and septum initiation. There it builds the secondary septum and reinforces the edge of
  the primary septum. Loss of Bgs4 thins the wall at the poles and abolishes the secondary septum; cells
  lyse at growing poles and mainly at the septum around cell separation. Bgs4-derived glucan is also needed
  to keep the actomyosin ring correctly positioned and coupled to septum growth. Bgs4 is also found at
  mating projections, the zygote fusion site, forming spore walls and the germinating spore. Like other
  FKS synthases it is activated by the Rho1 GTPase, the regulatory subunit of the glucan synthase. Bgs4
  is the target of the antifungal glucan synthase inhibitors papulacandin B, enfumafungin and the echinocandins;
  point mutations in bgs4 (pbr1 alleles) confer resistance.
