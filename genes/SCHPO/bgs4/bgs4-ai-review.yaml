core_functions:
- description: Catalytic subunit of the Rho1-activated 1,3-beta-glucan synthase at the plasma membrane
    of growing cell tips and the division site. It polymerizes UDP-glucose into (1->3)-beta-D-glucan that
    ends up as the major branched beta-1,3-glucan of the cell wall, and at cytokinesis it builds the secondary
    septum and reinforces the primary septum edge. Whether Bgs4 itself introduces the branches or a partner
    enzyme does is not known.
