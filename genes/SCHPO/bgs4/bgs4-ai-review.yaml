      S. cerevisiae Fks1/Gsc2, C. albicans Gsc1 and S. pombe Bgs1, Bgs3, Bgs4).
    reason: The activity is correct and ancestral; Bgs4 is a full-length GT48 member and its own experimental
      annotation is among the sources, as expected. But the gene carries the more specific child GO:0140752
