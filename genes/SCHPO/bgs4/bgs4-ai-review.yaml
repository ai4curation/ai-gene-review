suggested_questions:
- question: Does Bgs4 itself introduce the beta-1,6 branch points of the major cell wall branched beta-1,3-glucan,
    or does a partner remodeler do so, as Ghs2 is proposed to do for Bgs3? Ghs2 does not bind Bgs4 (PMID:42786154),
    so any Bgs4 partner is unidentified.
- question: Should GO keep GO:0140752 branched 1,3-beta-D-glucan synthase activity as a catalytic activity
    of the synthase, given that FKS enzymes are thought to extrude linear chains and the branched assignment
    rests on wall composition of bgs4 mutants rather than on a reconstituted enzyme?
- question: How does Rho1 (via the GEFs Rgf1-3) regulate Bgs4 differently at the cell tips and at the
    septum, and what targets Bgs4 to the septum only after Bgs1 and septum initiation?
suggested_experiments:
- description: Purify or reconstitute Bgs4 with Rho1-GTP in proteoliposomes, feed UDP-[13C]glucose, and
    determine the linkage composition of the product (methylation analysis or solid-state NMR) to test
    whether Bgs4 alone makes branched or linear beta-1,3-glucan.
- description: Proteomic search for Bgs4 partners (affinity purification of functional GFP-Bgs4 from membranes,
    or proximity labelling) to find a GH16/GH72-type transglycosylase that could branch the Bgs4 product,
    analogous to Ghs2 for Bgs3.
