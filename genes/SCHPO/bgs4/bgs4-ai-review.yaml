  title: The novel fission yeast (1,3)beta-D-glucan synthase catalytic subunit Bgs4p is essential during
    both cytokinesis and polarized growth.
  findings:
  - statement: bgs4+, cwg1+ and orb11+ are the same gene; Bgs4 is the only Bgs subunit shown to be part
      of the GS enzyme and is essential for integrity during cytokinesis and polarized growth.
    supporting_text: Bgs4p is the only subunit found to be a part of the GS enzyme and essential for maintaining
      cell integrity during cytokinesis and polarized growth
  - statement: Bgs4 arrives at the septum after Bgs1 and Calcofluor-stained septum material, consistent
      with a late role in secondary septum synthesis; it needs the medial ring but not the SIN.
    supporting_text: suggesting that Bgs4p is involved in a late process of secondary or general septum
      synthesis
  - statement: Bgs4 localizes to growing ends, medial ring and septum and to all wall-synthesis sites
      in sexual differentiation.
    supporting_text: Bgs4p localizes to the growing ends, the medial ring and septum, and at each stage
      of wall synthesis or remodeling that occurs during sexual differentiation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding characterization of bgs4 (Cortes et al. 2005, J Cell Sci). Abstract-only cache;
      all claims used are in the abstract.
