gene_symbol: fas2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: fas2 (SPAC4A8.11c; also known as lsd1) encodes the alpha subunit of the fission yeast type I fatty
  acid synthase (FAS), the orthologue of S. cerevisiae FAS2. Six fas2 alpha and six fas1 beta subunits form a ~2.2
  MDa barrel-shaped alpha6beta6 complex. The alpha subunit carries the acyl carrier protein domain, the NADPH-dependent
  3-oxoacyl-ACP reductase, the 3-oxoacyl-ACP synthase (condensing enzyme), and a C-terminal phosphopantetheinyl
  transferase that activates the ACP; the beta subunit supplies the acetyl- and malonyl/palmitoyl transferases,
  dehydratase and enoyl reductase. The complex converts acetyl-CoA, malonyl-CoA and NADPH to long-chain acyl-CoA
  in the cytosol. fas2 is essential; temperature-sensitive lsd1 alleles cause unequal (large and small daughter)
  nuclear division and accumulate abnormal very-long-chain phospholipids, both rescued by palmitate, reflecting
  the demand for fatty acids during nuclear envelope expansion in closed mitosis. In vitro DNA strand-exchange activity
  reported for purified FAS (p190/210) is regarded by its authors as unlikely to be physiological.
