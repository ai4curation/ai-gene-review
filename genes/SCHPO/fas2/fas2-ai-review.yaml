suggested_questions:
- question: Why do fas2 ts alleles that only slightly affect FAS activity in vitro accumulate melissoyl (C30) phospholipids;
    does impaired FAS shift malonyl-CoA toward the ER elongases (elo1/elo2)?
suggested_experiments:
- description: Profile acyl-CoA chain lengths and elongase (elo1/elo2) dependence of the C30 phospholipid accumulation
    in fas2 ts strains with and without elongase deletions.
