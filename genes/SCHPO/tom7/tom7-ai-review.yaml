proposed_new_terms: []
suggested_questions:
- question: >-
    Does fission-yeast Tom7 regulate TOM core oligomeric-state transitions in
    the same way as the characterized budding-yeast protein?
  experts: []
suggested_experiments:
- description: >-
    Purify TOM complexes from wild-type and tom7 deletion strains and compare
    Tom40/Tom22/small-Tom assembly state, precursor import and beta-barrel
    precursor transfer to SAM.
knowledge_gaps:
- gap_statement: >-
    The elemental molecular activity of S. pombe Tom7 is unknown. The protein
    is confidently assigned to the TOM complex, but no channel, receptor,
    catalytic or binding activity has been demonstrated directly for the
    fission-yeast protein.
  boundary: >-
    Tom7 is a 52-residue Tom7-family single-pass outer-membrane protein; by
    orthology it is a TOM-complex small subunit. The reviewed evidence supports
    a structural/regulatory role at the complex level rather than a standalone
    molecular_function GO term.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Defining a molecular activity would make the accepted MF ND row stale and
    would clarify how Tom7 modulates the TOM translocase.
  resolution: >-
    Test direct Tom7 contacts and TOM oligomerization/assembly changes in
    purified S. pombe TOM complexes, including tom7 deletion or
    transmembrane-helix mutants.
  provenance:
  - reference_id: file:SCHPO/tom7/tom7-notes.md
    supporting_text: >-
      A manual literature search found no S. pombe Tom7 paper defining a
      molecular activity more specific than its TOM-complex structural or
      regulatory role.
