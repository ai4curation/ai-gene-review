  findings:
  - statement: >-
      No S. pombe-specific Tom7 mechanistic paper was found; curation rests on
      conserved Tom7-family membership and budding-yeast experimental evidence.
core_functions:
- description: >-
    Tom7 is inferred to be a TOM-complex small subunit that contributes to
    mitochondrial precursor import by acting in the outer-membrane translocase
    rather than by forming an independent channel or insertase.
  supported_by:
  - reference_id: file:SCHPO/tom7/tom7-uniprot.txt
