- term:
    id: GO:0045040
    label: protein insertion into mitochondrial outer membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002439577
  - SGD:S000005014
  review:
    summary: >-
      Kept as non-core TOM route context. Outer-membrane beta-barrel precursors
      enter mitochondria through TOM before SAM-mediated insertion, but this
      route is secondary to Tom7's TOM-complex small-subunit role.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT row propagates a real TOM-dependent import-route claim from
      budding-yeast Tom7. Keep it as non-core because it reflects one
      downstream cargo route through TOM rather than a distinct Tom7 molecular
      activity.
    additional_reference_ids:
