    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      Accept the MF ND row. Literature and orthology identify Tom7 as a small
      TOM-complex structural/regulatory subunit, but do not identify a
      standalone enzymatic, receptor or channel activity for the S. pombe
      protein.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      IBA, ISS and IEA cellular-component and biological-process rows do not
      make an MF ND stale. The available Tom7-family evidence supports a
      complex subunit role, while no more specific GO molecular_function term is
      justified for S. pombe Tom7.
    additional_reference_ids:
    - file:SCHPO/tom7/tom7-deep-research-manual.md
    - file:SCHPO/tom7/tom7-notes.md
    - file:SCHPO/tom7/tom7-uniprot.txt
    supported_by:
    - reference_id: file:SCHPO/tom7/tom7-notes.md
      supporting_text: >-
        A manual literature search found no S. pombe Tom7 paper defining a
        molecular activity more specific than its TOM-complex structural or
        regulatory role.
