id: O42999
gene_symbol: tom7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Tom7 is a conserved, very small, single-pass mitochondrial outer membrane
  subunit of the TOM translocase complex. Conserved fungal evidence supports a
  structural or regulatory role in the outer-membrane import machinery,
  especially TOM-complex organization and stability.
