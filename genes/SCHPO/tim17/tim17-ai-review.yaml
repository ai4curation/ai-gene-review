- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: enables
  supporting_entities:
  - GO:0140657
  review:
    summary: >-
      Tim17 is not the ATPase of the import reaction. It is an integral channel
      subunit; ATP hydrolysis in matrix import is supplied by the matrix Hsp70
      motor.
    action: REMOVE
    reason: >-
      This IC row incorrectly turns pathway ATP dependence into ATP hydrolysis by
      Tim17. GO:0140657 is a GO term rather than gene-specific evidence, and the
      TIM23 literature assigns complete translocation through the matrix import
      motor to Tim44 and mitochondrial Hsp70, not Tim17.
    supported_by:
    - reference_id: PMID:11344168
      supporting_text: >-
        Tim17 and Tim23 are necessary for initiating translocation, whereas
        Tim44 and mitochondrial Hsp70 are indispensable for complete transport
        of preproteins and for unfolding of folded domains of preproteins.
    source_defects:
    - defect_type: WRONG_TERM
      resource: POMBASE
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0016887 ATP hydrolysis activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The IC row infers ATP hydrolysis activity on tim17 from TIM23 complex
        membership, but Tim17 is an integral Tim23-associated translocase
        subunit. ATP hydrolysis in matrix import is supplied by the matrix Hsp70
        motor, so the supporting TIM23-complex annotation should not be
        converted into an ATPase molecular function on tim17.
      supported_by:
      - reference_id: PMID:11344168
        supporting_text: >-
          Tim17 and Tim23 are necessary for initiating translocation, whereas
          Tim44 and mitochondrial Hsp70 are indispensable for complete transport
          of preproteins and for unfolding of folded domains of preproteins.
