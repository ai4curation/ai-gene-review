  label: Schizosaccharomyces pombe 972h-
description: >-
  tim17 encodes a conserved four-pass inner mitochondrial membrane subunit of the
  TIM23 presequence translocase. Tim17 associates with the Tim23 channel and
  helps couple incoming mitochondrial precursor proteins to the PAM import motor
  for translocation into the matrix; the same core also participates in
  TIM23-SORT lateral release of selected inner-membrane proteins.
