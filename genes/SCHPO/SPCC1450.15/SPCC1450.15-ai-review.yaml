    summary: Broad parent of the sphingolipid biosynthesis term accepted in this review.
    action: TOO_GENERAL
    reason: True but uninformative. UniProt's by-similarity function (from S. cerevisiae Tsc10,
      P38342) assigns the KDS reductase step of de novo sphingolipid synthesis, i.e. the accepted
      sphingolipid biosynthetic process (GO:0030148), which entails this term.
