taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPCC1450.15 (UniProt Q9Y7P2) encodes an unusual ER membrane fusion protein. Its N-terminal
  domain is the NADPH-dependent 3-ketodihydrosphingosine reductase (Tsc10 ortholog; EC 1.1.1.102), which
  reduces the SPT product to dihydrosphingosine in the second step of sphingolipid synthesis. Its C-terminal
  domain is a PIGF homolog that works in GPI-anchor biosynthesis. Function is assigned by orthology.
