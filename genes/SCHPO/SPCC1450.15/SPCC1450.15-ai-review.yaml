  supporting_entities:
  - UniProtKB:P0CR36
  review:
    summary: NADPH cosubstrate; subsidiary.
    action: KEEP_AS_NON_CORE
    reason: The SDR (KDSR-like) reductase domain uses NADPH as the hydride donor; UniProt curates the
      NADPH-dependent reaction by similarity to S. cerevisiae Tsc10 (P38342) and maps NADPH-binding
      residues from the KDSR ortholog P0CR36. Family and by-similarity evidence only; true but
      subsidiary to the reductase activity.
