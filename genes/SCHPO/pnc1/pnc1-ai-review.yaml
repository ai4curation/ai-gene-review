  label: Schizosaccharomyces pombe 972h-
description: pnc1 (SPBC365.20c; UniProt Q9USS0) encodes nicotinamidase (EC 3.5.1.19), which deamidates
  nicotinamide, released by NAD+-consuming enzymes such as sirtuins, to nicotinate. This is the first
  step of NAD+ salvage through the Preiss-Handler route (nicotinate phosphoribosyltransferase, NaMN/NMN
  adenylyltransferase, NAD+ synthetase). Function is assigned by orthology to S. cerevisiae PNC1; a genome-wide
  screen places it in the cytosol and nucleus.
