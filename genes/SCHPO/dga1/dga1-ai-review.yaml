  label: Schizosaccharomyces pombe 972h-
description: dga1 (SPCC1235.15; UniProt O74850) encodes the DGAT2-family acyl-CoA:diacylglycerol acyltransferase
  (EC 2.3.1.20). With the phospholipid:DAG acyltransferase plh1, it makes the triacylglycerol of S. pombe
  lipid droplets. Dga1 sits on the ER, including the perinuclear ER where TAG-rich droplets form, and
  on lipid droplets. dga1 plh1 double mutants lack TAG and lipid droplets, lose viability on entering
  stationary phase with apoptotic markers, and make spores that often fail to germinate.
