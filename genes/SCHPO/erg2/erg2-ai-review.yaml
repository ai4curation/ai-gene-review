  label: Schizosaccharomyces pombe 972h-
description: erg2 (SPAC20G8.07c) encodes the C-8 sterol isomerase of Schizosaccharomyces pombe, a single-pass ER-membrane
  protein of the ERG2/sigma-1-receptor-like family. It moves the B-ring double bond of fecosterol from Delta8 to
  Delta7 to give episterol, the step between C-24 methylation by erg6 and C-5 desaturation by erg31/erg32 in the
  late ergosterol pathway. erg2 deletion mutants are viable but make no ergosterol, are sensitive to cycloheximide
  and staurosporine, and some cells form more than one septum. The fungal ERG2 isomerase is structurally unrelated
  to the animal EBP Delta8-Delta7 isomerase.
