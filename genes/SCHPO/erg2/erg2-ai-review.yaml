suggested_questions:
- question: Is S. pombe Erg2 inhibited by morpholine fungicides (fenpropimorph, tridemorph) as budding-yeast Erg2
    is, and does it share the sigma-1-receptor-like ligand-binding pocket?
suggested_experiments:
- hypothesis: S. pombe Erg2 is a morpholine-sensitive C-8 sterol isomerase like budding-yeast Erg2.
  experiment_type: enzyme assay
  description: Assay fecosterol -> episterol isomerisation in microsomes from wild-type and erg2-deleted S. pombe,
    and test fenpropimorph sensitivity of the activity.
