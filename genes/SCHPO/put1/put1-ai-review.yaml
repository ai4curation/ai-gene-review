core_functions:
- description: Predicted mitochondrial FAD-dependent proline oxidation to P5C using a quinone electron
    acceptor, the first proline-degradation reaction. The function is supported by the inherited PRODH
    clade and curated domains; obligatory participation in a native arginine proline shuttle is not directly
    established.
