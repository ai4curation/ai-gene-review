core_functions:
- description: FAD-dependent oxidation of L-proline to P5C with ubiquinone as electron acceptor in mitochondria,
    the first step of proline degradation (and the step by which arginine-derived proline is oxidised).
    Same core function as S. cerevisiae PUT1.
