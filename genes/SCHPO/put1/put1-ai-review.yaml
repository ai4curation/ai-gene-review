  label: Schizosaccharomyces pombe 972h-
description: Put1 (SPCC70.03c) is the predicted mitochondrial FAD-dependent proline dehydrogenase of Schizosaccharomyces
  pombe. Conserved proline-oxidase architecture supports oxidation of L-proline to P5C with a quinone
  acceptor, initiating proline degradation toward glutamate. The catalytic assignment and mitochondrial
  targeting are primarily comparative. Fission-yeast isotope tracing establishes arginine conversion to
  proline and glutamate upstream of this pathway, but does not independently demonstrate an obligatory
  Put1-mediated proline shuttle.
