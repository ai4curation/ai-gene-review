description: put1 (SPCC70.03c) encodes the probable mitochondrial proline dehydrogenase (proline oxidase,
  EC 1.5.5.2) of fission yeast, the ortholog of S. cerevisiae PUT1. This FAD-dependent enzyme oxidises
  L-proline to 1-pyrroline-5-carboxylate (P5C), passing electrons to ubiquinone, the first step of proline
  degradation to glutamate, which P5C dehydrogenase (put2) completes. In fungi this mitochondrial step
  also completes arginine catabolism, because arginine-derived P5C is first reduced to proline in the
  cytosol. The protein has a predicted N-terminal mitochondrial transit peptide. Its function is inferred
  from sequence and orthology; it has not been characterised in S. pombe.
