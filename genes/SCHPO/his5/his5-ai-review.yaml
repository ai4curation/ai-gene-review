description: 'his5 (SPBC21H7.07c; UniProt P40374), the fission yeast ortholog of S. cerevisiae HIS3, encodes
  imidazoleglycerol-phosphate dehydratase (IGPD; EC 4.2.1.19). It dehydrates imidazoleglycerol phosphate
  to imidazoleacetol phosphate, step 6 of histidine biosynthesis. It is the target of 3-amino-1,2,4-triazole:
  wild-type S. pombe is 3-AT sensitive, and his5 cDNA was cloned as a suppressor of 3-AT sensitivity.
  Unlike S. cerevisiae HIS3, his5 transcription rises only slightly on 3-AT, suggesting weaker general
  amino acid control. It is cytosolic in a genome-wide screen.'
