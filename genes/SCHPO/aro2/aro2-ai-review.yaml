  label: Schizosaccharomyces pombe 972h-
description: Chorismate synthase (EC 4.2.3.5) of Schizosaccharomyces pombe (SPCC1223.14; UniProt O74413 has no gene name),
  orthologous to S. cerevisiae Aro2. It catalyses the 1,4-trans-elimination of phosphate from 5-enolpyruvylshikimate 3-phosphate
  (EPSP) to give chorismate, the last step of the shikimate pathway and the branch point for phenylalanine, tyrosine and tryptophan
  synthesis. The reaction requires reduced FMN; fungal chorismate synthases characterised so far also carry an intrinsic NADPH-dependent
  flavin reductase activity, not yet tested for the S. pombe protein. aro2 is cytosolic (and partly nuclear) in the ORFeome
  localisation screen.
