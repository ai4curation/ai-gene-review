- term:
    id: GO:0042602
    label: riboflavin reductase (NADPH) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001078515
  - SGD:S000003116
  review:
    summary: PAINT IBA from fungal node PTN001078515, seeded only by S. cerevisiae Aro2, whose intrinsic NADPH-dependent flavin
      reductase was demonstrated (as for N. crassa CS). Placing this at a fungal node is a reasonable phylogenetic judgment,
      but the activity is untested in S. pombe and the physiological flavin is FMN (reduced FMN is the chorismate synthase
      cofactor), not riboflavin. Retained as non-core, as for S. cerevisiae ARO2.
    action: KEEP_AS_NON_CORE
    reason: Auxiliary flavin-reducing activity of fungal bifunctional chorismate synthases; untested in S. pombe and the term
      names riboflavin rather than FMN.
    supported_by:
    - reference_id: PMID:8971708
      supporting_text: a flavin reductase (FR) activity able to generate reduced flavin mononucleotide in the presence of
        NADPH is an intrinsic feature of a bifunctional CS
    - reference_id: PMID:8971708
      supporting_text: it is shown that the protein is also bifunctional
    - reference_id: file:SCHPO/aro2/aro2-uniprot.txt
      supporting_text: Name=FMNH2; Xref=ChEBI:CHEBI:57618; Evidence={ECO:0000250};
