suggested_questions:
- question: Does S. pombe aro2, like S. cerevisiae Aro2 and N. crassa chorismate synthase, have intrinsic NADPH-dependent
    FMN reductase activity, making it self-sufficient for reduced flavin?
suggested_experiments:
- description: Purify recombinant aro2 and measure chorismate formation from EPSP with and without NADPH/FMN and an exogenous
    flavin reductase; measure NADPH oxidation in the presence of FMN.
  experiment_type: enzyme assay
