  label: Schizosaccharomyces pombe 972h-
description: sur2 (SPBC887.15c; UniProt O94298) encodes the sphingolipid C4-hydroxylase (S. cerevisiae
  SUR2 ortholog), an ER-membrane di-iron enzyme that hydroxylates sphinganine/dihydroceramide at C4 to
  give phytosphingosine. Phytosphingosine is the main sphingoid base of the IPC and MIPC complex sphingolipids
  of fission yeast. Function is assigned by orthology and by use of sur2 mutants in heterologous complementation
  studies.
