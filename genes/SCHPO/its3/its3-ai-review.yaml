taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: its3 (SPAC19G12.14; UniProt O13853) encodes the essential plasma-membrane phosphatidylinositol
  4-phosphate 5-kinase (PI4P5K/Mss4 family) that makes PM PI(4,5)P2 from the PI4P made by Stt4. PM PI(4,5)P2
  anchors the cytokinetic ring medially; its3-1 mutants halve PM PI(4,5)P2, causing ring sliding and asymmetric
  division, and hyperseptate with FK506, showing a shared function with calcineurin. Its3 is negatively
  regulated by casein kinase I (Cki1). It is bound by the PI(4,5)P2 sensor Opy1, and Duc1 at ER-PM contacts
  affects its activity. In ptn1 cells, its3 and vps34 are both needed for the unusual PIP3 synthesis.
