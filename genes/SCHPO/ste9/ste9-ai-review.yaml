      supporting_text: >-
        In all the mutants (ste9, fzr2Δ, and fzr3Δ), Mes1 levels were significantly increased at
        the end of meiosis II (5.5–6 h) rather than in early meiosis, pointing to their roles in
        Mes1 destruction in meiosis II.
      reference_section_type: RESULTS
    - reference_id: PMID:21389117
      supporting_text: >-
        Because Ste9 is essential for nitrogen starvation–induced G1 arrest, a prerequisite for
        meiotic entry, we created Puhp1-HA-ste9 mutants, in which the expression of HA-tagged
        Ste9 is under the control of the uhp1 promoter and is repressed in meiosis.
      reference_section_type: RESULTS
- term:
    id: GO:0031568
    label: mitotic G1 cell size control checkpoint signaling
  evidence_type: IGI
  original_reference_id: PMID:9398669
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPCC18B5.03
  review:
    summary: >-
      IGI with cig2 (PomBase:SPCC18B5.03). Yamaguchi et al. isolated srw1 as a multicopy
      suppressor of hyperactive Cdc2 and showed that srw1-deleted cells fail to arrest in G1
      on nitrogen starvation and are sterile, that fertility is restored by deleting the
      G1/S cyclin Cig2 or by mildly inactivating Cdc2, and that Cdc13 is not degraded in the
      disruptant on starvation. This is PomBase's term for the pre-Start G1 delay that holds
      cells below the size threshold for Start, the same term PomBase uses for rum1, cig2, cdc2
      and wee1.
    action: ACCEPT
    reason: >-
      Ste9 executes the cyclin-destruction arm of pre-Start G1 control: by removing Cdc13 it
      keeps Cdc2 activity below the Start threshold so that small or starved cells lengthen or
      arrest in G1, and Blanco et al. explicitly frame this as lengthening G1 until cells reach
      the minimum size for DNA replication. The genetic interaction with cig2 identifies the
      Cdc2-cyclin activity that Ste9 antagonises. The 'signaling' wording is a PomBase
      convention for this pathway rather than a claim that Ste9 is a signal transducer, and
      the curator had the full text; the function is the core physiological role of the gene.
    supported_by:
    - reference_id: PMID:9398669
      supporting_text: >-
        When starved for nitrogen source, they fail to effectively arrest in G1 and die of
        accelerated mitotic catastrophe if regulation of p34(cdc2)/Cdc13 by inhibitory tyrosine
        phosphorylation is compromised by partial inactivation of Wee1 kinase.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9398669
      supporting_text: >-
        Fertility is restored to the disruptant by deletion of Cig2 B-type cyclin or slight
        inactivation of p34(cdc2).
      reference_section_type: ABSTRACT
    - reference_id: PMID:10921876
      supporting_text: >-
        This is important for small cells that had to lengthen the G 1 -phase until they reach
        the minimum cell size required to initiate DNA replication or to prevent entry into
        mitosis from G 1 .
      reference_section_type: DISCUSSION
- term:
    id: GO:0031568
    label: mitotic G1 cell size control checkpoint signaling
  evidence_type: IMP
  original_reference_id: PMID:9571240
  qualifier: involved_in
  review:
    summary: >-
      Kitamura et al. showed that ste9 mutants are sterile because they cannot arrest in G1 on
      starvation, that ste9 cdc10-ts cells arrested in pre-Start G1 fail to lower Cdc13 and
      undergo abortive mitosis from G1, that ste9 is synthetically lethal with wee1, and that
      Ste9 overexpression lowers Cdc13 and H1 kinase activity, blocks mitosis and triggers
      re-replication. Only the abstract is cached, but it states these findings explicitly.
    action: ACCEPT
    reason: >-
      Loss and gain of function in this species both place Ste9 in the pre-Start G1 control
      that keeps mitotic CDK activity low until cells pass Start; this is the core physiological
      output of APC/C-Ste9-dependent Cdc13 destruction. The IMP is retained as a core process
      alongside the more mechanistic GO:2000134 row from the same paper.
    supported_by:
    - reference_id: PMID:9571240
      supporting_text: >-
        The ste9 mutants were sterile because they were defective in cell cycle arrest in the
        G1-phase upon starvation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9571240
      supporting_text: >-
        In the double mutants of ste9 cdc10(ts), cells arrested in G1-phase at the restrictive
        temperature, but the level of mitotic cyclin (Cdc13) did not decrease. In these cells,
        abortive mitosis occurred from the pre-Start G1-phase.
      reference_section_type: ABSTRACT
    - reference_id: file:SCHPO/ste9/ste9-deep-research-falcon.md
      supporting_text: >-
        Wild-type fission yeast responds to nitrogen removal by undergoing approximately two
        divisions and arresting in G1. ste9/srw1-pathway mutants fail to establish this arrest
        correctly; they can execute an additional S phase and accumulate with G2 DNA content.
