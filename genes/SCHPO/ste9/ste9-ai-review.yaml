      The genetic interaction with cig2 and the Cdc13/H1 kinase data identify the CDK
      activity that Ste9 antagonises, and the mechanism (cyclin destruction lowering Cdc2
      activity) is exactly what the term describes. Ste9 does the work of this process rather
      than merely being required for it, so the row is core.
