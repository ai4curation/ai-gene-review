core_functions:
- description: >-
    APC/C coactivator for G1: in pre-Start G1, when Cdc2-cyclin activity is low, dephosphorylated
    Ste9 docks onto the APC/C core and switches the ubiquitin ligase on toward its substrates,
    driving the polyubiquitylation and proteasomal destruction of the mitotic cyclins Cdc13 and
    Cig1 (and, at the end of meiosis II, Mes1); purified fission yeast APC/C ubiquitylates Cdc13
    and Cut2 only when supplied with an E2 and a coactivator, and Ste9 is the strongest activator
    of the five. The activity is switched off outside G1 by Cdc2-Cdc13 phosphorylation, which
    dissociates Ste9 from the APC/C and targets it for proteolysis, and is not required for the
    Slp1-dependent wave of cyclin destruction at mitotic exit.
  molecular_function:
    id: GO:1990757
    label: ubiquitin ligase activator activity
  directly_involved_in:
