    reference_section_type: ABSTRACT
  - reference_id: PMID:10921876
    supporting_text: >-
      This is important for small cells that had to lengthen the G 1 -phase until they reach
      the minimum cell size required to initiate DNA replication or to prevent entry into
      mitosis from G 1 .
