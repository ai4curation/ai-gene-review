- term:
    id: GO:0005680
    label: anaphase-promoting complex
  evidence_type: IDA
  original_reference_id: PMID:10921876
  qualifier: part_of
  review:
    summary: >-
      Proposed cellular-component annotation. Blanco et al. showed in fission yeast that
      dephosphorylated Ste9 associates with the APC/C in G1 (co-purification with the tagged
      core subunit Cut9) and that Cdc2-cyclin phosphorylation in S/G2 dissociates it, and
      Kimata et al. reconstituted the active APC/C-Ste9 holoenzyme from purified fission yeast
      APC/C and in vitro translated Ste9. ComplexPortal lists the srw1 variant of the APC/C
      (CPX-765).
    action: NEW
    reason: >-
      GO conventionally records Cdc20-family coactivators as part_of the APC/C: budding yeast
      CDH1 carries GO:0005680 by IPI and IBA, human FZR1 carries it, and fission yeast slp1
      carries it by IBA from the same PAINT node (PTN000460086) that supplies ste9's other IBA
      rows, so the absence on ste9 is a propagation gap rather than a MOD convention. The
      direct co-association evidence in this species is in PMID:10921876, and the term is
      needed to express the in_complex of both core functions. This is a component assertion
      about the G1 holoenzyme, not a claim that Ste9 is a constitutive core subunit.
    supported_by:
    - reference_id: PMID:10921876
      supporting_text: >-
        In G 1 , when cdc2–cyclin kinase activity is low, unphosphorylated ste9/srw1 interacts
        with APC/C.
      reference_section_type: ABSTRACT
    - reference_id: PMID:10921876
      supporting_text: >-
        APC/C–ste9 interaction occurs only in G 1 when ste9 is in its dephosphorylated form.
        In S-phase and G 2 , ste9 becomes phosphorylated and it does not interact with APC/C.
      reference_section_type: DISCUSSION
    - reference_id: PMID:21389117
      supporting_text: >-
        To reconstitute APC/C function activated by different coactivators, we immunodepleted
        endogenous Xenopus APC/C and Fizzy/Cdc20 from Xenopus egg extracts, then added back
        purified S. pombe APC/C, in vitro translated S. pombe coactivators, and analyzed the
        destruction of APC/C substrates.
      reference_section_type: RESULTS
