proposed_new_terms: []
suggested_questions:
- question: >-
    ste9 has no cellular-component annotation to GO:0005680 anaphase-promoting complex, whereas
    yeast CDH1 (IBA, IPI) and human FZR1 carry part_of APC/C and fission yeast slp1 carries it by
    IBA; Blanco et al. (PMID:10921876) co-purified dephosphorylated Ste9 with the APC/C in G1 and
    ComplexPortal lists an 'Anaphase-promoting complex, srw1 variant' (CPX-765). This review
    proposes the term as a NEW part_of annotation on that basis; is the current absence a
    deliberate PomBase convention for transiently bound coactivators, or a propagation gap that
    the Blanco co-association evidence (or the PAINT node) should fill?
  experts: []
- question: >-
    The two mitotic G1 cell size control checkpoint signaling rows (GO:0031568) rest on
    nitrogen-starvation G1 arrest, sterility and G1-length phenotypes. Does PomBase intend this
    term for the cyclin-destruction arm of pre-Start G1 control that Ste9 executes, or for a
    size-sensing signal upstream of it? If the former, would negative regulation of G1/S
    transition (GO:2000134, already annotated) be the preferred single term?
  experts: []
- question: >-
    Chu et al. (2009, MCB, doi:10.1128/MCB.00562-09) reported the MBF activator Rep2 as an
    APC/C-Ste9 substrate protected by Cds1 phosphorylation of Ste9 during replication arrest,
    and Stonyte et al. (2020, iScience) showed PP2A-B56/Par1 is needed for Ste9 dephosphorylation
    in pre-Start G1. Neither paper is reflected in the current GOA set; should Ste9 receive
    annotations for these regulatory relationships (e.g. via has_input on the APC/C process, or
    a replication-checkpoint response term)?
  experts: []
suggested_experiments:
- hypothesis: >-
    Ste9 recognises D-box/KEN-box degrons on Cdc13 and Cig1 through its WD40 propeller, and the
    exclusion of Cig2 from APC/C-Ste9-mediated destruction reflects the absence or masking of a
    Ste9-compatible degron rather than a lack of Ste9 activity in S phase.
  description: >-
    Reconstitute ubiquitylation with Lid1-TAP-purified APC/C, E1/E2 and in vitro translated Ste9
    (wild-type and WD40 degron-binding-surface mutants modelled on the budding yeast Cdh1 D-box
    pocket) using Cdc13, Cig1, Cig2 and degron-mutant substrates; complement with in vivo
    stability of Cig2 chimeras carrying the Cdc13 D-box in G1-arrested wild-type versus ste9
    deletion cells.
  experiment_type: reconstituted ubiquitylation with degron and receptor-surface mutants
- hypothesis: >-
    Endogenous Ste9 is nuclear throughout the cycle but its association with the APC/C, not its
    location, is the cell-cycle-regulated step, with PP2A-B56/Par1 acting directly on the Cdk
    sites in pre-Start G1.
  description: >-
    Image endogenously tagged Ste9 together with an APC/C core subunit through synchronous
    cycles and nitrogen starvation in wild-type, par1 deletion and unphosphorylatable ste9-4A
    backgrounds, quantifying nuclear/cytoplasmic ratio and APC/C co-immunoprecipitation at each
    stage; test direct dephosphorylation of Cdc2-phosphorylated Ste9 by purified PP2A-B56 in
    vitro.
  experiment_type: live-cell imaging with phosphatase genetics and in vitro dephosphorylation
