- id: PMID:10921876
  title: APC(ste9/srw1) promotes degradation of mitotic cyclins in G(1) and is inhibited
    by cdc2 phosphorylation.
  findings:
  - statement: >-
      APC/C-Ste9 promotes G1 degradation of the mitotic cyclins Cdc13 and Cig1 but not the
      S-phase cyclin Cig2, and is dispensable for cyclin proteolysis at the metaphase-anaphase
      transition.
    supporting_text: >-
      We show that APC ste9/srw1 specifically promotes the degradation of mitotic cyclins
      cdc13 and cig1 but not the S-phase cyclin cig2.
    reference_section_type: ABSTRACT
  - statement: >-
      Dephosphorylated Ste9 binds the APC/C only in G1; Cdc2-cyclin phosphorylation in the rest
      of the cycle triggers Ste9 proteolysis and dissociates it from the APC/C.
    supporting_text: >-
      In the rest of the cell cycle, phosphorylation of ste9/srw1 by cdc2–cyclin complexes
      both triggers proteolysis of ste9/srw1 and causes its dissociation from the APC/C.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title and full text verified against the cached PubMed/PMC record (PMC306614). Primary
      biochemical and genetic characterisation of APC/C-Ste9 in G1.
- id: PMID:10921878
  title: Fission yeast Fizzy-related protein srw1p is a G(1)-specific promoter of
    mitotic cyclin B degradation.
  findings:
  - statement: >-
