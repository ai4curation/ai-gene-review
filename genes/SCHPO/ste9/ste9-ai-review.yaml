      with APC/C.
    reference_section_type: ABSTRACT
- description: >-
    Cdk-gated APC/C docking that enforces the pre-Start G1 state: by binding the APC/C and
    clearing Cdc13 in G1, Ste9 keeps Cdc2-cyclin B activity below the threshold for Start and
    for mitosis, so that small cells lengthen G1 until they reach the size required for DNA
    replication, nitrogen-starved cells arrest in G1 and become competent to mate, and cells
    cannot launch mitosis from G1; it acts partly redundantly with the CDK inhibitor Rum1 and
    is reactivated in pre-Start G1 by PP2A-B56 (Par1)-dependent dephosphorylation. Loss of ste9
    causes sterility, failure of starvation-induced G1 arrest and synthetic lethality with
    wee1; overexpression lowers Cdc13-associated kinase activity, blocks mitosis and induces
    re-replication.
  molecular_function:
    id: GO:0010997
    label: anaphase-promoting complex binding
