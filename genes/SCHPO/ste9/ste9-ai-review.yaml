- id: PMID:21389117
  title: Mes1 controls the meiosis I to meiosis II transition by distinctly regulating
    the anaphase-promoting complex/cyclosome coactivators Fzr1/Mfr1 and Slp1 in fission
    yeast.
  findings:
  - statement: >-
      With purified fission yeast APC/C, Ste9 is the strongest of the five coactivators at
      stimulating ubiquitylation of Cut2 and Cdc13 in vitro.
    supporting_text: >-
      Ste9 showed the most robust stimulation of ubiquitylation for both substrates.
    reference_section_type: RESULTS
  - statement: >-
      Ste9 activates Cdc13 destruction in interphase but not mitotic extracts, consistent with
      Cdk-dependent inhibition of Cdh1 orthologues in mitosis.
    supporting_text: >-
      In contrast, in interphase egg extracts, Slp1 was unable to activate Cdc13 destruction
      whereas Ste9 stimulated Cdc13 destruction efficiently (Figure 5C, bottom).
    reference_section_type: RESULTS
  - statement: >-
      Repressing Ste9 in meiosis stabilises Mes1 at the end of meiosis II.
    supporting_text: >-
      In all the mutants (ste9, fzr2Δ, and fzr3Δ), Mes1 levels were significantly increased at
      the end of meiosis II (5.5–6 h) rather than in early meiosis, pointing to their roles in
      Mes1 destruction in meiosis II.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title and full text verified against the cached PMC record (PMC3084671). Although the
      title concerns the meiotic coactivators, the full text contains the direct in vitro Ste9
      APC/C-activation assays and the Puhp1-HA-ste9 meiotic phenotype that underlie the
      PomBase IDA/IMP rows.
- id: PMID:9398669
  title: A WD repeat protein controls the cell cycle and differentiation by negatively
    regulating Cdc2/B-type cyclin complexes.
  findings:
