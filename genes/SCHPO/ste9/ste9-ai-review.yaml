    supporting_text: >-
      APC ste9/srw1 is not necessary for the proteolysis of cdc13 and cig1 that occurs at the
      metaphase–anaphase transition but it is absolutely required for their degradation in G 1 .
    reference_section_type: ABSTRACT
  - reference_id: PMID:10921876
    supporting_text: >-
