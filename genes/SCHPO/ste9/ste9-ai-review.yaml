  qualifier: involved_in
  review:
    summary: >-
      Mutant-phenotype arm of Kimata et al.: in a Puhp1-HA-ste9 strain in which Ste9 expression
      is repressed during meiosis, the APC/C substrate Mes1 was significantly stabilised at the
      end of meiosis II, pointing to a role of Ste9 in Mes1 destruction at meiotic exit. Ste9 was
      not needed for the meiosis I to meiosis II transition, and it is heavily phosphorylated
      (inactive) through most of meiosis.
    action: ACCEPT
    reason: >-
      The IMP records a genuine dependence of APC/C substrate destruction on Ste9 in vivo,
      here at the end of meiosis II, and complements the vegetative G1 evidence for Cdc13 and
      Cig1. Ste9 is one of several coactivators acting on Mes1 at that stage, so the phenotype
      is partial, but that does not weaken the process assignment.
    supported_by:
