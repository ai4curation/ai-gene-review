taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: imt3 (SPAC17G8.11c; UniProt Q10323) encodes a Golgi inositol phosphoceramide mannosyltransferase
  in the fission-yeast Imt1/Imt2/Imt3 SUR1/CSH1-homologous trio. These enzymes transfer mannose from
  GDP-mannose to IPC to form the terminal and most abundant fission-yeast complex sphingolipid, MIPC.
  The imt1 imt2 imt3 triple disruptant lacks MIPC and accumulates IPC, while newer css1-3 suppression
  data indicate that the three paralogs have overlapping but non-identical activity toward IPC subspecies,
  including an especially important Imt3-dependent MIPC pool. Complete MIPC deficiency causes defects
  in cell and vacuole morphology, ergosterol distribution and endocytic sorting of a plasma-membrane
  amino acid transporter.
