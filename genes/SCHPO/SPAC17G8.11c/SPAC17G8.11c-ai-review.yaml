- id: PMID:12954640
  title: Csg1p and newly identified Csh1p function in mannosylinositol phosphorylceramide
    synthesis by interacting with Csg2p.
  findings:
  - statement: S. cerevisiae CSH1 forms an IPC mannosyltransferase complex with Csg2p.
    supporting_text: These results suggested that two distinct inositol phosphorylceramide
      mannosyltransferase complexes, Csg1p-Csg2p and Csh1p-Csg2p, exist.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct S. cerevisiae CSH1 MIPC-synthesis paper; SGD uses this paper as the
      experimental basis for the GO:0103064 IPC mannosyltransferase activity row that supports
      the proposed ISO annotation for imt3.
- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission yeast Schizosaccharomyces
    pombe.
  findings:
  - statement: Matsuyama et al. generated an S. pombe ORFeome localization resource by YFP-tagging
      nearly the whole fission-yeast proteome.
    supporting_text: we determined the localization of 4,431 proteins
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genome-wide YFP localization screen; PomBase uses the dataset for the SPAC17G8.11c
      Golgi and ER HDA rows.
- id: PMID:20388730
  title: Mannosylinositol phosphorylceramide is a major sphingolipid component and is required for proper
    localization of plasma-membrane proteins in Schizosaccharomyces pombe.
  findings:
  - statement: S. pombe imt1, imt2, and imt3 encode SUR1 homologues collectively required for MIPC synthesis
      from IPC.
    supporting_text: The S. pombe genome has three genes (SPAC2F3.01, SPCC4F11.04c and SPAC17G8.11c)
      that are homologues of SUR1, termed imt1(+), imt2(+) and imt3(+), respectively.
    reference_section_type: ABSTRACT
  - statement: The imt1 imt2 imt3 triple disruptant loses MIPC and accumulates IPC, supporting a role
      for the trio in MIPC biosynthesis.
    supporting_text: MIPC was not detected and IPC levels were increased in the triple disruptant, indicating
      that the three SUR1 homologues are involved in the synthesis of MIPC.
    reference_section_type: ABSTRACT
  - statement: GFP-Imt1p, GFP-Imt2p, and GFP-Imt3p localize to Golgi membranes.
    supporting_text: GFP-tagged Imt1p, Imt2p and Imt3p localized to Golgi apparatus membranes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct S. pombe imt1/imt2/imt3 genetics and localization paper; the cached abstract
      contains the main MIPC-loss and Golgi-localization evidence used here.
- id: PMID:37792890
  title: Elevated levels of sphingolipid MIPC in the plasma membrane disrupt the coordination of cell
    growth with cell wall formation in fission yeast.
  findings:
  - statement: Willet et al. describe Imt1, Imt2 and Imt3 as Golgi mannosyltransferases that form MIPC
      subspecies from IPC.
    supporting_text: Imt3 is one of three highly related mannosyltransferases (the other two being
      Imt1 and Imt2) acting at the Golgi in the final step of the biosynthetic pathway to catalyze
      the formation of the five subspecies of MIPC from IPC
    reference_section_type: RESULTS
  - statement: Willet et al. found that imt3 deletion suppresses the css1-3 growth and cell-wall-material
      accumulation phenotypes, supporting a distinct contribution of Imt3-dependent MIPC subspecies.
    supporting_text: These data also suggest that Imt3-dependent MIPC subspecies are particularly important
      to regulate.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Newer full-text S. pombe MIPC paper; imt3 is assayed in css1-3 suppression experiments,
      but the results support paralog/substrate-species nuance rather than a new downstream GO-process
      annotation for Imt3 itself.
