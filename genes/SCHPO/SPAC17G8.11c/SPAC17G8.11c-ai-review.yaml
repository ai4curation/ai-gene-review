taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPAC17G8.11c (SPAC17G8.11c; imt3; UniProt Q10323) encodes one of three redundant Golgi inositol
  phosphoceramide mannosyltransferases (imt1-imt3; SUR1/CSH1 homologues) that mannosylate IPC to MIPC,
  the terminal and most abundant complex sphingolipid of fission yeast. Single imt mutants are viable,
  but the triple disruptant lacks MIPC and accumulates IPC. It then shows defects in cell and vacuole
  morphology, ergosterol distribution and endocytic sorting of a plasma-membrane amino acid transporter.
existing_annotations:
- term:
    id: GO:0000030
    label: mannosyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - CGD:CAL0000176496
  - PANTHER:PTN001285482
  - SGD:S000000365
  - SGD:S000005978
  - UniProtKB:Q4WDG6
  review:
    summary: PAINT inference of generic mannosyltransferase activity; the specific IPC mannosyltransferase
      activity is the role.
    action: MODIFY
    reason: Correct but general. In S. pombe, MIPC is lost in the imt1 imt2 imt3 triple disruptant
      (PMID:20388730), and UniProt's curated function, tied to that paper (ECO:0000269), states that
      the protein adds mannose to IPC; the PAINT node is seeded by the S. cerevisiae Sur1/Csh1 IPC
      mannosyltransferases. The specific descendant is inositol phosphorylceramide mannosyltransferase
      activity (GO:0103064), not yet carried by the gene. Previously KEEP_AS_NON_CORE, which the rules
      do not allow for a correct-but-general term with a supported descendant. The S. pombe evidence
      is genetic and redundant among the three paralogs, not a direct enzyme assay of Imt3.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN001285482
        source_label: PTN001285482
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Node seeded by S. cerevisiae Sur1/Csh1 and fungal orthologs; S. pombe Imt3 sits inside the
          IPC mannosyltransferase clade, so the activity is inherited, but the propagated term stops at
          the generic mannosyltransferase parent.
      residue_claims_not_applicable: Term-granularity question, not a point-residue argument.
    proposed_replacement_terms:
    - id: GO:0103064
      label: inositol phosphorylceramide mannosyltransferase activity
    supported_by:
    - reference_id: file:SCHPO/SPAC17G8.11c/SPAC17G8.11c-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the addition of mannosyl to inositol phosphoceramide (IPC).
    - reference_id: PMID:20388730
      supporting_text: MIPC was not detected and IPC levels were increased in the triple disruptant, indicating
        that the three SUR1 homologues are involved in the synthesis of MIPC.
