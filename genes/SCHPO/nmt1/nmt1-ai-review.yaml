taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: nmt1 (also called thi3; SPCC1223.02) encodes the fission yeast 4-amino-5-hydroxymethyl-2-methylpyrimidine
  phosphate (HMP-P) synthase of the NMT1/THI5 family. It forms the pyrimidine moiety of thiamine.
  By homology with the biochemically characterised yeast THI5 enzymes, it builds HMP-P from
  pyridoxal 5'-phosphate bound to an active-site lysine and from one of its own histidine residues,
  in an iron-dependent single-turnover reaction. Its transcription is among the highest in the cell
  in thiamine-free medium and is completely repressed by thiamine; this promoter is widely used as a
  regulatable expression system. Deletion causes thiamine auxotrophy. The protein is cytoplasmic (with
  some nuclear signal) and, unlike in S. cerevisiae where four paralogues are redundant, it is
  encoded by a single gene.
