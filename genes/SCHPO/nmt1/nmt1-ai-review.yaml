suggested_questions:
- question: Does S. pombe have an alternative, Nmt1-independent route to HMP under any condition (as
    proposed for anaerobic S. cerevisiae), or is nmt1 deletion auxotrophy absolute?
suggested_experiments:
- description: Reconstitute recombinant Nmt1 with PLP and Fe and measure HMP-P release by LC-MS, testing
    the conserved active-site histidine by mutagenesis, to confirm the THI5-type suicide mechanism in
    S. pombe.
