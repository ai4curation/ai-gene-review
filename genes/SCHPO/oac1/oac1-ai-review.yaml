suggested_questions:
- question: Because leu3 appears to be the only S. pombe IPMS and is mitochondrial, is oac1 essential
    for leucine prototrophy in fission yeast (unlike S. cerevisiae, where cytosolic Leu4 bypasses Oac1)?
suggested_experiments:
- description: Delete oac1 in a prototrophic S. pombe strain and test growth without leucine on fermentable
    and respiratory carbon sources; reconstitute recombinant oac1 in liposomes to measure alpha-IPM, oxaloacetate
    and sulfate exchange.
