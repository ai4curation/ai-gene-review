  label: Schizosaccharomyces pombe 972h-
description: Mitochondrial oxaloacetate/sulfate carrier of fission yeast (SPAC139.02c), a member of the
  mitochondrial carrier (SLC25) family and the ortholog of S. cerevisiae OAC1. By orthology it is an inner-membrane
  antiporter that exchanges dicarboxylates (oxaloacetate, malonate) and sulfur oxoanions (sulfate, thiosulfate).
  It is also expected to export 2-isopropylmalate, made by the mitochondrial 2-isopropylmalate synthase
  leu3, to the cytosol, where the isomerase leu2 and the dehydrogenase leu1 finish leucine synthesis.
  All of its function is inferred from the budding-yeast ortholog; transport by S. pombe oac1 has not
  been measured.
