core_functions:
- description: >-
    Catalytic subunit of a 1,3-beta-glucan synthase at the plasma membrane of growing cell tips
    and the division site. It polymerizes UDP-glucose into linear (1->3)-beta-D-glucan and pushes
    the chain through its transmembrane pore into the cell wall. Bgs3 works in an interdependent
    complex with the GH16 transmembrane protein Ghs2, which is proposed to add beta-1,6-linked
    branches to the nascent Bgs3 chain. Together they are needed for normal branched beta-glucan
    content and wall architecture.
  molecular_function:
    id: GO:0003843
    label: 1,3-beta-D-glucan synthase activity
  directly_involved_in:
