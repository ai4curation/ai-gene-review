  review:
    summary: S. pombe keyword mapping placing Bgs3 in the fungal-type cell wall.
    action: REMOVE
    reason: Bgs3 is a multi-pass integral plasma membrane protein. It makes the cell wall polymer
      but does not reside or act in the wall. Its catalytic GT48 domain is cytosolic and its product
      leaves through the membrane pore. In the 2026 model, Bgs3's extracellular partner Ghs2 is
      anchored to the membrane next to Bgs3, so even the extracellular remodeling step happens at
      the plasma membrane. This keyword-derived location confuses the product's location with the
      enzyme's.
