    Collaboration Between Exomer and Clathrin Adaptors in Fission Yeast.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Abstract-only cache; the abstract does not mention Bgs3. GFP-Bgs3 was presumably
      used as a polarized plasma membrane cargo in the full text. The localization it supports is
      independently confirmed by PMID:12582133 and PMID:42786154.
- id: PMID:42786154
  title: A bipartite glucan synthase-remodeler module organizes branched glucan assembly
    in the fungal cell wall.
  findings:
  - statement: Ghs2 and Bgs3 need each other to localize to cell tips and the division site. Ghs2
      is needed for Bgs3 localization but not for Bgs1, Bgs4 or Ags1, and Ghs2 becomes cytoplasmic
      in the temperature-sensitive bgs3-1 mutant at 36 °C.
    supporting_text: These findings indicate that Ghs2 is specifically required for the proper subcellular
      localization of Bgs3, but not other glucan synthases.
  - statement: HA3-Ghs2 and GFP-Bgs3 co-immunoprecipitate, whereas Ghs2 does not co-immunoprecipitate
      with Bgs4. The two proteins co-localize at tips, the division site and internal puncta.
    supporting_text: HA3-Ghs2 and GFP-Bgs3 co-immunoprecipitated (Fig. 3b), whereas GFP-Ghs2 and
      RFP-Bgs4 did not
  - statement: >-
      A single AlphaFold3 server model (top-ranked model_0 from one seed; no ipTM, pTM, pLDDT or
      PAE values in the main text) places the Ghs2 GH16 domain at the extracellular mouth of the
      Bgs3 glucan-extrusion pore. The model was used to choose interface residues. A five-alanine
      bgs3-5A allele fails to complement bgs3-1, but the paper does not report its expression,
      localization or Ghs2 binding, so loss of function is not specific to the interface. Numbering
      caveats: the text names Bgs3 "I1224", but the mutant list has I1334A and residue 1224 of
      Q9P377 is Thr outside any predicted TM, so "I1224" is probably a typo for I1334. W670/L673 and
      I1334/I1338/L1341 fall in UniProt's predicted TM7 and TM9, which the paper calls helices 6 and
      8 (different helix numbering).
    supporting_text: nor bgs3-5A (W670A, L673A, I1334A, L1341A, I1338A) complemented growth of ghs2-1
      or bgs3-1, respectively
  - statement: bgs3-1 and ghs2-2 cells have similarly thickened walls with large deposits of excess
      wall material, and the double mutant has a stronger phenotype.
    supporting_text: both ghs2-2 and bgs3-1 cells had markedly similar phenotypes with thickened cell
      walls and large pockets of excess wall material along the lateral sides and at the tips
  - statement: Solid-state NMR shows that bgs3-1 reduces mobile beta-1,3,6-branched glucan (by about
      58%) and beta-1,6-glucan (by about 45%), loses rigid beta-1,6-glucan, and has about 8-fold
      more mobile beta-1,3-glucan. This is consistent with Bgs3 being needed for branched-glucan
      architecture rather than for bulk beta-1,3-glucan alone.
    supporting_text: the β-1,3,6-glucopyranose containing branched glucan (BBr) of bgs3-1 and ghs2-2
      was reduced by ~ 58% and ~ 17%, respectively
  - statement: Proposed model in which Bgs3 synthesizes the linear beta-1,3-glucan backbone and
      Ghs2 adds beta-1,6-linked branches. Ghs2 branching activity is inferred from the GH16 domain,
      the effect of mutating its catalytic glutamates, and modeling; it has not been assayed biochemically.
    supporting_text: these findings support a model in which Bgs3 synthesizes
      linear β-1,3-glucan and Ghs2 subsequently introduces β-1,6-linked branch points
      onto the nascent polymer
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached from PMC (PMC13612389). It establishes the Bgs3-Ghs2 partnership
      by co-localization, mutual localization dependence, co-IP, AF3-guided interface mutants,
      TEM and solid-state NMR. Bgs3's own synthase activity is assumed, not assayed. The branching
      chemistry is assigned to Ghs2 by inference.
- id: file:SCHPO/bgs3/bgs3-uniprot.txt
  title: bgs3-uniprot.txt
  findings: []
suggested_questions:
- question: Does Bgs3 have 1,3-beta-glucan synthase activity in vitro on its own, and does Ghs2
    binding change its processivity or product length? The bgs3-1 mutant accumulates more mobile
    beta-1,3-glucan in solid-state NMR (PMID:42786154), so the backbone is still made in the mutant.
- question: Is the Bgs3-Ghs2 assembly a stable stoichiometric complex that GO should represent
    (a synthase-remodeler complex distinct from the 1,3-beta-D-glucan synthase complex), and does
    the analogous Bgs1-Sbg1 pairing justify a shared term?
- question: Why are Bgs3 alone among the four Bgs synthases and Ghs2 mutually dependent for localization,
    and which Bgs3 interface (cytosolic catalytic domain, TM helices 6/8 or extracellular loops)
    drives specificity over Bgs1 and Bgs4?
suggested_experiments:
- description: Reconstitute purified Bgs3 with and without wild-type Ghs2 or catalytic-dead Ghs2-E419A
    in proteoliposomes. Feed UDP-[13C]glucose and analyze the product by linkage analysis or
    solid-state NMR to test directly whether Bgs3 makes linear beta-1,3-glucan and Ghs2 adds
    beta-1,6 branches.
- description: Cryo-EM structure of the native Bgs3-Ghs2 complex to test the AlphaFold3-predicted
    placement of the GH16 domain at the glucan-extrusion pore.
