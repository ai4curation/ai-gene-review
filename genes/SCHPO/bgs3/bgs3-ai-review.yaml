gene_symbol: bgs3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Bgs3 is one of the four Schizosaccharomyces pombe 1,3-beta-glucan synthases (Bgs1-4), large
  multi-pass plasma membrane proteins of glycosyltransferase family 48 (FKS family). Each uses
  cytosolic UDP-glucose to make linear (1->3)-beta-D-glucan chains and pushes them through a
  transmembrane pore into the cell wall. Bgs3 is essential. It localizes to the growing cell
  tips in interphase, to the division site before cytokinesis, to mating projections and to the
  growing pole of germinating spores. Cells depleted of Bgs3 are rounded and have thick walls
  with less beta-glucan and more alpha-glucan. Bgs3 forms a complex with Ghs2, a single-pass
  transmembrane protein with a GH16 glycoside hydrolase/transglycosylase domain, and the two
  proteins need each other to localize. In the AlphaFold3 model of the complex, the Ghs2 GH16
  domain sits at the extracellular mouth of the Bgs3 glucan-extrusion pore. Temperature-sensitive
  bgs3-1 and ghs2-2 mutants have similar thick, irregular walls, and solid-state NMR shows that
  both lose beta-1,3,6-branched glucan and beta-1,6-glucan. These results support a model in
  which Bgs3 makes the linear beta-1,3-glucan backbone and its partner Ghs2 adds the
  beta-1,6-linked branches.
