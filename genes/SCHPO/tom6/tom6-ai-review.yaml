  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
- id: PMID:9774667
  title: >-
    Preprotein translocase of the outer mitochondrial membrane: molecular
    dissection and assembly of the general import pore complex.
  findings:
  - statement: >-
      S. cerevisiae Tom6 promotes stable association of Tom22 with Tom40 during
      assembly of the TOM general import pore complex.
    supporting_text: >-
      Tom6 functions as an assembly factor for Tom22, promoting its stable
      association with Tom40.
- id: file:SCHPO/tom6/tom6-uniprot.txt
  title: UniProt record for S. pombe tom6
  findings:
  - statement: >-
      UniProt describes S. pombe Tom6 as a mitochondrial outer-membrane
      single-pass subunit of the TOM complex, inferred from budding-yeast Tom6.
- id: file:SCHPO/tom6/tom6-deep-research-manual.md
  title: Manual literature review for S. pombe tom6
  findings:
  - statement: >-
      No S. pombe-specific Tom6 mechanistic paper was found; the best primary
      evidence comes from S. cerevisiae Tom6 work.
core_functions:
- description: >-
    Tom6 is inferred to be a TOM-complex small subunit that promotes assembly
    and stability of the Tom40-Tom22 import-pore core. Budding-yeast Tom6 helps
    form, but is not required to maintain, the stable Tom22-Tom40 association.
  supported_by:
  - reference_id: file:SCHPO/tom6/tom6-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: >-
      Tom6 is involved in assembly and stability of the TOM complex.
  - reference_id: PMID:9774667
    supporting_text: >-
      Tom6 is required to promote but not to maintain a stable association
      between Tom22 and Tom40.
