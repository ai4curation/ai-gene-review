id: O13886
gene_symbol: tom6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Tom6 is a small, single-pass mitochondrial outer membrane protein inferred to
  be a conserved subunit of the TOM translocase complex. By analogy with the
  characterized budding-yeast Tom6, it promotes stable TOM core assembly by
  supporting Tom22 association with Tom40 rather than forming the import pore by
  itself.
existing_annotations:
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0172
  review:
    summary: >-
      Correct UniProt-derived localization. The fission-yeast protein is
      inferred from S. cerevisiae Tom6 to be a single-pass TOM complex subunit
      in the mitochondrial outer membrane.
    action: ACCEPT
    reason: >-
      Tom6 is a small Tom family protein whose conserved role is in the
      outer-membrane TOM translocase.
    additional_reference_ids:
    - file:SCHPO/tom6/tom6-deep-research-manual.md
    - file:SCHPO/tom6/tom6-uniprot.txt
    - PMID:9774667
    supported_by:
    - reference_id: file:SCHPO/tom6/tom6-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Mitochondrion outer membrane
- term:
    id: GO:0140596
    label: TOM complex
  evidence_type: ISS
  original_reference_id: PMID:9774667
  qualifier: part_of
  supporting_entities:
  - UniProtKB:P33448
  review:
    summary: >-
      Proposed specific complex membership absent from the current S. pombe
      GOA. UniProt already infers Tom6 membership in the TOM complex from
      budding-yeast Tom6, whose association with the GIP/TOM complex is
      experimentally supported.
    action: NEW
    reason: >-
      The current GOA only places tom6 at the mitochondrial outer membrane.
      Orthology and the curated UniProt record support the more specific
      assertion that the protein is part of the TOM complex.
    additional_reference_ids:
    - file:SCHPO/tom6/tom6-uniprot.txt
    - PMID:9774667
    supported_by:
    - reference_id: file:SCHPO/tom6/tom6-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: >-
        Forms part of the TOM (translocase of outer membrane) complex that
        consists of 7 different transmembrane proteins Tom5, Tom6, Tom7, Tom20,
        Tom22, Tom40 and Tom70.
    - reference_id: PMID:9774667
      reference_section_type: ABSTRACT
      supporting_text: >-
        Besides the essential proteins Tom22 and Tom40, the GIP complex contains
        three small subunits, Tom5, Tom6, and Tom7.
- term:
    id: GO:0070096
    label: mitochondrial outer membrane translocase complex assembly
  evidence_type: ISS
  original_reference_id: PMID:9774667
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P33448
  review:
    summary: >-
      Proposed process annotation inferred from budding-yeast Tom6. The
      characterized ortholog promotes assembly of the TOM import pore by
      stabilizing Tom22 association with Tom40.
    action: NEW
    reason: >-
      S. pombe Tom6 has no direct experimental process annotation, but the
      curated UniProt record already identifies Tom6 as a conserved TOM
      assembly/stability factor by orthology to S. cerevisiae.
    additional_reference_ids:
    - file:SCHPO/tom6/tom6-uniprot.txt
    - PMID:9774667
    supported_by:
    - reference_id: file:SCHPO/tom6/tom6-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Tom6 is involved in assembly and stability of the TOM complex.
    - reference_id: PMID:9774667
      reference_section_type: ABSTRACT
      supporting_text: >-
        Tom6 functions as an assembly factor for Tom22, promoting its stable
        association with Tom40.
references:
