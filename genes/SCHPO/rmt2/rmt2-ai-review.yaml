core_functions:
- description: >-
    rmt2 is inferred to catalyze S-adenosyl-L-methionine-dependent N5/delta
    methylation of arginine residues in proteins. Q10170 belongs to the fungal
    Rmt2 clade, separated from the vertebrate GAMT branch, and by conservation
    the likely fission-yeast substrate is ribosomal protein L12/Rpl12.
