id: Q10170
gene_symbol: rmt2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  rmt2 encodes the fission-yeast ortholog of fungal Rmt2 type IV protein
  arginine methyltransferases. The protein has an N-terminal ankyrin-repeat
  region and a C-terminal RMT2 SAM-dependent methyltransferase domain. Its
  closest experimentally characterized fungal ortholog is budding-yeast Rmt2,
  which monomethylates ribosomal protein L12/Rpl12 at an arginine residue; the
  fission-yeast protein has been detected in the nucleus and cytosol in a
  proteome-scale YFP localization survey.
