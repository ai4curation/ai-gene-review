suggested_questions:
- question: >-
    Does fission-yeast rmt2 monomethylate Rpl12 at the arginine residue
    orthologous to budding-yeast Rpl12 Arg67, and does it have additional
    protein substrates?
- question: >-
    Does rmt2 deletion perturb fission-yeast 60S subunit maturation or
    translational fidelity, as expected from the budding-yeast RMT2 phenotype?
- question: >-
    Is the nuclear pool of fission-yeast rmt2 involved in methylating newly
    assembled Rpl12 before ribosomal-subunit export?
suggested_experiments:
- hypothesis: >-
    SPAC26A3.17c is the methyltransferase for the conserved arginine methyl mark
    on fission-yeast Rpl12.
  description: >-
    Compare Rpl12 methylation by targeted mass spectrometry in wild-type,
    rmt2 deletion, and catalytically inactive rmt2 strains, with peptide
    standards that distinguish the Set11-dependent lysine mark from N5-arginine
    methylation.
- hypothesis: >-
    The inferred Rpl12 methylation activity of rmt2 contributes to ribosome
    performance in fission yeast.
  description: >-
    Assay polysome profiles, 60S/40S ratios, stop-codon readthrough, programmed
    frameshifting, and growth phenotypes in rmt2-null and rescued strains to
    determine whether the homology-inferred methyltransferase activity has the
    same ribosome-biogenesis and translation-fidelity consequences seen in
    budding yeast.
