knowledge_gaps:
- gap_statement: >-
    The specific molecular activity of Pam17 within the TIM23/PAM import
    machinery has not been assigned. Its component and import-process roles are
    conserved, but a direct adaptor, gating, or regulatory activity has not been
    captured as a GO molecular function.
  boundary: >-
    S. cerevisiae studies show that Pam17 is a membrane TIM23/PAM coupling
    factor that interacts with Tim23 and is recruited early during matrix
    import; they do not assign an autonomous catalytic or transporter activity.
  gap_kind:
  - BIOLOGY
  status: OPEN
  dark_aspect: MF_DARK
  significance: >-
    Resolving the Pam17 molecular activity would explain how this small
    inner-membrane component controls handoff from the TIM23 channel to PAM.
  resolution: >-
    Reconstitute Pam17 with the Tim23 channel and candidate PAM subunits to
    test whether it directly gates the channel or acts as an adaptor for import
    motor recruitment.
  provenance:
  - reference_id: file:genes/SCHPO/pam17/pam17-notes.md
    supporting_text: >-
      No S. pombe paper assigns pam17 an autonomous molecular activity.
