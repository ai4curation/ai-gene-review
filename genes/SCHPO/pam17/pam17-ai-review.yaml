  label: Schizosaccharomyces pombe 972h-
description: >-
  pam17 encodes a predicted two-pass inner mitochondrial membrane protein of the
  conserved Pam17 family. By orthology to S. cerevisiae Pam17, it is inferred to
  act as a non-catalytic regulatory subunit of the presequence
  translocase-associated motor, coupling the TIM23 presequence translocase to
  PAM during protein import into the mitochondrial matrix.
