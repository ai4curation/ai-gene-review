- term:
    id: GO:0008860
    label: ferredoxin-NAD+ reductase activity
  evidence_type: IDA
  original_reference_id: PMID:18399988
  qualifier: enables
  review:
    summary: Ferredoxin reduction with NADH measured in vitro; NADPH is the physiological donor.
    action: KEEP_AS_NON_CORE
    reason: S. pombe experiment. Recombinant Arh1 (the FAD-stabilised A18G variant) accepted electrons
      from NADH as well as NADPH in vitro, so NADH-dependent ferredoxin reduction is real; UniProt
      curates NADPH as the donor (by similarity to S. cerevisiae Arh1, P48360), so the NADH activity
      is kept as non-core.
    supported_by:
    - reference_id: PMID:18399988
      supporting_text: was shown to be capable of accepting electrons with no evident preference for NADH
        or NADPH, respectively.
