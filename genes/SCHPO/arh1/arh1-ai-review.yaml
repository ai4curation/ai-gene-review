  review:
    summary: 'Transfer from S. cerevisiae ARH1: the Arh1-Yah1 ferredoxin system supplies electrons to
      the Coq6 hydroxylase.'
    reason: PomBase ISO (GO_REF:0000024). UniProt's curated FUNCTION (by similarity to S. cerevisiae Arh1
      (UniProtKB:P48360)) states the reductase is essential for coenzyme Q biosynthesis, probably by supplying
      electrons to the Coq6 hydroxylase; this is ortholog evidence, not tested in S. pombe. (The GOA row
      lists a Drosophila ortholog as its source.) In S. cerevisiae the Arh1-Yah1 chain is required for
      Coq6 C5 hydroxylation (accepted IMP in the ARH1 review); the reductase supplies the reducing equivalents
      the hydroxylation step depends on, so it does part of the work (cofactor-supply role). Not tested
      in S. pombe; accepted on ortholog grounds, matching the module's ferredoxin-system part.
    action: ACCEPT
    supported_by:
    - reference_id: file:SCHPO/arh1/arh1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Essential for coenzyme Q biosynthesis. May be involved in the electron transfer
        required for the hydroxylation reaction performed by coq6.
    - reference_id: file:SCHPO/arh1/arh1-uniprot.txt
      record_section:
