  review:
    summary: 'Curator inference: the ferredoxin reductase-ferredoxin chain supplies electrons for mitochondrial
      Fe-S cluster assembly.'
    reason: Curator inference (IC, GO_REF:0000111). UniProt's curated FUNCTION (by similarity to S. cerevisiae
      Arh1 (UniProtKB:P48360)) says the reductase is required for de novo Fe-S cluster synthesis on isu1
      and delivers electrons for Fe-S cluster synthesis; the IC follows from the ferredoxin reductase
      activity shown for S. pombe arh1 (PMID:18399988). It is an electron supplier to the assembly machinery,
      not a scaffold. It supplies the electrons the assembly step depends on (cofactor-supply participation).
    action: ACCEPT
