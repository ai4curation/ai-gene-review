id: O59710
gene_symbol: arh1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: arh1 encodes the fission yeast mitochondrial adrenodoxin reductase-like flavoprotein, an
  FAD-containing NAD(P)H:ferredoxin reductase of the ferredoxin-NADP reductase type 1 family, associated
  with the matrix side of the inner membrane by homology. It transfers electrons from NADPH to the adrenodoxin-like
  ferredoxin domain of Etp1 (Etp1fd). By homology with S. cerevisiae Arh1, this electron transfer chain
  supports mitochondrial iron-sulfur cluster assembly, heme A synthesis and the Coq6 hydroxylation in
  coenzyme Q synthesis. Recombinant Arh1 binds FAD weakly, accepts electrons from both NADH and NADPH,
  and with Etp1fd can drive human mitochondrial cytochrome P450 reactions.
