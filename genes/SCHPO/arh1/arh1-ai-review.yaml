- term:
    id: GO:0099128
    label: mitochondrial [2Fe-2S] assembly complex
  evidence_type: TAS
  original_reference_id: PMID:34660592
  qualifier: part_of
  review:
    summary: TAS from a review of Fe-S biogenesis; the review lists ferredoxin (Yah1) among the [2Fe-2S]
      assembly components and the NADPH-FDXR-FDX2 chain as electron supply, not the reductase as a complex
      subunit.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:34660592
      supporting_text: This process required the presence of IBA57 and the electron transfer chain NADPH-FDXR-FDX2
    - reference_id: file:SCHPO/arh1/arh1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Involved in electron delivery for Fe-S cluster synthesis.
    reason: PMID:34660592 (full text cached) is a general review. It places ferredoxin in the mitochondrial
      ISC assembly machinery as the electron donor and mentions the NADPH-FDXR-FDX2 electron transfer
      chain, but does not describe the ferredoxin reductase as a subunit of the [2Fe-2S] assembly complex.
      Arh1 is better described as supplying electrons to that complex via Etp1fd, which the accepted GO:0044571
      row captures. The membership claim over-reaches; not removed because the curator may intend a looser
      sense of the complex.
