description: arh1 (SPBC3B8.01c; UniProt O59710) encodes the mitochondrial adrenodoxin reductase-like ferredoxin-NADP+
  reductase (EC 1.18.1.2), an FAD flavoprotein that transfers electrons from NADPH to the adrenodoxin-like
  ferredoxin domain of Etp1. The Arh1-ferredoxin chain supplies electrons for mitochondrial [2Fe-2S] cluster
  assembly and, by analogy to S. cerevisiae, for the Coq6 hydroxylase in CoQ synthesis. It also supports
  human mitochondrial P450s expressed in S. pombe.
