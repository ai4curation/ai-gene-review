  label: Schizosaccharomyces pombe 972h-
description: hem2 (SPAC1805.06c; UniProt P78974) encodes porphobilinogen synthase (5-aminolevulinate dehydratase,
  ALAD; EC 4.2.1.24), a zinc-dependent homooctameric cytosolic enzyme. It condenses two molecules of 5-aminolevulinate,
  made in mitochondria by hem1, into the monopyrrole porphobilinogen. This is the second step of heme
  biosynthesis. Function and cytosolic location are assigned by orthology to S. cerevisiae HEM2 and the
  ALAD family, and the location is supported by a genome-wide localisation screen.
