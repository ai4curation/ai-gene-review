  review:
    summary: InterPro2GO mapping (IPR001731 ALAD). Porphobilinogen is the common monopyrrole
      precursor of all tetrapyrroles.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: file:SCHPO/hem2/hem2-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Porphyrin-containing compound metabolism; protoporphyrin-IX biosynthesis;
        coproporphyrinogen-III from 5-aminolevulinate: step 1/4.'
    reason: 'Correct and as precise as warranted for this step: the product of this enzyme is a common
      precursor of all tetrapyrroles (heme and siroheme), so tetrapyrrole biosynthesis is not a mere restatement
      of heme biosynthesis. Kept as non-core because the core function is assigned to the heme pathway.'
