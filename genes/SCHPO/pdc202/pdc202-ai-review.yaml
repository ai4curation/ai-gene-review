suggested_questions:
- question: Is Pdc202 protein made mainly during sporulation, and does it contribute to spore metabolism
    or viability?
- question: Should pdc202 and pdc201 carry the same process term (pyruvate fermentation vs pyruvate fermentation
    to ethanol) for consistency?
suggested_experiments:
- description: Quantify Pdc202 protein by targeted proteomics during meiosis and sporulation, and test
    spore germination and viability of pdc202 null spores.
