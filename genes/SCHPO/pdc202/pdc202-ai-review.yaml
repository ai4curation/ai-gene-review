taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Pdc202 is a pyruvate decarboxylase of Schizosaccharomyces pombe with family-supported thiamine
  diphosphate/Mg2+-dependent conversion of pyruvate to acetaldehyde and carbon dioxide. It is associated
  with the cytosol and also has a recorded nuclear pool. Phx1 promotes its stationary-phase transcription;
  deletion decreases long-term viability and overexpression improves survival. These findings support
  a stationary-phase fermentative contribution without establishing purified-enzyme kinetics or the size
  of its contribution to total pathway flux.
