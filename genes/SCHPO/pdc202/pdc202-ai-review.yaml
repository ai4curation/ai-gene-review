  label: Schizosaccharomyces pombe 972h-
description: pdc202 (SPAC13A11.06) encodes a stationary-phase and meiotic pyruvate decarboxylase (EC 4.1.1.1),
  a thiamine diphosphate- and Mg2+-dependent cytosolic enzyme that would convert pyruvate to acetaldehyde
  and CO2. It groups with S. cerevisiae PDC1/PDC5/PDC6 and with its paralog pdc201. Its transcript rises
  about 50-fold in stationary phase under control of the transcription factor Phx1 and increases strongly
  during late meiosis and spore formation, although the protein has not been detected in quantitative
  proteomics of vegetative or quiescent cells. Deletion of pdc202 lowers and overexpression raises long-term
  viability in stationary phase. UniProt calls the entry PDC1_SCHPO, which is not the fission-yeast gene
  pdc1 (an mRNA decapping scaffold).
