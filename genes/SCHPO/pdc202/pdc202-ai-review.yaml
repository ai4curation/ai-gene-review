core_functions:
- description: Thiamine diphosphate/Mg2+-dependent decarboxylation of pyruvate to acetaldehyde and CO2
    in the cytosol, supplying acetaldehyde for ethanol fermentation in stationary phase and meiosis under
    Phx1 control.
