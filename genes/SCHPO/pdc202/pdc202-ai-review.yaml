    supporting_text: Expression of pdc201+ and pdc202+ genes increased markedly during stationary phase,
      by about 500-fold and 50-fold, respectively.
  - reference_id: PMID:25102102
    supporting_text: the Δpdc201 and Δpdc202 mutations reduced cell viability in the stationary phase
  - reference_id: PMID:25102102
    supporting_text: overproduction of either Pdc201 or Pdc202 increased the long-term viability of both
      the wild type and Δphx1 mutant
suggested_questions:
- question: Is Pdc202 protein made mainly during sporulation, and does it contribute to spore metabolism
    or viability?
- question: Should pdc202 and pdc201 carry the same process term (pyruvate fermentation vs pyruvate fermentation
    to ethanol) for consistency?
suggested_experiments:
- description: Quantify Pdc202 protein by targeted proteomics during meiosis and sporulation, and test
    spore germination and viability of pdc202 null spores.
