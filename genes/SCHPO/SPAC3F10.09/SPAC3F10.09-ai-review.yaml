  label: Schizosaccharomyces pombe 972h-
description: SPAC3F10.09 (UniProt Q10184; the fission yeast HIS6 ortholog) encodes ProFAR isomerase (HisA;
  EC 5.3.1.16). It carries out the Amadori rearrangement of 5'-ProFAR to 5'-PRFAR, step 4 of histidine
  biosynthesis. Function is assigned by orthology to S. cerevisiae HIS6 and the HisA/HisF family; a genome-wide
  screen places it in the cytosol.
