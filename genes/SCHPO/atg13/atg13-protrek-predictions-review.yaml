description: >-
  ProTrek sequence-to-text retrieval for Atg13, the scaffolding hub of the Atg1 initiation complex.
  Ranks 1, 2 and 3 are all exact GOA matches - the Atg1/ULK1 kinase complex at 20.35, piecemeal microautophagy
  of the nucleus, and the phagophore assembly site - so the model recovers the complex, a process
  and the location. The molecular adaptor activity that this review names as the core function is
  not retrieved, which is the recurring blind spot for non-catalytic scaffolds. Assessment: 3 correct
  not novel (CNN).
