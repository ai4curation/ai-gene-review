  qualifier: enables
  review:
    summary: Gaynor and Greenberg (1992) measured CDP-DG synthase activity in S. pombe membrane extracts and its
      regulation by growth phase, inositol and choline. The work predates cloning of SPBC13A2.03, so the activity
      is attributed to bbl1 as the only ER CDS-family gene in the genome; Cds1/bbl1 loss-of-function later confirmed
      this (PMID:25318672).
    action: ACCEPT
    reason: Core catalytic activity; extract assay consistent with later gene-level evidence. Abstract-only, deferring
      to the PomBase curator.
    supported_by:
    - reference_id: PMID:1324908
      supporting_text: the membrane-associated phospholipid biosynthetic enzymes CDP-DG synthase, phosphatidylglycerolphosphate
        (PGP) synthase
    - reference_id: PMID:25318672
      supporting_text: The CDP-DG synthase activity was markedly decreased in cds1-9 cells at 36°C (Figure 5B).
