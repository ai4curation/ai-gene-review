suggested_questions:
- question: Does bbl1 supply CDP-DAG to the nuclear envelope/inner nuclear membrane pool as well as peripheral ER,
    and how is PI versus PS synthesis apportioned?
suggested_experiments:
- description: Purify or reconstitute SPBC13A2.03 and measure kinetic parameters and acyl-chain preferences for
    PA, comparing wild type with the P363S (bbl1) and cds1-9 variants.
