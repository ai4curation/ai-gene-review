  label: Schizosaccharomyces pombe 972h-
description: bbl1 (SPBC13A2.03) encodes the endoplasmic reticulum CDP-diacylglycerol synthase of Schizosaccharomyces
  pombe, the ortholog of S. cerevisiae Cds1 (CTP:phosphatidate cytidylyltransferase, EC 2.7.7.41). This multi-pass
  ER membrane protein converts phosphatidic acid and CTP to CDP-diacylglycerol, the activated lipid donor for phosphatidylserine
  and phosphatidylinositol synthesis, and so sits at the branch point between the CDP-DAG route of membrane phospholipid
  synthesis and the diacylglycerol route to triacylglycerol. Reduced activity (cds1-9/bbl1 alleles) diverts PA into
  triacylglycerol and produces large ER-associated lipid droplets. Mitochondrial CDP-DAG for cardiolipin synthesis
  is made by the unrelated enzyme tam41. The gene is named bbl1 ("bubble") in PomBase because the symbol cds1 is
  used in S. pombe for the checkpoint kinase.
