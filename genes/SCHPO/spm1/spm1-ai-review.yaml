id: Q92398
gene_symbol: spm1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'Spm1, also called Pmk1, is the mitogen-activated protein kinase that acts as the terminal kinase of the fission-yeast Mkh1-Skh1/Pek1-Spm1 cell-integrity MAPK cascade. Activated by Skh1/Pek1-dependent phosphorylation, Spm1 signals from the cytoplasm, nucleus, and cell-division site to regulate cell wall integrity, cell wall remodeling, cytokinesis and septum organization, ion homeostasis through Yam8/Cch1-dependent calcium influx, and stress or nutrient crosstalk with Atf1, TORC2-Gad8, and cytokinesis regulators.'
core_functions:
- description: MAP kinase activity as the terminal kinase of the Mkh1-Skh1/Pek1-Spm1 cell-integrity MAPK cascade, activated by the Skh1/Pek1 MAPKK and acting in the cytoplasm, nucleus, and division area to regulate cell wall integrity and cytokinesis.
