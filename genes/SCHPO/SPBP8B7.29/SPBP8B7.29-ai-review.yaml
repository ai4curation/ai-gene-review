  - UniProtKB:Q5AYT0
  review:
    summary: PAINT inference; ADC synthase is the first step of 4-aminobenzoate (pABA) synthesis from
      chorismate.
    action: ACCEPT
    reason: 'UniProt''s by-similarity function note (ECO:0000250; orthology to S. cerevisiae Abz1, not an S. pombe experiment) states that ADC synthesis is required for 4-aminobenzoate (PABA) synthesis; ADC synthase performs the first of the two steps from chorismate.'
    supported_by:
    - reference_id: file:SCHPO/SPBP8B7.29/SPBP8B7.29-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Catalyzes the biosynthesis of 4-amino-4-deoxychorismate (ADC) from chorismate and glutamine.'
    - reference_id: file:SCHPO/SPBP8B7.29/SPBP8B7.29-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'aminobenzoate (PABA), an important component in tetrahydrofolate'
