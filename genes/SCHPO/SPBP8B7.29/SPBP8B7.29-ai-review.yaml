  - PANTHER:PTN002599721
  - SGD:S000005316
  - UniProtKB:Q6TAS3
  review:
    summary: PAINT inference from ABZ1/PabAB orthologs; sound.
    action: ACCEPT
    reason: 'No S. pombe assay exists. UniProt''s function note is by similarity (ECO:0000250) to characterised ADC synthases (e.g. S. cerevisiae Abz1), and the protein is classified in the fungal PabB family (NCBIfam TIGR01823) and the PANTHER aminodeoxychorismate synthase subfamily, with a glutamine amidotransferase domain and its catalytic residues; family membership supports the activity.'
