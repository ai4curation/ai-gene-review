    - reference_id: file:SCHPO/SPBP8B7.29/SPBP8B7.29-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Catalyzes the biosynthesis of 4-amino-4-deoxychorismate (ADC) from chorismate and glutamine.'
