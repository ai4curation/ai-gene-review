description: SPBP8B7.29 (UniProt O94277; the fission yeast ABZ1 ortholog) encodes 4-amino-4-deoxychorismate
  synthase (EC 2.6.1.85), a glutamine amidotransferase that aminates chorismate to 4-amino-4-deoxychorismate,
  the first step of 4-aminobenzoate synthesis for folate. Function is assigned by orthology; it is cytosolic
  in a genome-wide screen.
