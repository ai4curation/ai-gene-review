- id: PMID:29529046
  title: Zinc transporters belonging to the Cation Diffusion Facilitator (CDF) family have complementary
    roles in transporting zinc out of the cytosol.
  findings:
  - statement: Cis4 localizes to the cis-Golgi membrane.
    supporting_text: 'Cis4 and Zrg17 form a heterodimeric complex that

      transports zinc into the cis-Golgi.'
  - statement: Cis4/Zrg17 removes zinc from the cytosol mainly under zinc deficiency, whereas Zhf1 acts
      when zinc is replete.
    supporting_text: 'deletion of cis4 or

      zrg17 leads to higher levels of zinc accumulating in the cytosol under

      conditions of zinc deficiency'
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Cytosolic ZapCY1/ZapCY2 FRET sensor measurements in cis4, zrg17 and
      zhf1 deletion strains directly ground the zinc substrate and cytosol-to-secretory-pathway direction.
      The transport activity is inferred from cellular zinc distribution, not from a reconstituted assay.
