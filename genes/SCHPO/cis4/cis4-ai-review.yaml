suggested_questions:
- question: Does Cis4 itself carry the zinc-binding transport site, or is Zrg17 (or both) the translocating
    subunit in the Cis4/Zrg17 heteromer, as debated for the mammalian ZnT5/ZnT6 pair?
- question: Is there a functional ER pool of Cis4 (as for the budding-yeast Msc2/Zrg17 complex), or is
    the UniProt ER membrane location solely a reflection of ER-Golgi cycling?
- question: Which cis-Golgi lumenal zinc-dependent clients (e.g. phosphatases, GPI-anchor remodelling
    enzymes) require Cis4-supplied zinc?
suggested_experiments:
- description: Reconstitute purified Cis4/Zrg17 in proteoliposomes and measure zinc flux and proton
    coupling, with conserved transmembrane His/Asp site mutants in each subunit.
- description: Measure lumenal Golgi and ER zinc with organelle-targeted zinc FRET sensors in cis4 and
    zrg17 deletion strains under zinc-limited conditions.
