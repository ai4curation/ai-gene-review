id: Q9HGQ3
gene_symbol: cis4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Cis4 is a CDF-family zinc transporter that forms a heteromeric complex with Zrg17 in the
  cis-Golgi membrane. It transfers zinc from the cytosol into the secretory pathway, particularly under
  zinc-limiting conditions, and thereby supports intracellular zinc balance and Golgi-dependent protein
  trafficking. Its compartment and low-zinc role differ from the ER zinc transporter Zhf1.
