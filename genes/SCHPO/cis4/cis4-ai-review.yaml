  label: "Schizosaccharomyces pombe 972h-"
description: Cis4 is a 732-residue multi-pass membrane protein of the cation diffusion facilitator (CDF)
  family, related to budding-yeast Msc2 and animal ZnT5/ZnT7 secretory-pathway zinc transporters, with
  about 14 predicted transmembrane helices including an N-terminal extension in front of the conserved
  CDF transport core. It localizes to the cis-Golgi and physically associates with a second CDF protein,
  Zrg17, and the two proteins act as a heteromeric unit that moves zinc out of the cytosol into the
  early secretory pathway. This activity matters chiefly under zinc limitation, when cis4 or zrg17
  deletion raises labile cytosolic zinc; in zinc-replete cells the ER-localized CDF transporter Zhf1
  dominates zinc removal from the cytosol. Loss of Cis4 causes zinc-suppressible defects attributed to
  impaired membrane trafficking, including a weak cell wall, reduced acid phosphatase secretion,
  sensitivity to FK506 and MgCl2, and synthetic growth defects with Golgi/endosome trafficking mutants,
  consistent with Golgi lumenal zinc being needed for normal secretory-pathway function. Transport
  coupling, stoichiometry and the lumenal zinc clients are not established.
