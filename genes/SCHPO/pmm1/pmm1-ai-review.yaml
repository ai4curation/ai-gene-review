suggested_questions:
- question: >-
    Is pmm1 essential in S. pombe, and does a pmm1 hypomorph show the glycosylation and cell-wall defects
    of mpg1 mutants?
suggested_experiments:
- description: >-
    Assay recombinant pmm1 for mannose-1-phosphate/mannose-6-phosphate interconversion and glucose-1,6-bisphosphate
    dependence, and test complementation of S. cerevisiae sec53-ts.
