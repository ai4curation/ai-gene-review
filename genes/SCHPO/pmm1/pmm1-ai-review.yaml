  label: Schizosaccharomyces pombe 972h-
description: >-
  pmm1 (SPAC1556.07) is the fission yeast phosphomannomutase, a cytosolic member of the eukaryotic

  PMM branch of the haloacid dehalogenase (HAD) superfamily. It interconverts D-mannose 6-phosphate and

  alpha-D-mannose 1-phosphate, physiologically producing mannose 1-phosphate from the

  phosphomannose isomerase (pmi40) product so that mpg1 can form GDP-mannose. GDP-mannose and the

  dolichol-phosphate-mannose derived from it are the mannosyl donors for N-glycan, O-mannosyl and GPI

  anchor synthesis and for cell-wall galactomannan. The activity and location are inferred from the

  conserved HAD PMM catalytic motif and from the characterized orthologs budding-yeast Sec53 and human

  PMM2; no S. pombe-specific biochemistry has been reported.
