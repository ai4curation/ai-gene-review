suggested_questions:
- question: Does S. pombe Tim50 retain only receptor and channel-gating functions, or are there fission-yeast-specific roles for its phosphatase-like domain?
  experts: []
suggested_experiments:
- hypothesis: The large intermembrane-space domain of S. pombe Tim50 is required for presequence handoff from TOM to Tim23.
  description: >-
    Complement a conditional tim50 strain with point mutants in conserved
    receptor-domain surfaces, then measure TIM23 complex assembly and import of
    matrix-destined and TIM23-SORT reporters in isolated mitochondria.
