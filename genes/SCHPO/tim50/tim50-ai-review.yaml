id: O13636
gene_symbol: tim50
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  tim50 encodes the conserved Tim50 receptor/gatekeeper subunit of the
  mitochondrial TIM23 presequence translocase. Tim50 is a single-pass inner
  mitochondrial membrane protein whose large intermembrane-space domain binds
  incoming presequences, promotes handoff from the TOM complex to Tim23, and
  gates the Tim17/Tim23 channel during TIM23-dependent import into the matrix or
  lateral sorting into the inner membrane.
