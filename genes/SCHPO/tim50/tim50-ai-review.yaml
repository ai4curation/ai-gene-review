  review:
    summary: >-
      Wrong compartment inferred from a correct complex annotation. TIM23 is an
      inner-membrane complex, and the Tim50 receptor domain acts from the
      intermembrane-space side of a single-pass inner-membrane protein.
    action: MODIFY
    reason: >-
      Repoint the matrix IC row to mitochondrial inner membrane. Tim50 carries a
      cleaved targeting peptide, a single transmembrane anchor, an N-terminal
      matrix-side segment, and the large functional C-terminal domain in the
      intermembrane space; it is not a soluble matrix protein.
    proposed_replacement_terms:
