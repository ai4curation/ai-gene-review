gene_symbol: arg1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: arg1 (SPCC777.09c) encodes the mitochondrial acetylornithine aminotransferase (EC 2.6.1.11)
  of S. pombe, a pyridoxal-phosphate-dependent class-III aminotransferase orthologous to S. cerevisiae
  ARG8. In the mitochondrial matrix it transfers the amino group from L-glutamate to N-acetyl-L-glutamate
  5-semialdehyde (physiological direction; the reaction is written in reverse in EC/Rhea), forming N2-acetyl-L-ornithine,
  the fourth step of the acetylated ornithine pathway. arg1 deletion or mutation causes arginine auxotrophy,
  and arg1 is required for mitochondrial ornithine synthesis, which also feeds ornithine to siderophore
  (ferrichrome) production under iron limitation. Note that S. pombe arg1 is not the ortholog of S. cerevisiae
  ARG1 (argininosuccinate synthase, which in S. pombe is arg12).
existing_annotations:
- term:
    id: GO:0000050
    label: urea cycle
  evidence_type: EXP
  original_reference_id: PMID:20435771
  qualifier: involved_in
  review:
    summary: PomBase EXP from Mercier & Labbe 2010 (PMID:20435771), a study of iron-dependent ornithine
      supply for ferrichrome synthesis, showing arg1 is required for mitochondrial ornithine synthesis
      and that arg1 car1 car3 cells lacking all ornithine sources are sensitive to iron starvation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The paper establishes arg1 as necessary for de novo ornithine (and hence arginine) synthesis.
      Acetylornithine transamination occurs upstream of ornithine and is not a reaction of the urea cycle
      (ornithine to citrulline to argininosuccinate to arginine to ornithine plus urea); the defensible
      process terms are L-arginine and L-ornithine biosynthesis.
    supported_by:
    - reference_id: PMID:20435771
      supporting_text: which encodes an acetylornithine aminotransferase essential to mitochondrial ornithine
        production
    - reference_id: PMID:20435771
      supporting_text: Mitochondrial and cytosolic ornithine synthesis was abolished by inactivation of
        the arg1 + gene in the car1Δ car3Δ double mutant strain.
