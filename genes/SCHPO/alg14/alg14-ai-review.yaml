  label: Schizosaccharomyces pombe 972h-
description: alg14 (SPAC5D6.06c; UniProt O14199) encodes the membrane anchor subunit Alg14 of the UDP-GlcNAc
  transferase, which recruits the catalytic subunit Alg13 to the ER membrane for addition of the second
  GlcNAc to GlcNAc-PP-dolichol. In the cytoplasmic phase of dolichol-linked oligosaccharide (Glc3Man9GlcNAc2-PP-Dol)
  assembly on the ER membrane, it adds the next sugar to the growing precursor that oligosaccharyltransferase
  transfers to nascent glycoproteins. Function is assigned by orthology to the S. cerevisiae ALG enzymes.
