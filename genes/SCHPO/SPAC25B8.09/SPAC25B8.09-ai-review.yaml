  review:
    summary: Trans-aconitate methyltransferase activity is supported as a curated orthology inference.
    action: ACCEPT
    reason: PomBase’s ISO assignment explicitly traces to TMT1/SGD:S000000977, whose enzyme activity is
      experimentally characterized. Accept the molecular capability as a reasonable orthology inference
      while distinguishing it from a target assay or the claim that trans-aconitate is the dominant endogenous
      substrate.
    supported_by:
