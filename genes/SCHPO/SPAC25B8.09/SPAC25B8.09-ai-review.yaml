suggested_questions:
- question: Are SPAC25B8.09 and SPAC25B8.10 co-orthologs of Tmt1, of Crg1, or of neither? A tree of
    PTHR44942:SF4 fungal members with outgroups would determine whether the trans-aconitate ISO transfer
    from Tmt1 is phylogenetically justified.
- question: PANTHER 19.0 places Q9UTA9 in PTHR42912:SF95 while UniProt and the family review use PTHR44942:SF4;
    which placement is correct, and is the paralog SPAC25B8.10 classified consistently?
suggested_experiments:
- description: Assay recombinant SPAC25B8.09 and SPAC25B8.10 with SAM against trans-aconitate, 3-isopropylmalate,
    and a broader acceptor panel (SAH-detection assay), and compare methyl-ester metabolites in wild type
    versus the single and double deletion strains.
