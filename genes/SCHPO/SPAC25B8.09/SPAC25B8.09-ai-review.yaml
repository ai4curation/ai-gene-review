    action: MARK_AS_OVER_ANNOTATED
    reason: In budding yeast, Tmt1 is transcriptionally induced by amino acid starvation via Gcn4, and its
      product 3-isopropylmalate methyl ester was proposed to signal haploid invasive growth. Induction is
      an expression response rather than evidence that the enzyme executes the starvation response, and
      the invasive-growth signalling is a Saccharomyces-specific physiology. For SPAC25B8.09, one-to-one
      orthology to TMT1 is not resolved (the two fission-yeast SF4 paralogs are about equidistant from
      Tmt1 and Crg1), so a donor-specific process cannot be transferred with confidence. No fission-yeast
      data link this gene to the starvation response.
