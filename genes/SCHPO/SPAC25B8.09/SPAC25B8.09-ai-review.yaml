description: >-
  SPAC25B8.09 encodes a 251-residue soluble class I (Rossmann-fold) S-adenosylmethionine-dependent
  methyltransferase of the methyltransferase type-11 (Pfam PF08241) group, observed in both the
  cytosol and the nucleus of fission yeast. It is one of a tandem pair of closely related paralogs
  (with SPAC25B8.10, about 68% identical) in the same PANTHER subfamily as budding-yeast Tmt1, a
  small-molecule carboxyl methyltransferase that esterifies trans-aconitate and 3-isopropylmalate,
  and Crg1. The fission-yeast pair is roughly equidistant from Tmt1 and Crg1, and the subfamily
  also contains fungal natural-product O-methyltransferases, so the methyl acceptor of SPAC25B8.09
  and its physiological role have not been established. No gene-specific biochemical or genetic
  study has been reported.
