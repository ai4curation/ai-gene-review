taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: SPAC25B8.09 is a soluble methyltransferase type-11 protein found in the nucleus and cytosol.
  PomBase assigns trans-aconitate methyltransferase activity through curated orthology to budding-yeast
  Tmt1. This supports a probable small-molecule methyltransferase, while the predominant endogenous substrate
  and physiological role in fission yeast remain untested. Budding-yeast Tmt1 also methylates 3-isopropylmalate,
  so trans-aconitate detoxification is not the only plausible metabolic context.
