    summary: Plausible but not established; the acceptor specificity of this SF4 member is unresolved.
    action: UNDECIDED
    reason: Tmt1 trans-aconitate methyltransferase activity is experimentally established, and SPAC25B8.09
      shares PTHR44942:SF4 with it. However the substrate-specific claim requires orthology, and the evolutionary
      placement does not resolve it - fission yeast has a lineage-specific tandem pair (SPAC25B8.09/SPAC25B8.10,
      68% identical), budding yeast has Tmt1 and Crg1, and each fission-yeast copy is 25-29% identical
      to both budding-yeast proteins. SF4 also contains natural-product O-methyltransferases with unrelated
      acceptors, and the official PANTHER 19.0 classification places Q9UTA9 in a different family (PTHR42912:SF95).
      The PAINT curator propagated only generic methyltransferase activity to this gene. Trans-aconitate
      methylation remains a reasonable hypothesis, but neither the target nor its paralog has been assayed.
