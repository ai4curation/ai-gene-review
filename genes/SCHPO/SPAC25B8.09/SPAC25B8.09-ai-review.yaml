  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P32643
  review:
    summary: Detoxification is a plausible non-core consequence of trans-aconitate methylation.
    action: KEEP_AS_NON_CORE
    reason: The curated transfer traces to Tmt1, but even the donor has an additional major endogenous
      substrate, 3-isopropylmalate. Retain the biological possibility without asserting detoxification
      as the sole or established physiological purpose in fission yeast.
    supported_by:
