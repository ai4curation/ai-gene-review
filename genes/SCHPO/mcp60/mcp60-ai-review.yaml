id: Q09864
gene_symbol: mcp60
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  mcp60/hsp60 encodes the fission-yeast mitochondrial Hsp60 chaperonin, a
  conserved ATP-dependent protein-folding chaperone of the Cpn60/GroEL family.
  The protein is synthesized with an N-terminal mitochondrial targeting sequence
  and acts primarily in the mitochondrial matrix, where it promotes folding of
  imported mitochondrial proteins including the mitochondrial transcription
  factor Mtf1.
