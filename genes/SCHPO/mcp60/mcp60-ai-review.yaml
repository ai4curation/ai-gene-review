  supporting_entities:
  - FB:FBgn0015245
  - PANTHER:PTN000143509
  - RGD:621314
  - SGD:S000000248
  review:
    summary: >-
      Likely an over-propagated cargo or assembly-context location; mature
      Hsp60 is a soluble matrix chaperonin, not an inner-membrane subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The fission-yeast protein has a cleavable matrix-targeting sequence and
      the same review accepts mitochondrial matrix as the core site for its
      ATP-dependent folding activity. Hsp60 can fold imported proteins that are
      later assembled into inner-membrane complexes, but that substrate or
      transient import context is weaker than asserting Hsp60 itself is active
      in the inner membrane.
    supported_by:
    - reference_id: file:genes/SCHPO/mcp60/mcp60-uniprot.txt
      record_section:
      - FT:TRANSIT
      supporting_text: "TRANSIT         1..35"
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000143509
        source_label: mitochondrial Hsp60 PAINT node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node supports a matrix Hsp60 chaperonin; its inner-membrane
          transfer overstates the residence of a soluble matrix chaperonin in
          fission yeast.
