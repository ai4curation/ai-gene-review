  review:
    summary: >-
      Plausible but non-core orthology transfer for the specialized
      matrix-to-intermembrane-space conservative sorting pathway.
    action: KEEP_AS_NON_CORE
    reason: >-
      Budding-yeast Hsp60 can participate in conservative sorting of a subset of
