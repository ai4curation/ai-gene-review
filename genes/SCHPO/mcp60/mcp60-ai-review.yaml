  review:
    summary: >-
      True only as an ancestor of the supported mitochondrial location, and too
      broad to keep as an informative component annotation.
    action: TOO_GENERAL
    reason: >-
      mcp60 has a predicted mitochondrial transit peptide, the direct
      fission-yeast localization row places it in mitochondria, and its
      conserved Hsp60 chaperonin activity is mitochondrial. The ARBA cytoplasm
      call is therefore just a broad ancestor of the specific mitochondrial
      locations.
