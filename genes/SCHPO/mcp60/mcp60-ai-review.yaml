    label: post-mRNA release spliceosomal complex
  evidence_type: IDA
  original_reference_id: PMID:24442611
  qualifier: part_of
  review:
    summary: >-
      Likely a mass-spectrometry carry-through from an abundant mitochondrial
      chaperonin, not a curated core spliceosomal function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMID:24442611 purified endogenous U2-U5-U6 intron-lariat spliceosomes and
      detected Mcp60/Hsp60 in proteomic data, but the protein's established
      direct function is mitochondrial matrix protein folding. Without a
      mechanistic spliceosome role, a part_of assertion to the post-mRNA release
      spliceosomal complex likely overstates a low-abundance copurification.
    supported_by:
    - reference_id: PMID:24442611
      reference_section_type: ABSTRACT
      supporting_text: >-
        Mass spectrometry analysis identified 68, 45, and 43 proteins in
        low-salt-, high-salt-, and micrococcal nuclease-treated preps
