  review:
    summary: IBA (PANTHER PTN000549205; S. cerevisiae ADE2, Candida ADE2, E. coli PurK). Right step, but
      GO:0004638 is defined as the direct (class II PurE, vertebrate-type) carboxylation of AIR by CO2.
      ade6 instead carries a PurK-like domain (IPR005875) and a class I PurE domain (IPR033747) that act
      via N5-CAIR, as shown for the C. neoformans ortholog. The two half-reaction terms describe ade6
      correctly; same decision as the S. cerevisiae ADE2 review.
    action: MODIFY
    reason: The N5-CAIR route is captured by the PurK and class I PurE half-reaction terms, not the class
      II direct-carboxylase term.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
