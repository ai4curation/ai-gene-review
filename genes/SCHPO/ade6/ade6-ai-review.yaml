suggested_questions:
- question: Has the N5-CAIR route been confirmed biochemically for S. pombe ade6, or is it inferred only
    from the C. neoformans and budding-yeast ADE2 orthologs?
suggested_experiments:
- description: Assay recombinant ade6 and its separated N- and C-terminal domains for N5-CAIR synthetase
    and N5-CAIR mutase activities, and test complementation of E. coli purK and purE mutants.
