  label: Schizosaccharomyces pombe 972h-
description: 'ade6 (SPCC1322.13; synonym min1) encodes the 552-residue bifunctional phosphoribosylaminoimidazole
  carboxylase of fission yeast, the ortholog of S. cerevisiae ADE2 (not of budding-yeast ADE6). Like other
  fungal ADE2 proteins it has an N-terminal PurK-like ATP-grasp domain and a C-terminal class I PurE-like
  domain, and is expected to carboxylate 5-aminoimidazole ribonucleotide (AIR) by the two-step N5-CAIR
  route: the PurK-like domain uses AIR, ATP and bicarbonate to form N5-carboxyaminoimidazole ribonucleotide,
  and the PurE-like domain rearranges N5-CAIR to 4-carboxy-5-aminoimidazole ribonucleotide (CAIR), the
  sixth step of de novo IMP synthesis. The mechanism is inferred from the biochemically characterised
  Cryptococcus neoformans ADE2 ortholog. The protein is cytosolic.'
