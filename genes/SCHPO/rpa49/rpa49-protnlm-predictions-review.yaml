  review:
    assessment: LSP
    confidence_score: 2
    summary: S. pombe RPA51/Rpa49 co-purifies with Pol I, including in stationary phase (PMID:12893961),
      and the A49/A34.5 subcomplex is present in purified S. pombe Pol I used for cryo-EM (PMID:33536435).
      Membership of a DNA-directed RNA polymerase complex is therefore supported. The gene already carries
      RNA polymerase I complex (GO:0005736, IDA and IBA), an is_a descendant of the predicted term, so
      the prediction is LSP. The protein is an accessory subunit, not a catalytic one.
    supported_by:
    - reference_id: PMID:12893961
      supporting_text: We also found that RPA51 associates significantly with Pol I in the stationary
        phase, suggesting that Pol I inactivation in the stationary phase of yeast does not result from
        the RPA51 dissociation.
    - reference_id: PMID:33536435
      supporting_text: The presence of the A49/A34.5 subunit-complex in Pol I preparations was confirmed
        by Coomassie−stained SDS-PAGE (Supplementary Fig. 1a) and mass-spectrometry analysis.
