    label: DNA-templated transcription
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: S. pombe RPA51/Rpa49 is a Pol I subunit needed for maximal rDNA transcription in vivo and
      in vitro (PMID:12893961), so participation in DNA-templated transcription is supported. The exact
      term is already on the gene as an InterPro2GO IEA, which the gene review modifies to its specific
      descendants; the gene carries transcription elongation by RNA polymerase I (GO:0006362, IDA and IBA)
      and RNA polymerase I preinitiation complex assembly (GO:0001188, IBA). Because the prediction is
      materially less specific than these supported annotations, it is LSP rather than CNN.
    supported_by:
    - reference_id: PMID:12893961
      supporting_text: Transcripts analysis in vivo and in vitro shows that RPA51 plays a general role
        for maximizing transcription of rDNA whereas it is dispensable for non-specific transcription.
