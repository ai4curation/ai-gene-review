- term: &id004
    id: GO:0005736
    label: RNA polymerase I complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - MGI:MGI:1929022
  - PANTHER:PTN000374345
  - PomBase:SPAC2F3.03c
  - SGD:S000005192
  - UniProtKB:Q9GZS1
  review:
    summary: PAINT inference of Pol I complex membership, matching the target's own IDA.
    action: ACCEPT
    reason: >-
      Pol I membership is the defining property of the A49/PAF53/POLR1E family (PTHR14440, node
      PTN000374345). The target's own experimental annotation (PomBase:SPAC2F3.03c) is one of the
      descendant evidences behind the IBD, as expected. Fission-yeast RPA51 co-purifies with Pol I
      (PMID:12893961). The A49/A34.5 subcomplex was also detected by SDS-PAGE and mass spectrometry
      in purified S. pombe Pol I used for cryo-EM (PMID:33536435).
    supported_by:
    - reference_id: PMID:12893961
      supporting_text: We also found that RPA51 associates significantly with Pol I in the
        stationary phase, suggesting that Pol I inactivation in the stationary phase of yeast does
        not result from the RPA51 dissociation.
    - reference_id: PMID:33536435
      supporting_text: The presence of the A49/A34.5 subunit-complex in Pol I preparations was
        confirmed by Coomassie−stained SDS-PAGE (Supplementary Fig. 1a) and mass-spectrometry
        analysis.
- term:
    id: GO:0005736
    label: RNA polymerase I complex
  evidence_type: IDA
  original_reference_id: PMID:12893961
  qualifier: part_of
  review:
    summary: Direct biochemical evidence that RPA51/Rpa49 is a Pol I subunit in fission yeast.
    action: ACCEPT
    reason: >-
      Nakagawa et al. found the protein as a Pol I subunit that stays associated with the enzyme
      even in stationary phase (PMID:12893961). Later cryo-EM work on purified S. pombe Pol I
      confirmed that the A49/A34.5 heterodimer is present in the 14-subunit enzyme. Its density is
      not resolved, which reflects the flexibility of the subcomplex (PMID:33536435).
    supported_by:
    - reference_id: PMID:12893961
      supporting_text: We designate the corresponding protein RPA51 and gene encoding it rpa51+
        since the gene encodes a Pol I subunit and an apparent molecular mass of the protein is 51
        kDa.
    - reference_id: PMID:12893961
      supporting_text: We also found that RPA51 associates significantly with Pol I in the
        stationary phase, suggesting that Pol I inactivation in the stationary phase of yeast does
        not result from the RPA51 dissociation.
    - reference_id: PMID:33536435
      supporting_text: The presence of the A49/A34.5 subunit-complex in Pol I preparations was
        confirmed by Coomassie−stained SDS-PAGE (Supplementary Fig. 1a) and mass-spectrometry
        analysis.
- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR009668
  review:
    summary: Correct but very general InterPro2GO process term; the gene already carries the
      specific Pol I transcription terms.
    action: MODIFY
    reason: >-
      Rpa49 takes part in transcription, but only as a Pol I subunit. The specific supported
      descendants are transcription elongation by RNA polymerase I (GO:0006362; S. pombe IDA plus
      IBA) and RNA polymerase I preinitiation complex assembly (GO:0001188; IBA). Both are already
      on the gene and both are is_a/part_of descendants of GO:0006351 (verified via OLS
      hierarchicalAncestors). Both are listed because the A49 subunit acts at initiation (Rrn3
      recruitment) and at elongation (Rrn3 release, processivity, cleavage stimulation).
    proposed_replacement_terms:
    - id: GO:0006362
      label: transcription elongation by RNA polymerase I
    - id: GO:0001188
      label: RNA polymerase I preinitiation complex assembly
    supported_by:
    - reference_id: PMID:12893961
      supporting_text: Transcripts analysis in vivo and in vitro shows that RPA51 plays a general
        role for maximizing transcription of rDNA whereas it is dispensable for non-specific
        transcription.
    - reference_id: PMID:18086878
      supporting_text: These data suggest a dual role of the Rpa49-Rpa34 dimer during the recruitment
        of Rrn3 and its subsequent dissociation from the elongating polymerase.
- term: &id002
    id: GO:0006362
    label: transcription elongation by RNA polymerase I
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000374345
  - PomBase:SPAC2F3.03c
  - SGD:S000005192
  - UniProtKB:Q9GZS1
  review:
    summary: PAINT inference of a role in Pol I elongation, concordant with the target's IDA and
      with budding-yeast A49 data.
    action: ACCEPT
    reason: >-
      Budding-yeast A49 supports elongation in several ways. The A49/A34.5 dimerization module
      stimulates the intrinsic RNA cleavage of the polymerase (PMID:20797630). A49 is needed to
      release Rrn3 from the elongating enzyme (PMID:18086878), and rpa49 mutants lose polymerase
      occupancy on rDNA and are sensitive to 6-azauracil and mycophenolate, typical of elongation
      defects (PMID:18086878). The S. pombe protein is needed for maximal rDNA transcription in vivo
      and in vitro (PMID:12893961). The target's own IDA is one of the IBD's descendant evidences,
      so it is not circular. The subunit supports the polymerase and does not itself synthesise RNA.
    supported_by:
    - reference_id: PMID:12893961
      supporting_text: Transcripts analysis in vivo and in vitro shows that RPA51 plays a general
        role for maximizing transcription of rDNA whereas it is dispensable for non-specific
        transcription.
    - reference_id: PMID:20797630
      supporting_text: The N-terminal regions of A49 and A34.5 form a dimerization module that
        stimulates polymerase-intrinsic RNA cleavage and has a fold that resembles the TFIIF core.
    - reference_id: PMID:18086878
      supporting_text: These data suggest a dual role of the Rpa49-Rpa34 dimer during the recruitment
        of Rrn3 and its subsequent dissociation from the elongating polymerase.
- term:
    id: GO:0006362
    label: transcription elongation by RNA polymerase I
  evidence_type: IDA
  original_reference_id: PMID:12893961
  qualifier: involved_in
  review:
    summary: S. pombe in vivo and in vitro transcript analysis showing that RPA51 is needed for
      maximal rDNA transcription by Pol I.
    action: ACCEPT
    reason: >-
      The abstract shows that RPA51 maximises specific rDNA transcription but is dispensable for
      non-specific transcription by Pol I. The cached record is abstract-only, so we cannot see
      which assays led the PomBase curator to choose elongation rather than initiation. The choice
      matches the budding-yeast A49 elongation phenotypes (PMID:18086878, PMID:20797630), so we
      defer to the curator.
    supported_by:
    - reference_id: PMID:12893961
      supporting_text: Transcripts analysis in vivo and in vitro shows that RPA51 plays a general
        role for maximizing transcription of rDNA whereas it is dispensable for non-specific
        transcription.
