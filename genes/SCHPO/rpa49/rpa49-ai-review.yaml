id: O14086
gene_symbol: rpa49
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Rpa49, also characterized as RPA51, is a Pol I-specific accessory subunit in the nucleolus.
  It supports efficient ribosomal DNA transcription and transcription elongation by RNA polymerase I.
  It is functionally conserved with budding-yeast A49 and acts within the polymerase complex rather than
  providing an independent RNA-polymerase catalytic center.
existing_annotations:
- term:
    id: GO:0001188
    label: RNA polymerase I preinitiation complex assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1929022
  - PANTHER:PTN000374345
  review:
    summary: RNA polymerase I preinitiation complex assembly is supported.
    action: ACCEPT
    reason: Budding-yeast A49/A34 promotes recruitment of Rrn3 and its release during elongation (PMID:18086878).
      Functional complementation by fission-yeast RPA51 (PMID:12893961) supports the PAINT transfer of
      conserved Pol I preinitiation participation. This remains a homolog-based process inference rather
      than a target preinitiation assay.
    supported_by:
    - reference_id: PMID:18086878
      supporting_text: 'These data suggest a dual role of

        the Rpa49-Rpa34 dimer during the recruitment of Rrn3 and its subsequent

        dissociation from the elongating polymerase.'
    - reference_id: PMID:12893961
      supporting_text: 'rpa51+ is required for cell growth at

        lower but not at higher temperatures and is able to complement S. cerevisiae

        rpa49Delta mutation, indicating that RPA51 is a functionally-conserved subunit

        of Pol I between the budding yeast and the fission yeast.'
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009668
  review:
    summary: DNA binding is supported.
    action: ACCEPT
    reason: The characterized budding-yeast A49 C-terminal tandem-winged-helix domain binds DNA (PMID:20797630).
      Fission-yeast RPA51 complements the budding-yeast rpa49 deletion (PMID:12893961), and the target
      has the diagnostic A49-family domain. Together these justify conserved DNA-binding activity by family
      transfer, without asserting a target-specific promoter preference.
    supported_by:
    - reference_id: PMID:20797630
      supporting_text: 'The C-terminal region of A49 forms a "tandem

        winged helix" (tWH) domain that binds DNA with a preference for the upstream

        promoter nontemplate strand and is predicted in TFIIE.'
    - reference_id: PMID:12893961
      supporting_text: 'rpa51+ is required for cell growth at

        lower but not at higher temperatures and is able to complement S. cerevisiae

        rpa49Delta mutation, indicating that RPA51 is a functionally-conserved subunit

        of Pol I between the budding yeast and the fission yeast.'
