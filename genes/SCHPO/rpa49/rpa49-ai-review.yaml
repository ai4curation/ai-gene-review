suggested_questions:
- question: Does the S. pombe Rpa49 C-terminal region bind upstream promoter DNA with the same
    nontemplate-strand preference reported for the S. cerevisiae A49 tWH domain?
suggested_experiments:
- description: Express the S. pombe Rpa49 C-terminal region (the two-thirds sufficient for
    function) and measure binding to rDNA promoter and bubble substrates by EMSA or fluorescence
    anisotropy, comparing it with the S. cerevisiae A49 tWH.
