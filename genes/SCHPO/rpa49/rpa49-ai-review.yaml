id: O14086
gene_symbol: rpa49
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  Rpa49 (originally named RPA51; systematic name SPAC2F3.03c) is the fission-yeast member of the
  A49/PAF53/POLR1E family and one of the 14 subunits of RNA polymerase I (Pol I), the nucleolar
  enzyme that transcribes the ribosomal DNA repeats into the 35S pre-rRNA. It co-purifies with Pol I,
  including in stationary phase, and is a non-catalytic accessory subunit: Pol I lacking it keeps
  non-specific polymerase activity but cannot transcribe rDNA at full rate. The gene is dispensable
  at high temperature but needed for growth at lower temperatures. The C-terminal two-thirds of the
  protein carry its function, and the protein can replace budding-yeast Rpa49 in vivo. In budding
  yeast, the N-terminal region of A49 forms a TFIIF-like heterodimer with A34.5. That module docks on
  the polymerase lobe and stimulates the RNA cleavage catalysed by A12.2. The C-terminal tandem
  winged-helix domain of A49 is TFIIE-like and binds DNA. Through these two parts A49 helps recruit
  and later release the initiation factor Rrn3 and supports processive elongation. These roles are
  expected to be shared by the fission-yeast protein, which belongs to the same single-subfamily
  PANTHER family (PTHR14440) and has the same complementing activity.
existing_annotations:
- term:
    id: GO:0001188
    label: RNA polymerase I preinitiation complex assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1929022
  - PANTHER:PTN000374345
  review:
    summary: PAINT inference that the A49-family subunit takes part in assembling the Pol I
      initiation complex; supported by ortholog data and cross-species complementation.
    action: ACCEPT
    reason: >-
      PTHR14440 is a single-subfamily family, and both S. pombe Rpa49 and the experimentally studied
      S. cerevisiae Rpa49 and mouse PAF53 sit beneath the PAINT node PTN000374345. In budding yeast,
      rpa49 deletion and C-terminal truncation partly impair recruitment of the initiation factor
      Rrn3 to the rDNA promoter (PMID:18086878). The A49 C-terminal tandem winged-helix domain is a
      TFIIE-related DNA-binding module that prefers the upstream promoter (PMID:20797630). So the
      subunit contributes structurally to the initiation-competent Pol I complex rather than being a
      bystander, which meets the participation bar. The fission-yeast protein complements an S.
      cerevisiae rpa49 deletion (PMID:12893961), which places it inside the clade that inherited the
      function. No S. pombe initiation assay exists, so this stays a phylogenetic inference, but no
      evidence of divergence argues against it.
    supported_by:
    - reference_id: PMID:18086878
      supporting_text: These data suggest a dual role of the Rpa49-Rpa34 dimer during the recruitment
        of Rrn3 and its subsequent dissociation from the elongating polymerase.
    - reference_id: PMID:20797630
      supporting_text: The C-terminal region of A49 forms a "tandem winged helix" (tWH) domain that
        binds DNA with a preference for the upstream promoter nontemplate strand and is predicted in
        TFIIE.
    - reference_id: PMID:12893961
      supporting_text: rpa51+ is required for cell growth at lower but not at higher temperatures and
        is able to complement S. cerevisiae rpa49Delta mutation, indicating that RPA51 is a
        functionally-conserved subunit of Pol I between the budding yeast and the fission yeast.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009668
  review:
    summary: InterPro2GO DNA binding for the A49 family; supported by the budding-yeast A49
      tandem winged-helix DNA-binding data.
    action: ACCEPT
    reason: >-
      The budding-yeast A49 C-terminal tWH domain binds DNA directly (PMID:20797630). The target
      matches the A49 family signatures (IPR009668, PF06870, PTHR14440). Deletion mapping of the S.
      pombe protein shows that its C-terminal two-thirds, the region corresponding to the tWH-bearing
      part of A49, is enough for function (PMID:12893961). Plain DNA binding is as specific as the
      evidence allows. The tWH shows only a strand and position preference, not sequence-specific
      promoter recognition, so a sequence-specific child term would over-state it. Nobody has
      measured DNA binding by the S. pombe protein directly; the claim rests on family membership.
    supported_by:
    - reference_id: PMID:20797630
      supporting_text: The C-terminal region of A49 forms a "tandem winged helix" (tWH) domain that
        binds DNA with a preference for the upstream promoter nontemplate strand and is predicted in
        TFIIE.
    - reference_id: PMID:12893961
      supporting_text: Deletion analysis of rpa51+ shows that only two-thirds of the C-terminal region
        are required for the function.
