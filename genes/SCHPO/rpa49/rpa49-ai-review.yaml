    action: MODIFY
    reason: >-
      The localization is correct: a Pol I subunit works at the rDNA in the nucleolus. The same
      high-throughput study gives the more specific nucleolus (GO:0005730), which this gene already
      carries, and nucleolar residence fits the Pol I subunit role (UniProt subcellular location
      Nucleus, nucleolus). Under the refinement rule the general term is replaced by nucleolus
      rather than kept as non-core.
