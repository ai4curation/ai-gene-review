    supporting_text: APC/C's RING finger is located within the small subunit Apc11, which by itself has the properties
      of a minimal ubiquitin ligase ( 13 , 22 ).
  - statement: Apc11 is anchored to the complex through the cullin-related subunit Apc2.
    supporting_text: Apc11 is anchored to the complex through Apc2, a subunit distantly related to cullins ( 50
