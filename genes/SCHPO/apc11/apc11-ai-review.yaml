      Cut9-TAP and Apc13-TAP purifications of the S. pombe APC/C (Fig. 2C), which is the basis of the PomBase IDA
      row for apc11.
- id: PMID:10888670
  title: The APC11 RING-H2 finger mediates E2-dependent ubiquitination.
  findings:
  - statement: Budding-yeast Apc11 alone defines the minimal ubiquitin ligase activity of the APC/C.
    supporting_text: Here, we provide evidence that the Saccharomyces cerevisiae RING-H2 finger protein Apc11 defines
      the minimal ubiquitin ligase activity of the APC.
  - statement: Purified Apc11 binds the E2 Ubc4 directly.
    supporting_text: Using purified, recombinant proteins we showed that Apc11p interacted directly with the Ubc4
      ubiquitin conjugating enzyme (E2).
  - statement: Apc11 polyubiquitinates the cyclin Clb2 in vitro with Ubc4, and the RING-H2 finger is absolutely
      required for this E3 activity.
    supporting_text: However, Apc11p bearing mutations in putative metal-binding cysteines (C41, C44, or C91) showed
      little or no activity in this assay (Figure 5 A, lanes 3, 4, and 9), demonstrating that the RING-H2 finger
      is absolutely required for its E3 activity.
  - statement: RING-based E3s act as bridges between E2 and substrate rather than forming thioester intermediates.
    supporting_text: Our work, and that of others, indicates that RING-based E3s do not act as ubiquitin carriers
      that form thioester intermediates, but instead act as bridges between E2s and substrates that provide a favorable
      environment for the transfer of ubiquitin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Leverson et al. 2000 Mol Biol Cell; full text cached. Budding-yeast orthologue, used for the conserved
      RING-E3 mechanism and the requirement for zinc-ligand cysteines; the pombe sequence is in the RING alignment.
