  review:
    summary: InterPro2GO mapping from IPR024991 (RING-H2 finger of APC11) to zinc ion binding. The 94-residue apc11
      is essentially a RING-H2 zinc finger (UniProt ZN_FING 35-78) with the conserved cysteine/histidine ligand
