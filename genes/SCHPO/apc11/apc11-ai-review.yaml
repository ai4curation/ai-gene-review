gene_symbol: apc11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: 'Apc11 is the 94-residue RING-H2 zinc-finger subunit of the Schizosaccharomyces pombe anaphase-promoting
  complex/cyclosome (APC/C), the 13-subunit cullin-RING E3 ubiquitin ligase that drives the metaphase-to-anaphase
  transition and exit from mitosis. Anchored on the cullin-homology domain of Apc2, Apc11 forms the catalytic module
  of the complex: its RING domain, which coordinates zinc through conserved cysteine and histidine ligands, binds
  and activates ubiquitin-charged E2 enzymes (Ubc11 and Ubc4 in fission yeast) so that ubiquitin is transferred
  directly from the E2 thioester to lysine residues of APC/C-bound substrates, building polyubiquitin chains that
  are recognised by the 26S proteasome. Apc11 forms no ubiquitin thioester of its own and does not recognise substrates;
  D-box and KEN-box degrons are read by the coactivators Slp1/Cdc20 and Ste9/Cdh1 (Mfr1/Fzr1 in meiosis) together
  with the co-receptor Apc10, and the spindle assembly checkpoint restrains the complex until chromosomes are bioriented.
  Through the APC/C, Apc11 ubiquitinates the securin Cut2, whose destruction releases the separase Cut1 to cleave
  cohesin and permit sister-chromatid separation, and the B-type cyclin Cdc13, whose destruction lowers Cdc2 kinase
  activity and allows mitotic exit and the establishment of G1. Apc11 is present at one copy per APC/C particle
  and lies with Apc2 and Apc10 on the catalytic side of the complex, opposite the TPR scaffold; it is essential
  for viability, acts in the nucleus during the closed mitosis of fission yeast, and is the orthologue of human
  ANAPC11 and budding-yeast Apc11, belonging to the RING-box family alongside the SCF subunit Rbx1/Pip1 from which
  it differs by pairing exclusively with Apc2.'
