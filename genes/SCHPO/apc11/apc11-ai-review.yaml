      APC/C identified 13 subunits in each yeast, including small subunits such as apc11 that earlier approaches
      had missed.
    supporting_text: Our data increase the total number of identified APC subunits to 13 in both yeasts and indicate
      that previous approaches were biased against the identification of small subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Yoon et al. 2002 Curr Biol; the founding proteomic identification of SPAC343.03/apc11 as an S.
      pombe APC/C subunit (PomBase IDA, Complex Portal IPI/NAS, PomBase IC). Abstract-only in cache; subunit identities
      come from the paper figures via UniProt and the deep-research summary.
