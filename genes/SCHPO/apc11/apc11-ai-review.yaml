      supporting_text: However, Apc11p bearing mutations in putative metal-binding cysteines (C41, C44, or C91)
        showed little or no activity in this assay (Figure 5 A, lanes 3, 4, and 9), demonstrating that the RING-H2
        finger is absolutely required for its E3 activity.
    - reference_id: file:SCHPO/apc11/apc11-deep-research-falcon.md
