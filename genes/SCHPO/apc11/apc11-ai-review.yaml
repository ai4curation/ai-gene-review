  review:
    summary: PAINT inference from the RING-box family node PTN000129805 (RBX1/RBX2/APC11 clade) that apc11 is active
      in the nucleus. Fission yeast undergoes a closed mitosis in which the APC/C substrates Cut2/securin and Cdc13
      are nuclear and spindle-associated, and the pombe apc11 gene product is itself listed in the WITH/FROM as
      a descendant evidence.
    action: ACCEPT
    reason: 'The IBD is placed at the family node whose experimental descendants (yeast Apc11/Rbx1, fly and mouse
      Rbx1, human RBX1/ANAPC11) act on nuclear substrates, and the target-specific biology agrees: securin Cut2
      is nuclear and concentrated on the metaphase spindle and is destroyed there by the Cut9-containing APC/C,
      so the APC/C RING catalytic module must act in the nucleus during the closed mitosis of S. pombe. No apc11-specific
      imaging series exists (the deep-research survey found none), so the site is inferred from complex biology
      rather than from direct localisation of the subunit, which is a knowledge gap rather than a reason to doubt
      the term. PomBase:SPAC343.03 appearing in its own WITH/FROM is the expected marker that target-side evidence
      was used to place the node.'
