suggested_questions:
- question: The APC/C RING subunit carries both positive regulation of mitotic metaphase/anaphase transition (GO:0045842,
    IBA) and positive regulation of mitotic sister chromatid separation (GO:1901970, IC), while the PomBase GO-CAM
    and the pathway module place the APC/C ligase activity as a direct part of metaphase/anaphase transition of
    mitotic cell cycle (GO:0007091), whose definition names APC/C activation and securin degradation. Should the
    catalytic subunit be annotated to the transition itself rather than, or in addition to, its regulation?
- question: 'Direct Apc11-E2 binding is demonstrated for the budding-yeast and human orthologues, yet no APC11 orthologue
    carries GO:0031624 ubiquitin conjugating enzyme binding (comparator check: human ANAPC11, RBX1, yeast Apc11,
    pombe apc11). Is E2 engagement considered part of ubiquitin protein ligase activity for RING E3s, and which
    fission-yeast E2 (Ubc11 or Ubc4) contacts the apc11 RING directly?'
- question: Is apc11 present in the meiosis-specific Mfr1/Fzr1-activated APC/C (Complex Portal CPX-766) at the same
    one-copy stoichiometry, and does the RING module contribute to the Mes1-regulated meiosis I to II transition?
suggested_experiments:
- hypothesis: The zinc-ligand cysteines of the S. pombe apc11 RING-H2 finger are required for APC/C ubiquitin ligase
    activity and for viability, as for budding-yeast Apc11, and the Ubc11-dependent priming and Ubc4-dependent elongation
    steps use separable surfaces of the RING.
  description: Replace endogenous apc11 with alleles mutating the RING zinc ligands or the E2-contacting helix (equivalent
    to yeast W81) under a regulatable promoter; score viability, metaphase arrest and Cut2/Cdc13 stability, and
    assay purified APC/C-Slp1 from each strain for Cut2 ubiquitylation with Ubc11 alone, Ubc4 alone, or both.
  experiment_type: structure-guided mutagenesis with in vivo phenotyping and in vitro ubiquitination assays
- hypothesis: Apc11 is nuclear throughout the closed mitosis of fission yeast and co-localises with the APC/C on
    the metaphase spindle where Cut2 is destroyed.
  description: Tag apc11 at its endogenous locus with a fluorescent protein (checking that the tagged strain grows
    normally, as reported for the double-tag stoichiometry strains), image through the cell cycle alongside Cut2-GFP
    or a tagged TPR subunit, and confirm with anti-Apc11 immunofluorescence.
  experiment_type: endogenous tagging and live-cell imaging
- hypothesis: The S. pombe APC/C assembles K48-linked rather than K11-linked ubiquitin chains on Cut2 and Cdc13.
  description: Perform in vitro ubiquitylation of Cut2 and Cdc13 with purified S. pombe APC/C-Slp1, Uba1, Ubc11
    and Ubc4 using lysine-to-arginine ubiquitin mutants and linkage-specific mass spectrometry, and compare with
    chains formed by the apc11 RING mutants.
  experiment_type: in vitro reconstitution with ubiquitin linkage analysis
