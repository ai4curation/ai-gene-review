  findings:
  - statement: The APC2-APC11 heterodimer with Ubc4 or UbcH10 suffices to ubiquitinate securin and cyclin B1.
    supporting_text: In combination with Ubc4 or UbcH10, a heterodimeric complex of APC2 and APC11 is sufficient
      to catalyze the ubiquitination of human securin and cyclin B1.
  - statement: The minimal APC2/11 module lacks substrate specificity.
    supporting_text: However, the minimal APC2/11 ubiquitin ligase module does not possess substrate specificity,
      because it also ubiquitinates the destruction box deletion mutants of securin and cyclin B1.
  - statement: APC11 binds the C-terminal cullin homology domain of APC2, and Ubc4 binds APC11 directly.
    supporting_text: Both APC11 and UbcH10 bind to the C-terminal cullin homology domain of APC2, whereas Ubc4 interacts
      with APC11 directly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Tang et al. 2001 Mol Biol Cell; human orthologue reconstitution defining the APC2-APC11 catalytic
