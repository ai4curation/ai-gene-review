- id: PMID:8632802
  title: Cut2 proteolysis required for sister-chromatid seperation in fission yeast.
  findings:
  - statement: Cut2/securin is nuclear and spindle-associated, is degraded at anaphase by the Cut9-containing APC/cyclosome,
      and its regulated proteolysis is essential for sister-chromatid separation.
    supporting_text: The rapid degradation of Cut2 at anaphase requires its amino-terminal region and the activity
      of Cut9 (ref. 14), a component of the 20S cyclosome/anaphase-promoting complex (APC), which is necessary for
      cyclin destruction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Funabiki et al. 1996 Nature; exact-organism evidence that APC/C-dependent Cut2 destruction drives
      sister-chromatid separation and occurs in the nucleus, used for the process and nucleus rows.
- id: PMID:18556659
  title: The spindle checkpoint functions of Mad3 and Mad2 depend on a Mad3 KEN box-mediated interaction with Cdc20-anaphase-promoting
    complex (APC/C).
  findings:
  - statement: The APC/C is the E3 that labels securin and cyclins for destruction.
    supporting_text: Mitotic progression is driven by proteolytic destruction of securin and cyclins. These proteins
      are labeled for destruction by an ubiquitin-protein isopeptide ligase (E3) known as the anaphase-promoting
      complex or cyclosome (APC/C).
  - statement: The APC/C requires Cdc20/Slp1 or Cdh1 activators to recognise D-box and KEN-box substrates.
    supporting_text: The APC/C requires activators (Cdc20 or Cdh1) to efficiently recognize its substrates, which
      are specified by destruction (D box) and/or KEN box signals.
