  label: Schizosaccharomyces pombe 972h-
description: spe1 (SPAC144.04c; UniProt Q9UQW9) encodes ornithine decarboxylase (EC 4.1.1.17), the PLP-dependent
  enzyme that decarboxylates ornithine to putrescine, the first and rate-limiting step of polyamine biosynthesis.
  Putrescine is then converted to spermidine by spermidine synthase (SPBC12C2.07c), using decarboxylated
  SAM from spe2. Function is assigned by orthology to S. cerevisiae SPE1; a genome-wide screen places
  it in the cytosol.
