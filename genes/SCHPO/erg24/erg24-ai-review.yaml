  label: Schizosaccharomyces pombe 972h-
description: erg24 (SPBC16G5.18) encodes Delta14-sterol reductase (C-14 sterol reductase, EC 1.3.1.70) of Schizosaccharomyces
  pombe, a 424-residue polytopic ER-membrane protein of the ERG4/ERG24 family (related to S. pombe sts1/Erg4, vertebrate
  TM7SF2 and the lamin B receptor). Using NADPH it reduces the C14=C15 double bond introduced by Erg11-mediated
  demethylation, converting 4,4-dimethyl-cholesta-8,14,24-trienol to 4,4-dimethylzymosterol before C-4 demethylation.
