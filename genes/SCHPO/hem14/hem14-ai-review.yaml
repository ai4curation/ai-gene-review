- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: ORFeome YFP screen recorded nuclear signal (is_active_in nucleus) for hem14. No nuclear
      role is known for a membrane-bound PPOX.
    action: MARK_AS_OVER_ANNOTATED
    reason: PPOX activity in S. cerevisiae is confined to the mitochondrial inner membrane, and the
      same S. pombe screen also reports extramitochondrial signal for ferrochelatase (hem15). An
      is_active_in claim from a C-terminally tagged, overexpressed high-throughput screen is not
      enough to place the activity outside mitochondria; an extramitochondrial pool is not ruled
      out, so the row is not removed.
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: we determined the localization of 4,431 proteins
    - reference_id: PMID:7798202
      supporting_text: Protoporphyrinogen oxidase activity was found only in purified yeast
        mitochondrial inner membrane (not in the outer membrane).
