suggested_questions:
- question: Is S. pombe hem14 exclusively mitochondrial, or does the cytosolic signal in the ORFeome
    screen reflect a real extramitochondrial pool, and on which face of the inner membrane is the
    enzyme?
suggested_experiments:
- hypothesis: S. pombe hem14 is an inner mitochondrial membrane enzyme, as its S. cerevisiae
    ortholog is
  description: Tag hem14 at its endogenous locus (N- and C-terminal variants), image with a
    mitochondrial marker, and fractionate mitochondria (outer/inner membrane, protease protection)
    to test the location and membrane face; compare with untagged PPOX activity in fractions.
  experiment_type: cell biology / fractionation
