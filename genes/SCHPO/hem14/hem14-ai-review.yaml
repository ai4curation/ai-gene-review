  label: Schizosaccharomyces pombe 972h-
description: hem14 (SPAC1F5.07c; UniProt Q10062) encodes protoporphyrinogen oxidase (PPOX; EC 1.3.3.4),
  an FAD-containing mitochondrial inner-membrane enzyme. It carries out the six-electron, O2-dependent
  oxidation of protoporphyrinogen IX to protoporphyrin IX, the seventh step of heme biosynthesis, and
  hands the product to ferrochelatase (hem15). Function and mitochondrial location are assigned by orthology
  to S. cerevisiae HEM14 and the PPOX subfamily.
