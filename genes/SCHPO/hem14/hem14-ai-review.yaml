  label: Schizosaccharomyces pombe 972h-
description: hem14 (SPAC1F5.07c; UniProt Q10062) encodes protoporphyrinogen oxidase (PPOX; EC
  1.3.3.4), an FAD-containing enzyme of the PPOX subfamily. It carries out the six-electron,
  O2-dependent oxidation of protoporphyrinogen IX to protoporphyrin IX, the seventh step of heme
  biosynthesis, and provides the substrate for ferrochelatase (hem15). Function and an inner
  mitochondrial membrane location are assigned by orthology to S. cerevisiae HEM14, whose activity
  is confined to the inner membrane; a genome-wide YFP screen in S. pombe instead recorded cytosolic
  and nuclear signal, and the location has not been tested directly.
