  review:
    summary: 'ORFeome YFP screen recorded cytosolic signal (is_active_in cytosol). Eukaryotic PPOX is
      a mitochondrial inner-membrane enzyme, and a C-terminal YFP tag on an overexpressed protein can
      mask targeting. The observation is not disputed; the activity claim exceeds it. Resolved from UNDECIDED:
      the decision does not depend on the screen images, which are not cached.'
    action: MARK_AS_OVER_ANNOTATED
