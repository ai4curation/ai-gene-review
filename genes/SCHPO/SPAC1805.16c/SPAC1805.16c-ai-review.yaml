- term:
    id: GO:0034355
    label: NAD+ biosynthetic process via the salvage pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000224756
  - SGD:S000004199
  - UniProtKB:P45563
  review:
    summary: 'PAINT inference: yeast Pnp1 phosphorolyses nicotinamide riboside to nicotinamide, feeding
      NAD+ salvage.'
    reason: The UniProt record says nothing about nicotinamide riboside, so the evidence is the S.
      cerevisiae ortholog's. Belenky et al. (PMID:17482543, abstract only) showed in S. cerevisiae that
      nicotinamide riboside is converted to NAD+ through an Nrk1-independent Urh1/Pnp1/Meu1 pathway.
      SPAC1805.16c is placed in the same inosine/guanosine-specific PNP family (TIGR01700) as Pnp1, which
      makes the inheritance plausible, but nicotinamide riboside phosphorolysis has not been tested for the
      S. pombe protein.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:17482543
      supporting_text: 'pathways, the Nrk1 pathway and the Urh1/Pnp1/Meu1 pathway, which is Nrk1'
    - reference_id: file:SCHPO/SPAC1805.16c/SPAC1805.16c-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR01700; PNPH; 1.'
