  label: Schizosaccharomyces pombe 972h-
description: SPAC1805.16c (UniProt Q9UTG1; the fission yeast PNP1 ortholog) encodes a putative purine
  nucleoside phosphorylase (EC 2.4.2.1) that phosphorolyses inosine and guanosine, and their deoxy forms,
  to the purine base and (deoxy)ribose-1-phosphate. By orthology to S. cerevisiae Pnp1, it also cleaves
  nicotinamide riboside, routing it into NAD+ salvage. Function is assigned by orthology; it is cytosolic
  in a genome-wide screen.
