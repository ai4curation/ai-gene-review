proposed_new_terms: []
suggested_questions:
- question: >-
    PAINT node PTN002649387 propagates enzyme-substrate adaptor activity (GO:0140767) to the whole APC/C
    TPR-subunit family from a single ANAPC7 seed. Given that fission-yeast Cut9 binds Hcn1 and the other
    TPR subunits rather than substrate degrons, should the APC6/Cut9 branch carry ubiquitin ligase complex
    scaffold activity (GO:0160072) instead, and is there evidence that ANAPC7 alone recruits substrates?
  experts: []
- question: >-
    Cut9 is reported to bind the ubiquitin-receptor shuttle factors Rhp23 and Pus1/Rpn10 (PMID:12615927)
    and to be recruited, Swi6-dependently, to pericentromeric and mating-type heterochromatin where it
    contacts Swi6 and Clr4 (PMID:19117951). Do these reflect a genuine hand-off of APC/C-ubiquitinated
    substrates to the proteasome, and a chromatin-localised APC/C activity with an identified substrate,
    or are they indirect consequences of APC/C loss? Neither has been reproduced by an independent group,
    and neither is currently represented by a molecular-function term.
  experts: []
- question: >-
    Which Cut9 residues are hyperphosphorylated at metaphase (PMID:9264466), which kinase (Cdc2, Pka1 or
    another) deposits them in vivo, and does their phosphorylation act by recruiting Cdc2-cyclin-Cks to the
    TPR lobe as proposed for human APC3, or by a mechanism specific to fission yeast?
  experts:
  - Yanagida M
  - Yamano H
suggested_experiments:
- hypothesis: >-
    The essential contribution of Cut9 to APC/C activity is structural (bridging Cdc23-Apc13 and Cdc27 and
    enclosing Hcn1) rather than direct engagement of the coactivator, so charge-reversal mutations in the
    conserved convex ridge (K388/R394/K398/D424/Q425) introduced at the endogenous cut9 locus should give a
    metaphase-arrest and cut phenotype accompanied by dissociation of the 20S complex, while mutations
    outside the ridge that preserve Hcn1 binding should not.
  description: >-
    Introduce the ridge charge-reversal mutations and control surface mutations at the endogenous cut9
    locus, assay viability and the cut phenotype, purify the APC/C by Cut9-TAP and Lid1-TAP and quantify
    Cut23, Nuc2, Hcn1 and Apc13 occupancy by mass spectrometry, and measure Cut2 and Cdc13 stability in
    synchronised cultures and Slp1 binding to the mutant complexes.
  experiment_type: structure-guided mutagenesis with APC/C purification and substrate-stability assays
- hypothesis: >-
    Cut9 is predominantly nuclear in cycling fission-yeast cells, with a cytosolic pool that varies through
    the cell cycle, reconciling the ORFeome cytosol call (PMID:16823372) with the nuclear site of Cut2 and
    Cdc13 destruction and the ChIP-detected chromatin pool (PMID:19117951).
  description: >-
    Image Cut9 tagged at the endogenous locus with a fluorescent protein under its own promoter, together
    with a nuclear-envelope or spindle-pole-body marker, through the cell cycle in synchronised cells and in
    cut9-665 and swi6-deleted backgrounds, and compare with nmt1-driven C-terminal YFP fusions to test whether
    the cytosolic signal is an overexpression artefact.
  experiment_type: live-cell imaging of endogenously tagged protein
