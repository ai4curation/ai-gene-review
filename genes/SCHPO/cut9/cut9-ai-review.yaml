gene_symbol: cut9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  Cut9 (Cdc16/Apc6) is an essential tetratricopeptide-repeat (TPR) subunit of the Schizosaccharomyces
  pombe anaphase-promoting complex/cyclosome (APC/C), the 20S, 13-subunit cullin-RING E3 ubiquitin ligase
  that triggers the metaphase-to-anaphase transition and mitotic exit. The 671-residue protein is a
  contiguous superhelix of 14 TPR motifs: the N-terminal block (TPR1-7) forms a clasp-like homodimer
  interface, so that Cut9 is present as a homodimer in the complex, and the C-terminal block (TPR8-14)
  wraps around the small subunit Hcn1 (Cdc26), burying its N-acetylated methionine in a chamber that
  shields Hcn1 from N-terminal-acetylation-dependent degradation. Together with Nuc2 (Cdc27/Apc3) and
  Cut23 (Cdc23/Apc8), Cut9 forms the TPR lobe of the APC/C, and a conserved charged ridge on its convex
  surface mediates the contacts to Cdc23 and Cdc27 that hold that lobe together; the assembly of Cut9
  into the 20S complex requires Nuc2 and vice versa, and the 20S complex falls apart in cut9 mutants
  unless Hcn1 is overexpressed. Cut9 has no catalytic activity: ubiquitin transfer is carried out by
  the Apc2 cullin-Apc11 RING module, and substrate degrons are read by the coactivators Slp1 (Cdc20) or
  Ste9 (Cdh1) together with Apc10. Cut9 instead provides the scaffold on which that substrate-receptor
  module is docked against the catalytic core, so that the securin Cut2 and the B-type cyclin Cdc13 are
  ubiquitinated and degraded at anaphase onset. Cut9 in the 20S complex is hyperphosphorylated
  specifically at metaphase, and loss of the PKA kinase Pka1 both reduces Cut9 phosphorylation and
  suppresses the cut9 mutant phenotype. Temperature-sensitive cut9 alleles (mutations in the TPR
  region) arrest with condensed chromosomes and a short metaphase spindle, stabilise Cut2 and Cdc13, and
  then proceed into septation and cytokinesis without chromosome segregation, producing the 'cut'
  phenotype. Cut9 acts in the nucleus of this closed-mitosis organism, where its substrates Cut2 and
  Cdc13 reside; it has also been detected by chromatin immunoprecipitation at pericentromeric and
  mating-type heterochromatin in a Swi6-dependent manner, and cut9 mutants show defects in
  heterochromatic silencing and cohesin recruitment even at permissive temperature.
