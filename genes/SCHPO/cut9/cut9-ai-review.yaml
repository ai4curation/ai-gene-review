  review:
    summary: >-
      PomBase IPI with Hcn1 (Cdc26, SPAC23C11.12) from Zhang et al. 2010, the 2.6 A crystal structure of
      the S. pombe Cut9-Hcn1 complex. Cut9 is a contiguous superhelix of 14 TPR motifs; the C-terminal
      block TPR8-14 lines the inner groove that Hcn1 residues 1-24 occupy, and the N-acetylated Met1 of
      Hcn1 is enclosed in a chamber formed by the Cut9 superhelix. The same paper shows that a conserved
      charged ridge on the convex face of the superhelix (TPR9-11) mediates association with Cdc23-Apc13
      and, to a lesser extent, Cdc27.
    action: MODIFY
    reason: >-
      The interaction is directly demonstrated at atomic resolution and is structurally meaningful, but bare
      protein binding does not say what Cut9 does. Cut9 is the TPR-lobe subunit that wraps Hcn1, bridges
      Cdc23 and Cdc27, and with Nuc2 and Cut23 provides the platform on which the coactivator/Apc10
      substrate-receptor module is held against the Apc2-Apc11 catalytic module; hcn1 overexpression
      restores 20S assembly in a cut9 mutant (PMID:9264466). That is the definition of ubiquitin ligase
      complex scaffold activity (GO:0160072), the replacement used for the equivalent rows of yeast CDC16
      and human CDC27. The interaction itself is not disputed.
    proposed_replacement_terms:
    - id: GO:0160072
      label: ubiquitin ligase complex scaffold activity
    additional_reference_ids:
    - PMID:9264466
    supported_by:
    - reference_id: PMID:20924356
      supporting_text: >-
        A C-terminal block of TPR motifs interacts with Hcn1, whereas an N-terminal TPR block mediates
        Cdc16/Cut9 self-association through a homotypic interface.
      reference_section_type: ABSTRACT
    - reference_id: PMID:20924356
      supporting_text: >-
        The N-terminal acetylated-Met residue is located within an enclosed chamber formed from the inner
        groove of the Cut9 TPR superhelix
      reference_section_type: RESULTS
    - reference_id: PMID:20924356
      supporting_text: >-
        These results provide strong evidence that conserved residues on the convex face of the Cdc16/Cut9
        TPR superhelix mediate its association with Cdc23–Apc13, and to a less extent Cdc27.
      reference_section_type: RESULTS
    - reference_id: PMID:9264466
      supporting_text: >-
        The 20S assembly impaired in the cut9 mutant can be restored by elevating the level of a novel gene
        product Hcnl, similar to budding yeast Cdc26.
      reference_section_type: ABSTRACT
