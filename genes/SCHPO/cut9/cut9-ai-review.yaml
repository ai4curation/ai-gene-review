  review:
    summary: >-
      PomBase IPI of Cut9 with itself from the Cut9-Hcn1 crystal structure: two Cut9 protomers homodimerise
      through an interlocking clasp formed by TPR1-7, burying 6233 square angstroms, and multiangle light
      scattering shows a Cut9-Hcn1 heterotetramer in solution. The interface is built from residues
      conserved across Cut9/Cdc16/Apc6 orthologues and is structurally equivalent to the N-terminal
      dimerisation domain of Cdc27; interface mutants (M96R, Q97R, F105R, K109A) misfold and aggregate.
    action: MODIFY
    reason: >-
      The self-association is directly demonstrated and functionally relevant (two copies of each TPR
      subunit per APC/C particle), but bare protein binding does not express that. Protein homodimerization
      activity (GO:0042803) states the actual finding; the dimer is the structural basis of the TPR-lobe
      scaffold, so it complements the ubiquitin ligase complex scaffold activity proposed for the Hcn1
      rows rather than duplicating it.
    proposed_replacement_terms:
    - id: GO:0042803
      label: protein homodimerization activity
    supported_by:
    - reference_id: PMID:20924356
      supporting_text: >-
        Two Cut9 molecules homo-dimerize through a homotypic dimer interface generated by a two-fold
        non-crystallographic symmetry operation
      reference_section_type: RESULTS
    - reference_id: PMID:20924356
      supporting_text: >-
