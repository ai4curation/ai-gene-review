core_functions:
- description: >-
    Cut9 forms the middle element of the APC/C TPR lobe (Cut23-Cut9-Nuc2): its N-terminal TPR1-7 block
    homodimerises, its C-terminal TPR8-14 block wraps Hcn1 (Cdc26), and a conserved ridge on its convex
    face bridges Cdc23-Apc13 and Cdc27, providing the docking platform on which the substrate-receptor
    module (coactivator Slp1 or Ste9 plus Apc10) is held against the Apc2-Apc11 catalytic module, so that
    the securin Cut2 and the cyclin Cdc13 are ubiquitinated and degraded at the metaphase/anaphase
    transition and through mitotic exit.
