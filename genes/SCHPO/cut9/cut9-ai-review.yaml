- description: >-
    As a metaphase-hyperphosphorylated TPR subunit, Cut9 is a regulatory input point of the fission-yeast
    APC/C: its phosphorylation state in the 20S complex peaks at metaphase, is reduced by loss of the PKA
    catalytic subunit Pka1 (which suppresses the cut9 mutant phenotype) and is opposed by the PP1 phosphatase
    Dis2, so that Cut9 contributes to the cell-cycle-timed activation of APC/C-Slp1 at anaphase onset. No
    dedicated GO molecular-function term exists for this phospho-dependent regulatory role, so it is
    recorded as a contribution to the ligase activity.
