  label: Schizosaccharomyces pombe 972h-
description: 'ade10 (SPCPB16A4.03c) encodes the bifunctional PurH enzyme of fission yeast (ATIC), which catalyses
  the last two steps of de novo IMP biosynthesis: 10-formyltetrahydrofolate-dependent formylation of AICAR to FAICAR
  (AICAR transformylase, EC 2.1.2.3) and cyclisation of FAICAR to IMP (IMP cyclohydrolase, EC 3.5.4.10). Classical
  fine-structure genetics showed two complementing regions in the ade10 locus, one lacking AICAR formyltransferase
  and the other lacking IMP cyclohydrolase activity, with non-complementing alleles lacking both. Unlike S. cerevisiae,
  which has two paralogous PurH genes (ADE16 and ADE17), S. pombe has a single ade10 gene. The protein is cytosolic.'
