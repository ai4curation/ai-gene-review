      supporting_text: We show that in fission yeast the mitotic B type cyclin Cdc13/Cdc2 kinase associates with
        replication origins in vivo. This association is dependent on the origin recognition complex (ORC), is established
        as chromosomes are replicated, and is maintained during G2 and early mitosis.
      reference_section_type: ABSTRACT
