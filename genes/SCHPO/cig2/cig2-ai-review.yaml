  review:
    summary: PomBase IPI with Res2 (SPAC22F3.09c), one of the two DNA-binding subunits of the MBF (Cdc10-Res1-Res2)
      G1/S transcription factor. Ayte et al. 2001 showed that cig2 transcription depends on MBF and that Cig2 in
      turn binds Res2, promotes phosphorylation of Res1 and inhibits MBF-dependent transcription, closing a negative
      feedback loop.
    action: MODIFY
    reason: 'Bare protein binding carries no functional information. The cited paper supports a more informative
      molecular function: the cyclin docks the Cdc2 kinase onto the MBF complex through Res2 so that Res1 is phosphorylated
      and MCB-driven transcription is shut off after G1/S, which is the substrate-targeting facet of cyclin-dependent
      protein serine/threonine kinase regulator activity (GO:0016538, already carried by IBA/IEA rows). The Res2
      interaction itself is not disputed (UniProt IntAct NbExp=3).'
    proposed_replacement_terms:
