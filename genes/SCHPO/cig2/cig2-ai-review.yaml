  evidence_type: IPI
  original_reference_id: PMID:14970237
  qualifier: enables
  supporting_entities:
  - UniProtKB:P87060
  review:
    summary: IPI with Pop1 (P87060), an F-box/WD-repeat substrate adaptor of the SCF ubiquitin ligase. Yamano et
      al. 2004 showed that Pop1 binds Cig2 in vivo through a 93-residue region of the cyclin box, that binding requires
      Cig2 phosphorylation, and that SCF-Pop1/Pop2 (with the APC/C in anaphase/G1) degrades Cig2 to restrict it
      to an S-phase spike.
    action: REMOVE
    reason: In this interaction Cig2 is the ubiquitylation substrate and Pop1 is the recognition subunit; the paper
      supports no molecular function of Cig2 beyond being recognised for degradation, so there is no more informative
      MF term to modify to. Per project policy a bare GO:0005515 row that conveys no functional information is removed.
      Removal does not dispute the interaction (IntAct NbExp=4), which is important regulatory biology and is recorded
      in the notes and description.
    supported_by:
    - reference_id: PMID:14970237
      supporting_text: Pop1 binds Cig2 in vivo. An in vitro binding assay shows that an internal 93 amino acid residues
        comprising a part of the cyclin box are necessary and sufficient for this binding. Cig2 phosphorylation
        is also required for interaction with Pop1.
      reference_section_type: ABSTRACT
    - reference_id: PMID:14970237
      supporting_text: Here we show that fission yeast S phase cyclin Cig2 is ubiquitylated and degraded via both
        the SCF and the APC/C. Cig2 instability during G(2) and M phase is dependent upon the SCF complex, whereas
        the APC/C is responsible for Cig2 destruction during anaphase and G(1), thereby ensuring a spike pattern
        of Cig2 levels, peaking only at S phase.
      reference_section_type: ABSTRACT
