core_functions:
- description: Binds and activates the Cdc2 (CDK1) serine/threonine protein kinase, forming the Cig2-Cdc2 S-phase
    CDK holoenzyme whose activity rises in G1 and peaks in S; once released from Rum1 inhibition at the critical
    cell size, this kinase commits the cell to Start and triggers the onset of DNA replication, acting in the nucleus
    at replication-origin chromatin.
  supported_by:
