    reason: Association of the S-phase Cig2-Cdc2 kinase with origin chromatin is exactly where the kinase would
      be expected to act when it triggers replication, and the PomBase curator read the full text. Per project rules
      an experimental annotation is not overruled because the cached abstract names a paralog. Accepted as the chromatin-level
      site of the core function; the more informative statement is that the association is at replication origins
      during S phase.
