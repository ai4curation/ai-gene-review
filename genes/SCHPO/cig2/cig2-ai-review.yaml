- description: As the regulatory subunit of Cdc2, docks the kinase on the MBF transcription factor through Res2
    so that Res1 is phosphorylated and MCB-driven G1/S transcription (including cig2 itself) is switched off after
    Start; this closes the transcription-CDK feedback loop of the Start control point and shapes the G1/S transcriptional
    pulse (the transcriptional output is exerted through the Cdc2 kinase and is not asserted as a separate transcription-regulation
    process, consistent with PomBase annotating neither cig2 nor cdc2 to such a term).
