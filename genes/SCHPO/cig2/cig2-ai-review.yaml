proposed_new_terms: []
suggested_questions:
- question: Does Cig2 confer substrate specificity on Cdc2 (for example through hydrophobic-patch docking of origin-associated
    or MBF substrates) or does it act mainly by setting the timing and threshold of total CDK activity, given that
    Cdc13 can substitute for it at S phase and deregulated Cig2-Cdc2 can drive mitosis?
- question: PomBase records the Cig2-mediated feedback inhibition of MBF (PMID:11781565) only as Res2 protein binding,
    and neither cig2 nor cdc2 carries a transcription-regulation process term; is this a deliberate convention (the
    cyclin-CDK regulates the transcription factor rather than transcription itself), and if so should the substrate
    relationship to Res1/Res2 be captured on cdc2 with has-input rather than on the cyclin?
- question: For PMID:26804917, is 'regulation of cell cycle switching, mitotic to meiotic cell cycle' the intended
    level, or would a term for regulation of meiotic gene expression better describe CDK/Cig2-dependent phosphorylation
    of Fkh2 during meiosis?
suggested_experiments:
- description: 'Combine an analogue-sensitive cdc2-as allele with cig2-deleted and hydrophobic-patch-mutant cig2
    strains in synchronised cultures and perform phosphoproteomics across G1/S to define the Cdc2 substrates whose
    phosphorylation depends specifically on Cig2 (candidates: Res1, Cdc18, Cdt1, Sld3/Drc1).'
- description: Chromatin immunoprecipitation sequencing of endogenously tagged Cig2 and Cdc13 through a synchronous
    cell cycle, together with live imaging against SPB (Sid4) and origin markers, to resolve when Cig2-Cdc2 occupies
    replication origins and whether the mitotic SPB pool of Cig2 has any function.
