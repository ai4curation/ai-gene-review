gene_symbol: cig2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: 'Cig2 (also called Cyc17) is the major S-phase B-type cyclin of the fission yeast Schizosaccharomyces
  pombe, a member of the cyclin A/B subfamily. It has no catalytic activity of its own: it binds the single cell-cycle
  cyclin-dependent kinase Cdc2 (CDK1) and activates it, and the Cig2-Cdc2 kinase, which appears after mitosis and
  peaks during S phase, is the principal activity that carries cells through Start and into DNA replication. cig2
  is not essential because Cig1, Puc1 and above all the mitotic cyclin Cdc13 can supply the G1 CDK activity in its
  absence; cig2 deletion delays S-phase entry, particularly in small cells, in sensitised cdc2 backgrounds and on
  recovery from nitrogen starvation, and in cdc13-deleted re-replicating cells loss of Cig2 severely delays re-replication
  while loss of both Cig1 and Cig2 abolishes it. cig2 transcription is driven at G1/S by the MBF transcription factor
  (Cdc10-Res1-Res2); the Cig2-Cdc2 kinase then binds Res2 and promotes phosphorylation of Res1, switching off MBF-dependent
  transcription (including its own) in a negative feedback loop that shapes the G1/S transcriptional pulse. In G1
  the CDK inhibitor Rum1 binds and restrains the Cig2-Cdc2 kinase (and, more strongly, Cdc13-Cdc2) until cells reach
  the critical size for Start, and mating pheromone inhibits the Cig2-Cdc2 kinase to impose G1 arrest. Cig2 abundance
  is confined to a spike at S phase by two ubiquitin ligases: the APC/C destroys it (via an N-terminal destruction
  box) in anaphase and G1, and SCF-Pop1/Pop2 ubiquitylates phosphorylated Cig2 in G2 and M. Because Cig2-Cdc2 activity
  opposes the G1 arrest that sexual differentiation requires, cig2 deletion enhances conjugation even in nitrogen-replete
  medium, whereas cig2 overexpression blocks conjugation and suppresses pat1-driven entry into meiosis. Cig2 acts
  in the nucleus, where the S-phase cyclin-Cdc2 kinase associates with chromatin at replication origins, and a pool
  of the protein is also detected at the mitotic spindle pole body. During meiosis Cig2-dependent CDK phosphorylation
  of the forkhead factor Fkh2 releases it from mid-meiotic gene promoters so that Mei4 can activate them, and cig2
  deletion modestly reduces meiotic double-strand-break formation and gene conversion. Although its UniProt name
  is ''G2/mitotic-specific cyclin'', Cig2 shows no mitotic cyclin activity in wild-type cells; only when inhibitory
  Cdc2 tyrosine phosphorylation and Cdc13 are removed can deregulated Cig2-Cdc2 drive mitosis.'
