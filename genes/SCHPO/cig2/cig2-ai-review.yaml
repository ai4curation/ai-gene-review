    summary: PomBase EXP annotation from the Martin-Castellanos & Moreno 1996 review of rum1 and G1 control, whose
      abstract describes the cdc2/cig2 complex as one of the two B-cyclin-Cdc2 complexes that Rum1 holds inactive
      in G1. The underlying primary data (Cig2-HA immunoprecipitates carry Cdc2-dependent histone H1 kinase activity;
      Martin-Castellanos et al. 1996 EMBO J) are summarised in the deep-research report.
