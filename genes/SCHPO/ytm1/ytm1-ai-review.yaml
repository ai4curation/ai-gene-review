suggested_questions:
- question: >-
    Should GO add a more specific molecular-function term for the Ytm1/WDR12 MIDO-UBL adaptor
    activity that recruits or presents the Rea1/Mdn1 MIDAS domain for ATP-dependent pre-60S
    remodeling, rather than relying on the broad GO:0043021 ribonucleoprotein complex binding
    term?
