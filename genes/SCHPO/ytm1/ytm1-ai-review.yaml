core_functions:
- description: >-
    Ytm1 is the conserved WD40-repeat/UBL component of the fungal Nop7-Erb1-Ytm1, PeBoW-like
    pre-60S assembly subcomplex. It binds Erb1 through its WD40 beta propeller, promotes stable
    association of the subcomplex with nucleolar large-subunit preribosomes, supports 25S
    and 5.8S rRNA maturation during ribosomal large subunit biogenesis, and presents its MIDO/UBL
    region for Rea1/Mdn1-dependent remodeling and release of Ytm1-Erb1 from maturing pre-60S
    particles.
  molecular_function:
    id: GO:0043021
    label: ribonucleoprotein complex binding
  directly_involved_in:
  - id: GO:0000463
    label: maturation of LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S 
      rRNA, LSU-rRNA)
  - id: GO:0000466
    label: maturation of 5.8S rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S 
      rRNA, LSU-rRNA)
  - id: GO:0042273
    label: ribosomal large subunit biogenesis
  locations:
  - id: GO:0005730
    label: nucleolus
  in_complex:
    id: GO:0070545
    label: PeBoW complex
  supported_by:
  - reference_id: PMID:36423630
    supporting_text: the biogenesis complex Ytm1-Erb1-Ppp1 (Ytm1-Erb1-Nop7 in S. 
      cerevisiae) is incorporated
  - reference_id: PMID:16287855
    supporting_text: Ytm1 binds directly to Erb1 and is present in a heterotrimeric 
      subcomplex together with Erb1 and Nop7, both within preribosomes and independently
      of preribosomes.
  - reference_id: PMID:20542003
    supporting_text: Rea1 induces the release of the Ytm1-Erb1-Nop7 subcomplex from the 
      nascent 60S subunit and consequently enables this early pre-60S intermediate to 
      exit from the nucleolus.
  - reference_id: PMID:27667686
    supporting_text: Mdn1 can interact with Rsa4 and Ytm1 through conserved MIDAS-MIDO
      domains.
