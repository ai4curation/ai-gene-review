gene_symbol: ytm1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  ytm1 encodes the fission-yeast ortholog of WDR12/Ytm1, a conserved WD40-repeat/UBL pre-60S
  assembly factor. In Schizosaccharomyces pombe, Ytm1 acts in the nucleolus in the Ytm1-Erb1-Ppp1
  complex, the counterpart of budding-yeast Nop7-Erb1-Ytm1/PeBoW, and is incorporated into
  nascent 60S particles during ribosomal large-subunit precursor assembly. Conserved yeast
  evidence supports roles in 25S and 5.8S rRNA maturation and in Rea1/Mdn1-dependent remodeling
  of the pre-60S particle.
