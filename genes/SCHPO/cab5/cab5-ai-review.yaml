suggested_questions:
- question: Is S. pombe cab5 peripherally bound to the mitochondrial outer membrane, as budding-yeast
    Cab5 is, or entirely soluble as suggested by the diffuse cytoplasmic signal in global localization
    screens?
suggested_experiments:
- description: Subcellular fractionation with protease protection of tagged cab5 in S. pombe, and complementation
    of an S. cerevisiae cab5 null by S. pombe cab5.
