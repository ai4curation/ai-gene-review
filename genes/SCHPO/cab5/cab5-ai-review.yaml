  label: Schizosaccharomyces pombe 972h-
description: cab5 (SPCC14G10.01) encodes a 236-residue CoaE-family P-loop kinase, the fission-yeast ortholog
  of budding-yeast Cab5, the dephospho-CoA kinase that phosphorylates the 3'-hydroxyl of the ribose of
  3'-dephospho-CoA with ATP to form coenzyme A, the final step of CoA biosynthesis. The protein is a single
  DPCK domain with a Walker A ATP-binding loop; the preceding phosphopantetheine adenylyltransferase step
  is carried out by the separate protein cab4. Function is inferred from family membership and orthology
  rather than S. pombe biochemistry. GFP/YFP fusions localise to the cytoplasm, and by orthology to S.
  cerevisiae Cab5 the enzyme is expected to be peripherally associated with the cytosolic face of the
  mitochondrial outer membrane.
