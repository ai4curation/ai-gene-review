suggested_questions:
- question: Is the propionyl- and butyryl-CoA turnover of met6 seen in vitro ever physiologically relevant, or is
    acetyl-CoA availability alone sufficient to explain the acyl donor used in vivo?
- question: How do met6 and its MetX-family paralog cys2 partition acceptor (homoserine versus serine) and acyl-donor
    specificity, given that cys2 mutants require cysteine rather than methionine?
suggested_experiments:
- description: Compare purified met6 and cys2 with acetyl-CoA versus succinyl-CoA and L-homoserine versus L-serine,
    and test cross-complementation of the met6 and cys2 deletions.
  experiment_type: in vitro enzyme kinetics and genetic complementation
