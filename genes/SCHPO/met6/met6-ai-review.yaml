- id: PMID:17622533
  title: Six new amino acid-auxotrophic markers for targeted gene integration and disruption in fission
    yeast.
  findings:
  - statement: S. pombe has two MET2 homologues; met6 mutants need methionine while cys2 mutants need cysteine.
    supporting_text: The cys2 mutation required cysteine rather than methionine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; genetic evidence that met6, not its paralog cys2, serves methionine synthesis.
- id: PMID:9829945
  title: Methionine induces sexual development in the fission yeast Schizosaccharomyces pombe via an ste11-dependent
    signalling pathway.
  findings:
  - statement: The met6 gene was cloned by complementation of the met6-31 methionine auxotroph and identified as
      homoserine acyltransferase.
    supporting_text: We isolated and sequenced the met6 gene and demonstrated that it codes for homoserine
      acyltransferase, the enzyme catalyzing the first reaction in the methionine-specific biosynthetic pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. The paper's subject is methionine signalling in sexual development; met6 cloning
      and the auxotroph are a side result, which supports the IMP row.
