- id: PMID:16216079
  title: Catalytic mechanism of fungal homoserine transacetylase.
  findings:
  - statement: Purified S. pombe Met6 acetylates L-homoserine from acetyl-CoA by a ping-pong mechanism with an
      active-site serine nucleophile.
    supporting_text: Homoserine transacetylase therefore catalyzes the acetylation of L-homoserine via a covalent
      acyl-enzyme intermediate through an active-site Ser.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; UniProt kinetic data (ECO:0000269) from the same paper record Km values for
      acetyl-, propionyl- and butyryl-CoA. Defining biochemical reference for the acetyl-CoA assignment.
