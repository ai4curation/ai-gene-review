description: met6 (SPBC56F2.11; UniProt O60062) encodes homoserine O-acetyltransferase (homoserine transacetylase;
  EC 2.3.1.31), an alpha/beta-hydrolase-fold enzyme found in fungi and some bacteria. It acetylates L-homoserine
  from acetyl-CoA by a ping-pong mechanism, committing homoserine to methionine synthesis; the O-acetylhomoserine
  is then sulfhydrylated by met17 or used by the cystathionine route. met6 mutants are methionine auxotrophs.
  The enzyme is cytosolic in a genome-wide screen.
