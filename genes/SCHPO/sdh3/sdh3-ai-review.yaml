taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: sdh3 (SPCC330.12c; UniProt O74882) encodes the cytochrome b large membrane-anchor (SdhC)
  subunit, which binds heme b and ubiquinone with Sdh4, of mitochondrial succinate dehydrogenase (respiratory
  complex II), which oxidises succinate to fumarate in the TCA cycle and passes the electrons through
  FAD and Fe-S clusters to ubiquinone in the inner membrane. Function is assigned by orthology to the
  S. cerevisiae SDH subunits.
