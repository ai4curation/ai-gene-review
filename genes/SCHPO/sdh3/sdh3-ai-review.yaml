  review:
    summary: EXP from the S. pombe/S. japonicus tracing study. GO:0019643 is the autotrophic, CO2-fixing
      reductive TCA cycle; the paper discusses the fermentative reductive branch (oxaloacetate to succinate)
      in yeasts. sdh3 deletion was used to break the oxidative cycle. The term does not describe Sdh3
      function.
