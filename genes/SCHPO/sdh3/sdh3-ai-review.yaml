- term:
    id: GO:0042721
    label: TIM22 mitochondrial import inner membrane insertion complex
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  supporting_entities:
  - SGD:S000001624
  review:
    summary: Transfer from S. cerevisiae, where Sdh3 is shared with the TIM22 carrier-translocase complex.
      Plausible in S. pombe but not shown.
    action: KEEP_AS_NON_CORE
    reason: The evidence is from the S. cerevisiae ortholog, in which genetic and biochemical work identified
      Sdh3 as a subunit of the TIM22 complex that forms a subcomplex with Tim18 (Gebert et al. 2011, PMID:22152483).
      No S. pombe experiment tests TIM22 membership, and whether a Tim18 partner exists in fission yeast is
      not established here, so the row is kept as a non-core, ortholog-based claim.
    supported_by:
    - reference_id: PMID:22152483
      supporting_text: We have identified a further subunit of the carrier translocase (TIM22 complex) that
        surprisingly is identical to subunit 3 of respiratory complex II, succinate dehydrogenase (Sdh3).
    - reference_id: PMID:22152483
      supporting_text: Sdh3 forms a subcomplex with Tim18 and is involved in biogenesis and assembly of the
        membrane-integral subunits of the TIM22 complex.
