    supported_by:
    - reference_id: PMID:1706223
      supporting_text: >-
        We show here that a related 66 kd kinase, called mik1, acts redundantly with wee1 in the negative regulation
        of cdc2 in S. pombe.
      reference_section_type: ABSTRACT
    - reference_id: PMID:1706223
      supporting_text: >-
        In the absence of mik1 and wee1 activity, cdc2 rapidly loses phosphate on tyrosine, both in strains undergoing
        mitotic lethality and in those that are viable owing to a compensating mutation within cdc2.
      reference_section_type: ABSTRACT
- term:
    id: GO:0010972
    label: negative regulation of G2/M transition of mitotic cell cycle
  evidence_type: IGI
  original_reference_id: PMID:1706223
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPCC18B5.03
  review:
    summary: >-
      Lundgren et al. (1991) cloned mik1 as a wee1-related 66 kDa kinase. A mik1 null has no discernible phenotype,
      but the mik1 wee1 double mutant is hypermitotically lethal, bypassing the requirements for Start, for
      completion of S phase and for the Cdc25 activator, and Cdc2 rapidly loses tyrosine phosphate in the absence
      of both kinases. The genetic interaction with wee1 (PomBase:SPCC18B5.03) establishes Mik1 as a redundant
      negative regulator of mitotic entry.
    action: ACCEPT
    reason: >-
      Classic genetic evidence for the core function; the direction (inhibition of G2/M via Cdc2 tyrosine
      phosphorylation) and the redundancy with Wee1 are both captured by this term, and the mechanism was
      subsequently shown to be direct (PMID:7982971).
    supported_by:
    - reference_id: PMID:1706223
      supporting_text: >-
        A null allele of mik1 has no discernible phenotype, but a mik1 wee1 double mutant is hypermitotically
        lethal
      reference_section_type: ABSTRACT
    - reference_id: PMID:1706223
      supporting_text: >-
        In the absence of mik1 and wee1 activity, cdc2 rapidly loses phosphate on tyrosine, both in strains undergoing
        mitotic lethality and in those that are viable owing to a compensating mutation within cdc2.
      reference_section_type: ABSTRACT
- term:
    id: GO:0010972
    label: negative regulation of G2/M transition of mitotic cell cycle
  evidence_type: IGI
  original_reference_id: PMID:25533348
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPBC16A3.07c
  review:
    summary: >-
      Caetano et al. (2014) studied deregulation of the MBF G1/S regulon by deleting the corepressor Nrm1
      (PomBase:SPBC16A3.07c). mik1 is an MBF target whose transcription is derepressed in nrm1 mutants
      (PMID:18662996 lists mik1 among the MBF-regulated genes important for surviving replication stress). The
      cached abstract does not name mik1, but the PomBase curators, working from the full text, recorded that
      the mik1 nrm1 double deletion has normal vegetative cell length, i.e. loss of Mik1 suppresses the
      Mik1-dependent G2 delay (elongation) of nrm1 cells, and annotated the genetic interaction to negative
      regulation of G2/M transition.
    action: ACCEPT
    reason: >-
      The genetic interaction is consistent with everything else known about Mik1 (elevated Mik1 delays mitotic
      entry; PMID:1706223 overexpression phenotype) and with mik1 being an MBF/Nrm1-regulated gene. The full
      text is not in the cache, so the curator's reading is deferred to; the term is the correct one for the
      biology and is already independently supported.
    supported_by:
    - reference_id: PMID:25533348
      supporting_text: >-
        We report that deregulating the MBF G1/S regulon by eliminating the Nrm1 corepressor increases replication
        errors.
      reference_section_type: ABSTRACT
    - reference_id: PMID:18662996
      supporting_text: >-
        But it also assures the continued expression of the three genes known to be important for the survival
        of replication stress: cdc22 , encoding the large subunit of ribonucleotide reductase; mik1 , encoding
        a mitosis-inhibiting kinase ( 6 , 29 ); and mrc1 , encoding the Cds1 mediator ( 34 ).
      reference_section_type: DISCUSSION
