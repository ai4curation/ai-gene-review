- term:
    id: GO:0110031
    label: negative regulation of G2/MI transition of meiotic cell cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008315181
  - PomBase:SPBC660.14
  - PomBase:SPCC18B5.03
  review:
    summary: >-
      PAINT inference from the same node (PTN008315181) as the mitotic term, seeded by the S. pombe mik1 and
      wee1 experimental annotations (mik1's own IMP, PMID:25492408, is among the sources). In fission yeast
      meiosis, Cds1-dependent replication checkpoint signalling maintains Cdc2 Tyr15 phosphorylation through
      Mik1/Wee1 to prevent premature meiosis I; inactivating Mik1/Wee1 triggers nuclear divisions and overrides
      the checkpoint (PMID:25492408, PMID:10521402).
    action: ACCEPT
    reason: >-
      Genuine meiotic effector role, corroborated by experimental genetics in the target organism and treated
      the same way in the S. pombe wee1 and S. cerevisiae SWE1 reviews; secondary to the mitotic function but
      the same catalytic output. The target appearing in its own WITH/FROM is expected, not circular.
    supported_by:
    - reference_id: PMID:25492408
      supporting_text: >-
        Meanwhile, activation of Cds1 inhibits CDK activity by activating Mik1 and Wee1 tyrosine kinases (Murakami
        & Nurse 1999), thus preventing entry into meiotic nuclear divisions.
      reference_section_type: INTRODUCTION
    - reference_id: PMID:10521402
      supporting_text: >-
        When DNA replication is blocked, the checkpoint maintains Cdc2 tyrosine 15 phosphorylation keeping Cdc2
        protein kinase activity low and preventing onset of meiosis I.
      reference_section_type: ABSTRACT
- term:
    id: GO:0110031
    label: negative regulation of G2/MI transition of meiotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:25492408
  qualifier: involved_in
  review:
    summary: >-
      Kakui et al. (2015; full text cached) showed that inactivating Mik1/Wee1 (mik1 deletion combined with
      wee1-50 at the restrictive temperature) causes meiotic nuclei to condense and enter nuclear division
      shortly after horsetail movement ceases, shortens the duration of horsetail movements from ~120 min to
      15-25 min even in the presence of hydroxyurea, and overrides the Cds1-dependent meiotic DNA replication
      checkpoint; csn1 mik1 wee1-50 triple mutants are inviable. Mik1 and Wee1 thus restrain the G2/MI
      transition by Tyr15 phosphorylation of Cdc2, counteracting Cdc25.
    action: ACCEPT
    reason: >-
      Direct mutant-phenotype evidence in the target organism for a meiotic effector role that uses the same
      Cdc2-Tyr15 kinase output as the mitotic function. The experiment used the mik1 wee1-50 double mutant, so
      the contribution attributed to Mik1 is redundant with Wee1, but Murakami and Nurse (1999) reached the same
      conclusion for the pat1-driven meiotic replication checkpoint with the same genotype (PMID:10521402).
      Genuine, non-expression-based meiotic annotation.
    supported_by:
    - reference_id: PMID:25492408
      supporting_text: >-
        Mik1/Wee1 phosphorylates Cdc2 on Tyr15 (Lundgren et al. 1991), therefore preventing Cdc25-mediated
        dephosphorylation at the same site.
      reference_section_type: RESULTS
    - reference_id: PMID:25492408
      supporting_text: >-
        These results indicate that inactivation of Mik1/Wee1 overcomes the DNA replication checkpoint.
      reference_section_type: RESULTS
    - reference_id: PMID:25492408
      supporting_text: >-
        These results indicate that inactivation of Mik1/Wee1 triggers nuclear divisions, consistent with the
        results obtained from the Cdc25 overproduction experiments.
      reference_section_type: RESULTS
