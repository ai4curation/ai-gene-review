  review:
    summary: >-
      Genome-wide ORFeome localisation study (Matsuyama et al. 2006) in which ~4,400 S. pombe proteins were
      C-terminally YFP-tagged and imaged; PomBase recorded Mik1 in the nucleus (and cytosol). Nuclear localisation
      fits the biology: the substrate Cdc2-Cdc13 is inhibited in the nucleus, and Mik1 accumulates in the nucleus
      during S phase and replication arrest in a checkpoint-dependent manner (deep research; PMID:10637286 for
      S-phase peak abundance).
    action: ACCEPT
    reason: >-
      High-throughput but curator-recorded direct localisation, concordant with Mik1's function as a nuclear
      Cdc2-Tyr15 kinase and with the independent IBA nucleus annotation. The nucleus is the principal site of
      action.
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: >-
        Next, we determined the localization of 4,431 proteins, corresponding to approximately 90% of the fission
        yeast proteome, by tagging each ORF with the yellow fluorescent protein.
      reference_section_type: ABSTRACT
    - reference_id: file:SCHPO/mik1/mik1-deep-research-falcon.md
      supporting_text: >-
        Mik1 has been reported to accumulate in the nucleus during S phase after hydroxyurea treatment, consistent
        with access to nuclear Cdc2 complexes during replication-checkpoint arrest.
