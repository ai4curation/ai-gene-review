suggested_questions:
- question: >-
    Does Mik1 have any physiological serine/threonine substrate (including Cdc2 Thr14, which in S. pombe is
    reported to be Wee1-dependent), or is its Ser/Thr activity limited to autophosphorylation? The record
    carries EC 2.7.11.1 and Rhea-derived serine kinase terms, yet the only characterised substrate residue is
    Cdc2 Tyr15.
  experts:
  - Piwnica-Worms H
  - Russell P
- question: >-
    How is Mik1 stabilised by checkpoint signalling: is it a direct Cds1 or Chk1 phosphosubstrate, and which
    ubiquitin ligase governs its normally short half-life? Ubiquitinated Mik1 accumulates in proteasome mutants,
    but the E3 and the checkpoint-regulated step have not been identified.
  experts:
  - Rhind N
  - Russell P
- question: >-
    Is Mik1 constitutively nuclear or does it shuttle, and does its S-phase/checkpoint nuclear accumulation
    reflect import, retention, or simply synthesis? The ORFeome screen reports both nuclear and cytosolic
    signal, and cell-cycle-resolved live imaging of endogenously tagged Mik1 has not been reported.
  experts:
  - Rhind N
- question: >-
    Should mik1 carry checkpoint-signalling process terms? wee1 is annotated to mitotic DNA damage checkpoint
    signaling (GO:0044773, IGI with chk1) and rad24 to mitotic DNA replication checkpoint signaling
    (GO:0033314) from the same paper (PMID:10523629) in which mik1 deletion plus Cdc25/14-3-3 disruption
    bypasses the replication checkpoint; mik1 is required for the damage checkpoint response in cdc25-null
    cells and for long-term arrest (PMID:10637286). PomBase has not added these terms to mik1, so they are
    used here only in core_functions and are raised for curator consideration rather than asserted as new
    annotations.
  experts:
  - Wood V
  - Rhind N
suggested_experiments:
- hypothesis: >-
    Mik1 is a direct substrate of Cds1 (replication arrest) and/or Chk1 (DNA damage), and phosphorylation
    protects it from ubiquitin-dependent degradation.
  description: >-
    Map Mik1 phosphosites by mass spectrometry in hydroxyurea- and bleomycin-treated wild-type versus cds1 and
    chk1 deletion cells; test purified Cds1/Chk1 kinase activity on recombinant Mik1 in vitro; then measure
    Mik1 half-life (cycloheximide chase) of phosphosite-mutant alleles and assay checkpoint maintenance in
    cdc25-null backgrounds.
  experiment_type: phosphoproteomics, in vitro kinase assay and protein-stability measurements
- hypothesis: >-
    Mik1's Ser/Thr activity is dispensable in vivo and its function is fully explained by Cdc2 Tyr15
    phosphorylation.
  description: >-
    Compare the phenotypes (cell length, HU and DNA-damage checkpoint maintenance, meiotic timing) of a
    cdc2-Y15F strain with wee1-50 mik1 double mutants and of mik1 overexpression in cdc2-Y15F cells; use an
    analogue-sensitive mik1 allele with thiophosphate labelling to capture direct substrates and classify
    phosphoacceptor residues.
  experiment_type: chemical-genetic substrate labelling and epistasis analysis
