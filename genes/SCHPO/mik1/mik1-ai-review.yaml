  review:
    summary: >-
      Lee, Enoch and Piwnica-Worms (1994) overproduced Mik1 in insect cells and in S. pombe; Mik1 immunoprecipitates
      from both sources phosphorylated Cdc2 on Tyr15, a kinase-deficient mutant did not, and after gel filtration
      of partially purified insect-cell Mik1 the Tyr15 kinase activity co-eluted with the ~68 kDa monomeric form
