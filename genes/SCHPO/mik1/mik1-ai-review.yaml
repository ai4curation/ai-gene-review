    action: KEEP_AS_NON_CORE
    reason: >-
      Not wrong for a dual-specificity Wee1-family kinase, but the core catalytic output is tyrosine phosphorylation
      of Cdc2; kept as a non-core activity rather than promoted to core, in line with the treatment of the same
      EC-derived row on S. cerevisiae SWE1 and the Ser/Thr rows on S. pombe wee1.
    supported_by:
