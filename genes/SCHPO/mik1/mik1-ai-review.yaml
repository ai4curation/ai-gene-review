gene_symbol: mik1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: >-
  Mik1 is a Wee1-family protein kinase of the fission yeast Schizosaccharomyces pombe (581 residues; C-terminal
  kinase domain, residues 289-561) that phosphorylates the cyclin-dependent kinase Cdc2 (Cdk1) on the inhibitory
  residue Tyr15 and so holds the mitotic Cdc2-Cdc13 complex inactive. It acts redundantly with its paralogue Wee1:
  a mik1 null has no discernible phenotype during unperturbed growth, whereas wee1 mik1 double mutants lose Cdc2
  tyrosine phosphorylation and die by mitotic catastrophe, entering mitosis before DNA replication is complete and
  independently of the Cdc25 activator. Unlike Wee1, whose activity dominates the size-dependent timing of mitosis,
  Mik1 is a periodic, short-lived, MBF-regulated (G1/S-transcribed) protein whose mRNA and protein peak around S
  phase; it accumulates in the nucleus when DNA replication is blocked, in a manner dependent on the checkpoint
  kinases Rad3 and Cds1, and its abundance also rises after DNA damage in a Chk1-dependent manner. Mik1 thereby
  provides the Cdc2-Tyr15 phosphorylation arm of the DNA replication and DNA damage checkpoints, acting together
  with checkpoint inhibition of Cdc25: it is required for the checkpoint response in cells lacking Cdc25, for
  long-term damage-induced arrest, and, with Wee1, for the Cds1-dependent replication checkpoint that restrains
  meiotic nuclear divisions. Its stability depends on the Hsp90 chaperone complex, and Mik1 is degraded by the
  ubiquitin-proteasome system. Although the enzyme belongs to the Ser/Thr kinase superfamily and Wee1-family
  kinases are dual-specificity enzymes, the only characterised physiological substrate residue is Cdc2 Tyr15.
