      Abstract-only in the cache and does not name Mik1 individually; the localisation is a curator-recorded
      screen result consistent with the biology (nuclear Cdc2 inhibition, checkpoint-dependent nuclear
      accumulation).
- id: PMID:1706223
  title: mik1 and wee1 cooperate in the inhibitory tyrosine phosphorylation of cdc2.
  findings:
  - statement: >-
      Discovery paper: mik1 encodes a 66 kDa wee1-related kinase acting redundantly with wee1 in the negative
      regulation of cdc2.
    supporting_text: >-
      We show here that a related 66 kd kinase, called mik1, acts redundantly with wee1 in the negative regulation
      of cdc2 in S. pombe.
  - statement: >-
      mik1 null cells have no discernible phenotype, whereas mik1 wee1 double mutants undergo lethal premature
      mitosis that bypasses Start, S-phase completion and the need for cdc25.
    supporting_text: >-
      A null allele of mik1 has no discernible phenotype, but a mik1 wee1 double mutant is hypermitotically
      lethal
  - statement: >-
      Cdc2 loses tyrosine phosphate rapidly when both mik1 and wee1 are inactivated.
    supporting_text: >-
      In the absence of mik1 and wee1 activity, cdc2 rapidly loses phosphate on tyrosine, both in strains undergoing
      mitotic lethality and in those that are viable owing to a compensating mutation within cdc2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational genetic characterisation of mik1; abstract-only in the cache.
- id: PMID:7982971
  title: mik1+ encodes a tyrosine kinase that phosphorylates p34cdc2 on tyrosine 15.
  findings:
  - statement: >-
      Mik1 immunoprecipitates from insect cells and from S. pombe phosphorylate Cdc2 on Tyr15; a kinase-deficient
      mutant does not.
    supporting_text: >-
      Immunoprecipitates of Mik1 from both sources catalyzed the phosphorylation of p34cdc2 on tyrosine 15
      whereas immunoprecipitates of a kinase-deficient mutant of Mik1 were negative in this assay.
  - statement: >-
      The Tyr15 kinase activity co-purifies with monomeric (~68 kDa) Mik1, so Mik1 is itself the tyrosine kinase.
    supporting_text: The tyrosine 15 kinase activity co-eluted with the 68 kDa form of Mik1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical demonstration of the core activity; abstract-only in the cache.
- id: PMID:25492408
  title: Meiotic nuclear movements in fission yeast are regulated by the transcription
    factor Mei4 downstream of a Cds1-dependent replication checkpoint pathway.
  findings:
  - statement: >-
      Inactivation of Mik1/Wee1 (mik1 deletion plus wee1-50) triggers meiotic nuclear divisions shortly after
      horsetail movement ceases and overrides the Cds1-dependent meiotic DNA replication checkpoint.
    supporting_text: >-
      These results indicate that inactivation of Mik1/Wee1 overcomes the DNA replication checkpoint.
  - statement: >-
      The Cds1 checkpoint maintains Cdc2 inhibition through Mik1 and Wee1 during meiosis.
    supporting_text: >-
      Meanwhile, activation of Cds1 inhibits CDK activity by activating Mik1 and Wee1 tyrosine kinases (Murakami
      & Nurse 1999), thus preventing entry into meiotic nuclear divisions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Experiments use the mik1 wee1-50 double mutant, so the meiotic role is attributed to
      Mik1 and Wee1 jointly.
- id: PMID:25533348
  title: Tolerance of deregulated G1/S transcription depends on critical G1/S regulon
    genes to prevent catastrophic genome instability.
  findings:
  - statement: >-
      Deletion of the MBF corepressor Nrm1 deregulates the G1/S regulon, which includes mik1; PomBase records
      from this paper that mik1 nrm1 double deletion has normal vegetative cell length.
    supporting_text: >-
      We report that deregulating the MBF G1/S regulon by eliminating the Nrm1 corepressor increases replication
      errors.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache and the abstract does not mention mik1; the mik1-nrm1 genetic interaction was
      curated from the full text (PomBase phenotype record: mik1delta nrm1delta, normal vegetative cell length).
- id: PMID:10637286
  title: Regulation of mitotic inhibitor Mik1 helps to enforce the DNA damage checkpoint.
  findings:
  - statement: >-
      Mik1 is positively regulated by the DNA damage checkpoint: Mik1 is required for the checkpoint response
      in cells lacking Cdc25, long-term damage-induced arrest fails in mik1 deletion cells, and DNA damage
      raises Mik1 abundance in a Chk1-dependent manner.
    supporting_text: >-
      Mik1 is required for checkpoint response in strains that lack Cdc25. Long-term DNA damage checkpoint arrest
      fails in Deltamik1 cells. DNA damage increases Mik1 abundance in a Chk1-dependent manner.
  - statement: >-
      Mik1 is a short-lived, ubiquitinated protein whose mRNA and protein oscillate with a peak around S phase.
    supporting_text: >-
      Mik1 protein and mRNA oscillate during the unperturbed cell cycle, with peak amounts detected around S
      phase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache; establishes Mik1 as a checkpoint-regulated effector.
- id: PMID:9042863
  title: Cdc2 tyrosine phosphorylation is required for the DNA damage checkpoint in
    fission yeast.
  findings:
  - statement: >-
      The G2 DNA damage checkpoint arrest depends on the inhibitory tyrosine phosphorylation of Cdc2 carried out
      by Wee1 and Mik1.
    supporting_text: >-
      We show that, in contrast to recent speculation, the G2 DNA damage checkpoint arrest in S. pombe depends
      on the inhibitory tyrosine phosphorylation of Cdc2 carried out by the Wee1 and Mik1 kinases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache.
- id: PMID:10521402
  title: Meiotic DNA replication checkpoint control in fission yeast.
  findings:
  - statement: >-
      During meiosis the replication checkpoint maintains Cdc2 Tyr15 phosphorylation to prevent meiosis I; the
      experiments removing this control used a pat1 mik1 wee1-ts strain lacking both Cdc2 Tyr15 kinases.
    supporting_text: >-
      When DNA replication is blocked, the checkpoint maintains Cdc2 tyrosine 15 phosphorylation keeping Cdc2
      protein kinase activity low and preventing onset of meiosis I.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:10523629
  title: DNA damage and replication checkpoints in fission yeast require nuclear exclusion
    of the Cdc25 phosphatase via 14-3-3 binding.
  findings:
  - statement: >-
      Deleting mik1 together with disrupting Cdc25/14-3-3 binding almost completely bypasses the DNA replication
      checkpoint, showing that Mik1 and Cdc25 inhibition are parallel arms of the checkpoint.
    supporting_text: >-
      Here we show that a more complete disruption of Cdc25/14-3-3 interactions coupled with mik1 + deletion
      results in an almost complete bypass of the DNA replication checkpoint.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:18662996
  title: The DNA replication checkpoint directly regulates MBF-dependent G1/S transcription.
  findings:
  - statement: >-
      mik1 is one of the MBF-regulated G1/S genes whose continued expression under replication stress is
      important for survival.
    supporting_text: >-
      But it also assures the continued expression of the three genes known to be important for the survival
      of replication stress: cdc22 , encoding the large subunit of ribonucleotide reductase; mik1 , encoding
      a mitosis-inhibiting kinase ( 6 , 29 ); and mrc1 , encoding the Cds1 mediator ( 34 ).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; used for the MBF/Nrm1 regulation of mik1 transcription.
- id: PMID:26131711
  title: Two Distinct Cdc2 Pools Regulate Cell Cycle Progression and the DNA Damage
    Response in the Fission Yeast S.pombe.
  findings:
  - statement: >-
      Mik1 modifies Cdc2 Tyr15 as cells progress through S phase; loss of Mik1 alone does not detectably alter
      Cdc2 phosphorylation during vegetative growth.
    supporting_text: >-
      In S.pombe, Y15 is also modified by Mik1 kinase when cells progress through S phase [6, 7].
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached; background statement and mik1 deletion control experiments.
- id: file:SCHPO/mik1/mik1-deep-research-falcon.md
  title: Deep research summary for S. pombe mik1 (falcon provider)
  findings:
  - statement: >-
      Literature synthesis: Mik1 is a WEE-family kinase that phosphorylates Cdc2 Tyr15, acts redundantly with
      Wee1, becomes important during S phase and checkpoint arrest, accumulates in the nucleus under replication
      arrest, and depends on Hsp90 for stability.
    supporting_text: >-
      Replication or DNA-damage checkpoint signaling increases Mik1 activity and/or abundance, preserving
      inhibitory Cdc2 Tyr15 phosphorylation until replication or repair is sufficiently complete.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Consistent with the primary literature checked here; its nuclear-localisation statement rests on a thesis
      and is treated as supporting rather than primary evidence.
