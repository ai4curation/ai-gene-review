  review:
    summary: >-
      EC-number mapping (UniProt assigns EC 2.7.11.1 to mik1 and states that the kinase 'acts both on serines
      and on tyrosines'). Wee1-family kinases are dual-specificity enzymes, so serine/threonine activity is
      credible, but the physiologically defining reaction of Mik1 is phosphorylation of Cdc2 on Tyr15, a tyrosine
