  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008315181
  - PomBase:SPBC660.14
  - PomBase:SPCC18B5.03
  - UniProtKB:G5EB22
  - UniProtKB:Q91618
  - UniProtKB:Q99640
  review:
    summary: >-
      PAINT inference from node PTN008315181, seeded by S. pombe wee1 and mik1 (mik1's own IGI, PMID:1706223,
      is among the sources), C. elegans WEE-1.3 (G5EB22), Xenopus Wee1 (Q91618) and human PKMYT1 (Q99640). Mik1
      inhibits mitotic entry by phosphorylating Cdc2 on Tyr15: mik1 wee1 double mutants lose Cdc2 tyrosine
