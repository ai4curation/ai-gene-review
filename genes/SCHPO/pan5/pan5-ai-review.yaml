  label: Schizosaccharomyces pombe 972h-
description: Probable 2-dehydropantoate 2-reductase (ketopantoate reductase, PanE-like; EC 1.1.1.169)
  of fission yeast, encoded by SPBPB2B2.09c. By homology it reduces 2-dehydropantoate to (R)-pantoate
  using NADPH, the second step of pantoate synthesis, which with beta-alanine is condensed to pantothenate
  by pan6. The protein is cytosolic and nuclear in a genome-wide YFP-fusion screen. Activity has not been
  measured in S. pombe, and in S. cerevisiae loss of the ortholog PAN5 still allows prototrophic growth,
  implying redundancy with other reductases.
