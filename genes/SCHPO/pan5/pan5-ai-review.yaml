  review:
    summary: IBA for mitochondrion from the fungal node PTN001093729, whose only donor is SGD:S000002605.
      That SGD id is not S. cerevisiae PAN5 (SGD:S000001105); the S. cerevisiae PAN5 review identifies
      it as CBS2, a divergent mitochondrial member of this family (a cytochrome b translational activator).
      pan5 has no predicted transit peptide and was seen in cytosol and nucleus in S. pombe. The PomBase
      pantothenate GO-CAM (67b1629100001098) nevertheless places pan5 activity in the mitochondrion on
      the basis of this IBA.
    action: REMOVE
    reason: Location propagated from a functionally divergent paralog; S. pombe localisation data (cytosol/nucleus)
      contradict it. Same conclusion as the S. cerevisiae PAN5 review.
