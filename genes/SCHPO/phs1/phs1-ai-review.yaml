  label: Schizosaccharomyces pombe 972h-
description: SPBC19C2.15c (PomBase phs1) encodes the fission yeast very-long-chain (3R)-3-hydroxyacyl-CoA
  dehydratase (HACD/PTPLA family; EC 4.2.1.134), a multi-pass endoplasmic reticulum membrane protein orthologous
  to S. cerevisiae PHS1 and human HACD1/HACD2. It dehydrates (3R)-3-hydroxyacyl-CoA to trans-2-enoyl-CoA,
  the third of the four reactions of each ER fatty-acid elongation cycle (after condensation by elo1/elo2
  and reduction by ifa38, before reduction by tsc13), and so contributes to the very-long-chain fatty
  acids that form the acyl chains of S. pombe ceramides and sphingolipids. It is the only HACD-family
  protein in S. pombe; its function is inferred from orthology and ER localisation, without S. pombe-specific
  biochemistry.
