description: htd2 (SPBC1105.15c; UniProt Q9Y814) encodes the mitochondrial hydroxyacyl-thioester dehydratase
  type 2 (Htd2), which dehydrates (R)-3-hydroxyacyl-ACP to trans-2-enoyl-ACP in mitochondrial type II
  fatty acid synthesis. Function is assigned by orthology to S. cerevisiae HTD2.
