- term:
    id: GO:0046084
    label: adenine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:15704224
  qualifier: involved_in
  review:
    summary: Fujita et al. 2005 built an ade7::loxP host and used ade7+ as an auxotrophic marker; the adenine requirement
      of ade7 mutants was annotated as 'adenine biosynthetic process'. The de novo pathway synthesises ribonucleotides
      (IMP, then AMP/GMP), not the free base adenine, so the mutant phenotype reflects a block in de novo IMP synthesis.
      Same correction as made for S. cerevisiae ADE8 and ADE5,7.
    action: MODIFY
    reason: The pathway product is IMP, not free adenine; adenine auxotrophy reflects loss of de novo IMP synthesis.
    proposed_replacement_terms:
    - id: GO:0006189
      label: '''de novo'' IMP biosynthetic process'
    supported_by:
    - reference_id: PMID:15704224
      supporting_text: We developed three new auxotrophic marker genes (arg12(+), tyr1(+) and ade7(+))
