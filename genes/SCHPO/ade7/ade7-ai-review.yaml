taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ade7 (SPBC409.10) encodes the fission yeast phosphoribosylaminoimidazole-succinocarboxamide (SAICAR)
  synthetase (EC 6.3.2.6), the PurC-family enzyme that ligates L-aspartate to 5-aminoimidazole-4-carboxylate ribonucleotide
  (CAIR) using ATP to form SAICAR, the seventh step of de novo IMP biosynthesis. ade7 mutants require adenine, and
  ade7+ is used as an auxotrophic selectable marker. Partially purified S. pombe SAICAR synthetase also accepts
  the aspartate analogue cysteine sulfinate in vitro, and ade7 function was genetically linked to formation of the
  phytochelatin-cadmium-sulfide complex required for cadmium tolerance. The protein is a soluble cytosolic enzyme;
  it is the ortholog of S. cerevisiae ADE1 and of the SAICAR synthetase domain of human PAICS.
