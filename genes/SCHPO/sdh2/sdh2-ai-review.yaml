  label: Schizosaccharomyces pombe 972h-
description: sdh2 (SPAC140.01; UniProt P21911) encodes the iron-sulfur (SdhB) subunit, carrying the [2Fe-2S],
  [4Fe-4S] and [3Fe-4S] relay, of mitochondrial succinate dehydrogenase (respiratory complex II), which
  oxidises succinate to fumarate in the TCA cycle and passes the electrons through FAD and Fe-S clusters
  to ubiquinone in the inner membrane. Function is assigned by orthology to the S. cerevisiae SDH subunits.
