  label: Schizosaccharomyces pombe 972h-
description: alg11 (gmd3; SPCC330.08; UniProt O74878) encodes the GDP-Man:Man3GlcNAc2-PP-Dol alpha-1,2-mannosyltransferase
  Alg11, which adds the fourth and fifth mannoses to give Man5GlcNAc2-PP-Dol, the last cytoplasmic-face
  intermediate before flipping. gmd3/alg11 mutants underglycosylate cell-surface galactomannoproteins
  and are suppressed by S. cerevisiae ALG11. In the cytoplasmic phase of dolichol-linked oligosaccharide
  (Glc3Man9GlcNAc2-PP-Dol) assembly on the ER membrane, it adds the next sugar to the growing precursor
  that oligosaccharyltransferase transfers to nascent glycoproteins. Function is assigned by orthology
  to the S. cerevisiae ALG enzymes.
