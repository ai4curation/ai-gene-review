taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: 'Spg1 (septum-promoting GTPase 1; also sid3) is the essential 198-residue Ras-superfamily
  small GTPase of Schizosaccharomyces pombe that sits at the head of the septation initiation network
  (SIN), the spindle-pole-body-scaffolded, Hippo-like kinase cascade that couples the end of mitosis to
  contractile-ring constriction and division-septum formation. Together with budding-yeast Tem1 it forms
  a distinct Tem1/Spg1 family closest to the Rab/Ypt GTPases; unlike most Ras-family proteins it has no
  C-terminal CAAX prenylation motif and is instead held on the cytoplasmic face of the spindle pole body
  (SPB) throughout the cell cycle by the Sid4-Cdc11 scaffold, which also docks its regulators. Spg1 cycles
  between an inactive GDP-bound and an active GTP-bound state. Its intrinsic GTP hydrolysis is slow and
  is accelerated by the highly specific two-component GTPase-activating protein Byr4-Cdc16, in which Byr4
  binds Spg1 and Cdc16 supplies the TBC-type catalytic subunit; Byr4-Cdc16 sits on the SPB in interphase
  and keeps Spg1 GDP-bound, and no canonical guanine-nucleotide exchange factor has been identified, although
  the cell-tip protein Etd1 binds Spg1 directly and is required for its full activation when the anaphase
  spindle brings the SPB near the cell end. In its GTP-bound form Spg1 binds the protein kinase Cdc7 and
  recruits it to the SPB; Cdc7 then activates Sid1-Cdc14, which activates Sid2-Mob1, the terminal kinase
  that moves to the contractile ring and drives ring constriction, septum synthesis and the release of
  the Cdc14-family phosphatase Clp1 from the nucleolus. Byr4-Cdc16 is removed from both SPBs at mitotic
  entry, so GTP-Spg1 and Cdc7 appear on both poles, but in anaphase the GAP returns to the old SPB and
  Spg1 is inactivated there while remaining active on the new SPB, giving the asymmetric SIN signalling
  that ensures a single, correctly timed round of septation; once the ring has constricted, Etd1 disappears
  from the half-cell with active Spg1 and the GAP returns, switching the pathway off. Loss of spg1 abolishes
  septum formation while growth, DNA replication and mitosis continue, producing elongated multinucleate
  cells; conversely, raising Spg1 levels or removing its GAP triggers septum formation from G1, S or G2
  cells, independently of Cdc2 activity but dependent on Cdc7, and drives repeated rounds of septation.
  Spg1 and the rest of the SIN also occupy the spindle pole body during meiosis, where SIN signalling in
  meiosis II is needed for the forespore membrane to encapsulate the haploid nuclei and form spores.'
