- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:9420333
  qualifier: enables
  review:
    summary: 'Sohrmann et al. showed that Spg1 is on the SPB throughout the cycle, that Cdc7 associates
      with SPBs only in mitosis, that Spg1 activity is required for Cdc7 localisation in vivo (but not
      for Cdc7 kinase activity in vitro), and, with a GDP-Spg1-preferring antiserum, that GTP-Spg1 predominates
      when Cdc7 is on the SPB and that Cdc7 is lost from the pole on which Spg1 is inactivated. PomBase
      captured the effector-recruitment function as signaling adaptor activity and models it in the SIN
      GO-CAM as a Spg1/GTP activity that directly positively regulates Cdc7 kinase activity.'
    action: MODIFY
    reason: 'The biology is exactly right, but the term is a poor fit by its own definition: GO:0035591
      is defined as a binding activity of a molecule that "itself does not have catalytic activity",
      whereas Spg1 is a GTPase with an accepted GTPase-activity IDA. What the paper demonstrates is the
      canonical small-GTPase switch: nucleotide-state-dependent binding of an effector kinase. GO:0003925
      G protein activity (a molecular function regulator that cycles between GTP- and GDP-bound states
      and in its active state binds effector proteins; is_a GTPase activity; narrow synonym small monomeric
      GTPase activity) was created for precisely this and is used for other signalling GTPases in this
      repository (S. pombe Cdc42, S. cerevisiae Tem1 with its effector Cdc15). Replacing the adaptor term
      keeps the effector-recruitment content while removing the definitional conflict.'
    proposed_replacement_terms:
