  review:
    summary: 'Schmidt et al. cloned spg1 as a multicopy suppressor of a dominant-negative cdc7 allele and
      showed the genetic interaction with cdc7 (SPBC21.06c) in both directions: Spg1-induced ectopic septation
      requires Cdc7 kinase activity, and increased Cdc7 expression bypasses the requirement for Spg1.
      Spg1 and Cdc7 co-immunoprecipitate and interact in two-hybrid assays, placing Spg1 immediately
      upstream of the Cdc7 kinase in the pathway that signals septum formation.'
    action: ACCEPT
    reason: 'This is the defining process of the gene: GO:0031028 is a small-GTPase-mediated signalling
      cascade that initiates contractile-ring constriction and septation, and Spg1 is the GTPase that
      relays the signal by recruiting Cdc7 to the SPB. The IGI with cdc7 is the founding epistasis evidence;
      PomBase''s SIN GO-CAM (66187e4700002284) models Spg1/GTP as part of this process, upstream of Cdc7
      kinase activity. Core.'
    supported_by:
    - reference_id: PMID:9203579
