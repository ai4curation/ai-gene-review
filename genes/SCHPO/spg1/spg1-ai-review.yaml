- description: 'GAP-controlled GTP hydrolysis that terminates SIN signalling: Spg1 hydrolyses bound GTP
    slowly on its own and much faster when stimulated by the Byr4-Cdc16 two-component GAP (Byr4 binds
    Spg1, Cdc16 supplies catalysis), which keeps Spg1 GDP-bound on interphase SPBs, inactivates it on the
    old SPB during anaphase to make SIN signalling asymmetric, and switches it off on the remaining SPB
    once ring constriction is complete and Etd1 is lost from that half-cell.'
  supported_by:
  - reference_id: PMID:9742395
    supporting_text: Byr4 inhibited the dissociation and hydrolysis of GTP bound to Spg1, but when Byr4
      and Cdc16 were combined together they displayed Spg1GAP activity in vitro; Cdc16 alone had no detectable
      GAP activity.
    reference_section_type: ABSTRACT
  - reference_id: PMID:10799520
    supporting_text: These results suggest that Byr4 localization to SPBs maintains Spg1 in an inactive
      form, presumably by stimulating Spg1 GTPase activity with Cdc16, and that loss of Byr4 from mitotic
      SPBs increases the active fraction of Spg1 and thereby increases Spg1-Cdc7 binding.
    reference_section_type: ABSTRACT
  - reference_id: PMID:9420333
    supporting_text: Furthermore, staining with this antibody shows that asymmetric distribution of Cdc7p
      may be mediated by inactivation of Spg1p on one spindle pole.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19736319
    supporting_text: Spg1 is active at just one of the two SPBs during cytokinesis.
    reference_section_type: ABSTRACT
