  review:
    summary: 'Garcia-Cortes and McCollum showed that Etd1 (SPAC1006.08), a cell-tip protein with weak
      similarity to the Ras-GEF domain of budding-yeast Lte1, binds Spg1 directly in vitro (MBP-Etd1 is
      pulled down by GST-Spg1), that a partially activated spg1 allele suppresses etd1-null cells, and
      that Etd1 is required for full activation of Spg1 in late anaphase when spindle elongation brings
      the SPB near the cell tips. Whether Etd1 is a bona fide GEF remained open: endogenous Spg1 could
      not be co-immunoprecipitated with Etd1 and the binding persisted in excess GppNHp, unlike most
      GEFs. Bare ''protein binding'' adds no information about Spg1''s own molecular function.'
    action: REMOVE
    reason: Generic GO:0005515 is uninformative. The functional content of this interaction is that Etd1
      is a positive regulator acting on Spg1, which in GO belongs on Etd1 (PomBase models it as GTPase
      activator activity in the SIN GO-CAM 66187e4700002284); Spg1's own contribution is captured by
      its GTP-binding, GTPase and G-protein switch activities and by septation initiation signaling.
      The full text is cached and confirms the direct in vitro binding, so removal does not assert that
      the interaction is false, only that the term carries no functional information.
    supported_by:
    - reference_id: PMID:19736319
      supporting_text: MBP-Etd1 (but not MBP) was specifically pulled down by GST-Spg1
      reference_section_type: RESULTS
    - reference_id: PMID:19736319
      supporting_text: Etd1 activates the guanosine triphosphatase (GTPase) Spg1 to trigger signaling
        through the septum initiation network (SIN) pathway and onset of cytokinesis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:19736319
      supporting_text: However, we were unable to coimmunoprecipitate endogenous Spg1 with Etd1 expressed
