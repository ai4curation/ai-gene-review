core_functions:
- description: 'Spindle-pole-body-anchored small GTPase switch that initiates the septation initiation
    network: GTP-bound Spg1, held on the SPB by the Sid4-Cdc11 scaffold and freed from Byr4-Cdc16 inhibition
    at mitotic entry, binds the protein kinase Cdc7 and recruits it to the SPB (persisting on the new
    SPB in anaphase), launching the Cdc7 -> Sid1-Cdc14 -> Sid2-Mob1 cascade that drives contractile-ring
    constriction and division-septum formation; Etd1 at the cell tips is required for full activation
    once the anaphase spindle has elongated.'
  supported_by:
  - reference_id: PMID:9203579
    supporting_text: These data indicate that Spg1p is a key element in controlling the onset of septum
      formation in Schizosaccharomyces pombe, and that it acts through the Cdc7p kinase.
    reference_section_type: ABSTRACT
  - reference_id: PMID:9420333
    supporting_text: Spg1p activity is required for localization of Cdc7p in vivo but not for its kinase
      activity in vitro.
    reference_section_type: ABSTRACT
  - reference_id: PMID:10799520
    supporting_text: As cells enter mitosis, Spg1 accumulates in an active, GTP-bound form and binds the
      Cdc7 protein kinase to cause Cdc7 translocation to SPBs.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19736319
    supporting_text: Spg1 is activated in late anaphase when spindle elongation brings spindle pole body
      (SPB)-localized Spg1 into proximity with its activator Etd1 at cell tips, ensuring that cytokinesis
      is only initiated when the spindle is fully elongated.
    reference_section_type: ABSTRACT
  - reference_id: file:SCHPO/spg1/spg1-deep-research-falcon.md
    supporting_text: Spg1 is therefore a signaling GTPase, not a metabolic enzyme, transporter, or structural
      ring component.
    reference_section_type: RESULTS
