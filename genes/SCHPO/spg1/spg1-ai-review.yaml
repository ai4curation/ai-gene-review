suggested_questions:
- question: Is Etd1 a genuine guanine-nucleotide exchange factor for Spg1, or does it activate Spg1 by
    another mechanism (e.g. protecting it from Byr4-Cdc16 or stabilising the GTP-bound form)? Etd1 binds
    Spg1 in vitro even in excess GppNHp, which is atypical for a GEF, and no nucleotide-exchange assay
    has been reported; the answer determines whether GEF activity should be annotated to Etd1.
- question: Does GTP-Spg1 allosterically activate the Cdc7 kinase, or does it act purely by concentrating
    Cdc7 on the Sid4-Cdc11 scaffold at the SPB? Spg1 inactivation does not reduce Cdc7 kinase activity
    in vitro, and forced tethering of Cdc7 to Cdc11 bypasses upstream activators, which favours a recruitment
    mechanism.
- question: Should PomBase's molecular-function term for the Cdc7-recruiting activity of Spg1 be G protein
    activity (GO:0003925) rather than signaling adaptor activity (GO:0035591), given that the adaptor definition
    excludes molecules with catalytic activity and Spg1 is annotated with GTPase activity from the same
    literature?
suggested_experiments:
- hypothesis: Etd1 does not catalyse GDP/GTP exchange on Spg1 but instead antagonises the Byr4-Cdc16
    GAP or stabilises Spg1-GTP.
  description: Measure mant-GDP release and GTP loading on purified Spg1 in the presence of purified Etd1
    (and Etd1 fragments aligned to the Lte1 CHD), with and without Byr4-Cdc16, to test directly for
    exchange activity versus GAP antagonism; complement with in vivo Cdc7-GFP SPB recruitment in etd1-null
    cells carrying GTP-locked spg1 alleles.
  experiment_type: biochemistry
- hypothesis: The nucleotide state of Spg1 on the old versus new SPB is set by differential Byr4-Cdc16
    residence rather than by differential Etd1 access.
  description: Quantitative live imaging of a nucleotide-state biosensor for Spg1 (e.g. a Cdc7 GTPase-binding-domain
    reporter) on old and new SPBs, marked with a photoconvertible SPB component, in wild type, cdc16-ts
    and etd1-null backgrounds across anaphase.
  experiment_type: cell biology
