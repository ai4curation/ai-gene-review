- term:
    id: GO:0140281
    label: positive regulation of mitotic division septum assembly
  evidence_type: IMP
  original_reference_id: PMID:9203579
  qualifier: involved_in
  review:
    summary: 'Schmidt et al. showed that spg1 is essential, that null and temperature-sensitive alleles
      fail to form a division septum while growth, S phase and mitosis continue (elongated multinucleate
      cells), and that increased Spg1 expression induces septum formation in G2, S-phase and pre-Start
      G1 cells independently of Cdc2 activity: Spg1 is a dosage-dependent inducer of septation.'
    action: ACCEPT
    reason: 'Founding loss- and gain-of-function evidence for the core process. Spg1 does not build the
      septum itself, but it is the switch whose activation state sets whether and when the SIN drives
      ring constriction and septum deposition, so a positive-regulation term is the correct relationship:
      absence abolishes septation and ectopic activation triggers it. Core.'
    supported_by:
    - reference_id: PMID:9203579
      supporting_text: Null or heat-sensitive alleles do not make a division septum, but growth, S-phase,
        and mitosis continue in the absence of cell division, producing elongated, multinucleate cells.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9203579
      supporting_text: Increased expression of Spg1p induces septum formation in G2, S-phase, and pre-Start
        G1-arrested cells. This requires the activity of Cdc7p kinase, but not p34(cdc2).
      reference_section_type: ABSTRACT
    - reference_id: PMID:9420333
      supporting_text: Increased expression of either gene leads to multiple rounds of septation without
        cell cleavage, emphasizing the need for precise cell cycle regulation of their activity.
      reference_section_type: ABSTRACT
