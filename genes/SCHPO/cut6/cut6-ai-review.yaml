  review:
    summary: IBA mitochondrion from PTN000429607, seeded by the mitochondrial S. cerevisiae paralogue HFA1 and by
      ACACB (outer mitochondrial membrane). In S. cerevisiae the equivalent row on cytosolic ACC1 was removed because
      HFA1 provides the mitochondrial pool. S. pombe, however, has a single ACC (cut6) and no HFA1 orthologue, and
      PomBase's fatty-acid GO-CAM (gomodel:678073a900002931) uses this IBA to place a second cut6 ACC activity in
      the mitochondrion supplying malonyl-CoA for mitochondrial FAS II. Dual targeting of cut6 is therefore biologically
      plausible but has not been shown (the ORFeome screen reports cytosol). Left undecided pending direct evidence.
    action: UNDECIDED
    reason: Plausible for the sole S. pombe ACC, but no experimental mitochondrial localization; node evidence derives
      from paralogues with dedicated mitochondrial roles.
