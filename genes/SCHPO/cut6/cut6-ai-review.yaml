suggested_questions:
- question: 'Since S. pombe lacks an HFA1-like mitochondrial ACC, how is malonyl-CoA supplied to mitochondrial fatty
    acid synthesis (lipoic acid): is a fraction of cut6 imported into mitochondria (e.g. by alternative translation
    start), or is another enzyme responsible?'
suggested_experiments:
- description: Tag endogenous cut6 and assess mitochondrial import (fractionation, protease protection), and test
    whether lipoylation of mitochondrial enzymes depends on cut6 under permissive versus restrictive conditions
    in cut6-ts cells.
