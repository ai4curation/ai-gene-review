    label: mitotic nuclear membrane biogenesis
  evidence_type: IMP
  original_reference_id: PMID:8769419
  qualifier: involved_in
  review:
    summary: 'IMP (Saitoh et al. 1996): cut6 ts mutants show the lsd (large and small daughter) nuclear-division
      defect, with asymmetric nuclear elongation; fatty acid shortage (cerulenin, lsd1/fas2 loss, rescued by palmitate)
      produces the same phenotype. S. pombe undergoes closed mitosis and must expand the nuclear envelope, so cut6
      is required for mitotic nuclear membrane growth via lipid supply. This is a genuine but downstream consequence
      of malonyl-CoA/fatty acid supply; non-core.'
