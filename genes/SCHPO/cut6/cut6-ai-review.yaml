taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: cut6 (SPAC56E4.04c) encodes the acetyl-CoA carboxylase (ACC, EC 6.4.1.2) of fission yeast, a large
  biotin-dependent multidomain enzyme that carries biotin carboxylase, biotin carboxyl carrier and carboxyltransferase
  activities on one polypeptide and is the orthologue of S. cerevisiae ACC1. It carboxylates acetyl-CoA to malonyl-CoA,
  the committed step of de novo fatty acid synthesis by the fas1/fas2 fatty acid synthase and the malonyl-CoA source
  for fatty acid elongation. cut6 is essential; temperature-sensitive cut6 mutants (named for the cell untimely
  torn phenotype) show unequal nuclear division with large and small daughter nuclei, a defect shared with fatty
  acid synthase mutants and attributed to insufficient lipid for nuclear envelope expansion during closed mitosis.
  The protein is cytosolic. S. pombe has no separate mitochondrial ACC paralogue comparable to budding-yeast HFA1.
