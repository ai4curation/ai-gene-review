  label: Schizosaccharomyces pombe 972h-
description: 'arg12 (SPBC428.05c) encodes argininosuccinate synthase (EC 6.3.4.5), the ortholog of S.
  cerevisiae ARG1. In the cytosol it condenses L-citrulline with L-aspartate using ATP (releasing AMP
  and diphosphate) to form 2-(N-omega-L-arginino)succinate, the penultimate step of L-arginine biosynthesis.
  In S. pombe the citrulline substrate is made in mitochondria and exported, so arg12 acts on citrulline
  after it leaves the organelle. arg12 disruption causes arginine auxotrophy and arg12 is used as a selectable
  marker. Note the nomenclature trap: S. pombe arg1 is acetylornithine aminotransferase, while S. cerevisiae
  ARG1 corresponds to S. pombe arg12.'
