- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: NAS
  original_reference_id: GO_REF:0000051
  qualifier: involved_in
  review:
    summary: >-
      PomBase keyword-mapping NAS. The only pombe data placing Zds1 in a signalling pathway are
      genetic: multicopy zds1 suppresses the sporulation defect of ras1delta but not of
      byr2/byr1/spk1 mutants, from which the authors proposed action in Ras1-MAPK signalling
      at the cortex. As a PP2A regulator it is plausibly a component of phosphatase-based
      signalling, but no pathway step has been assigned to it.
    action: KEEP_AS_NON_CORE
    reason: >-
      Very general but not wrong for a phosphatase regulatory protein with genetic links to
      Ras1-MAPK signalling; no more specific signalling term is supported by direct evidence.
    supported_by:
    - reference_id: PMID:16322512
      supporting_text: Localization of the C-terminal region of Zds1 in the cell cortex also
        indicated that Zds1 functions in the signaling of the Ras–MAPK pathway at the cell cortex.
- term:
    id: GO:0010971
    label: positive regulation of G2/M transition of mitotic cell cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001999034
  - SGD:S000004577
  - SGD:S000004886
  review:
    summary: >-
      PAINT IBA from budding-yeast ZDS1/ZDS2, where Zds proteins retain Cdc55-PP2A in the
      cytoplasm to promote mitotic entry. No fission-yeast study has tested Zds1 in mitotic
      entry. Fission-yeast cell size at division is a sensitive readout of G2/M timing, and the
      genome-wide deletion screen recorded zds1delta as having abnormal shape but normal cell
      size (PomBase FYPO:0001510, PMID:23697806). In S. pombe the nutrient-responsive control of
      PP2A-B55 (Pab1) at G2/M is attributed to Greatwall-Igo1, not to Zds1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Node placement within the Zds family is phylogenetically reasonable, but the budding-yeast
      mechanism is tied to nuclear exclusion of Cdc55 in a closed mitosis, and there is no
      pombe evidence of a G2/M role; the normal vegetative cell size of the deletion argues
      against a significant contribution. Not removed because loss of a phenotype could reflect
      redundancy and PomBase displays this IBA.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001999034
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Budding-yeast ZDS1/ZDS2 promote mitotic entry via cytoplasmic retention of
          Cdc55; no fission-yeast G2/M role is reported and zds1delta has normal cell size.
    supported_by:
    - reference_id: PMID:21536748
      supporting_text: Zds1/Zds2 promote Cdc55-PP2A function for mitotic entry
    - reference_id: PMID:24800822
      supporting_text: Sequestration of Cdc55 from the nucleus by Zds1 and Zds2 is important for
        robust activation of mitotic Cdk1 and mitotic progression in budding yeast.
