id: O14100
gene_symbol: zds1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  zds1 (mug88, SPAC31F12.01) encodes the single fission-yeast member of the fungal-specific
  Zds1/Zds2 protein family (Zds_C domain), a regulatory partner of protein phosphatase 2A. The
  938-residue protein has a poorly conserved, Ser-rich N-terminal region proposed to be
  autoinhibitory and a conserved C-terminal Zds_C region that carries its function. Zds1 is
  cytosolic and is concentrated at the cell cortex and the division septum, with the 682-817
  region required for cortical and septal targeting. Deletion mutants are viable with normal
  cell size, but cells become round, have thickened cell walls and irregular secondary septa,
  are zymolyase-, calcium- and cold-sensitive, lose viability in stationary phase and on exit
  from quiescence, and fail to enter meiosis as homozygous diploids; overexpression of the
  C-terminal region suppresses the sporulation defect of ras1 mutants and induces
  multi-septated cells. By analogy with budding-yeast Zds1/Zds2, which bind Cdc55-PP2A and
  control its subcellular distribution, Zds1 is thought to regulate PP2A-B55 (Pab1) localisation
  and activity, consistent with its co-purification with the PP2A scaffold subunit Paa1, but this
  mechanism has not been directly tested in fission yeast.
existing_annotations:
- term:
    id: GO:0004864
    label: protein phosphatase inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001999034
  - SGD:S000004886
  review:
    summary: >-
      PAINT IBA from fungal node PTN001999034, seeded by S. cerevisiae ZDS2 only. There is no
      fission-yeast evidence that Zds1 inhibits PP2A or any other phosphatase; the only pombe
      link to PP2A is co-purification with the scaffold subunit Paa1 in an AP-MS dataset.
      Even for the budding-yeast seeds the effect on Cdc55-PP2A is bidirectional (inhibitory
      for nuclear PP2A-Cdc55 at mitotic exit, stimulatory for cytoplasmic PP2A-Cdc55 at mitotic
      entry) and is mainly exerted through control of Cdc55 localisation.
    action: MODIFY
    reason: >-
      The essence (a phosphatase regulator) is sound and inherited across the Zds family, but
      "inhibitor" asserts a direction of regulation that is context-dependent in the seed
      organism and untested in S. pombe. The neutral parent GO:0019888 protein phosphatase
      regulator activity, already curated by PomBase for zds1, is the appropriate level for
      the fission-yeast protein.
    proposed_replacement_terms:
    - id: GO:0019888
      label: protein phosphatase regulator activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001999034
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The Zds-family node legitimately carries PP2A regulation, but the ZDS2 seed
          both inhibits and promotes Cdc55-PP2A depending on context; inhibition is untested in
          S. pombe, so the neutral regulator parent is the transferable claim.
    supported_by:
    - reference_id: PMID:21536748
      supporting_text: Zds1/Zds2 promote Cdc55-PP2A function for mitotic entry, whereas Zds1/Zds2
        inhibit Cdc55-PP2A function during mitotic exit
    - reference_id: PMID:24800822
      supporting_text: Zds1-family proteins are found only in fungi but not in higher eukaryotes
