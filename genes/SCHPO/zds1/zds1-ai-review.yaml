core_functions:
- description: >-
    Fungal-specific regulatory partner of PP2A (inferred PP2A-B55/Pab1 regulator) acting from the
    cytosol, cell cortex and division septum; required for normal polarized cell shape, cell-wall
    and septum integrity, and sexual differentiation, with the mechanism of PP2A regulation not
    yet defined in fission yeast.
  molecular_function:
    id: GO:0019888
    label: protein phosphatase regulator activity
  directly_involved_in:
  - id: GO:0030010
    label: establishment of cell polarity
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005938
    label: cell cortex
  - id: GO:0032153
    label: cell division site
