      cortex.
  - reference_id: PMID:21536748
    supporting_text: Zds1 and Zds2 stoichiometrically bind to Cdc55-PP2A and regulate it in a
      complex manner
suggested_questions:
- question: Does S. pombe Zds1 bind the B55 subunit Pab1 directly and control its
    nucleocytoplasmic or cortical distribution, as Zds1/Zds2 do for Cdc55 in budding yeast?
- question: Should the PAINT node PTN001999034 carry the neutral protein phosphatase regulator
    activity rather than inhibitor activity, given the bidirectional regulation of Cdc55-PP2A by
    the seed genes?
suggested_experiments:
- description: Co-immunoprecipitation of tagged Zds1 with Pab1/Paa1/Ppa2, and Pab1-GFP localisation
    and PP2A-B55 activity assays in zds1delta cells, including cell-size measurements under
    nutrient shifts to test any G2/M contribution alongside Greatwall-Igo1.
  experiment_type: biochemistry and live-cell imaging
