suggested_experiments:
- hypothesis: gcs2 forms a heterodimer with gcs1 that lowers Km and relieves GSH feedback inhibition,
    as GCLM does for GCLC.
  description: Co-purify tagged gcs1 and gcs2 from S. pombe and compare kinetics (Km for glutamate, Ki
    for GSH) of gcs1 alone versus the gcs1-gcs2 complex.
