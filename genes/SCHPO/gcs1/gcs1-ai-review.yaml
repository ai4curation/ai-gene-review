  label: Schizosaccharomyces pombe 972h-
description: Glutamate-cysteine ligase (gamma-glutamylcysteine synthetase) catalytic subunit of fission
  yeast, orthologous to budding-yeast GSH1 and human GCLC. It catalyses the ATP-dependent ligation of
  L-glutamate and L-cysteine to gamma-L-glutamyl-L-cysteine, the first and rate-limiting step of glutathione
  synthesis. Loss of gcs1 makes cells strict glutathione auxotrophs and abolishes synthesis of the glutathione-derived
  cadmium-binding phytochelatins (cadystins), so mutants are hypersensitive to cadmium. Fission yeast
  also has a GCLM-like regulatory subunit (gcs2), which budding yeast lacks. The enzyme is cytosolic.
