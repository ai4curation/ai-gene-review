core_functions:
- description: ER-membrane diflavin reductase that transfers electrons from NADPH to the ergosterol-pathway
    P450s (Erg11/CYP51 directly modelled by PomBase; Erg5/CYP61 and squalene epoxidase Erg1 by homology
    with S. cerevisiae Ncp1).
  molecular_function:
    id: GO:0003958
    label: NADPH-hemoprotein reductase activity
  directly_involved_in:
  - id: GO:0006696
    label: ergosterol biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:32571823
    supporting_text: the Ccr1 activity in the microsomal enzyme solution was determined by using an
      NADPH-cytochrome c reductase assay kit
  - reference_id: PMID:32571823
    supporting_text: which functions by disrupting ergosterol biosynthesis through inhibition of the
      cytochrome P450-dependent enzyme lanosterol 14-α-demethylase
  - reference_id: PMID:23737303
    supporting_text: CYP2D6 displayed its highest activity when coexpressed with ccr1
suggested_questions:
- question: Does S. pombe Ccr1 supply electrons to Erg5 (CYP61) and Erg1 in vivo, as Ncp1 does in budding
    yeast, and how much can the cytochrome b5 route (Cbr1 with Cyb502/Oca8) compensate for its loss at
    Erg11?
suggested_experiments:
- description: Sterol profiling (GC-MS) of ccr1 deletion, cbr1 deletion and double mutants, with and
    without azole, to quantify accumulation of lanosterol and ergosta-5,7-dienol and so separate Ccr1
    support of Erg11 from support of Erg5.
