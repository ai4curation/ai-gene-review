taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ccr1 (SPBC29A10.01) encodes the fission yeast NADPH--cytochrome P450 reductase (CPR,
  EC 1.6.2.4), a diflavin (FAD + FMN) reductase anchored in the endoplasmic reticulum membrane with
  its catalytic domains facing the cytoplasm. It transfers electrons from NADPH to microsomal
  cytochrome P450 enzymes, notably the sterol 14alpha-demethylase Erg11 (CYP51) and, by homology,
  the C-22 desaturase Erg5 and squalene epoxidase Erg1, and so supports ergosterol biosynthesis.
  Deletion is viable but makes cells hypersensitive to azoles, terbinafine and fenpropimorph, and
  causes secondary defects in cell wall integrity, vacuole fusion and calcium/calcineurin
  signalling. Ccr1 microsomal reductase activity is inhibited by tamoxifen. Ccr1 also supports
  heterologously expressed human P450s in S. pombe.
