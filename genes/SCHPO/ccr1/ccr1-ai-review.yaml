  review:
    summary: Neunzig et al. 2013 coexpressed ccr1 (or human or Ammi majus CPR) with seven human
      microsomal CYPs in S. pombe and found that ccr1 coexpression raised biotransformation activity,
      e.g. CYP2D6 was most active with ccr1. The cached record is abstract-only; the curator's IMP
      reflects a gene-dosage manipulation that changes P450 output, consistent with Ccr1 donating
      electrons to P450s.
    action: ACCEPT
    reason: Defers to the PomBase curator, who read the full text; the observation is consistent with
      the established CPR activity.
    supported_by:
