suggested_questions:
- question: Does S. pombe erg28 deletion cause the C-4 demethylation block (3-keto and 4-carboxy sterol accumulation)
    seen in budding yeast, and is erg28 required for ER retention of erg25/erg26/erg27?
- question: In the PomBase GO-CAM erg28 is linked to erg25, erg26 and erg27 by 'directly provides input for'; would
    'directly positively regulates' or a has-part/complex representation better model a scaffold?
suggested_experiments:
- hypothesis: Fission-yeast Erg28 scaffolds the C-4 demethylation enzymes as in S. cerevisiae.
  description: Co-immunoprecipitation / split-ubiquitin tests of erg28 with erg25, erg26, erg27 and erg6, and GC-MS
    sterol profiling of erg28 deletion cells.
  experiment_type: protein interaction / sterol profiling
