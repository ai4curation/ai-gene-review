  label: Schizosaccharomyces pombe 972h-
description: erg28 (SPBC337.09) encodes the Schizosaccharomyces pombe ortholog of Erg28, a small (136 aa) non-catalytic
  multi-pass ER-membrane protein conserved from yeast to humans (human ERG28/C14orf1). By homology with budding-yeast
  Erg28 it is the scaffold of the sterol C-4 demethylation complex, tethering the C-4 methylsterol oxidase erg25,
  the decarboxylating dehydrogenase erg26 and the 3-keto reductase erg27 to the ER membrane and to each other so
  that both C-4 methyl groups are removed efficiently during ergosterol synthesis. Its role in fission yeast is
  inferred from orthology; no S. pombe erg28 mutant phenotype or interaction data are in the annotation record.
