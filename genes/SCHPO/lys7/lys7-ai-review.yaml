taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'lys7 (SPAC17C9.02c; UniProt Q10474), the fission yeast ortholog of S. cerevisiae LYS5, encodes
  the 4''-phosphopantetheinyl transferase that moves the phosphopantetheine group of CoA onto the conserved
  serine (S913) of the peptidyl-carrier domain of alpha-aminoadipate reductase lys1, converting it to
  the active holo-form. This is needed for lysine biosynthesis by the alpha-aminoadipate pathway: lys7
  mutants are lysine auxotrophs blocked at the AAR step, and mutating the PPTase core motifs abolishes
  Lys1 activation.'
