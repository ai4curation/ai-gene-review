    summary: >-
      Top-ranked hit (score 16.06) and absent from GOA, whose location terms for this entry stop at
      the phagophore assembly site and cytosol. The Atg12-Atg5-Atg16 complex is exactly what Atg16
      is a subunit of, and naming it is the single most informative statement about the protein. Correct,
      specific and novel.
