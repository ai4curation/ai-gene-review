gene_symbol: atg16
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Atg16, the coiled-coil subunit of the Atg12-Atg5-Atg16 E3-like
  ligase. Rank 1 names the complex correctly and is absent from GOA; the remaining calls guess at
  selective-autophagy cargo. The Atg8-family ligase activity that is this review's core molecular
  function and is annotated by ISO does not appear. Assessment: 1 correct novel (COR), 1 uncertain
  (UNC), 1 nonparalog incorrect (NPI).
