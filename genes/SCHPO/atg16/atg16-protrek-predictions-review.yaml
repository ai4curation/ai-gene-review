  predicted_term:
    id: GO:0000426
    label: micropexophagy
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 15.42), with autophagy of mitochondrion at rank 4. Core conjugation machinery
      is generally shared between bulk and selective autophagy, so participation in micropexophagy
      cannot be excluded for Atg16; but it is a Pichia/Saccharomyces-characterised pathway, it is
      not annotated for S. pombe Atg16, and this review's evidence is for macroautophagy. The same
      pair of selective-autophagy guesses appeared for Atg101, so this is a family-level habit rather
      than a gene-specific inference.
    supported_by:
    - reference_id: file:SCHPO/atg16/atg16-uniprot.txt
