  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 15.78). Mitochondrion autophagosome adaptor activity describes the mitophagy receptors
      (Atg32 in yeast, BNIP3/NIX in mammals) that tether cargo to Atg8; Atg16 is a component of the
      conjugation machinery that lipidates Atg8, not a cargo receptor. The two act on the same molecule
      from opposite sides.
    supported_by:
