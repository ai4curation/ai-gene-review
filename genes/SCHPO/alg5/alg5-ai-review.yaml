  label: Schizosaccharomyces pombe 972h-
description: ER-membrane UDP-glucose:dolichyl-phosphate glucosyltransferase (dolichyl-phosphate beta-glucosyltransferase,
  EC 2.4.1.117) of fission yeast. A glycosyltransferase family 2 enzyme related to Dol-P-Man synthase, it transfers glucose
  from cytosolic UDP-glucose to dolichyl phosphate to form dolichyl-phosphate-glucose (Dol-P-Glc), the lumenal glucosyl donor
  used by the Alg6/Alg8/Alg10 glucosyltransferases to complete the Glc3Man9GlcNAc2-PP-dolichol precursor of N-linked glycans.
