  label: Schizosaccharomyces pombe 972h-
description: coq6 (SPBC146.12; UniProt Q9Y7Z9) encodes the FAD-dependent monooxygenase Coq6, which hydroxylates
  the CoQ ring at C5 (and, in yeast, deaminates/hydroxylates C1 intermediates), receiving electrons from
  the ferredoxin system (arh1/etp1). It is one of the ten S. pombe genes (dps1, dlp1, ppt1, coq3-coq9)
  needed for CoQ10 synthesis, whose deletion abolishes CoQ10. It is a mitochondrial inner-membrane component
  of the CoQ biosynthetic complex.
