- term:
    id: GO:0120538
    label: 2-methoxy-6-polyprenolphenol 4-hydroxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:81295
  - EC:1.14.15.46
  review:
    summary: C1 hydroxylation of 2-methoxy-6-decaprenylphenol, assigned to Coq6 by the HAMAP rule; the
      C1 step is now attributed to COQ4 in vivo, and Coq6 C1-hydroxylase activity is shown only in vitro
      for the human enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Rhea/EC mapping (GO_REF:0000120, EC 1.14.15.46) from HAMAP MF_03193 by similarity only; there
      is no S. pombe evidence. The orthologs disagree: human COQ6 hydroxylates a short-chain analog at
      C1 in vitro with FDXR/FDX2 (PMID:38425362), whereas PMID:38295803 shows that the eukaryotic C1 decarboxylation
      and hydroxylation occur in one COQ4-catalysed oxidative decarboxylation, so the 2-methoxy-6-polyprenylphenol
      substrate may not form in vivo. Real in vitro activity of uncertain physiological relevance: MARK_AS_OVER_ANNOTATED,
      not core. This sits between the S. cerevisiae COQ6 review (REMOVE) and the human COQ6 review (ACCEPT,
      backed by IDA). The module likewise assigns the C1 reactions to Coq4, while the PomBase GO-CAM gives
      the C1 hydroxylation to coq6.'
    supported_by:
    - reference_id: file:SCHPO/coq6/coq6-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Also acts downstream of COQ4, for the C1-hydroxylation during ubiquinone biosynthesis
        by catalyzing the hydroxylation of 2-methoxy-6-(all-trans-decaprenyl)phenol to 2-methoxy-6-(all-trans-decaprenyl)benzene-1,4-diol.
    - reference_id: PMID:38295803
      supporting_text: Here, we provide evidence that these two reactions occur in a single oxidative
        decarboxylation step catalyzed by COQ4.
    - reference_id: PMID:38425362
      supporting_text: Indeed, COQ6, in the presence of FDXR and FDX2, produced the 4b adduct corroborating
        its dual functionality as both a C5 and C1 hydroxylase
