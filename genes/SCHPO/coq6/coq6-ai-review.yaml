- term:
    id: GO:0016712
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular
      oxygen, reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000376533
  review:
    summary: "Flavin-donor monooxygenase class term from the UniRule; the curated Coq6 reactions use reduced ferredoxin as the external donor, so this donor class over-reaches."
    action: MARK_AS_OVER_ANNOTATED
    reason: "Family-level inference (HAMAP MF_03193): Coq6 is an FAD-dependent monooxygenase with a bound FAD cofactor. GO:0016712 specifies reduced flavin or flavoprotein as the external donor, but the curated Coq6 reactions use reduced ferredoxin as the donor (GO:0016713 branch, parent of the accepted GO:0106364), and GO:0016712 and GO:0016713 are sibling donor classes under GO:0016705. The bound FAD is already captured by the FAD binding row. The term therefore names the wrong donor class and is marked over-annotated rather than kept. No S. pombe enzymology exists."
    supported_by:
    - reference_id: file:SCHPO/coq6/coq6-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: FAD-dependent monooxygenase required for two non-consecutive steps during ubiquinone biosynthesis.
    - reference_id: file:SCHPO/coq6/coq6-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: 'Name=FAD; Xref=ChEBI:CHEBI:57692'
