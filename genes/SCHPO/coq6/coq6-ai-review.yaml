gene_symbol: coq6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: coq6 encodes the fission yeast Coq6 flavin-dependent monooxygenase of the UbiH/COQ6 family,
  a peripheral protein on the matrix side of the mitochondrial inner membrane and part of the CoQ biosynthetic
  complex. Coq6 hydroxylates C5 of the ring of 4-hydroxy-3-decaprenylbenzoate, the first ring modification
  after prenylation, probably using electrons supplied from NADPH through the mitochondrial ferredoxin
  reductase and ferredoxin. Its orthologs have also been proposed to hydroxylate C1 after Coq4-dependent
  decarboxylation, but this step is now attributed mainly to Coq4. Deletion of coq6 abolishes CoQ10 synthesis;
  human COQ6, and Arabidopsis COQ6 given a mitochondrial targeting sequence, complement the deletion.
