suggested_questions:
- question: Which dileucine-type sorting signals in fission yeast cargoes (for example Syb1 or the GPI-anchored
    proteins that depend on AP-1) are recognised by the Apl4-Vas2 hemicomplex, and do they follow
    the mammalian gamma/sigma1 preference against an aspartate at position -4?
- question: Why do vas2 and apl4 deletions give milder phenotypes than apm1 and apl2 deletions, given
    that every subunit is needed for heterotetramer assembly? Does an Apm1-Apl2 hemicomplex keep partial
    activity without the gamma/sigma half?
suggested_experiments:
- description: Express the Apl4-Vas2 hemicomplex and run GST pull-downs against cytoplasmic tails of
    candidate S. pombe cargoes, comparing wild-type tails with dileucine-to-alanine mutants. This would
    test directly whether Vas2 contributes to dileucine-signal recognition in fission yeast.
  experiment_type: biochemical binding assay
- description: Tag Vas2 at its endogenous locus with GFP and image it against Golgi (Anp1) and endosome
    (FM4-64) markers, in wild-type and apl4 deletion backgrounds. This would show where the native
    protein localizes and test whether the nuclear signal from the overexpression screen is real.
  experiment_type: live-cell fluorescence microscopy
