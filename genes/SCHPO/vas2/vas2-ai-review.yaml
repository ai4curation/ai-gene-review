- term:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: contributes_to
  supporting_entities:
  - GO:0030121
  review:
    summary: Vas2 contributes to the cargo-adaptor activity of the AP-1 heterotetramer. The contributes_to
      qualifier is the correct way to express a subunit's part in a complex activity.
    action: ACCEPT
    reason: The activity belongs to the assembled AP-1 complex. Vas2 is needed for the complex to form
      and to reach membranes. In AP-1 complexes of other species the gamma/sigma1 hemicomplex forms
      the dileucine-signal binding site, so the sigma subunit contributes directly to cargo recognition.
      That mechanistic point comes from mammalian AP-1 sigma1, which is in a different PANTHER subfamily
      (SF14) from vas2 (SF5). It is used here only as a property shared by AP-1 sigma chains, not as
      a subfamily-specific transfer. This is the core molecular function.
    supported_by:
    - reference_id: PMID:19624755
      supporting_text: Altogether, results suggest that the four subunits are all essential for the
        heterotetrameric complex formation and for the AP-1 function in exit transport from endosomes.
    - reference_id: PMID:17360967
      supporting_text: We report that the gamma/sigma1 or alpha/sigma2 hemicomplexes bound the dileucine-based
        motifs of several proteins quite strongly, whereas binding by the beta1/mu1 and beta2/mu2 hemicomplexes,
        and the individual beta or mu subunits, was extremely weak or undetectable.
