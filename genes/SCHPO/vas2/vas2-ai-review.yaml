gene_symbol: vas2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Vas2 (Aps1) is the sigma subunit of the heterotetrameric AP-1 clathrin adaptor complex. It
  associates with the gamma subunit Apl4 and contributes to assembly and membrane recruitment of AP-1
  at the Golgi and endosomal system. The complex sorts membrane-protein cargo into intracellular transport
  carriers and supports exit of cargo such as the v-SNARE Syb1 from endosomes.
