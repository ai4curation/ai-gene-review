      a YFP fusion of it is small enough to enter the nucleus passively. Nuclear plus cytoplasmic
      signal is a common default in this kind of screen for small soluble proteins. The targeted study
      of the fission yeast AP-1 subunits found the complex on endosomes. No sigma adaptin in any
      species has a characterised nuclear function. The row is kept but marked as an over-annotation
      instead of being removed, because the screen did record the signal and the full image data are
