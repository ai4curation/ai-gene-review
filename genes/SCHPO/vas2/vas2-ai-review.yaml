  review:
    summary: Wrong process. Intercellular transport means movement between cells, through structures
      such as plasmodesmata. AP-1 sorts cargo between compartments inside a single cell.
    action: REMOVE
    reason: GO:0010496 is defined as movement of substances between cells. S. pombe is unicellular
      and has no intercellular channels. The established Vas2/AP-1 function is intracellular sorting
      at the Golgi and endosomes. The term comes from an ARBA machine-learning rule with no independent
      support. Its likely origin is plant AP-1 annotations to plasmodesmata-related transport, which
      do not apply to a fungus.
    supported_by:
    - reference_id: PMID:19624755
      supporting_text: Altogether, results suggest that the four subunits are all essential for the
        heterotetrameric complex formation and for the AP-1 function in exit transport from endosomes.
