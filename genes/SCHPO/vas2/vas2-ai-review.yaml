    reason: The orthology donor, S. cerevisiae APS1 (SGD:S000004160), is in the same PANTHER subfamily
      (SF5), so the orthology itself is sound. The October 2026 QuickGO annotation set for P35181 no
      longer contains a clathrin binding annotation, however. APS1 has only AP-1 complex membership,
      generic protein-binding IPIs to other AP-1 subunits, and a process annotation, so the experimental
      basis for this transfer is no longer visible in the donor. UniProt records clathrin interaction
      only for the complex, by similarity. The PAINT node for this family (PTN000204281) also does
      not propagate clathrin binding. A function of the complex has been assigned to its smallest
      subunit, so the row is marked as an over-annotation. The complex-level clathrin adaptor role
      is captured by contributes_to clathrin-cargo adaptor activity.
