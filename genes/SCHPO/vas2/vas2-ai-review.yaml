id: Q9P7N2
gene_symbol: vas2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: Vas2 (also called Aps1; locus SPAP27G11.06c) is the 162-residue sigma (small) subunit of
  the heterotetrameric AP-1 clathrin adaptor complex of fission yeast, which also contains the gamma
  subunit Apl4, the beta subunit Apl2 and the mu subunit Apm1. Vas2 has the longin-like fold typical
  of sigma adaptins and has no catalytic activity. It binds Apl4 independently of the other two
  subunits, forming the gamma/sigma half of the core. All four subunits are needed to assemble the
  complex and recruit it to Golgi and endosomal membranes. There AP-1 selects transmembrane cargo for
  clathrin-coated carriers and drives cargo exit from endosomes. Cells lacking vas2 accumulate the
  v-SNARE Syb1 in endosomes and are hypersensitive to valproic acid, the phenotype that gave the gene
  its name. In AP-1 complexes from other species, the gamma/sigma1 hemicomplex forms the binding site
  for dileucine-based sorting signals.
