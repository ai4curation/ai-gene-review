    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: nucleus is retained as an ancillary annotation.
    action: KEEP_AS_NON_CORE
    reason: Retain the reported nuclear signal from the tagged-protein screen as an ancillary localization.
      It does not establish a nuclear AP-1 cargo-sorting mechanism and is not the principal functional
      location supported by endosomal trafficking experiments.
    supported_by:
    - &id001
      reference_id: PMID:16823372
      supporting_text: Next, we determined the localization of 4,431 proteins, corresponding to approximately
        90% of the fission yeast proteome, by tagging each ORF with the yellow fluorescent protein.
    - &id002
      reference_id: PMID:19624755
      supporting_text: In pull-down assay, Apm1 binds Apl2 even in the absence of Aps1 and Apl4, and Apl4
        binds Aps1 even in the absence of Apm1 and Apl2. Consistently, the deletion of any subunit generally
        caused the disassociation of the heterotetrameric complex from endosomes, although some subunits
        weakly localized to endosomes. In addition, the deletion of individual subunits caused similar
        endosomal accumulation of v-SNARE synaptobrevin Syb1. Altogether, results suggest that the four
        subunits are all essential for the heterotetrameric complex formation and for the AP-1 function
        in exit transport from endosomes.
