core_functions:
- description: Sigma subunit of the AP-1 clathrin adaptor complex. It forms the gamma/sigma hemicomplex
    with Apl4, is needed for AP-1 assembly and recruitment to Golgi and endosomal membranes, and contributes
    to the complex's selection of membrane cargo for clathrin-coated carriers. Through this activity
    it drives cargo exit from endosomes, including the return of the v-SNARE Syb1 toward the Golgi
    and plasma membrane.
  supported_by:
  - reference_id: PMID:19624755
    supporting_text: In pull-down assay, Apm1 binds Apl2 even in the absence of Aps1 and Apl4, and Apl4
      binds Aps1 even in the absence of Apm1 and Apl2.
  - reference_id: PMID:19624755
    supporting_text: Altogether, results suggest that the four subunits are all essential for the heterotetrameric
      complex formation and for the AP-1 function in exit transport from endosomes.
  - reference_id: PMID:17360967
    supporting_text: We report that the gamma/sigma1 or alpha/sigma2 hemicomplexes bound the dileucine-based
      motifs of several proteins quite strongly, whereas binding by the beta1/mu1 and beta2/mu2 hemicomplexes,
      and the individual beta or mu subunits, was extremely weak or undetectable.
