  review:
    summary: PAINT inference; branch-point enzyme of Phe/Tyr synthesis.
    action: ACCEPT
    reason: By similarity to S. cerevisiae ARO7 (P32178, ECO:0000250), UniProt curates aro7 as the enzyme of the
      first branch point of the aromatic amino acid pathway, catalysing the step that commits chorismate to
      phenylalanine and tyrosine; the gene product performs a step of the process. Ortholog-based, not tested
      in S. pombe.
