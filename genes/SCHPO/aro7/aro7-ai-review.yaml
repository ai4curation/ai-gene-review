taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: aro7 (SPAC16E8.04c; UniProt O13739) encodes chorismate mutase (EC 5.4.99.5), the branch-point
  enzyme that commits chorismate to phenylalanine and tyrosine by the Claisen rearrangement to prephenate.
  By orthology to the allosteric S. cerevisiae ARO7, it is expected to be activated by tryptophan and
  inhibited by tyrosine, balancing flux between the aromatic branches. It is cytosolic in a genome-wide
  screen.
