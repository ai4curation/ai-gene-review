    label: chorismate biosynthetic process
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0004106
  review:
    summary: Curator inference from chorismate mutase activity to chorismate biosynthesis. Chorismate
      mutase consumes chorismate, converting it to prephenate, and does not make it. The process is Phe/Tyr
      biosynthesis downstream of chorismate.
    action: MODIFY
    reason: The enzyme acts on chorismate, after the chorismate biosynthesis pathway.
    proposed_replacement_terms:
