- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000106743
  review:
    summary: Catalytic zinc cofactor of the class II aldolase-family MtnB dehydratase; subsidiary to the
      dehydratase activity.
    action: KEEP_AS_NON_CORE
    reason: Zinc binding is part of the catalytic mechanism rather than a separate function. It rests on
      the HAMAP MtnB rule (MF_03116), which curates one Zn(2+) per subunit and three zinc-ligand residues;
      family-membership evidence, not an S. pombe assay.
    supported_by:
    - reference_id: file:SCHPO/mde1/mde1-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: 'Note=Binds 1 zinc ion per subunit. {ECO:0000255|HAMAP-Rule:MF_03116}'
