  supporting_entities:
  - InterPro:IPR017714
  - InterPro:IPR027514
  review:
    summary: Generic metal binding; the cofactor is zinc.
    action: MODIFY
    reason: Correct but too general. The HAMAP MtnB rule (MF_03116) curates a single Zn(2+) cofactor and
      three zinc-ligand residues for mde1, so the specific child GO:0008270 zinc ion binding, which the gene
      already carries, is the supported term. Family-membership evidence, not an S. pombe assay.
    proposed_replacement_terms:
