description: mde1 (SPAC20H4.05c; UniProt Q9HE08) encodes methylthioribulose-1-phosphate dehydratase (EC
  4.2.1.109), a zinc-dependent class II aldolase-family enzyme. It dehydrates 5-methylthioribulose-1-phosphate
  to 2,3-diketo-5-methylthiopentyl-1-phosphate, step 3 of the MTA cycle. Function is assigned by orthology
  to S. cerevisiae MDE1; a genome-wide screen places it in the cytosol.
