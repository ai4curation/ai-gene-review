proposed_new_terms: []
suggested_questions:
- question: >-
    Should the stale PANTHER GO:0008320 IBA for S. pombe Tom22 be withdrawn now
    that the current PTHR12504 PAINT snapshot no longer includes this term at
    PTN004364609?
  experts: []
- question: >-
    In fission yeast, are Tom22's presequence-receptor and TOM-complex
    scaffold/channel-gating roles separable by cytosolic-domain or
    transmembrane-anchor mutants?
  experts: []
suggested_experiments:
- hypothesis: >-
    S. pombe Tom22 contributes to TOM channel gating independently of its
    cytosolic presequence-binding domain.
  description: >-
    Generate cytosolic-domain and transmembrane-anchor substitutions in tom22
    and measure preprotein binding, Tom40 association by native gel, and
    reconstituted TOM channel gating to separate receptor and scaffold
    functions.
  experiment_type: separation-of-function mutagenesis
