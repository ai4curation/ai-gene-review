  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005683
  review:
    summary: >-
      Tom22 functions in intracellular protein transport specifically as a
      mitochondrial TOM receptor/scaffold. The generic InterPro2GO row is much
      broader than the existing mitochondrial matrix and route-specific TOM
