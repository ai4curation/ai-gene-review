- term:
    id: GO:0008320
    label: protein transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN004364609
  - SGD:S000005075
  review:
    summary: >-
      Accepted with the contributes_to qualifier. Tom22 is not the Tom40 pore
      itself, but the receptor/scaffold is required for the properly organized
      TOM complex to translocate proteins across the outer membrane.
    action: ACCEPT
    reason: >-
      Tom22 contributes to the protein transporter activity of the TOM complex
      by binding precursors and stabilizing channel organization; the current
      PTHR12504 snapshot no longer carries GO:0008320 at PTN004364609, so the
