id: O13813
gene_symbol: tom22
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  tom22 encodes a single-pass type II mitochondrial outer membrane receptor and
  scaffold subunit of the TOM complex. Tom22 collaborates with Tom20 at the
  cytosolic face of the complex to recognize mitochondrial targeting signals,
  transfers precursors toward the Tom40 channel, and stabilizes the higher-order
  organization and channel gating of the TOM translocase.
