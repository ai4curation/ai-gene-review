  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:9774667
  title: 'Preprotein translocase of the outer mitochondrial membrane: molecular
    dissection and assembly of the general import pore complex.'
  findings:
  - statement: >-
      Budding-yeast Tom22 stably associates with Tom40 in the general import pore
      complex.
    supporting_text: >-
      The receptor Tom22 stably associates with Tom40, the main component of the
      GIP, in a complex with a molecular weight of approximately 400,000
      ( approximately 400K)
- id: PMID:10519552
  title: Tom22 is a multifunctional organizer of the mitochondrial preprotein
    translocase.
  findings:
  - statement: >-
      Budding-yeast Tom22 is both a preprotein receptor and a TOM complex
      organizer required for normal growth, mitochondrial protein import, TOM
      assembly, and channel gating.
    supporting_text: >-
      Tom22 is a multifunctional protein that is required for the higher-level
      organization of the TOM machinery.
