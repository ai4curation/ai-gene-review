core_functions:
- description: >-
    Tom22 is the central receptor/scaffold subunit of the TOM complex: it binds
    mitochondrial targeting signals, hands preproteins to Tom40, and organizes
    the outer-membrane translocase for matrix and inner-membrane precursor
    import.
  supported_by:
  - reference_id: PMID:10519552
    supporting_text: >-
      The central receptor Tom22 binds preproteins through both its cytosolic
      domain and its intermembrane space domain and is stably associated with
      the channel protein Tom40
  - reference_id: PMID:10519552
    supporting_text: >-
      Tom22 is a multifunctional protein that is required for the higher-level
      organization of the TOM machinery.
