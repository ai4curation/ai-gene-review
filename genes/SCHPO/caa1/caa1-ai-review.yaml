suggested_questions:
- question: Does caa1 participate in a malate-aspartate NADH shuttle in S. pombe, as asserted by the PomBase GO-CAM, or is
    its cytosolic role restricted to aspartate synthesis?
- question: Is a caa1 deletion an aspartate auxotroph, as predicted if it is the major aspartate-forming enzyme?
suggested_experiments:
- description: Measure aspartate auxotrophy and 13C-label incorporation into aspartate in caa1-deleted, maa1-deleted and double
    mutants on ammonium medium.
  experiment_type: genetic interaction and metabolic labelling
