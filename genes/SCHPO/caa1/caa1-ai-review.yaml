  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0004069
  review:
    summary: PomBase IC (GO_REF:0000111, with GO:0004069) from the GO-CAM malate-aspartate shuttle model
      (gomodel:67c10cc400005826), where caa1 is the cytosolic AspAT of the shuttle. Cytosolic AspAT is
      a canonical shuttle component in animals, and S. pombe has the mitochondrial carriers (odc1) and
      isozymes needed; but no fission-yeast experiment shows that caa1 operates a malate-aspartate shuttle,
      and the only S. pombe genetic data place caa1 in aspartate synthesis. Kept as a plausible but non-core
      role.
    action: KEEP_AS_NON_CORE
    reason: Inferred by pathway analogy; aspartate synthesis is the supported core role.
    supported_by:
    - reference_id: PMID:39502420
      supporting_text: The cytoplasmic Caa1 has a major role for this reaction in
