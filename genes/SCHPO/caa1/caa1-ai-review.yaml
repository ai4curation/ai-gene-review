  label: Schizosaccharomyces pombe 972h-
description: Cytosolic aspartate aminotransferase (AspAT, EC 2.6.1.1) of Schizosaccharomyces pombe (SPAC10F6.13c), a pyridoxal
  5'-phosphate-dependent class-I aminotransferase and homodimer. It reversibly transfers the amino group of L-glutamate to
  oxaloacetate, giving L-aspartate and 2-oxoglutarate. GFP-tagged caa1 is cytoplasmic. Genetic analysis indicates that caa1,
  rather than the mitochondrial isozyme maa1, carries the main aspartate-forming flux in S. pombe, analogous to S. cerevisiae
  Aat2 and human GOT1; overexpressed caa1 cannot replace maa1 for growth on ammonium. As the cytosolic AspAT it is also the
  expected cytosolic arm of the malate-aspartate NADH shuttle, although this role has not been tested directly in fission
  yeast.
