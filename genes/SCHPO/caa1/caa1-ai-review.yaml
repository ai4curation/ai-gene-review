  label: Schizosaccharomyces pombe 972h-
description: Caa1 is the cytosolic PLP-dependent aspartate aminotransferase of Schizosaccharomyces pombe.
  It reversibly interconverts L-aspartate plus 2-oxoglutarate with oxaloacetate plus L-glutamate. Native
  caa1 deletion causes aspartate auxotrophy, and a catalytic-site mutant compromises growth and TORC1
  activation in the studied nutrient conditions. These effects require catalytic competence but do not
  establish direct TOR binding or a dedicated sensor mechanism. Caa1 does not replace mitochondrial Maa1
  in the tested ammonium-assimilation rescue experiment; its malate-aspartate-shuttle assignment remains
  a comparative inference.
