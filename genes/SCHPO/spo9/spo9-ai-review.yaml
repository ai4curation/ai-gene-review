taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: spo9 (SPBC36.06c; UniProt O59703) encodes an FPS-like prenyltransferase that has no detectable
  activity on its own and is not a functional farnesyl diphosphate synthase. Instead it partners with
  the true FPS, Fps1, to form a heteromeric complex with geranylgeranyl diphosphate synthase activity,
  which stands in for the dedicated GGPP synthase that S. pombe lacks. spo9 deletion abolishes cellular
  GGPP but leaves FPP unchanged. It impairs membrane attachment of geranylgeranylated proteins such as
  ypt7 and rhb1, causes temperature-sensitive growth, and blocks forespore membrane expansion during sporulation.
