taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pis1 encodes the phosphatidylinositol synthase of Schizosaccharomyces pombe (CDP-diacylglycerol--inositol
  3-phosphatidyltransferase, EC 2.7.8.11), the ortholog of S. cerevisiae Pis1 and human CDIPT. This multi-pass membrane
  enzyme of the CDP-alcohol phosphatidyltransferase family transfers the phosphatidyl group of CDP-diacylglycerol
  to myo-inositol, making phosphatidylinositol, the precursor of phosphoinositides, inositol-containing sphingolipids
  and GPI anchors. It competes with phosphatidylserine synthase (pps1) for ER CDP-DAG. In S. pombe, PI synthase
  activity peaks in exponential growth and rises quickly when inositol is added to inositol-starved cells. By homology
  to S. cerevisiae Pis1 it acts mainly in the ER membrane, with possible pools in the Golgi and mitochondrial outer
  membrane.
