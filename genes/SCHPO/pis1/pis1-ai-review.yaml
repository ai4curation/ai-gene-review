suggested_questions:
- question: Is pis1 expression and activity controlled by inositol at the transcriptional or post-translational
    level in S. pombe, given that its regulation of these enzymes differs from that of S. cerevisiae (PMID:1324908)?
suggested_experiments:
- description: Localize functional, natively tagged pis1 relative to ER, Golgi and mitochondrial markers and test
    whether the S. cerevisiae Golgi and outer-membrane pools are conserved in S. pombe.
