suggested_questions:
- question: Does S. pombe leu3, unlike S. cerevisiae LEU4, lack any cytosolic form (no alternative start
    or dual targeting), which would make alpha-isopropylmalate export by oac1 essential for leucine prototrophy?
suggested_experiments:
- description: Measure leucine-sensitive IPMS activity in mitochondrial versus cytosolic fractions of
    S. pombe and test whether an oac1 deletion alone causes leucine auxotrophy.
