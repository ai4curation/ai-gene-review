  label: Schizosaccharomyces pombe 972h-
description: 2-isopropylmalate synthase (alpha-IPM synthase, EC 2.3.3.13) of fission yeast, encoded by
  SPBC3E7.16c. It belongs to the LeuA type-2 (fungal-type) subfamily and corresponds to S. cerevisiae
  LEU4/LEU9. It condenses acetyl-CoA with 2-oxoisovalerate to form (2S)-2-isopropylmalate, the first committed
  step of the leucine branch, and is allosterically inhibited by leucine. leu3 is the only known IPMS
  in S. pombe, and the deletion is a leucine auxotroph. The protein localises to mitochondria, where 2-oxoisovalerate
  is made. Its product must be exported to the cytosol for the isomerase (leu2) and dehydrogenase (leu1)
  steps; the predicted exporter is the carrier oac1.
