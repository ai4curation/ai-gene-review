suggested_questions:
- question: 'S. pombe has a single thioredoxin reductase but a mitochondrial thioredoxin (Trx2): what
    reduces Trx2 in mitochondria, a minor mitochondrial pool of Trr1 or another reductant?'
suggested_experiments:
- hypothesis: A fraction of Trr1 is imported into mitochondria to reduce Trx2.
  description: Fractionate mitochondria from a strain expressing endogenously tagged Trr1 with protease
    protection; test Trx2 redox state (AMS shift) in a Trr1 depletion strain.
