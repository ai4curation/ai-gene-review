  label: Schizosaccharomyces pombe 972h-
description: Thioredoxin reductase Trr1 (synonym caf4; EC 1.8.1.9) of Schizosaccharomyces pombe, an FAD-containing,
  NADPH-dependent homodimeric flavoenzyme of the low-molecular-weight (class-II pyridine nucleotide-disulfide
  oxidoreductase) thioredoxin reductase family. It is encoded by the only thioredoxin reductase gene in
  the genome and reduces oxidised thioredoxin, which in turn supplies electrons to thioredoxin-dependent
  enzymes such as the peroxiredoxin Tpx1 (the H2O2 scavenger and sensor upstream of Pap1). Trr1 is cytosolic
  (also detected in the nucleus). Increased dosage raises TrxR activity and tolerance of mercury and aluminium
  salts, and trr1 promoter activity is induced by menadione, mercuric chloride, H2O2, aluminium chloride
  and selenite, the menadione and mercury responses being Pap1-mediated. Whether the single S. pombe enzyme
  also serves the mitochondrial thioredoxin Trx2 is not established.
