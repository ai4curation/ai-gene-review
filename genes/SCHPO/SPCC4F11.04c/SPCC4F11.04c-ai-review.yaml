- id: PMID:20388730
  title: Mannosylinositol phosphorylceramide is a major sphingolipid component and is required for proper
    localization of plasma-membrane proteins in Schizosaccharomyces pombe.
  findings:
  - statement: S. pombe imt1, imt2, and imt3 encode SUR1 homologues collectively required for MIPC synthesis
      from IPC.
    supporting_text: The S. pombe genome has three genes (SPAC2F3.01, SPCC4F11.04c and SPAC17G8.11c)
      that are homologues of SUR1, termed imt1(+), imt2(+) and imt3(+), respectively.
    reference_section_type: ABSTRACT
  - statement: The imt1 imt2 imt3 triple disruptant loses MIPC and accumulates IPC, supporting a role
      for the trio in MIPC biosynthesis.
    supporting_text: MIPC was not detected and IPC levels were increased in the triple disruptant, indicating
      that the three SUR1 homologues are involved in the synthesis of MIPC.
    reference_section_type: ABSTRACT
  - statement: GFP-Imt1p, GFP-Imt2p, and GFP-Imt3p localize to Golgi membranes.
    supporting_text: GFP-tagged Imt1p, Imt2p and Imt3p localized to Golgi apparatus membranes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct S. pombe imt1/imt2/imt3 genetics and localization paper; the cached abstract
      contains the main MIPC-loss and Golgi-localization evidence used here.
- id: PMID:37792890
  title: Elevated levels of sphingolipid MIPC in the plasma membrane disrupt the coordination of cell
    growth with cell wall formation in fission yeast.
  findings:
  - statement: Willet et al. describe Imt1, Imt2 and Imt3 as Golgi mannosyltransferases that form MIPC
      subspecies from IPC.
    supporting_text: Imt3 is one of three highly related mannosyltransferases (the other two being
      Imt1 and Imt2) acting at the Golgi in the final step of the biosynthetic pathway to catalyze
      the formation of the five subspecies of MIPC from IPC
    reference_section_type: RESULTS
  - statement: imt2 deletion has a stronger single-mutant phenotype than imt1 or imt3 deletion in the
      css1-3 suppression panel.
    supporting_text: Relevant to this possibility, we noticed that the imt2∆ and imt1∆ imt2∆ strains
      were temperature sensitive
    reference_section_type: RESULTS
  - statement: imt2 cells accumulate cell-wall material at the division site, consistent with the Imt
      paralogs producing distinct MIPC subspecies.
    supporting_text: Microscopic analysis revealed that, as in css1-3, cell wall material accumulated
      at the cell division site in imt2∆ cells
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text cached newer fission-yeast sphingolipid paper; supports the Golgi IPC
      mannosyltransferase role of Imt1/Imt2/Imt3 and adds a direct imt2 single-mutant phenotype
      in the css1-3 suppression panel.
