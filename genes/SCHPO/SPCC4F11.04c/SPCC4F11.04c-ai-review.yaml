    reason: Changed from KEEP_AS_NON_CORE because the term is correct but general, and GO has the specific
      descendant GO:0103064 (inositol phosphorylceramide mannosyltransferase activity, is_a GO:0000030).
      In S. pombe, the triple imt1 imt2 imt3 disruptant lacks MIPC and accumulates IPC (PMID:20388730), and
      UniProt curates the IPC mannosylation from that paper (ECO:0000269). The evidence is genetic and
      shared by three redundant paralogs, not an enzyme assay of Imt2 alone. Family membership (PANTHER
      PTHR32385, mannosyl phosphorylinositol ceramide synthase; S. cerevisiae SUR1/CSH1 homologue) agrees.
