- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: is_active_in
  supporting_entities:
  - GO:0005946
  review:
    summary: 'Curator inference of cytosol from membership of the trehalose synthase complex, whose other members are cytosolic.'
    action: ACCEPT
    reason: 'The IC rests on membership of the TPS complex (GO:0005946, the IC with-field). The other members of that complex, tps1 and ntp1, are each annotated to cytosol by HDA from the ORFeome localisation screen (PMID:16823372), so the location of the complex carries over to tpp1. There is no direct localisation of tpp1 itself: the UniProt record has no CC SUBCELLULAR LOCATION line and no TRANSMEM, SIGNAL or TRANSIT feature in FT. The row is kept as the curator inference it is; the quote below supports the complex membership the inference rests on.'
    supported_by:
    - reference_id: file:SCHPO/tpp1/tpp1-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'Component of the trehalose synthase complex that contains at least tps1, ntp1, and tpp1 (Probable).'
