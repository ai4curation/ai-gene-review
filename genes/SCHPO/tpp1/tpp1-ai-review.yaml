  review:
    summary: 'PAINT inference; consistent with the experimental S. pombe evidence.'
    action: ACCEPT
    reason: 'Direct S. pombe evidence: tpp1 disruption causes trehalose-6P to accumulate after heat shock and plasmid tpp1+ reverses it, showing the protein dephosphorylates trehalose-6P in vivo (no purified-enzyme assay). UniProt curates it as the phosphatase subunit of the trehalose synthase complex (PubMed:11004189), and its C-terminal region belongs to the trehalose phosphatase family.'
    supported_by:
    - reference_id: PMID:11004189
      supporting_text: 'Therefore, tpp1 + codes for a protein whose activity is able to dephosphorylate trehalose-6P in vivo.'
