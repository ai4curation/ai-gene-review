core_functions:
- description: Reversible PLP-dependent transamination between L-alanine/2-oxoglutarate and pyruvate/L-glutamate (by orthology
    to S. cerevisiae Alt1), serving alanine synthesis and alanine catabolism; compartment unresolved.
  molecular_function:
    id: GO:0004021
