suggested_questions:
- question: Is S. pombe alt1 cytosolic or mitochondrial? It lacks the transit-peptide extension of S. cerevisiae Alt1, yet
    the PomBase GO-CAM places its activity in the mitochondrial matrix.
- question: Is S. pombe alt1 catalytically active as an alanine aminotransferase, given that the S. cerevisiae paralog Alt2
    is inert?
suggested_experiments:
- description: Localise endogenously tagged alt1 with a mitochondrial marker, and measure ALT activity and alanine auxotrophy/utilisation
    in alt1-deleted cells.
  experiment_type: localisation, enzyme assay and growth phenotyping
