taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Alt1 is a PLP-dependent alanine aminotransferase of Schizosaccharomyces pombe, assigned by
  conserved family features and orthology to characterized budding-yeast Alt1. It reversibly interconverts
  L-alanine plus 2-oxoglutarate with pyruvate plus L-glutamate, supporting inferred roles in alanine synthesis
  and utilization. Cytoplasmic and mitochondrial localization are curated assignments, with matrix activity
  inferred by PomBase; native localization and physiological flux have not been directly established in
  the evidence reviewed. The sequence differs from budding-yeast Alt1, but sequence length alone does
  not demonstrate loss of mitochondrial targeting.
