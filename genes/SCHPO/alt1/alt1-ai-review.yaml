taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Alanine aminotransferase (ALT, EC 2.6.1.2) of Schizosaccharomyces pombe (SPBC582.08), a pyridoxal 5'-phosphate-dependent
  class-I aminotransferase that reversibly converts L-alanine + 2-oxoglutarate to pyruvate + L-glutamate, and so can serve
  both alanine synthesis and alanine use as a nitrogen source. It is the only ALT-family protein in fission yeast. Its function
  is inferred from the S. cerevisiae ortholog Alt1; no S. pombe biochemical or genetic data are available. Unlike budding-yeast
  Alt1, which carries a 64-residue mitochondrial transit peptide, S. pombe alt1 (490 aa) has a short, acidic N-terminus with
  no predicted transit peptide, so its compartment (cytosol versus mitochondria) is unresolved.
