suggested_questions:
- question: Can native localization and import assays independently test the curated mitochondrial-matrix
    inference for S. pombe Alt1?
- question: How do carbon and nitrogen sources affect the direction and magnitude of Alt1-dependent alanine
    flux in fission yeast?
suggested_experiments:
- description: Localise endogenously tagged alt1 with a mitochondrial marker, and measure ALT activity
    and alanine auxotrophy/utilisation in alt1-deleted cells.
  experiment_type: localisation, enzyme assay and growth phenotyping
