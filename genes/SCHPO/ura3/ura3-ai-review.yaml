  label: Schizosaccharomyces pombe 972h-
description: 'ura3 (SPAC57A10.12c) encodes the fission yeast dihydroorotate dehydrogenase (DHODH, EC 1.3.5.2), a
  class 2 FMN-containing flavoenzyme that oxidises (S)-dihydroorotate to orotate, the fourth step of de novo UMP
  synthesis, passing electrons to ubiquinone of the respiratory chain. It has an N-terminal mitochondrial targeting
  sequence and a single transmembrane segment anchoring it to the mitochondrial inner membrane, like human DHODH.
  S. pombe DHODH activity requires an intact respiratory chain and coenzyme Q, and the enzyme does not use fumarate
  or NAD as acceptor. This contrasts with S. cerevisiae, whose unrelated cytosolic class 1A enzyme (URA1) uses fumarate.
  Note the naming trap: S. pombe ura3 is not the ortholog of S. cerevisiae URA3 (OMP decarboxylase).'
