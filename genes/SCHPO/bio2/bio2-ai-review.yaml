suggested_questions:
- question: Which upstream biotin biosynthesis steps (BioF, BioA, BioD equivalents) are present in S. pombe, i.e. can bio2
    contribute to biotin prototrophy from dethiobiotin or only from supplied vitamers?
- question: Is S. pombe bio2 imported into the mitochondrial matrix, and does it depend on the mitochondrial ISC machinery
    for cluster assembly as in S. cerevisiae?
suggested_experiments:
- description: Test growth of wild-type and bio2-deleted S. pombe on dethiobiotin versus biotin, and localise endogenously
    tagged bio2 by mitochondrial fractionation.
  experiment_type: genetics and cell biology
