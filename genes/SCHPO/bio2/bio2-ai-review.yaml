- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IC
  original_reference_id: file:SCHPO/bio2/bio2-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      bio2 binds S-adenosyl-L-methionine at the unique iron of its radical SAM [4Fe-4S] cluster and cleaves
      it to the 5'-deoxyadenosyl radical; two SAM are consumed per biotin formed.
    action: NEW
    reason: >-
      Not in GOA. Added under the RADICAL_SAM treatment rule, which treats GO:1904047 as a core cosubstrate-binding
      function of every radical SAM enzyme whose catalysis is established. This is a molecular function
      the protein itself performs, so the participation test is met directly: bio2 binds SAM and cleaves
      it, rather than merely being required for a process that consumes it. UniProt's curated cofactor
      note records the exchangeable S-adenosyl-L-methionine on the radical SAM cluster and the entry's
      binding features name the 4Fe-4S-S-AdoMet ligand, so the claim rests on curated record content rather
      than on an electronic GO line. Coded IC because the inference is the reviewer's, drawn from that
      curated content and the established biotin synthase activity rather than from a SAM-binding assay
      on this protein. Comparator check, against GOA rather than against this project's own proposals:
      GOA does annotate GO:1904047 to radical SAM enzymes in exactly this role, by UniRule -- ECOLI/queE
      (UR000100349), ECOLI/moaA and PSEPK/moaA (UR000101305), METEA/pqqE and PSEPK/pqqE (UR000098303).
      So the absence here is patchy UniRule coverage, which rules happen to carry the term, not a GO convention
      against annotating a radical SAM enzyme's own cosubstrate. That is also why those five genes have
      an existing row to ACCEPT or MODIFY while this one needs a NEW row.
    supported_by:
    - reference_id: file:SCHPO/bio2/bio2-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 1 [4Fe-4S] cluster. The cluster is coordinated with 3
    - reference_id: file:SCHPO/bio2/bio2-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: cysteines and an exchangeable S-adenosyl-L-methionine
    - reference_id: file:SCHPO/bio2/bio2-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand_note="4Fe-4S-S-AdoMet"
