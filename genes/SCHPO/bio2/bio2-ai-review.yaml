description: Biotin synthase (EC 2.8.1.6) of Schizosaccharomyces pombe (SPCC1235.02), a radical-SAM enzyme orthologous to
  S. cerevisiae Bio2 and E. coli BioB. It inserts sulfur into dethiobiotin to form the thiophane ring of biotin, the final
  step of biotin synthesis, using a [4Fe-4S] cluster to generate 5'-deoxyadenosyl radicals and a [2Fe-2S] cluster as the sulfur
  source. S. pombe bio2 complements a S. cerevisiae biotin synthase mutant. The protein is mitochondrial in the ORFeome localisation
  screen.
