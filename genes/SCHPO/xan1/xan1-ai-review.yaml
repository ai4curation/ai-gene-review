taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: xan1 (SPCC576.01c; UniProt O74885) encodes an alpha-ketoglutarate-dependent xanthine dioxygenase
  (TauD-like Fe(II) dioxygenase family). It hydroxylates xanthine to uric acid without the molybdopterin
  cofactor used by xanthine dehydrogenases, a fungus-specific, convergently evolved activity. xan1 inactivation
  strongly impairs the use of xanthine as a nitrogen source. The enzyme is cytosolic in a genome-wide
  screen.
