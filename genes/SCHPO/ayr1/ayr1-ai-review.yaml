id: Q09851
gene_symbol: ayr1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ayr1 (SPAC23D3.11; UniProt Q09851) encodes the NADPH-dependent 1-acyldihydroxyacetone-phosphate
  reductase (EC 1.1.1.101). It reduces 1-acyl-DHAP to lysophosphatidic acid in the DHAP route of phosphatidic
  acid synthesis. By similarity to S. cerevisiae Ayr1, it sits on the ER and lipid droplets and may have
  a minor triacylglycerol lipase activity. It is in the ER in a genome-wide screen.
existing_annotations:
- term:
    id: GO:0000140
    label: acylglycerone-phosphate reductase (NADP+) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001963740
  - SGD:S000001386
  review:
    summary: 1-acyl-DHAP reductase activity (PAINT/EC/similarity), converting acyl-DHAP to lysophosphatidic
      acid.
    action: ACCEPT
    reason: UniProt curates the 1-acyl-DHAP reductase reaction and the DHAP-route function for ayr1 by similarity
      to S. cerevisiae Ayr1 (P40471, ECO:0000250); no S. pombe enzyme assay exists. The SDR family membership
      (Pfam PF00106 adh_short) and the curated active-site and NADP-binding features are consistent with an NADPH-dependent
      reductase. Accepted as the core activity on the strength of the ortholog evidence.
    supported_by:
    - reference_id: file:SCHPO/ayr1/ayr1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=a 1-acylglycerone 3-phosphate + NADPH + H(+) = a 1-acyl-sn-'
    - reference_id: file:SCHPO/ayr1/ayr1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Required for the biosynthesis of phosphatidic acid via the DHAP pathway, where it reduces 1-acyl DHAP to lysophosphatidic acid (LPA).'
    - reference_id: file:SCHPO/ayr1/ayr1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'Belongs to the short-chain dehydrogenases/reductases (SDR) family.'
