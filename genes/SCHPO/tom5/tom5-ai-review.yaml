- id: PMID:9217162
  title: Tom5 functionally links mitochondrial preprotein receptors to the general import pore.
  findings:
  - statement: >-
      S. cerevisiae Tom5 is a single-pass small TOM subunit that links
      cytosolic precursor receptors to the general import pore and is needed for
      efficient import toward all mitochondrial subcompartments.
    supporting_text: >-
      Tom5, a small subunit that has a crucial role importing preproteins
      destined for all four mitochondrial subcompartments.
- id: PMID:9774667
  title: >-
    Preprotein translocase of the outer mitochondrial membrane: molecular
    dissection and assembly of the general import pore complex.
  findings:
  - statement: >-
      The budding-yeast TOM general import pore complex contains Tom5, Tom6 and
      Tom7 in addition to Tom22 and Tom40.
    supporting_text: >-
      Besides the essential proteins Tom22 and Tom40, the GIP complex contains
      three small subunits, Tom5, Tom6, and Tom7.
- id: PMID:11259583
  title: >-
    Protein import channel of the outer mitochondrial membrane: a highly stable
    Tom40-Tom22 core structure differentially interacts with preproteins, small
    tom proteins, and import receptors.
  findings:
  - statement: >-
      In S. cerevisiae, Tom40 and Tom22 form the stable precursor-holding TOM
      core while Tom5/Tom6/Tom7 are more readily released small TOM proteins.
    supporting_text: >-
      Together, Tom40 and Tom22 thus represent the functional core unit that
      stably holds accumulated preproteins.
- id: file:SCHPO/tom5/tom5-uniprot.txt
  title: UniProt record for S. pombe tom5
  findings:
  - statement: >-
      UniProt describes S. pombe Tom5 as a Tom5-family mitochondrial
      outer-membrane component of the TOM complex by orthology.
- id: file:SCHPO/tom5/tom5-deep-research-manual.md
  title: Manual literature review for S. pombe tom5
  findings:
  - statement: >-
      No S. pombe-specific mechanistic paper was found for Tom5; curation rests
      on the UniProt entry, Tom5-family membership and budding-yeast
      experimental literature.
core_functions:
- description: >-
    Tom5 contributes to the TOM complex by helping transfer mitochondrial
    precursors from cytosolic-side receptors to the Tom40 general import pore.
    This supports outer-membrane translocation for several mitochondrial import
    routes, while the Tom40/Tom22 core, not Tom5 alone, forms the stable channel
    that holds accumulated precursors.
  supported_by:
  - reference_id: PMID:9217162
    supporting_text: >-
      Tom5 has a single membrane anchor and a cytosolic segment with a negative
      net charge, and accepts preproteins from the receptors and mediates their
      insertion into the GIP.
  - reference_id: PMID:11259583
    supporting_text: >-
      Together, Tom40 and Tom22 thus represent the functional core unit that
      stably holds accumulated preproteins.
  contributes_to_molecular_function:
