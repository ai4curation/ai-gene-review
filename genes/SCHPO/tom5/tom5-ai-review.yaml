description: >-
  Tom5 is a conserved, very small, single-pass mitochondrial outer membrane
  subunit of the TOM translocase complex. It is inferred to contribute to the
  TOM complex's protein transmembrane transporter activity by linking
  cytosolic-side import receptors to the general import pore, thereby supporting
  import of mitochondrial precursor proteins through the outer membrane.
