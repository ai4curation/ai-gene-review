    supporting_text: O42996 and Q08226 are reciprocal sole matches through the Crt10-specific region, which
      is consistent with the PomBase one-to-one ortholog assignment.
suggested_questions:
- question: Does fission-yeast Crt10 associate with a cullin-RING ligase (for example the Cul4-type cullin
    Pcu4 and its DDB1-like adaptor) in the way budding-yeast Crt10 associates with Rtt101-Mms1, given that
    the fission-yeast protein lacks most of the budding-yeast Crt10 sequence?
- question: Is the Crt10-specific C-terminal region (residues about 300-400) sufficient for the function
    of the protein, or is the WD-repeat region also required?
suggested_experiments:
- description: Express a decoding-centre or peptidyl-transferase-centre mutant rRNA in wild-type and crt10
    deletion fission yeast and measure the half-life of the mutant rRNA, to test directly whether Crt10
    is required for nonfunctional rRNA decay in this species.
- description: Affinity-purify tagged Crt10 from fission yeast and identify co-purifying cullin-RING ligase
    subunits by mass spectrometry.
