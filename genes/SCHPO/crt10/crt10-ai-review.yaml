  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Crt10 is a WD-repeat protein of the Crt10 family found in the nucleus and cytoplasm of fission
  yeast. Its conserved role is inferred to be surveillance and disposal of nonfunctional large-subunit
  ribosomal RNA. In budding yeast, Crt10 directs an Rtt101-Mms1 cullin ubiquitin ligase toward defective
  ribosomes; the equivalent protein interactions and molecular activity of fission-yeast Crt10 remain
  incompletely characterized.
