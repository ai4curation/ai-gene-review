- term:
    id: GO:0070651
    label: nonfunctional rRNA decay
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000005424
  review:
    summary: PomBase transfers nonfunctional rRNA decay from budding-yeast Crt10 (SGD:S000005424, UniProt
      Q08226) by curated one-to-one orthology. In budding yeast Crt10 is the accessory subunit that directs
      the Rtt101-Mms1 cullin-RING ligase to nonfunctional 25S rRNA decay (PMID:25534857).
    action: ACCEPT
    reason: PANTHER does not classify budding-yeast Crt10, so there is no shared PANTHER subfamily or PAINT
      node behind this transfer, and the PomBase ortholog call is the evolutionary basis. A reciprocal
      phmmer check supports it. Each yeast proteome has a single PF08728 (CRT10) protein, the non-WD40
      C-terminal region of O42996 has budding-yeast Crt10 as its only hit, and Crt10 has O42996 as its only
      fission-yeast hit (file:SCHPO/crt10/crt10-bioinformatics/RESULTS-rereview.md). The similarity is weak
      and confined to the Crt10-specific region, and the pombe protein is half the length of Crt10. The
      transfer is therefore accepted at the pathway level PomBase chose. PomBase did not transfer the
      budding-yeast ubiquitin-ligase complex membership or the ribonucleotide-reductase transcription
      phenotypes, and that omission is respected here. Crt10 participates as the targeting subunit that
      brings the ligase to defective ribosomes, which is direct participation in the decay pathway rather
      than mere necessity, though this has not been tested in fission yeast.
    additional_reference_ids:
    - file:SCHPO/crt10/crt10-bioinformatics/RESULTS-rereview.md
    supported_by:
    - &id001
      reference_id: PMID:25534857
      supporting_text: 'We herein demonstrated that another accessory component, Crt10

        was required for 25S NRD, but not for DNA repair, suggesting that this accessory

        component specifies the function of the E3 complex differently.'
    - reference_id: file:SCHPO/crt10/crt10-uniprot.txt
      supporting_text: DR   Pfam; PF08728; CRT10; 1.
    - reference_id: file:SCHPO/crt10/crt10-bioinformatics/RESULTS-rereview.md
      supporting_text: O42996 and Q08226 are reciprocal sole matches through the Crt10-specific region, which
        is consistent with the PomBase one-to-one ortholog assignment.
