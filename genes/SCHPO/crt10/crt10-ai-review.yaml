description: Crt10 (SPBC27B12.05, pi073) is a 482-residue WD-repeat protein of fission yeast that
  carries a short, weakly conserved Crt10-family region in its C-terminal half and is found in both the
  nucleus and the cytoplasm. It is the one-to-one counterpart of budding-yeast Crt10, a substrate-targeting
  accessory subunit that directs the Rtt101-Mms1 cullin-RING ubiquitin ligase to the degradation of
  nonfunctional 25S ribosomal RNA, and it is therefore inferred to act in nonfunctional large-subunit rRNA
  decay. The fission-yeast protein is about half the length of its budding-yeast counterpart, and its
  molecular activity, cullin-ligase partners and direct substrates have not been characterized.
