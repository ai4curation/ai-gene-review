core_functions:
- description: Crt10-family accessory factor inferred, by one-to-one orthology with budding-yeast Crt10,
    to act in nonfunctional large-subunit rRNA decay, where the budding-yeast protein targets a cullin-RING
    ubiquitin ligase to defective 25S rRNA-containing ribosomes. The fission-yeast molecular activity and
    ligase partners are not established, so no molecular function is asserted.
  directly_involved_in:
