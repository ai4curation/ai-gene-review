- term:
    id: GO:0070651
    label: nonfunctional rRNA decay
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000005424
  review:
    summary: PomBase infers nonfunctional rRNA decay by curated orthology.
    action: ACCEPT
    reason: PomBase infers nonfunctional rRNA decay by curated orthology. The target has the diagnostic
      Crt10 family domain, and experiments in budding yeast show Crt10 is required for nonfunctional 25S
      rRNA decay. This supports the conserved pathway inference without assigning the target to a particular
      E3 complex.
    supported_by:
    - &id001
      reference_id: PMID:25534857
      supporting_text: 'We herein demonstrated that another accessory component, Crt10

        was required for 25S NRD, but not for DNA repair, suggesting that this accessory

        component specifies the function of the E3 complex differently.'
    - reference_id: file:SCHPO/crt10/crt10-uniprot.txt
      supporting_text: DR   Pfam; PF08728; CRT10; 1.
