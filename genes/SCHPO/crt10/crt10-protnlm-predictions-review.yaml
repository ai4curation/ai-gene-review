  predicted_term:
    id: GO:0080008
    label: Cul4-RING E3 ubiquitin ligase complex
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: Budding-yeast Crt10 co-purifies with the cullin Rtt101 and binds it through the DDB1-like
      linker Mms1, and Rtt101-Mms1 is described as a CUL4(DDB1)-like ligase. GO, however, represents
      that assembly as the Cul8-RING ubiquitin ligase complex (GO:0035361), a sibling of the predicted
      Cul4-RING complex (GO:0080008) under cullin-RING ubiquitin ligase complex, and the budding-yeast
      review uses the Cul8 term. No study has tested whether fission-yeast Crt10, which is half the length
      of its budding-yeast counterpart, associates with any cullin ligase, including Pcu4-Ddb1 (Cul4); PubMed has
      no fission-yeast Crt10 papers. The gene review asserts no complex membership and notes that PomBase
      did not transfer the budding-yeast ligase-complex membership. The ProtNLM2 claim is a low-scoring
      phmmer transfer from Arabidopsis WDR5B Q9SY00 (model_score 0.11; phmmer_score 66.0), a WD-repeat
      protein outside the Crt10 family, so the source does not justify a family transfer. The complex
      claim is plausible by analogy but neither validated nor refuted.
