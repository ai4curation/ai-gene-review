  review:
    assessment: UNC
    confidence_score: 1
    summary: Crt10 has a diagnostic CRT10 domain and a documented orthologous role in Rtt101-Mms1-dependent
      nonfunctional rRNA decay. This supports a relationship to cullin-mediated ubiquitination, but does
      not establish residence in the specific Cul4-RING E3 complex in fission yeast. The XML claim is
      a low-scoring phmmer transfer from Arabidopsis WDR5B Q9SY00 (model_score 0.11; phmmer_score 66.0);
      shared WD-repeat architecture does not demonstrate the relevant cullin partner or conserved subfamily
      function. Direct target-complex evidence or defensible orthology connecting this complex membership
      is missing. The claim is neither validated nor conclusively refuted.
    supported_by:
    - &id001
      reference_id: PMID:25534857
      supporting_text: 'We herein demonstrated that another accessory component, Crt10

        was required for 25S NRD, but not for DNA repair, suggesting that this accessory

        component specifies the function of the E3 complex differently.'
    - reference_id: file:SCHPO/crt10/crt10-uniprot.txt
      supporting_text: DR   InterPro; IPR014839; Crt10.
