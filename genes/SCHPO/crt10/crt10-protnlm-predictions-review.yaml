  review:
    assessment: UNC
    confidence_score: 1
    summary: No experimental annotation or publication links fission-yeast or budding-yeast Crt10 to
      UV-B responses; PubMed searches for Crt10 with UV or ultraviolet return nothing, and the gene review
      carries no DNA-damage or radiation-response term. The source is a TMalign structural comparison
      to Arabidopsis DHU1 Q8GYY7 (model_score 0.11; chain-normalized scores 0.56569 and 0.36277), so shared
      WD-repeat fold, not a conserved UV-B mechanism, underlies the claim. The characterized budding-yeast
      Crt10 directs nonfunctional 25S rRNA decay and is dispensable for the DNA-repair function of the
      Rtt101 ligase, which argues against but does not test a UV-B response. With no target evidence and
      no justified transfer, the claim is unresolved.
