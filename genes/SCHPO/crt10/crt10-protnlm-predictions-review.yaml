description: Fission-yeast Crt10 is the inferred ortholog of the budding-yeast Rtt101-Mms1 accessory
  subunit and is annotated to nonfunctional rRNA decay by orthology; neither ProtNLM2 claim (Cul4-RING
  complex membership, cellular response to UV-B) has experimental or phylogenetic support in fission
  yeast.
