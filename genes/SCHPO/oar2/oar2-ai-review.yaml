- term:
    id: GO:0048038
    label: quinone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002449501
  - UniProtKB:Q8N4T8
  review:
    summary: >-
      IBA for quinone binding from node PTN002449501 (sourced from human CBR4);
      S. pombe Oar2 is a mitochondrial 3-oxoacyl-ACP reductase in type II fatty
      acid synthesis with no evidence of the mammalian CBR4/HSD17B8 complex's
      in vitro quinone reductase side activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Propagated from the Opisthokonta node PANTHER:PTN002449501 (seeded by
      human CBR4, UniProtKB:Q8N4T8). While human CBR4 (the beta subunit of the
      mammalian heterotetrameric mitochondrial KAR complex with HSD17B8)
      exhibits secondary carbonyl/quinone reductase activity in vitro, fungal
      Oar2/Oar1 is an NADPH-dependent 3-oxoacyl-[ACP] reductase dedicated to
      mitochondrial type II fatty acid synthesis (mtFAS) with no evidence of
      quinone binding, matching the MARK_AS_OVER_ANNOTATED judgment on S.
      cerevisiae OAR1.
    supported_by:
    - reference_id: file:SCHPO/oar2/oar2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Involved in biosynthesis of fatty acids in mitochondria.
    - reference_id: file:SCHPO/oar2/oar2-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=a (3R)-hydroxyacyl-[ACP] + NADP(+) = a 3-oxoacyl-[ACP] + NADPH'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002449501
        source_label: PTN002449501
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Opisthokonta node over-propagates a mammalian CBR4 in vitro side
          activity to fungal mtFAS 3-oxoacyl-ACP reductases.
      - source_id: UniProtKB:Q8N4T8
        source_label: CBR4
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Human CBR4 exhibits carbonyl/quinone reductase activity in vitro that
          is not shared by fungal Oar2/Oar1.
