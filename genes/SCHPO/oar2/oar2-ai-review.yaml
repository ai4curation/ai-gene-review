  label: Schizosaccharomyces pombe 972h-
description: oar2 (SPAC3G9.02; UniProt O42866; the fission yeast OAR1 ortholog) encodes the NADPH-dependent
  3-oxoacyl-ACP reductase (EC 1.1.1.100) of mitochondrial type II fatty acid synthesis, which reduces
  3-oxoacyl-ACP to (R)-3-hydroxyacyl-ACP. mtFAS supplies octanoyl-ACP for lipoic acid synthesis. Function
  is assigned by orthology; it is mitochondrial in a genome-wide screen.
