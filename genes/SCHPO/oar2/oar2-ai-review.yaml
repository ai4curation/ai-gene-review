- term:
    id: GO:0009107
    label: obsolete lipoate biosynthetic process
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0004316
  review:
    summary: "Curator inference to lipoate biosynthesis, a term now obsolete in GO. Oar2 is a 3-oxoacyl-ACP reductase of mitochondrial fatty acid synthesis, which supplies the octanoyl precursor of lipoic acid; it does not itself act in lipoate synthesis."
    action: MARK_AS_OVER_ANNOTATED
    reason: "The term is obsolete in current GO (GO:0009107, obsolete lipoate biosynthetic process). By similarity (UniProt ECO:0000250) Oar2 is the 3-oxoacyl-ACP reductase of mitochondrial type II fatty acid synthesis, and mtFAS produces the octanoyl-ACP precursor from which lipoic acid is made (reviewed in Angerer 2015, on the general eukaryotic pathway). That makes Oar2 a supplier of the pathway's precursor, required for it rather than doing a step of it, so the process claim over-reaches; its own role is captured by the mitochondrial fatty acid biosynthesis rows. Pathway-level inference, not an S. pombe experiment."
    supported_by:
    - reference_id: file:SCHPO/oar2/oar2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Involved in biosynthesis of fatty acids in mitochondria.
    - reference_id: PMID:25686363
      supporting_text: ACPM is an essential protein of the mitochondrial fatty acid synthesis type II that forms octanoyl-ACPM precursors for the biosynthesis of lipoic acid
