  - reference_id: PMID:20435771
    supporting_text: since car3 + appeared to be the most expressed and active arginase
  - reference_id: PMID:20460254
    supporting_text: This suggests that Aru1 is the major arginase in fission yeast.
  - *id001
  - reference_id: PMID:26075619
    supporting_text: prevention of Arg-6 conversion into glutamate, glutamine and proline can be achieved
      either by deletion of the single fission yeast ornithine transaminase gene, car2+, or by simultaneous
      deletion of the two arginase genes, car1+ and aru1+
suggested_questions:
- question: 'The aru1/car3 naming conflict: should ''car3'' be recorded as a synonym of aru1 at PomBase
    so that PMID:20435771 is discoverable from the aru1 page?'
suggested_experiments:
- description: Quantify Aru1 and Car1 protein levels (e.g. tagged alleles) across nitrogen sources and
    iron status to test whether Aru1 dominates arginase activity under all conditions.
