core_functions:
- description: Mn2+-dependent hydrolysis of L-arginine to L-ornithine and urea in the cytosol, the first
    step of arginine catabolism; the constitutive, major S. pombe arginase, redundant with car1. Same
    core function as S. cerevisiae CAR1.
