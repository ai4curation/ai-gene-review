  label: Schizosaccharomyces pombe 972h-
description: aru1 (SPAC3H1.07; called car3 in some literature) encodes the major cytosolic, manganese-dependent
  arginase (EC 3.5.3.1) of fission yeast, 88% identical to its paralog car1 and orthologous to S. cerevisiae
  CAR1. It hydrolyses L-arginine to L-ornithine and urea, the first step of arginine catabolism that routes
  the arginine carbon skeleton through ornithine to proline and glutamate and provides ornithine for siderophore
  synthesis. Unlike car1, aru1 is expressed constitutively and is not regulated by iron. Deletion of aru1
  reduces, and deletion of both aru1 and car1 abolishes, the conversion of arginine into other amino acids.
