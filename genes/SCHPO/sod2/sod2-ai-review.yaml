  label: Schizosaccharomyces pombe 972h-
description: sod2 encodes the manganese superoxide dismutase of Schizosaccharomyces pombe, a homodimeric enzyme of the Fe/Mn
  SOD family that contains only manganese as cofactor and dismutates superoxide to hydrogen peroxide and dioxygen (EC 1.15.1.1).
  It is imported into the mitochondrial matrix, where a 21-residue N-terminal targeting sequence is removed, and is acetylated
  on Lys25 after import. Unlike budding yeast Sod2, the S. pombe enzyme is already active before mitochondrial import, but
  mitochondrial localization is required for oxidative stress resistance and respiratory growth. sod2 is induced by superoxide
  generators, high osmolarity and heat through the Wis1-Sty1 MAP kinase pathway, independently of Atf1 and Pap1, and sod2
  mutants are sensitive to superoxide generators, heat and osmotic stress.
