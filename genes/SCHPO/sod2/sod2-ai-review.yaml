suggested_questions:
- question: How does S. pombe Sod2 acquire manganese before mitochondrial import, given that budding yeast Sod2 is only metallated
    inside mitochondria, and does Lys25 acetylation regulate its activity?
suggested_experiments:
- description: Compare metal content and specific activity of Sod2 purified from cytosol-retained (presequence-deleted) and
    mitochondrial forms, and test K25R/K25Q mutants for activity and stress resistance.
