  label: Schizosaccharomyces pombe 972h-
description: erg25 (SPAC630.08c) encodes C-4 methylsterol oxidase (sterol-4alpha-methyl oxidase, EC 1.14.18.-) of
  Schizosaccharomyces pombe, a non-heme di-iron enzyme of the sterol desaturase family with three histidine boxes
  and an ER-membrane anchor. Using O2 and electrons from cytochrome b5 it oxidises the 4alpha-methyl group of 4,4-dimethylzymosterol
  (and then 4alpha-methylzymosterol) in three steps to a 4alpha-carboxylic acid, the first reaction of each C-4
  demethylation round, which Erg26 then decarboxylates. By homology it acts with Erg26, Erg27 and the scaffold Erg28
  in the ER C-4 demethylation complex. erg25 is strongly induced by low oxygen and low sterol via Sre1/Scp1.
