suggested_questions:
- question: What chain-length range does elo1 elongate compared with elo2 (which supplies C24 for ceramide), and
    is elo1 the S. pombe counterpart of budding-yeast ELO1 (C14->C16/C18), ELO2 or ELO3 in function despite its
    sequence-based name?
suggested_experiments:
- description: Measure acyl-CoA/ceramide chain-length profiles in elo1 deletion, elo2 shut-off and double mutants,
    and assay elo1 in vitro (or by heterologous expression in elo2/elo3 budding-yeast mutants) for substrate specificity.
