gene_symbol: elo1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: elo1 (SPAC1639.01c) encodes one of the two ELO-family fatty acid elongases of fission yeast, a multi-pass
  integral membrane 3-ketoacyl-CoA synthase of the endoplasmic reticulum and nuclear envelope. It condenses an acyl-CoA
  with malonyl-CoA to form a 3-oxoacyl-CoA two carbons longer, the first and rate-limiting step of the ER fatty
  acid elongation cycle completed by the 3-ketoacyl-CoA reductase, dehydratase and enoyl-CoA reductase. Sequence
  similarity places it with budding-yeast ELO2/ELO3 (UniProt calls it putative fatty acid elongase 2), and it is
  a paralogue of the S. pombe very-long-chain elongase elo2, which produces the C24 acyl chain of the major t20:0/24:0
  phytoceramide. Its own chain-length specificity and physiological contribution relative to elo2 have not been
  defined; activity is inferred from homology.
