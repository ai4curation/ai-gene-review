suggested_questions:
- question: >-
    What is the role of the fyu1 paralog SPCC794.10, which did not raise glucoside production on overexpression:
    is it a UDP-sugar pyrophosphorylase with different specificity, or inactive?
- question: >-
    Is fyu1 essential in S. pombe, as UGP1 is in S. cerevisiae?
suggested_experiments:
- description: >-
    Assay recombinant fyu1 and SPCC794.10 with glucose 1-phosphate, galactose 1-phosphate and N-acetylglucosamine
    1-phosphate and UTP to define substrate specificity.
