  label: Schizosaccharomyces pombe 972h-
description: >-
  fyu1 (SPCC1322.04) is the major UTP-glucose-1-phosphate uridylyltransferase (UDP-glucose

  pyrophosphorylase, UGPase) of fission yeast, a member of the UDPGP type 1 family that in other fungi
  and

  animals forms a homo-octamer. It catalyses UTP + alpha-D-glucose 1-phosphate to UDP-alpha-D-glucose
  +

  pyrophosphate in the cytosol, producing the glucosyl donor used for cell-wall glucans, trehalose,

  galactose interconversion and dolichyl-phosphate-glucose synthesis. In S. pombe, overexpression of

  fyu1 (but not of its paralog SPCC794.10) raised UDP-glucose-dependent glucoside formation by a

  heterologous glycosyltransferase, identifying it as the functional UGPase. A genome-wide screen

  detected the protein in cytoplasm and nucleus.
