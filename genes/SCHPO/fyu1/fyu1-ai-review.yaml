  review:
    summary: >-
      PomBase IMP from PMID:21862693. In a strain expressing human UGT2B7, overexpression of SPCC1322.04
      (but not the paralog SPCC794.10) raised UDP-glucose-dependent glucoside production, leading to the
      name fyu1 (fission yeast UGPase1). This is an overexpression-based functional readout rather than
      a loss-of-function test; the full text was not available here, so the curator's evidence call is
      deferred to.
    action: ACCEPT
    reason: >-
      S. pombe in vivo functional evidence distinguishing fyu1 from its paralog; consistent with homology.
    supported_by:
    - reference_id: PMID:21862693
      supporting_text: we could enhance the glucoside production rate in fission yeast by overexpressing
        the fission yeast gene SPCC1322.04, a potential UDP-glucose pyrophosphorylase (UGPase), but not
        by overexpression of SPCC794.10, and therefore suggest to name this gene fyu1 for fission yeast
        UGPase1
