- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission yeast Schizosaccharomyces pombe.
  findings:
  - statement: Matsuyama et al. generated a fission-yeast ORFeome YFP localization dataset and localized 4,431 proteins, providing the high-throughput assay source for the sec11 ER annotation.
    supporting_text: we determined the localization of 4,431 proteins, corresponding to approximately 90% of the fission yeast proteome, by tagging each ORF with the yellow fluorescent protein.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified ORFeome localization screen; the cached record is abstract-only, so the sec11-specific image/table row was not directly inspected.
- id: PMID:3283143
  title: SEC11 is required for signal peptide processing and yeast cell growth.
  findings:
  - statement: S. cerevisiae sec11 mutant cells accumulate unprocessed invertase and acid phosphatase with intact signal peptides at the restrictive temperature, showing that SEC11 is required for signal peptide cleavage in yeast.
    supporting_text: sec11 mutant cells are uniquely defective in signal peptide processing of at least two different secretory proteins.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary paper establishing the conserved budding-yeast SEC11 process phenotype used by orthology and PAINT propagation.
- id: PMID:1846444
  title: Yeast signal peptidase contains a glycoprotein and the Sec11 gene product.
  findings:
  - statement: Purified yeast microsomal signal peptidase is a four-polypeptide complex whose 18-kDa chain is the SEC11 product required for signal peptidase activity.
    supporting_text: The 18-kDa chain is the product of the Sec11 gene, which is necessary for signal peptidase activity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary biochemical paper that supports Sec11 as the yeast signal peptidase catalytic complex subunit.
- id: PMID:10206957
  title: The catalytic mechanism of endoplasmic reticulum signal peptidase appears to be distinct from most eubacterial signal peptidases.
  findings:
  - statement: The yeast Sec11p subunit contains conserved serine, histidine, and aspartate residues that are important for ER signal peptidase activity.
    supporting_text: Instead, a serine, histidine, and two aspartic acids are important for signal peptidase activity by the Sec11p subunit of the yeast signal peptidase complex.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary paper identifying conserved Sec11 residues required for yeast SPC catalytic activity; the cache contains only the abstract.
- id: PMID:34388369
  title: Structure of the human signal peptidase complex reveals the determinants for signal peptide cleavage.
  findings:
  - statement: Human ER signal peptidase complexes contain SEC11A or SEC11C as catalytic subunits, with the active site adjacent to the ER membrane and a transmembrane window that contributes to signal peptide specificity.
    supporting_text: The active site is formed by a catalytic triad and abuts the ER membrane, where a transmembrane window collectively formed by all subunits locally thins the bilayer.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified human SPC structural paper supporting the conserved ER membrane mechanism of eukaryotic SEC11 paralogs.
- id: PMID:42173868
  title: Structural basis of signal peptide recognition by the signal peptidase complex.
  findings:
  - statement: A high-resolution structure of substrate-bound human SPC-A showed how the Sec11A luminal binding groove and transmembrane window recognize a model signal peptide.
    supporting_text: Here, we present a 2.6 Å cryo-EM map of the human SPC-A, one of two SPC paralogs, bound to a model SP.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified full-text structural paper that refines the conserved Sec11/SPC substrate-recognition mechanism.
- id: PMID:42586426
  title: The Sec11 C-terminal short helix promotes productive engagement of internal signal sequences with the signal peptidase complex.
  findings:
  - statement: The S. cerevisiae Sec11 C-terminal short helix spans the ER membrane and selectively stabilizes internal signal sequences for productive engagement with SPC.
    supporting_text: These data suggest that the Sec11 CTS specifically stabilizes internal signal sequences for productive engagement with SPC.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified full-text yeast structure-function paper that adds recent mechanistic support for the conserved Sec11 C-terminal helix.
