  label: Schizosaccharomyces pombe 972h-
description: Alp13/Eaf3 is a nuclear MRG-family chromodomain protein that acts
  as a shared chromatin-targeting subunit of the fission-yeast Clr6S/Rpd3S
  histone deacetylase complex and NuA4 histone acetyltransferase complex. In
  Clr6S it forms two Cph1/Cph2-associated histone-binding modules, helps couple
  H3K36-methylated transcribed chromatin to Clr6-mediated deacetylation, and
  supports suppression of cryptic and antisense transcription.
