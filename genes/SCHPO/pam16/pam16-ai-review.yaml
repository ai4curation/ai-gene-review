- term:
    id: GO:0140388
    label: protein translocation chaperone activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - SGD:S000005758
  review:
    summary: >-
      This ISO row combines a wrong Mge1 budding-yeast donor with an Hsp70
      motor activity that is not the Pam16 J-like regulator activity.
    action: REMOVE
    reason: >-
      Remove this MF row. GO:0140388 describes the ATP-dependent chaperone
      activity that directly binds emerging matrix-destined polypeptides and
      drives vectorial transport, matching Ssc1/mtHsp70 rather than Pam16. The
      S. pombe UniProt record instead describes Pam16 as the J-like partner of
      Pam18 that does not itself stimulate mtHsp70 ATPase, and PomBase also
      cites SGD:S000005758, the budding-yeast MGE1/YOR232W identifier, instead
      of the budding-yeast PAM16/YJL104W identifier SGD:S000003640.
    supported_by:
    - reference_id: file:genes/SCHPO/pam16/pam16-uniprot.txt
      record_section:
      - CC:DOMAIN
      supporting_text: >-
        The J-like region, although related to the J domain does not stimulate
        ATPase activity of mtHSP70
    - reference_id: PMID:18400944
      supporting_text: >-
        Pam16 was shown to promote association of Pam18 with the presequence
        translocase
    - reference_id: PMID:18400944
      supporting_text: >-
        but also to reduce the stimulatory function of Pam18 on the ATPase
        activity of mtHsp70
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      - ROLE_CONFLATION
      source_entities:
      - source_id: SGD:S000005758
        source_label: MGE1/YOR232W
        source_status: SOURCE_BAD
        comment: >-
          The ISO donor is budding-yeast MGE1 rather than PAM16, and the
          transferred term matches the Ssc1/mtHsp70 motor role rather than the
          inhibitory Pam18-regulator role of Pam16.
    source_defects:
    - defect_type: WRONG_WITH_FROM
      resource: POMBASE
      slot: With/From
      requested_change: REPOINT
      asserted_value: SGD:S000005758
      corrected_value: SGD:S000003640
      corrected_label: PAM16/YJL104W
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The pam16 ISO annotation to GO:0140388 cites SGD:S000005758 as its
        With/From donor. The SGD API resolves SGD:S000005758 to MGE1/YOR232W,
        the mitochondrial GrpE nucleotide-exchange factor, while the S.
        cerevisiae Tim16/Pam16 ortholog is PAM16/YJL104W, SGD:S000003640.
    - defect_type: WRONG_TERM
      resource: POMBASE
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0140388 protein translocation chaperone activity
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        GO:0140388 describes the vectorial ATP-dependent binding/rebinding
        activity of the Hsp70 import motor. Pam16 is instead a J-like
        Pam18-binding regulator: it positions Pam18 at the translocon and
        modulates Pam18 stimulation of mtHsp70 ATPase. QuickGO has no current
        exact GO:0140388 annotation on the correct S. cerevisiae PAM16 UniProt
        donor P42949, so please check whether this ISO row should be deleted or
        replaced by a regulator/adaptor molecular function based on the correct
        donor.
      supported_by:
      - reference_id: file:genes/SCHPO/pam16/pam16-uniprot.txt
        record_section:
        - CC:DOMAIN
        supporting_text: >-
          The J-like region, although related to the J domain does not
          stimulate ATPase activity of mtHSP70
      - reference_id: PMID:18400944
        supporting_text: >-
          but also to reduce the stimulatory function of Pam18 on the ATPase
          activity of mtHsp70
