description: >-
  pam16 encodes the conserved Tim16/Pam16 J-like regulatory subunit of the
  presequence translocase-associated motor. It is inferred to act at the
  mitochondrial inner membrane as the Pam18-binding subunit of the PAM complex,
  helping position the Pam18 J-protein module at the presequence translocase and
  modulate Pam18-driven stimulation of the Ssc1/mtHsp70 import cycle for
  presequence-containing proteins.
