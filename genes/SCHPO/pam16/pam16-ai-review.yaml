suggested_questions:
- question: >-
    Which S. pombe pam16 surfaces recruit Pam18 to PAM, modulate Pam18
    stimulation of Ssc1/mtHsp70 ATPase, or couple the Pam18/Pam16 subcomplex to
    Tim44 at the matrix face of the TIM23 channel?
  experts: []
suggested_experiments:
- hypothesis: >-
    S. pombe pam16 uses the same separable Pam18-binding and translocase-coupling
    surfaces as budding-yeast Pam16.
  description: >-
    Introduce Pam16 J-like-domain and Pam18-interface mutations predicted from
    yeast and human structures, then measure Pam18 binding, PAM/TIM23
    association, Ssc1 ATPase regulation, and matrix-directed precursor import in
    isolated S. pombe mitochondria.
