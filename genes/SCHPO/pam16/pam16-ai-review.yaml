- id: PMID:18400944
  title: 'Mitochondrial protein import motor: differential role of Tim44 in the
    recruitment of Pam17 and J-complex to the presequence translocase.'
  findings:
  - statement: >-
      Pam16 is the J-like partner of Pam18 in the membrane-associated PAM
      J-complex that regulates mtHsp70 function at the protein-translocation
      channel.
    supporting_text: >-
      the assembly of the mitochondrial protein import motor involves a
      regulated interplay of several membrane-bound cochaperones: Tim44,
      Pam18/Pam16, and Pam17
  - statement: >-
      Budding-yeast Pam16 reduces Pam18 stimulation of mtHsp70 ATPase in the
      PAM import motor.
    supporting_text: >-
      but also to reduce the stimulatory function of Pam18 on the ATPase
      activity of mtHsp70
- id: PMID:19564938
  title: 'The mitochondrial protein translocation motor: structural conservation
    between the human and yeast Tim14/Pam18-Tim16/Pam16 co-chaperones.'
  findings:
  - statement: >-
      Human and yeast Tim14/Pam18-Tim16/Pam16 soluble domains form
      heterodimeric complexes in vitro, supporting evolutionary conservation of
      the Pam16/Pam18 J-complex.
    supporting_text: >-
      the soluble domains of the human Tim14/Pam18 and Tim16/Pam16 proteins
      interact with their yeast counterparts, forming heterodimeric complexes
      and that these complexes interact with yeast mtHsp70.
- id: PMID:20053669
  title: Role of Magmas in protein transport and human mitochondria biogenesis.
  findings:
  - statement: >-
      Human MAGMAS/PAM16 is a functional Pam16 ortholog that rescues budding
      yeast lacking PAM16.
    supporting_text: >-
      Magmas showed complete growth complementation of Pam16 deleted yeast cells
      at all temperatures tested
- id: PMID:23263864
  title: Methylation-controlled J-protein MCJ acts in the import of proteins into
    human mitochondria.
  findings:
  - statement: >-
      Human MCJ/DNAJC15 and MAGMAS/PAM16 form a stable import-motor subcomplex,
      placing the Pam16/Pam18 pair in human mitochondrial protein import.
    supporting_text: >-
      We show that MCJ forms a stable subcomplex with a component of the
      mitochondrial import motor, MAGMAS
