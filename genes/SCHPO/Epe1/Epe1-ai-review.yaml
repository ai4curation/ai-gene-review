- term:
    id: GO:0006338
    label: chromatin remodeling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Chromatin remodeling is true for Epe1 but general. It is an
      ancestor of heterochromatin boundary formation (GO:0033696), which Epe1
      already carries on seven ACCEPTed experimental rows.
    action: KEEP_AS_NON_CORE
    reason: Epe1 affects chromatin structure through SAGA recruitment (Bao
      2019) and nucleosome turnover at heterochromatin, so the IBA is not
      wrong. The earlier MODIFY proposed GO:0033696, but Epe1 already has that
      term on seven ACCEPTed experimental rows. OLS lists GO:0006338 among the
      hierarchical ancestors of GO:0033696, and it is a parent of GO:0034728
      nucleosome organization (NEW row), so the specific processes are
      captured by those rows. This row is kept as a correct, non-core generic
      term, like its own parent GO:0006325. Protein
      acetylation is not proposed, because Gcn5 in SAGA performs the
      acetylation, not Epe1; Epe1's part is captured by its SAGA-binding
      (GO:0035035) row.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
