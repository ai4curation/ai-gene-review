- term:
    id: GO:0032454
    label: histone H3K9 demethylase activity
  evidence_type: IDA
  original_reference_id: PMID:25838386
  review:
    summary: PomBase IDA for H3K9 demethylase activity from Audergon et al. 
      (2015). The full text (PMC4397586, now cached) contains no in vitro 
      demethylase assay. The evidence is in vivo - epe1 deletion, and the 
      Fe(II)-site (H297A) and 2-oxoglutarate-site (K314A) point mutants, allow 
      tethered-Clr4-initiated H3K9me and silencing to persist after Clr4 
      release, and re-introducing epe1+ removes the persistent H3K9me. The 
      authors interpret this as Epe1 acting as an H3K9 demethylase, while 
      stating that demethylase activity has not been detected.
    action: UNDECIDED
    reason: The paper shows that Epe1 is required to erase H3K9me from an 
      ectopic heterochromatin site and that this requires its predicted 
      Fe(II)/2-oxoglutarate-binding residues, which is real experimental 
      evidence the curators used. It does not show that Epe1 itself catalyses 
      demethylation, and IDA is not the matching code for a genetic 
      result. Other work reports no detectable demethylase activity for
      purified Epe1 and finds that the H297A mutation compromises Swi6 binding
      in vitro (Raiymbek 2020, PMID:32195666), while Sorida 2019
      (PMID:31206516) finds only a slight binding defect but a large loss of
      heterochromatin localization; and the Fe(II) triad is non-canonical (H297-E299-Y370, with 
      Tyr370 in place of the third His ligand). The authors note that the 
