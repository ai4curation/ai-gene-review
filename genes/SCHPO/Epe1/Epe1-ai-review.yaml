id: O94603
gene_symbol: Epe1
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Epe1 is a JmjC domain-containing anti-silencing factor in fission
  yeast. Although its JmjC domain resembles those of histone demethylases, no
  demethylase activity has been detected for purified Epe1 in vitro, and its
  Fe(II)-binding triad is non-canonical (H297-E299-Y370, with Tyr370 in place
  of the third His ligand); whether it has latent or in vivo catalytic
  activity is unresolved, and much of its anti-silencing activity can be
  explained by non-catalytic protein interactions. It maintains heterochromatin
  boundaries by binding HP1/Swi6, recruiting the SAGA histone acetyltransferase 
  complex and Bdf2 bromodomain protein, and promoting nucleosome turnover at 
  heterochromatin sites. Epe1 prevents excessive heterochromatin spreading while
  paradoxically enabling RNAi-mediated silencing by promoting transcription of 
  repetitive elements.
existing_annotations:
- term:
    id: GO:0032452
    label: histone demethylase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: This IBA annotation is incorrect. Epe1 lacks critical catalytic 
      residues for demethylase activity (its Fe(II)-binding triad is 
      H297-E299-Y370, so the third iron ligand, a His in canonical HX(D/E)...H 
      JmjC demethylases, is replaced by Tyr370) and shows
      no detectable demethylase activity in vitro (Tsukada 2006, PMID:16362057;
      Raiymbek 2020, PMID:32195666). Its known anti-silencing mechanisms
      (Swi6 binding, recruitment of SAGA histone acetyltransferase complex and
      Bdf2 bromodomain protein to heterochromatin boundaries) do not require
      catalysis.
    action: REMOVE
    reason: What is removed here is the PAINT inference of canonical JHDM1-type
      histone demethylase activity, not a claim that latent or in vivo
      activity is excluded; the more specific GO:0032454 rows, which rest on
      PomBase experimental curation, are kept as UNDECIDED for that reason.
      No demethylase activity has been detected for purified Epe1. Mass
      spectrometry assays using purified Epe1 with methylated H3K9 peptides
      showed no detectable removal of methyl groups, even with a five-fold
      excess of Swi6/HP1 (Raiymbek 2020). The JmjC domain lacks one of the conserved
      Fe(II)-binding residues (Tyr370 in place of the third His). The
      predicted Fe(II)-site mutant H297A is not a clean test of catalysis,
      and its phenotype depends on the assay. At endogenous expression it
      behaves like epe1 deletion in erasing tethering-induced H3K9me
      (Audergon 2015) and fails to remove established ectopic heterochromatin,
      yet still suppresses ectopic heterochromatin-mediated variegation and
      has reduced heterochromatin localization (Sorida 2019). When
      overexpressed, H297A still disrupts pericentric silencing (milder than
      wild type from the chromosomal nmt41 promoter, similar to wild type from
      a plasmid), and this effect depends on SAGA (Bao 2019). These results
      show that part of Epe1's anti-silencing activity does not need an
      intact H297, but they do not show that no function needs it; the IBA is
      removed on the biochemical and active-site evidence, not on the H297A
      phenotype. The C-terminus alone (without
      JmjC) can disrupt heterochromatin (Raiymbek 2020). OpenScientist
      independently supported removal, tracing the live IBA to
      PANTHER:PTN000564171 and confirming the H297-E299-Y370 active-site
      divergence from canonical H-D-H JmjC demethylases.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000564171
