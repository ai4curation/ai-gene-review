- term:
    id: GO:0140680
    label: histone H3K36me/H3K36me2 demethylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: This H3K36-specific demethylase annotation is not supported.
      The H3K36 specificity comes from JHDM1-family homologs such as
      budding-yeast Jhd1, which is a distinct protein; no demethylase
      activity has been detected for Epe1, and H3K36 has not been tested.
    action: REMOVE
    reason: What is removed is the electronic inference (GO_REF:0000120) of
      canonical JHDM1-type H3K36 demethylase activity, not a claim that
      latent or in vivo activity is excluded (see the UNDECIDED GO:0032454
      rows). The H3K36 specificity is transferred by family membership from
      enzymes such as budding-yeast Jhd1, which demethylates H3K36 and is
      distinct from Epe1. No cited study has tested Epe1 on H3K36-methylated
      substrates. Purified Epe1 showed no demethylation of di- or
      tri-methyl H3K9 peptides (PMID:32195666), and the in vivo evidence
      bearing on Epe1 catalysis concerns H3K9 methylation only. With no
      activity detected on any tested substrate and a non-canonical Fe(II)
      triad (H297-E299-Y370), there is no basis for the H3K36 specificity.
    additional_reference_ids:
    - PMID:16362057
    supported_by:
    - reference_id: PMID:32195666
      supporting_text: 'We used histone H3 tail peptides with a di-methyl or a tri-methyl modification at the lysine nine position (H3K9me2 or H3K9me3 peptides) as substrates'
