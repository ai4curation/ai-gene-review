- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: This annotation is based on JmjC domain homology. No
      oxidoreductase or demethylase activity has been detected for Epe1, and
      its JmjC Fe(II)-binding triad is non-canonical, with Y370 in place of
      the third histidine ligand.
    action: REMOVE
    reason: What is removed is the InterPro-keyword inference of canonical
      JmjC enzyme activity, not a claim that latent or in vivo activity is
      excluded (see the UNDECIDED GO:0032454 rows). No demethylase activity has
      been detected for purified Epe1 (PMID:32195666). The JmjC domain has a
      non-canonical Fe(II)-binding triad (H297-E299-Y370; Tyr370 replaces the
      third, His, iron ligand of canonical JmjC demethylases). Its known
      anti-silencing mechanisms act through protein-protein interactions.
    additional_reference_ids:
    - PMID:16362057
    supported_by:
    - reference_id: file:SCHPO/Epe1/Epe1-uniprot.txt
      supporting_text: 'CC       iron catalytic His in position 370 which is replaced by a Tyr residue'
    - reference_id: file:SCHPO/Epe1/Epe1-deep-research-falcon.md
      supporting_text: |-
        Several studies report **no detectable in vitro H3K9 demethylase activity**, even though mutations in residues predicted to coordinate Fe(II) or 2-oxoglutarate affect Epe1 function in vivo.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Metal ion binding by Epe1 has not been measured. UniProt
      asserts Fe cation binding at H297 and E299, which are retained, but the
      third canonical iron ligand is replaced by Y370, so whether Epe1 binds
      Fe(II) is unresolved.
    action: UNDECIDED
    reason: This IEA comes from the UniProt Metal-binding keyword (KW-0479),
      which rests on UniProt's BINDING 297 and BINDING 299 Fe cation
      features. Those features are themselves predicted from the JmjC PROSITE
      ProRule (ECO:0000255, PRU00538), not measured, so the chain is JmjC
      domain, then PRU00538, then the BINDING features, then KW-0479, then
      GO:0046872. It is therefore a domain-derived inference, although UniProt
      places it on specific residues. Both residues are retained, and Audergon et al. treat H297 as the Fe(II) site. The Epe1
      JmjC domain has tyrosine at position 370 in place of the third
      iron-coordinating histidine of active JmjC enzymes, so canonical
      three-ligand coordination is absent. Metal binding has not been
      measured, and a two-ligand or Tyr-assisted site cannot be excluded.
      Mutating H297 or Y370 attenuates Swi6 binding in pull-downs
      (PMID:32195666), which is consistent with, but does not demonstrate, a
      metal-dependent role for the site. There is no positive evidence that
      the site cannot bind iron, so the row is left UNDECIDED, alongside the
      experimental GO:0032454 rows, until metal binding is tested directly.
    additional_reference_ids:
    - PMID:16362057
    supported_by:
    - reference_id: file:SCHPO/Epe1/Epe1-deep-research.md
      supporting_text: 'noted “no detectable demethylase activity is associated with Epe1, and its JmjC domain lacks conservation of Fe(II)-binding residues”'
    - reference_id: file:SCHPO/Epe1/Epe1-deep-research-falcon.md
      supporting_text: |-
        Raiymbek et al. (and related mechanistic work) highlight that Epe1 has a **non-canonical HXE…Y motif** and a **histidine-to-tyrosine substitution (Y370)** at a position typically associated with iron coordination in canonical JmjC demethylases.
    - reference_id: PMID:32195666
      supporting_text: mutations in residues that affect Fe(II) or
        α-ketoglutarate binding (H297A, Y307A, and Y370A) significantly
        attenuate this interaction
    - reference_id: file:SCHPO/Epe1/Epe1-uniprot.txt
      supporting_text: 'FT                   /ligand="Fe cation"'
    - reference_id: file:SCHPO/Epe1/Epe1-uniprot.txt
      supporting_text: 'FT                   /evidence="ECO:0000255|PROSITE-ProRule:PRU00538"'
