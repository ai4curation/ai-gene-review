    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 19.85). Epe1 has no demethylase activity: this review states the JmjC
      active-site residues are degenerate, and its six core functions are all binding and recruitment.
      Assigning the ancestral catalytic activity of the family to the one member that lost it is the
      canonical pseudoenzyme error. The substrate is wrong too - H3K36 demethylation belongs to the
      JHDM1/KDM2 enzymes, while the only demethylase term ever annotated to Epe1 is H3K9.
    supported_by:
