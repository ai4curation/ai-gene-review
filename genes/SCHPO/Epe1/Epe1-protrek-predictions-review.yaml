  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Epe1, the S. pombe JmjC-domain anti-silencing factor. All
  five top calls are histone demethylase activities at scores from 19.9 to 18.1, and Epe1 is a catalytically
  dead pseudo-demethylase: its JmjC domain has degenerate active-site residues and its function is
  to bind Swi6 and recruit SAGA and Bdf2. This is the same pseudoenzyme failure the BioReason evaluation
  reported for Epe1, reproduced independently. It is compounded by a substrate error - the model settles
  on H3K36, whereas the one demethylase activity actually annotated for Epe1 (GO:0032454, H3K9, EXP
  and IDA) is not in the top five. Assessment: 3 nonparalog incorrect (NPI).
