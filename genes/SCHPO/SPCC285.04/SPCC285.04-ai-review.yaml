  label: Schizosaccharomyces pombe 972h-
description: SPCC285.04 (UniProt O74492) encodes a probable 5-hydroxyisourate hydrolase (transthyretin-related
  protein family; EC 3.5.2.17). It hydrolyses 5-hydroxyisourate, the uricase product, to 2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline,
  the second step of uric acid catabolism. Function is assigned by family membership; a genome-wide screen
  places it in the cytosol.
