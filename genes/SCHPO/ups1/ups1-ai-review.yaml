  label: Schizosaccharomyces pombe 972h-
description: ups1 (SPAC31G5.08; UniProt P87214), the fission yeast ortholog of S. cerevisiae HEM4, encodes
  uroporphyrinogen-III synthase (EC 4.2.1.75). This cytosolic enzyme cyclises the linear tetrapyrrole
  hydroxymethylbilane, inverting ring D, to give uroporphyrinogen III. This is the fourth step of heme
  biosynthesis and the branch point that commits tetrapyrroles to the III isomer series. Function is assigned
  by orthology; a genome-wide screen places ups1 in the cytosol.
