  review:
    summary: >-
      Miyamoto, Tanaka and Okayama 1994 (abstract-only cache), the founding res2 paper:
      res2+ was cloned as a multicopy suppressor of a res1 null mutant, encodes a 73 kDa
      Swi/ankyrin-motif protein most similar to Res1, is largely redundant with res1+ and
