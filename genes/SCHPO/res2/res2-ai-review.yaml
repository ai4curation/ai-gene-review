- id: PMID:9303312
  title: Control of S-phase periodic transcription in the fission yeast mitotic cycle.
  findings:
  - statement: >-
      res2p has a role in switching off S-phase transcription during G2 of the mitotic
      cycle; the DSC1 bandshift activity requires res2p and correlates with inactive
      transcription.
    supporting_text: >-
      We show that the presence of the in vitro bandshift activity DSC1, conventionally
      thought to represent the active complex, requires res2p and correlates with inactive
      transcription.
  - statement: >-
      S-phase transcription is controlled by both activation and repression, with res2p
      repressing in G2 as part of DSC1.
    supporting_text: >-
      We suggest that S-phase transcription is controlled by both activation and
      repression, and that res2p represses transcription in G2 of the cell cycle as a part
      of the DSC1 complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Baum, Wuarin and Nurse 1997, EMBO J; abstract-only cache. Source of the repressor EXP,
      GO:0000122 IMP and MBF complex EXP rows; the res2-specific mutant data are in the
      full text but the conclusion is stated in the abstract.
- id: file:SCHPO/res2/res2-deep-research-falcon.md
  title: res2 deep research (falcon literature synthesis)
  findings:
  - statement: >-
      Res2 acts in the nucleus on chromatin, in Res1-Res2-Cdc10 complexes in vegetative
      cells and a Res2-Cdc10-centred complex in meiosis.
    supporting_text: >-
      Res2 acts primarily in the **nucleus on chromatin**, in complexes containing Cdc10 and
      Res1 during vegetative growth and a Res2–Cdc10-centered complex during meiotic
      differentiation.
  - statement: >-
      Full-length Res2 binds DNA weakly on its own and Cdc10 strongly enhances binding; the
      N-terminal 152 residues mediate homodimerization.
    supporting_text: >-
      Full-length Res2 binds DNA only weakly by itself; Cdc10 strongly enhances binding.
  - statement: >-
      Most MBF-dependent transcripts are constitutively derepressed in res2 cells, but a
      few (yox1, cig2, mik1) are not, so Res2 is a context-dependent activator/repressor.
    supporting_text: >-
      Most MBF-dependent transcripts become constitutively derepressed in *res2Δ*, supporting
      a major role in transcriptional shutoff, but **yox1, cig2, and mik1** can retain
      near-wild-type expression.
  - statement: >-
      Checkpoint kinases act on Cdc10, Nrm1 and Yox1; no direct checkpoint phosphorylation
      of Res2 has been shown.
    supporting_text: >-
      These pathways regulate the Res2-containing complex but have not been shown to modify
      Res2 directly.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Edison/falcon literature synthesis generated 2026-09-26 for this review, built on Zhu
      1994, Miyamoto 1994, Zhu 1997, Ayte 1997, Dutta 2008, Eshaghi 2011, Ivanova 2013 and
      Knezevic 2018. It correctly flags the unrelated S. pombe RNA triphosphatase also
      called Pct1 (the UniProt "interaction with Cdk9" note, PMID:12475973, concerns that
      capping enzyme). Quoted only for statements summarising papers not cached in
      publications/ (Zhu 1997, Eshaghi 2011, Dutta 2008); those claims were cross-checked
      against the cached primary abstracts before use.
