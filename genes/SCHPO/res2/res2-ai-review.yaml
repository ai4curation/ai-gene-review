  review:
    summary: >-
      Zhu, Takeda, Nasmyth and Jones 1994 (abstract-only cache): deletion of pct1+ (res2+) is
      not lethal but results in a severe meiotic defect, leading the authors to propose that
      the two Cdc10-containing MCB-binding complexes play differential roles in mitotic
