core_functions:
- description: >-
    Res2 is a sequence-specific DNA-binding subunit of the fission yeast MBF (DSC1)
    transcription factor. Its N-terminal APSES helix-turn-helix domain, in the Res2-Cdc10
    heteromer and in the Res1-Res2-Cdc10 core of the vegetative complex, recognises MCB
    elements (ACGCGT) but not SCB or E2F sites in the promoters of cdc22, cdc18, cdt1, cig2
    and the other S-phase genes; bound to promoter chromatin in the nucleus, Res2-containing
    MBF activates their RNA polymerase II transcription at Start, with the coactivator Rep2
    recruited to the Res2-Cdc10 unit. In the mitotic cycle this activity overlaps with
    Res1-Cdc10, so res2 deletion is viable but res2+ is required with res1+ for the
    initiation of mitotic DNA synthesis and for the induction of cig2.
