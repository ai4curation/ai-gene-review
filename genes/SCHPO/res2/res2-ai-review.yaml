- id: PMID:8168485
  title: res2+, a new member of the cdc10+/SWI4 family, controls the 'start' of mitotic
    and meiotic cycles in fission yeast.
  findings:
  - statement: >-
      res2+ was isolated as a multicopy suppressor of a res1 null mutant and encodes a 73
      kDa Swi/ankyrin protein most similar to Res1.
    supporting_text: >-
      res2+ has been isolated as a multicopy suppressor of a res1- null mutant and specifies
