suggested_questions:
- question: >-
    Res2 carries both an activator MF (GO:0001228) and a repressor MF (GO:0001227), and
    genome-wide profiling shows that most MBF targets are derepressed in res2 cells while a
    few (yox1, cig2, mik1) are not. Is the repressive output of Res2 entirely the result of
    Nrm1/Yox1 and Cig2 docking on a DNA-bound activator, so that GO:0001227 overstates an
    intrinsic repressor activity, or does Res2 make a promoter-specific contribution (for
    example through its ankyrin/central region) that justifies keeping both MF terms?
  experts:
  - Jose Ayte
  - Robertus A. M. de Bruin
- question: >-
    The PAINT node PTN000917496 groups the DNA-binding subunits (Swi4, Mbp1, Res1, Res2)
    with the shared regulatory subunits (Swi6, Cdc10), so that Res2 receives "is_active_in
    cytoplasm" from Swi6 and its MCB-binding IBA carries the contributes_to qualifier while
    the activator IBA uses enables. Should the DNA-binding and regulatory branches be
    separated so that localization, DNA-binding and complex-identity terms are placed on
    the correct clade?
  experts:
  - Curt Wittenberg
  - Nick Rhind
- question: >-
    Res2-Cdc10 is required for premeiotic S-phase transcription of rec8, rec11, cdc18 and
    cdc22, and the older model links Res2 to mat1/mei3 induction upstream of Pat1
    inactivation. Which of these meiotic outputs are direct Res2 targets by ChIP in meiotic
    cells, and should the meiotic role be represented as positive regulation of the meiotic
    cell cycle, as a meiotic G1/S (premeiotic DNA replication) transcription term, or both?
  experts:
  - Christopher J. McInerny
  - Hiroto Okayama
suggested_experiments:
- hypothesis: >-
    Res2 and Res1 occupy overlapping but distinct MCB promoter sets, and the repressive
    behaviour of Res2 in G2 is entirely conferred by Nrm1/Yox1 and Cig2 docking rather than
    by an intrinsic repressor activity of the Res2 DNA-binding domain.
  description: >-
    Perform ChIP-seq of endogenously tagged Res2, Res1, Cdc10, Nrm1 and Yox1 in elutriated
    wild-type, res2, nrm1 yox1 and cig2 cells across G1, S and G2 combined with nascent
    transcription (4tU-seq), and map the Res2 surfaces required for Nrm1/Yox1 and Cig2
    binding by alanine scanning of the ankyrin/central region. If separation-of-function
    alleles that lose corepressor or cyclin docking but retain MCB binding derepress the
    regulon in G2 exactly as res2 deletion does, the repressive role is a docking function
    and GO:0001227 should be reconsidered in favour of corepressor/cyclin-binding terms.
  experiment_type: ChIP-seq with separation-of-function alleles and nascent transcription readouts
- hypothesis: >-
    The meiotic specificity of Res2-Cdc10 is encoded in the Res2 APSES domain and its
    nitrogen-starvation-induced expression, not in a meiosis-specific partner.
  description: >-
    Express Res1 from the res2 promoter (and Res2 from the res1 promoter) and APSES
    domain-swap chimeras in res2 diploids induced to enter meiosis, and score premeiotic
    S-phase timing, rec8/rec11/cdc18 transcription by RT-qPCR, MCB occupancy by ChIP and
    spore viability. Rescue by Res1 expressed from the res2 promoter would place the
    specificity in expression timing; rescue only by chimeras carrying the Res2 APSES domain
    would place it in DNA recognition or dimerization.
  experiment_type: promoter-swap and domain-swap genetics with meiotic transcription and progression readouts
