id: P41412
gene_symbol: res2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  res2 (also pct1; product p73res2/Pct1) encodes a 657-residue sequence-specific DNA-binding
  subunit of the fission yeast MBF transcription factor (also called DSC1), the G1/S (Start)
  transcriptional regulator of Schizosaccharomyces pombe and, with its paralog Res1, the
  counterpart of the budding yeast Swi4 and Mbp1 subunits of SBF and MBF. Its N-terminal
  APSES/KilA-N helix-turn-helix domain (residues 8-115) carries the MCB-recognition and
  dimerization activity of the protein, a central block of two ankyrin repeats is shared with
  Res1 and Cdc10, and Res2 associates with the Swi6-like shared subunit Cdc10, which strongly
  enhances its otherwise weak DNA binding. Res2-Cdc10 (and the Res1-Res2-Cdc10 core of the
  vegetative complex) binds MluI cell-cycle box (MCB, ACGCGT) elements but not SCB or E2F
  sites, occupies the promoter chromatin of MCB-containing genes such as cdc22, cdc18, cdt1,
  cig2 and cnp1 throughout the cell cycle, and activates their RNA polymerase II transcription
  at Start. Res2 is the subunit of the promoter-bound complex through which the complex is
  switched off outside G1: the corepressor pair Nrm1/Yox1 and the S-phase cyclin Cig2, both
  themselves MBF targets, bind Res2 and repress MBF-dependent transcription in feedback loops,
  and res2 deletion derepresses most MBF-dependent transcripts in G2, so Res2 contributes to
  both activation and repression of the regulon. res2 deletion is viable in the mitotic
  cycle, where Res1-Cdc10 predominates, but res2 is highly induced during nitrogen
  starvation and conjugation, is required for the initiation of premeiotic DNA synthesis and
  for correct meiotic MCB-driven transcription of rec8, rec11, cdc18 and cdc22, and its loss
  causes a severe meiotic defect, so Res2-Cdc10 is the MBF form that predominates at the
  meiotic Start. Checkpoint control of the complex acts through Cdc10, Nrm1 and Yox1 rather
  than through Res2 itself, and DNA damage releases the Res1-Res2-Cdc10 core from chromatin.
