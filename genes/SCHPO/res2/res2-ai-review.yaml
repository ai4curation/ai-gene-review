      supporting_text: >-
        res2+ is largely redundant in function with res1+ and is required for the
        initiation of mitotic and premeiotic DNA synthesis, but has an additional role in
        meiotic division.
    - reference_id: PMID:7588609
      supporting_text: >-
        Fission yeast possess two such overlapping systems, Res1-Cdc10 and Res2-Cdc10, both
        of which act to start the mitotic and meiotic cycles.
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: EXP
  original_reference_id: PMID:30635289
  qualifier: involved_in
  review:
    summary: >-
      Aristizabal-Corrales, Yang and Li 2019 (full text cached): a visual screen for CENP-A
      (Cnp1) misregulation recovered nrm1, yox1 and res2 deletions; res2 deletion raises
      cnp1 mRNA and protein about twofold, abolishes the G1 peak of cnp1 expression, and
      Res2 is found by ChIP on the cnp1 promoter, whose MCB1 box is required for the MBF
      repressors to restrict cnp1 transcription to G1. nrm1 res2 and yox1 res2 double
      mutants are no worse than res2 alone, so Nrm1/Yox1 repress cnp1 through Res2.
    action: ACCEPT
    reason: >-
      Direct evidence that Res2 is the promoter-bound MBF subunit through which the
      Nrm1/Yox1 corepressors restrict a Pol II target gene (cnp1) outside G1, consistent
      with the earlier finding that res2p switches off S-phase transcription in G2
      (PMID:9303312). The repressive role is a core, Res2-specific function of the complex.
    supported_by:
    - reference_id: PMID:30635289
      supporting_text: >-
        ChIP analysis showed that Nrm1, Yox1, and Res2 bind to the cnp1 promoter ( Figure
        4B ).
    - reference_id: PMID:30635289
      supporting_text: >-
        Deletion of nrm1 or yox1 resulted in a ∼ 5–6-fold increase in cnp1 mRNA levels,
        whereas res2 deletion led to a more modest twofold increase
    - reference_id: PMID:30635289
      supporting_text: >-
        the nrm1 ∆ res2 ∆ and yox1 ∆ res2 ∆ double mutants display the same cnp1 mRNA level
        as the res2 ∆ single mutant ( Figure 4C ), suggesting that Nrm1 and Yox1 suppress
        cnp1 levels by interacting with Res2.
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:9303312
  qualifier: involved_in
  review:
    summary: >-
      Baum, Wuarin and Nurse 1997 (abstract-only cache): analysis of cdc10p, res1p, res2p
      and rep2p in S-phase periodic transcription of the mitotic cycle defines a new role for
      res2p in switching off S-phase transcription during G2; the DSC1 bandshift activity
      requires res2p and correlates with inactive transcription.
    action: ACCEPT
    reason: >-
      The founding evidence for the repressive role of Res2: in res2 mutants S-phase
      transcription is not shut off in G2. Later work explains the mechanism (Cig2, Nrm1 and
      Yox1 act on MBF through Res2; PMID:11781565, PMID:30635289) and genome-wide
      profiling confirms that most MBF-dependent transcripts are constitutively derepressed
      in res2 cells. Core function.
    supported_by:
    - reference_id: PMID:9303312
      supporting_text: >-
        define a new role for res2p, previously demonstrated to be important in the meiotic
        cycle, in switching off S-phase transcription during G2 of the mitotic cycle
    - reference_id: PMID:9303312
      supporting_text: >-
        We suggest that S-phase transcription is controlled by both activation and
        repression, and that res2p represses transcription in G2 of the cell cycle as a part
        of the DSC1 complex.
    - reference_id: file:SCHPO/res2/res2-deep-research-falcon.md
      supporting_text: >-
        Most MBF-dependent transcripts become constitutively derepressed in *res2Δ*,
        supporting a major role in transcriptional shutoff, but **yox1, cig2, and mik1** can
        retain near-wild-type expression.
