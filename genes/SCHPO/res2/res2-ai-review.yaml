  - statement: >-
      res2+ is largely redundant with res1+, required for initiation of mitotic and
      premeiotic DNA synthesis, has an additional role in meiotic division, is induced during
      conjugation and depends on cdc10+.
    supporting_text: >-
      res2+ is largely redundant in function with res1+ and is required for the initiation
      of mitotic and premeiotic DNA synthesis, but has an additional role in meiotic
      division.
  - statement: >-
      Res1-Cdc10 plays the major role in the mitotic cycle and Res2-Cdc10 in the meiotic
      cycle.
    supporting_text: >-
      We conclude that the fission yeast contains two functionally overlapping parallel
