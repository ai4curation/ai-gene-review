  review:
    summary: >-
      PAINT inference at the APSES-family node PTN000917496 (Swi4, Mbp1 and Swi6 with their
      C. albicans and S. pombe counterparts), seeded by the budding yeast SBF/MBF subunits
      and the C. albicans orthologs. Every extant member of the node is a subunit of a G1/S
      transcription factor (SBF, MBF, pombe MBF), so the node placement is sound and Res2 is
      inside the clade that inherited the function.
    action: ACCEPT
    reason: >-
      res2+ was isolated as a multicopy suppressor of a res1 null mutant and is required,
      redundantly with res1+, for the initiation of mitotic DNA synthesis (PMID:8168485);
      Res2-Cdc10 is one of the two parallel Start systems of fission yeast (PMID:7588609),
      and Res2 supplies MCB-binding activity to the MBF complex whose G1/S output (cdc18,
      cdt1, cdc22, cig2) is the Start switch. Core function, even though the mitotic role is
      redundant with Res1 and res2 deletion is viable.
    supported_by:
