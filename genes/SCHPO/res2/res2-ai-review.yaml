- description: >-
    Res2 is the subunit of promoter-bound MBF through which the complex is switched off
    outside G1. After the G1/S wave the S-phase cyclin Cig2 binds Res2 and the corepressor
    pair Nrm1/Yox1 docks on Res2, both in negative feedback loops (cig2, nrm1 and yox1 are
    themselves MBF targets), so that S-phase transcription and G1-restricted targets such as
    cnp1 (CENP-A) are repressed in G2; in res2 cells S-phase transcription is not shut off in
    G2, most MBF-dependent transcripts are constitutively derepressed, and cnp1 is
    overexpressed and mislocalised. The complex stays bound to its promoters throughout the
    cycle, so this repression reflects a change in the state of the DNA-bound Res2-containing
    complex rather than loss of DNA binding.
