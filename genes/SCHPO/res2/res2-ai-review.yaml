  review:
    summary: >-
      PAINT inference of a cytoplasmic site of activity at the APSES-family node, seeded by
      a single donor, budding yeast Swi6 (SGD:S000004172). Swi6 genuinely cycles between
      nucleus and cytoplasm through cell-cycle-regulated nuclear import and export, but the
      DNA-binding subunits do not: Res2 acts on promoter chromatin (PMID:24006488,
      PMID:30635289), and no cytoplasmic activity of Res2 has been described.
    action: REMOVE
    reason: >-
      Over-propagated IBA argued against on target-specific grounds, exactly as for Res1,
      Cdc10, Swi4 and Mbp1 in the sibling reviews. The cytoplasmic localization is a
      Swi6-specific regulatory property of the shared activator subunit, not a property of
      the DNA-binding subunits, and even for Swi6 the cytoplasm is where the inactive,
      exported pool resides, so "is_active_in cytoplasm" is not the right claim at this
      node; for Res2 it is contradicted by its promoter occupancy through the cell cycle
      (PMID:21132016) and by the absence of any reported cytoplasmic function.
