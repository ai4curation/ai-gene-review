  label: Schizosaccharomyces pombe 972h-
description: SPAC806.06c (UniProt Q9UT53; the fission yeast NMA1/NMA2 ortholog) encodes nicotinamide/nicotinic
  acid mononucleotide adenylyltransferase (NMNAT; EC 2.7.7.1/2.7.7.18). It adenylates NMN to NAD+ and
  NaMN to NaAD, the step shared by the de novo and salvage routes to NAD+. Function is assigned by orthology;
  it is cytosolic and nuclear in a genome-wide screen.
