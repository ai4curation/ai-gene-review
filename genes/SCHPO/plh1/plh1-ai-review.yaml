taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: plh1 (SPBC776.14; UniProt O94680; the fission yeast LRO1 ortholog) encodes phospholipid:diacylglycerol
  acyltransferase (PDAT; EC 2.3.1.158), an ER membrane enzyme that transfers an acyl chain from a phospholipid
  to diacylglycerol to make triacylglycerol without acyl-CoA. With Dga1, it makes S. pombe TAG and drives
  lipid droplet formation at the perinuclear ER. dga1 plh1 double mutants lack TAG and lipid droplets
  and die by apoptosis on entering stationary phase.
