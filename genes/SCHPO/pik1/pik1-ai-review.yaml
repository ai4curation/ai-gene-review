  label: Schizosaccharomyces pombe 972h-
description: 'pik1 (SPAC22E12.16c; UniProt Q10366) encodes one of the two essential type III phosphatidylinositol
  4-kinases of fission yeast. Pik1 is exclusively at the trans-Golgi network, where it makes the Golgi
  pool of PI4P. It is activated by the Ca2+-myristoyl switch protein Ncs1 and binds the myosin light chains
  Cdc4 and Cam2, though Ncs1 is not needed to target it to the Golgi. Earlier models implicated Pik1 in
  cytokinesis. Its 2023 characterisation showed that disrupting Pik1 lowers PI4P without changing plasma-membrane
  PI(4,5)P2 or division symmetry: the plasma-membrane PI4P kinase Stt4 makes the PI4P that feeds PI(4,5)P2
  and cytokinetic ring anchoring.'
