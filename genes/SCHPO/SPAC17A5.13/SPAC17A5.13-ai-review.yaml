  label: Schizosaccharomyces pombe 972h-
description: SPAC17A5.13 (UniProt O13774; the fission yeast FOL2 ortholog) encodes GTP cyclohydrolase
  I (EC 3.5.4.16), which converts GTP to 7,8-dihydroneopterin triphosphate, the first step of de novo
  folate (pterin moiety) synthesis. Yeasts make no tetrahydrobiopterin, so in fungi the product goes only
  to folate. Function is assigned by orthology; it is cytosolic in a genome-wide screen.
