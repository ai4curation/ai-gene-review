  label: Schizosaccharomyces pombe 972h-
description: lac1 (UniProt O59735) encodes one of the two ceramide synthase subunits of fission yeast
  (Lag1 and Lac1; TLC-domain sphinganine N-acyltransferases), which acylate sphingoid bases with very-long-chain
  acyl-CoA to make ceramide. Lac1 and Lag1 co-immunoprecipitate and co-localise at the ER but make different
  ceramide and complex sphingolipid species. Lac1, but not Lag1, is needed for proper control of cell
  growth and size.
