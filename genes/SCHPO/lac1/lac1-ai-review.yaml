  review:
    summary: Ceramide synthase (sphingoid base N-acyltransferase) activity (PAINT).
    action: ACCEPT
    reason: "Lac1 belongs to the sphingosine N-acyltransferase family and UniProt records the ceramide synthase reaction (EC 2.3.1.24). Direct enzyme assay of S. pombe Lac1 is not available; the in vivo evidence is that lac1 deletion cells fail to make phytoceramide from labelled sphingoid base, which the authors interpret as loss of the ceramide synthase step (PMID:35008733). Together with family membership this supports the activity."
    supported_by:
    - reference_id: file:SCHPO/lac1/lac1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the sphingosine N-acyltransferase family.'
    - reference_id: file:SCHPO/lac1/lac1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=sphing-4-enine + a fatty acyl-CoA = an N-acylsphing-4-enine
    - reference_id: PMID:35008733
      supporting_text: Our genetic and lipid analysis strongly suggest that Lac1 is the fundamental subunit
        of the ceramide synthase in fission yeast.
