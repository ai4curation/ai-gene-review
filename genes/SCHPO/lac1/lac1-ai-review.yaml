  review:
    summary: PAINT inference of ER localization; confirmed for S. pombe Lac1.
    action: ACCEPT
    reason: "ER is a root organelle term and the claim holds for this gene: Lac1-GFP co-localizes with the luminal ER marker mCherry-AHDL in S. pombe (PMID:35008733, the source of the separate EXP row, cited here as independent corroboration of the IBA), and UniProt records ER membrane localization by similarity with a multi-pass topology."
    supported_by:
    - reference_id: PMID:35008733
      supporting_text: In rapidly growing cells, Lac1 and Lag1 co-localized completely with the ER marker
        (Figure 2B), confirming that ceramide synthase localizes at the ER in fission yeast.
