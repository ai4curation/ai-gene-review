suggested_questions:
- question: What is the basis for the PomBase mitochondrial-matrix placement of uga1 (and ssd1) when genome-wide
    localisation shows cytosol and no presequence is apparent?
suggested_experiments:
- description: Fractionate S. pombe expressing endogenously tagged Uga1 (and Ssd1/Ssd2) into cytosol and
    protease-protected mitochondrial matrix to resolve the compartment of the GABA shunt in fission yeast.
