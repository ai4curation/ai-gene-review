  review:
    summary: PAINT IBA (is_active_in mitochondrion) from node PTN000241230, whose donors are animal and
      Dictyostelium GABA transaminases (human/mouse/rat ABAT, pig P80404, fly GABAT) that carry mitochondrial
      presequences. S. pombe Uga1 begins MSSTATVTESTHFFPNEPQG..., an acidic N-terminus without the amphipathic
      basic presequence of ABAT, and the only direct localisation data (ORFeome YFP) place it in the cytosol,
      as for S. cerevisiae Uga1.
    action: REMOVE
    reason: Compartment inherited from animal orthologs that are mitochondrial; target-specific evidence
      (cytosolic HDA, no presequence) argues against it. Same call as for S. cerevisiae UGA1.
