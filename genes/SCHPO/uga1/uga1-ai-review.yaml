  label: Schizosaccharomyces pombe 972h-
description: uga1 (SPAC19D5.07) encodes the fission yeast 4-aminobutyrate (GABA) aminotransferase (EC
  2.6.1.19), a homodimeric class-III pyridoxal 5'-phosphate-dependent aminotransferase. The purified recombinant
  enzyme transfers the amino group of GABA to 2-oxoglutarate (not pyruvate), producing succinate semialdehyde
  and L-glutamate, requires PLP, and does not act on beta-alanine. It is the middle step of GABA degradation
  (the GABA shunt), whose succinate semialdehyde is oxidised to succinate by the succinate-semialdehyde
  dehydrogenases ssd1/ssd2, and is needed to use GABA as a nitrogen source. Genome-wide localisation places
  it in the cytosol; it lacks an obvious N-terminal mitochondrial presequence, unlike the mitochondrial
  animal GABA transaminase ABAT.
