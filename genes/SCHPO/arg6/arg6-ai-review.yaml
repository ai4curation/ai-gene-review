suggested_questions:
- question: Does S. pombe arg6 require the arg11 acetylglutamate kinase domain for activity, i.e. does
    it form a NAGS/NAGK complex (GO:0106098) as S. cerevisiae Arg2 does with Arg5,6?
- question: Is the GO:0097054 L-glutamate biosynthetic process NAS from keyword mapping intended to capture
    'glutamate family amino acid metabolism'? As worded it reverses the direction of the reaction.
suggested_experiments:
- description: Assay acetyl-CoA:glutamate N-acetyltransferase activity in mitochondrial extracts of wild-type
    and arg6 deletion strains, including arginine feedback inhibition, and test co-immunoprecipitation
    with arg11.
