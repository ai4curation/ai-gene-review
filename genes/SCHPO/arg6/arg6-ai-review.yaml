  label: Schizosaccharomyces pombe 972h-
description: arg6 (SPBC725.14) encodes the mitochondrial N-acetylglutamate synthase (NAGS, EC 2.3.1.1)
  of fission yeast, the ortholog of S. cerevisiae ARG2. It transfers the acetyl group of acetyl-CoA to
  L-glutamate to form N-acetyl-L-glutamate, the first committed step of the acetylated ornithine route
  of L-ornithine and L-arginine biosynthesis. The protein has an N-terminal mitochondrial transit peptide,
  an amino-acid-kinase-like domain and a C-terminal vertebrate-like GNAT acetyltransferase domain, and
  localises to mitochondria. arg6 mutants require arginine. Note that S. pombe arg6 is not the ortholog
  of the S. cerevisiae ARG6 part of the ARG5,6 polyprotein (S. pombe arg11).
