  review:
    summary: >-
      Willet et al. isolated seven mtl16 loss-of-function alleles as synthetic lethal with
      the tri-snRNP mutant dim1-35. The mtl16 null allele was also strongly synthetic sick
      with prp31-E1 and more mildly with prp1, prp7, prp12 and prp6 alleles.
    action: KEEP_AS_NON_CORE
    reason: >-
      The genetic interactions with tri-snRNP splicing mutants are specific and fit the
      role of U6 m6A37 in 5' splice-site recognition shown by Ishigami et al. 2021. They
      confirm that Mtl16 acts in the splicing pathway through U6 modification. As with the
      IBA row, the process is genuine but downstream of the core snRNA methyltransferase
      activity, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:37637271
      supporting_text: In a synthetic lethal screen with the temperature-sensitive dim1-35 mutant, we isolated
        multiple alleles of non-essential mtl16 that encodes the U6 snRNA m 6 A methyltransferase.
    - reference_id: PMID:37637271
      supporting_text: Further genetic analysis revealed strong and specific negative genetic interactions
