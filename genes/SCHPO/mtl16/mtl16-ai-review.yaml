- term:
    id: GO:0001734
    label: mRNA m(6)A methyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1914743
  - PANTHER:PTN000333540
  - UniProtKB:Q86W50
  - WB:WBGene00014228
  review:
    summary: >-
      PAINT propagation from the eukaryotic METTL16 node PTN000333540, with human METTL16
      (MAT2A mRNA hairpins), mouse Mettl16 and C. elegans METT-10 as donors. S. pombe
      Mtl16 is not a donor for this term.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT curator placed mRNA m6A methylation at the eukaryotic METTL16 node, which
      includes S. pombe. Mtl16 keeps the catalytic NPPF motif, and no loss of activity
      has been shown, so the node placement is not contradicted and the IBA is retained.
      No mRNA substrate of Mtl16 has been identified in S. pombe, however. The vertebrate
      MAT2A 3' UTR hairpin targets are not conserved outside vertebrates, and the S. pombe
      SAM synthetase mRNA sam1 is unchanged in mtl16 deletion cells. The established
      activity in this species is U6 snRNA methylation. This row is therefore an
      inherited, unverified capacity, not part of the experimentally established core
      function. It should not be used as experimental grounding for transfer to other
      fungi.
    supported_by:
    - reference_id: PMID:34050143
      supporting_text: The 3′ UTR hairpins of MAT2A mRNA are conserved in vertebrates, but not in other organisms103.
        In fact, S. pombe sam1 mRNA, an ortholog of MAT2A, is not affected in the mtl16Δ strain (0.96-fold
        change; no significant alteration).
