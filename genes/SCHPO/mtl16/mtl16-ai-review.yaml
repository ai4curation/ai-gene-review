core_functions:
- description: >-
    SAM-dependent N6-methylation of adenosine 37 in the ACAGA box of nuclear U6 snRNA
    (the equivalent of human U6 A43). The C-terminal KA-1 domain recruits U6 through its
    internal stem-loop, and the N-terminal methyltransferase domain (NPPF catalytic motif)
    transfers the methyl group. The resulting m6A37 helps U6 recognise 5' splice sites
    that have an adenosine at intron position +4 and pair weakly with U5, which supports
    efficient splicing of a subset of introns. Established experimentally in S. pombe by
    loss of m6A37 in the deletion mutant, in vitro reconstitution with recombinant enzyme,
    kinetics, structures, and rescue by wild-type but not active-site-mutant Mtl16.
  molecular_function:
    id: GO:0120048
    label: U6 snRNA (adenine(43)-N6)-methyltransferase activity
  directly_involved_in:
  - id: GO:0120049
    label: snRNA (adenine-N6)-methylation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:34050143
    supporting_text: These results demonstrated that S. pombe Mtl16 is an m6A writer for U6 snRNA.
  - reference_id: PMID:34050143
    supporting_text: Intron retention in the mtl16Δ strain was rescued by ectopic expression of plasmid-encoded
      WT mtl16 (p-mtl16WT), but not by its active-site mutant (P169A/P170A) (p-mtl16mut).
  - reference_id: PMID:40841561
    supporting_text: These results indicate that the KA-1 domain of spMETTL16 facilitates A37 methylation in
      spU6 snRNA, similar to its role in hsMETTL1637.
  - reference_id: PMID:28525753
    supporting_text: M6A-IP of U6 snRNA was lost on RNA from two independent ΔDuf890 colonies, but m6A-IP of the
      U2 snRNA control was unaltered
suggested_questions:
- question: >-
    Does Mtl16 methylate any RNA other than U6 snRNA in S. pombe (for example, mRNAs with
    UACAGAGAA motifs in structured contexts), or is the eukaryotic-node IBA for mRNA m6A
    methyltransferase activity an inherited capacity that is unused in fission yeast?
- question: >-
    Is U6 m6A37 stoichiometry in S. pombe regulated by intracellular SAM availability, as
    suggested by the SAM sensitivity of vertebrate METTL16? Ishigami et al. found U6 fully
    modified under standard growth conditions.
- question: >-
    Should GO:0052907 (23S rRNA A1618 methyltransferase) be retracted from Mtl16 by
    PomBase, given that the PAINT METTL16 node does not carry rRNA methylation?
suggested_experiments:
- description: >-
    Run transcriptome-wide m6A mapping (for example, miCLIP or GLORI) in wild-type and
    mtl16 deletion S. pombe to test for any Mtl16-dependent mRNA or rRNA m6A sites besides
    U6 A37.
- description: >-
    Measure U6 m6A37 modification stoichiometry by LC-MS in cells grown under methionine
    limitation or with sam1 repression, to test whether Mtl16 activity in vivo responds to
    SAM.
