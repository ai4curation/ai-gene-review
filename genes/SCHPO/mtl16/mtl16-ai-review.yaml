id: O42662
gene_symbol: mtl16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  Mtl16 (SPAC27D7.08c; also called Duf890 or spMETTL16) is the fission yeast ortholog of
  human METTL16, a non-essential S-adenosyl-L-methionine (SAM)-dependent RNA
  N6-adenosine methyltransferase of the METTL16/RlmF family (Pfam Methyltransf_10). It
  installs the single N6-methyladenosine at position 37 of the conserved ACAGA box of
  spliceosomal U6 snRNA (equivalent to A43 in human U6). Deletion abolishes U6 m6A37
  completely, and recombinant Mtl16 methylates A37 of a U6 transcript in vitro in a
  SAM-dependent manner. The protein has an N-terminal Rossmann-fold methyltransferase
  domain carrying the conserved catalytic NPPF motif and a C-terminal KA-1 domain that
  binds the U6 internal stem-loop through an arginine-rich region. The KA-1 domain recruits
  the substrate and raises catalytic efficiency about 50-fold. Cryo-EM structures of the
  enzyme-U6 complex show SAM-dependent rearrangement of U6 that positions A37 in the
  catalytic pocket. The m6A37 faces position +4 of the intron during 5' splice-site
  recognition. Loss of Mtl16 therefore causes retention of a subset of introns that carry
  an adenosine at +4 and pair weakly with U5 snRNA. The mutant grows slowly on
  non-fermentable carbon, is sensitive to salt and DNA-damage stress, and is synthetically
  lethal with mutations in the U4/U6.U5 tri-snRNP components Dim1 and Prp31. Large-scale
  tagging places the protein in the nucleus and cytosol. No mRNA substrate has been
  identified in S. pombe: the SAM synthetase sam1 mRNA is unaffected in the deletion
  mutant, unlike the vertebrate MAT2A circuit.
