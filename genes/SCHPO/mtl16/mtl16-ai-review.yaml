- id: PMID:40841561
  title: Structures and mechanisms of U6 snRNA m(6)A modification by METTL16.
  findings:
  - statement: Crystal and cryo-EM structures of S. pombe METTL16 (Mtl16) with U6 snRNA show KA-1 domain recognition of the U6 internal stem-loop and SAM-dependent repositioning of A37 into the catalytic site; KA-1 raises catalytic efficiency ~50-fold and is required for splicing rescue in vivo.
    supporting_text: These results indicate that the KA-1 domain of spMETTL16 facilitates A37 methylation in
