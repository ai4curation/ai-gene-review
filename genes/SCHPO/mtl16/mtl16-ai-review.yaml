- id: PMID:28525753
  title: The U6 snRNA m(6)A Methyltransferase METTL16 Regulates SAM Synthetase Intron
    Retention.
  findings:
  - statement: Deletion of the S. pombe METTL16 homolog (Duf890/mtl16) is viable and abolishes U6 snRNA m6A while U2 snRNA m6A-IP is unchanged.
    supporting_text: M6A-IP of U6 snRNA was lost on RNA from two independent ΔDuf890 colonies, but m6A-IP of
