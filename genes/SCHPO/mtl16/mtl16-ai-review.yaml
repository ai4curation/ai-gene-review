- term:
    id: GO:0052907
    label: 23S rRNA (adenine(1618)-N(6))-methyltransferase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P75782
  review:
    summary: >-
      Ortholog-based transfer from E. coli RlmF (P75782), the bacterial member of the
      METTL16/RlmF family that methylates A1618 of 23S rRNA.
    action: REMOVE
    reason: >-
      RlmF and METTL16 both sit in PANTHER subfamily PTHR13393:SF0, but that subfamily
      contains RlmF, METTL16 and the small-molecule methyltransferase PsiM, so it does not
      define substrate. The PAINT curators propagated U6 snRNA methylation, not
      rRNA methylation, to the eukaryotic METTL16 node PTN000333540, and that omission is
      read here as deliberate. The substrate named by the term, bacterial 23S rRNA, does
      not exist in the S. pombe nucleus or cytoplasm, where Mtl16 is found, and the A1618
      sequence context is bacterial. All S. pombe experimental work identifies the
      substrate as U6 snRNA A37, and the C-terminal KA-1 domain recognises the U6 internal
      stem-loop, a feature that adapts the enzyme to U6. The term is a
      substrate-specific activity carried across a deep bacterial-eukaryotic divergence
      without evidence, and should be removed.
    supported_by:
    - reference_id: PMID:34050143
      supporting_text: By contrast, m6A37 was completely absent in the U6 snRNA isolated from the mtl16Δ strain
    - reference_id: PMID:40841561
      supporting_text: The KA-1 domain, particularly its arginine-rich region (RRR), interacts specifically
        with the internal stem-loop (ISL) of U6 snRNA, recruiting the substrate U6 snRNA to the enzyme
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: UniProtKB:P75782
        source_label: rlmF
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          E. coli RlmF genuinely methylates 23S rRNA A1618, but it belongs to the
          bacterial branch of PTHR13393:SF0; the eukaryotic METTL16 clade (PAINT node
          PTN000333540) has diverged to U6 snRNA, and the 23S substrate is absent from
          the compartments where Mtl16 acts.
