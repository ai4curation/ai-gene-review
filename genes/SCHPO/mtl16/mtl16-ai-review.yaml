- term:
    id: GO:0010608
    label: post-transcriptional regulation of gene expression
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1914743
  - PANTHER:PTN000333540
  - UniProtKB:Q86W50
  - WB:WBGene00014228
  review:
    summary: >-
      PAINT propagation from the METTL16 node, grounded in the SAM-responsive regulation
      of SAM synthetase mRNAs by human/mouse METTL16 (MAT2A) and C. elegans METT-10
      (sams). S. pombe Mtl16 is not a donor.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donor evidence describes a regulatory circuit in which METTL16 methylates or
      binds SAM synthetase transcripts to control their expression. No such regulation
      has been shown for Mtl16. The S. pombe MAT2A ortholog sam1 is unaffected by mtl16
      deletion, and the transcriptome changes in the mutant are attributed to the splicing
      defect caused by losing U6 m6A37. Ishigami et al. only speculate that U6 m6A could
      respond to SAM levels. Through the U6 modification Mtl16 has a broad, constitutive
      effect on splicing efficiency, which is already covered by the splicing rows. A
      regulatory role in post-transcriptional gene expression is not established in this
      species. It is not REMOVEd because the PAINT node placement is not contradicted by
      any S. pombe loss evidence.
    supported_by:
    - reference_id: PMID:34050143
