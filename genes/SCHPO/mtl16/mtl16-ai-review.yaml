- term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000333540
  - PomBase:SPAC27D7.08c
  review:
    summary: >-
      PAINT propagation from the eukaryotic METTL16 node PTN000333540, for which S. pombe
      Mtl16 itself is the experimental donor (PomBase IGI). In S. pombe, the U6 m6A37
      that Mtl16 installs is required for efficient splicing of A4 introns, and the
      splicing defect of the deletion is rescued by wild-type but not catalytically dead
      Mtl16 (PMID:34050143).
    action: KEEP_AS_NON_CORE
    reason: >-
      True, and consistent with the IGI row for the same term. Mtl16 contributes to
      spliceosomal splicing by chemically modifying a catalytic-core RNA of the
      spliceosome (U6 snRNA), so its splicing role is real but indirect. Mtl16 is not a
      spliceosome subunit, deletion causes only mild intron retention of a subset of
      introns, and the gene is non-essential. The core activity is U6 snRNA
      m6A methylation; splicing is the downstream process that this modification
      supports. Kept as non-core rather than accepted as core. The target appearing in its
      own WITH/FROM reflects its own experimental grounding and is not circular.
    supported_by:
    - reference_id: PMID:34050143
      supporting_text: Complementation of the mtl16Δ strain by ectopic expression of WT or the active-site
        mutant (P169A/P170A) of mtl1641,44 confirmed that the alterations in splicing were dependent on
        the methyltransferase activity of Mtl16
    - reference_id: PMID:34050143
      supporting_text: Thus, the observed phenotypes of this strain can be explained as a function of the
        splicing defect caused by loss of m6A in U6 snRNA.
