  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primarily a human METTL16 paper; the S. pombe deletion experiment (Fig. 5F) is the basis of the PomBase IMP rows.
- id: PMID:34050143
  title: A single m(6)A modification in U6 snRNA diversifies exon sequence at the 5'
    splice site.
  findings:
  - statement: Mass spectrometry shows U6 snRNA is fully modified at A37 in wild type and completely lacks m6A37 in mtl16 deletion cells.
    supporting_text: By contrast, m6A37 was completely absent in the U6 snRNA isolated from the mtl16Δ strain
  - statement: Recombinant S. pombe Mtl16 introduces m6A at U6 position 37 in vitro in a SAM-dependent manner.
    supporting_text: m6A was efficiently introduced at position 37 of U6 snRNA in the presence of SAM
  - statement: Intron retention in the mutant depends on Mtl16 catalytic activity; S. pombe sam1 (MAT2A ortholog) is not affected.
    supporting_text: In fact, S. pombe sam1 mRNA, an ortholog of MAT2A, is not affected in the mtl16Δ strain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Defines the S. pombe U6 m6A37 site, the in vitro activity and the splicing consequences. Also notes that the database start codon of mtl16 lies in an unannotated intron, so the true protein is longer at the N-terminus (398 aa in later work vs 385 aa in UniProt).
