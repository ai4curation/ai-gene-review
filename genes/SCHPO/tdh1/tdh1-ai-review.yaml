    by H2O2, which strengthens Tdh1 binding to the Mcs4 response regulator within the Mcs4-Wis4/Win1 MAPKKK
    complex; Tdh1 is required for the Mpr1 HPt-Mcs4 interaction and thus for phosphorelay activation of
