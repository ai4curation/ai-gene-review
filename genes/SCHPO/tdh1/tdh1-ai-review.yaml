  label: Schizosaccharomyces pombe 972h-
description: 'Tdh1 (SPBC32F12.11; UniProt synonym gpd1) is the major glyceraldehyde-3-phosphate dehydrogenase
  of the fission yeast Schizosaccharomyces pombe, a 336-residue homotetrameric (by similarity) NAD+-dependent
  phosphorylating GAPDH. In the cytosol it converts D-glyceraldehyde 3-phosphate, phosphate and NAD+ to
  1,3-bisphosphoglycerate and NADH, the sixth step of glycolysis; a second GAPDH gene, gpd3, is expressed
  at much lower level, so tdh1 deletion mutants remain viable on glucose. Tdh1 also has a well-characterised
  signalling role: it associates with the Mcs4 response regulator and the Wis4/Win1 MAP kinase kinase
  kinases, and H2O2 transiently oxidises its catalytic Cys-152, enhancing the Tdh1-Mcs4 interaction. Tdh1
  is required for the Mpr1-Mcs4 phosphorelay and hence for full activation of the Spc1/Sty1 stress MAPK
  by peroxide, but not by osmotic or other stresses; it dissociates from Mcs4 upon osmostress.'
