    summary: PomBase IMP 'oxygen sensor activity' from Morigasaki et al. 2008. The paper shows that the
      catalytic Cys-152 of Tdh1 is transiently oxidised by H2O2 and that this oxidation enhances Tdh1
      binding to Mcs4 and promotes peroxide signalling; the C152S mutant abolishes both. The sensed species
