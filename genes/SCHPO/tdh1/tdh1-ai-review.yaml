suggested_questions:
- question: Is the peroxide-signalling role of Tdh1 separable from its glycolytic activity, i.e. does
    oxidation of Cys-152 inactivate GAPDH catalysis during stress, and does the resulting glycolytic slowdown
    itself contribute to the response?
suggested_experiments:
- description: Measure GAPDH activity and Spc1 activation in tdh1-C152S versus catalytically impaired
    but non-oxidisable alleles to separate catalytic and signalling contributions of Cys-152.
