    label: ribonucleoprotein complex
  predicted_term_type: GO_CC
  review:
    assessment: LSP
    confidence_score: 2
    summary: Rrp36 belongs to a specifically identified ribosome-biogenesis family; characterized ortholog
      copurification with RNA-containing 90S and pre-40S particles establishes the relevant complex type.
      Curated ancestral inference already places fission yeast Rrp36 in the 90S preribosome (GO:0030686),
      consistent with its nucleolar localization. A ribonucleoprotein complex is a broader description
      of that supported complex membership. The prediction is correct but less precise than the existing
      90S assignment.
