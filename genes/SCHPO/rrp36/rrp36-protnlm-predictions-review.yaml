    label: rRNA processing
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: The specific RRP36 domain and target nucleolar localization support the conserved preribosome
      role inferred by PAINT. Purification and depletion in budding yeast establish 90S/pre-40S association
      and early small-subunit rRNA maturation; human depletion supports conservation across eukaryotes.
      GOA already records maturation of SSU-rRNA from tricistronic rRNA transcript (GO:0000462). The broad
      rRNA-processing prediction is supported but loses small-subunit specificity; no intrinsic RNase
      chemistry is implied.
    supported_by:
    - &id001
      reference_id: PMID:20038530
      supporting_text: We show that the Rrp36p protein is nucleolar and interacts with 90S and pre-40S
        preribosomal particles. Its depletion affects early cleavages of the 35S pre-rRNA and results
        in a rapid decrease in mature 18S rRNA levels.
    - reference_id: file:SCHPO/rrp36/rrp36-uniprot.txt
      supporting_text: DR   InterPro; IPR009292; RRP36.
