- term: &id003
    id: GO:0000462
    label: maturation of SSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
