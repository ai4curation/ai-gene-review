  - SGD:S000005813
  review:
    summary: Early SSU-rRNA maturation, inherited from the PAINT node seeded by budding yeast Rrp36; this
      is the core process of the gene.
    action: ACCEPT
    reason: PTHR21738 has a single subfamily (SF0) that contains S. pombe rrp36 (Q9P6P2), S. cerevisiae
      RRP36 (Q12481) and human RRP36 (Q96EU6), so the target sits inside the clade from which PAINT propagated
      the donor's experimental process term. In budding yeast, Rrp36 depletion blocks the early A0-A2 cleavages
      of the 35S pre-rRNA and depletes 18S rRNA, and the human ortholog has the same requirement, so the
      function predates the fungal/animal split. Rrp36 itself joins the 90S particle that performs these
      steps, so this is participation rather than mere necessity, even though the endonucleolytic chemistry
      belongs to other subunits. There is no S. pombe-specific evidence of loss, and the target is nucleolar.
      The single-donor seed is not a weakness.
    supported_by:
    - &id001
      reference_id: PMID:20038530
      supporting_text: We show that the Rrp36p protein is nucleolar and interacts with 90S and pre-40S
        preribosomal particles. Its depletion affects early cleavages of the 35S pre-rRNA and results
        in a rapid decrease in mature 18S rRNA levels.
    - &id006
      reference_id: PMID:20038530
      supporting_text: In parallel, we studied the human orthologue of Rrp36p in HeLa cells, and we show
        that the function of this protein in early cleavages of the pre-rRNA has been conserved through
        evolution in eukaryotes.
