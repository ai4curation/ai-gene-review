id: Q9P6P2
gene_symbol: rrp36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Rrp36 is a conserved nucleolar ribosome-biogenesis factor associated with the 90S preribosome.
  It supports early processing of the small-subunit rRNA precursor and production of the 40S ribosomal
  subunit. Comparative experiments in budding yeast and human cells establish a conserved requirement
  for early pre-rRNA cleavages, while fission yeast localization and curated phylogenetic evidence support
  the corresponding role of Rrp36. An intrinsic RNA-cleaving activity has not been established.
