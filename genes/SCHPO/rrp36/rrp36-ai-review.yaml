  - PANTHER:PTN000497661
  - SGD:S000005813
  review:
    summary: maturation of SSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
      is supported.
    action: ACCEPT
    reason: The target has the specific RRP36 family domain and a nucleolar localization in the fission
      yeast screen. Budding yeast purification and depletion experiments establish 90S/pre-40S association
      and early SSU-rRNA maturation, and human depletion supports conservation across eukaryotes. This
      agrees with the curated ancestral assertion and justifies transfer to the fission yeast ortholog.
    supported_by:
    - &id001
      reference_id: PMID:20038530
      supporting_text: We show that the Rrp36p protein is nucleolar and interacts with 90S and pre-40S
        preribosomal particles. Its depletion affects early cleavages of the 35S pre-rRNA and results
        in a rapid decrease in mature 18S rRNA levels.
    - &id002
      reference_id: PMID:16823372
      supporting_text: Next, we determined the localization of 4,431 proteins, corresponding to approximately
        90% of the fission yeast proteome, by tagging each ORF with the yellow fluorescent protein.
