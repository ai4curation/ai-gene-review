    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: No molecular function is established for Rrp36 in any species; the ND root is correct.
    action: ACCEPT
    reason: The characterised orthologs show only that Rrp36 is part of the preribosome and is required for
      cleavage. Rrp36 has no recognisable catalytic motif and has not been placed in any 90S cryo-EM structure.
      Its one documented binary contact is a yeast two-hybrid interaction with the U3 snoRNP protein Rrp9.
      That is not enough for an informative binding or structural-molecule term, and GO:0005515 protein
      binding would be uninformative anyway. Both the literature summary and the deep research found no
      biochemical activity, so the ND root should stay until there is direct evidence.
    supported_by:
    - reference_id: file:SCHPO/rrp36/rrp36-deep-research-falcon.md
      supporting_text: No nuclease, helicase, ATPase, GTPase, transferase, or other catalytic activity has
        been reported for Rrp36.
    - &id008
      reference_id: PMID:31996908
      supporting_text: some SSU-processome proteins remain unmapped, including Rrp36 and Sgd1 for which
        no 3D structures are established
