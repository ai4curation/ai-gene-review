description: Rrp36 (SPAC823.04) is a 279-residue nucleolar ribosome-biogenesis factor of the eukaryote-specific
  RRP36 family (Pfam PF06102), with long disordered, charged N- and C-terminal regions flanking a central
  coiled-coil segment. Its budding yeast and human orthologs associate with the 90S preribosome (small-subunit
  processome) and, more weakly, with pre-40S particles, and are required for the early cleavages of the
  primary pre-rRNA transcript that release the 18S rRNA precursor, and hence for 40S ribosomal subunit
  production; large-subunit rRNA production is not affected. In yeast, Rrp36 joins the preribosome after
  the UTP-A and UTP-B modules and interacts with the U3 snoRNP protein Rrp9. In fission yeast, Rrp36 localizes
  to the nucleolus. No catalytic activity or catalytic motif is known; Rrp36 is regarded as a non-enzymatic
  assembly factor, and its position within the 90S particle has not been resolved structurally.
