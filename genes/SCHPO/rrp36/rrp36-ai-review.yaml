core_functions:
- description: Non-enzymatic component of the nucleolar 90S preribosome (SSU processome) required for
    the early cleavages of the primary pre-rRNA transcript that lead to 18S rRNA and 40S subunit production.
    The function is inherited within PANTHER PTHR21738:SF0 from experimentally characterised budding yeast
    and human orthologs; nucleolar localization is observed directly in fission yeast.
  supported_by:
  - *id001
  - *id006
  - *id002
  directly_involved_in:
  - *id003
  in_complex: *id004
  locations:
  - *id005
suggested_questions:
- question: Where does Rrp36 sit in the 90S preribosome? Does its conserved coiled-coil segment contact
    pre-rRNA, the U3 snoRNP (Rrp9), or UTP-C subunits?
- question: Is S. pombe rrp36 essential, and does its depletion block the early pre-rRNA cleavages that
    separate the SSU precursor from the 5.8S/LSU precursor, as in budding yeast?
suggested_experiments:
- description: Make a conditional (degron or nmt1-repressible) rrp36 allele in S. pombe. Map pre-rRNA intermediates
    by Northern blotting and primer extension, and measure 40S/60S ratios by polysome profiling, to test
    directly the requirement for early SSU processing that is inferred from orthologs.
  experiment_type: genetic depletion with RNA processing analysis
- description: Affinity-purify tagged S. pombe Rrp36 and identify co-purifying pre-rRNAs and proteins
    (RNA-seq/CRAC and mass spectrometry) to confirm 90S membership and find direct RNA contacts.
  experiment_type: affinity purification and crosslinking
