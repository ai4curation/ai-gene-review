id: Q09756
gene_symbol: hxk1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Hexokinase 1 of fission yeast, a cytosolic ATP-dependent hexose kinase (EC 2.7.1.1) of the hexokinase family.
  It phosphorylates D-mannose and D-fructose efficiently (Km about 0.2 and 1.5 mM) but D-glucose poorly (Km about 9 mM, with
  Vmax on fructose fivefold that on glucose), a property traced to Ser213 at a position where other hexokinases have Asn.
  Its expression rises strongly during growth on fructose or glycerol. It is dispensable on glucose, where hexokinase 2 (hxk2)
  dominates, and cannot by itself support glucose fermentation; together with hxk2 it is required for growth on glucose and
  fructose, feeding hexose 6-phosphates into glycolysis.
