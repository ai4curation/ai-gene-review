  label: Schizosaccharomyces pombe 972h-
description: idh2 (UniProt Q9USP8) encodes a subunit of the mitochondrial NAD+-dependent isocitrate dehydrogenase
  (EC 1.1.1.41), an allosterically regulated hetero-octamer of Idh1 and Idh2 that oxidatively decarboxylates
  isocitrate to 2-oxoglutarate. This is a rate-controlling step of the TCA cycle and the main mitochondrial
  source of 2-oxoglutarate for glutamate. Mutants lacking NAD-IDH (glu2, glu3) need glutamate. By analogy
  to S. cerevisiae, Idh2 is the catalytic subunit and Idh1 the regulatory, AMP-binding one.
