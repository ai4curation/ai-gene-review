  label: Schizosaccharomyces pombe 972h-
description: hmg1 (its12; SPCC162.09c; UniProt Q10283) encodes the essential, polytopic HMG-CoA reductase
  (EC 1.1.1.34) of the ER and nuclear envelope. It reduces HMG-CoA to mevalonate with NADPH, the rate-limiting
  step of the mevalonate pathway. Unlike the mammalian enzyme, S. pombe Hmg1 is regulated mainly by phosphorylation
  rather than degradation. Insig (Ins1) binds the Hmg1 sterol-sensing domain and, through the MAP kinase
  Sty1, promotes phosphorylation of the active site, which raises the KM for NADPH. This phosphorylation
  rises on glucose withdrawal and is opposed by the PP2A-related phosphatase Ppe1, matching sterol synthesis
  to nutrient supply. The hmg1-1 allele is statin-hypersensitive and shows cell-wall and calcineurin-related
  phenotypes.
