suggested_questions:
- question: PomBase has not assigned Cbh1 or Abp1 a biological process from PMID:10733588 or PMID:12130537.
    Is that deliberate, for example because the double-mutant phenotypes are captured as FYPO phenotypes?
    Or should Cbh1 carry a centromeric heterochromatin-formation term, given that Cbh1 loss alone reduces
    centromeric Swi6?
- question: Does Cbh1 bind Tf2 LTRs directly, or does it reach them only through Abp1? Zaratiegui et
    al. summarize earlier work as showing that Abp1 recruits Cbh1 to the LTRs.
suggested_experiments:
- description: Test whether Cbh1 occupancy at Tf2 LTRs and at centromeric K repeats depends on Abp1, using
    ChIP-seq of tagged Cbh1 in abp1-deleted cells, together with in vitro binding of purified Cbh1 to LTR
    probes.
- description: Replace the DDE-like region of Cbh1 with mutant versions, as was done for Abp1. This would
    show whether the transposase-derived region is needed for centromeric silencing and growth in an abp1
    null background.
