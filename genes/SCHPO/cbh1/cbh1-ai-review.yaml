- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: Genetic data link Cbh1 redundantly with Abp1 to centromere function, centromeric heterochromatin
      and genome stability, but PomBase has not assigned a biological process to Cbh1 (or to Abp1) from
      these papers, and the relevant papers are abstract-only in our cache.
    action: UNDECIDED
    reason: Candidate processes exist. The abp1 cbh1 double mutant missegregates chromosomes (PMID:10733588),
      and loss of Cbh1 alone reduces centromeric Swi6 and silencing (PMID:12130537), which suggests a role
      in pericentric heterochromatin formation. Double mutants also accumulate DNA breaks at Sap1-paused
      forks (PMID:21151105). Most of this is redundant-pair necessity evidence. PomBase curated PMID:10733588
      for both Cbh1 and Abp1 and assigned neither protein GO:0007059 chromosome segregation, and Abp1, the
      dominant paralog, has no centromeric heterochromatin-formation term either. Read under the
      do-not-add-what-curators-declined rule, the earlier proposal to replace this row with chromosome
      segregation is withdrawn. Whether Cbh1 itself does part of the work of heterochromatin nucleation,
      rather than only being required for it, cannot be settled from abstracts. The row is left undecided
      and the question is raised for PomBase.
    supported_by:
    - reference_id: PMID:10733588
      supporting_text: The synergism between the two null mutations suggests that these proteins perform
        redundant functions in S. pombe chromosome segregation.
    - reference_id: PMID:12130537
      supporting_text: In the absence of Abp1 or Cbh1, the centromeric association of Swi6 is diminished,
        resulting in a decrease in silencing of the region.
