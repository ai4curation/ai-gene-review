gene_symbol: cbh1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  Cbh1 (CENP-B homolog 1; SPAC9E9.10c) is a 514-residue nuclear, sequence-specific DNA-binding protein
  of fission yeast and one of three S. pombe CENP-B-like proteins (with Abp1 and Cbh2). It has an
  N-terminal CENP-B-type helix-turn-helix DNA-binding domain followed by a region derived from a pogo-like
  DDE transposase; the fission-yeast CENP-B-like proteins arose by domestication of a pogo-like transposase
  independently of mammalian CENP-B, and no transposase or nuclease catalytic activity has been shown for
  Cbh1. Purified Cbh1 binds centromeric K-type repeat DNA and the replication origin ARS3002 at a TA-rich
  consensus (PyPuATATPyPuTA), and in vivo it associates with centromeric K-repeat chromatin and with
  non-centromeric chromatin, including the long terminal repeats of Tf2 retrotransposons where it colocalizes
  with Abp1. Cbh1 is not essential, but it acts redundantly with Abp1: loss of both proteins causes severe
  slow growth, abnormal morphology, very frequent chromosome missegregation, reduced Swi6/HP1 at
  centromeric heterochromatin and genome instability at replication forks paused at retrotransposon LTRs.
  These observations place Cbh1 as an auxiliary DNA-binding factor that helps organize centromeric
  heterochromatin and repetitive DNA, with Abp1 as the dominant family member.
