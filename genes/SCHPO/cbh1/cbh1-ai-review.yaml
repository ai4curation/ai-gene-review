taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Cbh1 is a CENP-B-related sequence-specific DNA-binding protein of fission yeast. It binds
  centromeric K-type repeat DNA and ARS3002 sequences and associates with both centromeric and noncentromeric
  chromatin. Cbh1 overlaps functionally with the related factor Abp1 in maintaining chromosome segregation
  and normal cell growth; loss of both proteins produces severe growth and segregation defects. Cbh1 belongs
  to the fission-yeast CENP-B family that also participates in repetitive-element surveillance, including
  Tf2 retrotransposon silencing and nuclear organization.
