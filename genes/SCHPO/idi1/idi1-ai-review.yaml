  review:
    summary: IPP is made by mevalonate diphosphate decarboxylase (mvd1); IDI interconverts IPP and DMAPP
      and does not make IPP de novo. The PAINT node covers plastid MEP-pathway contexts where IDI balances
      the IPP:DMAPP ratio. In the mevalonate pathway, the IDI product is DMAPP.
    action: MARK_AS_OVER_ANNOTATED
    reason: Process names the substrate, not the product, of the reaction in fungi.
