  label: Schizosaccharomyces pombe 972h-
description: 'idi1 (SPBC106.15; UniProt Q10132) encodes the type-1 isopentenyl-diphosphate delta-isomerase
  (EC 5.3.3.2). It isomerises isopentenyl diphosphate, made by the mevalonate pathway, to the allylic
  dimethylallyl diphosphate. DMAPP is the primer that farnesyl diphosphate synthase (fps1) extends with
  IPP, so the isomerase is needed for all isoprenoids: sterols, dolichol, ubiquinone, heme A and prenylated
  proteins. The S. pombe cDNA complements the essential S. cerevisiae idi1 disruption, and the protein
  is cytosolic in a genome-wide screen.'
