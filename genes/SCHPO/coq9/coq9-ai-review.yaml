id: O13850
gene_symbol: coq9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: coq9 encodes the fission yeast Coq9 protein of the COQ9 family, a mitochondrial component
  of the CoQ biosynthetic complex. By homology with human COQ9 and S. cerevisiae Coq9, it is a membrane-associated
  lipid-binding protein with a TetR-like fold that binds isoprenoid CoQ intermediates and presents them
  to the Coq7 hydroxylase. Deletion of coq9 abolishes CoQ10 synthesis and gives the shared coq-mutant
  phenotypes; unlike the other S. pombe coq mutants, the deletion is not complemented by the human ortholog.
