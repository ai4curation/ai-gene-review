  label: Schizosaccharomyces pombe 972h-
description: coq9 (SPAC19G12.11; UniProt O13850) encodes Coq9, a lipid-binding protein that binds CoQ
  intermediates and presents them to the hydroxylase Coq7. It is one of the ten S. pombe genes (dps1,
  dlp1, ppt1, coq3-coq9) needed for CoQ10 synthesis, whose deletion abolishes CoQ10. It is a mitochondrial
  inner-membrane component of the CoQ biosynthetic complex.
