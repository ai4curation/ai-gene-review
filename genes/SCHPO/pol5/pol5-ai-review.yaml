id: O60094
gene_symbol: pol5
product_type: PROTEIN
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Pol5 is an essential nuclear and nucleolar MYBBP1A-family protein required
  for rRNA production. It binds rDNA promoter fragments in S. pombe, while conserved
  family evidence identifies Pol5 as a pre-rRNA-binding ribosome-assembly factor that
  supports processing of both ribosomal subunits and formation of the large-subunit
  peptide exit tunnel. Despite historical DNA polymerase nomenclature and retention
  of polymerase-like sequence motifs, Pol5 is functionally unrelated to B-family DNA
  polymerases.
