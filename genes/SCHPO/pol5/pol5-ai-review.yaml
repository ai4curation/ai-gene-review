core_functions:
- description: Conserved pre-rRNA-binding ribosome-assembly activity that supports
    processing and balanced maturation of the small and large ribosomal subunits.
    Budding-yeast Pol5 contacts the 5' ETS, ITS2, and domain III of 25S rRNA, promotes
    peptide-exit-tunnel protein assembly, and supports release of 5' ETS fragments;
    these mechanistic findings support the orthology-based S. pombe rRNA-processing
    annotation.
  supported_by:
  - reference_id: PMID:31745560
    supporting_text: we identify binding sites for Pol5 in the 5' external transcribed
      spacer and within domain III of the 25S rRNA sequence
  - reference_id: PMID:31745560
    supporting_text: The dual functions of Pol5 in 60S assembly and recycling of pre-40S
      AFs suggest that this factor could contribute to ensuring the stoichiometric
      production of ribosomal subunits.
