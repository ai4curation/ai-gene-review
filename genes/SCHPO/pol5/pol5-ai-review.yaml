- id: PMID:29039458
  title: DNA polymerase 5 acetylation by Eso1 is essential for Schizosaccharomyces
    pombe viability.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The PubMed-cached abstract directly supports Eso1 interaction, Pol5
      acetylation, and K47-dependent viability; it does not establish how acetylation
      affects the core pre-rRNA and ribosome-biogenesis mechanism.
  findings:
  - statement: Pol5 physically and specifically binds the acetyltransferase Eso1 (Eco1
      ortholog) in S. pombe, identified by immunoprecipitation and mass spectrometry.
    supporting_text: 'Immunoprecipitation and mass spectrometry assays identified
      Eso1

      protein binding to Cdc2, Pol5 and Cdc21, as well as other proteins.

      Pol5 protein specifically bound to Eso1 protein'
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Pol5 is acetylated by Eso1, and the conserved lysine K47 is essential
      for S. pombe viability (K47R is lethal).
    supporting_text: 'the mutation of the Pol5 K47 site to arginine was lethal to

      S. pombe. Eso1 protein was able to acetylate Pol5 protein and mediate

      S. pombe viability.'
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: file:SCHPO/pol5/pol5-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: S. pombe pol5 (O60094 /
    SPBC14C8.14c) functional annotation.'
  findings:
  - statement: Synthesized assessment that fission-yeast Pol5, despite its historical
      DNA polymerase V/phi name, functions primarily in rDNA/rRNA production and ribosome
      biogenesis rather than chromosomal replication.
    supporting_text: 'experimental and comparative evidence supports its primary role
      in

      **ribosomal DNA (rDNA) / rRNA production and ribosome biogenesis**.'
    reference_section_type: OTHER
  - statement: Pol5 is best conceptualized as a trans-acting ribosome biogenesis factor
      coupling rDNA transcription/co-transcriptional processing to ribosome assembly.
    supporting_text: 'Pol5 is best conceptualized as a **trans-acting ribosome biogenesis

      factor** that couples rDNA transcription and/or co-transcriptional

      processing to productive ribosome assembly (strongest mechanistic

      support from *S. cerevisiae*).'
    reference_section_type: OTHER
  - statement: pol5+ is essential for viability in fission yeast.
    supporting_text: 'pol5+ disruption/analysis in the thesis work indicates **pol5+
      is

      essential** for viability.'
    reference_section_type: OTHER
  - statement: Pol5 is an Eso1-binding protein and acetylation substrate in S. pombe
      (mapped to Eso1 C-terminal/Eco1-homology region).
    supporting_text: 'Pol5 is an Eso1-binding protein identified via TAP/IP-MS and
      confirmed

      by co-IP and GST pull-down mapping'
    reference_section_type: OTHER
  - statement: Mass spectrometry identified Pol5 K47 with 100% modification ratio,
      conserved with budding-yeast Pol5 K53.
    supporting_text: '**K47** had a reported **100% modification ratio** and is conserved

      with budding-yeast Pol5 (K53).'
    reference_section_type: OTHER
  - statement: A non-acetylatable K47R Pol5 mutation is lethal in S. pombe; a K47N
      acetyl-mimic supports normal growth.
    supporting_text: 'A **K47R** non-acetylatable mutation is lethal (tetrad/selection-based

      evidence); a K47N acetyl-mimic supported normal growth, and

      plasmid-borne WT Pol5 rescued K47R dependence.'
    reference_section_type: OTHER
  - statement: Cross-species mechanistic anchor - S. cerevisiae Pol5 is an essential
      nucleolar factor for 60S subunit maturation.
    supporting_text: 'In *S. cerevisiae*, Pol5 is an **essential nucleolar ribosome

      biogenesis factor** for **60S** maturation; depletion/ts alleles cause

      60S deficiency, half-mer polysomes, defective 27SB→25S processing, and

      impaired pre-60S release/export.'
    reference_section_type: OTHER
- id: file:SCHPO/pol5/pol5-hypotheses/direct-pol-i-regulation/openscientist.md
  title: OpenScientist focused review of direct RNA polymerase I regulation by S.
    pombe Pol5
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The focused review rejects direct RNA polymerase I regulation as Pol5's
      primary function and identifies pre-rRNA processing and ribosome biogenesis as
      the better-supported conserved mechanism.
    supporting_text: The seed hypothesis is **refuted as a primary-function claim**,
      and the "direct RNA-polymerase-I-regulation" reading of Pol5 is best treated as
      a **legacy over-annotation**.
    reference_section_type: OTHER
  - statement: The direct S. pombe study does not by itself distinguish transcriptional
      regulation from a downstream rRNA-processing defect.
    supporting_text: The reduction in mature rRNA seen when Pol5 is depleted is most
      parsimoniously a **downstream consequence of stalled pre-rRNA processing and precursor
      turnover**, not a loss of Pol I transcription initiation.
    reference_section_type: OTHER
  - statement: S. pombe-specific experiments are still needed to distinguish promoter-DNA
      binding from pre-rRNA binding and transcription from processing.
    supporting_text: A *S. pombe*-specific transcription-vs-processing experiment would
      close this gap.
    reference_section_type: OTHER
