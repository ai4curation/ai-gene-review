id: O60094
gene_symbol: pol5
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for pol5, the nucleolar rDNA transcriptional regulator whose
  name misleadingly suggests a DNA polymerase. The model is not misled: all five calls are nucleolar
  ribosome-biogenesis and Pol I transcription terms, and rank 2 is an exact ISO-annotated process.
  Not one call mentions DNA polymerase activity - a useful negative result, since the gene symbol
  is exactly the kind of cue that misleads name-based methods. Assessment: 2 correct novel (COR),
  1 correct not novel (CNN).
