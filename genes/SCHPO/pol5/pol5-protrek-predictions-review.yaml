- genes/SCHPO/pol5/pol5-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0042790
    label: nucleolar large rRNA transcription by RNA polymerase I
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Rank 2 (score 18.72), an exact GOA match (ISO), reviewed in place of rank 1 whose term (nucleolar
      preribosome) is obsolete in the current GO release. Nucleolar large rRNA transcription by RNA
      polymerase I is precisely pol5's characterised role and is a strict descendant of the IDA-supported
      rRNA transcription. Correct and specific; already annotated.
    supported_by:
    - reference_id: file:SCHPO/pol5/pol5-uniprot.txt
      supporting_text: >-
        rDNA transcriptional regulator pol5
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0030684
    label: preribosome
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 18.07) and absent from GOA. The preribosome is where pol5/MYBBP1A acts in 60S
      subunit assembly and pre-rRNA processing - the free-text channel returns exactly that ('Required
      for 60S ribosomal subunit formation and pre-rRNA processing'). Correct, specific and novel;
      it supplies the assembly-side localisation that the transcription-focused annotation set lacks.
    supported_by:
    - reference_id: file:SCHPO/pol5/pol5-uniprot.txt
      supporting_text: >-
        Belongs to the MYBBP1A family
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0006356
    label: regulation of transcription by RNA polymerase I
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 4 (score 17.85) and absent from GOA. Regulation of transcription by RNA polymerase I is
      the regulatory framing this review assigns - pol5 binds rDNA and regulates rather than catalyses
      transcription - and GOA records the binding and the process but not the regulatory role. Correct
      and novel. Five of five calls being on-target for a protein whose name points elsewhere is one
      of the cohort's better results.
    supported_by:
    - reference_id: file:SCHPO/pol5/pol5-uniprot.txt
      supporting_text: >-
        rDNA transcriptional regulator pol5
