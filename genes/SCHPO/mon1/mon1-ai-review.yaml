id: Q10150
gene_symbol: mon1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Schizosaccharomyces pombe mon1 encodes the conserved Mon1 subunit of
  the Mon1-Ccz1 complex, a late endosomal/vacuolar longin-domain Rab GTPase
  guanine-nucleotide exchange factor for Ypt7/Rab7-family GTPases. The complex
  acts on the vacuolar membrane system and promotes vesicle fusion and cargo
  delivery to the vacuole, including late endosome-to-vacuole transport and
  autophagy-related delivery.
existing_annotations:
- term:
    id: GO:0000329
    label: fungal-type vacuole membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000989606
  - SGD:S000003092
  review:
    summary: Accept fungal PAINT placement at PTN000989606 for Mon1 activity on
      the fungal vacuole membrane.
    action: ACCEPT
    reason: PTN000989606 places the vacuolar-membrane assertion at the fungal
      ancestor of the MON1 clade, and S. pombe mon1 is the PTHR13027:SF7
      ortholog of the experimentally characterized S. cerevisiae MON1 seed.
      Budding-yeast Mon1 and Ccz1 form a stable peripheral membrane complex that
      functions at the vacuole fusion step, so the fungal PAINT placement
      correctly captures the inherited compartment.
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: Microscopy of Ccz1 and Mon1 tagged with a fluorescent marker
        indicated that the Ccz1-Mon1 complex peripherally associated with a
        perivacuolar compartment and may attach to the vacuole membrane in agreement
        with their proposed function in fusion.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000989606
        source_status: SUPPORTS_TRANSFER
        comment: Fungal PAINT node carrying GO:0000329 from the S. cerevisiae MON1
          seed to the conserved fungal PTHR13027:SF7 Mon1 clade.
- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - FB:FBgn0031640
  - PANTHER:PTN000315021
  - SGD:S000003092
  review:
    summary: Accept; Mon1 contributes to the Mon1-Ccz1 Rab7/Ypt7 GEF complex.
    action: ACCEPT
    reason: Mon1 is not a standalone GEF, but the GO row is correctly qualified
      as contributes_to and PTN000315021 propagates this conserved molecular
      activity through Eukaryota from the S. cerevisiae and Drosophila Mon1
      seeds. The later biochemical and structural literature confirms that the
      assembled Mon1-Ccz1 complex promotes Rab7/Ypt7 nucleotide exchange through
      a Mon1-Ccz1 longin-domain interface, supporting transfer of the
      contributes_to activity to S. pombe mon1.
    supported_by:
    - reference_id: PMID:20797862
      supporting_text: We now provide evidence that the dimeric Mon1-Ccz1 complex
        is the Rab7/Ypt7 GEF.
    - reference_id: PMID:28051187
      supporting_text: The Mon1-Ccz1 complex (MC1) is the guanine nucleotide
        exchange factor (GEF) for the Rab GTPase Ypt7/Rab7 and is required for
        endosomal maturation and fusion at the vacuole/lysosome.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000315021
        source_status: SUPPORTS_TRANSFER
        comment: Eukaryotic PAINT node carrying the contributes_to GEF activity
          to fungal and metazoan Mon1 proteins; the target is in the conserved
          Mon1 subfamily and no loss of the Mon1-Ccz1 role is evident.
