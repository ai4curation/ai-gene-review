- term:
    id: GO:0006914
    label: autophagy
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - SGD:S000003092
  review:
    summary: Keep autophagy as a conserved but pathway-contextual Mon1 process.
    action: KEEP_AS_NON_CORE
    reason: Mon1-Ccz1 is required for fusion of autophagosomes with the vacuole in
      S. cerevisiae, and PomBase transferred the process to S. pombe mon1 by
      curator-reviewed orthology. This reflects a real delivery route that uses
      the Mon1-Ccz1/Ypt7 module, but the core activity of Mon1 is the complex's
      Rab7-family exchange activity in late endosome/vacuole fusion rather than
      an autophagy-specific function.
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: The mon1 Δ and ccz1 Δ strains also displayed defects in
        autophagy and pexophagy, degradative pathways that share protein machinery
        and mechanistic features with the biosynthetic Cvt pathway.
