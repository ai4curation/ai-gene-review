- id: PMID:12364329
  title: The Ccz1-Mon1 protein complex is required for the late step of multiple
    vacuole delivery pathways.
  findings:
  - statement: S. cerevisiae Mon1 and Ccz1 form a stable peripheral membrane complex
      needed after vesicle formation and before or at fusion with the vacuole in
      Cvt, autophagy, pexophagy, CPY, ALP, MVB, and endocytic routes.
    supporting_text: Further analyses indicated that Mon1, like Ccz1, was required
      in nearly all membrane-trafficking pathways where the vacuole represented
      the terminal acceptor compartment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text cached S. cerevisiae primary paper establishing Mon1-Ccz1
      complex formation, peripheral localization, and multiple vacuole-delivery
      defects; it is the experimental basis for the SGD seed inherited by the S.
      pombe orthology and fungal PAINT rows.
- id: PMID:14662743
  title: Yeast homotypic vacuole fusion requires the Ccz1-Mon1 complex during the
    tethering/docking stage.
  findings:
  - statement: S. cerevisiae Mon1-Ccz1 acts on the vacuole membrane during the
      Ypt7-dependent tethering/docking stage of homotypic vacuole fusion.
    supporting_text: Analysis of homotypic vacuole fusion demonstrated that vacuoles
      from strains defective in the CCZ1 and MON1 genes could not fuse.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text cached primary paper that directly supports Mon1-Ccz1
      function on the vacuole fusion machinery in the S. cerevisiae ortholog.
- id: PMID:20797862
  title: The Mon1-Ccz1 complex is the GEF of the late endosomal Rab7 homolog Ypt7.
  findings:
  - statement: Purified S. cerevisiae Mon1-Ccz1 complex, but neither subunit by
      itself, acts as the Rab7/Ypt7 GEF.
    supporting_text: The Mon1-Ccz1 complex, but neither protein alone, counteracts
      GAP function in vivo, rescues in vitro fusion of vacuoles carrying Ypt7-GDP,
      and promotes nucleotide exchange on Ypt7 independently of Vps39/HOPS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified abstract-only primary paper that establishes the
      core Rab7/Ypt7 GEF activity of Mon1-Ccz1.
- id: PMID:28051187
  title: Architecture and mechanism of the late endosomal Rab7-like Ypt7 guanine
    nucleotide exchange factor complex Mon1-Ccz1.
  findings:
  - statement: Structural and mutational work on Chaetomium thermophilum and S.
      cerevisiae Mon1-Ccz1 identified the longin-domain GEF module, Ypt7 specificity
      determinants, and localization requirements.
    supporting_text: Here we present the overall architecture of MC1 from Chaetomium
      thermophilum, and in combining biochemical studies and mutational analysis
      in yeast, we identify the domains required for catalytic activity, complex
      assembly and localization of MC1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text cached fungal structural/mechanistic paper supporting
      conservation of the Mon1-Ccz1 Ypt7 exchange mechanism beyond S. cerevisiae.
core_functions:
- description: Mon1 is the Mon1 subunit of the conserved Mon1-Ccz1 longin-domain
    Rab GEF complex that activates Ypt7/Rab7 at late endosomal and vacuolar
    membranes to support cargo delivery and fusion with the vacuole.
  supported_by:
  - reference_id: PMID:12364329
    supporting_text: Subcellular fractionation and co-immunoprecipitation experiments
      confirm that Mon1 and Ccz1 physically interact as a stable protein complex
      termed the Ccz1-Mon1 complex.
  - reference_id: PMID:20797862
    supporting_text: We now provide evidence that the dimeric Mon1-Ccz1 complex is
      the Rab7/Ypt7 GEF.
