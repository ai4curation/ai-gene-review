  label: Schizosaccharomyces pombe 972h-
description: 'SPCC1827.02c (UniProt O74975; the fission yeast PCT1 ortholog) encodes CTP:phosphocholine
  cytidylyltransferase (CCT; EC 2.7.7.15). It makes CDP-choline from phosphocholine and CTP, the rate-limiting
  step of the CDP-choline (Kennedy) branch of phosphatidylcholine synthesis. Like its S. cerevisiae and
  mammalian orthologs, it is nuclear: CCTs act at the inner nuclear membrane, where binding to the lipid
  bilayer through an amphipathic helix activates them.'
