- id: PMID:14638855
  title: A J-protein is an essential subunit of the presequence translocase-associated
    protein import motor of mitochondria.
  findings:
  - statement: >-
      Budding-yeast Tim44 was a known peripheral inner-membrane subunit of the
      presequence translocase-associated motor that binds mtHsp70.
    supporting_text: >-
      Three different subunits of the presequence translocase-associated motor
      (PAM) of mitochondria are known, each of which is essential for cell
      viability: mtHsp70; the nucleotide exchange factor mitochondrial GrpE
      (Mge1); and the peripheral inner membrane protein Tim44, which serves as
      a binding partner for mtHsp70
- id: PMID:18400944
  title: 'Mitochondrial protein import motor: differential role of Tim44 in the
    recruitment of Pam17 and J-complex to the presequence translocase.'
  findings:
  - statement: >-
      The Tim44 adaptor helps recruit matrix Hsp70 and other PAM modules to
      TIM23 during presequence-mediated import into the matrix.
    supporting_text: >-
      MtHsp70 binds to the TIM23 complex via the adaptor protein Tim44
  - statement: >-
      Conditional budding-yeast tim44 mutant mitochondria are selectively
      defective in import of matrix-targeted precursors.
    supporting_text: >-
      We conclude that the tim44-804 mutant mitochondria are selectively
      impaired in the import of matrix-targeted precursor proteins.
  - statement: >-
      Tim44 promotes recruitment of the Pam18/Pam16 J-complex but restrains
      Pam17 binding at TIM23.
    supporting_text: >-
      Tim44 promotes the binding of the J-complex to the presequence
      translocase but impairs the binding of Pam17.
