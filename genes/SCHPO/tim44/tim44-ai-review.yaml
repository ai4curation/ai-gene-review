  label: Schizosaccharomyces pombe 972h-
description: >-
  tim44 encodes the conserved peripheral inner-mitochondrial-membrane scaffold
  subunit of the presequence translocase-associated motor. By homology to
  budding-yeast Tim44, the fission-yeast protein is inferred to act at the
  matrix face of the TIM23 channel, where it binds mitochondrial Hsp70 and helps
  recruit or regulate PAM motor modules during ATP-dependent import of
  presequence-containing proteins into the mitochondrial matrix.
