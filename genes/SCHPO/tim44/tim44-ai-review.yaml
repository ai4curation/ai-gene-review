suggested_questions:
- question: >-
    Which surfaces on S. pombe tim44 bind Ssc1, Pam18/Pam16, Pam17, and TIM23,
    and are those PAM-module contacts regulated identically to budding-yeast
    Tim44?
  experts: []
suggested_experiments:
- hypothesis: >-
    S. pombe tim44 uses the conserved Tim44 family scaffold interface to couple
    Ssc1 and the Pam18/Pam16 J-complex to the matrix side of TIM23 during
    preprotein import.
  description: >-
    Introduce mutations matching the budding-yeast tim44 motor-recruitment
    alleles, then measure Ssc1, Pam18/Pam16, and Pam17 association with TIM23
    and matrix-targeted precursor import in isolated S. pombe mitochondria.
