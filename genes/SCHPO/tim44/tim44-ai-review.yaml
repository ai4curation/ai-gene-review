core_functions:
- description: >-
    tim44 scaffolds the PAM import motor at the mitochondrial inner membrane,
    binding mitochondrial Hsp70/Ssc1 and helping recruit or regulate the
    Pam18/Pam16 and Pam17 modules that drive import of presequence-containing
    proteins into the mitochondrial matrix.
  supported_by:
  - reference_id: PMID:18400944
    supporting_text: >-
      Tim44 promotes the binding of the J-complex to the presequence
      translocase but impairs the binding of Pam17.
  - reference_id: file:SCHPO/tim44/tim44-uniprot.txt
    record_section:
    - CC:SUBUNIT
    supporting_text: Component of the PAM complex
