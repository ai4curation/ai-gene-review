taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'ade8 (SPBC14F5.09c) encodes the fission yeast adenylosuccinate lyase (EC 4.3.2.2), a homotetrameric
  lyase-1 family enzyme that catalyses two non-consecutive beta-elimination reactions of purine biosynthesis, each
  releasing fumarate: cleavage of SAICAR to AICAR (step 8 of de novo IMP synthesis) and cleavage of adenylosuccinate
  (succinyl-AMP) to AMP (second step of the IMP-to-AMP branch). Partially purified S. pombe adenylosuccinate lyase
  does not process the sulfur analogues that ade7 SAICAR synthetase and adenylosuccinate synthetase form from cysteine
  sulfinate. The enzyme is cytosolic and is the ortholog of S. cerevisiae ADE13 and human ADSL.'
