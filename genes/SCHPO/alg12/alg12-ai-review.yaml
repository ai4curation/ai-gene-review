taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: alg12 (SPBC1734.12c; UniProt Q9USD4) encodes the Dol-P-Man:Man7GlcNAc2-PP-Dol alpha-1,6-mannosyltransferase
  Alg12, which adds the eighth mannose. In the lumenal phase of dolichol-linked oligosaccharide
  (Glc3Man9GlcNAc2-PP-Dol) assembly on the ER membrane, it adds the next sugar to the growing precursor
  that oligosaccharyltransferase transfers to nascent glycoproteins. Function is assigned by orthology
  to the S. cerevisiae ALG enzymes.
