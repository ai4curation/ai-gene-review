  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ntp1 (SPBC660.07; UniProt O42893) encodes the cytosolic neutral trehalase (EC 3.2.1.28),
  which hydrolyses intracellular trehalose to glucose. It is activated after the fact by heat shock, osmotic
  and oxidative stress and nutrient addition, through phosphorylation by Pka1 or Sck1 and Ca2+ binding
  to an EF-like motif. Heat-shock and nutrient activation also need Tps1, with which Ntp1 associates.
  ntp1 mutants accumulate trehalose, are more thermo- and salt-tolerant, and germinate late. Trehalose
  breakdown by Ntp1 on germination drives cytoplasmic fluidisation that breaks spore dormancy.
