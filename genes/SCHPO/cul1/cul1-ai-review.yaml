- term:
    id: GO:0000822
    label: inositol hexakisphosphate binding
  evidence_type: EXP
  original_reference_id: PMID:32047038
  qualifier: enables
  review:
    summary: Lin et al. show that inositol hexakisphosphate (IP6) is an interfacial cofactor of cullin-RING ligase-COP9
      signalosome complexes, bound by lysines of CSN2 and Rbx1; in S. pombe the Cul1-Csn2 interaction is lost when
      the IP6 synthase ipk1 is deleted.
    action: MARK_AS_OVER_ANNOTATED
    reason: The abstract explicitly places the IP6 binding site at the CSN2-Rbx1/Roc1 interface ("IP6 binds to a
      cognate pocket formed by conserved lysine residues from CSN2 and Rbx1/Roc1"), not on the cullin. The fission-yeast
      experiment behind this row (full text checked on PMC, PMC7049131) is a co-immunoprecipitation of endogenously
      tagged myc-Cul1 with TAP-Csn2 that is abolished in an ipk1 deletion, i.e. it shows that Cul1's engagement
      by the deneddylase depends on IP6, plus the finding that IP6 stimulates recombinant CSN2 binding to Cul1-5
      to varying extents. That is evidence that Cul1 is a component of an IP6-bridged CRL-CSN assembly, not that
      Cul1 itself binds IP6; the residues that coordinate the metabolite belong to Csn2 and Rbx1. Attributing inositol
      hexakisphosphate binding as a molecular function of the cullin therefore exceeds the evidence. The annotation
      is not simply wrong (the CRL-CSN complex that contains Cul1 does bind IP6, and the same GO term was assigned
      to csn2 from this paper), so it is flagged as over-annotated rather than removed; the direct binder for this
      term is Rbx1/Pip1 and Csn2. The biology it reflects, IP6-assisted deneddylation of Cul1 by the COP9 signalosome,
      is captured in the notes and the second core function.
    supported_by:
    - reference_id: PMID:32047038
      supporting_text: IP6 binds to a cognate pocket formed by conserved lysine residues from CSN2 and Rbx1/Roc1,
        thereby strengthening CRL-CSN interactions to dislodge the E2 CDC34/UBE2R from CRL and to promote CRL deneddylation.
    - reference_id: PMID:32047038
      supporting_text: The same mutation disabled Schizosaccharomyces pombe Csn2 from rescuing UV-hypersensitivity
        of csn2-null yeast.
