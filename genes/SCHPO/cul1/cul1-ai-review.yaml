core_functions:
- description: 'Cullin scaffold of SCF (Skp1-Cul1-F-box protein-Rbx1) ubiquitin ligases: the N-terminal region binds
    Skp1/Psh1 and thereby an interchangeable F-box substrate receptor (Pop1, Pop2, Pof1, Pof3, Pof14, Fbh1 and others),
    the C-terminal cullin-homology domain binds the RING-H2 protein Rbx1/Pip1, and Cul1 together with Rbx1 recruits
    the E2 so that ubiquitin is transferred from the E2 thioester to receptor-bound, phosphorylated substrates;
