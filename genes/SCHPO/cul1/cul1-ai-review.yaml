taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: 'Cul1 (also called Pcu1) is the cullin-1 scaffold of the Schizosaccharomyces pombe SCF (Skp1-Cul1-F-box
  protein) family of cullin-RING E3 ubiquitin ligases and the orthologue of budding yeast Cdc53 and human CUL1.
  It is an elongated, non-catalytic protein: its N-terminal region binds the adaptor Skp1 (Psh1), which carries
  one of the interchangeable F-box substrate receptors (the WD-repeat proteins Pop1 and Pop2, Pof1, Pof3, Pof14,
  the DNA helicase Fbh1 and others), while its C-terminal cullin-homology domain binds the RING-H2 protein Rbx1
  (Pip1), which recruits ubiquitin-charged E2 enzymes (Ubc4-type E2s support the reconstituted SCF-Fbh1) so that
  receptor-bound, usually phosphorylated, substrates are held in a productive geometry for polyubiquitination. The
  Pip1-Pcu1-Psh1 core is constant through the cell cycle and co-purifies with Pop1 and Pop2 as a ~500 kDa complex;
  the Pcu1-Rbx1 heterodimer combined with a Fbh1-Skp1 heterodimer is sufficient to reconstitute an active ligase
  in vitro. Cul1 is covalently modified on Lys713 by the ubiquitin-like protein Ned8 (NEDD8): the SCF-assembled
  pool is almost fully neddylated, the K713R mutant still assembles into SCF but cannot complement the lethality
  of a pcu1 deletion, and its overexpression stabilises the CDK inhibitor Rum1 and delays the cell cycle in G2;
  the Ned8 conjugation pathway itself is essential in fission yeast. Neddylation is reversed by the COP9 signalosome,
  whose engagement with cullin-RING ligases is bridged by inositol hexakisphosphate bound between Csn2 and Rbx1,
  and the Cul1-Csn2 interaction is lost in cells lacking the IP6 synthase Ipk1. Through its receptors, Cul1-based
  SCF ligases drive proteasomal turnover of the CDK inhibitor Rum1 and the replication-licensing factor Cdc18 (SCF-Pop1/Pop2;
  loss of Pop1 or Pop2 causes Rum1 accumulation and polyploidy), of the mitotic inhibitor kinase Wee1 (SCF-Pof3/Pof1),
  of the cadmium-responsive transcription factor Zip1 (SCF-Pof1) and of the recombinase Rad51 in stationary phase
  (SCF-Fbh1, which also ubiquitinates Rad51 in the reconstituted system), and SCF-Pof3 contributes to genome integrity
  and telomere maintenance. cul1 is essential; deletion is inviable and remains lethal in a rum1 deletion background,
  so additional essential SCF substrates exist. GFP-tagged Cul1 is present in both the nucleus and the cytoplasm:
  the nuclear pool acts on the nuclear substrates Rum1, Cdc18 and Rad51, while cytoplasmic SCF-Pop2 assemblies may
  act on cytoplasmic targets.'
