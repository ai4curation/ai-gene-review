- description: 'Ned8/NEDD8-regulated cullin-RING core: Cul1 binds the RING ubiquitin ligase Rbx1/Pip1 and is conjugated
    with Ned8 on Lys713; the SCF-assembled pool is almost fully neddylated, and neddylation, while dispensable for
    SCF assembly, is essential for ligase activity, for Rum1 degradation and for viability. The modification is
    reversed by the COP9 signalosome, whose engagement with the Cul1-Rbx1 module is bridged by inositol hexakisphosphate
    bound at the Csn2-Rbx1 interface, so that Cul1 cycles between active neddylated and CSN-sequestered states.'
