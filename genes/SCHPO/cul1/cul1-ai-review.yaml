    summary: PAINT-propagated nuclear localisation; GFP-Pcu1 is present in both the nucleus and the cytoplasm, and
      the characterised SCF substrates Rum1, Cdc18 and Rad51 are nuclear proteins.
    action: ACCEPT
    reason: 'Cullins act in the nucleus across eukaryotes, and the S. pombe data agree: mildly overexpressed GFP-Pcu1
      localises to cytoplasm and nucleus (PMID:12167173), the SCF-Pop1 receptor is nuclear, and SCF-Fbh1 is annotated
      as a nuclear SCF complex (PMID:25165823). The nucleus is the compartment in which the best-established Cul1
      functions (Rum1/Cdc18 destruction at G1/S, Rad51 turnover) take place. Behind the IBA is a PAINT IBD placed
      on the cullin family node (PANTHER:PTN002631076) or the Cul1/Cdc53 subfamily node (PANTHER:PTN000231993) from
      the experimentally annotated human, fly, worm, plant and yeast cullins; S. pombe cul1 sits inside the clade
      that inherited the function, and the fission-yeast experiments confirm it directly, so there is no target-specific
      reason to argue with the node placement. The appearance of PomBase:SPAC17G6.12 itself in the WITH/FROM column
      is expected: the gene''s own experimental annotation is one of the descendant evidences used to place the
