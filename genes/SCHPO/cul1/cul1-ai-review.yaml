proposed_new_terms: []
suggested_questions:
- question: Which essential SCF substrate(s) other than Rum1 underlie the lethality of pcu1 deletion, given that
    the deletion remains lethal in a rum1 deletion background and that Pcu1 K713R overexpression causes a G2 delay
    rather than a Rum1-type polyploidy phenotype?
- question: Should the IP6-dependent CSN engagement of Cul1 be modelled as inositol hexakisphosphate binding on
    Rbx1/Pip1 and Csn2 (the residues that coordinate the metabolite) with Cul1 as a complex partner, rather than
    as a molecular function of the cullin itself?
- question: Does the cytoplasmic pool of Cul1 support a distinct SCF-Pop2 activity on cytoplasmic substrates, as
    proposed from the differential localisation of Pop1 and Pop2, and what are those substrates?
- question: PomBase annotates the receptor Pop1 with positive regulation of G1/S transition of mitotic cell cycle
    (GO:1900087, IMP) and leaves the G1/S terms off the shared scaffold Cul1, whereas SGD and UniProt give Cdc53
    and human CUL1 GO:0000082 directly. Should the cell-cycle output of SCF-Pop1/Pop2 (Rum1 and Cdc18 destruction)
    be represented on Cul1 in fission yeast, or kept as a receptor-level statement and modelled at the SCF complex
    level in GO-CAM?
suggested_experiments:
- hypothesis: The Rum1-independent lethality of pcu1 deletion reflects stabilisation of specific SCF substrates
    (candidates Cdc18, Wee1 and unidentified targets) rather than a general loss of ubiquitination.
  description: Deplete Cul1 with an auxin-inducible degron in rum1-deleted cells, compare ubiquitin-remnant (diGly)
    proteomes and protein half-lives with and without depletion, and test whether degron mutants of the top stabilised
    candidates reproduce the terminal arrest.
  experiment_type: conditional depletion ubiquitinome with degron mutagenesis
- hypothesis: Cul1 does not itself coordinate IP6; the ipk1-dependent Cul1-Csn2 interaction is mediated entirely
    by the Rbx1/Pip1 and Csn2 lysine pocket.
  description: Test co-immunoprecipitation of Cul1-13Myc with Csn2-TAP in strains carrying the IP6-coordination
    lysine mutations in pip1 (Rbx1) versus in csn2 K70E, and perform IP6-bead pull-downs on purified Pcu1 alone
    versus the Pcu1-Rbx1 heterodimer; loss of IP6 dependence only when the Rbx1 or Csn2 lysines are mutated would
    settle where the binding site lies.
  experiment_type: co-immunoprecipitation with site-directed mutants
