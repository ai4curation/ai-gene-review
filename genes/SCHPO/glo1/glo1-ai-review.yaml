  label: Schizosaccharomyces pombe 972h-
description: glo1 (SPBC12C2.12c; UniProt Q09751) encodes glyoxalase I (lactoylglutathione lyase; EC 4.4.1.5),
  an unusual monomeric, divalent-metal-dependent enzyme that isomerises the methylglyoxal-glutathione
  hemithioacetal to S-D-lactoylglutathione, the first step of methylglyoxal detoxification. glo1 disruption
  sensitises cells to methylglyoxal, and glo1 complements S. cerevisiae glo1. Its activity rises post-translationally
  under osmotic stress and in wis1/spc1 SAPK mutants. It is cytosolic in a genome-wide screen.
