description: ale1 (lpt1; SPBC16A3.10; UniProt O42916) encodes the ER MBOAT-family lysophospholipid acyltransferase,
  the ortholog of S. cerevisiae Ale1/Lpt1. It reacylates lysophosphatidylcholine and lysophosphatidylethanolamine
  (and, more weakly, LPA) with acyl-CoA in the Lands-cycle remodelling of glycerophospholipids. Function
  is assigned by orthology; it is in the ER in a genome-wide screen.
