taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPAC4G9.15 (PomBase ifa38) encodes the very-long-chain 3-oxoacyl-CoA reductase (3-ketoacyl-CoA
  reductase, KAR; EC 1.1.1.330) of the fission yeast ER fatty-acid elongation system, a short-chain dehydrogenase/reductase
  (SDR) anchored in the endoplasmic reticulum membrane and orthologous to S. cerevisiae IFA38 and human
  HSD17B12. It catalyses the NADPH-dependent reduction of the 3-oxoacyl-CoA produced by the elo1/elo2
  condensing enzymes to (3R)-3-hydroxyacyl-CoA, the second step of each two-carbon elongation cycle, which
  is completed by the dehydratase phs1 and the enoyl reductase tsc13. The very-long-chain fatty acids
  made by this cycle are the acyl chains of ceramide and sphingolipids. Function in S. pombe is inferred
  from orthology (HAMAP MF_03107) and genome-wide ER localisation; no S. pombe-specific biochemistry has
  been reported.
