  label: Schizosaccharomyces pombe 972h-
description: Galactose-1-phosphate uridylyltransferase of fission yeast, orthologous to budding-yeast
  GAL7 and human GALT. This zinc-containing enzyme transfers UMP from UDP-glucose to galactose 1-phosphate,
  giving UDP-galactose and glucose 1-phosphate, the second step of the Leloir pathway. It is encoded in
  the silenced subtelomeric gal7-gal10-gal1 cluster. Genetic analysis shows that Gal7p converts exogenous
  galactose, via galactose 1-phosphate, into UDP-galactose for cell-surface galactosylation when the epimerases
  uge1 and gal10 are absent. It localises to the cytosol, and a nuclear signal is also seen in a proteome-wide
  screen.
