  review:
    summary: PAINT inference of a cytosolic pool, carried over from dual-localised aconitases such as
      S. cerevisiae Aco1; not shown for this S. pombe paralog, whose own localisation data are mitochondrial.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Changed from KEEP_AS_NON_CORE, which asserts the term is true while the earlier reason said it was not established. The only S. pombe localisation evidence for this protein is mitochondrial (ORFeome screen, ECO:0000269|PubMed:16823372, plus a predicted transit peptide 1..32), and no S. pombe study reports a cytosolic pool of this paralog. In S. pombe the extramitochondrial aconitase pool reported so far belongs to the paralog Aco2 (PMID:25724335), so the cytosol IBA looks like over-propagation from dual-localised orthologs.'
    supported_by:
    - reference_id: file:SCHPO/SPAC24C9.06c/SPAC24C9.06c-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion {ECO:0000269|PubMed:16823372}.'
    - reference_id: file:SCHPO/SPAC24C9.06c/SPAC24C9.06c-uniprot.txt
      record_section: ["FT:TRANSIT"]
      supporting_text: '/note="Mitochondrion"'
    - reference_id: PMID:25724335
      supporting_text: The bL21-fused Aco2 protein resides in mitochondria as well as in the cytosol
        and the nucleus.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001705783
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The cytosolic pool is a property of dual-localised source aconitases (e.g. SGD:S000004295 Aco1); this S. pombe protein's own localisation data are mitochondrial only, and the reported extramitochondrial S. pombe aconitase is the paralog Aco2.
- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: EXP
  original_reference_id: PMID:37164017
  qualifier: involved_in
  review:
    summary: 13C tracing in S. pombe versus S. japonicus shows that S. pombe runs a respiratory, oxidative
      TCA cycle (curator, full text).
    action: ACCEPT
    reason: 'Isotope tracing of wild-type S. pombe (with cox6 and sdh3 deletions as controls) shows an operating oxidative, cyclic TCA cycle in S. pombe. The study measures pathway flux rather than this individual enzyme, so the row records PomBase curators'' full-text judgement that the gene acts in that pathway; it agrees with the gene''s conserved TCA-cycle enzyme activity and is accepted.'
    supported_by:
    - reference_id: PMID:37164017
      supporting_text: S. pombe maintains both bifurcated and cyclic TCA variants
    - reference_id: PMID:37164017
      supporting_text: Indeed, only respiro-fermenting wild-type S. pombe showed M + 2 fumarate
    - reference_id: PMID:37164017
      supporting_text: Here, we use two related fission yeasts, Schizosaccharomyces pombe and Schizosaccharomyces
        japonicus, as a comparative model system.
    - reference_id: PMID:37164017
      supporting_text: We show that although S. japonicus does not respire oxygen, unlike S. pombe, it
        is capable of efficient NADH oxidation, amino acid synthesis, and ATP generation.
