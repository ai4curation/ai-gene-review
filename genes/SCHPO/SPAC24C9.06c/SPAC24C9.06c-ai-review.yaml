  label: Schizosaccharomyces pombe 972h-
description: SPAC24C9.06c (aco1; UniProt O13966) encodes the mitochondrial aconitase (EC 4.2.1.3), a [4Fe-4S]
  hydratase that isomerises citrate to isocitrate via cis-aconitate, the second step of the TCA cycle.
  It is distinct from the aconitase-bL21m fusion aco2, whose essential role is in mitochondrial translation.
  It is mitochondrial in localisation studies.
