    summary: >-
      PAINT inference at the APSES-family node PTN000917496 (Swi4, Mbp1 and Swi6 with their
      C. albicans and S. pombe counterparts), seeded by the budding yeast SBF/MBF subunits
      and the C. albicans orthologs. Every extant member of the node is a subunit of a G1/S
