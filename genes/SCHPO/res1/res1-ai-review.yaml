  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000917496
  - SGD:S000004172
  review:
    summary: >-
      PAINT inference of a cytoplasmic site of activity at the APSES-family node, seeded by
      a single donor, budding yeast Swi6 (SGD:S000004172). Swi6 genuinely cycles between
      nucleus and cytoplasm through cell-cycle-regulated nuclear import, but the DNA-binding
      subunits do not: Res1 is scored as nuclear in the ORFeome localization survey
      (PMID:16823372), acts on promoter chromatin (PMID:24006488), and no cytoplasmic
      activity of Res1 has been described.
    action: REMOVE
    reason: >-
      Over-propagated IBA argued against on target-specific grounds, exactly as for the
      paralogs Swi4 and Mbp1 in the budding yeast reviews. The cytoplasmic localization is a
      Swi6-specific regulatory property of the shared activator subunit, not a property of
      the DNA-binding subunits, and even for Swi6 the cytoplasm is where the inactive,
      exported pool resides, so "is_active_in cytoplasm" is not the right claim at this
      node; for Res1 it is contradicted by its nuclear localization and promoter occupancy.
    additional_reference_ids:
