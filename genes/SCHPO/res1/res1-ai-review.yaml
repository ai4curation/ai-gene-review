core_functions:
- description: >-
    Res1 is the sequence-specific DNA-binding subunit of the fission yeast MBF (DSC1)
    transcription factor. Its N-terminal APSES helix-turn-helix domain recognises MCB
    elements (ACGCGT) in the promoters of cdc22, cdc18, cdt1, cig2 and the other S-phase
    genes, and together with the paralogous subunit Res2 it forms the heterodimeric
    DNA-binding domain of the complex. Bound to promoter chromatin in the nucleus,
    Res1-containing MBF activates RNA polymerase II transcription of this regulon at Start,
    the switch that commits the cell to S phase; loss of res1 reduces MCB-driven transcription
    (for example of cig2) and arrests cells in G1 at restrictive temperatures. Res1 is the
    DNA-binding subunit that predominates in the mitotic cycle, whereas Res2 predominates in
    premeiotic S phase and meiosis.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  contributes_to_molecular_function:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0030907
    label: MBF transcription complex
  supported_by:
  - reference_id: PMID:7739540
    supporting_text: >-
      We determined that p72res1 can bind specifically to the cdc22 promoter, when analyzed
      by gel mobility shift assay, and that the N-terminal 157 amino acids of p72res1 are
      sufficient for this specific binding.
  - reference_id: PMID:11781565
    supporting_text: >-
      The Mlu1-binding factor (MBF) from the fission yeast Schizosaccharomyces pombe
      contains the proteins Res1p and Res2p and binds to the Mlu1 cell-cycle box (MCB)
      element in DNA, activating the transcription of genes required for S phase.
  - reference_id: PMID:1464317
    supporting_text: >-
      A disruptant of res1+ grows poorly at 30 degrees C with severe heat- and
      cold-sensitivities, and completely arrests in G1 at 36 degrees C and 23 degrees C.
  - reference_id: PMID:7909513
    supporting_text: >-
      This induction is lost in res2- cells, whereas the poly(A)+ transcript is
      significantly reduced in res1- cells.
  - reference_id: PMID:24006488
    supporting_text: >-
      Res1 and Res2, which form a heterodimeric DNA-binding domain
  - reference_id: PMID:8168485
    supporting_text: >-
      We conclude that the fission yeast contains two functionally overlapping parallel
      'start' systems, Res1-Cdc10 and Res2-Cdc10, the former of which plays a major role in
      mitotic cycle whereas the latter in meiotic cycle.
- description: >-
    Res1 heterodimerizes with the shared MBF subunit Cdc10 through its C-terminal region,
    which is necessary and sufficient for binding p85cdc10. This heterodimerization is
    obligatory for MBF activity in vivo: overexpressing the isolated cdc10-binding domain of
    Res1 titrates Cdc10, decreases MBF activity and arrests cells in G1, overexpressed
    full-length Res1 arrests growth unless Cdc10 is co-overexpressed, and the assembled
    Sct1/Cdc10 complex is the target of Cdc2- and Ran1/Puc1-dependent control of Start.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0030907
    label: MBF transcription complex
  supported_by:
  - reference_id: PMID:7739540
    supporting_text: >-
      We also determined that the C-terminal region of p72res1 is necessary and sufficient
      for binding to p85cdc10.
  - reference_id: PMID:7739540
    supporting_text: >-
      Overexpression of full-length p72res1 also leads to a growth arrest that can be
      rescued by overexpression of p85cdc10.
  - reference_id: PMID:7739540
    supporting_text: >-
      These results imply that the MBF activity in vivo is dependent on the interaction of
      p85cdc10 with p72res1.
  - reference_id: PMID:9201720
    supporting_text: >-
      We have found that in addition to Cdc2, Sct1/Cdc10 complex formation requires Ran1.
proposed_new_terms: []
suggested_questions:
- question: >-
    The PAINT node PTN000917496 groups the DNA-binding subunits (Swi4, Mbp1, Res1, Res2)
    with the shared regulatory subunits (Swi6, Cdc10), so that Res1 receives "is_active_in
    cytoplasm" from Swi6 and its MCB-binding IBA carries the contributes_to qualifier while
    the activator IBA uses enables. Should the DNA-binding and regulatory branches be
    separated so that localization, DNA-binding and complex-identity terms are placed on the
    correct clade?
  experts:
  - Jose Ayte
  - Robertus A. M. de Bruin
- question: >-
    Cig2-Cdc2 promotes phosphorylation of Res1 (reported at Ser130) as part of the negative
    feedback loop that switches MBF off after S phase, and the DNA damage checkpoint releases
    the Res1-Res2-Cdc10 core from chromatin. Is Res1 a direct Cig2-Cdc2 substrate, does its
    phosphorylation alter MCB binding or Cdc10/Res2 association, and does that justify a
    cyclin-binding or checkpoint-related annotation on Res1 rather than only on Res2, Cdc10
    and Yox1?
  experts:
  - Jose Ayte
  - Nick Rhind
- question: >-
    Loss of sct1/res1 derepresses the mating pathway and UniProt describes Res1 as a
    negative regulator of sexual differentiation, yet PomBase has not annotated a
    negative-regulation-of-conjugation process. Is the derepression a direct transcriptional
    effect of Res1-containing MBF on mating genes, or an indirect consequence of G1 arrest
    (which is itself permissive for conjugation), and which reading do the res1 disruptant
    and E56K dominant allele support?
  experts:
  - David Beach
  - Hiroto Okayama
suggested_experiments:
- hypothesis: >-
    Res1 and Res2 occupy overlapping but distinct MCB promoter sets in the mitotic cycle,
    with Res1 selectively required for the cig2/cdc18/cdt1 class, and the subunit
    specificity is encoded in the APSES domains rather than the Cdc10-binding C termini.
  description: >-
    Perform ChIP-seq of endogenously tagged Res1, Res2 and Cdc10 in elutriated wild-type,
    res1 and res2 cells across G1, S and G2, combined with nascent transcription (4tU-seq),
    and repeat with domain-swap alleles exchanging the Res1 and Res2 APSES domains. The
    outcome would separate promoter selection from complex assembly and show whether the
    mitotic bias of Res1 reflects DNA-binding specificity or subunit abundance.
  experiment_type: ChIP-seq with domain-swap genetics and nascent transcription readouts
- hypothesis: >-
    The dominant res1 E56K allele, which makes Start independent of cdc10, encodes a
    DNA-binding domain that binds MCB elements and activates transcription without Cdc10.
  description: >-
    Compare purified wild-type and E56K Res1 DNA-binding domains for MCB binding affinity
    and specificity by EMSA and in vitro selection, and profile MBF target expression and
    Res1 promoter occupancy in cdc10 null cells carrying res1-E56K. If the mutant activates
    cdc22 and cdc18 transcription in the absence of Cdc10, the activation function of MBF
    is not confined to Cdc10 and the Res1 activator annotation is independently justified.
  experiment_type: biochemical DNA-binding assays with genetic bypass analysis
