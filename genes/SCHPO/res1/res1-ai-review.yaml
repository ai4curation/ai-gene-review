id: P33520
gene_symbol: res1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: >-
  res1 (also sct1; product p72res1/Sct1) encodes a 637-residue sequence-specific DNA-binding
  subunit of the fission yeast MBF transcription factor (also called DSC1), the G1/S (Start)
  transcriptional activator of Schizosaccharomyces pombe and the counterpart of the budding
  yeast Swi4 and Mbp1 subunits of SBF and MBF. Its N-terminal APSES/KilA-N helix-turn-helix
  domain (residues 6-112; the N-terminal 157 residues are sufficient for sequence-specific
  binding) recognises MluI cell-cycle box (MCB, ACGCGT) elements such as those in the cdc22
  promoter, a central block of two ankyrin repeats is shared with Cdc10 and Res2, and the
  C-terminal region is necessary and sufficient for binding the Swi6-like shared subunit
  Cdc10. Res1, Cdc10 and the paralogous DNA-binding subunit Res2 form the core of MBF, a
  nuclear complex that occupies MCB-containing promoter chromatin and activates, at Start,
  the RNA polymerase II transcription of the S-phase genes cdc22 (ribonucleotide reductase),
  cdc18 and cdt1 (replication licensing) and the S-phase cyclin gene cig2; the coactivator
  Rep2 and the corepressor pair Nrm1/Yox1 switch the promoter-bound complex on and off, and
  Cdc2 kinase activity is needed for its reactivation in late G1. res1 disruptants grow
  poorly, are heat- and cold-sensitive and arrest in G1 at 36 and 23 degrees C while
  retaining the ability to conjugate, loss of sct1 derepresses the mating pathway, and a
  dominant E56K substitution in the DNA-binding domain makes execution of Start independent
  of cdc10. Res1-Cdc10 is the subunit pair that predominates in the mitotic cycle, whereas
  Res2-Cdc10 predominates in premeiotic S phase and meiosis, and res1 is dispensable for
  meiotic MCB-driven transcription. MBF activity is fed back upon by its own target Cig2,
  which promotes Res1 phosphorylation and inhibits MBF-dependent transcription, is
  controlled by the Ran1/Pat1 kinase through the Puc1 cyclin, and the Res1-Res2-Cdc10 core
  is released from chromatin when the DNA damage checkpoint is activated.
