      res1 was isolated as a cell division cycle gene required for entry into S phase and
      its disruptant arrests in G1 at restrictive temperatures (PMID:1464317); loss of
      sct1 causes cell cycle arrest at START (PMID:7916653). Res1 supplies the MCB-binding
      activity of MBF, whose G1/S transcriptional output (cdc18, cdt1, cdc22, cig2) is the
      Start switch of fission yeast. Core function.
