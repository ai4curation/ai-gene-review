      on the dataset.
- id: PMID:7739540
  title: The Schizosaccharomyces pombe MBF complex requires heterodimerization for
    entry into S phase.
  findings:
  - statement: >-
      MBF contains p85cdc10 and p72res1/sct1.
    supporting_text: >-
      The MBF complex contains both p85cdc10 and p72res1/sct1.
  - statement: >-
      p72res1 binds the cdc22 promoter specifically in gel shifts and its N-terminal 157
      residues suffice for this binding.
    supporting_text: >-
      We determined that p72res1 can bind specifically to the cdc22 promoter, when analyzed
      by gel mobility shift assay, and that the N-terminal 157 amino acids of p72res1 are
      sufficient for this specific binding.
  - statement: >-
      The C-terminal region of p72res1 is necessary and sufficient for Cdc10 binding, and
      MBF activity in vivo depends on the Res1-Cdc10 interaction.
    supporting_text: >-
      We also determined that the C-terminal region of p72res1 is necessary and sufficient
      for binding to p85cdc10.
  - statement: >-
      Overexpressing the cdc10-binding domain of Res1 causes G1 arrest and reduced MBF
      activity.
    supporting_text: >-
      Overexpression of the cdc10-binding domain of p72res1 leads to a G1 arrest with a cdc
      phenotype and a decrease on MBF activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Ayte et al. 1995, Mol Cell Biol; abstract-only cache, but every claim used is in the
      abstract. The central biochemical-genetic paper for Res1 and the source of the IDA,
      IMP and IPI rows.
- id: PMID:7909513
  title: A B-type cyclin negatively regulates conjugation via interacting with cell
    cycle 'start' genes in fission yeast.
  findings:
  - statement: >-
      The vegetative poly(A)+ cyc17 (cig2) transcript is significantly reduced in
      res1 mutant cells, whereas the conjugation-induced poly(A)- transcript depends on res2.
    supporting_text: >-
      This induction is lost in res2- cells, whereas the poly(A)+ transcript is
      significantly reduced in res1- cells.
  - statement: >-
      Mating inhibition and pat1 rescue by res1+/res2+ overexpression require cyc17.
    supporting_text: >-
      However, the mating inhibition as well as the ability to rescue the pat1 mutation by
      overexpression of res1+ and res2+ are totally abolished in cyc17- cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Obara-Ishihara and Okayama 1994, EMBO J; abstract-only cache. Provides the IMP
      evidence that res1 is required for cig2 (cyc17) transcription.
- id: PMID:7916653
  title: Sct1 functions in partnership with Cdc10 in a transcription complex that
    activates cell cycle START and inhibits differentiation.
  findings:
  - statement: >-
      Loss of sct1 arrests cells at START and derepresses the mating pathway.
    supporting_text: >-
      Loss of sct1 function results in cell cycle arrest at START and simultaneously in
      derepression of the mating pathway.
  - statement: >-
      p72sct1 acts with p85cdc10 in a cell-cycle regulatory transcription complex.
    supporting_text: >-
      p72sct1 is shown to act in partnership with p85cdc10 in a cell cycle regulatory
      transcription complex.
  - statement: >-
      A dominant mutation in the Sct1 DNA-binding domain (E56K) bypasses cdc10 for Start.
    supporting_text: >-
      A single dominant mutation within the putative DNA-binding domain of p72sct1 renders
      the cell independent of cdc10 function for the execution of START.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Caligiuri and Beach 1993, Cell; abstract-only cache. Independent discovery of res1 as
      sct1 and the source of the IDA, IMP and MBF-complex rows.
- id: PMID:8223442
  title: The activity of S.pombe DSC-1-like factor is cell cycle regulated and dependent
    on the activity of p34cdc2.
  findings:
  - statement: >-
      The S. pombe DSC1-like factor comprises at least the cdc10 and sct1/res1 products and
      binds promoters of genes induced before S phase.
    supporting_text: >-
      This is composed of at least the products of the cdc10 and sct1/res1 genes, and binds
      to the promoters of genes whose expression increases prior to S phase.
  - statement: >-
      p85cdc10 is nuclear, DSC1 activity is cell-cycle regulated, and its late-G1
      reactivation needs the G1 form of p34cdc2.
    supporting_text: >-
      We also show that the reactivation in late G1 is dependent on the G1 form of
      p34cdc2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reymond, Marks and Simanis 1993, EMBO J; abstract-only cache. Source of the MBF
      complex IDA row and of the Cdc2 dependence of MBF activity.
- id: PMID:9201720
  title: Ran1 functions to control the Cdc10/Sct1 complex through Puc1.
  findings:
  - statement: >-
      Start requires Cdc2 and the Sct1/Cdc10 transcription complex, whose formation also
      requires Ran1, acting through the Puc1 cyclin.
    supporting_text: >-
      We have found that in addition to Cdc2, Sct1/Cdc10 complex formation requires Ran1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Caligiuri, Connolly and Beach 1997, Mol Biol Cell; abstract-only cache. Source of a
      chromatin IDA row; the chromatin assay is not described in the abstract and is
      deferred to the curator.
- id: PMID:9303312
  title: Control of S-phase periodic transcription in the fission yeast mitotic cycle.
  findings:
  - statement: >-
      The roles of cdc10p, res1p, res2p and rep2p in S-phase periodic transcription are
      analysed; DSC1 bandshift activity requires res2p and correlates with inactive
      transcription.
    supporting_text: >-
      We investigate the role of individual components of the S-phase transcriptional
      machinery, cdc10p, res1p, res2p and rep2p
  - statement: >-
      S-phase transcription is controlled by both activation and repression, with res2p
      repressing in G2 as part of DSC1.
    supporting_text: >-
      We suggest that S-phase transcription is controlled by both activation and
      repression, and that res2p represses transcription in G2 of the cell cycle as a part
      of the DSC1 complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Baum, Wuarin and Nurse 1997, EMBO J; abstract-only cache. Source of the EXP and IMP
      rows; the res1-specific mutant data are in the full text.
- id: PMID:8168485
  title: res2+, a new member of the cdc10+/SWI4 family, controls the 'start' of mitotic
    and meiotic cycles in fission yeast.
  findings:
  - statement: >-
      res2+ was isolated as a multicopy suppressor of a res1 null mutant; Res1-Cdc10 plays
      the major role in the mitotic cycle and Res2-Cdc10 in the meiotic cycle.
    supporting_text: >-
      We conclude that the fission yeast contains two functionally overlapping parallel
      'start' systems, Res1-Cdc10 and Res2-Cdc10, the former of which plays a major role in
      mitotic cycle whereas the latter in meiotic cycle.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Miyamoto, Tanaka and Okayama 1994, EMBO J; abstract-only cache. Establishes the
      Res1/Res2 division of labour used in the description and core functions.
- id: PMID:7926774
  title: pct1+, which encodes a new DNA-binding partner of p85cdc10, is required for
    meiosis in the fission yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      pct1 (res2) encodes a second p85cdc10 DNA-binding partner related to but distinct
      from res1/sct1; both complexes bind MCB elements.
    supporting_text: >-
      Pct1+ is related to, but distinct from, the res1+/sct1+ gene that also encodes a
      p85cdc10 partner.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Zhu, Takeda, Nasmyth and Jones 1994, Genes Dev; abstract-only cache. Independent
      identification of Res2 as Pct1; used for the two-complex model.
- id: PMID:14648198
  title: DSC1-MCB regulation of meiotic transcription in Schizosaccharomyces pombe.
  findings:
  - statement: >-
      cdc10, res2, rep1 and rep2 are required for correct meiotic MCB-driven transcription,
      whereas res1 is not.
    supporting_text: >-
      We found that cdc10+, res2+, rep1+ and rep2+ are required for correct meiotic
      transcription, while res1+ is not required for this process.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cunliffe, White and McInerny 2004, Mol Genet Genomics; abstract-only cache. Used to
      confine Res1 to the mitotic program.
- id: file:SCHPO/res1/res1-deep-research-falcon.md
  title: res1 deep research (falcon literature synthesis)
  findings:
  - statement: >-
      Res1 is principally the mitotic G1/S activator; its abundance falls during meiotic
      entry and res1 null cells can complete meiosis.
    supporting_text: >-
      Res1 is predominantly the **mitotic** positive regulator.
  - statement: >-
      Res1 supplies sequence-specific promoter recognition and must heterodimerize with
      Cdc10 for productive MBF.
    supporting_text: >-
      It supplies sequence-specific promoter recognition and cooperates with Cdc10 to form
      transcriptionally competent MBF.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Edison/falcon literature synthesis built on Ayte 1995, Ayte 1997, Eshaghi 2011,
      Ivanova 2013 and Knezevic 2018; used as a cross-check of the MBF composition,
      target list and Res1/Res2 division of labour. Its claims were checked against the
      cached primary abstracts before use.
