  supporting_entities:
  - InterPro:IPR013578
  review:
    summary: >-
      Broad M16-family proteolysis mapping that is true for the Cym1/PreP
      protease.
    action: ACCEPT
    reason: >-
      Cym1 is an M16 protease that degrades mitochondrial transit peptides.
      GO:0006508 proteolysis is broad, but it accurately captures the peptide
      bond hydrolysis carried out by the PreP-family enzyme. No accepted child
      of proteolysis better captures the current evidence; GO:0043171 peptide
      catabolic process describes the peptide-substrate catabolic process as a
      separate, nonredundant term rather than as a proteolysis descendant.
    supported_by:
    - reference_id: PMID:28228553
      reference_section_type: ABSTRACT
      supporting_text: >-
