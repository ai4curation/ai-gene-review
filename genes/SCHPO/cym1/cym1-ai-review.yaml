  review:
    summary: >-
      ISS transfer of an intermembrane-space location that is unsupported
      beside the better-supported mitochondrial matrix localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Cym1/PreP degrades cleaved targeting peptides in the mitochondrial
      matrix after MPP cleavage, and both the current S. pombe UniProt record
      and current PAINT localization place the conserved PreP-family enzyme in
      the matrix. The same UniProt ISS transfer from S. cerevisiae P32898 also
