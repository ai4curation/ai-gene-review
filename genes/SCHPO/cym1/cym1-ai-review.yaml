- id: PMID:16823372
  title: >-
    ORFeome cloning and global analysis of protein localization in the fission
    yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      The Matsuyama S. pombe ORFeome project localized 4,431 fission-yeast
      proteins by C-terminal YFP tagging.
    supporting_text: >-
      we determined the localization of 4,431 proteins, corresponding to
      approximately 90% of the fission yeast proteome
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PomBase uses this screen for Cym1 mitochondrion localization; the
      abstract establishes the study scope but does not name Cym1 individually.
- id: PMID:22495024
  title: Processing peptidases in mitochondria and chloroplasts.
  findings:
  - statement: >-
      A mitochondrial and chloroplast targeting-peptide processing review
      summarizes the canonical model in which cleaved targeting peptides are
      degraded by PreP.
    supporting_text: >-
      the cleaved targeting peptides are finally degraded by the Presequence
      Protease, PreP
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Review article used as broad PreP-family context only; primary
      Cym1-specific evidence from budding yeast is available.
- id: PMID:15772085
  title: >-
    Role of the novel metallopeptidase Mop112 and saccharolysin for the
    complete degradation of proteins residing in different subcompartments of
    mitochondria.
  findings:
  - statement: >-
      Kambacheld et al. characterized budding-yeast Mop112/Cym1 as an M16
      metallopeptidase involved in degrading peptides generated during
      mitochondrial protein turnover and initially reported it as
      intermembrane-space localized.
    supporting_text: >-
      Here we describe the identification of Mop112, a novel metallopeptidase
      of the pitrilysin family M16 localized in the intermembrane space of yeast
      mitochondria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. The abstract verifies the historical S. cerevisiae
      intermembrane-space assignment and supports SGD's direct protein
      catabolic process annotation, while later primary localization evidence
      from PMID:21621546 places endogenous Cym1/Mop112 in the matrix.
- id: PMID:21621546
  title: >-
    Targeting capacity and conservation of PreP homologues localization in
    mitochondria of different species.
  findings:
  - statement: >-
      Alikhani et al. revisited the submitochondrial localization of S.
      cerevisiae Cym1/Mop112 and reported endogenous Cym1 in the mitochondrial
      matrix.
    supporting_text: >-
      Revisiting the submitochondrial localization of Cym1 revealed that
      endogenous Cym1/Mop112 is localized to the matrix space
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. The abstract verifies that later primary evidence
      superseded the original S. cerevisiae intermembrane-space assignment with
      a matrix localization for endogenous Cym1/Mop112.
- id: PMID:28228553
  title: >-
    The novel mitochondrial matrix protease Ste23 is required for efficient
    presequence degradation and processing.
  findings:
  - statement: >-
      S. cerevisiae Cym1 is a mitochondrial matrix protease that degrades
      cleaved mitochondrial peptides, and Ste23 cooperates with Cym1 in that
      process.
    supporting_text: >-
      Ste23 and Cym1 tightly cooperate to ensure the correct functioning of the
      essential presequence processing machinery.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text supports the matrix Cym1/Ste23 peptide-clearance system in
      budding yeast and thereby supports the S. pombe similarity transfers from
      the characterized Cym1 ortholog.
- id: PMID:35997162
  title: >-
    Purification and characterization of protease M, a yeast mitochondrial
    nucleotide-stimulated metal protease: its identification as CYM1 gene
    product, a mitochondrial presequence peptidase.
  findings:
  - statement: >-
      Yeast protease M is the CYM1 gene product and hydrolyzes peptide
      substrates as a mitochondrial matrix protease.
    supporting_text: >-
      protease M was a gene product of CYM1 known as mitochondrial presequence
      protease homologue in S. cerevisiae
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract is sufficient for the identity of protease M as CYM1 and
      for peptide-substrate metalloprotease activity.
- id: file:interpro/panther/PTHR43016/PTHR43016-paint.tsv
  title: PAINT annotations for PANTHER family PTHR43016
  findings:
  - statement: >-
      Current PAINT asserts metalloendopeptidase activity and protein
      catabolism at PTN000220482 and matrix localization at PTN000220483; the
      protein-catabolism IBD is a recent 2026-05-30 transfer from S. cerevisiae
      CYM1 and Plasmodium falcilysin donors.
- id: file:genes/SCHPO/cym1/cym1-uniprot.txt
  title: UniProt record for S. pombe cym1
  findings:
  - statement: >-
      UniProt describes S. pombe Cym1 as a mitochondrial matrix PreP-family
      M16 metalloendopeptidase, by similarity, that degrades mitochondrial
      transit peptides and binds one zinc ion per subunit.
core_functions:
- description: >-
    Mitochondrial matrix M16 metallopeptidase of the PreP family that degrades
    released mitochondrial presequences and other unstructured peptides after
    precursor import and processing.
  supported_by:
