    - reference_id: PMID:28228553
      supporting_text: >-
        The metalloprotease Cym1 was the only known peptide-degrading enzyme
        in the yeast mitochondrial matrix.
    - reference_id: file:genes/SCHPO/cym1/cym1-uniprot.txt
