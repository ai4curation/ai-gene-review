  - reference_id: file:genes/SCHPO/cym1/cym1-uniprot.txt
    supporting_text: >-
      DR   GO; GO:0005758; C:mitochondrial intermembrane space; ISS:UniProtKB.
suggested_experiments:
- hypothesis: >-
    S. pombe Cym1 either follows the current S. cerevisiae matrix localization
    or retains a minor intermembrane-space pool like the historical budding-yeast
    assignment.
  description: >-
    Tag or immunodetect endogenous S. pombe Cym1 in purified mitochondria and
    use submitochondrial fractionation plus protease protection to distinguish
    soluble matrix protein from intermembrane-space pools, then assay whether
    cym1 loss causes matrix presequence-peptide accumulation.
  experiment_type: submitochondrial localization and peptide-accumulation assay
