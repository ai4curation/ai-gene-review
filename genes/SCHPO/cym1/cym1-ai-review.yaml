- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR013578
  review:
    summary: >-
      Broad M16-family proteolysis mapping that is true for the Cym1/PreP
      protease.
    action: ACCEPT
    reason: >-
      Cym1 is an M16 protease that degrades mitochondrial transit peptides.
      GO:0006508 proteolysis is broad, but it accurately captures the peptide
      bond hydrolysis carried out by the PreP-family enzyme. No accepted child
      of proteolysis better captures the current evidence; GO:0043171 peptide
      catabolic process describes the peptide-substrate catabolic process as a
      separate, nonredundant term rather than as a proteolysis descendant,
      which a 2026-11-25 QuickGO ancestor check confirmed.
    supported_by:
    - reference_id: PMID:28228553
      reference_section_type: ABSTRACT
      supporting_text: >-
        Degradation of mitochondrial peptides is performed by Cym1 in yeast
        and its homologue, PreP, in humans.
    - reference_id: file:genes/SCHPO/cym1/cym1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        functions in peptide cleavage and degradation rather than in protein
        processing
