knowledge_gaps:
- gap_statement: >-
    Whether S. pombe Cym1 is exclusively a mitochondrial matrix enzyme or also
    has a stable mitochondrial intermembrane-space pool is unknown.
  boundary: >-
    S. cerevisiae Cym1 was initially reported in the intermembrane space in
    2005 and then reassigned to the matrix in 2011; current live P32898 GOA has
    matrix rows and no GO:0005758 row. The fetched S. pombe UniProt record
    still exports an ISS GO row to mitochondrial intermembrane space even though
    its CC:SUBCELLULAR LOCATION comment lists only matrix.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Resolving the compartment would determine whether GO:0005758 represents a
    genuine minor Cym1 location or an outdated propagated compartment line.
  resolution: >-
    Endogenous Cym1 localization in purified S. pombe mitochondria using
    submitochondrial fractionation and protease protection, paired with
    presequence-peptide accumulation assays in cym1 mutant cells.
  provenance:
  - reference_id: PMID:15772085
    reference_section_type: ABSTRACT
    supporting_text: >-
      Here we describe the identification of Mop112, a novel metallopeptidase
      of the pitrilysin family M16 localized in the intermembrane space of yeast
      mitochondria.
  - reference_id: PMID:21621546
    reference_section_type: ABSTRACT
    supporting_text: >-
      Revisiting the submitochondrial localization of Cym1 revealed that
      endogenous Cym1/Mop112 is localized to the matrix space
  - reference_id: file:genes/SCHPO/cym1/cym1-uniprot.txt
