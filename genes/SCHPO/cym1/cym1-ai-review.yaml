description: >-
  Cym1 is a mitochondrial matrix M16-family presequence protease of the PreP
  subfamily. By similarity to characterized fungal and plant PreP proteases, it
  is predicted to coordinate a catalytic zinc ion and degrade cleaved
  mitochondrial targeting peptides after precursor import and processing.
