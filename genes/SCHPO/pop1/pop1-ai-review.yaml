suggested_questions:
- question: Does the full text of Yamano et al. (PMID:14970237) show a pop1-dependent defect in the
    anaphase/G1 (APC/C) branch of Cig2 degradation, or does the IMP rest on the G2/M SCF branch? If the
    latter, should the GO:0031145 anaphase-promoting complex-dependent catabolic process annotation be
    re-curated to GO:0031146 SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
    with the same evidence?
- question: PomBase records the Rum1 axis as positive regulation of G1/S transition (GO:1900087), whereas
    the comparators Cdc4 and SKP2 and the repository G1/S module carry G1/S transition of mitotic cell
    cycle (GO:0000082) for the same CKI-destruction step; which framing should be used for F-box receptors
    of CKIs, and should the pop1 and pop2 reviews follow it?
- question: pop2 carries negative regulation of mitotic DNA replication initiation (GO:1903467, IMP from
    the Sud1/Cdc18 paper) but pop1 does not, although Pop1 binds Cdc18 in vivo, is required for Cdc18
    binding by Pop2, and pop1 mutants accumulate Cdc18 independently of Rum1; is the asymmetry deliberate,
    and should the Pop1-Cdc18, Pop1-Rum1 and Pop1-Cig2 substrate relationships be modelled as has_input
    on the adaptor activity in a GO-CAM rather than as protein binding rows?
suggested_experiments:
- hypothesis: Homooligomeric SCF(Pop1) complexes, which retain ubiquitin ligase activity without Pop2,
    have nuclear substrates distinct from Rum1, Cdc18 and Cig2.
  description: Compare ubiquitin-remnant (diGly) proteomes of wild-type, pop1-deleted, pop2-deleted and
    pop1 pop2 double-deleted cells in exponential growth and after nitrogen starvation, identify proteins
    whose ubiquitylation is lost only in pop1-deleted cells, and validate candidates by Pop1-13Myc co-immunoprecipitation
    and cycloheximide-chase half-life measurements in pop1 and pop2 mutants.
  experiment_type: comparative ubiquitinome with degradation kinetics
- hypothesis: The sterility and G2 arrest of pop1/ste16 mutants after nitrogen starvation are caused
    entirely by Rum1 stabilisation and not by a Rum1-independent Pop1 substrate.
  description: Quantify mating and sporulation efficiency and G1 arrest by flow cytometry in pop1-deleted
    rum1-deleted double mutants and in pop1-deleted cells expressing a Rum1 phosphodegron mutant (Ser58/Thr62
    to alanine) or a Rum1 allele engineered for Pop1-independent turnover; a residual defect would indicate
    an additional Pop1 substrate in the starvation response.
  experiment_type: epistasis and degron mutagenesis under nitrogen starvation
