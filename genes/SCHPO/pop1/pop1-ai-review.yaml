  review:
    summary: Pop1 is the F-box subunit of the nuclear SCF(Pop1/Pop2) complex (Pcu1-Pip1-Psh1-Pop1-Pop2),
      which co-fractionates at ~500 kDa and is active on Rum1; Pop1 is exclusively nuclear.
    action: ACCEPT
    reason: Core cellular component. The transfer from nuclear Cdc4 is appropriate and independently
      supported in S. pombe by co-immunoprecipitation of endogenous Pop1 with Pcu1 (cullin-1), Psh1 (Skp1)
      and Pip1 (Rbx1) in a ~500 kDa complex, by the essential role of the Pop1 F-box, and by the exclusively
      nuclear localisation of Pop1 (PMID:12167173); Pop1-containing complexes bear ubiquitin ligase activity
      even in the absence of Pop2. The nuclear qualification is better justified for Pop1 than for any
      other subunit, since the others also occur in the cytoplasm.
