  review:
    summary: Pop1 and Pop2 are the F-box receptors responsible for the SCF-dependent branch of Cig2 degradation
      (G2 and M phase); the APC/C-dependent branch (anaphase and G1) is a separate pathway in which Pop1
      plays no part.
    action: MODIFY
    reason: 'The essence of the annotation - that Pop1 mediates ubiquitin-dependent proteasomal destruction
      of the S-phase cyclin Cig2 - is sound, but the term names the wrong ligase. The paper itself separates
      the two routes: Cig2 instability in G2 and M phase depends on the SCF, for which Pop1 and Pop2
      are responsible and to which Pop1 binds phosphorylated Cig2, whereas the APC/C destroys Cig2 in
      anaphase and G1. GO:0031145 is defined by ubiquitin-protein ligation catalysed by the anaphase-promoting
      complex, of which Pop1 is not a subunit or receptor, so Pop1 does none of the work of that process;
      the precise term for its contribution is SCF-dependent proteasomal ubiquitin-dependent protein
      catabolic process (GO:0031146), which the gene already carries by ISO and which is proposed here
      as the replacement with the same IMP evidence. The cached record is abstract-only; if the full
      text documents a pop1-dependent defect specifically in the anaphase/G1 (APC/C) branch, the curator''s
      term should stand, and this is raised in suggested_questions.'
