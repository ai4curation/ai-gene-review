core_functions:
- description: 'Substrate-recognition adaptor of the nuclear SCF(Pop1/Pop2) ubiquitin ligase for the
    CDK inhibitor Rum1: the F-box tethers Pop1 to Psh1 (Skp1) on the Pcu1 (cullin-1)-Pip1 (Rbx1) core,
    the N-terminal region recruits Pop2, and the WD40 propeller captures CDK-phosphorylated Rum1 for
    polyubiquitylation and proteasomal destruction, releasing Cdc2 activity so that cells pass G1/S
    and, under nitrogen starvation, can execute a proper G1 arrest before sexual differentiation.'
