    summary: IBA transfer of an is_active_in cytoplasm assertion from a deep PANTHER WD40-family node
      whose seeds are chiefly LIS1/PAFAH1B1 dynein regulators (with a trypanosome G-beta-like protein
      and mouse Fbxw11); Pop1 itself is exclusively nuclear by three independent methods.
    action: REMOVE
    reason: 'This IBA descends from PANTHER:PTN008687761, a node of the WD40 repeat protein family PTHR19848
      whose cytoplasm IBD (2025-10-29) is seeded by human PAFAH1B1/LIS1 (P43034), its mouse, fly, worm,
      zebrafish and Dictyostelium counterparts, S. cerevisiae PAC1, a Trypanosoma brucei G-protein beta-like
      (RACK1-type) protein and mouse Fbxw11 (beta-TrCP2). The node lies deep enough to group dynein
      regulators, a RACK1-type scaffold and F-box proteins, so what it asserts is little more than that
      WD40 proteins occur in the cytoplasm. The argument is with the node placement, not the donor count:
      Pop1 is a member of the clade, but there is target-specific evidence of divergence in this very
      property. Low-level GFP-Pop1, endogenous Pop1-13Myc immunofluorescence and nuclear/cytoplasmic
      fractionation against PCNA and tubulin markers all place Pop1 exclusively in the nucleus, in explicit
      contrast to Pop2, Pcu1, Psh1 and Pip1, which are found in both compartments (PMID:12167173); the
      ORFeome survey concurs (PMID:16823372); and its substrates Rum1, Cdc18 and Cig2 act in the nucleus.
      An is_active_in cytoplasm claim is therefore contradicted rather than merely unsupported, and the
      row is removed as an over-propagated compartment transfer; the nucleus rows stand.'
