taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: 'Pop1 (also called Ste16) is a 775-residue F-box/WD40 protein of Schizosaccharomyces pombe
  and one of the two Cdc4/Fbw7-type substrate-recognition subunits of the fission yeast SCF ubiquitin
  ligase. Its central F-box binds the Skp1 orthologue Psh1 on the cullin-1 (Pcu1)/Pip1 (Rbx1) catalytic
  core, and its C-terminal WD40 beta-propeller captures phosphorylated substrates for polyubiquitylation
  and 26S-proteasomal destruction; Pop1 has no catalytic activity of its own. Pop1 forms homo-oligomers
  and, through an N-terminal region (residues 228-402) independent of the F-box, hetero-oligomers with
  its paralogue Pop2/Sud1, and endogenous Pop1, Pop2, Pcu1, Psh1 and Pip1 co-fractionate in a ~500 kDa
  SCF(Pop1/Pop2) complex. The Pop1 F-box, but not that of Pop2, is essential for ligase function, and
  Pop1-containing complexes retain ubiquitin ligase activity in the absence of Pop2. The best-defined
  substrates are the Cdc2 inhibitor Rum1, whose CDK-phosphorylated form is bound and polyubiquitylated
  by SCF(Pop1/Pop2) (Rum1 half-life rises from ~20 min to >100 min in pop1 mutants), the replication
  initiator Cdc18, which Pop1 binds in vivo, and the S-phase cyclin Cig2, whose phosphorylation-dependent
  binding to Pop1 underlies its SCF-mediated instability in G2 and M phase. Through Rum1 and Cdc18 turnover
  Pop1 keeps CDK activity and replication licensing in register: pop1 mutants accumulate both proteins,
  lose the ubiquitylated species, and become polyploid (a phenotype suppressed by rum1 deletion), and
  after nitrogen starvation they fail to arrest in G1, arrest in G2 instead, and are sterile, so Pop1
  is also required for the G1 arrest that precedes mating and sporulation. Unlike Pop2 and the SCF core
  subunits, which are nuclear and cytoplasmic, Pop1 is exclusively nuclear, matching the nuclear residence
  of its substrates.'
