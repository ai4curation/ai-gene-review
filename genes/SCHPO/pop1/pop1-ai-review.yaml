- term:
    id: GO:1900087
    label: positive regulation of G1/S transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:9472077
  qualifier: involved_in
  review:
    summary: As Ste16, Pop1 negatively controls the level of the Cdc2 inhibitor Rum1; ste16/pop1 disruptants
      accumulate Rum1, fail to arrest in G1 on nitrogen starvation, and on refeeding re-enter the cycle
      from S phase and diploidise, a phenotype fully suppressed by rum1 deletion.
    action: ACCEPT
    reason: 'Core process. Pop1 promotes the G1/S switch by removing the CDK inhibitor Rum1: it recognises
      CDK-phosphorylated Rum1 for SCF-dependent destruction (PMID:12167173), so it performs a step in
      the pathway that activates Cdc2 rather than merely being required for it, and the effect is Rum1-mediated
      because rum1 deletion suppresses the diploidisation phenotype. The regulation-level term chosen
      by PomBase is a defensible framing of the same biology that is recorded as G1/S transition of mitotic
      cell cycle (GO:0000082) on the comparators Cdc4 and SKP2 and in the repository G1/S module; the
      choice between the two is a convention question raised in suggested_questions, not a defect. Abstract-only
      cache; the abstract states the Rum1 accumulation, the G1-arrest defect and the rum1 suppression.'
    additional_reference_ids:
    - PMID:9203581
    - PMID:12167173
    supported_by:
    - &maekawa_g1
      reference_id: PMID:9472077
      supporting_text: We isolated the sterile mutants which were defective in G1 arrest following nitrogen
        starvation.
    - &maekawa_suppressed
