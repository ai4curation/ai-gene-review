  qualifier: enables
  review:
    summary: Curator statement of uracil phosphoribosyltransferase activity. Some plant and animal UCK/UPRT
      proteins carry a C-terminal UPRT-like domain, but urk1 is a uridine kinase and UPRT activity belongs
      to SPAC1B3.01c. Not supported for urk1.
    action: MARK_AS_OVER_ANNOTATED
