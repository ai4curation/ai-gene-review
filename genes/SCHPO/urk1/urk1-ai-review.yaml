description: urk1 (SPCC162.11c; UniProt O74427) encodes uridine/cytidine kinase (EC 2.7.1.48), which phosphorylates
  uridine and cytidine to UMP and CMP with ATP, salvaging pyrimidine nucleosides. Function is assigned
  by orthology to S. cerevisiae URK1; it is cytosolic in a genome-wide screen.
