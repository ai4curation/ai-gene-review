id: O94552
gene_symbol: fum1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: fum1 (SPCC18.18c; UniProt O94552) encodes class II fumarate hydratase (fumarase; EC 4.2.1.2),
  which hydrates fumarate to L-malate in the mitochondrial TCA cycle. By similarity to S. cerevisiae and
  human fumarase, a single gene may make both mitochondrial and extramitochondrial forms, and the cytosolic/nuclear
  pool may help the DNA damage response, but none of this has been shown in S. pombe.
