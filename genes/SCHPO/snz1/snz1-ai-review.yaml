  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  supporting_entities:
  - SGD:S000004702
  review:
    summary: 'Transfer from S. cerevisiae SNZ1-SNO1 complex: the PLP synthase complex with the glutaminase
      subunit SPAC222.08c.'
    reason: The record has no SUBUNIT comment; the support is the curated FUNCTION comment, by similarity
      to S. cerevisiae SNZ1 (Q03148), stating that the ammonia used by the synthase is provided by PDX2,
      the glutaminase partner with which PDX1-type synthases form the PLP synthase (glutaminase) complex.
      Complex membership is therefore inferred from the S. cerevisiae ortholog; it has not been shown in
      S. pombe.
    action: ACCEPT
