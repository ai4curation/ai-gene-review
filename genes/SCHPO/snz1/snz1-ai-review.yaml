  label: Schizosaccharomyces pombe 972h-
description: snz1 (SPAC29B12.04; UniProt O14027) encodes the PDX1/SNZ synthase subunit of the glutamine-dependent
  pyridoxal 5'-phosphate synthase (EC 4.3.3.6). With the glutaminase subunit (SPAC222.08c, SNO1 ortholog),
  it makes PLP directly from ribose 5-phosphate (or ribulose 5-phosphate), glyceraldehyde 3-phosphate
  and glutamine-derived ammonia, the de novo (DXP-independent) vitamin B6 pathway of fungi. It is cytosolic
  in a genome-wide screen.
