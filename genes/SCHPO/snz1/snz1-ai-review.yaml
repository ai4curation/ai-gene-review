- term:
    id: GO:0008615
    label: pyridoxine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000782634
  - SGD:S000001835
  - SGD:S000004702
  - SGD:S000005277
  - UniProtKB:Q9UW83
  review:
    summary: PAINT inference; PLP synthase makes vitamin B6 de novo, but the PDX1/PDX2 route forms pyridoxal
      5'-phosphate directly rather than pyridoxine.
    action: MODIFY
    reason: The curated UniProt FUNCTION comment (by similarity to S. cerevisiae SNZ1, Q03148) has snz1
      forming pyridoxal 5'-phosphate directly from ribose 5-phosphate, glyceraldehyde 3-phosphate and
      ammonia; pyridoxine is neither the product nor an intermediate of this reaction. The essence (de novo
      vitamin B6 synthesis) is sound, so the sibling term GO:0042823 pyridoxal 5'-phosphate biosynthetic
      process, which the gene already carries, is the accurate term. Membership of the PdxS/SNZ family
      (HAMAP MF_01824) supports the PLP-synthase function. No S. pombe experimental data on the
      enzyme itself.
    proposed_replacement_terms:
    - id: GO:0042823
      label: pyridoxal 5'-phosphate biosynthetic process
    supported_by:
    - reference_id: file:SCHPO/snz1/snz1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Catalyzes the formation of pyridoxal 5''-phosphate from ribose 5-phosphate (RBP), glyceraldehyde 3-phosphate (G3P) and ammonia.'
    - reference_id: file:SCHPO/snz1/snz1-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: 'HAMAP; MF_01824; PdxS; 1.'
