  qualifier: enables
  review:
    summary: mitochondrial promoter sequence-specific DNA binding is supported.
    action: ACCEPT
    reason: Purified fission-yeast Rpo41 binds mitochondrial promoters in electrophoretic mobility-shift
      assays, including activity without Mtf1; Mtf1 enhances productive promoter recognition.
    supported_by: &id001
    - reference_id: PMID:21357609
      supporting_text: We show biochemically, that purified Mtf1 and Rpo41 together can bind to the S.
        pombe mitochondrial promoters and can support transcription from the S. pombe mitochondrial promoters
        in vitro.
