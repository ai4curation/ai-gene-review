  label: Schizosaccharomyces pombe 972h-
description: Rpo41 is the nuclear-encoded, single-subunit, bacteriophage T7-like DNA-directed RNA polymerase of
  Schizosaccharomyces pombe mitochondria. It is imported into mitochondria via an N-terminal transit peptide and,
  together with the transcription factor Mtf1 as a holoenzyme, recognizes the core promoter element of the mitochondrial
  promoters (Pma, Pmi, Pin) and initiates transcription at the same start sites used in vivo. Unlike its budding-yeast
  ortholog, purified S. pombe Rpo41 can weakly bind promoters and initiate transcription on its own, with Mtf1 strongly
  stimulating both. Rpo41 is required for transcription of the mitochondrial genome and, because S. pombe is petite-negative,
  for viability.
existing_annotations:
- term:
    id: GO:0001018
    label: mitochondrial promoter sequence-specific DNA binding
  evidence_type: EXP
  original_reference_id: PMID:21357609
  qualifier: enables
  review:
    summary: Purified Rpo41 binds S. pombe mitochondrial promoters in EMSA; binding is weak alone, strong with Mtf1,
      and depends on the core promoter sequence.
    action: ACCEPT
    reason: Direct biochemical evidence on the S. pombe protein. Rpo41 alone gives a weak retarded species on Pma
      and Pmi, Mtf1 converts this to a strong super-shift, and three-base mutations in the core promoter element
      abolish or reduce binding, so the binding is sequence-specific. Promoter recognition is a property of the
      Rpo41-Mtf1 holoenzyme, but Rpo41 itself contacts promoter DNA, so 'enables' is appropriate.
    supported_by:
    - &id009
      reference_id: PMID:21357609
      supporting_text: Mtf1 alone did not cause a detectable shift of the Pma, Pmi and Pin promoter DNA but Rpo41
        could generate a weak retarded species in the gel on its own with Pma, Pmi and Pin promoter DNA
    - &id001
      reference_id: PMID:21357609
      supporting_text: Mtf1 and Rpo41 with the mutant promoters exhibited a significantly reduced band shift compared
        to the wild-type promoters (Figure 4). This suggests that Mtf1 and Rpo41 bind to the promoters specifically
        and that the core sequences of the promoters are required for recognition by Mtf1 and Rpo41.
