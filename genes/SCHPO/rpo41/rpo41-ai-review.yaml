suggested_questions:
- question: S. pombe Rpo41 binds and initiates at mitochondrial promoters without Mtf1 in vitro, whereas S. cerevisiae
    Rpo41 requires Mtf1 or pre-melted promoters. Which structural features of the S. pombe enzyme (e.g. intercalating
    hairpin, N-terminal domain) account for this partial factor independence, and does it operate in vivo?
- question: Does S. pombe Rpo41, like budding-yeast and human mitochondrial RNA polymerases, synthesize primers
    for mtDNA replication?
suggested_experiments:
- description: Measure promoter melting and abortive initiation by purified S. pombe Rpo41 alone versus Rpo41-Mtf1
    on wild-type and core-mutant Pma templates, and test active-site mutants (residues 821, 890, 1061) for loss
    of activity.
