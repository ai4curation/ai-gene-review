    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: EXP
  original_reference_id: PMID:21357609
  qualifier: enables
  review:
    summary: DNA-directed RNA polymerase activity is the core catalytic activity of Rpo41.
    action: ACCEPT
    reason: Purified recombinant Rpo41 transcribes the Pma, Pmi and Pin mitochondrial promoters in vitro, alone
      at low efficiency and more efficiently with Mtf1, with start sites matching those mapped in vivo. This is
      direct evidence that Rpo41 is the catalytic polymerase.
    supported_by:
    - &id002
      reference_id: PMID:21357609
      supporting_text: Figure 5B shows the DNA sequencing results and indicates that Rpo41/Mtf1 or Rpo41 alone can
        initiate transcription in vitro. We note that the in vitro start sites for all three promoters are exactly
        the same as the in vivo mapped start sites for Pma, Pmi and Pin
    - &id008
      reference_id: PMID:21357609
      supporting_text: We show biochemically, that purified Mtf1 and Rpo41 together can bind to the S. pombe mitochondrial
        promoters and can support transcription from the S. pombe mitochondrial promoters in vitro.
