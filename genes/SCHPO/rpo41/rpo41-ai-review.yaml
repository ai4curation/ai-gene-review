taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Rpo41 is the mitochondrial DNA-directed RNA polymerase of Schizosaccharomyces pombe. It binds
  mitochondrial promoters and synthesizes RNA from DNA templates; association with the transcription factor
  Mtf1 greatly enhances promoter-directed initiation. Its transcriptional activity sustains mitochondrial
  gene expression.
