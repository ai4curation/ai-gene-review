  label: Schizosaccharomyces pombe 972h-
description: SPCC970.08 (kcs1 in PomBase; UniProt O74561) is the fission yeast member of the inositol
  hexakisphosphate kinase (IP6K/KCS1) subfamily of the IPK family. By orthology to S. cerevisiae KCS1
  and human IP6K1, and in the PomBase inositol pyrophosphate GO-CAM, it pyrophosphorylates IP6 at the
  5-position to make 5-IP7. The PPIP5K asp1 then acts on 5-IP7 to make IP8. Direct biochemical characterisation
  of the S. pombe enzyme has not been reported. It is cytoplasmic in a genome-wide screen.
