  label: Schizosaccharomyces pombe 972h-
description: erg27 (SPBC1709.07) encodes the 3-keto-steroid reductase of Schizosaccharomyces pombe, an NADPH-dependent
  short-chain dehydrogenase/reductase of the fungal ERG27 subfamily. It reduces the 3-oxo sterol made by the decarboxylating
  dehydrogenase erg26 back to the 3beta-hydroxy sterol (EC 1.1.1.270), the last reaction of each of the two C-4
  demethylation rounds that convert 4,4-dimethyl sterols into zymosterol. By homology with budding-yeast Erg27 it
  is a catalytic subunit of the ER-membrane C-4 demethylation complex with erg25, erg26 and the scaffold erg28.
  Its function in S. pombe is inferred from orthology; it has not been characterised biochemically or genetically
  in fission yeast.
