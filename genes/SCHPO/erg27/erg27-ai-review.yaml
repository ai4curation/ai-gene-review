suggested_questions:
- question: Is erg27 essential in S. pombe, and does fission-yeast Erg27 stabilise lanosterol synthase (erg7) as
    budding-yeast Erg27 stabilises Erg7?
- question: Does erg27 also act on the 4-methyl intermediates of the eburicol branch reported for Schizosaccharomyces
    (lanosterol C-24 methylation before demethylation)?
suggested_experiments:
- hypothesis: erg27 loss blocks the 3-keto reduction step of C-4 demethylation in S. pombe.
  description: GC-MS sterol profiling of an erg27 shut-off or deletion strain (with ergosterol supplementation under
    anaerobiosis if inviable) for accumulation of 3-keto sterols, plus lanosterol synthase activity in microsomes.
  experiment_type: genetics / sterol profiling
