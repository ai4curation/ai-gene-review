suggested_questions:
- question: Does S. pombe ilv5, like S. cerevisiae Ilv5, associate with mitochondrial nucleoids and contribute
    to mtDNA stability, or is that moonlighting role specific to budding yeast?
suggested_experiments:
- description: Delete ilv5 and test branched-chain amino acid auxotrophy and mtDNA maintenance (rho0 frequency,
    nucleoid imaging), and measure NADPH-dependent KARI activity of recombinant ilv5 on both acetohydroxy-acid
    substrates.
