  label: Schizosaccharomyces pombe 972h-
description: Ketol-acid reductoisomerase (acetohydroxy-acid reductoisomerase, KARI; EC 1.1.1.86) of fission
  yeast, encoded by SPBC56F2.12 and orthologous to S. cerevisiae ILV5 and bacterial IlvC. Using NADPH
  and Mg2+, it isomerises and reduces 2-acetolactate to 2,3-dihydroxy-3-methylbutanoate (valine and leucine
  precursor) and 2-aceto-2-hydroxybutanoate to 2,3-dihydroxy-3-methylpentanoate (isoleucine precursor).
  This is the second step of the shared branched-chain amino acid trunk. The protein carries an N-terminal
  mitochondrial presequence and localises to mitochondria, where it acts in the matrix with acetohydroxy-acid
  synthase (ilv1/ilv6) and dihydroxy-acid dehydratase (ilv3). The mtDNA nucleoid-stabilising role described
  for S. cerevisiae Ilv5 has not been investigated in S. pombe.
