  label: Schizosaccharomyces pombe 972h-
description: alg10 (SPAC56F8.06c; UniProt Q10254) encodes the Dol-P-Glc:Glc2Man9GlcNAc2-PP-Dol alpha-1,2-glucosyltransferase
  Alg10, which adds the terminal third glucose, completing Glc3Man9GlcNAc2-PP-Dol. A spontaneous alg10
  mutation suppresses the sick phenotype of fission yeast lacking glucosidase I. In the lumenal, with
  S. pombe genetic support phase of dolichol-linked oligosaccharide (Glc3Man9GlcNAc2-PP-Dol) assembly
  on the ER membrane, it adds the next sugar to the growing precursor that oligosaccharyltransferase transfers
  to nascent glycoproteins. Function is assigned by orthology to the S. cerevisiae ALG enzymes, with S.
  pombe genetic support.
