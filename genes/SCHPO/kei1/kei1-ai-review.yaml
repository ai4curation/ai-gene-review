  review:
    summary: Golgi membrane (PAINT/mapping).
    action: ACCEPT
    reason: "UniProt records a Golgi apparatus membrane location for S. pombe kei1 with experimental evidence (ECO:0000269, PubMed:16823372, the ORFeome localisation screen), and the record carries four predicted transmembrane segments, so the membrane rather than the lumen is the location. The IBA is consistent with S. cerevisiae Kei1, a medial-Golgi membrane protein."
