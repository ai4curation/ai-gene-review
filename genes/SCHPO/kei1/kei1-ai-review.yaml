  label: Schizosaccharomyces pombe 972h-
description: kei1 (SPAC26H5.13c; UniProt O13994) encodes the regulatory subunit of the Golgi inositol
  phosphorylceramide synthase. By orthology to S. cerevisiae Kei1, it binds the catalytic subunit Aur1,
  is needed for its Golgi localisation and full activity, and is part of the IPC synthase complex. It
  is in the Golgi in a genome-wide screen.
