    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 5 (score 16.03). The GPI-mannosyltransferase II complex (PIG-V/Gpi18) builds the glycan
      core of the GPI precursor before transfer; gaa1 acts at the last step, attaching the completed
      anchor to protein. Both are ER GPI-pathway complexes and the retrieval does not separate the
      assembly line from the terminal enzyme - the same upstream/downstream confusion as the Shu1
      and Skp cases. Note this review also records that gaa1's M28-like luminal domain is structural
      rather than catalytic, so any call attributing catalysis to it would be wrong for a second reason.
    supported_by:
