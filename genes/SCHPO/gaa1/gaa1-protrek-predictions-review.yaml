description: >-
  ProTrek sequence-to-text retrieval for gaa1, a subunit of the ER GPI-anchor transamidase complex.
  Ranks 2 and 4 are exact GOA matches naming the complex and the process this review assigns, so the
  core content is recovered; ranks 1 and 3 are both obsolete GPI terms, so two of the model's five
  calls are unusable regardless of correctness. This gene has the highest obsolete-term rate of the
  SCHPO set. Assessment: 2 correct not novel (CNN), 1 nonparalog incorrect (NPI).
