- id: file:SCHPO/gaa1/gaa1-bioreason-rl-predictions.md
  title: BioReason-Pro RL prediction export for gaa1
  findings:
  - statement: The raw BioReason export included cysteine-type endopeptidase activity in its molecular-function
      prediction path for gaa1.
    supporting_text: cysteine-type endopeptidase activity (`GO:0004197`)
    reference_section_type: RESULTS
- id: file:SCHPO/gaa1/gaa1-hypotheses/prediction-cysteine-endopeptidase/openscientist.md
  title: OpenScientist focused report on the gaa1 cysteine-type endopeptidase prediction
  findings:
  - statement: The focused report refuted the cysteine-type endopeptidase prediction because the catalytic
      subunit is Gpi8/PIG-K, not Gaa1.
    supporting_text: the catalytic cysteine-protease/transamidase activity belongs to Gpi8/PIG-K.
    reference_section_type: RESULTS
  - statement: Adding GO:0004197 to gaa1 would be a novel incorrect molecular-function assignment rather
      than a correction of an existing row.
    supporting_text: the prediction would be a **new, incorrect molecular-function addition** rather
      than a correction of an existing annotation
    reference_section_type: RESULTS
  - statement: Gaa1 lacks a compatible cysteine-protease domain signature.
    supporting_text: GO:0004197 is contradicted at the domain level.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Focused report directly addresses the GO-GPT GO:0004197 prediction and distinguishes
      noncatalytic Gaa1 from the Gpi8/PIG-K catalytic subunit of the GPI transamidase complex.
