predictions:
- source_method: GO-GPT
  source_version: bioreason.net/2026-03/rl
  source_reference_id: doi:10.64898/2026.03.19.712954
  predicted_term:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: COMPLEX_ACTIVITY_TRANSFER
    summary: >-
      Refuted on independent OpenScientist review. GO:0004197 is not present in
      GOA for gaa1, so this would be a novel incorrect molecular-function
      addition. The catalytic cysteine-protease activity of the GPI transamidase
      complex maps to the Gpi8/PIG-K subunit, which carries the Peptidase_C13
      domain and active-site residues; gaa1 is a distinct GPI-T subunit with no
      cysteine-protease domain, no annotated catalytic residues, and no EC number.
      Any possible Gaa1/GPAA1 contribution to amide-bond formation would be
      mechanistically incompatible with cysteine-type endopeptidase activity.
    supported_by:
    - reference_id: file:SCHPO/gaa1/gaa1-hypotheses/prediction-cysteine-endopeptidase/openscientist.md
      supporting_text: The prediction is REFUTED.
    - reference_id: file:SCHPO/gaa1/gaa1-hypotheses/prediction-cysteine-endopeptidase/openscientist.md
      supporting_text: the catalytic cysteine-protease/transamidase activity belongs to Gpi8/PIG-K
