taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: coq3 (SPCC162.05; UniProt O74421) encodes the SAM-dependent O-methyltransferase Coq3, which
  carries out both O-methylations of the CoQ ring. It is one of the ten S. pombe genes (dps1, dlp1, ppt1,
  coq3-coq9) needed for CoQ10 synthesis, whose deletion abolishes CoQ10. It is a mitochondrial inner-membrane
  component of the CoQ biosynthetic complex.
