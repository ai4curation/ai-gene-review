- term:
    id: GO:0120537
    label: 3-demethylubiquinone 3-O-methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:81215
  review:
    summary: Final O-methylation written for the quinone form (3-demethylubiquinone to ubiquinone); HAMAP
      MF_03190 curates both redox forms.
    action: ACCEPT
    reason: Rule-based mapping (GO_REF:0000116, Rhea RHEA:81215). The HAMAP COQ3 rule (MF_03190) curates
      both the quinone and quinol forms of the last methylation step, and which redox form Coq3 acts on
      in vivo is not resolved; the term is a true description of the final O-methylation and is accepted
      alongside GO:0061542, consistent with the S. cerevisiae COQ3 review, where both terms are accepted.
      No S. pombe enzyme assay exists; support is family-rule plus complementation by human and Arabidopsis
      COQ3 (PMID:24911838).
    supported_by:
    - reference_id: file:SCHPO/coq3/coq3-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Also catalyzes the last step of ubiquinone biosynthesis by mediating methylation
        of 3-demethylubiquinone into ubiquinone.
    - reference_id: file:SCHPO/coq3/coq3-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=a 3-demethylubiquinone + S-adenosyl-L-methionine = a ubiquinone + S-adenosyl-L-homocysteine
