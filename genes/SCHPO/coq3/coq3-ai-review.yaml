id: O74421
gene_symbol: coq3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'coq3 encodes the fission yeast Coq3 O-methyltransferase, a SAM-dependent enzyme of the UbiG/COQ3
  family that performs both O-methylations of the coenzyme Q10 ring: the methylation of 3,4-dihydroxy-5-decaprenylbenzoate
  and, as the final step of the pathway, the methylation of 3-demethylubiquinol (or -ubiquinone) to ubiquinol-10.
  It is a peripheral protein on the matrix side of the mitochondrial inner membrane, part of the multi-subunit
  CoQ biosynthetic complex. Deletion of coq3 abolishes CoQ10 synthesis; human COQ3 complements only when
  given a mitochondrial targeting sequence, and Arabidopsis COQ3 also complements.'
