- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027200
  review:
    summary: >-
      The ARBA row captures a chaperone process, but Hsp78 is specifically an
      aggregate resolubilization/refolding factor.
    action: MODIFY
    reason: >-
      Fungal Hsp78 acts after mitochondrial matrix proteins have misfolded and
      aggregated. The Hsp78 PAINT node already carries the better descendant
      process, GO:0042026 protein refolding.
    proposed_replacement_terms:
      - id: GO:0042026
        label: protein refolding
    additional_reference_ids:
      - PMID:11734006
    supported_by:
      - reference_id: PMID:11734006
        supporting_text: >-
          Studies on the chaperone activity of Hsp78 show that its cooperation
          with the mitochondrial Hsp70 system, consisting of Ssc1p, Mdj1p and
          Mge1p, is needed for the efficient reactivation of substrate proteins.
