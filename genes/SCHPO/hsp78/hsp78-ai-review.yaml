  - PANTHER:PTN000909045
  - SGD:S000002666
  review:
    summary: >-
      Protein refolding is placed on the fungal Hsp78 PAINT node and is the
      correct process for this mitochondrial disaggregase.
    action: ACCEPT
    reason: >-
      Hsp78 resolubilizes heat-damaged mitochondrial matrix proteins so they
      can be reactivated by the mitochondrial Hsp70 system. PTN000909045 is the
      correct fungal mitochondrial Hsp78 node for this process.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
        - source_id: PANTHER:PTN000909045
          source_label: PANTHER:PTN000909045
          source_status: SUPPORTS_TRANSFER
          comment: >-
            Protein refolding is curated on the fungal Hsp78 node from the
            experimentally characterized S. cerevisiae HSP78 descendant.
    additional_reference_ids:
      - PMID:11734006
    supported_by:
      - reference_id: PMID:11734006
        supporting_text: >-
          Studies on the chaperone activity of Hsp78 show that its cooperation
          with the mitochondrial Hsp70 system, consisting of Ssc1p, Mdj1p and
          Mge1p, is needed for the efficient reactivation of substrate proteins.
- term:
