    UniProt
  findings: []
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
- id: PMID:11734006
  title: Importance of two ATP-binding sites for oligomerization, ATPase activity
    and chaperone function of mitochondrial Hsp78 protein.
  findings:
    - statement: >-
        Purified S. cerevisiae Hsp78 forms ATP-dependent hexamers, has ATPase
        activity, and cooperates with the mitochondrial Hsp70 system to
        reactivate substrate proteins.
      supporting_text: >-
        Studies on the chaperone activity of Hsp78 show that its cooperation
        with the mitochondrial Hsp70 system, consisting of Ssc1p, Mdj1p and
        Mge1p, is needed for the efficient reactivation of substrate proteins.
- id: PMID:16460754
  title: The disaggregation activity of the mitochondrial ClpB homolog Hsp78 maintains
    Hsp70 function during heat stress.
  findings:
    - statement: >-
        Hsp78 has ATP-dependent mitochondrial protein-disaggregation activity
        and is required to resolubilize heat-induced matrix aggregates.
      supporting_text: >-
        Hsp78 is indispensable for the resolubilization of protein aggregates
        generated by heat stress under in vivo conditions.
- id: PMID:8413229
  title: HSP78 encodes a yeast mitochondrial heat shock protein in the Clp family
    of ATP-dependent proteases.
  findings:
    - statement: >-
        S. cerevisiae Hsp78 is a soluble mitochondrial matrix ClpB/Hsp100-family
        protein.
      supporting_text: >-
        Submitochondrial fractionation showed that hsp78 is a soluble protein
        located in the mitochondrial matrix.
core_functions:
  - molecular_function:
      id: GO:0140545
      label: ATP-dependent protein disaggregase activity
    directly_involved_in:
      - id: GO:0042026
        label: protein refolding
      - id: GO:0043335
        label: protein unfolding
      - id: GO:0034605
        label: cellular response to heat
    locations:
      - id: GO:0005759
        label: mitochondrial matrix
    description: >-
      Conserved fungal Hsp78 activity that uses ATP hydrolysis to resolubilize
      and unfold aggregated mitochondrial matrix proteins for productive
      refolding during heat-stress recovery.
suggested_questions:
  - question: >-
      Has S. pombe hsp78 been directly localized and assayed during
      mitochondrial heat-stress recovery, or are current annotations still
      inherited from the S. cerevisiae HSP78 ortholog and the fungal Hsp78 PAINT
      node?
suggested_experiments:
  - description: >-
      Fluorescently tag endogenous hsp78 and test whether it localizes to the
      mitochondrial matrix and concentrates at heat-induced mitochondrial
      protein aggregates in an ATPase-dependent manner.
