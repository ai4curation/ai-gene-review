- term:
    id: GO:0034605
    label: cellular response to heat
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000200274
  - PANTHER:PTN000181243
  - PomBase:SPBC16D10.08c
  - SGD:S000002666
  - SGD:S000003949
  - UniProtKB:Q6F2Y7
  - UniProtKB:Q9H078
  - dictyBase:DDB_G0291314
  review:
    summary: >-
      Hsp78-family disaggregases help fungal mitochondria recover from heat
      stress, so the broad PAINT heat-response transfer is acceptable.
    action: ACCEPT
    reason: >-
      The broad node contains both cytosolic and mitochondrial stress
      disaggregases. Unlike the cytoplasm location, the heat-response process is
      valid for mitochondrial Hsp78 proteins as well as cytosolic Hsp104
      proteins.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
        - source_id: PANTHER:PTN000181243
          source_label: PANTHER:PTN000181243
          source_status: SUPPORTS_TRANSFER
          comment: >-
            Heat-response biology is shared by the cytosolic Hsp104 and
            mitochondrial Hsp78 branches of the family.
    additional_reference_ids:
      - PMID:8830768
    supported_by:
      - reference_id: PMID:8830768
        supporting_text: >-
          proteins of the Clp/Hsp100-family located in the cytosol and within
          mitochondria confer compartment-specific protection against heat
          damage to the cell.
- term:
    id: GO:0034605
    label: cellular response to heat
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026567
  review:
