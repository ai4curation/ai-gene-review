id: O74402
gene_symbol: hsp78
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  hsp78 encodes the fission-yeast mitochondrial Hsp100/ClpB-family paralog of
  fungal Hsp78 disaggregases. Its conserved AAA+ ATPase architecture and
  placement in the fungal mitochondrial Hsp78 PAINT clade support an inherited
  ATP-dependent protein-disaggregation activity in the mitochondrial matrix,
  where Hsp78-family proteins cooperate with mitochondrial Hsp70 to extract,
  resolubilize, and refold heat-damaged matrix proteins.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001270
  - InterPro:IPR003959
  - InterPro:IPR018368
  review:
    summary: >-
      hsp78 is a ClpB/Hsp100-family protein with two conserved AAA+ ATPase
      modules, so the InterPro ATP-binding assertion is appropriate.
    action: ACCEPT
    reason: >-
      The same ATP-binding domains drive the ATP-dependent Hsp78 disaggregase
      cycle in the experimentally characterized S. cerevisiae mitochondrial
      ortholog. The InterPro row is generic but correct for this conserved
      AAA+ paralog.
    additional_reference_ids:
      - PMID:11734006
    supported_by:
      - reference_id: PMID:11734006
        supporting_text: >-
          Analysis of its ATPase activity reveals that the observed positive
          cooperativity effect depends both on Hsp78 and ATP concentration.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT2G25140
  - AGI_LocusCode:AT5G15450
  - PANTHER:PTN000181243
  - PomBase:SPBC16D10.08c
  - SGD:S000002666
  - SGD:S000003949
  - UniProtKB:P0ABH9
  - UniProtKB:P63284
  - UniProtKB:Q0E3C8
  - UniProtKB:Q586B8
  - UniProtKB:Q587G1
  - UniProtKB:Q75GT3
  - UniProtKB:Q8IB03
  - UniProtKB:Q8IM28
  - UniProtKB:Q9H078
  review:
    summary: >-
      This cytoplasm IBA comes from a broad mixed Hsp100/ClpB node and is too
      imprecise for the mitochondrial Hsp78 paralog.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PTN000181243 sits above the split between fungal cytosolic Hsp104 and
      mitochondrial Hsp78 proteins. The precise descendant assertion for this
      subfamily is mitochondrial matrix at PTN000909045; annotating hsp78 as
      active in cytoplasm from the mixed node obscures that organellar
      specificity.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
        - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
        - source_id: PANTHER:PTN000181243
          source_label: PANTHER:PTN000181243
          source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
          comment: >-
            The node predates the fungal Hsp104/Hsp78 split; it supports
            conserved ATPase and heat-stress terms, but is too broad for a
            specific is_active_in cytoplasm assertion on Hsp78.
    proposed_replacement_terms:
      - id: GO:0005759
        label: mitochondrial matrix
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000909045
  - SGD:S000002666
  review:
    summary: >-
      The PAINT mitochondrial-matrix row is placed on the fungal Hsp78 node and
      correctly separates this paralog from cytosolic Hsp104.
    action: ACCEPT
    reason: >-
      PTN000909045 is the fungal Hsp78 node seeded by S. cerevisiae HSP78, whose
      product was directly localized to the mitochondrial matrix. The fission
      yeast hsp78 protein is in the same Hsp78 clade.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
        - source_id: PANTHER:PTN000909045
          source_label: PANTHER:PTN000909045
          source_status: SUPPORTS_TRANSFER
          comment: >-
            The PAINT node is specific to the fungal mitochondrial Hsp78
            subtree and is seeded by SGD HSP78.
    additional_reference_ids:
      - PMID:8413229
    supported_by:
      - reference_id: PMID:8413229
        supporting_text: >-
          Submitochondrial fractionation showed that hsp78 is a soluble protein
          located in the mitochondrial matrix.
- term:
    id: GO:0005759
