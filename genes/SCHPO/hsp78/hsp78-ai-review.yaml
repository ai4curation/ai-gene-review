  - SGD:S000002666
  review:
    summary: >-
      Hsp78-family disaggregation includes ATP-driven extraction and unfolding
      of clients from aggregates.
    action: ACCEPT
    reason: >-
      The PAINT row is placed at the fungal mitochondrial Hsp78 node, not the
      mixed broad node. Protein unfolding captures the threading/extraction step
      of ATP-dependent Hsp100/ClpB protein disaggregation.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
        - source_id: PANTHER:PTN000909045
          source_label: PANTHER:PTN000909045
          source_status: SUPPORTS_TRANSFER
          comment: >-
            Protein unfolding is curated on the fungal Hsp78 node from the
            experimentally characterized S. cerevisiae HSP78 descendant.
    additional_reference_ids:
      - PMID:16460754
    supported_by:
      - reference_id: PMID:16460754
        supporting_text: >-
          Hsp78 is indispensable for the resolubilization of protein aggregates
          generated by heat stress under in vivo conditions.
- term:
    id: GO:0043335
    label: protein unfolding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00086271
  review:
    summary: >-
      The ARBA protein-unfolding row agrees with the Hsp78-specific PAINT row.
    action: ACCEPT
    reason: >-
      ATP-driven unfolding is the mechanical step that lets Hsp78 extract
      polypeptides from aggregated mitochondrial clients.
    additional_reference_ids:
      - PMID:16460754
    supported_by:
      - reference_id: PMID:16460754
        supporting_text: >-
          The ATP-dependent disaggregation activity of Hsp78 was capable of
          reversing the preprotein import defect of a destabilized mutant form
          of Ssc1.
- term:
    id: GO:0140545
    label: ATP-dependent protein disaggregase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - SGD:S000002666
  review:
    summary: >-
      ISO transfer from S. cerevisiae HSP78 gives hsp78 the integrated
      ATP-dependent protein disaggregase activity.
    action: ACCEPT
    reason: >-
      SGD HSP78 and PomBase hsp78 are both mitochondrial Hsp78 members of
      PTHR11638:SF176. The transferred term is more specific than ATP
      hydrolysis because it captures the ATP-driven aggregate resolubilization
      performed by the Hsp78 hexamer with the mitochondrial Hsp70 system.
    additional_reference_ids:
      - PMID:11734006
      - PMID:16460754
    supported_by:
      - reference_id: PMID:16460754
        supporting_text: >-
          The ATP-dependent disaggregation activity of Hsp78 was capable of
          reversing the preprotein import defect of a destabilized mutant form
          of Ssc1.
