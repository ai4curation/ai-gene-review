suggested_questions:
- question: Is acl1 (with acl2) the main source of cytosolic acetyl-CoA for fatty acid synthesis in S. pombe, or
    does acetyl-CoA synthetase contribute substantially as in budding yeast?
suggested_experiments:
- description: Co-express and purify acl1 and acl2 to confirm the heteromeric ATP-citrate lyase activity and stoichiometry,
    and measure cytosolic acetyl-CoA and lipid levels in acl1 conditional mutants.
