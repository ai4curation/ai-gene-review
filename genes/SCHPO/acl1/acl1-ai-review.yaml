  label: Schizosaccharomyces pombe 972h-
description: acl1 (SPBC1703.07) encodes subunit 1 of the heteromeric ATP-citrate lyase (ATP-citrate synthase, EC
  2.3.3.8) of fission yeast. The 615-residue protein belongs to the succinate/malate CoA ligase alpha-subunit family
  and carries CoA-binding, CoA-ligase and citrate synthase-like (citryl-CoA lyase) domains, corresponding to the
  C-terminal half of animal ACLY and to plant ACL-B; acl2 (SPAC22A12.16) supplies the ATP-grasp half. Together they
  cleave mitochondria-exported citrate with ATP and CoA to cytosolic acetyl-CoA and oxaloacetate, providing the
  acetyl-CoA used for fatty acid and sterol synthesis. S. cerevisiae lacks ATP-citrate lyase and instead makes cytosolic
  acetyl-CoA with acetyl-CoA synthetase. The protein is cytosolic, with some nuclear signal in a localization screen.
  Function is inferred from homology; no direct enzymology on the S. pombe protein has been reported.
