  label: Schizosaccharomyces pombe 972h-
description: gcv3 (SPBP19A11.01; UniProt Q9HDV9) encodes the mitochondrial H protein of the glycine cleavage
  system. It carries a covalently attached lipoyl cofactor that accepts the methylamine group from glycine
  decarboxylation by the P protein (gcv2), delivers it to the T protein (gcv1) for transfer to tetrahydrofolate,
  and is reoxidised by dihydrolipoyl dehydrogenase (dld1). In S. cerevisiae the orthologous GCV3 is also
  needed to lipoylate the E2 subunits of pyruvate and 2-oxoglutarate dehydrogenases; whether S. pombe
  gcv3 has that second role is untested. Mitochondrial localisation comes from a genome-wide screen; function
  is assigned by orthology.
