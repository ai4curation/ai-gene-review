- question: Which of the Ppa2-dependent phenotypes are executed by PP2A-B55 (Pab1) versus PP2A-B56 (Par1/Par2),
    and does Ppa1 substitute for Ppa2 in either holoenzyme in vivo? The Paa1 purifications recover both catalytic
    subunits, but no study has compared the substrate spectrum of Ppa1- and Ppa2-containing trimers.
  experts:
  - Iain M. Hagan
  - Sandra Lopez-Aviles
  - Viesturs Simanis
- question: What is the direct substrate of PP2A-Ppa2 in the septation initiation network? Genetics place Ppa2 as
    a SIN inhibitor (suppression of cdc7/cdc11/sid2/mob1, lethality with cdc16), but Cdc11 dephosphorylation was
    unaffected by ppa2 deletion, the effect on Cdc7 asymmetry differs between laboratories, and B55 and B56 holoenzymes
    have opposite effects on septation under metaphase arrest.
  experts:
  - Viesturs Simanis
  - Kathleen L. Gould
  - Dannel McCollum
- question: Does S. pombe Ppa2 carry the C-terminal Leu322 methyl ester and Tyr/Thr phosphorylation that regulate
    mammalian PP2A-C, and do these modifications (or the Ypa1/Ypa2 PTPA activators) bias holoenzyme assembly toward
    Pab1 or Par1?
  experts:
  - Viesturs Simanis
  - Iain M. Hagan
suggested_experiments:
- hypothesis: The mitotic-entry, cytokinesis and morphogenesis phenotypes of ppa2 deletion segregate cleanly by
    regulatory subunit.
  description: Fuse Ppa2 covalently to Pab1 or to Par1 (single-chain B-C constructs) in a ppa1-delta ppa2-delta
    background and score cell length at division, wee1-50 and cdc25-22 interactions, SIN-mutant suppression, septum
    placement and actin/microtubule organisation, so that each phenotype is assigned to one holoenzyme.
  experiment_type: synthetic holoenzyme genetics
- hypothesis: Ppa2 directly dephosphorylates specific SIN components.
  description: Phosphoproteomics of synchronised ppa2-delta and analogue-sensitive ppa2 cells versus wild type through
    anaphase, followed by in vitro dephosphorylation of candidate phosphosites on Cdc7, Cdc11, Sid2 and Byr4/Cdc16
    with purified Paa1-Ppa2-Pab1 and Paa1-Ppa2-Par1 holoenzymes.
  experiment_type: phosphoproteomics / in vitro reconstitution
- hypothesis: Rec8 S412 dephosphorylation by centromeric PP2A-Ppa2 requires the Par1 B56 subunit for substrate docking
    rather than only for Sgo1 recruitment.
  description: Compare in vitro dephosphorylation kinetics of CK1-phosphorylated Rec8 fragments by Paa1-Ppa2 core
    dimers, Paa1-Ppa2-Par1 trimers and Par1 docking-site mutants, and test whether Sgo1-independent tethering of
    the core dimer to centromeres protects cohesion in vivo.
  experiment_type: biochemistry / tethering genetics
