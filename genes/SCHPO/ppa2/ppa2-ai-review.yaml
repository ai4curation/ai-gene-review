  review:
    summary: Direct evidence that Ppa2 is the catalytic subunit of the heterotrimeric PP2A holoenzyme. Riedel et
      al. showed that Sgo1 recruits a specific PP2A form (the B56/Par1-containing trimer) to meiotic centromeres
      in fission yeast; independent Paa1 tandem-affinity purification recovers Ppa2 together with Paa1 and the B55/Pab1
      and B56/Par1 regulatory subunits, and Pab1 co-immunoprecipitates Ppa2.
    action: ACCEPT
    reason: 'Holoenzyme membership is the defining property of a PP2A catalytic subunit and is established for Ppa2
      by several independent lines: Sgo1-dependent recruitment of the PP2A trimer (this reference), Paa1-TAP purification
      that detects Ppa2 with anti-PP2A-C antibodies in both PP2A-B55 and PP2A-B56 complexes, and FLAG-Pab1 co-immunoprecipitation
      of Ppa2. Ppa2 is the major catalytic subunit (Ppa1 the minor paralog), so essentially all canonical Paa1-based
      PP2A holoenzymes in the cell contain it. Core function.'
    supported_by:
