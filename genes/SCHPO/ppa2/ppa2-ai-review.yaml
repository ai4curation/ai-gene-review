  review:
    summary: 'PAINT-inferred, family-level placement of the PP2A catalytic subunit in the mitotic cell cycle (ancestral
      node PTN001705142, seeded by the budding-yeast, fly, worm and Candida catalytic subunits). For Ppa2 the specific
      mitotic role is documented directly: ppa2 deletion advances mitotic entry and interacts with wee1 and cdc25,
      PP2A point mutants show premature mitosis, and Ppa2-containing PP2A-B55/B56 holoenzymes reverse mitotic phosphorylation
      during mitotic progression and exit.'
    action: ACCEPT
    reason: 'The node placement is sound: every extant PP2A catalytic subunit with experimental data (Pph21/Pph22,
      mts, LET-92, Candida) functions in the mitotic cycle, and the S. pombe protein carries its own IGI/IMP evidence
      for a more specific descendant term (GO:0010972). The term is generic and adds no information beyond the specific
      G2/M and mitotic-exit roles, but it is not wrong and is the appropriate level for an ancestral inference across
      a family whose members act at different mitotic steps (entry in fission yeast and metazoa, entry-promotion
      in budding yeast). Accepted as the family-level umbrella; the core function is captured by GO:0010972.'
