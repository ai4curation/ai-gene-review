      the negative-regulation child term. The unsigned parent is nevertheless the better term for the catalytic
      subunit: Ppa2 serves both PP2A-B55 and PP2A-B56 holoenzymes, and under prolonged metaphase arrest these have
      opposite effects on septation (B55 prevents, B56 facilitates), while Singh et al. found no effect of ppa2
