  label: Schizosaccharomyces pombe 972h-
description: mdh1 (SPCC306.08c; UniProt Q9Y7R8) encodes mitochondrial NAD-dependent malate dehydrogenase
  (EC 1.1.1.37), which oxidises L-malate to oxaloacetate, the last step of the TCA cycle, regenerating
  oxaloacetate for citrate synthase. It is mitochondrial in a genome-wide screen.
