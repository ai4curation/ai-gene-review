  review:
    summary: PAINT inference of cytoplasm; true in GO's sense (the mitochondrion is part of the cytoplasm)
      but general, since mdh1 is the mitochondrial-matrix isozyme.
    action: TOO_GENERAL
    reason: The IBA node (PTN000166149) groups Mdh1 with mitochondrial MDHs such as human MDH2 (P40926)
      and mouse Mdh2, so the claim is not contested; in GO the mitochondrial matrix is part_of the
      mitochondrion, which is part_of the cytoplasm. Mdh1 carries a predicted mitochondrial transit peptide,
      and UniProt curates a mitochondrial matrix location citing the S. pombe ORFeome study (PMID:16823372),
      so cytoplasm is true but uninformative, entailed by the accepted mitochondrion and mitochondrial
      matrix rows (the same action this campaign uses for cytoplasm beside an accepted matrix term).
