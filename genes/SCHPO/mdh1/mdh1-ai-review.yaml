- term:
    id: GO:0043490
    label: malate-aspartate shuttle
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0030060
  review:
    summary: Curator inference of the malate-aspartate shuttle; mitochondrial MDH is part of it in principle,
      but the shuttle has not been shown in S. pombe.
    action: KEEP_AS_NON_CORE
    reason: PomBase curator inference (IC from GO:0030060). The supporting facts are family-level and
      localization evidence, not a shuttle experiment in S. pombe; Mdh1 is an MDH type 1 enzyme catalysing
      the reversible NAD-dependent malate/oxaloacetate reaction and resides in the mitochondrial matrix
      (ORFeome localization, PMID:16823372), which is the matrix half of the malate-aspartate shuttle in
      other eukaryotes. Plausible but peripheral to its TCA-cycle role, so kept as non-core; the support is thin.
    supported_by:
    - reference_id: file:SCHPO/mdh1/mdh1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=(S)-malate + NAD(+) = oxaloacetate + NADH + H(+);'
