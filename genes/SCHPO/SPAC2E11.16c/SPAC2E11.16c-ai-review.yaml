  review:
    summary: Trehalose biosynthesis (PAINT/mapping/S. cerevisiae transfer).
    action: ACCEPT
    reason: 'By similarity to S. cerevisiae Tsl1/Tps3, the large regulatory subunits of the trehalose synthase complex, and family membership (glycosyltransferase 20 and trehalose-phosphatase domains, PANTHER PTHR10788): in S. cerevisiae loss of Tps3, especially with Tsl1, lowers TPS and TPP activity and trehalose content, so the large subunits take part in trehalose synthesis by stabilising and regulating the catalytic core. No S. pombe experiment has tested this protein. The PAINT node placement in the TPS family is consistent with this.'
    supported_by:
    - reference_id: PMID:9837904
      supporting_text: 'Deletion of TPS3, in particular in a tsl1Delta background, reduced both TPS and TPP activities and trehalose content.'
    - reference_id: PMID:9194697
      supporting_text: 'TsI1 and Tps3 may share a common function with respect to regulation and/or structural stabilization of the Tre6P synthase/phosphatase complex'
    - reference_id: file:SCHPO/SPAC2E11.16c/SPAC2E11.16c-uniprot.txt
      record_section: ["DR:Pfam"]
