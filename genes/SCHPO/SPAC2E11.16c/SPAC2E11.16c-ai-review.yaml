  review:
    summary: Generic catalytic activity inferred from the glycosyltransferase 20 domain. The only specific catalytic term on this gene (GO:0003825) is itself judged an over-annotation, so this broad term is not an uninformative restatement of a true activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Changed from TOO_GENERAL, because TOO_GENERAL asserts the term is true and its only specific catalytic descendant here is marked as over-annotated. The protein carries glycosyltransferase 20 and trehalose-phosphatase domains (family membership), but in S. cerevisiae the large Tsl1/Tps3 subunits are regulatory: TPS activity depends entirely on Tps1 and TPP activity on Tps2. By similarity, catalytic activity of this S. pombe protein is doubtful and untested.'
    supported_by:
    - reference_id: file:SCHPO/SPAC2E11.16c/SPAC2E11.16c-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'In the N-terminal section; belongs to the glycosyltransferase 20 family.'
    - reference_id: PMID:9194697
      supporting_text: 'Previous studies indicated that Tps1 and Tps2 carry the catalytic activities of trehalose synthesis, namely Tre6P synthase (Tps1) and Tre6P phosphatase (Tps2), while TsI1 was suggested to have regulatory functions.'
    - reference_id: PMID:9837904
      supporting_text: 'Deletion of TPS1 totally abolished TPS activity and measurable trehalose'
    - reference_id: PMID:9837904
      supporting_text: 'deletion of TPS2 completely abolished TPP activity'
