  - EC:2.4.1.15
  review:
    summary: EC/InterPro mapping of trehalose-6-P synthase activity. In S. cerevisiae the corresponding
      large subunits (Tsl1/Tps3) are regulatory and have degenerate synthase domains; catalytic activity
      of this S. pombe protein is untested.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Changed from KEEP_AS_NON_CORE, because the review argues the protein is probably not a synthase. The EC-based IEA rests on family membership (glycosyltransferase 20 domain), but by similarity to the S. cerevisiae Tsl1/Tps3 large subunits it is a regulatory subunit: in S. cerevisiae deletion of TPS1 alone abolishes TPS activity, and no other subunit can replace Tps1 despite their shared homology. Synthase activity of this S. pombe protein has not been assayed.'
    supported_by:
    - reference_id: file:SCHPO/SPAC2E11.16c/SPAC2E11.16c-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'In the N-terminal section; belongs to the glycosyltransferase 20 family.'
    - reference_id: PMID:9837904
      supporting_text: 'Deletion of TPS1 totally abolished TPS activity and measurable trehalose'
    - reference_id: PMID:9837904
      supporting_text: 'Even when overproduced, none of the other subunits could take over this function of Tps1 despite the homology shared by all four proteins.'
    - reference_id: PMID:9194697
      supporting_text: 'Previous studies indicated that Tps1 and Tps2 carry the catalytic activities of trehalose synthesis, namely Tre6P synthase (Tps1) and Tre6P phosphatase (Tps2), while TsI1 was suggested to have regulatory functions.'
