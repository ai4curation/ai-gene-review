  review:
    summary: 'PAINT inference: large regulatory subunit of the trehalose-6-P synthase complex (Tsl1/Tps3
      type).'
    action: ACCEPT
    reason: 'By similarity to S. cerevisiae Tsl1/Tps3: both large subunits are part of the trehalose synthase complex, interacting with Tps1 and Tps2, and the protein is in the TPS family (PANTHER PTHR10788). The PAINT node places it in the Tsl1/Tps3 regulatory-subunit clade, which is consistent with that membership. No S. pombe experiment has tested complex membership.'
    supported_by:
    - reference_id: PMID:9837904
      supporting_text: 'this complex also contains a regulatory subunit encoded by TSL1.'
    - reference_id: PMID:9837904
      supporting_text: 'We conclude that Tps3 is a fourth subunit of the complex with functions partially redundant to those of Tsl1.'
