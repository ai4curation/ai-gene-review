taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPAC2E11.16c (UniProt O14081) encodes one of two fission yeast large (106 kDa) subunits of
  the trehalose-6-phosphate synthase complex (SPAC2E11.16c and SPAC22F8.05), orthologous to the S. cerevisiae regulatory
  subunits Tsl1/Tps3. These proteins carry synthase- and phosphatase-like domains and are thought to stabilise
  and regulate the Tps1-Tpp1 catalytic core rather than catalyse reactions themselves. Function is assigned
  by orthology; it is cytosolic in a genome-wide screen.
