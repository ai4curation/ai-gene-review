- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20876564
  qualifier: enables
  supporting_entities:
  - PomBase:SPAC24B11.11c
  review:
    summary: Yeast two-hybrid interaction between Pab1 and the septation initiation network component Sid2 kinase
      (SPAC24B11.11c), reported in the study showing that loss of Pab1 suppresses etd1, mob1, sid1 and cdc11 mutants
      and restores Spg1 activity.
    action: REMOVE
    reason: The functional content of this paper for Pab1 is captured by the GO:0031030 negative regulation of septation
      initiation signaling row (IGI with etd1). The two-hybrid contact with Sid2 kinase suggests that PP2A-Pab1
      is physically associated with the SIN machinery but does not identify Sid2 kinase as a substrate (the paper
      infers dephosphorylation of Spg1, which is not among the two-hybrid partners), so no more specific molecular
      function can be assigned from it. Bare "protein binding" carries no functional information about Pab1 and
      is removed per repository curation policy; removal does not question the reported interaction, which remains
      recorded in PomBase and BioGRID.
    supported_by:
    - reference_id: PMID:20876564
      supporting_text: Two-hybrid assays indicate that Pab1 physically interacts with Mob1, Sid1, Sid2, and Cdc11,
        suggesting that the phosphatase 2A B-subunit is a component of the SIN complex.
    - reference_id: PMID:20876564
      supporting_text: Together, our results indicate that PP2A-Pab1 plays a novel role in cytokinesis, regulating
        SIN activity at different levels.
