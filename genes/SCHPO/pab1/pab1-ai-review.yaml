  review:
    summary: PAINT-inferred membership of the heterotrimeric PP2A holoenzyme for the PR55/B55 family. Pab1 is the
      single B55-type subunit of S. pombe and assembles with the Paa1 scaffold and the Ppa1/Ppa2 catalytic subunits
      into PP2A-B55(Pab1).
    action: ACCEPT
    reason: 'Holoenzyme membership is the defining, family-wide property of B55 subunits and the node placement
      is sound: every extant descendant with experimental data (human PPP2R2A, Drosophila tws, mouse Ppp2r2a/Ppp2r2d,
      S. cerevisiae Cdc55, Dictyostelium) is a PP2A B subunit, and the S. pombe protein has its own experimental
      evidence for the term (Kinoshita et al. 1996 cloned pab1+ as the PR55 subunit; Grallert et al. 2015 purified
      Paa1-TAP holoenzymes containing Pab1 and showed that PP1-docking mutants leave subunit stoichiometry intact).
      PomBase:SPAC227.07c appearing in the WITH/FROM list is the expected marker of that experimental grounding,
      not circularity. Core function.'
