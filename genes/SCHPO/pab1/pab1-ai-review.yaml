gene_symbol: pab1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: 'Pab1 is the single B55-type (PR55) regulatory subunit of protein phosphatase 2A in Schizosaccharomyces
  pombe, the orthologue of budding-yeast Cdc55 and human PPP2R2A. It is a seven-WD40-repeat beta-propeller with
  no catalytic centre that assembles with the scaffold subunit Paa1 and either catalytic subunit (Ppa1 or Ppa2)
  into the PP2A-B55(Pab1) holoenzyme, on which it selects and positions phosphoserine/phosphothreonine substrates
  and receives the regulatory inputs that switch the holoenzyme on and off. PP2A-B55(Pab1) is the major Cdk1-counteracting
  phosphatase of the fission-yeast cell cycle: it keeps Wee1 and Cdc25 in their interphase phosphorylation states
  and thereby restrains activation of Cdk1-cyclin B, so that cells with active PP2A-B55 grow larger in G2 before
  dividing. Its activity is set by nutrients through the TORC1-Greatwall(Ppk18)-endosulfine(Igo1) pathway: with
  nitrogen available TORC1 inhibits Ppk18 and the phosphatase is active; on nitrogen limitation Ppk18 phosphorylates
  Igo1, which binds and inhibits PP2A-B55, permitting mitotic entry at a smaller size. The same nutrient switch
  governs a second, cell-cycle-independent role: in rich medium PP2A-B55(Pab1) dephosphorylates the TORC2 effector
  kinase Gad8 at Ser546 and represses TORC2 output, and its inhibition on starvation de-represses Gad8, allowing
  the sexual-differentiation programme (Ste11-dependent gene expression, mating and meiosis) and entry into quiescence.
  During mitosis Pab1 is the docking platform of a phosphatase relay: it carries an RVxF motif that recruits PP1(Dis2)
  at metaphase, PP1 reactivates PP2A-B55 as cyclin B falls, and PP2A-B55 then dephosphorylates Ser378 of the B56
  subunit Par1 to license PP1 recruitment to, and reactivation of, PP2A-B56 in telophase; blocking PP1 docking on
  Pab1 causes chromosome mis-segregation and anaphase delay. PP2A-Pab1 also antagonises the septation initiation
  network at the spindle pole body, opposing Etd1-dependent activation of the GTPase Spg1 and buffering the Sid1/Sid2-Mob1
  kinase modules, so that loss of Pab1 rescues SIN mutants and allows untimely septation. Cells lacking Pab1 are
  viable but round or pear-shaped with depolarised actin and microtubules, have cell-wall and sporulation defects,
  are cold- and osmo-sensitive, and divide with a longer cycle. Pab1 is found throughout the cell with nuclear enrichment
  and at the mitotic spindle and spindle pole body.'
