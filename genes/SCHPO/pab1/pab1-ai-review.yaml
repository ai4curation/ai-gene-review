- description: Spindle-pole-body-associated PP2A-B55(Pab1) activity that antagonises the septation initiation network,
    opposing Etd1-dependent activation of the GTPase Spg1 and buffering the downstream Sid1 and Sid2-Mob1 kinase
    modules (all of which Pab1 contacts), so that cytokinesis is not triggered before mitosis is complete; loss
    of Pab1 rescues etd1, mob1, sid1 and cdc11 mutants.
