core_functions:
- description: Substrate-selecting B55 regulatory subunit of the PP2A-B55(Pab1) holoenzyme (Paa1-Ppa1/Ppa2-Pab1)
    that directs the catalytic subunit onto the Cdk1 regulators Wee1 and Cdc25, keeping Wee1 in its interphase state
    and Cdc25 hyperphosphorylated so that Cdk1-cyclin B activation is restrained and cells reach a larger size before
    mitotic entry; the activity is switched off by Greatwall(Ppk18)-phosphorylated endosulfine Igo1 when TORC1 signalling
    falls.
  molecular_function:
    id: GO:0019888
    label: protein phosphatase regulator activity
  contributes_to_molecular_function:
