- term:
    id: GO:0010972
    label: negative regulation of G2/M transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:26776736
  qualifier: involved_in
  review:
    summary: 'PP2A-B55(Pab1) is the CDK-counteracting phosphatase through which the TORC1-Greatwall(Ppk18)-endosulfine(Igo1)
      pathway sets cell size at division: with nutrients present TORC1 inhibits Ppk18, PP2A-B55 stays active and
      prevents full Cdk1-cyclin B activation so cells grow larger in G2; on nitrogen limitation Ppk18 phosphorylates
      Igo1, which inhibits PP2A-B55 and allows early mitotic entry at a smaller size.'
    action: ACCEPT
    reason: 'This is the best-established core role of Pab1 and it is mechanistically explained: pab1 deletion eliminates
      the cell-cycle-dependent dephosphorylation of both Wee1 and Cdc25 (Lucena et al. 2017), and the Martin et
      al. 2017 study states that PP2A-B55(Pab1) inhibits entry into mitosis through dephosphorylation of these two
      Cdk1 regulators. The term is the correct sign and level (a signalling-pathway term that decreases mitotic
      CDK activation); the abstract-only cache does not affect the judgement because the mechanism is documented
      in full text elsewhere. Core function.'
    supported_by:
    - reference_id: PMID:26776736
      supporting_text: High levels of PP2A·B55 prevent the activation of mitotic Cdk1·Cyclin B, and cells increase
        in size in G2 before they undergo mitosis.
    - reference_id: PMID:26776736
      supporting_text: the activation of greatwall (Ppk18) leads to the phosphorylation of endosulfine (Igo1) and
        inhibition of PP2A·B55, which in turn allows full activation of Cdk1·CyclinB and entry into mitosis with
        a smaller cell size.
    - reference_id: PMID:28103117
      supporting_text: Thus, pab1Δ largely eliminated cell cycle-dependent changes in phosphorylation of Wee1 and
        Cdc25.
    - reference_id: PMID:28041796
      supporting_text: PP2A-B55Pab1 inhibits entry into mitosis through the dephosphorylation of Wee1 and Cdc25
