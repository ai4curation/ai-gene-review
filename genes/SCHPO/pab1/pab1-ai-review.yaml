  evidence_type: IPI
  original_reference_id: PMID:25487150
  qualifier: enables
  supporting_entities:
  - PomBase:SPBC776.02c
  review:
    summary: 'PomBase record of the Pab1-Dis2 (PP1) interaction: Pab1 carries an RVxF-type PP1 docking motif (R52/V54/F56)
      through which PP1(Dis2) is recruited to the PP2A-B55 holoenzyme at mitotic commitment; mutating the motif
      abolishes co-immunoprecipitation and in vitro capture, and PP1 recruitment reactivates PP2A-B55 as cyclin
      B declines.'
    action: REMOVE
    reason: The interaction is biologically important and well documented, but here Pab1 is the docking target of
      a regulator (PP1 reactivates the PP2A-B55 holoenzyme through it) rather than the recruiter of a substrate,
      and the functional consequence is a change in holoenzyme activity, which is what the GO:0019888 protein phosphatase
      regulator activity rows already express. Bare "protein binding" carries no functional information about Pab1,
      so it is removed per repository curation policy; removal does not question the interaction, which is recorded
      in IntAct/UniProt (NbExp=9) and is described in the notes and core functions of this review.
    supported_by:
    - reference_id: PMID:25487150
      supporting_text: we found that both B55Pab1 and B56Par1 associated with PP1Dis2 in immunoprecipitation assays
    - reference_id: PMID:25487150
      supporting_text: The interaction between PP1Dis2 and B55Pab1 was abolished by mutating the PP1 docking consensus
        motif
    - reference_id: PMID:25487150
      supporting_text: We conclude that both B56Par1 and B55Pab1 contain genuine PP1Dis2 docking motifs.
