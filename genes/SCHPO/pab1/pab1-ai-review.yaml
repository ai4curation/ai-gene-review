suggested_experiments:
- hypothesis: Wee1 and Cdc25 are direct substrates of PP2A-B55(Pab1) that dock on the conserved B55 helix-binding
    surface.
  description: Reconstitute dephosphorylation of Cdk1-phosphorylated Wee1 and Cdc25 with Paa1-TAP-purified holoenzyme
    from pab1+ versus pab1 deletion cells, map the sites by mass spectrometry, and test Pab1 point mutants in the
    residues corresponding to the human B55-alpha substrate-docking patches for loss of Wee1/Cdc25 binding while
    retaining Paa1/Ppa assembly by co-immunoprecipitation.
  experiment_type: in vitro reconstitution / structure-guided mutagenesis
- hypothesis: The SIN antagonism of PP2A-Pab1 is exerted by dephosphorylation of one or more SPB-resident SIN components
    rather than of Spg1 itself.
  description: Compare the phosphoproteome of SIN components (Spg1, Cdc11, Sid1, Sid2, Mob1, Byr4/Cdc16) in synchronised
    wild-type and pab1 deletion cells and in pab1 PP1-docking-site mutants, and test candidate sites with the purified
    holoenzyme; combine with SPB-tethered versus untethered Pab1 to ask whether SPB localisation is required for
    suppression of etd1 mutants.
  experiment_type: phosphoproteomics / conditional genetics
- hypothesis: The Pab1 phosphosite Ser134 detected in the fission-yeast phosphoproteome modulates holoenzyme activity
    or PP1 docking during the nutrient or mitotic activity cycles.
  description: Generate pab1-S134A and S134D alleles at the endogenous locus and score Gad8 Ser546 phosphorylation,
    Wee1/Cdc25 phosphorylation, cell size at division under rich and poor nitrogen, PP1(Dis2) co-immunoprecipitation
    and mating kinetics.
  experiment_type: site-directed mutagenesis / phospho-site western blotting
