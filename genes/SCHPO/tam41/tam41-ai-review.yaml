  label: Schizosaccharomyces pombe 972h-
description: tam41 encodes the mitochondrial CDP-diacylglycerol synthase (phosphatidate cytidylyltransferase, EC
  2.7.7.41) of Schizosaccharomyces pombe, the ortholog of S. cerevisiae Tam41/Mmp37 and human TAMM41. Unrelated
  in sequence to the ER CDS-family enzyme bbl1, Tam41 is a nucleotidyltransferase-fold protein with a winged-helix
  domain that binds CTP in an L-shaped pocket and uses a sequential mechanism to convert phosphatidic acid to CDP-DAG.
  A positively charged C-terminal amphipathic helix anchors it peripherally to the matrix face of the mitochondrial
  inner membrane, where its CDP-DAG feeds phosphatidylglycerophosphate synthase and cardiolipin synthase.
