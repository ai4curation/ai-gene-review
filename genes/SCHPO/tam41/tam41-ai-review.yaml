suggested_questions:
- question: Is the cardiolipin binding of the C-terminal amphipathic helix a product-feedback or targeting mechanism,
    and does it couple Tam41 to pgs1/crd1 at the inner membrane?
suggested_experiments:
- description: Measure cardiolipin and PG levels and respiratory growth in S. pombe tam41 deletion and catalytic-site
    mutants to confirm that the mitochondrial CDP-DAG pool for cardiolipin depends on tam41 and not bbl1.
