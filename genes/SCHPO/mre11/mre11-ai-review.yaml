    label: Y-form DNA binding
  evidence_type: ISO
  original_reference_id: PMID:18854158
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8U1N9
  review:
    summary: Y-form DNA binding is supported.
    action: ACCEPT
    reason: DNA-complex structures resolve how the conserved Mre11 dimer engages branched substrates and
      DNA ends. Fission yeast mutational analysis links this architecture to MRN assembly and break repair,
      supporting the curated orthology transfer rather than a claim of a target-only binding assay.
    supported_by:
    - &id011
      reference_id: PMID:18854158
      supporting_text: To define the roles of Mre11 in both DNA bridging and nucleolytic processing during
        initiation of DSB repair, we combined small-angle X-ray scattering (SAXS) and crystal structures
        of Pyrococcus furiosus Mre11 dimers bound to DNA with mutational analyses of fission yeast Mre11.
