    label: double-strand break repair via nonhomologous end joining
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000015644
  - PomBase:SPAC13C5.07
  - SGD:S000004837
  - UniProtKB:P49959
  review:
    summary: double-strand break repair via nonhomologous end joining is supported.
    action: ACCEPT
    reason: Fission yeast experiments support an MRN contribution to nonhomologous end joining, especially
      tethering dysfunctional telomeres or nonligatable hairpin-ended substrates. This does not imply
      its nuclease activity is required for every NHEJ reaction.
    supported_by:
    - &id014
      reference_id: PMID:23188080
      supporting_text: Thus, MRN acts to tether unlinked DNA ends, allowing for efficient NHEJ.
    - &id015
      reference_id: PMID:28292918
      supporting_text: S. pombe NHEJ was reduced >1000-fold in cells lacking each MRN subunit, and loss
        of MRN-associated Ctp1 caused a 30-fold reduction.
