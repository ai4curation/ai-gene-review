- term:
    id: GO:0007095
    label: mitotic G2 DNA damage checkpoint signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0020270
  - MGI:MGI:1100512
  - PANTHER:PTN000015644
  review:
    summary: mitotic G2 DNA damage checkpoint signaling is likely an over-propagation for fission yeast
      Rad32.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The IBA is placed at the family-root PAINT node PTN000015644 and reflects mammalian MRN-ATM
      checkpoint function. In fission yeast the G2 DNA damage checkpoint is driven by Rad3 (ATR) and Chk1
      and is MRN-independent: PMID:12944482 reports that Rad32, Rad50 and Nbs1 are required for the S-phase
      checkpoint but not the G2 checkpoint. The defective Chk1 signalling of the W248R allele (PMID:23080121)
      accompanies failed end processing and is better explained as a resection defect upstream of Rad3
      activation than as direct checkpoint-signalling participation. The S-phase checkpoint role is captured
      by GO:0031573 (accepted).'
    supported_by:
    - *id014
    - *id013
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000015644
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family-root node; the G2 checkpoint term is grounded only by metazoan donors (Drosophila
          mre11, mouse Mre11), where MRN activates ATM. Fission yeast Rad32 is not among the donors for
          this term.
      - source_id: MGI:MGI:1100512
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mammalian MRN-ATM G2/M checkpoint role.
      - source_id: FB:FBgn0020270
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Drosophila mre11 checkpoint role.
