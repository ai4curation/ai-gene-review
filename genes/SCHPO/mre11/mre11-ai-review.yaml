    reason: Mre11/Rad32 and Ctp1 process damaged DNA ends, including removal of covalent Rec12 complexes
      in meiosis and displacement of Ku/MRN to expose DNA for RPA and homologous recombination. The requirement
      for Mre11 protein must be distinguished from the requirement for its nuclease chemistry in particular
      resection assays.
