- term: &id019
    id: GO:0000724
    label: double-strand break repair via homologous recombination
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1100512
  - PANTHER:PTN000015644
  - PomBase:SPAC13C5.07
  - SGD:S000004837
  - UniProtKB:P49959
  review:
    summary: double-strand break repair via homologous recombination is supported.
    action: ACCEPT
    reason: Fission yeast rad32 mutants are defective in physical DSB repair and efficient homologous
      gene conversion. This is a central repair role of MRN, encompassing DNA-end coordination and nuclease-dependent
      removal of end-bound obstacles.
    supported_by:
    - &id007
      reference_id: PMID:7885834
      supporting_text: Pulsed field gel electrophoresis of DNA from irradiated cells indicates that the
        rad32 mutant, in comparison to wild type cells, has decreased ability to repair DNA double strand
        breaks. The mutant also undergoes decreased meiotic recombination and displays reduced stability
        of minichromosomes.
    - &id008
      reference_id: PMID:12628934
      supporting_text: We found that the homologous recombination (HR) genes rhp51(+), rad22A(+), rad32(+)
        and the nucleotide excision repair gene rad16(+) were required for efficient interchromosomal
        gene conversion.
    - &id009
      reference_id: PMID:21931565
      supporting_text: However, Mre11 nuclease and Ctp1 are required to disassociate the MRN complex and
        the Ku70-Ku80 nonhomologous end-joining (NHEJ) complex from DSBs, which is required for efficient
        RPA localization.
