  review:
    summary: meiotic DNA double-strand break formation is retained as an ancillary annotation.
    action: KEEP_AS_NON_CORE
    reason: Fission yeast MRN can generate meiotic breaks at a palindrome through a Rec12-independent
      pathway during premeiotic replication. The experimental assertion is sound in this specialized context.
      Ordinary Rec12-dependent meiotic break formation does not require Rad32, so this should not imply
      a universal upstream requirement for programmed meiotic DSB formation.
