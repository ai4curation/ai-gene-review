id: Q09683
gene_symbol: mre11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Mre11 (Rad32) is the DNA-binding nuclease subunit of the nuclear Mre11-Rad50-Nbs1 complex.
  It helps recognize and tether DNA double-strand breaks, coordinates DNA-end processing with Ctp1, and
  supports homologous recombination, selected nonhomologous end-joining reactions, telomere maintenance,
  and DNA damage signaling. Its conserved nuclease domain has endonucleolytic and 3′-to-5′ exonucleolytic
  activities. During meiosis it processes Rec12-linked DNA ends for repair and can initiate a separate
  palindrome-associated breakage pathway.
existing_annotations:
- term: &id021
    id: GO:0000014
    label: single-stranded DNA endonuclease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000015644
  - UniProtKB:P49959
  review:
    summary: single-stranded DNA endonuclease activity is supported.
    action: ACCEPT
    reason: Mre11 is the conserved phosphodiesterase nuclease of MRN. Purified homolog biochemistry establishes
      DNA endonuclease and 3′-to-5′ exonuclease chemistry; fission yeast catalytic-domain structures and
      nuclease mutants independently establish a functional nuclease. This activity is distinct from the
      net 5′-strand resection produced by the repair pathway.
    supported_by:
    - &id001
      reference_id: PMID:9651580
      supporting_text: We have investigated the enzymatic activities of the purified proteins and found
        that Mre11 by itself has 3' to 5' exonuclease activity that is increased when Mre11 is in a complex
        with Rad50. Mre11 also exhibits endonuclease activity, as shown by the asymmetric opening of DNA
        hairpin loops.
    - &id002
      reference_id: PMID:22705791
      supporting_text: To understand the functional architecture of MRN, we determined the crystal structures
        of the Schizosaccharomyces pombe Mre11 dimeric catalytic domain alone and in complex with a fragment
        of Nbs1.
    - &id003
      reference_id: PMID:19139281
      supporting_text: This study demonstrates for the first time that Mre11 (Schizosaccharomyces pombe
        Rad32(Mre11)) nuclease activity is required for the removal of Rec12(Spo11).
    - &id004
      reference_id: PMID:9705271
      supporting_text: We show that the Rad50-Mre11-p95 complex possesses manganese-dependent single-stranded
        DNA endonuclease and 3' to 5' exonuclease activities.
