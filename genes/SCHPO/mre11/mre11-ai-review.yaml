  review:
    summary: Generic protein binding is uninformative; the Nbs1 interaction is captured by the Mre11 complex
      annotation.
    action: REMOVE
    reason: The interaction with Nbs1 reported here is real and well supported (PMID:22705791 solved the
      Mre11-Nbs1 interface), but bare protein binding carries no functional information. Its biological
      meaning, assembly of the Mre11-Rad50-Nbs1 complex, is already captured by GO:0030870 Mre11 complex,
      and GO has no Nbs1-specific binding term. Removing the generic term does not mean the interaction
      is false.
