  review:
    summary: reciprocal meiotic recombination is supported.
    action: ACCEPT
    reason: Rad32 is required for efficient meiotic recombination and repair of meiotic DNA breaks. Removal
      of Rec12-linked DNA ends is a mechanistically supported contribution; the protein does not catalyze
      strand exchange itself.
