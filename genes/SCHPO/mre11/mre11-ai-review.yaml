- term:
    id: GO:0000403
    label: Y-form DNA binding
  evidence_type: ISO
  original_reference_id: PMID:18854158
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8U1N9
  review:
    summary: Y-form DNA binding is plausible but peripheral to DNA-end binding.
    action: KEEP_AS_NON_CORE
    reason: The ISO transfer comes from Pyrococcus furiosus Mre11 crystal structures with branched and
      synaptic DNA. Mre11 phosphoesterase-domain architecture is conserved from archaea to fission yeast
      and the paper tested the corresponding fission yeast mutants, so the transfer is reasonable. Binding
      to a Y-form substrate is, however, one geometry of the DNA-end engagement captured by GO:0045027
      DNA end binding (accepted in this review), so it is retained as non-core rather than as the core
      DNA-binding claim.
    supported_by:
    - &id012
      reference_id: PMID:18854158
      supporting_text: To define the roles of Mre11 in both DNA bridging and nucleolytic processing during
        initiation of DSB repair, we combined small-angle X-ray scattering (SAXS) and crystal structures
        of Pyrococcus furiosus Mre11 dimers bound to DNA with mutational analyses of fission yeast Mre11.
