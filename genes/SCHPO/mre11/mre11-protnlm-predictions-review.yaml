  predicted_term:
    id: GO:0008296
    label: 3'-5'-DNA exonuclease activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: The conserved Mre11 nuclease domain supports 3′-to-5′ exonuclease chemistry, supported by
      purified-protein biochemistry and fission yeast catalytic-domain structure. GOA already records
      double-stranded DNA 3′-5′ DNA exonuclease activity (GO:0008311) by curated orthology transfer. The
      predicted term omits the substrate specificity of that established function. The net polarity of
      DNA-end resection does not refute the intrinsic exonuclease polarity.
