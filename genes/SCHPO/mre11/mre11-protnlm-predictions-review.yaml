    - *id002
  source_reference_id: file:SCHPO/mre11/mre11-protnlm-source.xml
- source_method: ProtNLM2
  source_version: pre-release post-processed-2026_02_28k.xml
  predicted_term:
    id: GO:0051321
    label: meiotic cell cycle
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: Fission yeast rad32 mutants impair meiotic recombination, and Rad32 nuclease activity is
      required for removal of Rec12-linked ends. These experiments establish participation in the meiotic
      cell cycle. GOA already captures reciprocal meiotic recombination and double-strand break repair
      involved in meiotic recombination, which are more informative than the broad cell-cycle term. The
      prediction does not imply a general requirement for Rec12-dependent break formation.
    supported_by:
    - reference_id: PMID:7885834
      supporting_text: Pulsed field gel electrophoresis of DNA from irradiated cells indicates that the
        rad32 mutant, in comparison to wild type cells, has decreased ability to repair DNA double strand
        breaks. The mutant also undergoes decreased meiotic recombination and displays reduced stability
        of minichromosomes.
    - *id003
    - reference_id: PMID:15238514
      supporting_text: Meiotic DNA breakage in Schizosaccharomyces pombe did not require Rad50 or Rad32,
        although the homologs Rad50 and Mre11 are required in Saccharomyces cerevisiae; these proteins
        are required for meiotic DNA break repair in both yeasts.
  source_reference_id: file:SCHPO/mre11/mre11-protnlm-source.xml
