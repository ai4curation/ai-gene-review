  label: Schizosaccharomyces pombe 972h-
description: lys4 (SPBC1105.02c; UniProt Q9Y823) encodes homocitrate synthase (EC 2.3.3.14), the first
  and committed enzyme of the fungal alpha-aminoadipate pathway of lysine biosynthesis. It condenses acetyl-CoA
  with 2-oxoglutarate to homocitrate. Crystal structures of S. pombe HCS show a domain-swapped TIM-barrel
  homodimer. L-lysine competes directly with 2-oxoglutarate at the active site, which is the basis of
  feedback inhibition of the pathway. lys4 expression is induced by the homeobox protein Phx1; overexpressing
  lys4 suppresses the oxidative-stress-dependent lysine auxotrophy of CuZn-SOD-deficient cells, which
  reflects how sensitive the enzyme is to superoxide.
