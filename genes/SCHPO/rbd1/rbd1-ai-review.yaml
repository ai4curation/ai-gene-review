  review:
    summary: >-
      The ARBA process row is true but imprecise beside the supported
      mitochondrial protein-processing row.
    action: TOO_GENERAL
    reason: >-
      rbd1 cleaves the mitochondrial dynamin Msp1 during Msp1 isoform
      generation, so GO:0051604 is true but does not identify the relevant
      mitochondrial protein-processing context. This review accepts the more
      precise GO:0034982 row and treats the generic ARBA parent as
      uninformative.
