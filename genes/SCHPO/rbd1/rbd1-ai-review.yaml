  review:
    summary: >-
      PomBase's curator inference captures rbd1's mitochondrial processing of
      Msp1.
    action: ACCEPT
    reason: >-
      Retain the direct process term. rbd1 is the mitochondrial rhomboid
      implicated by the S. pombe Msp1 study, the GO-CAM places this activity
      in Msp1 mitochondrial protein processing, and the parallel
      budding-yeast Pcp1/Rbd1 literature establishes mitochondrial membrane
      substrates as a conserved function of fungal mitochondrial rhomboids.
