  review:
    summary: >-
      The PAINT row captures conserved substrate processing but can be made
      specific to mitochondrial protein processing for rbd1.
    action: MODIFY
    reason: >-
      The PANTHER mitochondrial-rhomboid node correctly places rbd1 in a
      proteolytic processing role, but the broad parent GO:0016485 loses the
      mitochondrial substrate context. S. pombe Msp1 processing, budding-yeast
      Pcp1-dependent Mgm1 and Ccp1 processing, and the accepted
      inner-membrane location support the descendant term GO:0034982
      mitochondrial protein processing.
    proposed_replacement_terms:
    - id: GO:0034982
      label: mitochondrial protein processing
    supported_by:
    - reference_id: PMID:20621843
      supporting_text: >-
        Msp1p is processed by rhomboid and a protease of the matrix ATPase
        associated with various cellular activities (m-AAA) family.
    - reference_id: PMID:12707284
      supporting_text: >-
        the conversion of l-Mgm1 into s-Mgm1 was found to be dependent on
        Pcp1
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
