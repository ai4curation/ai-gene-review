      supporting_text: >-
        Msp1p is processed by rhomboid and a protease of the matrix ATPase
        associated with various cellular activities (m-AAA) family.
    - reference_id: PMID:12417197
      supporting_text: >-
        Pcp1 (Ygr101w) gene product was found to be required for the second
        processing step, yielding the mature Ccp1 protein.
