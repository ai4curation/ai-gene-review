id: O14364
gene_symbol: rbd1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  rbd1 encodes a multi-pass rhomboid-family intramembrane serine protease of
  the mitochondrial inner membrane. The protein belongs to the conserved
  mitochondrial Rhomboid/Peptidase S54 family and cleaves the dynamin-related
  substrate Msp1 during mitochondrial protein processing.
existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: EXP
  original_reference_id: PMID:20621843
  qualifier: enables
  review:
    summary: >-
      PomBase's direct experimental row identifies rbd1 as the S. pombe
      rhomboid serine protease that processes Msp1.
    action: ACCEPT
    reason: >-
      Retain as the core molecular function. The accessible abstract for the
      curated fission-yeast Msp1 study states that Msp1 is processed by a
      rhomboid and by an m-AAA-family protease, with the rhomboid generating
      short Msp1. PomBase's EXP row records the full-text assignment to rbd1,
      and the protein is an eight-pass Rhomboid/Peptidase S54 member.
    supported_by:
    - reference_id: PMID:20621843
      supporting_text: >-
        Msp1p is processed by rhomboid and a protease of the matrix ATPase
        associated with various cellular activities (m-AAA) family.
    - reference_id: PMID:20621843
      supporting_text: >-
        The former is involved in the generation of short Msp1p and the latter
        in the stability of long Msp1p.
