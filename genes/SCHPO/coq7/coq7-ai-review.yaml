  review:
    summary: PAINT inference; ubiquinone biosynthesis step.
    action: ACCEPT
    reason: Coq7 performs a catalytic step of ubiquinone synthesis (hydroxylation of the DMQ intermediate),
      so it participates in the process rather than merely being required for it. The curated UniProt function
      and pathway statements carry experimental evidence (PubMed:18808426, 24911838), and PMID:18808426 shows
      that S. pombe coq7 deletion accumulates the DMQ10 precursor instead of CoQ10.
    supported_by:
