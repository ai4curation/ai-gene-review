id: O74826
gene_symbol: coq7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'coq7 encodes the fission yeast Coq7 hydroxylase, a di-iron enzyme of the COQ7 (CLK-1) family
  on the matrix side of the mitochondrial inner membrane. It hydroxylates C6 of the ring of demethoxyubiquinone
  (DMQ10, or its quinol form), the penultimate step of coenzyme Q10 synthesis, after which Coq3 adds the
  final methyl group. The coq7 deletion accumulates DMQ10 instead of CoQ10 and shows the phenotypes of
  other CoQ-deficient mutants: hydrogen peroxide sensitivity, need for antioxidants on minimal medium,
  sulfide overproduction and loss of viability in stationary phase. Human COQ7 complements the deletion
  partially, and only when given a mitochondrial targeting sequence.'
