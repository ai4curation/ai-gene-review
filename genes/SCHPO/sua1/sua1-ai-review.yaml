taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: sua1 (SPBC27.08c; also called asp1/met3) encodes the ATP sulfurylase (sulfate adenylyltransferase,
  EC 2.7.7.4) of fission yeast, the ortholog of Saccharomyces cerevisiae MET3. It catalyses the first
  intracellular step of sulfate assimilation, joining inorganic sulfate to the adenylyl moiety of
  ATP to form adenosine 5'-phosphosulfate (APS) and pyrophosphate. APS is then phosphorylated by met14
  to PAPS and reduced by the met16/thioredoxin and sir1/met10 enzymes to sulfide for cysteine and
  methionine synthesis. The protein is a cytosolic member of the eukaryotic homo-oligomeric Sat/Met3-type
  family, with a central catalytic domain and a C-terminal kinase-like domain inferred to support
  oligomerization by comparison with budding-yeast Met3. Native sua1 oligomer stoichiometry is not
  established by the complementation experiments. sua1 mutants, isolated as selenate-resistant strains,
  have low ATP sulfurylase activity and cannot use sulfate as a sulfur source; the cloned gene complements
  both the pombe mutants and an S. cerevisiae met3 mutant.
