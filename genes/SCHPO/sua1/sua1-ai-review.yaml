  review:
    summary: The enzyme performs a specific step of sulfate assimilation. Refine the correct broad
      sulfur-compound metabolic term to that supported pathway.
    action: MODIFY
    supported_by:
    - reference_id: file:SCHPO/sua1/sua1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'FUNCTION: Catalyzes the first intracellular reaction of sulfate'
