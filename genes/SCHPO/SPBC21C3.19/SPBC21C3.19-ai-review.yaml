taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  SPBC21C3.19 (Rtc3; named SNOR, SBDS domain-containing hibernation factor) is a small
  (106 aa) fission yeast protein consisting of a single SBDS N-terminal (FYSH) domain
  followed by a short basic C-terminal tail. It belongs to the fungal Rtc3 branch of the
  Sdo1/SBDS family and lacks the SBDS domains II and III used by Sdo1/SBDS in late 60S
  maturation. Rtc3 is induced by glucose-dependent carbon stress and, in glucose-depleted
  dormant cells, binds hibernating cytosolic and outer-mitochondrial-membrane-associated 80S
  ribosomes. There it occupies the peptidyl transferase centre between eEF2 and
  hypusinated eIF5A, makes charged contacts with the 25S rRNA (Lys68 contributes most) and
  with the uL16 loop, and inserts its C-terminal tail into the polypeptide exit tunnel.
  Its Asn106 contacts the hypusine of eIF5A, and the two proteins bind the 60S subunit
  cooperatively. Recombinant Rtc3 binds 60S subunits and 80S ribosomes directly, but not
  40S subunits. Deleting rtc3, or knocking in ribosome-binding-deficient or tail-truncated
  alleles, does not affect growth or the shutdown of translation in glucose-depleted cells.
  It does block the recovery of polysomes after glucose is added back, and viability falls
  progressively during prolonged glucose limitation. Rtc3 is therefore a ribosome-associated
  factor that keeps dormant ribosomes ready to restart translation, rather than a
  ribosome-biogenesis factor.
