core_functions:
- description: >-
    Glucose-stress-induced factor that binds the large subunit of dormant cytosolic 80S
    ribosomes at the peptidyl transferase centre. It contacts the rRNA, the uL16 loop and
    hypusinated eIF5A, and inserts its C-terminal tail into the exit tunnel, keeping
    hibernating ribosomes competent to restart translation when glucose returns.
  molecular_function:
    id: GO:0043023
    label: ribosomal large subunit binding
  directly_involved_in:
  - id: GO:2000767
    label: positive regulation of cytoplasmic translation
  locations:
  - id: GO:0022626
    label: cytosolic ribosome
  supported_by:
  - reference_id: PMID:42129552
    supporting_text: >-
      The binding assays showed that SNOR specifically interacts with the 60S large
      subunit and intact 80S ribosomes
  - reference_id: PMID:42129552
    supporting_text: >-
      These results demonstrate that SNOR association with the ribosome and its C-terminal
      tail are both required for translation restart.
  - reference_id: PMID:42129552
    supporting_text: >-
      Consistently, mass spectrometry analysis confirmed the presence of Rtc3 in ribosomes
      isolated after prolonged glucose depletion
knowledge_gaps:
- gap_statement: >-
    How Rtc3/SNOR licenses translation restart is unknown. The data do not show whether it
    acts by protecting PTC/H69 integrity, by retaining eIF5A, by sensing nascent chains in
    the exit tunnel, or by being actively released when glucose returns.
  boundary: >-
    Established are direct 60S/80S binding at the PTC, cooperative co-binding with
    hypusinated eIF5A, and the requirement for ribosome binding and the C-terminal tail for
    polysome recovery in vivo. Not established are what SNOR does to the ribosome that
    a dormant ribosome lacking it cannot do, and how and when it dissociates.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Defines whether SNOR is a protective cap, an eIF5A-retention factor or a tunnel sensor,
    which bears on whether analogous restart factors exist outside fungi.
  resolution: >-
    Time-resolved cryo-ET or ribosome pulldowns across glucose re-addition in wild type and
    tail/K68 mutants, combined with eIF5A occupancy and nascent-chain retention measurements.
  provenance:
  - reference_id: PMID:42129552
    supporting_text: >-
      The positioning of the SNOR C-terminal tail within the exit tunnel raises the
      possibility that SNOR senses nascent polypeptides unlinked from tRNA but retained in
      hibernating ribosomes prior to translation restart.
suggested_questions:
- question: >-
    Does Rtc3/SNOR dissociate from ribosomes when glucose is added back, and is its release
    regulated (for example by eIF5A, eEF2 or a GTPase), or passive?
- question: >-
    Is the in vitro translational repression in rabbit reticulocyte lysate physiologically
    meaningful? That is, does SNOR contribute to translation shutdown in vivo, which would
    justify cytosolic ribosome hibernation (GO:0141014), given that shutdown is normal in
    rtc3 deletion cells?
- question: >-
    Why is SNOR induced by high (20%) as well as limiting (0.5%) glucose but not by complete
    glucose starvation (0%)? What signalling pathway (e.g. PKA, AMPK/Ssp2, TORC1) controls
    rtc3 expression?
- question: >-
    Does the S. cerevisiae orthologue Rtc3/Hgi1 bind dormant ribosomes in the same way? If
    so, could a family-level (PAINT) ribosomal large subunit binding annotation be placed on
    the Rtc3 subfamily node of PTHR10927?
- question: >-
    The rtc3 deletion and GC7 effects on viability are additive rather than epistatic. Does
    SNOR also act independently of hypusinated eIF5A?
suggested_experiments:
- description: >-
    Follow endogenously tagged Rtc3 on polysome gradients and by ribosome pulldown over a
    glucose depletion and re-addition time course, in wild type and in eIF5A
    hypusination-deficient backgrounds.
  hypothesis: >-
    SNOR associates with 80S ribosomes as glucose is depleted and is released early after
    glucose re-addition, before polysomes re-form.
  experiment_type: polysome profiling and ribosome affinity purification
- description: >-
    Assay 60S maturation in rtc3 deletion cells (Tif6/eIF6 localization and release,
    60S:40S ratio, half-mer polysomes), with sdo1 mutants as positive control.
  hypothesis: >-
    Rtc3 has no role in late 60S maturation, which would formally confirm removal of the
    ribosome biogenesis annotation.
  experiment_type: ribosome biogenesis assays
- description: >-
    Ribosome profiling of wild-type and rtc3 deletion cells during the first minutes of
    glucose re-addition, together with puromycin release assays of nascent chains retained
    on dormant ribosomes.
  hypothesis: >-
    SNOR preserves restart-competent ribosomes, either by protecting the PTC from an
    inactive H69 conformation or by monitoring nascent chains retained in the exit tunnel.
  experiment_type: ribosome profiling
