- id: PMID:42129552
  title: SNOR promotes translation restart after dormancy.
  findings:
  - statement: >-
      In situ cryo-ET of glucose-depleted S. pombe identifies Rtc3 (SNOR) bound at the
      peptidyl transferase centre of hibernating 80S ribosomes, between eEF2 and
      hypusinated eIF5A; MS confirms Rtc3 in ribosomes after prolonged glucose depletion.
    supporting_text: >-
      This analysis identified Rtc3 (SPBC21C3.19), an SBDS domain-containing protein of
      previously unknown function
  - statement: >-
      Recombinant SNOR binds 60S and 80S but not 40S; the reconstituted 60S-SNOR cryo-EM
      structure confirms PTC binding; K68 is the main rRNA contact.
    supporting_text: >-
      The binding assays showed that SNOR specifically interacts with the 60S large
      subunit and intact 80S ribosomes
  - statement: >-
      SNOR Asn106 hydrogen-bonds the hypusine of eIF5A, and SNOR and eIF5A co-bind 60S
      cooperatively.
    supporting_text: >-
      The hypusine moiety forms hydrogen-bond interactions with N106 in the C-terminal
      region of SNOR
  - statement: >-
      rtc3 deletion and ribosome-binding or tail mutants fail to recover polysomes after
      glucose re-addition and lose viability during prolonged glucose limitation.
    supporting_text: >-
      These results demonstrate that SNOR association with the ribosome and its C-terminal
      tail are both required for translation restart.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC13345908). The first and only gene-specific study; all key
      experiments use S. pombe Rtc3 itself (endogenous tagging, deletion, knock-in point
      mutants, recombinant protein with S. pombe ribosomes). The in vitro translation
      repression assay uses heterologous rabbit reticulocyte lysate. Two residue-label
      inconsistencies (Fig. 3f legend E46 vs text D46; Fig. 4d legend E70 vs text Q69/E72)
      were checked against Q9P7K6, which has D46, Q69, S70, E72 and N73; the text numbering
      is the correct one. The supplementary MS table was not inspected.
