- term:
    id: GO:0042254
    label: ribosome biogenesis
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Y3A5
  review:
    summary: >-
      Curator transfer by sequence similarity from human SBDS (Q9Y3A5), the
      Shwachman-Bodian-Diamond syndrome protein, which acts with EFL1 in late cytoplasmic 60S
      maturation.
    action: REMOVE
    reason: >-
      The similarity behind the transfer covers only the SBDS N-terminal domain. Rtc3 is
      106 aa and has none of the SBDS domains II and III that Sdo1/SBDS use in 60S
      maturation. PANTHER places it in the separate Rtc3 subfamily (PTHR10927:SF2), not with
      SBDS/Sdo1. The first gene-specific study (PMID:42129552) assigns a different role.
      Rtc3 binds the peptidyl transferase centre of mature, dormant 80S ribosomes with a
      different binding mode from Sdo1: it inserts its C-terminal tail into the exit tunnel,
      whereas Sdo1 inserts its N-terminal domain. The authors conclude explicitly that SNOR
      does not take part in ribosome biogenesis. Deleting rtc3 causes no growth defect at
      any glucose concentration tested. The paper does not assay 60S maturation directly,
      but taken together the domain architecture, subfamily placement and characterised
      function argue that the biogenesis role was over-propagated from SBDS.
    supported_by:
    - reference_id: PMID:42129552
      supporting_text: >-
        Rather than participating in ribosome biogenesis, SNOR binds the PTC of dormant 80S
        ribosomes and inserts its C-terminal tail into the PET.
    - reference_id: PMID:42129552
      supporting_text: >-
        This mode of interaction contrasts with that of Sdo1, which inserts its N-terminal
        domain into the PET
    - reference_id: PMID:42129552
      supporting_text: >-
        observed no major growth defects under any condition
    - reference_id: file:SCHPO/SPBC21C3.19/SPBC21C3.19-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: >-
        PANTHER; PTHR10927:SF2; RESTRICTION OF TELOMERE CAPPING PROTEIN 3; 1.
- term:
    id: GO:0043023
    label: ribosomal large subunit binding
  evidence_type: IDA
  original_reference_id: PMID:42129552
  qualifier: enables
  review:
    summary: >-
      Recombinant S. pombe Rtc3/SNOR co-sediments with purified S. pombe 60S subunits and
      80S ribosomes but not with 40S subunits. A cryo-EM structure of the reconstituted
      60S-SNOR complex shows it bound at the peptidyl transferase centre, mainly through
      charged contacts with rRNA.
    action: NEW
    reason: >-
      Several independent assays on the gene product itself support direct, specific binding
      to the large subunit: co-sedimentation, single-particle cryo-EM of the reconstituted
      complex, and in situ cryo-ET of native dormant ribosomes. Mutations at the
      rRNA-contacting residue K68 reduce binding. This is the core molecular function. It is
      more specific than ribosome binding, because 40S is not bound.
    supported_by:
    - reference_id: PMID:42129552
      supporting_text: >-
        The binding assays showed that SNOR specifically interacts with the 60S large
        subunit and intact 80S ribosomes
    - reference_id: PMID:42129552
      supporting_text: >-
        SNOR interacts almost exclusively with rRNA through charged interactions
    - reference_id: PMID:42129552
      supporting_text: >-
        These results suggest that highly conserved K68 is the primary contributor to
        RNA-mediated SNOR binding to the ribosome.
- term:
