- term:
    id: GO:2000767
    label: positive regulation of cytoplasmic translation
  evidence_type: IMP
  original_reference_id: PMID:42129552
  qualifier: involved_in
  review:
    summary: >-
      In rtc3 deletion cells, and in knock-in cells carrying a ribosome-binding-deficient
      (K68E/H96A/R97E) or C-terminal-tail-truncated (G100STOP) allele, polysomes fail to
      recover 2 h after glucose is added back to cells kept glucose-depleted for 7 days.
      Wild-type cells restart translation.
    action: NEW
    reason: >-
      Rtc3 does part of the work itself. It binds the ribosome directly at the peptidyl
      transferase centre, and the restart defect follows its ribosome-binding residues and
      its exit-tunnel tail, not only the presence of the protein. The phenotype is
      therefore not a pleiotropic consequence of losing the gene. Translation shutdown
      during glucose depletion is normal in the mutants, so the defect is specific to
      reactivation. The term is chosen at the level the data support: a positive effect on
      cytoplasmic translation, conditional on recovery from glucose-depletion dormancy. In
      heterologous rabbit reticulocyte lysate, Rtc3 represses translation, so the
      regulatory sign applies only in this physiological context.
    supported_by:
    - reference_id: PMID:42129552
      supporting_text: >-
        By contrast, SNOR-knockout cells did not recover polysomes. Similarly, both SNOR
        knock-in mutants, including the ribosome-binding-deficient mutant and the C-terminal
        tail deletion mutant, did not recover polysomes.
    - reference_id: PMID:42129552
      supporting_text: >-
        These results demonstrate that SNOR association with the ribosome and its C-terminal
        tail are both required for translation restart.
- term:
    id: GO:0042149
    label: cellular response to glucose starvation
  evidence_type: IMP
  original_reference_id: PMID:42129552
  qualifier: involved_in
  review:
    summary: >-
      Rtc3 protein is induced specifically by glucose-dependent carbon stress. The rtc3
      deletion and the ribosome-binding or tail mutants lose viability progressively from
      day 4 of glucose depletion, the point at which translation shuts down.
    action: NEW
    reason: >-
      The viability defect appears only during prolonged glucose limitation; mutant growth
      in replete or low glucose is normal. It needs the protein's ribosome-binding activity,
      which places Rtc3 in the cell's adaptive response to glucose exhaustion and not merely
      among the genes induced by it. The induction data alone would not justify this term.
      It is kept non-core, as the physiological context of the translation-restart function.
    supported_by:
    - reference_id: PMID:42129552
      supporting_text: >-
        However, starting at day 4, SNOR-knockout and both ribosome-binding-deficient and
        C-terminal tail-deleted knock-in strains displayed a progressive loss of viability
        relative to wild type
    - reference_id: PMID:42129552
      supporting_text: >-
        these data indicate that SNOR induction is specific to glucose-dependent carbon
        stress and is not a consequence of general nutrient or osmotic stress
