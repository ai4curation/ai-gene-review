suggested_questions:
- question: Is spo2 expressed as an independent meiotic transcript initiating at the codon equivalent
    to Vps1302 Met2999, and does the vps1302 gene model correctly extend through the spo2 coding
    region?
- question: Which regions of the 133-residue Spo2 mediate binding to Spo15 and to Spo13, and are they
    separable?
suggested_experiments:
- description: Map the 5' ends of meiotic spo2 transcripts (e.g. TSS-seq or 5' RACE across a meiotic
    time course) and test whether a spo2 start-codon mutation that leaves the vps1302 frame intact
    abolishes sporulation, to separate spo2 function from that of the overlapping vps1302 locus.
- description: Use truncation and point mutants of Spo2 in two-hybrid and co-immunoprecipitation assays
    to define Spo15- and Spo13-binding regions, and test whether a mutant that binds Spo15 but not
    Spo13 localizes to the SPB yet fails to recruit Spo13 and to initiate forespore membrane formation.
