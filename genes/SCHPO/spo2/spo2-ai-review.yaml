    summary: Spo2 is required for SPB modification (meiotic outer plaque formation) during meiosis II.
    action: ACCEPT
    reason: The term definition explicitly includes recruitment of sporulation-specific proteins to the
      outer plaque. Spo2 is itself one of those recruited proteins and performs part of the work by
      recruiting Spo13; the deletion mutant is defective in SPB modification. This is participation,
      not merely necessity.
