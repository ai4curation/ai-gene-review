    action: MODIFY
    reason: Physical association with both partners, absence of direct Spo13–Spo15 interaction, and the
      Spo2 dependence of Spo13 recruitment support an adaptor mechanism more informative than generic
      protein binding. The replacement describes the integrated mechanism; neither interaction alone establishes
      it.
