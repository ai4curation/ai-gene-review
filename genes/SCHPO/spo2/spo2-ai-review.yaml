id: C6Y4C2
gene_symbol: spo2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Spo2 is a meiosis-induced spindle pole body protein that connects Spo15 with Spo13 on the
  cytoplasmic face of the meiotic spindle pole body. Its ordered recruitment is required for remodeling
  the spindle pole body and initiating forespore membrane formation during sporulation. It is not required
  for the meiotic nuclear divisions themselves.
