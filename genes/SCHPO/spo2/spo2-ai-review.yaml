gene_symbol: spo2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: Spo2 is a small (133 aa, about 15 kDa) meiosis-induced protein of fission yeast that is
  required for sporulation but not for the meiotic nuclear divisions. Its expression is driven by the
  forkhead transcription factor Mei4. During meiosis II Spo2 is recruited to the cytoplasmic face of the
  spindle pole body (SPB) by the constitutive SPB component Spo15, and it in turn recruits Spo13; Spo2
  binds both proteins, which do not bind each other directly. This ordered Spo15-Spo2-Spo13 assembly
  converts the SPB outer plaque into the meiotic outer plaque that initiates forespore membrane
  formation. The Spo2 sequence is identical to the C-terminal 133 residues of the overlapping vps1302
  gene model but contains none of the VPS13 lipid-transfer domains, and Spo2 has no recognised
  homologues outside the fission-yeast lineage.
