  review:
    summary: Spo2 physically associates with Spo15 (SPAC1F3.06c), the constitutive SPB component that
      recruits it to the meiotic SPB.
    action: MODIFY
    reason: Generic protein binding is uninformative. Spo2 binds both Spo15 and Spo13, which do not
      interact directly, and Spo13 needs Spo2 to reach the SPB. Together these data support a bridging
      adaptor activity that brings the two SPB components together, captured by protein-macromolecule
      adaptor activity (an is_a child of molecular adaptor activity). The Spo15 interaction is one
      half of that bridge.
