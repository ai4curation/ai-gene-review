suggested_questions:
- question: Does the pheromone MAPK Spk1 directly phosphorylate Sms1 to drive negative feedback on the fission-yeast hemi-arrestin MAPK scaffold, or is Sms1 membrane detachment mediated by another proline-directed kinase?
- question: Does the high-throughput mitotic spindle pole body localization call for Spk1 reflect regulated Spk1 activity at spindle pole bodies, or a secondary localization signal without a dedicated SPB substrate?
suggested_experiments:
- description: Compare phosphosite occupancy on wild-type and MAPK-docking-defective Sms1 in cells with analog-sensitive spk1, catalytically active Byr1, and pheromone stimulation to test whether Spk1 directly phosphorylates the inhibitory Sms1 serine/threonine-proline sites in vivo.
