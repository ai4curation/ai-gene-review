id: P27638
gene_symbol: spk1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Spk1 is a Fus3/Kss1-like mitogen-activated protein kinase that functions as the terminal MAPK of the fission-yeast pheromone response pathway. Byr2 and Byr1 activate Spk1 during nitrogen starvation and mating signaling, and active Spk1 phosphorylates nuclear targets such as the Ste11 transcription factor to drive pheromone-induced gene expression, G1 arrest, conjugation, and sporulation.
core_functions:
- description: Spk1 provides MAP kinase activity as the terminal kinase of the Byr2-Byr1-Spk1 pheromone response MAPK cascade, downstream of the Byr1 MAPKK and upstream of the Ste11 transcription factor.
  molecular_function:
    id: GO:0004707
    label: MAP kinase activity
  directly_involved_in:
