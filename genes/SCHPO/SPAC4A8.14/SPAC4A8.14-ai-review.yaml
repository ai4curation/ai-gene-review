taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPAC4A8.14 (UniProt P41831) encodes ribose-phosphate pyrophosphokinase 1 (PRPP synthetase;
  EC 2.7.6.1), one of the S. pombe PRS paralogs. It transfers pyrophosphate from ATP to ribose 5-phosphate
  to make PRPP, the substrate for de novo and salvage nucleotide synthesis and for histidine, tryptophan
  and NAD+ synthesis. By orthology to S. cerevisiae Prs1-5, it is expected to work in hetero-oligomeric
  PRS complexes. It is cytosolic in a genome-wide screen.
