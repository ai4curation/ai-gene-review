suggested_questions:
- question: 'Why does ggt2 overexpression raise intracellular glutathione and uptake if GGT degrades glutathione:
    is this a compensatory response to increased turnover?'
suggested_experiments:
- hypothesis: Ggt2 degrades vacuolar glutathione and S-conjugates.
  description: Measure vacuolar glutathione and GS-conjugate (e.g. GS-bimane) turnover in isolated vacuoles
    from wild type, ggt2 and ggt1 ggt2 strains.
