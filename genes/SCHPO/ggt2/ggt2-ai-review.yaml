taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Gamma-glutamyltransferase 2 (glutathione hydrolase proenzyme 2, Ggt2; EC 2.3.2.2 / 3.4.19.13)
  of Schizosaccharomyces pombe, the second of two GGT-family Ntn-hydrolase paralogs (with Ggt1). A single-pass
  type II membrane protein, it is predicted to autocleave into heavy and light chains and cleaves the
  gamma-glutamyl bond of glutathione and glutathione S-conjugates, yielding glutamate (or a gamma-glutamyl-amino
  acid) and Cys-Gly. Extra gene copies raise cellular GGT activity about four-fold, increase glutathione
  content and uptake, and improve survival on H2O2, diethylmaleate and heavy metals. Tagged Ggt2 localises
  to the vacuole, consistent with the vacuolar-membrane location of S. cerevisiae Ecm38, where GGT degrades
  stored glutathione. ggt2 transcription is induced by H2O2, by nitric-oxide donors (Pap1-dependent) and
  by the glutathione-depleting agent diethylmaleate.
