description: >-
  erv14 encodes a fission-yeast cornichon-family multipass membrane cargo
  receptor that cycles through the endoplasmic reticulum, COPII-coated
  ER-to-Golgi carriers, and Golgi membranes. By analogy to the well-studied
  budding-yeast and metazoan cornichons, Erv14 binds selected transmembrane
  cargoes and COPII coat machinery to promote cargo incorporation into
  ER-derived COPII vesicles.
