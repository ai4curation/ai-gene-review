  review:
    summary: >-
      Golgi membrane is a supported cycling location for this cornichon cargo
      receptor, but not the site where cargo loading initiates.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The UniProt subcellular-location mapping records the
      expected Erv14 cycle through Golgi membranes after COPII vesicles leave
      the ER. The central cargo-receptor step, however, is cargo capture in the
      ER/COPII prebudding carrier rather than residence at the Golgi.
