  label: Schizosaccharomyces pombe 972h-
description: Acetohydroxyacid synthase (acetolactate synthase, EC 2.2.1.6) catalytic subunit of Schizosaccharomyces pombe
  (SPBP35G2.07, PomBase ilv1), the ortholog of S. cerevisiae Ilv2 (not of S. cerevisiae Ilv1). This thiamine diphosphate-,
  Mg2+- and FAD-dependent enzyme condenses two pyruvates to 2-acetolactate (valine and leucine branch) or pyruvate and 2-oxobutanoate
  to 2-aceto-2-hydroxybutanoate (isoleucine branch), the first shared step of branched-chain amino acid synthesis. S. pombe
  ilv1 complements a S. cerevisiae ilv2 deletion, and the S. pombe enzyme is feedback-inhibited by valine. It has a mitochondrial
  transit peptide and acts in the mitochondrial matrix.
