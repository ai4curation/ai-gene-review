suggested_questions:
- question: Does S. pombe have an Ilv6-like regulatory small subunit that confers the valine feedback sensitivity measured
    in extracts, and does ilv1 form a complex with it?
- question: Does the valine feedback inhibition seen in S. pombe extracts reside in ilv1 alone or require a small subunit?
suggested_experiments:
- description: Co-purify tagged ilv1 from mitochondria to identify a regulatory subunit; reconstitute AHAS activity and valine
    inhibition with recombinant proteins.
  experiment_type: biochemistry
