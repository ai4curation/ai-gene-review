    summary: Rhea-to-GO mapping of RHEA:15757 (L-homoserine + NAD+ = L-aspartate 4-semialdehyde + NADH) to the generic alcohol
      dehydrogenase (NAD+) activity (EC 1.1.1.1). The reaction is the NAD-linked form of homoserine dehydrogenase (EC 1.1.1.3);
      GO:0004412 is not a descendant of GO:0004022, so the generic term implies a broad-specificity alcohol dehydrogenase
      that hom6 is not. Same decision as for S. cerevisiae HOM6.
