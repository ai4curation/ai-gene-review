taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Homoserine dehydrogenase (EC 1.1.1.3) of Schizosaccharomyces pombe (SPBC776.03), a monofunctional enzyme orthologous
  to S. cerevisiae Hom6. It reduces L-aspartate 4-semialdehyde to L-homoserine using NADPH or NADH, the third and last step
  of homoserine synthesis from aspartate. Homoserine is the branch point between threonine (and isoleucine) synthesis, via
  homoserine kinase, and methionine synthesis, via homoserine O-acetyltransferase. The enzyme is expected to act in the cytosol;
  its function is inferred from the budding-yeast ortholog, with no S. pombe enzymology reported.
