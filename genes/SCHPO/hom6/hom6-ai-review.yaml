  review:
    summary: hom6 supports NAD-dependent homoserine/alcohol oxidation, with homoserine as the specified
      substrate.
    action: ACCEPT
    reason: The curated reaction for fission-yeast Hom6 and the experimentally characterized budding-yeast
      ortholog (PMID:11341914) support an inherited NAD(H)-dependent homoserine reaction; a native fission-yeast
      cofactor assay is not asserted. GO:0004022 describes alcohol oxidation with NAD+, which includes
      oxidation of the primary alcohol in homoserine to an aldehyde. GO:0004412 explicitly uses NADP+
      and is not a cofactor-preserving replacement. Retain the available NAD-specific term at the precision
      currently justified; this does not assert ethanol metabolism, broad substrate promiscuity or equal
      physiological cofactor use.
