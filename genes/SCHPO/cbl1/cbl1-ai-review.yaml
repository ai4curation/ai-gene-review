  label: Schizosaccharomyces pombe 972h-
description: cbl1 (SPCC11E10.01) encodes the fission yeast cystathionine beta-lyase (EC 4.4.1.13), a pyridoxal
  5'-phosphate-dependent enzyme of the trans-sulfuration family (PTHR11808:SF50, the same subfamily as
  S. cerevisiae STR3). It cleaves L-cystathionine to L-homocysteine, pyruvate and ammonium, the second
  step of forward trans-sulfuration that follows cystathionine gamma-synthase (met3) and supplies homocysteine
  for de novo methionine synthesis; like other members it can also cleave other S-substituted cysteines
  (cysteine-S-conjugate beta-lyase activity). Its role is inferred from orthology; it is predicted to
  be cytoplasmic, and unlike S. cerevisiae Str3 it lacks a C-terminal PTS1-like peroxisomal targeting
  signal.
