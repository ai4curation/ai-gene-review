- term:
    id: GO:0000077
    label: DNA damage checkpoint signaling
  evidence_type: IMP
  original_reference_id: PMID:22184112
  qualifier: involved_in
  review:
    summary: >-
      H3K14 acetylation by Mst2 and Gcn5 supports DNA damage checkpoint
      activation in fission yeast.
    action: NEW
    reason: >-
      Wang et al. showed that the Mst2 complex is a specific nucleosomal H3K14
      acetyltransferase and that cells lacking both Gcn5 and Mst2-mediated
      H3K14ac fail DNA-damage-induced checkpoint delay and have reduced H2A
      phosphorylation after bleomycin treatment. Mst2 therefore contributes
      redundantly with Gcn5 to the chromatin-acetylation arm that activates the
      DNA damage checkpoint.
    supported_by:
    - reference_id: PMID:22184112
      supporting_text: >-
        H3K14ac is critical for DNA damage checkpoint activation by directly
        regulating the compaction of chromatin and by recruiting chromatin
        remodeling protein complex RSC
    - reference_id: PMID:22184112
      supporting_text: >-
        H3K14ac is required for an early step during the activation of the DNA
        damage checkpoint
