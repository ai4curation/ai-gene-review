taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Mst2 is a fission-yeast MYST-family histone acetyltransferase and the
  catalytic subunit of the nuclear Mst2 histone acetyltransferase complex. The
  complex acetylates nucleosomal histone H3 lysine 14, modulates chromatin accessibility,
  contributes to transcription and DNA-damage checkpoint signaling, and opposes
  excessive H3K9me-dependent heterochromatin spreading.
