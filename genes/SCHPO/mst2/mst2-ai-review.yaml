- id: PMID:16199868
  title: Schizosaccharomyces pombe mst2+ encodes a MYST family histone acetyltransferase
    that negatively regulates telomere silencing.
  findings:
  - statement: Mst2 is nuclear and chromatin-bound and negatively regulates telomeric
      silencing.
    supporting_text: Both proteins are localized to the nucleus and bound to chromatin
      throughout the cell cycle.
    reference_section_type: ABSTRACT
  - statement: Mst2 negatively regulates telomeric silencing without measurably changing
      centromeric or mating-type-region silencing.
    supporting_text: Mst2p is a negative regulator of silencing at the telomere
      but does not affect silencing in the centromere or mating type region.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary fission-yeast Mst1/Mst2 paper; its full-text
      abstract directly supports the nuclear/chromatin localization and telomeric
      anti-silencing role used here.
- id: PMID:21289066
  title: Elimination of a specific histone H3K14 acetyltransferase complex bypasses
    the RNAi pathway to regulate pericentric heterochromatin functions.
  findings:
  - statement: Loss of Mst2 H3K14 acetyltransferase activity bypasses the RNAi requirement
      for pericentric heterochromatin functions.
    supporting_text: when the activity of the histone H3 Lys 14 (H3K14) acetyltransferase
      Mst2 is eliminated, the RNAi machinery is no longer required for pericentric
      heterochromatin functions
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary paper behind PomBase's Mst2 H3K14 HAT
      and RNAi-bypass heterochromatin rows; the local cache is abstract-only.
- id: PMID:22184112
  title: Histone H3 lysine 14 acetylation is required for activation of a DNA damage
    checkpoint in fission yeast.
  findings:
  - statement: Mst2 is the catalytic subunit of a Mst2 complex that specifically
      acetylates nucleosomal histone H3K14.
    supporting_text: These results demonstrate that the Mst2 complex is a highly
      specific nucleosomal histone H3K14 acetyltransferase.
    reference_section_type: RESULTS
  - statement: Mst2 and Gcn5 redundantly acetylate H3K14, and H3K14 acetylation
      loss in gcn5Δ mst2Δ or H3K14R backgrounds impairs G2-M DNA-damage checkpoint
      activation.
    supporting_text: Neither gcn5 Δ mst2 Δ nor H3K14R cells show a significant
      reduction of the septation index upon growth in MMS or after UV treatment,
      indicating a failure of checkpoint-induced cell cycle delay
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified full-text biochemical paper identifying the Mst2
      complex and showing Mst2-dependent H3K14 acetyltransferase activity.
- id: PMID:25774602
  title: Rapid epigenetic adaptation to uncontrolled heterochromatin spreading.
  findings:
  - statement: The Mst2 complex restrains heterochromatin spreading by regulating
      histone turnover at heterochromatin regions.
    supporting_text: In this study, we show that Mst2 regulates histone turnover
      at heterochromatin regions and that loss of Mst2 results in heterochromatin
      spreading at telomeres and heterochromatin islands where boundaries are absent.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified full-text primary paper supporting Mst2/Epe1 redundancy
      in limiting heterochromatin spreading and ectopic heterochromatin assembly.
- id: PMID:39094565
  title: Mapping the dynamics of epigenetic adaptation in S. pombe during heterochromatin
    misregulation.
  findings:
  - statement: The heterochromatin misregulation system depletes the two major H3K9me
      antagonists, Mst2 and Epe1, to elicit adaptive Clr4 silencing.
    supporting_text: Deleting two major H3K9me antagonists – the H3K14 histone acetyltransferase
      Mst2 and the putative H3K9 demethylase Epe1 – leads to the adaptive silencing
      of the sole H3K9 methyltransferase, Clr4
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified full-text 2024 paper using induced Epe1/Mst2 loss
      to model heterochromatin misregulation; relevant but downstream of the direct
      Mst2 HAT biochemistry.
- id: PMID:39096900
  title: Nucleosome remodeler exclusion by histone deacetylation enforces heterochromatic
    silencing and epigenetic inheritance.
  findings:
  - statement: Artificially targeting Mst2 to H3K9me-marked domains raises H3K14ac
      and destabilizes heterochromatin through SWI/SNF-family remodelers.
    supporting_text: targeting of chromodomain-fused Mst2 HAT to H3K9me-coated domains
      increases H3K14ac and SWI/SNF-dependent destabilization of heterochromatin.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified full-text paper that directly tests Mst2 HAT recruitment
      at heterochromatin and supports PomBase's GO:0120262 IDA row.
- id: PMID:41786738
  title: An H3K14ub-H3K9me3 feedback circuit governs heterochromatin spreading and
    inheritance in fission yeast.
  findings:
  - statement: Mst2-mediated H3K14 acetylation opposes the H3K14ub-H3K9me3 feedback
      circuit to restrain heterochromatin expansion.
    supporting_text: Together, these findings demonstrate that Mst2 and Epe1 function
      as independent brakes that restrain the H3K14ub-H3K9me3 feedback loop and
      prevent uncontrolled heterochromatin expansion.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified 2026 full-text paper found by literature search;
      it mechanistically updates the Mst2/Epe1 anti-silencing model through the
      H3K14ub-H3K9me3 feedback circuit.
