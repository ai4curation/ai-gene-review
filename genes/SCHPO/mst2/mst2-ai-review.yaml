      SAS3. Fission-yeast Mst2 sits in the same PTHR10615:SF161 subfamily and has
      NuA3-like activity, but Wang et al. showed that its complex differs from budding
      yeast NuA3, lacks the Yng1 subunit, and contains the fission-specific Ptf1
      and Ptf2 subunits. The exact replacement is the PomBase term for the Mst2
      histone acetyltransferase complex.
