id: Q10325
gene_symbol: mst2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  mst2 encodes a fission-yeast Sas3/KAT7-family MYST histone
  acetyltransferase and the catalytic subunit of the Mst2 histone
  acetyltransferase complex. Mst2 acts in the nucleus on chromatin, acetylates
  histone H3K14, contributes with Gcn5 to H3K14 acetylation that supports DNA
  damage checkpoint activation, limits telomeric silencing, maintains
  euchromatic state by antagonizing H3K9-methylated heterochromatin spreading,
  and counterbalances Epe1 and Clr3-dependent pathways that tune
  heterochromatin stability and epigenetic inheritance.
