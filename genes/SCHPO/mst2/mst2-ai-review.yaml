suggested_questions:
- question: >-
    Which Mst2 complex subunits, beyond Mst2, Nto1, and Ptf2, are required for
    H3K14 acetylation at each heterochromatic locus in vivo?
suggested_experiments:
- description: >-
    Perform time-resolved H3K14ac, H3K14ub, H3K9me2/3, and Mst2 ChIP-seq in
    clr3, CLRC, epe1, and mst2-complex subunit mutants to quantify where Mst2
    acts directly in the H3K14ub-H3K9me3 feedback circuit.
