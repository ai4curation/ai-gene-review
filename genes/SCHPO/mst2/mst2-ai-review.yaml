      supporting_text: Mst2-mediated H3K14ac counteracts Clr3-mediated H3K14 deacetylation,
        therefore inhibiting H3K14ub, while Epe1 directly erases H3K9me3
- term:
    id: GO:0031507
    label: heterochromatin formation
  evidence_type: IGI
  original_reference_id: PMID:21289066
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPCC188.13c
  review:
    summary: The 2011 RNAi-bypass phenotype supports an anti-silencing role for
      Mst2, not direct promotion of heterochromatin formation.
    action: MODIFY
    reason: The PomBase IGI row rests on the same heterochromatin biology captured
      by GO:0120262. Eliminating Mst2 H3K14 acetyltransferase activity bypasses
      the RNAi requirement for pericentric heterochromatin functions; this means
      wild-type Mst2 antagonizes, rather than builds, H3K9me-dependent heterochromatin.
    proposed_replacement_terms:
    - id: GO:0120262
      label: negative regulation of heterochromatin organization
    additional_reference_ids:
    - PMID:25774602
    - PMID:41786738
    supported_by:
    - reference_id: PMID:21289066
      supporting_text: when the activity of the histone H3 Lys 14 (H3K14) acetyltransferase
        Mst2 is eliminated, the RNAi machinery is no longer required for pericentric
        heterochromatin functions
    - reference_id: PMID:41786738
      supporting_text: Together, these findings demonstrate that Mst2 and Epe1 function
        as independent brakes that restrain the H3K14ub-H3K9me3 feedback loop and
        prevent uncontrolled heterochromatin expansion.
- term:
    id: GO:0033696
    label: heterochromatin boundary formation
  evidence_type: IGI
  original_reference_id: PMID:25774602
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPCC622.16c
  review:
    summary: Mst2 and Epe1 act redundantly to restrain heterochromatin spreading
      and ectopic heterochromatin assembly.
    action: ACCEPT
    reason: Although Mst2 is not required for the IRC1R DNA boundary, it limits
      spreading at heterochromatin regions whose borders are set by chromatin-state
      balance rather than sequence-defined boundary elements. This is exactly the
      Mst2/Epe1 anti-spreading role that PomBase curates with GO:0033696.
    additional_reference_ids:
    - PMID:41786738
    supported_by:
    - reference_id: PMID:25774602
      supporting_text: In this study, we show that Mst2 regulates histone turnover
        at heterochromatin regions and that loss of Mst2 results in heterochromatin
        spreading at telomeres and heterochromatin islands where boundaries are absent.
