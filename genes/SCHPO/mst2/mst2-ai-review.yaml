  review:
    summary: Mst2 acts on the heterochromatin axis, but as an antagonist of H3K9
      heterochromatin expansion rather than a factor that forms heterochromatin.
    action: MODIFY
    reason: Later direct evidence resolves the sign of this ARBA prediction. Mst2-mediated
      H3K14 acetylation counteracts the H3K14ub-H3K9me3 feedback loop and restrains
      heterochromatin spreading, so the replacement should name negative regulation
      of heterochromatin organization.
    proposed_replacement_terms:
