description: >-
  ProTrek sequence-to-text retrieval for sou1, the S. pombe sorbose reductase. Rank 1 is the exact
  core molecular function at 18.96, and the free-text channel returns the sou1 description verbatim
  at 20.96. Ranks 2 and 3 offer L-xylulose reductase activities whose labels no longer resolve in
  the current GO release, and rank 5 the D-xylulose form - all SDR-family neighbours with different
  sugar substrates. This entry's GOA has a single non-IEA term, so rank 4 is a genuine addition. Assessment:
  1 correct novel (COR), 1 correct not novel (CNN), 1 paralog incorrect (PLI).
