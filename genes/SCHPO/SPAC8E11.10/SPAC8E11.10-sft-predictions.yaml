  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Incorrect. sou1 acts on L-sorbose and D-sorbitol (hexose sugar and hexitol), not arabitol (a pentitol).
      UniProt predicts NADP-dependent reduction of L-sorbose to D-glucitol, but no comparable arabitol activity.
      Confusion likely arises from sequence similarity among SDR polyol-active enzymes. An independent
      OpenScientist investigation (see file reference) confirms this
      PLI -- no assay links SPAC8E11.10 to arabitol (a pentitol); its characterized activity is on L-sorbose
      / D-sorbitol (a hexose/hexitol), so arabitol metabolic process is a substrate misassignment. [ONTOLOGY_LABEL_AUDIT]
      Raw model pair mismatch: GO:0019677 resolves to 'NAD+ catabolic process', not 'arabitol metabolic
      process'. The raw ID and label are retained for provenance; the assessment applies to the GO ID and
      explicitly flags the label error.
    supported_by:
    - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-hypotheses/prediction-nadp-arabitol-dehydrogenase/openscientist.md
      supporting_text: No assay links SPAC8E11.10 to arabitol

