  - id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research-falcon.md
    title: Falcon deep research report on S. pombe sou1 (SPAC8E11.10 / Q9Y6Z9)
    findings:
      - statement: |-
          The "sorbose reductase / sorbitol utilization protein" function of S. pombe
          Sou1 is an inference: no direct enzymatic assay, substrate panel, kinetics,
          or cofactor-preference measurement for SPAC8E11.10 / Q9Y6Z9 was found in the
          retrieved primary literature.
        supporting_text: |-
          No direct experimental evidence for the enzymatic reaction, substrate specificity, kinetics, or cofactor preference of the *S. pombe* Sou1 protein was identified in the retrieved full texts.
        reference_section_type: OTHER
      - statement: |-
          The reaction assignment for SOU1-type enzymes (EC 1.1.1.289, L-sorbose to
          D-sorbitol) is supported by comparative-genomics annotation rather than by
          direct S. pombe characterization.
        supporting_text: |-
          Comparative genomics literature also explicitly defines **SOU1 (EC 1.1.1.289)** as converting **L-sorbose → D-sorbitol**
        reference_section_type: OTHER
      - statement: |-
          The NADPH-dependent L-sorbose reductase biochemistry was demonstrated for the
          Candida albicans SOU1 ortholog, not for the S. pombe protein; the SOU1/sou1
          symbol is ambiguous across fungi, so cross-organism conflation is a risk.
        supporting_text: |-
          “SOU1/sou1” is also used in other fungi (notably *Candida albicans*), where it clearly denotes a sorbose-utilization gene encoding an NADPH-dependent L-sorbose reductase
        reference_section_type: OTHER
      - statement: |-
          sou1 is a bona fide S. pombe transcript name documented in peer-reviewed work
          (analyzed at the expression level in a TFIIH/CDK-activating-kinase study), even
          though that work does not establish its biochemical function.
        supporting_text: |-
          the gene symbol **sou1** is indeed used for an *S. pombe* transcript in peer-reviewed work
        reference_section_type: OTHER
      - statement: |-
          No subcellular localization data exist for S. pombe Sou1; any cytosolic
          assignment is a family-based inference, not a directly demonstrated location.
        supporting_text: |-
          any cytosolic assignment would be a **family-based inference**, not directly demonstrated here
        reference_section_type: OTHER
      - statement: |-
          Sou1 belongs to the SDR superfamily of NAD(P)(H)-dependent oxidoreductases,
          supporting the broad oxidoreductase activity assignment independent of the
          specific substrate.
        supporting_text: |-
          SDR enzymes are a large superfamily of NAD(P)(H)-dependent oxidoreductases
        reference_section_type: OTHER
  - id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-hypotheses/prediction-nadp-arabitol-dehydrogenase/openscientist.md
    title: OpenScientist focused review of sou1 NADP-dependent alcohol/arabitol
      predictions
    reference_review:
      relevance: HIGH
      correctness: MISCITED
      review_notes: The OpenScientist report correctly flags that no direct S.
        pombe substrate panel or kinetic assay establishes Q9Y6Z9's precise
        sugar/polyol substrate, but its L-sorbose species-physiology row
        misattributes PMID:31132130 to a UniProt CAUTION block that is absent
        from the cached Q9Y6Z9 flat file. PMID:31132130 is not cited or cached
        here, so this review does not rely on that row.
      source_defects:
        - defect_type: WRONG_STATEMENT
          resource: OTHER
          record: file:SCHPO/SPAC8E11.10/SPAC8E11.10-hypotheses/prediction-nadp-arabitol-dehydrogenase/openscientist.md
          slot: Evidence Matrix row 4
          requested_change: CHECK
          asserted_value: UniProt CAUTION, ECO:0000269 **PMID 31132130**
          confidence: CONFIRMED
          explanation: The OpenScientist evidence matrix attributes the S.
            pombe L-sorbose assimilation caveat to a UniProt CAUTION citing
            PMID:31132130, but the cached Q9Y6Z9 flat file has no CC:CAUTION
            block. PMID:31132130 was not retrieved into the local publication
            cache for this review, so the specific L-sorbose statement remains
            unchecked against that paper.
    findings:
      - statement: |-
          Q9Y6Z9 is best treated as an uncharacterized SDR whose precise
          sugar/polyol substrate has not been directly assayed in S. pombe.
        supporting_text: |-
          No S. pombe
          enzymatic assay exists, so every substrate assignment — sorbose, mannitol, xylulose, **or arabitol** —
          is inference.
        reference_section_type: OTHER
core_functions:
  - description: |-
      Predicted NADP(H)-dependent SDR oxidoreductase acting on CH-OH groups in a
      sugar or polyol substrate. The exact physiological substrate remains
      unresolved: sorbose, mannitol/fructose, xylulose, and arabitol assignments
      are all indirect or disfavored, while the broader SDR reaction class is
      supported by sequence and family evidence.
    molecular_function:
      id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD
        or NADP as acceptor
    supported_by:
      - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research-falcon.md
        supporting_text: |-
          SDR enzymes are a large superfamily of NAD(P)(H)-dependent oxidoreductases
      - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-hypotheses/prediction-nadp-arabitol-dehydrogenase/openscientist.md
        supporting_text: |-
          No S. pombe
          enzymatic assay exists, so every substrate assignment — sorbose, mannitol, xylulose, **or arabitol** —
          is inference.
suggested_questions:
  - question: What is the true physiological sugar or polyol substrate of Sou1 in
      S. pombe?
  - question: Which active-site residues determine Sou1 substrate specificity
      within the NADP-dependent SDR family?
  - question: Under which carbon-source or osmotic-stress conditions is sou1
      expressed?
  - question: What are the evolutionary relationships among S. pombe Sou1,
      Candida sorbose reductases, and fungal xylulose/mannitol dehydrogenases?
suggested_experiments:
  - description: Enzyme kinetics analysis with purified Sou1 to test candidate
      substrates including sorbose, fructose, mannitol, xylulose, and arabitol
  - description: RNA-seq analysis under different carbon source conditions to 
      determine sorbose reductase expression regulation
  - description: Metabolomics analysis of sou1 deletion strains under candidate
      sugar and polyol carbon sources
  - description: Structural determination of Sou1 to understand the molecular
      basis of its catalytic activity and substrate recognition
status: COMPLETE
