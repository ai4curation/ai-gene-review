      label: mannitol 2-dehydrogenase (NADP+) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: |-
        Uncertain ARBA substrate assignment. The Candida ortholog has a
        fructose-to-mannitol side activity, and FunFam also points into a
        mannitol/polyol dehydrogenase neighborhood, but no S. pombe assay
        verifies Q9Y6Z9 as a mannitol 2-dehydrogenase.
      action: UNDECIDED
      reason: The mannitol call should be kept as an unresolved, low-confidence
        prediction rather than removed as contradicted by the sorbose reductase
        name; OpenScientist found the mannitol activity unproven but within the
        adjacent substrate space for the family.
      supported_by:
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research.md
          supporting_text: 'Biochemical studies of orthologous enzymes support this
