id: Q9Y6Z9
gene_symbol: sou1
aliases:
  - SPAC8E11.10
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: |-
  Predicted 255-amino-acid mitochondrial short-chain
  dehydrogenase/reductase (SDR) family enzyme with an NAD(P)-binding
  Rossmann-like fold, homology-modelled NADP-binding residues, and conserved
  catalytic Tyr/Lys residues. Sequence and domain evidence support an
  NADP(H)-dependent oxidoreductase activity on CH-OH groups of sugar or polyol
  substrates; the physiological substrate in S. pombe remains unresolved.
existing_annotations:
  - term:
      id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD 
        or NADP as acceptor
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: |-
        This IBA annotation correctly captures the best-supported enzymatic
        class for Sou1: an SDR-family oxidoreductase acting on CH-OH groups with
        NAD(P) as acceptor. More specific sorbose reductase and mannitol
        2-dehydrogenase assignments remain substrate hypotheses rather than
        direct S. pombe biochemical results.
      action: ACCEPT
      reason: |-
        GO:0016616 is broad enough to be supported by the SDR fold, NAD(P)
        dependence, and PAINT placement without asserting a specific
        physiological sugar or polyol. Falcon and OpenScientist both found no
        direct S. pombe substrate panel or kinetic characterization for
        Q9Y6Z9, so the CH-OH oxidoreductase class is retained as the core
        molecular function while narrower substrate calls are treated
        cautiously.
      supported_by:
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research-falcon.md
          supporting_text: SDR enzymes are a large superfamily of NAD(P)(H)-dependent oxidoreductases
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-hypotheses/prediction-nadp-arabitol-dehydrogenase/openscientist.md
          supporting_text: |-
            No S. pombe
            enzymatic assay exists, so every substrate assignment — sorbose, mannitol, xylulose, **or arabitol** —
            is inference.
  - term:
      id: GO:0005975
      label: carbohydrate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: |-
        Broad IEA annotation consistent with a predicted sugar/polyol
        oxidoreductase, but retained as non-core because the physiological
        carbohydrate substrate and the corresponding S. pombe pathway have not
        been experimentally established.
      action: KEEP_AS_NON_CORE
      reason: The SDR fold and carbohydrate-assimilation database context make a
        carbohydrate-metabolism assignment plausible, but a specific
        sorbose/sorbitol pathway assignment is still an inference rather than a
        demonstrated S. pombe function.
      supported_by:
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research.md
          supporting_text: The Sou1 enzyme is involved in carbohydrate metabolic
            pathways, specifically the utilization of L-sorbose and D-sorbitol
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research.md
          supporting_text: This places Sou1 in the context of the sorbose
            metabolic process (GO:0019311)
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research-falcon.md
          supporting_text: |-
            sorbitol stress induces multiple genes encoding **putative sugar oxidoreductases**
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    qualifier: enables
    review:
      summary: |-
        True but too broad UniProt keyword mapping. The SDR-family assignment
        supports oxidoreductase activity, but the accepted GO:0016616 row
        captures the predicted CH-OH donor/NAD(P) acceptor chemistry more
        informatively.
      action: TOO_GENERAL
      reason: GO:0016491 is a true parent-class statement, but it is a strict
        ancestor of the more precise GO:0016616 activity accepted as Sou1's core
        molecular function elsewhere in this review.
      supported_by:
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research.md
          supporting_text: The enzymatic mechanism is expected to follow the 
            typical SDR oxidoreductase mechanism
  - term:
      id: GO:0032115
      label: sorbose reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: |-
        Low-confidence computational substrate assignment. UniProt/EC and
        Candida SOU1 orthology point to sorbose reductase activity, but no
        enzymatic assay exists for Q9Y6Z9 itself.
      action: UNDECIDED
      reason: |-
        GO:0032115 is a plausible orthology-based assignment, but not a direct
        S. pombe result. A focused OpenScientist run found that every specific
        substrate assignment remains inferential, and it recommended retaining
        sorbose reductase only with a caution rather than upgrading it to a
        verified or core molecular function.
      supported_by:
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research.md
          supporting_text: This activity corresponds to "sorbose reductase 
            activity" (GO:0032115) in Gene Ontology terms
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: 'CATALYTIC ACTIVITY: Reaction=D-sorbitol + NADP(+) = keto-L-sorbose
            + NADPH + H(+)'
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research-falcon.md
          supporting_text: |-
            in *C. albicans* this is experimentally described as “NADPH-dependent L-sorbose reductase”
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-deep-research-falcon.md
          supporting_text: |-
            A yeast comparative genomics paper notes that **SOU1 (K17742; EC 1.1.1.289)** is an enzyme that **converts L-sorbose into D-sorbitol**.
        - reference_id: file:SCHPO/SPAC8E11.10/SPAC8E11.10-hypotheses/prediction-nadp-arabitol-dehydrogenase/openscientist.md
          supporting_text: |-
            No S. pombe
            enzymatic assay exists, so every substrate assignment — sorbose, mannitol, xylulose, **or arabitol** —
            is inference.
