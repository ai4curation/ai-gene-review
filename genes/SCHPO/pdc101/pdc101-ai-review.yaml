suggested_questions:
- question: Is pdc101 essential because of fermentative NAD+ regeneration, or because acetaldehyde is
    needed for cytosolic acetyl-CoA via the PDH bypass?
- question: Does pdc101 also decarboxylate branched-chain or aromatic 2-oxo acids (Ehrlich pathway) as
    the budding-yeast isozymes do?
suggested_experiments:
- description: Assay purified recombinant pdc101 with pyruvate and branched-chain/aromatic 2-oxo acids
    to define substrate range and kinetic constants.
- description: Test whether acetate or ethanol supplementation rescues a conditional pdc101 allele, to
    separate fermentative and acetyl-CoA supply roles.
