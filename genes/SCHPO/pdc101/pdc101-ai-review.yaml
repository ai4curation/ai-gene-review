taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pdc101 (SPAC1F8.07c) encodes the main pyruvate decarboxylase (EC 4.1.1.1) of growing fission
  yeast, a thiamine diphosphate- and Mg2+-dependent cytosolic enzyme that decarboxylates pyruvate to acetaldehyde
  and CO2, the committed step of alcoholic fermentation. It is the predominant pdc transcript and protein
  during exponential growth (about 500,000 copies per cell) and is not under control of the stationary-phase
  regulator Phx1. pdc101 could not be deleted and is predicted to be essential, consistent with the glucose-fermenting
  lifestyle of S. pombe. With its paralog pdc102 it belongs to a clade of filamentous-fungal and plant
  pyruvate decarboxylases distinct from the clade containing S. cerevisiae PDC1/PDC5/PDC6 and S. pombe
  pdc201/pdc202. The gene name pdc1 is used in fission yeast for an unrelated mRNA decapping scaffold
  protein, which is why the pyruvate decarboxylases are numbered pdc101 to pdc202 (UniProt entry name
  PDC2_SCHPO).
