core_functions:
- description: Thiamine diphosphate/Mg2+-dependent decarboxylation of pyruvate to acetaldehyde and CO2
    in the cytosol during exponential growth; the main, likely essential, pyruvate decarboxylase of fission
    yeast. PomBase models this activity as part of generic pyruvate fermentation (acetaldehyde feeds both
    the ethanol and acetate branches), which is followed here rather than the ethanol-specific child term
    used for S. cerevisiae PDC1.
  molecular_function:
    id: GO:0004737
    label: pyruvate decarboxylase activity
