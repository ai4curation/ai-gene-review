suggested_questions:
- question: How does the single Pgr1 translation product reach mitochondria without a predictable targeting
    sequence, and is it in the matrix?
- question: 'Why is glutathione reductase essential in S. pombe but dispensable in S. cerevisiae: does
    S. pombe lack a thioredoxin-based backup for GSSG reduction in mitochondria?'
suggested_experiments:
- hypothesis: Pgr1 is imported into the mitochondrial matrix.
  description: Protease-protection and submitochondrial fractionation of purified mitochondria from a
    strain expressing endogenous Pgr1-tag, with matrix and IMS markers.
