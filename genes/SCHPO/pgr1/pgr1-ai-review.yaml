  label: Schizosaccharomyces pombe 972h-
description: 'Glutathione reductase (Pgr1, EC 1.8.1.7) of Schizosaccharomyces pombe, a class-I pyridine
  nucleotide-disulfide oxidoreductase that, as an FAD-containing homodimer, uses NADPH to reduce glutathione
  disulfide (GSSG) to two molecules of reduced glutathione (GSH), maintaining a high GSH:GSSG ratio. Unlike
  its budding-yeast ortholog GLR1, pgr1 is essential: deletion spores are inviable and depletion causes
  G1 arrest under aerobic conditions. S. pombe uses a single translation start, and the single protein
  form is found both in the cytosol and in an organellar (most likely mitochondrial) fraction. Depletion
  raises the GSSG/GSH ratio, lowers respiration, inactivates oxidation-labile Fe-S enzymes (mitochondrial
  aconitase, cytosolic sulfite reductase) and causes iron accumulation; overexpression of the mitochondrial
  thioredoxin Trx2 suppresses lethality, indicating that the essential role is protection of Fe-S enzymes.
  pgr1 transcription is induced by oxidants and other stresses through the AP-1-like factor Pap1.'
