core_functions:
- description: NADPH-dependent reduction of glutathione disulfide to GSH in the cytosol and mitochondria,
    sustaining the reduced glutathione pool needed to protect oxidation-labile Fe-S enzymes; essential
    for aerobic growth in S. pombe.
