  label: Schizosaccharomyces pombe 972h-
description: fab1 (ste12; SPBC3E7.01; UniProt O59722) encodes the fission yeast PIKfyve/Fab1 phosphatidylinositol
  3-phosphate 5-kinase. It converts PI3P to PI(3,5)P2 on vacuolar and late endosomal membranes; its FYVE
  domain binds PI3P, and like its orthologs it works within the Fab1-Vac14-Fig4 complex. The gene was
  first identified as the fertility gene ste12. Mutants grow normally without stress, but become highly
  vacuolated and swollen at high temperature or on starvation, arrest in G1 without nitrogen, and are
  defective in producing and responding to mating pheromone, partly because the pheromone receptor Map3
  is reduced.
