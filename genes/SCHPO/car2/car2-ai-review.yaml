core_functions:
- description: Cytosolic PLP-dependent transamination of L-ornithine with 2-oxoglutarate to L-glutamate
    5-semialdehyde (P5C) and L-glutamate, the second step of arginine catabolism; the single S. pombe
    OAT. Same core function as S. cerevisiae CAR2.
