suggested_questions:
- question: Does arginine-derived P5C made by cytosolic car2 in S. pombe reach glutamate only via pro3
    and mitochondrial put1/put2 (the budding-yeast proline shuttle), or can it be oxidised directly?
suggested_experiments:
- description: Trace 13C-arginine into proline and glutamate in car2, pro3 (if viable with proline), put1
    and put2 deletions to define the route of P5C disposal in fission yeast.
