  label: Schizosaccharomyces pombe 972h-
description: car2 (SPBC21C3.08c) encodes the only ornithine aminotransferase (OAT, EC 2.6.1.13) of fission
  yeast, a pyridoxal-phosphate-dependent class-III aminotransferase orthologous to S. cerevisiae CAR2.
  It transfers the delta-amino group of L-ornithine (produced by the arginases car1 and aru1) to 2-oxoglutarate,
  forming L-glutamate and L-glutamate 5-semialdehyde, which cyclises to 1-pyrroline-5-carboxylate (P5C),
  the second step of arginine catabolism. Unlike the mitochondrial animal and plant enzymes, car2 is cytoplasmic.
  Deletion of car2 strongly reduces the conversion of arginine into proline, glutamate, glutamine and
  lysine that occurs in wild-type cells.
