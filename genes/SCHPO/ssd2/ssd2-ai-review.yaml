  review:
    action: UNDECIDED
    summary: PomBase curator inference (IC from GO:0004777) placing ssd2 activity in the mitochondrial
      matrix, mirroring animal/plant SSADH. The only direct S. pombe data (HTP YFP screen) show cytoplasmic/cytosolic
      signal, ssd2 has no obvious N-terminal presequence (MAPQFKRPEL...; inspection only), and the budding-yeast
      ortholog Uga2 is cytosolic.
    reason: Conflicts with the HTP cytosol localization and the cytosolic budding-yeast pathway, but this
      is a curator judgement used in the PomBase GO-CAM; dedicated localization (e.g. mitochondrial fractionation
      or endogenous tagging) is needed to resolve it rather than overruling the curator.
