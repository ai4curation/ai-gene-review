suggested_questions:
- question: Is S. pombe ssd2 cytosolic (as in the HTP screen and for budding-yeast Uga2) or in the mitochondrial
    matrix (as in the PomBase GO-CAM), and does this differ from its paralog ssd1?
suggested_experiments:
- hypothesis: ssd2 is a cytosolic NAD(P)+-dependent SSADH.
  description: Purify recombinant ssd2 and ssd1 and measure kcat/Km with NAD+ versus NADP+; localise endogenously
    tagged ssd2 relative to a mitochondrial matrix marker and test ssd1 ssd2 double deletion for growth
    on GABA as sole nitrogen source.
