  label: Schizosaccharomyces pombe 972h-
description: Succinate-semialdehyde dehydrogenase 2 of fission yeast, one of two paralogous aldehyde dehydrogenase-family
  enzymes (with ssd1) that oxidise succinate semialdehyde to succinate, the final step of gamma-aminobutyrate
  (GABA) degradation that feeds succinate into the TCA cycle. Its activity and cofactor use (NAD+ and/or
  NADP+) are inferred from the budding-yeast ortholog Uga2 rather than measured for the S. pombe protein.
  Fission yeast lacks glutamate decarboxylase, so ssd2 acts on GABA taken up from outside rather than
  in a complete glutamate-GABA shunt. A proteome-wide fluorescent-protein screen places it in the cytosol,
  whereas mitochondrial-matrix placement rests on inference from animal and plant SSADH enzymes.
