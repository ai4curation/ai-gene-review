  label: Schizosaccharomyces pombe 972h-
description: aco2 (mrpl49; SPBP4H10.15; UniProt Q9P7D4) encodes, through alternative polyadenylation,
  either a single aconitase-family domain or a fusion of that domain to the mitochondrial large-subunit
  ribosomal protein bL21m. The fusion is found in mitochondria, cytosol and nucleus. aco2 is essential,
  and its viability defect is complemented by the bL21m domain, which is needed for mitochondrial translation,
  not by the aconitase domain. By similarity to S. cerevisiae Aco2, a homocitrate dehydratase dedicated
  to lysine synthesis, the aconitase domain is assigned the cis-homoaconitate step of the alpha-aminoadipate
  pathway, but that role has not been tested in S. pombe.
