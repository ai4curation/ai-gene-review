  label: Schizosaccharomyces pombe 972h-
description: SPCC1259.09c (UniProt O94709; the fission yeast PDX1 ortholog) encodes pyruvate dehydrogenase
  protein X, the E3-binding protein. This catalytically inactive E2-like subunit tethers dihydrolipoyl
  dehydrogenase (dld1) to the E2 (lat1) core of the mitochondrial pyruvate dehydrogenase complex. Function
  is assigned by orthology; it is mitochondrial in a genome-wide screen.
