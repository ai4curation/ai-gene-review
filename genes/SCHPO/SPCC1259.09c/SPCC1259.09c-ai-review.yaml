  review:
    summary: 'PAINT inference: protein X (E3-binding protein) is a structural component that tethers E3
      to the E2 core.'
    action: ACCEPT
    reason: 'The by-similarity UniProt function note (ECO:0000250; orthology to S. cerevisiae Pdx1 and mammalian PDHX, not an S. pombe assay) describes a non-catalytic tethering role, anchoring E3 to the E2 core; the protein carries the peripheral subunit-binding domain (PROSITE-ProRule PRU01170) that mediates such binding. This supports a structural/scaffolding role for the PAINT term.'
    supported_by:
