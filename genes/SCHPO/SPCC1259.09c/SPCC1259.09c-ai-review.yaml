- term:
    id: GO:0016746
    label: acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004167
  - InterPro:IPR036625
  review:
    summary: InterPro mapping of acyltransferase activity from the peripheral-subunit-binding and E3-binding
      domains of this E2-like protein; protein X (E3-binding protein) is a noncatalytic structural
      subunit of the PDH complex, so the activity over-reaches.
    action: MARK_AS_OVER_ANNOTATED
    reason: Changed from KEEP_AS_NON_CORE, which would assert the activity is true. The mapping comes from
      InterPro PSBD (IPR004167) and E3-binding domain superfamily (IPR036625) entries, which are binding
      domains shared with the catalytic E2; the record lists no 2-oxoacid dehydrogenase acyltransferase
      catalytic domain (only Pfam Biotin_lipoyl). UniProt's by-similarity FUNCTION gives an anchoring
      (E3-tethering) role, and the PANTHER subfamily is protein X. In the characterised human ortholog,
      E3BP is described as the noncatalytic core component that tethers E3 (PMID:19240034). Evidence is by
      similarity and family membership; no S. pombe assay.
    supported_by:
    - reference_id: file:SCHPO/SPCC1259.09c/SPCC1259.09c-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Required for anchoring dihydrolipoamide dehydrogenase (E3) to the dihydrolipoamide
        transacetylase (E2) core of the pyruvate dehydrogenase complexes of eukaryotes.
    - reference_id: file:SCHPO/SPCC1259.09c/SPCC1259.09c-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR23151:SF82; PYRUVATE DEHYDROGENASE COMPLEX PROTEIN X COMPONENT, MITOCHONDRIAL; 1.'
    - reference_id: PMID:19240034
      supporting_text: a noncatalytic component, E3-binding protein (E3BP), which specifically tethers E3
        dimers to the PDC
