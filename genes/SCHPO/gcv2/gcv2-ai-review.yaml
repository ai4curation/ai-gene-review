  label: Schizosaccharomyces pombe 972h-
description: gcv2 (SPAC13G6.06c; UniProt Q09785) encodes the mitochondrial glycine dehydrogenase (decarboxylating),
  the pyridoxal 5'-phosphate-dependent P protein of the glycine cleavage system (EC 1.4.4.2). It decarboxylates
  glycine, releasing CO2, and transfers the remaining methylamine group to the lipoyl arm of the H protein
  (gcv3), which carries it to the T protein (gcv1). The system is a mitochondrial source of one-carbon
  units (5,10-methylene-THF). Localisation to mitochondria was seen in a genome-wide screen; catalytic
  function is assigned by orthology to S. cerevisiae GCV2 and the GcvP family.
