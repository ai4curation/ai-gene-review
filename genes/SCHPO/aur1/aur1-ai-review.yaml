  label: Schizosaccharomyces pombe 972h-
description: aur1 (SPAC3H8.06; UniProt Q10142) encodes the catalytic subunit of inositol phosphorylceramide
  (IPC) synthase, the Golgi enzyme that transfers phosphoinositol from PI to ceramide to make IPC, the
  first complex sphingolipid. It is the target of aureobasidin A. With the regulatory subunit Kei1 it
  forms the IPC synthase complex; IPC is then mannosylated to MIPC, the terminal sphingolipid of fission
  yeast, which lacks M(IP)2C.
