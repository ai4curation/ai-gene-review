  - reference_id: PMID:40668835
    supporting_text: Thus, we concluded that Aah1 and Aah3 act redundantly and are the two S. pombe
      α-amylase homologs important for vegetative cell growth.
  - reference_id: PMID:17496125
    supporting_text: The enzymes, designated AgtA and AgtB, produced new alpha-(1,4)-glycosidic bonds
      and therefore belong to the group of the 4-alpha-glucanotransferases (EC 2.4.1.25).
  - reference_id: PMID:16751704
    supporting_text: Biochemical analysis showed that Aah3p is an N-glycosylated, GPI-anchored
      membrane protein localized in the membrane and cell wall fractions.
  knowledge_gaps:
  - gap_statement: >-
      The catalytic activity of Aah3 is undetermined. It is not known whether Aah3 transfers
      alpha-1,4-linked segments (4-alpha-glucanotransferase, disproportionation), joins
      alpha-1,3-glucan chains through their alpha-1,4 linkers as the Ags1 GH13 domain is proposed
      to do, or acts on another linkage. Its donors, acceptors and product sizes are unknown, as is
      whether it acts on nascent Ags1 chains or on wall glucan.
    boundary: >-
      Established are the GPI anchor, the membrane and cell wall fractions, the in vivo
      requirement for Asp229 and Glu253, the absence of detectable alpha-amylase activity in S.
      pombe, the redundancy with Aah1 and non-redundancy with Ags1, and the loss of
      alpha-1,3-glucan and alpha-1,4 segments in aah1 aah3 walls.
    gap_kind:
    - BIOLOGY
    status: NARROWING
    significance: >-
      Aah1 and Aah3 are surface-exposed and conserved in alpha-glucan-producing fungi,
      including pathogens, and are proposed as antifungal targets; a defined activity is needed to
      design assays or inhibitors.
    resolution: >-
      Purify the Aah3 ectodomain, assay it on maltooligosaccharides, nigerooligosaccharides and
      S. pombe alpha-glucan, and analyse product linkages and chain lengths; compare to the
      D229A and E253A mutants.
    provenance:
    - reference_id: PMID:40668835
      supporting_text: Aah1 and Aah3 (light and dark green, respectively) may have the same enzymatic
        specificity as the Ags1 GH13 domain, but their unique spatial determinants could underlie
        their distinct functional requirement (step 2).
    - reference_id: PMID:40668835
      supporting_text: Another possibility is that Aah1 and Aah3 perform a disproportionation reaction
        downstream of Ags1 (step 3).
