- term:
    id: GO:0009277
    label: fungal-type cell wall
  evidence_type: IDA
  original_reference_id: PMID:12845604
  qualifier: is_active_in
  review:
    summary: >-
      PomBase cell wall annotation (2006) citing the de Groot et al. 2003 in silico GPI-protein
      screen. The experimental basis for a wall pool is the cell wall fractionation in Morita et
      al. 2006.
    action: ACCEPT
    reason: >-
      Morita et al. 2006 found Aah3 in the cell wall fraction as well as the membrane fraction.
      Like other fungal GPI proteins, part of the pool is likely transferred to, or retained in, the
      wall. The enzyme acts on wall alpha-glucan, and the wall is where the activity matters, so
      this is a core location alongside the external side of the plasma membrane. Fractionation
      cannot say whether the wall pool is covalently linked or only GPI-retained. The cited paper
      is a computational prediction, so the IDA code is questionable (same source defect as the
      plasma membrane row from this reference).
