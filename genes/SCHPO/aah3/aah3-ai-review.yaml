      direct assay on Aah3; see the source defect on those rows.
- id: PMID:16751704
  title: An alpha-amylase homologue, aah3, encodes a GPI-anchored membrane protein required
    for cell wall integrity and morphogenesis in Schizosaccharomyces pombe.
  findings:
  - statement: Aah3 is an N-glycosylated GPI-anchored protein in membrane and cell wall fractions.
