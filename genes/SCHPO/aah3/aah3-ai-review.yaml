- term:
    id: GO:0070600
    label: fungal-type cell wall (1->3)-alpha-glucan biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:40668835
  qualifier: involved_in
  review:
    summary: >-
      Solid-state NMR of intact aah1 aah3 cells shows that rigid-wall alpha-1,3-glucan falls
      from 44% to 11%, and mobile-phase alpha-glucan from 33% to 10%. The type-b alpha-1,3-glucan
      polymorph and the alpha-1,4-linked segments disappear.
    action: ACCEPT
    reason: >-
      This is the core process. The phenotype is seen only in the double mutant because Aah1
      and Aah3 are redundant. Aah3 overproduction rescues the double mutant, and the in vivo
      requirement for its catalytic residues argues that Aah3's own GH13 catalysis does part of the
      work of assembling alpha-glucan chains, rather than Aah3 being merely required for the
      process. Aah3 acts with, not instead of, the Ags1 synthase. Aah3 cannot replace the Ags1 GH13
      domain, aah3 and ags1-664 interact negatively, and the authors model Aah1 and Aah3 as
      transglycosylases that join or redistribute Ags1-made chains.
