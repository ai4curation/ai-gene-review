- id: PMID:12845604
  title: Genome-wide identification of fungal GPI proteins.
  findings:
  - statement: >-
      Genome-wide in silico screen for fungal GPI proteins using a GPI-attachment consensus,
      an N-terminal signal sequence and absence of internal TM segments; the source of the
      GPI-anchor prediction for Aah3.
    supporting_text: This consensus sequence, which recognized known GPI proteins from various fungi,
      was used to screen the genomes of the yeasts S. cerevisiae, C. albicans, Sz. pombe and the
      filamentous fungus N. crassa for putative GPI proteins.
  reference_review:
