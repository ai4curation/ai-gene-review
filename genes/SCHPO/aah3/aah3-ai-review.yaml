- term:
    id: GO:0004134
    label: 4-alpha-glucanotransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:2.4.1.25
  review:
    summary: >-
      EC2GO mapping from the UniProt EC 2.4.1.25 assignment, which UniProt itself transferred
      by similarity from A. niger AgtA (A2QTS4). Same claim as the ISS row below.
    action: ACCEPT
    reason: >-
      The EC number rests on a curated similarity transfer from AgtA, a GPI-anchored GH13
      protein purified and shown to be a 4-alpha-glucanotransferase (PMID:17496125). Aah3 is about
      40% identical to AgtA over its length (file:SCHPO/aah3/aah3-bioinformatics/RESULTS.md), shares
      the GPI-anchored architecture, lacks the catalytic histidine typical of hydrolytic
      alpha-amylases (as the Agt enzymes do), and needs its conserved GH13 Asp229 and Glu253 in vivo.
      The Jacob et al. 2025 authors draw the same inference. S. pombe alpha-glucan chains carry
      alpha-1,4-linked segments, and these disappear in aah1 aah3 cells, which fits an enzyme that
      cuts and re-forms alpha-1,4 bonds. The activity has not been assayed on Aah3, so this is an
      inference from a characterized member of the same GPI-anchored GH13 group, not a measurement.
      That distinguishes it from the Ghs2/Kre6 case, where no member of the family has ever been
      assayed. The row is accepted, and the missing enzymology is recorded as a knowledge gap.
    supported_by:
    - reference_id: PMID:17496125
      supporting_text: The enzymes, designated AgtA and AgtB, produced new alpha-(1,4)-glycosidic
        bonds and therefore belong to the group of the 4-alpha-glucanotransferases (EC 2.4.1.25).
    - reference_id: PMID:40668835
      supporting_text: This suggests that Aah1 and Aah3 belong in a subclass of GH13 enzymes like
        the Aspergillus niger GPI-anchored GH13 enzymes that do not hydrolyze but rather exhibit
        4-α-glucanotransferase (disproportionation) (30), moving glucan units between chains to
        adjust polymer length.
- term:
    id: GO:0004134
    label: 4-alpha-glucanotransferase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:A2QTS4
  review:
    summary: >-
      Curated similarity transfer from A. niger AgtA (A2QTS4), a GPI-anchored GH13 enzyme
      purified and shown to transfer alpha-1,4-glucan segments to maltooligosaccharide acceptors.
    action: ACCEPT
    reason: >-
      AgtA is a sound donor. It was purified, it transglycosylates alpha-1,4-glucan donors of
      at least five glucose units, and it also accepts alpha-1,3-linked nigerooligosaccharides,
      which bridges to the alpha-1,3-glucan of fungal walls. Aah3 is about 40% identical to AgtA
      and both are GPI-anchored, so the transfer is reasonable. They sit in different PANTHER
      subfamilies (SF224 and SF220), so this is a family-level transfer rather than a one-to-one
      ortholog. In S. pombe, the in vivo requirement for the GH13 catalytic acid/base pair, the lack
      of detectable hydrolase activity and the loss of alpha-1,4 segments in the double mutant all
      agree with transglycosylation. This is the best available molecular function term and is kept
      as core, with the caveat that the reaction, donor and acceptor have not been measured for
      Aah3.
    supported_by:
    - reference_id: PMID:17496125
      supporting_text: Both enzymes showed transglycosylation activity on donor substrates with
        alpha-(1,4)-glycosidic bonds and at least five anhydroglucose units.
    - reference_id: PMID:17496125
      supporting_text: Maltose and larger maltooligosaccharides were the most efficient acceptor
        substrates, although AgtA also used small nigerooligosaccharides containing
        alpha-(1,3)-glycosidic bonds as acceptor substrate.
    - reference_id: PMID:40668835
      supporting_text: GH13-domain enzymes commonly catalyze transglycosylation, and unlike
        hydrolases, Aah1 and Aah3 lack the active site histidine typically required for cleavage
        activity (30).
    - reference_id: PMID:16751704
      supporting_text: Expression of aah3 alleles in which the conserved aspartic acid and glutamic
        acid residues required for hydrolase activity were replaced with alanine residues failed to
        rescue the morphological and ascal wall defects of aah3Delta cells.
    - reference_id: file:SCHPO/aah3/aah3-bioinformatics/RESULTS.md
      supporting_text: Aah3 and Aah1 are each about 40% identical to AgtA over almost their full length
