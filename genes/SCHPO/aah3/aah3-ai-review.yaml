- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013777
  - InterPro:IPR015340
  review:
    summary: >-
      InterPro2GO mapping from the alpha-amylase-like and alpha-amylase C-terminal domain
      signatures to calcium ion binding.
    action: KEEP_AS_NON_CORE
    reason: >-
      GH13 alpha-amylase folds bind structural Ca2+ ions, and UniProt places two calcium sites
      in Aah3 by similarity to Aspergillus TAKA-amylase. This is plausible, but it is a structural
      cofactor property and not the function of the protein. It has not been tested for Aah3. Kept
      as non-core, consistent with the aah1 review.
    supported_by:
    - reference_id: file:SCHPO/aah3/aah3-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 2 calcium ions per subunit. Calcium is inhibitory at high concentrations.
