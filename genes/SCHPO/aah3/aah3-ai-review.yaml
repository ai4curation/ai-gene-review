id: Q9Y7S9
gene_symbol: aah3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  aah3 (SPCC63.02c) encodes a 564-residue glycosylphosphatidylinositol (GPI)-anchored
  glycoside hydrolase family 13 (GH13) alpha-amylase-like protein of fission yeast. It has an
  N-terminal signal peptide, a GH13 catalytic domain with the conserved nucleophile (Asp229) and
  proton donor (Glu253), a C-terminal alpha-amylase domain, and a C-terminal GPI-attachment
  signal. Aah3 is N-glycosylated and is found in both membrane and cell wall fractions, at the
  interface between the plasma membrane and the wall. No alpha-amylase (hydrolase) activity is
  detectable in S. pombe, and Aah3 lacks an active-site histidine typical of hydrolytic
  alpha-amylases. By homology to the GPI-anchored A. niger enzymes AgtA and AgtB, which are
  4-alpha-glucanotransferases, Aah3 is thought to be a transglycosylase that cuts and rejoins
  alpha-glucan chains; this activity has not been measured for Aah3 itself. Aah3 acts
  redundantly with its paralog Aah1 to build the cell wall alpha-1,3-glucan network. aah3
  deletion alone gives pear-shaped, cold-sensitive cells with walls that are hypersensitive to
  lytic enzymes and fragile asci. Cells lacking both aah1 and aah3 are spherical, fail to separate
  after cytokinesis, form clumps, and have thick, rigid walls with about four-fold less rigid
  alpha-1,3-glucan, no detectable alpha-1,4-linked glucan segments, less galactomannan, and a
  compensatory increase in beta-glucan that depends on the cell integrity pathway. The Asp229 and
  Glu253 catalytic residues are needed for Aah3 function in vivo. Aah3 works alongside, not in
  place of, the alpha-glucan synthase Ags1, whose own extracellular GH13 domain it cannot
  replace.
