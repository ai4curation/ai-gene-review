- id: PMID:17496125
  title: Two novel, putatively cell wall-associated and glycosylphosphatidylinositol-anchored
    alpha-glucanotransferase enzymes of Aspergillus niger.
  findings:
  - statement: >-
      Purified A. niger AgtA and AgtB, GPI-anchored GH13 proteins lacking conserved
      alpha-amylase residues, are 4-alpha-glucanotransferases (EC 2.4.1.25); AgtA also uses
      alpha-1,3-linked nigerooligosaccharides as acceptors. AgtA is the ISS donor for Aah3.
    supporting_text: The enzymes, designated AgtA and AgtB, produced new alpha-(1,4)-glycosidic bonds
      and therefore belong to the group of the 4-alpha-glucanotransferases (EC 2.4.1.25).
  - statement: >-
      AgtA/AgtB homologs occur in fungi with cell wall alpha-glucan and are absent from yeasts
      lacking it.
    supporting_text: Homologues of AgtA and AgtB are present in other fungal species with
      alpha-glucans in their cell walls, but not in yeast species lacking cell wall alpha-glucan.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. UniProt's EC 2.4.1.25 on A2QTS4 cites this paper with ECO:0000269. It is
      about A. niger, not S. pombe, and supports the activity of Aah3 only by homology.
- id: PMID:40668835
  title: α-glucan remodeling by GH13-domain enzymes shapes fungal cell wall architecture.
  findings:
  - statement: >-
      Aah1 and Aah3 are the two redundant GPI-anchored GH13 proteins needed for vegetative
      growth; aah2 and aah4 deletions add nothing, and mde5 was not tested (meiotic expression).
    supporting_text: Combining aah2∆ or aah4∆ with aah1∆ aah3∆ did not result in any further growth
      defects (SI Appendix, Fig. S1).
  - statement: >-
      aah3 single deletion is cold-sensitive and pear-shaped; aah1 aah3 cells are round and
      fail to separate after cytokinesis.
    supporting_text: The aah1∆, aah2∆, and aah4∆ cells grew like wildtype at all temperatures tested,
      and aah3∆ cells were cold-sensitive (SI Appendix, Fig. S1).
  - statement: >-
      Rigid-phase alpha-1,3-glucan falls from 44% to 11% in the double mutant (solid-state
      NMR of intact cells).
    supporting_text: Consequently, the overall α-1,3-glucan content declined markedly, from 44% in
      wildtype rigid cell walls to 11% in the aah1∆ aah3∆ mutant.
  - statement: >-
      Aah3 is not interchangeable with the Ags1 GH13 domain; the two kinds of GH13 enzyme are
      both required.
    supporting_text: We conclude that Aah1 and Aah3 enzymes are not functionally redundant with Ags1,
      and cells require both types of GH13 domain enzymes to support α-glucan chain assembly.
  - statement: >-
      The transglycosylase activity is inferred from the A. niger homologs and the missing
      catalytic histidine; no enzyme assay is reported.
    supporting_text: This suggests that Aah1 and Aah3 belong in a subclass of GH13 enzymes like the
      Aspergillus niger GPI-anchored GH13 enzymes that do not hydrolyze but rather exhibit
      4-α-glucanotransferase (disproportionation) (30), moving glucan units between chains to adjust
      polymer length.
  - statement: The compensatory beta-glucan increase depends on the cell integrity pathway.
    supporting_text: We found that pck2Δ aah1Δ aah3Δ and pmk1Δ aah1Δ aah3Δ combinations were
      synthetically lethal (SI Appendix, Fig. S4F).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC12305055). Genetics, TEM and solid-state NMR of intact cells; no in
      vitro enzymology. The activity is a proposal based on homology.
- id: file:SCHPO/aah3/aah3-bioinformatics/RESULTS.md
  title: Pairwise identity of Aah3, Aah1 and A. niger AgtA
  findings:
  - statement: >-
      Aah3 and Aah1 are each about 40% identical to AgtA and about 45% to each other, in
      different PANTHER subfamilies.
    supporting_text: Aah3 and Aah1 are each about 40% identical to AgtA over almost their full length
suggested_questions:
- question: >-
    What reaction does Aah3 catalyse on S. pombe alpha-glucan? Does it share the chain-joining
    specificity proposed for the Ags1 GH13 domain, or does it perform disproportionation
    downstream of Ags1?
- question: >-
    Is the cell wall pool of Aah3 covalently cross-linked to wall glucan after GPI-remnant
    transfer, as for some S. cerevisiae GPI proteins, or retained through the anchor, and which
    pool is catalytically relevant?
- question: >-
    Does the IMP ascospore wall biogenesis annotation (PMID:16751704) rest on a spore-wall
    phenotype, or on the ascal (ascus) wall fragility described in the abstract?
- question: >-
    Should PomBase's plasma membrane and cell wall IDA rows citing PMID:12845604, a
    computational GPI-protein prediction, carry a computational evidence code instead?
suggested_experiments:
- description: >-
    Express and purify the Aah3 ectodomain (and the D229A/E253A mutants) and assay
    transglycosylation and hydrolysis on maltooligosaccharides, nigerooligosaccharides and isolated
    S. pombe alpha-glucan, analysing product linkages and chain length by HPAEC and NMR.
  experiment_type: in vitro enzyme assay
- description: >-
    Measure alpha-glucan chain length (size-exclusion of alkali-extracted glucan) in wild type,
    aah1, aah3, aah1 aah3 and ags1-664 cells to test whether Aah1/Aah3 join ~120-residue chains
    into ~260-residue chains, as proposed for the Ags1 GH13 domain.
  experiment_type: cell wall biochemistry
- description: >-
    Image functional internally tagged Aah3 (preserving the GPI signal) together with Ags1, and
    test by GPI-signal swaps whether the GPI-anchored or the wall-bound pool is required for
    function.
  experiment_type: localization and genetic complementation
