    summary: ARBA machine-learning prediction of extracellular region.
    action: MODIFY
    reason: >-
      Aah3 is outside the cytoplasm, but it is not a free secreted protein. It is GPI-anchored
      and was found in membrane and cell wall fractions, and the 2025 authors describe it as
      surface-exposed at the membrane-cell wall interface. Its location is better described as the
      external side of the plasma membrane (the GPI-anchored pool) and the fungal-type cell wall,
      which the gene already carries by IDA. GO no longer has the anchored component terms, so
      external side of plasma membrane is the right term for the GPI-anchored pool.
