taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ura2 (SPAC16.03c) encodes the monofunctional dihydroorotase (EC 3.5.2.3) of fission yeast, a zinc-dependent
  class II DHOase of the metallo-dependent hydrolase superfamily that reversibly cyclises N-carbamoyl-L-aspartate
  to (S)-dihydroorotate, the third step of de novo UMP synthesis. It is the ortholog of S. cerevisiae URA4 (not
  of budding-yeast URA2), and it supplies the activity missing from the defective DHOase-like domain of the ura1
  CPSase-ATCase protein. ura2 deletion mutants are uracil auxotrophs. The enzyme is cytoplasmic.
