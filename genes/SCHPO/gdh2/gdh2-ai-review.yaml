taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: gdh2 (SPCC132.04c; UniProt Q9USN5) encodes the NAD-specific glutamate dehydrogenase (EC 1.4.1.2),
  the large fungal type of GDH. It oxidatively deaminates glutamate to 2-oxoglutarate and ammonium, the
  catabolic counterpart of NADP-GDH (gdh1), releasing nitrogen from glutamate when cells grow on poor
  nitrogen sources. NAD-GDH activity has been measured in S. pombe, and the gene is assigned by orthology
  to S. cerevisiae GDH2.
