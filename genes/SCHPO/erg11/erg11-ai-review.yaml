taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: erg11 (SPAC13A11.02c; also called cyp51/cyp1) encodes the essential sterol 14alpha-demethylase (CYP51,
  EC 1.14.14.154) of Schizosaccharomyces pombe, a heme-thiolate cytochrome P450 anchored in the ER membrane by an
  N-terminal helix. Using O2 and electrons from NADPH-cytochrome P450 reductase, it removes the 14alpha-methyl group
  of lanosterol in three oxidations (releasing formate), producing the Delta14 sterol that Erg24 reduces next. Its
  activity depends on the heme-binding protein Dap1, which binds Erg11 and positively regulates it. Erg11 is distributed
  through the cortical ER and nuclear envelope, is the target of azole antifungals, and is induced by the Sre1 SREBP
  pathway under low sterol/low oxygen.
