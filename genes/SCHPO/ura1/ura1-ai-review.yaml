taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: ura1 (SPAC22G7.06c) encodes the fission yeast pyrimidine-specific multifunctional GLNase/CPSase-ATCase
  protein (2244 aa), the ortholog of S. cerevisiae URA2 and of the CPSase/ATCase portions of animal CAD. A glutamine
  amidotransferase domain hydrolyses glutamine to ammonia, which the carbamoyl-phosphate synthetase domain combines
  with bicarbonate and ATP to form carbamoyl phosphate (glutamine-dependent CPSase P, EC 6.3.5.5); the C-terminal
  aspartate transcarbamoylase domain then condenses carbamoyl phosphate with L-aspartate to N-carbamoyl-L-aspartate
  (EC 2.1.3.2). These are the first two steps of de novo UMP synthesis, and both activities are feedback-inhibited
  by UTP. As in budding yeast, the protein retains a dihydroorotase-like domain that is catalytically defective;
  dihydroorotase is provided by the separate ura2 gene. ura1 is cytoplasmic, and its carbamoyl phosphate is channelled
  to pyrimidine synthesis, separately from the mitochondrial arginine-specific CPSase A (arg5/arg4). Note that S.
  pombe ura1 is not the ortholog of S. cerevisiae URA1 (dihydroorotate dehydrogenase).
