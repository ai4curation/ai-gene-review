  supporting_entities:
  - SGD:S000003666
  review:
    summary: GMP synthase (glutamine-hydrolyzing) activity attached to Lollier et al. 1995, with S. cerevisiae URA2
      (SGD:S000003666) in WITH. The paper characterises ura1 as the GLNase/CPSase-ATCase of pyrimidine synthesis
      by complementation of S. cerevisiae ura2 mutants; it says nothing about GMP synthesis, and S. pombe GMP synthase
      is a different, unrelated protein. This is almost certainly a term-selection slip for the glutamine-hydrolyzing
      carbamoyl-phosphate synthase activity, which is also annotated from the same paper with the same WITH entity.
    action: MODIFY
    reason: Wrong glutamine-hydrolyzing synthase chosen; the evidence supports carbamoyl-phosphate synthase (glutamine-hydrolyzing)
      activity (GO:0004088), not GMP synthase.
    proposed_replacement_terms:
    - id: GO:0004088
      label: carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity
