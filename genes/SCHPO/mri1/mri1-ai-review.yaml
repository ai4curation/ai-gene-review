  label: Schizosaccharomyces pombe 972h-
description: mri1 (SPBC23E6.10c; UniProt O60185) encodes methylthioribose-1-phosphate isomerase (EC 5.3.1.23).
  It converts 5-methylthioribose-1-phosphate to 5-methylthioribulose-1-phosphate, the second step of the
  MTA cycle that regenerates methionine from methylthioadenosine. Function is assigned by orthology to
  S. cerevisiae MRI1; a genome-wide screen places it in the cytosol.
