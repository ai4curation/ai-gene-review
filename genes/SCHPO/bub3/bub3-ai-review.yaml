      reference_section_type: RESULTS
- term:
    id: GO:0140499
    label: negative regulation of mitotic spindle assembly checkpoint signaling
  evidence_type: IMP
  original_reference_id: PMID:28017606
  qualifier: involved_in
  review:
    summary: >-
      Yuan et al. built a synthetic checkpoint (SynCheck) from TetR-Spc7 and TetR-Mph1 and
      showed that bub3 deletion advances the timing of the synthetic arrest by about 4 h with
      Spc7-9TE, allows even the non-phosphorylatable Spc7-9TA scaffold to arrest cells, increases
