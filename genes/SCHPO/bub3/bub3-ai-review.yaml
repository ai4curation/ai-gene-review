      is the honest summary and is accepted alongside the direct-participation SAC rows.
    supported_by:
    - reference_id: PMID:22660415
      supporting_text: >-
        This phosphorylation promotes the in vitro binding to the Bub1-Bub3 complex, which is
        required for kinetochore-based SAC activation (Mad1-Mad2-Mad3 localization) and
