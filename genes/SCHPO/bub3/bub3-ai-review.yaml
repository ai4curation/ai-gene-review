- id: PMID:11909965
  title: Fission yeast Mad3p is required for Mad2p to inhibit the anaphase-promoting
    complex and localizes to kinetochores in a Bub1p-, Bub3p-, and Mph1p-dependent
    manner.
  findings:
  - statement: >-
      Mad3p co-immunoprecipitates Bub3p, Mad2p and Slp1/Cdc20p, placing Bub3 in the fission
      yeast checkpoint effector assembly.
    supporting_text: >-
      Mad3p coimmunoprecipitates Bub3p, Mad2p, and the spindle checkpoint effector Slp1/Cdc20p.
    reference_section_type: ABSTRACT
  - statement: >-
      Bub3p is not required for the metaphase arrest caused by Mad2p overexpression, whereas
      Mad3p is.
    supporting_text: >-
      Mad1p, Bub1p, and Bub3p are not required for this arrest.
    reference_section_type: ABSTRACT
  - statement: >-
      Mad3-GFP kinetochore localization depends on Bub1p, Bub3p and Mph1p but not on Mad1p or
      Mad2p.
    supporting_text: >-
      We find Mad3-GFP kinetochore localization to be dependent upon Bub1p, Bub3p, and the Mph1p
      kinase, but not upon Mad1p or Mad2p.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract and discussion only in the cache (full_text_available false); title and PMID
      match. Supports the Mad3-Bub3 interaction and the Bub3-dependence of Mad3 kinetochore
      recruitment; the Bub3 localization figure underlying the PomBase IDA is in the full text.
- id: PMID:15509783
  title: Kinetochore targeting of fission yeast Mad and Bub proteins is essential
    for spindle checkpoint function but not for all chromosome segregation roles of
    Bub1p.
  findings:
  - statement: >-
      Primary characterization of S. pombe Bub3p; Bub3 and the other checkpoint proteins
      associate with the central domain of centromeres by ChIP.
    supporting_text: >-
      We demonstrate by chromatin immunoprecipitation that they all interact with the central
      domain of centromeres, consistent with their role in monitoring kinetochore-microtubule
      interactions.
    reference_section_type: ABSTRACT
  - statement: >-
      Bub1p and Bub3p are mutually dependent, and Mad-independent, for kinetochore localization.
    supporting_text: >-
      Bub1p and Bub3p are dependent upon one another, but independent of the Mad proteins, for
      their kinetochore localization.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache; title and PMID match. The paper's early conclusion that Bub3
      is required for the checkpoint was based on indirect assays and was later revised by
      direct live-cell assays (PMID:19680287), but the localization and interaction findings
      used here stand.
- id: PMID:19680287
  title: Bub1 and Bub3 promote the conversion from monopolar to bipolar chromosome
    attachment independently of shugoshin.
  findings:
  - statement: >-
      Direct live-cell SAC assay shows that Bub3, unlike Bub1, is not essential for the fission
      yeast SAC.
    supporting_text: >-
      We find that Bub3, unlike its binding partner Bub1, is not essential for the SAC in
      fission yeast.
    reference_section_type: ABSTRACT
  - statement: >-
      The residual mitotic delay in nda3 bub3 cells is Mad2-dependent, so the SAC is active
      without Bub3.
    supporting_text: >-
      However, the additional deletion of mad2 in nda3-KM311 bub3Δ cells considerably shortened
      mitosis (Fig 1A), indicating that the SAC had been active in nda3-KM311 bub3Δ cells and
      that Bub3 was not essential for progression into anaphase.
    reference_section_type: RESULTS
  - statement: >-
      Bub3 with Bub1 promotes the conversion of mono-oriented chromosomes to bi-orientation,
      independently of Sgo2.
    supporting_text: >-
      Instead, Bub3, together with Bub1, has a specific function in promoting the conversion
      from chromosome mono-orientation to bi-orientation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; title and PMID match. Source of both PomBase IMP process rows and of the
      key qualification that Bub3 is non-essential for arrest in fission yeast.
- id: PMID:22521786
  title: Phosphodependent recruitment of Bub1 and Bub3 to Spc7/KNL1 by Mph1 kinase
    maintains the spindle checkpoint.
  findings:
  - statement: >-
      Mph1 phosphorylation of Spc7 MELT motifs recruits the Bub1-Bub3 complex to kinetochores;
      phospho-mimetic Spc7 bypasses Mph1 but not Bub3.
    supporting_text: >-
      The phospho-mimetic spc7-9TE mutant therefore bypasses the requirement for Mph1 kinase
      activity to load Bub1 to kinetochores, but Bub1 loading still requires the presence of
      Bub3 (Figure 3A).
    reference_section_type: RESULTS
  - statement: >-
      Undocked Bub1-Bub3 acts as a dominant-negative factor for SAC maintenance; deleting bub3
      rescues the spc7-9TA maintenance defect.
    supporting_text: >-
      Surprisingly, when spc7-9TA was combined with Δbub3 the SAC response was much improved,
      although this did not suppress the chromosome mis-segregation defects of spc7-9TA (Figure
      4D; data not shown).
    reference_section_type: RESULTS
  - statement: >-
      Enhanced Bub1-Bub3 recruitment to Spc7 accelerates checkpoint silencing in a
      Bub3-dependent manner.
    supporting_text: >-
      Importantly, the rapid appearance of Nsk1 on spindle poles in spc7-9TE cells is completely
      abolished in the absence of Bub3 (Figure 4E).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; title and PMID match. The central mechanistic paper for fission yeast
      Bub3 recruitment and for its roles in SAC maintenance and silencing.
