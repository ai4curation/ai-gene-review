- term:
    id: GO:1990758
    label: mitotic sister chromatid biorientation
  evidence_type: IMP
  original_reference_id: PMID:19680287
  qualifier: involved_in
  review:
    summary: >-
      Windecker et al. followed all three chromosomes by live imaging after microtubule
      depolymerization and regrowth: bub3 cells showed mono-oriented chromosomes more often (20
      percent versus 7 percent of chromosomes) and these became bi-oriented only after a long
      delay, if at all; a bub1-dGLEBS allele that cannot bind Bub3 phenocopied this, Sgo2 still
      localized to centromeres in both mutants, and sgo2 bub3 double mutants behaved like bub3,
      so Bub1 and Bub3 promote the mono- to bi-orientation conversion independently of
      shugoshin. Full text is cached.
    action: ACCEPT
    reason: >-
      Direct, well-controlled loss-of-function evidence in the target organism. The authors
      argue that kinetochore-bound Bub1-Bub3 modulates kinetochore-microtubule interactions at
      the mono-oriented chromosome (Bub3 stays on mono-oriented kinetochores until bi-orientation
      is reached), so Bub3 is a participant in the attachment step rather than merely a
      checkpoint delay that gives time for correction; indeed the SAC remains active in bub3
      cells, which separates this role from checkpoint signaling.
    supported_by:
    - reference_id: PMID:19680287
      supporting_text: >-
        Instead, Bub3, together with Bub1, has a specific function in promoting the conversion
        from chromosome mono-orientation to bi-orientation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:19680287
      supporting_text: >-
