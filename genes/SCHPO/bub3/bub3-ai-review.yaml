    action: ACCEPT
    reason: >-
      The generic "regulation" term is a deliberate curator choice that fits the dual role
      documented for fission yeast Bub3: it promotes kinetochore-based checkpoint activation by
      delivering Bub1 to phospho-Spc7, yet restrains Bub1 signaling when the complex is not
      docked. Yuan et al. later confirmed the inhibitory arm (bub3 deletion advances synthetic
