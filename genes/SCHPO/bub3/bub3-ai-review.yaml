  review:
    summary: >-
      PAINT inference of the defining function of the Bub3 family, placed at node PTN000103865
      and seeded by experimental annotations in budding yeast, fly, worm and Arabidopsis. In
      fission yeast Bub3 is the phospho-Spc7 reader that recruits Bub1 and, downstream, Mad3 and
      Mad1-Mad2 to kinetochores, and mutation of its docking sites on Spc7 causes a defect in
      maintaining the checkpoint. Unusually, bub3 deletion itself does not abolish the arrest
      because a kinetochore-independent Spc7-Mph1-Bub1-Mad1 pool can still signal.
    action: ACCEPT
    reason: >-
      The core biological process of Bub3 and a sound node placement: every characterized
      eukaryotic Bub3 orthologue functions in the SAC. The fission yeast peculiarity is that
      Bub3 is a participant that is not absolutely required for arrest, not that it is
      uninvolved; Windecker et al. explicitly conclude that Bub3 remains intimately linked to
      the SAC and contributes to signaling in a non-essential manner, and the S. pombe GO-CAM
      (gomodel:67369e7600002505) places bub3 in this process at the kinetochore.
    supported_by:
    - reference_id: PMID:22521786
      supporting_text: >-
        Although Bub3 is not critical for SAC arrest in S.pombe [30, 41, 48], disruption of the
        binding sites for the Bub1-Bub3 complex on Spc7 causes a defect in maintenance of the
        SAC signal.
      reference_section_type: DISCUSSION
    - reference_id: PMID:19680287
      supporting_text: >-
        It also indicates that fission yeast Bub3 remains intimately linked to the SAC and we
        hypothesize that, even in fission yeast, Bub3 contributes to SAC signalling but not in
        an essential manner.
      reference_section_type: RESULTS
    - reference_id: PMID:26882497
      supporting_text: >-
        structural studies have shown that it is Bub3 that binds directly to the MELT motifs
        after they are phosphorylated by Mps1Mph1 [43,44]
      reference_section_type: INTRODUCTION
