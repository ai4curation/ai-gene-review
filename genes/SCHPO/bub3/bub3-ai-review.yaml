        chromosomes; Fig 3C) and, crucially, mono-oriented chromosomes in bub3Δ cells only became
        bi-oriented after a considerable delay, if at all (Fig 3B,D; supplementary Fig S4B–D
        online).
      reference_section_type: RESULTS
    - reference_id: PMID:19680287
      supporting_text: >-
        However, unlike in cells lacking Bub1, Sgo2 still localized to the centromeres in the
        bub3Δ or bub1-ΔGLEBS mutants (Fig 3E; supplementary information online, note 5).
