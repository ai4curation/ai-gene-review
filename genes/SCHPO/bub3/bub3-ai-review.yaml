    action: ACCEPT
    reason: >-
      Direct loss-of-function evidence, in the target organism, that Bub3 restrains checkpoint
      signal generation when the Bub1-Bub3 complex is not productively engaged with phospho-Spc7.
      This is the molecular counterpart of the earlier observation that removing Bub3 rescues
      the SAC-maintenance defect of spc7-9TA (PMID:22521786). Bub3 does the work here through
      its binding to Bub1 (proposed to limit Bub1 autophosphorylation and Mad1 binding), so the
      negative-regulation term is appropriate and complements, rather than contradicts, the
      SAC signaling rows.
    supported_by:
    - reference_id: PMID:28017606
      supporting_text: >-
        Analysis of bub3Δ mutants demonstrates that Bub3 acts to suppress premature checkpoint
        signaling.
      reference_section_type: ABSTRACT
    - reference_id: PMID:28017606
      supporting_text: >-
        Deletion of bub3 even allowed TetR-Spc7-9TA, TetR-Δ(1-302)Mph1 to arrest cells, again
        demonstrating the inhibitory effect of Bub3 (Figure 4D).
      reference_section_type: RESULTS
    - reference_id: PMID:28017606
      supporting_text: >-
