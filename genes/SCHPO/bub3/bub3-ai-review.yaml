- term:
    id: GO:1990942
    label: mitotic metaphase chromosome recapture
  evidence_type: IMP
  original_reference_id: PMID:19680287
  qualifier: involved_in
  review:
    summary: >-
      Second PomBase annotation from Windecker et al. The recapture term covers the retrieval of
      "lost" chromosomes to a spindle pole and their subsequent migration along polar
      microtubules to the metaphase plate. After MBC washout, bub3 chromosomes are retrieved to
      a pole (they become mono-oriented) but then fail to move toward the opposing pole and
      bi-orient; the authors conclude that this later step, moving chromosomes closer to the
      opposing spindle pole body, depends on Bub3 and Bub1, and that Bub3 loss is most damaging
      when kinetochores have become unclustered from the poles. Full text is cached.
    action: ACCEPT
    reason: >-
      The assay is precisely a lost-chromosome recapture experiment and the Bub3-dependent step
      (migration of a pole-proximal mono-oriented chromosome to the spindle centre) is the
      second half of the term's definition. The mono- to bi-orientation conversion is largely
      the same finding as the biorientation row, so the two rows are complementary views of one
      phenotype rather than independent functions; the recapture term adds the context in which
      Bub3 matters (chromosomes detached from the spindle).
    supported_by:
    - reference_id: PMID:19680287
      supporting_text: >-
        Bi-orientation, therefore, needs a mechanism to move chromosomes closer to the opposing
        SPB, which depends on Bub3 and Bub1 (Fig 4A; supplementary information online, note 7).
      reference_section_type: RESULTS
    - reference_id: PMID:19680287
      supporting_text: >-
        This led to a strong increase in chromosome mis-segregation in cells lacking Bub3 (Fig
        2B), which indicates that Bub3 is more important for correct kinetochore–microtubule
        attachment in a situation in which kinetochores become unclustered from the SPBs.
      reference_section_type: RESULTS
core_functions:
- description: >-
    Phospho-MELT reader and kinetochore adaptor: in the constitutive Bub1-Bub3 complex, the
    Bub3 WD40 propeller binds Mph1-phosphorylated MELT motifs of Spc7/Knl1 while holding the
    Bub1 GLEBS motif, docking Bub1 at unattached kinetochores; kinetochore Bub1-Bub3 is then
    required for efficient recruitment of Mad3 and the Mad1-Mad2 complex, so Bub3 converts
    Mph1 kinetochore phosphorylation into assembly of the checkpoint signaling platform and, once
    attachments are made, its Spc7-docked form promotes checkpoint silencing. In fission yeast
    this activity strengthens and spatially organizes the checkpoint but is not essential for
    arrest.
