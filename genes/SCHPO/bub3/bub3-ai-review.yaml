suggested_questions:
- question: >-
    Is fission yeast Bub3 a bona fide subunit of the Mad3-Mad2-Slp1 mitotic checkpoint complex
    that binds the APC/C, given that Mad3p co-immunoprecipitates Bub3p with Mad2p and Slp1 yet
    Bub3 is dispensable for Mad2-overexpression arrest and for Mad2/Mad3 association with the
    APC/C, and the fission yeast MCC crystal structure lacks it? PomBase has not annotated bub3
    to GO:0033597, and a direct test would settle whether the S. cerevisiae- and human-style MCC
    membership applies here.
- question: >-
    By what mechanism does the undocked Bub1-Bub3 complex restrain Bub1: does Bub3 binding
    sterically limit Bub1 autophosphorylation of the Mad1-binding CD1 motif, or does it prevent
    Mph1 access, and is this restraint relieved by a conformational change upon phospho-Spc7
    binding as proposed by Yuan et al.?
- question: >-
    How does kinetochore-bound Bub1-Bub3 promote movement of a pole-proximal mono-oriented
    chromosome toward the opposing pole: through Bub1 kinase activity, through recruitment of a
    motor or microtubule regulator, or through Ark1/Sgo2-independent modulation of Ndc80-Dam1
    attachment dynamics?
suggested_experiments:
- description: >-
    Quantitative in vitro reconstitution with purified S. pombe Bub3, Bub1 GLEBS fragment and
    Mph1-phosphorylated Spc7 MELT peptides (binding affinities with and without Bub1), combined
    with structure-guided Bub3 propeller-side mutants introduced at the endogenous locus and
    assayed for Bub1 kinetochore recruitment, SAC maintenance in nda3-KM311 and chromosome
    bi-orientation after MBC washout.
  hypothesis: >-
    A single phospho-MELT-binding surface on Bub3 accounts for Bub1 kinetochore delivery, SAC
    maintenance and the mono- to bi-orientation function, so separation-of-function alleles will
    not exist for these three roles but will exist for the nucleoplasmic restraint of Bub1.
- description: >-
    Affinity purification of Slp1 or of the APC/C from nda3-KM311-arrested wild-type and bub3
    cells, with quantitative mass spectrometry of Mad3, Mad2 and Bub3 stoichiometry, and in vitro
    APC/C-Slp1 ubiquitination assays comparing Mad3-Bub3 heterodimer with Mad3 alone.
  hypothesis: >-
    Fission yeast Bub3 co-purifies with Mad3 in APC/C-bound complexes but is not required for
    Mad3-Mad2 inhibition of APC/C-Slp1, explaining why bub3 cells retain a Mad2-dependent arrest.
