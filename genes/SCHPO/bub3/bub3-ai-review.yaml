- term:
    id: GO:0043130
    label: ubiquitin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000103837
  - SGD:S000005552
  review:
    summary: >-
      PAINT inference from node PTN000103837 (the Bub3/Rae1 WD40 ancestor), seeded by a single
      S. cerevisiae IDA (SGD S000005552; PMID:21070969) in which Pashkova et al. defined a large
      subset of WD40 beta-propellers as ubiquitin-binding domains whose conserved top surface
      binds the ubiquitin I44 hydrophobic patch. The cached full text of that paper does not
      mention Bub3 by name; the SGD curator drew on the propeller survey figure. No
      ubiquitin-binding activity has been tested for fission yeast Bub3.
    action: KEEP_AS_NON_CORE
    reason: >-
      The inference is phylogenetically reasonable, since the ubiquitin-binding top face is a
      conserved structural property of this propeller family, but the same top face of Bub3 is
      occupied by the Bub1 or Mad3 GLEBS motif in vivo, and no physiological role for ubiquitin
      binding by Bub3 has been described in any organism, let alone in the fission yeast
      checkpoint. Retained as a plausible in vitro biochemical property that is not part of
      Bub3's phospho-MELT-reader / Bub1-Bub3 scaffold function, matching the call made for the
      budding yeast and human orthologues in this repository.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000103837
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Ancestral Bub3/Rae1 WD40 node; the descendant evidence is the in vitro ubiquitin
          binding survey of yeast WD40 propellers (PMID:21070969) with no checkpoint functional
          context and no test in S. pombe.
    supported_by:
    - reference_id: PMID:21070969
      supporting_text: >-
        We define a large subset of WD40 β-propellers as a class of ubiquitin-binding domains.
      reference_section_type: ABSTRACT
    - reference_id: PMID:17227844
      supporting_text: >-
        The Gle2-binding-sequence (GLEBS) motifs found in Mad3 and Bub1 are necessary and
        sufficient for interaction with Bub3.
      reference_section_type: ABSTRACT
- term:
    id: GO:0090266
    label: regulation of mitotic cell cycle spindle assembly checkpoint
  evidence_type: EXP
  original_reference_id: PMID:22660415
  qualifier: involved_in
  review:
    summary: >-
      PomBase annotation from Yamagishi et al., who showed that Mph1-phosphorylated Spc7 MELT
      repeats recruit the Bub1-Bub3 complex, which is required for kinetochore-based SAC
      activation, and (per the UniProt function line derived from the same paper) that Bub3
