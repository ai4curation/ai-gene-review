suggested_questions:
- question: >-
    Has S. pombe Mgr2 been directly localized or affinity-purified with the
    fission-yeast Tim23/Tim17/Tim21 translocase, and does a C-terminal tag
    perturb its conserved mitochondrial targeting or assembly?
  experts: []
suggested_experiments:
- hypothesis: >-
    S. pombe Mgr2 is a two-pass inner-membrane TIM23 subunit that gates
    presequence substrate sorting analogously to budding-yeast Mgr2.
  description: >-
    Endogenously tag S. pombe Mgr2 at a position predicted not to disrupt its
    termini, test co-purification with Tim23 and Tim21 from digitonin-solubilized
    mitochondria, and compare import of matrix-destined and stop-transfer
    precursors in wild type and mgr2 mutants.
knowledge_gaps:
- gap_statement: >-
    S. pombe mgr2 lacks direct biochemical evidence for an elemental molecular
    function beyond its conserved TIM23-complex routing role.
  boundary: >-
    Budding-yeast Mgr2 and human ROMO1 establish conserved TIM23-complex
    participation, but no S. pombe paper was found and the current ontology
    does not capture a precise Mgr2 gatekeeper activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
