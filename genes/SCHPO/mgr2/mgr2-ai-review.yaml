- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the
    fission yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      A proteome-scale S. pombe C-terminal YFP screen reported cytoplasmic
      localization for mgr2, but the abstract-level cache does not expose the
      specific image needed to resolve its conflict with conserved TIM23
      biology.
    supporting_text: >-
      we determined the localization of 4,431 proteins, corresponding to
      approximately 90% of the fission yeast proteome, by tagging each ORF with
      the yellow fluorescent protein
- id: PMID:22613836
  title: Mgr2 promotes coupling of the mitochondrial presequence translocase to
    partner complexes.
  findings:
  - statement: >-
      Budding-yeast Mgr2 is an integral inner-membrane TIM23 complex subunit
      needed to recruit Tim21 and respiratory-chain complexes to TIM23CORE and
      to efficiently couple TOM to TIM23 for preprotein import.
    supporting_text: >-
      We conclude that Mgr2 is a coupling factor of the presequence
      translocase crucial for cell growth at elevated temperature and for
      efficient protein import.
- id: PMID:25454944
  title: Mgr2 functions as lateral gatekeeper for preprotein sorting in the
    mitochondrial inner membrane.
  findings:
  - statement: >-
      Budding-yeast Mgr2 controls lateral release of TIM23 substrates into the
      inner membrane and prevents defective inner-membrane sorting signals from
      being released prematurely.
    supporting_text: >-
      We conclude that Mgr2 functions as a lateral gatekeeper of the
      mitochondrial presequence translocase, providing quality control for the
      membrane sorting of preproteins.
- id: PMID:32186971
  title: Mgr2 regulates mitochondrial preprotein import by associating with
    channel-forming Tim23 subunit.
  findings:
  - statement: >-
      Budding-yeast Mgr2 directly associates with Tim23 and Tim21, and both
      Mgr2 transmembrane regions are needed for lateral sorting of preproteins
      into the inner membrane.
    supporting_text: >-
      Present findings provide insights into a direct association of Mgr2 with
      the channel-forming Tim23 subunit.
- id: PMID:30598479
  title: ROMO1 is a constituent of the human presequence translocase required
    for YME1L protease import.
  findings:
  - statement: >-
      Human ROMO1 is a conserved Mgr2-family TIM23 subunit that links TIM21
      dynamics to respiratory-chain biogenesis and is selectively required for
      efficient import of YME1L, but ROMO1 is dispensable for the
      inner-membrane sorting function carried by fungal Mgr2.
    supporting_text: >-
      in human mitochondria, a loss of ROMO1 does not affect matrix transport
      or, in contrast to yeast, inner membrane sorting
