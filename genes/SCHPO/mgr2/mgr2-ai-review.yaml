- description: >-
    Conserved Mgr2/Romo1-family membrane subunit of the mitochondrial TIM23
    presequence translocase, contributing to TIM23SORT assembly and to the
    routing of imported preproteins between full translocation into the matrix
    and lateral insertion into the inner membrane.
  supported_by:
  - reference_id: PMID:22613836
    supporting_text: >-
      Mgr2 was required for binding of Tim21 to TIM23(CORE), revealing a
      binding chain of TIM23(CORE)-Mgr2/Tim21-respiratory chain.
  - reference_id: PMID:25454944
    reference_section_type: ABSTRACT
    supporting_text: >-
