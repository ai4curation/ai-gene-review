  review:
    summary: >-
      PomBase correctly records that no elemental S. pombe molecular function
      has been characterized for Mgr2.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      Retain the MF root ND row. The conserved biology supports TIM23-complex
      membership and a gatekeeper role in routing preproteins, but neither the
      accessible literature nor current GO supplies a defensible elemental
      molecular_function term for Mgr2 itself. No direct S. pombe mgr2 paper
      was found in searches for mgr2, SPBC27.06c, and P79082.
    additional_reference_ids:
