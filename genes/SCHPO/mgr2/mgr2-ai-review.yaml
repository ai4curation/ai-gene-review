id: P79082
gene_symbol: mgr2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  mgr2 encodes a predicted two-pass Mgr2/Romo1-family subunit of the
  mitochondrial inner-membrane TIM23 presequence translocase. By homology to
  budding-yeast Mgr2 and metazoan ROMO1, S. pombe Mgr2 is inferred to assemble
  with Tim23/Tim17/Tim21 at the TIM23 core, where it gates presequence traffic
  between complete import into the mitochondrial matrix and lateral release of
  stop-transfer substrates into the inner membrane.
