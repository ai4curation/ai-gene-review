- id: PMID:29959064
  title: Dihydrodipicolinate synthase is absent in fungi.
  findings:
  - statement: Direct characterization of alleged fungal DHDPS candidates supports the alpha-aminoadipate
      rather than DAP lysine route in fungi.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly reports biochemical and complementation tests in Coccidioides and
      Fonsecaea. Used as comparative pathway evidence, not a direct assay of yeast Hom2.
- id: url:https://www.nature.com/articles/srep21067
  title: Structural Insights into the Tetrameric State of Aspartate-β-semialdehyde Dehydrogenases from
    Fungal Species
  findings:
  - statement: Fungal ASADH forms a functional tetramer organized as a dimer of dimers; Trichophyton interface
      mutants link assembly with catalysis.
    supporting_text: The tetrameric organization of trASADH can best be described as “a dimer-of-dimers”
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher text fetched normally after PMID fetch returned HTTP429. Trichophyton
      is the detailed structural/functional target; yeast and pombe sequence comparisons support family
      inference rather than native pombe kinetics.
- id: PMID:31784357
  title: Native Chromatin Proteomics Reveals a Role for Specific Nucleoporins in Heterochromatin Organization
    and Maintenance.
  findings:
  - statement: Native fission-yeast chromatin proteomics provides a lead for metabolic-protein chromatin
      association; no direct silencing mechanism is assigned to this enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full main text reviewed. The specific Hom3/Hom2/Hom6 hits cited by PMID39349514 require
      target-level supplementary confirmation, so no new chromatin annotation is proposed.
