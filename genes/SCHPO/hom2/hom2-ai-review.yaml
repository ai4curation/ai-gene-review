- term:
    id: GO:0051287
    label: NAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000534
  review:
    summary: InterPro2GO mapping of the generic semialdehyde dehydrogenase NAD-binding domain (IPR000534)
      to NAD binding. The characterised fungal enzyme and the UniProt reaction use NADP(H), so the NAD
      assignment is driven by the domain name rather than by evidence.
    action: MODIFY
    reason: The IPR000534 dinucleotide-binding domain identifies a Rossmann-type fold, but does not by
      itself distinguish NAD from NADP. The curated hom2 reaction and the characterized fungal ASADH mechanism
      support NADP(H). Modify to NADP binding on that positive specificity evidence; no claim is made
      that NAD cannot bind at any concentration.
    supported_by:
    - reference_id: file:SCHPO/hom2/hom2-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=L-aspartate 4-semialdehyde + phosphate + NADP(+) = 4-phospho-
