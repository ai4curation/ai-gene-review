  label: Schizosaccharomyces pombe 972h-
description: Aspartate-semialdehyde dehydrogenase (EC 1.2.1.11) of Schizosaccharomyces pombe (SPCC1827.06c). It catalyses
  the NADPH-dependent reductive dephosphorylation of 4-phospho-L-aspartate to L-aspartate 4-semialdehyde, the second step
  of homoserine synthesis and so of threonine, isoleucine and methionine biosynthesis. It is the ortholog of S. cerevisiae
  Hom2. GFP-tagged hom2 is cytosolic with some nuclear signal. In fungi lysine is made by the alpha-aminoadipate pathway,
  so unlike its bacterial and plant counterparts hom2 does not feed lysine synthesis.
