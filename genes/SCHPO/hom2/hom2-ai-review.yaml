- term:
    id: GO:0009085
    label: L-lysine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012080
  review:
    summary: InterPro2GO mapping of IPR012080 (aspartate-semialdehyde dehydrogenase) to L-lysine biosynthetic process. The
      mapping reflects the bacterial/plant diaminopimelate route, where aspartate semialdehyde is the lysine precursor. Fungi,
      including S. pombe, make lysine by the alpha-aminoadipate pathway from 2-oxoglutarate (homocitrate synthase lys4 is
      modelled in PomBase GO-CAM gomodel:67c10cc400000148), so hom2 does not participate in lysine synthesis.
    action: REMOVE
    reason: Taxon-inappropriate InterPro2GO mapping; fungal lysine synthesis does not use aspartate semialdehyde.
    supported_by:
    - reference_id: PMID:11352712
      supporting_text: The aspartate pathway is responsible for the biosynthesis of lysine, threonine, isoleucine, and methionine
        in most plants and microorganisms.
    - &id007
      reference_id: file:SCHPO/hom2/hom2-uniprot.txt
      supporting_text: 'PATHWAY: Amino-acid biosynthesis; L-threonine biosynthesis; L-threonine'
