  label: Schizosaccharomyces pombe 972h-
description: SPAC15E1.05c (UniProt Q9UTI6; the fission yeast ECT1 ortholog) encodes CTP:phosphoethanolamine
  cytidylyltransferase (ECT; EC 2.7.7.14). It makes CDP-ethanolamine from phosphoethanolamine and CTP,
  the rate-limiting step of the CDP-ethanolamine branch of phosphatidylethanolamine synthesis. Function
  is assigned by orthology; a genome-wide screen places it in the cytosol.
