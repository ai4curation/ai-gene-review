suggested_questions:
- question: Is S. pombe ecm31 required for pantothenate prototrophy (as for pan6), and how is 2-dehydropantoate
    exported from mitochondria to the cytosolic pan5/pan6 steps?
suggested_experiments:
- description: Test growth of an S. pombe ecm31 deletion (in a liz1 background) on pantothenate-free medium
    with and without uracil or beta-alanine, mirroring the pan6 analysis.
