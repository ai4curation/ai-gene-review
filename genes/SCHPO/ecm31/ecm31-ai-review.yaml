taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Probable 3-methyl-2-oxobutanoate hydroxymethyltransferase (ketopantoate hydroxymethyltransferase,
  PanB; EC 2.1.2.11) of fission yeast, encoded by SPAC5H10.09c adjacent to pan6. It is predicted to transfer
  a hydroxymethyl group from 5,10-methylenetetrahydrofolate to 3-methyl-2-oxobutanoate (alpha-ketoisovalerate)
  to form 2-dehydropantoate, the first committed step of pantoate and hence pantothenate (vitamin B5)
  synthesis. The S. pombe protein localises to mitochondria in a genome-wide YFP-fusion screen, as does
  its S. cerevisiae ortholog Ecm31, whose deletion causes pantothenate auxotrophy. No S. pombe-specific
  biochemical or genetic data are available.
