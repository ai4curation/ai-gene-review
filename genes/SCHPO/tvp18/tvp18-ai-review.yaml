  label: Schizosaccharomyces pombe 972h-
description: tvp18 encodes a small conserved multi-pass membrane protein of the
  TVP18/calcium-channel flower homolog family that localizes to the Golgi
  membrane. Fungal TVP18-family proteins are conserved at Golgi membranes and
  are inferred to participate in vesicle-mediated trafficking, but the direct
  molecular activity of S. pombe tvp18 remains unknown.
