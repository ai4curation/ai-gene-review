    summary: The Matsuyama et al. ORFeome screen measured YFP-tagged S. pombe
      protein localizations at proteome scale and PomBase curated tvp18 to the
      Golgi apparatus from that screen.
    action: MODIFY
    reason: The source screen supports Golgi localization, and UniProt's curated
      interpretation plus the PTHR13314 fungal PAINT node refine tvp18 to the
      Golgi membrane. Replacing the parent Golgi-apparatus term with GO:0000139
      keeps the experimental localization while using the more informative
      cellular-component term already supported elsewhere in this review.
