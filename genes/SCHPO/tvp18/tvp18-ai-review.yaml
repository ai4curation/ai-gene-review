  supporting_entities:
  - PANTHER:PTN001779222
  - SGD:S000004675
  review:
    summary: The PAINT row places the Golgi-membrane annotation on fungal
      ancestor PTN001779222 with S. cerevisiae TVP18 as its experimental seed,
      and S. pombe tvp18 is a member of the same PTHR13314:SF2
      TVP18/calcium-channel flower homolog subfamily.
    action: ACCEPT
    reason: The IBA should be read as an ancestral-node claim rather than as a
      pairwise transfer from budding yeast. The PTN001779222 placement is
      taxonomically consistent with S. pombe membership in PTHR13314:SF2, and
      the inferred Golgi-membrane location is independently supported for the S.
      pombe protein by curated UniProt subcellular-location evidence from the
      Matsuyama et al. ORFeome localization screen.
