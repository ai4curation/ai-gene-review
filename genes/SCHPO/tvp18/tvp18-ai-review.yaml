- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: No specific molecular function has been established for S. pombe
      tvp18.
    action: ACCEPT
    reason: >-
      No literature on this gene product, in this species, identifies a function in this
      aspect, so the ND follows the evidence-code guideline and is accepted
      (projects/NO_DATA.md). Inferred rows in the same aspect do not make it stale.
      Earlier action KEEP_AS_NON_CORE, because: The curated record supports Golgi-
      membrane localization and a broad inferred vesicle-trafficking role, but it does
      not establish a direct molecular activity for tvp18. PTHR13314 now places
      GO:0005262 calcium channel activity on the same opisthokont PTN001779219 node as
      the accepted vesicle-mediated transport IBA, but that MF assertion is seeded only
      by Drosophila fwe, the fungal PTN001779222 node carries only Golgi membrane, and
      the other calcium-channel terms in PTHR13314 are confined to Eumetazoa node
      PTN000999743. Keeping the ND root row records the present absence of a specific
      fungal molecular activity without accepting a likely animal-specific channel
      placement for S. pombe tvp18.
