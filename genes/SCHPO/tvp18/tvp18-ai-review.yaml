  review:
    summary: PAINT places vesicle-mediated transport on opisthokont ancestor
      PTN001779219 with both Drosophila fwe and S. cerevisiae TVP18 among the
      experimental seeds.
    action: ACCEPT
    reason: GO:0016192 is a broad biological-process term, but for this family
      it is the conservative process level supported by PAINT across the
      opisthokont TVP18/calcium-channel flower homolog clade. S. pombe tvp18 is
      in the same PTHR13314:SF2 subfamily and has Golgi-membrane localization;
      no S. pombe-specific literature found in this review supports replacing
      the IBA with a narrower direct process term.
