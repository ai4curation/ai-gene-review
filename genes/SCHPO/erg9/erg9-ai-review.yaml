taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: erg9 (SPBC646.05c) encodes squalene synthase (farnesyl-diphosphate farnesyltransferase, EC 2.5.1.21)
  of Schizosaccharomyces pombe, a C-terminally anchored ER-membrane enzyme whose catalytic domain faces the cytosol.
  It condenses two molecules of (2E,6E)-farnesyl diphosphate via presqualene diphosphate and reduces the intermediate
  with NAD(P)H to squalene, the first committed step of sterol (ergosterol) synthesis. The S. pombe cDNA complements
  S. cerevisiae erg9 disruptants, and its mRNA rises when sterol synthesis is inhibited by lovastatin. Under oxidative
  stress the Pap1-induced F-box protein Pof14 binds Erg9 in a membrane complex and lowers its activity, repressing
  ergosterol levels.
