- term:
    id: GO:0006364
    label: rRNA processing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1919431
  - PANTHER:PTN000516076
  review:
    summary: Remove the NSUN4-derived rRNA-processing IBA from Trm4b.
    action: REMOVE
    reason: The focused OpenScientist follow-up resolves the previously open source boundary. MGI:1919431
      is Nsun4, and NSUN4 is a short mitochondrial branch member of heterogeneous PTHR22808, while
      S. pombe Trm4b is a nuclear Trm4/NSUN2-related tRNA C49/C50 methyltransferase. NSUN4-supported
      rRNA and mitochondrial-ribosome functions should not propagate to Trm4b solely through broad
      PTHR22808 co-membership.
    supported_by:
    - reference_id: PMID:30646830
      supporting_text: Trm4b methylated all C49 sites on tRNAs.
    - reference_id: file:SCHPO/trm402/trm402-hypotheses/trm4b-rrna-mrna-and-mitochondrial-ribosome-functions/openscientist.md
      supporting_text: the rRNA-methylation, rRNA-processing, and mitochondrial-LSU-assembly claims
        are refuted as paralog carry-over from NSUN4.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000516076
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The rRNA and mitochondrial-ribosome signal is best explained by NSUN4 branch evidence
          inside PTHR22808 and does not transfer to the nuclear Trm4/NSUN2-related tRNA branch containing
          Trm4b.
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
