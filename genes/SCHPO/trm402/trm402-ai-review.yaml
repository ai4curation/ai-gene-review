  review:
    summary: The additional rRNA/mitochondrial-ribosome function is not resolved for Trm4b.
    action: UNDECIDED
    reason: The direct Trm4a/Trm4b study establishes tRNA substrate specificity. It does not test or
      refute this separate rRNA/mitochondrial function. The cited PAINT node includes functions from
      other RNA-cytosine-methyltransferase branches; deciding whether this specific function is inherited
      by Trm4b requires its experimental substrate evidence and ancestral-node placement. Broad family
      membership alone does not resolve that question.
