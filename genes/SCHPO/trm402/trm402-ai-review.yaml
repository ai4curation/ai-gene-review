- id: PMID:30646830
  title: 'Division of labour: tRNA methylation by the NSun2 tRNA methyltransferases Trm4a and Trm4b
    in fission yeast.'
  findings:
  - statement: Trm4b does not carry out physiological tRNA wobble C34 methylation.
    supporting_text: Trm4b methylates both C34 and C49 in vitro, even though it does not methylate
      C34 in vivo.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. Recombinant methyl incorporation and paralog-resolved
      deletion/bisulfite sequencing establish Trm4b C49/C50; C34 activity occurs in vitro but not
      physiologically. The discussion explicitly leaves mRNA/small-RNA methylation open. Its correction
      of the earlier purported deletion is already recorded against PMID:23074192.
- id: file:SCHPO/trm402/trm402-uniprot.txt
  title: 'UniProtKB O13935: curated sequence, features and source attribution'
- id: PMID:23074192
  title: Pmt1, a Dnmt2 homolog in Schizosaccharomyces pombe, mediates tRNA methylation in response
    to nutrient signaling.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The 2019 full-text paper (PMID:30646830) reports that the earlier purported trm4b
      deletion strain lacked the deletion. The older Trm4b-dependent tRNA-Asp site assignment cannot
      establish physiological specificity.
- id: file:SCHPO/trm402/trm402-deep-research-falcon.md
  title: Falcon research on Trm4b/O13935 tRNA methylation
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Read fully and checked against the primary full text of PMID:30646830. Correctly
      distinguishes Trm4a from Trm4b, C49/C50 physiology from C34 in-vitro reactivity, nuclear localization
      from hypothetical mitochondrial effects, and unresolved non-tRNA substrate classes.
  findings:
  - statement: The biochemical and genetic assignments must distinguish in-vitro from physiological
      C34 activity.
    supporting_text: It does **not** overturn the in-vivo assignment of C34 to Trm4a.
  - statement: Nuclear evidence does not refute a cytoplasmic pool.
    supporting_text: This conclusion does not exclude transient cytoplasmic residence or modification
      of recycled tRNAs
- id: file:SCHPO/trm402/trm402-hypotheses/trm4b-rrna-mrna-and-mitochondrial-ribosome-functions/openscientist.md
  title: OpenScientist investigation of Trm4b rRNA, mRNA and mitochondrial ribosome functions
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read fully and checked against the current Trm4b GOA, local PTHR22808 family review,
      and PTHR22808 member inventory. The report verified that MGI:1919431 is Nsun4 and resolved the
      rRNA/mitochondrial IBA rows as NSUN4 branch carry-over, while treating the mRNA ISS row as plausible
      but untested.
  findings:
  - statement: The rRNA methyltransferase, rRNA-processing and mitochondrial ribosome assembly IBAs
      are NSUN4 paralog carry-over within heterogeneous PTHR22808.
    supporting_text: Trm4b (O13935), **NSUN2** (human Q08J23 / mouse Q1HFZ0), **and NSUN4** (human
      Q96CB9 / mouse Q9CZ57) all map to **PTHR22808**
  - statement: The mRNA methyltransferase ISS is plausible but non-core and experimentally untested
      in fission yeast.
    supporting_text: The only non-tRNA function with a defensible rationale is **mRNA
      (cytidine-5-)-methyltransferase (GO:0062152)**, which sits on Trm4b as an **ISS projection
      from human NSUN2 (Q08J23)**.
