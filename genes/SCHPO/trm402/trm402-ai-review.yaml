id: O13935
gene_symbol: trm4b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Trm402 (Trm4b) is a SAM-dependent NSUN2/Trm4-family tRNA cytosine-C5 methyltransferase. In
  fission yeast it establishes m5C at tRNA C49 and selected C50 positions, complementing Trm4a, which
  modifies C48 and physiological wobble C34 sites. Trm4b can methylate C34 in vitro but does not supply
  this modification in vivo. The protein has been observed in the nucleus.
