id: O13935
gene_symbol: trm4b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Trm402 (Trm4b) is a SAM-dependent NSUN2/Trm4-family tRNA cytosine-C5 methyltransferase.
  In fission yeast it establishes m5C at tRNA C49 and selected C50 positions, complementing Trm4a,
  which modifies C48 and physiological wobble C34 sites. Trm4b can methylate C34 in vitro but does
  not supply this modification in vivo. The protein has been observed in the nucleus.
existing_annotations:
- term:
    id: GO:0002127
    label: tRNA wobble base cytosine methylation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000516076
  - SGD:S000000120
  review:
    summary: Trm4b does not carry out physiological tRNA wobble C34 methylation.
    action: REMOVE
    reason: GO:0002127 specifies methylation of tRNA anticodon position 34. The direct paralog-resolved
      study assigns this in vivo process to Trm4a and explicitly excludes Trm4b, despite its C34 activity
      in vitro. This is target-specific divergence from the budding-yeast Trm4 ancestral function,
      not an objection to donor count or self-inclusion in PAINT evidence.
    supported_by:
    - reference_id: PMID:30646830
      supporting_text: Trm4b methylates both C34 and C49 in vitro, even though it does not methylate
        C34 in vivo.
    - reference_id: file:SCHPO/trm402/trm402-deep-research-falcon.md
      supporting_text: It does **not** overturn the in-vivo assignment of C34 to Trm4a.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000516076
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Budding-yeast Trm4 supplies physiological wobble C34 methylation; paralog-resolved
          S. pombe knockout/methylome experiments assign that physiological role to Trm4a, while Trm4b
          supplies C49/C50.
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
