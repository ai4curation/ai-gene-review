    summary: Functional Ags1-GFP localizes to the plasma membrane at growing tips and the division site;
      in sec8-1 exocyst mutants it fails to reach the plasma membrane.
    action: ACCEPT
    reason: Core location. Ags1 is a multi-pass integral membrane protein (detergent-solubilized, predicted
      12-TM C-terminal domain) delivered by polarized exocytosis to the plasma membrane, where it synthesizes
      and extrudes alpha-glucan. Delivery depends on the exocyst; in the sec8-1 mutant Ags1 stays in
