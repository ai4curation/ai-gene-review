- term:
    id: GO:0000935
    label: division septum
  evidence_type: EXP
  original_reference_id: PMID:10087262
  qualifier: is_active_in
  review:
    summary: Immunofluorescence with anti-Mok1 shows the protein in a medial ring at anaphase and colocalized
      with the septum during septation (Katayama et al. 1999).
    action: KEEP_AS_NON_CORE
    reason: The observation is sound and Ags1 makes alpha-glucan of the primary and secondary septum.
      But the septum is a cell wall structure, while Ags1 is an integral plasma membrane protein in the
      membrane at the leading edge of, and then flanking, the septum; light microscopy cannot separate
      the septum from the membrane that lines it. As in the sibling bgs1 review, the term is kept as a
      true but non-core statement; the core location is the plasma membrane at the cell division site
      (GO:0032153, GO:0005886). The PomBase GO-CAM gomodel:6918f23700003787 uses division septum as the
      occurs_in location for the ags1 activity; this review agrees with the activity and process of that
      model but prefers the membrane location.
    supported_by:
    - reference_id: PMID:10087262
      supporting_text: actin and Mok1 colocalized with septa
    - reference_id: PMID:10087262
      supporting_text: Mok1 is an stable integral membrane protein
