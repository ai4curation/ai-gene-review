core_functions:
- description: Integral plasma membrane alpha-1,3-glucan synthase that makes the (1->3)-alpha-glucan of
    the vegetative cell wall at growing cell tips and of the septum at the cell division site, using cytosolic
    UDP-glucose. It is recruited to the division site with Bgs1 before septum formation and gives the
    primary septum the strength to survive cell separation. The GT5 domain is the presumed synthase and
    the extracellular GH13 domain the presumed chain-coupling transglycosylase; both domains are essential
    but their individual activities are inferred.
