suggested_questions:
- question: Does Ags1 by itself catalyse alpha-1,3-glucan synthase activity, and does its GT5 domain also
    make the (1->4)-alpha-glucan primer? The activity rests on in vivo wall composition; no membrane or
    purified-enzyme assay has been reported.
- question: Does the extracellular GH13 domain of Ags1 have transglycosylase (chain-coupling) activity,
    given that it lacks hydrolase catalytic residues and that ags1-664 (Y256F/R408H in GH13) is defective,
    and how does it divide labour with the GPI-anchored Aah1 and Aah3?
- question: PMID:22891259 shows that Ags1-depleted cells lack a secondary septum (Fig. 7); should ags1
    also carry GO:1990344 secondary cell septum biogenesis, as bgs4 does, given that PomBase annotated
    only primary septum biogenesis from that paper?
- question: Should the location of the ags1 activity in GO-CAM gomodel:6918f23700003787 be the plasma
    membrane at the cell division site rather than the division septum (a wall structure)?
suggested_experiments:
- description: Assay membrane fractions or purified Ags1 (wild type, GT5 E1526A, GH13 Y256F/R408H) with
    UDP-[14C]glucose and maltooligosaccharide primers, and determine linkage and chain length of the products,
    to separate primer synthesis, (1->3) elongation and chain coupling.
- description: Express the Ags1 GH13 domain and Aah3 and test them on defined (1->3)-alpha-glucan oligomers
    for transglycosylation or disproportionation by HPAEC-PAD and NMR.
- description: Test whether Pck2 phosphorylates Ags1 directly (in vitro kinase assay, phosphosite mutants
    of the mapped S1643-S1812 cluster) to explain Rho2-Pck2 control of Ags1 localization and output.
