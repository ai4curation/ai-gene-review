gene_symbol: ags1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Ags1 (also called Mok1) is the essential cell wall alpha-glucan synthase of Schizosaccharomyces
  pombe vegetative cells. It is a 2410-residue multidomain integral plasma membrane protein with an N-terminal
  extracellular region carrying a glycoside hydrolase family 13 (alpha-amylase-like) domain that lacks
  hydrolytic catalytic residues, a central transmembrane segment, an intracellular glycosyltransferase
  family 5 (glycogen/starch synthase-like) domain, and a C-terminal multipass transmembrane domain. It
  is needed for nearly all the (1->3)-alpha-glucan of the vegetative wall, which consists of two coupled
  chains of about 120 (1->3)-linked glucose residues with a few (1->4)-linked residues at the reducing
  end. The intracellular synthase domain is thought to extend (1->3)-alpha-glucan from a (1->4)-alpha-glucan
  primer that it also makes, and the extracellular GH13 domain is thought to act as a transglycosylase
  that joins chains, but neither step has been shown biochemically. Ags1 is delivered by exocytosis to
  the plasma membrane of growing cell tips in interphase and moves to a medial ring at mitosis, together
  with the beta-glucan synthase Bgs1, with which it co-immunoprecipitates. It then follows the edge of
  the ingressing septum and lines the septum membrane. Ags1 makes an alpha-glucan that gives the primary
  septum the strength to withstand turgor during cell separation and is needed for the secondary septum
  and for the layered architecture of the lateral wall; loss of function causes lysis. Its localization
  and alpha-glucan output depend on the Rho2-Pck2 protein kinase C pathway. Ags1 acts non-redundantly
  with the GPI-anchored GH13 proteins Aah1 and Aah3, which are needed for normal alpha-glucan assembly.
  Its paralogs Mok12, Mok13 and Mok14 are sporulation-specific and make spore-wall alpha-glucans; Ags1
  is also present at sites of wall synthesis during mating, sporulation and germination.
