    action: MARK_AS_OVER_ANNOTATED
    reason: The source of this IBA is the ags1 IDA from PMID:22891259, which saw Ags1-GFP at sites of
      wall synthesis during spore formation. Ags1 is an integral plasma membrane protein (forespore membrane
      during sporulation), not a component of the spore wall it helps to build, and the spore-envelope
