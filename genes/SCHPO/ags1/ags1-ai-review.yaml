- id: PMID:22891259
  title: Fission yeast Ags1 confers the essential septum strength needed for safe gradual cell abscission.
  findings:
  - statement: Ags1 localizes to growing ends and to a medial ring before the primary septum.
    supporting_text: During polar growth Ags1 was localized to the growing ends. Before the primary septum
      was detected, Ags1 simultaneously appeared in the growing ends and as a medial ring.
  - statement: Ags1 and Bgs1 concentrate in a ring at the edge of the growing septum.
    supporting_text: both Ags1 and Bgs1 concentrated in a ring that moved with the edge of the growing
      septum
  - statement: Depletion reduces wall alpha-glucan by 53%.
    supporting_text: the Ags1-depleted cells showed a considerable reduction (53%) in the cell wall α-glucan
      content
  - statement: Ags1 alpha-glucan gives the primary septum its mechanical strength.
    supporting_text: These observations indicate that Ags1 synthesizes an α-glucan of the primary septum
      that is essential to confer it the mechanical strength needed to face the separation internal pressure.
  - statement: Ags1 is present at sites of wall synthesis during mating, sporulation and germination.
    supporting_text: 'Like the Bgs subunits, Ags1 was also present in all of the sites of wall synthesis
      during sexual differentiation: mating, spore formation, and spore germination'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Functional Ags1-GFP localization, Bgs1 co-IP, dependence on CAR, actin
      patches and exocyst, septum and wall ultrastructure of depleted cells.
