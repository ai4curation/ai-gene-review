      in medium supplemented with ethanolamine
  - reference_id: PMID:19286980
    supporting_text: mutants carrying deletions in all three psd genes (psd1-3Delta mutants) grow slowly in rich
      medium and are inviable in minimal medium, indicating that the psd1 to psd3 gene products share overlapping
      essential cellular functions
  - reference_id: PMID:34818062
    supporting_text: Consistent with predicted targeting to the IMM, SpPsd1-mNG localized to mitochondria
  - reference_id: PMID:34818062
    supporting_text: We found that SpPsd1 is required for respiratory growth, while SpPsd2 was dispensable, even
      in the absence of SpPsd1.
suggested_questions:
- question: How is PS transported from the ER (pps1) to the inner mitochondrial membrane for psd1 in S. pombe, and
    which contact-site or transfer proteins are needed?
suggested_experiments:
- description: Measure PSD activity in isolated mitochondria from psd1, psd2 and psd1 psd2 deletion strains to apportion
    mitochondrial PE synthesis between the two enzymes.
