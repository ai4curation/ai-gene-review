taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'psd1 encodes the mitochondrial phosphatidylserine decarboxylase of Schizosaccharomyces pombe (EC 4.1.1.65),
  a member of the PISD/Psd1 family. Like other PSDs, it is made as a proenzyme that self-cleaves into beta and pyruvoyl-containing
  alpha chains, and it decarboxylates phosphatidylserine to phosphatidylethanolamine. It has a predicted mitochondrial
  targeting sequence and transmembrane segment, localizes to mitochondria (without the ER pool seen for S. cerevisiae
  Psd1), and is the PSD needed for respiratory growth. psd1, psd2 and psd3 overlap: only the triple deletion lowers
  PE enough to need ethanolamine, and lack of PE causes defects in morphology and cytokinesis.'
