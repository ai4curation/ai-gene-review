gene_symbol: bst1
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for bst1, the ER GPI inositol-deacylase. Ranks 1 to 4 are all
  correct or near-correct: the GPI anchor metabolic process, the exact core molecular function, a
  cortical ER refinement and positive regulation of ER-to-Golgi transport, which matches this review's
  second core function. This is among the most consistently useful ARGO139 lists, and two of the four
  are absent from GOA. Assessment: 1 correct novel (COR), 1 less precise (LSP), 1 uncertain (UNC).
