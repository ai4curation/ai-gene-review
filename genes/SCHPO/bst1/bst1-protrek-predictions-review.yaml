  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 15.83), a strict descendant of the HDA/IBA-annotated endoplasmic reticulum. Cortical
      ER is a real S. pombe subcompartment, but bst1 acts on nascent GPI-APs during their transit
      and no cortical-specific localisation is reported; the general ER assignment is what the evidence
