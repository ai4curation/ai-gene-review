  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 17.68) and absent from GOA. Protein lipidation involved in autophagosome assembly
      is precisely what the Atg12-Atg5-Atg16 complex does to Atg8, and it is the correct version of
      the rank-1 error. Correct, specific and novel. Rank 4's label (cytoplasm to vacuole transport
