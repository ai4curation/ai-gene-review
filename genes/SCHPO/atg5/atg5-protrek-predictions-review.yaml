id: O74971
gene_symbol: atg5
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Atg5, the Atg12-conjugated core of the E3-like Atg8 lipidation
  machinery. Rank 2 names the complex exactly and ranks 1 and 3 both describe lipidation, which is
  the reaction the complex catalyses - so the model reaches the right chemistry for a protein whose
  GOA records molecular_function as ND. Rank 1 gets the lipidation type wrong. Assessment: 1 correct
  novel (COR), 1 correct not novel (CNN), 1 paralog incorrect (PLI).
