- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0006501
    label: C-terminal protein lipidation
  predicted_term_type: GO_BP
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 18.90). C-terminal protein lipidation covers GPI anchoring and prenylation
      - modifications at a protein's C-terminus by dedicated transferases. The Atg12-Atg5-Atg16 complex
      conjugates phosphatidylethanolamine to the C-terminal glycine of Atg8 through a ubiquitin-like
      E1-E2-E3 cascade, which is mechanistically a different kind of reaction despite the superficial
      C-terminal-lipid similarity. Rank 3 supplies the correct term.
    supported_by:
