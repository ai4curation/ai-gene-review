- term:
    id: GO:0006152
    label: purine nucleoside catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G05620
  - AGI_LocusCode:AT2G36310
  - PANTHER:PTN000266727
  review:
    summary: PAINT inference of purine nucleoside catabolism inherited at PANTHER:PTN000266727 from
      Arabidopsis IUNH-family nucleosidases (AT1G05620, AT2G36310). Fungal Urh1-clade enzymes are
      pyrimidine/nicotinamide-riboside nucleosidases that lack activity on purine nucleosides.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Cross-kingdom IBA over-propagated from Arabidopsis purine/cytokinin nucleosidases
      (AT1G05620, AT2G36310) at PANTHER:PTN000266727; characterized fungal ortholog S.
      cerevisiae Urh1 hydrolyzes uridine, cytidine, and nicotinamide riboside with no
      activity on purine nucleosides (PMID:11872485, PMID:19001417). Whereas yeast URH1
      uses REMOVE based on direct biochemical assays of S. cerevisiae Urh1,
      MARK_AS_OVER_ANNOTATED is used here because the S. pombe paralogs have not yet
      been assayed directly.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: AGI_LocusCode:AT1G05620
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Arabidopsis thaliana IUNH-family nucleoside hydrolase with purine/cytokinin
          nucleosidase activity not shared by the fungal Urh1 clade.
      - source_id: AGI_LocusCode:AT2G36310
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Arabidopsis thaliana IUNH-family nucleoside hydrolase with purine nucleosidase
          activity not shared by the fungal Urh1 clade.
      - source_id: PANTHER:PTN000266727
        source_label: PTN000266727
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Eukaryota IUNH-family node where purine nucleoside catabolism from plant
          homologs (AT1G05620, AT2G36310) does not hold for the fungal Urh1-clade branch,
          which has diverged to pyrimidine and nicotinamide-riboside specificity.
    supported_by:
    - reference_id: PMID:11872485
      supporting_text: Protein extracts of strains overexpressing YDR400w show increased hydrolase activity
        only with uridine and cytidine, but no activity with inosine, adenosine, guanosine, and thymidine
        as substrates
    - reference_id: PMID:19001417
      supporting_text: Urh1 hydrolyzed uridine to uracil at high substrate concentrations.
