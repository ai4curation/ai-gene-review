id: O42869
gene_symbol: spa2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Spa2 (SPAC3G9.05) is the fission-yeast member of the fungal Spa2 family of cortical scaffold
  proteins, which are related to metazoan GIT proteins through the N-terminal Spa2 homology domain (SHD).
  Spa2 localizes as arcs at the cortex of growing cell tips, first at the old end and at both ends after
  new-end take-off, and relocates during mitosis to the cell division site, where it sits in the intermediate
  layer of the actomyosin contractile ring and lines the forming septum. Ring and tip recruitment depends
  partly on a PXXP motif binding the SH3 domains of the F-BAR proteins Cdc15 and Imp2, and largely on
  the exocyst. Spa2 self-associates through coiled-coil regions and binds the Schizosaccharomyces-specific
  protein Pos1 to form stable oligomeric complexes. Through its SHD it recruits the Rab GAP Gyp3, which
  acts on the Sec4 homolog Ypt2, to tips and the division site. Loss of Spa2 broadens the growth zone
  and the distribution of the exocyst, giving shorter, wider cells, and abolishes invasive growth. Unlike
  budding-yeast Spa2, it has no detectable connection to formin/Bud6 actin assembly or to MAP kinase modules.
