  review:
    summary: PomBase EXP annotation (Ren et al. 2025). Spa2 binds Pos1 through its CC2 region to form
      oligomeric complexes, and through its SHD binds the Rab GAP Gyp3, which it is absolutely required
      to localize at cell tips and the division site.
