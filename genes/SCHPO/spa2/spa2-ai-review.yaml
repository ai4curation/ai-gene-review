suggested_questions:
- question: PomBase annotates spa2 to GO:0120207 'endocytosis, site selection' (IMP, PMID:40931936), but
    the paper's main-text phenotype is a broadened exocyst/exocytosis zone. Was an exocytosis-site term
    intended, or do the supplementary data contain an endocytic-patch assay?
- question: Should the S. cerevisiae-seeded GO:0005078 MAP kinase scaffold activity IBD on PTHR21601 root
    node PTN004550576 be moved down to the Saccharomycetaceae Spa2/Sph1 clade, given the negative MAPK
    data for S. pombe Spa2?
- question: spa2 deletion abolishes invasive (pseudohyphal) growth in S. pombe (PMID:25428987); is the
    PTN001091461 (Saccharomycetales) placement of invasive and pseudohyphal growth too shallow for the
    family?
suggested_experiments:
- description: Test whether the Gyp3-binding SHD interface and the Pos1-binding CC2 region of Spa2 are
    separately required for focusing Exo70/Sec3 at tips, using point mutants rather than deletions; in
    parallel, image endocytic patch markers (e.g. Fim1) in spa2 deletion cells to resolve the endocytosis
    site-selection annotation.
