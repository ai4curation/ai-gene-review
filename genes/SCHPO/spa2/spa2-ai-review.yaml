  review:
    summary: 2008 PomBase ortholog transfer (ISO) from S. cerevisiae SPA2, where Spa2 is a polarisome
      scaffold for Bni1/Bud6-driven actin cable assembly.
    action: MARK_AS_OVER_ANNOTATED
    reason: Later S. pombe data do not support this transfer. spa2 deletion cells have normal F-actin
      distribution, Spa2 localization is largely F-actin independent, no interaction with the S. pombe
      Bni1 or Bud6 homologues was detected, and S. pombe lacks Pea2 and Aip5. Only spa2 overexpression
      perturbs actin. The ISO was a reasonable 2008 curator call, but it now over-states a budding-yeast-specific
      polarisome-actin function. MARK_AS_OVER_ANNOTATED is used rather than REMOVE because the case against
      the transfer rests on negative results (no deletion phenotype, no detected interaction), which redundancy
      could mask, while overexpression does perturb actin and the 2025 study itself leaves an actin link
      for non-budding-yeast Spa2 proteins open; the term is not shown to be wrong, only unsupported as
      a function of S. pombe Spa2.
    supported_by:
