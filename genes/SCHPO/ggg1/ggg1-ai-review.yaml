  label: Schizosaccharomyces pombe 972h-
description: Glutathione-specific gamma-glutamylcyclotransferase (Ggg1, ChaC family; EC 4.3.2.7) of Schizosaccharomyces
  pombe, the ortholog of S. cerevisiae Gcg1 and human CHAC1/CHAC2. This small cytosolic and nuclear enzyme
  degrades reduced glutathione intracellularly by cyclising its gamma-glutamyl moiety to 5-oxo-L-proline
  and releasing L-cysteinylglycine; ChaC enzymes act on glutathione but not on other gamma-glutamyl peptides.
  The Cys-Gly product is hydrolysed by the Cys-Gly dipeptidase Dug1 and 5-oxoproline is returned to glutamate
  by the ATP-dependent 5-oxoprolinases Oxp1/Oxp2, giving a cytosolic route for glutathione turnover and
  cysteine recovery. Its activity has not been measured directly in S. pombe; function is inferred from
  the family and from the characterised budding-yeast ortholog.
