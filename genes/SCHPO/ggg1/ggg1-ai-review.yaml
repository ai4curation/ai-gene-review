suggested_questions:
- question: Is Ggg1 the main route of intracellular glutathione turnover in S. pombe, given that the S.
    pombe Dug2-Dug3-type GATase pathway is not established?
suggested_experiments:
- hypothesis: Ggg1 has glutathione-specific gamma-glutamylcyclotransferase activity.
  description: Assay recombinant Ggg1 on GSH, gamma-Glu-Cys and other gamma-glutamyl peptides; measure
    5-oxoproline and Cys-Gly in ggg1 and ggg1 dug1 strains, and test whether ggg1+ complements a S. cerevisiae
    gcg1 mutant.
