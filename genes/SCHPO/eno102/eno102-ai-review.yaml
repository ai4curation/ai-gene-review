  label: Schizosaccharomyces pombe 972h-
description: Eno102 (SPBPB21E7.01c; UniProt synonym eno1, shared with its paralog eno101) is the second
  enolase of the fission yeast Schizosaccharomyces pombe, encoded by the ORF SPBPB21E7.01c (also annotated
  as SPBPB8B6.07c). The 440-residue enolase-family protein is about 66% identical to eno101 and conserves
  all catalytic, substrate-binding and Mg2+-binding residues, so by sequence it is expected to be an active
  Mg2+-dependent dimeric phosphopyruvate hydratase converting 2-phosphoglycerate to phosphoenolpyruvate
  in glycolysis. No direct experimental characterisation of its activity, expression or localisation has
  been reported; its predicted location is the cytoplasm.
