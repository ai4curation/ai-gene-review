  - UniProtKB:P38038
  - UniProtKB:Q9UBK8
  - UniProtKB:Q9UHB4
  review:
    summary: >-
      PAINT IBA from the diflavin reductase node PTN000453956 (P450 reductase,
      NOS, methionine synthase reductase, E. coli CysJ P38038), whose members
      bind FMN through an N-terminal flavodoxin domain. met10, like S.
      cerevisiae MET10, has no flavodoxin domain (no IPR001094/IPR008254 or
      Pfam PF00258); its N-terminal region is pyruvate-flavodoxin
      oxidoreductase-like, and in the fungal enzyme the flavodoxin FMN domain
      is on the beta subunit sir1. UniProt's FMN cofactor note is a by-similarity
      inference from CysJ. The IBA is a propagation to a lineage that lost the
      FMN-binding domain; removed, consistent with the S. cerevisiae MET10
      review.
    action: REMOVE
    supported_by:
    - reference_id: file:SCHPO/met10/met10-uniprot.txt
      supporting_text: 'DR   Pfam; PF00667; FAD_binding_1; 1.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000453956
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Diflavin reductase node (CPR/NOS/MTRR/CysJ relatives) whose FMN
          binding resides in an N-terminal flavodoxin domain that met10 lacks;
          in the fungal sulfite reductase that domain is carried by the beta
          subunit (sir1 in S. pombe).
