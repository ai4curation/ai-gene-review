  label: Schizosaccharomyces pombe 972h-
description: >-
  met10 (SPCC584.01c) encodes the alpha (flavoprotein) subunit of the
  assimilatory NADPH-sulfite reductase of fission yeast (EC 1.8.1.2), the
  ortholog of Saccharomyces cerevisiae MET10. With the hemoprotein beta subunit
  sir1 it is expected to form a cytosolic alpha2beta2 hemoflavoprotein that
  reduces sulfite to hydrogen sulfide with six electrons from NADPH, the
  final reductive step of sulfate assimilation that supplies sulfide for
  homocysteine, methionine and cysteine synthesis. met10 supplies the electron
  input module: it has CysJ-like FAD-binding and FNR-type NAD(P)H-binding
  domains, preceded by an N-terminal region related to pyruvate-flavodoxin
  oxidoreductase. Unlike bacterial CysJ it lacks a flavodoxin-like FMN domain,
  which in the fungal enzyme is found on the beta subunit. met10 is cytosolic.
