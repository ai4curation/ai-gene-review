  review:
    summary: The FMN-binding IBA is not supported on the fungal alpha-subunit architecture.
    action: REMOVE
    supported_by:
    - reference_id: file:SCHPO/met10/met10-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: DR   Pfam; PF00667; FAD_binding_1; 1.
    - reference_id: file:SCHPO/sir1/sir1-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: DR   Pfam; PF00258; Flavodoxin_1; 1.
    - reference_id: PMID:7928966
      supporting_text: a lack of obvious flavin mononucleotide-binding motifs in the MET10 deduced
        amino acid sequence
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000453956
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Diflavin reductase node (CPR/NOS/MTRR/CysJ relatives) whose FMN binding resides in
          an N-terminal flavodoxin domain that met10 lacks; in the fungal sulfite reductase that domain
          is carried by the beta subunit (sir1 in S. pombe).
    reason: The specific flavodoxin-like FMN module carried by other PTHR19384 members is absent from
      the target alpha protein, whereas the cognate beta protein has a positive PF00258 flavodoxin-domain
      match. The original MET10 sequence study also explicitly lacked obvious FMN motifs. Holoenzyme
      FMN content cannot locate the cofactor on alpha. Reject this domain-dependent propagation, consistently
      with the existing PTHR19384 family adjudication, while distinguishing inferred beta placement
      from direct isolated-subunit binding. The unqualified UniProt ECO:0000250 FMN note is a competing
      inference; its exact donor is not established here and is not asserted to be CysJ.
