taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: gpx1 encodes the only glutathione peroxidase-family protein of Schizosaccharomyces pombe, a 158-residue non-selenium
  (cysteine) GPx homologue that functions as an atypical 2-Cys peroxiredoxin. Gpx1 reduces hydrogen peroxide, alkyl hydroperoxides
  and phospholipid hydroperoxides using thioredoxin, not glutathione, as electron donor (EC 1.11.1.24). It is found in the
  cytosol and mitochondria. gpx1 transcription is induced by oxidative, osmotic and heat stress through the Sty1-Atf1 pathway
  and rises in stationary phase, where Gpx1 supports long-term survival and protects oxidation-labile iron-sulfur enzymes
  such as aconitase and sulfite reductase. In exponentially growing cells it is a minor peroxide scavenger compared with the
  peroxiredoxin Tpx1 and catalase. Recombinant Gpx1 also shows weak holdase (anti-aggregation) chaperone activity in vitro.
