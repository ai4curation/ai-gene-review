  review:
    summary: NOT glutathione peroxidase activity (Lee et al. 2008). Gpx1 preferred thioredoxin to glutathione in vitro and
      in vivo and was reclassified as a thioredoxin peroxidase.
    action: ACCEPT
    reason: The negative annotation is the key correction for this family member and is consistent with the UniProt CAUTION
      note. Unlike S. cerevisiae GPX1, for which GSH-dependent activity was kept as a second function, the S. pombe data argue
      against glutathione as a physiological reductant.
    supported_by:
    - reference_id: PMID:18162174
      supporting_text: The Gpx1 protein has a peroxidase activity but preferred thioredoxin to glutathione as an electron
        donor when examined in vitro and in vivo, and therefore is a thioredoxin peroxidase.
