suggested_questions:
- question: Which thioredoxin (trx1, trx2/mitochondrial) reduces Gpx1 in each compartment, and is the mitochondrial pool generated
    by an alternative translation start or by a cryptic targeting signal?
- question: Does Gpx1 act as a peroxide sensor or redox relay for a transcription factor in stationary phase, analogous to
    S. cerevisiae Hyr1/Gpx3 and Yap1?
suggested_experiments:
- description: Compare stationary-phase survival, aconitase activity and lipid peroxidation in gpx1 deletion strains complemented
    with wild-type Gpx1 or peroxidatic/resolving cysteine mutants, and with cytosol- or mitochondria-restricted Gpx1.
