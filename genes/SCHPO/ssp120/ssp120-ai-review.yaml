id: O74903
gene_symbol: ssp120
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  ssp120 encodes a small EF-hand, MCFD2/nucleobindin-family precursor that
  enters the early secretory pathway and localizes in the endoplasmic reticulum
  and Golgi lumens. It is the soluble luminal binding partner of the
  transmembrane lectin-like cargo receptor Emp43, and the Emp43-Ssp120 complex
  contributes to COPII-dependent export of selected glycosylated cargo through an
  ERGIC-like compartment.
