    supporting_text: "EC=1.6.2.2"
- description: >-
    NADH-dependent reduction of Dph3; reduced Dph3 supplies the radical-SAM
    systems for tRNA wobble uridine modification and the first step of
    diphthamide biosynthesis.
  proposed_molecular_function: NADH-dependent Dph3 reductase activity
  directly_involved_in:
  - id: GO:0002926
    label: tRNA wobble base 5-methoxycarbonylmethyl-2-thiouridinylation
  - id: GO:0017183
    label: protein histidyl modification to diphthamide
  supported_by:
  - reference_id: file:genes/SCHPO/cbr1/cbr1-uniprot.txt
    supporting_text: >-
      Reaction=2 Fe(3+)-[Dph3] + NADH = 2 Fe(2+)-[Dph3] + NAD(+) + H(+);
  - reference_id: PMID:27694803
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
