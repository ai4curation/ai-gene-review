description: >-
  Schizosaccharomyces pombe cbr1 encodes a CBR1-like NADH-cytochrome b5
  reductase of the flavoprotein pyridine nucleotide cytochrome reductase
  family. The protein has two predicted N-terminal transmembrane helices
  followed by conserved FAD- and NADH-binding domains, belongs to the fungal
  CBR1-like branch of PANTHER NADH-cytochrome b5 reductases, and is inferred
  from the characterized Saccharomyces cerevisiae ortholog to reduce
  cytochrome b5 and the iron protein Dph3 from NADH.
core_functions:
- description: >-
    FAD-dependent reduction of ferricytochrome b5 from NADH by the
    membrane-anchored CBR1-like reductase.
  molecular_function:
    id: GO:0090524
    label: cytochrome-b5 reductase activity, acting on NADH
  locations:
