- id: PMID:10622712
  title: 'Biodiversity of the P450 catalytic cycle: yeast cytochrome b5/NADH cytochrome
    b5 reductase complex efficiently drives the entire sterol 14-demethylation (CYP51)
    reaction.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; directly supports the ability of the fungal
      cytochrome b5/NADH-cytochrome b5 reductase electron-transport system to
      drive CYP51-mediated sterol 14-demethylation.
- id: PMID:27694803
  title: Cbr1 is a Dph3 reductase required for the tRNA wobble uridine modification.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; directly characterizes S. cerevisiae Cbr1 as the major
      NADH-dependent Dph3 reductase supporting mcm5s2U wobble uridine
      modification; diphthamide formation is buffered by redundant reductase
      input unless eEF2 electron demand is increased.
  findings:
  - statement: >-
      S. cerevisiae Cbr1 was identified as an NADH-dependent Dph3 reductase,
      rapidly reduced Dph3 in vitro when NADH was supplied, and provided the
      Dph3-dependent reducing system for the Dph1-Dph2 radical-SAM enzyme.
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
  - statement: >-
      Loss of CBR1 alone partially impaired mcm5s2U tRNA wobble uridine
      modification, and combined loss of CBR1 and MCR1 further reduced this
      Dph3-dependent modification.
    supporting_text: >-
      CBR1 deletion alone conferred some resistance to γ-toxin, suggesting that
      formation of tRNA modifications was partially impaired
- id: PMID:34154323
  title: Dph3 Enables Aerobic Diphthamide Biosynthesis by Donating One Iron Atom to
    Transform a [3Fe-4S] to a [4Fe-4S] Cluster in Dph1-Dph2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; reconstitutes the S. cerevisiae Dph1-Dph2 reaction and
      confirms that Dph3/Cbr1/NADH donates electrons for diphthamide
      biosynthesis.
  findings:
  - statement: >-
      Dph3/Cbr1/NADH provides reducing equivalents to the Dph1-Dph2
      radical-SAM enzyme during diphthamide biosynthesis.
    supporting_text: Dph3/Cbr1/NADH provides an electron to reduce the 4Fe–4S cluster.
