proposed_new_terms:
- proposed_name: NADH-dependent Dph3 reductase activity
  proposed_definition: >-
    Catalysis of the reaction: 2 Fe(3+)-[Dph3] + NADH = 2 Fe(2+)-[Dph3] +
    NAD(+) + H(+).
  justification: >-
    RHEA:71231 captures the NADH-dependent reduction of Dph3, and
    PMID:27694803 shows that S. cerevisiae Cbr1 performs this reaction in the
    physiological reduction system for the Dph1-Dph2 and Elp3 radical-SAM
    enzymes. GO has terms for the downstream diphthamide and tRNA wobble
    processes, but no molecular-function term for Cbr1's direct Dph3-reducing
    activity. GO:0016651 is the appropriate existing parent because the donor is
    NADH; the Dph3 acceptor is an iron-binding protein rather than a heme
    protein, so GO:0016653 does not fit.
  proposed_parent:
    id: GO:0016651
    label: oxidoreductase activity, acting on NAD(P)H
  supported_by:
  - reference_id: PMID:27694803
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
suggested_questions:
- question: >-
    Should GO add an NADH-dependent Dph3 reductase molecular-function term for
    RHEA:71231 so CBR1-like reductases can be annotated to their direct input
    into Dph3-dependent radical-SAM systems?
- question: >-
    Should the direct S. pombe Cbr1 ER localization from the RIKEN ORFeome YFP
    collection be curated in addition to the current mitochondrial outer
    membrane orthology rows?
- question: >-
    Does the uncharacterized same-subfamily paralog SPAC17H9.12c/O13809 also
    reduce Dph3, and how do cbr1 and SPAC17H9.12c divide the physiological
    input into mcm5s2U and diphthamide biosynthesis in fission yeast?
suggested_experiments:
- hypothesis: >-
    S. pombe cbr1 and SPAC17H9.12c are partly redundant Dph3 reductases, with
    the double deletion impairing Dph3-dependent tRNA wobble modification more
    strongly than either single deletion.
  description: >-
    Construct cbr1, SPAC17H9.12c, and cbr1 SPAC17H9.12c deletion strains;
    measure mcm5s2U formation by gamma-toxin sensitivity and direct tRNA
    modification assays, test diphthamide formation with eEF2/DT assays under
