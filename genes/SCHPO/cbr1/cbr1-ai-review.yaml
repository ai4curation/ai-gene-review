      The manual S. cerevisiae CBR1 transfer supports an inferred core role in
      Dph3/Elp3-dependent mcm5s2U tRNA wobble modification.
    action: ACCEPT
    reason: >-
      S. cerevisiae Cbr1 is the major physiological NADH-dependent reductase for
