- description: Kinetochore-primed, stable engagement of the APC/C. Mad3 is recruited to unattached
    kinetochores through a direct Bub1-TPR/Mad3-TPR interaction downstream of Mph1-phosphorylated Spc7
    MELT motifs and Bub1-Bub3, is phosphorylated by Mph1 on C-terminal sites flanking KEN2, and the
