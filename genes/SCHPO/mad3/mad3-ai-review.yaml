  review:
    summary: NAS row (PomBase) citing Saitoh et al. 2005, a study of Mis6-complex and Nuf2-complex
      requirements for Mad2 and Bub1 kinetochore loading; the cached full text does not mention Mad3, so
      the statement was presumably taken from the authors' general framing of checkpoint proteins
      accumulating at unattached kinetochores. Mad3 kinetochore localisation is directly documented
      elsewhere for this gene.
    action: ACCEPT
    reason: The term is correct and is the site where Mad3 acts in checkpoint signal generation. Millband
      and Hardwick 2002 show that functional Mad3-GFP is recruited to unattached kinetochores early in
      mitosis, accumulates there on prolonged checkpoint activation, and depends on Bub1, Bub3 and Mph1
      but not Mad1 or Mad2 (PMID:11909965), and Leontiou et al. 2019 show that the Bub1 TPR domain
      directly recruits Mad3 (PMID:31257143). The NAS evidence from PMID:15930132 is weak for Mad3
      specifically, but the annotation is supported by direct evidence and is retained as core.
