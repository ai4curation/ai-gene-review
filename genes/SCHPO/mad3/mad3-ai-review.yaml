id: O59767
gene_symbol: mad3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: >-
  mad3 encodes the fission-yeast orthologue of BubR1/Mad3, a 310-residue, non-catalytic spindle
  assembly checkpoint (SAC) protein. Like budding-yeast Mad3, and unlike vertebrate BubR1, it has no
  C-terminal kinase domain: it consists of an N-terminal KEN box (KEN20, KEN1) followed by the
  Bub1/Mad3 TPR-like helical domain (residues ~56-218, crystallised in PDB 4AEZ), and a disordered
  C-terminus carrying a second KEN box (KEN271, KEN2) flanked by ABBA and D-box-like motifs and a
  cluster of Mph1 (Mps1) phosphorylation sites. Fission-yeast Mad3 lacks the GLEBS motif through
  which other Mad3/BubR1 proteins bind Bub3, so Bub3 is not a stable subunit of the S. pombe mitotic
  checkpoint complex (MCC), which consists of Mad3, closed Mad2 and the APC/C activator Slp1
  (Cdc20). Mad3 is a nuclear protein in this closed-mitosis organism. When kinetochores are
  unattached, Mad3-GFP accumulates at them in a Bub1-, Bub3- and Mph1-dependent (but Mad1- and
  Mad2-independent) manner; recruitment is mediated by a direct interaction between the Bub1 TPR
  domain and the Mad3 TPR domain, downstream of Mph1 phosphorylation of Spc7 (KNL1) MELT motifs.
  Within the MCC the Mad3 N-terminal KEN box occupies the degron-binding site of Slp1 and, together
  with Mad2, obstructs substrate recognition by APC/C-Slp1, so that securin (Cut2) and cyclin B
  (Cdc13) are not ubiquitinated and anaphase is delayed. Mad3 and Mad2 associate stably with the
  APC/C every mitosis in a Slp1-, Mad2- and KEN1-dependent manner; MCC formation and APC/C binding
  take place in the nucleoplasm independently of kinetochore targeting, but kinetochore-generated
  modifications, in particular Mph1 phosphorylation of the Mad3 C-terminus near KEN2, are needed to
  stabilise MCC-APC/C binding and to maintain checkpoint arrests, and Mad3 phosphomimetics are more
  potent APC/C inhibitors in vitro. Mad3 is the only checkpoint protein required for overexpressed
  Mad2 to arrest cells in metaphase. mad3 is not essential for viability, but mad3 delta cells are
  hypersensitive to benomyl and carbendazim, cannot arrest when microtubules are absent (nda3-KM311),
  precociously separate sister chromatids, lose minichromosomes at elevated rates and display the cut
  phenotype.
