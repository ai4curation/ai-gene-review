proposed_new_terms: []
suggested_questions:
- question: Fission-yeast Mad3 lacks a GLEBS motif and Bub3 is not a stable MCC subunit, yet Bub3 is
    required for Mad3 kinetochore recruitment. Should the GO definition of mitotic checkpoint complex
    (GO:0033597), which lists Bub3 as a subunit in yeast and mammals, be amended to accommodate the
    three-subunit S. pombe complex, or should a taxon-specific note be added?
- question: Is the C-terminal ABBA/KEN2 region of Mad3 engaging a second Slp1 molecule in vivo (as
    proposed from motif mutagenesis by Sewart and Hauf 2017), and does that second Cdc20-binding event
    represent a distinct inhibitory mechanism from KEN1-mediated MCC formation?
- question: The 2024 reports linking Pmk1 MAPK signalling to stress-induced Slp1 turnover implicate
    Mad3; is this a separable function of Mad3 (e.g. promoting Slp1 autoubiquitination, as budding-yeast
    Mad3 does) or simply a manifestation of canonical MCC-mediated APC/C inhibition?
suggested_experiments:
- hypothesis: Mad3 C-terminal Mph1 phosphorylation and the Bub1-TPR interaction act in the same
    kinetochore-based activation step, so that a Bub1-TPR-binding-defective Mad3 is rescued by
    phosphomimetic C-terminal mutations.
  description: Map the Bub1-TPR-binding surface on the Mad3 TPR domain by mutagenesis guided by the 4AEZ
    structure, confirm loss of binding by size-exclusion chromatography with purified TPR domains, then
    test whether combining the binding-defective allele with the mad3-7D/E phosphomimetic restores
    maintenance of nda3-KM311 and carbendazim checkpoint arrests and MCC-APC/C co-purification.
  experiment_type: genetic
- hypothesis: Fission-yeast Mad3, like budding-yeast Mad3-Bub3, stimulates Slp1 autoubiquitination by
    APC/C, which would provide the mechanism for Mad3-dependent stress-induced Slp1 turnover.
  description: Use the reconstituted S. pombe APC/C assay (purified E1, Ubc1/4/11, APC/C, Slp1) with
    wild-type, KEN20AAA, KEN271AAA and phosphomimetic Mad3 in the presence and absence of closed Mad2,
    and measure Slp1 autoubiquitination versus Cut2 ubiquitination, to determine whether Mad3 promotes
    Slp1 turnover independently of substrate inhibition.
  experiment_type: biochemical
