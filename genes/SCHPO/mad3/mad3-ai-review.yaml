core_functions:
- description: As the Mad3 subunit of the mitotic checkpoint complex (Mad3-closed Mad2-Slp1/Cdc20), Mad3
    uses its N-terminal KEN box, positioned by C-Mad2, to occupy the degron-binding site of the APC/C
    activator Slp1 and, with its C-terminal KEN2/ABBA region, to block substrate recognition by
    APC/C-Slp1, so that securin (Cut2) and cyclin B (Cdc13) are not ubiquitinated and the
    metaphase/anaphase transition is delayed until all kinetochores are attached.
  molecular_function:
