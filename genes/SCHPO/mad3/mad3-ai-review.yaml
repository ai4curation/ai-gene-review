  supporting_entities:
  - PomBase:SPCC1322.12c
  review:
    summary: PomBase IPI from Leontiou et al. 2019 showing that the Bub1 (SPCC1322.12c) TPR domain is
      necessary and sufficient to recruit Mad3 to a tetO array in vivo and that purified Bub1-TPR and
      GFP-Mad3-TPR form a stable complex by size-exclusion chromatography without phosphorylation.
    action: REMOVE
    reason: Bare protein binding is uninformative about what Mad3 does. The interaction is genuine,
      direct and functionally important (it is how Mad3 reaches Bub1/kinetochores in an organism whose
      Mad3 lacks a Bub3-binding GLEBS motif), but on the Mad3 side it is a recruitment event rather
      than a distinct molecular function; the adaptor/scaffold activity belongs to Bub1 and is captured on
      the bub1 review as protein-macromolecule adaptor activity, while Mad3's own function is ubiquitin
      ligase inhibitor activity within the MCC. Removal does not dispute the interaction, which is
      recorded in the notes and in the kinetochore rows.
    supported_by:
    - reference_id: PMID:31257143
      supporting_text: Size exclusion chromatography profiles demonstrate that simply mixing the two
        proteins together in vitro was sufficient to produce a stable Bub1-Mad3 TPR complex.
    - reference_id: PMID:31257143
      supporting_text: SpMad3 interacts with kinetochores in a Bub1-dependent fashion, but SpMad3 lacks
        a Bub3 binding domain of its own [36, 42].
    - reference_id: file:SCHPO/mad3/mad3-deep-research-falcon.md
      supporting_text: The Bub1 TPR domain is therefore necessary and sufficient for recruitment and can
