suggested_questions:
- question: What is the physiological substrate preference of S. pombe Bcp1 (H2O2 versus alkyl or lipid hydroperoxides), and
    which phenotypes does a bcp1 deletion show alone or combined with tpx1 and gpx1 deletions?
suggested_experiments:
- description: Measure peroxide sensitivity, nuclear DNA/chromatin oxidation and stationary-phase survival of bcp1 deletion
    strains, alone and in tpx1 gpx1 backgrounds, and test complementation by peroxidatic-cysteine mutants.
