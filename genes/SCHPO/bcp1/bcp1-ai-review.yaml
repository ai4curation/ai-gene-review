  label: Schizosaccharomyces pombe 972h-
description: bcp1 encodes the single BCP/PrxQ-type peroxiredoxin of Schizosaccharomyces pombe, the ortholog of S. cerevisiae
  Dot5 (nuclear thiol peroxidase). It is a monomeric atypical 2-Cys peroxiredoxin in which the peroxidatic cysteine forms
  an intramolecular disulfide with a resolving cysteine; the disulfide is reduced by thioredoxin, so the enzyme reduces hydrogen
  peroxide and organic hydroperoxides at the expense of the thioredoxin system (EC 1.11.1.24). Recombinant Bcp1 has thioredoxin-dependent
  peroxidase activity comparable to that of the 2-Cys peroxiredoxin Tpx1 but, unlike Tpx1, no holdase chaperone activity.
  A YFP fusion localizes to both nucleus and cytoplasm.
