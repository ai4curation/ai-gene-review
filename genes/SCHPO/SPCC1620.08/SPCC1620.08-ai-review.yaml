  label: Schizosaccharomyces pombe 972h-
description: SPCC1620.08 (UniProt O94415) encodes the beta subunit of mitochondrial succinyl-CoA synthetase
  (ADP-forming; EC 6.2.1.5), the alpha-beta heterodimer that converts succinyl-CoA to succinate with substrate-level
  ATP formation in the TCA cycle. Function is assigned by orthology to S. cerevisiae LSC1/LSC2; it is
  mitochondrial in a genome-wide screen.
