  label: Schizosaccharomyces pombe 972h-
description: pro1 (SPAC821.11; UniProt Q9UT44; the fission yeast PRO2 ortholog) encodes gamma-glutamyl
  phosphate reductase (glutamate-5-semialdehyde dehydrogenase; EC 1.2.1.41). It reduces L-glutamyl-5-phosphate
  to glutamate-5-semialdehyde with NADPH, the second step of proline biosynthesis; the product cyclises
  spontaneously to pyrroline-5-carboxylate. pro1 is a classical proline auxotrophic marker. The enzyme
  is cytosolic in a genome-wide screen.
