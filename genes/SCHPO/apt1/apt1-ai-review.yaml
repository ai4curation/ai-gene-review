  label: Schizosaccharomyces pombe 972h-
description: apt1 (SPAC23A1.03; UniProt O42842) encodes adenine phosphoribosyltransferase (APRT; EC 2.4.2.7).
  It joins adenine and PRPP to make AMP, the main route of adenine salvage. Mutants lacking APRT (dap1)
  resist 2,6-diaminopurine and take up adenine more slowly, because uptake is coupled to phosphoribosylation.
  The enzyme is cytosolic in a genome-wide screen.
