  label: Schizosaccharomyces pombe 972h-
description: sdh4 (tim18; SPBP23A10.16; UniProt Q9P7X0) encodes the small membrane-anchor (SdhD) subunit,
  which binds heme b and ubiquinone with Sdh3, of mitochondrial succinate dehydrogenase (respiratory complex
  II), which oxidises succinate to fumarate in the TCA cycle and passes the electrons through FAD and
  Fe-S clusters to ubiquinone in the inner membrane. Function is assigned by orthology to the S. cerevisiae
  SDH subunits.
