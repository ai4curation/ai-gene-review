- term:
    id: GO:0051287
    label: NAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR019818
  review:
    summary: NAD+ is the cosubstrate of the Idh1/Idh2 isocitrate dehydrogenase; subsidiary to the dehydrogenase activity.
    action: KEEP_AS_NON_CORE
    reason: NAD+ is a substrate of the reaction assigned to S. pombe Idh (UniProt catalytic activity, ECO:0000269 PubMed:10975257), and Idh1 belongs to the NAD-specific isocitrate dehydrogenase family (InterPro IPR004434). Whether NAD binds this subunit or its Idh2 partner in the hetero-octamer is not established for S. pombe, so the row is kept as non-core.
    supported_by:
    - reference_id: file:SCHPO/idh1/idh1-uniprot.txt
