    label: D-galactose catabolic process, Leloir pathway
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0004614
  review:
    action: KEEP_AS_NON_CORE
    summary: 'PomBase IC from GO:0004614: PGM converts the Glc-1-P produced by Gal7 to Glc-6-P, completing
      galactose entry into glycolysis, as captured in the PomBase Leloir GO-CAM. Valid, but the gal cluster
      is silenced in wild-type S. pombe, so this is a conditional role; the constitutive role is Glc-1-P/UDP-glucose
      supply.'
    reason: >-
      The term definition (breakdown of beta-D-galactose via UDP-galactose) does not
      fix the pathway end point at glucose 1-phosphate, and PGM catalyses the step that
      returns galactose carbon to glucose 6-phosphate, so pgm1 does work in the
      process. It is non-core because the pathway operates only when the subtelomeric
      gal cluster is derepressed, and because pgm1 also serves glucose metabolism.
    supported_by:
    - reference_id: file:SCHPO/pgm1/pgm1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the reversible isomerization of alpha-D-glucose 1-
    - reference_id: PMID:21075050
      supporting_text: gal7+, gal10+, and gal1+ are localized close to a chromosomal terminal repressed
        by gene silencing in S. pombe
- term:
    id: GO:0019255
    label: glucose 1-phosphate metabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P37012
  review:
    action: NEW
    summary: Proposed by similarity to S. cerevisiae PGM2 (P37012). Phosphoglucomutase interconverts glucose
      1-phosphate and glucose 6-phosphate, so it catalyses a step of glucose 1-phosphate metabolism itself.
      This is the constitutive process role of pgm1 in wild-type S. pombe, where the gal cluster is silenced.
    reason: >-
      Participation test: the enzyme performs the Glc-1-P to Glc-6-P conversion, so
      the gene product does the work of the process rather than being its substrate.
      Comparator check: the S. cerevisiae ortholog PGM2 carries this term with
      experimental evidence (pgm1 pgm2 double mutants lack phosphoglucomutase
      activity, PMID:8119301; pgm2 deletion raises Glc-1-P eightfold, PMID:10681519),
      and its COMPLETE review accepts those rows. pgm1 appears to be the only canonical PGM in
      S. pombe and is in the same PANTHER clade (PTN000501426) that carries the
      phosphoglucomutase IBA, so the process role transfers. The term is neither an
      ancestor nor a descendant of the Leloir pathway term already on this gene. No
      S. pombe pgm1 mutant data exist, so this is an ISS proposal and the core
      function stays as inferred.
    supported_by:
    - reference_id: file:SCHPO/pgm1/pgm1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=alpha-D-glucose 1-phosphate = alpha-D-glucose 6-phosphate;
    - reference_id: file:SCHPO/pgm1/pgm1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the phosphohexose mutase family.'
    - reference_id: PMID:10681519
      supporting_text: this "metabolic bottleneck" resulted in an 8-fold increase in the Glc-1-P level
        compared with the wild-type strain
    - reference_id: PMID:8119301
      supporting_text: No residual phosphoglucomutase activity could be measured in crude extracts or in
        permeabilized cells of pgm1/2 double mutants.
