  label: Schizosaccharomyces pombe 972h-
description: Phosphoglucomutase of fission yeast (SPBC32F12.10), a phosphohexose mutase family enzyme
  related to budding-yeast PGM2 and human PGM1. Using Mg2+ and a glucose 1,6-bisphosphate intermediate,
  it reversibly interconverts glucose 1-phosphate and glucose 6-phosphate. This links glycolysis and gluconeogenesis
  to UDP-glucose synthesis for cell wall glucans, glycoprotein glycans and trehalose. When the silenced
  gal genes are expressed, it also channels Leloir-pathway glucose 1-phosphate into glycolysis. It localises
  to the cytoplasm and nucleus. Its activity is inferred from orthologs and has not been measured for
  the S. pombe protein.
