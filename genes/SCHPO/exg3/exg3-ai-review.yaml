  label: Schizosaccharomyces pombe 972h-
description: >-
  Schizosaccharomyces pombe exg3 encodes a cytoplasmic glycoside hydrolase
  family 5 beta-1,6-glucanase. Exg3 lacks an obvious extracellular targeting
  signal, is detected mainly in the cytoplasm and excluded from the nucleus in
  a targeted GFP study, hydrolyzes the beta-1,6-glucan substrate pustulan, and
  can accumulate with other wall glucanases at the Myo52-marked mating fusion
  focus where redundant glucanases promote local cell-wall digestion during
  sexual cell fusion.
core_functions:
- description: >-
    Cytoplasmic beta-1,6-glucan hydrolysis by a GH5 glucanase on the fungal
    Exg3/YBR056W branch; Exg3 lacks an obvious export signal and its native
    cytoplasmic substrate or route to cell-wall beta-glucan remains unresolved.
  molecular_function:
    id: GO:0046557
    label: glucan endo-1,6-beta-glucosidase activity
  directly_involved_in:
  - id: GO:0009251
    label: glucan catabolic process
