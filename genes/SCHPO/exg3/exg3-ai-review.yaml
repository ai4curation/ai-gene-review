  original_reference_id: PMID:25825517
  qualifier: is_active_in
  review:
    summary: >-
      Exg3-sfGFP localized to the Myo52-marked mating projection actin fusion
      focus during fission-yeast mating.
    action: KEEP_AS_NON_CORE
    reason: >-
      Dudin et al. directly imaged GFP-tagged Exg3 among a set of fission-yeast
