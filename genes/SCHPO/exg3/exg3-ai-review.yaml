- term:
    id: GO:0070879
    label: fungal-type cell wall beta-glucan metabolic process
  evidence_type: IMP
  original_reference_id: PMID:20852022
  qualifier: involved_in
  review:
    summary: >-
      The PomBase mutant-phenotype row for fungal cell-wall beta-glucan
      metabolism is consistent with Exg3's measured beta-1,6-glucanase
      activity, although the 2010 study did not define an essential vegetative
      wall role for Exg3.
    action: KEEP_AS_NON_CORE
    reason: >-
      Duenas-Santero et al. showed that S. pombe Exg3 overexpression increases
      hydrolysis of the beta-1,6-glucan substrate pustulan. They did not find
      vegetative growth or wall-stress phenotypes in the exg3 single mutant or
      in the exg1 exg2 exg3 triple mutant, so Exg3's normal cytoplasmic
      cell-wall substrate remains incompletely resolved, but the direct
      glucanase activity, UniProt's function statement, and PomBase's full-text
      mutant interpretation support keeping the process row as non-core.
    supported_by:
    - reference_id: PMID:20852022
      supporting_text: >-
        overexpression of exg1 + and exg3 + produced a 3-fold and 6-fold
        increase in activity
    - reference_id: file:genes/SCHPO/exg3/exg3-uniprot.txt
      record_section: [CC:FUNCTION]
      supporting_text: >-
        FUNCTION: Participates in the metabolism of beta-glucan, the main
        structural component of the cell wall. {ECO:0000269|PubMed:20852022}.
- term:
    id: GO:1904541
    label: mating projection tip cell wall disassembly
  evidence_type: IGI
  original_reference_id: PMID:25825517
  qualifier: involved_in
  supporting_entities:
  - PomBase:SPAC20G4.02c
  review:
    summary: >-
      Exg3 contributes to glucanase-dependent mating cell-wall dissolution at
      the fusion focus, but this is a sensitized sexual-fusion role rather than
      the primary vegetative function captured by the glucanase rows.
    action: KEEP_AS_NON_CORE
    reason: >-
      The Dudin et al. fusion-focus study found that Exg3 colocalizes with
      Myo52 at the mating fusion focus and that loss of individual glucanases,
      including exg3, reduced mating fusion in crosses sensitized by fus1
      deletion. This supports involvement in mating projection tip wall
      disassembly, while the sensitized genetic background and additive
      redundancy among several glucanases make it a specialized, non-core
      process annotation for Exg3.
    supported_by:
    - reference_id: PMID:25825517
      supporting_text: >-
        Remarkably, all seven colocalized with Myo52-tdTomato at the fusion
        focus
    - reference_id: PMID:25825517
      supporting_text: >-
        Deletion of each single one of these, except eng1Δ, led to reduction
        in fusion efficiency in crosses to fus1Δ
    - reference_id: PMID:25825517
      supporting_text: >-
        Further combinatorial double and triple deletion of agn2, eng2, and
        exg3 led to progressive decrease in fusion efficiency
