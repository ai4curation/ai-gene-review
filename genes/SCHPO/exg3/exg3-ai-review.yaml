- id: PMID:20852022
  title: Characterization of glycoside hydrolase family 5 proteins in Schizosaccharomyces
    pombe.
  findings:
  - statement: >-
      Exg3 is primarily cytoplasmic in fractionation experiments, whereas Exg1
      is secreted and Exg2 is enriched in the membrane/cell-wall fraction.
    supporting_text: >-
      Exg3 was found mainly in the cytoplasm (supernatant) of the cell
      extracts, with a minor fraction in the pellet.
    reference_section_type: RESULTS
  - statement: >-
      Live imaging of endogenously tagged Exg3-GFP showed diffuse cytoplasmic
      fluorescence that was excluded from the nucleus.
    supporting_text: >-
      the fluorescence was detected as a diffuse cytoplasmic staining excluded
      from the nucleus
    reference_section_type: RESULTS
  - statement: >-
      Exg3, like Exg1 but unlike Exg2, increased beta-1,6-glucanase activity
      against pustulan when overexpressed in fission yeast.
    supporting_text: >-
      overexpression of exg1 + and exg3 + produced a 3-fold and 6-fold
      increase in activity
    reference_section_type: RESULTS
  - statement: >-
      The exg1, exg2, exg3 single mutants and the triple mutant had no obvious
      vegetative growth or cell-wall-stress phenotype in the 2010 assays.
    supporting_text: >-
      similar results were obtained when the triple mutant exg1 Δ exg2 Δ exg3
      Δ was tested
    reference_section_type: RESULTS
  - statement: >-
      The physiological role of cytoplasmic glucanases such as Exg3 was not
      resolved by the biochemical GH5 characterization.
    supporting_text: >-
      The function of cytoplasmic glucanases is not currently known although
      they are present in different yeast organisms.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
