- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000359478
  - UniProtKB:Q14865
  review:
    summary: IBA annotation over-propagated from Opisthokont node PTN000359478, where it is seeded solely by human ARID5B.
    action: REMOVE
    reason: Comparative ARID analyses show that selective cis-regulatory AT-rich DNA recognition is restricted to the vertebrate ARID5 clade (which carries the Loop-L2/Helix-5 Thr-Ser major-groove motif), whereas fungal SWI/SNF subunits (S. cerevisiae Swi1 and S. pombe Sol1, carrying Ala258 at the homologous position) lack these base-specific contacts and engage nucleosomal DNA non-specifically within SWI/SNF.
    supported_by:
    - reference_id: PMID:15640446
      supporting_text: The results indicate that the majority of ARID subfamilies (i.e. five out of seven) bind DNA without obvious sequence preference.
    - reference_id: file:SCHPO/sol1/sol1-notes.md
      supporting_text: Central ARID domain (`InterPro:IPR001606`, aa ~190-281) retains the conserved Helix-1/Loop-L1 `205-RGTPI-209` (`Gly206`) and Helix-4 hydrophobic-core `Trp244`
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000359478
        source_label: PTN000359478
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Seeded solely by human ARID5B (UniProtKB:Q14865, PTHR13964:SF37) on the Opisthokont root PTN000359478; fission yeast Sol1 (PTHR13964:SF27) substitutes Ala258 at the ARID5 Thr388 major-groove site and scaffolds the SWI/SNF complex without sequence-specific cis-regulatory DNA recognition.
