taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Non-catalytic core structural subunit of the 12-subunit ATP-dependent SWI/SNF chromatin-remodeling complex in Schizosaccharomyces pombe (orthologous to Saccharomyces cerevisiae Swi1). Together with the catalytic ATPase Snf22 and core subunits Snf5 and Swi3, Sol1 localizes to nuclear chromatin to promote and repress RNA polymerase II transcription—including direct repression of iron-transport genes—via nucleosome remodeling, while harboring a central ARID fold lacking sequence-specific cis-regulatory AT-rich major-groove determinants.
core_functions:
- description: Non-catalytic architectural scaffold subunit of the 12-subunit fission yeast SWI/SNF chromatin-remodeling complex required for nucleosome remodeling and regulation of RNA polymerase II transcription; no standalone molecular_function is asserted because ATP-dependent chromatin-remodeling catalysis resides in the Snf22/Ssr ATPase subunit and isolated nucleic-acid or activator binding has not been directly assayed on S. pombe Sol1.
  in_complex:
    id: GO:0016514
    label: SWI/SNF complex
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0045815
    label: transcription initiation-coupled chromatin remodeling
  supported_by:
  - reference_id: PMID:17508131
    supporting_text: In the present study we have isolated the spSWI/SNF complex from Schizosaccharomyces pombe, which has at least seven subunits among them spSwi1-like and the catalytic subunit spBrg1.
  - reference_id: PMID:17508131
    supporting_text: Moreover, we have demonstrated that spSWI/SNF is able to promote in vitro transcription by RNA polymerase II (RNAPII) in a reconstituted system.
  - reference_id: PMID:18622392
    supporting_text: Finally, phenotypic and microarray analyses identified widespread requirements for SWI/SNF and RSC on transcription including strong evidence that SWI/SNF directly represses iron-transport genes.
