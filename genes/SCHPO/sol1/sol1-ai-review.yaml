- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission yeast Schizosaccharomyces pombe.
  findings:
  - statement: Proteome-scale YFP-tagging screen in S. pombe localizes Sol1 to the nucleus.
    supporting_text: Next, we determined the localization of 4,431 proteins, corresponding to approximately 90% of the fission yeast proteome, by tagging each ORF with the yellow fluorescent protein.
  full_text_unavailable: true
- id: PMID:17508131
  title: Isolation of a novel complex of the SWI/SNF family from Schizosaccharomyces pombe and its effects on in vitro transcription in nucleosome arrays.
  findings:
  - statement: Purifies the fission yeast spSWI/SNF complex containing the Swi1 homolog Sol1 and the catalytic Snf22 ATPase.
    supporting_text: In the present study we have isolated the spSWI/SNF complex from Schizosaccharomyces pombe, which has at least seven subunits among them spSwi1-like and the catalytic subunit spBrg1.
  - statement: Demonstrates that purified spSWI/SNF promotes RNA polymerase II transcription on reconstituted nucleosome arrays.
    supporting_text: Moreover, we have demonstrated that spSWI/SNF is able to promote in vitro transcription by RNA polymerase II (RNAPII) in a reconstituted system.
  full_text_unavailable: true
- id: PMID:18622392
  title: Fission yeast SWI/SNF and RSC complexes show compositional and functional differences from budding yeast.
  findings:
  - statement: Defines the 12-subunit S. pombe SWI/SNF complex containing Sol1 and shows widespread transcriptional roles including direct repression of iron-transport genes.
    supporting_text: Finally, phenotypic and microarray analyses identified widespread requirements for SWI/SNF and RSC on transcription including strong evidence that SWI/SNF directly represses iron-transport genes.
- id: PMID:15640446
  title: DNA-binding properties of ARID family proteins.
  findings:
  - statement: Establishes that most ARID subfamilies outside the selective AT-rich binders engage DNA without sequence preference.
    supporting_text: The results indicate that the majority of ARID subfamilies (i.e. five out of seven) bind DNA without obvious sequence preference.
- id: file:SCHPO/sol1/sol1-notes.md
  title: Curation Notes for Schizosaccharomyces pombe sol1 (UniProtKB:O74365)
  findings:
  - statement: Documents Sol1 ARID domain residue conservation (Trp244 core scaffold, Ala258 at the ARID5 Thr388 major-groove position).
    supporting_text: Central ARID domain (`InterPro:IPR001606`, aa ~190-281) retains the conserved Helix-1/Loop-L1 `205-RGTPI-209` (`Gly206`) and Helix-4 hydrophobic-core `Trp244`
knowledge_gaps:
- gap_statement: Direct subunit-level nucleic-acid, nucleosome, and transcription-factor binding interfaces of S. pombe Sol1 within spSWI/SNF have not been biochemically or structurally resolved in isolation.
  boundary: Intact 12-subunit spSWI/SNF purification and sol1 deletion transcriptomics are established (PMID:17508131, PMID:18622392), but high-resolution cryo-EM or domain-dissection binding data comparable to budding yeast Swi1 are lacking.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Determines whether Sol1 directly contacts extranucleosomal exit DNA and sequence-specific fission yeast transcriptional repressors/activators at iron-transport promoters.
suggested_questions:
- question: Does the central ARID domain of S. pombe Sol1 contact extranucleosomal exit DNA within spSWI/SNF, or is nucleosomal engagement mediated primarily by its N-terminal region as in budding yeast Swi1?
- question: Which fission yeast transcription factors (such as Fep1) directly recruit Sol1-containing SWI/SNF to repress iron-transport promoters?
suggested_experiments:
- description: Determine a cryo-EM structure of endogenous S. pombe SWI/SNF bound to a mononucleosome to resolve the spatial trajectory of Sol1 and its ARID domain relative to nucleosomal DNA.
- description: Perform EMSA and fluorescence anisotropy DNA-binding titrations with purified recombinant Sol1 ARID domain (aa 190-281) on AT-rich versus GC-rich duplexes and mononucleosomes.
