  review:
    summary: >
      The PTN000484602 Ascomycota IBA assigns the conserved fungal
      mitochondrial localization at the right scope.
    action: ACCEPT
    reason: >
      The PAINT record places mitochondrion on PTN000484602 with an Ascomycota
      taxon constraint, supported by S. cerevisiae, Candida albicans, and a
      UniProtKB fungal source. S. pombe ach1 is an ascomycete PTHR43609:SF1
      member and also has an independent PomBase HDA mitochondrial annotation,
      so the IBA is consistent with both the family tree and target-specific
      localization.
    additional_reference_ids:
    - PMID:12606555
    - PMID:16823372
    supported_by:
