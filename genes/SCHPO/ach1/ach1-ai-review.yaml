id: Q9UUJ9
gene_symbol: ach1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >
  ach1 encodes a member of the fungal Ach1 acetyl-CoA hydrolase/transferase
  family that is predicted to act in the mitochondrial matrix. Budding-yeast
  Ach1 is primarily a succinyl-CoA:acetate CoA-transferase, producing
  acetyl-CoA from mitochondrial acetate, with only minor acetyl-CoA hydrolase
  activity in vitro; the Schizosaccharomyces pombe protein is the
  single-copy ortholog in the same PANTHER subfamily.
existing_annotations:
- term:
    id: GO:0003986
    label: acetyl-CoA hydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - CGD:CAL0000189008
  - PANTHER:PTN000484586
  - SGD:S000000111
  review:
    summary: >
      The PTN000484586 IBA transfers a minor but experimentally observed
      acetyl-CoA hydrolase activity from fungal Ach1 proteins.
    action: KEEP_AS_NON_CORE
    reason: >
      Acetyl-CoA hydrolysis was the historical assignment for S. cerevisiae
      Ach1, and the 2009 re-characterization did not abolish that activity:
      it found low hydrolase activity but showed that the physiologically
      favored reaction is succinyl-CoA:acetate CoA transfer. This IBA is
      therefore plausible for S. pombe ach1, which lies in PTHR43609:SF1, but
      the hydrolase activity should be treated as secondary to acetate
      CoA-transferase activity.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000484586
        source_status: SUPPORTS_TRANSFER
        comment: >
          ach1 is a PTHR43609:SF1 member below the same PAINT node, and the
          hydrolase term is best interpreted as the conserved minor activity
          of the fungal Ach1/CoA-transferase enzyme.
- term:
    id: GO:0003986
    label: acetyl-CoA hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:20289
  - EC:3.1.2.1
  review:
    summary: >
      The EC/Rhea IEA captures an observed but minor acetyl-CoA hydrolase
      activity.
    action: KEEP_AS_NON_CORE
    reason: >
      The RHEA:20289 and EC:3.1.2.1 mapping corresponds to the older
      hydrolase description of Ach1. Fleck and Brock found that S. cerevisiae
      Ach1p has only minor acetyl-CoA hydrolase activity relative to its
      succinyl-CoA:acetate CoA-transferase activity, so this broad enzymatic
      assertion can be retained as non-core.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >
      Cytoplasm is a true but uninformative ancestor location for an enzyme
      whose specific site is the mitochondrial matrix.
    action: TOO_GENERAL
    reason: >
      Current fission-yeast GOA already contains direct HDA evidence for
      mitochondrion and PomBase TAS evidence for mitochondrial matrix.
      Budding-yeast Ach1p also fractionates mostly with mitochondria and
      localizes there by immunofluorescence. The UniProt SubCell cytoplasm
      mapping is therefore not wrong in the broad GO cellular-component
      graph, but should be superseded by the specific mitochondrial
      annotations.
    additional_reference_ids:
    - PMID:12606555
    supported_by:
    - reference_id: PMID:12606555
      supporting_text: >
        By subcellular fractionation, most of the Ach1p in yeast was
        distributed with mitochondria and little Ach1p in the cytoplasm.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: >
      Accept the high-throughput fission-yeast localization assignment to
      mitochondrion.
    action: ACCEPT
    reason: >
      Matsuyama et al. systematically localized YFP-tagged S. pombe proteins,
      and PomBase curated ach1 from that data set as active in mitochondrion.
      This agrees with the Ascomycota PAINT placement on PTN000484602 and
      with direct budding-yeast fractionation and microscopy, so there is no
      evidence of a lineage-specific localization difference.
    additional_reference_ids:
    - PMID:12606555
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: >
        Next, we determined the localization of 4,431 proteins, corresponding
        to approximately 90% of the fission yeast proteome, by tagging each
        ORF with the yellow fluorescent protein.
    - reference_id: PMID:12606555
      supporting_text: >
        By immunofluorescence microscopy, we show that Ach1p and acetyl-CoA
        binding site-mutated constructs, but not its N-terminal deleted
        construct, are localized in mitochondria.
