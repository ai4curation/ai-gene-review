- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026962
  review:
    summary: >
      The ARBA mitochondrial prediction is independently corroborated.
    action: ACCEPT
    reason: >
      Although ARBA is only an electronic source, the same mitochondrial
      localization is supported for S. pombe by PomBase HDA evidence and for
      the fungal Ach1 clade by the PTN000484602 IBA. Keeping this IEA is
      therefore consistent with the stronger curated localization rows.
    additional_reference_ids:
    - PMID:16823372
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: >
