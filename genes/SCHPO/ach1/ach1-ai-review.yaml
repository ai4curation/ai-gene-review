        binding site-mutated constructs, but not its N-terminal deleted
        construct, are localized in mitochondria.
    - reference_id: PMID:16823372
      supporting_text: >
        Next, we determined the localization of 4,431 proteins, corresponding
        to approximately 90% of the fission yeast proteome, by tagging each
        ORF with the yellow fluorescent protein.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000484602
        source_status: SUPPORTS_TRANSFER
        comment: >
