  review:
    summary: >
      Generic CoA-transferase activity is correct but superseded by the
      acetate-specific child term.
    action: TOO_GENERAL
    reason: >
      The N-terminal domain entry IPR003702 is detecting the same
      CoA-transferase family membership covered more specifically by
      IPR046433 and by the accepted GO:0008775 acetate CoA-transferase
      annotations. Because ach1's specific CoA acceptor is acetate, the parent
      transferase term adds no useful coverage.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
