- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: TAS
  original_reference_id: PMID:12606555
  qualifier: is_active_in
  review:
    summary: >
      Retain the mitochondrial matrix assignment inferred by PomBase from
      budding-yeast Ach1p localization and enzymology.
    action: ACCEPT
    reason: >
      The matrix term is consistent with Ach1's mitochondrial acetate
      detoxification reaction and with the S. cerevisiae localization evidence
      cited by PomBase. The cached paper is abstract-only, but PomBase made
      the TAS annotation from the full article, and independent fission-yeast
      HDA plus fungal PAINT rows support a mitochondrial compartment for ach1.
    additional_reference_ids:
    - PMID:16823372
    - PMID:19298859
    supported_by:
    - reference_id: PMID:12606555
      supporting_text: >
        By subcellular fractionation, most of the Ach1p in yeast was
        distributed with mitochondria and little Ach1p in the cytoplasm.
    - reference_id: PMID:19298859
      supporting_text: >
        Our results imply that Ach1p is involved in mitochondrial acetate
        detoxification by a CoASH transfer from succinyl-CoA to acetate.
- term:
    id: GO:0006083
    label: acetate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000189008
  - PANTHER:PTN000484586
  - SGD:S000000111
  review:
    summary: >
      The PTN000484586 acetate-metabolism IBA follows from conserved
      succinyl-CoA:acetate CoA-transferase activity.
    action: ACCEPT
    reason: >
      Fungal Ach1 proteins use acetate as the CoA acceptor in the
      succinyl-CoA:acetate CoA-transferase reaction, and S. cerevisiae
      genetics place ACH1 in acetate utilization and detoxification. S. pombe
      ach1 is in the same PTHR43609:SF1 subfamily and has no evidence of loss,
      so the broad acetate metabolic process IBA is an appropriate biological
      process annotation.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >
        Complementation of an ach1 mutant with the coaT gene reversed the
        growth defect on acetate confirming the in vivo function of Ach1p as a
        CoA-transferase.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000484586
        source_status: SUPPORTS_TRANSFER
        comment: >
          The node captures the conserved fungal Ach1 reaction that consumes
          acetate to form acetyl-CoA.
- term:
    id: GO:0006083
    label: acetate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR046433
  review:
    summary: >
      The InterPro2GO acetate-metabolism mapping is consistent with the Ach1
      family-specific PAINT assertion.
    action: ACCEPT
    reason: >
      IPR046433 is the Ach1 acetyl-CoA hydrolase/transferase entry and maps to
      the same acetate metabolic process supported by PTN000484586. The 2009
      S. cerevisiae re-characterization identifies acetate as the CoA acceptor
      for Ach1p's main reaction, supporting the process term for the S. pombe
      family member.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
- term:
    id: GO:0006085
    label: acetyl-CoA biosynthetic process
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0008775
  review:
    summary: >
      Ach1's acetate CoA-transferase reaction directly forms acetyl-CoA from
      acetate.
    action: ACCEPT
    reason: >
      PomBase inferred this biological-process term from acetate
      CoA-transferase activity, which is exactly the S. cerevisiae Ach1p
      reaction favored in vitro and invoked in mitochondrial acetate
      detoxification. No non-obsolete, current GO descendant is needed for the
      fission-yeast annotation.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
- term:
    id: GO:0008260
    label: succinyl-CoA:3-oxo-acid CoA-transferase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P55809
  review:
    summary: >
      Remove the ISO transfer of the human ketone-body 3-oxoacid
      CoA-transferase specificity.
    action: REMOVE
    reason: >
      The supported Ach1 reaction transfers CoA from succinyl-CoA to acetate,
      not to a 3-oxo-acid acceptor. GO:0008260 is the narrower ketone-body
      succinyl-CoA:3-oxo-acid CoA-transferase activity represented by the ISO
      donor UniProtKB:P55809, whereas the fungal PTHR43609 Ach1 node carries
      acetate CoA-transferase activity. This is a specificity mismatch, not
      merely a missing direct assay on S. pombe ach1.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:P55809
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >
          The source supports succinyl-CoA:3-oxo-acid CoA transfer, but Ach1's
          supported acceptor is acetate.
- term:
    id: GO:0008410
    label: CoA-transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
