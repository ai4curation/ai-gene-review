id: O14106
gene_symbol: rrg8
aliases:
  - SPAC31G5.06
  - rgg8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: >-
  rrg8 (SPAC31G5.06) is a small (234-residue) fungal protein of unknown molecular
  function whose mitochondrial role is supported by orthology. Its budding-yeast
  ortholog RRG8/YPR116W (alias MTA1) is one of
  several accessory factors required for efficient 5'-end processing of mitochondrial
  tRNAs: it associates with the mitochondrial inner membrane, sediments as a
  high-molecular-weight complex, and co-purifies with Rpm2p, the protein subunit of
  mitochondrial RNase P (the endonuclease that cleaves the 5' leader of pre-tRNAs).
  Loss of the ortholog reduces mitochondrial tRNA levels and causes respiratory
  deficiency and defects in mitochondrial genome maintenance and mitochondrial protein
  synthesis. In fission yeast, where loss of mitochondrial DNA is lethal, deletion of
  rrg8 is inviable. The fission-yeast protein carries no recognizable domain, catalytic
  motif, or match to the RRG8 family signature PF17068/IPR031415 found on the budding-yeast
  ortholog. No direct biochemical activity has been demonstrated for either protein; the
  S. pombe role in mitochondrial tRNA processing and gene expression is inferred from
  ortholog genetics rather than measured directly.
references:
  - id: file:SCHPO/rrg8/rrg8-hypotheses/free-text-schizosaccharomyces-pombe-rrg8-is-a-conserved-mitochondrial-rnase-p-associated-accesso/openscientist.md
    title: 'OpenScientist hypothesis report: conservation of the mitochondrial tRNA-processing
      role of S. pombe Rrg8'
    findings:
      - statement: >-
          The mitochondrial tRNA-processing assignment is partially supported as a manual
          orthology transfer, but remains unverified in S. pombe; approximately 23% pairwise
          identity, absence of the donor's Pfam match on O14106, and a low-confidence O14106
          AlphaFold model make direct experimental confirmation especially important.
        supporting_text: >-
          **Verdict: Partially supported (orthology-based; unverified in *S. pombe*).**
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Generated-report provenance and the quoted verdict were checked. Its pairwise-identity,
        domain, and AlphaFold comparisons are treated as computational curation leads rather than
        independent experimental evidence.
