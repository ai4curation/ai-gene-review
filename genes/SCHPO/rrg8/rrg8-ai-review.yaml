    review:
      summary: >-
        Electronic (UniProt Subcellular Location keyword-mapping) nuclear annotation, ultimately
        derived from a high-throughput C-terminal YFP-tagging screen.
      action: UNDECIDED
      reason: >-
        The nucleus call traces to the genome-scale YFP-tagging ORFeome screen (PMID:16823372)
        via UniProt Subcellular Location and GO_REF:0000044, so it ultimately reflects a direct
        S. pombe localization experiment despite the IEA evidence code. It conflicts with the
        mitochondrial ISO transfer from the characterized S. cerevisiae ortholog. Because the
        cached paper is abstract-only and accessible searches did not expose the rrg8-specific
        image/table, there is not enough evidence to decide whether the nuclear signal is genuine,
        condition-dependent, or an artifact. UniProt preserves the protein-specific experimental
        attribution, whereas the current PomBase GOA curates only mitochondrion as a specific
        organellar location. Retain as UNDECIDED pending inspection or replication of the image.
