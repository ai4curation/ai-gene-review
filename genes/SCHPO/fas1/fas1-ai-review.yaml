  label: Schizosaccharomyces pombe 972h-
description: fas1 (SPAC926.09c) encodes the beta subunit of the fission yeast type I fatty acid synthase (FAS),
  the orthologue of S. cerevisiae FAS1 (48% identity). Six fas1 beta and six fas2 (lsd1) alpha subunits form a 2.1-2.4
  MDa barrel-shaped alpha6beta6 complex containing about six FMN. The beta subunit carries the acetyltransferase
  that primes the acyl carrier protein with acetyl-CoA, the malonyl/palmitoyl transferase that loads malonyl units
  and transfers the finished acyl chain to CoA, the 3-hydroxyacyl-ACP dehydratase, and the FMN-dependent NADPH enoyl-ACP
  reductase; the alpha subunit supplies the acyl carrier, ketoacyl synthase, ketoacyl reductase and phosphopantetheinyl
  transferase. Together they convert acetyl-CoA, malonyl-CoA and NADPH into long-chain (C16/C18) acyl-CoA in the
  cytosol. The subunit composition matches the budding-yeast enzyme.
