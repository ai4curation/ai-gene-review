  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Atg101, the HORMA-domain stabiliser of Atg13 in the autophagy
  initiation complex. Rank 1 is an exact GOA match with EXP and IDA evidence and is the most informative
  single term for this protein. Ranks 2 to 5 then enumerate selective-autophagy subtypes - nucleophagy,
  micropexophagy, mitophagy - that are S. cerevisiae phenomena or are not established for S. pombe
  Atg101, and one of them is obsolete. Assessment: 1 correct not novel (CNN), 1 uncertain (UNC), 1
  nonparalog incorrect (NPI).
