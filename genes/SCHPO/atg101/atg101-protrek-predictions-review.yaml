  predicted_term:
    id: GO:0000426
    label: micropexophagy
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 16.72). Micropexophagy is a selective pathway for peroxisome degradation characterised
      in Pichia and Saccharomyces. Atg101 is a core initiation factor and core Atg machinery is generally
      shared between bulk and selective autophagy, so participation cannot be excluded outright -
      but it has not been shown for S. pombe Atg101 and this review's evidence is for macroautophagy
      and autophagosome formation. Ranks 4 and 5 continue with two more selective subtypes, so the
      list resolves the complex correctly once and then guesses at cargo four times.
    supported_by:
    - reference_id: file:SCHPO/atg101/atg101-uniprot.txt
      supporting_text: >-
        Autophagy-related protein 101
