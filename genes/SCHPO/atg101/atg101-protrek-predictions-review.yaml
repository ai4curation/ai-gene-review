  predicted_term:
    id: GO:0044805
    label: late nucleophagy
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 17.27). Late nucleophagy is a budding-yeast selective-autophagy pathway, and the
      term is obsolete in the current GO release. Atg101 is required for bulk macroautophagy in S.
      pombe; no nucleophagy role is reported. Note also that S. cerevisiae has no ATG101 gene at all,
      so budding-yeast selective-autophagy terms are a particularly poor source for this protein.
    supported_by:
    - reference_id: file:SCHPO/atg101/atg101-uniprot.txt
      supporting_text: >-
        Belongs to the ATG101 family
