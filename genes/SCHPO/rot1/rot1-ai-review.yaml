  description: >-
    Rot1 is inferred to be a conserved ER membrane chaperone or
    chaperone-associated folding factor in fission yeast, by orthology to the
    experimentally characterized budding-yeast Rot1 and by its membership in
    the PTHR28090:SF1 fungal Rot1 subfamily.
  supported_by:
  - reference_id: PMID:18508919
    supporting_text: >-
