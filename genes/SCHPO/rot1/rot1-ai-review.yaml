id: O14103
gene_symbol: rot1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  rot1 encodes the fission-yeast member of the conserved fungal Rot1 family,
  an endoplasmic-reticulum membrane protein inferred to support folding and
  maturation of newly synthesized secretory-pathway proteins. The PomBase
  ORFeome localization places rot1 in the endoplasmic reticulum, matching the
  fungal PAINT node and the experimentally characterized budding-yeast Rot1 ER
  membrane chaperone.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      The PomBase no-data molecular-function placeholder is still appropriate:
      rot1 has no target-specific molecular-function assay.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      S. pombe rot1 has direct ER localization evidence and inherits the
      conserved PTHR28090 de novo folding process, but the exact biochemical or
      chaperone activity of the fission-yeast protein remains inferred from
      budding-yeast Rot1 rather than assayed in S. pombe.
    supported_by:
    - reference_id: file:SCHPO/rot1/rot1-notes.md
      supporting_text: >-
        Newer-paper search: PMID:40846641 was already cached in the yeast ROT1
        review and reinforces Rot1 as a UPR-independent ER chaperone in
        budding yeast. A 2026 C. albicans paper, PMID:42042339, directly
        characterizes CaROT1; it corroborates conservation of the Rot1 family
        but does not add target-specific S. pombe evidence.
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: The fission-yeast ORFeome survey localized rot1 to the ER.
    action: ACCEPT
    reason: >-
      This high-throughput direct ER localization agrees with the conserved
      Rot1-family ER membrane placement at PTN001999053 and with direct
      S. cerevisiae Rot1p evidence showing that Rot1 is an ER-localized
      membrane protein.
    additional_reference_ids:
    - PMID:16567426
    supported_by:
    - reference_id: PMID:16823372
      supporting_text: >-
        Here we report a proteome-scale study of the fission yeast
        Schizosaccharomyces pombe based on cloning of the ORFeome.
    - reference_id: PMID:16567426
      supporting_text: >-
        Rot1p was found to be an essential, ER-localized membrane protein facing
        the lumen.
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR019623
  review:
    summary: >-
      The InterPro Rot1 family mapping to ER localization is consistent with the
      more specific fungal ER-membrane PAINT placement.
    action: ACCEPT
    reason: >-
      IPR019623 is the Rot1 family and maps to the correct ER compartment.
      PTN001999053 and UniProtKB-SubCell refine the component to endoplasmic
      reticulum membrane, but this broader ER row is not misleading.
    additional_reference_ids:
    - PMID:16567426
    supported_by:
    - reference_id: PMID:16567426
      supporting_text: >-
        Rot1p was found to be an essential, ER-localized membrane protein facing
        the lumen.
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN001999053
  - SGD:S000004813
  review:
    summary: >-
      PTN001999053 correctly places ER-membrane Rot1 localization on the
      Dikarya node that contains fission-yeast rot1.
    action: ACCEPT
    reason: >-
      The fission-yeast protein is the single local Rot1 ortholog in the
      PTHR28090:SF1 Rot1 subfamily. PTN001999053 propagates the ER-membrane
      row from the directly characterized S. cerevisiae ROT1 seed, and there is
      no evidence of relocation in S. pombe.
    additional_reference_ids:
    - PMID:16567426
    supported_by:
    - reference_id: PMID:16567426
      supporting_text: >-
        Rot1p was found to be an essential, ER-localized membrane protein facing
        the lumen.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001999053
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTN001999053 is the Dikarya Rot1 node carrying ER membrane and de
          novo protein folding for PTHR28090 descendants including S. pombe
          rot1.
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0097
  review:
    summary: UniProtKB-SubCell correctly maps the inferred Rot1 location to ER membrane.
    action: ACCEPT
    reason: >-
      The UniProt subcellular-location transfer agrees with the PTHR28090
      Dikarya IBD and with the direct S. cerevisiae ER membrane localization of
      Rot1.
    additional_reference_ids:
    - PMID:16567426
    supported_by:
    - reference_id: PMID:16567426
      supporting_text: >-
        Rot1p was found to be an essential, ER-localized membrane protein facing
        the lumen.
- term:
    id: GO:0006458
    label: '''de novo'' protein folding'
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001999053
  - SGD:S000004813
  review:
    summary: >-
      The fungal Rot1 PAINT node correctly propagates de novo protein-folding
      involvement to fission-yeast rot1.
    action: ACCEPT
    reason: >-
      PTN001999053 places the process on a Dikarya Rot1 ancestor, and the
      S. pombe protein is not a paralog outside that node. Budding-yeast Rot1
      physically and genetically supports folding of secretory-pathway clients,
      so a Rot1-family de novo folding role is the appropriate inherited core
      process.
    additional_reference_ids:
    - PMID:18508919
    supported_by:
    - reference_id: PMID:18508919
      supporting_text: >-
        Recombinant Rot1 exhibited antiaggregation activity in vitro, which was
        partly impaired by a temperature-sensitive rot1-2 mutation.
    - reference_id: PMID:18508919
      supporting_text: >-
        In vivo, the rot1-2 mutation caused accelerated degradation of five
        proteins in the secretory pathway via ER-associated degradation,
        resulting in a decrease in their cellular levels.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001999053
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The same Dikarya Rot1 node carries ER membrane and de novo protein
          folding, matching the conserved ER chaperone role of the family.
- term:
    id: GO:0006458
    label: '''de novo'' protein folding'
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR019623
  review:
    summary: The InterPro Rot1 de novo folding transfer matches the PAINT call.
    action: ACCEPT
    reason: >-
      IPR019623 is a Rot1-specific family entry, and its GO mapping agrees with
      the current PTHR28090 PAINT placement and budding-yeast experimental
      evidence for Rot1-dependent folding of secretory-pathway proteins.
    additional_reference_ids:
    - PMID:18508919
    supported_by:
    - reference_id: PMID:18508919
      supporting_text: >-
        Rot1 functions as a chaperone in vivo supporting the folding of those
        proteins.
- term:
    id: GO:0034975
    label: protein folding in endoplasmic reticulum
  evidence_type: IC
  original_reference_id: GO_REF:0000036
  qualifier: involved_in
  supporting_entities:
  - GO:0005789
  - GO:0006457
  review:
    summary: >-
      PomBase's IC row captures the ER context of the conserved Rot1 folding
      process.
    action: ACCEPT
    reason: >-
      The IC inference combines the directly observed fission-yeast ER
      localization with inherited protein-folding biology, exactly matching the
      conserved ER membrane chaperone model for Rot1.
    additional_reference_ids:
    - PMID:16567426
    - PMID:18508919
    supported_by:
    - reference_id: PMID:16567426
      supporting_text: >-
        Rot1p was found to be an essential, ER-localized membrane protein facing
        the lumen.
    - reference_id: PMID:18508919
      supporting_text: >-
        Rot1 functions as a chaperone in vivo supporting the folding of those
        proteins.
