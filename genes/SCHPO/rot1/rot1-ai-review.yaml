knowledge_gaps:
- gap_statement: >-
    The direct molecular activity of S. pombe Rot1 has not been measured, so
    its exact activity remains inferred from budding-yeast antiaggregation and
    client-stability assays rather than established in fission yeast.
  boundary: >-
    rot1 localizes to the ER and falls in the compact fungal Rot1 subfamily
    whose S. cerevisiae member is an ER chaperone, and PomBase has already
    inferred ER protein folding from the localization and folding evidence.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    A direct assay would distinguish protein folding chaperone activity from a
    chaperone-associated cofactor role for fission-yeast Rot1.
  resolution: >-
    Purify S. pombe Rot1 for antiaggregation assays, or use conditional
    depletion with ER client stability and glycoprotein-maturation reporters.
  provenance:
  - reference_id: file:SCHPO/rot1/rot1-notes.md
    supporting_text: >-
      Newer-paper search: PMID:40846641 was already cached in the yeast ROT1
      review and reinforces Rot1 as a UPR-independent ER chaperone in budding
      yeast. A 2026 C. albicans paper, PMID:42042339, directly characterizes
      CaROT1; it corroborates conservation of the Rot1 family but does not add
      target-specific S. pombe evidence.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does S. pombe Rot1 directly support Ost3-dependent glycoprotein maturation,
    as S. cerevisiae and C. albicans Rot1 do?
suggested_experiments:
- experiment_type: conditional depletion and glycoprotein maturation assay
  hypothesis: >-
    Fission-yeast rot1 supports ER folding and glycosylation of a subset of
    secretory-pathway clients.
  description: >-
    Deplete or repress rot1 and measure ER-stress sensitivity,
    secretory-pathway client stability, and glycosylation of matched reporters.
