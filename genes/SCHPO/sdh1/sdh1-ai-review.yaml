description: sdh1 (SPAC1556.02c; UniProt Q9UTJ7) encodes the flavoprotein (SdhA) subunit, carrying covalent
  FAD and the succinate-binding site, of mitochondrial succinate dehydrogenase (respiratory complex II),
  which oxidises succinate to fumarate in the TCA cycle and passes the electrons through FAD and Fe-S
  clusters to ubiquinone in the inner membrane. Function is assigned by orthology to the S. cerevisiae
  SDH subunits.
