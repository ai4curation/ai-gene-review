- term:
    id: GO:0008177
    label: succinate dehydrogenase (quinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011281
  - RHEA:40523
  - EC:1.3.5.1
  review:
    summary: EC/InterPro mapping; the reaction is right but belongs to complex II, not the flavoprotein alone.
    action: MODIFY
    reason: 'By similarity to human SDHA (P31040) and family membership (forward-direction SdhA signature IPR011281) the curated reaction is EC 1.3.5.1, succinate + quinone = fumarate + quinol. GO:0008177 is the overall reaction of the four-subunit complex: quinone is reduced at the Sdh3/Sdh4 membrane anchor after electrons pass through the Sdh2 Fe-S clusters, so the flavoprotein contributes to it (as the IBA row states) rather than enabling it alone. What the FAD-bearing subunit itself catalyses is succinate oxidation, GO:0000104 succinate dehydrogenase activity, the parent term. This follows the human SDHA review.'
    proposed_replacement_terms:
    - id: GO:0000104
      label: succinate dehydrogenase activity
    supported_by:
    - reference_id: file:SCHPO/sdh1/sdh1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=a quinone + succinate = fumarate + a quinol;'
    - reference_id: file:SCHPO/sdh1/sdh1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR011281; Succ_DH_flav_su_fwd.'
