  review:
    summary: Ma et al. (2007) isolated asn1 in a forward screen for auxotrophs and showed it is required for asparagine biosynthesis;
      the asn1 mutant is an asparagine auxotroph (abstract-only cache, consistent with the UniProt disruption phenotype).
      The single S. pombe gene contrasts with the redundant ASN1/ASN2 pair of S. cerevisiae, whose single mutants have no
      phenotype.
    action: ACCEPT
    supported_by:
    - *id004
    - *id003
    - reference_id: PMID:8951815
      supporting_text: Simultaneous disruption of both genes leads to a total asparagine auxotrophy, while disruption of asn1
        or asn2 alone has no effect on growth under tested conditions.
