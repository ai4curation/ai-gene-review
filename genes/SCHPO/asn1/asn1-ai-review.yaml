  label: Schizosaccharomyces pombe 972h-
description: Glutamine-dependent asparagine synthetase (EC 6.3.5.4) of Schizosaccharomyces pombe (SPBC119.10). It uses ATP
  and the amide nitrogen of L-glutamine to convert L-aspartate to L-asparagine, releasing L-glutamate, AMP and diphosphate.
  Unlike S. cerevisiae, which has two redundant asparagine synthetases (ASN1, ASN2), fission yeast has a single gene, and
  its disruption causes asparagine auxotrophy, so asn1 is the sole route of asparagine synthesis. GFP-tagged asn1 is cytoplasmic
  with some nuclear signal.
