taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pdb1 (SPBC30D10.13c; UniProt Q09171) encodes the E1 beta subunit of the mitochondrial pyruvate
  dehydrogenase complex, which with pda1 forms the E1 component that makes acetyl-CoA from pyruvate. pdb1
  complements S. pombe mutants partly deficient in PDH; such (agg) mutants need arginine or glutamine
  because 2-oxoglutarate supply from the TCA cycle is limited.
existing_annotations:
- term:
    id: GO:0004739
    label: pyruvate dehydrogenase (acetyl-transferring) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000178974
  - PomBase:SPBC30D10.13c
  - RGD:1359146
  - SGD:S000000425
  - UniProtKB:C8VRK6
  review:
    summary: "PAINT inference; E1 beta subunit of pyruvate dehydrogenase."
    action: ACCEPT
    reason: "Pdb1 is the E1 beta subunit; the E1 (EC 1.2.4.1) activity is carried out by the alpha2beta2 heterotetramer, so the activity belongs to the E1 heterotetramer of which Pdb1 is one half. UniProt records the E1 reaction for this entry with experimental evidence from PMID:7828917, whose abstract shows that the pdb1 ORF restores PDH enzyme activity to PDH-defective S. pombe strains (the source of the separate IMP row, cited here as corroboration of this inferred row); PANTHER places it in the mitochondrial E1 beta subfamily."
    supported_by:
    - reference_id: file:SCHPO/pdb1/pdb1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=N(6)-[(R)-lipoyl]-L-lysyl-[protein] + pyruvate + H(+) = N(6)-
    - reference_id: PMID:7828917
      supporting_text: Plasmids containing the ORF complemented the PDH-defective strains of Sz. pombe
        both for growth and for enzyme activity.
