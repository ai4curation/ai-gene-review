  label: Schizosaccharomyces pombe 972h-
description: dld1 (SPAC1002.09c; UniProt O00087) encodes mitochondrial dihydrolipoyl dehydrogenase (lipoamide
  dehydrogenase, E3; EC 1.8.1.4), a homodimeric FAD-dependent disulfide oxidoreductase. It reoxidises
  the dihydrolipoyl arms of the E2 subunits of the pyruvate, 2-oxoglutarate and branched-chain 2-oxoacid
  dehydrogenase complexes, and of the H protein of the glycine cleavage system, passing electrons to NAD+.
  As the single shared E3, it links glycolysis to the TCA cycle, runs the TCA cycle itself, and supports
  branched-chain amino acid catabolism and mitochondrial one-carbon supply. It is mitochondrial in a genome-wide
  screen; catalytic function is assigned by orthology to S. cerevisiae LPD1.
