  label: Schizosaccharomyces pombe 972h-
description: hem3 (SPAC24B11.13; UniProt Q09899) encodes hydroxymethylbilane synthase
  (porphobilinogen deaminase, HMBS; EC 2.5.1.61), a cytosolic enzyme that carries a covalent
  dipyrromethane cofactor. It polymerises four porphobilinogen units, one at a time, into the linear
  tetrapyrrole hydroxymethylbilane, the third step of heme biosynthesis. Function is assigned by
  orthology to S. cerevisiae HEM3 and the HMBS family; a genome-wide screen places hem3 in the
  cytoplasm.
