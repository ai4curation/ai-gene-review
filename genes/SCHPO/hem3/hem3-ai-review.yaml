- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:P28789
  review:
    summary: Similarity transfer (is_active_in nucleus) from S. cerevisiae HEM3, whose only nuclear
      evidence is a genome-wide GFP signal that its own review keeps as an observed, non-functional
      location. The S. pombe screen placed hem3 in the cytoplasm. Transferring an incidental
      high-throughput signal as a site of activity exceeds the evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: No nuclear activity is known for PBG deaminase in either yeast; an is_active_in nucleus
      claim propagated from a GFP-survey signal over-states the evidence, though nuclear presence of
      a small soluble enzyme is not ruled out.
    supported_by:
    - reference_id: PMID:14562095
      supporting_text: We classify these proteins, representing 75% of the yeast proteome, into 22
        distinct subcellular localization categories
