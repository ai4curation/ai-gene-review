  review:
    summary: 'IMP from Schweingruber et al. 1992, which isolated tnr3 as a regulatory mutant: tnr3 mutants constitutively
      express thiamine-repressible genes (pho4, nmt1) and accumulate 10-20-fold more intracellular thiamine. tnr3
      is thiamine pyrophosphokinase, which consumes thiamine; the overproduction phenotype reflects loss of ThDP-dependent
      repression of the THI regulon, not participation of tnr3 in thiamine synthesis (no step of thiamine formation
      is catalysed by TPK). The phenotype is genuine, so not removed, but the process term over-interprets an indirect
      regulatory effect; the S. cerevisiae THI80 review likewise rejected thiamine biosynthetic process.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Indirect: derepression via loss of the ThDP signal; TPK performs no step of thiamine biosynthesis.'
    supported_by:
