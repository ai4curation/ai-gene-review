suggested_questions:
- question: How is the ThDP-hydrolysing Nudix activity of tnr3 kept from futile cycling against its own TPK product
    in vivo, and is oxythiamin/oxothiamin diphosphate the main physiological substrate?
- question: Is the regulatory phenotype of tnr3 (derepression of nmt1/pho4, constitutive mating) fully explained
    by loss of the ThDP signal, or does the TPK protein itself act in signalling?
suggested_experiments:
- description: Separate the TPK and Nudix domains of tnr3 by point mutation (Nudix-box catalytic glutamates) and
    test growth on oxythiamin, ThDP levels and THI-regulon repression in S. pombe.
