taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: tnr3 (SPAC6F12.05c) encodes the thiamine pyrophosphokinase (TPK, EC 2.7.6.2) of fission yeast, the
  orthologue of S. cerevisiae THI80. The 569-residue protein has an N-terminal Nudix hydrolase domain fused to a
  C-terminal TPK region. The TPK region transfers a pyrophosphate group from ATP to thiamine, forming thiamine diphosphate
  (ThDP), the active cofactor; tnr3 mutants have reduced ThDP and TPK activity, are complemented by THI80, and disruption
  is lethal. Because ThDP is the signal for thiamine-mediated repression, tnr3 hypomorphs were first isolated as
  regulatory mutants that constitutively express thiamine-repressible genes (nmt1, pho4), accumulate thiamine, and
  show altered mating and growth. The fused Nudix domain hydrolyses ThDP and, preferentially, the diphosphates of
  the damaged thiamin derivatives oxythiamin and oxothiamin, which is thought to pre-empt their incorporation into
  ThDP-dependent enzymes; it lacks thiamin monophosphate phosphatase activity. The protein is cytosolic.
