  label: Schizosaccharomyces pombe 972h-
description: ade5 (SPCC569.08c; UniProt synonym ade8) encodes the 207-residue monofunctional phosphoribosylglycinamide
  formyltransferase (GAR transformylase, EC 2.1.2.2) of fission yeast, the ortholog of S. cerevisiae ADE8
  and of the GART domain of the trifunctional animal GART protein. It transfers a formyl group from 10-formyltetrahydrofolate
  to glycinamide ribonucleotide (GAR), forming N2-formyl-N1-(5-phospho-D-ribosyl)glycinamide (FGAR), the
  third step of de novo purine synthesis to IMP. The S. pombe protein has not been characterised biochemically;
  its function rests on the conserved GART-family formyltransferase domain with its catalytic residue
  and on orthology. It is expected to be a soluble cytosolic enzyme.
