suggested_questions:
- question: Is S. pombe ade5 the only route to FGAR, i.e. does an ade5 deletion cause complete adenine
    auxotrophy, and is it sometimes referred to as ade8 in older literature (UniProt lists ade8 as a synonym,
    while PomBase ade8 is a different gene)?
suggested_experiments:
- description: Delete ade5 and test adenine auxotrophy and GAR accumulation; assay recombinant ade5 for
    10-formyl-THF-dependent GAR transformylase activity.
