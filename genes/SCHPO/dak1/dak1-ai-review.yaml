suggested_questions:
- question: >-
    The enzymology (PMID:16535475) argued DHAK II is kinetically more important, whereas
    deletion genetics (PMID:20396879) show dak1 dominates through higher expression. Which
    purified isoenzyme corresponds to which locus in strain 972, given that strain IFO 0354 carries an extra
    dak2-like gene absent from 972?
suggested_experiments:
- description: >-
    Measure DHA and D-glyceraldehyde kinase kinetics of purified dak1 and dak2 from strain 972
    side by side, and quantify each protein in glycerol-grown cells, to settle the relative
    contributions of the two paralogs.
