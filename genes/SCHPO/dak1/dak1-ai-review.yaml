  label: Schizosaccharomyces pombe 972h-
description: >-
  Dihydroxyacetone kinase 1 of Schizosaccharomyces pombe, a cytosolic two-domain (DhaK/DhaL)
  ATP-dependent kinase of the DAK family. It phosphorylates dihydroxyacetone to dihydroxyacetone
  phosphate, the second step of the dihydroxyacetone route of glycerol assimilation downstream of
  the glycerol dehydrogenase gld1, and also phosphorylates glyceraldehyde at lower rates. The
  purified recombinant homodimer has a micromolar Km for dihydroxyacetone. dak1 is the major
  dihydroxyacetone kinase for growth on glycerol and dihydroxyacetone, being expressed more highly
  than its paralog dak2 (about 44% identical); both genes are repressed by glucose. Loss of
  dihydroxyacetone kinase also sensitizes cells to dihydroxyacetone.
