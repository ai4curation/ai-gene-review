    supporting_text: In this study, we found that in both S. pombe and Saccharomyces cerevisiae, Atg8 physically interacts with Hfl1, a vacuole membrane protein. This interaction promotes the localization of Atg8 at the vacuole membrane in a lipidation-independent manner.
