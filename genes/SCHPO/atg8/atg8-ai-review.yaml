id: O94272
gene_symbol: atg8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Atg8 is a conserved ubiquitin-like autophagy factor that is processed and conjugated to phosphatidylethanolamine to decorate phagophores and autophagosomes, where it supports autophagosome assembly, maturation, and selective autophagy through interactions with AIM-containing proteins. In fission yeast, Atg8 also binds Hfl1 and is recruited to the fungal-type vacuole membrane for a lipidation-independent role in vacuole organization.
