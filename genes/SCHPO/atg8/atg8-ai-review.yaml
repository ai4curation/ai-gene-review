    reason: The autophagosome maturation assertion is placed on the same eukaryotic ATG8 node as autophagosome assembly and PE binding. S. pombe atg8 has no paralog split or target-specific loss that would argue against inheritance, and its Atg38, Atg43, Epr1, and Npr1 interactions all fit an Atg8 scaffold that brings receptor or core factors to autophagic membranes during productive autophagosome biogenesis.
