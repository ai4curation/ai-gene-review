    label: nucleophagy
  evidence_type: IDA
  original_reference_id: PMID:41917004
  qualifier: involved_in
  review:
    summary: A 2026 fission-yeast study showed that Atg8 colocalizes with Npr1 and Epr1 on nuclear-envelope protrusions that become nucleophagy-cargo-containing autophagosomes.
    action: NEW
    reason: "Atg8 passes the participation test for a nucleophagy annotation: it is recruited by Atg8-binding nuclear-envelope receptors and is present on protrusions that detach as autophagosomes containing nuclear cargo, so Atg8 is part of the machinery that builds the autophagic structure around the cargo, not the cargo itself."
    supported_by:
    - reference_id: PMID:41917004
      supporting_text: During nucleophagy, the nuclear envelope (NE) forms outward protrusions where Atg8 co-localizes with Npr1 and/or Epr1. These protrusions subsequently detach from the NE, resulting in the formation of autophagosomes that contain nucleophagy cargo.
      reference_section_type: ABSTRACT
