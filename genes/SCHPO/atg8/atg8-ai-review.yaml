    supporting_text: Npr1 is an Atg8-binding multi-transmembrane protein localized to the outer nuclear membrane. It functions redundantly with another autophagy receptor, Epr1, to promote nitrogen starvation-induced nucleophagy.
    reference_section_type: ABSTRACT
  - statement: During fission-yeast nucleophagy, Atg8-positive nuclear-envelope protrusions detach to form autophagosomes that contain nucleophagy cargo.
