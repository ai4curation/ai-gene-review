  label: Schizosaccharomyces pombe 972h-
description: SPAC56E4.03 (UniProt O14192) encodes a PLP-dependent aromatic amino acid aminotransferase
  of the ARO8/ARO9 type (EC 2.6.1.57). By orthology, it transaminates phenylpyruvate and 4-hydroxyphenylpyruvate
  to phenylalanine and tyrosine, the final steps of their synthesis, and may also work in the reverse,
  catabolic direction in the Ehrlich pathway. It is cytosolic in a genome-wide screen. Which of the S.
  pombe aminotransferases provides the main aromatic transaminase activity in vivo has not been tested.
