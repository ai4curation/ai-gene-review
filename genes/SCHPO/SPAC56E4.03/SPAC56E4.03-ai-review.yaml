  qualifier: enables
  review:
    summary: Curator statement of tyrosine aminotransferase activity; consistent with the ARO8/ARO9-type
      aromatic aminotransferase family.
    action: ACCEPT
    reason: UniProt assigns aromatic amino acid transaminase activity by similarity to S. cerevisiae
      ARO8 (P53090), with a curated aromatic amino acid:2-oxoglutarate reaction line. Tyrosine is one
      of the aromatic substrates of ARO8-type enzymes; tyrosine use by the S. pombe protein has not
      been assayed, so this rests on the ARO8 orthology.
