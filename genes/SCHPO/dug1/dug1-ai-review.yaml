  label: Schizosaccharomyces pombe 972h-
description: Cys-Gly metallodipeptidase Dug1 of Schizosaccharomyces pombe, a peptidase M20A-family protein
  (CNDP2/Dug1 clade) and ortholog of S. cerevisiae Dug1 and human CNDP2. By analogy with the characterised
  budding-yeast enzyme it is a Zn2+/Mn2+-dependent homodimeric dipeptidase that hydrolyses L-cysteinylglycine
  to L-cysteine and glycine with high specificity. Genetic analysis showed that dug1 is the only Cys-Gly
  peptidase in S. pombe, so it performs the final step of glutathione degradation, cleaving the Cys-Gly
  released by the gamma-glutamyl transpeptidases Ggt1/Ggt2 and by the ChaC-type cyclotransferase Ggg1,
  and allowing glutathione to be used as a cysteine source. It localises to the cytosol (and is also seen
  in the nucleus).
