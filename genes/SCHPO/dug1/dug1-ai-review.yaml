suggested_questions:
- question: Does S. pombe have a functional DUG-type (Dug2-Dug3) glutathione-cleaving complex upstream
    of Dug1, or is Ggg1 the main cytosolic source of Cys-Gly?
suggested_experiments:
- hypothesis: S. pombe Dug1 is a Cys-Gly-specific metallodipeptidase like S. cerevisiae Dug1.
  description: Purify S. pombe Dug1 and determine kinetics on Cys-Gly versus other dipeptides with Zn2+/Mn2+;
    measure Cys-Gly accumulation in a dug1 deletion.
