  label: Schizosaccharomyces pombe 972h-
description: SPCC13B11.03c (SPCC13B11.03c; UniProt O94250) is one of two fission yeast glyoxalase II paralogs
  (SPCC13B11.03c and glo2), metallo-beta-lactamase-fold hydroxyacylglutathione hydrolases (EC 3.1.2.6).
  They hydrolyse S-D-lactoylglutathione, made by glyoxalase I (glo1), to D-lactate and glutathione, completing
  methylglyoxal detoxification and recycling GSH. Both are assigned by orthology to S. cerevisiae GLO2/GLO4,
  which differ in localisation (cytosolic versus mitochondrial). In S. pombe both are cytosolic and nuclear
  in the genome-wide screen, and how the two divide the work is unknown.
