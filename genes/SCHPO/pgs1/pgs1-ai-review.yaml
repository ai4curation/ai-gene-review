  label: Schizosaccharomyces pombe 972h-
description: Mitochondrial CDP-diacylglycerol--glycerol-3-phosphate 3-phosphatidyltransferase (phosphatidylglycerophosphate
  synthase, PGPS; EC 2.7.8.5) of fission yeast. It transfers the phosphatidyl group of CDP-diacylglycerol
  to sn-glycerol 3-phosphate, forming phosphatidylglycerophosphate (PGP) and CMP; this is the committed
  step of the phosphatidylglycerol/cardiolipin branch of CDP-DAG-dependent phospholipid synthesis. The
  S. pombe enzyme was purified to homogeneity from mitochondrial membranes as a ~60 kDa polypeptide that
  depends on lipid activators (phosphatidic acid, CDP-DAG and especially cardiolipin), and its activity
  in cell extracts is regulated by growth phase and inositol. It belongs to the CDP-alcohol phosphatidyltransferase
  class-II (phospholipase D-like, HKD motif) family and is the ortholog of S. cerevisiae Pgs1. PGP is
  dephosphorylated to phosphatidylglycerol by gep4, and crd1 then forms cardiolipin.
