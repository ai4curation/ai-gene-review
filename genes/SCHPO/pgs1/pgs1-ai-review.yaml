- term:
    id: GO:0016024
    label: CDP-diacylglycerol biosynthetic process
  evidence_type: EXP
  original_reference_id: PMID:1324908
  qualifier: involved_in
  review:
    summary: PomBase EXP annotation of pgs1 to 'CDP-diacylglycerol biosynthetic process' from the Gaynor
      & Greenberg study of CDP-DG synthase, PGP synthase, PI synthase and PS synthase regulation. pgs1
      encodes PGP synthase, which CONSUMES CDP-diacylglycerol (the phosphatidyl donor) and produces PGP;
      CDP-DAG formation from PA and CTP is catalysed by CDP-DG synthase (cds1, and tam41 in mitochondria).
      The paper measured CDP-DG synthase as a separate enzyme activity, so the term most likely reflects
      that activity being attached to the wrong gene product or a mis-chosen term.
    action: REMOVE
    reason: 'Contradicted by the reaction pgs1 catalyses: CDP-DAG is its substrate, not its product. Removal
      is based on the enzyme chemistry, not on the paper''s accessibility; the correct process for pgs1
      (PG/CL biosynthesis) is already annotated.'
    supported_by:
    - reference_id: file:SCHPO/pgs1/pgs1-uniprot.txt
      supporting_text: Reaction=a CDP-1,2-diacyl-sn-glycerol + sn-glycerol 3-phosphate = a
    - reference_id: PMID:1324908
      supporting_text: membrane-associated phospholipid biosynthetic enzymes CDP-DG synthase, phosphatidylglycerolphosphate
        (PGP) synthase
