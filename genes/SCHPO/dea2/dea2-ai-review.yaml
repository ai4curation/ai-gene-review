  label: Schizosaccharomyces pombe 972h-
description: dea2 (SPBC1198.02; UniProt Q9P6I7) encodes adenine deaminase (EC 3.5.4.2), a fungal-type
  enzyme related to adenosine deaminases in the zinc amidohydrolase family. It deaminates adenine to hypoxanthine,
  which is then salvaged by HGPRT (hpt1) or catabolised to urate. The S. pombe gene was cloned and the
  recombinant enzyme purified and characterised; it also cleaves some N6-substituted adenines. It is cytosolic
  in a genome-wide screen.
