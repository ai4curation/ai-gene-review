    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000336851
  review:
    summary: UniRule nickel binding; follows from the Ni-ARD assignment, not the Fe-type salvage enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: Family-level evidence only (curated HAMAP rule MF_03154). The rule allows either Fe or Ni in the active site and ties nickel to the off-pathway 3-(methylsulfanyl)propanoate-forming reaction; nickel binding follows the Ni-ARD assignment over-annotated above, while the iron form is the one that supplies the methionine salvage pathway. No S. pombe metal analysis exists, so this remains a judgement, not a refutation.
    supported_by:
    - reference_id: file:SCHPO/adi1/adi1-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: 'Iron-binding promotes an acireductone dioxygenase reaction producing 2-keto-4- methylthiobutyrate, while nickel-binding promotes an acireductone dioxygenase reaction producing 3-(methylsulfanyl)propanoate.'
    - reference_id: file:SCHPO/adi1/adi1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Ni-containing acireductone dioxygenase (Ni-ARD) produces methylthiopropionate, carbon monoxide and formate, and does not lie on the methionine recycle pathway.'
