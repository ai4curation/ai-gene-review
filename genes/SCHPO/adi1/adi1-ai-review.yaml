- term:
    id: GO:0010308
    label: acireductone dioxygenase (Ni2+-requiring) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004313
  - RHEA:14161
  - EC:1.13.11.53
  - UniRule:UR000336851
  review:
    summary: EC/RHEA mapping of the Ni2+-requiring ARD reaction, which gives formate and 3-methylthiopropanoate
      instead of the methionine precursor. Fungal and animal ARDs are Fe-type enzymes in the salvage pathway.
      Matches the S. cerevisiae ADI1 review.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Family-level evidence only (curated HAMAP rule MF_03154; no S. pombe assay). The HAMAP text itself separates the two metal forms: the Ni form is off the methionine salvage pathway, while the Fe form makes the methionine precursor in the salvage pathway, the role the gene is annotated to (L-methionine cycle, Fe-ARD). The rule allows either metal, so nothing verbatim excludes Ni-ARD for S. pombe; the over-annotation call is a judgement that the salvage-pathway Fe form is the physiological one, shared with the S. cerevisiae ADI1 review.'
    supported_by:
    - reference_id: file:SCHPO/adi1/adi1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Ni-containing acireductone dioxygenase (Ni-ARD) produces methylthiopropionate, carbon monoxide and formate, and does not lie on the methionine recycle pathway.'
    - reference_id: file:SCHPO/adi1/adi1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Fe-containing acireductone dioxygenase (Fe-ARD) produces formate and 2-keto-4- methylthiobutyrate (KMTB), the alpha-ketoacid precursor of methionine in the methionine recycle pathway.'
