  label: Schizosaccharomyces pombe 972h-
description: adi1 (SPBC887.01; UniProt O94286) encodes acireductone dioxygenase (ARD; EC 1.13.11.54),
  a cupin-fold metalloenzyme. In its Fe2+ form it oxidises 1,2-dihydroxy-3-keto-5-methylthiopentene to
  4-methylthio-2-oxobutanoate (the methionine keto acid) and formate, the penultimate step of the MTA
  cycle; a transaminase then completes methionine regeneration. Function is assigned by orthology to S.
  cerevisiae ADI1; a genome-wide screen places it in the cytosol.
