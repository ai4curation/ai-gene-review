  label: Schizosaccharomyces pombe 972h-
description: Tpi1 (SPCC24B10.21; also called tpi) is the triose-phosphate isomerase of the fission yeast
  Schizosaccharomyces pombe, a 249-residue TIM-barrel enzyme that is a homodimer by similarity. It catalyses
  the reversible isomerisation of dihydroxyacetone phosphate and D-glyceraldehyde 3-phosphate, allowing
  both triose phosphates produced by aldolase to proceed through lower glycolysis and balancing the triose
  pool during gluconeogenesis. The S. pombe gene complements a S. cerevisiae tpi1 mutant, and the protein
  localises to the cytosol.
