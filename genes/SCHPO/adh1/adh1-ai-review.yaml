- id: PMID:15040954
  title: A distinct type of alcohol dehydrogenase, adh4+, complements ethanol fermentation in an adh1-deficient
    strain of Schizosaccharomyces pombe.
  findings:
  - statement: Single- and double-gene disruption identifies Adh1 and Adh4 as the enzymes sustaining fermentative
      ethanol production under the tested conditions. Adh4 compensates for loss of Adh1.
    supporting_text: only these two ADHs produce ethanol for fermentative growth
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports the genetic conclusion; no claim is made to have inspected its full
      experimental detail. Cached abstract consulted; full text is not available in the supported cache.
- id: PMID:3546317
  title: Kinetic characterization of yeast alcohol dehydrogenases. Amino acid residue 294 and substrate
    specificity.
  findings:
  - statement: Cloned S. pombe ADH was characterized alongside yeast isozymes, supporting NAD-dependent
      alcohol activity and ethanol/butanol substrate breadth.
    supporting_text: The mechanisms for all five enzymes were predominantly ordered with ethanol (but
      partially random with butanol)
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct recombinant enzyme characterization. Cached abstract consulted; full text is
      not available in the supported cache.
