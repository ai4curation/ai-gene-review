taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Adh1 is the major cytosolic zinc-dependent alcohol dehydrogenase of Schizosaccharomyces pombe.
  It reduces pyruvate-derived acetaldehyde to ethanol using NADH, regenerating NAD+ for glycolysis. The
  recombinant enzyme also catalyzes alcohol oxidation, including ethanol and butanol. In adh1-null cells
  the structurally distinct Adh4 enzyme can sustain ethanol production; disruption of both genes abolishes
  fermentative growth under the conditions tested.
