suggested_questions:
- question: Does adh1 contribute to the reported lifespan extension by adh1 overexpression through NAD+
    regeneration, or through lowering acetaldehyde?
suggested_experiments:
- description: Measure ethanol yield, NAD+/NADH ratio and growth of adh1 null, adh4 null and double mutants
    under fully anaerobic glucose culture to quantify each ADH's share of fermentative flux.
