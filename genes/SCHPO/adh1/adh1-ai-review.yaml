  label: Schizosaccharomyces pombe 972h-
description: adh1 (SPCC13B11.01) encodes the main alcohol dehydrogenase of fission yeast, a cytosolic
  zinc-dependent medium-chain dehydrogenase/reductase (EC 1.1.1.1) of the same family as Saccharomyces
  cerevisiae ADH1. It uses NADH to reduce acetaldehyde, made by pyruvate decarboxylase, to ethanol. This
  regenerates the NAD+ used at the glyceraldehyde-3-phosphate dehydrogenase step of glycolysis and makes
  ethanol the main fermentation product of S. pombe, a strongly glucose-fermenting yeast. The recombinant
  enzyme was characterised kinetically alongside the budding-yeast isozymes; it has methionine at the
  substrate-pocket position 294 like budding-yeast ADH I. It binds two Zn2+ ions per subunit and is predicted
  to be a homotetramer. adh1 null cells still ferment because the unrelated iron-family adh4 is induced,
  and only the adh1 adh4 double mutant fails to grow fermentatively.
