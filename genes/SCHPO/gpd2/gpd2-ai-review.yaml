suggested_questions:
- question: Does S. pombe Gpd2, like S. cerevisiae Gpd2, serve as a redox sink for cytosolic NADH under anaerobic or respiration-limited
    growth, and why does its loss cause histidine or lysine auxotrophy?
suggested_experiments:
- description: Measure glycerol production and anaerobic or respiration-inhibited growth of gpd2 and gpd1 gpd2 mutants, and
    test whether the histidine/lysine auxotrophy is suppressed by alternative NADH sinks (e.g. acetoin) or by glycerol supplementation.
