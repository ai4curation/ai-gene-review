taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: gpd2 encodes the second, constitutively expressed NAD-dependent glycerol-3-phosphate dehydrogenase of Schizosaccharomyces
  pombe (EC 1.1.1.8), about 60% identical to the osmo-inducible isozyme gpd1. Gpd2 reduces dihydroxyacetone phosphate to sn-glycerol
  3-phosphate with NADH in the cytoplasm and contributes to de novo glycerol synthesis, but, unlike gpd1, it is expressed
  at a low level regardless of medium osmolarity and is not the main source of osmoregulatory glycerol. gpd2 deletion mutants
  show an unexplained histidine or lysine auxotrophy on minimal medium.
