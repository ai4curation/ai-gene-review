taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  cgs1 encodes the regulatory subunit of fission-yeast protein kinase A. Cgs1
  binds cAMP and the catalytic subunit Pka1 to form the cAMP-dependent protein
  kinase holoenzyme, restraining Pka1 catalytic activity until cAMP binding
  releases the catalytic subunit. The protein acts in the cytoplasm and nucleus,
  and Cgs1-dependent control of Pka1 activity and localization connects
  glucose-responsive cAMP signaling with sexual differentiation, stationary
  phase, osmotic and calcium responses.
