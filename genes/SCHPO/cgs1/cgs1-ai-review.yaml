proposed_new_terms: []
suggested_questions:
- question: >-
    Which factor or modification causes the condition-specific
    nuclear-cytoplasmic redistribution of Cgs1 and Pka1 during glucose
    limitation, hyperosmotic stress, calcium treatment, and karyogamy?
- question: >-
    Does Cgs1 promote Pka1 phosphorylation by recruiting a Pka1 kinase, by
    protecting phosphorylated Pka1 from dephosphorylation, or indirectly by
    changing the subcellular pool in which Pka1 resides?
suggested_experiments:
- description: >-
    Map Cgs1 domains and residues required for Pka1 binding, cAMP-dependent
    release, and glucose- or stress-induced redistribution by alanine scanning
    and live-cell imaging of endogenous Cgs1/Pka1 fluorescent fusions.
  experiment_type: mutagenesis and live-cell imaging
- description: >-
    Identify Cgs1-associated factors under glucose-rich, glucose-limited, and
    calcium-stress conditions using affinity purification/mass spectrometry of
    functional tagged Cgs1, then test whether candidates alter Pka1
    phosphorylation and localization.
  experiment_type: affinity purification and mass spectrometry
