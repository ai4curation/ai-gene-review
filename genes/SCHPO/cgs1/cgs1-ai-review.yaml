core_functions:
- description: >-
    Cgs1 is the cAMP-binding regulatory subunit of fission-yeast PKA: it binds
    cAMP and Pka1, participates in the cAMP-dependent protein kinase holoenzyme,
    and inhibits Pka1 catalytic activity in the cytosol and nucleus until cAMP
    binding releases the catalytic subunit.
