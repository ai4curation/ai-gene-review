    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: PMID:18621924
  title: >-
    Regulation of the subcellular localization of cyclic AMP-dependent protein
    kinase in response to physiological stresses and sexual differentiation in
    the fission yeast Schizosaccharomyces pombe.
  findings:
  - statement: >-
      Cgs1-GFP is concentrated in the nucleus and more diffusely present in the
      cytoplasm during log-phase growth.
    supporting_text: >-
      Cgs1p and Pka1p are concentrated in the nucleus and more diffusely
      present in the cytoplasm.
    reference_section_type: ABSTRACT
  - statement: >-
      Cgs1 is required for Pka1 redistribution during glucose limitation,
      hyperosmotic growth, and karyogamy.
    supporting_text: >-
      Cgs1p is required for subcellular redistribution of Pka1p induced by
      growth in glucose-limited and hyperosmotic media and during karyogamy
    reference_section_type: ABSTRACT
