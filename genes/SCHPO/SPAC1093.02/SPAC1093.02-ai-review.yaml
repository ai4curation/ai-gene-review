      record_section: ["CC:PATHWAY"]
      supporting_text: "Cofactor metabolism; pyridoxal 5'-phosphate salvage; pyridoxal
        5'-phosphate from pyridoxine 5'-phosphate: step 1/1."
    - reference_id: file:SCHPO/SPAC1093.02/SPAC1093.02-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: "Catalyzes the oxidation of either pyridoxine 5'-phosphate (PNP) or pyridoxamine
