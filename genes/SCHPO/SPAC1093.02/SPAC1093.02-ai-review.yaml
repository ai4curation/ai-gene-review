  review:
    summary: 'PAINT inference of a mitochondrial location, inherited within the pyridoxamine 5''-phosphate oxidase family; peripheral to the PLP salvage function.'
    action: KEEP_AS_NON_CORE
    reason: "The IBA places SPAC1093.02 inside the PNPO clade whose characterised members (S. cerevisiae Pdx3 and Arabidopsis AT5G49970, the PAINT sources) carry the organellar location, and nothing specific to the S. pombe protein argues for loss of it. The UniProt record has no SUBCELLULAR LOCATION comment and no transit peptide, so there is no direct S. pombe evidence either way; the support is family membership. Kept as non-core because the location is not where the core PLP salvage activity has been shown to act."
