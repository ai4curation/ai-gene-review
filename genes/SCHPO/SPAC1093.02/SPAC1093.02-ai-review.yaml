  label: Schizosaccharomyces pombe 972h-
description: SPAC1093.02 (UniProt Q9UTQ1; the fission yeast PDX3 ortholog) encodes pyridoxine/pyridoxamine
  5'-phosphate oxidase (EC 1.4.3.5), an FMN-dependent enzyme that oxidises PNP and PMP to PLP. It is part
  of B6 salvage downstream of pyridoxal kinase. Function is assigned by orthology.
