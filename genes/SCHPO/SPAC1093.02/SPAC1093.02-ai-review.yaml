- term:
    id: GO:0008615
    label: pyridoxine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000659
  review:
    summary: InterPro mapping to pyridoxine biosynthesis; PNPO acts in salvage interconversion rather
      than the fungal de novo route (snz1).
    action: MODIFY
    reason: PNPO-family membership and UniProt's by-similarity function statement (ECO:0000250)
      place the enzyme at the PNP/PMP -> PLP step, which UniProt's PATHWAY assigns to PLP salvage.
      The enzyme consumes pyridoxine 5'-phosphate rather than forming pyridoxine, so the legacy
      InterPro2GO mapping is laterally replaced by PLP biosynthesis (GO:0042823), which the gene
      already carries by IBA.
    proposed_replacement_terms:
    - id: GO:0042823
      label: pyridoxal 5'-phosphate biosynthetic process
    supported_by:
