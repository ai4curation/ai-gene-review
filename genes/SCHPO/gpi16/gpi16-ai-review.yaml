core_functions:
- description: Non-catalytic PIG-T subunit of the ER GPI-anchor transamidase. Its lumenal domain stabilises
    the catalytic Gpi8 subunit and the assembled complex, which cleaves the C-terminal GPI-attachment signal
    of precursor proteins and attaches the preassembled GPI anchor to them.
