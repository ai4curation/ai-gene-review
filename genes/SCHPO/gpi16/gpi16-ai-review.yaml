suggested_questions:
- question: Does fission-yeast Gpi16 form an intermolecular disulfide with Gpi8 as mammalian PIG-T does
    with PIGK, or does it behave like budding-yeast Gpi16, which reportedly does not?
- question: Should GO represent the accessory-subunit role of PIG-T family proteins with a molecular-function
    term (for example a contributes_to transamidase activity, or a protein-stabilising activity), given
    that PAINT and human PIGT currently carry none?
suggested_experiments:
- description: Construct a conditional (shut-off) gpi16 allele in fission yeast and test for accumulation
    of the complete GPI lipid and of unprocessed GPI precursor proteins, as was done for budding-yeast
    Gpi16, together with tests of cell-wall integrity.
  experiment_type: genetic depletion with lipid and protein biochemistry
- description: Purify tagged fission-yeast Gpi8 from digitonin extracts and identify co-purifying subunits
    by mass spectrometry, to confirm that Gpi16 is part of the native complex in this species.
  experiment_type: affinity purification and mass spectrometry
