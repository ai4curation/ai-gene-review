description: Gpi16 (SPBC1604.15) is the fission-yeast member of the PIG-T/Gpi16 family and a predicted
  non-catalytic subunit of the endoplasmic-reticulum GPI-anchor transamidase, the multisubunit complex
  (Gpi8/PIG-K, Gaa1/GPAA1, Gpi16/PIG-T, Gpi17/PIG-S and Gab1/PIG-U) that cleaves the C-terminal GPI-attachment
  signal of precursor proteins and joins the newly exposed C terminus to a preassembled GPI anchor. The
  545-residue type-I membrane protein has an N-terminal signal peptide, a large lumenal PIG-T domain, a
  single C-terminal transmembrane helix and a short cytosolic tail. By orthology to budding-yeast Gpi16
  and mammalian PIG-T, it is expected to stabilise the catalytic Gpi8 subunit and the assembled complex
  and to help hold substrate proteins, whereas the cysteine-protease chemistry of the reaction belongs
  to Gpi8. The protein localises to the ER in fission yeast; its function there has not been tested directly
  in this species.
