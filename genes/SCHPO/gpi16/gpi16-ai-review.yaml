    summary: No molecular activity has been demonstrated for Gpi16 itself; the PANTHER/PAINT node that
      supplies its complex and process terms carries no molecular-function assertion.
    action: ACCEPT
    reason: 'Retain the ND root annotation. Complex membership and participation in GPI attachment do
