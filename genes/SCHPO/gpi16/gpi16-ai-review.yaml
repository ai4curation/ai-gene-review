- term:
    id: GO:0031505
    label: fungal-type cell wall organization
  evidence_type: NAS
  original_reference_id: PMID:15003443
  qualifier: involved_in
  review:
    summary: Many fission-yeast GPI-anchored proteins are cell-wall proteins, so GPI attachment is upstream
      of cell-wall assembly; Gpi16 itself acts in the ER and does none of the work of organising the wall.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ComplexPortal NAS row propagates a downstream consequence of the complex's output to every
      subunit. Gpi16 contributes to attaching anchors to precursor proteins in the ER; organising the
      cell wall is carried out by the GPI-anchored glycoproteins and cell-wall enzymes that are processed
      later. Being needed upstream of a process is not taking part in it. No fission-yeast gpi16 mutant
      cell-wall phenotype has been reported, and the cited paper predicts GPI-attachment signals rather
      than testing Gpi16. The annotation is not false at the level of the complex, so it is flagged rather
      than removed.
    supported_by:
    - *id002
    - reference_id: file:SCHPO/gpi16/gpi16-deep-research-falcon.md
      supporting_text: no retrieved study directly connected an O94380 mutation to those phenotypes
