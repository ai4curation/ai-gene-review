id: O94380
gene_symbol: gpi16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Gpi16 is the PIG-T-family accessory subunit of the endoplasmic-reticulum GPI-anchor transamidase
  complex. Its large lumenal domain and C-terminal membrane anchor support assembly and function of the
  machinery that attaches preformed GPI anchors to proteins. The catalytic cleavage/transamidation chemistry
  belongs to the Gpi8/PIG-K subunit, rather than to Gpi16 alone.
