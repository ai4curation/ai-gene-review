id: Q9P3V0
gene_symbol: wtf4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  wtf4 is a member of the wtf (with Tf) multigene family of Schizosaccharomyces pombe
  and encodes a natural poison-antidote meiotic driver. A single locus produces two
  proteins from two largely overlapping transcripts with distinct start sites: a
  full-length antidote (isoform 1, 366 aa) and an N-terminally truncated poison
  (isoform 2, in which residues 1-44 are replaced by the dipeptide ML). Both are
  multi-pass membrane proteins with eight predicted transmembrane helices and belong
  to the Pfam WTF family (PF03303). The poison self-assembles into dispersed
  cytoplasmic aggregates that are toxic to developing ascospores and acts in trans,
  reaching every spore in the ascus through the shared epiplasm; the antidote is
  retained in the spores that inherit the allele, co-assembles with the poison, and
  reroutes the co-aggregate to the vacuole, where it is no longer toxic.
  Neutralization requires both co-assembly and aggregate trafficking, and exploits
  host autophagy and vacuolar-trafficking machinery rather than any activity encoded
  by wtf4 itself. The asymmetry between a trans-acting poison and a cis-limited
  antidote kills the meiotic products that do not inherit the locus, so the allele is
  over-transmitted from heterozygotes. The molecular basis of the poison's toxicity
  is unknown, and no Gene Ontology molecular-function term currently describes an
  intra-organismal gamete killer.
functional_isoforms:
- id: WTF4_ANTIDOTE
  name: Wtf4antidote (isoform 1)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q9P3V0-1
  description: >-
    The full-length 366-aa product of the long transcript, carrying the 44-residue
    N-terminal extension (disordered, basic-and-acidic-rich) that the poison lacks.
    Produced only in spores that inherit the wtf4 allele, so it acts in cis and
    rescues only those spores. It co-assembles with the Wtf4poison and promotes
    trafficking of the co-aggregate to the vacuole, which neutralizes it; both
    co-assembly and trafficking are required, and mutations disrupting either are
    lethal in the presence of the poison. NOTE ON TYPE: the two isoforms arise by
    alternative transcription initiation, not alternative splicing.
    FunctionalIsoformTypeEnum has no value for alternative initiation, so
    SPLICE_VARIANT is used as the closest available placeholder and misstates the
    mechanism; see wtf4-notes.md.
  isoform_specific_terms:
  - id: GO:0140311
    label: protein sequestering activity
- id: WTF4_POISON
  name: Wtf4poison (isoform 2)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q9P3V0-2
  description: >-
    The short product of the overlapping downstream-initiating transcript, in which
    residues 1-44 of the antidote are replaced by ML (VSP_060942). It forms dispersed
    toxic aggregates and acts in trans: it is found in all four spores of the ascus
    regardless of genotype, reaching them via the ascus epiplasm, and destroys those
    that do not also express the cognate antidote. Its function is strictly opposed to
    that of isoform 1 from the same locus, which is why the two must be kept distinct.
    Same caveat on type as WTF4_ANTIDOTE.
  isoform_specific_terms:
  - id: GO:0072324
    label: ascus epiplasm
