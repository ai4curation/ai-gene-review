- term:
    id: GO:0000324
    label: fungal-type vacuole
  evidence_type: HDA
  original_reference_id: PMID:16823372
  qualifier: is_active_in
  review:
    summary: >-
      Vacuolar localization of the S. pombe 972 protein on overexpression, and the one
      experimental row whose subject is unambiguously Q9P3V0.
    action: ACCEPT
    reason: >-
      A genome-wide GFP overexpression screen in vegetative cells would normally be a
      weak basis for a meiosis-specific protein, but this particular result is
      explicitly endorsed by the later mechanistic study, which cites it as the
      S. pombe counterpart of its own findings. The vacuole is also where
      neutralization of the poison occurs, so the location is mechanistically central
      rather than incidental. Retained as core.
    supported_by:
    - reference_id: PMID:33108274
      supporting_text: >-
        Interestingly, S. pombe wtf4, the homolog of the S. kambucha wtf4 allele used
        in this study, was previously shown to localize both inside the vacuole and as
        large cytoplasmic inclusions when overexpressed in S. pombe vegetative growth
        (Matsuyama et al., 2006).
- term:
    id: GO:0000324
    label: fungal-type vacuole
  evidence_type: IDA
  original_reference_id: PMID:33108274
  qualifier: is_active_in
  review:
    summary: >-
      The vacuole is the site at which the antidote neutralizes the poison; this is
      the core cellular location of the drive mechanism.
