- term:
    id: GO:0110134
    label: meiotic drive
  evidence_type: IMP
  original_reference_id: PMID:28631612
  qualifier: involved_in
  review:
    summary: >-
      The core biological process of the gene, and the reason it exists; accepted,
      with the species caveat recorded rather than used against it.
    action: ACCEPT
    reason: >-
      Deletion/heterozygosity analysis gave 93% transmission of wtf4+ over wtf4-delta
      with a matching drop in spore viability, which is drive by definition. The one
      honest caveat is that the assays used the S. kambucha allele, whereas the
      S. pombe-specific result in this paper is the two-start-site meiotic transcript
      architecture; the 972 allele's own transmission bias has not been measured
      directly. That is a reason to flag the evidence strength, not to doubt the claim:
      the gene has the family signature, the meiotic expression, the dual-transcript
      architecture and the poison/antidote isoform pair, and PomBase curators read the
      full text. Accepted as core.
    supported_by:
    - reference_id: PMID:28631612
      supporting_text: >-
        We did, however, observe strong drive (93% transmission) of Sk wtf4+ relative
        to Sk wtf4Δ in diploid 14
    - reference_id: PMID:28631612
      supporting_text: >-
        This revealed that Sp wtf4 is transcribed during meiosis and generates two
        major overlapping transcripts with different start sites
- term:
    id: GO:0140549
    label: spore inner membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:A0A218N034
  review:
    summary: >-
      Taxonomically impossible: GO:0140549 is the bacterial endospore membrane and is
      restricted to Bacteria, so it cannot apply to a fission yeast ascospore.
    action: REMOVE
    reason: >-
      GO:0140549 is defined as "The membrane surrounding the spore core (endospore
      core) that separates it from its external environment" and carries the taxon
      constraint only_in_taxon Bacteria (NCBITaxon:2). S. pombe is an ascomycete, so
      this annotation violates a hard GO taxon constraint. The mechanism of the error
      is visible: the term's exact synonym is "spore membrane", which is the wording of
      UniProt's subcellular-location statement for both wtf4 isoforms, so a
      similarity transfer landed on the bacterial term. This is a demonstrably wrong
      term mapping rather than a judgment call about the biology, which is why REMOVE
      applies to a manual ISS row here. Deliberately no replacement is proposed: if the
      ascospore-delimiting membrane is what was meant, the Ascomycota term is
      GO:0005628 prospore membrane (only_in_taxon Ascomycota, and its definition names
      S. pombe as the exemplar), but the imaging resolves the vacuole, the ER and
      dispersed cytoplasmic aggregates rather than a membrane rim, so nothing
      independently supports that transfer and asserting it would substitute one
      unsupported id for another.
    supported_by:
    - reference_id: PMID:33108274
      supporting_text: >-
        The Wtf4antidote forms aggregates that are recruited to the vacuole and
        vacuole-associated inclusions and are largely non-toxic.
core_functions:
- description: >-
    Antidote arm (isoform 1). Sequesters the cognate Wtf4poison by co-assembling with
    it and rerouting the co-aggregate to the vacuole, thereby removing the poison from
    the cytoplasm where it is toxic. Because the antidote is produced only in spores
    that inherit the wtf4 allele, this rescue is restricted to those spores, which is
    what converts the poison's indiscriminate killing into allele-biased transmission.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:0110134
    label: meiotic drive
  locations:
  - id: GO:0000324
    label: fungal-type vacuole
  - id: GO:0005774
    label: vacuolar membrane
  supported_by:
  - reference_id: PMID:33108274
    supporting_text: >-
      When the two Wtf4 proteins are expressed together, the Wtf4antidote and
      Wtf4poison co-assemble and are trafficked to the vacuole.
  - reference_id: PMID:33108274
    supporting_text: >-
      neutralization of the Wtf4poison requires both co-assembly with the Wtf4antidote
  - reference_id: PMID:33108274
    supporting_text: >-
      The Wtf4antidote forms aggregates that are recruited to the vacuole and
      vacuole-associated inclusions and are largely non-toxic.
- description: >-
    Poison arm (isoform 2). Self-assembles into dispersed cytoplasmic aggregates that
    kill developing ascospores, and is distributed in trans through the ascus epiplasm
    so that every spore in the ascus is exposed regardless of genotype. GO has no
    molecular-function term for this activity, so a new term is proposed rather than
    forcing an existing one.
  proposed_molecular_function: gamete-killing poison activity
  directly_involved_in:
  - id: GO:0110134
    label: meiotic drive
  locations:
  - id: GO:0072324
    label: ascus epiplasm
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:33108274
    supporting_text: >-
      Wtf4poison forms toxic aggregates that are dispersed throughout the cytoplasm.
  - reference_id: PMID:28631612
    supporting_text: >-
      We show that Sk wtf4 generates two transcripts from alternative start sites: a
      long transcript encoding an antidote and a short transcript encoding a
      gamete-killing poison.
  - reference_id: file:SCHPO/wtf4/wtf4-uniprot.txt
    supporting_text: >-
      poison component is trans-acting and targets all spores within an ascus
  knowledge_gaps:
  - gap_statement: >-
      The molecular basis of the Wtf4poison's toxicity is undetermined: it is not known
      what the dispersed poison aggregates do to a spore to kill it, nor whether any
      host protein is the proximal target as opposed to the aggregate load itself
      being the insult.
    boundary: >-
      Firmly established: the poison self-assembles into dispersed cytoplasmic
      aggregates; those aggregates are toxic while the antidote-containing
      co-aggregates routed to the vacuole are not; toxicity does not require
      gametogenesis and is reproduced in S. cerevisiae, so no meiosis-specific host
      factor is needed. What is missing is the step between aggregate and death.
    gap_kind:
    - BIOLOGY
    significance: >-
      This is the step that any engineered application of a wtf-type drive would have
      to control, and it is also the point of general interest: a pair of aggregating
      proteins that differ only in a 44-residue N-terminal extension, one lethal and
      one benign, is an unusually clean handle on why some protein aggregates are toxic
      and others are not.
    resolution: >-
      Identify poison-aggregate interactors in spores and test whether depleting a
      candidate target rescues spore death without blocking aggregation, separating a
      specific-target model from a general proteostatic-burden model.
    provenance:
    - reference_id: PMID:33108274
      supporting_text: >-
        However, the molecular mechanisms employed by most meiotic drivers are unknown.
proposed_new_terms:
- proposed_name: gamete-killing poison activity
  proposed_definition: >-
    The activity of a gene product that causes the selective death of a subset of the
    gametes produced by the organism that encodes it, and whose lethal effect can be
    neutralized by a cognate antidote produced from the same locus. The target cells
    belong to the same organism as the gene product, distinguishing this activity from
    toxin activity (GO:0090729), which acts on another, target organism and initiates
    pathogenesis.
  justification: >-
    GO currently has no molecular-function term that can be used for a
    poison-antidote meiotic driver, and the gap is explicit rather than incidental: the
    obvious candidate, GO:0090729 toxin activity, carries the taxon constraint
    never_in_taxon Schizosaccharomyces and is defined as interacting with molecules in
    "another (target) organism, initiating pathogenesis", neither of which holds for a
    protein that kills its own organism's sibling spores. The complementary term
    GO:0097351 toxin sequestering activity is never_in_taxon Eukaryota. The
    consequence is visible in GOA: PomBase annotates GO:0003674 with evidence ND and
    re-affirmed it on 2026-07-24, even though the poison's cellular activity has been
    characterized in two papers. The wtf family alone supplies 4 to 14 driver loci per
    S. pombe isolate, and analogous poison-antidote gamete killers are known in other
    fungi, so a term here would be reused. Deliberately scoped to the killing activity
    only; the antidote arm needs no new term because GO:0140311 protein sequestering
    activity already fits it.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:33108274
    supporting_text: >-
      Wtf4poison forms toxic aggregates that are dispersed throughout the cytoplasm.
  - reference_id: PMID:28631612
    supporting_text: >-
      We show that Sk wtf4 generates two transcripts from alternative start sites: a
      long transcript encoding an antidote and a short transcript encoding a
      gamete-killing poison.
  - reference_id: PMID:32790622
    supporting_text: >-
      Each wtf meiotic driver encodes two proteins from two largely overlapping
      transcripts with distinct start sites: a poison (Wtfpoison) and an antidote
      (Wtfantidote)
suggested_questions:
- question: >-
    Does the S. pombe 972 wtf4 allele itself drive? Every transmission and killing
    assay behind the GO:0110134 IMP used the S. kambucha allele, which differs at ~18%
    of residues in a family where a two-amino-acid C-terminal mismatch abolishes
    antidote specificity. Should the Q9P3V0 row be re-coded as ISS from A0A218N034,
    with the IMP moved to the S. kambucha entry?
  experts:
  - Sarah E. Zanders
  - Nicole L. Nuckolls
- question: >-
    Should GOA carry isoform-qualified rows for this locus? UniProt resolves FUNCTION
    and SUBCELLULAR LOCATION to isoform 1 versus isoform 2, and the two have opposing
    functions, yet all 17 GOA rows are gene-level. A single unqualified "meiotic drive"
    row loses the fact that one product kills and the other rescues.
  experts: []
- question: >-
    Is GO:0140549 spore inner membrane reachable by other fungal proteins through the
    same route? Its exact synonym "spore membrane" matches UniProt's subcellular-location
    wording while the term is only_in_taxon Bacteria, so the mapping that produced this
    annotation is likely to misfire elsewhere. Would narrowing the synonym prevent it?
  experts: []
- question: >-
    Should GO:0072324 ascus epiplasm be part_of GO:0005737 cytoplasm? Its definition is
    "Ascus cytoplasm that is not packaged into ascospores", but its only ancestors are
    GO:0110165 and GO:0005575, so an epiplasm annotation does not currently entail a
    cytoplasmic one.
  experts: []
- question: >-
    Does the antidote qualify for GO:0160247 autophagy cargo adaptor activity in
    addition to GO:0140311? Neutralization requires ATG11, SNF7 and multiple VPS genes,
    which is suggestive, but that evidence comes from a heterologous S. cerevisiae
    screen and no delivery to a phagophore has been shown.
  experts:
  - Randal Halfmann
suggested_experiments:
- hypothesis: >-
    The S. pombe 972 wtf4 allele is itself an active driver, not merely a driver-family
    member.
  description: >-
    Measure transmission bias for the S. pombe 972 wtf4 allele directly, in
    wtf4+/wtf4-delta diploids in a pure 972 background, scoring allele transmission in
    viable spores and spore viability by propidium iodide staining. This is the single
    missing experiment behind the gene's central annotation, and it is a close repeat of
    one already performed on the S. kambucha allele.
  experiment_type: Genetic transmission assay
- hypothesis: >-
    The poison aggregates kill by engaging a specific host target rather than by
    imposing a general proteostatic burden.
  description: >-
    Immunoprecipitate Wtf4poison-GFP aggregates from sporulating cells and compare the
    interactome with that of antidote-containing co-aggregates, then test whether
    depletion of candidate targets rescues spore death without preventing aggregation.
  experiment_type: Interaction proteomics with genetic validation
- hypothesis: >-
    The 44-residue N-terminal extension unique to the antidote is a transferable
    vacuolar-targeting determinant, distinct from the co-assembly surface.
  description: >-
    Fuse the antidote's N-terminal extension to a heterologous aggregating protein and
    ask whether it suffices to route that protein to the vacuole. This separates the two
    separately-required steps of neutralization, and would establish whether the
    extension acts as a targeting signal or only as an assembly interface.
  experiment_type: Domain-swap imaging
- hypothesis: >-
    The ER colocalization reported in spores is an artifact of the nitrogen starvation
    used to induce meiosis, as the original authors suspect.
  description: >-
    Induce wtf4 expression in vegetative cells under nitrogen starvation versus normal
    nitrogen and compare colocalization with the ER marker Sec63 in each condition. A
    starvation-dependent signal would settle the status of the GO:0005789 annotations
    flagged as over-annotated in this review.
  experiment_type: Comparative fluorescence colocalization
