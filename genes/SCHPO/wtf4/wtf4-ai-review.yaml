      supporting_text: >-
        The Wtf4antidote forms aggregates that are recruited to the vacuole and
        vacuole-associated inclusions and are largely non-toxic.
    - reference_id: PMID:33108274
      supporting_text: >-
        neutralization of the Wtf4poison requires both co-assembly with the
        Wtf4antidote
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      The root-term ND placeholder is now supersedable: GO:0140311 protein sequestering
      activity describes the antidote's characterized activity without requiring a new
      term.
    action: MODIFY
    reason: >-
      PomBase re-affirmed ND on 2026-07-24, and the reason the slot has stayed empty is
      real: the obvious candidates are blocked by taxon constraints. GO:0090729 toxin
      activity is never_in_taxon Schizosaccharomyces and in any case requires acting on
      "another (target) organism", which a sibling-spore killer does not do, and
      GO:0097351 toxin sequestering activity is never_in_taxon Eukaryota. But the
      antidote arm is a different matter. GO:0140311 protein sequestering activity is
      defined as binding a protein to prevent it interacting with other partners or to
      inhibit its localization to the area of the cell where it is active, carries no
      taxon constraints, and is an almost verbatim description of what the Wtf4antidote
      does: it co-assembles with the Wtf4poison and redirects the co-aggregate to the
      vacuole, and both the binding and the relocalization are separately required.
      Offered as a candidate for the antidote isoform; the poison's activity remains
      without a GO term and is handled in proposed_new_terms.
    proposed_replacement_terms:
    - id: GO:0140311
      label: protein sequestering activity
    supported_by:
    - reference_id: PMID:33108274
      supporting_text: >-
        When the two Wtf4 proteins are expressed together, the Wtf4antidote and
        Wtf4poison co-assemble and are trafficked to the vacuole.
    - reference_id: PMID:33108274
      supporting_text: >-
        neutralization of the Wtf4poison requires both co-assembly with the
        Wtf4antidote
