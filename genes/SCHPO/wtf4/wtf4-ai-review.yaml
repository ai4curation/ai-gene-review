- id: PMID:16823372
  title: ORFeome cloning and global analysis of protein localization in the fission
    yeast Schizosaccharomyces pombe.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Genome-wide GFP overexpression localization screen; the only cited source whose
      subject is unambiguously the S. pombe 972 wtf4 protein rather than the
      S. kambucha ortholog. Its vacuolar and cytoplasmic-inclusion result for wtf4 is
      explicitly endorsed by the later mechanistic study (PMID:33108274), which
      removes the usual concern that an overexpression screen result for a
      meiosis-specific protein is an artifact.
- id: PMID:28631612
  title: wtf genes are prolific dual poison-antidote meiotic drivers.
  findings:
  - statement: >-
      wtf4 generates two overlapping transcripts from alternative start sites; the
      long one encodes an antidote and the short one a gamete-killing poison.
    supporting_text: >-
      We show that Sk wtf4 generates two transcripts from alternative start sites: a
      long transcript encoding an antidote and a short transcript encoding a
      gamete-killing poison.
    reference_section_type: RESULTS
  - statement: >-
      Drive depends on an asymmetry of distribution rather than of activity: the
      poison reaches every gamete, the antidote only those carrying the allele.
    supporting_text: >-
      Whereas the poison protein is found in all the gametes, the antidote protein is
      enriched only in the gametes encoding Sk wtf4
    reference_section_type: RESULTS
  - statement: >-
      The two-start-site architecture is directly established for the S. pombe gene
      itself from meiotic long-read transcript data.
    supporting_text: >-
      This revealed that Sp wtf4 is transcribed during meiosis and generates two major
      overlapping transcripts with different start sites
    reference_section_type: RESULTS
  - statement: >-
      Drive is strong and autonomous, measured at 93% transmission in a background
      containing no S. pombe DNA.
    supporting_text: >-
      We did, however, observe strong drive (93% transmission) of Sk wtf4+ relative to
      Sk wtf4Δ in diploid 14
    reference_section_type: RESULTS
  - statement: >-
      The S. pombe and S. kambucha wtf4 genes are far more diverged than their
      genomes, which bounds how much of this paper's phenotypic work transfers to
      Q9P3V0.
    supporting_text: >-
      Sk wtf4 shares only 89% DNA sequence identity (82% amino acid identity) with the
      gene in the orthologous locus in Sp (Sp wtf4)
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the paper that identified wtf4 as a dual poison-antidote
      driver, and the source of the GO:0110134 IMP and two IDA localization rows. Note
      for anyone relying on those rows: the drive and killing assays were performed on
      the S. kambucha allele (A0A218N034), while the S. pombe-specific contribution is
      the transcript architecture. Not miscited, but the IMP is better read as
      family/architecture-level inference for Q9P3V0 than as a direct measurement of
      the 972 allele.
- id: PMID:33108274
  title: The wtf4 meiotic driver utilizes controlled protein aggregation to generate
    selective cell death.
  findings:
  - statement: The poison kills as dispersed cytoplasmic aggregates.
    supporting_text: >-
      Wtf4poison forms toxic aggregates that are dispersed throughout the cytoplasm.
    reference_section_type: RESULTS
  - statement: >-
      The antidote's own aggregates are routed to the vacuole and are largely
      non-toxic, identifying the vacuole as the site of neutralization.
    supporting_text: >-
      The Wtf4antidote forms aggregates that are recruited to the vacuole and
      vacuole-associated inclusions and are largely non-toxic.
    reference_section_type: RESULTS
  - statement: >-
      Neutralization proceeds by co-assembly of the two proteins followed by
      trafficking of the co-aggregate to the vacuole.
    supporting_text: >-
      When the two Wtf4 proteins are expressed together, the Wtf4antidote and
      Wtf4poison co-assemble and are trafficked to the vacuole.
    reference_section_type: RESULTS
  - statement: >-
      Co-assembly alone is insufficient; the trafficking step is separately required,
      so the antidote's activity is relocalization of the poison rather than mere
      binding.
    supporting_text: >-
      neutralization of the Wtf4poison requires both co-assembly with the Wtf4antidote
    reference_section_type: ABSTRACT
  - statement: >-
      Neutralization co-opts host vesicle-transport, endocytosis and vacuolar
      trafficking genes, so these functions are not encoded by wtf4.
    supporting_text: >-
      we found that several genes involved in vesicle transport, endocytosis, and
      trafficking to the vacuole (e.g. ATG11, SNF7, and multiple VPS genes) are also
      required for survival when the Wtf4 proteins are expressed
    reference_section_type: DISCUSSION
  - statement: >-
      The protein assayed throughout is the S. kambucha Wtf4, not the S. pombe 972
      product that carries accession Q9P3V0.
    supporting_text: >-
      The wtf4 meiotic driver used in this work is from S. kambucha, an isolate that
      is almost identical (99.5% DNA sequence identity) to the commonly studied lab
      isolate of S. pombe
    reference_section_type: RESULTS
  - statement: >-
      The S. pombe 972 protein's own vacuolar and cytoplasmic-inclusion localization
      is independently affirmed here, validating the PMID:16823372 HDA rows.
    supporting_text: >-
      Interestingly, S. pombe wtf4, the homolog of the S. kambucha wtf4 allele used in
      this study, was previously shown to localize both inside the vacuole and as
      large cytoplasmic inclusions when overexpressed in S. pombe vegetative growth
      (Matsuyama et al., 2006).
    reference_section_type: DISCUSSION
  - statement: >-
      The authors attribute the ER colocalization to the nitrogen starvation used to
      induce meiosis rather than to a functional ER localization.
    supporting_text: >-
      We speculate this colocalization with the ER is due to nitrogen starvation which
      is required to induce meiosis and promotes organelle autophagy in S. pombe
    reference_section_type: RESULTS
  - statement: >-
      In vegetative cells the antidote correlates strongly with the vacuole and not at
      all with an ER marker.
    supporting_text: >-
      Wtf4antidote-mCherry and CMAC shows a Pearson coefficient of approximately 0.69,
      while Wtf4antidote-mCherry and Sec63-YFP shows −0.1.
    reference_section_type: RESULTS
  - statement: >-
      The molecular mechanisms of meiotic drivers, including how the wtf4 poison
      aggregates kill, are largely unresolved.
    supporting_text: >-
      However, the molecular mechanisms employed by most meiotic drivers are unknown.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the mechanistic basis for the molecular function assigned in
      core_functions, and the source of the GO:0000324 IDA row. Two caveats recorded
      because they change how the paper should be used for annotation: the allele
      assayed is the S. kambucha one, and the authors themselves doubt that the ER
      colocalization is functional.
- id: PMID:32790622
  title: Atypical meiosis can be adaptive in outcrossed Schizosaccharomyces pombe due
    to wtf meiotic drivers.
  findings:
  - statement: >-
      The one-locus/two-overlapping-transcripts poison-antidote architecture is
      general to the wtf driver family.
    supporting_text: >-
      Each wtf meiotic driver encodes two proteins from two largely overlapping
      transcripts with distinct start sites: a poison (Wtfpoison) and an antidote
      (Wtfantidote)
    reference_section_type: INTRODUCTION
  - statement: >-
      wtf drivers are numerous and clustered on chromosome 3, where wtf4
      (SPCC548.03c) also lies.
    supporting_text: >-
      Different natural isolates contain between 4 and 14 predicted wtf drivers,
      almost all of which are found on chromosome 3
    reference_section_type: INTRODUCTION
  - statement: >-
      Antidote-poison matching is hypersensitive to sequence, which is why the 18%
      amino-acid divergence between the S. pombe and S. kambucha proteins limits
      similarity-based transfer of drive specificity.
    supporting_text: >-
      even a mismatch of two amino acids within the C-terminus can disrupt the ability
      of a Wtfantidote to neutralize a Wtfpoison
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cited by UniProt as the ECO:0000269 source for the FUNCTION
      line on Q9P3V0 but absent from GOA; added here because it supplies the
      family-level architecture statement and the sequence-specificity constraint that
      bounds the ISS transfers.
