  review:
    summary: >-
      Sec24 cargo-adaptor activity includes SNARE binding for packaging fusion
      machinery into COPII vesicles.
    action: ACCEPT
    reason: >-
      Accept. The Sec24 cargo adaptor packages SNAREs as well as other
      biosynthetic cargoes into Golgi-directed COPII vesicles. The PAINT row is
      consistent with S. pombe Sec24's membership in the Sec24 subfamily and no
      PAINT IRD or IKR loss was found on the sec24 lineage.
    supported_by:
