  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0134
  review:
    summary: >-
      Golgi membrane is a plausible cycling location for Sec24-containing COPII
      coats but secondary to ER exit sites and COPII vesicles.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. Sec24 is a cytosolic peripheral COPII coat subunit that
      can remain associated with ER-derived carriers approaching the cis-Golgi.
      The by-similarity Golgi-membrane location is therefore plausible, but the
      core cargo-adaptor activity occurs at ER exit sites and on COPII vesicle
      membranes.
    supported_by:
    - reference_id: file:genes/SCHPO/sec24/sec24-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Golgi apparatus membrane {ECO:0000250}
