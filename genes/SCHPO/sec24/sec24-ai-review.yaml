id: Q9UUI5
gene_symbol: sec24
product_type: PROTEIN
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
status: COMPLETE
description: >-
  sec24 encodes the fission-yeast Sec24 cargo-adaptor subunit of the COPII
  inner coat. Sec24 pairs with Sec23 after Sar1-GTP recruitment at ER exit
  sites, binds transmembrane secretory cargo and SNAREs for packaging into COPII
  vesicles, and thereby supports COPII-coated vesicle cargo loading during
  ER-to-Golgi vesicle-mediated transport.
