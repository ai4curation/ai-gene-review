  label: Schizosaccharomyces pombe 972h-
description: tps2 (SPAC3G6.09c; UniProt O14145) encodes a second trehalose-6-phosphate phosphatase (EC
  3.1.3.12) of fission yeast, orthologous to S. cerevisiae TPS2. Because tpp1 disruption alone causes
  trehalose-6-P accumulation, tpp1 is the main phosphatase in vivo, and the contribution of tps2 is unclear.
  It is cytosolic in a genome-wide screen.
