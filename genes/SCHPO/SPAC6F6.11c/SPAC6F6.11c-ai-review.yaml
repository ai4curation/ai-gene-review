taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPAC6F6.11c (UniProt O14242) is one of two putative pyridoxal kinases of fission yeast (SPAC6F6.11c
  and SPCC18.10; BUD16/PDXK family, EC 2.7.1.35). Pyridoxal kinase phosphorylates pyridoxal, pyridoxine
  and pyridoxamine taken up by the bsu1 transporter to their 5'-phosphates, the salvage route to PLP.
  Function is assigned by family membership; how the two paralogs divide the work is unknown. The protein
  is cytosolic in a genome-wide screen.
