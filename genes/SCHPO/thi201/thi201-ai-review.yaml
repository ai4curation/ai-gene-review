suggested_questions:
- question: Are thi201 and thi20 redundant for HMP-P kinase activity in thiamine-free medium, given that
    thi201 deletion is viable while thi20 deletion is reported inviable?
suggested_experiments:
- description: Test thiamine and HMP auxotrophy of thi201, thi20 (if viable under supplementation) and
    SPCC18B5.05c single and combined deletions on minimal medium, to assign the HMP-P kinase step in vivo.
