taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: thi201 (SPBP8B7.18c) encodes one of three fission yeast HMP/HMP-P kinase (ThiD family)
  paralogues and is the one most similar to S. cerevisiae Thi20/Thi21. Like them it has an N-terminal
  ribokinase-fold hydroxymethylpyrimidine (HMP) / HMP-phosphate kinase domain fused to a C-terminal
  TenA/thiaminase-II-like domain. By homology it phosphorylates HMP to HMP-P and HMP-P to HMP-PP, the
  activated pyrimidine used by thiamine-phosphate synthase in thiamine biosynthesis. It has not been
  characterised biochemically in S. pombe. It is cytoplasmic and its deletion is viable.
