taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: Spo13 is the short sporulation-specific fission-yeast Sec2-family
  Rab guanine nucleotide exchange factor that is recruited to the cytoplasmic
  face of the meiotic spindle pole body by Spo2. At the meiotic outer plaque,
  Spo13 activates the Ypt2/Sec4-family Rab and is required for initiating
  forespore membrane assembly during ascospore formation.
