  label: Schizosaccharomyces pombe 972h-
description: Spo13 is a meiosis-induced Sec2-family Rab guanine nucleotide exchange
  factor that localizes to the cytoplasmic surface of the modified meiotic
  spindle pole body. After Spo15 and Spo2 recruit Spo13 to the meiosis-II outer
  plaque, Spo13 promotes recruitment and activation of the Sec4/Rab8-family
  GTPase Ypt2, helping initiate forespore membrane formation and ascospore
  morphogenesis.
existing_annotations:
- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IDA
  original_reference_id: PMID:20130084
  qualifier: enables
  review:
    summary: Yang and Neiman directly measured Spo13-dependent nucleotide
      exchange on Ypt2 and showed specificity over the Ypt1 and Ypt3 Rabs in
      vitro.
    action: ACCEPT
    reason: Correct core molecular function. Spo13 is a short Sec2-family Rab
      GEF whose activity is specific for the Ypt2/Sec4-family Rab in the
      forespore membrane initiation pathway.
    supported_by:
    - reference_id: PMID:20130084
      supporting_text: SpSpo13 specifically facilitates nucleotide exchange by
        SpYpt2.
    - reference_id: PMID:20130084
      supporting_text: SpSpo13 failed to stimulate release of GDP from either
        SpYpt1 or SpYpt3, indicating specificity of SpYpt2 in vitro.
