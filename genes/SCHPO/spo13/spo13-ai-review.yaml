    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18367542
  qualifier: enables
  supporting_entities:
  - PomBase:SPBC16C6.14
  review:
    summary: Nakase et al. showed that Spo13 binds Spo2 in the meiotic outer
      plaque recruitment hierarchy.
    action: REMOVE
    reason: The Spo13-Spo2 interaction is real, but generic protein binding
      does not capture Spo13's Rab-GEF activity and is no longer an informative
      MF annotation. Unlike Spo2, Spo13 is not the established bridging adaptor
      between Spo15 and the terminal Spo13 layer, because Spo13 does not bind
      Spo15 directly.
    supported_by:
    - reference_id: PMID:18367542
      supporting_text: Spo2 physically associated with both Spo15 and Spo13,
        but Spo13 and Spo15 did not interact directly.
