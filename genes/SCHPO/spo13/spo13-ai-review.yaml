suggested_questions:
- question: Do Spo13 and Sec2 form a heterodimer at the meiotic SPB, and would
    that complex combine Spo13's SPB anchoring with Sec2's stronger exchange
    activity on Ypt2?
  experts: []
- question: Which meiosis-specific Sid2/Mug27 substrate licenses efficient
    Spo13-dependent recruitment of Ypt2 to the SPB?
  experts: []
suggested_experiments:
- description: Purify Spo13, Sec2, and Spo13-Sec2 dimers and compare their
    exchange activity on geranylgeranylated Ypt2 in the presence and absence of
    Spo2 and meiotic outer-plaque components.
- description: Screen candidate meiotic SPB and Rab-cascade factors downstream
    of Sid2 and Mug27 with synchronized Spo13-GFP and GFP-Ypt2 recruitment
    timing to identify the kinase-regulated substrate that licenses
    meiosis-specific Ypt2 recruitment.
