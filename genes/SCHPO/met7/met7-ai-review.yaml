  review:
    summary: PAINT inference of mitochondrial location; FPGS acts in both cytosol and mitochondria (S.
      cerevisiae Met7 has both pools).
    action: ACCEPT
    reason: The mitochondrial location is by similarity only. UniProt curates mitochondrial inner
      membrane and matrix locations by similarity (ECO:0000250), and the protein falls in the PANTHER
      mitochondrial FPGS subfamily (PTHR11136:SF5). The S. pombe GFP/YFP screens (PMID:10759889,
      PMID:16823372) report cytoplasm and nucleus, not mitochondria. The organelle claim is kept on
      the phylogenetic inference, at the root organelle term.
