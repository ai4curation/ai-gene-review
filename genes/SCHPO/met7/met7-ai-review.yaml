- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001645
  - InterPro:IPR018109
  - InterPro:IPR023600
  - InterPro:IPR036565
  review:
    summary: ATP is a cosubstrate of the folylpolyglutamate synthase reaction; binding is subsidiary to the
      core ligase activity.
    action: KEEP_AS_NON_CORE
    reason: ATP binding is inherent to the ATP-dependent glutamate ligation catalysed by met7. The ATP-binding
      residues are curated by similarity to E. coli FolC (P08192), and the curated reaction consumes ATP;
      no S. pombe experiment addresses it directly.
    supported_by:
    - reference_id: file:SCHPO/met7/met7-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: |-
