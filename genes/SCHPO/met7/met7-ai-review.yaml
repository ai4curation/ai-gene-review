  label: Schizosaccharomyces pombe 972h-
description: met7 (SPBC1709.17; UniProt O74742; the fission yeast MET7 ortholog) encodes folylpolyglutamate
  synthase (EC 6.3.2.17), which adds gamma-linked glutamates to tetrahydrofolates. Polyglutamylation keeps
  folates inside the cell and organelles and makes them better cofactors for one-carbon enzymes. By orthology,
  met7 mutants need methionine because the methionine synthase step requires polyglutamyl 5-methyl-THF.
  The protein is cytoplasmic in localisation screens and is expected to have a mitochondrial pool as well.
