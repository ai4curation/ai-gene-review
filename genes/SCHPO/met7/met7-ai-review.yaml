  review:
    summary: Generic InterPro-derived parent of the specific tetrahydrofolylpolyglutamate synthase activity,
      which is already annotated.
    action: MODIFY
    reason: Correct but too general. met7 belongs to the folylpolyglutamate synthase family (InterPro
      IPR001645, NCBIfam TIGR01499 folC), and its curated reaction is ATP-dependent addition of L-glutamate
      to tetrahydrofolyl-polyglutamate, i.e. GO:0004326, which the gene already carries (IBA, IEA). The
      evidence is family membership and similarity, not an S. pombe enzyme assay.
