  - reference_id: file:SCHPO/gld1/gld1-uniprot.txt
    supporting_text: 'CC       Reaction=glycerol + NAD(+) = dihydroxyacetone + NADH + H(+);'
suggested_questions:
- question: >-
    Is gld1 mitochondrial (ORFeome YFP call; presequence-like N-terminus absent from bacterial
    GldA) or cytosolic (PomBase IC and GO-CAM)? If mitochondrial, how does the DHA it produces
    reach the cytosolic dak1/dak2?
suggested_experiments:
- description: >-
    Localize endogenously tagged gld1 (C-terminal tag, native promoter, glucose-derepressed
    conditions) by microscopy with a mitochondrial marker and by subcellular fractionation;
    test whether deleting residues 1-45 changes localization and complementation of
    gld1-delta glycerol assimilation.
