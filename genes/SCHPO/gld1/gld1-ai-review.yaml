core_functions:
- description: >-
    NAD+-dependent oxidation of glycerol to dihydroxyacetone (EC 1.1.1.6), the first step of
    the dihydroxyacetone route of glycerol assimilation, upstream of dak1/dak2. Compartment
    unresolved (HTP mitochondrial call versus curator-inferred cytosol), so no location is
    asserted here.
  molecular_function:
    id: GO:0008888
    label: glycerol dehydrogenase (NAD+) activity
