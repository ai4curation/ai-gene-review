  label: Schizosaccharomyces pombe 972h-
description: >-
  Glycerol dehydrogenase 1 of Schizosaccharomyces pombe, a zinc-dependent member of the
  iron-containing alcohol dehydrogenase (bacterial GldA-type) family. It oxidizes glycerol to
  dihydroxyacetone with NAD+ as acceptor, the first step of the dihydroxyacetone route by
  which fission yeast assimilates glycerol; the dihydroxyacetone is then phosphorylated by the
  dihydroxyacetone kinases dak1 and dak2. Deletion of gld1 lowers glycerol dehydrogenase activity
  and abolishes glycerol assimilation without affecting growth on dihydroxyacetone. Expression is
  repressed by glucose. Fission yeast has no GCY1-type aldo-keto reductase for this step.
  Large-scale YFP tagging placed the protein in mitochondria, and its N-terminal extension relative
  to bacterial GldA has presequence-like composition, but its compartment has not been
  established by targeted experiments.
existing_annotations:
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0173
  review:
    summary: >-
      UniProt SubCell mapping from the ORFeome-wide YFP localization (PMID:16823372), which
      called gld1 mitochondrial. The gld1 N-terminus (residues 1-45) is Arg/Lys-rich with no
      acidic residue before position 47 and is absent from bacterial GldA, consistent with a
      mitochondrial presequence. Retained, though a targeted localization experiment is lacking.
    action: ACCEPT
    reason: >-
      The only experimental localization data (high-throughput) say mitochondrion, and the
      sequence has a presequence-like N-terminal extension. This conflicts with the PomBase
      cytosol IC and the GO-CAM; flagged as a question rather than overruled.
    supported_by:
    - reference_id: file:SCHPO/gld1/gld1-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Mitochondrion {ECO:0000269|PubMed:16823372}.'
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: is_active_in
  supporting_entities:
  - GO:0008888
  review:
    summary: >-
      PomBase curator inference that gld1 acts in the cytosol, made from its ISS-supported
      glycerol dehydrogenase activity (the bacterial GldA homologs are cytosolic). The only
      experimental localization for gld1 (ORFeome YFP) is mitochondrial, and gld1 carries an
      N-terminal extension absent from GldA with presequence-like composition.
    action: UNDECIDED
    reason: >-
      Curator inference conflicts with HTP experimental data and a sequence feature; neither
      side has a targeted experiment. Kept undecided pending fractionation or tagged-allele
      localization.
    supported_by:
