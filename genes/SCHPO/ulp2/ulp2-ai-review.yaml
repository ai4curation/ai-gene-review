- term:
    id: GO:0070139
    label: SUMO-specific endopeptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1913565
  - PANTHER:PTN002930416
