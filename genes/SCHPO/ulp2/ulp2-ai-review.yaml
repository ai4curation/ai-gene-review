- id: PMID:24818994
  title: The S. pombe translation initiation factor eIF4G is Sumoylated and associates with the SUMO protease
    Ulp2.
  findings:
  - statement: Purified Ulp2 deconjugates SUMO from high-Mr species (NEM-sensitive) but processes precursor
      SUMO poorly compared with Ulp1.
    supporting_text: Using assays we described previously [13], we demonstrate that Ulp2 is significantly
      less able than Ulp1 to process SUMO to the mature form (Figure 1A, lane 2 (Ulp1) and lane 3 (Ulp2)),
      but is capable of deconjugating SUMO from high Mr species in an N-ethylmaleimide- (NEM)-dependent
      manner (Figure 1B).
  - statement: Ulp2 is located in predominantly nuclear foci with a minor cytoplasmic fraction, distinct
      from nuclear-pore-associated Ulp1.
    supporting_text: Thus the location of Ulp2 is distinct from that of Ulp1 [13], indicating that it
      is unlikely to be part of nuclear pore complexes.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterisation of S. pombe Ulp2 (full text cached). It supports the deSUMOylase
      activity, the localisation and the eIF4G co-purification. It does not establish stress-granule localisation
      of Ulp2 or Ulp2-dependent translation regulation. Its comparison with S. cerevisiae Ulp2 is based
      on sequence resemblance, but PANTHER places the two proteins in different families.
- id: PMID:27398807
  title: Functional Crosstalk between the PP2A and SUMO Pathways Revealed by Analysis of STUbL Suppressor,
    razor 1-1.
  findings:
  - statement: Toxicity in ulp2 deletion cells arises from STUbL action on SUMO-chain-modified proteins.
    supporting_text: Therefore, unscheduled STUbL activity on SUMO-chain modified proteins, rather than
      the SUMO chains themselves, is toxic to ulp2∆ cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. This is genetic evidence placing Ulp2 in control of SUMO-chain homeostasis
      alongside the STUbL Slx8-Rfp1/2 and PP2A-Pab1. It provides no direct biochemistry for Ulp2 and supports
      no additional GO annotation.
