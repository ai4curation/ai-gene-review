suggested_questions:
- question: Is eIF4G a direct physiological Ulp2 substrate, and does its deSUMOylation control translation
    initiation or stress-granule recruitment?
- question: Does S. pombe Ulp2, like its PTHR46896 relatives SENP6 and SENP7, preferentially edit poly-SUMO
    chains? Which lineage-specific targeting regions direct it to intranuclear foci?
- question: Given that PANTHER places S. pombe Ulp2 with SENP6/SENP7 and S. cerevisiae Ulp2 in a separate
    family (PTHR46915), which budding-yeast Ulp2 substrates (for example centromeric or nucleolar factors)
    can be transferred to fission yeast at all?
suggested_experiments:
- description: Compare eIF4G sumoylation in wild-type and ulp2-deletion cells with and without 1 M KCl
    stress. Test whether purified Ulp2 deconjugates SUMO from immunopurified eIF4G, and measure polysome
    profiles in ulp2-deletion cells.
  experiment_type: biochemistry and polysome profiling
- description: Image genomically tagged Ulp2 together with an established stress-granule marker (for example
    Pabp-RFP) under 1 M KCl or heat stress, to test directly whether Ulp2 enters cytoplasmic stress granules.
  experiment_type: live-cell fluorescence microscopy
