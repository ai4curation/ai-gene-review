    - *id004
- term:
    id: GO:2000765
    label: regulation of cytoplasmic translation
  evidence_type: EXP
  original_reference_id: PMID:24818994
  qualifier: involved_in
  review:
    summary: The paper shows that Ulp2 co-purifies with translation factors, that eIF4G is sumoylated
      (more so under KCl stress), and that ulp2 deletion mutants are cycloheximide-sensitive. It does not
      measure translation in ulp2 mutants or show Ulp2-dependent deSUMOylation of eIF4G.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full text is available. Its evidence is association (co-purification and co-elution with
      eIF4G and eIF3 subunits) plus a pleiotropic drug-sensitivity phenotype shared with sensitivity to
      hydroxyurea and KCl. No assay of translation rate, polysome profile or eIF4G activity in ulp2 mutants
      is reported. The authors themselves leave the role of eIF4G sumoylation open, and Ulp2 stays in large
      complexes after EDTA disrupts polysomes. Regulation of cytoplasmic translation therefore goes beyond
      what was shown; it is a hypothesis rather than an established process for Ulp2.
    supported_by:
    - *id003
    - reference_id: PMID:24818994
      supporting_text: They are also sensitive to the protein synthesis inhibitor, cycloheximide (CHX,
        10 and 20 µg/ml) and KCl (1 M) indicating that Ulp2 likely has roles in numerous cellular processes.
    - reference_id: PMID:24818994
      supporting_text: These data suggest that sumoylation of eIF4G may be associated with stress granule
        formation and/or proteolysis of the translation initiation factor.
