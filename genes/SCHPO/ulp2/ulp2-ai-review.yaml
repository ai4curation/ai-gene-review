  review:
    summary: The term (cleavage within SUMO, i.e. precursor maturation) is inherited from the SENP6/7
      node. Ulp2 does process precursor SUMO, but much less efficiently than Ulp1.
    action: KEEP_AS_NON_CORE
    reason: GO:0070139 is defined as hydrolysis of peptide bonds within SUMO, which is the precursor-maturation
      reaction. It is not an ancestor or descendant of GO:0016929. The direct comparison shows that Ulp2
      can process the precursor but is much poorer at it than Ulp1, and the ulp1/ulp2 deletion comparison
      indicates that maturation is not its main physiological role. The PAINT inheritance is not contradicted;
      Ulp2 is inside the clade and keeps the catalytic triad. So the activity is retained as a real but
      minor capacity.
