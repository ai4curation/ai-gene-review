  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Ulp2 is a SUMO-specific cysteine protease that removes SUMO from high-molecular-weight conjugates.
  It resides mainly in intranuclear foci, with a smaller cytoplasmic pool, and differs from the predominantly
  nuclear-pore-associated Ulp1 protease. Ulp2 has much weaker SUMO-precursor processing activity than
  Ulp1. It occurs in large complexes containing RNA-metabolism and translation proteins, including eIF4G,
  linking SUMO turnover to these cellular systems without establishing a specific translation-regulatory
  mechanism.
