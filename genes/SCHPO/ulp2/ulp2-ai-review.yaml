- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003653
  review:
    summary: The Peptidase_C48 InterPro2GO mapping gives generic proteolysis. The process that Ulp2 has
      been shown to perform is cleavage of SUMO from conjugates.
    action: MODIFY
    reason: Ulp2 hydrolyses the isopeptide bond joining SUMO to target lysines or to other SUMO moieties.
      That is protein desumoylation (GO:0016926), a protein-modification process, not bulk degradation
      of a substrate polypeptide. Desumoylation is not an is_a descendant of proteolysis, so this is a
      lateral correction to the specific, experimentally supported process term the gene already carries
      (IBA).
    supported_by:
    - &id002
      reference_id: PMID:24818994
      supporting_text: These results confirm that like S. cerevisiae Ulp2, S. pombe Ulp2 is a cysteine
        protease whose main function is in deconjugating SUMO from target proteins.
    proposed_replacement_terms:
    - id: GO:0016926
      label: protein desumoylation
