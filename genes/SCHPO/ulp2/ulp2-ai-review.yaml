  review:
    summary: Ulp2 co-purifies and co-elutes with eIF4G (tif471, SPAC17C9.03) in large complexes; the
      interaction is real but generic protein binding conveys no functional information.
    action: REMOVE
    reason: Following the protein-binding policy, the bare GO:0005515 term is uninformative and is removed;
      removal does not mean the eIF4G association is false. The paper shows co-purification and gel-filtration
      co-elution, not a characterised direct binding mode, so no more informative MF (for example a
      SUMO-modified-protein binding term) is supported. The informative molecular function of Ulp2 is
      deSUMOylase activity, captured elsewhere in this review.
