gene_symbol: ulp2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: Ulp2 (SPAC17A5.07c) is a 638-residue SUMO-specific cysteine protease of the peptidase C48
  (Ulp/SENP) family. Its C-terminal catalytic domain carries the conserved His-Asp-Cys triad (His440,
  Asp494, Cys544). By PANTHER classification it belongs to the SENP6/SENP7 family (PTHR46896), not to
  the family containing budding-yeast Ulp2/Smt4. Purified Ulp2 removes SUMO (Pmt3) from high-molecular-weight
  SUMO conjugates in an N-ethylmaleimide-sensitive manner, but processes the SUMO precursor much less
  efficiently than Ulp1; its main role is deconjugation and dismantling of poly-SUMO species, not SUMO
  maturation. Ulp2 sits mainly in intranuclear foci that often coincide with SUMO, with a small cytoplasmic
  pool and little signal at the nuclear periphery, which distinguishes it from the nuclear-pore-associated
  Ulp1. It is found in at least two large complexes and co-purifies with RNA-processing, ribosome-biogenesis
  and translation proteins, including the sumoylated translation initiation factor eIF4G. Deletion mutants
  accumulate high-molecular-weight SUMO species and are sensitive to hydroxyurea, cycloheximide and osmotic
  stress. Genetically, these defects depend on SUMO-chain formation and on SUMO-targeted ubiquitin ligase
  (STUbL) activity.
