  review:
    summary: The cited paper shows eIF4G and SUMO in cytoplasmic granules under 1 M KCl stress. In the
      main-text figures, Ulp2 is imaged only under unstressed conditions, as nuclear foci with a minor
      cytoplasmic pool.
    action: UNDECIDED
    reason: I read the full text and every Ulp2 localisation statement in it. None places Ulp2 itself
      in KCl-induced stress granules; the granule experiments use eIF4G-HA, SUMO and PABP-RFP. The PomBase
      curator may have used a supplementary panel that is not in the cached text, so the row is left undecided
      rather than removed. Ulp2 co-purifies with known stress-granule proteins (eIF4G, PABP), which makes
      the annotation plausible but does not demonstrate it.
    supported_by:
