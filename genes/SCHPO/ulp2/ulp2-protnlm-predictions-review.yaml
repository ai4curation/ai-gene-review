    summary: Purified fission-yeast Ulp2 directly deconjugates SUMO from high-molecular-weight species,
      and the study identifies it as a cysteine protease. SUMO is a ubiquitin-like modifier, so the broad
      ubiquitin-like protein peptidase term is biologically correct. The more specific deSUMOylase activity
      GO:0016929 is experimentally established and already annotated; the XML records hydration from that
      term. This prediction loses substrate specificity and is therefore LSP. It does not imply a demonstrated
      ability to remove ubiquitin itself.
    supported_by:
