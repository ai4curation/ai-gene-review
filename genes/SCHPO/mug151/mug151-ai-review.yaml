id: Q10069
gene_symbol: mug151
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: >-
  mug151 (systematic name SPAC3H1.03) encodes a 146-residue protein of the
  Schizosaccharomyces pombe SAP30BP/HCNGP family (Pfam PF07818; InterPro
  IPR012479; PANTHER PTHR13464:SF0). The protein has a charged, predicted-disordered
  N-terminal region followed by the conserved HCNGP region, and UniProt predicts
  nuclear localization by similarity. Human SAP30BP has been implicated in
  transcriptional control and directly acts with RBM17/SPF45 in splicing a subset of
  short introns, but neither activity has been demonstrated for mug151. Its direct
  molecular activity and biological process therefore remain unknown. The gene was
  named from its meiotic transcriptional up-regulation; a specific meiotic mechanism
  has not been established for mug151 in accessible gene-specific literature.
