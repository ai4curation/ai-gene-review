  - id: PMID:16303567
    title: A large-scale screen in S. pombe identifies seven novel genes required for critical meiotic events.
    findings:
      - statement: >-
          The abstract reports deletion of 175 meiotically up-regulated S. pombe genes
          and identification of seven named genes required for critical meiotic events;
          it does not mention mug151, so the gene-specific result cannot be verified from
          the cached abstract.
        supporting_text: >-
          we have deleted 175 meiotically upregulated genes and found seven genes not
          previously reported to be critical for meiotic events.
        reference_section_type: ABSTRACT
    reference_review:
      relevance: MEDIUM
      correctness: UNVERIFIED
      review_notes: >-
        PMID, title, and general screen are verified, but the cache is abstract-only
        (full_text_available: false) and the abstract does not mention mug151. UniProt's
        curator cites this paper for a mug151 role in meiosis, so the gene-specific
        evidence is left unresolved rather than overruled without the full text.
  - id: PMID:11859360
    title: The genome sequence of Schizosaccharomyces pombe.
    findings: []
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >-
        Genome-sequence reference establishing the SPAC3H1.03 locus; background/contextual,
        does not address mug151 function.
  - id: PMID:38065098
    title: SAP30BP interacts with RBM17/SPF45 to promote splicing in a subset of human short introns.
    findings:
      - statement: >-
          Human SAP30BP (a factor previously implicated in transcriptional control) is an
          essential splicing cofactor for RBM17/SPF45; this documents a splicing role for
          the SAP30BP/HCNGP family that mug151 belongs to, in human rather than S. pombe.
        reference_section_type: ABSTRACT
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; abstract-only. Characterizes the human ortholog SAP30BP as a
        splicing cofactor for RBM17/SPF45 on short introns, and notes it was previously
        implicated in transcriptional control. Informs the plausible molecular hypotheses
        for the family but does not assay the S. pombe protein mug151.
  - id: file:SCHPO/mug151/mug151-deep-research-falcon.md
    title: >-
      Falcon (Edison Scientific) deep research report: S. pombe mug151
      (Q10069 / SPAC3H1.03) functional annotation.
    findings:
      - statement: >-
          The literature search found no mug151-focused primary characterization and
          concluded that its molecular activity, partners, pathway, phenotype, and
          experimental localization remain unknown; SAP30BP/HCNGP family membership
          supports only a tentative regulatory-adaptor hypothesis.
        supporting_text: >-
          Mug151 (SPAC3H1.03; UniProt Q10069) is an uncharacterized protein of
          *Schizosaccharomyces pombe* whose gene was identified as meiotically up-regulated.
          The protein carries predicted SAP30BP/HCNGP-related sequence signatures, but its
          molecular activity, binding partners, pathway, phenotype, and subcellular
          localization have not been experimentally established.
        reference_section_type: OTHER
