  review:
    summary: Transfer from the Kgd4/MRPS36 ortholog (supporting entity mouse Q9CQX8); S. cerevisiae Kgd4 bridges the E3 (Lpd1) to the E1-E2 core. The curated UniProt FUNCTION and SUBUNIT comments, by similarity to S. cerevisiae Kgd4 (P19955), describe kgd4 as a molecular adapter that interacts with E3 via its N-terminus and with the E1-E2 core via its C-terminus. No S. pombe experimental data.
