    summary: Transfer from the S. cerevisiae ortholog. The curated UniProt FUNCTION and SUBUNIT comments (by similarity to S. cerevisiae Kgd4, P19955) place kgd4 in the 2-oxoglutarate dehydrogenase complex, which catalyses the TCA-cycle conversion of 2-oxoglutarate to succinyl-CoA; kgd4 acts in the cycle as the assembly/adaptor subunit of that enzyme rather than as a catalytic subunit. No S. pombe experimental data.
