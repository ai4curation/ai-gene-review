- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:P82908
  review:
    summary: Transfer of inner-membrane location from bovine KGD4/MRPS36 (UniProtKB:P82908). The protein is an OGDC subunit in the mitochondrial matrix; the inner-membrane placement likely reflects the family's earlier assignment to the mitoribosome small subunit.
    action: MARK_AS_OVER_ANNOTATED
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      record: UniProtKB:P82908
      requested_change: CHECK
      asserted_value: GO:0005743
      cause: PRACTICE_CHANGE
      confidence: SUSPECTED
      explanation: "Bovine KGD4/MRPS36 (UniProtKB:P82908) carries mitochondrial inner membrane only through Reactome TAS rows on mitochondrial translation reactions, which place it in the small subunit of the mitochondrial ribosome. The family was later shown to be a subunit of the 2-oxoglutarate dehydrogenase complex, a matrix enzyme, rather than a mitoribosome protein (PMID:25165143). The Reactome participation, and the location derived from it, should be checked against that reassignment."
      supported_by:
      - reference_id: PMID:25165143
        supporting_text: "This subunit is part of a conserved family of proteins that were previously annotated to be components of the small subunit of the mitochondrial ribosome."
    reason: 'Action changed from KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED. No evidence places S. pombe kgd4 in the inner membrane: its own UniProt location is Mitochondrion, by similarity to S. cerevisiae Kgd4 (P19955), with no TM segment. Work on S. cerevisiae Kgd4 showed that this family, previously assigned to the mitochondrial ribosome small subunit, is instead a subunit of the alpha-ketoglutarate dehydrogenase complex, a matrix enzyme (PMID:25165143). The ISO source is the bovine ortholog (UniProtKB:P82908), whose inner-membrane annotations are Reactome TAS rows on mitochondrial translation reactions, so the inner-membrane sub-compartment looks over-propagated. Not REMOVE, since peripheral membrane contact of OGDC is not excluded.'
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: UniProtKB:P82908
        source_label: KGD4/MRPS36 (Bos taurus)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: QuickGO lists the bovine GO:0005743 annotations only as Reactome TAS rows on mitochondrial translation reactions (R-BTA-5432387 and others), which treat the protein as a mitoribosome small-subunit component. That assignment was revised when the family was shown to be an OGDC subunit (PMID:25165143), so the inner-membrane location does not carry over to S. pombe kgd4.
    supported_by:
    - reference_id: PMID:25165143
      supporting_text: This subunit is part of a conserved family of proteins that were previously annotated to be components of the small subunit of the mitochondrial ribosome.
    - reference_id: PMID:25165143
      supporting_text: Our data establish that these proteins instead play an important role in the organization of mitochondrial KGDH, because they are necessary for recruiting the E3 subunit to the E1-E2 core of the enzyme
