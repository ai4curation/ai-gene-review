  label: Schizosaccharomyces pombe 972h-
description: kgd4 (ymr31; SPBC21B10.14; UniProt G2TRP3) encodes the fungal-type alpha-ketoglutarate dehydrogenase
  subunit 4 (Kgd4/MRPS36 family), an adaptor that recruits the E3 dihydrolipoyl dehydrogenase (dld1) to
  the E1-E2 core of the mitochondrial 2-oxoglutarate dehydrogenase complex. Function is assigned by orthology
  to S. cerevisiae Kgd4.
