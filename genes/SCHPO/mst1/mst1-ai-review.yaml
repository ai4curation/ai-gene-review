id: O94446
gene_symbol: mst1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  mst1 encodes the fission-yeast ESA1/TIP60-family MYST histone
  acetyltransferase and catalytic subunit of NuA4-family chromatin complexes.
  Mst1 acts in the nucleus on chromatin, acetylates H2A.Z/Pht1 and histone H3K4
  in addition to its conserved histone H4 activity, contributes to RNA
  polymerase II transcriptional regulation and pericentric heterochromatin
  assembly, and is recruited to double-strand breaks to promote resection and
  homologous-recombination repair.
