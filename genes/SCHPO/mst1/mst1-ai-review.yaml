- term:
    id: GO:0000812
    label: Swr1 complex
  evidence_type: IDA
  original_reference_id: PMID:19915592
  qualifier: part_of
  review:
    summary: >-
      The Swr1-complex evidence in PMID:19915592 supports the coupled
      SWR-C/Pht1/Mst1 pathway but not stable Mst1 membership in Swr1C.
    action: REMOVE
    reason: >-
      Kim et al. showed that Swr1C deposits H2A.Z/Pht1 into chromatin and that
      Mst1 then acetylates chromatin-associated Pht1; the same paper separates
      fission-yeast Swr1C from the Mst1 acetyltransferase complex. The distinct
      NuA4 complex is already captured by the direct GO:0035267 row, so this
      Swr1C membership assertion should simply be removed.
    supported_by:
    - reference_id: PMID:19915592
      supporting_text: >-
        Msc1.TAP purification did not identify Mst1 (or any non-shared subunit
        of the Swr1 and Mst1 Complexes: Supplementary Table 1), and unique
        members of the Mst1-C do not co-purify Msc1
