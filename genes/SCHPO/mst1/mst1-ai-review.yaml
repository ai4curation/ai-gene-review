core_functions:
- description: >-
    Mst1 is the fission-yeast ESA1/TIP60 catalytic subunit of NuA4 and
    acetylates histones on chromatin, including H4-family substrates and
    H2A.Z/Pht1, to regulate RNA polymerase II transcription.
  molecular_function:
    id: GO:0010485
    label: histone H4 acetyltransferase activity
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0035267
    label: NuA4 histone acetyltransferase complex
  supported_by:
  - reference_id: PMID:19915592
    supporting_text: >-
      WCEs from mst1-L271P cells showed no appreciable change in total Pht1
      levels but a profound reduction in Pht1Ac
- description: >-
    At pericentric heterochromatin, Mst1 acetylates histone H3K4 and promotes
    the chromodomain-protein switch that allows Swi6/Chp2-mediated
    heterochromatin reassembly.
  molecular_function:
    id: GO:0044016
    label: histone H3K4 acetyltransferase activity
  directly_involved_in:
  - id: GO:0031453
    label: positive regulation of heterochromatin formation
  locations:
  - id: GO:0005721
    label: pericentric heterochromatin
  supported_by:
  - reference_id: PMID:20299449
    supporting_text: >-
      H3K4ac, mediated by Mst1, is enriched at pericentromeres concomitantly
      with heterochromatin reassembly.
- description: >-
    Mst1 is recruited to DNA double-strand breaks and promotes chromatin
    remodeling needed for efficient repair-protein recruitment and long-range
    resection.
  molecular_function:
    id: GO:0004402
    label: histone acetyltransferase activity
  directly_involved_in:
  - id: GO:0140861
    label: DNA repair-dependent chromatin remodeling
  locations:
  - id: GO:0035861
    label: site of double-strand break
  supported_by:
  - reference_id: PMID:33723569
    supporting_text: >-
      Here we show that Mst1 is recruited to DSBs. Mutation of mst1 + disrupts
      recruitment of repair proteins and delays resection.
suggested_questions:
- question: >-
    Is H2A.Z/Pht1 the main Mst1 substrate at double-strand breaks, or does
    S. pombe Mst1 also acetylate repair proteins or canonical H2A/H4 residues
    at damage sites?
- question: >-
    Can purified S. pombe Mst1/NuA4 use 2-hydroxyisobutyryl-CoA or crotonyl-CoA
    directly, and are either of these secondary acyltransferase activities
    detectable on physiological histone substrates in fission yeast cells?
suggested_experiments:
- description: >-
    Purify native or reconstituted S. pombe NuA4 and compare acetyl-CoA,
    2-hydroxyisobutyryl-CoA, crotonyl-CoA, and butyryl-CoA use on recombinant
    nucleosomes and H2A.Z-containing nucleosomes by targeted acyl-lysine mass
    spectrometry.
- description: >-
    Combine inducible HO-break ChIP-seq for Mst1, H2A.Z/Pht1, H3K4ac, H4ac,
    Rad52, RPA, and Exo1 in wild-type, mst1 catalytic, and mst1 chromodomain
    mutants to separate catalytic versus chromodomain-dependent recruitment
    steps during homologous-recombination repair.
