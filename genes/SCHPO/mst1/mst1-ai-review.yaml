    supported_by:
    - reference_id: PMID:33723569
      supporting_text: >-
        Taken together, our data suggest that SpMst1contributes to repair of a
        variety of DNA lesions.
    - reference_id: PMID:38662722
      supporting_text: >-
        Our data further suggest that Mst1 is required for the global response
        to CPT and assembly of appropriate repair proteins.
