  evidence_type: IMP
  original_reference_id: PMID:33723569
  qualifier: involved_in
  review:
    summary: >-
      Mst1 directly contributes to DSB-repair chromatin remodeling.
    action: ACCEPT
    reason: >-
      Li et al. showed that Mst1 is recruited to a chromosomal DSB and that
      mst1 mutants disrupt repair-protein recruitment and resection. The newer
      W66R chromodomain study supports a related but separable Mst1 role in
      CPT-induced damage repair.
    additional_reference_ids:
