description: >-
  ppn1 (SPBC713.07c) encodes the Schizosaccharomyces pombe member of the fungal
  Ppn1 endopolyphosphatase family, a predicted type-II vacuolar membrane protein
  with a luminal metallo-dependent phosphatase domain. By orthology to the
  experimentally characterized Saccharomyces cerevisiae Ppn1 and by placement in
  the fungal PANTHER Ppn1 clade, the protein is expected to hydrolyze inorganic
  polyphosphate both by internal chain cleavage and by terminal phosphate
  release in the fungal vacuolar system.
