suggested_questions:
- question: >-
    Does S. pombe ppn1 generate a cytosolic high-molecular-mass
    exopolyphosphatase form analogous to S. cerevisiae PPN1, or is the
    ORFeome cytoplasm call a non-core pool of the vacuolar membrane precursor?
- question: >-
    Should PomBase revise the ppn1 energy-reserve annotation to the specific
    GO:0006798 polyphosphate catabolic process IBA already supplied by PAINT?
suggested_experiments:
- hypothesis: >-
    S. pombe Ppn1 hydrolyzes long-chain vacuolar polyphosphate by both endo-
    and exopolyphosphatase modes.
  description: >-
    Delete or epitope-tag SPBC713.07c in S. pombe, measure vacuolar
    polyphosphate chain length by polyacrylamide gel electrophoresis, and assay
    purified full-length or proteolytically processed Ppn1 with long-chain
    polyphosphate substrates and divalent cations.
  experiment_type: biochemical genetics
