description: arg7 (SPBC1773.14) encodes an argininosuccinate lyase (EC 4.3.2.1) of fission yeast, a lyase-1
  family enzyme orthologous to S. cerevisiae ARG4 and human ASL. It cleaves argininosuccinate to L-arginine
  and fumarate in the cytosol, the last step of arginine biosynthesis. S. pombe has a second argininosuccinate
  lyase, arg41 (SPBC1539.03c); in a genome-wide deletion screen the arg41 deletion, but not the arg7 deletion,
  caused arginine auxotrophy, so the two paralogs may differ in their in vivo contribution. Note that
  S. pombe arg7 is unrelated to S. cerevisiae ARG7 (ornithine acetyltransferase, S. pombe aga1).
