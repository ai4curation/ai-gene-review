suggested_questions:
- question: Why is the arg41 deletion an arginine auxotroph while the arg7 deletion is not, given that
    arg7 was originally defined as an arginine-requiring locus? Is the deletion-library arg7 strain correct,
    or is arg41 the main argininosuccinate lyase in vivo?
suggested_experiments:
- description: Measure argininosuccinate lyase activity and arginine prototrophy in freshly constructed
    arg7 and arg41 single and double deletions, and compare expression levels of the two paralogs.
