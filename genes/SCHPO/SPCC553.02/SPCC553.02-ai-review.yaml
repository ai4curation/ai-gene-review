  label: Schizosaccharomyces pombe 972h-
description: SPCC553.02 (qns1; UniProt O74940) encodes the essential glutamine-dependent NAD+ synthetase
  (EC 6.3.5.1). It amidates nicotinic acid adenine dinucleotide (NaAD) to NAD+, with glutamine as the
  nitrogen donor, the last step that both the de novo (kynurenine) and Preiss-Handler salvage routes share.
  CRISPRi knockdown of qns1 cuts NAD to about one-fifth and raises NaAD 23-fold, and also lowers the high-energy
  nucleotides ATP, GTP, CTP and UTP. The enzyme is cytosolic in a genome-wide screen.
