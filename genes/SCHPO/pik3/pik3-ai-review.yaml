    label: 1-phosphatidylinositol-3-kinase activity
  evidence_type: IMP
  original_reference_id: PMID:7772832
  qualifier: enables
  review:
    summary: Disruption drastically lowers PI3P.
    action: ACCEPT
    reason: Gene disruption of pik3 in S. pombe causes extremely low cellular PI3P levels, corroborating
      the direct biochemical assay of 1-phosphatidylinositol-3-kinase activity (PMID:7772832).
    supported_by:
    - reference_id: PMID:7772832
      supporting_text: Disruption of the gene resulted in extremely low levels of PI-3-P and higher levels
        of PI-4-P, supporting the idea that the gene codes for the PI-3 kinase of S. pombe.
- term:
    id: GO:0031321
    label: ascospore-type prospore assembly
  evidence_type: IMP
  original_reference_id: PMID:12557273
  qualifier: involved_in
  review:
    summary: pik3 deletion spores are inviable, with misoriented forespore membrane growth; an S. pombe-specific
      role of PI3P.
    action: ACCEPT
    reason: In pik3 deletion cells, forespore membrane growth is misoriented and spores are inviable,
      demonstrating a requirement for Pik3-generated PI3P in ascospore-type prospore assembly (PMID:12557273).
    supported_by:
    - reference_id: PMID:12557273
      supporting_text: the growth of the forespore membrane of deltapik3 cells was not correctly orientated
- term:
    id: GO:0032120
    label: ascospore-type prospore membrane formation
  evidence_type: IMP
  original_reference_id: PMID:15189449
  qualifier: involved_in
  review:
    summary: PI3P effectors Vps5/Vps17 reach the forespore membrane in a pik3-dependent way.
    action: ACCEPT
    reason: Pik3-generated PI3P recruits the sorting nexin effectors Vps5p and Vps17p to the forespore
      membrane to support proper forespore membrane formation (PMID:15189449).
    supported_by:
    - reference_id: PMID:15189449
      supporting_text: Vps5p and Vps17p migrated toward the the forespore membrane in a pik3+-dependent
        manner
