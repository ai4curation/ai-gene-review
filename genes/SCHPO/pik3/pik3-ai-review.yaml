id: P50520
gene_symbol: pik3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pik3 (vps34; SPAC458.05; UniProt P50520) encodes the only phosphatidylinositol 3-kinase of
  fission yeast, a class III enzyme that phosphorylates phosphatidylinositol at the D-3 position to make
  PI3P and does not make PI(3,4)P2 or PIP3. Like its orthologs, it works in two complexes with Vps15 and
  Atg6. Complex I, with Atg14 and the fission-yeast-specific Atg8-binding Atg38, makes PI3P at the phagophore
  assembly site for autophagy. Complex II, with Vps38, acts on endosomes for vacuolar protein sorting.
  pik3 deletion cells lose PI3P, have enlarged vacuoles and are sensitive to heat and salt. During sporulation,
  PI3P recruits the sorting nexins Vps5/Vps17 to orient forespore membrane growth, and pik3 deletion spores
  are inviable.
