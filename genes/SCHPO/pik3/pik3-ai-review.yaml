  review:
    summary: PAINT inference; Vps34 in PtdIns3K complex I makes PI3P at the phagophore, needed for autophagosome
      formation. Supported by S. pombe complex I work.
    action: ACCEPT
    reason: Pik3 is the catalytic subunit of fission yeast PtdIns3K complex I (with Vps15, Atg6, Atg14,
      and Atg38), which generates PI3P at the phagophore assembly site and establishes a positive feedback
      loop with Atg8 to drive autophagosome formation (PMID:31941401).
    supported_by:
    - reference_id: PMID:31941401
