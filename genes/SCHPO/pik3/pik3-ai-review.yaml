- term:
    id: GO:0048015
    label: phosphatidylinositol-mediated signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0015279
  - PANTHER:PTN000005673
  - dictyBase:DDB_G0278727
  review:
    summary: PAINT inference of PI-mediated signalling; PI3P recruits effectors, but signalling is a loose
      description of class III PI3K function.
    action: KEEP_AS_NON_CORE
    reason: Pik3-generated PI3P acts as a lipid landmark recruiting FYVE/PX/PROPPIN effectors on endosomal,
      autophagic, and forespore membranes, which fits the broad PI3K-family node (PTN000005673), but
      class III PI3K function is primarily membrane trafficking and autophagosome biogenesis rather than
      second-messenger signaling; kept as non-core, matching the worm vps-34 review.
    supported_by:
    - reference_id: PMID:8719881
      supporting_text: Immunoisolated Vps34p specifically phosphorylates phosphatidylinositol on the D-3
        position of the inositol ring
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000005673
        source_status: SUPPORTS_TRANSFER
        comment: PI3K family node; effector recruitment by PI3P fits broadly within phosphoinositide signaling and is retained as non-core.
      - source_id: FB:FBgn0015279
        source_status: SUPPORTS_TRANSFER
        comment: Drosophila PI3K family evidence supports the broad family-level process as non-core.
      - source_id: dictyBase:DDB_G0278727
        source_status: SUPPORTS_TRANSFER
        comment: Dictyostelium PI3K family evidence supports the broad family-level process as non-core.
