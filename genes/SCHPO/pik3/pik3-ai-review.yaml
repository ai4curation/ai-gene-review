        autophagy, and the latter, composed of Vps34, Vps15, Atg6, and Vps38, participates in vacuolar
        protein sorting [31–33].
    - reference_id: PMID:31941401
      supporting_text: We revealed that the Atg38-Atg8 interaction establishes a positive feedback loop
        between Atg8 and the PtdIns3K complex I to facilitate autophagosome formation.
