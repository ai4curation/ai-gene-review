  - PANTHER:PTN000132136
  - SGD:S000001917
  review:
    summary: >-
      Pexophagy is seeded by S. cerevisiae Atg18, inside the fungal Atg18 clade that holds atg18. Kept as a
      non-core, cargo-specific process.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The IBD is at the family root PTN000132136 (419 leaves) with one seed, S. cerevisiae
      Atg18 (SGD:S000001917, IMP, PMID:11739783). The seed and atg18 join at the fungal node PTN000132222 (16
      leaves), so the target is inside the seeded clade, and atg18 is required for macroautophagy in fission
      yeast. Pexophagy has not been tested in fission yeast, but absence of a test is not a ground, and
      nothing on atg18 argues against a role when peroxisomes are the cargo. One caution on this branch is
      that budding yeast Atg21, the paralog of the seed, is recorded in its own review as tested and not
      needed for pexophagy. atg18 predates that duplication (it joins both paralogs at PTN000132222) and is a
      core PROPPIN of fission yeast autophagy, so the Atg18 reading is taken. Pexophagy is a cargo-specific
      process and not the phosphoinositide adaptor core, so the row is non-core. The root placement is too
      deep for the other root child (PTN000132247), which holds no seed.
