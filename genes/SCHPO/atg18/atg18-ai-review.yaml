  label: Schizosaccharomyces pombe 972h-
description: Schizosaccharomyces pombe Atg18 is the fungal Atg18 PROPPIN phosphoinositide
  effector. It localizes to the phagophore assembly site, endosomal compartments and the fungal-type
  vacuole membrane, where its PI3P/PI(3,5)P2-dependent adaptor activity supports Atg2-linked
  autophagosome formation and endolysosomal membrane traffic.
