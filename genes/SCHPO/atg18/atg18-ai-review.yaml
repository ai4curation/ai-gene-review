- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0035850
  - PANTHER:PTN000132136
  - SGD:S000006021
  review:
    summary: >-
      Mitophagy uses the core autophagy machinery, and atg18 sits in the fungal Atg18 clade that holds one of
      the two seeds. Kept as a non-core, cargo-specific process.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The IBD is at the family root PTN000132136 (419 leaves) with two seeds, S. cerevisiae
      Atg21 (SGD:S000006021, IMP, PMID:19793921) and Drosophila Atg18a (FB:FBgn0035850). Both seeds and atg18
      lie in the same root child PTN000132137 (144 leaves). atg18 joins the Atg21 seed at the fungal node
      PTN000132222 (16 leaves), where the Schizosaccharomyces pair of atg18 and its paralog Q9P6N1
      (PTN002257653) is sister to the budding yeast Atg18 and Atg21 lineage, and it joins the fly seed at
      PTN000132139 (87 leaves). The target is inside the seeded clade and nothing on atg18 argues against the
      term. atg18 is required for macroautophagy in fission yeast (the accepted IMP rows), and this review
      already accepts the more specific mitophagy row that PomBase inferred from that role. Mitophagy is a
      cargo-specific process and not the phosphoinositide adaptor core, so the row is non-core. The root
      placement is still too deep for the other root child (PTN000132247, the Hsv2 and WDR45 side), which
      holds no seed.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Both seeds and the target sit in the root child PTN000132137; the target joins the Atg21 seed at
          the fungal node PTN000132222.
