- term:
    id: GO:0061723
    label: glycophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0035850
  - PANTHER:PTN000132136
  review:
    summary: >-
      Glycophagy is seeded by Drosophila Atg18a, the fly member of the Atg18, WIPI1 and WIPI2 ortholog node
      that also holds atg18. Kept as a non-core, cargo-specific process.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The IBD is at the family root PTN000132136 (419 leaves) with one seed, Drosophila
      Atg18a (FB:FBgn0035850, IMP, PMID:24265594), whose evidence is a requirement for the core autophagy
      machinery in glycogen autophagy. The seed sits in the metazoan clade PTN000881175 (67 leaves) and atg18
      is in the sister fungal clade PTN000881190 (20 leaves); the two join at PTN000132139 (87 leaves, the
      Atg18, WIPI1 and WIPI2 node), so the target is inside the ortholog node that holds the seed. Glycogen
      autophagy has not been described in fission yeast and nothing in the sources of this review tests it.
      That is absence of a test and not a ground. atg18 is the Atg18 ortholog and is required for
      macroautophagy in fission yeast, the seed's evidence is for the shared core machinery, and the S.
      cerevisiae ATG18 review keeps the same row in this fungal clade because glycogen is delivered to the
      vacuole by autophagy in budding yeast. Nothing on atg18 argues against a role when glycogen is the
      cargo, and the pexophagy row of this review is kept on the same reasoning. Glycophagy is a
      cargo-specific process and not the phosphoinositide adaptor core, so the row is non-core. The root
      placement is too deep for the other root child (PTN000132247, the Hsv2 and WDR45 side), which holds no
      seed; the PAINT fix is to move the IBD down to PTN000132139.
    propagation_review:
