taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: erg1 (SPBC713.12) encodes squalene epoxidase (squalene monooxygenase, EC 1.14.14.17) of Schizosaccharomyces
  pombe, an FAD-dependent, multi-pass ER-membrane flavoenzyme that uses O2 and electrons from NADPH-cytochrome P450
  reductase to convert squalene to (S)-2,3-epoxysqualene, the substrate of lanosterol synthase Erg7. It is the first
  oxygen-requiring step of ergosterol synthesis and the target of allylamine antifungals such as terbinafine; loss
  or inhibition of Erg1 causes squalene accumulation. Its expression rises under anaerobic conditions.
