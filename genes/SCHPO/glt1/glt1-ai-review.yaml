taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: glt1 (SPAPB1E7.07; UniProt Q9C102) encodes the large NADH-dependent glutamate synthase (GOGAT;
  EC 1.4.1.14), a multidomain FMN-, FAD- and Fe-S-containing enzyme. It transfers the amide nitrogen of
  glutamine to 2-oxoglutarate, giving two glutamate, and completes the GS/GOGAT ammonia assimilation cycle
  with gln1. Mutants lacking GOGAT (glu4, gog1) are defective in ammonia assimilation, especially under
  nitrogen limitation. glt1 deletion also impairs the filamentous invasive growth induced by ammonium
  limitation. The enzyme is cytosolic in a genome-wide screen.
