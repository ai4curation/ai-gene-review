gene_symbol: dlp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: dlp1 encodes subunit 2 of the fission yeast decaprenyl diphosphate synthase, a heterotetramer
  of two Dps1 and two Dlp1 subunits that condenses isopentenyl diphosphate onto farnesyl diphosphate to
  make all-trans-decaprenyl diphosphate, the C50 side chain of ubiquinone-10. Dlp1 belongs to the FPP/GGPP
  synthase family but is only weakly similar to Dps1 and to canonical prenyl diphosphate synthases; neither
  subunit is active alone. The dlp1 deletion lacks the enzyme activity and CoQ10 and shows the coq-mutant
  phenotypes of hydrogen peroxide sensitivity, need for antioxidants on minimal medium and sulfide overproduction.
  Dlp1 localises to mitochondria. Human PDSS2 does not complement the dlp1 deletion.
