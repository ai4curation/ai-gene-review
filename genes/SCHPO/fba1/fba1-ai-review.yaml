  label: Schizosaccharomyces pombe 972h-
description: Fba1 (SPBC19C2.07) is the fructose-bisphosphate aldolase of the fission yeast Schizosaccharomyces
  pombe, a 358-residue class II (metal-dependent) aldolase that is unrelated in sequence to the class
  I aldolases of animals. It reversibly cleaves fructose 1,6-bisphosphate into dihydroxyacetone phosphate
  and glyceraldehyde 3-phosphate, operating in the glycolytic direction during fermentative growth and
  in the condensing direction in gluconeogenesis; by similarity it binds a catalytic and a structural
  Zn2+ per subunit and is a homodimer. fba1+ is essential, and CRISPRi knockdown causes accumulation of
  fructose 1,6-bisphosphate together with secondary changes in pentose-phosphate and purine intermediates.
  The protein is cytosolic, with some nuclear signal in genome-wide localisation.
