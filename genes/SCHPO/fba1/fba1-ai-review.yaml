suggested_questions:
- question: Why does fba1 knockdown not lower glyceraldehyde 3-phosphate levels, and does flux reroute
    through the non-oxidative pentose phosphate pathway (sedoheptulose 7-phosphate accumulation) when
    aldolase is limiting?
suggested_experiments:
- description: 13C-glucose flux analysis of fba1 CRISPRi knockdown cells to quantify rerouting of carbon
    through transketolase/transaldolase when aldolase activity is limiting.
