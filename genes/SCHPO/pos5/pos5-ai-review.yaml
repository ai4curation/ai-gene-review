- id: PMID:41926382
  title: Mitochondrial NAD kinase Pos5 is required for CoQ biosynthesis in yeasts.
  findings:
  - statement: S. pombe Δpos5 has 0.2-fold of wild-type CoQ10.
    supporting_text: CoQ levels in the Δpos5 strain of our construct were decreased to 0.2-fold of those
      in the wild-type strain
    reference_section_type: RESULTS
  - statement: The CoQ decrease is not explained by respiratory deficiency, because a cytochrome c mutant
      has near-normal CoQ.
    supporting_text: The Δcyc1 strain did not show a marked decrease in CoQ levels, suggesting that respiratory
      deficiency alone does not account for the low CoQ level in the Δpos5 strain.
    reference_section_type: RESULTS
  - statement: Δpos5 cannot use non-fermentable carbon, is H2O2-sensitive and grows slowly on minimal
      medium.
    supporting_text: The Δpos5 strain failed to grow on YEGES medium containing glycerol and ethanol as
      non-fermentable carbon sources and showed retarded growth on YES containing hydrogen peroxide as
      well as on minimal medium
    reference_section_type: RESULTS
  - statement: S. cerevisiae POS5 complements the S. pombe Δpos5 CoQ defect.
    supporting_text: CoQ levels in the NSP7 strain were recovered to 0.9-fold of that observed in the
      Δpos5 + pos5 strain (NSP11)
    reference_section_type: RESULTS
  - statement: Mitochondrial NADP+ and total NADP(H) are reduced in S. pombe Δpos5.
    supporting_text: Mitochondrial NADP+ level and total NADP(H) level in Δpos5 were decreased to 0.6-
      and 0.8-fold, respectively, of those in the wild-type strain
    reference_section_type: RESULTS
  - statement: Plasmid-expressed Pos5-GFP co-localises with MitoTracker, whereas the endogenous C-terminal
      GFP fusion is mislocalised and non-functional.
    supporting_text: The Pos5-GFP fluorescence overlapped with the MitoTracker Red FM signal (Fig 5), indicating
      that Pos5 localizes to mitochondria as a mitochondrial NAD(H) kinase
    reference_section_type: RESULTS
  - statement: Only a mitochondrially targeted NAD kinase rescues CoQ in Δpos5. A Pos5 lacking its first
      83 residues and cytosolic Utr1 do not.
    supporting_text: CoQ quantification showed that only MTS36UTR1 restored CoQ production, whereas neither
      ΔMTS83pos5 nor UTR1 could recover CoQ levels in the Δpos5 strain
    reference_section_type: RESULTS
  - statement: Overexpressing coq6 does not restore CoQ in Δpos5, so Coq6 is not the limiting step.
    supporting_text: However, CoQ levels in the Δpos5 strain overexpressing coq6 were comparable to that
      in the Δpos5 strain integrating a vector
    reference_section_type: RESULTS
  - statement: PHB partially restores CoQ in Δpos5.
    supporting_text: Supplementation of 0.5 mM PHB partially increased CoQ levels in the Δpos5 strain compared
      to the untreated condition
    reference_section_type: RESULTS
  - statement: The S. cerevisiae pos5 deletion also has 0.2-fold of wild-type CoQ6.
    supporting_text: CoQ6 levels in ΔScpos5 were decreased to 0.2-fold of those in the wild-type strain
    reference_section_type: RESULTS
  - statement: The NADPH-dependent reaction(s) that link Pos5 to CoQ synthesis are not identified.
    supporting_text: Our results suggest that the requirement for NADPH lies in the synthesis of the precursor
      of CoQ biosynthesis, although more detailed analysis is necessary to define the specific reaction(s)
      that depend on mitochondrial NADPH.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Nishihara et al. 2026 (PLoS One), the first functional study of S. pombe pos5. The
      full text is cached (PMC13046142), and title, journal and PMID agree. The S. pombe results are
      CoQ10 levels, growth phenotypes, ScPOS5 and mito-UTR1 complementation, mitochondrial NADP(H)
      measurements, GFP localisation, and coq6 overexpression and VA/PHB supplementation. The S.
      cerevisiae results are the ΔScpos5 CoQ6 level and phenotypes. The paper has no in vitro kinase
      assay of the S. pombe enzyme and no sub-mitochondrial localisation. Supplementary figures are
      available only as captions, and S1/S2 tables were not retrieved. Several key CoQ comparisons
      (VA rescue, atd1 overexpression) were not statistically significant.
