core_functions:
- description: Mitochondrial NAD(H) kinase. It phosphorylates NADH (preferred) and NAD+ with ATP to
    make NADPH/NADP+ in the mitochondrial matrix, and is the source of the mitochondrial NADP(H) pool
    in fission yeast. Function is inferred from the ScPos5 ortholog biochemistry and from S. pombe
    genetics. ScPOS5, or a mitochondrially targeted heterologous NAD kinase, replaces pos5, and Δpos5
    mitochondria have less NADP(H). This NADP(H) pool is required for normal CoQ10 levels, respiratory
    growth, H2O2 resistance and arginine prototrophy, but these are downstream consequences of
    reductant supply.
  molecular_function:
    id: GO:0042736
    label: NADH kinase activity
  directly_involved_in:
  - id: GO:0006741
    label: NADP+ biosynthetic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:12727869
    supporting_text: recombinant Pos5p has NADH kinase activity
  - reference_id: PMID:41926382
    supporting_text: CoQ levels in the NSP7 strain were recovered to 0.9-fold of that observed in the Δpos5
      + pos5 strain (NSP11)
  - reference_id: PMID:41926382
    supporting_text: CoQ quantification showed that only MTS36UTR1 restored CoQ production, whereas neither
      ΔMTS83pos5 nor UTR1 could recover CoQ levels in the Δpos5 strain
  - reference_id: PMID:41926382
    supporting_text: Mitochondrial NADP+ level and total NADP(H) level in Δpos5 were decreased to 0.6- and
      0.8-fold, respectively, of those in the wild-type strain
  knowledge_gaps:
  - gap_statement: The mitochondrial NADPH-dependent reaction(s) through which Pos5 supports CoQ10
      biosynthesis are unknown. Deleting pos5 lowers CoQ10 to about 20% in both fission and budding
      yeast. The defect is not rescued by coq6 overexpression and is only partially relieved by PHB
      (and, not significantly, by vanillic acid or atd1 overexpression). This places the requirement
      upstream of the quinone ring modifications, perhaps in PHB synthesis, but no consuming enzyme has
      been identified. An indirect route through Fe-S cluster biogenesis has not been excluded.
    boundary: Established are the requirement for the mitochondrial NAD(H) kinase activity (a
      mitochondrially targeted heterologous NAD kinase rescues) and the fact that respiratory failure
      alone does not explain the CoQ loss (the Δcyc1 control). Not established is which enzyme or
      step consumes Pos5-derived NADPH for CoQ synthesis, and whether the link is direct.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: Identifying the step would tell us whether Pos5 should be considered a dedicated
      cofactor supplier for a specific CoQ reaction or a general redox-pool enzyme. It would also inform
      whether the human mitochondrial NAD kinase (NADK2) has a role in CoQ deficiency.
    resolution: Profile CoQ pathway intermediates (prenylated PHB, ring-modified intermediates) and
      PHB/4-hydroxybenzaldehyde levels in Δpos5. Test mitochondrial Fe-S enzyme activities (aconitase,
      complex II) in parallel, and test rescue by targeted NADPH-generating systems.
    provenance:
    - reference_id: PMID:41926382
      supporting_text: Our results suggest that the requirement for NADPH lies in the synthesis of the
        precursor of CoQ biosynthesis, although more detailed analysis is necessary to define the specific
        reaction(s) that depend on mitochondrial NADPH.
    - reference_id: PMID:41926382
      supporting_text: While we cannot rule out a possibility that Pos5 deficiency indirectly affects CoQ
        levels via impaired Fe-S cluster biogenesis
suggested_questions:
- question: Should Pos5 carry GO:0006744 ubiquinone biosynthetic process? This review does not add it.
    Pos5 supplies mitochondrial NADPH, but no CoQ biosynthetic step is assigned to it. A comparator
    query (QuickGO, GO:0006744 and descendants, S. pombe, S. cerevisiae and human) finds the Coq enzymes
    and the ferredoxin/ferredoxin reductase electron donors to Coq6 (arh1, etp1, ARH1, YAH1, FDXR,
    FDX2), but no NADPH-generating enzyme (ScPOS5, UTR1, ZWF1, NADK, NADK2, G6PD, zwf1). The CoQ
    phenotype would be better captured as a FYPO phenotype (decreased ubiquinone level). If the
    consuming step is identified, a has_input/causal link in a GO-CAM model would express the
    dependency better than a process annotation.
- question: Does S. pombe Pos5 prefer NADH over NAD+ as its ScPos5 ortholog does? In S. pombe Δpos5
    mitochondria NADP+ falls more than NADPH, whereas in S. cerevisiae Δpos5 NADPH falls most. Could
    this reflect different substrate preference, or compensating NADP+-reducing activities?
- question: Where is the processing site of the Pos5 presequence? UniProt predicts a 42-residue transit
    peptide, whereas the authors align residues 1-83 to the 62-residue ScPos5 presequence.
- question: Why does the endogenous C-terminal GFP fusion mislocalise and lose function, while the
    plasmid-expressed fusion localises to mitochondria? Is the C-terminus needed for oligomerisation
    or import?
suggested_experiments:
- hypothesis: S. pombe Pos5 is an NADH-preferring NAD kinase.
  description: Purify recombinant mature S. pombe Pos5 and measure its kinetics with NADH and NAD+ (ATP
    and polyphosphate as donors) to confirm the inferred NADH kinase activity and substrate preference.
  experiment_type: in vitro enzyme assay
- hypothesis: Pos5 acts in the mitochondrial matrix.
  description: Use sub-mitochondrial fractionation and protease protection assays (mitoplasts, carbonate
    extraction) of functional tagged Pos5 to place it in the matrix.
  experiment_type: biochemical fractionation
- hypothesis: A specific NADPH-dependent step upstream of ring modification limits CoQ synthesis in Δpos5.
  description: Use LC-MS profiling of CoQ intermediates and of PHB/4-hydroxybenzaldehyde in wild type,
    Δpos5 and Δpos5 with PHB supplementation, with mitochondrial Fe-S enzyme activity measurements to
    separate a direct cofactor role from indirect Fe-S effects.
  experiment_type: metabolomics
