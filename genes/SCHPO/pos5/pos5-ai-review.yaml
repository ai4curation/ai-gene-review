    summary: PAINT inference from the S. cerevisiae Pos5 node. ScPos5 was shown to be in the
      mitochondrial matrix.
    action: ACCEPT
    reason: The PAINT node is seeded by ScPOS5, which was localised to the matrix experimentally
      (PMID:12727869). S. pombe pos5 is the 1:1 ortholog (PANTHER subfamily PTHR20275:SF26). Several
      independent lines support the matrix in S. pombe. First, there is an N-terminal mitochondrial
      transit peptide, and deleting the first 83 residues abolishes function. Second, the protein's
      product, mitochondrial NADP(H), is a matrix cofactor pool, and that pool is depleted in Δpos5.
      Third, an unrelated NAD kinase rescues only when given a matrix-targeting presequence (the
      SpCoq3 MTS). No sub-mitochondrial fractionation has been done in S. pombe. Even so, the matrix is
      where the activity is expected to act, so this is the core location.
