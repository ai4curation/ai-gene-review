taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: pos5 (SPAC323.01c) encodes the mitochondrial NAD(H) kinase of fission yeast, an NAD
  kinase family enzyme that phosphorylates NADH (and NAD+) with ATP to make NADPH (NADP+) inside
  mitochondria. Because NADP(H) cannot be imported into yeast mitochondria, this kinase is the
  source of the mitochondrial NADP(H) pool. The protein carries an N-terminal mitochondrial targeting
  sequence and localises to mitochondria, most likely to the matrix as shown for its budding-yeast
  ortholog Pos5. Deletion lowers mitochondrial NADP+ and total NADP(H) and reduces cellular coenzyme
  Q10 to about 20% of wild type. The mutant cannot grow on non-fermentable carbon sources, is
  hypersensitive to hydrogen peroxide, overproduces sulfide, is partially arginine-requiring and has
  rounded cells. These defects are rescued by budding-yeast POS5, or by the cytosolic NAD kinase Utr1
  only when it is targeted to mitochondria. The CoQ deficiency points to an unidentified
  NADPH-dependent step upstream of the quinone ring modifications rather than at the Coq6
  hydroxylase.
