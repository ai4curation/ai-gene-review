  label: Schizosaccharomyces pombe 972h-
description: SPAC1F12.07 (UniProt Q10349; the fission yeast SER1 ortholog) encodes phosphoserine aminotransferase
  (EC 2.6.1.52), a PLP-dependent class V aminotransferase. It transaminates 3-phosphohydroxypyruvate with
  glutamate to O-phospho-L-serine, the second step of phosphorylated serine synthesis. Function is assigned
  by orthology; a genome-wide screen places it in the cytosol.
