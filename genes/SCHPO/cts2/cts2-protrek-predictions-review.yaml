id: Q9C105
gene_symbol: cts2
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for the single GH18 chitinase-like protein of S. pombe, which
  UniProt notes lacks the catalytic Glu166 essential for chitinase activity. Every top-five call assumes
  active chitin degradation, and three of the five resolve to obsoleted GO terms. This review assigns
  carbohydrate binding as the residual core function precisely because the catalytic residue is absent
  - the model has no way to register that negative. Assessment: 1 uncertain (UNC), 2 nonparalog incorrect
  (NPI).
