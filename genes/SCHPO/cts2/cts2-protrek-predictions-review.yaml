    summary: >-
      Top-ranked hit (score 17.88). Ascospore wall chitin catabolism is a budding-yeast sporulation
      process (Cts2/Cts3), it is obsolete in the current GO release, and it assumes a catalytic activity
      this protein lacks. Three failure modes in one call: pseudoenzyme over-annotation, a species-specific
      process, and a stale identifier.
