    summary: >-
      Rank 4 (score 15.57), reviewed in place of rank 3 (cell wall chitin catabolic process), which
      is also obsolete. Fungal-type cell wall polysaccharide metabolic process is broad enough to
      accommodate a non-catalytic carbohydrate-binding role at the cell wall, which is what this review
