    summary: >-
      Rank 2 (score 15.93). The meiotic spindle pole body, and at ranks 3 and 4 the old mitotic SPB
      and its half bridge: four SPB compartments within 0.4 score units. The same SPB cluster headed
      the list for SPCC16C4.02c earlier in this cohort, where it was at least consistent with an HDA
      annotation. Returning it again for an autophagy adaptor with no SPB connection marks it as an
