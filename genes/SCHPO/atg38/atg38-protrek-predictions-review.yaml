    summary: >-
      Top-ranked hit (score 16.06). Atg38 is a cytosolic and PAS-localised subunit of the autophagy-specific
      PI3-kinase complex; it has no spindle pole body role and none is annotated. The coiled-coil
      homodimerisation domain is the likely culprit - SPB components are coiled-coil-rich and heavily
      represented in the S. pombe cellular-component text - but a coiled coil is not a localisation
      signal.
