    summary: >-
      Rank 3 (score 15.89). A third SPB variant, this one specifying the older of the two poles. The
      specificity is striking given that nothing supports even the general compartment: the model
      is confident to the level of distinguishing old from new spindle pole bodies for a protein that
      is not at either. This is the cohort's clearest example of over-specific localisation with no
      underlying signal.
