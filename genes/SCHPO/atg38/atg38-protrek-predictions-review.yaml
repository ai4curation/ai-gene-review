  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843) (Fission yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Atg38, the MIT-domain adaptor subunit of PtdIns3K complex
  I. This is a complete miss: four of the five calls are spindle pole body compartments and the fifth
  is prospore-membrane lipid droplet localisation, none of which relates to autophagy. The annotated
  PtdIns3K complex I membership (EXP, IDA) and phagophore assembly site localisation (IDA) are absent
  from the top five. The free-text channel is barely better, returning 'Has a role in meiosis' - the
  mug167 alternative name reflects meiotic transcriptional upregulation, which this review explicitly
  warns does not indicate a meiotic function. Assessment: 2 nonparalog incorrect (NPI), 1 repetition
  (REP).
