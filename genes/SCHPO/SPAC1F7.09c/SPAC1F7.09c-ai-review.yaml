  label: Schizosaccharomyces pombe 972h-
description: SPAC1F7.09c (ala1; UniProt Q09913) encodes allantoicase (EC 3.5.3.4), which hydrolyses allantoate
  to ureidoglycolate and urea in the allantoin branch of purine catabolism. ala1 mutants lack allantoicase
  and cannot use allantoic acid as a nitrogen source. The protein is cytosolic in a genome-wide screen.
