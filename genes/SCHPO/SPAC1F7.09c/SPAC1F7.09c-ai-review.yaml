  - SGD:S000001468
  review:
    summary: PAINT inference; consistent.
    action: ACCEPT
    reason: 'Allantoicase activity rests on S. pombe genetics (ala1 mutants lack allantoicase; PomBase maps ala1 to SPAC1F7.09c) and on membership of the allantoicase family (UniProt SIMILARITY, HAMAP MF_00813, two Pfam Allantoicase repeats). PANTHER assigns the protein to subfamily PTHR12045:SF3, named ''inactive allantoicase-related'', but the genetic loss-of-activity evidence for ala1 outweighs a subfamily label, so the inference is kept.'
