  label: Schizosaccharomyces pombe 972h-
description: erg12 (SPAC13G6.11c; UniProt Q09780) encodes mevalonate kinase (EC 2.7.1.36), a GHMP-family
  kinase that phosphorylates mevalonate to 5-phosphomevalonate using Mg-ATP, the first of three ATP-dependent
  steps that turn mevalonate into isopentenyl diphosphate. Function is assigned by orthology to S. cerevisiae
  ERG12 and human MVK; a genome-wide screen places it in the cytosol.
