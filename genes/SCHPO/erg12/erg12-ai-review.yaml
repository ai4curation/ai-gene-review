id: Q09780
gene_symbol: erg12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: erg12 (SPAC13G6.11c; UniProt Q09780) encodes mevalonate kinase, the GHMP-family enzyme that
  phosphorylates (R)-mevalonate with ATP to form (R)-mevalonate 5-phosphate. This is the first of three
  ATP-dependent reactions that convert mevalonate into isopentenyl diphosphate, which feeds farnesyl
  diphosphate production for sterols and other isoprenoid products. The soluble protein has been detected
  in the cytosol and nucleus, with the cytosol matching its conserved mevalonate-pathway role.
