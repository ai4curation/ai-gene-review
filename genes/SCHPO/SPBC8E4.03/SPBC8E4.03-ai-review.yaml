taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPBC8E4.03 (PomBase agm3; UniProt O42887) is one of three arginase-family ureohydrolases
  of fission yeast that UniProt and PomBase annotate as putative agmatinases (agmatine -> putrescine +
  urea). S. pombe has no recognised biosynthetic arginine decarboxylase, so where agmatine comes from,
  and whether these enzymes contribute to polyamine synthesis alongside ornithine decarboxylase (spe1),
  is unknown. Some subfamily members are guanidinobutyrases, and PANTHER places one paralog (SPBC8E4.03)
  under a guanidinobutyrase node. None of the three has been characterised biochemically.
