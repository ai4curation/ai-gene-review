- term:
    id: GO:0102772
    label: sphingolipid C4-monooxygenase activity
  evidence_type: ISO
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - SGD:S000004885
  review:
    summary: ISO transfer of sphingolipid C4-monooxygenase activity from S. cerevisiae SCS7. The term names
      C-4 hydroxylation of the sphingoid base, which in yeast is the Sur2 reaction; Scs7-family enzymes
      hydroxylate the amide-linked very long chain fatty acid at C-2.
    action: MARK_AS_OVER_ANNOTATED
    source_defects:
    - defect_type: WRONG_TERM
      resource: SGD
      record: SGD:S000004885
      requested_change: CHECK
      asserted_value: GO:0102772
      confidence: PROBABLE
      explanation: "S. cerevisiae SCS7 (SGD:S000004885) is annotated to GO:0102772 sphingolipid C4-monooxygenase activity, which names C-4 hydroxylation of the sphingoid base. Haak et al. (PMID:9368039) assign that reaction to Sur2p and assign hydroxylation of the amide-linked very long chain fatty acid to Scs7p, a fatty acid 2-hydroxylase. The SCS7 annotation should be checked, and the fatty acid 2-hydroxylase activity used instead if C-4 hydroxylation is not supported for Scs7p."
      supported_by:
      - reference_id: PMID:9368039
        supporting_text: "Sur2p is required for the hydroxylation of C-4 of the sphingoid moiety of ceramide, and Scs7p is required for the hydroxylation of the very long chain fatty acid."
    reason: The donor is the true ortholog, S. cerevisiae SCS7 (SGD:S000004885), but its own annotation
      to this term is a mis-mapping. Haak et al. assign C-4 hydroxylation of the ceramide sphingoid moiety
      to Sur2p and very long chain fatty acid hydroxylation to Scs7p, and the S. pombe scs7 curated function
      (by similarity to Q03529) is C-2 hydroxylation of the fatty acyl chain. The ceramide-hydroxylase essence
      holds, but the C-4 position over-reaches; the fatty acid 2-hydroxylase activity is already annotated.
    supported_by:
    - reference_id: PMID:9368039
      supporting_text: Sur2p is required for the hydroxylation of C-4 of the sphingoid moiety of ceramide,
        and Scs7p is required for the hydroxylation of the very long chain fatty acid.
    - reference_id: file:SCHPO/scs7/scs7-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Postulated to hydroxylate the very long chain fatty acid of dihydroceramides and
        phytoceramides at C-2.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: SGD:S000004885
        source_status: SOURCE_BAD
        comment: S. cerevisiae SCS7, the true ortholog. Its own annotation to sphingolipid C4-monooxygenase
          activity is a mis-mapping (C-4 hydroxylation of the sphingoid base is the Sur2 activity; Scs7 is
          the fatty acyl 2-hydroxylase), so the transferred term is wrong for scs7 as well.
