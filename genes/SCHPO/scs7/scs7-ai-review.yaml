  label: Schizosaccharomyces pombe 972h-
description: scs7 (SPAC19G12.08; UniProt O13846) encodes the ceramide very-long-chain fatty acid 2-hydroxylase
  (FA2H/Scs7 family), an ER-membrane dimetal hydroxylase that lacks the N-terminal cytochrome b5 domain of its
  orthologs and hydroxylates the amide-linked
  VLCFA of ceramide at C2. The hydroxylated ceramides feed IPC and MIPC, the main complex sphingolipids
  of fission yeast. It is in the ER in a genome-wide screen.
