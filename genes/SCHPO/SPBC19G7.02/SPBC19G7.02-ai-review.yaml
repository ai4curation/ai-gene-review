  review:
    summary: EC/RHEA mapping of aminodeoxychorismate lyase.
    action: ACCEPT
    reason: The EC/RHEA mapping rests on the curated by-similarity UniProt function and reaction notes and
      on assignment to the PANTHER aminodeoxychorismate lyase subfamily (PTHR42743:SF11), which separates
      it from other class-IV PLP-dependent aminotransferases. The S. cerevisiae ortholog Abz2 was shown
      to be the founding member of a fungal group of these lyases (PMID:17873082). No S. pombe assay.
    supported_by:
