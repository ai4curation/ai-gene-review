description: SPBC19G7.02 (UniProt O42951; the fission yeast ABZ2 ortholog) encodes a PLP-dependent 4-amino-4-deoxychorismate
  lyase (EC 4.1.3.38), which releases pyruvate from 4-amino-4-deoxychorismate to give 4-aminobenzoate,
  the pABA moiety of folate. Function is assigned by orthology; it is cytosolic in a genome-wide screen.
