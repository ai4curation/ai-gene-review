  review:
    summary: Generic InterPro-derived parent of the specific activity, which is already annotated.
    action: MODIFY
    reason: Correct but uninformative. UniProt's by-similarity function (ECO:0000250) and the
      aminodeoxychorismate lyase subfamily assignment (PTHR42743:SF11, within the class-IV PLP-dependent
      aminotransferase fold) specify the activity as 4-amino-4-deoxychorismate lyase (GO:0008696),
      which the gene already carries. Family and by-similarity evidence (S. cerevisiae Abz2 is the
      characterised fungal enzyme); no S. pombe assay is cached.
