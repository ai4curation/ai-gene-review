taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: lcb1 (UniProt O59682) encodes a subunit of serine palmitoyltransferase (SPT; EC 2.3.1.50),
  the ER-membrane heterodimer of Lcb1 and Lcb2 that condenses L-serine with palmitoyl-CoA to 3-ketodihydrosphingosine,
  the first and rate-limiting step of sphingolipid synthesis. Lcb2 carries the PLP-binding catalytic lysine;
  Lcb1 is the structural partner. Function is assigned by orthology to S. cerevisiae LCB1/LCB2.
