  - UniProtKB-SubCell:SL-0086
  review:
    summary: Cytoplasm is true but generic; SPT is an ER membrane complex, and the more specific ER location
      is asserted (ACCEPT) elsewhere in this review.
    action: TOO_GENERAL
    reason: The ER is part of the cytoplasm, so this row is entailed by the endoplasmic reticulum annotation,
      which rests on the S. pombe ORFeome localisation screen (UniProt ECO:0000269|PubMed:16823372). The UniProt
      cytoplasm statement itself is by similarity to S. cerevisiae LCB1 (ECO:0000250|UniProtKB:P25045). Changed
      from KEEP_AS_NON_CORE because the term is correct but general and the specific descendant is on the
      gene.
    supported_by:
    - reference_id: file:SCHPO/lcb1/lcb1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250|UniProtKB:P25045, ECO:0000255}. Endoplasmic
        reticulum {ECO:0000269|PubMed:16823372}.'
