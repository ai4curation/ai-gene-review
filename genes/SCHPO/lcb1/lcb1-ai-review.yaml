- term:
    id: GO:0046512
    label: sphingosine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1099431
  - PANTHER:PTN000343996
  - UniProtKB:O15269
  review:
    summary: PAINT inference of sphingosine biosynthesis; SPT makes 3-ketosphinganine, the first long-chain
      base of the sphingoid base pathway.
    action: KEEP_AS_NON_CORE
    reason: The IBA follows from Lcb1's membership of the PANTHER SPT1 subfamily, and nothing places the target
      outside the PAINT clade. SPT forms the long-chain base 3-ketosphinganine (by similarity to S. cerevisiae
      LCB1, ECO:0000250|UniProtKB:P25045), the precursor of the sphingoid bases. Kept as non-core because
      the core process recorded is ceramide biosynthesis.
    supported_by:
    - reference_id: file:SCHPO/lcb1/lcb1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: condensation of serine with palmitoyl CoA to form the long chain base
    - reference_id: file:SCHPO/lcb1/lcb1-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PTHR13693:SF2; SERINE PALMITOYLTRANSFERASE 1
