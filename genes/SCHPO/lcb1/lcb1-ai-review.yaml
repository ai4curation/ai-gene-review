  review:
    summary: Serine palmitoyltransferase activity (PAINT/EC/similarity); the Lcb1-Lcb2 heterodimer is
      the catalytic SPT (contributes).
    action: ACCEPT
    reason: The SPT activity is assigned by similarity to S. cerevisiae LCB1 (UniProtKB:P25045; the
      UniProt FUNCTION and CATALYTIC ACTIVITY notes carry ECO:0000250|UniProtKB:P25045) and by
      membership of the PANTHER SPT1 subfamily. This is ortholog evidence, not an S. pombe assay. Lcb1
      is the non-catalytic partner of the Lcb1-Lcb2 heterodimer, so the activity belongs to the complex
      (contributes_to), as the core function records.
