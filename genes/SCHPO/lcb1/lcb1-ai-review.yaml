  review:
    summary: PLP cofactor of the SPT heterodimer; Lcb2 carries the catalytic PLP-binding lysine, Lcb1 is the
      non-catalytic partner.
    action: KEEP_AS_NON_CORE
    reason: The PLP cofactor is assigned by similarity to S. cerevisiae LCB1 (COFACTOR, ECO:0000250|UniProtKB:P25045)
      and by membership of the class-II PLP-dependent aminotransferase family (Pfam PF00155). Lcb1 lacks the
      catalytic lysine, so PLP binding is a property of the heterodimer to which Lcb1 contributes rather than
      a core Lcb1 activity.
