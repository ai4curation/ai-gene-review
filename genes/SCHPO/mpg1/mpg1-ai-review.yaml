  label: Schizosaccharomyces pombe 972h-
description: >-
  mpg1 (SPCC1906.01) is the fission yeast GDP-mannose pyrophosphorylase (mannose-1-phosphate

  guanylyltransferase), the catalytic GMPPB-type member of the sugar-1-phosphate nucleotidyltransferase

  family. In the cytoplasm it condenses alpha-D-mannose 1-phosphate (from pmm1) with GTP to form

  GDP-mannose and pyrophosphate, the final step of GDP-mannose synthesis that supplies mannose for

  N- and O-glycosylation, GPI anchors and cell-wall galactomannan. mpg1 null cells are defective in

  glycosylation, sensitive to cell-wall lytic enzyme, build an aberrant septum, and arrest as septated

  binucleate cells through a Wee1-dependent cell-size checkpoint, linking mannosylation capacity to

  cell-wall and septum assembly and to cell-cycle progression.
