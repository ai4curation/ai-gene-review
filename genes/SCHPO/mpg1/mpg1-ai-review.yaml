suggested_questions:
- question: >-
    Does S. pombe encode a non-catalytic GMPPA-like paralog that regulates mpg1 as human GMPPA regulates
    GMPPB, and is the mpg1 null arrest caused solely by GDP-mannose depletion?
suggested_experiments:
- description: >-
    Assay recombinant mpg1 for GTP-dependent GDP-mannose formation and measure GDP-mannose pools in mpg1
    deletion cells.
