  label: Schizosaccharomyces pombe 972h-
description: kgd1 (SPBC3H7.03c; UniProt O74378) encodes the E1 (2-oxoglutarate dehydrogenase, thiamine
  diphosphate-dependent; EC 1.2.4.2) subunit of the mitochondrial 2-oxoglutarate dehydrogenase complex.
  With E2 (kgd2), E3 (dld1) and the adaptor kgd4, it converts 2-oxoglutarate to succinyl-CoA in the TCA
  cycle. Function is assigned by orthology; it is mitochondrial in a genome-wide screen.
