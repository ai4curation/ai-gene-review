- term:
    id: GO:0042645
    label: mitochondrial nucleoid
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:P20967
  review:
    summary: Similarity transfer of mitochondrial nucleoid association from S. cerevisiae, where polypeptides
      of the alpha-ketoglutarate dehydrogenase complex co-purify with mtDNA nucleoids. Not shown in S. pombe.
    action: KEEP_AS_NON_CORE
    reason: The evidence is from S. cerevisiae, where nucleoid isolation unexpectedly recovered polypeptides
      of the alpha-ketoglutarate dehydrogenase complex alongside mtDNA packaging proteins (Kaufman et al.,
      as summarised in PMID:14597775). No S. pombe nucleoid study is cached. This is a moonlighting association,
      peripheral to the E1 activity, so it stays non-core.
    supported_by:
    - reference_id: PMID:14597775
      supporting_text: It was surprising, however, to find other abundant proteins, such as Aco1p, some polypeptides
        of the α-ketoglutarate dehydrogenase complex, and the chaperonin Hsp60, whose functions are ostensibly
        unrelated to mtDNA inheritance.
