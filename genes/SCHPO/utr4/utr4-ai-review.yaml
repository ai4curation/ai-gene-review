  label: Schizosaccharomyces pombe 972h-
description: utr4 (SPAC644.08; UniProt Q9P6Q2) encodes the bifunctional enolase-phosphatase E1 (acireductone
  synthase; EC 3.1.3.77), an Mg2+-dependent HAD-family enzyme. It enolises 2,3-diketo-5-methylthiopentyl-1-phosphate
  and dephosphorylates it to the acireductone 1,2-dihydroxy-3-keto-5-methylthiopentene, step 4 of the
  MTA cycle. Function is assigned by orthology to S. cerevisiae UTR4; a genome-wide screen places it in
  the cytosol.
