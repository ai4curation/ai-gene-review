- term:
    id: GO:0043048
    label: dolichyl monophosphate biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000324722
  - SGD:S000004615
  - UniProtKB:Q9UPQ8
  review:
    summary: Sec59 catalyzes the terminal step of de novo Dol-P synthesis.
    action: ACCEPT
    reason: Dolichol phosphorylation is the final step of de novo dolichyl monophosphate formation, so
      the enzyme does the work of this process directly. In S. cerevisiae sec59 cells Dol-P falls to under
      10% of wild type at the restrictive temperature while other Dol-P pathway enzymes are normal. The
      PAINT node is the same one carrying the kinase activity.
    supported_by:
    - reference_id: PMID:1323123
      supporting_text: Quantitative
        measurements of dolichyl phosphate in sec59 cells showed that the levels were
        decreased to 48% of wild type at the permissive temperature and to less than 10%
        at the restrictive temperature.
    - reference_id: PMID:12213788
      supporting_text: "Dolichol kinase (DK) catalyzes the CTP-mediated phosphorylation of dolichol in \n\
        eukaryotic cells, the terminal step in dolichyl monophosphate (Dol-P) \nbiosynthesis de novo."
- term:
    id: GO:0180047
    label: dolichol phosphate mannose biosynthetic process
  evidence_type: IC
  original_reference_id: GO_REF:0000111
  qualifier: involved_in
  supporting_entities:
  - GO:0004168
  review:
    summary: Sec59 catalyzes an upstream step (Dol-P formation) of the pathway leading to Dol-P-mannose.
    action: KEEP_AS_NON_CORE
    reason: GO:0180047 is defined as the chemical reactions and pathways resulting in formation of
      dolichol phosphate mannose, and the dolichyl phosphate made by Sec59 becomes the lipid moiety of
      Dol-P-Man, so Sec59 catalyzes a step of this pathway rather than merely being required for it.
      In S. cerevisiae sec59 membranes, Dol-P-Man synthesis is depressed unless exogenous Dol-P is
      supplied. The PomBase IC is therefore sound, but Dol-P-Man is only one of several Dol-P-dependent
      products (also Dol-PP-oligosaccharide and Dol-P-glucose), so the term is kept as non-core; the
      direct core process is dolichyl monophosphate biosynthesis.
    supported_by:
    - reference_id: PMID:1323123
      supporting_text: made normal amounts of dolichyl phosphate mannose when exogenous dolichyl
        phosphate was supplied, but dolichyl phosphate mannose synthesis was severely
        depressed in the absence of exogenous dolichyl phosphate.
