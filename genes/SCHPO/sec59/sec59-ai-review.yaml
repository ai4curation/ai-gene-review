  review:
    summary: Dolichol kinase activity inherited from the eukaryotic dolichol kinase node PTN000324722.
    action: ACCEPT
    reason: The PAINT curator placed dolichol kinase activity at PTN000324722 (eukaryote-level node),
      seeded by experimental annotations of S. cerevisiae SEC59 (SGD:S000004615), human DOLK (Q9UPQ8) and
      a trypanosome dolichol kinase (Q38DD5). Q9Y7T6 sits in the same PANTHER subfamily (PTHR13205:SF15,
      DOLICHOL KINASE) as SEC59 and DOLK, has the full-length polytopic architecture of these enzymes, and
      there is no evidence of loss of function in the fission yeast lineage. In S. cerevisiae the sec59
      mutant lacks dolichol kinase activity and overexpression raises it, establishing the donor function.
      This is the core molecular function of the protein.
