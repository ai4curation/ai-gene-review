  label: "Schizosaccharomyces pombe 972h-"
description: Sec59 (SPCC63.10c) is the fission yeast dolichol kinase, a 504-residue polytopic
  endoplasmic-reticulum membrane protein of the polyprenol kinase family. It catalyzes CTP-dependent
  phosphorylation of free dolichol to dolichyl monophosphate (Dol-P), the terminal step of de novo Dol-P
  synthesis. Dol-P is the lipid carrier on which the N-glycan precursor is assembled and the acceptor for
  formation of dolichyl-phosphate-mannose and dolichyl-phosphate-glucose, so Sec59 supplies the carrier
  used by N-linked glycosylation, protein O-mannosylation and GPI-anchor biosynthesis. Its function is
  inferred from membership in the same PANTHER dolichol kinase subfamily as biochemically and genetically
  characterized budding-yeast Sec59 and human DOLK; the pombe protein itself has been localized to the ER
  in a proteome-wide tagging screen but has not been assayed enzymatically.
