  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Sec59 is an endoplasmic-reticulum membrane dolichol kinase that produces dolichyl phosphate
  by CTP-dependent phosphorylation of dolichol. Dolichyl phosphate supplies the lipid carrier needed for
  protein N-glycosylation, O-mannosylation and GPI-anchor formation. Conserved Sec59/DOLK orthology supports
  this function in fission yeast; the related CTP-dependent phosphorylation of diacylglycerol is a distinct
  enzyme activity.
