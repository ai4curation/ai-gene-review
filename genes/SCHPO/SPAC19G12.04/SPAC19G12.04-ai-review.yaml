  label: Schizosaccharomyces pombe 972h-
description: SPAC19G12.04 (UniProt O13843; the fission yeast DAL3 ortholog) encodes ureidoglycolate lyase
  (EC 4.3.2.3), which cleaves ureidoglycolate to glyoxylate and urea, the last step of the allantoin branch
  of purine catabolism; the urea is then hydrolysed by urease (ure1). Function is assigned by orthology;
  a genome-wide screen places it in the cytosol.
