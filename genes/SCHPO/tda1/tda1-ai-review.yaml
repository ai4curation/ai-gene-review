suggested_questions:
- question: Is endogenous S. pombe tda1 mitochondrial, as predicted from its transit peptide, or partly cytosolic as recorded
    in the ORFeome screen?
- question: Is tda1 deletion an isoleucine auxotroph, confirming it as the sole biosynthetic threonine deaminase?
suggested_experiments:
- description: Tag tda1 at the endogenous locus and co-localise with a mitochondrial marker; test isoleucine requirement of
    tda1-deleted cells.
  experiment_type: cell biology and genetics
