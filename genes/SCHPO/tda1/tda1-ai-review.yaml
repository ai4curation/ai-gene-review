  label: Schizosaccharomyces pombe 972h-
description: Biosynthetic threonine deaminase/dehydratase (EC 4.3.1.19) of Schizosaccharomyces pombe (SPBC1677.03c, PomBase
  tda1), the ortholog of S. cerevisiae Ilv1. This PLP-dependent enzyme deaminates L-threonine to 2-oxobutanoate and ammonia,
  the first committed step of isoleucine biosynthesis. S. pombe threonine deaminase is stimulated by pyridoxal phosphate,
  feedback-inhibited by isoleucine and reactivated by valine. The protein has a predicted mitochondrial transit peptide and
  is placed in the mitochondrial matrix by orthology, although the ORFeome screen recorded a cytoplasmic signal.
