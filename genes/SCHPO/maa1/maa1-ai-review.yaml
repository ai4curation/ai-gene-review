  label: Schizosaccharomyces pombe 972h-
description: Mitochondrial aspartate aminotransferase (AspAT, EC 2.6.1.1) of Schizosaccharomyces pombe (SPBC725.01, allelic
  with the classical glu1 locus), a pyridoxal 5'-phosphate-dependent class-I aminotransferase located in the mitochondrial
  matrix. It interconverts L-aspartate + 2-oxoglutarate and oxaloacetate + L-glutamate. The glu1 (glutamate-requiring) mutant
  carries a nonsense mutation in maa1 and cannot grow on ammonium as sole nitrogen source; growth is restored by maa1, weakly
  by multicopy yhm2 (the mitochondrial 2-oxoglutarate carrier), but not by the cytosolic isozyme caa1. In fission yeast maa1
  therefore acts mainly in the glutamate-forming direction, transaminating aspartate with 2-oxoglutarate in the matrix to
  supply glutamate for nitrogen assimilation, while caa1 makes most cellular aspartate. It is also the expected matrix arm
  of the malate-aspartate shuttle.
