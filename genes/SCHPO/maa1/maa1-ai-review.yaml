core_functions:
- description: Matrix PLP-dependent aspartate aminotransferase that, in S. pombe, mainly transaminates aspartate with 2-oxoglutarate
    to supply glutamate for ammonium assimilation (glu1 function).
  molecular_function:
    id: GO:0004069
