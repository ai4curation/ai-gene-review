suggested_questions:
- question: Why does loss of maa1 cause a glutamate rather than an aspartate requirement, and does the glu1 phenotype reflect
    matrix glutamate supply for mitochondrial biosynthesis (e.g. arginine) or for whole-cell nitrogen assimilation?
- question: Should the PomBase GO-CAM part_of L-aspartate biosynthetic process for maa1 be complemented or replaced by L-glutamate
    biosynthetic process, given the glu1 genetics?
suggested_experiments:
- description: Assay AspAT activity in purified mitochondria of wild type and glu1/maa1 strains and trace 15N from ammonium
    into glutamate and aspartate to establish the direction of maa1 flux.
  experiment_type: enzyme assay and isotope tracing
