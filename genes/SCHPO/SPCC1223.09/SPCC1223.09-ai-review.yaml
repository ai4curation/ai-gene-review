taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPCC1223.09 (uro1; UniProt O74409) encodes urate oxidase (uricase; EC 1.7.3.3), which oxidises
  uric acid to 5-hydroxyisourate, the first step of uric acid catabolism. This lets S. pombe use purines
  (hypoxanthine, xanthine, uric acid, allantoin) as sole nitrogen sources. uro1 mutants lack uricase activity.
  The protein is cytosolic in a genome-wide screen; whether it is also peroxisomal, as uricases are in
  many organisms, has not been tested.
