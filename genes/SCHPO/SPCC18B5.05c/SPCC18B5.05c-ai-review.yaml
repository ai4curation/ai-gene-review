suggested_questions:
- question: Does the ThiD-only paralogue SPCC18B5.05c contribute measurably to HMP-P kinase activity in
    S. pombe, or does it specialise in HMP salvage?
suggested_experiments:
- description: Express SPCC18B5.05c in an E. coli thiD mutant and test complementation of thiamine
    auxotrophy, and measure HMP versus HMP-P kinase kinetics of the purified protein.
