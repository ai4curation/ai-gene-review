taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: SPCC18B5.05c encodes one of three fission yeast hydroxymethylpyrimidine (HMP) / HMP-phosphate
  kinase (ThiD family) paralogues. Unlike thi20 and thi201 it consists of the ThiD-like ribokinase-fold
  kinase domain alone, without the C-terminal TenA/thiaminase-II-like domain, which resembles the
  architecture of bacterial ThiD. By homology it phosphorylates HMP to HMP-P and HMP-P to HMP-PP for
  thiamine biosynthesis. It has not been characterised experimentally. It localises to the cytoplasm
  and nucleus, and its deletion is viable.
