id: Q1MTQ9
gene_symbol: nip7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  Nip7 (SPCC320.11c) is a small (180 aa) conserved trans-acting factor of large ribosomal subunit
  biogenesis. It consists of an N-terminal pre-PUA domain and a C-terminal PUA domain, the RNA-binding
  module that in Nip7 orthologs mediates preferential binding to polyuridine RNA. In fission yeast Nip7
  is a component of early nucleolar pre-60S particles whose cryo-EM structures have been determined
  (PDB 8ESQ/8ESR), and a GFP-tagged protein is found in the nucleolus with an additional cytoplasmic
  pool. By orthology with budding-yeast Nip7 (same PANTHER subfamily), which is essential, cosediments
  with free 60S particles but not with 80S ribosomes or polysomes, and is required for efficient 27S
  pre-rRNA processing, fission-yeast Nip7 is an RNA-binding assembly factor of the large-subunit
  precursor rather than a structural protein of the mature ribosome. No catalytic activity is known.
