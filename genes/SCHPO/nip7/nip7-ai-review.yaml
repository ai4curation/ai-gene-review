- id: PMID:9271378
  title: Saccharomyces cerevisiae Nip7p is required for efficient 60S ribosome subunit biogenesis.
  findings:
  - statement: Budding-yeast Nip7 (same PANTHER subfamily PTHR23415:SF4 as Q1MTQ9) associates with free
      60S particles but not with mature ribosomes, and is therefore a non-ribosomal assembly factor.
    supporting_text: A fraction of Nip7p cosedimented through sucrose gradients with free 60S ribosomal
      subunits but not with 80S monosomes or polysomal ribosomes, indicating that it is not a ribosomal
      protein.
  - statement: Nip7 depletion delays 27S pre-rRNA processing and causes a 60S subunit deficit.
    supporting_text: Delayed processing of 27S pre-rRNA appeared to be the cause of reduced synthesis
      of 25S rRNA relative to 18S rRNA, which may be responsible for the deficit of 60S subunits in these
      cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterization of the closest experimentally studied ortholog (S. cerevisiae
      NIP7, Q08962, SGD:S000006132), which is a PAINT donor for the PTN000602113 IBD. Only the abstract
      is cached.
