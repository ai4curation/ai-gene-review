suggested_questions:
- question: Which pre-rRNA segment does the fission-yeast Nip7 PUA domain contact in the 8ESQ/8ESR
    pre-60S structures, and does it coincide with a uridine-rich region as the ortholog binding preference
    predicts?
- question: Human NIP7 knockdown mainly impairs ITS1/18S processing, whereas budding-yeast Nip7 loss
    impairs 27S/60S processing. Which phenotype does S. pombe Nip7 depletion produce?
suggested_experiments:
- description: Conditional depletion of S. pombe nip7 followed by northern blotting of pre-rRNA intermediates
    and polysome profiling, to test whether the budding-yeast 27S-processing and 60S-deficit phenotype
    is conserved.
- description: CRAC or UV crosslinking of tagged Nip7 in fission yeast, with PUA-domain point mutants,
    to map its RNA contacts in the pre-60S particle.
