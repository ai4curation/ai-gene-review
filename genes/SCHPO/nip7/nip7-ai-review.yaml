      record_section: [DR:InterPro]
      supporting_text: DR   InterPro; IPR002478; PUA.
    - reference_id: PMID:18001138
      supporting_text: This work provides experimental verification that the PUA domain mediates Nip7
        interaction with RNA and reveals that the preference for interaction with polyuridine sequences
        is conserved in Archaea and eukaryotic Nip7 proteins.
