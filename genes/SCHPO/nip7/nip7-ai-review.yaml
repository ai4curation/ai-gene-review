      function across the Nip7 lineage. Only the abstract is cached.
- id: PMID:20798176
  title: The NIP7 protein is required for accurate pre-rRNA processing in human cells.
  findings:
  - statement: Human NIP7 is nuclear and associates with pre-ribosomal particles.
    supporting_text: The NIP7 protein is restricted to the nuclear compartment and co-sediments with
      complexes with molecular masses in the range of 40S-80S, suggesting an association to nucleolar
      pre-ribosomal particles.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human NIP7 (Q9Y221) falls in a different PANTHER subfamily (SF34) from Q1MTQ9 (SF4).
