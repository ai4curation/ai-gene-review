  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Nip7 is an RNA-binding ribosome-biogenesis factor with pre-PUA and PUA domains. It associates
  with nascent 60S ribosomal subunits in the nucleolus and supports assembly of the large-subunit preribosome.
  The fission-yeast protein is present in structurally characterized early pre-60S particles; it is an
  assembly factor rather than a constitutive structural protein of the mature ribosome.
