  review:
    summary: RNA binding via the conserved PUA domain, consistent with direct RNA-binding assays on Nip7
      orthologs.
    action: ACCEPT
    reason: Q1MTQ9 carries the Nip7-type PUA domain (InterPro PUA, Pfam UPF0113) and sits in the NIP7
      branch of PANTHER PTHR23415 (subfamily SF4, with S. cerevisiae NIP7). RNA binding mediated by the
      Nip7 PUA domain was shown experimentally for budding-yeast and archaeal Nip7 orthologs, so the
      activity is ancestral to the Nip7 lineage and transfers to the fission-yeast protein. The orthologs'
      polyuridine preference has not been tested for Q1MTQ9, so RNA binding is the appropriate precision
      here. The CKS proteins grouped in the same PANTHER family play no part in this inference.
    supported_by:
