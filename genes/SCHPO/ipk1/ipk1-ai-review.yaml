description: ipk1 (SPCC4B3.10c; UniProt Q9USK0) encodes inositol 1,3,4,5,6-pentakisphosphate 2-kinase
  (EC 2.7.1.158), which phosphorylates the axial 2-OH of IP5 to give inositol hexakisphosphate (IP6, phytate).
  Recombinant S. pombe Ipk1 is as selective and efficient as the S. cerevisiae enzyme despite only 24%
  identity, and it rescues IP6 production and gle1 synthetic lethality in S. cerevisiae ipk1 mutants.
  IP6 is the precursor of the inositol pyrophosphates IP7 and IP8 made by kcs1 and asp1.
