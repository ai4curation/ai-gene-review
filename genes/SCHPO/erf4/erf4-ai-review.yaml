id: Q10182
gene_symbol: erf4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  erf4 encodes the fission-yeast Erf4 accessory subunit of the Erf2-Erf4 Ras
  palmitoyltransferase. Erf4 contributes to Ras1 palmitoylation that maintains
  Ras1 at the conjugation site during mating, with additional
  Erf2-Erf4-dependent palmitoylation of Rho3 and the spore coat protein Isp3
  during meiosis. The active complex compartment in fission yeast remains
  unresolved between ER and nmt1-driven Golgi/cell-periphery observations.
