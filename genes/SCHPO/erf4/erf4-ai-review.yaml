suggested_questions:
- question: >-
    Is S. pombe Erf2-Erf4 active at the ER as well as the Golgi and cell
    periphery, or has the fungal ER Ras palmitoyltransferase complex relocated
    in the fission-yeast branch?
suggested_experiments:
- experiment_type: endogenous live-cell localization and substrate acyl-RAC
  hypothesis: Erf4-dependent palmitoylation occurs at Golgi and cell-periphery membranes in S. pombe.
  description: >-
    Tag endogenous erf2 and erf4, colocalize the complex with ER, Golgi, and
    plasma-membrane markers, and test whether compartment-specific disruption
    changes Ras1 and Isp3 palmitoylation.
