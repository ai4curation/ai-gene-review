core_functions:
- description: >-
    Erf4 is the accessory subunit of the fission-yeast Erf2-Erf4
    palmitoyltransferase. It contributes to palmitoylation of Ras1 and thereby
    to Ras1 localization at the mating conjugation site; the complex also
    palmitoylates Rho3 and Isp3 during meiosis. The native active compartment
    is unresolved between ER and Golgi/cell-periphery observations.
  contributes_to_molecular_function:
    id: GO:0016409
    label: palmitoyltransferase activity
  directly_involved_in:
  - id: GO:0018345
    label: protein palmitoylation
  - id: GO:0006612
    label: protein targeting to membrane
  in_complex:
    id: GO:0002178
    label: palmitoyltransferase complex
  supported_by:
  - reference_id: PMID:36650056
    supporting_text: >-
      S-palmitoylation by Erf2-Erf4 is required for Ras1 localization at the
      cell periphery to enrich at the cell conjugation site for mating
      pheromone response.
  - reference_id: PMID:36650056
    supporting_text: >-
      Erf2-Erf4 has an additional substrate of the spore coat protein Isp3.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is S. pombe Erf2-Erf4 active at the ER as well as the Golgi and cell
    periphery, or has the fungal ER Ras palmitoyltransferase complex relocated
    in the fission-yeast branch?
suggested_experiments:
- experiment_type: endogenous live-cell localization and substrate acyl-RAC
  hypothesis: Erf4-dependent palmitoylation occurs in one or more ER, Golgi, or cell-periphery compartments in S. pombe.
  description: >-
    Tag endogenous erf2 and erf4, colocalize the complex with ER, Golgi, and
    plasma-membrane markers, and test whether compartment-specific disruption
    changes Ras1 and Isp3 palmitoylation.
