  review:
    summary: >-
      The ER-specific PAINT term has mixed direct support in fission-yeast
      erf4.
    action: UNDECIDED
    reason: >-
      The generic assertion that erf4 is part of an Erf2-Erf4
      palmitoyltransferase complex is sound, but this ER-specific IBA remains
      undecided for S. pombe. UniProt curates the ORFeome ER-membrane
