id: Q10182
gene_symbol: erf4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: >-
  erf4 encodes the fission-yeast Erf4 accessory subunit of the Erf2-Erf4 Ras
  palmitoyltransferase. The complex localizes to the Golgi and cell periphery
  in S. pombe and S-palmitoylates Ras1 to maintain Ras1 at the conjugation
  site during mating, with additional Erf2-Erf4-dependent palmitoylation of
  Rho3 and the spore coat protein Isp3 during meiosis.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: The PomBase no-data molecular-function placeholder is stale for erf4.
    action: REMOVE
    nd_case: STALE
    reason: >-
      The record now has PAINT evidence connecting erf4 to the conserved
      Erf4/GOLGA7 palmitoyltransferase accessory subunit family, and Pham et
      al. directly showed that the fission-yeast Erf2-Erf4 complex
      S-palmitoylates Ras1 for mating.
    additional_reference_ids:
    - PMID:36650056
    - PMID:23843742
    supported_by:
    - reference_id: PMID:36650056
      supporting_text: >-
        S-palmitoylation by Erf2-Erf4 is required for Ras1 localization at the
        cell periphery to enrich at the cell conjugation site for mating
        pheromone response.
    - reference_id: PMID:23843742
      supporting_text: >-
        Collectively, these experiments demonstrate that Erf2 and Erf4 are
        functional orthologs of the S. cerevisiae ERF2 and ERF4
        palmitoyltransferase subunits, respectively
