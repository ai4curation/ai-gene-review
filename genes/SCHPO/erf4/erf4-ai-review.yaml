core_functions:
- description: >-
    Erf4 is the accessory subunit of the fission-yeast Erf2-Erf4
    palmitoyltransferase. It contributes to palmitoylation of Ras1 and thereby
    to Ras1 localization at the mating conjugation site; the complex also
    palmitoylates Rho3 and Isp3 during meiosis.
