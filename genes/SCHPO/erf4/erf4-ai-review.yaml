- term:
    id: GO:0018345
    label: protein palmitoylation
  evidence_type: IMP
  original_reference_id: PMID:23843742
  qualifier: involved_in
  review:
    summary: Proposed new annotation for Erf2-Erf4-mediated protein palmitoylation.
    action: NEW
    reason: >-
      Zhang et al. showed that deleting S. pombe erf4 blocks the prominent
      meiotic palmitoylome driven by Erf2-Erf4, and later S. pombe work
      connected the complex to Ras1 and Isp3 palmitoylation.
    additional_reference_ids:
    - PMID:36650056
    supported_by:
    - reference_id: PMID:23843742
      supporting_text: >-
        The distinct meiotic palmitoylome requires Erf2 activity, as
        modification of those prominent substrates was not observed in either
        meiotic erf2Δ or erf4Δ cells
    - reference_id: PMID:36650056
      supporting_text: >-
        S-palmitoylation by Erf2-Erf4 is required for Ras1 localization at the
        cell periphery to enrich at the cell conjugation site for mating
        pheromone response.
    - reference_id: PMID:36650056
      supporting_text: >-
        Erf2-Erf4 has an additional substrate of the spore coat protein Isp3.
- term:
    id: GO:0006612
    label: protein targeting to membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000327115
  - SGD:S000005470
  review:
    summary: The root Erf4/GOLGA7 PAINT process transfers safely to S. pombe erf4.
    action: ACCEPT
    reason: >-
      Fission-yeast Erf4 is in the same PTHR13254 family as budding-yeast
      Shr5/Erf4 and mammalian GOLGA7 proteins, and target-specific evidence
      shows that Erf2-Erf4 is required to keep Ras1 at the cell periphery and
      mating conjugation site.
    additional_reference_ids:
    - PMID:36650056
    supported_by:
    - reference_id: PMID:36650056
      supporting_text: >-
        S-palmitoylation by Erf2-Erf4 is required for Ras1 localization at the
        cell periphery to enrich at the cell conjugation site for mating
        pheromone response.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000327115
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The family-root IBD is broad enough for the S. pombe Golgi and
          cell-periphery Erf2-Erf4 Ras palmitoyltransferase.
- term:
    id: GO:0031211
    label: endoplasmic reticulum palmitoyltransferase complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN001777135
  - SGD:S000005470
  review:
    summary: >-
      The ER-specific PAINT term should be generalized for fission-yeast erf4.
    action: MODIFY
    reason: >-
      The generic assertion that erf4 is part of an Erf2-Erf4
      palmitoyltransferase complex is sound, but the ER-specific
      PTN001777135 term is over-scoped for S. pombe. The 2006 ORFeome
      high-throughput row reported ER localization, but the 2023 focused
      experiment localized nmt1-driven C-terminally GFP-tagged Erf2-Erf4 to the
      cell periphery and Golgi.
    proposed_replacement_terms:
    - id: GO:0002178
      label: palmitoyltransferase complex
    additional_reference_ids:
    - PMID:16823372
    - PMID:36650056
    supported_by:
    - reference_id: PMID:36650056
      supporting_text: >-
        Erf2-Erf4 appeared in the cell periphery and Golgi.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001777135
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The S. cerevisiae seed supports an ER palmitoyltransferase complex,
          but direct S. pombe localization favors a generic complex term for
          this recipient.
