  label: Schizosaccharomyces pombe 972h-
description: trp1 (SPBC1539.09c; UniProt Q92370) encodes the trifunctional tryptophan biosynthesis protein
  of fission yeast. It contains a glutamine amidotransferase domain that partners with trp3 (TrpE) as
  anthranilate synthase, an indole-3-glycerol-phosphate synthase domain, and a phosphoribosylanthranilate
  isomerase domain. trp1 alleles fall into separate complementation classes (trp1A, trp1B, trp1C and combinations)
  that remove each activity, which defines the domain structure genetically. The protein is cytosolic
  in a genome-wide screen.
