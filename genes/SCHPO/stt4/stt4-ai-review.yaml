  label: Schizosaccharomyces pombe 972h-
description: stt4 (SPBC577.06c; UniProt Q9USR3) encodes the essential plasma-membrane type III phosphatidylinositol
  4-kinase (PI4KA family) of fission yeast. The Efr3 scaffold recruits Stt4 to the plasma membrane, where
  it makes the PI4P pool that Its3 converts to PI(4,5)P2. Stt4 is the main source of the PI4P behind PM
  PI(4,5)P2. Losing Stt4 from the PM lowers PI4P and PI(4,5)P2, so the cytokinetic ring is poorly anchored,
  slides off-centre, and cells divide asymmetrically.
