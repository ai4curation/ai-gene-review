  review:
    summary: Deletion abolishes CoQ10 production (systematic analysis of the S. pombe coq genes).
    action: ACCEPT
    supported_by:
    - reference_id: PMID:24911838
      supporting_text: Here, we expand these findings by identifying ten genes (dps1, dlp1, ppt1, and
        coq3-9) that are required for CoQ synthesis.
    - reference_id: PMID:24911838
      supporting_text: Overall, these data indicate that, like the S. pombe Δdps1, Δdlp1, Δppt1/coq2,
