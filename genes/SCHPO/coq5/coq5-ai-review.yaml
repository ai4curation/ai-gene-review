id: P87230
gene_symbol: coq5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: coq5 encodes the fission yeast Coq5 C-methyltransferase, a SAM-dependent enzyme of the MenG/UbiE
  family that methylates the coenzyme Q10 ring, converting 2-methoxy-6-decaprenyl-1,4-benzoquinol to 2-methoxy-6-decaprenyl-3-methyl-1,4-benzoquinol.
  It is a peripheral protein on the matrix side of the mitochondrial inner membrane and part of the multi-subunit
  CoQ biosynthetic complex. Deletion of coq5 abolishes CoQ10 and accumulates intermediates; Arabidopsis
  COQ5 complements and human COQ5 complements weakly.
