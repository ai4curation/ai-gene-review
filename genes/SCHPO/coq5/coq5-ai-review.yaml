  supporting_entities:
  - InterPro:IPR004033
  - InterPro:IPR023576
  review:
    summary: Generic methyltransferase; true but entailed by the specific C-methyltransferase activity (GO:0008425) asserted in this review.
    action: TOO_GENERAL
    reason: 'Correct but uninformative. By MenG/UbiE family membership (HAMAP, InterPro IPR004033, PROSITE SAM_MT_UBIE) and similarity to human COQ5 (Q5HYK3), Coq5 is the SAM-dependent C-methyltransferase converting DDMQH2 to DMQH2 in ubiquinone synthesis; the S. pombe deletion lacks CoQ (Hayashi et al. 2014). GO:0008425 is_a methyltransferase activity and is asserted in this review.'
    supported_by:
    - reference_id: file:SCHPO/coq5/coq5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Methyltransferase required for the conversion of 2-decaprenyl-6-methoxy-1,4-benzoquinol (DDMQH2) to 2-decaprenyl-3-methyl-6-methoxy-1,4-benzoquinol (DMQH2).
    - reference_id: file:SCHPO/coq5/coq5-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the class I-like SAM-binding methyltransferase superfamily. MenG/UbiE family.
- term:
    id: GO:0008425
    label: 2-methoxy-6-polyprenyl-1,4-benzoquinol methyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
