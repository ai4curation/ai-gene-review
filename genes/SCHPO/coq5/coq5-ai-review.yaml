  label: Schizosaccharomyces pombe 972h-
description: coq5 (SPCC4G3.04c; UniProt P87230) encodes the SAM-dependent C-methyltransferase Coq5, which
  methylates the CoQ ring at C2. It is one of the ten S. pombe genes (dps1, dlp1, ppt1, coq3-coq9) needed
  for CoQ10 synthesis, whose deletion abolishes CoQ10. It is a mitochondrial inner-membrane component
  of the CoQ biosynthetic complex.
