  supporting_entities:
  - PANTHER:PTN001297884
  - SGD:S000004578
  - UniProtKB:P0A887
  - UniProtKB:Q5HYK3
  review:
    summary: C-methylation of the CoQ ring (PAINT/EC).
    action: ACCEPT
    reason: 'No S. pombe enzymology exists. The curated UniProt function is by similarity to human COQ5 (UniProtKB:Q5HYK3), and the reaction (EC 2.1.1.201) comes from HAMAP MF_03191 for the MenG/UbiE family. Complementation of the coq5 deletion by Arabidopsis COQ5 (and partially by human COQ5) in Hayashi et al. 2014 supports the conserved C-methylation role in vivo.'
    supported_by:
    - reference_id: file:SCHPO/coq5/coq5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Methyltransferase required for the conversion of 2-decaprenyl-6-methoxy-1,4-benzoquinol (DDMQH2) to 2-decaprenyl-3-methyl-6-methoxy-1,4-benzoquinol (DMQH2)'
    - reference_id: file:SCHPO/coq5/coq5-uniprot.txt
