  review:
    summary: Peripheral component on the matrix side of the inner membrane, where the CoQ synthome assembles.
    action: ACCEPT
    reason: 'UniProt places Coq5 on the matrix side of the inner membrane as a peripheral membrane protein (HAMAP MF_03191; mitochondrial location from PubMed:24911838). The record has a transit peptide (FT TRANSIT 1..34) and no TRANSMEM feature, consistent with a peripheral protein; the topology rests on the orthologous CoQ synthome rather than an S. pombe sub-mitochondrial assay.'
