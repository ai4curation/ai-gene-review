suggested_questions:
- question: Does S. pombe arg11-derived acetylglutamate kinase form a NAGS/NAGK metabolon with arg6, as
    ARG5,6 does with ARG2 in S. cerevisiae?
- question: 'Why does arg11 fail to complement S. cerevisiae arg5,6 (and vice versa): processing, import,
    or partner specificity?'
suggested_experiments:
- description: Co-immunoprecipitate arg11 kinase chain with arg6 from mitochondrial extracts, and test
    whether arg6 N-acetylglutamate synthase activity depends on arg11.
