  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: 'arg11 (SPAC4G9.09c) encodes the S. pombe acetylglutamate kinase / N-acetyl-gamma-glutamyl-phosphate
  reductase precursor, the ortholog of S. cerevisiae ARG5,6. The 885-residue polyprotein carries an N-terminal
  mitochondrial transit peptide, an N-terminal acetylglutamate kinase (EC 2.7.2.8) region and a C-terminal
  NADPH-dependent N-acetylglutamyl-phosphate reductase (EC 1.2.1.38) region, and is thought to be cleaved
  into the two separate enzymes in the mitochondrial matrix. Together they catalyse steps 2 and 3 of the
  acetylated ornithine route: phosphorylation of N-acetyl-L-glutamate and reduction of N-acetyl-L-glutamyl
  5-phosphate to N-acetyl-L-glutamate 5-semialdehyde. The kinase is the arginine feedback-inhibited step.
  arg11 mutants are arginine auxotrophs. The name is a nomenclature trap: S. pombe arg11 is not the ortholog
  of S. cerevisiae ARG11, which encodes the mitochondrial ornithine carrier ORT1.'
