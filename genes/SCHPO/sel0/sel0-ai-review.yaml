product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: >-
  sel0 (SPAC20G4.05c) is the fission yeast member of the SELO family
  (Pfam PF02696; InterPro IPR003846; HAMAP MF_00692 YdiU_SelO), predicted to be a
  mitochondrial protein AMPylase (protein adenylyltransferase). SELO-family enzymes
  adopt a protein-kinase-like (pseudokinase) fold but bind ATP in a "flipped"
  orientation and transfer AMP, rather than a phosphate, to serine, threonine and
  tyrosine residues of target proteins (AMPylation/adenylylation). The protein
  carries an N-terminal mitochondrial transit peptide, a conserved ATP-binding site
  and a Mg(2+)-dependent catalytic centre inferred by similarity. Characterised
  eukaryotic SELO orthologs localise to mitochondria, while bacterial homologs act
  in bacteria. Family members modify proteins involved in redox homeostasis and
  metabolism and contribute to cellular stress responses; mammalian SELO AMPylates
  mitochondrial metabolic enzymes such as glutamate dehydrogenase and pyruvate
  dehydrogenase. S. pombe sel0-deletion screens report diamide sensitivity,
  resistance in other oxidant assay conditions, and loss of stationary-phase
  viability. Direct AMPylase activity and endogenous substrates have not been
  established for the fission-yeast protein; the mechanism connecting its inferred
  enzymatic activity to these condition-dependent phenotypes remains unresolved.
