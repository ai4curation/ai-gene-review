  - id: PMID:30270044
    title: Protein AMPylation by an Evolutionarily Conserved Pseudokinase.
    findings:
      - statement: >-
          SELO is a highly conserved pseudokinase that transfers AMP from ATP to Ser,
          Thr and Tyr residues of protein substrates (AMPylation). Eukaryotic SelO
          localises to mitochondria; family members modify redox proteins and SelO is
          required for the proper cellular response to oxidative stress.
        reference_section_type: ABSTRACT
        supporting_text: >-
          SelO pseudokinases localize
        full_text_unavailable: true
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed title matches. Foundational paper defining SELO-family AMPylase
        activity, eukaryotic mitochondrial localization, redox-protein substrates
        and the oxidative-stress-response role. Supports the family-level basis
        for homology annotations. The cache is abstract-only; no direct S. pombe
        experiment was verified from the accessible text. Retain the inference
        evidence codes rather than presenting this as a pombe experimental study.
  - id: PMID:40849408
    title: A repurposed AMP binding domain reveals mitochondrial protein AMPylation as a
      regulator of cellular metabolism.
    findings:
      - statement: >-
          Mammalian SELO is a mitochondrial AMPylase that regulates metabolic flux by
          AMPylating key mitochondrial proteins (glutamate dehydrogenase, pyruvate
          dehydrogenase); SELO is conserved in E. coli and S. cerevisiae, where it
          AMPylates to protect cells from oxidative damage and cell death.
        reference_section_type: RESULTS
        supporting_text: >-
          SelO is conserved in E. coli and S. cerevisiae, where it catalyzes AMPylation to protect
          cells from oxidative damage and cell death
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed title matches; full text cached. Mammalian study confirming
        mitochondrial SELO AMPylation of metabolic enzymes and re-stating family
        conservation (E. coli, S. cerevisiae). Relevant to S. pombe sel0 only at the
        family/ortholog level (used as an ISO WITH/FROM source).
  - id: PMID:9700395
