taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe 972h-
description: fol3 (SPAC227.09; UniProt Q9UTD0; the fission yeast FOL3 ortholog) encodes dihydrofolate
  synthetase (EC 6.3.2.12), which ligates L-glutamate to 7,8-dihydropteroate to make 7,8-dihydrofolate,
  the last step of de novo folate synthesis before DHFR (dfr1). In fungi, chain extension to polyglutamates
  is done by a separate paralog, the folylpolyglutamate synthase met7. Function is assigned by orthology;
  it is cytosolic in a genome-wide screen.
