  review:
    summary: PAINT inference of folylpolyglutamate synthase activity from the shared FolC family. In fungi,
      dihydrofolate synthetase (Fol3) and folylpolyglutamate synthase (Met7) are separate paralogs; Fol3
      adds the first glutamate.
    action: KEEP_AS_NON_CORE
    reason: 'Family membership only: fol3 belongs to the folylpolyglutamate synthase family (UniProt SIMILARITY; PANTHER PTHR11136; NCBIfam folC), and the PAINT node also covers bifunctional DHFS/FPGS enzymes such as E. coli FolC. No S. pombe assay exists. Within the family fol3 sits in the dihydrofolate synthetase subfamily (PTHR11136:SF0), and its by-similarity curated function is the first glutamate addition, so polyglutamate chain extension is peripheral at best (the met7 paralog carries it); kept as non-core rather than core.'
    supported_by:
    - reference_id: file:SCHPO/fol3/fol3-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'Belongs to the folylpolyglutamate synthase family.'
