  label: Schizosaccharomyces pombe 972h-
description: his4 (SPBC418.01c; UniProt O94303) encodes imidazoleglycerol-phosphate synthase (IGPS), a
  single polypeptide that fuses a glutamine amidotransferase (HisH-like) domain to a cyclase (HisF-like)
  domain. Ammonia from glutamine is channelled to the cyclase, which converts PRFAR into imidazoleglycerol
  phosphate and AICAR. This is step 5 of histidine biosynthesis and links it to purine synthesis, since
  AICAR is a purine intermediate. Function is assigned by orthology to S. cerevisiae HIS7; it is cytosolic
  in a genome-wide screen.
