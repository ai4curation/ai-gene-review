  label: Schizosaccharomyces pombe 972h-
description: tps1 (SPAC328.03; UniProt P40387) encodes trehalose-6-phosphate synthase (EC 2.4.1.15), which
  makes trehalose 6-phosphate from UDP-glucose and glucose 6-phosphate, the first step of trehalose synthesis.
  Unlike S. cerevisiae tps1, the S. pombe mutant grows on glucose, because S. pombe hexokinase is not
  inhibited by trehalose 6-phosphate, but its spores cannot germinate. Tps1 forms complexes with trehalose-6-P
  phosphatase (tpp1) and neutral trehalase (ntp1) and is needed for heat-shock and nutrient activation
  of trehalase. Overexpression raises trehalose and stress resistance.
