suggested_questions:
- question: Does fission yeast Sus1 assemble with the S. pombe Sac3 and Thp1 orthologs into a nuclear-pore-associated
    TREX-2 complex, as in budding yeast and animals?
- question: Is the extra C-terminal sequence of S. pombe Sus1 (about 10 residues beyond the budding-yeast
    and human proteins) functionally relevant, or a disordered tail?
suggested_experiments:
- description: Affinity-purify tagged Sac3 and Thp1 from fission yeast and test for Sus1 co-purification;
    image Sus1-GFP for nuclear-rim enrichment, and test sus1 deletion for poly(A)+ RNA nuclear retention
    by FISH.
  experiment_type: affinity purification mass spectrometry; fluorescence microscopy; RNA FISH
