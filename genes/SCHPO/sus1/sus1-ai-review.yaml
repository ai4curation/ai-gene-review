core_functions:
- description: Noncatalytic scaffold subunit of the SAGA histone H2B deubiquitination module. It holds
    Sgf11 onto the Ubp8 deubiquitinase and so supports SAGA's chromatin-modifying coactivator function
    at RNA polymerase II genes.
