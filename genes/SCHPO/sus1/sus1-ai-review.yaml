id: Q7LL15
gene_symbol: sus1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
description: Sus1 is a conserved small subunit of the SAGA transcription coactivator and the TREX-2 mRNA
  export complex. It connects transcription-associated chromatin regulation with nuclear mRNA export.
  Within the SAGA deubiquitination module it supports complex assembly and histone H2B deubiquitination
  by the catalytic subunit; it is not itself a histone deubiquitinase.
