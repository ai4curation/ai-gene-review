  review:
    summary: SAGA complex is supported.
    action: ACCEPT
    reason: Fission yeast SAGA purification establishes Sus1 membership. In sgf73 deletion mutants, Sus1,
      Sgf11 and Ubp8 are absent from SAGA purifications, placing Sus1 within the Sgf73-anchored deubiquitination
      module. The conserved composition is also supported by the earlier target SAGA study.
    supported_by:
    - &id001
      reference_id: PMID:19056896
      supporting_text: Purification of the S. pombe SAGA complex showed that its subunit composition is
        identical to that of Saccharomyces cerevisiae.
    - reference_id: PMID:31748520
      supporting_text: Mass spectrometry analyses confirmed that, in S. pombe sgf73Δ mutants, the DUB
        subunits Ubp8, Sgf11 and Sus1 are absent from SAGA purifications
