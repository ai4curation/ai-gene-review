gene_symbol: sus1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284812
  label: "Schizosaccharomyces pombe 972h-"
description: >-
  Sus1 is a small (108 aa), noncatalytic protein of the ENY2/Sus1 family that
  is a subunit of the SAGA transcriptional coactivator complex. In fission
  yeast it co-purifies with SAGA and with the deubiquitinase Ubp8. Together with
  Ubp8, Sgf11 and Sgf73 it forms the SAGA deubiquitination (DUB) module, which
  removes ubiquitin from histone H2B; Sgf73 anchors this module to SAGA. In
  structural work on the orthologous budding-yeast module, Sus1 clamps the long
  N-terminal helix of Sgf11 onto the zinc-finger UBP domain of Ubp8, so it acts
  as an assembly scaffold rather than as an enzyme. Its orthologs in budding
  yeast and animals are also subunits of TREX-2, the nuclear-pore-associated
  mRNA export complex, where they help target TREX-2 to the nuclear basket and
  support export of polyadenylated mRNA. In fission yeast, the TREX-2 role is
  inferred from these orthologs and has not been tested directly. Sus1 is
  mainly nuclear; studies in budding yeast also report a minor, conditional
  pool in cytoplasmic granules.
