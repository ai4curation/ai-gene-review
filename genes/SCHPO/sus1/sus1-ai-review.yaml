    through its interaction with Ubp8 and Sgf11.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Budding yeast. Places Sus1 in the Sus1-Sgf11-Ubp8 subcomplex and shows it is needed
      for SAGA-dependent H2B deubiquitination.
- id: PMID:31748520
  title: Chaperone-mediated ordered assembly of the SAGA and NuA4 transcription co-activator complexes
    in yeast.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and PubMed identity verified. Fission yeast SAGA purifications and the sgf73
      deletion place Sus1 in the DUB module; the authors caution that its small size limits MS quantification.
- id: PMID:20838651
  title: A global census of fission yeast deubiquitinating enzyme localization and interaction networks
    reveals distinct compartmentalization profiles and overlapping functions in endocytosis and polarity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Fission yeast Ubp8 co-purifies with Sus1, Tra1, Sgf73 and Sgf29.
- id: PMID:20434206
  title: Structural basis for assembly and activation of the heterotetrameric SAGA histone H2B deubiquitinase
    module.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Budding-yeast DUB module crystal structure. Shows Sus1 as the scaffold that clamps the
      Sgf11 N-terminal helix onto Ubp8; abstract only.
- id: PMID:19269973
  title: Mutational uncoupling of the role of Sus1 in nuclear pore complex targeting of an mRNA export
    complex and histone H2B deubiquitination.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Budding-yeast Sus1 interface mutants (sus1-10, sus1-11, sus1-12). They are used here
      to map the conserved residues onto S. pombe Sus1 (see RESULTS-rereview.md).
- id: PMID:18923079
  title: Sus1 is recruited to coding regions and functions during transcription elongation in association
    with SAGA and TREX2.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Budding yeast. Sus1 associates with elongating RNA polymerase II and occupies coding
      regions; this supports the non-core elongation row.
- id: PMID:20230609
  title: A novel link between Sus1 and the cytoplasmic mRNA decay machinery suggests a broad role in mRNA
    metabolism.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. In budding yeast, Sus1 enters cytoplasmic granules and P-bodies
      partially and conditionally (stationary phase or overexpression); this supports the non-core cytoplasm
      and P-body rows.
- id: PMID:26443059
  title: Sgf73, a subunit of SAGA complex, is required for the assembly of RITS complex in fission yeast.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. In fission yeast, unlike sgf73, deletion of sus1 does not affect
      silencing at the outer centromeric repeat. Cited only to show that Sus1 does not share Sgf73's
      heterochromatin role; it supports no annotation.
- id: file:SCHPO/sus1/sus1-deep-research-falcon.md
  title: Falcon deep research report for S. pombe sus1
  reference_review:
