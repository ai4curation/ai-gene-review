  source_version: pre-release post-processed-2026_02_28k.xml
  predicted_term:
    id: GO:0006406
    label: mRNA export from nucleus
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: Mutant, localization and biochemical experiments in characterized budding yeast Sus1 establish
      an mRNA-export role through Sac3-Thp1/TREX-2. The fission yeast protein belongs to the conserved
      Sus1/ENY2 family, and curated phylogenetic and orthology annotations support the same complex role.
      GOA already records the more specific poly(A)+ mRNA export from nucleus (GO:0016973). The prediction
      is biologically supported through that justified comparative inference, with less transcript specificity.
    supported_by:
    - reference_id: PMID:14718168
      supporting_text: Biochemical analyses show that Sus1 interacts with SAGA, a large intranuclear histone
        acetylase complex involved in transcription initiation, and with the Sac3-Thp1 complex, which
        functions in mRNA export with specific nuclear pore proteins at the nuclear basket.
    - reference_id: file:SCHPO/sus1/sus1-uniprot.txt
      supporting_text: DR   InterPro; IPR018783; TF_ENY2.
  source_reference_id: file:SCHPO/sus1/sus1-protnlm-source.xml
- source_method: ProtNLM2
  source_version: pre-release post-processed-2026_02_28k.xml
  predicted_term:
    id: GO:0006325
    label: chromatin organization
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: Fission yeast purification places Sus1 in SAGA, and characterized budding yeast Sus1 mutants
      establish participation in histone H2B deubiquitination and maintenance of histone H3 methylation.
      Transfer is justified by conserved Sus1 family identity and SAGA/DUB-module context; this is a noncatalytic
      contribution to chromatin regulation. GOA already specifies transcription initiation-coupled chromatin
      remodeling (GO:0045815). Generic chromatin organization is therefore supported but less precise.
    supported_by:
    - reference_id: PMID:19056896
      supporting_text: Purification of the S. pombe SAGA complex showed that its subunit composition is
        identical to that of Saccharomyces cerevisiae.
    - reference_id: PMID:16855026
      supporting_text: We demonstrate that Sus1 is involved in the SAGA-dependent histone H2B deubiquitinylation
        and maintenance of normal H3 methylation levels.
    - reference_id: file:SCHPO/sus1/sus1-uniprot.txt
      supporting_text: DR   InterPro; IPR018783; TF_ENY2.
  source_reference_id: file:SCHPO/sus1/sus1-protnlm-source.xml
