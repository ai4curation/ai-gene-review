core_functions:
- description: NAD+-dependent oxidation of L-glutamate 5-semialdehyde to glutamate in proline degradation,
    supported by conserved P5CDH architecture. Matrix localization is phylogenetically inferred from the
    characterized budding-yeast homolog; an obligatory native arginine shuttle is not demonstrated.
