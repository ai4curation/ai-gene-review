description: Put2 (SPBC24C6.04) is the predicted NAD+-dependent glutamate-5-semialdehyde dehydrogenase
  of Schizosaccharomyces pombe. Conserved P5C-dehydrogenase/aldehyde-dehydrogenase architecture supports
  oxidation of semialdehyde, in equilibrium with P5C, to glutamate during proline degradation. Mitochondrial
  matrix localization is a fungal phylogenetic assignment grounded in budding-yeast Put2; direct S. pombe
  localization and the individual contribution to arginine-derived carbon flux remain incompletely characterized.
