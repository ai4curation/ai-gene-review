suggested_questions:
- question: Can endogenous tagging and submitochondrial fractionation independently test the inherited
    matrix localization of S. pombe Put2 and detect any additional cytosolic pool?
- question: UniProt O74766 has no gene name (only SPBC24C6.04); could the PomBase symbol put2 be added
    to UniProt?
suggested_experiments:
- description: Localise endogenously tagged put2 (GFP) relative to a mitochondrial marker, and test a
    put2 deletion for growth on proline or arginine as sole nitrogen source and for P5C accumulation.
