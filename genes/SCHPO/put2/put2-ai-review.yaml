description: put2 (SPBC24C6.04) encodes the probable 1-pyrroline-5-carboxylate (P5C) dehydrogenase (L-glutamate
  gamma-semialdehyde dehydrogenase, EC 1.2.1.88) of fission yeast, an aldehyde dehydrogenase-family enzyme
  orthologous to S. cerevisiae PUT2. It oxidises L-glutamate 5-semialdehyde, in equilibrium with P5C,
  to L-glutamate with NAD+, the second and final step of proline degradation after the proline dehydrogenase
  put1, and thereby also the last step of arginine catabolism to glutamate. It is presumed to act in the
  mitochondrial matrix like its budding-yeast ortholog, although it lacks an obvious N-terminal presequence.
  Its function is inferred from sequence and orthology.
