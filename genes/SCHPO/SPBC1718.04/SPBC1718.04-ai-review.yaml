  label: Schizosaccharomyces pombe 972h-
description: SPBC1718.04 (UniProt Q9P7P0) encodes an ER glycerol-3-phosphate acyltransferase (GPAT; Gpt2/Sct1
  family). It acylates glycerol 3-phosphate (and by similarity dihydroxyacetone phosphate) at sn-1, the
  first step of de novo phosphatidic acid synthesis for phospholipids and triacylglycerol. Function is
  assigned by orthology; it is in the ER in a genome-wide screen.
