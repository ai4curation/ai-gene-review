- term:
    id: GO:0033755
    label: sulfur oxygenase/reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:13957
  - EC:1.13.11.55
  review:
    summary: >-
      Sulfur oxygenase/reductase activity, from the EC/Rhea mapping. This is the defining
      activity of this protein, which is the type enzyme for EC 1.13.11.55; the GO term
      definition itself cites the A. ambivalens sor gene paper (PMID:1522063). Activity
      was demonstrated on the native enzyme, the recombinant enzyme and mutants.
    action: ACCEPT
    reason: >-
      Directly demonstrated by enzyme assays on purified native and recombinant
      A. ambivalens SOR (oxygen-dependent production of sulfite and H2S from elemental
      sulfur), with iron-ligand and Cys31 mutants abolishing both partial reactions. The
      IEA row is correct and represents the core function; experimental (IDA) support
      exists but has not been captured in GOA.
    supported_by:
    - reference_id: PMID:2493451
      supporting_text: In the presence of oxygen but not under a hydrogen atmosphere, the
        enzyme simultaneously produced sulfite, thiosulfate, and hydrogen sulfide from
        sulfur.
    - reference_id: PMID:16484493
      supporting_text: which catalyzes an
        oxygen-dependent disproportionation of elemental sulfur
    - reference_id: PMID:15970399
      supporting_text: In all cases the oxygenase and reductase partial reactions were
        equally affected.
- term:
    id: GO:0019417
    label: sulfur oxidation
  evidence_type: IDA
  original_reference_id: PMID:15030315
  review:
    summary: >-
      Proposed new process annotation. SOR itself catalyses the oxygenation of elemental
      sulfur to sulfite, which is exactly the GO:0019417 definition ("addition of oxygen
      to elemental sulfur"), and it is described as the initial enzyme of the
      sulfur-oxidation pathway of A. ambivalens.
    action: NEW
    reason: >-
      Participation test: SOR performs the step (the oxygenase half-reaction on S0), it
      is not a substrate or regulator. Comparator check: GO:0019417 is used in GOA for
      enzymes that catalyse sulfur-oxidation steps (over 2000 rows, e.g. SoxA family
      proteins), so annotating the enzyme that oxygenates S0 follows the existing
      convention. GO:0070220 aerobic sulfur oxidation was deliberately not used because
      its definition specifies the sulfur dioxygenase reaction, a different enzyme. The
      in vivo debate (initial step vs. a recycling role; PMID:31188531) concerns pathway
      position, not whether SOR oxidises sulfur.
    supported_by:
    - reference_id: PMID:15030315
      supporting_text: The SOR (sulphur oxygenase reductase) is the initial enzyme in the
        sulphur-oxidation pathway of Acidianus ambivalens.
    - reference_id: PMID:21747782
      supporting_text: The sulfur oxygenase reductase (SOR) is the initial enzyme of the
        sulfur oxidation pathway in the thermoacidophilic Archaeon Acidianus ambivalens.
    - reference_id: PMID:31188531
      supporting_text: Here, heterologous expression of both
        SOR and membrane-bound thiosulphate-quinone oxidoreductase (TQO) from Sulfolobus
        tokodaii 'restored' sulphur oxidation capacity in Sulfolobus acidocaldarius
        DSM639
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IDA
  original_reference_id: PMID:16484493
  review:
    summary: >-
      Proposed new function annotation. Each subunit binds one mononuclear non-haem iron,
      shown by chemical analysis and EPR, mapped by mutagenesis (H86A, H90A, E114A abolish
      iron incorporation) and seen in the 1.7 A crystal structure as a
      2-His-1-carboxylate facial triad.
    action: NEW
    reason: >-
      Iron is the catalytic cofactor (the likely site of both sulfur oxidation and
      reduction), so iron ion binding is a mechanistic feature of the enzyme supported by
      three independent experimental approaches on the A. ambivalens protein. UniProt
      records Fe BINDING sites and the Iron/Metal-binding keywords, but no corresponding
      GO row exists in GOA. Kept non-core: it is a cofactor-binding feature subsidiary to
      the sulfur oxygenase/reductase activity.
    supported_by:
    - reference_id: PMID:16484493
      supporting_text: A cysteine persulfide and a low-potential mononuclear non-heme iron
        site ligated by a 2-His-1-carboxylate facial triad in a pocket of each subunit
        constitute the active sites
    - reference_id: PMID:15030315
      supporting_text: Iron was found in the wild-type enzyme at a stoichiometry of one
        iron atom/subunit.
    - reference_id: PMID:15970399
      supporting_text: Mutations of the suspected iron-binding residues H86, H90 and E114
        to alanine resulted in inactive enzyme with no iron incorporated
core_functions:
- description: >-
    Cytoplasmic iron-dependent sulfur oxygenase/reductase: within the internal cavity of a
    24-subunit hollow sphere, each active site (mononuclear non-haem Fe with a
    2-His-1-carboxylate triad plus a Cys31 persulfide) disproportionates elemental sulfur
    in an O2-dependent reaction to sulfite and hydrogen sulfide, initiating sulfur
    oxidation in Acidianus ambivalens.
