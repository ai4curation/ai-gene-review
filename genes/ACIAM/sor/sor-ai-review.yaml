suggested_questions:
- question: >-
    Is SOR the obligatory first step of elemental sulfur oxidation in A. ambivalens in
    vivo, or mainly a recycling enzyme acting on sulfur produced by other pathways (e.g.
    sulfide:quinone or thiosulfate oxidation)?
- question: >-
    How are the reactive products (sulfite, H2S, thiosulfate) channelled from the SOR
    nanocompartment to downstream membrane enzymes (sulfite:acceptor oxidoreductase,
    TQO), and does A. ambivalens SOR associate with the membrane as reported for the
    A. tengchongensis ortholog?
- question: >-
    Should GO's "aerobic sulfur oxidation" (GO:0070220), currently defined by the sulfur
    dioxygenase reaction, be broadened or given a sibling so that O2-dependent
    SOR-initiated sulfur oxidation in archaea and bacteria can be captured precisely?
suggested_experiments:
- description: >-
    Construct an sor deletion (or CRISPR knockdown) in a genetically tractable
    sulfur-oxidizing Sulfolobales host and measure growth and sulfate production on S0
    under aerobic chemolithoautotrophic conditions.
  hypothesis: >-
    If SOR initiates sulfur oxidation, its loss will abolish or severely reduce aerobic
    growth on elemental sulfur and sulfate formation.
- description: >-
    Immunogold electron microscopy and cell fractionation of aerobically grown
    A. ambivalens, combined with crosslinking/pull-down, to detect SOR association with
    the cytoplasmic membrane and with TQO or sulfite oxidoreductase.
  hypothesis: >-
    A fraction of SOR is membrane-associated in proximity to downstream oxidoreductases,
    enabling product channelling.
