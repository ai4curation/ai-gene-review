  review:
    summary: >-
      Cytoplasm, from the UniProt subcellular location mapping. SOR was purified as a
      soluble enzyme and is described as a cytoplasmic hollow 24-mer; its substrate
      chemistry (polysulfide stability) is consistent with the near-neutral cytoplasm.
    action: ACCEPT
    reason: >-
      SOR has no signal peptide or transmembrane segment, was purified as a soluble
      protein from A. ambivalens, and is consistently described as cytoplasmic. A partial
      membrane association reported for the A. tengchongensis ortholog (PMID:15691910)
      has not been shown for A. ambivalens and does not contradict the cytoplasmic
      location.
