id: P29082
gene_symbol: sor
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2283
  label: Acidianus ambivalens
description: >-
  sor encodes the sulfur oxygenase/reductase (SOR, EC 1.13.11.55) of the
  thermoacidophilic, chemolithoautotrophic and facultatively anaerobic crenarchaeon
  Acidianus ambivalens (Sulfolobales). SOR is a soluble cytoplasmic enzyme, induced
  under aerobic growth, that catalyses an oxygen-dependent disproportionation of
  elemental sulfur: one part of the sulfur is oxygenated to sulfite while another part
  is reduced to hydrogen sulfide, with thiosulfate arising mainly non-enzymatically
  from sulfite and sulfur. It is considered the initial enzyme of sulfur oxidation in
  Acidianus, supplying sulfite and thiosulfate to downstream membrane-bound
  oxidoreductases, although an ancillary "recycling" role has also been proposed. Twenty-four
  identical ~35 kDa subunits assemble into a thermostable hollow sphere (432 symmetry,
  ~871 kDa) enclosing a positively charged nanocompartment; each subunit has an
  inward-facing active-site pocket containing a low-potential mononuclear non-haem iron
  bound by a 2-His-1-carboxylate facial triad (His86, His90, Glu114) and an essential
  cysteine persulfide (Cys31). Substrate enters through apolar chimney-like channels and
  pores; Zn2+ inhibits the enzyme by binding in a side channel.
