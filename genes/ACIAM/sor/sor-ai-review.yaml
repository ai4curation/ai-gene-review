  - statement: SOR purified from aerobically grown cells; oxygen-dependent simultaneous
      production of sulfite, thiosulfate and H2S from sulfur; thiosulfate largely
      non-enzymatic.
    supporting_text: In the presence of oxygen but not under a hydrogen atmosphere, the
      enzyme simultaneously produced sulfite, thiosulfate, and hydrogen sulfide from
      sulfur.
