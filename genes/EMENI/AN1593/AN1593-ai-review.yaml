- id: PMID:22506079
  title: Identification and characterization of a novel diterpene gene cluster in
    Aspergillus nidulans.
  findings:
  - statement: PbcR overexpression activates a cluster containing AN1593.4 and
      causes production of ent-pimara-8(14),15-diene.
    supporting_text: Overexpression of pbcR upregulated the transcription of seven
      genes in the identified cluster and led to the production of a diterpene
      compound, which was characterized with GC/MS as ent-pimara-8(14),15-diene.
  - statement: AN1593.4 is the HMG-CoA reductase encoded in the PbcR-activated
      diterpene cluster.
    supporting_text: The highly upregulated genes were homologous to GGPP synthase;
      AN1592.4 (307,000-fold), HMG-CoA reductase; AN1593.4 (12,000-fold)
  - statement: The proposed model places AN1593.4 in the mevalonate pathway as the
      source of isoprenoid precursors for ent-pimara-8(14),15-diene biosynthesis.
    supporting_text: >-
      Based on the data presented here, we suggest a model for
      ent-pimara-8(14),15-diene biosynthesis in Aspergillus nidulans.
      Specifically, HMG-CoA reductase (AN1593.4) functions in the mevalonate
      pathway, which produces isoprenoid precursors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; direct A. nidulans pbcR-cluster study that identifies
      AN1593.4 and supports its cluster-specific mevalonate-precursor role.
