  review:
    summary: AspGD expression evidence from the PbcR-activated pimaradiene cluster.
      Correct.
    action: ACCEPT
    reason: Overexpression of the cluster-specific regulator pbcR strongly upregulated
      AN1593.4 together with the neighboring pimaradiene-cluster genes, and the
