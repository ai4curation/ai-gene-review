  review:
    summary: HMG-CoA reductase activity inherited from PAINT node PTN000060346. Correct.
    action: ACCEPT
    reason: AN1593 belongs to the HMG-CoA reductase family and was identified as the
      HMG-CoA reductase encoded within the PbcR-activated pimaradiene biosynthetic
      cluster. PAINT node PTN000060346 places the exact NADPH-dependent HMG-CoA
      reductase activity above the AN1593-containing HMG-CoA reductase family, which
      is appropriate because AN1593 retains the catalytic family signature even though
      its organismal role is secondary diterpene metabolism rather than housekeeping
      ergosterol production.
    supported_by:
