suggested_questions:
- question: Is AN1593 an active HMG-CoA reductase in vitro, or has the secondary-metabolite-cluster
    paralog lost measurable NADPH-dependent HMG-CoA reductase activity?
  experts:
  - Aspergillus secondary-metabolite curators
- question: Is AN1593 a soluble catalytic-domain protein despite UniProt's predicted
    C-terminal transmembrane helix?
  experts:
  - UniProt fungal protein curators
- question: Does AN1593 specifically supply mevalonate-derived precursor to the pimaradiene
    cluster in vivo, rather than merely being co-induced with pbcR?
  experts:
  - Aspergillus secondary-metabolite curators
suggested_experiments:
- description: Assay purified recombinant AN1593 for NADPH-dependent reduction of HMG-CoA
    to mevalonate and compare the rate with the housekeeping A. nidulans HMGR.
- description: Fractionate pbcR-overexpressing A. nidulans cells expressing epitope-tagged
    AN1593, and compare soluble and membrane fractions by immunoblot or targeted
    proteomics to test the predicted single-pass membrane assignment.
- description: Delete AN1593 in a pbcR-overexpression background and quantify
    ent-pimara-8(14),15-diene production by GC/MS to test whether AN1593 contributes
    precursor flux to the cluster.
