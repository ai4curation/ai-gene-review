      supporting_text: "Based on the data presented here, we suggest a model for ent-pimara-8(14),15-diene
        biosynthesis in Aspergillus nidulans. Specifically, HMG-CoA reductase (AN1593.4)
        functions in the mevalonate pathway, which produces isoprenoid precursors."
