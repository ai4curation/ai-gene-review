gene_symbol: AN1593
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  AN1593 encodes a short HMG-CoA reductase in the PbcR-activated Aspergillus
  nidulans pimaradiene biosynthetic cluster. The protein retains the class I
  HMG-CoA reductase catalytic domain and residues but lacks the N-terminal
  sterol-sensing membrane region of canonical fungal sterol-pathway HMG-CoA
  reductases. It is proposed to reduce HMG-CoA to mevalonate and to supply
  mevalonate-derived isoprenoid precursors for production of the diterpene
  ent-pimara-8(14),15-diene.
