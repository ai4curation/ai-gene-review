  label: Aspergillus nidulans FGSC A4
description: >-
  AN1593 encodes a short, predicted single-pass membrane HMG-CoA reductase in
  the PbcR-activated Aspergillus nidulans pimaradiene biosynthetic cluster. The
  enzyme reduces HMG-CoA to mevalonate and is proposed to supply
  mevalonate-derived isoprenoid precursors for production of the diterpene
  ent-pimara-8(14),15-diene.
