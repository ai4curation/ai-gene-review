- term:
    id: GO:0071474
    label: cellular hyperosmotic response
  evidence_type: ISA
  original_reference_id: PMID:15882418
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - SGD:S000004103
  review:
    summary: The S. cerevisiae Hog1 ISA transfer captures a genuine
      hyperosmotic-stress input to the PbsB-MpkC branch.
    action: ACCEPT
    reason: >-
      MpkC is not the principal A. nidulans osmoadaptation effector: Furukawa
      et al. found that mpkC is dispensable in osmoadaptation, and SakA/HogA
      carries the dominant HOG role. However, later endogenous MpkC::GFP imaging
      showed that osmotic stress induces largely PbsB-dependent MpkC nuclear
      accumulation, so MpkC is still part of the cellular hyperosmotic response
      as a minor stress-activated MAPK branch.
    supported_by:
    - reference_id: PMID:15882418
      supporting_text: nidulans, although mpkC is dispensable in
        osmoadaptation.
    - reference_id: PMID:30405576
      supporting_text: |-
        SakA and MpkC
        play major, distinct and sometimes opposing roles in conidiation and
        conidiospore physiology, as well as common roles in response to stress.
