- term:
    id: GO:0007231
    label: osmosensory signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001172058
  - SGD:S000004103
  - UniProtKB:Q9P419
  review:
    summary: The fungal HOG/Sty1 PAINT node correctly propagates osmosensory
      signaling to the A. nidulans MpkC/SakA branch.
    action: ACCEPT
    reason: PTN001172058 is the fungal stress-MAPK node. Furukawa et al. showed
      that the PbsB MAPKK can activate both HogA/SakA and MpkC, and later work
      showed that osmotic stress induces PbsB-dependent MpkC nuclear
      accumulation. The old deletion result means MpkC is not the main
      osmoadaptation MAPK, not that it has left the inherited osmosensory
      signaling branch.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001172058
        source_label: fungal HOG/Sty1 stress-MAPK node
        source_status: SUPPORTS_TRANSFER
        comment: This PAINT placement is on the fungal HOG/Sty1 stress-MAPK
          node and remains appropriate for MpkC, a PbsB-responsive
          HOG1-subfamily kinase.
    supported_by:
    - reference_id: PMID:30405576
      supporting_text: |-
        Oxidative and osmotic stresses induce MpkC nuclear accumulation in both
        germinating conidia and hyphae. In all these cases, MpkC nuclear accumulation is
        largely dependent on the MAPKK PbsB.
