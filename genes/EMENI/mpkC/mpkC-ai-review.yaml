taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: mpkC encodes a HOG1-subfamily mitogen-activated protein kinase in
  Aspergillus nidulans. MpkC is one of two SakA/HogA-like stress-activated
  MAPKs in Aspergillus, is phosphorylated and regulated downstream of the PbsB
  MAPKK, and accumulates in the nucleus during asexual development and in
  response to osmotic or oxidative stress.
