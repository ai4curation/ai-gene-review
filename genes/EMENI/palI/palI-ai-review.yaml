id: O93956
gene_symbol: palI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  PalI is an Aspergillus nidulans PalI/Rim9-family multipass membrane protein
  in the upstream Pal/PacC ambient-pH signaling module. It localizes to the
  plasma membrane, septae, and polarized hyphal tips and assists
  plasma-membrane localization of the PalH ambient-pH receptor arm needed for
  efficient alkaline pH signaling to PacC.
