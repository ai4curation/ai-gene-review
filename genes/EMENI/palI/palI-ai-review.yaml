suggested_questions:
- question: >-
    What is PalI's direct molecular activity in promoting PalH
    plasma-membrane localization: oligomerization support, secretory escort,
    endocytosis prevention, or another mechanism?
suggested_experiments:
- description: >-
    Coexpress stoichiometric PalH, PalF, and PalI fusions from controlled
    promoters and follow PalH and PalI internalization after alkaline pH shift
    to test whether the plasma-membrane pH-sensing complex internalizes as a
    single unit.
  experiment_type: live-cell fluorescence microscopy
- description: >-
    Combine PalH-GFP with ER, Golgi, endosomal, and plasma-membrane markers in
    wild type, palI null, and PalI add-back strains to distinguish PalI roles in
    PalH folding, secretory export, and endocytosis.
  experiment_type: colocalization microscopy
knowledge_gaps:
- gap_statement: >-
    PalI's direct molecular activity in PalH plasma-membrane localization and
    alkaline-pH signaling is unknown.
  boundary: >-
    PalI-GFP localizes to the plasma membrane, septae, and hyphal tips, and
    PalI can shift overexpressed PalH-GFP toward the plasma membrane, but the
    2007 study left open whether PalI promotes PalH oligomerization, secretory
    pathway export, reduced endocytosis, or another activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
