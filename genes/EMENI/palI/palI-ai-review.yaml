- term:
    id: GO:0009268
    label: response to pH
  evidence_type: IMP
  original_reference_id: PMID:17951518
  qualifier: involved_in
  review:
    summary: >-
      NEW: PalI is a direct upstream component of the A. nidulans ambient-pH
      signaling pathway.
    action: NEW
    reason: >-
      PalI is not a passive substrate of pH signaling: loss of palI impairs the
      alkaline-induced PacC processing intermediate, and the protein acts in the
      plasma-membrane PalH/PalF/PalI arm of the pathway. A response-to-pH
      process row is therefore justified.
    supported_by:
    - reference_id: PMID:17951518
      supporting_text: >-
        PalI is not essential for the proteolytic conversion of the PacC
        translation product into the processed 27-kDa form, but its absence
        markedly reduces the accumulation of the 53-kDa intermediate after cells
        are shifted to an alkaline pH.
- term:
    id: GO:1903078
    label: positive regulation of protein localization to plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:17951518
  qualifier: involved_in
  review:
    summary: >-
      NEW: PalI specifically promotes PalH-GFP localization at the plasma
      membrane.
    action: NEW
    reason: >-
      Coexpression experiments directly compared PalH-GFP localization with and
      without PalI or PalC and showed that PalI, but not PalC, shifts PalH-GFP
      from internal specks to a strong plasma-membrane distribution. This is a
      direct PalI contribution to plasma-membrane localization of another
      protein in the pH-sensing module.
    supported_by:
    - reference_id: PMID:17951518
      supporting_text: PalI specifically assists the localization of PalH-GFP at the plasma membrane
