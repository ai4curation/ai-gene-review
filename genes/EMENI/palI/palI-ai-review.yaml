- term:
    id: GO:0010446
    label: response to alkaline pH
  evidence_type: IMP
  original_reference_id: PMID:17951518
  qualifier: involved_in
  review:
    summary: >-
      NEW: PalI is a direct upstream component of the A. nidulans alkaline-pH
      signaling pathway.
    action: NEW
    reason: >-
      PalI is not a passive substrate of pH signaling: loss of palI impairs the
      alkaline-induced PacC processing intermediate, and the protein acts in the
      plasma-membrane PalH/PalF/PalI arm of the pathway. An alkaline-pH
      response row is therefore justified.
    additional_reference_ids:
    - PMID:7830727
    - file:EMENI/palI/palI-uniprot.txt
    supported_by:
    - reference_id: PMID:7830727
      supporting_text: >-
        Two new genes, palH and palI, where mutations mimic the effects of
        acidic growth pH have been identified in Aspergillus nidulans.
    - reference_id: PMID:17951518
      supporting_text: >-
        PalI is not essential for the proteolytic conversion of the PacC
        translation product into the processed 27-kDa form, but its absence
        markedly reduces the accumulation of the 53-kDa intermediate after cells
        are shifted to an alkaline pH.
    - reference_id: file:EMENI/palI/palI-uniprot.txt
      supporting_text: |-
        CC   -!- FUNCTION: Required for the proteolytic cleavage of the transcription
        CC       factor pacC in response to alkaline ambient pH. Might be a pH sensor.
- term:
    id: GO:0072659
    label: protein localization to plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:17951518
  qualifier: involved_in
  review:
    summary: >-
      NEW: stoichiometric PalI coexpression shifts overexpressed PalH-GFP to
      the plasma membrane.
    action: NEW
    reason: >-
      Overexpressed PalH-GFP can reach the plasma membrane but accumulates in
      internal compartments even in a palI null mutant. When PalH-GFP and PalI
      are coexpressed at stoichiometrically similar levels, PalI, but not the
      PalC control, shifts PalH-GFP to strong plasma-membrane predominance.
      This is direct evidence that PalI participates in PalH
      plasma-membrane localization under the assay conditions, while not proving
      that PalI is a general positive regulator of localization.
    supported_by:
    - reference_id: PMID:17951518
      supporting_text: >-
        Localization of PalH-GFP to these specks was not prevented by null palA
        , palF , and palI mutations
    - reference_id: PMID:17951518
      supporting_text: PalI specifically assists the localization of PalH-GFP at the plasma membrane
