  qualifier: enables
  review:
    summary: 'Accept: DNA-binding transcription factor activity, RNA polymerase II-specific.'
    action: ACCEPT
    reason: C2H2 zinc-finger factors bind Pol II promoters; the family call fits FlbC's predicted architecture and
      its position upstream of brlA/abaA in this cascade.
