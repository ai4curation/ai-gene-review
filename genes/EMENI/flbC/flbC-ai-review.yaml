  qualifier: involved_in
  review:
    summary: 'Accept: regulation of transcription by RNA polymerase II.'
    action: ACCEPT
    reason: The process counterpart of the molecular function above. FlbC's characterised effect is on developmental
      gene transcription rather than on any other cellular process.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: 'Accept: nucleus.'
    action: ACCEPT
    reason: Nuclear action is required for the transcription-factor role and is directly observed in this review;
      is_active_in is the right qualifier for the site of the regulatory activity.
