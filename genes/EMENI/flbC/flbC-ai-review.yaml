- term:
    id: GO:0048315
    label: conidium formation
  evidence_type: IMP
  original_reference_id: PMID:20624219
  qualifier: acts_upstream_of_or_within
  review:
    summary: Core process. FlbC regulates conidium formation.
    action: ACCEPT
    reason: FlbC is an upstream developmental activator required for normal conidiation.
    supported_by:
    - reference_id: PMID:20624219
      supporting_text: The deletion of flbC causes a delay/reduction in conidiation, brlA and vosA expression, and conidial germination.
    - reference_id: PMID:20624219
      supporting_text: In summary, FlbC is a putative nuclear transcription factor necessary for proper activation of conidiation, and its balanced activity is crucial for governing growth and development in A. nidulans.
