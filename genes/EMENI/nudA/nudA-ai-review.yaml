  review:
    summary: GFP-dynein forms plus-end comets near the hyphal tip, dependent on kinesin-1 (KinA), dynactin
      and the intermediate chain.
    action: NEW
    reason: Plus-end accumulation of dynein is a well-documented, functionally important location in A.
      nidulans (it facilitates loading onto early endosomes); the existing hyphal tip annotations describe
      the cell region rather than the microtubule structure.
