id: P45444
gene_symbol: nudA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Emericella nidulans (strain FGSC A4 / ATCC 38163 / CBS 112.46 / NRRL 194 / M139)
description: 'NudA is the heavy chain of cytoplasmic dynein in Aspergillus nidulans, a 4,345-residue AAA+
  motor whose N-terminal tail binds the intermediate, light-intermediate and light chains and whose C-terminal
  ring of six AAA domains hydrolyses ATP and drives movement toward microtubule minus ends through a stalk-borne
  microtubule-binding domain. NudA was cloned as a nuclear distribution (nud) gene: loss-of-function mutants
  cluster nuclei at the spore end of the germ tube, grow as small colonies, mis-position the first septum
  and fail to conidiate, and the null mutant is viable, implying backup motors for nuclear division. Dynein
  is transported by kinesin-1 to microtubule plus ends near the hyphal tip, where it accumulates with
  dynactin and NudF (LIS1) as comets, is loaded onto early endosomes via the Hook adaptor, and is switched
  from an autoinhibited to an active state with the help of NudF and NudE; it then carries early endosomes
  and other vesicles retrogradely away from the tip. Dynein also localizes to the septation site and to
  spindle pole bodies in mitosis, and influences cytoplasmic microtubule dynamics.'
