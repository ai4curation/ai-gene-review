    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:8134356
    supporting_text: Our study provides in vivo evidence that dynein, a microtubule motor molecule, plays
      a role in the nuclear migration process.
  - reference_id: PMID:20876661
    supporting_text: Cytoplasmic dynein is a multi-subunit microtubule motor that uses the ATPase activity
      of its heavy chain to move towards the minus-end of a microtubule.
  - reference_id: PMID:17237507
    supporting_text: Interestingly, while dynein containing this mutation interacts with NUDF just like
      wild-type dynein, its basal-level ATPase activity is obviously decreased.
- description: 'Retrograde cargo motor: dynein accumulated at microtubule plus ends near the hyphal tip
    is loaded onto early endosomes and other vesicles and carries them away from the tip toward minus
    ends.'
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
