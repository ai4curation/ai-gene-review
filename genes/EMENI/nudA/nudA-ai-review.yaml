core_functions:
- description: 'Motor heavy chain of cytoplasmic dynein: ATP hydrolysis in the AAA ring drives minus-end-directed
    stepping along cytoplasmic microtubules, moving nuclei along the hypha to give uniform nuclear distribution.'
  molecular_function:
