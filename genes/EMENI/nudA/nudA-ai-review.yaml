    label: microtubule plus-end
  - id: GO:0001411
    label: hyphal tip
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:19037104
    supporting_text: In addition to the reduced motility, an accumulation of vesicles was observed in
      the dynein mutant at the hyphal tip, suggesting that dynein is required for retrograde transportation.
  - reference_id: PMID:20876661
    supporting_text: Cytoplasmic dynein in filamentous fungi accumulates at microtubule plus-ends near
      the hyphal tip, which is important for minus-end-directed transport of early endosomes.
