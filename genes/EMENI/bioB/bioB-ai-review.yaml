  label: Aspergillus nidulans FGSC A4
description: >-
  BioB (biotin synthase; EC 2.8.1.6) of Aspergillus nidulans is the terminal
  enzyme of biotin biosynthesis, a radical S-adenosyl-L-methionine (radical-SAM)
  enzyme that inserts a sulfur atom between the C6 and C9 carbons of dethiobiotin
  to complete the thiophane ring of biotin. Like other biotin synthases it uses a
  [4Fe-4S] cluster to reductively cleave SAM to the 5'-deoxyadenosyl radical and
  a [2Fe-2S] cluster that serves as the sulfur source. The A. nidulans enzyme is
  synthesised as a precursor and is mitochondrial, in contrast to the cytosolic
  bacterial biotin synthases. The gene is part of the A. nidulans biotin
  biosynthetic gene cluster.
