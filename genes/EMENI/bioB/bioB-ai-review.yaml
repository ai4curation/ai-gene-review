core_functions:
- description: >-
    BioB completes biotin synthesis by radical-SAM-dependent insertion of sulfur
    into dethiobiotin to form the thiophane ring, using a catalytic [4Fe-4S]
    cluster and a [2Fe-2S] sulfur-donor cluster, in the mitochondrion of
    A. nidulans.
