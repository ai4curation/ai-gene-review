- term:
    id: GO:0075306
    label: regulation of conidium formation
  evidence_type: IMP
  original_reference_id: PMID:15944346
  qualifier: acts_upstream_of_or_within
  review:
    summary: Core process. GpgA regulates conidium formation.
    action: ACCEPT
    reason: GpgA governs conidiation as part of the growth/development G-protein switch. The unsigned term is
      retained deliberately rather than signed to GO:0075308 as on its FadA and SfaD partners, because the
      gpgA loss-of-function phenotype runs the other way. Deleting sfaD gives hyperactive sporulation, whereas
      deleting gpgA lowers conidiation and, explicitly unlike the sfaD deletion, does not produce conidiophores
      in submerged culture, so GpgA cannot be called a negative regulator on this evidence. The reduced
      conidiation is in turn confounded by the restricted vegetative growth of the same mutant, so GO:0075307
      is not assertable either, leaving the unsigned parent as the most specific defensible term.
    supported_by:
    - reference_id: PMID:15944346
      supporting_text: unlike Δ sfaD , deletion of gpgA resulted in fluffy-reduced conidiation phenotypes
        during the early phase of growth and did not cause conidiophore formation in liquid submerged
        culture
