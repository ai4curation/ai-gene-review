- term:
    id: GO:0048315
    label: conidium formation
  evidence_type: IMP
  original_reference_id: PMID:8895563
  qualifier: acts_upstream_of_or_within
  review:
    summary: Direction should be signed. FadA signaling represses conidiation rather than driving conidium
      formation.
    action: MODIFY
    reason: The unsigned term loses the demonstrated direction. Constitutive FadA signaling (fadA(G42R))
      blocks sporulation, while loss of fadA leaves sporulation intact and the dominant-interfering allele
      is a hyperactive sporulator, so FadA is a negative regulator of conidium formation.
    proposed_replacement_terms:
    - id: GO:0075308
      label: negative regulation of conidium formation
    supported_by:
    - reference_id: PMID:8895563
      supporting_text: activation of this pathway leads to proliferation and blocks sporulation
    - reference_id: PMID:8895563
      supporting_text: a fadA deletion and a fadA dominant-interfering mutation (fadA(G203R)) resulted in
        reduced growth without impairing sporulation
