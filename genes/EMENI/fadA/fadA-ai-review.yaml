    label: G protein activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'Accept: G protein activity.'
    action: ACCEPT
    reason: The IBA call places FadA in the G-alpha clade, and GO:0003925 covers exactly the GTP-binding/hydrolysing
      signal-transducer role of a G-alpha subunit. This is FadA's core molecular function.
