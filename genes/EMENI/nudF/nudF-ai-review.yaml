id: Q00664
gene_symbol: nudF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: 'NudF is the Aspergillus nidulans ortholog of the lissencephaly protein LIS1 (Pac1 in budding
  yeast), a 444-residue homodimeric regulator of cytoplasmic dynein with an N-terminal LisH/coiled-coil
  dimerization region and a seven-bladed WD40 beta-propeller. It acts in the dynein/dynactin pathway (with
  the heavy chain NudA, NudE and NudC) that distributes nuclei along the multinucleate hypha: temperature-sensitive
  or null nudF mutants accumulate nuclei in the conidial end of the germ tube, and dynein heavy-chain
  point mutations bypass the loss of NudF. NudF binds the coiled-coil domain of NudE and co-purifies with
  dynein. It travels as comets at microtubule plus ends near the hyphal tip (recruited by the CLIP-170
  homolog ClipA and by NudE) and localizes to spindle pole bodies in mitosis, where it is needed to target
  dynein to the spindle poles. NudF is required to initiate dynein-driven retrograde transport of early
  endosomes and peroxisomes from the hyphal tip, but not for the speed of moving cargo, and acts at the
  step that switches dynein from its autoinhibited phi conformation to an open, activatable state. Loss
  of NudF also alters microtubule dynamics and impairs conidiation and sexual development.'
