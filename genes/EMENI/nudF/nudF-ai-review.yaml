  review:
    summary: NudF is required for cargo-adapter (HookA)-mediated activation of dynein in vivo and acts
      by relieving dynein autoinhibition.
    action: NEW
    reason: 'The best-supported molecular function of NudF is regulation of the dynein motor: NudF is
      required for dynein activation by the adapter DeltaC-HookA, and dynein mutations that prevent the
      autoinhibited phi conformation bypass the need for NudF. Consistent with the module and the human
      LIS1 review (GO:0140659). Not currently in GOA for nudF.'
    additional_reference_ids:
