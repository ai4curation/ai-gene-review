  review:
    summary: Lis1/NudF deletion causes early endosomes and peroxisomes to accumulate at hyphal tips because
      dynein-driven retrograde runs are rarely initiated.
    action: NEW
    reason: 'Participation test: NudF is a dynein regulator that acts on the motor at the initiation step
      of each retrograde run (it is not a cargo or a substrate), the same role in which LIS1 is annotated
      to retrograde axonal transport. Comparator: human PAFAH1B1 and NDEL1 carry dynein-driven transport
      processes in their reviews. Evidence is from deletion mutants in A. nidulans in two laboratories.'
    additional_reference_ids:
    - PMID:20876661
    supported_by:
    - reference_id: PMID:22711696
      supporting_text: In the absence of Lis1, endosomes and peroxisomes accumulate at hyphal tips, and
        retrograde movements are quite rare
    - reference_id: PMID:22711696
      supporting_text: Based on these observations, we propose that Lis1 has a general role in initiating
        dynein-driven motility.
    - reference_id: PMID:22711696
      supporting_text: Moreover, Lis1, unlike dynein and dynactin, was absent from moving dynein cargos
