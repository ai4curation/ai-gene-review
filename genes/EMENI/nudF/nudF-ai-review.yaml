core_functions:
- description: 'Dynein motor regulator: NudF (LIS1) binds the dynein motor and promotes its switch from
    the autoinhibited phi conformation to an open conformation that cargo adapters and dynactin can activate,
    initiating minus-end-directed runs that move nuclei along the hypha and carry early endosomes away
    from the hyphal tip.'
