    supported_by:
    - reference_id: PMID:31562232
      supporting_text: Together, these results indicate that NudF/LIS1 is critically required for ΔC-HookA–mediated
        dynein activation in A.
    - reference_id: PMID:31562232
      supporting_text: Our results suggest a novel mechanism of LIS1 action that promotes the switch of
        dynein from the autoinhibited state to an open state to facilitate dynein activation.
    - reference_id: PMID:34428469
      supporting_text: Importantly, the wB-AAA3 mutation suppressed the colony growth defect of the ΔnudF
