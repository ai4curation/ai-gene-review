    label: establishment of mitotic spindle orientation
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000107004
  review:
    summary: UniRule/HAMAP family transfer of establishment of mitotic spindle orientation.
    action: KEEP_AS_NON_CORE
    reason: Spindle orientation/positioning by cortical dynein and Pac1/LIS1 is well established in budding
      yeast and animal cells, and the HAMAP rule transfers it across the LIS1/nudF family. In A. nidulans
      the documented NudF phenotype is nuclear distribution along the hypha plus a role in targeting dynein
      to spindle pole bodies; spindle orientation per se has not been assayed for nudF. The family-level
      inference is plausible for a conserved dynein regulator but is not the characterized function in
      this organism, so it is kept as non-core.
