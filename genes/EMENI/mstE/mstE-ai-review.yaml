knowledge_gaps:
- gap_statement: >-
    It is unknown whether MstE moves glucose by facilitated diffusion or by proton symport.
    No uncoupler, proton-flux or electrophysiological measurement has been reported for MstE.
  gap_kind:
  - BIOLOGY
