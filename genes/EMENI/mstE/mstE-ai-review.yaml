core_functions:
- description: >-
    Low-affinity uptake of extracellular D-glucose across the plasma membrane, active in
    germinating conidia and in hyphae growing on glucose or other repressing carbon sources.
    Glucose transport, the low-affinity kinetics and the plasma-membrane location are
    established experimentally in A. nidulans. The coupling mechanism is not.
  molecular_function:
