  review:
    summary: >-
      An AspGD IDA for mannose transport. The abstract reports only glucose transport; the
      mannose evidence is presumably in the unavailable full text.
    action: UNDECIDED
    reason: >-
      PMID:16418173 is cached abstract-only, and the full text could not be retrieved. The
      abstract describes MstE only as a low-affinity glucose transporter. In this literature
      the usual evidence for alternative substrates is that an excess of unlabelled sugar
      competes with radiolabelled-glucose uptake, as for MstA/MstC in PMID:24751997. Such
