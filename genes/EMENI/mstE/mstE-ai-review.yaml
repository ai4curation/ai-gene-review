  review:
    summary: >-
      Transport of glucose by MstE is established, but its proton coupling has never been tested.
      This IBA rests on the PTHR48022 family root, an IBD that does not have MstE among its seeds.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MstE descends from PTN000627328, the LUCA-level root of PTHR48022 (521 leaves),
      which carries the GO:0005351 IBD. That node's seeds are S. pombe SPCC548.07c,
      SGD:S000003521, and the A. nidulans paralogs MstA (AN8737, Q5ASJ3) and MstC (AN6669,
      Q5AYG1), all in other subfamilies; MstE is not among them, although the same curator
      used MstE as a seed for the membrane and carbohydrate-transport IBDs at the same
      node (mstE-bioinformatics/RESULTS.md). The family also contains low-affinity
      glucose facilitators such as S. cerevisiae HXT1/HXT3, so proton coupling is not a
      family-wide property; the PTHR48022 family review states that family-wide proton
      coupling is not supported. The only MstE experiment is uptake kinetics in germlings
      and a deletion mutant (PMID:16418173, abstract), with no uncoupler or proton-flux
      measurement; the CCCP-sensitivity data in PMID:24282591 concern HxtB, HxtC and
      HxtE, not MstE. At the TM1 position equivalent to the XylE Asp27 protonation site
      MstE has Ser67 (its SF92 ortholog GLT-1 has Val48), whereas the proton-coupled
      paralogs MstC and HxtE retain Asp. This is suggestive only, since the facilitator
      HXT1 also has Asp. The mechanism-agnostic GO:0055056, which is experimentally
      supported, is the appropriate core activity; the symporter claim is an over-specific
      mechanistic inference.
