suggested_questions:
- question: >-
    Does the full text of PMID:16418173 contain direct mannose uptake data, or only competition
    of mannose with glucose uptake? And does the vacuolar MstE-sGFP signal reflect endocytic
    turnover (for example after a shift to non-repressing carbon) rather than a vacuolar site
    of action?
- question: >-
    Should the family-root (PTN000627328) carbohydrate:proton symporter IBD be restricted to
    the proton-coupled clades, given that PTHR48022 contains facilitators such as yeast HXT1/HXT3
    and that the SF92 low-affinity transporters lack the TM1 acidic residue?
suggested_experiments:
- hypothesis: MstE is a low-affinity facilitated-diffusion glucose transporter rather than
    a proton symporter.
  description: >-
    Express mstE in an S. cerevisiae hxt-null strain. Measure [14C]glucose uptake kinetics
    with and without CCCP, and test a Ser67Asp substitution at the TM1 protonation-site
    position.
