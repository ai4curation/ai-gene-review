- id: PMID:16418173
  title: Identification of the mstE gene encoding a glucose-inducible, low affinity glucose
    transporter in Aspergillus nidulans.
  findings:
  - statement: MstE is the low-affinity glucose transporter active in conidia germinating on
      glucose.
    supporting_text: The mstE gene encoding a low affinity glucose transporter active during
      the germination of Aspergillus nidulans conidia on glucose medium has been identified
  - statement: mstE expression in hyphae is induced by repressing carbon sources and requires
      CreA.
    supporting_text: mstE expression also occurs in hyphae, is induced in the presence of other
      repressing carbon sources besides glucose, and is dependent on the function of the transcriptional
      repressor CreA
  - statement: MstE-sGFP localises to the cell periphery, consistent with the plasma membrane.
    supporting_text: fluorescence at the periphery of conidia and hyphae is consistent with
      MstE location in the plasma membrane
  - statement: Deleting mstE abolishes low-affinity glucose uptake without a morphological phenotype.
    supporting_text: Deletion of mstE has no morphological phenotype but results in the absence
      of low affinity glucose uptake kinetics, the latter being substituted by a high affinity
      system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary characterisation of MstE. The title and abstract were checked against the
      cached PubMed record. Only the abstract is cached; the full text (with kinetic constants,
      substrate competition and fusion-protein images) was not accessible, so the AspGD
      mannose and vacuole IDA rows could not be checked.
- id: PMID:24751997
  title: High-affinity glucose transport in Aspergillus nidulans is mediated by the products
    of two related but differentially expressed genes.
  findings:
  - statement: MstE is the established low-affinity glucose uptake system of A. nidulans; MstA
      and MstC are high-affinity paralogs.
    supporting_text: Until very recently, the only A. nidulans monosaccharide uptake system
      to have been characterised biochemically, physiologically and genetically was that of
      the low-affinity glucose transporter encoded by mstE - genomic locus AN5860
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Describes MstA/MstC; it is relevant here as context and for the
      Eurotiales phylogeny, which places MstE in its own group, distinct from MstA/MstC.
- id: PMID:24282591
  title: Identification of glucose transporters in Aspergillus nidulans.
  findings:
  - statement: The A. nidulans paralogs HxtB, HxtC and HxtE showed CCCP-sensitive glucose uptake
      in yeast, suggesting proton symport; MstE was not tested.
    supporting_text: Taken together, these data suggested that HxtB, HxtC, and HxtE mediated
      glucose transport via active proton symport.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Concerns paralogs in other PANTHER subfamilies. Cited only to show
      that the evidence for proton coupling in A. nidulans comes from paralogs, not from MstE.
- id: PMID:28361917
  title: The low affinity glucose transporter HxtB is also involved in glucose signalling
    and metabolism in Aspergillus nidulans.
  findings:
  - statement: mstE is among the most strongly down-regulated transporter genes in low glucose.
    supporting_text: Genes encoding the two transporters AtrA and MstE, presented the highest
      down-regulation
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. Transcriptomic context that agrees with glucose-induced mstE expression.
