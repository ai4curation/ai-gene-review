    label: plasma membrane
  supported_by:
  - reference_id: PMID:16418173
    supporting_text: The mstE gene encoding a low affinity glucose transporter active during
      the germination of Aspergillus nidulans conidia on glucose medium has been identified
  - reference_id: PMID:16418173
    supporting_text: Deletion of mstE has no morphological phenotype but results in the absence
      of low affinity glucose uptake kinetics, the latter being substituted by a high affinity
      system
  - reference_id: PMID:16418173
    supporting_text: fluorescence at the periphery of conidia and hyphae is consistent with
