id: Q5B0S0
gene_symbol: mstE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  MstE (AN5860) is a 562-residue sugar porter of the major facilitator superfamily, with
  twelve predicted transmembrane helices, that mediates the low-affinity component of
  D-glucose uptake in Aspergillus nidulans. It is active in conidia germinating on glucose
  and is also expressed in hyphae. Its expression is induced by glucose and other
  repressing carbon sources and depends on the carbon catabolite repressor CreA. An
  MstE-sGFP fusion is made under the same repressing conditions and localises to the cell
  periphery of conidia and hyphae, consistent with residence in the plasma membrane.
  Deleting mstE causes no morphological phenotype. It does abolish low-affinity glucose
  uptake kinetics, so that uptake becomes high-affinity and is carried by other
  transporters such as MstC/SorA. MstE is the A. nidulans member of PANTHER subfamily
  PTHR48022:SF92, a Pezizomycotina orthogroup that includes the low-affinity glucose
  transporter GLT-1 of Neurospora crassa. Whether MstE moves glucose by facilitated
  diffusion or by proton symport has not been determined, and its substrate range
  beyond glucose is not well defined.
