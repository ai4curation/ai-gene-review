- term:
    id: GO:0005773
    label: vacuole
  evidence_type: IDA
  original_reference_id: PMID:16418173
  qualifier: located_in
  review:
    summary: >-
      An AspGD IDA from the MstE-sGFP localisation study. The abstract (the only part
      cached) reports only cell-periphery (plasma membrane) fluorescence, so the vacuolar
      observation cannot be checked.
    action: UNDECIDED
    reason: >-
      The cached copy of PMID:16418173 is abstract-only, and the full text could not be
      retrieved (publisher and repository routes returned 403). The abstract describes
      MstE-sGFP fluorescence at the periphery of conidia and hyphae, consistent with the
      plasma membrane, and does not mention vacuoles. A vacuolar signal for a fungal
      plasma-membrane sugar transporter often reflects endocytic turnover and vacuolar
      degradation rather than a vacuolar site of action. Without the full text I cannot
      tell which applies here, and the curator saw data I cannot, so this row is neither
      overruled nor treated as a functional location. If it reflects turnover, it is not
      where MstE acts and would at most be non-core.
