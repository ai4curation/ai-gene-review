gene_symbol: avaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  Aspergillus nidulans avaA, also known as rabS, encodes the single Rab7/Ypt7
  small GTPase of the A. nidulans endovacuolar system. AvaA/RabS is recruited
  to late-endosomal and fungal-type vacuole membranes as a GTP/GDP molecular
  switch, where it promotes Rab5-to-Rab7 endosomal maturation, HOPS-dependent
  homotypic fusion of late endosomes and vacuoles, and direct fusion of
  autophagosomes with vacuoles during starvation autophagy.
