- term:
    id: GO:0061909
    label: autophagosome-lysosome fusion
  evidence_type: IMP
  original_reference_id: PMID:23722157
  qualifier: involved_in
  review:
    summary: >-
      Nitrogen-starved A. nidulans autophagosomes fuse directly with vacuoles in
      a RabS/Rab7-HOPS-dependent manner.
    action: NEW
    reason: >-
      Add GO:0061909 autophagosome-lysosome fusion, whose definition explicitly
      covers autophagosome fusion with the vacuole in fungi. This passes the
      process-participation test because AvaA/RabS is the late-endosomal and
      vacuolar Rab switch that recruits HOPS to mediate this fusion step, rather
      than a cargo or substrate delivered by autophagy. Cached human GO-CAMs use
      the same term for HOPS-dependent autophagosome-lysosome fusion driven by
      Rab G proteins in the same regulatory role.
    additional_reference_ids:
