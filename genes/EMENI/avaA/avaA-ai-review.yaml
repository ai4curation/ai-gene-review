- term:
    id: GO:0007032
    label: endosome organization
  evidence_type: IMP
  original_reference_id: PMID:22456509
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      rabS loss disrupts Rab5-to-Rab7 endosomal maturation and leaves
      RabA/RabB-positive, motile minivacuoles with residual early-endosomal
      identity.
    action: ACCEPT
    reason: >-
      Accept. AvaA/RabS executes this endosome-organization process as the Rab7
      switch that replaces RabA/RabB on maturing endosomes and recruits HOPS to
      late endosomes and vacuoles. Abenza et al. showed directly that RabA/RabB
      invade CMAC-positive minivacuoles in the absence of RabS.
    supported_by:
