      supporting_text: >-
        Without RabS(Rab7), early endosomal Rab5s-RabA and RabB-reach
        minivacuoles, in agreement with the view that Rab7 homologues facilitate
        the release of Rab5 homologues from endosomes.
      reference_section_type: ABSTRACT
