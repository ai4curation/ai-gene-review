suggested_questions:
- question: >-
    Does fungal MaiA share the mitochondrial (in addition to cytosolic) localization reported for mammalian
    GSTZ1, which underlies the PAINT mitochondrion IBA?
- question: >-
    Does MaiA have measurable glutathione-conjugating or dichloroacetate-dehalogenating activity like
    animal zeta-class GSTs, or is it a dedicated isomerase?
suggested_experiments:
- description: >-
    Localize a functional MaiA-GFP fusion, with mitochondrial co-staining, in phenylacetate-induced A.
    nidulans hyphae.
- description: >-
    Assay purified MaiA for GST activity with CDNB and for dichloroacetate dehalogenation, alongside MAAI
    kinetics.
