- term:
    id: GO:0004364
    label: glutathione transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0037696
  - FB:FBgn0037697
  - PANTHER:PTN001344486
  - UniProtKB:O43708
  - UniProtKB:P77544
  review:
    summary: >-
      Glutathione transferase activity inferred by PAINT at PTN001344486 (zeta-class GST/MAAI node), from
      fly GstZ, human GSTZ1 and E. coli sources.
    action: KEEP_AS_NON_CORE
    reason: >-
      MaiA is a zeta-class glutathione transferase family member and binds glutathione as cofactor; zeta-class
      enzymes (e.g. human GSTZ1) have measurable GST/dehalogenase-type activity besides the isomerase.
      Nothing in the A. nidulans literature tests or excludes conjugating activity for MaiA, and the PAINT
      node placement covers it without any evidence of loss, so the IBA is retained. It is not the physiological
      function: the only activity shown for MaiA, and the one whose loss gives the pathway phenotype,
      is glutathione-dependent cis-trans isomerization of maleylacetoacetate (PMID:9417084).
    supported_by:
    - reference_id: file:interpro/panther/PTHR42673/PTHR42673-paint.tsv
      supporting_text: "PTHR42673\tPTN001344486\tGO:0004364\tF\tIBD\tfalse"
    - reference_id: file:genes/EMENI/maiA/maiA-uniprot.txt
      supporting_text: 'SIMILARITY: Belongs to the GST superfamily. Zeta family.'
    - reference_id: PMID:9417084
      supporting_text: The MaiA protein shows strong amino acid sequence identity to glutathione 
        S-transferases and has MAAI activity when expressed in Escherichia coli.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR005955
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >-
      Cytoplasm, from InterPro and the UniProt subcellular-location vocabulary (UniProt: Cytoplasm, by
      similarity).
    action: ACCEPT
    reason: >-
      The homogentisate pathway enzymes are soluble cytoplasmic enzymes; UniProt assigns MaiA to the cytoplasm
      by similarity, and MaiA has no predicted targeting or transmembrane features. No direct localization
      experiment exists for A. nidulans MaiA, so cytoplasm (rather than the more specific cytosol) is
      the appropriate level.
    supported_by:
    - reference_id: file:genes/EMENI/maiA/maiA-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250}.'
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1341859
  - PANTHER:PTN000137159
  - RGD:1589363
  - UniProtKB:O43708
  review:
    summary: >-
      Mitochondrion (is_active_in) inferred at PAINT node PTN000137159 from mammalian GSTZ1 (human, mouse,
      rat) data.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mitochondrial localization of zeta-class GST has been reported only for mammalian GSTZ1, and these
      mammalian proteins are the only sources of the IBD. In mammals the mitochondrial matrix pool is a minor
      fraction alongside the predominant cytosolic enzyme, and it is the cytosolic pool that carries out
      homogentisate-pathway isomerization. I found no localization data for A. nidulans MaiA or other fungal
      MAAIs, UniProt places it in the cytoplasm by similarity, and the protein has no predicted targeting features. Extending a
      minor, mammal-documented mitochondrial pool to the fungal enzyme is therefore more than the evidence
      supports; the row is kept as a likely over-annotation rather than removed, because a mitochondrial
      fraction has not been tested and excluded.
    supported_by:
    - reference_id: file:genes/EMENI/maiA/maiA-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250}.'
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000137159
        source_label: PTN000137159
        source_status: UNRESOLVED
        comment: >-
          IBD sources are mammalian GSTZ1 only (human O43708, mouse, rat). No fungal MAAI localization
          data exist to confirm or refute inheritance of mitochondrial localization by A. nidulans MaiA.
      residue_claims_not_applicable: Subcellular localization question, not a point-residue 
        argument.
