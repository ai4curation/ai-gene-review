- term:
    id: GO:0006749
    label: glutathione metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0037696
  - FB:FBgn0037697
  - PANTHER:PTN001344486
  - UniProtKB:O43708
  review:
    summary: >-
      Glutathione metabolic process inferred at PTN001344486 from fly GstZ and human GSTZ1 sources.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MaiA uses glutathione as a non-consumed cofactor for the cis-trans isomerization of maleylacetoacetate;
      it does not synthesise, degrade or otherwise metabolise glutathione as part of its demonstrated
      function (PMID:9417084). The process term probably reflects conjugating (GST) activity of animal
      zeta-class enzymes rather than the isomerase role, and there is no evidence that MaiA participates
      in glutathione metabolism in A. nidulans. Retained as an over-annotation rather than removed because
      it rests on a PAINT node placement that has not been shown to be wrong for fungi.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001344486
        source_label: PTN001344486
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node sources are fly GstZ1/GstZ2 and human GSTZ1 glutathione-related annotations; for MaiA glutathione
          is a cofactor of the isomerase, not a metabolite it processes.
      residue_claims_not_applicable: Process-scope question about cofactor use versus glutathione 
        metabolism, not a residue argument.
    supported_by:
    - reference_id: file:genes/EMENI/maiA/maiA-uniprot.txt
      supporting_text: Name=glutathione; Xref=ChEBI:CHEBI:57925;
    - reference_id: PMID:9417084
      supporting_text: The MaiA protein shows strong amino acid sequence identity to glutathione 
        S-transferases and has MAAI activity when expressed in Escherichia coli.
