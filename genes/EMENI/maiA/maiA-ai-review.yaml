id: O43123
gene_symbol: maiA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  maiA encodes maleylacetoacetate isomerase (MaiA, EC 5.2.1.2) of Aspergillus nidulans, a 230-residue
  zeta-class glutathione S-transferase family enzyme that uses glutathione as a cofactor to isomerize
  4-maleylacetoacetate (cis) to 4-fumarylacetoacetate (trans). It catalyses the middle step of the three-enzyme
  homogentisate branch of phenylalanine and phenylacetate catabolism, between homogentisate dioxygenase
  (HmgA) and fumarylacetoacetase (FahA), whose genes are clustered with maiA. maiA is induced by phenylalanine
  or phenylacetate; disruption abolishes MAAI activity, prevents growth on these carbon sources, causes
  phenylalanine toxicity and leads to secretion of 2,4-dioxohept-2-enoic acid isomers rather than succinylacetone.
  MaiA was the first MAAI gene characterized in any organism and led to identification of human GSTZ1
  as the MAAI. It is predicted to be cytoplasmic.
