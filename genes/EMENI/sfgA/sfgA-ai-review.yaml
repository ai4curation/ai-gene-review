- id: PMID:16387865
  title: FluG-dependent asexual development in Aspergillus nidulans occurs via derepression.
  findings:
  - statement: sfgA was identified as a suppressor of fluG and encodes a Gal4-type Zn(II)2Cys6 binuclear
      cluster DNA-binding protein.
    supporting_text: Suppressor analyses of fluG led to the identification of the sfgA gene encoding a
      novel protein with the Gal4-type Zn(II) 2 Cys 6 binuclear cluster DNA-binding motif at the N terminus.
  - statement: SfgA imposes the repression of conidiation that FluG signalling removes; sfgA deletion
      bypasses the requirement for fluG.
    supporting_text: indicating that the primary role of FluG is to remove repressive effects imposed
      by SfgA
  - statement: SfgA acts downstream of FluG and upstream of the FlbD/FlbC/FlbB/BrlA activators.
    supporting_text: Genetic analyses demonstrated that SfgA functions downstream of FluG but upstream
      of transcriptional activators (FlbD, FlbC, FlbB, and BrlA) necessary for normal conidiation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The defining primary characterization of sfgA (Seo, Guan & Yu, Genetics 2006), cited
      in the gene's own UniProt record at sfgA-uniprot.txt:19-23. Full text cached; establishes SfgA as
      the repressor whose removal underlies FluG-dependent conidiation.
