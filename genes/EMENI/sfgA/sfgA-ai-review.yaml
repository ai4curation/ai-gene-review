- term:
    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: Direction-specific term contradicted by the characterized biology; SfgA is a repressor,
      not an activator.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is an IEA:TreeGrafter propagation from the PTHR37534 zinc-cluster family (whose named
      member is the transcriptional *activator* Uga3), not an SfgA-specific inference. The primary
      characterization of sfgA shows the opposite direction - loss of sfgA bypasses fluG and derepresses
      conidiation, and sfgA overexpression inhibits it - so a positive-regulation term over-propagates
      the family's activator role onto a repressor. The direction-neutral GO:0006355 already retained
      here covers what is safely supportable; if a directional MF is wanted, GO:0001227 (DNA-binding
      transcription repressor activity, RNA polymerase II-specific) would be the correctly signed term.
    supported_by:
    - reference_id: PMID:16387865
      supporting_text: In accordance with the proposed regulatory role of SfgA, overexpression of sfgA
        inhibited conidiation and delayed/reduced expression of conidiation- and ST-specific genes.
- term:
    id: GO:0075308
    label: negative regulation of conidium formation
  evidence_type: IMP
  original_reference_id: PMID:16387865
  qualifier: acts_upstream_of_or_within
  review:
    summary: Proposed new annotation. The characterized role of SfgA - the one thing GOA does not capture
      - is repression of conidiation; deletion and 31 other loss-of-function sfgA alleles bypass the
      requirement for fluG in conidiation, and sfgA overexpression inhibits it.
    action: NEW
    reason: GOA holds only electronic, generic zinc-cluster transcription-factor terms for SfgA. This
      IMP-supported directional process term is the term the primary literature establishes, and it is
      already used for the other conidiation repressors in this module (velB, sfaD).
    supported_by:
    - reference_id: PMID:16387865
      supporting_text: Deletion (Δ) and 31 other loss-of-function sfgA mutations bypassed the need for
        fluG in conidiation and production of ST.
    - reference_id: PMID:16387865
      supporting_text: In accordance with the proposed regulatory role of SfgA, overexpression of sfgA
        inhibited conidiation and delayed/reduced expression of conidiation- and ST-specific genes.
