taxon:
  id: NCBITaxon:162425
  label: Emericella nidulans
description: sfgA (suppressor of fluG) encodes a nuclear Gal4-type Zn(II)2Cys6 binuclear-cluster DNA-binding
  protein that acts as a negative regulator of asexual sporulation (conidiation) and sterigmatocystin
  production in Aspergillus nidulans. Loss-of-function sfgA mutations bypass the requirement for fluG in
  both processes, and overexpression of sfgA inhibits conidiation and delays conidiation- and ST-specific
  gene expression, showing that FluG acts by removing SfgA-imposed repression rather than by direct
  activation. Genetically SfgA functions downstream of FluG and upstream of the transcriptional activators
  FlbD, FlbC, FlbB and BrlA that drive normal conidiophore development.
