- id: PMID:23722157
  title: 'Live-cell imaging of Aspergillus nidulans autophagy: RAB1 dependence,
    Golgi independence and ER involvement.'
  findings:
  - statement: >-
      In nitrogen-starved A. nidulans hyphae, GFP-Atg8-positive PAS puncta
      mature into phagophores and spherical autophagosomes.
    supporting_text: >-
      Initially, GFP-Atg8 puncta give rise to expanding phagophores engulfing a
      portion of cytoplasm.
    reference_section_type: RESULTS
  - statement: >-
      A. nidulans Atg8 puncta colocalize with Atg9 and mark the phagophore
      assembly site.
    supporting_text: Atg8 puncta correspond to the PAS
    reference_section_type: RESULTS
  - statement: >-
      GFP-Atg8 partial proteolysis records autophagic delivery to the vacuole.
    supporting_text: >-
      GFP accumulation following vacuolar GFP-Atg8 proteolysis is a bona fide
      indicator of autophagy.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text PMC cache. This is the direct A. nidulans GFP-Atg8 live-cell
      study underlying the experimental preautophagosomal-structure and
      autophagosome localization rows.
- id: PMID:26296599
  title: Distinct roles for the p53-like transcription factor XprG and autophagy
    genes in the response to starvation.
  findings:
  - statement: >-
      The A. nidulans atgH/ATG8 ortholog was assayed with ATG1 in starvation
      experiments, and loss of atgH reduced conidiation under limiting nitrogen
      or carbon.
    supporting_text: >-
      Compared to wild-type strains and the xprGΔ and xprG1 mutants, conidiation
      of the autophagy mutants was reduced in carbon- or nitrogen-limiting
      conditions but not during growth on nutrient-sufficient medium.
    reference_section_type: ABSTRACT
  - statement: >-
      GFP-AtgH vacuolar accumulation was blocked in atgA/ATG1 mutants,
      confirming the autophagy assay used for A. nidulans Atg8 under starvation.
    supporting_text: prevented vacuolar accumulation of GFP-AtgH
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified abstract-only cache. The visible abstract directly names
      atgH as the A. nidulans ATG8 ortholog and supports an ATG8-related role
      during starvation, but the full paper would be needed for row-level
      mutation details.
- id: PMID:40860045
  title: During Aspergillus nidulans nitrogen-limited biofilm formation, mitophagy
    is independent of mitochondrial fission.
  findings:
  - statement: >-
      GFP-Atg8/Tom20 live imaging showed that A. nidulans founder biofilm cells
      induce mitophagy under nitrogen-limiting conditions.
    supporting_text: >-
      The data confirm the accumulation of GFP-Atg8 and Tom20-mRFP signals in
      vacuoles results from autophagy/mitophagy during biofilm development in
      nitrogen-limiting media.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified 2025 paper. It corroborates mitophagy in A. nidulans
      using GFP-Atg8 as the autophagy marker, but it does not define a new
      Atg8-specific molecular activity.
- id: PMID:42483769
  title: A subcomplex comprising TRAPPC11, TRAPPC12, TRAPPC13 and the fungal TRAPPC2L
    homolog, Tca17, directs TRAPPIII to autophagy.
  findings:
  - statement: >-
      TRAPPC11/12/13 act upstream of Atg8-positive PAS structures in the
      A. nidulans TRAPPIII autophagy pathway.
    supporting_text: >-
      TRAPPC11 and TRAPPC12 localize to pre-autophagosomes and their ablation
      impairs autophagy.
    reference_section_type: ABSTRACT
  - statement: >-
      New A. nidulans TRAPPIII work continued to use Atg8 as the PAS marker for
      autophagosome biogenesis.
    supporting_text: these puncta colocalized with the prototypic PAS marker Atg8
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified 2026 paper. The work refines upstream TRAPPIII
      recruitment of A. nidulans autophagy and confirms Atg8-positive PAS
      localization, but it does not require additional Atg8 GO terms.
