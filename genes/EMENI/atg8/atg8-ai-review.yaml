id: Q5B2U9
gene_symbol: atg8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  Aspergillus nidulans atg8 encodes a conserved Atg8-family ubiquitin-like
  modifier that is processed to expose its C-terminal glycine and conjugated to
  phosphatidylethanolamine on phagophore and autophagosome membranes. GFP-Atg8
  marks A. nidulans phagophore assembly sites, expanding phagophores,
  autophagosomes and autophagic delivery to the vacuole during nitrogen
  starvation; its inherited Atg8-family activity supports autophagosome
  assembly, autophagosome maturation, starvation-induced autophagy and selective
  autophagy, including mitophagy.
