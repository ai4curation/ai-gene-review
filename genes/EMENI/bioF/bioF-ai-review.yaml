id: C8V1D1
gene_symbol: bioF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  BioF (AON synthase / KAPA synthase; EC 2.3.1.47) of Aspergillus nidulans is
  the fungal 8-amino-7-oxononanoate synthase, a pyridoxal 5'-phosphate
  (PLP)-dependent class-II aminotransferase-fold enzyme. It catalyses the
  decarboxylative condensation of a pimeloyl thioester with L-alanine to give
  (8S)-8-amino-7-oxononanoate (KAPA), the first committed step of biotin ring
  assembly. Unlike its bacterial counterparts, A. nidulans BioF carries a type-1
  peroxisomal targeting signal and is a peroxisomal enzyme; its peroxisomal
  localisation is essential for biotin synthesis, consistent with the use of
  pimeloyl-CoA generated by peroxisomal beta-oxidation. The gene is part of the
  A. nidulans biotin biosynthetic gene cluster.
