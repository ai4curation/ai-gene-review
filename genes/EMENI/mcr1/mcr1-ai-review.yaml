- term:
    id: GO:0006696
    label: ergosterol biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000452208
  - SGD:S000001633
  review:
    summary: >-
      PTN000452208 propagates an inherited S. cerevisiae MCR1
      ergosterol-biosynthesis assertion, but no A. nidulans evidence
      currently makes the process a core mcr1 function.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT assertion comes from an S. cerevisiae MCR1 seed and A.
      nidulans mcr1 is in the same MCR1-like branch, so the IBA is retained as
      an in-clade inherited process annotation. It is not promoted to a core A.
      nidulans mcr1 function here because mcr1 has not been assayed in A.
      nidulans, and the available CYP51 reconstitution evidence used the
      microsomal cytochrome-b5/NADH-cytochrome-b5-reductase system that
      corresponds to the ER CBR1 paralog branch rather than this mitochondrial
      MCR1 branch.
    supported_by:
    - reference_id: file:interpro/panther/PTHR19370/PTHR19370-paint.tsv
      supporting_text: "PTHR19370\tPTN000452208\tGO:0006696\tP\tIBD\tfalse"
