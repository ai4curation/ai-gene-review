  label: Aspergillus nidulans FGSC A4
description: >-
  Aspergillus nidulans mcr1 encodes the MCR1-like member of the fungal
  NADH-cytochrome b5 reductase family. The protein has the conserved
  cytochrome-b5 reductase FAD- and NADH-binding regions and a predicted
  N-terminal transmembrane segment, and is inferred to act as a mitochondrial
  NADH-dependent cytochrome-b5 reductase.
core_functions:
- description: >-
    Predicted FAD-dependent reduction of ferricytochrome b5 using NADH as
    electron donor in a mitochondrial MCR1-clade protein.
