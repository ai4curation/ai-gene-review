- term:
    id: GO:0035658
    label: Mon1-Ccz1 complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0031640
  - PANTHER:PTN000315023
  - SGD:S000003092
  - UniProtKB:Q7L1V2
  - UniProtKB:Q86VX9
  - WB:WBGene00018321
  review:
    summary: >-
      The Opisthokonta PTN000315023 PAINT node supports inheritance of
      Mon1-Ccz1 complex membership by fungal Mon1 proteins including
      A. nidulans Q5BBI7.
    action: ACCEPT
    reason: >-
      Accept. Mon1 is the defining partner of Ccz1 in the Rab7/Ypt7 GEF
      complex, and this PAINT node has experimental descendants across
      opisthokonts. Standard searches have not recovered a canonical Ccz1
      ortholog in several filamentous ascomycetes, including Aspergillus spp.,
      so this conserved complex assertion remains appropriate but should still
      be read as inferred rather than directly tested for A. nidulans MonA.
    additional_reference_ids:
    - PMID:12364329
    - PMID:32010467
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: >-
        Subcellular fractionation and co-immunoprecipitation experiments confirm
        that Mon1 and Ccz1 physically interact as a stable protein complex
        termed the Ccz1-Mon1 complex.
    - reference_id: PMID:32010467
      supporting_text: >-
        However, the Ccz1 orthologs could not be found in the genome database
        of several filamentous fungi including Fusarium spp., Aspergillus spp.,
        and Penecillium spp
    propagation_review:
