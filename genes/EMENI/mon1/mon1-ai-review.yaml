  supporting_entities:
  - PANTHER:PTN000989606
  - SGD:S000003092
  review:
    summary: >-
      Q5BBI7 is an intact PTHR13027:SF7 fungal Mon1 homolog, and PAINT places
      the fungal-type vacuole membrane annotation at the fungal PTN000989606
      ancestor with S. cerevisiae MON1 as the experimental seed.
    action: ACCEPT
    reason: >-
      Accept. This IBA follows a curated fungal PAINT node rather than a
      pairwise Aspergillus-to-yeast transfer. The placement agrees with the
      Q5BBI7 PANTHER subfamily classification, direct S. cerevisiae evidence
      that Mon1-Ccz1 localizes to a perivacuolar/vacuolar compartment, and the
      A. nidulans monA deletion vacuole-morphology phenotype.
    additional_reference_ids:
    - PMID:12364329
    - PMID:32010467
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: >-
        Microscopy of Ccz1 and Mon1 tagged with a fluorescent marker indicated
        that the Ccz1-Mon1 complex peripherally associated with a perivacuolar
        compartment and may attach to the vacuole membrane in agreement with
        their proposed function in fusion.
    - reference_id: PMID:32010467
      supporting_text: >-
        the absence of monA affected vacuole morphology in both species
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
