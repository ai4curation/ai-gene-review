- id: PMID:12364329
  title: The Ccz1-Mon1 protein complex is required for the late step of multiple
    vacuole delivery pathways.
  findings:
  - statement: >-
      S. cerevisiae Mon1 and Ccz1 physically interact in a stable complex and
      are required after vesicle formation for multiple delivery routes to the
      vacuole.
    supporting_text: >-
      Subcellular fractionation and co-immunoprecipitation experiments confirm
      that Mon1 and Ccz1 physically interact as a stable protein complex termed
      the Ccz1-Mon1 complex.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      S. cerevisiae mon1 and ccz1 deletion strains have defects in Cvt,
      autophagy, pexophagy, CPY, ALP, and MVB cargo delivery to the vacuole.
    supporting_text: >-
      Accordingly, both deletion strains had kinetic defects in the biosynthetic
      delivery of resident vacuolar hydrolases through the CPY, ALP, and MVB
      pathways.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified direct S. cerevisiae Mon1/Ccz1 study; it is the SGD seed
      behind the fungal PTN000989606 PAINT placement.
- id: PMID:24413168
  title: The Mon1-Ccz1 GEF activates the Rab7 GTPase Ypt7 via a longin-fold-Rab
    interface and association with PI3P-positive membranes.
  findings:
  - statement: >-
      S. cerevisiae Mon1-Ccz1 requires longin-domain residues from both subunits
      for Rab7/Ypt7 guanyl-nucleotide exchange factor activity.
    supporting_text: >-
      Mon1-Ccz1 activity requires residues within the predicted longin domains
      of both subunits
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cached mechanistic study of the Mon1-Ccz1 complex's contributed
      GEF activity; used as biochemical support for the broad PTN000315021
      PAINT assignment.
- id: PMID:26657788
  title: FgMon1, a guanine nucleotide exchange factor of FgRab7, is important for
    vacuole fusion, autophagy and plant infection in Fusarium graminearum.
  findings:
  - statement: >-
      Fusarium FgMon1 directly interacts with FgRab7, and activated FgRab7 can
      rescue Fgmon1 deletion defects.
    supporting_text: >-
      constitutively activated FgRab7 could rescue the defects of the ΔFgmon1
      mutant, indicating that FgMon1 likely is a GEF of FgRab7
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  - statement: >-
      Fusarium FgMon1 is required for autophagosome-vacuole fusion.
    supporting_text: >-
      We concluded that the fusion of autophagosomes and vacuoles was impaired
      in the ΔFgmon1 mutant.
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text cached filamentous-ascomycete ortholog study; supports
      conservation of Mon1 vacuole-fusion, Rab7, and autophagy biology but does
      not directly assay A. nidulans Q5BBI7.
- id: PMID:32010467
  title: Conserved Roles of MonA in Fungal Growth and Development in Aspergillus
    Species.
  findings:
  - statement: >-
      A. nidulans AN2093 encodes the MonA ortholog of Mon1.
    supporting_text: >-
      The AnimonA gene (AN2093) encodes a 635-amino acid protein and AflmonA
      (AFLA_035140) gene encodes a 630-amino acid protein
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      Deleting monA in A. nidulans and A. flavus disrupts vacuole morphology.
    supporting_text: >-
      the absence of monA affected vacuole morphology in both species
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      Canonical Ccz1 orthologs were not detected in several filamentous-fungal
      genomes by the searches reported in this study.
    supporting_text: >-
      However, the Ccz1 orthologs could not be found in the genome database of
      several filamentous fungi including Fusarium spp., Aspergillus spp., and
      Penecillium spp
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified direct MonA deletion study in A. nidulans and A. flavus;
      the developmental, viability, and heat-sensitivity phenotypes are tracked
      as downstream consequences rather than separate GO assertions here.
