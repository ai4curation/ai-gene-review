core_functions:
- description: >-
    Contributes to Mon1-Ccz1 Rab7/Ypt7 guanine-nucleotide exchange factor
    activity on endosomal and fungal-type vacuole membranes to promote fusion of
    protein-delivery and autophagy-related vesicles with the vacuole.
  contributes_to_molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0006623
    label: protein targeting to vacuole
  - id: GO:0006914
    label: autophagy
  locations:
  - id: GO:0000329
    label: fungal-type vacuole membrane
  in_complex:
    id: GO:0035658
    label: Mon1-Ccz1 complex
  supported_by:
  - reference_id: PMID:12364329
    supporting_text: >-
      Mon1 and Ccz1 were identified from a gene deletion library as mutants
      defective in the vacuolar import of aminopeptidase I (Ape1) via the
      cytoplasm to vacuole targeting (Cvt) pathway.
  - reference_id: PMID:32010467
    supporting_text: >-
      the absence of monA affected vacuole morphology in both species
suggested_questions:
- question: >-
    Which diverged A. nidulans protein, if any, is the Ccz1 partner for MonA in
    a Mon1-Ccz1-like Rab7/Ypt7 GEF complex?
- question: >-
    Has A. nidulans MonA been directly localized at endosomes, MVBs, or
    fungal-type vacuole membranes, or are all current localization statements
    inferred from characterized orthologs?
suggested_experiments:
- description: >-
    Endogenously tag A. nidulans MonA and compare its localization with vacuole,
    multivesicular body, and Rab7 markers during vegetative growth and
    starvation-induced autophagy.
- description: >-
    Identify the A. nidulans MonA partner by affinity purification or
    proximity-labeling mass spectrometry, then test whether candidate partners
    are required with MonA for Rab7/Ypt7 activation and autophagosome-vacuole
    fusion.
