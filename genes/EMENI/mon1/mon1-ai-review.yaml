        source_status: SUPPORTS_TRANSFER
        comment: >-
          Opisthokonta PAINT node with experimental descendants from fungi,
          animals, and nematode; it covers A. nidulans Q5BBI7 as a fungal
          Mon1/SAND-family member, although direct Ccz1-partner validation is
          still missing in Aspergillus.
- term:
    id: GO:0006914
    label: autophagy
  evidence_type: ISS
  review:
    summary: >-
      Propose autophagy as a conserved route that uses the fungal
      Mon1-Ccz1/Ypt7 fusion module.
    action: NEW
    reason: >-
      Add a conservative ISS annotation. A. nidulans mon1 has no direct
      autophagy assay, but S. cerevisiae MON1 is experimentally required for
      autophagy, Fusarium FgMon1 is needed for autophagosome-vacuole fusion,
      and A. nidulans Q5BBI7 is a fungal Mon1 subfamily member with direct
      Aspergillus support for a conserved vacuolar role.
    additional_reference_ids:
    - PMID:12364329
    - PMID:26657788
    - PMID:32010467
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: >-
        The mon1Delta and ccz1Delta strains also displayed defects in autophagy
        and pexophagy, degradative pathways that share protein machinery and
        mechanistic features with the biosynthetic Cvt pathway.
    - reference_id: PMID:26657788
      supporting_text: >-
        We concluded that the fusion of autophagosomes and vacuoles was
        impaired in the ΔFgmon1 mutant.
