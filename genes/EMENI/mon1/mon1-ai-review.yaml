  review:
    summary: >-
      Endosomal and MVB membrane association is plausible for Q5BBI7, but this
      SubCell-derived row is inferred from characterized orthologs rather than
      demonstrated directly in A. nidulans.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. Yeast Mon1-Ccz1 localizes at perivacuolar
