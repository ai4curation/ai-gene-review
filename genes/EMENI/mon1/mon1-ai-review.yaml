id: Q5BBI7
gene_symbol: mon1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  Aspergillus nidulans mon1 encodes the MonA ortholog of the conserved fungal
  Mon1/SAND-family trafficking protein. MonA is inferred to act as the Mon1
  subunit of a Rab7/Ypt7-directed Mon1-Ccz1 guanyl-nucleotide exchange factor
  module on endosomal and fungal-type vacuole membranes, and A. nidulans monA
  deletion disrupts vacuole morphology, vegetative growth, conidiation,
  cleistothecium formation, conidial viability, and heat tolerance.
