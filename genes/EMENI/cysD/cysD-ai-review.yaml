  review:
    summary: cysD has real O-acetylserine sulfhydrylase activity in vitro, but this 2023 IBA appears stale because
      the current PTN002887184 node no longer asserts GO:0004124.
    action: KEEP_AS_NON_CORE
    reason: A. nidulans cysD can catalyze cysteine-synthase chemistry in vitro, so the MF claim is defensible as
      a secondary activity. It should not be treated as a core cysD function or as evidence for cysD in cysteine
      biosynthesis, because the 2007 mutant study found cysB to be the only cysteine synthase of physiological importance,
