id: P50125
gene_symbol: cysD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: cysD encodes a cytoplasmic, PLP-dependent homocysteine synthase/O-acetylhomoserine
  sulfhydrylase in Aspergillus nidulans. The enzyme catalyzes direct sulfhydrylation
  of O-acetyl-L-homoserine to L-homocysteine and can also use methanethiol to form
  L-methionine, linking sulfur assimilation with methionine synthesis and probable
  methylthioadenosine sulfur recycling. CysD has O-acetylserine sulfhydrylase/cysteine
  synthase activity in vitro, but genetic analysis identifies CysB rather than CysD
  as the cysteine synthase of physiological importance in this fungus.
