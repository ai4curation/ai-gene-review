  label: Aspergillus nidulans FGSC A4
description: >-
  fahA encodes fumarylacetoacetase (fumarylacetoacetate hydrolase, FahA, EC 3.7.1.2) of Aspergillus nidulans,
  a 431-residue FAH-family enzyme, predicted to use Ca(2+) and Mg(2+) cofactors, that hydrolyses 4-fumarylacetoacetate
  to fumarate and acetoacetate. This is the terminal step of the homogentisate branch shared by phenylalanine,
  phenylacetate and tyrosine catabolism, and fahA is clustered with hmgA and maiA, which encode the two
  preceding enzymes. fahA is induced by phenylacetate and its hydroxylated derivatives, phenylalanine
  and tyrosine, and partially repressed by glucose. Disruption of fahA causes phenylalanine toxicity and
  secretion of succinylacetone, a fungal model of human hereditary tyrosinaemia type I; this toxicity
  is suppressed by loss of homogentisate dioxygenase. FahA is 47% identical to human FAH.
