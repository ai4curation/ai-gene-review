suggested_questions:
- question: >-
    Is the Ca(2+)/Mg(2+) cofactor usage and homodimeric structure of mammalian FAH conserved in FahA,
    as inferred by similarity?
- question: >-
    What is the subcellular location of FahA in A. nidulans (cytosolic, as for human FAH)?
suggested_experiments:
- description: >-
    Purify recombinant FahA and determine kinetic parameters and metal dependence for 4-fumarylacetoacetate
    hydrolysis.
- description: >-
    Test growth and succinylacetone secretion of fahA deletion strains on L-tyrosine to confirm the tyrosine-catabolism
    role directly.
