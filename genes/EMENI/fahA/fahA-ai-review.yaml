- id: PMID:7568087
  title: Fungal metabolic model for human type I hereditary tyrosinaemia.
  findings:
  - statement: >-
      fahA disruption causes succinylacetone secretion and phenylalanine toxicity, modelling human type
      I tyrosinaemia.
    supporting_text: fahA disruption results in secretion of succinylacetone (a diagnostic compound 
      for human type I tyrosinaemia) and phenylalanine toxicity.
  - statement: >-
      Suppressor mutations show that loss of homogentisate dioxygenase prevents the effects of Fah deficiency,
      placing HmgA upstream of FahA.
    supporting_text: Analysis of a class of these mutations demonstrates that loss of homogentisate 
      dioxygenase (leading to alkaptonuria in humans) prevents the effects of a Fah deficiency.
  - statement: FahA is 47.1% identical to human FAH.
    supporting_text: fahA, the gene encoding Fah in the fungus Aspergillus nidulans, encodes a 
      polypeptide showing 47.1% identity to its human homologue
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Fernandez-Canon & Penalva 1995 PNAS (DOI 10.1073/pnas.92.20.9132), cited by UniProt Q00770 for the
      catalytic activity. Abstract-only in cache (PMC40938 full text restricted).
- id: PMID:9417084
  title: Characterization of a fungal maleylacetoacetate isomerase gene and identification of its 
    human homologue.
  findings:
  - statement: >-
      Recombinant MaiA has maleylacetoacetate isomerase activity; MaiA is a GST-family protein.
    supporting_text: The MaiA protein shows strong amino acid sequence identity to glutathione 
      S-transferases and has MAAI activity when expressed in Escherichia coli.
  - statement: >-
      maiA disruption abolishes MAAI activity and growth on phenylalanine/phenylacetate and causes phenylalanine
      toxicity.
    supporting_text: maiA disruption prevents growth on phenylalanine (Phe) and phenylacetate and 
      results in the absence of MAAI activity in vitro and Phe toxicity.
  - statement: >-
      maiA, fahA and hmgA are clustered and encode the enzymes of the common part of the Phe/phenylacetate
      pathways.
    supporting_text: maiA is clustered with fahA and hmgA, the genes encoding the two other enzymes 
      of the common part of the Phe/phenylacetate pathways.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Fernandez-Canon & Penalva 1998 J Biol Chem (DOI 10.1074/jbc.273.1.329), cited by UniProt O43123
      and Q00770. First MAAI gene from any organism. Abstract-only in cache.
