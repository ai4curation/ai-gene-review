- term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:24391470
  review:
    summary: VosA binds a defined promoter motif (CTGGCCaaGGC) in target-gene promoters
      such as brlA, and its loss alters expression of those targets.
    action: NEW
    reason: ChIP-chip, motif discovery and EMSA (including binding-site deletion and
      DNA-contact mutants) show sequence-specific DNA binding by the VosA velvet domain,
      and vosA deletion changes transcript levels of the bound target genes. This supports
      the core MF already asserted in core_functions, which otherwise has no supporting
      annotation row. The characterised targets (brlA, nsdD, cteA and others) are
      protein-coding RNA polymerase II genes, so the Pol II-specific term is used.
    supported_by:
    - reference_id: PMID:24391470
      supporting_text: The DNA binding activity of the mutated VosA1–190 proteins was
        tested by an EMSA with the 35 bp fragment of the brlAβ promoter containing the
        VosA binding motifs (Figure 4) and additionally with the same brlAβ promoter
        fragment with deleted VosA binding motifs 1 and 2 (Figure S10), verifying the
        importance of both motifs in VosA-DNA interaction.
    - reference_id: PMID:24391470
      supporting_text: Deletion of velB, similar to deletion of vosA, caused reduced
        accumulation of AN8694, nsdD, AN5371, cteA, AN6508, and AN5709 mRNAs, but increased
        transcript levels of brlA, treA AN8741, and rfeG
