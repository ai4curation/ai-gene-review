id: O74689
gene_symbol: nudE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Emericella nidulans (strain FGSC A4 / ATCC 38163 / CBS 112.46 / NRRL 194 / M139)
description: NudE is the Aspergillus nidulans member of the NudE/NUDEL family (homolog of Neurospora RO11,
  budding-yeast Ndl1 and animal NDE1/NDEL1), a 586-residue protein with a conserved N-terminal coiled-coil
  domain and a divergent C-terminal region. It was isolated as a multicopy suppressor of a nudF (LIS1)
  mutation. The N-terminal coiled coil binds NudF and is sufficient for NudE function, whereas the C-terminal
  domain targets NudE to microtubule plus-end comets but is dispensable. Deletion of nudE is viable but
  impairs nuclear distribution along hyphae, colony growth and conidiation, and overproduction of NudF
  fully suppresses the deletion, indicating that NudE acts by supporting NudF. NudE, like NudF, is required
  for cargo-adapter (HookA)-mediated activation of cytoplasmic dynein and for retrograde transport of
  early endosomes from the hyphal tip, and dynein mutations that open the autoinhibited phi conformation
  partly bypass its loss. Together with the CLIP-170 homolog ClipA, NudE contributes to recruiting NudF
  to microtubule plus ends.
