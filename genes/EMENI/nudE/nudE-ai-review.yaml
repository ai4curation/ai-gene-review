suggested_questions:
- question: Does A. nidulans NudE bind dynein directly (as mammalian NDE1/NDEL1 bind dynein intermediate
    chain), or does it act solely by recruiting or stabilizing NudF on dynein? The only report of direct
    NudE-dynein subunit binding in A. nidulans was retracted.
  experts:
  - Aspergillus cell biologists
  - dynein biochemists
suggested_experiments:
- description: Test binding of purified A. nidulans NudE coiled coil to dynein intermediate chain (NudI)
    and assess whether a NudE variant unable to bind dynein but able to bind NudF complements the nudE
    deletion.
  hypothesis: NudE function requires dynein binding in addition to NudF binding.
  experiment_type: biochemistry and genetic complementation
