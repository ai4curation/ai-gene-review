- term:
    id: GO:0140659
    label: cytoskeletal motor regulator activity
  evidence_type: IMP
  original_reference_id: PMID:31562232
  review:
    summary: NudE is required for HookA-mediated dynein activation; phi-opening dynein mutations partially
      bypass its loss.
    action: NEW
    reason: 'NudE acts with NudF on the dynein motor: without NudE, adapter-driven dynein relocation to
      minus ends fails, and this is partially rescued by dynein mutations that prevent autoinhibition,
      placing NudE at the same regulatory step as NudF. Matches the module''s NudE-family function (GO:0140659)
      and the human NDEL1 review. Direct binding of A. nidulans NudE to dynein has not been validly shown
      (the only report, PMID:11509576, was retracted), so the regulation may be exerted through NudF.'
    supported_by:
    - reference_id: PMID:31562232
      supporting_text: Thus, just like NudF/LIS1, NudE is also required for cargo-adapter–mediated dynein
        activation.
    - reference_id: PMID:31562232
      supporting_text: Astonishingly, the requirement for LIS1 or NudE can be bypassed to a significant
        extent by mutations that prohibit dynein from forming an autoinhibited conformation
