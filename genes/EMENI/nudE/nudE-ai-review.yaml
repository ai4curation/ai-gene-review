  review:
    summary: PAINT IBA from human NDE1.
    action: KEEP_AS_NON_CORE
    reason: NudE-family proteins regulate cortical dynein in spindle orientation in animal cells, and
      inheritance through the family node is reasonable for a conserved LIS1-binding dynein regulator.
      In A. nidulans, however, the characterized nudE phenotype is nuclear distribution in hyphae, and
      spindle orientation has not been assayed, so this is kept as a non-core inherited function.
    supported_by:
    - reference_id: PMID:10931877
      supporting_text: The nudE null mutant was viable, but displayed impaired nuclear migration, reduced
        colony growth, and a conidiation defect.
- term:
    id: GO:0000776
    label: kinetochore
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0036059
  - PANTHER:PTN000100519
  - UniProtKB:Q9GZM8
  - UniProtKB:Q9NXR1
  review:
    summary: 'PAINT IBA kinetochore (donors: human NDE1/NDEL1, Drosophila NudE).'
    action: MARK_AS_OVER_ANNOTATED
    reason: In animals NDE1/NDEL1 reach kinetochores via CENP-F, a metazoan-specific partner, and kinetochore
      targeting uses NudE-family sequences outside the LIS1-binding coiled coil. In A. nidulans the N-terminal
      coiled coil alone supplies NudE function and the C-terminal region is dispensable; NudE has been
      imaged at microtubule plus-end comets and cytoplasmic specks, not at kinetochores. The node placement
      likely extends an animal-specific localization to fungal members.
    supported_by:
    - reference_id: PMID:12631710
      supporting_text: Neither comets nor specks were observed with the functional N-terminal domain of
        NUDE, indicating that these structures are not essential for NUDE function.
    - reference_id: PMID:10931877
      supporting_text: Surprisingly, the NUDE construct containing the coiled-coil region alone complemented
        the nudE deletion and suppressed the nudF7 mutation
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000100519
        comment: Family node carrying kinetochore; animal kinetochore recruitment is via metazoan CENP-F
