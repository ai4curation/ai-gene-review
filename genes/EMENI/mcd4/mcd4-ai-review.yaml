  label: Aspergillus nidulans FGSC A4
description: >-
  mcd4 encodes the Aspergillus nidulans GPI ethanolamine phosphate transferase
  1, a PTHR12250/PIGN-family ER multipass membrane enzyme inferred to add
  phosphoethanolamine to the first mannose of GPI-anchor precursors during
  GPI-anchor biosynthesis.
