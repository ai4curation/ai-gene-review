  review:
    summary: >-
      ACCEPT: the PTHR12250 PAINT ER-membrane placement is sound.
    action: ACCEPT
    reason: >-
      Q5AXD1 is a PTHR12250:SF0 GPI ethanolamine phosphate transferase 1
      ortholog. The PTN000262246 ER-membrane row is supported by direct
