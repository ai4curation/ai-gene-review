- term:
    id: GO:0048315
    label: conidium formation
  evidence_type: IMP
  original_reference_id: PMID:10523303
  qualifier: acts_upstream_of_or_within
  review:
    summary: Direction should be signed. SfaD represses sporulation, so the unsigned formation term is
      an over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Deleting sfaD gives a hyperactive sporulation phenotype, so SfaD restrains rather than drives
      conidium formation. The signed term GO:0075308, already annotated on this gene, captures the demonstrated
      direction; the unsigned formation term loses it.
    proposed_replacement_terms:
    - id: GO:0075308
      label: negative regulation of conidium formation
    supported_by:
    - reference_id: PMID:10523303
      supporting_text: Deletion of sfaD suppressed all defects resulting from complete loss-of-flbA function mutations, caused a hyperactive sporulation phenotype and severely reduced vegetative growth.
    - reference_id: PMID:10523303
      supporting_text: We propose that SfaD and FadA are both positive growth regulators with partially overlapping functions and that FlbA has an important role in controlling the activities of both proteins.
