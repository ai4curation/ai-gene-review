  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: 'Accept: fungal-type cell wall.'
    action: ACCEPT
    reason: The rodlet layer sits on the outer face of the fungal-type wall. Retained
      alongside the spore-wall term because RodA also coats aerial structures, not
      spores alone.
  supporting_entities:
  - InterPro:IPR001338
  - InterPro:IPR019778
- term:
