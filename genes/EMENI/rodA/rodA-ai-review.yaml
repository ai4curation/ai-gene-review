id: P28346
gene_symbol: rodA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:227321
  label: Emericella nidulans (strain FGSC A4 / ATCC 38163 / CBS 112.46 / NRRL 194 / M139)
description: rodA (originally CAN41/RodA) encodes a class I hydrophobin that is the principal structural
  component of the rodlet layer on the surface of Aspergillus nidulans conidia. Activated early by brlA
  during conidiophore development, RodA self-assembles into the outer hydrophobic rodlet mosaic that confers
  spore-surface hydrophobicity and dispersal; rodA (rodletless) mutants lack the rodlet layer.
existing_annotations:
- term:
    id: GO:0005199
    label: structural constituent of cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Accept: structural constituent of cell wall.'
    action: ACCEPT
    reason: 'Hydrophobins act structurally rather than catalytically: RodA self-assembles into the amphipathic rodlet
      monolayer, a physical constituent of the conidial surface. This is the correct molecular-function class.'
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Accept: extracellular region.'
    action: ACCEPT
    reason: RodA is secreted and assembles after export, so an extracellular assignment follows from its secretory
      route; the wall terms below are the more specific locations.
- term:
    id: GO:0009277
    label: fungal-type cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: 'Accept: fungal-type cell wall.'
    action: ACCEPT
    reason: The rodlet layer sits on the outer face of the fungal-type wall. Retained alongside the spore-wall term
      because RodA also coats aerial structures, not spores alone.
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: 'The more specific of the two wall locations, and the one where RodA matters most: the rodlet layer
      is what confers conidial surface hydrophobicity.'
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:2065971
  qualifier: located_in
  review:
    summary: 'Accept: extracellular region.'
    action: ACCEPT
    reason: Experimental support from the rodletless mutant, in which directed inactivation of rodA removes the
      surface rodlet layer; the structure scored is extracellular.
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: EXP
  original_reference_id: PMID:2065971
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: The same rodletless mutant evidence read at the spore-wall level. This is the primary experimental grounding
      for RodA's location.
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: IDA
  original_reference_id: PMID:15691953
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: Atomic-force microscopy of A. nidulans spore surfaces, cited by the curator as direct evidence for the
      rodlet layer's spore-wall placement; independent of the mutant data above.
- term:
    id: GO:0042243
    label: asexual spore wall assembly
  evidence_type: IMP
  original_reference_id: PMID:2065971
  qualifier: acts_upstream_of_or_within
  review:
    summary: Core process. RodA is required for spore-wall (rodlet-layer) assembly.
    action: ACCEPT
    reason: Disruption of rodA (CAN41) removes the conidial rodlet layer (rodletless phenotype).
    supported_by:
    - reference_id: PMID:2065971
      supporting_text: Disruption of CAN41 results in a novel mutant phenotype in which conidiophore cells
        and spores lack an external wall layer, the rodlet layer, making them less hydrophobic than in
        the wild type and leading to inefficient spore dispersal
