    label: spore wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  retired: true
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: 'The more specific of the two wall locations, and the one where RodA matters
      most: the rodlet layer is what confers conidial surface hydrophobicity.'
- term:
    id: GO:0005576
    label: extracellular region
