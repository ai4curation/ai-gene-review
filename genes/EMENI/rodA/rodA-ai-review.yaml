id: P28346
gene_symbol: rodA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: rodA (originally CAN41/RodA) encodes a class I hydrophobin that is the
  principal structural component of the rodlet layer on the surface of Aspergillus
  nidulans conidia. Activated early by brlA during conidiophore development, RodA
  self-assembles into the outer hydrophobic rodlet mosaic that confers spore-surface
  hydrophobicity and dispersal; rodA (rodletless) mutants lack the rodlet layer.
existing_annotations:
- term:
    id: GO:0005199
    label: structural constituent of cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Accept: structural constituent of cell wall.'
    action: ACCEPT
    reason: 'Hydrophobins act structurally rather than catalytically: RodA self-assembles
      into the amphipathic rodlet monolayer, a physical constituent of the conidial
      surface. This is the correct molecular-function class.'
  supporting_entities:
  - InterPro:IPR001338
  - InterPro:IPR019778
- term:
