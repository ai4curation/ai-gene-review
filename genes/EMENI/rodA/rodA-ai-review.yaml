  original_reference_id: PMID:2065971
  qualifier: located_in
  review:
    summary: 'Accept: extracellular region.'
    action: ACCEPT
    reason: Experimental support from the rodletless mutant, in which directed inactivation
      of rodA removes the surface rodlet layer; the structure scored is extracellular.
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: EXP
  original_reference_id: PMID:2065971
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: The same rodletless mutant evidence read at the spore-wall level. This
      is the primary experimental grounding for RodA's location.
- term:
    id: GO:0031160
    label: spore wall
  evidence_type: IDA
  original_reference_id: PMID:15691953
  qualifier: located_in
  review:
    summary: 'Accept: spore wall.'
    action: ACCEPT
    reason: Atomic-force microscopy of A. nidulans spore surfaces, cited by the curator
      as direct evidence for the rodlet layer's spore-wall placement; independent
      of the mutant data above.
- term:
    id: GO:0042243
    label: asexual spore wall assembly
  evidence_type: IMP
  original_reference_id: PMID:2065971
  qualifier: acts_upstream_of_or_within
  review:
    summary: Core process. RodA is required for spore-wall (rodlet-layer) assembly.
    action: ACCEPT
    reason: Disruption of rodA (CAN41) removes the conidial rodlet layer (rodletless
      phenotype).
    supported_by:
    - reference_id: PMID:2065971
      supporting_text: Disruption of CAN41 results in a novel mutant phenotype in
        which conidiophore cells and spores lack an external wall layer, the rodlet
        layer, making them less hydrophobic than in the wild type and leading to inefficient
        spore dispersal
