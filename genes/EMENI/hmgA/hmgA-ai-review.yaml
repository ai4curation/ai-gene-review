- term:
    id: GO:1902000
    label: homogentisate catabolic process
  evidence_type: IMP
  original_reference_id: PMID:7673153
  review:
    summary: >-
      HmgA catalyses the ring-cleavage step that degrades homogentisate; hmgA disruption causes homogentisate
      accumulation.
    action: NEW
    reason: >-
      HmgA is the enzyme that acts on homogentisate itself, so it performs the first catalytic step of
      homogentisate breakdown (participation, not mere requirement). GO:1902000 is not a subclass of L-phenylalanine
      catabolic process, so the existing annotations do not cover it. The downstream enzyme FahA already
      carries it in this organism (IBA), and the direct substrate enzyme is the stronger case. The same
      term is asserted for every homogentisate-pathway exemplar reviewed alongside this one (P. putida
      HmgA/HmgC/HmgB, human HGD/GSTZ1/FAH, A. nidulans MaiA/FahA), because each enzyme performs one of the
      three catalytic steps of homogentisate breakdown.
    supported_by:
    - reference_id: PMID:7673153
      supporting_text: The HmgA protein catalyzes an essential step in phenylalanine catabolism, and
        disruption of the gene results in accumulation of homogentisate in broths containing
        phenylalanine.
