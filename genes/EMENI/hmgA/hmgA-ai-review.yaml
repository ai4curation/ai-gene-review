  label: Aspergillus nidulans FGSC A4
description: >-
  hmgA encodes homogentisate 1,2-dioxygenase (HmgA, EC 1.13.11.5) of the filamentous ascomycete Aspergillus
  nidulans, a 448-residue Fe(2+)-dependent cupin-fold enzyme that opens the aromatic ring of homogentisate
  to give 4-maleylacetoacetate. HmgA acts in the common, homogentisate-centred part of phenylalanine and
  phenylacetate catabolism, which converts these aromatic carbon sources into fumarate and acetoacetate;
  hmgA is clustered with maiA (maleylacetoacetate isomerase) and fahA (fumarylacetoacetase), the genes
  for the next two steps, and is induced by phenylalanine and phenylacetate. Disruption of hmgA causes
  homogentisate accumulation (the fungal counterpart of human alkaptonuria), and loss of HmgA suppresses
  the phenylalanine toxicity of fahA mutants. HmgA was the first homogentisate dioxygenase gene characterized
  in any organism and led to identification of the human alkaptonuria gene HGD.
