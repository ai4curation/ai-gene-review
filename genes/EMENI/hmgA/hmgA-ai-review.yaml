suggested_questions:
- question: >-
    Does A. nidulans tyrosine catabolism (via 4-hydroxyphenylpyruvate dioxygenase) also route through
    HmgA, and should L-tyrosine catabolic process be asserted for HmgA from fungal data?
- question: >-
    Is HmgA cytosolic like its mammalian orthologue, and does it form the hexameric (dimer of trimers)
    assembly seen in human HGD?
suggested_experiments:
- description: >-
    Test growth of hmgA deletion strains on L-tyrosine as sole carbon source and measure homogentisate
    secretion, to establish HmgA's role in tyrosine catabolism.
- description: >-
    Localize a functional HmgA-GFP fusion under phenylacetate-inducing conditions to determine its subcellular
    compartment.
