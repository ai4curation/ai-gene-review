core_functions:
- description: Transfers the 4'-phosphopantetheine moiety from CoA to conserved serine residues on fungal
    carrier proteins, activating alpha-aminoadipate reductase for lysine biosynthesis and activating
    NRPS/PKS enzymes for siderophore, penicillin, pigment and other secondary-metabolite production.
  molecular_function:
    id: GO:0008897
    label: holo-[acyl-carrier-protein] synthase activity
  directly_involved_in:
  - id: GO:0018070
    label: peptidyl-serine phosphopantetheinylation
  - id: GO:0009085
    label: L-lysine biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *paint_activity
  - reference_id: PMID:25557478
    supporting_text: These results indicate that the npgA gene is involved in the
      phosphopantetheinylation required for primary biological processes such as
      growth, asexual/sexual development, and the synthesis of secondary metabolites
      in A. nidulans.
  - reference_id: PMID:17277172
    supporting_text: Our results expand the number of known and predicted secondary metabolites requiring
      CfwA/NpgA for their biosynthesis and, together with the phylogenetic analysis of fungal PPTases,
      suggest that a single PPTase is responsible for the activation of all PKSs and NRPSs in A. nidulans.
  - reference_id: file:EMENI/npgA/npgA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: |-
      CC       protein domains. Required for primary biological processes such as
      CC       growth and asexual/sexual development, and activates target enzymes
      CC       involved in the synthesis of metabolites such as fatty acids,
      CC       polyketides and nonribosomal peptides, lysine, siderophore, penicillin,
      CC       sterigmatocystin, shamixantone, dehydroaustinol, and pigments.
  - reference_id: PMID:12127488
    supporting_text: Lysine biosynthesis in yeast requires the posttranslational conversion of the
      alpha-aminoadipate semialdehyde reductase Lys2 by the 4'-phosphopantetheinyl transferase (PPTase)
      Lys5 from the inactive apo-form into the catalytically active holo-form.
suggested_questions:
- question: Should AspergillusDB add direct NpgA annotations for siderophore, penicillin and polyketide
    biosynthetic processes that require NpgA-mediated NRPS/PKS carrier-domain activation?
  experts:
  - Aspergillus secondary-metabolism curators
suggested_experiments:
- description: Combine carrier-domain phosphopantetheinylation profiling with targeted PKS/NRPS mutants
    to identify which A. nidulans conidiation signals require direct NpgA activation.
  hypothesis: The unresolved CfwA/NpgA-dependent conidiation signal in A. nidulans is produced by one or
    more specific NRPS/PKS enzymes that depend on NpgA-catalyzed carrier-domain phosphopantetheinylation.
