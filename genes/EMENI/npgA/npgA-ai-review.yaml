taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: 'NpgA/CfwA is the cytosolic broad-specificity Sfp-type 4''-phosphopantetheinyl transferase
  of Aspergillus nidulans. It transfers the 4''-phosphopantetheine moiety of coenzyme A to conserved
  serines in carrier domains, thereby activating apo-carrier proteins in alpha-aminoadipate reductase
  and in multiple nonribosomal peptide synthetases and polyketide synthases. This carrier-domain activation
  underlies fungal lysine biosynthesis and the production of siderophores, penicillin, conidial pigments,
  sterigmatocystin and other secondary metabolites.'
