- term:
    id: GO:0045047
    label: protein targeting to ER
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P15367
  - sgd:YIR022W
  review:
    summary: Sec11 processes signal peptides after ER targeting; it is not known
      to direct proteins to the ER.
    action: REMOVE
    reason: GO:0045047 describes the direction of proteins toward the ER. Sec11
      acts in the ER membrane signal peptidase complex after nascent chains have
      already been targeted and translocated by the SRP/Sec61 or
      Sec62/Sec63-dependent machinery. The A. nidulans overexpression study
      grouped AN10354 with ER translocation candidates but only assayed secretion
      after AN10354 overexpression, so the automatic transfer of the targeting
      process from yeast is not supported for this catalytic peptidase subunit.
    additional_reference_ids:
    - file:genes/EMENI/sec11/sec11-uniprot.txt
    - PMID:28955462
    - PMID:42586426
    supported_by:
    - reference_id: PMID:42586426
      supporting_text: "First, these sequences target nascent chains to the ER membrane by interacting with the signal recognition particle (SRP), which delivers the ribosome-nascent chain complex to the Sec61 translocon. Upon targeting, signal sequences trigger the opening of the Sec61 protein-conducting channel by binding at its lateral gate. Subsequently, they ensure proper folding and localization of nascent chains through timely processing by the signal peptidase complex (SPC)."
    - reference_id: PMID:28955462
      supporting_text: "Sec63 (AN0834) and the ortholog of S. cerevisiae SEC11 (AN10354) were overexpressed (generating strains NID1600 and NID1608, respectively)."
- term:
    id: GO:0051604
    label: protein maturation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000086750
  - SGD:S000001461
  - UniProtKB:P67812
  - UniProtKB:Q9BY50
  review:
    summary: PAINT supports the conserved eukaryotic role of Sec11 in maturing
      nascent proteins by signal peptide cleavage, but the GOA term is broader
      than the live process term for the SPC reaction.
    action: MODIFY
    reason: PTN000086750 places protein maturation at Eukaryota for
      PTHR10806. That scope is appropriate for A. nidulans Sec11 because
      eukaryotic Sec11 matures secretory precursors as part of the ER signal
      peptidase complex; the node is separate from the root-level generic
      peptidase call and is not transferring a lineage-specific phenotype.
      GO:0051604 is nevertheless broader than the signal-peptide cleavage step;
      after obsoletion of GO:0006465 signal peptide processing, GO:0016485
      protein processing is the live process-level term for SPC proteolysis.
    proposed_replacement_terms:
    - id: GO:0016485
      label: protein processing
    additional_reference_ids:
    - file:interpro/panther/PTHR10806/PTHR10806-paint.tsv
    - file:genes/EMENI/sec11/sec11-uniprot.txt
    - PMID:42586426
    supported_by:
    - reference_id: file:interpro/panther/PTHR10806/PTHR10806-paint.tsv
      supporting_text: "PTHR10806 PTN000086750 GO:0051604 P IBD false SGD:S000001461|UniProtKB:P67812|UniProtKB:Q9BY50 taxon:2759 20260528"
    - reference_id: PMID:42586426
      supporting_text: "Following targeting, these sequences are cleaved by the heterotetrameric signal peptidase complex (SPC)."
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000086750
        source_status: SUPPORTS_TRANSFER
        comment: PTN000086750 correctly supports a eukaryotic Sec11
          protein-maturation process, but the gene-level row can be refined to
          the live protein processing term for SPC-catalyzed signal peptide
          cleavage.
