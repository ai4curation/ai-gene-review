description: Sec11 is the conserved fungal catalytic subunit of the signal
  peptidase complex, an endoplasmic-reticulum membrane protease in the
  peptidase S26B family. In the ER signal peptidase complex, Sec11 cleaves
  hydrophobic N-terminal signal peptides from newly translocated secretory and
  membrane protein precursors, producing mature proteins that continue through
  the secretory pathway.
