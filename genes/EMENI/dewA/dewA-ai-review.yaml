  review:
    summary: 'Accept: structural constituent of cell wall.'
    action: ACCEPT
    reason: 'Hydrophobins act structurally rather than catalytically: DewA self-assembles into an amphipathic monolayer
      that is a physical constituent of the conidial surface. This is the correct molecular-function class for the
      protein.'
