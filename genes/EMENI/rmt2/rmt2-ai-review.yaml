  label: Aspergillus nidulans FGSC A4
description: >-
  rmt2/AN6072 encodes the Aspergillus nidulans member of the fungal Rmt2 family
  of type IV protein arginine methyltransferases. The protein belongs to the
  class I-like SAM-binding methyltransferase superfamily and is predicted to
  catalyze S-adenosyl-L-methionine-dependent methylation of the N5/delta
  nitrogen of protein arginine residues, most likely on ribosomal protein
  L12/Rpl12 as in budding yeast.
