- description: >-
    rmt2 is inferred to catalyze S-adenosyl-L-methionine-dependent N5/delta
    methylation of arginine residues in proteins. Q5B058 belongs to the fungal
    Rmt2 clade, separated from the vertebrate GAMT branch; by conservation,
    ribosomal protein L12 is the likeliest substrate awaiting direct A. nidulans
    validation.
