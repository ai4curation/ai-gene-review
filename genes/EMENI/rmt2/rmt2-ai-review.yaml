suggested_questions:
- question: >-
    Does Aspergillus nidulans rmt2 methylate 60S ribosomal protein L12 on the
    arginine residue orthologous to S. cerevisiae Rpl12 Arg67, and are there
    additional filamentous-fungal substrates?
- question: >-
    Does rmt2 deletion alter A. nidulans ribosome biogenesis, translational
    fidelity, stress tolerance, growth, or development?
suggested_experiments:
- hypothesis: >-
    AN6072/rmt2 is the Aspergillus nidulans methyltransferase for the conserved
    Rpl12 N5-arginine mark.
  description: >-
    Compare Rpl12 methylation by targeted mass spectrometry in wild-type, rmt2
    deletion, and catalytically inactive rmt2 strains, then rescue the deletion
    with wild-type rmt2 to verify that the loss is enzyme-specific.
- hypothesis: >-
    rmt2-dependent protein arginine N5 methylation supports ribosome function in
    Aspergillus nidulans.
  description: >-
    Pair rmt2-null ribosome profiling and polysome analysis with stop-codon
    readthrough and programmed frameshifting reporters to test whether the
    budding-yeast Rmt2 translation-fidelity phenotype is conserved in A.
    nidulans.
