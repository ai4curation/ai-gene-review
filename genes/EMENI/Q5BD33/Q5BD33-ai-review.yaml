description: coaT encodes an Aspergillus nidulans mitochondrial acyl-CoA:carboxylate CoA-transferase in the fungal Ach1/CoaT family. Purified CoaT transfers CoASH from succinyl-, propionyl-, and acetyl-CoA donors to acetate or related carboxylates, and loss of CoaT exacerbates propionyl-CoA toxicity when the methylcitrate cycle is compromised.
