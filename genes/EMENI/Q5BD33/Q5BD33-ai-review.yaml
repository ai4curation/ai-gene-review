- id: PMID:18331473
  title: 'Characterization of an acyl-CoA: carboxylate CoA-transferase from Aspergillus nidulans involved in propionyl-CoA detoxification'
  full_text_unavailable: true
  findings:
  - statement: A. nidulans CoaT is an acyl-CoA:carboxylate CoA-transferase with weak acetyl-CoA hydrolase activity.
    supporting_text: The enzyme used succinyl-, propionyl- and acetyl-CoA as CoASH donors and the corresponding acids as acceptor molecules. Although the protein displayed high sequence similarity to acetyl-CoA hydrolases this activity was hardly detectable.
  - statement: CoaT removes toxic propionyl-CoA in vivo when methylcitrate synthase is absent.
    supporting_text: However, when a double-deletion mutant defective in both methylcitrate synthase and CoA-transferase was constructed, the resulting strain was unable to grow on media containing acetate and propionate as sole carbon sources, which confirmed the in vivo activity of the CoA-transferase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; the abstract directly reports purification, biochemical characterization, and A. nidulans coaT deletion phenotypes.
- id: PMID:19298859
  title: 'Re-characterisation of Saccharomyces cerevisiae Ach1p: fungal CoA-transferases are involved in acetic acid detoxification.'
  full_text_unavailable: true
  findings:
  - statement: S. cerevisiae Ach1p and A. nidulans CoaT are fungal CoA-transferases, not primarily acetyl-CoA hydrolases.
    supporting_text: Complementation of an ach1 mutant with the coaT gene reversed the growth defect on acetate confirming the in vivo function
  - statement: Ach1p transfers CoASH from succinyl-CoA to acetate and has only minor acetyl-CoA hydrolase activity.
    supporting_text: Ach1p showed highest specific activity for the CoASH transfer from succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; a direct same-family follow-up by Fleck and Brock that confirms the conserved CoA-transferase activity in budding-yeast Ach1p and complementation by A. nidulans coaT.
