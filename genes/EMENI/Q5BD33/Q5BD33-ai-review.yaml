id: Q5BD33
gene_symbol: coaT
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: coaT encodes an Aspergillus nidulans mitochondrial acyl-CoA:carboxylate CoA-transferase in the fungal Ach1/CoaT family. Purified CoaT transfers CoASH from succinyl-, propionyl-, and acetyl-CoA donors to acetate or related carboxylates and contributes to propionyl-CoA detoxification, especially when the methylcitrate cycle is compromised.
existing_annotations:
- term:
    id: GO:0008775
    label: acetate CoA-transferase activity
  evidence_type: IDA
  original_reference_id: PMID:18331473
  qualifier: enables
  review:
    summary: Fleck and Brock purified A. nidulans CoaT and directly showed acetate-acceptor CoASH transfer from succinyl-, propionyl-, and acetyl-CoA donors.
    action: NEW
    reason: The direct biochemical assay supports acetate CoA-transferase activity; this is also the term PAINT now propagates from Q5BD33 at PTN000484586.
    supported_by:
    - reference_id: PMID:18331473
      supporting_text: The enzyme used succinyl-, propionyl- and acetyl-CoA as CoASH donors and the corresponding acids as acceptor molecules.
- term:
    id: GO:0019543
    label: propionate catabolic process
  evidence_type: IMP
  original_reference_id: PMID:18331473
  qualifier: involved_in
  review:
    summary: CoaT functionally overlaps the methylcitrate cycle in removal of toxic propionyl-CoA produced during propionate metabolism.
    action: NEW
    reason: The coaT single mutant showed only weak propionate phenotypes, but the coaT methylcitrate-synthase double mutant was unable to grow with acetate plus propionate as sole carbon sources, supporting a direct backup role in propionyl-CoA detoxification.
    supported_by:
    - reference_id: PMID:18331473
      supporting_text: However, when a double-deletion mutant defective in both methylcitrate synthase and CoA-transferase was constructed, the resulting strain was unable to grow on media containing acetate and propionate as sole carbon sources, which confirmed the in vivo activity of the CoA-transferase.
