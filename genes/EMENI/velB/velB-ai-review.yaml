    summary: Protein binding (uninformative MF) reflecting velvet-domain heterodimerization
      of VelB with VosA, solved crystallographically in this study.
    action: MODIFY
    reason: The IPI rests on the VosA-VelB heterodimer, whose crystal structure was
      determined in this paper; the interaction is a velvet-domain heterodimerization,
      so protein heterodimerization activity (GO:0046982) is the informative replacement.
      VelB alone does not bind the brlA promoter in EMSA, so its contribution to DNA
      binding and transcriptional control is via the heterodimer.
