core_functions:
- description: 'Velvet-family (NF-kB-like) regulator that, as a heterodimeric partner of VeA or VosA
    (VelB alone does not bind DNA in vitro), balances developmental
    fate: within the VelB-VeA-LaeA complex VelB promotes sexual sporulation and secondary
    metabolism, while within the VosA-VelB complex it drives spore maturation and
    represses asexual conidiation.'
