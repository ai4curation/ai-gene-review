description: 'velB (velvet-like protein B) is a velvet-family regulatory protein and
  a hub of the fungal developmental regulatory network in Aspergillus nidulans. It
  participates in two light-regulated complexes: the VelB-VeA-LaeA (velvet) complex
  formed in the dark, which promotes sexual development and secondary metabolism,
  and the VosA-VelB complex that controls spore maturation, trehalose biogenesis and
  repression of cell-wall genes. Through its NF-kB-like velvet domain VelB heterodimerizes with VeA or VosA (VelB alone does not
  bind the brlA promoter in vitro); it positively
  regulates sexual sporulation and sterigmatocystin biosynthesis while restraining
  asexual conidiation, and shuttles between nucleus and cytoplasm.'
