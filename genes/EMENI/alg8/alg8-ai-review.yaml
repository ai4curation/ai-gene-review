suggested_experiments:
- description: >-
    Express A. nidulans alg8 in an S. cerevisiae alg8 mutant, or conditionally
    deplete alg8 in A. nidulans, and profile lipid-linked oligosaccharides to
    test for the Glc1Man9GlcNAc2-PP-Dol block expected for an ALG8 enzyme.
