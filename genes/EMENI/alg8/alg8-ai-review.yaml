id: Q5AWM9
gene_symbol: alg8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  alg8 encodes the Aspergillus nidulans ortholog of the conserved ALG8
  dolichyl-phosphate-glucose glucosyltransferase. The protein is predicted to be
  a multi-pass endoplasmic-reticulum membrane enzyme whose lumenal catalytic
  face adds the second glucose to Glc1Man9GlcNAc2-PP-dolichol during
  lipid-linked oligosaccharide assembly, producing the
  Glc2Man9GlcNAc2-PP-dolichol precursor used for protein N-linked glycosylation.
