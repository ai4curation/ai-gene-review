- term:
    id: GO:0000183
    label: rDNA heterochromatin formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q08649
  - sgd:YOR244W
  review:
    summary: >-
      rDNA heterochromatin formation is a budding-yeast Esa1/NuA4-specific
      process transfer.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      S. cerevisiae ESA1 has curated support for rDNA silencing, but the
      automatic transfer asserts a specialized rDNA heterochromatin process
      that is not placed by PAINT and is not tested for Aspergillus EsaA. The
      direct A. nidulans paper supports H4K12 acetylation at secondary
      metabolite clusters instead.
