suggested_questions:
- question: >-
    Does A. nidulans EsaA form an autonomous Piccolo NuA4-like catalytic
    subcomplex, or is the detectable EsaA pool assembled only into larger NuA4
    complexes?
- question: >-
    Are the crotonyltransferase and 2-hydroxyisobutyryltransferase activities
    inferred from S. cerevisiae ESA1 and S. pombe Mst1 measurable for
    Aspergillus EsaA in vivo, and are histones the physiological substrates?
suggested_experiments:
- description: >-
    Purify epitope-tagged EsaA with Epl1, Yng2, and shared NuA4 subunits under
    mild and stringent conditions and quantify co-elution by size-exclusion
    chromatography plus mass spectrometry to test for a stable A. nidulans
    Piccolo NuA4 counterpart.
- description: >-
    Repeat EsaA in vitro acyltransferase assays with acetyl-CoA,
    crotonyl-CoA, and 2-hydroxyisobutyryl-CoA, and pair the assays with
    targeted H4 acyl-lysine mass spectrometry in esaA depletion or
    catalytic-mutant strains.
