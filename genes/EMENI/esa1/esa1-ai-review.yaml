id: C8VBH4
gene_symbol: esa1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  esa1 encodes the Aspergillus nidulans fungal ESA1/MYST histone
  acetyltransferase, a conserved chromatin enzyme inferred to act as a NuA4
  catalytic subunit. EsaA acetylates histone H4, including H4K12 at secondary
  metabolite gene clusters, and promotes chromatin-based regulation of nuclear
  transcription.
