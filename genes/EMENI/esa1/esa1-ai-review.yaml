- id: PMID:22882998
  title: Overexpression of the Aspergillus nidulans histone 4 acetyltransferase EsaA
    increases activation of secondary metabolite production.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache read; this is the direct AspGD source for esaA-dependent
      H4K12 acetylation and secondary-metabolite cluster activation in A.
      nidulans.
  findings:
  - statement: >-
      Aspergillus AN10956.4/esaA is a fungal ESA1 homolog that can substitute
      for S. cerevisiae ESA1 in a plasmid-shuffle assay.
    supporting_text: >-
      As expected, both forms of esaA vectors were able to rescue the lethality
      of the yeast deletion, proving not only is esaA able to substitute for the
      native Esa1 function in this strain, but suggesting the genomic esaA
      transcript is processed sufficiently subsequent to transcription.
  - statement: >-
      EsaA overexpression increases histone H4 acetylation, including H4K12
      acetylation, in A. nidulans.
    supporting_text: >-
      H4K5, H4K8, and H4K12 also showed increases, confirming EsaA target
      specificity.
  - statement: >-
      EsaA-dependent H4 acetylation promotes increased activation of secondary
      metabolite gene clusters in A. nidulans.
    supporting_text: >-
      we have uncovered a pathway involving the histone 4 acetyltransferase
      EsaA in increased activation of SM gene clusters.
