id: C8VJR5
gene_symbol: alnC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  Aspergillus nidulans alnC encodes a predicted multi-pass membrane
  flavoprotein oxidoreductase in the aln secondary-metabolite gene cluster for
  (+)-asperlin biosynthesis. AlnC has cytochrome-b5-like, FAD-binding, and FNR
  nucleotide-binding domains, is required for (+)-asperlin production when the
  otherwise silent cluster is activated, and belongs to a broader fungal
  NADH-cytochrome-b5-reductase-like family.
core_functions:
- description: >-
    Membrane-associated flavoprotein/cytochrome-b5-like oxidoreductase
    required for production of the polyketide (+)-asperlin from the aln
    secondary-metabolite gene cluster.
  molecular_function:
    id: GO:0016491
    label: oxidoreductase activity
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
