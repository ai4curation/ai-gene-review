suggested_questions:
- question: >-
    What is the direct electron acceptor and redox chemistry catalyzed by AlnC
    in the (+)-asperlin biosynthetic cluster?
suggested_experiments:
- description: >-
    Reconstitute AlnC with candidate aln-cluster intermediates and the adjacent
    tailoring enzymes to identify the redox step that fails in the alnC
    deletion strain.
