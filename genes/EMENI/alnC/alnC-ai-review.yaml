    Metabolite Gene Cluster for (+)-Asperlin in Aspergillus nidulans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; identifies alnC/AN11198 as a member of the aln
      (+)-asperlin biosynthetic cluster and shows that deleting alnC fully
      eliminated (+)-asperlin production under cluster induction.
  findings:
  - statement: >-
      The alnA-alnI plus alnR cluster is responsible for A. nidulans
      (+)-asperlin production, and deletion of alnC was one of the deletions
      that fully eliminated (+)-asperlin.
    supporting_text: >-
      Analysis of the deletants shows that deletions of alnA, alnB, alnC,
      alnD, alnF, alnH and alnI fully eliminated production
