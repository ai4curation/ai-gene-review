  review:
    summary: >-
      The PTHR19370 root oxidoreductase IBA is broad but appropriate for this
      FAD/cytochrome-b5-domain member of the family.
    action: ACCEPT
    reason: >-
      PTN001833551 is the family-root node spanning fungal CBR1, MCR1, PGA3,
      and AlnC-like reductases as well as plant nitrate reductases and animal
      CYB5R proteins. That placement can only support the generic
      oxidoreductase parent, but AlnC does carry CBR/FAD/NAD domains and is the
      membrane reductase-like component of the aln asperlin cluster. Keep this
      as a correct broad PAINT assertion while leaving the direct electron
      acceptor unresolved.
    supported_by:
    - reference_id: file:interpro/panther/PTHR19370/PTHR19370-paint.tsv
      supporting_text: "PTHR19370\tPTN001833551\tGO:0016491\tF\tIBD\tfalse"
    - reference_id: file:genes/EMENI/alnC/alnC-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "PANTHER; PTHR19370:SF184; NADH-CYTOCHROME B5 REDUCTASE-LIKE"
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001833551
        source_label: PANTHER:PTN001833551
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The root node supports conserved oxidoreductase chemistry for AlnC,
          but is intentionally broad across multiple PTHR19370 subfamilies and
          cannot identify the aln-cluster electron acceptor.
