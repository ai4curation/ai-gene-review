    supporting_text: >-
      Analysis of the deletants shows that deletions of alnA, alnB, alnC,
      alnD, alnF, alnH and alnI fully eliminated production
  - reference_id: file:genes/EMENI/alnC/alnC-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: "InterPro; IPR001834; CBR-like."
