  review:
    summary: >-
      AlnC is predicted to be a multi-pass membrane protein, and the
      UniProtSubCell mapping supports only the broad membrane location.
    action: ACCEPT
    reason: >-
      The A. nidulans Swiss-Prot record predicts two transmembrane helices in
      AlnC and maps the generic UniProt membrane location to GO. No more
      specific compartment has been established, so the broad membrane row is
      retained as the best available localization.
    supported_by:
