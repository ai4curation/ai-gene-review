  review:
    summary: >-
      InterPro identifies AlnC as a CBR-like flavoprotein oxidoreductase; no
      narrower GO molecular-function term is yet supported.
    action: ACCEPT
    reason: >-
      AlnC contains cytochrome-b5-like, FAD-binding, and FNR nucleotide-binding
      signatures and is required for (+)-asperlin production. The exact redox
      reaction remains unknown, so GO:0016491 is the appropriate molecular
      function until the asperlin pathway step and electron acceptor are
      established.
    supported_by:
