  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028747
  - InterPro:IPR001433
  - InterPro:IPR001834
  - InterPro:IPR017927
  review:
    summary: >-
      InterPro identifies AlnC as a CBR-like flavoprotein oxidoreductase with
      NAD/FAD donor signatures, supporting refinement to the NAD(P)H-dependent
      oxidoreductase parent.
    action: MODIFY
    reason: >-
      AlnC contains cytochrome-b5-like, FAD-binding, and FNR nucleotide-binding
      signatures, and the pyridine-nucleotide reductase family membership
      supports the NAD(P)H donor half of the reaction. The electron acceptor
      and exact asperlin-pathway step remain unresolved, so GO:0016651 is the
      most specific supported oxidoreductase term.
    proposed_replacement_terms:
    - id: GO:0016651
      label: oxidoreductase activity, acting on NAD(P)H
    supported_by:
    - reference_id: file:genes/EMENI/alnC/alnC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "InterPro; IPR001433; OxRdtase_FAD/NAD-bd."
    - reference_id: file:genes/EMENI/alnC/alnC-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "InterPro; IPR017927; FAD-bd_FR_type."
    - reference_id: file:genes/EMENI/alnC/alnC-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: "Belongs to the flavoprotein pyridine nucleotide cytochrome reductase family."
- term:
    id: GO:0030639
    label: polyketide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:30339758
  qualifier: involved_in
  review:
    summary: >-
      AlnC is an aln-cluster reductase required for (+)-asperlin polyketide
      biosynthesis.
    action: NEW
    reason: >-
      The A. nidulans hybrid-transcription-factor study activated the silent
      aln cluster, mapped alnC/AN11198 inside the induced cluster, and showed
      by individual deletions that alnC is required for (+)-asperlin
      production. This supports GO:0030639 because AlnC is a predicted
      NAD(P)H-dependent reductase that catalyzes a tailoring step within the
      biosynthetic enzyme set converting the AlnA/AlnB product
      2,4,6-octatrienoic acid into (+)-asperlin, not a substrate consumed by
      another enzyme.
    supported_by:
    - reference_id: PMID:30339758
      supporting_text: >-
        The deletion and RNA-seq data are consistent with each other and,
        together, reveal that the genes involved in the biosynthesis of
        (+)-asperlin (2) include; alnA (AN11191), alnB (AN11199), alnC
        (AN11198), alnD (AN9218), alnE (AN9219), alnF (AN9220), alnG (AN9221
        exons 1-2), alnR (AN9221 exon3), alnH (AN11192), and alnI (AN11200)
    - reference_id: file:genes/EMENI/alnC/alnC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: converted to asperlin via several steps involving the remaining enzymes
    - reference_id: file:genes/EMENI/alnC/alnC-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Fully eliminates the production of asperlin.
