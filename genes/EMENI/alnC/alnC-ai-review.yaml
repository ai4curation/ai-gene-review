  findings:
  - statement: >-
      The alnA-alnI plus alnR cluster is responsible for A. nidulans
      (+)-asperlin production, and deletion of alnC was one of the deletions
      that fully eliminated (+)-asperlin.
    supporting_text: >-
      Analysis of the deletants shows that deletions of alnA, alnB, alnC,
      alnD, alnF, alnH and alnI fully eliminated production
