taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  BioDA of Aspergillus nidulans is a bifunctional dethiobiotin synthetase /
  adenosylmethionine-8-amino-7-oxononanoate aminotransferase that carries out
  two consecutive steps of biotin ring assembly in a single polypeptide. Its
  N-terminal dethiobiotin synthetase domain (DTBS; EC 6.3.3.3) closes the ureido
  ring by ATP- and Mg2+-dependent insertion of CO2 into 7,8-diaminononanoate
  (DAPA) to give dethiobiotin, and its C-terminal class-III pyridoxal
  5'-phosphate (PLP)-dependent aminotransferase domain (EC 2.6.1.62) makes DAPA
  by transferring the alpha-amino group of S-adenosyl-L-methionine to
  8-amino-7-oxononanoate (KAPA). The fused BioD-BioA architecture is
  characteristic of filamentous fungi, basidiomycetes and plants. The protein is
  mitochondrial and is part of the A. nidulans biotin biosynthetic gene cluster.
