  - statement: FlbB and FlbE colocalize at the hyphal tip (actin-dependent) and interact
      in vivo by BiFC.
    supporting_text: Moreover, bimolecular fluorescence studies show that they physically
      interact in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Supports the hyphal-tip IDA/IPI rows and
      the FlbB-FlbE interaction.
- id: PMID:19656299
  title: The bZIP-type transcription factor FlbB regulates distinct morphogenetic
    stages of colony formation in Aspergillus nidulans.
  findings:
  - statement: FlbB localizes to tips of growing metulae; flbB mutants have branching
      and osmotic-autolysis defects.
    supporting_text: FlbB was located at the tip of growing metulae, following a
      similar pattern as described in vegetative hyphae.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. The DNA-binding IDA attributed to this paper
      cannot be checked here. The curator's call is deferred to, and the term is
      refined to cis-regulatory binding using the ChIP evidence reported later.
- id: PMID:20132447
  title: The concerted action of bZip and cMyb transcription factors FlbB and FlbD
    induces brlA expression and asexual development in Aspergillus nidulans.
  findings:
  - statement: FlbB activates flbD expression; FlbB and FlbD jointly activate brlA.
    supporting_text: Both factors then jointly activate brlA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. This is the key paper for the FlbB-flbD-brlA
      activation cascade; the ChIP of FlbB at the brlA promoter is attributed to it
      by PMID:31065746.
- id: PMID:21423749
  title: Elucidation of functional markers from Aspergillus nidulans developmental
    regulator FlbB and their phylogenetic distribution.
  findings:
  - statement: An FlbB C382A point mutant is fluffy; 40 Pezizomycotina FlbB orthologs,
      including N. crassa NCU07379, share the H19 bZIP and a Yap1-like C-terminus.
    supporting_text: flbB-C382A exhibited a fluffy phenotype with sparse conidiation
      thus confirming that C382 is critical for FlbB function in Anidu.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Mostly comparative sequence analysis, with one
      wet-lab mutant (C382A) that supports the IMP rows. It also reports that the
      N. crassa ortholog NCU07379 knockout conidiates normally, which is a caution
      against transferring the conidiation role across orders.
- id: PMID:21624998
  title: Regulation of conidiation by light in Aspergillus nidulans.
  findings:
  - statement: Light induction of brlA requires flbA-C, among other genes.
    supporting_text: We have found that light induction of brlA required the photoreceptor
      complex composed of a phytochrome FphA, and the white-collar homologs LreA and
      LreB, and the fluffy genes flbA-C.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. flbB is one of several genes required for
      light-dependent brlA induction.
- id: PMID:26256571
  title: Tip-to-nucleus migration dynamics of the asexual development regulator FlbB
    in vegetative cells.
  findings:
  - statement: Tip localization needs Cys382 and the bZIP domain; FlbE binds the bZIP
      domain and confers transcriptional competence; a bipartite NLS mediates nuclear
      import.
    supporting_text: Tip localization of FlbB depends on Cys382 in the C-terminus
      and the bZIP DNA-binding domain in the N-terminus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; PubMed-indexed (Mol Microbiol 2015).
- id: PMID:25701285
  title: 'Beyond asexual development: modifications in the gene expression profile caused
    by the absence of the Aspergillus nidulans transcription factor FlbB.'
  findings:
  - statement: RNA-seq of ΔflbB confirms that FlbB activates flbD and brlA; it also
      represses the dba cluster and activates urdA.
    supporting_text: Results confirmed the activating role of FlbB on downstream
      regulators of conidiation such as flbD and brlA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. The secondary-metabolism and sexual-cycle
      effects are transcriptional consequences, and no process terms are proposed
      for them.
- id: PMID:31065746
  title: Developmental regulators FlbE/D orchestrate the polarity site-to-nucleus dynamics
    of the fungal bZIP transcription factor FlbB.
  findings:
  - statement: FlbE drives acropetal transport of FlbB; dynein mediates its transport
      to nuclei; FlbD controls its nuclear accumulation; FlbB binds the brlA promoter
      (ChIP) only in the presence of FlbD.
    supporting_text: FlbD controls the nuclear accumulation of FlbB through a cMyb
      domain and a C-terminal LxxLL motif.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Its introduction summarizes the earlier ChIP
      evidence for FlbB at the brlA promoter.
- id: file:NEUCR/NCU07379/NCU07379-bioinformatics/RESULTS-rereview.md
  title: NCU07379 placement within PTHR40621:SF6 (MAFFT/NJ phylogeny)
  findings:
  - statement: FlbB (C8VBM8) and NCU07379 form a clade with 100% bootstrap support,
      separate from the Yap1/NapA clade, within PTHR40621:SF6.
    supporting_text: 'NCU07379 groups with the FlbB clade. In the NJ tree, the clade'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: A repository analysis used to place flbB relative to the IBA donors
      (Yap1/Pap1/Cap1 clade) and to its Sordariomycete orthologs.
core_functions:
- description: >-
    Pol II-specific bZIP transcriptional activator of conidiation. FlbB is made
    competent at the hyphal tip through its interaction with FlbE and then moves to
    nuclei. There it induces flbD and, with FlbD, binds the brlA promoter to
    activate brlA and start asexual development. Established experimentally in A.
    nidulans by mutant phenotypes, transcriptome, localization and ChIP data.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0075307
    label: positive regulation of conidium formation
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0001411
    label: hyphal tip
  supported_by:
  - reference_id: PMID:20132447
    supporting_text: we show that bZip transcription factor FlbB, which has been
      attributed to participate in transducing the aerial stimulus signal, activates
      the expression of c-Myb transcription factor FlbD. Both factors then jointly
      activate brlA
  - reference_id: PMID:31065746
    supporting_text: Furthermore, chromatin immunoprecipitation assays showed that
      FlbB cannot bind brlA p in the absence of FlbD
  - reference_id: PMID:25701285
    supporting_text: Results confirmed the activating role of FlbB on downstream
      regulators of conidiation such as flbD and brlA.
  - reference_id: PMID:26256571
    supporting_text: flbE deletion also abrogates transcriptional activity indicating
      that FlbB gains transcriptional competence from interactions with FlbE at the
      tip.
  - reference_id: PMID:17993569
    supporting_text: FlbB accumulates at the hyphal apex during early vegetative growth
      but is later found in apical nuclei, suggesting that an activating modification
      triggers nuclear import.
suggested_questions:
- question: >-
    Which DNA sequence does FlbB recognize in the brlA and flbD promoters, and does
    the conserved H19 histidine in its basic region change its specificity from that
    of the canonical AP-1 (TGA[C/G]TCA) bZIPs?
- question: >-
    The conidiation role is established only in Aspergillus. The N. crassa ortholog
    NCU07379 (same FlbB clade) is reported to conidiate normally when deleted. Which
    parts of FlbB function (DNA binding, activation, tip localization) should be
    treated as conserved across the FlbB clade, and which as Eurotiales-specific?
- question: >-
    Does Cys382, which aligns with the redox-sensing cysteines of Yap1/Pap1, sense
    an oxidative signal at the tip, or is it needed only structurally for FlbE
    binding and tip retention?
suggested_experiments:
- description: >-
    Run EMSA or DAP-seq with recombinant FlbB bZIP domain, alone and with FlbD, on
    the brlA and flbD promoters, and do genome-wide ChIP-seq of FlbB in wild-type
    and ΔflbD backgrounds. This would define direct targets and the binding motif,
    and test whether FlbD is needed for binding or only for nuclear retention.
- description: >-
    Express A. nidulans flbB and the N. crassa ortholog NCU07379 reciprocally in
    ΔflbB A. nidulans, and in N. crassa under conidiation-inducing conditions, to
    test whether the activator function is conserved even though the N. crassa
    knockout phenotype differs.
