- term:
    id: GO:0048315
    label: conidium formation
  evidence_type: IMP
  original_reference_id: PMID:17993569
  qualifier: acts_upstream_of_or_within
  review:
    summary: Accepted. Loss of flbB blocks conidiation (fluffy phenotype), and the
      acts_upstream_of_or_within qualifier fits a regulator that sits upstream of
      brlA.
    action: ACCEPT
    reason: >-
      Null and point mutants of flbB are aconidial or strongly delayed in
      conidiation. FlbB does not carry out conidiophore morphogenesis itself; it
      triggers the program by inducing flbD and brlA. The acts_upstream_of_or_within
      qualifier states this correctly. The regulatory role is captured more
      precisely by GO:0075307 (positive regulation of conidium formation), which is
      used in core_functions.
    supported_by:
    - reference_id: PMID:17993569
      supporting_text: proper temporal and quantitative expression of FlbB is a prerequisite
        for brlA transcription, and misscheduled overexpression inhibits conidiation.
