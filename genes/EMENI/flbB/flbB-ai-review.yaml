id: C8VBM8
gene_symbol: flbB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:227321
  label: Aspergillus nidulans FGSC A4
description: >-
  flbB encodes a 426-residue basic-leucine-zipper (bZIP) transcription factor of
  filamentous ascomycetes. It has an N-terminal bZIP DNA-binding and dimerization
  domain, preceded by a bipartite nuclear localization signal, and a C-terminal
  region related to the redox-responsive cysteine-rich domain of Yap1/Pap1-type
  AP-1 factors. FlbB is one of the upstream developmental activators of asexual
  sporulation (conidiation) in Aspergillus nidulans. Null mutants form aconidial
  "fluffy" colonies that do not express brlA, the master regulator of conidiophore
  development. The protein has two pools. One accumulates at the hyphal tip, where
  FlbE binds its bZIP domain and makes it transcriptionally competent; the other
  moves retrogradely, in a dynein-dependent manner, to apical nuclei, where its
  accumulation depends on FlbD. In the nucleus FlbB activates flbD, and FlbB and
  FlbD then bind the brlA promoter cooperatively and induce brlA. Cys382 in the
  C-terminal region and the bZIP domain are both needed for tip localization and
  for conidiation. Transcriptome analysis of the null mutant shows further roles:
  repression of the dba secondary-metabolite cluster, and activation of urdA, a
  repressor of premature sexual development. flbB mutants also show altered
  branching and autolysis under osmotic stress.
existing_annotations:
- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Accepted. Cis-regulatory DNA binding, propagated from the bZIP ancestor
      PTN008082960 and supported in A. nidulans by ChIP binding of FlbB at the brlA
      promoter.
    action: ACCEPT
    reason: >-
      flbB sits in PANTHER PTHR40621:SF6. The IBA comes from PAINT node
      PTN008082960, the shared ancestor of the FlbB clade and the Yap1/Pap1/Cap1
      clade. Its donors (Yap1, Pap1, Cap1) belong to the second clade, but
      cis-regulatory DNA binding is a function of the conserved bZIP basic region.
      PTN008082960 is the ancestor of both clades, so propagating the term to flbB
      is phylogenetically sound. The term also has direct support in this species:
      chromatin immunoprecipitation shows FlbB on the brlA promoter, where binding
      depends on FlbD. That is binding to a cis-regulatory region. It is not by
      itself proof of sequence-specific recognition, so the term is kept at this
      level and is not refined to a sequence-specific child.
    supported_by:
    - reference_id: PMID:31065746
      supporting_text: Both participate in the control of conidiation through cooperative
        binding to the promoter of brlA ( brlA p ). Furthermore, chromatin immunoprecipitation
        assays showed that FlbB cannot bind brlA p in the absence of FlbD
    - reference_id: file:NEUCR/NCU07379/NCU07379-bioinformatics/RESULTS-rereview.md
      supporting_text: Both clades descend from PAINT node PTN008082960, so the general
        bZIP DNA-binding transcription activator terms propagated from that node apply.
  supporting_entities:
  - CGD:CAL0000188360
  - PANTHER:PTN008082960
  - PomBase:SPAC1783.07c
  - SGD:S000006403
- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Accepted as the core molecular function. FlbB is a Pol II-specific
      DNA-binding activator of flbD and brlA.
    action: ACCEPT
    reason: >-
      This is the most specific supported molecular function for FlbB. The IBA
      comes from PTN008082960, the bZIP node shared by the FlbB and Yap1 clades,
      and the term is general to bZIP activators rather than specific to the Yap1
      clade. The A. nidulans data give independent support. FlbB activates
      expression of flbD and brlA, both protein-coding (Pol II) genes, and the
      ΔflbB transcriptome confirms that it activates them. FlbB occupies the brlA
      promoter (ChIP), and loss of FlbE abolishes its transcriptional activity.
      PAINT propagated the generic activator terms from this node but not the
      oxidative-stress terms of the Yap1/Pap1 donors, and that omission is
      respected here.
    supported_by:
    - reference_id: PMID:25701285
      supporting_text: Results confirmed the activating role of FlbB on downstream
        regulators of conidiation such as flbD and brlA.
    - reference_id: PMID:20132447
      supporting_text: we show that bZip transcription factor FlbB, which has been
        attributed to participate in transducing the aerial stimulus signal, activates
        the expression of c-Myb transcription factor FlbD. Both factors then jointly
        activate brlA
    - reference_id: PMID:26256571
      supporting_text: flbE deletion also abrogates transcriptional activity indicating
        that FlbB gains transcriptional competence from interactions with FlbE at the
        tip.
  supporting_entities:
  - PANTHER:PTN008082960
  - PomBase:SPAC1783.07c
  - SGD:S000002831
  - SGD:S000006403
- term:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: Kept as non-core. A plausible family-level complex inference; no
      FlbB-containing Pol II regulator complex has been isolated.
    action: KEEP_AS_NON_CORE
    reason: >-
      bZIP factors act as dimers, and in A. nidulans FlbB binds the brlA promoter
      cooperatively with FlbD (it cannot bind without FlbD). A promoter-bound
      transcription-regulator assembly is therefore plausible. The original paper
      also proposes that FlbB acts in a heteromeric complex. No complex has been
      purified or defined, however, so this stays a non-core inference and should
      not be read as evidence that a complex exists.
    supported_by:
    - reference_id: PMID:17993569
      supporting_text: Like many bZIP proteins ( 45 ), FlbB may form a heteromeric
        complex.
  supporting_entities:
  - CGD:CAL0000188360
  - PANTHER:PTN008082960
  - PomBase:SPAC1783.07c
