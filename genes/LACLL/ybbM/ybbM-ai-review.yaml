knowledge_gaps:
- gap_statement: >-
    The substrate of the lactococcal UPF0014 ABC transporter is unknown. Iron export is shown
    only indirectly for E. coli FetAB (lower intracellular iron on overexpression), and the plant
    member of the family exports UDP-glucose; the lactococcal protein falls outside the FetB
    equivalog. No transport assay, metal-sensitivity test or deletion phenotype exists for any
    lactococcal member.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    Why lactococcal plasmids carry this transporter, sometimes in two copies among IS
    elements, is not known; no phenotype has been linked to plasmid carriage of the cassette.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Does a strain cured of the plasmid cassette (or a deletion of both copies) accumulate more
    iron, or become more sensitive to iron, nickel or H2O2, than its parent?
- question: >-
    Does the lactococcal permease/ATPase pair complement the H2O2 sensitivity of an E. coli
    fetAB deletion, or the aluminium sensitivity of a plant star1/star2 or als3 mutant?
suggested_experiments:
- experiment_type: Metal content and sensitivity of a deletion strain
  description: >-
    Delete both cassette copies in strain 275 (or cure plasmid p275A), then measure
    intracellular Fe, Ni, Mn and Zn by ICP-MS and growth under iron, nickel and H2O2 stress,
    with complementation from a plasmid carrying one permease/ATPase pair.
- experiment_type: Heterologous complementation
  description: >-
    Express the lactococcal permease and ATPase in an E. coli ΔfetAB Δfur background and test
    H2O2 survival and intracellular iron (EPR or ICP-MS), alongside E. coli fetAB as the
    positive control.
