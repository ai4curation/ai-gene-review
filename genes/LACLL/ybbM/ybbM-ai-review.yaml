- term:
    id: GO:0140359
    label: ABC-type transporter activity
  evidence_type: ISS
  original_reference_id: file:LACLL/ybbM/ybbM-bioinformatics/RESULTS.md
  qualifier: contributes_to
  review:
    summary: >-
      New annotation. The protein is the transmembrane subunit of a two-gene ABC transporter: it
      is a full-length UPF0014 permease and is encoded next to an ABC ATP-binding protein that
      is 47% identical to E. coli FetA. The E. coli FetA/FetB pair (59% identical to this
      protein) and the rice STAR1/STAR2 pair (34% identical) both function as two-component
      ABC transporters (PMID:24038693, PMID:19244140).
    action: NEW
    reason: >-
      The transporter activity belongs to the permease/ATPase complex, so the permease subunit
      contributes to it. The substrate is not known, so no substrate-specific child term is
      used.
    supported_by:
    - reference_id: PMID:19244140
      supporting_text: >-
        STAR1 encodes a nucleotide binding domain, while STAR2 encodes a transmembrane domain,
        of a bacterial-type ATP binding cassette (ABC) transporter.
    - reference_id: file:LACLL/ybbM/ybbM-bioinformatics/RESULTS.md
      supporting_text: >-
        The query has the FetA-FetB-type two-gene organisation, so it is most likely the
        permease of a FetAB-like ABC transporter.
