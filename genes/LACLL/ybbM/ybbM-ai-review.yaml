- id: PMID:24038693
  title: Overexpression of fetA (ybbL) and fetB (ybbM), Encoding an Iron Exporter, Enhances
    Resistance to Oxidative Stress in Escherichia coli.
  findings:
  - statement: Deletion of E. coli fetA or fetB increases sensitivity to H2O2, and overexpression
      reverses it.
    supporting_text: >-
      We report that the ΔybbL and ΔybbM strains are more susceptible to H2O2 stress than the
      parent strain and that ybbL and ybbM overexpression overcomes H2O2 sensitivity.
  - statement: FetAB overexpression lowers intracellular iron, the basis for proposing iron as
      the substrate.
    supporting_text: >-
      intracellular iron levels in the Δfur strain are decreased by 37% by fetA and fetB
      overexpression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. Source of the FetAB transporter and H2O2 phenotypes for the
      59%-identical E. coli FetB. Iron as substrate rests on a drop in intracellular iron on
      overexpression, with no transport assay, so the review uses it only for the
      ABC-transporter call and not for iron transport.
- id: PMID:19244140
  title: A bacterial-type ABC transporter is involved in aluminum tolerance in rice.
  findings:
  - statement: Rice STAR2, a UPF0014 permease, works with the ATPase STAR1 as a UDP-glucose
      efflux transporter.
    supporting_text: >-
      When expressed together in Xenopus laevis oocytes, STAR1/2 shows efflux transport
      activity specific for UDP-glucose.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. The only direct transport assay for a UPF0014 permease
      (STAR1/STAR2 in Xenopus oocytes, UDP-glucose efflux). It is distant (34% identical) and
      is used to show that UPF0014 substrates differ across the family.
- id: PMID:36297171
  title: Nitric Oxide Production and Effects in Group B Streptococcus Chorioamnionitis.
  findings:
  - statement: The Streptococcus agalactiae FetB homolog is strongly down-regulated after nitric
      oxide exposure.
    supporting_text: >-
      FetB, a YBBM-related iron export transporter (A909 gene locus SAK_RS04090 and CNCTC 10/84
      gene locus W903_RS03770) was the most downregulated gene, with a 16-fold decrease in gene
      expression following NO exposure.
