taxon:
  id: NCBITaxon:44688
  label: Lactococcus lactis subsp. lactis bv. diacetylactis
description: >-
  This plasmid-borne Lactococcus lactis gene encodes a 251-residue integral membrane protein of the
  UPF0014 (YbbM/FetB) family, with seven predicted transmembrane helices and the UPF0014 domain
  over almost its whole length. It is the permease (transmembrane) half of a two-component
  bacterial ABC transporter. The adjacent gene encodes an ABC ATP-binding protein 47% identical to
  Escherichia coli FetA, and the two genes form a cassette carried on lactococcal plasmids among
  insertion-sequence elements; strain 275 plasmid p275A carries two identical copies. The protein
  is 59% identical to E. coli FetB, whose FetAB transporter lowers intracellular iron when
  overexpressed and protects against hydrogen peroxide, and which is proposed to export iron.
  It falls below the trusted cutoff of the NCBIfam FetB equivalog model, however, and other
  UPF0014 members transport different substrates. The distant plant homolog STAR2 with its partner STAR1
  exports UDP-glucose for aluminium tolerance. The substrate of the lactococcal transporter is
  therefore unknown. No experiment has been done on this protein or any lactococcal member of
  the family; expression of streptococcal homologs falls after heat or nitric oxide exposure.
