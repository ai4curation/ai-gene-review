  title: 'ybbM bioinformatics: UPF0014/FetB family placement and plasmid context'
  findings:
  - statement: The query is outside the TIGR00245 FetB equivalog.
    supporting_text: >-
      The query is therefore FetB-like but outside the FetB equivalog as NCBIfam defines it.
  - statement: The query is the permease of a FetAB-like two-gene cassette.
    supporting_text: >-
      The query has the FetA-FetB-type two-gene organisation, so it is most likely the
      permease of a FetAB-like ABC transporter.
