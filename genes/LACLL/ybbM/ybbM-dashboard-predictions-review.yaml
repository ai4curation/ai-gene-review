id: G1FE25
gene_symbol: ybbM
locus_tag: PVF_pVF18p21
taxon:
  id: NCBITaxon:44688
  label: Lactococcus lactis subsp. lactis bv. diacetylactis
status: COMPLETE
description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for L. lactis
  NZ_CP016699.1_28 (plasmid p275A, eggNOG name ybbM) is "Putative iron-export ABC transporter
  permease FetB (UPF0014 family), associated with nickel tolerance" (tier A), with three GO
  terms: GO:0140359 ABC-type transporter activity, GO:0006826 iron ion transport and GO:1990532
  stress response to nickel ion. The exact sequence has no active UniProtKB entry, so the call
  is scored on G1FE25 (plasmid pVF18), which is 98.8% identical. The call overreaches. The
  permease assignment is well supported: the query is a full-length UPF0014 protein with seven
  transmembrane helices, encoded next to an ABC ATP-binding protein 47% identical to E. coli FetA.
  The FetB name and iron substrate transfer weakly: the query scores 359.9 bits against the
  NCBIfam FetB equivalog TIGR00245, below its 410-bit trusted cutoff, which E. coli FetB passes
  (476.8 bits). The evidence the call saw did not include this, because the dashboard's
  InterProScan hits on the query show no NCBIfam match while all enterobacterial homologs carry
  one. The family also includes the rice UDP-glucose transporter STAR2 (PMID:19244140). The
  nickel claim rests on one fitness phenotype of a Klebsiella homolog that is itself inside the
  FetB equivalog, and the call's own reasoning states that nickel sensitivity does not identify
  the substrate. GOA for G1FE25 holds only membrane and plasma membrane (IEA).
