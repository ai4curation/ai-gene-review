    supporting_text: >-
      When expressed together in Xenopus laevis oocytes, STAR1/2 shows efflux transport
      activity specific for UDP-glucose.
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0140359
    label: ABC-type transporter activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and novel. The query is a full-length UPF0014 permease encoded
      next to an ABC ATP-binding protein 47% identical to E. coli FetA, the same two-gene
      organisation as E. coli fetAB and rice STAR1/STAR2. GOA for G1FE25 has no
      molecular-function annotation. For a permease subunit the term should carry the
      contributes_to qualifier, since the activity belongs to the permease/ATPase complex.
    supported_by:
    - reference_id: file:LACLL/ybbM/ybbM-bioinformatics/RESULTS.md
      supporting_text: >-
        The query has the FetA-FetB-type two-gene organisation, so it is most likely the
        permease of a FetAB-like ABC transporter.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0006826
    label: iron ion transport
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Plausible but not established. The only experimental basis for iron as the family's
      substrate is E. coli FetAB, where overexpression lowered intracellular iron by 37% in a
      Δfur strain; no direct transport assay was done (PMID:24038693). The query is 59%
      identical to E. coli FetB but falls below the trusted cutoff of the FetB equivalog
      TIGR00245, and a distant member of the family (rice STAR2) transports UDP-glucose
      (PMID:19244140). The call itself labels iron export putative; the GO extraction kept the
      term at medium confidence without that hedge.
    supported_by:
    - reference_id: PMID:24038693
      supporting_text: >-
        intracellular iron levels in the Δfur strain are decreased by 37% by fetA and fetB
        overexpression
    - reference_id: file:LACLL/ybbM/ybbM-bioinformatics/RESULTS.md
      supporting_text: >-
        The query is therefore FetB-like but outside the FetB equivalog as NCBIfam defines it.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:1990532
    label: stress response to nickel ion
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Not supported for this protein. The term rests on one Fitness Browser phenotype of the
      Klebsiella michiganensis M5al homolog (58.1% identical; fitness -3.08 in 1.5 mM NiCl2),
      with no cofitness support. That homolog is inside the proteobacterial FetB equivalog and
      the query is not, so the phenotype does not transfer across the boundary with any
      confidence. Nickel sensitivity of a transporter mutant can be an indirect effect, as the
      call's own reasoning notes when it rejects nickel export. Nickel was among the metals
      tested for E. coli FetAB, and iron, not nickel, was identified as the likely substrate
      (PMID:24038693).
    supported_by:
    - reference_id: file:LACLL/ybbM/ybbM-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: >-
        nickel-specific export is rejected because nickel sensitivity does not identify the
        transported substrate.
    - reference_id: PMID:24038693
      supporting_text: >-
        We investigated various metals to identify iron as the likely substrate of this
        transporter.
