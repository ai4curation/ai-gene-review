      this entry, EC 4.6.1.22, which is the crRNA-processing activity; that omission is
      corrected by the NEW GO:0004521 row below rather than by editing this one.
    supported_by:
    - reference_id: PMID:26422227
      supporting_text: Cpf1 is a single RNA-guided endonuclease lacking tracrRNA, and it
