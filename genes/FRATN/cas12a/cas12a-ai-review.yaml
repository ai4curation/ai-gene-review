gene_symbol: cas12a
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:401614
  label: Francisella tularensis subsp. novicida U112
description: >-
  Cas12a (Cpf1) is the single-protein effector of the class 2, type V-A CRISPR-Cas
  adaptive immune system of Francisella tularensis subsp. novicida U112, and the
  founding member of the Cas12a family. It is a 1300-residue bilobed enzyme in which
  an alpha-helical recognition lobe and a nuclease lobe, joined by a discontinuous
  wedge domain, enclose a central channel that holds the CRISPR RNA (crRNA) and the
  crRNA-target DNA heteroduplex. The protein combines in one polypeptide the two
  activities that other CRISPR-Cas types distribute across several proteins. First,
  it matures its own guide, cleaving the precursor crRNA transcribed from the CRISPR
  array just upstream of a hairpin formed by the repeat, requiring no tracrRNA and no
  dedicated Cas6-type ribonuclease, by an intramolecular transesterification in which
  the 2'-hydroxyl of the upstream ribonucleotide attacks the scissile phosphate to
  leave a 2',3'-cyclic phosphate. Second, loaded with the mature crRNA, it searches
  duplex DNA for a 5' T-rich protospacer adjacent motif (TTN in this organism), unwinds
  the target, forms an R-loop in which the crRNA base-pairs with the target strand,
  and cleaves both strands to leave a staggered double-strand break with a 5-nucleotide
  5' overhang. Both strands are cut in a single RuvC-type active site assembled from
  three dispersed sequence motifs; the protein has no HNH domain, the second nuclease
  domain used by Cas9. Cleavage requires a divalent cation, Mg2+ or Ca2+. The
  biological output is sequence-programmed destruction of invading DNA, so that a cell
  carrying the locus with a matching spacer resists transformation by the corresponding
  plasmid. Because recognition is programmed entirely by the spacer content of the
  array, the specificity of the enzyme is heritable and adaptive rather than intrinsic
  to the protein sequence.
existing_annotations:
- term:
    id: GO:0004530
    label: deoxyribonuclease I activity
  evidence_type: EXP
  original_reference_id: PMID:28431230
  qualifier: enables
  review:
    summary: >-
      The underlying experiment is sound: Swarts et al. measured crRNA-guided cleavage
      of both strands of a duplex DNA target by FnCas12a and mapped the active site by
      mutagenesis. The term chosen is not. GO:0004530 is the GO term for EC 3.1.21.1,
      deoxyribonuclease I, whose definition is the generic DNase I reaction
      ("endonucleolytic cleavage of DNA to 5'-phosphodinucleotide and
      5'-phosphooligonucleotide end products"). DNase I is a non-specific nuclease and
      the dinucleotide-product clause is a property of that enzyme, not of Cas12a.
      GO:1990238 double-stranded DNA endonuclease activity states what was actually
      measured, internal breaks in both strands of a DNA duplex, without importing a
      product specification that does not apply.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:1990238
      label: double-stranded DNA endonuclease activity
    reason: >-
      Term substitution only; the activity, the gene and the evidence are unchanged.
      The guide dependence that actually distinguishes Cas12a from a generic
      double-strand endonuclease has no GO molecular-function term at all, and is
      raised in proposed_new_terms rather than smuggled into an existing id.
    supported_by:
    - reference_id: PMID:28431230
      supporting_text: the R-loop complex structure reveals the strand displacement
        mechanism that facilitates guide-target hybridization and suggests a mechanism
        for double-stranded DNA cleavage involving a single active site
    - reference_id: PMID:28431230
      supporting_text: The complete loss of target strand DNA cleavage observed for the
        E1006Q mutant (Figure 5B) suggests that the RuvC domain is not simply required
        for proper coordination of target strand, but that instead it directly catalyzes
        target strand cleavage.
    - reference_id: PMID:26422227
      supporting_text: Third, Cpf1 introduces a staggered DNA double stranded break with
        a 4 or 5-nt 5′ overhang.
