- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:27096362
  qualifier: enables
  review:
    summary: >-
      FnCas12a is a dual nuclease: besides cleaving target DNA it processes its own
      precursor crRNA, cleaving upstream of the hairpin formed within the CRISPR repeat.
      This is a separate activity at a separate site, it needs no tracrRNA and no
      Cas6-type ribonuclease, and it is the activity behind the second EC number on the
      UniProt entry, EC 4.6.1.22.
    action: NEW
    reason: >-
      UniProt assigns EC 4.6.1.22 to this entry with experimental evidence, but the
      EC-to-GO pipeline produced a row only for the DNase EC, so GOA records none of
      the crRNA-maturation activity. GO:0004521 is the correct level of specificity for
      two reasons. It is defined without reference to mechanism ("cleavage of ester
      linkages within ribonucleic acid by creating internal breaks") and it descends
      from GO:0004519 endonuclease activity and GO:0004540 RNA nuclease activity rather
      than from a hydrolase parent. Its children GO:0016891 and GO:0016892 would both be
      wrong, because each stipulates a hydrolytic mechanism, whereas this reaction is a
      metal-independent intramolecular transesterification leaving a 2',3'-cyclic
      phosphate. Asserted here rather than left to the EC pipeline because the activity
      is directly demonstrated for this protein, is mechanistically separable from the
      DNase activity by mutagenesis, and is what makes the type V-A system
      self-sufficient for crRNA biogenesis.
    supported_by:
    - reference_id: PMID:27096362
      supporting_text: We show that type V-A Cpf1 from Francisella novicida is a
        dual-nuclease that is specific to crRNA biogenesis and target DNA interference.
    - reference_id: PMID:27096362
      supporting_text: Cpf1 uses distinct active domains for both nuclease reactions and
        cleaves nucleic acids in the presence of magnesium or calcium.
    - reference_id: PMID:28431230
      supporting_text: Combined, these results demonstrate that pre-crRNA processing by
        FnCas12a proceeds through a metal-independent catalytic mechanism involving a
        nucleophilic attack on the scissile phosphate by the 2’-hydroxyl of the upstream
        ribonucleotide.
    - reference_id: PMID:26422227
      supporting_text: indicating that FnCpf1 and its CRISPR array are the only elements
