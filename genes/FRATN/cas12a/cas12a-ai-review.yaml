core_functions:
- description: >-
    Matures its own CRISPR guide, cleaving the precursor crRNA transcribed from the
    CRISPR array immediately upstream of the hairpin formed within the repeat, in a
    reaction that needs no tracrRNA, no Cas6-type ribonuclease and no other element of
    the locus. Catalysis is an intramolecular transesterification in which the
    2'-hydroxyl of the upstream ribonucleotide attacks the scissile phosphate, leaving a
    2',3'-cyclic phosphate on the 5' product; the site is separate from the DNA-cleaving
    RuvC site and recognition depends on the structure of the repeat hairpin rather than
    on the spacer sequence. This is the activity UniProt records as EC 4.6.1.22.
