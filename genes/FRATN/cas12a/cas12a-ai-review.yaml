- term:
    id: GO:0099048
    label: CRISPR-cas system
  evidence_type: IMP
  original_reference_id: PMID:26422227
  qualifier: involved_in
  review:
    summary: >-
      The native biological process. The FnCas12a locus, reconstituted in E. coli,
      blocks transformation by plasmids carrying a sequence matching a spacer in its
      array, and the same locus processes its own crRNA. Cas12a performs two of the
      three stages that GO:0099048 names, crRNA biogenesis and target interference,
      so the gene product does the work of the process rather than merely being
      required for it.
    action: NEW
    reason: >-
      GOA holds no biological-process annotation for this entry at all. GO:0099048 is
      the term GO provides for this system and its definition names the three stages
      explicitly; its only parent is GO:0099046 and it has no children, so there is no
      more specific alternative. Evidence is IMP because the demonstration is a
      loss/gain-of-interference phenotype in a heterologous reconstitution, which is
      how UniProt also records it ("formally showing it is responsible for plasmid
      immunity"). GO:0051607 defense response to virus is deliberately NOT proposed for
      this entry: no phage-challenge data for FnCas12a appears in the cited literature,
      only plasmid interference. The Acidaminococcus ortholog has phage data and carries
      that term.
    supported_by:
    - reference_id: PMID:26422227
      supporting_text: Here we show that Cpf1-containing CRISPR-Cas loci of Francisella
        tularensis subsp. novicida U112 encode functional defense systems capable of
        mediating plasmid interference in bacterial cells guided by the CRISPR spacers.
    - reference_id: PMID:26422227
      supporting_text: the results of the depletion assay clearly indicate that
        heterologously expressed Cpf1 loci are capable of efficient interference with
        plasmid DNA
