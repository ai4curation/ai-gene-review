proposed_new_terms:
- proposed_name: guide RNA-dependent nucleic acid endonuclease activity
  proposed_definition: >-
    Catalysis of the cleavage of ester linkages within a nucleic acid molecule by
    creating internal breaks, where the position of cleavage is determined by base
    pairing between the substrate and a separate guide RNA bound non-covalently by the
    enzyme. The guide RNA is neither substrate nor product; it programs the sequence
    specificity of an enzyme whose active site is otherwise sequence-non-specific, so
    that the specificity of the catalysis is a property of the bound guide rather than of
    the protein.
  proposed_parent:
    id: GO:0004519
    label: endonuclease activity
  justification: >-
    GO has no molecular-function term for guide-RNA-programmed target recognition or
    cleavage. Checked against the current GO release: no molecular-function label
    contains "RNA-guided", "guide RNA" or "CRISPR". The consequence is that every CRISPR
    effector, and every other guide-dependent nuclease, can only be annotated with a term
    that describes its chemistry (GO:0004520, GO:0004521, GO:0004530, GO:1990238) and is
    therefore indistinguishable in GO from an unguided nuclease of the same chemistry.
    For Cas12a this is the single most important thing about the protein, since the
    sequence it cuts is set by the spacer content of the CRISPR array, is heritable, and
    changes without any change to the protein. Two children are needed, guide
    RNA-dependent DNA endonuclease activity (Cas9 and Cas12 families) and guide
    RNA-dependent RNA endonuclease activity (Cas13 and type III effectors), and the
    parent would also accommodate class 1 multi-subunit effectors through contributes_to.
    This request is deliberately scoped to the nuclease function rather than to
    recognition in general, so that catalytically dead guide-loaded effectors are handled
    by a binding term instead.
  supported_by:
  - reference_id: PMID:26422227
    supporting_text: Cpf1 is a single RNA-guided endonuclease lacking tracrRNA, and it
      utilizes a T-rich protospacer-adjacent motif. Moreover, Cpf1 cleaves DNA via a
      staggered DNA double-stranded break.
  - reference_id: PMID:28431230
    supporting_text: >-
      The CRISPR-associated protein Cas12a (Cpf1), which has been repurposed for genome
      editing, possesses two distinct nuclease activities: endoribonuclease activity for
      processing its own guide RNAs and RNA-guided DNase activity for target DNA cleavage.
suggested_questions:
- question: >-
    Are the spacers in the native Francisella novicida U112 CRISPR array derived from
    phage, from plasmids, or from both? All interference data for this protein come from
    heterologous reconstitution in E. coli with engineered spacers, so the invaders this
    system actually defends against in its own host are unknown.
- question: >-
    Does FnCas12a show the target-activated, substrate-non-specific trans-ssDNase
    reported for the Acidaminococcus, Lachnospiraceae and Moraxella orthologs, and if so
    does trans cleavage contribute anything to immunity in a native host, or is it an in
    vitro consequence of an exposed RuvC site?
- question: >-
    Is the divalent cation required for pre-crRNA processing catalytic or structural?
    PMID:27096362 reports cleavage in Mg2+ or Ca2+ and UniProt records a cation
    requirement, whereas PMID:28431230 finds the catalytic step metal-independent and
    attributes the cation requirement to ordering of the crRNA pseudoknot.
- question: >-
    Should GO's molecular-function hierarchy acquire a guide-RNA-dependent branch, and if
    so should the guide dependence be modelled as a distinct function or as an extension
    on an existing nuclease term?
suggested_experiments:
- description: >-
    Delete cas12a and the CRISPR array in Francisella novicida U112 itself and challenge
    with phages and conjugative plasmids isolated from the same environment, to establish
    what the native system defends against rather than what it can be programmed to cut.
- description: >-
    Assay purified FnCas12a for target-activated trans cleavage of a fluorophore-quencher
    ssDNA reporter, side by side with AsCas12a as a positive control, to settle whether
    the collateral activity is general to the family or ortholog-specific.
- description: >-
    Small-RNA sequencing of Francisella novicida U112 across growth conditions and under
    phage challenge, to measure whether crRNA maturation by Cas12a is constitutive or
    induced, and whether the 5' and 3' ends match those produced in vitro.
- description: >-
    Single-molecule FRET on the FnCas12a R-loop with wild-type, E1006Q and Nuc-domain
    mutants, to resolve directly whether target- and non-target-strand cleavage occur
    sequentially in one RuvC site or in two sites, which is the disagreement between
    PMID:27114038 and PMID:28431230.
