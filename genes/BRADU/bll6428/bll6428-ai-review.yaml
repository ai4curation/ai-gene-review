  label: Bradyrhizobium diazoefficiens USDA 110
description: Bll6428 is an alpha/beta-fold hydrolase of the FrsA-like family in an aromatic-compound
  catabolic locus of Bradyrhizobium diazoefficiens USDA 110. It is closely related to Herbaspirillum
  FdeB, but exact ester-versus-carbon-carbon bond specificity and the proposed flavonoid-derived
  lactone substrate remain unresolved. Its S9-like catalytic-domain annotation does not independently
  establish physiological peptide hydrolysis.
