  label: Bradyrhizobium diazoefficiens USDA 110
description: bll6428 is a FrsA-like alpha/beta-fold hydrolase candidate in a conserved aromatic-compound
  catabolic locus. It is related to FdeB proteins proposed to act in the lower naringenin-degradation
  pathway. Its physiological substrate and ester-versus-carbon-carbon bond specificity remain unresolved,
  and no peptidase activity has been demonstrated.
