  supporting_entities:
  - PANTHER:PTN007719808
  - UniProtKB:P04335
  review:
    action: ACCEPT
    summary: Broad hydrolysis is supported without choosing an untested substrate or bond class.
    reason: The PAINT IBD PTN007719808 is grounded in the FrsA seed P04335 and agrees with target
      alpha/beta-hydrolase and FrsA-like family architecture. The lineage loss check found no IRD/IKR.
      Family members include ester and carbon-carbon hydrolases, so the broad parent remains the
      most secure shared activity; it is not refined solely from KEGG R13077.
    supported_by: *id001
