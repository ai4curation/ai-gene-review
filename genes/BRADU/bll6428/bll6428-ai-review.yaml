  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The S9-like catalytic fold does not establish peptide-bond hydrolysis.
    reason: The source maps a catalytic-domain signature shared with non-peptidase hydrolases. Family-level
      FrsA-like architecture and 81.0% aligned identity to FdeB favor a small-molecule hydrolase
      in this catabolic locus. These are reasons to regard physiological peptidase/proteolysis specificity
      as over-annotation, not a negative peptide assay or demonstrated evolutionary loss. The exact
      native bond and substrate remain untested.
