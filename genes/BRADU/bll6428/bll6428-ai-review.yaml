    id: GO:0052689
    label: carboxylic ester hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028109
  review:
    action: UNDECIDED
    summary: Ester versus carbon-carbon hydrolysis is not resolved by the available family evidence.
    reason: FrsA-like classification and FdeB locus homology make ester hydrolysis plausible, but
      do not distinguish it from carbon-carbon hydrolysis in this mixed hydrolase family. KEGG R13077
      is a predicted lactone reaction, not an independently measured USDA110 substrate. Retain uncertainty
      rather than accept ARBA specificity from the family label or reject a chemically plausible
      reaction.
    supported_by: *id001
