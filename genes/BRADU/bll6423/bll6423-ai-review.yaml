  label: Bradyrhizobium diazoefficiens USDA 110
description: Bll6423 is a cupin type-2 protein in a conserved aromatic-compound catabolic locus of
  Bradyrhizobium diazoefficiens USDA 110. It is related to Herbaspirillum FdeH. Cupins in the related
  Variovorax isoflavone pathway catalyze downstream intermediate conversion, but the substrate and
  biochemical contribution of Bll6423 have not been established; it is not known to be an obligatory
  ring-cleavage partner.
