knowledge_gaps:
- gap_statement: The molecular activity and native substrate of bll6423 are unknown despite conserved
    family and locus membership.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  boundary: >-
    Conserved locus and protein-family evidence support a candidate relationship to Fde proteins;
    they do not demonstrate a naringenin-specific route, interchangeable Ifc activity, or every
    predicted late reaction. An OpenScientist run (kgap-bll6423-cupin-metal-site) constrains this
    protein in two directions at once, and the negative half is the more useful. The canonical cupin
    metal site is absent, and absent completely rather than degenerate: both consensus motifs fail to
    match the 194-residue sequence, there is no His-x-His pair at any position, and the local UniProt
    record carries no binding feature, no metal annotation and no cofactor comment. A geometric
    metal-site detector returns zero clusters both for a predicted model of this protein and for a
    1.91 Angstrom experimental structure of a 37.9 per cent identical relative whose only heteroatoms
    are a chloride and waters. Crucially the run benchmarked that detector before trusting its zero,
    on 88 experimentally determined cupin chains: it fires on 75 of them, finds a bound transition
    metal in 47 of 48 cases, and places its centroid a median 1.40 Angstrom from the nearest metal,
    so a cupin chain returning zero has no site, with a measured error rate rather than an
    unquantified absence. This protein has in fact gone further than its own clade, since the
    His-x-His pair that FdeH, VirC and StrC still carry, and which sits empty even where it is kept,
    is replaced here by Pro70 and Thr73. The positive half is a subfamily placement with a large
    effect size and a conserved ligand pocket. Ranked against all 1001 reviewed members of the
    RmlC-like cupin superfamily with a length-calibrated null, the nine highest-scoring proteins are
    all virC/oryJ-clade cupins with no annotated cofactor, while the best metal-dependent cupin
    enzyme anywhere in that set falls 33.1 standard deviations below the top clade hit, with oxalate
    decarboxylase and quercetin dioxygenase lower still. Dioxygenase, decarboxylase,
    phosphoglucose-isomerase-like and epimerase readings are therefore specifically disfavoured
    rather than merely unsupported. What is conserved is a buried cavity of 141 cubic Angstrom,
    within 10 per cent of the pocket that holds a real ligand in the closest structurally
    characterised relative, lined by His123, Asp129, His162 and Trp164, which map one for one onto
    the four residues contacting a bound cyclohexenone in that relative's structure. On the
    Herbaspirillum comparison the run removes the same prop it removed for the operon neighbour:
    FdeH is Hsero_1010, it has no reaction assigned anywhere in the characterised pathway, it was
    never mutated and never assayed, and its UniProt entry carries no EC number, cofactor or binding
    site. This protein is its direct ortholog at 67.0 per cent identity over 188 residues, so it is
    the syntenic equivalent of FdeH and not of another cistron, and that equivalence transfers
    nothing about chemistry. No substrate can be named. What survives is that if there is a reaction
    at all it is an intramolecular rearrangement on a small cyclic molecule performed without a
    metal, and non-catalytic small-molecule binding remains a live reading. No metal-dependent
    catalytic term should be carried for this protein. Verified here against this entry's own
    record, which is 194 residues: His123, Asp129, His162, Trp164, Pro70 and Thr73, the absence of
    any His-x-His pair anywhere in the sequence confirmed independently, and the absence of binding,
    metal and cofactor annotation. Not reproduced here: the motif scans, the structural metal-site
    detection and its 88-chain benchmark, the 1001-protein ranking and its null, the cavity volume
    measurement and the mapping onto the relative's ligand contacts.
  significance: Substrate divergence and uncertain partners prevent assigning complete native pathway
    capability.
  resolution: Compare target activity on defined flavonoid/isoflavone and alternative family substrates,
    then connect product identification to native gene perturbation and metabolite profiles.
