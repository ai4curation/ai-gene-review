references:
- id: file:BRADU/bll6423/bll6423-hypotheses/kgap-bll6423-cupin-metal-site/openscientist.md
  title: OpenScientist analysis of the bll6423 cupin metal site and subfamily placement
  findings:
  - statement: >-
      The canonical cupin metal site is completely absent, not degenerate: both consensus motifs fail,
      no His-x-His pair exists anywhere, the record carries no metal or cofactor annotation, and a
      geometric detector returns zero clusters for both a predicted model and an experimental structure
      of a 37.9 per cent identical relative. That negative was benchmarked on 88 cupin chains before
      being trusted, firing on 75 and finding a metal in 47 of 48. The protein has gone beyond its own
      clade, the His-x-His pair kept by FdeH, VirC and StrC being replaced by Pro70 and Thr73. The
      subfamily is the metal-free virC/oryJ clade, 33.1 standard deviations above the best
      metal-dependent cupin enzyme in a 1001-protein ranking, so dioxygenase, decarboxylase,
      isomerase-like and epimerase readings are specifically disfavoured. What is conserved is a
      141 cubic Angstrom ligand pocket lined by His123, Asp129, His162 and Trp164. FdeH itself has no
      assigned reaction, was never assayed, and carries no EC number, so the syntenic equivalence
      transfers no chemistry.
    supporting_text: >-
      A cupin chain that returns zero has no site.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Verified against this entry's own 194-residue UniProt record: His123, Asp129, His162, Trp164,
      Pro70 and Thr73; the absence of any His-x-His pair anywhere in the sequence, confirmed
      independently here; and the absence of binding, metal and cofactor annotation. Not reproduced
      here: the motif scans, the structural metal-site detection and its 88-chain benchmark, the
      1001-protein ranking and its null model, the cavity volume and the mapping onto the relative's
      ligand contacts. The benchmark is what makes the negative usable, since it gives the zero result
      a measured error rate rather than leaving it as an unquantified absence.
