  label: Bradyrhizobium diazoefficiens USDA 110
description: Bll6427 is a metal-binding VOC-superfamily protein of Bradyrhizobium diazoefficiens
  USDA 110. Whole-protein similarity to Herbaspirillum FdeC and conserved catabolic-locus context
  support an inferred aromatic-ring dioxygenase activity. Its physiological substrate, cleavage position
  and metal identity are untested. The shared glyoxalase-I signature also produces a lactoylglutathione-lyase
  prediction whose substrate specificity remains unresolved.
