knowledge_gaps:
- gap_statement: The physiological substrate and native catabolic contribution of USDA110 bll6427
    remain unresolved.
  gap_kind:
  - BIOLOGY
  status: OPEN
  boundary: Conserved locus and protein-family evidence support a candidate relationship to Fde proteins;
    they do not demonstrate a naringenin-specific route, interchangeable Ifc activity, or every predicted
    late reaction.
  significance: Substrate divergence and uncertain partners prevent assigning complete native pathway
    capability.
  resolution: Compare target activity on defined flavonoid/isoflavone and alternative family substrates,
    then connect product identification to native gene perturbation and metabolite profiles.
  provenance:
  - reference_id: file:analysis/module_audits/bacterial_flavonoid_degradation/bradu-panel/source-evidence.md
    supporting_text: although their functions in these organisms remain unknown
suggested_questions:
- question: Does this USDA110 locus act on naringenin, isoflavones, another aromatic substrate, or
