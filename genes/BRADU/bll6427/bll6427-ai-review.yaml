  review:
    action: ACCEPT
    summary: Metal-dependent VOC catalytic architecture supports broad metal-ion binding.
    reason: Both the glyoxalase-I interpretation and the FdeC-like extradiol-dioxygenase interpretation
      entail a metal-dependent catalytic scaffold. The conserved VOC domain and signature support
      the broad binding claim, while neither iron identity nor stoichiometry is established for this
      target.
    supported_by: &id004
    - *id001
    - *id002
    - &id003
      reference_id: PMID:27059806
      supporting_text: that is subsequently dioxygenated and cleaved at the A-ring by the FdeC dioxygenase,
        since the latter compound accumulated in the fdeC strain.
- term:
    id: GO:0016702
    label: oxidoreductase activity, acting on single donors with incorporation of molecular oxygen,
      incorporation of two atoms of oxygen
  evidence_type: ISS
  original_reference_id: PMID:27059806
  supporting_entities:
  - UniProtKB:D8J0W7
  qualifier: enables
  review:
    action: NEW
    summary: Infer an oxygen-incorporating ring-cleavage activity from the FdeC homolog and target
      architecture.
    reason: The target aligns to genetically characterized HERSS FdeC with 59.9% identity across
      96.8% of its residues, shares the VOC scaffold, and occupies the corresponding conserved catabolic
      locus. FdeC-mutant accumulation of the hydroxylated precursor supports oxygenolytic ring cleavage
      together with its extradiol architecture. This supports a reaction-class ISS inference without
      requiring a purified BRADU assay. It does not establish exact substrate, product, metal, or
      native pathway flux, nor refute the unresolved glyoxalase-I prediction. No original row or
      proposed term is an ancestor or descendant of this dioxygenase class.
    supported_by:
    - *id001
    - *id002
    - *id003
