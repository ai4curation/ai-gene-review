  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018146
  review:
    action: UNDECIDED
    summary: Glyoxalase-I substrate specificity is unresolved in this FdeC-related VOC protein.
    reason: IPR018146 is a glyoxalase-I signature, and glyoxalase I genuinely belongs to the VOC
      superfamily. This is not the unrelated glyoxalase-II fold error found in the HERSS submitter
      record. Whole-protein similarity to FdeC and catabolic-locus context favor a ring-cleavage
      role, but neither evidence proves absence of lactoylglutathione-lyase activity. No target assay
      or discriminatory substrate analysis resolves the competing assignments.
