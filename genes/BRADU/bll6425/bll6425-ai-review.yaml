  label: Bradyrhizobium diazoefficiens USDA 110
description: Bll6425 is a predicted FAD-dependent, NAD(P)H-utilizing monooxygenase of Bradyrhizobium
  diazoefficiens USDA 110, encoded in an aromatic-compound catabolic locus related to the Herbaspirillum
  fde locus. Sequence and domain evidence support the oxygen-incorporating reaction class. Its physiological
  substrate, hydroxylation position and NADH-versus-NADPH preference are unresolved; related flavonoid
  monooxygenases differ in substrate range.
