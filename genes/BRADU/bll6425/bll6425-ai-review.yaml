    reason: The reaction-class inference combines target domains with 54.2% aligned identity to the
      experimentally characterized FdeE over 99.7% of target residues. HERSS FdeE and Variovorax
      IfcA establish this class but differ in substrate range; no exact naringenin or isoflavone
      substrate, hydroxylation position, or exclusive NADPH preference is asserted for USDA110.
