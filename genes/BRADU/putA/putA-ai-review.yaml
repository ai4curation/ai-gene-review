  review:
    summary: The FAD-containing PRODH module couples proline oxidation to quinone reduction.
    action: ACCEPT
    reason: GO:0004657 specifies L-proline + quinone to P5C + quinol; FAD is the internal redox cofactor,
      not the net terminal acceptor. The BjPutA structure and kinetics establish the first proline-oxidation
      step. Its quinone-coupled assignment is supported by the characterized PutA reaction class and comparative
      mechanistic synthesis; the accessible 2010 abstract does not specify the acceptor used in every
      kinetic experiment, and no native quinone-species preference is asserted.
    supported_by:
    - reference_id: PMID:20133651
      supporting_text: 'catalyzes the oxidation of proline to glutamate via the sequential activities
        of

        FAD-dependent proline dehydrogenase (PRODH) and NAD(+)-dependent

        Delta(1)-pyrroline-5-carboxylate dehydrogenase (P5CDH) domains.'
      full_text_unavailable: true
    - reference_id: PMID:28712849
      supporting_text: The PRODH module of PutA contains an FAD cofactor that couples the oxidation of
        proline (reductive half-reaction) to the reduction of ubiquinone in the membrane (oxidative half-reaction)
        [45].
