- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:20133651
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q89E26
  review:
    summary: Purified BjPutA forms a domain-swapped dimer-based tetramer.
    action: KEEP_AS_NON_CORE
    reason: 'The cited target study directly establishes self-association by crystallography and solution
      methods. Retain this precise interaction claim as a structural property alongside the catalytic
      core. The self accession is the interacting species, not circular evidence. Dimer contacts help
      enclose the channel, but engineered dimers retain catalytic activity: the documented tetramer must
      not become an obligatory catalytic or native-assembly requirement.'
    supported_by:
    - reference_id: PMID:20133651
      supporting_text: 'PutA forms a ring-shaped tetramer in

        solution having a diameter of 150 A.'
      full_text_unavailable: true
    - reference_id: PMID:28712849
      supporting_text: Recently, Korasick and coworkers showed that engineered dimeric forms of BjPutA
        retain full catalytic activity, suggesting that tetramerization is not essential for in vitro
        activity [33].
- term:
    id: GO:0055129
    label: L-proline biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005933
  - UniRule:UR000172770
  review:
    summary: The characterized reaction consumes proline and produces glutamate; it does not synthesize
      proline.
    action: REMOVE
    reason: GO:0055129 denotes formation of L-proline. PutA catalyzes the opposite catabolic sequence
      and channels P5C/GSAL toward oxidation to glutamate. Sharing this intermediate with proline biosynthesis
      does not make the catabolic enzyme a participant in that biosynthetic process. The IPR005933/UniRule
      mapping is therefore a pathway-direction error, not evidence for a second physiological biosynthetic
      activity.
    supported_by:
    - reference_id: PMID:20133651
      supporting_text: 'catalyzes the oxidation of proline to glutamate via the sequential activities
        of

        FAD-dependent proline dehydrogenase (PRODH) and NAD(+)-dependent

        Delta(1)-pyrroline-5-carboxylate dehydrogenase (P5CDH) domains.'
      full_text_unavailable: true
    - reference_id: PMID:27679491
      supporting_text: Furthermore, P5C/GSAL is also the intermediate of proline biosynthesis, so channeling
        provides a mechanism for segregating catabolism and biosynthesis ( 21 ).
