id: Q89E26
gene_symbol: putA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224911
  label: Bradyrhizobium diazoefficiens USDA 110
description: PutA of Bradyrhizobium diazoefficiens USDA110 is a 999-residue bifunctional proline-catabolic
  flavoenzyme. Its FAD-containing proline dehydrogenase module oxidizes L-proline to pyrroline-5-carboxylate,
  coupled to quinone reduction; its NAD+-dependent glutamate-semialdehyde dehydrogenase module produces
  L-glutamate. A protected interdomain channel favors transfer of the reactive intermediate. Purified
  recombinant BjPutA forms domain-swapped dimers assembled into tetramers, although tetramerization is
  not essential for in-vitro catalysis. This type A architecture lacks the additional RHH regulatory domain
  of trifunctional PutAs.
