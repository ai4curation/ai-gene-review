- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000193023
  - UniProtKB:P09546
  review:
    summary: The quinone-coupled enzyme is inferred to act at the cytoplasmic face of the bacterial plasma
      membrane.
    action: ACCEPT
    reason: The conserved peripheral-membrane PutA mechanism couples cytoplasmic proline oxidation to
      membrane quinones. The soluble catalytic architecture and quinone reaction support the active membrane
      face as a mechanistic inference, consistent with the existing source assertion. The crystal structure
      and soluble biochemical assays are not direct native localization measurements; constitutive membrane
      residence, transmembrane transport, and the E. coli RHH-dependent regulatory switch are not inferred.
      No IRD/IKR loss was found in the cached PAINT lineage; retaining this location does not claim the
      donor experiments were performed in USDA110.
    supported_by:
    - reference_id: PMID:28712849
      supporting_text: Bifunctional PutAs must interact with the membrane to couple electron transfer
        from proline to quinone electron acceptors in the membrane, thus completing the proline:ubiquinone
        oxidoreductase catalytic cycle.
    - reference_id: PMID:20133651
      supporting_text: 'catalyzes the oxidation of proline to glutamate via the sequential activities
        of

        FAD-dependent proline dehydrogenase (PRODH) and NAD(+)-dependent

        Delta(1)-pyrroline-5-carboxylate dehydrogenase (P5CDH) domains.'
      full_text_unavailable: true
