- id: file:BRADU/bll6421/bll6421-hypotheses/kgap-bll6421-reaction-class/openscientist.md
  title: OpenScientist analysis of the bll6421 reaction class and cofactor
  findings:
  - statement: >-
      The catalytic set is complete and of the epimerase/reductase type: Ser117, Tyr140 and Lys144 in
      the YxxxK arrangement, with the 4,6-dehydratase acid-base pair replaced by Ile118 and Ala119 at a
      column that carries a glutamate in 46 of 46 reviewed NDP-sugar 4,6-dehydratases and none of 235
      4-epimerases. The cofactor is NAD rather than the ARBA-asserted NADP. The nucleotide-sugar
      subsite is absent rather than merely eroded, by a margin a divergence-matched control shows is
      not explained by distance from the reference enzyme. The protein is the syntenic equivalent of
      FdeJ, but FdeJ was never assayed and its own EC assignment is automatic annotation, so no
      activity transfers. The reaction class is transient NAD-dependent oxidation of a secondary
      alcohol; the substrate is unconstrained.
    supporting_text: >-
      the chemistry narrows, the substrate does not, and no compound should be named in a GO
      annotation
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      All sixteen positions the argument rests on were checked against this entry's own UniProt record
      (312 residues): Asp33, Leu34, Pro77, Arg90, Ser117, Ile118, Ala119, Tyr140, Lys144, Met208,
      Arg267, Thr271, Gly273 and the Rossmann glycines at 7, 10 and 13, with the N-terminal motif
      reading GAGGFIGS and 140-144 reading YGAHK. The NADP keyword was confirmed as
      ECO:0000256|ARBA. Not reproduced here: the superposition distances, the pLDDT values, the clash
      counts, the reviewed-set column tallies and the divergence-matched regression. The cofactor
      argument rests on a predicted model, which is why the keyword question is raised rather than
      filed as a source defect.
knowledge_gaps:
- gap_statement: The molecular activity and native substrate of bll6421 are unknown despite conserved
    family and locus membership.
  gap_kind:
  - BIOLOGY
  status: OPEN
  boundary: >-
    Conserved locus and protein-family evidence support a candidate relationship to Fde proteins;
    they do not demonstrate a naringenin-specific route, interchangeable Ifc activity, or every
    predicted late reaction. An OpenScientist run (kgap-bll6421-reaction-class) splits this gap in
    the same way the run on the operon neighbour bll6422 did, and for the same reason: the chemistry
    narrows well below the family label while the substrate stays unconstrained, and the two halves
    must be read separately. On chemistry, the catalytic set is complete and of the
    epimerase/reductase type rather than the dehydratase type. Ser117, Tyr140 and Lys144 occupy the
    YxxxK arrangement, superposing on the Escherichia coli UDP-glucose 4-epimerase triad within
    1.21, 0.79 and 0.51 Angstrom of CA-CA, with the tyrosine hydroxyl and lysine amine 2.30 and 2.89
    Angstrom from the nicotinamide ribose hydroxyls against 2.87 and 2.84 for the reference enzyme's
    own pair. The 4,6-dehydratase acid-base pair is absent: the glutamate that abstracts the C5
    proton in every characterised dTDP-glucose or GDP-mannose 4,6-dehydratase is replaced by Ala119,
    and the paired aspartate or threonine by Ile118. That column is categorical across the reviewed
    set, a glutamate in 46 of 46 NDP-sugar 4,6-dehydratases and 0 of 235 4-epimerases. The cofactor
    is NAD and not NADP: Asp33 makes the bidentate contact to the adenosine 2' and 3' hydroxyls
    across three independent holo frames, while the pocket that would have to accept a 2'-phosphate
    is lined by Leu34 and five further uncharged residues with the nearest basic side chain almost
    8 Angstrom away. This matters for curation because the NADP keyword on this entry carries
    evidence ECO:0000256|ARBA, an automatic association-rule assertion of the kind this project does
    not treat as support, and the run concludes it should not propagate; that is recorded as a
    question rather than acted on, since the geometry rests on a predicted model. On substrate the
    run is explicit that nothing constrains one, and it forecloses the obvious objection. Of the 23
    residues that contact UDP-glucose in the reference epimerase, this protein keeps 4 by structural
    superposition and 3 by sequence, losing 3 of the 4 charged ligand contacts; holding UDP-glucose
    in the reference pose puts 68 heavy atoms within 2.6 Angstrom of it, against 1 for the reference
    enzyme, and seven of those clashes are main-chain. A divergence-matched control shows this is
    not merely what any distant homolog would give: across 68 reviewed 4-epimerases contact
    conservation tracks identity closely, the fit predicts 8.5 of 23 contacts at this protein's 26
    per cent identity, the observed 3 is a residual of -1.90 standard deviations, and all 15
    reviewed 4-epimerases in the matched 20 to 35 per cent identity band score higher. So the
    nucleotide-sugar subsite is not merely eroded but absent, which removes the nucleotide-sugar
    reading that the family label and the automatic UDP-glucose 4-epimerase annotations suggest,
    without supplying a replacement. On the Herbaspirillum comparison the run also removes a prop
    this gap leaned on: global alignment against every cistron of the fde operon identifies this
    protein as the syntenic equivalent of FdeJ at 50.8 per cent identity, the next-best cistron
    scoring far below, but the defining genetic study mutated only fdeA and fdeR, no assay of FdeJ
    exists, and FdeJ's own EC 5.1.3.2 assignment is automatic genome annotation of exactly the kind
    that produced the label here. A family-level label cannot be inherited from an unassayed
    ortholog. Family ranking places this protein with the epimerases rather than the dehydratases or
    the nucleotide-independent fold members, but the maximum identity to any reviewed enzyme is 33.8
    per cent and the ranking names no compound. The reaction class that survives is transient
    NAD-dependent oxidation of a secondary alcohol by an extended short-chain
    dehydrogenase/reductase fold; the substrate remains unknown and no compound should be named in
    an annotation. Verified here against this entry's own UniProt record, which is 312 residues:
    every one of the sixteen positions the argument rests on, namely Asp33, Leu34, Pro77, Arg90,
    Ser117, Ile118, Ala119, Tyr140, Lys144, Met208, Arg267, Thr271, Gly273 and the Rossmann
    glycines at 7, 10 and 13, with the N-terminal motif reading GAGGFIGS and positions 140 to 144
    reading YGAHK, and the NADP keyword confirmed as ARBA-sourced. Not reproduced here: the
    superposition distances, the pLDDT values, the clash counts, the reviewed-set column counts and
    the divergence-matched regression.
  significance: Substrate divergence and uncertain partners prevent assigning complete native pathway
    capability.
  resolution: Compare target activity on defined flavonoid/isoflavone and alternative family substrates,
    then connect product identification to native gene perturbation and metabolite profiles.
