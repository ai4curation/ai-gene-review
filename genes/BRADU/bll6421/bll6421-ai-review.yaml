suggested_questions:
- question: Does this USDA110 locus act on naringenin, isoflavones, another aromatic substrate, or
    multiple substrates under different conditions?
- question: >-
    Should the NADP keyword on this entry be changed to NAD? A structural analysis of the cofactor
    pocket (kgap-bll6421-reaction-class) places Asp33 in the bidentate contact to the adenosine 2'
    and 3' hydroxyls that marks an NAD-specific enzyme, and finds the 2'-phosphate pocket lined by
    Leu34 and five further uncharged residues with no basic side chain within 8 Angstrom. The
    current keyword carries evidence ECO:0000256|ARBA, an automatic association-rule assertion
    inherited from a family neighbourhood dominated by a different subfamily. This is raised as a
    question rather than filed as a source defect because the geometry rests on a predicted model
    rather than an experimental structure of this protein, and no cofactor has been measured for
    it.
