taxon:
  id: NCBITaxon:224911
  label: Bradyrhizobium diazoefficiens USDA 110
description: Bll6421 is a Rossmann-fold epimerase/dehydratase-family protein in a conserved aromatic-compound
  catabolic locus of Bradyrhizobium diazoefficiens USDA 110. It is related to Herbaspirillum FdeJ,
  but neither a nucleotide-sugar substrate nor the proposed oxaloacetate-releasing flavonoid-intermediate
  reaction has been established for this protein. Its physiological substrate and molecular function
  remain unresolved.
