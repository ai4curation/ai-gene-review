  findings:
  - statement: >-
      Three structural comparisons and a family-wide alignment ranking place bll6422 on the
      carbon-carbon hydrolase side of the fumarylacetoacetate hydrolase superfamily with a
      conserved four-carboxylate metal site, but operon synteny with a naringenin-degradation
      locus and genistein induction do not constrain the substrate.
    supporting_text: >-
      Genomic neighbourhood and flavonoid induction do not constrain the substrate at all.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The 344-residue length, the PF18288, PF01557, SSF56529 and Gene3D FAH assignments, and all
      nine named residues including the four metal-site carboxylates and the catalytic histidine
      were confirmed in the local Q89GC3 record. The superpositions, the family-wide alignment
      ranking and its statistics, the operon coordinates and spacings, the synteny call and the
      expression analysis were not independently recomputed, and the run notes its structural
      statements rest on a predicted model at about 29 per cent identity to the closest
      characterised enzyme.
