  label: Bradyrhizobium diazoefficiens USDA 110
description: Bll6422 is a fumarylacetoacetate-hydrolase-fold enzyme candidate in a conserved aromatic-compound
  catabolic locus of Bradyrhizobium diazoefficiens USDA 110. It is related to FdeI proteins; the
  fold accommodates several reaction classes, and the proposed late flavonoid-intermediate decarboxylation
  and dehydration reactions remain unassigned experimentally. Its native substrate and reaction are
  unknown.
