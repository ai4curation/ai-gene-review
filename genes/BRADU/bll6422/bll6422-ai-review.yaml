  review:
    action: ACCEPT
    summary: FAH-family architecture supports an enzyme, without resolving the reaction class.
    reason: The target has the N-terminal FAA_hydro_N and C-terminal FAH domains and strong full-length
      similarity to Hsero_1011. This supports catalytic activity, but this superfamily includes hydrolases,
      hydratases and decarboxylases. KEGG late-pathway assignments are hypotheses rather than independent
      biochemical evidence, so GO:0003824 is as specific as currently justified.
    supported_by: &id001
