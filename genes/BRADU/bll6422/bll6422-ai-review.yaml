knowledge_gaps:
- gap_statement: The physiological substrate and native catabolic contribution of USDA110 bll6422 remain
    unresolved.
  gap_kind:
  - BIOLOGY
  status: OPEN
  boundary: >-
    Conserved locus and protein-family evidence support a candidate relationship to Fde proteins;
    they do not demonstrate a naringenin-specific route, interchangeable Ifc activity, or every
    predicted late reaction. An OpenScientist run (kgap-bll6422-reaction-and-context) splits this
    gap cleanly: the reaction is now constrained more tightly than a family label would give,
    while the substrate is not constrained at all, and the two halves should be read separately.
    On reaction, bll6422 is a fumarylacetoacetate hydrolase superfamily protein, which the local
    record carries as PF18288 with PF01557, SSF56529 and the FAH C-terminal Gene3D entry. Three
    independent structural comparisons converge on the same four-carboxylate metal site and the
    same catalytic histidine, and the equivalences land on His91, Glu140, Glu142, Asp171, Arg175,
    Lys192, Thr264 and Asp84 of this protein, every one of which was confirmed in the local
    Q89GC3 record. A family-wide alignment ranking across the reviewed members places bll6422 on
    the carbon-carbon hydrolase side of the superfamily rather than the hydratase side, with a
    large effect size, so the predicted reaction is metal-dependent hydrolysis of a
    carbon-carbon bond in a ketonic substrate and the 2-oxopent-4-enoate hydratase assignment
    that RefSeq gives to two shorter paralogs in this genome should not be propagated here. On
    substrate, the run is explicit that nothing it found measures one. The gene sits in an
    eight-gene operon with a divergent LysR regulator that is a gene-for-gene syntenic copy of
    the genetically defined Herbaspirillum naringenin degradation operon, and the operon responds
    to the soybean isoflavone genistein in a way that requires NodW; but no flavonoid has been
    shown to be consumed by this organism, no product of this locus has been assayed, no enzyme
    in the operon is flavonoid-specific by sequence, and the operon lacks the meta-cleavage
    product hydrolase that would name the compound bll6422 receives. So synteny and induction are
    both real and both silent about chemistry. Caveats the run states and that belong with the
    reaction claim: every structural statement rests on a predicted model rather than an
    experimental structure of this protein, the closest characterised enzyme is at about 29 per
    cent identity, which transfers chemistry and not substrate, the induction is roughly
    2.3-fold at operon level from a single laboratory's series with no per-gene significance, and
    the one position with experimental bearing on specificity points at a subfamily whose
    upstream ring-cleavage chemistry this operon does not encode, so that lead is uncorroborated.
  significance: Substrate divergence and uncertain partners prevent assigning complete native pathway
    capability.
  resolution: Compare target activity on defined flavonoid/isoflavone and alternative family substrates,
    then connect product identification to native gene perturbation and metabolite profiles.
  provenance:
  - reference_id: file:analysis/module_audits/bacterial_flavonoid_degradation/bradu-panel/source-evidence.md
    supporting_text: although their functions in these organisms remain unknown
  - reference_id: file:BRADU/bll6422/bll6422-hypotheses/kgap-bll6422-reaction-and-context/openscientist.md
    supporting_text: >-
      Synteny with *fde* and genistein induction are both real and both silent about chemistry.
suggested_questions:
- question: Does this USDA110 locus act on naringenin, isoflavones, another aromatic substrate, or multiple
    substrates under different conditions?
