    summary: Rieske architecture supports [2Fe-2S] cluster binding.
    reason: The compact target has Rieske domain and superfamily classifications and curated sequence-based
      ligand features. These support the cofactor-binding function without identifying an electron
      donor or acceptor. Autonomous NADPH-dependent HERSS FdeE activity does not exclude another
      physiological role for FdeD, but it prevents an obligatory FdeD-to-FdeE assignment from locus
      adjacency alone.
