  label: Bradyrhizobium diazoefficiens USDA 110
description: Bll6426 is a small Rieske [2Fe-2S]-binding protein of Bradyrhizobium diazoefficiens
  USDA 110 encoded in an aromatic-compound catabolic locus. It is related to FdeD, with a plausible
  electron-carrier role, but its donor, acceptor and physiological requirement are unknown. A specific
  electron-transfer partnership with the neighboring monooxygenase Bll6425 has not been demonstrated.
