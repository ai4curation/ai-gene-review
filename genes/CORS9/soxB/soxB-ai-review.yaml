- id: PMID:16934831
  title: Identification of a stable flavin-thiolate adduct in heterotetrameric sarcosine oxidase.
  findings:
  - statement: Mechanistic evidence for sarcosine oxidation at FAD and electron transfer through FMN to oxygen
      in the assembled heterotetramer; beta localization is supported separately by structure.
core_functions:
- description: Supplies the beta-localized catalytic oxidation of sarcosine to its imine at FAD, followed by
    electron transfer through FMN to oxygen, forming hydrogen peroxide within the assembled sarcosine oxidase.
    The proposed imine-forming activity records this catalytic subreaction, not autonomous activity of purified
    beta. The separate contributes_to function records participation in collective enzyme turnover. Subsequent
    alpha-associated folate capture yields glycine and 5,10-methylenetetrahydrofolate; it is excluded from
    the beta-specific proposal. The U-96 structural/kinetic evidence maps the oxidation sites to this beta
    subunit. Isolated beta and beta/delta constructs lacked flavin under the reported U-96 expression conditions,
    so active-site localization does not prove stand-alone turnover.
