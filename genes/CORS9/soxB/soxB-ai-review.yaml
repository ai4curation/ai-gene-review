- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IDA
  original_reference_id: PMID:11902668
  qualifier: enables
  review:
    summary: SoxB binds the non-covalent, substrate-oxidising FAD.
    action: NEW
    reason: Cofactor analysis of the purified enzyme found one non-covalent FAD, and the crystal structure
      places it, with the bound substrate analogue dimethylglycine, in the beta subunit. GO:0050660 is "Binding
      to FAD, flavin-adenine dinucleotide". FAD binding is required for the core catalytic activity.
    supported_by:
    - reference_id: PMID:11902668
      supporting_text: The enzyme was found to contain 1 mol of non-covalently-bound NAD+, 1 mol of non-covalently-bound
        FAD, and 1 mol of covalent FMN.
    - reference_id: PMID:15946648
      supporting_text: The beta subunit contains dimethylglycine, FAD, and FMN, and these flavins are approximately
        10A apart.
- term:
    id: GO:0010181
    label: FMN binding
  evidence_type: IDA
  original_reference_id: PMID:11902668
  qualifier: enables
  review:
    summary: SoxB carries one covalently attached FMN (8-alpha-histidyl) that is reoxidised by oxygen.
    action: NEW
    reason: The covalent flavin, first thought to be FAD, was identified as FMN by mass and sequence analysis
      of the flavin peptide; UniProt records it as a tele-8alpha-FMN histidine. GO:0010181 is "Binding to flavin
      mono nucleotide". Mutation of the adjacent lysine slows FMN reoxidation and lowers activity, so FMN binding
      is part of the core catalytic mechanism.
    supported_by:
    - reference_id: PMID:11902668
      supporting_text: The covalent FMN was identified by the mass and amino acid sequence analyses of the
        flavin peptide.
