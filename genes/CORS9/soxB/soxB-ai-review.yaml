  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified.
- id: PMID:15946648
  title: Crystal structure of heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: SoxB binds dimethylglycine, FAD and FMN about 10 A apart.
    supporting_text: >-
      The beta subunit contains dimethylglycine, FAD, and FMN, and these
      flavins are approximately 10A apart.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified.
- id: PMID:15914915
  title: Corynebacterium sp. U-96 contains a cluster of genes of enzymes for the catabolism of sarcosine to pyruvate.
