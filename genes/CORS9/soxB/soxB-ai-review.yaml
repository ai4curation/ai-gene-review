- proposed_name: sarcosine oxidase (imine-forming) activity
  proposed_definition: Catalysis of oxygen-dependent oxidation of sarcosine to the corresponding sarcosine
    imine, with reduction of molecular oxygen to hydrogen peroxide. In heterotetrameric sarcosine oxidase,
    this catalytic subreaction is localized to beta-bound FAD and FMN and is established in the assembled enzyme.
    It excludes subsequent imine hydrolysis and transfer of the one-carbon fragment to tetrahydrofolate.
  justification: Sarcosine reduces beta-bound FAD to FADH2; the two electrons pass through beta-bound FMN to
    reduce one O2 to H2O2. This defines the oxidation step before alpha-associated processing of the imine.
    GO:0008115 additionally specifies glycine/formaldehyde production, while the separate folate-coupled proposal
    specifies the complete heterotetramer reaction. Neither is a precise name for this beta-localized catalytic
    subreaction. The activity proposal does not assert that an isolated beta preparation is catalytically competent.
    The U-96 structural/kinetic evidence maps the oxidation sites to this beta subunit.
  proposed_parent:
