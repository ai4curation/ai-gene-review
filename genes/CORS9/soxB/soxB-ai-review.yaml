id: Q50LF2
gene_symbol: soxB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31944
  label: Corynebacterium sp. U-96
description: >-
  SoxB is the 405-residue beta subunit and catalytic flavoprotein of the
  cytoplasmic heterotetrameric sarcosine oxidase (SoxABGD) of Corynebacterium
  sp. U-96, a member of the D-amino-acid-oxidase-like SoxB family. It binds one
  non-covalent FAD, at which sarcosine (and the substrate analogues
  dimethylglycine, methylthioacetate and pyrrole-2-carboxylate) binds and is
  oxidised to an iminium intermediate, and one FMN covalently attached to a
  histidine through its 8-alpha methyl group, which is reoxidised by molecular
  oxygen to give hydrogen peroxide. The two flavins lie about 10 A apart. The
  iminium intermediate is channelled to the folate site of the alpha subunit,
  where, with tetrahydrofolate present, glycine and
  5,10-methylenetetrahydrofolate are formed (EC 1.5.3.24); without folate,
  glycine and formaldehyde are released. The soxB gene lies in a cluster with
  genes for serine hydroxymethyltransferase, serine dehydratase and
  10-formyltetrahydrofolate hydrolase for catabolism of sarcosine to pyruvate.
