    label: sarcosine oxidase activity
  evidence_type: EXP
  original_reference_id: PMID:17395614
  qualifier: enables
  review:
    summary: SoxB is the catalytic subunit of the holoenzyme that catalyses the folate-free, formaldehyde-forming
      reaction defined by GO:0008115; the term is true but describes a conditional secondary activity.
    action: KEEP_AS_NON_CORE
    reason: The formaldehyde-forming reaction is experimentally supported for the heterotetramer without folate,
      so the existing non-core term verdict is retained. Beta-site mutagenesis and half-reaction analysis in
      PMID17395614 assign sarcosine reduction and oxygen-dependent flavin reoxidation to SoxB; this is stronger
      than active-site location alone. Nevertheless, it does not establish the complete reaction by isolated
      SoxB. Full PMID15914915 reports low soluble yield of beta/beta-delta constructs, no bound flavin and
      insolubility on further purification. The supported assignment is catalytic contribution to the assembled
      enzyme, not demonstrated autonomous complete activity. Machine payload and experimental provenance are
      preserved, and lack of an isolated assay is not asserted to prove biochemical impossibility.
