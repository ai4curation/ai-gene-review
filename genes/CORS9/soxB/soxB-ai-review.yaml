- id: PMID:17395614
  title: Kinetic studies on the role of Lys-171 and Lys-358 in the beta subunit of sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: >-
      The beta-subunit lysine at the FAD site is essential for sarcosine
      binding and activity; the lysine at the FMN site affects FMN
      reoxidation. Paper numbering is one lower than UniProt Q50LF2.
    supporting_text: >-
      Low activity of K171 mutants is suggested to be derived from the low rate
