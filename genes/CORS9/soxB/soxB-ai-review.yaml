      - FT:MOD_RES
      supporting_text: /note="Tele-8alpha-FMN histidine"
    - reference_id: PMID:17395614
      supporting_text: Low activity of K171 mutants is suggested to be derived from the low rate of oxidation
        of the reduced FMN in the enzyme.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
- id: PMID:7240129
  title: Purification and some properties of sarcosine oxidase from Corynebacterium sp. U-96.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original purification of the Corynebacterium sp. U-96 enzyme. The cached record has no abstract;
      identity confirmed by title, journal and DOI, and content taken from UniProt comments that cite it with
      experimental evidence. Its report of a covalent FAD was later corrected to FMN (PMID:11902668).
- id: PMID:6158947
  title: 'Corynebacterium sarcosine oxidase: a unique enzyme having covalently-bound and noncovalently-bound
    flavins.'
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Early report of covalent plus non-covalent flavins; no abstract cached. The covalent flavin
      was misassigned as FAD and is FMN (PMID:11902668).
- id: PMID:3202887
  title: Presence of AMP binding sequence in subunit B of Corynebacterium sarcosine oxidase.
  findings:
  - statement: Subunit B carries an AMP (dinucleotide)-binding sequence motif.
    supporting_text: we found that subunit B contained a sequence homologous to that of the AMP-binding site
      of other flavoproteins.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract verified; early sequence evidence for the SoxB FAD site.
- id: PMID:1939012
  title: Cysteine residues in the active site of Corynebacterium sarcosine oxidase.
  findings:
  - statement: Iodoacetamide labels subunit B, protected by the substrate analogue acetate.
    supporting_text: Sarcosine oxidase from Corynebacterium sp. U-96 is inhibited by iodoacetamide (IAM) and
      the inhibition is prevented by the substrate analog, sodium acetate.
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: Abstract verified. The labelled residues were interpreted as cysteines; PMID:15240125 later
      identified the iodoacetamide-modified residues as lysines, and the covalent flavin described as FAD is
      FMN.
- id: PMID:15240125
  title: Low pKa lysine residues at the active site of sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: Two low-pKa active-site lysines are the iodoacetamide-modified residues.
    supporting_text: Comparing the amino acid sequence and mass spectra of the peptide fragments containing
      the modified residues with those from the native enzyme, the modified residues were identified to be
      lysine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract verified; supports the SoxB active-site assignment.
- id: PMID:11902668
  title: Cofactors in sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: The enzyme contains one NAD+, one non-covalent FAD and one covalent FMN.
    supporting_text: The enzyme was found to contain 1 mol of non-covalently-bound NAD+, 1 mol of non-covalently-bound
      FAD, and 1 mol of covalent FMN.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified; corrects the covalent flavin from FAD to FMN.
- id: PMID:17395614
  title: Kinetic studies on the role of Lys-171 and Lys-358 in the beta subunit of sarcosine oxidase from Corynebacterium
    sp. U-96.
  findings:
  - statement: The beta-subunit lysine at the FAD site is essential for sarcosine binding and activity; the
      lysine at the FMN site affects FMN reoxidation. Paper numbering is one lower than UniProt Q50LF2.
    supporting_text: Low activity of K171 mutants is suggested to be derived from the low rate of oxidation
      of the reduced FMN in the enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified. Residue numbers in the paper omit the initiator methionine (paper Lys-358
      and Lys-171 are Lys-359 and Lys-172 of Q50LF2, as UniProt notes).
- id: PMID:20675294
  title: Channeling and conformational changes in the heterotetrameric sarcosine oxidase from Corynebacterium
    sp. U-96.
  findings:
  - statement: Substrate analogues bind at the SoxB FAD; the iminium intermediate is channelled to the alpha-subunit
      folate site; H2O2 forms at the FMN.
    supporting_text: Oxygen molecules are probably located on the surface cavity and diffuse to the FMN isoalloxazine
      ring; the H(2)O(2) formed exits via the oxygen channel.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified.
- id: PMID:15946648
  title: Crystal structure of heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: SoxB binds dimethylglycine, FAD and FMN about 10 A apart.
    supporting_text: The beta subunit contains dimethylglycine, FAD, and FMN, and these flavins are approximately
      10A apart.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified.
- id: PMID:15914915
  title: Corynebacterium sp. U-96 contains a cluster of genes of enzymes for the catabolism of sarcosine to
    pyruvate.
  findings:
  - statement: The sox genes are clustered with one-carbon and serine catabolism genes.
    supporting_text: The genes for serine hydroxymethyltransferase, the beta, delta, alpha, and gamma subunits
      of sarcosine oxidase, serine dehydratase, and 10-formyltetrahydrofolate hydrolase are arranged in this
      order.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract verified.
- id: PMID:9185627
  title: Folate utilization by monomeric versus heterotetrameric sarcosine oxidases.
  findings:
  - statement: Heterotetrameric sarcosine oxidases use tetrahydrofolate as substrate, forming 5,10-methylenetetrahydrofolate.
    supporting_text: only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates
