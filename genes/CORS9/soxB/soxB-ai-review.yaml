core_functions:
- description: >-
    Catalytic flavoprotein subunit of the heterotetrameric sarcosine oxidase:
    oxidises sarcosine at its non-covalent FAD and reduces O2 to H2O2 at its
    covalent FMN; with the alpha-subunit folate site, the complex yields
    glycine and 5,10-methylenetetrahydrofolate. The folate-free
    formaldehyde-forming reaction (GO:0008115) is a conditional secondary
    activity.
  proposed_molecular_function: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  in_complex:
    id: GO:0032921
    label: sarcosine oxidase complex
  directly_involved_in:
  - id: GO:0046653
    label: tetrahydrofolate metabolic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15946648
    supporting_text: >-
      The beta subunit contains dimethylglycine, FAD, and FMN, and these
      flavins are approximately 10A apart.
  - reference_id: PMID:9185627
    supporting_text: >-
      the heterotetrameric enzymes catalyzed the formation of
      5,10-methylenetetrahydropteroyltriglutamate
proposed_new_terms:
- proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  proposed_definition: >-
    Catalysis of the reaction: sarcosine + (6S)-5,6,7,8-tetrahydrofolate + O2 =
    (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate + glycine + H2O2.
  justification: >-
    This is EC 1.5.3.24 / RHEA:70455, the reaction of heterotetrameric
    sarcosine oxidases in the presence of tetrahydrofolate. GO:0008115 is
    defined by the folate-free reaction producing formaldehyde (RHEA:13313),
    which tetrahydrofolate suppresses in the heterotetramers, so no current GO
    molecular-function term represents the physiological activity.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  supported_by:
  - reference_id: PMID:9185627
    supporting_text: >-
      only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as
      substrates
  - reference_id: file:CORS9/soxB/soxB-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: >-
      Xref=Rhea:RHEA:70455, ChEBI:CHEBI:15379, ChEBI:CHEBI:15636,
suggested_questions:
- question: >-
    Should GO create a molecular-function term for EC 1.5.3.24 (RHEA:70455)
    and annotate heterotetrameric sarcosine oxidase subunits to it, keeping
    GO:0008115 (RHEA:13313) for monomeric sarcosine oxidases and the
    folate-free branch?
- question: >-
    Is SoxB alone (or the SoxB-SoxD subcomplex) catalytically active as a
    sarcosine oxidase, or does it require the alpha and gamma subunits for
    flavin incorporation and activity?
suggested_experiments:
- description: >-
    Purify recombinant SoxB and the SoxB-SoxD subcomplex, determine flavin
    content (covalent FMN and non-covalent FAD), and assay sarcosine
    oxidation with oxygen and with artificial electron acceptors to establish
    the minimal catalytic unit.
