- term:
    id: GO:0008115
    label: sarcosine oxidase activity
  evidence_type: EXP
  original_reference_id: PMID:17395614
  qualifier: enables
  review:
    summary: >-
      SoxB is the catalytic subunit of the holoenzyme that catalyses the
      folate-free, formaldehyde-forming reaction defined by GO:0008115; the
      term is true but describes a conditional secondary activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      GO:0008115 is defined as "Catalysis of the reaction: H2O + O2 +
      sarcosine = formaldehyde + glycine + H2O2." [EC:1.5.3.1, RHEA:13313].
      PMID:17395614 mutated the beta-subunit lysines at the FAD/sarcosine site
      (Lys-358 in the paper's numbering, Lys-359 of Q50LF2) and the covalent
      FMN site (Lys-171, Lys-172 of Q50LF2) and measured holoenzyme activity
      with oxygen as acceptor and no folate. Because the substrate-oxidising
      FAD and oxygen-reducing FMN are both on SoxB, enables is appropriate for
      this subunit. The term is not the core function: with tetrahydrofolate
      present the heterotetramer forms 5,10-methylenetetrahydrofolate instead
      of formaldehyde (EC 1.5.3.24, RHEA:70455), an activity with no GO term
      (see proposed_new_terms). The formaldehyde branch is a genuine
      secondary activity, so KEEP_AS_NON_CORE.
    supported_by:
    - reference_id: PMID:17395614
      supporting_text: >-
        The Lys-358 mutant, K358R showed 0.07% activity and higher apparent
        K(m) for sarcosine than the wild-type enzyme, but K358A and K358D
        mutants showed no activity, suggesting the importance of amino group of
        Lys358 in the sarcosine-binding to the enzyme.
    - reference_id: file:CORS9/soxB/soxB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        In the absence of tetrahydrofolate, catalyzes the oxidative
        demethylation of sarcosine to yield glycine, formaldehyde and hydrogen
        peroxide (PubMed:17395614, PubMed:20675294, PubMed:7240129).
    - reference_id: PMID:9185627
      supporting_text: >-
        only the heterotetrameric sarcosine oxidases can use tetrahydrofolates
        as substrates
