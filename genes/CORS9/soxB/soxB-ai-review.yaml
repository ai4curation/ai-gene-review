- term:
    id: GO:0046653
    label: tetrahydrofolate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006278
  review:
    summary: InterPro2GO (GO_REF:0000002) from IPR006278; SoxB generates the one-carbon unit that the complex
      transfers to tetrahydrofolate.
    action: ACCEPT
    reason: The row is an InterPro2GO mapping (GO_REF:0000002) from the SoxB signature. GO:0046653 is "The
      chemical reactions and pathways involving tetrahydrofolate". The heterotetramer uses tetrahydrofolate
      as a substrate and forms 5,10-methylenetetrahydrofolate; SoxB performs the oxidation that creates the
      iminium methylene donor, which is then channelled to the alpha-subunit folate site. SoxB therefore does
      part of the work of the process. No more specific child term fits.
    supported_by:
    - reference_id: PMID:9185627
      supporting_text: the heterotetrameric enzymes catalyzed the formation of 5,10-methylenetetrahydropteroyltriglutamate
    - reference_id: PMID:20675294
      supporting_text: The third channel goes through the α-subunit and has a folinic acid-binding site, where
        the iminium intermediate is converted to Gly and either formaldehyde or, 5,10-methylenetetrahydrofolate.
