      lysines, and the covalent flavin described as FAD is FMN.
- id: PMID:15240125
  title: Low pKa lysine residues at the active site of sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: Two low-pKa active-site lysines are the iodoacetamide-modified residues.
    supporting_text: >-
      Comparing the amino acid sequence and mass spectra of the peptide
      fragments containing the modified residues with those from the native
      enzyme, the modified residues were identified to be lysine.
