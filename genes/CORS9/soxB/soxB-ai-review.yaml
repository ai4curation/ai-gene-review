  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract verified. Residue numbers in the paper omit the initiator
      methionine (paper Lys-358 and Lys-171 are Lys-359 and Lys-172 of
      Q50LF2, as UniProt notes).
- id: PMID:20675294
  title: Channeling and conformational changes in the heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
