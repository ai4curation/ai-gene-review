suggested_questions:
- question: Should GO create a molecular-function term for EC 1.5.3.24 (RHEA:70455) and annotate heterotetrameric
    sarcosine oxidase subunits to it, keeping GO:0008115 (RHEA:13313) for monomeric sarcosine oxidases and
    the folate-free branch?
- question: Is SoxB alone (or the SoxB-SoxD subcomplex) catalytically active as a sarcosine oxidase, or does
    it require the alpha and gamma subunits for flavin incorporation and activity?
suggested_experiments:
- description: Purify recombinant SoxB and the SoxB-SoxD subcomplex, determine flavin content (covalent FMN
    and non-covalent FAD), and assay sarcosine oxidation with oxygen and with artificial electron acceptors
    to establish the minimal catalytic unit.
