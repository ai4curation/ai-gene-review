suggested_questions:
- question: Should GO create a molecular-function term for EC 1.5.3.24 (RHEA:70455) and annotate heterotetrameric
    sarcosine oxidase subunits to it, keeping GO:0008115 (RHEA:13313) for monomeric sarcosine oxidases and
    the folate-free branch?
