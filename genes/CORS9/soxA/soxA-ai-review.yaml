id: Q50LF0
gene_symbol: soxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31944
  label: Corynebacterium sp. U-96
description: SoxA is the 965-residue alpha subunit of the cytoplasmic heterotetrameric sarcosine oxidase (SoxABGD)
  of Corynebacterium sp. U-96, a member of the GcvT (aminomethyltransferase) family. The assembled enzyme oxidises
  sarcosine at the FAD of the beta subunit (SoxB), reoxidises its flavins with molecular oxygen to hydrogen
  peroxide, and, when tetrahydrofolate is available, transfers the released methylene group to tetrahydrofolate
  to give glycine and 5,10-methylenetetrahydrofolate (EC 1.5.3.24); without folate the iminium intermediate
  is hydrolysed to glycine and free formaldehyde. Crystal structures show that SoxA has two domains, binds
  one non-covalent NAD+ and carries the folate-binding site through which the iminium intermediate is channelled,
  consistent with its GcvT-like fold. No iron-sulfur cluster is present despite an N-terminal ferredoxin-like
  fold. The soxA gene lies in a cluster with serine hydroxymethyltransferase, serine dehydratase and 10-formyltetrahydrofolate
  hydrolase genes for catabolism of sarcosine to pyruvate.
