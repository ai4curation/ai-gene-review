references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied
    by conservative changes to GO terms applied by UniProt.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
- id: PMID:7240129
  title: Purification and some properties of sarcosine oxidase from Corynebacterium sp. U-96.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original purification of the Corynebacterium sp. U-96 enzyme. The cached record has no abstract;
      its identity is confirmed by title, journal and DOI, and its content (kinetics, substrate range, inhibitors,
      oxygen as acceptor) is taken from UniProt comments that cite it with experimental evidence. Assays were
      on the multi-subunit holoenzyme without folate.
- id: PMID:17395614
  title: Kinetic studies on the role of Lys-171 and Lys-358 in the beta subunit of sarcosine oxidase from Corynebacterium
    sp. U-96.
  findings:
  - statement: Beta-subunit Lys-358 (FAD/sarcosine site) is required for activity and Lys-171 (covalent FMN
      site) affects FMN reoxidation by oxygen; assays were on the holoenzyme.
    supporting_text: Low activity of K171 mutants is suggested to be derived from the low rate of oxidation
      of the reduced FMN in the enzyme.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract verified. Mutations are in SoxB; the paper supports the holoenzyme activity and
      places the oxidation chemistry on SoxB, so it supports GO:0008115 for the complex but not an enables
      qualifier for SoxA.
- id: PMID:20675294
  title: Channeling and conformational changes in the heterotetrameric sarcosine oxidase from Corynebacterium
    sp. U-96.
  findings:
  - statement: The iminium intermediate formed at the SoxB FAD is channelled to a folinic-acid site in the
      alpha subunit, where it yields glycine and either formaldehyde or 5,10-methylenetetrahydrofolate.
    supporting_text: The third channel goes through the α-subunit and has a folinic acid-binding site, where
      the iminium intermediate is converted to Gly and either formaldehyde or, 5,10-methylenetetrahydrofolate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified; key evidence for the SoxA folate channel.
- id: PMID:15946648
  title: Crystal structure of heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: SoxA has two domains, binds NAD+ and folinic acid.
    supporting_text: The alpha subunit is composed of two domains, contains NAD(+), and binds folinic acid.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified; per-subunit cofactor inventory (NAD+ alpha; FAD, FMN beta; Zn delta) with
      no Fe-S cluster.
- id: PMID:15914915
  title: Corynebacterium sp. U-96 contains a cluster of genes of enzymes for the catabolism of sarcosine to
    pyruvate.
  findings:
  - statement: soxB, soxD, soxA and soxG are clustered with serine hydroxymethyltransferase, serine dehydratase
      and 10-formyltetrahydrofolate hydrolase genes.
    supporting_text: The genes for serine hydroxymethyltransferase, the beta, delta, alpha, and gamma subunits
      of sarcosine oxidase, serine dehydratase, and 10-formyltetrahydrofolate hydrolase are arranged in this
      order.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract verified; gene sequences and genomic context.
- id: PMID:11902668
  title: Cofactors in sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: The enzyme contains one NAD+, one non-covalent FAD and one covalent FMN.
    supporting_text: The enzyme was found to contain 1 mol of non-covalently-bound NAD+, 1 mol of non-covalently-bound
      FAD, and 1 mol of covalent FMN.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified; cofactor inventory lists no iron-sulfur cluster.
- id: PMID:9185627
  title: Folate utilization by monomeric versus heterotetrameric sarcosine oxidases.
  findings:
  - statement: Heterotetrameric (including the corynebacterial) sarcosine oxidases use tetrahydrofolate as
      substrate, forming 5,10-methylenetetrahydrofolate and suppressing formaldehyde release.
    supporting_text: only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified; establishes the folate-coupled reaction as the physiologically relevant
      chemistry of the heterotetramer.
