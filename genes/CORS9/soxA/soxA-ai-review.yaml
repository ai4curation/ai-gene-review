  title: U-96 sarcosine oxidase construct identity and subunit assay scope
  findings:
  - statement: Deposited chains map to the U-96 target accessions; ligand binding, catalytic contribution and
      independent activity are distinguished.
- id: file:PSEPK/soxB/soxB-source-analysis/assembly-evidence.md
  title: Primary U-96 isolated beta and beta-delta assembly evidence
  findings:
  - statement: The isolated beta and beta-delta constructs lacked bound flavin and became insoluble during
      further purification; this does not establish autonomous complete turnover.
    supporting_text: Moreover, no flavin was found to be bound to these protein samples.
core_functions:
- description: Contribute as the NAD/folate-binding alpha subunit to oxygen-dependent sarcosine oxidation in
    the assembled heterotetramer. The collective folate-coupled reaction yields glycine and methylenetetrahydrofolate;
    it is not assigned as an autonomous subunit activity. The folate-free formaldehyde-forming branch remains
    a conditional secondary complex activity.
  in_complex:
    id: GO:0032921
    label: sarcosine oxidase complex
  directly_involved_in:
  - id: GO:0046653
    label: tetrahydrofolate metabolic process
  locations:
  - id: GO:0005737
    label: cytoplasm
