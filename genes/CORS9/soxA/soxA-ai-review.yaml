- term:
    id: GO:0046653
    label: tetrahydrofolate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006277
  review:
    summary: InterPro2GO (GO_REF:0000002) from IPR006277; the complex uses tetrahydrofolate as a co-substrate
      and converts it to 5,10-methylenetetrahydrofolate at the SoxA folate site.
    action: ACCEPT
    reason: The row is an InterPro2GO mapping (GO_REF:0000002) from the SoxA family signature. GO:0046653 is
      "The chemical reactions and pathways involving tetrahydrofolate". The heterotetramer uses tetrahydrofolate
      as a substrate (Km 3.1 microM for the triglutamate form with the corynebacterial enzyme) and forms 5,10-methylenetetrahydrofolate,
      and the folate-binding site where this happens is in the alpha subunit, so SoxA does part of the work
      of the process. No more specific child (biosynthetic, interconversion, 10-formyl) fits a reaction that
      loads a one-carbon unit onto tetrahydrofolate.
    supported_by:
    - reference_id: PMID:9185627
      supporting_text: the heterotetrameric enzymes catalyzed the formation of 5,10-methylenetetrahydropteroyltriglutamate
    - reference_id: PMID:20675294
      supporting_text: The third channel goes through the α-subunit and has a folinic acid-binding site, where
        the iminium intermediate is converted to Gly and either formaldehyde or, 5,10-methylenetetrahydrofolate.
    - reference_id: PMID:15946648
      supporting_text: The alpha subunit is composed of two domains, contains NAD(+), and binds folinic acid.
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001041
  review:
    summary: InterPro2GO from the 2Fe-2S ferredoxin-type domain signature; the crystal structures and cofactor
      analysis of this enzyme show no iron-sulfur cluster in SoxA or any other subunit.
    action: REMOVE
    reason: 'The row is an InterPro2GO mapping (GO_REF:0000002) from IPR001041 2Fe-2S_ferredoxin-type, which
      marks the N-terminal ferredoxin-like fold of SoxA. For this protein the mapping is demonstrably wrong:
      the cofactor reinvestigation of the purified enzyme found only NAD+, FAD and covalent FMN; the crystal
      structure assigns NAD+ and folinic acid to SoxA and a single zinc to SoxD; and none of the six PDB entries
      models an iron-sulfur ligand in any chain (local RCSB ligand inventory). UniProt''s curated COFACTOR
      comment for Q50LF0 lists only NAD+. The fold has been retained without the cluster, so GO:0051536 is
      an over-propagated electronic annotation.'
    supported_by:
    - reference_id: PMID:11902668
      supporting_text: The enzyme was found to contain 1 mol of non-covalently-bound NAD+, 1 mol of non-covalently-bound
        FAD, and 1 mol of covalent FMN.
    - reference_id: PMID:15946648
      supporting_text: The delta subunit contains a single atom of zinc and has a Cys(3)His zinc finger structure.
    - reference_id: file:CORS9/soxA/soxA-bioinformatics/RESULTS.md
      supporting_text: no iron-sulfur cluster is modelled in any of the six structures, in any chain.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0051536
      cause: OTHER
      confidence: PROBABLE
      explanation: 'InterPro2GO maps IPR001041 (2Fe-2S ferredoxin-type domain) to GO:0051536. Heterotetrameric
        sarcosine oxidase alpha subunits (IPR006277 / TIGR01372) carry this fold without a cluster: the Corynebacterium
        sp. U-96 enzyme contains only NAD+, FAD, FMN and a SoxD zinc, and no Fe-S ligand is present in six
        crystal structures. InterPro should consider excluding IPR006277 members from this mapping.'
