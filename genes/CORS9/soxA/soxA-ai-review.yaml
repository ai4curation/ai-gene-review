- term:
    id: GO:0008115
    label: sarcosine oxidase activity
  evidence_type: EXP
  original_reference_id: PMID:17395614
  qualifier: enables
  review:
    summary: The purified SoxABGD heterotetramer catalyses the folate-free, formaldehyde-forming reaction that
      GO:0008115 defines; this is a real but conditional activity of the complex, and SoxA contributes to it
      rather than executing it alone.
    action: KEEP_AS_NON_CORE
    reason: 'GO:0008115 is defined as "Catalysis of the reaction: H2O + O2 + sarcosine = formaldehyde + glycine
      + H2O2." [EC:1.5.3.1, RHEA:13313]. PMID:17395614 assayed the purified holoenzyme (the mutations studied
      are in the beta subunit), and UniProt attributes the formaldehyde reaction to this paper with experimental
      evidence. The term is therefore true of the complex. It is not the core function: in the presence of
      tetrahydrofolate the heterotetramer suppresses formaldehyde release and instead forms 5,10-methylenetetrahydrofolate
      (EC 1.5.3.24, RHEA:70455), for which GO has no molecular-function term (see proposed_new_terms). The
      formaldehyde branch is the folate-free in vitro assay condition, a genuine secondary activity, so KEEP_AS_NON_CORE.
      The qualifier is wrong: the oxidation chemistry (FAD, FMN, substrate site) is on SoxB, and SoxA contributes
      the folate/iminium channel and NAD+-binding architecture of the complex, so SoxA should carry contributes_to,
      not enables (source defect recorded).'
    supported_by:
    - reference_id: file:CORS9/soxA/soxA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: In the absence of tetrahydrofolate, catalyzes the oxidative demethylation of sarcosine
