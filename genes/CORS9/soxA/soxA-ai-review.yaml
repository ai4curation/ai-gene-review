    to GO:0051536 iron-sulfur cluster binding mapping, given that the ferredoxin-like fold carries no cluster
    here?
- question: Does the NAD+ bound to SoxA undergo redox cycling during catalysis, or is it a structural cofactor?
suggested_experiments:
- description: Mutate the SoxA folate-site residues (the methylenetetrahydrofolate binding positions 692 and
    784) and measure, with and without tetrahydrofolate, the ratio of 5,10-methylenetetrahydrofolate to free
    formaldehyde and the rate of sarcosine oxidation.
- description: Measure the NAD+ redox state of SoxA by stopped-flow spectroscopy during sarcosine turnover
    to test whether the dinucleotide participates in electron transfer between the flavins of SoxB.
