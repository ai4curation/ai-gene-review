id: Q50LF1
gene_symbol: soxD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31944
  label: Corynebacterium sp. U-96
description: SoxD is the 99-residue delta subunit of the cytoplasmic heterotetrameric sarcosine oxidase (SoxABGD)
  of Corynebacterium sp. U-96. Crystal structures show that it binds a single zinc ion in a Cys3His zinc-finger
  fold and has no flavin or other redox cofactor. The assembled complex oxidises sarcosine at the FAD of the
  beta subunit, reoxidises its flavins with oxygen to give hydrogen peroxide and, with tetrahydrofolate present,
  transfers the methylene group to tetrahydrofolate, yielding glycine and 5,10-methylenetetrahydrofolate (EC
  1.5.3.24); without folate it releases formaldehyde. SoxD has no catalytic group of its own and is a structural
  subunit of the complex; its precise role (assembly, stabilisation of the beta subunit) has not been tested.
  The soxD gene lies between soxB and soxA in a cluster of sarcosine-to-pyruvate catabolism genes.
