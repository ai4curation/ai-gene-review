  review:
    summary: The purified SoxABGD holoenzyme catalyses the folate-free, formaldehyde-forming reaction defined
      by GO:0008115; this is a real but conditional activity of the complex, to which SoxD contributes as a
      structural subunit.
    action: KEEP_AS_NON_CORE
    reason: 'GO:0008115 is defined as "Catalysis of the reaction: H2O + O2 + sarcosine = formaldehyde + glycine
      + H2O2." [EC:1.5.3.1, RHEA:13313]. PMID:17395614 assayed the holoenzyme (mutations in the beta subunit),
      and UniProt attributes the formaldehyde reaction to it with experimental evidence, so the term is true
      of the complex. It is not the core function: with tetrahydrofolate the heterotetramer forms 5,10-methylenetetrahydrofolate
      instead (EC 1.5.3.24, RHEA:70455), which has no GO term (see proposed_new_terms), making the formaldehyde
      branch a genuine secondary activity (KEEP_AS_NON_CORE). The qualifier is wrong: SoxD carries only a structural
