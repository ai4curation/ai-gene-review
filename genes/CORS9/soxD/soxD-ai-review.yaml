- description: Contribute as the zinc-binding structural delta subunit to oxygen-dependent sarcosine oxidation
    in the assembled heterotetramer. The collective folate-coupled reaction yields glycine and methylenetetrahydrofolate;
    it is not assigned as an autonomous subunit activity. The folate-free formaldehyde-forming branch remains
    a conditional secondary complex activity.
