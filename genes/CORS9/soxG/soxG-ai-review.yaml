core_functions:
- description: Contribute as the gamma accessory subunit to oxygen-dependent sarcosine oxidation in the assembled
    heterotetramer. The collective folate-coupled reaction yields glycine and methylenetetrahydrofolate; it
    is not assigned as an autonomous subunit activity. The folate-free formaldehyde-forming branch remains
    a conditional secondary complex activity.
  in_complex:
    id: GO:0032921
    label: sarcosine oxidase complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15946648
    supporting_text: The gamma subunit is in contact with two domains of alpha subunit and has possibly a folate-binding
      structure.
  - reference_id: PMID:9185627
    supporting_text: the heterotetrameric enzymes catalyzed the formation of 5,10-methylenetetrahydropteroyltriglutamate
  - reference_id: file:PSEPK/soxB/soxB-source-analysis/assembly-evidence.md
    supporting_text: Moreover, no flavin was found to be bound to these protein samples.
  contributes_to_molecular_function:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
proposed_new_terms:
- proposed_name: sarcosine oxidase (5,10-methylenetetrahydrofolate-forming) activity
  proposed_definition: 'Catalysis of the reaction: sarcosine + (6S)-5,6,7,8-tetrahydrofolate + O2 = (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate
    + glycine + H2O2.'
  justification: This proposal describes the complete folate-coupled reaction of heterotetrameric SoxABDG (EC
    1.5.3.24; RHEA:70455), distinct from the glycine/formaldehyde-producing GO:0008115 reaction. It is an ontology
    proposal for the assembled complex, not the activity of each isolated subunit. The schema permits proposed_molecular_function
    together with contributes_to_molecular_function, but that syntactic permission does not make a complex
    reaction subunit-specific. The core therefore retains contribution to GO:0016647; beta cores additionally
    identify the separately defined imine-forming catalytic subreaction. Other subunits retain only their supported
    own functions. Structural and biochemical evidence comes from the characterized U-96 heterotetramer; isolated-subunit
    catalysis is not inferred.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  supported_by:
  - reference_id: PMID:9185627
    supporting_text: only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates
  - reference_id: file:CORS9/soxG/soxG-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: Xref=Rhea:RHEA:70455, ChEBI:CHEBI:15379, ChEBI:CHEBI:15636,
knowledge_gaps:
- gap_statement: 'The function of the gamma subunit within the heterotetramer is undetermined: whether its
    GcvT/TrmE-like fold binds folate (or polyglutamylated folate), stabilises the alpha-subunit folate channel,
    or is needed only for assembly.'
  boundary: SoxG is an established subunit of the crystallised heterotetramer and contacts both domains of
    the alpha subunit; no ligand is bound to it in six crystal structures.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: Does SoxG bind tetrahydrofolate or its polyglutamates, given its predicted folate-binding fold,
    or is the alpha-subunit site the only folate site of the complex?
suggested_experiments:
- description: Express the heterotetramer without SoxG (or with SoxG interface mutants) and measure assembly,
    the Km for tetrahydropteroyltriglutamate and the ratio of 5,10-methylenetetrahydrofolate to formaldehyde
    formed; test isolated SoxG for folate binding by isothermal titration calorimetry.
