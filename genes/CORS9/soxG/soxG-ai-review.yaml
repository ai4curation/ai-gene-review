id: Q50LE9
gene_symbol: soxG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31944
  label: Corynebacterium sp. U-96
description: SoxG is the 205-residue gamma subunit of the cytoplasmic heterotetrameric sarcosine oxidase (SoxABGD)
  of Corynebacterium sp. U-96. It has a GcvT/TrmE-like folate-binding-domain fold and contacts both domains
  of the alpha subunit, but no cofactor or ligand has been located on it. The assembled complex oxidises sarcosine
  at the FAD of the beta subunit, reoxidises its flavins with oxygen to give hydrogen peroxide and, with tetrahydrofolate
  present, transfers the methylene group to tetrahydrofolate at a site in the alpha subunit, yielding glycine
  and 5,10-methylenetetrahydrofolate (EC 1.5.3.24); without folate it releases formaldehyde. The specific contribution
  of SoxG to folate binding, complex assembly or catalysis has not been determined. The soxG gene follows soxA
  in a cluster of sarcosine-to-pyruvate catabolism genes.
