id: F8U970
gene_symbol: PoMZ_10221
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:318829
  label: Pyricularia oryzae
description: PoMZ_10221 encodes a bifunctional UDP-4-keto-6-deoxyglucose 3,5-epimerase and 4-reductase
  in Pyricularia oryzae. The enzyme converts UDP-4-keto-6-deoxyglucose to UDP-rhamnose, using NADPH for
  the reduction step. It provides activated rhamnose for fungal rhamnose-containing glycans.
existing_annotations:
- term:
    id: GO:0006556
    label: S-adenosylmethionine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: SAM-biosynthetic participation remains unresolved after report review.
    action: UNDECIDED
    reason: A MAT regulatory subunit can contribute to SAM synthesis alongside a separate catalytic enzyme.
      Therefore the reported presence of another SAM synthetase is not evidence that this process annotation
      is redundant or wrong. The focused OpenScientist report was critically incorporated. Its sequence-identity
      contrast, absence of MAT experiments in the sugar-enzyme paper, and existence of a separate SAM
      synthetase do not refute a regulatory second function. The current reference tree recovers graft
      PTN008946252 below MAT-complex/SAM IBD PTN000051875, but lacks the exact target reference leaf;
      the historical regulator-term path remains unresolved. Full PMID:25075345 establishes a C-terminal
      interaction motif in human MAT2B variant V2. F8U970 sequence version 1 has a different C terminus,
      making simple interface conservation doubtful without proving all fungal MAT association impossible.
      No target-specific interaction or loss evidence resolves the claim.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN008946252
        source_label: PTN008946252
        source_status: UNRESOLVED
        comment: Frozen graft is recovered but exact target reference leaf is absent. Existing MAT-complex/SAM
          IBD ancestry and regulator-term version discrepancy were retained; report did not reconstruct
          a target-specific loss or resolve the historical graft.
    supported_by: &id001
    - reference_id: PMID:25075345
      supporting_text: three residues at the end of the C-terminal of MATβV2 (Val321Phe322His323)
    - reference_id: file:PYROR/PoMZ_10221/PoMZ_10221-hypotheses/rhamnose-enzyme-and-mat-regulatory-capacity/openscientist.md
      supporting_text: No experiment has *tested* MAT-binding by F8U970.
