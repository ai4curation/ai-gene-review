- term:
    id: GO:0010489
    label: UDP-4-keto-6-deoxy-glucose-3,5-epimerase activity
  evidence_type: IDA
  original_reference_id: PMID:22102281
  review:
    summary: The fungal enzyme catalyzes the paired epimerization/reduction steps producing UDP-rhamnose.
    action: ACCEPT
    reason: PMID:22102281 is the direct IDA source for this F8U970/AEH41994.1 protein and reports recombinant
      bifunctional enzyme conversion of UDP-4-keto-6-deoxyglucose to UDP-rhamnose. NMR identifies the
      product and NADPH-supported reduction; the intermediate epimerized sugar is not released detectably
      without reduction. Both molecular activities and direct rhamnose biosynthetic participation are
      supported; the enzyme performs the conversion rather than merely being required upstream. The incomplete
      cached HTML is supplemented by accessible primary publisher/PMC indexed Results.
    supported_by:
    - reference_id: PMID:22102281
      supporting_text: 'The second gene encodes a bifunctional

        UDP-4-keto-6-deoxyglucose-3,5-epimerase/-4-reductase that converts

        UDP-4-keto-6-deoxyglucose to UDP-rhamnose.'
