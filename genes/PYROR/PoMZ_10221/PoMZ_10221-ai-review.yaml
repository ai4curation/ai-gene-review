- id: file:PYROR/PoMZ_10221/PoMZ_10221-deep-research-openai.md
  title: Deep research on PoMZ_10221 function
  findings: []
  reference_review:
    relevance: NONE
    correctness: WRONG_IDENTIFIER
    review_notes: Report describes a mitochondrial dihydroorotate dehydrogenase/PoPYR4, whereas F8U970
      is the AEH41994.1 UDP-rhamnose epimerase/reductase characterized in PMID22102281. Do not use its
      pyrimidine or localization claims.
- id: PMID:25075345
  title: Structure and function study of the complex that synthesizes S-adenosylmethionine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and full cached structural Results checked. Human MAT2B variant V2 interacts
      through its C-terminal tail; removing the tail prevents assembly while preserving secondary structure.
      Paper residue numbers are not projected onto F8U970 without alignment.
- id: file:PYROR/PoMZ_10221/PoMZ_10221-hypotheses/rhamnose-enzyme-and-mat-regulatory-capacity/openscientist.md
  title: Focused Curation Report — Pyricularia oryzae PoMZ_10221 / F8U970
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Read full delivered report. Correct target and sugar-enzyme evidence; reject the jump
      from no assay/another catalytic gene/low identity to refuted MAT regulation. The report admits it
      did not recover exact graft logic. Only HTML/PDF were delivered, so its claimed computed identity
      percentages are not reproduced primary evidence. No duplicate provider run requested.
