id: B4MAQ2
gene_symbol: B4MAQ2
taxon:
  id: NCBITaxon:7244
  label: Drosophila virilis
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a Drosophila virilis Exportin-5 ortholog. This is
  one of the benchmark's strongest results and the only one where the model appears to use
  lineage-specific biology: rank 1 is nuclear export signal receptor activity (exact GOA
  match, score 20.20) and rank 2 is tRNA re-export from the nucleus - which is the
  Drosophila-specific role of Exportin-5, taken on because flies lack a canonical
  Exportin-t - ahead of the pan-eukaryotic pre-miRNA export function at rank 3. Ranks 4
  and 5 (RNA nuclear export complex, pre-miRNA binding) are also correct. ProtNLM2 made no
  GO prediction for this protein, so the whole of this content is additional coverage.
  Assessment: 2 correct not novel (CNN), 1 correct novel (COR).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/DROVI/B4MAQ2/B4MAQ2-uniprot.txt
  - genes/DROVI/B4MAQ2/B4MAQ2-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0005049
      label: nuclear export signal receptor activity
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 20.20, second-highest in the benchmark), an exact match to the
        GOA annotation. Correct: Exportin-5 is a RanGTP-dependent nuclear export receptor.
        Already annotated, so not novel.
      supported_by:
        - reference_id: file:DROVI/B4MAQ2/B4MAQ2-uniprot.txt
          supporting_text: PANTHER; PTHR11223:SF3; EXPORTIN-5; 1.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0071528
      label: tRNA re-export from nucleus
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 17.74), absent from GOA and a strict descendant of the annotated RNA
        export from nucleus. This is the most lineage-aware call in the benchmark: in
        Drosophila, Exportin-5 substitutes for the missing Exportin-t and is the primary tRNA
        nuclear export factor, and the model ranks that role above the pre-miRNA export
        function that dominates the vertebrate literature. Correct and novel. Whether the
        model has genuinely learned the fly-specific substitution or has matched insect
        Exportin-5 sequences that carry this annotation cannot be determined from the
        retrieval alone, but either way the output is right.
      supported_by:
        - reference_id: file:DROVI/B4MAQ2/B4MAQ2-uniprot.txt
          supporting_text: PANTHER; PTHR11223:SF3; EXPORTIN-5; 1.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0035281
      label: pre-miRNA export from nucleus
    predicted_term_type: GO_BP
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 3 (score 17.50), a strict descendant of the annotated RNA export from nucleus and
        the canonical Exportin-5 function in miRNA biogenesis. Correct and consistent with
        this review, though it is the function every Exportin-5 entry carries and so is the
        expected rather than the informative call.
      supported_by:
        - reference_id: file:DROVI/B4MAQ2/B4MAQ2-uniprot.txt
          supporting_text: PANTHER; PTHR11223:SF3; EXPORTIN-5; 1.
