- description: >-
    RanGTP-dependent nuclear export receptor for structured RNAs. Exportin-5
    binds minihelix-containing RNAs (in Drosophila, tRNAs, pre-tRNAs and
    pre-miRNAs) together with RanGTP in the nucleus, carries them through the
    nuclear pore complex, and releases them in the cytoplasm when Ran
    hydrolyses GTP.
