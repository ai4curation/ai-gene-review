id: B4MAQ2
gene_symbol: B4MAQ2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7244
  label: Drosophila virilis
description: >-
  Dvir\GJ15622 (UniProt B4MAQ2) encodes the Drosophila virilis Exportin-5, a
  1238-residue karyopherin-beta nuclear transport receptor. It is the
  one-to-one D. virilis ortholog of D. melanogaster Ranbp21 (Exp5), with which it
  shares the EXPORTIN-5 subfamily of the EXPORTIN 1/5 family and about 86%
  sequence identity along its whole length. The protein is a HEAT/ARM-repeat
  alpha-solenoid with an N-terminal importin-beta (IBN_N) Ran-binding region,
  an Xpo1-like region and a C-terminal Exportin-5 domain. Exportin-5 proteins
  bind their cargo together with RanGTP in the nucleus, carry it through the
  nuclear pore and release it in the cytoplasm when Ran hydrolyses GTP. Their
  cargoes are short structured RNAs, chiefly pre-miRNA hairpins and other
  minihelix-containing RNAs. Drosophila lacks an Exportin-t gene, so in
  D. melanogaster Exp5 binds tRNAs and pre-tRNAs as well as miRNA precursors,
  and it is required to maintain normal tRNA levels. No experiments have been
  done on the D. virilis protein itself; its function is inferred from its
  subfamily placement and from work on the D. melanogaster and human orthologs.
existing_annotations:
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      TreeGrafter transfer from PANTHER node PTN000131780, within the
      EXPORTIN-5 subfamily (PTHR11223:SF3). PAINT curators placed RNA binding
      on the exportin-5 clade node PTN000131750 (seeds: human XPO5 and mouse
      Xpo5). In D. melanogaster Exp5 (Ranbp21, same subfamily, 86% identity),
      PAR-CLIP directly captures tRNAs, pre-tRNAs, miRNA precursors and some
      mRNAs and lncRNAs.
    action: ACCEPT
    reason: >-
      Direct RNA binding is how Exportin-5 recognises its cargo, and the
      phylogenetic placement supports transferring it from the exportin-5
      clade. More specific RNA-binding terms (tRNA binding, pre-miRNA binding)
      have experimental support in the orthologs, but PAINT propagated only the
      general term. The general term is kept here and the narrower ones are
      raised as a question.
    supported_by:
      - reference_id: PMID:39098529
        supporting_text: "Consistent with the idea that Exp5 is a major tRNA export receptor, we detected 343 PAR-CLIP clusters identified by Paralyzer at 295 tRNA loci"
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-uniprot.txt
        supporting_text: "PANTHER; PTHR11223:SF3; EXPORTIN-5; 1"
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-deep-research-falcon.md
        supporting_text: "Exportin-5 specializes as a RanGTP-dependent nuclear export receptor for double-stranded, minihelix RNA structures"
- term:
    id: GO:0005049
    label: nuclear export signal receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      An earlier version of this review removed this term as a CRM1-only
      function. That was a mistake. GO defines GO:0005049 as binding a nuclear
      export signal on a cargo to carry it through the nuclear pore, and says
      "The cargo can be either a RNA or a protein". In other words, it is the
      general molecular function of an exportin. PAINT placed this term at the
      family root node PTN000131749, with seeds from both subfamilies: XPO1
      orthologs and the exportin-5 orthologs human XPO5 (Q9HAV4), mouse Xpo5
      (MGI:1913789) and yeast MSN5 (SGD:S000002743). B4MAQ2 descends from that
      node. Human XPO5 has direct evidence for this activity: it binds cargo
      RanGTP-dependently and exports cargo in permeabilised cells.
    action: ACCEPT
    reason: >-
      This is the transport-receptor activity of an exportin, and the GO
      definition explicitly covers RNA cargo. The family-root PAINT node
      includes exportin-5 members, and B4MAQ2 is a full-length member of the
      EXPORTIN-5 subfamily. The earlier REMOVE misread the term as specific to
      protein NES recognition by CRM1, so it is reversed here.
    supported_by:
      - reference_id: PMID:11777942
        supporting_text: "Like other known transport receptors, this Kap binds specifically to RanGTP,"
      - reference_id: PMID:39098529
        supporting_text: "Exp5 is suggested to play a major role"
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-uniprot.txt
        supporting_text: "PANTHER; PTHR11223:SF3; EXPORTIN-5; 1"
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-bioinformatics/RESULTS-rereview.md
        supporting_text: "Ranbp21 (1241 aa) and aligns end to end with it (1235 aligned columns, 85.9%"
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      PAINT placed nucleus at the family root node PTN000131749 (seeds include
      XPO5 and MSN5). Exportin-5 loads its cargo with RanGTP in the nucleus,
      and fly Exp5 binds nuclear tRNA precursors before their ends are processed.
    action: ACCEPT
    reason: >-
      An exportin has to be in the nucleus to load its cargo. This location
      follows from family-root PAINT placement and from the fly ortholog's
      binding of nuclear pre-tRNAs.
    supported_by:
      - reference_id: PMID:11777942
        supporting_text: "interacts with nucleoporins, and shuttles between the nuclear and cytoplasmic"
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-deep-research-falcon.md
        supporting_text: "they are present in the nucleus (where they bind cargo and RanGTP)"
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      PAINT placed cytoplasm at the family root node PTN000131749 (seeds
      include human XPO5 and MSN5). Exportin-5 releases its cargo in the
      cytoplasm and shuttles between the two compartments.
    action: ACCEPT
    reason: >-
      Being in the cytoplasm is part of the shuttling transport cycle, and the
      term is supported by PAINT and by direct localisation of the human
      ortholog.
    supported_by:
      - reference_id: PMID:11777942
        supporting_text: "interacts with nucleoporins, and shuttles between the nuclear and cytoplasmic"
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-deep-research-falcon.md
        supporting_text: "in the cytoplasm (where they release cargo upon RanGTP hydrolysis)"
- term:
    id: GO:0006405
    label: RNA export from nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      PAINT placed RNA export from nucleus on the exportin-5 clade node
      PTN000131750 (seeds: human XPO5, Arabidopsis HASTY, yeast MSN5).
      D. melanogaster Exp5 binds tRNAs and miRNA precursors in vivo, and
      knocking it down lowers tRNA abundance, which points to a role in tRNA
      export in a genus that has no Exportin-t.
    action: ACCEPT
    reason: >-
      Exporting structured RNA is the core process for Exportin-5. PAINT
      placement supports it, and so does the experimental work on the
      Drosophila ortholog. PAINT did not propagate the narrower terms
      pre-miRNA export or tRNA export, so this review stays at the
      PAINT-supported level.
    supported_by:
      - reference_id: PMID:39098529
        supporting_text: "In Drosophila, knockdown of Exp5 is shown to reduce the tRNA abundance, indicating its roles in tRNA export (14)."
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-deep-research-falcon.md
        supporting_text: "In flies, Exp5 is a major RNA export receptor and can compensate for missing canonical Exportin-t functions in tRNA export"
- term:
    id: GO:0006611
    label: protein export from nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      This row comes from ARBA:ARBA00028564 together with the combined XPO1/5
      InterPro entry IPR045065, not from PAINT. Human XPO5 can export
      dsRBD-containing proteins such as ILF3. However, PAINT curators did not
      place protein export from nucleus on the family root node or on the
      exportin-5 node (PTN000131749/PTN000131750); they placed protein-export
      biology only on the exportin-1 branch (ribosomal subunit export,
      PTN000131787). There is no evidence that Drosophila Exp5 exports protein
      cargo.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Protein export is a peripheral, mostly RNA-coupled activity of
      vertebrate XPO5. PAINT curators chose not to propagate it to the
      exportin-5 clade, and that omission is treated here as deliberate. The
      claim for the D. virilis protein rests on a family-level association
      rule rather than on phylogenetic transfer. The earlier REMOVE is softened
      because the claim is not contradicted for the subfamily.
    supported_by:
      - reference_id: PMID:11777942
        supporting_text: "Based on the ability of this"
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-deep-research-falcon.md
        supporting_text: "likely cargo class is structured RNA rather than leucine-rich NES-bearing proteins"
- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      This is an InterPro2GO mapping from the importin-beta N-terminal domain
      (IPR001494). That domain is shared by every karyopherin-beta, including
      importins whose cargo is protein. For an Exportin-5 receptor the
      documented cargo is mainly structured RNA. The protein moves between
      compartments itself, but the term describes moving protein cargo.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The domain-level mapping over-generalises from protein-cargo
      karyopherins. Protein transport is not the established function of the
      EXPORTIN-5 subfamily in Drosophila. The earlier MODIFY to RNA export
      from nucleus is replaced, because that term is already annotated and
      accepted directly.
    supported_by:
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-deep-research-falcon.md
        supporting_text: "most evidence-based prediction is transporter function for structured RNAs, not small molecules"
- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      This is an InterPro2GO mapping from the importin-beta N-terminal
      (Ran-binding) domain, which UniProt annotates at residues 34-100 of
      B4MAQ2. Every karyopherin-beta receptor binds RanGTP, and human XPO5
      binds RanGTP directly.
    action: ACCEPT
    reason: >-
      Binding RanGTP is essential to the export cycle. A separate Ran-specific
      GTPase-binding term is not available in current GO (a search for "Ran
      GTPase binding" returns GO:0031267), so this term is already as specific
      as GO allows.
    supported_by:
      - reference_id: PMID:11777942
        supporting_text: "Like other known transport receptors, this Kap binds specifically to RanGTP,"
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-uniprot.txt
        supporting_text: "Pfam; PF03810; IBN_N; 1."
- term:
    id: GO:0042565
    label: RNA nuclear export complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  review:
    summary: >-
      TreeGrafter transfer within the EXPORTIN-5 subfamily. Exportin-5, RanGTP
      and RNA cargo form a ternary export complex. Human XPO5 is annotated to
      this complex by IDA with pre-miRNA cargo.
    action: ACCEPT
    reason: >-
      The ternary exportin-RanGTP-RNA complex is how Exportin-5 carries out its
      transport function, and the transfer stays within the subfamily.
    supported_by:
      - reference_id: file:DROVI/B4MAQ2/B4MAQ2-deep-research-falcon.md
        supporting_text: "Exportin-5 binds cargo in cooperation with RanGTP, forming a trimeric export complex"
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
    - statement: >-
        InterPro maps the Importin-beta_N domain (IPR001494) to small GTPase
        binding and intracellular protein transport. The GTPase binding annotation
        is appropriate for karyopherin-beta family members, but intracellular
        protein transport is an over-generalisation for an RNA export receptor.
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings:
    - statement: >-
        TreeGrafter places B4MAQ2 under PANTHER node PTN000131780 within the
        EXPORTIN-5 subfamily and transfers RNA binding, RNA export from nucleus,
        nucleus, cytoplasm and RNA nuclear export complex, consistent with the
        PAINT IBD placements at PTN000131749/PTN000131750.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
    - statement: >-
        Combined IEA methods assign nuclear export signal receptor activity
        (consistent with the PAINT family-root IBD, whose GO definition covers RNA
        cargo) and protein export from nucleus (from ARBA and the combined XPO1/5
        InterPro entry; not propagated by PAINT to the exportin-5 clade).
- id: PMID:39098529
  title: Exportin-5 binding precedes 5'- and 3'-end processing of tRNA precursors in Drosophila.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. PAR-CLIP study of D. melanogaster Exp5 (Ranbp21, same
      PANTHER subfamily SF3 as B4MAQ2) in S2R+ cells; establishes direct
      binding to tRNAs, pre-tRNAs and miRNA precursors and cites knockdown
      evidence for tRNA export.
  findings:
    - statement: >-
        Drosophila Exp5 binds tRNAs (including pre-tRNAs with leader and
        trailer sequences), miRNA precursors and selected mRNAs/lncRNAs in vivo;
        Drosophila lacks Exportin-t.
      supporting_text: "Consistent with the idea that Exp5 is a major tRNA export receptor, we detected 343 PAR-CLIP clusters identified by Paralyzer at 295 tRNA loci"
- id: PMID:11777942
  title: Exportin-5, a novel karyopherin, mediates nuclear export of double-stranded RNA binding proteins.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Founding characterisation of human XPO5 (same PANTHER
      subfamily SF3): RanGTP binding, nucleoporin interaction, shuttling, and
      export of dsRBD proteins. Used for RanGTP binding, shuttling and the
      protein-export question; its proposal that XPO5 is not an RNA exporter
      was later overturned by pre-miRNA and tRNA export work.
  findings:
    - statement: >-
        Human exportin-5 binds RanGTP specifically, interacts with
        nucleoporins and shuttles between nucleus and cytoplasm.
      supporting_text: "Like other known transport receptors, this Kap binds specifically to RanGTP,"
- id: file:DROVI/B4MAQ2/B4MAQ2-bioinformatics/RESULTS-rereview.md
  title: B4MAQ2 re-review pairwise comparison with characterised exportins
  findings:
    - statement: >-
        B4MAQ2 aligns end to end with D. melanogaster Ranbp21 (85.9% identity)
        and is 38.5% identical to human XPO5 versus 25.8% to human XPO1;
        consistent with a full-length Exportin-5 ortholog.
- id: file:DROVI/B4MAQ2/B4MAQ2-deep-research-falcon.md
  title: Deep research summary for B4MAQ2
  findings:
    - statement: >-
        Identifies B4MAQ2 as an Exportin-5-like protein based on domain architecture
        and family classification, with predicted function in RanGTP-dependent nuclear
        export of structured RNAs.
    - statement: >-
        Notes that in Drosophila, Exportin-5 compensates for the absence of canonical
        Exportin-t, serving as the major tRNA export factor.
    - statement: >-
        No gene-specific literature exists for Dvir\GJ15622; function is inferred
        entirely from conserved family and domain assignments.
- id: file:DROVI/B4MAQ2/B4MAQ2-uniprot.txt
  title: UniProt entry B4MAQ2
  findings:
    - statement: >-
        UniProt classifies the protein in the exportin family with Importin-beta_N,
        Exportin-1/Importin-b-like, and Exportin-5_C domains.
    - statement: >-
        PANTHER subfamily assignment is EXPORTIN-5 (PTHR11223:SF3), distinguishing
        it from EXPORTIN-1/CRM1.
