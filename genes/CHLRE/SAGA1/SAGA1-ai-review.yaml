suggested_questions:
  - question: Should GO add a "pyrenoid tubule assembly" process term (for
      example is_a thylakoid membrane organization, or under pyrenoid
      organization) so that tubule biogenesis factors such as SAGA1, MITH1 and
      RBMP2 can be annotated more specifically than GO:0010027?
    experts:
      - Jonikas MC
  - question: How does SAGA1 contact the membrane? It has no predicted
      transmembrane segment. Does it bind lipids directly, a thylakoid membrane
      protein, or only MITH1? The answer decides whether protein-membrane
      adaptor activity is the right molecular function.
  - question: Does SAGA1 actively initiate starch granules at the pyrenoid
      surface (GO:0062052 starch granule initiation), as its
      maltoheptaose binding suggests? Or does it only capture and anchor
      granules made by other enzymes?
  - question: Does full-length SAGA1, with its single CBM20, bind starch with
      useful affinity in vivo? The in vitro assay needed a tandem 2xCBM20
      construct to raise sensitivity.
suggested_experiments:
  - hypothesis: SAGA1 bridges Rubisco and thylakoid membranes directly.
    description: Reconstitute purified SAGA1 (or fragments) with liposomes of
      thylakoid lipid composition and Rubisco, with or without MITH1. Measure
      membrane binding by flotation and Rubisco recruitment to vesicles. Test
      RBM point mutants for loss of tubule initiation in the saga1 background.
    experiment_type: biochemical reconstitution and complementation
  - hypothesis: Starch binding by the SAGA1 CBM20 is needed for starch sheath
      placement but not for tubule initiation.
    description: Complement saga1 and saga1;saga2 with SAGA1 carrying
      inactivating mutations of the conserved CBM20 aromatic residues. Score
      starch sheath coverage, tubule formation, pyrenoid number and growth at
      low CO2.
    experiment_type: genetic complementation and electron microscopy
