  label: Chlamydomonas reinhardtii
description: >-
  SAGA1 (StArch Granules Abnormal 1; locus Cre11.g467712) is a large
  (~1,626 aa, ~180 kDa) nuclear-encoded pyrenoid protein of Chlamydomonas
  reinhardtii. It is built from an N-terminal CBM20 starch-binding domain, a
  long coiled-coil/alpha-helical middle region, and disordered segments that
  carry two copies of the pyrenoid Rubisco-binding motif, one at the extreme C
  terminus. SAGA1 binds the Rubisco large and small subunits, and its
  Rubisco-binding motif peptides bind Rubisco in vitro. Its CBM20 domain binds
  starch granules, beta-cyclodextrin and maltoheptaose in vitro. In the cell
  SAGA1 sits at the pyrenoid periphery. It forms puncta and rings where the
  thylakoid membranes pass through gaps in the starch sheath and become the
  membrane tubules that traverse the Rubisco matrix, and it is also present
  along those matrix-traversing membranes. SAGA1 is needed to start these
  tubules. It binds its homologue MITH1 and recruits it, and MITH1 then extends
  the membranes through the matrix. Expressed together with MITH1 in an
  Arabidopsis line carrying an EPYC1-Rubisco condensate, SAGA1 is sufficient to
  make thylakoid membranes traverse the condensate. Its proposed role is to
  provide an adhesive bridge between the membrane and the Rubisco matrix.
  Working redundantly with its paralogue SAGA2, SAGA1 also places the starch
  sheath around the pyrenoid. The saga1 single mutant has abnormally elongated,
  thin starch plates. The saga1 saga2 double mutant lacks a pyrenoid starch
  sheath, and its starch is spread through the stroma. Mutants lacking SAGA1
  form many (about ten) tubule-less pyrenoid condensates per chloroplast and
  have a defective CO2-concentrating mechanism. They grow poorly at limiting
  CO2 and also fail to express several CAS-dependent inorganic-carbon
  transporter genes.
