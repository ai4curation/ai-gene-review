  - term:
      id: GO:0010027
      label: thylakoid membrane organization
    evidence_type: IMP
    original_reference_id: PMID:39548241
    review:
      summary: SAGA1 is required to start pyrenoid tubules, the thylakoid
        membranes that traverse the Rubisco matrix. With MITH1 it is
        sufficient to make thylakoid membranes traverse an EPYC1-Rubisco
        condensate in Arabidopsis.
      action: NEW
      reason: GO has no term for pyrenoid tubule biogenesis. Thylakoid membrane
        organization is the closest existing process, because the tubules are
        thylakoid-derived membranes. Participation test. SAGA1 is not a
        substrate or an upstream requirement. It binds Rubisco through its
        Rubisco-binding motifs (PMID:31455733, PMID:33177094), associates with
        the membranes and binds MITH1. Its proposed role is to supply the
        membrane-matrix adhesive bond that draws thylakoids into the matrix, a
        structural contribution to the reorganisation step. Heterologous
        sufficiency (with MITH1) makes this more than necessity evidence.
        Comparator check. Arabidopsis proteins that physically shape thylakoids,
        such as VIPP1 and FZL, carry GO:0010027 in QuickGO. The part that is
        still uncharacterised is how SAGA1 contacts the membrane.
      supported_by:
        - reference_id: PMID:39548241
          supporting_text: SAGA1 is necessary for the initiation of
            matrix-traversing membranes as recognized by CYN7 (Fig. 3m–o) and
            CAH3 (Extended Data Fig. 8).
        - reference_id: PMID:39548241
          supporting_text: These results demonstrate that SAGA1 and MITH1
            together are sufficient to generate matrix-traversing thylakoid
            membranes in a heterologous system.
        - reference_id: PMID:39548241
          supporting_text: We propose that SAGA1 and MITH1 together provide such
            Rubisco-membrane bonds, making it energetically favourable for
            membranes to traverse the matrix (Fig. 3u).
core_functions:
  - description: Initiates pyrenoid tubules. At the sites where thylakoid
      membranes enter the Rubisco matrix, SAGA1 binds Rubisco through its
      Rubisco-binding motifs and associates with the membranes, making the
      first adhesive membrane-matrix contact. It also recruits its homologue
      MITH1, which then extends the membranes through the matrix.
