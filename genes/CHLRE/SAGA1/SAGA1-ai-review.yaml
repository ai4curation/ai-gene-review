  - id: PMID:31455733
    title: A Rubisco-binding protein is required for normal pyrenoid number and
      starch sheath morphology in Chlamydomonas reinhardtii.
    findings:
      - statement: SAGA1 carries a CBM20 starch-binding motif with all conserved
          binding residues; starch binding was predicted but not tested
        supporting_text: All 5 highly conserved residues necessary for starch
          binding are present in SAGA1, suggesting that SAGA1 can bind starch
      - statement: SAGA1 binds Rubisco large and small subunits but not EPYC1
          in yeast two-hybrid assays
        supporting_text: In this assay, SAGA1 interacted with the large and small
          subunits of Rubisco, but not with EPYC1 (Fig. 5A).
      - statement: SAGA1 is required for a functional CCM
        supporting_text: We conclude from these observations that SAGA1 is
          required for a functional CCM and for maximal CO2 uptake in cells
          acclimated to both low and high CO2.
      - statement: SAGA1-Venus localizes to the pyrenoid as puncta and streaks
        supporting_text: We conclude that SAGA1-Venus localizes to the pyrenoid.
      - statement: Most saga1 mutant pyrenoids lack the thylakoid tubule network
        supporting_text: However, nearly all pyrenoids of the saga1 mutant lacked
          such hallmark thylakoid tubules
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Primary paper that names Cre11.g467712 as
