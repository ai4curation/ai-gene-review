      co-pellets with membranes and localizes to matrix-traversing membranes,
      but it has no transmembrane segment and no identified lipid- or
      membrane-protein-binding region.
    boundary: SAGA1 binds Rubisco and MITH1 and is necessary to initiate pyrenoid
      tubules.
