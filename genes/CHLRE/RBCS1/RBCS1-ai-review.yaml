suggested_questions:
  - question: Should the UniRule/ARBA rule that assigns "enables
      ribulose-bisphosphate carboxylase activity" to every RbcS be changed to
      contributes_to, since the small subunit has no active-site residues?
  - question: Should the Rubisco small subunit carry a process term for pyrenoid
      (membraneless organelle) assembly? Its helices supply the binding sites
      of the two-component Rubisco-EPYC1 condensate, which is a structural
      contribution rather than only a requirement. GO has no "pyrenoid assembly"
      term, and no MF term covers being the multivalent client or co-scaffold
      bound by a condensate linker.
    experts:
      - Jonikas MC
      - Griffiths H
  - question: Do RBCS1 and RBCS2, which differ by four residues and are
      expressed differently with growth conditions, form holoenzymes with
      different catalytic or pyrenoid-forming properties?
  - question: Which other pyrenoid proteins (for example RBMP1/2, SAGA1) use the
      same SSU helix motif-binding site, as proposed from the stronger phenotype
      of the SSU interface mutants compared with epyc1?
suggested_experiments:
  - hypothesis: RBCS1 and RBCS2 differ in their contributions to Rubisco kinetics
      or pyrenoid condensation.
    description: Complement the T60 rbcS deletion with RBCS1 alone or RBCS2 alone,
      and compare purified holoenzyme kinetics (kcat, Kc, specificity factor),
      EPYC1 binding affinity and pyrenoid morphology at low and high CO2.
    experiment_type: genetic complementation and enzyme kinetics
  - hypothesis: The SSU helix interface is a shared docking site for several
      RBM-containing pyrenoid proteins in addition to EPYC1.
    description: Test binding of RBM peptides from RBMP1, RBMP2, SAGA1 and SAGA2
      to wild-type and D23A/E24A or M87D/V94D RBCS1 holoenzymes by SPR or
      peptide pull-down, and compare their localization in the mutant strains.
    experiment_type: biochemistry and imaging
