core_functions:
  - description: Non-catalytic small subunit of the chloroplast L8S8 Rubisco
      holoenzyme. It is required for holoenzyme accumulation and tunes the
      carboxylation rate and CO2/O2 specificity of the large-subunit active
      sites, so it contributes to RuBP carboxylation in the Calvin-Benson cycle.
      Its two surface-exposed alpha-helices form the binding site for the EPYC1
      linker, which condenses the holoenzyme into the pyrenoid matrix.
    contributes_to_molecular_function:
      id: GO:0016984
      label: ribulose-bisphosphate carboxylase activity
    directly_involved_in:
