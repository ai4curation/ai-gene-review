    review:
      summary: The Rubisco active site is formed entirely by the large subunit
        (rbcL); the small subunit has no catalytic residues but is required for
        the L8S8 holoenzyme and tunes its Vmax and CO2/O2 specificity.
      action: MARK_AS_OVER_ANNOTATED
      reason: The activity belongs to the L8S8 complex, and RBCS1 should carry it
        with the contributes_to qualifier rather than enables. The UniRule rule
        gives "enables" to every RbcS, including the Arabidopsis and spinach
        small subunits, which overstates what a non-catalytic subunit does. The
        biology is not wrong, so this is not a REMOVE; the core function records
        GO:0016984 as contributes_to_molecular_function, in the
        chloroplast ribulose bisphosphate carboxylase complex (GO:0009573).
      supported_by:
