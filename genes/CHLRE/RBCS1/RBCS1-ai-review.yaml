          can also influence the carboxylation catalytic efficiency and
          CO(2)/O(2) specificity of the enzyme.
      - reference_id: PMID:8942995
        supporting_text: Thus, either small subunit is sufficient for holoenzyme
          assembly and function.
      - reference_id: PMID:33230314
        supporting_text: indicates that each Rubisco holoenzyme has eight binding
          sites for EPYC1, one on each Rubisco small subunit. Interface mutations
          disrupt binding, phase separation and pyrenoid formation.
      - reference_id: PMID:28938114
        supporting_text: A portion of the RbcS1-Venus and EPYC1-Venus signals
          rapidly dispersed from the pyrenoid matrix into the stroma for ~20
