  - id: PMID:3820291
    title: Sequence, evolution and differential expression of the two genes
      encoding variant small subunits of ribulose bisphosphate
      carboxylase/oxygenase in Chlamydomonas reinhardtii.
    findings:
      - statement: Chlamydomonas has two expressed small-subunit genes (RBCS1,
          RBCS2) encoding variants that differ by four residues.
        supporting_text: The two genes encode variant small subunits that differ
          by four amino acid residues. Both genes are expressed
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Abstract-only cache; PubMed esummary confirms title. Original
        sequence report for RBCS1/RBCS2 (UniProt reference 1).
  - id: PMID:8942995
    title: Elimination of the Chlamydomonas gene family that encodes the small
      subunit of ribulose-1,5-bisphosphate carboxylase/oxygenase.
    findings:
      - statement: A deletion of both RBCS genes is photosynthesis-deficient and is
          complemented by either RBCS1 or RBCS2, so either small subunit is
          sufficient for holoenzyme assembly and function.
        supporting_text: Thus, either small subunit is sufficient for holoenzyme
          assembly and function.
      - statement: Without small subunits, translation of the chloroplast-encoded
          large subunit is inhibited.
        supporting_text: In the absence of small subunits, expression of
          chloroplast-encoded large subunits appears to be inhibited at the level
          of translation.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract-only cache; PubMed-verified. Genetic evidence that the
        SSU is an essential structural subunit of the holoenzyme; source of the
        T60 rbcS deletion strain used in later pyrenoid work.
  - id: PMID:11641402
    title: First crystal structure of Rubisco from a green alga, Chlamydomonas
      reinhardtii.
    findings:
      - statement: The 1.4 A crystal structure shows Chlamydomonas Rubisco is an
          L8S8 holoenzyme; the SSU betaA-betaB loop is longer than in spinach and
          affects holoenzyme stability and catalysis.
        supporting_text: Overall, the structure shows high similarity to the
          previously determined structures of L8S8 Rubisco enzymes.
      - statement: Post-translational modifications include N-terminal methylation.
        supporting_text: These include cysteine and N-terminal methylations and
          proline 4-hydroxylations.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract-only cache; PubMed-verified. Structural evidence for
        L8S8 complex membership (PDB 1GK8); UniProt cites it for subunit
        structure, transit-peptide cleavage and Met-46 methylation.
  - id: PMID:20424165
    title: 'Functional hybrid rubisco enzymes with plant small subunits and algal
      large subunits: engineered rbcS cDNA for expression in chlamydomonas.'
    findings:
      - statement: The active site is in the large subunit; small subunits influence
          carboxylation efficiency and CO2/O2 specificity.
        supporting_text: Although the large subunit contains the active site, a
          family of rbcS nuclear genes encodes the Rubisco small subunits, which
          can also influence the carboxylation catalytic efficiency and CO(2)/O(2)
          specificity of the enzyme.
      - statement: Hybrid enzymes with plant SSUs are catalytically proficient but
          the strains lack pyrenoids, pointing to the SSU as the pyrenoid
          targeting determinant.
        supporting_text: It appears that small subunits contain the structural
          elements responsible for targeting Rubisco to the algal pyrenoid
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract-only cache; PubMed-verified. Establishes that the SSU
        is non-catalytic but modulates kinetics, and first links the SSU to
        pyrenoid formation.
  - id: PMID:23112177
    title: Rubisco small-subunit α-helices control pyrenoid formation in
      Chlamydomonas.
    findings:
      - statement: Pyrenoid formation, Rubisco aggregation and CCM activity depend on
          the two surface-exposed SSU alpha-helices.
        supporting_text: 'pyrenoid occurrence was shown to be conditioned by the
          amino acid composition of two surface-exposed α-helices of the SSU: higher
          plant-like helices knock out the pyrenoid, whereas native algal helices
          establish a pyrenoid.'
      - statement: Introducing spinach helices into the native Chlamydomonas RBCS1
          (reciprocal mutant) abolishes the pyrenoid.
        supporting_text: 'Proof that both Chlamydomonas SSU α-helices are an absolute
          requirement for pyrenoid integrity was shown by the reciprocal mutant: the
          pyrenoid was lost when both spinach SSU α-helices were introduced into an
          otherwise Chlamydomonas wild-type LSU+SSU holoenzyme'
      - statement: The reciprocal construct was built on native RBCS1.
        supporting_text: The reverse construct (substituting the algal helices with
          the spinach helices) was undertaken on a vector that contained the native
          Chlamydomonas RbcS1 , flanked by the same regulatory sequences as above.
      - statement: In pyrenoid-negative lines Rubisco is dispersed through the
          stroma.
        supporting_text: In contrast, immunolocalization of Rubisco in the
          pyrenoid-negative lines (spinach hybrid and reciprocal) showed Rubisco was
          redistributed throughout the stroma, similar to higher plant chloroplasts.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached (PMC3511088). Key genetic evidence that the
        RBCS1 helices determine pyrenoid formation and Rubisco aggregation.
  - id: PMID:33230314
    title: The structural basis of Rubisco phase separation in the pyrenoid.
    findings:
      - statement: Each Rubisco holoenzyme has eight EPYC1 binding sites, one on
          each small subunit; interface mutations disrupt binding, phase separation
          and pyrenoid formation.
        supporting_text: indicates that each Rubisco holoenzyme has eight binding
          sites for EPYC1, one on each Rubisco small subunit. Interface mutations
          disrupt binding, phase separation and pyrenoid formation.
      - statement: EPYC1 residues form salt bridges with D23 and E24 of SSU helix A
          and with R91 of helix B.
        supporting_text: 'EPYC1 residues R64 and R71 interact with E24 and D23,
          respectively, of Rubisco small subunit α-helix A, and EPYC1 residue E66
          interacts with R91 of Rubisco small subunit α-helix B.'
      - statement: RBCS1 point mutants D23A/E24A and M87D/V94D were built in the
          native RBCS1 gene and expressed in the rbcS deletion strain.
        supporting_text: which encode RBCS1D23A/E24A, and RBCS1M87D/V94D,
          respectively.
      - statement: The mutants lack a visible pyrenoid matrix and grow poorly under
          conditions requiring the pyrenoid.
        supporting_text: Rubisco small subunit mutations D23A/E24A or M87D/V94D
          caused a growth defect under conditions requiring a functional pyrenoid
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached (PMC7736253). Cryo-EM structure of the
        EPYC1-SSU interface plus in vivo RBCS1 point mutants.
  - id: PMID:27166422
    title: A repeat protein links Rubisco to form the eukaryotic
      carbon-concentrating organelle.
    findings:
      - statement: Tagged RBCS colocalizes with EPYC1 in the pyrenoid.
        supporting_text: Venus-tagged EPYC1 showed clear colocalization with
          mCherry-tagged RBCS in the pyrenoid
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Identifies EPYC1 as the Rubisco linker; RBCS fusion used as
        the pyrenoid marker.
  - id: PMID:28938114
    title: The Eukaryotic CO(2)-Concentrating Organelle Is Liquid-like and
      Exhibits Dynamic Reorganization.
    findings:
      - statement: RbcS1-Venus marks the pyrenoid matrix and partly disperses into
          the stroma during pyrenoid division.
        supporting_text: A portion of the RbcS1-Venus and EPYC1-Venus signals
          rapidly dispersed from the pyrenoid matrix into the stroma for ~20 minutes
          near the end of chloroplast and pyrenoid division
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Live imaging of RbcS1-Venus specifically; direct localization
        of RBCS1 in the pyrenoid matrix.
  - id: PMID:30498228
    title: The phase separation underlying the pyrenoid-based microalgal Rubisco
      supercharger.
    findings:
      - statement: Purified Rubisco and EPYC1 are necessary and sufficient to form
          liquid droplets, and phase-separated Rubisco remains active.
        supporting_text: two proteins, Rubisco and the linker protein Essential
          Pyrenoid Component 1 (EPYC1), are both necessary and sufficient to phase
          separate and form liquid droplets. The phase-separated Rubisco is
          functional.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: In vitro reconstitution with holoenzyme; does not resolve
        RBCS1 versus RBCS2.
  - id: PMID:31504763
    title: The pyrenoidal linker protein EPYC1 phase separates with hybrid
      Arabidopsis-Chlamydomonas Rubisco through interactions with the algal
      Rubisco small subunit.
    findings:
      - statement: EPYC1 binds the Chlamydomonas SSU, dependent on its two
          surface-exposed helices; a Chlamydomonas SSU lets hybrid Arabidopsis
          Rubisco phase separate with EPYC1.
        supporting_text: Interaction is crucially dependent on the two
          surface-exposed α-helices of the Chlamydomonas SSU.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Yeast two-hybrid and in vitro phase-separation evidence;
        corroborates the SSU helices as the EPYC1 binding site.
  - id: PMID:28839179
    title: Evolution of rubisco complex small subunit transit peptides from algae
      to plants.
    findings:
      - statement: The Chlamydomonas RbcS transit peptide lacks plant motifs and
          does not function in Arabidopsis without the FP-RK motif.
        supporting_text: Chlamydomonas reinhardtii RbcS (CrRbcS) TP was
          non-functional in Arabidopsis.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Transit-peptide evolution study; UniProt cites it for chloroplast
        location, but it mainly tests the CrRbcS transit peptide in plant cells.
