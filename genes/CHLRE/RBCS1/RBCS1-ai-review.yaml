  label: Chlamydomonas reinhardtii
description: >-
  RBCS1 encodes one of the two nearly identical small subunits (SSU) of
  ribulose-1,5-bisphosphate carboxylase/oxygenase (Rubisco) in Chlamydomonas
  reinhardtii; RBCS1 and RBCS2 differ by only four residues and either one
  alone supports holoenzyme assembly and photosynthesis. The 185-residue
  nuclear-encoded precursor carries a 45-residue N-terminal chloroplast transit
  peptide; the mature 140-residue subunit (N-terminally methylated at Met-46)
  assembles with the chloroplast-encoded large subunit (rbcL) into the
  hexadecameric L8S8 holoenzyme, in which four small subunits cap each end of
  the core of large-subunit dimers. The small subunit carries no catalytic
  residues, since the active site for RuBP carboxylation and oxygenation is
  formed by the large subunits. The SSU is nonetheless required for holoenzyme
  accumulation (without small subunits, large-subunit synthesis is inhibited
  at translation) and it changes the carboxylation rate and the CO2/O2
  specificity of the enzyme. In Chlamydomonas the SSU also determines where
  Rubisco is in the chloroplast. Two solvent-exposed alpha-helices (helix A and
  helix B) on each SSU form the binding site for the Rubisco-binding regions of
  the intrinsically disordered linker EPYC1, through salt bridges (for example
  D23/E24 of helix A) and a hydrophobic patch (M87, V94 of helix B), giving
  each holoenzyme eight EPYC1 sites. This multivalent, low-affinity
  Rubisco-EPYC1 network demixes into the liquid-like pyrenoid matrix in the
  chloroplast stroma, the site of CO2 fixation in the algal CO2-concentrating
  mechanism. Replacing the algal SSU helices with higher-plant helices, or
  point mutations at the EPYC1 interface, abolish the pyrenoid, disperse
  Rubisco through the stroma and impair growth that depends on the CCM. A
  Chlamydomonas SSU also allows Arabidopsis-Chlamydomonas hybrid Rubisco to
  phase separate with EPYC1 in vitro.
