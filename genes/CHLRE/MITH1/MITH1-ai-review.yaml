id: A0A2K3DMK6
gene_symbol: MITH1
aliases:
  - MIssing THylakoids 1
  - SAGA3
  - STARCH GRANULES ABNORMAL FAMILY MEMBER 3
  - Cre06.g259100
  - CHLRE_06g259100v5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  MITH1 (MIssing THylakoids 1; also called SAGA3; locus Cre06.g259100) is a
  large (1,304 aa, ~138 kDa) nuclear-encoded pyrenoid protein of
  Chlamydomonas reinhardtii. It is a distant homologue of the pyrenoid
  starch-sheath and tubule proteins SAGA1 and SAGA2, but it has no CBM20
  starch-binding domain and no detectable Rubisco-binding motif. Its sequence
  is dominated by long predicted coiled-coil segments flanked by disordered,
  low-complexity N- and C-terminal regions. MITH1 localizes to the thylakoid
  membrane tubules that traverse the pyrenoid Rubisco matrix. It is most
  concentrated on the peripheral, cylindrical tubules, sits on the stromal
  (matrix-facing) side of the membrane, and co-pellets with membranes in a
  detergent-sensitive way. Under high CO2 it spreads through the whole tubule
  network, and at limiting CO2 it retreats to the peripheral tubules. MITH1
  binds SAGA1, its most abundant specific interactor, and depends on SAGA1 to
  reach the pyrenoid. Without SAGA1 it is dispersed through the chloroplast.
  MITH1 is required to extend the membranes through the matrix after SAGA1
  has started them. In mith1 mutants, thylakoids cross the starch sheath and
  stop at the matrix surface, so pyrenoids lack matrix-traversing tubules.
  The mutants form some extra small Rubisco condensates and grow poorly at
  limiting CO2, a milder defect than that of saga1. Expressed together with
  SAGA1 in Arabidopsis plants carrying an EPYC1-Rubisco condensate, MITH1
  makes thylakoid membrane sheets traverse the condensate. Neither protein
  does this alone. MITH1 is proposed to strengthen the adhesive contact
  between the membrane and the Rubisco matrix that SAGA1 makes.
references:
  - id: PMID:39548241
    title: SAGA1 and MITH1 produce matrix-traversing membranes in the CO(2)-fixing
      pyrenoid.
    findings:
      - statement: mith1 mutants lack matrix-traversing membranes, and
          complementation with MITH1-Venus restores them
        supporting_text: In the complemented strain mith1;MITH1-Venus, an
          apparently normal matrix-traversing membrane tubule network is restored
      - statement: MITH1 is needed to extend the membranes through the matrix,
          not to initiate them
        supporting_text: These observations suggest that pyrenoid membrane
          formation initiates at the correct cellular location in the mith1
          mutant but then stalls before these membranes are extended through the
          pyrenoid matrix.
      - statement: In mith1, thylakoids cross the starch sheath and stop at the
          matrix surface
        supporting_text: several TEM images of the mith1 mutant showed thylakoid
          membranes crossing the pyrenoid starch sheath and stopping at the
          surface of the matrix
      - statement: MITH1 localizes to the matrix-traversing membranes, not the
          matrix as proposed earlier
        supporting_text: Whereas MITH1 was previously proposed to localize to the
          Chlamydomonas pyrenoid matrix19,20, here we observed that it localizes
          to and functions at the matrix-traversing membranes.
      - statement: MITH1 co-pellets with membranes and is released by detergent
        supporting_text: Chlamydomonas cell fractionation also supported membrane
          localization, as MITH1 co-pelleted with membranes in the absence of
          detergent and was solubilized when detergent was added
      - statement: MITH1 binds SAGA1 in vivo (reciprocal IP-MS)
        supporting_text: SAGA1 was MITH1’s most-abundant specific interactor, and
          MITH1 was one of SAGA1’s most-specific interactors, indicating that the
          two proteins physically interact
      - statement: No direct MITH1 binding to Rubisco or EPYC1 was detected by
          yeast two-hybrid
        supporting_text: We could not detect evidence of direct MITH1 physical
          interaction with Rubisco or EPYC1 by yeast two-hybrid assay
      - statement: MITH1 needs SAGA1 for its recruitment to the condensate and
          for its function; saga1 is epistatic to mith1
        supporting_text: MITH1 requires SAGA1 for its recruitment to the
          condensate and for its function
      - statement: SAGA1 and MITH1 together, but neither alone, make thylakoid
          membranes traverse a Rubisco condensate in Arabidopsis
        supporting_text: These results demonstrate that SAGA1 and MITH1 together
          are sufficient to generate matrix-traversing thylakoid membranes in a
          heterologous system.
      - statement: Proposed mechanism, MITH1 raises the membrane-matrix adhesive
          force by binding SAGA1
        supporting_text: We propose that MITH1 increases the membrane–matrix
          adhesive force per unit area by binding to SAGA1
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached; PubMed-verified (Nat Plants 2024, Hennacy
        et al.). The primary functional paper for MITH1. It gives the mutant TEM
        with complementation, Venus localization, membrane fractionation,
        reciprocal IP-MS with SAGA1, epistasis with saga1, and heterologous
        reconstitution in Arabidopsis. The adhesion mechanism is a model.
  - id: PMID:39211136
    title: Biogenesis, engineering and function of membranes in the CO (2)
      -fixing pyrenoid.
    findings:
      - statement: Preprint summary that MITH1 localizes to the tubules and is
          needed for their extension
        supporting_text: MITH1 localizes to
          the tubules and is necessary for their extension through the pyrenoid.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Abstract-only bioRxiv preprint of PMID:39548241, which is
        used as the primary evidence. Kept because the pyrenoid CCM module cites
        it.
  - id: PMID:42465278
    title: Super-resolution expansion microscopy reveals nanoscale protein domains
      and CO(2)-dependent remodeling of Chlamydomonas pyrenoid-traversing
      membranes.
    findings:
      - statement: MITH1 is mostly restricted to the cylindrical tubules at the
          pyrenoid periphery
        supporting_text: MITH1 signal was largely restricted to the cylindrical
          tubules at the pyrenoid periphery
      - statement: The MITH1 C terminus lies away from the tubule membrane, on
          the matrix side, consistent with an extended coiled coil
        supporting_text: our results suggest that the antibody epitope-containing
          C-terminus of MITH1 is localized distally from the tubule membrane
      - statement: SAGA1 is more peripheral than MITH1, consistent with SAGA1
          initiating and MITH1 extending the tubules
        supporting_text: SAGA1 likely acts first at the surface of the pyrenoid
          to initiate pyrenoid-traversing membranes’ entrance into the matrix, and
          then MITH1 acts to extend them through the pyrenoid
      - statement: MITH1 relocalizes with CO2 level, spread through the network
          at high CO2 and peripheral at low CO2
        supporting_text: MITH1 was uniformly distributed throughout the tubule
          network at high CO2 and became increasingly peripheral during the
          transition to low CO2.
      - statement: The authors cite unpublished/preprint work reporting that
          MITH1 binds membranes and Rubisco
        supporting_text: We recently showed that MITH1 can bind both membranes and
          Rubisco, likely serving to link the pyrenoid tubule and matrix
          compartments40.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: bioRxiv preprint (2026), full text cached, not yet peer
        reviewed. Expansion microscopy with a validated anti-MITH1 antibody
        refines MITH1 to the peripheral cylindrical tubules, on the matrix side
        of the membrane. The statement that MITH1 binds membranes and Rubisco
        cites a structural study (its ref. 40) that is not in PubMed or the
        cache. It conflicts with the negative yeast two-hybrid in PMID:39548241,
        so direct Rubisco binding is treated as unconfirmed here.
  - id: PMID:35513725
    title: Systematic characterization of gene function in the photosynthetic
      alga Chlamydomonas reinhardtii.
    findings:
      - statement: Cre06.g259100 was named SAGA3 for its homology to SAGA1 and
          SAGA2, from a genome-wide mutant phenotyping screen
        supporting_text: We named one of these genes, Cre06.g259100, SAGA3
          (STARCH GRANULES ABNORMAL FAMILY MEMBER 3) because its protein product
          shows homology to the two pyrenoid structural proteins SAGA1 and SAGA2
      - statement: SAGA3 localizes to the pyrenoid
        supporting_text: Consistent with a role in the CCM, SAGA3 localizes to the
          pyrenoid
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached; PubMed-verified (Fauser et al., Nat Genet
        2022). The high-throughput screen that found the low-CO2 growth defect
        and named the gene SAGA3. Hennacy 2024 (PMID:39548241) cites it as
        ref. 11 for the same gene, renamed MITH1.
  - id: PMID:28938113
    title: A Spatial Interactome Reveals the Protein Organization of the Algal
      CO(2)-Concentrating Mechanism.
    findings:
      - statement: Cre06.g259100 was earlier listed as a pyrenoid matrix protein
          of unknown function
        supporting_text: a protein of unknown function
          (Cre06.g259100; Kobayashi et al., 2016)
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Full text cached. Mentions the gene only once, as a matrix
        protein of unknown function. That matrix assignment was revised to the
        matrix-traversing membranes by PMID:39548241 and PMID:42465278. Kept as
        historical context, no GO term is drawn from it.
  - id: PMID:33177094
    title: Assembly of the algal CO(2)-fixing organelle, the pyrenoid, is guided
      by a Rubisco-binding motif.
    findings: []
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Full text cached. Defines the pyrenoid Rubisco-binding motif
        carried by SAGA1, SAGA2 and RBMP1/2. MITH1 is not named in it.
        Hennacy 2024 cites it (ref. 21) for the statement that MITH1 lacks any
        detectable Rubisco-binding motif. Background only.
