  - term:
      id: GO:0010027
      label: thylakoid membrane organization
    evidence_type: IMP
    original_reference_id: PMID:39548241
    review:
      summary: MITH1 is required to extend thylakoid-derived membranes through
        the Rubisco matrix, and with SAGA1 it is sufficient to make thylakoid
        sheets traverse an EPYC1-Rubisco condensate in Arabidopsis.
      action: NEW
      reason: GO has no pyrenoid tubule biogenesis term, and thylakoid membrane
        organization is the closest existing process, as for SAGA1. Participation
        test. MITH1 is not a substrate or a remote requirement. It sits on the
        membranes it reorganises, binds SAGA1, and is proposed to add the
        adhesive membrane-matrix force that lets the membrane advance into the
        matrix. That is a structural contribution to the step itself. The mith1
        phenotype is specific (membranes reach the matrix surface and stop),
        complementation restores it, and heterologous sufficiency with SAGA1
        goes beyond necessity evidence. Comparator check. Structural thylakoid
        shapers such as Arabidopsis VIPP1 and FZL carry GO:0010027, and the
        sibling review of SAGA1 uses the same term for the initiation step.
        The open point is how MITH1 contacts the membrane and whether it binds
        Rubisco directly.
      supported_by:
        - reference_id: PMID:39548241
          supporting_text: These observations suggest that pyrenoid membrane
            formation initiates at the correct cellular location in the mith1
            mutant but then stalls before these membranes are extended through
            the pyrenoid matrix.
        - reference_id: PMID:39548241
          supporting_text: In the complemented strain mith1;MITH1-Venus, an
            apparently normal matrix-traversing membrane tubule network is
            restored
        - reference_id: PMID:39548241
          supporting_text: These results demonstrate that SAGA1 and MITH1 together
            are sufficient to generate matrix-traversing thylakoid membranes in a
            heterologous system.
        - reference_id: PMID:39548241
