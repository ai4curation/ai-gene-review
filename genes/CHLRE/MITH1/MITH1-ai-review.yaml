proposed_new_terms:
  - proposed_name: pyrenoid tubule assembly
    proposed_definition: The formation of pyrenoid tubules, the thylakoid
      membranes that enter and traverse the Rubisco matrix of a pyrenoid.
    justification: SAGA1 and MITH1 are necessary for pyrenoid tubules and
      together sufficient to make thylakoids traverse a Rubisco condensate in
      Arabidopsis. GO has a pyrenoid tubule cellular component term but no
      process term for its formation, so the role can only be captured with
      the generic thylakoid membrane organization term.
    proposed_parent:
      id: GO:0010027
      label: thylakoid membrane organization
    supported_by:
      - reference_id: PMID:39548241
        supporting_text: These results demonstrate that SAGA1 and MITH1 together
          are sufficient to generate matrix-traversing thylakoid membranes in a
          heterologous system.
suggested_questions:
  - question: Does MITH1 bind Rubisco directly? Hennacy et al. found no yeast
      two-hybrid interaction and no recruitment to the condensate without SAGA1,
      but a 2026 preprint cites structural work reporting MITH1 binding to
      membranes and Rubisco. The answer decides whether MITH1 is a
      membrane-matrix adaptor in its own right or an amplifier of SAGA1.
    experts:
      - Jonikas MC
  - question: How does MITH1 attach to the membrane? It has no predicted
      transmembrane segment, yet it co-pellets with membranes and is released
      by detergent. Is the contact through lipids, a thylakoid membrane
      protein, or SAGA1?
  - question: Should GO add a "pyrenoid tubule assembly" process term so that
      tubule biogenesis factors (SAGA1, MITH1) can be annotated more
      specifically than GO:0010027 thylakoid membrane organization?
suggested_experiments:
  - hypothesis: MITH1 bridges membranes and the Rubisco matrix through
      separable regions.
    description: Purify MITH1 and fragments (N-terminal disordered region,
      coiled-coil core, C-terminal region) and test binding to thylakoid-lipid
      liposomes (flotation), to SAGA1 and to Rubisco (pull-down, SPR). Test
      which fragments complement the mith1 tubule-extension defect.
    experiment_type: biochemical reconstitution and genetic complementation
  - hypothesis: The CO2-dependent relocalization of MITH1 tracks Rubisco
      availability in the matrix.
    description: Image MITH1 by expansion microscopy across high-to-low CO2
      shifts in strains with altered matrix size (for example EPYC1 dosage
      mutants) and compare its radial distribution with Rubisco.
    experiment_type: quantitative imaging
