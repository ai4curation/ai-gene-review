  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '12846565'
      value: Acts as a linker essential in the assembly of a core complex of PRK/GAPDH. Coordinates the reversible
        inactivation of chloroplast enzymes GAPDH and PRK during darkness in photosynthetic tissues
    commentType: FUNCTION
  - texts:
    - evidences:
      - evidenceCode: ECO:0000250
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '12846565'
      value: Monomer (By similarity). Component of a complex that contains two dimers of PRK, two tetramers of GAPDH
        and CP12. CP12 associates with GAPDH, causing its conformation to change. This GAPDH/CP12 complex binds
        PRK to form a half-complex (one unit). This unit probably dimerizes due partially to interactions between
        the enzymes of each unit
    commentType: SUBUNIT
