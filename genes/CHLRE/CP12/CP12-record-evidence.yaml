reference_proteome_record:
  id: UP000006906
  description: "Chlamydomonas reinhardtii is a single-celled green alga found in freshwater and soil throughout\
    \ the world. It has been widely studied because of its adaptability to different environments and short generation\
    \ time. \n\nChlamydomonas reinhardtii has the ability to use alternative carbon sources in the absence of light\
    \ and has been the experimental material of choice for major studies in photosynthesis. It is also used as a\
    \ model system for studying the structure and function of eukaryotic flagellae (cilia).\n\nChlamydomonas reinhardtii\
    \ is haploid, and has a nuclear genome comprising 17 chromosomes with a total size of 110 Mb, a 203 kb chloroplast\
    \ genome and a 16 kb mitochondrial genome, with 14,000 protein-coding genes. The reference proteome for Chlamydomonas\
    \ reinhardtii has been derived from the genome sequence prepared by the JGI Chlamydomonas sequencing project\
    \ (http://www.phytozome.net/chlamy A)."
