core_functions:
  - description: Bestrophin-type anion channel, modelled as pentameric, in the chloroplast
      thylakoid membrane, acting redundantly with (and probably
      hetero-oligomerizing with) paralogs BST1 and BST2, and positioned near the
      stromal LCIB/LCIC complex at the pyrenoid periphery. It is proposed (from
      triple-knockdown physiology, location and family precedent, not from
      transport measurements) to conduct stromal bicarbonate into the thylakoid
      lumen for dehydration by CAH3 in the low-CO2 inducible CO2-concentrating
      mechanism.
    molecular_function:
      id: GO:0005253
      label: monoatomic anion channel activity
    locations:
      - id: GO:0009535
        label: chloroplast thylakoid membrane
    supported_by:
      - reference_id: PMID:31391312
        supporting_text: the selective pore is positively charged, supporting the
          hypothesis that BST1–3 transport negatively charged ions
      - reference_id: PMID:31391312
        supporting_text: This line showed the same localization pattern as BST3
          under the constitutive PSAD promoter
      - reference_id: PMID:31391312
        supporting_text: These results indicate that BST1–3 play an important
          role in Ci uptake and fixation in low CO2 conditions in Chlamydomonas.
      - reference_id: PMID:31391312
        supporting_text: We propose that BST1–3 are the transporters that bring
          HCO3− to CAH3 inside the thylakoid.
      - reference_id: PMID:28938113
        supporting_text: Both LCIB and LCIC interact with LCI11 (Cre16.g663450),
          and LCIC also interacts with Cre16.g662600
suggested_questions:
  - question: Does BST3 conduct bicarbonate, chloride, or both, and do BST1-3
      form hetero-pentamers in vivo? Until transport is measured, should a
      bicarbonate channel term be asserted for any of BST1-3?
    experts:
      - Moroney JV
      - Mackinder LCM
  - question: Is the BST3-LCIB/LCIC interaction direct, and does LCIB/LCIC
      gate or position BST3 at the pyrenoid periphery to recapture leaked CO2 as
      bicarbonate?
  - question: Which other papers using the name LCI11 refer to BST3
      (Cre16.g663450) rather than BST2 (Cre16.g663400)?
suggested_experiments:
  - hypothesis: BST3 (alone or with BST1/BST2) forms a bicarbonate-permeable
      anion channel.
    description: Express BST3 (with and without BST1/BST2, and C-terminally
      truncated to relieve possible autoinhibition) in HEK293 cells or Xenopus
      oocytes, or reconstitute purified protein in planar bilayers, and measure
      reversal potentials and relative permeability for HCO3- versus Cl-.
    experiment_type: electrophysiology
  - hypothesis: BST1-3 act redundantly, with BST3 sufficient for the CCM when
      the other two are absent.
    description: Generate bst1 bst2 double and bst1 bst2 bst3 triple CRISPR
      knockouts in the bst3 CLiP background and complement with native-promoter
      BST3; test growth at low CO2, K1/2(Ci) and 14C-Ci accumulation.
    experiment_type: genetic knockout and complementation
