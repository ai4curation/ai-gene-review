existing_annotations:
  - term:
      id: GO:0005247
      label: voltage-gated chloride channel activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
      - AGI_LocusCode:AT3G61320
      - PANTHER:PTN004990962
    review:
      summary: Phylogenetic transfer from Arabidopsis VCCN1, an
        electrophysiologically characterized voltage-dependent thylakoid Cl-
        channel. BST3 shares the bestrophin fold and the anion-selective pore of
        BST1-3 (homology model), so anion channel activity is a sound inference.
        Neither chloride selectivity nor voltage gating has been tested for
        BST3, and BST1-3 behave differently from VCCN1 in vivo (knockdown lowers
        rather than raises thylakoid pmf). Their physiological role is linked to
        inorganic carbon (proposed HCO3-) delivery to the lumen.
      action: MODIFY
      reason: Same reasoning as for the near-identical paralogs BST1 and BST2.
        The IBA correctly places BST3 in an anion-channel clade, but the
        chloride- and voltage-specific child term is a VCCN1-specific property
        that the only functional study of BST1-3 argues against. Generalizing to
        monoatomic anion channel activity keeps the family inference without
        asserting Cl-/voltage specifics. A bicarbonate-specific term would be
        premature until transport is measured.
      proposed_replacement_terms:
        - id: GO:0005253
          label: monoatomic anion channel activity
      propagation_review:
        root_cause: TERM_SCOPING_PROBLEM
        failure_modes:
          - FUNCTIONAL_DIVERGENCE
          - GRANULARITY_MISMATCH
        source_entities:
          - source_id: PANTHER:PTN004990962
