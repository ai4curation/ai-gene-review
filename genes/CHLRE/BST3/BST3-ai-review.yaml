            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: Node grounded by Arabidopsis VCCN1 (AT3G61320), a bilayer-verified
              voltage-dependent Cl- channel. BST3 is inside the bestrophin anion-channel
              clade, so anion channel activity transfers, but Cl-/voltage specifics are
              not shown for BST1-3, whose in vivo pmf effect is opposite to VCCN1.
      supported_by:
        - reference_id: PMID:31391312
          supporting_text: the selective pore is positively charged, supporting
            the hypothesis that BST1–3 transport negatively charged ions
        - reference_id: PMID:31391312
          supporting_text: The presence of AtVCCN1 decreases pmf in Arabidopsis,
            but the presence of the 3 BST proteins increases pmf in Chlamydomonas.
        - reference_id: PMID:27216227
          supporting_text: In this study, we bring evidence that AtVCCN1 forms a
            voltage-dependent Cl− channel, is located in the thylakoid membrane
