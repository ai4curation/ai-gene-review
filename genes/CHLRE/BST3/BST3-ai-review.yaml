taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  BST3 (bestrophin-like protein 3; locus Cre16.g663450; called LCI11 in the
  2017 CO2-concentrating-mechanism interactome) is a nuclear-encoded,
  chloroplast-targeted multi-pass membrane protein of the bestrophin/YneE/VCCN
  family in the green alga Chlamydomonas reinhardtii. It is one of three
  closely related paralogs (BST1/Cre16.g662600, BST2/Cre16.g663400 and BST3;
  more than 80% identical to one another) clustered in a ~130 kb region of
  chromosome 16. Its nearest land-plant relative is the Arabidopsis thylakoid
  voltage-dependent chloride channel VCCN1 (about 30% identity). Homology
  modelling of the BST1-3 group places them in the pentameric bestrophin
  channel fold, with a positively charged selectivity pore consistent with an
  anion channel. BST3 transcripts rise within two hours of transfer to
  air-level CO2, and BST3 expression is severely reduced in mutants lacking
  the CCM master regulator CIA5, as for other CCM genes. A Venus fusion
  expressed from the native BST3 promoter lies in the thylakoid membranes of
  the chloroplast, extends into the pyrenoid thylakoid tubules, and is about
  1.5-fold enriched at the pyrenoid periphery. In an affinity-purification
  interactome, BST3 interacted with BST1 and BST2 and with the stromal
  LCIB/LCIC complex that sits around the pyrenoid. A CLiP insertion mutant
  lacking BST3 protein has only a weak growth defect and slightly lower
  inorganic-carbon uptake at air-level CO2, whereas RNAi lines in which all
  three paralogs are knocked down grow poorly at limiting CO2, have lower
  affinity for inorganic carbon and accumulate less of it, implying
  redundancy. BST1-3 are therefore proposed to be redundant thylakoid anion
  channels that move stromal bicarbonate into the thylakoid lumen, where
  carbonic anhydrase CAH3 converts it to CO2 for Rubisco in the pyrenoid.
  Bicarbonate (or any anion) conductance has not been measured for any of
  BST1-3.
references:
  - id: PMID:31391312
    title: Thylakoid localized bestrophin-like proteins are essential for the CO(2)
      concentrating mechanism of Chlamydomonas reinhardtii.
    findings:
      - statement: BST3 is Cre16.g663450, one of three paralogous bestrophin-like
          genes clustered on chromosome 16
        supporting_text: BST1 (Cre16.g662600), BST2 (Cre16.g663400), and BST3
          (Cre16.g663450) (collectively BST1–3) are paralogous bestrophin-like
          genes
      - statement: BST1-3 are >80% identical; BST2 and BST3 were earlier called
          LCI11
        supporting_text: BST2 and BST3 were previously reported as LCI11 by Fang
          et al. (16). An alignment between the 3 Chlamydomonas bestrophin-like
          proteins showed that the proteins are >80% identical to one another
      - statement: BST1-3 are predicted chloroplast membrane proteins with a
          transit peptide
        supporting_text: predicted that each BST protein had a chloroplast
          transit peptide and was likely to be a chloroplast membrane protein
      - statement: Homology modelling supports a pentameric bestrophin fold and
          an anion-selective pore
        supporting_text: the selective pore is positively charged, supporting the
          hypothesis that BST1–3 transport negatively charged ions
      - statement: BST3 expression is strongly CIA5-dependent, like other CCM
          genes
        supporting_text: the cia5 mutant exhibited severely reduced expression of
          BST1 and BST3 under both CO2 conditions, a transcriptional pattern
          observed with other CCM genes
      - statement: BST1-3 are induced within 2 h of transfer to low CO2
        supporting_text: All 3 genes had increased transcript levels within 2 h
          after the switch to low CO2
      - statement: BST3 under its native promoter localizes like the PSAD-driven
          fusion, enriched ~1.46-fold at the pyrenoid periphery
        supporting_text: This line showed the same localization pattern as BST3
          under the constitutive PSAD promoter (Fig. 3C), and quantification of
          enrichment showed a 1.46-fold enrichment
      - statement: Venus-tagged BST1-3 localize to chloroplast thylakoid
          membranes extending into pyrenoid tubules
        supporting_text: All 3 BST-like proteins localized to the thylakoid
          membranes of the chloroplast (Fig. 3A), and this localization visibly
          extended into the thylakoid tubules of the pyrenoid
      - statement: The bst3 CLiP mutant lacks BST3 protein but has only a weak
          growth phenotype
        supporting_text: The BST3 transcript was not detected in bst3 (SI
          Appendix, Fig. S4B), and the BST3 protein was absent
      - statement: Single bst3 loss is buffered by BST1/BST2 redundancy
        supporting_text: This led us to think that BST1 or BST2 function might be
          redundant with BST3
      - statement: Triple knockdown impairs low-CO2 growth and Ci uptake
        supporting_text: These results indicate that BST1–3 play an important
          role in Ci uptake and fixation in low CO2 conditions in Chlamydomonas.
      - statement: BST1-3 are proposed (not shown) to deliver HCO3- to lumenal
          CAH3
        supporting_text: We propose that BST1–3 are the transporters that bring
          HCO3− to CAH3 inside the thylakoid.
      - statement: BST1-3 function differs from Arabidopsis VCCN1 (opposite pmf
          effect)
        supporting_text: The presence of AtVCCN1 decreases pmf in Arabidopsis, but
          the presence of the 3 BST proteins increases pmf in Chlamydomonas.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed/PMC-verified (PMC6708349); full text cached. The
        primary functional study of BST1-3 and the main source of BST3-specific
        data, which are the richest of the three paralogs (native-promoter
        Venus localization, CIA5-dependent expression, a protein-null CLiP
        single mutant, and BST3 immunoblots in the RNAi lines). No transport or
        electrophysiology assay; the bicarbonate-channel role is an explicit
        proposal.
