taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  RBMP1, also called BST4 (bestrophin-like protein 4; locus Cre06.g261750), is a
  nuclear-encoded, chloroplast-targeted membrane protein of about 668 residues in
  the green alga Chlamydomonas reinhardtii. Its N-terminal part is a bestrophin
  (YneE/VCCN1-like) channel domain related to the thylakoid bestrophins BST1-3
  and the plant thylakoid chloride channel VCCN1. Its long, intrinsically
  disordered C-terminus faces the stroma and carries two Rubisco-binding motifs
  that bind the alpha-helices of the Rubisco small subunit. The protein is found
  only in the pyrenoid tubules, the thylakoid-derived membranes that cross the
  Rubisco matrix of the pyrenoid, where it occupies a distinct radial subdomain.
  Its Rubisco-binding C-terminus is needed to concentrate it in the tubules.
  RBMP1 assembles in the membrane as pentamers, the typical bestrophin channel
  stoichiometry, and in larger complexes. It was first proposed to tether the
  Rubisco matrix to the tubules. However, mutants lacking the protein form
  normal pyrenoids with tubules and grow normally at air CO2, and the protein
  does not pull thylakoids into a reconstituted Rubisco condensate in
  Arabidopsis. Instead, the mutants have a transiently raised energy-dependent
  quenching during dark-to-light transitions, which points to a more acidic
  thylakoid lumen, and they grow poorly under fluctuating high light. The
  current view is therefore that RBMP1/BST4 is a pyrenoid tubule ion channel,
  possibly for bicarbonate, that helps to balance lumenal ion and proton levels
  during light changes. Its permeant ion has not been identified, since no
  currents were recorded in Xenopus oocytes.
