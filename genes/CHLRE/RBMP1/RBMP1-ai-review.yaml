          supporting_text: BST4ΔC-term-mScarlet expressed in the bst4 mutant line
            did not localize to the pyrenoid tubules but was found throughout the
            thylakoid membrane
        - reference_id: PMID:39240724
          supporting_text: indicating that BST4 is located in the tubules and not
            the Rubisco-enriched pyrenoid matrix
  - term:
      id: GO:1902476
      label: chloride transmembrane transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    supporting_entities:
      - GO:0005247
    review:
      summary: This annotation is inferred logically from the IBA voltage-gated
        chloride channel activity. Chloride transport by RBMP1/BST4 has not been
        shown. No current was detected with 100 mM KCl in oocytes, and the
        authors' hypothesis is HCO3- permeation.
      action: MARK_AS_OVER_ANNOTATED
      reason: The parent MF is being generalized to monoatomic ion channel
        activity because chloride selectivity is unsupported. The derived
        chloride-transport process therefore over-commits to a substrate that
        has not been demonstrated. It is not definitively wrong, since bestrophins
        often pass Cl-, but it should not be presented as known.
      supported_by:
        - reference_id: PMID:39240724
          supporting_text: Therefore, we were unable to conclude what BST4 is
            permeable to.
