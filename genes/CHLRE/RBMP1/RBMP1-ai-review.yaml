core_functions:
  - description: Pentameric bestrophin-family ion channel in the thylakoid-derived
      pyrenoid tubule membrane. It is held in the tubules by Rubisco-binding motifs
      on its stroma-facing disordered C-terminus. It is proposed to move an anion,
      possibly bicarbonate, across the tubule membrane and so help balance lumenal
      ion and proton levels during dark-to-light transitions and fluctuating light.
      Its permeant ion has not been identified. Its Rubisco binding serves to
      target it, not to tether the matrix, because mutants keep a normal
      tubule-matrix interface.
    molecular_function:
      id: GO:0005216
      label: monoatomic ion channel activity
    directly_involved_in:
      - id: GO:0019684
        label: photosynthesis, light reaction
    locations:
      - id: GO:0160223
        label: pyrenoid tubule
      - id: GO:0042651
        label: thylakoid membrane
    supported_by:
      - reference_id: PMID:39240724
        supporting_text: Based on these findings, we conclude that BST4 is a
          pentameric transmembrane channel found within the pyrenoid tubules but
          is not crucial for Rubisco matrix tethering.
      - reference_id: PMID:39240724
        supporting_text: The resulting probability distribution revealed that the
          most common BST4 complex is made up of 5 molecules
      - reference_id: PMID:39240724
        supporting_text: BST4ΔC-term-mScarlet expressed in the bst4 mutant line did
          not localize to the pyrenoid tubules but was found throughout the
          thylakoid membrane
      - reference_id: PMID:33177094
        supporting_text: Fluorescently tagged RBMP1 and RBMP2 localized to the
          tubules
suggested_questions:
  - question: Is RBMP1/BST4 functionally redundant with RBMP2 or other
      RBM-containing tubule proteins as a matrix-tubule tether? Would an
      rbmp1 rbmp2 double mutant disturb the tubule-matrix interface even though
      the single bst4 mutant does not?
    experts:
      - Mackinder LCM
      - Jonikas MC
  - question: What does BST4 conduct (HCO3-, Cl-, organic anions or cations), and
      what activates it, given that no oocyte currents were recorded even after
      C-terminal truncation?
    experts:
      - Walker CE
      - Burlacot A
  - question: Should the CCM module record RBMP1 and BST4 as one gene product
      (Cre06.g261750) and change its role from "Rubisco-binding tether" to
      "RBM-targeted pyrenoid tubule bestrophin channel"?
suggested_experiments:
  - hypothesis: BST4 is a bicarbonate-permeable channel that is active only under
      specific lumenal pH or with a partner protein.
    description: Reconstitute purified BST4 pentamers in planar lipid bilayers or
      liposomes (with flux assays for HCO3-, Cl- and organic anions) across a range
      of pH values, with and without Rubisco binding to the C-terminus. Test the
      Phe pore residue by mutating it to Val, the residue found in BST1-3.
    experiment_type: electrophysiology / reconstitution
  - hypothesis: RBMP1 and RBMP2 act redundantly to tether the Rubisco matrix to
      the tubules.
    description: Generate rbmp1 rbmp2 double mutants (and RBM-mutated versions)
      and image tubule-matrix contacts by cryo-ET and live imaging. Measure CCM
      performance at limiting CO2.
    experiment_type: genetics / imaging
  - hypothesis: BST4 activity changes lumenal pH in the tubules during dark-to-light
      transitions.
    description: Use a lumen-targeted pH sensor, or measure CAH3-dependent CO2
      release, in wild type, bst4 and complemented lines during light transitions
      and fluctuating light.
    experiment_type: physiology
