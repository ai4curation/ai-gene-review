existing_annotations:
  - term:
      id: GO:0005247
      label: voltage-gated chloride channel activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
      - AGI_LocusCode:AT3G61320
      - PANTHER:PTN004990962
    review:
      summary: Phylogenetic transfer from Arabidopsis VCCN1 (AT3G61320). RBMP1/BST4
        does have a conserved bestrophin channel domain and forms pentamers, so
        assigning channel activity to the family is reasonable. However, the
        chloride selectivity and voltage gating are not supported for this
        protein. BST4 has diverged at the selectivity pore, and no current was
        recorded in Xenopus oocytes with KCl or NaHCO3.
      action: MODIFY
      reason: The IBA places RBMP1 in the right channel family, and the
        bestrophin-domain evidence supports it. But the specific claim, a
        voltage-gated chloride channel, is the VCCN1 phenotype and was not
        reproduced for BST4, which has a pore substitution (Phe instead of the
        Val conserved in BST1-3). Its permeant ion is unknown, and the authors
        favour HCO3- as a hypothesis. Generalizing to monoatomic ion channel
        activity keeps the inherited channel function without asserting chloride
        selectivity or voltage gating.
      proposed_replacement_terms:
        - id: GO:0005216
          label: monoatomic ion channel activity
      propagation_review:
        root_cause: TERM_SCOPING_PROBLEM
        failure_modes:
          - FUNCTIONAL_DIVERGENCE
          - GRANULARITY_MISMATCH
        source_entities:
          - source_id: AGI_LocusCode:AT3G61320
            source_label: AtVCCN1
            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: VCCN1 is an experimentally characterized voltage-dependent
              chloride channel. BST4 falls in a separate green-algal clade with a
              divergent pore residue, and no chloride current was detected.
          - source_id: PANTHER:PTN004990962
            source_label: PTN004990962
            source_status: SUPPORTS_TRANSFER
            comment: The channel activity is plausibly ancestral to the
              bestrophin/YneE node. Only the chloride and voltage-gating
              specificity is over-scoped for this member.
        residue_claims_not_applicable: The generalization rests on the absence of
          any measured chloride conductance and on the unknown selectivity, not on
          the loss of a defined residue. The pore Phe/Val difference is reported
          by the authors but has not been functionally tested.
      supported_by:
        - reference_id: PMID:39240724
          supporting_text: BST4 also has a well-conserved bestrophin domain similar
            to those in the thylakoid-localized BST1-3 proteins
        - reference_id: PMID:39240724
          supporting_text: Second, BST4 has a phenylalanine residue in the first
            position of the putative selection pore, as opposed to valine which is
            conserved throughout BST1-3
        - reference_id: PMID:39240724
          supporting_text: Therefore, we were unable to conclude what BST4 is
            permeable to.
        - reference_id: PMID:39240724
          supporting_text: Based on these findings, we conclude that BST4 is a
            pentameric transmembrane channel found within the pyrenoid tubules but
            is not crucial for Rubisco matrix tethering.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    supporting_entities:
      - UniProtKB-SubCell:SL-0039
    review:
      summary: The UniProt "Cell membrane" location comes from an ARBA rule for
        the YneE/bestrophin family, not from any observation of this protein.
        Every experimental localization places RBMP1/BST4 in thylakoid-derived
        pyrenoid tubule membranes inside the chloroplast.
      action: REMOVE
      reason: The rule-based plasma membrane location is contradicted by direct
        imaging in two independent studies, which find the protein in the
        pyrenoid tubules. In Arabidopsis, fractionation found it in thylakoid
        stroma lamellae and not in other membranes.
      supported_by:
        - reference_id: PMID:33177094
          supporting_text: Fluorescently tagged RBMP1 and RBMP2 localized to the
            tubules
        - reference_id: PMID:39240724
          supporting_text: The protein BST4 (bestrophin-like protein 4, also known
            as Rubisco binding membrane protein 1, RBMP1; Cre06.g261750) localizes
            exclusively to the pyrenoid tubules
  - term:
      id: GO:0019684
      label: photosynthesis, light reaction
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
      - AGI_LocusCode:AT3G61320
      - PANTHER:PTN008436049
    review:
      summary: Inherited from the VCCN1 clade, whose members modulate the thylakoid
        proton motive force during illumination. For RBMP1/BST4 there is matching
        target-specific evidence. bst4 mutants show transiently raised qE-type NPQ
        at dark-to-light transitions, consistent with altered lumenal pH, and grow
        poorly under fluctuating high light. Complementation with full-length BST4
        rescues these phenotypes.
      action: ACCEPT
      reason: As a thylakoid (pyrenoid tubule) ion channel that affects lumenal
        ion and proton balance during illumination, BST4 takes part in the light
        reactions in the same way as VCCN1. The IBA is consistent with the
        mutant physiology. A more specific term, such as acclimation to
        fluctuating light, is not yet justified by mechanism.
      supported_by:
        - reference_id: PMID:39240724
          supporting_text: We found that under fluctuating high light, bst4 had a
            growth defect compared to the WT and the line complemented with
            full-length BST4
        - reference_id: PMID:39240724
          supporting_text: BST4 influences the ion homeostasis and subsequently the
            pH of the pyrenoid tubules through its function as an ion channel,
            particularly during fluctuating light.
  - term:
      id: GO:0042651
      label: thylakoid membrane
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    supporting_entities:
      - AGI_LocusCode:AT2G45870
      - AGI_LocusCode:AT3G61320
      - PANTHER:PTN008436049
    review:
      summary: Correct at the general level. The pyrenoid tubules are continuous
        with, and derived from, the thylakoid membrane. When BST4 lacks its
        C-terminus it spreads throughout the thylakoid membrane, and in
        Arabidopsis it sits in thylakoid stroma lamellae. The specific location
        in Chlamydomonas is the pyrenoid tubule, which is added below as a NEW
        annotation.
      action: ACCEPT
      reason: The phylogenetic inference agrees with direct localization of
        BST4 to thylakoid-derived tubule membranes, and to thylakoids when
        expressed heterologously.
      supported_by:
