  - term:
      id: GO:0015106
      label: bicarbonate transmembrane transporter activity
    evidence_type: IDA
    original_reference_id: PMID:26538195
    review:
      summary: HLA3 expressed in Xenopus oocytes reaches the cell surface and
        increases H14CO3- uptake 2.7-fold over controls. In Chlamydomonas,
        loss of HLA3 reduces Ci accumulation mainly at alkaline pH where
        bicarbonate dominates, and ectopic HLA3 expression raises Ci
        accumulation, most strongly with LCIA.
      action: NEW
      reason: The heterologous oocyte assay shows HLA3 itself confers
        bicarbonate uptake across a membrane, and it agrees with the
        pH-dependence of the knockdown and insertion mutant phenotypes
        (PMID:19321421, PMID:26015566) and with gain-of-function data
        (PMID:25660294). The participation test is met because HLA3 is the
        membrane protein proposed to move the substrate, not a regulator of
        another transporter. Caveats are that the oocyte effect is modest,
        bicarbonate versus CO2 specificity and ATP-dependence were not tested,
        and Duanmu et al. could not exclude an indirect role. GO has no
        ABC-type bicarbonate term, so this activity is recorded alongside
        GO:0140359.
      supported_by:
