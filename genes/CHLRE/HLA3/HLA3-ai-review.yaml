id: A0A2K3E226
gene_symbol: HLA3
aliases:
  - CrMRP1
  - High light activated 3
  - Cre02.g097800
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  HLA3 (High Light Activated 3, also CrMRP1; locus Cre02.g097800) is a
  full-size ATP-binding cassette transporter of the ABCC (multidrug
  resistance-associated protein, MRP) subfamily in the green alga
  Chlamydomonas reinhardtii. It has two transmembrane domains and two
  nucleotide-binding domains, with one consensus and one degenerate ATP site as
  is typical of ABCC proteins. HLA3 is one of seven MRP-type genes in the
  genome but the only one induced by limiting CO2 under control of the CCM
  master regulator CIA5, and its protein accumulates within hours of transfer
  to very low CO2. Immunofluorescence, plasma membrane fractionation and
  fluorescent-protein tagging place HLA3 in the plasma membrane. Loss of HLA3
  (RNAi knockdown or insertional mutation) reduces photosynthetic inorganic
  carbon affinity and intracellular inorganic carbon accumulation, mainly at
  alkaline pH where bicarbonate is the dominant species, and the defect is
  strongly enhanced by loss of the chloroplast envelope protein LCIA or the
  stromal protein LCIB. Ectopic expression raises cellular inorganic carbon
  accumulation, most strongly when co-expressed with LCIA, and HLA3 expressed in
  Xenopus oocytes increases bicarbonate uptake. HLA3 therefore supplies
  external bicarbonate across the plasma membrane as the first step of the
  algal CO2-concentrating mechanism, acting with LCIA, which moves bicarbonate
  on into the chloroplast stroma. Whether HLA3 transports bicarbonate itself by
  an ATP-driven mechanism has not been shown biochemically. In the spatial
  interactome HLA3 associates with the plasma membrane protein LCI1 and the
  P-type ATPase ACA4.
references:
  - id: PMID:19321421
    title: Knockdown of limiting-CO2-induced gene HLA3 decreases HCO3- transport
      and photosynthetic Ci affinity in Chlamydomonas reinhardtii.
    findings:
      - statement: HLA3 is the only limiting-CO2-induced, CIA5-controlled
          member of the seven Chlamydomonas MRP-type ABC transporters, with a
          full-size ABC-MRP domain arrangement.
        supporting_text: Seven putative MRP-type ABC transporters have been
          identified in C. reinhardtii ( 11 ), but only CrMRP1 ( HLA3 )
          expression is controlled by CIA5, a master regulator of the
          limiting-CO 2 –induced CCM
      - statement: HLA3 knockdown, especially combined with LCIB mutation or
          LCIA co-knockdown, decreases growth, Ci uptake and photosynthetic Ci
          affinity at pH 9, implicating HLA3 in bicarbonate transport.
        supporting_text: Collectively, the data presented here provide
          compelling evidence that HLA3 is directly or indirectly involved in
          HCO 3 − transport
      - statement: Plasma membrane location was only predicted at this time,
          and direct versus indirect action was left open.
        supporting_text: Whether HLA3 is directly involved in HCO 3 − transport
          or indirectly facilitates the activity of other HCO 3 − transporters
          remains unclear
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached (PMC2667020); PubMed esummary confirms
        title. First functional study of HLA3 (RNAi). Evidence is genetic and
        physiological; localization is a WoLF PSORT prediction plus pH
        argument, not direct.
  - id: PMID:26015566
    title: Characterization of cooperative bicarbonate uptake into chloroplast
      stroma in the green alga Chlamydomonas reinhardtii.
    findings:
      - statement: HLA3 localizes to the plasma membrane by immunofluorescence
          and membrane fractionation.
        supporting_text: Similarly, a notable enrichment of HLA3 was observed in
          the PM fraction. LCIA was highly enriched in the CE fraction, where CE
          protein CCP1 (30) was also enriched. From these results, we concluded
          that HLA3 and LCIA were localized to the PM and CE, respectively.
      - statement: An HLA3 insertion mutant (complemented) has reduced Ci
          accumulation in very low CO2.
        supporting_text: These results indicated that HLA3 has a meaningful
          role in HCO3– uptake in VLC conditions.
      - statement: Co-overexpression of HLA3 with LCIA in high CO2 increases Ci
          affinity and accumulation; HLA3 alone has a small effect.
        supporting_text: simultaneous
          overexpression of HLA3 with LCIA significantly increased Ci
          affinity/accumulation
      - statement: HLA3 and LCIA do not form a common complex; HLA3 runs at
          about 580 kDa in blue-native PAGE.
        supporting_text: These results strongly suggested that LCIA and HLA3 did
          not interact physically in vivo
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached; PubMed-verified (Yamano et al. 2015
        PNAS). Provides the direct plasma membrane localization (IDA) and an
        insertion mutant with complementation (IMP), plus overexpression data.
  - id: PMID:25660294
    title: Expression activation and functional analysis of HLA3, a putative
      inorganic carbon transporter in Chlamydomonas reinhardtii.
    findings:
      - statement: dTALE-driven activation of HLA3 in high-CO2 cells increases Ci
          accumulation and Ci-dependent photosynthesis at very low CO2.
        supporting_text: Activation of HLA3 expression
          in high CO2 acclimated cells, where HLA3 is not expressed, resulted in
          increased Ci accumulation and Ci-dependent photosynthetic O2
          evolution specifically in very low CO2 concentrations
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (Gao et al. 2015 Plant J). Abstract only in
        cache; gain-of-function support for a role in bicarbonate uptake.
  - id: PMID:26538195
    title: 'Introducing an algal carbon-concentrating mechanism into higher plants:
      location and incorporation of key components.'
    findings:
      - statement: Venus-tagged HLA3 is in the plasma membrane in Chlamydomonas.
        supporting_text: 'LCI1: Venus and HLA3: Venus were in the plasma membrane.'
      - statement: HLA3 expressed in Xenopus oocytes reaches the cell surface and
          increases H14CO3- uptake 2.7-fold.
        supporting_text: 'Oocytes transformed with mLCIA: GFP or HLA3: GFP accumulated
          2.0‐ and 2.7‐fold more 14C than water‐injected controls, respectively'
      - statement: The transport mode (active or passive) of HLA3 remains
          unresolved.
        supporting_text: Further kinetic analyses will be required to determine
          the mode of action of these proteins (i.e. active vs. passive
          transport).
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached; PubMed-verified (Atkinson et al. 2016).
        Only heterologous transport assay for HLA3; modest effect size, no
        kinetic or ATP-dependence data.
  - id: PMID:28938113
    title: A Spatial Interactome Reveals the Protein Organization of the Algal
      CO(2)-Concentrating Mechanism.
    findings:
      - statement: HLA3 co-purifies reciprocally with LCI1 and with the P-type
          ATPase ACA4.
        supporting_text: Unexpectedly, we found that HLA3 and LCI1 are found
          together in a complex.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached; PubMed-verified (Mackinder et al. 2017
        Cell). AP-MS interaction data only; used for context and questions,
        not for annotations.
  - id: PMID:22634760
    title: Transcriptome-wide changes in Chlamydomonas reinhardtii gene
      expression regulated by carbon dioxide and the CO2-concentrating mechanism
      regulator CIA5/CCM1.
    findings:
      - statement: HLA3 is a CIA5-regulated, low-CO2-induced gene clustered with
          the candidate Ci transporter genes LCIA and LCI1.
        supporting_text: includes essentially all the genes for which there is
          either compelling evidence for a C i transport role for the gene
          product in the CCM ( LCIA , LCI1 , and HLA3 )
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Full text cached; PubMed-verified (Fang et al. 2012 Plant
