existing_annotations:
  - term:
      id: GO:0000166
      label: nucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    supporting_entities:
      - UniRule:UR000400038
    review:
      summary: HLA3 has two ABC nucleotide-binding domains; NBD2 carries
        canonical Walker A and Walker B motifs and NBD1 a canonical ABC
        signature, so nucleotide (ATP) binding is expected.
      action: KEEP_AS_NON_CORE
      reason: Correct but uninformative parent of ATP binding (GO:0005524),
        which is also annotated. Nucleotide binding is a sub-step of the ABC
        transport cycle, not the core function.
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - InterPro:IPR003439
      - InterPro:IPR011527
      - InterPro:IPR017871
      - InterPro:IPR036640
      - UniRule:UR000400038
    review:
      summary: Full-size ABCC transporter with two NBDs (residues 418-639 and
        1062-1297). Inspection of the sequence shows NBD1 Walker A GRIAAGKS and
        NBD2 Walker A GRTGSGKST, with an intact consensus ATP site formed by the
        NBD2 Walker A/B and the NBD1 LSGGQ-type signature (FSGGQ).
      action: ACCEPT
      reason: Domain-based inference is sound; the ATP-binding motifs are
        conserved. ATP binding is intrinsic to the ABC-type transporter activity
        accepted below. No direct nucleotide-binding data exist for HLA3.
