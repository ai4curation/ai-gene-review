core_functions:
  - description: Plasma membrane ABC-family (ABCC/MRP-type) transporter that
      mediates uptake of external bicarbonate into the cytosol under very low
      CO2, supplying the substrate that LCIA moves into the chloroplast stroma
      in the CO2-concentrating mechanism. ATP coupling is inferred from the
      conserved NBDs but not demonstrated.
    molecular_function:
      id: GO:0015106
      label: bicarbonate transmembrane transporter activity
    directly_involved_in:
      - id: GO:0015701
        label: bicarbonate transport
    locations:
      - id: GO:0005886
        label: plasma membrane
    supported_by:
      - reference_id: PMID:26538195
        supporting_text: 'Oocytes transformed with mLCIA: GFP or HLA3: GFP accumulated
          2.0‐ and 2.7‐fold more 14C than water‐injected controls, respectively'
      - reference_id: PMID:26015566
        supporting_text: From these results, we concluded that HLA3 and LCIA
          were localized to the PM and CE, respectively.
      - reference_id: PMID:26015566
        supporting_text: simultaneous
          overexpression of HLA3 with LCIA significantly increased Ci
          affinity/accumulation
      - reference_id: PMID:19321421
        supporting_text: Collectively, the data presented here provide
          compelling evidence that HLA3 is directly or indirectly involved in
          HCO 3 − transport
suggested_questions:
  - question: Is HLA3 itself a primary-active, ATP-driven bicarbonate pump, or
      does it facilitate bicarbonate entry indirectly (for example as a
      channel-like ABCC or a regulator of LCI1/ACA4), given that only a 2.7-fold
      oocyte uptake effect and no ATPase or substrate-specificity data exist?
    experts:
      - Spalding MH
      - Fukuzawa H
  - question: Should GO provide an ABC-type bicarbonate transporter activity
      term (as a child of both GO:0140359 and GO:0015106) for HLA3 and
      cyanobacterial CmpABCD-type transporters?
  - question: What is the composition and function of the plasma membrane
      complex containing HLA3, LCI1 and the P-type ATPase ACA4 seen by AP-MS,
      and does ACA4 energise HLA3-dependent uptake?
    experts:
      - Mackinder LCM
suggested_experiments:
  - hypothesis: HLA3 transports bicarbonate by an ATP-hydrolysis-coupled
      mechanism through its consensus ATP site.
    description: Express wild-type HLA3 and Walker B (E to Q in NBD2) or
      Walker A (K to M) mutants in Xenopus oocytes or yeast and measure
      H14CO3- uptake, ATP dependence (vanadate, ATP depletion) and CO2 versus
      bicarbonate preference; complement the Hin-1 mutant with the same
      variants.
    experiment_type: heterologous transport assay and genetic complementation
  - hypothesis: Purified HLA3 has bicarbonate-stimulated ATPase activity.
    description: Purify HLA3 in detergent or nanodiscs, measure basal and
      bicarbonate-stimulated ATPase activity, and reconstitute into
      proteoliposomes for vectorial bicarbonate transport.
    experiment_type: biochemistry
