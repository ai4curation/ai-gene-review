    evidence_type: IMP
    original_reference_id: PMID:26015566
    review:
      summary: HLA3 insertion mutant (Hin-1) has reduced Ci affinity at pH 9
        and lower [14C]-Ci accumulation, restored by complementation; RNAi
        knockdown gives high-pH-specific loss of Ci uptake that is greatly
