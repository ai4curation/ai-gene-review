      reason: Supported by conserved catalytic motifs in a full-size ABC
        transporter. ATPase activity has not been measured for HLA3, and
        whether bicarbonate uptake via HLA3 is ATP-driven is untested
        (PMID:26538195 leaves active versus passive transport open), so this
        stays a sequence-based inference.
