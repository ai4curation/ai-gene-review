  - term:
      id: GO:0010027
      label: thylakoid membrane organization
    evidence_type: IMP
    original_reference_id: PMID:42427617
    review:
      summary: RBMP2 is required to form the reticulated region of the pyrenoid
        tubules, which are thylakoid-derived. Without it, tubules end bluntly
        before the centre and the reticulated network is absent; complementation
        restores it, and overexpression enlarges it. The membrane-contact and
        transmembrane regions are needed to convert tubules into narrow
        reticulated tubules, and the rhodanese domain is needed for their
        extension.
      action: NEW
      reason: Participation test. RBMP2 is an integral component of the very
        membranes that are reshaped, its own membrane-contact and transmembrane
        regions are needed for the shape change, and raising its level
        enlarges the region, so it contributes structure to the step rather
        than being merely required for it. Comparator check. The other tubule
        biogenesis factors in this system, SAGA1 and MITH1, carry the same term
        in their reviews. GO has no pyrenoid-tubule-specific organization term,
        and thylakoid membrane organization, which results in the organization
        of the thylakoid membrane from which the tubules derive, is the closest
        fit. The source is a not-yet-peer-reviewed
        preprint, but it includes complementation, overexpression and three
        imaging methods.
      supported_by:
        - reference_id: PMID:42427617
          supporting_text: Together, these results indicate that RBMP2 is required
            for reticulated-region formation.
        - reference_id: PMID:42427617
          supporting_text: Thus, RBMP2 is not only required for reticulated-region
            formation; overexpressing the RBMP2 protein is sufficient to promote
            the expansion of the reticulated region in wild-type cells.
        - reference_id: PMID:42427617
          supporting_text: MCP and TM domains are not required for cylindrical
            tubule elongation. Instead, they are required to convert elongated
            cylindrical tubules into reticulated-region tubules.
core_functions:
  - description: Builds the central reticulated region of the pyrenoid tubules.
      As an integral membrane protein of the tubules, RBMP2 is needed for the
      cylindrical tubules to extend to the pyrenoid centre (a step that needs
      its non-catalytic rhodanese domain) and for converting them into the
      narrow, minitubule-free reticulated network (a step that needs its
      membrane-contact and transmembrane regions). This network holds the
      carbonic anhydrase CAH3 near the middle of the Rubisco matrix. No
      molecular activity is asserted. Membrane bending by the membrane-contact
      region and a transmembrane hairpin is proposed but not tested, and the
      rhodanese domain lacks the catalytic cysteine. Its six Rubisco-binding
      motifs bind Rubisco as peptides but are not needed for the reticulated
      region, and a tether role is not established.
