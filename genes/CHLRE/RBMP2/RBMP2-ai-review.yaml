description: >-
  RBMP2 (Rubisco-binding membrane protein 2; locus Cre09.g416850) is a large
  (1690 residues, about 165 kDa), nuclear-encoded membrane protein of the
  chloroplast pyrenoid in the green alga Chlamydomonas reinhardtii. It has an
  N-terminal region predicted to contact membranes, a central rhodanese-like
  domain flanked on both sides by predicted transmembrane helices, and a long
  disordered C-terminal region with six Rubisco-binding motifs, the last at the
  exact C-terminus. The rhodanese-like domain is non-catalytic: it contains no
  cysteine, and an aspartate occupies the position of the catalytic cysteine
  of sulfurtransferases and CDC25 phosphatases. RBMP2 resides in the pyrenoid
  tubules, the thylakoid-derived membranes that cross the Rubisco matrix, and
  is concentrated in their central reticulated region. It builds that region.
  In rbmp2 mutants the cylindrical tubules still enter the matrix but often end
  bluntly before the centre, the narrow reticulated network is absent, the
  lumenal carbonic anhydrase CAH3 is mislocalized to the matrix periphery, and
  growth at very low CO2 is impaired. Overexpression enlarges the reticulated
  region. Domain deletions separate two steps: the rhodanese-like domain is
  needed for tubules to extend to the centre, and the membrane-contact and
  transmembrane regions are needed to convert them into narrow reticulated
  tubules. The Rubisco-binding motifs bind Rubisco as peptides but are
  dispensable for forming the reticulated region. RBMP2 was first proposed to
  tether the Rubisco matrix to the tubules, but its demonstrated role is in
  shaping the tubule membranes that position CAH3 for CO2 release near Rubisco.
references:
  - id: PMID:33177094
    title: Assembly of the algal CO(2)-fixing organelle, the pyrenoid, is guided by
      a Rubisco-binding motif.
    findings:
      - statement: Names RBMP2 (Cre09.g416850) as a Rubisco-binding membrane
          protein with predicted transmembrane domains
        supporting_text: The proteins we named Rubisco-binding membrane proteins
          RBMP1 (Cre06.g261750) and RBMP2 (Cre09.g416850) have predicted
          transmembrane domains and were previously found to bind to Rubisco
      - statement: Rubisco binding of RBMP2 was first detected by affinity
          purification-mass spectrometry
        supporting_text: SAGA2, RBMP1, RBMP2, and CSP41A by affinity
          purification–mass spectrometry (18)
      - statement: Peptides tiling RBMP2 were probed for Rubisco binding in vitro
        supporting_text: Arrays of 18–amino acid peptides tiling across the
          sequences of SAGA2 (B) and RBMP2 (C) were synthesized and probed with
          Rubisco.
      - statement: Venus-tagged RBMP2 localizes to the pyrenoid tubules
        supporting_text: Fluorescently tagged RBMP1 and RBMP2 localized to the
          tubules
      - statement: RBMP2 is confined to the central reticulated region of the
          tubules, unlike RBMP1
        supporting_text: Our microscopy data suggest that RBMP2 is confined to the
          central reticulated region of the tubules
      - statement: Proposed (untested) model in which the RBMs on RBMP1/RBMP2
          recruit Rubisco to the tubules
        supporting_text: the presence of the same motif on the pyrenoid
          tubule-localized transmembrane proteins, RBMP1 and RBMP2, recruits
          Rubisco to the tubules and favors assembly of the matrix around them
        finding_review:
          finding_status: DISPUTED
          superseded_by:
            - PMID:42427617
          review_notes: For RBMP2, deleting all six RBMs does not prevent the
            reticulated region from forming, and rbmp2 null mutants still have
            cylindrical tubules running into the matrix. The demonstrated role is
            membrane shaping rather than matrix tethering. A redundant tether
            contribution of the RBMs has not been excluded, so DISPUTED rather
            than OVERTURNED.
          supported_by:
            - reference_id: PMID:42427617
              supporting_text: These results suggest that the RBMs are dispensable
                for detectable reticulated-region formation, although they may
                still contribute to RBMP2 function in ways not resolved by these
                assays.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (Sci Adv 2020), full text cached. Names RBMP2,
        defines the Rubisco-binding motif, tests RBMP2 peptides for Rubisco
        binding and gives the first direct localization (Venus fusion) to the
        tubules. The tether role is a proposed model.
  - id: PMID:42427617
    title: RBMP2 shapes specialized membranes for CO(2) delivery in the pyrenoid
      condensate.
    findings:
      - statement: RBMP2 is in the reticulated region
        supporting_text: The predicted transmembrane protein RBMP2 localizes to the
          reticulated region27
      - statement: Loss of RBMP2 removes the reticulated region, mislocalizes CAH3
          and impairs growth at very low CO2
        supporting_text: We show that RBMP2 loss eliminates this central
          reticulated membrane network, mislocalizes CAH3 and impairs growth
          under very low CO2.
      - statement: Growth defect is rescued by RBMP2-Venus
        supporting_text: We conclude that RBMP2 is required for normal CAH3
          localization and for maintaining pyrenoid function under strongly
          CO2-limiting conditions.
      - statement: TEM confirms the reticulated region is absent and restored by
          complementation
        supporting_text: Together, these results indicate that RBMP2 is required
          for reticulated-region formation.
      - statement: Overexpression enlarges the reticulated region
        supporting_text: Thus, RBMP2 is not only required for reticulated-region
          formation; overexpressing the RBMP2 protein is sufficient to promote the
          expansion of the reticulated region in wild-type cells.
      - statement: Cylindrical tubules still enter the matrix without RBMP2 but do
          not form a reticulated network
        supporting_text: In the rbmp2 mutant, cylindrical tubules still extended
          from the pyrenoid periphery toward the center, but we never observed
          them forming a reticulated network
      - statement: Domain architecture, including a non-catalytic rhodanese domain
          flanked by transmembrane helices and six C-terminal RBMs
        supporting_text: RBMP2 contains an N-terminal region with predicted
          membrane-contact probability (MCP)33, a central non-catalytic rhodanese
          domain (RHO), predicted transmembrane helices (TM) on both sides of the
          RHO domain and six C-terminal Rubisco-binding motifs (RBMs)27
      - statement: An aspartate replaces the catalytic cysteine in the RBMP2
          rhodanese domain
        supporting_text: The catalytic cysteine residue is marked in green, and the
          non-catalytic aspartic acid residue in RBMP2 is marked in grey.
      - statement: The rhodanese domain is needed for tubule extension
        supporting_text: These results suggest that the RHO domain performs an
          essential and upstream function in reticulated-region biogenesis,
          likely promoting extension of the tubules.
      - statement: The MCP and TM regions are needed to convert tubules into
          reticulated-region tubules
        supporting_text: MCP and TM domains are not required for cylindrical
          tubule elongation. Instead, they are required to convert elongated
          cylindrical tubules into reticulated-region tubules.
      - statement: The six RBMs are dispensable for reticulated-region formation
        supporting_text: These results suggest that the RBMs are dispensable for
          detectable reticulated-region formation, although they may still
          contribute to RBMP2 function in ways not resolved by these assays.
      - statement: Tubule and minitubule fusion use other factors
        supporting_text: Tubule and minitubule fusion are likely mediated by
          factors other than RBMP2
      - statement: LCI16 interacts with RBMP2 but is not needed for the
          reticulated region
        supporting_text: However, the presence of a normal reticulated region in
          the lci16 mutant38 suggests that LCI16 is not essential for
          reticulated-region biogenesis.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified bioRxiv preprint (2026; PMC13345187), full text
        cached. The only functional study of RBMP2 (insertional mutant,
        complementation, overexpression, domain deletions, ExM, TEM and cryo-ET).
        Not yet peer reviewed, so the mechanism (membrane bending by the MCP and
        TM regions) is a proposal; the loss-of-function and rescue phenotypes are
        direct observations.
