suggested_questions:
  - question: Does RBMP2 bend membranes directly? If purified RBMP2 (or its
      membrane-contact region and C-terminal transmembrane hairpin) tubulates
      liposomes, membrane bending activity (GO:0180020) would become the
      appropriate molecular function.
    experts:
      - Jonikas MC
      - Engel BD
  - question: What does the non-catalytic rhodanese domain bind to drive tubule
      extension, given that the predicted partner LCI16 is not needed for the
      reticulated region?
    experts:
      - Jonikas MC
  - question: Do the six Rubisco-binding motifs of RBMP2 contribute to the
      tubule-matrix interface redundantly with other RBM proteins (RBMP1/BST4,
      SAGA1, MITH1)? An rbmp1 rbmp2 double mutant, or ΔRBM RBMP2 in a bst4
      background, would test the remaining tether hypothesis.
    experts:
      - Mackinder LCM
      - Jonikas MC
  - question: What is the membrane topology of RBMP2? Is the rhodanese domain,
      which lies between the predicted transmembrane helices, on the lumenal or
      the stromal (matrix) side?
suggested_experiments:
  - hypothesis: RBMP2 deforms membranes through its membrane-contact region and
      C-terminal transmembrane hairpin.
    description: Reconstitute full-length RBMP2 and truncations (ΔMCP, ΔTM) into
      liposomes or supported bilayers and image tubulation by cryo-EM; test
      whether heterologous expression in Arabidopsis chloroplasts alters
      thylakoid morphology.
    experiment_type: biochemistry / reconstitution
  - hypothesis: The RBMP2 rhodanese domain extends tubules by recruiting a
      partner protein.
    description: Proximity labelling (TurboID) of full-length and ΔRHO RBMP2 in
      the pyrenoid, followed by mutant analysis of the candidates for tubule
      termination phenotypes.
    experiment_type: proteomics / genetics
  - hypothesis: RBMP2 topology places the rhodanese domain in the lumen.
    description: Protease-protection or split-GFP topology mapping of tagged
      RBMP2 in isolated thylakoids.
    experiment_type: biochemistry
