core_functions:
  - description: Stromal beta-type carbonic anhydrase subunit that, as part of
      a hetero-oligomeric complex with its paralog LCIC, hydrates CO2 to
      bicarbonate in the chloroplast stroma. Under limiting CO2 the complex
      gathers around the pyrenoid outside the starch sheath, where it is
      proposed to recapture CO2 released by CAH3 and escaping the Rubisco
      matrix, trapping it as bicarbonate in the stromal pool of the
      CO2-concentrating mechanism.
    molecular_function:
      id: GO:0004089
      label: carbonate dehydratase activity
    locations:
      - id: GO:0009570
        label: chloroplast stroma
    supported_by:
      - reference_id: PMID:36856938
        supporting_text: We provide evidence that LCIB is an active CA using a
          Saccharomyces cerevisiae CA knockout mutant (∆NCE103) and an
          Arabidopsis thaliana βCA5 knockout mutant (βca5).
      - reference_id: PMID:27911826
        supporting_text: We determined the crystal structures of LCIB and
          limiting CO2-inducible C protein (LCIC) from C. reinhardtii and a
          CA-functional homolog from Phaeodactylum tricornutum, all of which
          harbor motifs bearing close resemblance to the active site of
          canonical β-CAs.
      - reference_id: PMID:20660228
        supporting_text: We also show that LCIB and LCIC are co-localized in the
          vicinity of the pyrenoid under LC conditions in the light, forming a
          hexamer complex of approximately 350 kDa, as estimated by gel
          filtration chromatography.
      - reference_id: PMID:34791500
        supporting_text: In VLC conditions, it migrates to aggregate around the
          pyrenoid, where the CO2-fixing enzyme ribulose 1,5-bisphosphate
          carboxylase/oxygenase is enriched.
      - reference_id: PMID:19074623
        supporting_text: We conclude that LCIB functions downstream of CAH3 in
          the CO2-concentrating mechanism and probably plays a role in trapping
          CO2 released by CAH3 dehydration of accumulated Ci.
proposed_new_terms:
  - proposed_name: LCIB-LCIC complex
    proposed_definition: A soluble hetero-oligomeric protein complex of the
      chloroplast stroma of green algae, consisting of the beta-carbonic
      anhydrase-fold paralogs LCIB and LCIC, that relocates to the periphery of
      the pyrenoid under limiting CO2 and is proposed to hydrate CO2 to
      bicarbonate.
    justification: LCIB and LCIC interact in yeast and in vivo and co-purify as
      a 350-440 kDa complex; LCIC is unstable without LCIB and LCIB relocation
      requires LCIC. No GO cellular component term exists for this complex, so
      in_complex cannot be filled.
    proposed_parent:
      id: GO:0032991
      label: protein-containing complex
    supported_by:
      - reference_id: PMID:20660228
        supporting_text: we provide evidence to demonstrate that LCIB interacts
          with the LCIB homologous protein LCIC in yeast and in vivo.
      - reference_id: PMID:34791500
        supporting_text: These results suggest that the localization changes of
          LCIB require LCIC and are controlled by CO2 concentration with ∼7 µM
          as the boundary.
suggested_questions:
  - question: Why are purified Chlamydomonas LCIB and the native LCIB-LCIC
      complex inactive in vitro while LCIB complements yeast and Arabidopsis CA
      knockouts? Is activity switched on by a post-translational modification,
      a partner such as LCIC in a defined stoichiometry, redox state, or the
      C-terminal region absent from the crystallized construct?
    experts:
      - Moroney JV
      - Mueller-Cajar O
      - Fukuzawa H
  - question: Should GO add a biological process term for the pyrenoid-based
      CO2-concentrating mechanism (or a general "inorganic carbon
      concentrating mechanism"), so that stromal and lumenal carbonic
      anhydrases, bicarbonate channels and pyrenoid linkers can be annotated to
      a shared process?
  - question: Does LCIB-LCIC act as a unidirectional ("vectorial") CO2
      hydratase coupled to some energy source, or as an ordinary reversible CA
      whose position relative to the pyrenoid alone sets the net direction of
      flux?
suggested_experiments:
  - hypothesis: Chlamydomonas LCIB has intrinsic CO2 hydration activity that
      is masked under standard in vitro conditions.
    description: Measure 18O-exchange (MIMS) activity of full-length LCIB, LCIB
      with LCIC co-expressed at native stoichiometry, and complex purified from
      very-low-CO2 cells under varied redox, pH and Zn conditions; test
      zinc-ligand mutants (C120A, H180A, C204A) for loss of yeast nce103
      complementation.
    experiment_type: biochemistry and complementation
  - hypothesis: CA activity, rather than a structural role, explains the lcib
      air-dier phenotype.
    description: Complement ad1 or pmp1 with wild-type LCIB versus zinc-site
      mutants, and with a heterologous active beta-CA (for example PtLCIB4)
      targeted to the stroma and to the pyrenoid periphery; score growth at air
      CO2 and Ci accumulation.
    experiment_type: genetic complementation and physiology
