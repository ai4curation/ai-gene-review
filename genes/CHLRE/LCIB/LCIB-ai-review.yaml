id: Q75NZ2
gene_symbol: LCIB
aliases:
  - LciB
  - Low-CO2-inducible protein B
  - Pmp1
  - Ad1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  LCIB (Low-CO2-inducible protein B) is a nuclear-encoded, chloroplast-targeted
  soluble protein of about 48 kDa in the green alga Chlamydomonas reinhardtii,
  strongly induced when CO2 is limiting. It is the gene product affected in the
  classical air-dier mutants pmp1 and ad1, which cannot grow at air levels of
  CO2 but grow at high or very low CO2 and fail to accumulate inorganic carbon
  at air CO2. LCIB belongs to a small algal and bacterial family (with LCIC,
  LCID and LCIE in Chlamydomonas) whose crystal structures reveal a beta-carbonic
  anhydrase fold with a zinc ion bound by two cysteines and a histidine. Some
  family members from diatoms and bacteria are active carbonic anhydrases. Purified
  Chlamydomonas LCIB, and the native LCIB-LCIC complex, showed no activity in
  vitro, but LCIB restores growth of yeast and Arabidopsis carbonic anhydrase
  knockout mutants and raises carbonic anhydrase activity when expressed in the
  tobacco chloroplast stroma, indicating that it can hydrate CO2 to bicarbonate
  and that its activity may be tightly regulated. In vivo LCIB forms a large
  hetero-oligomeric complex (about 350-440 kDa) with its paralog LCIC. The
  complex is dispersed in the chloroplast stroma at high CO2 and moves to form a
  ring around the pyrenoid, outside the starch sheath, when CO2 falls; this
  relocation needs LCIC and an intact starch sheath. Genetic suppressor analysis
  places LCIB downstream of the thylakoid lumen carbonic anhydrase CAH3, and the
  favoured model is that the stromal LCIB-LCIC complex converts CO2 that escapes
  the pyrenoid, or enters the chloroplast, into bicarbonate, keeping inorganic
  carbon trapped in the stroma for the CO2-concentrating mechanism.
references:
  - id: PMID:16777959
    title: An inorganic carbon transport system responsible for acclimation
      specific to air levels of CO2 in Chlamydomonas reinhardtii.
    findings:
      - statement: The air-dier pmp1 and ad1 mutations lie in LciB
        supporting_text: Molecular analyses revealed that the Ad1/Pmp1 protein
          is encoded by LciB, a gene previously identified as a CO(2)-responsive
          gene.
      - statement: lcib mutants die at air CO2 but grow at high and very low
          CO2
        supporting_text: we identified and characterized a pmp1 allelic mutant,
          air dier 1 (ad1) that, like pmp1, cannot grow in low CO(2) (350 ppm)
          but can grow either in high CO(2) (5% CO(2)) or in very low CO(2)
          (<200 ppm).
      - statement: LCIB is one of four related soluble plastid proteins
        supporting_text: LciB and three related genes in C. reinhardtii compose
          a unique gene family that encode four closely related, apparently
          soluble plastid proteins with no clearly identifiable conserved
          motifs.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (esearch "pmp1 AND Chlamydomonas"). Abstract
        only in cache. Identifies LCIB as the Pmp1/Ad1 locus. The paper's
        interpretation of LCIB as part of a Ci transport system has since been
        reinterpreted as a stromal CO2-trapping carbonic anhydrase.
  - id: PMID:20660228
    title: Light and low-CO2-dependent LCIB-LCIC complex localization in the
      chloroplast supports the carbon-concentrating mechanism in Chlamydomonas
      reinhardtii.
    findings:
      - statement: LCIB interacts with LCIC in yeast two-hybrid and in vivo
        supporting_text: we provide evidence to demonstrate that LCIB interacts
          with the LCIB homologous protein LCIC in yeast and in vivo.
      - statement: LCIB and LCIC co-localize around the pyrenoid at low CO2 in
          the light and form a ~350 kDa hexamer
        supporting_text: We also show that LCIB and LCIC are co-localized in the
          vicinity of the pyrenoid under LC conditions in the light, forming a
          hexamer complex of approximately 350 kDa, as estimated by gel
          filtration chromatography.
      - statement: LCIB diffuses away from the pyrenoid when the CCM is
          inactive
        supporting_text: In contrast, in the dark or under high-CO2 conditions
          when the CCM was inactive, LCIB immediately diffused away from the
          pyrenoid.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract only in cache. Primary evidence for the LCIB-LCIC
        complex (Y2H, IP-MS, gel filtration) and its CO2/light-dependent
        localization.
  - id: PMID:27911826
    title: Structural insights into the LCIB protein family reveals a new group
      of β-carbonic anhydrases.
    findings:
      - statement: Chlamydomonas LCIB and LCIC crystal structures have
          beta-CA-like active-site motifs
        supporting_text: We determined the crystal structures of LCIB and
          limiting CO2-inducible C protein (LCIC) from C. reinhardtii and a
          CA-functional homolog from Phaeodactylum tricornutum, all of which
          harbor motifs bearing close resemblance to the active site of
          canonical β-CAs.
      - statement: Three of six LCIB-family homologs tested are active CAs (per
          the full text these were two diatom and one bacterial homolog, not
          the Chlamydomonas proteins)
        supporting_text: Three of the six homologs are functional carbonic
          anhydrases (CAs).
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract only in cache; full text read at PMC5187666. The
        CA-active homologs were PtLCIB3, PtLCIB4 (Phaeodactylum) and FjLCIB
        (Flavobacterium). Recombinant CrLCIB, CrLCIC, the recombinant
        CrLCIB-LCIC complex and the native complex purified from Chlamydomonas
        were inactive under all conditions tested. CrLCIB has the zinc site
        (Cys120, His180, Cys204) but a disordered loop carrying the catalytic
        His/Arg equivalents. The abstract alone could be misread as showing CA
        activity for Chlamydomonas LCIB; it does not.
  - id: PMID:36856938
    title: 'LCIB functions as a carbonic anhydrase: evidence from yeast and
      Arabidopsis carbonic anhydrase knockout mutants.'
    findings:
      - statement: CA activity of LCIB/LCIC had not been demonstrated before
          this study
        supporting_text: Although both LCIB and LCIC are structurally similar to
          βCAs, their CA activity has not been demonstrated to date.
      - statement: LCIB complements yeast NCE103 and Arabidopsis betaCA5
          knockout mutants
        supporting_text: We provide evidence that LCIB is an active CA using a
          Saccharomyces cerevisiae CA knockout mutant (∆NCE103) and an
          Arabidopsis thaliana βCA5 knockout mutant (βca5).
      - statement: Truncated LCIB rescues yeast; full-length LCIB rescues
          Arabidopsis betaca5 at low CO2
        supporting_text: We show that different truncated versions of the LCIB
          protein complement ∆NCE103, while the full length LCIB protein
          complements βca5 plants, so that both the yeast and plant mutants can
          grow in low CO2 conditions.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (esearch "LCIB AND Chlamydomonas"). Abstract
        only in cache. Functional complementation in two heterologous CA
        knockouts is the strongest current evidence for LCIB carbonate
        dehydratase activity; it is genetic (IGI-type) rather than a kinetic
        measurement on purified protein.
  - id: PMID:42328090
    title: Functional integration of LCIB, a component of the algal
      carbon-concentrating mechanism, enhances carbon assimilation,
      nitrogen-use efficiency, and biomass in tobacco.
    findings:
      - statement: LCIB expressed in tobacco chloroplast stroma raises total
          leaf CA activity about threefold
        supporting_text: LCIB was exclusively localized in the stroma and
          remained biologically active, leading to a ~3-fold increase in total
          carbonic anhydrase activity and a lower apparent CO2 compensation
          point (-10%).
      - statement: Two independent lines show higher CA activity in leaf
          extracts
        supporting_text: Leaf extracts from LB-3 and LB-6 lines showed
          significantly higher total carbonic anhydrase activity than wild-type
          and vector controls.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached. Crude leaf-extract CA assay in transgenic
        tobacco; consistent with intrinsic LCIB CA activity but does not
        exclude indirect effects on endogenous CAs.
  - id: PMID:19074623
    title: Thylakoid lumen carbonic anhydrase (CAH3) mutation suppresses
      air-Dier phenotype of LCIB mutant in Chlamydomonas reinhardtii.
    findings:
      - statement: cah3 mutations suppress the lcib air-dier phenotype, placing
          LCIB downstream of CAH3 in trapping released CO2
        supporting_text: We conclude that LCIB functions downstream of CAH3 in
          the CO2-concentrating mechanism and probably plays a role in trapping
          CO2 released by CAH3 dehydration of accumulated Ci.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Key genetic evidence for the CO2-recapture
        model.
  - id: PMID:21409559
    title: Insertional suppressors of Chlamydomonas reinhardtii that restore
      growth of air-dier lcib mutants in low CO2.
    findings:
      - statement: LCIB is proposed to trap CO2 released by CAH3
        supporting_text: is proposed to play a role in trapping CO(2) released
          by CAH3 (thylakoid lumen carbonic anhydrase) catalyzed dehydration of
          accumulated Ci, especially in low CO(2) (L-CO(2); ~0.04% CO(2))
          conditions.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified. Abstract only. Suppressor screen of
        pmp1/ad1; supports the genetic framework.
  - id: PMID:24307449
    title: LCIB in the Chlamydomonas CO2-concentrating mechanism.
    findings:
      - statement: Review (pre-structure) describing LCIB as a key CCM
          component of undefined biochemical function
        supporting_text: LCIB, which has been demonstrated as a key player in
          the eukaryotic algal CO2-concentrating mechanism (CCM), is a novel
          protein in Chlamydomonas lacking any recognizable domain or motif, and
          its exact function in the CCM has not been clearly defined.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Abstract only. Review from the Spalding lab; the statement
        that LCIB lacks recognizable motifs is superseded by the 2016 structure
        (PMID:27911826).
  - id: PMID:25336519
    title: 'Acclimation to very low CO2: contribution of limiting CO2 inducible
      proteins, LCIB and LCIA, to inorganic carbon uptake in Chlamydomonas
      reinhardtii.'
    findings:
      - statement: LCIB acts in CO2 uptake, distinct from LCIA bicarbonate
          transport; both needed at very low CO2
        supporting_text: Although both LCIA and LCIB are essential for very low
          CO2 acclimation, LCIB appears to function in a CO2 uptake system,
          whereas LCIA appears to be associated with a HCO3(-) transport system.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract only. lcia lcib double mutant physiology.
  - id: PMID:19321421
    title: Knockdown of limiting-CO2-induced gene HLA3 decreases HCO3- transport
      and photosynthetic Ci affinity in Chlamydomonas reinhardtii.
    findings:
      - statement: LCIB has a role in chloroplast Ci accumulation, partly
          overlapping with HLA3 and LCIA systems
        supporting_text: Collectively, the data presented here provide
          compelling evidence that HLA3 is directly or indirectly involved in
          HCO 3 − transport, along with additional evidence supporting a role
          for LCIA in chloroplast envelope HCO 3 − transport and a role for LCIB
          in chloroplast Ci accumulation.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached. Uses pmp1/ad1 backgrounds; LCIB is a
        secondary subject.
  - id: PMID:34791500
    title: CO2-dependent migration and relocation of LCIB, a pyrenoid-peripheral
      protein in Chlamydomonas reinhardtii.
    findings:
      - statement: LCIB is in the chloroplast stroma at high and low CO2
        supporting_text: LC-inducible protein B (LCIB), structurally
          characterized as carbonic anhydrase, localizes in the chloroplast
          stroma under CO2-supplied and LC conditions.
      - statement: At very low CO2 LCIB aggregates around the pyrenoid
        supporting_text: In VLC conditions, it migrates to aggregate around the
          pyrenoid, where the CO2-fixing enzyme ribulose 1,5-bisphosphate
          carboxylase/oxygenase is enriched.
      - statement: Relocation requires LCIC and is switched at ~7 uM CO2
        supporting_text: These results suggest that the localization changes of
          LCIB require LCIC and are controlled by CO2 concentration with ∼7 µM
          as the boundary.
      - statement: LCIC is lost when LCIB is disrupted
        supporting_text: In B3 cells, LCIC (49 kDa), the interacting protein of
          LCIB (48 kDa), was also hardly detected as with the previously
          reported LCIB RNAi strains
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Live-cell LCIB-Clover imaging; IDA for
        chloroplast stroma.
  - id: PMID:32041908
    title: Pyrenoid Starch Sheath Is Required for LCIB Localization and the
      CO(2)-Concentrating Mechanism in Green Algae.
    findings:
      - statement: Starch sheath is required for LCIB peripheral localization
        supporting_text: These results suggest that the starch sheath around the
          pyrenoid is required for the correct localization of LCIB and for the
          operation of CCM.
      - statement: LCIB and LCIC are soluble stromal proteins without
          starch-binding domains
        supporting_text: Because LCIB and LCIC do not have a starch-binding
          domain and exist as soluble proteins in the chloroplast stroma
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached.
  - id: PMID:24384670
    title: Isolation and characterization of mutants defective in the
      localization of LCIB, an essential factor for the carbon-concentrating
      mechanism in Chlamydomonas reinhardtii.
    findings:
      - statement: Mutants with mislocalized LCIB have reduced Ci affinity and
          CO2 fixation
        supporting_text: abl-1 and abl-3 with dispersed and speckled
          localization of LCIB in the chloroplast showed significant decreases
          in Ci affinity, Ci accumulation, and CO2 fixation.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Abstract only. The abl mutations are not in LCIB itself.
  - id: PMID:35596080
    title: Modelling the pyrenoid-based CO(2)-concentrating mechanism provides
      insights into its operating principles and a roadmap for its engineering
      into crops.
    findings:
      - statement: Model of LCIB/LCIC as stromal CA recapturing CO2 at the
          pyrenoid periphery
        supporting_text: Consequently, LCIB relocalized near the starch sheath
          increases energy efficiency by recapturing CO2 molecules that diffuse
          out of the matrix and trapping them as HCO3− in the chloroplast
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached. Modelling paper; assumes LCIB CA
        activity rather than measuring it.
  - id: PMID:28938113
    title: A Spatial Interactome Reveals the Protein Organization of the Algal
      CO(2)-Concentrating Mechanism.
    findings:
      - statement: LCIB and LCIC appear together with EPYC1 in the CCM spatial
          interactome
        supporting_text: EPYC1, LCIB and LCIC (Figure 5F).
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Full text cached. LCIB is a minor subject.
  - id: PMID:15235119
    title: Expression profiling-based identification of CO2-responsive genes
      regulated by CCM1 controlling a carbon-concentrating mechanism in
      Chlamydomonas reinhardtii.
    findings: []
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Source of the UniProt cDNA (AB168093); identifies LciB as a
        CCM1-dependent low-CO2-inducible gene.
