        - reference_id: PMID:11309511
          supporting_text: CIA5 appears to be a master regulator of the carbon
            concentrating mechanism and is intimately involved in the signal
            transduction mechanism that senses and allows immediate responses to
            fluctuations in environmental CO2 and HCO3- concentrations.
        - reference_id: PMID:15235119
          supporting_text: The fact that the induction of almost all low-CO2
