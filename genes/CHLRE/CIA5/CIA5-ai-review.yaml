  - term:
      id: GO:0045893
      label: positive regulation of DNA-templated transcription
    evidence_type: IMP
    original_reference_id: PMID:11309511
    review:
      summary: CIA5 is a nuclear zinc-finger protein required for the
        transcriptional induction of CO2-responsive genes; truncation of its
        C-terminus causes constitutive synthesis of these mRNAs, showing that
        CIA5 activity itself sets their transcription. Whether it does so by
        binding DNA directly or as part of a larger nuclear complex is not
        settled, so the process term is asserted without a DNA-binding
        transcription factor activity.
      action: NEW
      reason: The regulatory effect is at the level of transcription (cia5 and
        ccm1 mutants fail to transcriptionally induce the CCM genes) and CIA5
        is a constitutively nuclear protein whose own activity state
        (C-terminal truncation) changes target transcription, which places CIA5
        among the regulators of transcription rather than as a distant
        upstream factor. A molecular function (DNA-binding transcription factor
        activity or transcription coregulator activity) is deliberately not
        asserted because DNA binding has been shown only in a single in vitro
        study not available here, and in vivo promoter occupancy has not been
        shown.
      additional_reference_ids:
