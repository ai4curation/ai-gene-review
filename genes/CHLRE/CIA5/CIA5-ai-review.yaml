taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  CIA5, also named CCM1 (locus Cre02.g096300), is a 699-residue nuclear
  zinc-binding regulatory protein of Chlamydomonas reinhardtii that acts as
  the master regulator of acclimation to limiting inorganic carbon. Its
  N-terminal region carries two zinc-binding sites, a C2H2-type zinc finger
  (around residues 35-70) and a second Cys/His site (around residues 72-101),
  each of which binds one zinc ion; the rest of the protein is largely
  disordered, with glutamine-, alanine- and glycine-rich low-complexity tracts
  reminiscent of transcriptional activation domains. CIA5 mRNA and protein are
  present at constant levels in high and low CO2, and the protein resides in
  the nucleus under both conditions, so its activity is thought to be switched
  post-translationally when CO2 becomes limiting. Loss of CIA5 (the cia5 point
  mutant, His54Tyr in the first zinc site, or the ccm1 insertion mutant C16)
  abolishes active inorganic-carbon uptake, pyrenoid development and induction
  of essentially all low-CO2-inducible genes, including the bicarbonate
  transporters HLA3 and LCIA, the bestrophins, LCIB/LCIC, carbonic anhydrases
  CAH1 and CAH3, the Myb transcription factor LCR1 and the photoprotective
  LHCSR3, and RNA-seq shows that CIA5 affects the expression of about a
  quarter of all genes; the cells grow only with elevated CO2. Removing the
  54 C-terminal residues yields constitutive expression of CO2-responsive
  genes, indicating that the C-terminus restrains its activity under high CO2.
  CIA5 forms a 290-580 kDa complex and binds constitutively to the nuclear
  CobW/WW-domain metallochaperone-like GTPase CBP1 (ZNG3), which represses a
  subset of CIA5-dependent genes under high CO2; under zinc deficiency CIA5 and
  CBP1/ZNG3 are degraded by the proteasome, preventing induction of the
  zinc-demanding carbon-concentrating mechanism. Whether CIA5 binds DNA itself
  in vivo is unresolved: it was long thought not to, but recent in vitro work
  reports specific binding of purified CIA5 to a GC-rich promoter motif. CIA5
  appears restricted to some chlorophyte lineages, with an ortholog in Volvox
  carteri.
