  - id: PMID:22634760
    title: Transcriptome-wide changes in Chlamydomonas reinhardtii gene expression
      regulated by carbon dioxide and the CO2-concentrating mechanism regulator
      CIA5/CCM1.
    findings:
      - statement: CIA5 and CO2 affect expression of almost 25% of all genes
        supporting_text: We observed a massive impact of CIA5 and CO 2 on the
          transcriptome, affecting almost 25% of all Chlamydomonas genes
      - statement: Expression of most Ci transporters and inducible CAs requires
          CIA5, although CIA5 expression is CO2-independent
        supporting_text: Expression of most putative C i transporters and
          induced CAs requires CIA5, even though the expression of CIA5 itself
          does not depend on the CO 2 level, so posttranslational activation of
          CIA5 in low CO 2 apparently is required for CIA5 to regulate these
          genes
      - statement: At the time, the DNA sequences recognized by CIA5 and its
          direct targets were unknown
        supporting_text: CIA5 has been proposed to be a transcription regulator
