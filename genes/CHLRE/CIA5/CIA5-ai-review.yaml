  - term:
      id: GO:0071244
      label: cellular response to carbon dioxide
    evidence_type: IMP
    original_reference_id: PMID:11287669
    review:
      summary: ccm1 and cia5 mutants fail to respond to CO2 limitation; they do
        not induce low-CO2-inducible genes, active Ci uptake or pyrenoid
        development, and complementation restores the response. CIA5 is the
        nuclear regulator through which the change in CO2 level is converted
        into the transcriptional acclimation program, so it carries out part of
        the response rather than being a downstream target of it.
      action: NEW
      reason: Mutant and complementation evidence from two independent groups
        plus genome-wide expression data. Participation test - CIA5 is the
        signal-to-transcription regulator of the response (its activity is
        switched by CO2 status, and a C-terminal truncation uncouples gene
        induction from CO2). Comparator check - transcription regulators that
        mediate CO2 responses in other organisms (e.g. Candida RCA1, UME6 and
        yeast CST6) carry GO:0071244 by IMP, so the term is used for this role.
        The stimulus is limiting CO2 (a decrease in CO2), which is within the
        scope of a response to a carbon dioxide stimulus; GO has no more
        specific "response to low CO2" term.
      additional_reference_ids:
