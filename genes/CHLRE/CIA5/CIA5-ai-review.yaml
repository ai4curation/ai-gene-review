  - id: PMID:42448334
    title: CIA5 and its interacting metal-binding GTPase ZNG3 are degraded by the
      proteasome in Zn deficiency.
    findings:
      - statement: CIA5 protein is degraded by the proteasome under Zn
          deficiency, preventing CCM induction
        supporting_text: We demonstrate that CIA5 is constitutively expressed
          regardless of Zn supply, but its encoded protein undergoes proteasomal
          degradation under Zn deficiency, providing a checkpoint that prevents
          CCM induction when Zn cofactors are unavailable.
      - statement: ZNG3 is a constitutive CIA5-interacting protein
        supporting_text: We identified a COBW domain-containing GTPase, ZNG3, as
          a constitutive interacting partner of CIA5.
      - statement: CIA5 has a C2H2 zinc finger and a second zinc site in its
          first 110 residues
        supporting_text: One such example is CIA5, which contains two Zn‐binding
          sites within the first 110 amino acids, one in a C2H2 zinc finger
          between amino acids 35 and 70, and the second between amino acids 70
          and 100
      - statement: CIA5 is nuclear and required for transcriptional induction of
          CCM genes
        supporting_text: CIA5 localizes to the nucleus, and cia5 mutants fail to
          transcriptionally induce Ci transporter genes, CAHs, and many genes
          encoding structural components of the CCM
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Endogenous HA-tagged CIA5 knock-in lines;
