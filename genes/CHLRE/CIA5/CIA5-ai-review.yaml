suggested_questions:
  - question: Does CIA5 occupy the promoters of CCM genes in vivo (ChIP-seq or
      CUT&RUN), and is the GGGGCGGGG motif bound in vitro by purified CIA5
      enriched at those sites? A positive answer would justify a DNA-binding
      transcription factor activity annotation.
    experts:
      - Spalding MH
      - Fukuzawa H
  - question: What post-translational change activates CIA5 in low CO2, and does
      the CBP1/ZNG3 GTPase alter the zinc occupancy of CIA5's zinc sites?
    experts:
      - Fukuzawa H
      - Merchant SS
  - question: Should GO add a "cellular response to low carbon dioxide" or
      "acclimation to CO2 limitation" term so that CO2-limitation regulators
      such as CIA5 and LCR1 can be annotated more specifically?
suggested_experiments:
  - hypothesis: CIA5 is a sequence-specific DNA-binding transcriptional
      activator of CCM genes.
    description: Perform ChIP-seq on endogenous CIA5-HA knock-in lines under
      high and very low CO2, test motif enrichment, and use promoter reporters
      with the GC-rich motif mutated in a cia5 complemented background.
  - hypothesis: Zinc delivery or removal by CBP1/ZNG3 toggles CIA5 activity.
    description: Measure zinc stoichiometry of CIA5 purified from wild type and
      cbp1/zng3 mutants under high and low CO2, and test whether zinc-site
      mutants that retain zinc constitutively bypass CBP1-mediated repression.
