core_functions:
  - description: Nuclear zinc-finger master regulator that, when inorganic
      carbon becomes limiting, switches on transcription of the
      carbon-concentrating mechanism genes (Ci transporters, carbonic
      anhydrases, pyrenoid and photoprotection components). The protein is
      constitutively present and nuclear and is thought to be activated
      post-translationally; its two zinc sites are essential, it partners
      constitutively with the CobW/WW-domain protein CBP1/ZNG3, and it is
      degraded by the proteasome under zinc deficiency. No molecular function
      term is asserted because direct DNA binding in vivo is not established.
    directly_involved_in:
      - id: GO:0071244
        label: cellular response to carbon dioxide
      - id: GO:0045893
        label: positive regulation of DNA-templated transcription
    locations:
