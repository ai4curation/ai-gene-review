  - id: PMID:11287669
    title: Ccm1, a regulatory gene controlling the induction of a carbon-concentrating
      mechanism in Chlamydomonas reinhardtii by sensing CO2 availability.
    findings:
      - statement: CCM1 is a nuclear-encoded 699-aa protein with an N-terminal
          putative zinc-finger motif and a glutamine repeat typical of
          transcriptional activators
        supporting_text: we isolated a nuclear regulatory gene, Ccm1, encoding a
          699-aa hydrophilic protein with a putative zinc-finger motif in its
          N-terminal region and a Gln repeat characteristic of transcriptional
          activators
      - statement: Ccm1 complements the C16 mutant, restoring carbon transport,
          pyrenoid development and induction of CCM genes
        supporting_text: Introduction of Ccm1 into this mutant restored an active
          carbon transport through the CCM, development of a pyrenoid structure
          in the chloroplast, and induction of a set of CCM-related genes.
      - statement: Ccm1 is essential for CO2-responsive induction of the CCM
        supporting_text: These data indicate that Ccm1 is essential to control
          the induction of CCM by sensing CO2 availability in Chlamydomonas
          cells.
      - statement: The cia5 mutation (His54) lies in the zinc-finger motif
        supporting_text: revealed that His-54 within the putative zinc-finger
          motif of the CCM1 is crucial to its regulatory function
    reference_review:
