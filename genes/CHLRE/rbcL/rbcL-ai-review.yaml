  review:
    summary: The large subunit carries the Rubisco active site, which sits at the
      interface of a head-to-tail large-subunit dimer and contains the
      carbamylated Lys-201 and Mg2+. Chlamydomonas Rubisco has been purified
      and assayed directly for carboxylase kinetics many times, including
      large-subunit mutants made by chloroplast transformation of an rbcL
      deletion strain.
    action: ACCEPT
    reason: This is the defining catalytic activity of rbcL. The structural and
      kinetic evidence for Chlamydomonas Rubisco is extensive (PMID:11866526,
      PMID:18664299). The small subunit modulates catalysis but does not carry
      the active site (PMID:20424165), so the activity is correctly assigned to
      the large subunit with an "enables" relationship. The oxygenase reaction
      at the same site has no separate GO term (GO:0016984 lists
      "ribulose bisphosphate carboxylase/oxygenase activity" as an exact
      synonym).
    supported_by:
    - reference_id: PMID:20424165
      supporting_text: Although the large subunit contains the active site, a
        family of rbcS nuclear genes encodes the Rubisco small subunits, which
        can also influence the carboxylation catalytic efficiency and CO(2)/O(2)
        specificity of the enzyme.
    - reference_id: PMID:18664299
      supporting_text: The kinetic constants of purified and activated enzymes
        were determined by measuring the incorporation of acid-stable 14C from
        NaH14CO3
    - reference_id: PMID:18664299
      supporting_text: Mutant MX3312, which has the rbcL coding region replaced
        with the aadA gene conferring spectinomycin resistance, was used as the
        host for chloroplast transformation
