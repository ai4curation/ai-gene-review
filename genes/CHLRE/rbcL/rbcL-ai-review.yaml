id: P00877
gene_symbol: rbcL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3055
  label: CHLRE
description: rbcL is the chloroplast-genome-encoded large subunit (about 55 kDa,
  475 residues) of form I ribulose-1,5-bisphosphate carboxylase/oxygenase
  (Rubisco, EC 4.1.1.39) in Chlamydomonas reinhardtii. Eight large subunits,
  arranged as four head-to-tail homodimers, form the catalytic core of the L8S8
  holoenzyme and are capped at each end by four nuclear-encoded small subunits.
  Each large-subunit dimer contributes the active sites, which bind Mg2+ and are
  activated by carbamylation of Lys-201. The enzyme catalyses the carboxylation
  of D-ribulose 1,5-bisphosphate to two molecules of 3-phosphoglycerate, the
  CO2-fixing step of the Calvin-Benson-Bassham (reductive pentose-phosphate)
  cycle, and, in competition at the same active site, the oxygenation of
  ribulose 1,5-bisphosphate that starts photorespiration. Crystal structures of
  the activated Chlamydomonas enzyme with the transition-state analogue 2-CABP
  show the conserved form I architecture and post-translational modifications
  including 4-hydroxyproline and S-methylcysteine. In the chloroplast the
  holoenzyme is distributed between the stroma and the pyrenoid, a
  liquid-like, non-membranous Rubisco condensate in which most of the enzyme
  is concentrated when cells grow at limiting CO2; recruitment to the pyrenoid
  is determined by the small subunit, which carries the binding sites for the
  linker protein EPYC1, not by the large subunit. Because rbcL is encoded in
  the chloroplast and is accessible by chloroplast transformation, Chlamydomonas
  rbcL has been a central system for directed mutagenesis of Rubisco catalysis
  and CO2/O2 specificity.
