core_functions:
- description: Catalytic large subunit of the chloroplast L8S8 Rubisco
    holoenzyme. Its Mg2+-dependent, Lys-201-carbamylated active site, formed at
    the large-subunit dimer interface, carboxylates ribulose 1,5-bisphosphate to
    two 3-phosphoglycerate (and competitively oxygenates it). This is the
    CO2-fixing step of the Calvin-Benson-Bassham cycle. The holoenzyme acts in
    the chloroplast stroma and, mostly under CO2 limitation, inside the
    pyrenoid matrix, where small-subunit/EPYC1 interactions concentrate it.
  molecular_function:
    id: GO:0016984
    label: ribulose-bisphosphate carboxylase activity
  directly_involved_in:
  - id: GO:0019253
    label: reductive pentose-phosphate cycle
