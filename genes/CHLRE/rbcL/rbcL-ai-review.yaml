  - reference_id: PMID:11866526
    supporting_text: Many photosynthetic organisms have form I rubiscos
      comprised of eight large (L) and eight small (S) subunits.
  - reference_id: PMID:9536077
    supporting_text: about 40% was in the pyrenoid when the cells were grown
      under elevated CO2 and about 90% with ambient CO2.
  - reference_id: PMID:30498228
    supporting_text: The phase-separated Rubisco is functional.
suggested_questions:
- question: Rubisco oxygenation of ribulose 1,5-bisphosphate is the first step of
    photorespiration and is catalysed by the same large-subunit active site. GO
    has no separate oxygenase activity term (the oxygenase is an exact synonym of
    GO:0016984). Should the large subunit carry GO:0009853 photorespiration,
    and how do Arabidopsis and other plant RBCL annotations handle this?
- question: Does the large subunit make any contribution to Rubisco-EPYC1
    binding? Cryo-EM suggests a possible contact between EPYC1 R56 and
    large-subunit E433. Or is pyrenoid packing set entirely by the small-subunit
    alpha-helices?
- question: Is the stromal (non-pyrenoid) pool of Rubisco, which is larger at
    high CO2, catalytically different from the pyrenoid pool, or does only the
    CO2 supply differ?
suggested_experiments:
- description: Express plant-like or carboxysome-linker-binding large-subunit
    variants by chloroplast transformation of the rbcL deletion strain MX3312,
    and measure pyrenoid formation and EPYC1 co-condensation. This would test
    directly whether the large-subunit surface affects pyrenoid partitioning.
  experiment_type: chloroplast transformation and imaging
- description: Compare in situ Rubisco activation state and kinetics in
    isolated pyrenoids and in stroma fractions from low- and high-CO2-grown
    cells.
  experiment_type: subcellular fractionation and enzyme kinetics
