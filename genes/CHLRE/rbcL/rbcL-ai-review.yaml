    label: chloroplast stroma
  evidence_type: IDA
  original_reference_id: PMID:9536077
  review:
    summary: Quantitative immunolocalization shows that the part of Rubisco not
      in the pyrenoid is in the chloroplast stroma. This is about 60% of the
      enzyme in cells grown at elevated CO2 and about 10% at ambient CO2.
    action: NEW
    reason: The stromal pool is a substantial and probably active share of
