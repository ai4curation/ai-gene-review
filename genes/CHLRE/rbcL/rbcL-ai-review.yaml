- term:
    id: GO:1990732
    label: pyrenoid
  evidence_type: IDA
  original_reference_id: PMID:9536077
  review:
    summary: Immunolocalization showed that most Chlamydomonas Rubisco is in the
      pyrenoid, about 90% in cells grown at ambient CO2 and about 40% at
      elevated CO2, with the rest in the stroma. Pyrenoidal Rubisco is
      catalytically active. Cryo-ET and live imaging show the pyrenoid matrix to
      be a liquid-like condensate of Rubisco holoenzymes and the linker EPYC1.
    action: NEW
    reason: Rubisco is the main constituent of the pyrenoid matrix, and it is
      the holoenzyme, which contains the large subunit, that is condensed
      there. Immunogold localization with anti-Rubisco antibodies places it in
      the pyrenoid (PMID:9536077), and condensed Rubisco remains functional in
      vitro (PMID:30498228). The large subunit does not cause the pyrenoid
      localization. Targeting to the pyrenoid is set by two surface
      alpha-helices of the small subunit (PMID:23112177, PMID:20424165), and
      EPYC1 binds the small subunit (PMID:33230314). This annotation therefore
      records where the large subunit carries out carboxylation, not a
      targeting or condensate-scaffolding role for rbcL. Some of the enzyme
      stays in the stroma, especially at high CO2.
    supported_by:
    - reference_id: PMID:9536077
      supporting_text: It was observed that the amount of Rubisco in the pyrenoid
        varied with growth condition; about 40% was in the pyrenoid when the
        cells were grown under elevated CO2 and about 90% with ambient CO2.
    - reference_id: PMID:9536077
      supporting_text: In addition, it is likely that pyrenoidal Rubisco is
        active in CO2 fixation because in vitro activity measurements showed
        that most of the Rubisco must be active to account for CO2-fixation
        rates observed in whole cells.
    - reference_id: PMID:30498228
      supporting_text: The phase-separated Rubisco is functional.
    - reference_id: PMID:20424165
      supporting_text: It appears that small subunits contain the structural
        elements responsible for targeting Rubisco to the algal pyrenoid
