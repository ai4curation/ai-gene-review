              chloroplast-stromal pyrenoid protein with no membrane anchor.
      summary: Propagated from the PANTHER PTHR15048 (STARCH-BINDING
        DOMAIN-CONTAINING PROTEIN 1) node seeded by mammalian STBD1, an
        ER-anchored glycogen-binding protein that delivers glycogen to lysosomes
        (glycophagy). SAGA2 is a chloroplast pyrenoid protein with no role in
        vacuolar transport.
      action: REMOVE
      reason: The family node is defined by animal STBD1, whose vacuolar
        (lysosomal) transport role depends on an N-terminal membrane anchor and
        on glycogen delivery to lysosomes. SAGA2 has diverged in a way that
        removes it from this function. It has no predicted transmembrane
        segment, its transit peptide targets it to the chloroplast stroma
        (PMID:38241434), and it acts at the matrix-starch sheath interface of
        the pyrenoid inside the chloroplast (PMID:33177094, PMID:42090253). No
        Chlamydomonas data link SAGA2 to any vacuolar process. The shared
        feature with STBD1 is only the CBM20 module.
      supported_by:
