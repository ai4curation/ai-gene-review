        supporting_text: The protein we named SAGA2 (Cre09.g394621)
      - statement: SAGA2-Venus localizes to the matrix-starch sheath interface,
          covering the matrix surface more uniformly than SAGA1
        supporting_text: We observed that SAGA2 also localized to that interface
          but appeared to cover the surface of the matrix more homogeneously than
          SAGA1.
      - statement: Rubisco binds the internal Rubisco-binding motifs on peptide
          arrays tiling SAGA2
        supporting_text: Rubisco bound to all predicted internal motif sites when
