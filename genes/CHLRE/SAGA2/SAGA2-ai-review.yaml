      - statement: Model in which the motif on SAGA1 and SAGA2 ties the matrix to
          the starch sheath
        supporting_text: At the periphery of the matrix, the motif on
          starch-binding proteins SAGA1 and SAGA2 mediates interactions between
          the matrix and surrounding starch sheath.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Names SAGA2, shows its localization at the
        matrix-starch interface with SAGA2-Venus, and shows Rubisco binding to
        SAGA2 motif peptides. Starch binding was assumed from the CBM20 here and
        was not tested.
  - id: PMID:42090253
    title: SAGA1 and SAGA2 localize the starch sheath to the pyrenoid in
      Chlamydomonas reinhardtii.
    findings:
      - statement: The purified SAGA2 tandem CBM20 construct (both native CBM20
          domains) binds starch granules; the mVenus control does not
        supporting_text: We observed that both the 10×His-mVenus-2×SAGA1-CBM20
          and the 10×His-mVenus-SAGA2-2×CBM20 proteins, but not a 10×His-mVenus
          control protein, bound to starch
      - statement: The construct contains both native SAGA2 CBM20 domains
        supporting_text: SAGA2 natively has two consecutive CBM20 domains, both of
          which were included in the SAGA2 construct for this experiment
      - statement: beta-cyclodextrin and maltoheptaose compete with starch binding
        supporting_text: Binding of 10×His-mVenus-2×SAGA1-CBM20 and the
          10×His-mVenus-SAGA2-2×CBM20 to starch was decreased in the presence of
          either β-cyclodextrin or maltoheptaose, suggesting that each protein
          bound to all three molecules.
      - statement: SAGA2 is depleted from starch-tubule-matrix junctions, where
          SAGA1 is enriched
        supporting_text: Our results indicate that whereas SAGA1 is enriched at
          the starch–tubule–matrix junctions of the pyrenoid, SAGA2 is depleted
          from these regions
      - statement: saga2 has reduced matrix starch coverage early in pyrenoid
          formation, rescued by SAGA2-Venus
        supporting_text: Taken together, these results indicate that SAGA2 is
          necessary for normal matrix–starch sheath coverage early during
          pyrenoid formation.
      - statement: The saga2 sheath defect recovers at later stages
        supporting_text: other factors can compensate for a lack of SAGA2 to
          assemble an apparently normal starch sheath during later stages of
          pyrenoid formation
      - statement: saga2 grows normally at limiting CO2
        supporting_text: SAGA2 is not necessary for growth under limiting CO2
          conditions
      - statement: SAGA2 is not needed for a single pyrenoid or for tubules
        supporting_text: These observations indicate that SAGA2 is not necessary
          for pyrenoid tubule formation.
      - statement: The saga1;saga2 double mutant lacks starch sheaths
        supporting_text: Remarkably, at both time points, the saga1;saga2 mutant
          completely lacked starch sheaths and had almost no starch associated
          with its visible pyrenoid condensates
      - statement: SAGA1 and SAGA2 act redundantly to localize the starch sheath
        supporting_text: suggesting that SAGA1 and SAGA2 function redundantly to
          localize starch sheaths to the pyrenoid
      - statement: In the double mutant starch lies throughout the stroma
        supporting_text: We conclude that in the saga1;saga2 double mutant, starch
          is distributed throughout the stroma rather than to the pyrenoid matrix
          condensates.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached (PNAS 2026). Primary characterization of
        SAGA2 - first saga2 mutant, complementation with SAGA2-Venus, saga1;saga2
