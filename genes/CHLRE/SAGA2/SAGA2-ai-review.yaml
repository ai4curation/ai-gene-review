core_functions:
  - description: Links the Rubisco matrix to the starch sheath at the pyrenoid
      periphery. The two CBM20 domains bind starch and starch precursors, and
      the Rubisco-binding motifs bind the matrix. SAGA2 covers the matrix
      surface between tubule entry sites and, working redundantly with SAGA1,
      places the starch sheath around the pyrenoid, especially early in
      pyrenoid formation.
