description: >-
  SAGA2 (StArch Granules Abnormal 2; locus Cre09.g394621) is a large (~190 kDa)
  nuclear-encoded, chloroplast-targeted pyrenoid protein of Chlamydomonas
  reinhardtii and a homologue of SAGA1 (about 30% identical). UniProt holds two
  TrEMBL entries for this locus, A0A2K3DEH1 (1,816 aa) and A0A2K3DEF8 (1,748 aa),
  which are alternative gene-model products of the same gene. SAGA2 has two
  consecutive N-terminal CBM20 starch-binding domains, a long coiled-coil
  middle region and extended disordered segments that carry several copies of
  the pyrenoid Rubisco-binding motif. Rubisco binds SAGA2 motif peptides in
  vitro, and SAGA2 binds the Rubisco large and small subunits and the linker
  EPYC1 in yeast two-hybrid assays. A purified construct of its two CBM20
  domains binds starch granules and the starch precursor maltoheptaose and the
  mimic beta-cyclodextrin in vitro. In the cell SAGA2 forms a fairly uniform
  shell at the interface between the Rubisco matrix and the starch sheath, and
  it is depleted from the gaps where thylakoid tubules enter the matrix, which
  are occupied by SAGA1. The saga2 single mutant grows normally at limiting CO2,
  has a single pyrenoid with normal tubules, and shows reduced starch coverage
  of the matrix early in pyrenoid formation that recovers later. SAGA2 acts
  redundantly with SAGA1 to place the starch sheath on the pyrenoid. The saga1
  saga2 double mutant lacks a starch sheath and its starch is spread through the
  stroma, and either protein restores the sheath. Expressed in Arabidopsis with
  an EPYC1-Rubisco condensate, SAGA2 increases condensate-associated starch.
  SAGA2 is proposed to tether starch granules to the matrix and perhaps to
  prime granule initiation at the matrix surface. It does not take part in
  forming the pyrenoid tubules.
