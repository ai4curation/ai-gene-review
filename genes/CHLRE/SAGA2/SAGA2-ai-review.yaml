suggested_questions:
  - question: Should GO add a process term for starch sheath assembly or
      localization at the pyrenoid (for example "pyrenoid starch sheath
      assembly"), so that SAGA1 and SAGA2 can be annotated to the process they
      carry out? The closest existing term, GO:0033037 polysaccharide
      localization, is used almost only for glycosaminoglycans.
    experts:
      - Jonikas MC
  - question: Do SAGA1 and SAGA2 prime starch granule initiation at the matrix
      surface (GO:0062052 starch granule initiation), as their maltoheptaose
      binding and the stromal starch in the double mutant suggest, or do they
      only capture and tether granules made elsewhere?
  - question: Which gene model is correct for Cre09.g394621? UniProt has
      A0A2K3DEH1 (1,816 aa) and A0A2K3DEF8 (1,748 aa) for the same locus, and
      published papers describe a ~190 kDa protein with four Rubisco-binding
      motifs.
  - question: What is the in vivo role of the SAGA2-EPYC1 interaction seen in
      yeast two-hybrid, given that EPYC1 binds SAGA2 through the same helices
      that bind Rubisco?
suggested_experiments:
  - hypothesis: Starch binding by the SAGA2 CBM20 domains is required for its
      role in early starch sheath coverage.
    description: Complement saga1;saga2 with SAGA2 carrying point mutations in
      the conserved aromatic starch-binding residues of one or both CBM20
      domains. Score SAGA2 localization, starch sheath coverage at 3 h and 21 h
      after transfer to low CO2, and starch distribution.
    experiment_type: genetic complementation and electron microscopy
  - hypothesis: The Rubisco-binding motifs anchor SAGA2 to the matrix.
    description: Express SAGA2 with all Rubisco-binding motifs mutated in
      saga1;saga2 and test whether it still localizes to the pyrenoid and
      restores a sheath, or instead coats stromal starch granules.
    experiment_type: mutagenesis and live-cell imaging
