id: Q39588
gene_symbol: CAH3
aliases:
  - Cah3
  - Cre09.g415700
  - lumenal carbonic anhydrase
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  CAH3 (locus Cre09.g415700) is a nuclear-encoded alpha-type carbonic anhydrase
  of the green alga Chlamydomonas reinhardtii and the only carbonic anhydrase
  known in its thylakoid lumen. The 310-residue precursor carries a bipartite
  transit peptide (stromal targeting followed by a twin-arginine lumen-targeting
  domain); the mature ~29.5 kDa enzyme is a peripheral, lumenal protein of the
  thylakoid membranes, protected from protease in intact thylakoids. Crystal
  structures show a canonical alpha-CA fold with a catalytic zinc held by three
  histidines, a disulfide bond, and an unusual dimer formed by swapped
  N-terminal arms. The enzyme interconverts bicarbonate and CO2 and is most
  active at the mildly acidic pH of the illuminated lumen, so in vivo it is
  thought to work mainly in the dehydration direction. Its main physiological
  role is in the CO2-concentrating mechanism: bicarbonate pumped into the
  chloroplast and across the thylakoid membrane is converted to CO2 in the
  lumen of the thylakoid tubules that traverse the pyrenoid, and the CO2
  diffuses into the surrounding Rubisco matrix. Mutants lacking active CAH3
  (cia3, ca-1) over-accumulate inorganic carbon yet cannot supply Rubisco with
  enough CO2 and fail to grow at air levels of CO2; cah3 mutations also
  suppress the air-dier phenotype of lcib mutants. Immunolocalization places
  much of CAH3 in the pyrenoid-traversing thylakoids, an enrichment reported to
  increase when cells are moved to limiting CO2, when CAH3 is also
  phosphorylated and its activity rises five- to six-fold; a recent
  expansion-microscopy study instead finds CAH3 concentrated in the central
  reticulated tubules at both high and low CO2. A second proposed role is at
  the donor side of photosystem II, where CAH3 co-purifies with PSII-enriched
  membranes and is suggested to consume protons released by water oxidation by
  dehydrating bicarbonate; PSII preparations from cia3 have impaired oxygen
  evolution, but in intact cells at low inorganic carbon photosynthesis in cia3
  is limited by CO2 supply to Rubisco rather than by PSII.
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: PMID:9482718
    title: A novel alpha-type carbonic anhydrase associated with the thylakoid
      membrane in Chlamydomonas reinhardtii is required for growth at ambient
      CO2.
    findings:
      - statement: Cloning of CAH3, an intracellular alpha-type carbonic
          anhydrase associated exclusively with the thylakoid membrane
        supporting_text: Immunoblot studies with specific antibodies raised
          against Cah3 demonstrate that the polypeptide is associated
          exclusively with the thylakoid membrane.
      - statement: CAH3 is in the thylakoid lumen (protease protection of
          intact thylakoids)
        supporting_text: The putative transit peptide suggests that Cah3 is
          directed to the thylakoid lumen, which is confirmed further by the
          presence of mature sized Cah3 after thermolysin treatment of intact
          thylakoids.
      - statement: Complementation of cia-3 with the cah3 gene restores growth
          at air CO2 and an active alpha-type CA
        supporting_text: Complementation of the high inorganic carbon
          concentration-requiring mutant, cia-3, with a subcloned cosmid
          containing the cah3 gene yielded transformants that grew on
          atmospheric levels of CO2 (0.035%) and contained an active 29.5 kDa
          alpha-type carbonic anhydrase.
      - statement: The cia-3 mutant carries two substitutions in the transit
          peptide and accumulates an inactive CAH3 polypeptide
        supporting_text: Genomic sequence analysis of the mutant revealed two
          amino acid changes in the transit peptide.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract only cached (PMC1170469 exists). Founding paper
        for CAH3; supports lumenal location (IDA by thermolysin protection) and
        the genetic link between CAH3 and growth at air CO2.
  - id: PMID:9159949
    title: Intracellular carbonic anhydrase is essential to photosynthesis in
      Chlamydomonas reinhardtii at atmospheric levels of CO2. Demonstration via
      genomic complementation of the high-CO2-requiring mutant ca-1.
    findings:
      - statement: The ca-1 high-CO2-requiring mutant carries a nonsense
          mutation in CAH3 and is complemented by the CAH3 gene, linking CAH3
          to the CCM
        supporting_text: The data presented demonstrate that the carbonic
          anhydrase produced from the CAH3 gene is essential to the inorganic
          carbon-concentrating mechanism in C. reinhardtii
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract only cached; PubMed esummary confirms title. A
        second, independent allele (premature stop codon) that rules out the
        concern that the cia3 phenotype is due only to mistargeting.
  - id: PMID:12913181
    title: The Chlamydomonas reinhardtii cia3 mutant lacking a thylakoid
      lumen-localized carbonic anhydrase is limited by CO2 supply to rubisco
      and not photosystem II function in vivo.
    findings:
      - statement: In vivo, cia3 at low Ci is limited by CO2 supply to Rubisco,
          not by PSII function
        supporting_text: Overall, the results demonstrate that under low Ci
          conditions, the mutant lacks the ability to supply Rubisco with
          adequate CO(2) for effective CO(2) fixation and is not limited
          directly by any aspect of PSII function.
      - statement: Conclusion that the thylakoid CA is primarily a CCM
          component
        supporting_text: We conclude that the thylakoid CA is primarily
          required for the proper functioning of the CCM at low Ci by providing
          an ample supply of CO(2) for Rubisco.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Key in vivo test (MIMS, metabolite
        pools) that weighs the CCM role against the PSII role; the authors do
        not exclude a secondary PSII effect under high light.
  - id: PMID:19074623
    title: Thylakoid lumen carbonic anhydrase (CAH3) mutation suppresses
      air-Dier phenotype of LCIB mutant in Chlamydomonas reinhardtii.
    findings:
      - statement: cah3 mutations suppress the lcib air-dier phenotype and
          raise internal Ci more than 20-fold, placing LCIB downstream of CAH3
        supporting_text: We conclude that LCIB functions downstream of CAH3 in
          the CO2-concentrating mechanism and probably plays a role in trapping
          CO2 released by CAH3 dehydration of accumulated Ci.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Genetic epistasis supports CAH3 as the
        step that converts accumulated bicarbonate to CO2 in the CCM.
  - id: PMID:22709623
    title: Identification and functional role of the carbonic anhydrase Cah3 in
      thylakoid membranes of pyrenoid of Chlamydomonas reinhardtii.
    findings:
      - statement: Immunogold EM places most CAH3 in the thylakoid membranes
          that pass through the pyrenoid
        supporting_text: Immunoelectron microscopy demonstrated that luminal
          Cah3 is mostly located in the thylakoid membranes that pass through
          the pyrenoid.
      - statement: Model in which CAH3 generates CO2 in the lumen that
          diffuses into the pyrenoid
        supporting_text: The results support our hypothesis that CO(2) might
          be generated from HCO(3)(-) by Cah3 in the thylakoid lumen with the
          following CO(2) diffusion into the pyrenoid, where the CO(2) fixing
          Rubisco is located.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract only cached; PubMed esummary confirms title.
        Direct localization (IDA) to pyrenoid-traversing thylakoids.
  - id: PMID:23139834
    title: Phosphorylation controls the localization and activation of the
      lumenal carbonic anhydrase in Chlamydomonas reinhardtii.
    findings:
      - statement: After transfer to low CO2, CAH3 activity rises 5-6 fold
          without a change in protein level
        supporting_text: When C. reinhardtii wild-type cells were acclimated
          to limiting CO(2) conditions, the Cah3 activity increased about 5-6
          fold.
      - statement: CAH3 is phosphorylated at low CO2 and becomes partly
          concentrated in PSII-free pyrenoid-crossing thylakoids
        supporting_text: In contrast, in cells grown at limiting CO(2) the
          protein was partly concentrated in the thylakoids crossing the
          pyrenoid, which did not contain PSII and were surrounded by Rubisco
          molecules.
      - statement: Quantification shows the pyrenoid fraction rising from 19%
          to 37% of total CAH3; most remains in stromal thylakoids
        supporting_text: In the latter, only 19% of the total Cah3 was
          associated with the pyrenoid region, while in low-CO2-grown cells
          37% of the Cah3 protein was associated with the pyrenoid (Table 1).
      - statement: Isolated pyrenoids lack D1 but are enriched in CAH3 at low
          CO2
        supporting_text: These results indicate that Cah3, which is associated
          with PSII in high-CO2-grown cells [6], [7], is being concentrated in
          the intrapyrenoid thylakoids, which do not contain PSII, during the
          acclimation to low CO2 conditions.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Source of the module's
        phosphorylation/relocalization statement. Note that the relocalization
        is partial (19% to 37% of CAH3 in the pyrenoid), and the link between
        phosphorylation and relocalization is a correlation (staurosporine
        blocks the activity increase).
  - id: PMID:42465278
    title: Super-resolution expansion microscopy reveals nanoscale protein
      domains and CO(2)-dependent remodeling of Chlamydomonas
      pyrenoid-traversing membranes.
    findings:
      - statement: CAH3 is concentrated on the inner face of the central
          reticulated region of the pyrenoid-traversing membranes
        supporting_text: These results indicate that CAH3 localizes primarily
          to the reticulated region of the pyrenoid-traversing membranes.
      - statement: CAH3 localization does not change between high and low CO2
        supporting_text: In our experiments, we observed no change in the
          localization of CAH3 under high CO2 compared to low CO2 (Figure 6a).
      - statement: CAH3 appears membrane-associated within the tubule lumen
        supporting_text: When we quantified the distribution of CAH3 across
          the axis of individual tubules, we observed that CAH3 formed two
          distinct peaks at the edges of the tubules, indicating that CAH3 is
          not soluble
    reference_review:
      relevance: HIGH
      correctness: DISPUTED
      review_notes: bioRxiv preprint (2026), full text cached, not peer
        reviewed. Its finding that CAH3 stays in the pyrenoid tubules at high
        CO2 conflicts with the CO2-dependent relocalization reported by
        immunogold EM in PMID:23139834; both agree CAH3 is in the lumen of
        pyrenoid-traversing thylakoids.
  - id: PMID:11953312
    title: A photosystem II-associated carbonic anhydrase regulates the
      efficiency of photosynthetic oxygen evolution.
    findings:
      - statement: cia3 thylakoids and PSII particles show impaired water
          splitting that bicarbonate restores; CAH3 proposed to stabilise the
          Mn cluster
        supporting_text: We therefore conclude that Cah3 activity is necessary
          to stabilize the manganese cluster and maintain the water-oxidizing
          complex in a functionally active state.
    reference_review:
      relevance: MEDIUM
      correctness: DISPUTED
      review_notes: Abstract only cached. Primary source for the PSII donor
        side model. Relies on the cia3 allele, whose lesion is in the transit
        peptide; the in vivo relevance was challenged by PMID:12913181.
  - id: PMID:18239688
    title: The photosystem II-associated Cah3 in Chlamydomonas enhances the O2
      evolution rate by proton removal.
    findings:
      - statement: In cia3 PSII preparations, O2 evolution is slower and is
          raised by bicarbonate and further by added CAH3
        supporting_text: The O(2) evolution for saturating, continuous
          illumination (R(O2)) was slower than in the wild type, but was
          elevated by HCO(3)(-) and increased further by Cah3.
      - statement: Proposed mechanism, local bicarbonate supply as proton
          carrier at the Mn complex
        supporting_text: We propose that Cah3 promotes proton removal from the
          Mn complex by locally providing HCO(3)(-), which may function as
          proton carrier.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached. In vitro add-back of recombinant CAH3
        to PSII membranes is the strongest support for a PSII-side effect; the
        mechanism remains a proposal.
  - id: PMID:25617045
    title: Crystal structure and functional characterization of photosystem
      II-associated carbonic anhydrase CAH3 in Chlamydomonas reinhardtii.
    findings:
      - statement: Recombinant CAH3 is most active at slightly acidic pH, as in
          the illuminated lumen
        supporting_text: Membrane inlet mass spectrometry measurements showed
          that CrCAH3 was most active at the slightly acidic pH values
          prevalent in the thylakoid lumen under illumination.
      - statement: Crystal structure shows an N-terminal arm-swapped dimer and
          a disulfide bond
        supporting_text: CrCAH3 is a dimer at pH 4.1 that is stabilized by
          swapping of the N-terminal arms, a feature not previously observed in
          α-type carbonic anhydrases.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract only cached; source of PDB 4XIW/4XIX
        cross-referenced in UniProt (zinc ligands, disulfide). Direct assay of
        carbonate dehydratase activity of recombinant CAH3.
  - id: PMID:31226314
    title: Carbonic anhydrase CAH3 supports the activity of photosystem II
      under increased pH.
    findings:
      - statement: In PSII membranes, CAH3 activity protects PSII activity at
          raised pH; excess bicarbonate rescues cia3 preparations
        supporting_text: These findings testify that the main role of CAH3 in
          the vicinity of PSII is the acceleration of the HCO3- dehydration
          reaction.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Abstract only cached. In vitro PSII-membrane study.
  - id: PMID:39795314
    title: Highly Active Carbonic Anhydrase of the Thylakoid Lumen of
      Chlamydomonas reinhardtii.
    findings:
      - statement: Recombinant CAH3 has high CO2 hydration activity and is
          inhibited by sulfonamide CA inhibitors
        supporting_text: The recombinant protein α-CA CAH3 (rCAH3) from the
          thylakoid lumen obtained in the present study showed more than three
          times higher activity compared to CAH1 and more than 11 times higher
          compared to previous studies with rCAH3.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached. Biochemical characterization of
        recombinant CAH3 (IDA-quality evidence for GO:0004089).
  - id: PMID:38247801
    title: 'CAH3 from Chlamydomonas reinhardtii: Unique Carbonic Anhydrase of
      the Thylakoid Lumen.'
    findings:
      - statement: Review of the two proposed roles of CAH3 (CCM and PSII)
        supporting_text: Through its dehydration activity, CAH3 can be involved
          either in the carbon-concentrating mechanism supplying CO2 for
          RuBisCO in the pyrenoid or in supporting the maximal photosynthetic
          activity of photosystem II (PSII) by accelerating the removal of
          protons from the active center of the water-oxidizing complex.
      - statement: The cia3 substitutions lie next to the twin-arginine motif
          and block transport into the lumen
        supporting_text: Interestingly, the presence of two point changes near
          the twin arginine motif in the case of CAH3 is enough to completely
          disrupt the transport of the precursor protein from the stroma to the
          thylakoid lumen.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached. Review from a group that favours the
        PSII role; useful summary of biochemistry and of the cia3 lesion.
  - id: PMID:31391312
    title: Thylakoid localized bestrophin-like proteins are essential for the
      CO(2) concentrating mechanism of Chlamydomonas reinhardtii.
    findings:
      - statement: Current CCM models place CAH3 as the enzyme converting
          accumulated bicarbonate to CO2 in the lumen of pyrenoid-traversing
          thylakoids
        supporting_text: A key aspect of current Chlamydomonas CCM models is
          that accumulated HCO3− is converted to CO2 by CAH3, a carbonic
          anhydrase located in the thylakoid lumen (11–13).
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached. Context for the bestrophin-like
        channels (BST1-3) that supply lumenal bicarbonate to CAH3; uses cia3
        as CCM-deficient control.
  - id: PMID:42511718
    title: Sensitivity of Photosystem II to Photoinhibition in Chlamydomonas
      reinhardtii Under Conditions of Decreasing CO(2) Depends on a Luminal
      Carbonic Anhydrase.
    findings:
      - statement: After low-CO2 acclimation, cia3 shows greater PSII
          photoinhibition and D1 degradation
        supporting_text: Compared with the two wild-type strains, the cia3
          mutant exhibited greater PSII sensitivity to increased light
          intensity after acclimation to low CO2.
    reference_review:
      relevance: LOW
      correctness: LOW_QUALITY
      review_notes: Full text cached. Single-allele (cia3) physiology; the
        PSII phenotype could be a secondary consequence of CO2 starvation of
        the Calvin cycle (lower electron sink) rather than a direct PSII role.
existing_annotations:
  - term:
      id: GO:0004089
      label: carbonate dehydratase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - InterPro:IPR018338
