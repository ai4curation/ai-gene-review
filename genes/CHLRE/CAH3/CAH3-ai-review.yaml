core_functions:
  - description: Lumenal alpha-carbonic anhydrase that dehydrates bicarbonate
      to CO2 in the acidic lumen of the thylakoid tubules traversing the
      pyrenoid, releasing CO2 that diffuses into the Rubisco matrix as the
      final step of the CO2-concentrating mechanism. Activity rises five- to
      six-fold and CAH3 is phosphorylated after transfer to limiting CO2.
    molecular_function:
      id: GO:0004089
      label: carbonate dehydratase activity
    locations:
      - id: GO:0009543
        label: chloroplast thylakoid lumen
      - id: GO:0160223
        label: pyrenoid tubule
    supported_by:
      - reference_id: PMID:12913181
        supporting_text: We conclude that the thylakoid CA is primarily
          required for the proper functioning of the CCM at low Ci by providing
          an ample supply of CO(2) for Rubisco.
      - reference_id: PMID:19074623
        supporting_text: We conclude that LCIB functions downstream of CAH3 in
          the CO2-concentrating mechanism and probably plays a role in trapping
          CO2 released by CAH3 dehydration of accumulated Ci.
      - reference_id: PMID:9159949
        supporting_text: The data presented demonstrate that the carbonic
          anhydrase produced from the CAH3 gene is essential to the inorganic
          carbon-concentrating mechanism in C. reinhardtii
      - reference_id: PMID:23139834
        supporting_text: When C. reinhardtii wild-type cells were acclimated
          to limiting CO(2) conditions, the Cah3 activity increased about 5-6
          fold.
      - reference_id: PMID:22709623
        supporting_text: The results support our hypothesis that CO(2) might
          be generated from HCO(3)(-) by Cah3 in the thylakoid lumen with the
          following CO(2) diffusion into the pyrenoid, where the CO(2) fixing
          Rubisco is located.
suggested_questions:
  - question: Is the PSII donor-side role of CAH3 physiologically significant
      in intact cells, or a property of isolated PSII membranes? Most PSII
      evidence uses the cia3 allele (transit-peptide lesion) and in vitro
      preparations, while in vivo gas exchange at low Ci shows no PSII
      limitation.
  - question: Does CAH3 really redistribute into the pyrenoid tubules at low
      CO2 (immunogold, 19% to 37% of total), or is it constitutively enriched
      in the reticulated tubules (expansion microscopy)? Is any CAH3 left on
      PSII-containing stromal thylakoids?
    experts:
      - Jonikas MC
      - Moroney JV
  - question: GO has no process term for a CO2-concentrating mechanism and the
      water-oxidation process term is obsolete. How should the role of a
      carbonic anhydrase that delivers CO2 to Rubisco (or protons away from
      PSII) be captured in GO beyond its molecular function and location?
  - question: Which residues are phosphorylated, which kinase acts in the
      lumen, and does phosphorylation change catalytic rate, dimerization or
      membrane association?
suggested_experiments:
  - hypothesis: CAH3 activity in pyrenoid tubules, not near PSII, is what is
      needed for growth at low CO2.
    description: Express CAH3 variants targeted or retained in stromal
      thylakoids versus tubules (e.g. fused to tubule-specific membrane
      proteins) in a cah3 null background (e.g. a CLiP insertion or the ca-1
      nonsense allele), and measure growth, Ci affinity and PSII oxygen
      evolution in vivo.
    experiment_type: genetic complementation and physiology
  - hypothesis: Low-CO2 phosphorylation of CAH3 controls its activity and/or
      tubule enrichment.
    description: Map phosphosites by mass spectrometry of low-CO2 thylakoids,
      then test phospho-null and phosphomimetic CAH3 for activity and
      localization by expansion microscopy at high and low CO2.
    experiment_type: proteomics, mutagenesis and imaging
  - hypothesis: The PSII phenotypes of cia3 are partly caused by mistargeted
      CAH3 precursor rather than loss of lumenal CA activity.
