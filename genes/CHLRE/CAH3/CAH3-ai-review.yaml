    review:
      summary: CAH3 is a catalytically active alpha-type carbonic anhydrase.
        Activity has been shown for the native enzyme in complemented cells,
        for recombinant protein by membrane-inlet mass spectrometry, and the
        crystal structure shows the zinc site of an active alpha-CA. In vivo
        it is thought to act mainly in the dehydration direction (bicarbonate
        to CO2) in the acidic thylakoid lumen.
      action: ACCEPT
      reason: The InterPro/UniRule mapping is correct and is backed by direct
        experimental evidence of CA activity (PMID:9482718, PMID:25617045,
        PMID:39795314) and by genetics (PMID:9159949, PMID:19074623). This is
        the core molecular function of the gene product.
      supported_by:
