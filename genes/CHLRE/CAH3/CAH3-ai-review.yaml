  - term:
      id: GO:0008270
      label: zinc ion binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - InterPro:IPR018338
      - InterPro:IPR023561
      - UniRule:UR001252783
    review:
      summary: CAH3 binds a catalytic Zn2+ through three conserved histidines,
        as in other alpha-carbonic anhydrases; zinc is seen in the CAH3 crystal
        structures (PDB 4XIW, 4XIX).
      action: ACCEPT
      reason: Correct and structurally confirmed. Zinc binding is the
        cofactor-binding aspect of the carbonic anhydrase activity rather than
        a separate function, but the annotation is accurate and harmless.
      supported_by:
        - reference_id: PMID:25617045
          supporting_text: Two crystal structures of CrCAH3 in complex with
            either acetazolamide or phosphate ions were determined at 2.6- and
            2.7-Å resolution, respectively.
        - reference_id: PMID:38247801
          supporting_text: The sequence of the mature CAH3 protein showed
            30–40% identity with α-CAs and up to 90% within the conserved
            domains, including three His residues functioning as ligands to a
            Zn atom.
