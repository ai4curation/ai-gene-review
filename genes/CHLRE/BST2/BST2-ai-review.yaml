core_functions:
  - description: Bestrophin-type anion channel, modelled as pentameric, in the chloroplast
      thylakoid membrane, acting redundantly with (and probably
      hetero-oligomerizing with) paralogs BST1 and BST3. It is proposed (from
      triple-knockdown physiology, location and family precedent, not from
      transport measurements) to conduct stromal bicarbonate into the thylakoid
      lumen for dehydration by CAH3 in the low-CO2 inducible CO2-concentrating
      mechanism.
    molecular_function:
      id: GO:0005253
      label: monoatomic anion channel activity
    locations:
      - id: GO:0009535
        label: chloroplast thylakoid membrane
    supported_by:
      - reference_id: PMID:31391312
        supporting_text: the selective pore is positively charged, supporting the
          hypothesis that BST1–3 transport negatively charged ions
      - reference_id: PMID:31391312
        supporting_text: The localization studies visually showed that BST1,
          BST2, and BST3 were preferentially concentrated near the pyrenoid
      - reference_id: PMID:31391312
        supporting_text: These results indicate that BST1–3 play an important
          role in Ci uptake and fixation in low CO2 conditions in Chlamydomonas.
      - reference_id: PMID:31391312
        supporting_text: We propose that BST1–3 are the transporters that bring
          HCO3− to CAH3 inside the thylakoid.
      - reference_id: PMID:28938113
        supporting_text: LCI11 and Cre16.g662600 directly interact, and both also
          interact with another bestrophin-like protein, Cre16.g663400.
suggested_questions:
  - question: Do BST1, BST2 and BST3 form homo- or hetero-pentamers in vivo, and
      does BST2 conduct bicarbonate, chloride, or both? Until transport is
      measured, should GO:0015106 / GO:0160133 bicarbonate channel activity be
      asserted for any of BST1-3?
    experts:
      - Moroney JV
      - Mackinder LCM
  - question: Why is BST2 induction only partially CIA5-dependent, unlike BST1
      and BST3, and does BST2 have a basal role at high CO2?
  - question: Given >80% identity among BST1-3, which peptides in the
      interactome uniquely identified Cre16.g663400, and which studies using
      the name LCI11 refer to BST2 rather than BST3?
suggested_experiments:
  - hypothesis: BST2 (alone or with BST1/BST3) forms a bicarbonate-permeable
      anion channel.
    description: Express BST2 (with and without BST1/BST3, and C-terminally
      truncated to relieve possible autoinhibition) in HEK293 cells or Xenopus
      oocytes, or reconstitute purified protein in planar bilayers, and measure
      reversal potentials and relative permeability for HCO3- versus Cl-.
    experiment_type: electrophysiology
  - hypothesis: BST2 is individually or partially redundantly required for the
      CCM.
    description: Generate bst2 single, bst2 bst3 double and bst1 bst2 bst3
      triple CRISPR knockouts and test growth at low CO2, K1/2(Ci) and 14C-Ci
      accumulation, with complementation by tagged BST2 at native expression
      levels.
    experiment_type: genetic knockout and complementation
