taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  BST2 (bestrophin-like protein 2; locus Cre16.g663400) is a nuclear-encoded,
  chloroplast-targeted multi-pass membrane protein of the bestrophin/YneE/VCCN
  family in the green alga Chlamydomonas reinhardtii. It is one of three
  closely related paralogs (BST1/Cre16.g662600, BST2 and BST3/Cre16.g663450;
  more than 80% identical to one another) clustered in a ~130 kb region of
  chromosome 16. Older literature used the name LCI11 for BST2 and/or BST3.
  Its nearest land-plant relative is the Arabidopsis thylakoid
  voltage-dependent chloride channel VCCN1 (about 30% identity). Homology
  modelling of the BST1-3 group places them in the pentameric bestrophin
  channel fold, with a positively charged selectivity pore consistent with an
  anion channel. BST2 transcripts rise within hours of transfer to air-level
  CO2; this induction is reduced, but less completely than for BST1 and BST3,
  in mutants lacking the CCM master regulator CIA5. BST2 is expressed more
  highly than BST1. Fluorescently tagged BST2 lies in the thylakoid membranes
  of the chloroplast, extends into the pyrenoid thylakoid tubules, and is
  concentrated near the pyrenoid periphery. In an affinity-purification
  interactome, BST2 was recovered as an interactor of both BST1 and BST3.
  RNAi lines in which all three paralogs are knocked down together grow poorly
  at limiting CO2, have lower affinity for inorganic carbon and accumulate
  less inorganic carbon, especially at alkaline pH where bicarbonate
  dominates; loss of BST3 alone has little effect, implying redundancy. BST1-3
  are therefore proposed to be redundant thylakoid anion channels that move
  stromal bicarbonate into the thylakoid lumen, where carbonic anhydrase CAH3
  converts it to CO2 for Rubisco in the pyrenoid. No BST2-specific mutant has
  been described, and bicarbonate (or any anion) conductance has not been
  measured for any of BST1-3.
references:
  - id: PMID:31391312
    title: Thylakoid localized bestrophin-like proteins are essential for the CO(2)
      concentrating mechanism of Chlamydomonas reinhardtii.
    findings:
      - statement: BST2 is Cre16.g663400, one of three paralogous bestrophin-like
          genes clustered on chromosome 16
        supporting_text: BST1 (Cre16.g662600), BST2 (Cre16.g663400), and BST3
          (Cre16.g663450) (collectively BST1–3) are paralogous bestrophin-like
          genes
      - statement: BST1-3 are >80% identical; BST2 and BST3 were earlier called
          LCI11
        supporting_text: BST2 and BST3 were previously reported as LCI11 by Fang
          et al. (16). An alignment between the 3 Chlamydomonas bestrophin-like
          proteins showed that the proteins are >80% identical to one another
      - statement: BST1-3 are predicted chloroplast membrane proteins with a
          transit peptide
        supporting_text: predicted that each BST protein had a chloroplast
          transit peptide and was likely to be a chloroplast membrane protein
      - statement: Homology modelling supports a pentameric bestrophin fold and
          an anion-selective pore
        supporting_text: the selective pore is positively charged, supporting the
          hypothesis that BST1–3 transport negatively charged ions
      - statement: BST2 is induced in ambient CO2, with reduced induction in the
          cia5 mutant
        supporting_text: BST2 transcript levels in cia5 cells showed reduced
          induction in ambient CO2 when compared with D66 cells, where BST2
          transcript levels increase in ambient CO2 conditions.
      - statement: BST2 is expressed more highly than BST1
        supporting_text: BST1 had a lower level of expression than BST2 or BST3
      - statement: Venus-tagged BST1-3 (including BST2) localize to the
          chloroplast thylakoid membranes, enriched at the pyrenoid periphery
        supporting_text: The localization studies visually showed that BST1,
          BST2, and BST3 were preferentially concentrated near the pyrenoid
      - statement: BST1-3 are functionally redundant; single bst3 has a weak
          phenotype
        supporting_text: This led us to think that BST1 or BST2 function might be
          redundant with BST3
      - statement: Triple knockdown (including BST2 transcript) impairs low-CO2
          growth and Ci uptake
        supporting_text: RT-qPCR showed that bsti-1 had significantly reduced
          expression of BST1, BST2, and BST3 compared with D66
      - statement: BST1-3 are proposed (not shown) to deliver HCO3- to lumenal
          CAH3
        supporting_text: We propose that BST1–3 are the transporters that bring
          HCO3− to CAH3 inside the thylakoid.
      - statement: BST1-3 function differs from Arabidopsis VCCN1 (opposite pmf
          effect)
        supporting_text: The presence of AtVCCN1 decreases pmf in Arabidopsis, but
          the presence of the 3 BST proteins increases pmf in Chlamydomonas.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed/PMC-verified (PMC6708349); full text cached. The only
        primary functional study of BST1-3 and the only source of BST2-specific
        data (RT-PCR expression and CIA5 dependence; Venus-3xFLAG localization
        under the PSAD promoter, i.e. overexpression). BST2 was perturbed only
        as part of the triple RNAi; no BST2 single mutant and no transport or
        electrophysiology assay. The bicarbonate-channel role is an explicit
        proposal.
  - id: PMID:28938113
    title: A Spatial Interactome Reveals the Protein Organization of the Algal
      CO(2)-Concentrating Mechanism.
    findings:
      - statement: Cre16.g663400 (BST2) was recovered as an interactor of both
          the BST1 (Cre16.g662600) and BST3 (LCI11, Cre16.g663450) baits
        supporting_text: LCI11 and Cre16.g662600 directly interact, and both also
          interact with another bestrophin-like protein, Cre16.g663400.
      - statement: The LCIB/LCIC interactions were reported for BST3 and BST1,
          not for BST2
        supporting_text: Both LCIB and LCIC interact with LCI11 (Cre16.g663450),
          and LCIC also interacts with Cre16.g662600
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified; full text cached. Affinity-purification/MS
        interactome. BST2 appears only as a prey of the BST1 and BST3 baits;
        with >80% identity among paralogs, peptide-level discrimination of
        BST2 from BST1/BST3 may be limited. Interaction data only; no
        functional assay. Supports hetero-oligomerization among BST1-3 but is
        not a basis for an MF annotation.
  - id: PMID:39240724
    title: Bestrophin-like protein 4 is involved in photosynthetic acclimation to
      light fluctuations in Chlamydomonas.
    findings:
      - statement: BST1-3 are the model's thylakoid HCO3- channels, distinct from
          the pyrenoid-tubule BST4
        supporting_text: In the current model, bicarbonate (HCO3−) is channeled
          into the thylakoid lumen by bestrophin-like proteins 1-3 (BST1-3)
      - statement: BST1-3 are distributed throughout the thylakoid and enriched
          at the pyrenoid periphery
        supporting_text: While BST1-3 localizes throughout the thylakoid membrane
          and is enriched at the pyrenoid periphery
      - statement: HCO3- channel activity for BST-family proteins remains a
          hypothesis
        supporting_text: BST4 may function as an HCO3− channel, like that
          proposed for BST1-3 (Mukherjee et al. 2019), but there are currently no
          data to support this hypothesis
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified (2024 Plant Physiol). About BST4, not BST2,
        but the most recent primary paper on Chlamydomonas thylakoid
        bestrophins; confirms no direct transport measurement exists for the
        family (its oocyte electrophysiology of BST4 was negative).
  - id: PMID:27216227
    title: A voltage-dependent chloride channel fine-tunes photosynthesis in
      plants.
    findings:
      - statement: Arabidopsis VCCN1 (AT3G61320; PAINT donor for the IBA rows) is
          a voltage-dependent thylakoid Cl- channel shown by planar bilayer
          electrophysiology
        supporting_text: In this study, we bring evidence that AtVCCN1 forms a
          voltage-dependent Cl− channel, is located in the thylakoid membrane
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified; full text cached. Experimental grounding
        behind the IBA chloride-channel and light-reaction annotations; about
        the Arabidopsis homolog, not BST2.
  - id: PMID:38478576
    title: Low-CO2-inducible bestrophins outside the pyrenoid sustain high
      photosynthetic efficacy in diatoms.
    findings:
      - statement: In the diatom Phaeodactylum, knockout of the low-CO2-induced
          thylakoid bestrophin PtBST1 nearly abolishes the inducible CCM
        supporting_text: However, the striking phenotype of ΔPtBST1 mutants,
          which almost lacks in the LC-inducible CCM, clearly indicates that even
          the BST factors outside of the pyrenoid are vital components of the
          CO2-evolving machinery
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: PubMed-verified; full text cached. Independent genetic
        evidence in a diatom for the thylakoid-bestrophin CCM model; no direct
        transport assay; not about BST2.
