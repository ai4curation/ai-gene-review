existing_annotations:
  - term:
      id: GO:0005247
      label: voltage-gated chloride channel activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
      - AGI_LocusCode:AT3G61320
      - PANTHER:PTN004990962
    review:
      summary: Phylogenetic transfer from Arabidopsis VCCN1, an
        electrophysiologically characterized voltage-dependent thylakoid Cl-
        channel. BST2 shares the bestrophin fold and the anion-selective pore
        residues of BST1-3 (homology model), so anion channel activity is a
        sound inference. Neither chloride selectivity nor voltage gating has
        been tested for BST2, and BST1-3 behave differently from VCCN1 in vivo
        (knockdown lowers rather than raises thylakoid pmf). Their physiological
        role is linked to inorganic carbon (proposed HCO3-) delivery to the
        lumen.
      action: MODIFY
      reason: Same reasoning as for the near-identical paralog BST1. The IBA
        correctly places BST2 in an anion-channel clade, but the chloride- and
        voltage-specific child term is a VCCN1-specific property that the only
        functional study of BST1-3 argues against. Generalizing to monoatomic
        anion channel activity keeps the family inference without asserting
        Cl-/voltage specifics. A bicarbonate-specific term (GO:0160133 /
        GO:0015106) would be premature until transport is measured.
      proposed_replacement_terms:
        - id: GO:0005253
          label: monoatomic anion channel activity
      propagation_review:
        root_cause: TERM_SCOPING_PROBLEM
        failure_modes:
          - FUNCTIONAL_DIVERGENCE
          - GRANULARITY_MISMATCH
        source_entities:
          - source_id: PANTHER:PTN004990962
            source_label: PTN004990962
            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: Node grounded by Arabidopsis VCCN1 (AT3G61320), a bilayer-verified
              voltage-dependent Cl- channel. BST2 is inside the bestrophin anion-channel
              clade, so anion channel activity transfers, but Cl-/voltage specifics are
              not shown for BST1-3, whose in vivo pmf effect is opposite to VCCN1.
      supported_by:
        - reference_id: PMID:31391312
          supporting_text: the selective pore is positively charged, supporting
            the hypothesis that BST1–3 transport negatively charged ions
        - reference_id: PMID:31391312
          supporting_text: The presence of AtVCCN1 decreases pmf in Arabidopsis,
            but the presence of the 3 BST proteins increases pmf in Chlamydomonas.
        - reference_id: PMID:27216227
          supporting_text: In this study, we bring evidence that AtVCCN1 forms a
            voltage-dependent Cl− channel, is located in the thylakoid membrane
