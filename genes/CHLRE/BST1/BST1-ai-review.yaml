core_functions:
  - description: Bestrophin-type anion channel, modelled as pentameric, in the chloroplast
      thylakoid membrane, acting redundantly with paralogs BST2 and BST3. It is
      proposed (from knockdown physiology, location and family precedent, not
      from transport measurements) to conduct stromal bicarbonate into the
      thylakoid lumen for dehydration by CAH3 in the low-CO2 inducible
      CO2-concentrating mechanism.
    molecular_function:
      id: GO:0005253
      label: monoatomic anion channel activity
    locations:
      - id: GO:0009535
        label: chloroplast thylakoid membrane
    supported_by:
      - reference_id: PMID:31391312
        supporting_text: the selective pore is positively charged, supporting the
          hypothesis that BST1–3 transport negatively charged ions
      - reference_id: PMID:31391312
        supporting_text: All 3 BST-like proteins localized to the thylakoid
          membranes of the chloroplast
      - reference_id: PMID:31391312
        supporting_text: These results indicate that BST1–3 play an important
          role in Ci uptake and fixation in low CO2 conditions in Chlamydomonas.
      - reference_id: PMID:31391312
        supporting_text: We propose that BST1–3 are the transporters that bring
          HCO3− to CAH3 inside the thylakoid.
suggested_questions:
  - question: Do BST1, BST2 and BST3 conduct bicarbonate, chloride, or both,
      and is BST1 a functional channel on its own or only in hetero-oligomers
      with BST2/BST3 (they interact directly)? Until this is measured, should
      GO:0015106 / GO:0160133 bicarbonate channel activity be asserted for
      BST1-3 at all?
    experts:
      - Moroney JV
      - Mackinder LCM
  - question: Is the low-CO2 Ci-uptake defect of bsti knockdowns a direct
      consequence of lost thylakoid HCO3- flux, or partly indirect through the
      altered thylakoid proton-motive force?
  - question: Does BST1 contribute anything distinct from BST2/BST3 given its
      lower expression and divergent C terminus?
suggested_experiments:
  - hypothesis: BST1 (alone or with BST2/BST3) forms a bicarbonate-permeable
      anion channel.
    description: Express BST1 (with and without BST2/BST3, and C-terminally
      truncated to relieve possible autoinhibition) in HEK293 cells or Xenopus
      oocytes, or reconstitute purified protein in planar bilayers, and measure
      reversal potentials and relative permeability for HCO3- versus Cl-.
    experiment_type: electrophysiology
  - hypothesis: BST1 is individually required for the CCM under some
      condition.
    description: Generate bst1 single and bst1 bst2 bst3 triple CRISPR knockouts
      (rather than RNAi) and test growth, K1/2(Ci) and 14C-Ci accumulation, with
      complementation by tagged BST1 at native expression levels.
    experiment_type: genetic knockout and complementation
