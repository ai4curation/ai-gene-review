      label: voltage-gated chloride channel activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
      - AGI_LocusCode:AT3G61320
      - PANTHER:PTN004990962
    review:
      summary: Phylogenetic transfer from Arabidopsis VCCN1, an
        electrophysiologically characterized voltage-dependent thylakoid Cl-
        channel. BST1 shares the bestrophin fold and an anion-selective pore
        (homology model), so anion channel activity is a sound inference.
        However, neither chloride selectivity nor voltage gating has been
        tested for BST1, and the Chlamydomonas BST1-3 paralogs behave
        differently from VCCN1 in vivo (knockdown lowers rather than raises
        thylakoid pmf). Their physiological role is linked to inorganic carbon
        (proposed HCO3-) delivery to the lumen.
      action: MODIFY
      reason: The IBA correctly places BST1 in an anion-channel clade, but the
        chloride- and voltage-specific child term is a VCCN1-specific property
        that the authors of the only BST1 functional study argue against for
        BST1-3. Generalizing to monoatomic anion channel activity keeps the
        well-founded family inference without asserting the Cl-/voltage
        specifics. A bicarbonate-specific term (GO:0160133 bicarbonate channel
        activity / GO:0015106) would be premature until transport is measured.
      proposed_replacement_terms:
        - id: GO:0005253
          label: monoatomic anion channel activity
      propagation_review:
        root_cause: TERM_SCOPING_PROBLEM
        failure_modes:
