taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  BST1 (bestrophin-like protein 1; locus Cre16.g662600) is a nuclear-encoded,
  chloroplast-targeted multi-pass membrane protein of the bestrophin/YneE/VCCN
  family (Pfam Bestrophin_2) in the green alga Chlamydomonas reinhardtii. It is
  one of three closely related paralogs (BST1, BST2/Cre16.g663400 and
  BST3/Cre16.g663450) clustered in a ~130 kb region of chromosome 16. Its
  nearest land-plant relative is the Arabidopsis thylakoid voltage-dependent
  chloride channel VCCN1 (about 30% identity). Homology modelling places BST1
  in the pentameric bestrophin channel fold, with a positively charged
  selectivity pore consistent with an anion channel. BST1 is induced when
  cells are moved to air-level CO2, and this induction depends on the CCM
  master regulator CIA5; it is expressed at lower levels than BST2 and BST3.
  Fluorescently tagged BST1 lies in the thylakoid membranes of the chloroplast
  and is enriched at the periphery of the pyrenoid. In interactome studies
  BST1 associates with its paralogs and with the stromal LCIB/LCIC complex.
  Knockdown of all three paralogs together (single BST3 loss has little
  effect) impairs growth at limiting CO2, lowers the cell's affinity for
  inorganic carbon and reduces inorganic carbon accumulation, especially at
  alkaline pH where bicarbonate dominates. BST1-3 are therefore proposed to be
  redundant thylakoid anion channels that move stromal bicarbonate into the
  thylakoid lumen, where carbonic anhydrase CAH3 converts it to CO2 for
  Rubisco in the pyrenoid. Bicarbonate (or any anion) conductance has not yet
  been measured directly for BST1-3. Their effect on thylakoid proton-motive
  force is opposite to that of Arabidopsis VCCN1, which argues against a
  VCCN1-like chloride-counterion role.
references:
  - id: PMID:31391312
    title: Thylakoid localized bestrophin-like proteins are essential for the CO(2)
      concentrating mechanism of Chlamydomonas reinhardtii.
    findings:
      - statement: BST1 is Cre16.g662600, one of three paralogous
          bestrophin-like genes clustered on chromosome 16
        supporting_text: BST1 (Cre16.g662600), BST2 (Cre16.g663400), and BST3
          (Cre16.g663450) (collectively BST1–3) are paralogous bestrophin-like
          genes
      - statement: BST1-3 are predicted chloroplast membrane proteins with a
          transit peptide
        supporting_text: predicted that each BST protein had a chloroplast
          transit peptide and was likely to be a chloroplast membrane protein
      - statement: Homology modelling supports a pentameric bestrophin fold and
          an anion-selective pore
        supporting_text: the selective pore is positively charged, supporting the
          hypothesis that BST1–3 transport negatively charged ions
      - statement: BST1 expression depends on CIA5 and is lower than BST2/BST3
        supporting_text: the cia5 mutant exhibited severely reduced expression of
          BST1 and BST3 under both CO2 conditions
      - statement: Venus-tagged BST1-3 localize to the chloroplast thylakoid
          membranes, enriched at the pyrenoid periphery
        supporting_text: All 3 BST-like proteins localized to the thylakoid
          membranes of the chloroplast
      - statement: BST1-3 are functionally redundant; single bst3 has a weak
          phenotype
        supporting_text: This led us to think that BST1 or BST2 function might be
          redundant with BST3
      - statement: Triple knockdown impairs low-CO2 growth and Ci uptake
        supporting_text: These results indicate that BST1–3 play an important
          role in Ci uptake and fixation in low CO2 conditions in Chlamydomonas.
      - statement: BST1-3 are proposed (not shown) to deliver HCO3- to lumenal
          CAH3
        supporting_text: We propose that BST1–3 are the transporters that bring
          HCO3− to CAH3 inside the thylakoid.
      - statement: BST1-3 function differs from Arabidopsis VCCN1 (opposite pmf
          effect)
        supporting_text: The presence of AtVCCN1 decreases pmf in Arabidopsis, but
          the presence of the 3 BST proteins increases pmf in Chlamydomonas.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed/PMC-verified (PMC6708349); full text cached. The only
        primary functional study of BST1-3. Provides localization (Venus fusion
        under PSAD promoter, i.e. overexpression), CIA5-dependent induction,
        triple-RNAi physiology and homology modelling. No direct transport or
        electrophysiology assay was performed; the bicarbonate-channel role is
        an explicit proposal.
  - id: PMID:28938113
    title: A Spatial Interactome Reveals the Protein Organization of the Algal
      CO(2)-Concentrating Mechanism.
    findings:
      - statement: Cre16.g662600 (BST1) interacts with LCIC and with the
          bestrophin paralogs LCI11 (BST3) and Cre16.g663400 (BST2)
        supporting_text: LCI11 and Cre16.g662600 directly interact, and both also
          interact with another bestrophin-like protein, Cre16.g663400.
      - statement: BST1 is low-CO2 induced and was flagged as a putative
          bicarbonate-permeable bestrophin
        supporting_text: Both LCI11 and Cre16.g662600 are putative bestrophins,
          which typically transport chloride but have been shown to be permeable
          to HCO3−
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified; full text cached. Affinity-purification/MS
        interactome that first linked Cre16.g662600 to LCIB/LCIC and the other
        BST paralogs. Interaction data only; no functional assay of BST1.
  - id: PMID:39240724
    title: Bestrophin-like protein 4 is involved in photosynthetic acclimation to
      light fluctuations in Chlamydomonas.
    findings:
      - statement: BST4 (RBMP1) is a pyrenoid-tubule bestrophin distinct from
          BST1-3, which remain the model's thylakoid HCO3- channels
        supporting_text: In the current model, bicarbonate (HCO3−) is channeled
          into the thylakoid lumen by bestrophin-like proteins 1-3 (BST1-3)
      - statement: BST1-3 are distributed throughout the thylakoid and enriched
          at the pyrenoid periphery, unlike tubule-localized BST4
        supporting_text: While BST1-3 localizes throughout the thylakoid membrane
          and is enriched at the pyrenoid periphery
      - statement: A paralog-family member (BST4) tested in Xenopus oocytes gave
          no measurable currents, and HCO3- channel activity for BST-family
          proteins remains a hypothesis
        supporting_text: BST4 may function as an HCO3− channel, like that
          proposed for BST1-3 (Mukherjee et al. 2019), but there are currently no
          data to support this hypothesis
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified (2024 Plant Physiol; bioRxiv preprint is
        PMID:38014171). About BST4, not BST1, but it is the most recent primary
        paper on Chlamydomonas thylakoid bestrophins and confirms that no
        direct transport measurement exists for the family; its oocyte
        electrophysiology of BST4 was negative.
  - id: PMID:27216227
    title: A voltage-dependent chloride channel fine-tunes photosynthesis in
      plants.
    findings:
      - statement: Arabidopsis VCCN1 (AT3G61320; the PAINT donor for the IBA
          rows) is a voltage-dependent thylakoid Cl- channel shown by planar
          bilayer electrophysiology
        supporting_text: In this study, we bring evidence that AtVCCN1 forms a
          voltage-dependent Cl− channel, is located in the thylakoid membrane
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified; full text cached. Source of the
        experimental grounding behind the IBA chloride-channel and light
        reaction annotations; about the Arabidopsis homolog, not BST1.
  - id: PMID:38478576
    title: Low-CO2-inducible bestrophins outside the pyrenoid sustain high
      photosynthetic efficacy in diatoms.
    findings:
      - statement: In the diatom Phaeodactylum, knockout of the low-CO2-induced
          thylakoid bestrophin PtBST1 nearly abolishes the inducible CCM,
          supporting a conserved role for thylakoid bestrophins in algal CCMs
        supporting_text: However, the striking phenotype of ΔPtBST1 mutants,
          which almost lacks in the LC-inducible CCM, clearly indicates that even
          the BST factors outside of the pyrenoid are vital components of the
          CO2-evolving machinery
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: PubMed-verified; full text cached. Independent genetic
        evidence in a diatom for the thylakoid-bestrophin CCM model; no direct
        transport assay; not about BST1 itself.
  - id: PMID:38445821
    title: 'Transportation for fuel: Thylakoid membrane bestrophin channels facilitate
      HCO3- transport to the pyrenoid in diatoms.'
    findings: []
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: PubMed-verified commentary on PMID:38478576. It describes
        BST1-3 as "the main HCO3− transporters", which overstates the primary
        evidence (no direct transport measured). Not used as evidence.
