        GO:0015979 photosynthesis and GO:0071244 cellular response to carbon
        dioxide. These are dropped: the first two are too broad, and EPYC1 does
        not carry out carboxylation (Rubisco is equally active inside and
        outside droplets, PMID:30498228). The third rested only on low-CO2
        induction of expression, which shows regulation, not participation.
      supported_by:
        - reference_id: PMID:27166422
          supporting_text: We conclude that EPYC1 is required for Rubisco
            localization to the pyrenoid not only at low CO 2 , but also at
            high CO 2 .
        - reference_id: PMID:33177094
          supporting_text: First, in a mutant lacking EPYC1, a pyrenoid-like
            structure still assembles around the tubules, containing some
            Rubisco enclosed by a starch sheath, although the canonical matrix
            is absent (13).
        - reference_id: PMID:33230314
          supporting_text: Cryo-electron tomography supports a model in which
            EPYC1 and Rubisco form a codependent multivalent network of
            specific low-affinity bonds, giving the matrix liquid-like
            properties.
