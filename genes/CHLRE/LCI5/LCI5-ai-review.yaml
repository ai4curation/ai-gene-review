  - id: PMID:33177094
    title: Assembly of the algal CO(2)-fixing organelle, the pyrenoid, is
      guided by a Rubisco-binding motif.
    findings:
      - statement: EPYC1 is an intrinsically disordered protein that phase
          separates with Rubisco to form the pyrenoid matrix
        supporting_text: EPYC1 is a ~35-kDa intrinsically disordered protein
          that phase-separates with Rubisco to form the pyrenoid matrix (13, 15,
          16).
      - statement: Without EPYC1 the canonical pyrenoid matrix is absent
        supporting_text: First, in a mutant lacking EPYC1, a pyrenoid-like
