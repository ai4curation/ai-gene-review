core_functions:
  - description: Multivalent Rubisco linker that binds the alpha-helices of
      Rubisco small subunits through repeated Rubisco-binding regions and
      cross-links holoenzymes, driving liquid-liquid phase separation of
      Rubisco to form the pyrenoid matrix. The activity is switched off by
      KEY1-dependent phosphorylation of the binding regions.
    molecular_function:
      id: GO:0140693
      label: molecular condensate scaffold activity
    directly_involved_in:
      - id: GO:0140694
        label: membraneless organelle assembly
    locations:
      - id: GO:1990732
        label: pyrenoid
    supported_by:
      - reference_id: PMID:30498228
        supporting_text: Here we use biochemical reconstitution to demonstrate
          that Rubisco and EPYC1 are the two components necessary and sufficient
          to bring about a liquid-liquid phase separation (LLPS) that
          recapitulates the liquid-like behavior reported for the microalgal
          pyrenoid
      - reference_id: PMID:33230314
        supporting_text: Together, our data demonstrate that EPYC1’s
          Rubisco-binding regions bind to the Rubisco small subunit α-helices
          via salt-bridge interactions and a hydrophobic interface, enabling the
          condensation of Rubisco into the phase separated matrix.
      - reference_id: PMID:27166422
        supporting_text: Venus-tagged EPYC1 showed clear colocalization with
          mCherry-tagged RBCS in the pyrenoid
      - reference_id: PMID:41845050
        supporting_text: We show that KEY1 localizes to the condensates and
          promotes their dissolution by disrupting interactions between their
          core constituents, the CO2-fixing enzyme Rubisco and its linker
          protein EPYC1, through EPYC1 phosphorylation.
proposed_new_terms:
  - proposed_name: pyrenoid assembly
    proposed_definition: The aggregation, arrangement and bonding together of a
      set of components to form a pyrenoid, the Rubisco-containing,
      phase-separated organelle of the chloroplast stroma of most algae and
      some hornworts.
    justification: EPYC1 is the multivalent linker whose binding to Rubisco is
      necessary and sufficient to form the pyrenoid matrix. GO has a pyrenoid
      cellular component term but no process term for its assembly, so the
      role can only be captured with the generic membraneless organelle
      assembly term.
    proposed_parent:
      id: GO:0140694
      label: membraneless organelle assembly
    supported_by:
      - reference_id: PMID:33177094
        supporting_text: EPYC1 is a ~35-kDa intrinsically disordered protein
          that phase-separates with Rubisco to form the pyrenoid matrix (13, 15,
          16).
suggested_questions:
  - question: Should GO add a "pyrenoid assembly" process term (is_a
      membraneless organelle assembly) so that the role of EPYC1 and other
      pyrenoid matrix and tubule proteins can be captured more specifically?
    experts:
      - Jonikas MC
      - Mackinder LCM
  - question: Is there a GO convention for linking a condensate scaffold to
      the carbon-concentrating function of the organelle it forms (for example
      how carboxysome linkers such as CcmM and CsoS2 are annotated), given that
      EPYC1 does not catalyse carbon fixation itself?
  - question: What are the roles of the 14-3-3 proteins FTT1/FTT2 and the
      kinase KIN4-2 found with EPYC1 in the spatial interactome, and is any
      phosphatase responsible for re-condensation after division?
    experts:
      - Mackinder LCM
  - question: Does EPYC1 have a direct, specific interaction with thylakoid
      tubules or tubule proteins, or did the thylakoid association reported in
      2006 arise only from co-fractionation of the pyrenoid matrix?
suggested_experiments:
  - hypothesis: Phosphorylation of the EPYC1 Rubisco-binding regions by KEY1
      directly lowers Rubisco affinity and so controls condensate size.
    description: Measure Rubisco binding (SPR/ITC) and phase-separation
      boundaries for phosphomimetic and phospho-null variants at the mapped
      KEY1 sites in each binding region, and test the variants in an epyc1
      background for pyrenoid number and dissolution during division.
    experiment_type: biophysics and complementation
  - hypothesis: The apparent thylakoid membrane association of LCI5 reported
      in 2006 reflects pyrenoid matrix co-sedimentation with thylakoid
      tubules, not a membrane location.
    description: Repeat the thylakoid fractionation with pyrenoid-less or
      matrix-less strains (for example the RBCS alpha-helix swap line) and
      compare EPYC1 partitioning; complement with cryo-ET immunolabelling
      relative to tubule membranes.
    experiment_type: cell fractionation and imaging
  - hypothesis: The number and spacing of Rubisco-binding regions sets the
      material properties of the matrix and the efficiency of the CCM in vivo.
    description: Replace endogenous EPYC1 with variants carrying 3 to 6
      binding regions or altered linker lengths, then measure FRAP, pyrenoid
      morphology, Ci affinity and growth at low CO2.
    experiment_type: genetic complementation and physiology
knowledge_gaps:
  - gap_statement: The kinase acting on EPYC1 is now known (KEY1), but no
      phosphatase or 14-3-3-dependent mechanism that resets EPYC1
      phosphorylation to re-condense the pyrenoid after division has been
      identified.
    boundary: EPYC1 is phosphorylated in its Rubisco-binding regions mainly by
      KEY1, and phosphorylation disrupts Rubisco binding and promotes
      condensate dissolution.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    provenance:
      - reference_id: PMID:28938113
        supporting_text: It is therefore possible that these 14-3-3 proteins
          are regulating an interaction between EPYC1 and Rubisco, possibly by
          changing the availability of protein-binding domains.
  - gap_statement: GO has no process term specific to pyrenoid assembly, so
      the role of EPYC1 can only be captured as membraneless organelle
      assembly.
    boundary: EPYC1 with Rubisco is necessary and sufficient to form the
      liquid matrix of the pyrenoid.
    gap_kind:
      - ONTOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    resolution: Request a new GO BP term "pyrenoid assembly" (is_a
      GO:0140694 membraneless organelle assembly).
    provenance:
      - reference_id: PMID:33177094
        supporting_text: EPYC1 is a ~35-kDa intrinsically disordered protein
          that phase-separates with Rubisco to form the pyrenoid matrix (13, 15,
          16).
