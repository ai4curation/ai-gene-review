id: Q94ET8
gene_symbol: LCI5
aliases:
  - EPYC1
  - Essential Pyrenoid Component 1
  - Low-CO2-inducible protein 5
  - Cre10.g436550
taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  EPYC1/LCI5 (Essential Pyrenoid Component 1, originally described as
  Low-CO2-inducible protein 5; locus Cre10.g436550) is a nuclear-encoded,
  chloroplast-targeted, intrinsically disordered repeat protein of about 32 kDa
  that forms the pyrenoid matrix of Chlamydomonas reinhardtii together with
  Rubisco. Its sequence consists of near-identical ~60-residue repeats, each
  containing a short Rubisco-binding region (five in total) that folds into an
  alpha-helix on binding and sits across the two surface-exposed alpha-helices
  of a Rubisco small subunit, held by salt bridges and a hydrophobic interface;
  each Rubisco holoenzyme offers eight such sites. By binding several Rubisco
  holoenzymes at once through multiple low-affinity sites, EPYC1 cross-links
  Rubisco into a codependent multivalent network that demixes into a
  liquid-like condensate. Purified EPYC1 and Rubisco are necessary and
  sufficient to form dynamic liquid droplets in vitro in which Rubisco remains
  catalytically active, and expression of EPYC1 with a Rubisco carrying the
  Chlamydomonas small subunit condenses Rubisco into a proto-pyrenoid in
  Arabidopsis chloroplasts. EPYC1 is about as abundant as the Rubisco small
  subunit in the pyrenoid, is strongly induced at low CO2, and is required for
  normal pyrenoid size, number and matrix density, for packaging most cellular
  Rubisco into the pyrenoid, and for an efficient CO2-concentrating mechanism
  and photoautotrophic growth at low CO2. EPYC1 is multiply phosphorylated in
  its repeats, especially under CO2 limitation; the pyrenoid-localised kinase
  KEY1 is its main kinase, and phosphorylation weakens EPYC1-Rubisco binding,
  allowing the condensate to dissolve and change size and number during the
  cell cycle. An earlier fractionation study placed the protein on the stromal
  side of thylakoid membranes, but EPYC1 has no transmembrane segment and live
  imaging places it in the pyrenoid matrix, which is crossed by
  thylakoid-derived tubules; a dilute pool in the stroma becomes visible when
  the pyrenoid partly disperses during division.
references:
  - id: PMID:27166422
    title: A repeat protein links Rubisco to form the eukaryotic
      carbon-concentrating organelle.
    findings:
      - statement: The low-CO2-induced protein LCI5 (Cre10.g436550) is an
          abundant pyrenoid component, renamed EPYC1, at roughly 1:1
          stoichiometry with the Rubisco small subunit
        supporting_text: Strikingly, a fourth protein, previously identified as
          a low-CO 2 –induced nuclear-encoded protein (LCI5; Cre10.g436550) ( 24
          ), was found in the low-CO 2 pyrenoid fraction with comparable
          abundance to Rubisco
      - statement: Fluorescently tagged EPYC1 colocalizes with Rubisco in the
          pyrenoid
        supporting_text: Venus-tagged EPYC1 showed clear colocalization with
          mCherry-tagged RBCS in the pyrenoid
      - statement: The epyc1 mutant has a CCM defect and fails to grow
          photoautotrophically at low CO2; rescue by complementation
        supporting_text: the epyc1 mutant showed defective photoautotrophic
          growth in low CO 2 , which was rescued by high CO 2 and by
          reintroducing the EPYC1 gene
      - statement: EPYC1 is required for Rubisco localization to the pyrenoid
        supporting_text: We conclude that EPYC1 is required for Rubisco
          localization to the pyrenoid not only at low CO 2 , but also at high
          CO 2 .
      - statement: EPYC1 and Rubisco co-immunoprecipitate
        supporting_text: We conclude that EPYC1 and Rubisco are part of the
          same supramolecular complex in the pyrenoid.
      - statement: EPYC1 is a disordered repeat protein that mediates Rubisco
          accumulation in the pyrenoid
        supporting_text: Here we find that Rubisco accumulation in the pyrenoid
          of the model alga Chlamydomonas reinhardtii is mediated by a
          disordered repeat protein, which we term Essential Pyrenoid Component
          1 (EPYC1).
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Primary paper that identifies LCI5
        (Cre10.g436550) as EPYC1, the abundant pyrenoid linker; provides
        localization (IDA), co-IP with Rubisco (IPI) and mutant phenotype (IMP).
  - id: PMID:28938114
    title: The Eukaryotic CO(2)-Concentrating Organelle Is Liquid-like and
      Exhibits Dynamic Reorganization.
    findings:
      - statement: Explicit statement that EPYC1 and LCI5 are the same protein
        supporting_text: a protein called Essential Pyrenoid Component 1 (EPYC1;
          also known as LCI5) links Rubisco holoenzymes together to form the
          pyrenoid matrix
      - statement: Part of the EPYC1 pool disperses from the pyrenoid matrix
          into the stroma during pyrenoid division
        supporting_text: A portion of the RbcS1-Venus and EPYC1-Venus signals
          rapidly dispersed from the pyrenoid matrix into the stroma for ~20
          minutes near the end of chloroplast and pyrenoid division
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Establishes the pyrenoid matrix as a
        liquid-like condensate in vivo and is the source that explicitly
        equates EPYC1 with LCI5.
  - id: PMID:30498228
    title: The phase separation underlying the pyrenoid-based microalgal Rubisco
      supercharger.
    findings:
      - statement: Purified EPYC1 and Rubisco are necessary and sufficient for
          liquid-liquid phase separation in vitro
        supporting_text: Here we use biochemical reconstitution to demonstrate
          that Rubisco and EPYC1 are the two components necessary and sufficient
          to bring about a liquid-liquid phase separation (LLPS) that
          recapitulates the liquid-like behavior reported for the microalgal
          pyrenoid
      - statement: Rubisco remains catalytically active inside EPYC1-Rubisco
          droplets
        supporting_text: Rubisco enzyme activity (indicated as 3PG production)
          is unaffected by droplet formation.
      - statement: EPYC1 alone is soluble and does not form a homotypic scaffold
          at physiological concentrations; condensation is co-dependent on
          Rubisco
        supporting_text: In contrast to the scaffold hypothesis we find EPYC1 is
          relatively soluble and only homotypically phase separates at
          concentrations of 100 µM or more in the presence of a crowding agent.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Minimal in vitro reconstitution; direct
        evidence (IDA) for the condensate scaffold activity. Note that the
        paper's "scaffold hypothesis" means a self-assembled EPYC1 lattice,
        which it rejects; this does not conflict with the GO sense of molecular
        condensate scaffold activity (binding and bringing macromolecules
        together so they organise as a condensate).
  - id: PMID:33230314
    title: The structural basis of Rubisco phase separation in the pyrenoid.
    findings:
      - statement: Cryo-EM structures show each EPYC1 Rubisco-binding region
          binding the two alpha-helices of a Rubisco small subunit via salt
          bridges and a hydrophobic interface
        supporting_text: Together, our data demonstrate that EPYC1’s
          Rubisco-binding regions bind to the Rubisco small subunit α-helices
          via salt-bridge interactions and a hydrophobic interface, enabling the
          condensation of Rubisco into the phase separated matrix.
      - statement: EPYC1 has five Rubisco-binding regions; each holoenzyme has
          eight EPYC1 sites; interface mutations abolish binding, phase
          separation and pyrenoid formation
        supporting_text: We find that EPYC1 consists of five evenly spaced
          Rubisco-binding regions that share sequence similarity.
          Single-particle cryo-electron microscopy of these regions in complex
          with Rubisco indicates that each Rubisco holoenzyme has eight binding
          sites for EPYC1, one on each Rubisco small subunit. Interface
          mutations disrupt binding, phase separation and pyrenoid formation.
      - statement: EPYC1 and Rubisco form a codependent multivalent network
        supporting_text: Cryo-electron tomography supports a model in which
          EPYC1 and Rubisco form a codependent multivalent network of specific
          low-affinity bonds, giving the matrix liquid-like properties.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached; source of PDB 7JFO (EPYC1 residues
        49-72 bound to Rubisco) cross-referenced in the UniProt entry.
  - id: PMID:33298923
    title: Condensation of Rubisco into a proto-pyrenoid in higher plant
      chloroplasts.
    findings:
      - statement: EPYC1 expressed in Arabidopsis with a Chlamydomonas-type
          Rubisco small subunit drives formation of a Rubisco condensate
        supporting_text: Expression of EPYC1 in the Arabidopsis line S2Cr
          results in condensate formation.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached. Heterologous sufficiency test in planta
        (proto-pyrenoid).
  - id: PMID:31504763
    title: The pyrenoidal linker protein EPYC1 phase separates with hybrid
      Arabidopsis-Chlamydomonas Rubisco through interactions with the algal
      Rubisco small subunit.
    findings:
      - statement: Each EPYC1 repeat contributes additively to Rubisco small
          subunit binding (yeast two-hybrid)
        supporting_text: Addition of the first EPYC1 repeat region was
          sufficient to detect interaction, and each subsequent repeat region
          correlated with growth at increased concentrations of 3-AT, indicating
          that EPYC1 is a modular protein and each repeat has an additive effect
          on SSU interaction.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified by esearch on "EPYC1"; full text cached.
        Maps the EPYC1-SSU interaction to the SSU alpha-helices and shows
