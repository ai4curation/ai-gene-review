  - id: PMID:16572472
    title: CO2 limitation induces specific redox-dependent protein
      phosphorylation in Chlamydomonas reinhardtii.
    findings:
      - statement: LCI5 (EPYC1) is phosphorylated on serine and threonine
          residues within its tandem repeats
        supporting_text: The phosphorylation sites were mapped in the tandem
          repeats of Lci5 ensuring phosphorylation of four serine and three
          threonine residues in the protein.
      - statement: LCI5 phosphorylation occurs only at limiting CO2
        supporting_text: Phosphorylation of Lci5 and UEP occurred strictly at
          limiting CO2; it required reduction of electron carriers in the
          thylakoid membrane, but was not induced by light.
      - statement: Fractionation placed LCI5 on the stromal side of thylakoid
          membranes
        supporting_text: Immunoblotting with Lci5-specific antibodies revealed
          that Lci5 was localized in chloroplast and confined to the stromal
          side of the thylakoid membranes.
        finding_review:
          finding_status: DISPUTED
          review_notes: Later live-cell imaging and pyrenoid proteomics place
            EPYC1 in the pyrenoid matrix, which is crossed by thylakoid-derived
            tubules. EPYC1 has no transmembrane segment, so the thylakoid
            association is most likely co-fractionation of the matrix with
            thylakoid membranes rather than a membrane location.
          supported_by:
            - reference_id: PMID:27166422
              supporting_text: Venus-tagged EPYC1 showed clear colocalization
                with mCherry-tagged RBCS in the pyrenoid
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Abstract only cached. First report of multisite,
        low-CO2-dependent phosphorylation of LCI5/EPYC1. The thylakoid
        "stromal side" localization came from fractionation and immunoblotting
        before the pyrenoid matrix localization was known; the pyrenoid is
        crossed by thylakoid-derived tubules and EPYC1 has no transmembrane
        segment, so this is best read as association of the pyrenoid matrix
        with thylakoid fractions rather than a membrane location.
  - id: PMID:18322145
    title: Expression analysis of genes associated with the induction of the
