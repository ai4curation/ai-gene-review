      action: NEW
      reason: >-
        Participation test (CLAUDE.md): EPYC1 is not only necessary for the
        process; it does part of the work. It is one of the two macromolecules
        whose multivalent bonds make up the condensate (the scaffold case), as
        shown by reconstitution with purified proteins and by interface
