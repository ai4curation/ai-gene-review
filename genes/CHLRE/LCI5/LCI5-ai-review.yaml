existing_annotations:
  - term:
      id: GO:0140693
      label: molecular condensate scaffold activity
    evidence_type: IDA
    original_reference_id: PMID:30498228
    review:
      summary: EPYC1/LCI5 is a multivalent, intrinsically disordered Rubisco
        linker. Its five Rubisco-binding regions each bind the two alpha-helices
        of a Rubisco small subunit, and by bridging many holoenzymes it drives
        Rubisco to demix into the liquid pyrenoid matrix. Purified EPYC1 and
        Rubisco are necessary and sufficient for this phase separation in
        vitro, and interface mutations abolish binding, phase separation and
        pyrenoid formation in vivo.
      action: NEW
      reason: No GOA annotations exist for Q94ET8. GO:0140693 is defined as
        "binding and bringing together two or more macromolecules in contact,
        permitting those molecules to organize as a molecular condensate",
        which describes what EPYC1 does to Rubisco. The evidence is direct
        (reconstitution with purified proteins, PMID:30498228), mechanistic
        (cryo-EM of the binding interface plus mutations, PMID:33230314) and
        heterologous (condensate formation in Arabidopsis, PMID:33298923).
        Wunder et al. reject a "scaffold hypothesis" in the sense of a
        self-assembled EPYC1 lattice that Rubisco then decorates. That does not
        conflict with this GO term, which only requires bringing
        macromolecules together so that they condense. This term replaces the
        uninformative GO:0005515 protein binding and the unsupported
        GO:0043169 cation binding that were proposed in an earlier draft.
      supported_by:
        - reference_id: PMID:30498228
          supporting_text: Here we use biochemical reconstitution to demonstrate
            that Rubisco and EPYC1 are the two components necessary and
            sufficient to bring about a liquid-liquid phase separation (LLPS)
            that recapitulates the liquid-like behavior reported for the
            microalgal pyrenoid
        - reference_id: PMID:33230314
          supporting_text: Together, our data demonstrate that EPYC1’s
            Rubisco-binding regions bind to the Rubisco small subunit α-helices
            via salt-bridge interactions and a hydrophobic interface, enabling
            the condensation of Rubisco into the phase separated matrix.
        - reference_id: PMID:33230314
          supporting_text: Interface mutations disrupt binding, phase separation
            and pyrenoid formation.
        - reference_id: PMID:33298923
          supporting_text: Expression of EPYC1 in the Arabidopsis line S2Cr
            results in condensate formation.
  - term:
      id: GO:1990732
      label: pyrenoid
    evidence_type: IDA
    original_reference_id: PMID:27166422
    review:
      summary: EPYC1 was found by proteomics of isolated pyrenoids, where it is
        about as abundant as the Rubisco small subunit. Venus-tagged EPYC1
        colocalizes with Rubisco in the pyrenoid matrix, and the protein is
        itself a structural constituent of the matrix condensate.
      action: NEW
      reason: Direct localization by pyrenoid fractionation and live-cell
        fluorescence (PMID:27166422), confirmed by the spatial interactome
        (PMID:28938113), and inherent to its role in forming the matrix. This
        is the location where the protein acts. It replaces the earlier
        proposal of GO:0009535 chloroplast thylakoid membrane, which rested on
        a 2006 fractionation result (PMID:16572472). EPYC1 has no transmembrane
        segment, and the thylakoid association is best explained by thylakoid
        tubules running through the pyrenoid matrix.
      supported_by:
        - reference_id: PMID:27166422
          supporting_text: Venus-tagged EPYC1 showed clear colocalization with
            mCherry-tagged RBCS in the pyrenoid
        - reference_id: PMID:27166422
          supporting_text: Strikingly, a fourth protein, previously identified
            as a low-CO 2 –induced nuclear-encoded protein (LCI5;
            Cre10.g436550) ( 24 ), was found in the low-CO 2 pyrenoid fraction
            with comparable abundance to Rubisco
        - reference_id: PMID:28938113
          supporting_text: essential pyrenoid component 1 (EPYC1), a Rubisco
            linker protein
  - term:
      id: GO:0140694
      label: membraneless organelle assembly
    evidence_type: IMP
    original_reference_id: PMID:27166422
    review:
      summary: EPYC1 builds the pyrenoid matrix, a membraneless organelle, by
        cross-linking Rubisco. In epyc1 mutants pyrenoids are smaller, more
        numerous and less dense, and most Rubisco stays outside the pyrenoid.
        The canonical matrix is absent, though a tubule- and starch-associated
