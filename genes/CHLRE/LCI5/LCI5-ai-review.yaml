  - id: PMID:41845050
    title: Kinase KEY1 controls pyrenoid condensate size throughout the cell
      cycle by disrupting phase separation interactions.
    findings:
      - statement: KEY1 is the primary kinase of EPYC1 and targets its
          Rubisco-binding regions
        supporting_text: these results establish that KEY1 is the primary
          kinase of EPYC1 and suggest that KEY1 preferentially phosphorylates
          the Rubisco-binding regions of EPYC1
      - statement: EPYC1 phosphorylation by KEY1 disrupts Rubisco-EPYC1
          interactions and promotes condensate dissolution
        supporting_text: We show that KEY1 localizes to the condensates and
          promotes their dissolution by disrupting interactions between their
          core constituents, the CO2-fixing enzyme Rubisco and its linker
          protein EPYC1, through EPYC1 phosphorylation.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified by esearch on "EPYC1" (Nat Cell Biol
        2026); full text cached. Explains the low-CO2 phosphorylation first
        reported in PMID:16572472 as a regulatory switch on the scaffold
        activity rather than a separate signalling function.
  - id: PMID:36611062
    title: Phase-separating pyrenoid proteins form complexes in the dilute
      phase.
    findings:
      - statement: Purified EPYC1 and Rubisco form complexes in the dilute
          phase, most containing a single Rubisco
        supporting_text: The majority of these complexes contain exactly one
          Rubisco molecule.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified by esearch on "EPYC1"; full text cached.
        In vitro biophysics of the EPYC1-Rubisco system.
  - id: PMID:42601498
    title: Bottom-up reconstruction of synthetic pyrenoids provides insights
      into the mechanisms and evolution of carbon concentration by EPYC1
      proteins.
    findings:
      - statement: Extant and ancestral EPYC1 sequences condense Rubisco into
          synthetic pyrenoids whose main effect is an increased carboxylation
          rate
        supporting_text: In the following, we tested all extant and ancestral
          sequences with respect to carboxylation rate enhancement and maximum
          amount of 3-PG produced using the radioisotope assay described above.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified by esearch on "EPYC1" (Nat Plants 2026);
        full text cached. Tests EPYC1 homologues across lineages; the
        carboxylation enhancement is a property of the reconstituted
        condensate and CCM, not an activity of EPYC1 itself.
  - id: PMID:23112177
    title: Rubisco small-subunit α-helices control pyrenoid formation in
