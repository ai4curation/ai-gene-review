        supporting_text: higher plant-like helices knock out the pyrenoid,
          whereas native algal helices establish a pyrenoid
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached. Predates the identification of EPYC1;
        relevant because it defines the Rubisco-side binding site that EPYC1
        uses.
  - id: PMID:33421532
