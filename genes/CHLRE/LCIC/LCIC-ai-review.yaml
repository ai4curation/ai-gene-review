id: Q75NZ1
gene_symbol: LCIC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  LCIC (low-CO2-inducible protein C; Cre06.g307500) is a soluble chloroplast
  stromal protein of Chlamydomonas reinhardtii and the closest paralog of
  LCIB. Both belong to the LCIB/LCIC family (Pfam PF18599), whose members fold
  like beta-carbonic anhydrases. LCIC is induced when CO2 is limiting and
  associates tightly with LCIB in a high-molecular-weight complex (about 350 to
  440 kDa, roughly 1:1 LCIB:LCIC, probably hexameric). Under limiting CO2 in
  the light this complex gathers as puncta around the pyrenoid, outside the
  starch sheath, and it disperses through the stroma when CO2 is high or in the
  dark. The crystal structure of the LCIC core (residues 40-344) shows a
  beta-CA fold with one zinc ion per subunit, held by the canonical Cys-His-Cys
  triad (Cys119, His179, Cys203). The His and Arg residues that are essential
  for catalysis in active homologs are disordered. Recombinant LCIC, the
  recombinant LCIB-LCIC complex and the native complex purified from algal cells
  showed no carbonic anhydrase activity in vitro. LCIB, but not LCIC, has since
  been shown to complement carbonic anhydrase-deficient yeast and Arabidopsis
  mutants. So the catalytic contribution of LCIC is unresolved. LCIC is needed
  for LCIB to move to the pyrenoid periphery, and in an lcib mutant LCIC does
  not accumulate. The LCIB/LCIC complex is thought to recapture CO2 leaking
  from the pyrenoid as bicarbonate, or to act as a diffusion barrier. LCIC also
  interacts with the bestrophin-like proteins LCI11 and Cre16.g662600.
references:
  - id: PMID:20660228
    title: Light and low-CO2-dependent LCIB-LCIC complex localization in the
      chloroplast supports the carbon-concentrating mechanism in Chlamydomonas
      reinhardtii.
    findings:
      - statement: LCIC interacts with LCIB in yeast two-hybrid and in vivo
        supporting_text: LCIB interacts with the LCIB homologous protein LCIC
          in yeast and in vivo
      - statement: LCIB and LCIC co-localize near the pyrenoid under low CO2 in
          the light as a ~350 kDa hexameric complex
        supporting_text: LCIB and LCIC are co-localized in the vicinity of the
          pyrenoid under LC conditions in the light, forming a hexamer complex
          of approximately 350 kDa
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (Plant Cell Physiol 2010, Yamano et al.).
        Abstract-only cache. Founding paper for the LCIB-LCIC complex and its
        light/low-CO2-dependent peri-pyrenoid localization. The module cites it
        for the complex.
  - id: PMID:27911826
    title: Structural insights into the LCIB protein family reveals a new group
      of β-carbonic anhydrases.
    findings:
      - statement: Crystal structure of Chlamydomonas LCIC shows a beta-CA-like
          active-site motif
        supporting_text: We determined the crystal structures of LCIB and
          limiting CO2-inducible C protein (LCIC) from C. reinhardtii and a
          CA-functional homolog from Phaeodactylum tricornutum, all of which
          harbor motifs bearing close resemblance to the active site of
          canonical β-CAs
      - statement: Only some LCIB-family homologs are active carbonic anhydrases
        supporting_text: Three of the six homologs are functional carbonic
          anhydrases (CAs)
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (PNAS 2016, Jin et al.; PDB 5B5X is the
        LCIC structure). The cached copy is abstract-only. I read the PMC full
        text (PMC5187666) during this review. It states that CsLCIB, CrLCIB,
        CrLCIC, the recombinant CrLCIB-LCIC complex and the native CrLCIB-LCIC
        complex "were inactive under all conditions tested" in Wilbur-Anderson
        assays. It attributes this to disordering of His161 and Arg193 in LCIC
        (His162 and Arg194 in LCIB). The three active homologs are PtLCIB3,
        PtLCIB4 and FjLCIB, none from Chlamydomonas. The paper therefore does NOT show CA
        activity for Chlamydomonas LCIC. The module statement "several
        LCIB-family homologs are functional CAs" is accurate but does not apply
        to LCIC. The negative result is quoted below from secondary sources
        whose cached full text restates it (PMID:28938113, PMID:34791500).
  - id: PMID:28938113
    title: A Spatial Interactome Reveals the Protein Organization of the Algal
      CO(2)-Concentrating Mechanism.
    findings:
      - statement: LCIC-mCherry co-localizes with LCIB in puncta at the pyrenoid
          periphery
        supporting_text: LCIB and LCIC were co-localized (Figure 4D)
      - statement: LCIB and LCIC form punctate outer layer around the pyrenoid
        supporting_text: 1) LCIB and LCIC localize to puncta around the
          periphery
      - statement: LCIC puncta lie outside the starch sheath (STA2 plates lie
          inside the LCIC perimeter)
        supporting_text: STA2 was localized within the perimeter described by
          LCIC
      - statement: LCIB and LCIC are stromal soluble proteins in a tight
          complex
        supporting_text: Our data confirm that LCIB and LCIC, known stromal
          soluble proteins, are in a tight complex
      - statement: Recombinant LCIB/C lacked carbonic anhydrase activity
        supporting_text: However, recombinant LCIB/C had no carbonic anhydrase
          function
      - statement: LCIC interacts with bestrophin-like proteins LCI11 and
          Cre16.g662600
        supporting_text: Both LCIB and LCIC interact with LCI11 (Cre16.g663450),
          and LCIC also interacts with Cre16.g662600
      - statement: Two competing models of LCIB/C function
        supporting_text: This complex is hypothesized to either form a CO2
          leakage barrier at the pyrenoid periphery or to act as a vectorial
          CO2 to HCO3− conversion module to recapture CO2 that escapes from the
          pyrenoid
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (Cell 2017, Mackinder et al.). Full text
        cached. Direct LCIC-mCherry localization and affinity-purification/MS
        interaction data for LCIC. Restates the Jin et al. 2016 negative CA
        result.
  - id: PMID:34791500
    title: CO2-dependent migration and relocation of LCIB, a pyrenoid-peripheral
      protein in Chlamydomonas reinhardtii.
    findings:
      - statement: LCIC is required for LCIB to migrate to the pyrenoid
          periphery
        supporting_text: LCIB migration to around the pyrenoid required the
          accumulation of LCIC in the Chlamydomonas chloroplast
      - statement: LCIC protein is absent in the lcib mutant
        supporting_text: This is consistent with the results that the
          accumulation of LCIC was also missing in the lcib mutant
      - statement: Recombinant and native LCIB/LCIC proteins lack CA activity
        supporting_text: Recombinant LCIB, LCIC, LCIB-LCIC complex, and native
          LCIB-LCIC complex do not have CA activity (Jin et al., 2016)
      - statement: The LCIB and LCIC structures have a zinc-coordinating beta-CA
          active site
        supporting_text: the crystalline structures of these proteins resemble
          that of β-type carbonic anhydrase (CA), which possesses an active CA
          site that coordinates with a zinc ion
      - statement: Possible regulation of CA activity by LCIB/LCIC association
        supporting_text: it cannot yet be ruled out the possibility that the
          putative CA activity is regulated by the complex formation and
          dissociation of LCIB and LCIC in response to CO2 concentration
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (Plant Physiol 2022, Yamano et al.). Full
        text cached. Shows that co-expressing LCIC is enough to drive LCIB into
        peri-pyrenoid speckles in a ccm1 background.
  - id: PMID:36856938
    title: 'LCIB functions as a carbonic anhydrase: evidence from yeast and
      Arabidopsis carbonic anhydrase knockout mutants.'
    findings:
      - statement: CA activity of LCIB/LCIC had not been demonstrated before
          2023
        supporting_text: Although both LCIB and LCIC are structurally similar to
          βCAs, their CA activity has not been demonstrated to date
      - statement: LCIB (not LCIC) complements CA-deficient yeast and
          Arabidopsis
        supporting_text: We provide evidence that LCIB is an active CA using a
          Saccharomyces cerevisiae CA knockout mutant
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified (Photosynth Res 2023, Kasili et al.).
        Abstract-only. The evidence for CA activity concerns LCIB alone.
        Nothing in the abstract tests LCIC, so this paper does not establish
        CA activity for LCIC.
  - id: PMID:24307449
    title: LCIB in the Chlamydomonas CO2-concentrating mechanism.
    findings:
      - statement: The precise function of LCIB in the CCM is undefined
        supporting_text: its exact function in the CCM has not been clearly
          defined
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Review focused on LCIB. Background only for LCIC.
  - id: PMID:15235119
    title: Expression profiling-based identification of CO2-responsive genes
      regulated by CCM1 controlling a carbon-concentrating mechanism in
      Chlamydomonas reinhardtii.
    findings:
      - statement: Genome-wide screen identifying CCM1-dependent low-CO2
          inducible genes (the source of the LciC cDNA, AB168094)
        supporting_text: 51 low-CO2 inducible genes
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: PubMed-verified. UniProt cites it for the LciC nucleotide
        sequence. The abstract names only LciA and LciB, so it is background
        for LCIC's low-CO2/CCM1-dependent induction.
