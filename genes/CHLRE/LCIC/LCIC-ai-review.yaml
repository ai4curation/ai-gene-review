    review:
      summary: LCIC is a soluble chloroplast stromal protein. LCIC-mCherry forms
        puncta at the pyrenoid periphery that co-localize with LCIB and lie
        outside the starch sheath. GOA currently has no annotations for LCIC.
      action: NEW
      reason: Direct localization of tagged LCIC (Mackinder et al. 2017)
        together with the earlier co-localization of LCIB and LCIC near the
        pyrenoid (Yamano et al. 2010) supports chloroplast stroma. The puncta
        sit outside the STA2 starch plates, so the protein is stromal at the
        pyrenoid periphery and not inside the pyrenoid matrix. I therefore do
        not propose GO:1990732 pyrenoid. This is the location the module gives
        for the LCIB/LCIC annoton.
