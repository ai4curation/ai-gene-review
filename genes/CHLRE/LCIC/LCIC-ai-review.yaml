    review:
      summary: The 2.51 A crystal structure of LCIC (PDB 5B5X, residues 40-344)
        shows one Zn2+ per subunit. It is coordinated by Cys119, His179 and
        Cys203, the canonical beta-CA zinc ligands.
      action: NEW
      reason: The structure directly shows zinc bound to LCIC (UniProt BINDING
