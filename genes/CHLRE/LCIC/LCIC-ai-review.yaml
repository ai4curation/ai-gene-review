proposed_new_terms:
  - proposed_name: LCIB-LCIC complex
    proposed_definition: A chloroplast stromal protein complex of the
      beta-carbonic-anhydrase-like proteins LCIB and LCIC, about 350 to 440 kDa
      and probably hexameric. Under limiting CO2 it relocates to the periphery
      of the pyrenoid. Found in green algae with a pyrenoid-based
      CO2-concentrating mechanism.
    justification: The complex is well established by Y2H, co-IP, gel
      filtration, co-expression and affinity-purification/MS. There is no GO
      complex term for it, so LCIC can only be placed in the generic
      GO:0032991.
    proposed_parent:
      id: GO:0032991
      label: protein-containing complex
    supported_by:
      - reference_id: PMID:20660228
        supporting_text: LCIB and LCIC are co-localized in the vicinity of the
          pyrenoid under LC conditions in the light, forming a hexamer complex
          of approximately 350 kDa
suggested_questions:
  - question: Is LCIC a catalytic or a regulatory/structural subunit of the
      LCIB/LCIC complex? Should the module's carbonate dehydratase activity
      (GO:0004089) be asserted for LCIB alone, with LCIC recorded only as a
      complex member, until LCIC-containing complexes are shown to be active?
    experts:
      - Fukuzawa H
      - Yamano T
      - Mueller-Cajar O
  - question: Does phosphorylation at LCIC Ser160, next to the disordered
      active-site His161, switch the complex between inactive and active
      states?
  - question: What is the functional significance of the LCIC interaction with
      the bestrophin-like proteins LCI11 and Cre16.g662600? Is the LCIB/LCIC
      complex positioned next to the thylakoid bicarbonate channels?
    experts:
      - Mackinder LCM
suggested_experiments:
  - hypothesis: LCIC contributes catalytic carbonic anhydrase activity to the
      LCIB/LCIC complex under the right conditions.
    description: Test LCIC alone and LCIB+LCIC co-expression for complementation
      of the yeast nce103 and Arabidopsis beta-ca5 mutants, as already done for
      LCIB. Include zinc-ligand (C119A/H179A/C203A) LCIC variants, and measure
      CA activity of native complex purified from very-low-CO2 cells under
      reducing and phosphorylation-preserving conditions.
    experiment_type: genetic complementation and enzyme assay
  - hypothesis: LCIC is required for CCM function independently of its role in
      stabilizing and relocating LCIB.
    description: Generate an lcic null mutant (CRISPR or CLiP insertion) and
      measure growth at air and very low CO2, photosynthetic Ci affinity, and
      LCIB abundance and localization. Then complement with wild-type or
      zinc-site-mutant LCIC.
    experiment_type: mutant phenotyping and complementation
