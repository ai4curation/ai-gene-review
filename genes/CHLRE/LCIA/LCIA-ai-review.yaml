suggested_questions:
  - question: Does LCIA conduct bicarbonate by passive channel-type permeation
      (GO:0160133 bicarbonate channel activity), as the FNT fold and the 2026
      structure suggest, and if so how is net import into the stroma driven
      against a stromal pool that is kept alkaline in the light?
  - question: Which envelope membrane does native LCIA occupy in Chlamydomonas?
      The inner envelope is expected and was reported for transgenic tobacco,
      but has not been shown in the alga.
  - question: Is nitrite transport by LCIA (seen in oocytes) physiologically
      relevant, given that LCIA is regulated by CO2 and not by nitrogen?
  - question: How does loss of LCIA lower HLA3 mRNA, and is this retrograde
      signal linked to the CAS-dependent Ca2+ signal from the pyrenoid?
suggested_experiments:
  - hypothesis: LCIA is a passive bicarbonate channel rather than an active
      transporter.
    description: Reconstitute purified LciA in proteoliposomes or planar
      bilayers and measure HCO3- flux and single-channel currents, testing
      dependence on membrane potential and pH gradient, and the effect of the
      selectivity-filter mutants (K220, A117, V267) and the activity-enhancing
      K136A/A114F variant.
    experiment_type: biophysics / electrophysiology
  - hypothesis: The activity-enhanced LciA variants improve the
      CO2-concentrating mechanism in vivo.
    description: Express K136A/A114F LciA in an lcia insertion mutant (and in
      an lcia lcib background) and measure Ci affinity at pH 9, internal Ci
      pool size and growth at very low CO2.
    experiment_type: genetic complementation and physiology
  - hypothesis: Native LCIA resides in the inner chloroplast envelope.
    description: Separate inner and outer envelope membranes from low-CO2
      Chlamydomonas and immunoblot for LCIA alongside inner (e.g. TIC) and
      outer (e.g. TOC) envelope markers, or use immunogold electron
      microscopy.
    experiment_type: cell fractionation and imaging
