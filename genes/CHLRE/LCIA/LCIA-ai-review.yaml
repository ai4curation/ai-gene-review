    review:
      summary: Propagated from bacterial FNT channels (E. coli FocA, NirC, FocB),
        which sit in the bacterial plasma membrane. LCIA has an N-terminal
        chloroplast transit peptide and is found in the chloroplast envelope by
        immunofluorescence, envelope membrane fractionation and fluorescent
        fusions in Chlamydomonas, tobacco and Arabidopsis. It is not at the
        plasma membrane of the alga; plasma membrane bicarbonate uptake is done
        by HLA3.
      action: MODIFY
      reason: The membrane-channel nature inherited from the bacterial ancestor is
        correct, but the location does not transfer to this eukaryotic member.
        Target-specific evidence (a transit peptide that is needed for envelope
        targeting, and direct localization) places LCIA in the chloroplast
        envelope. Replace with GO:0009941 chloroplast envelope. The plasma
        membrane signal seen in Xenopus oocytes (PMID:26538195) used mature
        LCIA lacking its transit peptide and is an artefact of the heterologous
        assay.
