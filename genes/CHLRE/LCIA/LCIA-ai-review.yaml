product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:3055
  label: Chlamydomonas reinhardtii
description: >-
  LCIA (Low-CO2-inducible protein A, also called NAR1.2; locus Cre06.g309000)
  is a nuclear-encoded member of the formate/nitrite transporter (FNT) family
  of anion channels in the green alga Chlamydomonas reinhardtii. The 336-residue
  protein carries an N-terminal chloroplast transit peptide followed by an
  FNT-type transmembrane domain, and it resides in the chloroplast envelope,
  as shown by immunofluorescence, envelope membrane fractionation and
  fluorescent-protein fusions. Its cryo-EM structure shows the pentameric FNT
  channel fold with a selectivity filter in which Lys220, together with Ala117
  and Val267, sets preference for bicarbonate. LCIA moves bicarbonate across
  membranes: it increases bicarbonate uptake and gives HCO3- and NO2- currents
  in Xenopus oocytes, and it restores growth in air of an Escherichia coli
  mutant lacking carbonic anhydrases and of an Arabidopsis mutant lacking the
  plastid carbonic anhydrase betaCA5. Unlike its nitrogen-regulated NAR1
  paralogs, LCIA is induced strongly at low CO2 under the control of the
  regulator CIA5/CCM1, and its accumulation also depends on the
  chloroplast Ca2+-binding protein CAS. In the algal CO2-concentrating
  mechanism it imports cytosolic bicarbonate into the chloroplast stroma,
  acting together with the plasma membrane ABC transporter HLA3. Insertion
  mutants have reduced inorganic carbon affinity, especially at alkaline pH
  where bicarbonate dominates; loss of both LCIA and LCIB prevents survival
  at very low CO2; and co-overexpression of LCIA with HLA3 raises inorganic
  carbon affinity. Loss of LCIA also lowers HLA3 mRNA levels.
