      summary: Propagated from the E. coli formate channels FocA and FocB. No
        study reports formate transport by LCIA. Its tested substrates are
        bicarbonate (Xenopus oocyte currents and 14C uptake, complementation of
        carbonic anhydrase-deficient E. coli and Arabidopsis) and nitrite
