    - &id002
      reference_id: PMID:33850044
      supporting_text: Moreover, the mutant strains L. monocytogenes 10403S ΔeutB, lacking ethanolamine
        ammonia lyase, and Δndh2, lacking EET-linked NADH dehydrogenase, are both impaired for EA
        utilization
