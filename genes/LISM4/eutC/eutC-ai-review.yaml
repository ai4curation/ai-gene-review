- term:
    id: GO:0046336
    label: ethanolamine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000033396
  - UniPathway:UPA00560
  review:
    summary: The EutBC subunit performs the initial chemistry of ethanolamine breakdown.
    action: ACCEPT
    reason: EutC supports the cobalamin-containing catalytic complex that cleaves ethanolamine, providing
      a direct molecular contribution to the catabolic step. Its role follows from EutC-specific
      architecture and ortholog structural evidence; the 10403S eutB mutant independently confirms
      operation of the pathway but is not an eutC-specific assay. No shell-assembly or host-pathogenesis
      process is inferred from this evidence.
