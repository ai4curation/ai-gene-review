status: COMPLETE
taxon:
  id: NCBITaxon:393133
  label: Listeria monocytogenes 10403S
description: EutC is the small subunit of the adenosylcobalamin-dependent ethanolamine ammonia-lyase
  complex in Listeria monocytogenes 10403S. Its conserved role is to support the intersubunit cobalamin-binding
  architecture of EutBC, which converts ethanolamine to acetaldehyde and ammonium. The catalytic
  barrel is supplied by EutB. Microcompartment recruitment is inferred from the EutC family and the
  predicted encapsulation peptide of the EGDe ortholog; individual localization and purified-complex
  biochemistry have not been established for 10403S EutC.
