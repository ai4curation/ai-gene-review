  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007441
  review:
    summary: Conserved EutH transporter function is consistent with the native acid-vacuole phenotype.
    action: ACCEPT
    reason: EutH-specific family membership and curated similarity to Salmonella EutH support ethanolamine
      transport. Native 10403S mutant VK01 is attenuated early in macrophages, and neutralization
      removes the defect, consistent with conditional uptake under acidic conditions. The experiment
      does not directly measure ethanolamine flux, and no proton symport, protonated versus uncharged
      cargo preference, or universal growth requirement is asserted. The UniProt protonated-cargo
      wording and the historical uncharged-diffusion model remain mechanistically unresolved.
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:29531136
      supporting_text: neutralization of the vacuole abolished the requirement for EutH.
    - &id003
      reference_id: file:LISM4/eutH/eutH-source-analysis.md
      supporting_text: WT (10403S) and ΔeutH (VK01)
- term:
    id: GO:0034229
    label: ethanolamine transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007441
  review:
    summary: EutH contributes the membrane-translocation step of ethanolamine transport.
    action: ACCEPT
    reason: The transporter itself performs substrate transfer across the bacterial membrane, so
      the process is supported by its conserved molecular role, not merely by a survival defect.
      The native phenotype is environmental context for that role. These experiments do not establish
      direct catalysis of ethanolamine degradation, phagosome escape, macrophage entry or a separate
      host-pathogenesis activity.
    supported_by:
    - *id001
    - *id002
    - *id003
