  label: Listeria monocytogenes 10403S
description: 'EutH is an integral membrane ethanolamine transporter of Listeria monocytogenes 10403S.
  It supports survival during early residence in acidic macrophage vacuoles: a native eutH deletion
  is attenuated early after infection, and vacuole neutralization removes that difference. Conserved
  EutH-family function supports ethanolamine uptake, but direct uptake kinetics, the transported
  protonation state and any coupling ion have not been determined for this protein. Its contribution
  is conditional on the environment rather than a universal requirement for bacterial growth.'
