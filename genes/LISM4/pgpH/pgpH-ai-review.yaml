  label: Listeria monocytogenes 10403S
description: PgpH is a membrane-associated HD-domain c-di-AMP phosphodiesterase in Listeria monocytogenes.
  Its cytoplasmic catalytic domain binds and hydrolyzes c-di-AMP to pApA using a metal-dependent active
  site. PgpH and the unrelated phosphodiesterase PdeA jointly control intracellular messenger abundance,
  with different contributions during broth growth and host infection. ppGpp inhibits PgpH hydrolysis
  in vitro, linking its activity to stringent-response signaling.
