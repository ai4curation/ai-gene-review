    summary: Ethanolamine-compartment localization is supported as a conditional ortholog inference.
    action: ACCEPT
    reason: The Eut-family rule, EGDe ethanolamine-associated BMC observations and predicted EutC
      encapsulation peptide support localization of the active EutBC machinery in an ethanolamine
      compartment when the pathway is induced. This is inferred for 10403S, whose individual subunit
