  review:
    summary: InterPro assignment places an amino-alcohol enzyme in amino acid metabolism.
    action: REMOVE
    reason: Current GO:0006520 concerns carboxylic acids containing amino groups. Ethanolamine is
      an amino alcohol without a carboxyl group; the demonstrated pathway releases acetaldehyde and
      ammonium. No separate amino-acid reaction supports this InterPro mapping. The correct ethanolamine
      catabolic process is already present; this is a chemical-scope correction, not deduplication.
    supported_by:
    - *id001
    - *id002
