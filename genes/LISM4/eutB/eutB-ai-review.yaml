  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002217395
  review:
    summary: TreeGrafter cytosol assignment is compatible with soluble intracellular EutBC.
    action: ACCEPT
    reason: EutB is a soluble intracellular enzyme subunit, with conditional packaging into a protein
      microcompartment rather than secretion or an integral membrane role. This broad cytosolic annotation
      is compatible with that organization; it does not establish that active EutBC is outside the
      shell. The proximate TreeGrafter node is PTN002217395, not an experimentally assayed donor.
      Family architecture and native pathway evidence support the location without asserting a new
      phylogenetic loss.
    supported_by:
    - &id001
      reference_id: file:LISM4/eutB/eutB-uniprot.txt
      supporting_text: Belongs to the EutB family.
      record_section:
      - CC:SIMILARITY
    - &id002
      reference_id: PMID:33850044
      supporting_text: Moreover, the mutant strains L. monocytogenes 10403S ΔeutB, lacking ethanolamine
        ammonia lyase, and Δndh2, lacking EET-linked NADH dehydrogenase, are both impaired for EA
        utilization
- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
