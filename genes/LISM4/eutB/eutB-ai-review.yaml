  review:
    summary: The EutBC subunit performs the initial chemistry of ethanolamine breakdown.
    action: ACCEPT
    reason: EutB catalyses the ethanolamine-cleaving step in the holoenzyme; the 10403S deletion
      impairs ethanolamine utilization under anaerobic B12-supplemented conditions. Catalytic family
