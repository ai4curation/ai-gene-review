id: A0A0H3GBB1
gene_symbol: eutB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:393133
  label: Listeria monocytogenes 10403S
description: EutB is the catalytic large subunit of the adenosylcobalamin-dependent ethanolamine
  ammonia-lyase complex in Listeria monocytogenes 10403S. Together with the small subunit EutC, it
  converts ethanolamine to acetaldehyde and ammonium. Loss of eutB impairs anaerobic ethanolamine
  utilization by 10403S in vitamin B12-supplemented defined medium. Ethanolamine microcompartment
  association is inferred from the conserved Eut machinery and observations in strain EGDe; the native
  10403S protein has not been localized individually.
