id: A0A6I8W8A2
gene_symbol: LOC117183218
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:46245
  label: Drosophila pseudoobscura pseudoobscura
description: >-
  Uncharacterized short RCC1-repeat protein encoded by LOC117183218 on the X
  chromosome of Drosophila pseudoobscura. This entry is RefSeq isoform X3
  (XP_033239512.1, 169 aa); the gene's longest product is isoform X1
  (A0A6I8W805, 282 aa), and residues 6-169 of X3 are identical to residues
  119-282 of X1, so X3 differs only by an alternative five-residue N-terminus
  and the absence of the first 118 residues of X1. X3 carries two RCC1 repeats
  that fold as part of an RCC1-like beta-propeller. No product of the gene has a
  HECT domain or any other catalytic module. The RefSeq name "probable E3
  ubiquitin-protein ligase HERC3" reflects similarity of the RCC1 repeats only.
  The sequence is most similar (about 76-79% identity over ~215 residues) to the
  N-terminal RCC1-like domain of D. pseudoobscura Herc4, and less similar to
  D. melanogaster Herc4. Together with a paralogous RCC1-only gene
  (LOC6903915), this suggests the gene arose by partial duplication of the
  Herc4 RCC1-like domain within the obscura lineage; NCBI lists no orthologs.
  No molecular function, interaction partner, localization or expression has
  been reported. RCC1-like propellers commonly act as protein-binding or
  small-GTPase-regulatory platforms, but neither role has been tested for this
  protein.
existing_annotations: []
core_functions:
- description: >-
    No molecular function is established. The product is an isolated
    RCC1-repeat (RCC1-like beta-propeller) segment that lacks the HECT
    ubiquitin-ligase domain of Herc4, the HECT-containing protein from which it
    appears to derive. Ubiquitin-protein ligase activity, ERAD and other
    HERC3/HERC4 functions therefore cannot be transferred. Whether the protein
    binds the substrates or partners of the Herc4 RCC1-like domain, or acts as a
    competitor of Herc4, is unknown.
  supported_by:
  - reference_id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-uniprot.txt
    record_section: ["FT:REPEAT"]
    supporting_text: 'FT   REPEAT          88..142'
  - reference_id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-bioinformatics/RESULTS.md
    supporting_text: >-
      No product of the gene has a HECT domain (the longest
      is 282 aa; a HECT domain alone is ~350 aa).
  - reference_id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-bioinformatics/RESULTS.md
    supporting_text: >-
      Higher identity to D. pseudoobscura Herc4 than to D. melanogaster Herc4
      indicates that LOC117183218 (and LOC6903915) arose by partial duplication of
      the Herc4 RCC1-like-domain region within the obscura lineage.
  knowledge_gaps:
  - gap_statement: >-
      It is unknown whether LOC117183218 isoform X3 (or any product of the
      gene) is translated, and if so in which tissues.
    boundary: >-
      The gene model is supported by RefSeq transcript annotation only
      (protein existence level 4, predicted); no expression or proteomic data
      are cited.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Whether the isolated RCC1-like segment binds any protein, including
      substrates or partners of the Herc4 RCC1-like domain, is unknown.
    boundary: >-
      The domain architecture (RCC1 repeats only, no HECT) is established from
      InterPro/Pfam/PROSITE matches and sequence comparison with the gene's
      other isoforms.
    gap_kind:
    - BIOLOGY
