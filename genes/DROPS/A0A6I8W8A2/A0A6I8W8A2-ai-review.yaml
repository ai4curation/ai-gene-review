  reference_review:
    relevance: NONE
    correctness: UNVERIFIED
    review_notes: >-
      Retained from the earlier review for provenance only. This re-review was
      done independently of the ProtNLM2 predictions, did not consult this file,
      and does not use it as support.
suggested_questions:
- question: >-
    Is LOC117183218 a lineage-specific partial duplicate of the Herc4
    RCC1-like domain in the obscura group, and is it present in close relatives
    such as D. persimilis and D. miranda?
- question: >-
    Is any LOC117183218 isoform translated, and is the X3 alternative
    N-terminus (MSPLI) supported by transcript evidence?
- question: >-
    Should PANTHER place all isoforms of this gene in one family? Isoform X2
    (A0A6I8W807) is assigned to PTHR22870:SF408 while X1, X3 and X4 are in
    PTHR22872 without a subfamily.
suggested_experiments:
- description: >-
    RNA-seq and ribosome-profiling or proteomic analysis of D. pseudoobscura
    tissues to test whether LOC117183218 isoforms are transcribed and
    translated.
  hypothesis: >-
    LOC117183218 is expressed as an RCC1-only protein rather than being a
    non-coding or untranslated duplicate.
- description: >-
    Phylogenetic analysis of Herc4 RCC1-like domains together with
    LOC117183218 and LOC6903915 across Drosophila species, combined with
    synteny, to date the duplication.
  hypothesis: >-
    LOC117183218 arose from partial duplication of Herc4 within the obscura
    lineage.
- description: >-
    Co-immunoprecipitation of tagged LOC117183218 isoforms from fly cells,
    followed by mass spectrometry, compared with the Herc4 RCC1-like domain.
  hypothesis: >-
    The RCC1-only product binds partners of the Herc4 RCC1-like domain and
    could compete with Herc4.
