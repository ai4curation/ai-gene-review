- id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-bioinformatics/RESULTS.md
  title: Identity and relative analysis for A0A6I8W8A2 (LOC117183218)
  findings:
  - statement: >-
      A0A6I8W8A2 is isoform X3 of LOC117183218; residues 6-169 are identical to
      residues 119-282 of isoform X1 (A0A6I8W805). No product of the gene has a
      HECT domain.
  - statement: >-
      The closest relatives are the D. pseudoobscura RCC1-only paralog
      LOC6903915 and the N-terminal RCC1-like domain of D. pseudoobscura Herc4
      (PTHR45622:SF76), consistent with a lineage-specific partial duplication
      of Herc4.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible analysis written for this re-review (compare_sequences.py,
      UniProt REST queries); conclusions about duplication origin rest on
      pairwise identity, not a tree.
- id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-deep-research-falcon.md
  title: Falcon deep research on HERC3 orthologs
  findings:
  - statement: >-
      Comprehensive review of mammalian HERC3 function as an E3 ubiquitin-protein
      ligase with RLD-mediated substrate recognition and HECT-domain catalytic
      activity; the catalytic function requires the HECT domain which is absent
      from this truncated isoform
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      The report treats LOC117183218 as a HERC3 ortholog with a HECT domain and
      transfers mammalian HERC3 functions (ERAD, MM1/EIF5A2 ubiquitination) to
      it. Sequence comparison shows the gene is an RCC1-only product most
      similar to Herc4, not HERC3, and has no HECT domain, so these transfers
      do not apply. Retained as background on HERC proteins only; no longer
      used as support in this review.
- id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-protnlm-predictions-review.yaml
  title: ProtNLM2 predictions review for A0A6I8W8A2
  findings:
  - statement: >-
      ProtNLM2 prediction of GO:0016874 (ligase activity) assessed as NPI
      (incorrect) because this truncated isoform lacks the HECT domain
