    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Top-ranked hit (score 8.94, the second-lowest top-1 score of the 50 queries). Fucose
        binding is a lectin activity with no relationship to RCC1 beta-propeller repeats or
        to HERC-family biology. It is recorded as uncertain rather than incorrect because at
        this score the retrieval carries no information - the model is effectively abstaining
        and the ranked list is an artefact of always returning k results.
      supported_by:
