          supporting_text: PANTHER; PTHR22872; BTK-BINDING PROTEIN-RELATED; 1.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0017154
      label: semaphorin receptor activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Rank 2 (score 8.86). Semaphorin receptors are plexins - large transmembrane proteins
        with sema domains. This 169-aa cytoplasmic fragment has no transmembrane segment, no
        sema domain and no signal peptide. The only shared feature is the seven-bladed
        beta-propeller architecture common to RCC1 repeats and sema domains, a fold-level
        coincidence rather than a functional relationship.
      supported_by:
        - reference_id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-uniprot.txt
          supporting_text: PANTHER; PTHR22872; BTK-BINDING PROTEIN-RELATED; 1.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0019783
      label: ubiquitin-like protein peptidase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PSEUDOENZYME_OVERANNOTATION
      summary: >-
        Rank 3 (score 8.75). This is the one hit in the list that touches the protein's
        nominal family, and it gets the direction backwards: HERC proteins ligate
        ubiquitin, they do not cleave it, and in any case this isoform lacks the HECT domain
        that would be needed for either. Assigning any ubiquitin-cycle catalytic activity to
        a domain-truncated fragment is exactly the pseudoenzyme trap, made worse by the
        fragment likely being a computational splice artefact rather than a real gene product.
      supported_by:
        - reference_id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-uniprot.txt
          supporting_text: PANTHER; PTHR22872; BTK-BINDING PROTEIN-RELATED; 1.
