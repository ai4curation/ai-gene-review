taxon:
  id: NCBITaxon:46245
  label: Drosophila pseudoobscura pseudoobscura
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a 169-aa RefSeq-predicted HERC3 isoform that
  retains two RCC1 repeats and lacks the HECT catalytic domain entirely. Every score in
  the top five is between 8.2 and 8.9 - the lowest band in the benchmark, alongside the
  Abrus J-domain protein - and the hits are unrelated to each other and to the sequence:
  fucose binding, semaphorin receptor activity, a deubiquitinase activity, radial spoke
  head, nuclear pore structural constituent. The free-text Function channel scores just
  as low but is more coherent, returning RCC1/RanGEF descriptions that at least match the
  repeats present. This protein is the benchmark's clearest demonstration that ProTrek's
  score behaves as a usable abstention signal: read without scores, the output looks like
  five annotations; read with them, it is correctly identifiable as no answer. ProtNLM2
  predicted ligase activity here, which is wrong in a more interesting way - it inherits
  the HERC3 name for a fragment that cannot ligate.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
