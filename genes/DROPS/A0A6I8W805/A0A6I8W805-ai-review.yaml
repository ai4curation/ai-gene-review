id: A0A6I8W805
gene_symbol: LOC117183218
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:46245
  label: Drosophila pseudoobscura pseudoobscura
description: >-
  Uncharacterized RCC1-repeat protein encoded by LOC117183218 on the X
  chromosome of Drosophila pseudoobscura. This entry is RefSeq isoform X1
  (XP_033239510.1, 282 aa), the longest of the gene's four predicted products;
  the shorter isoforms X2-X4 share its C-terminal RCC1 region. The protein
  consists of a short N-terminal segment (residues 1-49, partly disordered) that
  has no counterpart in related proteins, followed by three RCC1 repeats
  (residues 50-255). Residues 50-270 are 76% identical to the first ~227
  residues of D. pseudoobscura Herc4 and 63% identical to the corresponding
  region of D. melanogaster Herc4, covering roughly the first four blades of
  the seven-bladed RCC1-like domain of those HECT E3 ubiquitin ligases. The
  protein has no HECT domain or other catalytic module, so the RefSeq name
  "probable E3 ubiquitin-protein ligase HERC4" reflects repeat similarity only.
  Its closest relative is a second RCC1-only D. pseudoobscura gene,
  LOC6903915 (91% identity), and no counterpart is found in D. melanogaster,
  suggesting that the gene arose by partial duplication of the Herc4
  RCC1-like domain in the obscura lineage. The predicted structure is of low
  confidence, consistent with an incomplete propeller. No expression,
  localization, interaction partner or molecular function has been reported.
existing_annotations: []
core_functions:
- description: >-
    No molecular function is established. The protein is a partial RCC1-like
    domain (three RCC1 repeats, about half of a seven-bladed propeller) related
    to the N-terminal domain of Herc4 but lacking the HECT ubiquitin-ligase
    domain. Herc4 sits in a different PANTHER family (PTHR45622:SF76) from this
    gene (PTHR22872, no subfamily), and its E3 ligase activity depends on the
    HECT domain, so ubiquitin-protein ligase activity, protein ubiquitination
    and Hedgehog-pathway regulation are not transferred. The Herc4 RCC1-like
    domain alone binds Smoothened in co-immunoprecipitation assays, but whether
    this half-propeller fragment binds Smoothened or any other protein has not
    been tested.
  supported_by:
  - reference_id: file:DROPS/A0A6I8W805/A0A6I8W805-uniprot.txt
    record_section: ["FT:REPEAT"]
    supporting_text: 'FT   REPEAT          201..255'
  - reference_id: file:DROPS/A0A6I8W805/A0A6I8W805-bioinformatics/RESULTS.md
    supporting_text: >-
      X1 therefore carries only about half of a seven-bladed RCC1-like propeller.
  - reference_id: file:DROPS/A0A6I8W805/A0A6I8W805-bioinformatics/RESULTS.md
    supporting_text: >-
      The HECT-dependent E3 ligase activity of Herc4 cannot be
      transferred.
  - reference_id: PMID:30925584
    supporting_text: >-
      Through co-IP experiments, we found either RCC repeat domain or the HECT
      domain is sufficient to mediate its binding to Smo (Figure 2C–D).
  knowledge_gaps:
  - gap_statement: >-
      It is unknown whether LOC117183218 isoform X1 is transcribed and
      translated, and if so in which tissues or developmental stages.
    boundary: >-
      The gene model rests on RefSeq genome annotation only (protein existence
      level 4, predicted); no expression or proteomic data are available.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Whether the partial RCC1-like domain folds stably and binds any protein,
      including Smoothened or other partners of the Herc4 RCC1-like domain, is
      unknown.
    boundary: >-
      Domain architecture is established from InterPro/Pfam/PROSITE matches
      and alignment to Herc4; the only structural information is a
      low-confidence AlphaFold prediction.
    gap_kind:
    - BIOLOGY
