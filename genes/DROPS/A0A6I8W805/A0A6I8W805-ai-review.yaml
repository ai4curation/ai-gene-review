- id: file:DROPS/A0A6I8W805/A0A6I8W805-bioinformatics/RESULTS.md
  title: Mapping of LOC117183218 isoform X1 onto Herc4
  findings:
  - statement: >-
      X1 residues 50-270 align to the first ~227 residues of D. pseudoobscura
      Herc4 (76%) and D. melanogaster Herc4 (63%), covering about four of the
      seven Herc4 RCC1 repeats; the closest relative is LOC6903915 (91%). No
      HECT domain. AlphaFold mean pLDDT 58.8.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible analysis written for this review (map_to_herc4.py, UniProt
      REST and AlphaFold DB API). The duplication inference rests on pairwise
      identity, not on a phylogenetic tree.
- id: file:DROPS/A0A6I8W8A2/A0A6I8W8A2-bioinformatics/RESULTS.md
  title: Identity and relative analysis for A0A6I8W8A2 (LOC117183218)
  findings:
  - statement: >-
      Lists the four products of LOC117183218 (X1 A0A6I8W805, X2 A0A6I8W807,
      X3 A0A6I8W8A2, X4 A0A6I8W815) and shows that X2 is placed in
      PTHR22870:SF408 while the others are in PTHR22872 without a subfamily.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Isoform analysis for the same gene, run against live UniProt data.
- id: PMID:30925584
  title: E3 ligase Herc4 regulates Hedgehog signalling through promoting Smoothened
    degradation.
  findings:
  - statement: >-
      D. melanogaster Herc4 is a HECT E3 ligase that binds and ubiquitinates
      Smoothened; its RCC1-like domain and its HECT domain can each bind Smo.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Experimental characterisation of the closest characterised relative
      (Herc4, FBgn0035207). Used only to frame the untested question of whether
      the RCC1-only fragment binds Smo; no function is transferred from it.
suggested_questions:
- question: >-
    Is LOC117183218 conserved in other obscura-group species (D. persimilis,
    D. miranda), and does a phylogeny of Herc4 RCC1-like domains place it and
    LOC6903915 as a lineage-specific duplicate of Herc4?
- question: >-
    Should PANTHER assign all products of LOC117183218 to one family? Isoform
    X2 (A0A6I8W807) is in PTHR22870:SF408 while X1, X3 and X4 are in PTHR22872
    without a subfamily, and the source of the RCC1 region (Herc4) is in
    PTHR45622:SF76.
suggested_experiments:
- description: >-
    RNA-seq and proteomic or ribosome-profiling analysis of D. pseudoobscura
    tissues to test whether LOC117183218 isoforms are expressed and translated.
  hypothesis: >-
    LOC117183218 encodes an expressed RCC1-only protein rather than an
    untranslated duplicate.
- description: >-
    Co-immunoprecipitation of tagged X1 with Smoothened in Drosophila cells,
    compared with the Herc4 RCC1-like domain, and test of whether X1 expression
    alters Herc4-dependent Smoothened turnover.
  hypothesis: >-
    The partial RCC1-like domain retains Smoothened binding and can compete
    with Herc4.
