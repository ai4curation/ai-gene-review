  review:
    summary: TreeGrafter IEA. The protein is not a leaf of the PAINT tree; TreeGrafter grafts it at PTN000929336, which
      lies below PTN000929335, the node at which PAINT places the gain of GDP-forming activity with rat, pig and human
      SUCLG2 as seeds. The term is inherited by descent. It has not been measured for this protein or for any fungal SUCLG2-type
      subunit.
    action: ACCEPT
    reason: Accepted as the core activity, as an inference from descent. To dispute the row one would have to dispute
      the node placement or show that this protein diverged, and the evidence found supports membership of the clade.
      Five SUCLG2-type genes of early-diverging fungi group with human SUCLG2 in 200 of 200 neighbor-joining bootstrap
      trees and in the maximum-likelihood tree, this protein is 80% identical to one of them, and it is more similar to
      human SUCLG2 than to the A-type beta subunit of its own genome. No tree contains this protein itself. The glutamine
      at position 20 of the mature subunit (Gln34) is a conserved feature of the clade and does not prove GTP use. The
      beta subunit contributes to the activity of the alpha-beta enzyme and does not carry it alone, which core_functions
      records as contributes_to.
