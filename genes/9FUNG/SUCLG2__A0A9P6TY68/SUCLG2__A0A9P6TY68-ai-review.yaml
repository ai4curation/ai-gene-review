suggested_questions:
- question: UniRule UR000405968 (HAMAP MF_03219) names every eukaryotic beta subunit that matches neither dedicated profile as ADP-forming. Should it stop asserting a nucleotide for subunits that group with
    SUCLG2, such as the Mortierellomycota genes, or assert a nucleotide-neutral activity?
- question: This entry carries both GO:0004775 (from the UniRule) and GO:0004776 (from TreeGrafter). PAINT records loss
    of GO:0004775 at PTN000929335, but the loss does not reach grafted sequences as a NOT row. Can a PAINT loss suppress
    a conflicting rule-based IEA on a grafted sequence?
- question: TreeGrafter grafts this fungal protein at PTN000929336, a node labelled Metazoa-Choanoflagellida, and not
    at or above the Opisthokont node. Does that reflect the absence of Mortierellomycota from the reference tree, and
    would adding one such genome move the fungal G-type genes to their own branch?
- question: Is the start codon of gene model DFQ27_008652 right? Of the 14 residues ahead of the E. coli-aligned core, residues 9 to 13 (ASQVR) are shared with both closest ortholog models. The Linnemannia elongata model A0A197JV50 starts one residue before that motif (MASQVRH), so only residues 1 to 8 (MPIQRGIV) are specific to this model, and the Lobosporangium transversale model A0A1Y2H5W1 has a 40-residue leader with seven basic and no acidic residues that this model lacks. Is the true start upstream, with a longer presequence as in Lobosporangium?
- question: The strain BC1065 is described in the genome paper as Actinomortierella sp. aff. ambigua. Is the species
    assignment of the UniProt proteome settled?
suggested_experiments:
- hypothesis: The enzyme formed by this subunit and the alpha subunit A0A9P6PU00 is GTP-specific, and the enzyme formed
    by the A-type subunit A0A9P6Q632 with the same alpha subunit is ATP-specific.
  description: Co-express the alpha subunit with each beta subunit in E. coli without the predicted N-terminal extensions,
    purify the two enzymes and measure Km and kcat with ATP, GTP, ADP and GDP in both directions, as was done for the
    pig, pigeon and Blastocystis enzymes.
- hypothesis: Both beta subunits of the fungus form a functional succinyl-CoA synthetase with a fungal alpha subunit in
    mitochondria.
  description: Complement a Saccharomyces cerevisiae lsc2 deletion with this gene and with the A-type gene, with and
    without the Actinomortierella alpha subunit, and test growth on non-fermentable carbon sources and succinyl-CoA synthetase
    activity with each nucleotide in mitochondrial extracts. Tomato subunits were shown to be functional in this way.
- hypothesis: The protein is made, imported into the mitochondrial matrix and processed at its N-terminus.
  description: Profile transcripts and the mitochondrial proteome of the fungus, or of a transformable Mortierellaceae
    relative, across carbon sources. Locate a fluorescent-protein fusion, test protease protection in isolated mitochondria
    and determine the N-terminus of the mature protein by peptide mapping.
