core_functions:
- description: Predicted nucleotide-binding beta subunit of mitochondrial succinyl-CoA synthetase, of the SUCLG2-type
    (G-type) lineage. With the alpha subunit it is inferred to interconvert succinyl-CoA, GDP and phosphate with succinate,
    GTP and CoA in the tricarboxylic acid cycle. The fungus keeps this gene beside an A-type beta gene (A0A9P6Q632) and
    a single alpha gene (A0A9P6PU00). Everything here is inferred from descent and sequence; the nucleotide specificity,
    the complex and the location have not been measured.
