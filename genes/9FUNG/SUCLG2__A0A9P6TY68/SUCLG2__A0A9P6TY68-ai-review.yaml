  - statement: Residue 34 of UniProtKB A0A9P6TY68 (sequence version 1) is the glutamine at position 20 of the mature
      beta subunit.
    supporting_text: Gln34 of A0A9P6TY68 aligns with Pro20 of E. coli SucC, Gln58 of pig SUCLG2 (P53590) and Gln57 of
      human SUCLG2 (Q96I99).
