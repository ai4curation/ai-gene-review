taxon:
  id: NCBITaxon:1343610
  label: Actinomortierella ambigua
description: Predicted beta subunit of mitochondrial succinyl-CoA synthetase (succinate--CoA ligase) of the soil fungus
  Actinomortierella ambigua (Mortierellomycota). Succinyl-CoA synthetase is an alpha-beta enzyme of the tricarboxylic acid
  cycle that interconverts succinyl-CoA, a nucleoside diphosphate and phosphate with succinate, a nucleoside triphosphate
  and CoA; the beta subunit carries the ATP-grasp nucleotide site and the succinate site and sets the nucleotide specificity.
  The protein is known only as a gene model from a draft genome, and nothing about it has been measured. By sequence it
  belongs to the SUCLG2-type (G-type) lineage of beta subunits, whose assayed animal members form GTP, and it has glutamine
  at the position that contacts the guanine base in the pig GTP-specific enzyme (Gln34 of this sequence). The fungus also
  encodes a beta subunit of the SUCLA2-type (A-type) lineage and a single alpha subunit, as animals do, whereas most other
  fungi, including yeasts, have only the A-type beta gene. Formation of GTP by the enzyme that contains this subunit is
  therefore an inference from descent; the same glutamine is found in an ATP-specific enzyme of another eukaryote, so
  the residue does not settle the question. Location in the mitochondrion is likewise inferred from the family.
