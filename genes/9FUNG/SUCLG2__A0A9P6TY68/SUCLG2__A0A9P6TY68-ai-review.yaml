- id: PMID:18452512
  title: Localization and nucleotide specificity of Blastocystis succinyl-CoA synthetase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text in the cache. About Blastocystis. Used as the counter-example that limits what the glutamine
      at position 20 can show, and for the statement that many eukaryotes have two forms of the beta subunit.
  findings:
  - statement: The Blastocystis enzyme has Gln at position 20 of the mature beta subunit and is ATP-specific, so the
      residue does not dictate nucleotide specificity.
    supporting_text: the appearance of Gln at position 20 in Blastocystis SCS coupled with its ATP specificity indicates
      that it is not this residue that dictates nucleotide specificity
  - statement: A broad range of eukaryotes have two forms of the beta subunit, and the authors suggest that specificity
      might be deduced from phylogeny.
    supporting_text: it is clear that a taxonomically broad range of eukaryotes possess two distinct forms of SCSβ,
      suggesting that nucleotide specificity might be deduced by phylogenetic analyses
