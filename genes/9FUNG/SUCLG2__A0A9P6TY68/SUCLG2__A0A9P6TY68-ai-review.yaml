    the enzyme forms GTP, ATP or both. The same glutamine occurs in the ATP-specific Blastocystis enzyme, and the E. coli
    enzyme with proline at that position uses both nucleotides. No succinyl-CoA synthetase of any Mortierellomycota species
    has been assayed.'
