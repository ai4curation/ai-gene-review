      fallback for eukaryotic beta subunits that match neither the ATP-specific nor the GTP-specific HAMAP profile, and
      it names every such protein ADP-forming. The dedicated GTP-specific rule is limited to Metazoa and Amoebozoa, so
      no fungal subunit can receive the GDP-forming name from the rule system. The nucleotide named in this row is therefore
