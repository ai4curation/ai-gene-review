  findings:
  - statement: Five SUCLG2-type genes of early-diverging fungi group with human SUCLG2; A0A9P6TY68 was counted in the
      census of that analysis and was not one of the five placed in the trees.
    supporting_text: All five group with human SUCLG2 in 200 of 200 neighbor-joining bootstrap trees and in all three
      maximum-likelihood runs, inside a clade of 14 Gln20 sequences with animal SUCLG2 (ultrafast bootstrap 91 to 96).
  - statement: No enzyme of these fungi has been assayed.
    supporting_text: No enzyme from these fungi has been assayed, so the nucleotide specificity of the fungal SUCLG2-type
      subunits is unknown.
