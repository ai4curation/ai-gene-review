gene_model_issues:
- issue_type: WRONG_START_SITE
  status: SUSPECTED
  description: The N-terminus of gene model DFQ27_008652 may be truncated or mis-called. Of the 14 residues ahead of the
    E. coli-aligned core, residues 9 to 13 (ASQVR) are shared with the two closest ortholog models, and only residues
    1 to 8 (MPIQRGIV) are specific to this model. The Linnemannia elongata model A0A197JV50 starts one residue before
    the shared motif, and the Lobosporangium transversale model A0A1Y2H5W1 has a 40-residue leader with seven basic
    and no acidic residues ahead of the same point, in the position of a mitochondrial presequence. The three models
    therefore disagree on the start, and this one has no leader of presequence length. This is a hypothesis from a
    comparison of three predicted proteins; no transcript or genomic sequence upstream of the start was examined and
    no targeting predictor was run. Annotations of the mature enzyme are unaffected; the presence and length of a
    presequence cannot be read from this model.
  evidence_types:
  - ORTHOLOG_COMPARISON
  supported_by:
  - reference_id: file:9FUNG/SUCLG2__A0A9P6TY68/SUCLG2__A0A9P6TY68-bioinformatics/RESULTS.md
    supporting_text: Residues 9 to 13 of A0A9P6TY68 (ASQVR) are identical in both ortholog models, and only residues
      1 to 8 (MPIQRGIV) are specific to this model.
  - reference_id: file:9FUNG/SUCLG2__A0A9P6TY68/SUCLG2__A0A9P6TY68-bioinformatics/RESULTS.md
    supporting_text: Lobosporangium transversale A0A1Y2H5W1 has 40 residues ahead of the residue aligned with Leu15,
