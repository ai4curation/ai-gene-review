  original_reference_id: PMID:10931207
  qualifier: enables
  review:
    summary: The purified enzyme acetylates glutamate with acetyl-CoA, and the gene complements an E. coli argA
      (N-acetylglutamate synthase) mutant.
    action: ACCEPT
    reason: PMID:10931207 assayed purified His-tagged G. stearothermophilus ArgJ and showed acetyl-CoA-dependent
      glutamate acetylation, distinguishing it from the monofunctional M. jannaschii enzyme; in vivo the gene
      rescues an argA mutant. The earlier study (PMID:8473852) found both activities co-eluting and co-inactivating
      as one protein. This is direct evidence for the initiating activity on this protein.
    supported_by:
    - reference_id: PMID:10931207
      supporting_text: T. neapolitana and B. stearothermophilus ArgJ also catalyze the conversion of glutamate
        to N-acetylglutamate using acetylCoA as the acetyl donor
    - reference_id: PMID:8473852
      supporting_text: The subcloned B. stearothermophilus argJ can complement a double argA argE E. coli
        mutant to prototrophy.
