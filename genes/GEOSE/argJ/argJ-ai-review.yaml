id: Q07908
gene_symbol: argJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1422
  label: Geobacillus stearothermophilus
description: ArgJ of the thermophilic bacterium Geobacillus stearothermophilus (formerly Bacillus stearothermophilus)
  is a bifunctional acetyltransferase of the cyclic (acetyl-recycling) route of arginine biosynthesis. It acetylates
  L-glutamate using acetyl-CoA, the first step of the pathway, and transfers the acetyl group of N2-acetyl-L-ornithine
  to L-glutamate, releasing L-ornithine and regenerating N-acetylglutamate. Both activities were measured on
  the purified enzyme, follow a ping-pong mechanism through an acetylated beta-subunit intermediate, and are
  inhibited by L-ornithine. The single-chain precursor cleaves itself at a conserved ATML motif, with Thr-197
  as the nucleophile, to give alpha and beta chains that assemble as an alpha2beta2 heterotetramer in the
  cytoplasm.
