id: S0EDH7
gene_symbol: S0EDH7
taxon:
  id: NCBITaxon:1279085
  label: Fusarium fujikuroi IMI 58289
status: COMPLETE
description: >-
  FFUJ_06423 (S0EDH7) is an uncharacterized Pezizomycotina-restricted protein whose C-terminal
  half has only fold-level protein kinase-like signatures. It retains catalytic-loop and DFG
  residues, but the N-lobe ATP-binding elements are not detectable, the phosphoacceptor class
  (protein or small molecule) is unknown, and no characterized ortholog, PANTHER family or
  publication exists. GOA carries no annotations for the gene. Neither ATP binding nor protein
  phosphorylation can be validated or refuted.
source_documents:
  - genes/GIBF5/S0EDH7/S0EDH7-uniprot.txt
  - genes/GIBF5/S0EDH7/S0EDH7-goa.tsv
  - genes/GIBF5/S0EDH7/S0EDH7-ai-review.yaml
  - genes/GIBF5/S0EDH7/S0EDH7-bioinformatics/RESULTS.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006468
      label: protein phosphorylation
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The gene has no GOA annotations, so the term would be novel, but nothing establishes it. The
        kinase-like region matches the eukaryotic protein kinase profile (PF00069) only below the
        gathering threshold, small-molecule kinase profiles (Kdo, APH) align to the same segment, and
        no characterized relative or phylogenetic node is available for transfer. The gene review
        asserts only generic kinase activity and explicitly does not assert protein phosphorylation.
        A PubMed search for FFUJ_06423 and S0EDH7 returned no publications. Whether the protein
        phosphorylates proteins, small molecules or nothing is unknown.
      supported_by:
        - reference_id: file:GIBF5/S0EDH7/S0EDH7-uniprot.txt
          supporting_text: >-
            InterPro; IPR011009; Kinase-like_dom_sf.
        - reference_id: file:GIBF5/S0EDH7/S0EDH7-bioinformatics/RESULTS.md
          supporting_text: >-
            phosphoacceptor class (protein versus small molecule) cannot be inferred
        - reference_id: file:GIBF5/S0EDH7/S0EDH7-bioinformatics/RESULTS.md
          supporting_text: >-
            Against Swiss-Prot the best hits are weak
            and scattered across unrelated Ser/Thr kinase families
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005524
      label: ATP binding
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The gene has no GOA annotations, so the term would be novel, but ATP binding is not
        established. The conserved catalytic-loop Asp/Lys/Asn and DFG Asp are compatible with an
        active phosphotransferase, yet the N-lobe glycine-rich loop and beta3 lysine that bind ATP in
        canonical kinases are not detectable in S0EDH7 or its homologs. No ligand-binding data or
        characterized relative exist, and no publication on the gene was found in PubMed. ATP binding
        remains plausible but untested.
      supported_by:
        - reference_id: file:GIBF5/S0EDH7/S0EDH7-bioinformatics/RESULTS.md
          supporting_text: >-
            HMM positions 1-42, which contain the glycine-rich loop and the beta3 lysine, are not
            aligned in S0EDH7 or in any of the four homologs tested.
        - reference_id: file:GIBF5/S0EDH7/S0EDH7-bioinformatics/RESULTS.md
          supporting_text: >-
            the N-lobe ATP-binding elements could not be detected
