predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1990604
      label: IRE1-TRAF2-ASK1 complex
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 14.84). This is the metazoan ER-stress signalling complex
        assembled on IRE1alpha; fungi have Ire1 but not TRAF2 or ASK1, so the complex as
        defined cannot exist in Fusarium. The protein has no ER-luminal sensor domain, no
        transmembrane segment and no RNase domain, all of which IRE1 requires. The retrieval
        has matched a kinase fold to one of the best-annotated kinase-containing complexes in
        SwissProt and carried the whole complex across with it.
      supported_by:
        - reference_id: file:GIBF5/S0EDH7/S0EDH7-uniprot.txt
          supporting_text: InterPro IPR011009 Kinase-like domain superfamily
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0031431
      label: Dbf4-dependent protein kinase complex
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 13.01). The DDK complex is Cdc7 plus its Dbf4 regulatory subunit,
        acting in replication origin firing. Cdc7 is a distinctive kinase with inserted
        regulatory segments, and nothing in this 342-aa protein's annotation places it in
        that subfamily. As at rank 1, a bare kinase-like fold is being resolved into a named
        complex on no subfamily evidence.
      supported_by:
        - reference_id: file:GIBF5/S0EDH7/S0EDH7-uniprot.txt
          supporting_text: InterPro IPR011009 Kinase-like domain superfamily
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004694
      label: eukaryotic translation initiation factor 2alpha kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Rank 3 (score 12.40). Naming eIF2alpha as the substrate is unsupported - no substrate
        is known for this protein - but the term is a strict descendant of protein kinase
        activity, this review's core molecular function, so a curator climbing to the parent
        recovers exactly the right annotation. Scored LSP on that basis: the useful content
        is the kinase call, and the substrate is decoration the retrieval was forced to add
        because the GO index offers substrate-specific kinase terms far more often than the
        generic one.
      supported_by:
        - reference_id: file:GIBF5/S0EDH7/S0EDH7-uniprot.txt
          supporting_text: InterPro IPR011009 Kinase-like domain superfamily
