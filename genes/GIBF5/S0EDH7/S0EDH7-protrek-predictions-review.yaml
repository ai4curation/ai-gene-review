  label: Fusarium fujikuroi IMI 58289
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for FFUJ_06423, an uncharacterised Fusarium
  fujikuroi protein whose only assignment is a kinase-like domain fold (IPR011009,
  SSF56112) with no subfamily, substrate or pathway established. The protein has no GOA
  annotations. ProTrek does recognise the kinase fold, but instead of returning the
  general terms the evidence supports it commits to specific signalling complexes and
  substrates borrowed from yeast and mammalian stress-response kinases: the
  IRE1-TRAF2-ASK1 complex at rank 1, the Dbf4-dependent kinase complex at rank 2 and
  eIF2alpha kinase activity at rank 3. This is the mirror image of ProtNLM2's behaviour
  on the same protein, which returned protein phosphorylation and ATP binding - too
  general to be interesting but correct. The contrast is a clean illustration of the two
  models' opposite failure directions on genuinely unknown proteins.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 1 less precise (LSP),
  0 uncertain (UNC), 2 incorrect (NPI).
