suggested_questions:
  - question: >-
      Does the Pezizomycotina-specific family containing FFUJ_06423 (variant WGDGK..N
      catalytic loop, no detectable N-lobe glycine-rich loop) phosphorylate proteins or
      small molecules, and how is ATP bound without the canonical N-lobe elements?
  - question: >-
      Does the uncharacterized N-terminal ~180-residue region form part of a divergent
      N-lobe, or a separate domain that determines substrate or localization?
suggested_experiments:
  - hypothesis: >-
      FFUJ_06423 is an active kinase whose activity depends on the conserved catalytic-loop
      Asp D288 and DFG Asp D307.
    description: >-
      Express recombinant FFUJ_06423 (wild type, D288A and D307A), test ATP binding
      (thermal shift with ATP/ADP analogues) and ATP turnover (ADP-Glo) with and without
      generic protein substrates and candidate small-molecule acceptors, and test
      autophosphorylation by phosphoproteomics.
  - hypothesis: >-
      Loss of FFUJ_06423 affects growth, development or secondary metabolism in Fusarium
      fujikuroi.
    description: >-
      Construct a targeted FFUJ_06423 deletion mutant by homologous recombination and
      compare growth, conidiation, secondary metabolite (gibberellin, bikaverin) production
      and rice pathogenicity with the wild-type IMI 58289 strain; localize a GFP fusion.
