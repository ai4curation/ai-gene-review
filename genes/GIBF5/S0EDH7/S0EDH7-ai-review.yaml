taxon:
  id: NCBITaxon:1279085
  label: Fusarium fujikuroi IMI 58289
description: >-
  FFUJ_06423 is a 342-amino-acid uncharacterized protein from the phytopathogenic
  ascomycete Fusarium fujikuroi (Gibberella fujikuroi). It contains a protein
  kinase-like domain fold identified by three independent structural classification
  methods: InterPro IPR011009 (Kinase-like domain superfamily), Gene3D 1.10.510.10
  (Phosphotransferase domain), and SUPFAM SSF56112 (Protein kinase-like). These
  fold-level signatures suggest a kinase of the protein kinase-like superfamily,
  but do not distinguish a protein kinase from a small-molecule kinase of the same
  fold. No specific kinase family assignment, substrate, regulatory partner,
  or signaling pathway membership has been established. No experimental
  characterization has been reported (UniProt PE level 4: Predicted). The protein
  was identified from the F. fujikuroi CBS 195.34 genome sequencing project.
references:
  - id: PMID:23825955
    title: >-
      Deciphering the cryptic genome: genome-wide analyses of the rice pathogen
      Fusarium fujikuroi reveal complex regulation of secondary metabolism and
      novel metabolites
existing_annotations: []
core_functions:
  - description: >-
      Predicted kinase of the protein kinase-like (PKL) fold, inferred only from
      fold-level signatures (InterPro IPR011009, Gene3D 1.10.510.10, SUPFAM
      SSF56112). No Pfam-level protein kinase or small-molecule kinase family is
      assigned, so whether the phosphoacceptor is a protein (protein kinase) or a
      small molecule (as in aminoglycoside/choline kinase-like PKL members) is
      unresolved; protein phosphorylation is therefore not asserted.
    molecular_function:
      id: GO:0016301
      label: kinase activity
    knowledge_gaps:
      - gap_statement: >-
          The phosphoacceptor class (protein vs small molecule) and whether the
          protein is catalytically active are unknown.
        boundary: >-
          Only superfamily/fold-level kinase-like signatures are available; no
          family-level classification, ligand-binding evidence or activity assay exists.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
    supported_by:
