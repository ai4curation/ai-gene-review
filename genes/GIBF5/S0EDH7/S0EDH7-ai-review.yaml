  label: Fusarium fujikuroi IMI 58289
description: >-
  FFUJ_06423 (UniProt S0EDH7) is a 342-amino-acid uncharacterized protein of the rice
  bakanae pathogen Fusarium fujikuroi (Gibberella fujikuroi), encoded on chromosome VI.
  Its C-terminal half (about residues 180-320) adopts the protein kinase-like (PKL) fold,
  recognised only by fold-level signatures (InterPro IPR011009, SUPFAM SSF56112, Gene3D
  1.10.510.10); the N-terminal 180 residues have no recognisable domain. The kinase-like
  region aligns to the C-lobe of the eukaryotic protein kinase profile below the family
  threshold and retains a variant catalytic loop (W286-G-D288-G-K290-A-S-N293) and a DFG
  motif (D307-F-G), whereas the N-lobe glycine-rich loop and beta3 lysine are not
  detectable. It belongs to a family of uncharacterized proteins found only in
  Pezizomycotina fungi, with no characterized ortholog and no PANTHER family assignment.
  It is therefore a predicted, possibly catalytically active, kinase whose
  phosphoacceptor (protein or small molecule), subcellular location and biological role
  are unknown; no experimental characterization has been reported.
