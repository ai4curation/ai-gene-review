core_functions:
  - description: >-
      Predicted kinase of the protein kinase-like (PKL) fold. The C-lobe catalytic
      machinery is retained (catalytic-loop Asp D288, Lys K290 and Asn N293 in a
      family-specific WGDGK..N loop; DFG Asp D307), consistent with phosphotransferase
      activity, but N-lobe ATP-binding elements are not detectable and the best profile
      match (eukaryotic protein kinase, PF00069) is below threshold, while small-molecule
      kinase profiles (Kdo, APH) align to the same segment. Protein kinase activity and
      protein phosphorylation are therefore not asserted.
    molecular_function:
      id: GO:0016301
      label: kinase activity
    knowledge_gaps:
      - gap_statement: >-
          Whether the protein is catalytically active, and whether its phosphoacceptor is a
          protein or a small molecule, are unknown.
        boundary: >-
          Only fold-level kinase-like signatures and conservation of catalytic-loop and DFG
          residues are available; no characterized relative, ligand-binding evidence or
          activity assay exists.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
      - gap_statement: >-
          The function of the N-terminal ~180-residue region, the subcellular location and
          any biological process involving this Pezizomycotina-specific protein are unknown.
        boundary: >-
          The N-terminal region matches no domain signature, and no localization, expression
          or mutant data exist for FFUJ_06423 or any homolog.
        gap_kind:
          - BIOLOGY
        dark_aspect: BP_DARK
