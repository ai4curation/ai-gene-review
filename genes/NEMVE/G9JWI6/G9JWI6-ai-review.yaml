  findings:
  - statement: >-
      NvDelta was identified as the single Nematostella Delta ligand with DSL, EGF
      and transmembrane domains.
    supporting_text: >-
      we were able to confirm one of these genes to be the Delta ligand. NvDelta
      possessed all characteristic domains of bilaterian Delta or Serrate notch
      ligands: a DSL domain, EGF repeats and a transmembrane domain
  - statement: NvDelta expression is restricted to tentacle ectoderm and mesenteries at metamorphosis.
    supporting_text: >-
      At metamorphosis, Nvdelta is restricted to tentacular ectoderm and the
      endodermal component of the developing mesenteries.
