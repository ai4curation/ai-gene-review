    label: Notch signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR011651
  review:
    summary: >-
      InterPro2GO mapping from the MNNL (Notch ligand N-terminal) domain. Supported
      in Nematostella by gene-specific perturbation: NvDelta knockdown phenocopies
      NvNotch knockdown, and NvDelta gain-of-function effects require
