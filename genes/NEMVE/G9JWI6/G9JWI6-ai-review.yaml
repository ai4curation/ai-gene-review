      in the embryonic ectoderm.
  - reference_id: PMID:22155407
    supporting_text: >-
      NvDelta possessed all characteristic domains of bilaterian Delta or Serrate
      notch ligands: a DSL domain, EGF repeats and a transmembrane domain
suggested_questions:
- question: >-
    Does NvDelta bind NvNotch directly (e.g. cell aggregation or purified
    DSL-EGF/NRR binding assays), and does it cis-inhibit NvNotch as bilaterian Delta
    does?
- question: >-
    Is NvDelta-triggered signalling Su(H)/Hes-dependent in some contexts
    (cnidogenesis, endoderm induction) but not others (NvashA repression)?
- question: >-
    Is NvDelta endocytosis/ubiquitination by a Mind bomb or Neuralized homolog
    required for signalling in cnidarians?
suggested_experiments:
- description: >-
    CRISPR knockout of Nvdelta with rescue by a DSL-domain point mutant to test
    whether receptor binding is required for NvashA repression and endoderm induction.
- description: >-
    Co-culture signalling assay (sender cells expressing NvDelta, receiver cells
    expressing NvNotch with a Su(H)-responsive reporter) to test trans-activation and
    canonical CSL dependence.
