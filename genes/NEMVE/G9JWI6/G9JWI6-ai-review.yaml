- term:
    id: GO:0005112
    label: Notch binding
  evidence_type: IGI
  original_reference_id: PMID:25705370
  review:
    summary: >-
      Proposed MF for the NvDelta ligand. NvDelta carries the conserved MNNL+DSL
      receptor-binding module, and its gain-of-function effect (NvashA
      suppression) requires gamma-secretase activity and phenocopies NvNotch
      intracellular-domain overexpression, while its loss phenocopies NvNotch loss.
    action: NEW
    reason: >-
      Notch binding is the defining molecular function of DSL ligands and is
      annotated to Delta orthologs across bilaterians. The Nematostella evidence is
      genetic (ligand and receptor perturbations give matching, epistatic
      phenotypes) plus domain architecture, not a direct binding assay, so an
      IGI-type assertion from PMID:25705370 is the appropriate strength.
    supported_by:
    - reference_id: PMID:25705370
      supporting_text: >-
        This demonstrates that NvNotch and NvDelta are both required to repress
        NvashA in the embryonic ectoderm.
    - reference_id: PMID:22155407
      supporting_text: >-
        NvDelta possessed all characteristic domains of bilaterian Delta or Serrate
        notch ligands: a DSL domain, EGF repeats and a transmembrane domain
