- id: PMID:26443634
  title: Regulation of Nematostella neural progenitors by SoxB, Notch and bHLH genes.
  findings:
  - statement: >-
      Notch inhibition upregulates NvDelta expression, consistent with a feedback
      loop; the canonical versus non-canonical mechanism remains unresolved.
    supporting_text: >-
      NvDelta is also increased, whereas NvHes2 and NvHes3 are downregulated.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; partly disputes the non-canonical interpretation.
