id: G9JWI6
gene_symbol: delta
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:45351
  label: Nematostella vectensis
description: >-
  NvDelta is the single canonical Delta-type DSL ligand of the starlet sea anemone
  Nematostella vectensis (Cnidaria, Anthozoa). It is a single-pass type I membrane
  protein with an N-terminal MNNL (Notch ligand N-terminal) domain, a DSL domain and
  EGF-like repeats in the extracellular region, a transmembrane segment and a short
  cytoplasmic tail, i.e. the full bilaterian Delta/Serrate receptor-binding module.
  It is expressed in scattered "salt-and-pepper" ectodermal cells during gastrulation
  (overlapping neural and cnidocyte progenitors), later in tentacle ectoderm and
  mesenteries, and in the early mesoderm abutting Notch-expressing ectoderm.
  Morpholino knockdown of NvDelta, like knockdown of NvNotch, derepresses the
  proneural gene NvashA, while NvDelta overexpression suppresses NvashA in a
  gamma-secretase (DAPT)-sensitive manner, indicating that NvDelta acts as a
  juxtacrine ligand that activates NvNotch to restrain neural differentiation
  (lateral inhibition). Delta-Notch signalling at the mesoderm/ectoderm interface
  also induces endodermal fate. Whether NvDelta-triggered signalling acts through the
  canonical Su(H)/Hes transcriptional route is debated; NvDelta overexpression did not
  induce Nvhes genes, and a non-canonical mechanism has been proposed.
existing_annotations:
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001881
  - InterPro:IPR018097
  review:
    summary: >-
      InterPro mapping from calcium-binding EGF-like domain signatures
      (IPR001881, IPR018097) present among the EGF repeats of NvDelta.
    action: KEEP_AS_NON_CORE
    reason: >-
      Calcium-binding EGF repeats are a structural feature of DSL ligands and the
      mapping is plausible, but calcium binding is a structural property rather than
      the signalling function of the ligand. Kept as non-core.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: >-
      Derived from an ARBA-predicted "Secreted" subcellular location in the
      UniProt entry.
    action: REMOVE
    reason: >-
      NvDelta has a signal peptide, a single hydrophobic transmembrane segment
      (residues 442-463) and a cytoplasmic tail, and was characterised as a
      transmembrane DSL ligand. There is no evidence for a secreted or shed form in
      Nematostella; the "Secreted" location is an automated prediction inconsistent
      with the domain architecture. The membrane annotation captures the correct
      location.
    supported_by:
    - reference_id: PMID:22155407
      supporting_text: >-
        NvDelta possessed all characteristic domains of bilaterian Delta or Serrate
        notch ligands: a DSL domain, EGF repeats and a transmembrane domain
