    review_notes: Full text cached.
core_functions:
- description: >-
    Membrane-bound DSL ligand that engages the NvNotch receptor on neighbouring
    cells to activate Notch signalling (juxtacrine lateral inhibition of neural and
    cnidocyte differentiation; lateral induction of endoderm at the mesoderm
    boundary). Receptor binding is inferred from the conserved MNNL+DSL
    receptor-binding module and Notch-dependent gain-of-function; no direct binding
    assay has been reported for the Nematostella proteins.
  molecular_function:
    id: GO:0005112
    label: Notch binding
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
