  review:
    summary: Proposed core MF. Nvnotch knockdown and NICD overexpression produce opposite effects on
      differentiation markers, and NvDelta gain-of-function requires gamma-secretase activity,
      establishing NvNotch as the receptor for NvDelta.
    action: NEW
    reason: Transmembrane signaling receptor activity is the standard MF for Notch receptors (as for
      human NOTCH1). Nematostella-specific gene perturbation supports it; the domain architecture is
      fully conserved.
    supported_by:
    - reference_id: PMID:25705370
      supporting_text: We found that inhibiting Nvnotch by injecting the Nvnotch MO or by treating
        with DAPT resulted in upregulation of the differentiated markers.
    - reference_id: PMID:25705370
      supporting_text: Conversely, overactivation of Notch by overexpressing the Nvnicd:venus mRNA
        suppressed expression of the differentiation markers.
