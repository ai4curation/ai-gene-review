id: G9JWI5
gene_symbol: notch
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:45351
  label: Nematostella vectensis
description: 'NvNotch is the single Notch receptor of the starlet sea anemone Nematostella vectensis (Cnidaria,
  Anthozoa). UniProt G9JWI5 is a partial (N-terminally incomplete) sequence of this receptor that nevertheless
  contains the diagnostic Notch architecture: tandem extracellular EGF-like repeats, the negative regulatory
  region (LNR repeats and heterodimerization/NOD-NODP domains), and an intracellular region with ankyrin
  repeats and a C-terminal nuclear localization signal. As in bilaterians, ligand engagement (by the DSL
  ligand NvDelta) and gamma-secretase cleavage release the Notch intracellular domain (NICD), which enters
  the nucleus. NvNotch signalling restrains neural and cnidocyte differentiation (knockdown or DAPT treatment
  derepresses the proneural gene NvashA and neural markers, whereas NICD overexpression suppresses them),
  is required for mesentery/endoderm organisation, and induces endodermal fate at the interface between
  Notch-expressing ectoderm and Delta-expressing mesoderm. Whether NvNotch acts through the canonical
  Su(H)/Hes transcriptional route is context-dependent and debated: one study found NICD overexpression
  did not induce Nvhes genes (a non-canonical mechanism for neural repression), whereas others found Hes
  genes reduced after Notch knockdown and Su(H) knockdown phenocopying Notch inhibition in cnidogenesis
  and gastruloid patterning.'
