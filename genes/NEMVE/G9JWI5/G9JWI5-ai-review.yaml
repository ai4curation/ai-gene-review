- id: PMID:22155407
  title: Functional roles of Notch signaling in the cnidarian Nematostella vectensis.
  findings:
  - statement: NvNotch is the single Nematostella gene with LNR, NOD, transmembrane and Notch-like
      intracellular regions, with a C-terminal NLS.
    supporting_text: only a single gene with the diagnostic organization of well-conserved LNR
      domains, a NOD domain, transmembrane domain and Notch-like intracellular region was identified
  - statement: DAPT blocks mesentery formation and cnidocyte development.
    supporting_text: By 72hpf discernable phenotypic deficiencies emerge in DAPT treated embryos
      wherein growth of the pharynx is stunted, mesentery formation does not occur, and endodermal
      morphology is disrupted when compared to control embryos
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source paper for the G9JWI5 sequence (UniProt RX line); full text cached.
- id: PMID:25705370
  title: Non-canonical Notch signaling represents an ancestral mechanism to regulate neural
    differentiation.
  findings:
  - statement: Nvnotch knockdown derepresses differentiation markers; NICD overexpression suppresses
      them.
    supporting_text: We found that inhibiting Nvnotch by injecting the Nvnotch MO or by treating
      with DAPT resulted in upregulation of the differentiated markers.
  - statement: Nvnotch knockdown or NICD overexpression did not alter Nvhes expression in this
      study.
    supporting_text: In Nematostella, gene-specific knockdown of Nvnotch, NvsuH, or overactivation
      of Nvnicd did not significantly affect expression levels of Nvhes genes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Gene-specific morpholino and NICD overexpression; full text cached.
- id: PMID:26443634
  title: Regulation of Nematostella neural progenitors by SoxB, Notch and bHLH genes.
  findings:
  - statement: NvNotch knockdown reduces NvHes2/3, supporting a canonical Hes-dependent mechanism.
    supporting_text: This suggests that NvHes2 and -3 are indeed targets of NvNotch, and thus, that
      Notch signalling in Nematostella neurogenesis can occur via a canonical Hes-dependent
      mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; conflicts in part with PMID:25705370 on Hes dependence.
- id: PMID:40858588
  title: Segregation of endoderm and mesoderm germ layer identities in the diploblast Nematostella
    vectensis.
  findings:
  - statement: NICD translocates to the nucleus and is sufficient to induce endodermal genes.
    supporting_text: Strikingly, injection of TBP::NICD-mCherry plasmid resulted in ectopic
      expression of foxA and brachyury in 60% of cases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:42321198
  title: Notch coordinates self-organization of germ layers and axial polarity in sea anemone
    gastruloids.
  findings:
  - statement: Su(H) knockdown phenocopies gamma-secretase inhibition in gastruloids.
    supporting_text: Our results show that gastruloids made from SuH MO-injected embryos also
      phenocopy LY-411575 treated gastruloids
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; pathway-level (inhibitor/Su(H) MO) evidence, not
      Notch-receptor-specific perturbation.
