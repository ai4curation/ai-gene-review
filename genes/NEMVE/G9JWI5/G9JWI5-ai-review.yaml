core_functions:
- description: Transmembrane receptor for the DSL ligand NvDelta at the cell surface;
    ligand-triggered gamma-secretase cleavage releases the intracellular domain, which translocates
    to the nucleus to transduce juxtacrine signals that repress neural/cnidocyte differentiation and
    induce endoderm.
  molecular_function:
