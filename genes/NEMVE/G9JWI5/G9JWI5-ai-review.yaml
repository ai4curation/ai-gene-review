suggested_questions:
- question: Is the canonical NICD-Su(H)-Mastermind ternary complex used by NvNotch in all contexts,
    or is neural repression genuinely Su(H)/Hes-independent as proposed?
- question: Does NvNotch undergo S1 furin processing and ADAM10 (Kuzbanian) S2 cleavage as in
    bilaterians, and is it O-fucosylated by a POFUT1 ortholog and modified by a Fringe homolog?
suggested_experiments:
- description: CRISPR knockout of Nvnotch (rather than morpholino/DAPT) with Su(H)-reporter readouts
    in neural, cnidocyte and endoderm-boundary contexts to resolve canonical versus non-canonical
    signalling.
- description: Obtain the full-length NvNotch sequence (the UniProt record is a fragment) and test
    ligand binding of the EGF11-12 equivalent region to NvDelta.
