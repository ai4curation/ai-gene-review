id: A7RHZ4
gene_symbol: A7RHZ4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:45351
  label: Nematostella vectensis
description: >-
  A7RHZ4 is the single MyD88 (myeloid differentiation primary response protein 88)
  homologue of the starlet sea anemone Nematostella vectensis, encoded by gene model
  NEMVEDRAFT_v1g82163. The UniProt sequence is an N-terminally incomplete predicted
  fragment of 245 residues comprising a death domain followed by a C-terminal TIR
  (Toll/interleukin-1 receptor) domain, the defining domain architecture of MyD88-family
  adaptors, and it lacks a signal peptide or transmembrane segment, consistent with a
  cytoplasmic protein. By homology with vertebrate and insect MyD88, it is expected to
  act as the cytosolic adaptor that binds, through TIR-TIR contacts, the cytoplasmic TIR
  domain of the single Nematostella Toll-like receptor (Nv-TLR) and possibly of
  cnidarian IL-1 receptor-like proteins, and to recruit downstream death-domain kinases,
  leading to activation of the Nematostella NF-kappaB transcription factor. The
  Nematostella TLR TIR domain binds human MYD88 in vitro and Nv-TLR activates
  NEMO-dependent NF-kappaB in human cells in response to bacterial products, and MyD88
  knockdown in the cnidarian Hydra impairs responses to bacteria, but the Nematostella
  MyD88 protein itself has not been studied experimentally.
existing_annotations:
- term:
    id: GO:0002755
    label: MyD88-dependent toll-like receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017281
  review:
    summary: >-
      InterPro2GO mapping from the MyD88 family signature (IPR017281). A7RHZ4 has the
      death domain plus TIR architecture of MyD88. Nematostella encodes a single TLR
      (Nv-TLR), whose TIR domain binds human MYD88 and which activates NF-kappaB in human
      cells in response to heat-killed Vibrio coralliilyticus and flagellin. In Hydra,
      MyD88 knockdown impairs bacterial sensing and defence.
    action: ACCEPT
    reason: >-
      This is the defining process of MyD88 and the conditions for transfer are met: the
      organism has a Toll-like receptor with a TIR domain that engages MyD88, and a
      cnidarian MyD88 loss-of-function study supports a role in TLR-dependent responses
      to bacteria. The GO definition states that toll-like receptors bind microbial
      pattern motifs directly; for Nv-TLR this is supported only by responses to
      flagellin and heat-killed bacteria in a reconstituted human-cell system, not by a
      binding assay, so the annotation is an inference, appropriate at IEA. The generic
      MyD88-dependent term is the right level. Numbered, ligand-specific TLR pathway terms
      (for example GO:0034142 TLR4 signalling) should not be transferred: the similarity
      of the Nv-TLR TIR to TLR4 says nothing about LPS recognition.
    supported_by:
    - reference_id: PMID:29109290
      supporting_text: we show that the intracellular Toll/IL-1 receptor (TIR) domain of
        Nv-TLR can interact with the human TLR adapter proteins MAL and MYD88
    - reference_id: PMID:29109290
      supporting_text: heat-inactivated V. coralliilyticus and bacterial flagellin can
        activate a reconstituted Nv-TLR-to-NF-κB pathway in human cells
    - reference_id: PMID:17437634
      supporting_text: These include a single MyD88 homolog (NvMyD88) and a protein (NvTLR-1)
        clearly related to members of the Toll/TLR family (Figure 2).
    - reference_id: PMID:23112184
      supporting_text: we use a MyD88 loss-of-function approach in Hydra to demonstrate
        that recognition of bacteria is an ancestral function of TLR signaling
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >-
      Subcellular-location mapping from an ARBA rule. The protein has no signal peptide
      or transmembrane segment; MyD88-family adaptors are cytoplasmic and are recruited
      to the cytoplasmic face of receptor TIR domains.
    action: ACCEPT
    reason: >-
      Consistent with the domain architecture and with the conserved function of MyD88 as
      a cytosolic adaptor. In a survey of actiniarian transcriptomes, none of the MyD88
      predicted proteins had a transmembrane domain.
    supported_by:
    - reference_id: PMID:27806695
      supporting_text: All TLR and IL-1R-like predicted peptides had transmembrane domains
        (TMDs) and all MyD88 and NF-κB predicted peptides did not.
