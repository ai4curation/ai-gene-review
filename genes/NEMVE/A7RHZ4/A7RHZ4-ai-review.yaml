- term:
    id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017281
  review:
    summary: >-
      InterPro2GO mapping from the MyD88 family signature. Nematostella has an NF-kappaB
      protein that, unlike the p100/p105 precursors, lacks C-terminal IkappaB-like repeats,
      and separately encoded IkappaB proteins, i.e. the substrate architecture of canonical
      IkappaB-regulated signalling. Nv-TLR activates NF-kappaB in human cells through the
      NEMO-dependent canonical route.
    action: ACCEPT
    reason: >-
      MyD88 promotes NF-kappaB activation throughout the animals in which it has been
      studied, and the components needed for a canonical, IkappaB-regulated route exist in
      Nematostella. The transfer is reasonable at IEA. Caveats, recorded rather than acted
      on: no experiment has tested NvMyD88 itself, and the NEMO dependence shown for
      Nv-TLR was measured with human downstream components.
    supported_by:
    - reference_id: PMID:17120026
      supporting_text: Nv-NF-kappaB lacks the C-terminal IkappaB-like sequences present
        in all other NF-kappaB proteins. There are, however, two IkappaB-like genes in Nematostella
        encoded by loci distinct from Nv-nfkb.
    - reference_id: PMID:29109290
      supporting_text: Neither Nv-TLR nor Hu-TLR4 activated the NF-κB–site luciferase reporter
        in 293 cells in which NEMO expression was genetically ablated
- term:
    id: GO:0070976
    label: TIR domain binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017281
  review:
    summary: >-
      InterPro2GO mapping from the MyD88 family signature. MyD88 binds receptor TIR
      domains through its own TIR domain; A7RHZ4 retains an intact TIR domain
      (residues 104-236). Cnidarian TLR TIR domains (Nematostella, the coral Orbicella)
      bind MyD88 in vitro.
    action: ACCEPT
    reason: >-
      This is the core molecular function of a MyD88 adaptor and the most informative MF
      available for it. Direct binding by the Nematostella protein has not been tested,
      but cnidarian TLR TIR domains engage MyD88, and the domain is conserved.
    supported_by:
    - reference_id: PMID:29109290
      supporting_text: we show that the intracellular Toll/IL-1 receptor (TIR) domain of
        Nv-TLR can interact with the human TLR adapter proteins MAL and MYD88
    - reference_id: PMID:29080785
      supporting_text: it can interact
        in vitro with the human TLR4 adapter MYD88
