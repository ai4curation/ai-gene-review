    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000157
  - InterPro:IPR000488
  review:
    summary: >-
      InterPro2GO mapping from the TIR (IPR000157) and death (IPR000488) domains, both
