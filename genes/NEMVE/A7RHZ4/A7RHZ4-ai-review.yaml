suggested_questions:
- question: Does NvMyD88 also act downstream of the Nematostella IL-1R-like TIR receptors?
    If so, which ligands activate them? Vertebrate interleukin-1-mediated signalling terms
    should not be transferred unless an IL-1-type ligand-receptor system is shown to exist
    in cnidarians.
- question: Is the full-length NvMyD88 gene model longer at the N-terminus than the UniProt
    fragment, and is the death domain complete?
- question: Does Nv-TLR bind flagellin or other microbial molecules directly, as the GO
    definition of toll-like receptor signalling requires, or is it activated indirectly?
suggested_experiments:
- description: Co-immunoprecipitation or GST pulldown of full-length NvMyD88 with the Nv-TLR
    TIR domain, and co-expression of NvMyD88 with Nv-TLR in MYD88-deficient human cells
    followed by an NF-kappaB reporter assay.
  hypothesis: NvMyD88 binds the Nv-TLR TIR domain and can replace human MYD88 in coupling
    Nv-TLR to NF-kappaB.
  experiment_type: protein interaction and reconstitution assay
- description: Morpholino or CRISPR knockdown of NvMyD88 in Nematostella juveniles followed
    by Vibrio coralliilyticus or Pseudomonas aeruginosa infection, with measurement of
    survival and Nv-NF-kappaB nuclear localisation.
  hypothesis: NvMyD88 is required for bacteria-induced NF-kappaB activation and defence
    in vivo, as MyD88 is in Hydra.
  experiment_type: in vivo loss-of-function
