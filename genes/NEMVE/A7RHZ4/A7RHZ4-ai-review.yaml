core_functions:
- description: >-
    Cytosolic TIR-domain adaptor that is expected to bind the TIR domain of the
    Nematostella Toll-like receptor and relay the signal, via its death domain, towards
    NF-kappaB activation.
  molecular_function:
    id: GO:0070976
    label: TIR domain binding
  directly_involved_in:
