    supporting_text: we show that the intracellular Toll/IL-1 receptor (TIR) domain of
      Nv-TLR can interact with the human TLR adapter proteins MAL and MYD88
  - reference_id: PMID:17437634
    supporting_text: These include a single MyD88 homolog (NvMyD88) and a protein (NvTLR-1)
