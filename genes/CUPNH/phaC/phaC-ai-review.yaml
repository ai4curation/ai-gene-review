gene_symbol: phaC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:381666
  label: Cupriavidus necator H16
description: PhaC (H16_A1437; also PhbC) is the class I polyhydroxyalkanoate synthase of Cupriavidus necator
  H16. It polymerizes (R)-3-hydroxybutyryl-CoA into intracellular polyhydroxybutyrate, an important carbon
  and energy reserve. PhaC associates with forming PHB granules through a dynamic PhaM-associated assembly
  and can detach as granules age. PHB is its canonical product, but altered precursor supply in engineered
  H16 supports incorporation of medium-chain hydroxyacyl units into mixed short/medium-chain copolyesters.
  That capacity does not establish a predominantly medium-chain homopolymer or a matched native medium-chain-polymer
  turnover pathway.
