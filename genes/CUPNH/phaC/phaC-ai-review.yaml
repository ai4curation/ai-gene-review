proposed_new_terms:
- proposed_name: poly(3-hydroxyalkanoate) synthase activity
  proposed_definition: Catalysis of the transfer and polymerization of 3-hydroxyacyl groups from (R)-3-hydroxyacyl-CoA
    to a growing poly(3-hydroxyalkanoate) chain, releasing coenzyme A.
  proposed_parent:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  justification: The valid non-amino-acyl transfer genus remains core; this separate proposed term captures
    polyester chain elongation, including the canonical PHB reaction, without implying equal use of all
    chain lengths.
  supported_by:
  - reference_id: file:CUPNH/phaC/phaC-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Polymerizes (R)-3-hydroxybutyryl-CoA to create polyhydroxybutyrate (PHB)
suggested_questions:
