  label: Cupriavidus necator H16
description: AcoB is the beta subunit of the thiamine-diphosphate-dependent acetoin-cleaving
  E1 enzyme in Cupriavidus necator H16 (historically Alcaligenes eutrophus H16). Together with
  the complementary E1 subunit it contributes to acetoin cleavage, releasing acetaldehyde and
  supplying an acetyl equivalent to the lipoyl-bearing E2 acetyltransferase. Native acetoin-grown
  cells yield a probable alpha2-beta2 E1 tetramer. DCPIP-dependent production of acetate in
  vitro is distinct from physiological transfer of acetyl to the lipoyl system.
