  label: Cupriavidus necator H16
description: AcoC is the lipoyl-bearing protein assigned as the E2 acetyltransferase of the
  acetoin catabolic system in Cupriavidus necator H16 (historically Alcaligenes eutrophus H16).
  In the inferred pathway, its lipoyl arm accepts acetyl equivalents generated by AcoA/AcoB,
  and its acetyltransferase activity transfers acetyl to coenzyme A, producing acetyl-CoA and
  a reduced lipoyl arm for E3-dependent reoxidation. The native protein was purified as the
  fast-migrating protein, linked to acoC by N-terminal sequencing and assigned an E2 role by
  comparative sequence evidence and curated functional assignment. Its C-terminal alpha/beta-hydrolase
  fold differs from the canonical E2 acetyltransferase fold in Pelobacter and Bacillus.
