    summary: AcoC catalyzes the E2 lipoyl-to-CoA acetyl transfer.
    action: ACCEPT
    reason: The native-system assignment, lipoyl-bearing architecture and curated E2 chemistry
      support this reaction as a functional inference. GO:0004742 is written reversibly; acetoin
      catabolism uses the acetyl-CoA-forming direction. Its acceptance does not imply membership
      in a pyruvate-specific complex. The H16 lipoyl-plus-alpha/beta-hydrolase architecture
      differs from canonical E2 folds. No later primary revision overturning the E2 assignment
      was located, but this is explicitly an inferred activity, not a claim that H16 purified
      FMP transfer activity was measured in the accessible abstract.
