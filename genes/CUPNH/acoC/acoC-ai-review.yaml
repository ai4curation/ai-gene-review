core_functions:
- description: Inferred lipoyl-dependent E2 transfer of acetyl to CoA in acetoin breakdown,
    supported by native FMP identification and curated functional assignment. H16 AcoC has a
    lipoyl domain joined to an alpha/beta-hydrolase fold, unlike canonical Pelobacter/Bacillus
    E2 proteins; the cited H16 abstract does not report an isolated acetyltransferase assay
    or establish a common catalytic mechanism across these architectures.
