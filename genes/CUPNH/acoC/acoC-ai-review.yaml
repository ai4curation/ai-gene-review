suggested_questions:
- question: Does purified H16 AcoC catalyze lipoyl-to-CoA acetyl transfer, and how does its
    alpha/beta-hydrolase domain implement the inferred E2 reaction relative to canonical E2
    acetyltransferase folds?
suggested_experiments:
- description: Reconstitute sequence-verified native AcoA/AcoB with lipoylated AcoC and the
    native E3; measure acetaldehyde, acetyl-CoA and NADH independently of DCPIP.
  experiment_type: native-component biochemical reconstitution
