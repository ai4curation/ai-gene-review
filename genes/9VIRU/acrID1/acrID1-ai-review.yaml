taxon:
  id: NCBITaxon:2848124
  label: Sulfolobus islandicus rod-shaped virus 3
description: 'AcrID1 is a compact dimeric anti-CRISPR protein of Sulfolobus islandicus rod-shaped virus
  3. It binds the Cas10d large subunit of the archaeal type I-D CRISPR effector and prevents formation
  of a cleavage-competent complex on target DNA. SIRV3 gp02 restores infectivity to an anti-CRISPR-deficient
  SIRV2 derivative in a susceptible Sulfolobus host. Inhibition depends on assembly state: a preassembled
  target-bound type I-D effector is protected from AcrID1 in the tested assays.'
