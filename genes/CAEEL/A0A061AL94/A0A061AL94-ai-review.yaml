    correctness: MISCITED
    review_notes: >-
      Kept from the earlier draft, which attached five ISS rows (DNA helicase activity, DNA
      replication initiation, DNA replication, nucleus, MCM complex) to this GO_REF. GOA has
      no annotations for A0A061AL94 and no ISS assertion exists for it; those rows were
