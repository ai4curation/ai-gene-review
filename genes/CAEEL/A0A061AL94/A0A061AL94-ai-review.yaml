id: A0A061AL94
gene_symbol: mcm-4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  A0A061AL94 is the 74-residue product predicted from transcript model Y39G10AR.14b of the
  C. elegans mcm-4 (lin-6) gene. Its sequence is identical to residues 750-823 of the
  canonical 823-residue MCM-4 protein (Q95XQ8, Y39G10AR.14a) and begins at an internal
  methionine within the last coding exon, so it consists only of the C-terminal
  winged-helix region of MCM-4 (Pfam WHD_MCM4). It lacks the N-terminal zinc-finger
  region and the entire AAA+ ATPase domain, including the Walker A and Walker B motifs,
  all ATP-binding residues and the arginine finger. The full-length MCM-4 protein is a
  subunit of the MCM2-7 replicative helicase and is required for DNA replication and the
  replication checkpoint in C. elegans embryos and postembryonic blast cells. Whether the
  short Y39G10AR.14b product is translated in vivo, and whether it has any activity of
  its own, is unknown; the cDNAs and northern analysis that defined the mcm-4 locus
  identified only the full-length transcript.
existing_annotations: []
core_functions:
- description: >-
    No independent molecular function is established for this 74-residue product. It is an
    N-terminally truncated mcm-4 gene product consisting only of the C-terminal
    winged-helix region (canonical MCM-4 residues 750-823). It contains neither half of an
    MCM ATPase site (no Walker A/B motifs, no arginine finger), so it cannot carry or
    contribute the ATP-dependent helicase activity that the full-length MCM-4 subunit
    contributes to the MCM2-7/CMG helicase. The replication functions of the mcm-4 gene are
    properties of the canonical 823-residue protein (Q95XQ8), and are not transferred to
    this fragment here.
