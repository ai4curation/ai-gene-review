  title: C. elegans MCM-4 is a general DNA replication and checkpoint component with an
    epidermis-specific requirement for growth and viability.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Primary characterization of C. elegans mcm-4/lin-6 (full text cached). Defines the
      823-residue product from cDNAs and northern analysis; functional findings (DNA
      synthesis, replication checkpoint, nuclear/chromatin localization of MCM-4::mCherry)
      apply to the full-length protein, not to the Y39G10AR.14b fragment.
  findings:
  - statement: >-
      The mcm-4 locus was defined by four sequenced cDNAs encoding the 823-residue protein,
      and northern blotting detected a single transcript of the cDNA size; no short
      3'-terminal transcript corresponding to Y39G10AR.14b was reported.
    supporting_text: >-
