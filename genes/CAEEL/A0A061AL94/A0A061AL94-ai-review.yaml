suggested_questions:
- question: >-
    Is the single-exon Y39G10AR.14b model (internal Met750 start in the last coding exon of
    mcm-4) supported by transcript evidence, and is its 74-residue product translated in
    vivo, or is it an annotation artefact of the gene model?
- question: >-
    If expressed, does the isolated MCM-4 C-terminal winged-helix region associate with the
    MCM2-7 ring or DNA, and could it act as a dominant-negative or regulatory fragment?
suggested_experiments:
- hypothesis: >-
    The Y39G10AR.14b transcript and its 74-residue product are not produced at detectable
    levels in vivo.
  description: >-
    Use long-read RNA-seq or 5'-RACE from the mcm-4 3' exon to test for a transcript starting
    near the Met750 codon, and use targeted proteomics for an N-terminal peptide containing
    the fragment-specific initiator (acetylated Met-Ser-Ala-Ser-Gly...) to distinguish the
    fragment from full-length MCM-4.
  experiment_type: transcript mapping and targeted mass spectrometry
- hypothesis: >-
    The isolated MCM-4 winged-helix region is not incorporated into MCM2-7 complexes.
  description: >-
    Express tagged full-length MCM-4 and the 74-residue fragment in C. elegans, and test
    co-immunoprecipitation with other MCM subunits and chromatin association.
  experiment_type: co-immunoprecipitation and fluorescence microscopy
