  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006367
      label: transcription initiation at RNA polymerase II promoter
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      error_type: FREQUENCY_BIAS
      confidence_score: 0
      summary: >-
        The record links this 74-residue sequence to mcm-4, whose full-length Caenorhabditis elegans
        product is experimentally established in DNA replication and replication checkpoint control
        (PMID:21146520). The focused report showed that A0A061AL94 is the isolated C-terminal MCM4
        winged-helix fragment and that reviewed full-length MCM4 supports replication terms, not Pol
        II transcription-initiation terms. The GO:0006367 prediction is best explained as a frequency-biased
        conflation of winged-helix DNA-binding domains and the word initiation, and is absent from the
        cached annotations.
      supported_by:
