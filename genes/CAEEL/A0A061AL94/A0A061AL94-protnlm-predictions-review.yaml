predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006367
      label: transcription initiation at RNA polymerase II promoter
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        No evidence places C. elegans mcm-4, or this 74-residue C-terminal winged-helix fragment
        of it (canonical MCM-4 residues 750-823), in Pol II transcription initiation. The
        characterized mcm-4 functions are DNA replication and the replication checkpoint
        (PMID:21146520), and neither the gene's existing annotations nor its re-reviewed gene
        record contain a transcription term, so the prediction is novel but unsupported. It is
        not refuted outright: vertebrate MCM subunits copurify with the Pol II holoenzyme
        (PMID:10454562), but that association was mapped to an N-terminal segment of MCM2
        (residues 168-230; PMID:12392551), it is complex co-purification rather than evidence
        that MCM-4 performs a step of initiation, and nothing ties it to the MCM4 C-terminal
        winged-helix region that makes up this product. Whether the fragment is even translated
        is unknown.
        The OpenScientist analysis judged the prediction NPI from the replicative-helicase identity of
        MCM-4; its targeted moonlighting search found no primary evidence for an MCM role in Pol II
        transcription and did not retrieve the holoenzyme co-purification reports (PMID:10454562,
        PMID:12392551), which leave the term unsupported rather than refuted.
      supported_by:
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-hypotheses/prediction-transcription-initiation/openscientist.md
          supporting_text: >-
            No experimental or reliable computational support; it conflicts with the well-established replicative-helicase identity.
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-hypotheses/prediction-transcription-initiation/openscientist.md
          supporting_text: >-
            A targeted search for an MCM/RNA-Pol-II transcription-initiation moonlighting activity returned no supporting primary evidence.
        - reference_id: PMID:21146520
          supporting_text: >-
            associates with chromatin in late anaphase
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-bioinformatics/RESULTS.md
          supporting_text: >-
            The fragment is an exact substring of the canonical protein: canonical residues 750-823, 100% identity,
        - reference_id: PMID:10454562
          supporting_text: >-
            These results suggest a new function for MCM proteins as components of the Pol II
            transcriptional apparatus.
        - reference_id: PMID:12392551
          supporting_text: >-
            We found that amino acids 168-230 of MCM2 are required for its binding to pol II
            holoenzyme in vivo.
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005634
      label: nucleus
    predicted_term_type: GO_CC
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Nucleus is not novel at the gene level: the canonical mcm-4 product Q95XQ8 carries
        GO:0005634 by IDA from PMID:21146520, where MCM-4::mCherry was nuclear and associated
        with chromatin from late anaphase, and GOA keeps the gene's annotations on that
        representative product. Correctness for this accession is unresolved. A0A061AL94 is only
        the C-terminal winged-helix region (canonical residues 750-823) from an internal-start
        gene model, its translation in vivo has not been shown, and the gene review deliberately
        does not transfer full-length MCM-4 localization or replication functions to it. The
        prediction therefore agrees with the gene's annotation but lacks support for the
        deposited sequence itself.
      supported_by:
        - reference_id: PMID:21146520
          supporting_text: >-
            associates with chromatin in late anaphase
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-bioinformatics/RESULTS.md
          supporting_text: >-
            The fragment is an exact substring of the canonical protein: canonical residues 750-823, 100% identity,
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-uniprot.txt
          supporting_text: >-
            DR   Pfam; PF21128; WHD_MCM4; 1.
