id: A0A061AL94
gene_symbol: mcm-4
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  A0A061AL94 is a 74-residue mcm-4 gene product record. Functions and localization of full-length MCM-4
  cannot be assumed to apply intact to this short sequence.
source_documents:
  - genes/CAEEL/A0A061AL94/A0A061AL94-uniprot.txt
  - genes/CAEEL/A0A061AL94/A0A061AL94-goa.tsv
