predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006367
      label: transcription initiation at RNA polymerase II promoter
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The record links this 74-residue sequence to mcm-4, whose full-length Caenorhabditis elegans product
        is experimentally established in DNA replication and replication checkpoint control (PMID:21146520).
        These findings do not establish RNA polymerase II transcription initiation, and the short sequence
        lacks the architecture of a complete MCM helicase subunit. They also do not exclude every indirect
        transcriptional role. The exact process is absent from the cached annotations and remains unverified
        for this gene product.
      supported_by:
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-uniprot.txt
        - reference_id: PMID:21146520
          supporting_text: >-
            associates with chromatin in late anaphase
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005634
      label: nucleus
    predicted_term_type: GO_CC
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Full-length C. elegans MCM-4 associates with chromatin and functions in nuclear DNA replication
        (PMID:21146520). The accession being evaluated encodes only 74 residues, so transfer of nuclear
        localization requires evidence that this fragment retains targeting or complex-association determinants
        or represents an incomplete model of the full-length product. The inspected sources do not resolve
        that relationship experimentally. Nucleus is absent from the cached annotations and is uncertain
        for the deposited sequence, despite being appropriate for full-length MCM-4.
      supported_by:
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-uniprot.txt
        - reference_id: PMID:21146520
