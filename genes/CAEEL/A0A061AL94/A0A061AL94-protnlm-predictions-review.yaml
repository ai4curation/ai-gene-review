id: A0A061AL94
gene_symbol: mcm-4
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  A0A061AL94 is the 74-residue product of the C. elegans mcm-4 (lin-6) transcript model
  Y39G10AR.14b. It is identical to residues 750-823 of canonical MCM-4 (Q95XQ8), starts at an
  internal methionine in the last coding exon, and consists only of the C-terminal winged-helix
  region (Pfam WHD_MCM4), lacking the zinc finger and the whole AAA+ ATPase domain. The
  replication, chromatin and nuclear annotations of mcm-4 are carried by the canonical product,
  and whether this short product is translated in vivo is unknown. ProtNLM2 emitted two GO
  terms; neither can be confirmed for this fragment.
