id: A0A061AL94
gene_symbol: mcm-4
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for the 74-aa Y39G10AR.14b isoform of C. elegans
  MCM-4, which contains only the C-terminal winged-helix domain of the ~860-aa
  replicative helicase subunit. The result is a total miss with an archaeal flavour: the
  top five calls are methanogenesis, Methanosarcina-phenazine hydrogenase,
  CoB--CoM heterodisulfide reductase, archaeal-type flagellum and methanogenesis from
  CO2, and the free-text Function channel returns methanogen heterodisulfide-reductase
  descriptions at scores below 10. MCM proteins are of archaeal origin, so the query does
  land in an archaeal neighbourhood, but the specific metabolic assignments have no
  relationship to DNA replication. Scores run from 11.4 down to 8.7 - the bottom band of
  the benchmark - so the failure is again visible from the score. ProtNLM2 on the same
  fragment predicted nucleus, which is correct and which the ARGO-ProtNLM-50 evaluation
  scored as a genuinely novel InterPro2GO coverage gap; ProTrek does not recover it.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/CAEEL/A0A061AL94/A0A061AL94-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0015948
      label: methanogenesis
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: TAXON_CONSTRAINT_VIOLATION
      summary: >-
        Top-ranked hit (score 11.39). Methanogenesis is restricted to methanogenic archaea
        and is impossible in a nematode. The likely path is real but useless: MCM proteins
        are AAA+ ATPases of archaeal ancestry, so a 74-aa MCM fragment can land near archaeal
        sequences in the embedding space, and the archaeal text in SwissProt is dominated by
        methanogen metabolism. A taxon-constraint filter of the kind ProtNLM2's Evidencer
        applies would reject this before a user ever saw it.
      supported_by:
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-uniprot.txt
          supporting_text: DNA replication licensing factor mcm-4
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0051911
      label: Methanosarcina-phenazine hydrogenase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: TAXON_CONSTRAINT_VIOLATION
      summary: >-
        Rank 2 (score 10.75). A genus-specific membrane-bound hydrogenase activity, wrong on
        every axis - taxon, cofactor requirement, fold and function. Notable for how specific
        the assertion is at a score this low: the retrieval never signals uncertainty by
        returning a general term, only by returning a low number.
      supported_by:
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-uniprot.txt
          supporting_text: DNA replication licensing factor mcm-4
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0051912
      label: CoB--CoM heterodisulfide reductase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 3 (score 9.70). Third consecutive methanogen-metabolism call, and below 10 the
        output is not usefully distinguishable from noise; recorded as uncertain rather than
        as a third independent error. Taken together the five hits for this query are the
        benchmark's worst result, and the reason is diagnosable from the input alone: a 74-aa
        fragment carrying one winged-helix domain does not contain enough of the protein for
        a whole-sequence embedding to place it. Users of retrieval-based annotation should
        treat short predicted isoforms as out of scope rather than as hard cases.
      supported_by:
        - reference_id: file:CAEEL/A0A061AL94/A0A061AL94-uniprot.txt
          supporting_text: DNA replication licensing factor mcm-4
