  review:
    summary: >-
      TreeGrafter places the protein in a membrane from the family node. Many
      members of the [NiFe] hydrogenase small subunit family (for example the
      Escherichia coli Hyd-1 and Hyd-2 small subunits) carry a C-terminal
      membrane anchor, but this protein does not: it is a soluble periplasmic
