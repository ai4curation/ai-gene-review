suggested_questions:
- question: >-
    Does the ATCC 27774 periplasmic [NiFe] hydrogenase transfer electrons to
    acceptors other than the tetrahaem cytochrome c3 (for example the type II
    cytochrome c3 or the Hmc/Tmc transmembrane complexes), and with what kinetic
    preference?
- question: >-
    Is the H2-dependent reduction of soluble metal ions such as Pd(II) reported for
    whole Desulfovibrio cells catalysed at this enzyme, or is the enzyme only the
    source of low-potential electrons that reduce the metal non-enzymatically at the
    cell surface?
suggested_experiments:
- description: >-
    Purify the heterodimer from ATCC 27774 and measure H2 oxidation with the
    tetrahaem cytochrome c3 and with alternative periplasmic cytochromes as
    acceptors, comparing steady-state rates and Km values.
  hypothesis: >-
    The tetrahaem cytochrome c3 is the kinetically preferred acceptor at the distal
    [4Fe-4S] cluster, as predicted by the docking study of the structure paper.
- description: >-
    Incubate the purified enzyme with Pd(II) under H2 in the presence and absence of
    cytochrome c3 and compare Pd(0) nanoparticle formation with that of enzyme-free
    and heat-inactivated controls.
  hypothesis: >-
    Pd(II) reduction requires catalytically competent enzyme rather than adventitious
    reduction by dissolved H2, and proceeds without the physiological acceptor.
- description: >-
    Construct a markerless deletion of the Ddes_1038-Ddes_1039 operon in ATCC 27774
    and test H2-dependent Pd(II) and Tc(VII) reduction by resting cells against the
    wild type.
  hypothesis: >-
    The periplasmic [NiFe] hydrogenase is required for H2-dependent metal reduction
    at the cell surface, the inference that Lloyd et al. could not test genetically.
