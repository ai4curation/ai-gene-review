    summary: >-
      TreeGrafter assigns electron transfer activity from the [NiFe]/[NiFeSe]
      hydrogenase small subunit family node. This is the small subunit's own
      molecular function: it binds two [4Fe-4S] clusters and one [3Fe-4S] cluster
      that form the electron relay from the Ni-Fe active site of the large subunit
      to the external acceptor, with the distal [4Fe-4S] cluster forming the
      docking interface with tetrahaem cytochrome c3.
    action: ACCEPT
    reason: >-
      The claim is specific to this chain and is supported by the structure of this
      very enzyme, in which the cluster chain runs from the distal cluster (the
      cytochrome c3 docking site) up to the [NiFe] centre, and by the curated
      cofactor content of the entry. Electron transfer, not a merely structural
      role, is what this subunit does, so it is retained as the core molecular
      function.
