    studies of its interaction with the tetrahaem cytochrome c3.'
  findings:
  - statement: The crystal structure of the [NiFe] hydrogenase of this strain was
      determined at 1.8 A, showing the iron-sulfur cluster chain of the small subunit
      running up to the [NiFe] centre of the large subunit.
    supporting_text: >-
