    summary: >-
      TreeGrafter assigns anaerobic respiration from the [NiFe] hydrogenase small
      subunit family node. Desulfovibrio periplasmic [NiFe] hydrogenase oxidises H2
      on the periplasmic face and passes the electrons to the tetrahaem cytochrome
      c3 pool, the entry point of the anaerobic (sulfate) respiratory chain of these
      strictly anaerobic sulfate reducers.
    action: ACCEPT
    reason: >-
      The subunit performs part of the work of the process rather than merely being
      required for it: it conducts the electrons released by H2 oxidation to the
      periplasmic cytochrome acceptor, which is the respiratory electron transfer
      step. The term is at the right level of generality for what is established
      here; a more specific process (e.g. dissimilatory sulfate reduction) would
      assert a coupling that has not been tested for this particular hydrogenase in
