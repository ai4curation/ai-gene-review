  review:
    summary: >-
      The EC/Rhea mapping assigns the holoenzyme reaction (2 Fe(III)-[cytochrome c3]
      + H2 = 2 Fe(II)-[cytochrome c3] + 2 H+, EC 1.12.2.1) to this chain with an
      enables qualifier. The reaction is the right one for the enzyme, but H2
