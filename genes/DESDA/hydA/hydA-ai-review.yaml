id: P13061
gene_symbol: hydA
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:525146
  label: Desulfovibrio desulfuricans ATCC 27774
description: >-
  Small (beta) subunit of the periplasmic [NiFe] hydrogenase of Desulfovibrio
  desulfuricans ATCC 27774 (hydA, Ddes_1039). It is synthesised with a
  twin-arginine (Tat) signal peptide and exported to the periplasm, where it
  forms a soluble heterodimer with the catalytic large subunit. The small
  subunit carries the iron-sulfur relay of the enzyme, two [4Fe-4S] clusters
  and one [3Fe-4S] cluster, which conducts electrons between the bimetallic
  Ni-Fe active site of the large subunit and the external redox partner; the
  distal [4Fe-4S] cluster is the docking site for the physiological acceptor,
  the tetrahaem cytochrome c3. In sulfate-reducing bacteria this periplasmic
  H2-oxidising enzyme feeds electrons from molecular hydrogen into the
  periplasmic cytochrome pool and hence into anaerobic (sulfate) respiration.
