      annotation is not false about the enzyme, so it is kept rather than removed,
      and the relationship is recorded accurately in core_functions as
      contributes_to_molecular_function. The large subunit (UniProtKB:Q9L868) holds
      the Ni and Fe ligands and carries this activity in its own right.
