- id: PMID:3322275
  title: Identification of three classes of hydrogenase in the genus, Desulfovibrio.
  findings:
  - statement: Amino-terminal sequencing of large and small subunits distinguishes
      the iron, iron+nickel and iron+nickel+selenium hydrogenase classes of
      Desulfovibrio; this work determined residues 50-67 of the mature small subunit
      of the ATCC 27774 enzyme.
    supporting_text: >-
      A comparison of amino-terminal amino acid sequences from the large and small
      subunits of hydrogenases from Desulfovibrio reveals significant differences.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt as the source of the experimentally determined mature
      N-terminus (PROTEIN SEQUENCE OF 50-67), which is what anchors the Tat signal
      peptide cleavage position used here; abstract-only in the cache.
- id: PMID:9797331
  title: Enzymatic recovery of elemental palladium by using sulfate-reducing bacteria.
  findings:
  - statement: H2-dependent reduction of Pd(II) to cell-surface Pd(0) by resting
      Desulfovibrio desulfuricans cells was attributed to hydrogenase activity on
      the basis of H2 dependence and Cu2+ sensitivity, without genetic confirmation.
    supporting_text: >-
      the lack of molecular genetic studies on D. desulfuricans makes confirmation
      with specific deletion mutants difficult, but the involvement of hydrogenase
      activity is strongly implicated
  - statement: Metal reduction in this organism is localised to the periplasm, the
      compartment in which this hydrogenase operates.
    supporting_text: >-
      the site of metal reduction and precipitation is the periplasm
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified via DOI 10.1128/AEM.64.11.4607-4609.1998; full text cached.
      Relevant as the study that motivates this review, but it used strain
      ATCC 29577, not ATCC 27774, and implicates "hydrogenase activity" generically
      rather than this gene product, so it supports no annotation on this entry.
- id: PMID:18689514
  title: Bioaccumulation of palladium by Desulfovibrio fructosivorans wild-type and
    hydrogenase-deficient strains.
  findings:
  - statement: Hydrogenase mutants of a different Desulfovibrio species still reduced
      Pd(II), with nanoparticle location tracking the remaining hydrogenase, so no
      single hydrogenase is established as necessary for Pd(0) deposition.
    supporting_text: >-
      Wild-type Desulfovibrio fructosivorans and three hydrogenase-negative mutants
      reduced Pd(II) to Pd(0).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified via DOI 10.1128/AEM.02538-07; abstract-only in the cache.
      Background for the metal-reduction context only: the genetics are in
      D. fructosivorans, a different species from the one annotated here.
