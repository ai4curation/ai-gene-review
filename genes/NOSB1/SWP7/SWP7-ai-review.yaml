core_functions:
- description: SWP7 is a secreted, non-catalytic constituent of the Nosema bombycis mature spore wall.
    Deposited from the sporont and sporoblast cytoplasm into the two-layered wall in a complex with its
    scaffold partner SWP9, it occupies the proteinaceous exospore and the chitin-rich endospore and forms
    part of the adhesive outer surface of the spore, since masking SWP7 with antibody reduces attachment
    of spores to host cells and subsequent infection. Its molecular activity is undefined. The authors'
    structural claim for SWP7 is explicitly hedged, and the obvious candidate activities belong to its
    partner rather than to SWP7 itself, because recombinant SWP7 binds the chitin spore coat only after
    SWP9 is bound and does not bind the polar tube proteins PTP1 or PTP2; no molecular_function term is
    therefore asserted here.
