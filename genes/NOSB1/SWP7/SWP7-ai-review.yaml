id: B3STP1
gene_symbol: SWP7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:578461
  label: Nosema bombycis CQ1
description: SWP7 is a secreted, non-catalytic spore wall protein of Nosema bombycis, the microsporidian
  agent of pebrine disease in the silkworm. It is a 287-residue precursor with an N-terminal signal peptide
  and is the founding member of its own protein family (Pfam PF29448 / InterPro IPR062164), with no catalytic
  domain or recognizable enzymatic signature. It was first recovered from the spore wall proteome as HSWP7
  and later characterized directly; during sporogony it is found in the cytoplasm of sporonts and sporoblasts,
  and in mature spores it is deposited in the two-layered spore wall, where it is reported in both the
  proteinaceous exospore and the chitin-rich endospore, and additionally in the polar tube, the extrusion
  organelle through which the parasite injects its sporoplasm into a host cell. SWP7 forms a complex with
  the larger spore wall protein SWP9, demonstrated by immunoprecipitation, far-Western blotting, unreduced
  SDS-PAGE and yeast two-hybrid assays. The partnership is asymmetric. SWP9 acts as the scaffold, binding
  the deproteinated chitin spore coat and the polar tube proteins PTP1 and PTP2 directly, whereas recombinant
  SWP7 reaches the chitin coat only when SWP9 is already bound, does not bind PTP1 or PTP2, and is thought
  to be carried to the polar tube by SWP9. Functionally, masking SWP7 on the spore surface with anti-SWP7
  antibody reduces spore adhesion to, and infection of, cultured host cells, placing SWP7 on the adhesive
  outer surface of the spore and implicating it in attachment of the spore to the host cell. Because microsporidia
  lack transfection and gene-knockout systems, antibody and recombinant-protein competition are the only
  functional assays applied to this protein, and no receptor or host-cell ligand has been identified.
