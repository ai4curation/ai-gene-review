    reference_section_type: DATABASE_ENTRY
  knowledge_gaps:
  - gap_statement: Whether SWP7 itself makes the contact with the host cell, or whether anti-SWP7 blocks
      adhesion by coating a wall whose adhesin is a different spore wall protein, is undetermined; no host-cell
      receptor or ligand for the N. bombycis spore wall has been identified.
    boundary: Established that anti-SWP7 antibody reduces spore adhesion to and infection of cultured host
      cells, and that SWP7 is deposited in the exospore and endospore of mature spores. Not established
      that purified SWP7 binds any host-cell surface component.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: Spore wall adhesins are the proposed targets for blocking pebrine transmission in sericulture,
      and a competition assay result cannot be converted into a target without knowing which protein binds
      what.
    resolution: Direct binding assays with purified SWP7 against host cell surfaces or candidate receptor
      fractions, and adhesion competition with purified rSWP7 rather than with its antibody.
    provenance:
    - reference_id: PMID:25605761
      supporting_text: little is known regarding the mechanism by which it is deposited or the role it
        plays in cell adhesion and infection
      reference_section_type: ABSTRACT
  - gap_statement: The molecular activity of SWP7 is unknown. It is not established whether SWP7 contributes
      structural integrity to the spore wall or is only cargo deposited and positioned by SWP9.
    boundary: Established that SWP7 binds SWP9, that it reaches the chitin spore coat only when SWP9 is
      bound, and that it does not bind PTP1 or PTP2. The authors' structural claim for SWP7 is hedged ("may
      have important structural capacities"), and no wall-integrity measurement has been made on an SWP7-depleted
      spore.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    resolution: A wall-integrity readout (mechanical, alkaline or chitinase resistance, or ultrastructure)
      on spores depleted of SWP7, or in vitro reconstitution of wall assembly from purified SWP9, SWP7
      and chitin coats.
    provenance:
    - reference_id: PMID:25605761
      supporting_text: SWP7 and SWP9 may have important structural capacities
      reference_section_type: ABSTRACT
proposed_new_terms:
- proposed_name: microsporidian exospore
  proposed_definition: The outer layer of the microsporidian spore wall, an electron-dense, mainly proteinaceous
    and glycoprotein-rich layer lying external to the endospore and to the plasma membrane.
  justification: SWP7 and other N. bombycis spore wall proteins are localized by immunoelectron microscopy
    to a specific layer of the spore wall, but GO:0031160 spore wall has no microsporidian children. Its
    existing children are GO:0005619 ascospore wall, GO:0043591 endospore external encapsulating structure
    (the bacterial endospore coat, not the microsporidian endospore), GO:0097514 sexual spore wall and
    GO:0097515 asexual spore wall, none of which fits. Layer-resolved localizations for this gene family
    therefore cannot be recorded at the granularity at which they are measured.
  proposed_parent:
    id: GO:0031160
    label: spore wall
  supported_by:
  - reference_id: PMID:18563739
    supporting_text: protected by a thick spore wall composed of a glycoprotein-rich outer layer or exospore
      and a chitin-rich inner layer or endospore
    reference_section_type: ABSTRACT
  - reference_id: PMID:25605761
    supporting_text: SWP7 and SWP9 are mainly localized to the exospore and endospore of mature spores
      and the cytoplasm of sporonts, respectively.
    reference_section_type: ABSTRACT
- proposed_name: microsporidian endospore
  proposed_definition: The inner layer of the microsporidian spore wall, an electron-lucent, chitin- and
    protein-rich layer lying between the exospore and the plasma membrane.
  justification: Needed for the same reason as microsporidian exospore, and distinct from GO:0043591 endospore
    external encapsulating structure, which describes the peptidoglycan and proteinaceous coat of a bacterial
    endospore and is not homologous to the chitinous microsporidian endospore. The deproteinated chitin
    spore coat used in the N. bombycis binding assays is this layer.
  proposed_parent:
    id: GO:0031160
    label: spore wall
  supported_by:
  - reference_id: PMID:29522765
    supporting_text: 'a rigid cell wall which consists of three layers: the electron-lucent chitin and
      protein inner endospore, the outer-electron-dense and mainly proteinaceous exospore and plasma membrane'
    reference_section_type: ABSTRACT
  - reference_id: PMID:18563739
