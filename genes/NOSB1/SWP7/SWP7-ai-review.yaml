    summary: SWP7 is a constituent of the mature spore wall, colocalizing there with SWP9; this is the
      protein's defining location and GO:0031160 is the deepest term GO offers for it.
    action: ACCEPT
    reason: Spore wall residence is the central, repeatedly demonstrated localization for SWP7. It was
      first recovered in the N. bombycis spore wall proteome as one of fourteen hypothetical spore wall
      proteins (PMID:18563739, the reference UniProt cites for identification by mass spectrometry and
      subcellular location), then localized directly by immunofluorescence and immunoelectron microscopy
      to the exospore and endospore of mature spores and shown to colocalize with SWP9 in the wall (PMID:25605761),
      and confirmed again by immunoelectron microscopy in PMID:28031263. The papers resolve the location
      to individual wall layers, but GO cannot express that, because the only children of GO:0031160 are
      GO:0005619 ascospore wall, GO:0043591 endospore external encapsulating structure (a bacterial structure,
      not the microsporidian endospore), GO:0097514 sexual spore wall and GO:0097515 asexual spore wall
      (checked via OLS, 2026-10-29). GO:0031160 is therefore as precise as the ontology allows, and the
      missing exospore and endospore terms are filed under proposed_new_terms rather than forced onto an
      ill-fitting child.
