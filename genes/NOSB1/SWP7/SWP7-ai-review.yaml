- id: PMID:25605761
  title: Interaction and assembly of two novel proteins in the spore wall of the microsporidian species
    Nosema bombycis and their roles in adherence to and infection of host cells.
  findings:
  - statement: SWP7 is localized to the exospore and endospore of mature N. bombycis spores and colocalizes
      there with SWP9.
    supporting_text: Both SWP7 and SWP9 are specifically colocalized to the spore wall in mature spores.
    reference_section_type: ABSTRACT
  - statement: SWP7 interacts with SWP9, shown by four independent assays.
    supporting_text: immunoprecipitation, far-Western blotting, unreduced SDS-PAGE, and yeast two-hybrid
      data demonstrated that SWP7 interacted with SWP9
    reference_section_type: ABSTRACT
  - statement: Recombinant SWP7 does not bind the deproteinated chitin spore coat on its own; its binding
      requires SWP9 to be bound first. Chitin binding is therefore not a molecular function of SWP7.
    supporting_text: binding of the recombinant protein rSWP7-His to the DCSCs is dependent on the combination
      of rSWP9-glutathione S-transferase (GST) with the DCSCs
    reference_section_type: ABSTRACT
  - statement: Masking SWP7 on the spore surface with antibody reduces adhesion of spores to, and infection
      of, host cells.
    supporting_text: anti-SWP9, and anti-SWP7 antibodies decreased spore adhesion and infection of the
      host cell
    reference_section_type: ABSTRACT
  - statement: The authors' structural claim for SWP7 is hedged, and they frame SWP9 rather than SWP7 as
      the scaffold.
    supporting_text: A possible major function of SWP9 is as a scaffolding protein that supports other
      proteins (such as SWP7) that form the integrated spore wall of N. bombycis
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Infect Immun 83:1715-1731, 2015; DOI 10.1128/IAI.03155-14). This is
      the source behind every experimental GOA row on SWP7 and it is genuinely about this gene, which is
      named in the title's subject matter and throughout the abstract. The cached record is abstract-only
      (full_text_available false); the article is in PMC4363453 but is not open access, so neither Europe
      PMC fullTextXML nor the PMC page could be retrieved, and the GONUTS wiki page for this PMID was offline
      on 2026-10-29. Claims attributed to the full text, notably the polar tube localization that the abstract
