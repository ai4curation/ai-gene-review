      and a chitin-rich inner layer or endospore
    reference_section_type: ABSTRACT
suggested_questions:
- question: Does purified SWP7 bind any host-cell surface component directly, or is the anti-SWP7 adhesion
    block a steric effect on a neighbouring adhesin in the exospore?
  experts:
  - Donglin Yang
  - Guoqing Pan
  - Zeyang Zhou
- question: Is SWP7 required for spore wall integrity, or is it purely a client deposited by the SWP9 scaffold?
  experts:
  - Donglin Yang
  - Guoqing Pan
- question: Is the SWP7 family (Pfam PF29448) conserved across microsporidia beyond Nosema, and do the
    orthologues occupy the same wall layers and partner with an SWP9 orthologue?
  experts:
  - Guoqing Pan
  - Zeyang Zhou
- question: Should GO acquire microsporidian exospore and endospore cellular-component terms under GO:0031160,
    given that the whole N. bombycis spore wall protein literature reports layer-resolved immunoelectron
    localizations?
  experts: []
suggested_experiments:
- hypothesis: SWP7 is itself an adhesin that contacts the host cell surface.
  description: Compare adhesion of N. bombycis spores to cultured BmN or Sf9 cells in the presence of purified
    rSWP7 versus rSWP9 and versus an irrelevant recombinant protein of the same tag and size, and in parallel
    assay direct binding of immobilized rSWP7 to intact host cells and to host cell surface extracts (ELISA
    or pull-down followed by LC-MS/MS of the retained host proteins). A competition block by soluble rSWP7
    plus identification of a retained host ligand would show direct adhesion; a block by anti-SWP7 alone,
    with no soluble-protein competition and no ligand, would indicate steric masking.
  experiment_type: adhesion competition and receptor identification
- hypothesis: SWP7 contributes structural integrity to the spore wall rather than merely being deposited
    in it.
  description: Use a system in which SWP7 abundance can be lowered or its deposition blocked (RNAi or antibody
    pre-loading in an in vitro sporogony system, or heterologous expression of the SWP9-SWP7 pair on chitin
    coats), then measure wall integrity directly by transmission electron microscopy of exospore and endospore
    thickness and layering, resistance to hot alkaline and chitinase treatment, and germination rate. Reconstitute
    in vitro by layering purified rSWP9 and rSWP7 onto deproteinated chitin spore coats and testing whether
    SWP7 addition alters coat mechanical or chemical resistance.
  experiment_type: wall integrity and in vitro reconstitution
- hypothesis: SWP7 occupies both the exospore and the endospore as a single population carried by SWP9,
    rather than two independently targeted pools.
  description: Perform quantitative immunoelectron microscopy on mature spores with anti-SWP7 and anti-SWP9
    double labelling, counting gold particles per layer and measuring the SWP7 to SWP9 ratio in exospore
    versus endospore across sporogony stages. A constant ratio in both layers supports co-deposition as
    a complex; divergent ratios imply separate targeting routes and a distinct exospore function.
  experiment_type: quantitative immunoelectron microscopy
