  review:
    summary: Anti-SWP7 antibody reduces adhesion of N. bombycis spores to cultured host cells, placing
      SWP7 on the adhesive spore surface. This is the protein's core biological role and the term matches
      the readout exactly.
    action: ACCEPT
    reason: 'CACAO row (GOA ASSIGNED BY = CACAO, 2015-02-10). What the paper shows for this gene: an antibody
      and recombinant-protein competition experiment in which rSWP9-GST, anti-SWP9 and anti-SWP7 antibodies
      each decreased spore adhesion to, and infection of, the host cell; the authors conclude the two proteins
      play significant roles in modulating host cell adherence and infection in vitro. UniProt curates
      the same result as "Involved in adherence of spores to the host cell surface and in infection efficiency"
      with ECO:0000269|PubMed:25605761, and the entry carries keyword Cell adhesion. The term matches the
      assay and is on the correct branch, OLS recording that GO:0075004 must only be used for symbiont
      gene products, which is what SWP7 is. Notably the student annotated the direct readout, adhesion,
      and did not also annotate the downstream infection phenotype, so this is not a phenotype read as
      a process. On the participation test, blocking a surface-exposed exospore protein with its own antibody
      and losing adhesion indicates that SWP7 forms part of the adhesive interface rather than being merely
      required upstream, which is what the involved_in claim asserts; the antibody-masking design cannot
      by itself exclude steric masking of a neighbouring adhesin, which is recorded as a knowledge gap.
      Microsporidia have no transfection or knockout system, so competition assays of this kind are the
      only functional handle available for the protein.'
