  review:
    summary: SWP7 interacts with the spore wall protein SWP9 (R0MLT0), shown by four orthogonal assays.
      The interaction is real and important, but bare protein binding conveys no molecular function.
    action: REMOVE
    reason: 'The SWP7-SWP9 interaction is among the best-supported facts about this protein, demonstrated
      by immunoprecipitation, far-Western blotting, unreduced SDS-PAGE and yeast two-hybrid (PMID:25605761),
      and curated by UniProt as a SUBUNIT statement. Removal follows the repository''s protein-binding
      policy and does not dispute the interaction: GO:0005515 is uninformative and slated for do-not-annotate.
      It is not replaced by a more specific molecular function because the evidence rules out the obvious
      candidates for SWP7 itself. Chitin binding belongs to SWP9, not to SWP7, because recombinant rSWP7-His
      reaches the deproteinated chitin spore coats only after rSWP9-GST is bound (PMID:25605761), so SWP7''s
      association with the endospore chitin is piggybacked. Polar tube protein binding likewise belongs
      to SWP9, since coimmunoprecipitation, LC-MS/MS and yeast two-hybrid show that SWP9, but not SWP7,
      interacts with PTP1 and PTP2 (PMID:28031263). The one structural statement about SWP7 is hedged by
      the authors themselves ("may have important structural capacities"), which is not a basis for asserting
      a structural molecule activity here.'
