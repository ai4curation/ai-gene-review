id: Q9FA54
gene_symbol: opgG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272943
  label: Cereibacter sphaeroides 2.4.1
description: OpgG is a secreted periplasmic OpgG-family protein with a predicted carbohydrate-binding
  domain required for osmoregulated periplasmic glucan synthesis in Cereibacter sphaeroides 2.4.1. It
  works with the membrane glycosyltransferase OpgH and small OpgI protein. Its precise catalytic contribution
  is unresolved; glucan cyclization has been proposed but not demonstrated for this protein. The related
  WS8 strain produces predominantly cyclic 18-glucose polymers containing 17 beta1,2 bonds and one alpha1,6
  closure.
