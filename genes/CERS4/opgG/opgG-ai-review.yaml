  review:
    action: MODIFY
    summary: OpgG participates specifically in OPG backbone biosynthesis.
    reason: The broad process is sound. Native2.4.1 AP5 loses OPG production and opgG-only pNFR20 restores
      it, excluding a downstream polar explanation. OpgG-family carbohydrate-binding architecture supports
      a biosynthetic partner role; the exact catalytic rearrangement remains unassigned. Refine to GO:1900727,
      a verified descendant of this term. The independent beta-glucan row describes linkage class and
      is not an ancestor of GO:1900727.
