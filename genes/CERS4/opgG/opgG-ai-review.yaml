    id: GO:0051274
    label: beta-glucan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002021010
  review:
    action: ACCEPT
    summary: OpgG supports synthesis of the beta-linked OPG backbone.
    reason: Native2.4.1 OpgG participates in OPG synthesis; the species-comparative WS8 structural study
      establishes predominantly beta1,2 linkages with a single alpha1,6 closure. A mixed-linkage cyclic
      glucan is not thereby excluded from beta-glucans. Retain this inferred linkage-class process without
      claiming direct2.4.1 NMR or attributing the cyclization reaction to OpgG.
    supported_by:
    - reference_id: PMID:12027885
      supporting_text: 'Inactivation of opgG, opgI or opgH

        abolished OPG production'
    - reference_id: file:genes/CERS4/opgG/opgG-source-analysis/identity-and-assay-scope.md
      supporting_text: OPG production in various opg mutants of R. sphaeroides 2.4.1.
    - reference_id: PMID:12027884
      supporting_text: 'all other glucose

        residues are beta-1,2 linked'
