- term:
    id: GO:1900727
    label: osmoregulated periplasmic glucan biosynthetic process
  evidence_type: IC
  original_reference_id: PMID:12027885
  review:
    action: NEW
    summary: OpgH contributes the inferred glucose-transfer step of OPG biosynthesis.
    reason: Participation is supported by GT2 catalytic architecture plus OpgIH-dependent restoration
      of glucan synthesis in an Ecoli mdoH mutant, in addition to native 2.4.1 loss/rescue. OpgH is the
      inferred glucosyltransferase, not merely a required substrate. The exact donor clone/sequence is
      bridged through AF016298. This BP has glucan/carbohydrate biosynthesis parents, fits the synthesis
      machinery, and duplicates neither an existing nor proposed BP because the two seeded rows are MF/CC.
      Same-role comparator checks found Ecoli OpgH P62517 annotated to this process by IDA/IMP/IBA and
      Salmonella OpgH Q8ZQ26 by IBA; Pseudomonas Q88D04 has only broader glucan biosynthesis. Those annotations
      check convention, not experimental support. No target GO-CAM index entry was found. Product closure
      and OpgI biochemical versus translational contributions remain unresolved.
    supported_by:
    - reference_id: PMID:12027885
      supporting_text: 'Inactivation of opgG, opgI or opgH

        abolished OPG production'
    - reference_id: file:genes/CERS4/opgG/opgG-source-analysis/identity-and-assay-scope.md
      supporting_text: OPG production in various opg mutants of R. sphaeroides 2.4.1.
