id: Q9FA52
gene_symbol: opgH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272943
  label: Cereibacter sphaeroides 2.4.1
description: OpgH is a multipass inner-membrane GT2-family glucosyltransferase that supports osmoregulated
  periplasmic glucan backbone synthesis in Cereibacter sphaeroides 2.4.1, together with OpgG and OpgI.
  Its native locus is genetically required for OPG production. Heterologous OpgIH expression restores
  linear glucan production to an Escherichia coli mdoH mutant, demonstrating context-dependent product
  formation; it does not establish autonomous cyclization by OpgH.
