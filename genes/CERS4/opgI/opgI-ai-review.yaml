knowledge_gaps:
- gap_statement: The molecular work performed by OpgI during native OPG synthesis is unknown; an ACP-like
    accessory activity has not been demonstrated.
  boundary: Native2.4.1 insertion/complementation establishes an opgI requirement, and the corrected 66-residue
    ORF maps exactly to Q3J1N3. Heterologous opgIH restoration does not separate a protein cofactor from
    translational coupling.
