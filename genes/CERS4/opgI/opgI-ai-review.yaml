taxon:
  id: NCBITaxon:272943
  label: Cereibacter sphaeroides 2.4.1
description: OpgI is a small 66-residue protein encoded between opgG and opgH in Cereibacter sphaeroides
  2.4.1. Its locus is required for native osmoregulated periplasmic glucan production and can be complemented
  in trans with appropriately expressed opgI. The protein-specific molecular contribution is unresolved.
  An ACP-like accessory role has been proposed, while translational coupling remains an alternative explanation
  for its contribution to heterologous OpgH expression.
