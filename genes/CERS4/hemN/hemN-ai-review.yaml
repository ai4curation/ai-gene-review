- term:
    id: GO:0006779
    label: porphyrin-containing compound biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004558
  - PANTHER:PTN008552846
  review:
    summary: >-
      Combined electronic assignment of the generic porphyrin biosynthesis process. HemN makes
      protoporphyrinogen IX, the common precursor of protoheme and of bacteriochlorophyll in
      R. sphaeroides.
    action: MODIFY
    reason: >-
      Correct but general; two specific descendants are supported. (1) GO:0030494
      bacteriochlorophyll biosynthetic process (is_a GO:0006779): the hemN mutant N1 makes no
      bacteriochlorophyll and excretes coproporphyrin III, the HemN substrate, and the gene is
      described as the oxidase dedicated to bacteriochlorophyll biosynthesis. (2) GO:0006785 heme
      B biosynthetic process: the protoporphyrinogen IX that HemN produces is also the precursor of
      protoheme, and this is the endpoint used for the E. coli and P. putida orthologs. Under
      aerobic conditions HemF supplies this step, so the heme contribution of HemN is expected
      under low oxygen. Both are listed, as for a step on a shared trunk.
    proposed_replacement_terms:
    - id: GO:0030494
      label: bacteriochlorophyll biosynthetic process
    - id: GO:0006785
      label: heme B biosynthetic process
    supported_by:
    - reference_id: PMID:1333567
      supporting_text: >-
        A mutant of Rhodobacter sphaeroides, N1, has been isolated which is incapable of
        photosynthetic growth and, instead of synthesizing bacteriochlorophyll, N1 excretes
        coproporphyrin III into the growth medium.
    - reference_id: PMID:1333567
      supporting_text: >-
        which is proposed as the anaerobic coproporphyrinogen III oxidase dedicated to
        bacteriochlorophyll biosynthesis.
    - reference_id: PMID:14633981
      supporting_text: >-
        HemN catalyzes the essential conversion of coproporphyrinogen III to protoporphyrinogen IX
        during heme biosynthesis.
