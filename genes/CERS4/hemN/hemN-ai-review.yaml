    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IC
  original_reference_id: file:CERS4/hemN/hemN-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      Proposed addition, matching the E. coli and P. putida HemN reviews: HemN binds two SAM
      molecules, one coordinating the [4Fe-4S] cluster.
    action: NEW
    reason: >-
      Not in GOA. SAM is the cosubstrate that the cluster cleaves to the 5'-deoxyadenosyl radical,
      and binding it is a molecular function the protein itself performs. The UniProt record
      lists the SAM-binding residues of both SAM sites by similarity to the E. coli structure,
      in which two SAM molecules were resolved. Comparator check: E. coli HemN carries this term
      (IDA, PMID:14633981, added in genes/ECOLI/hemN), as does the P. putida review.
    supported_by:
