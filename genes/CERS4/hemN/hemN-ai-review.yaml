id: P33770
gene_symbol: hemN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272943
  label: Cereibacter sphaeroides 2.4.1
description: >-
  HemN is an oxygen-independent coproporphyrinogen III oxidase (coproporphyrinogen dehydrogenase,
  EC 1.3.98.3) of the purple non-sulfur photosynthetic bacterium Cereibacter (Rhodobacter)
  sphaeroides 2.4.1. This soluble cytoplasmic radical S-adenosyl-L-methionine (SAM) enzyme carries
  a [4Fe-4S] cluster bound by three cysteines of the CxxxCxxC motif and an exchangeable SAM. It
  uses two SAM molecules to decarboxylate the 2- and 4-propionate side chains of coproporphyrinogen
  III, giving protoporphyrinogen IX, 5'-deoxyadenosine, methionine and CO2. Protoporphyrinogen IX is
  the common precursor of protoheme and of the magnesium branch that leads to bacteriochlorophyll.
  A transposon-disrupted mutant cannot grow photosynthetically, makes no bacteriochlorophyll and
  excretes coproporphyrin III, so this enzyme supplies the tetrapyrrole flux for the
  photosynthetic apparatus under low oxygen. An oxygen-dependent HemF-type oxidase is needed for
  aerobic growth in the same organism.
