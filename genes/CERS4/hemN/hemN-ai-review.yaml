        exchangeable S-adenosyl-L-methionine.
    - reference_id: PMID:14633981
      supporting_text: >-
        HemN, strikingly, binds a second SAM immediately adjacent to the first.
core_functions:
- description: >-
    HemN is a radical SAM enzyme that converts coproporphyrinogen III to protoporphyrinogen IX
    without oxygen, using two SAM molecules and a [4Fe-4S] cluster in the cytoplasm. In
    R. sphaeroides it supplies protoporphyrinogen IX for bacteriochlorophyll synthesis, and also
    for protoheme, during low-oxygen and photosynthetic growth.
  molecular_function:
    id: GO:0051989
    label: coproporphyrinogen dehydrogenase activity
