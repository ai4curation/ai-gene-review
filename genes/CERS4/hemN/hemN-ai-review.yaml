      photosynthetic growth and, instead of synthesizing bacteriochlorophyll, N1 excretes
      coproporphyrin III into the growth medium.
  - reference_id: PMID:14633981
    supporting_text: >-
      HemN catalyzes the essential conversion of coproporphyrinogen III to protoporphyrinogen IX
      during heme biosynthesis.
  - reference_id: file:CERS4/hemN/hemN-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: >-
      Reaction=coproporphyrinogen III + 2 S-adenosyl-L-methionine = protoporphyrinogen IX + 2
      5'-deoxyadenosine + 2 L-methionine + 2 CO2;
suggested_questions:
- question: >-
    Does R. sphaeroides HemN contribute to protoheme synthesis under anaerobic respiratory
    conditions, or is its product channelled mainly into bacteriochlorophyll, with the
    HemN-like HemZ or HemF covering heme?
suggested_experiments:
- description: >-
    Measure heme and bacteriochlorophyll content and coproporphyrin excretion in hemN, hemF and
    hemN hemF mutants grown aerobically, semi-aerobically and phototrophically, and assay
    purified anaerobic HemN for SAM-dependent protoporphyrinogen IX formation.
