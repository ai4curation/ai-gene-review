- term:
    id: GO:0004109
    label: coproporphyrinogen oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004558
  review:
    summary: >-
      InterPro2GO mapping from the HemN family signature (IPR004558) to the oxygen-dependent
      coproporphyrinogen oxidase term.
    action: MODIFY
    reason: >-
      The step (coproporphyrinogen III to protoporphyrinogen IX) is right but the chemistry is
      wrong. GO:0004109 is defined as "Catalysis of the reaction: coproporphyrinogen III + 2 H+ +
      O2 = 2 CO2 + 2 H2O + protoporphyrinogen IX", the HemF-type O2-dependent reaction. HemN is
      oxygen-independent and uses SAM; GO:0051989 is defined as "Catalysis of the reaction:
      coproporphyrinogen III + 2 S-adenosyl-L-methionine = protoporphyrinogen IX + 2 CO2 + 2
      L-methionine + 2 5'-deoxyadenosine". R. sphaeroides has a separate HemF for the O2-dependent
      reaction. Lateral correction to GO:0051989, the same correction made for E. coli and P.
      putida HemN. The IPR004558 to GO:0004109 mapping is a systematic InterPro2GO error for the
      HemN family.
    proposed_replacement_terms:
    - id: GO:0051989
      label: coproporphyrinogen dehydrogenase activity
    supported_by:
    - reference_id: file:CERS4/hemN/hemN-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=coproporphyrinogen III + 2 S-adenosyl-L-methionine = protoporphyrinogen IX + 2
        5'-deoxyadenosine + 2 L-methionine + 2 CO2;
    - reference_id: PMID:16385070
      supporting_text: >-
        The hemF gene of Rhodobacter sphaeroides 2.4.1 is predicted to code for an
        oxygen-dependent coproporphyrinogen III oxidase.
