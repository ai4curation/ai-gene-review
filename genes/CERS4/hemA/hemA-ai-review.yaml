- term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004839
  - InterPro:IPR010961
  review:
    summary: >-
      InterPro2GO mapping of PLP binding. Purified R. sphaeroides HemA requires PLP for activity,
      and spectroscopy shows the enzyme-bound aldimine.
    action: ACCEPT
    reason: >-
      Experimentally supported for this protein: removal of PLP gives inactive apo-enzyme and
      borohydride reduction of the HemA-PLP complex inactivates it. PLP is the catalytic cofactor,
      so its binding is intrinsic to the core activity.
    supported_by:
    - reference_id: PMID:10491185
      supporting_text: >-
        In common with other ALASs the recombinant R. sphaeroides HemA requires pyridoxal
        5'-phosphate (PLP) as a cofactor for catalysis. Removal of this cofactor resulted in
        inactive apo-ALAS.
    - reference_id: PMID:10491185
      supporting_text: >-
        Ultraviolet-visible spectroscopy with HemA suggested the presence of an aldimine linkage
        between the enzyme and pyridoxal 5'-phosphate
- term:
    id: GO:0033014
    label: tetrapyrrole biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010961
  review:
    summary: >-
      InterPro2GO mapping from the ALAS signature (IPR010961). In R. sphaeroides, ALA made by
      HemA feeds the branched pathway to hemes, bacteriochlorophylls and corrinoids.
    action: ACCEPT
    reason: >-
      Correct and informative for a photosynthetic bacterium: HemA catalyses the first step of
      the common trunk of all its tetrapyrrole branches, and hem mutants have lowered
      bacteriochlorophyll and light-harvesting complexes. The more specific heme branch is added
      below as a NEW row; the tetrapyrrole-level term is kept because ALA also supplies
      bacteriochlorophyll and corrinoids.
    supported_by:
    - reference_id: PMID:8468291
      supporting_text: >-
        This enzyme catalyzes the first and rate-limiting step in a branched pathway for
        tetrapyrrole formation, leading to the biosynthesis of hemes, bacteriochlorophylls, and
        corrinoids.
    - reference_id: PMID:8468291
      supporting_text: >-
        Mutants carrying a single hemA or hemT disruption grew well without the addition of ALA,
        whereas a mutant, HemAT1, in which hemA and hemT had both been inactivated required
        exogenous ALA for growth.
- term:
    id: GO:0006783
    label: heme biosynthetic process
  evidence_type: IC
  original_reference_id: PMID:8468291
  qualifier: involved_in
  review:
    summary: >-
      Proposed addition. HemA catalyses the first step of heme biosynthesis in R. sphaeroides;
      the Rhodobacter capsulatus ortholog already carries this term (TreeGrafter IEA).
    action: NEW
    reason: >-
      Participation test: HemA itself catalyses the entry step (5-aminolevulinate formation) of
      the heme pathway, so it does part of the work of the process rather than being merely
      required for it. GO:0006783 is defined as "The chemical reactions and pathways resulting in
      the formation of heme ... from less complex precursors". The cited paper places the enzyme
      at the head of the branch "leading to the biosynthesis of hemes"; HemA also complements an
      E. coli heme-pathway (hemA, glutamyl-tRNA reductase) mutant. Comparator check: other ALAS
      enzymes in the same role carry the term (human ALAS2 by IBA, R. capsulatus HemA by
      TreeGrafter), so this is an electronic coverage gap for this entry, not a curator
      convention.
    supported_by:
    - reference_id: PMID:8468291
      supporting_text: >-
        This enzyme catalyzes the first and rate-limiting step in a branched pathway for
        tetrapyrrole formation, leading to the biosynthesis of hemes, bacteriochlorophylls, and
        corrinoids.
    - reference_id: PMID:10491185
      supporting_text: >-
        Both HemA and HemT appeared to be active in vivo as plasmids carrying the respective genes
        complemented an E. coli hemA strain (glutamyl-tRNA reductase deficient).
core_functions:
- description: >-
    HemA catalyses the PLP-dependent condensation of glycine and succinyl-CoA to 5-aminolevulinate,
    the first and rate-limiting step of the branched tetrapyrrole pathway (hemes,
    bacteriochlorophylls, corrinoids) in R. sphaeroides 2.4.1. It is the dominant, expressed ALAS
    isozyme in this strain and is feedback-inhibited by hemin.
