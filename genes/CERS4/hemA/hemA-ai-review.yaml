id: Q04512
gene_symbol: hemA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272943
  label: Cereibacter sphaeroides 2.4.1
description: >-
  HemA is the major 5-aminolevulinate synthase (ALAS) of the purple non-sulfur photosynthetic
  bacterium Cereibacter (Rhodobacter) sphaeroides 2.4.1. This pyridoxal 5'-phosphate
  (PLP)-dependent enzyme of the class-II aminotransferase fold condenses glycine with
  succinyl-CoA to form 5-aminolevulinate, CO2 and CoA. This is the first and rate-limiting step
  of the branched tetrapyrrole pathway that leads to hemes, bacteriochlorophylls and corrinoids.
  Strain 2.4.1 also encodes a second isozyme, HemT, which is transcriptionally silent in wild-type
  cells. Either gene alone supports growth without added 5-aminolevulinate; only the double mutant
  is auxotrophic. hemA transcription increases under anaerobic, photosynthetic conditions. Purified
  HemA is a soluble, catalytically active enzyme that holds PLP as an aldimine and is
  feedback-inhibited by hemin.
