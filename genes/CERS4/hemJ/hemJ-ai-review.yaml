id: Q53229
gene_symbol: RHOS4_28450
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272943
  label: Cereibacter sphaeroides 2.4.1
description: >-
  Q53229 (locus RHOS4_28450 / RSP_1232, first described as orf1 upstream of rho) is the HemJ-type
  protoporphyrinogen IX oxidase of the purple non-sulfur photosynthetic bacterium Cereibacter
  (Rhodobacter) sphaeroides 2.4.1. It is a small integral membrane protein with four predicted
  transmembrane helices, of the former UPF0093/DUF420 family. HemJ catalyses the six-electron
  oxidation of protoporphyrinogen IX to protoporphyrin IX, the last step shared by the heme and
  bacteriochlorophyll branches. When the R. sphaeroides protein was expressed in Escherichia coli
  it had protoporphyrinogen oxidase activity in vitro. By similarity to the characterised
  cyanobacterial HemJ, it binds one heme b per subunit through two axial histidines and forms
  dimers. It does not use oxygen or artificial quinones as electron acceptor, and its
  physiological electron acceptor is unknown. HemJ is the protoporphyrinogen oxidase of most
  alpha-proteobacteria, which lack the HemY and HemG enzymes.
