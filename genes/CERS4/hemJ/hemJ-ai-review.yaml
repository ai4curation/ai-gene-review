knowledge_gaps:
- gap_statement: >-
    The physiological electron acceptor of HemJ is unknown. Purified cyanobacterial HemJ is
    inactive with oxygen and artificial quinones, and how the bound heme b passes electrons on
    (for example to the respiratory chain or to coproporphyrinogen oxidase) has not been shown.
  gap_kind:
  - BIOLOGY
  provenance:
  - reference_id: PMID:29925590
    supporting_text: >-
      Using both oxygen and artificial electron acceptors, we detected no enzymatic activity
      with the purified HemJ.f
suggested_experiments:
- description: >-
    Delete or deplete RHOS4_28450 in R. sphaeroides 2.4.1 and measure heme, bacteriochlorophyll
    and protoporphyrin(ogen) accumulation; reconstitute the purified heme b-containing protein
    in membranes with candidate acceptors (ubiquinone pool, cytochromes, HemF/HemN) to identify
    the physiological electron acceptor.
