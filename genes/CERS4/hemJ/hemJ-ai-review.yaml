- term:
    id: GO:0006783
    label: heme biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR001369417
  review:
    summary: >-
      UniRule assignment of heme biosynthesis. HemJ makes protoporphyrin IX, into which
      ferrochelatase inserts iron to give protoheme (heme b).
    action: MODIFY
    reason: >-
      Correct but general. The protoporphyrin IX made by HemJ is the direct substrate of
      ferrochelatase, so the specific heme endpoint is GO:0006785 heme B biosynthetic process (an
      is_a descendant), the term used for the P. putida HemJ review (genes/PSEPK/PP_0431) and the
      HemN reviews. In the HemJ-dependent Acinetobacter baylyi, deleting hemJ caused heme
      auxotrophy, which shows HemJ is the heme-pathway protoporphyrinogen oxidase in bacteria
      lacking HemG and HemY. The bacteriochlorophyll branch is added as a separate NEW row,
      because it is not a descendant of heme biosynthesis.
    proposed_replacement_terms:
    - id: GO:0006785
      label: heme B biosynthetic process
    supported_by:
    - reference_id: PMID:21642412
      supporting_text: >-
        When the COG1981 gene was deleted from the genome of A. baylyi, a bacterium that lacks
        both hemG and hemY, the organism became auxotrophic for heme.
    - reference_id: PMID:25108393
      supporting_text: >-
        Indeed, these bacteria possess HemJ sequences as do most of the other α-Proteobacteria,
        and therefore HemJ probably functions as a Protox in these bacteria.
- term:
    id: GO:0070818
    label: protoporphyrinogen oxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:62000
  - UniRule:UR001369417
  review:
    summary: >-
      Combined electronic assignment (RHEA:62000, UniRule) of protoporphyrinogen oxidase
      activity with an unspecified acceptor. The R. sphaeroides HemJ homolog itself has
      protoporphyrinogen oxidase activity when expressed in E. coli.
    action: ACCEPT
    reason: >-
      Core function, with direct experimental support for the R. sphaeroides protein. GO:0070818
      is defined as "Catalysis of the reaction: protoporphyrinogen IX + 3 acceptor =
      protoporphyrin IX + 3 reduced acceptor"; the unspecified acceptor is the right level,
      because purified cyanobacterial HemJ showed no activity with oxygen or artificial
      acceptors, so neither the oxygen (GO:0004729) nor the quinone (GO:0070819) child term is
      warranted. This agrees with the PTHR40255 family review, which treats GO:0070818 as the
      family-wide activity.
    supported_by:
    - reference_id: PMID:20823222
      supporting_text: >-
        We overexpressed an slr1790 homolog of Rhodobacter sphaeroides in Escherichia coli and
        found that this recombinant protein possesses Protox activity in vitro.
    - reference_id: file:CERS4/hemJ/hemJ-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the oxidation of protoporphyrinogen IX to protoporphyrin IX.
    - reference_id: file:CERS4/hemJ/hemJ-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Does not use oxygen or artificial electron acceptors such as menadione or
        benzoquinone.
    - reference_id: PMID:29925590
      supporting_text: >-
        Using both oxygen and artificial electron acceptors, we detected no enzymatic activity
        with the purified HemJ.f, consistent with the hypothesis that the enzymatic mechanism for
        HemJ is distinct from those of other PPO isoforms.
- term:
    id: GO:0030494
    label: bacteriochlorophyll biosynthetic process
  evidence_type: IC
  original_reference_id: PMID:29925590
  qualifier: involved_in
  review:
    summary: >-
      Proposed addition. Protoporphyrin IX made by HemJ is also the substrate of magnesium
      chelatase, the first step of the bacteriochlorophyll branch in this photosynthetic
      bacterium.
    action: NEW
    reason: >-
      Participation test: HemJ catalyses the last step that is common to the heme and
      (bacterio)chlorophyll branches, so it does part of the work of chlorophyll-type pigment
      synthesis, like HemN in the same organism (genes/CERS4/hemN). In Synechocystis, lowering
      HemJ depleted chlorophyll precursors. R. sphaeroides has no HemY or HemG, so HemJ is
      expected to supply protoporphyrin IX for both branches. This is an inference (IC) from
      the family function and the organism's pathway; no R. sphaeroides hemJ mutant has been
      described. GO:0030494 is defined as "The chemical reactions and pathways resulting in the
      formation of a bacteriochlorophyll".
    supported_by:
    - reference_id: PMID:29925590
      supporting_text: >-
        Protoporphyrinogen IX oxidase (PPO), the last enzyme that is common to both chlorophyll
        and heme biosynthesis pathways, catalyzes the oxidation of protoporphyrinogen IX to
        protoporphyrin IX.
    - reference_id: PMID:29925590
      supporting_text: >-
        HemJ down-regulation resulted in accumulation of tetrapyrrole precursors and in the
        depletion of chlorophyll precursors.
    - reference_id: file:CERS4/hemJ/hemJ-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Is involved in the biosynthesis of tetrapyrrole molecules like heme and chlorophyll.
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: ISS
  original_reference_id: file:CERS4/hemJ/hemJ-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      Proposed addition. UniProt curates one heme b per subunit, with two axial histidine
      ligands, by similarity to Synechocystis HemJ, whose affinity-purified protein carries heme b.
    action: NEW
    reason: >-
      The heme b cofactor is thought to be redox-active and part of the HemJ mechanism, so its
      binding is a molecular function the protein itself performs. The P. putida HemJ review
      records the same function (genes/PSEPK/PP_0431, MODIFY of metal ion binding to heme
      binding). Evidence is by similarity only; no heme content was measured for the
      R. sphaeroides protein.
    supported_by:
    - reference_id: file:CERS4/hemJ/hemJ-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: >-
        Binds 1 heme b (iron(II)-protoporphyrin IX) group per subunit.
    - reference_id: PMID:29925590
      supporting_text: >-
        The expression of FLAG-tagged Synechocystis 6803 HemJ protein (HemJ.f) and affinity
        isolation of HemJ.f under native conditions revealed that it binds heme b
core_functions:
- description: >-
    HemJ is a membrane-bound, heme b-containing protoporphyrinogen IX oxidase that converts
    protoporphyrinogen IX to protoporphyrin IX with a physiological electron acceptor that is not
    yet known. This is the last step common to protoheme and bacteriochlorophyll synthesis in
    R. sphaeroides.
