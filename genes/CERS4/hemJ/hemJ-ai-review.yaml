  review:
    summary: >-
      Combined electronic assignment (UniProt subcellular location "Cell membrane" and UniRule)
      of the plasma membrane. The protein has four predicted transmembrane helices, and the
      cyanobacterial HemJ it is curated from is a membrane protein.
    action: ACCEPT
    reason: >-
      Two independent lines agree: sequence analysis predicts a multi-pass integral membrane
      protein, and the characterised family member is membrane-bound. In a bacterium without
      other internal membranes than the intracytoplasmic membrane (an invagination of the
      cytoplasmic membrane), the plasma membrane is the correct and core location. No
      direct localisation assay of the R. sphaeroides protein was found.
    supported_by:
