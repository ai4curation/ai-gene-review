  label: Cereibacter sphaeroides 2.4.1
description: RSP_0333 encodes BcsA, the catalytic cellulose synthase of Cereibacter sphaeroides 2.4.1,
  historically named Rhodobacter sphaeroides. Its cytoplasmic glycosyltransferase domain transfers glucose
  from UDP-glucose to a growing beta-1,4-glucan, and its membrane domain translocates the polymer across
  the inner membrane. A C-terminal PilZ domain binds c-di-GMP and relieves catalytic autoinhibition. Purified
  BcsA with its membrane-anchored BcsB partner supports cellulose synthesis in vitro and has been visualized
  during polymerization and translocation.
