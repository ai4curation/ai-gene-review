  title: Crystallographic snapshot of cellulose synthesis and membrane translocation.
  findings:
  - statement: The experimental gene source is Rhodobacter sphaeroides 2.4.1; the mature BcsB region was
      expressed with a substitute signal peptide.
    supporting_text: The BcsA gene was PCR amplified from Rhodobacter sphaeroides 2.4.1. genomic DNA (ATCC)
