description: RSP_0332 encodes BcsB, the membrane-anchored periplasmic partner of cellulose synthase in
  Cereibacter sphaeroides 2.4.1, historically named Rhodobacter sphaeroides. Its C-terminal membrane-associated
  region supports the activity of the BcsA catalytic subunit, while its periplasmic domains lie beside
  the emerging glucan. BcsB contributes to cellulose synthesis as part of the BcsAB complex and does not
  contain the glycosyltransferase active site. Direct c-di-GMP sensing in this complex is assigned to
  the BcsA PilZ domain.
