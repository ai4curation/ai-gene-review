      C-terminal TM-helix.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. Native source strain and current accession are verified from methods,
      raw PDB cross-references and PDBe SIFTS. BcsA carries a C-terminal 12-His tag; BcsB uses residues 21-725
      after PelB cleavage with an extra Met-Gly dipeptide.
- id: PMID:24704788
  title: Mechanism of activation of bacterial cellulose synthase by cyclic di-GMP.
  findings:
  - statement: Direct c-di-GMP sensing maps to BcsA PilZ and relieves autoinhibition.
    supporting_text: BcsA’s C-terminal PilZ domain binds an intercalated c-di-GMP dimer
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. Rhodobacter sphaeroides BcsAB was purified from E. coli; accession
      mapping supports direct target attribution. BcsB association does not establish direct BcsB c-di-GMP
      binding.
- id: PMID:26958837
  title: Observing cellulose biosynthesis and membrane translocation in crystallo.
  findings:
  - statement: In-crystal enzymology captures successive cellulose elongation and membrane-translocation
      states in the active BcsAB complex.
    supporting_text: Strikingly BcsA-B is catalytically active in crystallo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal force-fetch recovered full text after initial 429. The study follows the earlier
      Rhodobacter BcsAB constructs and includes deliberately engineered BcsA mutants for mechanistic tests;
      mutant effects are not claims about the native sequence.
