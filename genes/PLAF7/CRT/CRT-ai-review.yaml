    label: response to xenobiotic stimulus
  evidence_type: IDA
  original_reference_id: PMID:15240840
  qualifier: involved_in
  review:
    summary: >-
      PfCRT variants mediate efflux of antimalarial drugs from the digestive vacuole,
      which is a cellular response to those xenobiotics; the capability is strongly
      allele-dependent and is not the protein's natural role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Drug handling by PfCRT is real and well documented for resistance-conferring
      isoforms (PMID:25378409, PMID:35507548) and, for purified protein in
      proteoliposomes, also for the chloroquine-sensitive form (PMID:25733858), so the
      claim is kept. It is peripheral to the transporter's physiological function,
      which is export of host-derived peptides from the vacuole (PMID:32764664). The
      cited reference is a sequence-analysis paper that performed no transport
      experiment, so the IDA evidence code is a poor fit; the claim is supported by the
      later experimental literature instead, and the term is kept as non-core rather
      than removed.
    additional_reference_ids:
