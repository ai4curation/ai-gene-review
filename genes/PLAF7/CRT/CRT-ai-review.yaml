  - statement: PfCRT is an integral membrane protein of the parasite digestive vacuole,
      and point mutations in pfcrt associate with verapamil-reversible chloroquine
      resistance.
    supporting_text: This transmembrane protein localizes to the parasite digestive vacuole (DV), the site of CQ
      action, where increased compartment acidification associates with PfCRT point mutations.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Founding genetic and transfection study identifying pfcrt; supports the
      digestive-vacuole localization used here. Title and content verified against the
      cached full text.
- id: PMID:15240840
  title: The malaria parasite's chloroquine resistance transporter is a member of
    the drug/metabolite transporter superfamily.
  findings:
  - statement: Sequence analysis places CRT in a previously undefined family within the
      drug/metabolite transporter superfamily.
    supporting_text: falling within the drug/metabolite transporter superfamily.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for family assignment, but it is a bioinformatic analysis with no
      transport experiment, so it is a weak source for the IDA-coded response to
      xenobiotic stimulus and TAS membrane annotations that cite it. Only the abstract
      is cached.
- id: PMID:20015114
  title: Trafficking of the phosphoprotein PfCRT to the digestive vacuolar membrane
    in Plasmodium falciparum.
  findings:
  - statement: PfCRT is a phosphoprotein whose sorting to the digestive vacuolar
      membrane depends on threonine 416.
    supporting_text: phosphorylation of threonine 416 is a possible deciding signal for the sorting of PfCRT to
      the digestive vacuolar membrane.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Dedicated trafficking study; source of the endoplasmic reticulum IDA. Only the
      abstract is cached, so the ER observation itself could not be inspected and the
      curator's reading of the full text is deferred to.
  full_text_unavailable: true
- id: PMID:23256874
  title: 'Glutathione transport: a new role for PfCRT in chloroquine resistance.'
  findings:
  - statement: Mutant pfcrt alleles from chloroquine-resistant parasites, expressed in
      Xenopus oocytes, selectively transport glutathione.
    supporting_text: We further demonstrate via expression in Xenopus laevis oocytes
      that the mutant alleles of Pfcrt in CQR parasites selectively transport GSH.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:32764664
      review_notes: >-
        A later study screened glutathione explicitly in oocytes and in parasites and
        found peptides, not glutathione or other metabolites, to be the substrates of
        PfCRT.
      supported_by:
      - reference_id: PMID:32764664
        supporting_text: We screened many solutes, including Fe2+, Fe3+ and glutathione, but were unable to
          identify the co-substrate (Supplementary Data 1).
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Correctly cited for the glutathione-transport annotation, but the claim is
      allele-specific (CQR alleles in a heterologous system) and is contested by
      PMID:32764664.
- id: PMID:25378409
  title: Multiple drugs compete for transport via the Plasmodium falciparum chloroquine
    resistance transporter at distinct but interdependent sites.
  findings:
  - statement: Mutant PfCRT transports quinine, quinidine and verapamil in addition to
      chloroquine, with the drugs competing at distinct but interacting sites; the
      wild-type protein does not transport chloroquine in this system.
    supporting_text: mutant PfCRT also transports quinine, quinidine, and verapamil, indicating that the protein
      behaves as a multidrug resistance carrier.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Kinetically detailed oocyte study supporting the xenobiotic transmembrane
      transporter activity annotation; note the allele dependence it documents.
- id: PMID:25733858
  title: Plasmodium falciparum chloroquine resistance transporter is a H+-coupled polyspecific
    nutrient and drug exporter.
  findings:
  - statement: Purified chloroquine-sensitive and chloroquine-resistant PfCRT
      reconstituted into proteoliposomes take up organic cations, chloroquine, basic
      amino acids, polypeptides and polyamines driven by a proton electrochemical
      gradient.
    supporting_text: All PfCRTs tested actively took up tetraethylammonium, verapamil,
      CQ, basic amino acids, polypeptides, and polyamines at the expense of an
      electrochemical proton gradient.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:32764664
      review_notes: >-
        The polypeptide component is corroborated, but the non-peptide substrates were
        not reproduced in oocytes or in parasites.
      supported_by:
      - reference_id: PMID:32764664
        supporting_text: We show that PfCRT functions to export host-derived peptides 4–11
          residues in length from the parasite’s DV, and that the protein does not behave
          as a non-specific transporter of other metabolites and/or ions.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Reconstituted purified-protein study and the source of UniProt's catalytic
      activity entries; its peptide result stands, while its broader substrate range is
      contested by in-situ work.
- id: PMID:26420308
  title: Mutations in the Plasmodium falciparum chloroquine resistance transporter,
    PfCRT, enlarge the parasite's food vacuole and alter drug sensitivities.
  findings:
  - statement: PfCRT mutations C101F and L272F enlarge the food vacuole and strongly
      reduce chloroquine transport, linking transporter function to vacuolar
      homeostasis.
    supporting_text: causing the development of enlarged food vacuoles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Supports the osmotic-homeostasis role of PfCRT in the food vacuole; fetched into
      the publication cache during this review.
- id: PMID:31776516
  title: Structure and drug resistance of the Plasmodium falciparum transporter PfCRT.
  findings:
  - statement: The cryo-EM structure of the 7G8 isoform shows resistance mutations
      lining a central negatively charged cavity, and the isoform transports chloroquine
      in a membrane-potential- and pH-dependent manner.
    supporting_text: The 7G8 isoform transports CQ in a membrane potential- and pH-dependent manner, consistent
      with an active efflux mechanism that drives CQ resistance5, but does not transport PPQ.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Structural and binding study; corroborates active, electrogenic drug efflux by
      resistant isoforms.
- id: PMID:32764664
  title: The natural function of the malaria parasite's chloroquine resistance transporter.
  findings:
  - statement: PfCRT exports host-derived peptides of four to eleven residues from the
      digestive vacuole to the cytosol, in vitro and in situ, and does not transport
      other metabolites or ions non-specifically.
    supporting_text: We show that PfCRT functions to export host-derived peptides 4–11
      residues in length from the parasite’s DV, and that the protein does not behave as
      a non-specific transporter of other metabolites and/or ions.
  - statement: Peptide export supplies amino acids for parasite growth and prevents
      osmotic swelling and dysfunction of the digestive vacuole; resistance mutations
      reduce peptide transport capacity.
    supporting_text: the PfCRT-mediated transport of peptides from the DV to the cytosol
      serves to (1) provide a source of amino acids to support the parasite’s high
      growth rate and (2) reduce peptide levels within the DV and thereby prevent the
      osmotic stress, swelling and dysfunction of this organelle.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The most complete substrate analysis, combining oocyte transport, parasite
      metabolomics and inhibitor studies; the basis for the core function asserted here.
- id: PMID:35507548
  title: Mechanistic basis for multidrug resistance and collateral drug sensitivity
    conferred to the malaria parasite by polymorphisms in PfMDR1 and PfCRT.
  findings:
  - statement: Chloroquine-resistance-conferring PfCRT isoforms transport chloroquine,
      lumefantrine and mefloquine, whereas wild-type PfCRT does not.
    supporting_text: demonstrate that these PfCRT isoforms transport all 3 drugs, whereas wild-type PfCRT does
      not.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes the allele dependence of drug transport by PfCRT and distinguishes it
      from the unrelated ABC transporter PfMDR1.
