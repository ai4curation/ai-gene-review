    summary: >-
      Glutathione transport is propagated to PfCRT from the plant CRT-like (CLT)
      proteins, plastid-membrane glutathione transporters, together with the oocyte
      result obtained with mutant pfcrt alleles.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The plant donors sit on a plastid-targeted branch of the CRT-like family whose
      substrate preference need not extend to the apicomplexan digestive-vacuole
      member, and the one experimental result in P. falciparum concerns
      resistance-conferring alleles rather than the reference 3D7 protein
      (PMID:23256874). The most thorough substrate analysis screened glutathione
      directly, in oocytes and in parasites, and concluded that PfCRT is a peptide
      exporter that does not transport other metabolites non-specifically
      (PMID:32764664). The claim is not simply false, since mutant isoforms did move
      GSH in a heterologous system, so it is flagged as an over-annotation of the
      family and of the resistant alleles rather than removed.
