id: Q8IBZ9
gene_symbol: CRT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: >-
  PfCRT is a 10-transmembrane integral membrane protein of the drug/metabolite
  transporter superfamily that resides in the membrane of the digestive (food)
  vacuole of the intraerythrocytic malaria parasite. The digestive vacuole is the
  acidic compartment in which endocytosed host erythrocyte cytosol, chiefly
  haemoglobin, is proteolysed. PfCRT exports the resulting host-derived peptides of
  roughly four to eleven residues from the vacuolar lumen into the parasite cytosol
  in a proton-dependent, saturable manner, thereby supplying amino acids for parasite
  metabolism and relieving the osmotic load that accumulating peptides would otherwise
  impose on the organelle; loss or impairment of this activity swells the vacuole and
  slows asexual blood-stage growth. Purified protein in proteoliposomes additionally
  exports basic amino acids, polyamines and organic cations down a proton
  electrochemical gradient, although these substrates have not been corroborated in
  the parasite. Field-derived polymorphisms, above all K76T, reshape the central
  substrate cavity so that the transporter also effluxes protonated quinoline drugs,
  including chloroquine, quinine, quinidine, lumefantrine and mefloquine, out of the
  vacuole and away from their haem target; these same substitutions reduce peptide
  transport capacity, which is the structural basis of the fitness cost that
  accompanies chloroquine resistance. Trafficking of the protein to the vacuolar
  membrane passes through the secretory pathway and depends on phosphorylation of a
  C-terminal threonine.
