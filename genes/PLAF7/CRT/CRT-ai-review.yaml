core_functions:
- description: >-
    Proton-dependent export of host-haemoglobin-derived oligopeptides of roughly four
    to eleven residues across the digestive (food) vacuole membrane, from the vacuolar
    lumen into the parasite cytosol. This supplies amino acids for parasite metabolism
    during intraerythrocytic growth and keeps the peptide load, and hence the osmotic
    pressure, of the vacuole low; impairing the activity swells the organelle and
    costs the parasite fitness.
  molecular_function:
    id: GO:0035673
    label: oligopeptide transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015833
    label: peptide transport
