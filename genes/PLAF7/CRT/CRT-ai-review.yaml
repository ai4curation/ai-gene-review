  review:
    summary: >-
      PfCRT is a multi-pass protein of the digestive (food) vacuole membrane, the
      compartment in which host haemoglobin is digested and in which chloroquine acts.
      The UniProt subcellular-location mapping is correct.
    action: ACCEPT
    reason: >-
      Digestive-vacuole membrane residence is established experimentally
      (PMID:11090624, PMID:20015114) and is the functional site of peptide export
      (PMID:32764664). GO has GO:0020020 food vacuole but no "food vacuole membrane"
      child of vacuolar membrane, so GO:0005774 is the most precise membrane term
      currently available and is kept rather than modified; a food vacuole membrane
      term is proposed below.
    supported_by:
    - reference_id: PMID:11090624
      supporting_text: This transmembrane protein localizes to the parasite digestive vacuole (DV), the site of
        CQ action, where increased compartment acidification associates with PfCRT point
        mutations.
    - reference_id: PMID:20015114
      supporting_text: Our data establish PfCRT as a phosphoprotein and suggest that
        phosphorylation of threonine 416 is a possible deciding signal for the sorting
        of PfCRT to the digestive vacuolar membrane.
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:20015114
  qualifier: located_in
  review:
    summary: >-
      Localization to the endoplasmic reticulum was observed in the course of
      dissecting how PfCRT is sorted to the digestive vacuolar membrane; the ER is the
      entry point of the secretory route taken by this multi-pass membrane protein.
    action: KEEP_AS_NON_CORE
    reason: >-
      The curator of this IDA read the full text of a dedicated trafficking study, so
      the observation is retained. It is nonetheless a biosynthetic transit
      compartment rather than a site of function: the transporter does its work in the
      digestive vacuole membrane, which that same study identifies as its destination.
      The term is as precise as the evidence allows, so it is kept as non-core rather
      than refined. No quotation is attached: only the abstract of PMID:20015114 is
      cached and it does not mention the endoplasmic reticulum, so the IDA rests on
      full-text data the curator read and we cannot quote.
- term:
