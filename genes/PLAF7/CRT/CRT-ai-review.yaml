      residues in length from the parasite’s DV, and that the protein does not behave as
      a non-specific transporter of other metabolites and/or ions.
  - reference_id: PMID:25733858
    supporting_text: All PfCRTs tested actively took up tetraethylammonium, verapamil,
      CQ, basic amino acids, polypeptides, and polyamines at the expense of an
      electrochemical proton gradient.
  - reference_id: PMID:11090624
    supporting_text: This transmembrane protein localizes to the parasite digestive vacuole (DV), the site of CQ
      action, where increased compartment acidification associates with PfCRT point mutations.
  knowledge_gaps:
  - gap_statement: >-
      The cytosolic co-substrate whose movement couples peptide translocation by PfCRT
      is unidentified, so the transport stoichiometry and energetic mechanism remain
      undetermined.
    boundary: >-
      Peptide export itself is established in vitro and in situ, is saturable, is
      blocked by PfCRT inhibitors and depends on protons; what is missing is the
      identity of the additional solute required for transport.
    gap_kind:
    - BIOLOGY
    significance: >-
      Without the co-substrate, the transport cycle cannot be reconstituted or modelled,
      which limits structure-based design of PfCRT inhibitors and of agents that restore
      quinoline efficacy.
    resolution: >-
      Reconstitution of purified PfCRT with candidate solutes identified from
      compartment-resolved parasite metabolomics, testing trans-stimulation of peptide
      flux.
    provenance:
    - reference_id: PMID:32764664
      supporting_text: We screened many solutes, including Fe2+, Fe3+ and glutathione, but were unable to
        identify the co-substrate (Supplementary Data 1).
proposed_new_terms:
- proposed_name: food vacuole membrane
  proposed_definition: >-
    The lipid bilayer surrounding a food vacuole, the vacuole within a parasite used
    for digestion of host cell cytoplasm. An example of this component is the digestive
    vacuole membrane of intraerythrocytic Plasmodium, which harbours transporters
    including PfCRT and PfMDR1 and the vacuolar proton pumps that acidify the lumen.
  justification: >-
    GO contains GO:0020020 food vacuole but no term for its bounding membrane, so
    apicomplexan digestive-vacuole membrane proteins can only be annotated to the
    generic GO:0005774 vacuolar membrane. The membrane is the functional site of
    several of the best-studied antimalarial-resistance determinants, and a dedicated
    term would let those annotations state the compartment precisely.
  proposed_parent:
    id: GO:0005774
    label: vacuolar membrane
  supported_by:
  - reference_id: PMID:11090624
    supporting_text: This transmembrane protein localizes to the parasite digestive vacuole (DV), the site of CQ
      action, where increased compartment acidification associates with PfCRT point mutations.
  - reference_id: PMID:20015114
    supporting_text: phosphorylation of threonine 416 is a possible deciding signal for the sorting of PfCRT to
      the digestive vacuolar membrane.
suggested_questions:
- question: >-
    What is the cytosolic co-substrate whose counter-movement drives peptide export by
    PfCRT, and is it exchanged stoichiometrically with the peptide?
  experts:
  - Rowena E. Martin
  - Sarah H. Shafik
- question: >-
    Do the basic amino acids, polyamines and organic cations transported by purified
    PfCRT in proteoliposomes represent genuine physiological substrates in the
    parasite, or in-vitro promiscuity of a peptide carrier reconstituted without its
    co-substrate?
  experts:
  - Yoshinori Moriyama
  - Rowena E. Martin
- question: >-
    Is glutathione movement across the digestive vacuole membrane in
    chloroquine-resistant parasites mediated by mutant PfCRT itself, or by another
    transporter whose activity the mutant alleles alter indirectly?
  experts:
  - Sylke Mueller
  - Rowena E. Martin
- question: >-
    How much of the amino-acid supply of the intraerythrocytic parasite flows through
    PfCRT-mediated peptide export versus intravacuolar proteolysis to free amino acids
    followed by other carriers?
suggested_experiments:
- hypothesis: >-
    Peptide export by PfCRT is obligatorily coupled to counter-transport of a specific
    cytosolic solute, and identifying it will explain the protein's proton dependence.
  description: >-
    Reconstitute purified 3D7 PfCRT into proteoliposomes of defined internal
    composition and screen candidate counter-substrates by trans-stimulation of
    radiolabelled peptide uptake, combining an untargeted metabolomic comparison of
    digestive-vacuole and cytosolic fractions to shortlist candidates. Confirm hits by
    measuring coupled fluxes and the apparent stoichiometry as a function of the
    imposed pH gradient and membrane potential.
  experiment_type: reconstituted transport assay with metabolomics
- hypothesis: >-
    The amino acids and polyamines transported by purified PfCRT are not carried in the
    parasite, so the in-vitro polyspecificity reflects the reconstituted system.
  description: >-
    Use conditional knockdown or a rapid chemical-genetic shutdown of PfCRT in
    synchronous parasites and quantify, by isotope-labelled metabolomics of isolated
    digestive vacuoles and cytosol, which of the proposed substrates accumulate in the
    vacuole on loss of transport. Peptides should accumulate; free basic amino acids
    and polyamines should not if their transport is an artefact of reconstitution.
  experiment_type: inducible knockdown with compartment-resolved metabolomics
- hypothesis: >-
    Glutathione flux into the digestive vacuole of chloroquine-resistant parasites does
    not require PfCRT-mediated transport.
  description: >-
    Compare glutathione concentrations in isolated digestive vacuoles of isogenic lines
    carrying wild-type, Dd2 and 7G8 pfcrt alleles, using a vacuole-targeted genetically
    encoded glutathione redox sensor, and test whether PfCRT inhibitors that block
    peptide transport also abolish the difference. A persistent difference under
    transport blockade would place the glutathione effect downstream of PfCRT rather
    than on it.
  experiment_type: compartment-targeted redox-sensor imaging in isogenic lines
