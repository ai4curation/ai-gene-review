- term:
    id: GO:0042540
    label: hemoglobin catabolic process
  evidence_type: TAS
  original_reference_id: PMID:9886289
  qualifier: involved_in
  review:
    summary: PMII digests host hemoglobin in the food vacuole during the blood stage.
    action: ACCEPT
    reason: PMII directly catalyses hemoglobin cleavage steps (initial hinge-region cleavage with PMI, and synergistic
      globin degradation with HAP/PMIV), so it performs part of the process. Hemoglobin is endocytosed host protein
      but is catabolised inside the parasite food vacuole, so this standard catabolic term (not a host-interaction
      term) is appropriate. Redundancy with paralogs explains the mild knockout phenotype but does not argue against
      participation.
    supported_by:
    - *id010
    - *id005
    - reference_id: PMID:11782538
      supporting_text: A combination of HAP and PM II, or PM IV and PM II cleaved hemoglobin much faster than each
        enzyme alone.
