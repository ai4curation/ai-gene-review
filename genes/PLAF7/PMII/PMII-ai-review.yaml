core_functions:
- description: Aspartic endopeptidase that degrades endocytosed host hemoglobin in the lumen of the parasite food
    vacuole during the asexual blood stage, initiating cleavage of native hemoglobin and acting with paralogous
    plasmepsins and other food-vacuole proteases.
  molecular_function:
    id: GO:0004190
    label: aspartic-type endopeptidase activity
  directly_involved_in:
