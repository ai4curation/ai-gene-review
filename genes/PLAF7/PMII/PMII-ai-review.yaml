taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: Plasmepsin II (PMII) is a pepsin-family (peptidase A1) aspartic endopeptidase of the malaria parasite
  Plasmodium falciparum, one of four paralogous food-vacuole plasmepsins (PMI, PMII, PMIV, HAP) encoded in a tandem
  cluster on chromosome 14. It is synthesized during the asexual blood stage as a type II integral membrane proenzyme
  whose propeptide carries the transmembrane anchor; the zymogen traffics through the secretory pathway to cytostomal
  vacuoles and is carried with endocytosed host hemoglobin to the acidic food (digestive) vacuole, where it is cleaved,
  mainly by falcipains with autoprocessing as a backup, to release the soluble active enzyme. Together with PMI,
  PMII initiates hemoglobin degradation by cleaving native hemoglobin in the hinge region and acts synergistically
  with HAP, PMIV, falcipains and falcilysin to digest globin, supplying amino acids and liberating heme for hemozoin
  formation; it co-purifies with these enzymes and heme detoxification protein in a food-vacuole hemoglobinase complex.
  Gene disruption causes only a mild growth defect, reflecting extensive redundancy among the food-vacuole proteases.
  PMII is a well-studied antimalarial drug target with many inhibitor co-crystal structures.
