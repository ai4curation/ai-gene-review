  - *id005
  - *id007
  - *id004
suggested_questions:
- question: Which specific peptide bonds in native hemoglobin are cleaved by PMII in vivo, and how does its specificity
    differ from PMI, given their overlapping roles in initiating degradation?
- question: Is the reported association of PMII with the food-vacuole hemozoin formation complex a stable stoichiometric
    complex warranting a GO cellular component term, or a transient co-purification?
- question: Does PMII act on host erythrocyte proteins outside the food vacuole (e.g. membrane skeleton proteins),
    or is its activity confined to the food vacuole lumen in vivo?
suggested_experiments:
- hypothesis: PMII and PMI are jointly required to initiate native hemoglobin cleavage in vivo
  description: Use conditional (DiCre or knock-sideways) depletion of PMII in a PMI-null background and measure
    accumulation of undigested hemoglobin, hemozoin formation and peptidomic cleavage-site maps of food vacuole
    contents.
  experiment_type: conditional knockdown with peptidomics
