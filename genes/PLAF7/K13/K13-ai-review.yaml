- id: PMID:35092154
  title: 'Plasmodium falciparum Kelch13 and its artemisinin-resistant mutants assemble
    as hexamers in solution: a SAXS data-driven modelling study.'
  findings:
  - statement: Solution scattering shows full-length PfKelch13 forms a stable hexamer with
      P6 symmetry driven by N-terminal interactions, complementing the two available
      crystal structures of the BTB-propeller region as tight dimers.
    supporting_text: PfKelch13 forms a stable hexamer in P6 symmetry, (b) interactions of the N-termini drive the
      hexameric assembly, and (c) the six KRP domains project independently in space, forming a
