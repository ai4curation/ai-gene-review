  findings:
  - statement: Across isogenic lines, Kelch13 protein amount correlates with artemisinin
      resistance and with fitness cost, and titration of Kelch13 and KIC7 shows resistance
      is set by the rate of endocytosis these proteins support.
    supporting_text: Titration of K13 and KIC7 indicated that the cellular levels of these
      proteins determined resistance through the rate of endocytosis.
  - statement: Kelch13 and its compartment neighbours, including UBP1, function in
      endocytosis of host cell cytosol.
    supporting_text: K13 and its compartment neighbors (KICs), including UBP1, are
      involved in endocytosis of host cell cytosol.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID verified through PubMed; full text cached and read. Provides the quantitative
      link between Kelch13 abundance, endocytosis rate and resistance that underpins the
      NEW endocytosis annotation.
