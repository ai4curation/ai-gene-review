  - statement: Host haemoglobin reaches the food vacuole by uptake at cytostomal
      invaginations of the parasite plasma membrane followed by vesicular transport.
    supporting_text: Hemoglobin trafficking to the parasite food vacuole is believed to be initiated at membrane
      invaginations called cytostomes [30,42,48,49] followed by vesicular transport from the
      parasite plasma membrane (PPM) to the food vacuole [42,50], likely in an actin-myosin motor
      dependent manner [48,51–53].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
