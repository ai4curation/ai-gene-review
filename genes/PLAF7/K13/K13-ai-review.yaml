id: Q8IDQ2
gene_symbol: K13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: >-
  Kelch13 (PfK13, encoded by PF3D7_1343700) is a 726-residue BTB/POZ plus six-bladed
  Kelch-repeat beta-propeller protein of the intraerythrocytic malaria parasite
  Plasmodium falciparum. It carries a disordered N-terminal region and a coiled coil
  ahead of the BTB domain (residues 350-452) and the C-terminal propeller, and it
  self-assembles: the BTB-propeller fragment crystallizes as a tight dimer and the
  full-length protein forms an N-terminus-driven hexamer in solution. The protein
  concentrates in discrete foci at the parasite periphery, the so-called Kelch13
  compartment, adjacent to cytostomes, and is additionally seen at the endoplasmic
  reticulum and on Rab-positive vesicles. Its established cellular role is at the
  uptake step of host nutrient acquisition: together with a set of Kelch13-compartment
  partners it is required for endocytosis of host erythrocyte cytosol, principally
  haemoglobin, which is internalized at cytostomal invaginations of the parasite
  plasma membrane and delivered to the digestive (food) vacuole for proteolysis into
  amino acids. The amount of functional Kelch13 sets the rate of this endocytosis, so
  the protein governs how much haemoglobin-derived material, including free haem,
  reaches the parasite. Because artemisinins are activated by haem released from
  digested haemoglobin, propeller substitutions such as M476I, R539T and C580Y, or
  reduced Kelch13 abundance, lower drug activation in ring stages and produce the
  partial artemisinin resistance phenotype measured by the ring-stage survival assay;
  these alleles carry a fitness cost proportional to the resistance they confer.
  Kelch13 has also been reported to bind the parasite phosphatidylinositol 3-kinase
  PfPI3K (PF3D7_0515300), which was interpreted as a cullin-RING ligase substrate
  adaptor role by analogy with mammalian KEAP1, but no catalytic activity of its own
  is known.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25874676
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8I3V5
  review:
    summary: >-
      The IntAct-curated interaction partner UniProtKB:Q8I3V5 is PF3D7_0515300, the
      parasite phosphatidylinositol 3-kinase PfPI3K. Co-immunoprecipitation showed
      PfPI3K bound to wild-type Kelch13 and reduced binding to the C580Y propeller
      mutant, which the authors interpreted as Kelch13 acting as a substrate adaptor
      delivering PfPI3K for ubiquitin-dependent degradation.
    action: REMOVE
    reason: >-
      Removal is a judgement about the term, not about the experiment: the PfPI3K
      interaction is accepted as real and remains recorded in IntAct, but GO:0005515
      states nothing about what Kelch13 does and so adds no functional information to
      this review. The obvious informative replacement, GO:1990756 ubiquitin-like
      ligase-substrate adaptor activity, cannot be substituted: the adaptor model was
      argued by analogy with the mammalian KEAP1 orthologue rather than demonstrated
      with a parasite cullin-RING ligase, and an independent Kelch13 interactome
      recovered endoplasmic-reticulum proteins and Rab GTPases rather than ligase
      components. With no supportable molecular function to modify to, the bare binding
      row is dropped and the open question is recorded in suggested_questions.
    supported_by:
    - reference_id: PMID:25874676
      supporting_text: Further analysis revealed that immunopurified (IP) PfPI3K was bound to PfKelch13WT and
        this was reduced by the C580Y mutation (Fig. 2e).
    - reference_id: PMID:25874676
      supporting_text: The mammalian orthologue of PfKelch13 functions is a substrate adapter for an E3
        ubiquitin ligase
    - reference_id: PMID:32310999
      supporting_text: Immunoprecipitation data generated with K13-specific monoclonal
        antibodies identify multiple putative K13-associated proteins, including
        endoplasmic reticulum-resident molecules, mitochondrial proteins, and Rab
        GTPases, in both K13 mutant and wild-type isogenic lines.
- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IDA
  original_reference_id: PMID:24352242
  qualifier: involved_in
  review:
    summary: >-
      The cited study selected an artemisinin-resistant line under long-term drug
      pressure, found the PF3D7_1343700 M476I substitution, and correlated propeller
      alleles in Cambodian isolates with ring-stage survival and in vivo clearance.
      What it establishes is that Kelch13 genotype determines susceptibility to the
      drug, not that the protein executes a cellular response to a xenobiotic.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Resistance here is a loss of Kelch13 activity, not an induced response to the
      compound: mutant or depleted Kelch13 takes up less host haemoglobin, so less haem
      is liberated to activate artemisinin, and the parasite survives a pulse of drug
      it never responded to. Wild-type Kelch13 performs no step of a xenobiotic
      response, is not induced by the drug, and the phenotype is a property of
      particular alleles rather than of the gene product's normal function. The term is
      not flatly wrong, since the protein does determine the outcome of drug exposure,
      so it is marked as over-annotated rather than removed, and the function that
      actually underlies the phenotype is added below as endocytosis of host cell
      cytosol.
    supported_by:
    - reference_id: PMID:24352242
      supporting_text: These data indicate that the PF3D7_1343700 M476I mutation
        increased the resistance of F32-Tanzania to DHA in the RSA0–3h.
    - reference_id: PMID:24352242
      supporting_text: Strong correlations between the presence of a mutant allele, in
        vitro parasite survival rates and in vivo parasite clearance rates indicate that
        K13-propeller mutations are important determinants of artemisinin resistance.
    - reference_id: PMID:31896710
      supporting_text: ARTs are activated by degradation products of hemoglobin. Hence,
        reduced activity of Kelch13 and its interactors diminishes hemoglobin
        endocytosis and thereby ART activation, resulting in parasite resistance.
- term:
    id: GO:0051260
    label: protein homooligomerization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003131
  review:
    summary: >-
      The InterPro2GO call derives from the T1-type BTB domain (IPR003131), a module
      that mediates self-association, and it is confirmed directly for this protein:
      the BTB-propeller fragment forms tight crystallographic dimers and solution
      scattering shows a stable N-terminus-driven hexamer.
    action: KEEP_AS_NON_CORE
    reason: >-
      The electronic inference is right and is independently corroborated by structural
      data on Kelch13 itself, so it is kept. Self-assembly is nonetheless an
      architectural property that underpins the protein's scaffolding role rather than
      the biological process the gene product exists to carry out, which is endocytic
      uptake of host cell cytosol; it is therefore retained as non-core. The term is as
      precise as the evidence supports, so no refinement is proposed.
    supported_by:
    - reference_id: PMID:35092154
      supporting_text: PfKelch13 forms a stable hexamer in P6 symmetry, (b) interactions of the N-termini drive
        the hexameric assembly, and (c) the six KRP domains project independently in space,
        forming a cauldron-like architecture.
    - reference_id: PMID:35092154
      supporting_text: To date, only two crystal structures of the BTB/POZ-KRP domains as tight dimers are
        available, which limits structure-based predictions and interpretation of its role(s) in
        inducing clinical artemisinin resistance.
    - reference_id: file:PLAF7/K13/K13-uniprot.txt
      supporting_text: DOMAIN 350..452
- term:
    id: GO:0006897
    label: endocytosis
  evidence_type: IMP
  original_reference_id: PMID:31896710
  qualifier: involved_in
  review:
    summary: >-
      Conditional inactivation of Kelch13 reduces endocytosis of haemoglobin from the
      host erythrocyte, as does a resistance-conferring propeller mutation, and the
      cellular level of Kelch13 sets the rate at which this endocytosis proceeds. The
      protein acts at the uptake step, at cytostomal invaginations of the parasite
      plasma membrane, in company with the other Kelch13-compartment proteins.
    action: NEW
    reason: >-
      This is the function that the whole Kelch13 literature converges on and it is
      absent from GOA. Kelch13 does part of the work of the process rather than merely
      being required for it: it is a resident component of the compartment at which
      endocytosis of host cytosol is initiated, its partners there carry vesicle
      trafficking and endocytosis domains, and titrating Kelch13 titrates the rate of
      uptake, which is the behaviour of machinery rather than of cargo or of an
      upstream permissive factor. GO:0006897 is the most specific existing term: none
      of its children (receptor-mediated, pinocytosis, phagocytosis, caveolin-mediated,
      clathrin- and caveolae-independent, ubiquitin-dependent, sperm entry, pre- and
      postsynaptic) describes cytostome-based ingestion of host cell cytosol, so a
      child term is proposed below.
    supported_by:
    - reference_id: PMID:31896710
      supporting_text: Functional analysis showed that these proteins are required for
        endocytosis of hemoglobin from the host cell. Parasites with inactivated Kelch13
        or a resistance-conferring Kelch13 mutation displayed reduced hemoglobin
        endocytosis.
    - reference_id: PMID:38700363
      supporting_text: K13 and its compartment neighbors (KICs), including UBP1, are
        involved in endocytosis of host cell cytosol.
    - reference_id: PMID:38700363
      supporting_text: Titration of K13 and KIC7 indicated that the cellular levels of
        these proteins determined resistance through the rate of endocytosis.
    - reference_id: PMID:38039338
      supporting_text: vesicle trafficking and endocytosis domains were frequent in proteins involved in
        resistance or endocytosis (or both), comprising one group of K13 compartment proteins.
- term:
    id: GO:0044002
    label: acquisition of nutrients from host
  evidence_type: IMP
  original_reference_id: PMID:31896710
  qualifier: involved_in
  review:
    summary: >-
      The material Kelch13-dependent endocytosis internalizes is host erythrocyte
      cytosol, overwhelmingly haemoglobin, which is carried to the digestive vacuole
      and proteolysed to supply the parasite with amino acids. Kelch13 therefore
      participates in the symbiont's acquisition of nutrients from its host cell, at
      the uptake step of that route.
    action: NEW
    reason: >-
      This is the host-aware framing of the same machinery and is not an ancestor or
      descendant of GO:0006897: the endocytosis term says how the material gets in, this
      term says that the material is host-derived nutrient. The uptake step is performed
      by Kelch13 and its compartment partners, while the downstream proteolysis is done
      by the digestive-vacuole proteases, so only the uptake portion is claimed here. The
      term is appropriate for an intracellular parasite and the host, the erythrocyte, is
      the larger partner as the definition requires.
    supported_by:
    - reference_id: PMID:31896710
      supporting_text: Functional analysis showed that these proteins are required for
        endocytosis of hemoglobin from the host cell.
    - reference_id: PMID:38039338
      supporting_text: Hemoglobin trafficking to the parasite food vacuole is believed to be initiated at
        membrane invaginations called cytostomes [30,42,48,49] followed by vesicular transport
        from the parasite plasma membrane (PPM) to the food vacuole [42,50], likely in an
        actin-myosin motor dependent manner [48,51–53].
    - reference_id: PMID:32310999
      supporting_text: We also saw evidence of K13 associating with cytostomes that traffic host-endocytosed
        hemoglobin from the parasitophorous vacuolar space to the DV (Fig 1E).
core_functions:
- description: >-
    Kelch13 assembles, through its BTB domain and N-terminal region, into oligomers that
    reside in discrete foci at the parasite periphery next to cytostomes, where it is
    required for endocytosis of host erythrocyte cytosol. Internalized haemoglobin is
    delivered to the digestive vacuole and degraded, supplying the intraerythrocytic
    parasite with amino acids; the cellular amount of functional Kelch13 sets the rate
    of this uptake. Because haem released during haemoglobin digestion is what activates
    artemisinins, the same activity determines ring-stage sensitivity to those drugs, and
    propeller mutations that lower it confer partial artemisinin resistance at a
    proportional fitness cost.
  directly_involved_in:
  - id: GO:0006897
    label: endocytosis
  - id: GO:0044002
    label: acquisition of nutrients from host
  supported_by:
  - reference_id: PMID:31896710
    supporting_text: Functional analysis showed that these proteins are required for
      endocytosis of hemoglobin from the host cell. Parasites with inactivated Kelch13 or
      a resistance-conferring Kelch13 mutation displayed reduced hemoglobin endocytosis.
  - reference_id: PMID:38700363
    supporting_text: Titration of K13 and KIC7 indicated that the cellular levels of these
      proteins determined resistance through the rate of endocytosis.
  - reference_id: PMID:32310999
    supporting_text: we localize K13 to the parasite endoplasmic reticulum, Rab-positive vesicles, and sites
      adjacent to cytostomes.
  knowledge_gaps:
  - gap_statement: >-
      No molecular activity has been assigned to Kelch13 itself. Whether the propeller
      recruits specific endocytic partners to the uptake site, nucleates the invagination,
      or serves some other biochemical role is unknown, so the gene product currently has
      a process but no mechanism.
    boundary: >-
      That Kelch13 is required for, and rate-limiting in, endocytosis of host cytosol is
      established by conditional inactivation, mutant alleles and titration of protein
      levels; what is missing is the step the protein performs within that process.
    gap_kind:
    - BIOLOGY
    significance: >-
      Without the molecular step, resistance-conferring substitutions cannot be
      interpreted structurally and the pathway cannot be targeted rationally, which
      matters because reduced uptake is the route by which first-line antimalarials lose
      activity.
    resolution: >-
      Reconstitution or in-parasite proximity mapping that identifies which compartment
      proteins require the Kelch13 propeller surface for their recruitment, combined with
      quantitative imaging of cytostome initiation in conditional knockdowns.
    provenance:
    - reference_id: PMID:38039338
      supporting_text: Another group of K13 compartment proteins did not influence
        endocytosis or ART susceptibility and lacked detectable vesicle trafficking
        domains.
proposed_new_terms:
- proposed_name: cytostome-mediated endocytosis of host cell cytosol
  proposed_definition: >-
    An endocytosis process in which an intracellular parasite internalizes cytosol of its
    host cell through a cytostome, a stable invagination of the parasite plasma membrane,
    producing vesicles that deliver the host material to a digestive compartment. An
    example is the uptake of host erythrocyte haemoglobin by intraerythrocytic Plasmodium,
    which requires Kelch13 and its compartment partners and delivers haemoglobin to the
    food vacuole.
  justification: >-
    GO:0006897 endocytosis has nine children, none of which covers ingestion of host cell
    cytosol through a cytostome, so apicomplexan proteins of this pathway can only be
    annotated to the bare parent. The process is the best-studied route of nutrient
    acquisition in malaria parasites, is genetically separable from clathrin- and
    actin-dependent endocytosis, and is the pathway through which artemisinin resistance
    arises, so a dedicated term would let the growing set of Kelch13-compartment proteins
    be annotated precisely.
  proposed_parent:
    id: GO:0006897
    label: endocytosis
  supported_by:
  - reference_id: PMID:38039338
    supporting_text: Hemoglobin trafficking to the parasite food vacuole is believed to be initiated at membrane
      invaginations called cytostomes [30,42,48,49] followed by vesicular transport from the
      parasite plasma membrane (PPM) to the food vacuole [42,50], likely in an actin-myosin motor
      dependent manner [48,51–53].
  - reference_id: PMID:38700363
    supporting_text: K13 and its compartment neighbors (KICs), including UBP1, are
      involved in endocytosis of host cell cytosol.
- proposed_name: Kelch13 compartment
  proposed_definition: >-
    A focal cytoplasmic structure at the periphery of an intraerythrocytic Plasmodium
    parasite, adjacent to cytostomes, at which Kelch13 and its interaction partners
    assemble and from which endocytosis of host cell cytosol is initiated. It is distinct
    from the endoplasmic reticulum and from the cytostome itself.
  justification: >-
    Imaging and proximity-labelling studies define a discrete, reproducible site occupied
    by Kelch13 and a growing list of Kelch13 interaction candidates, but GO offers only
    GO:0031910 cytostome, to which these proteins are adjacent rather than resident, or
    uninformative parents such as cell periphery. A dedicated component term would let
    the localization of this protein set be stated without over-asserting cytostome
    membership.
  proposed_parent:
    id: GO:0071944
    label: cell periphery
  supported_by:
  - reference_id: PMID:32310999
    supporting_text: we localize K13 to the parasite endoplasmic reticulum, Rab-positive vesicles, and sites
      adjacent to cytostomes.
  - reference_id: PMID:31896710
    supporting_text: we identified proteins located at a Kelch13-defined compartment.
suggested_questions:
- question: >-
    What molecular step does Kelch13 perform within endocytosis of host cell cytosol: does
    the Kelch propeller recruit specific partners to the cytostome site, or does the
    oligomer act structurally in forming or constricting the invagination?
  experts:
  - Tobias Spielmann
  - Jakob Birnbaum
- question: >-
    Is the reported Kelch13-PfPI3K interaction part of a genuine parasite cullin-RING
    ligase, with an identified cullin and RING partner, or an interaction without an
    E3-adaptor function? Resolving this determines whether GO:1990756
    ubiquitin-like ligase-substrate adaptor activity should ever be asserted for Kelch13.
  experts:
  - Kasturi Haldar
  - David A. Fidock
- question: >-
    Does the hexameric assembly seen in solution exist in the parasite at the Kelch13
    compartment, and do resistance substitutions act by changing assembly, partner
    binding, or protein stability and abundance?
  experts:
  - Tobias Spielmann
- question: >-
    Why is Kelch13 localized partly to the endoplasmic reticulum and to Rab-positive
    vesicles, and does any of that pool contribute to uptake, or does it represent
    biosynthetic transit and a second, unrelated role?
  experts:
  - David A. Fidock
suggested_experiments:
- hypothesis: >-
    Kelch13 acts as the recruitment platform of the host-cytosol uptake site, so loss of
    the propeller surface displaces specific compartment proteins without dissolving the
    site.
  description: >-
    Use conditional knock-sideways of endogenous Kelch13 in lines expressing tagged
    Kelch13-compartment proteins, and score by quantitative live imaging which partners
    lose focal localization and on what timescale, alongside a haemoglobin-uptake readout.
    Complement with propeller point mutants, including resistance alleles, to map the
    surface required for each partner.
  experiment_type: conditional mislocalization with quantitative colocalization imaging
- hypothesis: >-
    The Kelch13-PfPI3K association is not an E3 substrate-adaptor relationship, so no
    parasite cullin-RING ligase co-purifies with Kelch13 and PfPI3K turnover is unchanged
    when cullin function is blocked.
  description: >-
    Perform crosslinking immunoprecipitation mass spectrometry on tagged Kelch13 in
    isogenic wild-type and C580Y lines, searching specifically for cullin, RING and
    neddylation machinery, and measure PfPI3K half-life by cycloheximide chase with and
    without a neddylation inhibitor in both backgrounds.
  experiment_type: interaction proteomics with protein turnover assay
- hypothesis: >-
    Resistance-conferring substitutions act by lowering the amount of functional Kelch13
    at the uptake site rather than by creating a new activity, so graded knockdown of
    wild-type Kelch13 reproduces the full resistance-versus-fitness relationship of the
    mutant alleles.
  description: >-
    Titrate wild-type Kelch13 with an inducible degradation or translational-control
    system across a range of expression levels in an isogenic background, and measure at
    each level the rate of host-cytosol endocytosis, ring-stage survival after a
    dihydroartemisinin pulse, and asexual growth rate, then compare the resulting curves
    with those of lines carrying M476I, R539T and C580Y.
  experiment_type: graded protein depletion with paired resistance and fitness assays
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: PMID:24352242
  title: A molecular marker of artemisinin-resistant Plasmodium falciparum malaria.
  findings:
  - statement: Long-term artemisinin selection of an African parasite line fixed the
      PF3D7_1343700 M476I substitution, which accompanied a rise in ring-stage survival,
      and propeller alleles in Cambodian isolates correlate with resistance in vitro and
      in vivo.
    supporting_text: These data indicate that the PF3D7_1343700 M476I mutation increased
      the resistance of F32-Tanzania to DHA in the RSA0–3h.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The founding K13 resistance-marker paper and the source of the GOA IDA. Cached full
      text read; it establishes genotype-phenotype association and the selection history,
      but contains no evidence that Kelch13 mediates a cellular response to a xenobiotic,
      which is why the GO:0009410 row is marked over-annotated rather than accepted.
- id: PMID:25502314
  title: 'Drug resistance. K13-propeller mutations confer artemisinin resistance in
    Plasmodium falciparum clinical isolates.'
  findings:
  - statement: Zinc-finger-nuclease editing of the K13 locus in Cambodian isolates shows
      that propeller mutations are causal for ring-stage survival, since removing them
      drops survival and inserting them raises it.
    supporting_text: With isolates from Cambodia, where resistance first emerged, survival
      rates decreased from 13 to 49% to 0.3 to 2.4% after the removal of K13 mutations.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID verified through PubMed before caching. Establishes causality of the propeller
      alleles; used here as context for why the resistance phenotype is attributed to K13
      genotype, not as support for any GO term.
- id: PMID:25874676
  title: A molecular mechanism of artemisinin resistance in Plasmodium falciparum
    malaria.
  findings:
  - statement: PfPI3K co-immunoprecipitates with wild-type Kelch13 and binding is reduced
      by the C580Y substitution, which the authors read as loss of substrate-adaptor
      function leading to elevated PfPI3K and PI3P.
    supporting_text: Further analysis revealed that immunopurified (IP) PfPI3K was bound to PfKelch13WT and this
      was reduced by the C580Y mutation (Fig. 2e).
  - statement: The substrate-adaptor interpretation is explicitly an argument from the
      mammalian orthologue rather than a demonstration of a parasite cullin-RING ligase.
    supporting_text: The mammalian orthologue of PfKelch13 functions is a substrate adapter for an E3
      ubiquitin ligase
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Correctly cited and the source of the IntAct IPI with Q8I3V5 (PF3D7_0515300,
      PfPI3K); the interaction data are retained. The mechanistic model it proposes, in
      which Kelch13 is an E3 substrate adaptor controlling PI3P levels, is contested by
      the later endocytosis work and by an independent interactome that recovered no
      ligase components, so the adaptor activity is not asserted in this review.
- id: PMID:31896710
  title: A Kelch13-defined endocytosis pathway mediates artemisinin resistance in
    malaria parasites.
  findings:
  - statement: Kelch13 and seven further proteins of the Kelch13-defined compartment are
      required for endocytosis of host haemoglobin, and their inactivation confers
      artemisinin resistance because less haemoglobin-derived haem is available to
      activate the drug.
    supporting_text: Functional analysis showed that these proteins are required for
      endocytosis of hemoglobin from the host cell. Parasites with inactivated Kelch13 or
      a resistance-conferring Kelch13 mutation displayed reduced hemoglobin endocytosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed. Only the abstract is cached
      (full_text_available: false), so quotations are taken from the abstract; the
      conclusions quoted are the paper's own summary statements and are corroborated
      independently by PMID:38700363 and PMID:38039338.
- id: PMID:32310999
  title: Insights into the intracellular localization, protein associations and artemisinin
    resistance properties of Plasmodium falciparum K13.
  findings:
  - statement: Monoclonal-antibody imaging places K13 at the endoplasmic reticulum, on
