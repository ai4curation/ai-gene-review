- id: PMID:38039338
  title: The Kelch13 compartment contains highly divergent vesicle trafficking proteins
    in malaria parasites.
  findings:
  - statement: Proteins of the Kelch13 compartment that affect endocytosis or artemisinin
      susceptibility are enriched in vesicle-trafficking and endocytosis domains, while a
