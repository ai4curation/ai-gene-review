- id: PMID:23414762
  title: Na(+) regulation in the malaria parasite Plasmodium falciparum involves the
    cation ATPase PfATP4 and is a target of the spiroindolone antimalarials.
  findings:
  - statement: >-
      PfATP4 is a plasma membrane Na(+) efflux pump of the intraerythrocytic parasite,
      related to the ENA Na(+)-ATPases of fungi and plants, and is the target of the
      spiroindolone antimalarials.
    supporting_text: The results are consistent with the hypothesis that PfATP4 is a
      plasma membrane Na+ efflux pump, similar to the ENA Na+-ATPases of other lower
      eukaryotes, and a target of the spiroindolone class of antimalarials.
  - statement: >-
      The earlier assignment of PfATP4 as a Ca(2+)-ATPase was never confirmed and no
      Ca(2+) transport has been demonstrated.
    supporting_text: There is evidence for it having an associated Ca2+-dependent ATPase
      activity (Krishna et al., 2001); however, this has not been confirmed (Rottmann
      et al., 2010), and a Ca2+ transport function has not been demonstrated directly.
  - statement: >-
      Sequence similarity between ENA-type Na(+)-ATPases and SERCA/PMCA Ca(2+) pumps
      has repeatedly caused Na(+)-ATPases to be misannotated as Ca(2+)-ATPases.
    supporting_text: The ENA ATPases are closely related to sarcoplasmic/endoplasmic reticulum Ca2+-ATPases
      (SERCA) and plasma membrane Ca2+-ATPases (PMCA), leading some Na+-ATPases within this family
      to be misannotated as Ca2+-ATPases (Benito et al., 2002).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; the study that established the Na(+) efflux function and
      corrected the Ca(2+)-ATPase assignment. Cited by UniProt for FUNCTION, CATALYTIC
      ACTIVITY and SUBCELLULAR LOCATION.
- id: PMID:29986883
  title: Biochemical characterization and chemical inhibition of PfATP4-associated Na(+)-ATPase
    activity in Plasmodium falciparum membranes.
  findings:
  - statement: >-
      The cipargamin-sensitive ATPase activity of P. falciparum membranes behaves as a
      Na(+) transporter and is insensitive to K(+) and Ca(2+), though sensitive to pH.
    supporting_text: 'Characterization of the cipargamin-sensitive ATPase activity yielded
      data consistent with PfATP4 being a Na + transporter that is sensitive to physiologically
      relevant perturbations of pH, but not of [K + ] or [Ca 2+ ].'
  - statement: >-
      K(+) has no effect on PfATP4-associated ATPase activity across the whole
      physiological range, arguing against a K(+)-transport function.
    supporting_text: 'K + was without effect on PfATP4-associated ATPase activity when
      present at concentrations ranging from 0 to 150 m m .'
  - statement: >-
      The mature trophozoite must export Na(+) across its own plasma membrane to keep
      cytosolic Na(+) low despite the Na(+)-rich infected-erythrocyte cytosol.
    supporting_text: 'Thus, despite its intracellular location, the mature trophozoite
      finds itself in a high-Na + environment and must efflux Na + ions across its plasma
      membrane to maintain a low cytosolic Na + concentration ([Na + ] cyt ).'
  - statement: >-
      PfATP4 is a plasma membrane type II P-type ATPase of a subclass restricted to
      apicomplexan parasites.
    supporting_text: These parasites were characterized by mutations in PfATP4, a plasma membrane type II P-type
      ATPase reported to belong to a subclass unique to apicomplexan parasites ( 3 ).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; the direct biochemical characterisation (Km values, ion
      dependencies) underpinning the removal of the K(+) and Ca(2+) annotations.
- id: PMID:36180431
  title: A G358S mutation in the Plasmodium falciparum Na(+) pump PfATP4 confers clinically-relevant
    resistance to cipargamin.
  findings:
  - statement: >-
      The clinically selected G358S mutation lowers the affinity of PfATP4 for Na(+)
      and raises the resting cytosolic Na(+) concentration of the parasite, linking the
      protein's transport parameters to the parasite's Na(+) set point.
    supporting_text: The G358S mutation reduces the affinity of PfATP4 for Na+ and is associated with an increase
      in the parasite's resting cytosolic [Na+].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; provides mutation-level evidence that PfATP4 activity sets
      cytosolic Na(+), and shows the equivalent mutation behaves the same way in
      Toxoplasma gondii ATP4.
- id: PMID:29555632
  title: Cell Swelling Induced by the Antimalarial KAE609 (Cipargamin) and Other PfATP4-Associated
    Antimalarials.
  findings:
  - statement: >-
      Structurally diverse PfATP4-targeting compounds cause swelling of isolated
      blood-stage parasites and of infected erythrocytes, the osmotic consequence of
      Na(+) accumulation when the pump is inhibited.
    supporting_text: Here we show that six structurally diverse PfATP4-associated compounds,
      including the clinical candidate KAE609 (cipargamin), induce swelling of both isolated
      blood-stage parasites and intact parasitized erythrocytes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached; supports the physiological consequence of loss of PfATP4
      activity rather than the molecular function itself.
- id: PMID:41115914
  title: Endogenous structure of antimalarial target PfATP4 reveals an apicomplexan-specific
    P-type ATPase modulator.
  findings:
  - statement: >-
      A 3.7 A cryo-EM structure of endogenously purified PfATP4 resolves its ATP- and
      ion-binding sites.
    supporting_text: Our structure reveals the molecular details of ATP and ion-binding sites in PfATP4 and
      provides a structural framework for understanding the spatial organization of
      resistance-conferring mutations.
  - statement: >-
      The cation-binding site lies between TM4, TM5, TM6 and TM8 as in SERCA, with
      conserved Na(+)-coordinating side chains.
    supporting_text: The ion-binding site within the TMD is located between TM4, TM5, TM6 and TM8, similar to
      that of SERCA24,25(Fig. 2c).
  - statement: >-
      PfATP4 forms a complex with an apicomplexan-specific partner, PfABP, on which its
      stability depends; PfABP knockdown depletes PfATP4 and kills the parasite.
    supporting_text: Interestingly, PfABP knockdown also led to a marked reduction in PfATP4 protein levels
      within 24 h, highlighting a strict dependency of PfATP4 stability on its association with
      PfABP (Fig. 4d, Supplementary Fig. 4b, c).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (Nat Commun 2025, PMC12537908); structural confirmation of the
      ATP and cation sites, and the source of the PfABP knowledge gap. Not yet cited by
      the UniProt entry or GOA.
- id: PMID:25453091
  title: (+)-SJ733, a clinical candidate for malaria that acts through ATP4 to induce
    rapid host-mediated clearance of Plasmodium.
  findings:
  - statement: >-
      Inhibition of ATP4 by (+)-SJ733 clears parasites in vivo by inducing
      eryptosis/senescence of infected erythrocytes, a host-mediated consequence of
      disrupting parasite Na(+) regulation rather than a function of ATP4 itself.
    supporting_text: (+)-SJ733 cleared parasites in vivo as quickly as artesunate by
      specifically inducing eryptosis/senescence in infected, treated erythrocytes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached; drug-mechanism study. Included to make explicit that the
      host-clearance phenotype is downstream of pharmacological inhibition and is not
      grounds for a host-interaction GO annotation on ATP4.
- id: PMID:20813948
  title: Spiroindolones, a potent compound class for the treatment of malaria.
  findings:
  - statement: >-
      Resistance to the spiroindolones is conferred by nonsynonymous mutations in the
      gene encoding PfATP4, identifying the protein as the target.
    supporting_text: Spiroindolones rapidly inhibit protein synthesis in P. falciparum,
      an effect that is ablated in parasites bearing nonsynonymous mutations in the gene
      encoding the P-type cation-transporter ATPase4 (PfATP4).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached; identifies PfATP4 as the resistance locus and is the source of
      many UniProt variant annotations, but does not itself establish the transported
      ion.
- id: PMID:25322084
  title: Mutations in the P-type cation-transporter ATPase 4, PfATP4, mediate resistance
    to both aminopyrazole and spiroindolone antimalarials.
  findings:
  - statement: >-
      Independent chemotypes (aminopyrazoles and spiroindolones) select overlapping
      resistance mutations in PfATP4, consistent with a shared target.
    supporting_text: Mutations in the P-type cation-transporter ATPase 4, PfATP4, mediate
      resistance to both aminopyrazole and spiroindolone antimalarials.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text cached; chemical-genetics support for PfATP4 as the common target,
      contextual for the function review.
- id: PMID:31311978
  title: A 4-cyano-3-methylisoquinoline inhibitor of Plasmodium falciparum growth targets
    the sodium efflux pump PfATP4.
  findings:
  - statement: >-
      A further chemotype inhibits PfATP4-associated Na(+)-ATPase activity, reinforcing
      the identification of the protein as a sodium efflux pump.
    supporting_text: A 4-cyano-3-methylisoquinoline inhibitor of Plasmodium falciparum
      growth targets the sodium efflux pump PfATP4.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached; cited by UniProt for FUNCTION and CATALYTIC ACTIVITY.
- id: PMID:11145964
  title: Expression and functional characterization of a Plasmodium falciparum Ca2+-ATPase
    (PfATP4) belonging to a subclass unique to apicomplexan organisms.
  findings:
  - statement: >-
      PfATP4 expressed in Xenopus oocytes showed a Ca(2+)-stimulated ATPase activity
      over an unusually broad range of free Ca(2+), the basis of the original (and now
      superseded) assignment of PfATP4 as a Ca(2+)-ATPase.
    supporting_text: The Ca(2+)-dependent ATPase activity of PfATP4 is stimulated by a
      much broader range of [Ca(2+)](free) (3.2-320 micrometer) than are an avian SERCA1
      pump or rabbit SERCA 1a (maximal activity < 10 micrometer).
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:23414762
      supported_by:
      - reference_id: PMID:23414762
        supporting_text: There is evidence for it having an associated Ca2+-dependent
          ATPase activity (Krishna et al., 2001); however, this has not been confirmed
          (Rottmann et al., 2010), and a Ca2+ transport function has not been demonstrated
          directly.
  - statement: >-
      PfATP4 defines a P-type ATPase subclass unique to apicomplexan organisms.
    supporting_text: This analysis suggests that PfATP4 defines a novel subclass of Ca(2+)-ATPases
      unique to apicomplexan organisms and therefore offers potential as a drug target.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Abstract only in the cache (full_text_available false). Correctly cited, but its
      central conclusion that PfATP4 is a Ca(2+)-ATPase is contested: later work found
      no Ca(2+) transport and a Na(+)-dependent, Ca(2+)-insensitive ATPase activity, and
      UniProt carries a CAUTION to this effect.
- id: PMID:8813672
  title: Analysis of a cation-transporting ATPase of Plasmodium falciparum.
  findings:
  - statement: >-
      The original cloning of PfATPase4 localised the protein to discrete compartments
      at the periphery of the parasite across asexual stages, including free merozoites.
    supporting_text: Immunofluorescence microscopy reveals that the PfATPase4 protein
      is concentrated in discrete compartments at the periphery of the parasite.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the cache. Historically important (gene cloning, peripheral
      localisation, stage expression); its sequence-based inference that PfATPase4 is
      most like an endoplasmic reticulum Ca(2+)-ATPase has been superseded.
