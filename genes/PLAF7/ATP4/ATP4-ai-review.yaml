  review:
    summary: >-
      Transfer from the SERCA/PMCA Ca(2+)-pump side of the P2-type ATPase tree. PfATP4
      was originally described as a Ca(2+)-ATPase on sequence grounds and on a
      Ca(2+)-stimulated ATPase activity in Xenopus oocytes, but Ca(2+) transport has
      never been demonstrated and later work found the PfATP4-associated ATPase
