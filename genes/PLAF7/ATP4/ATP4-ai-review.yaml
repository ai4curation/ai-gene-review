id: A0A143ZZK9
gene_symbol: ATP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: >-
  PfATP4 is a 1264-residue P2-type (P-type, TC 3.A.3 family) cation-transporting
  ATPase of the plasma membrane of the intraerythrocytic malaria parasite
  Plasmodium falciparum. It is an ATP-driven sodium efflux pump (EC 7.2.2.3):
  hydrolysis of ATP at its cytoplasmic N/P/A domains is coupled to extrusion of
  Na(+) across the parasite plasma membrane, with a Km for Na(+) of about 16 mM
  and for ATP of about 0.23 mM. Because the mature trophozoite induces new
  permeability pathways in the host erythrocyte membrane, the parasite sits in a
  Na(+)-rich cytosol, and PfATP4 is the principal mechanism by which it keeps its
  own cytosolic Na(+) low; loss of pump activity leads to Na(+) accumulation,
  cytosolic alkalinisation and osmotic swelling of the parasite. The protein
  belongs to a P-type ATPase subclass restricted to apicomplexans and is most
  closely related to the fungal and plant ENA Na(+)-ATPases, a group whose
  similarity to SERCA/PMCA Ca(2+) pumps led to early misassignment of PfATP4 as a
  Ca(2+)-ATPase; Ca(2+) transport has never been demonstrated and the
  PfATP4-associated ATPase activity is insensitive to Ca(2+) and to K(+). A
  cryo-EM structure of the endogenous protein shows a SERCA-like architecture
  with a conserved cation-binding site between TM4, TM5, TM6 and TM8, and an
  apicomplexan-specific partner protein (PfABP) on which PfATP4 stability
  depends. PfATP4 is the target of several chemically unrelated antimalarial
  chemotypes, including the clinical candidates cipargamin (KAE609) and
  (+)-SJ733, and resistance mutations map throughout the protein.
