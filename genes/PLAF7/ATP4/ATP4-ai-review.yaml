- term:
    id: GO:0006883
    label: intracellular sodium ion homeostasis
  evidence_type: IMP
  original_reference_id: PMID:36180431
  qualifier: involved_in
  review:
    summary: >-
      PfATP4 sets the low resting cytosolic Na(+) concentration of the
      intraerythrocytic parasite. Point mutations in PfATP4 that lower its Na(+)
      affinity raise resting cytosolic Na(+), and chemical inhibition causes Na(+)
      accumulation and osmotic swelling.
    action: NEW
    reason: >-
      The homeostatic set point is established by the pump's own transport activity,
      so PfATP4 performs the work of this process rather than merely being required
      for it. Mutations within the protein that change its Na(+) affinity shift the
      set point, which is participation evidence rather than necessity evidence alone.
    supported_by:
    - reference_id: PMID:36180431
      supporting_text: The G358S mutation reduces the affinity of PfATP4 for Na+ and is associated with an
        increase in the parasite's resting cytosolic [Na+].
    - reference_id: PMID:29555632
      supporting_text: Here we show that six structurally diverse PfATP4-associated
        compounds, including the clinical candidate KAE609 (cipargamin), induce swelling
        of both isolated blood-stage parasites and intact parasitized erythrocytes.
core_functions:
- description: >-
    ATP-driven sodium efflux pump of the parasite plasma membrane: PfATP4 couples
    hydrolysis of ATP at its cytoplasmic N/P/A domains to translocation of Na(+) from
    the parasite cytosol to the host erythrocyte cytosol (EC 7.2.2.3), with Km(Na+)
    ~16 mM and Km(ATP) ~0.23 mM. This single activity accounts for the maintenance of
    a low cytosolic Na(+) concentration in the intraerythrocytic parasite, which lives
    in a Na(+)-rich host cytosol created by the new permeability pathways, and for the
    Na(+) accumulation, cytosolic alkalinisation and osmotic swelling seen when the
    pump is chemically inhibited.
  supported_by:
  - reference_id: PMID:23414762
    supporting_text: The results are consistent with the hypothesis that PfATP4 is a
      plasma membrane Na+ efflux pump, similar to the ENA Na+-ATPases of other lower
      eukaryotes, and a target of the spiroindolone class of antimalarials.
  - reference_id: PMID:29986883
    supporting_text: 'Characterization of the cipargamin-sensitive ATPase activity yielded
      data consistent with PfATP4 being a Na + transporter that is sensitive to physiologically
      relevant perturbations of pH, but not of [K + ] or [Ca 2+ ].'
  molecular_function:
    id: GO:0008554
    label: P-type sodium transporter activity
  directly_involved_in:
  - id: GO:0036376
    label: sodium ion export across plasma membrane
  - id: GO:0006883
    label: intracellular sodium ion homeostasis
  locations:
  - id: GO:0005886
    label: plasma membrane
knowledge_gaps:
- gap_statement: >-
    The counter-ion of PfATP4 is unknown. Inhibition of the pump produces a
    Na(+)-dependent cytosolic alkalinisation, which has been read as a cessation of
    H(+) import, but no direct measurement of H(+) (or any other ion) counter-transport
    coupled to Na(+) extrusion exists, so the transport stoichiometry of the pump is
    undetermined.
  boundary: >-
    That PfATP4 exports Na(+) in an ATP-dependent manner with Km(Na+) ~16 mM, and that
    its activity increases with increasing pH, is established biochemically in parasite
    membranes.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Whether PfATP4 is a Na(+)/H(+)-ATPase or an electrogenic Na(+) pump determines how
    its inhibition perturbs parasite pH as well as Na(+), and therefore which of the
    two disruptions kills the parasite; this bears directly on the mechanism of
    cipargamin and (+)-SJ733.
  resolution: >-
    Reconstitution of purified PfATP4 (now feasible given the endogenous purification
    used for the cryo-EM structure) into proteoliposomes with simultaneous measurement
    of Na(+) movement, pH change and membrane potential.
- gap_statement: >-
    The functional role of the apicomplexan-specific partner protein PfABP is unknown:
    it is required for PfATP4 protein stability, but whether it also modulates the
    pump's catalytic cycle, ion affinity or trafficking, in the manner of a Na(+)/K(+)
    ATPase beta subunit, has not been tested.
  boundary: >-
    The cryo-EM structure of endogenous PfATP4 shows a stable PfATP4-PfABP complex with
    a conserved interface, and conditional knockdown of PfABP reduces PfATP4 levels
    within 24 h and kills the parasite.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    If PfABP is a regulatory subunit rather than only a stabiliser, the interface is a
    druggable site distinct from the inhibitor-binding pockets where resistance
    mutations arise.
  resolution: >-
    Separation-of-function mutations at the PfATP4-PfABP interface that preserve PfATP4
    abundance, combined with Na(+)-dependent ATPase assays and cytosolic Na(+)
    measurements in the mutant parasites.
suggested_questions:
- question: >-
    Is H(+) the counter-transported ion of PfATP4, and what is the Na(+):H(+):ATP
    stoichiometry of the transport cycle?
- question: >-
    Does PfATP4 function in mosquito and liver stages, where the parasite's ionic
    environment differs from the Na(+)-rich infected erythrocyte cytosol, or is its
    role restricted to the asexual blood stage?
- question: >-
    Is PfABP a regulatory subunit of PfATP4 (analogous to the Na(+)/K(+)-ATPase beta
    subunit) or purely a stability factor, and should the PfATP4-PfABP complex be
    represented as a protein-containing complex in GO?
suggested_experiments:
- description: >-
    Reconstitute endogenously purified PfATP4 (with and without PfABP) into
    proteoliposomes and measure ATP-dependent Na(+) flux, internal pH change and
    membrane potential simultaneously, to establish the counter-ion and the transport
    stoichiometry.
- description: >-
    Test for K(+) and Ca(2+) translocation by the reconstituted pump using radiotracer
    or fluorescent-indicator flux assays, to settle directly the K(+) and Ca(2+)
    annotations removed here on the basis of ATPase-activity data.
- description: >-
    Conditional knockdown or stage-specific depletion of PfATP4 in gametocytes,
    mosquito stages and liver stages, with cytosolic Na(+) imaging, to determine
    whether Na(+) extrusion by PfATP4 is required outside the asexual blood stage.
