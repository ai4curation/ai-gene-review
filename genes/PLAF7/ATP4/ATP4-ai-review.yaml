  - PomBase:SPBC839.06
  - SGD:S000002446
  - SGD:S000002447
  - UniProtKB:Q7XB51
  review:
    summary: >-
      The PAINT node groups PfATP4 with the fungal and plant ENA-type plasma membrane
      cation ATPases. Direct experimental work in P. falciparum places PfATP4 in the
      parasite plasma membrane, where it effluxes Na(+) into the host erythrocyte
      cytosol.
    action: ACCEPT
    reason: >-
      The phylogenetic inference is confirmed by parasite-specific evidence: UniProt
      records cell membrane localisation from four independent studies, and the
      transport physiology (efflux of Na(+) out of the parasite against an inward
      gradient) requires the parasite surface membrane. Note this is the symbiont's
      own plasma membrane, not the host erythrocyte membrane.
    supported_by:
    - reference_id: PMID:29986883
      supporting_text: These parasites were characterized by mutations in PfATP4, a plasma membrane type II
        P-type ATPase reported to belong to a subclass unique to apicomplexan parasites ( 3 ).
    - reference_id: PMID:23414762
      supporting_text: The results are consistent with the hypothesis that PfATP4 is
        a plasma membrane Na+ efflux pump, similar to the ENA Na+-ATPases of other
        lower eukaryotes, and a target of the spiroindolone class of antimalarials.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000643667
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The ancestral node for ENA-type plasma membrane cation pumps; the
          localisation it asserts is independently confirmed for PfATP4 in the
          parasite.
