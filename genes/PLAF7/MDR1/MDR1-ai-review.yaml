    supporting_text: 'Lumefantrine, mefloquine, and chloroquine are weak bases that enter
      the DV via 2 main routes: (1) simple diffusion of the neutral species across the
      membrane and subsequent protonation within the acidic DV lumen; and (2) ATP-driven
      import via PfMDR1.'
  - reference_id: PMID:37527341
    supporting_text: Upon ATP binding and dimerization of the nucleotide-binding domains
      (NBDs), PfMDR1 displays an outward-facing conformation with a cavity toward the DV
      lumen.
  - reference_id: PMID:1674943
    supporting_text: localized on the membrane of the digestive vacuole of mature parasites.
  knowledge_gaps:
  - gap_statement: The endogenous, physiological substrate translocated by PfMDR1 is
      unidentified; every substrate characterized to date is a xenobiotic drug or a
      heterologous P-glycoprotein probe.
    boundary: It is firmly established that PfMDR1 is an ATP-hydrolysing ABC transporter
      of the digestive vacuole membrane that moves amphipathic xenobiotics from the
      cytosol into the vacuole lumen, with measured kinetics and resolved inward- and
      outward-facing structures. What the transporter evolved to move, and why its loss
      is reported to be deleterious, are not known.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
proposed_new_terms:
- proposed_name: food vacuole membrane
  proposed_definition: The lipid bilayer surrounding the food vacuole, the acidic
    lysosome-like compartment of apicomplexan parasites in which endocytosed host-cell
    material such as haemoglobin is digested.
  justification: GO contains GO:0020020 food vacuole but no corresponding membrane class
    (OLS returns no match for "food vacuole membrane", and GO:0020020 has no children).
    Integral membrane proteins of the Plasmodium digestive vacuole membrane, of which
    PfMDR1 and PfCRT are the best characterized and are major antimalarial-resistance
    determinants, can therefore only be annotated to the generic GO:0005774 vacuolar
    membrane, losing the apicomplexan-specific compartment that makes their biology
    interpretable. A dedicated child of GO:0005774 would let the location and the
    organelle be stated in one term, as is already possible for lysosomal membrane.
  proposed_parent:
    id: GO:0005774
    label: vacuolar membrane
  supported_by:
  - reference_id: PMID:1674943
    supporting_text: Immunofluorescence and immunoelectron microscopy has demonstrated
      that Pgh1 is localized on the membrane of the digestive vacuole of mature
      parasites.
  - reference_id: PMID:35507548
    supporting_text: 'PfMDR1 and PfCRT reside in the membrane of the parasite’s digestive
      vacuole (DV), the lysosomal-type compartment (pH 5.0 to 5.5) in which many
      antimalarials accumulate, act, and/or are activated.'
suggested_questions:
- question: What is the endogenous substrate of PfMDR1? Given that its digestive vacuole
    neighbour PfCRT exports haemoglobin-derived peptides, is the natural cargo a product
    of haemoglobin digestion, a lipid, or a parasite metabolite?
  experts:
  - Rowena E. Martin
  - Sarah H. Shafik
- question: What relieves the autoinhibition imposed by the N-terminal regulatory
    element in vivo? Unlike the CFTR R domain it lacks phosphorylation sites, so is
    regulation by ligand binding, pH, or proteolysis?
  experts:
  - Maojun Li
  - Kun Si
- question: Is the direction of transport in the parasite strictly cytosol-to-lumen for
    all substrates, and does the acidic vacuolar pH contribute to net accumulation
    independently of the pump?
  experts: []
- question: Does PfMDR1 copy-number amplification alter any process beyond drug
    distribution, for example haemoglobin catabolism or vacuolar homeostasis, that would
    justify an additional biological process annotation?
  experts: []
suggested_experiments:
- hypothesis: PfMDR1 transports a product of host haemoglobin digestion, analogous to
    the peptide-export role of PfCRT.
  description: Perform untargeted metabolomic and peptidomic comparison of isolated
    digestive vacuoles and cytosolic fractions from parasites with conditional
    knockdown of pfmdr1 versus controls, and test candidate hits directly in the
    established Xenopus oocyte PfMDR1 expression system for saturable, ATP-dependent
    uptake.
  experiment_type: conditional knockdown plus organellar metabolomics and heterologous
    transport assay
- hypothesis: The N-terminal regulatory helices autoinhibit PfMDR1 in the parasite, and
    their removal increases drug sequestration in the digestive vacuole.
  description: Generate parasite lines expressing the N-terminally truncated transporter
    at the endogenous locus and compare vacuolar accumulation of radiolabelled
    mefloquine and lumefantrine, drug susceptibility, and growth rate against isogenic
    wild-type parasites.
  experiment_type: allelic replacement with drug accumulation assays
- hypothesis: PfMDR1 is essential for asexual blood-stage growth independently of drug
    exposure.
  description: Use a conditional degradation or DiCre excision system to deplete PfMDR1
    in the absence of drug pressure and quantify the effect on intraerythrocytic
    development, haemozoin formation, and digestive vacuole morphology by electron
    microscopy.
  experiment_type: conditional protein depletion with phenotypic profiling
