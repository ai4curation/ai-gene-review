id: Q7K6A5
gene_symbol: MDR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: PfMDR1 (P-glycoprotein homologue 1, Pgh1; PF3D7_0523000) is a full-length
  type-1 ABC transporter of the ABCB/multidrug-resistance-exporter subfamily, built
  from two transmembrane domains and two cytosolic nucleotide-binding domains. It
  resides in the membrane of the parasite's digestive (food) vacuole, the acidic,
  lysosome-like organelle in which endocytosed host haemoglobin is degraded, and is
  expressed throughout the asexual intraerythrocytic cycle as well as in gametocytes.
  The protein binds and hydrolyses ATP at its nucleotide-binding domains and couples
  that hydrolysis to the movement of amphipathic solutes across the vacuolar membrane.
  Because its nucleotide-binding domains face the parasite cytosol, the transport cycle
  runs inward with respect to the organelle, pumping substrates from the cytosol into
  the digestive vacuole lumen rather than out of the cell. Cryo-EM structures show
  the canonical ABC exporter cycle, from an inward-facing apo state with a large
  cytosol-open cavity to an ATP-bound, NBD-dimerized state opening toward the vacuolar
  lumen, together with an unusual N-terminal helical regulatory element that hinders
  NBD dimerization and damps ATPase activity. PfMDR1 accepts a broad range of
  amphipathic xenobiotics, including most quinoline and arylamino-alcohol antimalarials
  and classic human P-glycoprotein substrates; by concentrating such compounds in the
  vacuole it changes their distribution between vacuole and cytosol, and naturally
  occurring sequence variants that alter transport capacity shift parasite
  susceptibility to several antimalarial drugs. Its endogenous physiological substrate
  is not known.
