  review:
    summary: ATPase activity is inferred from the ABC nucleotide-binding-domain signature
      and confirmed directly. Purified PfMDR1 hydrolyses ATP, the activity is abolished
      by mutating the two catalytic glutamates, and it is modulated by drugs and by
      resistance-associated substitutions.
    action: ACCEPT
    reason: Directly measured on purified protein rather than merely inferred. The
      wild-type protein shows substantial ATPase activity that is lost in the
      E588Q/E1337Q catalytic mutant, and UniProt records a KM of 0.33 mM for ATP with a
      Vmax of 198.3 nmol/min/mg. ATP hydrolysis is the energizing half-reaction of the
      core transport activity, so this is retained as core.
    supported_by:
    - reference_id: PMID:37527341
      supporting_text: To confirm that the PfMDR1 protein purified in a detergent
        solution is functionally active, we measured the ATP hydrolysis activity at
        different ATP concentrations.
    - reference_id: PMID:37527341
      supporting_text: Compared to the EQ mutant protein in which the key catalytic
        glutamates were mutated to glutamines, the wild-type PfMDR1 protein showed
        significant ATPase activity.
