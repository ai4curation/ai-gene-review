knowledge_gaps:
- gap_statement: No clean genetic test of pfmdr1 essentiality or of its drug-independent
    cellular role has been reported; essentiality is asserted in reviews rather than
    demonstrated by conditional depletion in the literature read here.
  boundary: Copy-number variation and point mutations at this locus are extensively
    characterized and demonstrably shift antimalarial susceptibility, and the protein's
    biochemistry and structure are solved. What is missing is the phenotype of acute
    loss of the protein in the absence of drug pressure.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
