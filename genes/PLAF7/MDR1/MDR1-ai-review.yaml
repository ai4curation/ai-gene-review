  review:
    summary: PfMDR1 carries two canonical ABC nucleotide-binding domains; nucleotide
      binding is directly demonstrated by 8-azido-ATP photoaffinity labelling of the
      protein in purified digestive vacuoles, and ATP-bound cryo-EM structures resolve
      the nucleotides at the NBD dimer interface.
    action: ACCEPT
    reason: The InterPro-based electronic assertion is confirmed by direct experimental
      evidence on this very protein. Photoaffinity labelling with 8-N3-ATP is competed
      by ATP, ADP, GTP and GDP but not by the monophosphates, showing genuine nucleotide
      binding rather than nonspecific labelling, and the cryo-EM work resolves ATP bound
      at the NBDs with the conserved A-loop and Q-loop contacts. ATP binding is an
      integral part of the core transport activity, so this is kept as core.
    supported_by:
    - reference_id: PMID:8097560
      supporting_text: Inhibition of photoaffinity labeling of PGH1 could be achieved
        with ATP, ADP, GTP and GDP but not with AMP or GMP.
    - reference_id: PMID:37527341
      supporting_text: Upon ATP binding and dimerization of the nucleotide-binding
        domains (NBDs), PfMDR1 displays an outward-facing conformation with a cavity
        toward the DV lumen.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026971
  review:
    summary: An ARBA machine-learning assignment of the generic compartment "cytoplasm".
      PfMDR1 is a multi-pass integral membrane protein of the digestive vacuole membrane,
      which is a cytoplasmic organelle, so the term is not false but conveys nothing
      about where the protein acts.
    action: MODIFY
    reason: The claim is true only in the trivial sense that the food vacuole lies within
      the cytoplasm; the evidence supports a far more precise location. Immunofluorescence
      and immunoelectron microscopy place Pgh1 on the digestive vacuole membrane, and
      UniProt records the subcellular location as vacuole membrane, multi-pass membrane
      protein. Replacing with the supported descendant GO:0005774 vacuolar membrane,
      which the gene already carries, rather than removing a true-but-uninformative row.
    proposed_replacement_terms:
    - id: GO:0005774
      label: vacuolar membrane
    supported_by:
    - reference_id: PMID:1674943
      supporting_text: Immunofluorescence and immunoelectron microscopy has demonstrated
        that Pgh1 is localized on the membrane of the digestive vacuole of mature
        parasites.
