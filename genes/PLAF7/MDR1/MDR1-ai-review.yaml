core_functions:
- description: ATP-driven ABC transporter of the digestive (food) vacuole membrane that
    binds and hydrolyses ATP at its cytosolic nucleotide-binding domains and couples the
    hydrolysis cycle to translocation of amphipathic xenobiotics, including most
    quinoline and arylamino-alcohol antimalarials, from the parasite cytosol across the
    vacuolar membrane into the vacuole lumen, thereby controlling the distribution of
    such compounds between the two compartments.
