- term:
    id: GO:0008559
    label: ABC-type xenobiotic transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:7.6.2.2
  review:
    summary: The EC 7.6.2.2 mapping asserts ATP-hydrolysis-coupled xenobiotic transport.
      Direct measurements in a Xenopus oocyte expression system show that PfMDR1 moves
      a structurally diverse set of amphipathic drugs across a membrane in an
      ATP-dependent manner, and purified protein hydrolyses ATP.
    action: ACCEPT
    reason: This is the core molecular function, and it is experimentally grounded for
      this accession rather than merely inferred from the EC mapping. Wild-type PfMDR1
      transports lumefantrine, mefloquine, chloroquine, quinine, quinidine, amodiaquine,
      piperaquine, dihydroartemisinin and quinacrine, as well as the human P-glycoprotein
      substrates rhodamine B and vinblastine, while failing to transport amantadine, and
      transport is stimulated by injected ATP. UniProt records the corresponding
      experimental catalytic activity, EC 7.6.2.2, for this entry.
    supported_by:
    - reference_id: PMID:35507548
      supporting_text: We show that wild-type PfMDR1 transports diverse pharmacons,
        including lumefantrine, mefloquine, dihydroartemisinin, piperaquine, amodiaquine,
        methylene blue, and chloroquine (but not the antiviral drug amantadine).
    - reference_id: file:PLAF7/MDR1/MDR1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=ATP + H2O + xenobioticSide 1 = ADP + phosphate +
        xenobioticSide 2.'
- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IDA
  original_reference_id: PMID:10706290
  qualifier: involved_in
  review:
    summary: Allelic-exchange experiments showed that mutations in Pgh1 confer resistance
      to mefloquine, quinine and halofantrine and modulate chloroquine and artemisinin
      susceptibility. This establishes that the protein determines how the parasite
      handles these drugs, but what PfMDR1 itself executes is transmembrane drug
      transport, not a cellular response program.
    action: MODIFY
    reason: The essence of the annotation is sound and the underlying experiment is
      strong, but "response to xenobiotic stimulus" describes a change in cell state
      triggered by a xenobiotic, whereas the step PfMDR1 performs is ATP-driven movement
      of the drug across the digestive vacuole membrane. Later direct transport
      measurements identify that step explicitly. Replacing with GO:0006855 xenobiotic
      transmembrane transport (verified via OLS as a descendant of both GO:0042908 and
      GO:0055085), which states what this gene product does and still captures the drug
      handling the IDA demonstrates. No part of the claim is being discarded.
    proposed_replacement_terms:
    - id: GO:0006855
      label: xenobiotic transmembrane transport
    additional_reference_ids:
    - PMID:35507548
    supported_by:
    - reference_id: PMID:10706290
      supporting_text: mutations in Pgh1 can confer resistance to mefloquine, quinine
        and halofantrine.
    - reference_id: PMID:35507548
      supporting_text: 'Lumefantrine, mefloquine, and chloroquine are weak bases that
        enter the DV via 2 main routes: (1) simple diffusion of the neutral species
        across the membrane and subsequent protonation within the acidic DV lumen; and
        (2) ATP-driven import via PfMDR1.'
