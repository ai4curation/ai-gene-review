- id: PMID:10706290
  title: Pgh1 modulates sensitivity and resistance to multiple antimalarials in Plasmodium
    falciparum.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache; PubMed-verified Nature 2000 allelic-exchange
      study showing that Pgh1 mutations confer resistance to mefloquine, quinine and
      halofantrine and modulate chloroquine and artemisinin sensitivity. It is the
      source of the GO:0009410 IDA row and supports drug handling by this protein,
      though the step the protein itself performs is better described as transport.
- id: PMID:1674943
  title: A P-glycoprotein homologue of Plasmodium falciparum is localized on the digestive
    vacuole.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache but the localization claim is explicit in
      the abstract and is the basis of the GO:0020020 IDA row; independently confirmed
      by PMID:8097560, PMID:35507548 and PMID:37527341.
- id: PMID:35507548
  title: Mechanistic basis for multidrug resistance and collateral drug sensitivity
    conferred to the malaria parasite by polymorphisms in PfMDR1 and PfCRT.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The decisive functional study, giving direct,
      ATP-dependent, saturable transport of diverse antimalarials by PfMDR1 expressed in
      Xenopus oocytes, with the direction of transport established as cytosol into the
      digestive vacuole. Cited by UniProt for the FUNCTION and CATALYTIC ACTIVITY
      statements.
- id: PMID:37527341
  title: The structure of Plasmodium falciparum multidrug resistance protein 1 reveals
    an N-terminal regulatory domain.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Cryo-EM structures in apo, ATP-bound and
      mefloquine-bound states plus ATPase kinetics on purified protein, identifying an
      N-terminal autoinhibitory regulatory domain. Cited by UniProt for the kinetic
      parameters.
- id: PMID:8097560
  title: Nucleotide binding properties of a P-glycoprotein homologue from Plasmodium
    falciparum.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. 8-azido-ATP photoaffinity labelling of
