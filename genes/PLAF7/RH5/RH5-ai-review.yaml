- term:
    id: GO:0141134
    label: symbiont-mediated activation of host signal transduction pathway via agonism of host cell surface
      receptor
  evidence_type: IDA
  original_reference_id: PMID:28409866
  review:
    summary: Engagement of host basigin by RH5 is by itself sufficient to trigger a Ca2+ signal in the
      erythrocyte, with downstream phosphorylation and remodelling of the host cytoskeleton; antibodies
      that block the signal block invasion before junction formation.
    action: NEW
    reason: 'RH5 performs this step itself: the agonism is the RH5-basigin binding event, shown with recombinant
      RH5 on erythrocytes in the absence of other parasite proteins (PMID:28409866), and the same requirement
      is seen for the assembled complex during invasion (PMID:27374406). The term was verified in OLS
      and is scoped from the symbiont''s side, which is the correct direction for a parasite ligand acting
      on a host receptor. This is not covered by the entry/adhesion terms, which describe the parasite''s
      own movement into the cell rather than its effect on host signalling, and it is not merely a necessity
      claim: the trigger is attributed to the interaction itself, not to RH5 being required for a later
      step.'
    supported_by:
    - reference_id: PMID:28409866
      supporting_text: We show that RH5-Basigin interaction on its own triggers a Ca2+ signal in the RBC
        resulting in changes in RBC cytoskeletal proteins phosphorylation and overall alterations in RBC
        cytoskeleton architecture.
    - reference_id: PMID:28409866
      supporting_text: Antibodies targeting RH5 that block the signal prevent invasion before junction
        formation consistent with the Ca2+ signal in the RBC leading to rearrangement of the cytoskeleton
        required for invasion.
    - reference_id: PMID:27374406
      supporting_text: PfRipr, CyRPA, and PfRipr/CyRPA/PfRh5-basigin complex is required for triggering
        the Ca(2+) release and establishing the tight junction.
