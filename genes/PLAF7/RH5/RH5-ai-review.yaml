      definition of the descendant GO:0085017 entry into host cell by a symbiont-containing vacuole, and
      it is the term GOA itself uses for P. falciparum invasion proteins (MSP1 by IDA, CSP by IMP). The
      intermediate GO:0046718 symbiont entry into host cell, which the gene also carries, is framed
      around breaching the membrane and releasing the symbiont or its genome into the cytoplasm, so it
      is both less specific and a poorer fit; these rows are refined to GO:0085017 instead.
    proposed_replacement_terms: *id002
