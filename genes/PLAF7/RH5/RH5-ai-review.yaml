id: Q8IFM5
gene_symbol: RH5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: 'Reticulocyte-binding protein homolog 5 (PfRH5) is a small, secreted blood-stage adhesin
  of the human malaria parasite Plasmodium falciparum and the only essential member of the reticulocyte-binding-like
  homolog (PfRh) family. Unlike the other family members it is short and lacks both a transmembrane segment
  and a GPI anchor, so after synthesis in schizonts it is stored in the lumen of the rhoptries, the apical
  secretory organelles of the merozoite, and is discharged onto the merozoite surface at the moment of
  invasion. There it is held by the GPI-anchored surface protein P113, which binds its N-terminal region,
  and assembles with the GPI-anchored CyRPA and the EGF-domain protein PfRipr into a structurally defined
  trimeric invasion complex. Through its kite-shaped C-terminal domain RH5 binds basigin (BSG/CD147, the
  Ok blood group antigen) on the erythrocyte surface; this receptor-ligand pair is required for invasion
  by every parasite strain examined, and the affinity of RH5 for basigin orthologues tracks the host range
  of the Laverania parasites, making it a determinant of P. falciparum''s restriction to humans. Receptor
  engagement is not merely an anchor: it triggers a calcium signal inside the erythrocyte and remodelling
  of the host cytoskeleton, and the complex inserts into the host membrane, after which the merozoite
  attaches irreversibly, forms the moving junction and enters the cell. Parasites depleted of RH5 still
  contact erythrocytes but cannot commit to invasion.'
