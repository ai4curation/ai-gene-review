- term:
    id: GO:0005923
    label: bicellular tight junction
  evidence_type: IDA
  original_reference_id: PMID:19000690
  qualifier: located_in
  review:
    summary: Annotation derived from the observation that RH5 'follows the tight junction' during erythrocyte
      invasion.
    action: MODIFY
    proposed_replacement_terms:
    - id: NTR
      label: moving junction
    reason: GO:0005923 bicellular tight junction is defined as 'An occluding cell-cell junction that is
      composed of a branching network of sealing strands that completely encircles the apical end of each
      cell in an epithelial sheet' - a metazoan epithelial structure built from claudin/occludin strands.
      The apicomplexan structure RH5 tracks is the moving junction between merozoite and erythrocyte,
      a transient parasite-host ring that shares only the informal name 'tight junction' used in the invasion
      literature; the same complex is described as forming the 'moving junction' in PMID:28186186. This
      is an animal-specific term imported on a word match, and it asserts an epithelial sealing structure
      that does not exist in this system. The underlying observation is nevertheless a genuine IDA
      localisation of RH5 to that parasite-host structure, so rather than discarding it the row is re-termed
      to the proposed 'moving junction' term (see proposed_new_terms; the same term is proposed in the
      PLAF7 AMA1 review). Until that term exists, RH5's location at the interface remains partially
      captured by GO:0020002 host cell plasma membrane and GO:0043655 host extracellular region.
    supported_by:
    - reference_id: PMID:19000690
      supporting_text: PfRh5 localises to the rhoptries in merozoites and follows the tight junction during
        the process of erythrocyte invasion.
    - reference_id: PMID:28186186
      supporting_text: Live imaging in the presence of fluorescent calcium-sensitive dyes and RH5-basigin
        interaction antagonists revealed that merozoites could still adhere and deform erythrocytes leading
        to the conclusion that the RH5-basigin interaction was necessary for, and directly preceded, rhoptry
        release just before the formation of the moving junction4.
