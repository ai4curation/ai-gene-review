  - reference_id: PMID:24297912
    supporting_text: We next investigated the contribution of the recently discovered Reticulocyte-binding
      protein Homolog 5 (RH5)-Basigin (BSG) interaction in host-species selectivity and found that P.
      falciparum RH5 bound chimpanzee BSG with a significantly lower affinity than human BSG and did not
      bind gorilla BSG, mirroring the known host tropism of P. falciparum.
- description: Agonist action on the host receptor. Binding of RH5 to basigin is itself sufficient to
