core_functions:
- description: Host erythrocyte receptor adhesin. Secreted RH5, displayed on the merozoite surface via
    P113 and assembled with CyRPA and PfRipr, binds basigin on the erythrocyte through its C-terminal
    kite-shaped domain. This interaction is the irreversible-attachment step of blood-stage invasion and
    is required in all strains examined; its species specificity sets the parasite's host range.
  molecular_function:
    id: GO:0046789
    label: host cell surface receptor binding
  directly_involved_in:
