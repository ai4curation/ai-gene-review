proposed_new_terms:
- proposed_name: moving junction
  proposed_definition: >-
    The ring-shaped, electron-dense zone of contact formed between the plasma membrane
    of an invading apicomplexan zoite and the host cell membrane, containing the
    parasite surface protein AMA1 and the rhoptry neck protein complex, and through
    which the parasite moves into a nascent parasitophorous vacuole. Also called the
    tight junction.
  justification: >-
    GO has microneme, rhoptry and apical complex for apicomplexan structures, but no term
    for the moving (tight) junction, the parasite-host structure to which RH5 is
    experimentally localised during erythrocyte invasion. The only existing term carrying
    the name, GO:0005923 bicellular tight junction, is a metazoan epithelial sealing
    structure and applies here only by word match. The same term is proposed in the PLAF7
    AMA1 review, where AMA1 is a defining component of the junction.
  proposed_parent:
    id: GO:0030054
    label: cell junction
  supported_by:
  - reference_id: PMID:19000690
    supporting_text: PfRh5 localises to the rhoptries in merozoites and follows the tight junction during
      the process of erythrocyte invasion.
  - reference_id: PMID:28186186
    supporting_text: An electron-dense nexus between the host and parasite membranes is formed which opens out
      into a ring-like moving junction which envelops the merozoite, finally resealing behind it,
      such that the parasite is completely internalized within an intraerythrocytic
      parasitophorous vacuole5.
  - reference_id: PMID:28186186
    supporting_text: RH5 is detected within the rhoptries of merozoites, relocating to the moving junction during
      invasion8.
- proposed_name: RH5-CyRPA-Ripr invasion complex
  proposed_definition: A protein-containing complex, found at the apical surface of an apicomplexan merozoite
    during invasion of a host erythrocyte, consisting of the reticulocyte-binding protein homolog RH5,
    the cysteine-rich protective antigen CyRPA and the RH5-interacting protein Ripr. The complex binds
    the host erythrocyte receptor basigin and inserts into the host membrane, and is required for irreversible
    attachment and entry.
  justification: GOA records RH5's membership of this complex only as the root term GO:0032991 protein-containing
    complex, which conveys nothing. The complex has defined, reproducible composition and a cryo-EM structure,
    is shared by at least three annotated gene products (RH5, CyRPA, PfRipr) that each need a complex
    term, and is the object of a major vaccine effort, so a dedicated cellular component term is warranted.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  supported_by:
  - reference_id: PMID:25583518
    supporting_text: Here we have identified a conserved GPI-linked parasite protein, Cysteine-rich protective
      antigen (CyRPA) as an interacting partner of PfRH5-PfRipr that tethers the PfRH5/PfRipr/CyRPA multiprotein
      complex on the merozoite surface.
  - reference_id: PMID:30542156
    supporting_text: Our structure identifies blades 4-6 of the β-propeller of CyRPA as contact sites
      for Rh5 and Ripr.
  - reference_id: PMID:27374406
    supporting_text: Super-resolution microscopy revealed that PfRipr, CyRPA, and PfRh5 colocalize at
      the junction between merozoites and erythrocytes during invasion.
suggested_questions:
- question: Does RH5 contribute structurally to pore or junction formation after membrane insertion, or
    is its role complete once basigin is engaged and the calcium signal delivered? The cryo-EM work shows
    RH5 and Ripr inserting into the host membrane, but what they form there is unknown.
- question: Which host kinase or channel transduces the RH5-basigin contact into the erythrocyte calcium
    flux, and is basigin dimerisation the proximal event? Answering this would show whether a symbiont-mediated
    perturbation of host cytoskeleton term (GO:0052039) should also be annotated to RH5 or belongs to
    a host protein.
- question: What is the function, if any, of the N-terminal region released by cleavage at 140/141 after
    P113 release - is it inert, or does it act on the erythrocyte independently?
- question: Is the high-affinity heparin binding of RH5 a property of the basigin-binding surface, and
    does any sulfated glycan on the erythrocyte or in plasma engage it physiologically?
suggested_experiments:
- description: Reconstitute recombinant RH5, CyRPA and PfRipr with basigin-bearing liposomes or erythrocyte
    ghosts and test by electrophysiology and dye release whether the inserted complex forms a conductive
    pore, separating membrane insertion from junction formation.
- description: Use conditional knockdown of RH5 combined with live calcium imaging and phosphoproteomics
    of the erythrocyte to identify the host signalling chain between basigin engagement and cytoskeletal
    remodelling, and test candidate kinases with specific inhibitors on invasion kinetics.
- description: Express RH5 carrying a non-cleavable 140/141 site and a P113-binding-deficient N terminus
    in parasites to determine whether the release of RH5 from P113, and the fate of the cleaved N-terminal
    fragment, are separately required for invasion.
- description: Measure RH5 binding to basigin orthologues from a panel of great apes and to engineered
    basigin point mutants by surface plasmon resonance alongside invasion assays in the matching erythrocytes,
    to test quantitatively how receptor affinity maps onto host range.
