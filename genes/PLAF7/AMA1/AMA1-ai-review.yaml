  review:
    summary: >-
      Co-immunoprecipitation of PfAMA1 with PfRON4 (PF3D7_1116000), a rhoptry neck
      protein of the moving-junction RON complex.
    action: MODIFY
    reason: >-
      The co-immunoprecipitation is sound and shows that AMA1 associates with the RON
      complex, but the link to RON4 is most likely indirect, via RON2, which is the
      RON-complex component shown to contact AMA1 directly (PMID:22737069). Bare
      protein binding conveys no functional information. The RON complex is secreted
      from the rhoptry necks and inserted into the erythrocyte membrane before AMA1
      engages it, so the informative molecular function for this interaction is host
      cell surface binding, which this gene already carries by IDA.
    proposed_replacement_terms:
    - id: GO:0046812
      label: host cell surface binding
    supported_by:
    - reference_id: PMID:16835460
      supporting_text: Plasmodium falciparum apical membrane antigen 1 (PfAMA1) coimmunoprecipitates with the
        Plasmodium homologue of TgRON4, a secreted rhoptry neck protein of Toxoplasma gondii that
        migrates at the moving junction in association with TgAMA1 during invasion.
    - reference_id: PMID:22737069
      supporting_text: In particular, RON2, a transmembrane component of the RON complex,
        interacts directly with AMA1.
