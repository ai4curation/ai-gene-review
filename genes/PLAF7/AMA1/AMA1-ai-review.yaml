id: Q7KQK5
gene_symbol: Q7KQK5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: >-
  Apical membrane antigen 1 (AMA1, PF3D7_1133400) is a single-pass type I membrane
  protein of the apicomplexan AMA1 family, expressed in late schizonts and merozoites
  of the asexual blood stage of Plasmodium falciparum. It is made as an 83-kDa
  precursor that is trafficked to the micronemes, where its N-terminal prodomain is
  removed, and the mature protein is then translocated onto the merozoite surface
  around the time of schizont rupture. During erythrocyte invasion AMA1 forms the core
  of the tight (moving) junction: a hydrophobic groove in its ectodomain, uncovered by
  displacement of the flexible domain II loop, binds a disulfide-bonded loop of RON2,
  a rhoptry neck protein that the parasite delivers into the erythrocyte membrane
  together with RON4 and RON5. This pairing marks the merozoite's commitment to
  invasion and anchors the junction through which the actomyosin motor draws the
  parasite into a nascent parasitophorous vacuole; conditional depletion of PfAMA1
  lowers invasion efficiency and impairs resealing of the erythrocyte membrane behind
  the parasite. Gene deletions in Plasmodium berghei and Toxoplasma gondii indicate
  that AMA1 also contributes to attachment of zoites to host cells. The ectodomain is
  highly polymorphic and is a leading blood-stage malaria vaccine antigen.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16835460
  qualifier: enables
  supporting_entities:
  - GeneDB:PF3D7_1116000
  review:
    summary: >-
      Co-immunoprecipitation of PfAMA1 with PfRON4 (PF3D7_1116000), a rhoptry neck
      protein of the moving-junction RON complex.
    action: KEEP_AS_NON_CORE
    reason: >-
      The co-immunoprecipitation is sound and shows that AMA1 associates with the RON
      complex, but the link to RON4 is most likely indirect, via RON2, which is the
      RON-complex component shown to contact AMA1 directly (PMID:22737069). Bare
      protein binding conveys no functional information; the informative activity,
      engagement of a ligand presented at the erythrocyte surface, is captured by the
      host cell surface binding annotation. Retained as non-core rather than removed,
      since the experimental interaction itself is well supported.
    supported_by:
    - reference_id: PMID:16835460
      supporting_text: Plasmodium falciparum apical membrane antigen 1 (PfAMA1) coimmunoprecipitates
        with the Plasmodium homologue of TgRON4
    - reference_id: PMID:22737069
      supporting_text: In particular, RON2, a transmembrane component of the RON complex,
        interacts directly with AMA1.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:22737069
  qualifier: enables
  supporting_entities:
  - GeneDB:PF3D7_1452000
  review:
    summary: >-
      Structurally characterized direct binding of the PfAMA1 ectodomain to a peptide
      from the extracellular region of PfRON2 (PF3D7_1452000), with alanine
      substitution of key contact residues abolishing binding.
    action: KEEP_AS_NON_CORE
    reason: >-
      The AMA1-RON2 pairing is the defining molecular interaction of this protein and
      rests on crystal structures plus mutagenesis. The term protein binding itself is
      uninformative, and GO offers no specific term for this receptor-ligand pair
      (RON2 is a parasite protein delivered into the host membrane, so host cell
      surface receptor binding would be wrong). The functional content is represented
      in core_functions under host cell surface binding; this row is kept as non-core
      supporting evidence.
    supported_by:
    - reference_id: PMID:22737069
      supporting_text: The receptor-binding site of PfAMA1 comprises the hydrophobic
        groove and a region that becomes exposed by displacement of the flexible Domain
        II loop.
    - reference_id: PMID:22737069
      supporting_text: Mutations of key contact residues of PfRON2 and PfAMA1 abrogate
        binding between the recombinant proteins.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR003298
  - UniProtKB-SubCell:SL-0162
  review:
    summary: >-
      Electronic assignment from the AMA1 family InterPro signature plus the UniProt
      single-pass membrane subcellular location.
    action: MODIFY
    reason: >-
      AMA1 is a type I transmembrane protein, so membrane is true but less specific
      than the evidence supports. After prodomain removal in the micronemes the mature
      protein is translocated onto the merozoite surface, i.e. the parasite plasma
      membrane, where it engages RON2 during invasion. Replace with the is_a
      descendant plasma membrane.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: PMID:12228305
      supporting_text: Apical membrane antigen 1 of Plasmodium falciparum (PfAMA1) contains
        an N-terminal propeptide that is removed prior to the translocation of the mature
        protein onto the merozoite surface.
    - reference_id: PMID:2701947
      supporting_text: Apical membrane antigen 1 appears to be transported to the merozoite
        surface near the time of schizont rupture.
- term:
    id: GO:0020007
    label: apical complex
  evidence_type: TAS
  original_reference_id: PMID:2701947
  qualifier: located_in
  review:
    summary: >-
      The 1989 paper that cloned the antigen and named it for its apparent location at
      the apical end of the merozoite.
    action: MODIFY
    reason: >-
      Apical complex is correct but less specific than later evidence supports.
      Immuno-electron microscopy localized the unprocessed protein to the micronemes,
      which are part_of the apical complex, and that specific term is already carried
      by this gene with IDA evidence. Replace with microneme.
    proposed_replacement_terms:
    - id: GO:0020009
      label: microneme
    supported_by:
    - reference_id: PMID:2701947
      supporting_text: This antigen is designated apical membrane antigen 1 because it
        appears to be located in the apical complex.
    - reference_id: PMID:12228305
      supporting_text: We localized unprocessed PfAMA1 to the microneme organelles of
        the intraerythrocytic schizont.
- term:
    id: GO:0020009
    label: microneme
  evidence_type: IDA
  original_reference_id: PMID:12228305
  qualifier: located_in
  review:
    summary: >-
      Immunofluorescence and immuno-electron microscopy with a prodomain-specific
      monoclonal antibody place the unprocessed precursor in the micronemes of
      intraerythrocytic schizonts.
    action: ACCEPT
    reason: >-
      Direct, organelle-level localization in the correct organism and stage. The
      microneme is a genuine apicomplexan compartment and is the site where the
      precursor is stored and N-terminally processed before release to the merozoite
      surface, so this is a core location for the protein.
    supported_by:
    - reference_id: PMID:12228305
      supporting_text: In the present study, we used a MAb targeted to the N-terminal
        pro-region of PfAMA1 to demonstrate conclusively by immunofluorescence microscopy
        and immuno-EM that unprocessed AMA1 is located in the micronemes.
    - reference_id: PMID:12228305
      supporting_text: AMA1 is synthesized as an 83-kDa precursor protein that traffics
        to and is N-terminally processed within the micronemes.
- term:
    id: GO:0044409
    label: symbiont entry into host
  evidence_type: IMP
  original_reference_id: PMID:24571085
  qualifier: involved_in
  review:
    summary: >-
      Conditional (DiCre) excision of Pfama1 in P. falciparum reduces protein levels by
      about 80% within one cycle, cutting growth by 40% through lower invasion
      efficiency and a post-invasion defect in sealing the parasitophorous vacuole.
    action: ACCEPT
    reason: >-
      Loss-of-function evidence in the correct organism and stage, and AMA1 performs
      part of the work of entry rather than merely being required for it: its
      ectodomain is the parasite-side anchor of the tight junction through which the
      merozoite draws itself into the erythrocyte. GO:0044409 is the parasite-side
      term (the symbiont enters the host), which is the right orientation here. The
      more specific child GO:0046718 symbiont entry into host cell is framed around
      breaching the membrane and releasing the symbiont or its genome into the
      cytoplasm, which does not describe vacuole-mediated apicomplexan invasion, so the
      parent term is kept.
    supported_by:
    - reference_id: PMID:24571085
      supporting_text: These results show that PfAMA1 is an essential protein for merozoite
        invasion in P. falciparum and either directly or indirectly plays a role in resealing
        of the red blood cell at the posterior end of the invasion event.
    - reference_id: PMID:21788485
      supporting_text: Collectively, these results identify the binding of RON2 to the
        hydrophobic pocket of AMA1 as the step that commits Plasmodium merozoites to RBC
        invasion and point to RON2 as a potential vaccine candidate.
- term:
    id: GO:0046812
    label: host cell surface binding
  evidence_type: IDA
  original_reference_id: PMID:24108241
  qualifier: enables
  review:
    summary: >-
      Zoites lacking AMA1 are impaired in association with host cells, supporting an
      adhesive activity of AMA1 directed at the host cell surface; structurally, AMA1
      engages RON2 after the parasite has delivered it into the erythrocyte membrane.
    action: ACCEPT
    reason: >-
      The activity is well supported: AMA1 binds a ligand displayed in the host cell
      membrane, which is exactly what GO:0046812 describes, and the structural work on
      the AMA1-RON2 complex establishes the binding chemistry in P. falciparum itself.
      The cited paper's attachment assays were performed with P. berghei merozoites and
      T. gondii tachyzoites rather than P. falciparum, so the P. falciparum IDA rests
      partly on the shared mechanism; the curator read the full text and the claim is
      consistent with the P. falciparum structural and conditional-knockdown data, so
      it is accepted. Note that GO:0046789 host cell surface receptor binding would be
      wrong, because the bound partner RON2 is a parasite protein inserted into the
      host membrane, not a host receptor.
    supported_by:
    - reference_id: PMID:24108241
      supporting_text: 'Therefore, as with the Toxoplasma tachyzoite, AMA1 favours Plasmodium
        merozoite attachment to, but not internalization into, the host cell.'
    - reference_id: PMID:22737069
      supporting_text: 'The MJ contains two key parasite components: the surface protein
        Apical Membrane Antigen 1 (AMA1) and its receptor, the Rhoptry Neck Protein (RON)
        complex, which is targeted to the host cell membrane during invasion.'
