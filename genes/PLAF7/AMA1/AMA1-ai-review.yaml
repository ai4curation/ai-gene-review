        to and is N-terminally processed within the micronemes.
- term:
    id: GO:0044409
    label: symbiont entry into host
  evidence_type: IMP
  original_reference_id: PMID:24571085
  qualifier: involved_in
  review:
    summary: >-
      Conditional (DiCre) excision of Pfama1 in P. falciparum reduces protein levels by
      about 80% within one cycle, cutting growth by 40% through lower invasion
      efficiency and a post-invasion defect in sealing the parasitophorous vacuole.
    action: MODIFY
    reason: >-
      Loss-of-function evidence in the correct organism and stage, and AMA1 performs
      part of the work of entry rather than merely being required for it: its
      ectodomain is the parasite-side anchor of the tight junction through which the
      merozoite draws itself into the erythrocyte. GO:0044409 is the right orientation
      (the symbiont enters the host) but covers entry into the body, tissues or cells
      alike, so it is less specific than the evidence supports. The child GO:0046718
      symbiont entry into host cell is framed around breaching the membrane and
      releasing the symbiont or its genome into the cytoplasm, which does not describe
      apicomplexan invasion either. The correct descendant is GO:0085017 entry into
      host cell by a symbiont-containing vacuole, whose definition is invasion that
      forms a vacuole in which the symbiont resides, beginning with attachment to a
      host membrane that invaginates as the symbiont enters and ending when the host
      membrane closes behind the new vacuole. That is exactly the moving-junction
      invasion AMA1 anchors, and the cited evidence turns on the parasitophorous
      vacuole itself (a post-invasion defect in sealing it). GOA already uses
      GO:0085017 for P. falciparum merozoite and sporozoite invasion proteins (MSP1
      by IDA, CSP by IMP), so this also aligns AMA1 with the term used across the
      parasite's invasion machinery.
    proposed_replacement_terms:
    - id: GO:0085017
      label: entry into host cell by a symbiont-containing vacuole
    supported_by:
    - reference_id: PMID:24571085
      supporting_text: These results show that PfAMA1 is an essential protein for merozoite
        invasion in P. falciparum and either directly or indirectly plays a role in resealing
        of the red blood cell at the posterior end of the invasion event.
    - reference_id: PMID:21788485
      supporting_text: Collectively, these results identify the binding of RON2 to the
        hydrophobic pocket of AMA1 as the step that commits Plasmodium merozoites to RBC
        invasion and point to RON2 as a potential vaccine candidate.
- term:
    id: GO:0046812
    label: host cell surface binding
  evidence_type: IDA
  original_reference_id: PMID:24108241
  qualifier: enables
  review:
    summary: >-
      Zoites lacking AMA1 are impaired in association with host cells, supporting an
      adhesive activity of AMA1 directed at the host cell surface; structurally, AMA1
      engages RON2 after the parasite has delivered it into the erythrocyte membrane.
    action: ACCEPT
    reason: >-
      The activity is well supported: AMA1 binds a ligand displayed in the host cell
      membrane, which is exactly what GO:0046812 describes, and the structural work on
      the AMA1-RON2 complex establishes the binding chemistry in P. falciparum itself.
      The cited paper's attachment assays were performed with P. berghei merozoites and
      T. gondii tachyzoites rather than P. falciparum, so the P. falciparum IDA rests
      partly on the shared mechanism; the curator read the full text and the claim is
      consistent with the P. falciparum structural and conditional-knockdown data, so
      it is accepted. Note that GO:0046789 host cell surface receptor binding would be
      wrong, because the bound partner RON2 is a parasite protein inserted into the
      host membrane, not a host receptor.
    supported_by:
    - reference_id: PMID:24108241
      supporting_text: 'Therefore, as with the Toxoplasma tachyzoite, AMA1 favours Plasmodium
        merozoite attachment to, but not internalization into, the host cell.'
    - reference_id: PMID:22737069
      supporting_text: 'The MJ contains two key parasite components: the surface protein
        Apical Membrane Antigen 1 (AMA1) and its receptor, the Rhoptry Neck Protein (RON)
        complex, which is targeted to the host cell membrane during invasion.'
core_functions:
- description: >-
    Tight-junction ligand binding at the erythrocyte surface: the AMA1 ectodomain
    presents a hydrophobic groove, extended when the domain II loop is displaced, that
    captures the disulfide-bonded loop of RON2 after the parasite has delivered the
    RON complex into the erythrocyte membrane. This pairing nucleates the tight
    junction and marks the merozoite's commitment to invasion.
  supported_by:
  - reference_id: PMID:22737069
    supporting_text: The receptor-binding site of PfAMA1 comprises the hydrophobic groove
      and a region that becomes exposed by displacement of the flexible Domain II loop.
  - reference_id: PMID:21788485
    supporting_text: Here we show that the interaction of two parasite proteins, RON2
      and AMA1, known to be critical for invasion, is essential to trigger junction formation.
  molecular_function:
    id: GO:0046812
    label: host cell surface binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0020009
    label: microneme
- description: >-
    Merozoite entry into the erythrocyte: by anchoring the tight junction, AMA1
    provides the attachment point through which the parasite actomyosin motor pulls
    the merozoite into a nascent parasitophorous vacuole, and contributes to sealing
    the erythrocyte membrane behind the parasite. Depleting PfAMA1 lowers invasion
    efficiency and leaves merozoites that fail to reseal the host membrane.
  supported_by:
  - reference_id: PMID:24571085
    supporting_text: This reduces growth by 40%, due to decreased invasion efficiency
      characterized by a post-invasion defect in sealing of the parasitophorous vacuole.
  - reference_id: PMID:24571085
    supporting_text: Further reduction in PfAMA1 leads to no tight junction formation
      and therefore no penetration.
  molecular_function:
    id: GO:0046812
    label: host cell surface binding
  locations:
  - id: GO:0005886
    label: plasma membrane
references:
