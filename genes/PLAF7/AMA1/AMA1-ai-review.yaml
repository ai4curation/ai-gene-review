  findings: []
- id: PMID:12228305
  title: Independent translocation of two micronemal proteins in developing Plasmodium
    falciparum merozoites.
  findings:
  - statement: >-
      Immuno-electron microscopy with a prodomain-specific monoclonal antibody places
      unprocessed PfAMA1 in the micronemes of intraerythrocytic schizonts, and the
      mature protein reaches the merozoite surface after prodomain removal.
    supporting_text: We localized unprocessed PfAMA1 to the microneme organelles of the
