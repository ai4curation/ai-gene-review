    review_notes: Primary P. falciparum localization study; cached full text supports
      both the microneme and the merozoite-surface statements.
- id: PMID:16835460
  title: Plasmodium falciparum AMA1 binds a rhoptry neck protein homologous to TgRON4,
    a component of the moving junction in Toxoplasma gondii.
  findings:
  - statement: >-
      PfAMA1 co-immunoprecipitates with PfRON4, indicating association of AMA1 with the
      rhoptry neck protein complex in P. falciparum.
    supporting_text: Plasmodium falciparum apical membrane antigen 1 (PfAMA1) coimmunoprecipitates with the
      Plasmodium homologue of TgRON4, a secreted rhoptry neck protein of Toxoplasma gondii that
      migrates at the moving junction in association with TgAMA1 during invasion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache; the abstract itself states the
      co-immunoprecipitation that underlies the IPI annotation.
- id: PMID:21788485
  title: Binding of Plasmodium merozoite proteins RON2 and AMA1 triggers commitment to
    invasion.
  findings:
  - statement: >-
      Occupancy of the AMA1 hydrophobic pocket by RON2 is the step at which the
      merozoite commits to erythrocyte invasion; antibodies to the pocket block
      junction formation.
    supporting_text: Abs specific for the AMA1 pocket blocked junction formation and
      the induction of the parasitophorous vacuole.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Fetched for this review (not cited in GOA); PubMed record and cached
      full text confirm the P. falciparum junction-formation experiments.
- id: PMID:22737069
  title: Structural and functional insights into the malaria parasite moving junction
    complex.
  findings:
  - statement: >-
      Crystal structure of PfAMA1 with a PfRON2 peptide defines the binding site as the
      hydrophobic groove plus the region exposed by displacement of the domain II loop;
      point mutations at the interface abolish binding.
    supporting_text: Mutations of key contact residues of PfRON2 and PfAMA1 abrogate
      binding between the recombinant proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural and mutagenesis evidence in P. falciparum; underpins the
      RON2 IPI annotation and the core molecular function.
- id: PMID:24108241
  title: Apical membrane antigen 1 mediates apicomplexan parasite attachment but is
    dispensable for host cell invasion.
  findings:
  - statement: >-
      Zoites lacking AMA1 attach poorly to host cells but penetrate normally once a
      junction has formed, arguing that AMA1 acts as an adhesin rather than an
      obligatory invasin.
    supporting_text: 'Therefore, apical membrane antigen 1, rather than an essential
      invasin, is a dispensable adhesin of apicomplexan zoites.'
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Correctly cited, but its conclusion is contested. The experiments use
      P. berghei and T. gondii mutants rather than P. falciparum, and conditional
      knockdown in P. falciparum (PMID:24571085) finds AMA1 required for efficient
      invasion; residual protein or compensation in the knockout lines is a candidate
      explanation for the discrepancy.
- id: PMID:24571085
  title: Conditional expression of apical membrane antigen 1 in Plasmodium falciparum
    shows it is required for erythrocyte invasion by merozoites.
  findings:
  - statement: >-
      DiCre-mediated excision of Pfama1 reduces the protein by about 80% in one cycle,
      lowering growth by 40% through reduced invasion efficiency and a defect in
      sealing the parasitophorous vacuole.
    supporting_text: This reduces growth by 40%, due to decreased invasion efficiency
      characterized by a post-invasion defect in sealing of the parasitophorous vacuole.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The key P. falciparum loss-of-function study; supports the IMP
      annotation for parasite entry into the host cell.
- id: PMID:2701947
  title: Integral membrane protein located in the apical complex of Plasmodium falciparum.
  findings:
  - statement: >-
      Original cloning of the antigen, named for its apparent apical location, with
      transport to the merozoite surface near schizont rupture.
    supporting_text: Apical membrane antigen 1 appears to be transported to the merozoite
      surface near the time of schizont rupture.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Historically important but superseded for
      localization by the later immuno-EM work.
proposed_new_terms:
- proposed_name: moving junction
  proposed_definition: >-
    The ring-shaped, electron-dense zone of contact formed between the plasma membrane
    of an invading apicomplexan zoite and the host cell membrane, containing the
    parasite surface protein AMA1 and the rhoptry neck protein complex, and through
    which the parasite moves into a nascent parasitophorous vacuole. Also called the
    tight junction.
  justification: >-
    GO has microneme, rhoptry and apical complex for apicomplexan structures, but a
    search of the cellular component branch returns no term for the moving (tight)
    junction, which is the structure where AMA1 actually performs its function and is
    referred to as a distinct entity throughout the apicomplexan invasion literature.
    An existing-annotation term cannot be used for it; plasma membrane is the closest
    available location.
  proposed_parent:
    id: GO:0030054
    label: cell junction
  supported_by:
  - reference_id: PMID:22737069
    supporting_text: The formation of a moving junction (MJ) between the membranes of
      the invading apicomplexan parasite and the host cell is common to these intracellular
      pathogens.
suggested_questions:
- question: >-
    Does P. falciparum AMA1 contribute measurably to merozoite attachment to
    erythrocytes, as its P. berghei and T. gondii counterparts do, and would a GO
    annotation to adhesion of symbiont to host cell (GO:0044650) be warranted for the
    P. falciparum protein?
  experts: []
- question: >-
    Why do the P. berghei and T. gondii knockouts tolerate loss of AMA1 for
    penetration while P. falciparum conditional knockdown impairs invasion? Is there a
    compensating ligand in the knockout lines, or a species difference in how the
    junction is anchored?
  experts: []
- question: >-
    Is the resealing defect seen on PfAMA1 depletion a direct role for AMA1 at the
    posterior end of the invading merozoite, or an indirect consequence of a
    structurally weaker junction?
  experts: []
- question: >-
    Should GO add a cellular component term for the apicomplexan moving (tight)
    junction, so that AMA1 and the RON proteins can be located in the structure where
    they act rather than only in plasma membrane?
  experts: []
suggested_experiments:
- description: >-
    Quantitative attachment assays (flow cytometry and live imaging of merozoite
    to erythrocyte contacts) using the P. falciparum DiCre conditional Pfama1 line, with
    and without the RON2 peptide, to test directly in P. falciparum the adhesion role
    established in the rodent and Toxoplasma knockouts.
  hypothesis: >-
    PfAMA1-depleted merozoites show reduced initial attachment to erythrocytes
    independently of their defect in junction formation.
- description: >-
    Complementation of the P. falciparum conditional knockdown with AMA1 variants
    carrying hydrophobic-groove mutations that abolish RON2 binding but retain surface
    trafficking, scoring junction formation, penetration and erythrocyte resealing
    separately by live imaging and electron microscopy.
  hypothesis: >-
    Junction anchoring and the resealing step are separable activities of AMA1, with
    only the former requiring an intact RON2-binding groove.
- description: >-
    Correlative light and electron microscopy, or expansion microscopy, of invading
    merozoites expressing tagged AMA1 and RON2, to map the spatial distribution of
    AMA1 through junction assembly, translocation and closure and provide the
    structural basis for a moving junction cellular component term.
  hypothesis: >-
    AMA1 is concentrated in the junction ring and is progressively excluded or shed as
    the junction translocates to the posterior pole.
