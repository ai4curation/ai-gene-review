gene_symbol: AMA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: >-
  Apical membrane antigen 1 (AMA1, PF3D7_1133400) is a single-pass type I membrane
  protein of the apicomplexan AMA1 family, expressed in late schizonts and merozoites
  of the asexual blood stage of Plasmodium falciparum. It is made as an 83-kDa
  precursor that is trafficked to the micronemes, where its N-terminal prodomain is
  removed, and the mature protein is then translocated onto the merozoite surface
  around the time of schizont rupture. During erythrocyte invasion AMA1 forms the core
  of the tight (moving) junction: a hydrophobic groove in its ectodomain, uncovered by
  displacement of the flexible domain II loop, binds a disulfide-bonded loop of RON2,
  a rhoptry neck protein that the parasite delivers into the erythrocyte membrane
  together with RON4 and RON5. This pairing marks the merozoite's commitment to
  invasion and anchors the junction through which the actomyosin motor draws the
  parasite into a nascent parasitophorous vacuole; conditional depletion of PfAMA1
  lowers invasion efficiency and impairs resealing of the erythrocyte membrane behind
  the parasite. Gene deletions in Plasmodium berghei and Toxoplasma gondii indicate
  that AMA1 also contributes to attachment of zoites to host cells. The ectodomain is
  highly polymorphic and is a leading blood-stage malaria vaccine antigen.
