    action: ACCEPT
    reason: >-
      Direct, organelle-level localization in the correct organism and stage. The
      microneme is a genuine apicomplexan compartment and is the site where the
      precursor is stored and N-terminally processed before release to the merozoite
      surface, so this is a core location for the protein.
