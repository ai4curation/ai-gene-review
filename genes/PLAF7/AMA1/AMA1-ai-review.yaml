    summary: >-
      Structurally characterized direct binding of the PfAMA1 ectodomain to a peptide
      from the extracellular region of PfRON2 (PF3D7_1452000), with alanine
      substitution of key contact residues abolishing binding.
    action: MODIFY
    reason: >-
      The AMA1-RON2 pairing is the defining molecular interaction of this protein and
      rests on crystal structures plus mutagenesis, but the term protein binding
      conveys none of that. Because RON2 is inserted into the erythrocyte membrane
      before AMA1 binds it, the activity is binding to a ligand displayed at the host
      cell surface, captured by GO:0046812, which this gene already carries by IDA.
      GO:0046789 host cell surface receptor binding would be wrong, since RON2 is a
      parasite protein rather than a host receptor.
    proposed_replacement_terms:
