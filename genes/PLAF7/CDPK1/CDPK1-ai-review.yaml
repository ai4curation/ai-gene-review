- term:
    id: GO:0006468
    label: protein phosphorylation
  evidence_type: IDA
  original_reference_id: PMID:17123645
  qualifier: involved_in
  review:
    summary: CDPK1 phosphorylates many parasite proteins (MTIP, GAP45, IMC proteins, PKAr, SERA5, RhopH3, RKIP) in vitro and, by phosphoproteomics after knockdown, in the parasite.
    action: ACCEPT
    reason: Direct biochemical evidence of protein phosphorylation by CDPK1; the appropriate process term for a protein kinase.
    supported_by:
    - reference_id: PMID:18768477
      supporting_text: we demonstrate that both proteins can be efficiently phosphorylated by CDPK1 in vitro.
    - reference_id: PMID:22479457
      supporting_text: We show that GAP45 is phosphorylated by calcium dependent protein kinase 1 (CDPK1), and identify the modified serine residues.
    - reference_id: PMID:28680058
      supporting_text: We identify substrates of PfCDPK1, which includes proteins of Inner Membrane Complex and glideosome-actomyosin motor assembly.
