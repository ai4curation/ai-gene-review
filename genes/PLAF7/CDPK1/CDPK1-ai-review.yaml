  review:
    summary: IBA from a PANTHER node spanning CaMKs and CDPKs. CDPK1 is Ca2+-regulated but does not need calmodulin; Ca2+ alone activates it through its fused calmodulin-like domain.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0009931
      label: calcium-dependent protein serine/threonine kinase activity
    reason: The core of the claim (a Ca2+-regulated Ser/Thr kinase) is right, but 'calcium/calmodulin-dependent' implies dependence on separate calmodulin, which is not how CDPKs work. CDPK1 binds 45Ca2+ and Ca2+ alone activates it (PMID:8142371). Replace with GO:0009931, which the gene already carries by IDA.
    supported_by:
    - reference_id: PMID:8142371
      supporting_text: The kinase can be activated by Ca2+ alone and associates with 45Ca2+.
    - reference_id: PMID:23204525
      supporting_text: we provide direct evidence for the binding of the CamLD with the P3 region (Leu(356) to Thr(370)) of the JD in the presence of calcium (Ca(2+))
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000681419
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node spans CaMKs and CDPKs; the Ca2+/calmodulin-dependent wording fits the CaMK donors but not CDPKs, which carry their own calmodulin-like domain. Refined to GO:0009931.
