id: P62344
gene_symbol: CDPK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: |-
  Calcium-dependent protein kinase 1 (CDPK1) of Plasmodium falciparum is a serine/threonine protein kinase of the plant/alveolate CDPK family. It fuses an N-terminal kinase domain to a junction (autoinhibitory) domain and a C-terminal calmodulin-like domain carrying four EF-hand Ca2+-binding sites, so the enzyme is a self-contained calcium sensor-effector that is activated by Ca2+ alone, without exogenous calmodulin: Ca2+ binding releases the junction domain from the catalytic cleft and permits autophosphorylation and substrate phosphorylation. An N-terminal myristoylation/palmitoylation signal plus a basic cluster anchor CDPK1 peripherally to membranes, chiefly the parasite plasma membrane and inner membrane complex of schizonts and merozoites, with additional pools at the parasitophorous vacuole membrane and tubovesicular network. CDPK1 is highly expressed in asexual blood stages and is required for erythrocyte invasion: downstream of cGMP/PKG and a rise in cytosolic Ca2+, it phosphorylates components of the glideosome motor complex (MTIP, GAP45) and inner membrane complex, the PKA regulatory subunit, the rhoptry protein RhopH3 and the protease SERA5, driving microneme discharge during invasion and egress. Phosphorylated CDPK1 is bound by 14-3-3I, which scaffolds a CDPK1/PKA complex. CDPK1 is also essential for male and female gametogenesis and mosquito transmission, and is an actively pursued antimalarial drug target.
