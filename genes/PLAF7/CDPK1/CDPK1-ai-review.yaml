core_functions:
- description: |-
    Calcium-activated serine/threonine protein kinase. Ca2+ binding to the EF hands of the C-terminal calmodulin-like domain relieves autoinhibition by the junction domain, enabling autophosphorylation and phosphorylation of protein substrates on Ser and Thr. The enzyme is activated by Ca2+ alone, independent of exogenous calmodulin.
  supported_by:
  - reference_id: PMID:8142371
    supporting_text: The kinase can be activated by Ca2+ alone and associates with 45Ca2+.
  - reference_id: PMID:23204525
    supporting_text: we provide direct evidence for the binding of the CamLD with the P3 region (Leu(356) to Thr(370)) of the JD in the presence of calcium (Ca(2+))
  molecular_function:
    id: GO:0009931
    label: calcium-dependent protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0006468
    label: protein phosphorylation
  - id: GO:0035556
    label: intracellular signal transduction
  locations:
  - id: GO:0005886
    label: plasma membrane
- description: |-
    Effector of the Ca2+/PKG signalling relay that triggers microneme discharge during erythrocyte invasion and egress. Downstream of PKG and a rise in cytosolic Ca2+, CDPK1 phosphorylates glideosome motor components (MTIP, GAP45), inner membrane complex proteins, the PKA regulatory subunit and the rhoptry protein RhopH3, and its pharmacological or peptide inhibition blocks microneme secretion and invasion.
  supported_by:
  - reference_id: PMID:23204525
    supporting_text: Purfalcamine, a previously identified specific inhibitor of PfCDPK1, also inhibits microneme discharge and erythrocyte invasion, confirming a role for PfCDPK1 in this process.
  - reference_id: PMID:28680058
    supporting_text: We identify substrates of PfCDPK1, which includes proteins of Inner Membrane Complex and glideosome-actomyosin motor assembly.
