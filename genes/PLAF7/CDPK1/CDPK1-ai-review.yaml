    summary: CDPK1 localizes to the parasite plasma membrane of schizonts, merozoites and young rings, anchored by N-myristoylation, palmitoylation and a basic cluster; this is the most reproducible localization across laboratories.
    action: ACCEPT
    reason: Consistent IFA, GFP-tagging, HA-tagging and palmitoylation data place CDPK1 at the merozoite plasma membrane, where it phosphorylates IMC/glideosome substrates.
    supported_by:
    - reference_id: PMID:23548171
      supporting_text: CDPK1 localizes to the parasite plasma membrane of replicating and invasive forms as well
        as very young intracellular parasites and does not appear to be exported into RBCs.
    - reference_id: PMID:18768477
      supporting_text: CDPK1 localizes to the periphery of P. falciparum merozoites and is therefore suitably
        located to act on MTIP and GAP45 at the inner membrane complex.
    - reference_id: PMID:23204525
      supporting_text: In merozoites, PfCDPK1 was found primarily at the boundary of the merozoite at the
        merozoite plasma membrane ( Fig. 2 B ).
    - reference_id: PMID:32003970
      supporting_text: undergoes dynamic palmitoylation and localizes to the merozoite membrane.
