  review:
    summary: IBA nucleus from a broad CAMK-family node. PfCDPK1 is N-myristoylated and palmitoylated and is consistently found at the parasite plasma membrane, PV/PVM and the periphery of gametes; no nuclear localization has been reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: Target-specific divergence. The N-terminal acylation and basic motif target CDPK1 to membranes, and independent localization studies (IFA, GFP tagging, immuno-EM) never place it in the nucleus. The nucleus assertion likely reflects nuclear-acting mammalian CaMKs and plant CPKs at the node.
    supported_by:
    - reference_id: PMID:15491359
      supporting_text: The supposed membrane attachment function of the basic cluster was experimentally verified and shown to participate together with N-myristoylation in membrane anchoring of the kinase.
    - reference_id: PMID:23548171
      supporting_text: CDPK1 localizes to the parasite plasma membrane of replicating and invasive forms as well
        as very young intracellular parasites and does not appear to be exported into RBCs.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000681419
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Nuclear localization reflects nuclear-acting mammalian CaMKs and plant CPKs at the node; PfCDPK1 is an N-acylated membrane kinase never detected in the nucleus.
