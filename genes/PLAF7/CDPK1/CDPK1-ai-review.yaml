suggested_questions:
- question: |-
    Is the apparent host-erythrocyte-membrane pool of CDPK1 a genuine export event, given that endogenous GFP-tagged CDPK1 is not detected in the RBC, or does it reflect PV/tubovesicular membrane continuous with the host cytosol?
  experts: []
- question: |-
    Which of the many in vitro CDPK1 substrates (MTIP, GAP45, PKAr, SERA5, RhopH3, IMC proteins) are the physiologically rate-limiting targets for microneme discharge versus for gametogenesis?
  experts: []
suggested_experiments:
- description: |-
    Rapid conditional inactivation of CDPK1 (e.g. knocksideways or a chemical-genetic analogue-sensitive allele) in synchronized schizonts, combined with quantitative microneme-discharge and invasion assays, to separate CDPK1's catalytic role in invasion from indirect effects of slow depletion.
  hypothesis: |-
    Acute loss of CDPK1 catalytic activity blocks Ca2+-triggered microneme discharge and erythrocyte invasion without affecting earlier schizont development.
- description: |-
    Stage-specific phosphoproteomics of CDPK1 knockout versus wild-type gametocytes/gametes to identify the CDPK1-dependent phosphosites underlying the male and female gametogenesis defect.
  hypothesis: |-
    CDPK1 phosphorylates a distinct set of cytoskeletal/IMC substrates in gametocytes that are required for gamete egress and flagellum formation.
