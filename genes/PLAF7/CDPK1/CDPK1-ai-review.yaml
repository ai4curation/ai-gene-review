- term:
    id: GO:0016020
    label: membrane
  evidence_type: EXP
  original_reference_id: PMID:15491359
  qualifier: located_in
  review:
    summary: CDPK1 is lipid-anchored to membranes; the specific compartments determined experimentally are the parasite plasma membrane and the parasitophorous (symbiont-containing) vacuole membrane.
    action: MODIFY
    proposed_replacement_terms: &id002
    - id: GO:0005886
      label: plasma membrane
    - id: GO:0020005
      label: symbiont-containing vacuole membrane
    reason: Correct but general. The more specific supported locations are already annotated to the gene (plasma membrane; symbiont-containing vacuole membrane), so 'membrane' should be refined to those descendants.
    supported_by:
    - reference_id: PMID:23548171
      supporting_text: CDPK1 localizes to the parasite plasma membrane of replicating and invasive forms as well
        as very young intracellular parasites and does not appear to be exported into RBCs.
    - reference_id: PMID:15491359
      supporting_text: Using immunogold electron microscopy, the protein was detected in the parasitophorous vacuole and the tubovesicular system of the parasite.
