- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT2G41140
  - AGI_LocusCode:AT2G46700
  - PANTHER:PTN000681419
  - UniProtKB:Q8I534
  review:
    summary: IBA calmodulin binding, propagated from a PANTHER node whose donors include CDPK-related kinases (CRKs) that bind calmodulin. No calmodulin binding has been reported for PfCDPK1.
    action: REMOVE
    reason: CDPKs carry their own calmodulin-like domain, and Ca2+ alone activates PfCDPK1 without calmodulin (PMID:8142371). The CLD binds the kinase's own junction domain (PMID:23204525), which is an intramolecular contact, not calmodulin binding. Calmodulin binding belongs to the CaMK/CRK branches, not to the CDPK clade that contains CDPK1.
    supported_by:
    - reference_id: PMID:8142371
      supporting_text: The kinase can be activated by Ca2+ alone and associates with 45Ca2+.
    - reference_id: PMID:23204525
      supporting_text: we provide direct evidence for the binding of the CamLD with the P3 region (Leu(356) to Thr(370)) of the JD in the presence of calcium (Ca(2+))
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000681419
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Calmodulin binding is a property of the CaMK/CRK donors at this node; CDPK1 is activated by Ca2+ alone via its fused calmodulin-like domain and does not bind exogenous calmodulin.
