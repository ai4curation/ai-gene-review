- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IDA
  original_reference_id: PMID:32817103
  qualifier: part_of
  review:
    summary: CDPK1 is part of a high-molecular-weight 14-3-3I-scaffolded complex (CDPK1, PKAr, PKAc, 14-3-3I) formed in merozoites in response to low extracellular K+.
    action: ACCEPT
    reason: Gel filtration and co-immunoprecipitation demonstrate CDPK1 in a multiprotein complex; part_of protein-containing complex is appropriate.
    supported_by:
    - reference_id: PMID:32817103
