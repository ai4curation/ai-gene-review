- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IDA
  original_reference_id: PMID:25070106
  qualifier: involved_in
  review:
    summary: Derived from a high-throughput inhibitor screen and medicinal-chemistry campaign against recombinant CDPK1.
    action: REMOVE
    reason: Sensitivity of an enzyme to synthetic inhibitors in vitro is not a biological process in which the gene product participates. 'Response to xenobiotic stimulus' describes a cellular program responding to a foreign compound, which this study does not demonstrate; the authors even note biochemical inhibition did not correlate with growth inhibition.
    supported_by:
    - reference_id: PMID:25070106
      supporting_text: we were unable to correlate biochemical inhibition with parasite growth inhibition for
        this series overall.
- term:
    id: GO:0009931
    label: calcium-dependent protein serine/threonine kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT2G17290
  - AGI_LocusCode:AT3G57530
  - AGI_LocusCode:AT5G04870
  - PANTHER:PTN000681419
  - UniProtKB:A0A5K1K8H0
  - UniProtKB:P53682
  - UniProtKB:P62344
  - UniProtKB:Q0D715
  - UniProtKB:Q53P85
  - UniProtKB:Q8IBS5
  - UniProtKB:Q8ICR0
  review:
    summary: Core activity is Ca2+-activated Ser/Thr protein kinase. Ca2+ binding to the CLD EF hands releases the autoinhibitory junction domain. Substrates include MTIP, GAP45, PKAr, SERA5 and RhopH3.
    action: ACCEPT
    reason: Several independent biochemical studies show Ca2+-dependent phosphorylation of protein substrates. Removing the junction domain and CLD gives Ca2+-independent activity, which confirms the autoinhibitory mechanism.
    supported_by:
    - reference_id: PMID:8142371
      supporting_text: The kinase can be activated by Ca2+ alone and associates with 45Ca2+.
    - reference_id: PMID:23204525
      supporting_text: we provide direct evidence for the binding of the CamLD with the P3 region (Leu(356) to Thr(370)) of the JD in the presence of calcium (Ca(2+))
    - reference_id: PMID:18768477
      supporting_text: we demonstrate that both proteins can be efficiently phosphorylated by CDPK1 in vitro.
    - reference_id: PMID:29716996
      supporting_text: PfCDPK1 phosphorylated PfSERA5 in vitro in the presence of Ca2+ and enhanced its
        proteolytic activity.
    - reference_id: PMID:19307175
      supporting_text: this PfCDPK1 truncation was also active both in the presence and the absence of calcium
        (not shown here).
