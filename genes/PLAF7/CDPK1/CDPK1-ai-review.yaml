        multiprotein complex in P. falciparum merozoites.
- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:109298
  - MGI:MGI:1333110
  - MGI:MGI:894279
  - MGI:MGI:894316
  - PANTHER:PTN000681419
  - UniProtKB:P49137
  - UniProtKB:Q16644
  - UniProtKB:Q8IW41
  - UniProtKB:Q9BUB5
  - UniProtKB:Q9HBH9
  review:
    summary: CDPK1 is a Ca2+ sensor/effector acting downstream of the PKG/cGMP and Ca2+ second-messenger cascades, relaying the signal to glideosome, IMC and PKA components.
    action: ACCEPT
    reason: CDPK1 is phosphorylated by PKG and in turn phosphorylates PKAr to modulate PKA activity, placing it within an intracellular signalling relay; the IBA term is apt for a Ca2+-dependent kinase.
    supported_by:
    - reference_id: PMID:28680058
      supporting_text: PfCDPK1 phosphorylates PfPKA regulatory subunit (PfPKA-R) and regulates PfPKA activity in
        the parasite, which may be relevant for the process of invasion.
    - reference_id: PMID:26149123
      supporting_text: revealed the peripheral (membrane) localization of PfCDPK1 in the nascent merozoites
        contained within the late-stage schizonts or free merozoites, in agreement with previous
        studies3940 (Fig. 6b).
- term:
    id: GO:0046777
    label: protein autophosphorylation
  evidence_type: IDA
  original_reference_id: PMID:32484216
  qualifier: involved_in
  review:
    summary: CDPK1 autophosphorylates at several residues, including S64 and the activation-loop Thr-231, and autophosphorylation contributes to kinase activation.
    action: ACCEPT
    reason: Mass-spectrometry mapping of CDPK1 autophosphorylation sites and functional mutagenesis support this.
    supported_by:
    - reference_id: PMID:22539638
      supporting_text: Mass spectrometry revealed that PfCDPK1 was autophosphorylated at several sites; some of
        these were placed at strategic locations and therefore were found to be critical for
        kinase activation.
    - reference_id: PMID:26149123
      supporting_text: We found that purified recombinant PfCDPK1 was highly active and able to auto-phosphorylate on many residues including S64.
- term:
    id: GO:0071889
    label: 14-3-3 protein binding
  evidence_type: IPI
  original_reference_id: PMID:32484216
  qualifier: enables
  supporting_entities:
  - UniProtKB:C0H4V6
  review:
    summary: CDPK1 phosphorylated at S64 (a PKG site) binds 14-3-3I through a canonical mode I motif, in a phosphorylation-dependent manner.
    action: KEEP_AS_NON_CORE
    reason: Well-supported interaction (ELISA, SPR, modelling) that scaffolds a signalling complex. It is a regulatory property rather than the kinase's core activity, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:32484216
      supporting_text: The 14-3-3I/CDPK1 interaction was validated in vitro with ELISA and SPR, which confirmed
        that the interaction is phosphorylation dependent, with binding affinity constant of 670 ±
        3.6 nM.
    - reference_id: PMID:32484216
      supporting_text: CDPK1 polypeptide sequence (61KLGpS64) behaves as canonical Mode I-type (RXXpS/pT)
        consensus 14-3-3 binding motif, mediating the interaction.
