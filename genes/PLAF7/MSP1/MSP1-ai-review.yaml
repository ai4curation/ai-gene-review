- term:
    id: GO:0035891
    label: exit from host cell
  evidence_type: IMP
  qualifier: involved_in
  review:
    summary: >-
      NEW: merozoites lacking surface-bound MSP1 show a severe egress defect, and parasites
      expressing an inefficiently processed MSP1 mutant egress late; the processed protein
      acts by engaging the host spectrin network to facilitate rupture of the host
      erythrocyte.
    action: NEW
    reason: >-
      MSP1 performs work in this process rather than merely being required for it: the
      protein itself binds and perturbs the host cytoskeletal lattice that must give way for
      rupture, and the processing event that creates the spectrin-binding form is what
      licenses egress. Genetic perturbation (loss of surface MSP1, and a processing-site
      mutant) plus the direct binding activity together support the term. GO:0035891 is the
      symbiont-side term for a parasite leaving its host cell, which is the correct branch
      for an intraerythrocytic parasite.
    supported_by:
    - reference_id: PMID:26468747
      supporting_text: Parasites expressing an inefficiently processed MSP1 mutant show
        delayed egress, and merozoites lacking surface-bound MSP1 display a severe egress
        defect.
    - reference_id: PMID:26468747
      supporting_text: Our results indicate that interactions between SUB1-processed
        merozoite surface MSP1 and the spectrin network of the erythrocyte cytoskeleton
        facilitate host erythrocyte rupture to enable parasite egress.
core_functions:
- description: >-
    After SUB1 processing on the merozoite surface, MSP1 binds spectrin, the principal
    protein of the host erythrocyte membrane cytoskeleton, with nanomolar affinity. This
    interaction, which requires cleavage within the 38/42 region, destabilises the host
    cytoskeletal lattice and is required for efficient rupture of the infected erythrocyte
    and release (egress) of daughter merozoites.
  molecular_function:
    id: GO:0030507
    label: spectrin binding
  supported_by:
  - reference_id: PMID:26468747
    supporting_text: Processing modifies the secondary structure of MSP1 and activates its
      capacity to bind spectrin, a molecular scaffold protein that is the major component of
      the host erythrocyte cytoskeleton.
  - reference_id: PMID:26468747
    supporting_text: Parasites expressing an inefficiently processed MSP1 mutant show
      delayed egress, and merozoites lacking surface-bound MSP1 display a severe egress
      defect.
  locations:
  - id: GO:0005886
    label: plasma membrane
- description: >-
    MSP1 is an adhesin at the merozoite-erythrocyte interface: its p42/p19 fragments bind
    the exofacial 5ABC region of host band 3 (SLC4A1) and its N-terminal region binds
    glycophorin A, both sialic acid-independently, contributing to attachment of the
    merozoite to the red cell during invasion by a parasitophorous vacuole.
  molecular_function:
    id: GO:0046789
    label: host cell surface receptor binding
  supported_by:
  - reference_id: PMID:12692305
    supporting_text: These findings suggest that the chymotrypsin-sensitive MSP1-band 3
      interaction plays a role in a sialic acid-independent invasion pathway and reveal the
      function of MSP1 in the Plasmodium invasion of RBCs.
  - reference_id: PMID:25778531
    supporting_text: Mapping of the binding domains established a direct interaction between
      malaria MSP1 and human GPA within a region of MSP1 known to potently inhibit P
      falciparum invasion of human RBCs.
  locations:
  - id: GO:0005886
    label: plasma membrane
- description: >-
    MSP1 is the organising scaffold of the merozoite surface coat: the four non-covalently
    associated fragments generated by SUB1 form a platform that recruits and displays the
    peripheral surface proteins MSP6, MSP7, MSP3, MSP9, MSPDBL1 and MSPDBL2, several of
    which are themselves erythrocyte-binding, and which are shed together with MSP1 during
    invasion.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  supported_by:
  - reference_id: PMID:25074930
    supporting_text: This demonstrates that the MSP1 complex acts as a platform for display
      of MSPDBL1 and MSPDBL2 on the merozoite surface for binding to receptors on the
      erythrocyte and invasion.
  - reference_id: PMID:16940297
    supporting_text: Both MSP-6(36) and MSP-7 bind only to MSP-1 subunits that are shed, but
      although MSP-6(36) contacts just subunit p38, MSP-7 interacts with p83, p30, and p38.
  - reference_id: PMID:29511044
    supporting_text: Among the proteins of MSP-1 complex, PfMSP-6 and PfMSP-9 bound to human
      erythrocytes.
  locations:
  - id: GO:0005886
    label: plasma membrane
suggested_questions:
- question: >-
    Does MSP1 itself bind human erythrocytes, or does it act only as a display platform for
    erythrocyte-binding partners? Band 3 and glycophorin A binding by MSP1 fragments is well
    documented, yet in a surface-plasmon-resonance study MSPDBL1 and MSPDBL2, but not MSP1,
    bound intact erythrocytes directly; the discrepancy may reflect fragment choice,
    conformation of recombinant MSP1, or the requirement for processing.
  experts:
  - Alan F. Cowman
  - Anthony A. Holder
  - Athar H. Chishti
- question: >-
    Is the post-invasion persistence of MSP1-19 at the food vacuole membrane functional -
    for example in food vacuole biogenesis or haemoglobin digestion - or is it the inert
    endpoint of endocytic uptake of the surface coat? UniProt records this role as
    "Probable" only.
  experts:
  - Anthony A. Holder
  - Lawrence H. Bannister
- question: >-
    Is the MSP1-33/S100P interaction operative during natural infection, and does it
    measurably alter host inflammatory responses in vivo? The binding itself is solid and is
    annotated here as S100 protein binding, but the immunosuppressive consequence rests on a
    single in vitro study (NF-kappaB reporter in monocytes, neutrophil chemotaxis with
    recombinant MSP1-33), so no suppression-of-host-immunity process term is asserted
    pending in vivo or infection-context evidence.
  experts:
  - Susan K. Pierce
  - Louis H. Miller
- question: >-
    Does MSP1 binding measurably perturb the host erythrocyte cytoskeleton - for example by
    reducing membrane shear modulus or shifting the spectrin tetramer-dimer equilibrium - or
    is spectrin engagement sufficient for egress without detectable lattice damage? The
    perturbation is currently inferred from binding plus the rupture phenotype, which is why
    no symbiont-mediated-perturbation-of-host-cytoskeleton term is asserted here.
  experts:
  - Michael J. Blackman
  - Christian Epp
suggested_experiments:
- hypothesis: >-
    Processed MSP1 mechanically weakens the host erythrocyte spectrin lattice, and this
    weakening is the proximate cause of host cell rupture at egress.
  description: >-
    Apply purified SUB1-cleaved MSP1 (and the non-cleavable CD4mut control) to resealed
    erythrocyte ghosts or to inside-out vesicles and measure cytoskeletal mechanics directly -
    micropipette aspiration or optical-tweezer deformability, together with spectrin
    tetramer-to-dimer ratio by non-denaturing extraction - to test whether MSP1 binding
    reduces membrane shear modulus rather than merely associating with spectrin.
  experiment_type: biophysical membrane mechanics
- hypothesis: >-
    The spectrin-binding surface of MSP1 is separable from its erythrocyte-receptor-binding
    surfaces, so egress and invasion functions can be genetically uncoupled.
  description: >-
    Use the structure of MSP1 to design allele-replacement parasite lines carrying point
    mutations that abolish spectrin binding while preserving band 3 and glycophorin A binding
    (and the converse), then quantify egress kinetics by time-lapse video microscopy and
    invasion efficiency by flow cytometry in the same lines.
  experiment_type: reverse genetics with live-cell imaging
- hypothesis: >-
    MSP1-19 retained on the food vacuole membrane contributes to food vacuole biogenesis or
    haemoglobin catabolism.
  description: >-
    Generate parasites in which the GPI-attachment signal or the EGF-like domains of p19 are
    altered so that the fragment is shed rather than internalised, and assay food vacuole
    morphology by electron microscopy, haemozoin content, and haemoglobin-derived peptide
    profiles, comparing with wild-type parasites across the intraerythrocytic cycle.
  experiment_type: reverse genetics with ultrastructural and metabolic readout
