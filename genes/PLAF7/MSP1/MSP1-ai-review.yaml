- term:
    id: GO:0005774
    label: vacuolar membrane
  evidence_type: EXP
  original_reference_id: PMID:18769730
  qualifier: located_in
  review:
    summary: >-
      Immunofluorescence and immuno-electron microscopy showed that after invasion the
      GPI-anchored MSP1-19 fragment is endocytosed and persists at the membrane of the
      parasite's digestive (food) vacuole, colocalising there with CRT, throughout
      intraerythrocytic development.
    action: KEEP_AS_NON_CORE
    reason: >-
      The localisation is real and directly observed by two independent methods
      (immunofluorescence against CRT, and immuno-electron microscopy), so it is not
      removed or marked over-annotated. But it is not a core location. MSP1 is a
      GPI-anchored merozoite surface protein, and what reaches this membrane is only the
      p19 remnant, carried there passively by endocytic uptake of the surface coat after
      invasion; the authors themselves present a functional role as a possibility rather
      than a finding ("a potential role", "it may play a significant role"), and UniProt
      flags it ECO:0000305 Probable. On current evidence this is the post-invasion fate of
      the surface pool, not a site where MSP1 is known to act, so the term is kept as a
      non-core location. The term is also as precise as GO allows: there is no "food
      vacuole membrane" term, and inventing one on this evidence is not warranted.
    supported_by:
    - reference_id: PMID:18769730
      supporting_text: The food vacuole is marked by the presence of both MSP1(19) and the
        chloroquine resistance transporter (CRT) as components of the vacuolar membrane.
