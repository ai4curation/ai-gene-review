gene_symbol: MSP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: >-
  Merozoite surface protein 1 (MSP1) is the most abundant protein of the surface coat of
  the Plasmodium falciparum merozoite, the extracellular invasive stage of the asexual
  blood cycle. It is synthesised during schizogony as a ~190-200 kDa precursor that is
  attached to the parasite plasma membrane by a glycosylphosphatidylinositol (GPI) anchor
  and is restricted to the genus Plasmodium, with no orthologues outside it. Shortly
  before the parasite leaves the infected erythrocyte, the parasite subtilisin-like
  protease SUB1 cuts the precursor into four fragments (p83, p30, p38 and p42) that remain
  non-covalently associated on the merozoite surface; a second cleavage by SUB2, during
  invasion of the next erythrocyte, splits p42 into p33 and p19, shedding the bulk of the
  complex into the medium while the GPI-anchored p19 fragment stays on the invading
  parasite and is subsequently internalised into the digestive (food) vacuole, where it
  persists at the vacuolar membrane throughout intraerythrocytic development.
  Functionally, MSP1 works at the parasite-host interface in two ways. First, SUB1
  processing activates its ability to bind spectrin, the main component of the host
  erythrocyte cytoskeleton; this interaction destabilises the host cytoskeletal lattice
  and is required for efficient rupture of the host cell and release of merozoites.
  Second, MSP1 fragments engage host erythrocyte surface proteins - the exofacial 5ABC
  region of band 3 (SLC4A1) and glycophorin A - in a sialic acid-independent manner, and
  MSP1 acts as the assembly platform that displays the peripheral surface proteins MSP3,
  MSP6, MSP7, MSP9, MSPDBL1 and MSPDBL2, several of which bind erythrocytes themselves.
  The shed p33 fragment binds the host proinflammatory protein S100P and blocks
  S100P-driven NF-kappaB activation and neutrophil chemotaxis, suggesting an additional
  immunomodulatory role. MSP1 is essential for the asexual blood stage and is a leading
  blood-stage malaria vaccine candidate.
