- term:
    id: GO:0044650
    label: adhesion of symbiont to host cell
  evidence_type: IDA
  original_reference_id: PMID:8478608
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation: CSP is the sporozoite adhesin that attaches the parasite
      to hepatocytes by binding heparan sulfate proteoglycans on the host plasma
      membrane.
    action: NEW
    reason: >-
      GOA records the binding activity (GO:0043395, GO:0046812) and the downstream
      invasion process (GO:0085017), but not the adhesion step itself, which is a
      distinct biological process and the one CSP directly performs: it is the adhesin,
      not a factor merely required for adhesion by something else. Comparator check
      against other P. falciparum invasion adhesins: RH5 (Q8IFM5) carries GO:0044650,
      propagated automatically from its host cell surface receptor binding activity,
      whereas AMA1 carries only host cell surface binding and symbiont entry into host.
      The term is therefore applied inconsistently across this role rather than
      withheld by convention, and CSP - which is itself the attaching adhesin, with the
      host ligand directly identified - fits it. The term is neither an ancestor nor a
      descendant of GO:0085017 (adhesion versus entry), so it adds coverage rather than
      redundancy.
    supported_by:
    - reference_id: PMID:8478608
      supporting_text: the presence of receptors for the region II-plus of the circumsporozoite protein (CS) on
