knowledge_gaps:
- gap_statement: >-
    The identity of the parasite papain-like cysteine protease that cleaves CSP at
    region I during hepatocyte invasion is not established, and nor is how contact
    with highly sulfated heparan sulfate proteoglycans is transduced into activation
    of that cleavage.
  boundary: >-
    That region I cleavage occurs at the parasite cell membrane, is triggered by
    contact with highly sulfated host HSPGs, and is required for productive invasion
    but not for adhesion, motility or cell traversal, is established (recorded in the
    curated UniProt PTM annotation, by similarity to P. berghei CSP).
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    The protease and its activation mechanism are the molecular switch that commits a
    sporozoite to invasion rather than continued migration, and would be a
    pre-erythrocytic drug or vaccine target distinct from the antibody-targeted
    repeat region.
  resolution: >-
    Chemical-genetic or conditional-knockdown screening of P. falciparum sporozoite
    cysteine proteases combined with an in vitro cleavage assay on recombinant CSP
    and a hepatocyte-contact-dependent cleavage readout.
  provenance:
  - reference_id: file:PLAF7/CSP/CSP-uniprot.txt
    supporting_text: proteolytically cleaved at the cell membrane in the region I by
      a papain-like cysteine protease of parasite origin
- gap_statement: >-
    It is not known what, if anything, CSP binds on the mosquito salivary gland
    surface, nor whether salivary gland invasion uses the same TSR/HSPG-type
    recognition as hepatocyte invasion or a distinct vector-side receptor.
  boundary: >-
    That the region II motif of CSP is required for salivary gland invasion is firmly
    established by motif-deletion experiments in transgenic parasites; the hepatocyte
    ligand (heparan sulfate proteoglycan) is likewise established.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Determines whether one conserved adhesive activity serves both hosts or whether
    CSP has a second, vector-specific binding specificity - and therefore whether
    transmission-blocking strategies aimed at the vector stage can target the same
    epitope as pre-erythrocytic ones.
  resolution: >-
    Affinity purification or glycan-array/receptor-capture profiling of the mosquito
    salivary gland basal lamina ligands bound by recombinant PfCSP TSR, with
    validation by region II point mutants in transgenic sporozoites.
  provenance:
  - reference_id: PMID:12244064
    supporting_text: dramatically impaired their ability to invade mosquito salivary glands and infect the
      vertebrate host. These data shed new light on the role of the CS protein in sporozoite
      motility and infectivity.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which parasite papain-like cysteine protease cleaves CSP at region I, and is its
    activity directly stimulated by CSP engagement of highly sulfated heparan sulfate
    proteoglycans?
  experts: []
- question: >-
    Does CSP recognise a heparan-sulfate-like ligand on the mosquito salivary gland,
    or a chemically distinct vector receptor, and does the TSR adopt the same adhesive
    conformation in both hosts?
  experts: []
- question: >-
    Should the GPI-anchored display of CSP be captured by a more specific cellular
    component term (anchored component of plasma membrane) rather than plasma
    membrane, given that the GPI anchor is at present a sequence-based prediction in
    the P. falciparum entry and experimental only for orthologs?
  experts: []
- question: >-
    Is the central (NANP)n repeat region purely an immunodominant decoy, or does
    repeat length and sequence contribute measurably to adhesion avidity or to the
    conformational masking of the TSR?
  experts: []
suggested_experiments:
- description: >-
    Conditional depletion or region-II point mutagenesis of CSP in P. falciparum
    (rather than transgenic P. berghei) sporozoites, with quantitative gliding
    motility, hepatocyte attachment and invasion assays in human hepatocytes, to
    confirm directly in the species annotated here the motility and invasion
    phenotypes established in the rodent surrogate.
  hypothesis: >-
    Loss of the region II-plus adhesive motif in P. falciparum sporozoites abolishes
    gliding motility and hepatocyte attachment without affecting sporozoite
    development.
- description: >-
    Surface plasmon resonance and glycan-array profiling of recombinant PfCSP TSR
    against heparan sulfate oligosaccharides of defined sulfation patterns, and
    against mosquito salivary gland extracts, to define the minimal ligand determinant
    and test whether vector and vertebrate ligands are chemically related.
  hypothesis: >-
    CSP binding requires a minimum sulfation density on the glycosaminoglycan chain,
    and the salivary gland ligand shares that determinant.
- description: >-
    Activity-based protein profiling of cysteine proteases in salivary gland
    sporozoites combined with a cell-contact-triggered CSP cleavage reporter, to
    identify the region I protease and test whether HSPG engagement is sufficient to
    activate it.
  hypothesis: >-
    A single sporozoite papain-family cysteine protease is responsible for region I
    cleavage and is activated downstream of HSPG binding.
