- term:
    id: GO:0043395
    label: heparan sulfate proteoglycan binding
  evidence_type: IDA
  original_reference_id: PMID:8478608
  qualifier: enables
  review:
    summary: >-
      Frevert et al. identified the hepatocyte receptor for CSP region II-plus as
      heparan sulfate proteoglycan and showed recognition is via the glycosaminoglycan
      chains; this is the defining molecular function of CSP.
    action: ACCEPT
    reason: >-
      Direct biochemical demonstration: CSP binding to purified hepatocyte receptors
      is abolished by heparitinase treatment, identifying highly sulfated heparan
      sulfate proteoglycans as the ligand and the glycosaminoglycan chains as the
      recognised moiety. This is the most informative molecular-function term available
      for CSP and is the core activity underpinning its adhesion, motility and invasion
      roles.
    supported_by:
    - reference_id: PMID:8478608
      supporting_text: We have now identified these receptors as heparan sulfate
        proteoglycans (HSPG).
    - reference_id: PMID:8478608
      supporting_text: The binding of CS to the receptors is abolished by heparitinase
        treatment, indicating that the recognition of region II-plus is via the
        glycosaminoglycan chains.
- term:
    id: GO:0044409
    label: symbiont entry into host
  evidence_type: IDA
  original_reference_id: PMID:12244064
  qualifier: involved_in
  review:
    summary: >-
      Replacement of the endogenous P. berghei CSP with PfCSP lacking region II
      abolished motility and dramatically impaired invasion of mosquito salivary
      glands and infection of the vertebrate host, establishing CSP's requirement for
      entry into both the vector and the vertebrate host.
    action: ACCEPT
    reason: >-
      Although GO:0044409 is an ancestor of GO:0085017 (also annotated here), it is
      kept rather than treated as merely redundant because the supporting experiment
      covers entry events the hepatocyte-vacuole term does not represent: invasion of
      mosquito salivary glands and entry into the vertebrate host through the dermis.
      CSP performs the work of these steps itself - it is the surface adhesin that
      engages the substrate - rather than merely being required for them. The
      transgenic design (PfCSP expressed in P. berghei) is a legitimate complementation
      experiment and the authors show explicitly that PfCSP functions in the rodent
      parasite.
    supported_by:
    - reference_id: PMID:12244064
      supporting_text: Disruption of region II abolished sporozoite motility and
        dramatically impaired their ability to invade mosquito salivary glands and
        infect the vertebrate host.
    - reference_id: PMID:12244064
      supporting_text: We show here that P. falciparum circumsporozoite protein functions in rodent parasite and
        that P. berghei sporozoites carrying the P. falciparum CS gene develop normally, are
        motile, invade mosquito salivary glands, and infect the vertebrate host. Region
        I-deficient sporozoites showed no impairment of motility or infectivity in either vector
        or vertebrate host. Disruption of region II abolished sporozoite motility and dramatically
        impaired their ability to invade mosquito salivary glands and infect the vertebrate host.
        These data shed new light on the role of the CS protein in sporozoite motility and
        infectivity.
