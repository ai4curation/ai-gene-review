gene_symbol: CSP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: >-
  Circumsporozoite protein (CSP) is the GPI-anchored surface coat protein of the
  Plasmodium falciparum sporozoite, the parasite stage transmitted by Anopheles
  mosquitoes. It is synthesised in developing oocysts, where it is first cytoplasmic
  and then redistributes over the surface of the sporoblast and budding sporozoites,
  and it covers the entire plasma membrane of the mature sporozoite. The mature
  protein has three parts: an N-terminal region containing the conserved region I
  (KLKQP) cleavage motif, a long central (NANP)n repeat region, and a C-terminal
  thrombospondin type-1 repeat (TSR) domain bearing the region II-plus adhesive motif.
  CSP switches between a non-adhesive conformation, in which the N-terminus masks the
  TSR, and an adhesive conformation in which the TSR is exposed; unmasking is
  triggered by contact with highly sulfated heparan sulfate proteoglycans on the
  hepatocyte surface and involves proteolytic cleavage at region I by a parasite
  cysteine protease. Through the TSR/region II-plus motif CSP binds the
  glycosaminoglycan chains of host-cell-surface heparan sulfate proteoglycans, acting
  as the principal adhesin that attaches the sporozoite to its substrate. This
  adhesion drives substrate-dependent gliding motility and mediates sporozoite travel
  through the mosquito hemolymph, invasion of the vector salivary glands, migration
  through the vertebrate dermis to the liver, and finally invasion of hepatocytes,
  where the parasite enters inside a parasitophorous vacuole. The central repeat
  region is the immunodominant B-cell epitope of the sporozoite and the basis of the
  RTS,S vaccine.
