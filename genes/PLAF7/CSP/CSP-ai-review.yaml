- term:
    id: GO:0085017
    label: entry into host cell by a symbiont-containing vacuole
  evidence_type: IMP
  original_reference_id: PMID:29554084
  qualifier: involved_in
  review:
    summary: >-
      Antibodies against PfCSP block P. falciparum sporozoite invasion of human
      hepatocytes in vitro and reduce liver burden in vivo by up to 98.3%, showing
      that CSP function is required for hepatocyte invasion, which proceeds by
      formation of a parasitophorous vacuole.
    action: ACCEPT
    reason: >-
      The term is the correct parasite-specific specific term: Plasmodium sporozoites
      enter hepatocytes inside a parasitophorous vacuole, so this is not an
      animal-centric or mis-transferred term. CSP is the adhesin that engages the
      hepatocyte surface and whose region I cleavage licenses productive invasion, so
      it executes part of the entry process rather than merely being needed for it.
      Antibody blockade is a direct perturbation of the protein's function and the
      assays used P. falciparum sporozoites with a human hepatocyte line. This is a
      core function.
    supported_by:
    - reference_id: PMID:29554084
      supporting_text: we tested a panel of IgG antibodies in vitro for their capacity to inhibit PfSPZ traversal
        and invasion of a human hepatocyte cell line (Fig. 2a).
    - reference_id: PMID:29554084
      supporting_text: which is involved in the cleavage of the N-terminus to allow PfSPZ invasion
        of hepatocytes
