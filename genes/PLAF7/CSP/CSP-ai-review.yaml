- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:16603573
  qualifier: located_in
  review:
    summary: >-
      CSP is the GPI-anchored coat of the sporozoite plasma membrane; the location is
      correct and independently established, although the cited GPI-proteome study
      was focused on blood-stage parasites.
    action: ACCEPT
    reason: >-
      Plasma-membrane localisation of CSP is firmly established: it is GPI-anchored on
      the sporozoite surface (PMID:32150583) and UniProt records cell membrane with a
      GPI lipid anchor. The cited reference is a P. falciparum GPI-anchored-proteome
      study whose abstract states it focused on the blood stage, and whose eleven
      proteomically validated GPI proteins are merozoite surface proteins; CSP enters
      through the study's GPI-HMM ranking of the whole genome. The curator read the
      full text and the conclusion is correct for this protein regardless, so this is
      accepted rather than challenged, and the location is core to CSP's function as a
      surface adhesin.
    supported_by:
    - reference_id: PMID:32150583
      supporting_text: PfCSP is GPI-anchored on the sporozoite surface and plays a critical role in sporozoite
        development, motility and hepatocyte invasion [12, 13].
    - reference_id: PMID:16603573
      supporting_text: Most proteins that coat the surface of the extracellular forms
        of the human malaria parasite Plasmodium falciparum are attached to the plasma
        membrane via glycosylphosphatidylinositol (GPI) anchors.
