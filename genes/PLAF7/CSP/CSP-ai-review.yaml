- id: PMID:12244064
  title: Function of region I and II adhesive motifs of Plasmodium falciparum circumsporozoite
    protein in sporozoite motility and infectivity.
  findings:
  - statement: >-
      Deletion of the region II adhesive motif from CSP abolished sporozoite gliding
      motility and severely impaired invasion of mosquito salivary glands and
      infection of the vertebrate host, whereas deletion of region I had no detectable
      phenotype.
    supporting_text: Disruption of region II abolished sporozoite motility and
      dramatically impaired their ability to invade mosquito salivary glands and
      infect the vertebrate host.
  - statement: >-
      P. falciparum CSP is functional when substituted for the endogenous CSP of P.
      berghei, validating the transgenic complementation design used to assign these
      phenotypes to PfCSP.
    supporting_text: We show here that P. falciparum circumsporozoite protein
      functions in rodent parasite and that P. berghei sporozoites carrying the P.
      falciparum CS gene develop normally, are motile, invade mosquito salivary
      glands, and infect the vertebrate host.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title, authors and journal match the cached PubMed record and the GOA reference
      for the GO:0044409 IDA. The experiments are performed on PfCSP expressed in a P.
      berghei background, which the paper states explicitly; this is a legitimate
      complementation design, noted in the relevant review reasons rather than treated
      as a mis-attribution.
- id: PMID:16603573
  title: Identification and stoichiometry of glycosylphosphatidylinositol-anchored
    membrane proteins of the human malaria parasite Plasmodium falciparum.
  findings:
  - statement: >-
      The surface coat of extracellular P. falciparum stages consists largely of
      GPI-anchored plasma membrane proteins, the class to which CSP belongs.
    supporting_text: Most proteins that coat the surface of the extracellular forms of
      the human malaria parasite Plasmodium falciparum are attached to the plasma
      membrane via glycosylphosphatidylinositol (GPI) anchors.
  - statement: >-
      The proteomic part of the study was restricted to blood-stage parasites, and the
      eleven GPI anchors validated by radiolabelling are merozoite-stage surface
      proteins; CSP enters the study through the genome-wide GPI-HMM prediction.
    supporting_text: Focusing on the clinically relevant blood stage of the life cycle, proteomic analysis of
      proteins labeled with radioactive glucosamine identified GPI anchoring on 11 proteins
      (merozoite surface protein (MSP)-1, -2, -4, -5, -10, rhoptry-associated membrane antigen,
      apical sushi protein, Pf92, Pf38, Pf12, and Pf34).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The identifier resolves to the intended paper. Only the abstract is cached, and
      it indicates the proteomic validation was blood-stage focused while CSP is a
      sporozoite protein; the plasma membrane conclusion it is cited for is correct and
      independently supported, so the annotation is accepted, with the caveat recorded
      in the review reason rather than used to overrule the curator.
- id: PMID:29554084
  title: A public antibody lineage that potently inhibits malaria infection through
    dual binding to the circumsporozoite protein.
  findings:
  - statement: >-
      PfCSP coats the sporozoite surface and is required for migration out of the
      skin, entry into the liver parenchyma and invasion of hepatocytes.
    supporting_text: which coats the PfSPZ surface and plays a key role in parasite migration out of the skin,
      entry into the liver parenchyma and invasion of hepatocytes7–12.
  - statement: >-
      Antibodies against PfCSP inhibit sporozoite traversal and invasion of a human
      hepatocyte cell line in vitro and reduce liver burden in a humanized-liver mouse
      model by up to 98.3%, demonstrating that CSP function is required for hepatocyte
      infection.
    supporting_text: Some antibodies, such as MGG3, MGG4, MGH2, MGU10 and MGU12, were very potent in reducing
      liver burden by up to 98.3%, while others, such as MGG8, MGH1, MGH3 and MGU1, were less
      effective (Fig. 2c).
  - statement: >-
      Region I (KLKQP) of PfCSP is involved in N-terminal cleavage that permits
      sporozoite invasion of hepatocytes.
    supporting_text: region I (KLKQP) of PfCSP, which is involved in the cleavage of the N-terminus
      to allow PfSPZ invasion of hepatocytes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; the invasion-inhibition assays use P. falciparum sporozoites
      and a human hepatocyte line, directly supporting the GO:0085017 IMP annotation
      for this protein.
- id: PMID:32150583
  title: Structure and mechanism of monoclonal antibody binding to the junctional
    epitope of Plasmodium falciparum circumsporozoite protein.
  findings:
  - statement: >-
      PfCSP is GPI-anchored on the sporozoite surface and is critical for sporozoite
      development, motility and hepatocyte invasion.
    supporting_text: PfCSP is GPI-anchored on the sporozoite surface and plays a critical role in sporozoite
      development, motility and hepatocyte invasion [12, 13].
  - statement: >-
      Passive transfer of anti-PfCSP monoclonal antibodies reduced parasite liver
      burden by more than 90% in vivo, consistent with a requirement for CSP in liver
      infection.
    supporting_text: Both antibodies are potent, especially at high concentrations (300 and 600 μg/mouse) with
      >90% reduction in liver burden load as compared to naïve infected mice (Fig 5).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and consistent with the GOA record. The in vivo protection
      experiments used transgenic P. berghei sporozoites carrying the PfCSP epitope,
      so this reference supports the hepatocyte-invasion annotation somewhat more
