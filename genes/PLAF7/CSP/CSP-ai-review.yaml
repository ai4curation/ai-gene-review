- id: PMID:8478608
  title: Malaria circumsporozoite protein binds to heparan sulfate proteoglycans associated
    with the surface membrane of hepatocytes.
  findings:
  - statement: >-
      The hepatocyte receptors for CSP region II-plus are heparan sulfate
      proteoglycans on the basolateral plasma membrane, and recognition occurs through
      their glycosaminoglycan chains.
    supporting_text: We have now identified these receptors as heparan sulfate
      proteoglycans (HSPG). The binding of CS to the receptors is abolished by
      heparitinase treatment, indicating that the recognition of region II-plus is via
      the glycosaminoglycan chains.
  - statement: >-
      The CSP-binding proteoglycans are large (400-700 kDa), tightly membrane
      associated and released by mild trypsinization, properties shared with syndecans.
    supporting_text: They have a molecular weight of 400,000-700,000, are tightly associated with the plasma
      membrane, and are released from the cell surface by very mild trypsinization, a property
      which the CS receptors share with the syndecan family of proteoglycans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifier, title and authors match the cached PubMed record; this is the
      primary source for both the heparan sulfate proteoglycan binding and host cell
      surface binding annotations, and for the proposed adhesion-of-symbiont-to-host
      -cell term.
