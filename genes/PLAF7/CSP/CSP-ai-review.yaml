- term:
    id: GO:0071976
    label: cell gliding
  evidence_type: IMP
  original_reference_id: PMID:12244064
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation: deletion of the region II adhesive motif of CSP
      abolished sporozoite gliding motility, while deletion of region I had no effect,
      showing that the CSP adhesive motif is required for the substrate-dependent
      gliding locomotion of the sporozoite.
    action: NEW
    reason: >-
      Sporozoite locomotion is gliding motility - smooth movement along a solid
      surface driven by surface adhesins coupled to the subpellicular actomyosin motor
      - which matches the GO:0071976 definition. CSP participates directly: as a
      surface adhesin it provides the substrate engagement that the motor pulls
      against, so it contributes the adhesive activity a step of the process depends
      on rather than merely being required for an outcome. The evidence is a specific
      motif deletion with a clean internal control (region I deletion gives no
      phenotype), which argues against a generic loss-of-fitness explanation. No
      existing annotation covers motility.
    supported_by:
    - reference_id: PMID:12244064
      supporting_text: Disruption of region II abolished sporozoite motility and
        dramatically impaired their ability to invade mosquito salivary glands and
        infect the vertebrate host.
    - reference_id: PMID:12244064
      supporting_text: Region I-deficient sporozoites showed no impairment of motility
        or infectivity in either vector or vertebrate host.
core_functions:
- description: >-
    Sporozoite surface adhesin: through the region II-plus motif of its C-terminal
    thrombospondin type-1 repeat (TSR) domain, CSP binds the glycosaminoglycan chains
    of highly sulfated heparan sulfate proteoglycans displayed on the host hepatocyte
    plasma membrane. This is the defining molecular activity of the protein and the
    molecular basis of the sporozoite's hepatocyte tropism.
  supported_by:
  - reference_id: PMID:8478608
    supporting_text: The binding of CS to the receptors is abolished by heparitinase
      treatment, indicating that the recognition of region II-plus is via the
      glycosaminoglycan chains.
