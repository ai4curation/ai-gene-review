- term:
    id: GO:0140522
    label: fusogenic activity
  evidence_type: IDA
  original_reference_id: PMID:36241929
  qualifier: enables
  review:
    summary: >-
      GOA gives this protein no molecular function at all, yet PfHAP2 is one of the few
      characterised non-viral fusogens. Codon-optimized full-length PfHAP2 expressed in BHK
      cells drives cytoplasmic content mixing and multinucleation to levels comparable to
      Arabidopsis HAP2, in a heterologous system with no other parasite protein present.
      Structural work on the family shows a class II viral fusion protein fold with a cd
      fusion loop whose disruption abolishes gamete fusion, and dye-transfer experiments
      place the family's requirement precisely at bilayer merger rather than at recognition
      or attachment. GO:0140522, the activity of joining two lipid bilayers to form a single
      membrane, is the matching term.
    action: NEW
    reason: >-
      Participation test: the protein itself performs the step. Expressed alone in mammalian
      cells it fuses them, so it is not merely required for, or a substrate of, another
      protein's activity; and in gametes, hap2 mutants still recognise and tightly attach to
      the partner gamete yet fail to merge membranes, isolating HAP2's contribution to the
      merger step itself. Comparator check: Chlamydomonas HAP2 (A4GRC6) carries experimental
      annotations for lipid binding and for membrane fusion involvement rather than for
      GO:0140522, and the GO:0140522 branch is young and sparsely populated; its existing
      children (SNAP receptor activity, GTPase-dependent fusogenic activity) specify
      mechanisms PfHAP2 does not use, so the parent is the correct level. The absence of any
      molecular function on this gene reflects the fact that Q8IJQ3 is an unreviewed TrEMBL
      entry with only two electronic/phylogenetic annotations, not a curatorial convention
      against annotating fusogens.
    supported_by:
    - reference_id: PMID:36241929
      supporting_text: We found that both PfHAP2 and PfHAP2p induced cytoplasmic content mixing (i.e., cell
        fusion) to similar levels as the AtHAP2 (Fig. 5A–C).
    - reference_id: PMID:36241929
      supporting_text: both PfHAP2 and PfHAP2p possess independent fusogenic activity as their expression
        mediated cell fusion, cell content mixing, and syncytia formation.
    - reference_id: PMID:18367645
      supporting_text: Membrane dye experiments show that HAP2 is essential for membrane merger.
- term:
    id: GO:0009566
    label: fertilization
  evidence_type: IMP
  original_reference_id: PMID:36241929
  qualifier: involved_in
  review:
    summary: >-
      Targeted deletion of PF3D7_1014200 in P. falciparum NF54 leaves asexual replication,
      gametocyte development and exflagellation unaffected but abolishes zygote formation and
      yields no mosquito oocysts; genetic crosses with female-only (Pfcdpk4-null) and male-only
      (Pfmacfet-null) producer lines show that the sterility is male-specific, with knockout
      females fertilised normally. The protein therefore acts in the fusion of the microgamete
      with the macrogamete, the defining event of fertilization.
    action: NEW
    reason: >-
      Participation test: HAP2 performs the membrane merger that constitutes gamete fusion,
      so this is participation and not mere necessity - the same protein's fusogenic activity
      is annotated above, and the knockout phenotype is downstream of that activity rather
      than independent evidence of a different role. Comparator check: the two best-characterised
      unicellular HAP2 orthologs in the identical role both carry fertilization terms in GOA -
      P. berghei HAP2 (Q4YCF6) has GO:0009566 by IMP from PMID:21209845 and PMID:29212032, and
      Chlamydomonas HAP2 (A4GRC6) carries the gamete-fusion term by IMP - so the absence here
      is a gap on an unreviewed entry rather than a convention. The taxon-neutral
      GO:0009566 is proposed rather than its descendant GO:0007342 fusion of sperm to egg
      plasma membrane involved in single fertilization, because GO:0007342 is classified under
      GO:0022412 cellular process involved in reproduction in multicellular organism, which
