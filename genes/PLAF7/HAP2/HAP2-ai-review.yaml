id: Q8IJQ3
gene_symbol: HAP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36329
  label: Plasmodium falciparum 3D7
description: >-
  HAP2/GCS1 (PfHAP2, PF3D7_1014200) is the Plasmodium falciparum member of the ancient,
  pan-eukaryotic HAP2/GCS1 family of gamete fusogens. It is a single-pass type I membrane
  protein with a large ectodomain folded as a class II fusion protein, structurally
  homologous to the fusogens of enveloped viruses, a single transmembrane helix (residues
  682-700) and a basic, disordered cytoplasmic tail. The ectodomain carries a hydrophobic
  cd (fusion) loop that is thought to insert into the target bilayer, and a disulfide-stapled
  domain 3 whose crystal structure has been solved. Expression is restricted to the sexual
  stages and, within them, to the male lineage: the protein accumulates internally in
  developing male gametocytes and, after activation in the mosquito midgut, is displayed
  throughout the plasma membrane of the flagellated microgamete, where it is accessible to
  antibodies on intact cells. There it performs the terminal step of fertilization. Species
  specific surface proteins mediate recognition and tight prefusion attachment between
  microgamete and macrogamete; HAP2 then merges the two lipid bilayers, so gametes lacking
  it adhere normally but never fuse. Consistent with this, parasites lacking HAP2 grow and
  form gametocytes and exflagellate normally but produce no zygotes and no mosquito oocysts,
  and genetic crosses show the defect is male-specific. Expressed in mammalian cells the
  protein is a bona fide fusogen, driving cell-cell content mixing and syncytium formation.
  P. falciparum additionally encodes a second, divergent family member, HAP2p
  (PF3D7_0816300), which is separately essential for male fertility. Because gamete fusion
  is an obligatory bottleneck in transmission from human to mosquito, HAP2 is a leading
  transmission-blocking vaccine antigen.
