core_functions:
  - description: >-
      Gamete fusogen. PfHAP2 is a class II fusion protein displayed on the plasma membrane of
      the flagellated microgamete. After species-specific surface proteins have brought the
      microgamete and macrogamete membranes into tight prefusion contact, PfHAP2 inserts its
      cd (fusion) loop into the opposing bilayer and refolds, merging the two lipid bilayers
      so that the cytoplasms join and a zygote forms. The activity is intrinsic to the
      protein: expressed by itself in mammalian BHK cells it fuses them into multinucleate
      syncytia, and in gametes its loss blocks lipid merger while leaving recognition and
      adhesion intact.
    molecular_function:
      id: GO:0140522
      label: fusogenic activity
    directly_involved_in:
    - id: GO:0009566
      label: fertilization
    locations:
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: PMID:36241929
      supporting_text: both PfHAP2 and PfHAP2p possess independent fusogenic activity as their expression
        mediated cell fusion, cell content mixing, and syncytia formation.
    - reference_id: PMID:36241929
      supporting_text: nonredundant essential roles for PfHAP2 and PfHAP2p in mediating gamete fusion in
        Plasmodium and suggest avenues in the design of novel strategies to prevent malaria
        parasite transmission from humans to mosquitoes.
    - reference_id: PMID:18367645
      supporting_text: hap2 gametes in both Chlamydomonas and Plasmodium recognized and adhered to gametes of the
        opposite sex indicated that HAP2 is not essential for species-limited membrane recognition
        or the tight, prefusion attachment of the fusogenic membranes that precedes membrane
        fusion.
    - reference_id: PMID:29212032
      supporting_text: Staining was absent in assays with HAP2-KO parasite lines, indicating the ability of these
        antibodies to recognize natively folded HAP2 on the gamete surface (Figures 2A and 2B).
proposed_new_terms: []
suggested_questions:
- question: >-
    Should GO provide a taxon-neutral child of GO:0009566 fertilization for gamete membrane
    fusion in unicellular and anisogamous protists? GO:0007342 fusion of sperm to egg plasma
    membrane involved in single fertilization is currently used for Chlamydomonas and
    P. berghei HAP2, yet it is classified under GO:0022412 cellular process involved in
    reproduction in multicellular organism, which is taxonomically wrong for these organisms,
    while GO:0000755 cytogamy sits under conjugation with cellular fusion and describes mating
    type conjugation rather than fusion of differentiated gametes.
  experts:
  - William J Snell
  - Pascale Gaudet
- question: >-
    Is gamete fusion in Plasmodium unidirectional, with HAP2 required only on the male, or
    bidirectional? Genetic crosses show the requirement is male-restricted, whereas in the BHK
    heterologous assay fusion occurs only when the fusogen is present in both membranes,
    implying an unidentified female-side partner.
  experts:
  - Stefan H I Kappe
  - Benjamin Podbilewicz
- question: >-
    What is the functional relationship between PfHAP2 and the paralog PfHAP2p
    (PF3D7_0816300)? Each is individually essential for male fertility despite both being
    present in the same microgamete, which is unexpected for two fusogens of the same family;
    do they form a heterocomplex, or act at successive steps?
  experts:
  - Stefan H I Kappe
  - Benjamin Podbilewicz
- question: >-
    Does PfHAP2 have a defined intracellular residence before activation, and is its delivery
    to the microgamete surface regulated? The protein is detected internally in stage V male
    gametocytes, and the only cellular component annotation beyond the plasma membrane is a
    phylogenetically inferred endoplasmic reticulum term with no Plasmodium data behind it.
  experts:
  - Stefan H I Kappe
  - Wai-Hong Tham
suggested_experiments:
- hypothesis: >-
    Purified PfHAP2 ectodomain is sufficient to fuse protein-free liposomes, establishing
    fusogenic activity for the P. falciparum protein directly rather than through heterologous
    cell expression.
  description: >-
    Express and refold the PfHAP2 ectodomain, reconstitute it into proteoliposomes, and measure
    lipid mixing and content mixing against target liposomes of defined composition using dual
    fluorescent probes. Include a cd loop mutant and the domain 3 nanobodies as negative
    controls. This separates the intrinsic fusion activity of the protein from any contribution
    of host-cell factors present in the BHK assay.
  experiment_type: in vitro liposome fusion assay with recombinant ectodomain
- hypothesis: >-
    PfHAP2 and PfHAP2p are present in the same complex on the microgamete surface, which
    explains why each is individually essential.
  description: >-
    Perform reciprocal co-immunoprecipitation and crosslinking mass spectrometry from activated
    microgametes of the PfHAP2-GFP x PfHAP2p-mCherry double transgenic line, and test whether
    each protein still reaches the flagellar surface in the other's knockout by
    immunofluorescence on non-permeabilized gametes.
  experiment_type: co-immunoprecipitation and surface localization in knockout backgrounds
- hypothesis: >-
    A macrogamete surface protein acts as the receptor that makes HAP2-driven fusion
    unidirectional in the parasite.
  description: >-
    Use the PfHAP2 ectodomain as bait in pulldowns from activated macrogamete surface
    biotinylation lysates, and test candidate hits by targeted deletion for a female-restricted
    fertilization defect that phenocopies the male Pfhap2 knockout in genetic crosses.
  experiment_type: affinity purification mass spectrometry plus reverse genetics
