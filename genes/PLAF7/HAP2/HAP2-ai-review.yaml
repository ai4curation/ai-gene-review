existing_annotations:
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT4G11720
  - PANTHER:PTN000788722
  - UniProtKB:Q389Q2
  review:
    summary: >-
      Phylogenetic propagation from the HAP2/GCS1 ancestral node PTN000788722. The donor
      evidence is genuine: Arabidopsis HAP2 (AT4G11720, F4JP36) carries an experimental ER
      annotation and also an ER membrane annotation, and Trypanosoma brucei Q389Q2 has
      high-throughput ER localization. For PfHAP2 there is no Plasmodium-specific ER
      evidence, but an internal, pre-activation pool is consistent with the observation that
      the protein is expressed internally in male stage V gametocytes before being
      displayed on the microgamete flagellar surface, and a single-pass type I membrane
      protein with a signal peptide necessarily transits the ER. The claim is therefore
      plausible and is retained, but the ER is a biosynthetic waystation, not where the
      fusogen does its work: HAP2 merges bilayers at the microgamete plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBD node placement is sound - HAP2/GCS1 is an ancestral single-pass secretory-pathway
      protein and PfHAP2 sits squarely inside the clade, with no evidence of divergence or
      loss, so there is no basis for arguing with the node. Retained rather than removed. It is
      marked non-core rather than accepted as core because the protein's defining activity,
      membrane merger during gamete fusion, is executed at the plasma membrane of the
      microgamete and not in the ER; no refinement is proposed because the ER is already as
      precise as the (indirect) evidence allows for this gene.
    supported_by:
    - reference_id: PMID:36241929
      supporting_text: This revealed that PfHAP2 was expressed internally in male stage V gametocytes while in
        the microgametes, it was expressed throughout the flagellum (Fig. 2A).
    - reference_id: file:PLAF7/HAP2/HAP2-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the HAP2/GCS1 family.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000788722
        source_status: SUPPORTS_TRANSFER
        comment: >-
          HAP2/GCS1 ancestral node. The node is seeded by experimental ER localization of
          Arabidopsis HAP2 and is biologically coherent for a conserved single-pass type I
          membrane protein of the secretory pathway; PfHAP2 descends from it with no
          evidence of divergence.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: >-
      Mapped from the UniProt subcellular location "Cell membrane; Single-pass type I membrane
      protein". This is independently confirmed experimentally for PfHAP2: GFP-tagged protein
      is displayed throughout the flagellum of the activated microgamete, and anti-HAP2 cd loop
      antibodies stain the surface of non-permeabilized male gametes with the staining lost in
      HAP2 knockout parasites. The plasma membrane is where the fusogen acts, since bilayer
      merger with the macrogamete occurs there.
    action: ACCEPT
    reason: >-
      Correct and core. The term is at the right level of granularity: the microgamete is a
      small flagellated cell whose surface is a single continuous plasma membrane, so no
      plasma-membrane subregion term would be better supported. GO:0036126 sperm flagellum
      was considered and rejected as an animal-specific cellular component term inappropriate
      for a protist microgamete.
    supported_by:
    - reference_id: PMID:36241929
      supporting_text: This revealed that PfHAP2 was expressed internally in male stage V gametocytes while in
        the microgametes, it was expressed throughout the flagellum (Fig. 2A).
