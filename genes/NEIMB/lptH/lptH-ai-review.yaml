- id: PMID:21705335
  title: The LptD chaperone LptE is not directly involved in lipopolysaccharide transport in Neisseria
    meningitidis.
  findings:
  - statement: H44-derived LptE supports LptD abundance and association while detectable surface LPS
      delivery persists; LptH loss prevents surface accessibility.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary read. Normal cache is abstract-only; full PMC3190676 independently
      acquired by literature consultant and quoted in the scoped source analysis. H44/76 and HB-1
      assays are not relabeled MC58.
