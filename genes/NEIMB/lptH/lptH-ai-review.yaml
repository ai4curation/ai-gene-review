      and GO lines are not used as evidence.
- id: file:analysis/module_audits/bacterial_lps_transport/neisseria-consultation/primary-evidence.md
  title: PMID21705335 scoped full-primary evidence and strain boundaries
  findings:
  - statement: Controlled LptD association, LptD abundance rescue, and surface-accessibility assays
      distinguish LptE support from the carrier/translocator roles.
    supporting_text: Only the LPS of the wild type and of the Δ lptE mutant was surface-accessible
- id: file:analysis/module_audits/bacterial_lps_transport/literature-consultation/identity/README.md
  title: Neisseria assay-strain identity bridge
  findings:
  - statement: Natural full-length reference proteins match H44/76 CDS translations; sequence identity
      is distinct from assay-strain phenotype or construct identity.
    supporting_text: All three matches are exact and unique among 2,423 translated CDSs.
- id: PMID:20720015
  title: Structure and functional analysis of LptC, a conserved membrane protein involved in the lipopolysaccharide
    export pathway in Escherichia coli.
  findings:
  - statement: Purified E. coli LptA acquires LPS from LptC in vitro, supporting the LptA-family carrier
      mechanism used as a comparative inference for Neisseria LptH.
    supporting_text: In vitro, LptA can displace lipopolysaccharide from LptC (but not vice versa)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary cached. Tagged/soluble E. coli proteins and directional displacement
      experiments support the homolog mechanism, not a direct MC58 or H44 purified-transfer assay.
core_functions:
- description: Transfer LPS through the periplasm as the LptA-family bridge carrier. This molecular
    role is inferred from specific architecture and characterized LptA homologs, reinforced by exact
    natural H44/76 sequence identity and source-strain surface-delivery defects; purified MC58 transfer
    kinetics are not available.
