taxon:
  id: NCBITaxon:122586
  label: Neisseria meningitidis MC58
description: LptH is the periplasmic LptA-family LPS carrier of Neisseria meningitidis MC58 (NMB0355;
  UniProt primary name lptA). The LptH name distinguishes this carrier from the unrelated neisserial
  lipid A phosphoethanolamine transferase also called LptA. The 176-residue MC58 protein is identical
  to the natural H44/76 homolog. Native H44/76-derived deletion experiments support a role in surface
  LPS delivery, while carrier chemistry is inferred from its specific LptA-family architecture and
  characterized homologs. It contributes the periplasmic segment of the transport bridge rather than
  an ATPase or lipid A modification enzyme.
