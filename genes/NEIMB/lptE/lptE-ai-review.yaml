- term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007485
  - UniRule:UR000068665
  review:
    summary: LptE supports outer-membrane assembly by maintaining LptD.
    action: ACCEPT
    reason: Physical LptD association, the selective reduction of LptD abundance after lptE deletion
      and restoration by complementation support a direct assembly/stability contribution. Detectable
      LPS surface transport persists, so this annotation does not imply an obligatory translocation
      step. Phenotype is H44/HB-1; protein-role transfer to MC58 is sequence-grounded.
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_lps_transport/neisseria-consultation/primary-evidence.md
      supporting_text: Cellular LptD levels were similar in all mutants except in the Δ lptE strain
        where they were severely decreased
    - reference_id: file:analysis/module_audits/bacterial_lps_transport/neisseria-consultation/primary-evidence.md
      supporting_text: This defect was completely restored in a strain complemented with a copy of
        lptE under IPTG control on plasmid
    - reference_id: file:analysis/module_audits/bacterial_lps_transport/literature-consultation/identity/README.md
      supporting_text: All three matches are exact and unique among 2,423 translated CDSs.
