core_functions:
- description: Support LptD biogenesis or stability through physical association at the outer membrane;
    inferred for MC58 from its exact natural sequence match to H44/76 LptE and native H44-derived
    association/deletion/complementation evidence. The available experiments do not establish autonomous
    foldase activity or an obligatory LPS-translocation contribution.
