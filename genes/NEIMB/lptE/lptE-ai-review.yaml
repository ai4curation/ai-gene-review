id: Q9K0A7
gene_symbol: lptE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:122586
  label: Neisseria meningitidis MC58
description: LptE is an outer-membrane lipoprotein that associates with LptD and supports its biogenesis or stability in Neisseria meningitidis. The MC58 protein is identical across its full 159 residues to H44/76 LptE. In H44/76-derived strains, lptE deletion reduces LptD abundance and complementation restores it, while surface LPS transport remains detectable.
