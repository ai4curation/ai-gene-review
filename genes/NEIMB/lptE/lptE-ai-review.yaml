  - UniProtKB:P0ADC1
  review:
    summary: LptE is associated with the LPS transport machinery.
    action: MODIFY
    reason: The PAINT assertion at PTN002866256 supports complex membership, not autonomous transport
      activity. Native H44-derived tagged-LptE co-purifies LptD with untagged and BamA controls; exact
      sequence supports MC58 role inference. Refine to the LPS transport system. No IRD/IKR loss was
      reported on this lineage; donor count is not used to discount the assertion.
    supported_by:
    - reference_id: file:analysis/module_audits/bacterial_lps_transport/neisseria-consultation/primary-evidence.md
      supporting_text: Affinity purification using Ni 2+ -NTA beads on membrane extracts resulted
        in co-purification of LptD with LptE
    - reference_id: file:analysis/module_audits/bacterial_lps_transport/neisseria-consultation/primary-evidence.md
      supporting_text: This interaction was specific because no Omp85/BamA was co-purified and no
        LptD was purified when membranes containing overexpression levels of LptE without a His tag
        were used
    - reference_id: file:analysis/module_audits/bacterial_lps_transport/literature-consultation/identity/README.md
      supporting_text: All three matches are exact and unique among 2,423 translated CDSs.
    proposed_replacement_terms:
