id: A0A8B8L1Z3
gene_symbol: A0A8B8L1Z3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3816
  label: Abrus precatorius
description: >-
  A0A8B8L1Z3 (LOC113860185) is a 474-amino-acid protein from Abrus precatorius (Indian
  licorice). It has an N-terminal J domain (residues 70-135) followed by long low-complexity
  and disordered regions. It belongs to the plant-specific PTHR45496 family, subfamily SF19.
  The only Arabidopsis thaliana member of SF19 is At5g64360, which is known as SDJ1, DNAJ1 or
  EIP9. The Abrus protein is most similar to SDJ1 among Arabidopsis proteins (about 46%
  identity over its length) and the two have similar lengths. The J domain lacks the
  His-Pro-Asp (HPD) motif needed to stimulate Hsp70 ATPase activity. SDJ1 also lacks this
  motif, which argues against a canonical Hsp70 cochaperone role. In Arabidopsis, SDJ1 and
  its paralogs SDJ2 and SDJ3 are nuclear proteins. They lack DNA-binding domains. The SU(VAR)3-9
  homologs SUVH1 and SUVH3, which read DNA methylation, recruit them to methylated
  euchromatic sites near transposons. There they enhance transcription of nearby genes,
  counteracting the silencing effect of transposon methylation. By descent, A0A8B8L1Z3 is
  predicted to be a nuclear transcriptional coactivator of this SUVH-SDJ type. The Abrus
  protein itself has not been characterized experimentally.
references:
  - id: PMID:31775284
    title: "Detection of Abrin-Like and Prepropulchellin-Like Toxin Genes and Transcripts Using Whole Genome Sequencing and Full-Length Transcript Sequencing of Abrus precatorius"
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >-
        Genome-sequencing paper that is the source of the Abrus precatorius gene model, as
        cited in the UniProt record. It contains no functional information about this protein.
        Kept as provenance for the sequence.
  - id: PMID:30523112
    title: "A DNA methylation reader complex that enhances gene transcription."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Harris et al. 2018 (full text cached). Shows that SUVH1 and SUVH3 recruit DNAJ1
        (At5g64360, the Arabidopsis PTHR45496:SF19 member and the closest relative of
        A0A8B8L1Z3) and DNAJ2 to methylated DNA. Tethering DNAJ1 to DNA activated
        transcription in plants, yeast and mammals. Basis for the predicted coactivator
        function of A0A8B8L1Z3.
  - id: PMID:30589221
    title: "A methylated-DNA-binding complex required for plant development mediates transcriptional activation of promoter methylated genes."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Zhao et al. 2019 (abstract only in the cache). Defines the SUVH-SDJ complex
        (SDJ1, SDJ2, SDJ3), shows that its components have transcriptional activation
        activity, and that they are needed to express promoter-methylated genes.
  - id: PMID:21700722
    title: "EMF1 interacts with EIP1, EIP6 or EIP9 involved in the regulation of flowering time in Arabidopsis."
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Park et al. 2011 (abstract only). EIP9 is the same gene as SDJ1 (At5g64360). The
        abstract places the EMF1-EIP9 heterodimer in the nucleus and reports altered
        flowering time in eip9 mutants. The flowering-time result is an organismal
        phenotype and is not transferred to Abrus.
  - id: PMID:34185870
    title: "Roles of IDM3 and SDJ1/2/3 in Establishment and/or Maintenance of DNA Methylation in Arabidopsis."
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Miao et al. 2021 (abstract only). The sdj1/2/3 triple mutant has reduced DNA
        methylation at a subset of RdDM targets, and SDJ1 and SDJ3 interact with RDM1 and
        DMS3. This shows the SDJs are needed for methylation there, but not how they take
        part, so no RdDM process term is transferred.
  - id: file:ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-bioinformatics/RESULTS-rereview.md
    title: "A0A8B8L1Z3 re-review: placement among PTHR45496 relatives"
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Reproducible re-review analysis. Covers PANTHER 19.0 subfamily membership, the
        PAINT node PTN002896004 seed set, global alignment identities to the Arabidopsis
        and Populus relatives, and the absence of the HPD motif.
  - id: file:ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-deep-research-falcon.md
    title: "Deep research report (falcon) on LOC113860185"
    reference_review:
      relevance: LOW
      correctness: MISCITED
      review_notes: >-
        Generic summary of J-domain proteins. It assumes a canonical HPD-dependent Hsp70
        cochaperone role and never identifies the SUVH-SDJ relatives. It is no longer
        used as support for the core function; kept for provenance.
