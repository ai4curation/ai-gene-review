    original_reference_id: file:ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-bioinformatics/RESULTS-rereview.md
    review:
      summary: >-
        Proposed nuclear location, inherited from PAINT node PTN002896004 and supported by
        experimental nuclear localization of the closest Arabidopsis relative EIP9/SDJ1.
      action: NEW
      reason: >-
        GOA has no annotations for A0A8B8L1Z3. Abrus is not one of the PANTHER reference
        genomes, so it cannot receive IBA rows. PAINT placed nucleus (IBD) at
        PTN002896004, a flowering-plant node whose descendants include SDJ1 (SF19), SDJ2
        (SF1), SDJ3 (SF10) and ADMETOS (SF32). A0A8B8L1Z3 is a flowering-plant SF19
        member, so it descends from this node. EIP9/SDJ1 (At5g64360) has a direct nuclear
        localization result, and the SUVH-SDJ complex works on chromatin.
      supported_by:
        - reference_id: file:ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            PAINT asserts nucleus (GO:0005634) and GO:0001228 "DNA-binding transcription activator
        - reference_id: PMID:21700722
