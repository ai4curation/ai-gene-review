suggested_questions:
  - question: >-
      The PAINT node PTN002896004 is annotated with GO:0001228 (DNA-binding transcription
      activator activity, RNA polymerase II-specific). SDJ proteins have no DNA-binding
      domain and are recruited by SUVH1 and SUVH3. Should the node term be transcription
      coactivator activity (GO:0003713) instead?
  - question: >-
      The J domain of SDJ1-type proteins has no HPD motif. Does it still bind any Hsp70?
      Or has it been repurposed to recruit transcriptional machinery?
  - question: >-
      Does the Abrus SF19 protein interact with Abrus SUVH1/SUVH3 orthologs, and does it
      localize to methylated promoters?
suggested_experiments:
  - hypothesis: >-
      A0A8B8L1Z3 activates transcription when it is recruited to DNA.
    description: >-
      Fuse A0A8B8L1Z3 to the GAL4 DNA-binding domain or a programmable zinc finger, and
      measure reporter activation in yeast and in Nicotiana benthamiana leaves. Include
      J-domain deletions as controls.
    experiment_type: reporter assay
  - hypothesis: >-
      A0A8B8L1Z3 is nuclear and forms a complex with Abrus SUVH1/SUVH3 orthologs.
    description: >-
      Co-express GFP-tagged A0A8B8L1Z3 with tagged Abrus SUVH1/SUVH3 orthologs in
      N. benthamiana. Image the proteins by confocal microscopy with a nuclear marker,
      then perform co-immunoprecipitation.
    experiment_type: fluorescence microscopy and co-immunoprecipitation
