            EMF1-EIP1, EMF1-EIP6 and
            EMF1-EIP9 heterodimers were localized in the nucleus
  - term:
      id: GO:0003713
      label: transcription coactivator activity
    evidence_type: ISS
    original_reference_id: file:ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-bioinformatics/RESULTS-rereview.md
    review:
      summary: >-
        Proposed transcription coactivator activity, by descent from the SUVH-SDJ J-domain
        proteins. These proteins activate transcription when methyl-DNA readers recruit
        them to DNA.
      action: NEW
      reason: >-
        At PTN002896004, PAINT asserts that SDJ-family proteins activate transcription,
        using GO:0001228 (DNA-binding transcription activator activity, RNA polymerase
        II-specific). This review keeps that function but uses the coactivator term instead
        of the DNA-binding transcription factor term, because the evidence points to a
        recruited coregulator. SDJ1 and SDJ2 have no DNA-binding domain. SUVH1 and SUVH3,
        which bind methylated DNA, recruit them to DNA, and activation was shown by
        tethering DNAJ1 artificially to DNA. SDJ2 already carries a direct experimental
        GO:0003713 annotation (PMID:30589221). This is a refinement of the term that PAINT
        assigned, not a function that PAINT left out. A0A8B8L1Z3 shares the subfamily of
        SDJ1/DNAJ1, the protein whose recruitment-dependent activation Harris et al.
        demonstrated. Confidence is moderate: no Abrus experiment exists.
      supported_by:
        - reference_id: PMID:30523112
          supporting_text: >-
            Ectopic
            recruitment of DNAJ1 enhanced gene transcription in plants, yeast, and mammals.
        - reference_id: PMID:30523112
          supporting_text: >-
            DNAJ1 and DNAJ2 lack any discernible methyl-binding domain, but they are robustly
            associated with SUVH1 and SUVH3
        - reference_id: PMID:30589221
          supporting_text: >-
            We
            demonstrate that the SUVH-SDJ complex components have transcriptional activation
            activity.
        - reference_id: file:ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The only Arabidopsis thaliana member of PTHR45496:SF19 is Q9FMF3 (At5g64360)
core_functions:
  - description: >-
      Predicted nuclear transcriptional coactivator of the SUVH-SDJ type. In Arabidopsis,
      the closest relative SDJ1/DNAJ1 (same PANTHER subfamily, SF19) has no DNA-binding
      domain. The methyl-DNA readers SUVH1 and SUVH3 recruit it to methylated euchromatin
      and transposon-proximal sites, where it enhances transcription of nearby genes. The
      J domain of A0A8B8L1Z3 lacks the HPD motif, so it may not act as a canonical Hsp70
      cochaperone. How these proteins activate transcription is unknown. The earlier
      core function ("protein folding chaperone" in the cytoplasm) was based only on the
      generic J-domain signature and is withdrawn.
    molecular_function:
      id: GO:0003713
      label: transcription coactivator activity
    locations:
