id: A0A8B8L1Z3
gene_symbol: A0A8B8L1Z3
taxon:
  id: NCBITaxon:3816
  label: Abrus precatorius
status: COMPLETE
description: >-
  A0A8B8L1Z3 is an uncharacterized Abrus precatorius J-domain protein in the plant-specific
  PTHR45496:SF19 subfamily, whose only Arabidopsis member is SDJ1/DNAJ1/EIP9 (At5g64360). The
  gene review predicts a nuclear SUVH-SDJ-type transcriptional coactivator by descent from
  PAINT node PTN002896004, which asserts nucleus. The single ProtNLM2 prediction,
  endoplasmic reticulum, places the protein in a compartment that this evidence contradicts
  and that no sequence feature supports.
source_documents:
  - genes/ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-uniprot.txt
  - genes/ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-goa.tsv
  - genes/ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-ai-review.yaml
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005783
      label: endoplasmic reticulum
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      summary: >-
        GOA has no annotations for this protein, so an ER term would be novel, but the
        available evidence points to the nucleus instead. A0A8B8L1Z3 is in PTHR45496:SF19 and
        is closest among Arabidopsis proteins to SDJ1/DNAJ1/EIP9 (about 46% identity over a
        similar length). PAINT asserts nucleus at node PTN002896004, which spans the SDJ1,
        SDJ2, SDJ3 and ADMETOS subfamilies. EIP9/SDJ1 heterodimers with EMF1 localize to the
        nucleus, and SDJ1/DNAJ1 is recruited to methylated DNA by the SUVH1/SUVH3 methyl
        readers, where it enhances transcription. The UniProt record shows no signal peptide
        or transmembrane segment, only an N-terminal J domain followed by disordered regions.
        The J domain lacks the HPD motif, which argues against the protein acting as an
        Hsp70 (for example BiP) cochaperone at the ER. The ER label most likely reflects the
        many ER-resident J-domain proteins rather than any feature of this subfamily. No
        literature reports ER localization for any SF19 member.
      supported_by:
        - reference_id: file:ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            PAINT asserts nucleus (GO:0005634)
        - reference_id: file:ABRPR/A0A8B8L1Z3/A0A8B8L1Z3-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The query's J domain (residues 70-135) has no His-Pro-Asp tripeptide.
        - reference_id: PMID:21700722
          supporting_text: >-
            EMF1-EIP9 heterodimers were localized in the nucleus
        - reference_id: PMID:30523112
          supporting_text: >-
            Thus, the SUVH proteins bind to methylated DNA and recruit the DNAJ proteins to
            enhance proximal gene expression
