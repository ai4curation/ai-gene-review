id: A0A8B8L1Z3
gene_symbol: A0A8B8L1Z3
taxon:
  id: NCBITaxon:3816
  label: Abrus precatorius
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for an uncharacterised J-domain (Hsp40) protein from
  Abrus precatorius. This is the benchmark's clearest low-confidence case and is useful
  mainly for score calibration: the top GO hit scores 9.77 and the fifth 8.73, against a
  benchmark median top-1 score of about 15, and every hit is unrelated to the DnaJ domain
  the protein actually carries - zinc chaperone activity, amyloplast organization,
  junctional membrane complex. The free-text Function channel is equally uninformative
  ("plays a continuous role in plant development probably in the structural organization
  of compartments"). The protein has extensive intrinsically disordered regions, which is
  the likely reason the embedding does not sit near any well-annotated family. The
  practical lesson is that ProTrek's score is informative here: a top-1 score below about
  10 flags output that should not be used, whereas the same list read without scores
  looks like five confident annotations.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
