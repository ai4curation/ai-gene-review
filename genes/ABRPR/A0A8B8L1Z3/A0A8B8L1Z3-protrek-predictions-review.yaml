      summary: >-
        Top-ranked hit (score 9.77, the lowest top-1 score of the 50 proteins). Zinc
        chaperone activity is metallochaperone insertion of Zn2+ into apo-enzymes, a
        completely different mechanism from the Hsp40/Hsp70 co-chaperone cycle this protein's
