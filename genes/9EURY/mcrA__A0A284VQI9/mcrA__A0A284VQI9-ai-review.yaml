  review:
    summary: Combined automated annotation (ARBA, InterPro, Rhea/EC) for the MCR alpha-subunit
      activity. GO:0050524 is defined by the reaction coenzyme B + methyl-coenzyme
      M = CoM-S-S-CoB + methane, written as reversible.
    action: ACCEPT
    reason: The reaction is the same in methanotrophs, run in the methane-consuming
      direction, and purified methanogenic MCR catalyzes that direction with kinetics
      matching in vivo methane oxidation. Native MCRs purified from two ANME-2d enrichments
      have active sites like those of methanogenic Methanosarcinales MCR, and the
      ANME-1 MCR structure contains the same two substrates. This sequence keeps the
      F430 ligand and every coenzyme M and coenzyme B contact. The UniProt record states
      the physiological direction as left-to-right (methane-forming), which is wrong
      for this organism but does not affect the GO term.
    supported_by:
    - reference_id: PMID:20520712
      supporting_text: Here we report that purified MCR from Methanothermobacter marburgensis
        converts methane into methyl-coenzyme M under equilibrium conditions with apparent
        V(max) (maximum rate) and K(m) (Michaelis constant) values consistent with
        the observed in vivo kinetics of the anaerobic oxidation of methane with sulphate.
    - reference_id: PMID:40913044
      supporting_text: Despite their physiological differences, these ANMEs have extremely
        conserved MCR structures, similar to homologs from methanogenic Methanosarcinales,
        rather than the phylogenetically distant MCR of ANME-1 isolated from Black Sea
        mats.
    - reference_id: PMID:22121022
      supporting_text: The structure revealed ANME-1 MCR in complex with coenzyme M
        and coenzyme B, indicating the same substrates for MCR from methanotrophic and
        methanogenic archaea.
    - reference_id: file:projects/ARCHAEA/mcrA-across-clades/RESULTS.md
      supporting_text: The ANME-2d McrA (A0A284VQI9, *Ca.* Methanoperedens) keeps the
        F430 axial glutamine, all coenzyme B and coenzyme M contacts and the residue
        at every modification site
