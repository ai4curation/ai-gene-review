  review:
    summary: InterPro2GO mapping from the MCR alpha-subunit family and domain signatures,
      all of which map to methanogenesis. This organism is an anaerobic methanotroph,
      not a methanogen.
    action: MODIFY
    reason: MCR participates in this organism's energy metabolism, but in the opposite
      direction. ANME-2d oxidizes methane through reverse methanogenesis with nitrate
      as electron acceptor, so MCR here activates methane rather than forming it.
      GO:0015948 is restricted by its comment to energy-conserving methane formation,
      and GO has no anaerobic methane oxidation term, so the correct existing term
      is GO:0046188 methane catabolic process. This is a lateral (direction) correction,
      not a refinement. The InterPro2GO mapping is correct for methanogens, but no
      sequence signature separates ANME-2 MCRs from Methanosarcinales MCRs, so the
      error can only be fixed with a taxon condition (see source_defects).
    proposed_replacement_terms:
    - id: GO:0046188
      label: methane catabolic process
    supported_by:
    - reference_id: PMID:23892779
      supporting_text: Metagenomic, single-cell genomic and metatranscriptomic analyses
        combined with bioreactor performance and (13)C- and (15)N-labelling experiments
        show that ANME-2d is capable of independent AOM through reverse methanogenesis
        using nitrate as the terminal electron acceptor.
    - reference_id: PMID:40913044
      supporting_text: They oxidise methane in anoxic niches by transferring electrons
        to nitrate, metal oxides, or sulfate-reducing bacteria.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR016212
      requested_change: CHECK
      asserted_value: GO:0015948
      corrected_value: GO:0046188
      corrected_label: methane catabolic process
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: The InterPro2GO mappings of IPR016212 and of the MCR alpha domain
        entries (IPR003183, IPR008924, IPR009024, IPR009047, IPR015811, IPR015823)
        to GO:0015948 methanogenesis are correct for methanogens but are also applied
        to the MCRs of anaerobic methanotrophs (ANME-1, ANME-2a/b/c, ANME-2d), which
        oxidize methane by reverse methanogenesis and do not make methane. ANME-2 MCRs
        are close relatives of Methanosarcinales MCRs, so no signature separates them;
        the fix needs a taxon exclusion (Ca. Methanoperedentaceae, Ca. Methanophagales
        and the marine ANME-2 lineages) or removal of the process term from the domain-level
        entries. The activity mapping (GO:0050524) is not affected, because its reaction
        is reversible.
      supported_by:
