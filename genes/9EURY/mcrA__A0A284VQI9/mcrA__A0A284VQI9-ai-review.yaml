proposed_new_terms:
- proposed_name: coenzyme F430 binding
  proposed_definition: Binding to coenzyme F430, a nickel-containing tetrapyrrole
    (hydrocorphinoid) cofactor of methyl-coenzyme M reductase and related alkyl-coenzyme
    M reductases, or to a modified form of it.
  justification: Every MCR and alkyl-coenzyme M reductase alpha subunit binds F430
    (or a modified F430) through an axial ligand to its nickel, a glutamine in methanogenic
    and methanotrophic MCRs and a methionine in the ethane-specific enzyme of Ca.
    Ethanoperedens. GO has heme, chlorophyll and cobalamin binding under tetrapyrrole
    binding but no F430 term, so keyword mappings fall back to metal ion binding.
  proposed_parent:
    id: GO:0046906
    label: tetrapyrrole binding
  supported_by:
  - reference_id: PMID:40913044
    supporting_text: MCR quaternary structure consists of a dimer of heterotrimers
      (αβγ)2 harbouring the cofactor F430 in each active site
suggested_questions:
- question: Should GO add an anaerobic oxidation of methane (reverse methanogenesis)
    term under GO:0046188 methane catabolic process, so that ANME MCRs, Mtr and the
    other reverse-pathway enzymes can be distinguished from aerobic methane oxidation
    by methane monooxygenase?
- question: GO:0044674 methyl coenzyme M reductase complex is defined as involved
    in methane formation. Should the definition be made direction-neutral so that
    it covers the identical complex in anaerobic methanotrophs?
suggested_experiments:
- experiment_type: Native purification and reverse-reaction assay
  hypothesis: ANME-2d MCR has a higher rate of methane activation relative to methane
    formation than methanogenic Methanosarcinales MCR, and the Met347 substitution
    contributes to this.
  description: Purify MCR from a Ca. M. nitratireducens enrichment and measure methyl-coenzyme
    M formation from 13CH4 and CoM-S-S-CoB alongside methane formation, comparing
    with M. acetivorans MCR; express an M. acetivorans McrA carrying the corresponding
    Gln-to-Met change and test both directions.
