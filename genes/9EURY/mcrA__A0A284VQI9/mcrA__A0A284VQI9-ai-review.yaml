- term:
    id: GO:0050524
    label: coenzyme-B sulfoethylthiotransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00098318
  - InterPro:IPR003183
  - InterPro:IPR008924
  - InterPro:IPR009024
