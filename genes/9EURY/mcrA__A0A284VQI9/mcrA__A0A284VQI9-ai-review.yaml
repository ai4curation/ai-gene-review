id: A0A284VQI9
gene_symbol: mcrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1392998
  label: Candidatus Methanoperedens nitratireducens
description: mcrA (MNV_40019) encodes the alpha subunit of methyl-coenzyme M reductase
  (MCR) in Candidatus Methanoperedens nitratireducens (also published as Ca. M. nitroreducens),
  an uncultured freshwater anaerobic methanotroph of the ANME-2d clade (Ca. Methanoperedentaceae,
  order Methanosarcinales). This organism oxidizes methane to CO2 by running the methanogenesis
  pathway in reverse, with nitrate as terminal electron acceptor, and does not make
  methane. In this reverse pathway MCR is the methane-activating enzyme. It catalyzes
  the reverse of the methanogenic MCR reaction, converting methane and the CoM-S-S-CoB
  heterodisulfide to methyl-coenzyme M and coenzyme B, a reaction purified methanogenic
  MCR can also run. Native MCR purified from two ANME-2d enrichments, one a close
  relative of this strain (about 90% identical in McrA), has the same alpha2beta2gamma2
  architecture, F430 cofactor and active site as MCR from methanogenic Methanosarcinales.
  It is therefore expected to use the same radical mechanism. The sequence keeps the
  F430 axial glutamine and all coenzyme M and coenzyme B contacts of the Methanothermobacter
  enzyme, and carries Met347 at a glutamine position next to the coenzyme M-coordinating
  tyrosine that the ANME-2d structures identify as clade-specific. The protein in
  this entry has not itself been purified; the sequence comes from an unassembled
  whole-genome shotgun proteome.
