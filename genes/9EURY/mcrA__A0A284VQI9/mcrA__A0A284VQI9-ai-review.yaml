- id: PMID:23892779
  title: Anaerobic oxidation of methane coupled to nitrate reduction in a novel archaeal
    lineage.
  findings:
  - statement: An ANME-2d population (Ca. Methanoperedens nitroreducens) performs
      nitrate-driven anaerobic oxidation of methane independently, through reverse
      methanogenesis.
    supporting_text: ANME-2d is capable of independent AOM through reverse methanogenesis
      using nitrate as the terminal electron acceptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Nature 2013); abstract-only in cache. Describes
      the species to which NCBITaxon:1392998 belongs (UniProt lists the Haroon et al.
      2013 names as synonyms of this taxon). Establishes the physiology that the process
      term must reflect.
- id: PMID:40913044
  title: Atomic resolution structures of the methane-activating enzyme in anaerobic
    methanotrophy reveal extensive post-translational modifications.
  findings:
  - statement: Native MCRs from two ANME-2d enrichments (Ca. Methanoperedens sp. BLZ2
      and Ca. Methanoperedens Vercelli strain 134) and from marine ANME-2c resemble
      methanogenic Methanosarcinales MCRs and should follow the same radical mechanism.
    supporting_text: Based on our data, the methanotrophic MCRs should follow the
      same radical reaction mechanism proposed for the methane-generating homologues.
  - statement: In both ANME-2d MCRs a glutamine next to the coenzyme M-coordinating
      tyrosine is replaced by methionine.
    supporting_text: In both ANME-2d, a canonical glutamine (position α341 in ANME-2c),
      proposed to be important to anchor the F430, and juxtaposed to the tyrosine
      coordinating the CoM thiol (position α342 in ANME-2c), is substituted by a methionine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (Nat Commun 2025). Structures are of same-genus
      orthologs, not of this entry; the BLZ2 McrA (RefSeq WP_097300250.1) is 89.7%
      identical to A0A284VQI9 over aligned positions (projects/ARCHAEA/mcrA-across-clades/compare_anme2d_strains.py).
