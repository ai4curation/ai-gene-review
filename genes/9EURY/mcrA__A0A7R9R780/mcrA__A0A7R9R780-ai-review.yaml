  review:
    summary: The 0.99 A structure of native ECR contains a dimethylated F430 in each
      active site, with Met181 of the alpha subunit (in place of the canonical glutamine)
      as the lower axial ligand to its nickel.
    action: NEW
    reason: GO has no coenzyme F430 binding term; GO:0046906 tetrapyrrole binding is
      the closest existing term, and a specific child is proposed under proposed_new_terms.
      Dimethylated F430 is still a nickel tetrapyrrole, so the proposed term is defined
      to include modified F430. The alpha subunit provides the nickel ligand, so binding
      is a property of this subunit. Added for consistency across the MCR alpha-subunit
      reviews; non-core relative to the catalytic activity.
    supported_by:
