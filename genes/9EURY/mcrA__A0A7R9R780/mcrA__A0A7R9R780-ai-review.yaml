core_functions:
- description: Ethane-activating alpha subunit of ethyl-coenzyme M reductase, a divergent,
    F430-dependent homolog of methyl-coenzyme M reductase that forms ethyl-coenzyme
    M from ethane in the first step of anaerobic ethane oxidation. A methionine replaces
    the canonical glutamine as the F430 nickel ligand, and a widened chamber with
    a hydrophobic tunnel accommodates the two-carbon substrate.
  proposed_molecular_function: ethyl-coenzyme M reductase activity
  directly_involved_in:
  - id: GO:0043448
    label: alkane catabolic process
  supported_by:
  - reference_id: PMID:32317322
    supporting_text: Combined substrate and metabolite analysis showed ethane as the
      sole growth substrate and production of ethyl-coenzyme M as the activation product.
  - reference_id: PMID:34210888
    supporting_text: The widened catalytic chamber, harboring a dimethylated nickel-containing
      F430 cofactor, would adapt the chemistry of methyl-coenzyme M reductases for
      a two-carbon substrate.
proposed_new_terms:
- proposed_name: ethyl-coenzyme M reductase activity
  proposed_definition: 'Catalysis of the reaction: coenzyme B + ethyl-coenzyme M
    = coenzyme M-coenzyme B heterodisulfide + ethane. In anaerobic ethane-oxidizing
    archaea the reaction runs in the direction of ethyl-coenzyme M formation.'
  justification: Ethane-oxidizing archaea activate ethane with a dedicated, divergent
    alkyl-coenzyme M reductase whose active site is adapted to the two-carbon substrate.
    GO:0050524 is defined by the methyl-coenzyme M reaction, and neither GO nor Rhea
    has a term for the ethyl reaction (Rhea searched 2026-11-13), so these enzymes
    can only be annotated with the methyl term or the uninformative parent.
  proposed_parent:
    id: GO:0050497
    label: alkylthioltransferase activity
  supported_by:
  - reference_id: PMID:32317322
    supporting_text: Combined substrate and metabolite analysis showed ethane as the
      sole growth substrate and production of ethyl-coenzyme M as the activation product.
  - reference_id: PMID:34210888
    supporting_text: would adapt the chemistry of methyl-coenzyme M reductases for
      a two-carbon substrate.
- proposed_name: coenzyme F430 binding
  proposed_definition: Binding to coenzyme F430, a nickel-containing tetrapyrrole
    (hydrocorphinoid) cofactor of methyl-coenzyme M reductase and related alkyl-coenzyme
    M reductases, or to a modified form of it.
  justification: Every MCR and alkyl-coenzyme M reductase alpha subunit binds F430
    (or a modified F430) through an axial ligand to its nickel, a glutamine in methanogenic
    and methanotrophic MCRs and a methionine in the ethane-specific enzyme of Ca.
    Ethanoperedens. GO has heme, chlorophyll and cobalamin binding under tetrapyrrole
    binding but no F430 term, so keyword mappings fall back to metal ion binding.
  proposed_parent:
    id: GO:0046906
    label: tetrapyrrole binding
  supported_by:
  - reference_id: PMID:34210888
    supporting_text: A sulfur from methionine replaces the oxygen from a canonical
      glutamine as the nickel lower-axial ligand
suggested_questions:
- question: Does ECR reduce methyl-coenzyme M at all, and if so, how does its rate
    and substrate preference compare with methyl-coenzyme M reductase? This decides
    whether a methyl-specific annotation is ever appropriate for ECRs.
- question: Should GO add an ethane catabolic process term (under GO:0043448 alkane
    catabolic process), and a generalized alkyl-coenzyme M reductase complex, so that
    ECR and the butane and propane enzymes of Ca. Syntrophoarchaeum can be annotated
    without methanogenesis-specific terms?
suggested_experiments:
- experiment_type: Enzyme assay with purified native enzyme
  hypothesis: ECR catalyzes ethyl-coenzyme M formation from ethane and CoM-S-S-CoB,
    and its reverse, and has little or no activity with methyl-coenzyme M or methane.
  description: Activate ECR purified from the Ethane50 culture to the Ni(I) state
    and measure ethane formation from ethyl-coenzyme M plus coenzyme B, and ethyl-coenzyme
    M formation from 13C-ethane plus heterodisulfide, alongside the same assays with
    methyl-coenzyme M and methane.
