taxon:
  id: NCBITaxon:2691038
  label: Candidatus Methanoperedentaceae archaeon GB50
description: This entry (gene FHEFKHOI_01412) is the alpha subunit of ethyl-coenzyme
  M reductase (ECR) of Candidatus Ethanoperedens thermophilum, which UniProt lists
  as Candidatus Methanoperedentaceae archaeon GB50. Ca. Ethanoperedens is an uncultured,
  thermophilic archaeon of the GoM-Arc1 clade that oxidizes ethane in syntrophy with
  a sulfate-reducing partner bacterium. ECR is a divergent homolog of methyl-coenzyme
  M reductase and the only MCR-type enzyme the genome encodes. It activates ethane
  by forming ethyl-coenzyme M, presumably from ethane and the CoM-S-S-CoB heterodisulfide,
  the reverse of an alkyl-coenzyme M reduction. Ethane is the organism's sole growth
  substrate and ethyl-coenzyme M the activation product, and isotope labelling shows
  the pathway is reversible. The 0.99 A crystal structure of native ECR purified from
  the enrichment culture shows an alpha2beta2gamma2 enzyme with a widened catalytic
  chamber holding a dimethylated F430. Methionine (Met181 in this sequence), not the
  canonical glutamine, is the lower axial ligand to the F430 nickel, and a 33 A hydrophobic
  tunnel leads ethane to the buried active site. The alpha subunit shares only 48%
  identity with Methanothermobacter MCR I and differs from it at several coenzyme
  B and coenzyme M contact positions.
