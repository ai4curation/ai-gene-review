id: Q9KWG3
gene_symbol: Q9KWG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:93372
  label: Streptomyces sp. CL190
description: >-
  Q9KWG3 is the phosphomevalonate kinase (PMK) of Streptomyces sp. strain CL190, encoded by
  the open reading frame orfC of a six-gene mevalonate pathway cluster that also encodes
  mevalonate kinase, diphosphomevalonate decarboxylase, a type 2 isopentenyl diphosphate
  isomerase, HMG-CoA reductase and HMG-CoA synthase. It is a 374-residue GHMP-family kinase
  of the bacterial (Gram-positive-type) PMK group, related to the ERG8-type enzymes of fungi
  and plants, and catalyses the ATP-dependent phosphorylation of (R)-mevalonate 5-phosphate to
  (R)-mevalonate 5-diphosphate (EC 2.7.4.2), the second phosphorylation of the classical
  mevalonate pathway to isopentenyl diphosphate. Expressing the whole cluster in Escherichia
  coli installs a working mevalonate pathway that lets the cells grow when their native
  methylerythritol phosphate pathway is blocked by fosmidomycin. Strain CL190 has both
  isoprenoid pathways, and in actinomycetes of this kind the mevalonate cluster supplies
  precursors for isoprenoid secondary metabolites.
existing_annotations:
- term:
    id: GO:0004631
    label: phosphomevalonate kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:16341
  - EC:2.7.4.2
  review:
    summary: >-
      Electronic assignment from the curated UniProt catalytic activity (RHEA:16341, EC 2.7.4.2).
      The protein is the orfC product of the CL190 mevalonate cluster, classified in the GHMP
      phosphomevalonate kinase families TIGR01220 and PTHR31814:SF2.
    action: ACCEPT
    reason: >-
      Three lines agree. (1) Classification: the protein matches the Gram-positive-type PMK
      family TIGR01220 and PANTHER PTHR31814:SF2, whose characterised members (yeast ERG8,
      Arabidopsis PMK, Saccharolobus SSO2988) are PMKs. (2) Genetics: the cluster that contains
      it reconstitutes a working mevalonate pathway in E. coli, which requires a PMK, and orfC is
      the only PMK candidate in the cluster (PMID:10894721). (3) UniProt records the activity
      with experimental evidence from PMID:23378249; that paper's cached abstract describes only
      the Sulfolobus enzymes, so the Streptomyces assay could not be checked here and is
      accepted on curator deference.
    supported_by:
    - reference_id: PMID:10894721
      supporting_text: This transformant could grow in the presence of fosmidomycin, a potent and
        specific inhibitor of the nonmevalonate pathway, indicating that the mevalonate pathway,
        intrinsically absent in E. coli, is operating in the E. coli transformant.
    - reference_id: file:STRC1/Q9KWG3/Q9KWG3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the phosphorylation of (R)-mevalonate 5-phosphate (MVAP) to (R)-mevalonate
        5-diphosphate (MVAPP).
    - reference_id: file:STRC1/Q9KWG3/Q9KWG3-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: TIGR01220; Pmev_kin_Gr_pos
