    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006204
  review:
    summary: >-
      InterPro2GO from the GHMP kinase N-terminal domain (IPR006204), which carries the
      ATP-binding glycine-rich loop. ATP is the phosphoryl donor of the PMK reaction.
    action: ACCEPT
    reason: >-
      Correct: the curated reaction uses ATP as co-substrate, and the GHMP N-domain signature
      supports nucleotide binding. The activity term GO:0004631 is the core function; ATP binding
      accurately describes the co-substrate interaction.
    supported_by:
