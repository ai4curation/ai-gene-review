- term:
    id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00057
  review:
    summary: >-
      UniPathway mapping (UPA00057, step 2/3 of IPP formation from mevalonate). The curated
      PATHWAY line cites the cluster paper, which showed that the cluster supports IPP synthesis
      via mevalonate in E. coli.
    action: ACCEPT
    reason: >-
      The enzyme performs a step of the pathway itself (phosphorylation of mevalonate
      5-phosphate). [1-13C]acetate feeding showed that E. coli carrying the cluster made
      isoprenoids through the mevalonate pathway, and fosmidomycin-resistant growth showed that
      the cluster supplies IPP (PMID:10894721).
    supported_by:
    - reference_id: PMID:10894721
      supporting_text: Feeding experiments with [1-(13)C]acetate demonstrated that Escherichia coli
        JM109 harboring the hmgr gene and these open reading frames used the mevalonate pathway under
        induction with isopropyl beta-D-thiogalactopyranoside.
    - reference_id: PMID:10894721
      supporting_text: The hmgr gene and orfABCDE are thus unambiguously shown to be responsible for
        the mevalonate pathway and to form a gene cluster in the genome of Streptomyces sp. strain
        CL190.
    - reference_id: file:STRC1/Q9KWG3/Q9KWG3-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'isopentenyl diphosphate from (R)-mevalonate: step 2/3. {ECO:0000269|PubMed:10894721}.'
