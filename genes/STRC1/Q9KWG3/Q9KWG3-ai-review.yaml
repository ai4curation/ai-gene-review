suggested_questions:
- question: >-
    Which assay established the PMK activity of the CL190 enzyme that UniProt attributes to
    PMID:23378249, and what are its kinetic constants?
- question: >-
    In strain CL190, which isoprenoid products depend on the mevalonate cluster rather than on
    the MEP pathway, and when during growth is the cluster expressed?
suggested_experiments:
- hypothesis: >-
    The orfC product alone carries the PMK step of the CL190 cluster.
  description: >-
    Express and purify recombinant orfC protein and measure ATP-dependent conversion of
    (R)-mevalonate 5-phosphate to mevalonate 5-diphosphate by coupled ADP assay and LC-MS; in
    parallel, delete orfC from the cluster plasmid and test whether E. coli still grows on
    fosmidomycin with mevalonate.
  experiment_type: biochemical assay and genetic complementation
