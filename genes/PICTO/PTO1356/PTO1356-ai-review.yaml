proposed_new_terms:
- proposed_name: mevalonate 3-kinase activity
  proposed_definition: >-
    Catalysis of the reaction: (R)-mevalonate + ATP = (R)-3-phosphomevalonate + ADP + H+.
  justification: >-
    EC 2.7.1.185 and RHEA:42884 describe the reaction, and two orthologous archaeal enzymes have
    been shown to catalyse it with product identification by 13C NMR: Picrophilus torridus
    PTO1356 (PMID:25636853) and Thermoplasma acidophilum Ta1305 (PMID:24914732). GO has no term:
    GO:0004496 mevalonate kinase activity phosphorylates C5 to (R)-5-phosphomevalonate, a
    different reaction, and the M3K orthologs are therefore annotated only to the parent
    GO:0016773. The term is needed to annotate the first step of the Thermoplasma-type
    mevalonate pathway.
  proposed_parent:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:42884
      label: (R)-mevalonate + ATP = (R)-3-phosphomevalonate + ADP + H(+)
  - predicate: skos:exactMatch
    target_term:
      id: EC:2.7.1.185
      label: mevalonate 3-kinase
  supported_by:
  - reference_id: PMID:25636853
    supporting_text: >-
      We discovered that it is not a decarboxylase per se but an ATP-dependent enzyme,
      mevalonate-3-kinase (M3K), which catalyzes the phosphorylation of MVA to
      mevalonate-3-phosphate.
    reference_section_type: ABSTRACT
  - reference_id: PMID:24914732
    supporting_text: >-
      The product of Ta1305 activity, however, showed splitting at carbons 2–4 and 6, which is
      consistent with phosphorylation at the 3-OH position (Figure 3C).
suggested_questions:
- question: >-
    Does the P. torridus homolog of T. acidophilum Ta0762 phosphorylate mevalonate 3-phosphate at
    C5, so that the full Thermoplasma-type pathway (PTO1356, the M3P5K homolog, PTO0478 MBD and
    isopentenyl phosphate kinase) operates in this organism?
- question: >-
    Is the slow phosphorylation of 3-hydroxyisovalerate and 3-hydroxybutyrate by PTO1356 of any
    physiological relevance in Picrophilus, or only a feature exploited for isobutene production?
suggested_experiments:
- hypothesis: >-
    Mevalonate 3-phosphate and mevalonate 3,5-bisphosphate, not mevalonate 5-phosphate, are the
    in vivo intermediates of isoprenoid synthesis in P. torridus.
  description: >-
    Feed P. torridus cultures or cell-free extracts with 13C-labelled (R)-mevalonate and follow the
    phosphorylated intermediates by LC-MS and 31P/13C NMR; in parallel assay the recombinant
    M3P5K homolog with mevalonate 3-phosphate.
  experiment_type: metabolic labelling and recombinant enzyme assay
knowledge_gaps:
- gap_statement: >-
    Whether the Thermoplasma-type pathway initiated by PTO1356 is the route actually used for
    isoprenoid synthesis in P. torridus cells has not been tested; the pathway is inferred from the
    activities of PTO1356 and the PTO0478 decarboxylase and from a homolog of the mevalonate
    3-phosphate 5-kinase.
  boundary: >-
    PTO1356 is a mevalonate 3-kinase in vitro (PMID:25636853), and the P. torridus mevalonate
    3,5-bisphosphate decarboxylase is active (PMID:28004831).
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - reference_id: PMID:25636853
    supporting_text: >-
      P. torridus is also likely to contain this new type of MVA pathway (Fig. 7).
