  review:
    summary: >-
      Proposed new annotation. Purified recombinant PTO1356 transfers phosphate from ATP to the
      3-hydroxyl of (R)-mevalonate; 13C NMR of the product showed phosphorus coupling at
      carbons 2 to 4 and 6, which fixes the phosphate on C3.
    action: NEW
    reason: >-
      The activity is mevalonate 3-kinase (EC 2.7.1.185, RHEA:42884), for which GO has no term
      (searched OLS, QuickGO and the GO ec2go file, release 2026-07-26: no mapping for
      EC 2.7.1.185). It is not GO:0004496 mevalonate kinase activity, which is defined as
      phosphorylation at C5 to (R)-5-phosphomevalonate, and it is not a decarboxylase activity:
      no isoprenol was formed and no activity was detected on mevalonate 5-phosphate or
      5-diphosphate. GO:0016773 is the most specific existing term that is true. It follows the
      convention already applied to the T. acidophilum ortholog Ta1305 (Q9HIN1), which UniProt
      annotated to GO:0016773 by IDA from PMID:24914732. A specific child term,
      mevalonate 3-kinase activity, is proposed in proposed_new_terms; when GO creates it, this
      row should move to it.
    supported_by:
