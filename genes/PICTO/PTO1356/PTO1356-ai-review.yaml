      supporting_text: >-
        We discovered that it is not a decarboxylase per se but an ATP-dependent enzyme,
        mevalonate-3-kinase (M3K), which catalyzes the phosphorylation of MVA to
        mevalonate-3-phosphate.
      reference_section_type: ABSTRACT
    - reference_id: PMID:25636853
