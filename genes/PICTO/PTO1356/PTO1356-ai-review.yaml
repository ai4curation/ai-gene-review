id: Q6KZB1
gene_symbol: PTO1356
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1122961
  label: Picrophilus oshimae DSM 9789
description: >-
  PTO1356 (UniProt Q6KZB1) of the extreme acidophile Picrophilus torridus encodes mevalonate
  3-kinase (M3K), a 324-residue GHMP-superfamily protein of the diphosphomevalonate decarboxylase
  family that was originally annotated as a mevalonate diphosphate decarboxylase. The purified
  enzyme transfers the gamma-phosphate of ATP to the tertiary 3-hydroxyl of (R)-mevalonate,
  forming (R)-mevalonate 3-phosphate and ADP. It does not decarboxylate the product and is
  inactive on mevalonate 5-phosphate and mevalonate 5-diphosphate, the substrates of the related
  phosphomevalonate and diphosphomevalonate decarboxylases. Its kinetic constants with mevalonate
  (Km 131 uM, kcat 1.9 per second; Km for ATP 23 uM) are of the same order as those of yeast
  diphosphomevalonate decarboxylase with its own substrate. The enzyme is the first step of the
  Thermoplasma-type mevalonate pathway found in the Thermoplasmatales, in which mevalonate
  3-phosphate is phosphorylated at C5 to mevalonate 3,5-bisphosphate, decarboxylated without ATP
  to isopentenyl phosphate by a separate decarboxylase (PTO0478 in P. torridus), and then
  phosphorylated to isopentenyl diphosphate. Its closest characterised homolog is the
  T. acidophilum mevalonate 3-kinase Ta1305. The enzyme also slowly phosphorylates
  3-hydroxyisovalerate; the 3-phospho product decarboxylates spontaneously to isobutene, which
  has made the enzyme of interest for biological isobutene production.
