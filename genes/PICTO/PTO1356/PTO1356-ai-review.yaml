    summary: >-
      UniPathway mapping (UPA00057, isopentenyl diphosphate biosynthesis via mevalonate). PTO1356
      phosphorylates mevalonate at C3, the entry step of the Thermoplasma-type route from
      mevalonate to isopentenyl diphosphate.
    action: ACCEPT
    reason: >-
      GO:0019287 is defined as isopentenyl diphosphate formation via the intermediate mevalonate,
      so it covers the Thermoplasma-type variant as well as the classical route. The protein
      catalyses a step of that process: it converts (R)-mevalonate to (R)-mevalonate 3-phosphate
      (PMID:25636853). Two further enzymes of the same route are characterised in P. torridus or
      its close relative: the P. torridus mevalonate 3,5-bisphosphate decarboxylase PTO0478 is
      active (PMID:28004831), and T. acidophilum Ta0762 phosphorylates mevalonate 3-phosphate at
      C5 (PMID:24914732). The comparator T. acidophilum M3K Ta1305 (Q9HIN1) carries this term by
      IDA. Core process.
