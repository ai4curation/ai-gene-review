references:
- id: GO_REF:0000041
  title: Gene Ontology annotation based on UniPathway vocabulary mapping
  findings: []
- id: PMID:25636853
  title: The Putative mevalonate diphosphate decarboxylase from Picrophilus torridus is in reality
    a mevalonate-3-kinase with high potential for bioproduction of isobutene.
  findings:
  - statement: >-
      Purified PTO1356 is an ATP-dependent mevalonate 3-kinase, not a decarboxylase; its kinetic
      constants with mevalonate are comparable to those of yeast MVD with mevalonate
      5-diphosphate.
    supporting_text: >-
      The magnitude of the kinetic constants and activities of putPtMVD with MVA were similar to
      those of ScMVD with MVAPP, consistent with the hypothesis that MVA is the natural substrate
      of putPtMVD, as MVAPP is for ScMVD.
  - statement: >-
      Isobutene formation from 3-hydroxyisovalerate is a side reaction: the enzyme phosphorylates
      C3 and the unstable 3-phospho product decarboxylates without enzyme catalysis.
    supporting_text: >-
      The enzyme's potential in isobutene formation is due to the conversion of 3-HIV to an
      unstable 3-phosphate intermediate that undergoes consequent spontaneous decarboxylation to
      form isobutene.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary and only biochemical characterisation of PTO1356 (GenBank AAT43941, locus tag stated
      in the paper). Full text cached. Product identity established by ESI-MS and 13C NMR;
      substrate range tested against MVAPP, MVA-5P and MVA. The pathway claim for P. torridus is
      stated as an inference ("likely"), based on the M3K activity and a homolog of M3P5K.
