id: A0A2R9CAF4
gene_symbol: A0A2R9CAF4
taxon:
  id: NCBITaxon:9597
  label: Pan paniscus
status: COMPLETE
description: >-
  A0A2R9CAF4 is the bonobo SLC26A11 (KBAT) product, a one-to-one ortholog of human SLC26A11 (99.2% identity).
  Human SLC26A11 is a lysosomal proton/sulfate:chloride transporter that also conducts chloride in a
  channel-like state. Both ProtNLM2 terms are correct but less precise than supported annotations the gene
  already carries (chloride channel activity; lysosomal membrane).
