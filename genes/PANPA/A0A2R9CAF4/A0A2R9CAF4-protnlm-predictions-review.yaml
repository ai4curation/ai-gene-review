  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0008509
      label: monoatomic anion transmembrane transporter activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        The target has the SLC26/SulP transport domain, multiple transmembrane segments, and a STAS domain.
        Experimental characterization of SLC26A11 supports chloride conduction as well as sulfate transport
        (PMID:42509233), providing family-level grounding for anion transport. The cached target annotations
        include the more specific chloride channel activity. The generic anion-transporter prediction
        is therefore supported but less precise.
      supported_by:
        - reference_id: file:PANPA/A0A2R9CAF4/A0A2R9CAF4-uniprot.txt
        - reference_id: PMID:42509233
          supporting_text: >-
            both a sulfate transporter and a chloride channel
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0016020
      label: membrane
    predicted_term_type: GO_CC
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Multiple transmembrane segments in the target provide direct sequence-architecture support for
        membrane residence. This agrees with the membrane transport behavior characterized for SLC26A11
        (PMID:42509233). The cached annotations identify specific membranes, including lysosomal and plasma
        membranes. Membrane is a valid but less precise localization and is not an error merely because
        it is broad.
      supported_by:
        - reference_id: file:PANPA/A0A2R9CAF4/A0A2R9CAF4-uniprot.txt
        - reference_id: PMID:42509233
