      summary: >-
        The target has multiple predicted transmembrane segments, so membrane residence is supported by
        sequence architecture. Human SLC26A11, its one-to-one ortholog, localizes to lysosomes in mammalian
        cell lines (PMID:42509233), and the gene already carries the supported lysosomal membrane term
