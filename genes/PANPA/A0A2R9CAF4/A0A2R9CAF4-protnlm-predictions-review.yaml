predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0008509
      label: monoatomic anion transmembrane transporter activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        The target is the full-length bonobo ortholog of human SLC26A11 (99.2% identical, no gaps), with
        the SLC26/SulP transmembrane domain and a C-terminal STAS domain. SLC26A11 conducts chloride: the
        human protein shows an uncoupled, channel-like chloride conductance (PMID:42509233), and mouse
        KBAT functions as a constitutively active chloride channel (PMID:23733100). Chloride conduction
        supports monoatomic anion transmembrane transporter activity; sulfate, the other substrate, is
        polyatomic and does not. The gene already carries the more specific supported descendant chloride
        channel activity (GO:0005254), so the prediction is correct but less precise.
      supported_by:
