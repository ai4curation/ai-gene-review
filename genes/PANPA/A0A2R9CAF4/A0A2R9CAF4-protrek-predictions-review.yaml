id: A0A2R9CAF4
gene_symbol: SLC26A11
taxon:
  id: NCBITaxon:9597
  label: Pan paniscus
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for the bonobo ortholog of SLC26A11, a SLC26/SulP
  family sulfate transporter and chloride channel. This is ProTrek's cleanest result in
  the benchmark: the top hit is secondary active sulfate transmembrane transporter
  activity, an exact match to GOA and to this review's primary core function, and ranks
  2, 3 and 5 stay inside the sulfate-transport neighbourhood. The single miss (oxalate
  transporter activity at rank 4) is a real SLC26-family activity assigned to the wrong
  paralog. The retrieval names the transported substrate, which the InterPro/ARBA
  pipeline and ProtNLM2 both left at the level of "anion". ProTrek does not recover the
  chloride-channel mode that this review treats as the protein's second core function.
  Assessment: 1 correct not novel (CNN), 1 correct novel (COR), 1 incorrect (PLI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/PANPA/A0A2R9CAF4/A0A2R9CAF4-uniprot.txt
  - genes/PANPA/A0A2R9CAF4/A0A2R9CAF4-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0008271
      label: secondary active sulfate transmembrane transporter activity
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 17.71, the highest top-1 score in the benchmark). Exact match
        to the existing InterPro2GO annotation and to this review's first core function -
        electroneutral proton-coupled sulfate exchange across the lysosomal membrane.
        Correct and specific, but already annotated.
      supported_by:
        - reference_id: file:PANPA/A0A2R9CAF4/A0A2R9CAF4-deep-research-falcon.md
          supporting_text: >-
            SLC26A11 exhibits dual transporter-channel function: electroneutral proton:sulfate/chloride
            exchange and chloride-selective channel conductance
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0015116
      label: sulfate transmembrane transporter activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 16.69). A strict ancestor of the rank-1 term, so mechanically this is a
        less-precise restatement rather than new information; it is scored positively because
        it is correct and because the parent term is the appropriate one to use for the
        channel mode, where the transport is not secondary-active. In practice a curator
        would keep the rank-1 term and drop this one, which is the general problem with
        taking a fixed number of ranks from a retrieval list: neighbouring ranks are often
        the same claim at different ontology depths.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0098658
      label: inorganic anion import across plasma membrane
    predicted_term_type: GO_BP
    review:
      assessment: PLI
      confidence_score: 0
      error_type: LOCALIZATION_DEFAULT
      summary: >-
        Rank 3 (score 16.65). The chemistry is right but both the direction and the membrane
        are wrong for SLC26A11: its primary physiological role is sulfate *export* from the
        lysosomal lumen to the cytoplasm, not import across the plasma membrane. The
        prediction is transferred from the plasma-membrane SLC26 paralogs (SLC26A1/A2,
        which import sulfate into chondrocytes and kidney cells and dominate the family's
        SwissProt annotations); it is a paralog-level error that a curator would have to
        catch, since the term is otherwise entirely plausible for the family.
      supported_by:
        - reference_id: file:PANPA/A0A2R9CAF4/A0A2R9CAF4-deep-research-falcon.md
          supporting_text: >-
            SLC26A11 exhibits dual transporter-channel function: electroneutral proton:sulfate/chloride
            exchange and chloride-selective channel conductance
