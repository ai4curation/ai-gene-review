  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: >-
      Ensembl transfer from mouse Slc26a11. The mouse source evidence is a pHi
      recovery assay in transiently transfected COS7 cells, interpreted as
      chloride/bicarbonate exchange. In the later study with purified human SLC26A11 reconstituted in
      proteoliposomes, bicarbonate did not compete with sulfate transport, and the
      exchange cycle couples proton:sulfate symport to chloride antiport. The
