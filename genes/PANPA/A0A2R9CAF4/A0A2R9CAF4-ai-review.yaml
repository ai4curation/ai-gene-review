id: A0A2R9CAF4
gene_symbol: A0A2R9CAF4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9597
  label: Pan paniscus
description: >-
  A0A2R9CAF4 is the full-length (606 aa) product of the bonobo SLC26A11 gene (KBAT,
  kidney and brain anion transporter), a member of the SLC26/SulP anion transporter
  family with a 14-helix transmembrane domain and a C-terminal cytosolic STAS domain.
  It is 99.2% identical to human SLC26A11 over its full length and retains the
  pH-sensing glutamate (Glu-320 in human). Human SLC26A11 forms a homodimer with
  domain-swapped STAS domains and is a dual-function protein. As a secondary active
  transporter it couples the symport of one proton and one sulfate ion to the antiport
  of one chloride ion, an electroneutral cycle that is selective for sulfate over
  bicarbonate and phosphate. During this transport cycle it can also enter an
  uncoupled, channel-like chloride-conducting state. In mammalian cell lines the
  protein resides mainly in the lysosomal membrane, where the luminal acid gradient
  favours proton-driven sulfate efflux; it is proposed to be the lysosomal sulfate
  exporter that removes sulfate released during catabolism of sulfated
  macromolecules. A plasma membrane pool is seen in some cells and tissues, for
  example apically and basolaterally in renal collecting duct intercalated cells and
  in cerebellar Purkinje neurons. Plasmalemmal SLC26A11 chloride currents have been
  linked to neuronal chloride entry and swelling under hypoxia. The gene is broadly
  expressed, with highest levels in brain, kidney and placenta.
