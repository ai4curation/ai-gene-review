suggested_questions:
- question: >-
    Is the Cl-/HCO3- exchange reported for mouse Slc26a11 in COS7 cells (Ensembl
    source of GO:0140900) reproducible with purified mouse protein, or does it reflect
    an indirect effect on endogenous transport, given that purified human SLC26A11
    shows no bicarbonate interaction?
- question: >-
    GO has no process term for sulfate export from the lysosome to the cytosol; would a
    term such as lysosomal sulfate export be useful for SLC26A11 and similar
    lysosomal catabolite exporters?
suggested_experiments:
- description: >-
    Measure lysosomal sulfate content and sulfatase substrate clearance in SLC26A11
    knockout cells, to test in cells the proposed role as the lysosomal sulfate exporter.
- description: >-
    Reconstitute purified mouse Slc26a11 and test bicarbonate-dependent chloride flux
    directly, to resolve the conflict between the cellular and reconstitution data.
