  id: NCBITaxon:7955
  label: Danio rerio
description: exoc3l2a (exocyst complex component 3-like 2a) is one of two zebrafish co-orthologs of vertebrate
  EXOC3L2, retained from the teleost-specific genome duplication; its paralog is exoc3l2b. It encodes a 932-aa member
  of the EXOC3/Sec6 family with an N-terminal region and a C-terminal Sec6 helical-bundle domain. By sequence it is
  much closer to EXOC3L2 than to EXOC3, EXOC3L1, EXOC3L4 or TNFAIP2 (M-Sec). Mammalian EXOC3L2 is expressed in
  endothelial cells and co-precipitates with the exocyst subunit EXOC4. In cultured human endothelial cells it is
  needed for VEGFA-induced VEGFR2 phosphorylation and for directional migration. Mouse Exoc3l2 knockouts die in
  utero with hemorrhage and heart and brain defects, and human biallelic EXOC3L2 mutations cause a hindbrain,
  kidney and bone-marrow syndrome. In zebrafish, exoc3l2a is expressed in an endothelial-specific pattern at 24 hpf
  and belongs to the endothelial gene signature of the caudal hematopoietic tissue niche. No zebrafish
  loss-of-function or biochemical study of exoc3l2a has been published.
