  review:
    summary: Exocytosis (IBA) from the EXOC3/Sec6 family node.
    action: KEEP_AS_NON_CORE
    reason: An exocyst-associated protein is plausibly involved in exocytosis, and the proposed model for EXOC3L2 is
      exocyst-dependent delivery of VEGFR2 to the cell surface. But no secretion or exocytosis assay has been done
      for EXOC3L2 in any species; the measured effects are on VEGFR2 phosphorylation and directional migration.
      The term is kept as a plausible family-level process, not as a demonstrated core function.
    supported_by:
    - reference_id: PMID:21566143
      supporting_text: We hypothesized that EXOC3L2 may be involved in the exocytosis of VEGFR2, and that a down-regulation
        of EXOC3L2 expression thus could have an effect on VEGFR2 phosphorylation.
    - reference_id: PMID:21566143
      supporting_text: Finally, we show that exoc3l2 silencing inhibits VEGF receptor 2 phosphorylation and VEGFA-directed
        migration of cultured endothelial cells.
