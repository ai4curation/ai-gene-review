    summary: Exocyst (IBA) from the EXOC3/Sec6 family node PTN000480155, seeded by Sec6/EXOC3 orthologs from
      budding and fission yeast, Arabidopsis, Dictyostelium, fly and mouse.
    action: ACCEPT
    reason: exoc3l2a keeps a complete Sec6 domain and is an EXOC3L2 co-ortholog. Mammalian EXOC3L2 is the only
      member of this subfamily studied biochemically. A tagged EXOC3L2 co-precipitates with EXOC4 and colocalises
