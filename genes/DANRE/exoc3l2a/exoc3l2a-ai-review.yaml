  review:
    summary: SNARE binding (IBA) from node PTN000480155, with budding-yeast Sec6 as the only experimental donor.
    action: MARK_AS_OVER_ANNOTATED
    reason: SNARE binding has been shown only for yeast Sec6. The node spans the whole EXOC3/Sec6 family, including
      the vertebrate EXOC3-like paralogs (EXOC3L1, EXOC3L2, EXOC3L4, TNFAIP2), and none of these paralogs has been
      tested for SNARE binding. exoc3l2a is only 19.7% identical to human EXOC3 and is the faster-evolving copy of
      its pair. The one EXOC3L2 interaction studied is with the exocyst core subunit EXOC4. The function could have
      been inherited from Sec6, but no data support it for the EXOC3L2 lineage. exoc3l2b carries no IBA rows,
      because the accession in the PANTHER tree (A0A8M3B147) has since been deleted from UniProt.
    supported_by:
