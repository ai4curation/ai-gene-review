suggested_questions:
- question: Is exoc3l2a required for vascular development in zebrafish, as Exoc3l2 is in mouse? Do exoc3l2a mutants
    show hemorrhage, sprouting defects or an abnormal caudal hematopoietic tissue niche?
- question: Is exoc3l2b also expressed in endothelium, or is the endothelial domain carried by exoc3l2a alone?
- question: PANTHER lists EXOC3L4 as the human ortholog and places the gene in a TNFAIP2-named subfamily, while
    sequence identity, synteny and Ensembl Compara support EXOC3L2. Should the PANTHER tree for PTHR21292 be
    revisited?
suggested_experiments:
- description: Make exoc3l2a, exoc3l2b and double mutants, including an RNA-less or promoter-deletion allele to
    avoid transcriptional adaptation. Score vascular patterning, hemorrhage and CHT hematopoiesis in kdrl and gata1
    reporter backgrounds.
- description: Do two-colour in situ hybridization (HCR) for exoc3l2a and exoc3l2b with kdrl and sox10 at 12-48 hpf,
    to test whether the endothelial and neural-crest domains are split between the copies.
- description: Co-immunoprecipitate tagged Exoc3l2a with zebrafish exocyst subunits (Exoc4, Exoc7) and with RalA.
