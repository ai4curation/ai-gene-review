core_functions:
- description: EXOC3/Sec6-family protein and EXOC3L2 co-ortholog, expressed in embryonic endothelial cells,
    including the endothelium of the caudal hematopoietic tissue niche. By analogy with mammalian EXOC3L2 it
    probably associates with the exocyst and may support VEGF receptor signalling and directional migration of
    endothelial cells. None of these activities has been tested for the zebrafish protein.
  in_complex:
    id: GO:0000145
    label: exocyst
  supported_by:
  - reference_id: PMID:40613926
    supporting_text: In situ hybridization for three of these genes– exoc3l2a, slc22a7b.1, and bpifc–, confirmed their
      endothelial-specific expression pattern
