gene_symbol: cyp17a1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Zebrafish Cyp17a1 is a membrane-associated heme cytochrome P450 with both steroid 17alpha-hydroxylase
  and oxidative 17,20-lyase activities. It converts progesterone and pregnenolone through 17alpha-hydroxy
  intermediates to androstenedione and DHEA, respectively, supplying gonadal androgen and estrogen synthesis.
  It supports ovarian differentiation and male secondary sexual traits through steroid production. Its
  substrate selectivity differs from human CYP17A1, and it is functionally distinct from the hydroxylase-only
  Cyp17a2 paralog.
