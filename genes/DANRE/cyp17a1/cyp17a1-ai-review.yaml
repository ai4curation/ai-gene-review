core_functions:
- description: Steroid 17alpha hydroxylation of pregnenolone and progesterone using molecular oxygen and
    reducing equivalents supplied through P450 reductase.
  molecular_function: *id002
  supported_by:
  - *id001
- description: Oxidative 17,20-lyase conversion of 17alpha-hydroxysteroids to DHEA or androstenedione,
    supplying androgen precursors. Zebrafish substrate preference and b5 stimulation differ from human
    CYP17A1.
  proposed_molecular_function: steroid 17,20-lyase activity
  directly_involved_in:
  - id: GO:1903449
    label: androst-4-ene-3,17-dione biosynthetic process
  supported_by:
  - *id001
proposed_new_terms:
- proposed_name: steroid 17,20-lyase activity
  proposed_definition: Catalysis of oxidative cleavage of the C17-C20 bond of a 17alpha-hydroxy-C21 steroid
    using molecular oxygen and reducing equivalents, producing a C19 17-ketosteroid and acetate. Substrates
    include 17alpha-hydroxypregnenolone and 17alpha-hydroxyprogesterone.
  justification: GO:0004508 is defined only as 17alpha hydroxylation (RHEA:65760), not side-chain cleavage.
    QuickGO searches for 17,20-lyase and EC1.14.14.32 found no specific term. EC1.14.14.32 and RHEA:50244/14753
    in the curated human CYP17A1 record specify this distinct oxidative reaction.
  proposed_parent:
    id: GO:0016705
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular
      oxygen
  supported_by:
  - reference_id: PMID:25533464
    supporting_text: Zebrafish P450 17A1 converted progesterone to 17α-OH progesterone and androstenedione
      and converted pregnenolone to 17α-OH pregnenolone and DHEA
