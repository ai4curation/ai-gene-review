- term:
    id: GO:0060047
    label: heart contraction
  evidence_type: IMP
  original_reference_id: PMID:25866181
  review:
    summary: ZFIN IMP from the morpholino screen (PMID:25866181), where MFM-gene knockdowns produced
      severe heart failure. Independently, cryabb null zebrafish show embryonic cardiac edema whose 
      penetrance rises under glucocorticoid stress (PMID:37577747).
    action: KEEP_AS_NON_CORE
    reason: Two independent zebrafish models (morphant, PMID:25866181; CRISPR null, PMID:37577747) 
      link cryabb loss to cardiac failure, consistent with human CRYAB cardiomyopathy. But heart 
      contraction is the organ-level output; the chaperone does its work on cardiomyocyte 
      proteostasis, not in the contractile cycle. Kept as non-core rather than accepted as a core 
      function.
    supported_by:
    - reference_id: PMID:25866181
      supporting_text: targeted ablation of MFM genes in zebrafish led to compromised skeletal 
        muscle function mostly due to myofibrillar degeneration as well as severe heart failure.
    - reference_id: PMID:37577747
      supporting_text: In addition to lens defects, the loss of αB-crystallin function is associated
