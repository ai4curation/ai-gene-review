- term:
    id: GO:0140309
    label: unfolded protein holdase activity
  evidence_type: IDA
  original_reference_id: PMID:16420472
  qualifier: enables
  review:
    summary: ZFIN IDA migrated from obsolete GO:0051082 (unfolded protein binding). PMID:16420472 
      measured the ability of recombinant cryabb to prevent chemically induced aggregation of 
      alpha-lactalbumin and lysozyme at 25-40 degrees C, a classic holdase assay. GO:0140309 is 
      labelled unfolded protein holdase activity but is defined as a carrier activity that escorts 
      the unfolded protein to an acceptor molecule or location, which was not tested and is not what
      crystallins do.
    action: MODIFY
    reason: The experiment is sound and directly on the zebrafish protein, so the activity should be
      kept; the problem is the term. GO:0140309 retains its carrier definition (go-ontology#30552), 
      so the migration overstates what was measured. The replacement is the proposed holdase 
      chaperone activity NTR under proposed_new_terms (aggregation suppression without refolding or 
      delivery), the same replacement used for the protein refolding IBA row; when GO creates such a
      term this row should move to it.
    proposed_replacement_terms:
    - id: NTR
      label: holdase chaperone activity
    supported_by:
