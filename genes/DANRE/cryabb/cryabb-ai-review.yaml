- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IBA from the sHSP node (PTN000897708), seeded mainly by Drosophila sHSP donors. The 
      term (protein refolding) describes assisted restoration of native structure; alpha-crystallins
      are ATP-independent holdases that prevent aggregation of unfolding proteins but do not refold 
      them. The cryabb assay measured only suppression of chemically induced aggregation 
      (PMID:16420472).
    action: MODIFY
    reason: The node inherits chaperone involvement correctly, but the term overstates a foldase 
      step. cryabb was assayed solely for prevention of aggregation of alpha-lactalbumin and 
      lysozyme (PMID:16420472), the holdase readout. GO:0140309 is not the fix because its 
      definition still requires escort to an acceptor molecule or location (go-ontology#30552); the 
      appropriate replacement is the proposed holdase chaperone activity NTR listed under 
      proposed_new_terms, which is also the replacement for the IDA row below.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000897708
        source_label: sHSP / alpha-crystallin ancestral node (PTHR45620)
        source_status: SUPPORTS_TRANSFER
        comment: Descent from this sHSP node correctly transfers chaperone involvement, but 
          GO:0042026 (protein refolding) overstates a foldase activity that cryabb lacks; it is an 
          ATP-independent holdase preventing aggregation without refolding.
      - source_id: FB:FBgn0001226
        source_label: Drosophila small heat-shock protein donor
        source_status: SUPPORTS_TRANSFER
        comment: Representative Drosophila sHSP donor seeding the node; holdase-vs-foldase 
          distinction not captured by the term.
    proposed_replacement_terms:
    - id: NTR
      label: holdase chaperone activity
    supported_by:
