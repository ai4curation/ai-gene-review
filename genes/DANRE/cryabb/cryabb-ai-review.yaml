- term:
    id: GO:0030239
    label: myofibril assembly
  evidence_type: IMP
  original_reference_id: PMID:25866181
  review:
    summary: 'ZFIN IMP from morpholino knockdown (PMID:25866181): loss of cryabb causes myofibrillar degeneration.
      Mammalian CRYAB is a myofibrillar myopathy gene that stabilises sarcomeric clients (desmin, titin),
      and cryabb is the paralog that retained constitutive muscle expression and chaperone activity (PMID:16420472).'
    action: ACCEPT
    reason: 'This is the process in which the holdase activity itself does work: sHSP binding of sarcomeric
      proteins keeps them assembly-competent, and the morphant phenotype (myofibrillar degeneration, PMID:25866181)
      is the expected readout of losing that. The abstract-only cache does not name cryabb, so the curator
      reading of the full text is deferred to; the biology is consistent with cryabb having heart and
      skeletal-muscle expression (PMID:16420472). Morpholino-only evidence is a caveat noted in suggested_experiments.'
    supported_by:
    - reference_id: PMID:25866181
      supporting_text: targeted ablation of MFM genes in zebrafish led to compromised skeletal 
        muscle function mostly due to myofibrillar degeneration as well as severe heart failure.
    - reference_id: PMID:16420472
      supporting_text: RT-PCR showed that alphaB2-crystallin is expressed predominantly in lens but,
