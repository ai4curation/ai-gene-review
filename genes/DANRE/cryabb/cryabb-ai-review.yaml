proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its aggregation 
    without actively catalyzing refolding. The holdase maintains the client protein in a soluble, 
    folding-competent state. This is mechanistically distinct from foldase activity (GO:0044183) and
    from carrier-holdase activity (GO:0140309).
  justification: 'cryabb: cryabb is the broadly expressed zebrafish alphaB-crystallin paralog that retained
    the widespread protective function of mammalian CRYAB after gene duplication (PMID:16420472). Obsolete
    GO:0051082 captured binding only; GO:0044183 requires assisting folding, and GO:0140309 (relabelled
    ''unfolded protein holdase activity'') keeps a carrier-specific definition requiring escort to an
    acceptor molecule or location, which is not demonstrated here. See go-ontology#30552.'
  proposed_parent:
