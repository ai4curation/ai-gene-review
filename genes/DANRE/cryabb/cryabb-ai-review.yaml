- id: PMID:17888590
  title: Genome-wide analysis and expression profiling of the small heat shock proteins in 
    zebrafish.
  findings:
  - statement: cryabb (hspb5b) is one of thirteen zebrafish sHSPs; EST data place the lens 
      alpha-crystallins hspb4, hspb5a and hspb5b predominantly in lens libraries, and hspb5b is not 
      among the sHSPs upregulated more than five-fold by a one-hour 37 degrees C heat shock.
    supporting_text: In response to a one-hour heat shock at 37°C, we found the expression of 
      several sHSPs, hspb1, hspb4, hspb8, hspb9 , and hspb11 , to be upregulated more than five-fold
      at one or more stages of development
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches the cached record (Elicker & Hutson 2007, Gene); full text cached. 
      cryabb appears as hspb5b. Used to show that zebrafish heat induction of cryabb is modest.
- id: PMID:37577747
  title: Interplay between Nrf2 and αB-crystallin in the lens and heart of zebrafish under 
    proteostatic stress.
  findings:
  - statement: cryabb transcription is induced by oxidative (tBHP) and glucocorticoid 
      (dexamethasone) stress and strongly upregulated in Nrf2-deficient heart and brain; cryabb null
      embryos show lens defects and stress-potentiated cardiac edema.
    supporting_text: Our data suggest that cryabb functions as a stress–response gene regulated by 
      both glucocorticoid stress and oxidative stress.
  - statement: Loss of either zebrafish alphaB-crystallin causes embryonic lens defects and a 
      cardiac edema phenotype.
    supporting_text: In addition to lens defects, the loss of αB-crystallin function is associated 
      with a cardiac phenotype that presents as embryonic cardiac edema (Mishra et al., 2018).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Park et al. 2023, Front Mol Biosci); full text 
      cached from PMC. CRISPR null lines for cryabb; provides the zebrafish stress-response and 
      cardiac/lens phenotype evidence.
