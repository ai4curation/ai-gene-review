- term:
    id: GO:0036438
    label: maintenance of lens transparency
  evidence_type: IMP
  original_reference_id: PMID:38705506
  review:
    summary: ZFIN IMP from the aged cryabb null line (PMID:38705506). The abstract reports that 
      cryaba, not cryaa, loss increases age-related cataract and that cryabb lens expression becomes
      prominent only after 10 dpf; the cryabb mutant result is in the full text (not cached). 
      Embryonic cryabb knockouts do show lens defects (PMID:37577747).
    action: KEEP_AS_NON_CORE
    reason: A lens holdase does the work of keeping lens proteins soluble, so participation is 
      direct and the term is appropriate for an alpha-crystallin; the curator read the full text and
      is deferred to. It is graded non-core because the abstract identifies cryaba as the paralog 
      that drives age-related lens protection while cryabb is the broadly expressed, minor lens 
      component (PMID:38705506, PMID:16420472).
    supported_by:
    - reference_id: PMID:38705506
      supporting_text: zebrafish express one lens-specific αA-crystallin gene (cryaa), they express 
        two αB-crystallin genes, with one evolving lens specificity (cryaba) and the other retaining
        the broad expression of its mammalian ortholog (cryabb).
    - reference_id: PMID:38705506
      supporting_text: expression of cryaba and cryabb becoming more prominent after 10 dpf. These 
        data show that cryaa is the primary α-crystallin during early lens development, while the 
        protective role for cryaba becomes more important during lens aging.
    - reference_id: PMID:37577747
      supporting_text: Previously, we showed that knockout of either αB-crystallin causes lens 
        defects in zebrafish embryos (Mishra et al., 2018; Zou et al., 2015).
