  review:
    summary: ZFIN IMP from morpholino knockdown in a screen of human myofibrillar myopathy genes 
      (PMID:25866181; abstract-only cache, cryabb not named in the abstract). Knockdown of the MFM 
      genes compromised skeletal muscle function through myofibrillar degeneration.
    action: KEEP_AS_NON_CORE
    reason: cryabb is constitutively expressed in skeletal muscle (PMID:16420472), so a muscle 
      phenotype is expected, and the curator saw the full text; but the morphant readout is 
      degeneration of already-formed myofibrils, a maintenance defect. Tissue development is the 
      downstream phenotype, not the step the chaperone performs, so the row is kept as non-core with
      the direct work captured under myofibril assembly.
    supported_by:
