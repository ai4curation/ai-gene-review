- term:
    id: GO:0009408
    label: response to heat
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'IBA from the sHSP node (PTN000897708), with the zebrafish gene in WITH/FROM. cryabb (hspb5b)
      is a heat shock protein family member whose recombinant protein suppresses aggregation across 25-40
      degrees C (PMID:16420472). Zebrafish heat-shock profiling found hspb5b expressed in lens and only
      modestly heat-inducible: it is not among the sHSPs induced more than five-fold (PMID:17888590).
      It is transcriptionally induced by oxidative and glucocorticoid stress (PMID:37577747).'
    action: ACCEPT
    reason: 'The node placement is sound: the sHSP family arose as heat-inducible aggregation suppressors
      and cryabb retained the general protective role of mammalian CRYAB (PMID:16420472). Zebrafish-specific
      evidence shows only modest heat induction (PMID:17888590) but clear stress-responsive transcription
      (PMID:37577747) and temperature-dependent chaperone protection (PMID:16420472), which is what the
      term claims. Accepted as the process context of the core holdase activity.'
    supported_by:
    - reference_id: PMID:16420472
      supporting_text: At 25 degrees C and 30 degrees C, zebrafish alphaB2 showed greater 
        chaperone-like activity than human alphaB-crystallin, and at 35 degrees C and 40 degrees C, 
        the human protein provided greater protection against aggregation.
    - reference_id: PMID:17888590
      supporting_text: In response to a one-hour heat shock at 37°C, we found the expression of 
        several sHSPs, hspb1, hspb4, hspb8, hspb9 , and hspb11 , to be upregulated more than 
        five-fold at one or more stages of development
    - reference_id: PMID:37577747
      supporting_text: Our data suggest that cryabb functions as a stress–response gene regulated by
        both glucocorticoid stress and oxidative stress.
