  review:
    summary: PAINT IBA from the vertebrate alpha-crystallin/HSPB1 node (PTN002264124), seeded by 
      mouse, rat and human CRYAA/CRYAB/HSPB1 anti-apoptotic annotations. No zebrafish study tests 
      apoptosis for cryabb; the only cryabb-specific data are aggregation-suppression assays 
      (PMID:16420472) and stress-responsive transcription (PMID:37577747).
    action: KEEP_AS_NON_CORE
    reason: cryabb sits inside the vertebrate CRYAB clade that carries the anti-apoptotic function, 
      and it retained the broadly expressed, protective role of mammalian CRYAB rather than the 
      lens-restricted role of cryaba (PMID:16420472), so the node placement transfers plausibly. 
      Apoptosis suppression is, however, a downstream consequence of holdase activity that has not 
      been measured in zebrafish, so it is retained as non-core rather than as a core function.
    supported_by:
