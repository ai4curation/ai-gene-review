  title: Gene duplication and separation of functions in alphaB-crystallin from zebrafish (Danio 
    rerio).
  findings:
  - statement: Zebrafish express two alphaB-crystallins. cryabb (alphaB2) has constitutive 
      expression in heart, brain, skeletal muscle, liver, and lens, retaining the broad expression 
      of mammalian CRYAB. cryabb shows greater chaperone-like activity than human CRYAB at 25-30 
      degrees C. After gene duplication, cryabb maintained the widespread protective role of 
      mammalian CRYAB while cryaba adopted a lens-specific role.
    supporting_text: zebrafish alphaB2 maintained the widespread protective role also found in 
      mammalian alphaB-crystallin, while zebrafish alphaB1 adopted a more restricted, nonchaperone 
      role in the lens.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Title matches the cached record (Smith et al. 2006, FEBS J). Primary characterization
      of cryabb (cryab2/alphaB2): tissue RT-PCR and in vitro aggregation-suppression assays on recombinant
      protein; the sole source for the holdase IDA. Abstract-only cache.'
- id: PMID:25866181
  title: In vivo characterization of human myofibrillar myopathy genes in zebrafish.
  findings:
  - statement: Morpholino knockdown of myofibrillar myopathy genes including cryabb in zebrafish led
      to compromised skeletal muscle function, myofibrillar degeneration, and severe heart failure.
    supporting_text: targeted ablation of MFM genes in zebrafish led to compromised skeletal muscle 
      function mostly due to myofibrillar degeneration as well as severe heart failure.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches the cached record (Buhrdel et al. 2015). Abstract-only; cryabb is 
      not named in the abstract, the ZFIN morphant annotations come from the full text. Supports 
      muscle and cardiac phenotypes on knockdown; morpholino-only evidence.
- id: PMID:38705506
  title: Loss of αBa-crystallin, but not αA-crystallin, increases age-related cataract in the 
    zebrafish lens.
  findings:
  - statement: The study examined all three alpha-crystallin mutant zebrafish lines for age-related 
      cataract. cryabb contributes to lens maintenance alongside cryaa and cryaba.
    supporting_text: zebrafish express one lens-specific alphaA-crystallin gene (cryaa), they 
      express two alphaB-crystallin genes, with one evolving lens specificity (cryaba) and the other
      retaining the broad expression of its mammalian ortholog (cryabb).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches the cached record (Posner et al. 2024). Abstract-only; the cryabb 
      mutant cataract result is in the full text, and the abstract foregrounds cryaba as the paralog
      whose loss increases age-related cataract. Supports the lens-expression shift after 10 dpf.
- id: file:DANRE/cryabb/cryabb-deep-research-falcon.md
  title: Falcon deep research report on zebrafish cryabb (alphaB-crystallin B b)
  findings:
  - statement: 'Crystallins are soluble cytoplasmic proteins in vertebrate optical

      tissues, supporting a primary intracellular/cytosolic localization for

      cryabb. ECM mentions for the alphaB-crystallin family should be read as

      tissue-level association, not as evidence that cryabb itself is secreted.

      '
    supporting_text: crystallins are described as **soluble cytoplasmic** proteins in vertebrate 
      optical tissues, supporting a primary **intracellular/cytosolic** localization
    reference_section_type: DISCUSSION
