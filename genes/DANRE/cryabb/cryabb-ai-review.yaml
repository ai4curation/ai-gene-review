gene_symbol: cryabb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Zebrafish alpha-crystallin B chain b (cryabb, also called cryab2, hspb5b or 
  alphaB2-crystallin) is a small heat shock protein (HSP20 family) with an alpha-crystallin domain. 
  It is one of two alphaB-crystallin paralogs produced by the teleost genome duplication; cryaba 
  became lens-restricted, whereas cryabb kept the mammalian CRYAB-like pattern of predominant lens 
  expression plus constitutive expression in heart, brain, skeletal muscle and liver 
  (PMID:16420472). Recombinant cryabb is an ATP-independent holdase chaperone that suppresses 
  chemically induced aggregation of model substrates, with greater activity than human CRYAB at 
  25-30 degrees C (PMID:16420472). It is a minor lens component (about 0.16% of lens protein) whose 
  lens expression rises after 10 days post-fertilization (PMID:38705506). Its transcription responds
  to oxidative and glucocorticoid stress and is strongly elevated in Nrf2-deficient heart and brain 
  (PMID:37577747). Loss of cryabb causes embryonic lens defects and stress-potentiated cardiac edema
  in null mutants (PMID:37577747) and myofibrillar degeneration with heart failure in morphants 
  (PMID:25866181), consistent with human CRYAB as a myofibrillar myopathy, cardiomyopathy and 
  cataract gene.
