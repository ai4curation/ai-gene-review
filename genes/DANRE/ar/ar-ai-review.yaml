id: A4GT83
gene_symbol: ar
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Zebrafish Ar is a ligand-activated nuclear steroid receptor that binds testosterone and 11-ketotestosterone
  and regulates androgen-responsive transcription. It supports male reproductive development, spermatogenesis
  and courtship, and also contributes to ovarian function. Strong androgen responsiveness contrasts with
  weak cortisol-driven activation seen only at much higher concentrations in heterologous assays.
