  review:
    summary: Nuclear localization supports the receptor transcriptional activity.
    action: ACCEPT
    reason: Nuclear localization is retained as a conserved-function inference from the native receptor’s
      androgen-dependent transcriptional activity and ortholog AR action at nuclear chromatin. The inspected
      zebrafish biochemical reports establish binding/transactivation; their mRNA in situ hybridization
      is not protein localization. No direct zebrafish AR protein-localization assay was identified, so
      the annotation is not described as experimentally localized here.
