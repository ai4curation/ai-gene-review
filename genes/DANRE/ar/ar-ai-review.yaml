  review:
    summary: Chromatin association is retained as a conserved AR-function inference.
    action: ACCEPT
    reason: The existing phylogenetic annotation is consistent with functional ARE-dependent transcription
      by this receptor and direct AR occupancy of an endogenous promoter demonstrated for mouse Ar (PMID:27959439).
      The mouse ChIP/EMSA experiment is comparative evidence, not native fish chromatin occupancy. No
      direct ChIP experiment on this fish receptor was identified; the 2023 medaka study proposes ChIP-seq
      as future work. There is no target-specific evidence of loss of this conserved DNA-associated receptor
      role.
    supported_by:
    - &id003
      reference_id: PMID:27959439
      supporting_text: "chromatin \nimmunoprecipitation and electrophoretic mobility shift assays indicated\
        \ that the \nligand‑bound AR activated Aard transcription via directly binding to the \nandrogen‑responsive\
        \ element of the Aard promoter."
    - &id002
      reference_id: PMID:18469035
      supporting_text: 'The zebrafish Ar responded well in terms

        of binding and transactivation to synthetic androgens as well as to testosterone

        and 11-KT'
