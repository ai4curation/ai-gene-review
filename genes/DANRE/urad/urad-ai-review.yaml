id: A1L259
gene_symbol: urad
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'urad encodes 2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline (OHCU) decarboxylase (EC 4.1.1.97),
  the third and last enzyme of oxidative uricolysis. It converts the unstable intermediate OHCU, formed
  from urate by urate oxidase and 5-hydroxyisourate hydrolase, into (S)-allantoin with release of CO2,
  and does so stereoselectively: without the enzyme the reaction proceeds spontaneously to a racemic product.
  The protein is a homodimer with an all-alpha fold and no cofactor; His67 supplies the proton that fixes
  the (S) configuration and Glu87 destabilises the substrate carboxylate to promote CO2 loss. It acts
  with the other two uricolytic enzymes, which are peroxisomal, and carries a weak C-terminal PTS1 tripeptide.
  The pathway converts poorly soluble urate into soluble allantoin for nitrogen excretion; its genes were
  pseudogenised in hominoids, which is why humans accumulate urate.'
