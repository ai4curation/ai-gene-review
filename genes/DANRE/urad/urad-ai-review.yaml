suggested_questions:
- question: Is zebrafish Urad actually peroxisomal in vivo, given only a weak TKL PTS1 and a 
    curator-inferred (ECO:0000305) UniProt location, or does a cytosolic pool exist?
- question: Does loss of urad in zebrafish cause accumulation of OHCU or racemic allantoin, and is 
    that phenotype distinguishable from uox loss?
suggested_experiments:
- description: Immunolocalise endogenous Urad, or knock in a tag, and compare with Uox and a 
    peroxisomal marker in zebrafish liver.
  hypothesis: Urad co-localises with Uox in peroxisomes despite its weak PTS1, placing all three 
    uricolytic steps in one compartment.
- description: Generate urad loss-of-function zebrafish and measure urate, OHCU-derived products and
    allantoin enantiomer ratio.
  hypothesis: Without Urad the pathway still consumes urate but yields racemic allantoin from 
    spontaneous OHCU decay.
