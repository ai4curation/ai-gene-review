core_functions:
- description: Secreted chordin-like BMP antagonist that restrains BMP/Smad1/5/8 signalling in the developing zebrafish forebrain.
    It is needed for subpallial patterning, for GABAergic interneuron and oligodendrocyte specification, and for commissural
    axon guidance.
  directly_involved_in:
  - id: GO:0030514
    label: negative regulation of BMP signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - *id004
  - *id002
  - *id005
  - *id001
suggested_questions:
- question: Does Brorin bind BMP ligands directly (and which), or act through another component? No binding assay has been
    reported for any Brorin family member.
- question: Do stable vwc2 mutants reproduce the morphant forebrain phenotypes, and do vwc2 and vwc2l act redundantly in the
    prethalamus, where both are expressed?
- question: Is the IMP to nervous system development from PMID:19852960 based on a vwc2 experiment, or is it vwc2l data attached
    to vwc2?
suggested_experiments:
- hypothesis: vwc2 loss-of-function phenotypes reflect raised BMP signalling.
  description: Generate vwc2 mutants (including an RNA-less allele), score pSmad1/5/8, dlx2a, gad1 and commissures, and test
    suppression with a BMP receptor inhibitor (e.g. dorsomorphin, DMH1).
  experiment_type: mutant analysis with pharmacological suppression
- hypothesis: si:dkey-283b1.7 does not share the vwc2 forebrain role.
  description: Compare expression (in situ, retina and brain) and test whether si:dkey-283b1.7 mRNA can rescue vwc2 mutants
    or dorsalize embryos like brorin mRNA.
  experiment_type: cross-rescue / overexpression
