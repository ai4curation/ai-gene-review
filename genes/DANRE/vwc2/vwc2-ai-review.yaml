description: 'vwc2 (brorin; ZFIN ZDB-GENE-090313-315, chromosome 13) is the zebrafish ortholog of vertebrate VWC2/Brorin,
  supported by conserved exon-intron structure and by synteny: ikzf1 and fignl1 are its neighbours in zebrafish, mouse and
  gar. PANTHER pairs it with the divergent si:dkey-283b1.7 as a teleost genome duplication paralog, but synteny and other
  gene trees do not confirm that pairing. It encodes a 309-residue secreted protein. The signal peptide is followed by a divergent
  N-terminal region and a conserved core of two chordin-like von Willebrand factor C (VWFC) cysteine-rich domains. Like mouse
  Brorin, it acts as a secreted antagonist of BMP signalling. Injected brorin mRNA suppresses Smad1/5/8 phosphorylation and
  dorsalizes embryos, while knockdown raises phospho-Smad1/5/8 in the dorsal brain without activating Wnt signalling. The
  gene is expressed predominantly in the developing nervous system (diencephalon primordium from 16 hpf; later ventral telencephalon,
  prethalamus/alar hypothalamus, hindbrain, spinal cord, olfactory placode and pituitary). Morphants rescued by brorin mRNA
  show loss of subpallial (ventral telencephalic) identity, fewer GABAergic interneurons and oligodendrocytes, more astroglia,
  and failure of forebrain commissures. In mammals, Brorin is also an extracellular constituent of AMPA receptor complexes.'
