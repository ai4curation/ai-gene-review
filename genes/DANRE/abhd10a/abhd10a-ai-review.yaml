id: A0A0R4ILM1
gene_symbol: abhd10a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  Abhd10a (abhydrolase domain-containing 10a) is one of two teleost
  whole-genome duplication co-orthologs of vertebrate mitochondrial
  palmitoyl-protein thioesterase ABHD10 (EC 3.1.2.22) in Danio rerio, encoded
  on chromosome 5 alongside its paralog abhd10b on chromosome 24. The
  284-residue protein belongs to the alpha/beta-hydrolase superfamily
  (PTHR16138:SF7) and retains the conserved charge-relay catalytic triad at
  Ser131, Asp228, and His258 within an intact alpha/beta-hydrolase fold. By
  orthology to mammalian ABHD10, abhd10a functions as a mitochondrial serine
  hydrolase that catalyzes S-depalmitoylation of mitochondrial protein
  substrates.
existing_annotations:
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0173
  review:
    summary: >-
      Electronic UniProt Subcellular Location mapping to mitochondrion (SL-0173)
      is supported by conserved PTHR16138:SF7 orthology to experimentally
      verified mammalian mitochondrial ABHD10.
    action: ACCEPT
    reason: >-
      Zebrafish abhd10a is a conserved PTHR16138:SF7 co-ortholog of human
      ABHD10 and mouse Abhd10, which are experimentally localized to
      mitochondria (PMID:31740833). Per the root organelle policy, root
      GO:0005739 is accepted without adding a sub-compartment row because
      unreviewed TrEMBL entry A0A0R4ILM1 lacks both an annotated transit-peptide
      cleavage boundary and sub-organellar assays in zebrafish.
    supported_by:
    - reference_id: PMID:31740833
      supporting_text: >-
        Surprisingly, this effect was not mediated by the only known
        mitochondrial APT, but rather by a resident mitochondrial protein with
        no known endogenous function, ABHD10.
- term:
    id: GO:0008474
    label: palmitoyl-(protein) hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00085285
  - EC:3.1.2.22
  review:
    summary: >-
      Automated ARBA / EC 3.1.2.22 annotation accurately captures the conserved
      core S-depalmitoylase activity of PTHR16138:SF7, supported by retention of
      the intact Ser131-Asp228-His258 catalytic triad in abhd10a.
    action: ACCEPT
    reason: >-
      Zebrafish A0A0R4ILM1 belongs to PANTHER subfamily PTHR16138:SF7 and
      strictly conserves the alpha/beta-hydrolase catalytic triad (Ser131 in the
      GSSMG motif, Asp228, and His258) homologous to human Q9NUJ1 and mouse
      Q6PE15 (PMID:31740833).
    supported_by:
    - reference_id: PMID:31740833
      supporting_text: >-
        As expected, mature ABHD10 possesses a canonical α/β hydrolase domain
        with a catalytic triad formed by Ser100–His227–D197 (Fig. 4d,e).
