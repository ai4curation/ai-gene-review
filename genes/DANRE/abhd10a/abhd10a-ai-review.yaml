      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR16138:SF7; PALMITOYL-PROTEIN THIOESTERASE ABHD10, MITOCHONDRIAL; 1."
- term:
    id: GO:0098734
    label: obsolete macromolecule depalmitoylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0008474
  review:
    summary: >-
      Obsolete inter-ontology biological process projection from GO:0008474;
      replace with the active molecular function GO:0008474 palmitoyl-(protein)
      hydrolase activity.
    action: MODIFY
    reason: >-
      GO:0098734 was obsoleted by the Gene Ontology Consortium because
      depalmitoylation represents the enzymatic molecular function GO:0008474
      palmitoyl-(protein) hydrolase activity, from which this GO_REF:0000108 row
      was logically inferred.
    proposed_replacement_terms:
    - id: GO:0008474
      label: palmitoyl-(protein) hydrolase activity
    supported_by:
    - reference_id: PMID:31740833
      supporting_text: >-
        We show that ABHD10 is a member of the APT family of regulatory proteins
        and identify peroxiredoxin-5 (PRDX5), a key antioxidant protein, as a
        target of ABHD10 S-depalmitoylase activity.
- term:
    id: GO:0102390
    label: mycophenolic acid acyl-glucuronide esterase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.1.1.93
  review:
    summary: >-
      Over-propagated electronic EC 3.1.1.93 mapping of a human hepatic
      immunosuppressant drug-metabolite esterase activity onto a teleost
      co-ortholog without biochemical evidence in fish.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      EC 3.1.1.93 was assigned to human ABHD10 from in vitro and hepatic
      homogenate hydrolysis of mycophenolic acid acyl-glucuronide (PMID:22294686)
      and automatically projected via ARBA/EC2GO onto teleost abhd10a. While
      abhd10a retains the serine hydrolase catalytic triad, xenobiotic
      esterolysis of mammalian drug glucuronides varies sharply across
      vertebrate lineages and has never been tested in Danio rerio.
    supported_by:
    - reference_id: PMID:22294686
      supporting_text: >-
        Background: The enzyme responsible for deglucuronidation of mycophenolic
        acid acyl-glucuronide (AcMPAG) in human liver remains unknown.
