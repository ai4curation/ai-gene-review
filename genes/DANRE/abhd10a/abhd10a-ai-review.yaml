suggested_experiments:
- hypothesis: >-
    Zebrafish abhd10a and abhd10b are active mitochondrial matrix
    S-depalmitoylases with tissue-subfunctionalized expression across somatic
    tissues and gonads.
  description: >-
    Profile mature N-termini, mitochondrial sub-compartment localization,
    mitoDPP-2 S-depalmitoylase activity, and single/double CRISPR knockout
    phenotypes of abhd10a and abhd10b across zebrafish liver, ovary, and testis.
  experiment_type: Comparative paralog biochemistry and CRISPR genetics
