      supporting_text: >-
        pax6b is the “minor” co-orthologue, expressed in the developing eye (retina and early lens placode),
        and also in thin strips of dorsal diencephalon, at the midbrain-hindbrain boundary (MHB), and
        in the pancreas.
    - reference_id: PMID:18282108
      supporting_text: >-
        This may be the situation where several brain-specific elements, with spatiotemporal overlap in
        expression pattern, have been lost from pax6b.
    - reference_id: PMID:24528677
      supporting_text: >-
        Similar to the loss of Pax6 in mice, blockage of the function of both zebrafish homologues pax6a
