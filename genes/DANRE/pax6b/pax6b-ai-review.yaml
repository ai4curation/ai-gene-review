suggested_questions:
- question: >-
    Which Pax6b DNA-binding mode (paired domain alone, or the 5a isoform) drives pancreatic and enteroendocrine
    target genes, given that the homeodomain is dispensable there?
  experts:
  - Peers B
  - Manfroid I
- question: >-
    Is the mild sunrise eye phenotype partly buffered by pax6a, and does pax6a expression rise in pax6b
    null (sa0086) eyes?
suggested_experiments:
- hypothesis: >-
    Pancreatic endocrine differentiation requires Pax6 protein of either copy, and pax6a would rescue
    pax6b loss if expressed in the pancreas.
  description: >-
    Express pax6a coding sequence from pax6b pancreatic enhancers (regions A/C) in pax6b sa0086 mutants
    and score beta, delta and epsilon cells.
  experiment_type: cross-rescue
- hypothesis: pax6b binds endocrine target enhancers through its paired domain.
  description: CUT&RUN for Pax6b in sorted wild-type and sunrise pancreatic endocrine cells.
  experiment_type: genome-wide DNA-binding profiling
