- term:
    id: GO:0001755
    label: neural crest cell migration
  evidence_type: IGI
  original_reference_id: PMID:32555736
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-220927-6
  review:
    summary: pax6a/pax6b compound mutants misroute two periocular neural crest populations.
    action: KEEP_AS_NON_CORE
    reason: >-
      Supported by compound-mutant analysis with a gene-dose-dependent effect (PMID:32555736). The role
      is partly indirect (via the pax6-dependent lens and guidance cues), and it is shared with pax6a,
      whose equivalent ZFIN annotation is missing from the Swiss-Prot pax6a entry.
    supported_by:
    - reference_id: PMID:32555736
      supporting_text: >-
        By analysing zebrafish pax6a/b compound mutants presenting anterior segment dysgenesis, we demonstrate
        that Pax6a/b guide the two NC populations to distinct proximodistal locations.
    - reference_id: PMID:32555736
      supporting_text: >-
        Taken together, our data are consistent with a gene number dependent effect of pax6a/b on the
        migration of the two distinct waves of NC cells.
- term:
    id: GO:0002088
    label: lens development in camera-type eye
  evidence_type: IMP
  original_reference_id: PMID:17397257
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-070917-1
  review:
    summary: Hsp90 inhibition worsens lens size reduction in sunrise pax6b mutants.
    action: ACCEPT
    reason: >-
      sunrise homozygotes have reduced lens size relative to retina, worsened by Hsp90 inhibition (PMID:17397257).
      Lens development is a core pax6b function (also PMID:20177065).
    supported_by:
    - reference_id: PMID:17397257
      supporting_text: >-
        Under these conditions the severity of the recessive eye phenotype in sunrise, caused by a pax6b
        mutation, was increased
    - reference_id: PMID:17397257
      supporting_text: >-
        Upon Hsp90 functional reduction, lens size relative to the area of the retina was significantly
        decreased in homozygous sri embryos while homozygous dre remained unaltered (Figure 3I; Table
        2).
    - reference_id: PMID:20177065
      supporting_text: >-
        Crosses between pax6b sa0086 carrier fish generated homozygous mutant embryos, all displaying
        severe lens defects
- term:
    id: GO:0002089
    label: lens morphogenesis in camera-type eye
  evidence_type: IMP
  original_reference_id: PMID:20177065
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-100507-7
  review:
    summary: >-
      pax6b null mutants and pax6b morphants (including homeodomain-deleting splice morpholinos) have
      strongly affected lens formation.
    action: ACCEPT
    reason: >-
      All pax6b sa0086 (Y109*) homozygotes display severe lens defects, and deletion of the Pax6b homeodomain
      strongly affects lens formation while leaving the pancreas intact (PMID:20177065). The lens requires
      the homeodomain; the pancreas does not.
    supported_by:
    - reference_id: PMID:20177065
      supporting_text: >-
        Crosses between pax6b sa0086 carrier fish generated homozygous mutant embryos, all displaying
        severe lens defects
    - reference_id: PMID:20177065
      supporting_text: >-
        we show that deletion of the Pax6b homeodomain in zebrafish embryos does not disturb pancreas
        development, whereas lens formation is strongly affected.
