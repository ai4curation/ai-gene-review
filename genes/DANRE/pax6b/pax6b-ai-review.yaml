  review:
    summary: >-
      pax6b is expressed in restricted brain domains (dorsal diencephalon, MHB, hindbrain) and contributes
      to brain development jointly with pax6a.
    action: ACCEPT
    reason: >-
      Correct at the ancestral node. pax6b has lost several brain-specific cis-elements and has a narrower
      brain expression than pax6a (PMID:18282108), but it keeps brain expression and takes part with pax6a
      in diencephalic and hindbrain patterning (PMID:24528677, PMID:17010333).
    supported_by:
