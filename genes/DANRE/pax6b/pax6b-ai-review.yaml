      cell division of the neuronal progenitors.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; retinal regeneration, both copies.
- id: PMID:20177065
  title: >-
    The Pax6b homeodomain is dispensable for pancreatic endocrine cell differentiation in zebrafish.
  findings:
  - statement: pax6b null mutants and morphants lack beta cells and gain epsilon cells.
    supporting_text: >-
      Pax6b-depleted embryos have almost no beta cells, a strongly reduced number of delta cells, and
      a significant increase of epsilon cells.
  - statement: The Pax6b homeodomain is needed for lens but not pancreas.
    supporting_text: >-
      we show that deletion of the Pax6b homeodomain in zebrafish embryos does not disturb pancreas development,
      whereas lens formation is strongly affected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; pax6b null allele sa0086 and pancreatic phenotype.
