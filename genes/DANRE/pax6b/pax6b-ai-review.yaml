- term:
    id: GO:0003310
    label: pancreatic A cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:20177065
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-100507-7
  review:
    summary: >-
      pax6b influences alpha-cell differentiation: partial knockdown increases alpha cells, while null
      mutants have misdifferentiated alpha cells.
    action: ACCEPT
    reason: >-
      The phenotype is dose-dependent and variable: small morpholino doses raise alpha-cell number and
      glucagon, about 40% of null mutants have fewer alpha cells, and alpha cells in null mutants are
      misdifferentiated (PMID:20177065, PMID:32867764). pax6b clearly acts upstream of or within alpha-cell
      differentiation, although less decisively than for beta cells.
    supported_by:
    - reference_id: PMID:20177065
      supporting_text: >-
        partial reduction of Pax6b function in zebrafish embryos performed by injection of small amounts
        of pax6b morpholinos caused a clear rise in alpha cell number and in glucagon expression
    - reference_id: PMID:20177065
      supporting_text: >-
        On the other hand, the fact that α cell differentiation is not strongly affected in about 60%
        of pax6b sa0086 mutants indicates that a Pax6b-independent pathway may also be used to generate
        glucagon cells.
    - reference_id: PMID:32867764
      supporting_text: >-
        Alpha cells are still generated in the pax6bsa0086 mutants, but these cells are misdifferentiated.
