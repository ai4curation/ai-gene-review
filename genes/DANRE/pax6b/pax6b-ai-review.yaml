  review:
    summary: UniRule-based annotation to DNA-templated transcription.
    action: MODIFY
    reason: >-
      pax6b is a sequence-specific transcription factor: it regulates transcription rather than carrying
      out the synthesis of RNA itself. The regulatory term is the appropriate process.
