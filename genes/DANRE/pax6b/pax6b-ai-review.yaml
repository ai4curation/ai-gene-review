- term:
    id: GO:0003309
    label: type B pancreatic cell differentiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:97488
  - MGI:MGI:97490
  - PANTHER:PTN002900580
  - RGD:3258
  - ZFIN:ZDB-GENE-001031-1
  review:
    summary: IBA transfer of beta-cell differentiation; confirmed experimentally for pax6b.
    action: ACCEPT
    reason: >-
      The IBA is consistent with pax6b's own IMP evidence (PMID:20177065, PMID:32867764); pax6b appearing
      among the IBA sources reflects experimental grounding on the target itself. Within the zebrafish
      pair, pax6b is the only copy expressed in the pancreas.
    supported_by:
    - reference_id: PMID:20177065
      supporting_text: >-
        We show here that pax6b does play an essential role in pancreatic endocrine cell differentiation,
        as revealed by the phenotype of a novel zebrafish pax6b null mutant and of embryos injected with
        pax6b morpholinos.
    - reference_id: PMID:18282108
      supporting_text: >-
        only pax6b is expressed in the pancreas isolated from 6 month old wild type and sri/sri fish,
        while eyes from the same individuals express both pax6a and pax6b
- term:
    id: GO:0003309
    label: type B pancreatic cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:20177065
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-100507-7
  review:
    summary: >-
      pax6b is required for pancreatic beta-cell differentiation; pax6b-deficient embryos have almost
      no beta cells.
    action: ACCEPT
    reason: >-
      Null mutant (sa0086) and three morpholinos give near-absence of beta cells (PMID:20177065), confirmed
      by RNA-seq of purified pancreatic endocrine cells (PMID:32867764). pax6b is the only pax6 copy expressed
      in the pancreas (PMID:18282108, PMID:18485195), so in zebrafish this ancestral PAX6 role is pax6b-specific.
    supported_by:
    - reference_id: PMID:20177065
      supporting_text: >-
        We show here that pax6b does play an essential role in pancreatic endocrine cell differentiation,
        as revealed by the phenotype of a novel zebrafish pax6b null mutant and of embryos injected with
        pax6b morpholinos.
    - reference_id: PMID:20177065
      supporting_text: >-
        Pax6b-depleted embryos have almost no beta cells, a strongly reduced number of delta cells, and
        a significant increase of epsilon cells.
    - reference_id: PMID:32867764
      supporting_text: >-
        pax6b loss-of-function does not affect the total number of EECs and PECs but instead disrupts
        the balance between endocrine cell subtypes, leading to an increase of ghrelin- and motilin-like-expressing
        cells in both the intestine and pancreas at the expense of other endocrine cells such as beta
        and delta cells in the pancreas and pyyb-expressing cells in the intestine.
    - reference_id: PMID:18282108
      supporting_text: >-
        only pax6b is expressed in the pancreas isolated from 6 month old wild type and sri/sri fish,
        while eyes from the same individuals express both pax6a and pax6b
- term:
    id: GO:0003309
    label: type B pancreatic cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:20177065
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-100610-3
  review:
    summary: >-
      pax6b is required for pancreatic beta-cell differentiation; pax6b-deficient embryos have almost
      no beta cells.
    action: ACCEPT
    reason: >-
      Null mutant (sa0086) and three morpholinos give near-absence of beta cells (PMID:20177065), confirmed
      by RNA-seq of purified pancreatic endocrine cells (PMID:32867764). pax6b is the only pax6 copy expressed
      in the pancreas (PMID:18282108, PMID:18485195), so in zebrafish this ancestral PAX6 role is pax6b-specific.
    supported_by:
    - reference_id: PMID:20177065
      supporting_text: >-
        We show here that pax6b does play an essential role in pancreatic endocrine cell differentiation,
        as revealed by the phenotype of a novel zebrafish pax6b null mutant and of embryos injected with
        pax6b morpholinos.
    - reference_id: PMID:20177065
      supporting_text: >-
        Pax6b-depleted embryos have almost no beta cells, a strongly reduced number of delta cells, and
        a significant increase of epsilon cells.
    - reference_id: PMID:32867764
      supporting_text: >-
        pax6b loss-of-function does not affect the total number of EECs and PECs but instead disrupts
        the balance between endocrine cell subtypes, leading to an increase of ghrelin- and motilin-like-expressing
        cells in both the intestine and pancreas at the expense of other endocrine cells such as beta
        and delta cells in the pancreas and pyyb-expressing cells in the intestine.
    - reference_id: PMID:18282108
      supporting_text: >-
        only pax6b is expressed in the pancreas isolated from 6 month old wild type and sri/sri fish,
        while eyes from the same individuals express both pax6a and pax6b
