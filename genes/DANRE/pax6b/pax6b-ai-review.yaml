- id: PMID:18282108
  title: >-
    Subfunctionalization of duplicated zebrafish pax6 genes by cis-regulatory divergence.
  findings:
  - statement: sunrise is a pax6b homeodomain missense (L244P) allele.
    supporting_text: >-
      Sequencing of sri homozygotes and heterozygotes identified a leucine to proline missense mutation
      in a highly conserved residue of the pax6b homeodomain (Figures 1B, S1B, and S1C).
  - statement: Only pax6b is expressed in the pancreas.
    supporting_text: >-
      only pax6b is expressed in the pancreas isolated from 6 month old wild type and sri/sri fish, while
      eyes from the same individuals express both pax6a and pax6b
  - statement: pax6a and pax6b activate reporters at equivalent levels.
    supporting_text: >-
      Activation by the two wild type co-orthologues through the P3 homeodomain target [45] (Figure 1D),
      or the CD19 paired domain target [46] (Figure 1E), was not significantly different, in contrast
      to the original observations by Nornes et al [43].
  - statement: The pax6b locus lost many ancestral cis-regulatory elements.
    supporting_text: >-
      On LG7 the pax6b locus and rcn1 and elp4 exons have been retained, but many of the pax6b control
      elements, as well as the wt1 homolog, have been lost.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; defines sunrise allele and the pair's cis-regulatory partition.
- id: PMID:18485195
  title: >-
    Expression of zebrafish pax6b in pancreas is regulated by two enhancers containing highly conserved
    cis-elements bound by PDX1, PBX and PREP factors.
  findings:
  - statement: pax6b pancreatic expression is driven by enhancers A and C.
    supporting_text: >-
      While both zebrafish pax6 genes are expressed in the developing eye and nervous system, only pax6b
      is expressed in the endocrine cells of the pancreas.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mechanism of pax6b-only pancreatic expression.
