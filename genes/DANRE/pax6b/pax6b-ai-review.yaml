- term:
    id: GO:0035883
    label: enteroendocrine cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:32867764
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-100507-7
  review:
    summary: >-
      pax6b loss disrupts the balance of enteroendocrine cell subtypes in the intestine.
    action: ACCEPT
    reason: >-
      pax6b null mutants gain ghrelin/motilin-like-expressing cells at the expense of other subtypes such
      as pyyb cells, in both intestine and pancreas (PMID:32867764); the pax6b P0 promoter drives enteroendocrine
      expression (PMID:18485195). A pax6b-specific role in zebrafish, matching the ancestral PAX6 role
      in gut endocrine cells.
    supported_by:
    - reference_id: PMID:32867764
      supporting_text: >-
        pax6b loss-of-function does not affect the total number of EECs and PECs but instead disrupts
        the balance between endocrine cell subtypes, leading to an increase of ghrelin- and motilin-like-expressing
        cells in both the intestine and pancreas at the expense of other endocrine cells such as beta
        and delta cells in the pancreas and pyyb-expressing cells in the intestine.
    - reference_id: PMID:18485195
      supporting_text: >-
        We show that the pax6b P0 promoter targets expression to endocrine pancreatic cells and also to
        enteroendocrine cells, retinal neurons and the telencephalon of transgenic zebrafish.
