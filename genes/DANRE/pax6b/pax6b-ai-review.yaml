- term:
    id: GO:0001654
    label: eye development
  evidence_type: IMP
  original_reference_id: PMID:18282108
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-100610-2
  review:
    summary: >-
      pax6b sunrise mutants and pax6b morphants have small eyes with lens and cornea defects.
    action: ACCEPT
    reason: >-
      sunrise (pax6b L244P) homozygotes show a fully penetrant microphthalmia with abnormal lens and cornea;
      two pax6b morpholinos give a more severe reduction in eye size (PMID:18282108). Eye development
      is a core, ancestral Pax6 role shared with pax6a; the milder phenotype than in mammals reflects
      role-sharing with pax6a.
    supported_by:
    - reference_id: PMID:18282108
      supporting_text: >-
        Sequencing of sri homozygotes and heterozygotes identified a leucine to proline missense mutation
        in a highly conserved residue of the pax6b homeodomain (Figures 1B, S1B, and S1C).
    - reference_id: PMID:18282108
      supporting_text: >-
        First, pax6b morpholino injections, using two different morpholinos, resulted in reduced eye size,
        a phenotype overlapping the sri phenotype, but somewhat more severe, as total eye size reduction
        (Figure 3A and 3B) rather than just small lens size [27] (Figure 1A) was observed.
    - reference_id: PMID:18282108
      supporting_text: The mild phenotype emphasizes role-sharing between the co-orthologues.
