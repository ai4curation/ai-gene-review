      pax6b restricts the epsilon fate: its loss causes a significant increase of epsilon cells (PMID:20177065,
      PMID:32867764). The annotation (acts upstream of or within epsilon cell differentiation) correctly
      records involvement without implying promotion.
    supported_by:
