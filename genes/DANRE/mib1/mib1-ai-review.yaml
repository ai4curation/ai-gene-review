core_functions:
- description: RING-type E3 ubiquitin ligase that binds and ubiquitinates the intracellular domains of
    Delta (and Jagged) Notch ligands in the signal-sending cell, promoting their endocytosis, which is
    required for ligand-mediated activation of Notch receptors in trans.
  molecular_function:
