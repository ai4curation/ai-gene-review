id: Q804S5
gene_symbol: mib1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'mib1 (mind bomb) encodes a large multidomain RING-type E3 ubiquitin-protein ligase (1030
  aa) with N-terminal MZM (Mib/Herc2) and ZZ-zinc-finger modules that bind Notch ligands, a central ankyrin-repeat
  region, and three C-terminal RING fingers, the most C-terminal of which is required for ligase activity.
  Mib1 acts in the signal-sending cell: it binds the intracellular domains of Delta ligands (DeltaA, DeltaC,
  DeltaD) and also Jagged/Serrate ligands, ubiquitinates them, and drives their endocytosis, which is
  required for ligands to activate Notch receptors in trans (but not for cis-inhibition). Mib1 localises
  to the cytoplasm, the plasma membrane and endocytic vesicles. Loss of mib1 (the classical "mind bomb"
  neurogenic mutant, including antimorphic RING-finger alleles such as ta52b) abolishes most Delta-Notch
  signalling in the zebrafish embryo, producing excess early neurons, loss of radial glia and neural crest
  derivatives, excess inner-ear hair cells, somite segmentation defects, and defects in vascular, hematopoietic,
  pronephric, intestinal secretory and other Notch-dependent cell fate decisions. The paralog Mib2 is
  partially redundant.'
