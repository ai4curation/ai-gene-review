      Notch in a neighboring cell (in trans) it is not required for DeltaD to inhibit function of Notch
      receptors in the same cell (in cis).
suggested_questions:
- question: Which zebrafish Notch ligands (DeltaA/B/C/D, JaggedA/B/2) depend strictly on Mib1 versus Mib2
    or Neuralized homologs in each tissue?
- question: Do the non-Notch Mib1 substrates identified by two-hybrid screens (Trabid, Fih-1) account
    for any Notch-independent mib1 phenotypes?
suggested_experiments:
- description: Tissue-specific rescue of mib1 mutants with ligase-dead versus wild-type Mib1 to separate
    Notch-dependent and independent phenotypes.
- description: Quantitative ubiquitin-site mapping on Dla/Dlc/Dld/Jag intracellular domains in the presence
    of Mib1 versus Mib2.
