  - ZFIN:ZDB-GENO-171005-7
  review:
    summary: 'Protein localization to cilium: Pcdh15a fails to reach the hair bundle in lhfpl5a mutants.'
    action: MODIFY
    reason: 'The observation is sound: tagged and endogenous Pcdh15a stay in the cell body of lhfpl5a mutant hair
      cells, and the authors infer that Lhfpl5a is needed for transport to the hair bundle. But the destination
      is the stereocilia, which are actin-based microvillar projections and not cilia; GO:0032420 stereocilium is
      not a descendant of cilium. GO has no protein-localization-to-stereocilium term, so the nearest correct term
      is protein localization to plasma membrane (Pcdh15a is a transmembrane tip-link protein that must reach the
      stereocilia membrane).'
    proposed_replacement_terms:
    - id: GO:0072659
      label: protein localization to plasma membrane
