core_functions:
- description: 'Accessory transmembrane subunit of the inner-ear hair-cell MET complex at stereocilia tips: transmits
    tip-link tension to the channel (mouse LHFPL5) and is needed to bring Pcdh15a to the hair bundle; required for
    transduction in all inner-ear sensory patches. Recorded as a contribution to the channel complex''s activity.'
  contributes_to_molecular_function:
    id: GO:0140135
    label: mechanosensitive monoatomic cation channel activity
  directly_involved_in:
  - id: GO:0050974
    label: detection of mechanical stimulus involved in sensory perception
  - id: GO:0007605
    label: sensory perception of sound
  locations:
  - id: GO:0032426
    label: stereocilium tip
  supported_by:
  - reference_id: PMID:32009898
    supporting_text: 'Here we show that the zebrafish lhfpl5 genes are expressed in discrete populations of hair
      cells: lhfpl5a expression is restricted to auditory and vestibular hair cells in the inner ear, while lhfpl5b
      expression is specific to hair cells of the lateral line organ.'
  - *id002
  - *id004
  - *id003
  - reference_id: PMID:38194445
    supporting_text: We conclude that tip-link tension is transmitted to the channel primarily via LHFPL5; residual
      activation without LHFPL5 may occur by direct interaction between PCDH15 and TMC1.
suggested_questions:
- question: Does Lhfpl5b rescue lhfpl5a mutant inner-ear hair cells when expressed there? The reverse rescue (Lhfpl5a
    in lhfpl5b mutant neuromasts) works; the reciprocal would complete the evidence that the two proteins are interchangeable.
- question: Is lhfpl5b ever expressed in adult inner-ear hair cells, or is the ear/lateral-line split maintained
    for life?
- question: What protein links Lhfpl5a to Cdh23 and Myo7aa for its localization at kinocilial links, given that
    no direct LHFPL5-CDH23 interaction has been detected?
suggested_experiments:
- hypothesis: The lhfpl5a/lhfpl5b split is purely regulatory.
  description: Express GFP-Lhfpl5b from a pan-hair-cell (myo6b) or lhfpl5a promoter in lhfpl5a tm290d mutants and
    score acoustic startle, inner-ear microphonics and FM dye uptake.
  experiment_type: cross-rescue
- hypothesis: The cis-regulatory elements that restrict lhfpl5a to the ear and lhfpl5b to the lateral line are ancestral
    elements partitioned between the copies.
  description: Test gar lhfpl5 upstream sequences in zebrafish reporter assays for activity in both inner-ear and
    lateral-line hair cells; compare with the lhfpl5b 2 kb promoter that already drives lateral-line-specific expression.
  experiment_type: enhancer reporter assay
