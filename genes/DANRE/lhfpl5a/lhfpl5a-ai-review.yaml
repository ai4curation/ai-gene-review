description: lhfpl5a (LHFPL tetraspan subfamily member 5a) is one of two zebrafish co-orthologs of vertebrate LHFPL5
  (TMHS), retained from the teleost-specific genome duplication; its paralog is lhfpl5b. It encodes a small four-pass
  membrane protein of the tetraspan junctional protein superfamily that acts as an accessory subunit of the hair-cell
  mechanoelectrical transduction (MET) complex. GFP-Lhfpl5a sits at the tips of stereocilia and is enriched at the
  tallest stereocilia next to the kinocilium; its bundle localization depends on Pcdh15a, Cdh23 and Myo7aa, and
  Lhfpl5a in turn is needed to bring the tip-link protein Pcdh15a to the hair bundle. It is not needed for bundle
  targeting of Tmc1 or Tmc2b. lhfpl5a is expressed only in hair cells of the inner ear (maculae and cristae), from
  1 dpf into adulthood, and not in the lateral line. The astronaut (tm290d) nonsense mutant has no transduction
  in any inner-ear sensory patch and is deaf and balance-defective, with splayed hair bundles, while lateral-line
  hair cells, which use lhfpl5b, work normally.
