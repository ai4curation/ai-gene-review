suggested_questions:
- question: Is olfm3b a low-expressed copy on the way to loss, or does it have a restricted adult domain (intestine,
    ovary, specific brain nuclei) that olfm3a lacks?
- question: Which medaka OLFM3 copy is orthologous to olfm3b, and is its expression pattern similar?
suggested_experiments:
- hypothesis: olfm3b has an adult-restricted expression domain complementary to olfm3a.
  description: Paralog-specific HCR in situ hybridization for olfm3a and olfm3b in adult brain, retina, intestine and
    ovary.
  experiment_type: expression analysis
- hypothesis: olfm3b protein is functionally equivalent to olfm3a.
  description: Test whether olfm3b coding sequence expressed from the olfm3a locus restores any olfm3a mutant phenotype,
    or whether both proteins co-purify with GluA complexes when tagged.
  experiment_type: cross-rescue
