taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: olfm3b (olfactomedin 3b) is one of two zebrafish co-orthologs of vertebrate OLFM3 (optimedin, noelin-3),
  retained from the teleost-specific genome duplication; its paralog is olfm3a. It encodes a secreted glycoprotein
  with a signal peptide, an N-terminal coiled-coil region and a C-terminal olfactomedin (beta-propeller) domain, and
  belongs to the noelin subfamily with OLFM1 and OLFM2. In mammals OLFM3 is expressed in retina, brain and the
  anterior eye, forms homo- and hetero-oligomers with other noelins and binds myocilin, and the noelins together are
  extracellular constituents of AMPA-type glutamate receptor complexes that anchor the receptors at synapses. The
  zebrafish protein keeps the coiled coil, the olfactomedin domain and the cysteines of human OLFM3. olfm3b is
  expressed at low levels throughout embryonic and larval development; public RNA-seq detects it in adult brain,
  intestine and ovary. No functional study of this gene has been published.
