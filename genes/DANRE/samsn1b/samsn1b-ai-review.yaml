gene_symbol: samsn1b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: samsn1b (SAM domain, SH3 domain and nuclear localization signals 1b) is one of two zebrafish
  co-orthologs of vertebrate SAMSN1 (HACS1, SLy2, NASH1); its paralog is samsn1a. It encodes an intracellular
  adaptor of the SLy/SASH1 family with an N-terminal disordered region, a central SH3 domain and a C-terminal
  SAM domain. In mammals SAMSN1 is expressed mainly in hematopoietic cells, is found in cytoplasm and
  nucleus, is induced by B-cell activation signals, binds tyrosine-phosphorylated proteins and, through its
  SH3 domain, the inhibitory receptor PIRB, and acts as an inhibitory adaptor that dampens B-cell activation
  (mouse knockout B cells are hyper-responsive). The zebrafish protein keeps a conserved SH3 domain (77%
  identical to human SAMSN1) but is much longer than human SAMSN1 and only 38% identical to samsn1a overall.
  samsn1b has a brief gastrula expression peak and is otherwise mainly larval and adult; in situ
  hybridization detects it in the pineal organ (epiphysis) and the retinal photoreceptor layer, and bulk
  RNA-seq places it highest in retina and granulocytes, with lower calls in spleen and head kidney. No
  functional study of the zebrafish gene has been published.
