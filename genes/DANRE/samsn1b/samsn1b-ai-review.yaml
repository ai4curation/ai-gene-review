- term:
    id: GO:0050869
    label: negative regulation of B cell activation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1914992
  - PANTHER:PTN002642349
  review:
    summary: Negative regulation of B cell activation, propagated from the SAMSN1 node PTN002642349, whose
      experimental seed is the mouse Hacs1 (Samsn1) knockout.
    action: ACCEPT
    reason: The IBA places the function at a node that contains both zebrafish SAMSN1 co-orthologs. The seed
      evidence is sound (Hacs1-/- B cells hyper-proliferate on BCR stimulation and show increased tyrosine
      phosphorylation), and the SH3 domain that mediates the PIRB interaction is 77% identical between
      samsn1b and human SAMSN1. Although the curated in situ data for samsn1b are pineal and photoreceptor,
      bulk RNA-seq detects samsn1b in granulocytes, spleen and head kidney, so there is no evidence that this
      copy has left immune cells. The function has not been tested in zebrafish; the annotation is accepted as
      a phylogenetic inference, and the same call is made for samsn1a. If paralog-resolved single-cell data
      later show samsn1b absent from lymphocytes, this row should be revisited.
    supported_by:
    - reference_id: PMID:19923443
      supporting_text: Purified splenic B cells from Hacs1(-/-) mice showed increased cell proliferation on BCR
        (B-cell receptor) stimulation.
    - reference_id: PMID:19923443
      supporting_text: This study suggests that Hacs1 is an immunoinhibitory adaptor that might be a useful
        target for immune suppression therapy.
    - reference_id: file:DANRE/samsn1a/samsn1a-bioinformatics/RESULTS.md
      supporting_text: The SH3 domain is the best-conserved part of both copies
- term:
    id: GO:1902531
    label: regulation of intracellular signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000266438
  - UniProtKB:O94885
  review:
    summary: Regulation of intracellular signal transduction, propagated from the SLy/SASH1 family node
      PTN000266438 (seeded by human SASH1).
    action: ACCEPT
    reason: A broad but appropriate process for an SH3-SAM adaptor of the SLy/SASH1 family. The mammalian
      family members act as intracellular signalling adaptors, and SAMSN1 itself associates with
      tyrosine-phosphorylated proteins after B-cell receptor stimulation. samsn1b keeps the SH3 and SAM
      domains that define the family. The term is general, but no more specific process is established
      across the family.
    supported_by:
    - reference_id: PMID:33710696
      supporting_text: Intracellular adaptor proteins are indispensable for the transduction of receptor-derived
        signals, as they recruit and connect essential downstream effectors.
    - reference_id: PMID:15381729
      supporting_text: HACS1 associates with tyrosine-phosphorylated proteins after B cell activation and binds
        in vitro to the inhibitory molecule paired Ig-like receptor B.
core_functions:
- description: SH3-SAM intracellular signalling adaptor of the SLy/SASH1 family, expressed in retina
    (photoreceptor layer), pineal organ and, at lower levels, granulocytes and hematopoietic organs; by
    homology with mammalian SAMSN1 an inhibitory adaptor in immune-receptor signalling. No activity has been
    measured for the zebrafish protein, so no molecular function term is asserted.
  directly_involved_in:
  - id: GO:1902531
    label: regulation of intracellular signal transduction
  - id: GO:0050869
    label: negative regulation of B cell activation
  supported_by:
  - reference_id: PMID:33188360
    supporting_text: Here, we describe the interaction between the HACS1 SH3 domain and a sequence near the
      third immunoreceptor tyrosine-based inhibition motif (ITIM3) of the paired immunoglobulin receptor B
      (PIRB).
  - reference_id: file:DANRE/samsn1a/samsn1a-bioinformatics/RESULTS.md
    supporting_text: Both copies have RNA-seq calls in granulocyte, spleen and head kidney, so the hematopoietic
      domain is not cleanly partitioned.
