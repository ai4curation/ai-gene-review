suggested_questions:
- question: Is samsn1b expressed in any zebrafish lymphocyte or myeloid population at the single-cell level, or
    only in retina, pineal and granulocyte-rich bulk samples?
- question: Does gar SAMSN1 show pineal or photoreceptor expression, which would make the samsn1b domain
    ancestral rather than new?
suggested_experiments:
- hypothesis: samsn1b is a photoreceptor and pineal copy, while samsn1a is the blood-cell copy.
  description: Paralog-specific HCR in situ for samsn1a and samsn1b in larval retina, pineal, kidney marrow and
    circulating blood, together with gar SAMSN1 in situ on gar larvae.
  experiment_type: expression analysis
- hypothesis: samsn1b contributes to immune regulation redundantly with samsn1a.
  description: Compare single and double mutants (RNA-less alleles where possible) for adult B-cell responses
    and larval myeloid inflammatory responses; check transcriptional adaptation of the paralog in each single
    mutant.
  experiment_type: genetic interaction
