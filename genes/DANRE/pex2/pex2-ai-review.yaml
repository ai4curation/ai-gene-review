    summary: |-
      Response to amino acid starvation (ISS from human PEX2). In mammalian cells PEX2 is up-regulated on amino acid starvation and rapamycin treatment, and ubiquitylates PEX5 and PMP70 under those conditions, linking mTORC1 signalling to peroxisome turnover [PMID:27597759].
