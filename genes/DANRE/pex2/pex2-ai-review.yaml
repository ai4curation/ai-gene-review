    label: response to amino acid starvation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: |-
      Response to amino acid starvation (ISS from human PEX2). In mammalian cells PEX2 is up-regulated on amino acid starvation and rapamycin treatment, and ubiquitylates PEX5 and PMP70 under those conditions, linking mTORC1 signalling to peroxisome turnover [PMID:27597759].
    action: KEEP_AS_NON_CORE
    reason: |-
      Retained: the protein is an effector of the starvation response rather than merely responsive to it, since its ligase activity executes the resulting pexophagy. Non-core because the evidence is from mammalian cell culture with no zebrafish counterpart, and the term describes a condition-specific deployment of the core activity.
