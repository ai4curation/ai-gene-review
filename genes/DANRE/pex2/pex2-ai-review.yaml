gene_symbol: pex2
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  pex2 encodes peroxin 2, a RING-finger E3 ubiquitin ligase embedded in the peroxisomal membrane. With Pex10 and Pex12 it forms the peroxisomal retrotranslocation channel: the three subunits each contribute five transmembrane segments to an open pore, and their RING domains sit as a cytosolic tower above it, with Pex2's RING positioned over the pore mouth. The cargo receptor PEX5 delivers matrix proteins into the peroxisome, is threaded into this pore and is monoubiquitylated there so that it can be extracted back to the cytosol for reuse; when recycling fails, polyubiquitylation by the neighbouring RING domains sends the receptor for degradation. The same ligase also drives pexophagy, ubiquitylating PEX5 and PMP70 during amino acid starvation. In zebrafish, disrupting pex2 abolishes normal peroxisomal structure and reproduces Zellweger syndrome, including organ-specific fatty-acid derangements such as brain accumulation of ultra-very-long-chain polyunsaturated fatty acids.
