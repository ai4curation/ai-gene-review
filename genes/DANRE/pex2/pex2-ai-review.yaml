    label: protein import into peroxisome matrix, receptor recycling
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: |-
      Protein import into peroxisome matrix, receptor recycling (ISS from human PEX2). Recycling of PEX5 requires its modification by the Pex2-Pex10-Pex12 ligase, and monoubiquitylation by Pex2's RING enables extraction of the receptor back into the cytosol [PMID:35768507].
    action: ACCEPT
    reason: |-
      This names precisely the step the gene product performs - it catalyses the modification that licenses receptor extraction - so participation is direct rather than inferred from a requirement. It is the process form of the core molecular function and the best-scoped import-related term for this protein.
