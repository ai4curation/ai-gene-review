  review:
    summary: |-
      Peroxisome organization, IMP from zebrafish pex2 mutants: disruption of the gene yields a Zellweger syndrome model with loss of peroxisomal structure and high mortality, and organ-specific fatty-acid changes including brain accumulation of ultra-VLC-PUFAs [PMID:34016526].
    action: ACCEPT
