- id: PMID:34016526
  title: Zebrafish model of human Zellweger syndrome reveals organ-specific accumulation of distinct fatty acid species and widespread gene expression changes.
  findings:
  - statement: Disrupting zebrafish pex2 produces a Zellweger syndrome model with the pathology and metabolic changes seen in patients.
    supporting_text: By disrupting the zebrafish pex2 gene, we established a disease model for ZS and found that it exhibits pathological features and metabolic changes similar to those observed in human patients.
  - statement: pex2 mutant fish accumulate ultra-very-long-chain PUFAs in brain, with organ-specific fatty-acid changes.
    supporting_text: we found organ-specific accumulation and reduction of distinct fatty acid species, such as an accumulation of ultra-very-long-chain polyunsaturated fatty acids (ultra-VLC-PUFAs) in the brains of pex2 mutant fish
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Abstract-only in the cache (full_text_available: false); title matches (Takashima et al. 2021, Mol Genet Metab). The only zebrafish study: a pex2 disruption line used as a Zellweger syndrome model, with organ-specific fatty-acid profiling and transcriptomics. UniProt cites it for the disruption phenotype (loss of peroxisomal structure, high mortality), which is what the three peroxisome-organization IMP rows rest on; the detailed peroxisome imaging is in the full text that is not cached, so the curator's rows are accepted rather than re-adjudicated from the abstract.
- id: file:DANRE/pex2/pex2-uniprot.txt
  title: UniProtKB entry E7F4V8 for Danio rerio pex2
  findings:
  - statement: UniProt describes Pex2 as the E3 ligase subunit of the retrotranslocation channel that exports PEX5 for recycling.
    supporting_text: E3 ubiquitin-protein ligase component of a retrotranslocation channel required for peroxisome organization by mediating export of the PEX5 receptor from peroxisomes to the cytosol, thereby promoting PEX5 recycling
  - statement: The channel is built from PEX2, PEX10 and PEX12 transmembrane segments, with the RING zinc fingers above the pore on the cytosolic side.
    supporting_text: The RING-type zinc-fingers that catalyze PEX5 receptor ubiquitination are positioned above the pore on the cytosolic side of the complex.
  - statement: Zebrafish pex2 mutants lose peroxisomal structure and show high mortality (PubMed:34016526).
    supporting_text: Mutant fishes show a loss of peroxisomal structure, associated with high-mortality
