core_functions:
- description: 'RING E3 ubiquitin ligase subunit of the peroxisomal retrotranslocation channel: with Pex10 and Pex12 it forms the membrane pore through which the import receptor PEX5 is extracted, and its RING finger, positioned over the pore, monoubiquitylates the receptor so that it can return to the cytosol and be reused. This recycling step is what sustains matrix protein import and hence peroxisome biogenesis.'
