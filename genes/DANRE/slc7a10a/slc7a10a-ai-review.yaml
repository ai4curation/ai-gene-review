  label: Danio rerio
description: slc7a10a (solute carrier family 7 member 10a) is one of two zebrafish co-orthologs of vertebrate SLC7A10 (Asc-1),
  retained from the teleost-specific genome duplication; its paralog is slc7a10b. It encodes a 12-helix light subunit of
  the heterodimeric amino acid transporters. In mammals Asc-1 is disulfide-linked to the heavy chain 4F2hc (SLC3A2) and
  mediates sodium-independent exchange of small neutral amino acids, including glycine, L-serine, L-alanine and D-serine;
  it supplies glycine for inhibitory synapses in the brainstem and spinal cord, regulates D-serine levels, and in adipocytes
  supports serine uptake and limits lipid storage. slc7a10a keeps every Asc-1 residue shown to matter for substrate binding
  and gating and the cysteine that links the heavy chain. It is the more broadly expressed copy, rising in larvae and detected
  in adult brain, bone, heart, kidney, muscle and other tissues. No functional study of slc7a10a has been published.
