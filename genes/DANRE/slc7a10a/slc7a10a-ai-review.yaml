suggested_questions:
- question: Is the broad slc7a10a expression (heart, kidney, muscle, intestine) a teleost gain, or the ancestral pattern
    that gar Bgee data miss? Mammalian SLC7A10 is expressed in several peripheral tissues.
- question: Which copy supplies glycine at inhibitory synapses of the zebrafish hindbrain and spinal cord, the role that
    makes mouse Slc7a10 essential?
- question: Which slc3a2 paralog (slc3a2a or slc3a2b) partners each Slc7a10 copy?
suggested_experiments:
- hypothesis: The two copies are equivalent transporters.
  description: Co-express each zebrafish Slc7a10 copy with zebrafish slc3a2a in Xenopus oocytes and compare uptake and exchange
    of glycine, L-serine, L-alanine and D-serine.
  experiment_type: transport assay
- hypothesis: slc7a10a and slc7a10b act redundantly in glycinergic neurotransmission.
  description: Make single and double mutants (including a promoter-deletion allele to avoid transcriptional adaptation)
    and test startle and touch-evoked escape behaviour and spinal glycine levels, as for mouse Slc7a10 knockouts.
  experiment_type: knockout phenotyping
