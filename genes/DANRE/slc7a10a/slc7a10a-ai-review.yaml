core_functions:
- description: Light subunit of an Asc-1-type heterodimeric amino acid transporter (predicted to pair with a 4F2hc/slc3a2
    heavy chain) that exchanges small neutral L- and D-amino acids (glycine, L-alanine, L-serine, D-serine) across the plasma
    membrane. All tested Asc-1 functional residues are conserved; the activity is inferred from orthology, not measured
    for the zebrafish protein.
