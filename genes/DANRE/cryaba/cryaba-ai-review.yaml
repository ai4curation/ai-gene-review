- id: PMID:15692462
  title: 'Zebrafish alpha-crystallins: protein structure and chaperone-like activity
    compared to their mammalian orthologs.'
  findings:
    - statement: >-
        Zebrafish alphaB-crystallin (cryaba) has reduced chaperone-like activity
        compared to zebrafish alphaA-crystallin and mammalian orthologs.
      supporting_text: >-
        The chaperone-like activities of the two zebrafish alpha-crystallins were
        highly divergent, with alphaA-crystallin showing much greater activity than
        alphaB-crystallin.
- id: PMID:16420472
  title: Gene duplication and separation of functions in alphaB-crystallin from zebrafish
    (Danio rerio).
  findings:
    - statement: >-
        Zebrafish express two alphaB-crystallins after gene duplication. cryaba
        (alphaB1) is predominantly lens-specific while cryabb (alphaB2) retains
        broad expression similar to mammalian CRYAB. The 0.16% lens-protein
        abundance, the broad RT-PCR expression and the chaperone assays reported in
        this paper refer to alphaB2 (cryabb), not cryaba. The authors conclude that
        cryaba adopted a restricted, nonchaperone role in the lens.
      supporting_text: >-
        zebrafish alphaB2 maintained the widespread protective role also found in
        mammalian alphaB-crystallin, while zebrafish alphaB1 adopted a more
        restricted, nonchaperone role in the lens.
      finding_review:
        finding_status: DISPUTED
        superseded_by:
        - PMID:26378715
        - PMID:29162721
        review_notes: >-
          The expression partition (cryaba lens-restricted, cryabb broad) stands. The
          nonchaperone interpretation of cryaba rested on aggregation-suppression
          assays (PMID:15692462); equilibrium binding assays show cryaba (alphaBa) is
          a highly active chaperone, binding destabilized substrate with higher
          affinity than cryabb or human CRYAB (PMID:26378715), and CRISPR loss of
          cryaba causes lens defects (PMID:29162721).
        supported_by:
        - reference_id: PMID:26378715
          supporting_text: >-
            However, variations in activity within the zebrafish αB chains were also
            apparent in which αBa-S bound the destabilized substrate with an order of
            magnitude higher affinity and with greater capacity than αBb (Table 5).
        - reference_id: PMID:26378715
          supporting_text: >-
            This led to the hypothesis that αBa has little utility as a chaperone in
            the lens.
- id: PMID:10542326
  title: Cloning, sequencing and differential expression of alphaB-crystallin in the
    zebrafish, Danio rerio.
  findings:
    - statement: >-
        The first-cloned zebrafish alphaB-crystallin (cryaba; mRNA AF159089/AAD49096)
        lacks four C-terminal residues implicated in protein-protein interactions and
        is expressed at extremely low levels outside the lens.
      supporting_text: >-
        Northern analysis and semi-quantitative RT-PCR indicate that zebrafish
        alphaB-crystallin is expressed at extremely low levels outside of the lens.
- id: PMID:18449354
  title: A proteome map of the zebrafish (Danio rerio) lens reveals similarities between
    zebrafish and mammalian crystallin expression.
  findings:
    - statement: >-
        alphaBa-crystallin (cryaba) is about 2.56% and alphaBb (cryabb) about 0.72% of
        adult zebrafish lens protein; no phosphorylated alphaBa or alphaBb was found.
      supporting_text: >-
        The higher expression of the lens specific αBa-crystallin compared to the
        ubiquitous αBb-crystallin (2.56% and 0.72%, respectively) suggests that
        αBa-crystallin plays a more prominent role in the zebrafish lens.
- id: PMID:18406404
  title: Lengsin expression and function during zebrafish lens formation.
  findings:
    - statement: >-
        alphaB1-crystallin (cryaba) localizes around the entire fiber cell membrane
        in zebrafish lens, producing a honeycomb appearance in cross-sectional
        profiles.
- id: PMID:25866181
  title: In vivo characterization of human myofibrillar myopathy genes in zebrafish.
  findings:
    - statement: >-
        Morpholino knockdown of myofibrillar myopathy genes including cryaba in
        zebrafish led to compromised skeletal muscle function, myofibrillar
        degeneration, and severe heart failure.
      supporting_text: >-
        targeted ablation of MFM genes in zebrafish led to compromised skeletal
        muscle function mostly due to myofibrillar degeneration as well as severe
        heart failure.
- id: PMID:26378715
  title: 'Species-Specific Structural and Functional Divergence of α-Crystallins: Zebrafish
    αBa- and Rodent αA(ins)-Crystallin Encode Activated Chaperones.'
  findings:
    - statement: >-
        In equilibrium binding assays both zebrafish alphaB paralogs bind destabilized
        T4 lysozyme more strongly than human alphaB-crystallin, and alphaBa (cryaba)
        binds with about an order of magnitude higher affinity and greater capacity
        than alphaBb (cryabb), resembling a constitutively activated sHSP.
      supporting_text: >-
        Notably, we find that αA(ins) and αBa demonstrate substantially enhanced
        chaperone function relative to other α-crystallins, binding the same substrate
        more than 2 orders of magnitude higher affinity and mimicking the activity of
        fully activated mammalian small heat shock proteins.
- id: PMID:29162721
  title: Loss of αB-crystallin function in zebrafish reveals critical roles in the development
    of the lens and stress resistance of the heart.
  findings:
    - statement: >-
        CRISPR null alleles of cryaba and cryabb each cause dosage-sensitive embryonic
        lens defects (more penetrant for cryaba) and hypersensitivity to stress-induced
        pericardial edema, but no skeletal muscle phenotype; the paralogs do not
        compensate transcriptionally for each other.
      supporting_text: >-
        We observed lens abnormalities in the mutant lines of both genes, and the
        penetrance of the lens phenotype was higher in αBa than αBb mutants.
- id: PMID:36572168
  title: Impact of α-crystallin protein loss on zebrafish lens development.
  findings:
    - statement: >-
        A second set of CRISPR mutants found no substantial early lens defects after
        loss of cryaba.
      supporting_text: >-
        Loss of αBa-crystallin produced no substantial lens defects.
- id: PMID:37577747
  title: Interplay between Nrf2 and αB-crystallin in the lens and heart of zebrafish
    under proteostatic stress.
  findings:
    - statement: >-
        Combined loss of nrf2 and cryaba upregulates lens cholesterol biosynthesis;
        cryabb, but not cryaba, is transcriptionally induced by Nrf2 loss.
      supporting_text: >-
        Taken together, these results suggested a transcriptional link between nrf2
        and cryabb but not cryaba.
- id: PMID:38705506
  title: "Loss of \u03B1Ba-crystallin, but not \u03B1A-crystallin, increases age-related\
    \ cataract in the zebrafish lens."
  findings:
    - statement: >-
        Loss of cryaba increases age-related cataract in zebrafish more than loss
        of cryaa. An ontogenetic shift occurs from cryaa predominance at 5-6 dpf
        to increased cryaba importance after 10 dpf.
      supporting_text: >-
        we found that the loss of the alphaBa-crystallin gene cryaba led to an
        increase in lens opacity compared to cryaa null fish at 24 months of age.
- id: file:DANRE/cryaba/cryaba-deep-research-falcon.md
  title: >-
    Falcon (Edison) deep research report: zebrafish cryaba (Q9PUR2) functional
    annotation of alphaBa-crystallin
  findings:
    - statement: >-
        cryaba is one of two zebrafish alphaB-crystallin paralogs (cryaba/cryabb)
        from the teleost genome duplication; it encodes a ~168 aa small heat shock
        protein with ~61% homology to human CRYAB/HSPB5 and has lower baseline
        chaperone activity than cryabb, consistent with functional divergence.
      reference_section_type: OTHER
      supporting_text: |
        A zebrafish crystallin review reports cryaba encodes a ~**168 aa** protein with ~**61%** homology to human CRYAB/HSPB5, while cryabb is ~180 aa (~58% homology). The same review summarizes that cryaba has **lower baseline chaperone activity than cryabb**, consistent with functional divergence after duplication.
    - statement: >-
        Small heat shock proteins including cryaba act as ATP-independent holdase
        chaperones that bind partially unfolded or destabilized proteins to inhibit
        aggregation and maintain proteostasis under stress.
      reference_section_type: OTHER
      supporting_text: |
        they bind partially unfolded or destabilized proteins to **inhibit aggregation**, maintaining proteostasis under basal conditions and especially during stress.
    - statement: >-
        In zebrafish lens biology, alphaB-crystallin contributes to lysosomal
        homeostasis by binding and stabilizing an ATP6V1A-mTORC1 complex to maintain
        lysosomal acidity and signaling during fiber-cell organelle degradation.
      reference_section_type: OTHER
      supporting_text: |
        The review further summarizes mechanistic data (zebrafish plus complementary mammalian experiments) in which \u03B1B\u2011crystallin binds and stabilizes an **ATP6V1A\u2013mTORC1 complex**, preventing degradation and maintaining lysosomal acidity and signaling.
    - statement: >-
        cryaba acts downstream of Hsf4 in lens proteostasis; in hsf4-/- zebrafish
        lenses cryaba expression decreases and lysosomal pH increases.
      reference_section_type: OTHER
      supporting_text: |
        A zebrafish crystallin review summarizes that in **hsf4\u2212/\u2212** zebrafish lenses, cryaba expression decreases and lysosomal pH is increased, consistent with cryaba acting downstream of lens stress/proteostasis regulation to maintain lysosomal function required for organelle degradation in differentiating fibers.
    - statement: >-
        cryaba intersects the Nrf2 oxidative stress response; combined loss of nrf2
        and cryaba in lens upregulated cholesterol biosynthesis, and cryaba
        loss-of-function contributes to stress-induced heart edema worsened by nrf2
        deficiency.
      reference_section_type: OTHER
      supporting_text: |
        Park et al. (2023) report that cryaba loss\u2011of\u2011function contributes to **stress\u2011induced heart edema**, and that compromised **nrf2** function **increases penetrance** of the cardiac phenotype (including in cryaba\u2212/\u2212; nrf2 double mutants).
    - statement: >-
        Lens phenotype penetrance is method-dependent; CRISPR null cryaba-/- larvae
        showed no significant early lens defects whereas morpholino knockdown caused
        ~50% lens abnormalities, cautioning interpretation of morpholino-only
        phenotypes.
      reference_section_type: OTHER
      supporting_text: |
        one CRISPR study reported **no significant early lens defects** for cryaba\u2212/\u2212 (and cryabb\u2212/\u2212) and suggested low early lens expression could explain mild phenotypes; it also emphasizes disagreement with earlier high\u2011penetrance reports.
core_functions:
  - molecular_function:
      id: GO:0005212
      label: structural constituent of eye lens
    directly_involved_in:
      - id: GO:0036438
        label: maintenance of lens transparency
    locations:
      - id: GO:0005737
        label: cytoplasm
      - id: GO:0005886
        label: plasma membrane
    description: >-
      cryaba is a predominantly lens-specific alpha-crystallin that serves as a
      structural protein in zebrafish lens fiber cells. It localizes around the
      entire fiber cell membrane (PMID:18406404) and its loss leads to increased
      age-related cataract (PMID:38705506). cryaba plays a leading role in
      preventing age-related cataract, with an ontogenetic shift from cryaa
      predominance in early development to cryaba importance during lens aging
      (PMID:38705506).
  - proposed_molecular_function: holdase chaperone activity
    directly_involved_in:
      - id: GO:0009408
        label: response to heat
    locations:
      - id: GO:0005737
        label: cytoplasm
    description: >-
      cryaba is an active holdase chaperone. Its activity appeared weak relative to
      zebrafish cryaa in aggregation-suppression assays (PMID:15692462), but in
      equilibrium binding assays it binds destabilized substrate more strongly than
      its paralog cryabb or human CRYAB, behaving like a constitutively activated
      sHSP (PMID:26378715). The earlier proposal that cryaba adopted a nonchaperone
      role in the lens (PMID:16420472) is therefore disputed. After gene duplication
      its expression became essentially lens-restricted in adults (PMID:10542326),
      so its chaperone activity acts mainly in lens fiber cells.
proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: >-
    Binding to an unfolded or misfolded protein to prevent its aggregation without actively
    catalyzing refolding. The holdase maintains the client protein in a soluble, folding-competent
    state. This is mechanistically distinct from foldase activity (GO:0044183) and from
    carrier-holdase activity (GO:0140309).
  justification: "cryaba: cryaba is an active holdase chaperone; its activity appears reduced relative to zebrafish cryaa in aggregation-suppression assays (PMID:15692462), but in equilibrium binding assays it binds destabilized substrate more strongly than cryabb or human CRYAB (PMID:26378715). Obsolete GO:0051082 captured binding only; GO:0044183 requires assisting folding, and GO:0140309 (relabelled 'unfolded protein holdase activity') keeps a carrier-specific definition requiring escort to an acceptor molecule or location, which is not demonstrated here. See go-ontology#30552."
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:15692462
    supporting_text: "The chaperone-like activities of the two zebrafish alpha-crystallins were highly divergent, with alphaA-crystallin showing much greater activity than alphaB-crystallin."
