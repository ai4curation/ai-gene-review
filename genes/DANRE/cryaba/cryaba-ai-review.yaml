proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its aggregation without actively catalyzing refolding. The holdase maintains the client protein in a soluble, folding-competent state. This is mechanistically distinct from foldase activity (GO:0044183) and from carrier-holdase activity (GO:0140309).
  justification: cryaba is the lens-restricted zebrafish alphaB1-crystallin paralog whose recombinant protein shows reduced but measurable aggregation-suppressing activity without ATP or refolding. Obsolete GO:0051082 captured binding only; GO:0044183 requires assisting folding, and GO:0140309 (relabelled 'unfolded protein holdase activity') keeps a carrier-specific definition requiring escort to an acceptor molecule or location, which is not demonstrated here. See go-ontology#30552. The same request is made for the paralogs cryaa and cryabb.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:15692462
    supporting_text: The chaperone-like activities of zebrafish and human alpha-crystallins were compared by assaying their ability to prevent the chemically induced aggregation of several target proteins at temperatures between 25 degrees C and 40 degrees C
  - reference_id: PMID:15692462
    supporting_text: The chaperone-like activities of the two zebrafish alpha-crystallins were highly divergent, with alphaA-crystallin showing much greater activity than alphaB-crystallin
suggested_questions:
- question: Is cryaba expressed in zebrafish skeletal or cardiac muscle at any stage? The four muscle, heart and behaviour annotations rest on a morpholino screen, while the paralog study reports that alphaB1-crystallin is not constitutively expressed in muscular tissue and that cryabb retained that role. A stage-resolved expression measurement would settle whether those rows belong on this gene or on its paralog.
- question: Does GO:0140309 unfolded protein holdase activity, defined as a carrier activity that escorts an unfolded client to an acceptor or location, correctly describe a small heat shock protein that simply retains clients in a soluble state? GOA migrated this gene onto the term after GO:0051082 was obsoleted.
suggested_experiments:
- description: Re-test the muscle and cardiac phenotypes in a stable cryaba null line rather than morphants, and in parallel in a cryabb null, to establish which paralog carries the myofibrillar myopathy-related function in zebrafish.
- description: Quantify crystallin solubility and lens proteome composition in aging cryaba null lenses, testing whether the increased opacity follows from aggregation of specific client crystallins that the protein holds in solution.
