gene_symbol: cryaba
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'cryaba encodes zebrafish alpha-crystallin B chain a (alphaB1-crystallin), a 168-residue small heat shock protein (HSP20 family) built around a central alpha-crystallin domain. Zebrafish carry two alphaB-crystallin genes from the teleost genome duplication, and the functions separated between them: cryaba became a lens-restricted protein that is not constitutively expressed in nervous or muscular tissue and has reduced in vitro chaperone activity, while the cryabb paralog retained the broad, stress-responsive expression of mammalian CRYAB. In the lens cryaba is a soluble cytoplasmic alpha-crystallin that acts as an ATP-independent holdase, binding partly unfolded proteins and keeping them soluble, and it is also detected in association with fibre-cell membranes. Its importance is developmental-stage dependent: cryaa dominates the embryonic lens, whereas cryaba becomes the principal protector later, and fish lacking it develop more lens opacity with age than cryaa nulls.'
