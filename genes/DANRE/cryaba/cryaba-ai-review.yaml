id: Q9PUR2
gene_symbol: cryaba
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  Zebrafish alpha-crystallin B chain a (cryaba, also known as cryab, alphaB1- or
  alphaBa-crystallin) is a member of the small heat shock protein (sHSP/HSP20) family.
  It is one of two zebrafish alphaB-crystallin co-orthologs of human CRYAB, with cryaba
  being the lens-specific paralog and cryabb retaining the broad expression pattern of
  mammalian CRYAB (PMID:16420472, PMID:26378715). In adults cryaba is expressed at
  extremely low levels outside the lens (PMID:10542326), and it is the more abundant
  alphaB-crystallin of the adult lens (about 2.6% of lens protein versus about 0.7% for
  cryabb; PMID:18449354). In embryos both paralogs are also detected in heart and brain
  (PMID:29162721). In the lens, cryaba localizes around the entire fiber cell membrane
  producing a honeycomb appearance (PMID:18406404). cryaba is an active holdase
  chaperone. Aggregation-suppression assays reported weaker chaperone-like activity
  than zebrafish alphaA-crystallin (PMID:15692462), whereas equilibrium binding assays
  with destabilized T4 lysozyme found that cryaba binds substrate with higher affinity
  and capacity than cryabb or human CRYAB, resembling a constitutively activated sHSP
  (PMID:26378715); the relative activity is therefore assay-dependent. CRISPR loss of
  cryaba causes dosage-sensitive embryonic lens defects in one study (PMID:29162721)
  but not in another (PMID:36572168), and increases age-related cataract, with cryaba
  null fish showing greater lens opacity at 24 months than cryaa null fish
  (PMID:38705506). Single-cell RNA-seq and RT-qPCR data show an ontogenetic shift in
  alpha-crystallin usage, with cryaa predominating at 5-6 dpf and cryaba becoming more
  important after 10 dpf (PMID:38705506). cryaba mutant embryos are hypersensitive to
  crowding- or glucocorticoid-induced pericardial edema (PMID:29162721). Morpholino
  knockdown was reported to cause skeletal muscle defects, myofibril disassembly,
  heart failure, and locomotory impairment (PMID:25866181), but CRISPR null mutants
  (including cryaba/cryabb double mutants) showed no skeletal muscle phenotype
  (PMID:29162721). The protein contains zinc-binding residues at positions 101, 103,
  and 108. Beyond its structural role, cryaba intersects broader proteostasis
  pathways: it acts downstream of Hsf4 in lens fiber proteostasis (hsf4-/- lenses show
  decreased cryaba and raised lysosomal pH), alphaB-crystallin stabilizes an
  ATP6V1A-mTORC1 complex to maintain lysosomal acidity during organelle degradation,
  and cryaba interacts with the Nrf2 oxidative stress response such that combined
  nrf2/cryaba loss upregulates cholesterol biosynthesis in the lens
  (file:DANRE/cryaba/cryaba-deep-research-falcon.md; PMID:37577747).
existing_annotations:
- term:
    id: GO:0043066
    label: negative regulation of apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      IBA annotation based on phylogenetic inference from mammalian alpha-crystallins
      (CRYAA, CRYAB, HSPB1) which have documented anti-apoptotic roles. The
      anti-apoptotic function of alpha-crystallins is well-established for mammalian
      orthologs. While not directly demonstrated for zebrafish cryaba, the phylogenetic
      inference is reasonable. However, this is not a core molecular function of cryaba
      but rather a downstream biological process.
    action: KEEP_AS_NON_CORE
    reason: >-
      Anti-apoptotic activity is a recognized function of the sHSP family but represents
      a downstream biological process rather than a core molecular function. The IBA
      inference from mammalian CRYAB orthologs is phylogenetically sound. Retained as
      non-core since the primary function is structural role in the lens and holdase
      activity.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      IBA annotation for cytoplasmic localization, inferred phylogenetically from
      multiple sHSP orthologs across fly, worm, mouse, rat, human, and zebrafish.
      Consistent with the known biology of alpha-crystallins as cytoplasmic proteins
      in lens fiber cells.
    action: ACCEPT
    reason: >-
      Cytoplasmic localization is well-established for alpha-crystallins. cryaba is
      a cytoplasmic protein in lens fiber cells. The IBA inference is consistent with
      established biology and IEA annotations.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      IBA annotation for nuclear localization based on phylogenetic inference from
      mammalian sHSPs that translocate to the nucleus under stress conditions. Nuclear
      localization is not the primary site of action for alpha-crystallins.
    action: KEEP_AS_NON_CORE
    reason: >-
      Nuclear localization has been reported for some mammalian sHSP orthologs. The
      IBA inference is phylogenetically supported but represents a secondary or
      stress-dependent localization. Retained as non-core.
- term:
    id: GO:0009408
    label: response to heat
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      IBA annotation for heat stress response, inferred phylogenetically from
      multiple sHSP orthologs. cryaba belongs to the sHSP/HSP20 family and has
      demonstrated chaperone activity (PMID:15692462, PMID:26378715), consistent with
      a role in heat stress response.
    action: ACCEPT
    reason: >-
      cryaba is a member of the sHSP family which is fundamentally involved in heat
      stress response. The IBA inference from multiple orthologs is phylogenetically
      well-supported. cryaba has measurable chaperone activity, weaker than zebrafish
      alphaA-crystallin in aggregation assays (PMID:15692462) but stronger than cryabb
      and human CRYAB in substrate-binding assays (PMID:26378715). Falcon deep
      research reinforces the holdase mechanism underlying the stress response.
    supported_by:
      - reference_id: file:DANRE/cryaba/cryaba-deep-research-falcon.md
        supporting_text: |
          they bind partially unfolded or destabilized proteins to **inhibit aggregation**, maintaining proteostasis under basal conditions and especially during stress.
- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      IBA annotation for protein refolding, inferred primarily from Drosophila sHSP
      orthologs. Alpha-crystallins function as holdases rather than foldases -- they
      prevent aggregation of denaturing proteins but do not actively refold them.
      cryaba has measurable chaperone-like (holdase) activity whose strength
      relative to other alpha-crystallins is assay-dependent (PMID:15692462,
      PMID:26378715). The protein refolding term is inaccurate for a holdase.
    action: MODIFY
    reason: >-
      Alpha-crystallins are holdase chaperones that prevent aggregation of unfolded
      proteins but do not catalyze refolding. GO:0042026 implies active refolding
      activity, which is inaccurate for cryaba. GO:0140309 (unfolded protein carrier
      activity) is not appropriate because it is carrier-specific (per
      go-ontology#30552). The replacement is the proposed holdase chaperone activity NTR (see proposed_new_terms).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000897708
        source_label: sHSP / alpha-crystallin ancestral node (PTHR45620)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Descent from this sHSP node correctly transfers chaperone involvement, but
          GO:0042026 (protein refolding) overstates a foldase activity that cryaba lacks;
          it is an ATP-independent holdase preventing aggregation without refolding.
      - source_id: FB:FBgn0001226
        source_label: Drosophila small heat-shock protein donor
        source_status: SUPPORTS_TRANSFER
        comment: Representative Drosophila sHSP donor seeding the node; holdase-vs-foldase distinction not captured by the term.
    proposed_replacement_terms:
      - id: NTR
        label: holdase chaperone activity
    supported_by:
      - reference_id: PMID:15692462
        supporting_text: >-
          The chaperone-like activities of the two zebrafish alpha-crystallins were
          highly divergent, with alphaA-crystallin showing much greater activity than
          alphaB-crystallin.
- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      IBA annotation for unfolded protein binding based on phylogenetic inference from
      multiple alpha-crystallin and sHSP orthologs. GO:0051082 is now formally
      obsolete. cryaba has demonstrated chaperone activity: weaker than zebrafish
      alphaA-crystallin in aggregation-suppression assays (PMID:15692462), but in
      equilibrium binding assays cryaba (alphaBa) binds destabilized T4 lysozyme with
      about an order of magnitude higher affinity than its paralog cryabb and more
      strongly than human CRYAB (PMID:26378715). The holdase function should be
      captured by GO:0140309.
    action: MODIFY
    reason: >-
      GO:0051082 is now formally obsolete. The holdase activity of cryaba has been
      demonstrated by in vitro chaperone assays (PMID:15692462, PMID:26378715); the
      earlier view of cryaba as a weak or nonchaperone paralog is contradicted by
      binding assays (PMID:26378715). GO:0140309 (unfolded protein
      carrier activity) is not appropriate because it is carrier-specific (per
      go-ontology#30552). The replacement is the proposed holdase chaperone activity NTR (see proposed_new_terms).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000897708
        source_label: sHSP / alpha-crystallin ancestral node (PTHR45620)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node is well supported for unfolded-protein binding across sHSP orthologs, so the
          transfer itself is sound. The issue is term scoping: GO:0051082 is proposed for
          obsoletion, so the term (not the propagation) needs updating.
      - source_id: UniProtKB:P02511
        source_label: Human alphaB-crystallin (CRYAB)
        source_status: SUPPORTS_TRANSFER
        comment: Experimentally characterized alphaB-crystallin ortholog donor supporting holdase / unfolded-protein binding.
    proposed_replacement_terms:
      - id: NTR
        label: holdase chaperone activity
    supported_by:
      - reference_id: PMID:26378715
        supporting_text: >-
          However, variations in activity within the zebrafish αB chains were also
          apparent in which αBa-S bound the destabilized substrate with an order of
          magnitude higher affinity and with greater capacity than αBb (Table 5).
      - reference_id: PMID:26378715
        supporting_text: >-
          The zebrafish paralogs showed substantially elevated binding with respect to
          human αB (Figure 5b).
      - reference_id: PMID:15692462
        supporting_text: >-
          The chaperone-like activities of the two zebrafish alpha-crystallins were
          highly divergent, with alphaA-crystallin showing much greater activity than
          alphaB-crystallin.
- term:
    id: GO:0005212
    label: structural constituent of eye lens
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      IEA annotation based on InterPro domain match (IPR003090 Alpha-crystallin_N)
      and UniProt keyword (KW-0273 Eye lens protein). Alpha-crystallins are major
      structural proteins of the vertebrate lens. cryaba is predominantly expressed
      in the lens (PMID:16420472) and its loss increases age-related cataract
      (PMID:38705506).
    action: ACCEPT
    reason: >-
      Structural role in the eye lens is a well-established core function of
      alpha-crystallins. cryaba is predominantly lens-expressed and its loss leads
      to increased age-related cataract (PMID:38705506). The IEA inference is
      correct and supported by direct experimental data.
    supported_by:
      - reference_id: PMID:38705506
        supporting_text: >-
          we found that the loss of the alphaBa-crystallin gene cryaba led to an
          increase in lens opacity compared to cryaa null fish at 24 months of age.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: >-
      IEA annotation for cytoplasmic localization based on ARBA machine learning
      models. Consistent with the IBA annotation for the same term and the
      established biology of alpha-crystallins as cytoplasmic proteins.
    action: ACCEPT
    reason: >-
      Cytoplasmic localization is well-established. This IEA annotation is consistent
