description: sh3glb2a (SH3-domain GRB2-like endophilin B2a) is one of two zebrafish co-orthologs of vertebrate SH3GLB2 (endophilin-B2),
  retained from the teleost genome duplication; its paralog is sh3glb2b. It encodes a cytoplasmic protein with an N-terminal
  membrane-binding amphipathic helix, an N-BAR domain that senses and induces membrane curvature and mediates homo- and heterodimerization,
  and a C-terminal SH3 domain. In mammals endophilin-B2 promotes trafficking of endocytic vesicles and autophagosomes to late
  endosomes and lysosomes and, together with endophilin-B1, mitophagy; the knockout mouse is viable. The zebrafish protein
  keeps all these domains. sh3glb2a transcripts peak at blastula stages and are low but present later; adult RNA-seq detects
  it broadly. No functional study of the zebrafish gene has been published.
