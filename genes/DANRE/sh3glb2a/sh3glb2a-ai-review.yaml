core_functions:
- description: 'Endophilin-B2 orthologue (N-terminal amphipathic helix plus N-BAR domain and C-terminal SH3 domain): by homology
    with mammalian endophilin-B2 a cytoplasmic membrane-remodelling protein that binds and curves membranes and promotes trafficking
    of endocytic vesicles and autophagosomes to late endosomes and lysosomes. Inferred from conserved domains (no process
    terms are recorded here because this copy carries no process annotations, owing to its PANTHER subfamily placement); no
    zebrafish measurement. Protein features shared with sh3glb2b.'
