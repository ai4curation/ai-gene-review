- term:
    id: GO:0004458
    label: D-lactate dehydrogenase (cytochrome) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G06580
  - PANTHER:PTN000202298
  - SGD:S000002333
  review:
    summary: |-
      D-lactate dehydrogenase (cytochrome) activity (IBA from PTN000202298: yeast DLD1, Arabidopsis DLD): oxidation of D-lactate with cytochrome c as electron acceptor. Purified human LDHD transfers electrons directly from D-lactate to cytochrome c (kcat 103 min-1, KM 112 uM) and LDHD-knockout cells lose the D-lactate-driven membrane potential response [PMID:38413804].
    action: ACCEPT
    reason: |-
      The PAINT node placement is sound: the cytochrome c-coupled D-lactate dehydrogenase activity of yeast DLD1 was inherited by the vertebrate LDHD clade, as shown directly for human LDHD in 2024. This is the physiological form of the FAD-dependent activity (FADH2 is reoxidized by cytochrome c), so it complements rather than duplicates GO:0140170. The zebrafish enzyme has not been assayed with cytochrome c, but its in vivo D-lactate clearance and conserved FAD/cytochrome-binding architecture give no reason to expect divergence.
    supported_by:
    - reference_id: PMID:38413804
      supporting_text: we could confirm direct electron transfer from d-lactate to cytochrome c by monitoring its haem absorbance
    - reference_id: PMID:38413804
      supporting_text: their response to d-lactate was blunted
    - reference_id: PMID:30931947
      supporting_text: metabolic analysis revealed elevated levels of D-lactate, but not L-lactate, in ldhd−/− larvae compared to wildtype
    - reference_id: file:DANRE/ldhd/ldhd-deep-research-falcon.md
      supporting_text: A 2024 study provided direct evidence that **human LDHD transfers electrons from D-lactate to cytochrome c**, thereby supporting mitochondrial membrane polarization.
