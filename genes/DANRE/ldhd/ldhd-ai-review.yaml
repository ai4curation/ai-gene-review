suggested_questions:
- question: Does zebrafish Ldhd, like human LDHD, use cytochrome c as its physiological electron acceptor and contribute to mitochondrial membrane potential, or is its role in fish purely detoxification of D-lactate?
suggested_experiments:
- description: Assay cytochrome c reduction by purified zebrafish Ldhd with D-lactate and D-2-hydroxybutyrate, and measure D-lactate-driven membrane potential in permeabilized cells from ldhd sa15623 versus wild-type larvae.
  experiment_type: biochemical
  hypothesis: Zebrafish Ldhd retains the cytochrome c-coupled electron transfer demonstrated for human LDHD.
