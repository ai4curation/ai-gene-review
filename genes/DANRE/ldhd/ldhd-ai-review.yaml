  evidence_type: EXP
  original_reference_id: PMID:30931947
  review:
    summary: |-
      (2R)-2-hydroxycarboxylate dehydrogenase (FAD) activity (zebrafish EXP row): the broader substrate class. Mouse LDHD acts on D-2-hydroxybutanoate through D-2-hydroxyoctanoate and branched D-2-hydroxyacids with hydrophobic C2 groups, but not on hydrophilic ones or L-isomers [PMID:37863926]; human LDHD reduces cytochrome c with D-2-hydroxybutyrate as well [PMID:38413804].
