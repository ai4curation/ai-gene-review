- term:
    id: GO:0008720
    label: D-lactate dehydrogenase (NAD+) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G06580
  - PANTHER:PTN000202298
  review:
    summary: |-
      D-lactate dehydrogenase (NAD+) activity (IBA from PTN000202298 with Arabidopsis AT5G06580 as the only experimental donor, IMP PMID:22155004 via QuickGO). The claim is NAD+-dependent D-lactate oxidation. LDHD is an FAD-linked PCMH-type flavoprotein, not an NAD-dependent 2-hydroxyacid dehydrogenase; mouse LDHD is assayed with FAD/Mn2+ and human LDHD with cytochrome c as acceptor [PMID:37863926; PMID:38413804].
    action: MODIFY
    reason: |-
      The NAD+-dependent term describes a different enzyme family (bacterial D-isomer-specific 2-hydroxyacid dehydrogenases). The donor annotation on Arabidopsis DLD is a plant-selection-marker IMP that does not establish NAD+ as acceptor, and the vertebrate enzymes are characterised with FAD and cytochrome c, so the activity should be captured by the FAD-dependent term GO:0140170 (already on the gene) rather than the NAD+ term.
    proposed_replacement_terms:
    - id: GO:0140170
      label: D-lactate dehydrogenase (FAD) activity
    supported_by:
    - reference_id: PMID:37863926
      supporting_text: The NAD-dependent D-LDHs were found in some bacteria and belong to the D-isomer specific 2-hydroxyacid dehydrogenase superfamily
    - reference_id: PMID:37863926
      supporting_text: mLDHD is an Mn2+-dependent general dehydrogenase for a broad range of D-2-hydroxyacids with small to moderate-size hydrophobic moieties at the C2 atom
    - reference_id: file:DANRE/ldhd/ldhd-uniprot.txt
      supporting_text: Reaction=(R)-lactate + FAD + H(+) = FADH2 + pyruvate
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000202298
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: |-
          Node carries the NAD+ term from a single plant IMP (AT5G06580); the family is FAD-linked and vertebrate members are assayed with FAD and cytochrome c, so the acceptor in the term does not match the enzyme chemistry at this node.
      - source_id: AGI_LocusCode:AT5G06580
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: |-
          Arabidopsis DLD GO:0008720 IMP (PMID:22155004) rests on D-lactate tolerance as a selection marker, not on NAD+-dependent kinetics; the same enzyme is described elsewhere as FAD/cytochrome c-linked.
