    reason: |-
      D-lactate is one member of the substrate class this enzyme handles; the generic (2R)-2-hydroxycarboxylate term captures the true substrate scope shown biochemically on the mammalian orthologs, and the zebrafish enzyme is the ortholog whose D-lactate activity is confirmed in vivo. Accepted alongside the D-lactate-specific term.
