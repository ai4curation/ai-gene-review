    reason: |-
      This is the core molecular function. The zebrafish in vivo readout (D- but not L-lactate elevation, rescued by wild-type but not patient-variant human LDHD) demonstrates the enzyme's stereospecific activity in the fish, and the reaction chemistry (FAD as acceptor, Mn2+ cofactor) is established on the mammalian orthologs.
