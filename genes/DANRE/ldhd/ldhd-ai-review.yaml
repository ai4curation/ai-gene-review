id: F1QXM5
gene_symbol: ldhd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  ldhd encodes the mitochondrial FAD-dependent D-lactate dehydrogenase, a Mn2+-dependent flavoprotein of the inner mitochondrial membrane that oxidizes D-lactate and other (2R)-2-hydroxycarboxylates with small hydrophobic C2 substituents to the corresponding 2-oxoacids, passing the electrons to cytochrome c. It is strictly stereoselective (no activity on L-lactate) and clears D-lactate generated endogenously via the methylglyoxal pathway or taken up from gut bacteria and diet. Zebrafish ldhd mutants are viable and fertile but accumulate D-lactate, the biochemical hallmark of human D-lactate dehydrogenase deficiency.
existing_annotations:
- term:
    id: GO:1903457
    label: lactate catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      Lactate catabolic process: Ldhd performs the committed step of D-lactate breakdown, oxidizing D-lactate to pyruvate. The IBA descends from PTN000202298 (yeast DLD1, human LDHD) and is independently confirmed in zebrafish.
    action: ACCEPT
    reason: |-
      The gene product itself catalyses the catabolic reaction (participation, not merely necessity), the loss-of-function metabolite phenotype is specific to the D-enantiomer, and the rescue by human LDHD shows the same activity is conserved; this is the core process for this enzyme.
    supported_by:
    - reference_id: PMID:30931947
      supporting_text: metabolic analysis revealed elevated levels of D-lactate, but not L-lactate, in ldhd−/− larvae compared to wildtype
    - reference_id: PMID:30931947
