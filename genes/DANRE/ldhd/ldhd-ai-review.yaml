  evidence_type: EXP
  original_reference_id: PMID:30931947
  review:
    summary: |-
      D-lactate dehydrogenase (FAD) activity (the zebrafish EXP row from ldhd mutants and human mRNA rescue): FAD-dependent oxidation of D-lactate to pyruvate. Zebrafish ldhd mutants accumulate D-lactate specifically and are rescued by human LDHD [PMID:30931947]; purified mouse and human LDHD oxidize D-lactate with FAD/Mn2+ and transfer electrons to cytochrome c [PMID:37863926; PMID:38413804].
