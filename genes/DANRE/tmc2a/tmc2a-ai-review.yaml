suggested_questions:
- question: Does full-length Tmc2a localize to stereocilia tips and rescue tmc2a or tmc triple mutants when expressed
    from a hair-cell promoter, and can Tmc2a rescue the Tmc2b-only neuromast hair cells? The reciprocal Tmc2b transgene
    rescues all end organs, but the Tmc2a construct never expressed.
- question: Do Tmc2a and Tmc2b form heteromeric channels in the cells that express both, and does Tmc2a confer different
    conductance or calcium permeability (larger responses in P-to-A neuromast cells, broader frequency range in
    the utricle)?
- question: Is the tmc2a/tmc2b pair a product of the teleost genome duplication although both copies are on zebrafish
    chromosome 5? Are the medaka co-orthologs on different chromosomes, and does a gar-anchored double-conserved-synteny
    analysis place both in the same ancestral block?
suggested_experiments:
- hypothesis: The Tmc2a-dependent crista and saccular phenotypes reflect expression, not a Tmc2a-specific protein
    property.
  description: Express Tmc2b (and Tmc2a, if a stable construct can be made) under a tmc2a enhancer in tmc2a mutants
    and measure dye uptake in upper-layer crista hair cells and saccular microphonics.
  experiment_type: cross-rescue
- hypothesis: Tmc2a changes single-channel conductance or calcium selectivity relative to Tmc2b.
  description: Record MET currents from neuromast hair cells of tmc2b mutants (Tmc2a-only P-to-A cells) and tmc2a
    mutants (Tmc2b-only cells) and compare conductance and calcium permeability.
  experiment_type: electrophysiology
