core_functions:
- description: Pore-forming subunit of the hair-cell mechanoelectrical transduction channel at the stereocilia,
    coupled to the tip-link protein Pcdh15a through its N-terminus; recorded as a contribution because the working
    channel also needs other subunits and can be formed by Tmc1 or Tmc2b.
  contributes_to_molecular_function:
    id: GO:0140135
    label: mechanosensitive monoatomic cation channel activity
  directly_involved_in:
  - id: GO:0050910
    label: detection of mechanical stimulus involved in sensory perception of sound
  - id: GO:0050974
    label: detection of mechanical stimulus involved in sensory perception
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
