id: E7FFT2
gene_symbol: tmc2a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: tmc2a (transmembrane channel-like 2a) is one of two zebrafish co-orthologs of vertebrate TMC2, the
  paralog tmc2b being the other; both lie on chromosome 5, tmc2b next to tmc1. Tmc2a is a multi-pass membrane protein
  of the TMC family and a pore-forming subunit of the hair-cell mechanoelectrical transduction (MET) channel, a
  non-selective cation channel with high calcium permeability that opens when tip-link tension deflects the hair
  bundle. Its cytoplasmic N-terminus binds the cytoplasmic domain of the tip-link protein Pcdh15a. tmc2a is expressed
  only in sensory hair cells, from 1 dpf in the inner ear, where it is enriched in central (striolar) hair cells
  and in the upper layer of the cristae, and at low levels in a subset of lateral-line hair cells that respond to
  posterior-to-anterior deflection. Tmc2a is the main Tmc subunit for hearing through the saccule, is required for
  mechanotransduction in upper-layer crista hair cells and for high-frequency utricular sensitivity, and together
  with Tmc2b carries all lateral-line transduction; in neuromasts it enlarges the responses of the hair cells that
  express it.
