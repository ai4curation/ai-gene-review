  review:
    summary: Tmc2a N-terminus binds the cytoplasmic domains (CD1 and CD3 isoforms) of the tip-link protein Pcdh15a
      in yeast two-hybrid and co-immunoprecipitation assays.
    action: MODIFY
    reason: The interaction is well supported (yeast two-hybrid, co-IP in HEK293T cells, and a dominant-negative
      effect of the Tmc2a N-terminus on Pcdh15a localization in hair bundles), but 'protein binding' is uninformative.
      The partner is protocadherin 15a, a cadherin-superfamily tip-link protein, so the more informative binding
      term is cadherin binding. The functional consequence, coupling of the channel to the tip link, is captured
