- term:
    id: GO:0005245
    label: voltage-gated calcium channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:2151017
  - PANTHER:PTN002761430
  review:
    summary: Voltage-gated calcium channel activity, propagated from the PANTHER TMC2 node (mouse Tmc2 donor).
    action: MODIFY
    reason: The ion-channel part is right but the gating stimulus is wrong. TMC channels are opened by tension in
      the tip link that accompanies hair-bundle deflection, not by membrane voltage, and they conduct cations non-selectively
      with high calcium permeability. The same row was modified to the mechanically gated cation channel term in
      the human TMC1 review; the same argument applies to every member of this node. In zebrafish the Tmc2a N-terminus
      acts in a complex with the tip-link protein Pcdh15a, and loss of Tmc2a reduces mechanically evoked hair-cell
      responses.
    proposed_replacement_terms:
    - id: GO:0140135
      label: mechanosensitive monoatomic cation channel activity
    supported_by:
    - &id001
      reference_id: PMID:25114259
      supporting_text: Overexpression of the Tmc2a N terminus results in mislocalization of Pcdh15a within hair
        bundles, together with a significant decrease in mechanosensitive responses, suggesting that a Pcdh15a–Tmc
        complex is critical for mechanotransduction.
    - &id002
      reference_id: PMID:39773557
      supporting_text: Significant progress in our understanding of MET has been recently made by identifying the
        transmembrane channel-like proteins 1 and 2 (TMC1 and TMC2) as the pore-forming subunits of the MET channel
        (Kawashima et al., 2011; Pan et al., 2018).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:2151017
        source_label: Tmc2 (mouse)
        source_status: SOURCE_BAD
        comment: QuickGO shows mouse Tmc2 carries GO:0005245 by IMP/IGI from PMID:23871232, a study of calcium permeability
          and single-channel currents of the mechanically gated hair-cell channel, not of voltage gating (as traced
          in the human TMC1 review).
      - source_id: PANTHER:PTN002761430
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node correctly groups vertebrate TMC2 orthologs including both zebrafish copies; only the gating
          mechanism in the chosen term is wrong.
- term:
    id: GO:0005262
    label: calcium channel activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8R4P4
  review:
    summary: Calcium channel activity transferred by UniProt curators from mouse Tmc2 (Q8R4P4).
    action: ACCEPT
    reason: The MET channel formed by TMC subunits is a non-selective cation channel that is highly permeable to
      calcium, so calcium conduction is part of the activity. In zebrafish, neuromast hair bundles that express
      Tmc2a in addition to Tmc2b give larger calcium signals than bundles with Tmc2b alone. The term does not capture
      the mechanical gating, which is covered by GO:0008381 and the proposed GO:0140135.
    supported_by:
    - &id005
      reference_id: PMID:36905930
      supporting_text: This idea is supported by our results, as we show that the calcium signals in hair bundles
        expressing both Tmc2b and Tmc2a are larger compared to those expressing just Tmc2b (Figure 6).
