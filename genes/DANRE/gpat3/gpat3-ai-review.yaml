- id: PMID:17170135
  title: Molecular identification of microsomal acyl-CoA:glycerol-3-phosphate acyltransferase, a key enzyme in de novo triacylglycerol synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Cao et al. 2006, Proc Natl Acad Sci U S A; full text cached). Identifies GPAT3 as the microsomal GPAT; human/mouse enzyme, applied to zebrafish by orthology.
  findings:
  - statement: GPAT3 overexpression increases NEM-sensitive GPAT activity specifically toward G3P.
    supporting_text: Ectopic expression of GPAT3 leads to a significant increase in N-ethylmaleimide-sensitive GPAT activity, whereas acyltransferase activity toward a variety of other lysophospholipids, as well as neutral lipid substrates, is not altered.
  - statement: GPAT3 overexpression increases TAG but not phospholipid synthesis.
    supporting_text: Overexpression of GPAT3 in mammalian cells results in increased triacylglycerol, but not phospholipid, formation.
  - statement: No LPA acyltransferase activity was detected for GPAT3 in this study.
    supporting_text: Importantly, acyltransferase activity conferred by GPAT3 overexpression is specific toward G3P, because no significant increase in product formation was observed when LPA, lysophosphatidylcholine, lysophosphatidylserine, lysophosphatidylglycerol, MAG, or DAG were presented as substrates
  - statement: GPAT3 localises to the ER.
    supporting_text: GPAT3 is localized to the ER when overexpressed in COS-7 cells.
- id: PMID:19318427
  title: Functional characterization of the human 1-acylglycerol-3-phosphate-O-acyltransferase isoform 10/glycerol-3-phosphate acyltransferase isoform 3.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Title matches the cached record (Sukumaran et al. 2009, J Mol Endocrinol; full text cached). Reports AGPAT (LPAAT) activity and no GPAT activity for the same human protein, contradicting Cao et al. 2006 [PMID:17170135] and the Gpat3-null mouse [PMID:24714397]; the ER localisation and the note that the human protein is highly conserved with zebrafish are not contested.
  findings:
  - statement: Human AGPAT10/GPAT3 shows robust AGPAT activity but no GPAT activity in HEK-293 lysates.
    supporting_text: In vitro enzymatic activity using lysates of human embryonic kidney-293 cells infected with recombinant AGPAT10/GPAT3 adenovirus show that the protein has a robust AGPAT activity with an apparent V(max) of 2 nmol/min per mg protein, but lacks GPAT enzymatic activity.
  - statement: The protein localises to the ER in CHO cells.
    supporting_text: When this AGPAT10/GPAT3 cDNA was expressed in Chinese Hamster ovary cells, the protein product localizes to the endoplasmic reticulum.
  - statement: Human AGPAT10/GPAT3 is highly conserved with zebrafish.
    supporting_text: The human AGPAT10/GPAT3 is highly conserved with mouse, zebrafish, Caenorhabditis elegans, and Arabidopsis (Supplementary material).
- id: PMID:24714397
  title: Mice deleted for GPAT3 have reduced GPAT activity in white adipose tissue and altered energy and cholesterol homeostasis in diet-induced obesity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches the cached record (Cao et al. 2014, Am J Physiol Endocrinol Metab). Abstract only. Gpat3-null mice lose 80% of white-adipose GPAT activity, the in vivo confirmation of the GPAT assignment.
  findings:
  - statement: Gpat3-/- mice lose 80% of total GPAT activity in white adipose tissue.
    supporting_text: Total GPAT activity in white adipose tissue of Gpat3(-/-) mice was reduced by 80%, suggesting that GPAT3 is the predominant GPAT in this tissue.
