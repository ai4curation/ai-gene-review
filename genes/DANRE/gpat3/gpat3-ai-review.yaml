suggested_questions:
- question: Does zebrafish Gpat3 have glycerol-3-phosphate acyltransferase activity, lysophosphatidate acyltransferase activity, or both, when expressed in a null background such as GPAT-deficient cells?
- question: Which tissues express gpat3 in zebrafish (adipose, intestine, yolk syncytial layer?), and does loss of gpat3 reduce microsomal GPAT activity or lipid droplet formation in larvae?
suggested_experiments:
- description: Express V5-tagged zebrafish Gpat3 in HEK-293 or COS-7 cells and assay acyltransferase activity in parallel with G3P and LPA as acceptors using [14C]acyl-CoA, alongside human GPAT3 as control, to resolve the GPAT-versus-AGPAT discrepancy for the zebrafish orthologue.
  hypothesis: Zebrafish Gpat3 is an NEM-sensitive GPAT that produces LPA from G3P, with little or no LPA acyltransferase activity.
