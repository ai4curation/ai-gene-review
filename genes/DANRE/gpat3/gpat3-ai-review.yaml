- term:
    id: GO:0004366
    label: glycerol-3-phosphate O-acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: |-
      Glycerol-3-phosphate O-acyltransferase (EC 2.3.1.15): acylation of sn-glycerol 3-phosphate at sn-1 to form lysophosphatidic acid, the first step of de novo glycerolipid synthesis.
    action: ACCEPT
    reason: |-
      Rhea/EC mapping of the UniProt CATALYTIC ACTIVITY. The orthologous enzyme was identified as the ER (NEM-sensitive) GPAT: overexpression raises G3P-specific acyltransferase activity [PMID:17170135] and Gpat3-null mice lose 80% of white-adipose GPAT activity [PMID:24714397]. Sukumaran et al. could not detect GPAT activity in their lysate assay [PMID:19318427], but the knockout result settles the in vivo activity. No zebrafish enzymology exists; the activity is inferred from the human/mouse ortholog (UniProt evidence ECO:0000250|UniProtKB:Q53EU6). Accepted as the core activity of the zebrafish orthologue, which is 4-TM ER protein of the same PANTHER subfamily (PTHR23063:SF10).
    supported_by:
    - reference_id: file:DANRE/gpat3/gpat3-uniprot.txt
      supporting_text: by incorporating an acyl moiety at the sn-1 position of the glycerol backbone
    - reference_id: PMID:17170135
      supporting_text: Ectopic expression of GPAT3 leads to a significant increase in N-ethylmaleimide-sensitive GPAT activity, whereas acyltransferase activity toward a variety of other lysophospholipids, as well as neutral lipid substrates, is not altered.
    - reference_id: PMID:24714397
      supporting_text: Total GPAT activity in white adipose tissue of Gpat3(-/-) mice was reduced by 80%, suggesting that GPAT3 is the predominant GPAT in this tissue.
