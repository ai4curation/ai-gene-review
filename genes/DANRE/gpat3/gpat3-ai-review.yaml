id: Q6DG38
gene_symbol: gpat3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  gpat3 (also called agpat9/agpat10) encodes glycerol-3-phosphate acyltransferase 3, a polytopic endoplasmic reticulum membrane enzyme of the GPAT3/GPAT4 (LPCAT1-like) branch of the PlsC acyltransferase family. The mammalian orthologue is the major N-ethylmaleimide-sensitive microsomal GPAT of adipose tissue: it acylates sn-glycerol 3-phosphate at the sn-1 position with long-chain acyl-CoAs to produce lysophosphatidic acid, the entry step of de novo triacylglycerol synthesis, and its overexpression raises triacylglycerol rather than phospholipid synthesis. Whether the same protein also acylates lysophosphatidic acid to phosphatidic acid (AGPAT activity) is contested between laboratories. The zebrafish enzyme has not been assayed directly; its function is inferred from strong conservation with the human protein.
existing_annotations:
- term:
    id: GO:0003841
    label: 1-acylglycerol-3-phosphate O-acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: |-
      1-acylglycerol-3-phosphate O-acyltransferase (EC 2.3.1.51): acylation of LPA at sn-2 to give phosphatidic acid. UniProt lists this second reaction by similarity to human Q53EU6.
    action: UNDECIDED
    reason: |-
      Rhea/EC mapping of the UniProt CATALYTIC ACTIVITY line. The primary literature on the human orthologue is in direct conflict: Sukumaran et al. report robust AGPAT (LPA acyltransferase) activity and no GPAT activity [PMID:19318427], whereas Cao et al. found no increase in product formation with LPA as acceptor and G3P-specific activity only [PMID:17170135]. No zebrafish enzymology exists; the activity is inferred from the human/mouse ortholog (UniProt evidence ECO:0000250|UniProtKB:Q53EU6). With two full-text primary papers disagreeing on whether the protein acylates LPA at all, and no zebrafish assay, the annotation cannot be adjudicated here; flagged UNDECIDED rather than accepted or removed, and not listed as a core function.
    supported_by:
    - reference_id: file:DANRE/gpat3/gpat3-uniprot.txt
      supporting_text: Also converts LPA into 1,2-diacyl-sn-glycerol-3-phosphate (phosphatidic acid or PA) by incorporating an acyl moiety at the sn-2 position of the glycerol backbone.
    - reference_id: PMID:19318427
      supporting_text: In vitro enzymatic activity using lysates of human embryonic kidney-293 cells infected with recombinant AGPAT10/GPAT3 adenovirus show that the protein has a robust AGPAT activity with an apparent V(max) of 2 nmol/min per mg protein, but lacks GPAT enzymatic activity.
    - reference_id: PMID:17170135
      supporting_text: Importantly, acyltransferase activity conferred by GPAT3 overexpression is specific toward G3P, because no significant increase in product formation was observed when LPA, lysophosphatidylcholine, lysophosphatidylserine, lysophosphatidylglycerol, MAG, or DAG were presented as substrates
    - reference_id: file:DANRE/gpat3/gpat3-deep-research-falcon.md
      supporting_text: For zebrafish gpat3, these specificity statements should be treated as **inferred from orthology**, because zebrafish-specific enzymatic assays were not identified in the retrieved sources.
