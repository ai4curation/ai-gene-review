    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002771199
  - ZFIN:ZDB-GENE-030131-9102
  review:
    summary: >-
      IBA from PTN002771199, whose only listed experimental source is col1a1a
      itself (ZFIN:ZDB-GENE-030131-9102), i.e. the IDA cytoplasm row from
      PMID:19757382 reviewed below.
    action: REMOVE
    reason: >-
      The node's only grounding is an mRNA in situ hybridization in which
      col1a1 was used as a keratinocyte marker. mRNA localization does not
      show where the protein acts. Type I collagen chains act in the
      extracellular matrix. The procollagen passes through the endoplasmic
      reticulum lumen during synthesis, but that is not where its structural
      activity is exerted, so "is active in cytoplasm" misplaces the function.
      No fibrillar collagen in the family has experimental evidence of
      cytoplasmic activity to support placing this at an ancestral node.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
