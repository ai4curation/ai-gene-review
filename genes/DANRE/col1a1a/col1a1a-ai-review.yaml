- id: PMID:30082390
  title: Zebrafish type I collagen mutants faithfully recapitulate human type I collagenopathies.
  findings:
  - statement: Single heterozygous col1a1a or col1a1b knockouts are normal; the double
      heterozygote has a mild OI-like phenotype.
    supporting_text: Heterozygous loss of either α1(I) or α3(I) did not induce any
      skeletal abnormalities, while reduced levels of both α1(I) and α3(I) (col1a1a+/−;col1a1b+/−
      mutants) causes a mild skeletal phenotype with increased bone fragility, arguing
      for interchangeability and functional redundancy between α1(I) and the homologous
      α3(I).
  - statement: Complete loss of col1a1a is lethal; complete loss of col1a1b is viable.
    supporting_text: Complete loss of the α1(I) chain causes lethality after 7 dpf,
      while loss of α3(I) only shows increased early lethality if the amount of α1(I)
      is also diminished.
  - statement: col1a1a knockout larvae lack actinotrichia.
    supporting_text: Upon detailed examination of the finfold, these actinotrichia
      were found to be absent in col1a1a−/− mutant larvae (Fig. 5D).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. The key paper testing both paralogs genetically.
