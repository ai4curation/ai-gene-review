- term:
    id: GO:0033333
    label: fin development
  evidence_type: IMP
  original_reference_id: PMID:9007245
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-111013-8
  review:
    summary: >-
      Genotype col1a1a^tt281/tt281 (ZFIN), a recessive allele from the
      Tuebingen large-scale screen for fin formation mutants (abstract only;
      the allele is not named in the abstract).
    action: ACCEPT
    reason: >-
      Fin fold development is a copy-specific role of col1a1a. It is the only
      type I collagen gene expressed in the median fin fold and pectoral fin
      margin. Actinotrichia, the collagen fibres that support the fin fold,
      are absent in col1a1a knockout larvae and are thought to contain
      alpha1(I) homotrimers. This role is not shared with col1a1b, so it is
      accepted as part of the col1a1a-specific function. Deferred to the
      curator for the allele-level details.
    supported_by:
    - reference_id: PMID:9007245
      supporting_text: Mutations in 11 genes lead to abnormal morphology or degeneration
        of both caudal and pectoral fin folds.
    - reference_id: PMID:30082390
      supporting_text: Upon detailed examination of the finfold, these actinotrichia
        were found to be absent in col1a1a−/− mutant larvae (Fig. 5D).
