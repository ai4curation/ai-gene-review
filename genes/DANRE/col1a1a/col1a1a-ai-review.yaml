  supporting_entities:
  - ZFIN:ZDB-GENO-180503-6
  review:
    summary: >-
      Genotype col1a1a^dmh13/+ (ZFIN). dmh13 is a dominant glycine
      substitution (G1093R) in the col1a1a triple helix, isolated in an adult
      forward screen for short stature, with vertebral deformation and
      excessive bone formation.
    action: ACCEPT
    reason: >-
      Type I collagen is the main organic component of bone matrix, and
      dominant helix glycine substitutions in the col1a1a chain produce
      skeletal dysplasia, as in human COL1A1-related osteogenesis imperfecta.
      The col1a1a chain contributes structure to the skeletal matrix, so this
      is a direct role, and human COL1A1 carries the same term by IMP.
    supported_by:
    - reference_id: PMID:28835471
      supporting_text: Both the dmh13 and dmh14 mutants carry mutations in the col1a1a
        gene (G1093R; G1144E), which are closely linked, while the dmh29 mutants
        exhibit mutations in a glycine residue of the col1a1b gene (G1123D), leading
        to a very similar phenotype.
