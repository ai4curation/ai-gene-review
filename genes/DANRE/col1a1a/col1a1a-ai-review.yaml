- term:
    id: GO:0030278
    label: regulation of ossification
  evidence_type: IMP
  original_reference_id: PMID:14623232
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-011017-1
  review:
    summary: >-
      Original description of chihuahua (dc124), a dominant col1a1a
      mutation found by radiographic screening, which causes a general defect
      in bone growth resembling osteogenesis imperfecta. Abstract only.
    action: MODIFY
    reason: >-
      The mutant phenotype (a general defect in bone growth) supports a role
      for col1a1a in ossification. But the alpha1(I) chain acts as the
      structural organic matrix of bone, not as a regulator that modulates
      the rate or extent of ossification. The regulatory term implies a
      mechanism the evidence does not show. Replace with the parent process,
      ossification, keeping the acts_upstream_of_or_within qualifier.
    proposed_replacement_terms:
    - id: GO:0001503
      label: ossification
    supported_by:
    - reference_id: PMID:14623232
      supporting_text: We have isolated chihuahua, a dominant mutation causing a
        general defect in bone growth.
    - reference_id: PMID:14623232
      supporting_text: Mapping and molecular characterization of the chihuahua mutation
        indicates that the defect resides in the gene encoding the collagen I(alpha1)
        chain.
