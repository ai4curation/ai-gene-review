- term:
    id: GO:0046849
    label: bone remodeling
  evidence_type: IMP
  original_reference_id: PMID:29665086
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Chihuahua bone quality study (abstract only). The abstract reports
      altered osteoblast morphology and osteocyte density but does not mention
      remodeling.
    action: KEEP_AS_NON_CORE
    reason: >-
      The effect on remodeling is at best indirect: the abnormal collagen
      matrix is what osteoclasts and osteoblasts turn over, and col1a1a
      performs no step of resorption or reactive formation. The
      acts_upstream_of_or_within qualifier fits such an indirect effect, and
      the full text was not available, so the row is kept as non-core rather
      than removed.
    supported_by:
    - reference_id: PMID:29665086
      supporting_text: The alterations in the cellular, compositional, and structural
        properties of Chi/+ bones bear an explanation for the impaired local mechanical
        properties
