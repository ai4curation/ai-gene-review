- id: PMID:26876635
  title: 'Zebrafish Collagen Type I: Molecular and Biochemical Characterization of
    the Major Structural Protein in Bone and Skin.'
  findings:
  - statement: Three type I collagen chains (alpha1, alpha2, alpha3) are present at
      the protein level in embryos and adult bone, skin and scales, at about 1:1:1.
    supporting_text: Even though in adult bone, skin and scales equal amounts of α1(I),
      α3(I) and α2(I) chains are present
  - statement: col1a1a, col1a1b and col1a2 are co-expressed, except that only col1a1a
      is expressed in the fin fold.
    supporting_text: Interestingly, only col1a1a was shown to be expressed in the median
      fin fold and in the apical ectodermal ridge of the pectoral fin at 48, 72 and
      96 hpf
  - statement: alpha1(I) and alpha3(I) share 78% identity; alpha3(I) lacks one
      inter-chain C-propeptide cysteine.
    supporting_text: Interestingly, in proα3 this latter domain, crucial for chain
      association in the trimer, lacks one of the 4 conserved cysteine residues involved
      in inter-chain bonds (Cys63 of the proα1(I) C-propeptide)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Central biochemical characterization of both chains.
