- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:19757382
  qualifier: located_in
  review:
    summary: >-
      The paper is about grhl1-expressing epidermal cell lineages. The full
      text was read. col1a1 appears only as an mRNA probe marking basal
      keratinocytes in double fluorescent in situ hybridization. No col1a1
      protein localization is reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The staining localizes col1a1 transcripts, not the protein. The claim is
      not strictly false: nascent procollagen sits in the endoplasmic
      reticulum, which GO places within the cytoplasm. But it is uninformative
      about where the protein acts, and it has been propagated by IBA to both
      paralogs. The informative location is the extracellular matrix. Marked as
      over-annotated rather than removed, because the figures could not be
      inspected.
    supported_by:
    - reference_id: PMID:19757382
      supporting_text: double fluorescent in situ hybridizations for grhl1 and the
        keratinocyte markers collagen 1a1
