- term:
    id: GO:0005584
    label: collagen type I trimer
  evidence_type: IDA
  original_reference_id: PMID:26876635
  review:
    summary: >-
      Proposed location. Mass spectrometry of pepsin-extracted type I collagen
      from 48 hpf embryos and from adult bone, skin and scales identifies
      alpha1(I) peptides together with alpha3(I) and alpha2(I). Amino acid
      analysis excludes significant homotrimers in adult tissues and supports
      about equal amounts of the three chains.
    action: NEW
    reason: >-
      This is the complex the alpha1(I) chain is a subunit of. Human COL1A1
      carries GO:0005584 by IDA/IPI/IMP. By definition the term covers both
      heterotrimers and alpha1(I) homotrimers, which also fits the proposed
      homotrimers in actinotrichia. The same term is proposed for col1a1b.
    supported_by:
    - reference_id: PMID:26876635
      supporting_text: We demonstrated that, both in zebrafish embryos and adult
        tissues, three instead of two types of alpha chains contribute to the formation
        of the collagen type I triple helix
    - reference_id: PMID:26876635
      supporting_text: >-
        a 1:1:1 ratio for the three α chains in all tissues is inferred
core_functions:
- description: >-
    Col1a1a (alpha1(I)) is a structural chain of zebrafish type I collagen.
    It assembles with alpha2(I) (col1a2) and the teleost alpha3(I) (col1a1b)
    into triple-helical trimers that are secreted and self-assemble into
    fibrils. These fibrils give tensile strength to the matrix of bone, skin,
    scales, tendons and ligaments, and serve as the template for bone
    mineralization. alpha1(I) is the dose-limiting chain: its complete loss
    is lethal, whereas loss of alpha3(I) is tolerated.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  - id: GO:0001501
    label: skeletal system development
  locations:
  - id: GO:0031012
    label: extracellular matrix
  in_complex:
    id: GO:0005584
    label: collagen type I trimer
  supported_by:
  - reference_id: PMID:26876635
    supporting_text: We demonstrated that, both in zebrafish embryos and adult tissues,
      three instead of two types of alpha chains contribute to the formation of the
      collagen type I triple helix
  - reference_id: PMID:30082390
    supporting_text: Eventually, all genotypes containing a homozygous knockout of
      col1a1a [loss of α1(I)] were found to be lethal by the age of 3 mo.
  - reference_id: PMID:35282456
    supporting_text: In contrast, the Chi/+ bone matrix is characterised by densely
      packed collagen fibrils in the vicinity of the osteoblasts (Figure 7C).
- description: >-
    Copy-specific role: col1a1a is the only type I collagen gene expressed in
    the median fin fold and pectoral fin margin. There its product, thought
    to form alpha1(I) homotrimers, is a structural component of actinotrichia,
    the collagen fibres that support and shape the larval fin fold and the tip
    of adult fin rays. Actinotrichia are absent in col1a1a knockout larvae.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0033334
    label: fin morphogenesis
  in_complex:
    id: GO:0005584
    label: collagen type I trimer
  supported_by:
  - reference_id: PMID:26876635
    supporting_text: Given the absence of col1a1b and col1a2 expression, our findings
      also support the presence of α1(I) homotrimers in actinotrichia.
  - reference_id: PMID:30082390
    supporting_text: Upon detailed examination of the finfold, these actinotrichia
      were found to be absent in col1a1a−/− mutant larvae (Fig. 5D).
  - reference_id: PMID:21420398
    supporting_text: Both col1a1a and col2a1b were found in actinotrichia forming
      cells.
suggested_questions:
- question: >-
    ZFIN attaches two col1a1a skeletal system development IMP rows
    (PMID:30082390) to genotypes that carry no col1a1a allele
    (col1a1b^dmh29/+ and col1a2^dmh15/+). Should these rows move to col1a1b
    and col1a2? col1a1b currently has no annotation from PMID:30082390 at all.
- question: >-
    Is col1a1b (alpha3(I)) upregulated in col1a1a heterozygous nonsense
    mutants (transcriptional adaptation)? This would help explain why
    col1a1a+/- fish have no skeletal phenotype.
- question: >-
    Do actinotrichia really contain alpha1(I) homotrimers? The inference rests
    on in situ expression and co-migration, not on direct chain analysis of
    isolated actinotrichia.
suggested_experiments:
- description: >-
    Chain-specific proteomics (SRM with alpha1(I)- and alpha3(I)-unique
    peptides) of isolated actinotrichia and of adult bone, skin and scale
    collagen from col1a1a+/- and col1a1b-/- fish, to measure trimer
    composition and any compensatory change in the other chain.
  experiment_type: targeted mass spectrometry
- description: >-
    Compare col1a1a nonsense (NMD) alleles with a promoter-deletion
    (RNA-less) col1a1a allele and quantify col1a1b expression, to separate
    transcriptional adaptation from true redundancy.
  experiment_type: genetic loss-of-function comparison
