gene_symbol: tlr5b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'One of the two Toll-like receptor 5 proteins produced by the duplicated tlr5 genes
  of zebrafish, and the flagellin-sensing receptor whose ectodomain provided the reference crystal
  structure of a TLR5-flagellin complex. It has a signal peptide, a leucine-rich-repeat ectodomain
  that contacts the D1 helices of bacterial flagellin, a single transmembrane segment and a cytoplasmic
  TIR domain. Unlike TLR5 of mammals, birds and reptiles, which signals as a homodimer, the zebrafish
  receptor is an obligate heterodimer: this protein and its paralogue together confer flagellin-induced
  NF-kappa-B activation, and neither works alone even when the trafficking chaperone UNC93B1 is
  supplied, which improves signalling and redistributes both proteins to shared vesicle-like compartments.
  Both the ectodomain and the cytoplasmic domain must be in heterodimeric configuration for activation,
  indicating that the two paralogues have subfunctionalised. Flagellin recognition itself is conserved
  with mammalian TLR5, but the contact residues are species-specific: transplanting the zebrafish
  binding-site residues into human TLR5 abolishes its activation.'
