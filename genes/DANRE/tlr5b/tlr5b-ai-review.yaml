    summary: Correct, and the receptor-specific TLR5 pathway term applies, since flagellin recognition
      is conserved in this paralogue.
    action: MODIFY
    reason: 'The InterPro-based family assertion is right, and the specific child is justified:
      this gene product is a genuine tlr5 paralogue and flagellin-induced NF-kappa-B activation
      through it has been demonstrated directly, with the crystal structure of its ectodomain
      bound to flagellin defining the interaction. The ligand-specific term therefore does transfer
      from mammalian TLR5, which is the question the project asked; what does not transfer is
      the receptor configuration, since the zebrafish receptor is an obligate heterodimer with
      its paralogue. That is recorded in the core function rather than by withholding the pathway
      term, because GO:0034146 describes signals initiated by ligand binding to toll-like receptor
      5 without asserting a homodimer.'
