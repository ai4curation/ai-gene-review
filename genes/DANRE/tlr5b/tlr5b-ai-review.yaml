suggested_questions:
- question: Does zebrafish tlr5b respond to double-stranded RNA as a homodimer, as has been reported
    for the grass carp protein? If so, this gene product would have an interferon-directed antiviral
    function in addition to its flagellin function, and the two would use different receptor configurations.
- question: Where does the zebrafish TLR5 heterodimer engage flagellin? Both paralogues were seen
    in vesicle-like compartments that redistributed with UNC93B1, which is unusual for a receptor
    whose mammalian counterpart works at the cell surface, and no location term beyond generic
    membrane is currently justified.
- question: How should GO express an obligate heterodimeric receptor whose subunits are separate
    gene products? Neither paralogue has the activity alone, so the honest molecular-function
    statement is a contribution to a complex, but no complex term exists for this heterodimer
    and the pathway term is written in terms of a single receptor.
- question: Do the two paralogues differ in expression rather than only in biochemistry? Subfunctionalisation
    of a duplicated receptor would predict that the heterodimer can only form where both genes
    are expressed, which would bound the tissues in which flagellin sensing is possible.
suggested_experiments:
- description: 'Test dsRNA responsiveness of zebrafish tlr5b directly: express it alone and with
    its paralogue in zebrafish cells, stimulate with poly(I:C) and with an RNA virus, and read
    both NF-kappa-B and interferon-stimulated response element reporters, with knockdown of the
    endogenous gene as a control.'
  hypothesis: The dsRNA-sensing capacity reported for grass carp TLR5b is general to teleost TLR5b
    and is a homodimeric function distinct from heterodimeric flagellin sensing.
  experiment_type: receptor activation assay
- description: Localise the two paralogues at endogenous levels using epitope-tagged knock-in
    alleles, with and without flagellin stimulation, and determine whether flagellin recognition
    occurs at the plasma membrane or after internalisation.
  hypothesis: The heterodimer engages flagellin in an intracellular compartment, which would explain
    the UNC93B1 dependence and would justify a specific location annotation.
  experiment_type: endogenous localisation
- description: Quantify the flagellin affinity and signalling output of defined ectodomain combinations
    in vitro, comparing the tlr5b homodimer, the tlr5a homodimer and the heterodimer against flagellins
    from several fish pathogens.
  hypothesis: The heterodimer, not either homodimer, is the functional flagellin receptor across
    ligand variants, and the two paralogues contribute unequal binding surfaces.
  experiment_type: quantitative binding and signalling comparison
