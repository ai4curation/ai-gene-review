id: Q6PEI9
gene_symbol: col1a1b
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  col1a1b (collagen type I alpha 1b; also known as col1a3) encodes the
  pro-alpha3(I) chain, a third type I collagen alpha chain found in most bony
  fishes but absent from tetrapods. It is one of two zebrafish co-orthologs
  of human COL1A1; its paralog col1a1a encodes alpha1(I), and the two arose by
  duplication of the ancestral alpha1(I) gene, most likely in the
  teleost-specific genome duplication. The 1449-aa secreted procollagen has
  the full fibrillar collagen architecture (signal peptide, von Willebrand
  factor type C domain in the N-propeptide, uninterrupted Gly-X-Y triple
  helix, fibrillar collagen NC1 C-propeptide) and is 78% identical to
  pro-alpha1(I). It differs from alpha1(I) at one of the inter-chain
  C-propeptide cysteines, in a more divergent chain recognition region, and
  in a higher Gly-Gly content of the helix. Alpha3(I) is translated in
  embryos and is a regular component of type I collagen in adult bone, skin
  and scales, where the three chains occur at about equal amounts, with a
  relatively higher alpha3(I) share in skin and scales than in bone. col1a1b
  is co-expressed with col1a1a and col1a2 in osteoblasts, tendon and
  ligament fibroblasts, myosepta and basal epidermis, but not in the fin
  fold. A dominant helix glycine substitution (dmh29) causes a severe
  osteogenesis imperfecta-like skeletal phenotype, showing that alpha3(I) is
  incorporated into bone collagen. Null mutants are viable with only mild
  bone changes, while combined heterozygous loss of col1a1a and col1a1b
  causes bone fragility.
