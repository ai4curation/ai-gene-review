- term:
    id: GO:0005584
    label: collagen type I trimer
  evidence_type: IDA
  original_reference_id: PMID:26876635
  review:
    summary: >-
      Proposed location. Alpha3(I) peptides are identified by mass
      spectrometry in pepsin-extracted type I collagen from 48 hpf embryos and
      from adult bone, skin and scales. Amino acid composition (the Ile/Leu
      ratio) supports about equal amounts of alpha1(I), alpha2(I) and
      alpha3(I) and excludes significant homotrimers. Dominant helix glycine
      substitutions in col1a1b act dominantly on bone collagen.
    action: NEW
    reason: >-
      This is the complex alpha3(I) is a subunit of, and it is the central
      point for this paralog: col1a1b encodes an additional chain of the same
      complex, not a separate collagen type. GO:0005584 is defined as a
      collagen trimer containing alpha(I) chains, which includes the teleost
      alpha1(I)alpha2(I)alpha3(I) heterotrimer. The exact trimer
      stoichiometry, whether alpha1alpha2alpha3 alone or a mixture with
      (alpha1)2alpha2 and (alpha3)2alpha2, is unresolved, but the membership is
      established. The same term is proposed for col1a1a, and human COL1A1
      carries it by IDA.
    supported_by:
    - reference_id: PMID:26876635
      supporting_text: The identification of α3(I) peptides demonstrated for the
        first time the translation of the col1a1b gene in zebrafish.
    - reference_id: PMID:26876635
      supporting_text: We demonstrated that, both in zebrafish embryos and adult
        tissues, three instead of two types of alpha chains contribute to the formation
        of the collagen type I triple helix
    - reference_id: PMID:30082390
      supporting_text: arguing for a dominant-negative effect on type I bone collagen
        and thus incorporation of a substantial amount of both α1(I) and α3(I) into
        the type I collagen triple helix.
core_functions:
- description: >-
    Col1a1b (alpha3(I)) is an additional structural chain of zebrafish type I
    collagen. It is incorporated with alpha1(I) (col1a1a) and alpha2(I)
    (col1a2) into triple-helical type I collagen of bone, skin and scales,
    where the three chains are present at about equal amounts, and it
    contributes to the fibrillar matrix that gives these tissues tensile
    strength. Its function overlaps that of alpha1(I) and is partly
    interchangeable with it: loss of alpha3(I) alone is tolerated, but
    reducing both chains causes bone fragility. Its share is higher in skin
    and scales than in bone.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  - id: GO:0001501
    label: skeletal system development
  locations:
  - id: GO:0031012
    label: extracellular matrix
  in_complex:
    id: GO:0005584
    label: collagen type I trimer
  supported_by:
  - reference_id: PMID:26876635
    supporting_text: Even though in adult bone, skin and scales equal amounts of α1(I),
      α3(I) and α2(I) chains are present
  - reference_id: PMID:30082390
    supporting_text: Heterozygous loss of either α1(I) or α3(I) did not induce any
      skeletal abnormalities, while reduced levels of both α1(I) and α3(I) (col1a1a+/−;col1a1b+/−
      mutants) causes a mild skeletal phenotype with increased bone fragility, arguing
      for interchangeability and functional redundancy between α1(I) and the homologous
      α3(I).
  - reference_id: PMID:28835471
    supporting_text: while the dmh29 mutants exhibit mutations in a glycine residue
      of the col1a1b gene (G1123D), leading to a very similar phenotype.
suggested_questions:
- question: >-
    What is the actual trimer composition in each tissue: alpha1alpha2alpha3
    only, or a mixture with (alpha1)2alpha2 and (alpha3)2alpha2? How does the
    missing inter-chain C-propeptide cysteine of alpha3(I) constrain chain
    selection?
- question: >-
    Does alpha3(I) change the properties of the collagen it is part of, for
    example lower thermal stability from its high Gly-Gly content, or
    different cross-linking in skin and scales? Or is it a dosage copy of
    alpha1(I) with a neutral sequence drift?
- question: >-
    ZFIN has not annotated col1a1b from PMID:30082390 (the null sa12931 and
    the dominant dmh29 phenotypes); instead, a dmh29 genotype row is attached
    to col1a1a. Should that evidence be moved to col1a1b?
suggested_experiments:
- description: >-
    Chain-resolved proteomics of cross-linked peptides (or intact trimers)
    from wild-type skin, scale and bone, to establish which trimer species
    exist and whether alpha3(I) pairs with alpha1(I) in the same molecule.
  experiment_type: structural mass spectrometry
- description: >-
    Swap test: knock the col1a1a coding sequence into the col1a1b locus (and
    the reverse) to ask whether alpha1(I) can fully replace alpha3(I) in skin
    and scale collagen and whether alpha3(I) can support actinotrichia.
  experiment_type: knock-in allele replacement
- description: >-
    Thermal stability (DSC) and fibril diameter of skin and scale collagen
    from col1a1b-/- fish compared with wild type, to test whether alpha3(I)
    changes the material properties of type I collagen.
  experiment_type: biophysical characterization
