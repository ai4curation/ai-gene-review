  review:
    summary: >-
      Genotype col1a1b^dmh29/+ (ZFIN). dmh29 is a dominant glycine
      substitution in the col1a1b triple helix, isolated in an adult screen for
      short stature, with strong vertebral deformation and excess bone
      formation. In the follow-up phenomic survey it is the most severe of the
      helix glycine alleles tested in the col1a1 paralogs.
    action: ACCEPT
    reason: >-
      A dominant glycine substitution acts through the mutant chain being
      built into trimers, so this allele shows directly that alpha3(I) is part
      of skeletal type I collagen. col1a1b contributes structure to bone
      matrix, so the role is direct. The single-copy null phenotype is milder
      (fractures and increased mineral density in some fish), which fits a
      structural chain partly backed up by alpha1(I).
    supported_by:
    - reference_id: PMID:28835471
      supporting_text: while the dmh29 mutants exhibit mutations in a glycine residue
        of the col1a1b gene (G1123D), leading to a very similar phenotype.
    - reference_id: PMID:30082390
      supporting_text: with col1a1bdmh29/+ fish displaying the most severe skeletal
        phenotype with kyphoscoliosis and shorter, thicker, and overmineralized vertebral
        bodies and frequent rib fractures
    - reference_id: PMID:30082390
      supporting_text: Fish with a complete loss of α3(I), but intact α1(I) did
        not show significant alterations of bone morphology (SI Appendix, Fig. S7),
        although some fish showed evidence of fractures (Fig. 1 and Table 2) and
        increased TMD throughout the vertebral column, indicating an impaired bone
        quality.
