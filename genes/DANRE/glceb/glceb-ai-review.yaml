      within the polymer
    reference_section_type: RESULTS
  - statement: 'Substrate recognition requires N-sulfation context: GLCE preferentially recognizes HS
      regions where adjacent

      glucosamine residues are N-sulfated, coupling epimerization to the modification phase of HS biosynthesis.'
    supporting_text: GLCE preferentially recognizes HS regions where adjacent glucosamine residues 
      are **N-sulfated** (GlcNS)
    reference_section_type: RESULTS
  - statement: 'The zebrafish Glce crystal structure shows a stable dimer with two catalytic sites per
      dimer in C-terminal

      helical domains; active-site tyrosines Tyr468, Tyr528 and Tyr546 are essential for activity.'
    supporting_text: 'Glce forms a **stable dimer** in which each dimer contains **two catalytic sites**
      located in C-terminal

      helical domains'
    reference_section_type: RESULTS
  - statement: 'Active-site tyrosines Tyr468, Tyr528 and Tyr546 were shown by structure-guided mutagenesis
      to be essential

      for zebrafish Glce enzymatic activity.'
    supporting_text: Tyr468, Tyr528, and Tyr546 were identified as essential for enzymatic activity
    reference_section_type: RESULTS
  - statement: 'GLCE is a type II transmembrane Golgi-resident glycan modification enzyme; its HS-modified
      products act at the

      cell surface and ECM after proteoglycan trafficking.'
    supporting_text: 'GLCE/Glce is generally described as a **type II transmembrane protein** in the HS
      biosynthetic machinery,

      which is consistent with function as a Golgi-resident glycan modification enzyme'
    reference_section_type: DISCUSSION
  - statement: 'Zebrafish has two Glce paralogs (Glce-A, Glce-B) arising as duplicated orthologs of the
      single human GLCE

      gene, with ~67% and ~73% homology to human GLCE respectively.'
    supporting_text: 'zebrafish were shown to have **two Glce-like paralogs**, **Glce-A and Glce-B**,
      arising as duplicated

      orthologs of the **single human GLCE gene**'
    reference_section_type: RESULTS
  - statement: 'glce-A and glce-B transcripts are maternally supplied, broadly expressed during gastrulation,
