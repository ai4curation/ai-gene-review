    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:25568314
  review:
    summary: IPI from the zebrafish Glce crystal structures (PMID:25568314), which were solved in a 
      stable dimer conformation, with each dimer containing two catalytic sites in the C-terminal 
      alpha-helical domains. Bacterial Glce is a dimer too, supporting that the dimer is the 
      functional unit.
    action: KEEP_AS_NON_CORE
    reason: Self-association is real and structurally meaningful here - the catalytic clefts are 
      formed in the dimer and a long HS chain may thread through both sites (PMID:25568314) - so 
      this is not an uninformative binding annotation. But the informative molecular function is 
      already recorded as GO:0047464; homodimerization is the quaternary arrangement that supports 
      it, not a separate activity. Kept as non-core.
    supported_by:
