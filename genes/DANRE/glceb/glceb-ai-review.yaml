      deposited. Cited by UniProt as an ECO:0000269 source.
core_functions:
- description: glceb epimerizes C5 of D-glucuronate adjacent to N-sulfated glucosamine to 
    L-iduronate in nascent heparan sulfate chains in the Golgi membrane, the step between 
    N-sulfation and O-sulfation of the chain (PMID:25568314). The enzyme works as a homodimer with 
    two catalytic sites and requires Tyr468, Tyr528 and Tyr546. The iduronate introduced increases 
    chain flexibility and is what makes HS competent for ligand recognition and signalling.
