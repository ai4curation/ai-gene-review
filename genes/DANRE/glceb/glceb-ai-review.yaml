      expanded blood islands, abnormal somites).'
    supporting_text: Overexpression** of glce-A or glce-B causes **dose-dependent ventralization**
    reference_section_type: RESULTS
  - statement: 'Morpholino knockdown of glce causes dorsalization (reduced ventral tail fin, kinked/coiled
