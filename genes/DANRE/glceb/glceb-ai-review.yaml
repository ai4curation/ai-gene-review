suggested_questions:
- question: 'Do zebrafish glceb (glce-B) and glcea (glce-A) have distinct or redundant roles in HS fine
    structure and

    morphogen signaling, given their overlapping expression and similar overexpression/knockdown phenotypes?'
- question: 'Does the reported physical association of Glce with 2-O- and 6-O-sulfotransferases (the proposed
    ''GAGosome'')

    operate in zebrafish, and is it required for proper IdoA/O-sulfation patterning in vivo?'
- question: Is there any division of labour between glceb and glcea in vivo, given that their 
    overexpression phenotypes are indistinguishable (PMID:16156897) and no single-gene mutant has 
    been reported?
  experts: []
suggested_experiments:
- description: 'Generate glceb loss-of-function mutants (CRISPR) and assay HS disaccharide composition
    (IdoA content) together

    with dorsoventral patterning markers to define the in vivo requirement for glceb specifically versus
    glcea.'
- hypothesis: Zebrafish glceb protein resides in the Golgi membrane, as inferred from rat Glce.
  description: Image tagged or endogenous Glceb against Golgi markers in zebrafish embryos, which 
    would convert the current ISS/IEA location assignment into direct evidence.
  experiment_type: imaging
