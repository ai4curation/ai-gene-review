description: 'Zebrafish glceb (glce-B) encodes D-glucuronyl C5-epimerase B, a 585-residue single-pass
  type II Golgi membrane enzyme. It epimerizes C5 of D-glucuronate residues that sit next to N-sulfated
  glucosamine in a nascent heparan sulfate or heparin chain, converting them to L-iduronate (EC 5.1.3.17)
  and so acting between N-sulfation and O-sulfation in the ordered chain-modification sequence (PMID:25568314).
  Crystal structures of the zebrafish enzyme show a stable homodimer with two catalytic sites in the C-terminal
  alpha-helical domains, and mutagenesis identifies Tyr468, Tyr528 and Tyr546 as essential (PMID:25568314).
  The iduronate it creates gives the chain conformational flexibility that underlies ligand binding and
  cell signalling. Zebrafish carries two paralogs of the single human GLCE gene, glce-A and glce-B, both
  maternally deposited and functionally interchangeable in overexpression assays; raising glce levels
  ventralizes embryos and potentiates Bmp2b, while knockdown dorsalizes them, placing the epimerase upstream
  of BMP-dependent dorsoventral patterning (PMID:16156897).'
