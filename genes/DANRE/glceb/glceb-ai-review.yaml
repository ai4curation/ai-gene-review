      supporting_text: Here, we report that zebrafish Glce has a dimeric structure.
    - reference_id: PMID:25568314
      supporting_text: A Glce dimer contains two catalytic sites, each at a positively charged cleft
        in C-terminal α-helical domains binding one negatively charged hexasaccharide.
