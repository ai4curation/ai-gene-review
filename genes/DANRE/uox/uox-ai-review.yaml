taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'uox encodes uricase (urate oxidase, EC 1.7.3.3), a cofactorless T-fold enzyme that catalyses
  the first and committed step of oxidative uricolysis, converting urate to 5-hydroxyisourate with consumption
  of O2 and release of H2O2. It assembles as a homotetramer (a dimer of dimers) with active sites at subunit
  interfaces, has a KM near 11 uM for urate and is competitively inhibited by xanthine. A C-terminal ARM
  tripeptide targets it to the peroxisome, where it acts with Urah (5-hydroxyisourate hydrolase) and Urad
  (OHCU decarboxylase) to produce (S)-allantoin, the soluble nitrogenous end product excreted by fish.
  The gene is expressed largely in liver; zebrafish lacking it are viable but accumulate urate, unlike
  hominoids, in which the orthologous gene was pseudogenised.'
