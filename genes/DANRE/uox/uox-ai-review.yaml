references:
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by 
    curator judgment of sequence similarity
  findings:
  - statement: Peroxisome localization (GO:0005777) was transferred to zebrafish Uox by 
      curator-judged sequence similarity to UniProtKB:P09118 (rat uricase).
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: Phylogenetic inference within PANTHER family PTN000044668 supports involvement of Uox
      in urate catabolic process (GO:0019628) and purine nucleobase catabolic process (GO:0006145) 
      and activity in the peroxisome (GO:0005777).
- id: GO_REF:0000041
  title: Gene Ontology annotation based on UniPathway vocabulary mapping.
  findings:
  - statement: UniPathway UPA00394 (urate degradation to (S)-allantoin) maps Uox to urate catabolic 
      process (GO:0019628); UniProt assigns Uox step 1/3 (UER00650).
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary 
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: The UniProt Swiss-Prot subcellular location keyword SL-0204 (Peroxisome) maps Uox to 
      peroxisome (GO:0005777).
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: The ARBA machine-learning model ARBA00034937 predicts purine-containing compound 
      catabolic process (GO:0072523) for Uox.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined IEA evidence (ARBA00087801, RHEA:21368, EC 1.7.3.3) assigns Uox urate 
      oxidase activity (GO:0004846).
- id: PMID:26349049
  title: The identification of an integral membrane, cytochrome c urate oxidase completes the 
    catalytic repertoire of a therapeutic enzyme.
  findings:
  - statement: Zebrafish Uox restores urate degradation in an Agrobacterium mutant lacking its urate
      oxidase.
    supporting_text: the phenotype was fully restored by complementation with a cytosolic Uox from 
      zebrafish.
  - statement: Urate oxidation by zebrafish Uox generates H2O2, raising catalase four-fold.
    supporting_text: Consistent with H2O2 production by zfUox, urate oxidation in the complemented 
      strain caused a four-fold increase of catalase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; title verified. The zebrafish Uox is used as the complementing 
      enzyme in an A. fabrum puuD deletion, giving an in vivo demonstration of its urate-degrading, 
      H2O2-producing activity; the paper's main subject is the bacterial cytochrome c urate oxidase.
- id: PMID:27922051
  title: Catalysis and Structure of Zebrafish Urate Oxidase Provide Insights into the Origin of 
    Hyperuricemia in Hominoids.
  findings:
  - statement: Uox catalyses the first reaction of the three-step oxidative uricolysis pathway.
    supporting_text: Urate oxidase (Uox) catalyses the first reaction of oxidative uricolysis, a
  - statement: Zebrafish Uox is 298 aa with a C-terminal ARM tripeptide that is a type 1 
      peroxisome-targeting signal.
    supporting_text: encodes a protein of 298 aa with a C-terminal tripetide (ARM) corresponding to 
      the type 1 peroxisome-targeting signal
  - statement: Purified zebrafish Uox is predominantly tetrameric.
    supporting_text: with a large prevalence of the tetrameric assembly for both proteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; title verified. Primary functional and structural 
      characterisation of zebrafish Uox (kinetics, xanthine inhibition, tetramer, PTS1 tripeptide) 
      and the source UniProt cites for EC 1.7.3.3 and KM.
- id: PMID:28508122
  title: A Trivalent Enzymatic System for Uricolytic Therapy of HPRT Deficiency and Lesch-Nyhan 
    Disease.
  findings:
  - statement: Zebrafish Uox, Urah and Urad were produced recombinantly as the uricolytic enzyme 
      complement.
    supporting_text: We produced in recombinant form three zebrafish enzymes required in the 
      uricolytic pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; title verified. Recombinant zebrafish Uox, Urah and Urad 
      produced and assayed for PEGylated enzyme therapy; supports the activity of the zebrafish 
      protein, though the aim is therapeutic formulation.
- id: PMID:36553446
  title: Uricase-Deficient Larval Zebrafish with Elevated Urate Levels Demonstrate Suppressed Acute 
    Inflammatory Response to Monosodium Urate Crystals and Prolonged Crystal Persistence.
  findings:
  - statement: uox knockout larvae have reduced hepatic uox expression and elevated urate.
    supporting_text: We show that uox KO (uox−/−) larvae have significantly reduced expression of 
      uox in the liver and elevated urate levels at early larval stages.
  - statement: The uox null mutant is a hyperuricemic larval model that remains viable.
    supporting_text: Here we describe a zebrafish uox null mutant that possesses elevated urate 
      levels at larval stages.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; title verified. CRISPR uox null zebrafish with elevated larval 
      urate; the only loss-of-function evidence for this gene and the basis of the IMP row.
