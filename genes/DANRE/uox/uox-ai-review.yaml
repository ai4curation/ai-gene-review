- id: file:DANRE/uox/uox-deep-research-falcon.md
  title: Falcon (Edison Scientific Literature) deep research report for Danio rerio uox (Q6DG85)
  findings:
  - statement: Falcon synthesizes that zebrafish Uox is a classical cofactorless urate oxidase 
      catalyzing oxidation/hydroxylation of urate to 5-hydroxyisourate (HIU).
    supporting_text: Zebrafish Uox catalyzes **oxidation/hydroxylation of urate to HIU**, and is 
      described as the **classical cofactorless Uox** (i.e., it does not require a tightly bound 
      organic cofactor).
    reference_section_type: OTHER
  - statement: Falcon places Uox among peroxisomal oxidases that use molecular oxygen as electron 
      acceptor and generate hydrogen peroxide as a byproduct.
    supporting_text: Uox is grouped among peroxisomal oxidases that use **molecular oxygen (O₂)** as
      electron acceptor and generate **hydrogen peroxide (H₂O₂)** as a byproduct of oxidation 
      chemistry
    reference_section_type: OTHER
  - statement: Falcon assigns Uox the first, rate-limiting step of the three-step uricolysis 
      pathway, followed by Urah (HIU hydrolase) and Urad (OHCU decarboxylase) to (S)-allantoin.
    supporting_text: the canonical uricolysis pathway is a **three-enzyme** sequence in which Uox 
      generates **5-hydroxyisourate (HIU)**, followed by HIU hydrolase (Urah) and OHCU decarboxylase
      (Urad) to yield **(S)-allantoin**.
    reference_section_type: OTHER
  - statement: Falcon supports peroxisomal matrix localization of Uox via a C-terminal PTS1 (ARM) 
      targeting signal and a zebrafish peroxisomal proteome inventory.
    supporting_text: DrUox encodes a C-terminal **ARM** tripeptide corresponding to a **PTS1** 
      motif, indicating peroxisomal matrix import.
    reference_section_type: OTHER
  - statement: Falcon reports the kinetic parameters of recombinant wild-type DrUox (Km ~11 uM, kcat
      ~4 per s) consistent with the UniProt KM value.
    supporting_text: '**Wild-type DrUox:** **Km = 11 ± 1 μM**, **kcat ≈ 4 s⁻¹**.'
    reference_section_type: OTHER
  - statement: Falcon notes the homotetrameric T-fold architecture of zebrafish Uox with active 
      sites at subunit interfaces.
    supporting_text: Zebrafish Uox forms a **tetramer** with the **T-fold** architecture typical of 
      classical uricases; the functional active sites occur at subunit interfaces.
    reference_section_type: OTHER
