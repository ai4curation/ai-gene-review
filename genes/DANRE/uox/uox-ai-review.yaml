suggested_questions:
- question: Is zebrafish Uox imported into peroxisomes in vivo via its ARM/PTS1 tripeptide, and does
    mislocalisation alter urate handling?
- question: Does the H2O2 generated by Uox contribute measurably to peroxisomal oxidative load in 
    zebrafish liver, given catalase co-localisation?
suggested_experiments:
- description: Image tagged Uox against a peroxisomal marker in zebrafish liver, with and without 
    the C-terminal ARM tripeptide.
  hypothesis: The ARM tripeptide is necessary and sufficient for peroxisomal import of zebrafish 
    Uox.
- description: Measure allantoin and urate in uox-/- versus wild-type larvae and after re-expression
    of wild-type or F216S Uox.
  hypothesis: Urate accumulation in uox nulls reflects loss of the first uricolytic step and is 
    rescued by catalytically competent Uox.
