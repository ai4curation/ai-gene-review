suggested_questions:
- question: Does grk7b loss delay photoresponse recovery specifically in UV cones, where it is the enriched GRK7 paralog, or does grk7a compensate?
- question: What are the kinetic parameters of recombinant Grk7b on UV opsin (opn1sw1) versus rhodopsin, and how do they compare with Grk7a?
suggested_experiments:
- description: Generate a grk7b CRISPR mutant and record UV-cone-isolated electroretinograms (and grk7a/grk7b double mutants) to test whether Grk7b contributes to cone response recovery in the UV cone subtype.
  hypothesis: Grk7b is required for rapid photoresponse shutoff in UV cones, a role masked in whole-retina recordings dominated by grk7a-expressing cones.
