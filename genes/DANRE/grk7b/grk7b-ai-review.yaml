gene_symbol: grk7b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: grk7b (GRK7-2) is one of two zebrafish paralogs of the cone-type G protein-coupled receptor kinase GRK7, an AGC-family serine/threonine kinase with an N-terminal RGS homology domain and a C-terminal geranylgeranylated cysteine that anchors it to photoreceptor membranes. Recombinant Grk7b phosphorylates light-activated rhodopsin (EC 2.7.11.14), the reaction that initiates opsin deactivation and arrestin binding during photoresponse shutoff and light adaptation. Its transcript is enriched in UV cones, and it is also expressed in the pineal organ and brain, whereas the paralog grk7a serves the other cone subtypes and is the kinase whose knockdown delays cone recovery and pineal parapinopsin inactivation; a distinct in vivo role for grk7b has not yet been demonstrated.
