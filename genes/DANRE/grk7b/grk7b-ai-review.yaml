- id: PMID:16787417
  title: 'GRK1 and GRK7: unique cellular distribution and widely different activities of opsin phosphorylation in the zebrafish rods and cones.'
  findings:
  - statement: Zebrafish has two GRK7 paralogs, GRK7-1 (grk7a) and GRK7-2 (grk7b).
    supporting_text: Screening of the ocular cDNAs identified two homologs for each of GRK1 (1A and 1B) and GRK7 (7-1 and 7-2), and they were classified into three GRK subfamilies, 1 A, 1B and 7 by phylogenetic analysis.
  - statement: Recombinant zebrafish GRKs phosphorylate light-activated rhodopsin; GRK7-1 has 32-fold higher Vmax than GRK1A.
    supporting_text: The recombinant GRKs phosphorylated light-activated rhodopsin, and the Vmax value of the major cone subtype, GRK7-1, was 32-fold higher than that of the rod kinase, GRK1A.
  - statement: GRK7-1 and GRK1B localise to cone outer segments (GRK7-2 localisation not stated in the abstract).
    supporting_text: In situ hybridization and immunohistochemical studies localized both GRK1B and GRK7-1 in the cone outer segments and GRK1A in the rod outer segments.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Wada et al. 2006, J Neurochem). Abstract only, but UniProt cites it (ECO:0000269) for both rhodopsin-kinase reactions of Q1XHL7; GRK7-2 in this paper is grk7b. Source of the IDA row.
