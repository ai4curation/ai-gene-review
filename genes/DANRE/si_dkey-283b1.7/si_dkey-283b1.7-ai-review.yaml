suggested_questions:
- question: Is si:dkey-283b1.7 the TGD ohnolog of vwc2 (PANTHER), a fast-evolving VWC2L-related copy, or a separate old family
    branch lost in tetrapods (Ensembl Compara gives it no gar or human ortholog)? Its chromosome 3 neighbourhood shows no
    conserved synteny with the gar vwc2 region. A phylogeny with more non-teleost fish (bichir, sturgeon, bowfin, elephant
    shark) and a search of the gar genome for an unannotated brorin-family gene would help decide.
- question: Where exactly is si:dkey-283b1.7 expressed in retina and brain, and does its domain overlap with vwc2 or vwc2l?
- question: Does the protein inhibit BMP signalling, like vwc2, despite its divergent core?
suggested_experiments:
- hypothesis: si:dkey-283b1.7 is a secreted BMP antagonist.
  description: Inject si:dkey-283b1.7 mRNA and score dorsalization and pSmad1/5/8, side by side with brorin (vwc2) mRNA; test
    secretion of a tagged protein in cultured cells.
  experiment_type: overexpression / biochemical assay
- hypothesis: si:dkey-283b1.7 acts in the retina.
  description: In situ hybridization and a CRISPR mutant with retinal histology and ERG readouts.
  experiment_type: expression and loss-of-function
