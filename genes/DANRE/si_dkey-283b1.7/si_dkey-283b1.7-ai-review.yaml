description: si:dkey-283b1.7 (ZFIN ZDB-GENE-120215-126, chromosome 3; RefSeq name Brorin) encodes a 242-residue predicted
  secreted protein of the brorin (VWC2/VWC2L) family. It has an N-terminal signal peptide, then a short linker and the family's
  conserved core of two chordin-like von Willebrand factor C (VWFC) cysteine-rich domains, followed by a short basic tail.
  All 20 core cysteines of human VWC2 are conserved, but the long N-terminal region that distinguishes VWC2 is absent, so
  the architecture resembles VWC2L. The core is about 55-60% identical to each of VWC2, VWC2L and zebrafish vwc2, which is
  much lower than the 84-89% identity between vwc2 and human or gar VWC2. PANTHER places it as a teleost-duplication co-ortholog
  of VWC2, paired with vwc2. Ensembl Compara instead gives it no gar or human ortholog, only a medaka one, and its chromosomal
  neighbourhood shows no conserved synteny with the gar vwc2 region. It is therefore a fast-evolving teleost member of the
  family whose exact origin is unresolved. Public RNA-Seq calls place its expression in retina and brain. No experimental
  study of the gene has been published. Its activity (BMP antagonism, as for Brorin) is inferred from family membership only.
