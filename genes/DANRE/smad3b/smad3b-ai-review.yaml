suggested_questions:
- question: Do smad3b single mutants have any phenotype, and is smad3a upregulated in smad3b PTC mutants (transcriptional
    adaptation)?
- question: Does the S418N substitution or the diverged linker change Smad3b activity or its regulation by CK1/MAPK/CDK
    phosphorylation?
- question: Is the brain and spinal cord expression of smad3b (Pogoda and Meyer 2002) shared by smad3a, which has
    not been surveyed at the same resolution?
suggested_experiments:
- hypothesis: Smad3b is transcriptionally weaker than Smad3a because of linker divergence.
  description: Equal-dose SBE-reporter and target-gene assays of Smad3a, Smad3b, Smad3b N418S and linker-swapped
    chimeras in smad3a;smad3b double mutant embryos.
  experiment_type: cross-rescue
- hypothesis: The two copies overlap in expression at cellular resolution.
  description: Double fluorescent in situ or single-cell RNA-seq comparison of smad3a and smad3b across embryonic
    and adult tissues.
  experiment_type: expression analysis
