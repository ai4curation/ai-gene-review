gene_symbol: smad3b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'smad3b (SMAD family member 3b) is one of two zebrafish co-orthologs of vertebrate SMAD3, retained
  from the teleost-specific genome duplication; its paralog is smad3a. It encodes a receptor-regulated SMAD with
  an MH1 DNA-binding domain, a linker and an MH2 domain ending in the receptor-phosphorylated SSVS motif. It mediates
  TGF-beta/activin/nodal signals by forming complexes with SMAD4 that regulate transcription. smad3b is the faster-evolving
  copy: it differs from human SMAD3 mainly in the linker and carries asparagine at the position of the CK1 phosphosite
  S418, while keeping the Zn-binding, DNA-binding and receptor-phosphorylation residues. It is maternally supplied
  and zygotically expressed at the gastrula margin, tail bud, lateral mesoderm, brain regions, retina, spinal cord,
  somites and heart; unlike smad3a it is not expressed with a circadian rhythm. Overexpressed smad3b induces mesoderm
  and organizer genes such as goosecoid, and constitutively active Smad3b increases cardiomyocyte proliferation
  and activates Smad3 target genes. Knockdown of smad3b, like smad3a, alters neural differentiation. Combined loss
  of smad3a and smad3b enlarges the ventral aorta but is compatible with adult survival.'
