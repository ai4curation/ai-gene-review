suggested_questions:
- question: Where is Prom1b in the zebrafish photoreceptor (outer-segment base, rim, calyceal processes)? The published
    antibody did not work for immunofluorescence.
- question: Is prom1a upregulated in prom1b mutants, and would a prom1a; prom1b double mutant worsen the rod phenotype?
suggested_experiments:
- hypothesis: Prom1b acts at the base of nascent discs with Cdhr1a and Prph2, as mammalian PROM1 does.
  description: Knock in an epitope tag at prom1b and image it by expansion or immuno-electron microscopy in rods and
    cones, together with Prph2 and Cdhr1a.
  experiment_type: localization
