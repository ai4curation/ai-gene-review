description: prom1b (prominin 1 b) is one of two zebrafish co-orthologs of vertebrate PROM1 (prominin-1, CD133),
  retained from the teleost-specific genome duplication; its paralog is prom1a. It encodes a pentaspan membrane
  glycoprotein of the prominin family, which sits in cholesterol-rich protrusions of the apical plasma membrane;
  a GFP fusion of Prom1b is enriched at the apical surface of retinal neuroepithelial cells. prom1b is zygotic only,
  rises strongly at 3-5 dpf, and is the more abundant prominin transcript in rod and cone photoreceptors; it is also
  expressed on the scleral side of the retinal inner nuclear layer, in the pineal organ, and in adult brain germinative
  zones of the hindbrain. Loss of prom1b disrupts photoreceptor outer-segment morphogenesis and causes early cone
  degeneration, while rods survive with abnormal outer segments; the outer-segment protein Prph2 is mislocalized and
  its oligomerization disrupted. This matches the role of mammalian PROM1 in outer-segment disc formation and retinal
  degeneration.
