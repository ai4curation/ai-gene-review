    supporting_text: The Prom1 orthologs in zebrafish include prom1a and prom1b, and our results showed that prom1b,
      rather than prom1a, plays an important role in zebrafish photoreceptors.
  - reference_id: PMID:21407811
    supporting_text: Of the two prominin-1 paralogues, expression of prominin-1b appeared to be more robust in line
