description: 'tp53bp2b is one of two zebrafish co-orthologs of human TP53BP2 (ASPP2), a large cytoplasmic
  scaffold protein with an N-terminal Ras-associating (ubiquitin-like) domain, a coiled-coil and a long
  proline-rich, largely disordered middle region, and a C-terminal module of four ankyrin repeats and an
  SH3 domain. In mammals this C-terminal module binds the p53 DNA-binding domain and enhances p53-dependent
  apoptosis, and ASPP2 also acts at apical cell junctions, where it binds Par-3 and scaffolds PP1 and YAP.
  In zebrafish embryos, Aspp2b (like its paralog Aspp2a) binds Irs-1 and restrains embryonic body growth
  without changing developmental rate, by dampening Akt signaling. tp53bp2b transcripts are maternally
  provided and present in early embryos, are low during gastrulation and organogenesis, and are found in
  many larval and adult tissues. A GFP-tagged form expressed in embryos is cytoplasmic, and tp53bp2b is
  induced by the ciliogenic transcription factor Foxj1.'
