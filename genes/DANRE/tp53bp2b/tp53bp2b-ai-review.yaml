suggested_questions:
- question: Does tp53bp2b have a real role in motile cilia (as the morpholino screen suggested), and would a
    stable mutant confirm it?
- question: Both copies are maternally provided, but only tp53bp2b drops to near background during
    gastrulation and organogenesis. Is that a loss of zygotic enhancers in tp53bp2b, and does the gar gene
    show continuous expression?
- question: Does Aspp2b bind Tp53 and enhance p53-dependent apoptosis?
suggested_experiments:
- hypothesis: tp53bp2b is required for Kupffer's vesicle cilia motility.
  description: Make a stable tp53bp2b mutant (and maternal-zygotic mutant, given maternal expression); score
    Kupffer's vesicle cilia motility, left-right asymmetry markers and kidney cysts.
  experiment_type: loss of function
- hypothesis: The Aspp2a and Aspp2b proteins are interchangeable.
  description: Rescue the growth phenotype of each single or double mutant with either coding sequence.
  experiment_type: cross-rescue
