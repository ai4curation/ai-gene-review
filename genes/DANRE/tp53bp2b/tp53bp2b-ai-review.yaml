  review:
    summary: p53 binding propagated from the PANTHER ASPP node (human ASPP2 and worm ape-1 donors).
    action: ACCEPT
    reason: 'The p53-binding module of ASPP2 is the C-terminal ankyrin repeats plus SH3 domain. The four ankyrin
      repeats of tp53bp2b are 90.7-97.1% identical to human TP53BP2 and the SH3 domain is intact, so tp53bp2b
      sits inside the clade that inherited this function with no sign of loss. Binding of zebrafish Aspp2b to
      Tp53 has not itself been tested.'
    supported_by:
    - reference_id: PMID:8875926
      supporting_text: the SH3 domain binds the L3 loop of p53 in a manner distinct from that of previously
        characterized SH3-polyproline peptide complexes, and (ii) an ankyrin repeat, which forms an L-shaped
        structure consisting of a beta hairpin and two alpha helices, binds the L2 loop of p53
    - reference_id: file:DANRE/tp53bp2a/tp53bp2a-bioinformatics/RESULTS.md
