suggested_questions:
- question: Is the taurinomethyl-U34 modification itself lost in gtpbp3 knock-out zebrafish mt-tRNAs (by mass spectrometry), as opposed to the 2-thiouridylation and conformational read-outs reported?
- question: Does zebrafish Gtpbp3 require Mto1 for activity, and does an mto1 knock-out phenocopy the gtpbp3 cardiomyopathy?
suggested_experiments:
- description: LC-MS/MS nucleoside analysis of purified mt-tRNALys and mt-tRNALeu(UUR) from wild-type, gtpbp3+/- and gtpbp3-/- zebrafish hearts to quantify τm5U and τm5s2U directly.
  hypothesis: Gtpbp3 loss abolishes τm5U34 on mt-tRNAs in zebrafish, as in human GTPBP3-deficient cells.
