id: Q501Z5
gene_symbol: gtpbp3
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'gtpbp3 encodes the mitochondrial tRNA-modification GTPase GTPBP3 (TrmE/MnmE family), a nuclear-encoded, transit-peptide-targeted matrix protein that forms, with Mto1, the enzyme installing the 5-taurinomethyl group on the wobble uridine (U34) of mitochondrial tRNAGlu, tRNAGln, tRNALys, tRNATrp and tRNALeu(UUR). Its GTP hydrolysis, together with the Mto1 catalytic subunit, is required for the modification, which shapes the anticodon loop and supports accurate decoding during mitochondrial translation. In zebrafish all three isoforms localise to mitochondria; knock-out larvae show altered mt-tRNA conformation and aminoacylation, mildly reduced tRNALys, impaired synthesis of mtDNA-encoded OXPHOS subunits, proteostasis stress and hypertrophic cardiomyopathy, modelling GTPBP3-associated human cardiomyopathy.'
