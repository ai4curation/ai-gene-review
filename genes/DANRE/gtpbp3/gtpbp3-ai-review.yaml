- term:
    id: GO:0030488
    label: tRNA methylation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: tRNA methylation, from the MnmE-family PAINT node PTN000182687 seeded by E. coli MnmE.
    action: MODIFY
    reason: |-
      The MnmE/GTPBP3 complex does not add a methyl group: in bacteria MnmE-MnmG installs (carboxymethyl)aminomethyl-U34 and in mitochondria GTPBP3-MTO1 installs taurinomethyl-U34, a C5-CH2-taurine substituent whose methylene comes from methylene-THF (UniProt FUNCTION; [PMID:30916346]). 'tRNA methylation' therefore mis-describes the chemistry at the node and for the zebrafish target; the accurate term, GO:0070899 mitochondrial tRNA wobble uridine modification, is already annotated (ISS). Modify.
    proposed_replacement_terms:
    - id: GO:0070899
      label: mitochondrial tRNA wobble uridine modification
    supported_by:
    - reference_id: file:DANRE/gtpbp3/gtpbp3-uniprot.txt
      supporting_text: GTPase component of the GTPBP3-MTO1 complex that catalyzes the 5-taurinomethyluridine (taum(5)U) modification at the 34th wobble position (U34) of mitochondrial tRNAs (mt-tRNAs), which plays a role in mt-tRNA decoding and mitochondrial translation.
    - reference_id: PMID:30916346
      supporting_text: GTPBP3 is a highly conserved tRNA modifying enzyme for the biosynthesis of τm5U at the wobble position of mitochondrial tRNAGlu, tRNAGln, tRNALys, tRNATrp and tRNALeu(UUR).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000182687
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: MnmE/TrmE family node; the U34 5-substituent installed by this family is a (carboxymethyl)aminomethyl or taurinomethyl group, not a methyl group, so the term is chemically imprecise at the node.
      - source_id: UniProtKB:P25522
