- id: PMID:27184967
  title: The defective expression of gtpbp3 related to tRNA modification alters the mitochondrial function and development of zebrafish.
  findings:
  - statement: All three zebrafish Gtpbp3 isoforms localise to mitochondria.
    supporting_text: Zebrafish gtpbp3 has three isoforms localized at mitochondria.
  - statement: Morphants show bleeding, oedema, pigmentation and curved-tail defects by 5 dpf.
    supporting_text: The Gtpbp3 morphants exhibited defective in embryonic development including bleeding, melenin, oedema and curved tails within 5days post fertilization, as compared with uninjected controls.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Chen et al. 2016, Int J Biochem Cell Biol). Abstract only. Three mitochondrially localised isoforms; morphants show embryonic defects. Source of the IDA mitochondrion row and the two embryonic organ development IMP rows.
- id: PMID:30916346
  title: Deletion of Gtpbp3 in zebrafish revealed the hypertrophic cardiomyopathy manifested by aberrant mitochondrial tRNA metabolism.
  findings:
  - statement: Gtpbp3 is the τm5U34 modification enzyme of mt-tRNAGlu/Gln/Lys/Trp/Leu(UUR).
    supporting_text: GTPBP3 is a highly conserved tRNA modifying enzyme for the biosynthesis of τm5U at the wobble position of mitochondrial tRNAGlu, tRNAGln, tRNALys, tRNATrp and tRNALeu(UUR).
  - statement: Knock-out increases, not decreases, mt-tRNA aminoacylation.
    supporting_text: Strikingly, gtpbp3 knock-out zebrafish displayed the global increases in the aminoacylated efficiencies of mitochondrial tRNAs.
  - statement: Loss of Gtpbp3 alters mt-tRNA conformation.
    supporting_text: These data validated that the inactivation of Gtpbp3 changed the conformation of mitochondrial tRNAs.
  - statement: Steady-state tRNALys mildly reduced; other mt-tRNAs unchanged.
    supporting_text: The steady-state levels of tRNALys was mildly reduced in gtpbp3−/− zebrafish, but the levels of tRNAGlu, tRNAGln, tRNATrp, tRNALeu(UUR) and tRNAAla from gtpbp3 mutant zebrafish were all comparable with those in WT zebrafish.
  - statement: Aberrant mt-tRNA metabolism impairs mitochondrial translation and respiratory-chain activity.
    supporting_text: The aberrant mitochondrial tRNA metabolisms impaired mitochondrial translation, produced proteostasis stress and altered activities of respiratory chain complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Title matches the cached record (Chen et al. 2019, Nucleic Acids Res; full text cached). CRISPR gtpbp3 knock-out: altered mt-tRNA conformation, increased aminoacylation, mildly reduced tRNALys, impaired mitochondrial translation, hypertrophic cardiomyopathy. Source of the IMP rows including the six obsolete aminoacylation terms.
