    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: |-
      GTPase activity: Gtpbp3 is the TrmE-family G-domain subunit whose GTP hydrolysis is required, with MTO1, for taurinomethyl-U34 formation.
