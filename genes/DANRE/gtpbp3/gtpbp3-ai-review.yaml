- term:
    id: GO:0036416
    label: tRNA stabilization
  evidence_type: IMP
  original_reference_id: PMID:30916346
  review:
    summary: |-
      tRNA stabilization (prevention of tRNA degradation), IMP from the knock-out: steady-state tRNALys mildly reduced, other mt-tRNAs unchanged [PMID:30916346].
    action: KEEP_AS_NON_CORE
    reason: Full text read. U34 modification contributes to anticodon-loop structure, and the knock-out shows altered nuclease sensitivity of the unmodified tRNAs, but the effect on steady-state levels is confined to a mild reduction of tRNALys; Gtpbp3 does not itself protect tRNA from nucleases. Downstream consequence of the core modification activity, kept as non-core.
    supported_by:
    - reference_id: PMID:30916346
      supporting_text: The steady-state levels of tRNALys was mildly reduced in gtpbp3−/− zebrafish, but the levels of tRNAGlu, tRNAGln, tRNATrp, tRNALeu(UUR) and tRNAAla from gtpbp3 mutant zebrafish were all comparable with those in WT zebrafish.
    - reference_id: PMID:30916346
      supporting_text: These data validated that the inactivation of Gtpbp3 changed the conformation of mitochondrial tRNAs.
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-210824-3
- term:
    id: GO:0070143
    label: obsolete mitochondrial alanyl-tRNA aminoacylation
  evidence_type: IMP
  original_reference_id: PMID:30916346
  review:
    summary: Mitochondrial alanyl-tRNA aminoacylation (term now obsolete in GO, no replacement). IMP from gtpbp3 knock-out zebrafish, in which aminoacylation of this mt-tRNA was measured.
    action: REMOVE
    reason: Full text read. Aminoacylation is performed by the mitochondrial aminoacyl-tRNA synthetase, not by Gtpbp3; the knock-out shows a global INCREASE in aminoacylated fractions, which the authors attribute to the altered conformation of unmodified tRNAs [PMID:30916346], i.e. an indirect consequence of losing the U34 taurinomethyl modification, not participation in charging. The term itself is obsolete (QuickGO), so the row cannot be retained as-is; the observation is already covered by the accepted mitochondrial tRNA modification IMP from the same paper. Removal does not dispute the measurement.
    supported_by:
    - reference_id: PMID:30916346
      supporting_text: Strikingly, gtpbp3 knock-out zebrafish displayed the global increases in the aminoacylated efficiencies of mitochondrial tRNAs.
    - reference_id: PMID:30916346
      supporting_text: These data validated that the inactivation of Gtpbp3 changed the conformation of mitochondrial tRNAs.
    - reference_id: file:DANRE/gtpbp3/gtpbp3-deep-research-falcon.md
      supporting_text: gtpbp3KO zebrafish showed increased efficiencies of tRNA aminoacylation**, and that mt-tRNA instability signatures discussed for Mto1 deficiency were reported as similar to those in gtpbp3-related models.
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-210824-3
