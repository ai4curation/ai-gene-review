    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      Root-term ND placeholder recording that no molecular function had been
      curated for elna. That is no longer the state of knowledge: Elna is a
      tropoelastin with the conserved elastin domain architecture, and an elna
      nonsense mutant loses elastin from the heart valves.
