- id: PMID:16982180
  title: 'Sequences and domain structures of mammalian, avian, amphibian and teleost
    tropoelastins: Clues to the evolutionary history of elastins.'
  findings:
  - statement: Zebrafish expresses two tropoelastin genes that share the
      characteristic tropoelastin domain arrangement and crosslinking motifs.
    supporting_text: Unlike other species, two tropoelastin genes were expressed
      in zebrafish.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; original description of the two zebrafish
      tropoelastins. PMID matches UniProt RN [1].
- id: PMID:17112714
  title: Differential expression of two tropoelastin genes in zebrafish.
  findings:
  - statement: Both tropoelastins are expressed in most elastic tissues; eln2
      (elnb) predominates in the bulbus arteriosus.
    supporting_text: with the notable exception of the bulbus arteriosus in which
      eln2 expression and its gene product was predominant
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. eln1 = elna, eln2 = elnb (UniProt synonyms).
- id: PMID:17628459
  title: 'Comparative genomics of elastin: Sequence analysis of a highly repetitive
    protein.'
  findings:
  - statement: Both zebrafish elastins show a block of putative exon duplications.
    supporting_text: exons 20-31 in both zebrafish elastins
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only; sequence-evolution background, no functional
      data for elna specifically.
- id: PMID:26783159
  title: Evolution of the fish heart by sub/neofunctionalization of an elastin gene.
  findings:
  - statement: elna and elnb arose by duplication after the split from gar, with
      limk1a/limk1b neighbours supporting duplication of the locus in the TGD.
    supporting_text: Taken together, these results indicate that genomic locus
      including eln and limk1 genes was duplicated in the 3R WGD.
  - statement: elna is broadly expressed, like the single Polypterus eln.
    supporting_text: As expected, Polypterus had one elastin gene, and its expression
      was observed in various tissues including OFT, which is similar to that of
      zebrafish elna
  - statement: elna morphants have a swim bladder defect but no bulbus
      arteriosus morphology defect.
    supporting_text: elna morphants exhibited a swim bladder defect, where elna
      expression level is relatively high
  - statement: elna mRNA cannot rescue the elnb morphant bulbus phenotype.
    supporting_text: injection of elnb MO and elna full-length mRNA did not rescue
      the elnb morphant phenotype
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. elna data are morpholino (and F0 CRISPR) only.
- id: PMID:35216218
  title: Zebrafish as a Model to Study Vascular Elastic Fibers and Associated Pathologies.
  findings:
  - statement: Elna is closer to human ELN (about 37% identity) than Elnb is
      (about 18%).
    supporting_text: They share approximately 37% identity and 41% similarity,
      whereas for Elnb, around 18% identity and 21% similarity were calculated.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review; used for sequence comparison and synteny summary.
- id: PMID:37408270
  title: 'Characterization of the Zebrafish Elastin a (elna(sa12235)) Mutant: A New
    Model of Elastinopathy Leading to Heart Valve Defects.'
  findings:
  - statement: elna nonsense mutants have reduced valve elastin and shortened
      lifespan, but normal embryonic survival.
    supporting_text: Heterozygous (elnasa12235/+) and homozygous (elnasa12235/sa12235)
      mutants were found to have a significantly decreased life expectancy compared
      with their wild-type siblings.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; germline ENU nonsense allele (PTC, Tyr88*).
      Transcriptional adaptation of elnb was not tested.
- id: PMID:41465165
  title: Duplication, Divergence and Cardiac Expression of Tropoelastin in Jawed Fishes,
    Including Tetraploid Rainbow Trout (Oncorhynchus mykiss).
  findings:
  - statement: Non-teleost fishes have a single eln gene; teleosts have elna and
      elnb in a conserved eln-septin4/5-limk1 syntenic block.
    supporting_text: All non-teleost genomes contain a single eln gene, whereas
      duplicated elna and elnb genes were found in teleosts
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; genome survey of 51 jawed fishes plus trout qPCR.
