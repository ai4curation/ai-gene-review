- term:
    id: GO:0005201
    label: extracellular matrix structural constituent
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003979
  review:
    summary: >-
      InterPro2GO mapping from the tropoelastin signature (IPR003979). Correct:
      Elna is a tropoelastin whose product is deposited into elastic tissues,
      and it is the zebrafish copy closest to human ELN. The term is accurate
      but general; the specific activity of elastin is captured by
      GO:0030023 extracellular matrix constituent conferring elasticity, the
      term used for mammalian elastin.
    action: MODIFY
    reason: >-
      The annotation is sound but under-specific. Elastin proteins are the
      defining members of GO:0030023 (a child of GO:0005201), and Elna retains
      the elastin domain arrangement and crosslinking motifs and supplies
      elastin to zebrafish valves. The same refinement is proposed for elnb so
      the paralog pair is annotated consistently at the molecular-function
      level.
    proposed_replacement_terms:
