suggested_questions:
- question: >-
    Is elnb transcriptionally upregulated in elna sa12235 (PTC) mutants, and
    does this explain why valve disease appears only in adults?
- question: >-
    Does the elna swim bladder phenotype reported for morphants reproduce in
    germline elna mutants?
suggested_experiments:
- description: >-
    Compare elna sa12235 (PTC) mutants with a promoter-deletion (RNA-less)
    elna allele and measure elnb expression, to separate genetic compensation
    from true redundancy.
  experiment_type: genetic loss-of-function comparison
- description: >-
    Paralog-specific antibodies or tagged knock-in alleles to measure the
    contribution of Elna versus Elnb to elastin in each tissue.
  experiment_type: immunohistochemistry
