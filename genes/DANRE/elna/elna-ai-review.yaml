      label: extracellular matrix constituent conferring elasticity
    supported_by:
    - reference_id: PMID:16982180
      supporting_text: All tropoelastins shared a predominant and characteristic
        alternating domain arrangement, as well as the fundamental crosslinking
        sequence motifs.
    - reference_id: PMID:35216218
      supporting_text: Alignments of protein sequences with EMBOSS-Needle (EMBL-EBI)
        revealed that Elna was closer to human tropoelastin (ELN) than Elnb.
    - reference_id: PMID:17112714
      supporting_text: In general, both genes were expressed and their gene products
