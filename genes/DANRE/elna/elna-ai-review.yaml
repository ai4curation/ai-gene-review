    reason: >-
      The placeholder is superseded by an informative molecular function
      (extracellular matrix structural constituent, refined here to
      extracellular matrix constituent conferring elasticity), supported by
      sequence architecture and by loss-of-function evidence that elna supplies
      valve elastin.
