- term:
    id: GO:0031012
    label: extracellular matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR003979
  review:
    summary: >-
      InterPro2GO location from the tropoelastin signature. Correct: Elna is a
      secreted tropoelastin (signal peptide in UniProt) whose product is
      deposited in the extracellular matrix of elastic tissues.
    action: ACCEPT
    reason: >-
      Extracellular matrix is the correct general location for a tropoelastin.
      A more specific location, elastic fiber, is proposed as a NEW
