- term:
    id: GO:0071953
    label: elastic fiber
  evidence_type: IDA
  original_reference_id: PMID:17112714
  review:
    summary: >-
      Proposed location. Miao et al. detected the eln1 (elna) gene product
      deposited in most elastic tissues of zebrafish, and loss of elna removes
      elastin from the heart valves, where Elna is the predominant elastin.
      Human and mouse elastin carry this term by direct assay.
    action: NEW
    reason: >-
      Elastin forms the core of elastic fibers; this is the specific
      location of the mature Elna product and is more informative than the
      extracellular matrix IEA. The same term is proposed for elnb because
      both gene products are deposited as elastin.
    supported_by:
    - reference_id: PMID:17112714
      supporting_text: In general, both genes were expressed and their gene products
        deposited in most of the elastic tissues examined
    - reference_id: PMID:37408270
      supporting_text: elastin a seems to be the prevalent isoform expressed in this
        specific structure
    - reference_id: file:DANRE/elna/elna-deep-research-falcon.md
      supporting_text: Tropoelastin is the soluble precursor; mature elastin is an
        insoluble, covalently cross-linked elastic-fiber component.
- term:
    id: GO:0048251
    label: elastic fiber assembly
  evidence_type: IMP
  original_reference_id: PMID:37408270
  review:
    summary: >-
      Proposed process. The elna sa12235 allele introduces a stop codon at
      Tyr88, and heterozygous and homozygous mutants have markedly less
      elastin in the heart valves, with disorganized, honeycomb-like valve
      matrix.
    action: NEW
    reason: >-
      Participation test: tropoelastin is not a substrate of elastic fiber
      assembly but the structural monomer that self-associates and is
      crosslinked to form the fiber core, so Elna does part of the work of the
      process (the structure case). Comparator check: mammalian elastin is
      annotated to the parent GO:0085029 extracellular matrix assembly
      (mouse Eln, IMP), and the elastic fiber structural proteins FBN1, FBLN5,
      EMILIN1 and MFAP4 carry GO:0048251 itself. Evidence is loss of valve
      elastin in a germline nonsense mutant; the same term is proposed for
      elnb, whose loss reduces bulbus arteriosus elastin.
    supported_by:
    - reference_id: PMID:37408270
      supporting_text: This change leads to the loss of a tyrosine (Tyr88) for a
        stop codon at the very beginning of the protein sequence.
    - reference_id: PMID:37408270
      supporting_text: the valves of elnasa12235/+ and elnasa12235/sa12235 mutants
        were found to have a markedly diminished quantity of elastin, according
        to both the orcein staining and the anti-elastin immunohistochemistry
        assay
core_functions:
- description: >-
    Elna is a secreted tropoelastin that is deposited and crosslinked into
    elastic fibers of the extracellular matrix, where it provides elasticity
    to a broad set of tissues (head cartilage, outflow tract, ventral aorta,
    swim bladder). It is the predominant elastin of the adult heart valves,
    and its loss causes progressive valve disorganization and reduced
    survival. This broad role resembles that of the single ancestral elastin
    gene.
  molecular_function:
    id: GO:0030023
    label: extracellular matrix constituent conferring elasticity
  directly_involved_in:
  - id: GO:0048251
    label: elastic fiber assembly
  locations:
  - id: GO:0071953
    label: elastic fiber
  supported_by:
  - reference_id: PMID:37408270
    supporting_text: the valves of elnasa12235/+ and elnasa12235/sa12235 mutants
      were found to have a markedly diminished quantity of elastin
  - reference_id: PMID:26783159
    supporting_text: In contrast, elna was expressed not only in the BA but also
      other tissues, such as the cranial skeleton and swim bladder
