      on somitic borders.
    supporting_text: 'joint inactivation of her1 and her13.2 leads to a complete loss of all somitic

      borders'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached abstract/full text; the evidence scope is
      stated in the finding.
- id: PMID:20637625
  title: Segment number and axial identity in a segmentation clock period mutant.
  findings:
  - statement: The period-mutant study supports clock-dependent segment number; target identity is independently
      corroborated by the full 2018 report.
    supporting_text: 'precise control of segmentation

      clock period in relation to axial growth ensures a species-specific segment

      number'
  - statement: The period-mutant study distinguishes segment number from Hox-associated regional identity.
    supporting_text: 'arguing

      against an instructive role of the segmentation clock in determining axial

      identities.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached abstract/full text; the evidence scope is
      stated in the finding.
- id: PMID:22911291
  title: Topology and dynamics of the zebrafish segmentation clock core circuit.
  findings:
  - statement: Direct zebrafish biochemistry establishes partner-dependent DNA binding by Hes6 in the
      Her7:Hes6 heterodimer.
    supporting_text: only Her1 homodimers and Her7:Hes6 heterodimers have strong DNA binding activity
      and target similar DNA sites.
  - statement: Hes6 forms heterodimers and homodimers; their DNA-binding capabilities differ.
    supporting_text: all of the possible dimers between Her1, Her7 and Hes6 form
  - statement: MyoD association is experimentally measured but is used to demonstrate promiscuous bHLH
      interactions, not a physiological Hes6 myogenesis mechanism.
    supporting_text: even the bHLH containing factor MyoD, but not the negative control non-bHLH protein
      PPARγ, was co-purified by Her1, Her7, and Hes6 to a similar extent
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached abstract/full text; the evidence scope is
      stated in the finding.
- id: PMID:29624170
  title: Segmentation of the zebrafish axial skeleton relies on notochord sheath cells and not on the
    segmentation clock.
  findings:
  - statement: The full primary report directly generates and analyzes a hes6 mutant; its focus on notochord-derived
      centra does not make the Hes6 annotation a wrong-gene citation.
    supporting_text: The novel hes6 mutation was created by injection of a TALEN targeted against hes6
      in wild type.
  - statement: The full figure caption reports disordered myotome boundaries in her1;hes6 mutants and
      compares multiple segmentation-clock mutant combinations.
    supporting_text: her1;hes6 mutants (n=15)
  full_text_unavailable: false
  reference_review:
