description: Zebrafish Hes6, also called Her13.2, is a basic helix-loop-helix/Orange protein in the presomitic-mesoderm
  segmentation clock. It forms dimers with other Hairy-related factors and contributes to a DNA-binding
  transcriptional repressor with Her7. The availability of different dimers helps control transcriptional
  oscillations and somite formation. Hes6 homodimers do not show the strong DNA binding of Her7:Hes6 heterodimers
  in the tested promoter assays.
