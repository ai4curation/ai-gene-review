- id: PMID:15905406
  title: Zebrafish hairy/enhancer of split protein links FGF signaling to cyclic gene expression in the
    periodic segmentation of somites.
  findings:
  - statement: The primary reporter and interaction experiments establish transcriptional repression and
      Her1 association for Her13.2/Hes6.
    supporting_text: Her13.2 augments autorepression of her1 in association with Her1 protein.
  - statement: Primary zebrafish perturbation links Hes6 to the segmentation clock and somite formation.
    supporting_text: 'her13.2 is required for periodic repression of the

      Notch-regulated genes her1 and her7, and for proper somite segmentation.'
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached abstract/full text; the evidence scope is
      stated in the finding.
- id: PMID:16545363
  title: her1 and her13.2 are jointly required for somitic border specification along the entire axis
    of the fish embryo.
  findings:
