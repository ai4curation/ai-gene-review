- id: PMID:12650615
  title: Membrane localization of Arabidopsis acyl-CoA binding protein ACBP2.
  full_text_unavailable: true
  findings:
  - statement: >-
      Arabidopsis ACBP1 and ACBP2 depend on their plant-specific N-terminal transmembrane
      domain for endoplasmic reticulum and plasma-membrane targeting.
    supporting_text: >-
      GFP fusions with deletion derivatives of ACBPI or ACBP2 lacking the transmembrane
      domain were impaired in membrane targeting.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
