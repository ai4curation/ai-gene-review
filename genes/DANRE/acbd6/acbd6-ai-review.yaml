  supported_by:
  - reference_id: PMID:26621918
    supporting_text: >-
      We determined that the acyl-CoA binding protein, acyl-CoA binding domain (ACBD)6,
      stimulated the NMT reaction of NMT2.
  - reference_id: PMID:37951597
    supporting_text: >-
      Meta-analysis furthermore revealed that acbd6 deficiency provokes an overall increase
      of proteins N-myristoylated with YnMyr, with a subset involved in the development of
      the eye, neuron and muscle, being reduced.
suggested_questions:
- question: >-
    Which specific under-myristoylated target proteins in acbd6-null zebrafish larvae
    directly drive microphthalmia, excessive axonal arborization, and progressive muscle
    fiber degeneration?
  experts:
  - Reza Maroofian
  - Gaurav K. Varshney
  - Edward W. Tate
suggested_experiments:
- hypothesis: >-
    Zebrafish acbd6 directly binds endogenous Danio rerio Nmt1a/Nmt1b/Nmt2 via its
    C-terminal ankyrin repeats (residues 209-271) and shields NMT catalysis from
    palmitoyl-CoA competition, and the pathogenic p.(Asp201Gly)-equivalent substitution
    disrupts this complex.
  description: >-
    Co-purify recombinant wild-type and ANK-mutant zebrafish acbd6 with zebrafish Nmt
    isoenzymes and measure myristoyl-peptide formation in the presence of physiological
    palmitoyl-CoA concentrations.
  experiment_type: recombinant co-immunoprecipitation and coupled NMT enzyme kinetics
