id: Q4V8X4
gene_symbol: acbd6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  Zebrafish acbd6 encodes a soluble 300-residue intracellular acyl-CoA-binding protein that
  is the vertebrate ortholog of human ACBD6, pairing an N-terminal four-helix
  acyl-CoA-binding (ACB) domain (residues 60-145) with two C-terminal ankyrin (ANK) repeats
  (residues 209-238 and 242-271) and lacking any transmembrane segment. Expressed broadly in
  early embryos and prominently in the developing central nervous system, eyes, otic vesicle,
  and trunk musculature, acbd6 resides in the cytosol and nucleus, selectively binds
  unsaturated long-chain fatty-acyl-CoA thioesters via its conserved ACB pocket (Phe64,
  Tyr87, Lys91, Lys113, Tyr132, and regulatory loop Ser124/Ser126), and acts through its
  C-terminal ANK module to support N-myristoyltransferase-catalyzed protein N-myristoylation.
  Loss of acbd6 in zebrafish alters global N-myristoylome stoichiometry—depleting
  N-myristoylated proteins required for eye, neuronal, and muscular development—and causes
  microcephaly, microphthalmia, excessive axonal arborization, muscle fiber degeneration, and
  seizure-like movement defects that are rescued by wild-type human ACBD6 mRNA but not by
  ACB-truncating or ANK-repeat pathogenic variants.
