- id: PMID:18268358
  title: Characterization of an acyl-coenzyme A binding protein predominantly expressed
    in human primitive progenitor cells.
  findings:
  - statement: >-
      Human ACBD6 selectively binds unsaturated long-chain fatty-acyl-CoAs via its
      N-terminal ACB domain without binding free fatty acids.
    supporting_text: >-
      ACBD6 binds long-chain acyl-CoAs with a strong preference for unsaturated, C18:1-CoA
      and C20:4-CoA, over saturated, C16:0-CoA, acyl species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read; establishes biochemical acyl-CoA binding specificity of the human
      ortholog Q9BR61 that functionally rescues zebrafish acbd6 knockouts.
- id: PMID:26621918
  title: Association of NMT2 with the acyl-CoA carrier ACBD6 protects the N-myristoyltransferase
    reaction from palmitoyl-CoA.
  findings:
  - statement: >-
      Human ACBD6 binds NMT2 and NMT1 via its C-terminal ANK domain and requires
      Tyr114-dependent acyl-CoA binding to stimulate NMT catalysis.
    supporting_text: >-
      Compared with ACBD6, two ACBD6 mutant forms, Y 114 A and FKKY-AAAA (dubbed FKKY mut
      ), with defects in acyl-CoA binding ( 19 ) failed to stimulate the reaction in the
      presence of C 14 -CoA, thus acyl-CoA binding of ACBD6 is required for the stimulatory
      effect on NMT2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read; biochemical demonstration of NMT enzyme activation conserved in
      vertebrate ACBD6 orthologs.
- id: PMID:37951597
  title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive
    and complex movement disorders.
  findings:
  - statement: >-
      CRISPR/Cas9 acbd6 knockout phenotypes in zebrafish are rescued by wild-type human ACBD6
      mRNA, whereas introducing ACB-truncating p.(Glu63Ter) or ANK-domain p.(Asp201Gly)
      variants into zebrafish acbd6 cDNA abolishes rescue.
    supporting_text: >-
      These phenotypes were restored upon co-injection of wild-type human mRNA, confirming
      the specificity of the phenotype. We also introduced the LOF p.(Glu63Ter) and missense
      variants p.(Asp201Gly) into acbd6 cDNA and observed impaired protein function and
      failure to rescue the eye size phenotype (Fig. 4F) in F0 knockouts.
  - statement: >-
      Quantitative YnMyr click-proteomics in acbd6-deficient zebrafish reveals altered
      N-myristoylome stoichiometry with reduced N-myristoylation of eye, neuronal, and muscle
      developmental proteins.
    supporting_text: >-
      Meta-analysis furthermore revealed that acbd6 deficiency provokes an overall increase
      of proteins N-myristoylated with YnMyr, with a subset involved in the development of
      the eye, neuron and muscle, being reduced.
  - statement: >-
      ACBD6 localizes to the cytosol and nucleus where it modulates protein and lipid
      acylation.
    supporting_text: >-
      This protein is detected in the cytosol and nuclei of cells and modulates the
      acylation of lipids and proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary in vivo functional characterization of zebrafish acbd6 (full text read),
      demonstrating CNS/eye/muscle developmental roles, N-myristoylome perturbation, and
      cross-species rescue by human ACBD6.
- id: file:DANRE/acbd6/acbd6-uniprot.txt
  title: UniProtKB entry Q4V8X4 (ACBD6_DANRE)
  findings:
  - statement: >-
      UniProtKB Q4V8X4 summarizes zebrafish acbd6 preference for unsaturated C18:1-CoA, lack
      of free fatty-acid binding, role in protein N-myristoylation, and cytoplasmic/nuclear
      localization.
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Binds long-chain acyl-coenzyme A molecules with a strong preference for unsaturated
      C18:1-CoA. Does not bind fatty acids. Plays a role in protein N-myristoylation
      (PubMed:37951597).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reviewed Swiss-Prot entry Q4V8X4 (300 aa, SV=1) accurately annotating ACB domain
      60-145 and ANK repeats 209-238 and 242-271.
