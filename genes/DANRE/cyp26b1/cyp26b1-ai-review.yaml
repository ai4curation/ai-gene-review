    summary: IBA from the CYP26 subfamily node (PTN002386488), seeded by mouse, rat, human and 
      zebrafish CYP26 genes including this one. It asserts that retinoate catabolism was the 
      function of the ancestral CYP26 and is inherited by cyp26b1.
    action: ACCEPT
    reason: 'The node is the CYP26 subfamily, not the P450 superfamily, so the substrate-level claim is
      properly placed, and cyp26b1 is squarely inside it. Zebrafish evidence agrees: the protein limits
      RA activity in transfection assays (PMID:15661642) and its loss produces RA-excess phenotypes that
      RA treatment phenocopies (PMID:18927155, PMID:18927157). This is the process the core activity performs.'
