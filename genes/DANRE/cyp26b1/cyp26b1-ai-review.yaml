  review:
    summary: IBA from the CYP26 node (PTN002386488) for central nervous system development, seeded 
      by mouse and zebrafish cyp26 genes. In zebrafish this corresponds to the Cyp26-dependent 
      shaping of hindbrain RA-response domains (PMID:17164423).
    action: KEEP_AS_NON_CORE
    reason: The node placement is defensible - CYP26 enzymes shape neural RA gradients across 
      vertebrates - but the term is a broad developmental parent, and the zebrafish evidence shows 
      the requirement is redundant among three paralogs (PMID:17164423). The specific hindbrain rows
      already capture the biology at a useful level. Kept as non-core rather than accepted or 
      removed.
