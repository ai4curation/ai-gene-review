- id: PMID:15661642
  title: Expression of cyp26b1 during zebrafish early development.
  findings:
  - statement: cDNA transfection assays show that, like its human ortholog, zebrafish cyp26b1 limits
      retinoic-acid activity; zygotic expression initiates in hindbrain rhombomeres and later in 
      pharyngeal arch primordia.
    supporting_text: zebrafish cyp26b1 is involved in limiting the activity of retinoic acid
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Zhao et al. 2005, Gene Expr Patterns). 
      Abstract-only cache. Source of the cyp26b1 cloning, the rhombomeric expression pattern, and 
      the transfection assay showing the zebrafish protein limits RA activity; basis of the IDA and 
      TAS rows.
- id: PMID:17164423
  title: Cyp26 enzymes generate the retinoic acid response pattern necessary for hindbrain 
    development.
  findings:
  - statement: The three zebrafish Cyp26 enzymes (including cyp26b1) act redundantly to degrade RA 
      and shape RA-responsive gene-expression domains, generating the RA response pattern required 
      for hindbrain rhombomere patterning.
    supporting_text: Cyp26 enzymes generate the retinoic acid response pattern necessary for
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Hernandez et al. 2007, Development); full text 
      cached. Establishes redundant Cyp26a1/b1/c1 shaping of hindbrain RA-response domains; basis of
      the IGI rows. Redundancy is why the hindbrain terms are graded non-core.
- id: PMID:18927155
  title: Retinoic acid and Cyp26b1 are critical regulators of osteogenesis in the axial skeleton.
  findings:
  - statement: The zebrafish stocksteif mutant, which exhibits severe over-ossification of the 
      vertebral column, encodes cyp26b1, identifying a role for RA degradation in axial 
      osteogenesis.
    supporting_text: stocksteif encodes cyp26b1, a cytochrome P450 member that metabolizes RA
  - statement: cyp26b1 is expressed within osteoblasts, where it must tightly control local RA 
      levels; loss of catabolism causes RA-driven increased osteoblast activity and defective 
      skeletogenesis.
    supporting_text: Cyp26b1 is expressed within osteoblast cells, demonstrating that RA levels
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Spoorendonk et al. 2008, Development). 
      Abstract-only. stocksteif = cyp26b1; over-ossification phenocopied by RA and by the Cyp26 
      inhibitor R115866, with cyp26b1 expressed in osteoblasts.
- id: PMID:18927157
  title: Restriction of retinoic acid activity by Cyp26b1 is required for proper timing and 
    patterning of osteogenesis during zebrafish development.
  findings:
  - statement: cyp26b1 (the dolphin mutation) is expressed in condensing chondrocytes and 
      osteoblasts; mutants and RA-treated fish show reduced midline cartilage and hyperossification 
      of facial and axial bones.
    supporting_text: cyp26b1 is expressed in condensing chondrocytes as well as in osteoblasts
  - statement: Temporal and spatial restriction of RA signaling by Cyp26 enzymes is required to 
      attenuate osteoblast maturation and activity in vivo, controlling the timing and patterning of
      osteogenesis.
    supporting_text: is required to attenuate osteoblast maturation and/or activity in vivo
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Laue et al. 2008, Development); full text cached.
      dolphin = cyp26b1; expression in chondrogenic condensations and osteoblast precursors, mutant 
      defects mimicked by RA. Basis of the catabolic-process and cranial-skeleton IMP rows.
- id: PMID:22019272
  title: Craniosynostosis and multiple skeletal anomalies in humans and zebrafish result from a 
    defect in the localized degradation of retinoic acid.
  findings:
  - statement: Human null and hypomorphic CYP26B1 mutations cause craniosynostosis, long-bone 
      fusions and calvarial hypoplasia; zebrafish cyp26b1 mutants and Cyp26-inhibited mice phenocopy
      this, showing localized RA degradation is required for normal suture and skeletal development.
    supporting_text: Craniosynostosis and multiple skeletal anomalies
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Laue et al. 2011, Am J Hum Genet); full text 
      cached. Human CYP26B1 mutations plus zebrafish dolphin/stocksteif mutants; source for the 
      suture, bone and head morphogenesis rows.
- id: PMID:25652838
  title: Altered retinoic acid signalling underpins dentition evolution.
  findings:
  - statement: Adult zebrafish heterozygous for the cyp26b1 mutant possess an extra ventral-row 
      tooth, linking reduced RA degradation by cyp26b1 to increased tooth number in cyprinids.
    supporting_text: heterozygous for the cyp26b1 mutant that encodes an enzyme able to degrade RA 
      possess an extra tooth in the ventral row
  - statement: RA availability, modulated by rate-limiting enzymes such as cyp26b1, influences 
      pharyngeal mesenchyme marker expression (dlx2a, lhx6) and is an active driver of tooth-number 
      diversification.
    supporting_text: changes in RA signalling play an important role in the diversification of teeth
      in Cyprinids
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches the cached record (Gibert et al. 2015, Proc Biol Sci). 
      Abstract-only. cyp26b1 heterozygotes gain a ventral tooth and RA treatment expands pharyngeal 
      mesenchyme markers; supports the odontogenesis row as a dose-sensitive downstream effect.
- id: PMID:29227993
  title: In vivo zebrafish morphogenesis shows Cyp26b1 promotes tendon condensation and 
    musculoskeletal patterning in the embryonic jaw.
  findings:
  - statement: In cyp26b1 mutants, neural-crest-derived tenoblasts are generated normally but fail 
      to condense into nascent tendons in the ventral pharyngeal arches, causing ectopic muscle 
      attachments and disrupted craniofacial musculoskeletal integration.
    supporting_text: fail to condense into nascent tendons
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (McGurk et al. 2017, PLoS Genet); full text 
      cached. Time-lapse analysis showing tenoblasts form but fail to condense in cyp26b1 mutants, 
      with the requirement in adjacent non-tendon neural crest; basis of the tendon formation row.
