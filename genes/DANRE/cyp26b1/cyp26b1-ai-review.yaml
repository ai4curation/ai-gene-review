gene_symbol: cyp26b1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'cyp26b1 encodes zebrafish cytochrome P450 26B1, a heme-thiolate monooxygenase anchored in
  the endoplasmic reticulum membrane that hydroxylates all-trans retinoic acid at C-4 and C-18 using electrons
  from NADPH--cytochrome P450 reductase, initiating its degradation and thereby limiting retinoic-acid
  receptor signalling (PMID:15661642). The protein shares over 73% identity with mammalian CYP26B1. Zygotic
  expression begins around 75% epiboly in presumptive rhombomeres 3 and 4 and later extends through rhombomeres
  2-6, the eyes, diencephalon, midbrain-hindbrain boundary, cerebellum, pectoral fin and pharyngeal arch
  primordia (PMID:15661642); later it marks chondrogenic mesenchymal condensations and osteoblast precursors
  of cranial and axial bone (PMID:18927157) and non-tendon neural crest of the ventral pharyngeal arches
  (PMID:29227993). By creating local retinoic-acid-poor domains, cyp26b1 acts with cyp26a1 and cyp26c1
  to shape hindbrain RA-response domains (PMID:17164423) and constrains osteoblast activity, cartilage
  and suture morphogenesis, tendon condensation and tooth number (PMID:18927155, PMID:18927157, PMID:22019272,
  PMID:29227993, PMID:25652838). Loss-of-function mutations in human CYP26B1 cause craniosynostosis with
  skeletal anomalies (PMID:22019272).'
