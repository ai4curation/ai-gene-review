  title: 'Jaw and branchial arch mutants in zebrafish II: anterior arches and cartilage differentiation.'
  findings:
  - statement: A large-scale screen recovered zebrafish mutants with specific defects in 
      pharyngeal-arch cartilage differentiation and growth, establishing the mutant class and 
      craniofacial cartilage phenotypes against which cyp26b1 jaw/arch defects are interpreted.
    supporting_text: the differentiation of cartilage and growth is affected
  - statement: Mutations in single genes can selectively reduce ventral mandibular and hyoid arch 
      cartilages while sparing or enlarging dorsal structures, illustrating dorsoventral and 
      arch-specific patterning of craniofacial cartilage.
    supporting_text: ventral components of the mandibular and hyoid arches are reduced
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Title matches the cached record (Piotrowski et al. 1996, Development). 
      Abstract-only; the screen predates identification of dolphin as cyp26b1 (PMID:18927157), so 
      the gene is not named in the paper. Cited only as the original source of the allele for the 
      cartilage morphogenesis row.
