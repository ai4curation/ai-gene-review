    label: tendon formation
  evidence_type: IMP
  original_reference_id: PMID:29227993
  review:
    summary: 'ZFIN IMP from the cyp26b1 mutant jaw (PMID:29227993): tenoblasts are made in normal numbers
      but fail to condense into tendons, and muscles then project ectopically. cyp26b1 is expressed in
      non-tendon neural crest adjacent to the tenoblasts.'
    action: KEEP_AS_NON_CORE
    reason: Tendon condensation fails because neighbouring crest cells cannot clear RA, so the 
      defect is real and specific, but it is a downstream consequence in a tissue where the enzyme 
      is not itself building the tendon; the authors describe the requirement as 
      non-tendon-cell-autonomous (PMID:29227993). Kept as non-core rather than accepted as a core 
      process.
    supported_by:
    - reference_id: PMID:29227993
      supporting_text: "In the absence of cyp26b1, tenoblasts are generated in normal \nnumbers but fail
        to condense into nascent tendons within the ventral arches and, \nsubsequently, muscles project
        into ectopic locales."
    - reference_id: PMID:29227993
      supporting_text: We propose that cyp26b1 expression is required in a mass of non-tendon neural
        crest that separates adjacent tenoblast populations and promotes tendon condensation 
