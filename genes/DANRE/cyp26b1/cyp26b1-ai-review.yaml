- id: file:DANRE/cyp26b1/cyp26b1-deep-research-falcon.md
  title: Falcon (Edison) deep research report for Danio rerio cyp26b1 (UniProt Q6EIG3)
  findings:
  - statement: Cyp26b1 is a CYP26-subfamily cytochrome P450 that restricts retinoic-acid signaling 
      by enzymatically converting RA to more polar metabolites, reducing receptor-available RA and 
      helping generate RA-negative domains and gradients.
    supporting_text: restrict RA signaling by enzymatically converting RA to more polar metabolites
    reference_section_type: RESULTS
  - statement: Contemporary zebrafish work frames Cyp26b1 explicitly as inactivating all-trans 
      retinoic acid through hydroxylation.
    supporting_text: ATRA is inactivated through hydroxylation by Cytochrome P450 26B1 (Cyp26b1)
    reference_section_type: RESULTS
  - statement: CYP26 enzymes hydroxylate/oxidize RA to a defined set of polar metabolites, 
      supporting a retinoic-acid catabolic (rather than merely metabolic) role.
    supporting_text: 4-hydroxy-RA, 4-oxo-RA, 18-hydroxy-RA, and 5,8-epoxy all-trans-RA
    reference_section_type: RESULTS
  - statement: CYP26 enzymes are microsomal, membrane-anchored class II P450s localized to the 
      endoplasmic reticulum, consistent with the ER-membrane localization annotations.
