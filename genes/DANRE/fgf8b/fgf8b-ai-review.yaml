id: Q805B2
gene_symbol: fgf8b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: fgf8b is one of two zebrafish co-orthologues of vertebrate FGF8 retained from the teleost-specific
  genome duplication (the other is fgf8a). It was first described as zebrafish fgf17 (fgf17a). It encodes
  a secreted fibroblast growth factor of the FGF8/17/18 (FgfD) subfamily, with an N-terminal signal peptide
  and the FGF core domain, about 71% identical to fgf8a, and acts like fgf8a when misexpressed. Unlike
  fgf8a it is not expressed during gastrulation. It is first expressed at mid-somitogenesis in the ventral
  midbrain-hindbrain boundary and anterior somites, then in the optic stalks, otic vesicle, hyoid region
  and dorsal diencephalon. Its midbrain-hindbrain boundary expression depends on pax2a and is maintained
  by fgf8a. It is absent from the heart and from the fin bud, telencephalon and pharyngeal arches, where
  fgf8a is expressed. Its in vivo function has not been tested by loss of function; it is thought to act
  with fgf8a as an organizer signal at the midbrain-hindbrain boundary.
