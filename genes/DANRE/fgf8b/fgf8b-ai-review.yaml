core_functions:
- description: Secreted FGF8-subfamily ligand for FGF receptors that activates FGFR/MAPK signalling; protein
    activity equivalent to fgf8a in an injection assay. Its in vivo roles are confined to post-gastrula
    domains shared with fgf8a (MHB, somites, otic vesicle).
  molecular_function:
    id: GO:0005105
    label: type 1 fibroblast growth factor receptor binding
  directly_involved_in:
