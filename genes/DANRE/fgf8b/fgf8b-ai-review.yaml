  - *id002
suggested_questions:
- question: Does fgf8b have any in vivo function on its own? No fgf8b mutant or morphant phenotype has
    been published.
- question: Is fgf8b upregulated in ace (premature-stop) mutants, and does it contribute to the residual
    MHB and somite signalling there?
suggested_experiments:
- hypothesis: fgf8b is dispensable alone but acts redundantly with fgf8a at the MHB and in somites.
  description: Generate fgf8b null alleles (including a promoter-deletion, RNA-less allele) and analyse
    single mutants and fgf8a;fgf8b double mutants for MHB, cerebellum, somite muscle and otic phenotypes.
  experiment_type: double mutant analysis
