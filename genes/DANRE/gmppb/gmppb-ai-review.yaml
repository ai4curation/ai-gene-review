core_functions:
- description: gmppb is the catalytic subunit of the cytosolic GMPPA-GMPPB complex and converts 
    alpha-D-mannose 1-phosphate and GTP into GDP-mannose (PMID:33986552). The downstream 
    glycosylation-dependent processes (alpha-dystroglycan O-mannosylation, muscle and motor-neuron 
    development) are graded non-core because the mannosyltransferases, not gmppb, transfer the 
    sugar; the rescue experiments nonetheless show those phenotypes track the enzymatic activity 
    (PMID:35006422).
