gene_symbol: gmppb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'Zebrafish gmppb encodes GDP-mannose pyrophosphorylase B, the catalytic subunit of the GMPPA-GMPPB
  complex. It condenses alpha-D-mannose 1-phosphate with GTP to give GDP-alpha-D-mannose and diphosphate
  (EC 2.7.7.13), the activated sugar donor from which mannosyltransferases build N-glycans, GPI anchors,
  C- and O-mannosyl glycans and dolichol-phosphate-mannose. In the complex the catalytically inactive
  GMPPA subunit binds GDP-mannose with high affinity and allosterically inhibits GMPPB, making the pair
  a feedback sensor for cellular mannose supply (PMID:33986552). The reaction takes place in the cytosol;
  the zebrafish protein is about 81% identical to human GMPPB and is expressed ubiquitously from the one-cell
  stage, rising to a peak around 48 hours post fertilization (PMID:35006422). Knockdown lowers alpha-dystroglycan
  glycosylation and produces sparse, disordered muscle fibres, shortened CaP motor axons, reduced pan-neuronal
  HuC signal and impaired movement; wild-type but not catalytically weakened GMPPB mRNA rescues these
  defects (PMID:23768512, PMID:35006422). In humans, GMPPB mutations cause a spectrum of dystroglycanopathies
  from congenital muscular dystrophy to limb-girdle forms (PMID:23768512).'
