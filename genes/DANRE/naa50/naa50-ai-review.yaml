- term:
    id: GO:0006338
    label: chromatin remodeling
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  review:
    summary: |-
      Chromatin remodeling, assigned by automatic inter-ontology inference from the histone H4 acetyltransferase activity annotation (GO:0010485). That molecular function rests on a single in vitro observation that histone H4 can serve as a lysine substrate of human Naa50 [PMID:19744929], and UniProt itself flags the physiological relevance of the lysine activity as unclear.
    action: REMOVE
    reason: |-
      The inference chain starts from an over-annotated molecular function and then adds a further leap: acetylating a histone in vitro is not evidence of participating in chromatin remodeling, a process term for altering nucleosome structure or position. No chromatin phenotype has been reported for Naa50 in any species, and the mitotic role that is documented concerns centromeric cohesin, not chromatin remodeling.
    supported_by:
    - reference_id: PMID:19744929
      supporting_text: histone 4 was detected as a hNaa50p KAT substrate in vitro
    - reference_id: file:DANRE/naa50/naa50-uniprot.txt
      supporting_text: The relevance of N-epsilon-acetyltransferase activity is however unclear
    - reference_id: PMID:17502424
      supporting_text: San may be specifically required for the maintenance of the centromeric cohesion in mitosis.
  qualifier: involved_in
  supporting_entities:
  - GO:0010485
