id: Q6DBY2
gene_symbol: naa50
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  naa50 encodes N-alpha-acetyltransferase 50 (Naa50/Nat5/San), the catalytic subunit of NatE. It is a GNAT-fold acetyltransferase that transfers an acetyl group from acetyl-CoA to the alpha-amino group of nascent proteins that keep their initiator methionine, acting co-translationally in the cytoplasm and physically associating with the NatA complex (Naa10-Naa15) to form the NatA/Naa50 dual enzyme. Its substrate range covers most Met-starting N-termini except those with proline in the second position. In addition to this N-terminal activity it can acetylate lysine side chains in vitro, including its own, though the physiological weight of that activity is unsettled. In metazoans Naa50 is also required for mitotic sister-chromatid cohesion, particularly at centromeres, through its acetyltransferase activity, and in zebrafish it is expressed in early embryonic vasculature and epidermis and interacts with naa35.
existing_annotations:
- term:
    id: GO:0031415
    label: NatA complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      NatA complex (part_of). Naa50 is not a NatA catalytic or auxiliary subunit but binds the Naa10-Naa15 heterodimer to form the ternary NatA/Naa50 (NatE) enzyme, contacting both subunits through conserved surfaces [PMID:31155310]. IBA from PTN000558165 (Drosophila san, yeast NAT5, human NAA50).
    action: KEEP_AS_NON_CORE
    reason: |-
      The physical association is well established and conserved, so the annotation is not wrong, but Naa50 carries its own catalytic activity, its association is partial, and its cohesion role is exerted independently of NatA [PMID:17502424]. Membership is therefore context for the enzyme rather than the unit in which it works, and the core annotation should stay on the acetyltransferase activity itself.
    supported_by:
    - reference_id: PMID:31155310
      supporting_text: can associate with another catalytic subunit, Naa50, to form a ternary NatA/Naa50 dual enzyme complex (also called NatE)
    - reference_id: PMID:31155310
      supporting_text: Naa50 makes evolutionarily conserved contacts to both the Naa10 and Naa15 subunits of NatA
    - reference_id: PMID:17502424
      supporting_text: although a small fraction of San interacts with the NatA complex, San appears to mediate cohesion independently
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0024188
  - PANTHER:PTN000558165
  - SGD:S000005779
  - UniProtKB:Q9GZZ1
- term:
    id: GO:0007064
    label: mitotic sister chromatid cohesion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      Mitotic sister chromatid cohesion. Depletion of the human ortholog (San/NAA50) causes loss of cohesion in HeLa cells and its catalytic activity is required for the effect [PMID:17502424]; the Drosophila san mutant is the classic cohesion mutant in the family, and both are donors at this node.
    action: KEEP_AS_NON_CORE
    reason: |-
      Participation is genuine rather than merely phenotypic: the acetyltransferase activity itself is required, so the enzyme does catalytic work in the process. It is kept as non-core because it is a second, cell-cycle-restricted use of the same activity, there is no zebrafish data on cohesion, and the gene's pervasive role is co-translational N-terminal acetylation.
    supported_by:
    - reference_id: PMID:17502424
      supporting_text: San is critical for sister chromatid cohesion in HeLa cells, suggesting that this mechanism may be conserved in metazoans
    - reference_id: PMID:17502424
      supporting_text: San exhibits acetyltransferase activity in vitro, and its activity is required for sister chromatid cohesion in vivo
    - reference_id: file:DANRE/naa50/naa50-uniprot.txt
      supporting_text: Required for sister chromatid cohesion during mitosis by promoting binding of CDCA5/sororin
  qualifier: involved_in
  supporting_entities:
