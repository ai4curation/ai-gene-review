    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: |-
      Nucleus. UniProt lists nucleus alongside cytoplasm for this protein by similarity to human NAA50; the human ortholog is cytoplasmic in interphase and gains access to chromosomes in mitosis, where it is needed for centromeric cohesin [PMID:17502424].
    action: KEEP_AS_NON_CORE
    reason: |-
      Retained because it is a faithful transfer of the UniProt record and fits the mitotic cohesion role, but marked non-core: the observation on the ortholog is that the protein is cytoplasmic during interphase, and no nuclear pool has been demonstrated for the zebrafish protein. The core activity is cytoplasmic and co-translational.
