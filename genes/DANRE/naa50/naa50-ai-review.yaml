- term:
    id: GO:0034087
    label: establishment of mitotic sister chromatid cohesion
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: |-
      Establishment of mitotic sister chromatid cohesion (ISS from human NAA50). The term covers joining of sister chromatids along the chromosome during S phase. The human data show something narrower and later: San-depleted cells lose cohesin from mitotic centromeres while Sgo1 still localises correctly, and arm cohesion is restored by Plk1 co-depletion [PMID:17502424].
    action: MODIFY
    reason: |-
      The ortholog evidence supports maintenance of cohesion at centromeres during mitosis rather than its establishment in S phase; the paper's own conclusion is explicitly about maintenance. GO:0071962 mitotic sister chromatid cohesion, centromeric states the supported claim and is already annotated to this gene by ISS, so the two rows become consistent.
