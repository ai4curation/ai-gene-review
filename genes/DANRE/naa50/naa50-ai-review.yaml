    label: protein-lysine-acetyltransferase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: |-
      Protein-lysine-acetyltransferase activity (ISS from human NAA50). Human Naa50 autoacetylates its own Lys34, Lys37 and Lys140 in vitro and can acetylate histone H4 in vitro [PMID:19744929], but UniProt records the physiological relevance of this N-epsilon activity as unclear.
    action: MARK_AS_OVER_ANNOTATED
    reason: |-
      Not fabricated: the activity is documented biochemically, and autoacetylation modulates the enzyme's own substrate preference. But no in vivo lysine substrate has been established for any ortholog, the cellular roles attributed to Naa50 (N-terminal acetylome, cohesion) run through the N-alpha activity, and presenting a lysine acetyltransferase activity at the same level as the NAT activity overstates what is known. Marked over-annotated rather than removed, and the two evidence codes are given the same action.
