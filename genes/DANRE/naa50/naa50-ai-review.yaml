    label: somitogenesis
  evidence_type: IMP
  original_reference_id: PMID:16484612
  review:
    summary: |-
      Somitogenesis, IMP from the zebrafish knockdown study of the EGAP N-terminal acetyltransferase complex, in which naa50 was cloned as a binding partner and UniProt records the naa35 interaction from this work. Morphants fail to develop, with reduced proliferation, increased apoptosis and defective vessel formation [PMID:16484612].
    action: KEEP_AS_NON_CORE
    reason: |-
      The cached record is abstract-only, so the somite-stage scoring the ZFIN curator read is not available here and the annotation is not second-guessed. On what is visible, the phenotype is a global early-embryonic growth failure in an animal lacking a housekeeping co-translational modification enzyme, and segmentation defects follow from that rather than from Naa50 doing work specific to somite formation. Retained as a non-core developmental consequence.
