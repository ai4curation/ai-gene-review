suggested_questions:
- question: Does zebrafish naa50 show the same mitotic sister-chromatid cohesion requirement as Drosophila san and human NAA50, or is the embryonic phenotype attributed to it purely a consequence of lost N-terminal acetylation?
- question: Is there an in vivo lysine substrate of Naa50 in any organism, or is the N-epsilon activity confined to autoacetylation that tunes N-terminal substrate choice?
suggested_experiments:
- hypothesis: The developmental phenotype of naa50 loss in zebrafish reflects loss of N-terminal acetyltransferase activity rather than a non-catalytic role.
  description: Generate a naa50 germline null and rescue it with wild-type versus catalytically dead (acetyl-CoA-site mutant) naa50 mRNA, scoring somite formation, proliferation and apoptosis; this also tests the morpholino-based somitogenesis annotation with a stable allele.
  experiment_type: genetic rescue
- hypothesis: Zebrafish Naa50 acetylates Met-starting N-termini in vivo.
  description: Perform N-terminomics (COFRADIC or similar) on naa50 mutant versus wild-type embryos to identify the set of N-termini whose acetylation depends on naa50, and test whether cohesion-related proteins are among them.
  experiment_type: proteomics
