      Protein N-terminal-methionine acetyltransferase activity (Rhea-mapped IEA). This is the reaction UniProt records for the protein, acetylating Met-Ala, Met-Ser, Met-Val, Met-Thr, Met-Lys and Met-Leu N-termini (EC 2.3.1.258); human Naa50 prefers Met-Leu-Xxx-Pro peptides [PMID:19744929].
