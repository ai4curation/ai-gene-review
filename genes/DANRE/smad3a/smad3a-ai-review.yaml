suggested_questions:
- question: Do smad3a single mutants have any phenotype, and is smad3b upregulated in smad3a PTC mutants (transcriptional
    adaptation)?
- question: Does the circadian, Clock1a-driven expression of smad3a (absent from smad3b) have a physiological consequence
    that smad3b cannot supply?
- question: Is the difference in myf5 promoter activation between Smad3a and Smad3b a real protein difference, e.g.
    linked to the diverged smad3b linker?
suggested_experiments:
- hypothesis: smad3a and smad3b are redundant for the ventral aorta phenotype.
  description: Compare ventral aorta diameter in smad3a-/-, smad3b-/-, smad3a-/-;smad3b+/- and double mutants, including
    an RNA-less smad3a allele to exclude transcriptional adaptation.
  experiment_type: genetic interaction analysis
- hypothesis: Smad3a and Smad3b have equivalent transcriptional activity.
  description: Side-by-side SBE-reporter and target-gene assays of equal doses of Smad3a, Smad3b and a Smad3b linker-swap
    (smad3a linker) in MZ smad3a;smad3b embryos.
  experiment_type: cross-rescue
