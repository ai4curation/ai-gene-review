id: Q8AY15
gene_symbol: smad3a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: smad3a (SMAD family member 3a) is one of two zebrafish co-orthologs of vertebrate SMAD3, retained
  from the teleost-specific genome duplication; its paralog is smad3b. It encodes a receptor-regulated SMAD
  (R-SMAD) with an N-terminal MH1 DNA-binding domain, a linker carrying regulatory phosphosites and a C-terminal
  MH2 domain ending in the SSVS motif that TGF-beta/activin/nodal type I receptors phosphorylate. On activation
  it forms a heteromeric complex with SMAD4, enters the nucleus and binds SMAD-binding elements to regulate
  transcription of target genes. smad3a is the more conserved of the two copies (97% identical to human SMAD3).
  Its mRNA is supplied maternally and is broadly expressed, with higher levels in paraxial mesoderm and newly
  formed somites. Unlike smad3b, it is expressed with a circadian rhythm and is a direct target of Clock1a.
  With smad2 and smad3b it mediates nodal/TGF-beta signals in mesendoderm induction. Overexpressed smad3a
  activates the myf5 promoter together with Smad4, and constitutively active Smad3a promotes cardiomyocyte
  proliferation. Combined loss of smad3a and smad3b enlarges the ventral aorta but is compatible with adult
  survival.
