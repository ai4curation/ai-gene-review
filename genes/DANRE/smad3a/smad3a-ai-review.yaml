- description: Receptor-regulated SMAD of the TGF-beta/activin/nodal branch. After C-terminal phosphorylation it
    forms a heteromeric complex with SMAD4, enters the nucleus, binds SMAD-binding elements and activates RNA
    polymerase II target genes (e.g. myf5). Molecular function shared with smad3b.
