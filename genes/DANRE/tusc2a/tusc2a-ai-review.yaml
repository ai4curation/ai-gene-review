description: 'tusc2a is one of two zebrafish co-orthologs of human TUSC2 (FUS1), a small (111-residue)
  N-myristoylated mitochondrial protein. It keeps the N-terminal myristoylation glycine and the acidic
  calcium-binding motif (DEDGDLAHEFYEE) that define the TUSC2 family. In mammals TUSC2 localizes to
  mitochondria and regulates mitochondrial calcium uptake and calcium-coupled mitochondrial parameters
  (membrane potential, reactive oxygen species, permeability transition), and Tusc2-deficient mice show
  chronic inflammation, autoimmunity and premature age-related pathologies. Nothing has been measured
  for the zebrafish protein. tusc2a is the larger maternal TUSC2 transcript in the zebrafish zygote, is
  low during gastrulation and organogenesis, and is expressed at lower levels than tusc2b in most adult
  tissues, with its highest levels in testis and ovary.'
