        in Fus1-depleted cancer cells
core_functions:
- description: Myristoylated mitochondrial protein that, by analogy with mammalian TUSC2, regulates mitochondrial
    calcium uptake and calcium-coupled mitochondrial parameters such as membrane potential; its molecular
    activity (proposed calcium sensing through the conserved acidic motif) is not established. Both zebrafish
    copies keep the myristoylation site and the calcium-binding motif.
