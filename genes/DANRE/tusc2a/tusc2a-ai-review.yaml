- term:
    id: GO:0006954
    label: inflammatory response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1931086
  - PANTHER:PTN002693339
  review:
    summary: Inflammatory response propagated from mouse Tusc2, whose knockout shows chronic inflammation and
      an altered response to asbestos.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The mouse evidence is a knockout phenotype: loss of Fus1 perturbs immune cell numbers and cytokine
      dynamics, which the authors attribute to disturbed mitochondrial homeostasis. TUSC2 acts on mitochondrial
      calcium handling within cells; it does not itself carry out steps of the inflammatory response, so this
      is a downstream consequence rather than participation. For zebrafish there are no immune data at all.
      The mitochondrial terms describe what the protein does.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002693339
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: A different node from the one carrying the mitochondrial terms; seeded by the mouse knockout
          inflammation phenotype, which reflects a downstream consequence of mitochondrial dysfunction.
      - source_id: MGI:MGI:1931086
        source_label: Tusc2 (mouse)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Knockout mice show chronic inflammation and altered cytokine dynamics; the authors attribute this
          to disturbed mitochondrial homeostasis rather than a direct role of Tusc2 in the inflammatory response.
    supported_by:
    - reference_id: PMID:22513871
      supporting_text: Untreated Fus1(-/-) mice had an ~eight-fold higher proportion of peritoneal granulocytes
        than Fus1(+/+) mice, pointing at ongoing chronic inflammation.
    - reference_id: PMID:24328503
      supporting_text: Our findings suggest that Fus1 achieves its protective role in inflammation, autoimmunity,
        and cancer via the regulation of mitochondrial calcium and calcium-coupled parameters.
