suggested_questions:
- question: Do zebrafish Tusc2a and Tusc2b both localize to mitochondria, and do both need the N-terminal glycine
    for it?
- question: Is the maternal-biased expression of tusc2a (and the zygotic expression of tusc2b) a partition of an
    ancestral profile? What does gar TUSC2 expression look like through development and in gonads?
- question: Does either copy bind calcium through the conserved DEDGDLAHEFYEE motif?
suggested_experiments:
- hypothesis: Both copies regulate mitochondrial calcium uptake.
  description: Make tusc2a, tusc2b and double mutants (including maternal-zygotic tusc2a); measure mitochondrial
    calcium uptake and membrane potential in embryonic cells with genetically encoded sensors.
  experiment_type: genetic interaction
- hypothesis: The proteins are interchangeable.
  description: Rescue double-mutant mitochondrial phenotypes with either coding sequence, and with a Gly2Ala
    myristoylation mutant as a control.
  experiment_type: cross-rescue
