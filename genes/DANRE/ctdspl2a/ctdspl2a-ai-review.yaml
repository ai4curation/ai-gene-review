  review:
    summary: Phosphoprotein phosphatase activity, propagated from the Dullard/SCP family node PTN000258719,
      whose experimental sources include human CTDSPL2 itself (Q05D32).
    action: ACCEPT
    reason: The function is ancestral to the family (FCP/SCP, Dullard/CTDNEP1, TIMM50 and plant and yeast
      homologs are all protein phosphatases), and ctdspl2a keeps every feature needed for it. The catalytic
      DxDx(T/V) motif is present as DLDET, aligned exactly to human D293-T297, and the FCP1-homology domain is
      97.5% identical to human CTDSPL2. Mutating either aspartate of that motif abolishes human SCP4 function.
      This is the core molecular function of the gene; a more specific child (protein serine/threonine
      phosphatase activity) is recorded in core_functions.
    supported_by:
    - reference_id: PMID:35021089
      supporting_text: SCP4 belongs to the haloacid dehalogenase (HAD) family of proteins, which employ conserved
        active site aspartates within a DxDx(V/T) motif to remove phosphates from protein or non-protein substrates
    - reference_id: PMID:35021089
      supporting_text: Despite similar expression levels to the wild-type protein, SCP4D293A, SCP4D295A, and
        SCP4D293A/D295A mutants were unable to support MOLM-13 growth (Figures 3G and 3H).
    - reference_id: file:DANRE/ctdspl2a/ctdspl2a-bioinformatics/RESULTS.md
      supporting_text: Both copies keep the DxDx(T/V) catalytic motif (DLDET) and a phosphatase domain at least
        96% identical to human CTDSPL2.
