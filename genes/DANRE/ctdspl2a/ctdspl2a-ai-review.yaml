  review:
    summary: Nucleus from an ARBA rule.
    action: ACCEPT
    reason: Human and mouse CTDSPL2 are nuclear, chromatin-associated phosphatases, and their N-terminal
      segment carries importin-binding nuclear localization sequences. Its best-characterized substrates (Pol II CTD,
      FoxO1/3a, Smad1/5/8, histone H3) are nuclear proteins. The zebrafish
      N-terminal region is less conserved (52% identical) than the phosphatase domain, so nuclear targeting
      is an inference, but a well supported one for the family.
    supported_by:
    - reference_id: PMID:26920047
      supporting_text: Therefore, SCP4 is a unique chromatin-associated, Ser5-preferential CTD phosphatase that
        preferentially distributes to transcriptionally silenced gene regions and may participate in gene
        regulation during erythroid differentiation.
    - reference_id: PMID:35021089
