suggested_questions:
- question: Do ctdspl2a and ctdspl2b act on the same nuclear substrates in zebrafish (Pol II CTD, FoxO, Smad1/5/9),
    and is the divergent N-terminal region of either copy still able to target it to the nucleus?
- question: Is the combined ctdspl2a + ctdspl2b expression in zebrafish comparable to the single gar gene, as
    expected if the pair is retained for dosage?
suggested_experiments:
- hypothesis: ctdspl2a and ctdspl2b are functionally redundant phosphatases.
  description: Generate single and double mutants (RNA-less alleles where possible, to avoid transcriptional
    adaptation); test early BMP-dependent dorsoventral patterning, larval glucose levels under fasting, and
    cartilage development; test cross-rescue by mRNA injection of each copy and of catalytic-dead (D-to-N) forms.
  experiment_type: genetic interaction
- hypothesis: Both zebrafish proteins keep CTD phosphatase activity.
  description: In vitro phosphatase assays of recombinant ctdspl2a and ctdspl2b on phospho-CTD and phospho-Smad1
    peptides, with human CTDSPL2 as control.
  experiment_type: biochemical assay
