gene_symbol: ctdspl2a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: ctdspl2a (CTD small phosphatase-like 2a) is one of two zebrafish co-orthologs of vertebrate
  CTDSPL2 (SCP4), a nuclear protein phosphatase of the haloacid dehalogenase (HAD) superfamily; its paralog
  is ctdspl2b. The protein has a disordered N-terminal regulatory region, which in the human protein carries
  nuclear localization sequences, and a C-terminal FCP1-homology phosphatase domain with the
  magnesium-dependent DxDx(T/V) catalytic motif. Human and mouse CTDSPL2 dephosphorylate serine and
  threonine residues on several nuclear substrates, including the RNA polymerase II C-terminal domain
  (Ser5-preferential), FoxO1/FoxO3a (promoting their nuclear retention and target-gene transcription,
  including gluconeogenic genes), Smad1/5/8 (attenuating BMP signalling) and mitotic histone H3 Thr3. The
  zebrafish protein keeps the catalytic motif (DLDET) and a phosphatase domain 97.5% identical to human
  CTDSPL2. ctdspl2a is maternally supplied and expressed throughout development and in all adult tissues
  sampled, at two- to three-fold higher levels than ctdspl2b. No functional study of the zebrafish gene has
  been published.
