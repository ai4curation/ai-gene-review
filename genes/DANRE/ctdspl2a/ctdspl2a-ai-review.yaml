- term:
    id: GO:0045722
    label: positive regulation of gluconeogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00084180
  review:
    summary: Positive regulation of gluconeogenesis from an ARBA rule, reflecting the mouse and human finding
      that SCP4 dephosphorylates FoxO1/3a in hepatocytes.
    action: KEEP_AS_NON_CORE
    reason: In mammals SCP4 promotes hepatic gluconeogenesis by dephosphorylating FoxO1/3a and increasing
      transcription of PEPCK1 and G6PC, and SCP4 knockout mice are hypoglycemic as neonates. That is a direct
      role (the phosphatase acts on the transcription factors that drive the gluconeogenic genes), not just a
      requirement. ctdspl2a is expressed in zebrafish liver, but the role has not been examined in fish, and it
      is one of several physiological roles of the enzyme (FoxO in muscle and cartilage, BMP-Smad, Pol II,
      mitosis). Kept as a plausible, non-core, homology-based process; the same call is made for ctdspl2b,
      which is also expressed in liver.
    supported_by:
    - reference_id: PMID:28851713
      supporting_text: In this study, we discovered a nuclear phosphatase, SCP4/CTDSPL2 (SCP4), that
        dephosphorylated FoxO1/3a and promoted FoxO1/3a transcription activity.
    - reference_id: PMID:28851713
      supporting_text: Moreover, we demonstrated that gene ablation of SCP4 led to hypoglycemia in neonatal mice.
core_functions:
- description: Nuclear HAD-family serine/threonine protein phosphatase (CTDSPL2/SCP4 ortholog) with a conserved
    DxDx(T/V) catalytic motif; by homology it dephosphorylates nuclear substrates such as the RNA polymerase II
    CTD, FoxO transcription factors and Smad1/5/8. Enzyme activity has not been measured for the zebrafish
    protein; the catalytic motif and phosphatase domain are shared with ctdspl2b.
  molecular_function:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
