- term:
    id: GO:0008324
    label: monoatomic cation transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00026578
  review:
    summary: |-
      ARBA-derived IEA placing TRPM7 at the broad monoatomic cation transmembrane transporter level (GO:0008324). The term is true but under-specific: TRPM7 is a Mg2+-permeable channel-kinase, and the zebrafish evidence (Mg2+ homeostasis IDA on PMID:27628598; Mg2+ supplementation rescuing the trpm7 mutant exocrine-pancreas defect, PMID:21183474) supports magnesium ion transmembrane transporter activity (GO:0015095), an is_a descendant of GO:0008324, as the specific activity.
    action: MODIFY
    reason: |-
      The broad cation-transporter term is not wrong, but the activity the evidence actually supports is Mg2+ conductance. PMID:27628598 (full text) characterizes zebrafish Trpm7 as a divalent-cation channel whose permeation series includes Mg2+ and whose channel function is the primary mechanism of cellular Mg2+ homeostasis, and the same paper grounds the GO:0010960 IDA row. PMID:21183474 shows that dietary Mg2+ partially rescues the exocrine-pancreas defect of trpm7 mutants, which is the in vivo readout expected for loss of a Mg2+ entry channel. GO:0015095 (verified in QuickGO as an is_a descendant of GO:0008324) therefore replaces the parent; the calcium channel activity row remains for the Ca2+ component. This is the core molecular function listed in core_functions.
    proposed_replacement_terms:
    - id: GO:0015095
      label: magnesium ion transmembrane transporter activity
    supported_by:
    - reference_id: PMID:27628598
      supporting_text: |-
        Mouse TRPM7 (mTRPM7) has been shown to best permeate zinc (Zn2+) and nickel (Ni2+), followed by barium (Ba2+), cobalt (Co2+), magnesium (Mg2+), manganese (Mn2+), strontium (Sr2+), cadmium (Cd2+) and calcium (Ca2+)
    - reference_id: PMID:27628598
      supporting_text: |-
        the TRPM7 channel function is thought to serve as a primary mechanism for cellular Mg2+ homeostasis
    - reference_id: PMID:21183474
      supporting_text: |-
        Supplementary Mg(2+) partially rescued the exocrine pancreatic defects of the trpm7 mutants by improving cell-cycle progression and growth
