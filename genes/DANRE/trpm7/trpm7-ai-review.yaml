- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: IEA from the UniProt subcellular-location keyword mapping. The only support for a nuclear location is the statistical ARBA prediction carried in the UniProt record; the nuclear M7CK kinase fragment reported in mammalian cells is not evidence that the full-length channel-kinase annotated here localizes to the nucleus.
    action: REMOVE
    reason: 'The only support for a nuclear location is a statistical ARBA/UniRule-derived prediction carried in the UniProt record (ARBA00004123), with no experimental localization in any species behind it. The cleaved TRPM7 kinase fragment (M7CK) reported to reach the nucleus in mammalian cells is not evidence that the full-length channel-kinase, which is the entity annotated here, localizes there: every direct localization study places the channel in the plasma membrane and intracellular vesicles. The row is removed as an over-propagated electronic inference rather than as a contradicted experimental result.'
    supported_by:
    - reference_id: file:DANRE/trpm7/trpm7-uniprot.txt
