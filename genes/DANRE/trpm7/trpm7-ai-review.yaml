    label: protein kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: ARBA-derived IEA for generic protein kinase activity (GO:0004672). The term is correct at the parent level but the C-terminal alpha-kinase domain of TRPM7 is a serine/threonine kinase, so the child term is the informative one.
    action: MODIFY
    reason: TRPM7 is a channel-kinase whose C-terminal alpha-kinase domain phosphorylates serine/threonine residues (PMID:27628598 describes the protein as an ion channel fused to an alpha-kinase); the generic protein kinase term should be replaced by protein serine/threonine kinase activity (GO:0004674), which GOA already carries for this gene and which core_functions lists as the kinase activity.
    proposed_replacement_terms:
    - id: GO:0004674
      label: protein serine/threonine kinase activity
    supported_by:
    - reference_id: file:DANRE/trpm7/trpm7-deep-research.md
      supporting_text: Alpha-kinases are atypical serine/threonine kinases that phosphorylate substrates within alpha-helical regions
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027018
- term:
