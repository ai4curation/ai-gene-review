- id: PMID:15823540
  title: Defective skeletogenesis with kidney stone formation in dwarf zebrafish mutant for trpm7.
  findings:
  - statement: Zebrafish touchtone/nutria mutants, caused by mutations in trpm7, show severe growth retardation and skeletal defects including altered ossification, in addition to melanophore and touch-response defects.
    supporting_text: severe growth retardation and gross alterations in skeletal development in addition to embryonic melanophore and touch-response defects
  - statement: trpm7 is expressed in the mesonephric kidney and mutants develop kidney stones, indicating renal dysfunction.
    supporting_text: We find trpm7 expression in the mesonephric kidney and show that mutants develop kidney stones, indicating renal dysfunction
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Abstract-only cache. trpm7 touchtone/nutria dwarf mutants show defective skeletogenesis, kidney stones, melanophore and touch defects. Supports the ossification/skeletal/melanocyte annotations as downstream developmental phenotypes.
- id: PMID:17290233
  title: Cell death of melanophores in zebrafish trpm7 mutant embryos depends on melanin synthesis.
  findings:
  - statement: Melanophore death in zebrafish trpm7 mutants occurs by necrosis rather than apoptosis, with abnormal melanosomes and ruptured plasma membranes.
    supporting_text: ultrastructural analysis of dying melanophores in trpm7 mutants reveals abnormal melanosomes and evidence of a ruptured plasma membrane, indicating that cell death occurs by necrosis
  - statement: Inhibiting melanin synthesis rescues melanophore survival in trpm7 mutants, indicating Trpm7 is required to detoxify melanin synthesis intermediates.
    supporting_text: inhibition of melanin synthesis largely prevents melanophore cell death in trpm7 mutants
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: |-
      Abstract-only cache. Melanophore death in zebrafish trpm7 mutants depends on melanin synthesis. Supports the melanin-metabolic-process / pigmentation annotations as downstream phenotypes.
- id: PMID:20881241
  title: trpm7 regulation of in vivo cation homeostasis and kidney function involves stanniocalcin 1 and fgf23.
  findings:
  - statement: trpm7 mutant zebrafish larvae have reduced total magnesium and total calcium, demonstrating an in vivo role for trpm7 in systemic cation homeostasis.
    supporting_text: early larvae exhibit reduced levels of both total magnesium and total calcium
  - statement: trpm7 regulates kidney function via stanniocalcin 1 and fgf23; mutants develop kidney stones and elevated fgf23 contributes to stone formation.
    supporting_text: elevated fgf23 expression contributes to kidney stone formation by morpholino knockdown of fgf23 in trpm7 mutants
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Full text cached. Zebrafish trpm7 mutants show reduced total Mg2+/Ca2+, kidney stones and altered stc1/fgf23; establishes the in vivo cation-homeostasis and kidney phenotypes (downstream physiological roles).
- id: PMID:21183474
  title: Transient receptor potential ion channel Trpm7 regulates exocrine pancreatic epithelial proliferation by Mg2+-sensitive Socs3a signaling in development and cancer.
  findings:
  - statement: Zebrafish trpm7 (sweetbread) mutants develop hypoplastic acini and dysmorphic ducts in the exocrine pancreas due to impaired cell-cycle progression and epithelial growth.
    supporting_text: Zebrafish sweetbread (swd) mutants develop hypoplastic acini and dysmorphic ducts in the exocrine pancreas, with impeded progression of cell division cycle and of epithelial growth
  - statement: Supplementary Mg2+ partially rescues the exocrine pancreatic defects of trpm7 mutants by repressing socs3a, indicating Trpm7 acts through Mg2+-sensitive Socs3a signaling.
    supporting_text: Supplementary Mg(2+) partially rescued the exocrine pancreatic defects of the trpm7 mutants by improving cell-cycle progression and growth and repressing the suppressor of cytokine signaling 3a (socs3a) gene
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Full text cached. trpm7 (sweetbread) mutants have exocrine pancreatic hypoplasia via Mg2+-sensitive Socs3a signaling; Mg2+ supplementation partially rescues, showing the defect is downstream of Mg2+ handling.
- id: PMID:21832193
  title: TRPM7 is required within zebrafish sensory neurons for the activation of touch-evoked escape behaviors.
  findings:
  - statement: TRPM7 acts within sensory neurons to enable touch-evoked escape behaviors, but its kinase activity and divalent-cation selectivity are dispensable for this role.
    supporting_text: TRPM7's kinase activity and selectivity for divalent cations over monovalent cations were dispensable for touch-evoked activation of escape behaviors in zebrafish
  - statement: Sensory neurons remain present and mechanosensitive in touchdown (trpm7) mutants, so TRPM7 likely functions in modulating neurotransmitter release at central synapses rather than in mechanosensation or neuron survival.
    supporting_text: sensory neurons were present and capable of responding to tactile stimuli in touchdown mutants, indicating that TRPM7 is not required for sensory neuron survival or mechanosensation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Full text cached. TRPM7 required within sensory neurons for touch-evoked escape (touchdown mutant); kinase/divalent-selectivity dispensable for the behavior. Supports the neurotransmitter-secretion/behavior annotation as downstream.
- id: PMID:23878236
  title: Ion channel-kinase TRPM7 is required for maintaining cardiac automaticity.
  findings:
  - statement: TRPM7 is highly expressed in embryonic myocardium and the sinoatrial node and is required for cardiac automaticity; its disruption in zebrafish and mice impairs pacemaking in vivo.
    supporting_text: is highly expressed in embryonic myocardium and sinoatrial node (SAN) and is required for cardiac automaticity in these specialized tissues
  - statement: TRPM7 maintains automaticity indirectly by regulating expression of the pacemaker channel gene Hcn4 and its current If, rather than by providing diastolic Ca2+ influx.
    supporting_text: We conclude that TRPM7 influences diastolic membrane depolarization and automaticity in SAN indirectly via regulation of Hcn4 expression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Full text cached. TRPM7 required for cardiac automaticity/pacemaking; zebrafish knockdown plus mouse deletions. Supports the regulation-of-heart-rate annotation as a downstream role.
- id: PMID:27628598
  title: The coiled-coil domain of zebrafish TRPM7 regulates Mg·nucleotide sensitivity.
  findings:
  - statement: The biophysical properties of zebrafish TRPM7 (drTRPM7) closely resemble mammalian TRPM7, and the channel is negatively regulated by intracellular magnesium and Mg·ATP.
    supporting_text: It is negatively regulated by intracellular magnesium (Mg2+), adenosine triphosphate (Mg·ATP) and other polyvalent molecules
  - statement: The coiled-coil domain of zebrafish TRPM7 mediates the channel's inhibitory regulation by intracellular magnesium and Mg·ATP.
    supporting_text: the coiled-coil domain of drTRPM7 is involved in the channel's regulation by magnesium (Mg) and Mg·adenosine triphosphate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Full text cached. Biophysical characterization of zebrafish TRPM7 as an ion-channel/alpha-kinase fusion (chanzyme) with Mg-nucleotide regulation; establishes the core divalent-cation channel and kinase activities.
- id: PMID:38970357
  title: Zebrafish trpm7 mutants show reduced motility in free movement.
  findings:
  - statement: A viable trpm7 mutant allele (I756N substitution in the first transmembrane domain) shows compromised motility with reduced movement distance and velocity.
    supporting_text: trpm7 mutants showed compromised motility with their movement distance shorter than wild-type larvae
  - statement: The reduced motility of trpm7 mutants, together with reduced dopaminergic neurons, parallels Parkinson's disease symptoms and links TRPM7 to parkinsonism.
    supporting_text: reduced motility of trpm7 mutants can suggest another similarity between trpm7 phenotypes and Parkinson's disease symptoms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: |-
      Abstract-only cache. New viable trpm7 allele (I756N); mutants show reduced motility/movement distance. Supports the behavioral (thigmotaxis/swimming) annotations as downstream phenotypes; specific thigmotaxis assay not detailed in the abstract.
- id: PMID:9007256
  title: Zebrafish pigmentation mutations and the processes of neural crest development.
  findings:
  - statement: A large-scale mutagenesis screen isolated 285 zebrafish pigmentation mutations defining 94 genes affecting neural-crest-derived chromatophores, including the touchtone locus later shown to be trpm7.
    supporting_text: we have isolated 285 mutations affecting all aspects of zebrafish larval pigmentation. By complementation analysis, we define 94 genes
  - statement: Many of these pigmentation genes are candidates for chromatophore differentiation and survival, consistent with trpm7's later-identified role in melanophore survival.
    supporting_text: these mutations include strong candidates for genes important in various aspects of chromatophore differentiation and survival
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: |-
      Abstract-only cache. Large-scale neural-crest pigmentation mutagenesis screen (includes trpm7/touchtone class). Supports the developmental-pigmentation context; not a molecular-function source.
- id: file:DANRE/trpm7/trpm7-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: trpm7 (Danio rerio, UniProt Q563W7) functional annotation.'
  findings:
  - statement: TRPM7 is a bifunctional channel-enzyme (chanzyme) comprising a divalent-permeable nonselective cation channel and a cytosolic C-terminal alpha-kinase, matching the UniProt Q563W7 domain architecture and the touchdown/touchtone (tct) zebrafish aliases.
    reference_section_type: OTHER
    supporting_text: 'TRPM7 is often described as a **bifunctional channel-enzyme (chanzyme)**: (i) a **nonselective cation channel** with strong **divalent permeability**, and (ii) a cytosolic **α-kinase** domain that phosphorylates protein substrates on Ser/Thr residues and also autophosphorylates.'
  - statement: TRPM7 is a plasma-membrane cation channel permeable to Mg2+, Ca2+, and Zn2+ with broader divalent permeability, defining its core transport substrate specificity.
    reference_section_type: OTHER
    supporting_text: TRPM7 forms a plasma-membrane cation channel permeable to **Mg2+**, **Ca2+**, and **Zn2+**, with broader permeability to other divalent cations
  - statement: The channel is constitutively active but strongly regulated; intracellular Mg2+ and Mg-ATP are negative regulators and channel opening requires PIP2.
    reference_section_type: OTHER
    supporting_text: '**Intracellular Mg2+ and Mg·ATP** act as negative regulators.'
  - statement: The alpha-kinase domain (EC 2.7.11.1) transfers phosphate from ATP to serine/threonine residues of protein substrates and autophosphorylates.
    reference_section_type: OTHER
    supporting_text: α-kinase domain transfers phosphate from ATP to **serine/threonine residues** on protein substrates and on TRPM7 itself (autophosphorylation)
  - statement: In zebrafish, touch-evoked escape behavior depends on TRPM7 channel activity, whereas kinase activity and strict divalent-over-monovalent selectivity are dispensable, indicating channel/kinase functions are separable.
    reference_section_type: OTHER
    supporting_text: at least one core behavioral function (touch-evoked escape) depends on TRPM7 **channel activity**, whereas TRPM7’s **kinase activity** and strict preference for divalents over monovalents were reported to be **dispensable** for that behavior
  - statement: Touchdown (trpm7) mutants show a transient touch-evoked escape deficit between 52 and 63 hpf (n = 24 embryos from three clutches), with the defect downstream of intact, tactile-responsive sensory neurons.
    reference_section_type: OTHER
    supporting_text: they **do not respond between 52 and 63 hours post-fertilization (hpf)** (reported **n = 24 embryos from three clutches**)
  - statement: trpm7 mRNA is broadly expressed in zebrafish with high abundance in pronephric/mesonephric kidney tubules and the corpuscles of Stannius, consistent with a primary role in systemic divalent-cation regulation and renal physiology.
    reference_section_type: OTHER
    supporting_text: In zebrafish, **trpm7 mRNA is broadly expressed**, with particularly high abundance in **kidney tubules** (pronephric/mesonephric) and in the **corpuscles of Stannius** (an endocrine organ involved in ionic homeostasis), supporting a primary role in systemic divalent-cation regulation and renal physiology
  - statement: trpm7 mutants show reduced whole-embryo total magnesium and calcium, kidney stone formation, and altered stc1/fgf23 endocrine programs; fgf23 knockdown reduces kidney stones.
    reference_section_type: OTHER
    supporting_text: Mutants also exhibit **kidney stone formation** and altered endocrine programs involving **stanniocalcin 1 (stc1)** and **fgf23**; mechanistically, **fgf23 knockdown reduces kidney stones**
  - statement: Melanophore loss in trpm7 mutants occurs by necrosis rather than caspase-dependent apoptosis, and inhibition of melanin synthesis largely prevents melanophore death.
    reference_section_type: OTHER
    supporting_text: In **trpm7 mutant embryos**, melanophore loss results from **cell death with necrotic features** (not caspase-dependent apoptosis).
  - statement: TRPM7 is a tetrameric plasma-membrane channel; 2023 cryo-EM structures (2.17-2.99 Angstrom) resolved closed and open conformations and druggable agonist/inhibitor pockets.
    reference_section_type: OTHER
    supporting_text: Cryo-EM structures in 2023 resolved TRPM7 at **2.17-2.99 Å**
