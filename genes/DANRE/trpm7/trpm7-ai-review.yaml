suggested_questions:
- question: How does TRPM7 integrate mechanosensing with magnesium homeostasis in zebrafish development?
- question: What determines the tissue-specific requirements for TRPM7 kinase versus channel activity?
- question: How does TRPM7 regulate cell migration and morphogenesis during gastrulation and organogenesis?
- question: What role does TRPM7 play in left-right asymmetry establishment in the zebrafish embryo?
suggested_experiments:
- hypothesis: TRPM7 channel conductance, but not its kinase activity, is the primary determinant of melanophore survival and cation homeostasis in zebrafish.
  description: Generate separation-of-function trpm7 alleles (channel-dead pore mutant vs. kinase-dead alpha-kinase mutant) and assay rescue of melanophore survival, total Mg2+/Ca2+ levels, and kidney stone formation in trpm7 mutants.
  experiment_type: CRISPR knock-in / structure-function rescue
- hypothesis: TRPM7 maintains cardiac automaticity in zebrafish by transcriptionally sustaining hcn4 expression in pacemaker cells, as shown in mouse SAN.
  description: Measure hcn4 transcript levels and the pacemaker current If in sinoatrial pacemaker cells of trpm7 mutant versus wild-type zebrafish, and test whether hcn4 overexpression rescues bradycardia.
  experiment_type: qPCR / electrophysiology
- hypothesis: The coiled-coil domain confers Mg/Mg-ATP sensitivity that tunes TRPM7 channel activity in a tissue-specific manner relevant to magnesium homeostasis.
  description: Express wild-type and C-terminal coiled-coil truncation drTRPM7 constructs in heterologous cells and patch-clamp the currents across a range of intracellular Mg2+ and Mg-ATP concentrations to map dose-response inhibition.
  experiment_type: whole-cell patch-clamp electrophysiology
