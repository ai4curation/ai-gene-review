    reason: The ZFIN IDA rests on whole-cell patch-clamp recordings of HA-tagged zebrafish Trpm7 expressed in HEK293 T-REx cells, where the clones were selected for plasma-membrane expression and gave the characteristic outwardly rectifying divalent-cation current; a channel that carries a measurable whole-cell current is by definition at the plasma membrane, and the same paper's Mg2+ homeostasis readout depends on that surface conductance. The IBA and IEA rows for the same term are argued on the same evidence, so the location is accepted as the core cellular component.
