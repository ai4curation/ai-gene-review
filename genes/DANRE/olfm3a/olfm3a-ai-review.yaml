gene_symbol: olfm3a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: olfm3a (olfactomedin 3a) is one of two zebrafish co-orthologs of vertebrate OLFM3 (optimedin, noelin-3),
  retained from the teleost-specific genome duplication; its paralog is olfm3b. It encodes a secreted glycoprotein
  with a signal peptide, an N-terminal coiled-coil region and a C-terminal olfactomedin (beta-propeller) domain, and
  belongs to the noelin subfamily with OLFM1 and OLFM2. In mammals OLFM3 is expressed in retina, brain and the
  anterior eye, forms homo- and hetero-oligomers with other noelins and binds myocilin, and the noelins together are
  extracellular constituents of AMPA-type glutamate receptor complexes that anchor the receptors at synapses. The
  zebrafish protein keeps the coiled coil, the olfactomedin domain and its cysteines. olfm3a is switched on during
  late pharyngula stages and is the predominant larval copy, expressed in brain (including tectal and hindbrain
  glutamatergic neurons) and retina. No functional study of this gene has been published.
