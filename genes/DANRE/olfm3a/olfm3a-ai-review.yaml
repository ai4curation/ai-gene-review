core_functions:
- description: Secreted noelin-family olfactomedin glycoprotein of larval brain and retina; by homology an
    extracellular component of synaptic AMPA-receptor complexes. No molecular activity has been measured for the
    zebrafish protein; protein features are shared with olfm3b.
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0045202
    label: synapse
  supported_by:
  - reference_id: PMID:37591201
    supporting_text: Knock out of Noelins1-3 profoundly reduced AMPARs in synapses onto excitatory and inhibitory (inter)neurons,
      decreased their density and clustering in dendrites, and abolished activity-dependent synaptic plasticity.
  - reference_id: PMID:34895465
    supporting_text: tectal glutamatergic Cluster 1 and hindbrain glutamatergic Cluster 31 shared effector gene profiles
      including camk2n1a/stmn4/cbln2b/olfm3a/cd63
  - reference_id: file:DANRE/olfm3a/olfm3a-bioinformatics/RESULTS.md
    supporting_text: olfm3a is the predominant larval copy; olfm3b is barely detected in whole embryos and larvae.
