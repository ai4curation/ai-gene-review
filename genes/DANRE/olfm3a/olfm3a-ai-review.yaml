  review:
    summary: Signal transduction propagated from the olfactomedin family node, seeded by myocilin (mouse Myoc,
      human MYOC) and mouse Olfm1.
    action: MARK_AS_OVER_ANNOTATED
    reason: The node sits at the base of a large and functionally varied family (noelins, myocilin, gliomedin,
      OLFM4 and others), and its donors are myocilin and Olfm1, not an OLFM3. The best-supported mammalian role of
      the noelins, OLFM3 included, is extracellular organization of AMPA-receptor complexes, which is not signal
      transduction in the GO sense; OLFM3-specific data are limited to binding partners and overexpression effects
      on adhesion. For a secreted protein of unknown mechanism this very general process term says more than the
      evidence does. The same call is made for olfm3b.
    supported_by:
