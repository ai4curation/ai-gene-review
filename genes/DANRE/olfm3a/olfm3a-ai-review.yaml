suggested_questions:
- question: Where exactly are olfm3a and olfm3b expressed in larval and adult retina and brain (double in situ or
    single-cell data), and do they overlap in any cell type?
- question: Do zebrafish noelins (olfm1a/b, olfm2a/b, olfm3a/b) co-purify with AMPA receptor complexes, and which
    olfm3 copy contributes?
suggested_experiments:
- hypothesis: olfm3a and olfm3b have complementary expression domains inherited from an ancestral brain/eye/ovary
    pattern.
  description: Paralog-specific in situ hybridization (or HCR) for olfm3a and olfm3b in larval and adult brain,
    retina, intestine and ovary, with gar OLFM3 in situ as outgroup.
  experiment_type: expression analysis
- hypothesis: olfm3a is dispensable alone, as Olfm3 is in mouse, and acts together with other noelins.
  description: Generate olfm3a mutants alone and combined with olfm3b and olfm1a/b; measure AMPA receptor clustering
    and mEPSCs in larval tectal neurons.
  experiment_type: genetic interaction
