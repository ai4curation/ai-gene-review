suggested_questions:
- question: Does zebrafish Aspp2a bind Tp53 and enhance p53-dependent apoptosis (for example after DNA damage),
    and does it differ from Aspp2b in doing so?
- question: Why does tp53bp2b expression drop during gastrulation and organogenesis while tp53bp2a stays high,
    and does gar TP53BP2 show a single continuous profile?
- question: Does Aspp2a localize to apical junctions in zebrafish epithelia, as mammalian ASPP2 does?
suggested_experiments:
- hypothesis: tp53bp2a and tp53bp2b are redundant growth regulators.
  description: Make stable tp53bp2a and tp53bp2b mutants (including promoter-less alleles to avoid transcriptional
    adaptation) and double mutants; measure body length, Akt phosphorylation and Irs-1 binding.
  experiment_type: genetic interaction
- hypothesis: Aspp2a keeps the ancestral p53 cofactor function.
  description: Test tp53bp2a mutants for reduced p53-dependent apoptosis after irradiation, with tp53 mutants as
    controls.
  experiment_type: loss of function
