description: 'tp53bp2a is one of two zebrafish co-orthologs of human TP53BP2 (ASPP2), a large cytoplasmic
  scaffold protein with an N-terminal Ras-associating (ubiquitin-like) domain, a coiled-coil and a long
  proline-rich, largely disordered middle region, and a C-terminal module of four ankyrin repeats and an
  SH3 domain. In mammals this C-terminal module binds the p53 DNA-binding domain and enhances p53-dependent
  apoptosis, and ASPP2 also acts at apical cell junctions, where it binds Par-3 and scaffolds PP1 and YAP.
  In zebrafish embryos, Aspp2a (together with its paralog Aspp2b) binds Irs-1 and restrains embryonic body
  growth without changing developmental rate, by dampening Akt signaling; this activity needs the ankyrin
  repeats and SH3 domain. tp53bp2a is the predominant copy from gastrulation onward and is expressed
  broadly in larval and adult tissues.'
