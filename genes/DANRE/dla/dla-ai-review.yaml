- term:
    id: GO:0048018
    label: receptor ligand activity
  evidence_type: IMP
  original_reference_id: PMID:21148001
  review:
    summary: DeltaA activates Notch receptors on neighbouring cells; dla/dld loss reduces Notch activity
      in dopaminergic precursor specification.
    action: NEW
    reason: 'NEW, complementing Notch binding (GO:0005112): the ligand does the activating work, which
      is what receptor ligand activity asserts and what the perturbation evidence shows (DeltaA/DeltaD
      control Notch activity). Comparator check: Drosophila Dl, human DLL1 and mouse Dll1 carry GO:0048018
      for the same role. Not applied to cis-inhibitory, non-activating Delta paralogs such as mammalian
      DLL3.'
    supported_by:
    - reference_id: PMID:21148001
      supporting_text: These data reveal that Notch signaling acts upstream of sim1 and otp in ventral
        diencephalic DA development, and that DeltaA and DeltaD appear to be the ligands controlling Notch
        activity in this process.
