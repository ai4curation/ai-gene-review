id: Q6DI48
gene_symbol: dla
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: dla (deltaA) encodes Delta-like protein A, one of four zebrafish Delta-class DSL 
  ligands (with dlb, dlc and dld) and, with dld, a co-ortholog of mammalian DLL1. It is a 
  single-pass type I membrane protein with an N-terminal MNNL domain, a DSL domain and eight 
  EGF-like repeats that engage Notch receptors on adjacent cells. Dla protein localises in puncta at
  the cell membrane/cortex of neural precursors, and its signalling activity depends on 
  ubiquitination and endocytosis driven by the E3 ligase Mind bomb (Mib1), which binds Dla. 
  Dla-Notch signalling mediates lateral inhibition in primary neurogenesis (limiting Rohon-Beard 
  neurons and promoting trunk neural crest), in inner ear hair-cell versus support-cell decisions, 
  in dopaminergic and V2 interneuron neurogenesis, in hindbrain rhombomere boundary maintenance, and
  in the specification of midline floorplate, notochord and hypochord from common progenitors. The 
  dx2 missense allele acts as a dominant-negative ligand.
