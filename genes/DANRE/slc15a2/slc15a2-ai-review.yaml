  label: Danio rerio
description: 'slc15a2 encodes PEPT2, the high-affinity member of the SLC15 proton-coupled oligopeptide
  transporter (POT/PTR) family. It is a multi-pass membrane protein that uses the inwardly directed electrochemical
  proton gradient to import di- and tripeptides (and peptide-like solutes such as the peptidoglycan fragment
  muramyl dipeptide and many peptidomimetic drugs) against their concentration gradient, co-transporting
  2-3 protons per peptide. In mammals PEPT2 is sorted to the apical membrane of reabsorptive and barrier
  epithelia, notably the renal proximal tubule and the choroid plexus, where it scavenges filtered and
  CSF peptides; the mouse protein additionally localizes to macrophage phagosomes. Zebrafish pept2 is
  expressed in kidney, gut, brain (ventricular/choroid plexus regions) and the otic vesicle from 1-7 dpf,
  and the cloned transporter behaves electrophysiologically as a high-affinity, pH- and voltage-dependent
  peptide:proton symporter in Xenopus oocytes.'
