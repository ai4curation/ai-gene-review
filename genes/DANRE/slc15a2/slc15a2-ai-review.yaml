    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  review:
    summary: 'Logical inference (GO_REF:0000108) from the peptide:proton symporter activity: the symporter
      co-translocates 2-3 H+ per peptide across the membrane. UniProt gives the 2:1/3:1 proton:peptide
      stoichiometry and the pH-dependent kinetics that establish proton coupling for the zebrafish protein.'
    action: KEEP_AS_NON_CORE
    reason: The proton movement is a genuine, mechanistically inseparable part of symport rather 
      than an over-annotation, so it is kept; but it is not a standalone physiological role (PEPT2 
      exists to import peptides, and the H+ flux is the driving cofactor), so it is non-core 
      relative to the peptide-import process terms.
