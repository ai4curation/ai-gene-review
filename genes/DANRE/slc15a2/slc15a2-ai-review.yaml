suggested_questions:
- question: Is zebrafish Slc15a2 sorted to the apical membrane of pronephric tubule and choroid 
    plexus epithelia, as its mammalian ortholog is, or does it show a different polarity in fish?
- question: Does zebrafish PEPT2 transport muramyl dipeptide and thereby modulate NOD/NLR 
    innate-immune signaling, or is that activity restricted to the mammalian ortholog?
suggested_experiments:
- description: Immunolocalize Slc15a2 in the zebrafish pronephros and choroid plexus (or express a 
    tagged transporter in polarized epithelial monolayers) to resolve the apical-versus-basolateral 
    targeting that is currently inferred from mammalian orthologs.
