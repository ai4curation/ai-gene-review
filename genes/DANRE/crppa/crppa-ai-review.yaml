- term:
    id: GO:0008299
    label: isoprenoid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: InterPro2GO mapping from the IspD domain (IPR018294) to isoprenoid
      biosynthesis, reflecting the bacterial/plant role of IspD in the MEP pathway.
      Vertebrates do not have the MEP pathway, and mammalian ISPD has no activity on
      the MEP substrate; the vertebrate enzyme makes CDP-ribitol for dystroglycan
      glycosylation.
    action: REMOVE
    reason: This is a demonstrably wrong domain-to-process transfer. The MEP pathway
      is absent from vertebrates [PMID:22522421], and recombinant mammalian ISPD showed
      no activity with CTP and 2-C-methyl-D-erythritol-4-P while readily forming
      CDP-ribitol [PMID:27194101]. The enzyme retained the fold and the
      cytidylyltransferase chemistry but was repurposed to a different pathway, so the
      process term is wrong in vertebrates.
    supported_by:
    - reference_id: PMID:22522421
      supporting_text: In plants, protozoa and some bacteria, ISPD belongs to the
        non-mevalonate isoprenoid biosynthesis (MEP) pathway, which is absent in
        vertebrates
    - reference_id: PMID:27194101
      supporting_text: No activity was observed in the presence of UTP, or in the
        presence of CTP and 2-C-methyl-D-erythritol-4-P, which is the substrate
