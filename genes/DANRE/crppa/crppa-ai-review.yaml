suggested_questions:
- question: Has the CDP-ribitol synthase activity of the zebrafish Crppa protein been
    measured directly, and does the zebrafish enzyme share the mammalian preference
    for D-ribitol 5-phosphate over ribose/ribulose 5-phosphate?
- question: Does dietary ribitol supplementation, which partially rescues
    alpha-dystroglycan glycosylation in ISPD-mutant human fibroblasts, rescue the
    muscle and brain phenotypes of zebrafish crppa loss-of-function models?
suggested_experiments:
- description: Express and purify zebrafish Crppa (both N-terminal isoforms) and assay
    CDP-ribitol formation from CTP and D-ribitol 5-phosphate by HPLC/LC-MS, comparing
    kinetics with the mammalian enzyme, to convert the ISS/IBA molecular-function
    annotations into direct evidence.
  experiment_type: BIOCHEMICAL
- description: Generate a stable crppa mutant line (CRISPR) and test ribitol
    supplementation for rescue of alpha-dystroglycan IIH6 reactivity, Evans blue dye
    uptake and hydrocephalus, to confirm the morphant phenotypes and the
    CDP-ribitol-dependent mechanism in vivo.
  experiment_type: GENETIC
