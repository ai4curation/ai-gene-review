- term:
    id: GO:0047349
    label: D-ribitol-5-phosphate cytidylyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: PAINT propagation of the specific catalytic activity (CTP + D-ribitol
      5-phosphate to CDP-ribitol + diphosphate) from the vertebrate ISPD node, seeded by
      human ISPD. The activity was demonstrated with recombinant mammalian ISPD and the
      product identified by mass spectrometry and NMR; the zebrafish protein retains the
      ISPD cytidylyltransferase domain and morphant phenotypes match loss of this activity.
    action: ACCEPT
    reason: Recombinant mammalian ISPD shows a clear CDP-ribitol pyrophosphorylase
      activity with D-ribitol-5-P as by far the best substrate and no activity on the
      MEP-pathway substrate 2-C-methyl-D-erythritol-4-P [PMID:27194101]; the human
      enzyme structure has a canonical cytidyltransferase domain and makes CDP-pentoses
      in vitro [PMID:26687144]. The zebrafish protein has not been assayed directly, but
      it is 65% similar to human, its knockdown phenocopies loss of dystroglycan
      glycosylation [PMID:22522421], and there is no sign of catalytic-residue loss, so
      inheriting the activity is the correct phylogenetic call. This is the core
      molecular function.
    supported_by:
    - reference_id: PMID:27194101
      supporting_text: However, we clearly observed a CDP-ribitol pyrophosphorylase
        activity (Fig. 1b).
    - reference_id: PMID:27194101
      supporting_text: No activity was observed in the presence of UTP, or in the
        presence of CTP and 2-C-methyl-D-erythritol-4-P, which is the substrate
        utilized in related enzymes in the mevalonate pathway.
    - reference_id: PMID:26687144
      supporting_text: cytidyltransferase activity toward pentose phosphates, including
        ribulose 5-phosphate, ribose 5-phosphate, and ribitol 5-phosphate
    - reference_id: file:DANRE/crppa/crppa-uniprot.txt
      supporting_text: Reaction=D-ribitol 5-phosphate + CTP + H(+) = CDP-L-ribitol +
        diphosphate
