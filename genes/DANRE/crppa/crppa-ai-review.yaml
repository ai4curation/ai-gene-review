id: A0JPF9
gene_symbol: crppa
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: crppa (formerly ispd) encodes the zebrafish ortholog of vertebrate ISPD/CRPPA,
  a cytosolic member of the IspD/TarI cytidylyltransferase family. The enzyme
  condenses CTP with D-ribitol 5-phosphate to form the nucleotide sugar CDP-ribitol,
  the donor used by the Golgi ribitol-phosphate transferases Fktn and Fkrp to build the
  ribitol-phosphate-containing core M3 O-mannosyl glycan (matriglycan) on
  alpha-dystroglycan, which alpha-dystroglycan needs to bind laminin and other
  extracellular matrix ligands. Vertebrates lack the non-mevalonate (MEP) isoprenoid
  pathway in which bacterial IspD acts, so the vertebrate enzyme is dedicated to
  dystroglycan glycosylation. Knockdown of zebrafish ispd/crppa causes
  alpha-dystroglycan hypoglycosylation, loss of sarcolemma integrity with muscle
  fiber degeneration, hydrocephalus and reduced eye size, modelling human
  Walker-Warburg syndrome, and sub-effective ispd, fktn and fkrp morpholinos act
  synergistically.
