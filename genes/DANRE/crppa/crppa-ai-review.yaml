  review:
    summary: PAINT propagation of cytosolic localization from the ISPD ancestral node,
      seeded by the human ortholog (UniProtKB:A4D126). Cytosolic localization was
      shown experimentally for human ISPD, and CDP-ribitol must be made in the cytosol
      before it is used in the Golgi by Fktn/Fkrp. No zebrafish-specific localization
      data exist, but nothing in the zebrafish sequence suggests a different compartment.
    action: ACCEPT
    reason: The human ortholog was localized to the cytosol in the study that solved
      its structure and demonstrated cytidyltransferase activity [PMID:26687144], and
      UniProt records the same location for the zebrafish protein by similarity. A
      cytosolic nucleotide-sugar synthase feeding Golgi transferases is the expected
      topology for this pathway, so the node placement is sound and zebrafish crppa
      falls inside the clade that inherited it.
