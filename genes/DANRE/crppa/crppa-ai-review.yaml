- id: PMID:22522421
  title: Mutations in ISPD cause Walker-Warburg syndrome and defective glycosylation
    of α-dystroglycan.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached PubMed record (Nat Genet 2012, PMC3378661,
      full text cached). This is the primary zebrafish paper - the only one with
      direct experiments on the zebrafish gene - and the source of all ZFIN and
      UniProt experimental rows. It establishes alpha-dystroglycan hypoglycosylation,
      sarcolemma and muscle defects, hydrocephalus and reduced eyes in ispd morphants
      (two morpholinos), and genetic interaction with fktn and fkrp. It did not
      identify the enzymatic reaction (it explicitly says vertebrate ISPD function was
      unknown); that came later.
  findings:
  - statement: Zebrafish ispd knockdown reduces glycosylated (IIH6-reactive)
      alpha-dystroglycan, reproducing the diagnostic feature of Walker-Warburg syndrome.
    supporting_text: Compared with control embryos, glycosylated αDG was reduced in
      ispd MO1-injected zebrafish embryos
    reference_section_type: RESULTS
  - statement: Both ispd morpholinos cause hydrocephalus, incomplete brain folding and
      reduced eye size by 48 hpf.
    supporting_text: High doses of ispd MO1 (7 ng) caused hydrocephalus and incomplete
      brain folding in 82% of embryos (n=88) by 48 hours post fertilization (h.p.f.)
    reference_section_type: RESULTS
  - statement: Loss of Ispd compromises sarcolemma integrity before muscle fiber
      degeneration, independently of laminin and dystrophin localization.
    supporting_text: loss of Ispd function in zebrafish results in αDG hypoglycosylation
      and compromised sarcolemma integrity, preceding muscle fiber degeneration
    reference_section_type: RESULTS
  - statement: Sub-effective ispd morpholino doses synergize with fktn and fkrp
      morpholinos, placing ispd in the same alpha-dystroglycan glycosylation pathway.
    supporting_text: These results support a cooperative interaction between ispd and
      fktn/fkrp in αDG glycosylation.
    reference_section_type: RESULTS
  - statement: The MEP isoprenoid pathway in which bacterial IspD acts is absent from
      vertebrates, so the vertebrate enzyme cannot function in isoprenoid biosynthesis.
    supporting_text: In plants, protozoa and some bacteria, ISPD belongs to the
      non-mevalonate isoprenoid biosynthesis (MEP) pathway, which is absent in
      vertebrates
    reference_section_type: DISCUSSION
- id: PMID:27194101
  title: ISPD produces CDP-ribitol used by FKTN and FKRP to transfer ribitol phosphate
    onto α-dystroglycan.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached PubMed record (Nat Commun 2016, PMC4873967,
      full text cached). Recombinant mammalian ISPD assays define the reaction (CTP +
      D-ribitol-5-P to CDP-ribitol), show no activity on the MEP substrate, and show
      that FKTN/FKRP transfer ribitol phosphate from CDP-ribitol onto
      alpha-dystroglycan. Used here for the molecular function of the zebrafish
      ortholog by inference; the paper does not assay zebrafish protein.
  findings:
  - statement: Recombinant mammalian ISPD is a CDP-ribitol pyrophosphorylase, with
      D-ribitol 5-phosphate as the preferred substrate.
    supporting_text: However, we clearly observed a CDP-ribitol pyrophosphorylase
      activity (Fig. 1b).
    reference_section_type: RESULTS
  - statement: ISPD has no activity on the MEP-pathway substrate
      2-C-methyl-D-erythritol 4-phosphate, excluding an isoprenoid-biosynthesis role.
    supporting_text: No activity was observed in the presence of UTP, or in the presence
      of CTP and 2-C-methyl-D-erythritol-4-P, which is the substrate utilized in
      related enzymes in the mevalonate pathway.
    reference_section_type: RESULTS
  - statement: FKTN and FKRP use CDP-ribitol made by ISPD to add ribitol phosphate to
      alpha-dystroglycan, defining ISPD's step in O-mannosyl glycan biosynthesis.
    supporting_text: both recombinant fukutin (FKTN) and fukutin-related protein (FKRP)
      can transfer a ribitol phosphate group from CDP-ribitol to α-dystroglycan
    reference_section_type: ABSTRACT
- id: PMID:26687144
  title: Human ISPD Is a Cytidyltransferase Required for Dystroglycan O-Mannosylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached PubMed record (Chem Biol 2015). Abstract only
      in the cache. Reports the human ISPD crystal structure with a canonical
      cytidyltransferase domain, cytosolic localization, and cytidyltransferase
      activity on pentose phosphates including ribitol 5-phosphate. Cited for the
      cytosol and generic cytidylyltransferase rows; the zebrafish protein was not
      studied.
  findings:
  - statement: Human ISPD is cytosolic and has cytidyltransferase activity toward
      pentose phosphates including ribitol 5-phosphate.
    supporting_text: Functional studies demonstrated cytosolic localization of hISPD,
      and cytidyltransferase activity toward pentose phosphates, including ribulose
      5-phosphate, ribose 5-phosphate, and ribitol 5-phosphate.
    reference_section_type: ABSTRACT
- id: file:DANRE/crppa/crppa-uniprot.txt
