      morpholinos [PMID:22522421], and it is biologically important as the zebrafish
      WWS model, so the row should stay. But the gene product acts upstream of brain
      morphogenesis (it makes a nucleotide sugar in the cytosol); the qualifier
      acts_upstream_of_or_within already expresses that, and the term is not a core
      function.
    supported_by:
    - reference_id: PMID:22522421
      supporting_text: High doses of ispd MO1 (7 ng) caused hydrocephalus and
        incomplete brain folding in 82% of embryos (n=88) by 48 hours post
