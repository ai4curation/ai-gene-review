  evidence_type: IMP
  original_reference_id: PMID:22522421
  review:
    summary: ZFIN IMP annotation from the ispd MO1 morphant (ZDB-MRPHLNO-120629-1),
      which shows reduced IIH6-reactive alpha-dystroglycan on western blot. The
      experimental finding is sound, but it shows that crppa is a component of the
      glycosylation pathway (it makes the CDP-ribitol donor), not a regulator that
      modulates the rate of glycoprotein biosynthesis.
    action: MODIFY
    reason: GO:0010559 is defined as a process that modulates the rate or extent of
      glycoprotein biosynthesis. Loss of a pathway enzyme reduces the product, but
      that is participation, not regulation - ISPD synthesizes the CDP-ribitol that
      FKTN/FKRP transfer onto alpha-dystroglycan [PMID:27194101]. The same paper is
      the basis for the UniProt IMP annotation to protein O-linked glycosylation via
      mannose (GO:0035269), which is the correct process term for this evidence
      (alpha-dystroglycan hypoglycosylation in ispd morphants [PMID:22522421]).
