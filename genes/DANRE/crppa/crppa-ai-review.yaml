    id: GO:0048854
    label: brain morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:22522421
  review:
    summary: ZFIN IMP annotation from the ispd MO1 morphant, which develops
      hydrocephalus and incomplete brain folding by 48 hpf, modelling the cobblestone
      lissencephaly and hydrocephalus of Walker-Warburg syndrome. The brain phenotype is
      a downstream consequence of alpha-dystroglycan hypoglycosylation, which disrupts
      basement-membrane attachment of neural cells; crppa does no work in brain
