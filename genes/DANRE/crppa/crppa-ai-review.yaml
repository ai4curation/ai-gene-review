    label: protein O-linked glycosylation via mannose
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: PAINT propagation of the O-mannosyl glycosylation process role. The
      zebrafish gene itself is one of the descendant evidences (ZFIN gene in WITH/FROM),
      alongside human ISPD. crppa supplies the CDP-ribitol donor that Fktn/Fkrp use to
      add ribitol-phosphate to the core M3 O-mannosyl glycan of alpha-dystroglycan, so
      it performs a step of the pathway rather than merely being required for it.
    action: ACCEPT
    reason: Participation is direct - ISPD synthesizes CDP-ribitol, and FKTN/FKRP
      transfer ribitol phosphate from that donor onto alpha-dystroglycan [PMID:27194101].
      In zebrafish, ispd knockdown reduces IIH6-reactive (glycosylated)
      alpha-dystroglycan and sub-effective ispd morpholino doses synergize with fktn
      and fkrp morpholinos [PMID:22522421], which is the in vivo counterpart of the
      biochemistry. The zebrafish gene appearing in its own WITH/FROM reflects that
      experimental grounding and is expected. This is a core function.
