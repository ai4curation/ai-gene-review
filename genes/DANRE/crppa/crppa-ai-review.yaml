- id: file:DANRE/crppa/crppa-deep-research-falcon.md
  title: Falcon deep research report for Danio rerio crppa (UniProt A0JPF9)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Secondary synthesis. Its claims about the reaction, the FKTN/FKRP
      donor role, the absence of the MEP pathway in vertebrates and the zebrafish
      morphant phenotypes agree with the primary papers cited above, which are now
      used directly; retained as background only.
  findings:
  - statement: The report identifies zebrafish crppa (synonym ispd, UniProt A0JPF9)
      as the vertebrate ISPD/CRPPA ortholog, a D-ribitol-5-phosphate
      cytidylyltransferase, not a microbial isoprenoid enzyme.
    supporting_text: 'a **D-ribitol-5-phosphate cytidylyltransferase / CDP-L-ribitol
      pyrophosphorylase A (CRPPA)**'
    reference_section_type: RESULTS
  - statement: Zebrafish ispd has two splice isoforms with different N-termini but a
      shared conserved ISPD domain.
    supporting_text: two splice isoforms with different N-termini but a shared conserved
      ISPD domain
    reference_section_type: RESULTS
core_functions:
- description: crppa catalyzes the cytosolic condensation of CTP with D-ribitol
    5-phosphate to form CDP-ribitol, the nucleotide-sugar donor that the Golgi
    ribitol-phosphate transferases Fktn and Fkrp use to build the matriglycan-bearing
    core M3 O-mannosyl glycan on alpha-dystroglycan; loss of crppa therefore causes
    alpha-dystroglycan hypoglycosylation and dystroglycanopathy phenotypes in zebrafish.
  molecular_function:
