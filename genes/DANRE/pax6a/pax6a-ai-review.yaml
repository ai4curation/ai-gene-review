id: P26630
gene_symbol: pax6a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  pax6a is one of two zebrafish co-orthologues of vertebrate PAX6, retained from the teleost-specific
  genome duplication. It encodes a transcription factor with an N-terminal paired domain and a paired-type
  homeodomain that binds cis-regulatory DNA and activates target genes; alternative splicing produces
  short and long (exon 5a-containing) isoforms. pax6a is expressed in the developing retina and lens and,
  more broadly than its paralogue pax6b, in the telencephalon, diencephalon, hindbrain and spinal cord,
  but not in the pancreas. It is required for habenular neurogenesis in the dorsal diencephalon, acts
  together with pax6b in anterior eye segment development, in guidance of periocular neural crest and
  in hindbrain patterning, and promotes proliferation of Muller glia-derived neuronal progenitors during
  adult retinal regeneration. The two co-orthologues encode proteins with equivalent transactivation activity;
  their divergence lies mainly in expression, reflecting differential loss of cis-regulatory elements
  after duplication.
