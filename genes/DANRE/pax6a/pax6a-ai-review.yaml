- term:
    id: GO:0003309
    label: type B pancreatic cell differentiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:97488
  - MGI:MGI:97490
  - PANTHER:PTN002900580
  - RGD:3258
  - ZFIN:ZDB-GENE-001031-1
  review:
    summary: >-
      IBA transfer of pancreatic beta-cell differentiation to pax6a. pax6a is not expressed in the developing
      or adult zebrafish pancreas; this ancestral PAX6 role has been partitioned entirely to pax6b.
    action: REMOVE
    reason: >-
      The PAINT node correctly places endocrine-pancreas function in the vertebrate Pax6 clade, and pax6a
      retains the molecular function. But there is target-specific evidence that pax6a lost this role
      at the expression level after the teleost genome duplication: pax6a is not expressed in the embryonic
      or adult pancreas, is not induced there even when pax6b is mutant (PMID:18282108), and its upstream
      enhancers A and C are inactive in the pancreas because of divergence in PDX1-binding cis-elements
      (PMID:18485195). The pancreatic endocrine phenotypes are produced by pax6b loss alone (PMID:20177065).
      A gene not expressed in the tissue does not take part in the differentiation of its cells, so this
      IBA is a propagation that the expression partition of the duplicate pair does not support.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002900580
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node placement is sound for vertebrate Pax6; after the TGD only the pax6b copy kept pancreatic
          expression.
      - source_id: ZFIN:ZDB-GENE-001031-1
        source_label: pax6b
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Experimental seed from the paralogue pax6b; pancreas-specific, does not transfer to pax6a.
    supported_by:
    - reference_id: PMID:18282108
      supporting_text: >-
        only pax6b is expressed in the pancreas isolated from 6 month old wild type and sri/sri fish,
        while eyes from the same individuals express both pax6a and pax6b
    - reference_id: PMID:18282108
      supporting_text: >-
        We also showed that pax6a expression is not induced in the pancreas of the sunrise mutant.
    - reference_id: PMID:18485195
      supporting_text: >-
        While both zebrafish pax6 genes are expressed in the developing eye and nervous system, only pax6b
        is expressed in the endocrine cells of the pancreas.
    - reference_id: PMID:18485195
      supporting_text: >-
        In constrast, regions A and C of the zebrafish pax6a gene are not active in the pancreas, this
        difference being attributable to sequence divergences within two cis-elements binding the pancreatic
        homeoprotein PDX1.
