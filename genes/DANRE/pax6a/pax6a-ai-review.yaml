  review:
    summary: >-
      Sequence-specific binding of RNA polymerase II cis-regulatory DNA by the paired domain and homeodomain.
    action: ACCEPT
    reason: >-
      Both zebrafish Pax6 co-orthologues retain complete paired domains and homeodomains and activate
      paired-domain (CD19) and homeodomain (P3) reporter targets at indistinguishable levels in the same
      assay (PMID:18282108); both act as transcriptional activators and both induce ectopic eyes in Drosophila
      (PMID:9831649). The molecular function is therefore conserved in both copies and is correctly shared
      across the pair. Pax6a activates reporters through a homeodomain target (P3) and a paired-domain
      target (CD19), which requires sequence-specific binding of these sites.
    supported_by:
    - reference_id: PMID:18282108
      supporting_text: >-
        Activation by the two wild type co-orthologues through the P3 homeodomain target [45] (Figure
        1D), or the CD19 paired domain target [46] (Figure 1E), was not significantly different, in contrast
        to the original observations by Nornes et al [43].
    - reference_id: PMID:9831649
      supporting_text: >-
        The coding sequences of the two genes show 82% identity whereas the deduced amino acid sequences
        are 95% identical with complete conservation of the paired- and homeodomains.
