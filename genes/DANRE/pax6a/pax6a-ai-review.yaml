- term:
    id: GO:0060221
    label: retinal rod cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:20152834
  qualifier: involved_in
  review:
    summary: Rod photoreceptor regeneration after light damage did not depend on Pax6a.
    action: REMOVE
    reason: >-
      The cited paper itself shows that reduction of neuronal progenitors after pax6 knockdown reduced
      regenerated cones but not rods, and that rods regenerate from resident ONL rod precursors whose
      proliferation is not directly dependent on Pax6 (PMID:20152834). The rod differentiation annotation
      is contradicted by the full text of its own source.
    supported_by:
    - reference_id: PMID:20152834
      supporting_text: >-
        The reduced number of INL neuronal progenitor cells in both Pax6 knockdown retinas resulted in
        a corresponding loss of regenerated cones, but not rods.
    - reference_id: PMID:20152834
      supporting_text: >-
        Furthermore, the increased number of PCNA-positive rod precursor cells in both the pax6b and the
        pax6a morphant retinas clearly shows that rod precursor proliferation is not directly dependent
        of Pax6.
- term:
    id: GO:0021986
    label: habenula development
  evidence_type: IMP
  original_reference_id: PMID:27387288
  review:
    summary: pax6a is required for habenular neurogenesis; pax6b is not.
    action: NEW
    reason: >-
      Morpholino knockdown of pax6a abolished expression of the habenular neuron markers cxcr4b and brn3a,
      whereas pax6b null mutants had normal habenular markers (PMID:27387288). pax6a acts upstream of
      neurog1/neurod4 in habenular progenitors, so the transcription factor does the regulatory work of
      this developmental process. ZFIN has made this IMP annotation to pax6a, but on RefSeq-derived UniProt
      accessions (e.g. A0A8M3AP00), not on the Swiss-Prot entry P26630 reviewed here.
    supported_by:
    - reference_id: PMID:27387288
      supporting_text: >-
        Here, we show that habenular neurogenesis requires the homeobox transcription factor Pax6a and
        the redundant action of two proneural bHLH factors, Neurog1 and Neurod4.
    - reference_id: PMID:27387288
      supporting_text: >-
        Homozygous pax6bsa86 mutant embryos display cxcr4b and brn3a expression in the habenulae largely
        indistinguishable from that of wild type siblings (Fig 2A, 2B, 2E and 2F).
    - reference_id: PMID:27387288
      supporting_text: >-
        Somewhat surprisingly, on the other hand, morpholino knock-down of pax6a alone abrogated the expression
        of both markers (Fig 2C and 2G); pax6a morphant/pax6bsa86 mutant embryos behaved the same as pax6a
        morphants alone with respect to these markers (Fig 2D and 2H).
