        diencephalon, hind brain, and spinal cord, although not in developing pancreas [49].
    - reference_id: PMID:32555736
      supporting_text: >-
        In concordance with mouse homozygous pax6 mutant phenotypes, zebrafish pax6a-/-;pax6b-/- double
        homozygous mutants showed severe defects in distal eye structures, lacking the lens, iris, corneal
        endothelium and ganglion cell layer of the retina.
- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IMP
  original_reference_id: PMID:20152834
  qualifier: involved_in
  review:
    summary: >-
      Morpholino knockdown of pax6a in the light-damaged adult retina reduced later divisions of Muller
      glia-derived neuronal progenitors.
    action: MODIFY
    reason: >-
      The IMP is sound, but the proliferating cells are specifically Muller glia-derived neuronal progenitors
      during photoreceptor regeneration (PMID:20152834); Muller glia and rod precursor proliferation were
      not Pax6-dependent. A term naming neural precursor proliferation is more accurate than generic cell
      population proliferation. This is a regeneration context, so non-core.
    proposed_replacement_terms:
    - id: GO:2000179
      label: positive regulation of neural precursor cell proliferation
    supported_by:
    - reference_id: PMID:20152834
      supporting_text: >-
        In contrast, the paralogous Pax6a protein was required for later neuronal progenitor cell divisions,
        which maximized the number of neuronal progenitors.
    - reference_id: PMID:20152834
      supporting_text: >-
        This work also defines distinct roles for Pax6a and Pax6b in regulating neuronal progenitor cell
        proliferation in the adult zebrafish retina
- term:
