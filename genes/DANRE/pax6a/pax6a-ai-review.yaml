      The paper (full text read) reports that the pax6a morphant retina had cone regeneration intermediate
      between controls and pax6b morphants and that the difference from controls was not statistically
      significant (PMID:20152834). The effect of Pax6a is on the number of Muller glia-derived neuronal
      progenitors; fewer cones follow from fewer progenitors. Pax6a function is better captured by the
      progenitor-proliferation term.
    supported_by:
    - reference_id: PMID:20152834
      supporting_text: >-
        the pax6a morphant retina exhibited a level of cone cell regeneration intermediate to the controls
        and the pax6b morphant and pax6a/pax6b double morphants
    - reference_id: PMID:20152834
      supporting_text: although this value was not statistically significant relative to the controls
    - reference_id: PMID:20152834
      supporting_text: >-
        The reduced number of INL neuronal progenitor cells in both Pax6 knockdown retinas resulted in
        a corresponding loss of regenerated cones, but not rods.
