  review:
    summary: >-
      pax6a and pax6b together guide two periocular neural crest waves into the anterior eye segment.
    action: NEW
    reason: >-
      Compound pax6a/pax6b mutants misroute neural crest cells in a gene-dose-dependent way (PMID:32555736).
