  review:
    summary: >-
      ARBA-predicted role in anterior/posterior pattern specification; supported by reduced pax6a/pax6b
      activity anteriorizing the hoxd4a expression border.
    action: KEEP_AS_NON_CORE
    reason: >-
      Knockdown of pax6a and/or pax6b malformed rhombomere boundaries and shifted the hoxd4a border (PMID:17010333),
