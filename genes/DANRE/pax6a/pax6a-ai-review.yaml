suggested_questions:
- question: >-
    ZFIN's experimental annotations for pax6a (e.g. IMP habenula development, IGI neural crest cell migration,
    IDA transcription factor activity) are attached in GOA to RefSeq-derived TrEMBL accessions (A0A8M3AP00
    and others) but not to the Swiss-Prot entry P26630. Should the ZFIN-to-UniProt mapping be fixed so
    the canonical entry carries them?
  experts:
  - ZFIN curators
  - UniProt
- question: >-
    Does pax6a in the eye carry any function that pax6b cannot supply at equal dose, or is the pair redundant
    in the eye apart from expression level?
suggested_experiments:
- hypothesis: >-
    pax6a and pax6b proteins are interchangeable; the copies differ only in cis-regulation.
  description: >-
    Knock the pax6b coding sequence into the pax6a locus (and vice versa) and test rescue of habenular
    neurogenesis and eye phenotypes in single and double mutants.
  experiment_type: coding-sequence swap / cross-rescue
- hypothesis: >-
    pax6a mutant phenotypes are mild partly because of maternal transcripts or transcriptional adaptation
    by pax6b.
  description: >-
    Compare maternal-zygotic pax6a mutants carrying a PTC allele with a promoter-deletion (RNA-less) allele,
    and measure pax6b levels in each.
  experiment_type: genetic compensation test
