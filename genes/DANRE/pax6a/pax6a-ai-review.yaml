  review:
    summary: >-
      pax6a is the major brain-expressed pax6 co-orthologue (telencephalon, diencephalon, hindbrain, spinal
      cord) and is required for habenular neurogenesis.
    action: ACCEPT
    reason: >-
      The PAINT node places the vertebrate Pax6 role in brain development at an ancestral node; pax6a
      is inside that clade and, if anything, retains most of the ancestral brain expression and cis-regulatory
      elements (PMID:18282108). Loss-of-function evidence specific to pax6a exists for the habenula (PMID:27387288).
    supported_by:
    - reference_id: PMID:18282108
      supporting_text: >-
        pax6a is expressed in the lens and retina, as well as more widely in the developing telencephalon,
        diencephalon, hind brain, and spinal cord, although not in developing pancreas [49].
    - reference_id: PMID:18282108
      supporting_text: >-
        This may be the situation where several brain-specific elements, with spatiotemporal overlap in
        expression pattern, have been lost from pax6b.
    - reference_id: PMID:27387288
      supporting_text: >-
        Here, we show that habenular neurogenesis requires the homeobox transcription factor Pax6a and
        the redundant action of two proneural bHLH factors, Neurog1 and Neurod4.
