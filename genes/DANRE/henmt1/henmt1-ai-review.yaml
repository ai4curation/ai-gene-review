id: Q568P9
gene_symbol: henmt1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'henmt1 (also called hen1 in the zebrafish literature) encodes the HEN1-family S-adenosyl-L-methionine-dependent small RNA 2''-O-methyltransferase (EC 2.1.1.386) that methylates the 2''-hydroxyl of the 3''-terminal nucleotide of Piwi-bound piRNAs. Unlike plant HEN1, the animal enzyme lacks dsRNA-binding domains and acts on single-stranded piRNAs as the final step of piRNA 3''-end maturation. The 2''-O-methyl cap blocks 3''-terminal uridylation and adenylation and thereby protects piRNAs from a uridylation-coupled 3''-5'' exonucleolytic decay. The protein is gonad-specific and localizes, via its C-terminal domain, to nuage (P granules/germ granules), the perinuclear cytoplasmic compartment where Ziwi/Zili piRNA pathway components operate. Loss of henmt1 leads to piRNA tailing, reduced piRNA levels, mild transposon derepression, and failure of oocyte development, so mutant fish develop as sterile-ovary or male-only animals; the gene is dispensable for testis development.'
