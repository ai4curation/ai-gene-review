core_functions:
- description: 'SAM-dependent 2''-O-methylation of the 3''-terminal ribose of Piwi-bound piRNAs in nuage, completing piRNA 3''-end maturation and protecting piRNAs from uridylation-triggered 3''-5'' exonucleolytic decay; this sustains piRNA levels and transposon silencing in the germ line.'
