    label: piRNA processing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'piRNA processing (GO:0034587) covers the generation of functional piRNAs. Terminal 2''-O-methylation by Hen1 is the last maturation step of a piRNA, and the zebrafish primary paper shows directly that Hen1 is required for this modification and for piRNA accumulation [PMID:20859253].'
    action: ACCEPT
    reason: 'Henmt1 does the work of the step: it is the enzyme that adds the 3''-terminal 2''-O-methyl group, which is part of piRNA 3''-end maturation (the child term GO:0140990 explicitly includes "pre-piRNA maturation of 3'' ends by trimming and 2''-O-methylation"). The PAINT node (PTN000483941) is seeded by fly Hen1, mouse Henmt1 and zebrafish henmt1 itself, all with experimental piRNA methylation evidence, so the node placement is sound and the zebrafish gene sits squarely inside the clade. This is a core function.'
    supported_by:
