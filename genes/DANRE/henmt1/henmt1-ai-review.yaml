suggested_questions:
- question: Does zebrafish possess any Hen1-dependent 2'-O-methylated small RNA class other than piRNAs (e.g. endo-siRNAs), which would justify the siRNA processing IBA, or is the modification piRNA-restricted as in mouse?
- question: Is zebrafish Hen1 ever active in the nucleus (for example on nuclear Ziwi/Zili complexes), or is its activity confined to cytoplasmic nuage as the localization data suggest?
suggested_experiments:
- description: Periodate-oxidation/beta-elimination or small-RNA sequencing of non-Piwi Argonaute-bound small RNAs from wild-type versus hen1 mutant gonads and somatic tissues to test whether any siRNA/miRNA population carries a Hen1-dependent 3'-terminal 2'-O-methyl group.
