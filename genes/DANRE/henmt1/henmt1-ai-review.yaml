- id: PMID:20859253
  title: Hen1 is required for oocyte development and piRNA stability in zebrafish.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Title matches the cached record (Kamminga et al., EMBO J 2010, PMC2982757; full text cached, though the cached text carries abstract, introduction and the opening of the discussion rather than the results figures). This is the single primary zebrafish study behind every experimental GOA row: germ-cell-specific expression, nuage localization via the C-terminal domain, loss of piRNA 2''-O-methylation with uridylation/adenylation in hen1 mutants, decreased piRNA levels and mild transposon derepression, and a female-germline requirement.'
  findings:
  - statement: Hen1 is the enzyme that adds the 3'-terminal 2'-O-methyl group to piRNAs.
    supporting_text: piRNAs carry a 2′- O -methyl modification at their 3′ end, which is added by the Hen1 enzyme
  - statement: Zebrafish Hen1 protein localizes to nuage via its C-terminal domain but is not required to build nuage.
    supporting_text: Hen1 protein localizes to nuage through its C-terminal domain, but is not required for nuage formation
  - statement: In hen1 mutants piRNAs lose the methyl cap and acquire U/A tails; uridylation correlates with piRNA loss and transposon derepression.
    supporting_text: In hen1 mutant testes, piRNAs become uridylated and adenylated
  - statement: Hen1 is required for the female germ line but dispensable in testis.
    supporting_text: zebrafish hen1 is specifically expressed in germ cells and is essential for maintaining a female germ line, whereas it is dispensable in the testis
  - statement: Animal Hen1 homologues lack the dsRNA-binding domains of plant HEN1 and act on single-stranded substrates.
    supporting_text: In animals, putative Hen1 homologues have been identified ( Tkaczuk et al, 2006 ), but these lack the dsRNA-binding regions found in the plant HEN1 enzyme, implying that they do not act on double-stranded substrates
