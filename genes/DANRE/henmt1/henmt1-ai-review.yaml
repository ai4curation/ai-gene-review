  review:
    summary: 'O-methyltransferase activity (GO:0008171) is a true but very broad ancestor of what Henmt1 actually does: transfer of a methyl group from SAM to the ribose 2''-oxygen of the 3''-terminal nucleotide of small RNAs, which GO captures precisely as GO:0090486 (small RNA 2''-O-ribose methyltransferase activity), already annotated to this protein with EXP evidence from the same paper [PMID:20859253].'
