  review:
    summary: 'nucleus (GO:0005634), is_active_in, propagated from the HEN1 family node with Arabidopsis HEN1 (AT4G20910) and the C. elegans family member as donors. In zebrafish the only localization data place Hen1 in nuage, a cytoplasmic germ granule [PMID:20859253]; no nuclear signal or nuclear substrate is reported.'
    action: UNDECIDED
    reason: 'The nuclear localization in the family comes from members whose substrate biology differs: plant HEN1 carries dsRNA-binding domains and methylates miRNA/siRNA duplexes during nuclear miRNA biogenesis, whereas animal Hen1 lacks those domains and methylates single-stranded, Piwi-bound piRNAs in cytoplasmic nuage. The zebrafish paper explicitly contrasts the two and localizes Hen1 to nuage. That does not prove Hen1 is never active in the nucleus (e.g. on nuclear Ziwi/Zili complexes), and the cached text lacks the figures, so this cannot be resolved from the available evidence. Flag as undecided rather than accept a compartment that no zebrafish data support.'
