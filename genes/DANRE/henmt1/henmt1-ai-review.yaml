  review:
    summary: 'siRNA processing (GO:0030422) is propagated from the HEN1 family node with Arabidopsis HEN1, Drosophila Hen1 and the nematode member as donors; each of those organisms has 2''-O-methylated siRNAs. In zebrafish, the modification is documented only on piRNAs, and the primary paper notes that in animals it is found almost exclusively on piRNAs, with Drosophila endo-siRNAs as the exception [PMID:20859253].'
    action: UNDECIDED
    reason: 'The node placement is defensible for the family as a whole (plant, fly and worm HEN1 all methylate siRNAs), but the vertebrate members are not among the donors and there is no zebrafish evidence for an endo-siRNA pathway that uses Hen1: the zebrafish study sequenced Piwi-bound piRNAs and found the enzyme acts on them in nuage. Whether zebrafish possesses Hen1-methylated siRNAs has, to my knowledge, not been tested, so this cannot be confirmed or refuted from cached sources. Leave undecided; the term should not be treated as a core function.'
