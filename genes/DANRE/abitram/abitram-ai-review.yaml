core_functions:
- description: Directly binds both monomeric G-actin (GO:0003785) and filamentous F-actin (GO:0051015)
    via its single-hybrid-motif barrel-sandwich domain to attenuate spontaneous G-actin polymerization
    without depolymerizing filaments, buffering F-actin turnover and stabilizing actin structures in lamellipodia
    and filopodia tips.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0030833
    label: regulation of actin filament polymerization
  locations:
  - id: GO:0030027
    label: lamellipodium
  - id: GO:0032433
    label: filopodium tip
  supported_by:
  - reference_id: PMID:24782708
    supporting_text: Western blot analysis revealed that G-Actin specifically copurifies with Simiate.
      Hence, the interaction of Simiate and Actin is direct and requires no auxiliary proteins.
  - reference_id: PMID:24782708
    supporting_text: Here, we demonstrate that Simiate, a protein previously indicated to activate transcription,
      directly associates with both, G- and F-Actin and in doing so, affects Actin polymerization and
      Actin turnover in living cells.
  - reference_id: PMID:24782708
    supporting_text: A quantification (Figure 2B) revealed that the amount of Actin polymerized after
      a period of 3 h is reduced by 29% in the presence of Simiate
  - reference_id: PMID:24782708
    supporting_text: Using Lifeact-RFP to label Actin and antibodies to stain Simiate (Figures 1D,E),
      a colocalization of both proteins was found in lamellipodia of HEK-293 cells (Figure 1E).
- description: Concentrates in the core domain of SC35-positive nuclear speckles, where it associates
    with nuclear calpain-cleaved focal adhesion kinase (FAK80) and maintains nuclear speckle architecture
    and cell viability.
  proposed_molecular_function: nuclear speckle structural scaffold activity
  locations:
  - id: GO:0016607
    label: nuclear speck
  supported_by:
  - reference_id: PMID:24349419
    supporting_text: On the subcellular level, Simiate localises to somata and nuclear speckles.
  - reference_id: PMID:27167171
    supporting_text: loss of functional Simiate radiused nuclear speckles
  - reference_id: PMID:35787638
    supporting_text: Inside the nucleus, Simiate prefers to associate with FAK80, a Calpain2 cleavage
      product, which contains the FERM and the kinase domain of FAK1
  - reference_id: PMID:41617053
    supporting_text: While FAK1 is predominantly localised in peripheral areas, Simiate is highly enriched
      in the core domain.
knowledge_gaps:
- gap_statement: Zebrafish abitram (Q1LU93) has not been directly assayed for actin binding, subcellular
    localization, or developmental loss-of-function phenotypes in vivo.
  boundary: Strong sequence conservation (68.0% global identity [123/181] to human Q9NX38 and 65.8% global
    [127/193; 71.8% ungapped] to mouse Q80ZQ9) to biochemically characterized mammalian ABITRAM/Simiate
    (PMID:24782708, PMID:24349419) supports conserved G/F-actin binding and nuclear speckle localization,
    but no zebrafish mutant, morphant, or reporter study has been published.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  provenance:
