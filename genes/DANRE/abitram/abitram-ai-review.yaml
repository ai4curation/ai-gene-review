proposed_new_terms:
- proposed_name: nuclear speckle structural scaffold activity
  proposed_definition: Providing structural integrity or architectural organization to nuclear speckles
    (interchromatin granule clusters) through macromolecular interactions within the speckle core or periphery.
  justification: Endogenous vertebrate ABITRAM/Simiate concentrates specifically in the core domain of
    SC35-positive nuclear speckles (PMID:41617053) and intracellular antibody blockade of endogenous Simiate
    causes acute rounding/compaction of nuclear speckles followed by apoptosis (PMID:24349419, PMID:27167171),
    whereas GO currently lacks a molecular function term for nuclear speckle structural scaffold/maintenance
    activity and nuclear actin binding within speckles has not been demonstrated.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  supported_by:
  - reference_id: PMID:24349419
    supporting_text: An antibody-based block of endogenous Simiate revealed that the protein is essential
      for cell survival.
  - reference_id: PMID:27167171
    supporting_text: loss of functional Simiate radiused nuclear speckles
  - reference_id: PMID:41617053
    supporting_text: While FAK1 is predominantly localised in peripheral areas, Simiate is highly enriched
      in the core domain.
suggested_questions:
- question: Is zebrafish abitram required for embryonic neural arborization, sensory hair-cell actin stereocilia,
    or general cell survival during early development?
suggested_experiments:
- description: Generate CRISPR/Cas9 loss-of-function alleles and an endogenous mNeonGreen knock-in at
    the zebrafish abitram locus to image nuclear speckle and growth-cone dynamics in vivo.
