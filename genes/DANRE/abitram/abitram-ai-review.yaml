- id: PMID:27167171
  title: Studying Protein Function and the Role of Altered Protein Expression by Antibody Interference
    and Three-dimensional Reconstructions.
  findings:
  - statement: Chariot-mediated intracellular delivery of anti-Simiate antibodies into human HEK-293 cells
      causes nuclear speckle rounding/aggregation and dose-dependent apoptosis.
    supporting_text: loss of functional Simiate radiused nuclear speckles
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Detailed JoVE protocol and validation of anti-Simiate Chariot antibody interference
      in human HEK-293 cells and rat primary hippocampal cultures.
