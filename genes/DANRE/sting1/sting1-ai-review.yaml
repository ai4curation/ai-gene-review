proposed_new_terms: []
suggested_questions:
- question: >-
    Does zebrafish STING bind cyclic dinucleotides with the same 2'-3'-linkage preference as
    mammalian STING, and has direct cGAMP/c-di-GMP binding been measured for the zebrafish protein
    (as opposed to inferred by similarity)?
- question: >-
    Given the zebrafish-specific CTT motif that recruits TRAF6 and biases signaling toward NF-kappaB,
    what is the relative physiological contribution of the IFN versus NF-kappaB outputs of zebrafish
    STING during viral versus bacterial infection?
suggested_experiments:
- description: >-
    Quantitative cyclic-dinucleotide binding assays (ITC/thermal shift) with recombinant zebrafish
    STING for 2'3'-cGAMP, 3'3'-c-di-GMP and 2'3'-cUAMP to establish direct binding and ligand
    preference rather than similarity-based inference.
- description: >-
    Separation-of-function mutants (CTT/TRAF6-binding versus proton-channel residues) assayed in
    zebrafish for interferon induction, NF-kappaB activation, and autophagy to map which activities
    drive antiviral versus antibacterial protection.
