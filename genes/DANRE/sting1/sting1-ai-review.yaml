id: E7F4N7
gene_symbol: sting1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  Zebrafish sting1 (STING/MITA, tmem173) is the teleost ortholog of vertebrate STING, a
  multi-pass endoplasmic reticulum membrane adaptor of the cGAS-STING cytosolic nucleic-acid
  sensing pathway. As a signaling hub it binds cyclic dinucleotides (cyclic di-GMP and cGAMP)
  and, upon activation, drives both type I interferon and NF-kappaB transcriptional programs;
  a zebrafish-specific C-terminal-tail motif that recruits TRAF6 biases its output strongly
  toward NF-kappaB. It acts together with MAVS downstream of RIG-I and downstream of the
  cytosolic DNA sensors DDX41/DHX9 to induce interferon and interferon-stimulated genes,
  protecting against RNA and DNA viruses and contributing to antibacterial immunity. STING
  additionally has a conserved, interferon-independent role in inducing autophagy, and traffics
  through the ER-Golgi intermediate compartment and Golgi. It is proposed to act as a proton
  channel that promotes LC3 lipidation for autophagosome biogenesis.
