  title: Both STING and MAVS fish orthologs contribute to the induction of interferon
    mediated by RIG-I.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cloned zebrafish STING; shows it is an ER adaptor that induces IFN/ISGs, protects against RNA
      virus, and acts with MAVS downstream of RIG-I. Grounds ER localization, IFN regulation and
      antiviral defense annotations.
- id: PMID:24922577
  title: The DNA damage-regulated autophagy modulator DRAM1 links mycobacterial recognition
    via TLR-MYD88 to autophagic defense [corrected].
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache; shows DRAM1-mediated selective autophagic defense against mycobacteria
      in zebrafish requires STING. Grounds the regulation of autophagy (IGI) annotation.
- id: PMID:25972544
  title: Conservation of the STING-Mediated Cytosolic DNA Sensing Pathway in Zebrafish.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shows zSTING is required for HSV-1-induced type I IFN in zebrafish larvae (cGAS dispensable;
      DDX41/DHX9 sensors). Grounds response to virus and type I IFN annotations.
- id: PMID:29942316
  title: Identification of DEAD-Box RNA Helicase DDX41 as a Trafficking Protein That
    Involves in Multiple Innate Immune Signaling Pathways in a Zebrafish Model.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shows DrDDX41 signals through DrSTING to activate NF-kappaB and IFN pathways and antibacterial
      immunity (Aeromonas, Edwardsiella). Grounds innate immune response and NF-kappaB annotations.
- id: PMID:30842662
  title: Autophagy induction via STING trafficking is a primordial function of the
    cGAS pathway.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes STING-dependent, TBK1/IFN-independent autophagy via ERGIC/LC3 lipidation; zebrafish
      STING was among the orthologs tested for cGAMP-induced LC3 conversion. Grounds the macroautophagy
      IDA annotation.
- id: PMID:31018131
  title: Modular Architecture of the STING C-Terminal Tail Allows Interferon and NF-κB
    Signaling Adaptation.
  findings: []
