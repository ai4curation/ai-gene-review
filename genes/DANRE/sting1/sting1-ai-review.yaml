core_functions:
- description: >-
    Endoplasmic reticulum membrane signaling adaptor of the cGAS-STING pathway. Cyclic-dinucleotide
    binding activates STING to drive type I interferon production, acting together with MAVS
    downstream of RIG-I and downstream of DDX41/DHX9; its C-terminal tail recruits TRAF6 to
    additionally drive NF-kappaB, protecting the host against RNA and DNA viruses.
