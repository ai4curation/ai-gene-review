suggested_questions:
- question: Which of the two zebrafish paralogs (ube2ia/ubc9.2, maternal; ube2ib/ubc9.1, zygotic) 
    carries each experimental phenotype, and are the ubc9 mutants used in PMID:28285006 alleles of 
    ube2ib?
- question: Does Ube2ib show the RanBP2-associated cytoplasmic/nuclear-pore pool seen for mammalian 
    UBC9, or is it exclusively nuclear in zebrafish cells?
suggested_experiments:
- description: Immunolocalisation of endogenous Ube2ib (or a knock-in tag) in embryonic nuclei 
    versus nuclear pores, to give a direct zebrafish localisation record.
  hypothesis: Ube2ib is predominantly nuclear with a nuclear-pore-associated fraction, as for 
    mammalian UBC9.
