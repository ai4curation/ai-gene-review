      supporting_text: "Accepts the ubiquitin-like proteins sumo1, sumo2 and sumo3 from the
        uble1a-uble1b E1 complex and catalyzes their covalent attachment to other proteins with
        the help of an E3 ligase such as ranbp2 or cbx4."
    - reference_id: PMID:17035631
      supporting_text: A central component of this cascade is the E2-conjugating enzyme Ubc9, which 
        is highly conserved across species.
    - reference_id: PMID:17035631
      supporting_text: reduction of Ubc9 activity by expression of a dominant negative version 
