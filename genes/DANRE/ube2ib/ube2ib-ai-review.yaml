- id: PMID:25757417
  title: Sumoylation of CCAAT/enhancer-binding protein α is implicated in hematopoietic 
    stem/progenitor cell development through regulating runx1 in zebrafish.
  findings:
  - statement: Definitive HSPCs are depleted in SUMO-deficient embryos, including Ubc9 morphants, 
      through reduced generation and proliferation.
    supporting_text: "definitive hematopoietic stem/progenitor cells (HSPCs) are depleted in \nSUMO-deficient
      zebrafish embryos. Impairment of sumoylation attenuates HSPC \ngeneration and proliferation."
  - statement: Myeloid and erythroid lineage markers are decreased in Ubc9 morphants.
    supporting_text: Expression of the myeloid lineage marker lysozyme C and erythroid lineage 
      marker hbae1 were drastically decreased in both SUMOs and Ubc9 morphants
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; title matches. Ubc9 morphants are one of several SUMO-deficient 
      conditions showing HSPC depletion rescued by SUMO-C/ebpa; supports the IGI with cebpa as a 
      downstream output of sumoylation.
- id: PMID:28285006
  title: GATA5 SUMOylation is indispensable for zebrafish cardiac development.
  findings:
  - statement: ubc9 mutants are SUMOylation-deficient and show abnormal early cardiac marker 
      expression rescued only by SUMO-fused GATA5.
    supporting_text: "in SUMOylation-deficient ubc9 mutants, the abnormal expression pattern displayed
      by \nthe early markers of cardiac development (nkx2.5 and mef2cb) could be restored \nusing a sumo-gata5
      fusion, but not with a WT gata5."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; title matches. ubc9 mutants are used as a 
      SUMOylation-deficient background for gata5 rescue; supports the cardiac IGI rows as downstream
      outputs of GATA5 SUMOylation.
- id: file:DANRE/ube2ib/ube2ib-uniprot.txt
  title: UniProtKB entry Q9DDJ0 for Danio rerio ube2ib
  findings:
  - statement: UniProt describes Ube2ib/UBC9-B as the SUMO E2 conjugating enzyme in protein 
      sumoylation.
    supporting_text: Accepts the ubiquitin-like proteins sumo1, sumo2 and sumo3
- id: file:DANRE/ube2ib/ube2ib-deep-research-falcon.md
  title: Falcon deep research report on Danio rerio ube2ib (SUMO-conjugating enzyme UBC9-B)
  findings:
  - statement: 'The core molecular function of ube2ib/UBC9-B is the SUMO E2 conjugating enzyme step:

      transfer of SUMO (SUMO1/2/3) from the E2 thioester intermediate to substrate lysines,

      catalyzing protein SUMOylation.'
    reference_section_type: OTHER
    supporting_text: the primary biochemical function is **transfer of SUMO** (SUMO1/2/3 in 
      vertebrates) from the **E2 thioester intermediate** to substrate lysines, thereby catalyzing 
      **protein SUMOylation**
  - statement: 'UBC9 forms a UBC9~SUMO thioester intermediate and catalyzes formation of an isopeptide

      bond between the SUMO C-terminus and a substrate lysine.'
    reference_section_type: OTHER
    supporting_text: UBC9 catalyzes formation of an isopeptide bond between the SUMO C-terminus and 
      a substrate lysine
  - statement: 'The active-site cysteine is essential: overexpression of wild-type zebrafish Ubc9.1

      increases global SUMOylation, whereas the catalytic-site mutant C93A reduces global

      SUMOylation and causes widespread apoptosis.'
    reference_section_type: OTHER
    supporting_text: a **catalytic-site mutant C93A** reduced global sumoylation and caused 
      widespread apoptosis
  - statement: 'SUMOylation activity is predominantly nuclear/subnuclear, so ube2ib is expected to

      function mainly in nuclear SUMOylation reactions.'
    reference_section_type: OTHER
    supporting_text: ube2ib is expected to function mainly in nuclear SUMOylation reactions
  - statement: 'UBC9-family enzymes are central SUMO-pathway hubs (single vertebrate SUMO E2) rather

      than pathway-specific components, so developmental phenotypes are downstream of broad

      SUMOylation activity.'
    reference_section_type: OTHER
    supporting_text: UBC9 family enzymes are central hubs rather than pathway-specific components
  - statement: 'Zebrafish UBC9-family paralogs are implicated in cell survival and mitotic progression

      of proliferative tissues (brain/eye) and craniofacial cartilage; the paralogs are

      enzymatically redundant (ubc9.2 rescues ubc9.1 knockdown).'
    reference_section_type: OTHER
    supporting_text: Zebrafish Ubc9 paralogs are implicated in **cell survival**, **mitotic 
      progression**
  - statement: 'Identity caveat: zebrafish functional studies use the older ubc9.1/ubc9.2 naming and

      no retrieved source explicitly maps these onto ube2ib/ubc9b (Q9DDJ0), so paralog-level

      developmental evidence is family-level rather than uniquely proven for this accession.'
    reference_section_type: OTHER
    supporting_text: no retrieved source explicitly maps** those older names onto the current gene 
      symbol **ube2ib/ubc9b** or the UniProt accession **Q9DDJ0**
- id: PMID:17035631
  title: Ubc9 regulates mitosis and cell survival during zebrafish development.
  findings:
  - statement: Dominant-negative Ubc9 causes widespread apoptosis in zebrafish embryos.
    supporting_text: reduction of Ubc9 activity by expression of a dominant negative version causes 
      widespread apoptosis, similar to the effect described in Ubc9 -deficient mice.
  - statement: Zygotic ubc9 knockdown reveals an in vivo requirement for G2/M transition or 
      progression through mitosis during organogenesis.
    supporting_text: Ubc9 for G2/M transition and/or progression through mitosis during vertebrate 
      organogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (Nowak & Hammerschmidt 2006); primary zebrafish characterisation 
      of ubc9.1/ubc9.2, dominant-negative Ubc9 and MO knockdown; cited by UniProt for the mitosis 
      requirement.
- id: PMID:11331779
  title: Ubc9 interacts with a nuclear localization signal and mediates nuclear localization of the 
    paired-like homeobox protein Vsx-1 independent of SUMO-1 modification.
  findings:
  - statement: Ubc9 binds the Vsx-1 NLS and is required for its nuclear localization independent of 
      SUMO conjugation.
    supporting_text: Ubc9 Is Required for Nuclear Localization of Vsx-1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; cited by UniProt for the Vsx1 interaction and nuclear-import 
      role of Ubc9, which is SUMO-conjugation independent.
