id: Q9DDJ0
gene_symbol: ube2ib
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: ube2ib encodes SUMO-conjugating enzyme UBC9-B, one of two zebrafish paralogs of the 
  single SUMO E2 enzyme. It accepts SUMO1/2/3 from the Uble1a-Uble1b (SAE1/SAE2) activating enzyme 
  as a thioester on Cys93 and catalyses isopeptide-bond formation between the SUMO C-terminus and 
  substrate lysines, usually with an E3 such as Ranbp2 or Cbx4. It acts mainly in the nucleus, where
  SUMOylation of transcription factors (e.g. Gata5, C/ebpa) and of chromatin and mitotic proteins 
  regulates transcription, chromosome segregation and nuclear organisation; it can also chaperone 
  nuclear import of the homeobox protein Vsx1 independently of conjugation. In embryos, loss of Ubc9
  activity causes hyposumoylation with widespread apoptosis or, for zygotic knockdown, failed G2/M 
  progression in proliferating tissues (cranial cartilage, eye), and impairs cardiac precursor 
  differentiation and definitive haematopoietic stem/progenitor cell development.
