    label: SUMO conjugating enzyme activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'SUMO E2 conjugating enzyme activity: Ube2ib/Ubc9-B accepts SUMO1/2/3 from the Uble1a-Uble1b
      (SAE1/2) E1 heterodimer and transfers it to substrate lysines, the single E2 step of the SUMO cascade.'
    action: ACCEPT
    reason: 'This is the defining activity of the UBC9 family and the PAINT node (PTN000629675) is the
      whole Ubc9 clade, which the zebrafish paralog is clearly inside (UBC core domain, catalytic Cys93).
      Zebrafish-specific evidence is direct: a catalytically dead dominant-negative Ubc9 reduces SUMOylation
      and causes widespread apoptosis, and ubc9 morphants/mutants are hyposumoylated in PMID:17035631,
      PMID:25757417 and PMID:28285006.'
    supported_by:
