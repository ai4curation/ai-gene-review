suggested_questions:
- question: Where are mapre3a and mapre3b expressed at cellular resolution in larval retina and brain, and does mapre3a mark
    a neuronal subset that mapre3b lacks?
- question: Is gar MAPRE3 maternally deposited like mapre3b, which would make the zygotic-only onset of mapre3a a derived
    state?
suggested_experiments:
- hypothesis: mapre3a and mapre3b encode equivalent plus-end tracking proteins.
  description: Express tagged Mapre3a and Mapre3b in zebrafish cells or embryos and compare comet velocity, lifetime and catastrophe
    frequency; test whether either rescues EB3 depletion in mammalian cells.
  experiment_type: biochemical/cell-biological comparison
- hypothesis: The copies are partly redundant in neurons.
  description: Generate mapre3a and mapre3b single and double mutants (including promoter-less or RNA-less alleles to avoid
    transcriptional adaptation) and assay axon growth and retinal lamination.
  experiment_type: genetic interaction
