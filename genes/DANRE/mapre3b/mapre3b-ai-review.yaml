  label: Danio rerio
description: mapre3b (microtubule-associated protein, RP/EB family, member 3b) is one of two zebrafish co-orthologs of vertebrate
  MAPRE3 (end-binding protein 3, EB3), retained from the teleost genome duplication; its paralog is mapre3a. It encodes a
  microtubule plus-end tracking protein (+TIP) with an N-terminal calponin-homology (CH) domain that binds growing microtubule
  ends, a flexible linker, a C-terminal EB-homology coiled-coil domain that mediates dimerization and binding of partner +TIPs,
  and an acidic tail ending in an aromatic residue. In mammals EB3 is enriched in neurons, tracks growing microtubule ends
  and, with EB1, promotes persistent microtubule growth by suppressing catastrophes. The zebrafish protein keeps all of these
  features. mapre3b transcripts are maternally supplied and present at every embryonic stage, and adult RNA-seq detects it
  broadly (brain, retina, muscle, heart, gill, intestine, liver and other tissues). No functional study of the zebrafish gene
  has been published.
