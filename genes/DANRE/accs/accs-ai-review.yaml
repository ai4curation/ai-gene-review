id: A0A8M1N4R4
gene_symbol: accs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  1-aminocyclopropane-1-carboxylate synthase-like protein 1 (accs) is a
  556-residue zebrafish fold-type I pyridoxal 5'-phosphate (PLP)-dependent
  enzyme encoded on chromosome 25 and assigned to the vertebrate clade
  PTHR43795:SF17 as the teleost ortholog of mammalian ACCS. Zebrafish accs
  contains an N-terminal fold-type I catalytic domain (residues 50-411)
  followed by a teleost-enriched C-terminal extension and strictly conserves
  the covalent PLP Schiff-base Lys274, pyridinium-stabilizing Asp237, substrate
  alpha-carboxylate-anchoring Arg408, and inter-subunit pocket residues Tyr83
  and Trp86, while substituting Cys302 at the partner-subunit cationic pocket
  position occupied by Arg351 in mammalian ACCS cysteine-S-conjugate
  beta-lyases. Like characterized vertebrate SF17 orthologs that experimentally
  lack 1-aminocyclopropane-1-carboxylate synthase activity—with active-site
  AlphaFold2 modeling and AutoDock Vina docking on human ACCS suggesting
  partner-subunit Tyr132 (Tyr83 in zebrafish accs) sterically impedes productive
  S-adenosyl-L-methionine binding—zebrafish accs does not participate in plant
  ethylene biosynthesis; its exact physiological lyase substrate specificity,
  biological pathway, and subcellular localization in zebrafish tissues remain
  experimentally uncharacterized.
