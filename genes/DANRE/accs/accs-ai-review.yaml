- id: PMID:39876065
  title: Cysteine S-conjugate sulfoxide β-lyase activity for human ACCS.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes that vertebrate ACCS orthologs are widespread across
      vertebrates and that human ACCS and non-seed plant homologs act as
      PLP-dependent beta-lyases rather than ACC synthases.
  findings:
  - statement: >-
      ACCS orthologs are widespread across vertebrates while ACCSL is
      restricted to mammals, and characterized non-seed-plant and human ACCS
      homologs function as beta-lyases rather than ACC synthases.
    supporting_text: >-
      While hACCS orthologues are widespread in vertebrates, ACCSL orthologues
      are only found in mammals (Figure 1b), with their genomic context being
      strictly conserved (Figure 1a).
