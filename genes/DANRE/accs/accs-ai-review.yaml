suggested_questions:
- question: >-
    How does the teleost Cys302 residue (at the position of mammalian Arg351)
    and the 95-residue C-terminal tail shape substrate specificity in zebrafish
    accs compared with mammalian ACCS?
  experts:
  - Yang Hai
suggested_experiments:
- hypothesis: >-
    Recombinant zebrafish accs (A0A8M1N4R4) retains or attenuates
    cysteine-S-conjugate beta-lyase activity (GO:0047804) on S-phenyl-L-cysteine
    and alliin despite the teleost R351->C302 pocket substitution, and
    engineering the mammalian-like C302R rescue mutant increases catalytic
    efficiency toward S-phenyl-L-cysteine and cysteine S-sulfoxides.
  description: >-
    Perform direct steady-state kinetic characterization (kcat, Km, kcat/Km via
    LC-MS pyruvate quantification) of purified recombinant zebrafish accs
    (A0A8M1N4R4: wild-type Cys302 versus C302R rescue mutant and K274A
    catalytic control) on S-phenyl-L-cysteine and alliin alongside broader
    neutral, cationic, and anionic cysteine S-conjugates to test whether
    teleost accs catalyzes GO:0047804 despite R351->C302.
  experiment_type: Steady-state recombinant enzymology and C302R rescue mutagenesis
