- term:
    id: GO:0009693
    label: ethylene biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00091972
  review:
    summary: >-
      Incorrect cross-kingdom ARBA rule projection: vertebrates lack the plant
      ethylene biosynthetic pathway, and vertebrate ACCS homologs do not
      synthesize 1-aminocyclopropane-1-carboxylate.
    action: REMOVE
    reason: >-
      ARBA rule ARBA00091972 erroneously projects plant ethylene biosynthesis
      (GO:0009693) onto zebrafish accs from distant homology to land-plant ACC
      synthases. Teleost fish and other metazoans lack ACC oxidase and do not
      biosynthesize the phytohormone ethylene, and characterized vertebrate
      PTHR43795:SF17 enzymes experimentally lack ACC synthase activity toward
      S-adenosyl-L-methionine (PMID:11470512, PMID:39876065), with AlphaFold2
      homology modeling and AutoDock Vina docking hypothesizing that the
      conserved partner-subunit tyrosine (Tyr83 in A0A8M1N4R4, Tyr132 in human
      ACCS) sterically impedes productive SAM binding (PMID:39876065).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      residue_claims_not_applicable: >-
        Taxon-incompatible plant hormone pathway lacking in Metazoa; vertebrate
        SF17 enzymes catalyze beta-elimination rather than SAM cyclization to
        ACC.
      source_entities:
      - source_id: ARBA:ARBA00091972
        source_label: UniProt ARBA rule for ethylene biosynthetic process
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Lacks taxonomic restriction to Viridiplantae/land plants and
          misannotates metazoan ACCS-like beta-lyases.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: ARBA:ARBA00091972
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0009693
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      report_status: NOT_REPORTED
      explanation: >-
        ARBA rule ARBA00091972 assigns GO:0009693 (ethylene biosynthetic
        process) across metazoan ACCS-like homologs such as Danio rerio accs
        (UniProtKB:A0A8M1N4R4); animals lack the ethylene phytohormone pathway
        and vertebrate SF17 enzymes lack ACC synthase activity (PMID:11470512,
        PMID:39876065). Restrict ARBA00091972 to land-plant authentic ACS
        clades.
      supported_by:
      - reference_id: PMID:39876065
        supporting_text: >-
          Despite having an amino acid sequence most similar to plant ACCS
          (e.g., < 32% sequence identity), human ACCS (hereafter referred to as
          hACCS) does not exhibit any ACC synthase activity.
    supported_by:
    - reference_id: PMID:11470512
      supporting_text: >-
        Purified recombinant PHACS, expressed in Pichia pastoris, contains
        bound pyridoxal-5'-phosphate (PLP), but does not catalyze the synthesis
        of ACC.
    - reference_id: PMID:39876065
      supporting_text: >-
        Because both human ACCS and non-seed plant ACCS proteins are
        demonstrated to be β-lyases instead of ACC synthases, we suggest these
        proteins should be renamed as β-lyases in order to accurately reflect
        their functions.
