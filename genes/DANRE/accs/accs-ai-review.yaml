core_functions:
- description: >-
    Putative PLP-dependent catalytic enzyme (orthologous to mammalian ACCS
    carbon-sulfur beta-lyases in PTHR43795:SF17) that preserves the covalent
    PLP-binding Lys274, Asp237, substrate alpha-carboxylate-anchoring Arg408,
    and pocket Trp86 while substituting Cys302 at the mammalian Arg351 pocket
    site (PMID:39876065).
  molecular_function:
