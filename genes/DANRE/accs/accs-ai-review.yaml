knowledge_gaps:
- gap_statement: >-
    Whether zebrafish accs catalyzes cysteine S-conjugate sulfoxide beta-lyase
    cleavage like mammalian ACCS or exhibits altered beta-lyase specificity due
    to its Cys302 substitution at the mammalian Arg351 pocket position and
    95-residue C-terminal extension—as well as its in vivo metabolic pathway—is
    unknown.
  boundary: >-
    Vertebrate SF17 orthology and conservation of Lys274, Asp237, Arg408,
    Tyr83, and Trp86 are established by sequence comparison with human ACCS
    (PMID:39876065), whereas teleost biochemical and genetic data are absent.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Testing teleost accs directly reveals whether cysteine S-conjugate
    sulfoxide C-beta-S lyase activity predates tetrapods or evolved with the
    mammalian R351 pocket determinant.
  resolution: >-
    Purify recombinant zebrafish accs (wild-type, K274A, and C302R) and assay
    C-beta-S lyase kinetics on cysteine S-conjugate sulfoxides and thioethers.
  provenance:
  - reference_id: PMID:39876065
    supporting_text: >-
      Nevertheless, our bioinformatics analysis clearly indicates that animal
      ACCS homologues are more prevalent and complex than previously
      anticipated. Biochemical characterization of these animal homologues is
      therefore warranted to help us understand their functions.
- gap_statement: >-
    The native subcellular localization of zebrafish accs has not been
    determined experimentally in embryos or adult tissues.
  boundary: >-
    Zebrafish accs carries a ZFIN ND cellular_component annotation and lacks
    predicted targeting signals or transmembrane domains, with no imaging or
    fractionation data available.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Determining cellular and tissue localization in zebrafish larvae and liver
    is needed to link accs to aquatic xenobiotic or sulfur-metabolite
    processing.
  resolution: >-
    Generate an endogenous fluorescent knock-in or mRNA-tagged zebrafish line
    to map subcellular localization in vivo.
  provenance:
  - reference_id: file:DANRE/accs/accs-notes.md
    supporting_text: >-
      Zero zebrafish-specific publications characterize `accs` enzymatic
      activity, endogenous substrates, mutant/morphant phenotypes, or
      subcellular localization (`GO:0005575` `ND` is verified as `TRUE_GAP`).
