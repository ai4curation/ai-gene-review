- term:
    id: GO:0045056
    label: transcytosis
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: |-
      Transcytosis (ISS from mouse Mfsd2a) asserts that the protein moves endocytosed material through the cell. Mfsd2a does the opposite: it suppresses vesicular transcytosis in barrier endothelium, and zebrafish mfsd2aa mutants show increased luminal and abluminal vesicle densities with intact tight junctions [PMID:31429822].
    action: MODIFY
    reason: |-
      The direction of the relationship is inverted by this term. The protein is not a cargo carrier in the transcytotic route; its lipid transport changes the endothelial membrane so that caveolar vesicle formation is held down, and removing it releases that suppression. GO:1904299 negative regulation of transcytosis states what the loss-of-function data actually show, and the zebrafish mutant supplies direct evidence for it.
