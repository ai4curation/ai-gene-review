- term:
    id: GO:0051978
    label: lysophospholipid:sodium symporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      Lysophospholipid:sodium symporter activity, the direct molecular function. Zebrafish mfsd2aa expressed in HEK293 cells takes up LPC ligands at a level comparable to human MFSD2A [PMID:26005868], and the orthologous protein is a Na+-coupled LPC transporter with a defined sodium-binding site [PMID:34349262]. IBA from PTN002602210 (mouse Mfsd2a, human Q8NA29).
    action: ACCEPT
    reason: |-
      This is the activity the zebrafish protein was directly assayed for: the transport assay in PMID:26005868 used the zebrafish mfsd2aa plasmid itself, so the propagation is corroborated by target-specific data rather than resting on the node alone. Sodium coupling and LPC selectivity are established for the orthologs, and UniProt writes the reaction as an Na+-coupled 1-acyl-sn-glycero-3-phosphocholine symport. Core function.
