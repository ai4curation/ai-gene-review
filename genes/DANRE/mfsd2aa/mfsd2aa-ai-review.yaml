- term:
    id: GO:0015245
    label: fatty acid transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      Fatty acid transmembrane transporter activity claims transfer of free fatty acids across a membrane. Mfsd2a transports the fatty acid only as the acyl chain of a lysophosphatidylcholine; UniProt states explicitly that it does not transport unesterified DHA, and the assayed ligands are LPC species [PMID:26005868].
    action: MODIFY
    reason: |-
      The substrate of this transporter is a lysophospholipid, not a fatty acid, so the term names the wrong chemical species: DHA reaches the brain because it is esterified to LPC. The PAINT donors (mouse Mfsd2a, human MFSD2A) carry both this term and the LPC symporter term, so the node is about the right protein family but the fatty-acid term is the imprecise member of that pair. Replace with the lysophospholipid:sodium symporter term, which the gene already carries by IBA and ISS.
