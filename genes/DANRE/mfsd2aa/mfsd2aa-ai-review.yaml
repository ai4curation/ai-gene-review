  review:
    summary: |-
      Maintenance of the blood-brain barrier, IMP from mfsd2aa morphants: 10 kDa and 2000 kDa dextran leaked from cranial vessels into brain parenchyma, and co-injected zebrafish or human wild-type MFSD2A mRNA rescued the leak while patient missense variants did not [PMID:26005868].
