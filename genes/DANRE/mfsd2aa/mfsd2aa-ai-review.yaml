- id: PMID:36848557
  title: Mfsd2a utilizes a flippase mechanism to mediate omega-3 fatty acid lysolipid transport.
  findings:
  - statement: Reconstituted Mfsd2a flips lysophosphatidylserine from the outer to the inner liposome leaflet in a sodium-dependent manner.
    supporting_text: we demonstrate that Mfsd2a flips LPS from the outer to the inner leaflet of a membrane bilayer in a sodium-dependent manner
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: |-
      Full text cached; title matches (Wood et al. 2023, PNAS). Proteoliposome assay showing Mfsd2a flips lysolipid between bilayer leaflets; cited as the direct biochemical support for the GO:0140329 lysophospholipid translocation IBA. Mouse protein, not zebrafish.
