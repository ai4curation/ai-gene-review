- term:
    id: GO:0140329
    label: lysophospholipid translocation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      Lysophospholipid translocation means moving a lysophospholipid from one bilayer leaflet to the other. Reconstituted Mfsd2a flips lysophosphatidylserine from the outer to the inner leaflet of liposomes in a sodium-dependent manner, establishing the family as a lysolipid flippase [PMID:36848557], consistent with the cryo-EM transport mechanism [PMID:34349262]. IBA from PTN002602210 (mouse Mfsd2a, human MFSD2A).
    action: ACCEPT
    reason: |-
      The PAINT node placement is supported by direct biochemistry on the mammalian ortholog published after the node was made: flipping, not just translocation across the membrane, is the mechanism. The zebrafish protein transports the same LPC ligands with the same sodium dependence, so there is no reason to place the fish outside the clade that inherited this mechanism.
    supported_by:
    - reference_id: PMID:36848557
      supporting_text: we demonstrate that Mfsd2a flips LPS from the outer to the inner leaflet of a membrane bilayer in a sodium-dependent manner
    - reference_id: PMID:36848557
      supporting_text: These studies provide direct biochemical evidence that Mfsd2a functions as a lysolipid flippase.
    - reference_id: PMID:26005868
      supporting_text: both mfsd2aa and mfsd2ab exhibit similar transport activity of LPC ligands, and to a similar level as human MFSD2A
  qualifier: involved_in
