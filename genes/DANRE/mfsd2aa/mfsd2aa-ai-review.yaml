  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: |-
      Fatty acid transport asserts directed movement of fatty acids. What mfsd2aa moves is LPC carrying a long-chain acyl group; the free acid is not a substrate [file UniProt; PMID:26005868]. ISS from mouse Mfsd2a (Q9DA75).
    action: MODIFY
    reason: |-
      Same scoping problem as the matching molecular-function row, and given the same action for consistency: the process the protein executes is lysophospholipid transport, with the fatty acid moving as a passenger on the LPC headgroup-bearing carrier. GO:0051977 lysophospholipid transport is already on the gene from ARBA and from the zebrafish IDA, and states the transported entity correctly.
