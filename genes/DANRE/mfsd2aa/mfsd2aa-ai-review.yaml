- term:
    id: GO:1905603
    label: regulation of blood-brain barrier permeability
  evidence_type: IMP
  original_reference_id: PMID:31429822
  review:
    summary: |-
      Regulation of blood-brain barrier permeability, IMP from the mfsd2aahm37 germline mutant: larvae show at least twofold more parenchymal leak of injected 1 kDa NHS tracer and of the endogenous 80 kDa DBP-EGFP serum protein at 5 dpf, and adults leak DBP-EGFP throughout the brain [PMID:31429822].
    action: ACCEPT
    reason: |-
      Stronger evidence than the morphant row and specific to this paralog: mfsd2ab mutants have wild-type permeability, and double mutants are no worse than mfsd2aa single mutants, so the effect is attributable to this gene product. The mutant raises permeability by a defined endothelial mechanism (increased vesicle density) rather than through general sickness, which is what makes this regulation rather than a secondary phenotype.
    supported_by:
    - reference_id: PMID:31429822
      supporting_text: Mfsd2aa mutants displayed at least a two-fold increase in midbrain and hindbrain parenchymal tracer leakage
    - reference_id: PMID:31429822
      supporting_text: mfsd2ab mutants displayed similarly low levels of parenchymal tracer intensity to wild-type controls at 5 dpf
    - reference_id: PMID:31429822
      supporting_text: mfsd2aa mutants exhibited DBP-EGFP extravasation into the brain parenchyma
