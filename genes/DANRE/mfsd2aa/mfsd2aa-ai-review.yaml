- id: PMID:26005868
  title: Inactivating mutations in MFSD2A, required for omega-3 fatty acid transport in brain, cause a lethal microcephaly syndrome.
  findings:
  - statement: Zebrafish mfsd2aa transports LPC ligands at a level comparable to human MFSD2A in a cell uptake assay.
    supporting_text: both mfsd2aa and mfsd2ab exhibit similar transport activity of LPC ligands, and to a similar level as human MFSD2A
  - statement: mfsd2aa morphants leak dextran from cranial vessels into brain parenchyma.
    supporting_text: dextran extravasated extensively from vessels as evidenced by fluorescence within the brain parenchyma of mfsd2aa morphant brains
  - statement: Wild-type zebrafish or human MFSD2A mRNA rescues the leak; patient missense variants do not.
    supporting_text: co-injection with either zebrafish and human mRNA largely rescued dextran extravasation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Full text cached; title matches (Guemez-Gamboa et al. 2015, Nat Genet). Supplies the zebrafish-specific evidence used here: the HEK293 uptake assay performed with the zebrafish mfsd2aa construct (basis of the GO:0051977 IDA) and the morphant BBB leak with mRNA rescue (basis of the GO:0035633 IMP). The authors flag possible morpholino off-target effects themselves, which is why the germline-mutant paper is cited alongside it.
- id: PMID:31429822
  title: Suppression of transcytosis regulates zebrafish blood-brain barrier function.
  findings:
  - statement: mfsd2aa mutants show at least twofold increased parenchymal tracer leakage at 5 dpf.
    supporting_text: Mfsd2aa mutants displayed at least a two-fold increase in midbrain and hindbrain parenchymal tracer leakage
  - statement: mfsd2aa mutants have increased endothelial vesicle density with intact tight junctions, i.e. increased transcytosis.
    supporting_text: mfsd2aa mutants have increased vesicular densities
  - statement: mfsd2ab mutants have wild-type barrier permeability, so the requirement is paralog-specific.
    supporting_text: mfsd2ab mutants displayed similarly low levels of parenchymal tracer intensity to wild-type controls at 5 dpf
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Full text cached; title matches (O'Brown et al. 2019, eLife). Germline mfsd2aa (hm37) and mfsd2ab (hm38) mutants; the paralog-resolved permeability and TEM vesicle data ground the GO:1905603 IMP and the modification of the transcytosis row. Shows the phenotype is specific to mfsd2aa, with mfsd2ab dispensable.
