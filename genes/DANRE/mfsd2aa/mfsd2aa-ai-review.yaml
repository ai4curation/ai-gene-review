suggested_questions:
- question: Do the two zebrafish paralogs differ in substrate preference or only in vascular expression timing, given that mfsd2ab transports LPC in vitro yet its mutants have a normal barrier?
- question: Is the endoplasmic reticulum pool of Mfsd2aa functional in zebrafish, or is the ER localisation in UniProt an ortholog-derived inference without a role in the fish?
suggested_experiments:
- hypothesis: mfsd2aa, but not mfsd2ab, supplies DHA-LPC to the brain in vivo.
  description: Quantify brain lysophospholipid and DHA species by lipidomics in mfsd2aa, mfsd2ab and double mutant larvae and adults, alongside tracer permeability, to test whether barrier phenotype tracks brain LPC-DHA content.
  experiment_type: lipidomics
- hypothesis: Barrier tightening requires the transport activity itself rather than the presence of the protein.
  description: Rescue mfsd2aa mutants with transport-dead variants (equivalent to human p.Thr159Met/p.Ser166Leu) and score endothelial vesicle density by TEM and tracer leakage, separating the transport function from any structural role.
  experiment_type: genetic rescue
