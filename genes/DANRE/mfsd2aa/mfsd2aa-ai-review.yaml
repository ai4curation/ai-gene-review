- id: PMID:34349262
  title: Structure and mechanism of blood-brain-barrier lipid transporter MFSD2A.
  findings:
  - statement: MFSD2A is a sodium-dependent LPC symporter responsible for brain DHA uptake; the structure identifies a conserved sodium-binding site.
