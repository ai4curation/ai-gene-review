- term:
    id: GO:0008643
    label: carbohydrate transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: |-
      Carbohydrate transport, assigned by InterPro2GO from IPR039672 (Lactose permease-like), a family entry built around bacterial sodium:galactoside symporters. No sugar transport has been reported for any Mfsd2a protein; the characterised substrates are LPC species [PMID:26005868; PMID:34349262].
    action: REMOVE
    reason: |-
      This is a demonstrably wrong electronic mapping, not an over-broad one: the signature groups Mfsd2a with lactose permease on fold similarity, and the GO mapping then transfers the bacterial family's sugar cargo. The protein transports lysophospholipids with sodium, and no assay of the mammalian or zebrafish protein has shown carbohydrate uptake, so the annotation asserts a substrate class the evidence does not support.
