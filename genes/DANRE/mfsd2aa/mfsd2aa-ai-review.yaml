id: Q5U3U7
gene_symbol: mfsd2aa
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  mfsd2aa encodes one of the two zebrafish Mfsd2a paralogs, a multi-pass membrane protein of the major facilitator superfamily that works as a sodium-dependent lysophosphatidylcholine (LPC) symporter. It is expressed in brain microvascular endothelium, where it carries LPC species esterified to long-chain fatty acids, notably docosahexaenoic acid, from the luminal leaflet into the endothelial cell and on into the brain; it does not transport unesterified fatty acids. Through this lipid flux it shapes the lipid composition of barrier endothelium and suppresses vesicular transcytosis, so loss of mfsd2aa leaves tight junctions intact but raises endothelial vesicle density and makes the blood-brain barrier leaky in larvae and adults. The paralog mfsd2ab does not substitute for it in barrier function.
