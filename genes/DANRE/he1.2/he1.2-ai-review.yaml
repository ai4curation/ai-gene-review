suggested_questions:
- question: Is the propeptide of he1.2 removed autocatalytically or by another protease (Mmp13a has been proposed as an upstream activator), and which event triggers release of the active enzyme from hatching-gland granules?
- question: Do the two zebrafish paralogs he1.1 and he1.2 differ in expression or substrate specificity, or is he1.2 the only functionally relevant hatching enzyme, as the ZHE1/ZHE2 expression data suggest?
suggested_experiments:
- description: CRISPR knockout of he1.2 (and the he1.1 paralog) followed by hatching assays and chorion ZP2/ZP3 cleavage analysis to test whether zebrafish hatching truly depends on a single enzyme.
  experiment_type: genetic knockout
