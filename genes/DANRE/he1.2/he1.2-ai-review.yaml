id: Q1LW01
gene_symbol: he1.2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  he1.2 (hatching enzyme 1.2, ZHE1/zHCE-1) encodes the zebrafish hatching enzyme, a secreted astacin-family (M12A) zinc metalloendopeptidase (EC 3.4.24.67, choriolysin H-like). It is synthesized as a preproenzyme with a signal peptide and an activation propeptide by the hatching gland cells, which originate in the polster and come to lie in the epidermis of the anterior yolk sac; expression peaks in pre-hatching embryos and disappears after hatching. The mature enzyme is released into the perivitelline/hatching liquid, where it cleaves the N-terminal regions of the egg-envelope (chorion) zona pellucida glycoproteins ZP2 and ZP3 at defined sites (major site TVQQS-|-DYLIK, minor site KLMLK-|-APEPF), swelling and partially digesting the envelope so that the embryo can emerge. Unlike medaka, which uses a cooperating HCE/LCE pair, zebrafish hatching is performed by this single enzyme; the paralog ZHE2 is barely expressed. A 1.10 A crystal structure shows a monomeric, mitten-shaped protein whose central cleft carries the catalytic zinc and determines substrate recognition (Arg182 salt-bridging the P1' Asp of the major substrate).
