- term:
    id: GO:0004222
    label: metalloendopeptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      PAINT propagation of metalloendopeptidase activity from the astacin/M12A ancestral node (PTN000013301). For he1.2 itself the activity is established directly: purified ZHE1 cleaves egg-envelope ZP2/ZP3 at six internal N-terminal sites (PMID:19021768) and the crystal structure shows a zinc metalloprotease active-site cleft (PMID:20727360). UniProt assigns EC 3.4.24.67.
    action: ACCEPT
    reason: |-
      he1.2 sits inside the astacin clade that inherited the M12A metalloendopeptidase fold, and the target has its own experimental grounding (the ZFIN entry appears in the WITH/FROM list as expected). The cleavage sites mapped in PMID:19021768 lie within the ZP2/ZP3 polypeptides, i.e. this is endopeptidase rather than exopeptidase activity, and the enzyme requires a catalytic Zn(2+) (UniProt COFACTOR). This is the core activity of the gene product.
