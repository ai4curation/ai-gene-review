- id: PMID:19021768
  title: Purification and characterization of zebrafish hatching enzyme - an evolutionary
    aspect of the mechanism of egg envelope digestion.
  findings:
  - statement: ZHE1 is the single hatching enzyme of zebrafish; it was purified from hatching liquid, whereas the paralog ZHE2 is rarely expressed.
    supporting_text: one kind of hatching enzyme, ZHE1, was able to be purified from the hatching liquid. Therefore, the hatching of zebrafish embryo is performed by a single enzyme
  - statement: ZHE1 cleaves six sites in the N-terminal regions of the egg-envelope proteins ZP2 and ZP3, outside the ZP domains, partially digesting and swelling the envelope.
    supporting_text: The six ZHE1-cleaving sites were located in the N-terminal regions of egg envelope subunit proteins, ZP2 and ZP3, but not in the internal regions, such as the ZP domains.
  - statement: ZHE1 substrate specificity matches medaka HCE (the same sites are cleaved across species), consistent with ZHE1 retaining the ancestral hatching-enzyme character.
    supporting_text: both ZHE1 and MHCE cleaved the same sites of the egg envelope proteins of two species, suggesting that the substrate specificity of ZHE1 is quite similar to that of MHCE
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Title matches the cached PubMed record (Sano et al., FEBS J 2008). Primary biochemical characterization of zebrafish ZHE1, which UniProt maps to Q1LW01/he1.2 (EC assignment, mature-chain start and "Secreted" location all cite this paper). Abstract-only cache, but the abstract states the purification from hatching liquid, the ZP2/ZP3 cleavage sites and the single-enzyme hatching mechanism directly, which is all that the reviewed rows rely on.
- id: PMID:20727360
  title: Crystal structure of zebrafish hatching enzyme 1 from the zebrafish Danio
    rerio.
  findings:
  - statement: ZHE1 is a zinc metalloprotease; its 1.10 A crystal structure is monomeric and mitten-shaped with the active site in a central cleft.
    supporting_text: Fish hatching enzymes are zinc metalloproteases that digest the egg envelope (chorion) at the time of hatching. The crystal structure of zebrafish hatching enzyme 1 (ZHE1) has been solved at 1.10 Å resolution. ZHE1 is monomeric, is mitten shaped, and has a cleft at the center of the molecule.
  - statement: Substrate recognition of the major and minor egg-envelope cleavage sites is determined by distinct residues; Arg182 of ZHE1 salt-bridges the P1' Asp of the major substrate or the P3' Glu of the minor substrate.
    supporting_text: the AspP1' in the major substrate peptide forms a salt bridge with Arg182 of ZHE1, while the GluP3' in the minor substrate peptide instead forms a salt bridge with Arg182
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Title matches the cached PubMed record (Okada et al., J Mol Biol 2010). Structural and substrate-recognition study of the zebrafish enzyme itself; supports metalloendopeptidase activity, zinc binding and proteolysis for he1.2. Abstract-only cache.
- id: PMID:9108332
  title: Species-dependent migration of fish hatching gland cells that express astacin-like
    proteases in common [corrected].
  findings:
  - statement: Zebrafish hatching-enzyme cDNAs are most similar to medaka HCE and place the enzyme in the astacin protease family; hatching gland cells originate from the polster and in zebrafish settle in the yolk-sac epidermis.
    supporting_text: The predicted amino acid sequences of the cDNA were similar to that of the medaka enzymes, more similar to HCE than to LCE, and it was conjectured that hatching enzymes of zebrafish and masu salmon also belonged to the astacin protease family.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: |-
      Title matches the cached PubMed record (Inohaya et al., Dev Growth Differ 1997). Original cloning of the zebrafish hatching-enzyme cDNAs (zHCE, the source of the UniProt alternative name) and description of hatching-gland-cell origin and migration; used here for family assignment and site of expression, not for any GO row. Abstract-only cache.
