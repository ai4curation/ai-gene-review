suggested_questions:
- question: Does a vcla RNA-less (locus-deletion) allele, which does not upregulate vclb, reveal cardiac, muscle
    or vascular phenotypes absent from the PTC alleles?
- question: Is the vclb mRNA rise in vcla PTC mutants translated into more Vclb protein in the tissues where the
    copies overlap (notochord sheath, vasculature, myocardium), given that whole-larva Western blots of another
    PTC allele showed no compensation?
- question: Which zebrafish vinculin copy carries the metavinculin exon in cardiac and skeletal muscle?
suggested_experiments:
- hypothesis: vcla protein function is masked in PTC mutants by transcriptional adaptation of vclb.
  description: Compare vcla PTC (bns241) and RNA-less (bns605) homozygotes, each also crossed into vclb heterozygotes,
    for cardiac contractility, myofibril maturation and 10 kDa dextran leakage; measure Vclb protein by paralog-specific
    antibody or knock-in tag.
  experiment_type: allele-series comparison
- hypothesis: The two vinculin proteins are interchangeable in vivo.
  description: Knock the vclb coding sequence into the vcla locus (and vice versa) and test rescue of double-mutant
    phenotypes.
  experiment_type: cross-rescue
