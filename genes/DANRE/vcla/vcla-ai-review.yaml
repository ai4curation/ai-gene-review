  review:
    summary: Structural molecule activity from an InterPro vinculin conserved-site mapping.
    action: MARK_AS_OVER_ANNOTATED
    reason: Vinculin is a mechanosensitive linker that couples talin and alpha-catenin to F-actin; it is not a structural
      constituent in the sense of a filament or matrix protein. The informative activities (actin filament binding,
      alpha-catenin binding) are already annotated, so this vague parent adds nothing and implies a role the protein
      does not have.
