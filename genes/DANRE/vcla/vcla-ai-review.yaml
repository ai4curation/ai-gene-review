id: B3DI32
gene_symbol: vcla
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: vcla (vinculin a) is one of two zebrafish co-orthologs of vertebrate vinculin (VCL), retained from
  the teleost-specific genome duplication; its paralog is vclb. It encodes a cytoplasmic actin-binding adaptor of
  cell-matrix (focal adhesion) and cadherin-based cell-cell (adherens) junctions. Its head domain binds talin and
  alpha-catenin, and its tail binds F-actin and paxillin; tension-dependent recruitment through alpha-catenin and
  talin reinforces the link between adhesion complexes and the actin cytoskeleton. The vcla protein keeps the binding
  residues and regulatory phosphosites of mammalian vinculin, including Y822, and the gene can encode the muscle
  metavinculin isoform. GFP-tagged Vcla localizes to focal adhesions and, via the alpha-catenin vinculin-binding
  site, to adherens junctions. Maternal-zygotic vcla mutants are viable and fertile without overt defects. Loss
  of vcla together with vclb causes mild transient cardiac edema, leakage of small molecules from embryonic blood
  vessels and lethality before adulthood. vcla mutant alleles whose transcripts undergo nonsense-mediated decay
  upregulate vclb mRNA (transcriptional adaptation), whereas a vcla locus deletion does not.
