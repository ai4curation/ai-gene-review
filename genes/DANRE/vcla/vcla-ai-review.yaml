- term:
    id: GO:0045214
    label: sarcomere organization
  evidence_type: IMP
  original_reference_id: PMID:19800866
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-100114-3
  review:
    summary: vcla morpholino knockdown causes cardiac systolic dysfunction; sarcomere organization inferred from
      morphants.
    action: UNDECIDED
    reason: The only evidence is a zygotic vcla splice morpholino (ZDB-MRPHLNO-100114-3), and the cached paper is
      abstract-only. Maternal-zygotic vcla mutants are fully viable, and zygotic vcla;vclb double mutants have normal
      skeletal muscle and only mild, transient cardiac edema; the mutant authors consider the morpholino effects
      most likely non-specific. Against that, vinculin is reported to be essential for cardiomyocyte myofilament
      maturation in zebrafish (PMID:31495694, abstract only; paralog and alleles not stated), and vcla PTC alleles
      that decay trigger vclb upregulation, which could mask a single-mutant phenotype. A role for vinculin in cardiac
      sarcomere organization is plausible, but a vcla-specific IMP cannot be adjudicated from these data.
    supported_by:
    - reference_id: PMID:19800866
      supporting_text: Consistently, knock-down of the here selected human DCM genes leads to severe heart failure
        with impairment of systolic cardiac function in zebrafish.
    - reference_id: PMID:28767718
      supporting_text: While we cannot fully exclude the latter, the most likely explanation is that the reported
        effects of the used vinculin A morpholinos are non-specific.
    - reference_id: PMID:28767718
      supporting_text: While we do see cardiac edemas in vinculin-null mutants, skeletal muscle tissue seems unaffected.
    - reference_id: PMID:31495694
      supporting_text: Here, we first show that the forces of the contracting heart regulate the localization and
        activation of the cytoskeletal protein vinculin (VCL), which we find to be essential for myofilament maturation.
