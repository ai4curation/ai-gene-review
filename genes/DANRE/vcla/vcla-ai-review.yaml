- term:
    id: GO:0003181
    label: atrioventricular valve morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:30635353
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-200113-3
  review:
    summary: Endocardial overexpression of a dominant-negative vinculin head domain (cloned from vcla) blocks AV
      endocardial cell migration and valve leaflet formation.
    action: KEEP_AS_NON_CORE
    reason: The experiment is sound and shows that vinculin engagement at focal adhesions is needed for AV valve
      morphogenesis. It is attributed to vcla only because the DN fragment was cloned from vcla; a head-domain DN
      competes for talin/alpha-catenin binding sites and therefore blocks vinculin function generally, not vcla
      specifically. In the heart, vcla is expressed at low levels and vclb predominates, and vclb single mutants
      had no strong valve delay. Kept, but as a non-core process whose endogenous paralog is not identified; it
      should not be read as evidence of a vcla-specific role.
    supported_by:
    - reference_id: PMID:30635353
      supporting_text: We proceeded to analyze the functional consequences of blocking FA signaling and generated
        an upstream activating sequence (UAS)–driven DN Vinculin transgene, Tg(UAS:DN-Vcl-EGFP), which expresses
        a form of Vinculin containing only its head domain (Fig. 3 A).
    - reference_id: PMID:30635353
      supporting_text: To generate the DN Vinculin transgene, the first 774 bp of the vcla coding sequence was amplified
        by PCR using the following primers
    - reference_id: PMID:30635353
      supporting_text: The microarray data show that tln1 and apbb1ip are expressed at high levels in embryonic
