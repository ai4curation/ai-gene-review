suggested_questions:
- question: To what extent do cyp26a1, cyp26b1, and cyp26c1 act redundantly versus in distinct spatial domains to shape the embryonic retinoic-acid gradient, and what is the unique non-redundant contribution of cyp26a1?
- question: Is cyp26a1 transcription controlled primarily by retinoic-acid-driven feedback (and post-transcriptionally by miR-19) in vivo, and how does this feedback set the dynamic range and robustness of retinoic-acid signaling?
- question: Does zebrafish Cyp26a1 act strictly as an all-trans retinoic acid 4-hydroxylase, or does it also generate 18-hydroxy and other polar metabolites that retain or lack signaling activity?
suggested_experiments:
- hypothesis: cyp26a1 has a non-redundant role in clearing retinoic acid from anterior/hindbrain territories that is not fully compensated by cyp26b1 or cyp26c1.
  description: Generate single and compound cyp26a1/cyp26b1/cyp26c1 CRISPR/Cas9 mutants and compare retinoic-acid reporter activity and hox/krox20 rhombomere boundary positioning to dissect each paralog's spatial contribution.
  experiment_type: CRISPR/Cas9 genetics with retinoic-acid reporter imaging and in situ hybridization
- hypothesis: Recombinant zebrafish Cyp26a1 preferentially 4-hydroxylates all-trans retinoic acid rather than 9-cis or 13-cis isomers.
  description: Express and purify recombinant Cyp26a1, incubate with all-trans, 9-cis, and 13-cis retinoic acid, and quantify the metabolite profile and kinetic parameters by LC-MS/MS to define substrate and regiochemical specificity.
  experiment_type: in vitro cytochrome P450 enzyme assay with LC-MS/MS metabolite profiling
- hypothesis: Endogenous cyp26a1 is required to protect specific progenitor populations (posterior kidney, second heart field, pancreas) from retinoic-acid excess.
  description: Apply temporally controlled cyp26a1 loss-of-function and rescue, then quantify progenitor markers and retinoic-acid reporter activity in each tissue to test whether progenitor protection is a direct cyp26a1 function.
  experiment_type: conditional/temporal gene perturbation with marker quantification
