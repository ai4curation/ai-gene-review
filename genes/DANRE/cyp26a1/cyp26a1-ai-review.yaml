- term:
    id: GO:0007417
    label: central nervous system development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'Asserts cyp26a1 participates in central nervous system development. The requirement is real in zebrafish: the cyp26a1/giraffe null expands rostral spinal cord at the expense of hindbrain [PMID:15680360], and depleting all three cyp26 paralogs makes the entire hindbrain express posteriorly-restricted RA-responsive genes [PMID:17164423].'
    action: KEEP_AS_NON_CORE
    reason: "Retained, not removed - the node placement is sound and the zebrafish phenotypes are genuine. But it is not a core function. Cyp26a1 does none of the work of building the central nervous system: it performs one chemical step, destruction of retinoic acid, and the neural phenotypes follow from the altered ligand concentration that the retinoic-acid receptors then read out. The term records where the enzyme's product gradient matters, not what the enzyme does, so it belongs outside the core set with the other organ-patterning annotations."
    supported_by:
    - reference_id: PMID:15680360
      supporting_text: We also found that the rostral spinal cord territory was expanded at the expense of the hindbrain territory in the gir mutant.
    - reference_id: PMID:17164423
      supporting_text: In zebrafish embryos depleted of the orthologs of the three mammalian CYP26 genes CYP26A1, CYP26B1 and CYP26C1, the entire hindbrain expresses RA-responsive genes that are normally restricted to nested domains in the posterior hindbrain.
