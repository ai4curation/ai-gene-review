id: P79739
gene_symbol: cyp26a1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  cyp26a1 encodes cytochrome P450 26A1 (P450RAI), a heme-thiolate monooxygenase anchored in the
  endoplasmic reticulum/microsomal membrane that initiates catabolism of all-trans retinoic acid.
  Using molecular oxygen and electrons donated by NADPH-cytochrome P450 reductase, it hydroxylates
  all-trans retinoic acid at C-4 to all-trans-(4S)-hydroxyretinoate, which is further oxidised to
  4-oxo-retinoic acid and other polar products; the zebrafish enzyme is specific for the all-trans
  isomer and CYP26 enzymes do not turn over retinol or retinal. By destroying the receptor ligand,
  Cyp26a1 sets the local retinoic-acid concentration and so limits retinoic-acid receptor signalling,
  and its own transcription is induced by retinoic acid, closing a negative-feedback loop. In the
  zebrafish embryo cyp26a1 is expressed in anterior neurectoderm, forebrain and midbrain, the tailbud,
  the ventral posterior lateral mesoderm and the anterior trunk endoderm, where - partly redundantly
  with cyp26b1 and cyp26c1 - it creates retinoic-acid-depleted territories that position the
  hindbrain/spinal-cord boundary, the pancreatic field, anterior versus posterior kidney progenitors,
  and the balance between cardiac and vascular progenitors in the anterior lateral plate mesoderm.
