- id: file:DANRE/cyp26a1/cyp26a1-deep-research-falcon.md
  title: Falcon deep research on zebrafish cyp26a1 (Edison Scientific Literature)
  findings:
  - statement: Zebrafish Cyp26a1 oxidizes all-trans retinoic acid in microsome assays to 4-OH-RA and 4-oxo-RA, the canonical CYP26A1 reaction products.
    reference_section_type: RESULTS
    supporting_text: 'Zebrafish Cyp26a1 catalyzes oxidative metabolism of atRA, generating metabolites dominated by **4-hydroxy-RA (4-OH-RA)** and **4-oxo-RA (4-oxo-RA)** in microsome assays from transfected cells

      '
  - statement: 4-hydroxylation is the primary transformation for CYP26A1, with additional products including 18-hydroxy-RA and more polar secondary metabolites.
    reference_section_type: RESULTS
    supporting_text: 'Reviews of CYP26A1 metabolism emphasize **4-hydroxylation as the primary transformation** for CYP26A1 (and CYP26B1), with additional products such as **18-hydroxy-RA** and more polar secondary metabolites

      '
  - statement: Zebrafish CYP26 enzymes act on retinoic acid isomers but do not metabolize retinol or retinal, indicating specialization for retinoic acid rather than upstream retinoids.
    reference_section_type: RESULTS
    supporting_text: 'Cell/microsome assays of zebrafish CYP26 family members show activity toward **RA isomers** (atRA, 9-cis RA, 13-cis RA) and **no detectable metabolism of retinol or retinal** under the tested conditions, supporting specialization for RA

      '
  - statement: Cyp26a1 is a membrane-anchored microsomal (ER) cytochrome P450 with a heme center, requiring electrons from NADPH via cytochrome P450 oxidoreductase (POR).
    reference_section_type: RESULTS
    supporting_text: 'CYP26 enzymes are described as **membrane-anchored microsomal (endoplasmic reticulum, ER) cytochrome P450s** with a heme center and class II P450 electron-transfer architecture: each catalytic cycle requires electrons supplied from **NADPH via cytochrome P450 oxidoreductase (POR)**, which uses **FAD and FMN** cofactors

      '
  - statement: CYP26 enzymes are high-efficiency retinoic-acid clearance enzymes (reported Km < 100 nM in transfected-cell systems) that control RA homeostasis.
    reference_section_type: DISCUSSION
    supporting_text: 'A review summarizing CYP26 biochemical studies reports **high catalytic activity** for atRA, including **Km < 100 nM** (in COS-1 transfected cell systems) and **turnover ~1–10 pmol/min/pmol**

      '
  - statement: cyp26a1 and its paralogs cyp26b1/cyp26c1 act redundantly to shape the retinoic-acid response pattern needed for zebrafish hindbrain development; their depletion expands RA-responsive gene expression across the hindbrain.
    reference_section_type: RESULTS
    supporting_text: 'Hernandez et al. (2007; published Jan 2007; https://doi.org/10.1242/dev.02706) demonstrate that zebrafish orthologs of mammalian CYP26 genes (**cyp26a1, cyp26b1, cyp26c1**) act **redundantly** to shape the RA response pattern necessary for hindbrain development

      '
  - statement: cyp26a1 expression in anterior neural ectoderm, forebrain, midbrain, anterior hindbrain, and tailbud establishes anterior RA-depleted domains opposing posterior aldh1a2/raldh2-driven RA synthesis.
    reference_section_type: RESULTS
    supporting_text: 'cyp26a1 is expressed early in presumptive anterior neural ectoderm, and later in forebrain, midbrain, anterior hindbrain, and tailbud territories, contributing to establishment of anterior RA-depleted domains opposing posterior RA synthesis and shaping the rostrocaudal RA signaling landscape

      '
  - statement: cyp26a1 is under complex RA- and Fgf-driven feedback/feedforward control, conferring robustness of the embryonic RA gradient.
    reference_section_type: RESULTS
    supporting_text: 'cyp26a1 is under complex feedback and feedforward control by RA and Fgf signaling

      '
  - statement: Overexpression of cyp26a1 mRNA reduces endogenous RA activity and produces reduced-RA phenotypes, confirming a functional role in RA clearance.
    reference_section_type: RESULTS
    supporting_text: 'microinjection of cyp26a1 mRNA reduces endogenous RA activity and yields phenotypes resembling reduced-RA conditions, consistent with a role in RA clearance

      '
  - statement: The primary molecular function of zebrafish Cyp26a1 is as an ER/microsomal cytochrome P450 that hydroxylates/oxidizes retinoic acid, reducing RA signaling capacity.
    reference_section_type: CONCLUSIONS
    supporting_text: 'ER/microsomal cytochrome P450 enzyme that **hydroxylates/oxidizes retinoic acid**, producing **4-OH-RA and 4-oxo-RA** (major products), thereby reducing RA signaling capacity

      '
core_functions:
- description: ER-membrane cytochrome P450 that hydroxylates all-trans retinoic acid at C-4, yielding all-trans-(4S)-hydroxyretinoate and thence 4-oxo-retinoic acid; this commits retinoic acid to catabolism and thereby lowers the ligand concentration available to retinoic-acid receptors. The enzyme is selective for the all-trans isomer and is itself transcriptionally induced by retinoic acid, making it the effector arm of retinoid negative feedback.
