- term:
    id: GO:0048387
    label: negative regulation of retinoic acid receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:27406002
  qualifier: involved_in
  review:
    summary: "NEW (proposed). Cyp26a1 reduces retinoic-acid receptor pathway output by catalytically destroying the pathway's ligand. In zebrafish this is shown directly: cyp26a1 knockdown and pan-Cyp26 inhibition both show Cyp26a1 is required in the posterior lateral mesoderm to restrict the anteriorising effects of retinoic acid, with posterior kidney progenitors described as protected from RA by Cyp26a1 [PMID:27406002], and re-supplying cyp26a1 mRNA rescues retinoic-acid-excess phenotypes [PMID:27893754]."
    action: NEW
    reason: 'Proposed after both tests in the curation guidance. Participation: the gene product itself performs the step that lowers pathway activity - it hydroxylates all-trans retinoic acid at C-4, converting the receptor ligand into polar products that no longer signal. This is catalysis by Cyp26a1, not a downstream phenotype and not mere necessity. Comparator check: the term is carried by the gene products standing in exactly this role, including human CYP26A1, CYP26B1 and CYP26C1, mouse Cyp26b1 and the retinoic-acid-reducing enzyme Dhrs3, and in zebrafish by the paralog cyp26b1 - so here the comparator class systematically does carry the term and zebrafish cyp26a1 is the anomalous absence, the opposite of the pattern that should block a NEW. It is not an ancestor or descendant of GO:0048384, which the gene already holds and which is retained: that row records participation in the pathway, whereas this one records the direction of the effect. Proposed conservatively as IMP from the kidney-patterning study, whose morpholino and independent chemical-inhibitor evidence directly demonstrates restriction of retinoic-acid signalling.'
    supported_by:
    - reference_id: PMID:27406002
      supporting_text: We conclude from these observations that Cyp26a1 is needed in the PLM during gastrulation to restrict the anteriorizing effects of RA.
    - reference_id: PMID:27406002
      supporting_text: posterior kidney progenitors are protected ventrally by the RA-catabolizing enzyme Cyp26a1
    - reference_id: PMID:27893754
      supporting_text: Additionally, treatment of Cyp26-deficient embryos with DEAB, an inhibitor of RA synthesis, or co-injection of cyp26a1 mRNA with the cyp26 MOs can restore heart morphology and cardiomyocyte number
    - reference_id: file:DANRE/cyp26a1/cyp26a1-uniprot.txt
      supporting_text: Catalyzes the hydroxylation of carbon hydrogen bonds of atRA primarily at C-4
