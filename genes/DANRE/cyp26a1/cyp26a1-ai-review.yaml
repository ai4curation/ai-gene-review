    label: retinoic acid catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'Asserts that cyp26a1 participates in the breakdown of retinoic acid. Zebrafish Cyp26a1 is the founding member of the CYP26 clade and the first retinoic-acid-catabolising enzyme cloned: expressed in COS-1 cells it converts all-trans RA to 4-OH-RA and 4-oxo-RA [PMID:8939936], so the gene carries direct experimental grounding for the very process the PAINT node asserts.'
    action: ACCEPT
    reason: 'The IBD behind this row places retinoic-acid catabolism on the CYP26 node PTN002386488, and zebrafish cyp26a1 sits squarely inside that clade: the WITH/FROM list is the CYP26A1 orthology group (human O43174, mouse, rat) plus cyp26a1 itself. cyp26a1 appearing among its own sources is expected and is a strength, not circularity - its 1996 enzymatic characterisation is one of the descendant evidences that justified placing the function at that node, and the IBA then adds that the activity is inherited rather than lineage-specific. There is no zebrafish-specific evidence of loss or divergence. Catabolism rather than the broader metabolic term is the right specificity: C-4 hydroxylation is the committed step that routes RA to clearance.'
