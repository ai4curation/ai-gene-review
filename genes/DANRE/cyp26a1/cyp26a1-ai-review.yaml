  review:
    summary: Asserts cyp26a1 acts upstream of or within metabolism of retinal - the C20 aldehyde that retinaldehyde dehydrogenase Aldh1a2 oxidises to retinoic acid. ZFIN made this IMP from the cyp26a1/giraffe mutant alongside GO:0042573 retinoic acid metabolic process from the same paper and evidence code [PMID:17164423]. The mutant's retinoid-dependent patterning is genuinely disturbed, but retinal is one metabolite upstream of the species this enzyme turns over.
    action: MARK_AS_OVER_ANNOTATED
    reason: "Re-adjudicated from a previous REMOVE, which was not defensible. This is an experimental annotation made by a ZFIN curator who read the full text, whereas the cached copy of PMID:17164423 contains only the abstract and introduction - the mutant retinoid measurements cannot be checked from here, and nothing accessible contradicts the observation. A cyp26a1 mutant plainly perturbs embryonic retinoid flux, so REMOVE is the wrong instrument. What the accessible evidence does establish is that the term overreaches by one metabolite. Direct zebrafish enzymology finds CYP26 enzymes metabolise retinoic-acid isomers but cannot metabolise retinol or retinal [PMID:16455818], and UniProt confines the zebrafish reaction to all-trans-retinoate; this paper's own introduction assigns retinal oxidation to a different enzyme, Aldh1a2. A comparator check shows this is an established convention rather than an oversight: GO:0042574 is held across human, mouse and zebrafish essentially only by enzymes and carriers that directly make or consume retinal - the retinol/retinaldehyde dehydrogenases (RDH10, RDH11, RDH13, DHRS4, dhrs9, rdh1, ALDH1A3), the carotenoid cleavage oxygenases BCO1 and BCO2, RPE65 and ABCA4 - and no CYP26 carries it in human or mouse, while in zebrafish cyp26a1 is the only one of the three paralogs with it. The family convention is GO:0042573 retinoic acid metabolic process, which all three zebrafish cyp26 genes carry and which is separately annotated to cyp26a1 from this very paper. No replacement term is proposed for exactly that reason - a MODIFY would duplicate an existing row. Flagged as over-annotation so the retinoic-acid-specific terms carry the claim."
