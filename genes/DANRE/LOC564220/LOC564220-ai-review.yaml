core_functions:
- description: Cytoplasmic PDZ/WW scaffold at cell-cell junctions. In endothelial cells it acts, with its paralog, as an adaptor
    for the C-terminal ETTV motif of the Wnt7 co-receptor Gpr124 during brain angiogenesis. Inferred from crispant epistasis
    and family biochemistry.
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005911
    label: cell-cell junction
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id005
  - *id007
  - reference_id: PMID:35649360
    supporting_text: dlg4b, magi3a, and magi3b transcripts could readily be amplified, while dlg4a transcripts were not (Figure
      S2B).
suggested_questions:
- question: Do stable magi3b mutants (ideally RNA-less, to avoid transcriptional adaptation of wu:fi36a10) reproduce the brain
    vascularization defect seen in F0 crispants?
- question: Does Magi3b bind the Gpr124 ETTV motif directly, as shown for Magi3a by yeast two-hybrid?
- question: Is the kidney cilia phenotype of the magi3 morphant reproduced by a magi3b mutant, and which paralog did the morpholino
    actually target?
suggested_experiments:
- hypothesis: magi3b and wu:fi36a10 are both required, non-redundantly and dose-dependently, for Gpr124-dependent brain angiogenesis.
  description: Generate stable single, double and compound-heterozygous mutants and count hindbrain central arteries; test
    cross-rescue by endothelial (kdrl promoter) expression of each coding sequence.
  experiment_type: genetic interaction and cross-rescue
- hypothesis: The restricted expression of magi3b relative to wu:fi36a10 reflects expression partition, not reduced function.
  description: Single-cell or FACS-sorted RNA-seq and in situ hybridization for both paralogs in endothelium, retina and kidney,
    compared with gar magi3.
  experiment_type: expression profiling
