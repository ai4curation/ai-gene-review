taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'magi3b (NCBI LOC564220 in older builds; ZFIN ZDB-GENE-060503-301, chromosome 6) is one of two zebrafish co-orthologs
  of vertebrate MAGI3; PANTHER places the duplication at the teleost genome duplication. Its paralog is wu:fi36a10 (magi3a
  in NCBI RefSeq). It encodes a cytoplasmic membrane-associated guanylate kinase with inverted domain order (MAGI): an N-terminal
  PDZ domain, a guanylate kinase-like (GK) domain that lacks the nucleotide-binding P-loop and is therefore a protein-interaction
  module rather than an enzyme, two WW domains, five further PDZ domains and a long disordered C-terminal tail. MAGI proteins
  act as scaffolds at the cytoplasmic face of cell-cell junctions, where their PDZ domains bind C-terminal motifs of receptors
  and signalling proteins. In zebrafish, magi3b is expressed in endothelial cells, and F0 crispants for magi3b, like those
  for wu:fi36a10, have reduced brain vascularization that phenocopies loss of the C-terminal ETTV PDZ-binding motif of the
  Wnt7 co-receptor Gpr124. A morpholino screen reported shorter kidney motile cilia after knockdown of a magi3 gene attributed
  to this locus. Public RNA-Seq calls are most prominent in retina, early embryo and ovary, and are narrower than those of
  wu:fi36a10.'
