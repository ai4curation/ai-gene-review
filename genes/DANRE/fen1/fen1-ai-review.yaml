  evidence_type: IMP
  original_reference_id: PMID:15716491
  review:
    summary: |-
      The term claims fen1 acts in retina development. ZFIN annotated this from the Hopkins-lab retroviral insertional mutant collection (genotype ZDB-GENO-040831-3): the visual-system screen of Gross et al. 2005 classified 40 insertional mutants by eye histology at 5 dpf, and the fen1 insertion falls among the loci with growth/central-retinal defects. The cached record is abstract-only and the abstract does not name fen1 individually; the ZFIN curator had the full text.
    action: KEEP_AS_NON_CORE
    reason: |-
      This is a genuine zebrafish IMP and should not be removed. On the participation test, however, FEN1 does no retina-specific work: it is a ubiquitous Okazaki-fragment/LP-BER nuclease, and a small, disorganised retina in a null embryo is the expected downstream consequence of failed DNA replication in one of the most proliferative larval tissues (Fen1-null mouse blastocysts arrest in S phase, PMID:12861020). The same collection lists fen1 among 315 genes essential for early development generally (PMID:15256591), showing the defect is not eye-restricted. Kept as a non-core, phenotype-level annotation.
    supported_by:
