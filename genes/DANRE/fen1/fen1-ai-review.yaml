suggested_experiments:
- experiment_type: Biochemical characterization
  description: Direct biochemical characterization of zebrafish FEN1 nuclease activities (endonuclease and exonuclease) to confirm that the zebrafish protein retains the same catalytic properties as mammalian FEN1. Currently all molecular function annotations are transferred by homology (IBA/IEA) with no direct experimental evidence on the zebrafish protein.
- experiment_type: Expression analysis
  description: Spatiotemporal expression analysis of fen1 during zebrafish retinal development to understand why the retina is particularly sensitive to fen1 loss-of-function, given that fen1 is expected to be ubiquitously required for DNA replication.
