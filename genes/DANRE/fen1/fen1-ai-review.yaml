- id: file:DANRE/fen1/fen1-deep-research-falcon.md
  title: Falcon deep research report on fen1 (Danio rerio)
  findings:
  - statement: 'FEN1 is a structure-specific nuclease that recognizes 5''-flap and nicked DNA structures

      and hydrolyzes phosphodiester bonds using a two-metal (Mg2+) catalytic center, with at

      least three distinguishable nuclease activities (flap endonuclease, 5'' exonuclease, gap

      endonuclease) primarily acting in lagging-strand replication and repair synthesis.

      '
    reference_section_type: RESULTS
    supporting_text: 'three biochemically distinguishable nuclease activities described in the literature: **flap endonuclease (FEN)**, **5′ exonuclease (EXO)**, and **gap endonuclease (GEN)**'
  - statement: 'During Okazaki fragment maturation FEN1 is coordinated on chromatin by PCNA in a toolbelt

      mechanism; 2024 cryo-EM of endogenous PCNA-FEN1 and PCNA-FEN1-RNaseH2 complexes captured

      multiple primer-removal states, with PCNA stimulating FEN1 activity roughly 10-50 fold.

      '
    reference_section_type: RESULTS
    supporting_text: cryo-EM structural resolution of endogenous **PCNA–FEN1** and **PCNA–FEN1–RNaseH2** complexes, capturing multiple primer-removal states
  - statement: 'FEN1 also functions in long-patch base excision repair as the core 5''-flap nuclease and,

      in recent work, is recruited to DNA-protein crosslinks via PARP1/PARG-dependent

      ADP-ribosylation and forms XPA-FEN1-DNA ternary complexes implicating roles beyond

      canonical BER/replication.

      '
    reference_section_type: RESULTS
    supporting_text: describes FEN1 recruitment to DNA–protein crosslinks (DPCs) as regulated by **PARP1/PARG-dependent ADP-ribosylation**
  - statement: 'Direct zebrafish loss-of-function genetics for fen1 were not retrieved; the strongest

      zebrafish-specific evidence is transcript-level induction of fen1 among base excision

      repair genes under oxidative/DNA-damaging chemical stress in larvae.

      '
    reference_section_type: RESULTS
    supporting_text: providing zebrafish-specific assay details including a **fen1 primer** (forward sequence shown in the paper), **amplicon length (138 bp)**, and **PCR efficiency (100%)**
  - statement: 'FEN1''s flap-structure recognition has been engineered into a structure-guided endonuclease

      (SGN) fused to FokI that cleaves reporter and endogenous loci in zebrafish embryos,

      demonstrating translational use of FEN1 biochemistry in this vertebrate model.

      '
    reference_section_type: RESULTS
    supporting_text: engineered a **structure-guided endonuclease (SGN)** composed of **FEN-1** (structure recognition of a flap) fused to the FokI cleavage domain, and demonstrated cleavage of reporter and endogenous loci in **zebrafish embryos**
