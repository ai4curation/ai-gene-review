  title: Proliferation failure and gamma radiation sensitivity of Fen1 null mutant mice at the blastocyst stage.
  findings:
  - statement: Fen1 knockout in mice causes embryonic lethality at the blastocyst stage with S phase arrest, demonstrating essentiality for DNA replication.
    supporting_text: complete depletion of FEN1 causes early embryonic lethality
