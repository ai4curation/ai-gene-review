id: Q6TNU4
gene_symbol: fen1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Flap endonuclease 1 (FEN-1) is a structure-specific nuclease in the XPG/RAD2 family with dual 5'-flap endonuclease and 5'-3' exonuclease activities. It is essential for Okazaki fragment maturation during lagging-strand DNA replication (cleaving displaced 5'-flaps to produce ligatable nicks) and for long-patch base excision repair (trimming flaps generated by strand displacement synthesis). FEN1 also exhibits RNase H activity on RNA-DNA hybrids, contributing to RNA primer removal. The enzyme requires two magnesium ions for catalysis and interacts with PCNA to coordinate its activity at replication forks and repair sites. FEN1 localizes to the nucleolus (for rDNA maintenance), the nucleoplasm (upon DNA damage), and mitochondria (for mtDNA repair). In zebrafish, fen1 is essential for early development, and insertional mutants display severe retinal defects with reduced and disorganized retinal neurons, reflecting the high proliferative demand of retinal progenitor cells.
