- id: PMID:23451868
  title: Flap endonuclease 1.
  findings:
  - statement: Comprehensive review of FEN1 as a structure-specific endonuclease central to DNA replication (Okazaki fragment maturation) and repair (long-patch BER, telomere maintenance, stalled fork rescue).
    supporting_text: First discovered as a structure-specific endonuclease that evolved to cut at the base of single-stranded flaps, flap endonuclease (FEN1) is now recognized as a central component of cellular DNA metabolism
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches cache (Balakrishnan & Bambara 2013 Annu Rev Biochem); full text cached. Authoritative review of FEN1 mechanism, substrates and roles in Okazaki fragment maturation and LP-BER; used for the core activity and process rows.
- id: PMID:15189154
  title: 'Flap endonuclease 1: a central component of DNA metabolism.'
  findings:
  - statement: FEN1 is essential for DNA replication and repair with roles in Okazaki fragment processing and long-patch base excision repair.
    supporting_text: in long-patch base excision repair, a damaged nucleotide is displaced into a flap and removed by FEN1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches cache (Shen et al. 2005 BioEssays); abstract-only. Supports the LP-BER flap-removal role and the genome-stabilisation framing.
- id: PMID:18443037
  title: Nucleolar localization and dynamic roles of flap endonuclease 1 in ribosomal DNA replication and damage repair.
  findings:
  - statement: FEN1 super-accumulates in the nucleolus for rDNA maintenance and relocalizes to nucleoplasm upon DNA damage via phosphorylation.
    supporting_text: FEN1 is superaccumulated in the nucleolus and plays a role in the resolution of stalled DNA replication forks formed at the sites of natural replication fork barriers
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches cache (Guo et al. 2008 MCB); abstract-only. Human-cell study establishing nucleolar accumulation and damage-induced relocalization to the nucleoplasm; used for the localization rows by orthology.
- id: PMID:19699691
  title: Evidence for a role of FEN1 in maintaining mitochondrial DNA integrity.
  findings:
  - statement: FEN1/Rad27 localizes to mitochondria in both yeast and mammals, playing a significant role in mtDNA replication and repair.
    supporting_text: Rad27p/FEN1 is localized in the mitochondrial compartment of both yeast and mice and that Rad27p has a significant role in maintaining mtDNA integrity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches cache (Zheng et al. 2008 DNA Repair); abstract-only. Yeast and mouse evidence for mitochondrial localization and mtDNA maintenance; basis of the HAMAP mitochondrion transfer.
- id: PMID:18697748
  title: Three metal ions participate in the reaction catalyzed by T5 flap endonuclease.
  findings:
  - statement: FEN-catalyzed reactions require at least two divalent metal ions for phosphodiester hydrolysis, with a third ion binding after substrate engagement.
    supporting_text: the T5FEN-catalyzed reaction requires at least three magnesium ions, implying that an additional metal ion is bound
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Title matches cache (Syson et al. 2008 JBC); abstract-only. Bacteriophage T5 FEN metal-ion study; used only as mechanistic background for the Mg2+/Mn2+ cofactor rows, not as evidence about the zebrafish enzyme.
