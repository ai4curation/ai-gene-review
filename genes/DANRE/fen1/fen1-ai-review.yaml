    summary: The term claims fen1 takes part in DNA recombination. The IBA is placed at the deep XPG/RAD2-family node PTN008960732, whose experimental donors are mostly EXO1 (human Q9UQ84, mouse MGI:1349427, yeast EXO1 SGD:S000005559) and GEN1 (Q17RS7) - nucleases with well-established roles in resection and Holliday-junction resolution. However the FEN1 lineage is represented among the donors by yeast RAD27 (SGD:S000001596), whose deletion causes recombination-related phenotypes and which processes flap intermediates in recombination pathways, so the function is not absent from the FEN1 clade. Human FEN1 additionally carries a Reactome-derived TAS for double-strand break repair via homologous recombination (GO:0000724).
    action: KEEP_AS_NON_CORE
    reason: fen1 is inside the clade the PAINT curator judged to have inherited a recombination role, and the FEN1 branch itself has experimental grounding (RAD27), so there is no basis to challenge the node placement. But the recombination role is a minor use of the same flap/nick nuclease activity whose primary evolved context is Okazaki fragment maturation and LP-BER; the cached literature for FEN1 foregrounds replication and repair and mentions recombination only in passing. Kept as non-core rather than accepted as a defining function.
    supported_by:
    - reference_id: PMID:23451868
      supporting_text: Substrate specificity allows FEN1 to process intermediates of Okazaki fragment maturation, long-patch base excision repair, telomere maintenance, and stalled replication fork rescue
    - reference_id: PMID:23451868
      supporting_text: The absence of the cap in some nucleases possibly allows them to access DNA bubbles and recombination intermediates
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN008960732
        source_status: SUPPORTS_TRANSFER
        comment: Deep XPG/RAD2 node covering FEN1, EXO1 and GEN1 subfamilies; recombination role placed here by PAINT.
      - source_id: SGD:S000001596
        source_label: RAD27
        source_status: SUPPORTS_TRANSFER
        comment: Yeast FEN1 ortholog; shows the function is retained in the FEN1 branch, not only in EXO1/GEN1.
      - source_id: UniProtKB:Q9UQ84
        source_label: EXO1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Resection nuclease; its recombination role is subfamily-specific and does not by itself transfer to FEN1.
