  review:
    summary: Pectoral fin development (IMP, tbx5b morpholino).
    action: ACCEPT
    reason: >-
      tbx5b is needed for normal pectoral fin outgrowth and shape, but not for fin bud initiation (which needs tbx5a).
      tbx5b morphants have small, delayed fins, and fin-field cells fail to migrate medio-laterally (PMID:24759614,
      PMID:34756968). A tbx5b frameshift mutant reproduces the fin defect (PMID:30532148). Whether tbx5b is expressed
      in the fin at all is disputed (not detected in PMID:19925885; low levels in PMID:23441045), so this role may
      be partly non-cell-autonomous. This asymmetry in fin roles is copy-specific and should be kept.
    supported_by:
    - reference_id: PMID:23441045
      supporting_text: >-
        Using morpholino depletion studies, we find that tbx5b is required in the heart for embryonic survival,
        and influences the timing and morphogenesis of pectoral fin development.
    - reference_id: PMID:30532148
      supporting_text: Tbx5b-/- mutants also exhibit similar fin defects to the Tbx5b morphants.
