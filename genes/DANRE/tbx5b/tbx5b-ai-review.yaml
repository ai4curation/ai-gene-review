  review:
    summary: Active in chromatin (IBA).
    action: ACCEPT
    reason: >-
      Expected of a T-box transcription factor; inherited from the Tbx2/3/4/5 node. tbx5b keeps a T-box domain (UniProt
      57-237) that is 83% identical to the tbx5a T-box (PMID:39079985), and the IBA node covers the Tbx2/3/4/5 subfamily.
      No direct DNA-binding or reporter assay has been published for Tbx5b. But tbx5b mRNA rescues its own morphant
      (PMID:24759614), and an intronic frameshift allele that truncates the protein before the T-box phenocopies
      the morphant (PMID:30532148). Together these point to a functional T-box transcription factor. The UniProt
      caution that some PROSITE T-box residues are not conserved is noted, but there is no evidence of lost DNA
      binding. Kept consistent with tbx5a.
    supported_by:
    - reference_id: PMID:39079985
      supporting_text: >-
        The T-box domain of Tbx5b shares only 83% sequence identity with its Tbx5a counterpart
