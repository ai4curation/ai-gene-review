id: E3W6T6
gene_symbol: tbx5b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  T-box transcription factor 5b, the second zebrafish co-ortholog of human TBX5. It was retained from the teleost
  genome duplication and is paralogous to tbx5a (heartstrings). It has a T-box DNA-binding domain about 83% identical
  to that of tbx5a, while the rest of the protein, including a shorter C-terminal region (422 aa), is poorly conserved.
  It is expressed in the heart field and heart, becoming restricted to the ventricle from about 36 hpf, and in the
  dorsal retina. Expression starts later and is lower than tbx5a, and expression in the pectoral fin bud is weak
  or undetected. tbx5b is required in the heart: morphants and a frameshift mutant fail to complete cardiac looping,
  develop cardiac edema and die by about 6 dpf. It is also required for timely pectoral fin outgrowth and the medio-lateral
  migration of fin-field cells, but not for fin bud initiation, which depends on tbx5a. With tbx5a it contributes
  to dorsoventral patterning of the retina. Its roles are not interchangeable with those of tbx5a: tbx5a mRNA does
  not rescue tbx5b loss, and the reverse also fails.
