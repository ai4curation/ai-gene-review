  review:
    summary: Heart looping (IGI, tbx5a + tbx5b double morphants).
    action: ACCEPT
    reason: >-
      tbx5b morphants fail to complete looping, and sub-threshold double knockdown also blocks looping (PMID:24759614).
      The tbx5b CRISPR mutant confirms it: the heart fails to loop (PMID:30532148). Shared with tbx5a and non-redundant,
      since each single loss is enough.
    supported_by:
    - reference_id: PMID:24759614
      supporting_text: >-
        Similarly, injection of tbx5b MO also caused heart looping defects (81%, n = 108), and these embryos displayed
        D-looped (52%), L-looped (16%) and no-looped (34%) cardiac morphologies
    - reference_id: PMID:24759614
      supporting_text: >-
        Although, in agreement with a previous report [17], the severity of the phenotype was not enhanced by double
        knock-down, downregulation of both genes increased the penetrance of the phenotype (figure 1i).
    - reference_id: PMID:30532148
      supporting_text: >-
        The heart fails to loop and a fluid filled edema forms surrounding the heart (Fig 1E and 1F).
