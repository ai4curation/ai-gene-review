- term:
    id: GO:0003218
    label: cardiac left ventricle formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:102541
  - PANTHER:PTN002601200
  - UniProtKB:Q9PWE8
  review:
    summary: Cardiac left ventricle formation (IBA).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Inherited from the Tbx5 clade node, which rests on mammalian left-ventricle data. Zebrafish has a single ventricle.
      tbx5b is expressed in the ventricle from 36 hpf (PMID:30532148) and is needed for looping, but "left ventricle
      formation" does not apply to a teleost heart. The same action is taken for tbx5a.
    supported_by:
    - reference_id: PMID:30532148
      supporting_text: >-
        Expression in the heart is similar for both paralogues until 36 hpf, when tbx5b expression is restricted
        to the ventricle, whereas tbx5a expression remains in both chambers of the heart [9].
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002601200
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The Tbx5-clade node is sound for amniote hearts, which have a left ventricle; teleost hearts have a single
          ventricle, so the left-ventricle-specific term does not apply to the zebrafish descendants.
      - source_id: MGI:MGI:102541
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mouse experimental evidence for left ventricle formation; the anatomy is absent in zebrafish.
