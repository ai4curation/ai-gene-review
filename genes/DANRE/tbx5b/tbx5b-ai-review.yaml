suggested_questions:
- question: >-
    Is tbx5b expressed in pectoral fin-field cells at all? If not, does it act on fin-field migration non-cell-autonomously,
    for example from the adjacent heart field or somites?
- question: >-
    Is the failure of tbx5a mRNA to rescue tbx5b morphants due to protein divergence (the C-terminal region, T-box
    substitutions) or to dose, timing and ubiquitous expression of injected mRNA?
- question: >-
    Does the tbx5b frameshift allele (intron-1 insertion, PTC) trigger nonsense-mediated decay and upregulation
    of tbx5a?
suggested_experiments:
- hypothesis: Tbx5b has diverged at the protein level from Tbx5a.
  description: >-
    Compare DNA-binding specificity (SELEX or CUT&RUN) and transactivation of Tbx5a and Tbx5b on the same T-box
    reporters, and swap the coding sequences between the loci by knock-in.
  experiment_type: biochemical comparison and coding-sequence swap
- hypothesis: tbx5b is required for heart jogging.
  description: >-
    Score jogging (myl7, 26 hpf) in tbx5b mutants and in a promoter-less tbx5b allele, with measurement of tbx5a
    transcript levels.
  experiment_type: mutant phenotyping
