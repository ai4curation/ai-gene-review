  review:
    summary: Asserts that zebrafish Cyp51 itself catalyses removal of the sterol 14alpha-methyl group.
      Morrison et al. expressed the zebrafish protein in E. coli, reconstituted it with NADPH-dependent
      electron transfer, and measured conversion of lanosterol to the 14alpha-demethylated product FF-MAS
      by GC-MS at 3.20 nmol/min/nmol P450, with no activity from empty-vector membranes.
    action: ACCEPT
    reason: 'This is direct biochemical evidence on the zebrafish protein itself, not a transfer: the
      recombinant enzyme gave a substrate-induced Type I spin shift with lanosterol and produced the demethylated
      sterol in a NADPH-dependent, ketoconazole-sensitive, cyanide-insensitive reaction [PMID:24361620].
      The measured chemistry (three sequential oxidations releasing formate) is exactly what GO:0008398
      defines, so the term is both correct and at the right level of specificity; it is the core molecular
      function of this gene.'
