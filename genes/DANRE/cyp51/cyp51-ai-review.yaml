      sterols such as FF-MAS.
    reference_section_type: RESULTS
  - statement: 'Direct zebrafish subcellular localization was not retrieved, but CYP51 is a membrane-bound

      P450 and the most consistent functional localization for zebrafish CYP51 is inferred to be

      the endoplasmic reticulum membrane.

      '
    supporting_text: the most consistent functional localization for zebrafish CYP51 is the **endoplasmic
