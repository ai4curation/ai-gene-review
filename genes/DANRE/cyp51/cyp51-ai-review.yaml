suggested_questions:
- question: Where does zebrafish Cyp51 actually reside in vivo? The endoplasmic reticulum membrane assignment
    is inherited from mammalian orthologs and a predicted single-pass helix; no zebrafish fractionation
    or imaging has been reported.
  experts: []
- question: Is cyp51 required for zebrafish development, and can the requirement be separated from maternal
    or dietary cholesterol? Triazole exposure causes skeletal and lipid phenotypes, but no genetic loss-of-function
    allele has been characterized.
  experts: []
- question: Does the FF-MAS produced by zebrafish Cyp51 have a signalling role in gonad development, as
    meiosis-activating sterols do in mammals, given that the transcript is detectable in ovary and testis?
  experts: []
suggested_experiments:
- hypothesis: Zebrafish Cyp51 is an integral endoplasmic reticulum membrane protein.
  description: Express a C-terminally tagged cyp51 in zebrafish embryos or a zebrafish cell line and score
    colocalization with an ER marker (e.g. calnexin/KDEL), with subcellular fractionation and carbonate
    extraction to confirm integral membrane association of the endogenous protein.
  experiment_type: fluorescence microscopy and subcellular fractionation
- hypothesis: Loss of cyp51 blocks de novo cholesterol synthesis in zebrafish and produces a sterol-intermediate
    accumulation phenotype.
  description: Generate a cyp51 null allele by CRISPR/Cas9 and profile whole-larva sterols by GC-MS, testing
    for accumulation of lanosterol and depletion of downstream sterols, and for rescue by exogenous cholesterol;
    compare the phenotype with that of larvae exposed to ketoconazole at concentrations that inhibit the
    recombinant enzyme.
  experiment_type: CRISPR knockout with sterol profiling
