core_functions:
- description: 'Endoplasmic reticulum membrane sterol 14-alpha-demethylase: the P450 monooxygenase that
    performs the three-step oxidative removal of the 14-alpha-methyl group from lanosterol and 24,25-dihydrolanosterol,
    the first committed step of the lanosterol-to-zymosterol segment of cholesterol biosynthesis.'
  molecular_function:
