  title: Falcon deep research report on zebrafish cyp51 (Q1JPY5)
  findings:
  - statement: 'Zebrafish cyp51 encodes lanosterol 14alpha-demethylase, a cytochrome P450 that

      catalyzes the obligatory C14alpha-demethylation step of sterol biosynthesis via

      three sequential monooxygenation reactions followed by elimination of formic acid

      and formation of a Delta14,15 double bond.

      '
    supporting_text: CYP51 catalyzes the **obligatory C14α-demethylation** step of eukaryotic sterol biosynthesis.
      Mechanistically, CYP51 carries out **three sequential monooxygenation reactions** at the C14α-methyl
      group (methyl → hydroxymethyl → carboxyaldehyde), followed by **elimination of formic acid** and
      formation of a **Δ14,15 double bond** in the sterol nucleus.
    reference_section_type: RESULTS
  - statement: 'In zebrafish recombinant assays the enzyme uses lanosterol as substrate and produces

      the 14alpha-demethylated sterol FF-MAS (4,4-dimethyl-5alpha-cholesta-8,14,24-triene-3beta-ol),

      confirmed by GC-MS.

      '
    supporting_text: In zebrafish recombinant assays, CYP51 uses **lanosterol** as substrate and produces
      the 14α-demethylated sterol **FF‑MAS (follicular fluid meiosis-activating sterol)**, chemically
      identified as **4,4-dimethyl-5α-cholesta-8,14,24-triene-3β-ol**, by GC–MS.
    reference_section_type: RESULTS
  - statement: 'Direct zebrafish biochemical evidence: Morrison et al. expressed zebrafish CYP51 in

      E. coli, reconstituted NADPH-dependent activity, and verified the FF-MAS product by

      GC-MS, supporting annotation of zebrafish cyp51 as lanosterol 14alpha-demethylase.

      '
    supporting_text: Morrison et al. expressed zebrafish CYP51 in *E. coli* (including an N-terminally
      truncated construct to improve expression and activity) and reconstituted activity with NADPH-dependent
      electron transfer components. In this system, zebrafish CYP51 catalyzed lanosterol demethylation
      with GC–MS verification of the FF‑MAS product.
    reference_section_type: RESULTS
  - statement: 'CYP51 functions in the sterol/cholesterol biosynthetic pathway downstream of lanosterol

      formation; in vertebrates this pathway contributes to cholesterol synthesis and also

      generates meiosis-activating sterols such as FF-MAS.

      '
    supporting_text: CYP51 functions in the sterol/cholesterol biosynthetic pathway downstream of lanosterol
