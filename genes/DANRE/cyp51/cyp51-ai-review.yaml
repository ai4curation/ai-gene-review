  evidence_type: IDA
  original_reference_id: PMID:23947337
  review:
    summary: Response to yeast, from a Candida albicans-zebrafish study. The evidence for cyp51 there
      is that it falls in an inferred host-pathogen interaction subnetwork and that its transcript is
      repressed over the infection time course - not an assay of Cyp51 protein activity in an antifungal
      response.
    action: KEEP_AS_NON_CORE
    reason: 'The annotation is not contradicted: cyp51 transcript levels do change during C. albicans
      challenge, and several sterol-pathway genes (Nsdhl, Sc5d, Cyp51) move together, which is a plausible
      consequence of infection remodelling host sterol synthesis [PMID:23947337]. But the gene product
      does no work in the antifungal response; it is a biosynthetic enzyme whose expression responds,
      and the evidence is transcriptional (arguably IEP-shaped) plus network inference. Retained as a
      genuine but peripheral, non-core association rather than removed, per the rule against overruling
      an experimental curator call.'
    supported_by:
    - reference_id: PMID:23947337
