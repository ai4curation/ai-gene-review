gene_symbol: cyp51
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: cyp51 encodes zebrafish lanosterol 14-alpha-demethylase (CYP51, EC 1.14.14.154), a heme-thiolate
  cytochrome P450 anchored in the endoplasmic reticulum membrane by an N-terminal transmembrane helix.
  It catalyses the three sequential oxygen- and NADPH-dependent oxidations that remove the 14-alpha-methyl
  group of lanosterol and 24,25-dihydrolanosterol as formate, yielding FF-MAS and the corresponding dihydro
  product - the committed first step of the conversion of lanosterol to zymosterol in cholesterol biosynthesis.
  Cholesterol made by this route supplies membrane sterol and the precursor pool for steroid hormones,
  and the FF-MAS product is itself a meiosis-activating sterol. The zebrafish transcript is present in
  all organs examined and is highest in intestine, followed by liver (more so in females) and brain. Like
  other CYP51 enzymes it is inhibited by azole antifungals and agricultural triazoles, which ligate the
  heme iron.
