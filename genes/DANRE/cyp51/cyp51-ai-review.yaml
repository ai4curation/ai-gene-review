      helix (residues 13-35).
    action: ACCEPT
    reason: CYP51 is a microsomal enzyme in eukaryotes generally [PMID:24361620], the zebrafish protein
      carries an N-terminal membrane anchor that had to be truncated to obtain good heterologous expression,
      and UniProt asserts ER membrane for this entry. No zebrafish-specific imaging or fractionation has
      been published, so this rests on the UniProt SUBCELLULAR LOCATION line and conserved architecture
      rather than on a direct localization experiment - but it is the compartment in which the demethylase
      step of cholesterol biosynthesis occurs, and there is no competing evidence. Accepted as the core
