gene_symbol: bdh2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'bdh2 encodes the zebrafish ortholog of BDH2/DHRS6, a cytosolic, NAD(H)-dependent
  short-chain dehydrogenase/reductase (SDR) that forms homotetramers and prefers cyclic
  substrates. The vertebrate enzyme is the functional homolog of bacterial EntA and
  catalyzes a rate-limiting NAD+-dependent dehydrogenation in the biosynthesis of
  2,5-dihydroxybenzoate (2,5-DHBA), the iron-binding moiety of the eukaryotic siderophore;
  the iron-siderophore complex supplies iron to mitochondria for heme synthesis and
  Fe-S cluster enzymes. Mammalian BDH2 has also been recharacterized as the 4-oxo-L-proline
  reductase (EC 1.1.1.104), reducing 4-oxo-L-proline to cis-4-hydroxy-L-proline with
  ~12,500-fold higher catalytic efficiency than on (R)-3-hydroxybutyrate, so the original
  3-hydroxybutyrate dehydrogenase activity is weak and physiologically doubtful. In
  zebrafish, bdh2 mRNA is broadly expressed in embryos, and morpholino knockdown produces
  otherwise normal embryos with hypochromic blood, reduced heme (o-dianisidine) staining
  despite normal globin transcription, mitochondrial dysfunction with premature mitophagy,
  and delayed erythroid maturation, all rescued by bdh2 mRNA.'
