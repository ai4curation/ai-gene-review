suggested_questions:
- question: What is the endogenous precursor of 2,5-DHBA in vertebrates, and is the
    physiological Bdh2 reaction the 2,3-dihydro-2,3-dihydroxybenzoate dehydrogenase
    reaction (GO:0008667) assayed in vitro or a distinct 2,5-substituted analog? This
    determines whether the class-level CH-CH oxidoreductase annotation can be made more
    specific.
- question: Has the 4-oxo-L-proline reductase activity of the zebrafish enzyme been measured
    directly, and does zebrafish Bdh2 show the same ~10,000-fold preference for
    4-oxo-L-proline over (R)-3-hydroxybutyrate as the human enzyme?
suggested_experiments:
- description: Express and purify zebrafish Bdh2 and compare kcat/KM on 4-oxo-L-proline,
    2,3-diDHBA and (R)-3-hydroxybutyrate to confirm which activities are conserved and
    which are side activities in the fish enzyme.
- description: Generate a bdh2 CRISPR mutant and test whether 2,5-DHBA supplementation
    rescues heme staining and erythroid maturation, and whether 4-oxo-L-proline or
    cis-4-hydroxy-L-proline levels change in mutant embryos, to separate the siderophore
    and ketoproline functions in vivo.
