  original_reference_id: PMID:26929344
  review:
    summary: ZFIN IMP (morpholino ZDB-MRPHLNO-100624-6) with the acts_upstream_of_or_within
      qualifier. The abstract reports that bdh2 inactivation in zebrafish embryos causes
      heme deficiency and that re-establishing bdh2 restores mitochondrial function and
      erythroid development (PMID:26929344, abstract-only cache). The original knockdown
      paper showed hypochromic blood with reduced o-dianisidine staining but normal hbae1
      and hbae3 globin transcription (PMID:20550936).
    action: KEEP_AS_NON_CORE
    reason: The phenotype is genuine and reproducible (two morpholinos, mRNA rescue), and
      the reduced hemoglobin follows from heme deficiency caused by loss of siderophore-
      mediated mitochondrial iron delivery. Bdh2 itself catalyzes no step of hemoglobin
      assembly, globin synthesis or heme synthesis; it supplies iron upstream, which is
      what the acts_upstream_of_or_within qualifier already encodes. Kept as a non-core,
      upstream contribution rather than a core function.
    supported_by:
    - reference_id: PMID:26929344
      supporting_text: We found that inactivation of bdh2 in developing zebrafish embryo
        results in heme deficiency and delays erythroid maturation.
    - reference_id: PMID:20550936
      supporting_text: Notably, in Bdh2-depleted embryos the globin genes hbae1 and hbae3
        were expressed normally (Figure 7I), indicating that the decreased hemoglobin
        levels are not due to reduced globin gene expression.
  qualifier: acts_upstream_of_or_within
