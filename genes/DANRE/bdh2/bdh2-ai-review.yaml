    summary: Claims NAD+-dependent oxidation of (R)-3-hydroxybutanoate to acetoacetate.
      The PAINT node PTN000673289 is seeded by human BDH2 (Q9BUT1), whose IDA rests on
      Guo et al. 2006, which detected this as the only activity in a substrate screen
      but with a Km of about 10 mM (PMID:16380372). Kwiatkowski et al. 2022 later showed
      that human BDH2 acts on 4-oxo-L-proline with 12,500-fold higher catalytic
      efficiency than on (R)-3-hydroxybutyrate and concluded the ketone body is unlikely
      to be a physiological substrate (PMID:35150746), and bdh2-null mice show no change
      in ketone body metabolism (PMID:24777603). No zebrafish enzymology exists.
