- term:
    id: GO:0042168
    label: heme metabolic process
  evidence_type: IMP
  original_reference_id: PMID:20550936
  review:
    summary: UniProt IMP from the zebrafish morpholino experiments. Siderophore-depleted
      mammalian cells and zebrafish embryos fail to synthesize heme; in cells, BDH2
      knockdown lowers mitochondrial iron and Fe-S enzyme activities while raising
      cytoplasmic iron, and in embryos heme staining is lost with normal globin expression
      and is rescued by bdh2 mRNA (PMID:20550936, full text).
    action: KEEP_AS_NON_CORE
    reason: The heme deficit is robust and mechanistically explained, but the definition
      of heme metabolic process covers reactions involving heme itself, and Bdh2 performs
      none of them. Its contribution is to make the siderophore that delivers iron to
      mitochondria, i.e. it acts upstream of heme synthesis. The direct role is captured
      by siderophore biosynthetic process (core); this term is retained as a non-core
      upstream contribution, consistent with the treatment of the hemoglobin biosynthesis
      rows. The previous ACCEPT is downgraded on the participation test.
    supported_by:
    - reference_id: PMID:20550936
      supporting_text: Siderophore-depleted mammalian cells and zebrafish embryos fail to
        synthesize heme, an iron-dependent mitochondrial process.
    - reference_id: PMID:20550936
      supporting_text: Mammalian cells lacking the siderophore accumulate abnormally high
        amounts of cytoplasmic iron, resulting in elevated levels of reactive oxygen
        species, whereas the mitochondria are iron deficient.
    - reference_id: PMID:20550936
      supporting_text: Injection of a bdh2 mRNA bearing a mutation that prevented
        hybridization with the bdh2 MO rescued the normal pattern of o-dianisidine staining
        in Bdh2-depleted embryos
