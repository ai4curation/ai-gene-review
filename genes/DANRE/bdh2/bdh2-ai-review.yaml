      biochemical demonstration that BDH2 catalyzes the EntA-type NAD+-dependent
      dehydrogenation; it explicitly identifies the zebrafish EntA homolog as NP_001017809.1
      (this gene).
  findings:
  - statement: BDH2 is the vertebrate homolog of bacterial EntA and is the enzyme responsible
      for 2,5-DHBA synthesis.
    supporting_text: find that the murine enzyme responsible for 2,5-DHBA synthesis, BDH2,
      is the homolog of bacterial EntA, which catalyzes 2,3-DHBA production during
      enterobactin biosynthesis
  - statement: Recombinant BDH2 catalyzes NAD+-dependent oxidation of 2,3-diDHBA to
      2,3-DHBA, and the active-site Tyr147Phe mutant does not.
    supporting_text: Significantly, 2,3-DHBA production was also catalyzed by recombinant
      BDH2 but not by a mutant BDH2 derivative (Tyr147 to Phe).
  - statement: Zebrafish bdh2 mRNA is widely expressed in embryos, and splice-blocking
      morpholino knockdown yields morphologically normal embryos with hypochromic blood.
    supporting_text: Notably, however, Bdh2-depleted embryos had hypochromic blood (i.e.,
      lacking red color), suggesting an absence of hemoglobinized erythrocytes.
  - statement: The zebrafish heme phenotype is rescued by MO-resistant bdh2 mRNA and is not
      caused by reduced globin transcription.
    supporting_text: Notably, in Bdh2-depleted embryos the globin genes hbae1 and hbae3
      were expressed normally (Figure 7I), indicating that the decreased hemoglobin levels
      are not due to reduced globin gene expression.
  - statement: Siderophore loss raises cytoplasmic iron and lowers mitochondrial iron,
      impairing heme synthesis.
    supporting_text: Mammalian cells lacking the siderophore accumulate abnormally high
      amounts of cytoplasmic iron, resulting in elevated levels of reactive oxygen species,
      whereas the mitochondria are iron deficient.
- id: PMID:26929344
  title: Inactivation of 3-hydroxybutyrate dehydrogenase 2 delays zebrafish erythroid
    maturation by conferring premature mitophagy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; title matches PubMed. Zebrafish-specific study
      supporting the ZFIN IMP rows for hemoglobin biosynthesis and erythrocyte maturation.
      The abstract states the heme deficiency, delayed erythroid maturation, mitochondrial
      dysfunction with premature mitophagy, and rescue by re-establishing bdh2; details
      (2,5-DHBA rescue, atg7 epistasis) are in the full text, which was not read here.
  findings:
  - statement: Bdh2 catalyzes a rate-limiting step in eukaryotic siderophore biogenesis.
    supporting_text: An evolutionarily conserved 3-hydroxy butyrate dehydrogenase, 3-hydroxy
      butyrate dehydrogenase 2 (Bdh2), catalyzes a rate-limiting step in the biogenesis of
      the eukaryotic siderophore.
  - statement: bdh2 inactivation in zebrafish embryos causes heme deficiency and delays
      erythroid maturation.
    supporting_text: We found that inactivation of bdh2 in developing zebrafish embryo
      results in heme deficiency and delays erythroid maturation.
  - statement: The erythroid maturation defect results from mitochondrial dysfunction and
      premature mitophagy, and is reversed by re-establishing bdh2.
    supporting_text: Reestablishment of bdh2 restores mitochondrial function, prevents
      premature mitochondrial degradation, promotes erythroid development, and reverses
      altered gene expression.
- id: PMID:35150746
  title: Recharacterization of the mammalian cytosolic type 2 (R)-β-hydroxybutyrate
    dehydrogenase as 4-oxo-l-proline reductase (EC 1.1.1.104).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read; title matches PubMed. Source of the EC 1.1.1.104
      assignment (rat and human BDH2), of the kinetic comparison showing (R)-3-hydroxybutyrate
      is not a physiological substrate, and of the cellular BDH2 KO evidence. Mammalian
      orthologs only; no zebrafish enzymology.
  findings:
  - statement: Rat kidney 4-oxo-L-proline reductase was purified and identified as BDH2;
      recombinant rat and human BDH2 reduce 4-oxo-L-proline to cis-4-hydroxy-L-proline.
    supporting_text: We subsequently expressed rat and human BDH2 in Escherichia coli, then
      purified it, and showed that it catalyzed the reversible reduction of 4-oxo-l-proline
      to cis-4-hydroxy-l-proline via chromatographic and tandem mass spectrometry analysis.
  - statement: 4-oxo-L-proline is the best substrate; catalytic efficiency on it is
      12,500-fold higher than on (R)-3-hydroxybutyrate.
    supporting_text: the human enzyme acted with 12,500-fold higher catalytic efficiency on
      4-oxo-l-proline than on (R)-β-hydroxybutyrate
  - statement: BDH2 knockout HEK293T cells cannot produce cis-4-hydroxy-L-proline from
      4-oxo-L-proline.
    supporting_text: HEK293T BDH2 KO cells were incapable of producing cis-4-hydroxy-l-proline
  - statement: The authors propose the reduction eliminates a cytotoxic metabolite.
    supporting_text: BDH2 catalyzes the reduction of 4-oxo-l-proline to cis-4-hydroxy-l-proline,
      thereby eliminating the cytotoxic metabolite.
- id: PMID:24777603
  title: Endogenous siderophore 2,5-dihydroxybenzoic acid deficiency promotes anemia
    and splenic iron overload in mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; title matches PubMed. Mouse bdh2 knockout showing
      microcytic anemia, tissue iron overload and no change in ketone body metabolism;
      used here to argue that 3-hydroxybutyrate dehydrogenase activity is non-core and to
      corroborate the conserved siderophore role (the abstract explicitly cites the
      zebrafish embryo knockdown).
  findings:
  - statement: bdh2-null mice develop microcytic anemia and tissue iron overload.
    supporting_text: bdh2 null mice developed microcytic anemia and tissue iron overload,
      especially in the spleen.
  - statement: BDH2 deficiency does not alter ketone body metabolism in vivo.
    supporting_text: Although BDH2 has been proposed to oxidize ketone bodies, we found
      that BDH2 deficiency did not alter ketone body metabolism in vivo.
- id: PMID:16380372
  title: 'Characterization of human DHRS6, an orphan short chain dehydrogenase/reductase
    enzyme: a novel, cytosolic type 2 R-beta-hydroxybutyrate dehydrogenase.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; title matches PubMed. Source of the human BDH2 IDA
      annotations that seed the PAINT node (3-hydroxybutyrate dehydrogenase activity,
      cytoplasm, and NOT mitochondrion). Establishes the cytosolic localization and
      tetrameric SDR structure; the ketone-body role it proposes was later shown to be
      minor (PMID:35150746, PMID:24777603).
  findings:
  - statement: Human DHRS6/BDH2 converts (R)-3-hydroxybutyrate to acetoacetate with a Km of
      about 10 mM.
    supporting_text: Substrate screening reveals sole NAD(+)-dependent conversion of
      (R)-hydroxybutyrate to acetoacetate with K(m) values of about 10 mm
  - statement: Human DHRS6/BDH2 is cytosolic, distinct from mitochondrial BDH1.
    supporting_text: GFP reporter gene analysis reveals a cytosolic localization upon
      transfection into mammalian cells.
  - statement: The enzyme is a tetramer with a canonical SDR fold.
    supporting_text: reveals a tetrameric organization with a short chain
      dehydrogenases/reductase-typical folding pattern
