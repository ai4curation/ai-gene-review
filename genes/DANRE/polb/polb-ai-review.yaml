- term:
    id: GO:0006303
    label: double-strand break repair via nonhomologous end joining
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G10520
  - PANTHER:PTN000138687
  - PomBase:SPAC2F7.06c
  - SGD:S000000607
  - UniProtKB:Q9UGP5
  review:
    summary: |-
      Double-strand break repair via nonhomologous end joining (IBA from PTN000138687, the X-family polymerase node, with yeast Pol4, S. pombe, Arabidopsis and human POLL as donors). NHEJ gap filling in vertebrates is done by DNA polymerases lambda and mu, which are recruited to the Ku-XRCC4-ligase IV synapse through N-terminal BRCT domains that pol beta does not have; pol beta is a 336-residue protein consisting only of the 8-kDa lyase domain and the polymerase domain [file UniProt; PMID:22018137].
    action: REMOVE
    reason: |-
      The node placement spreads an activity of one branch of the X-family across the whole family. The experimental grounding for NHEJ in this family sits on POLL (IDA and IMP) and POLM, not on pol beta: human POLB itself holds GO:0006303 only by the same IBA, so there is no experimental descendant anywhere on the pol beta branch. The structural reason is concrete - the BRCT module that tethers pol lambda and pol mu to the end-joining machinery is absent from pol beta, whose domain content the zebrafish characterisation paper describes directly - and the enzyme's substrate is a preincised single-nucleotide gap, not a synapsed double-strand break. Removing the term does not deny that pol beta can extend a primer in vitro on many substrates.
    supported_by:
    - reference_id: file:DANRE/polb/polb-uniprot.txt
      supporting_text: Belongs to the DNA polymerase type-X family.
    - reference_id: PMID:22018137
      supporting_text: This substitution lies in a hairpin sequence within an 8-kDa domain, likely to be important in DNA binding.
    - reference_id: file:DANRE/polb/polb-uniprot.txt
      supporting_text: through its DNA polymerase activity, it adds one nucleotide to the 3' end of the arising single-nucleotide gap
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000138687
        source_status: SOURCE_BAD
        comment: |-
          The ancestral node covers all X-family polymerases; NHEJ participation is a derived property of the pol lambda/pol mu/Pol4 branch, which acquired BRCT-mediated recruitment to the end-joining complex, so placing it at the family node carries it onto the pol beta branch incorrectly.
      - source_id: UniProtKB:Q9UGP5
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: |-
          Human POLL legitimately carries NHEJ by IDA and IMP, but it is a BRCT-containing paralog, not the ortholog of this gene.
      - source_id: SGD:S000000607
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: |-
          Yeast POL4 is the budding-yeast NHEJ polymerase and is likewise a BRCT-containing member; budding yeast has no pol beta orthologue to separate the two roles.
