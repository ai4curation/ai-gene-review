suggested_questions:
- question: Does zebrafish pol beta have the 5'-dRP lyase activity that defines the mammalian enzyme, given that the only biochemical study of the fish protein assayed polymerase activity alone?
- question: Is the cytoplasmic localisation recorded for pol beta a resting distribution that shifts to the nucleus on DNA damage in zebrafish, as reported for the mammalian protein?
suggested_experiments:
- hypothesis: Zebrafish pol beta removes 5'-dRP through the conserved Schiff-base nucleophile.
  description: Assay purified zebrafish pol beta on a preincised AP-site substrate for dRP release and trap the Schiff-base intermediate by borohydride crosslinking, comparing wild type with the active-site lysine mutant.
  experiment_type: biochemical
- hypothesis: polb loss sensitises zebrafish to alkylating and oxidative base damage but not to double-strand breaks.
  description: Generate a polb null line and compare survival and lesion repair after methyl methanesulfonate or hydrogen peroxide versus ionising radiation, testing the base-excision-specific role against the removed nonhomologous end-joining annotation.
  experiment_type: genetic sensitivity assay
