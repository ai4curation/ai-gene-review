  - statement: Catalytic efficiency is 8.6-fold higher with Mn2+ than with Mg2+.
    supporting_text: Substituting Mn2+ for Mg2+ resulted in 8.6-fold higher catalytic efficiency (kcat/Km).
  - statement: The zebrafish-specific P63D substitution lies in the 8-kDa domain hairpin implicated in DNA binding.
