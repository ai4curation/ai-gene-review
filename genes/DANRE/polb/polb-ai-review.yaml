    label: class I DNA-(apurinic or apyrimidinic site) endonuclease activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06746
  review:
    summary: |-
      Class I DNA-(apurinic or apyrimidinic site) endonuclease activity, i.e. AP lyase: cleavage 3' of an intact abasic site by beta-elimination rather than hydrolysis. UniProt records this as a secondary capability of pol beta.
    action: KEEP_AS_NON_CORE
    reason: |-
      Real but ancillary: the physiological BER route has AP endonuclease incise 5' of the abasic site and pol beta remove the resulting dRP, which is the GO:0051575 activity. The AP lyase reaction on an intact AP site is a lesser-used capability of the same 8-kDa domain, so it is retained without being made core.
