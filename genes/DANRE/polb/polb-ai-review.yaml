id: Q6DRD3
gene_symbol: polb
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  polb encodes DNA polymerase beta, the small single-subunit X-family repair polymerase that performs the synthesis step of base-excision repair. It combines two activities in one chain: an 8-kDa N-terminal domain that removes the 5'-deoxyribose-phosphate left by AP endonuclease cleavage, acting as a lyase through a Schiff-base intermediate at the active-site nucleophile, and a 31-kDa polymerase domain that fills the resulting single-nucleotide gap, distributively rather than processively, with two magnesium ions in the active site. It can also cleave 3' of an intact abasic site as an AP lyase. The protein is found in the nucleus, where repair occurs, and in the cytoplasm under normal conditions. The purified zebrafish enzyme has been characterised biochemically and behaves like its mammalian counterparts, with an alkaline pH optimum, a 30 degrees C temperature optimum and markedly higher catalytic efficiency with Mn2+ than Mg2+.
