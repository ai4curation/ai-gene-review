    - reference_id: file:DANRE/polb/polb-deep-research-falcon.md
      supporting_text: In canonical **short-patch BER**, a damaged base is removed
        by a glycosylase, **APE1/Apex1** cleaves the AP site, **Pol \u03B2 fills the
        gap**, and the nick is sealed by **XRCC1-LIG3\u03B1**
