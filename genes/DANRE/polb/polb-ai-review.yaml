  review:
    summary: |-
      5'-deoxyribose-5-phosphate lyase activity (ISS from human POLB). The 8-kDa domain excises the 5'-dRP group left after AP endonuclease incision, through a Schiff base at the active-site nucleophile; UniProt annotates that catalytic residue in the zebrafish sequence.
    action: ACCEPT
    reason: |-
      The second core catalytic activity of this enzyme and the one that makes it the dedicated BER polymerase: without dRP removal the nick cannot be ligated. The zebrafish protein retains the 8-kDa lyase domain, whose sequence the characterisation paper analysed explicitly.
