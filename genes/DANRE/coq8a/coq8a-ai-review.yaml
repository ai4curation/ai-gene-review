suggested_questions:
- question: Does zebrafish coq8a loss of function reproduce the coenzyme Q deficiency and neurological phenotype of COQ8A-null mice, and is CoQ content in zebrafish embryos dependent on it?
- question: Which molecular function term should capture COQ8 activity now that the conserved, lipid-stimulated ATPase activity is established but no physiological phosphoacceptor is known? Human COQ8A carries generic kinase activity (IDA) and no ATP hydrolysis activity annotation, so the family is currently described by a term that names an activity it may not perform on any substrate other than itself.
suggested_experiments:
- description: Generate a coq8a null zebrafish line and quantify CoQ9/CoQ10 and CoQ pathway intermediates by LC-MS in embryos and adult tissues, testing whether the CoQ deficiency of mammalian orthologs is conserved.
- description: Assay recombinant zebrafish Coq8a for ATP hydrolysis in the presence and absence of cardiolipin-containing liposomes and CoQ-intermediate-like phenolic compounds, to test whether the lipid-stimulated ATPase activity described for yeast, human and bacterial COQ8 extends to the fish enzyme.
