    summary: Ubiquinone biosynthetic process, propagated from node PTN000059692, whose descendants include yeast Coq8p, human COQ8A and COQ8B, fly, worm and Arabidopsis members; loss of the gene lowers CoQ in every organism tested.
    action: ACCEPT
