taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: coq8a encodes the zebrafish ortholog of COQ8A/ADCK3, an atypical protein kinase-like (UbiB family) protein of the inner mitochondrial membrane, anchored by a single transmembrane segment with its catalytic domain facing the matrix. It is required for de novo biosynthesis of coenzyme Q (ubiquinone), the lipid electron carrier of the respiratory chain, where it binds early CoQ lipid intermediates and stabilizes the multi-subunit CoQ biosynthetic complex. Its kinase-like domain is autoinhibited by an N-terminal KxGQ motif that occludes the substrate pocket and by an A-rich loop that makes it bind ADP in preference to ATP; relief of this autoinhibition supports a membrane- and lipid-stimulated ATPase activity rather than transfer of phosphate to a protein substrate. Loss of the orthologous gene in yeast, mouse and human causes coenzyme Q deficiency, and in humans it underlies autosomal recessive cerebellar ataxia type 2.
