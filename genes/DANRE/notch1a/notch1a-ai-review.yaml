    supporting_text: Notch1a receives lateral-inhibition signals that suppress ionocyte identity and
      favor keratinocyte fate in adjacent ectodermal cells.
core_functions:
- description: Transmembrane Notch receptor at the plasma membrane that binds Delta and Jagged 
    ligands on neighbouring cells; ligand-induced proteolysis releases the NICD, which translocates 
    to the nucleus and activates Notch target transcription with Rbpj and Mastermind.
  molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:25416946
    supporting_text: Synergy experiments depleting Notch1a and Tnfr2 combinatorially indicate that 
      Notch1a is likely the receptor on HSCs that binds to the Jag1a ligand presented by aortic 
      endothelial cells.
  - reference_id: PMID:25230933
    supporting_text: The orthologues of the murine Notch1 receptor, Notch1a and Notch1b, are each 
      required intrinsically to fate HSCs, just prior to their emergence from aortic hemogenic 
      endothelium.
suggested_questions:
- question: Which functions are unique to notch1a versus notch1b after the teleost genome 
    duplication (e.g. somitogenesis in des mutants versus HSC specification where both are 
    required)?
- question: Is zebrafish Notch1a modified by Lunatic fringe in the PSM and hypochord, and does this 
    change its preference for DeltaC versus DeltaD?
suggested_experiments:
- description: Paralog-swap knock-ins (notch1b coding sequence at the notch1a locus) to test whether
    notch1a-specific phenotypes reflect expression or protein differences.
- description: Endogenous tagging of Notch1a to visualise S1-S3 processing and NICD nuclear entry in
    PSM cells during clock oscillations.
