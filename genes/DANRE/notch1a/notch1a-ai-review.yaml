id: P46530
gene_symbol: notch1a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: notch1a encodes one of the two zebrafish co-orthologs (with notch1b) of mammalian 
  NOTCH1, a single-pass type I transmembrane receptor of the Notch family. Its large extracellular 
  domain of 36 EGF-like repeats (including the ligand-binding repeats) and the 
  LNR/heterodimerization negative regulatory region is followed by a transmembrane segment and an 
  intracellular domain containing the RAM region, ankyrin repeats, nuclear localisation signals and 
  a C-terminal PEST region. After furin processing in the Golgi, the receptor at the plasma membrane
  binds Delta/Jagged ligands on neighbouring cells; ligand-induced ADAM and gamma-secretase 
  cleavages release the Notch intracellular domain (NICD), which enters the nucleus and, with Rbpj 
  (Su(H)) and Mastermind, activates target genes such as her/hey genes. Notch1a is the gene 
  disrupted in the deadly seven (des) mutant, which has somite segmentation defects owing to 
  desynchronisation of the segmentation clock. It also acts in lateral inhibition during 
  neurogenesis and radial glia formation, V2 interneuron fate decisions, hypochord and 
  notochord/floorplate midline specification, exocrine pancreas and endoderm development, dorsal 
  aorta formation, and the cell-autonomous specification of hematopoietic stem cells in hemogenic 
  endothelium (where Notch1a, activated by Jag1a, drives an NF-kappaB-dependent program). Binding of
  Notch1a also drives endocytosis of specific Delta ligands in cis and in trans.
