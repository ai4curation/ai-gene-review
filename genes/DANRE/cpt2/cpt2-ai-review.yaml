id: Q5U3U3
gene_symbol: cpt2
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: cpt2 encodes carnitine O-palmitoyltransferase 2 (EC 2.3.1.21), a peripheral protein of the matrix face of the mitochondrial inner membrane and the second enzyme of the carnitine shuttle. After Cpt1 converts long-chain acyl-CoA to acylcarnitine at the outer membrane and the carnitine/acylcarnitine translocase moves it across the inner membrane, Cpt2 catalyses the reverse transesterification, regenerating long-chain acyl-CoA in the matrix and releasing free carnitine, so that the fatty acyl group can enter the beta-oxidation spiral. It is active on medium-chain (C8-C12) as well as long-chain (C14-C18) acyl esters. In zebrafish, morpholino knockdown causes abnormal lipid utilization and deposition, reduced body size and abnormal brain development, reflecting the dependence of the early embryo on fatty acid oxidation for energy.
