suggested_questions:
- question: Do zebrafish cpt2 mutants accumulate long-chain acylcarnitines and show the acylcarnitine profile used diagnostically in human CPT2 deficiency, and does the profile distinguish medium- from long-chain substrate use in vivo?
- question: Are the neural and behavioral phenotypes of cpt2 knockdown zebrafish a direct consequence of reduced fatty acid oxidation in neurons, or secondary to systemic energy deficit? This determines whether any neurodevelopmental process annotation could ever be justified for this gene.
suggested_experiments:
- description: Generate a stable cpt2 loss-of-function zebrafish line and measure acylcarnitine and free carnitine profiles by tandem mass spectrometry across chain lengths, testing whether long-chain species accumulate as in human CPT2 deficiency.
- description: Assay recombinant zebrafish Cpt2 against a C2-C26 acyl-CoA panel with carnitine, to test whether the medium- plus long-chain specificity measured for the human enzyme is conserved and whether the octanoyltransferase annotation is warranted for the fish protein.
