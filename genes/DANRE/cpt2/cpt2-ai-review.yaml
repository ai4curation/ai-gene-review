- id: PMID:39199302
  title: 'CPT2 Deficiency Modeled in Zebrafish: Abnormal Neural Development, Electrical Activity, Behavior, and Schizophrenia-Related Gene Expression.'
  findings:
  - statement: CPT2 is an inner mitochondrial membrane protein of the carnitine shuttle acting in long-chain fatty acid beta-oxidation.
    supporting_text: Carnitine palmitoyltransferase 2 (CPT2) is an inner mitochondrial membrane protein of the carnitine shuttle and is involved in the beta-oxidation of long chain fatty acids
  - statement: CPT2 converts long-chain acylcarnitine to acyl-CoA at the inner mitochondrial membrane.
    supporting_text: carnitine palmitoyltransferase 2 (CPT2) that converts the long-chain acylcarnitine to acyl-CoA for oxidation in the inner mitochondrial membrane
  - statement: Knockdown in zebrafish disturbs lipid utilization and deposition, body size and brain development.
    supporting_text: CPT2 knockdown resulted in abnormal lipid utilization and deposition, reduction in body size, and abnormal brain development
  - statement: Neural and behavioral phenotypes follow CPT2 knockdown in zebrafish.
    supporting_text: Axonal projections, neurotransmitter synthesis, electrical hyperactivity, and swimming behavior were disrupted in CPT2 knockdown zebrafish
  - statement: Zebrafish Cpt2 protein is present in mitochondrial fractions isolated from larvae.
    supporting_text: A representative Western blot of CPT2 protein levels isolated from the mitochondrial fraction of 200 WT, CTRL-injected, TB-injected, and SB-injected zebrafish is shown
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record; full text cached. The only zebrafish-specific cpt2 study found, and the source of the in vivo lipid-utilization evidence. Its neural and behavioral findings are downstream consequences of impaired fatty acid oxidation and were not used to propose process annotations.
- id: PMID:20538056
  title: 'Carnitine palmitoyltransferase 2: New insights on the substrate specificity and implications for acylcarnitine profiling.'
  findings:
  - statement: CPT2 is active with medium-chain (C8-C12) and long-chain (C14-C18) acyl-CoA esters but not with short-, very-long-chain or branched-chain substrates.
    supporting_text: We show that CPT2 is active with medium (C8-C12) and long-chain (C14-C18) acyl-CoA esters, whereas virtually no activity was found with short- and very long-chain acyl-CoAs or with branched-chain amino acid oxidation intermediates
  - statement: Trans-2-enoyl-CoA intermediates are poor substrates.
    supporting_text: Trans-2-enoyl-CoA intermediates were also found to be poor substrates for CPT2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches PubMed. Human CPT2 (the ISS donor) substrate-specificity study; it is the experimental basis for the octanoyltransferase annotation and for treating medium-chain activity as secondary. Abstract-only cache.
