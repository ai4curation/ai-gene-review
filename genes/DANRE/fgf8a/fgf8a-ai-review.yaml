id: O57341
gene_symbol: fgf8a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: fgf8a is the zebrafish orthologue of vertebrate FGF8 and one of two co-orthologues (with
  fgf8b) retained from the teleost-specific genome duplication; it is the gene mutated in acerebellar
  (ace). It encodes a secreted fibroblast growth factor of the FGF8/17/18 (FgfD) subfamily, with an N-terminal
  signal peptide and the FGF beta-trefoil core, that acts as an extracellular ligand for FGF receptor
  tyrosine kinases and activates Ras/MAPK signalling. Its spread through tissue is limited by endocytosis
  and lysosomal degradation in receiving cells, which shapes a signalling gradient. fgf8a is expressed
  from the blastula onward, in a dorsoventral gradient during gastrulation and later at the midbrain-hindbrain
  boundary, dorsal diencephalon, telencephalon, somites, tailbud, heart precursors, pharyngeal region,
  otic region and pectoral fin bud. It is required for the midbrain-hindbrain boundary (isthmic) organizer
  and cerebellum, for induction of myocardial precursors, for otic and epibranchial placode induction
  with fgf3, for Kupffer's vesicle ciliogenesis and left-right asymmetry, and it contributes to gastrula
  dorsoventral patterning, mesoderm formation and restriction of endoderm, somitic fast-muscle differentiation,
  hindbrain patterning, retinal patterning and pharyngeal pouch and cartilage development. Heterozygous
  adults show craniofacial skeletal defects. In zebrafish its paralogue fgf8b shares the midbrain-hindbrain
  boundary and somite expression domains but is not expressed during gastrulation or in the heart.
