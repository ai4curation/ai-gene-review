suggested_questions:
- question: Does fgf8b expression rise in ace (ti282a, premature stop codon) mutants, as transcriptional
    adaptation would predict, and does it buffer shared domains such as the MHB and somites?
- question: Would fgf8b coding sequence expressed from the fgf8a locus rescue ace, confirming that the
    two proteins are interchangeable in vivo?
- question: What is the expression pattern of the single fgf8 gene of spotted gar, and does it include
    the heart, gastrula margin and telencephalon (fgf8a-only domains in zebrafish)?
suggested_experiments:
- hypothesis: fgf8a and fgf8b proteins are functionally equivalent; their differences are regulatory.
  description: Knock-in of fgf8b coding sequence into the fgf8a locus (or fgf8b mRNA injection into ace
    mutants) and scoring of MHB, heart and Kupffer's vesicle phenotypes.
  experiment_type: cross-rescue
- hypothesis: fgf8a and fgf8b act redundantly in their shared domains (MHB, somites, otic vesicle).
  description: Compare ace single mutants with fgf8a;fgf8b double mutants, using a promoter-deletion (RNA-less)
    fgf8a allele to avoid transcriptional adaptation.
  experiment_type: double mutant analysis
