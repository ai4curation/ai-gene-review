    supporting_text: If internalization is inhibited, Fgf8 protein accumulates extracellularly, spreads
      further, and activates target gene expression over a greater distance.
  - reference_id: PMID:11802165
    supporting_text: Sef functions as a feedback-induced antagonist of Ras/Raf/MEK/MAPK-mediated FGF signalling.
- description: Signal of the midbrain-hindbrain boundary (isthmic) organizer, required to maintain the
    MHB, midbrain identity and the cerebellum (acerebellar phenotype).
