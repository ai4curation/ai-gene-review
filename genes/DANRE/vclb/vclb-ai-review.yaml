- term:
    id: GO:0060977
    label: coronary vasculature morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:27578788
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-170321-9
  review:
    summary: Vclb is required for organized coronary vessel formation; loss raises FAK/ERK signalling in epicardium
      and endocardium.
    action: ACCEPT
    reason: 'The main phenotype of the vclb mutant and the one that distinguishes the copies: vcla is expressed
      in the myocardium but not the epicardium, so the coronary/epicardial role falls to vclb by expression. The
      mechanism given (paxillin released from the Vclb complex, FAK/ERK hyperphosphorylation) is the ancestral vinculin
      adhesion-site activity acting in a vclb-specific expression domain.'
    supported_by:
    - reference_id: PMID:27578788
      supporting_text: Mechanistically, Vclb deficiency results in the release of another cytoskeletal protein,
        paxillin, from the Vclb complex and the upregulation of ERK and FAK phosphorylation in epicardium and endocardium,
        causing disorganization of endothelial cells and pericytes during coronary vessel development.
    - reference_id: PMID:27578788
      supporting_text: By contrast, cardiac muscle development is relatively normal, probably owing to redundancy
        with Vcla, a vinculin paralog that is expressed in the myocardium but not epicardium.
