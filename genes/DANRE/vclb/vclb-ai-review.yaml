- term:
    id: GO:0008013
    label: beta-catenin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN005285701
  - UniProtKB:P12003
  - dictyBase:DDB_G0285939
  review:
    summary: Beta-catenin binding (IBA).
    action: UNDECIDED
    reason: The PAINT node is sound for vertebrate vinculin, but vclb carries F at the position of Y822, the tyrosine
      whose phosphorylation was reported to be needed for vinculin-beta-catenin binding, and the Y822F mutation
      of chicken vinculin abrogated the interaction. Vclb still reaches cell-cell junctions in MDCK cells via alpha-catenin,
      which does not test beta-catenin binding. This is a candidate target-specific divergence inside the clade,
      so the inheritance of this particular activity by vclb is unresolved until binding is tested directly.
    supported_by:
    - reference_id: PMID:28767718
      supporting_text: The one notable difference between zebrafish vinculin A and B is the change of the otherwise
        conserved Y at position 822 to F in vinculin B.
    - reference_id: PMID:28767718
      supporting_text: Curiously, the 822F residue in zebrafish vinculin B does not perturb its localization to
        cell-cell junctions.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      residue_claims:
      - claim_type: SUBSTITUTED
        anchor:
          accession: UniProtKB:P18206-2
          position: 822
          residue: Y
        target:
          accession: UniProtKB:A0A0S2I7K2
          position: 822
          residue: F
          sequence_version: 1
        role: Phosphotyrosine reported to be required for vinculin-beta-catenin binding in mammalian cells
        method: MSA
        comment: Global BLOSUM62 alignment (genes/DANRE/vcla/vcla-bioinformatics/compare_vinculins.py); substitution
          also reported by PMID:28767718. vcla retains Y at this position.
      source_entities:
      - source_id: PANTHER:PTN005285701
        comment: Vertebrate/metazoan vinculin node carrying the beta-catenin binding IBD. Sound for vinculin generally;
          vclb is inside the clade but carries a substitution at a residue linked to this specific interaction,
          and binding has not been tested for vclb.
        source_status: UNRESOLVED
