id: A0A0S2I7K2
gene_symbol: vclb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: vclb (vinculin b) is one of two zebrafish co-orthologs of vertebrate vinculin (VCL), retained from
  the teleost-specific genome duplication; its paralog is vcla. It encodes a cytoplasmic actin-binding adaptor of
  focal adhesions and adherens junctions that binds talin and alpha-catenin through its head domain and F-actin
  and paxillin through its tail. The protein conserves the binding residues of mammalian vinculin but carries phenylalanine
  at the position of the regulatory tyrosine Y822; GFP-tagged Vclb still localizes to focal adhesions and, via the
  alpha-catenin vinculin-binding site, to adherens junctions. vclb is the predominant vinculin copy in the embryonic
  heart, including epicardium and endocardium, and is the copy most prominently expressed in endothelial cells,
  where it marks focal adhesions and cell-cell junctions. vclb mutants develop epicardial hyperplasia, disorganized
  coronary vessels with elevated FAK and ERK phosphorylation, and die as juveniles. Combined loss with vcla causes
  leakage of small molecules from embryonic vessels. vclb mRNA is upregulated when vcla mutant transcripts undergo
  nonsense-mediated decay (transcriptional adaptation).
