      their link to actin, so it contributes structure that barrier formation depends on (junctional vinculin, not
      a downstream signal). The in vivo evidence is genetic and involves both copies (vcla-/-;vclb+/- and vcla-/-;vclb-/-
      both leak), so the annotation is made to both copies as IGI rather than to one. vclb is the copy most prominently
      expressed in endothelium (PMID:36314606), so the relative contribution of each copy is not resolved.'
    supported_by:
    - reference_id: PMID:36260739
      supporting_text: Our analysis shows that vcla−/−;vclb+/−and vcl full-KO embryos exhibited increased perivascular
        dextran levels
    - reference_id: PMID:36260739
      supporting_text: we observed vascular leakage specifically for small molecules, 10 kDa, in vinculin knockout
        zebrafish, whereas the vasculature still acted as a barrier for larger molecules
    - reference_id: PMID:36260739
      supporting_text: Together, the data show that vinculin tightens endothelial junctions in blood vessels.
