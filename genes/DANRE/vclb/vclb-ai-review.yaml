suggested_questions:
- question: Does Vclb (F822) bind beta-catenin, and does the Y822F substitution change junction stabilization in
    a vinculin-null zebrafish background?
- question: Is the juvenile lethality of vclb mutants due to loss of an epicardial/endocardial expression domain
    that vcla lacks, i.e. would vcla expressed from the vclb locus rescue it?
- question: Can the vclb locus encode a metavinculin exon, or is metavinculin made only from vcla?
