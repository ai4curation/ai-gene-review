gene_symbol: prmt6
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'prmt6 encodes protein arginine N-methyltransferase 6, a nuclear, S-adenosylmethionine-dependent
  type I PRMT that transfers methyl groups to the guanidino nitrogens of protein arginine residues, forming
  monomethylarginine and, preferentially, asymmetric dimethylarginine. Its signature substrate is histone
  H3 arginine 2: the H3R2me2a mark it deposits blocks binding of the SET1/WDR5 H3K4 methyltransferase
  complex and therefore acts as a transcription-repressive chromatin modification; histone H2A and H4
  arginine 3 and several non-histone proteins are additional substrates of the mammalian enzyme. In zebrafish,
  prmt6 is maternally provided as a single-coding-exon gene; morpholino knockdown lowers global H3R2me2a,
  arrests epiboly and derepresses the stress sensor gadd45aa, a direct promoter target of Prmt6, leading
  to p38/JNK activation and apoptosis. Prmt6 is also transiently enriched in differentiating Muller glia,
  and crispants show mis-positioned glial cell bodies and inner limiting membrane defects in the retina.'
