  - UniProtKB:Q96LA8
  review:
    summary: "PAINT node PTN008510054 (type I PRMT clade: human PRMT6 and PRMT1, mouse Prmt1, Arabidopsis
      PRMT4a) asserts chromatin remodeling, GO's home for histone-modifying enzymes since histone-modification
      process terms were retired. Prmt6 deposits H3R2me2a, a covalent change to nucleosomal histone H3
      that blocks the SET1/WDR5 complex and so reorganizes local chromatin state."
    action: ACCEPT
    reason: 'Participation is direct: the enzyme itself installs the H3R2me2a mark. In zebrafish, prmt6
      morpholino knockdown lowered global H3R2me2a and prmt6 mRNA restored it (PMID:26487724), so the
      zebrafish protein is a functional histone H3R2 methyltransferase, and it lies inside the type I
      PRMT clade at which the node is placed. The earlier objection that this is not ATP-dependent nucleosome
      remodeling does not hold against the GO definition (any reorganization changing chromatin structure
      that permits transcriptional regulation). Accepted as a core process.'
