- id: file:DANRE/prmt6/prmt6-deep-research-falcon.md
  title: Falcon deep research report on Danio rerio prmt6 (Q6NWG4)
  findings:
  - statement: 'Zebrafish Prmt6 is a SAM-dependent, type I protein arginine methyltransferase that catalyzes

      asymmetric dimethylarginine (ADMA) formation, matching the UniProt description for Q6NWG4

      (PRMT6; EC 2.1.1.319) by enzymatic class, conserved PRMT domain architecture, and a strongly

      nuclear/chromatin-centric functional profile.'
    reference_section_type: OTHER
    supporting_text: '**Target gene/protein:** zebrafish *prmt6* encoding **Protein arginine N-methyltransferase
      6 (PRMT6)**, a **SAM-dependent, type I protein arginine methyltransferase** that catalyzes **asymmetric
      dimethylarginine (ADMA)** formation on protein substrates. This matches the UniProt description
      for Q6NWG4 (PRMT6; EC 2.1.1.319)'
  - statement: 'Type I PRMTs, including PRMT6, transfer methyl groups from S-adenosyl-L-methionine (SAM)
      to

      arginine guanidino nitrogens, generating monomethylarginine (MMA) and then asymmetric

      dimethylarginine (ADMA); PRMT6 preferentially produces ADMA.'
    reference_section_type: OTHER
    supporting_text: Type I PRMTs generate **monomethylarginine (MMA)** and then **asymmetric 
      dimethylarginine (ADMA)**, whereas other PRMT classes generate symmetric dimethylation or only
      MMA
  - statement: 'PRMT6 deposits histone H3 Arg2 asymmetric dimethylation (H3R2me2a), a repressive chromatin
      mark

      that antagonizes the activating H3K4me3 mark; PRMT6 often acts as a transcriptional co-repressor.'
    reference_section_type: OTHER
    supporting_text: A central concept in PRMT6 biology is its deposition of **histone H3 Arg2 
      asymmetric dimethylation (H3R2me2a)**, which is widely treated as a **repressive chromatin 
      mark** that antagonizes the activating lysine mark **H3K4me3**
  - statement: 'PRMT6 installs several histone arginine methyl marks beyond H3R2me2a, including H3R17me2a

      (redundant with CARM1), H3R42me2a, and H2A arginine methylation.'
    reference_section_type: OTHER
    supporting_text: PRMT6 installs several histone arginine methyl marks
  - statement: 'PRMT6 is consistently described as predominantly nuclear/chromatin-associated, consistent
      with

      its core role in chromatin regulation and transcriptional control.'
    reference_section_type: OTHER
    supporting_text: PRMT6 is consistently described as **predominantly nuclear**, consistent with 
      its core role in chromatin regulation and transcriptional control
  - statement: 'Beyond histones, PRMT6 methylates non-histone substrates including DNA polymerase beta
      (POLB),

      linking it to DNA repair regulation.'
    reference_section_type: OTHER
    supporting_text: '**DNA polymerase β (POLB) R83 and R152:** PRMT6 methylation at these sites is linked
      to altered polymerase properties and DNA repair modulation'
  - statement: 'Zebrafish prmt6 is reported to be essential for early zebrafish development through direct

      repression of the gadd45 alpha a stress-sensor gene.'
    reference_section_type: OTHER
    supporting_text: prmt6 is reported to be **essential for early zebrafish development** through 
      repression of **gadd45αa**
