- id: PMID:15475159
  title: Identification and phylogenetic analyses of the protein arginine methyltransferase gene 
    family in fish and ascidians.
  findings:
  - statement: Zebrafish orthologs of human PRMT1-7 including PRMT6 were identified; vertebrate 
      PRMT6 has a single coding exon.
    supporting_text: orthologues of eight human PRMT genes (PRMT1-7 and HRMT1L3) were identified in 
      both puffer fish Fugu rubripes and zebrafish Danio rerio
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Title matches the cached record (Gene 2004; abstract only). Identifies zebrafish 
      prmt6 as the ortholog of human PRMT6 and notes its single coding exon; supports orthology, not
      activity.
- id: PMID:26487724
  title: Protein Arginine Methyltransferase 6 (Prmt6) Is Essential for Early Zebrafish Development 
    through the Direct Suppression of gadd45αa Stress Sensor Gene.
  findings:
  - statement: Knockdown of maternal prmt6 lowers global H3R2me2a and the reduction is rescued by 
      prmt6 mRNA, showing zebrafish Prmt6 is the H3R2 methyltransferase.
    supporting_text: application of which led to early epiboly defects and significantly reduced the
      level of H3R2me2a marks. prmt6 mRNA could rescue the epiboly defects and the H3R2me2a 
      reduction in the prmt6 morphants
  - statement: Prmt6 occupies and represses the gadd45aa promoter.
    supporting_text: the results of ChIP quantitative real time PCR and luciferase reporter assay 
      indicated that gadd45 α a is a repressive target of Prmt6
  - statement: H3R2me2a antagonizes H3K4me3 and is a transcription-repressive mark.
    supporting_text: H3R2me2a mutually antagonizes H3K4me3 ( 17 ) and is known as a 
      transcription-repressive mark
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Title matches the cached PubMed/PMC record (J Biol Chem 2016; full text cached). Primary
      zebrafish paper: morphant loss and mRNA rescue of H3R2me2a, ChIP-qPCR/luciferase showing gadd45aa
      is a direct repressive target. Supports the H3R2 methyltransferase, chromatin and transcriptional
      repression rows.'
