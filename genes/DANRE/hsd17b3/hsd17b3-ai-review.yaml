- question: |-
    Which 17beta-HSD supplies testosterone/11-ketotestosterone synthesis in juvenile zebrafish gonads, given that hsd17b3 transcripts are low or undetected at 19-30 dpf while the recombinant enzyme clearly performs the reaction in vitro?
- question: |-
    Does the strong hepatic and ovarian expression of hsd17b3 in adults reflect an extragonadal androgen-activation (or 11-oxygenated androgen) role that differs from the testis-restricted function of mammalian HSD17B3?
suggested_experiments:
- description: |-
    Generate an hsd17b3 knockout line and profile plasma and gonadal testosterone and 11-ketotestosterone by LC-MS/MS in adults of both sexes, to test whether Hsd17b3 is the physiologically dominant androstenedione 17beta-reductase in vivo.
  experiment_type: genetic knockout with steroid profiling
- description: |-
    Determine kinetic constants (Km, kcat) of purified zebrafish Hsd17b3 for androstenedione versus 11-ketoandrostenedione and 11beta-hydroxyandrostenedione, to establish whether the enzyme is tuned toward the 11-oxygenated androgen branch characteristic of teleosts.
  experiment_type: enzyme kinetics
