- id: PMID:16216911
  title: 'Androgen metabolism via 17beta-hydroxysteroid dehydrogenase type 3 in mammalian
    and non-mammalian vertebrates: comparison of the human and the zebrafish enzyme.'
  findings:
  - statement: Recombinant zebrafish Hsd17b3 reduces androstenedione to testosterone using NADPH.
    supporting_text: The zebrafish enzyme in vitro effectively catalyzed the conversion of androstenedione to testosterone by use of NADPH as cofactor.
  - statement: Zebrafish Hsd17b3 also reduces DHEA and epiandrosterone at C-17 but, unlike the human enzyme, not androsterone or androstanedione.
    supporting_text: Among further tested androgens epiandrosterone and dehydroepiandrosterone were accepted as substrates and reduced at C-17 by the human and the zebrafish enzyme. Androsterone and androstanedione though, were only substrates of human 17beta-HSD type 3, not the zebrafish enzyme.
  - statement: Both human and zebrafish enzymes reduce 11-ketoandrostenedione and 11beta-hydroxyandrostenedione at C-17, i.e. toward 11-ketotestosterone.
    supporting_text: we found that both enzymes can reduce 11-ketoandrostenedione as well as 11beta-hydroxyandrostenedione at C-17 to the respective testosterone forms.
  - statement: Zebrafish Hsd17b3 localizes to the endoplasmic reticulum.
    supporting_text: At the subcellular level, both human and zebrafish 17beta-HSD type 3 localize to the endoplasmic reticulum.
  - statement: Expression is not testis-restricted; it is embryonic (sphere to 84 hpf) and sexually dimorphic in adults, highest in male liver and in ovary.
    supporting_text: Expression was also detected in various tissues of both male and female adults, but displayed sexual dimorphism. Interestingly, expression was not highest in male testis but in male liver. In female adults, strongest expression was observed in ovaries.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Title matches the cached PubMed record (J Mol Endocrinol 2005). This is the primary characterization of the zebrafish enzyme and the source of all three ZFIN IDA annotations; the abstract explicitly states the ER localization, the NADPH-dependent androstenedione-to-testosterone reaction, and the substrate profile for the zebrafish protein. Abstract-only cache, but every quoted claim is in the abstract.
- id: PMID:27927697
  title: Absence of 11-keto reduction of cortisone and 11-ketotestosterone in the model
    organism zebrafish.
  findings:
  - statement: Zebrafish androgen and glucocorticoid metabolism was compared with human using recombinant enzymes and microsomes; UniProt cites this paper as additional evidence for Hsd17b3 EC 1.1.1.64 activity and for reduction of 11-ketoandrostenedione.
    supporting_text: We compared glucocorticoid and androgen metabolism between human and zebrafish using recombinant enzymes, microsomal preparations and zebrafish larvae.
  - statement: Zebrafish lack 11-ketosteroid reductase activity; 11-ketotestosterone production is sustained, with Hsd11b2 generating the main fish androgen 11KT.
    supporting_text: Additionally, a dual-role of 11β-HSD2 by inactivating glucocorticoids and generating the main fish androgen 11KT was supported.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: |-
      Title matches the cached PubMed record (J Endocrinol 2017). Cited by UniProt (ECO:0000269) as corroborating evidence for the EC 1.1.1.64 reaction and 11-ketoandrostenedione reduction by zebrafish Hsd17b3; the abstract does not mention hsd17b3 by name, so the specific Hsd17b3 data are taken from UniProt's curation of the full text and this reference is used only as corroboration, not as sole support.
