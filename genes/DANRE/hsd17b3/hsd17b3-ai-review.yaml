- id: file:DANRE/hsd17b3/hsd17b3-deep-research-falcon.md
  title: Falcon (Edison) deep research report for Danio rerio hsd17b3 (Q6QA32)
  findings:
  - statement: Unlike testis-restricted mammalian HSD17B3, zebrafish hsd17b3 is broadly expressed across adult tissues (dominant in testis, liver, ovary), suggesting a more somatic expression pattern.
    supporting_text: Zebrafish hsd17b3 expression is reported across **multiple adult tissues**, with summarized dominant sites including **testis, liver, and ovary**, and additional detection reported in **skin, muscle, spleen, intestine, and eyes**.
    reference_section_type: OTHER
  - statement: 'In vivo developmental contribution may be stage-dependent: hsd17b3 expression is low or undetected in juvenile zebrafish gonads (19/30 dpf), implying another Hsd17b enzyme may supply 17beta-HSD activity at early stages.'
    supporting_text: They report that **hsd17b3 expression is low** at both 19 and 30 dpf and that they **did not detect hsd17b3** in ZZ NA gonads at 30 dpf.
    reference_section_type: OTHER
  - statement: Zebrafish lacks an HSD17B5 ortholog, raising the possibility that zebrafish Hsd17b3 covers roles distributed among multiple paralogs in mammals.
    supporting_text: notes that zebrafish lacks an HSD17B5 ortholog, raising the possibility that zebrafish Hsd17b3 may cover functional roles that in mammals are distributed differently among paralogs.
    reference_section_type: OTHER
