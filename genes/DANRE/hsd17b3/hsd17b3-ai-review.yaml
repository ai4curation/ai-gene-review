gene_symbol: hsd17b3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  hsd17b3 encodes zebrafish 17beta-hydroxysteroid dehydrogenase type 3 (Hsd17b3), a short-chain dehydrogenase/reductase (SDR) family oxidoreductase with an N-terminal transmembrane helix that anchors it in the endoplasmic reticulum. The enzyme uses NADPH to reduce 17-oxosteroids to 17beta-hydroxysteroids, and its preferred reaction is the reduction of androstenedione to testosterone, the terminal step of testosterone biosynthesis. Recombinant zebrafish Hsd17b3 also reduces dehydroepiandrosterone and epiandrosterone at C-17, and reduces 11-ketoandrostenedione and 11beta-hydroxyandrostenedione to 11-ketotestosterone and 11beta-hydroxytestosterone, placing it on the route to 11-ketotestosterone, the principal teleost androgen; unlike the human enzyme it does not accept androsterone or androstanedione. Unlike testis-restricted mammalian HSD17B3, the zebrafish gene is expressed from sphere stage through embryogenesis and in many adult tissues with strong sexual dimorphism (highest in male liver and in ovary), suggesting a broader, partly extragonadal role in androgen metabolism.
