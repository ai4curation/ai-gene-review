- id: PMID:26506222
  title: ADSSL1 mutation relevant to autosomal recessive adolescent onset distal myopathy.
  findings:
  - statement: Compound heterozygous ADSSL1 mutations (p.D304N and p.I350fs) cosegregate
      with adolescent-onset distal myopathy in two Korean families, and both mutations
      decrease adenylosuccinate synthetase enzymatic activity.
    supporting_text: Both the D304N and I350fs mutations in ADSSL1 led to decreased
      enzymatic activity.
    reference_section_type: ABSTRACT
  - statement: Morpholino knockdown of adssl1 in zebrafish severely disrupts muscle
      fibers (myosin expression, birefringence), and supplying wild-type human ADSSL1
      protein reverses the defect.
    supporting_text: In an adssl1 knockdown zebrafish model, muscle fibers were severely
      disrupted, which was evaluated by myosin expression and birefringence. In these
      conditions, supplementing wild-type ADSSL1 protein reversed the muscle defect.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Park et al. 2016, Ann Neurol 79:231).
      Abstract only in the cache, so the morpholino sequences and the exact rescue
      protocol cannot be checked; the abstract explicitly states the zebrafish knockdown,
      the muscle-fiber readouts and the rescue, which is what the two ZFIN IMP rows
      and the UniProt disruption phenotype rely on.
- id: PMID:27434589
  title: Anti-apoptotic Effects of Human Wharton's Jelly-derived Mesenchymal Stem
    Cells on Skeletal Muscle Cells Mediated via Secretion of XCL1.
  findings:
  - statement: A zebrafish myopathy model generated by knockdown of ADSSL1 was used
      to test XCL1; XCL1 treatment produced significant recovery of the zebrafish
      skeletal muscle defects.
    supporting_text: We demonstrated the therapeutic effect of XCL1 on the zebrafish
      myopathy model, generated by knock down of a causative gene ADSSL1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches the cached record (Kwon et al. 2016, Mol Ther 24:1550).
      Abstract only. The paper is about XCL1 and mesenchymal stem cells; adss1 enters
      only as the gene knocked down to create the myopathy model, so it supports the
      muscle-homeostasis IMP row as a phenotype observation but adds no mechanism
      for the enzyme.
- id: file:DANRE/adss1/adss1-uniprot.txt
  title: UniProtKB entry Q6NSN5 for Danio rerio adss1
  findings:
  - statement: Zebrafish adss1 is annotated (HAMAP MF_03126, by similarity to human
      Q8N142) as the muscle isozyme of adenylosuccinate synthetase, a homodimeric
      cytoplasmic Mg2+-dependent ligase catalysing IMP + L-aspartate + GTP to adenylosuccinate,
      step 1/2 of AMP formation from IMP, and a component of the purine nucleotide
      cycle.
    supporting_text: Component of the purine nucleotide cycle (PNC), which interconverts
      IMP and AMP to regulate the nucleotide levels in various tissues, and which contributes
      to glycolysis and ammoniagenesis. Catalyzes the first committed step in the biosynthesis
      of AMP from IMP.
    reference_section_type: OTHER
  - statement: Morpholino knockdown in embryos results in severe disruption of muscle
      fibers (disruption phenotype from PMID:26506222).
    supporting_text: Morpholino knockdown of the protein in embryos results in severe
      disruption of muscle fibers.
    reference_section_type: OTHER
- id: file:DANRE/adss1/adss1-deep-research-falcon.md
  title: Falcon (Edison Scientific Literature) deep research report for Danio rerio
    adss1 (Q6NSN5)
  findings:
  - statement: ADSS1 catalyses the conserved IMP to adenylosuccinate step using IMP,
      aspartate and GTP with Mg2+, and functions with ADSL and AMP deaminase in the
      purine nucleotide cycle that supports muscle energy homeostasis.
    supporting_text: 'ADSS and ADSL, together with AMP deaminase (AMPD; converts AMP
      back to IMP), are described as key enzymes of the **purine nucleotide cycle**,
      which supports **energy homeostasis in muscle**

      '
    reference_section_type: RESULTS
  - statement: No zebrafish-specific primary literature on Q6NSN5 was retrieved by
      the report, and no zebrafish localisation or purinosome data exist.
    supporting_text: 'None of the retrieved full texts directly demonstrated that
      **zebrafish ADSS1 (Q6NSN5)** localizes to a specific compartment or is physically
      incorporated into purinosomes in zebrafish tissues/cells.

      '
    reference_section_type: RESULTS
