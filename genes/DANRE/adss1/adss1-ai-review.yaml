- term:
    id: GO:0046716
    label: muscle cell cellular homeostasis
  evidence_type: IMP
  original_reference_id: PMID:27434589
  review:
    summary: ZFIN IMP from Kwon et al. 2016 (Mol Ther; abstract only in the cache).
      The paper is about the anti-apoptotic chemokine XCL1 secreted by Wharton's
      jelly mesenchymal stem cells; it uses a zebrafish adssl1 morpholino knockdown
      as a myopathy model and shows XCL1 treatment recovers the skeletal muscle
      defects. The annotation records that loss of adss1 destabilises muscle cells.
      Biologically this is plausible as a direct role, the purine nucleotide cycle
      that adss1 initiates maintains the adenine nucleotide pool of working muscle
      (UniProt FUNCTION line, "regulate the nucleotide levels in various tissues"), so
      the enzyme contributes to keeping the muscle cell in a stable state.
    action: KEEP_AS_NON_CORE
    reason: The evidence is a morphant phenotype and its rescue by an unrelated
      survival factor, which shows necessity rather than mechanism, and the full text
      is not available to check what was measured. The term is nonetheless a fair
      description of what the muscle isozyme is for, so it is retained as a non-core
      process annotation; the core function remains the catalytic activity.
    supported_by:
    - reference_id: PMID:27434589
      supporting_text: We demonstrated the therapeutic effect of XCL1 on the zebrafish
        myopathy model, generated by knock down of a causative gene ADSSL1.
    - reference_id: file:DANRE/adss1/adss1-uniprot.txt
      supporting_text: Component of the purine nucleotide cycle (PNC), which interconverts
        IMP and AMP to regulate the nucleotide levels in various tissues
