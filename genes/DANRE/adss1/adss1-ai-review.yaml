suggested_questions:
- question: Is zebrafish adss1 expression restricted to skeletal and cardiac muscle
    as for mammalian ADSS1, and does the ubiquitous paralog adss2 fail to compensate
    in muscle because of expression level or because of the distinct kinetic properties
    of the acidic isozyme?
- question: Does the adss1 morphant muscle-fiber phenotype reflect depletion of the
    adenine nucleotide pool (purine nucleotide cycle failure) or accumulation of IMP,
    and is it reproduced by a stable adss1 mutant?
suggested_experiments:
- description: Generate a stable adss1 null allele and compare it with the morphants,
    measuring muscle IMP, AMP, ATP and ammonia levels alongside myosin staining and birefringence,
    to determine whether the fiber disruption is a purine nucleotide cycle defect.
- description: Purify recombinant zebrafish Adss1 and measure kinetic parameters for
    IMP, aspartate and GTP, and inhibition by the muscle-relevant metabolites fumarate
    and GDP, to characterise the zebrafish enzyme directly rather than by transfer from
    human ADSS1.
