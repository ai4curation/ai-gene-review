    label: adenylosuccinate synthase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: PAINT inference from the adenylosuccinate synthetase family node PTN000217844,
      which is seeded by experimentally characterised members from bacteria (E. coli
      PurA, P0A7D4) through yeast, Dictyostelium, rodents and human ADSS1 (Q8N142).
      The reaction (IMP + L-aspartate + GTP = adenylosuccinate + GDP + phosphate)
      is the defining activity of the whole family and zebrafish adss1 retains the
      full catalytic apparatus annotated by the HAMAP rule (proton acceptor Asp42,
      proton donor His70, IMP-, GTP- and Mg2+-binding residues). Functionally, the
      zebrafish knockdown phenotype is rescued by the human ortholog whose disease
      mutations reduce this same enzymatic activity.
    action: ACCEPT
    reason: The activity arose at the root of the family and there is no sign of
      divergence or loss in the zebrafish muscle isozyme; the catalytic residues
      are conserved and the human ortholog, which complements the zebrafish knockdown,
      has measured activity. This is the core function.
