gene_symbol: adss1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Adenylosuccinate synthetase isozyme 1 (adss1, formerly adssl1) is the
  muscle-type, basic isozyme of adenylosuccinate synthetase (EC 6.3.4.4), a homodimeric,
  Mg2+-dependent cytoplasmic enzyme that condenses IMP with L-aspartate at the expense
  of GTP to form adenylosuccinate (N6-(1,2-dicarboxyethyl)-AMP). This is the first
  of the two steps that convert IMP to AMP, the second being carried out by adenylosuccinate
  lyase. In skeletal and cardiac muscle the same two reactions, together with AMP
  deaminase, form the purine nucleotide cycle, which regenerates AMP from the IMP
  produced during contraction, buffers the adenine nucleotide pool, releases ammonia
  and feeds fumarate into the citric acid cycle; ADSS1 is the isozyme dedicated to
  this cycle, whereas the ubiquitous acidic isozyme ADSS2 serves de novo purine synthesis
  in most tissues. Zebrafish adss1 is the ortholog of human ADSS1/ADSSL1. Morpholino
  knockdown of adss1 in zebrafish embryos severely disrupts skeletal muscle fibers,
  as judged by myosin staining and birefringence, and the defect is reversed by supplying
  wild-type human ADSSL1 protein; in humans, biallelic ADSSL1 mutations that reduce
  enzymatic activity cause an autosomal recessive adolescent-onset distal myopathy.
