  review:
    summary: |-
      GO defines this term as the formation of AMP from IMP; adenylosuccinate
      synthetase catalyses step 1 of that two-step conversion (UniProt PATHWAY "AMP
      from IMP: step 1/2"). The PAINT inference is seeded by human ADSS1, mouse Adss2
      and fission yeast Ade2. For the muscle isozyme the IMP substrate is largely
      regenerated from AMP by AMP deaminase (purine nucleotide cycle) rather than
      newly synthesised, but the process as defined (IMP to AMP) is the same reaction
      sequence and the enzyme does the work of it.
