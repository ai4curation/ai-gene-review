    label: dopamine metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Retain the inherited catecholamine-metabolism annotation; mechanotransduction rescue does
      not refute a parallel metabolic role.
    action: ACCEPT
    reason: The target demonstrably descends from the positive PAINT ancestor PTN000053580, with no
      intervening loss assertion identified. The older review treated failure of COMT to rescue hair-cell
      mechanotransduction and rescue by mouse TOMT-H183A as proof of metabolic divergence. Those experiments
