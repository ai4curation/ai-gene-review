references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  findings: []
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:10526320
  title: Defective calmodulin-dependent rapid apical endocytosis in zebrafish sensory hair cell mutants.
  findings:
  - statement: The study interprets rapid FM1-43 uptake as apical endocytosis; later channel-permeation
      evidence makes the specificity of that interpretation uncertain for mercury.
    supporting_text: rapid apical endocytosis in zebrafish lateral line sensory hair cells is calcium
      and calmodulin dependent
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Correct target mutant/reference; only abstract available. The assay-to-endocytosis
      inference is unresolved in light of primary channel-permeation studies, not dismissed by title
      or gene-name inference.
- id: PMID:28534737
  title: Integration of Tmc1/2 into the mechanotransduction complex in zebrafish hair cells is regulated
    by Transmembrane O-methyltransferase (Tomt).
  findings:
  - statement: Tomt is required in zebrafish hair cells for Tmc1/2 trafficking and mechanotransduction.
    supporting_text: Tomt is required for trafficking Tmc proteins to the hair bundle
- id: PMID:9491988
  title: 'Genetic analysis of vertebrate sensory hair cell mechanosensation: the zebrafish circler
    mutants.'
  findings:
  - statement: The mercury mutant class has impaired acoustic-vibrational responses and reduced microphonics,
      supporting a mechanotransduction defect.
    supporting_text: orbiter, mercury, and gemini larvae have normal hair cell morphology and yet
      do not respond to acoustic-vibrational stimuli
  full_text_unavailable: true
- id: file:DANRE/tomt/tomt-uniprot.txt
  title: UniProtKB entry A0A193KX02 for Danio rerio tomt
  findings:
  - statement: UniProt summarizes Tomt as a hair-cell mechanotransduction factor needed for TMC1/2
      trafficking.
    supporting_text: Required for transportation of TMC1 and TMC2 proteins into the mechanically
      sensitive stereocilia
- id: file:DANRE/tomt/tomt-deep-research-falcon.md
  title: Falcon deep research for Danio rerio tomt (UniProt A0A193KX02)
  findings:
  - statement: 'Falcon deep research synthesizes the Erickson 2017 eLife study and the Jung & Muller
      2023 review to conclude that

      zebrafish Tomt is a Golgi/ER secretory-pathway protein essential for hair-cell mechano-electrical
      transduction, where

      it selectively enables trafficking and bundle targeting of the Tmc1/Tmc2 MET channel subunits
      rather than acting as a

      bundle-resident structural channel component.'
    supporting_text: functions primarily in the **secretory pathway (Golgi/ER)** to enable **trafficking
