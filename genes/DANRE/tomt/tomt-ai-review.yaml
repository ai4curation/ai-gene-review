core_functions:
- description: Tomt enables selective Tmc1/Tmc2b delivery to the stereociliary mechanotransduction
    complex from the hair-cell secretory pathway. Zebrafish genetic loss and rescue establish this
    trafficking role. Mouse TOMT-TMC1 interaction and mouse active-site-mutant rescue support a chaperone/trafficking-facilitator
    model; a specific zebrafish chaperone molecular activity has not been directly demonstrated.
    Inherited methyltransferase annotations remain distinct from this experimentally established
    sensory role, with native physiological substrate unresolved.
