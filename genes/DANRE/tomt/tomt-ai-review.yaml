suggested_questions:
- question: What is the physiological methyl-acceptor substrate of Tomt in hair cells, if any, and
    is methyl transfer required for Tmc trafficking?
- question: Does Tomt act as a dedicated TMC chaperone in the secretory pathway, or does it more
    broadly assist folding/trafficking of other MET-complex membrane proteins?
- question: Does PMID:10526320 show a Tomt/mercury endocytic defect independently of rapid FM1-43
    entry through mechanotransducer channels?
suggested_experiments:
