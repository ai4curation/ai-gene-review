- term:
    id: GO:0006897
    label: endocytosis
  evidence_type: IMP
  original_reference_id: PMID:10526320
  review:
    summary: The endocytosis interpretation requires separation of vesicle uptake from dye permeation
      through MET channels.
    action: UNDECIDED
    reason: PMID:10526320 interpreted reduced rapid FM1-43 loading in mercury mutants as defective
      apical endocytosis. Only its abstract is cached. Subsequent primary work demonstrates FM1-43
      permeation through hair-cell mechanotransducer channels, and PMID:28534737 directly establishes
      the target-specific MET defect and uses FM dyes as channel-function readouts. Thus reduced labeling
      does not itself establish reduced vesicle internalization. This is a concrete assay-interpretation
      conflict, not proof that Tomt cannot participate in endocytosis; retain UNDECIDED pending full-text
      assessment of independent endocytic evidence in the original experiments.
    supported_by:
    - reference_id: PMID:10526320
      supporting_text: rapid apical endocytosis in zebrafish lateral line sensory hair cells is calcium
        and calmodulin dependent
    - reference_id: PMID:11549711
      supporting_text: FM1-43 behaves as a permeant blocker of the mechanotransducer channel.
    - reference_id: PMID:28534737
      supporting_text: Tomt-deficient hair cells have no evoked MET current and do not label with MET
        channel permeant FM dyes
