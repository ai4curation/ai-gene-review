  original_reference_id: GO_REF:0000033
  review:
    summary: Retain the developmental annotation as inherited or experimentally curated participation
      in sensory-cell maturation.
    action: ACCEPT
    reason: Tomt supplies the functional Tmc-trafficking machinery of sensory hair cells. Normal gross
      morphology and rapid rescue in mature cells narrow the phenotype to mechanotransduction, but
      do not exclude contribution to functional differentiation or neuromast development. The developmental
      IBA is inherited from an actual ancestor, not a label-only transfer. For the older IMP rows,
      the abstract-only source limits independent reconstruction of the developmental assay, so the
      curator-established assertion is retained with corroborating target mechanistic evidence rather
      than rejected because a title or abstract emphasizes another outcome.
    supported_by:
    - reference_id: PMID:28534737
      supporting_text: Tomt is required for trafficking Tmc proteins to the hair bundle
