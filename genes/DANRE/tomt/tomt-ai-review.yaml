id: A0A193KX02
gene_symbol: tomt
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Tomt (mercury) is a membrane-associated protein enriched in the Golgi of zebrafish sensory
  hair cells, with additional reported endoplasmic-reticulum and basolateral membrane localization.
  It enables selective delivery of Tmc1 and Tmc2b to the stereociliary mechanotransduction complex
  and is required for hearing and balance. Its catechol O-methyltransferase-family domain supports
  inferred methyltransferase activity, but the endogenous methyl-acceptor substrate is unresolved.
  Mouse TOMT active-site-mutant rescue and the failure of zebrafish Comt to substitute show that
  the hair-cell trafficking role is separable from canonical catecholamine metabolism; they do not
  establish that native zebrafish Tomt lacks methyltransferase activity.
