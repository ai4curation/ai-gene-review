suggested_questions:
- question: Is the gria1b cytoplasmic tail still phosphorylated by CaMKII/PKC or PKA at nearby residues, and does its
    divergence change synaptic delivery or plasticity of receptors containing it?
- question: Is gria1b expressed in the inner ear and in non-neural tissues (ovary, spleen, gill) as protein, and does
    gar GRIA1 share these domains?
suggested_experiments:
- hypothesis: The diverged gria1b tail makes gria1b-containing receptors insensitive to the CaMKII/PKA regulation that
    acts on gria1a.
  description: Express gria1a and gria1b (alone and with gria2) in HEK cells or zebrafish neurons; test phosphorylation
    with phospho-specific assays and measure single-channel conductance and open probability with and without active
    CaMKII or PKA.
  experiment_type: electrophysiology
- hypothesis: gria1b has an otic vesicle expression domain absent from gria1a.
  description: Paralog-specific HCR in situ of gria1a and gria1b in the otic vesicle and inner ear at 24-72 hpf and in
    adult tissues, with gar GRIA1 as outgroup.
  experiment_type: expression analysis
