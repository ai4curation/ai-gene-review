    label: postsynaptic density membrane
  in_complex:
    id: GO:0032281
    label: AMPA glutamate receptor complex
  supported_by:
  - reference_id: file:DANRE/gria1a/gria1a-bioinformatics/RESULTS.md
    supporting_text: Both copies keep the six glutamate-binding residues, the pore loop and M2-M3 segment, and both palmitoylation
      cysteines of human GRIA1.
  - reference_id: file:DANRE/gria1a/gria1a-bioinformatics/RESULTS.md
    supporting_text: gria1b has changed significantly faster than gria1a since the duplication (86 vs 34 unique changes
      relative to gar).
  - reference_id: file:DANRE/gria1a/gria1a-bioinformatics/RESULTS.md
    supporting_text: Most in situ domains are shared; telencephalon, dorsal thalamus, rhombomeres, spinal cord and retinal
      ganglion cells are recorded for gria1a only and otic vesicle for gria1b only.
  - reference_id: PMID:20716669
    supporting_text: Native GluA1 subunits undergo regulated phosphorylation at two sites (Ser831 and Ser845) in their
      C-terminal tails
