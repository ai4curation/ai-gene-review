gene_symbol: gria1b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: gria1b (glutamate receptor, ionotropic, AMPA 1b) is one of two zebrafish co-orthologs of vertebrate
  GRIA1 (GluA1), retained from the teleost-specific genome duplication; its paralog is gria1a. It encodes an AMPA-type
  ionotropic glutamate receptor subunit that, by homology, forms tetrameric glutamate-gated cation channels at
  excitatory postsynaptic sites. The ligand-binding residues, channel pore and M2-M3 gating segment are identical to
  those of gria1a and human GRIA1, but gria1b has evolved faster than gria1a since the duplication, most visibly in its
  cytoplasmic tail, where it lacks serines matching the mammalian CaMKII/PKC (S831) and PKA (S845) phosphorylation
  sites. gria1b is expressed in many of the same neuronal populations as gria1a in the developing brain, retina and
  spinal cord, at lower levels in larvae, with an additional otic vesicle domain and RNA-seq signal in ovary, spleen
  and gill. No loss-of-function study of gria1b alone has been reported.
