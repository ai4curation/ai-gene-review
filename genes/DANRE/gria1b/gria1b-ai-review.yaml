core_functions:
- description: AMPA-type ionotropic glutamate receptor subunit (GluA1 co-ortholog) that, by homology, forms tetrameric
    glutamate-gated cation channels in the postsynaptic density membrane of excitatory synapses. Ligand-binding and pore
    residues are conserved; the cytoplasmic tail has diverged, lacking serines at the positions of the mammalian
    CaMKII/PKC and PKA regulatory sites. Function not measured.
  molecular_function:
    id: GO:1904315
    label: transmitter-gated monoatomic ion channel activity involved in regulation of postsynaptic membrane potential
