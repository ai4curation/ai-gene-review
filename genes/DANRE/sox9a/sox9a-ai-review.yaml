suggested_questions:
- question: Do Sox9a and Sox9b differ in transactivation strength or partner choice (e.g. with Sox5/Sox6
    or other cofactors), given that divergence between the copies is concentrated outside the HMG box?
- question: Is the absence of a cardiac role for sox9a an expression-level loss (no cardiac cis-regulatory
    elements) or would Sox9a protein substitute for Sox9b if expressed in the heart?
- question: Which Sox9 copy did the Ewsa co-immunoprecipitation (PMID:25617839) detect, given a commercial
    anti-SOX9 antibody was used?
suggested_experiments:
- description: 'Cross-rescue: express sox9a coding sequence from sox9b regulatory elements (knock-in or
    BAC) in sox9b fh313 mutants and test rescue of ductal, cardiac and cartilage phenotypes, to separate
    expression partition from protein divergence.'
- description: Compare genome-wide occupancy (ChIP-seq/CUT&RUN) of tagged Sox9a and Sox9b in the same
    cell type (e.g. pharyngeal chondrocytes) to test whether target specificity differs.
