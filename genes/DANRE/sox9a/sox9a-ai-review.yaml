id: Q9DFH2
gene_symbol: sox9a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'Sox9a is one of two zebrafish co-orthologs of vertebrate SOX9, produced by the teleost-specific
  genome duplication. It is an SRY-related HMG-box (SoxE group) transcription factor: its HMG box binds
  the Sox consensus DNA motif and a central transactivation region activates transcription of target genes
  such as col2a1a and col11a2. Sox9a is expressed in cranial neural crest-derived chondrogenic mesenchyme
  of the neurocranium and pharyngeal arches, the pectoral girdle (scapulocoracoid), otic placode, hindbrain
  glial progenitors and, in adults, in many tissues including testis Sertoli cells. It is essential for
  chondrocyte differentiation and for the stacking and shaping of cartilage condensations: sox9a (jellyfish)
  mutants lack most craniofacial and pectoral girdle cartilage. It also contributes, partly redundantly
  with sox9b, dlx3b/dlx4b and sox10, to otic placode and inner ear development, and is required for oligodendrocyte
  progenitor and astroglial development in the hindbrain. The two co-orthologs share a near-identical
  HMG box but divide the ancestral SOX9 expression domains between them.'
