- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IMP
  original_reference_id: PMID:12397114
  qualifier: located_in
  supporting_entities:
  - ZFIN:ZDB-GENO-980202-938
  review:
    summary: 'IMP: cytoplasm, from Yan et al. 2002 (jef mutant / splice-blocking morpholinos).'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The observation in the cited paper concerns the sox9a mRNA, not the protein: splice-blocking
      morpholinos caused unspliced sox9a transcript to accumulate in the nucleus, which the authors used
      as an assay for morpholino efficacy. That is transcript processing/export, not where the Sox9a protein
      acts. Independent work (Sun et al. 2013) reports a regulated cytoplasmic pool of Sox9a protein in
      juvenile gonad stromal cells alongside nuclear Sox9a, so a cytoplasmic location is not impossible,
      but Sox9a executes its transcription-factor function in the nucleus and the cited evidence does
      not support the protein-level claim. Marked as over-annotation rather than removed because of the
      independent gonadal data.'
    supported_by:
    - &id005
      reference_id: PMID:12397114
      supporting_text: Inhibiting splicing of the sox9a transcript in wild-type embryos with splice site-directed
        morpholino antisense oligonucleotides produced a phenotype like jef mutant larvae, and caused
        sox9a transcript to accumulate in the nucleus
    - &id006
      reference_id: PMID:24263104
      supporting_text: After MKI treatment, levels of sox9a and p-Erk1/2 were dramatically decreased in
        the cytoplasm, whereas nuclear sox9a and p-Erk1/2 showed little reduction.
