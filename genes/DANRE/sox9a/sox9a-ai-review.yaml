  review:
    summary: 'IBA: heart development (PTN002910118; zebrafish donor is sox9b, ZDB-GENE-001103-2).'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The cardiac role of the ancestral SOX9 gene went to sox9b in zebrafish: sox9b is required
      for proepicardium, epicardium and valve formation, whereas an effective sox9a morpholino did not
      cause cardiac malformations. The IBA propagates the function to both co-orthologs, which is correct
      for the ancestral node but not supported for sox9a, which appears to have lost this subfunction
      by expression partition. Morpholino negative evidence is not conclusive, so this is marked as an
      over-annotation rather than removed.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002910118
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral SOX9 node; the cardiac role is sound for the node and for sox9b, but after
          the TGD the cardiac expression domain appears to have been retained only by sox9b.
      - source_id: ZFIN:ZDB-GENE-001103-2
        source_label: sox9b
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Paralog donor with IMP evidence for proepicardium, epicardium and valve development;
          the sox9a morpholino control in the same study showed no cardiac defect.
    supported_by:
    - reference_id: PMID:23775563
      supporting_text: Knock down of sox9a expression did not cause cardiac malformations, or defects
        in epicardium development.
    - reference_id: PMID:23775563
      supporting_text: Furthermore, sox9b is required for PE, epicardium, and valve formation.
    - reference_id: PMID:15689370
      supporting_text: Analysis of mutant phenotypes strongly supports the interpretation that ancestral
        gene functions partitioned spatially and temporally between Sox9 co-orthologs.
