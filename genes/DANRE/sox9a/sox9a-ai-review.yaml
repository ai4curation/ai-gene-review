- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:11180959
  review:
    summary: 'Proposed: Sox9a is a sequence-specific transcriptional activator.'
    action: NEW
    reason: Chiang et al. 2001 showed that both zebrafish Sox9 proteins bind HMG consensus DNA and mapped
      a transactivation domain in the middle of each protein; the title describes them as similar transcription
      activators. Sox9a is required for expression of the SOX9 target genes col2a1 and col11a2. This refines
      the accepted GO:0000981 IBA. Proposed identically for sox9b, since the evidence covers both proteins.
    supported_by:
    - *id001
    - *id002
    - reference_id: PMID:19210963
      supporting_text: After the sox9 gene duplication event, regulatory elements controlling the expression
        of sox9 co-orthologs apparently partitioned in a tissue-specific fashion, but the Sox9 proteins
        encoded by sox9a and sox9b retained the ability to regulate col11a2, presumably by binding to
        regulatory sites for the col11a2 gene.
