id: Q7ZWE9
gene_symbol: cmpk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: cmpk encodes UMP-CMP kinase (EC 2.7.4.14), a 196-residue soluble enzyme of the adenylate kinase family that transfers the gamma-phosphate of ATP to pyrimidine nucleoside monophosphates, producing UDP from UMP, CDP from CMP and dCDP from dCMP. It is built from a central CORE domain with peripheral NMPbind and LID domains that close over the phosphoryl transfer site during catalysis, and it is distributed between the cytoplasm and the nucleus. By generating pyrimidine nucleoside diphosphates it supplies the immediate precursors for the triphosphates used in RNA and DNA synthesis, and it also displays a broad, secondary nucleoside diphosphate kinase activity.
