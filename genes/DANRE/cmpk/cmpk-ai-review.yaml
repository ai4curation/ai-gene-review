references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: Cmpk matches InterPro signatures IPR000850 (adenylate kinase / UMP-CMP kinase) and IPR006266 (UMP-CMP kinase); the InterPro2GO mapping assigns ATP binding (GO:0005524), nucleobase-containing compound kinase activity (GO:0019205), phosphotransferase activity, phosphate group as acceptor (GO:0016776), and 'de novo' pyrimidine nucleobase biosynthetic process (GO:0006207).
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings:
  - statement: EC 2.7.4.6 (nucleoside-diphosphate kinase), one of the EC numbers assigned to Cmpk via HAMAP-Rule MF_03172, maps to nucleoside diphosphate kinase activity (GO:0004550).
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator judgment of sequence similarity
  findings:
  - statement: Nucleoside diphosphate kinase activity (GO:0004550) was transferred to Cmpk by curator-judged sequence similarity to human UMP-CMP kinase CMPK1 (UniProtKB:P30085).
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: Phylogenetic inference within PANTHER family PTN000599579 supports involvement of Cmpk in CDP biosynthetic process (GO:0046705) and UDP biosynthetic process (GO:0006225) and localization to the nucleus (GO:0005634).
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: The ARBA machine-learning model ARBA00033496 predicts nucleoside monophosphate kinase activity (GO:0050145) for Cmpk.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: UniRule rule UR000111469 assigns Cmpk UMP kinase (GO:0033862), CMP kinase (GO:0036430), and dCMP kinase (GO:0036431) activities, pyrimidine nucleotide biosynthetic process (GO:0006221), and nucleus (GO:0005634) and cytoplasm (GO:0005737) localization.
- id: PMID:11912132
  title: Characterization of human UMP/CMP kinase and its phosphorylation of D- and L-form deoxycytidine analogue monophosphates.
  findings:
  - statement: UMP/CMP kinase forms UDP, CDP and dCDP for nucleic acid synthesis.
    supporting_text: plays a crucial role in the formation of UDP, CDP, and dCDP, which are required for cellular nucleic acid synthesis
  - statement: UMP and CMP are much better substrates than dCMP.
    supporting_text: UMP and CMP proved to be far better substrates than dCMP
  - statement: The human enzyme localizes predominantly to the cytoplasm.
    supporting_text: UMP/CMPK localized predominantly to the cytoplasm
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches the cached PubMed record. Human CMPK1 (the ISS/IBA donor), not zebrafish; used for substrate preference, donor specificity and localization of the ortholog. Abstract-only cache.
- id: PMID:10462544
  title: 'Phosphorylation of deoxycytidine analog monophosphates by UMP-CMP kinase: molecular characterization of the human enzyme.'
  findings:
  - statement: Recombinant human UMP-CMP kinase phosphorylates CMP, dCMP and UMP most efficiently.
    supporting_text: the recombinant UMP-CMP kinase phosphorylated CMP, dCMP, and UMP with highest efficiency and dUMP, AMP, and dAMP with lower efficiency
  - statement: A GFP fusion of the human enzyme localized to cytosol and nucleus.
    supporting_text: the fusion protein was located in the cytosol and nucleus
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches PubMed; human ortholog cloning and characterization, cited for substrate range and the cytosol/nucleus localization that the nucleus and cytoplasm annotations rest on. Abstract-only cache.
- id: PMID:23416111
  title: The human adenylate kinase 9 is a nucleoside mono- and diphosphate kinase.
  findings:
  - statement: Adenylate kinase family members show an additional nucleoside diphosphate kinase activity producing triphosphates.
    supporting_text: in addition to the diphosphate products, a nucleoside diphosphate kinase (NDPK) activity was also present with subsequent triphosphates formed
  - statement: Previously characterized adenylate kinases share this broad phosphotransferase activity.
    supporting_text: A number of previously characterized adenylate kinases were also tested and found to possess a broad phosphotransferase activity similar to AK9
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches PubMed. This is the paper behind the human CMPK1 IDA for nucleoside diphosphate kinase activity; the abstract reports the broad NDPK activity for previously characterized adenylate kinases tested alongside AK9, which is why the secondary activity is kept but not treated as core. Abstract-only cache.
