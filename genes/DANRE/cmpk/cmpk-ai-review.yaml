  findings:
  - statement: Zebrafish Q7ZWE9 is the cytosolic CMPK1-type kinase and must not be conflated with the mitochondrial paralog CMPK2.
    supporting_text: zebrafish Q7ZWE9 should **not** be automatically assumed to be mitochondrial like CMPK2, because CMPK2 mitochondrial localization relies on a specific N-terminal targeting signal and represents a separate paralogous family with different substrate preferences.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Generated literature survey; retained only for the cmpk1/cmpk2 paralog disambiguation, which is its one contribution not already covered by UniProt or the primary human ortholog papers. It found no primary zebrafish cmpk literature, consistent with our own PubMed search.
