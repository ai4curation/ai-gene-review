suggested_questions:
- question: Does zebrafish Cmpk show the same UMP/CMP preference over dCMP as the human ortholog, and does it retain measurable nucleoside diphosphate kinase activity in vivo or only as in vitro promiscuity?
- question: Is Cmpk predominantly nuclear, as the HAMAP rule states, or predominantly cytoplasmic, as reported for the human enzyme? No zebrafish localization data exist and the two ortholog studies disagree on the dominant compartment.
suggested_experiments:
- hypothesis: Recombinant zebrafish Cmpk phosphorylates UMP, CMP, and dCMP with a preference for UMP and CMP, consistent with the UMP-CMP kinase subfamily.
  description: Express and purify recombinant Cmpk and assay phosphate-transfer activity against UMP, CMP, dCMP, and a panel of nucleoside diphosphates, determining kcat/Km for each substrate to define in vitro substrate preference.
- hypothesis: Loss of cmpk depletes pyrimidine (deoxy)nucleotide pools and impairs cell proliferation in the developing embryo.
  description: Generate a cmpk loss-of-function zebrafish line (CRISPR/Cas9) and quantify nucleotide pools and proliferation/apoptosis markers in early embryos relative to wild type.
- hypothesis: Cmpk localizes to both the nucleus and cytoplasm, as predicted by UniRule and phylogenetic annotation.
  description: Express a fluorescently tagged Cmpk fusion in zebrafish cells or embryos and image subcellular distribution to confirm nuclear and cytoplasmic localization.
