suggested_questions:
- question: Does gad1a expression rise in gad1b null mutants (transcriptional adaptation), and how much GABA remains in
    gad1b mutant brains?
- question: Why does the gad1b translation-blocking morpholino cause craniofacial defects that gad1b null mutants
    lack - off-target effects, knockdown of gad1a, or compensation in the mutant?
suggested_experiments:
- hypothesis: gad1b supplies most GABA in the larval brain, with gad1a and gad2 providing a residual pool.
  description: Measure brain GABA by HPLC or mass spectrometry in gad1b, gad2, gad1a single and combined mutants, and
    record gad1a and gad2 mRNA levels in gad1b mutants.
  experiment_type: genetic interaction
- hypothesis: Zebrafish Gad1b is constitutively active like mammalian GAD67.
  description: Express recombinant Gad1b and measure glutamate decarboxylase kinetics and PLP saturation, alongside
    Gad1a.
  experiment_type: biochemical assay
