  label: Danio rerio
description: gad1b (glutamate decarboxylase 1b; formerly gad1 or GAD67) is one of two zebrafish co-orthologs of
  vertebrate GAD1, retained from the teleost-specific genome duplication; its paralog is gad1a. It encodes a
  pyridoxal 5'-phosphate-dependent group II decarboxylase that converts L-glutamate to the inhibitory
  neurotransmitter GABA in the cytoplasm of GABAergic neurons. The protein is 83% identical to human GAD1 and keeps
  its PLP-binding lysine and GABA-binding residues. gad1b is the dominant, pan-GABAergic gad1 copy, expressed from
  pharyngula stages in GABAergic neurons throughout the brain, retina and spinal cord (including Kolmer-Agduhr
  neurons, Purkinje cells and lateral-line efferent neurons), and it is the classic zebrafish GAD67 marker. gad1b
  null mutants and morphants show abnormal, seizure-like brain activity and increased locomotion, consistent with
  reduced GABA synthesis.
