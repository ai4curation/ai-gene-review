    summary: Glutamate decarboxylase activity propagated from the GAD node PTN002903772, seeded by fly Gad1, rodent
      Gad1/Gad2 and human GAD1.
    action: ACCEPT
    reason: gad1b is a GAD1 co-ortholog inside the node's clade, keeps the PLP-binding lysine and GABA-binding
      residues, and its expression coincides with GABA immunoreactivity in the embryo. The zebrafish enzyme has not
      been assayed in vitro, but the null mutant phenotype (seizure-like brain activity, like the GABA-A antagonist
      PTZ) fits loss of GABA synthesis.
