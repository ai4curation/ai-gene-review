core_functions:
- description: Pyridoxal 5'-phosphate-dependent glutamate decarboxylase (GAD67-type) that synthesizes GABA from
    L-glutamate in the cytoplasm of GABAergic neurons; the dominant, pan-GABAergic gad1 copy in zebrafish embryos and
    larvae. Loss of gad1b gives seizure-like brain activity.
