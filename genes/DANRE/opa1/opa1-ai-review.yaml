suggested_questions:
- question: Does zebrafish Opa1 undergo the same OMA1/YME1L-dependent L-to-S processing
    as mammalian OPA1, and which of the isoform-specific bands lost in morphants correspond
    to L- and S-Opa1?
- question: Is the deep-node microtubule/peroxisome-fission inheritance retained or lost
    at the OPA1 branch (PTN007514526)? A PAINT-level decision would resolve the two
    UNDECIDED IBA rows on this gene.
suggested_experiments:
- description: Express purified zebrafish S-Opa1 and test cardiolipin- and phosphatidic-acid-stimulated
    GTP hydrolysis and liposome tubulation, to convert the ISS lipid-binding and tubulation
    rows into direct target evidence.
- description: Generate a stable opa1 mutant (CRISPR) and image mitochondrial morphology
    and cristae by EM in cardiomyocytes and retinal ganglion cells, separating primary
    mitochondrial defects from morpholino-associated developmental delay.
