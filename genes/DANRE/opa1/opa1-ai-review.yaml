- id: file:DANRE/opa1/opa1-deep-research-falcon.md
  title: Falcon deep research report on Danio rerio opa1 (Q5U3A7)
  findings:
  - statement: Synthesis of zebrafish-specific and cross-species evidence concludes
      that Q5U3A7 is a mitochondrial inner-membrane dynamin-like GTPase whose primary
      function is GTP-dependent membrane remodeling at the inner membrane and cristae,
      mediating inner-membrane fusion after mitofusin-dependent outer-membrane fusion.
    supporting_text: OPA1 is a **TRAFAC class dynamin-like GTPase** that localizes
      to mitochondria and is essential for **IMM fusion**, acting after outer mitochondrial
      membrane (OMM) fusion mediated by mitofusins (MFN1/MFN2).
    reference_section_type: OTHER
  - statement: OPA1 is not a small-molecule metabolic enzyme; its catalytic activity
      is GTP hydrolysis coupled to conformational changes that power membrane remodeling,
      tethering, and fusion.
    supporting_text: its catalytic activity is **GTP hydrolysis (GTP → GDP + Pi)**,
      coupled to conformational changes that power membrane remodeling, tethering,
      and fusion.
    reference_section_type: OTHER
  - statement: OPA1 is a key regulator of crista morphogenesis and maintenance, acting
      in coordination with the MICOS complex (e.g., MIC60) to control crista junction
      width, stability, and lumen shape; OPA1 deficiency causes fragmented mitochondria
      and abnormal cristae.
    supporting_text: OPA1 is a key regulator of **crista morphogenesis and maintenance**,
      and OPA1 deficiency causes fragmented mitochondria and abnormal cristae.
    reference_section_type: OTHER
  - statement: The long membrane-anchored form (L-OPA1) and the short soluble intermembrane-space
      form (S-OPA1) arise through regulated proteolysis by OMA1 (S1) and YME1L (S2),
      and the protease-controlled L/S balance is a primary regulatory lever responding
      to cellular stress.
    supporting_text: OPA1 exists as **long (L-OPA1)** and **short (S-OPA1)** isoforms;
      **OMA1** cleaves at S1 and **YME1L** at S2.
    reference_section_type: OTHER
  - statement: OPA1 is localized to the inner mitochondrial membrane, where the long
      form is membrane-anchored and the short form is soluble in the intermembrane
      space.
    supporting_text: OPA1 is localized to the **inner mitochondrial membrane (IMM)**,
      where the long form is membrane-anchored and the short form is soluble in the
      intermembrane space.
    reference_section_type: OTHER
