  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The ancestral peroxisome fission inference remains unresolved for zebrafish
      Opa1.
    action: UNDECIDED
    reason: Independent PANTHER v19 tree retrieval places Q5U3A7 below PTN008520527
      and OPA1 node PTN007514526. Current PAINT has the corresponding IBD at PTN008520527;
      this is an ancestral claim, not a pairwise transfer invalidated by a different
      donor name. The shared EAT-3 OpenScientist report identifies native IMS topology
      and domain divergence as mechanistic concerns. These are relevant biological
      arguments, but the report does not resolve loss of this ancestrally placed function
      in OPA1. A negative assay is not required to reject an IBA; here the lineage
      and domain premises offered for rejection did not withstand independent checks.
      Preserve uncertainty pending adjudication of inheritance or loss in the OPA1
      clade. Moreover, PMID:32228866 Fig. 1A explicitly identifies an OPA1 middle
      domain and GED, contradicting the report's inference of GED loss from missing
      database domain labels.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
