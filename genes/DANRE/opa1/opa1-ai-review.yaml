  title: Tom70 serves as a molecular switch to determine pathological cardiac hypertrophy.
  findings:
  - statement: Tom70-dependent import of optic atrophy-1 links mitochondrial import to 
      cardiomyocyte stress responses.
    supporting_text: The defective mitochondrial import of Tom70-targeted optic atrophy-1 
      triggered intracellular oxidative stress
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text now fetched and read. Fig. 6H directly assays Opa1 loss in 
      zebrafish ventricular myocytes despite the Tom70-focused title.
