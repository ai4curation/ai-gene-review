  review:
    summary: PAINT places GTPase activity at the deep dynamin-superfamily node PTN000170013;
      zebrafish Opa1 retains the intact dynamin-type G domain (residues 291-567) and
      the reaction is recorded on the target record.
    action: ACCEPT
    reason: The IBA is an ancestral claim for the whole dynamin/Fzo/YdjA family, and
      GTP hydrolysis is the one activity every member of that family shares. Zebrafish
      Opa1 descends from PTN000170013 through the OPA1 node PTN007514526 (lineage verified
      in the 2026-09-20 re-review), carries the complete G domain, and its own record
      lists the Rhea:19669 reaction. Human OPA1 GTP hydrolysis is measured directly and
      is stimulated by cardiolipin liposomes (PMID:20185555), and GTP binding drives the
      power-stroke conformational change in the S-OPA1 structure (PMID:32228866). The
      same term is already accepted from the IEA and ISS rows; the action is kept consistent.
    supported_by:
    - *id004
    - reference_id: PMID:20185555
      supporting_text: OPA1-S1 associates strongly with liposomes containing 25% phosphatidic
        acid (POPA) or 25% phosphoserine (POPS)
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000170013
        source_status: SUPPORTS_TRANSFER
        comment: Deep dynamin-superfamily node; verified ancestor of the zebrafish leaf
          PTN000170160. GTP hydrolysis is family-wide and target-confirmed by the
          intact G domain.
      - source_id: UniProtKB:O60313
        source_status: SUPPORTS_TRANSFER
        comment: Human OPA1 GTPase activity measured directly (PMID:20185555); the
          target appearing among IBA sources is expected, not circular.
