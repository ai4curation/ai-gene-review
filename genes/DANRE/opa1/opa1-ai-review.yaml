- term:
    id: GO:0032740
    label: positive regulation of interleukin-17 production
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: Opa1 has a conserved, context-specific role in supporting IL-17 production.
    action: KEEP_AS_NON_CORE
    reason: The actual ISS donor is mouse Opa1 P58281, with IMP evidence from 
      PMID:36171294. Its T-cell-specific deletion reduces IL-17A independently of cell 
      division, early activation, and restored respiration; OPA1-dependent metabolic 
      signaling therefore supports cytokine output. Ortholog transfer to zebrafish is 
      plausible but remains an inference, and this immune context is noncore relative to 
      membrane remodeling.
    supported_by:
    - &id003
      reference_id: PMID:36171294
      supporting_text: Thus, OPA1 sustains cytokine production in TH17 cells in vitro, but
        not early differentiation events associated with transcription factor expression.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:P58281
        source_status: SUPPORTS_TRANSFER
        comment: Live QuickGO donor IMP PMID:36171294 and full primary verified; supports 
          OPA1-dependent IL-17 production. Target immune context is inferred.
