- id: PMID:23516612
  title: Opa1 is required for proper mitochondrial metabolism in early development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached full-text record (PMC3597633). Primary
      zebrafish study; both translation-blocking and splice-blocking morpholinos
      gave fragmented mitochondria, reduced basal respiration and developmental
      delay with small eyes, edema and cardiac deficits. Supports mitochondrion
      organization directly and the developmental terms as downstream requirements.
  findings:
  - statement: Opa1 depletion in zebrafish disrupts mitochondrial morphology and development.
    supporting_text: Opa1 catalyzes fusion of inner mitochondrial membranes and formation
      of the cristae
    reference_section_type: ABSTRACT
  - statement: Zebrafish opa1 is a single-copy, ubiquitously expressed gene whose
      protein is 78% identical to the most abundant human OPA1 isoform (OPA1-4), supporting
      orthology-based functional interpretation of Q5U3A7.
    supporting_text: as a single-copy gene and is 78% identical and 87% similar to
      the most abundant human OPA1 isoform (OPA1-4) at the protein level
    reference_section_type: INTRODUCTION
  - statement: Morpholino-mediated opa1 knockdown produced multi-system developmental
      phenotypes including small eyes and small pectoral fin buds plus cardiac/circulatory
      defects, consistent with a core role for Opa1 in mitochondrial function during
      development.
    supporting_text: small eyes and small pectoral fin buds
    reference_section_type: RESULTS
  - statement: Opa1 morphants showed significantly decreased total basal respiration
      with increased respiratory control ratio, indicating Opa1 is required for proper
      developmental bioenergetic output.
    supporting_text: Total basal respiration was significantly decreased in Opa1 morphants
      when compared to MMC morphants at 24 and 72 hpf
    reference_section_type: RESULTS
