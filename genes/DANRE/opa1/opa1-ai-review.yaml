id: Q5U3A7
gene_symbol: opa1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Opa1 is a mitochondrial dynamin-like GTPase that couples GTP hydrolysis to 
  inner-membrane fusion and cristae remodeling. Membrane-anchored long and soluble 
  intermembrane-space forms cooperate in membrane remodeling. In zebrafish, opa1 depletion
  disrupts mitochondrial morphology and respiration and impairs embryonic development and 
  ventricular cardiomyocyte growth.
