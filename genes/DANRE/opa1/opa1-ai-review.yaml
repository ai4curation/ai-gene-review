      intermembrane space, which lie inside the cytoplasm as GO defines it.
    action: MODIFY
    reason: GO:0005737 cytoplasm is defined as the cell contents excluding plasma membrane
      and nucleus but including other subcellular structures, so the statement is not
      false for a mitochondrial protein. It is, however, a placement made for a node that
      unites cytosolic dynamins, DRP1, mitofusins and Mx proteins, and it says nothing
      about where Opa1 actually works. The zebrafish record gives an N-terminal
      mitochondrial transit peptide, a single inner-membrane transmembrane helix and an
      intermembrane-space topology for the entire GTPase/stalk region (residues 113-776),
      and the OPA1-node IBA already asserts mitochondrial membrane and intermembrane
      space. The informative term is mitochondrial inner membrane (with the IMS for the
      short form), both already annotated; the generic cytoplasm row adds no information
      and should be replaced by the specific location.
    supported_by:
    - reference_id: file:DANRE/opa1/opa1-uniprot.txt
      supporting_text: inner mitochondrial membrane, and the short soluble form
    - reference_id: file:DANRE/opa1/opa1-uniprot.txt
      supporting_text: cleavage and localizes in the intermembrane space.
    proposed_replacement_terms:
    - id: GO:0005743
      label: mitochondrial inner membrane
    - id: GO:0005758
      label: mitochondrial intermembrane space
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000170013
        source_status: SUPPORTS_TRANSFER
        comment: Verified ancestor of the zebrafish leaf; the cytoplasm claim is true
          by definition for mitochondrial proteins but is the lowest common denominator
          of a node spanning cytosolic and organellar dynamins.
- term:
    id: GO:0005874
    label: microtubule
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT5G42080
  - PANTHER:PTN000170013
  - UniProtKB:P50570
  - WB:WBGene00001130
  review:
    summary: The is_active_in microtubule IBA descends from the same deep dynamin node
      PTN000170013 as the microtubule binding row; the target's whole GTPase region is
      topologically confined to the mitochondrial intermembrane space.
    action: UNDECIDED
    reason: This row is the cellular-component counterpart of the microtubule binding
      IBA reviewed above, placed by PAINT at PTN000170013 with classical dynamin (human
      DNM1 P50570, worm dyn-1) and an Arabidopsis DRP donor. The 2026-09-20 re-review
      verified that PTN000170013 is a genuine ancestor of the OPA1 clade, so the
      inference is an ancestral claim and not a mis-targeted pairwise transfer. Against
      it, the zebrafish record places residues 113-776 and 788-966, i.e. the entire
      GTPase, stalk and paddle, in the mitochondrial intermembrane space behind the
      outer membrane, and the S-OPA1 structure shows the same machinery assembled on
      lipid membranes (PMID:32228866); none of the cached primary literature reports
      Opa1 at microtubules. Being active in a cytosolic microtubule is difficult to
      reconcile with that topology, but the prior adjudication kept the paired
      microtubule-binding row UNDECIDED pending an explicit inheritance-or-loss
      decision at the OPA1 branch, and the two rows should be decided together. The
      action therefore stays UNDECIDED, with the topological objection recorded as the
      reason a curator would most likely resolve it against transfer.
    supported_by:
    - reference_id: file:DANRE/opa1/opa1-uniprot.txt
      supporting_text: inner mitochondrial membrane, and the short soluble form
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000170013
        source_status: UNRESOLVED
        comment: Verified ancestor of the zebrafish leaf PTN000170160 through OPA1 node
          PTN007514526. Microtubule association is credible for the classical-dynamin
          donors; inheritance versus loss at the OPA1 branch is unresolved, and target
          topology (IMS-facing GTPase region) argues against a cytosolic microtubule
          location.
