knowledge_gaps:
- gap_statement: >-
    The endogenous biological processes and substrate partitioning of zebrafish
    abhd10b relative to its teleost whole-genome duplication paralog abhd10a—in
    particular whether abhd10b regulates mitochondrial redox homeostasis via
    Prdx5 or germ-cell mitochondrial sheath organization—have not been
    experimentally determined.
  boundary: >-
    Molecular function (GO:0008474) and mitochondrial localization (GO:0005739) are phylogenetically
    supported via PANTHER node PTN001043685 and active-site conservation (Ser136-Asp233-His263), whereas
    organismal and cellular biological process roles in Danio rerio are wholly unassayed. An OpenScientist
    run (kgap-abhd10b-paralog-divergence) refutes the substrate half of this gap and leaves the process
    half untouched, and it does so by failing a test it set up to be falsifiable. The ohnolog relationship
    is confirmed rather than assumed, by double-conserved synteny: tagln3a/tagln3b, gtf3aa/gtf3ab and
    wasf3a/wasf3b each have one copy flanking each locus, and the human ABHD10-TAGLN3-TMPRSS7
    microsyntenic block is retained in both copies. Every sequence-accessible test that would make a
    divergence-of-function reading credible then came back negative or symmetric. Both paralogs keep a
    complete Ser-Asp-His triad, abhd10b at Ser136-Asp233-His263 and abhd10a at Ser131-Asp228-His258, with
    both oxyanion-hole amide donors and an identical GSSMGGW nucleophile elbow, all confirmed in the local
    E7F9Y7 record at 134-140 of its 289 residues, so there is no asymmetric decay of the catalytic
    machinery. Of the 27 residues lining the acyl channel defined from the mouse ABHD10 structure, 19 are
    identical between the paralogs, and all 7 positions strictly invariant across 26 single-copy tetrapod
    orthologs are identical in both copies. The decisive test asked where the 8 differing channel
    positions sit relative to vertebrate constraint, and they sit exactly where they would not if
    substrate preference had been partitioned: mean Shannon entropy 1.643 bits against 0.710 at the
    agreeing positions, one-sided p = 0.0047, with none of the 8 invariant anywhere in tetrapods against 7
    of the 19. Neither copy is ancestral either, each matching the tetrapod consensus at 18 of 27 lining
    positions and at two each among the differing 8. A Tajima relative-rate test against five independent
    single-copy outgroups returns p = 0.23 to 0.86 with the direction of the apparent difference flipping
    between outgroups, which is what sampling noise looks like, and the dN/dS version is reported as not
    computable rather than estimated because synonymous sites are saturated. And the substrate did not
    duplicate alongside the enzyme: zebrafish has a single prdx5 whose Cys100-equivalent site sits in a
    window identical at 17 of 17 positions, so a one-substrate-per-paralog partition is not available.
    Sequence therefore cannot distinguish redundancy from divergence here, which the run states plainly;
    what it has done is exclude the forms of divergence that leave a sequence trace. The leading remaining
    alternative, subfunctionalization by expression domain rather than by substrate, could not be tested,
    and the two reasons must be kept apart. One is access: the EBI Expression Atlas gene endpoint returned
    404 and Bgee returned 403 behind a bot challenge. The other is structural and would persist with
    access: Ensembl has no abhd10b gene on the primary zebrafish assembly, the 289-residue ORF being
    transcript tagln3b-201 (ENSDART00000113092) of ENSDARG00000058394, which is displayed as tagln3b. The
    coding exons of the transgelin transcripts and of the abhd10b transcript do not overlap at all, their
    only shared interval being 583 base pairs of UTR that merges the two genes into one model, while NCBI
    keeps them separate as GeneID 492622 and GeneID 797861. Any Ensembl-keyed expression value for abhd10b
    is therefore a sum with transgelin-3b, a highly expressed neuronal gene that will dominate it. This is
    recorded here rather than as a gene_model_issues entry because the defect is in a third-party gene
    model and not in this entry's sequence: E7F9Y7 is a single real gene product, so FUSED_GENE_MODEL,
    which is about a predicted protein joining two genes, would say something false. Two cautions for
    anyone extending this work. The channel is a detected cavity in an apo structure whose only ligand
    sits 16.2 Angstrom from the catalytic serine, not an observed substrate path, and the 230 cubic
    Angstrom volume difference between the paralogs is residue-volume arithmetic over eight substitutions
    rather than a remodelled cavity. And the obvious outgroups are unsafe: the spotted gar model Ensembl
    calls a one-to-one ABHD10 ortholog has lost the catalytic serine entirely through a mis-predicted
    exon, and the chicken model aligns at 17.5 to 27.8 per cent against 57 to 78 per cent for every other
    ortholog, so it is not an ABHD10 protein as modelled. A curator reaching for the gar sequence could
    wrongly conclude the pre-duplication ancestor was already degenerate.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: NARROWING
  significance: >-
    Teleosts retain two catalytic ABHD10 co-orthologs (abhd10a and abhd10b)
    following the teleost whole-genome duplication, so neither paralog can be
    assumed to carry both hepatic redox and male germ-cell roles without direct
    genetic or proteomic data in fish.
  resolution: >-
    Perform CRISPR/Cas9 loss-of-function phenotyping and mitochondrial
    acyl-biotin exchange S-palmitoylome profiling for abhd10b and abhd10a in
    zebrafish somatic tissues and gonads.
  provenance:
  - reference_id: file:DANRE/abhd10b/abhd10b-hypotheses/kgap-abhd10b-paralog-divergence/openscientist.md
    supporting_text: >-
      Sequence cannot distinguish redundancy from divergence here, and that is stated plainly. What it
      can do is rule out the forms of divergence that leave a sequence trace, and all of them came back
      negative.
references:
- id: file:DANRE/abhd10b/abhd10b-hypotheses/kgap-abhd10b-paralog-divergence/openscientist.md
  title: OpenScientist test of whether sequence can predict a substrate-preference difference between the zebrafish abhd10 ohnologs
  findings:
  - statement: >-
      The two genes are confirmed ohnologs by double-conserved synteny, but every sequence-accessible
      test of divergence is negative or symmetric: both triads intact, 19 of 27 acyl-channel positions
      identical, the 8 differences falling at positions tetrapods vary at rather than hold constant
      (entropy 1.643 vs 0.710 bits, p = 0.0047), no asymmetric selection, and a single zebrafish prdx5
      so the substrate did not duplicate.
    supporting_text: >-
      If acyl-chain-length preference had been partitioned, the substitutions would fall at positions
      single-copy orthologs hold constant, because those are the positions the fold cannot change
      without changing substrate handling.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only. Verified locally against E7F9Y7: 289 residues, Ser136, Asp233 and His263 as
      stated, the GSSMGGW nucleophile elbow at 134-140, and the N-terminal sequence the presequence
      analysis uses. Not verified: the abhd10a residue numbering, the 26-ortholog entropy analysis, the
      acyl-channel definition from PDB 6NY9 and its 27 lining positions, the Tajima relative-rate tests
      and saturation estimate, the synteny survey, the Ensembl and NCBI coordinates and gene identifiers,
      and the gar and chicken ortholog assessments. The run refutes the substrate-preference sub-claim of
      the hypothesis this review sent, which is the outcome the prompt explicitly licensed. Its report of
      the Ensembl gene-model merge is recorded in the gap boundary rather than as a gene_model_issues
      entry, because this entry's own sequence is a single real gene product. No annotation action was
      changed.
