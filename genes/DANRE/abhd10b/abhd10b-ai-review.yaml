taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  Abhd10b (abhydrolase domain-containing 10b) is a 289-residue mitochondrial
  alpha/beta-hydrolase in Danio rerio encoded on chromosome 24 adjacent to
  tagln3b, representing one of two teleost whole-genome duplication
  co-orthologs of vertebrate palmitoyl-protein thioesterase ABHD10 (EC
  3.1.2.22) alongside abhd10a on chromosome 5. Assigned to PANTHER subfamily
  PTHR16138:SF7, abhd10b preserves the canonical alpha/beta-hydrolase domain
  and charge-relay catalytic triad at Ser136, Asp233, and His263, supporting a
  conserved role in mitochondrial protein S-depalmitoylation, although its
  physiological substrates and paralog-specific biological processes in
  zebrafish have not yet been experimentally characterized.
