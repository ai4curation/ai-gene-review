knowledge_gaps:
- gap_statement: >-
    The endogenous biological processes and substrate partitioning of zebrafish
    abhd10b relative to its teleost whole-genome duplication paralog abhd10a—in
    particular whether abhd10b regulates mitochondrial redox homeostasis via
    Prdx5 or germ-cell mitochondrial sheath organization—have not been
    experimentally determined.
  boundary: >-
    Molecular function (GO:0008474) and mitochondrial localization (GO:0005739)
    are phylogenetically supported via PANTHER node PTN001043685 and active-site
    conservation (Ser136-Asp233-His263), whereas organismal and cellular
    biological process roles in Danio rerio are wholly unassayed.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Teleosts retain two catalytic ABHD10 co-orthologs (abhd10a and abhd10b)
    following the teleost whole-genome duplication, so neither paralog can be
    assumed to carry both hepatic redox and male germ-cell roles without direct
    genetic or proteomic data in fish.
  resolution: >-
    Perform CRISPR/Cas9 loss-of-function phenotyping and mitochondrial
    acyl-biotin exchange S-palmitoylome profiling for abhd10b and abhd10a in
    zebrafish somatic tissues and gonads.
