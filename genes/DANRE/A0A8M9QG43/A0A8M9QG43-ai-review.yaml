id: A0A8M9QG43
gene_symbol: dnajc6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Auxilin (DnaJ homolog subfamily C member 6, dnajc6) is a J-domain co-chaperone that acts in the terminal, uncoating step of clathrin-mediated endocytosis. The protein has a three-part architecture, an N-terminal PTEN-like (tensin-type) phosphatase domain followed by a tensin-type C2 domain, a long disordered clathrin-binding region, and a C-terminal J domain carrying the conserved His-Pro-Asp motif. Auxilin binds assembled clathrin lattices on newly formed clathrin-coated vesicles and, through its J domain, recruits the Hsc70 chaperone (HSPA8) and stimulates its ATP hydrolysis, driving disassembly of the clathrin coat so that vesicles can fuse with their targets and clathrin can be reused. The PTEN-like domain of auxilin has no demonstrated phosphatase activity and is thought to serve mainly as a phosphoinositide-dependent membrane-targeting module. Zebrafish has two auxilin-family genes, auxilin (dnajc6) and the kinase-containing paralog cyclin G-associated kinase (gak). Zebrafish auxilin is expressed maternally and then predominantly in neural tissues, hindbrain and spinal cord neurons and the otic vesicle, whereas gak is broadly expressed. When expressed in Drosophila, zebrafish auxilin rescues the neurogenic and lethal phenotypes of Drosophila auxilin mutants, and this rescue requires its J domain, showing that the core Hsc70-dependent uncoating function is conserved. In mammals, auxilin is concentrated at presynaptic terminals where it supports synaptic vesicle recycling, and biallelic loss-of-function variants in human DNAJC6 cause juvenile-onset parkinsonism (PARK19).
