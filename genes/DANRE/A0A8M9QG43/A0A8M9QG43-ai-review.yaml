taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Auxilin (DnaJ homolog subfamily C member 6, dnajc6) is a J-domain co-chaperone that acts in the terminal, uncoating step of clathrin-mediated membrane traffic. The protein has a three-part architecture, an N-terminal PTEN-like (tensin-type) phosphatase domain followed by a tensin-type C2 domain, a long disordered clathrin-binding region, and a C-terminal J domain carrying the conserved His-Pro-Asp motif. By orthology to bovine and mammalian auxilin 1, it binds assembled clathrin lattices on newly formed clathrin-coated vesicles and, through its J domain, recruits the Hsc70 chaperone (HSPA8) and stimulates its ATP hydrolysis, driving disassembly of the clathrin coat so that vesicles can fuse with their targets and clathrin can be reused. The PTEN-like region is a phosphoinositide-dependent membrane-targeting module rather than an enzyme; the bovine ortholog has no detectable phosphatase activity, and zebrafish auxilin carries the same departure from the PTEN-class P-loop. Zebrafish has two auxilin-family genes, auxilin (dnajc6) and the kinase-containing paralog cyclin G-associated kinase (gak), which diverged before the fish-mammal split. Zebrafish auxilin is expressed maternally and then predominantly in neural tissues, hindbrain and spinal cord neurons and the otic vesicle, whereas gak is broadly expressed. When expressed in Drosophila, zebrafish auxilin rescues the neurogenic and lethal phenotypes of Drosophila auxilin mutants, and this rescue requires its J domain, showing that the Hsc70-dependent uncoating function is conserved. The dnajc6 gene produces many alternatively spliced protein products; this entry is a 974-residue isoform that lacks five N-terminal residues present in the 979-residue canonical product but retains every domain.
