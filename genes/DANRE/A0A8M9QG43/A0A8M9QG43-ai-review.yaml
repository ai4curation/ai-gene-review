  review:
    summary: ZFIN IDA from Bai et al. 2010 (full text cached). N-terminally GFP-tagged zebrafish auxilin was transiently expressed in HeLa cells; at low expression the signal was "mostly cytosolic and slightly enriched near the perinuclear regions". The construct was shown to be functional (it rescues Drosophila auxilin mutants), so the observation reflects a functional protein, but it was made in a heterologous mammalian cell line by overexpression rather than in zebrafish cells.
    action: KEEP_AS_NON_CORE
    reason: A diffuse cytosolic pool is genuine and expected for a soluble co-chaperone that is recruited onto coated vesicles and released again after each uncoating cycle, so the annotation is correct. It is not, however, the compartment where auxilin does its work (that is the clathrin-coated vesicle), and the evidence is heterologous overexpression, so it is retained as a non-core localisation rather than a core one. The ZFIN curator's reading of the full text is not disputed.
