core_functions:
- description: Hsc70 co-chaperone for clathrin uncoating. Auxilin binds assembled clathrin on newly formed clathrin-coated vesicles and, via its J domain (His-Pro-Asp motif), recruits HSPA8/Hsc70 and stimulates its ATPase to drive ATP-dependent disassembly of the clathrin coat, the terminal step of clathrin-mediated endocytosis. Zebrafish auxilin performs this function in vivo, since it rescues Drosophila auxilin mutants in a J-domain-dependent manner.
