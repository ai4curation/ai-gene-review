core_functions:
- description: Hsc70 co-chaperone for clathrin uncoating. Auxilin binds assembled clathrin on newly formed clathrin-coated vesicles and, via its J domain (His-Pro-Asp motif), recruits HSPA8/Hsc70 and stimulates its ATPase to drive ATP-dependent disassembly of the clathrin coat. The function is inherited from the root of the auxilin/GAK family and, for the zebrafish protein, is shown by J-domain-dependent rescue of Drosophila auxilin mutants.
