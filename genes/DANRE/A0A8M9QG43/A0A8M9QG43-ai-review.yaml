  title: Deep research report for dnajc6 (A0A8M9QG43) in Danio rerio
  findings:
  - statement: Auxilin/DNAJC6 is a J-domain co-chaperone that recruits and activates HSC70 to catalyse ATP-dependent disassembly of clathrin coats at the terminal step of clathrin-mediated endocytosis, supporting synaptic vesicle recycling.
    reference_section_type: RESULTS
  - statement: The PTEN-like domain binds phosphoinositides to target auxilin to endocytic membranes; it is not described as catalytically active.
    reference_section_type: RESULTS
  - statement: Biallelic loss-of-function DNAJC6 variants cause PARK19 juvenile-onset parkinsonism; the report notes that zebrafish-specific functional studies of dnajc6 are lacking.
