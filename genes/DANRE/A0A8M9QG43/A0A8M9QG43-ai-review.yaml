  review:
    summary: Mapped from the UniProt subcellular-location annotation "Cytoplasmic vesicle, clathrin-coated vesicle" (ARBA-transferred). For zebrafish auxilin itself, Bai et al. 2010 found that GFP-zAux in HeLa cells is enriched in perinuclear structures that overlap with clathrin and, at higher expression, forms large clathrin-positive aggregates that deplete clathrin from the rest of the cell, the behaviour expected of a protein that binds assembled clathrin coats. The clathrin-coated vesicle is the site at which auxilin binds the lattice and recruits Hsc70 for uncoating.
