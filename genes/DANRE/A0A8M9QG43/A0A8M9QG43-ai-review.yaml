    summary: UniRule mapping (UR000414225) fired by the PROSITE tensin-type phosphatase domain (PS51181, residues 109-276), with Cys218 predicted as a phosphocysteine intermediate. The claim is that zebrafish auxilin catalyses protein dephosphorylation. The PTEN-like region of the auxilin 1 ortholog (bovine, same PANTHER subfamily PTHR23172:SF4) was solved crystallographically and tested; it resembles PTEN but has no detectable phosphatase activity, which the authors attribute to a change in the P loop. The zebrafish protein departs from the PTEN-class CX5R P-loop signature in the same way as human auxilin (CSDGR at Cys218 versus human CLDGR), so there is no sequence basis for expecting the zebrafish domain to differ. The PTEN-like region serves instead as a phosphoinositide-dependent membrane-targeting module.
