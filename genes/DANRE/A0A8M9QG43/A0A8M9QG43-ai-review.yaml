  review:
    summary: UniRule/PROSITE mapping from the tensin-type phosphatase domain (PS51181) predicted at residues 109-276, with Cys218 annotated as a predicted phosphocysteine intermediate. The claim is that zebrafish auxilin catalyses protein dephosphorylation. No auxilin from any species has demonstrated phosphatase activity; the reviewed human ortholog is described only as possibly acting as a protein and/or lipid phosphatase (EC 3.1.3.-), and the established role of the PTEN-like region is phosphoinositide-dependent membrane targeting. The only functional test of zebrafish auxilin (rescue of Drosophila auxilin mutants) depended on the J domain, not on the phosphatase fold.
    action: MARK_AS_OVER_ANNOTATED
    reason: The annotation is derived purely from the presence of the PTEN-like fold. The fold is real, so the term is not demonstrably wrong, but there is no biochemical evidence for phosphoprotein phosphatase activity in auxilin from any species, and human UniProt itself hedges the activity as "May act as a protein phosphatase and/or a lipid phosphatase". Asserting a catalytic activity for zebrafish dnajc6 on this basis overstates the evidence.
