  review:
    summary: Proposed. Auxilin was identified as the factor that cooperates with Hsc70 to strip clathrin triskelia and coat proteins from newly formed coated vesicles, and this is the specific process the zebrafish protein was tested for in vivo, rescue of Drosophila auxilin mutants whose defect is in clathrin-dependent Notch ligand endocytosis, with the J domain required. Overexpressed GFP-zAux also perturbs clathrin distribution in HeLa cells, forming clathrin-containing aggregates as mammalian auxilins do. The human ortholog carries this term by curated ISS.
