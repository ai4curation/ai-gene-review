    reason: Clathrin coat disassembly is the precise process auxilin executes; the broader clathrin-dependent endocytosis term does not convey the uncoating step. The participation test is met (auxilin, with Hsc70, performs the disassembly), and the evidence for the zebrafish protein is a functional in vivo rescue with domain dependence rather than an in vitro uncoating assay, hence ISS rather than IDA.
