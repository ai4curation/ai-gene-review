proposed_new_terms: []
suggested_questions:
- question: Is the PTEN-like domain of zebrafish auxilin catalytically active toward any phosphoprotein or phosphoinositide substrate, or is it a degenerate lipid-binding module as suspected for the mammalian protein? The IEA phosphatase annotations stand or fall on this.
- question: Does zebrafish auxilin bind clathrin directly (the paper notes a clathrin-binding motif region and clathrin co-aggregation), and if so should a clathrin binding annotation be made for dnajc6 as it has been for human DNAJC6 by IBA/ISS?
- question: Given that dnajc6 expression is restricted to neural tissues while gak is ubiquitous, what phenotype does dnajc6 loss alone produce in zebrafish neurons, and does gak compensate?
suggested_experiments:
- description: Generate a dnajc6 zebrafish mutant (or morphant) and assay synaptic vesicle recycling and clathrin-coated vesicle accumulation in hindbrain and spinal cord neurons by electron microscopy and FM-dye uptake, alone and in combination with gak loss, to test whether the neural-restricted paralog is required for uncoating in vivo.
- description: In vitro clathrin-cage disassembly and HSPA8 ATPase stimulation assays with purified zebrafish auxilin (wild type, HPD-to-AAA J-domain mutant, and the J-domain-deleted construct used by Bai et al.) to establish the co-chaperone activity biochemically rather than by rescue.
- description: Phosphatase assays of the isolated zebrafish PTEN-like domain against phosphopeptide and phosphoinositide substrates, with a Cys218 mutant control, to decide whether the UniRule phosphatase annotations have any biochemical basis.
references:
- id: PMID:20082716
  title: Disruption of zebrafish cyclin G-associated kinase (GAK) function impairs the expression of Notch-dependent genes during neurogenesis and causes defects in neuronal development.
  findings:
  - statement: Zebrafish has two auxilin-family genes, gak (with an N-terminal kinase domain) and auxilin/dnajc6 (PTEN region, clathrin-binding motif and J domain, no kinase); zAux is more similar to human and mouse auxilin than to zGAK.
    reference_section_type: RESULTS
  - statement: GFP-zAux and GFP-zGAK expressed at low levels in HeLa cells are mostly cytosolic with perinuclear enrichment overlapping clathrin (probably TGN); at high levels both form large clathrin-containing aggregates.
    reference_section_type: RESULTS
  - statement: Both GFP-zAux and GFP-zGAK rescue the extra photoreceptor (Elav-positive cell) phenotype and the lethality of Drosophila auxilin (dAux) mutants; J-domain-deleted versions of either do not.
    reference_section_type: RESULTS
  - statement: 'zAux is expressed maternally and zygotically, predominantly in neural tissues: bilateral dorsal cell clusters, hindbrain and spinal cord neurons, and otic vesicles; gak is broadly expressed.'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Bai et al. 2010, BMC Dev Biol 10:7, PMC2821301; full text cached). The paper is centred on GAK knockdown but contains the only primary data on zebrafish auxilin (dnajc6), namely its domain structure, HeLa-cell localisation, Drosophila rescue with J-domain dependence, and expression pattern. It is the source of both ZFIN IDA localisation rows and supports the proposed uncoating rows.
