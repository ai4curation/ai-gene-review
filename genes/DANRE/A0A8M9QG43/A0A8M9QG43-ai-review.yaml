proposed_new_terms: []
suggested_questions:
- question: Should the PTHR23172 PAINT tree be checked for whether the UniRule/PROSITE phosphatase mapping (UR000414225) should exclude the auxilin subfamily SF4, given that the bovine auxilin 1 PTEN-like domain has no detectable activity and the zebrafish and human P loops depart from the PTEN-class signature in the same way?
- question: Does zebrafish auxilin act at synapses, as the vertebrate PAINT node (PTN002753975, synaptic vesicle uncoating) implies? Its neural-restricted expression is consistent with this, but there is no zebrafish synaptic data.
- question: Given that dnajc6 expression is restricted to neural tissues while gak is ubiquitous, what phenotype does dnajc6 loss alone produce in zebrafish neurons, and does gak compensate as it partially does in auxilin knockout mice?
suggested_experiments:
- description: Generate a dnajc6 zebrafish mutant and assay synaptic vesicle recycling and clathrin-coated vesicle accumulation in hindbrain and spinal cord neurons by electron microscopy and FM-dye uptake, alone and in combination with gak loss, to test whether the neural-restricted paralog is required for uncoating in vivo.
- description: In vitro clathrin-cage disassembly and HSPA8 ATPase stimulation assays with purified zebrafish auxilin (wild type, HPD-to-AAA J-domain mutant, and the J-domain-deleted construct used by Bai et al.) to establish the co-chaperone activity biochemically rather than by rescue.
references:
- id: PMID:20082716
  title: Disruption of zebrafish cyclin G-associated kinase (GAK) function impairs the expression of Notch-dependent genes during neurogenesis and causes defects in neuronal development.
  findings:
  - statement: Zebrafish has two auxilin-family genes, gak (with an N-terminal kinase domain) and auxilin/dnajc6 (PTEN region, clathrin-binding motif and J domain, no kinase); zAux is more similar to human and mouse auxilin than to zGAK.
    reference_section_type: RESULTS
    supporting_text: zAux is similar to zGAK, it is more similar to human and mouse auxilin proteins (Figure 2A), suggesting that the divergence of GAK and auxilin occurred prior to the divergence of fish and mammals during vertebrate evolution.
  - statement: GFP-zAux and GFP-zGAK expressed at low levels in HeLa cells are mostly cytosolic with perinuclear enrichment overlapping clathrin (probably TGN); at high levels both form large clathrin-containing aggregates.
    reference_section_type: RESULTS
  - statement: Both GFP-zAux and GFP-zGAK rescue the extra photoreceptor (Elav-positive cell) phenotype and the lethality of Drosophila auxilin (dAux) mutants; J-domain-deleted versions of either do not.
    reference_section_type: RESULTS
  - statement: 'zAux is expressed maternally and zygotically, predominantly in neural tissues: bilateral dorsal cell clusters, hindbrain and spinal cord neurons, and otic vesicles; gak is broadly expressed.'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Bai et al. 2010, BMC Dev Biol 10:7, PMC2821301; full text cached). The paper is centred on GAK knockdown but contains the only primary data on zebrafish auxilin (dnajc6), namely its domain structure and orthology to mammalian auxilin, HeLa-cell localisation, Drosophila rescue with J-domain dependence, and expression pattern. It is the source of both ZFIN IDA localisation rows.
- id: PMID:8524399
  title: Role of auxilin in uncoating clathrin-coated vesicles.
  findings:
  - statement: Auxilin (bovine auxilin 1, the ortholog of zebrafish dnajc6) is the 100K cofactor of hsp70c in clathrin uncoating; it binds assembled clathrin lattices with high affinity, recruits hsp70c in the presence of ATP, and requires its C-terminal J domain for cofactor activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Ungewickell et al. 1995, Nature). Abstract only in the cache; the quoted sentences are from the abstract. Orthologous evidence, applied to zebrafish via PANTHER subfamily SF4 membership and the PAINT root node.
- id: PMID:20826345
  title: Structure of the PTEN-like region of auxilin, a detector of clathrin-coated vesicle budding.
  findings:
  - statement: The PTEN-like region of bovine auxilin 1 resembles PTEN structurally but has no detectable phosphatase activity, attributed to a change in P-loop structure; phosphoinositides enhance liposome binding and C2-loop mutations block recruitment to newly budded coated vesicles.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Guan et al. 2010, Structure; full text cached). Basis for removing the UniRule phosphatase rows. Also cited by the PTHR23172 family review.
- id: PMID:20160091
  title: Endocytosis and clathrin-uncoating defects at synapses of auxilin knockout mice.
  findings:
  - statement: Auxilin knockout mice accumulate clathrin-coated vesicles and empty cages at synapses and have impaired synaptic-vesicle endocytosis, with partial compensation by GAK up-regulation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches the cached record (Yim et al. 2010, PNAS; abstract only cached). Background for the synaptic role of the mammalian ortholog and for the suggested question on gak compensation; not used as direct support for a zebrafish annotation.
- id: file:DANRE/A0A8M9QG43/A0A8M9QG43-uniprot.txt
  title: UniProt entry A0A8M9QG43 (dnajc6, Danio rerio)
  findings:
  - statement: Unreviewed (PE 4) entry, 974 aa, RefSeq XP_021332835.1. PROSITE predicts a tensin-type phosphatase domain (109-276), a tensin-type C2 domain (282-417) and a J domain (910-974) containing the HPD motif. The SUBUNIT and SUBCELLULAR LOCATION comments are ARBA transfers and are not used as evidence in this review.
    reference_section_type: OTHER
  reference_review:
    review_notes: Used for sequence features (domain boundaries, HPD motif). Earlier versions of this review quoted its ARBA-derived SUBUNIT and SUBCELLULAR LOCATION text as support; those quotes were replaced by primary literature in the 2026-10-21 re-review.
- id: file:human/DNAJC6/DNAJC6-uniprot.txt
  title: UniProt entry O75061 (DNAJC6, Homo sapiens)
  findings:
  - statement: Human auxilin is a reviewed entry whose phosphatase activity is hedged ("May act as a protein phosphatase and/or a lipid phosphatase", EC 3.1.3.-), while its co-chaperone role in recruiting HSPA8 to clathrin-coated vesicles and stimulating HSPA8 ATP hydrolysis is described in detail with curated evidence.
    reference_section_type: OTHER
- id: file:interpro/panther/PTHR23172/PTHR23172-paint.tsv
  title: PAINT ancestral annotations for PANTHER family PTHR23172
  findings:
  - statement: Root node PTN000571055 (Eukaryota) carries IBD clathrin binding, clathrin coat disassembly, vesicle, cytoplasm and intracellular membrane-bounded organelle; vertebrate node PTN002753975 (Euteleostomi) carries synaptic vesicle uncoating and postsynaptic density. No phosphatase activity is asserted at any node.
    reference_section_type: OTHER
- id: file:DANRE/A0A8M9QG43/A0A8M9QG43-bioinformatics/RESULTS-rereview.md
  title: dnajc6 isoform and motif comparison (re-review)
  findings:
  - statement: A0A8M9QG43 differs from the gene-centric canonical A0A8M9Q6X2 only by a 5-residue N-terminal deletion (GPPSP after residue 66), outside all domains; the HPD motif is retained, and the predicted catalytic cysteine sits in a CX3R window (CSDGR) like human auxilin (CLDGR) rather than a PTEN-class CX5R P loop.
    reference_section_type: RESULTS
