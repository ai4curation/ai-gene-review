id: A0A8M9QG43
gene_symbol: dnajc6
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for zebrafish auxilin (DNAJC6), the J-domain
  co-chaperone that recruits HSC70 to uncoat clathrin-coated vesicles. ProTrek reads the
  protein's N-terminal PTEN-like domain and returns three phosphoinositide phosphatase
  activities in its top five, treating the degenerate domain as catalytic; this review
  and the auxilin literature hold that the PTEN-like domain's role is
  phosphoinositide-dependent membrane targeting rather than catalysis. The clathrin
  biology does appear at rank 2, but tied to a specific developmental context
  (vitellogenesis) that has nothing to do with this neuronal protein. The core molecular
  function, Hsp70 protein binding, is never retrieved in the top 25, and the free-text
  Function channel misfires badly here too, returning EGFR/MAPK adapter descriptions.
  ProtNLM2 predicted "dephosphorylation" for the same protein, which is the same
  pseudoenzyme error at lower specificity.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 1 less precise (LSP),
  0 uncertain (UNC), 2 incorrect (NPI).
