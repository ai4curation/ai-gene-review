  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0016314
      label: phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PSEUDOENZYME_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 16.87). This is the defining catalytic activity of PTEN.
        Auxilin's PTEN-like domain is a phosphoinositide-binding module whose phosphatase
        activity is at best probable and whose established role is membrane targeting; the
        protein's function is J-domain recruitment of HSC70. Assigning PTEN's exact reaction
        to it is the clearest pseudoenzyme over-annotation in the benchmark, and the model
        commits to it three times over (ranks 1, 3 and 5 are three phosphoinositide
        phosphatase specificities).
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0061883
      label: clathrin-dependent endocytosis involved in vitellogenesis
    predicted_term_type: GO_BP
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Rank 2 (score 16.30). The parent concept is exactly right - clathrin-dependent
        endocytosis is annotated in GOA and is central to this review - but the retrieval
        returns it wrapped in a developmental context the protein does not act in: auxilin
        is expressed in hindbrain and spinal cord neurons and otic vesicles, not in
        yolk-protein uptake by oocytes. Scored LSP because a curator can recover the correct
        annotation by climbing one level to the parent, which is the practical outcome the
        LSP category is for; but the specific term as returned would be wrong.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0052866
      label: phosphatidylinositol phosphate phosphatase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PSEUDOENZYME_OVERANNOTATION
      summary: >-
        Rank 3 (score 15.68), the parent of the rank-1 call and wrong for the same reason.
        The three phosphatase calls in the top five are the same claim at three ontology
        depths, so the ranked list gives an impression of converging evidence where there is
        really one hypothesis repeated - the practical hazard when retrieval depth is read
        as independent support.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
