    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The target has the PTEN-like, C2, and J-domain architecture of auxilin/DNAJC6. Structural work
        on bovine auxilin shows that the PTEN-like region lacks phosphatase activity and instead participates
        in membrane binding (PMID:20826345), so the target phosphatase-related electronic assertions do
        not validate catalysis. The predicted term is a biological process, however, and a noncatalytic
        protein could participate through another enzyme or complex. No such dephosphorylation role is
        established in the inspected evidence, leaving the process uncertain.
