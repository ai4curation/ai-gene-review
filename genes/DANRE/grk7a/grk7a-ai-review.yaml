  title: UniProtKB entry Q49HM9 for Danio rerio grk7a
  findings: []
core_functions:
- description: >-
    Cone opsin kinase: phosphorylates light-activated cone opsins (and rhodopsin in vitro)
    at high rate in the cone outer segment, initiating opsin shut-off and recovery of the
    cone photoresponse; its activity is down-regulated by cAMP/PKA-dependent
    phosphorylation. The same kinase inactivates the parapinopsin photoproduct in pineal
    photoreceptors.
  molecular_function:
    id: GO:0050254
    label: rhodopsin kinase activity
  directly_involved_in:
  - id: GO:0036368
    label: photoresponse recovery
  - id: GO:0007603
    label: phototransduction, visible light
  locations:
  - id: GO:0120199
    label: cone photoreceptor outer segment
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:16787417
    supporting_text: The recombinant GRKs phosphorylated light-activated rhodopsin, and
      the Vmax value of the major cone subtype, GRK7-1, was 32-fold higher than that of
      the rod kinase, GRK1A.
  - reference_id: PMID:30372740
    supporting_text: Our results suggest Grk1b and Grk7a both contribute to signal termination
      in cones
  - reference_id: PMID:36273582
    supporting_text: These data suggest that the delay in cone recovery brought about by
      increased levels of cAMP is mediated by Grk7a rather than Grk1b in zebrafish larvae.
  - reference_id: PMID:33579376
    supporting_text: These findings suggest that in pineal photoreceptor cells, the cone
      opsin kinase GRK7a contributes greatly to the inactivation of parapinopsin
suggested_questions:
- question: >-
    grk7a and grk7b differ in rhodopsin-phosphorylation rate by more than 30-fold
    (PMID:33579376 citing PMID:16787417). Is this a real difference in catalytic
    efficiency on the native cone opsins (for grk7b, UV opsin opn1sw1), or an artefact of
    using bovine rhodopsin as substrate?
  experts:
  - photoreceptor biochemists
- question: >-
    Should ZFIN's IMP "photoreceptor activity" annotation from Rinner et al. 2005 be
    retired? The phenotype is already captured by phototransduction and photoresponse
    recovery, and grk7a's MF is rhodopsin kinase activity.
  experts:
  - ZFIN curators
- question: >-
    Is grk7b's UV-cone-restricted expression derived (lost from other cone types after the
    TGD) or ancestral? What is the cone-subtype expression of the single GRK7 of spotted gar?
suggested_experiments:
- hypothesis: >-
    grk7b cannot replace grk7a in the larval cones because it is not expressed there, not
    because its protein is inadequate.
  description: >-
    Express grk7b coding sequence under a pan-cone promoter (e.g. gnat2) in grk7a knockout
    larvae and measure paired-flash cone ERG recovery and forskolin sensitivity; compare
    with a grk7a transgene.
  experiment_type: cross-rescue
- hypothesis: >-
    The mild grk7a knockout phenotype reflects redundancy with grk1b rather than
    compensation by grk7b.
  description: >-
    Measure grk7b and grk1b mRNA and protein (paralog-specific antibodies) in grk7a PTC
    mutants and in a promoter-deletion (RNA-less) grk7a allele, and test grk7a;grk1b and
    grk7a;grk7b double mutants for UV-cone versus other-cone recovery.
  experiment_type: double mutant and transcriptional adaptation test
