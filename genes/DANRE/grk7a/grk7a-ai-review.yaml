- term:
    id: GO:0036368
    label: photoresponse recovery
  evidence_type: IMP
  original_reference_id: PMID:30372740
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-190627-14
  review:
    summary: >-
      TALEN knockout of grk7a (exon-1 7-bp deletion/6-bp insertion, truncation at 53 aa, no
      detectable Grk7 protein) slows recovery of the isolated cone mass receptor potential
      in paired-flash ERG at 5 dpf (recovery half-life 3.0 s vs 1.7 s in wild type).
    action: ACCEPT
    reason: >-
      This is the core process of grk7a: by phosphorylating light-activated cone opsin it
      starts opsin shut-off and so recovery of the cone photoresponse. The knockout effect
      is modest because cone Grk1b also contributes; that is partial redundancy with the
      rod/cone paralog Grk1b, not with grk7b (larval Grk7 protein is undetectable in the
      grk7a knockout, so grk7b does not substitute here).
    supported_by:
    - reference_id: PMID:30372740
      supporting_text: A logarithmic linear regression of the non-saturating portion of the
        response shows a recovery half-life of 1.7 seconds for wildtype larvae, versus 2.3
        and 3.0 seconds for grk1b−/− and grk7a−/− larvae, respectively (Fig. 4B, inset).
    - reference_id: PMID:30372740
      supporting_text: Analysis of grk7a−/− larvae at 5 dpf show undetectable levels of Grk7
        compared to wildtype (Fig. 2A, 2B).
