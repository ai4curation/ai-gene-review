  - ZFIN:ZDB-MRPHLNO-050824-1
  review:
    summary: >-
      Morpholino knockdown of grk7a delayed cone photoresponse recovery in ERG and reduced
      temporal contrast sensitivity, especially in bright light (Rinner et al. 2005).
    action: ACCEPT
    reason: >-
      Phosphorylation of the light-activated opsin is the first step of the shut-off
      branch of the phototransduction cascade, so Grk7a participates directly in
      phototransduction in cones. The knockout (PMID:30372740) confirms a smaller but
      significant effect. The more specific process, photoresponse recovery, is also
      annotated.
    supported_by:
    - reference_id: PMID:16039565
      supporting_text: Photoresponse recovery in Grk7a-deficient larvae was delayed in electroretinographic
        measurements, and temporal contrast sensitivity was reduced, particularly under
        bright-light conditions.
- term:
    id: GO:0009881
    label: photoreceptor activity
  evidence_type: IMP
  original_reference_id: PMID:16039565
  qualifier: enables
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-050824-1
  review:
    summary: >-
      "Photoreceptor activity" is the molecular function of absorbing and responding to
      light (the activity of opsins). Grk7a is a kinase that inactivates the light-activated
      photoreceptor protein; it does not absorb light.
    action: REMOVE
    reason: >-
      The term definition ("absorbing and responding to incidental electromagnetic
      radiation") describes a chromophore-bearing photoreceptor protein, not a kinase acting
      on it. A knockdown phenotype (delayed photoresponse recovery) cannot establish a
      molecular function, and the paper's own data are about cone response recovery. The
      real activity of grk7a is rhodopsin kinase activity (GO:0050254), already annotated by
      IDA (PMID:16787417), and the phenotype is correctly captured by the phototransduction
      and photoresponse recovery annotations. This is a mistyped MF, not a disputed finding.
    supported_by:
    - reference_id: PMID:16039565
      supporting_text: These results show that function of a cone-specific kinase is essential
        for cone vision in the zebrafish retina
    - reference_id: PMID:16787417
      supporting_text: The recombinant GRKs phosphorylated light-activated rhodopsin
