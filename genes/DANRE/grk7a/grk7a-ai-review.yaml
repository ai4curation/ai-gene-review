- id: PMID:16039565
  title: Knockdown of cone-specific kinase GRK7 in larval zebrafish leads to impaired
    cone response recovery and delayed dark adaptation.
  findings:
  - statement: Morpholino knockdown of grk7a delays cone photoresponse recovery and reduces
      temporal contrast sensitivity; two grk7 orthologs were cloned.
    supporting_text: Photoresponse recovery in Grk7a-deficient larvae was delayed in electroretinographic
      measurements, and temporal contrast sensitivity was reduced, particularly under bright-light
      conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Morpholino ZDB-MRPHLNO-050824-1 targets grk7a; the
      knockout (PMID:30372740) found a milder phenotype and attributes part of the
      difference to morpholino side effects.
- id: PMID:16787417
  title: 'GRK1 and GRK7: unique cellular distribution and widely different activities
    of opsin phosphorylation in the zebrafish rods and cones.'
  findings:
  - statement: GRK7-1 (grk7a) localizes to cone outer segments and has a rhodopsin-phosphorylation
      Vmax 32-fold higher than rod GRK1A.
    supporting_text: The recombinant GRKs phosphorylated light-activated rhodopsin, and
      the Vmax value of the major cone subtype, GRK7-1, was 32-fold higher than that of
      the rod kinase, GRK1A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. GRK7-1 = grk7a (UniProt synonym grk7-1; EMBL AB212995
      on Q49HM9); GRK7-2 = grk7b (AB212996 on Q1XHL7).
- id: PMID:21299656
  title: Cone arrestin confers cone vision of high temporal resolution in zebrafish
    larvae.
  findings:
  - statement: Grk7a acts in initial cone response recovery, overlapping with arr3a.
    supporting_text: Arr3a activity partially overlapped with the function of the cone-specific
      kinase Grk7a involved in initial response recovery.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; Grk7a morphants used as a comparator for arr3a.
- id: PMID:30372740
  title: Grk1b and Grk7a Both Contribute to the Recovery of the Isolated Cone Photoresponse
    in Larval Zebrafish.
  findings:
  - statement: grk7a knockout larvae have modestly slower cone photoresponse recovery;
      Grk1b contributes similarly.
    supporting_text: Since the difference between wildtype and each knockout fish is
      modest, it appears that either GRK is sufficient for adequate cone visual function.
  - statement: An antibody that detects both Grk7 paralogs finds no Grk7 in grk7a knockout
      larvae, so larval retinal Grk7 is Grk7a.
    supporting_text: Analysis of grk7a−/− larvae at 5 dpf show undetectable levels of Grk7
      compared to wildtype (Fig. 2A, 2B).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. TALEN PTC allele in exon 1 (truncation at 53 aa).
- id: PMID:36273582
  title: Grk7 but not Grk1 undergoes cAMP-dependent phosphorylation in zebrafish cone
    photoreceptors and mediates cone photoresponse recovery to elevated cAMP.
  findings:
  - statement: Grk7a mediates the cAMP-induced delay in cone recovery and is phosphorylated
      via PKA.
    supporting_text: We also used a cone-specific dominant negative PKA transgenic zebrafish
      to show that PKA is part of the endogenous kinase pathway responsible for Grk7a phosphorylation
      in response to elevated cAMP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. grk7b not tested.
- id: PMID:33579376
  title: Functional identification of an opsin kinase underlying inactivation of the
    pineal bistable opsin parapinopsin in zebrafish.
  findings:
  - statement: GRK7a is the main kinase inactivating the parapinopsin photoproduct in
      pineal photoreceptor cells; GRK7b knockdown has little effect.
    supporting_text: We found that GRK7a knockdown slowed recovery of the response of
      parapinopsin photoreceptor cells, whereas GRK1b knockdown or GRK7b knockdown did
      not have a remarkable effect
  - statement: GRK7a (GRK7-1) rhodopsin phosphorylation is more than 30-fold faster than
      that of GRK7b (GRK7-2).
    supporting_text: rhodopsin phosphorylation activity of GRK7a (GRK7–1) is more than
      30-fold faster than those of GRK1a, GRK1b, and GRK7b (GRK7–2 [29])
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; morpholino knockdowns (two MOs per gene).
- id: PMID:39925416
  title: Light intensity-dependent arrestin switching for inactivation of a light-sensitive
    GPCR, bistable opsin.
  findings:
  - statement: In pineal parapinopsin cells, GRK7b and GRK1b contribute to response termination
      in addition to GRK7a (multiple knockdowns).
    supporting_text: These observations suggest that GRK7b and also presumably GRK1b contribute
      to the response termination processes in addition to GRK7a in control fish.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; morpholino combinations.
- id: PMID:34462505
  title: Partitioning of gene expression among zebrafish photoreceptor subtypes.
  findings:
  - statement: In adult photoreceptor scRNA-seq, grk7b is UV-cone-enriched while grk7a
      is enriched in the other cone types; the pair arose in the TGD.
    supporting_text: Additionally, we found multiple pairs of paralogous genes that were
      differentially enriched between UV cones (grk7b, cngb3.2, and guca1e) and other cone
      types (grk7a, cngb3.1, and guca1e.2).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:33598728
  title: Biochemistry and physiology of zebrafish photoreceptors.
  findings:
  - statement: grk7a is expressed in all cones, grk7b only in UV cones.
    supporting_text: grk1a is expressed exclusively in rods, grk1b and grk7a in all cones,
      and grk7b only in UV cones
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review; the grk7b claim partly rests on unpublished data.
- id: PMID:18803695
  title: Phosphorylation of GRK7 by PKA in cone photoreceptor cells is regulated by
    light.
  findings:
  - statement: The two zebrafish GRK7 paralogs are 73% identical.
    supporting_text: In comparison, the 2 zebrafish GRK7 proteins, zGRK7-1 and zGRK7-2
      are only 73% identical at the amino acid level
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; phospho-GRK7 antibody data in zebrafish are not paralog-resolved.
- id: PMID:29321241
  title: Evolution of the shut-off steps of vertebrate phototransduction.
  findings:
  - statement: Jawed vertebrates kept a single GRK7 after 2R; GRK7s are geranylgeranylated.
    supporting_text: It is also clear that, following 2R WGD, jawed vertebrates retained
      two GRK1 isoforms but only a single GRK7, whereas agnathan vertebrates retained two
      GRK7 isoforms but only a single GRK1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; evolutionary background for the GRK1/GRK7 family.
- id: PMID:26246494
  title: Recoverin depletion accelerates cone photoresponse recovery.
  findings:
  - statement: Grk7a knockdown prolongs UV-cone (SWS1) response recovery, so grk7a acts
      in UV cones too.
    supporting_text: indicating Grk7a is a general cone opsin kinase
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; morpholino.
- id: PMID:34550876
  title: Circadian regulation of vertebrate cone photoreceptor function.
  findings:
  - statement: grk7a and grk7b transcripts oscillate with a similar circadian phase.
    supporting_text: Although many ohnologs (paralogs generated in a whole-genome duplication
      event), such as grk7a and grk7b, share a similar circadian phase or oscillatory amplitude
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text.
