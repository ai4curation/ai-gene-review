- term:
    id: GO:0051216
    label: cartilage development
  evidence_type: IMP
  original_reference_id: PMID:15689370
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-050322-1
  review:
    summary: 'IMP: cartilage development (sox9b b971 mutant).'
    action: ACCEPT
    reason: 'Sox9b is required for normal chondrocyte numbers in a subset of craniofacial cartilages;
      col11a2 is lost from mandibular and ceratohyal cartilage in sox9b mutants. Caveats: b971 is a multi-gene
      deletion (morpholino phenocopy supports attribution to sox9b), and a later study (Lin et al. 2021,
      Aquaculture and Fisheries, no PMID; known here only via the deep-research summary) reported grossly
      normal cartilage in CRISPR sox9b frameshift mutants. That discrepancy may reflect genetic compensation
      in PTC alleles, the extra genes deleted in b971, or a subtler phenotype (chondrocyte number) not
      scored in gross staining; it does not override the curated IMP.'
    supported_by:
    - *id012
    - *id014
    - *id002
    - reference_id: file:DANRE/sox9b/sox9b-deep-research-falcon.md
      supporting_text: CRISPR *sox9b* Δ11 and Δ20 alleles deleting the HMG and Q/S domains produced grossly
        normal maxillary, mandibular, and pectoral-fin cartilage, whereas *sox9a* mutants had misshapen
        pectoral fins and lacked scapulocoracoid cartilage.
