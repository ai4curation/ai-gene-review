id: Q9DFH1
gene_symbol: sox9b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'Sox9b is one of two zebrafish co-orthologs of vertebrate SOX9, produced by the teleost-specific
  genome duplication. It is an SRY-related HMG-box (SoxE group) transcription factor whose HMG box is
  nearly identical to that of Sox9a and human SOX9 and binds the Sox consensus DNA motif; it acts in the
  nucleus to activate target genes such as col2a1a and col11a2. Sox9b is expressed in pharyngeal endoderm
  and epithelia, subsets of craniofacial and pectoral cartilage, otic placode, retina, heart myocardium,
  the hepatopancreatic, intrahepatic and intrapancreatic ducts including pancreatic centroacinar progenitor
  cells, and adult oocytes. It is needed for proper chondrocyte numbers in a subset of craniofacial cartilages,
  and it has roles that zebrafish sox9a does not share: development of the pancreaticobiliary ductal system,
  maintenance of Notch signalling in biliary cells, restraint of endocrine differentiation from ductal
  progenitors downstream of Notch and retinoic acid signalling, liver regeneration by biliary transdifferentiation,
  retinal differentiation, and proepicardium, epicardium and heart valve formation. It acts partly redundantly
  with sox9a in otic development.'
