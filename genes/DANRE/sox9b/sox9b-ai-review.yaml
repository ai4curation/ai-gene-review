suggested_questions:
- question: Are the cartilage, pigment and otic phenotypes originally attributed to the sox9b b971 deletion
    reproduced by sox9b point or frameshift alleles, given that b971 also removes sox8 and other genes?
- question: Would Sox9a protein rescue sox9b-specific ductal, retinal and cardiac phenotypes if expressed
    from sox9b regulatory elements?
- question: 'Why do CRISPR sox9b frameshift mutants reportedly have grossly normal cartilage while b971
    deletion mutants and morphants do not: transcriptional adaptation (e.g. sox9a or sox8 upregulation),
    the extra genes removed by b971, or morpholino off-target effects?'
suggested_experiments:
- description: Knock sox9a coding sequence into the sox9b locus and assay pancreaticobiliary duct, retina
    and epicardium, to test whether copy-specific roles are due only to expression partition.
- description: Analyse pigment-cell (melanophore, iridophore) phenotypes in sox9b fh313 homozygotes to
    resolve whether the b971-based pigment annotations reflect sox9b.
