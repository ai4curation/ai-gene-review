- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:11180959
  review:
    summary: 'Proposed: Sox9b is a sequence-specific transcriptional activator.'
    action: NEW
    reason: Chiang et al. 2001 showed that both zebrafish Sox9 proteins bind HMG consensus DNA and mapped
      a transactivation domain in the middle of each; both proteins retain the ability to regulate the
      Sox9 target col11a2. Proposed identically for sox9a so that the shared molecular function is annotated
      consistently across the pair.
    supported_by:
    - *id001
    - *id019
    - *id020
