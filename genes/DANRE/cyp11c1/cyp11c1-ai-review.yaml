    label: cortisol metabolic process
  evidence_type: IMP
  original_reference_id: PMID:24167225
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-140414-1
  review:
    action: MODIFY
    summary: Specify cortisol biosynthesis as the measured role.
    reason: The older paper uses the historical cyp11b1 name for zebrafish 11-beta-hydroxylase. Gene-targeted
      inhibition lowers cortisol production; subsequent cyp11c1 knockouts independently corroborate this. No
      cortisol catabolic function is established, so the biosynthetic child is the supported refinement.
    supported_by:
