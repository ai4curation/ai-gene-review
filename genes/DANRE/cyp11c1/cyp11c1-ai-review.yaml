id: A1XRK1
gene_symbol: cyp11c1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Cyp11c1 is the zebrafish steroid 11-beta-hydroxylase involved in interrenal cortisol production
  and gonadal 11-oxygenated androgen biosynthesis. It supplies the 11-hydroxylated intermediates used to form
  11-ketotestosterone; later oxidation is performed by other enzymes. Genetic loss strongly reduces cortisol
  and androgen levels and disrupts gonadal maturation, spermatogenesis and reproduction. The protein belongs
  to the heme-dependent cytochrome P450 family. Its historical cyp11b names refer to this same zebrafish gene,
  rather than the separate mammalian CYP11B1/CYP11B2 paralogs.
