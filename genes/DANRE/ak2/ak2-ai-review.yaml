    summary: |-
      PAINT inference (node PTN000599576) of adenylate kinase / AMP kinase activity, the defining activity of the adenylate kinase family, seeded by experimentally characterised members across bacteria, yeast, fly, plant, rodent and human. Zebrafish ak2 retains the CORE/NMPbind/LID architecture and the ATP- and AMP-binding residues (UniProt features), and the L124P zebrafish disease allele in the CORE-LID hinge is predicted to impair activity.
