- term:
    id: GO:0002244
    label: hematopoietic progenitor cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:26150473
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-151210-8
  review:
    summary: |-
      ZFIN IMP (Rissone et al. 2015, full text available): a duplicate row for GO:0002244 recorded against an additional ak2 mutant/morphant reagent. ak2-null (ak2del2, ak2ins4) and L124P mutants, and translation/splice morphants, all show impaired myeloid, lymphoid and erythroid development. HSPC specification (c-myb/runx1 at 30-36 hpf) is largely normal, but c-myb collapses from 2-5 dpf, i.e. maturation/maintenance fails. The defect is driven by increased mitochondrial oxidative stress and apoptosis and is rescued by antioxidants, so ak2 acts through adenine-nucleotide/energy homeostasis rather than executing a differentiation step.
    action: KEEP_AS_NON_CORE
    reason: |-
      Duplicate of the reviewed GO:0002244 row; same action for consistency across the ZFIN reagents. The gene product does not perform a step of hematopoietic differentiation; its adenylate kinase activity maintains the adenine nucleotide pool, and its loss causes ROS-mediated apoptosis that secondarily blocks HSPC maturation. Kept as non-core.
    supported_by: &id001
    - reference_id: PMID:26150473
      supporting_text: AK2 deficiency induces a wide array of hematopoietic defects
    - reference_id: PMID:26150473
      supporting_text: "Antioxidant \ntreatment rescued the hematopoietic phenotypes in vivo in ak2 mutant zebrafish"
