id: Q1L8L9
gene_symbol: ak2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  ak2 encodes adenylate kinase 2, a monomeric phosphotransferase (EC 2.7.4.3) of the mitochondrial intermembrane space that reversibly catalyses AMP + ATP = 2 ADP. By interconverting adenine nucleotides it maintains cellular energy and adenine-nucleotide homeostasis, supplying ADP for oxidative phosphorylation and buffering the AMP/ADP/ATP pool. AK2 is the only adenylate kinase isozyme of the intermembrane space, distinct from the matrix isozymes AK3/AK4 and the cytosolic AK1. In zebrafish ak2 is maternally supplied and expressed at hematopoietic sites; its activity is required for the maturation and maintenance of hematopoietic stem and progenitor cells, and its loss causes oxidative stress-driven apoptosis and defective myeloid, lymphoid and erythroid development, mirroring human reticular dysgenesis.
