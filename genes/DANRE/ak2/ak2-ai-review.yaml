- id: PMID:19043417
  title: Reticular dysgenesis (aleukocytosis) is caused by mutations in the gene encoding mitochondrial adenylate kinase 2.
  findings:
  - statement: Zebrafish ak2 knockdown causes aberrant leukocyte development, consistent with conserved AK2 roles in reticular dysgenesis.
    supporting_text: Knockdown of zebrafish ak2 also leads to aberrant leukocyte development
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Abstract only in the cache. Title matches (Pannicke et al. 2009, Nat Genet). Establishes AK2 as the reticular dysgenesis gene and reports that zebrafish ak2 knockdown causes aberrant leukocyte development; supports the leukocyte-differentiation IMP row and the UniProt disruption-phenotype line. Full mechanistic detail is in the abstract-limited record, so it is used for the phenotype claim only.
- id: PMID:26150473
  title: Reticular dysgenesis-associated AK2 protects hematopoietic stem and progenitor cell development from oxidative stress.
  findings:
  - statement: AK2 deficiency causes broad zebrafish hematopoietic defects.
    supporting_text: AK2 deficiency induces a wide array of hematopoietic defects in zebrafish
  - statement: AK2 is localized to the mitochondrial intermembrane space.
    supporting_text: AK2 is expressed in the mitochondrial intermembrane space
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Full text available and cached. Title matches (Rissone et al. 2015, J Exp Med). Directly supports the zebrafish ak2 hematopoietic-phenotype rows (ak2del2/ins4 nulls, L124P, MO1/MO2 morphants), the intermembrane-space localisation, the increased AMP/ADP ratio confirming loss of AK activity, and the antioxidant rescue that identifies the mechanism as ROS-mediated rather than a direct differentiation role.
- id: file:DANRE/ak2/ak2-uniprot.txt
  title: UniProtKB entry Q1L8L9 for Danio rerio ak2
  findings:
  - statement: UniProt describes mitochondrial AK2 as catalyzing AMP + ATP to ADP in the mitochondrial intermembrane space.
    supporting_text: Reaction=AMP + ATP = 2 ADP;
- id: file:DANRE/ak2/ak2-deep-research-falcon.md
  title: Falcon deep research on Danio rerio ak2 (Edison Scientific Literature)
  findings:
  - statement: AK2 is the adenylate kinase isozyme localized to the mitochondrial intermembrane space, distinct from the matrix-localized AK3/AK4, supporting the intermembrane-space localization annotation.
    supporting_text: AK2 is repeatedly described as the **adenylate kinase isozyme localized to the mitochondrial intermembrane space (IMS)** and distinguished from **AK3/AK4**, which are generally described as mitochondrial matrix enzymes.
