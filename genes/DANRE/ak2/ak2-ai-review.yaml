  review:
    summary: |-
      PAINT inference (node PTN000599576) that adenylate kinase acts in the cytoplasm. The family node includes the cytosolic isozyme AK1 and its orthologs, so cytoplasm reflects the ancestral cytosolic localisation. The AK2 subfamily is targeted to the mitochondrial intermembrane space, which the zebrafish entry carries as a separate, more accurate annotation.
    action: MODIFY
    reason: |-
      The broad cytoplasmic location is true for the family generally but the AK2 subfamily has relocalised to the mitochondrial intermembrane space; the more specific GO:0005758 is supported by the UniProt subcellular-location line and by the existing IEA IMS annotation, so the cytoplasm term should be replaced by it.
