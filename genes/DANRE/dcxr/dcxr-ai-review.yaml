  - WB:WBGene00000984
  review:
    action: ACCEPT
    summary: The enzyme itself performs the L-xylulose to xylitol step, so it takes part in xylulose
      metabolism by catalysis. The process is established for both SF2 (mammalian) and SF3 (nematode) donors.
    supported_by:
    - *id001
    - &id007
      reference_id: PMID:21477590
