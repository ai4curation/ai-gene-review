    reason: 'This is a pathway-level association. The uronate (glucuronate-xylulose) cycle routes carbon from
      glucose through glucuronate to L-xylulose, and DCXR reduces L-xylulose [PMID:11882650]. Every donor is a mammalian
      SF2 DCXR, and PAINT placed the term on the same node as xylulose metabolism. No more specific GO process term
      is a glucose-metabolism descendant that captures this step (GO:0019640 is obsolete, and D-glucuronate catabolic
      process GO:0042840 sits in a different branch), so MODIFY has no valid target. The row is kept as non-core
