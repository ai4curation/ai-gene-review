id: Q567K5
gene_symbol: dcxr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Zebrafish dcxr encodes a short-chain dehydrogenase/reductase related to mammalian dicarbonyl/L-xylulose
  reductase. Its intact SDR catalytic and cofactor-binding architecture supports NADPH-dependent reduction
  of L-xylulose and selected carbonyl substrates. The enzyme is expected to act in pentose/uronate metabolism;
  its exact cellular distribution and quantitative substrate spectrum in zebrafish remain unresolved.
