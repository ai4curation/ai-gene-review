suggested_questions:
- question: Which carbonyl substrates dominate Q567K5 activity and flux in zebrafish, and does it retain
    mammalian DCXR cofactor preferences?
- question: PANTHER names SF3 "D-erythrulose reductase-related" after chicken DER (Q8JIS3), which reduces
    D-erythrulose [PMID:7358641]. Does zebrafish dcxr also act as a D-erythrulose (GO:0047880) reductase, and is
    the SF2/SF3 split more than a mammalian versus non-mammalian lineage division?
- question: Zebrafish, like other teleosts, lacks GULO. Is the complete pentose pathway (akr1a1, cryl1, the
    C11orf54 ortholog, dcxr, sord, xylb) expressed together in zebrafish liver and kidney, as would be expected
    if all glucuronate is routed to D-xylulose-5-phosphate?
suggested_experiments:
- hypothesis: Zebrafish Q567K5 is a functional NADPH-dependent L-xylulose reductase with the substrate
    preference of its mammalian orthologs.
  description: Express and purify recombinant Q567K5 and measure steady-state kinetics for L-xylulose, xylitol,
    D-erythrulose and a panel of alpha-dicarbonyls (diacetyl, methylglyoxal, 3,4-hexanedione) with NADPH and
    with NADH. This would measure the substrate ranking and cofactor preference of the zebrafish enzyme directly
    instead of transferring them from mammals, whose reported specific activities for diacetyl differ by more
    than fiftyfold between species.
  experiment_type: recombinant enzyme kinetics
- hypothesis: dcxr contributes to carbonyl and pentose homeostasis in zebrafish.
  description: Generate a dcxr loss-of-function line and quantify L-xylulose, xylitol, methylglyoxal and
    diacetyl-derived metabolites in larvae and adult tissue by targeted LC-MS/MS, testing whether L-xylulose
    accumulates as it does in human essential pentosuria. Pair this with whole-mount in situ hybridization or
    single-cell data to establish where the gene is expressed, which would also give the compartment evidence
    the ND annotation currently records as absent.
  experiment_type: loss-of-function metabolomics
