    reason: 'The gene product does work in this process: it catalyses the reduction of L-xylulose to xylitol,
      the step that links the glucuronate-derived L-xylulose to the D-xylulose/xylulose-5-phosphate end of the
      pathway [PMID:40737316]. The donors include the same-subfamily nematode ortholog dhs-21 (SF3), whose
      recombinant protein converts L-xylulose to xylitol with NADPH [PMID:21477590], as well as the mammalian
      SF2 DCXRs [PMID:11882650], so this IBA does not depend on transferring across the SF2/SF3 boundary. The
      pentose pathway that DCXR belongs to is inferred to have been present in the animal ancestor [PMID:40737316],
      consistent with a conserved role in a teleost.'
- term:
    id: GO:0006006
    label: glucose metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  review:
    action: MODIFY
    summary: DCXR does not act on glucose; it acts in the pentose branch of D-glucuronate catabolism (the
      "uronate cycle"). The pathway-level intent of the PAINT row is sound, but the specific process the
      enzyme participates in is D-glucuronate catabolism.
    supported_by:
    - reference_id: PMID:11882650
      supporting_text: 'which is involved in the uronate cycle

        of glucose metabolism'
    - &id009
      reference_id: PMID:40737316
      supporting_text: In various eukaryotes, PP and L-ascorbate biosynthesis pathway (ABP) are alternative
        branches of the catabolism D-glucuronate
    - *id008
    proposed_replacement_terms:
    - id: GO:0042840
      label: D-glucuronate catabolic process
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001211870
        source_label: PTN001211870
        source_status: SUPPORTS_TRANSFER
        comment: The node correctly places DCXR in hexose-derived pentose metabolism and Q567K5 lies inside
          it. The issue is the choice of process term (glucose rather than D-glucuronate catabolism), not the
          node placement.
    reason: 'This row comes from the older description of the uronate cycle as an alternative route "of glucose
      metabolism" [PMID:11882650]. In current pathway terms, DCXR catalyses a step in the pentose branch of
      D-glucuronate catabolism: D-glucuronate goes to L-gulonate, then 3-keto-L-gulonate, then L-xylulose, and
      DCXR reduces L-xylulose to xylitol on the way to D-xylulose-5-phosphate [PMID:40737316]. No substrate of
      DCXR is glucose or a glucose-derived phosphate, so "glucose metabolic process" names a pathway this enzyme
      takes no part in. The mouse GO-CAM for the same pathway (gomodel:6246724f00000078) annotates Dcxr
      L-xylulose reductase activity as part of GO:0042840 D-glucuronate catabolic process. This is a lateral
      correction to the process the enzyme catalyses a step of, not a refinement to a descendant. Teleosts
      lack GULO, and in animals without ascorbate synthesis glucuronate is routed into this pentose branch
      [PMID:40737316].'
- term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028442
  review:
    action: MODIFY
    summary: Correct class-level term (NAD(P)-linked CH-OH oxidoreductase), but the specific reaction
      inherited from characterized orthologs, L-xylulose reductase (NADPH), is already carried by this gene.
    supported_by:
    - *id001
    - *id007
    - *id003
    proposed_replacement_terms:
    - id: GO:0050038
      label: L-xylulose reductase (NADPH) activity
    reason: 'The ARBA rule only establishes that this is an SDR-fold NAD(P)-linked oxidoreductase acting on
      a CH-OH centre. That is true, but the evidence supports something more specific. L-xylulose reductase
      (NADPH) (xylitol + NADP+ = L-xylulose + NADPH, acting on the CH-OH group of xylitol) is a descendant of
      this class, it is shown directly for mammalian SF2 and nematode SF3 orthologs [PMID:11882650, PMID:21477590],
      and the gene already carries it by IBA. Replace the class term with GO:0050038.'
- term:
    id: GO:0050038
    label: L-xylulose reductase (NADPH) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  - WB:WBGene00000984
  review:
    action: ACCEPT
    summary: Core activity. L-xylulose reduction with NADPH has been measured directly in purified orthologs
      from both the mammalian SF2 and the nematode SF3 branches, and Q567K5 retains the catalytic triad and
      cofactor motif.
    supported_by:
    - *id001
    - *id007
    - *id004
    - *id003
    - &id010
      reference_id: file:DANRE/dcxr/dcxr-bioinformatics/RESULTS-rereview.md
      supporting_text: Zebrafish and human each have a single PTHR44252 gene in PANTHER 19.0
    reason: 'The re-review has to answer one question about subfamily placement. PANTHER puts Q567K5 in
      PTHR44252:SF3 ("D-erythrulose reductase-related"), while the human, mouse and rat DCXR donors are in
      SF2 ("L-xylulose reductase"). That boundary does not separate an L-xylulose reductase clade from a clade
      with another function. Three facts show this. (1) SF3 contains the non-mammalian vertebrate DCXRs (Xenopus
      dcxr, chicken DCXR and DER) and the nematode ortholog dhs-21, and zebrafish and human each have only one
      PTHR44252 gene, so dcxr and DCXR are 1:1 orthologs. (2) Q567K5 is as similar to mammalian SF2 DCXR (69-70%
      identity) as to SF3 vertebrate members (70-72%) (RESULTS-rereview.md). (3) The SF3 nematode donor dhs-21
      reduces L-xylulose to xylitol with NADPH as a purified recombinant enzyme [PMID:21477590], and the PAINT
      curators included it among the donors to node PTN001211870. The activity is therefore established on both
      sides of the subfamily split and inherited at a node above it, and Q567K5 retains S136/Y149/K153. Accepted
      as the core activity. Zebrafish kinetics and NADPH/NADH preference are unmeasured.'
