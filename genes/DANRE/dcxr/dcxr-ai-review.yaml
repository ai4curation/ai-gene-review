    reason: 'PAINT placed carbonyl reductase (NADPH) activity at PTN001211870, seeded by mouse CBR2 (MGI:107200)
      and worm DHS-21 (WB:WBGene00000984). That node spans all three PTHR44252 subfamilies: SF1 (CBR2), SF2 (mammalian
      DCXR) and SF3 (chicken DER, worm DHS-21, zebrafish dcxr), so Q567K5 lies inside the clade that inherited the
      activity. The chemistry is measured on both sides of the SF2/SF3 split: purified mammalian DCXR is an NADPH-linked
      alpha-dicarbonyl reductase [PMID:11882650], and recombinant worm DHS-21 (SDR20C18) reduces DCXR substrates
