id: Q567K5
gene_symbol: dcxr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Zebrafish dcxr encodes dicarbonyl/L-xylulose reductase, a 244-residue classical short-chain
  dehydrogenase/reductase (SDR) and the single zebrafish member of the PTHR44252 family, orthologous to
  mammalian DCXR. It carries an N-terminal TGxxxGxG Rossmann NADP(H)-binding motif and the conserved SDR
  Ser-Tyr-Lys catalytic triad. By descent from characterized vertebrate and nematode orthologs it is expected
  to be an NADPH-dependent reductase of small sugar carbonyls, above all the reduction of L-xylulose to xylitol
  in the pentose (glucuronate-xylulose) branch of D-glucuronate catabolism, and of alpha-dicarbonyl compounds
  such as diacetyl. The zebrafish protein itself has not been purified or assayed, and its tissue expression
  beyond transcript surveys and its subcellular location are not experimentally established.
