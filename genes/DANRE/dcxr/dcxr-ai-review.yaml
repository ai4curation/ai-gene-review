suggested_questions:
- question: Does zebrafish dcxr retain the L-xylulose preference of mammalian DCXR and worm DHS-21, or the
    D-erythrulose (tetrose) preference reported for chicken DER, its closest characterized SF3 relative?
- question: Is the PANTHER SF2/SF3 split within PTHR44252 a functional boundary, or does it only separate
    mammalian from non-mammalian DCXR orthologs?
suggested_experiments:
- hypothesis: Zebrafish Q567K5 is a functional NADPH-dependent L-xylulose reductase with the substrate
    preference of its DCXR-lineage relatives.
  description: Express and purify recombinant Q567K5 and measure steady-state kinetics for L-xylulose,
    D-erythrulose, xylitol and a panel of alpha-dicarbonyls (diacetyl, 3,4-hexanedione) with NADPH and with
    NADH. This would determine whether the zebrafish enzyme follows the mammalian/worm L-xylulose profile or
    the chicken D-erythrulose profile.
  experiment_type: recombinant enzyme kinetics
- hypothesis: dcxr contributes to pentose (L-xylulose) clearance in zebrafish.
  description: Generate a dcxr loss-of-function line and quantify L-xylulose, xylitol and diacetyl-derived
    metabolites in larvae and adult tissue by targeted LC-MS/MS, testing whether L-xylulose accumulates as in
    human essential pentosuria. Pair this with a tagged-protein or immunolocalization study to resolve the
    cellular compartment that the ND annotation currently records as unknown.
  experiment_type: loss-of-function metabolomics
