    review_notes: 'Cached title matches the citation and the record resolves to the intended 2002 J Biol Chem paper.
      The cache is abstract-only (full_text_available: false), which is why every quotation used here is taken from
      the abstract and why no claim is made about assay detail beyond what the abstract states. Within that limit
      the paper does support how it is cited: it reports purified recombinant DCXR from five mammals as NADPH-linked
      alpha-dicarbonyl reductases that interconvert xylitol and L-xylulose, and places the L-xylulose reductase
      reaction in the uronate cycle of glucose metabolism. It is ortholog enzymology, not zebrafish evidence, and
