      reference_id: PMID:11882650
      supporting_text: 'homotetramers with NADPH-linked reductase activity for alpha-dicarbonyl

        compounds, catalyzed the oxidoreduction between xylitol and l-xylulose'
    - &id002
      reference_id: file:DANRE/dcxr/dcxr-bioinformatics/RESULTS.md
      supporting_text: '| 1–244 | 1–244 | 169 |'
    - &id003
      reference_id: file:DANRE/dcxr/dcxr-bioinformatics/RESULTS.md
      supporting_text: '| Active site: Proton acceptor | 149–149 | 1 / 1 | 1 |'
    - reference_id: file:DANRE/dcxr/dcxr-deep-research-falcon.md
      supporting_text: Earlier mammalian characterization found activity toward diacetyl, 3,4-hexanedione, and
        other aliphatic or alicyclic α-dicarbonyls, but little or no activity toward tested monocarbonyl 
        compounds.
    reason: 'PAINT placed alpha-dicarbonyl carbonyl-reductase activity at node PTN001211870 on the strength of characterized
      DCXR orthologs, and the measurement behind that node is real: purified recombinant proteins from five mammals
      were NADPH-linked reductases for alpha-dicarbonyl compounds [PMID:11882650], with activity toward diacetyl
      and other paired-carbonyl substrates but little toward monocarbonyls. The question for this row is whether
      zebrafish Q567K5 lies inside the clade that inherited the activity, and it does: the protein aligns to human
      DCXR over its full 244 residues with 169 identities and retains the catalytic triad positions and the NADP-contact
      residues (see the bioinformatics RESULTS). Absence of a zebrafish assay is not evidence of divergence, and
      no catalytic disruption is visible, so the node placement stands.'
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    action: ACCEPT
    summary: This ND annotation records that a specific cellular compartment is not established. Mammalian 
      tissue and compartment observations cannot be treated as direct localization of zebrafish Q567K5.
    supported_by:
    - *id001
    - reference_id: file:DANRE/dcxr/dcxr-deep-research-falcon.md
      supporting_text: No direct zebrafish immunolocalization, cell fractionation, proximity-labeling, or 
        fluorescent-tag study was found.
    reason: 'An ND row asserts that no compartment is established, and that is the accurate state for this protein:
      no zebrafish immunolocalization, fractionation or tagging study exists, and the mammalian observations (inner
      membranes of proximal renal tubules; mitochondrial and cytosolic fractions in human liver) are ortholog data
      in a different organ system, not a localization of Q567K5. Accepting the ND is the honest action - it should
      be replaced by a real compartment term when zebrafish data appear, not pre-empted by transferring a mammalian
      compartment.'
- term:
    id: GO:0005997
    label: xylulose metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  - WB:WBGene00000984
  review:
    action: ACCEPT
    summary: The conserved L-xylulose reductase mechanism supports involvement in xylulose metabolism. This is
      a reasonable phylogenetic transfer from experimentally characterized DCXR proteins, with the 
      physiological flux in zebrafish unmeasured.
    supported_by:
    - *id001
    - *id002
    reason: 'Participation here is by catalysis, not by necessity: the gene product itself performs the L-xylulose-to-xylitol
      step, so it does work in xylulose metabolism rather than merely being required for it. The process term follows
      directly from the enzymatic assignment accepted above and sits at the right granularity - it names the metabolite
      the enzyme acts on, without asserting flux magnitude that has not been measured in zebrafish.'
- term:
    id: GO:0006006
    label: glucose metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  review:
    action: KEEP_AS_NON_CORE
    summary: Glucose metabolism is a broad pathway-level association through the uronate cycle, not direct 
      glucose reduction by DCXR. The primary mammalian study explicitly places L-xylulose reductase in that 
      pathway; retain as non-core.
    supported_by:
    - reference_id: PMID:11882650
      supporting_text: 'which is involved in the uronate cycle

        of glucose metabolism'
    - reference_id: file:DANRE/dcxr/dcxr-deep-research-falcon.md
      supporting_text: The strongest pathway assignment is the **uronate cycle**, an alternative route of 
        glucose and glucuronate metabolism. DCXR performs the L-xylulose-to-xylitol step.
    reason: 'The link to glucose metabolism is indirect: DCXR does not act on glucose, it acts on L-xylulose within
      the uronate cycle, an alternative route of glucose and glucuronate metabolism [PMID:11882650]. The term is
      therefore true at the pathway level and not an error, but it is a broad parent reached through one downstream
      step and tells a reader nothing about what this enzyme does. Retained as non-core rather than removed, since
      the PAINT placement is defensible and the uronate cycle is the standard pathway assignment for this family.'
- term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028442
  review:
    action: MODIFY
    summary: The broad NAD(P)-linked alcohol/carbonyl oxidoreductase class is correct, but the DCXR-like 
      sequence and characterized ortholog chemistry support the more specific L-xylulose reductase term.
    supported_by:
    - *id001
    - *id003
    proposed_replacement_terms:
    - id: GO:0050038
      label: L-xylulose reductase (NADPH) activity
    reason: 'The ARBA rule can only see that this is an SDR-fold NAD(P)-linked oxidoreductase acting on a CH-OH
      centre, which is correct as far as it goes. A specific child is supported on the same evidence that supports
      the IBA rows: the characterized reaction of the orthologs is the NADPH-dependent reduction of L-xylulose [PMID:11882650],
      and the zebrafish sequence retains the catalytic and cofactor-binding residues. Replace the class-level term
      with GO:0050038 rather than keeping a broad annotation alongside the specific one.'
- term:
    id: GO:0050038
    label: L-xylulose reductase (NADPH) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  - WB:WBGene00000984
  review:
    action: ACCEPT
    summary: The IBA substrate assignment is supported by conserved DCXR sequence architecture and direct 
      ortholog enzymology. The subfamily label is not itself functional proof, but neither a label difference 
      nor absence of a zebrafish assay refutes the phylogenetic inference.
    supported_by:
    - *id001
    - *id002
    - *id003
    - reference_id: file:DANRE/dcxr/dcxr-deep-research-falcon.md
      supporting_text: The most conservative annotation is **NAD(P)H-dependent, probably NADPH-preferring 
        under physiological conditions**.
    reason: The specific physiological reaction of the family, L-xylulose + NADPH -> xylitol, was demonstrated
      directly on purified ortholog enzymes, which interconvert xylitol and L-xylulose [PMID:11882650]. The 
      zebrafish protein retains the proton-acceptor position and the full SDR catalytic architecture, so this 
      is a transfer within the clade rather than across a divergence boundary. It is the most informative 
      molecular function available for this gene and is therefore the core activity; the kinetic parameters in
      zebrafish remain unmeasured, which limits quantitative claims but not the identity of the reaction.
