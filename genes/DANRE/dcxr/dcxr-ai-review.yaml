  - WB:WBGene00000984
  review:
    action: ACCEPT
    summary: The PAINT carbonyl-reductase inference agrees with the intact DCXR-like sequence and purified 
      mammalian dicarbonyl-reductase activity. Substrate efficiencies have not been measured for zebrafish, 
      but there is no target-specific catalytic disruption or evidence of a different enzyme class.
    supported_by:
