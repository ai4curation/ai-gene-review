  review:
    action: ACCEPT
    summary: The ND annotation records that no compartment has been established for the zebrafish protein,
      and that is accurate. Localizations reported for relatives disagree with each other and cannot be transferred.
    supported_by:
    - reference_id: file:DANRE/dcxr/dcxr-deep-research-falcon.md
      supporting_text: No direct zebrafish immunolocalization, cell fractionation, proximity-labeling, or
        fluorescent-tag study was found.
    - &id007
      reference_id: PMID:21477590
      supporting_text: on the plasma membrane of spermatids
    reason: 'No zebrafish localization study exists. The relatives disagree: mammalian DCXR was found on inner
      membranes of renal proximal tubules and in cytosolic and mitochondrial liver fractions, chicken DER is recorded
      as cytoplasmic, and worm DHS-21 appears on the plasma membrane of spermatids [PMID:21477590]. PAINT propagated
      no compartment from node PTN001211870, which is consistent with that heterogeneity. The ND row is the honest
      state and should be replaced only when zebrafish data appear.'
