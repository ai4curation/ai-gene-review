- term:
    id: GO:0050038
    label: L-xylulose reductase (NADPH) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1915130
  - PANTHER:PTN001211870
  - RGD:620031
  - UniProtKB:Q7Z4W1
  - WB:WBGene00000984
  review:
    action: ACCEPT
    summary: This is the core activity. NADPH-dependent L-xylulose reduction is shown directly for mammalian
      DCXR and for C. elegans DHS-21, which shares PANTHER subfamily SF3 with the zebrafish protein. Q567K5 retains
      the catalytic and cofactor-binding residues.
    supported_by:
    - *id001
    - *id008
    - *id002
    - *id003
    - reference_id: file:DANRE/dcxr/dcxr-bioinformatics/RESULTS.md
      supporting_text: '| Q8JIS3 | DER | PTHR44252:SF3 | 0.701 |'
    reason: 'UniProt places Q567K5 in PTHR44252:SF3 (D-ERYTHRULOSE REDUCTASE-RELATED), not SF2 (L-XYLULOSE REDUCTASE)
      with human DCXR. That does not limit this transfer. SF3 is the non-mammalian DCXR lineage: chicken DER (70%
      identical to Q567K5, closer than human DCXR at 69%) and worm DHS-21. A seven-sequence neighbour-joining tree
      groups Q567K5 with these (RESULTS.md). DHS-21 is itself an experimentally confirmed NADPH-dependent L-xylulose
      reductase [PMID:21477590], and PAINT drew GO:0050038 from both the SF2 and SF3 donors at the shared node.
      The activity is therefore ancestral to the SF2+SF3 clade, not a mammal-specific innovation. Chicken DER also
      reduces D-erythrulose, and PAINT did not propagate a tetrose-reductase term. That omission is treated as deliberate,
      and no D-erythrulose reductase annotation is proposed for zebrafish.'
