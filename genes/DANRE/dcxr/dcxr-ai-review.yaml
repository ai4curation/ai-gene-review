    summary: DCXR does not act on glucose. It acts on L-xylulose in the uronate cycle, which the primary
      mammalian study describes as part of glucose metabolism. The term is true at the pathway level but
      peripheral to the enzyme's own work.
    supported_by:
    - reference_id: PMID:11882650
      supporting_text: 'which is involved in the uronate cycle

        of glucose metabolism'
    - reference_id: file:DANRE/dcxr/dcxr-deep-research-falcon.md
      supporting_text: The strongest pathway assignment is the **uronate cycle**, an alternative route of
