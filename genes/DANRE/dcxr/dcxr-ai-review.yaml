      Ser136/Tyr149/Lys153 triad and 12 of 14 NADP-contact positions of human DCXR (dcxr-bioinformatics/RESULTS.md).
      Without a zebrafish assay the substrate ranking is unknown, but nothing argues for loss or divergence of
      the activity.'
