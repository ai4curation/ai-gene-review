id: Q567K5
gene_symbol: dcxr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Zebrafish dcxr encodes a short-chain dehydrogenase/reductase related to mammalian 
  dicarbonyl/L-xylulose reductase. Its intact SDR catalytic and cofactor-binding architecture supports 
  NADPH-dependent reduction of L-xylulose and selected carbonyl substrates. The enzyme is expected to act in 
  pentose/uronate metabolism; its exact cellular distribution and quantitative substrate spectrum in zebrafish
  remain unresolved.
existing_annotations:
- term:
    id: GO:0004090
    label: carbonyl reductase (NADPH) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
