id: Q567K5
gene_symbol: dcxr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Zebrafish dcxr encodes a 244-residue classical short-chain dehydrogenase/reductase (SDR) of the
  dicarbonyl/L-xylulose reductase (DCXR) family. It is the fish member of the vertebrate DCXR lineage and groups
  with chicken D-erythrulose reductase and Caenorhabditis elegans DHS-21, the non-mammalian branch of the
  family, while mammalian DCXR and the mammalian tetrameric carbonyl reductase CBR2 form sister branches. The
  protein retains the Ser-Tyr-Lys catalytic triad and the NADP(H)-binding Rossmann-fold residues of human DCXR.
  By descent from experimentally characterized relatives, it is expected to be an NADPH-dependent reductase
  that converts L-xylulose to xylitol in the uronate pathway of glucuronate/pentose metabolism and reduces
  small alpha-dicarbonyl and sugar carbonyl substrates. No zebrafish enzymology, localization or mutant
  analysis has been reported, so its substrate preferences, cellular compartment and physiological roles in
  fish remain unmeasured.
