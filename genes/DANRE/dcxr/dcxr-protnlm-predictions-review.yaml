  review:
    assessment: LSP
    confidence_score: 2
    summary: DCXR is an oxidoreductase, but the generic term is an ancestor of the more specific activities
      the gene already carries in GOA and that the gene review accepts as core, L-xylulose reductase (NADPH)
      activity (GO:0050038) and carbonyl reductase (NADPH) activity (GO:0004090), both by IBA from PAINT node
      PTN001211870. Those activities are measured on purified mammalian DCXR and on the nematode SF3 ortholog
      DHS-21, and Q567K5 aligns gaplessly to human DCXR with the catalytic triad conserved. No zebrafish enzyme
      assay was found in a PubMed search. The correct broad class does not validate the separate FabG function
      paragraph.
