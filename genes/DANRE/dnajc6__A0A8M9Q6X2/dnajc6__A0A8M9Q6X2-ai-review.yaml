id: A0A8M9Q6X2
gene_symbol: dnajc6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  dnajc6 encodes zebrafish auxilin, a J-domain (DnaJ/HSP40 family) co-chaperone of the
  auxilin/GAK family that lacks the N-terminal kinase domain of its paralog GAK. The 979-residue
  protein comprises an N-terminal PTEN-like tensin-type phosphatase domain and C2 domain, a long
  disordered central region that in mammalian auxilin carries the clathrin-binding motifs, and a
  C-terminal J domain with an intact HPD motif. The PTEN-like domain has a degenerate P-loop
  (TCSDGRAPS in place of HCxxGxxR) like that of mammalian auxilin, which is catalytically inactive
  and instead acts as a phosphoinositide-binding module that recruits auxilin to newly budded
  clathrin-coated vesicles. Zebrafish auxilin is expressed predominantly in neural tissues during
  embryogenesis. When expressed in HeLa cells, GFP-tagged zebrafish auxilin is mostly cytosolic,
  with perinuclear enrichment overlapping clathrin, and at high levels it induces clathrin-positive
  aggregates. Expressed in Drosophila, it rescues the neurogenic defect and the lethality of auxilin
  (dAux) mutants, and this rescue requires its J domain. By orthology with mammalian auxilin, it is
  inferred to bind clathrin and to recruit and activate HSC70 for the ATP-dependent uncoating of
  clathrin-coated vesicles, including synaptic vesicles during their endocytic recycling. No
  biochemical or loss-of-function study of the zebrafish protein in zebrafish has been reported.
