  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000414225
  review:
    summary: >-
      UniRule transfer of phosphoprotein phosphatase activity based on the tensin-type
      phosphatase domain. The auxilin PTEN-like domain is a pseudophosphatase: the bovine auxilin
      structure shows a P-loop that lacks the catalytic arginine and occludes the cysteine, and no
      activity is detectable. The zebrafish protein carries the same degenerate P-loop
      (TCSDGRAPS, with Pro at the arginine position and Thr at the motif histidine).
    action: REMOVE
    reason: >-
      Fold-based transfer of a catalytic activity to a domain that has lost its catalytic
      machinery (pseudoenzyme over-annotation). Experimental structure and assays on mammalian
      auxilin, which sits in the same PANTHER subfamily (PTHR23172:SF4), show that this domain has
      no phosphatase activity; its role is phosphoinositide binding for recruitment. The
      zebrafish P-loop is degenerate at the same position (bioinformatics RESULTS.md). PAINT
      curators placed no phosphatase activity at the family nodes from which this gene inherits
      its IBAs.
    supported_by:
    - reference_id: PMID:20826345
      supporting_text: In auxilin, the HCxxGxxR motif, conserved in P-loops of protein tyrosine phosphatases and dual specificity phosphatases as well as in PTEN and its orthologs, lacks the final arginine
    - reference_id: PMID:20826345
      supporting_text: Differences at key residues in the catalytic cleft suggest that the PTEN-like region of auxilin will not have phosphatase activity, however, and indeed, no activity can be detected.
