      (PMID:17114649). The characterized functional site of auxilin is the presynaptic terminal,
      where it uncoats endocytic clathrin-coated synaptic vesicles.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The node placement is reasonable (zebrafish is inside Euteleostomi), but the underlying
