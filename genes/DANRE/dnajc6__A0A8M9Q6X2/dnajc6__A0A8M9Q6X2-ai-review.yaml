      auxilin acts in the PSD. The functional data for auxilin (knockout synapses) point to a
      presynaptic role in synaptic vesicle recycling. Nothing in zebrafish addresses postsynaptic
      localization. Retained as a weak, non-core claim rather than removed, because a
      postsynaptic clathrin-endocytosis role has not been excluded.
