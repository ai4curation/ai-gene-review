suggested_questions:
- question: >-
    Is zebrafish dnajc6 required for synaptic vesicle recycling in zebrafish neurons, and does gak
    compensate for its loss as GAK does in auxilin-knockout mice?
- question: >-
    Which zebrafish dnajc6 isoform (the 873-residue cDNA studied by Bai et al. 2010 or the
    979-residue RefSeq model) is the predominant neural form, and do the isoforms differ in
    clathrin-binding motifs?
- question: >-
    Should the UniRule rule UR000414225 exclude auxilin-family PTEN-like domains, whose degenerate
    P-loops lack the catalytic arginine, from phosphatase activity assignments?
suggested_experiments:
- description: >-
    Generate dnajc6 mutant zebrafish and examine clathrin-coated vesicle and empty-cage accumulation
    at synapses by electron microscopy, together with synaptic vesicle endocytosis assays, with and
    without gak knockdown.
  experiment_type: genetic loss of function with ultrastructural analysis
- description: >-
    Reconstitute clathrin-cage disassembly with purified zebrafish dnajc6 (wild-type and HPD-motif
    mutant), Hsc70 and ATP, and assay phosphatase activity of its PTEN-like domain against
    phosphopeptide and phosphoinositide substrates.
  experiment_type: in vitro biochemistry
