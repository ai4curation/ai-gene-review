    summary: >-
      Euteleostomi-level PAINT node (PTN002753975) assertion seeded by mouse auxilin knockout
      data showing accumulation of clathrin-coated vesicles and empty cages at synapses and impaired
      synaptic vesicle endocytosis. Zebrafish dnajc6 is the neural auxilin ortholog within this
      clade.
    action: ACCEPT
    reason: >-
      Inferred, not experimentally established, in zebrafish. The phylogenetic placement is sound:
      zebrafish auxilin groups with mammalian auxilin rather than GAK, is neurally expressed, and
      can substitute for Drosophila auxilin in a J-domain-dependent manner, consistent with a
      conserved Hsc70 co-chaperone role in uncoating. Auxilin does work in this process (it binds
      the clathrin coat and recruits and activates the uncoating ATPase), so this is genuine
      participation. This is the most specific process term carried and it entails clathrin coat
      disassembly and clathrin-dependent endocytosis.
