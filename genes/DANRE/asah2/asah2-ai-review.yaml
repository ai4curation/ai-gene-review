- question: "Does zebrafish Asah2 (Q5W7F1) display the substrate chain-length preference and neutral-pH\nkinetics characteristic of mammalian neutral ceramidases, or are there zebrafish-specific\ndifferences in ceramide vs dihydroceramide selectivity?"
- question: "What is the definitive subcellular localization of endogenous zebrafish Asah2 (plasma\nmembrane/apical vs Golgi vs mitochondrion), given that mammalian mitochondrial localization\nderives largely from overexpression studies?"
suggested_experiments:
- description: "Generate a CRISPR loss-of-function asah2 zebrafish line and perform lipidomics to test whether\nceramide accumulates and sphingosine/S1P decrease, directly probing dietary sphingolipid\ndigestion and the ceramide/S1P rheostat in vivo."
- description: "Determine zebrafish Asah2 subcellular localization using a tagged knock-in, membrane\nfractionation, and immunolocalization to resolve plasma-membrane/apical versus Golgi and\nmitochondrial signals."
