- term:
    id: GO:0042759
    label: long-chain fatty acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Long-chain fatty acid biosynthetic process is propagated from a family node (PTN004377481) seeded by two Pseudomonas aeruginosa ceramidases; the free fatty acid released by Asah2 is a hydrolysis product of ceramide catabolism, not the output of a fatty acid biosynthetic pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: The reaction is N-acylsphingosine + H2O -> sphingosine + fatty acid with a left-to-right physiological direction; describing the fatty acid leaving group as fatty acid biosynthesis conflates a catabolic amide hydrolysis with a biosynthetic pathway. The zebrafish enzyme is a plasma-membrane/extracellular-facing ceramidase, so this family-level term overstates its role in fatty acid biosynthesis; ceramide catabolic process (GO:0046514) and sphingosine biosynthetic process (GO:0046512) already capture the correct process context.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN004377481
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral node placement covers the amidase reaction, but the biosynthetic framing of the fatty acid leaving group does not describe what the zebrafish ceramidase does physiologically.
      - source_id: UniProtKB:O06769
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Pseudomonas aeruginosa ceramidase donor; the term reflects fatty acid release during ceramide hydrolysis rather than a biosynthetic pathway.
      - source_id: UniProtKB:Q9I596
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Second Pseudomonas donor with the same reaction-derived term.
