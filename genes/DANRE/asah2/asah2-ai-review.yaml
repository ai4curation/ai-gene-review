- id: PMID:15271994
  title: Molecular cloning and functional analysis of zebrafish neutral ceramidase.
  findings:
  - statement: The zebrafish cDNA confers neutral-pH ceramidase activity on transfected cells.
    supporting_text: The enzyme activity at neutral pH increased markedly after transformation of Chinese hamster CHOP and zebrafish BRF41 cells with the cDNA
  - statement: Overexpressed zebrafish enzyme localizes to ER/Golgi and plasma membrane.
    supporting_text: The overexpressed enzyme was found to be distributed in endoplasmic reticulum/Golgi compartments as well as the plasma membranes
  - statement: Knockdown raises embryonic ceramide levels.
    supporting_text: The ceramide level in AMO-injected embryos increased significantly compared with that in control embryos
  - statement: Co-injected mRNA rescues enzyme activity and circulation, showing specificity of the knockdown.
    supporting_text: Simultaneous injection of both AMO and synthetic znCD mRNA into one-cell-stage embryos rescued znCD activity and blood cell circulation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached PubMed record; primary cloning, activity, localization and morpholino study of zebrafish asah2 (znCD). Only the abstract is cached, so full-text details such as apical/intestinal immunolocalization are taken on the ZFIN curator's reading.
- id: PMID:26190575
  title: Structural Basis for Ceramide Recognition and Hydrolysis by Human Neutral Ceramidase.
  findings:
  - statement: Human neutral ceramidase is a Zn2+-dependent amidase converting ceramide to sphingosine.
    supporting_text: Neutral ceramidase (nCDase) catalyzes conversion of the apoptosis-associated lipid ceramide to sphingosine, the precursor for the proliferative factor sphingosine-1-phosphate
  - statement: The catalytic mechanism is a Zn2+-dependent amidase strategy.
    supporting_text: Our results suggest that nCDase uses a new catalytic strategy for Zn(2+)-dependent amidases
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title matches PubMed; human ortholog crystal structure used only to support the conserved zinc-dependent catalytic mechanism whose ligands UniProt maps onto the zebrafish protein by similarity. Abstract-only cache.
