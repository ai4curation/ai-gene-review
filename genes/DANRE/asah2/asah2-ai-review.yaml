id: Q5W7F1
gene_symbol: asah2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Asah2 is the zebrafish neutral ceramidase (N-acylsphingosine amidohydrolase 2, EC 3.5.1.23), a 743-residue single-pass type II membrane glycoprotein whose zinc-dependent catalytic domain faces the extracellular or lumenal side. It hydrolyzes the amide bond of ceramides at neutral pH to release sphingosine and a free fatty acid, the non-lysosomal entry point of the sphingolipid salvage pathway that supplies sphingosine for sphingosine-1-phosphate synthesis. The enzyme acts at the plasma membrane, including the apical brush border of intestinal epithelium, and is expressed and active during embryogenesis; morpholino knockdown raises embryonic ceramide and causes head/tail morphogenesis defects, pericardial edema, circulation failure and apoptosis that are rescued by co-injected asah2 mRNA.
