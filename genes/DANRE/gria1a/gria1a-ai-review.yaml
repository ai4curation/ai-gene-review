id: Q71E65
gene_symbol: gria1a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: gria1a (glutamate receptor, ionotropic, AMPA 1a) is one of two zebrafish co-orthologs of vertebrate
  GRIA1 (GluA1), retained from the teleost-specific genome duplication; its paralog is gria1b. It encodes an AMPA-type
  ionotropic glutamate receptor subunit, a four-segment membrane protein that assembles into tetrameric
  glutamate-gated cation channels at excitatory postsynaptic sites and mediates fast excitatory synaptic transmission.
  The protein keeps the glutamate-binding residues, the channel pore and M2-M3 gating segment, and the C-terminal
  phosphorylation serines of mammalian GluA1, and it is the more conserved of the two copies. gria1a is expressed
  by 24 hours post-fertilization in many neuronal populations of the developing brain (including telencephalon, olfactory
  bulb, habenula, thalamus, hypothalamus, tectum and hindbrain), retina and spinal cord, and is the more abundant copy
  in larvae. No loss-of-function study of gria1a alone has been reported.
