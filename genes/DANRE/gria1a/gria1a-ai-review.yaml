core_functions:
- description: AMPA-type ionotropic glutamate receptor subunit (GluA1 co-ortholog) that forms tetrameric glutamate-gated
    cation channels in the postsynaptic density membrane of excitatory synapses and mediates fast glutamatergic
    transmission. The more conserved and, in larvae, more abundant of the two copies; function inferred from conserved
    ligand-binding and pore residues, not measured.
