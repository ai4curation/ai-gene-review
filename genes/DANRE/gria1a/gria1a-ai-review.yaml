suggested_questions:
- question: Do gria1a and gria1b co-assemble in the same AMPA receptors, and in which neurons does each copy dominate
    (single-cell or double in situ data at larval and adult stages)?
- question: Which copy, or the double mutant, produced the gria1 pallium activity phenotype in the Thyme et al. 2019
    schizophrenia-gene screen?
suggested_experiments:
