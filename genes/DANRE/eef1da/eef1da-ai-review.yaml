suggested_questions:
- question: Are eef1da long isoforms (N-terminal extension) actually translated in zebrafish, and do they enter
    the nucleus like mammalian eEF1BdeltaL?
- question: Do eef1da and eef1db proteins both assemble into eEF1B, in what ratio, and does the ratio change between
    oocyte/early embryo (eef1da-biased) and later tissues?
- question: Is eef1da dispensable, and is eef1db upregulated in eef1da mutants?
suggested_experiments:
- hypothesis: The paralogs are dosage-redundant eEF1B subunits.
  description: Generate eef1da and eef1db single and double mutants (including RNA-less alleles) and measure viability,
    growth and global translation (puromycin incorporation, polysome profiles).
  experiment_type: genetic interaction analysis
- hypothesis: Both paralog proteins are incorporated into eEF1B.
  description: Paralog-specific peptide quantification (targeted proteomics) of eEF1B immunoprecipitates from embryos
    and adult tissues.
  experiment_type: proteomics
