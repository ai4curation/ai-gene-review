description: eef1da (eukaryotic translation elongation factor 1 delta a) is one of two zebrafish co-orthologs of
  vertebrate EEF1D, retained from the teleost-specific genome duplication; its paralog is eef1db (chromosome 20;
  eef1da is on chromosome 2). It encodes the delta subunit of the eEF1B complex, the guanine-nucleotide exchange
  factor that regenerates GTP-bound eEF1A during translation elongation. The protein has an N-terminal region, a
  leucine zipper for complex assembly, an acidic region and a C-terminal GEF domain that is 78% identical to human
  EEF1D and 89% identical to eef1db. The gene makes short isoforms (about 245-291 aa) and predicted long isoforms
  (417-463 aa; the reviewed entry is a 463-aa model) with an N-terminal extension whose similarity to the mammalian
  eEF1BdeltaL extension is not distinguishable from background. eef1da mRNA is broadly expressed, with a higher
  maternal and early-embryo signal than eef1db. No gene-specific functional study exists in zebrafish.
