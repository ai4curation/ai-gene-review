  supporting_entities:
  - InterPro:IPR027263
  review:
    summary: Fc receptor signaling pathway annotated electronically from the SCGF_receptor InterPro 
      domain (IPR027263).
    action: REMOVE
    reason: GO:0038093 is a process term (it does not assert that kita is itself an Fc receptor); 
      mammalian KIT carries it for SCF/KIT crosstalk with the high-affinity IgE receptor FcepsilonRI
      in mast cells, an IDA-grounded interaction (the human KIT review keeps the identical IPR027263
      mapping as KEEP_AS_NON_CORE on PMID:20100931). That crosstalk has no zebrafish counterpart, 
      because teleosts have neither IgE nor an FcepsilonRI alpha subunit, so the domain-based IEA 
      over-propagates a mammal-specific process onto kita and is removed on taxonomic grounds.
      The teleost immunoglobulin repertoire is documented in the review PMID:33439286, whose
      abstract states that teleosts have three isotypes (IgM, IgT and IgD); the absence of IgE,
      and hence of an IgE-binding FcepsilonRI alpha chain, follows from that complete isotype
      list rather than from a sentence that names IgE explicitly, which is not directly
      quotable from the cached abstract.
    supported_by:
    - reference_id: PMID:33439286
      supporting_text: In teleosts, three immunoglobulin isotypes, IgM, IgT, and IgD, are present
