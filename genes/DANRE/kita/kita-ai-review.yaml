- description: kita is the receptor for the ligand kitla in the zebrafish embryo (PMID:17257055); by
    orthology to mammalian KIT, ligand binding drives receptor dimerization and activation of the 
    split cytoplasmic tyrosine kinase (EC 2.7.10.1), with autophosphorylation and recruitment of 
    downstream effectors that transduce the Kit signaling pathway. The dimerization/kinase mechanism
    itself is established for human KIT (PMID:17662946) and inferred here for the conserved 
    zebrafish ortholog rather than shown directly in fish.
