id: Q8JFR5
gene_symbol: kita
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'kita is one of two zebrafish (Danio rerio) co-orthologs of mammalian KIT (the other being
  kitb), arising from the teleost whole-genome duplication. It encodes a single-pass type I transmembrane
  class III receptor tyrosine kinase (EC 2.7.10.1) and is the cell-surface receptor for the stem cell
  factor ortholog kitlg/kitla. The extracellular region comprises five immunoglobulin-like C2 domains
  that bind ligand and mediate receptor contacts; a single transmembrane helix connects to a split cytoplasmic
  tyrosine kinase domain. Ligand binding drives receptor dimerization and trans-autophosphorylation, activating
  downstream RAS-MAPK, PI3K-AKT and JAK-STAT signaling. kita acts principally at the plasma membrane.
  It corresponds to the classical pigment-pattern mutant sparse: kita is required for the migration and
  survival of embryonic neural-crest-derived melanophores, for early-metamorphic melanophores of the adult
  stripe pattern, and for melanocyte stem cell establishment during larval melanocyte regeneration. kita
  is also expressed by, and required for, Kit-positive interstitial cells of Cajal that pace coordinated
  gastrointestinal motility. In contrast to mammalian KIT, zebrafish kita is not essential for hematopoiesis
  or primordial germ cell development, reflecting subfunctionalization following the teleost duplication.'
