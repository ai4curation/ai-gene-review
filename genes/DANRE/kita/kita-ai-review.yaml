    review_notes: 'PubMed-verified review (Bilal, Etayo & Hordvik, Immunogenetics 2021), abstract-only
      cache. Cited only for the taxonomic premise behind removing the Fc receptor signaling pathway
      IEA: the abstract lists the complete teleost isotype set (IgM, IgT, IgD), which excludes IgE;
