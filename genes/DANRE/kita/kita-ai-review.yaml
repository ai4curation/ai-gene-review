      the SCF ortholog kitla.
    action: MODIFY
    reason: 'kita binds the stem cell factor ortholog kitla (established genetically: kitla morphants
      phenocopy kita-null, kitla-induced hyperpigmentation is kita-dependent). The specific and more informative
      molecular function is stem cell factor receptor activity.'
    proposed_replacement_terms:
    - &id001
      id: GO:0005020
      label: stem cell factor receptor activity
    supported_by:
    - reference_id: PMID:17257055
      supporting_text: kitla is the functional ligand to kita
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN004704336
        source_label: type III receptor tyrosine kinase family node
        source_status: SUPPORTS_TRANSFER
        comment: The IBD sits on the type-III RTK family (KIT, PDGFRs, CSF1R, FLT3), whose members 
          each bind their own growth-factor ligand, so the node-level term 'growth factor binding' 
          is correct but generic. For kita the ligand is the SCF ortholog kitla, so the more 
          specific child GO:0005020 (stem cell factor receptor activity) is the informative term. 
          This is a granularity refinement of a correctly-placed node annotation, not a propagation 
          error.
