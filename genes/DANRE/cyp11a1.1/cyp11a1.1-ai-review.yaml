    reason: PMID:23671259 confirms abnormal gastrulation in historical cyp11a1 morphants, consistent
      with PMID:16437115 rescue experiments. Retain this developmental context, but qualify necessity
      because later stable knockout lines appeared normal in PMID:36332486. The protein synthesizes
      a steroid mediator rather than serving as a mechanical epiboly component.
