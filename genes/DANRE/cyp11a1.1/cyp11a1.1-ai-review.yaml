- term:
    id: GO:0031116
    label: positive regulation of microtubule polymerization
  evidence_type: IGI
  original_reference_id: PMID:23955365
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-060301-3
  - ZFIN:ZDB-MRPHLNO-131112-1
  review:
    summary: Pregnenolone production supports microtubule polymerization during embryonic development.
    action: KEEP_AS_NON_CORE
    reason: Retain the existing developmental regulation claim as a product-mediated effect, not
      direct microtubule binding by CYP11A. PMID:16437115 reports reduced polymerized microtubules
      after cyp11a1 knockdown and pregnenolone rescue; PMID:23955365 identifies CLIP-170 as the downstream
      pregnenolone effector. Stable knockout and morphant phenotypes differ (PMID:36332486), so this
      is not an unconditional requirement for this paralog.
    supported_by:
    - reference_id: PMID:16437115
      supporting_text: the epibolic delay is accompanied by a decrease in the level of polymerized
        microtubules, and that pregnenolone can rescue this microtubule defect.
    - reference_id: PMID:36332486
      supporting_text: Both homozygous cyp11a1 knockout lines appeared normal.
    - reference_id: PMID:23955365
      supporting_text: P5 activates CLIP-170 to promote microtubule polymerization and cell migration.
