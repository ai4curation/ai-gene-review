id: Q7SYJ6
gene_symbol: cyp11a1.1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Cyp11a1.1, historically called Cyp11a1, is a mitochondrial cholesterol side-chain-cleavage
  enzyme that supplies pregnenolone. In zebrafish it is associated with maternal and early extraembryonic
  steroid production and is expressed mainly in gonads in adults. Pregnenolone supports microtubule-dependent
  embryonic movements; morpholino and stable-mutant phenotypes differ, so an unconditional requirement
  for this paralog alone is not established. The tandem duplicate Cyp11a1.2, historically Cyp11a2,
  has the better established interrenal steroidogenic role.
