        necessary for tof function.
- term:
    id: GO:0071679
    label: commissural neuron axon guidance
  evidence_type: IMP
  original_reference_id: PMID:21471212
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-110701-16
  review:
    summary: >-
      IMP from the tof mutant. In Chen et al. (PMID:21471212; full text cached) the
      anterior and post-optic commissures fail to cross the midline properly at 36 hpf
      in tof mutants and fezf2 morphants, but the defect recovers later. The authors
      looked for it only because fezf2 directly activates lhx2b, whose loss (belladonna)
      causes a midline axon guidance defect.
    action: KEEP_AS_NON_CORE
    reason: >-
      The commissural crossing phenotype is a supported consequence of the Fezf2
      transcriptional program: Fezf2 directly activates or maintains lhx2b expression,
      and the cited full-text paper tests the axon phenotype because lhx2b/belladonna
      itself affects midline axon guidance. Kept as non-core because the phenotype is
      transient, recovers by 48 hpf, and is downstream of Fezf2's core
      cis-regulatory DNA-binding transcription factor activity rather than a separate
      guidance mechanism.
    supported_by:
    - reference_id: PMID:21471212
      supporting_text: >-
        Immunostaining with the anti-acetylated tubulin antibody uncovered that the
        anterior commissure as well as the post-optic commissure failed to cross the
        midline in both the tof mutant and fezf2 morphant properly ( Fig. 5 G ) at 36
        hpf. However, this defect did recover later
