- term:
    id: GO:0021879
    label: forebrain neuron differentiation
  evidence_type: IMP
  original_reference_id: PMID:18799544
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-070129-9
  review:
    summary: >-
      IMP from the tof m808 hypomorph. Russek-Blum et al. (PMID:18799544; full text
      cached) show that canonical Wnt signalling at the end of gastrulation sets the
      size of the diencephalic dopaminergic progenitor pool, that fezl is epistatic to
