  description: >-
    Forebrain-specific C2H2 zinc-finger transcription factor. Binds a defined DNA motif
    through its six C-terminal zinc fingers and regulates target genes such as eomesa
    and lhx2b (PMID:21471212); carries an eh1 repressor motif required for in vivo
    function (PMID:12469125). Through this activity it establishes diencephalic
    subdivisions by repressing wnt expression (PMID:17164418), specifies hypothalamic
    neurons upstream of otp (PMID:18003738; PMID:23533176), and sets the number of
    forebrain dopaminergic and serotonergic neurons downstream of canonical Wnt
    signalling (PMID:12469125; PMID:15219677; PMID:18799544).
  supported_by:
  - reference_id: PMID:21471212
    supporting_text: >-
      Our in-depth analyses of two selected genomic fragments reveal that Fezf2
      directly activates evolutionarily conserved genes eomesa/tbr2 and lhx2b .
