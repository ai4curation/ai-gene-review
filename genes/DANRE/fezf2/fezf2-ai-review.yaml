- id: PMID:10191060
  title: Mutations in the zebrafish unmask shared regulatory pathways controlling
    the development of catecholaminergic neurons.
  findings:
  - statement: >-
      The too few mutation, later shown to disrupt fezl/fezf2, causes a specific
      reduction in hypothalamic dopaminergic neuron number.
    supporting_text: >-
      The too few mutation leads to a specific reduction in the number of hypothalamic
      DA neurons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Original screen paper; gene identity established only in PMID:12469125.
      Abstract-only in the cache.
- id: PMID:12469125
  title: Zinc finger protein too few controls the development of monoaminergic neurons.
  findings:
  - statement: >-
      tof encodes the forebrain-specific zinc-finger repressor fezl; mutants lack
      hypothalamic DA and 5HT neurons, which fezl controls non-cell-autonomously; the
      eh1 repressor motif and second zinc finger are required for function.
    supporting_text: >-
      Mosaic and co-staining analyses showed that fezl was not expressed in DA or 5HT
      neurons and instead controlled development of these neurons
      non-cell-autonomously. Both the eh1-related repressor motif and the second zinc
      finger domain were necessary for tof function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cloning paper for tof/fezl. Abstract-only in the cache; repression assay
      details not inspected.
- id: PMID:15219677
  title: The too few mutant selectively affects subgroups of monoaminergic neurons
    in the zebrafish forebrain.
  findings:
  - statement: >-
      Selected forebrain DA and 5HT neuron subgroups are reduced in too few from the
      larval stage; the missing neurons are not restored in adults.
    supporting_text: >-
      Rather than affecting all monoaminergic neurons in the forebrain, selective
      subgroups of these neurons are reduced in the too few mutant, starting from the
      larval stage.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in the cache.
- id: PMID:17164418
  title: Patterning the zebrafish diencephalon by the conserved zinc-finger protein
    Fezl.
  findings:
  - statement: >-
      Fezl is required for prethalamus formation and restricts the ZLI; overexpression
      expands anterior forebrain regions and downregulates wnt expression, and can
      rescue anterior forebrain in Tcf7l1a-deficient embryos.
    supporting_text: >-
      Such altered brain regionalization is preceded by the early downregulation of wnt
      expression in the prospective diencephalon. Finally, fezl overexpression is able
      to restore the anterior forebrain and downregulate wnt expression in
      Headless- and/or Tcf3 (also known as Tcf7l1a)-deficient embryos.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache.
- id: PMID:18003738
  title: Specification of hypothalamic neurons by dual regulation of the homeodomain
    protein Orthopedia.
  findings:
  - statement: >-
      Fezl acts upstream of Otp and regulates it at the transcriptional level in
      hypothalamic DA and oxytocinergic neuron specification.
    supporting_text: >-
      In vivo and in vitro experiments demonstrated that Fezl and PAC1 regulate Otp at
      the transcriptional and the post-transcriptional levels, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache.
- id: PMID:18799544
  title: Dopaminergic neuronal cluster size is determined during early forebrain patterning.
  findings:
  - statement: >-
      fezl is epistatic to canonical Wnt signalling in setting diencephalic DA neuron
      number; Fezl activity during gastrulation is crucial for DA cell number.
    supporting_text: >-
      Thus, the activity of Fezl during early neural specification (gastrulation) is
      crucial in regulating DA cell number.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read.
- id: PMID:21471212
  title: Genomic selection identifies vertebrate transcription factor Fezf2 binding
    sites and target genes.
  findings:
  - statement: >-
      Genomic SELEX with the Fezf2 zinc-finger domain defines a core binding motif;
      Fezf2 transactivates reporters through these elements in cells and embryos,
      occupies sites near eomesa/tbr2 and lhx2b by ChIP, and is necessary and
      sufficient for forebrain lhx2b expression.
    supporting_text: >-
      Through loss of function, gain of function, and chromatin immunoprecipitation, we
      further identified and validated eomesa/tbr2 and lhx2b as biologically relevant
      target genes of Fezf2.
  - statement: >-
      tof mutants and fezf2 morphants show a transient failure of the anterior and
      post-optic commissures to cross the midline at 36 hpf.
    supporting_text: >-
      However, this defect did recover later
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. The only paper with direct biochemical evidence for
      the molecular function.
- id: PMID:23533176
  title: Specification of posterior hypothalamic neurons requires coordinated activities
    of Fezf2, Otp, Sim1a and Foxb1.2.
  findings:
  - statement: >-
      Fezf2, Otp, Sim1a and Foxb1.2 define mammillary-area subdomains and are jointly
      required for Vip and Uts1 neuron specification; Fezf2 is needed for early
      posterior hypothalamus development.
    supporting_text: >-
      In addition, Fezf2 is important for early development of the posterior
      hypothalamus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache.
- id: PMID:25319688
  title: Heterogeneously expressed fezf2 patterns gradient Notch activity in balancing
    the quiescence, proliferation, and differentiation of adult neural stem cells.
  findings:
  - statement: >-
      fezf2 is required to maintain quiescence of adult dorsal telencephalic neural
      stem cells and patterns a fezf2-dependent Notch activity gradient among them.
    supporting_text: >-
      Constitutive or conditional impairment of fezf2 activity demonstrates its
      requirement for maintaining quiescence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache (PMC full text not retrievable by the fetcher).
