  review:
    summary: >-
      Phylogenetic inference of RNA polymerase II-specific DNA-binding transcription
      factor activity. This is the core molecular function of fezf2. It is supported on
      the zebrafish protein by reporter transactivation through its own response
      elements in HEK293 cells and in embryos, and by regulation of lhx2b in loss- and
      gain-of-function (PMID:21471212); the eh1-related repressor motif and second zinc
      finger are both required for tof/fezl function in vivo (PMID:12469125).
    action: ACCEPT
    reason: >-
      Sequence-specific DNA binding plus regulation of target-gene transcription is
      demonstrated directly in zebrafish (PMID:21471212), so the IBA is confirmed rather
      than merely inferred. Whether the dominant mode is activation (PMID:21471212) or
      repression (PMID:12469125; UniProt FUNCTION) is context dependent and does not
      affect the parent activity term.
    additional_reference_ids:
    - PMID:21471212
    - PMID:12469125
    supported_by:
    - reference_id: PMID:21471212
      supporting_text: >-
        Our in-depth analyses of two selected genomic fragments reveal that Fezf2
        directly activates evolutionarily conserved genes eomesa/tbr2 and lhx2b .
    - reference_id: PMID:12469125
      supporting_text: >-
        Both the eh1-related repressor motif and the second zinc finger domain were
        necessary for tof function.
