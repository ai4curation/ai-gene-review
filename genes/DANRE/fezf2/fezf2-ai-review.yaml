    - id: GO:0071542
      label: dopaminergic neuron differentiation
    supported_by:
    - reference_id: PMID:15219677
      supporting_text: >-
        Rather than affecting all monoaminergic neurons in the forebrain, selective
        subgroups of these neurons are reduced in the too few mutant, starting from the
