      Maintenance of the quiescent adult neural stem cell pool is the direct claim of
      the paper, supported by loss of function, conditional loss of function and
      chimera analysis. A genuine post-embryonic function of fezf2, mechanistically
      linked to the Notch row above.
    supported_by:
