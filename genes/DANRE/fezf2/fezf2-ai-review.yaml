        requirement for maintaining quiescence.
- term:
    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:21471212
  review:
    summary: >-
      Proposed new annotation. Chen et al. (PMID:21471212; full text cached) show that
      zebrafish Fezf2 transactivates a luciferase reporter through its SELEX-derived
      response elements in HEK293 cells, that the wild-type element drives forebrain
      GFP expression in embryos in a fezf2-morpholino-sensitive manner, that endogenous
      Fezf2 occupies genomic regions upstream of eomesa/tbr2 and lhx2b by ChIP, and that
      lhx2b expression is reduced in tof/morphants and induced by fezf2 overexpression.
    action: NEW
    reason: >-
      The existing transcription rows are the sign-neutral IBA (GO:0006357) and a
      repression IMP (GO:0045892); the demonstrated activator function has no
      annotation. The participation test is met trivially (a transcription factor
      binding a cis-regulatory element and increasing transcription is the entity doing
      the work), and the paper's own conclusion is that Fezf2 is a transcription
      activator. IDA from the reporter and ChIP experiments; IMP would also be
      defensible from the lhx2b loss- and gain-of-function data.
    supported_by:
    - reference_id: PMID:21471212
      supporting_text: >-
        These results demonstrate the feasibility of employing genomic SELEX to identify
        vertebrate transcription factor binding sites and target genes and reveal Fezf2
        as a transcription activator and a candidate for evaluation in human
        microcephaly.
    - reference_id: PMID:21471212
      supporting_text: >-
        In the tof mutant and fezf2 morphant, lhx2b expression was selectively reduced
        in the forebrain but not in the mid-hindbrain regions
