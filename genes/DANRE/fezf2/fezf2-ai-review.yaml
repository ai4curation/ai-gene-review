  description: >-
    In the adult dorsal telencephalon, heterogeneous fezf2 levels among neighbouring
    neural stem cells pattern a gradient of Notch activity; high fezf2 maintains
    quiescence and low fezf2 permits activation and differentiation (PMID:25319688).
  supported_by:
