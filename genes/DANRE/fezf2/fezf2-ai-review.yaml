    supporting_text: >-
      Our results support a model in which fezf2 heterogeneity patterns gradient Notch
      activity among neighbors that is critical to balance NSC fate.
suggested_questions:
- question: >-
    Is fezf2 primarily a repressor (eh1 motif, PMID:12469125; UniProt FUNCTION) or an
    activator (eomesa, lhx2b; PMID:21471212), and does the mode depend on cofactor
    context or target site?
- question: >-
    What are the direct zebrafish targets through which fezf2 represses wnt expression
    in the prospective diencephalon (PMID:17164418) and regulates Notch activity in
    adult neural stem cells (PMID:25319688)? Mouse Fezf2 represses Hes5 directly; is
    the same true in zebrafish?
- question: >-
    The commissural axon guidance phenotype (PMID:21471212) is transient and attributed
    to reduced lhx2b. Is the defect mediated entirely through lhx2b, or do other direct
    Fezf2 targets participate in forebrain midline guidance?
suggested_experiments:
- description: >-
    ChIP-seq or CUT&RUN for Fezf2 in 24-36 hpf forebrain and in adult telencephalic
    neural stem cells to define direct targets, in particular wnt genes, her/hes
    Notch effectors, and otp, and to resolve activator versus repressor site usage.
- description: >-
    Domain-swap and eh1-motif point mutants assayed on the SELEX response elements
    (PMID:21471212) to test whether the eh1 motif converts Fezf2 from activator to
    repressor in a target-dependent manner.
