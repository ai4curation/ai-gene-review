- term:
    id: GO:0008593
    label: regulation of Notch signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:25319688
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-150707-6
  review:
    summary: >-
      IMP from constitutive and conditional fezf2 loss of function in adult dorsal
      telencephalic neural stem cells. Single-cell profiling combined with genetics
      uncovered a fezf2-dependent gradient of Notch activity, high in quiescent and low
      in proliferative stem cells (PMID:25319688). Abstract-only in the cache.
    action: ACCEPT
    reason: >-
      The paper's central claim is that fezf2 patterns Notch activity among neighbouring
      stem cells, which is a regulatory relationship to the pathway rather than a
      downstream phenotype. Mouse Fezf2 directly represses Hes5, a Notch effector
      (noted in PMID:21471212), so a transcription-factor-level mechanism is plausible,
      though the zebrafish target has not been identified. Kept as a genuine but
      context-specific (adult neural stem cell) function.
    supported_by:
    - reference_id: PMID:25319688
      supporting_text: >-
        Single NSC profiling coupled with genetic analysis further uncovers a
        fezf2-dependent gradient Notch activity that is high in quiescent and low in
        proliferative NSCs.
