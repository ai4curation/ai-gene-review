  review:
    summary: >-
      IMP from constitutive and conditional fezf2 impairment in adult zebrafish dorsal
      telencephalic neural stem cells. fezf2-GFP-high cells are quiescent and
      fezf2-GFP-low cells proliferative; fezf2 is required to maintain quiescence, and
