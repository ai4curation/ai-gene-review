      diencephalic DA neurons.
    action: ACCEPT
    reason: >-
      Well supported by genetic epistasis with full text available. The term is at an
      appropriate level: fezf2 controls forebrain neuron number and subtype
      non-cell-autonomously (PMID:12469125), so a term at the forebrain-neuron level is
      more defensible than a cell-intrinsic DA-differentiation term, although
      GO:0071542 would also be supportable for the DA subgroups.
    supported_by:
    - reference_id: PMID:18799544
      supporting_text: >-
        We show that an early canonical Wnt signal, acting through the transcription
        factor Fezl, modulates the number of DA neurons, thereby demonstrating for the
        first time that early neural patterning cues selectively control the size of
        the DA neuronal population in the vertebrate diencephalon.
