  review:
    summary: >-
      IMP from the too few (tof) mutant. Rink and Guo (PMID:15219677) mapped forebrain
      dopaminergic and serotonergic neuron subgroups in larval and adult zebrafish and
      showed that selected subgroups are reduced in tof from the larval stage onward.
      The phenotype is real but the term is far broader than the evidence.
    action: MODIFY
    reason: >-
      "Nervous system development" is the top-level term and conveys nothing specific
      about what fezf2 does. The cited paper is specifically about differentiation of
      forebrain monoaminergic neuron subtypes, and the sibling annotation from
      PMID:18799544 already uses the more informative GO:0021879 (forebrain neuron
