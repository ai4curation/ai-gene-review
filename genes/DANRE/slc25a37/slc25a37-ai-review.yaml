    label: erythrocyte development
  evidence_type: IMP
  original_reference_id: PMID:25957689
  review:
    summary: >-
      ZFIN IMP from the frascati mutant used in Kardon et al. (Cell 2015, full text cached),
      where frascati embryos serve as the specificity control for 5-aminolevulinic acid
      rescue: ALA rescues the sauternes (alas2) anemia but not the frascati anemia, because
      the mitoferrin-1 block lies downstream of ALA synthesis at the iron-supply step of
      heme biosynthesis. The paper confirms that loss of slc25a37 arrests erythrocyte
      development but does not add mechanistic information beyond Shaw et al. 2006.
    action: KEEP_AS_NON_CORE
    reason: >-
      The annotation is genuine (mutant phenotype, acts_upstream_of_or_within), but
      erythrocyte development is the downstream program that fails when heme cannot be
      made; the work mitoferrin-1 does is to import iron into mitochondria. Participation
      test: the gene product performs one step (iron delivery) on which hemoglobinization
      depends, it does not execute the developmental program, so the term describes
      context rather than the core function. Retained as non-core, consistent with the
      erythrocyte maturation and embryonic hemopoiesis rows.
    supported_by:
    - reference_id: PMID:25957689
      supporting_text: ALA supplementation specifically rescued anemia in ALAS2 mutant (sauternes, (Brownlie et al., 1998)) embryos, but not anemia in mitochondrial iron transporter mutants (frascati, (Shaw et al., 2006))
    - reference_id: PMID:16511496
      supporting_text: Here we describe a zebrafish mutant, frascati (frs), that shows profound hypochromic anaemia and erythroid maturation arrest owing to defects in mitochondrial iron uptake.
