suggested_questions:
- question: >-
    Has Fe2+ (as opposed to Fe3+) transport been measured directly for the zebrafish
    protein, or does the ferrous assignment rest on the mouse/yeast orthologs and the
    ferrochelatase requirement?
- question: >-
    Does zebrafish Mfrn1 require stabilization by an Abcb10 ortholog in erythroid
    mitochondria, as shown for the mouse protein?
suggested_experiments:
- description: >-
