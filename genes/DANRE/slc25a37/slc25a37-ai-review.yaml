- term:
    id: GO:0048250
    label: iron import into the mitochondrion
  evidence_type: IMP
  original_reference_id: PMID:16511496
  review:
    summary: >-
      ZFIN IMP from Shaw et al. 2006: the frascati phenotype is attributed to defects in
      mitochondrial iron uptake, mouse Mfrn rescues the fish mutant, zebrafish mfrn rescues
      the yeast mrs3/mrs4 iron-import mutant, and the authors conclude that mfrn is the
      principal mitochondrial iron importer of vertebrate erythroblasts. This is the
      process the transporter directly carries out.
    action: ACCEPT
    reason: >-
      Iron import into the mitochondrion (cytosol to matrix) is precisely what a
      mitochondrial inner-membrane Fe2+ carrier does; the gene product performs the step
      itself, so the participation test is met by catalysis of transport, not merely by
      necessity. Core process, matching the IBA row and the core_functions entry.
