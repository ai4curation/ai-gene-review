    review_notes: >-
      Cached title matches (Kardon et al., Cell 2015); full text available. The paper is
      about mitochondrial ClpX and ALA synthase; frascati embryos appear only as a control
      showing that ALA supplementation does not rescue a downstream iron-transport block.
      It supports the erythrocyte development IMP as a phenotype record but adds no
