  review:
    summary: >-
      ZFIN IMP from Wang et al. 2011 (full text cached), which used the frascati (frs
      tq223) embryo as an in vivo assay for human MFRN1 cDNAs: normal human MFRN1 cRNA
      restored hemoglobinized cells in 80% of frs embryos (n=210), the intron-retaining
