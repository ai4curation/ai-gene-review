- id: PMID:16511496
  title: Mitoferrin is essential for erythroid iron assimilation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached title matches (Shaw et al., Nature 2006); abstract only (full_text_available:
      false). This is the primary paper: positional cloning of frascati, identification of
      mfrn/slc25a37, defective mitochondrial iron uptake, cross-species rescue and yeast
      complementation. Supports the transporter, mitochondrial import and erythroid
      maturation rows directly. Methods for the mitochondrion IDA and Fe2+ specificity are
      in the uncached full text.
  findings:
  - statement: The frascati mutant has profound hypochromic anemia and erythroid maturation arrest caused by defective mitochondrial iron uptake.
    supporting_text: Here we describe a zebrafish mutant, frascati (frs), that shows profound hypochromic anaemia and erythroid maturation arrest owing to defects in mitochondrial iron uptake.
  - statement: The frascati gene is an SLC25 mitochondrial carrier named mitoferrin.
    supporting_text: Through positional cloning, we show that the gene mutated in the frs mutant is a member of the vertebrate mitochondrial solute carrier family (SLC25) that we call mitoferrin (mfrn).
  - statement: Mitoferrin function is conserved; mouse Mfrn rescues frs and zebrafish mfrn complements the yeast mrs3/mrs4 mutant.
    supporting_text: Murine Mfrn rescues the defects in frs zebrafish, and zebrafish mfrn complements the yeast mutant, indicating that the function of the gene may be highly conserved.
  - statement: Mitoferrin is the principal mitochondrial iron importer for heme synthesis in vertebrate erythroblasts.
    supporting_text: Our data show that mfrn functions as the principal mitochondrial iron importer essential for haem biosynthesis in vertebrate erythroblasts.
- id: PMID:21627978
  title: Abnormal mitoferrin-1 expression in patients with erythropoietic protoporphyria.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached title matches (Wang et al., Exp Hematol 2011); full text available. A human
      EPP study that uses the zebrafish frascati (frs tq223) embryo as a complementation
      assay: normal human MFRN1 cRNA rescues frs anemia (80%, n=210), the patient transcript
      does not (0%, n=135). Supports the embryonic hemopoiesis IMP and functional
      conservation; not a study of zebrafish biology per se.
  findings:
  - statement: Normal human MFRN1 cRNA complements the anemia of frascati embryos.
    supporting_text: By microinjection of cRNA into fertilized eggs from a MFRN - deficient zebrafish strain, frascati (frs), normal human MFRN1 cDNA was able to fully complement the anemia in mutant embryos
  - statement: The intron-retaining patient MFRN1 transcript is loss-of-function in the frs assay.
    supporting_text: the abnormal MFRN1 cDNA failed to complement anemia in frs mutants (0%, n=135), which indicates that abnormal MFRN1 cDNA has loss-of-function activity
  - statement: MFRN1 is the mitochondrial transporter of iron used by ferrochelatase and for Fe-S cluster synthesis.
    supporting_text: mitoferrin-1 (MFRN1), the mitochondrial transporter of Fe used for heme formation by FECH and for 2Fe2S cluster synthesis, which is critical to FECH activity/stability
