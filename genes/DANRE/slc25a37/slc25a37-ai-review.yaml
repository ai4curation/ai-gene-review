  review:
    summary: >-
      Mapped from the UniProt subcellular-location keyword. UniProt places mitoferrin-1 in
      the mitochondrial inner membrane as a multi-pass membrane protein; this is the
      location of every SLC25 carrier (three tandem repeats, six transmembrane helices in
      the feature table) and is where the frascati study places the transporter that
