gene_symbol: slc25a37
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  slc25a37 encodes mitoferrin-1 (Mfrn1; the frascati gene), a six-transmembrane
  SLC25/mitochondrial carrier-family transporter of the mitochondrial inner membrane that
  moves ferrous iron (Fe2+) from the cytosol into the mitochondrial matrix. In developing
  erythroid cells it is the principal route of mitochondrial iron entry and therefore
  supplies the iron that ferrochelatase inserts into protoporphyrin IX during heme
  synthesis, as well as the iron used for mitochondrial Fe-S cluster assembly. The gene is
  highly expressed in the intermediate cell mass and other hematopoietic tissues under
  gata1 control. Loss of function in the zebrafish frascati mutant produces profound
  hypochromic anemia with erythroid maturation arrest and a progressive loss of
  circulating blood cells, a phenotype rescued by mouse or human mitoferrin-1 cDNA; the
  zebrafish protein in turn complements the yeast mrs3/mrs4 mitochondrial iron-import
  mutant, showing that the transport function is conserved from fungi to vertebrates.
existing_annotations:
- term:
    id: GO:0015093
    label: ferrous iron transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      Fe2+ transmembrane transport is the core activity of mitoferrin-1. The PAINT
      assertion sits on the eukaryote-wide mitoferrin/Mrs3-Mrs4 node PTN000641807, seeded by
      mouse Mfrn1/Mfrn2 and yeast MRS3/MRS4. For the zebrafish protein itself, the frascati
      mutant shows defective mitochondrial iron uptake and the zebrafish cDNA complements
      the yeast mrs3/mrs4 mutant, so the activity is demonstrated on the target as well as
      inherited [PMID:16511496]. UniProt curates the Rhea reaction Fe(2+)(in) = Fe(2+)(out)
      from the same paper.
    action: ACCEPT
    reason: >-
      The node placement is sound: every extant member used to seed it (mouse Mfrn1, Mfrn2,
      yeast Mrs3, Mrs4) is a mitochondrial inner-membrane iron importer, and the target is
      unambiguously inside the clade (it is the ortholog named mitoferrin-1). The ferrous
      specificity, which is what distinguishes this term from the parent GO:0005381, is
      supported by the curated catalytic-activity line and by the biology (ferrochelatase
      uses Fe2+). This is the core molecular function of the gene product.
    supported_by:
