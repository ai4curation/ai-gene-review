taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: gad1a (glutamate decarboxylase 1a) is one of two zebrafish co-orthologs of vertebrate GAD1 (GAD67),
  retained from the teleost-specific genome duplication; its paralog is gad1b. It encodes a pyridoxal
  5'-phosphate-dependent group II decarboxylase that, by homology, converts L-glutamate to the inhibitory
  neurotransmitter GABA in the cytoplasm. The protein is 86% identical to Gad1b and keeps the PLP-binding lysine,
  the GABA-binding residues and the C-terminus of human GAD1; its N-terminal region is the least conserved part.
  gad1a is expressed at a much lower level than gad1b in embryos and larvae, with RNA-seq signal in brain, liver
  and early embryos, and it is absent from lateral-line efferent neurons that express gad1b. No enzyme assay,
  antibody, mutant or morphant exists for gad1a, and some published in situ data labelled gad1a may come from a
  gad1b-derived probe.
