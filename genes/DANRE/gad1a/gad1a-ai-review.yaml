core_functions:
- description: Pyridoxal 5'-phosphate-dependent glutamate decarboxylase (GAD67-type) that, by homology, synthesizes
    GABA from L-glutamate in the cytoplasm. Catalytic residues are shared with gad1b; gad1a is the minor, low-expressed
    copy and has not been assayed or mutated.
