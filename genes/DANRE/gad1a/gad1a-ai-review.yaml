suggested_questions:
- question: Is gad1a translated into an active enzyme in any tissue, and where does the protein sit in neurons?
- question: Which published zebrafish "gad1a" in situ probes are really gad1a? The probe described as the Martin et
    al. gad67a plasmid needs to be sequenced, because the sequenced Martin GAD67 cDNA is gad1b.
- question: Are the liver and early-embryo RNA-seq signals of gad1a real (maternal transcript, hepatic GABA
    synthesis), and does gar GAD1 show the same?
suggested_experiments:
- hypothesis: gad1a retains glutamate decarboxylase activity comparable to gad1b.
  description: Express recombinant Gad1a and Gad1b and measure GABA formation from glutamate with PLP.
  experiment_type: biochemical assay
- hypothesis: gad1a contributes a minor, partly redundant share of GABA synthesis that is revealed only without
    gad1b.
  description: Generate a gad1a null (ideally a promoter or whole-gene deletion to avoid transcriptional adaptation)
    and a gad1a;gad1b double mutant; measure brain GABA, seizure-like activity and craniofacial development.
  experiment_type: genetic interaction
- hypothesis: gad1a and gad1b have partly different cellular expression domains.
  description: Paralog-specific HCR in situ with probes verified by sequence, plus single-cell RNA-seq mining, at
    embryonic, larval and adult stages.
  experiment_type: expression analysis
