  review:
    summary: Glutamate decarboxylase activity propagated from the GAD node PTN002903772, seeded by fly Gad1, rodent
      Gad1/Gad2 and human GAD1.
    action: ACCEPT
    reason: Glutamate decarboxylation is the ancestral activity of the vertebrate GAD1/GAD2 clade, and gad1a sits
      inside it as a GAD1 co-ortholog. Gad1a has not been assayed, but it keeps every catalytic feature checked
      (PLP-binding lysine at the position of human K405, GABA-binding residues, catalytic-loop sequence) and is 86%
      identical to Gad1b and 80% to human GAD1, with no sign of accelerated evolution relative to gad1b. Nothing
      suggests loss of activity.
    supported_by:
