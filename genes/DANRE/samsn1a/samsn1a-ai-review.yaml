taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: samsn1a (SAM domain, SH3 domain and nuclear localization signals 1a) is one of two zebrafish
  co-orthologs of vertebrate SAMSN1 (HACS1, SLy2, NASH1); its paralog is samsn1b. It encodes an intracellular
  adaptor of the SLy/SASH1 family with an N-terminal disordered region, a central SH3 domain and a C-terminal
  SAM domain. In mammals SAMSN1 is expressed mainly in hematopoietic cells, is found in cytoplasm and
  nucleus, is induced by B-cell activation signals, binds tyrosine-phosphorylated proteins and, through its
  SH3 domain, the inhibitory receptor PIRB, and acts as an inhibitory adaptor that dampens B-cell activation
  (mouse knockout B cells are hyper-responsive). The zebrafish protein keeps a highly conserved SH3 domain
  but is much longer than human SAMSN1 and only 38% identical to samsn1b overall. samsn1a is zygotically
  expressed; in situ hybridization detects it in blood and macrophages of the early embryo, bulk RNA-seq
  places it highest in granulocytes, spleen and head kidney, and single-cell studies use it as a marker of
  retinal bipolar cells. No functional study of the zebrafish gene has been published.
existing_annotations:
- term:
    id: GO:0050869
    label: negative regulation of B cell activation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1914992
  - PANTHER:PTN002642349
  review:
    summary: Negative regulation of B cell activation, propagated from the SAMSN1 node PTN002642349, whose
      experimental seed is the mouse Hacs1 (Samsn1) knockout.
    action: ACCEPT
    reason: The IBA places the function at a node that contains both zebrafish SAMSN1 co-orthologs. The seed
      evidence is sound (Hacs1-/- B cells hyper-proliferate on BCR stimulation and show increased tyrosine
      phosphorylation), and the SH3 domain that mediates the PIRB interaction is 82% identical between
      samsn1a and human SAMSN1. samsn1a is expressed in blood, macrophages, granulocytes, spleen and head
      kidney, so there is no expression-based argument that it sits outside immune cells. The function has
      not been tested in zebrafish; the annotation is accepted as a phylogenetic inference, and the same call
      is made for samsn1b.
    supported_by:
    - reference_id: PMID:19923443
      supporting_text: Purified splenic B cells from Hacs1(-/-) mice showed increased cell proliferation on BCR
        (B-cell receptor) stimulation.
    - reference_id: PMID:19923443
      supporting_text: This study suggests that Hacs1 is an immunoinhibitory adaptor that might be a useful
        target for immune suppression therapy.
    - reference_id: file:DANRE/samsn1a/samsn1a-bioinformatics/RESULTS.md
      supporting_text: The SH3 domain is the best-conserved part of both copies
