  review:
    summary: Regulation of intracellular signal transduction, propagated from the SLy/SASH1 family node
      PTN000266438 (seeded by human SASH1).
    action: ACCEPT
    reason: A broad but appropriate process for an SH3-SAM adaptor of the SLy/SASH1 family. The mammalian
      family members act as intracellular signalling adaptors, and SAMSN1 itself associates with
      tyrosine-phosphorylated proteins after B-cell receptor stimulation. samsn1a keeps the SH3 and SAM
      domains that define the family. The term is general, but no more specific process is established
      across the family.
    supported_by:
    - reference_id: PMID:33710696
      supporting_text: Intracellular adaptor proteins are indispensable for the transduction of receptor-derived
        signals, as they recruit and connect essential downstream effectors.
    - reference_id: PMID:15381729
      supporting_text: HACS1 associates with tyrosine-phosphorylated proteins after B cell activation and binds
        in vitro to the inhibitory molecule paired Ig-like receptor B.
core_functions:
- description: SH3-SAM intracellular signalling adaptor of the SLy/SASH1 family, expressed in myeloid cells,
    hematopoietic organs and retinal bipolar cells; by homology with mammalian SAMSN1 an inhibitory adaptor in
    immune-receptor signalling. No activity has been measured for the zebrafish protein, so no molecular
    function term is asserted.
