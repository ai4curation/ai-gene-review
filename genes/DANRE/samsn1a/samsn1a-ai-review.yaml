suggested_questions:
- question: Which zebrafish blood cell types express samsn1a and samsn1b (macrophages, neutrophils, B cells,
    dendritic-like cells), and do the two copies overlap in any of them?
- question: Is the retinal expression split between the copies (samsn1a in bipolar cells, samsn1b in
    photoreceptors and pineal) a zebrafish-specific partition, and is gar SAMSN1 expressed in retina?
- question: Does the long N-terminal region shared by the fish and gar proteins but absent from human SAMSN1
    carry functional motifs (for example 14-3-3 or phosphotyrosine docking sites)?
suggested_experiments:
- hypothesis: samsn1a restrains activation of zebrafish B cells or myeloid cells, as Hacs1 does in mouse.
  description: Generate samsn1a mutants (ideally promoter-less or RNA-less alleles to avoid transcriptional
    adaptation) alone and with samsn1b; measure adult B-cell responses to immunization and larval
    macrophage and neutrophil responses to infection or wounding.
  experiment_type: genetic interaction
- hypothesis: samsn1a and samsn1b have complementary cell-type expression.
  description: Double fluorescent in situ (HCR) or reanalysis of zebrafish single-cell atlases for the two
    copies in blood, kidney marrow, retina and pineal, with gar SAMSN1 as an outgroup.
  experiment_type: expression analysis
