- term:
    id: GO:0007605
    label: sensory perception of sound
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0262624
  - MGI:MGI:1915382
  - PANTHER:PTN000968268
  review:
    summary: Sensory perception of sound, from the PANTHER LHFPL5 node.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The IBA node is sound for the family and the Lhfpl5b protein can probably do the job, but this copy
      is not expressed in the ear: larval in situ hybridization finds it only in neuromasts, lhfpl5b mutants have
      normal inner-ear microphonics and hearing, and adult inner-ear hair cells express lhfpl5a but not lhfpl5b.
      The lateral line detects water motion, not sound. The division of labour arose by expression partition after
      the duplication, which a same-node IBA cannot see. Whether adult lhfpl5b contributes to hearing has not been
      tested directly, so the row is marked rather than removed.'
    supported_by:
    - &id003
      reference_id: PMID:32009898
      supporting_text: 'Here we show that the zebrafish lhfpl5 genes are expressed in discrete populations of hair
        cells: lhfpl5a expression is restricted to auditory and vestibular hair cells in the inner ear, while lhfpl5b
        expression is specific to hair cells of the lateral line organ.'
    - reference_id: PMID:32009898
      supporting_text: Thus, lhfpl5atm290d mutants exhibit defects in inner ear function, while the lhfpl5bvo35
        mutation has no effect on these hair cells.
    - reference_id: PMID:39484049
      supporting_text: Zebrafish HCs expressed ush1c, tmie, pcdh15a/b, and lhfpl5a, but not the paralog lhfpl5b,
        while mouse HCs expressed the orthologs Ush1c, Tmie, Pcdh15, and Lhfpl5, respectively.
    - reference_id: PMID:32009898
      supporting_text: Future studies on adults will determine whether the lateral line remains non-functional and
        whether lhfpl5b contributes to inner ear function in the mature auditory and vestibular systems.
    propagation_review:
