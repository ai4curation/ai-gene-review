  label: Danio rerio
description: lhfpl5b (LHFPL tetraspan subfamily member 5b) is one of two zebrafish co-orthologs of vertebrate LHFPL5
  (TMHS), retained from the teleost-specific genome duplication; its paralog is lhfpl5a. It encodes a small four-pass
  membrane protein of the tetraspan junctional protein superfamily, an accessory subunit of the hair-cell mechanoelectrical
  transduction (MET) complex. lhfpl5b is expressed only in hair cells of the lateral-line neuromasts, from about
  2 dpf, and not in the inner ear. lhfpl5b loss-of-function mutants (vo35, a frameshift that removes three of the
  four transmembrane helices) lose transduction in almost all lateral-line hair cells and have fewer neuromast hair
  cells, while hearing and balance are normal; the mutants are adult viable. Expression of Lhfpl5a in lhfpl5b mutant
  hair cells restores lateral-line transduction. Tmc2b still reaches the hair bundle without Lhfpl5b. Because they
  lack only lateral-line function, lhfpl5b mutants have been used to show lateral-line roles in swim-bladder inflation
  and in social regulation of pth2 expression.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: Root-term ND placeholder recording that no molecular function had been curated for lhfpl5b.
    action: REMOVE
    reason: Superseded. lhfpl5b is required for transduction in lateral-line hair cells and its loss is rescued
      by Lhfpl5a, so it shares the accessory-subunit function of LHFPL5 in the MET channel complex (in mouse, LHFPL5
      transmits tip-link tension to the channel). That function is recorded in core_functions as a contribution
      to the complex's mechanosensitive cation channel activity.
    supported_by:
    - &id001
      reference_id: PMID:32009898
      supporting_text: Strikingly, lateral line hair cells in lhfpl5bvo35 mutants do not label with FM 1–43 while
        there is no difference in the intensity of FM 1–43 labeling of hair cells between WT and lhfpl5atm290d mutants
    - &id002
      reference_id: PMID:32009898
      supporting_text: The loss of MET channel activity in lhfpl5bvo35 neuromasts is rescued by expression of the
        GFP-lhfpl5a vo23Tg transgene (Figures 4I,J; n = 7/7 mutant individuals). This result indicates that Lhfpl5a
        and Lhfpl5b are functionally interchangeable in this context.
    - &id004
      reference_id: PMID:38194445
      supporting_text: We conclude that tip-link tension is transmitted to the channel primarily via LHFPL5; residual
        activation without LHFPL5 may occur by direct interaction between PCDH15 and TMC1.
