suggested_questions:
- question: Does GFP-Lhfpl5b localize to stereocilia tips of neuromast hair cells and depend on Pcdh15a, as Lhfpl5a
    does in the ear?
- question: Does lhfpl5b contribute to inner-ear function in adults, or does the adult lateral line remain silent
    in lhfpl5b mutants?
- question: Which protein supports the residual FM labeling in a few neuromast hair cells (most reproducibly SO3)
    of lhfpl5a/lhfpl5b double mutants — another LHFPL family member?
suggested_experiments:
- hypothesis: Lhfpl5b can replace Lhfpl5a in the inner ear.
  description: Express GFP-Lhfpl5b from the myo6b or lhfpl5a promoter in lhfpl5a tm290d mutants and test acoustic
    startle, inner-ear microphonics and FM dye uptake (the reciprocal of the published Lhfpl5a rescue of lhfpl5b
    mutants).
  experiment_type: cross-rescue
- hypothesis: The lateral-line restriction of lhfpl5b is set by its proximal promoter.
  description: Map the elements in the 2 kb lhfpl5b upstream region (used by Venuto et al. 2023 to drive ChR2 in
    lateral-line hair cells) and compare with gar lhfpl5 upstream sequence in reporter assays.
  experiment_type: enhancer reporter assay
