core_functions:
- description: Accessory transmembrane subunit of the MET complex in lateral-line hair cells, required for their
    mechanotransduction; functionally interchangeable with Lhfpl5a, which it replaces in the lateral line because
    of expression, not protein, differences. Recorded as a contribution to the channel complex's activity.
  contributes_to_molecular_function:
