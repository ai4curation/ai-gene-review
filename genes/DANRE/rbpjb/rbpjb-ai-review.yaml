core_functions:
- description: Sequence-specific DNA-binding transcription factor of the CSL family that binds RBPJ 
    motifs in Notch target enhancers and, upon binding the Notch intracellular domain and 
    Mastermind, activates Notch target gene transcription (repressing targets in the absence of 
    NICD).
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0007221
    label: positive regulation of transcription of Notch receptor target
  - id: GO:0007219
    label: Notch signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0002193
    label: MAML1-RBP-Jkappa- ICN1 complex
  supported_by:
  - reference_id: PMID:21871448
    supporting_text: Wt1a, Foxc1a, and Rbpj can physically interact with each other, whereas only 
      Rbpj binds to the Notch intracellular domain (NICD)
suggested_questions:
- question: What are the respective contributions of rbpja and rbpjb (Su(H)1/Su(H)2) to Notch target
    activation in the PSM, neural tube and vasculature, given that rbpja currently lacks an active 
    UniProtKB entry?
- question: Does zebrafish Rbpjb recruit corepressors (e.g. SHARP/Mint homologs) to repress Notch 
    targets in the absence of NICD?
suggested_experiments:
- description: Paralog-specific CRISPR mutants of rbpja and rbpjb with a Tp1/12xCSL Notch reporter 
    to quantify each paralog's contribution to Notch target activation.
- description: ChIP-seq of tagged Rbpjb in somitogenesis-stage embryos to map direct targets (her1, 
    her7, dlc, cyp26a1).
