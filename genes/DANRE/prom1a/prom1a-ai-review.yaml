taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: prom1a (prominin 1a) is one of two zebrafish co-orthologs of vertebrate PROM1 (prominin-1, CD133),
  retained from the teleost-specific genome duplication; its paralog is prom1b. It encodes a pentaspan membrane
  glycoprotein with two large glycosylated extracellular loops. Prominins sit in cholesterol-rich plasma-membrane
  protrusions such as microvilli and primary cilia and in extracellular vesicles derived from them; mammalian PROM1
  is also required for photoreceptor outer-segment disc morphogenesis. prom1a is the more broadly expressed copy.
  It is maternally supplied, is expressed in embryonic proliferative zones of the central nervous system and sensory
  organs, in the lens and otic vesicle, in adult brain germinative zones of the forebrain and dorsal midbrain, on the
  vitreal side of the retinal inner nuclear layer and at low level in rods and cones, and in several adult organs
  including gill, intestine, kidney and gonads. A prom1a knockout was reported to leave photoreceptors intact, in
  contrast to prom1b mutants, so its specific functions remain unknown.
