core_functions:
- description: Pentaspan prominin glycoprotein of the apical plasma membrane and its protrusions (microvilli, primary
    cilia), the broadly expressed zebrafish PROM1 co-ortholog (maternal, forebrain and dorsal midbrain germinative
    zones, retinal inner nuclear layer, epithelial organs). Its molecular function is not established.
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0005929
    label: cilium
  supported_by:
  - *protrusion
  - reference_id: PMID:23723983
    supporting_text: Note that major sites of expression of prominin-1a are mainly located in the prosencephalic (rostral)
      and dorsal mesencephalic (tectal) domain (A), whereas prominin-1b is predominantly found in the rhombencephalic
      brainstem (caudal) domain (B).
suggested_questions:
- question: Does prom1a contribute to outer-segment morphogenesis when prom1b is absent (prom1a; prom1b double mutants),
    and is prom1a upregulated in prom1b mutants?
- question: What does prom1a do in the maternal embryo and in adult epithelial organs (intestine, kidney, gill) where
    prom1b is not detected?
- question: Do Prom1a splice variants reach the photoreceptor outer segment?
suggested_experiments:
- hypothesis: The photoreceptor split between the copies is due to expression level, not protein function.
  description: Express Prom1a from the prom1b promoter (or a photoreceptor promoter) in prom1b mutants and score outer-segment
    morphology and cone survival.
  experiment_type: cross-rescue
- hypothesis: prom1a and prom1b are partly redundant in photoreceptors.
  description: Compare prom1b single and prom1a; prom1b double mutants for outer-segment defects and rod survival, and
    measure prom1a mRNA in prom1b mutants.
  experiment_type: double mutant
