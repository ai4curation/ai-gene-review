description: exoc3l2b (exocyst complex component 3-like 2b) is one of two zebrafish co-orthologs of vertebrate
  EXOC3L2, retained from the teleost-specific genome duplication; its paralog is exoc3l2a, to which it is about 51%
  identical. It encodes a 917-aa member of the EXOC3/Sec6 family with an N-terminal region and a C-terminal Sec6
  helical-bundle domain. It is the slower-evolving copy, closer to the single gar gene. Mammalian EXOC3L2
  associates with the exocyst subunit EXOC4. It is needed for VEGFA-induced VEGFR2 phosphorylation and directional
  migration of endothelial cells, and for cardiovascular development in mouse; human biallelic mutations cause a
  hindbrain, kidney and bone-marrow syndrome. In zebrafish, a probe that ZFIN assigns to exoc3l2b ("sec6" in the
  original paper) detects expression in premigratory neural crest at 12 hpf and later in the dorsal hindbrain and
  pharyngeal arches. Public RNA-seq detects the gene in many adult tissues, including intestine, spleen, gill and
  kidney. No loss-of-function or biochemical study of exoc3l2b has been published.
