      supporting_text: Myc-tagged EXOC3L2 co-precipitates with the exocyst protein EXOC4, and immunofluorescence detection
        of EXOC3L2 shows partial subcellular colocalization with EXOC4 and EXOC7.
    - reference_id: file:DANRE/exoc3l2a/exoc3l2a-bioinformatics/RESULTS.md
      supporting_text: Both copies keep a full-length Sec6 domain and the N-terminal region; neither is truncated.
- term:
    id: GO:0006887
    label: exocytosis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010326
  review:
    summary: Exocytosis from the InterPro EXOC3/Sec6 mapping.
    action: KEEP_AS_NON_CORE
    reason: Plausible for an exocyst-associated protein, and the proposed model for EXOC3L2 is exocyst-dependent
      delivery of VEGFR2 to the cell surface. But no secretion or exocytosis assay has been done for EXOC3L2 in any
      species. The zebrafish "sec6" study that detected this gene in neural crest did not test its function in
      trafficking.
    supported_by:
    - reference_id: PMID:21566143
      supporting_text: We hypothesized that EXOC3L2 may be involved in the exocytosis of VEGFR2, and that a down-regulation
        of EXOC3L2 expression thus could have an effect on VEGFR2 phosphorylation.
core_functions:
- description: EXOC3/Sec6-family protein and EXOC3L2 co-ortholog. By analogy with mammalian EXOC3L2 it probably
    associates with the exocyst. In the embryo it is reported in premigratory neural crest, dorsal hindbrain and
    pharyngeal arches, and in adults in many tissues. No activity or process has been tested for this copy, and
    whether it is expressed in endothelium like exoc3l2a is unknown.
  in_complex:
    id: GO:0000145
    label: exocyst
  supported_by:
  - reference_id: PMID:21566143
    supporting_text: Myc-tagged EXOC3L2 co-precipitates with the exocyst protein EXOC4, and immunofluorescence detection
      of EXOC3L2 shows partial subcellular colocalization with EXOC4 and EXOC7.
  - reference_id: PMID:20463035
    supporting_text: At earlier stages, expression of all four genes was ubiquitous throughout the embryo but later became
      enriched in the NC at 12 hpf and in the dorsal hindbrain and pharyngeal arches at 24-72 hpf (data not shown).
  - reference_id: file:DANRE/exoc3l2a/exoc3l2a-bioinformatics/RESULTS.md
    supporting_text: At bulk-tissue level the adult profiles of the two copies overlap broadly and both resemble gar.
