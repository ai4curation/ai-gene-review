  review:
    summary: Exocyst from the InterPro EXOC3/Sec6 entry (IPR010326) mapping.
    action: ACCEPT
    reason: exoc3l2b keeps a complete Sec6 domain and is an EXOC3L2 co-ortholog. Mammalian EXOC3L2 co-precipitates
      with EXOC4 and colocalises with EXOC4 and EXOC7, which supports association with the exocyst. Whether it is a
      stoichiometric subunit or a separate partner has not been settled, so the term is kept at the complex level.
      The same call is made for exoc3l2a, which also carries this term as an IBA.
    supported_by:
