suggested_questions:
- question: Is the probe ZFIN assigns to exoc3l2b ("sec6" in PMID:20463035) specific for exoc3l2b, rather than for
    exoc3 or exoc3l2a? The neural-crest and pharyngeal-arch pattern should be confirmed with a gene-specific probe.
- question: Is exoc3l2b expressed in endothelium, as exoc3l2a and mouse Exoc3l2 are, or has the endothelial domain
    been lost from this copy?
suggested_experiments:
- description: Do HCR in situ hybridization for exoc3l2b alongside exoc3l2a, kdrl and sox10 at 12-72 hpf to map
    shared and copy-specific domains.
- description: Generate exoc3l2b single and exoc3l2a;exoc3l2b double mutants, including an RNA-less allele, and
    score neural-crest migration, craniofacial cartilage and vascular integrity.
