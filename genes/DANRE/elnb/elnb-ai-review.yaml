gene_symbol: elnb
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  elnb (elastin b, formerly eln2) is one of two zebrafish tropoelastin genes,
  co-orthologous with the single tetrapod ELN gene, that arose in the
  teleost-specific whole-genome duplication together with its paralog elna.
  It encodes a large (about 173 kDa, 59 exons), secreted, non-enzymatic
  tropoelastin that keeps the alternating hydrophobic and crosslinking domain
  arrangement of the elastin family but is highly divergent in sequence, with
  longer hydrophobic domains and lower overall hydrophobicity than Elna or
  tetrapod elastin. elnb is the earliest and predominant elastin of the
  bulbus arteriosus, the elastic, smooth-muscle-rich outflow chamber that is
  unique to teleosts; expression begins in the outflow tract at about 54 hpf
  to 3 dpf, and this bulbus-restricted pattern is conserved in medaka,
  stickleback and trout. The Elnb-rich matrix gives the bulbus arteriosus its
  uniquely low extracellular stiffness and its Windkessel elasticity. Loss of
  elnb, by morpholino or by germline nonsense mutation, causes bulbus
  arteriosus hypoplasia with less elastin, loss of the low-stiffness
  environment, and ectopic cardiomyocytes in place of smooth muscle; this
  phenotype is rescued by elnb but not by elna mRNA or by the single elastin
  gene of Polypterus.
