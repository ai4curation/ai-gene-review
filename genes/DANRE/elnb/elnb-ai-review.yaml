    summary: >-
      InterPro2GO mapping from the tropoelastin signature (IPR003979). Correct:
      Elnb is a tropoelastin whose product makes up the elastic matrix of the
      bulbus arteriosus, and loss of elnb removes the low extracellular
      stiffness of that organ. The term is accurate but general; the specific
      activity of elastin is GO:0030023 extracellular matrix constituent
      conferring elasticity.
    action: MODIFY
    reason: >-
      Under-specific rather than wrong. Although Elnb is very divergent in
      sequence (about 18% identity to human ELN), it keeps the elastin domain
      arrangement, and direct measurements show it confers the compliant,
      low-stiffness matrix of the bulbus arteriosus. The same refinement is
      proposed for elna, so the pair is consistent at the molecular-function
      level; the copies differ in where the activity is deployed, not in its
      kind.
