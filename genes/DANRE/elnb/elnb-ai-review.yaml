- term:
    id: GO:0048251
    label: elastic fiber assembly
  evidence_type: IMP
  original_reference_id: PMID:26783159
  review:
    summary: >-
      Proposed process. elnb morphants show decreased elastin accumulation in
      a hypoplastic bulbus arteriosus, and germline elnb nonsense mutants lack
      the low-stiffness elastic matrix that normally appears in the bulbus
      after elnb expression begins.
    action: NEW
    reason: >-
      Participation test: tropoelastin is the structural monomer that is
      assembled and crosslinked into the fiber core, so Elnb does part of the
      work of elastic fiber assembly (the structure case), not merely being
      required for it. Comparator check: mouse Eln carries the parent term
      GO:0085029 extracellular matrix assembly (IMP), and FBN1, FBLN5,
      EMILIN1 and MFAP4 carry GO:0048251. The same term is proposed for elna,
      whose loss depletes valve elastin.
    supported_by:
    - reference_id: PMID:26783159
      supporting_text: The elnb morphants exhibited severe hypoplasia of the BA and
        decreased elastin accumulation, while elna morphants exhibited no obvious
        defect in BA morphology
    - reference_id: PMID:41712646
      supporting_text: Notably, this developmental decrease in extracellular stiffness
        in the BA was not observed in elnb mutant, suggesting that elnb contributes
        to the mechanical properties of the BA extracellular environment.
- term:
    id: GO:0003232
    label: bulbus arteriosus development
  evidence_type: IMP
  original_reference_id: PMID:41712646
  review:
    summary: >-
      Proposed process. A germline elnb nonsense allele (truncation to 81
      residues) produces a hypoplastic bulbus arteriosus with ectopic
      cardiomyocytes, more severe than the morphant phenotype; the morphant
      phenotype is rescued by elnb mRNA but not by elna or Polypterus eln
      mRNA. Artificial stiffening of the bulbus matrix phenocopies loss of
      elnb.
    action: NEW
    reason: >-
      Participation test: Elnb is not a signal that acts on the bulbus from
      outside; it is the principal structural component of the organ's
      elastic matrix, and that matrix's low stiffness is what directs
      precursors to smooth muscle (stiffening alone is sufficient to induce
      ectopic cardiomyocytes). Elnb therefore contributes the structure the
      process depends on. Comparator check: human ELN carries GO:0003151
      outflow tract morphogenesis (IMP), the tetrapod equivalent for an
      elastin in the same structural role, and the existing GO:0003232
      annotations in zebrafish (pak1, dhfr, pbx4) are all IMP. The term is
      copy-specific: elna morphants have no bulbus morphology defect, so it is
      not proposed for elna. The more specific child GO:0003233 bulbus
      arteriosus morphogenesis was not chosen, because the defect is mainly in
      cell fate and elastin content rather than shape.
    supported_by:
    - reference_id: PMID:41712646
      supporting_text: This elnb mutant carries a premature stop codon that results
        in a truncated 81-amino acid Elnb protein, compared to the full-length 2,041-amino
        acid protein in wild-type fish
    - reference_id: PMID:41712646
      supporting_text: Homozygous elnb mutants exhibited a more severe hypoplastic
        BA than elnb morphants and developed ectopic cardiomyocytes in the BA
    - reference_id: PMID:26783159
      supporting_text: Such ectopic cardiomyocyte formation in the BA was observed
        only in elnb morphants and not in elna morphants.
    - reference_id: PMID:26783159
      supporting_text: injection of elnb MO and elna full-length mRNA did not rescue
        the elnb morphant phenotype
core_functions:
- description: >-
    Elnb is a divergent tropoelastin assembled into the elastic matrix of the
    teleost bulbus arteriosus, where it confers the organ's uniquely low
    extracellular stiffness and Windkessel elasticity. This compliant matrix
    is required for bulbus precursors to become smooth muscle rather than
    cardiomyocytes, so elnb is required for development of the bulbus
    arteriosus. Neither elna nor the single ancestral-type Polypterus eln can
    replace it.
