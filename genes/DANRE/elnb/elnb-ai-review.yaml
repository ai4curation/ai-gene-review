suggested_questions:
- question: >-
    Which sequence features of Elnb (longer hydrophobic domains, hybrid
    domains, lower hydrophobicity) are responsible for the low stiffness of
    the bulbus matrix, and would a chimeric Elna carrying them rescue elnb
    loss?
- question: >-
    Did the failure of elna and Polypterus eln mRNA to rescue reflect a true
    difference in protein function, or insufficient protein at the bulbus
    from ubiquitous mRNA injection?
- question: >-
    Is elna upregulated in the germline elnb nonsense mutant (transcriptional
    adaptation), and does an elna;elnb double mutant have a stronger
    phenotype?
suggested_experiments:
- description: >-
    Knock elna coding sequence into the elnb locus (or express it from an elnb
    promoter) in elnb mutants, to test protein-level non-equivalence under the
    correct expression pattern.
  experiment_type: in vivo cross-rescue
- description: >-
    Measure bulbus stiffness and cell fate in elna;elnb double mutants and in an
    RNA-less elnb allele.
  experiment_type: genetic loss-of-function
