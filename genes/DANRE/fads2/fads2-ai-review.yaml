- question: Does zebrafish Fads2 also carry out the C24 delta-6 desaturation of the Sprecher pathway
    needed for DHA synthesis, or is that step performed by another enzyme?
  experts: []
- question: Is the delta-8 activity inferred from crispant flux (PMID:35456508) a genuine property 
    of the purified enzyme, and how does its rate compare with the delta-6 and delta-5 activities?
  experts: []
suggested_experiments:
- hypothesis: Zebrafish Fads2 is a trifunctional delta-6/delta-5/delta-8 desaturase.
  description: Express the zebrafish cDNA in yeast as in PMID:11724940 but supply eicosadienoic 
    (20:2n-6) and eicosatrienoic (20:3n-3) acids, and quantify delta-8 products by GC-MS alongside 
    the delta-6 and delta-5 substrates to measure all three activities in one system.
  experiment_type: heterologous expression and GC-MS
- hypothesis: The small-liver phenotype of fads2 morphants reflects LC-PUFA depletion rather than a 
    hepatic function of the protein.
  description: Repeat the knockdown in a stable fads2 mutant line and test rescue by dietary or 
    injected arachidonate/EPA, scoring fabp10a expression and liver size at 72 hpf as in 
    PMID:23813869.
  experiment_type: genetic rescue
