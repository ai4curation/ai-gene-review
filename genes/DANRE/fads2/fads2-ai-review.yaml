- id: PMID:35456508
  title: Partial fads2 Gene Knockout Diverts LC-PUFA Biosynthesis via an Alternative Δ8 Pathway with
    an Impact on the Reproduction of Female Zebrafish (Danio rerio).
  findings:
  - statement: CRISPR crispants with 50-80% fads2 editing show impaired conversion of LA to GLA and 
      ALA to SDA and produce poor-quality eggs; the residual flux suggests an alternative delta-8 
      route and a trifunctional delta-6/delta-5/delta-8 enzyme.
    supporting_text: "Our \ndata suggest the existence of an alternative Δ8 pathway, which bypasses the\
      \ \nfirst endogenous LC-PUFA biosynthetic step in zebrafish in vivo, and suggest \nthat the zebrafish
      bifunctional FADS2 enzyme is actually a trifunctional \nΔ6/Δ5/Δ8 desaturase."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Title matches the cached record (Blahova et al. 2022, Genes); full text cached. CRISPR
      crispants (50-80% editing) in adult females: impaired LA to GLA and ALA to SDA conversion, poor-quality
      eggs, and evidence for an alternative delta-8 route, supporting trifunctional delta-6/delta-5/delta-8
      behaviour in vivo.'
