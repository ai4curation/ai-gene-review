- id: file:DANRE/fads2/fads2-deep-research-falcon.md
  title: Falcon deep research report on Danio rerio fads2 (Q9DEX7)
  findings:
  - statement: 'Zebrafish fads2 is a bifunctional front-end desaturase with both Delta-6 and

      Delta-5 activities, validated by heterologous expression in yeast.

      '
    supporting_text: The target protein is *Danio rerio* **fads2** (UniProt Q9DEX7), historically 
      cloned and functionally validated as a **bifunctional front-end desaturase** with **Δ6 and 
      Δ5** activities in zebrafish.
    reference_section_type: RESULTS
  - statement: 'The yeast assay directly demonstrated Delta-6 desaturation of C18 PUFA and

      Delta-5 desaturation of C20 PUFA, with products validated by GC-MS.

      '
    supporting_text: 'The seminal yeast heterologous expression study demonstrated that zebrafish Fads2
      catalyzes:'
    reference_section_type: RESULTS
  - statement: 'Delta-6 desaturation of C18 PUFA is the rate-limiting first step in converting

      dietary essential PUFA precursors into longer-chain PUFA.

      '
    supporting_text: introduces a double bond at the 6th carbon from the carboxyl end and is 
      commonly the **rate-limiting first step** for converting dietary essential PUFA precursors 
      into longer-chain PUFA.
    reference_section_type: RESULTS
  - statement: 'Delta-5 desaturation converts C20 intermediates to arachidonic acid (ARA) and

      eicosapentaenoic acid (EPA).

      '
    supporting_text: introduces a double bond at the 5th carbon and typically converts C20 
      intermediates (e.g., DGLA/ETA analogs) to **arachidonic acid (ARA)** and **eicosapentaenoic 
      acid (EPA)**.
    reference_section_type: RESULTS
  - statement: 'Teleosts often lack a canonical Fads1 (Delta-5) ortholog; zebrafish carry a

      single bifunctional Delta-6/Delta-5 Fads2 covering multiple desaturation steps.

      '
    supporting_text: 'Zebrafish are a canonical example: they carry a single **bifunctional Δ6/Δ5 Fads2**
      that supports multiple LC-PUFA biosynthetic steps.'
    reference_section_type: RESULTS
  - statement: 'Zebrafish Fads2 can act on C24 PUFA, supporting the Sprecher pathway for DHA

      biosynthesis (Delta-6 desaturation of C24 followed by peroxisomal beta-oxidation).

      '
    supporting_text: These findings support that zebrafish Fads2 can participate in the C24 Δ6 step 
      required for Sprecher-pathway DHA biosynthesis.
    reference_section_type: RESULTS
  - statement: 'Partial in-vivo CRISPR knockout reroutes LC-PUFA synthesis through an

      alternative Delta-8 pathway, so the enzyme behaves as Delta-6/Delta-5/Delta-8

      in the in-vivo pathway context.

      '
    supporting_text: The authors interpret this as evidence that zebrafish Fads2 behaves as 
      **Δ6/Δ5/Δ8** within the in vivo pathway context.
    reference_section_type: RESULTS
  - statement: 'Fads2 is a non-heme diiron front-end desaturase using the NADH-cytochrome b5

      reductase / cytochrome b5 electron-transfer chain and molecular oxygen for

      double-bond insertion.

      '
    supporting_text: Front-end desaturases are non-heme diiron enzymes that require an 
      electron-transfer chain involving **NADH–cytochrome b5 reductase**, **cytochrome b5**, and the
      desaturase, using **molecular oxygen** during double-bond insertion.
    reference_section_type: DISCUSSION
  - statement: 'Zebrafish Fads2 co-localizes with the ER marker ERp57 and is in FRET proximity

      to CYB5R2/3 reductases and ELOVL elongases in an ER lipid-synthetic module.

      '
    supporting_text: Co-localization with an ER marker (ERp57) supports ER association.
    reference_section_type: RESULTS
  - statement: 'Most biochemical and review evidence supports Fads2 as an ER membrane enzyme;

      a mitochondrial signal seen in heterologous HeLa cells is interpreted cautiously.

      '
    supporting_text: Most biochemical and review evidence supports Fads2 as an **ER membrane** 
      enzyme.
    reference_section_type: DISCUSSION
  - statement: 'Partial CRISPR disruption of fads2 in adult female zebrafish altered egg

      LC-PUFA composition and produced poor-quality eggs, affecting reproduction.

      '
    supporting_text: Partial CRISPR disruption of fads2 in adult females altered egg LC-PUFA 
      signatures and was associated with **poor-quality eggs**, consistent with a requirement for 
      properly balanced LC-PUFA production/availability during oogenesis and egg provisioning.
    reference_section_type: RESULTS
- id: PMID:11724940
  title: A vertebrate fatty acid desaturase with Delta 5 and Delta 6 activities.
  findings:
  - statement: Expression of the zebrafish fads2 cDNA in Saccharomyces cerevisiae conferred delta-6 
      desaturation of linoleate and alpha-linolenate and delta-5 desaturation of 20:3n-6 and 
      20:4n-3, showing a single vertebrate enzyme with both activities.
    supporting_text: "it conferred on the yeast the ability to convert di-homo-gamma-linoleic \nacid (20:3n-6)
      and eicosatetraenoic acid (20:4n-3) to arachidonic acid (20:4n-6) \nand eicosapentaenoic acid (20:5n-3),
      respectively, indicating that the zebrafish \ngene encodes an enzyme having both Delta5 and Delta6
      desaturase activity."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Title matches the cached record (Hastings et al. 2001, PNAS); full text cached. The
