  label: Danio rerio
description: 'Zebrafish fads2 encodes a front-end fatty acid desaturase of the endoplasmic reticulum membrane,
  carrying an N-terminal cytochrome b5 domain and the three catalytic histidine boxes typical of the family
  (PMID:11724940). Unusually for a vertebrate, the single enzyme is bifunctional: expressed in yeast it
  converts linoleate and alpha-linolenate to their delta-6 products and also converts 20:3n-6 and 20:4n-3
  to arachidonate and eicosapentaenoate, i.e. it performs both the delta-6 and the delta-5 desaturation
  of the long-chain polyunsaturated fatty acid pathway (PMID:11724940). It uses molecular oxygen and electrons
  delivered through cytochrome b5, and in vivo it also acts with delta-8 specificity on elongated C20
  substrates, giving an alternative route to LC-PUFA (PMID:35456508). Because zebrafish rely on this one
  enzyme for the first, rate-limiting steps, partial loss of function lowers omega-3 and omega-6 LC-PUFA
  in eggs and impairs female reproduction (PMID:35456508); morpholino knockdown also reduces liver size
  in embryos (PMID:23813869).'
