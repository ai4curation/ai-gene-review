- term:
    id: GO:0047022
    label: 7-beta-hydroxysteroid dehydrogenase (NADP+) activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: This ISS transfers 7-beta-hydroxysteroid dehydrogenase (NADP+) activity from 
      UniProtKB:P51661 (a bacterial 7-alpha/7-beta-HSD-type enzyme). This is a different reaction 
      chemistry (7-beta hydroxyl, NADP+ cofactor) from the 11-beta-hydroxysteroid, NAD(+)-dependent 
      activity that zebrafish Hsd11b2 actually performs.
    action: REMOVE
    reason: The zebrafish enzyme is a member of the 11-beta-HSD2 subfamily whose curated catalytic 
      activities are all NAD(+)-dependent oxidations at the 11-beta position (cortisol, 
      corticosterone, 11-beta-hydroxyandrostenedione). There is no evidence that it acts on the 
      7-beta position or uses NADP(+); the ISS donor is a poor match and the transfer is a 
      mis-mapping, not an over-broad but correct term. Removal does not deny SDR-family similarity, 
      only this specific mis-transferred activity.
    supported_by:
    - reference_id: file:DANRE/hsd11b2/hsd11b2-uniprot.txt
      supporting_text: Reaction=cortisol + NAD(+) = cortisone + NADH + H(+);
    - reference_id: file:DANRE/hsd11b2/hsd11b2-uniprot.txt
      supporting_text: Belongs to the short-chain dehydrogenases/reductases (SDR)
  qualifier: enables
  supporting_entities:
  - UniProtKB:P51661
- term:
    id: GO:0034650
    label: cortisol metabolic process
  evidence_type: IMP
  original_reference_id: PMID:34830405
  review:
    summary: IMP annotation from the hsd11b2 CRISPR knockout (PMID:34830405). Loss of the enzyme 
      prolongs the whole-body cortisol elevation after acute stress in both larvae and adults, 
      showing that hsd11b2 is required for normal cortisol turnover. The enzyme itself catalyzes the
      cortisol-inactivating step, so it participates in cortisol metabolism rather than only being 
      required for it.
    action: ACCEPT
    reason: The gene product performs the metabolic step (cortisol-to-cortisone oxidation); the 
      knockout phenotype (extended cortisol response) confirms this is the physiologically dominant 
      route of cortisol clearance in zebrafish. This is a genuine metabolic-process annotation, not 
      a downstream phenotype, so ACCEPT as core.
    supported_by:
