  review:
    summary: This IBA places hsd11b2 in glucocorticoid metabolism. By oxidizing cortisol (the 
      primary teleost glucocorticoid) to inactive cortisone, the enzyme directly performs a 
      glucocorticoid-catabolic step, so it participates in this process rather than merely being 
      required for it.
    action: ACCEPT
    reason: The enzyme does the work of glucocorticoid metabolism, catalyzing the oxidative 
      inactivation of active cortisol to cortisone. This is the biological-process face of the core 
      dehydrogenase activity and is directly documented in zebrafish.
