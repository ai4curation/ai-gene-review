- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: This IEA (from the UniProt subcellular-location mapping) places hsd11b2 in the 
      membrane. UniProt annotates it as a multi-pass membrane protein, and the sequence carries four
      predicted transmembrane helices, consistent with the membrane-anchored microsomal SDR-family 
      enzymes to which HSD11B2 belongs.
    action: ACCEPT
    reason: The membrane location is a broad but correct term supported by the predicted 
      transmembrane topology. No zebrafish functional study localizes the protein more precisely, so
      a more specific compartment term cannot be justified; the broad IEA term is appropriate as-is.
    supported_by:
    - reference_id: file:DANRE/hsd11b2/hsd11b2-uniprot.txt
