- id: file:DANRE/hsd11b2/hsd11b2-deep-research-falcon.md
  title: Falcon deep research report on zebrafish hsd11b2 (11β-HSD2)
  findings:
  - statement: Zebrafish Hsd11b2 is a cortisol-inactivating enzyme that catalyzes the 
      NAD(+)-dependent oxidation of biologically active cortisol to inactive cortisone, limiting 
      cortisol bioavailability to corticosteroid (GR/MR) receptors.
    supporting_text: Hsd11b2 is repeatedly defined as an enzyme that catalyzes the conversion 
      (oxidative inactivation) of biologically active cortisol to biologically inactive cortisone
    reference_section_type: OTHER
  - statement: Direct zebrafish tissue-homogenate assays support NAD(+)-dependent 
      cortisol-to-cortisone conversion (100 nM cortisol + 2 mM NAD+), strongly inhibited by the 
      11β-HSD inhibitor 18β-glycyrrhetinic acid (18β-GA), confirming the cofactor and substrate 
      specificity.
    supporting_text: Zebrafish hsd11b2 encodes the cortisol-inactivating 11β-HSD2 enzyme that 
      oxidizes cortisol to cortisone; direct tissue-homogenate assays support NAD+-dependent 
      oxidative conversion
    reference_section_type: OTHER
  - statement: Hsd11b2 acts as a determinant of stress-response termination/recovery; CRISPR 
      hsd11b2-/- zebrafish show prolonged cortisol elevation after stress, and 18β-GA inhibition 
      likewise delays cortisol clearance.
    supporting_text: loss of Hsd11b2 **extends the cortisol stress response** (delayed recovery), 
      establishing Hsd11b2 as a major cortisol-catabolic component during stress recovery
    reference_section_type: OTHER
  - statement: Falcon notes that subcellular/cell-type localization of zebrafish Hsd11b2 is not 
      established by the extracted evidence; the most direct localization data are region-level 
      (adult brain neurogenic regions), so the membrane annotation rests on UniProt rather than 
      functional zebrafish data.
    supporting_text: Cellular/subcellular localization** (e.g., specific cell types within brain 
      regions; subcellular compartment) is not directly established by the extracted evidence
    reference_section_type: OTHER
