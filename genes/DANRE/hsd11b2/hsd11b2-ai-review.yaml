    summary: This IBA asserts the NAD(+)-dependent 11-beta-hydroxysteroid dehydrogenase activity for
      hsd11b2. The PANTHER family node (PTN002879150, PTHR43313:SF2 = 11-beta-HSD type 2) groups the
      vertebrate HSD11B2 enzymes, and zebrafish hsd11b2 sits inside that clade with its own 
      experimental IDA support (PMID:33387577), so the phylogenetic inference is well placed.
    action: ACCEPT
    reason: This is the enzyme's core catalytic activity. UniProt curates the NAD(+)-dependent 
      reaction from multiple zebrafish experimental papers, and the biochemistry (cortisol oxidation
