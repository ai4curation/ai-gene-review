  review:
    summary: 11-beta-hydroxysteroid dehydrogenase (NADP+) activity (GO:0070524) captures the right 
      general area for zebrafish hsd11b2, but 11-beta-hydroxysteroid dehydrogenase (NAD+) activity 
      (GO:0070523) is the better supported term.
    action: MODIFY
    reason: The 11-beta-hydroxysteroid dehydrogenase essence is sound, but the supported cofactor is
      NAD(+), not NADP(+). Falcon deep research confirms NAD(+)-dependent cortisol-to-cortisone 
