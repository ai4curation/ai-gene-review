suggested_questions:
- question: Do the two zebrafish co-orthologs flvcr2a and flvcr2b divide the choline-transport role between
    tissues, and does either carry choline across the zebrafish blood-brain barrier in vivo as endothelial
    deletion of the mammalian ortholog shows for mouse?
- question: Is the mitochondrial and endoplasmic-reticulum pool of the protein transport-competent, and
    if so which solute does it move in those membranes?
- question: Does zebrafish flvcr2a transport ethanolamine, and does it require a trapping kinase to be
    detectable as the mammalian ortholog does?
suggested_experiments:
- hypothesis: Zebrafish flvcr2a mediates facilitative, sodium-independent, electrogenic choline uptake.
  description: Express flvcr2a in HEK293 cells and measure radiolabelled choline uptake with sodium replaced
    by lithium and across a pH range, plus whole-cell patch clamp for choline-evoked current, and a washout
    assay to test bidirectionality.
- hypothesis: flvcr2a supplies choline to the zebrafish brain across the vascular endothelium.
  description: Generate flvcr2a mutants (and flvcr2a;flvcr2b double mutants to control for co-ortholog
    redundancy), inject deuterated choline into the circulation, and quantify labelled choline and choline-containing
    lipids in brain versus peripheral tissue by LC-MS/MS; score cerebral vascular patterning in parallel.
- hypothesis: flvcr2a does not perform heme transport in vivo despite the family-level annotations.
  description: Compare heme and bilirubin levels and heme-analog (ZnMP) uptake in flvcr2a mutant versus
    wild-type larvae, and test flvcr2a alongside a bona fide heme transporter in a side-by-side heme flux
    assay.
