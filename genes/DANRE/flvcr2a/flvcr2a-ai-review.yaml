- term:
    id: GO:0015232
    label: heme transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'GO:0015232 claims flvcr2a moves heme across a membrane. No zebrafish heme-transport data
      exist. The PAINT node PTN000858905 spans both FLVCR paralog clades, and its heme evidence comes
      from two different sources: FLVCR1 (mouse Flvcr1, human FLVCR1) as a heme exporter, and a single
      2010 study of human FLVCR2 reporting heme import (1.8-fold higher ZnMP uptake in FLVCR2-expressing
      CHO cells, enhanced [55Fe]hemin uptake in oocytes, reduced uptake after FLVCR2 siRNA). Because the
      term is direction-neutral it is not contradicted by the FLVCR2 literature, but the later deorphanization
      work failed to corroborate heme handling: heme and bilirubin were unchanged in Mfsd7c-KO fetal brain,
      and the authors state the heme-import report has not been confirmed.'
    action: KEEP_AS_NON_CORE
    reason: 'Retained, but not as a core activity. The only experimental support within the FLVCR2 clade
      is the 2010 heterologous heme-analog uptake work on human FLVCR2 (PMID:20823265), which UniProt
      still carries as a by-similarity heme b transport reaction for flvcr2a. Against that, the 2024 mouse/vertebrate
      study found no heme or bilirubin change on loss of the gene and explicitly flags the import claim
      as unconfirmed (PMID:38302740), while the demonstrated activity of the zebrafish protein itself
      is choline transport. Non-core is the honest position: plausible ancestral capability, no zebrafish
      evidence, no current mechanistic support.'
