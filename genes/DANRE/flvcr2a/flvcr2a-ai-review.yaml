- term:
    id: GO:0015220
    label: choline transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: 'GO:0015220 claims flvcr2a can translocate choline across a membrane. This is the activity
      the zebrafish protein itself was tested for: both zebrafish Mfsd7c isoforms (DaMfsd7c_a, DaMfsd7c_b),
      along with medaka and frog orthologs, exhibited choline transport activity in the same heterologous
      uptake assay used to deorphanize the human protein. Mechanistically the transport is facilitative
      and uncoupled: substituting lithium for sodium does not affect it, it proceeds across a broad pH
      range, it is electrogenic, and it reverses when the choline gradient is inverted. This row is the
      ARBA machine-learning prediction of the same term.'
    action: ACCEPT
    reason: Core molecular function, with species-specific experimental support rather than inference
      alone. UniProt records the reaction choline(out) = choline(in) with experimental evidence from the
      same study, and structural work on the human ortholog identifies the binding site that makes choline
      the substrate (a conserved tryptophan forming a cation-pi interaction with the quaternary ammonium
      group). The predicted term coincides with the experimentally demonstrated activity, so the prediction
      is correct and adds nothing to be corrected.
    supported_by:
    - &id004
      reference_id: PMID:38302740
      supporting_text: We tested the choline import function for several MFSD7c orthologs including the
        ones from zebrafish (DaMfsd7c_a and DaMfsd7c_b isoforms), medaka fish (MeMfsd7c), and frog (XeMfsd7c).
        Consistently, these MFSD7c orthologs also exhibited choline transport activity
