  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: GO:0034228 claims flvcr2a can translocate ethanolamine. Ethanolamine handling by this transporter
      family is real but weaker and more conditional than choline transport. Structural and transport
