references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: Flvcr2a matches InterPro signatures IPR011701 and IPR020846 (major facilitator superfamily
      / MFS domain); the InterPro2GO mapping assigns transmembrane transporter activity (GO:0022857) and
      transmembrane transport (GO:0055085).
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  findings:
  - statement: Endoplasmic reticulum membrane (GO:0005789), plasma membrane (GO:0005886), mitochondrial
      membrane (GO:0031966), ethanolamine transmembrane transporter activity (GO:0034228), and transport
      across blood-brain barrier (GO:0150104) were transferred to zebrafish Flvcr2a by curator-judged
      sequence similarity to its mammalian orthologs (human FLVCR2 UniProtKB:Q9UPI3 and mouse Mfsd7c UniProtKB:Q91X85).
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: Phylogenetic inference within PANTHER families PTN000858905 and PTN000858822 supports heme
      transmembrane transporter activity (GO:0015232), heme binding (GO:0020037), heme export (GO:0097037),
      and membrane localization (GO:0016020).
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: The UniProt Swiss-Prot subcellular location keywords SL-0097 (Endoplasmic reticulum membrane),
      SL-0039 (Cell membrane), and SL-0171 (Mitochondrion membrane) map Flvcr2a to endoplasmic reticulum
      membrane (GO:0005789), plasma membrane (GO:0005886), and mitochondrial membrane (GO:0031966).
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on inter-ontology links
  findings:
  - statement: Logical inference over inter-ontology links derives choline transport (GO:0015871) from
      choline transmembrane transporter activity (GO:0015220) and ethanolamine transport (GO:0034229)
      from ethanolamine transmembrane transporter activity (GO:0034228).
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: The ARBA machine-learning model ARBA00027949 predicts choline transmembrane transporter
      activity (GO:0015220) for Flvcr2a.
- id: PMID:38302740
  title: MFSD7c functions as a transporter of choline at the blood-brain barrier.
  findings:
  - statement: Mfsd7c-knockout mouse and cell-based assays established MFSD7c (Flvcr2) as a facilitative,
      electrogenic choline transporter at the blood-brain barrier whose choline transport function is
      conserved across vertebrates; Fowler syndrome missense mutations abolish or reduce this activity.
    supporting_text: MFSD7c is a choline transporter at the blood-brain barrier
  - statement: Endothelial-specific deletion of the mouse ortholog reduces brain uptake of injected radiolabelled
      choline, establishing that the transporter performs choline movement at the blood-brain barrier
      in vivo.
    supporting_text: There was a significant reduction of radioactive signals in the brain of EcMfsd7c-KO
      mice compared to controls.
  - statement: Heme is not perturbed by loss of the mammalian ortholog, and the authors state that the
      earlier heme-import report has not been confirmed.
    supporting_text: heme and bilirubin levels in fetal brains were comparable between Mfsd7c–/– and WT
      embryos
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Title matches the cached full text, which is the source of the IDA row. The zebrafish
      relevance is explicit: both zebrafish Mfsd7c isoforms were assayed and showed choline transport
      activity. Full text available; mechanism (sodium-independence, electrogenicity, facilitative/bidirectional
      behaviour) and the endothelial-specific knockout choline-flux experiment were read directly.'
- id: file:DANRE/flvcr2a/flvcr2a-uniprot.txt
  title: UniProtKB entry A0A0R4ILB2 for Danio rerio flvcr2a
  findings:
  - statement: UniProt describes Flvcr2a/MFSD7c as a choline uniporter at the blood-brain barrier.
    supporting_text: Choline uniporter that specifically mediates choline uptake
- id: file:DANRE/flvcr2a/flvcr2a-deep-research-falcon.md
  title: Falcon deep research report (Edison Scientific Literature) for Danio rerio flvcr2a (mfsd7c-a)
  findings:
  - statement: 'The zebrafish orthologs were directly tested: the two zebrafish MFSD7c isoforms (DaMfsd7c_a
      and DaMfsd7c_b)

      show choline transport activity in heterologous assays, providing direct species-relevant support
      for choline

      transport rather than inference from mammalian orthologs alone.'
    supporting_text: zebrafish MFSD7c isoforms “DaMfsd7c_a” and “DaMfsd7c_b” show choline transport activity
      in heterologous assays
  - statement: '2024 structural/functional work in humans establishes that FLVCR1 and FLVCR2 mediate choline
      and ethanolamine

      transport as facilitative uniporters performing downhill transport independent of sodium or pH gradients,
      with

      substrate selectivity mediated by conserved aromatic (cation-pi) residues.'
    supporting_text: A 2024 Nature study concludes that human **FLVCR1 and FLVCR2 mediate cellular transport
      of choline and ethanolamine** and that both operate as **uniporters**
  - statement: 'The historical heme-import model (from 2010 hemin-binding and heme-analog uptake assays)
      is reframed by 2024

      mechanistic work, which explicitly states that FLVCR2-mediated heme uptake has not been confirmed
      and prioritizes

      choline/ethanolamine as the primary substrates; heme transport should be treated as a contested
      legacy hypothesis.'
    supporting_text: The 2024 Nature paper explicitly notes that **FLVCR2-mediated heme uptake “has not
      been confirmed”**
  - statement: 'In mammals MFSD7c is required for BBB choline handling: endothelial-specific knockout
      reduces brain uptake of

      injected radiolabeled choline while peripheral organ signals remain comparable, and loss of MFSD7c/FLVCR2
      causes

      neurovascular developmental defects (brain angiogenic sprouting) relevant to Fowler syndrome.'
    supporting_text: loss of MFSD7c reduces brain uptake of injected radiolabeled choline while leaving
      peripheral organ signals comparable
- id: PMID:38778100
  title: Molecular mechanism of choline and ethanolamine transport in humans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cryo-EM and transport study of human FLVCR1/FLVCR2; title matches the cached full text.
      Cited here for the uniporter mechanism, plasma-membrane localization, the choline/ethanolamine binding
      site, and ethanolamine as a family substrate. It concerns the human orthologs, not zebrafish, so
      it supports similarity-based rows rather than species-level claims.
  findings:
  - statement: Human FLVCR1 and FLVCR2 are uniporters that move choline and ethanolamine down their gradients
      without coupling to sodium or pH.
    supporting_text: Our findings suggest that both FLVCR1 and FLVCR2 operate as uniporters, facilitating
      downhill ligand transport independent of sodium or pH gradients.
  - statement: Both transporters are localized at the plasma membrane by confocal imaging.
    supporting_text: Confocal imaging shows that FLVCR1 and FLVCR2 are localized at the plasma membrane
  - statement: Choline and ethanolamine are the primary transport substrates of both proteins, and a shared
      binding-site glutamine is required for transport of both.
    supporting_text: alanine substitution of the analogous Q191FLVCR2 residue abolishes the transport
      of both ethanolamine and choline in FLVCR2
- id: PMID:20823265
  title: The Fowler syndrome-associated protein FLVCR2 is an importer of heme.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Title matches the cached full text and the heme-binding and heme-analog uptake experiments
      are reported as described, so the citation is correct; it is the source of the heme binding and
      heme transporter annotations in this family. Marked DISPUTED because the central import claim was
      not corroborated by later work: loss of the mammalian ortholog leaves heme and bilirubin unchanged
      and PMID:38302740 states the observation has not been confirmed. Note this paper also states that
      FLVCR2 does not export heme, which is the basis for removing the heme export row.'
  findings:
  - statement: Human FLVCR2 binds hemin-agarose in a hemin-competable manner.
    supporting_text: FLVCR2 binds to hemin-conjugated agarose, and binding is competed by free hemin
  - statement: The same study states that FLVCR2, unlike FLVCR1, does not export heme, and proposes an
      import rather than an export role.
    supporting_text: a report by Quigley and colleagues ( 37 ) clearly shows that FLVCR2 does not export
      heme.
- id: PMID:32369449
  title: Deficiency of MFSD7c results in microcephaly-associated vasculopathy in Fowler syndrome.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Title matches the cached record, which is abstract-only (full_text_available: false),
      so it is cited only for statements the abstract makes: blood-brain barrier expression of the mouse
      ortholog and the CNS vascular phenotype of the knockout. No annotation action rests on it alone.'
  findings:
  - statement: The mouse ortholog Mfsd7c is expressed in the blood-brain barrier.
    supporting_text: We identified the mouse ortholog Mfsd7c as a gene expressed in the blood-brain barrier.
  - statement: Loss of the mouse ortholog inhibits angiogenic growth of CNS blood vessels and causes microcephaly-associated
      vasculopathy.
    supporting_text: results indicate that MFSD7c is required for the normal growth of CNS blood vessels
      and that ablation of this gene results in microcephaly-associated vasculopathy in mice and humans.
