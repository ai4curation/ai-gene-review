    id: GO:0097037
    label: heme export
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'GO:0097037 asserts that flvcr2a exports heme out of the cell, a direction-specific process
      term. Its WITH/FROM is the ancestral node plus human FLVCR1 alone, i.e. the evidence is entirely
      from the heme-exporting paralog. Within the FLVCR2 clade the direction claim is the opposite of
      what was reported and was explicitly excluded: the study that proposed FLVCR2 as a heme importer
      notes that earlier work clearly shows FLVCR2 does not export heme.'
    action: REMOVE
    reason: This is a paralog-specific function propagated across a node that also contains the FLVCR2
      clade. Heme export is FLVCR1 biology; the FLVCR2 literature reports import, not export (PMID:20823265),
      and the 2024 work finds no heme phenotype at all on loss of the FLVCR2 ortholog (PMID:38302740).
      Removing the export term does not deny a possible heme interaction, which remains covered by the
      direction-neutral GO:0015232 and GO:0020037 rows kept as non-core.
