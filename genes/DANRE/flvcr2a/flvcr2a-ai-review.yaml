id: A0A0R4ILB2
gene_symbol: flvcr2a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'flvcr2a is one of the two zebrafish co-orthologs of vertebrate FLVCR2/MFSD7c, a 12-transmembrane
  carrier of the major facilitator superfamily (SLC49 family). It is a facilitative uniporter for choline:
  transport is not coupled to sodium or proton gradients, it is electrogenic, and it follows the choline
  concentration gradient, so the protein can move choline in either direction across the membrane it sits
  in. The protein resides chiefly in the plasma membrane, with reported pools in mitochondrial and endoplasmic-reticulum
  membranes. In vertebrates the orthologous protein is expressed in the endothelium of the central-nervous-system
  vasculature, where it carries circulating choline across the blood-brain barrier into the brain and
  takes up choline released by brain phospholipid turnover; choline supplied this way feeds phosphatidylcholine,
  acetylcholine and betaine synthesis, and choline is a nutrient critical for brain development. The related
  amine ethanolamine is a secondary substrate of the family. Loss of the mammalian ortholog blocks angiogenic
  growth of CNS blood vessels and produces microcephaly-associated vasculopathy, the basis of human Fowler
  syndrome; an older proposal that the protein imports heme has not been substantiated.'
