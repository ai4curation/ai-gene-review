core_functions:
- description: 'Notch-target bHLH-Orange transcriptional repressor of the segmentation clock: Her1 homodimers
    (and heterodimers with Hes6/Her13.2) bind CACGNG sites in the her1, her7 and deltaC promoters and
    repress their transcription, forming the delayed negative feedback loop that drives cyclic gene expression
    in the PSM.'
