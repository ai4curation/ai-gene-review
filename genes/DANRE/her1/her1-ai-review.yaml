id: Q90463
gene_symbol: her1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: her1 (hairy-related 1) encodes a zebrafish bHLH-Orange (Hes/Her family) transcriptional
  repressor that is a core component of the somite segmentation clock. It is a paralog of her7, and 
  together they are the zebrafish counterparts of amniote Hes7. her1 is expressed in oscillating 
  waves in the presomitic mesoderm (PSM) as a target of Delta-Notch signalling, and Her1 protein 
  forms homodimers that bind E-box/N-box-type (CACGNG) sites in the her1, her7 and deltaC promoters 
  and repress their transcription, generating a delayed negative feedback loop that drives 
  oscillation; Notch signalling via DeltaC couples and synchronises neighbouring oscillators. Her1 
  also forms heterodimers with Hes6 and Her13.2 (the FGF-dependent partner) which modulate its 
  DNA-binding and repressive activity. her1 mutants or morphants disrupt the anterior-most somite 
  borders and rostro-caudal polarity, and combined loss of her1 and her7 (or her1 and her13.2) 
  abolishes segmental patterning of the paraxial mesoderm.
