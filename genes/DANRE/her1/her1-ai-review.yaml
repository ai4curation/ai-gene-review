suggested_questions:
- question: Does Her1 recruit Groucho/TLE corepressors through its C-terminal WRPW motif in the PSM,
    and is this required for oscillation?
- question: Is her1 transcription directly activated by the Notch/Rbpj/MAML ternary complex at 
    defined Rbpj sites in the her1 promoter?
suggested_experiments:
- description: ChIP-seq of endogenously tagged Her1 in PSM to define direct targets beyond her1, 
    her7 and dlc.
- description: Mutate Rbpj-binding sites in the her1 regulatory region in a reporter transgene to 
    test direct Notch dependence of her1 oscillation.
