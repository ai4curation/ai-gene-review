taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  abhd11 is a 317-residue zebrafish mitochondrial serine hydrolase of the
  alpha/beta-hydrolase superfamily and the 1:1 Danio rerio ortholog of human
  ABHD11. Synthesized as a precursor carrying a predicted 20-residue N-terminal
  mitochondrial targeting peptide, zebrafish abhd11 folds into a cap-covered
  alpha/beta-hydrolase domain (residues 69-304) with an intact 76-HGLGG-80
  oxyanion-hole motif and a conserved Ser142-Asp166-His297 charge-relay
  catalytic triad. By jawed-vertebrate orthology to mammalian ABHD11, zebrafish
  abhd11 localizes to the mitochondrial matrix in association with the
  2-oxoglutarate dehydrogenase complex (OGDHc), where mammalian orthologs act as
  glutaryl-lipoyl thioesterases preserving DLST lipoylation and tricarboxylic
  acid cycle metabolism while displaying carboxylic-ester hydrolase activity in
  vitro.
