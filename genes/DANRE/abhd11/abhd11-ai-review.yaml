suggested_questions:
- question: >-
    Does purified zebrafish abhd11 directly hydrolyze S-glutaryl-lipoyl adducts
    on Danio rerio dlst, and does crispant or mutant loss of abhd11 impair
    embryonic 2-oxoglutarate metabolism during early zebrafish development?
suggested_experiments:
- hypothesis: >-
    Zebrafish abhd11 conserves glutaryl-lipoyl thioesterase activity on
    mitochondrial OGDHc-E2 (dlst) in vivo.
  description: >-
    Assay recombinant mature zebrafish abhd11 (residues 21-317) against
    synthetic S-glutaryl-lipoyl dlst peptides by DTNB/LC-MS and quantify dlst
    lipoylation and 2-oxoglutarate levels in abhd11 CRISPR knockout zebrafish
    larvae.
  experiment_type: biochemistry
