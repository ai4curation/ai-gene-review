      The PAINT placement is sound and the zebrafish protein has its own experimental support for the activity: morphant lysates show reduced phosphotransferase activity and loss of mannose phosphorylation of lysosomal glycosidases [PMID:19834066], and wild-type gnptab mRNA rescues hydrolase phosphorylation in the morphant [PMID:23733939]. Core molecular function.
