- term:
    id: GO:0003007
    label: heart morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:33055423
  review:
    summary: |-
      Heart morphogenesis from TALEN gnptab-null (and morphant) embryos: cardiac edema with myocardial and atrioventricular-valve defects [PMID:33055423].
    action: KEEP_AS_NON_CORE
    reason: |-
      Full text cached. The heart phenotype is real and rescued by cathepsin K inhibition or ctsk knockdown, which pins the mechanism on mis-secreted cathepsin K rather than on any cardiac activity of gnptab. Under the participation test the gene product does no work in this developmental process: it phosphorylates hydrolase N-glycans in the Golgi, and the phenotype arises because mis-sorted, extracellularly active cathepsin K perturbs TGF-beta-family signalling in the tissue. Kept as non-core (acts_upstream_of_or_within), not removed, because the ZFIN phenotype evidence is genuine.
    supported_by:
    - reference_id: PMID:33055423
      supporting_text: gnptab–/– embryos exhibit pronounced cardiac edema resulting from deficits in both myocardial development and atrioventricular (AV) valve formation.
    - reference_id: PMID:33055423
      supporting_text: Importantly, cathepsin K inhibition restored normal heart and valve development in MLII embryos.
  qualifier: acts_upstream_of_or_within
