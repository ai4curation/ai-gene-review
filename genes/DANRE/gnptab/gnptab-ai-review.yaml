id: Q5RGJ8
gene_symbol: gnptab
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  gnptab encodes the alpha/beta precursor of UDP-GlcNAc:lysosomal-enzyme N-acetylglucosamine-1-phosphotransferase (EC 2.7.8.17), a Golgi membrane enzyme that, together with the gamma subunit, transfers GlcNAc-1-phosphate from UDP-GlcNAc onto mannose residues of high-mannose N-glycans on newly synthesised lysosomal hydrolases. This is the first step in generating the mannose 6-phosphate marker that M6P receptors read to sort hydrolases to endolysosomes; the alpha/beta precursor is activated by mbtps1 (S1P) cleavage in the Golgi. Loss of gnptab in zebrafish models mucolipidosis II: hydrolases are hypersecreted into the extracellular space rather than reaching lysosomes, and extracellular cathepsin K activity perturbs TGF-beta-family signalling, producing craniofacial cartilage, bone, otolith, pectoral fin and heart/valve defects.
