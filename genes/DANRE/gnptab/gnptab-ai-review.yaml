- id: file:DANRE/gnptab/gnptab-deep-research-falcon.md
  title: Falcon deep research report on Danio rerio gnptab (UniProt Q5RGJ8)
  findings:
  - statement: 'Zebrafish gnptab (UniProt Q5RGJ8) is the catalytic alpha/beta precursor of GlcNAc-1-phosphotransferase

      (EC 2.7.8.17) and catalyzes the first committed step of mannose-6-phosphate biosynthesis,

      transferring phospho-GlcNAc from UDP-GlcNAc to the 6-hydroxyl of mannose on N-glycans of lysosomal

      hydrolases. Identity is directly confirmed by a structural study of a zebrafish Q5RGJ8 catalytic

      construct (87% identity to human GNPTAB).

      '
    supporting_text: Danio rerio **gnptab** (UniProt **Q5RGJ8**) encodes the **N-acetylglucosamine-1-phosphotransferase α/β precursor** (GlcNAc-1-phosphotransferase; **EC 2.7.8.17**), the catalytic polypeptide of the mannose-6-phosphate (M6P) lysosomal enzyme-targeting pathway. This is directly verified by a peer-reviewed structural study that crystallized and biochemically characterized a **zebrafish GNPTAB minimal construct explicitly annotated as UniProt Q5RGJ8**.
    reference_section_type: RESULTS
  - statement: 'The enzyme is a phosphotransferase (not a glycosyltransferase) that uses UDP-GlcNAc as the

      phosphate-sugar donor and requires Mg2+ or Mn2+ for activity.

      '
    supporting_text: GlcNAc-1-phosphotransferase (GNPT) is a **phosphotransferase** (not a glycosyltransferase) that uses **UDP-GlcNAc** as phosphate-sugar donor; it requires **Mg2+ or Mn2+** for activity, consistent with metal coordination of phosphate groups in the active site.
    reference_section_type: INTRODUCTION
  - statement: 'The native enzyme is a heterohexamer (alpha2-beta2-gamma2): GNPTAB encodes the catalytic alpha/beta

      precursor that is proteolytically cleaved (after Lys928 / K928-D929) by Site-1 protease in the

      Golgi/TGN to generate mature alpha and beta subunits, while GNPTG encodes the auxiliary gamma subunit.

      '
    supporting_text: 'The native GNPT enzyme is commonly described as a **heterohexamer α2β2γ2**, where:

      - **GNPTAB** encodes an **α/β precursor** that is **proteolytically cleaved** in the Golgi/TGN (reported at **K928–D929 / after Lys928**) to generate mature α and β subunits; cleavage is required for activity in the canonical full-length protein.'
    reference_section_type: INTRODUCTION
  - statement: 'GNPTAB functions in the cis-Golgi with catalytic surfaces oriented toward the Golgi lumen,

      anchored by multiple transmembrane helices; localization is supported by structural topology and

      colocalization with the cis-Golgi marker GM130.

      '
    supporting_text: GNPTAB functions in the **cis-Golgi**, with its catalytic surfaces oriented toward the **Golgi lumen**, consistent with both structural topology and colocalization evidence (GM130 marker).
    reference_section_type: RESULTS
  - statement: 'Substrate recognition of lysosomal hydrolases depends on protein-level determinants: a DMAP

      interaction domain in GNPTAB acts as a substrate-recognition module binding lysosomal hydrolases

      (cathepsin D, alpha-iduronidase) but not non-lysosomal glycoproteins, and the GNPTG gamma subunit

      contributes via its MRH mannose-binding domain.

      '
    supporting_text: A **DMAP interaction domain** within GNPTAB serves as a **substrate-recognition module**, experimentally binding lysosomal hydrolases (cathepsin D, α-iduronidase) but not tested non-lysosomal glycoproteins.
    reference_section_type: INTRODUCTION
  - statement: 'Structural work on the zebrafish Q5RGJ8 catalytic construct mapped catalytic residues and metal

      coordination; mutation of Asp407 reduced activity ~500-fold and mutation of Asn1151 reduced

      activity ~200-fold.

      '
    supporting_text: Quantitatively, mutation of **Asp407** reduced activity by ~**500-fold**, and mutation of **Asn1151** reduced activity by ~**200-fold** in the reported assays.
    reference_section_type: RESULTS
  - statement: 'In zebrafish gnptab-deficient (MLII) models, reduced mannose phosphorylation of lysosomal

      hydrolases causes broad developmental phenotypes (craniofacial cartilage, cardiac edema, otic

      vesicle/otolith, pectoral fin, motility defects), rescuable by wild-type GNPTAB mRNA.

      '
    supporting_text: Zebrafish gnptab depletion (morpholino-based MLII models) causes reduced mannose phosphorylation of lysosomal hydrolases and broad developmental phenotypes (craniofacial cartilage, cardiac edema, otic vesicle/otolith defects, pectoral fin defects, motility defects), with **rescue by wild-type GNPTAB mRNA**.
    reference_section_type: RESULTS
  - statement: 'Loss of gnptab causes downstream cartilage/ECM pathology via dysregulated extracellular proteases:

      chondrocytes fail to intercalate and are ~25% larger, with sustained cathepsin and MMP activity;

      genetic or pharmacologic cathepsin K inhibition partially rescues cartilage defects.

      '
    supporting_text: In gnptab-deficient embryos, there is increased and sustained activity of cathepsins and MMPs, regionally enriched in the head, linking lysosomal mistargeting to extracellular protease-driven cartilage pathology.
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Deep-research summary; no longer used as support because primary zebrafish papers are cached.
