suggested_questions:
- question: Does zebrafish Gnptab require the gamma subunit (gnptg) for hydrolase recognition in vivo, or can the alpha/beta precursor alone phosphorylate hydrolases in gnptg-deficient embryos?
- question: Is the EF-hand region of Gnptab a functional calcium-binding site, and does calcium modulate phosphotransferase activity?
suggested_experiments:
- description: Localise endogenous Gnptab in zebrafish embryos (knock-in tag or validated antibody) with cis-Golgi markers to replace the by-similarity Golgi membrane annotation with direct evidence.
  hypothesis: Zebrafish Gnptab resides in the cis/medial Golgi membrane where hydrolase N-glycans are phosphorylated.
