core_functions:
- description: Myristoylated neuronal Ca2+ sensor of cone photoreceptors that activates the photoreceptor membrane
    guanylate cyclases when free Ca2+ falls and inhibits them at high Ca2+; the high-Ca2+-sensitivity member of the
    zebrafish GCAP set, expressed in all cone types.
  molecular_function:
    id: GO:0008048
    label: calcium sensitive guanylate cyclase activator activity
  supported_by:
  - *ic50
  - *native
  - reference_id: PMID:22212098
    supporting_text: Using affinity purified antibodies immunoreactivity towards zGCAP3 was weakly detected in the
      outer and strongly in the inner segments of cone cells as well as in the outer plexiform layer, to a lesser
      degree also in the inner plexiform and ganglion cell layer of the zebrafish retina.
suggested_questions:
- question: Is the tenfold difference in Ca2+ sensitivity between zGCAP3 (guca1c) and zGCAP4 (guca1d) derived in
    one copy, and which copy resembles gar GCAP3 when assayed in the same system?
- question: Does guca1d compensate in guca1c mutants (transcriptional adaptation after the NMD-type allele), and
    does a guca1c; guca1d double mutant alter cone photoresponse recovery?
- question: Are the plexiform-layer and ganglion-cell-layer immunosignals for zGCAP3 real, or cross-reactivity, given
    that single-cell and in situ data restrict the transcript to cones?
suggested_experiments:
- hypothesis: guca1c and guca1d are partly redundant in cone Ca2+ feedback.
  description: Generate guca1c and guca1d single and double mutants (ideally promoter-less or RNA-less alleles to
    avoid transcriptional adaptation) and record cone ERG a-wave recovery and paired-flash recovery in larvae and adults.
  experiment_type: double mutant electrophysiology
- hypothesis: The Ca2+ sensitivity difference between the copies is a protein-level divergence from the ancestral
    GCAP3.
  description: Express spotted gar GCAP3 alongside zGCAP3 and zGCAP4 and measure GC activation versus free Ca2+ with
    the same native zebrafish retinal membranes.
  experiment_type: in vitro enzyme assay
