description: guca1c (guanylate cyclase activator 1C; protein name zGCAP3) is one of two zebrafish co-orthologs
  of vertebrate GUCA1C (GCAP3), retained from the teleost-specific genome duplication; its paralog is guca1d (zGCAP4).
  It encodes a small (188 aa) N-myristoylated neuronal calcium sensor of the recoverin/GCAP family with four EF-hands,
  of which EF2-EF4 bind Ca2+. Like other GCAPs it activates the photoreceptor membrane guanylate cyclases at low free
  Ca2+ and inhibits them at high Ca2+, so it mediates the Ca2+ feedback that restores cGMP after light exposure. Among
  the zebrafish GCAPs it activates the cyclases with high Ca2+ sensitivity (half-maximal near 30 nM free Ca2+,
  similar to zGCAP1 and zGCAP2 and more than tenfold lower than zGCAP4). guca1c is expressed in all four cone
  types and not in rods, from about 3-4 dpf; it is the most abundant GCAP transcript in adult cones and is present
  in large molar excess over the cone cyclase zGC3. Morpholino knockdown did not change larval optokinetic or
  optomotor responses, and a CRISPR knockout reported Muller-cell gliosis and some ganglion-cell apoptosis.
