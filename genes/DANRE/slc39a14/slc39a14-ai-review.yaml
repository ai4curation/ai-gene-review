id: A0A0G2KQY6
gene_symbol: slc39a14
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'slc39a14 encodes ZIP14 (metal cation symporter ZIP14), a member of the ZIP (SLC39) family
  of divalent-metal importers. It is a multi-pass membrane protein that carries zinc, manganese and non-transferrin-bound
  iron (and, non-physiologically, the toxic metal cadmium) into cells, proposed to move each divalent
  cation together with two bicarbonate anions as an electroneutral metal:bicarbonate symport complex.
  ZIP14 acts at the plasma membrane (both apical and basolateral in polarized epithelia) and at endosomal
  and lysosomal membranes, and assembles as a homotrimer. In liver, intestine and other tissues it mediates
  the systemic clearance of manganese, and loss of function causes manganese accumulation: human SLC39A14
  mutations produce childhood-onset manganism with parkinsonism-dystonia, and CRISPR-null zebrafish recapitulate
  this with brain manganese deposition while other metals are largely unaffected. Through its zinc and
  iron transport it also contributes to metal-ion homeostasis, and its expression is metal-responsive.'
