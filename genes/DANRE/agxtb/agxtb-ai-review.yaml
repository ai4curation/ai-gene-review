id: Q6PHK4
gene_symbol: agxtb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: agxtb (alanine--glyoxylate aminotransferase b) is one of two zebrafish co-orthologs of vertebrate AGXT,
  retained from the teleost-specific genome duplication; its paralog is agxta. It encodes a pyridoxal 5'-phosphate
  dependent class-V aminotransferase that is predicted to transaminate glyoxylate with L-alanine to glycine and
  pyruvate, and L-serine with pyruvate to hydroxypyruvate and L-alanine. Vertebrate AGT removes glyoxylate before it
  is oxidized to oxalate and, in the mitochondrial form, also acts on glyoxylate from hydroxyproline breakdown and on
  serine and alanine for gluconeogenesis. agxtb keeps the catalytic lysine and substrate-binding arginine and has a
  32-residue arginine-rich N-terminal extension that matches the mitochondrial targeting sequence of the spotted gar
  and tetrapod orthologs, but its C-terminus (SKA) no longer fits the peroxisomal targeting signal; it is therefore
  predicted to be the mitochondrial copy, while agxta is the peroxisomal one. agxtb is expressed mainly in liver,
  kidney, intestine and spleen and rises strongly in larvae. No functional study of the zebrafish protein has been
  published.
