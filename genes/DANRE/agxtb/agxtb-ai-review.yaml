core_functions:
- description: PLP-dependent alanine:glyoxylate and serine:pyruvate aminotransferase predicted to act in
    mitochondria; the MTS-bearing copy of the zebrafish pair (32-residue N-terminal extension shared with gar AGXT;
    C-terminal PTS1 lost). Converts glyoxylate to glycine and transaminates serine and alanine. Location and activity
    are inferred from sequence and orthology; not measured in zebrafish.
