suggested_questions:
- question: Is Agxtb imported into mitochondria in zebrafish liver and kidney, and is its N-terminal extension cleaved
    as an MTS?
- question: Does the SKA C-terminus of Agxtb really abolish peroxisomal import, or can internal signals still bring
    some Agxtb into peroxisomes?
- question: Why is agxtb about three times more highly expressed than agxta in larvae (E-ERAD-475), and does the
    mitochondrial copy carry most of the glyoxylate load from hydroxyproline in a carnivorous fish?
suggested_experiments:
- hypothesis: Agxtb is mitochondrial and Agxta peroxisomal.
  description: Co-localize tagged Agxtb (tag at the C-terminus, leaving the N-terminal extension free) with
    mitochondrial and peroxisomal markers in zebrafish hepatocytes or fish cell lines; delete the N-terminal extension
    and add a canonical PTS1 (SKL) to test whether the targeting difference is carried by these signals alone.
  experiment_type: subcellular localization
- hypothesis: Mitochondrial Agxtb handles glyoxylate from hydroxyproline catabolism.
  description: Compare oxalate and glycolate excretion of agxtb and agxta mutant larvae after a hydroxyproline load
    versus a glycolate load.
  experiment_type: knockout phenotyping
