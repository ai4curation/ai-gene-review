  review:
    summary: Mitochondrion transferred from rat Agxt (P09139), whose upstream-start product carries a cleavable MTS.
    action: ACCEPT
    reason: agxtb begins with a 32-residue arginine-rich, acid-poor extension that aligns with the MTS-like extension
      of spotted gar AGXT and is homologous in position to the MTS of the mouse and rat upstream-start products. This
      extension is present in the agxtb orthologues of every teleost in the panel examined. A survey of the zebrafish
      peroxisomal proteome also predicted an N-terminal MTS for agxtb. Mitochondrial location is the best-supported
      prediction for this copy, though it has not been tested in zebrafish.
    supported_by:
