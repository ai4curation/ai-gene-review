  review:
    summary: Peroxisome propagated from node PTN000475539 (human AGXT, rat Agxt).
    action: MARK_AS_OVER_ANNOTATED
    reason: The node correctly carries peroxisome for the family, and the zebrafish paralog agxta keeps a C-terminal
      PTS1-like end. agxtb does not. Its C-terminus is SKA, which does not fit the PTS1 consensus and which is shared
      by most agxtb orthologues across teleosts, while it keeps the ancestral N-terminal MTS-like extension. After the
      duplication the two copies appear to have divided the ancestral targeting signals, and same-node IBA
      propagation cannot see this. Not removed, because peroxisomal import of AGT can also use internal signals and
      neither zebrafish protein has been localized experimentally.
    supported_by:
    - reference_id: PMID:35295584
      supporting_text: Interestingly, zebrafish encode another putative AGT (agxtb, Q6PHK4_DANRE) which lacks a PTS1
        but possesses an N-terminal MTS.
    - reference_id: file:DANRE/agxta/agxta-bioinformatics/RESULTS.md
      supporting_text: agxtb kept the extension and its C-terminus became SKA, which does not fit the PTS1 consensus.
    - reference_id: PMID:15911627
      supporting_text: Peroxisomal import of human alanine:glyoxylate aminotransferase requires ancillary targeting
        information remote from its C terminus.
