- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P21549
  review:
    summary: Peroxisome transferred by sequence similarity from human AGXT (P21549).
    action: MARK_AS_OVER_ANNOTATED
    reason: Human AGT is peroxisomal because it lacks the MTS start codon and has a C-terminal PTS1 (KKL) with an
      ancillary internal signal. agxtb is in the opposite state, with an N-terminal MTS-like extension and a
      C-terminus (SKA) that does not fit the PTS1 consensus, so location does not transfer from the human enzyme to
      this copy. The zebrafish paralog agxta is the copy for which peroxisome is predicted.
    supported_by:
    - reference_id: PMID:41781394
      supporting_text: The human AGT protein lacks a functional MTS start codon and has been shown to exclusively
        target the peroxisome27,60, whereas the Xenopus protein exclusively targets the mitochondria61.
    - reference_id: PMID:35295584
      supporting_text: Interestingly, zebrafish encode another putative AGT (agxtb, Q6PHK4_DANRE) which lacks a PTS1
        but possesses an N-terminal MTS.
