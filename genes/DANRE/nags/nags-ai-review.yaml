  review:
    summary: |-
      L-arginine biosynthetic process (IBA from a node dominated by microbial and fungal members: E. coli argA, yeast ARG2, Aspergillus). In bacteria, fungi and plants N-acetylglutamate is the committed intermediate of arginine biosynthesis; in vertebrates it is instead a CPS activator. The zebrafish authors nevertheless propose an early developmental role for the urea-cycle set in citrulline/arginine synthesis [PMID:24465614].
    action: KEEP_AS_NON_CORE
    reason: |-
      Not removed, because the product of this enzyme does feed the ornithine-citrulline-arginine route that operates in zebrafish embryos in the first day, so a contribution to arginine synthesis is credible. Kept non-core because the vertebrate enzyme's demonstrated role is supplying the CPS cofactor, and the arginine-biosynthetic framing comes from prokaryotic and fungal members of the family plus an expression-based inference rather than from any measurement in fish.
