id: E7FCP8
gene_symbol: nags
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  nags encodes mitochondrial N-acetylglutamate synthase, a matrix enzyme of the amino-acid-kinase/N-acetyltransferase family that condenses L-glutamate with acetyl-CoA to give N-acetyl-L-glutamate (EC 2.3.1.1). N-acetylglutamate is the obligatory allosteric activator of carbamoyl phosphate synthetase, so this single reaction gates entry of ammonia nitrogen into the urea cycle. The zebrafish enzyme is a tetramer carrying an N-terminal mitochondrial targeting signal, a variable segment and the conserved AAK-NAT core; unlike mammalian NAGS, which arginine activates, and microbial NAGS, which arginine strongly inhibits, the fish enzyme is only partially inhibited by L-arginine and therefore works near maximal rate at physiological substrate levels. It is expressed from maternal transcripts onward and together with the urea-cycle genes through the first days of development, when the pathway is thought to serve citrulline/arginine synthesis before taking on ammonia detoxification.
