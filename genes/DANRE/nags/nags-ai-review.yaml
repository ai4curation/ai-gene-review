      Full text cached; title matches (Sirisinha/Caldovic et al. 2014, PLoS ONE, zebrafish N-acetylglutamate synthase). The only primary paper on this gene product: purified zfNAGS-M and zfNAGS-C kinetics, arginine binding and partial inhibition, tetramer formation, MTS delimitation and qRT-PCR expression of the urea-cycle set. Supports the catalytic IDA, the arginine-binding IDA, the matrix rows and the proposed urea-cycle annotation.
