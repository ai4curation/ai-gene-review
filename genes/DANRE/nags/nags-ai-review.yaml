suggested_questions:
- question: Does loss of nags in zebrafish produce a ureagenesis or ammonia-handling phenotype, and is it rescued by N-acetylglutamate or its analogue carbamylglutamate as in human NAGS deficiency?
- question: Which carbamoyl phosphate synthetase does zebrafish N-acetylglutamate activate in vivo at each stage, given that fish express the glutamine-dependent CPS3 as well as cps1?
suggested_experiments:
- hypothesis: Zebrafish nags gates urea-cycle flux through N-acetylglutamate supply.
  description: Generate a nags null allele and measure N-acetylglutamate, ammonia and urea in larvae, with rescue by N-carbamylglutamate feeding, to test whether the metabolic block is downstream of cofactor loss rather than a general developmental defect.
  experiment_type: genetic and metabolite analysis
- hypothesis: The variable segment tunes arginine sensitivity of fish NAGS in vivo.
  description: Compare rescue of the nags null by full-length, variable-segment-deleted and arginine-site-mutant constructs, scoring NAG levels and ammonia tolerance, to test the proposed evolutionary intermediate state of arginine regulation.
  experiment_type: structure-function rescue
