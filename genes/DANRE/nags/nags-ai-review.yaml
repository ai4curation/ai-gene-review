- term:
    id: GO:0000050
    label: urea cycle
  evidence_type: IC
  original_reference_id: PMID:24465614
  review:
    summary: |-
      Urea cycle. NAGS itself catalyses no urea-cycle step, but it produces N-acetylglutamate, the obligatory allosteric activator without which carbamoyl phosphate synthetase cannot initiate the pathway [PMID:24465614]; UniProt states the zebrafish enzyme's role as modulating cps1 through NAG supply. Zebrafish nags is co-expressed with the five urea-cycle genes and both transporters across the first four days of development.
    action: NEW
    reason: |-
      Proposed on the cofactor-contribution criterion rather than on necessity alone: the enzyme supplies the activator that a step of the cycle depends on, which is the fibrin/thyroglobulin-shaped case where GO does annotate the supplier. The comparator check supports it - the human ortholog NAGS (Q8N159) carries GO:0000050 by IDA in GOA, so this is an existing convention for NAGS rather than a novel extension, and no zebrafish urea-cycle annotation currently covers the activator-supply step (cps1, otc, ass1, arg1/arg2 hold the term for the reactions themselves). Marked IC because it is a curator inference from the zebrafish biochemistry plus the pathway architecture, not a direct assay of ureagenesis in this species.
    supported_by:
    - reference_id: PMID:24465614
      supporting_text: is an essential allosteric activator of CPS1; NAG deficiency results in a block of ureagenesis
    - reference_id: PMID:24465614
      supporting_text: NAGS and other urea cycle genes are highly expressed during the first four days of zebrafish development.
