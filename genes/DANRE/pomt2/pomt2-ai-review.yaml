core_functions:
- description: As one subunit of the Pomt1-Pomt2 heteromeric enzyme in the ER membrane, Pomt2
    transfers mannose from dolichyl-phosphate-mannose to Ser/Thr hydroxyls of secretory
    proteins (chiefly alpha-dystroglycan), initiating O-mannosyl glycan biosynthesis; this is
    the reaction of EC 2.4.1.109 and was reconstituted for the zebrafish enzyme.
  molecular_function:
    id: GO:0004169
    label: dolichyl-phosphate-mannose-protein mannosyltransferase activity
