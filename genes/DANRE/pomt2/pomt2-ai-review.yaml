  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The PAINT node PTN001295889 places the GT39 protein O-mannosyltransferases
      (yeast Pmt1-7, Drosophila rt/tw, mouse and human POMT1/POMT2) in the ER, the compartment
      where dolichyl-phosphate-mannose is used. No zebrafish localization experiment exists,
      but the zebrafish protein is an 11-transmembrane-helix enzyme with the same MIR-domain
      luminal architecture and the same Dol-P-Man-dependent activity, and UniProt transfers
      the ER-membrane location from human POMT2.
    action: ACCEPT
    reason: Dol-P-Man is synthesized on the cytosolic face of the ER and flipped into the
      lumen, so an enzyme that consumes it to mannosylate nascent secretory proteins must
      act in the ER; the zebrafish enzyme demonstrably uses this donor (it reconstitutes
      protein O-mannosyltransferase activity with Pomt1 in HEK293T microsomes, PMID:20466645).
      The zebrafish protein is inside the clade at which the PAINT curator placed the ER
      localization (human POMT2 Q9Y6A1 is among the descendants used), and there is no
      evidence of a lineage-specific relocation. The IBA is therefore sound; the more
      specific ER membrane term (ISS/IEA rows below) captures the same location at finer
      grain.
