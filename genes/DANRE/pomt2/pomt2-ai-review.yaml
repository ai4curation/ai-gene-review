- id: PMID:20466645
  title: Protein O-mannosylation is necessary for normal embryonic development in
    zebrafish.
  findings:
  - statement: Zebrafish Pomt1 and Pomt2 are both required for full protein O-mannosyltransferase
      activity when reconstituted in HEK293T cells.
    supporting_text: only when both zPOMT1 and zPOMT2 were expressed in human embryonic kidney
      293T cells were high levels of protein O-mannosyltransferase activity detected, indicating
      that both zPOMT1 and zPOMT2 were required for full enzymatic activity
  - statement: Zebrafish and human POMT subunits are interchangeable, indicating a conserved
      heteromeric enzyme.
    supporting_text: either heterologous combination, zPOMT1 and human POMT2 (hPOMT2) or hPOMT1
      and zPOMT2, resulted in enzymatic activity in cultured cells
  - statement: Knockdown of pomt2 abolishes glycosylated alpha-dystroglycan (IIH6 epitope) in
      embryos and causes body-axis, pericardial and eye-pigmentation defects.
    supporting_text: Injection of antisense morpholino oligonucleotides of zPOMT1 and zPOMT2
      resulted in several severe phenotypes-including bended body, edematous pericaridium and
      abnormal eye pigmentation.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached PubMed record (Glycobiology 2010). Abstract-only
      cache, but the abstract itself reports the HEK293T reconstitution and the morphant IIH6
      result, which are exactly the claims cited here. Primary source for EC 2.4.1.109 in the
      UniProt entry.
- id: PMID:36499139
  title: Deletion of POMT2 in Zebrafish Causes Degeneration of Photoreceptors.
  findings:
  - statement: A CRISPR pomt2 null allele abolishes matriglycan on alpha-dystroglycan and EYS
      binding.
    supporting_text: pomt2 mutation resulted in a loss of matriglycan and abolished binding of
      EYS protein to α-dystroglycan
  - statement: pomt2 mutants show hydrocephalus, cerebellar hypoplasia and muscular dystrophy,
      the dystroglycanopathy triad.
    supporting_text: Mutant zebrafish presented with hydrocephalus and hypoplasia of the
      cerebellum, as well as muscular dystrophy.
  - statement: Photoreceptor development is normal but late-onset rod and cone degeneration
      follows loss of EYS from the connecting cilium region.
    supporting_text: While photoreceptor development was not affected in pomt2 mutant zebrafish,
      photoreceptor density was significantly reduced by 6-mpf. Apoptosis of both cone and rod
      photoreceptors in the pomt2 mutant retina was significantly increased.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches the cached record (Int J Mol Sci 2022); full text cached. The
      paper supports the photoreceptor-maintenance IMP row as an indirect, matriglycan/EYS-
      mediated consequence, and independently confirms loss of O-mannosyl glycans in a null
      mutant.
