- id: file:DANRE/pomt2/pomt2-uniprot.txt
  title: UniProtKB entry F1Q8R9 for Danio rerio pomt2
  findings:
  - statement: 'FUNCTION: Transfers mannosyl residues to the hydroxyl group of serine
      or threonine residues.'
    supporting_text: 'FUNCTION: Transfers mannosyl residues to the hydroxyl group
