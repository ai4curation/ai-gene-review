gene_symbol: pomt2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: pomt2 encodes protein O-mannosyl-transferase 2, a multi-pass endoplasmic-reticulum
  membrane glycosyltransferase of the GT39 family. Together with Pomt1 it forms the
  heteromeric enzyme that transfers mannose from dolichyl-phosphate-mannose onto the
  hydroxyl group of serine or threonine residues of secretory-pathway proteins, the
  first step of O-mannosyl glycan biosynthesis. Co-expression of both subunits is needed
  for high activity; either subunit alone is inactive or weakly active. The principal
  physiological substrate is alpha-dystroglycan, whose O-mannosyl glycans are later
  extended in the Golgi to matriglycan, the laminin-, agrin- and EYS-binding polysaccharide.
  In zebrafish, pomt2 is maternally supplied and widely expressed (eye, brain, somites,
  muscle); morpholino knockdown abolishes glycosylated alpha-dystroglycan and causes
  body-axis, pericardial and eye-pigmentation defects, while CRISPR null mutants lose
  matriglycan, show hydrocephalus, cerebellar hypoplasia and muscular dystrophy, fail to
  anchor EYS at the photoreceptor connecting cilium, and undergo late-onset rod and cone
  degeneration, modelling human POMT2-associated dystroglycanopathy and retinal atrophy.
