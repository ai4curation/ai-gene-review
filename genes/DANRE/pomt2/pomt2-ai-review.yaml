- term:
    id: GO:0045494
    label: photoreceptor cell maintenance
  evidence_type: IMP
  original_reference_id: PMID:36499139
  review:
    summary: ZFIN annotation from the pomt2(sny5+13) CRISPR null (full text cached). Mutants
      have normal photoreceptors at 1 month but by 6 months show opsin mislocalization,
      increased TUNEL-positive rods and cones, and reduced cone-marker immunoreactivity; the
      authors trace this to loss of matriglycan on alpha-dystroglycan, which abolishes EYS
      binding and EYS enrichment at the connecting cilium. GO defines the term as any process
      preventing photoreceptor degeneration, and ZFIN used the indirect qualifier
      acts_upstream_of_or_within.
    action: KEEP_AS_NON_CORE
    reason: The phenotype is real and well documented, but Pomt2 does not itself do the work of
      maintaining photoreceptors - it O-mannosylates alpha-dystroglycan in the ER, and the
      protective effect is executed downstream by matriglycan-dependent anchoring of EYS at
      the connecting cilium (PMID:36499139, Discussion). Photoreceptor development is normal
      in the mutant and degeneration is late-onset, which fits a maintenance defect that is a
      consequence of the missing glycan rather than a direct activity of the enzyme. The
      annotation should be retained with its upstream qualifier as a non-core, organism-level
      role; it is not the core function and should not be used to seed orthologs.
    supported_by:
    - reference_id: PMID:36499139
      supporting_text: While photoreceptor development was not affected in pomt2 mutant
        zebrafish, photoreceptor density was significantly reduced by 6-mpf. Apoptosis of both
        cone and rod photoreceptors in the pomt2 mutant retina was significantly increased.
        These results indicate that POMT2 is essential for EYS protein localization near
        connecting cilia and for photoreceptor survival.
    - reference_id: PMID:36499139
      supporting_text: Loss of EYS in the connecting cilium region in pomt2 mutant zebrafish
        may ultimately cause photoreceptor degeneration.
    - reference_id: PMID:36499139
      supporting_text: These data suggest that POMT2-mediated O-mannosyl glycosylation is
        required for EYS protein localization to the connecting cilium region and photoreceptor
        survival.
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-240822-1
