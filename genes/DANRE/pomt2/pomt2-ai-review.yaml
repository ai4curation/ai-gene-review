suggested_questions:
- question: Is the zebrafish Pomt1-Pomt2 heteromer the only source of protein O-mannosyltransferase
    activity, or do the TMTC family O-mannosyltransferases (which act on cadherins/plexins
    in mammals) contribute to the residual IIH6-independent O-mannosylation in pomt2 nulls?
- question: Which zebrafish substrates besides alpha-dystroglycan are O-mannosylated by Pomt2,
    and does loss of their glycans contribute to the hydrocephalus and cerebellar phenotypes
    independently of matriglycan?
suggested_experiments:
- description: Glycoproteomic comparison of O-mannosylated peptides from wild-type versus
    pomt2(sny5+13) brain and muscle to define the in vivo substrate range of the zebrafish
    enzyme.
- description: Rescue of the pomt2 null with a catalytically dead point mutant (conserved
    GT39 active-site residues) versus wild-type cDNA, to confirm that photoreceptor survival
    and EYS localization depend on Pomt2 catalytic activity rather than a structural role in
    the Pomt1-Pomt2 complex.
