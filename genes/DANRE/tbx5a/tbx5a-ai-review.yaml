  review:
    summary: Heart looping (IGI, tbx5a + tbx5b double morphants).
    action: ACCEPT
    reason: >-
      Failure of cardiac looping is the defining heart phenotype of tbx5a loss in zebrafish. It is seen in heartstrings
      (PMID:12223419), in the T-box-truncating oug allele (PMID:34372968) and in morphants (PMID:24759614). Looping
      also needs tbx5b (PMID:30532148), so the term is correctly shared by the pair.
    supported_by:
    - reference_id: PMID:24759614
      supporting_text: >-
        By contrast, 88% (n = 121) of the tbx5a MO-injected embryos had incomplete cardiac looping, and within these
        57% showed D-loop, 24% showed L-loop and 19% showed no looping at all
    - reference_id: PMID:24759614
      supporting_text: >-
        Although, in agreement with a previous report [17], the severity of the phenotype was not enhanced by double
        knock-down, downregulation of both genes increased the penetrance of the phenotype (figure 1i).
