  review:
    summary: Heart looping (IGI with pdlim7).
    action: ACCEPT
    reason: >-
      Pdlim7 and Tbx5 act in one pathway at the AV boundary, and both are needed for looping by 48 hpf (PMID:19895804).
      Heart looping is a well-established tbx5a requirement (PMID:12223419, PMID:34372968).
    supported_by:
    - reference_id: PMID:19895804
      supporting_text: >-
        Both genes, on the other hand, are required for proper heart morphology, with pdlim7 playing an earlier
        role at or slightly before 24 hpf and both pdlim7 and tbx5 being essential by 48 hpf for heart-looping.
    - reference_id: PMID:12223419
      supporting_text: >-
        However, the heart fails to loop and then progressively deteriorates, a process affecting the ventricle
        as well as the atrium.
