core_functions:
- description: >-
    Sequence-specific DNA-binding transcription factor (T-box) that activates target genes such as tbx2b, fgf24/fgf10
    and ndrg4.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18347092
    supporting_text: >-
      In electromobility shift assays (EMSA) to test DNA-binding affinity, Foxn4 and Tbx5 bound efficiently to their
      labeled putative binding sites, and binding was efficiently competed with excess unlabeled cognate competitors,
      but not with mutated oligonucleotides
  - reference_id: PMID:18347092
    supporting_text: >-
      Thus, the putative Foxn4 and Tbx5 DNA-binding sites are required for the precise control of this highly conserved
      tbx2b enhancer during AV canal development.
  - reference_id: PMID:19895804
    supporting_text: >-
      The presence of a Tbx5-binding-element in the promoter of tbx2b along with the reduction of expression in
      hst heterozygous mutants and complete loss in homozygotes reveals that Tbx5 regulates tbx2b at the AV boundary.
- description: >-
    Initiation of the pectoral fin bud: the tbx5a-specific role. It drives fgf24 in fin-field mesenchyme and the
    antero-posterior convergence of lateral plate mesoderm cells. Loss abolishes the fin.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0060174
    label: limb bud formation
  - id: GO:0033339
    label: pectoral fin development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12223419
    supporting_text: >-
      Homozygous mutant embryos never develop pectoral fin buds and do not express several markers of early fin
      differentiation.
  - reference_id: PMID:12066188
    supporting_text: >-
      Functional knockdown of zebrafish tbx5 through the use of an antisense oligonucleotide resulted in a failure
      to initiate fin bud formation, leading to the complete loss of pectoral fins.
  - reference_id: PMID:33416493
    supporting_text: 100% (43/43) of the tbx5a F0 larvae did not develop pectoral fins (Figure 4A).
  - reference_id: PMID:34756968
    supporting_text: >-
      In both tbx5a −/− mutants and Tbx5a knock-down embryos, AP convergence of the fin field cells fails to occur;
      however these same precursors exhibit a robust ML movement that is similar in migration dynamics to that of
      wt embryos.
  - reference_id: PMID:24759614
    supporting_text: >-
      Taken together, we show that pectoral fin development has a different requirement for each of the tbx5 paralogues:
      tbx5a function is required for the earliest steps of initiation of fin outgrowth, whereas tbx5b functions
      later to ensure properly timed and sustained fin outgrowth.
- description: >-
    Cardiac looping and chamber/AV-canal patterning (with tbx5b, non-redundantly), including restriction of tbx2b
    to the AV boundary and specification of the proepicardium.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0001947
    label: heart looping
  - id: GO:0003206
    label: cardiac chamber morphogenesis
  - id: GO:0003342
    label: proepicardium development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12223419
    supporting_text: >-
      However, the heart fails to loop and then progressively deteriorates, a process affecting the ventricle as
      well as the atrium.
  - reference_id: PMID:34372968
    supporting_text: >-
      Hence, the ventricle and the atrium undergo asymmetric rotational movements around the atrioventricular canal,
      effectively transmitting a twisting transformation to the heart tube, a process which we show to be defective
      in tbx5a-/- zebrafish mutants.
  - reference_id: PMID:34372968
    supporting_text: >-
      In the zebrafish oug mutant, the absence of Tbx5a results in the expansion of the AV canal as illustrated
      by expanded domains of expression of tbx2b, bmp4, and has2
  - reference_id: PMID:20413782
    supporting_text: We further show that tbx5a mutants also have severe defects in PE specification.
  - reference_id: PMID:23441045
    supporting_text: >-
      Because tbx5a hypomorphic mutations are embryonic lethal, tbx5a and tbx5b functions in the heart must not
      be completely redundant.
suggested_questions:
- question: >-
    Does heart jogging need tbx5a? Morphants show jogging defects, but hst and the T-box-truncating oug allele jog
    normally. Is this a morpholino artefact, or transcriptional adaptation in PTC alleles?
- question: >-
    Why can tbx5b mRNA not rescue tbx5a loss (and the reverse)? Is the block in the divergent C-terminal region,
    in the T-box (83% identity), or in dose and timing?
- question: >-
    Should the ZFIN IPI annotation to GO:0061629 (TF binding, partner Kctd10) move to kctd10, which binds the transcription
    factor?
suggested_experiments:
- hypothesis: The paralogs differ at the protein level, not only in expression.
  description: >-
    Swap the tbx5b coding sequence into the tbx5a locus (knock-in) and score fin bud initiation and heart looping.
    Compare with a tbx5a-into-tbx5a knock-in control.
  experiment_type: cross-rescue by coding-sequence swap
- hypothesis: Normal jogging in tbx5a nonsense alleles reflects genetic compensation.
  description: >-
    Make a promoter-less (RNA-less) tbx5a allele, score jogging, and measure tbx5b and tbx3/tbx2 expression in hst,
    oug and RNA-less mutants.
  experiment_type: genetic compensation test
