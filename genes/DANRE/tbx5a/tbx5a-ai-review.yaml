    summary: NOT swim bladder development (negated).
    action: ACCEPT
    reason: >-
      This NOT annotation asserts that tbx5a (with tbx5b) is not required to form the swim bladder. hst mutants
      and tbx5a/tbx5b single and double morphants form swim bladders, unlike the Tbx5 requirement for lung specification
      in mouse and Xenopus (PMID:30352852). Accepted as a negative result. tbx5b mutants fail to inflate the swim
      bladder, but that is a later event, likely secondary to heart failure (PMID:30532148). It does not contradict
      this NOT.
    supported_by:
