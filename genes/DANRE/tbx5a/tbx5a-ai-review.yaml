    action: ACCEPT
    reason: >-
      tbx5a carries a complete T-box DNA-binding domain (UniProt residues 62-237). Tbx5 binds the conserved T-box
      element of the tbx2b atrioventricular canal enhancer in EMSA, and that site is needed for the enhancer to
      work in zebrafish transgenics (PMID:18347092). The IBA node (PTN004251338) covers the Tbx2/3/4/5 subfamily,
      and nothing suggests loss of DNA binding in either zebrafish copy. Core molecular function, shared with tbx5b.
    supported_by:
    - reference_id: PMID:18347092
      supporting_text: >-
