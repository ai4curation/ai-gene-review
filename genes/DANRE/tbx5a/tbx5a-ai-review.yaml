gene_symbol: tbx5a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  T-box transcription factor TBX5-A (heartstrings), one of two zebrafish co-orthologs of human TBX5 retained from
  the teleost genome duplication (paralog tbx5b). A nuclear, sequence-specific DNA-binding transcription factor
  with a T-box domain. It binds T-box elements and activates targets including tbx2b at the atrioventricular boundary,
  fgf24/fgf10 in the fin field and ndrg4 in the heart tube. A cytoplasmic pool is held on actin by the LIM protein
  Pdlim7, and its activity is repressed by Kctd10. It is expressed in the heart field and heart (both chambers;
  trabecular myocardium in adults), the pectoral fin field of the lateral plate mesoderm, and the dorsal retina.
  tbx5a is essential for pectoral fin bud initiation: it drives fgf24 and the antero-posterior convergence of fin-field
  cells, and loss of function abolishes the pectoral fin. It is needed for cardiac looping and chamber and AV canal
  patterning, for proepicardium specification, and for adult heart regeneration. Together with tbx5b it contributes
  to dorsoventral patterning of the retina and to heart looping. The two paralogs are not interchangeable: each
  is required, and injected mRNA of one does not rescue loss of the other.
