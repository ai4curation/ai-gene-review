- term:
    id: GO:0003146
    label: heart jogging
  evidence_type: IGI
  original_reference_id: PMID:24759614
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-060328-2
  - ZFIN:ZDB-MRPHLNO-130123-3
  review:
    summary: Heart jogging (IGI, tbx5a + tbx5b double morphants).
    action: UNDECIDED
    reason: >-
      Jogging defects in tbx5a loss have been reported only with morpholinos (PMID:24759614). The mutants do not
      show them. heartstrings mutants jog normally (PMID:24759614, PMID:30532148). Pi-Roig et al. argued that hst
      is hypomorphic for laterality. However, the oug allele truncates Tbx5a inside the T-box and loses about 75%
      of the protein, and it also has "cardiac jogging unaffected while cardiac looping was compromised" (PMID:34372968).
      So the most null-like mutant contradicts the morphant result. This could be a morpholino off-target effect,
      or transcriptional adaptation in the mutants. Left undecided rather than removed, pending a mutant test that
      excludes genetic compensation (for example a promoter-less allele).
    supported_by:
    - reference_id: PMID:24759614
      supporting_text: >-
        The cardiac phenotypes caused by tbx5a and/or tbx5b knock-down (namely cardiac jogging and looping orientation
        defects) demonstrate that tbx5 genes are required to direct both asymmetric events the zebrafish heart undergoes
    - reference_id: PMID:24759614
      supporting_text: >-
        We have ourselves analysed heart tube jogging in hst mutants (n = 38) and all of them displayed a normal
        left-jog as visualized by myl7 expression in 26 hpf embryos (figure 3c,d).
    - reference_id: PMID:34372968
      supporting_text: >-
        In such a screen we identified the oudegracht (oug) mutant in which cardiac jogging was unaffected while
        cardiac looping was compromised.
    - reference_id: PMID:34372968
      supporting_text: >-
        Indeed, in oug approximately 75% of the gene product is lost, including a large portion of the DNA-binding
        T-box domain.
