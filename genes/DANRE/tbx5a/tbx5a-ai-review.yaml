- term:
    id: GO:0061629
    label: RNA polymerase II-specific DNA-binding transcription factor binding
  evidence_type: IPI
  original_reference_id: PMID:24430697
  qualifier: enables
  supporting_entities:
  - ZFIN:ZDB-GENE-040426-2843
  review:
    summary: >-
      RNA polymerase II-specific DNA-binding transcription factor binding (IPI with Kctd10).
    action: UNDECIDED
    reason: >-
      The partner named in WITH/FROM is Kctd10, and the cached abstract says Kctd10 binds Tbx5 to repress it (PMID:24430697).
      The term asserts that tbx5a binds a DNA-binding transcription factor. Kctd10 is a BTB/KCTD-domain protein,
      not a DNA-binding TF, so the term seems to belong on kctd10 (which binds the TF Tbx5a) rather than on tbx5a.
      Only the abstract is cached, so this is left undecided, not removed.
    supported_by:
    - reference_id: PMID:24430697
      supporting_text: >-
        We show that Kctd10 directly binds to Tbx5 to repress its transcriptional activity.
