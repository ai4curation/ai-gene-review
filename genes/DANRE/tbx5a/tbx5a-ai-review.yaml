  review:
    summary: Cell fate specification (IBA, T-box family node).
    action: KEEP_AS_NON_CORE
    reason: >-
      Fate specification is a deep, family-wide T-box function. In zebrafish, tbx5a is needed for proepicardium
      specification (PMID:20413782) and for specification of late-added cardiac cells from the anterior LPM (PMID:33482174).
      This is correct but broad, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:20413782
      supporting_text: We further show that tbx5a mutants also have severe defects in PE specification.
    - reference_id: PMID:33482174
      supporting_text: >-
        our present data also implicate tbx5a function in cell specification, establishment and maintenance of cardiac
        left-right asymmetry.
