- term:
    id: GO:0003218
    label: cardiac left ventricle formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:102541
  - PANTHER:PTN002601200
  - UniProtKB:Q9PWE8
  review:
    summary: Cardiac left ventricle formation (IBA).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PAINT node (PTN002601200) comes from mouse Tbx5, which is needed to form the left ventricle. Zebrafish
      has a single ventricle and no left/right ventricle split. In tbx5a mutants a ventricle forms, and the heart
      tube is normal until looping (PMID:12223419). The ancestral function, patterning the chambers, is inherited,
      but a left-ventricle term does not apply to a teleost heart. The same action is taken for tbx5b.
    supported_by:
    - reference_id: PMID:12223419
      supporting_text: >-
        However, the heart fails to loop and then progressively deteriorates, a process affecting the ventricle
        as well as the atrium.
    - reference_id: PMID:29382818
      supporting_text: >-
        Here we find, using genetic tbx5a lineage tracing tools, that the ventricular myocardium in the adult zebrafish
        is mainly derived from tbx5a+ cells, with a small contribution from tbx5a- SHF progenitors.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002601200
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The Tbx5-clade node is sound for amniote hearts, which have a left ventricle; teleost hearts have a single
          ventricle, so the left-ventricle-specific term does not apply to the zebrafish descendants.
      - source_id: MGI:MGI:102541
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mouse experimental evidence for left ventricle formation; the anatomy is absent in zebrafish.
