        their labeled putative binding sites, and binding was efficiently competed with excess unlabeled cognate
        competitors, but not with mutated oligonucleotides
    - reference_id: PMID:18347092
      supporting_text: >-
        Thus, the putative Foxn4 and Tbx5 DNA-binding sites are required for the precise control of this highly
        conserved tbx2b enhancer during AV canal development.
