- term:
    id: GO:0097009
    label: energy homeostasis
  evidence_type: IMP
  original_reference_id: PMID:33408126
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-211028-10
  review:
    summary: Energy homeostasis (acts upstream of or within), IMP, from an slc7a10b loss-of-function zebrafish line that
      gained more weight and had larger visceral adipocytes than wild type when overfed.
    action: KEEP_AS_NON_CORE
    reason: 'The phenotype is real and specific to this copy: slc7a10b mutant fish overfed for two months gained more body
      weight and had larger visceral adipocytes, matching human and mouse data that adipocyte SLC7A10 limits lipid storage.
      The transporter acts upstream of this outcome through adipocyte amino acid (serine) uptake, glutathione and ROS, so
      energy homeostasis is a downstream, organism-level consequence rather than the function of the protein. The authors
      chose slc7a10b for its slightly higher identity to human SLC7A10, not for its expression, and call the line a partial
      knockout because slc7a10a remains; the paralog was not examined. Only the abstract of the primary paper is cached,
      so allele details were read from the same group''s review.'
    supported_by:
    - reference_id: PMID:33408126
      supporting_text: Concordantly, loss of Slc7a10 function in zebrafish in vivo accelerates diet-induced body weight
        gain and adipocyte enlargement.
    - reference_id: PMID:36172277
      supporting_text: Compared to wildtypes, the fish with impaired Slc7a10b function gained 38% more body weight and had
        on average 49% larger visceral adipocytes
    - reference_id: PMID:36172277
      supporting_text: Because two isoforms of Slc7a10 exist in zebrafish (Slc7a10a as well as Slc7a10b), this model should
        be considered a partial global knockout of Slc7a10.
    - reference_id: PMID:33408126
      supporting_text: Mechanistically, SLC7A10 inhibition in human and murine adipocytes decreases adipocyte serine uptake
        and total glutathione levels and promotes reactive oxygen species (ROS) generation.
