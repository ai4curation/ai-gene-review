core_functions:
- description: Light subunit of an Asc-1-type heterodimeric amino acid transporter (predicted to pair with a 4F2hc/slc3a2
    heavy chain) that exchanges small neutral L- and D-amino acids (glycine, L-alanine, L-serine, D-serine) across the plasma
    membrane. All tested Asc-1 functional residues are conserved; the activity is inferred from orthology, not measured
    for the zebrafish protein.
  molecular_function:
    id: GO:0015175
    label: neutral L-amino acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:0042942
    label: D-serine transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10734121
    supporting_text: Asc-1 preferred small neutral amino acids such as Gly, L-Ala, L-Ser, L-Thr, and L-Cys, and alpha-aminoisobutyric
      acid as substrates.
  - reference_id: PMID:38589439
    supporting_text: The HAT-specific disulfide bond is found between Cys154 of Asc-1 and Cys211 of 4F2hc
  - reference_id: file:DANRE/slc7a10a/slc7a10a-bioinformatics/RESULTS.md
    supporting_text: No copy has lost a known substrate-site, gating or heavy-chain-linking residue.
suggested_questions:
- question: Is the adipose phenotype of slc7a10b mutants specific to this copy, or would slc7a10a or double mutants show
    the same or a stronger effect? Which copy is expressed in zebrafish adipocytes?
- question: Is slc7a10b transcriptionally upregulated or slc7a10a compensating in the slc7a10b mutant line?
- question: Does slc7a10b, like gar SLC7A10, keep the ancestral neural (brain, eye) and gonadal expression, with slc7a10a
    having gained peripheral tissues?
suggested_experiments:
- hypothesis: slc7a10a and slc7a10b differ in adipose expression and contribute unequally to lipid storage.
  description: Paralog-specific HCR in situ or qPCR in sorted zebrafish adipocytes; overfeeding assay on slc7a10a, slc7a10b
    and double mutants.
  experiment_type: knockout phenotyping
- hypothesis: Slc7a10b is an Asc-type exchanger with the same substrate profile as mammalian Asc-1.
  description: Co-express Slc7a10b with zebrafish slc3a2a in Xenopus oocytes and measure glycine, L-serine and D-serine
    uptake and exchange, side by side with Slc7a10a.
  experiment_type: transport assay
