taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: slc7a10b (solute carrier family 7 member 10b) is one of two zebrafish co-orthologs of vertebrate SLC7A10 (Asc-1),
  retained from the teleost-specific genome duplication; its paralog is slc7a10a. It encodes a 12-helix light subunit of
  the heterodimeric amino acid transporters. In mammals Asc-1 is disulfide-linked to the heavy chain 4F2hc (SLC3A2) and
  mediates sodium-independent exchange of small neutral amino acids, including glycine, L-serine, L-alanine and D-serine;
  it supplies glycine for inhibitory synapses, regulates D-serine levels, and in adipocytes supports serine uptake and limits
  lipid storage. slc7a10b keeps every Asc-1 residue shown to matter for substrate binding and gating and the cysteine that
  links the heavy chain. It is expressed at low levels, from the blastula stage onward in embryos, and in adult brain, eye,
  bone and testis, and in zebrafish arachnoid meningeal cells. Zebrafish carrying a slc7a10b loss-of-function allele gain
  more weight and have larger visceral adipocytes than wild type when overfed.
