gene_symbol: abi1a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: abi1a (abl-interactor 1a) is one of two zebrafish co-orthologs of vertebrate ABI1, retained from the
  teleost-specific genome duplication; its paralog is abi1b. It encodes an ABI-family adaptor with an N-terminal
  WAVE-binding and coiled-coil region, a central proline-rich disordered region and a C-terminal SH3 domain. In
  mammals ABI1 is a core subunit of the WAVE regulatory complex (SCAR complex), which it assembles and activates to
  drive Arp2/3-dependent actin polymerization in lamellipodia, and its SH3 domain binds Abl kinases and other
  signalling partners. The zebrafish protein conserves the WAVE-binding N-terminus, the coiled-coil domain and the
  SH3 domain. abi1a is expressed at low levels maternally and becomes the predominant ABI1 copy from mid-gastrulation
  onward, with broad expression across larval and adult tissues. A mosaic F0 CRISPR knockdown did not disturb heart
  development; no other functional data exist for this copy.
