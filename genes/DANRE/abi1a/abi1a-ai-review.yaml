    label: neuron migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:106913
  - PANTHER:PTN000825624
  - WB:WBGene00015146
  review:
    summary: Neuron migration propagated from PANTHER node PTN000825624, seeded by mouse Abi2 (MGI:106913) and a
      C. elegans ABI member.
    action: KEEP_AS_NON_CORE
    reason: The mouse evidence is for Abi2, whose knockout disturbs neuronal migration in neocortex and hippocampus.
      WAVE-complex-driven protrusion is a plausible general contributor to neuronal migration, and both zebrafish
      copies descend from the node, so the IBA is not wrong. It is not a core function of ABI1 (whose mouse knockout
      phenotype is embryonic heart and brain malformation), and nothing in zebrafish tests it. Kept as non-core; the
      same action is applied to abi1b.
    supported_by:
    - reference_id: PMID:15572692
      supporting_text: Loss of Abi2 also resulted in cell migration defects in the neocortex and hippocampus, abnormal
        dendritic spine morphology and density, and severe deficits in short- and long-term memory.
    - reference_id: PMID:21482783
      supporting_text: Thus, Abi1-signaling events are not required for gastrulation but are critical during brain and
        heart development.
