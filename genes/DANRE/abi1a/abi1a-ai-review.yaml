suggested_questions:
- question: Does the maternal/early (abi1b) versus zygotic (abi1a) temporal split reflect a partition of an ancestral
    ABI1 expression profile, and is gar ABI1 maternally loaded?
- question: Does abi1b upregulate, or compensate, in stable abi1a mutants (PTC versus promoter-less alleles), as the
    CRISPR F0 study speculated?
- question: Do abi1a and abi1b assemble into the same WAVE complexes (with wasf2, nckap1, cyfip1) in zebrafish tissues
    where both are expressed?
suggested_experiments:
- hypothesis: abi1a and abi1b are redundant for WAVE-complex function but partitioned in time.
  description: Generate stable abi1a and abi1b mutants (including maternal-zygotic abi1b) and double mutants; score
    gastrulation cell migration, heart looping and WAVE-complex protein stability (Wasf2, Nckap1 levels).
  experiment_type: genetic interaction
- hypothesis: The two proteins are interchangeable.
  description: Rescue abi1a mutant (or double mutant) phenotypes with abi1a versus abi1b coding sequence.
  experiment_type: cross-rescue
