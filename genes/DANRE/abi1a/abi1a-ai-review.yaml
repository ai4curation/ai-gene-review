  review:
    summary: Membership of the SCAR/WAVE regulatory complex, propagated from the ABI family node (fly, mouse, human,
      Dictyostelium donors).
    action: ACCEPT
    reason: This is the defining function of ABI proteins. ABI1 binds the WAVE WHD domain and assembles the
      pentameric complex, and in the crystal structure the Abi N-terminal helices form a four-helix bundle with WAVE
      and HSPC300. The WAVE-binding N-terminus is 95% identical between human ABI1 and abi1a, and the coiled-coil
      domain is fully identical, so the zebrafish copy retains the complex-forming surface.
    supported_by:
    - reference_id: PMID:15048123
      supporting_text: Abi1 interacts directly with the WHD domain of WAVE2, increases WAVE2 actin polymerization activity
        and mediates the assembly of a WAVE2-Abi1-Nap1-PIR121 complex.
    - reference_id: PMID:21107423
      supporting_text: A long four-helix bundle created by a helix from HSPC300 (residues 14-68), two helices from Abi2
        (residues 1-39 and 43-112) and a helix from WAVE1 (residues 26-81) contacts Sra1 extensively
    - reference_id: file:DANRE/abi1a/abi1a-bioinformatics/RESULTS.md
      supporting_text: The N-terminal WAVE-binding region, the coiled-coil domain and the SH3 domain are conserved in
        both copies
- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:104913
  - PANTHER:PTN000048906
  - UniProtKB:Q8IZP0
  - UniProtKB:Q9NYB9
  review:
    summary: Signaling adaptor activity propagated from mouse Abi1 and human ABI1/ABI2.
    action: ACCEPT
    reason: ABI1 has no enzymatic activity; it bridges upstream signalling proteins (Abl kinases via its SH3 domain,
      membrane receptors through the WIRS-binding surface it forms with Sra1) to the WAVE complex and Arp2/3-driven
      actin assembly. Signaling adaptor activity is the most informative molecular function available and matches
      the conserved domain architecture of abi1a.
    supported_by:
    - reference_id: PMID:7590237
      supporting_text: The protein exhibits sequence similarity to homeotic genes, contains several polyproline stretches,
        and includes a src homology 3 (SH3) domain at its very carboxyl terminus that is required for binding to Abl
        proteins.
    - reference_id: PMID:24439376
      supporting_text: Structural, biochemical, and cellular studies reveal that a sequence motif that defines these
        ligands binds to a highly conserved interaction surface of the WRC formed by the Sra and Abi subunits.
