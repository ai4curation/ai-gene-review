core_functions:
- description: Adaptor subunit of the WAVE regulatory (SCAR) complex that couples upstream signals to Arp2/3-dependent
    actin polymerization at the lamellipodial leading edge; inferred from mammalian ABI1 and the conserved WAVE-binding
    N-terminus and SH3 domain. Molecular function shared with abi1b.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
