suggested_questions:
- question: Does zebrafish Ucp2 reconstituted in liposomes catalyse the same 
    C4-metabolite/phosphate/proton exchange as human UCP2, and at what rate relative to free proton 
    conductance?
- question: Which zebrafish paralog (ucp2 or the teleost-specific ucp2l) accounts for the 
    cold-induced uncoupling-protein signal in brain, and do ucp2 mutants show altered mitochondrial 
    membrane potential or ROS?
suggested_experiments:
- description: Purify zebrafish Ucp2 and reconstitute into proteoliposomes to measure 
    malate/oxaloacetate/aspartate-for-phosphate exchange and proton conductance side by side.
  hypothesis: Zebrafish Ucp2 is a dicarboxylate/phosphate antiporter whose proton flux is coupled to
    metabolite exchange rather than a free leak.
- description: Generate ucp2 loss-of-function zebrafish and measure mitochondrial membrane 
    potential, oxygen consumption (respirometry/Seahorse) and ROS in brain and liver at normal and 
    cold temperatures.
  hypothesis: Loss of ucp2 raises membrane potential and ROS and impairs the metabolic adjustment to
    cold, without a thermogenic deficit.
