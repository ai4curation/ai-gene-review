      exposure, while ucp1 is unchanged.
    supporting_text: expression of zucp2 increased significantly by about 3-fold at 6 and 24 h of 
      cold exposure compared to control group.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; title verified. Direct zebrafish evidence for cold induction of 
      zucp2, supporting the response-to-cold row as an induction phenomenon.
