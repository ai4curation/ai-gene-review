taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'ucp2 (slc25a8) encodes the zebrafish uncoupling protein 2, a six-transmembrane member of
  the SLC25 mitochondrial carrier family embedded in the inner mitochondrial membrane. It exports four-carbon
  dicarboxylates of the Krebs cycle (malate, oxaloacetate, malonate) and aspartate from the matrix in
  exchange for phosphate plus a proton, and can also mediate inducible proton entry into the matrix; by
  limiting oxidation of acetyl-CoA-generating substrates and lowering membrane potential it shapes fuel
  selection, ATP/ADP ratio and reactive oxygen species production. Fatty acids activate and purine nucleotides
  inhibit its proton currents. It is expressed widely, including brain and sperm, and its transcript and
  protein rise on cold exposure. Unlike the thermogenic UCP1 of placental mammals, UCP2 in these ectothermic
  fish is not a heat-producing uncoupler.'
