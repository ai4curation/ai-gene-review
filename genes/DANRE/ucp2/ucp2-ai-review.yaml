      of fish UCP2 concluded it is unlikely to be thermogenic.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Stuart et al. sequenced this very protein from zebrafish and carp and argued explicitly that,
      because these fish do not raise body temperature by producing excess heat, UCP2 must have functions
      unrelated to thermogenesis (PMID:10524261). The UniProt heat-dissipation sentence is a By-similarity
      family statement, not a zebrafish observation. The node placement is therefore too deep: adaptive
      thermogenesis belongs to the UCP1 branch, not to the whole family.'
