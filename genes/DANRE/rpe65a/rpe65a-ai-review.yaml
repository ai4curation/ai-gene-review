- term:
    id: GO:0003834
    label: beta-carotene 15,15'-dioxygenase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: PAINT node PTN000830314 is a deep carotenoid-oxygenase family node seeded by BCO1 
      orthologs (mouse Bcmo1, rat Bco1, human BCO1, chicken BCO1); the RPE65 clade descends from it 
      and so inherits beta-carotene 15,15'-dioxygenase activity (all-trans-beta-carotene + O2 -> 2 
      all-trans-retinal).
    action: REMOVE
    reason: 'The RPE65 lineage diverged from the oxygenases: its primary chemistry is O-alkyl cleavage
      of a retinyl ester coupled to trans-cis isomerization, with no O2 incorporation, whereas carotenoid
      oxygenation is the chemistry of NinaB/BCO1 (PMID:38355721). The node placement therefore over-reaches
      for the RPE65 subclade, which shows lineage-specific loss of the dioxygenase reaction even though
      it keeps the Fe(II) center. No RPE65 ortholog has been shown to cleave beta-carotene, and the zebrafish
      enzyme is annotated by UniProt only with EC 3.1.1.64 and the lutein isomerase reaction. Removed
      as an over-propagated family inference; this does not touch the BCO1 annotations.'
    supported_by:
    - reference_id: PMID:38355721
      supporting_text: two homologous enzymes catalyzing distinct primary chemistry on disparate 
        substrates—retinyl ester hydrolysis in the case of RPE65 and carotenoid oxygenation in the 
        case of NinaB—both possess the ability to catalyze trans–cis isomerization at a C11–C12 
        retinoid/carotenoid double bond
    - reference_id: file:DANRE/rpe65a/rpe65a-uniprot.txt
      supporting_text: Reaction=an all-trans-retinyl ester + H2O = 11-cis-retinol + a fatty acid + 
        H(+); Xref=Rhea:RHEA:31771
