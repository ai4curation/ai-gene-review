core_functions:
- description: 'Fe(II)-dependent retinoid isomerohydrolase of the RPE visual cycle: hydrolyses membrane-stored
    all-trans-retinyl (palmitate) esters with coupled trans-cis isomerization to yield 11-cis-retinol,
    the precursor of the 11-cis-retinal chromophore (EC 3.1.1.64). Activity is inferred from RPE65 orthologs
    and from the loss of ocular 11-cis-retinal and rod outer-segment integrity in rpe65a morphants; the
    zebrafish enzyme has not been assayed in vitro.'
