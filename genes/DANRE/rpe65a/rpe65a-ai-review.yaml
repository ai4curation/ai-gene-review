- id: file:DANRE/rpe65a/rpe65a-deep-research-falcon.md
  title: Falcon deep research report for Danio rerio rpe65a (Q6PBW5)
  findings:
  - statement: 'Falcon confirms gene identity: zebrafish has two RPE65 paralogs and rpe65a is the ocular,

      RPE-expressed visual-cycle isomerohydrolase (Q6PBW5), whereas rpe65b is extra-ocular.'
    reference_section_type: OTHER
    supporting_text: only one paralog, RPE65a, is expressed in the zebrafish eye (in the RPE)
  - statement: 'Falcon establishes the core molecular function: Rpe65a is the retinoid isomerohydrolase
      of the

      canonical RPE visual cycle, converting all-trans-retinyl esters to 11-cis-retinol plus a fatty acid,

      enabling regeneration of 11-cis-retinal chromophore for opsins.'
    reference_section_type: OTHER
    supporting_text: Rpe65a is the **retinoid isomerohydrolase** of the canonical RPE visual cycle 
      that converts **all-trans-retinyl esters → 11-cis-retinol + fatty acid**, enabling 
      regeneration of **11-cis-retinal** chromophore for opsins.
  - statement: 'Falcon supports that the direct substrate is membrane-associated all-trans-retinyl ester
      (not free

      retinol) and that the iron cofactor functions as a Lewis acid for O-alkyl cleavage and isomerization,

