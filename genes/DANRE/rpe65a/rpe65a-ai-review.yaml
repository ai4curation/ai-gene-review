    label: retinol isomerase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: GO:0050251 is defined as all-trans-retinol = 11-cis-retinol, i.e. isomerization of free
      retinol. PAINT placed it at the RPE65 subclade node PTN002576077 on the strength of a single 
      ZFIN experimental annotation to the other zebrafish RPE65 paralog (Rpe65c, the Muller-cell 
      isomerohydrolase; PMID:21676174).
    action: MODIFY
    reason: 'RPE65-family enzymes, including zebrafish Rpe65c in the source paper, act on all-trans-retinyl
      esters and release 11-cis-retinol; free all-trans-retinol is not their substrate (PMID:38355721:
      retinyl ester hydrolysis is the primary chemistry of RPE65). The isomerization the term is reaching
      for is the coupled isomerohydrolase reaction already captured by GO:0052885, which should replace
      this less accurate term; the rpe65c source data are sound but were mapped to a term whose substrate
      is wrong.'
