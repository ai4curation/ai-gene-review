id: Q6PBW5
gene_symbol: rpe65a
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'rpe65a encodes retinoid isomerohydrolase RPE65a, one of three zebrafish RPE65 paralogs and
  the one expressed in the retinal pigment epithelium (rpe65b is extra-ocular; rpe65c is expressed in
  retinal Muller glia). It is an Fe(II)-dependent member of the carotenoid-oxygenase fold family that,
  unlike its BCO1/NinaB relatives, does not use O2: it cleaves the O-alkyl bond of membrane-stored all-trans-retinyl
  esters and couples the cleavage to trans-cis isomerization, releasing 11-cis-retinol (EC 3.1.1.64),
  which is oxidized to the 11-cis-retinal chromophore of rod and cone visual pigments. The protein cycles
  between a soluble cytoplasmic form and a palmitoylated, membrane-anchored form. Mammalian RPE65 additionally
  isomerizes lutein to meso-zeaxanthin. In zebrafish, rpe65a is expressed in the pineal gland from 16
  hpf and in the RPE from 40 hpf; morpholino knockdown lowers ocular 11-cis-retinal and disrupts rod outer
  segments, while cone vision persists because larval cones can be supplied through an RPE65-independent,
  Muller-cell visual cycle.'
