    label: retinal metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'PAINT node PTN000057192 (carotenoid oxygenase family: Drosophila ninaB, mouse Bco1/Bco2/Rpe65,
      human BCO1) asserts retinal metabolism. Rpe65a produces the 11-cis-retinol that is oxidized to the
      11-cis-retinal chromophore, and rpe65a knockdown lowers 11-cis-retinal in larval eyes (PMID:17868371).'
    action: ACCEPT
    reason: The gene product performs the isomerization step that generates the cis-retinoid 
      precursor of 11-cis-retinal; in vivo, morphants have reduced 11-cis-retinal and disorganized 
      rod outer segments, so the zebrafish protein sits inside the clade function. Accepted as the 
      core process.
    supported_by:
