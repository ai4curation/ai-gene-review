suggested_questions:
- question: Does zebrafish Rpe65a have measurable isomerohydrolase activity in vitro, and what is 
    its product specificity (11-cis vs 13-cis retinol) relative to the paralogs Rpe65c and 13cIMH, 
    given that only the paralogs have been assayed?
- question: Does Rpe65a, like mammalian RPE65, isomerize lutein to meso-zeaxanthin, and is 
    meso-zeaxanthin present in the zebrafish eye?
suggested_experiments:
- description: Express zebrafish rpe65a with LRAT in 293A cells and quantify 11-cis-retinol 
    formation from all-trans-retinyl palmitate by HPLC, alongside rpe65c and chicken RPE65 as 
    controls, to confirm the isomerohydrolase activity directly rather than by orthology.
- description: Generate a stable rpe65a null allele and profile ocular retinoids in dark-adapted 
    larvae and adults to separate rod (RPE65-dependent) from cone (Muller-cell) chromophore supply 
    without morpholino caveats.
