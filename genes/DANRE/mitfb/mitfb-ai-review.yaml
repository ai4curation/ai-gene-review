- term:
    id: GO:0030318
    label: melanocyte differentiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000000863
  - ZFIN:ZDB-GENE-010919-1
  - ZFIN:ZDB-GENE-990910-11
  review:
    summary: >-
      Inference from the MITF node (PTN000000863), which is ancestral to both zebrafish copies.
      The ancestral melanogenic function is real and the mitfb protein retains it, and in
      medaka the mitfb co-ortholog is the main melanophore regulator. In zebrafish, however,
      mitfb is not expressed in neural crest melanoblasts and mitfb null fish have normal
      melanophores, so the endogenous zebrafish contribution is small.
    action: KEEP_AS_NON_CORE
    reason: >-
      The node placement is sound (both copies inherit the ancestral function, and the protein
      keeps it), so the IBA is not removed. For zebrafish mitfb the process was partitioned away
      at the expression level, so it is not a core function of this copy.
    supported_by:
    - reference_id: PMID:11543618
      supporting_text: mitfb is coexpressed with mitfa in the RPE at an appropriate time to compensate for loss of mitfa function in the nacre mutant but is not expressed in neural crest melanoblasts
    - reference_id: PMID:37823232
      supporting_text: suggesting that mitfb, but not mitfa, plays the more central role in melanophore development in medaka
    - reference_id: PMID:40123122
      supporting_text: Only in zebrafish has one Mitf locus, mitfb, undergone a substantial, though not complete (Figure 5b) reduction in pigmentary function
