    supporting_text: These findings indicate that the redundant functions of Mitfa, Mitfb, and Tfec are not only essential for the specification of diverse pigment cell types but also critical for RPE pigmentation.
core_functions:
- description: >-
    mitfb is a MiT/TFE bHLH-LZ transcription factor that keeps the melanogenic
    DNA-binding transcription factor activity of the ancestral Mitf (it can replace mitfa in
    melanophores). Its endogenous zebrafish roles are partially redundant: with mitfa it
    supports xanthophore development, and with mitfa and tfec it supports RPE pigmentation.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0050936
    label: xanthophore differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11543618
    supporting_text: mitfb, but not a zebrafish ortholog of the closely related gene tfe3, can rescue neural crest melanophore development in nacre/mitfa mutant embryos when expressed via the mitfa promoter
  - reference_id: PMID:40123122
    supporting_text: These phenotypes suggest that mitfb partially compensates for the loss of mitfa (though not tfec) in xanthophores and especially so in the fins.
suggested_questions:
- question: >-
    What does mitfb do in the epiphysis and olfactory bulb, where it is expressed without
    mitfa? Is this expression ancestral (present in the spotted gar mitf or in tetrapod
    Mitf isoforms) or a zebrafish-lineage gain?
- question: >-
    Does the N-terminal (A/H-isoform-like) region of mitfb confer target specificity that
    differs from mitfa, or are the two proteins fully interchangeable at RPE and xanthophore
    targets as they are in melanophores?
- question: >-
    Are the mitfb nonsense alleles (hu3857, hu3561) subject to nonsense-mediated decay with
    transcriptional adaptation (e.g. upregulation of mitfa or tfec) that could mask a single
    mutant phenotype?
suggested_experiments:
- hypothesis: mitfb has a mitfa-independent role in the pineal gland (epiphysis) or olfactory bulb.
  description: >-
    Generate an RNA-less (promoter-deletion) mitfb allele to avoid transcriptional adaptation,
    and profile pineal and olfactory bulb gene expression (single-cell RNA-seq) in mitfb and
    mitfb;tfec mutants.
  experiment_type: genetic and genomics
- hypothesis: The spotted gar mitf expression pattern is the union of zebrafish mitfa and mitfb expression.
  description: >-
    In situ hybridization of gar mitf (all isoforms and isoform-specific probes) in embryos
    for neural crest melanoblasts, RPE, epiphysis and olfactory bulb, to test whether the
    zebrafish expression partition is ancestral subfunctionalization or includes gains.
  experiment_type: comparative expression
