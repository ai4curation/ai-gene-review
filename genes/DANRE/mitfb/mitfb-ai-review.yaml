gene_symbol: mitfb
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  mitfb encodes microphthalmia-associated transcription factor b, a basic helix-loop-helix
  leucine zipper (bHLH-LZ) transcription factor of the MiT/TFE family and the second zebrafish
  co-ortholog of human MITF, retained from the teleost genome duplication alongside mitfa. The
  500-residue protein has the MiT/TFE N-terminal region, a bHLH-LZ DNA-binding and
  dimerization domain and the MiT/TFE C-terminal region, with an N-terminal extension that
  resembles the RPE-type (A/H) isoforms of mammalian MITF rather than the melanocyte M
  isoform. mitfb is co-expressed with mitfa in the retinal pigment epithelium (RPE) and is
  also expressed in the epiphysis and olfactory bulb, but is not expressed in neural crest
  melanoblasts. The protein keeps the melanogenic activity of the family: expressed from the
  mitfa promoter it rescues neural crest melanophores in nacre/mitfa mutants. Endogenously,
  mitfb null fish have no obvious phenotype, mitfa;mitfb double mutants still have a normal
  RPE (RPE pigmentation requires mitfa, mitfb and tfec together), and loss of mitfb enhances the
  xanthophore deficit of mitfa mutants, most clearly in adult fins. mitfb therefore acts mainly
  as a partially redundant MiT factor in zebrafish; in medaka the mitfb co-ortholog has
  the more central role in melanophore development.
