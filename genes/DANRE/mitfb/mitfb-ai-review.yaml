- term:
    id: GO:0050936
    label: xanthophore differentiation
  evidence_type: IGI
  original_reference_id: PMID:37823232
  review:
    summary: >-
      NEW (proposed). Loss of mitfb in a mitfa mutant background reduces xanthophores beyond
      the mitfa single mutant, found independently by two groups (CRISPR bHLH-domain allele;
      premature-termination allele), with the strongest effect in adult fin xanthophores.
    action: NEW
    reason: >-
      Participation: MiT factors directly activate xanthophore pigment-synthesis genes (gch2)
      in this lineage, so mitfb acts as a partially redundant transcription factor there, not
      merely as a prerequisite. The evidence comes from double mutants, so the same term is
      proposed for mitfa.
    supported_by:
    - reference_id: PMID:37823232
      supporting_text: Compared with a single mitfa mutant, mitfa−/−; mitfb−/− double mutants showed a slightly more severe reduction of xanthophores, with fewer fluorescent xanthophores on the trunk
    - reference_id: PMID:40123122
      supporting_text: These phenotypes suggest that mitfb partially compensates for the loss of mitfa (though not tfec) in xanthophores and especially so in the fins.
