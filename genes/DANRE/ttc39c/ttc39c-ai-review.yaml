  label: Danio rerio
description: >-
  Tetratricopeptide repeat protein 39C is a 579-residue TPR protein of the TTC39/IML2 family (PANTHER
  PTHR31859, subfamily SF1). It has three TPR repeats inside an Iml2-TPR_39 domain and no catalytic or
  transmembrane features. Its molecular activity is unknown. In zebrafish embryos, morpholino
  knockdown of ttc39c reduces the number and length of Kupffer's vesicle cilia and leaves pronephric
  motile cilia disorganized and largely immotile. The morphants show ciliopathy-like phenotypes:
  curved body axis, abnormal otoliths and randomized heart-tube orientation. The body curvature is
  rescued by morpholino-resistant ttc39c mRNA. These results place ttc39c in cilium assembly and
  possibly cilium motility. The mammalian ortholog associates weakly with IFT-A subunits IFT144 and
  IFT139, which suggests, but does not establish, a link to intraflagellar transport. All in vivo
  evidence comes from morpholino knockdown; the protein's subcellular localization in zebrafish has
  not been determined.
