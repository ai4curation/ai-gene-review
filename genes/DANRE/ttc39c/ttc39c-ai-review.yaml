suggested_questions:
- question: Is the pronephric cilia paralysis in ttc39c morphants a primary motility defect (for example loss
    of axonemal dynein arms) or a secondary consequence of defective cilium assembly?
- question: Does TTC39C localize to cilia, basal bodies or the cytoplasm in multiciliated cells, given that
    the available antibody failed in immunostaining?
- question: Do stable ttc39c mutants reproduce the morphant ciliary phenotypes, or does genetic compensation
    or morpholino toxicity contribute to them?
suggested_experiments:
- hypothesis: Ttc39c is required for ciliogenesis in zebrafish independently of morpholino artefacts.
  description: Generate stable ttc39c (and maternal-zygotic) CRISPR mutants. Score Kupffer's vesicle cilium
    number and length, pronephric ciliary beat and otolith and heart laterality, and rescue with ttc39c mRNA.
  experiment_type: genetic knockout
- hypothesis: TTC39C acts with IFT-A or in axonemal dynein arm assembly.
  description: Tag endogenous ttc39c (knock-in) to localize it in ciliated tissues. Perform proximity
    labelling or affinity purification, then examine dynein arm components (DNAH/DNAI) by TEM and
    immunofluorescence in mutant pronephric cilia.
  experiment_type: localization and interaction proteomics
