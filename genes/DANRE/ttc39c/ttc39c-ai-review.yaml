  review:
    summary: >-
      No data annotation: the cellular location of zebrafish ttc39c has not been determined.
    action: ACCEPT
    reason: >-
      A PubMed search (ttc39c OR TTC39C, 17 hits, 2026-10-21) found no study localizing zebrafish ttc39c.
      In the only cilia study, the TTC39C antibody did not work for immunostaining in mouse
      multiciliated cells, while the other ciliary TTC proteins were seen in axonemes [PMID:25860617].
      A GFP fusion of mouse Ttc39c overexpressed in cultured muscle cells was cytoplasmic
      [PMID:31188487]. That is overexpression in another species, so it is not a basis for a zebrafish
      location annotation. The ND correctly records the absence of data.
    supported_by:
    - reference_id: PMID:25860617
      supporting_text: As to TTC39c, we were not sure of its subcellular localization because the antibody
        did not work for immunostaining.
    - reference_id: PMID:31188487
      supporting_text: Tct39c localizes exclusively to the
        cytoplasm of cultured cells
- term:
    id: GO:0032474
    label: otolith morphogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002840059
  - ZFIN:ZDB-GENE-050522-194
  review:
    summary: >-
      PAINT IBD at the Euteleostomi node PTN002840059. Zebrafish ttc39c's own morphant otolith phenotype
      is the only seed.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT curator propagated this term only at a Euteleostomi node (PTN002840059), whereas cilium
      assembly sits at the deeper Eumetazoa node. The target is the seed, which is expected and not
      circular. Otolith formation needs motile cilia in the inner ear, so the morphant otolith defect is
      a downstream consequence of the ttc39c cilium defect. Ttc39c itself does none of the work of
      shaping the otolith [PMID:25860617]. The term is kept as a true but peripheral consequence of
      cilium function. It should not count as a core function, and transfer to other vertebrates should
      come through the cilium role. No evidence argues against the node placement, so this row is not
      removed.
    supported_by:
    - reference_id: PMID:25860617
      supporting_text: Since proper otolith formation requires cilia motility in the inner ear, defects in
        the inner ear motile cilia often lead to abnormal otoliths
    - reference_id: file:interpro/panther/PTHR31859/PTHR31859-paint.tsv
      supporting_text: PTN002840059
- term:
    id: GO:0032474
    label: otolith morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:25860617
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-150622-18
  review:
    summary: >-
      Over 75% of ttc39c morphants had abnormal otoliths at 72 hpf, compared with 0.4% of controls.
    action: KEEP_AS_NON_CORE
    reason: >-
      The phenotype is well documented, but it comes from a morpholino only, and the mRNA rescue was
      scored for body curvature, not for otoliths. Otolith defects are a standard readout of defective
      inner-ear motile cilia, so the term records a downstream organismal consequence of ttc39c's cilium
      role, not an activity of ttc39c. The acts_upstream_of_or_within qualifier fits this, and the term
      is kept as non-core.
    supported_by:
    - reference_id: PMID:25860617
      supporting_text: more than 75% of the morphants of ttc4, -9c, -36, and -39c developed abnormal otoliths
        at 72 hpf, whereas in the control morphants the incidence was only 0.4%
- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001275223
  - ZFIN:ZDB-GENE-050522-194
  review:
    summary: >-
      PAINT IBD at the Eumetazoa node PTN001275223 on the TTC39C branch. Zebrafish ttc39c's own IMP is
      the sole seed.
    action: ACCEPT
    reason: >-
      Ttc39c is in PANTHER subfamily PTHR31859:SF1 (TTC39C), the branch that carries this node. The
      paralogs TTC39A and TTC39B are separate subfamilies and do not get this IBA; TTC39B instead gets
      the mammalian lipid-homeostasis node seeded by mouse Ttc39b. So the curator confined cilium
      assembly to the TTC39C lineage. Zebrafish ttc39c appears in its own WITH/FROM because its
      experimental annotation grounds the node, which is expected and not circular. The IBA is
      consistent with the direct morphant data (fewer and shorter Kupffer's vesicle cilia) and is
      accepted.
    supported_by:
    - reference_id: file:interpro/panther/PTHR31859/PTHR31859-paint.tsv
      supporting_text: PTN001275223
    - reference_id: file:DANRE/ttc39c/ttc39c-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR31859:SF1; TETRATRICOPEPTIDE REPEAT PROTEIN 39C; 1.
