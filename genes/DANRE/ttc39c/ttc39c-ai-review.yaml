      supporting_text: both the number and length of the KV cilia were significantly reduced in the ttc morphants
- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:25860617
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-150622-18
  review:
    summary: >-
      Ttc39c morphants have fewer and shorter Kupffer's vesicle cilia and disorganized pronephric cilia.
    action: ACCEPT
    reason: >-
      This is the most proximal process the zebrafish data support. Knockdown reduced both the number
      and the length of the monocilia in Kupffer's vesicle at the 7-somite stage, and the authors
      conclude that ttc39c is critical for cilia formation. The morpholino was validated by a GFP
      reporter, and its body-curvature phenotype was rescued by MO-resistant ttc39c mRNA, which
      supports specificity. The evidence is necessity only: which step of ciliogenesis ttc39c performs
      is unknown, so the conservative acts_upstream_of_or_within qualifier fits. Weak association of
      mammalian TTC39C with IFT-A subunits points to a possible IFT-related role [PMID:25860617]. This
      is the core experimentally established process and the reference function for transfer to
      TTC39C (SF1) orthologs.
    supported_by:
    - reference_id: PMID:25860617
      supporting_text: both the number and length of the KV cilia were significantly reduced in the ttc morphants
    - reference_id: PMID:25860617
      supporting_text: the body curvature phenotypes of the morphants were rescued upon coinjection of the
        corresponding MO-resistant mRNA of zebrafish ttc4, -9c, -36, or -39c, but not of the mRNA of EGFP
    - reference_id: PMID:25860617
      supporting_text: Our systematic
        screen in zebrafish identified four novel TTC genes, ttc4, -9c, -36, and -39c,
        that are critical for cilia formation and motility.
- term:
    id: GO:0061371
    label: determination of heart left/right asymmetry
  evidence_type: IMP
  original_reference_id: PMID:25860617
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-MRPHLNO-150622-18
  review:
    summary: >-
      Heart-tube orientation was randomized in more than 64% of ttc39c morphants.
    action: KEEP_AS_NON_CORE
    reason: >-
      Laterality defects follow from defective Kupffer's vesicle cilia, which generate the leftward
      flow that breaks symmetry. The paper attributes the phenotype to the cilia defect. The
      observation is real, and the upstream-or-within qualifier makes no claim that ttc39c performs a
      step of heart laterality determination, so the row is kept. It is a downstream organismal
      phenotype from a morpholino only, though, and the PAINT curator propagated the cilium and otolith
      terms but not this one. That omission should be treated as deliberate, and this term should not
      be transferred to orthologs.
    supported_by:
    - reference_id: PMID:25860617
      supporting_text: More than 64% of the morphants of ttc25, -36, and -39c showed misoriented heart tubes
        toward either the right or the middle side, indicating a randomized heart tube orientation
    - reference_id: PMID:25860617
      supporting_text: Kupffer’s vesicle (KV), a monociliated organ functionally equivalent to mouse embryonic
        node, is essential for establishment of the left-right asymmetry during early stages of embryonic
        development
core_functions:
- description: >-
    Required for cilium assembly in zebrafish embryos. Knockdown reduces the number and length of
    Kupffer's vesicle monocilia and impairs pronephric motile cilia. This has been established
    experimentally by morpholino with mRNA rescue. The molecular activity and the step of
    ciliogenesis that ttc39c performs are unknown. Weak association of mammalian TTC39C with IFT-A
    subunits suggests an IFT-related role. Inherited along the TTC39C (PTHR31859:SF1) lineage.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  supported_by:
  - reference_id: PMID:25860617
    supporting_text: both the number and length of the KV cilia were significantly reduced in the ttc morphants
  - reference_id: PMID:25860617
    supporting_text: TTC39c showed weak association with IFT144 and IFT139, two subunits of IFT-A
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of TTC39C is unknown. It is not known whether its TPR repeats mediate
      binding to IFT-A, to axonemal dynein assembly factors or to cargo, or which step of ciliogenesis
      ttc39c performs.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    provenance:
    - reference_id: PMID:25860617
      supporting_text: Nevertheless, how these novel cilia-related TTC proteins function at the molecular
        level still needs future investigations.
