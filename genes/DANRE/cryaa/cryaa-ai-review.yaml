suggested_questions:
- question: Does GO:0140309 unfolded protein holdase activity, whose definition describes a carrier that escorts an unfolded client to an acceptor or location, correctly describe a small heat shock protein that simply retains clients in a soluble state? The term is what GOA now uses for cryaa after GO:0051082 was obsoleted, but the escort clause does not match the sHSP mechanism (see go-ontology issue 30552).
- question: Is any function of zebrafish cryaa exercised outside the lens? Expression is high in lens and very low in liver and spleen, which leaves the inherited anti-apoptotic and heat-response annotations without a tissue context in this species.
suggested_experiments:
- description: Quantify gamma- and beta-crystallin solubility and lens transparency in the maternal/zygotic cryaa knockout across development, to test directly whether the lens phenotype follows from loss of holdase activity rather than from loss of bulk structural protein.
- description: Introduce point mutations that reduce holdase activity without altering expression level (using the hydrophobicity variants already characterized in vitro) into the endogenous locus, separating the chaperone and structural contributions of cryaa in vivo.
