id: Q8UUZ6
gene_symbol: cryaa
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'cryaa encodes zebrafish alpha-crystallin A chain, a 173-residue member of the small heat shock protein (HSP20) family built around a central alpha-crystallin domain. It is a soluble cytoplasmic protein expressed at high level in the lens and only marginally elsewhere, where it accumulates to the very high concentrations that make crystallins the bulk structural protein of the lens and set its refractive properties. It also acts as an ATP-independent holdase chaperone: it binds proteins that are beginning to unfold and holds them in a soluble state, preventing their aggregation, an activity whose strength depends on exposed hydrophobic surface and on temperature. In the lens these two roles are the same role, since keeping gamma-crystallins soluble is what preserves transparency; loss of alphaA-crystallin in zebrafish gives abnormal, more reflective lenses and impaired fibre-cell differentiation, and restoring it rescues both.'
