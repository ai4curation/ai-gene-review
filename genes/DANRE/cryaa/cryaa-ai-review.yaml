    label: protein refolding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Protein refolding, propagated from the broad small heat shock protein node PTN000897708 (Drosophila Hsp22/23/26/27 and related members). Alpha-crystallins bind denaturing proteins and hold them soluble; restoring activity to the client is done by ATP-dependent chaperone systems, not by the sHSP itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: Every assay of zebrafish alphaA-crystallin measures prevention of aggregation, not recovery of client activity, and the protein is ATP-independent. Holding an unfolded client in a soluble state contributes to refolding by other chaperones but is not itself the refolding step; GO:0140309 unfolded protein holdase activity, annotated here by IDA, is the term that names what this gene product does. Not wrong at the family level but an over-reach for a lens crystallin.
