description: guca1d (guanylate cyclase activator 1d; protein name zGCAP4) is one of two zebrafish co-orthologs of
  vertebrate GUCA1C (GCAP3), retained from the teleost-specific genome duplication; its paralog is guca1c (zGCAP3).
  It encodes a 185 aa N-myristoylated neuronal calcium sensor of the recoverin/GCAP family with four EF-hands, of
  which EF2-EF4 carry intact Ca2+-binding loops. Recombinant zGCAP4 is a strong activator of photoreceptor membrane
  guanylate cyclases from bovine and zebrafish retina, stimulating them at low free Ca2+ and inhibiting them at high
  Ca2+, with half-maximal activation near 0.4-0.57 uM free Ca2+, a lower Ca2+ sensitivity than zGCAP3. Myristoylation
  does not change its Ca2+-sensor properties and it shows no Ca2+-myristoyl switch. guca1d is expressed only in cone
  photoreceptors, most strongly in double cones and long single cones and weakly in short single (UV) cones, from
  about 3-4 dpf; in adult cones its transcript is about a tenth as abundant as guca1c. No loss-of-function data exist.
