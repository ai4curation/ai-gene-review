core_functions:
- description: Myristoylated neuronal Ca2+ sensor of cone photoreceptors (mainly double and long single cones) that
    activates the photoreceptor membrane guanylate cyclases when free Ca2+ falls; a strong activator with lower Ca2+
    sensitivity (half-maximal near 0.4-0.57 uM) than its paralog zGCAP3.
  molecular_function:
    id: GO:0008048
    label: calcium sensitive guanylate cyclase activator activity
  supported_by:
  - *act
  - reference_id: PMID:21829700
    supporting_text: The IC50 values of zGCAPs could be separated in two groups; one group consisting of zGCAP1, 2,
      and 3 had IC50 values around 30 nM free [Ca2+], the second group of zGCAP4, 5 and 7 had IC50 values between
      180 and 520 nM centered around 400 nM (Table 2 and Figure 3).
  - reference_id: PMID:15486694
    supporting_text: The digoxigenin-labeled zGCAP4 antisense RNA probe hybridized specifically to the myoid region
      of double cones and long single cones protrude above the external limiting membrane.
suggested_questions:
- question: Does guca1d loss of function alter cone responses, alone or together with guca1c?
- question: Which of the two copies kept the Ca2+ sensitivity of the ancestral GCAP3?
suggested_experiments:
- hypothesis: guca1d supports cone Ca2+ feedback at the higher Ca2+ range, complementing guca1c.
  description: Make guca1d mutants (promoter-less alleles to avoid transcriptional adaptation) and record cone
    photoresponse recovery and light adaptation by ERG, alone and with guca1c mutants.
  experiment_type: mutant electrophysiology
