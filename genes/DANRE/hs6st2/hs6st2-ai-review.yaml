  label: Danio rerio
description: 'hs6st2 encodes heparan-sulfate 6-O-sulfotransferase 2, a Golgi membrane-associated sulfotransferase
  that transfers

  sulfate from PAPS to the 6-O position of N-sulfoglucosamine residues in heparan sulfate during heparan
  sulfate

  proteoglycan biosynthesis. Its sulfation of heparan sulfate shapes vascular branching, eye morphogenesis,
  and muscle

  development.'
