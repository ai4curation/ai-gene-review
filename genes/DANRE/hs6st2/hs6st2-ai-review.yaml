- id: PMID:12782624
  title: Heparan sulfate 6-o-sulfotransferase is essential for muscle development in zebrafish.
  findings:
  - statement: Zebrafish hs6st encodes a heparan sulfate 6-O-sulfotransferase with specific 
      enzymatic activity.
    supporting_text: the protein shows specific 6-O-sulfotransferase activity
  - statement: Morpholino loss reduces heparan sulfate 6-O-sulfation.
    supporting_text: Morpholino injections significantly inhibited 6-O- but not 2-O-sulfation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (Bink et al. 2003): zebrafish hs6st shows specific 6-O-sulfotransferase
      activity in COS-7 cells and morpholino knockdown reduces 6-O- but not 2-O-sulfation; directly supports
      the GO:0017095 activity annotations.'
- id: PMID:16009360
  title: A unique role for 6-O sulfation modification in zebrafish vascular development.
  findings:
  - statement: Hs6st2 is required for caudal-vein branching morphogenesis in zebrafish embryos.
    supporting_text: HS6ST-2 is required for the branching morphogenesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (Chen et al. 2005, abstract-only cache): HS6ST-2 required for caudal-vein
      branching morphogenesis in zebrafish; supports the GO:0001569 IMP and the enzymatic requirement.
      Defer to curator for full-text assay details.'
- id: PMID:17937808
  title: Genetic determinants of hyaloid and retinal vasculature in zebrafish.
  findings:
  - statement: Hs6st2 morphants have abnormal hyaloid vascular branching.
    supporting_text: Hyaloid vasculature with scarce andoversized branches
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified: hs6st2 morphants show hyaloid vasculature branching defects and eye
      morphogenesis phenotypes; supports the GO:0048048 IMP annotation.'
