suggested_questions:
- question: Which endogenous lysosomal substrates require zebrafish Tpp1-mediated removal of N-terminal tripeptides, and which accumulate as storage material when the enzyme is absent?
- question: Does zebrafish Tpp1 require autocatalytic activation of its zymogen at acidic lysosomal pH, mirroring the proenzyme maturation described for mammalian TPP-I/CLN2?
- question: To what extent do the neurodegenerative and locomotor phenotypes of Tpp1-deficient zebrafish stem from impaired lysosomal proteolysis versus secondary consequences of ceroid-lipofuscin storage?
suggested_experiments:
- hypothesis: Loss of zebrafish tpp1 abolishes lysosomal tripeptidyl-peptidase activity and leads to accumulation of autofluorescent storage material in neurons.
  description: Generate a tpp1 null line by CRISPR/Cas9, then assay lysosomal tripeptidyl-peptidase activity in larval/adult brain lysates against a fluorogenic Ala-Ala-Phe substrate and quantify ceroid-lipofuscin storage histologically.
  experiment_type: CRISPR knockout
- hypothesis: Recombinant zebrafish Tpp1 is produced as an inactive zymogen that undergoes autocatalytic activation upon exposure to acidic pH.
  description: Express and purify the Tpp1 proenzyme, incubate across a range of pH values (acidic lysosomal versus neutral), and monitor proteolytic processing and gain of exopeptidase activity over time by SDS-PAGE and activity assays.
  experiment_type: tripeptidyl-peptidase activity assay
- hypothesis: Restoring Tpp1 enzymatic activity in tpp1-deficient zebrafish rescues neurodegeneration and locomotor defects.
  description: Reintroduce wild-type or catalytically dead tpp1 mRNA/transgene into tpp1 mutants and assess rescue of progressive neurodegeneration, neuronal proliferation, and swimming behavior alongside lipofuscin storage load.
  experiment_type: lipofuscin/storage-material histology
