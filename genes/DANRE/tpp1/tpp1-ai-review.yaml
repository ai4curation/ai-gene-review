  review:
    summary: This IBA at PTN002681568 propagates the zebrafish IMP annotation (ZFIN:ZDB-GENE-030131-6654 is the only listed donor) to the vertebrate TPP1 clade. It asserts that TPP1 orthologues are involved in CNS development because their loss causes neurodegeneration (CLN2 disease in humans, the sa0011 phenotype in zebrafish).
    action: KEEP_AS_NON_CORE
