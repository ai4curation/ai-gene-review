- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Proteolysis is the general process carried out by a peptidase. Zebrafish Tpp1 is a lysosomal serine-carboxyl peptidase; the CLN2 subfamily is highly conserved across vertebrates and tpp1(sa0011) mutant extracts lack tripeptidyl-peptidase activity, so the enzyme itself does the peptide-bond hydrolysis this term names.
    action: ACCEPT
    reason: The PAINT node PTN000368455 spans the sedolisin/CLN2 family (human, rat, Dictyostelium donors), all of which are peptidases; the zebrafish gene has direct evidence of peptidase activity from the CLN2 mutant assay [PMID:23587805] and UniProt records EC 3.4.14.9 for this entry. The term is general but not wrong; the lysosomal context is captured by the GO:1905146 IBA row.
