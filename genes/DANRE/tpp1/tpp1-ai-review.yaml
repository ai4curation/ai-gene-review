    label: endopeptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'Endopeptidase activity (hydrolysis of internal peptide bonds) is a secondary activity of TPP1: the EC 3.4.14.9 reaction recorded for zebrafish Tpp1 states that the enzyme releases N-terminal tripeptides but also has endopeptidase activity. The physiologically dominant activity is the exopeptidase one.'
    action: KEEP_AS_NON_CORE
    reason: 'The activity is real for the family (the UniProt catalytic-activity line explicitly includes it) and the PAINT node PTN000368455 carries human and rat donors with experimental endopeptidase data, so the transfer is sound. It is not the core activity: the CLN2 disease phenotype and the zebrafish mutant assay both track loss of tripeptidyl exopeptidase cleavage, so this term is retained as non-core rather than as a defining function.'
