  review:
    summary: Locomotory behavior is annotated from the tpp1(sa0011) mutant, which shows a phase of hyperactivity consistent with seizures followed by functional motor impairment. These are behavioural read-outs of progressive neurodegeneration.
    action: MARK_AS_OVER_ANNOTATED
