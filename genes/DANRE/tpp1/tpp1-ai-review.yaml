- id: file:DANRE/tpp1/tpp1-deep-research-falcon.md
  title: Falcon deep research synthesis for Danio rerio tpp1 (tripeptidyl-peptidase 1 / CLN2)
  findings:
  - statement: Zebrafish tpp1 encodes lysosomal tripeptidyl-peptidase 1 (EC 3.4.14.9), a sedolisin (S53)-family serine protease that acts mainly as an N-terminal exopeptidase releasing tripeptides, with limited endopeptidase activity.
    supporting_text: tpp1 encodes lysosomal tripeptidyl-peptidase 1 (EC 3.4.14.9), a sedolisin-family serine protease that acts mainly as an **N-terminal exopeptidase**
    reference_section_type: OTHER
  - statement: The TPP1 catalytic triad is consistent with sedolisin-family enzymes, reported as Glu-Asp-Ser, distinguishing it from classical Ser-His-Asp serine proteases.
    supporting_text: catalytic triad consistent with sedolisin-family enzymes (reported as **Glu–Asp–Ser**
    reference_section_type: OTHER
  - statement: Zebrafish Tpp1 is predicted to be targeted to the lysosome after removal of a 19-aa signal peptide and is trafficked to lysosomes via the mannose-6-phosphate pathway.
    supporting_text: predicted to be targeted to the lysosome after removal of a 19-aa signal peptide
    reference_section_type: OTHER
  - statement: Tpp1 activity in zebrafish embryos is measured as cleavage of the fluorogenic tripeptidyl substrate Arg-Ala-Phe-ACC at acidic pH (pH 4.0), consistent with a lysosomal enzyme, and is significantly reduced in tpp1(sa0011) mutants.
    supporting_text: cleavage of the fluorogenic tripeptidyl substrate **Arg-Ala-Phe-ACC** at **acidic pH (pH 4.0)**
    reference_section_type: OTHER
  - statement: Loss of Tpp1 produces classic lysosomal storage phenotypes including enlarged/hypertrophic lysosomes and accumulation of subunit c of mitochondrial ATP synthase (SCMAS), positioning Tpp1 within lysosome-dependent proteostasis and degradative pathways.
    supporting_text: lysosomal storage phenotypes including **enlarged/hypertrophic lysosomes**
    reference_section_type: OTHER
  - statement: Homozygous tpp1(sa0011) mutants show an early-onset, progressive neurodegenerative phenotype with defects in retina, optic tectum and cerebellum, increased apoptosis, sustained reduction in proliferation, seizure-like hyperactivity, and motor decline.
    supporting_text: early-onset, progressive neurodegenerative phenotype with prominent defects in **retina**, **optic tectum**, and **cerebellum**
    reference_section_type: OTHER
