id: F8W2M8
gene_symbol: tpp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'Tpp1 is the zebrafish orthologue of tripeptidyl-peptidase 1 (CLN2), a lysosomal sedolisin-family (MEROPS S53) serine-carboxyl peptidase that is synthesized as a zymogen with a signal peptide and a long propeptide and is activated by autocatalytic processing at acidic pH. The mature enzyme is an acid-active exopeptidase that releases N-terminal tripeptides from peptides with a free N-terminus, including the breakdown products generated by lysosomal endopeptidases, and it has weaker endopeptidase activity; it therefore contributes to bulk protein turnover inside the lysosome. In zebrafish the protein is expressed in the developing retina and brain. Loss of tpp1 removes tripeptidyl-peptidase activity from embryo extracts and produces hypertrophic lysosomes, storage of subunit c of mitochondrial ATP synthase, apoptosis and impaired secondary neurogenesis in the retina, optic tectum and cerebellum, disorganized axon tracts, seizure-like hyperactivity and motor decline, modelling human CLN2 (late-infantile neuronal ceroid lipofuscinosis).'
