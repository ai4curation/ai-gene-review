    summary: Serine-type endopeptidase activity is mapped from the Peptidase S8/S53 superfamily fold (IPR036852). Tpp1 is a serine-carboxyl (sedolisin) peptidase with a Ser/Glu/Asp triad rather than the classical Ser/His/Asp triad, and its endopeptidase activity is a minor activity alongside its main tripeptidyl exopeptidase activity.
