- id: PMID:23671259
  title: Redefining the initiation and maintenance of zebrafish interrenal steroidogenesis by characterizing
    the key enzyme cyp11a2.
  findings:
  - statement: 'Primary paralog comparison: cyp11a1 is current cyp11a1.1 and cyp11a2 is current cyp11a1.2.
      Abstract explicitly separates early-development/gonadal from sustained interrenal expression
      and describes morpholino/pregnenolone rescue evidence. Do not generalize morpholino necessity
      to all genetic backgrounds.'
    supporting_text: The phenotype was rescued by pregnenolone replacement in cyp11a2 morphants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Primary paralog comparison: cyp11a1 is current cyp11a1.1 and cyp11a2 is current
      cyp11a1.2. Abstract explicitly separates early-development/gonadal from sustained interrenal
      expression and describes morpholino/pregnenolone rescue evidence. Do not generalize morpholino
      necessity to all genetic backgrounds.'
- id: PMID:31693487
  title: The P450 side-chain cleavage enzyme Cyp11a2 facilitates steroidogenesis in zebrafish.
  findings:
  - statement: Stable CRISPR cyp11a2/current cyp11a1.2 mutants establish interrenal and gonadal steroidogenic
      function. Steroid deficiency is separated from downstream reproductive phenotypes and from
      a distinct positive-regulator activity.
    supporting_text: these Cyp11a2-deficient zebrafish demonstrated profound glucocorticoid and androgen
      deficiencies.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Stable CRISPR cyp11a2/current cyp11a1.2 mutants establish interrenal and gonadal
      steroidogenic function. Steroid deficiency is separated from downstream reproductive phenotypes
      and from a distinct positive-regulator activity.
- id: PMID:34932120
  title: Cyp11a2 Is Essential for Oocyte Development and Spermatogonial Stem Cell Differentiation
    in Zebrafish.
  findings:
  - statement: Independent cyp11a2/current cyp11a1.2 mutants and transplantation demonstrate gonadal
      developmental defects; mutant germ cells can differentiate in wild-type hosts. No cell-autonomous
      germ-cell enzyme mechanism is inferred.
    supporting_text: The transplanted mutant SSCs efficiently differentiated into functional spermatids
      in WT hosts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent cyp11a2/current cyp11a1.2 mutants and transplantation demonstrate gonadal
      developmental defects; mutant germ cells can differentiate in wild-type hosts. No cell-autonomous
