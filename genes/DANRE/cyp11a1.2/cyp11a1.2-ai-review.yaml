gene_symbol: cyp11a1.2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Cyp11a1.2, historically called Cyp11a2, is a mitochondrial cholesterol side-chain-cleavage
  enzyme that produces pregnenolone for zebrafish steroid hormone biosynthesis. It is expressed in
  the interrenal tissue and gonads, and loss of the gene causes glucocorticoid and androgen deficiency
  with impaired gonadal development and sperm production. This paralog provides a principal entry
  reaction for larval and adult interrenal steroidogenesis. Its shared catalytic family with Cyp11a1.1
  does not imply identical developmental expression or tissue roles.
