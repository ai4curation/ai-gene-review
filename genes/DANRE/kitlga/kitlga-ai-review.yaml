id: Q56JH6
gene_symbol: kitlga
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  kitlga encodes Kit ligand a, a zebrafish co-ortholog of mammalian KITLG (stem cell
  factor, SCF; also called mast cell growth factor and c-Kit ligand). It is a four-helix
  cytokine-like SCF-family growth factor synthesized as a single-pass type I membrane
  protein that can also be released as a soluble extracellular ligand, acting through
  juxtacrine and paracrine signaling. Its defining molecular function is to bind and
  activate the Kita receptor tyrosine kinase (the zebrafish KIT-a ortholog), triggering
  the conserved KIT-RAS/MAPK and PI3K/AKT signaling cascades in receiving cells. kitlga
  arose together with its paralog kitlgb from the teleost whole-genome duplication of the
  ancestral kit ligand, with the two paralogs partitioning ancestral roles and their
  receptors (kita, kitb); kitlga is the paralog that retains the ancestral pigment-cell
  role and kitlgb does not substitute for it. Through Kita engagement, kitlga controls
  embryonic melanocyte migration, survival, number and pattern, establishes and maintains
  adult melanophore progenitors, and contributes to proliferation of KIT-expressing
  progenitors including cooperation with erythropoietin in erythroid expansion. It is
  produced by supporting/niche cells such as trunk somitic mesoderm and skin, and acts on
  neighboring Kita-expressing target cells.
