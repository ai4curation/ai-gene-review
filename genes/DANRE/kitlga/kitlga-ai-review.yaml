- term:
    id: GO:0030318
    label: melanocyte differentiation
  evidence_type: IDA
  original_reference_id: PMID:17257055
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Direct assay (expression + gain-of-function) placing kitlga upstream of/within
      melanocyte differentiation. kitla mRNA is expressed along the medial melanocyte
      migration route and later in skin, and kitla overexpression produces kita-dependent
      hyperpigmentation with increased melanocyte number and size. kitlga is the pigment-role
      paralog; kitlgb does not substitute. This is a well-supported developmental/lineage
      outcome downstream of the core Kita-ligand activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Strongly supported zebrafish-specific in vivo phenotype, but it is a
      developmental/lineage process (the gene acts upstream of it as the ligand) rather than
      the core molecular function; retain as non-core.
    supported_by:
    - reference_id: PMID:17257055
      supporting_text: >-
        kitla mRNA is expressed in the trunk adjacent to the notochord in the middle of each
        somite during stages of melanocyte migration and later expressed in the skin, when
        the receptor is required for melanocyte survival
    - reference_id: PMID:17257055
      supporting_text: >-
        overexpression of kitla results in a hyperpigmented embryo with an increase in the
        number and size of melanocytes
