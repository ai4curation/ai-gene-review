  supporting_entities:
  - InterPro:IPR003452
  review:
    summary: >-
      InterPro2GO annotation (SCF domain IPR003452) assigning stem cell factor receptor
      binding. This is the defining, core molecular function of kitlga: it is the
      functional ligand for the Kita receptor tyrosine kinase, as demonstrated by
      morpholino phenocopy of the kita-null allele, genetic interaction with a sensitized
      kita allele, and kita-dependent hyperpigmentation on overexpression.
    action: ACCEPT
    reason: >-
      Core molecular function. kitlga is the SCF-family cytokine ligand that binds and
      activates Kita; the InterPro mapping is correct and captures the central function of
      the gene product.
    supported_by:
    - reference_id: PMID:17257055
      supporting_text: >-
        we conclude that kitla is the functional kita ligand in zebrafish embryonic
        melanocyte development and that kitla promotes all of the kita-dependent functions
        in embryonic melanocyte development
