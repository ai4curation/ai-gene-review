- term:
    id: GO:0005125
    label: cytokine activity
  evidence_type: ISS
  original_reference_id: PMID:17257055
  review:
    summary: 'cytokine activity (GO:0005125): kitlga is the SCF-family cytokine ligand that binds and
      activates the Kita receptor tyrosine kinase to effect changes in target cells (melanocyte proliferation/differentiation,
      pigmentation).'
    action: NEW
    reason: 'Proposed as a core molecular function. kitlga is the functional Kita ligand in zebrafish
      and its overexpression drives Kita-dependent melanocyte expansion [PMID:17257055], i.e. it performs
      the cytokine activity (a soluble/membrane ligand effecting a change via its receptor) directly,
      not merely enabling it. Comparator check: the human ortholog KITLG carries GO:0005125 (QuickGO IEA),
      and this term is a distinct MF branch (receptor-ligand/cytokine activity) from the already-annotated
      GO:0005173 stem cell factor receptor binding (a binding term under cytokine receptor binding), so
      it is not redundant.'
    supported_by:
    - reference_id: PMID:17257055
      supporting_text: kitla is the functional kita ligand in zebrafish
    - reference_id: PMID:17257055
      supporting_text: overexpression of kitla results in a hyperpigmented embryo with an increase 
        in the number and size of melanocytes
  qualifier: enables
core_functions:
- description: >-
    Stem cell factor receptor binding: kitlga is the functional ligand for the Kita
    receptor tyrosine kinase (the zebrafish KIT-a ortholog), binding and activating it to
    initiate downstream KIT-RAS/MAPK and PI3K/AKT signaling. It acts both as a
    membrane-anchored (juxtacrine) ligand and as a shed soluble ligand. kitlga, not its
    paralog kitlgb, provides this activity for Kita in the pigment-cell lineage.
  supported_by:
  - reference_id: PMID:17257055
    supporting_text: >-
      we conclude that kitla is the functional kita ligand in zebrafish embryonic
      melanocyte development and that kitla promotes all of the kita-dependent functions
      in embryonic melanocyte development
