- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:96974
  - PANTHER:PTN002611905
  - UniProtKB:P21583
  review:
    summary: >-
      Phylogenetic (IBD/IBA) annotation placing the kit ligand family as active at the
      plasma membrane at ancestral node PTN002611905. Membrane-anchored SCF/Kit ligand
      signals to the Kit receptor from the plasma membrane (juxtacrine), and kitlga is a
      single-pass type I membrane protein, so is_active_in plasma membrane is appropriate.
    action: ACCEPT
    reason: >-
      Sound node placement; membrane-bound kit ligand is functionally active at the plasma
      membrane. Core functional location for the membrane-bound form. The node is seeded by
      well-characterized mammalian members (mouse Kitl, human KITLG) and is consistent with
      the conserved single-pass topology.
