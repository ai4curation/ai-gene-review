- term:
    id: GO:0001756
    label: somitogenesis
  evidence_type: IGI
  original_reference_id: PMID:18326814
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - ZFIN:ZDB-GENO-070406-1
  - ZFIN:ZDB-MRPHLNO-080924-3
  review:
    summary: Somitic expression of crlr, needed for arterial differentiation, is under shha control (shha
      mutant x crlr morphant interaction).
    action: MODIFY
    reason: syu mutants form somites normally but mis-pattern them (U- rather than V-shaped, no horizontal
      myoseptum, loss of slow muscle and muscle pioneers). GO:0001756 somitogenesis is defined as the
      formation of the segmental mesodermal clusters, which is Shh-independent; the phenotype is a defect
      in the subsequent patterning of the somite. GO:0061053 somite development (already carried by mouse
      Shh by IMP) is the accurate term. Essence sound, term too specific in the wrong direction. Here
      the readout is somitic crlr expression, again a patterning/gene-expression phenotype within formed
      somites.
    proposed_replacement_terms:
    - id: GO:0061053
      label: somite development
    supported_by:
    - reference_id: PMID:18326814
      supporting_text: genetic and biochemical evidences indicate that somitic crlr expression is under
        the control of sonic hedgehog
