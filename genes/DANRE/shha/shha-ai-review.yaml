  review:
    summary: Patched binding by the ShhN ligand, inferred by PAINT at node PTN001726121 from fly hh and
      mammalian Shh/Ihh/Dhh experimental data.
    action: ACCEPT
    reason: Binding of the lipidated N-product to Patched is the mechanism by which every Hedgehog ligand
      relieves Patched repression of Smoothened. In zebrafish the Hh-responsive genes ptc1/ptc2 mark direct
      target cells and all shha phenotypes are phenocopied by smo (smu) mutants. This is the core molecular
      function of the ligand.
    supported_by:
    - reference_id: PMID:12606279
      supporting_text: We show that the Hh responsive genes ptc1 and nk2.2 are expressed in preplacodal
        cells at the anterior margin of the neural tube at this time, indicating that these cells are
        directly receiving Hh signals.
    - reference_id: PMID:16626681
      supporting_text: Epistatic and molecular analyses position Scube2 function upstream of Smoothened
        (Smoh), the signalling component of the HH receptor complex, suggesting that Scube2 may act during
        HH signal transduction prior to, or during, receipt of the HH signal at the plasma membrane.
