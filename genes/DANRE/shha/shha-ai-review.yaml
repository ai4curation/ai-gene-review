- term:
    id: GO:0004175
    label: endopeptidase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q62226
  review:
    summary: Endopeptidase activity transferred from mouse Shh, capturing the Hint-domain self-cleavage
      of the precursor.
    action: MODIFY
    reason: 'The precursor cleavage is a cholesterolysis: the Hint domain performs an N-S acyl shift and
      cholesterol, not water, attacks the thioester, so the reaction (RHEA:59504) is a cholesterol-protein
      transferase reaction rather than peptide-bond hydrolysis. GO now has the precise term GO:0140853,
      already annotated to shha by ISS; the generic endopeptidase term should be replaced by it, as was
      done in the human SHH review.'
    proposed_replacement_terms:
    - id: GO:0140853
      label: cholesterol-protein transferase activity
    supported_by:
    - reference_id: PMID:8824192
      supporting_text: Here it is reported that cholesterol is the lipophilic moiety covalently attached
        to the amino-terminal signaling domain during autoprocessing and that the carboxyl-terminal domain
        acts as an intramolecular cholesterol transferase.
