core_functions:
- description: The dually lipidated N-terminal product of shha is released from producing cells and binds
    Patched receptors on neighbouring cells, relieving Patched repression of Smoothened and activating
    Gli-dependent transcription. In zebrafish this ligand activity is exercised mostly at short range
    from midline, endodermal, epithelial and epicardial sources and is redundantly shared with shhb in
    several tissues.
  molecular_function:
    id: GO:0005113
    label: patched binding
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  - id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:12606279
    supporting_text: We show that the Hh responsive genes ptc1 and nk2.2 are expressed in preplacodal
      cells at the anterior margin of the neural tube at this time, indicating that these cells are directly
      receiving Hh signals.
  - reference_id: PMID:15253932
    supporting_text: By performing mosaic analysis, we demonstrate that Shh directs these events as a
      short-range signal within the neural retina.
  - reference_id: PMID:16626681
    supporting_text: Epistatic and molecular analyses position Scube2 function upstream of Smoothened
      (Smoh), the signalling component of the HH receptor complex, suggesting that Scube2 may act during
      HH signal transduction prior to, or during, receipt of the HH signal at the plasma membrane.
  - reference_id: PMID:9655820
    supporting_text: Embryos mutant for a deletion of syu display defects in patterning of the somites,
      the lateral floor plate cells, the pectoral fins, the axons of motorneurons and the retinal ganglion
      cells.
- description: The C-terminal Hint domain of the shha precursor autocatalytically cleaves the Gly197-Cys198
    bond and transfers cholesterol onto the new C terminus of the N-terminal fragment, generating the
    cholesterol-modified signalling product. This occurs in the endoplasmic reticulum before the N-product
    is palmitoylated and exported.
  molecular_function:
    id: GO:0140853
    label: cholesterol-protein transferase activity
  directly_involved_in:
  - id: GO:0016540
    label: protein autoprocessing
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:8824192
    supporting_text: Here it is reported that cholesterol is the lipophilic moiety covalently attached
      to the amino-terminal signaling domain during autoprocessing and that the carboxyl-terminal domain
      acts as an intramolecular cholesterol transferase.
  - reference_id: PMID:7583153
    supporting_text: Both twhh and shh proteins undergo autoproteolytic processing in vivo; a fragment
      corresponding to the amino-terminal cleavage product was sufficient to carry out all signaling activities
      associated with twhh in eye and brain development.
proposed_new_terms: []
suggested_questions:
- question: Which shha developmental phenotypes are shared with shhb, and which are unique to shha? Systematic
    single and double mutant (rather than morpholino) comparison would let ZFIN separate redundant from
    shha-specific roles.
- question: Does zebrafish Shha act as a long-range morphogen anywhere (e.g. neural tube, fin bud), or
    is signalling predominantly short-range/juxtacrine as the retina and epicardium studies suggest? This
    bears on whether GO:0016015 morphogen activity should be added, which was deliberately not proposed
    here.
- question: Is the Rohon-Beard axon phenotype of syu mutants entirely explained by loss of muscle contraction,
    or does Shha also act as a direct guidance cue for motor or retinal ganglion cell axons in zebrafish
    as it does at the mammalian optic chiasm?
- question: Does the shha heterozygote cone phenotype reflect a continuing adult requirement for Shh signalling
    in cone survival, or a developmental sensitisation?
suggested_experiments:
- description: Generate clean shha; shhb double mutants (CRISPR) and score floor plate, otic, diencephalic,
    craniofacial and endocardial phenotypes against each single mutant to assign redundancy explicitly.
- description: Use the Cre-invertible shha allele with tissue-specific drivers (notochord, floor plate,
    endoderm, ZLI, fin mesenchyme) to map which source of Shha is responsible for each annotated developmental
    process.
- description: Biochemically confirm autoprocessing and cholesterol transfer for the zebrafish protein
    (Hint-domain C198A/D303A mutants expressed in embryos), so the ISS-based catalytic annotations gain
    direct zebrafish evidence.
