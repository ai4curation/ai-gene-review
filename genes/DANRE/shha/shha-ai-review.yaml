  review:
    summary: PAINT inference that Hedgehog ligands specify cell fates; the zebrafish gene is itself one
      of the experimental sources for the node.
    action: KEEP_AS_NON_CORE
    reason: 'Graded Shh specifies ventral neural, slow-muscle and other fates in zebrafish. shha is a
      pleiotropic morphogen: its single molecular activity (the lipidated ShhN ligand binding Patched
      and activating Smoothened signalling) is deployed in many tissues. This annotation records one such
      developmental deployment, so it is retained but flagged non-core; the core functions are the ligand
      activity and precursor autoprocessing.'
    supported_by:
    - reference_id: PMID:15539490
      supporting_text: Graded Hedgehog (Hh) signaling patterns the spinal cord dorsoventral axis by inducing
        and positioning distinct precursor domains, each of which gives rise to a different type of neuron.
    - reference_id: PMID:10642786
      supporting_text: while such signalling is essential for slow myocyte differentiation, the loss of
        activity of one signal, Sonic hedgehog, can be partially compensated for by other Hedgehog family
        proteins
