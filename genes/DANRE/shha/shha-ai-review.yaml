id: Q92008
gene_symbol: shha
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: shha encodes zebrafish Sonic hedgehog a, the principal Hedgehog-family morphogen of the fish
  embryo and the product of the classical sonic you (syu) mutant locus. It is a 418-residue secreted precursor
  with a signal peptide, an N-terminal signalling domain and a C-terminal Hint domain. In the endoplasmic
  reticulum the Hint domain autocleaves the precursor and, acting as an intramolecular cholesterol-protein
  transferase, esterifies cholesterol onto the new C terminus of the N-terminal fragment; Hhat then palmitoylates
  its N terminus. The dually lipidated N-product (ShhNp) is tethered to the producing cell membrane and
  released with the help of Dispatched and Scube proteins. It binds Patched (ptch1/ptch2) on responding
  cells, relieving Patched repression of Smoothened and switching Gli transcription factors to their activator
  forms. shha is expressed in the embryonic shield, notochord, medial floor plate, ventral forebrain and
  zona limitans intrathalamica, pectoral fin bud mesenchyme, anterior endoderm, pharyngeal and tooth epithelium,
  retina and epicardium. Graded or short-range Shha signalling from these sources specifies lateral floor
  plate and motor neurons, ventral spinal cord precursor domains and oligodendrocyte lineage cells, slow-twitch
  muscle and muscle pioneers within somites, anteroposterior polarity of the pectoral fin, posterior otic
  identity, prethalamus/thalamus, adenohypophysis, endocrine pancreas, arterial endothelium, cardiomyocyte
  number, craniofacial cartilage, teeth, swimbladder, cloaca and the timing of retinal neurogenesis and
  cell-cycle exit. Unlike mouse Shh, shha is not required for medial floor plate induction, which is Nodal-dependent
  in zebrafish, and many of its roles are shared redundantly with the co-ortholog shhb (tiggy-winkle hedgehog).
  Heterozygous loss produces age-related cone photoreceptor loss, and epicardial shha is a short-range
  mitogen for myocardium during heart development and regeneration.
