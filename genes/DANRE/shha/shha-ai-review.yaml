  review:
    summary: 'InterPro IPR006141 (Intein_N) mapping: the Hedgehog Hint domain is homologous to the N-terminal
      intein splicing domain.'
    action: REMOVE
    reason: 'Homology is real but the process is not: intein-mediated protein splicing excises an internal
      segment and re-ligates the flanking exteins with a peptide bond. Hedgehog Hint domains perform only
      the first half-reaction (N-S acyl shift) and resolve the thioester with cholesterol, producing two
      separate products; no splicing occurs. Demonstrably wrong InterPro2GO propagation, as also concluded
      in the human SHH review.'
