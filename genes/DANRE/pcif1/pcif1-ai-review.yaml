id: A0A0R4IKJ1
gene_symbol: pcif1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: |-
  pcif1 encodes the zebrafish cap-specific adenosine methyltransferase (CAPAM, zCAPAM; EC 2.1.1.62), a nuclear
  SAM-dependent enzyme that N6-methylates the 2'-O-methyladenosine found at the first transcribed position of
  m7G-capped mRNAs, converting the m7GpppAm cap into m7Gpppm6Am. The protein has an N-terminal WW domain, which in
  the vertebrate family binds the Ser5-phosphorylated C-terminal domain of RNA polymerase II and couples cap
  methylation to early transcription, followed by a helical domain and a Rossmann-fold methyltransferase domain
  carrying the catalytic NPPF motif. The zebrafish enzyme was the construct used for the crystal structures of CAPAM
  bound to S-adenosyl-L-methionine and m7G-capped RNA, which defined the cap-recognition pocket and the residues
  required for catalysis. The m6Am cap mark has been linked to altered translation and stability of the modified
  transcripts, although the direction of the translational effect differs between studies.
