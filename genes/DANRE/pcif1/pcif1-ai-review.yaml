  evidence_type: IDA
  original_reference_id: PMID:30467178
  review:
    summary: |-
      The discovery paper assigned mRNA processing to the zebrafish protein on the basis of its cap-specific
      N6-methylation of the first transcribed adenosine of capped mRNAs, demonstrated with the zebrafish construct in
      the structural and enzymatic work. m6Am formation is a covalent maturation step on the 5' end of Pol II
      transcripts.
    action: ACCEPT
    reason: |-
      The participation test is met directly: Pcif1 catalyses the modification step itself. The term is broad, but it
      is the process term that UniProt curators consistently attach to CAPAM across all five human IDA papers, and the
      obvious narrower alternative (GO:0016556 mRNA modification) is not a descendant of mRNA processing in the current
      ontology, so a MODIFY would swap rather than refine. Accepted as the core process; the more specific term is
      raised under suggested_questions. Abstract-only cache; the zebrafish-specific assays are documented in the
      UniProt reference block (function, catalytic activity and mutagenesis on the zebrafish protein).
