suggested_questions:
- question: |-
    Should CAPAM/Pcif1 be annotated to GO:0016556 mRNA modification (the covalent-alteration term used for METTL3) in
    addition to, or instead of, the broad GO:0006397 mRNA processing that UniProt curators currently use for all
    PCIF1 orthologs?
- question: |-
    Is the WW-domain interaction with Ser5-phosphorylated Pol II CTD conserved in zebrafish Pcif1, and is the
    zebrafish enzyme, like the human one, inhibited by zinc?
suggested_experiments:
- description: |-
    Generate a pcif1 loss-of-function zebrafish line and quantify cap m6Am by LC-MS/MS of decapped mRNA to confirm
    that Pcif1 is the sole m6Am writer in vivo, then profile translation (ribosome profiling) and mRNA stability to
    resolve the direction of the m6Am effect in a vertebrate organism.
