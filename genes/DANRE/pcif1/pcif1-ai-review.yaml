- id: PMID:30467178
  title: Cap-specific terminal N (6)-methylation of RNA by an RNA polymerase II-associated
    methyltransferase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: |-
      Title matches the cached PubMed record (Akichika et al., Science 2019). Abstract-only cache. This is the
      discovery paper for CAPAM and the source of all three zebrafish IDA rows; the UniProt reference block confirms
      that the zebrafish protein (178-673) was crystallized with SAM and capped RNA and assayed for function,
      catalytic activity and active-site mutagenesis. Its translation-promoting conclusion is contested by later human
      studies (see the UniProt CAUTION note), which is why the ISS translation row is marked over-annotated.
  findings:
  - statement: PCIF1/CAPAM is the cap-specific adenosine methyltransferase responsible
      for N6-methylation of m6Am at the transcription start nucleotide.
    supporting_text: as a cap-specific adenosine methyltransferase (CAPAM) responsible for N 6-methylation of m6Am
  - statement: Crystal structures of CAPAM (the zebrafish construct, per UniProt) with SAM and capped RNA
      defined the basis of cap-specific m6A formation.
    supporting_text: The crystal structure of CAPAM in complex with substrates revealed the molecular basis of cap-specific m6A formation.
  - statement: PCIF1 interacts with the Ser5-phosphorylated RNA polymerase II CTD.
    supporting_text: interacts with the serine-5-phosphorylated carboxyl-terminal domain of RNA polymerase II
  - statement: The paper reports that m6Am promotes translation of capped mRNAs; this conclusion is
      contested by later studies.
    supporting_text: A transcriptome-wide analysis revealed that N 6-methylation of m6Am promotes the translation of capped mRNAs.
    finding_review:
      finding_status: DISPUTED
      review_notes: |-
        Human PCIF1 carries both positive regulation of translation (IMP, this paper) and negative regulation of
        translation (IDA) plus a NOT annotation to regulation of translation, and UniProt records the three
        conflicting outcomes in a CAUTION note.
