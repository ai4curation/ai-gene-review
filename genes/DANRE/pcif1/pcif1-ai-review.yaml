  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      PAINT places nuclear localization at a CAPAM-family node (PTN001094508) seeded by human PCIF1 (Q9H4Z3, nucleus
      by EXP/IDA) and the fly ortholog. Zebrafish Pcif1 retains the same domain architecture, including the WW domain
      that binds the phosphorylated RNA polymerase II CTD, so it inherits the nuclear, co-transcriptional setting of
      the family.
    action: ACCEPT
    reason: |-
      The node placement is sound: the substrate (the first transcribed nucleotide of a capped, nascent mRNA) and the
      interaction partner (Ser5-phosphorylated Pol II CTD) both restrict the enzyme to the nucleus, and the zebrafish
      protein conserves the WW domain (UniProt FT DOMAIN 43..77) and the catalytic domain that was crystallized. No
      zebrafish-specific imaging exists, but nothing about the zebrafish sequence argues for loss or divergence of the
      localization, so the inherited assertion is accepted as a core location.
