- term:
    id: GO:0045727
    label: positive regulation of translation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: |-
      Transferred from human PCIF1, where it rests on one IMP result: transcriptome-wide analysis in PCIF1-knockout
      cells suggested that m6Am promotes translation of the modified mRNAs. Two subsequent human studies reached
      different conclusions, and human PCIF1 now also carries negative regulation of translation (GO:0017148, IDA)
      and a NOT annotation to regulation of translation (GO:0006417, IDA). UniProt flags the disagreement in a
      CAUTION note.
    action: MARK_AS_OVER_ANNOTATED
    reason: |-
      The claim is downstream of the enzyme's actual work (installing m6Am); whether that mark increases, decreases or
      does not change translation is contested even in the source organism, and the sign of the effect is exactly
      what this term asserts. Transferring a disputed directional regulatory term to zebrafish, where no translation
      data exist, over-states what is known. The annotation is not wrong in the sense that Pcif1 writes a mark that
      can influence translation, so it is marked over-annotated rather than removed.
    supported_by:
    - reference_id: PMID:30467178
      supporting_text: A transcriptome-wide analysis revealed that N 6-methylation of m6Am promotes the translation of capped mRNAs.
