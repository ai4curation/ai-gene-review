- description: |-
    Cap-specific mRNA (2'-O-methyladenosine-N6-)-methyltransferase activity in the nucleus: SAM-dependent
    N6-methylation of the first transcribed 2'-O-methyladenosine of m7G-capped mRNAs (m7GpppAm -> m7Gpppm6Am), a
    5'-end maturation step of Pol II transcripts. Demonstrated directly on the zebrafish protein by crystallography
    with SAM and capped RNA, enzyme assays and active-site mutagenesis.
