- id: PMID:25533464
  title: Structural and kinetic basis of steroid 17α,20-lyase activity in teleost fish cytochrome P450
    17A1 and its absence in cytochrome P450 17A2.
  findings:
  - statement: Both zebrafish paralogs hydroxylate C21 steroids; only A1 performs oxidative side-chain
      cleavage, including with b5 present.
    supporting_text: P450 17A2 is more efficient in pregnenolone 17α-hydroxylation but does not catalyze
      the lyase reaction, even in the presence of cytochrome b 5
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text cache read for relevant reaction/assay and gene context. Supports the reaction,
      localization or downstream phenotype described in the annotation review.
- id: PMID:35733778
  title: Characterization of the Interrenal Gland and Sexual Traits Development in cyp17a2-Deficient Zebrafish.
  findings:
  - statement: Genetic loss of native cyp17a2 reduces cortisol and alters interrenal/HPI-axis physiology.
    supporting_text: 'The significantly decreased cortisol concentration was observed

      both in the cyp17a2-deficient males and females at adult stage.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text knockout study read; cortisol was assayed in whole-body extracts. Gonadal
      expression is not recast as adrenal-specific.
