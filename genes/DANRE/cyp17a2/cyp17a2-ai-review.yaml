id: A7U483
gene_symbol: cyp17a2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: Zebrafish Cyp17a2 is a membrane-associated heme cytochrome P450 that hydroxylates pregnenolone
  and progesterone at C17. Unlike Cyp17a1, it does not catalyze the subsequent 17,20-lyase reaction, even
  in the presence of cytochrome b5. It supplies 17alpha-hydroxysteroid precursors for cortisol synthesis
  in the interrenal gland and is also expressed in gonads. Loss of cyp17a2 reduces cortisol and perturbs
  interrenal feedback physiology.
