taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: slc5a12 encodes SMCTn (sodium-coupled monocarboxylate transporter 2, SLC5A12), a member
  of the SLC5 sodium/solute symporter family. It is a multi-pass, apically located plasma-membrane 
  transporter that couples the inward sodium electrochemical gradient to the uptake of short-chain 
  monocarboxylates - lactate, pyruvate, nicotinate, propionate, butyrate and the ketone body 
  beta-D-hydroxybutyrate. Unlike its electrogenic paralog SMCTe (Slc5a8/SLC5A8), zebrafish SMCTn is 
  electroneutral (monocarboxylate uptake raises intracellular sodium but produces no measurable 
  current) and lower-affinity (Km for lactate ~1.8 mM). In zebrafish embryos it is expressed in 
  brain, eyes, intestine and kidney, with kidney expression in the pronephric tubules and additional
  expression in exocrine pancreas and swim bladder; in mammals the orthologous transporter mediates 
  electroneutral Na+/lactate cotransport in the renal proximal tubule.
