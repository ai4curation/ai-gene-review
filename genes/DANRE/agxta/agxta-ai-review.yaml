suggested_questions:
- question: Is Agxta peroxisomal in zebrafish hepatocytes, and is the C-terminal SRV sufficient for import by
    zebrafish Pex5, or does it need internal ancillary signals as human AGT does?
- question: Did the split of targeting signals between agxta (PTS1-like end only) and agxtb (MTS only) happen once
    before the teleost radiation, or several times? The arowana agxta orthologue still has an Arg-rich N-terminal
    extension.
- question: Does loss of agxta cause hyperoxaluria or kidney calcium oxalate deposits in zebrafish, and does agxtb
    compensate?
suggested_experiments:
- hypothesis: The two copies are targeted to different organelles.
  description: Express GFP-tagged Agxta (C-terminal tag left free by tagging at the N-terminus) and Agxtb (tag at the
    C-terminus) in zebrafish liver or cultured fish cells with peroxisomal (SKL) and mitochondrial markers; swap the
    C-terminal tripeptides and N-terminal extensions between the copies.
  experiment_type: subcellular localization
- hypothesis: Peroxisomal Agxta is needed to prevent oxalate formation.
  description: Generate agxta, agxtb and double mutants (preferably promoter-deletion alleles to avoid transcriptional
    adaptation) and measure urinary/whole-larva oxalate, glycolate and glycine, and kidney crystal deposition after a
    glycolate or hydroxyproline load.
  experiment_type: knockout phenotyping
