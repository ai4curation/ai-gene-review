  review:
    summary: Peroxisome propagated from node PTN000475539, seeded by human AGXT and rat Agxt.
    action: ACCEPT
    reason: Of the two zebrafish copies, agxta is the one that fits this location. It ends in SRV, which a survey of
      the zebrafish peroxisomal proteome classed as a weak PTS1, and it has no N-terminal extension; its transcript
      has an in-frame stop 16 codons upstream of the start, so it cannot make an MTS-bearing isoform. Freshwater-fish
      liver AGT is found partly in peroxisomes. The call is a prediction from sequence; zebrafish Agxta has not been
      localized, and C-terminal tripeptides of this kind (SRV) have not been tested as PTS1 in fish.
    supported_by:
    - reference_id: PMID:35295584
      supporting_text: Zebrafish also contains a putative peroxisomal alanine:glyoxylate aminotransferase (AGT) (Agxta,
        F1QY24 _DANRE) with a weak PTS1 (SRV), a key enzyme to prevent oxalate accumulation (Table 1 and Supplementary
        Table S3).
    - reference_id: PMID:8954944
      supporting_text: The present report describes that hepatic alanine:glyoxylate aminotransferase is located both
        in the peroxisomes and in the mitochondria in fresh water fish
    - reference_id: file:DANRE/agxta/agxta-bioinformatics/RESULTS.md
