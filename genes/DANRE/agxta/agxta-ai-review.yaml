    summary: Glycine biosynthetic process propagated from the AGT node PTN000475663.
    action: ACCEPT
    reason: The AGT reaction forms glycine from glyoxylate and alanine, so the enzyme catalyses a step of glycine
      formation. This is the direct product of the conserved activity and applies to both zebrafish copies. The more
      specific term for glycine formation by transamination of glyoxylate (GO:0019265) is obsolete, so this term is
      the appropriate one.
