    summary: Glyoxylate catabolic process propagated from PTN000475663.
    action: ACCEPT
    reason: Removing glyoxylate before it is oxidized to oxalate is the physiological role of AGT. In fish, glyoxylate
      is also the end product of hepatic purine breakdown in peroxisomes, which fits a peroxisomal copy. Core process,
      shared with agxtb (which would act on mitochondrial glyoxylate).
    supported_by:
    - reference_id: PMID:8954944
      supporting_text: The end products of purine degradation are urea and glyoxylate in fish.
    - reference_id: PMID:35295584
      supporting_text: This prevents the conversion of glyoxylate into oxalate, which is toxic.
core_functions:
- description: PLP-dependent alanine:glyoxylate (and serine:pyruvate) aminotransferase predicted to act in
    peroxisomes, converting glyoxylate to glycine and so preventing oxalate formation; the peroxisomal-signal copy of
    the zebrafish pair (C-terminal SRV, no N-terminal targeting sequence). Location and activity are inferred from
    sequence and orthology; not measured in zebrafish.
