id: Q6DG86
gene_symbol: agxta
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: agxta (alanine--glyoxylate aminotransferase a) is one of two zebrafish co-orthologs of vertebrate AGXT,
  retained from the teleost-specific genome duplication; its paralog is agxtb. It encodes a pyridoxal 5'-phosphate
  dependent class-V aminotransferase that is predicted to transaminate glyoxylate with L-alanine to glycine and
  pyruvate, and L-serine with pyruvate to hydroxypyruvate and L-alanine. In vertebrates this enzyme detoxifies
  glyoxylate, the precursor of oxalate, and its organelle location (peroxisomes, mitochondria or both) varies between
  species through an N-terminal mitochondrial targeting sequence and a C-terminal peroxisomal targeting signal. agxta
  keeps the catalytic lysine and substrate-binding arginine, ends in a C-terminal tripeptide (SRV) that resembles a
  weak peroxisomal targeting signal, and has no N-terminal extension or upstream start codon, so it is predicted to be
  the peroxisomal copy; agxtb carries the mitochondrial-type N-terminal signal instead. agxta is expressed in larval
  and adult liver, pronephric duct and kidney, intestine and spleen. No functional study of the zebrafish protein has
  been published.
