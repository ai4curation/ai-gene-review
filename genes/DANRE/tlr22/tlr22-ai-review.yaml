  label: Danio rerio
description: 'Toll-like receptor of the fish-specific TLR22 group, found in aquatic vertebrates
  and absent from tetrapods. The protein has the canonical architecture of the family: a signal
  peptide, a leucine-rich-repeat ectodomain with a cysteine-rich flanking region, a single transmembrane
  segment and a cytoplasmic TIR domain, and it belongs phylogenetically to the branch containing
  TLR21 and mouse TLR13 rather than to any mammalian receptor''s orthology group. In zebrafish
  its transcript is found mainly in spleen and kidney and is raised by exposure to unrelated microbial
  products including lipopolysaccharide, peptidoglycan and double-stranded RNA, and its leucine-rich
  repeats carry signatures of positive selection at several sites, consistent with ongoing diversification
  of ligand recognition. The function of the receptor is best characterised in another teleost,
  fugu, where TLR22 detects long double-stranded RNA at the cell surface and signals through the
  TICAM-1 adaptor to induce interferon and confer resistance to aquatic RNA viruses, a role proposed
  to substitute for cell-surface TLR3 in fish. Whether the zebrafish protein has the same ligand
  and adaptor has not been tested.'
