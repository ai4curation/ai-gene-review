  review:
    summary: The gene is an unambiguous Toll-like receptor, so the TLR-specific child of this
      term is the right level; no receptor-numbered term exists for TLR22.
    action: MODIFY
    reason: 'GO:0002221 is correct but is the parent shared with the NOD-like and RIG-I-like receptor
      pathways, and nothing about this gene suggests either of those: the domain architecture
      (leucine-rich repeats, transmembrane segment, TIR domain), the UniProt family assignment
      and the phylogenetic placement beside zebrafish tlr21, tlr5b and tlr3 all make it a Toll-like
      receptor. GO:0002224 is therefore the informative level. This is also the answer to the
      project''s question about which pathway term fits TLR22: GO has numbered terms for TLR1-13,
      15 and 21 but none for TLR22, and none should be requested yet, because for the zebrafish
      protein neither ligand nor adaptor has been demonstrated and the gene''s naming is unstable
      (its own synonym is TLR21.2). The evidence behind this row is transcript modulation rather
      than signalling, so the annotation is retained at family level rather than promoted further.'
