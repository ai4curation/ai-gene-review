    action: UNDECIDED
    reason: 'The cached publication is abstract-only. The abstract states that this gene was among
      the transcripts monitored by real-time RT-PCR after Listonella anguillarum inoculation,
      and singles out other genes as induced without saying anything about this one; it also emphasises
      wide interindividual variation in the measurements. The ZFIN curator will have had the figures
      and may have seen clear induction, so the annotation is not removed or marked as over-annotated
      on the strength of an abstract. Two further considerations argue for leaving it open rather
      than accepting it: transcript induction alone is weak evidence for participation in a response
      process, and the only characterised ligand of a TLR22 protein in any species is double-stranded
      RNA, which would make a viral rather than a bacterial role the expected one. A curator with
      the full text should settle it.'
