suggested_questions:
- question: 'Should GO create a toll-like receptor 22 signaling pathway term? This review says
    not yet: GO:0002224 is the right level while the zebrafish receptor''s ligand and adaptor
    are undemonstrated, the fish tlr21/tlr22/tlr23 names are unstable (this gene''s own synonym
    is TLR21.2), and a term defined by receptor name alone would add nothing. Once ligand and
    adaptor are established, a term modelled on GO:0035682 would be worthwhile.'
- question: Does zebrafish tlr22 recognise long double-stranded RNA, as the fugu protein does?
    This is the single measurement that would change this gene's annotation the most, converting
    family-level statements into a specific recognition activity and an interferon-directed process.
- question: Which adaptor does it use? The fugu receptor signals through TICAM-1 (TRIF) rather
    than MyD88, which is unusual in this branch of the family and would need confirming in zebrafish
    before any MyD88-dependent pathway term were considered.
- question: What does the GO:0009617 row actually rest on? The cited study is abstract-only in
    this repository and the abstract does not report this transcript's behaviour; a curator with
    the figures could confirm, correct or retire the annotation.
- question: Is the positive selection detected in the leucine-rich repeats accompanied by functional
    divergence between tlr22 alleles or between species? If so, ligand specificity may not be
    safely transferable even between teleosts, which would bear directly on how far any TLR22
    annotation should propagate.
suggested_experiments:
- description: 'Test ligand specificity of the zebrafish receptor directly: express it in zebrafish
    and mammalian cells, with and without zebrafish UNC93B1, and stimulate with long and short
    double-stranded RNA, poly(I:C), lipopolysaccharide, peptidoglycan, flagellin and CpG oligodeoxynucleotides,
    reading NF-kappa-B and interferon-stimulated response element reporters.'
  hypothesis: Zebrafish tlr22 recognises long double-stranded RNA and signals to interferon, as
    its fugu orthologue does, which would justify specific recognition and pathway annotations
    that cannot be made now.
  experiment_type: ligand specificity assay
- description: 'Determine the adaptor requirement and localisation: co-express the receptor with
    zebrafish ticam1 and myd88, test loss of each for effect on the dsRNA response, and image
    a tagged receptor for surface versus intracellular distribution.'
  hypothesis: The receptor acts at the cell surface through TICAM-1, unlike the MyD88-dependent
    intracellular receptors of the same branch.
  experiment_type: adaptor dependence and localisation
- description: Generate zebrafish lacking tlr22 and challenge them with an aquatic RNA virus and
    with a Gram-negative bacterial pathogen, measuring interferon and inflammatory responses and
    survival, so that the viral and bacterial hypotheses are tested in the same animals.
  hypothesis: Loss of the receptor impairs antiviral rather than antibacterial defence, which
    would also indicate whether the existing response-to-bacterium annotation should stand.
  experiment_type: loss-of-function genetics with infection challenge
