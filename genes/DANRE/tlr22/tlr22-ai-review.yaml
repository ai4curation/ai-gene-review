core_functions:
- description: Toll-like receptor of the fish-specific TLR22 group, expressed in immune tissues
    and inducible by microbial products, whose TIR domain places it in the Toll-like receptor
    signalling pathway; its ligand and adaptor are established only for the fugu orthologue (long
    double-stranded RNA, TICAM-1-dependent interferon induction) and remain untested in zebrafish,
    so no molecular function is asserted here
