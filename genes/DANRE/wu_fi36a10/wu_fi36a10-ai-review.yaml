description: 'wu:fi36a10 (ZFIN ZDB-GENE-030131-6139, chromosome 23; NCBI and RefSeq symbol magi3a) is one of two zebrafish
  co-orthologs of vertebrate MAGI3; PANTHER places the duplication at the teleost genome duplication. Its paralog is magi3b.
  It encodes a cytoplasmic membrane-associated guanylate kinase with inverted domain order (MAGI): an N-terminal PDZ domain,
  a guanylate kinase-like (GK) domain that lacks the nucleotide-binding P-loop and serves as a protein-interaction module
  rather than an enzyme, two WW domains, five further PDZ domains and a long disordered C-terminal tail. MAGI proteins scaffold
  receptors and signalling proteins at the cytoplasmic face of cell-cell junctions. In a genome-wide yeast two-hybrid screen
  the zebrafish protein (reported as Magi3a) bound the C-terminal ETTV PDZ-binding motif of the Wnt7 co-receptor Gpr124. The
  gene is expressed in endothelial cells, and F0 crispants have reduced brain vascularization that phenocopies loss of that
  motif, as do magi3b crispants. Public RNA-Seq calls cover a broad range of embryonic and adult tissues, as for the single
  gar magi3 gene, and are more extensive than those of magi3b. Of the two copies it is the closer in sequence to gar and human
  MAGI3.'
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000400325
  review:
    summary: Nucleotide binding from UniRule UR000400325 (MAGUK guanylate kinase-like domain).
    action: REMOVE
    reason: 'UniRule UR000400325 transfers the guanylate-kinase chemistry of the GK fold to all MAGUKs. MAGI-family GK domains
      are degenerate: they lack the LID and CORE subdomains, and in wu:fi36a10 (as in magi3b, gar and human MAGI3) the segment
      that UniProt labels as the ATP-binding site has no Walker A/P-loop motif. The GK domain of MAGIs is a phosphopeptide-binding
      module, not a kinase. No kinase or nucleotide-binding activity has been shown for any MAGI protein. This is a family-level
      IEA overextension to a pseudoenzyme domain.'
