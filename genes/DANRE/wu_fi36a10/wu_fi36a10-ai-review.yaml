core_functions:
- description: Cytoplasmic PDZ/WW scaffold at cell-cell junctions. It binds the C-terminal ETTV PDZ-binding motif of the Wnt7
    co-receptor Gpr124 and, with magi3b, is needed for Gpr124-dependent brain angiogenesis (crispant epistasis). No catalytic
    activity.
