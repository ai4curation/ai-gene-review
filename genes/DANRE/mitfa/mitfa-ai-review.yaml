gene_symbol: mitfa
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: >-
  mitfa (nacre) encodes microphthalmia-associated transcription factor a, a basic
  helix-loop-helix leucine zipper (bHLH-LZ) transcription factor of the MiT/TFE family and
  one of two zebrafish co-orthologs of human MITF that arose in the teleost genome
  duplication (the other is mitfb). The 412-residue protein carries the MiT/TFE N-terminal
  region, the bHLH-LZ DNA-binding and dimerization domain and the MiT/TFE C-terminal region,
  and resembles the melanocyte-specific M isoform of mammalian MITF. mitfa is expressed in
  all embryonic melanogenic cells, including neural crest melanoblasts and the retinal
  pigment epithelium (RPE), and is the master transcriptional regulator of neural
  crest-derived melanophore (melanocyte) development: nacre null mutants lack melanophores
  throughout life, have supernumerary iridophores, and misexpression of mitfa induces ectopic
  melanized cells. Temperature-sensitive alleles show that mitfa is needed at several steps of
  melanophore differentiation (dct onset, progression to pigmentation and maintenance of
  dendritic form) but not to establish melanocyte stem cells. mitfa acts in parallel with
  TFAP2 factors and represses tfec in melanoblasts, biasing multipotent pigment progenitors
  away from the iridophore fate. mitfa is not required for RPE development, where it is
  redundant with mitfb and tfec; with tfec it is required in cranial neural crest cells for
  choroid (optic) fissure closure, and with mitfb and tfec it contributes to xanthophore
  development.
