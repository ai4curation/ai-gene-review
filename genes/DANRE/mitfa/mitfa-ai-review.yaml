    cell differentiation and retinal epithelium pigmentation in teleosts.
  findings:
  - statement: mitfa, mitfb and tfec are jointly required for RPE pigmentation (triple null).
    supporting_text: simultaneous null mutations in all three genes cause a complete loss of all four chromatophore types and lead to defective pigmentation of the retinal pigmented epithelium (RPE)
core_functions:
- description: >-
    mitfa is the master bHLH-LZ transcription factor of the zebrafish neural crest melanophore
    lineage. It binds cis-regulatory DNA in the nucleus and activates melanogenic genes
    such as dct, and it is required cell autonomously at several steps of melanophore
    differentiation.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0030318
    label: melanocyte differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10433906
    supporting_text: Homozygous nacre (nac(w2)) mutants lack melanophores throughout development but have increased numbers of iridophores.
  - reference_id: PMID:21146516
    supporting_text: mitfa is required at several stages of melanocyte differentiation, including for expression of the early melanoblast marker dct
suggested_questions:
- question: >-
    Is mitfa's contribution to xanthophore development direct (cell-autonomous activation of
    pteridine-pathway genes such as gch2 in xanthoblasts, as shown in medaka) or indirect
    through tfec cross-regulation?
- question: >-
    Does the IDA circadian rhythm annotation from PMID:26278158 rest on anything beyond
    diurnal variation of mitfa transcript levels?
- question: >-
    Since mitfa, mitfb and tfec are jointly required for RPE pigmentation (PMID:42663426), which
    of the three normally carries most of the RPE melanogenic transcription in wild type?
suggested_experiments:
- hypothesis: mitfa directly regulates xanthophore pigment-synthesis genes in zebrafish.
  description: >-
    Lineage-restricted CUT&RUN or ChIP-seq for tagged Mitfa in sorted xanthoblasts, combined
    with RNA-seq of mitfa;mitfb double mutant xanthophores, to test direct binding at gch2 and
    other pteridine-pathway loci.
  experiment_type: genomics
