- term:
    id: GO:0050936
    label: xanthophore differentiation
  evidence_type: IGI
  original_reference_id: PMID:37823232
  review:
    summary: >-
      NEW (proposed). mitfa contributes, redundantly with mitfb and tfec, to xanthophore
      development. mitfa;mitfb double nulls have fewer xanthophores than mitfa single mutants
      in two independent studies, and a dominant-negative DNA-binding-domain mitfa allele
      eliminates xanthophores through interference with Tfec.
    action: NEW
    reason: >-
      Participation: MiT factors directly activate xanthophore pigment genes (gch2) in the
      lineage, so mitfa does part of the work as a transcription factor, not merely as a
      prerequisite. Proposed equally for mitfb, since the evidence is from double mutants and
      applies to both copies.
    supported_by:
    - reference_id: PMID:37823232
      supporting_text: the results suggest that in zebrafish xanthophore development may be partially dependent on Mitf function
    - reference_id: PMID:40123122
      supporting_text: Our findings point to collaborative roles for Mitfa and Tfec in promoting chromatophore development, particularly in xanthophore lineages
