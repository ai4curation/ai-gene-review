suggested_questions:
- question: Can Tmc2a substitute for Tmc2b in the lateral-line hair cells that depend absolutely on Tmc2b (e.g.
    anterior-facing cells of posterior neuromasts) if it is expressed there? This would decide whether the pair
    split by expression only.
- question: What sets the Tmc2b-independent residual transduction in neuromasts IO4, SO1 and SO3, given that tmc2a
    is barely detectable in the lateral line by in situ hybridization?
- question: Is the reduced neuromast hair-cell number in tmc2b mutants a general consequence of lost transduction,
    or a Tmc2b-specific role in hair-cell maintenance?
suggested_experiments:
- hypothesis: Tmc2a and Tmc2b proteins are interchangeable and the pair differs only in expression.
  description: Express Tmc2a under the tmc2b regulatory region (or a lateral-line-specific driver) in tmc2b mutants
    and score dye uptake and microphonics in posterior neuromasts.
  experiment_type: cross-rescue
- hypothesis: The utricular low-frequency role of Tmc2b reflects its extrastriolar expression rather than channel
    properties.
  description: Compare MET current kinetics and adaptation in extrastriolar hair cells of tmc1/tmc2a double mutants
    (Tmc2b only) and striolar cells of tmc1/tmc2b double mutants (Tmc2a only).
  experiment_type: electrophysiology
