gene_symbol: tmc2b
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7955
  label: Danio rerio
description: 'tmc2b (transmembrane channel-like 2b) is one of two zebrafish co-orthologs of vertebrate TMC2, the
  other being tmc2a; it lies on chromosome 5 about 5 kb from tmc1. Tmc2b is a multi-pass membrane protein of the
  TMC family and a pore-forming subunit of the hair-cell mechanoelectrical transduction (MET) channel, a non-selective,
  calcium-permeable cation channel opened by tip-link tension. GFP-tagged Tmc2b localizes to the tips of stereocilia,
  and its delivery to the hair bundle requires Tomt and Tmie. tmc2b is expressed only in sensory hair cells: it
  is the dominant Tmc transcript in lateral-line neuromasts and, in the inner ear, is expressed with tmc1 in peripheral
  (extrastriolar) hair cells. Tmc2b is required for mechanotransduction in most lateral-line hair cells, with Tmc2a
  supplying the rest, and is the main contributor to utricular (vestibular) function at low frequencies; in the
  saccule it contributes to hearing behind Tmc2a. A hair-cell Tmc2b transgene restores transduction, hearing and
  balance in larvae lacking tmc1, tmc2a and tmc2b.'
