description: sh3glb2b (SH3-domain GRB2-like endophilin B2b) is one of two zebrafish co-orthologs of vertebrate SH3GLB2 (endophilin-B2),
  retained from the teleost genome duplication; its paralog is sh3glb2a. It encodes a cytoplasmic protein with an N-terminal
  membrane-binding amphipathic helix, an N-BAR domain that senses and induces membrane curvature and mediates homo- and heterodimerization,
  and a C-terminal SH3 domain; several splice isoforms differ by insertions in the BAR domain and the linker. In mammals endophilin-B2
  promotes trafficking of endocytic vesicles and autophagosomes to late endosomes and lysosomes and, together with endophilin-B1,
  mitophagy; the knockout mouse is viable. The zebrafish protein keeps all these domains. sh3glb2b is strongly maternal, is
  detected in the embryonic central nervous system and eye by in situ hybridization, and is broadly expressed in adult tissues.
  No functional study of the zebrafish gene has been published.
