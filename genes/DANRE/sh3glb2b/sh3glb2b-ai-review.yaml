suggested_questions:
- question: Is the PANTHER subfamily split (sh3glb2a in PTHR14167:SF68 'DREBRIN-LIKE PROTEIN-RELATED', sh3glb2b in SF106 'ENDOPHILIN-B2')
    a classification artefact? The sh3glb2a protein keeps the full endophilin-B2 architecture, and its misplacement removes
    all IBA rows from it.
- question: Does the strong maternal load of sh3glb2b and the blastula-only peak of sh3glb2a reflect a temporal split of an
    ancestral early-embryo expression, or independent drift? Gar embryo time-course data would test this.
suggested_experiments:
- hypothesis: sh3glb2a and sh3glb2b are functionally redundant in endosome maturation.
  description: Make single and double mutants (including RNA-less alleles to avoid transcriptional adaptation) and measure
    endosome acidification, EGFR or dextran trafficking to lysosomes, and autophagic flux in larval tissues; cross-rescue
    each mutant with the other copy's mRNA.
  experiment_type: genetic interaction
- hypothesis: The copies differ only in expression level.
  description: Quantify both transcripts across tissues and single-cell atlases, and compare with gar SH3GLB2 expression to
    test for quantitative subfunctionalization.
  experiment_type: expression analysis
