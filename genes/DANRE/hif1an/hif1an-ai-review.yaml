  original_reference_id: GO_REF:0000033
  review:
    summary: 'regulation of vascular endothelial growth factor receptor signaling pathway: Fih1an modulates
      VEGF signaling indirectly, by hydroxylating HIF-alpha and thereby limiting transcription of vegfa.'
    action: KEEP_AS_NON_CORE
    reason: This is a downstream regulatory consequence of the hydroxylase activity, not work Fih1an
      performs within VEGFR signaling itself. In zebrafish, fih-1 knockdown raises vegf-aa165 and 
      produces ectopic vessels, so the regulatory link is real but indirect (PMID:25347788).
