  label: Inovirus M13
description: >-
  Single-stranded DNA-binding protein G5P (pV, 87 residues), an OB-fold homodimer
  that regulates the switch from double-stranded replicative form (RF) synthesis
  to progeny single-stranded (+)DNA production and forms the intracellular
  pre-extrusion nucleoprotein filament. During rolling-circle viral DNA replication
  in the Escherichia coli cytoplasm, ~1,500 pV homodimers bind highly cooperatively
  and without sequence specificity to newly displaced viral (+)ssDNA strands,
  blocking complementary (-)-strand synthesis and collapsing the circular genome
  into a flexible left-handed helical nucleoprotein rod with the hairpin packaging
  signal exposed at one end. The pV-ssDNA complex subsequently docks onto the
  cytoplasmic face of the inner-membrane pI/pXI assembly machine, where pV dimers
  are displaced by membrane-embedded coat protein pVIII as the virion is extruded.
