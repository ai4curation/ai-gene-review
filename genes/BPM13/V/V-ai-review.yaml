core_functions:
- description: >-
    Cooperatively binds newly synthesized viral (+)ssDNA as an OB-fold homodimer to
    prevent complementary (-)-strand synthesis during rolling-circle viral DNA
    replication and to organize the circular single-stranded genome into an
    elongated nucleoprotein filament that docks onto the inner-membrane pI/pXI
    assembly complex prior to coat protein replacement.
