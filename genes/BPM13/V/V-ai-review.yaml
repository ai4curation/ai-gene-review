suggested_questions:
- question: >-
    How does the pI/pXI inner-membrane assembly motor strip cooperatively bound pV
    homodimers from the viral (+)ssDNA and coordinate their replacement by
    membrane-embedded pVIII subunits?
- question: >-
    What structural features exclude pV dimers from covering the hairpin packaging
    signal at the tip of the intracellular pV-ssDNA nucleoprotein filament?
suggested_experiments:
- description: >-
    Perform single-molecule optical tweezers force-spectroscopy and fluorescence
    uncoating assays measuring pV displacement from M13 ssDNA in the presence of
    reconstituted pI/pXI proteoliposomes and ATP.
- description: >-
    Determine the cryo-EM structure of the packaging-signal end of the native M13
    pV-ssDNA complex docked onto the cytoplasmic ring of the pI/pXI assembly machine.
