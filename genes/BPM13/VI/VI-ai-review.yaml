  review:
    summary: Over-propagated keyword annotation; host F-pilus attachment is mediated specifically by the surface-exposed N2
      domain of pIII, whereas pVI is mostly buried within the proximal capsid tip and has no pilus-binding domain.
    action: REMOVE
    reason: 'Cryo-EM structures of the M13 proximal tip (PDB: 8IXK, 8JWX) and biochemical studies show that pVI forms a hydrophobic
      adapter ring anchoring the C-terminal domain of pIII to the pVIII capsid tube and terminating viral extrusion, while
      pilus binding is performed exclusively by pIII.'
    supported_by:
