      copies of G6P in the mature virion. They are located together with G3P at the head side of the filamentous virion.
suggested_questions:
- question: How does the multi-pass transmembrane topology of pVI in the Escherichia coli inner membrane rearrange into the
    elongated alpha-helical bundle observed in the cryo-EM structure of the mature proximal virion tip?
- question: Does pVI directly catalyse membrane scission during the terminal step of viral extrusion, or does it act by sterically
    blocking further lateral entry of pVIII subunits into the pI/pXI assembly ring?
suggested_experiments:
- description: Perform site-directed spin labeling and EPR spectroscopy on inner-membrane-embedded pVI versus mature virion-incorporated
    pVI to map topological rearrangements during phage extrusion.
- description: Analyze arrest intermediates of M13 assembly in cells expressing C-terminally or N-terminally mutated pVI variants
    by cryo-electron tomography.
