taxon:
  id: NCBITaxon:1977402
  label: Inovirus M13
description: Minor coat protein G6P (pVI, 112 residues), a hydrophobic multi-pass membrane protein present in five copies
  at the proximal (head/adsorption) tip of the mature bacteriophage M13 virion. Prior to virion incorporation, pVI resides
  as an integral transmembrane protein in the Escherichia coli inner membrane. At the conclusion of filamentous virion assembly
  and extrusion, five subunits of pVI co-assemble with five subunits of the attachment protein pIII and interface with the
  terminal pentameric layer of major coat protein pVIII to form the proximal tip complex, which is essential for terminating
  phage assembly and releasing the mature virion from the host cell membrane.
