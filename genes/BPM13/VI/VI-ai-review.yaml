core_functions:
- description: Forms a homopentameric minor coat adapter ring with pIII at the proximal ("pointy") tip of the filamentous
    virion that connects the pIII C-terminal domain to the pVIII helical capsid and mediates termination and release of the
    nascent phage particle from the host inner membrane during viral extrusion.
