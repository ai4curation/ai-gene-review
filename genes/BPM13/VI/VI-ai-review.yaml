  - statement: G6P (pVI) complexes with G3P (pIII) to terminate filamentous phage assembly and budding from the host cell.
    record_section: ["CC:FUNCTION"]
    supporting_text: Plays essential roles both in the entry of the viral genome into the bacterial host and in budding process
      (Probable). The formation of the G3P-G6P complex termed adsorption complex is essential for correct termination of filamentous
      phage assembly (PubMed:37669979).
  - statement: Prior to virion assembly, G6P is an integral protein of the bacterial host inner membrane, and five copies
      of G6P assemble with G3P at the proximal (head) tip of the mature virion.
    record_section: ["CC:SUBCELLULAR LOCATION"]
