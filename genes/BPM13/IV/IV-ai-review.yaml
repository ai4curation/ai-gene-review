id: P03665
gene_symbol: IV
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1977402
  label: Inovirus M13
description: >-
  Outer-membrane virion export secretin G4P (pIV), which assembles into a gated
  15-subunit transmembrane channel across the Escherichia coli outer membrane to
  serve as the exit conduit for non-lytic filamentous phage extrusion. Synthesized
  as a 426-residue precursor with a 21-residue N-terminal signal peptide cleaved
  upon Sec-dependent export to the periplasm, mature pIV (residues 22-426) belongs
  to the bacterial type II/III secretion system secretin family. Its C-terminal
  domain forms a 60-stranded oligomeric beta-barrel pore (~13.5 nm outer diameter
  with a gated ~6-9 nm central lumen) in the host outer membrane, while its
  periplasmic N-terminal domains project across the periplasm to dock with the
  inner-membrane pI/pXI (G1P/G11P) ATPase assembly complex, allowing nascent M13
  filaments to be extruded continuously across both bacterial membranes without
  lysing the host cell.
