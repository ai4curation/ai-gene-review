  findings:
  - statement: >-
      G4P (pIV) forms a gated 15-subunit channel across the host outer membrane
      through which newly assembled filamentous phage particles are extruded.
    supporting_text: >-
      Acts in the assembly and extrusion of the bacteriophage by forming a channel across the host outer membrane. This channel is just large enough to allow a newly synthesized phage particle to pass through (13.5 nm in diameter and 22-24 nm in length with an inner pore of about 9 nm).
  - statement: >-
      G4P is localized to the host cell outer membrane and interacts via its
      periplasmic N-terminus with the inner-membrane G1P-G11P complex.
    supporting_text: >-
      SUBCELLULAR LOCATION: Host cell outer membrane {ECO:0000250|UniProtKB:P03666}; Single-pass type I membrane protein {ECO:0000305}.
suggested_questions:
- question: >-
    How is the central periplasmic gate of the C15-symmetric pIV secretin opened
    upon engagement with the emerging pVII/pIX virion tip and the likely hexameric
    pI/pXI inner-membrane complex?
- question: >-
    Which host outer-membrane biogenesis factors (such as the BAM complex or Lol
    system) mediate the targeting and beta-barrel assembly of M13 pIV in
    Escherichia coli?
suggested_experiments:
- description: >-
    Solve the cryo-electron tomography or single-particle cryo-EM structure of a
    trans-envelope pI/pXI-pIV complex stalled with an extruding M13 mini-phage
    particle to visualize gate opening and symmetry mismatch accommodation.
- description: >-
    Assay pIV outer-membrane insertion and multimerization in E. coli strains
    carrying conditional mutations in bamA/bamD and periplasmic chaperones SurA and Skp.
