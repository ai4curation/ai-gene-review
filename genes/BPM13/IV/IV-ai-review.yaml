  review:
    summary: >-
      InterPro domain mapping from the bacterial secretin superfamily (`IPR004846`);
      in phage M13, pIV specifically mediates extrusion of assembled nucleoprotein
      virions (`GO:0099045`) rather than cellular protein secretion.
    action: MODIFY
    reason: >-
      Although pIV is homologous to bacterial type II/III secretion system GspD/PilQ
      secretins, its biological function in the M13 lifecycle is specifically the
      trans-outer-membrane export of nascent filamentous phage particles, captured
      by viral extrusion (GO:0099045).
    proposed_replacement_terms:
    - id: GO:0099045
      label: viral extrusion
