id: P69538
gene_symbol: IX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1977402
  label: Inovirus M13
description: Minor coat protein G9P (pIX, 32 residues), a single-pass transmembrane peptide that forms a C5-symmetric outer
  pentameric ring around the central pentameric plug of pVII at the distal (tail/round) tip of the filamentous bacteriophage
  M13 virion. Prior to virion incorporation, pIX inserts into the Escherichia coli inner membrane via a YidC-dependent pathway.
  At the initiation of phage morphogenesis, pIX and pVII enter the inner-membrane pI/pXI assembly machine laterally, interact
  with the viral (+)ssDNA packaging signal, and form the rounded distal cap that interfaces with the first pentameric layer
  of major coat protein pVIII and emerges first from the bacterial host cell during viral extrusion.
