- id: file:BPM13/IX/IX-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P69538 (G9P_BPM13)
  publication_type: DATABASE
  findings:
  - statement: G9P (pIX) and G7P (pVII) initiate concomitant virion assembly and extrusion at the host inner membrane by interacting
      with the viral genome packaging signal and form the distal tip that emerges first from the bacterial host.
    supporting_text: May initiate with G7P the virion concomitant assembly-budding process, by interacting with the packaging
      signal of the viral genome. The assembly-budding takes place at the host inner membrane. In turn, G7P and G9P are present
      at the end of the filamentous virion that emerges first from the bacterial host.
  - statement: G9P interacts with G7P and G8P to form the rounded distal tail tip of the filamentous virion and is localized
      to the bacterial inner membrane prior to assembly.
    supporting_text: Interacts with G7P; this interaction allows integration of G7P and G9P into the virion tail round tip.
      Interacts with capsid protein G8P; this interaction forms the G7P/G9P round tip of the virion.
  - statement: Prior to virion assembly, G9P is associated with the bacterial host inner membrane.
    supporting_text: Prior to assembly, is found associated with the bacterial host inner membrane. There are about five copies
      of this protein per mature phage that are located on the tail side of the filamentous virion with G7P (By similarity).
suggested_questions:
- question: How does the ~13-degree central bend in the pIX alpha-helix nucleate the helical pitch and C5 symmetry of the
    first pentameric ring of pVIII major coat proteins during assembly initiation?
- question: What determines the requirement of pIX for the host YidC insertase during inner-membrane insertion, given that
    the similarly sized distal tip partner pVII inserts spontaneously?
suggested_experiments:
- description: Compare YidC-mediated membrane insertion kinetics of pIX, pVII, and chimeric pVII/pIX peptides in reconstituted
    YidC proteoliposomes.
- description: 'Mutate residues at the pIX-pVIII interface identified in the 3.5 Angstrom cryo-EM distal tip structure (PDB:
    8IXL) and quantify phage assembly initiation efficiency in vivo.'
