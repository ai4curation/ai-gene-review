- description: Major structural subunit (~2,700 copies per virion) that is stored as a single-pass transmembrane helix in
    the host inner membrane and laterally incorporates into the assembling virion during viral extrusion to form the gently
    curved alpha-helical capsid tube encapsulating the circular (+)ssDNA genome.
