  findings:
  - statement: G8P (pVIII) self-assembles into a 6 nm-wide Class I filamentous helical capsid (~16 Angstrom axial rise and
      ~36 degree twist) wrapping the viral genomic DNA.
    supporting_text: Self assembles to form a helical capsid wrapping up the viral genomic DNA. The capsid is made of gently-curved
      alpha-helix rods and displays a filamentous structure with a length of 760-1950 nm and a width of 6 nm (By similarity).
  - statement: Prior to virion assembly, mature G8P is stored in the bacterial host inner membrane before ~2,700 copies assemble
      into the phage capsid.
    supporting_text: Prior to assembly, the major capsid protein is found associated with the bacterial host inner membrane.
      The capsid is composed of approximately 2700 copies of the capsid protein G8P (Probable).
suggested_questions:
- question: How does the L-shaped membrane-bound conformation of mature pVIII in the Escherichia coli inner membrane transition
    into the continuous, gently curved alpha-helix observed in the assembled virion capsid?
- question: How do the basic C-terminal lysine residues of pVIII accommodate variable nucleotide sequences and non-integer
    DNA-to-coat stoichiometries along the filamentous capsid lumen?
suggested_experiments:
- description: Capture high-resolution cryo-EM structures of the pI/pXI inner-membrane assembly ring actively incorporating
    membrane-embedded pVIII subunits onto extruding ssDNA.
- description: Perform solid-state NMR and molecular dynamics simulations of M13 virions packaging synthetic ssDNA genomes
    of defined purine/pyrimidine composition to probe C-terminal lysine-phosphate interactions.
