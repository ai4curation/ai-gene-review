  label: Inovirus M13
description: Major coat protein G8P (pVIII), which polymerizes in ~2,700-2,750 copies to form the ~6 nm-wide right-handed
  helical capsid tube encapsulating the circular single-stranded DNA genome of bacteriophage M13. Synthesized as a 73-residue
  precursor (M13 procoat) with a 23-residue N-terminal signal peptide, procoat inserts into the Escherichia coli inner membrane
  as a hairpin loop via the host YidC membrane insertase and is cleaved by signal peptidase I (LepB) to yield the 50-residue
  mature single-pass transmembrane protein (residues 24-73). During ATP-driven viral extrusion through the inner-membrane
  pI/pXI assembly machine, mature pVIII subunits laterally enter the assembly complex and displace pV dimers along the extruding
  (+)ssDNA, with basic C-terminal lysine residues neutralizing the viral DNA phosphate backbone while gently curved alpha-helices
  pack in a C5-symmetric shingle-like array (~16 Angstrom axial rise and ~36 degree twist per pentameric layer).
