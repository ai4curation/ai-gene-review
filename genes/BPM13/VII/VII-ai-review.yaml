  findings:
  - statement: G7P (pVII) and G9P (pIX) initiate concomitant virion assembly and extrusion at the host inner membrane by interacting
      with the viral genome packaging signal and form the distal tip that emerges first from the host cell.
    record_section: ["CC:FUNCTION"]
    supporting_text: May initiate with G9P the virion concomitant assembly-budding process, by interacting with the packaging
      signal of the viral genome. The assembly-budding takes place at the host inner membrane. In turn, G7P and G9P are present
      at the end of the filamentous virion that emerges first from the bacterial host.
  - statement: Five copies of G7P form a symmetric plug at the apex of the virion tail round tip in complex with G9P and G8P,
      and reside in the host inner membrane prior to assembly.
    record_section: ["CC:SUBUNIT"]
    supporting_text: Homopentamer (PubMed:37669979). G7P pentamer forms a symmetric plug-like structure located at the topmiddle
      of the virion tail round tip (PubMed:37669979). Interacts with G9P; this interaction allows integration of G7P and G9P
      into the virion tail round tip (PubMed:37669979).
  - statement: Prior to assembly, G7P is associated with the bacterial host inner membrane.
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: Prior to assembly, is found associated with the bacterial host inner membrane. There are about five copies
      of this protein per mature phage that are located on the tail side of the filamentous virion with G9P (By similarity).
suggested_questions:
- question: How do the C-terminal Arg-33 residues of the pVII pentamer specifically recognize the stem-loop packaging signal
    hairpin of M13 (+)ssDNA within the pI/pXI inner-membrane assembly machine?
- question: Does pVII pre-assemble with pIX in the Escherichia coli inner membrane prior to entering the pI/pXI assembly complex,
    or are the two minor coat proteins recruited sequentially?
suggested_experiments:
- description: Resolve the asymmetric cryo-EM reconstruction of the M13 distal tip (pVII-pIX pentamer) without imposing 5-fold
    symmetry to visualize specific contacts between pVII and the encapsulated (+)ssDNA packaging hairpin.
- description: Perform in vivo photo-crosslinking of amber-suppressed p-benzoyl-L-phenylalanine variants of pVII in E. coli
    to map its interaction surfaces with pIX, pI/pXI, and the packaging signal DNA during assembly initiation.
