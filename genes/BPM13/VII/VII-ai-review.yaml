taxon:
  id: NCBITaxon:1977402
  label: Inovirus M13
description: Minor coat protein G7P (pVII, 33 residues), a single-pass hydrophobic peptide that forms a C5-symmetric pentameric
  plug at the apex of the distal (tail/round) tip of the filamentous bacteriophage M13 virion together with five copies of
  pIX. Prior to assembly, pVII inserts spontaneously into the Escherichia coli inner membrane. At the initiation of virion
  morphogenesis, pVII and pIX enter the inner-membrane pI/pXI assembly complex laterally and interact via their basic C-termini
  with the hairpin packaging signal of the progeny (+)ssDNA genome, nucleating the distal cap that emerges first from the
  bacterial host during concomitant virion assembly and extrusion.
