core_functions:
- description: >-
    Site-specific rolling-circle replication initiator endonuclease (isoform pII)
    that binds the viral (+)-strand origin of replication on supercoiled RFI dsDNA,
    nicks the (+) strand via a covalent 5'-phosphotyrosine bond to prime host DNA
    polymerase III elongation, and circularizes the displaced progeny (+)ssDNA
    strand after one round of synthesis; internal-initiation isoform pX binds dsDNA
    to regulate viral DNA replication.
  molecular_function:
    id: GO:0004519
    label: endonuclease activity
  directly_involved_in:
  - id: GO:0039684
    label: rolling circle single-stranded viral DNA replication
  supported_by:
  - reference_id: file:BPM13/II/II-uniprot.txt
    supporting_text: >-
      Isoform G2P plays an essential role in viral DNA replication. Binds the origin of replication and cleaves the dsDNA replicative form I (RFI) and becomes covalently bound to it via phosphotyrosine bond, generating the dsDNA replicative form II (RFII).
  - reference_id: file:BPM13/II/II-uniprot.txt
    supporting_text: >-
      After one round of rolling circle synthesis, protein G2P is linked to the newly synthesized ssDNA and joins the ends of the displaced strand to generate a circular single-stranded molecule ready to be packed into a virion.
- description: >-
    Origin-specific and double-stranded DNA binding by isoforms pII and pX to
    initiate and regulate rolling-circle viral genome replication.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
  - id: GO:0039684
    label: rolling circle single-stranded viral DNA replication
  supported_by:
  - reference_id: file:BPM13/II/II-uniprot.txt
    supporting_text: >-
      Isoform G10P protein binds to double-stranded DNA and prevents hydrolysis by nucleases. Additionally, G10P is an inhibitor of DNA replication and may have a role in the transition from semiconservative replicative form DNA replication to single-stranded DNA synthesis in the life cycle.
