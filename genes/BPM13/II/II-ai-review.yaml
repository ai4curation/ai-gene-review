suggested_questions:
- question: >-
    What is the structural basis for origin recognition, supercoil-dependent DNA
    bending, and catalytic tyrosine transesterification by M13 pII?
- question: >-
    Does isoform pX inhibit viral DNA replication by forming inactive heterooligomers
    with full-length pII or by competitively occupying dsDNA sequences at the
    (+)-strand origin?
suggested_experiments:
- description: >-
    Determine the cryo-EM or X-ray crystal structure of M13 pII covalently trapped
    on a (+)-strand origin DNA hairpin substrate to identify the catalytic tyrosine
    and divalent metal-binding pocket.
- description: >-
    Perform single-molecule magnetic tweezers supercoiling and nicking-closing
    assays with purified pII and varying stoichiometric ratios of pX.
