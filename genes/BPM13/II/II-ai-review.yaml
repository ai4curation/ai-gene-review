id: P69547
gene_symbol: II
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1977402
  label: Inovirus M13
description: >-
  Rolling-circle replication initiator endonuclease G2P (pII, 410 residues) and its
  internal-initiation regulatory isoform G10P (pX, 111 residues, translated from
  Met-300). Full-length pII initiates and terminates rolling-circle replication of
  the bacteriophage M13 genome: it specifically binds the viral (+)-strand origin
  on supercoiled double-stranded replicative form I (RFI) DNA, introduces a
  site-specific single-stranded nick, and forms a covalent 5'-phosphotyrosine
  linkage to generate nicked RFII with a free 3'-OH primer for host DNA polymerase
  III elongation. After one complete round of displacement synthesis, pII cleaves
  the regenerated origin and catalyses strand-transfer religation to release a
  closed circular single-stranded (+)DNA genome. Isoform pX (identical to the
  C-terminal 111 residues of pII) binds double-stranded DNA, protects it from
  nuclease degradation, and acts as a replication inhibitor that regulates the
  transition from double-stranded RF amplification to progeny (+)ssDNA synthesis.
