    summary: >-
      Core molecular function of isoform pI, which contains an essential N-terminal
      Walker A/B ATP-binding pocket required for filamentous virion assembly and extrusion.
    action: ACCEPT
    reason: >-
      Mutagenesis of the conserved Walker A (Lys-14) and Walker B (Asp-88, Glu-89)
      motifs in the cytoplasmic N-terminal domain of pI abolishes M13 phage assembly,
      demonstrating that ATP binding and hydrolysis drive viral morphogenesis and secretion.
    supported_by:
    - reference_id: PMID:35746635
      supporting_text: >-
        The N-terminal domain contains an ATP binding pocket that has an essential function in the assembly process of the phage [3]. Point mutations in the Walker A or B motifs lead to a severe inhibition of phage production, suggesting that the assembly and secretion of the M13 phage requires the hydrolysis of ATP by the M13 assembly machine.
