  label: Inovirus M13
description: >-
  Inner-membrane morphogenetic ATPase G1P (pI) and its internal-initiation isoform
  G11P (pXI), which together form the cytoplasmic/inner-membrane motor ring of the
  bacteriophage M13 transmembrane assembly and extrusion machine. Full-length pI
  (348 residues) is a single-pass inner-membrane protein with a cytoplasmic
  N-terminal P-loop NTPase domain (residues 1-253, containing essential Walker A
  and Walker B motifs), a transmembrane helix (residues 254-270), and a periplasmic
  C-terminal domain (residues 271-348). Translation from an internal in-frame start
  codon at Met-241 produces pXI (108 residues), which shares the transmembrane and
  periplasmic domains of pI but lacks the cytoplasmic ATP-hydrolyzing domain. In the
  Escherichia coli inner membrane, pI and pXI co-assemble into a ~320 kDa oligomeric
  ring (~12 nm outer diameter with a ~5 nm central cavity) that contacts the outer-membrane
  pIV secretin across the periplasm, binds the pV-coated progeny (+)ssDNA packaging
  complex, and couples ATP hydrolysis to the replacement of pV by membrane-embedded
  coat proteins as the nascent filamentous virion is extruded across the host cell
  envelope without cell lysis.
