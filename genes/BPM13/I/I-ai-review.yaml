core_functions:
- description: >-
    Forms the inner-membrane oligomeric ring complex (composed of full-length ATPase
    subunit pI and internal-initiation subunit pXI) that binds the pV-ssDNA nucleoprotein
    packaging complex and couples ATP binding and hydrolysis to concomitant filamentous
    virion assembly and non-lytic extrusion across the Escherichia coli cell envelope.
