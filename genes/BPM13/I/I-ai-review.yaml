  findings:
  - statement: >-
      Isoforms G1P (pI) and G11P (pXI) localize to the host inner membrane as part
      of the G1P-G11P-G4P transmembrane assembly machine required for phage assembly
      and extrusion.
    supporting_text: >-
      Plays an essential role in phage assembly at the host inner membrane (PubMed:35746635). Part of a viral G1P-G11P-G4P transmembrane assembly machine, through which the phage is assembled and extruded (PubMed:35746635).
  - statement: >-
      G1P and G11P form an oligomeric pore-like complex with an ATP-hydrolyzing domain
      that drives viral assembly and secretion.
    supporting_text: >-
      Together with G11P, generates an oligomeric structure with a pore-like inner cavity and an ATP hydrolyzing domain (PubMed:35746635). Viral assembly and secretion probably requires the hydrolysis of ATP (PubMed:28397779).
suggested_questions:
- question: >-
    What is the exact subunit stoichiometry and symmetry arrangement of pI and pXI
    within the ~320 kDa inner-membrane assembly ring, and how does it interface with
    the C15-symmetric outer-membrane pIV secretin channel?
- question: >-
    How does ATP hydrolysis by the cytoplasmic N-terminal P-loop domain of pI
    mechanically couple to pV displacement and lateral entry of membrane-embedded
    pVIII coat subunits?
suggested_experiments:
- description: >-
    Determine the high-resolution cryo-EM structure of the purified pI/pXI complex
    reconstituted in lipid nanodiscs bound to the hairpin packaging signal of M13
    (+)ssDNA and ATP analogues.
- description: >-
    Measure quantitative steady-state ATPase kinetics of proteoliposome-reconstituted
    pI/pXI in the presence and absence of pV-ssDNA complexes and membrane-reconstituted
    pVIII/pVII/pIX coat proteins.
