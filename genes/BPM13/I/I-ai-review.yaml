- id: PMID:35746635
  title: The M13 Phage Assembly Machine Has a Membrane-Spanning Oligomeric Ring Structure.
  findings:
  - statement: >-
      G1p (pI) and G11p (pXI) co-assemble in the Escherichia coli inner membrane
      into a ~320 kDa oligomeric ring structure (~12 nm outer diameter with a central
      pore) that contains an N-terminal ATP-hydrolyzing domain and binds the G5p-ssDNA
      complex to catalyse phage assembly and extrusion.
    supporting_text: >-
      Bacteriophage M13 assembles its progeny particles in the inner membrane of the host. The major component of the assembly machine is G1p and together with G11p it generates an oligomeric structure with a pore-like inner cavity and an ATP hydrolysing domain.
  - statement: >-
      The N-terminal cytoplasmic domain of G1p harbours essential Walker A and Walker B
      ATP-binding motifs required for M13 phage assembly and secretion, whereas G11p
      initiates at Met-241 and contains only the transmembrane anchor and periplasmic tail.
    supporting_text: >-
      The N-terminal domain contains an ATP binding pocket that has an essential function in the assembly process of the phage [3]. Point mutations in the Walker A or B motifs lead to a severe inhibition of phage production, suggesting that the assembly and secretion of the M13 phage requires the hydrolysis of ATP by the M13 assembly machine.
- id: file:BPM13/I/I-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03656 (G1P_BPM13)
