core_functions:
- description: Proximal virion tip structural and host-attachment protein (homopentamer complexed with pVI) that mediates
    primary phage adsorption to the host F-pilus tip via its N2 domain, binds the secondary entry receptor TolA via its N1
    domain, and terminates filamentous virion assembly and extrusion by releasing the nascent particle from the host inner
    membrane via its C-terminal domain.
