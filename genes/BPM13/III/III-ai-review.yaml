id: P69168
gene_symbol: III
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1977402
  label: Inovirus M13
description: Minor coat and host attachment protein G3P (pIII), located in five copies complexed with five copies of pVI at
  the proximal (adsorption) tip of the filamentous M13 virion. Synthesized as a 424-residue precursor with an 18-residue signal
  peptide, mature pIII (residues 19-424) is anchored in the Escherichia coli inner membrane prior to virion assembly via a
  C-terminal transmembrane helix (residues 398-418) and comprises three functional domains (N1, N2, and CT) separated by flexible
  glycine-rich linkers. During infection, the N2 domain binds the tip of the host conjugative F-pilus (primary adhesion receptor);
  pilus retraction brings the virion to the cell envelope and unlocks the N1-N2 interface so that N1 binds the C-terminal
  domain of the inner-membrane co-receptor TolA, enabling TolQRA-dependent translocation of the viral genome into the host
  cytoplasm. At the conclusion of virion morphogenesis, the C-terminal domain of pIII integrates with pVI into the trailing
  tip of the nascent filament and mediates terminal release of the extruding virion from the host inner membrane.
