- id: file:BPM13/III/III-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P69168 (G3P_BPM13)
  publication_type: DATABASE
  findings:
  - statement: G3P (pIII) mediates initial phage adsorption to the tip of the host F-pilus, triggering pilus retraction toward
      the host inner membrane.
    supporting_text: During the initial step of infection, G3P mediates adsorption of the phage to its primary receptor, the
      tip of host F-pilus. Attachment of the phage causes pilus retraction bringing the viral particle into close proximity
      of the host cell inner membrane.
  - statement: F-pilus binding induces a conformational change in G3P that enables interaction with the host TolA, TolQ, and
      TolR entry receptors, while the C-terminal domain mediates virion release during extrusion.
    supporting_text: Binding to the host pilus initiates a change in the G3P conformation, allowing subsequent interaction
      with the host entry receptors TolA, TolQ and TolR and penetration of the viral DNA into the host cytoplasm. In the extrusion
      process, G3P mediates the release of the membrane-anchored virion from the cell via its C-terminal domain.
  - statement: G3P resides in the bacterial host inner membrane prior to assembly and is present in five copies at the head
      (proximal) tip of the mature virion.
    supporting_text: Prior to assembly, G3P is found associated with the bacterial host inner membrane. There are about five
      copies of this protein per mature phage that are located on the head side of the filamentous virion.
suggested_questions:
- question: How do the transmembrane helices of pIII and pVI remodel the host inner membrane during TolQRA-assisted viral
    coat depolymerization and ssDNA translocation?
- question: What molecular signal triggers the lateral entry of the pIII-pVI complex into the pI/pXI assembly machine only
    after the full length of the viral (+)ssDNA has been coated by pVIII?
suggested_experiments:
- description: Determine the cryo-EM structure of the M13 proximal tip (pIII-pVI pentamer) bound to the tip of the Escherichia
    coli conjugative F-pilus.
- description: Reconstitute the pIII-TolQRA interaction in proteoliposomes to assay whether proton-motive force activation
    of TolQRA drives conformational rearrangement of the pIII C-terminal domain and uncoating of the pVIII capsid.
