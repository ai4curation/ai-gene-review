  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR013380
  review:
    summary: >-
      This row comes from InterPro IPR013380, which is the T3SS ATPase SctN
      signature itself, mapped to ATP-synthase biology because of the F1
      alpha/beta fold. SctN hydrolyses ATP to energize protein export; it does
