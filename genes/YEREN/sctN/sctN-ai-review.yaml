- id: file:YEREN/sctN/sctN-deep-research-falcon.md
  title: Falcon deep research report for Yersinia enterocolitica SctN (P40290)
  findings:
  - statement: >-
      Identifies P40290 as the Ysc-Yop injectisome ATPase and explicitly warns
      that YsaN, the ATPase of the chromosomal Ysa-Ysp T3SS of the same
      organism, is a different protein whose biochemistry must not be
      transferred to P40290.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Useful for the YsaN disambiguation and for the sorting-platform context.
      Primary papers were cited in preference wherever a claim mattered.
core_functions:
- description: >-
    ATP-hydrolysing engine of the Ysc-Yop injectisome: it recognizes the
    N-terminal secretion signals of type III substrates, strips their Syc
    chaperones and unfolds them, and thereby energizes their delivery to the
    export apparatus for secretion and injection into host cells. As a
    hexameric ring at the cytoplasmic face of the basal body it is also a
    structural hub of the cytosolic sorting platform, required independently of
    its catalytic activity for assembly of the YscK/YscQ/YscL C-ring complex.
  molecular_function:
    id: GO:0008564
    label: protein-exporting ATPase activity
  directly_involved_in:
  - id: GO:0030254
    label: protein secretion by the type III secretion system
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0030257
    label: type III protein secretion system complex
  supported_by:
  - reference_id: PMID:16672607
    supporting_text: A biochemical analysis of YscN reveals it to be a highly cooperative
      ATPase whose activity is inhibited by the addition of YscL.
  - reference_id: PMID:17050689
    supporting_text: we observed His YscN binding to YopR-GST, its in vivo substrate
  - reference_id: PMID:20453832
    supporting_text: Secretion could be complemented in trans by a wild-type yscN allele,
      but not by an yscN allele encoding YscN K175E altered in the Walker box
  - reference_id: PMID:20453832
    supporting_text: At the cytosolic side of the injectisome, an ATPase of the AAA
      + family (YscN) forms a hexameric ring that is activated by oligomerization
  - reference_id: PMID:28653671
    supporting_text: Taken together, these data provide strong evidence for the formation
      of stable cytosolic complexes including all four soluble T3SS components YscK,
      YscQ, YscL and YscN.
proposed_new_terms: []
suggested_questions:
- question: >-
    TreeGrafter grafts P40290 onto PANTHER:PTN001807733 and transfers GO:0046933.
    The GO:0046933 IBD is at PTN008558586, whose seeds are four F1-beta subunits,
    while PTN001807733 sits in the sister clade PTN000390097 that contains only
    the type III / flagellar export-ATPase subfamilies (SF9, SF62, SF81). Should
    PAINT move the IBD down to the F1-beta clade PTN008558588, or place an
    IRD/NOT at the root of PTN000390097, so that ATP synthase terms stop
    propagating to every SctN and FliI protein?
- question: >-
    InterPro IPR013380 is the SctN-specific signature yet carries InterPro2GO
    mappings to GO:0046961 (proton-transporting ATPase activity, rotational
    mechanism) and GO:0006754 (ATP biosynthetic process), and IPR004100 carries
    GO:1902600 and GO:0046034. Should these mappings be replaced by GO:0008564,
    GO:0016887, GO:0030254 and GO:0030257 for the T3SS-specific entries?
- question: >-
    SctO/YscO is a gamma-stalk analogue that stimulates the SctN ATPase, and the
    SctN6-SctO assembly is architecturally rotary. Is there any experimental test
    of rotation in an injectisome ATPase, and if rotation were shown, which GO
    molecular function (other than the proton-coupled GO:0046961) should describe
    a rotary but non-proton-translocating export ATPase?
- question: >-
    YscN K175E abolishes secretion but still supports C-ring assembly. Is the
    structural (scaffolding) role of SctN in sorting-platform formation
    separable enough from its catalytic role to deserve its own annotation, and
    is there a GO term for a secretion-system assembly scaffold?
suggested_experiments:
- description: >-
    Test directly whether purified YscN or a YscN6-YscO complex reconstituted
    into proteoliposomes conducts protons, using an ACMA or pyranine quench
    assay with and without ATP. A negative result would provide the direct
    experimental refutation of GO:0046961 and GO:1902600 that is currently only
    inferred from the flagellar system.
  experiment_type: reconstitution and proton flux assay
- description: >-
    Measure ATP synthesis (luciferase assay) by YscN in inverted membrane
    vesicles energized with a pH gradient, alongside an F1Fo-containing control,
    to confirm that SctN cannot run the reaction in the synthetic direction.
  experiment_type: biochemistry
- description: >-
    Reconstitute Yop export in inverted membrane vesicles with purified YscN,
    YscL, YscO and chaperone-effector pairs to determine how much of the
    translocation step is driven by ATP hydrolysis versus by the proton motive
    force at the SctV export gate, in the way that has been done for the
    flagellar system.
  experiment_type: in vitro reconstitution
- description: >-
    Assay chaperone release and effector unfolding by purified Y. enterocolitica
    YscN with SycE-YopE, which has been shown for Salmonella InvC but not for
    this protein, and test the dependence on YscL and YscO.
  experiment_type: biochemistry
