    action: REMOVE
    reason: >-
      Confuses the machine's dependence on the PMF with participation of this
      subunit in proton transport. A domain-level mapping carrying rotary ATP
      synthase semantics onto an export ATPase.
    supported_by:
    - reference_id: PMID:15213145
      supporting_text: Motility as well as type III-dependent secretion of Yop proteins
        was inhibited by CCCP.
    - reference_id: PMID:29946050
      supporting_text: FlhA has an ion channel activity, and the FlhA-FliJ interaction
        enables effective utilization of PMF for protein export
