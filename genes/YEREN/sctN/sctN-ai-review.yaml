- id: PMID:8132449
  title: YscN, the putative energizer of the Yersinia Yop secretion machinery.
  findings:
  - statement: >-
      yscN is the first gene of the virB locus on pYV and encodes a 47.8-kDa
      protein similar to the catalytic subunits of F0F1 and related ATPases,
      with Walker boxes A and B. A box A deletion mutant is impaired in Yop
      secretion and is complemented in trans by cloned yscN.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Original description of this gene; abstract only in the cache. Establishes
      the requirement for the nucleotide-binding motif in Yop secretion and the
      F1 alpha/beta relationship that later drives the erroneous synthase
      annotations.
- id: PMID:15213145
  title: 'Yersinia enterocolitica type III secretion depends on the proton motive
    force but not on the flagellar motor components MotA and MotB.'
  findings:
  - statement: >-
      The protonophore CCCP inhibits Yop secretion as well as motility, showing
      that Ysc type III secretion requires the proton motive force; MotA/MotB
      are not involved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Organism-specific evidence that the PMF requirement belongs to the
      machine. Abstract only in the cache; the claim quoted is stated there.
- id: PMID:16208377
  title: Chaperone release and unfolding of substrates in type III secretion.
  findings:
  - statement: >-
      The Salmonella SPI-1 ATPase InvC recognizes substrates and induces
      chaperone release and substrate unfolding in an ATP-dependent manner.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Ortholog (Salmonella InvC), abstract only in the cache. Cited for the
      mechanism attributed to SctN, not as evidence on P40290 itself.
- id: PMID:16672607
  title: Characterization of the Yersinia enterocolitica type III secretion ATPase
    YscN and its regulator, YscL.
  findings:
  - statement: >-
      Purified His-YscN is a cooperative ATPase; His-YscL inhibits it
      non-competitively. YscN and YscL interact in the cytoplasm of
      Y. enterocolitica, and GST-YscL copurifies YscN and YscQ.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The key organism-specific enzymology paper and the source of the
      experimental cytoplasm annotation. Full text cached.
- id: PMID:17050689
  title: Secretion signal recognition by YscN, the Yersinia type III secretion ATPase.
  findings:
  - statement: >-
      Impassable YopR hybrids capture YscN in the bacterial cytoplasm and block
      type III secretion; the first eleven residues of YopR constitute the
      secretion signal required for YscN binding. Purified His-YscN binds
      YopR-GST but not GST-YopR or signal-deleted YopR.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of the IPI protein-binding row with UniProtKB:Q01249 (YopR, encoded
      by yscH). Full text cached; the interaction is secretion-signal dependent
      substrate recognition.
- id: PMID:20453832
  title: 'Deciphering the assembly of the Yersinia type III secretion injectisome.'
  findings:
  - statement: >-
      EGFP-YscN assembly requires YscC, YscJ, YscK, YscL and YscQ. YscN forms a
      hexameric ring at the cytosolic side of the injectisome. Secretion is
      complemented by wild-type yscN but not by the Walker-box mutant K175E,
      which nevertheless still supports C-ring formation, showing that the
      ATPase requirement for sorting-platform assembly is structural.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Organism-specific assembly genetics and imaging; full text cached.
- id: PMID:25591178
  title: 'Composition, formation, and regulation of the cytosolic c-ring, a dynamic
    component of the type III secretion injectisome.'
  findings:
  - statement: >-
      SctN/YscN is one of five conserved cytosolic components, thought to detach
      chaperones and unfold export substrates; SctO/YscO is homologous to the
      central stalk of the FoF1-ATPase and stimulates its ATPase activity. In
      the absence of YscQ-C, EGFP-YscN remains completely cytosolic.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Organism-specific. Also the source for the gamma-stalk analogy that
      explains, without supporting, the rotary ATP synthase annotations.
- id: PMID:28653671
  title: 'A dynamic and adaptive network of cytosolic interactions governs protein
    export by the T3SS injectisome.'
  findings:
  - statement: >-
      YscN is an oligomerization-activated ATPase and a peripheral member of
      stable cytosolic YscK/YscQ/YscL/YscN complexes; deletion of yscN strongly
      destabilizes those complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Organism-specific; full text cached.
- id: PMID:8943245
  title: Enzymatic characterization of FliI. An ATPase involved in flagellar assembly
