id: P40290
gene_symbol: sctN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:630
  label: Yersinia enterocolitica
description: >-
  SctN (YscN) is the ATPase of the plasmid-encoded Ysc-Yop type III secretion
  system (injectisome) of Yersinia enterocolitica. It is a soluble, cytoplasmic
  protein that assembles into a hexameric ring at the cytoplasmic face of the
  injectisome basal body, at the centre of the sorting platform formed with
  YscK/SctK, YscQ/SctQ and YscL/SctL; YscO/SctO is a central-stalk (gamma-like)
  analogue that stimulates its activity, while YscL/SctL binds it directly and
  inhibits ATP hydrolysis allosterically. SctN hydrolyses ATP to recognize
  secretion substrates through their N-terminal secretion signals, to strip
  cognate Syc chaperones and unfold effectors before they enter the export
  channel, and it is required for assembly of the cytosolic sorting platform
  (the latter role being structural, since a Walker-box mutant still supports
  C-ring formation but not secretion). Loss of sctN abolishes Yop secretion,
  host-cell injection and virulence. SctN is an evolutionary paralog of the
  F1-ATP synthase alpha/beta subunits and shares their fold and a rotary-like
  architecture, but it has no Fo-type proton channel partner, does not conduct
  protons and does not synthesize ATP; protein translocation by the injectisome
  additionally depends on the proton motive force acting at the membrane export
  gate rather than on SctN itself.
