      that export ATPases are not F-type enzymes despite the shared fold.
- id: PMID:21934659
  title: An energy transduction mechanism used in bacterial flagellar type III protein
    export.
  findings:
  - statement: >-
      In the homologous flagellar export system the membrane export gate itself
      is the proton-protein antiporter; the soluble ATPase does not conduct
      protons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Homologous flagellar system (Salmonella); used for the locus of proton flux.
- id: PMID:29946050
  title: In Vitro Reconstitution of Functional Type III Protein Export and Insights
