- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001807733
  review:
    summary: >-
      TreeGrafter grafted P40290 onto PANTHER node PTN001807733. In the cached
      PTHR15184 PAINT table the GO:0046933 IBD sits at PTN008558586, seeded by
      four genuine F1-beta subunits (E. coli AtpD P0ABB4, human ATP5F1B P06576,
      S. cerevisiae ATP2, S. pombe atp2). PTN001807733 lies in clade
      PTN000390097, the eubacterial sister clade of the F1-beta clade
      PTN008558588 under that duplication node, and PTN000390097 contains
      precisely the export-ATPase subfamilies SF9, SF62 and SF81. P40290 is in
      SF9. So the function asserted at the IBD node arose in, and is grounded
      only in, the sister clade; the export-ATPase lineage has no Fo partner,
      no proton channel and no ATP-synthesis activity. The rotary-like
      architecture is real — YscO/SctO is a central-stalk analogue that
      stimulates the ATPase — but architecture is not synthase activity.
    action: REMOVE
    reason: >-
      Contradicted by the biology of this protein: YscN consumes ATP to drive
      Yop export and transports no protons. The graft node sits outside the
      clade whose descendants carry the experimental evidence for the IBD, so
      this is a paralog over-propagation across a duplication node rather than
      an inherited function.
    supported_by:
    - reference_id: PMID:16672607
      supporting_text: The bacterial energy source for secretion is ATP, which is
        consumed by an ATPase that couples ATP hydrolysis to the unfolding of secreted
        proteins and the dissociation of their chaperones just prior to secretion.
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or
        P-type ATPases
    - reference_id: file:YEREN/sctN/sctN-deep-research-falcon.md
      supporting_text: It is a cytoplasmic, peripheral component of the injectisome
    - reference_id: PMID:25591178
      supporting_text: a protein with homology to the central stalk of the FoF1-ATPase
        that stimulates ATPase activity (SctO; YscO)
- term:
    id: GO:0046961
    label: proton-transporting ATPase activity, rotational mechanism
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013380
  review:
    summary: >-
      IPR013380 is the SctN-specific InterPro entry, so this mapping asserts
      that being a T3SS ATPase implies pumping protons by a rotational
      mechanism. The GO definition requires transfer of protons across a
      membrane coupled to ATP hydrolysis. SctN is a soluble cytoplasmic protein
      with no transmembrane segment and no proton-conducting partner; in the
      homologous flagellar system it is the membrane export gate, not the
      ATPase, that carries protons.
    action: REMOVE
    reason: >-
      The proton-translocation half of the term is false for this protein. The
      ATP-hydrolysis half is already covered correctly by GO:0016887 and
      GO:0008564. The mapping is an error on a T3SS-specific signature and
      propagates to all SctN proteins.
    supported_by:
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or
        P-type ATPases
- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  review:
    summary: >-
      Mapped from the F1/V1/A1 alpha/beta N-terminal domain. Yersinia type III
      secretion is inhibited by the protonophore CCCP, so the injectisome as a
      machine uses the proton motive force, but the protons move through the
      membrane export apparatus; SctN is soluble and cytoplasmic and translocates
