id: Q8DSC3
gene_symbol: manM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:210007
  label: Streptococcus mutans UA159
description: ManM is the IIC integral plasma-membrane component of the ManLMN sugar phosphotransferase
  system in Streptococcus mutans UA159. Together with ManN, it supplies the membrane machinery that couples
  sugar entry to phosphorylation by the ManL IIA/IIB relay. Native ManL and whole-operon uptake studies
  and the cognate operon/domain architecture support participation in mannose and glucose uptake, with
  additional amino-sugar transport by the system. The membrane subunit does not itself supply the IIA/IIB
  phosphohistidine relay, and its individual substrate contacts have not been mapped experimentally in
  UA159.
