id: Q8DSC4
gene_symbol: manL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:210007
  label: Streptococcus mutans UA159
description: ManL is the fused IIA/IIB phosphorelay component of the ManLMN sugar phosphotransferase system
  in Streptococcus mutans UA159. Its two cytoplasmic domains relay phosphate from HPr to sugar during
  uptake through the ManM/ManN membrane machinery. The system transports mannose and glucose and contributes
  to amino-sugar uptake. ManL also influences carbohydrate catabolite repression, although the direct
  regulatory mechanism is incompletely resolved. Alternative mannose uptake can compensate for loss of
  ManL, so ManLMN is not the only native route under every growth condition.
