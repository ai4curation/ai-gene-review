  review:
    action: MODIFY
    summary: The target contributes to mannose, glucose and N-acetylglucosamine PTS reactions.
    reason: 'The broad carbohydrate/sugar group-translocation claim is supported. Refine to all three
      supported specific descendants: mannose, glucose and N-acetylglucosamine PTS activities. Native
      UA159 assays in12902269 and24928869 establish this spectrum; the latter directly compares complete
      manLMN deletion in PEP-dependent uptake assays, with very little residual GlcNAc transport. ManL
      supplies IIA/IIB catalytic phosphotransfer while its membrane partners provide translocation. No
      purified UA159 individual-subunit transport assay or complete whole-operon complementation is claimed.
      Glucosamine uptake is described without inventing a missing specific PTS term. The GlcNAc 6-phosphate
      product specificity is a mechanistic inference from mannose-family PTS chemistry and the native
      amino-sugar pathway, not direct product identification by the coupled NADH assay.'
