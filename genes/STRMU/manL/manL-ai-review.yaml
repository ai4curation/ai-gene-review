  title: UniProt record for Q8DSC4
  findings:
  - statement: Official UA159 locus/sequence and IIAB domain signatures support identity and role; automated
      ARBA function prose is not treated as an independent experimental source.
- id: PMID:12902269
  title: Characterization of Streptococcus mutans strains deficient in EIIAB Man of the sugar phosphotransferase
    system.
  findings:
  - statement: UA159 ManL contributes to PEP-dependent glucose/mannose uptake, while inducible alternative
      mannose transport explains the mutant growth result. Operon Fig1 identifies manL/M/N by flanking
      loci and the text gives manL length0.99kb. Genetic/regulatory phenotypes do not prove sole-route
      necessity or separate catalytic measurements for every membrane subunit.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: FULL_TEXT_RELEVANT_SECTIONS. The identity bridge distinguishes UA159 native evidence
      from cross-species inference.
- id: PMID:17951382
  title: Role of RelA of Streptococcus mutans in global control of gene expression.
  findings:
  - statement: This independent UA159 primary explicitly equates manL with SMU.1877 and manM with SMU.1878.
      It supports the nomenclature bridge rather than adding new transport measurements. manN is mapped
      through the adjacent third CDS in the original2003 operon figure and official genome cross-references.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: FULL_TEXT_RELEVANT_SECTIONS. External full source and exact excerpt are in file:analysis/module_audits/bacterial_mannose_pts/literature-consultation/source-excerpts.md.
      The identity bridge distinguishes UA159 native evidence from cross-species inference.
- id: PMID:24928869
  title: Uptake and metabolism of N-acetylglucosamine and glucosamine by Streptococcus mutans.
  findings:
  - statement: Native UA159 assays extend the system to glucosamine/N-acetylglucosamine uptake; downstream
      ManO modulates amino-sugar uptake. This is broader cargo context, not justification to require ManO
      for the bacterial mannose module or to add downstream amino-sugar catabolism to the transport mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: FULL_TEXT_RELEVANT_SECTIONS. External full source and exact excerpt are in file:analysis/module_audits/bacterial_mannose_pts/literature-consultation/source-excerpts.md.
      The identity bridge distinguishes UA159 native evidence from cross-species inference.
- id: PMID:2681202
  title: Mannose permease of Escherichia coli. Domain structure and function of the phosphorylating subunit.
  findings:
  - statement: E. coli ManX/IIIMan has two phosphorylated domains; transfer is reported within a subunit,
      between isolated domains and between subunits. Phospho-HPr feeds His10, then His175 donates to sugar
      with membrane partners. A strictly intramolecular relay is false. Full-text attempts are recorded
      separately by the Ecoli consultant.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: ABSTRACT_ONLY. External full source and exact excerpt are in file:analysis/module_audits/bacterial_mannose_pts/literature-consultation/source-excerpts.md.
      E. coli comparative chemistry/architecture, not an assay of this UA159 gene.
- id: PMID:31209249
  title: Structure of the mannose transporter of the bacterial phosphotransferase system.
  findings:
  - statement: The 2019 structure describes a trimer of ManY/ManZ protomers, hence three copies of each
      membrane component. The supplementary counterflow experiment is not complete PEP/HPr/ManX group
      translocation. Do not carry the older membrane-dimer model or infer a matched soluble-ManX stoichiometry.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: FULL_TEXT_RELEVANT_SECTIONS. E. coli comparative chemistry/architecture, not an assay
      of this UA159 gene.
- id: file:analysis/module_audits/bacterial_mannose_pts/ua159-consultation/primary-scope.md
  title: UA159 amino-sugar evidence and specific PTS term scope
  findings:
  - statement: The complete native manLMN deletion has almost no PEP-dependent GlcNAc transport; individual
      subunit roles also use locus/domain evidence. Partial ManL complementation is distinguished from
      unavailable stable whole-operon complementation.
- id: file:analysis/module_audits/bacterial_mannose_pts/review-followup/evidence.md
  title: PR6193 claim-specific source assessment
  findings:
  - statement: The native UA159 PEP-dependent assays support system activity, whereas target domain and
      topology evidence support the compartmental division. Membrane association of soluble ManL remains
      unresolved; GlcNAc phosphorylation position is mechanistically inferred.
    supporting_text: Compared to the wild-type strain, cells lacking the manLMN operon displayed almost
      no detectable PTS-dependent uptake of GlcNAc and only a very low level of transport of GlcN
