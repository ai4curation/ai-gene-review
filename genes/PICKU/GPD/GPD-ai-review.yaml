    summary: >-
      Root-level carbohydrate metabolic process from the InterPro2GO mapping of
      IPR006109; true, but the specific polyol branch under it is what the evidence
      supports.
    action: MODIFY
    reason: >-
      Glycerol biosynthesis sits under carbohydrate metabolic process in GO
      (GO:0006114 is_a GO:0019401 is_a ... is_a GO:0005975), so the term is not wrong,
      but it is far less specific than the evidence allows. This enzyme catalyses the
      committed step of glycerol synthesis: it reduces the glycolytic intermediate
      dihydroxyacetone phosphate to glycerol 3-phosphate, which a phosphatase then
      converts to glycerol. The participation is direct, not substrate-like, and it is
      shown for this protein by complementation of S. cerevisiae gpd1 and gpd1 gpd2
      mutants with glycerol accumulation, and in this species by the loss of glycerol
      when the gene is deleted. Refined to GO:0006114 glycerol biosynthetic process,
      which the gene does not yet carry.
