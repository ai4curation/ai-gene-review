aliases:
- GPD
- CgGPD
- Glycerol-3-phosphate dehydrogenase [NAD(+)]
core_functions:
- description: >-
    NAD(+)-dependent reduction of dihydroxyacetone phosphate to sn-glycerol
    3-phosphate in the cytosol, the committed step of glycerol biosynthesis. The
    reaction consumes cytosolic NADH, so it serves both as the route to glycerol as a
    compatible solute under osmotic stress and as a redox sink for surplus NADH during
    fermentative growth. Direct evidence for this protein comes from complementation of
    S. cerevisiae gpd1 and gpd1 gpd2 mutants with restored osmotolerance, glycerol
    accumulation and NaCl-inducible GPD activity; in P. kudriavzevii itself, deleting
    the gene removes glycerol from the fermentation broth.
