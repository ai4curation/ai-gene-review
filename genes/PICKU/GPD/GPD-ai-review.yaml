- id: PMID:9171333
  title: The two isoenzymes for yeast NAD+-dependent glycerol 3-phosphate dehydrogenase
    encoded by GPD1 and GPD2 have distinct roles in osmoadaptation and redox regulation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract read. The gpd1 gpd2 double mutant makes no detectable glycerol, which is
      the cleanest ortholog evidence that the NAD(+)-dependent enzymes synthesise rather
      than consume glycerol 3-phosphate, and it separates the osmotic and redox roles of
      the two isoenzymes.
- id: PMID:20026609
  title: Dynamic changes in the subcellular distribution of Gpd1p in response to cell
    stress.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract read. This is the experimental basis of the fungi-scoped PAINT nucleus
      node that reaches this protein. It reports a conditional redistribution of an
      otherwise cytosolic and peroxisomal enzyme under osmotic stress, which is why the
      transferred nucleus annotation is kept as non-core rather than accepted.
