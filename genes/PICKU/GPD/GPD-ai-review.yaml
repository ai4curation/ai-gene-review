    reason: >-
      PAINT asserts cytosol at PTHR11728 node PTN000198006 from experimental data in
      plants, flies, mammals and yeast, and the S. cerevisiae enzyme that defines the
      glycerol-synthesis role was characterised as cytosolic when it was cloned. The
      reviewed 388-residue model has no signal peptide, no transmembrane segment and no
      cleavable presequence in its record; that sub-argument is scoped to this model,
      because the reference-proteome model of the same locus carries a 27-residue
      N-terminal extension whose composition is presequence-shaped (see the
      alternative_records entry and suggested_questions). Independently of the
      N-terminus, the substrate dihydroxyacetone phosphate is a glycolytic intermediate,
      so a cytosolic site is where the reaction makes sense. This is the location of the
      core activity.
