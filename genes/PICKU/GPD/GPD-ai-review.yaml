suggested_questions:
- question: >-
    Which initiator codon does this gene use in vivo? The reference-proteome model
    A0A2U9RB90 adds 27 N-terminal residues to the 388-residue product cloned and shown
    to be functional, and the extension is basic, Ser/Thr-rich and free of acidic
    residues, the composition of a mitochondrial targeting presequence, so it would be
    worth testing for mitochondrial import rather than assuming it is a gene-model
    artefact.
- question: >-
    Does P. kudriavzevii use a single NAD(+)-dependent glycerol-3-phosphate
    dehydrogenase for both the osmotic and the redox role that S. cerevisiae splits
    between GPD1 and GPD2? Only one family member is present in the reference proteome,
    and the regulation of that single gene has not been described.
suggested_experiments:
- description: >-
    Purify the recombinant enzyme and measure steady-state kinetics in both directions
    with NAD(+)/NADH, to establish the catalytic preference directly rather than
    inferring it from genetics, and test whether NADP(H) is used at all (which would
    decide between GO:0141152 and the broader GO:0047952).
- description: >-
    Determine the subcellular distribution of a tagged GPD in P. kudriavzevii under
    normal and hyperosmotic conditions, to test whether the stress-induced nuclear
    redistribution seen for S. cerevisiae Gpd1p, which is the basis of the transferred
    nucleus annotation, occurs in this species. Score the peroxisomal pool in the same
    experiment: Gpd1p is imported into peroxisomes through an N-terminal PTS2 read by
    Pex7p, so co-localisation with a peroxisomal marker, and the behaviour of the
    protein in a pex7 background, would say whether that route is also used here. The
    N-terminus of A8W1U0 lies in the region where Gpd1p's PTS2 sits, and the 27-residue
    extension of the reference-proteome model falls in the same window, so the two gene
    models should be tested separately.
- description: >-
    Compare the two gene models by 5' RACE or ribosome profiling, and express both the
    388- and 415-residue forms in a gpd-null background, to establish which product is
    made and whether the N-terminal extension changes localisation or activity.
