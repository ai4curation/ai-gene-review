- term:
    id: GO:0046168
    label: glycerol-3-phosphate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR011128
  - UniRule:UR000080073
  review:
    summary: >-
      Catabolic direction asserted by a UniProt rule; the enzyme runs the opposite way
      in vivo, synthesising glycerol 3-phosphate rather than breaking it down.
    action: MODIFY
    reason: >-
      This is a direction error, not a granularity problem, so the replacement is a
      sibling rather than a descendant. The rule appears to read the direction off the
      EC 1.1.1.8 reaction as written (sn-glycerol 3-phosphate + NAD+ = dihydroxyacetone
      phosphate + NADH), but the physiological flux through the NAD(+)-dependent
      enzyme in yeast is reductive. S. cerevisiae cells lacking both NAD(+)-dependent
      isoenzymes make no detectable glycerol, which is only possible if these enzymes
      produce glycerol 3-phosphate rather than consume it; the enzyme that oxidises
      glycerol 3-phosphate in yeast is the separate FAD-dependent mitochondrial
      protein. For this protein specifically, complementation of gpd1 mutants restores
      glycerol accumulation, and deleting the gene in P. kudriavzevii removes glycerol
      from the fermentation. Replaced by GO:0046167 glycerol-3-phosphate biosynthetic
      process. The same correction is recorded as a source defect, since the rule will
      keep propagating the catabolic term to every member of this family.
    proposed_replacement_terms:
    - id: GO:0046167
      label: glycerol-3-phosphate biosynthetic process
    supported_by:
    - &id010
      reference_id: PMID:9171333
      supporting_text: Mutants deleted for both GPD1 and GPD2 do not produce detectable
        glycerol
    - *id003
    - *id005
    - *id007
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0046168
      corrected_value: GO:0046167
      corrected_label: glycerol-3-phosphate biosynthetic process
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        UniRule UR000080073 assigns GO:0046168 glycerol-3-phosphate catabolic process
        to NAD(+)-dependent glycerol-3-phosphate dehydrogenases (EC 1.1.1.8). The
        direction is inverted relative to the physiological reaction. In yeast this
        enzyme reduces dihydroxyacetone phosphate to glycerol 3-phosphate as the
        committed step of glycerol synthesis: S. cerevisiae gpd1 gpd2 double mutants
        produce no detectable glycerol, and deleting the single gene in Pichia
        kudriavzevii abolishes glycerol accumulation during fermentation. Oxidation of
        glycerol 3-phosphate in yeast is carried by the unrelated FAD-dependent
        enzyme. The same inversion applies to bacterial GpsA, which is also a
        biosynthetic NAD(P)H-dependent enzyme, so the rule's term choice is likely
        wrong for the whole family rather than for this entry alone; we suggest
        GO:0046167 glycerol-3-phosphate biosynthetic process. Note that GpsA is
        EC 1.1.1.94, not EC 1.1.1.8, so whether UR000080073 reaches it at all is the
        same open question as the rule's scope: the family-level argument holds through
        the shared PANTHER family PTHR11728, where GpsA (UniProtKB:P0A6S7) is among the
        PTN000198006 donors, not through the EC number. Filed as PROBABLE rather than
        CONFIRMED because the rule's intended taxonomic and EC scope was not inspected,
        and some members of EC 1.1.1.8 in other lineages may genuinely run
        catabolically.
      supported_by:
      - *id010
      - *id006
      - *id007
