  title: Cloning and characterization of a NAD+-dependent glycerol-3-phosphate dehydrogenase
    gene from Candida glycerinogenes, an industrial glycerol producer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only; no PMC record. This is the reference attached to the UniProt entry
      and it characterises this exact protein: the paper reports a 1167-bp ORF encoding
      388 residues and deposits it as GenBank EU186536, which is the EMBL record behind
      A8W1U0 (CDS ABW38024.1). The title names Candida glycerinogenes, but NCBI
      Taxonomy lists that name as a synonym of Pichia kudriavzevii (NCBITaxon:4909) and
      EU186536 is filed under /organism="Pichia kudriavzevii", so this is not a
      wrong-organism citation. Verified against PubMed and against the GenBank record
      on 2026-10-28.
  findings:
  - statement: The cloned 388-residue GPD complements S. cerevisiae gpd1 and gpd1 gpd2
      osmosensitive mutants and restores intracellular glycerol accumulation.
    supporting_text: Functional analysis revealed that Saccharomyces cerevisiae gpd1Delta
      and gpd1Delta/gpd2Delta osmosensitive mutants transformed with CgGPD were restored
      to the wild-type phenotype when cultured in high osmolarity media, suggesting that
      it is a functional GPD protein.
  - statement: The sequence deposited for this protein is GenBank EU186536, the EMBL
      record from which UniProtKB A8W1U0 is derived.
    supporting_text: The full-length CgGPD gene sequence including upstream and downstream
      regions has been deposited in GenBank under accession no. EU186536.
- id: PMID:41617712
  title: Bio-based oxalic acid production in Issatchenkia orientalis enables sustainable
    rare earth recovery.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Deletion of GPD in I. orientalis (= P. kudriavzevii) strain JL01
      removed glycerol, the major fermentation byproduct, without reducing the oxalic
      acid titer. The paper does not name the deleted locus or an accession, so the
      link to A8W1U0 rests on this being one of only two UniProt records for the single
      EC 1.1.1.8 gene of this species. The engineering context is an oxalate-producing
      strain for rare-earth recovery; GPD is deleted there, so the paper supplies
      evidence for the enzyme's role in glycerol synthesis, not a role in oxalate
      metabolism.
  findings:
  - statement: Deleting GPD in P. kudriavzevii abolishes glycerol byproduct accumulation
      while the oxalic acid titer is maintained.
    supporting_text: Since glycerol-3-phosphate dehydrogenase (GPD) plays a key role in
      the glycerol biosynthesis pathway, we knocked out the GPD gene in strain JL01, generating
      the strain JL02.
