id: A8W1U0
gene_symbol: GPD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:4909
  label: Pichia kudriavzevii
description: >-
  NAD(+)-dependent glycerol-3-phosphate dehydrogenase (EC 1.1.1.8) of the acid- and
  osmotolerant yeast Pichia kudriavzevii (Issatchenkia orientalis), a 388-residue
  cytosolic enzyme of the NAD-dependent glycerol-3-phosphate dehydrogenase family
  (PANTHER PTHR11728, NCBIfam TIGR03376, PIRSF000114) with an N-terminal
  Rossmann-fold NAD(+)-binding domain and a C-terminal substrate-binding domain
  carrying the conserved proton-acceptor lysine. Although the EC reaction is written
  as the oxidation of sn-glycerol 3-phosphate, the physiological direction in yeast is
  reductive: the enzyme reduces dihydroxyacetone phosphate from glycolysis to glycerol
  3-phosphate using NADH, which glycerol-3-phosphate phosphatase then dephosphorylates
  to glycerol. It is therefore the committed and rate-controlling step of glycerol
  synthesis, which serves two purposes in yeast: accumulating glycerol as a compatible
  solute during osmotic stress, and reoxidising surplus cytosolic NADH. The protein
  complements Saccharomyces cerevisiae gpd1 and gpd1 gpd2 mutants, restoring osmotic
  tolerance and intracellular glycerol accumulation, and deleting the gene in
  I. orientalis abolishes glycerol as a fermentation byproduct.
alternative_records:
- id: A0A2U9RB90
  relationship: REFERENCE_PROTEOME_EQUIVALENT
  reference_proteome: UP000249293
  reviewed_on: '2026-10-28'
  reason: >-
    A8W1U0 derives from a single genomic clone (EMBL EU186536) of an industrial
    glycerol-producing P. kudriavzevii isolate and belongs to no reference proteome.
    A0A2U9RB90 is the same gene in the sequenced reference isolate: both records
    cross-reference the same FungiDB locus C5L36_0E02100, and a UniProtKB search for
    EC 1.1.1.8 in NCBITaxon:4909 returns these two records and no others, so there is
    no competing paralog to confuse them. The sequences are not identical, and the
    differences are stated rather than glossed: A8W1U0 aligns to residues 28-415 of
    A0A2U9RB90 with 385/388 identities (99.2%; three substitutions, R89K, F165S and
    R228H in A8W1U0 numbering, consistent with two strains), and A0A2U9RB90's gene
    model adds 27 N-terminal residues that the A8W1U0 model starts after. Which
    initiator is used in vivo is unresolved, and no defect is asserted against either
    record: the shorter form is the one with functional data behind it, since the
    388-residue product complements S. cerevisiae gpd1. This relationship transfers no
    GO annotation, and the review keeps A8W1U0 as its accession.
  evidence:
  - type: PROTEOME_MEMBERSHIP
    description: >-
      A0A2U9RB90 is a current member of the P. kudriavzevii reference proteome
