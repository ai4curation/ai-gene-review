  review:
    summary: >-
      Nucleus from TreeGrafter, descending from a fungi-scoped PAINT node whose only
      seed is S. cerevisiae GPD1, where the nuclear pool is a stress-induced
      relocalisation of an otherwise cytosolic enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      The transfer is phylogenetically in scope and is not rejected. PAINT places
      nucleus at PTHR11728 node PTN000919785 under a taxon:4751 (Fungi) constraint,
      and this Saccharomycotina protein descends from it, so the question is not
      whether the clade inherited the property but what the property is. The seeding
      observation is that Gpd1p, a cytosolic and peroxisomal enzyme, redistributes to
      the cytosol and nucleus when cells are osmotically stressed; the nuclear pool is
      conditional and is discussed as spatial regulation of redox potential rather
      than as a site of glycerol-3-phosphate synthesis. Nothing is known about the
      distribution of this protein in P. kudriavzevii, and the single seed is not a
      reason to doubt the node (a well-characterised seed can carry a node), only a
      reason to read what it actually shows. Kept, but as a conditional, secondary
      location: cytosol is where the core activity acts, and GO:0005634 is not listed
      among the core function's locations.
