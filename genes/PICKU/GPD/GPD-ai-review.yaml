      supporting_text: DR   VEuPathDB; FungiDB:C5L36_0E02100; -.
    - reference_id: file:PICKU/GPD/GPD-record-evidence.yaml
      record_section: ["DR:VEuPathDB"]
      supporting_text: DR   VEuPathDB; FungiDB:C5L36_0E02100; -.
  - type: SEQUENCE_COMPARISON
    description: >-
      A0A2U9RB90 is 415 residues to A8W1U0's 388. Aligning A8W1U0 to residues 28-415
