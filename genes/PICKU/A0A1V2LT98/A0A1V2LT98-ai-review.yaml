  review:
    summary: Cytoplasm from TreeGrafter (PANTHER PTN001447571), descending from the PAINT fungal node
      that asserts cytosol.
    action: MODIFY
    reason: Cytoplasm is correct but less specific than the evidence supports, so it is refined to its
      part_of descendant cytosol. Budding-yeast pyruvate carboxylases are cytosolic (S. cerevisiae and
      Candida utilis by fractionation; S. cerevisiae Pyc isozyme by immunocytochemistry), and PAINT asserts
      cytosol at the fungal node PTN001050931 from which this Saccharomycotina protein descends. The protein
      lacks an N-terminal extension relative to S. cerevisiae Pyc1p, so there is no sign of mitochondrial
      targeting that would argue against the cytosolic call.
