    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011761
  review:
    summary: Metal ion binding from InterPro IPR011761 (ATP-grasp).
    action: MODIFY
    reason: Metal ion binding is correct but less specific than the evidence supports. UniProt annotates
      four Mn(2+)-binding sites in the carboxyltransferase active site by the curated PIRSR rule PIRSR001594-3
      (ECO:0000256|PIRSR:PIRSR001594-3), one of them via the carbamate group of the carboxylated lysine,
      so the term is refined to manganese ion binding. Mg(2+)-ATP is bound separately in the biotin carboxylase
      site, but the record annotates no Mg(2+) binding-site features, so magnesium ion binding is not proposed.
      The metal binding is a cofactor property of the core pyruvate carboxylase activity rather than a
      separate core function.
