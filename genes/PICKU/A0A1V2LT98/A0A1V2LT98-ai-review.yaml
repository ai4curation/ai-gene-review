- id: PMID:41617712
  title: Bio-based oxalic acid production in Issatchenkia orientalis enables sustainable rare earth recovery.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Endogenous PYC was integrated at two copies upstream of P. chrysogenum
      oxaloacetate hydrolase. Two and three copies gave the same oxalate titer; no single-copy or deletion
      control and no enzyme assay are reported. The paper does not name the PYC locus or accession, so
      the link to A0A1V2LT98 rests on this being the only PC in the P. kudriavzevii reference proteome.
  findings:
  - statement: Overexpression of endogenous PYC in an oxaloacetate hydrolase strain was used to increase
      oxalic acid production.
    supporting_text: To enhance oxalic acid production, we expressed the endogenous pyruvate carboxylase
      (PYC) in the strain OA_Pcoah.
- id: PMID:25159171
  title: Exploiting Issatchenkia orientalis SD108 for succinic acid production.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; endogenous pyc integrated together with mdh, fumr and frd raised succinate
      titers. A combined, flux-level result, not an assay of PC.
