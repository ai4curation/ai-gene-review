  review:
    summary: Pyruvate carboxylase activity (EC 6.4.1.1), the core activity, inferred from family membership.
    action: ACCEPT
    reason: The protein belongs to the pyruvate carboxylase family by every family classifier (NCBIfam
      TIGR01235, PIRSF001594, PANTHER PTHR43778:SF2). It has the complete single-chain domain architecture
      with the conserved active-site, ATP-binding, Mn(2+)-binding, carboxylysine and biotinyl-lysine positions.
      PAINT places pyruvate carboxylase activity at the family root node PTN001821692, which this protein
      descends from. There is no experimental characterization of this protein. In I. orientalis, integrating
      extra copies of the endogenous PYC gene raised oxaloacetate-derived product titers (succinate, PMID:25159171;
      oxalate, PMID:41617712). This is consistent with, but not a direct assay of, the activity.
