  label: Pichia kudriavzevii
description: 'Pyruvate carboxylase (PYC) of the acid-tolerant yeast Pichia kudriavzevii (Issatchenkia
  orientalis), the single pyruvate carboxylase encoded in its reference proteome. It is a 1180-residue
  single-chain biotin-dependent carboxylase (PANTHER PTHR43778, NCBIfam TIGR01235, PIRSF001594) closely
  related to Saccharomyces cerevisiae Pyc1p/Pyc2p, with an N-terminal biotin carboxylation domain containing
  an ATP-grasp subdomain, a pyruvate carboxyltransferase (HMGL-like) domain with Mn(2+)-binding residues
  and a carboxylated lysine, a PYC_OADA allosteric/tetramerization region, and a C-terminal biotinyl domain
  whose lysine is predicted to carry biotin. By family membership it is inferred to carboxylate pyruvate
  to oxaloacetate in two ATP- and biotin-dependent half-reactions in the cytosol, as the yeast enzymes
  do. It supplies oxaloacetate anaplerotically and for gluconeogenesis from pyruvate. In engineered I.
  orientalis SD108 strains, integrating extra copies of the endogenous PYC gene raised the titers of oxaloacetate-derived
  products: succinic acid, and oxalic acid made with a heterologous oxaloacetate hydrolase. These are
  flux results; the enzyme itself has not been purified or assayed.'
