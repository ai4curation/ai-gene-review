- term:
    id: GO:0004075
    label: biotin carboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000414646
  review:
    summary: Biotin carboxylase activity transferred by UniRule from the shared biotin carboxylation domain.
    action: KEEP_AS_NON_CORE
    reason: The N-terminal biotin carboxylation domain does catalyse the first half-reaction, ATP-dependent
      carboxylation of the covalently attached biotin. In a single-chain pyruvate carboxylase the carrier
      is the enzyme's own C-terminal biotinyl domain, not a separate carboxyl-carrier protein. The term
      is therefore a partial reaction of the overall pyruvate carboxylase activity, not an independent
      function. Kept as non-core; GO:0004736 is the core activity.
    supported_by:
    - reference_id: file:PICKU/A0A1V2LT98/A0A1V2LT98-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalyzes a 2-step reaction, involving the ATP-dependent carboxylation of the covalently
        attached biotin in the first step and the transfer of the carboxyl group to pyruvate in the second.
