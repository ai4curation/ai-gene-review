  - *id001
  - *id004
  - *id005
  - reference_id: PMID:41617712
    supporting_text: Strains with two and three copies of PYC produced a similar oxalic acid titer of
      1.52 g·L-1
  locations:
  - id: GO:0005829
    label: cytosol
suggested_questions:
- question: Do the gains in oxalate and succinate titer from extra PYC copies in I. orientalis come from
    more pyruvate carboxylase activity, and is the enzyme regulated by acetyl-CoA and aspartate as in
    S. cerevisiae?
suggested_experiments:
- description: Assay pyruvate carboxylase activity in extracts of the parent and PYC-overexpressing I.
    orientalis strains, and test a PYC deletion (with aspartate supplementation) for the effect on oxalate
    titer in the oxaloacetate hydrolase background.
