- id: PMID:10564790
  title: Biochemical and molecular characterization of a succinate semialdehyde dehydrogenase involved
    in the catabolism of 4-hydroxybutyric acid in Ralstonia eutropha.
  findings:
  - statement: The published gabD locus is directly linked to impaired 4-hydroxybutyrate utilization,
      and its cloned product was expressed in E. coli.
    supporting_text: 'A succinate semialdehyde dehydrogenase gene (gabD) was identified to be

      disrupted in a transposon-induced mutant of Ralstonia eutropha exhibiting the

      phenotype 4-hydroxybutyric acid-leaky.'
  - statement: A distinct NAD-dependent SSADH activity was also detected in the organism, so organism-level
      acceptor measurements cannot automatically be assigned to the cloned GabD.
    supporting_text: 'Enzymatic studies indicated the existence of a second NAD(+)-dependent succinate

      semialdehyde dehydrogenase in R. eutropha.'
  - statement: The local gene organization links GabD to the GABA-degradation system, supporting a pathway-role
      inference without claiming a recovered GABA growth assay.
    supporting_text: 'Similar to the molecular organization of

      the gab cluster in E. coli, additional genes encoding enzymes for the

      degradation of gamma-aminobutyrate are closely related to gabD in R. eutropha.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact primary source for AF175740/AAF19796.1 and Q9RBF6. Normal cache and provider-chain/publisher
      attempts remain abstract-only. Explicit abstract findings are used; cloned-enzyme cofactor discrimination,
      localization and detailed strain genealogy remain source-limited.
