core_functions:
- description: Nonacylating oxidation of succinate semialdehyde to succinate with either nicotinamide
    acceptor. BRENDA records 132.1 micromol/min/mg with NADP and 14.9 with NAD for the exact published
    clone at pH 11.0 and 30°C, so NADP is the major branch and NAD, at about 11%, the minor one; one
    active site and one reaction, which is why the single core uses the cofactor-general term rather than
    asserting a separate core per acceptor. The alkaline assay ratio is not a physiological cofactor
    ratio. The enzyme participates in selected-strain 4HB metabolism, with a conserved GABA-shunt role
    supported by its chemistry and gene neighborhood.
