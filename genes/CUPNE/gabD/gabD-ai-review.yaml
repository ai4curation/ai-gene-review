- id: url:https://www.brenda-enzymes.org/enzyme.php?ecno=1.2.1.79
  title: Information on EC 1.2.1.79 - succinate-semialdehyde dehydrogenase (NADP+) - BRENDA Enzyme Database
  findings:
  - statement: BRENDA associates the exact Q9RBF6 clone with both NADP and NAD activity, with the former
      greater in the stated pH 11/30°C assay. This resolves capacity but not physiological flux partition.
    supporting_text: '132.1

      Cupriavidus necator

      Q9RBF6

      cosubstrate NADP+, pH 11.0, 30°C

      288054

      14.9

      Cupriavidus necator

      Q9RBF6

      cosubstrate NAD+, pH 11.0, 30°C

      288054'
  - statement: The same source reports no specific induction of gabD by 4HB or GABA; pathway participation
      does not imply substrate-specific transcriptional induction.
    supporting_text: 'the expression of gabD is not specifically induced by either 4-hydroxybutanoic acid
      or gamma-aminobutanoate

      Cupriavidus necator

      Q9RBF6

      288054'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normally cached curated enzyme-database page. Only exact Q9RBF6/reference 288054 rows
      are used; reference 288054 resolves to the 1999 primary PMID10564790. This is independent curated
      extraction, not recovered primary full text. Numerical values retain their alkaline assay conditions;
      an apparent molecular-weight transcription error elsewhere on the page is not used.
core_functions:
- description: Nonacylating NADP-dependent oxidation of succinate semialdehyde to succinate. BRENDA records
    132.1 micromol/min/mg for the exact published clone at pH 11.0 and 30°C, exceeding its NAD-supported
    activity in the same conditions. The enzyme participates in selected-strain 4HB metabolism, with a
    conserved GABA-shunt role supported by its chemistry and gene neighborhood.
