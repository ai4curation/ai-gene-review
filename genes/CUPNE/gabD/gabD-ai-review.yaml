id: Q9RBF6
gene_symbol: gabD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:106590
  label: Cupriavidus necator
description: Cupriavidus necator GabD is a nonacylating succinate-semialdehyde dehydrogenase that oxidizes
  succinate semialdehyde toward succinate. The SHF3 enzyme participates in 4-hydroxybutyrate utilization,
  and its SSADH architecture and association with GABA-degradation genes support a role in the GABA shunt.
  Both NADP and NAD support catalysis, with substantially higher NADP-supported activity under the reported
  alkaline assay conditions; this preference does not establish the physiological cofactor ratio.
