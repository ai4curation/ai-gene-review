  review:
    summary: The compartment the TreeGrafter node asserts is the only one compatible with this enzyme's
      architecture and substrate, but it rests on inference rather than a location assay.
    action: KEEP_AS_NON_CORE
    reason: The proximate source is TreeGrafter node PANTHER:PTN000192659, and no imaging or fractionation
      of the SHF3 clone is available; the earlier UNDECIDED verdict recorded that gap, and the open question
      about an independent source is kept below. What the term claims is modest. Live QuickGO on 2026-11-02
      gives the GO:0005829 definition as "The part of the cytoplasm that does not contain organelles but
      which does contain other particulate matter, such as protein complexes", which for a bacterium without
      organelles is the soluble interior of the cell. Three independent lines agree on that compartment.
      The record is a single soluble aldehyde-dehydrogenase chain with no signal peptide and no transmembrane
      segment among its features (checked across the whole FT block). The substrate itself is intracellular,
      since succinate semialdehyde is generated inside the cell by 4-hydroxybutyrate oxidation and by GABA
      transamination, and the gab-cluster enzymes that supply it are themselves cytoplasmic. The characterized
      enterobacterial enzymes of this reaction, GabD and Sad, are cytoplasmic. The mitochondrial wording
      of PTHR43353 is a eukaryote-derived family name, not a localization assertion for this member, and
      no secretion, organelle or loss claim is implied. The row is therefore retained at the resolution
      the evidence supports, and marked non-core because the location is inferred background rather than
      part of the demonstrated functional claim; core_functions accordingly asserts no location.
