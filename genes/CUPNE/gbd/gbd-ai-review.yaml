- id: PMID:31981617
  title: Kinetics aspects of Gamma-hydroxybutyrate dehydrogenase.
  findings:
  - statement: The exact Q59104 fusion protein was assayed in the forward NAD-dependent reaction, establishing
      enzyme chemistry independently of growth phenotypes.
    supporting_text: 'gamma-hydroxybutyrate dehydrogenase (GHBDH, UniProt: Q59104), cloned from

      Cupriavidus necator as a fusion protein.'
  - statement: Mutagenesis establishes functional importance of the proposed iron ligands; the family-based
      iron coordination model remains distinct from a direct metal-occupancy measurement.
    supporting_text: 'The four previously proposed conserved Fe2+ chelators (D193, H197, H261 and H280)

      each are essential for GHBDH activity.'
  - statement: Nudix activation was tested with purified proteins from other species; it does not establish
      an obligatory native Cupriavidus regulatory component.
    supporting_text: 'Bacillus methanolicus activator (ACT, UniProt: I3EA59) and Escherichia coli NudF

      (UniProt Q93K97) proteins.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical paper explicitly naming Q59104. Normal PMID retrieval, full-text
      provider-chain recovery and ordinary publisher attempts remained abstract-only. Claims are limited
      to the accessible explicit assay results; no detailed full Methods are presumed.
- id: PMID:7851418
  title: Metabolic pathway for biosynthesis of poly(3-hydroxybutyrate-co-4-hydroxybutyrate) from 4-hydroxybutyrate
    by Alcaligenes eutrophus.
  findings:
  - statement: 4-Hydroxybutyrate-supported growth was selected in HF39-derived mutants, rather than observed
      in the parental strains.
    supporting_text: 'From A.

      eutrophus HF39 spontaneous primary mutants (e.g. SK4040) were isolated which

      grew on 4-hydroxybutyrate with doubling times of approximately 3 h.'
  - statement: Enzymic and isotope results support the free-acid route through succinate semialdehyde
      and succinate.
    supporting_text: 'This indicated that degradation

      of 4-hydroxybutyrate occurs via succinate semialdehyde and succinate'
  - statement: Cloned-fragment sequencing, enzymic analysis and insertion mutants identify the gbd-encoded
      4-hydroxybutyrate dehydrogenase step itself.
    supporting_text: DNA-sequence analysis of this fragment, enzymic analysis of the wild type and of
      mutants of A. eutrophus as well as of recombinant strains of Escherichia coli led to the identification
      of a structural gene encoding for a 4-hydroxybutyrate dehydrogenase which was affected by transposon
      mutagenesis in five of six available 4-hydroxybutyrate-negative mutants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary physiological and genetic source. Accessible abstract distinguishes H16/HF39
      from selected SK4040 and recombinant strains. Full text was not recovered; no unobserved strain-specific
      measurements are inferred.
