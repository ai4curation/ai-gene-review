  review:
    summary: Conserved iron-coordinating residues support iron binding in the Gbd catalytic site.
    action: MODIFY
    reason: Refine metal ion binding to iron ion binding. The Q59104-specific study tests the four conserved
      proposed Fe 2+ ligands and finds each essential for enzyme activity, while curated iron-alcohol-dehydrogenase
      membership supplies the structural interpretation. Mutational loss of activity alone is not a direct
      metal-occupancy measurement; the iron assignment combines that result with established family coordination
      chemistry.
    supported_by:
    - reference_id: PMID:31981617
      supporting_text: 'The four previously proposed conserved Fe2+ chelators (D193, H197, H261 and H280)

        each are essential for GHBDH activity.'
