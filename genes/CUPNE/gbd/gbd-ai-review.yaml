taxon:
  id: NCBITaxon:106590
  label: Cupriavidus necator
description: 'Gbd is an iron-family, NAD-dependent 4-hydroxybutyrate dehydrogenase of Cupriavidus necator.
  It reversibly interconverts 4-hydroxybutyrate and succinate semialdehyde. Forward oxidation supplies
  succinate semialdehyde for further oxidation to succinate in selected 4-hydroxybutyrate-utilizing strains.
  Expression context limits pathway availability: parental H16/HF39 strains do not grow on 4-hydroxybutyrate
  under the characterized conditions, whereas selected or cloned-fragment-expressing derivatives can use
  it.'
