core_functions:
- description: Secreted olfactomedin-domain protein that binds sulfated glycosaminoglycans (chondroitin
    sulfate E, heparin) of the extracellular matrix, inferred from the experimentally characterized mouse
    ortholog photomedin-1 within PANTHER subfamily PTHR23192:SF29; not tested in this species, and the
    downstream matrix-organizing consequence is unknown.
