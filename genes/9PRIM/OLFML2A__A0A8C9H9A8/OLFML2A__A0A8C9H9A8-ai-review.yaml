suggested_questions:
- question: Does OLFML2A participate in any defined signaling mechanism, as implied by the family-level
    PAINT signal transduction assertion seeded from noelins and myocilin, or is its role limited to
    glycosaminoglycan/matrix binding?
- question: Which proteoglycans carry the chondroitin sulfate E and heparan/heparin chains that OLFML2A
    binds in vivo (for example in retinal photoreceptor outer segments or podocyte major processes)?
suggested_experiments:
- description: Express recombinant red colobus or human OLFML2A, confirm secretion and disulfide-linked
    dimerization, and measure binding affinity to chondroitin sulfate E, heparin and heparan sulfate by
    surface plasmon resonance, with the olfactomedin domain and N-terminal CXCXCX9C region tested
    separately.
