    summary: TreeGrafter transfer of a family-level signaling assertion; no OLFML2A ortholog has evidence
      for a signaling mechanism.
    action: UNDECIDED
    reason: This annotation descends from the PAINT IBD for GO:0007165 at the bilaterian node
      PTN000573635, whose experimental seeds are MGI:1202864, MGI:1860437 and myocilin (UniProtKB:Q99972);
      mouse Olfml2a (MGI:2444741) is a seed for the extracellular-region IBD at the same node but not for
      signal transduction. The experiments on the mouse ortholog establish secretion, dimerization and
      glycosaminoglycan binding, not participation in a signaling pathway. There is equally no evidence
      that OLFML2A lost the ancestral property, so the node placement cannot be refuted here. Retained as
      UNDECIDED, consistent with the human OLFML2A review, pending evidence that an OLFML2A ortholog acts
