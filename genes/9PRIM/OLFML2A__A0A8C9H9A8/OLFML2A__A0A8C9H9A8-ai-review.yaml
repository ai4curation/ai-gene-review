  review:
    summary: OLFML2A is a secreted extracellular protein; the red colobus sequence carries a predicted
      signal peptide and is the SF29 ortholog of experimentally secreted mouse photomedin-1.
    action: ACCEPT
    reason: The UniProt "Secreted" subcellular location on this entry is an ARBA rule prediction and is
      not used as support. Independent support comes from the SignalP signal peptide (1..27) on the
      target and from the experimental secretion of the mouse ortholog photomedin-1, which shares
      PANTHER subfamily PTHR23192:SF29 and 84% identity over 99% of the target. The PAINT
      extracellular-region IBD at PTN000573635 also includes mouse Olfml2a among its experimental seeds.
      This is the right level of specificity for a located_in assertion; a more specific matrix location
      is proposed separately.
