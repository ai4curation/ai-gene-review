  label: Piliocolobus tephrosceles
description: OLFML2A (olfactomedin-like 2A, photomedin-1) of the Ugandan red colobus is a predicted
  secreted glycoprotein of 655 residues with an N-terminal signal peptide, two N-terminal CXCXCX9C
  cysteine motifs, a central low-complexity region and a C-terminal olfactomedin domain. It is the
  ortholog of human OLFML2A and mouse photomedin-1 (PANTHER subfamily PTHR23192:SF29). The mouse
  ortholog is secreted as a disulfide-linked homodimer and binds the sulfated glycosaminoglycans
  chondroitin sulfate E and heparin, consistent with an extracellular protein that associates with
  proteoglycan-containing matrix. No experiment has been performed on the red colobus protein; its
  functions are inferred from these orthologs, and a specific matrix-organizing or signaling role has
  not been established for any OLFML2A ortholog.
