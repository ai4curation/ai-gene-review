- term:
    id: GO:0050840
    label: extracellular matrix binding
  evidence_type: ISS
  original_reference_id: PMID:15836428
  qualifier: enables
  review:
    summary: Proposed by ortholog inference from mouse photomedin-1, which binds chondroitin sulfate E and
      heparin.
    action: NEW
    reason: Mouse photomedin-1 (Q8BHP7) was tested against a panel of ECM components and bound chondroitin
      sulfate E and heparin; MGI annotates it to extracellular matrix binding by IDA. The red colobus
      protein is in the same PANTHER subfamily (PTHR23192:SF29), 84% identical to mouse and 97.5% to human
      OLFML2A over essentially its full length, and conserves the olfactomedin-domain cysteines and the
      N-terminal CXCXCX9C motifs, so this is an ortholog-level inference, not an experimental result in
      this species. The human ortholog carries the same term by Ensembl Compara transfer. PAINT did not
      propagate this term to the deep family node, which is a judgement about the olfactomedin family as a
      whole rather than about the OLFML2A subfamily. More specific glycosaminoglycan-binding terms
      (heparin binding, chondroitin sulfate binding) could be considered once the binding has been
      examined beyond the original screen.
