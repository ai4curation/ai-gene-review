description: >-
  The OLFML2A subfamily assignment and experimentally grounded mouse Olfml2a annotations support inferred
  extracellular matrix localization and involvement in matrix organization. These are ortholog-based gene-product
  inferences; secretion and function of the deposited 439-residue primate sequence have not been demonstrated.
