      id: GO:0030198
      label: extracellular matrix organization
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Mouse photomedin secretion and glycosaminoglycan binding support extracellular matrix association
        (PMID:15836428). They do not demonstrate assembly, rearrangement, or disassembly of the matrix,
        which is the process predicted here. Neither the target olfactomedin domain nor its OLFML2A placement
        establishes that additional role. Matrix organization is absent from the cached annotations, and
        a functional study of a sufficiently close relative or the target is needed to support this process.
      supported_by:
