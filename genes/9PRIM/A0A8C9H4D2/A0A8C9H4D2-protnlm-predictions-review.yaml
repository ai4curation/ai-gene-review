      summary: >-
        Extracellular matrix is correct for full-length OLFML2A: mouse photomedin-1 (Q8BHP7, same PANTHER
        subfamily PTHR23192:SF29) is experimentally secreted and binds chondroitin sulphate-E and heparin
        (PMID:15836428), and the review of the full-length red colobus product A0A8C9H9A8 proposes this
        location. This accession, however, is the short isoform that starts at an alternative first exon
        and lacks the region carrying the signal peptide, both CXCXCX9C motifs and the coiled coil. Without
        a signal peptide it is not expected to enter the classical secretory pathway, and there is no
        evidence of release by another route. The gene review marks the parent location, extracellular
        region (GO:0005576, an ancestor of GO:0031012 by OLS4), as over-annotated on this product for that
        reason, which equally refutes the more specific matrix location. The prediction transfers a
        full-length-protein property to a product lacking the required targeting segment. The term is
        absent from GOA for both products of the gene, so it would have been novel.
