    predicted_term:
      id: GO:0030198
      label: extracellular matrix organization
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      confidence_score: 0
      summary: >-
        Any part the gene plays in extracellular matrix organization depends on the protein being secreted
        to the matrix, which requires the N-terminal signal peptide. This accession is the 439-residue short
        isoform that starts at an alternative first exon (counterpart of human isoform 3). Its residues 9-439
        align to residues 225-655 of the full-length product of the same gene, A0A8C9H9A8, which carries a
        SignalP signal peptide at 1-27. A0A8C9H4D2 has no counterpart of that region, so it lacks the signal
        peptide, both CXCXCX9C motifs and the coiled coil, and it is not expected to enter the classical
        secretory pathway. No evidence shows release by another route. It therefore lacks the feature that
        matrix participation needs, the same reason the extracellular matrix location prediction is
        rejected for this product. At the gene level the claim is in any case weak. The only experimental
        basis is an MGI IDA annotation of mouse Olfml2a (Q8BHP7, PTHR23192:SF29) with the
        acts_upstream_of_or_within qualifier, from a systematic screen of candidate secreted proteins for
        matrix-assembling activities (PMID:18757743). Secretion and glycosaminoglycan binding of full-length
        photomedin-1 (PMID:15836428) make a matrix role plausible, but no assembly result exists for any
        ortholog. Neither product of the gene carries the term in GOA.
      supported_by:
        - reference_id: PMID:18757743
          supporting_text: >-
            These assays screened the candidate proteins for ECM-assembling activities
        - reference_id: PMID:15836428
          supporting_text: >-
