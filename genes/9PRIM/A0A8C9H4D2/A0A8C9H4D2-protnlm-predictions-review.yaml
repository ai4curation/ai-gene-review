id: A0A8C9H4D2
gene_symbol: OLFML2A
taxon:
  id: NCBITaxon:591936
  label: Piliocolobus tephrosceles
status: COMPLETE
description: >-
  A0A8C9H4D2 is the 439-residue short alternative-first-exon isoform of Ugandan red colobus OLFML2A
  (counterpart of human isoform 3). It keeps the olfactomedin domain but lacks the signal peptide, both
  CXCXCX9C motifs and the coiled coil of full-length photomedin-1; the full-length product of the same
  gene is A0A8C9H9A8. Mouse photomedin-1 experiments establish secretion, matrix association and
  glycosaminoglycan binding for the full-length protein. Extracellular matrix localization is rejected for
  this signal-peptide-less product, consistent with the gene review's judgment that extracellular region
  is over-annotated here. Extracellular matrix organization is unresolved: the only experimental support
  is an acts_upstream_of_or_within mouse annotation from an ECM screen that the mouse review leaves
  UNDECIDED, and no PubMed record reports a matrix-assembly result for any OLFML2A ortholog.
