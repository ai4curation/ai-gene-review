      label: extracellular matrix
    predicted_term_type: GO_CC
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The primate target and mouse photomedin-1 (Olfml2a; Q8BHP7) share the OLFML2A PANTHER subfamily
        PTHR23192:SF29. Mouse photomedin-1 was experimentally secreted as a disulfide-bonded dimer; the
        photomedins bound chondroitin sulphate-E and heparin, supporting association with extracellular
        glycosaminoglycans (PMID:15836428). This supports an inferred matrix-associated location for the
        OLFML2A gene product rather than transferring a generic olfactomedin-domain property. The 439-residue
        primate record lacks an annotated signal peptide, so secretion of that deposited sequence is not
        demonstrated; the assignment relies on conserved ortholog biology, not on an observed targeting
        signal in this record. Matrix association is absent from the cached target annotations, making
        COR appropriate for this explicitly inferred localization. Matrix organization is a separate,
        unsupported process claim.
