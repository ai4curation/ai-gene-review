        - reference_id: file:9PRIM/A0A8C9H4D2/A0A8C9H4D2-bioinformatics/RESULTS.md
          supporting_text: >-
            without a signal peptide it is not expected to enter the classical secretory pathway.
        - reference_id: file:9PRIM/A0A8C9H4D2/A0A8C9H4D2-bioinformatics/RESULTS.md
          supporting_text: >-
            A0A8C9H9A8 carries a SignalP signal peptide 1..27 and the olfactomedin domain 397..655;
            A0A8C9H4D2 has no signal peptide feature.
