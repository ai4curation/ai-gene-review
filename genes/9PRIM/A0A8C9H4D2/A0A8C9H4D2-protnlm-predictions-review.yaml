      label: extracellular matrix organization
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Mouse photomedin-1 (Olfml2a; Q8BHP7) has an MGI IDA annotation to extracellular matrix organization,
        with the relation acts_upstream_of_or_within. The QuickGO record identifies PMID:18757743 as its
        source: a study that includes functional ECM-assembly assays. This is distinct from the secretion
        and glycosaminoglycan-binding evidence in PMID:15836428. The experimentally grounded curated process
        annotation, together with the matching OLFML2A PANTHER subfamily PTHR23192:SF29, supports transfer
        of a broad involvement in matrix organization to the primate gene product. COR denotes this ortholog-based
        inference, not a demonstrated matrix-remodeling mechanism or an assay of the deposited 439-residue
        sequence. The process is absent from the cached target annotations.
