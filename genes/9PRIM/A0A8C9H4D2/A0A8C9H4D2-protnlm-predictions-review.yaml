    predicted_term_type: GO_CC
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The target has an olfactomedin domain and an OLFML2A subfamily assignment in the sequence record.
        Mouse photomedins are secreted and bind extracellular glycosaminoglycans (PMID:15836428), supporting
        matrix association by transfer within this vertebrate subfamily. This is a family-based localization
        inference, not a localization experiment on the primate protein; the deposited sequence has no
        annotated signal peptide, so its completeness and secretion route remain unresolved. Extracellular
        matrix is absent from the cached GOA/UniProt annotations and is more specific than their extracellular
        region/space terms.
      supported_by:
