predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0035582
      label: sequestering of BMP in extracellular matrix
    predicted_term_type: GO_BP
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 12.13). BMP sequestration in the ECM is characterised for
        other olfactomedin-superfamily members and BMP-binding matrix proteins, not for
        OLFML2A, which acts as a matricellular regulator downstream of AP-1 and influences
        integrin, HGF and NGF signalling. The extracellular-matrix half of the claim is
        right and matches GOA's extracellular region annotation; the BMP half is a paralog
        transfer. The term is additionally obsolete in the current GO release, so it is not
        usable as an annotation regardless.
      supported_by:
        - reference_id: GO_REF:0000044
          supporting_text: Secreted localization inferred from UniProt subcellular location vocabulary mapping.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0036122
      label: BMP binding
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 11.71). The molecular-function counterpart of the rank-1 error. A
        five-bladed olfactomedin beta-propeller is a protein-interaction module and BMP
        binding is chemically plausible for one, but no BMP interaction has been reported
        for OLFML2A, and this review assigns extracellular matrix structural constituent as
        the core function instead. Asserting a specific ligand without evidence is exactly
        the failure mode that makes retrieval-derived annotations hard to trust.
      supported_by:
        - reference_id: GO_REF:0000044
          supporting_text: Secreted localization inferred from UniProt subcellular location vocabulary mapping.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0016205
      label: selenocysteine methyltransferase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 3 (score 11.29). This is not a coherent prediction for a secreted
        beta-propeller glycoprotein - selenocysteine methyltransferase is a plant/bacterial
        cytoplasmic SAM-dependent enzyme - and there is no route by which OLFML2A could
        carry it. It is recorded as UNC rather than NPI because it reads as retrieval noise
        rather than a substantive claim: at rank 3 the score has already dropped close to
        the background level for this query, so the ranked list has run out of signal. The
        practical implication is that a fixed top-k cut on ProTrek output will pick up
        noise for proteins with weak family matches.
      supported_by:
        - reference_id: GO_REF:0000044
          supporting_text: Secreted localization inferred from UniProt subcellular location vocabulary mapping.
