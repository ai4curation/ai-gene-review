id: A0A8C9H4D2
gene_symbol: OLFML2A
taxon:
  id: NCBITaxon:591936
  label: Piliocolobus tephrosceles
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for OLFML2A, a secreted olfactomedin-domain
  glycoprotein. ProTrek's GO channel returns BMP-sequestration and BMP-binding terms,
  and its free-text Function channel returns the descriptions of olfactomedin-family
  neighbours olfactomedin-1/noelin and gliomedin (axon and dendrite arborization, neural
  crest migration, BMP modulation). The family placement is right and the secreted
  character is right, but the specific functional claims belong to different olfactomedin
  paralogs; OLFML2A itself is a matricellular ECM protein with no reported BMP-binding
  activity. Two of the three top calls resolve to terms GO has since obsoleted, so they
  could not be entered as annotations even if they were correct. ProtNLM2 on the same
  protein produced extracellular matrix and extracellular matrix organization, which the
  ARGO-ProtNLM-50 evaluation scored as correct-and-novel; ProTrek does not recover
  either.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (PLI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/9PRIM/A0A8C9H4D2/A0A8C9H4D2-uniprot.txt
