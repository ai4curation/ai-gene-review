core_functions:
- description: >-
    Retains the complete olfactomedin domain of photomedin-1. For the
    full-length secreted OLFML2A protein, the established activity is binding
    of sulfated extracellular glycosaminoglycans (chondroitin sulfate E,
    heparin). It is not known whether this short isoform, which lacks the
    signal peptide and the N-terminal dimerization-motif region, is made or has
    this activity.
  molecular_function:
    id: GO:0050840
    label: extracellular matrix binding
  supported_by:
  - reference_id: PMID:15836428
    supporting_text: >-
      Among
      a panel of ECM components, including glycosaminoglycans, photomedins
      preferentially bound to chondroitin sulphate-E and heparin.
  - reference_id: file:9PRIM/A0A8C9H4D2/A0A8C9H4D2-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: PANTHER; PTHR23192:SF29; OLFACTOMEDIN-LIKE PROTEIN 2A; 1.
  - reference_id: file:9PRIM/A0A8C9H4D2/A0A8C9H4D2-bioinformatics/RESULTS.md
    supporting_text: >-
      It retains the complete C-terminal olfactomedin domain but lacks the
      signal peptide, both CXCXCX9C motifs and the coiled coil.
suggested_questions:
- question: >-
    Is the short alternative-first-exon OLFML2A transcript (human isoform 3,
    Piliocolobus XP_023072933.1) translated? If so, where does the
    signal-peptide-less product go, and does its olfactomedin domain alone bind
    chondroitin sulfate E or heparin?
- question: >-
    Should the ARBA "Secreted" rule exclude UniProt records that lack a
    predicted signal peptide, such as this N-terminally truncated isoform?
suggested_experiments:
- hypothesis: >-
    The olfactomedin domain alone, as encoded by the short isoform, is not
    secreted but keeps glycosaminoglycan-binding activity.
  description: >-
    Express tagged full-length and short-isoform OLFML2A in HEK293 cells.
    Compare intracellular and conditioned-medium fractions under non-reducing
    and reducing SDS-PAGE, and test purified olfactomedin-domain protein for
    binding to chondroitin sulfate E and heparin by solid-phase assay.
  experiment_type: biochemical localization and binding assay
