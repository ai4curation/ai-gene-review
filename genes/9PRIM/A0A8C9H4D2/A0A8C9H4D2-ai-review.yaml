- id: file:9PRIM/A0A8C9H4D2/A0A8C9H4D2-bioinformatics/RESULTS.md
  title: A0A8C9H4D2 gene-model comparison against human OLFML2A and the same-gene full-length product
  findings:
  - statement: >-
      A0A8C9H4D2 is the counterpart of human isoform 3 (Q68BL7-3) and matches it
      over its full length (97.3% identity). It lacks the region equivalent to
      human residues 1-222, which contains the signal peptide, both CXCXCX9C
      motifs and the coiled coil. The full-length product of the same gene is
      A0A8C9H9A8 (655 aa).
    supporting_text: >-
      A0A8C9H4D2 (XP_023072933.1, isoform X2) is the short alternative-first-exon
      isoform of Piliocolobus OLFML2A, the counterpart of human isoform 3.
