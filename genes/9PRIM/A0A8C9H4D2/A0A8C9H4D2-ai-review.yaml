id: A0A8C9H4D2
gene_symbol: OLFML2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:591936
  label: Piliocolobus tephrosceles
description: >-
  OLFML2A (olfactomedin-like 2A, photomedin-1) is a member of the olfactomedin
  domain protein family (PANTHER PTHR23192, subfamily SF29). The full-length
  protein is a secreted glycoprotein. It has a signal peptide, two tandem
  N-terminal CXCXCX9C cysteine motifs, a coiled coil and a C-terminal
  olfactomedin domain. In mouse it is secreted as a disulfide-linked dimer and
  binds the sulfated glycosaminoglycans chondroitin sulfate E and heparin. This
  accession (439 aa) is the short isoform of the Ugandan red colobus gene,
  corresponding to human isoform 3, which is transcribed from an alternative
  first exon. It keeps the complete olfactomedin domain but lacks the signal
  peptide, both cysteine motifs and the coiled coil. Whether this short product
  is made, and where it is located or what it does, has not been tested. The
  full-length product of the same gene is A0A8C9H9A8.
existing_annotations:
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Electronic mapping of a UniProt "Secreted" subcellular location, which was
      assigned to this record by an ARBA rule. Secretion is established for
      full-length photomedin-1. This accession is the short isoform and has no
      signal peptide.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The full-length OLFML2A product (A0A8C9H9A8 in this species, Q68BL7-1 in
      human) is a secreted protein, and extracellular region is correct for the
      gene. A0A8C9H4D2 starts at an alternative first exon and lacks residues
      equivalent to human 1-222, so it has no signal peptide. It would not be
      expected to enter the classical secretory pathway, and there is no evidence
      that it is released by any other route. The ARBA-derived secretion
      annotation was applied to this record without considering that the signal
      peptide is missing. The term should be kept on the full-length product, not
      on this short isoform.
    supported_by:
    - reference_id: file:9PRIM/A0A8C9H4D2/A0A8C9H4D2-bioinformatics/RESULTS.md
      supporting_text: >-
        It retains the complete C-terminal olfactomedin domain but lacks the
        signal peptide, both CXCXCX9C motifs and the coiled coil.
    - reference_id: PMID:15836428
      supporting_text: >-
        were secreted as disulphide-bonded dimers (photomedin-1) or oligomers/multimers
        (photomedin-2) with O-linked carbohydrate chains
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      TreeGrafter transfer of the PAINT signal-transduction placement for the
      olfactomedin family. The donors behind that node are myocilin and other
      olfactomedins, not OLFML2A.
    action: UNDECIDED
    reason: >-
      The PAINT IBD for GO:0007165 in PTHR23192 sits at PTN000573635 (Bilateria)
      and is seeded by MYOC (Q99972) and two mouse olfactomedins. This is a
      deliberate phylogenetic placement, and OLFML2A (SF29) falls within it.
      There is no OLFML2A-specific evidence that confirms or refutes inheritance
      of a signal-transduction role. The only experiments on OLFML2A show
      secretion, dimerization and glycosaminoglycan binding. The cancer cell-line
      studies show only correlation or perturbation effects on signaling. In
      addition, this short isoform lacks the signal peptide that an extracellular
      signaling role would require. I keep the same UNDECIDED judgment as the
      human OLFML2A IBA row rather than removing an inherited annotation without
      evidence against it.
    supported_by:
    - reference_id: file:9PRIM/A0A8C9H4D2/A0A8C9H4D2-bioinformatics/RESULTS.md
      supporting_text: >-
        Whether this short transcript is translated, and where the product goes,
        has not been tested in any species
    - reference_id: PMID:15836428
      supporting_text: >-
        Among
        a panel of ECM components, including glycosaminoglycans, photomedins
        preferentially bound to chondroitin sulphate-E and heparin.
