gene_symbol: CSN1S1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9913
  label: Bos taurus
description: Alpha-S1-casein is the most abundant protein of bovine milk (roughly 40% of casein) and a member of the calcium-sensitive
  casein family, which arose from the secretory calcium-binding phosphoprotein (SCPP) gene family. It is synthesized only
  in mammary epithelial cells during lactation, enters the secretory pathway via an N-terminal signal peptide, and is multiply
  phosphorylated on serine residues in the Golgi, forming phosphoserine clusters (phosphate centres). The intrinsically disordered
  protein binds calcium and, with alpha-s2- and beta-casein, sequesters nanoclusters of amorphous calcium phosphate, assembling
  with surface kappa-casein into casein micelles that let milk carry calcium and phosphate far above their solubility without
  calcifying the mammary gland. Alpha-s1-casein forms disulfide-linked and membrane-associated forms in the endoplasmic reticulum
  and is required for efficient ER-to-Golgi export of the other caseins and for micelle biogenesis; its absence in goats or
  mice reduces milk protein and calcium phosphate secretion. It has chaperone-like, anti-aggregation properties, potently
  suppressing amyloid fibril formation by alpha-s2-casein. In the gut it is a source of proteolytically released bioactive
  peptides and amino acids for the neonate, and it is a major allergen in cow's milk allergy.
