  review:
    summary: In vitro, purified bovine alpha-s1-casein binds Abeta(1-40) and delays its fibrillation (thioflavin T, light
      scattering, AFM).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The experiment is real, but Abeta is not a physiological partner of a milk-secreted casein: the two never meet
      in vivo. The assay demonstrates a generic hydrophobic, chaperone-like surface of an intrinsically disordered protein
      rather than a specific amyloid-beta binding function. The physiologically relevant manifestation of this property is
      suppression of casein (alpha-s2) fibrillation in milk (PMID:18302322), not Abeta binding.'
