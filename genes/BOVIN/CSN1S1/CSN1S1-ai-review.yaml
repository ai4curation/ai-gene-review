- term:
    id: GO:0140314
    label: calcium ion sequestering activity
  evidence_type: TAS
  original_reference_id: PMID:23958008
  review:
    summary: Through its phosphoserine clusters (phosphate centres), alpha-s1-casein binds calcium and sequesters amorphous
      calcium phosphate nanoclusters, keeping milk stable although it is supersaturated in calcium phosphate.
    action: NEW
    reason: Core molecular function of the calcium-sensitive caseins, absent from bovine GOA. GO:0140314 (binding a calcium
      ion to prevent it interacting with other partners) is the closest available MF term for calcium phosphate sequestration;
      the mouse and rat orthologs already carry the parent molecular sequestering activity (GO:0140313). Chosen for consistency
      with the human CSN1S1 review.
    supported_by:
    - &id013
      reference_id: file:BOVIN/CSN1S1/CSN1S1-uniprot.txt
      supporting_text: Important role in the capacity of milk to transport calcium phosphate.
    - *id002
    - &id014
      reference_id: PMID:25632319
      supporting_text: As a result, calcium and phosphate concentrations in milk can be far in excess of their solubility.
    - reference_id: PMID:21245413
      supporting_text: Ca-sensitive caseins (α(s)- and β-caseins) bind Ca but precipitate at high Ca concentrations, whereas
        Ca-insensitive casein (κ-casein) does not usually interact with Ca but instead stabilizes the micelle.
- term:
    id: GO:0007595
    label: lactation
  evidence_type: TAS
  original_reference_id: PMID:10504344
  review:
    summary: Alpha-s1-casein is required for efficient ER-to-Golgi export of beta- and kappa-casein (goat alpha-s1 null) and
      its loss in mouse curtails secretion of milk proteins and calcium phosphate.
    action: NEW
    reason: 'Participation test: alpha-s1-casein does part of the work of milk production, acting with the other caseins in
      the ER to drive their export and micelle biogenesis, not merely being a cargo. Comparator check: mouse and rat Csn1s1,
      Csn2 and Csn3 and bovine CSN2/CSN3 all carry GO:0007595, so its absence from bovine CSN1S1 is a gap rather than a convention.'
    supported_by:
    - reference_id: PMID:10504344
      supporting_text: We conclude that optimal export of the caseins out of the endoplasmic reticulum is dependent upon alpha(S1)-casein.
    - reference_id: PMID:21789179
      supporting_text: Absence of α-casein protein significantly curtails secretion of other milk proteins and calcium-phosphate,
        suggesting a role for α-casein in the establishment of casein micelles.
    - *id012
