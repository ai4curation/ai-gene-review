- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: IDA
  original_reference_id: PMID:22155633
  qualifier: involved_in
  review:
    summary: Alpha-s1-casein acts as a chaperone-like holdase in vitro, delaying Abeta(1-40) aggregation; alpha-s-casein also
      prevents aggregation of whey proteins and alpha-s2-casein fibrillation.
    action: KEEP_AS_NON_CORE
    reason: Protein stabilization includes preventing aggregation. The cited assay uses a non-physiological substrate (Abeta),
      but the chaperone-like anti-aggregation property of alpha-s1-casein is supported for physiological milk substrates (alpha-s2-casein
      fibrils, whey proteins) and is thought to be part of why casein micelles rather than amyloid form in milk. It is a secondary
      property of the micelle-forming protein rather than its core function.
    supported_by:
    - *id007
    - *id008
    - reference_id: PMID:10336443
      supporting_text: It also prevents aggregation of its natural substrates, the whey proteins.
- term:
    id: GO:0060416
    label: response to growth hormone
  evidence_type: IDA
  original_reference_id: PMID:16174355
  qualifier: involved_in
  review:
    summary: Growth hormone induces alpha-s1-casein mRNA and alpha-casein release in a bovine mammary epithelial cell line.
    action: MARK_AS_OVER_ANNOTATED
    reason: CSN1S1 is the readout of GH action in this experiment (its mRNA and secreted protein increase), not a component
      of the GH response machinery. Expression-based 'response to' annotations on a readout gene over-state the gene product's
      role; marked as over-annotation rather than removed because the hormone-responsiveness of the gene is real.
    supported_by:
    - reference_id: PMID:16174355
      supporting_text: Although alpha(s1-) casein mRNA expression was not detected in untreated control cells, its expression
        was observed in BMEC in response to the GH, DIP and GH + DIP treatments.
- term:
