- id: file:BOVIN/CSN1S1/CSN1S1-uniprot.txt
  title: UniProtKB P02662 (CASA1_BOVIN) flat file
  findings: []
core_functions:
- description: Calcium-sensitive milk phosphoprotein that, through clustered phosphoserines, binds calcium and sequesters
    amorphous calcium phosphate nanoclusters in the Golgi and in secreted casein micelles, allowing milk to carry supersaturating
    calcium phosphate to the neonate without calcifying the mammary gland.
  molecular_function:
    id: GO:0140314
    label: calcium ion sequestering activity
  directly_involved_in:
  - id: GO:0007595
    label: lactation
  locations:
  - id: GO:0005796
    label: Golgi lumen
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - *id013
  - *id002
  - *id003
  - *id014
suggested_questions:
- question: Does the chaperone-like, anti-fibrillar activity of alpha-s1-casein contribute measurably to preventing amyloid
    (corpora amylacea) in the bovine mammary gland in vivo, or is it a side-effect of micelle assembly?
- question: Is the requirement for alpha-s1-casein in ER export of the other caseins (shown in goat and mouse) mediated by
    its disulfide-linked, membrane-associated form, and does the same hold in cattle carrying low-expression CSN1S1 alleles?
- question: GO has no term for calcium phosphate (as opposed to calcium ion) sequestering activity; would a dedicated MF term
    better capture the nanocluster-sequestering function of SCPP phosphoproteins such as caseins and osteopontin?
suggested_experiments:
- hypothesis: Alpha-s1-casein phosphate centres are necessary for calcium phosphate sequestration in the mammary Golgi.
  description: Express wild-type and Ser-to-Ala phosphate-centre mutant bovine alpha-s1-casein in mammary epithelial cells
    (or a Csn1s1-null mouse rescue) and measure milk/medium calcium and phosphate, micelle size and Golgi calcification.
  experiment_type: mutagenesis
- hypothesis: Loss of alpha-s1-casein causes casein retention in the ER in bovine mammary cells as in goats.
  description: CRISPR knockout of CSN1S1 in a bovine mammary epithelial cell line followed by pulse-chase of beta- and kappa-casein
    export and electron microscopy of ER cisternae.
  experiment_type: gene knockout
