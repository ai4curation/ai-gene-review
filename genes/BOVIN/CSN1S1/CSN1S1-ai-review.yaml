    label: negative regulation of supramolecular fiber organization
  evidence_type: IDA
  original_reference_id: PMID:22155633
  qualifier: involved_in
  review:
    summary: Alpha-s1-casein lengthens the nucleation lag phase and slows Abeta(1-40) fibril formation in vitro.
    action: KEEP_AS_NON_CORE
    reason: The in vitro inhibition of fibril (supramolecular fiber) formation is directly demonstrated. Although Abeta is
      not a physiological substrate, alpha-s1-casein also potently inhibits fibrillation of its natural partner alpha-s2-casein,
