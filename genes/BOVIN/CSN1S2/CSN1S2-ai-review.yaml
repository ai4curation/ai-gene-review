- term:
    id: GO:0140314
    label: calcium ion sequestering activity
  evidence_type: TAS
  original_reference_id: PMID:23958008
  review:
    summary: Alpha-s2-casein, the most highly phosphorylated bovine casein (three phosphoserine clusters), binds calcium and
      contributes to sequestration of amorphous calcium phosphate nanoclusters in casein micelles.
    action: NEW
    reason: Core molecular function of the calcium-sensitive caseins, absent from bovine GOA for this gene. GO:0140314 is
      the closest MF term for calcium phosphate sequestration and matches the term proposed for the alpha-s1 and human reviews
      in this family.
    supported_by:
    - &id008
      reference_id: file:BOVIN/CSN1S2/CSN1S2-uniprot.txt
      supporting_text: Important role in the capacity of milk to transport calcium phosphate.
    - &id009
      reference_id: PMID:21245413
      supporting_text: Ca-sensitive caseins (α(s)- and β-caseins) bind Ca but precipitate at high Ca concentrations, whereas
        Ca-insensitive casein (κ-casein) does not usually interact with Ca but instead stabilizes the micelle.
    - *id002
    - reference_id: PMID:25632319
      supporting_text: As a result, calcium and phosphate concentrations in milk can be far in excess of their solubility.
    - reference_id: PMID:31928725
      supporting_text: "The remarkable ability of caseins to sequester nanoclusters of calcium phosphate in stable complexes is due to their flexible conformation and multiply-phosphorylated short sequences."
    - reference_id: PMID:32921475
      supporting_text: "In casein micelle (CM), Ca is either precipitated in the colloidal calcium phosphate (CCP) stabilized by clusters of phosphoserine (SEP) residues, or is directly bound to SEP (or glutamic and aspartic acids) of caseins without inorganic phosphate."
    - reference_id: file:BOVIN/CSN1S2/CSN1S2-deep-research-openscientist.md
      supporting_text: "Its \"substrate\" in the carrier sense is **calcium phosphate** (and, demonstrably, other divalent metals such as iron); its binding chemistry is electrostatic/coordinate chelation by clustered phosphoserine side chains rather than catalysis."
