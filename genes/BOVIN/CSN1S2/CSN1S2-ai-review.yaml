id: P02663
gene_symbol: CSN1S2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9913
  label: Bos taurus
description: Alpha-S2-casein is a calcium-sensitive casein of ruminant milk (up to about 10% of bovine casein) and a member
  of the SCPP-derived casein family; it is absent from human milk. It is synthesized by mammary epithelial cells during lactation,
  secreted via an N-terminal signal peptide, and is the most highly phosphorylated bovine casein, with three clusters of phosphoserines
  and a basic C-terminal region. Like alpha-s1- and beta-casein it binds calcium and sequesters nanoclusters of amorphous
  calcium phosphate, and it assembles with the other caseins into micelles stabilized by surface kappa-casein, allowing milk
  to carry calcium phosphate far above its solubility. Its two cysteines allow disulfide-linked dimers, and the dimeric form
  binds tissue-type plasminogen activator, contributing to the association of the plasminogen-activating system with casein
  micelles in milk. Isolated alpha-s2-casein readily forms amyloid fibrils at physiological pH and temperature, a tendency
  suppressed by alpha-s1-casein, which may relate to amyloid deposits (corpora amylacea) in the bovine udder. Proteolysis
  releases peptides such as casocidin-I, which has antibacterial activity in vitro.
