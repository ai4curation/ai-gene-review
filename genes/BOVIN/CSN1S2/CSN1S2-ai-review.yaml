core_functions:
- description: Highly phosphorylated, calcium-sensitive milk casein that binds calcium through phosphoserine clusters and,
    with alpha-s1- and beta-casein, sequesters amorphous calcium phosphate nanoclusters in Golgi-assembled casein micelles,
    enabling milk to deliver supersaturating calcium phosphate to the neonate.
  molecular_function:
    id: GO:0140314
    label: calcium ion sequestering activity
  locations:
  - id: GO:0005796
    label: Golgi lumen
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - *id008
  - *id009
  - *id002
  - *id003
suggested_questions:
- question: Does tPA binding by disulfide-dimeric alpha-s2-casein measurably control plasmin generation and casein proteolysis
    in milk in vivo, and is it conserved in alpha-s2-like caseins of species other than cattle?
- question: What is the specific contribution of alpha-s2-casein to micellar calcium phosphate content, given that it is the
    most phosphorylated bovine casein yet a minor fraction and is absent from human milk?
- question: Does alpha-s2-casein fibrillation contribute to corpora amylacea in the bovine mammary gland, for example when
    the alpha-s1:alpha-s2 ratio is altered by low-expression CSN1S1 alleles?
- question: 'GO:0140314 calcium ion sequestering activity only approximates the casein function: caseins sequester calcium
    phosphate nanoclusters, not free calcium ions alone. Would a dedicated calcium phosphate (nanocluster) sequestering activity
    term better describe SCPP phosphoproteins such as caseins and osteopontin?'
suggested_experiments:
- hypothesis: Alpha-s2-casein contributes disproportionately to micellar calcium phosphate because of its three phosphate
    centres.
  description: Compare micellar calcium and phosphate content and micelle size in milk from cattle (or goats) carrying CSN1S2
    null or low-expression alleles versus controls.
  experiment_type: genetic association
- hypothesis: Dimeric alpha-s2-casein accelerates tPA-catalysed plasminogen activation.
  description: Measure tPA kinetics of plasminogen activation in the presence of purified monomeric (reduced) versus disulfide-dimeric
    bovine alpha-s2-casein.
  experiment_type: enzyme kinetics
