id: E1BL04
gene_symbol: E1BL04
taxon:
  id: NCBITaxon:9913
  label: Bos taurus
status: COMPLETE
description: >-
  E1BL04 is bovine XIRP2, a Xin-repeat protein of the XIRP2 subfamily (PANTHER PTHR22591:SF1) that binds
  and organizes actin filaments and localizes to striated-muscle junctions. All three ProtNLM2 predictions
  (actin cytoskeleton organization, cell junction, actin binding) are biologically correct, and each is
  already carried by the gene in GOA by automated InterPro-based annotation, so none is novel. The gene review
  refines each to a more specific descendant the gene also carries.
source_documents:
  - genes/BOVIN/E1BL04/E1BL04-uniprot.txt
  - genes/BOVIN/E1BL04/E1BL04-goa.tsv
  - publications/PMID_15454575.md
  - publications/PMID_20360251.md
  - genes/BOVIN/E1BL04/E1BL04-ai-review.yaml
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0030036
      label: actin cytoskeleton organization
    predicted_term_type: GO_BP
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        The target carries the Xin actin-binding repeat (IPR012510) and the XIRP2 subfamily assignment
        (PTHR22591:SF1). Xin repeats, including those of human XIRP2, bind actin filaments directly and
        arrange them into networks (PMID:15454575), which supports actin cytoskeleton organization by
        phylogenetic transfer. The exact term is already in GOA for this gene (InterPro2GO), and the gene
        review refines it to actin filament organization (GO:0007015), which the gene also carries by IBA.
        The prediction is correct but not novel.
      supported_by:
        - reference_id: file:BOVIN/E1BL04/E1BL04-uniprot.txt
          supporting_text: Xin repeats bind F-actin
        - reference_id: PMID:15454575
          supporting_text: they not only directly bind actin filaments, but also have the capability of arranging microfilaments into networks
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0030054
      label: cell junction
    predicted_term_type: GO_CC
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Mouse Xirp2 (mXinbeta) localizes to the intercalated disc of the heart (PMID:20360251), a cell-cell
        junction, and the bovine target is its XIRP2-subfamily ortholog. Cell junction is therefore correct
        by orthology. The exact term is already in GOA for this gene (InterPro2GO), and the gene review
        refines it to cell-cell junction (GO:0005911), which the gene also carries by Ensembl Compara
        transfer. The prediction is correct but not novel.
      supported_by:
        - reference_id: file:BOVIN/E1BL04/E1BL04-uniprot.txt
          supporting_text: Xin repeats bind F-actin
        - reference_id: PMID:20360251
          supporting_text: The Xin repeat-containing proteins mXinalpha and mXinbeta localize to the intercalated disc of mouse heart
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0003779
      label: actin binding
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Xin repeats are experimentally established actin-binding modules, and human XIRP2 repeats share this
        activity (PMID:15454575). The bovine target contains these repeats (PROSITE PRU00721). Actin binding
        is already in GOA for this gene (combined automated annotation, GO_REF:0000120), and the gene review refines it to actin
        filament binding (GO:0051015), which the gene also carries by IBA. The prediction is correct but
        not novel.
      supported_by:
        - reference_id: file:BOVIN/E1BL04/E1BL04-uniprot.txt
          supporting_text: Xin repeats bind F-actin
        - reference_id: PMID:15454575
          supporting_text: they not only directly bind actin filaments
        - reference_id: PMID:15454575
          supporting_text: Human XIRP2 contains 28 Xin repeats with properties identical to those of Xin
