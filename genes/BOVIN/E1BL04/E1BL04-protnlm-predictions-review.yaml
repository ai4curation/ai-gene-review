  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0003779
      label: actin binding
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Xin repeats are experimentally established actin-binding modules, and human XIRP2 repeats share
        this activity (PMID:15454575). The bovine target contains these repeats and has a curated IBA
        for actin filament binding. Actin binding is a broader molecular function than that existing annotation.
        It is biologically correct but adds no specificity.
      supported_by:
