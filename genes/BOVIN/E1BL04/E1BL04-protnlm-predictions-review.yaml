  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0030036
      label: actin cytoskeleton organization
    predicted_term_type: GO_BP
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        The target has Xin actin-binding repeats and an XIRP2 subfamily assignment. Experiments on Xin
        repeats, including human XIRP2 repeats, demonstrate actin binding and stabilization of the actin
        cytoskeleton (PMID:15454575), supporting transfer of the broad process to bovine XIRP2. The cached
        IBA annotation actin filament organization is more specific than actin cytoskeleton organization.
        The prediction is therefore supported but less precise.
      supported_by:
