    predicted_term:
      id: GO:0030054
      label: cell junction
    predicted_term_type: GO_CC
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        The target is a Xin-repeat protein in the XIRP2 subfamily. Xin-family localization at muscle attachment
        sites and the repeat-mediated actin interactions provide a biological basis for junction association
        (PMID:15454575), consistent with the target focal-adhesion IBA. The cached annotations include
        focal adhesion and cell-cell junction, which specify junction types beyond the predicted cell
        junction. The broad prediction is supported but less precise.
