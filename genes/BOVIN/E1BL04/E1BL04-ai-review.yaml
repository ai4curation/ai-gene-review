suggested_questions:
- question: >-
    Do the short bovine XIRP2 gene models (A0AAA9SWG7, A0AAA9SUE1) encode the LIM/CTD-containing
    stereocilia isoform? If so, should the stereocilia-repair and gamma-actin recruitment annotations be
    attached to them rather than to E1BL04?
- question: >-
    Which region of XIRP2 binds alpha-actinin-2, and is it conserved in the bovine long product?
- question: >-
    Does bovine XIRP2 localize to the intercalated disc and Z disc of cattle cardiomyocytes, as the
    mouse ortholog does?
suggested_experiments:
- hypothesis: >-
