    label: stress fiber
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: colocalizes_with
  review:
    summary: >-
      PAINT node PTN000502290 (family-level Xin node spanning XIRP1 SF2 and XIRP2 SF1) seeded by human
      XIRP2 (A4UGR9) and human XIRP1 (Q702N8). Human XIRP2 Xin repeats expressed in cultured non-muscle
      cells decorate and stabilize stress fibers. E1BL04 lies inside the clade and retains the
      Xin-repeat array.
    action: KEEP_AS_NON_CORE
    reason: >-
      The colocalization is real but comes from overexpression in non-muscle cells; stress fibers are
      not the physiological site of this striated-muscle protein. The force-dependent recruitment of
      XIRP2 to stress-fiber strain sites (PMID:37294664) maps to the C-terminal LIM/CTD region, which
      E1BL04 lacks, so it does not add support for this accession.
    supported_by:
