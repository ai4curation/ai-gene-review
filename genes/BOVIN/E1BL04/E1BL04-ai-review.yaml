id: E1BL04
gene_symbol: E1BL04
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9913
  label: Bos taurus
description: >-
  E1BL04 is the bovine XIRP2 gene product (Xin actin-binding repeat-containing protein 2, also called
  CMYA3, myomaxin or mXinbeta in mouse), a 3561-residue member of the Xin family (PANTHER PTHR22591,
  XIRP2 subfamily SF1). Its central region carries an array of 16-residue Xin repeats (26 PROSITE Xin
  repeats), a motif that binds actin filaments directly, stabilizes them and can cross-link them into
  networks; the rest of the protein is largely disordered. The protein has no LIM domain, so it
  corresponds to the long Xin-repeat class of XIRP2 products rather than to the LIM-containing isoforms.
  By orthology with mouse and human XIRP2, it is a striated-muscle protein of the Z disc/costamere region
  and of the cardiac intercalated disc, where it binds alpha-actinin-2 and anchors and stabilizes actin
  filaments. Mouse Xirp2 is required for intercalated disc maturation and for postnatal heart growth. In
  inner-ear hair cells, long XIRP2 isoforms sit in stereocilia and the cuticular plate and keep the
  paracrystalline actin arrays organized. No experimental work has been done on the bovine protein itself.
