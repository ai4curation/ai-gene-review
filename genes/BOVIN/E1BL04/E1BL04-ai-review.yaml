- term:
    id: GO:0110053
    label: regulation of actin filament organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Ensembl Compara transfer from mouse Xirp2 (Q4U4S6; IMP, PMID:25772365). In Xirp2-null hair cells,
      stereocilia degenerate and their paracrystalline actin arrays become disorganized.
    action: KEEP_AS_NON_CORE
    reason: >-
      The phenotype is a requirement for the organization of actin arrays. Mechanistically it is better
      described by the direct process GO:0007015 actin filament organization (accepted), in which the
      Xin repeats bind and stabilize the filaments. The regulatory framing is defensible because the
      protein protects filaments, but it is peripheral to the direct activity and rests on a knockout
      phenotype in a hair-cell context.
