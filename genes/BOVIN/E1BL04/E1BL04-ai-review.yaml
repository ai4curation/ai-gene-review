references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: >-
      InterPro identifies the Xin repeat domain (IPR012510) and the XIRP1/XIRP2 family (IPR030072),
      giving actin binding, actin cytoskeleton organization and cell junction mappings; all are correct
      but general.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT node PTN000502290 is a family-level Xin node seeded by human XIRP2 (A4UGR9) and human XIRP1
      (Q702N8). The actin filament organization IBD is seeded by XIRP1 alone. (The earlier version of
      this review mislabelled Q702N8 as mouse Xirp2; it is human XIRP1, PANTHER SF2.)
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: >-
      The mapping of SL-0038 Cell junction gives anchoring junction. The bovine subcellular location
      statement is ARBA-derived.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs
    using Ensembl Compara
  findings:
  - statement: >-
      These transfers are from human XIRP2 (A4UGR9) and mouse Xirp2 (Q4U4S6). They are the most
      informative annotations for this entry, but one, positive regulation of protein localization,
      derives from an isoform-specific (LIM/CTD) activity that E1BL04 lacks.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      The combined IEA methods assign the general term actin binding, which is better refined to actin
      filament binding.
- id: file:BOVIN/E1BL04/E1BL04-uniprot.txt
  title: UniProt entry E1BL04
  findings:
  - statement: >-
      This is an unreviewed (PE 3) 3561-aa XIRP2 entry with 26 PROSITE Xin repeats and 18 Pfam Xin
      domains. It is placed in PANTHER PTHR22591:SF1 (XIRP2) and has no LIM domain.
- id: file:BOVIN/E1BL04/E1BL04-bioinformatics/RESULTS.md
  title: E1BL04 comparison with characterized Xin-family proteins
  findings:
  - statement: >-
      E1BL04 aligns over 99% of human XIRP2 at 80.5% identity, against 36-38% identity to XIRP1. It
      lacks the LIM/CTD region of mouse Xirp2 isoform 1 and the short isoform.
- id: PMID:15454575
  title: Xin repeats define a novel actin-binding motif.
  findings:
  - statement: Xin repeats bind actin filaments directly, stabilize them and arrange them into networks.
      Human XIRP2 repeats share these properties.
    supporting_text: they not only directly bind actin filaments, but also have the capability of arranging
      microfilaments into networks
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. The paper defines the Xin repeat as an actin-binding motif, and
      its abstract states that the XIRP2 repeats behave like those of Xin. It is the source of the human
      XIRP2 IMP rows.
- id: PMID:17046827
  title: Myomaxin is a novel transcriptional target of MEF2A that encodes a Xin-related alpha-actinin-interacting
    protein.
  findings:
  - statement: Mouse Xirp2 (myomaxin) localizes to the Z-disc/costamere and interacts with alpha-actinin-2.
    supporting_text: interacts with the sarcomeric Z-disc protein, alpha-actinin-2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Source of the mouse IDA rows for Z disc and alpha-actinin binding.
- id: PMID:20360251
  title: Essential roles of an intercalated disc protein, mXinbeta, in postnatal heart growth and survival.
  findings:
  - statement: Mouse Xirp2 localizes to the intercalated disc and is required for intercalated disc
      maturation and for the localization of Xirp1 and N-cadherin there.
    supporting_text: Loss of mXinbeta resulted in the failure of forming mature intercalated discs and
      the mislocalization of mXinalpha and N-cadherin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. This is knockout and necessity evidence. It is used for location
      (intercalated disc) and not to propose new process terms.
- id: PMID:25772365
  title: XIRP2, an actin-binding protein essential for inner ear hair-cell stereocilia.
  findings:
  - statement: Long XIRP2 isoforms with Xin repeats occur in stereocilia and cuticular plates. Loss of
      Xirp2 disorganizes the paracrystalline actin of stereocilia.
    supporting_text: XIRP2 is notable for its 28 Xin repeats, which bind and stabilize actin bundles
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Source of the mouse IMP for regulation of actin filament organization.
- id: PMID:37294664
  title: Repair of noise-induced damage to stereocilia F-actin cores is facilitated by XIRP2 and its novel
