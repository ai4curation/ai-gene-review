- term:
    id: GO:1903829
    label: positive regulation of protein localization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Ensembl Compara transfer from mouse Xirp2 (Q4U4S6; IMP, PMID:37294664). The underlying finding is
      that XIRP2 is required to enrich monomeric gamma-actin at noise-induced stereocilia gaps. This
      activity maps to the short stereocilia isoform and to its C-terminal LIM domain and CTD, and the CTD
      alone pulls down monomeric gamma-actin.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      E1BL04 lacks the LIM domain and C-terminal domain that carry this activity (RESULTS.md: no LIM
      match, and the mouse isoform-1 C-terminal region is not covered). The annotated sequence therefore
      lacks the region responsible, a domain-architecture mismatch. The term is also vague, since it
      does not name the protein whose localization is affected. Other bovine XIRP2 gene models
      (A0AAA9SWG7, A0AAA9SUE1) may represent short isoforms to which this would apply better.
    supported_by:
    - reference_id: PMID:37294664
      supporting_text: Because the short isoform of XIRP2 contains a LIM domain, we hypothesized that it was
        recognizing strained actin in the stereocilia and facilitating repair.
    - reference_id: PMID:37294664
      supporting_text: The C-terminal domain (CTD) of XIRP2 is sufficient to pull down monomeric γ-actin.
    - reference_id: file:BOVIN/E1BL04/E1BL04-bioinformatics/RESULTS.md
      supporting_text: E1BL04 lacks the C-terminal LIM domain / C-terminal domain (CTD)
