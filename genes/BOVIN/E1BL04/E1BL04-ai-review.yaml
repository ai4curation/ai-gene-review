- term:
    id: GO:0007015
    label: actin filament organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      PAINT placed this process at the family-level node PTN000502290 with human XIRP1 (Q702N8, SF2) as the
      only seed, so for XIRP2 it is an ancestral-node inference rather than a direct XIRP2 transfer. It
      is nonetheless independently supported for XIRP2. Xin repeats bind actin filaments directly and
      arrange them into networks. Human XIRP2 repeats have the same properties. Loss of mouse Xirp2
      disorganizes the paracrystalline actin arrays of hair-cell stereocilia.
    action: ACCEPT
    reason: >-
      The product does part of the work: its Xin-repeat array binds, stabilizes and cross-links actin
      filaments. E1BL04 keeps the full repeat array (RESULTS.md), and the family-level PAINT node is
      consistent with a conserved repeat-mediated mechanism.
    supported_by:
    - reference_id: PMID:15454575
      supporting_text: they not only directly bind actin filaments, but also have the capability of arranging
        microfilaments into networks
    - reference_id: PMID:25772365
      supporting_text: At an ultrastructural level, the paracrystalline actin filaments became disorganized.
    - reference_id: file:BOVIN/E1BL04/E1BL04-bioinformatics/RESULTS.md
      supporting_text: E1BL04 is a full-length XIRP2 long (Xin-repeat) product
