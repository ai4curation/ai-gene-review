id: E1BL04
gene_symbol: XIRP2
taxon:
  id: NCBITaxon:9913
  label: Bos taurus
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for bovine XIRP2, a 3561-aa Xin-family F-actin
  binding protein of striated muscle. ProTrek's free-text Function channel places the
  protein correctly in the actin/myofibril world ("anchoring the terminal actin filaments
  in the myofibril to the membrane", "organizes filamentous actin into bundles"), but its
  GO channel converts that neighbourhood into a series of specific cytoskeletal
  compartments the protein does not occupy: radial spoke (an axonemal structure),
  cytoskeletal calyx (a sperm perinuclear theca structure), and myosin filament. Only
  rank 4 (contractile actin filament bundle assembly) is defensible. The pattern is the
  general one for this benchmark: correct neighbourhood, over-specific and
  wrongly-located GO terms. ProtNLM2 on the same protein returned three broad terms
  (actin binding, actin cytoskeleton organization, cell junction), all already in GOA -
  less informative but not wrong.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 0 less precise (LSP),
  0 uncertain (UNC), 3 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/BOVIN/E1BL04/E1BL04-uniprot.txt
