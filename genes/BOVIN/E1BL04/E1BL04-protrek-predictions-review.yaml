predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0001534
      label: radial spoke
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: LOCALIZATION_DEFAULT
      summary: >-
        Top-ranked hit (score 12.99). The radial spoke is a component of the ciliary and
        flagellar axoneme; XIRP2 is a sarcomeric Z-disc and intercalated-disc protein with
        no axonemal localisation reported in any Xin family member. The retrieval appears to
        be matching the long repetitive coiled-coil-rich character of the sequence to other
        large filamentous-structure proteins rather than to the Xin repeats themselves.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0033150
      label: cytoskeletal calyx
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: LOCALIZATION_DEFAULT
      summary: >-
        Rank 2 (score 12.41). The cytoskeletal calyx is the sperm perinuclear theca
        substructure. XIRP2 is expressed in cardiac and skeletal muscle, not in the sperm
        head; the existing GOA localisations (Z disc, cell-cell junction, focal adhesion,
        stress fiber) are all incompatible with this call. Another instance of the model
        picking a rare, highly specific cytoskeletal compartment from a general
        cytoskeletal signal.
      supported_by:
        - reference_id: GO_REF:0000107
          supporting_text: Automatic transfer of annotations with same species
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0097493
      label: structural molecule activity conferring elasticity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 (score 12.18). This term describes the elastic-spring function of titin and
        elastin-like proteins. XIRP2 is an F-actin-binding scaffold acting through its 26
        Xin repeats; nothing in this review or in the Xin literature supports an elastic
        structural role, and the family's characterised activity is actin filament binding
        and protection from depolymerisation. The call is a plausible-sounding sarcomeric
        neighbour rather than the correct function - the discrimination failure is between
        Z-disc proteins, not between unrelated proteins.
      supported_by:
        - reference_id: file:BOVIN/E1BL04/E1BL04-uniprot.txt
          supporting_text: Belongs to the Xin family
