- term:
    id: GO:0140777
    label: protein-containing complex stabilizing activity
  evidence_type: TAS
  original_reference_id: PMID:21245413
  review:
    summary: Kappa-casein stabilizes casein micelles, preventing precipitation of calcium-sensitive caseins.
    action: NEW
    reason: Kappa-casein does not sequester calcium phosphate itself; instead it binds the calcium-sensitive
      caseins at the micelle surface and keeps the micelle colloidally stable, a molecular activity of
      the gene product on which lactation depends (Csn3-null micelles destabilize). Protein-containing
      complex stabilizing activity is the closest available MF; the hydrophilic, glycosylated C-terminal
      region (removed by chymosin at the Phe105-Met106 bond, which triggers curdling) provides the steric
      stabilization.
    supported_by:
    - *id005
    - *id003
    - *id004
