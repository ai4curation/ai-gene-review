id: P02668
gene_symbol: CSN3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9913
  label: Bos taurus
description: 'Kappa-casein is the calcium-insensitive casein of bovine milk, a secreted phosphoglycoprotein
  made by mammary secretory epithelium and a member of the secretory calcium-binding phosphoprotein (SCPP)
  family. It forms disulfide-linked multimers and resides mainly at the surface of casein micelles, where
  its hydrophilic, O-glycosylated and phosphorylated C-terminal region stabilizes the micelle and prevents
  calcium-induced precipitation of the calcium-sensitive alpha-s1-, alpha-s2- and beta-caseins. Kappa-casein
  is essential for lactation: mice lacking it fail to lactate because micelles destabilize in the mammary
  lumen. Cleavage of the Phe105-Met106 bond by chymosin (rennet) releases the C-terminal caseinomacropeptide
  and leaves para-kappa-casein, collapsing steric stabilization and causing curd formation. Kappa-casein
  in micelles binds tissue-type plasminogen activator, and proteolytic fragments (casoxins, casoplatelin,
  glycomacropeptide) have reported bioactivities that belong to cleavage products rather than to the intact
  protein.'
