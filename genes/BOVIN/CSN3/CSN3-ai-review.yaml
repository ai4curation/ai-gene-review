- term:
    id: GO:0035375
    label: zymogen binding
  evidence_type: IPI
  original_reference_id: PMID:8186264
  qualifier: enables
  supporting_entities:
  - UniProtKB:P00750
  review:
    summary: Ligand blotting and casein-Sepharose showed multimeric kappa-casein binds tissue-type plasminogen
      activator (human t-PA).
    action: KEEP_AS_NON_CORE
    reason: The binding is experimentally supported and explains t-PA partitioning into the micelle fraction
      of milk, where the micelle may act as a matrix for plasminogen activation. Single-chain t-PA is
      a proenzyme with intrinsic activity, so "zymogen binding" is acceptable. This is a peripheral property
      of micelle-associated kappa-casein that bears on milk proteolysis, not its core micelle-stabilizing
      role.
    supported_by:
    - reference_id: PMID:8186264
      supporting_text: Investigating the novel t-PA binding to casein micelles by ligand blotting and
        Sepharose immobilized casein, multimeric forms of kappa-casein and dimeric alpha s2-casein were
        identified as t-PA binding components.
