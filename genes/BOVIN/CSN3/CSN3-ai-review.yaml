suggested_questions:
- question: Is there a better GO molecular function for the steric (hairy-layer) colloidal stabilization
    of casein micelles by kappa-casein than protein-containing complex stabilizing activity, or should
    a casein micelle cellular component and a micelle-stabilizing activity be requested?
- question: Does t-PA binding by kappa-casein multimers measurably control plasmin generation and casein
    proteolysis in milk in vivo?
suggested_experiments:
- hypothesis: The glycosylated C-terminal caseinomacropeptide region of kappa-casein is sufficient for
    micelle stabilization in vivo.
  description: Knock-in mice expressing kappa-casein lacking the C-terminal macropeptide, or carrying
    glycosylation-site mutations, compared with Csn3-null and wild-type mice for micelle size, stability
    and lactation success.
  experiment_type: genetic interaction
