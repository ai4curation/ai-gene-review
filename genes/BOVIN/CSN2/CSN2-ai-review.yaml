    supporting_text: We show that CAS partially folds and stiffens upon calcium binding
  - *id006
suggested_questions:
- question: Does beta-casein exert any in vivo protease-inhibitory role in milk, given that it is itself
    readily cleaved by plasmin and other milk proteases?
- question: Is beta-CN(1-28) a physiologically important feedback regulator of milk secretion in cows,
    and which apical potassium channel does it block?
suggested_experiments:
- hypothesis: The beta-CN(1-28) fragment regulates milk secretion through a specific apical potassium
    channel of mammary epithelium.
  description: Identify the channel by electrophysiology of polarized bovine mammary epithelial cells
    exposed to synthetic beta-CN(1-28) and scrambled control peptides, combined with channel knockdown,
    and test milk yield after intraluminal infusion in a controlled design.
  experiment_type: electrophysiology
