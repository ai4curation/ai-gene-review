  review:
    summary: Beta-casein is a major structural/nutritive milk protein; PAINT places lactation at the beta-casein
      family node.
    action: ACCEPT
    reason: Beta-casein is a principal milk constituent that, with the other calcium-sensitive caseins,
      packages amino acids and calcium phosphate into micelles for the neonate. Mouse Csn2 knockout milk
      has reduced protein content and smaller micelles and supports less pup growth, so beta-casein contributes
      to (though is not essential for) lactation output.
    supported_by:
