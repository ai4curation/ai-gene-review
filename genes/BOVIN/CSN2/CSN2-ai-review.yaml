- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:8186264
  qualifier: enables
  review:
    summary: Cited paper (casein-t-PA binding in milk) reports dimeric alpha-s2-casein and multimeric
      kappa-casein in its abstract; the basis for a beta-casein homodimer is not visible.
    action: MODIFY
    reason: Beta-casein self-associates, through its hydrophobic proline-rich C-terminal region, into
      small core-shell micelles of many identical monomers, in a temperature-dependent way; this self-association
      is directly demonstrated for purified bovine beta-casein (PMID:25754442). A defined homodimer is
      not the relevant oligomeric state, and the cached abstract of PMID:8186264 describes dimers only
      for alpha-s2-casein and multimers for kappa-casein, so the homodimerization claim itself cannot
      be verified. The essence of the annotation (beta-casein binds other beta-casein molecules) is sound,
      so it is generalized to the parent term identical protein binding (GO:0042802) rather than left
      undecided. Protein homooligomerization (GO:0051260) was considered but is a biological process term,
      and this row is a molecular function. Kept peripheral to the core calcium sequestering function.
    proposed_replacement_terms:
    - id: GO:0042802
      label: identical protein binding
    supported_by:
    - reference_id: PMID:25754442
      supporting_text: β-Casein is a 24 kDa amphiphilic and unstructured protein that self-assembles into
        small core-shell micelles at a wide range of concentrations, pH values and temperatures.
    - reference_id: PMID:8186264
      supporting_text: multimeric forms of kappa-casein and dimeric alpha s2-casein were identified as
        t-PA binding components.
