    label: cysteine-type endopeptidase inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000161175
  - UniProtKB:P02666
  - UniProtKB:P05814
  review:
    summary: Phylogenetic propagation of cysteine-type endopeptidase inhibitor activity across beta-caseins
      (PTN000161175), seeded by in vitro observations on bovine/human beta-casein.
    action: MARK_AS_OVER_ANNOTATED
    reason: Ohashi et al. detected inhibition of cysteine proteases by beta-casein and by a synthetic
      L133-Q151 peptide in vitro (reverse zymography). No physiological target, stoichiometry or in vivo
      inhibition was shown, and beta-casein is itself a classic, readily cleaved protease substrate. The
      proposed antiseptic role is speculative. The activity is therefore an over-annotation of the gene
      product; the IBA propagates this single in vitro observation (bovine and human beta-casein are the
      experimental donors), so it is graded consistently with the IDA rather than removed.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
