  review:
    summary: Neutron and light scattering show beta-casein binds calcium, partially folding and stiffening
      on binding.
    action: ACCEPT
    reason: Calcium binding by the N-terminal phosphoserine cluster is the basis of beta-casein behaviour
      in milk (calcium-sensitive casein). This row is as specific as the cited biophysical evidence; the
      physiological role (sequestration of calcium phosphate nanoclusters) is captured by a NEW calcium
      ion sequestering activity row.
    supported_by:
    - reference_id: PMID:24918971
      supporting_text: We show that CAS partially folds and stiffens upon calcium binding
    - reference_id: PMID:21245413
      supporting_text: Ca-sensitive caseins (α(s)- and β-caseins) bind Ca but precipitate at high Ca concentrations
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10971580
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43464
  review:
    summary: Interaction with human HTRA2 protease in which beta-casein serves as substrate.
    action: REMOVE
    reason: Beta-casein is a natively unfolded protein that is used throughout biochemistry as a generic
      model substrate for proteases, chaperones and kinases. Here the interactor (human HTRA2 protease)
      is assayed with beta-casein as its substrate; the interaction reports a property of the enzyme,
      not a molecular function executed by beta-casein in milk. Bare protein binding is uninformative
      and is removed under the protein-binding policy; the interaction itself is not disputed. Phosphorylation
      by FAM20C is physiologically relevant (it creates the phosphoserine clusters), but it is an activity
      of FAM20C, not of beta-casein.
