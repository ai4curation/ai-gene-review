core_functions:
- description: Phosphorylated beta-casein binds calcium through its phosphoserine cluster and sequesters
    amorphous calcium phosphate nanoclusters, assembling with the other calcium-sensitive caseins into
    casein micelles that deliver amino acids and calcium phosphate in milk.
  molecular_function:
