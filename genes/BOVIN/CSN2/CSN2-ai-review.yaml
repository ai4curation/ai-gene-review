id: P02666
gene_symbol: CSN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9913
  label: Bos taurus
description: Beta-casein is the most abundant calcium-sensitive casein of bovine milk, a secreted, intrinsically
  disordered phosphoprotein made by mammary secretory epithelium during lactation. It belongs to the secretory
  calcium-binding phosphoprotein (SCPP) family that also includes enamel and bone matrix proteins. After
  phosphorylation in the Golgi by the casein kinase FAM20C, its N-terminal phosphoserine cluster binds
  calcium and sequesters amorphous calcium phosphate nanoclusters, and together with alpha-s1- and alpha-s2-casein
  it forms the core of casein micelles, which are surface-stabilised by kappa-casein. Micelles carry amino
  acids and calcium phosphate to the neonate in a stable fluid supersaturated with calcium phosphate and
  suppress amyloid formation by caseins. Beta-casein is not essential for micelle assembly or lactation
  in mice but contributes to milk protein content and pup growth. Proteolysis in milk (plasmin) and in
  the gut releases peptides with reported bioactivities (e.g. beta-CN(1-28) potassium channel blockade,
  casomorphins), which are activities of cleavage products rather than of the intact protein.
