        source_label: PTN000161175
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Beta-casein node; the descendant evidence is in vitro reverse-zymography inhibition by
          bovine and human beta-casein, with no demonstrated physiological inhibition, so the inherited
          claim is no stronger than that in vitro observation.
