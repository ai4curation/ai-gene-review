- term:
    id: GO:0140314
    label: calcium ion sequestering activity
  evidence_type: TAS
  original_reference_id: PMID:25632319
  review:
    summary: Calcium-sensitive caseins sequester amorphous calcium phosphate nanoclusters through their
      phosphoserine clusters, keeping milk stable while supersaturated with calcium phosphate.
    action: NEW
    reason: 'Beta-casein carries the canonical phosphoserine cluster (pSer30/32/33/34) that binds and
      sequesters calcium phosphate nanoclusters, the defining physiological activity of the calcium-sensitive
      caseins and of SCPP proteins generally. GO has no calcium phosphate sequestering term; calcium ion
      sequestering activity is the closest existing term (the same choice is used for human alpha-s1-casein
      in this repository). The gene product itself does the work: it binds and stabilises the mineral.'
    supported_by:
    - *id005
    - reference_id: PMID:12646701
      supporting_text: Casein makes milk supersaturated with Ca-phosphate, which was critical to the successive
        mammalian divergence.
    - reference_id: PMID:23958008
      supporting_text: A typical casein micelle contains thousands of casein molecules, most of which
        form thermodynamically stable complexes with nanoclusters of amorphous calcium phosphate.
    - reference_id: PMID:23958008
      supporting_text: As a result of forming micelles, nutritious milk can be secreted and stored without
        causing either pathological calcification or amyloidosis of the mother's mammary tissue.
    - reference_id: file:BOVIN/CSN2/CSN2-deep-research-openscientist.md
      supporting_text: Its "substrate," in a loose analogy, is **amorphous calcium phosphate**, which
        it binds via its phosphoserine cluster and carries within the micelle.
