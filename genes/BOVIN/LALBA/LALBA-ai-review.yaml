- term:
    id: GO:0003796
    label: lysozyme activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0004427
  - MGI:MGI:96897
  - PANTHER:PTN004256961
  - RGD:3026
  - UniProtKB:P00698
  review:
    summary: Phylogenetic (IBA) transfer of lysozyme (peptidoglycan muramidase) activity from the c-type
      lysozyme clade of PTHR11407 to alpha-lactalbumin.
    action: REMOVE
    reason: 'Alpha-lactalbumin arose by duplication of the lysozyme C gene and is the classic case of
      neofunctionalisation with loss of the ancestral catalytic activity: specific substitutions abolished
      glycosidase activity, and the protein does not bind the oligosaccharide substrates that lysozyme
      cleaves. The only reports of lytic activity are trace activities of roughly 10^-5 of lysozyme in
      turbidimetric and viability assays (PMID:3579965, PMID:8368501), which is not a physiologically
      meaningful muramidase activity. The PAINT node that carries lysozyme activity therefore should not
      propagate into the alpha-lactalbumin subfamily (PTHR11407:SF32); this is a lineage-specific loss
      of function inside the family. The same call is made for the human, mouse, rat and bovine orthologs.'
    additional_reference_ids:
    - PMID:3579965
    supported_by:
    - reference_id: PMID:9307874
      supporting_text: Specific amino acid substitutions in alpha-lactalbumin account for the loss of
        the enzyme activity of lysozyme and the acquisition of the features necessary for its role in
        lactose synthesis.
    - &id007
      reference_id: PMID:21676251
      supporting_text: Lactalbumin is related to lysozyme, with around 40% amino acid identity and nearly
        identical three-dimensional structure, but lacks its bacteriolytic activity
    - reference_id: PMID:10195284
      supporting_text: Lysozymes bind and cleave the glycosidic bond linkage in sugars, where as, alpha-lactalbumin
