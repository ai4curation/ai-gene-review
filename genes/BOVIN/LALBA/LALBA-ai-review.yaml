    action: KEEP_AS_NON_CORE
    reason: 'Alpha-lactalbumin is a signal-peptide-bearing secretory protein released into milk, where
      it is one of the most abundant whey proteins, so extracellular localisation is correct and already
      as specific as GO permits (extracellular space is obsolete and merged into extracellular region).
      It is, however, not the site of its core activity: alpha-lactalbumin acts with B4GALT1 in the Golgi
