- term: &id014
    id: GO:0005796
    label: Golgi lumen
  evidence_type: TAS
  original_reference_id: PMID:34125364
  qualifier: located_in
  review:
    summary: Golgi lumen as the site where alpha-lactalbumin acts with B4GALT1.
    action: NEW
    reason: Alpha-lactalbumin is a soluble secretory protein that forms lactose synthase with the luminal
      catalytic domain of B4GALT1 in the (trans-)Golgi of lactating mammary epithelial cells, where lactose
      is made before both are secreted. Human LALBA already carries Golgi lumen (Reactome); this location
      is conserved and is the site of the core activity, so it is proposed here for consistency across
      orthologs. This is a conserved-cell-biology inference from human and murine references (the comparative
      review PMID:34125364, human Reactome, and murine mammary epithelial cells in PMID:31020623), not
      a bovine-specific localisation experiment.
    supported_by:
    - *id003
    - reference_id: PMID:34125364
      supporting_text: Importantly, LS is a unique enzyme complex comprised of β-1,4-galactosyltransferase-1
        (B4GALT1) and the mammary-specific modifier protein α-lactalbumin (LALBA), and requires close
        association with the uridine nucleotide cycle on the trans-Golgi
    - reference_id: PMID:31020623
      supporting_text: Lactose, the principal carbohydrate of the milk, is synthetized in the Golgi of
        mammary epithelial cells by lactose synthase from glucose and UPD galactose.
- term: *id010
  evidence_type: IDA
  original_reference_id: PMID:3922406
  qualifier: enables
  review:
    summary: Bovine alpha-lactalbumin is the classical specifier of lactose synthase.
    action: NEW
    reason: 'Bovine alpha-lactalbumin is the protein in which the specifier mechanism was established
      kinetically: it binds galactosyltransferase next to the monosaccharide acceptor site, competes with
      GlcNAc-type acceptors and raises the affinity for glucose. Human and rodent orthologs carry enzyme-substrate
      adaptor activity (GO:0140767); the bovine record lacks it and carries only the incorrect enables
      lactose synthase activity IEA. Proposed for consistency with the other orthologs.'
    supported_by:
    - &id013
      reference_id: PMID:3922406
      supporting_text: alpha-lactalbumin must bind to a region on galactosyltransferase in close proximity
        to the monosaccharide binding site and exert its substrate-specifying action through competitive
        and mutually exclusive binding with the N-acetylglucosamine analogues accompanied by an increased
        affinity for glucose
    - *id011
    - reference_id: file:BOVIN/LALBA/LALBA-uniprot.txt
      supporting_text: Regulatory subunit of lactose synthase, changes the substrate specificity of galactosyltransferase
        in the mammary gland making glucose a good acceptor substrate for this enzyme.
- term: &id015
    id: GO:1990234
    label: transferase complex
  evidence_type: IDA
  original_reference_id: PMID:3922406
  qualifier: part_of
  review:
    summary: Bovine alpha-lactalbumin is the regulatory subunit of the lactose synthase heterodimer.
    action: NEW
    reason: Lactose synthase is a 1:1 heterodimer of B4GALT1 and alpha-lactalbumin; GO has no lactose
      synthase complex term, so transferase complex (GO:1990234) is used, as proposed for the human, mouse
      and rat orthologs. The human B4GALT1 review uses catalytic complex (GO:1902494) for the same complex;
      transferase complex is a more specific descendant of it. A lactose synthase complex term is proposed
      in proposed_new_terms.
    supported_by:
