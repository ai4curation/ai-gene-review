      bioactive peptides rather than as an active lactose synthase subunit. Kept as non-core localisation;
      same call for every extracellular region row in all four orthologs. The is_active_in relation is
      inherited from secreted lysozymes; for alpha-lactalbumin the active location is the Golgi lumen,
      but the extracellular presence is real.'
