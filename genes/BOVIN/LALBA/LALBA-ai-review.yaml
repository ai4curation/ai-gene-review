- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000545
  review:
    summary: InterPro2GO assignment of calcium ion binding from the Lactalbumin signature.
    action: ACCEPT
    reason: All alpha-lactalbumins bind one Ca2+ ion tightly in a distinctive loop (bovine numbering Lys79/Asp82/Asp84/Asp87/Asp88)
      that is homologous to the corresponding lysozyme loop rather than an EF-hand. Calcium binding is
      well characterised structurally (the 1.7 A baboon/human structure; bovine PDB 1HFZ with Ca2+ binding
      residues annotated experimentally in UniProt) and stabilises the native fold; loss of strong Ca2+
      binding (CNBr-cleaved loop) reduces lactose synthase specifier activity about 40-fold, and Ca2+
      removal yields the molten globule. The term is as specific as GO allows for this structural site.
      Accept; same call for all four orthologs.
    supported_by:
    - &id018
      reference_id: PMID:8765309
      supporting_text: all alpha-lactalbumins strongly bind Ca(II), but only some c-type lysozymes do
        so.
    - reference_id: PMID:3785375
      supporting_text: The high-resolution X-ray structure of alpha-lactalbumin reveals a Ca2+ binding
        fold that resembles an EF-hand only superficially and presumably has no evolutionary relationship
        with it.
    - &id019
      reference_id: PMID:1918521
      supporting_text: The strong calcium-binding site of alpha-lactalbumin comprises the carboxylate
        side chains of aspartic acid 82, 87, and 88 and the carbonyl oxygens of residues 79 and 84.
    - &id011
      reference_id: PMID:1918521
      supporting_text: Remarkably, the modified protein was still competent in lactose biosynthesis, although
        activity was reduced to 1/40th that of the native form of the protein.
    - reference_id: PMID:34125364
      supporting_text: The least flexible region of LALBA is the Ca-binding loop and a hydrophobic region,
        where residues Lys-79, Asp-82, Asp-84, Asp-87, and Asp-88, along with two molecules of water,
        support Ca binding
