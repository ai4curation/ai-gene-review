- term:
    id: GO:0005989
    label: lactose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000545
  review:
    summary: Electronic assignment of lactose biosynthetic process from the Lactalbumin signature.
    action: ACCEPT
    reason: 'Alpha-lactalbumin performs part of the work of the final step of lactose biosynthesis: it
      is the subunit of lactose synthase that binds and positions glucose in the B4GALT1 acceptor site
      (the cofactor case for participation, not merely a requirement). Loss of function confirms the role:
      Lalba-null mice produce highly viscous milk with little or no lactose and cannot sustain their pups,
      and replacement with the human gene restores normal lactation. Core process; same call for all four
      orthologs.'
    supported_by:
    - reference_id: PMID:11419947
      supporting_text: LA promotes the binding of glucose (Glc) to beta4Gal-T1, thereby altering its sugar
        acceptor specificity from N-acetylglucosamine (GlcNAc) to glucose, which enables LS to synthesize
        lactose, the major carbohydrate component of milk.
    - *id004
    - &id017
      reference_id: PMID:8022817
      supporting_text: They produce a highly viscous milk that pups appear to be unable to remove from
        the mammary gland. This milk is rich in fat and protein and is devoid of alpha-lactalbumin and
        lactose.
    - &id016
      reference_id: PMID:7708733
      supporting_text: Homozygous null females are alpha-lac-deficient, produce reduced amounts of thickened
        milk containing little or no lactose, and cannot sustain their offspring.
    - reference_id: PMID:7708733
      supporting_text: This provides definitive evidence that alpha-lac is required for lactose synthesis
        and that lactose is important for milk production.
- term:
    id: GO:0032355
    label: response to estradiol
  evidence_type: IDA
  original_reference_id: PMID:3585228
  qualifier: involved_in
  review:
    summary: 'AgBase IDA for response to estradiol: high-dose steroids reduce alpha-lactalbumin secretion
      by bovine lactating mammary explants.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'In this study alpha-lactalbumin secretion was a readout of mammary explant differentiation;
      supraphysiological progesterone (1000-fold above effective concentrations in non-lactating tissue),
      deoxycorticosterone, dehydroepiandrosterone and to some extent oestradiol reduced it. This shows
      that alpha-lactalbumin output is regulated downstream of steroid exposure in the tissue, not that
      the alpha-lactalbumin protein carries out any part of the cellular response to the steroid. Expression
      or secretion changes of a marker are not participation in the response process. Same action for
      all four steroid-response rows. Marked over-annotated rather than removed or kept: the underlying
      bovine explant experiment is real and GO conventionally admits expression-level hormone responses,
      but alpha-lactalbumin performs no step of the response; this matches the call made for the same
      explant study (PMID:3585228) across the casein family reviews.'
    supported_by:
    - *id005
    - &id006
      reference_id: PMID:3585228
      supporting_text: A similar inhibitory effect was also found using high levels of other steroids
        without 11 beta-hydroxyl, such as deoxycorticosterone and dehydroepiandrosterone, and to some
        extent with oestradiol-17 beta, but not with cortisol or corticosterone.
