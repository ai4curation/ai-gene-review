id: D5ALI6
gene_symbol: cycH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272942
  label: Rhodobacter capsulatus SB 1003
description: CycH (CcmI) is a membrane-anchored, TPR-containing substrate-recognition component of the
  System I cytochrome c maturation machinery. Its large periplasmic domain recognizes apocytochrome c
  and helps present the substrate to the CcmFHI heme-ligation complex. It is distinct from the redox-active
  CcmH protein.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IC
  original_reference_id: PMID:21956106
  qualifier: located_in
  review:
    summary: CcmI is anchored in the cytoplasmic membrane by its N-terminal domain.
    action: NEW
    reason: The CcmI domain architecture and primary analysis of the membrane-embedded N-terminal region
      support this location. D5ALI6 has IPR017560 CcmI/TPR membership (PTHR47870:SF1); the family label
      alone is not used to infer CcmH redox chemistry. Full-length His10-CcmI derives from pSVEN and complements
      MT-SRP1; only the CcmI-1 fragment donor is explicitly MT1131 genomic DNA. Exact full-length construct
      equality to SB1003 D5ALI6 has not been established.
    supported_by:
    - reference_id: PMID:21956106
      supporting_text: One of these proteins is CcmI, which has an N-terminal membrane-embedded domain
        with two transmembrane helices and a large C-terminal periplasmic domain with protein-protein
        interaction motifs.
    - reference_id: file:RHOCB/ccl2/ccl2-source-analysis/construct-scope.md
      supporting_text: The SB1003 reviews therefore transfer conserved molecular roles with explicit construct/strain
        limits and do not claim an unmodified SB1003 assay.
proposed_new_terms:
- proposed_name: apocytochrome c chaperone activity
  proposed_definition: Selective recognition and binding of apocytochrome c that presents or maintains
    it as a substrate for covalent heme attachment by a cytochrome c maturation complex.
  justification: R. capsulatus CcmI binds apo- but not holocytochrome c through its periplasmic TPR domain.
    Bare protein binding omits this substrate-specific maturation role, whereas a generic protein-folding
    activity would overstate the demonstrated outcome. No ATP-dependent folding or CcmH-like redox chemistry
    is asserted. Transfer to SB1003 is supported by CcmI domain identity, with the full-length assay donor
    limitation retained.
  supported_by:
  - reference_id: PMID:21956106
    supporting_text: CcmI binds apocytochrome c 2 but not holocytochrome c 2
  - reference_id: file:RHOCB/ccl2/ccl2-source-analysis/construct-scope.md
    supporting_text: The SB1003 reviews therefore transfer conserved molecular roles with explicit construct/strain
      limits and do not claim an unmodified SB1003 assay.
