suggested_questions:
- question: Can the complete assayed construct sequence be matched to this SB1003 accession, and can the
    proposed intermediates be measured in the native strain?
proposed_new_terms:
- proposed_name: apocytochrome c chaperone activity
  proposed_definition: Selective recognition and binding of apocytochrome c that presents or maintains
    it as a substrate for covalent heme attachment by a cytochrome c maturation complex.
  justification: The cysteine-less CcmG derivative binds apocytochrome directly and supports cytochrome
    production in redox-pathway mutant backgrounds. This supports a thiol-independent substrate-holding
    role beyond disulfide catalysis, without asserting ATP-dependent refolding or general aggregation
    suppression. The experiment used an engineered CcmG derivative and MT1131-related backgrounds; its
    conserved role is inferred for SB1003 HelX.
  supported_by:
  - reference_id: PMID:18786143
    supporting_text: Purified CcmG* can bind apocytochrome c in vitro, revealing for the first time a
      thiol-independent, direct interaction between apocytochrome c and CcmG.
