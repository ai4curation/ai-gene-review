    id: GO:0015036
    label: disulfide oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00026549
  - InterPro:IPR004799
  review:
    summary: HelX catalyzes thiol-disulfide exchange on protein substrates.
    action: MODIFY
    reason: GO:0015035 is the protein-substrate-specific descendant of the original broader oxidoreductase
      term. PMID28634234 directly assays apocytochrome and CcmH protein thiols and mixed-disulfide exchange,
      rather than only a generic small-molecule disulfide reaction. Current GO definitions describe reversible
      redox chemistry for both GO:0015035 and GO:0015036; this refinement specifies the protein substrate,
      not an unsupported irreversible direction. The experiment used soluble tagged/truncated R. capsulatus
      constructs and engineered backgrounds, and the conserved activity is inferred for SB1003 HelX without
      asserting exact unmodified-target assay identity.
    supported_by:
    - reference_id: PMID:28634234
      supporting_text: CcmG can efficiently reduce the disulfide bond of apocytochrome c and also resolve
        a mixed disulfide bond formed between apocytochrome c and CcmH.
    - reference_id: file:RHOCB/ccl2/ccl2-source-analysis/construct-scope.md
      supporting_text: The SB1003 reviews therefore transfer conserved molecular roles with explicit construct/strain
        limits and do not claim an unmodified SB1003 assay.
    proposed_replacement_terms:
    - id: GO:0015035
      label: protein-disulfide reductase activity
