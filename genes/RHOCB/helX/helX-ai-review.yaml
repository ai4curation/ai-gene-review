id: P36893
gene_symbol: helX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272942
  label: Rhodobacter capsulatus SB 1003
description: HelX (CcmG) is a membrane-tethered thioredoxin-like protein whose periplasmic catalytic domain
  supports c-type cytochrome maturation. It reduces disulfides at the apocytochrome heme-binding site
  and resolves mixed disulfides involving CcmH, making thiols available for covalent heme attachment.
  It also has a thiol-independent apocytochrome-holding role that assists maturation.
existing_annotations:
