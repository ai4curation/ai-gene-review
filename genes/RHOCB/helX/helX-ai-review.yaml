- id: PMID:18786143
  title: Compensatory thio-redox interactions between DsbA, CcdA and CcmG unveil the apocytochrome c holdase
    role of CcmG during cytochrome c maturation.
  findings:
  - statement: An engineered cysteine-less CcmG binds apocytochrome, separating substrate-holding from
      thioreduction; the redox branch can be bypassed in DsbA-null R. capsulatus.
    supporting_text: Purified CcmG* can bind apocytochrome c in vitro, revealing for the first time a
      thiol-independent, direct interaction between apocytochrome c and CcmG.
