id: P26168
gene_symbol: bchE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272942
  label: Rhodobacter capsulatus SB 1003
description: >-
  bchE encodes the anaerobic magnesium-protoporphyrin IX monomethyl ester (MPE)
  cyclase of Rhodobacter capsulatus, the enzyme that closes the isocyclic fifth
  (E) ring of the bacteriochlorophyll macrocycle. It converts Mg-protoporphyrin
  IX 13-monomethyl ester to 3,8-divinyl protochlorophyllide a by a six-electron
  oxidation that installs an oxo group at C13(1), drawing that oxygen from water
  rather than from molecular oxygen (EC 1.21.98.3). BchE is a cobalamin-dependent
  radical S-adenosyl-L-methionine enzyme: an N-terminal B12-binding domain carries
  adenosylcobalamin and a radical SAM core carries a [4Fe-4S] cluster on the
  canonical CxxxCxxC motif (Cys204, Cys208, Cys211), from which reductive cleavage
  of SAM generates the 5'-deoxyadenosyl radical that abstracts the first hydrogen
  from the substrate's 13(1) position. The same net conversion is performed in
  oxygenic phototrophs and in aerobically growing anoxygenic phototrophs by the
  unrelated di-iron oxygenase AcsF, which uses O2 and NADPH; R. capsulatus has no
  AcsF, so BchE is the organism's only route from MPE to protochlorophyllide and
  loss of bchE blocks bacteriochlorophyll a synthesis with stoichiometric
  accumulation of MPE. The enzyme acts in the light-independent (dark-operative)
  branch of chlorophyll/bacteriochlorophyll biosynthesis and is active only under
  anaerobic, photosynthetic growth conditions; its native localization is
  membrane-associated and it requires an additional small soluble host component
  for activity.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006638
  - InterPro:IPR007197
  review:
    summary: >-
      BchE is unquestionably an enzyme, and the two InterPro signatures behind
      this row (Elp3/MiaA/NifB-like rSAM, IPR006638; rSAM, IPR007197) correctly
      identify its radical-SAM core. But GO:0003824 is the root of the molecular
      function ontology's catalytic branch and says nothing about what BchE does.
      It is standing in for a term GO does not yet have.
    action: MODIFY
    reason: >-
      BchE's reaction is EC 1.21.98.3 / RHEA:49096, a cobalamin- and
      radical-SAM-dependent six-electron oxidation of Mg-protoporphyrin IX
      13-monomethyl ester
      to 3,8-divinyl protochlorophyllide a that takes its oxo oxygen from water.
      GO has no term for it. The only MPE cyclase term, GO:0048529
      "magnesium-protoporphyrin IX monomethyl ester (oxidative) cyclase activity",
      is defined
      on the AEROBIC reaction (EC 1.14.13.81, RHEA:33235, "+ 3 NADPH + 3 H+ + 3 O2
      = divinylprotochlorophyllide + 3 NADP+ + 5 H2O") and is_a GO:0016709
      (incorporation of molecular oxygen) - the chemistry of AcsF, not of BchE.
      Annotating BchE to GO:0048529 would be exactly the historical misassignment
      of this step, and P26168 commendably does not carry it; QuickGO ontology
      searches for "1.21.98.3", "RHEA:49096" and
      "anaerobic magnesium-protoporphyrin" return no matching term. The replacement is therefore the
      new term proposed in this review, parented under GO:0046992 (the EC 1.21
      class). The underlying activity is not in doubt: it is UniProt's curated
      CATALYTIC ACTIVITY with ECO:0000269, validated in vitro for the R. capsulatus
      enzyme by H2(18)O label transfer onto the C13(1)-oxo group [PMID:33211085]
      and reconstituted with purified protein for a BchE ortholog [PMID:42748141].
    proposed_replacement_terms:
    - id: NTR
      label: anaerobic magnesium-protoporphyrin IX monomethyl ester cyclase activity
    additional_reference_ids:
    - PMID:33211085
    - PMID:42748141
    supported_by:
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=Mg-protoporphyrin IX 13-monomethyl ester + 3
        S-adenosyl-L-methionine + H2O = 3,8-divinyl protochlorophyllide a + 3
        5'-deoxyadenosine + 3 L-methionine + 4 H(+)
    - reference_id: PMID:33211085
      supporting_text: >-
        We established a spectroscopic in vitro activity assay which was
        subsequently validated by HPLC analyses and H218O isotope label transfer
        onto the carbonyl-group (C-131-oxo) of the isocyclic ring of Pchlide.
      reference_section_type: ABSTRACT
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF04055; Radical_SAM; 1.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN000228879
  review:
    summary: >-
      A TreeGrafter node-level location, not an observation on BchE. Direct
      subcellular fractionation of R. capsulatus places BchE on the membrane and
      identifies a separate small soluble component as the cytosolic requirement
      for activity, so asserting the cytosol as BchE's location overstates what
      is known.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      P26168 has no transmembrane segment and no signal peptide in UniProt, which
      is precisely the feature profile that makes a tree-grafted cytosol default
      the expected machine output; the row therefore carries no independent
      information about this protein. Against it stands direct experimental
      fractionation in the native host: Wiesselmann et al. report
      "membrane-localized BchE" requiring a distinct heat-sensitive cytosolic
      component, later narrowed by size fractionation to a 3-10 kDa species
      [PMID:33211085]. Consistent with a membrane-associated enzyme, BchE has a
      long history of insolubility on recombinant expression, and even when
      soluble R. capsulatus BchE was finally obtained it was catalytically dead
      [PMID:42748141]. This is MARK_AS_OVER_ANNOTATED rather than REMOVE because
      the fractionation evidence is available to us only as an abstract and the
      enzyme may well partition between a membrane-bound active pool and a soluble
      pool; it is not MODIFY to a membrane term, because asserting a specific
      membrane location from one abstract would substitute one unsupported
      location for another. Recorded as a knowledge gap and a suggested experiment
      instead.
    additional_reference_ids:
    - PMID:33211085
    - PMID:42748141
    supported_by:
    - reference_id: PMID:33211085
      supporting_text: >-
        Subcellular fractionation experiments revealed that membrane-localized
        BchE requires an additional, heat-sensitive cytosolic component for
        activity.
      reference_section_type: ABSTRACT
    - reference_id: PMID:33211085
      supporting_text: >-
        Size-fractionation of the soluble R. capsulatus fraction indicated that
        enzymatic activity relies on a specific component with an estimated
        molecular mass between 3 and 10 kDa.
      reference_section_type: ABSTRACT
    - reference_id: PMID:42748141
      supporting_text: >-
        detailed mechanistic analysis has been impeded by the inability to obtain
        soluble, catalytically active enzyme
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000228879
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Ancestral node location for the BchE-like family; no sub-cellular assay
          on any member grounds it, and the one direct fractionation of a member
          (R. capsulatus BchE) found the protein membrane-associated.
- term:
    id: GO:0030494
    label: bacteriochlorophyll biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:8158642
  qualifier: involved_in
  review:
    summary: >-
      The CACAO row. Bollivar et al. 1994 is a cluster-wide directed mutational
      analysis of 12 photosynthesis-gene-cluster reading frames in which seven
      disruptions abolished bacteriochlorophyll synthesis with accumulation of
      specific Mg-tetrapyrrole intermediates; for bchE that intermediate is MPE.
      The claim is correct and the evidence code is right. The entry already
      carries the more specific GO:0036070, of which GO:0030494 is an ancestor, so
      the row is refined rather than challenged.
    action: MODIFY
    reason: >-
      This is a sound student annotation, and the strain/locus questions that this
      gene was screened for do not hold up: the paper is a systematic survey of
      the whole gene cluster, so the fact that bchE, bchF and bchJ all cite it is
      what that experiment supports, not a sign that one locus's result was spread
      across its neighbours. The gene-specific lesion is independently
      corroborated - the MPE-accumulating bchE transposon mutant is reported by
      Yang and Bauer as ORF F1025 [PMID:2203738] and named as bchE by Gough et al.
      [PMID:10841582]. The only change warranted is granularity. R. capsulatus
      makes bacteriochlorophyll only under anaerobic, photosynthetic conditions
      and has no AcsF, so BchE is the obligate dark/oxygen-independent cyclase
      [PMID:42748141]; UniProt's curated pathway statement is explicitly
      "bacteriochlorophyll biosynthesis (light-independent)". QuickGO gives
      GO:0030494 among the is_a/part_of ancestors of GO:0036070, which this entry
      already carries by IEA, so MODIFY points this experimental row at the
      specific term it in fact supports rather than leaving the strongest evidence
      on the broader one.
    proposed_replacement_terms:
    - id: GO:0036070
      label: light-independent bacteriochlorophyll biosynthetic process
    additional_reference_ids:
    - PMID:2203738
    - PMID:10841582
    - PMID:42748141
    supported_by:
    - reference_id: PMID:8158642
      supporting_text: >-
        we have undertaken a systematic directed mutational analysis of 12 open
        reading frames in the photosynthesis gene cluster to evaluate whether
        individual open reading frames have a role in photopigment biosynthesis
      reference_section_type: ABSTRACT
    - reference_id: PMID:8158642
      supporting_text: >-
        The results of this analysis demonstrate that mutations constructed in
        seven open reading frames resulted in a loss of bacteriochlorophyll
        biosynthesis, concomitant with the accumulation of specific intermediates
        in the Mg-tetrapyrrole biosynthetic pathway.
      reference_section_type: ABSTRACT
    - reference_id: PMID:10841582
      supporting_text: >-
        MPE accumulates in transposon mutants of the Rhodobacter capsulatus bchE
        gene, suggesting that the encoded protein is required for MPE-cyclase
        activity
      reference_section_type: RESULTS
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        Porphyrin-containing compound metabolism; bacteriochlorophyll biosynthesis
        (light-independent).
- term:
    id: GO:0031419
    label: cobalamin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006158
  - InterPro:IPR036724
  review:
    summary: >-
      Correct and, unusually for an InterPro2GO row, independently grounded well
      beyond family membership. BchE carries a B12-binding domain at residues
      9-143, the cyclase reaction in R. capsulatus has an absolute cobalamin
      requirement shown in vivo, candidate cobalamin ligands were identified by
      site-directed mutagenesis of this very protein, and a purified BchE ortholog
      shows a cob(II)alamin EPR signal.
    action: ACCEPT
    reason: >-
      The domain assignment itself is sound (Pfam PF02310 B12-binding, PROSITE
      PS51332, UniProt DOMAIN 9..143), so the row would be defensible on
      membership alone - but it does not have to rest there. Gough et al. showed
      with B12-auxotrophic bluE/bluB mutants and an in vivo cyclase assay under
      inhibited protein synthesis that the MPE cyclase reaction has an absolute
      demand for B12 or adenosylcobalamin, which UniProt records as an
      ECO:0000269 adenosylcob(III)alamin cofactor [PMID:10841582]. Wiesselmann et
      al. then identified candidate cobalamin ligands (Asp248, Glu249, Leu29,
      Thr71, Val97) by complementation assay of 24 site-directed R. capsulatus
      BchE mutants [PMID:33211085]. York et al. finally confirmed bound cobalamin
      spectroscopically on purified protein, though on the Rubrivivax pictus
      ortholog rather than the R. capsulatus enzyme, which is why that line is
      corroborating rather than primary here [PMID:42748141]. Core: cobalamin is
      not an incidental ligand but the cofactor that initiates the chemistry.
    additional_reference_ids:
    - PMID:10841582
    - PMID:33211085
    - PMID:42748141
    supported_by:
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: >-
        Name=adenosylcob(III)alamin; Xref=ChEBI:CHEBI:18408;
        Evidence={ECO:0000269|PubMed:10841582};
    - reference_id: PMID:10841582
      supporting_text: >-
        Fig. 5 C shows that mutant MPE cyclase activity has an absolute demand for
        exogenous B 12 or AdCob. This experiment shows that a cobalamin cofactor
        acts directly on the cyclase reaction.
      reference_section_type: RESULTS
    - reference_id: PMID:33211085
      supporting_text: >-
        Potential ligands of the [4Fe-4S] cluster (Cys204, Cys208, Cys211), of SAM
        (Phe210, Glu308 and Lys320) and of the proposed cobalamin cofactor
        (Asp248, Glu249, Leu29, Thr71, Val97) were identified.
      reference_section_type: ABSTRACT
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF02310; B12-binding; 1.
- term:
    id: GO:0036070
    label: light-independent bacteriochlorophyll biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00671
  review:
    summary: >-
      The right process term at the right granularity, and the one this gene's
      experimental evidence actually supports. BchE is the oxygen-independent
      cyclase of the dark-operative bacteriochlorophyll route, and R. capsulatus
      lacks the aerobic alternative entirely.
    action: ACCEPT
    reason: >-
      The UniPathway mapping lands on the specific term by the accident of being a
      pathway-level assignment, but it happens to be exactly right. UniProt's
      curated PATHWAY statement is "bacteriochlorophyll biosynthesis
      (light-independent)", and the FUNCTION statement specifies the anaerobic,
      water-derived-oxygen chemistry that distinguishes this branch. York et al.
      state plainly that R. capsulatus has no AcsF, so every molecule of
      protochlorophyllide in this organism comes from BchE [PMID:42748141];
      Bollivar et al.'s bchE disruption accordingly abolishes bacteriochlorophyll
      synthesis under photosynthetic growth [PMID:8158642]. Core.
    additional_reference_ids:
    - PMID:42748141
    - PMID:8158642
    supported_by:
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        Porphyrin-containing compound metabolism; bacteriochlorophyll biosynthesis
        (light-independent).
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the anaerobic formation of the isocyclic ring (E-ring) in
        Mg-protoporphyrin monomethyl ester (MPE) to yield protochlorophyllide a
        (PChlide a) via a six-electron oxidation and the formation of an oxo group
        at position C13 using oxygen from a water molecule.
    - reference_id: PMID:42748141
      supporting_text: >-
        R. capsulatus does not utilize AcsF, so all production of PChlide must
        originate through the action of BchE.
      reference_section_type: DISCUSSION
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006158
  - InterPro:IPR036724
  review:
    summary: >-
      The one chemistry claim on this entry that rests on family membership alone
      and is not entailed by the specific cofactor terms. BchE's metals are the
      cobalt held inside a corrin ring and the irons held inside a [4Fe-4S]
      cluster; GO files both away from "metal ion binding" deliberately, and no
      discrete metal-ion site is reported for BchE.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The row comes from the cobalamin-binding domain signatures (IPR006158,
      IPR036724) via InterPro2GO. It is not redundant with the specific terms, so
      TOO_GENERAL does not apply: QuickGO gives the is_a/part_of ancestors of
      GO:0051536 as GO:0051540 metal cluster binding, GO:0036094 and GO:0005488 -
      not GO:0046872 - and the ancestors of GO:0031419 as GO:0046906 tetrapyrrole
      binding, GO:0019842 vitamin binding, GO:0036094 and GO:0005488, again not
      GO:0046872. Neither specific term entails this one, and GO's placement
      encodes a real distinction: the cobalt is coordinated by the corrin
      macrocycle of a bound cofactor and the irons by cluster sulfurs, neither
      being a free metal ion recruited to a dedicated site. Nothing in the
      literature on BchE reports such a site; the substrate's own magnesium is
      part of the Mg-porphyrin, not an enzyme-bound ion, and the structure-guided
      mutagenesis of 24 residues found ligands only for the cluster, SAM and
      cobalamin [PMID:33211085]. Not REMOVE: cobalt and iron really are present in
      the holoenzyme, so the term is uninformative and over-reaching rather than
      false. Raised for InterPro as a suggested question.
    additional_reference_ids:
    - PMID:33211085
    supported_by:
    - reference_id: PMID:33211085
      supporting_text: >-
        Potential ligands of the [4Fe-4S] cluster (Cys204, Cys208, Cys211), of SAM
        (Phe210, Glu308 and Lys320) and of the proposed cobalamin cofactor
        (Asp248, Glu249, Leu29, Thr71, Val97) were identified.
      reference_section_type: ABSTRACT
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: >-
        Name=[4Fe-4S] cluster; Xref=ChEBI:CHEBI:49883;
        Evidence={ECO:0000305|PubMed:10841582};
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006638
  - InterPro:IPR007197
  review:
    summary: >-
      Supported by more than the radical-SAM signature that generated it. The
      canonical CxxxCxxC motif is present and intact in P26168
      (Cys204-x3-Cys208-x2-Cys211), those three cysteines were tested by
      site-directed mutagenesis
      of R. capsulatus BchE and identified as the cluster ligands, and a purified
      BchE ortholog gives a [4Fe-4S] EPR spectrum.
    action: ACCEPT
    reason: >-
      Worth separating the strands, because the cluster was for two decades an
      inference. Gough et al. only proposed it from a cysteine spacing
      resemblance to biotin synthase, which is why UniProt's cofactor and BINDING
      lines for the cluster still carry ECO:0000305 rather than ECO:0000269
      [PMID:10841582]. The inference has since been tested on this protein:
      Wiesselmann et al. identified Cys204, Cys208 and Cys211 as the [4Fe-4S]
      ligands by in vivo complementation assay of 24 site-directed BchE mutants
      [PMID:33211085], and those positions sit in the canonical radical-SAM motif
      in the deposited sequence (residues 195-215 read VAIPNMARGCPFTCSFCSQWK, i.e.
      C204-x3-C208-x2-C211), so this is not a case of a motif asserted from memory.
      York et al. then confirmed a [Fe4S4] cluster spectroscopically on purified
      protein, on the Rubrivivax pictus ortholog [PMID:42748141]. Core: cluster
      reduction and reductive SAM cleavage are the first step of the catalytic
      cycle.
    additional_reference_ids:
    - PMID:10841582
    - PMID:33211085
    - PMID:42748141
    supported_by:
    - reference_id: PMID:33211085
      supporting_text: >-
        Potential ligands of the [4Fe-4S] cluster (Cys204, Cys208, Cys211), of SAM
        (Phe210, Glu308 and Lys320) and of the proposed cobalamin cofactor
        (Asp248, Glu249, Leu29, Thr71, Val97) were identified.
      reference_section_type: ABSTRACT
    - reference_id: PMID:42748141
      supporting_text: >-
        The enzyme was purified anaerobically and characterized by UV-Vis and
        electron paramagnetic resonance spectroscopy to confirm the presence of
        Cbl and a [Fe4S4] cluster.
      reference_section_type: ABSTRACT
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: >-
        BINDING 204 /ligand="[4Fe-4S] cluster"
    - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: >-
        DOMAIN 190..417 /note="Radical SAM core"
core_functions:
- description: >-
    Cobalamin- and radical-SAM-dependent anaerobic cyclization of
    Mg-protoporphyrin IX 13-monomethyl ester to 3,8-divinyl protochlorophyllide a,
    the committed oxygen-independent step that builds the isocyclic fifth ring of
    the bacteriochlorophyll macrocycle. Reductive cleavage of SAM at a [4Fe-4S]
    cluster generates a 5'-deoxyadenosyl radical that abstracts a hydrogen from the
    substrate's 13(1) carbon; three successive rounds effect a six-electron
    oxidation, installing an oxo group whose oxygen comes from water, and closing
    the ring. This is the sole route from MPE to protochlorophyllide in R.
    capsulatus, which encodes no aerobic AcsF cyclase.
  proposed_molecular_function: anaerobic magnesium-protoporphyrin IX monomethyl ester cyclase activity
  directly_involved_in:
  - id: GO:0036070
    label: light-independent bacteriochlorophyll biosynthetic process
  substrates:
  - id: CHEBI:60491
    label: magnesium protoporphyrin 13-monomethyl ester(1-)
  - id: CHEBI:59789
    label: S-adenosyl-L-methionine zwitterion
  knowledge_gaps:
  - gap_statement: >-
      The native location of catalytically competent BchE, and the identity of the
      small soluble host component it requires, are undetermined: soluble R.
      capsulatus BchE has now been purified but makes only an off-pathway olefin,
      not protochlorophyllide, and the candidate partner ferredoxin RcFdxA does not
      restore activity.
    boundary: >-
      Firmly established: the overall reaction and its stoichiometry, the water
      origin of the C13(1) oxo oxygen, the absolute cobalamin requirement in vivo,
      the [4Fe-4S] and cobalamin ligand residues, and full in vitro turnover by a
      purified Rubrivivax pictus ortholog with ferredoxin as reductant.
    gap_kind:
    - BIOLOGY
    dark_aspect: CC_DARK
    significance: >-
      Without it, the one cellular-component annotation on this entry cannot be
      grounded, and the physiological electron donor for the only anaerobic
      isocyclic-ring cyclase known remains unassigned.
    resolution: >-
      Fractionate R. capsulatus grown photosynthetically with marker-controlled
      membrane and soluble fractions, locate BchE by immunoblot and by activity,
      and identify the 3-10 kDa requirement by activity-guided purification or by
      complementing purified R. capsulatus BchE with candidate small redox
      proteins.
    provenance:
    - reference_id: PMID:42748141
      supporting_text: >-
        In our attempts to obtain soluble BchE constructs, we also purified BchE
        from R. capsulatus and R. gelatinosus. Neither of these enzymes produced
        the PChlide product and could only form the 575 species using Ti(III)citrate
        with no activity using ferredoxins.
      reference_section_type: DISCUSSION
    - reference_id: PMID:42748141
      supporting_text: >-
        Similarly, despite our ability to purify soluble RcBchE, we did not observe
        PChlide formation with RcFdxA.
      reference_section_type: DISCUSSION
    - reference_id: PMID:33211085
      supporting_text: >-
        Size-fractionation of the soluble R. capsulatus fraction indicated that
        enzymatic activity relies on a specific component with an estimated
        molecular mass between 3 and 10 kDa.
      reference_section_type: ABSTRACT
  supported_by:
  - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: >-
      Reaction=Mg-protoporphyrin IX 13-monomethyl ester + 3
      S-adenosyl-L-methionine + H2O = 3,8-divinyl protochlorophyllide a + 3
      5'-deoxyadenosine + 3 L-methionine + 4 H(+)
  - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Catalyzes the anaerobic formation of the isocyclic ring (E-ring) in
      Mg-protoporphyrin monomethyl ester (MPE) to yield protochlorophyllide a
