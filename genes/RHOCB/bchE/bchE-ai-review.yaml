proposed_new_terms:
- proposed_name: anaerobic magnesium-protoporphyrin IX monomethyl ester cyclase activity
  proposed_definition: >-
    Catalysis of the reaction: Mg-protoporphyrin IX 13-monomethyl ester + 3
    S-adenosyl-L-methionine + H2O = 3,8-divinyl protochlorophyllide a + 3
    5'-deoxyadenosine + 3 L-methionine + 4 H(+). This oxygen-independent,
    cobalamin- and radical-S-adenosyl-L-methionine-dependent six-electron
    oxidation installs the oxo group at C13(1) and closes the isocyclic (E) ring,
    taking the oxo oxygen from water rather than from molecular oxygen.
  justification: >-
    GO has no term for EC 1.21.98.3 / RHEA:49096, the anaerobic route to
    protochlorophyllide catalysed by BchE. The only existing MPE cyclase term,
    GO:0048529, is defined on the aerobic di-iron oxygenase reaction of AcsF (EC
    1.14.13.81, RHEA:33235) and is_a GO:0016709, so it cannot describe BchE
    without asserting O2 and NADPH chemistry that BchE does not perform - yet
    GO:0048529 is in fact propagated to bchE orthologs by IEA, which is a
    recurring misassignment of this step. Bacteria and archaea that make
    bacteriochlorophyll anaerobically (Rhodobacter, Rubrivivax, Chlorobium,
    Heliobacillus) need the distinct activity, and R. capsulatus, which has no
    AcsF at all, is the clearest case. Without the term, the enzyme's only
    molecular-function annotation is the ontology root GO:0003824.
  proposed_parent:
    id: GO:0046992
    label: oxidoreductase activity, acting on X-H and Y-H to form an X-Y bond
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: EC:1.21.98.3
      label: anaerobic magnesium-protoporphyrin IX monomethyl ester cyclase
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:49096
      label: >-
        Mg-protoporphyrin IX 13-monomethyl ester + 3 S-adenosyl-L-methionine + H2O
        = 3,8-divinyl protochlorophyllide a + 3 5'-deoxyadenosine + 3 L-methionine
        + 4 H(+)
  supported_by:
  - reference_id: file:genes/RHOCB/bchE/bchE-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: >-
      Reaction=Mg-protoporphyrin IX 13-monomethyl ester + 3
      S-adenosyl-L-methionine + H2O = 3,8-divinyl protochlorophyllide a + 3
      5'-deoxyadenosine + 3 L-methionine + 4 H(+)
  - reference_id: PMID:42748141
    supporting_text: >-
      BchE is a Cbl-dependent radical SAM enzyme that catalyzes a six-electron
      oxidation of Mg-protoporphyrin IX monomethylester to protochlorophyllide
      (PChlide), installing a ketone and forming the fifth ring of
      bacteriochlorophyll under anaerobic conditions.
    reference_section_type: ABSTRACT
  - reference_id: PMID:33211085
    supporting_text: >-
      the oxygen-independent conversion of Mg-protoporphyrin IX monomethyl ester
      (Mg-PME) to protochlorophyllide (Pchlide) is catalyzed by the anaerobic
      Mg-PME cyclase termed BchE
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Should GO add a molecular-function term for EC 1.21.98.3 / RHEA:49096, the
    anaerobic cobalamin- and radical-SAM-dependent MPE cyclase, so that BchE
    proteins stop being annotated either to the ontology root GO:0003824 or, worse,
    to GO:0048529, whose definition commits them to the O2- and NADPH-dependent
    AcsF reaction they do not catalyse?
  experts:
  - Joern Moser
  - Dieter Jahn
  - Squire J. Booker
- question: >-
    Should InterPro2GO drop GO:0046872 metal ion binding from the cobalamin-binding
    domain signatures IPR006158 and IPR036724? GO places cobalamin binding under
    tetrapyrrole and vitamin binding, not under metal ion binding, because the
    cobalt is held inside a bound corrin cofactor rather than at a protein metal-ion
    site; the mapping adds an unentailed claim to every B12-binding protein.
  experts: []
- question: >-
    Where is catalytically competent BchE in the R. capsulatus cell, and what is
    the 3-10 kDa soluble component it requires? Purified R. capsulatus BchE is
    soluble but yields only the off-pathway 575 nm olefin, and RcFdxA does not
    rescue it, so the physiological reductant or partner is still unidentified.
  experts:
  - Joern Moser
  - Nicholas J. York
- question: >-
    Why do the R. capsulatus and R. gelatinosus BchE proteins stall at the
    off-pathway olefin in vitro while the Rubrivivax pictus ortholog turns over
    fully - a missing host factor, a lost cofactor loading step, or a genuine
    mechanistic difference between these enzymes?
  experts:
  - Squire J. Booker
suggested_experiments:
- hypothesis: >-
    Catalytically competent BchE is membrane-associated in photosynthetically grown
    R. capsulatus, and the cytosol annotation reflects only a soluble inactive pool.
  description: >-
    Fractionate anaerobically, photosynthetically grown R. capsulatus SB1003 into
    membrane and soluble fractions with explicit marker controls for each
    compartment, and locate BchE in parallel by immunoblot and by MPE-to-PChlide
    activity. Repeat with a chromosomally tagged bchE allele to exclude
    overexpression artefacts, and test salt and detergent extractability to
    distinguish peripheral association from integral insertion.
  experiment_type: subcellular fractionation with marker-controlled immunoblot and activity assay
- hypothesis: >-
    The 3-10 kDa soluble requirement of R. capsulatus BchE is the missing component
    that converts purified RcBchE from an olefin-forming dead end into a productive
    cyclase.
  description: >-
    Reconstitute purified R. capsulatus BchE with size-fractionated soluble extract
    from photosynthetically grown wild-type cells, following PChlide formation by
    HPLC and fluorescence, and purify the active fraction to identity by
    activity-guided chromatography and mass spectrometry. Counter-screen candidate
    small redox proteins, including RcFdxA and other ferredoxins and flavodoxins,
    individually and in combination.
  experiment_type: activity-guided reconstitution and partner identification
- hypothesis: >-
    Cys204, Cys208 and Cys211 ligate the single [4Fe-4S] cluster of R. capsulatus
    BchE, as inferred from complementation of site-directed mutants.
  description: >-
    Express and purify wild-type and C204A, C208A and C211A R. capsulatus BchE
    anaerobically and compare iron and sulfide content, UV-visible spectra and EPR
    spectra before and after dithionite reduction, to convert the mutagenesis
    inference into direct spectroscopic assignment on this protein rather than on
    the Rubrivivax ortholog.
  experiment_type: anaerobic purification with iron/sulfide quantitation and EPR spectroscopy
