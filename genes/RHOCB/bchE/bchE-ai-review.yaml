- id: PMID:8158642
  title: Directed mutational analysis of bacteriochlorophyll a biosynthesis in Rhodobacter
    capsulatus.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The CACAO reference. PubMed-verified; cached abstract only
      (full_text_available: false). It is a cluster-wide directed mutational
      analysis of 12 photosynthesis-gene-cluster reading frames, so its citation
      on bchE, bchF and bchJ alike is legitimate rather than a sign that one
      locus's result was propagated to its neighbours. QuickGO shows four CACAO
      rows citing it, all GO:0030494 IMP: bchE, bchF and bchJ under taxon 272942
      and bchM (P26236) under taxon 1061; the taxon split reflects the vintage of
      the UniProt entries (P26236 is the species-level BCHM_RHOCA record from
      1992), not an annotation transferred between isolates. We could not read the
      full text to confirm which of the twelve reading frames bchE was among, but
      the MPE-accumulating bchE lesion is independently reported by PMID:2203738
      and named as bchE by PMID:10841582, so the claim does not rest on this paper
      alone.
  findings:
  - statement: >-
      Twelve photosynthesis-gene-cluster reading frames were disrupted by directed
      mutagenesis; seven disruptions abolished bacteriochlorophyll biosynthesis
      with accumulation of specific Mg-tetrapyrrole intermediates.
    supporting_text: >-
      The results of this analysis demonstrate that mutations constructed in seven
      open reading frames resulted in a loss of bacteriochlorophyll biosynthesis,
      concomitant with the accumulation of specific intermediates in the
      Mg-tetrapyrrole biosynthetic pathway.
    reference_section_type: ABSTRACT
- id: PMID:2203738
  title: Rhodobacter capsulatus genes involved in early steps of the bacteriochlorophyll
    biosynthetic pathway.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; cached abstract only. The original genetic identification of
      the MPE-to-protochlorophyllide lesion, as photosynthesis-gene-cluster reading
      frame F1025. The abstract names the ORF and not the gene symbol, so the
      identification of F1025 as bchE is taken from PMID:10841582 rather than
      asserted from this paper alone.
  findings:
  - statement: >-
      Disruption of photosynthesis-gene-cluster reading frame F1025, later named
      bchE, blocked conversion of magnesium-protoporphyrin monomethyl ester to
      protochlorophyllide.
    supporting_text: >-
      Three open reading frames in the Rhodobacter capsulatus photosynthesis gene
      cluster, designated F0, F108, and F1025, were disrupted by site-directed
      mutagenesis. Mutants bearing insertions in these reading frames were
      defective in converting protoporphyrin IX to magnesium-protoporphyrin
      monomethyl ester, protochlorophyllide to chlorophyllide a, and
      magnesium-protoporphyrin monomethyl ester to protochlorophyllide,
      respectively.
    reference_section_type: ABSTRACT
- id: PMID:10841582
  title: Anaerobic chlorophyll isocyclic ring formation in Rhodobacter capsulatus requires
    a cobalamin cofactor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. Establishes the absolute cobalamin requirement of
      the MPE cyclase reaction in R. capsulatus by in vivo assay in bluE/bluB B12
      auxotrophs, and is UniProt's ECO:0000269 source for the catalytic activity and
      the adenosylcobalamin cofactor. Two caveats worth recording: the work was done
      in strain 37b4 ("capsule-less wild-type R. capsulatus 37b4"), not SB1003, and
      it never handled purified BchE protein - the enzyme is inferred to be the
      cyclase from the MPE-accumulating bchE transposon mutant. Its [4Fe-4S]
      proposal is explicitly a sequence-based suggestion, which is why UniProt marks
      the cluster ECO:0000305.
  findings:
  - statement: >-
      MPE cyclase activity in R. capsulatus has an absolute requirement for
      vitamin B12 or adenosylcobalamin, shown in a B12-auxotrophic mutant under
      inhibited protein synthesis, so the cofactor acts directly on the cyclase
      reaction.
    supporting_text: >-
      Fig. 5 C shows that mutant MPE cyclase activity has an absolute demand for
      exogenous B 12 or AdCob. This experiment shows that a cobalamin cofactor acts
      directly on the cyclase reaction.
    reference_section_type: RESULTS
  - statement: >-
      MPE accumulates in bchE transposon mutants of R. capsulatus, which is the
      basis for assigning MPE cyclase function to the bchE product.
    supporting_text: >-
      MPE accumulates in transposon mutants of the Rhodobacter capsulatus bchE
      gene, suggesting that the encoded protein is required for MPE-cyclase
      activity
    reference_section_type: RESULTS
  - statement: >-
      The iron-sulfur centre of BchE was proposed from a cysteine-spacing
      resemblance to biotin synthase, not demonstrated, in this work.
    supporting_text: >-
      This cysteine arrangement resembles somewhat an iron-sulfur center as found
      in biotin synthase
    reference_section_type: DISCUSSION
  - statement: >-
      The experiments were performed in R. capsulatus strain 37b4 and its
      derivatives, not in strain SB1003 from which P26168 derives.
    supporting_text: >-
      Cell growth of capsule-less wild-type R. capsulatus 37b4
    reference_section_type: METHODS
- id: PMID:33211085
  title: 'Mg-protoporphyrin IX monomethyl ester cyclase from Rhodobacter capsulatus:
    radical SAM-dependent synthesis of the isocyclic ring of bacteriochlorophylls.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; cached abstract only, which is nonetheless unusually
      informative. This is the key gene-specific mechanistic paper on R. capsulatus
      BchE: an in vitro assay validated by H2(18)O label transfer onto the
      C13(1)-oxo group, and 24 site-directed mutants scored by in vivo
      complementation that identify the [4Fe-4S], SAM and cobalamin ligand
      residues. The three cluster cysteines it names (Cys204, Cys208, Cys211) are
      exactly UniProt's BINDING positions and sit in the canonical CxxxCxxC motif
      of the deposited sequence, which is an independent cross-check. Also the
      source of the membrane-localization finding that contradicts the TreeGrafter
      cytosol row.
  findings:
  - statement: >-
      Site-directed mutagenesis and in vivo complementation of R. capsulatus BchE
      identified Cys204, Cys208 and Cys211 as the [4Fe-4S] cluster ligands, Phe210,
      Glu308 and Lys320 for SAM, and Asp248, Glu249, Leu29, Thr71 and Val97 for
      cobalamin.
    supporting_text: >-
      Potential ligands of the [4Fe-4S] cluster (Cys204, Cys208, Cys211), of SAM
      (Phe210, Glu308 and Lys320) and of the proposed cobalamin cofactor (Asp248,
      Glu249, Leu29, Thr71, Val97) were identified.
    reference_section_type: ABSTRACT
  - statement: >-
      Subcellular fractionation of R. capsulatus placed BchE on the membrane and
      showed that activity additionally requires a heat-sensitive soluble component
      of about 3-10 kDa.
    supporting_text: >-
      Subcellular fractionation experiments revealed that membrane-localized BchE
      requires an additional, heat-sensitive cytosolic component for activity.
    reference_section_type: ABSTRACT
  - statement: >-
      The oxo oxygen installed by R. capsulatus BchE derives from water, shown by
      H2(18)O isotope label transfer onto the C13(1)-oxo group of
      protochlorophyllide.
    supporting_text: >-
      We established a spectroscopic in vitro activity assay which was subsequently
      validated by HPLC analyses and H218O isotope label transfer onto the
      carbonyl-group (C-131-oxo) of the isocyclic ring of Pchlide.
    reference_section_type: ABSTRACT
- id: PMID:42748141
  title: Isolation and in vitro characterization of BchE, the cobalamin-dependent anaerobic
    magnesium protoporphyrin IX monomethylester cyclase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read; PubMed-verified. The first purification and in
      vitro reconstitution of a BchE, with UV-visible and EPR confirmation of both
      cobalamin and a [Fe4S4] cluster - but on the Rubrivivax pictus ortholog, not
      on P26168. Soluble R. capsulatus BchE was in fact obtained here and produced
      only an off-pathway olefin, so for this review the cofactor spectroscopy is
      corroborating ortholog evidence rather than evidence on the gene. Relevance
      is MEDIUM for that reason, despite the paper's quality. It does carry two
      directly R. capsulatus statements used here: that the organism has no AcsF,
      and whole-cell replication of Gough's cobalamin dependence.
  findings:
  - statement: >-
      R. capsulatus encodes no aerobic AcsF cyclase, so all protochlorophyllide in
      this organism is made by BchE.
    supporting_text: >-
      R. capsulatus does not utilize AcsF, so all production of PChlide must
      originate through the action of BchE.
    reference_section_type: DISCUSSION
  - statement: >-
      Purified BchE binds both cobalamin and a [Fe4S4] cluster, confirmed by
      UV-visible and EPR spectroscopy, and turns over MPE to protochlorophyllide in
      vitro with chemical or ferredoxin reductants.
    supporting_text: >-
      The enzyme was purified anaerobically and characterized by UV-Vis and
      electron paramagnetic resonance spectroscopy to confirm the presence of Cbl
      and a [Fe4S4] cluster.
    reference_section_type: ABSTRACT
  - statement: >-
      The reconstituted enzyme was the Rubrivivax pictus ortholog; of BchE homologs
      from eight organisms only three were soluble and only the R. pictus protein
      was catalytically productive.
    supporting_text: >-
      we attempted heterologous expression and purification of BchE homologs from
      eight different organisms; only three yielded any soluble protein, and of
      these, only BchE from Rubrivivax pictum catalyzed the formation of PChlide.
    reference_section_type: DISCUSSION
  - statement: >-
      Soluble R. capsulatus BchE was purified but produced only the off-pathway 575
      nm species and no protochlorophyllide, and was not rescued by the candidate
      partner ferredoxin RcFdxA.
    supporting_text: >-
      In our attempts to obtain soluble BchE constructs, we also purified BchE from
      R. capsulatus and R. gelatinosus. Neither of these enzymes produced the
      PChlide product and could only form the 575 species using Ti(III)citrate with
      no activity using ferredoxins.
    reference_section_type: DISCUSSION
