- term:
    id: GO:0004408
    label: holocytochrome-c synthase activity
  evidence_type: IC
  original_reference_id: PMID:24397552
  qualifier: contributes_to
  review:
    summary: CcmF contributes to holocytochrome-c synthase activity in a multisubunit complex.
    action: NEW
    reason: The CcmFH functional reconstruction establishes complex-level synthase activity. R. capsulatus
      CcmF physically associates with CcmH and CcmI in the functional membrane machinery. The contributes_to
      qualifier explicitly avoids assigning the entire reaction to isolated CcmF; the reconstructed reaction
      is comparative E. coli evidence. The frozen target is SB1003; the primary work uses tagged/truncated
      R. capsulatus proteins and MT1131-derived complementation backgrounds. This is a conserved-role
      inference, not a direct assay of an unmodified SB1003 protein; construct provenance is documented
      in the source analysis.
    supported_by:
    - reference_id: PMID:24397552
      supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
