  review:
    summary: CcmF contributes to covalent cytochrome c-heme linkage.
    action: MODIFY
    reason: The broad heme-transport label conflates heme handling with transmembrane transport; the replacement
      is a lateral correction to the established ligation process. R. capsulatus physical complex evidence
      and comparative CcmFH functional reconstruction support participation, not isolated CcmF catalysis.
      The frozen target is SB1003; the primary work uses tagged/truncated R. capsulatus proteins and MT1131-derived
      complementation backgrounds. This is a conserved-role inference, not a direct assay of an unmodified
      SB1003 protein; construct provenance is documented in the source analysis.
