id: Q00500
gene_symbol: ccl1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272942
  label: Rhodobacter capsulatus SB 1003
description: Ccl1 (CcmF) is a multispanning inner-membrane heme-binding component of the System I cytochrome
  c ligation machinery. Together with CcmH and the substrate-recognition protein CcmI, it supports covalent
  attachment of heme to apocytochrome c on the periplasmic face of the membrane.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0037
  review:
    summary: CcmF is an integral cytoplasmic-membrane component of the ligation complex.
    action: ACCEPT
    reason: Detergent extraction and reciprocal affinity purification place CcmF in a membrane-integral
      CcmFHI complex. The plasma membrane is the supported refinement of generic membrane. The frozen
      target is SB1003; the primary work uses tagged/truncated R. capsulatus proteins and MT1131-derived
      complementation backgrounds. This is a conserved-role inference, not a direct assay of an unmodified
      SB1003 protein; construct provenance is documented in the source analysis.
    supported_by:
    - reference_id: PMID:18753134
      supporting_text: CcmF, CcmH, and CcmI associate stably with each other, indicating that these Ccm
        components form a membrane-integral complex.
- term:
