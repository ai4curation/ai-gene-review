    label: heme transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003567
  - InterPro:IPR003568
  review:
    summary: Ligation and heme handling do not establish CcmF as a membrane-crossing heme transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: CcmF binds heme and contributes to periplasmic ligation. These findings do not demonstrate
      movement of heme from one side of the membrane to the other by this target; nor do they directly
      exclude all such movement. The electronic transporter assignment exceeds the established molecular
      role. The frozen target is SB1003; the primary work uses tagged/truncated R. capsulatus proteins
      and MT1131-derived complementation backgrounds. This is a conserved-role inference, not a direct
      assay of an unmodified SB1003 protein; construct provenance is documented in the source analysis.
    supported_by:
    - reference_id: PMID:24397552
      supporting_text: CcmF contains a separate, stably bound non-covalent heme b
    - reference_id: PMID:24397552
      supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
