id: Q00501
gene_symbol: ccl2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272942
  label: Rhodobacter capsulatus SB 1003
description: Ccl2 (CcmH) is a membrane-anchored thiol-disulfide oxidoreductase of the cytochrome c maturation
  machinery. Its periplasmic redox domain forms and resolves thiol-exchange intermediates with apocytochrome
  c and CcmG, coordinating cysteine availability with stereospecific heme ligation in the CcmFHI complex.
