  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002936361
  review:
    summary: CcmH anchors its periplasmic redox domain in the cytoplasmic membrane.
    action: ACCEPT
    reason: The conserved single C-terminal transmembrane helix and periplasmic redox domain support this
      location. TreeGrafter inference is consistent with target architecture; it is not evidence of heme
      transport. The frozen target is SB1003; the primary work uses tagged/truncated R. capsulatus proteins
      and MT1131-derived complementation backgrounds. This is a conserved-role inference, not a direct
      assay of an unmodified SB1003 protein; construct provenance is documented in the source analysis.
    supported_by:
    - reference_id: PMID:28634234
      supporting_text: CcmH has a single C-terminal TM helix and a periplasmic domain containing a conserved
        LRC XX CQ active site.
