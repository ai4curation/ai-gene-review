- term:
    id: GO:0015036
    label: disulfide oxidoreductase activity
  evidence_type: IC
  original_reference_id: PMID:28634234
  qualifier: enables
  review:
    summary: CcmH mediates thiol-disulfide exchange with apocytochrome c and CcmG.
    action: NEW
    reason: Purified R. capsulatus CcmH Cys variants participate in quantified thiol-disulfide exchange;
      this adds the missing molecular activity rather than inferring catalysis from essentiality. The
      stereospecific ligation sequence is a mechanistic model supported by differential reactivity, not
      a fully observed native intermediate pathway. The frozen target is SB1003; the primary work uses
      tagged/truncated R. capsulatus proteins and MT1131-derived complementation backgrounds. This is
      a conserved-role inference, not a direct assay of an unmodified SB1003 protein; construct provenance
      is documented in the source analysis.
    supported_by:
    - reference_id: PMID:28634234
      supporting_text: Cys-45 of CcmH and Cys-34 of apocytochrome c are most likely to form this mixed
        disulfide bond
    - reference_id: PMID:28634234
      supporting_text: CcmG can efficiently reduce the disulfide bond of apocytochrome c and also resolve
        a mixed disulfide bond formed between apocytochrome c and CcmH.
    - reference_id: file:RHOCB/ccl2/ccl2-source-analysis/construct-scope.md
      supporting_text: The SB1003 reviews therefore transfer conserved molecular roles with explicit construct/strain
        limits and do not claim an unmodified SB1003 assay.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q00501
      slot: FT BINDING 42 and 45
      asserted_value: Covalent heme binding at Cys42 and Cys45 (ECO:0000255).
      requested_change: CHECK
      confidence: PROBABLE
      explanation: These positions are the experimentally investigated CcmH redox cysteines; Cys45 participates
        in mixed-disulfide exchange with apocytochrome, not demonstrated covalent heme attachment. The
        predicted heme-site assignment confuses the redox motif with a cytochrome heme-binding site. The
        primary assays used soluble tagged constructs and single-Cys derivatives; no native SB1003 covalent-heme
        assay is claimed.
      supported_by:
      - reference_id: PMID:28634234
        supporting_text: Cys-45 of CcmH and Cys-34 of apocytochrome c are most likely to form this mixed
          disulfide bond
      report_status: NOT_REPORTED
