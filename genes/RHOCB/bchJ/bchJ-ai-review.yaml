- id: file:RHOCB/bchJ/bchJ-uniprot.txt
  title: UniProtKB P26169 (BCHJ_RHOCB) flat file
  findings:
  - statement: >-
      UniProt curates the entry's pathway as light-independent bacteriochlorophyll biosynthesis
      within porphyrin-containing compound metabolism, and assigns it the BchJ-specific family
      signatures NCBIfam TIGR02019 and InterPro IPR010249 together with a single V4R domain
      (Pfam PF02830).
    record_section: ["CC:PATHWAY"]
    supporting_text: 'PATHWAY: Porphyrin-containing compound metabolism; bacteriochlorophyll
      biosynthesis (light-independent).'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The pathway line and the family signatures are sound and are used as support in this
      review. The protein-name block is not: the entry still carries "4-vinyl reductase" as an
      alternative name and "Bacteriochlorophyll synthase 23 kDa chain" as its recommended name,
      both of which assert activities that the literature has withdrawn or never established.
      Recorded as a source defect below. Protein existence is PE 4 (Predicted) and is not used
      as support anywhere here.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: UNIPROT
      record: P26169
      slot: DE
      requested_change: CHECK
      asserted_value: 'AltName: Full=4-vinyl reductase;'
      confidence: PROBABLE
      explanation: >-
        UniProtKB P26169 (BCHJ_RHOCB) carries "4-vinyl reductase" as an alternative protein
        name, and "Bacteriochlorophyll synthase 23 kDa chain" as its recommended name. Both
        preserve activity assignments that the primary literature has withdrawn or never
        supported. The 4-vinyl (C8-vinyl, divinyl) reductase activity was assigned to BchJ from
        the accumulation of divinyl protochlorophyllide in R. capsulatus bchJ mutants
        (PMID:7876113), but Chew and Bryant showed the activity belongs to BciA and that the
        C. tepidum bchJ mutant still makes C8-reduced pigments (PMID:17148453), and Canniffe et
        al. showed that R. sphaeroides bchJ cannot restore C8-ethyl chlorophyll a in a
        cyanobacterial vinyl-reductase mutant that rsp_3070 does rescue, concluding that "there
        remains no direct evidence for the activity of BchJ as a C8-vinyl reductase"
        (PMID:23252506). In Rhodobacter the reduction is carried by chlorophyllide a
        oxidoreductase (PMID:25978726). Separately, no bacteriochlorophyll synthase activity has
        ever been reported for BchJ — that activity is BchG's — so the recommended name is also
        unsupported. Suggested: retain the gene name bchJ, demote or drop the 4-vinyl reductase
        alternative name, and consider a non-committal recommended name such as
        "Bacteriochlorophyll biosynthesis protein BchJ" pending resolution of the activity. The
        same legacy sits in the domain nomenclature (Pfam PF02830 "V4R", InterPro IPR004096),
        which may be worth flagging to InterPro as well. Confidence is PROBABLE rather than
        CONFIRMED only because no positive activity has replaced the withdrawn one.
suggested_questions:
- question: >-
    Does BchJ transfer a Mg-tetrapyrrole processively from one pathway enzyme to the next, or
    does it hold the intermediate in a static multi-enzyme assembly? The equilibrium-shift assay
    that demonstrated BchH/BchJ/Mg-protoporphyrin IX ternary complex formation cannot
    distinguish these, and the two readings imply different GO molecular functions.
  experts:
  - Robert D. Willows
  - Artur Sawicki
- question: >-
    Is the enhancement of intrinsic chlorophyllide a oxidoreductase activity by BchJ in
    R. sphaeroides a direct interaction with BchXYZ, or an indirect consequence of a higher
    local concentration of the chlorophyllide substrate delivered by BchJ?
  experts:
  - Yusuke Tsukatani
  - Jiro Harada
  - Hitoshi Tamiaki
- question: >-
    Is the accumulation of 8-vinyl protochlorophyllide in a bchJ mutant a kinetic consequence of
    losing a carrier — the dark-operative protochlorophyllide reductase preferring the monovinyl
    substrate, so that an unassisted pathway backs up at the divinyl form — rather than evidence
    of any reaction performed by BchJ? This is the reading that would reconcile the original
    R. capsulatus phenotype with the refutation of the reductase assignment.
  experts:
  - Carl E. Bauer
  - Donald A. Bryant
- question: >-
    Should GO coin a molecular-function term for Mg-porphyrin carrier / chaperone activity,
    covering plant GUN4 as well as BchJ? At present GO:0046906 tetrapyrrole binding is the most
    specific term either protein can carry for this role, and its only children are chlorophyll,
    heme and cobalamin binding.
  experts: []
suggested_experiments:
- hypothesis: >-
    BchJ accepts Mg-protoporphyrin IX from the magnesium chelatase BchH subunit and delivers it
    to BchM, acting as a carrier rather than a static scaffold.
  description: >-
    Single-turnover transfer assay. Load purified recombinant R. capsulatus BchJ with
    Mg-protoporphyrin IX, then mix with an excess of BchM (or BchH) under stopped-flow
    conditions and follow the porphyrin's fluorescence or absorbance environment as it moves
    between proteins. A carrier predicts a transfer rate faster than the dissociation rate of
    free Mg-protoporphyrin IX from BchJ measured independently; a scaffold predicts transfer no
    faster than release into solution. Run with a BchH variant unable to bind BchJ as the
    specificity control.
  experiment_type: stopped-flow pigment transfer kinetics
- hypothesis: >-
    The R. capsulatus bchJ phenotype is intrinsic to loss of BchJ and not a polar effect on genes
    downstream of bchJ in the bchE-bchJ transcription unit.
  description: >-
    Build a clean, in-frame, unmarked deletion of bchJ (RCAP_rcc00670) in R. capsulatus SB1003 by
    allelic exchange, and complement it in trans from a plasmid-borne bchJ under a heterologous
    promoter. Measure bacteriochlorophyll a and 8-vinyl protochlorophyllide a by HPLC in
    wild type, deletion and complemented strains, and quantify transcripts of the genes flanking
    bchJ by RT-qPCR in each. Full restoration of pigment by trans-complementation, with unchanged
    flanking-gene transcript levels, settles a question that has hung over the original
    insertion-based assignment; the published alleles include a deletion, but no
    trans-complementation of an R. capsulatus bchJ mutant has been reported.
  experiment_type: clean deletion plus trans-complementation with pigment HPLC and RT-qPCR
- hypothesis: >-
    BchJ is a component of a Mg-tetrapyrrole-channelling assembly containing magnesium chelatase,
    BchM and the downstream reductases.
  description: >-
    Express a chromosomally tagged BchJ in R. capsulatus at native level, grow under dark
    microoxic conditions where the pathway is active, and perform crosslinking
    immunoprecipitation followed by mass spectrometry, alongside size-exclusion
    chromatography of the native lysate probed for BchH, BchM, BchN/B/L and BchX/Y/Z.
    Co-migration and reproducible crosslinked partners would convert the scaffold hypothesis
    from an interpretation of mutant kinetics into a defined complex, which is what a
    GO-CAM-style model of the pathway currently lacks.
  experiment_type: in vivo crosslinking proteomics with native size-exclusion chromatography
