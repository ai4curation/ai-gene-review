id: P26169
gene_symbol: bchJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272942
  label: Rhodobacter capsulatus SB 1003
description: >-
  BchJ is a small (213 aa) soluble protein encoded in the ~46 kb photosynthesis gene cluster of
  Rhodobacter capsulatus, as RCAP_rcc00670 immediately downstream of bchE, and is required for
  efficient light-independent bacteriochlorophyll a biosynthesis. It consists essentially of a
  single V4R domain and is recognised by its own family signature (NCBIfam TIGR02019,
  InterPro IPR010249). Disruption of bchJ lowers bacteriochlorophyll a output and causes
  accumulation of 3,8-divinyl (8-vinyl) protochlorophyllide a, which led to the protein's
  original designation as the C8-vinyl (4-vinyl) reductase of the pathway. That catalytic
  assignment has not survived: the C8-vinyl reduction is performed by the NADPH-dependent BciA
  and the ferredoxin-dependent BciB in organisms that carry them, and in Rhodobacter by
  chlorophyllide a oxidoreductase (COR, BchXYZ); bchJ mutants of Chlorobaculum tepidum and of
  Rhodobacter sphaeroides still make C8-ethyl (bacterio)chlorophyll, and bchJ cannot restore
  C8-ethyl chlorophyll a in a cyanobacterial vinyl-reductase mutant that rsp_3070 does rescue.
  What the protein does instead is handle Mg-tetrapyrrole intermediates without catalysing
  their chemistry: purified R. capsulatus BchJ binds Mg-protoporphyrin IX and forms a 1:1
  ternary complex with the magnesium chelatase BchH subunit, shifting the equilibrium of the
  chelatase reaction much as plant GUN4 does, and loss of BchJ in R. sphaeroides reduces the
  effective throughput of the intrinsic COR. Whether this amounts to a substrate carrier, a
  scaffold that assembles a biosynthetic complex, or a chaperone for the pigment enzymes is
  unresolved, and no catalytic activity has been demonstrated for the protein.
existing_annotations:
- term:
    id: GO:0015979
    label: photosynthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010249
  review:
    summary: >-
      BchJ supplies the light-harvesting and reaction-centre pigment; it performs no step of
      photosynthesis itself. The InterPro2GO mapping of the BchJ family signature to
      photosynthesis reads pigment supply as participation in the process the pigment serves.
    action: MODIFY
    reason: >-
      GO:0015979 is defined as "The synthesis by organisms of organic chemical compounds,
      especially carbohydrates, from carbon dioxide (CO2) using energy obtained from light
      rather than from the oxidation of chemical compounds." BchJ catalyses no part of that:
      every characterised effect of the protein is on the Mg-tetrapyrrole branch upstream of
      pigment assembly, and the one claim that is never in dispute is pathway membership
      ("BchJ is known to be involved in BChl biosynthesis"). GO reflects this separation —
      checked on QuickGO 2026-11-01, GO:0030494 bacteriochlorophyll biosynthetic process is not
      a descendant of GO:0015979 (its ancestors are the porphyrin/tetrapyrrole and pigment
      biosynthesis branches: GO:0015994, GO:0015995, GO:0042440, GO:0046148, GO:0033013,
      GO:0033014, GO:0006778, GO:0006779), so the two terms are genuinely different claims
      rather than a parent and a child. The essence of the row is sound, so this is a lateral
      MODIFY onto the pigment-biosynthesis term that the gene already carries and that this
      review accepts, not a REMOVE. The defect lies with the InterPro2GO mapping of IPR010249,
      not with the family assignment, which is correct.
    proposed_replacement_terms:
    - id: GO:0030494
      label: bacteriochlorophyll biosynthetic process
    supported_by:
    - reference_id: PMID:25978726
      supporting_text: BchJ is known to be involved in BChl biosynthesis, although how is still
        unclear.
    - reference_id: file:RHOCB/bchJ/bchJ-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Porphyrin-containing compound metabolism; bacteriochlorophyll
        biosynthesis (light-independent).'
- term:
    id: GO:0030494
    label: bacteriochlorophyll biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010249
  review:
    summary: >-
      Correct and core. IPR010249 is the BchJ-specific family (with a dedicated NCBIfam HMM,
      TIGR02019), so the family-to-term mapping is as tight as an InterPro2GO mapping gets, and
      the claim is independently established experimentally on this very protein.
    action: ACCEPT
    reason: >-
      The row rests on a family signature built around BchJ itself rather than on a broad
      domain shared with unrelated proteins, and the resulting term is exactly the one the
      experimental work supports: directed insertion and deletion alleles of R. capsulatus bchJ
      lower bacteriochlorophyll output and divert the pathway into divinyl protochlorophyllide.
      No granularity problem arises — the sub-step BchJ contributes to is precisely what is
      unresolved, so stopping at the pathway term is honest rather than lazy. Retained as core.
    supported_by:
    - reference_id: PMID:7876113
      supporting_text: bchJ-disrupted strains accumulate reduced levels of bacteriochlorophyll
        concomitant with the accumulation of divinyl protochlorophyllide
    - reference_id: file:RHOCB/bchJ/bchJ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR02019; BchJ; 1.
- term:
    id: GO:0030494
    label: bacteriochlorophyll biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:8158642
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. What the cited paper shows for this gene: PMID:8158642 is a systematic directed
      mutational analysis of 12 open reading frames of the R. capsulatus photosynthesis gene
      cluster, whose readout is loss or partial loss of bacteriochlorophyll with accumulation of
      Mg-tetrapyrrole intermediates. That is the assay GO:0030494 and the IMP code both call
      for, and bchJ is one of the cluster's ORFs. The term matches.
    action: ACCEPT
    reason: >-
      CACAO assessment. The cached record is abstract-only and the abstract does not enumerate
      the 12 ORFs, so the exact figure for bchJ cannot be read here; GONUTS, which used to carry
      the per-paper CACAO page, is now permanently retired (gowiki.tamu.edu returns HTTP 410
      "GONUTS has been retired", checked 2026-11-01), so that cross-check is no longer
      available. Under the curator-deference rule this is not grounds to disturb an experimental
      row, and three things make the claim safe independently of the figure. First, the paper's
      scope covers the gene: bchJ (RCAP_rcc00670) sits in the cluster that was mutated ORF by
      ORF. Second, the paper reports exactly one mutant with partial rather than complete loss
      of bacteriochlorophyll, accumulating both bacteriochlorophyll and an intermediate, which
      is the bchJ phenotype the same laboratory characterised in detail the following year
      (PMID:7876113: reduced bacteriochlorophyll plus divinyl protochlorophyllide); bchJ is
      therefore the natural candidate for that mutant, though I state this as an inference
      rather than as something the abstract says. Third, and decisively, the underlying claim —
      that loss of bchJ impairs bacteriochlorophyll biosynthesis — is directly demonstrated in
      PMID:7876113 with both an insertion and a deletion allele, and has been reproduced in
      R. capsulatus and in R. sphaeroides by later groups. Core function. Note that none of the
      contested chemistry touches this row: the superseded 4-vinyl reductase assignment was a
      molecular-function claim, and GOA carries no molecular-function annotation on P26169.
    supported_by:
    - reference_id: PMID:8158642
      supporting_text: In this study we have undertaken a systematic directed mutational
        analysis of 12 open reading frames in the photosynthesis gene cluster to evaluate
        whether individual open reading frames have a role in photopigment biosynthesis.
    - reference_id: PMID:8158642
      supporting_text: One mutation was observed to result in partial disruption of
        bacteriochlorophyll biosynthesis, leading to the accumulation of bacteriochlorophyll as
        well as an intermediate in the biosynthetic pathway.
    - reference_id: PMID:7876113
      supporting_text: we also observed that directed insertion and deletion mutations in bchJ,
        a gene located in the photosynthesis gene cluster, affected the ratio of monovinyl and
        divinyl protochlorophyllide
    - reference_id: PMID:7876113
      supporting_text: bchJ-disrupted strains accumulate reduced levels of bacteriochlorophyll
        concomitant with the accumulation of divinyl protochlorophyllide
- term:
    id: GO:0036070
    label: light-independent bacteriochlorophyll biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00671
  review:
    summary: >-
      The most specific correct process term for this protein, and consistent with the curated
      UniProt pathway assignment. R. capsulatus reduces protochlorophyllide by the dark-operative
      (light-independent) route, and the bchJ phenotype was characterised in exactly that route.
    action: ACCEPT
    reason: >-
      GO:0036070 is a descendant of GO:0030494 (QuickGO, 2026-11-01) differing only in asserting
      the light-independent route, and that assertion is right for this organism: the
      protochlorophyllide reduction step whose substrate pool bchJ mutants perturb is catalysed
      by the dark-operative BchNBL reductase, and PMID:7876113 analysed bchJ alleles in
      combination with a bchL mutation on that basis. The UniPathway-to-GO mapping therefore
      lands on a term both more specific and more informative than the parent. Retained as core
      alongside GO:0030494, which still says something distinct for a reader who does not care
      which reductase route is used.
    supported_by:
    - reference_id: file:RHOCB/bchJ/bchJ-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'PATHWAY: Porphyrin-containing compound metabolism; bacteriochlorophyll
        biosynthesis (light-independent).'
    - reference_id: PMID:7876113
      supporting_text: Mutants of bchJ in combination with a second mutation in bchL still
        produce a mixed pool of monovinyl and divinyl protochlorophyllide
- term:
    id: GO:0046906
    label: tetrapyrrole binding
  evidence_type: IDA
  original_reference_id: PMID:20955518
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. GOA carries no molecular function for P26169 at all, yet the one
      biochemical property that has been demonstrated directly on the purified R. capsulatus
      protein is that it binds a Mg-tetrapyrrole: BchJ binds Mg-protoporphyrin IX and forms a
      ternary complex with it and the magnesium chelatase BchH subunit.
    action: NEW
    reason: >-
      This is a molecular-function row, so the participation test for process terms does not
      apply; what matters is that the activity is the protein's own and was measured on it.
      Sawicki and Willows worked with purified recombinant R. capsulatus BchJ — the gene product
      under review, not an ortholog — and showed both direct binding of Mg-protoporphyrin IX and
      formation of a BchH/BchJ/Mg-protoporphyrin IX ternary complex, with a 1:1 stoichiometry
      inferred from the shift in the chelatase equilibrium. Mg-protoporphyrin IX is a
      metallotetrapyrrole, so GO:0046906 is satisfied directly. It is also the most specific
      available term: checked on QuickGO 2026-11-01, the children of GO:0046906 are only
      chlorophyll binding, heme binding and cobalamin binding, and GO has no
      Mg-protoporphyrin IX binding term. I deliberately do not propose the carrier, scaffold or
      chaperone activity that the same data have been read as supporting — that reading is an
      explicitly open question in the primary literature (see knowledge_gaps), and binding is
      what was actually assayed. The cached record for PMID:20955518 is abstract-only, but the
      abstract states the binding result as a result, not as a proposal.
    supported_by:
    - reference_id: PMID:20955518
      supporting_text: BchJ bound magnesium-protoporphyrin IX or formed a ternary complex with
        BchH and magnesium-protoporphyrin IX.
    - reference_id: PMID:20955518
      supporting_text: Purified recombinant Rhodobacter capsulatus BchJ and BchM were found to
        cause a shift in the equilibrium amount of Mg-protoporphyrin IX formed in a magnesium
        chelatase assay.
core_functions:
- description: >-
    Binding and hand-off of Mg-tetrapyrrole intermediates during light-independent
    bacteriochlorophyll a biosynthesis. BchJ binds Mg-protoporphyrin IX and forms a 1:1 ternary
    complex with the magnesium chelatase BchH subunit, shifting the chelatase equilibrium in the
    way plant GUN4 does, and its loss lowers the effective throughput of the downstream
    chlorophyllide a oxidoreductase; without it the pathway leaks 8-vinyl protochlorophyllide
    and makes less bacteriochlorophyll. The protein is explicitly not the C8-vinyl reductase it
    was once named for, and no catalytic activity has been demonstrated for it, so the core
    function is stated as the binding activity that was measured plus the pathway it serves.
  molecular_function:
    id: GO:0046906
    label: tetrapyrrole binding
  directly_involved_in:
  - id: GO:0036070
    label: light-independent bacteriochlorophyll biosynthetic process
  supported_by:
  - reference_id: PMID:20955518
    supporting_text: BchJ bound magnesium-protoporphyrin IX or formed a ternary complex with
      BchH and magnesium-protoporphyrin IX.
  - reference_id: PMID:20955518
    supporting_text: These results suggest that BchJ may play a role as a general magnesium
      porphyrin carrier, similar to one of the roles of GUN4 in oxygenic organisms.
  - reference_id: PMID:25978726
    supporting_text: These results from the two mutants suggest that BchJ in R. sphaeroides
      facilitates the catalytic activity of only the intrinsic a-COR.
  - reference_id: PMID:7876113
    supporting_text: bchJ-disrupted strains accumulate reduced levels of bacteriochlorophyll
      concomitant with the accumulation of divinyl protochlorophyllide
  knowledge_gaps:
  - gap_statement: >-
      It is not known whether BchJ delivers Mg-tetrapyrroles processively between consecutive
      enzymes, holds them in a multi-enzyme complex, or keeps the downstream enzymes themselves
      in a competent state — i.e. which of carrier, scaffold and chaperone describes the
      hand-off whose loss slows the pathway.
    boundary: >-
      Established: BchJ binds Mg-protoporphyrin IX, forms a ternary complex with BchH, and its
      loss both diverts the pathway to 8-vinyl protochlorophyllide and lowers the apparent
      activity of the intrinsic COR. Not established: any direct measurement of transfer
      between donor and acceptor enzyme, or of a stable multi-enzyme assembly.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    provenance:
    - reference_id: PMID:25978726
      supporting_text: Further investigation is still needed to learn whether the exact function
        of BchJ is as a substrate carrier, a scaffold protein to form tertiary complexes, or a
        chaperon for pigment biosynthesis proteins.
knowledge_gaps:
- gap_statement: >-
    The molecular activity of BchJ is undetermined. It is not the C8-vinyl (divinyl) reductase
    it was named for, and no catalytic reaction has been demonstrated for the purified protein;
    the only measured activity is binding of a Mg-tetrapyrrole, which does not by itself say how
    the protein acts on the pathway.
  boundary: >-
    Firmly established: bchJ is required for efficient bacteriochlorophyll a biosynthesis in
    R. capsulatus, and its disruption reduces bacteriochlorophyll while accumulating 8-vinyl
    (divinyl) protochlorophyllide a; purified R. capsulatus BchJ binds Mg-protoporphyrin IX and
    forms a 1:1 ternary complex with the magnesium chelatase BchH subunit; loss of BchJ in
    R. sphaeroides lowers the effective activity of the intrinsic chlorophyllide a
    oxidoreductase. Firmly excluded: C8-vinyl reductase activity, which belongs to BciA, BciB
    and, in Rhodobacter, COR. The gap is the activity in between.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    BchJ has a dedicated family signature and is conserved across purple and green sulfur
    bacteria, and the whole V4R domain family carries a name derived from the withdrawn
    reductase assignment, so an activity for BchJ would re-anchor the annotation of the family.
    It is also the clearest candidate for a bacterial counterpart of plant GUN4, which would
    make Mg-porphyrin carriage an ancient rather than an oxygenic-phototroph feature.
  resolution: >-
    Direct demonstration of pigment transfer from BchJ to a defined acceptor enzyme, or of a
    stable BchJ-containing multi-enzyme assembly, with a GO molecular-function term coined for
    whichever it turns out to be; a structure of BchJ with a bound Mg-tetrapyrrole would
    constrain the alternatives.
  provenance:
  - reference_id: PMID:25978726
    supporting_text: Thus, the function of BchJ in BChl biosynthesis has been enigmatic.
  - reference_id: PMID:23252506
    supporting_text: there remains no direct evidence for the activity of BchJ as a C8-vinyl
      reductase
  - reference_id: PMID:20955518
    supporting_text: BchJ may play a similar role to Gun4 in Rhodobacter, as it has no currently
      assigned function in the established pathway.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The InterPro2GO route is used twice here with opposite outcomes, which is the point worth
      recording. From the same signature, IPR010249 (the BchJ family, with its own NCBIfam HMM
      TIGR02019), it yields GO:0030494 bacteriochlorophyll biosynthetic process, which is
      exactly right, and GO:0015979 photosynthesis, which reads pigment supply as participation
      in photosynthesis. The method is sound and the family assignment is correct; one of its
      two term mappings for this family is not.
- id: GO_REF:0000041
  title: Gene Ontology annotation based on UniPathway vocabulary mapping
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      UPA00671 maps to GO:0036070, which agrees with the curated UniProt PATHWAY line for this
      entry and is more specific than the InterPro-derived process term. No problem found.
- id: PMID:8158642
  title: Directed mutational analysis of bacteriochlorophyll a biosynthesis in Rhodobacter
    capsulatus.
  full_text_unavailable: true
  findings:
  - statement: >-
      A systematic directed mutational analysis of 12 open reading frames of the Rhodobacter
      capsulatus photosynthesis gene cluster, scoring each for loss of photopigment biosynthesis
      and for accumulation of Mg-tetrapyrrole intermediates. Seven mutants lost
      bacteriochlorophyll biosynthesis outright, one was partially disrupted and accumulated
      both bacteriochlorophyll and an intermediate, and four had no discernible pigment
      phenotype.
    supporting_text: In this study we have undertaken a systematic directed mutational analysis
      of 12 open reading frames in the photosynthesis gene cluster to evaluate whether
      individual open reading frames have a role in photopigment biosynthesis.
    reference_section_type: ABSTRACT
  - statement: >-
      One of the twelve mutants showed partial rather than complete disruption of
      bacteriochlorophyll biosynthesis, accumulating bacteriochlorophyll together with a pathway
      intermediate. This is the phenotype later characterised for bchJ in PMID:7876113, but the
      abstract does not name the gene and the full text is not in the cache, so the
      identification is an inference.
    supporting_text: One mutation was observed to result in partial disruption of
      bacteriochlorophyll biosynthesis, leading to the accumulation of bacteriochlorophyll as
      well as an intermediate in the biosynthetic pathway.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Mol Biol 237:622-640, 1994; DOI 10.1006/jmbi.1994.1260). Cached
      abstract-only, and no open full text is available through Europe PMC or Unpaywall. It is
      the right paper for an IMP on bacteriochlorophyll biosynthesis in this organism: a
      cluster-wide mutational survey whose readout is precisely bacteriochlorophyll loss and
      intermediate accumulation. It is cited by CACAO on four gene products of this cluster
      (bchF P26165, bchE P26168, bchJ P26169, bchM P26236), and that re-use is legitimate
      rather than over-harvesting, because the paper assays each ORF separately; see
      bchJ-notes.md for the full check. GONUTS, which would have carried the per-paper CACAO
      page, is permanently retired as of 2026-11-01 (HTTP 410).
- id: PMID:7876113
  title: Altered monovinyl and divinyl protochlorophyllide pools in bchJ mutants of Rhodobacter
    capsulatus. Possible monovinyl substrate discrimination of light-independent
    protochlorophyllide reductase.
  full_text_unavailable: true
  findings:
  - statement: >-
      Directed insertion and deletion mutations in R. capsulatus bchJ reduce bacteriochlorophyll
      levels and cause accumulation of divinyl protochlorophyllide, skewing the
      monovinyl:divinyl ratio of the pathway intermediate pool.
    supporting_text: bchJ-disrupted strains accumulate reduced levels of bacteriochlorophyll
      concomitant with the accumulation of divinyl protochlorophyllide
    reference_section_type: ABSTRACT
  - statement: >-
      The authors read the altered monovinyl:divinyl ratio as identifying bchJ as the gene
      responsible for divinyl-to-monovinyl conversion, the basis of the later 4-vinyl / C8-vinyl
      reductase designation. This interpretation has been superseded: the reduction is catalysed
      by BciA, BciB and, in Rhodobacter, by chlorophyllide a oxidoreductase, and bchJ mutants in
      two other species still make C8-ethyl pigment.
    supporting_text: These results thus identify bchJ as the first sequenced gene that affects
      the divinyl to monovinyl ratio of photopigment intermediates in any photosynthetic
      organism.
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:17148453
      - PMID:23252506
      review_notes: >-
        The mutant phenotype itself has been reproduced repeatedly and is not in question; what
        was overturned is the inference from it to a vinyl-reductase activity. The pathway-level
        claim that this review accepts on GO:0030494 therefore stands on the part of this paper
        that held.
      supported_by:
      - reference_id: PMID:17148453
        supporting_text: The results suggest that BchJ may play an important role in substrate
          channeling and/or regulation of Chl biosynthesis but show that it is not a vinyl
          reductase.
      - reference_id: PMID:23252506
        supporting_text: there remains no direct evidence for the activity of BchJ as a C8-vinyl
          reductase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Biol Chem 270:3732-3740, 1995). Cached abstract-only. The only paper
      that characterises R. capsulatus bchJ alleles directly, and the source of the
      bchJ-disruption phenotype on which the GO:0030494 claim rests. Its mechanistic conclusion
      is overturned (recorded as a finding_review above), its phenotype is not. Importantly for
      this review, the authors used a deletion as well as an insertion allele, which weakens a
      purely polar explanation of the phenotype.
- id: PMID:17148453
  title: Characterization of a plant-like protochlorophyllide a divinyl reductase in green sulfur
    bacteria.
  full_text_unavailable: true
  findings:
  - statement: >-
      Insertional inactivation of both candidate genes in Chlorobium tepidum assigns C-8 divinyl
      reductase activity to CT1063 (renamed bciA) and not to bchJ; recombinant BciA reduces the
      C-8 vinyl group of 3,8-divinyl-protochlorophyllide in vitro using NADPH.
    supporting_text: These data demonstrate that CT1063, renamed bciA, encodes a C-8 divinyl
      reductase in C. tepidum.
    reference_section_type: ABSTRACT
  - statement: >-
      The C. tepidum bchJ mutant still makes C-8-reduced chlorophyll and bacteriochlorophylls
      while secreting divinyl protochlorophyllide, so BchJ cannot be the reductase; the authors
      propose substrate channelling or regulation instead.
    supporting_text: The bchJ mutant produces detectable amounts of Chl a(PD), BChl a(P), and
      BChl c(F), all of which have reduced C-8 substituents, but the mutant cells secrete large
      amounts of 3,8-divinyl-protochlorophyllide a into the growth medium and have a greatly
      reduced BChl c(F) content.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Biol Chem 282:2967-2975, 2007). Cached abstract-only; no open full
      text. The paper that withdrew the vinyl-reductase assignment. It works in Chlorobium
      tepidum, not R. capsulatus, so it is evidence about the family's chemistry rather than
      about this gene product's phenotype, and I have used it only for that.
- id: PMID:23252506
  title: Identification of an 8-vinyl reductase involved in bacteriochlorophyll biosynthesis in
    Rhodobacter sphaeroides and evidence for the existence of a third distinct class of the
    enzyme.
  full_text_unavailable: true
  findings:
  - statement: >-
      In Rhodobacter sphaeroides, deletion of bchJ and/or rsp_3070 still leaves C8-ethyl
      bacteriochlorophyll synthesis intact, and in a cyanobacterial C8-vinyl reductase mutant
      rsp_3070 restores wild-type C8-ethyl chlorophyll a whereas bchJ does not. The authors
      conclude there is no direct evidence that BchJ is a C8-vinyl reductase.
    supporting_text: R. sphaeroides rsp_3070 was able to restore synthesis of the WT (wild-type)
      C8-ethyl chlorophyll a in the mutant, whereas bchJ did not.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Biochem J 450:397-405, 2013). Cached abstract-only. The heterologous
      complementation test is the cleanest single refutation of the reductase assignment, since
      it asks the gene to perform the activity in a background that needs it. It is a sister
      species, so it bears on the family claim rather than on this gene's own phenotype.
- id: PMID:25978726
  title: Rhodobacter sphaeroides mutants overexpressing chlorophyllide a oxidoreductase of
    Blastochloris viridis elucidate functions of enzymes in late bacteriochlorophyll
    biosynthetic pathways.
  findings:
  - statement: >-
      Pathway membership for BchJ is not in dispute even though the mechanism is: the authors
      state plainly that BchJ is involved in bacteriochlorophyll biosynthesis by an unclear
      route, and that its function has been enigmatic since the vinyl-reductase assignment
      lapsed.
    supporting_text: BchJ is known to be involved in BChl biosynthesis, although how is still
      unclear.
    reference_section_type: INTRODUCTION
  - statement: >-
      An exogenous Blastochloris viridis BchYZ competes on equal terms with the intrinsic
      Rhodobacter COR only when BchJ is absent, which the authors read as BchJ raising the
      effective catalytic throughput of the intrinsic enzyme; whether that is carriage,
      scaffolding or chaperoning is left open.
    supporting_text: These results from the two mutants suggest that BchJ in R. sphaeroides
      facilitates the catalytic activity of only the intrinsic a-COR.
    reference_section_type: RESULTS
  - statement: >-
      In Rhodobacter the 8-vinyl reduction is carried by chlorophyllide a oxidoreductase, which
      is why deleting bciA and bchJ does not abolish C8-ethyl pigment.
    supporting_text: This suggests that the intrinsic a-COR present in the double mutant works
      as DVR
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Sci Rep 5:9741, 2015; PMC4432870). The only cited paper with full text in
      the cache, and the most recent substantive treatment of BchJ's function that I could find.
      Worked in R. sphaeroides, so its mutant results are about the ortholog; I have used it for
      the family-level reassignment, for the COR-enhancement observation, and for the field's own
      statements of ignorance, not as evidence about the R. capsulatus protein's phenotype.
