id: P18079
gene_symbol: hemA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272942
  label: Rhodobacter capsulatus SB 1003
description: >-
  HemA is the 5-aminolevulinate synthase (ALAS) of the purple non-sulfur photosynthetic bacterium
  Rhodobacter capsulatus. This pyridoxal 5'-phosphate (PLP)-dependent enzyme of the
  class-II aminotransferase fold condenses glycine with succinyl-CoA to form 5-aminolevulinate,
  CO2 and CoA (the Shemin route). 5-Aminolevulinate is the first common precursor of all
  tetrapyrroles, including heme and bacteriochlorophyll. HemA is the only ALAS of R. capsulatus,
  and an insertion mutant needs added 5-aminolevulinate to grow. The enzyme is a homodimer whose
  active sites are built from both subunits, with PLP held as a Schiff base on Lys248. Its crystal
  structures with PLP, glycine and succinyl-CoA are the main structural model for the human ALAS
  isozymes and for mutations that cause X-linked sideroblastic anemia.
