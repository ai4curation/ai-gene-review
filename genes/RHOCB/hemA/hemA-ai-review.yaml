        (PLP)-dependent manner.
- term:
    id: GO:0006783
    label: heme biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000343738
  review:
    summary: >-
      TreeGrafter assignment (PANTHER node PTN000343738) placing HemA in heme biosynthesis. ALAS
      catalyses the first step of heme biosynthesis in alpha-proteobacteria, and HemA is the only
      ALAS of R. capsulatus.
    action: ACCEPT
    reason: >-
      HemA performs the first catalytic step of heme synthesis in this organism (the product,
      5-aminolevulinate, is converted to heme by the downstream enzymes), so it does part of the
      work of the process. The insertion mutant cannot make 5-aminolevulinate, and no second ALAS
      exists. GO:0006783 is defined as "The chemical reactions and pathways resulting in the
      formation of heme ... from less complex precursors", which includes the
      glycine/succinyl-CoA entry step. The heme end product in this bacterium is mainly protoheme
      (heme b) for cytochromes, but GOA carries no heme-B row to refine to, and the general term is
      kept as the pathway-level claim.
    supported_by:
    - reference_id: PMID:16121195
      supporting_text: >-
        5-Aminolevulinate synthase (ALAS) is the first and rate-limiting enzyme of heme
        biosynthesis in humans, animals, other non-plant eukaryotes, and alpha-proteobacteria.
    - reference_id: PMID:2381418
      supporting_text: >-
        Introduction of a plasmid, containing the hemA gene of R. capsulatus on the 3.9 kb
        HindIII fragment, restored ALA-independent growth of the mutant indicating that there is
        only one gene for ALA biosynthesis in R. capsulatus.
