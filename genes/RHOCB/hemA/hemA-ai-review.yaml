    summary: >-
      InterPro2GO mapping from the tetrapyrrole-biosynthesis ALAS signature (IPR010961). In
      R. capsulatus 5-aminolevulinate made by HemA is the common precursor of heme and of
      bacteriochlorophyll.
    action: ACCEPT
    reason: >-
      Correct and informative for a photosynthetic bacterium. HemA performs the first step of the
      common tetrapyrrole trunk that branches to heme and to bacteriochlorophyll, so the
      tetrapyrrole-level term captures a real breadth of role that the heme term alone does not.
      Kept beside the heme biosynthetic process row rather than marked too general.
