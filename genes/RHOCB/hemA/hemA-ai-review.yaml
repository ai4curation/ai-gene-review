        It catalyzes the synthesis of 5-aminolevulinic acid, the first common precursor of all
        tetrapyrroles, from glycine and succinyl-coenzyme A (sCoA) in a pyridoxal 5'-phosphate
        (PLP)-dependent manner.
core_functions:
- description: >-
    HemA catalyses the PLP-dependent condensation of glycine and succinyl-CoA to 5-aminolevulinate,
    CO2 and CoA, the first committed step of tetrapyrrole (heme and bacteriochlorophyll)
    biosynthesis in R. capsulatus. It is a homodimer with PLP bound in each shared active site.
  molecular_function:
