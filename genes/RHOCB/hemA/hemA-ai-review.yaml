    id: GO:0003870
    label: 5-aminolevulinate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010961
  - RHEA:12921
  - EC:2.3.1.37
  - PANTHER:PTN000343738
  review:
    summary: >-
      Combined electronic assignment (EC 2.3.1.37, RHEA:12921, ALAS-specific InterPro
      IPR010961) of the defining activity of R. capsulatus HemA. The purified recombinant
      enzyme has high ALAS specific activity, and crystal structures show glycine and
      succinyl-CoA bound in the PLP active site.
    action: ACCEPT
    reason: >-
      Correct and as specific as warranted; this is the core molecular function. It is directly
      supported by enzyme assays on the purified R. capsulatus protein and by the substrate-complex
      crystal structures, and genetically by the ALA auxotrophy of the hemA insertion mutant.
    supported_by:
    - reference_id: PMID:24793767
      supporting_text: >-
        The Rhodobacter capsulatus hemA gene, which encodes 5-aminolevulinic acid synthase
        (ALAS), was expressed in Escherichia coli Rosetta (DE3) and the enzymatic properties of
        the purified recombinant ALAS (RC-ALAS) were studied.
    - reference_id: PMID:24793767
      supporting_text: the specific activity of RC-ALAS reached 198.2 U/mg
    - reference_id: PMID:16121195
      supporting_text: >-
        It catalyzes the synthesis of 5-aminolevulinic acid, the first common precursor of all
