proposed_new_terms:
- proposed_name: 3-vinyl bacteriochlorophyllide a hydratase activity
  proposed_definition: >-
    Catalysis of the reaction: 3-vinyl bacteriochlorophyllide a + H2O =
    3-(1-hydroxyethyl)bacteriochlorophyllide a. The enzyme also acts on chlorophyllide
    a to give 3-(1-hydroxyethyl)chlorophyllide a, and the reaction is reversible.
  justification: >-
    GO has no term for the reaction catalysed by the BchF family (EC 4.2.1.165), even
    though the term for the next step of the same pathway exists (GO:0036354
    bacteriochlorophyllide-a dehydrogenase activity, the BchC activity). A QuickGO
    search for "bacteriochlorophyllide" returns only GO:0036354, and GO:0016836
    hydro-lyase activity has no child covering this reaction (checked 2026-11-01). As a
    result every BchF protein in GOA sits at the generic hydro-lyase parent. Suggested
    mappings: EC 4.2.1.165, MetaCyc MONOMER-13252, BRENDA 4.2.1.165.
  proposed_parent:
    id: GO:0016836
    label: hydro-lyase activity
  supported_by:
  - reference_id: PMID:36822492
    supporting_text: BchF and BchV enzymes catalyze the hydration of a C3-vinyl to
      C3-1-hydroxyethyl group
    reference_section_type: ABSTRACT
  - reference_id: PMID:36822492
    supporting_text: >-
      The results indicated that both BchF and BchV did function as a
      hydratase/dehydratase and could play a role in the C31-epimerization.
    reference_section_type: ABSTRACT
  - reference_id: PMID:28643169
    supporting_text: >-
      Biosynthesis of chlorosomal pigments involves stereoselective conversion of
      3-vinyl group to 3-(1-hydroxyethyl) group facilitated by a 3-vinyl hydratase.
    reference_section_type: ABSTRACT
  - reference_id: PMID:8385667
    supporting_text: >-
