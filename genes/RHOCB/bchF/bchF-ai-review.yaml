- term:
    id: GO:0030494
    label: bacteriochlorophyll biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:8158642
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. The cited paper is a genuine, cluster-wide mutational analysis of the
      R. capsulatus photosynthesis gene cluster and the claim it is used for is
      correct, so the row stands; it is refined to the light-independent child term for
      the same reason as the IEA row carrying this term.
    action: MODIFY
    reason: >-
      What the paper shows for this gene: PMID:8158642 constructed directed mutations
      in twelve open reading frames of the 46 kb R. capsulatus photosynthesis gene
      cluster, of which seven lost bacteriochlorophyll biosynthesis with accumulation
      of specific Mg-tetrapyrrole intermediates. The cached record is abstract-only
      (full_text_available: false) and the abstract names no individual open reading
      frame, so bchF's inclusion cannot be read off it; it is corroborated
      independently, because PMID:36971575 states that deletion of bchF in R.
      sphaeroides and R. capsulatus causes accumulation of chlorophyllide a and 3-vinyl
      bacteriochlorophyllide a and cites this paper's DOI (10.1006/jmbi.1994.1260,
      reference 3 of its Crossref reference list) among its sources for that
      statement. That phenotype - loss of bacteriochlorophyll with accumulation of the
      unhydrated precursor - is exactly what an IMP for bacteriochlorophyll
      biosynthesis on a 3-vinyl hydratase should rest on, and it agrees with the
      independent transposon-mutant assignment of bchF in PMID:8385667. The term
      matches the claim; it is simply one level general, and GO:0036070 is supported
      because the pathway runs in the dark in this organism. GONUTS could not be
      consulted (see below), so the judgement is made from the literature; per the
      curator-deference rule no REMOVE was considered on an abstract alone, and none is
      warranted. On the batch-3 screen that selected this gene: the four CACAO rows
      citing PMID:8158642 span NCBITaxon:272942 (bchF, bchE, bchJ, all _RHOCB entries
      on the SB1003 genome) and NCBITaxon:1061 (bchM, the legacy species-level
      BCHM_RHOCA entry). Both ids denote Rhodobacter capsulatus, 1061 is the species
      node above the 272942 strain node, and the paper worked in R. capsulatus, so no
      isolate boundary is crossed and no locus mismatch exists; the split is UniProt
      entry granularity, not an annotation defect, and nothing is reportable against
      CACAO. GONUTS (gowiki.tamu.edu) was retried on 2026-11-01 and now returns HTTP
      410 Gone with the notice "GONUTS has been retired"; the Wayback availability API
      has no snapshot of the relevant protein or paper pages, so that route is
      permanently closed rather than temporarily offline.
    proposed_replacement_terms:
    - id: GO:0036070
      label: light-independent bacteriochlorophyll biosynthetic process
    additional_reference_ids:
    - PMID:36971575
    - PMID:8385667
    supported_by:
    - reference_id: PMID:8158642
      supporting_text: >-
        mutations constructed in seven open reading frames resulted in a loss of
        bacteriochlorophyll biosynthesis, concomitant with the accumulation of specific
        intermediates in the Mg-tetrapyrrole biosynthetic pathway
      reference_section_type: ABSTRACT
    - reference_id: PMID:36971575
      supporting_text: >-
        Deletion of bchF in Rhodobacter sphaeroides and Rhodobacter capsulatus results
        in the accumulation of Chlide a and 3V-Bchlide a
      reference_section_type: INTRODUCTION
    - reference_id: PMID:8385667
      supporting_text: >-
        The pigments accumulated in strains with physically mapped transposon insertion
        mutations are analyzed by absorbance and fluorescence spectroscopy, allowing us
        to assign the genes as bchF, bchN, bchB, and bchH, in that order.
      reference_section_type: ABSTRACT
