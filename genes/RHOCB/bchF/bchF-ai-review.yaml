  knowledge_gaps:
  - gap_statement: >-
      Which substrate BchF actually hydrates in vivo - chlorophyllide a before
      chlorophyllide a reductase (BchXYZ) acts, or 3-vinyl bacteriochlorophyllide a
      after it - is undetermined, and so is whether the two routes are used in
      parallel or one is preferred.
    boundary: >-
      The chemistry is settled (hydration of the C-3 vinyl group to a
      3-(1-hydroxyethyl) group, shown in vitro for family members and genetically in
      R. capsulatus), and the product is settled (the substrate of BchC). What is not
      settled is the order of the hydration and the C-7/C-8 reduction in the cell.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      The branch order determines which intermediate accumulates in each mutant and
      whether BchF and BchXYZ channel substrate between them; it also decides whether
      the enzyme's physiological substrate is a chlorin or a bacteriochlorin, which
      bears on the stereochemistry of the product.
    resolution: >-
      Steady-state kinetics of purified R. capsulatus BchF on chlorophyllide a versus
      3-vinyl bacteriochlorophyllide a, combined with pulse labelling of intermediates
      in wild-type and bchXYZ/bchF mutant backgrounds.
