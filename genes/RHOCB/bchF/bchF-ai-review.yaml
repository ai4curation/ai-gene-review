    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Is R. capsulatus BchF an integral membrane protein, and if so what is the topology
    and which side of the membrane holds the active site? The sequence is strongly
    hydrophobic over roughly residues 30-165, BchF is usually discussed as
    membrane-bound, yet UniProt asserts no transmembrane feature for P26165 and GOA
    carries no cellular-component annotation at all.
  experts:
  - Jiro Harada
  - Hitoshi Tamiaki
- question: >-
    In the cell, does BchF act on chlorophyllide a before chlorophyllide a reductase
    (BchXYZ) or on 3-vinyl bacteriochlorophyllide a after it, and do the two enzymes
    channel substrate between them?
  experts:
  - Jiro Harada
  - Yusuke Tsukatani
- question: >-
    Given that BchF runs the hydration reversibly in vitro, is the reverse
    (dehydratase) direction physiologically relevant in a purple bacterium, for example
    during bacteriochlorophyll turnover or under oxidative stress?
  experts:
  - Hitoshi Tamiaki
suggested_experiments:
- hypothesis: >-
    R. capsulatus BchF is a catalytically autonomous 3-vinyl hydratase whose preferred
    substrate determines the order of the hydration and C-7/C-8 reduction steps in
    vivo.
  description: >-
    Express R. capsulatus bchF in E. coli, as was done for the Chlorobaculum tepidum
    orthologue, and assay the detergent-solubilised enzyme on chlorophyllide a and on
    3-vinyl bacteriochlorophyllide a, measuring steady-state kinetics and the
    stereochemistry of the 3-(1-hydroxyethyl) product by chiral HPLC. This would give
    the first direct enzymology on the R. capsulatus protein, whose activity is at
    present inferred from mutant pigment phenotypes and orthologue assays, and would
    settle the substrate preference.
  experiment_type: heterologous expression and in vitro enzyme assay
- hypothesis: >-
    BchF is an integral membrane protein of the cytoplasmic membrane, so its reaction
    occurs at the membrane where the downstream enzymes BchC, BchG and BchP also act.
  description: >-
    Determine the subcellular distribution and topology of BchF in R. capsulatus by
    fractionating cells into soluble and membrane fractions and immunoblotting for an
    epitope-tagged BchF, then map the topology by cysteine-accessibility (substituted
    cysteine scanning with a membrane-impermeant thiol reagent) or by dual
    PhoA/LacZ reporter fusions at successive positions. A positive result would let a
    cellular-component annotation be made for a protein that currently has none.
  experiment_type: subcellular fractionation and membrane topology mapping
- hypothesis: >-
    bchF of R. capsulatus is functionally interchangeable with the 3-vinyl hydratases
    of distant chlorophototrophs.
  description: >-
    Complement a defined R. capsulatus bchF deletion with bchF or bchV from
    Chlorobaculum tepidum, Chloroflexus aurantiacus and Chloracidobacterium
    thermophilum, and score restoration of bacteriochlorophyll a and of
    photoheterotrophic growth together with the pigment profile by HPLC. This tests
    whether the in vitro activities reported for those orthologues correspond to the
    physiological step in a purple bacterium, and whether any of them instead yields
    the epimeric product.
  experiment_type: cross-species genetic complementation with pigment analysis
