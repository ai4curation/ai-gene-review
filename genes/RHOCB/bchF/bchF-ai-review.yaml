id: P26165
gene_symbol: bchF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272942
  label: Rhodobacter capsulatus SB 1003
description: >-
  bchF encodes the 3-vinyl (bacterio)chlorophyllide a hydratase of the purple
  non-sulfur bacterium Rhodobacter capsulatus, a small (171-residue), strongly
  hydrophobic enzyme encoded in the 46 kb photosynthesis gene cluster next to bchN,
  bchB and bchH. It catalyses one step of the bacteriochlorophyll a-specific branch
  of chlorophyll metabolism: addition of water across the C-3 vinyl group of
  chlorophyllide a or of 3-vinyl bacteriochlorophyllide a to give the
  3-(1-hydroxyethyl) intermediate, which the dehydrogenase BchC then oxidises to the
  3-acetyl group that distinguishes bacteriochlorophyll a from chlorophyll a. The
  pathway it serves operates independently of light, since protochlorophyllide
  reduction in these bacteria is carried out by the dark-operative BchLNB enzyme.
  Transposon-insertion and directed deletion mutants of bchF lose bacteriochlorophyll
  a and accumulate the unhydrated precursors chlorophyllide a and 3-vinyl
  bacteriochlorophyllide a, the latter of which can still be phytylated and
  assembled into pigment-protein complexes. Purified orthologues from green sulfur
  and other chlorophototrophic bacteria hydrate the C-3 vinyl group in vitro and run
  the reaction reversibly, so the family is a genuine, stereoselective
  hydratase/dehydratase rather than a structural component of the pathway. The
  protein itself has not been purified from R. capsulatus and its membrane topology
  is undetermined.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      The InterPro2GO mapping file assigns three GO terms to IPR009905 (2-vinyl
      bacteriochlorophyllide hydratase): GO:0016836 hydro-lyase activity, GO:0030494
      bacteriochlorophyll biosynthetic process, and GO:0019685 photosynthesis, dark
      reaction. The first two fit the family; the third does not, because GO:0019685
      is the Calvin cycle and not the light-independent segment of the
      bacteriochlorophyll pathway. All four InterPro2GO rules that use GO:0019685 are
      light-independent (bacterio)chlorophyll-synthesis families, and QuickGO reports
      that all 3,731 GOA annotations to GO:0019685 cite GO_REF:0000002, so every use
      of the term in GOA descends from this one misreading (checked 2026-11-01).
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      The GO_REF itself is a valid method reference; the defect is in one of the three
      IPR009905 mappings it delivers (GO:0019685), recorded as a source_defect on that
      annotation row.
- id: GO_REF:0000041
  title: Gene Ontology annotation based on UniPathway vocabulary mapping
  findings:
  - statement: >-
      UniProt maps the bchF entry to UniPathway UPA00671, porphyrin-containing
      compound metabolism / bacteriochlorophyll biosynthesis (light-independent),
      which yields GO:0036070. The pathway assignment agrees with the genetics: in
      R. capsulatus protochlorophyllide reduction is carried out in the dark by
      BchL/BchN/BchB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Method reference verified against the entry's own PATHWAY line and against
      PMID:8385667, which shows the pathway runs in the dark in this organism.
- id: PMID:8158642
  title: Directed mutational analysis of bacteriochlorophyll a biosynthesis in Rhodobacter
    capsulatus.
  findings:
  - statement: >-
      A systematic directed mutational analysis of twelve open reading frames of the
      R. capsulatus 46 kb photosynthesis gene cluster. Mutations in seven of them
      abolished bacteriochlorophyll biosynthesis and caused accumulation of specific
      Mg-tetrapyrrole intermediates; four had no discernible pigment phenotype and one
      was partially disrupted. The cached record is abstract-only, and the abstract
      names no individual open reading frame.
    supporting_text: >-
      we have undertaken a systematic directed mutational analysis of 12 open reading
      frames in the photosynthesis gene cluster to evaluate whether individual open
      reading frames have a role in photopigment biosynthesis
    reference_section_type: ABSTRACT
  - statement: >-
      That bchF is among the open reading frames mutated, and that its disruption
      causes accumulation of chlorophyllide a and 3-vinyl bacteriochlorophyllide a,
      is established indirectly: a 2023 study cites this paper (DOI
      10.1006/jmbi.1994.1260, reference 3 of its Crossref reference list) as a source
      for the R. capsulatus bchF deletion phenotype.
    supporting_text: >-
      mutations constructed in seven open reading frames resulted in a loss of
      bacteriochlorophyll biosynthesis, concomitant with the accumulation of specific
      intermediates in the Mg-tetrapyrrole biosynthetic pathway
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Bollivar, Suzuki, Beatty, Dobrowolski & Bauer, J Mol Biol
      237:622-640, 1994). This is a cluster-wide mutational analysis of the R.
      capsulatus photosynthesis gene cluster, so its use by several bch gene
      annotations from one paper is appropriate rather than over-harvesting. The
      cached record is abstract-only, so the identity of the individual mutants cannot
      be read directly; PMID:36971575 cites this DOI for the R. capsulatus bchF
      deletion phenotype, which corroborates that bchF was among them.
- id: PMID:8385667
  title: bchFNBH bacteriochlorophyll synthesis genes of Rhodobacter capsulatus and
    identification of the third subunit of light-independent protochlorophyllide reductase
    in bacteria and plants.
  findings:
  - statement: >-
      This is the paper that defined the bchF locus. Pigments accumulated by strains
      carrying physically mapped transposon insertions were analysed spectroscopically
      and used to assign bchF, bchN, bchB and bchH, and bchF was identified as the
      bacteriochlorophyll a-specific enzyme that adds water across the vinyl group at
      the position now numbered C-3.
    supporting_text: >-
      bchF encodes a bacteriochlorophyll alpha-specific enzyme that adds water across
      the 2-vinyl group.
    reference_section_type: ABSTRACT
  - statement: >-
      The pathway bchF serves runs in the dark in this organism: protochlorophyllide
      reduction is carried out by BchN, BchB and BchL rather than by a
      light-dependent reductase.
    supporting_text: bchN and bchB are required for protochlorophyllide reduction in
      the dark (along with bchL)
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; it is reference [1] of the UniProt entry for P26165 and the
      source of the gene's name and sequence. It is the strongest R. capsulatus-specific
      evidence for bchF function and is cited by no GOA row for this protein.
- id: PMID:36971575
  title: The Photoactive Photosynthetic Reaction Center of a Rhodobacter sphaeroides
    Mutant Lacking 3-Vinyl (Bacterio)Chlorophyllide a Hydratase Contains 3-Vinyl Bacteriochlorophyll
    a.
  findings:
  - statement: >-
      Places BchF in the bacteriochlorophyll a pathway as the 3-vinyl
      (bacterio)chlorophyllide a hydratase, acting either on 3-vinyl
      bacteriochlorophyllide a after chlorophyllide a reductase or on chlorophyllide a
      before it, with BchC oxidising the resulting 3-(1-hydroxyethyl) group to the
      3-acetyl group of bacteriochlorophyllide a.
    supporting_text: >-
      followed by hydration of the 3V group to the 3-hydroxyethyl (3HE) group of
      3HE-Bchlide a by 3-vinyl (bacterio)chlorophyllide a [3V-(B)Chlide a] hydratase
      (BchF)
    reference_section_type: INTRODUCTION
  - statement: >-
      States the bchF deletion phenotype for both Rhodobacter species, citing (as its
      references 2-4) Bollivar et al. 1994 for the R. capsulatus result.
    supporting_text: >-
      Deletion of bchF in Rhodobacter sphaeroides and Rhodobacter capsulatus results
      in the accumulation of Chlide a and 3V-Bchlide a
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Primary data are on R. sphaeroides, but the introduction states
      the R. capsulatus bchF phenotype and cites PMID:8158642 for it; the citation was
      checked against the Crossref reference list of 10.1128/spectrum.03878-22, whose
      reference 3 is 10.1006/jmbi.1994.1260.
- id: PMID:36822492
  title: 'In vitro reversible dehydration in C3-substituents of zinc chlorophyll analogs
    by BchF and BchV enzymes: Stereoselectivity and substrate specificity in the dehydration.'
  findings:
  - statement: >-
      Direct enzymology on the BchF family: recombinant BchF (and its paralogue BchV)
      from Chlorobaculum tepidum, expressed in E. coli, catalyses hydration of the
      C3-vinyl group to a C3-1-hydroxyethyl group and runs the reaction in reverse,
      establishing the family as a stereoselective hydratase/dehydratase.
    supporting_text: BchF and BchV enzymes catalyze the hydration of a C3-vinyl to
      C3-1-hydroxyethyl group
    reference_section_type: ABSTRACT
  - statement: >-
      The assays were done on proteins from Chlorobaculum tepidum, not from
      Rhodobacter capsulatus, so this is orthologue-level rather than species-level
      evidence.
    supporting_text: obtained from extracts of Escherichia coli overexpressing the
      respective genes from Chlorobaculum tepidum
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Relevant as family-level enzymological grounding for the
      hydratase activity; the protein assayed is the C. tepidum orthologue.
- id: PMID:28643169
  title: In vitro enzymatic assays of photosynthetic bacterial 3-vinyl hydratases for
    bacteriochlorophyll biosyntheses.
  findings:
  - statement: >-
      Paralogous 3-vinyl hydratases from Chlorobaculum tepidum, Chlorobaculum
      limnaeum, Chloroflexus aurantiacus and Chloracidobacterium thermophilum were all
      shown to be active hydratases in vitro, and the same 3-vinyl hydration step is
      identified as part of bacteriochlorophyll a biosynthesis.
    supporting_text: All the hydratases showed hydration activities.
    reference_section_type: ABSTRACT
  - statement: >-
      The 3-vinyl hydration carried out by this enzyme family precedes the oxidation
      that installs the 3-acetyl group of bacteriochlorophyll a.
    supporting_text: >-
      This 3-vinyl hydration also occurs in BChl a biosynthesis, followed by oxidation
      that introduces an acetyl group at the 3-position.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Breadth evidence that the 3-vinyl hydratase family is
      catalytically active across chlorophototroph lineages.
- id: file:genes/RHOCB/bchF/bchF-uniprot.txt
  title: UniProt record for Rhodobacter capsulatus SB1003 bchF (P26165)
  findings:
  - statement: >-
      The entry assigns P26165 to the BchF family by three independent signatures
      (NCBIfam TIGR02020, Pfam PF07284, InterPro IPR009905) and places it in the
      light-independent bacteriochlorophyll biosynthesis pathway.
    supporting_text: 'NCBIfam; TIGR02020; BchF; 1.'
    record_section:
    - DR:NCBIfam
  - statement: >-
      Protein existence is at the prediction level: no experiment on the P26165
      protein itself is recorded, and the entry carries no CC FUNCTION, no catalytic
      activity, and no transmembrane features despite the sequence being strongly
      hydrophobic.
    supporting_text: 'PE   4: Predicted;'
    record_section:
    - PE
existing_annotations:
- term:
    id: GO:0016836
    label: hydro-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009905
  review:
    summary: >-
      Right enzyme class, but at the top of the hydro-lyase hierarchy. The reaction
      the BchF family performs is specifically hydration of the C-3 vinyl group of
      (bacterio)chlorophyllide a (EC 4.2.1.165), and GO has no term for it, so the
      replacement has to be a new term request.
    action: MODIFY
    reason: >-
      The IEA rests on family membership, which is well supported here by three
      independent signatures (NCBIfam TIGR02020 BchF, Pfam PF07284, InterPro
      IPR009905), and the chemistry of the family is established: recombinant BchF
      from Chlorobaculum tepidum hydrates a C3-vinyl group to a C3-1-hydroxyethyl
      group in vitro and runs the reaction reversibly (PMID:36822492), and the same
      activity was confirmed for 3-vinyl hydratases from four chlorophototroph
      lineages (PMID:28643169). For R. capsulatus itself, transposon-insertion mutants
      identified bchF as the enzyme that adds water across the vinyl group
      (PMID:8385667). So the hydro-lyase claim is true but far less specific than the
      evidence supports. No is_a child of GO:0016836 fits: a QuickGO search for
      "bacteriochlorophyllide" returns only GO:0036354, which is the activity of the
      NEXT enzyme (BchC, the 3-(1-hydroxyethyl) dehydrogenase), and no hydratase term
      for this reaction exists (checked 2026-11-01). The replacement is therefore the
      NTR filed in proposed_new_terms. Note the term is right on the chemistry and is
      not a neighbouring step's term: the preceding step is a reduction by BchXYZ and
      the following step an NAD-dependent oxidation by BchC, neither of them a
      hydro-lyase.
    proposed_replacement_terms:
    - id: NTR
      label: 3-vinyl bacteriochlorophyllide a hydratase activity
    supported_by:
    - reference_id: PMID:8385667
      supporting_text: >-
        bchF encodes a bacteriochlorophyll alpha-specific enzyme that adds water
        across the 2-vinyl group.
      reference_section_type: ABSTRACT
    - reference_id: PMID:36822492
      supporting_text: >-
        The results indicated that both BchF and BchV did function as a
        hydratase/dehydratase and could play a role in the C31-epimerization.
      reference_section_type: ABSTRACT
    - reference_id: file:genes/RHOCB/bchF/bchF-uniprot.txt
      supporting_text: 'Pfam; PF07284; BCHF; 1.'
      record_section:
      - DR:Pfam
- term:
    id: GO:0019685
    label: photosynthesis, dark reaction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR009905
  review:
    summary: >-
      Wrong term, reached through a homonym. GO:0019685 "photosynthesis, dark reaction"
      is the Calvin cycle - the reduction of carbon dioxide to sugar - and bchF has no
      role in carbon fixation. The InterPro2GO rule evidently read the family's
      "light-independent" pathway as GO's "dark reaction".
    action: REMOVE
    reason: >-
      The GO definition of GO:0019685 is "A complex cycle of enzyme-mediated reactions
      which catalyzes the reduction of carbon dioxide to sugar... The reduced NADP
      (NADPH) and ATP are produced by the 'light' reactions" (QuickGO, 2026-11-01).
      BchF hydrates the C-3 vinyl group of a Mg-tetrapyrrole (PMID:36971575,
      PMID:8385667); it neither fixes carbon nor participates in a cycle that does.
      This is a demonstrably wrong electronic mapping rather than an over-propagated
      but defensible inference, which is the sanctioned ground for REMOVE on an IEA
      row. The cause is visible in the InterPro entry's own text, which describes
      IPR009905 as involved in the light-independent bacteriochlorophyll biosynthesis
      pathway, and the error is systematic: all four InterPro2GO rules that emit
      GO:0019685 are light-independent (bacterio)chlorophyll-synthesis families
      (IPR005969, IPR005970, IPR005971, IPR009905), and QuickGO reports 3,731
      annotations to GO:0019685 of which all 3,731 cite GO_REF:0000002 - i.e. every
      GOA use of this Calvin-cycle term descends from this one misreading. The correct
      term for this family is GO:0036070, which the gene already carries from
      UniPathway, so nothing is lost by removing the row.
    supported_by:
    - reference_id: PMID:36971575
      supporting_text: >-
        followed by hydration of the 3V group to the 3-hydroxyethyl (3HE) group of
        3HE-Bchlide a by 3-vinyl (bacterio)chlorophyllide a [3V-(B)Chlide a] hydratase
        (BchF)
      reference_section_type: INTRODUCTION
    - reference_id: file:genes/RHOCB/bchF/bchF-uniprot.txt
      supporting_text: 'InterPro; IPR009905; BCHF.'
      record_section:
      - DR:InterPro
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR009905
      slot: interpro2go mapping
      requested_change: REPOINT
      asserted_value: GO:0019685
      corrected_value: GO:0036070
      corrected_label: light-independent bacteriochlorophyll biosynthetic process
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        InterPro / InterPro2GO (the resource behind GO_REF:0000002; there is no
        INTERPRO value in SourceResourceEnum, hence OTHER). The interpro2go file maps
        IPR009905 to GO:0019685 "photosynthesis, dark reaction", whose definition is
        the Calvin cycle. The intended meaning is the light-independent segment of
        bacteriochlorophyll biosynthesis, for which GO:0036070 exists. The same
        substitution is made for the three light-independent protochlorophyllide
        reductase entries IPR005969, IPR005970 and IPR005971, whose correct term is
        also GO:0036070 (or the chlorophyll counterpart GO:0036069 for plant/
        cyanobacterial members). Because these four rules are the only interpro2go uses
        of GO:0019685, and QuickGO reports that all 3,731 GOA annotations to GO:0019685
        cite GO_REF:0000002, repointing them removes every current GOA use of the term.
      supported_by:
      - reference_id: PMID:36971575
        supporting_text: >-
          oxidation of the 3HE group by 3HE-Bchlide a dehydrogenase (BchC) to form the
          acetyl group of Bchlide a, which is a direct precursor of Bchl a
        reference_section_type: INTRODUCTION
      - reference_id: file:genes/RHOCB/bchF/bchF-uniprot.txt
        supporting_text: >-
          PATHWAY: Porphyrin-containing compound metabolism; bacteriochlorophyll
          biosynthesis (light-independent).
        record_section:
        - CC:PATHWAY
