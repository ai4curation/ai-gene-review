  review:
    summary: >-
      True, and the right pathway, but one level less specific than the gene's own
      evidence supports. The bacteriochlorophyll a pathway of R. capsulatus is
      light-independent, so GO:0036070 - which the gene already carries from
      UniPathway - is the supported term.
    action: MODIFY
    reason: >-
      The family-level BP inference is sound: IPR009905 members act in
      bacteriochlorophyll biosynthesis, and in R. capsulatus the hydration step was
      genetically assigned to bchF (PMID:8385667). The refinement is warranted because
      protochlorophyllide reduction in this organism is carried out in the dark by
      BchL, BchN and BchB (PMID:8385667), making the whole branch light-independent;
      GO:0036070 is an is_a descendant of GO:0030494 and is already asserted on this
      gene from UniPathway UPA00671, so the replacement is a term the gene carries
      rather than a new claim. Keeping the parent as well would only restate it.
