- description: >-
    Hydration of the C-3 vinyl group of chlorophyllide a or 3-vinyl
    bacteriochlorophyllide a to the corresponding 3-(1-hydroxyethyl) compound, the
    committed step that allows BchC to install the 3-acetyl group of
    bacteriochlorophyllide a, within the light-independent bacteriochlorophyll a
    biosynthetic pathway of Rhodobacter capsulatus.
  proposed_molecular_function: 3-vinyl bacteriochlorophyllide a hydratase activity
  directly_involved_in:
  - id: GO:0036070
    label: light-independent bacteriochlorophyll biosynthetic process
  supported_by:
  - reference_id: PMID:8385667
    supporting_text: >-
