  review:
    summary: >-
      UniRule (UR000414439) assignment of protein tyrosine/serine/threonine (dual-specificity)
      phosphatase activity. The F2USU1 phosphatase domain is a classical receptor-type PTP domain
      (Pfam Y_phosphatase, SMART PTPc) with the KNRY pTyr-recognition loop that, in classical
      PTPs, makes the active-site pocket deep enough for phosphotyrosine but not for phosphoserine
      or phosphothreonine.
