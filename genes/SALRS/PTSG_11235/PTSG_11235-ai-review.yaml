id: F2USU1
gene_symbol: PTSG_11235
aliases:
- F2USU1
- EGD81200
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:946362
  label: Salpingoeca rosetta
description: >-
  PTSG_11235 encodes an 8158-residue receptor-type protein tyrosine phosphatase with a giant cadherin
  ectodomain, from the colonial choanoflagellate Salpingoeca rosetta. After an N-terminal signal
  peptide (1-29), the extracellular region carries 56 tandem cadherin (EC) repeats, many with
  canonical calcium-binding motifs, followed by a fibronectin type III domain. A single transmembrane
  helix (7478-7502) leads to a 656-residue cytoplasmic region containing one classical PTP domain
  (7808-8088). The domain has an intact active site: the catalytic cysteine C8029 in the HCX5R
  signature, the phosphotyrosine-recognition KNRY loop and a WPD loop. The C-terminal FN3, TM
  and PTP arrangement matches the FTY cassette that defines lefftyrins, a cadherin family found
  in choanoflagellates and sponges. Pfam does not detect the N-terminal laminin-N-terminal domain
  of the lefftyrin LEF cassette in this entry, so membership of that family is likely but not
  confirmed. Individual EC repeats resemble those of animal FAT, Dachsous and protocadherin-family
  cadherins. The protein has no cytoplasmic cadherin domain (Pfam Cadherin_C), the beta-catenin-binding
  module of classical cadherins. Choanoflagellates lack classical cadherins, and S. rosetta rosette
  cells are joined by cytoplasmic bridges and extracellular matrix rather than adherens junctions.
  There are no experimental data on the protein: its phosphatase activity, substrates, ligands
  and localization are unknown.
