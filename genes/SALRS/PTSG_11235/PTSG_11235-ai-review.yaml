core_functions:
- description: >-
    Predicted receptor-type protein tyrosine phosphatase. A giant extracellular cadherin-repeat
    array is coupled through a single transmembrane helix to a cytoplasmic classical PTP domain
    with an intact catalytic site. The architecture suggests that extracellular binding regulates
    tyrosine dephosphorylation at the cell surface. It matches the lefftyrin FTY cassette, not
    a classical (catenin-binding) cadherin. Activity, substrates and ligands have not been measured.
  molecular_function:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:MONBE/MBCDH12/MBCDH12-bioinformatics/RESULTS.md
    supporting_text: pTyr-recognition KNRY loop, a WPD loop and the catalytic VHCSAGVGRS signature
  - reference_id: file:SALRS/PTSG_11235/PTSG_11235-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Cell membrane'
  - reference_id: PMID:22837400
    supporting_text: >-
      the carboxyl-terminal FTY cassette of lefftyrins is diagnostic of metazoan receptor PTPases
suggested_questions:
- question: >-
    Is PTSG_11235 a lefftyrin? Does it carry the N-terminal laminin-N, EGF and furin (LEF) cassette,
    so far undetected by Pfam in this gene model?
- question: >-
    Which S. rosetta phosphotyrosine proteins does the PTP domain dephosphorylate, and does it
    oppose the receptor tyrosine kinases that choanoflagellates encode?
- question: >-
    Do the FAT/Dachsous-like EC repeats link this protein to the S. rosetta Hippo pathway, as
    an ARBA rule implies, or is that rule driven only by domain resemblance?
- question: >-
    Why does TreeGrafter graft S. rosetta PTHR24027:SF422 cadherins onto PTN000616280, a node
    PAINT restricts to Bilateria? Should TreeGrafter withhold IBDs from a graft node whose PAINT
    taxon excludes the query organism?
suggested_experiments:
- hypothesis: The PTSG_11235 PTP domain is an active tyrosine-specific phosphatase.
  description: >-
    Express the cytoplasmic PTP domain, wild type and the C8029S mutant, and assay pNPP and phosphotyrosine
    versus phosphoserine/phosphothreonine peptide hydrolysis.
  experiment_type: biochemical enzyme assay
- hypothesis: PTSG_11235 is a cell-surface protein of S. rosetta.
  description: >-
    Tag the protein and image its localization in single cells and rosettes with the S. rosetta
    transfection system.
  experiment_type: localization
- hypothesis: >-
    Loss of PTSG_11235 raises tyrosine phosphorylation and alters rosette development or prey
    capture.
  description: >-
    Make CRISPR knockouts, compare anti-phosphotyrosine immunoblots with wild type, and score
    rosette formation and prey capture.
  experiment_type: genetic knockout
