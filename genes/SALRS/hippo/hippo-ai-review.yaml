core_functions:
- description: >-
    Hippo/MST1-2-type STE20 serine/threonine protein kinase with a C-terminal SARAH
    adaptor-binding domain. By homology with animal and Capsaspora Hippo kinases it is
    expected to act in the cytoplasm as the upstream kinase of a Hippo-Warts-Yorkie
    cascade. In S. rosetta it is required for normal cell proliferation rate but not for
    rosette formation or rosette size. Its kinase activity, substrates (including Warts)
    and interaction partners have not been tested.
