  review:
    summary: >-
      InterPro2GO mapping from the SARAH domain (IPR011524). In animals, SARAH domains
      mediate the signalling interactions of Hippo/MST kinases with Salvador and RASSF
      proteins. In S. rosetta, hippo knockout slows cell proliferation, as warts knockout
      does, but does not change rosette size, whereas warts knockout doubles it
      [DOI:10.1101/2024.07.13.603360].
    action: ACCEPT
    reason: >-
      A STE20/MST kinase with a SARAH adaptor-binding domain is a signalling kinase, and the
      broad term is a safe description of its role. The more specific term hippo signaling
      is not proposed as NEW. That a Hippo-Warts-Yorkie cascade operates in S. rosetta has
      not been shown, and the hippo and warts knockout phenotypes differ: only warts
      knockout enlarges rosettes, so Warts may be activated largely independently of Hippo,
      as the stronger coWts than coHpo phenotype suggests in Capsaspora. The shared slow
      growth of hippo and warts knockouts fits a common pathway but does not establish one.
