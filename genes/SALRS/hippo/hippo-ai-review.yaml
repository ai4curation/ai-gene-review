  label: Salpingoeca rosetta
description: >-
  hippo (PTSG_10780) encodes the Hippo/MST1-2-type STE20 (germinal-centre kinase II)
  serine/threonine protein kinase of the colonial choanoflagellate Salpingoeca rosetta. The
  459-residue protein has an N-terminal protein kinase domain (residues 24-275) with the
  conserved ATP-binding lysine, a disordered linker, and a C-terminal SARAH domain
  (406-453) of the MST1/2/Hippo type, the dimerization and adaptor-binding module through
  which animal Hippo kinases bind Salvador and RASSF proteins. It is the only S. rosetta
  protein combining a kinase domain with an MST-type SARAH domain. In animals Hippo
  phosphorylates and activates the Warts/LATS kinases, which in turn phosphorylate and
  inactivate the transcriptional coactivator Yorkie/YAP. S. rosetta encodes Warts, Salvador
  and Yorkie homologs, and the Capsaspora Hippo homolog activates this cascade, but the
  S. rosetta protein has not been characterized biochemically. Knockout of hippo in
  S. rosetta slows cell proliferation (longer doubling time) but, unlike knockout of warts,
  does not change rosette size, and knockout cells still develop rosettes.
