  review:
    summary: >-
      Combined IEA (InterPro Mst1/2 SARAH domain, EC 2.7.11.1, PANTHER). The protein has a
      STE20-type kinase domain classified by CDD as the MST1/2 kinase subfamily
      (cd06612 STKc_MST1_2) and a Hippo-type SARAH domain (cd21884). Homologs of Hippo are
      defined by exactly this combination of a Ste20-like kinase domain and a SARAH domain
