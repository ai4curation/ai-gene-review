    action: ACCEPT
    reason: >-
      This is the core activity of an MST/Hippo kinase, and the catalytic domain and its
      ATP-binding residue are intact. The PANTHER part of the row comes from
      PTN004698602, a deep duplication node in PTHR48012 spanning several germinal-centre
      kinase groups (SLK, SPAK/OSR1, MAP4K, GCKIII); serine/threonine kinase activity is
      shared by all of them, so the broad placement does not affect this term. Activity has
      not been assayed for the S. rosetta protein; for the Capsaspora homolog, expression in
      Drosophila S2R+ cells induced phosphorylation of Warts and Yorkie [PMID:22832104].
