suggested_questions:
- question: >-
    Does S. rosetta Hippo phosphorylate S. rosetta Warts on its activation-loop and
    hydrophobic-motif sites, and is Warts activity reduced in hippo knockout cells?
- question: >-
    Why does hippo knockout slow proliferation without changing rosette size, while warts
    knockout both slows proliferation and doubles rosette size? Are other STE20/MAP4K-type
    kinases able to activate Warts without Hippo?
- question: >-
    Does the S. rosetta SARAH domain bind the Salvador homolog and RASSF-type SARAH
    proteins encoded in the genome, as in animals?
- question: >-
    Is the slower proliferation of hippo knockout cells mediated by Yorkie? yorkie knockout
    cells proliferate at a wild-type rate, so a double-knockout epistasis test is
    informative.
suggested_experiments:
- hypothesis: S. rosetta Hippo is an active kinase that phosphorylates Warts.
  description: >-
    In vitro kinase assay of immunopurified wild-type versus kinase-dead (K53A) Hippo on
    recombinant Warts, and phospho-specific or Phos-tag immunoblots of Warts in wild-type
    and hippo knockout cells.
  experiment_type: biochemical kinase assay
- hypothesis: Hippo acts upstream of Warts and Yorkie in S. rosetta.
  description: >-
    Build hippo yorkie and warts yorkie double knockouts with the selection-based cassette
    method and test whether loss of Yorkie suppresses the slow-growth phenotype of hippo
    and warts knockouts; compare Yorkie localization in each background.
  experiment_type: genetic epistasis
- hypothesis: Hippo kinase activity, not only the protein, is required for normal proliferation.
  description: >-
    Complement hippo knockout cells with wild-type or kinase-dead Hippo and measure
    doubling time.
  experiment_type: genetic complementation
