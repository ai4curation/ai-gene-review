- id: DOI:10.1101/2024.07.13.603360
  title: A fast and robust gene knockout method for <i>Salpingoeca rosetta</i> informs the
    genetics of choanoflagellate multicellular development
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      bioRxiv preprint (July 2024), full text cached from the PDF. Reports CRISPR knockout of
      the S. rosetta Hippo, Warts and Yorkie homologs (two clones each), growth curves and
      rosette-size counts. The cached version names the genes but not their locus IDs (the
      figure legend says orthologs were identified as in Sebe-Pedros et al. 2012 and
      retrieved from UniProt); PTSG_10780 as the hippo locus was supplied from the
      preprint's gRNA-design sentence, which is not in this cached version. F2UQC7 is the
      only S. rosetta kinase with an MST-type SARAH domain, which supports the mapping.
      Published as PMID:41037400.
  findings:
  - statement: hippo knockout cells proliferate more slowly than wild type.
    supporting_text: >-
      On the other hand, hippopac1 and warts pac1 KO clones proliferated markedly slower
  - statement: hippo knockout rosettes are of normal size.
    supporting_text: >-
      The size of hippopac1 and yorkiepac1 rosettes did not significantly differ from wild
      type (11.6 ± 1.7 cells and 9.8 ± 3.1 cells
  - statement: All knockout clones, including hippo, still develop into rosettes.
    supporting_text: >-
      all six KO clones reliably developed into rosettes, as did wild-type cells
  - statement: >-
      The slower proliferation of hippo and warts knockouts is opposite to the animal
      loss-of-function phenotype.
    supporting_text: >-
      down proliferation in S. rosetta, which is the opposite of their animal
      loss-of-function phenotype
