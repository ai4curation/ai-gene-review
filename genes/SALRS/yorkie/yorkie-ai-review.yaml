  review:
    summary: >-
      TreeGrafter transfer from PANTHER node PTN002569196. TreeGrafter places F2UDK1 in
      PTHR10316:SF68 (family "MEMBRANE ASSOCIATED GUANYLATE KINASE-RELATED"), and the node
      is an ecdysozoan speciation node whose members are Drosophila CG42788, Anopheles
      AGAP003128 and a Pristionchus gene (PANTHER 19 tree), not the YAP1 family
      (PTHR17616) of human YAP1 and Drosophila Yorkie. Our own analysis finds that F2UDK1
      matches YAP1, Yorkie and Capsaspora coYki better than the S. rosetta protein that
      PANTHER does place in PTHR17616 (F2U5K0, PTSG_03848). The localization of S. rosetta
      Yorkie has not been examined.
    action: KEEP_AS_NON_CORE
    reason: >-
      The propagation route is wrong: the term reaches a choanoflagellate Yorkie homolog
      from a node of insect and nematode MAGI-related proteins. The term itself is
      plausible on independent grounds, since Yorkie/YAP proteins shuttle between cytoplasm
      and nucleus and are held in the cytoplasm when phosphorylated by Warts/LATS, and
      F2UDK1 carries four HXRXXS motifs. Kept as a non-core, unverified location, and the
      nucleus should be tested alongside it.
