- id: PMID:22832104
  title: Premetazoan origin of the hippo signaling pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Identifies Yki homologs in S. rosetta and M. brevicollis that cluster with metazoan
      Yki. Its claim that all non-metazoan Yki homologs keep the N-terminal TEAD-interaction
      region is not borne out for F2UDK1 by the later review (PMID:38729842) or by our motif
      search; the 2012 analysis may have used a different gene model.
  findings:
  - statement: S. rosetta has a Yorkie homolog that clusters with metazoan Yorkie.
    supporting_text: >-
      We have identified clear Yki homologs in two independent non-metazoan lineages, the
      filastereans (Capsaspora owczarzaki, from herein called “Capsaspora”) and the
      choanoflagellates (Monosiga brevicollis and Salpingoeca rosetta) (Figure 1B).
  - statement: >-
      All non-metazoan Yki homologs, including S. rosetta's, keep the N-terminal
      TEAD-interaction region.
    supporting_text: >-
      Importantly, all these non-metazoan Yki homologs contain highly conserved functional
      sites like the Hippo pathway responsive phosphorylation site S168/127 and the
      N-terminal homology region that is critical for interaction with Sd/TEAD
      transcription factor (Figure 2A).
    finding_review:
      finding_status: DISPUTED
      review_notes: >-
        The later review reports that the srYki TEAD-binding domain lacks conserved
        alpha2-helix residues, and our motif search finds no YAP/Yki TEAD-interface motif
        in F2UDK1.
      supported_by:
      - reference_id: PMID:38729842
        supporting_text: >-
          the srYki TBD shows less conservation with Yorkie/YAP/TAZ than coYki, with srYki
          lacking conserved residues within the α2 helix that are critical for YAP-TEAD
          interaction in mammals
