  label: Salpingoeca rosetta
description: >-
  yorkie (PTSG_06057) encodes the Yorkie/YAP/TAZ homolog of the colonial choanoflagellate
  Salpingoeca rosetta, a 714-residue protein with two WW domains (residues 189-222 and
  244-277) embedded in long disordered, low-complexity regions. In animals Yorkie/YAP is a
  transcriptional coactivator: it binds Scalloped/TEAD transcription factors through an
  N-terminal TEAD-binding domain, its WW domains bind PPxY motifs of partner proteins, and
  phosphorylation by Warts/LATS on HXRXXS motifs keeps it in the cytoplasm. The S. rosetta
  protein carries four HXRXXS motifs, one of them N-terminal to the WW domains as in YAP,
  but its predicted TEAD-binding region is poorly conserved, and whether it binds a TEAD
  protein or acts as a coactivator is unknown. yorkie knockout cells proliferate at the
  wild-type rate and form rosettes of normal size, whereas Warts and Yorkie both influence
  expression of extracellular matrix genes, including couscous.
