      bioRxiv preprint (July 2024), full text cached from the PDF. Reports CRISPR knockout of
      the S. rosetta Hippo, Warts and Yorkie homologs (two clones each). The cached version
      does not give locus IDs; PTSG_06057 as the yorkie locus was supplied from the
      preprint's gRNA-design sentence, which is not in this cached version. F2UDK1's two WW
      domains and four HXRXXS motifs match the published description of srYki, which
      supports the mapping.
