  review:
    summary: >-
      TreeGrafter transfer from the same misplaced ecdysozoan node (PTN002569196) in the
      MAGI-related family. As a Yorkie homolog, F2UDK1 is expected to be the
      transcriptional effector of hippo signaling. In S. rosetta, Warts and Yorkie both
      regulate extracellular matrix genes [PMID:41037400], but yorkie knockout has no
      effect on proliferation or rosette size [DOI:10.1101/2024.07.13.603360], and no
      experiment shows Yorkie responding to Warts.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is broad, and is plausible for a Yorkie homolog through its own family. A
      shared set of extracellular-matrix target genes for Warts and Yorkie fits a
      Warts-to-Yorkie pathway, but the phenotypes do not follow the animal pattern (warts
      loss enlarges rosettes, yet yorkie loss has no size effect), so no specific S. rosetta
      signal or downstream process can be named. Kept as non-core because it rests on a
      wrong-family propagation and on family-level inference, not on S. rosetta data. Hippo
      signaling is not proposed as NEW for the same reason, and because the predicted
      TEAD-binding region needed for the canonical output is not conserved.
    supported_by:
