core_functions:
- description: >-
    Yorkie/YAP/TAZ-family WW-domain protein, predicted by homology to be the transcriptional
    effector restrained by Warts in the S. rosetta Hippo pathway. It carries four
    Warts-consensus HXRXXS motifs, but its predicted TEAD-binding region is poorly
    conserved, so its partner transcription factor and coactivator activity are unknown.
    In S. rosetta it shares extracellular-matrix target genes, including couscous, with
    Warts, but is not required for normal proliferation or rosette size. No molecular
    function term is asserted until coactivator activity or TEAD binding is shown.
  supported_by:
  - reference_id: PMID:38729842
    supporting_text: srYki has 4 putative Warts phosphorylation sites
  - reference_id: PMID:38729842
    supporting_text: >-
      The degree to which choanoflagellate Yorkie orthologs interact with Sd/TEAD proteins
      is therefore currently unclear
  - reference_id: PMID:41037400
    supporting_text: >-
      RNA sequencing revealed that Warts and Yorkie regulated several extracellular matrix
      genes involved in multicellularity (including couscous)
suggested_questions:
- question: >-
    Does S. rosetta Yorkie bind the S. rosetta Scalloped/TEAD homolog despite the poorly
    conserved TEAD-binding region, and does it activate transcription in a reporter assay?
- question: >-
    Is S. rosetta Yorkie phosphorylated by Warts on its four HXRXXS motifs, and does Warts
    loss shift it to the nucleus?
- question: >-
    Do Warts and Yorkie regulate the shared extracellular matrix genes (e.g. couscous) in
    opposite directions, as the canonical pathway predicts?
- question: >-
    Is F2UDK1 the Yorkie ortholog, given that PANTHER places it with MAGI-related proteins
    and puts another S. rosetta WW protein (F2U5K0, PTSG_03848) in the YAP1 family? A
    phylogeny of holozoan YAP/Yorkie and WW-domain proteins would settle it.
- question: >-
    Why does yorkie knockout not affect rosette size or proliferation? Is there redundancy
    with another WW-domain coactivator?
suggested_experiments:
- hypothesis: S. rosetta Yorkie is a Warts-regulated nucleocytoplasmic protein.
  description: >-
    Express fluorescently tagged wild-type and four-site S-to-A Yorkie in wild-type and
    warts knockout cells and score its nuclear-to-cytoplasmic ratio.
  experiment_type: localization / imaging
- hypothesis: S. rosetta Yorkie binds the S. rosetta TEAD homolog.
  description: >-
    Co-immunoprecipitation or yeast two-hybrid of Yorkie with the S. rosetta Scalloped/TEAD
    homolog, with AlphaFold-Multimer modelling to locate any divergent interface.
  experiment_type: protein interaction assay
- hypothesis: The enlarged rosettes of warts mutants require Yorkie.
  description: >-
    Construct warts yorkie double knockouts and count cells per rosette and imaging of the
    ECM core.
  experiment_type: genetic epistasis
