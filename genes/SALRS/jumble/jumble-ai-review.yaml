      The glycosyltransferase activity rests on remote fold recognition alone
      (low-confidence CDD hit, HHpred/Phyre2 similarity to GalNAc-transferases);
      no donor sugar, acceptor or enzymatic activity has been shown. The loss of
      basal jacalin staining could equally reflect a defect in trafficking
      glycosylated cargo to the basal pole rather than loss of a glycosylation
      step.
