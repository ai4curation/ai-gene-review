suggested_questions:
- question: >-
    Does Jumble have glycosyltransferase activity at all, and if so which donor
    sugar and acceptor does it use? Its only link to glycosyltransferases is
    fold recognition to polypeptide GalNAc-transferases, and it lacks any
    InterPro/Pfam signature.
- question: >-
    Is the loss of basal jacalin staining in jumble mutants due to loss of a
    glycan (a glycosylation step performed by Jumble) or to failed trafficking or
    secretion of normally glycosylated cargo to the basal pole? Whole-cell jacalin
    blots showed no difference, which favours a spatial or secretory defect.
- question: >-
    Is Rosetteless (or a cadherin or other adhesion protein) a direct glycosylation
    substrate of Jumble?
- question: >-
    Does the CRISPR knockout of jumble (PMID:41037400) phenocopy the jumble-lw1
    clumping and rosette-defect phenotype?
suggested_experiments:
- description: >-
    Express the soluble luminal domain of Jumble (and fungal homologs) and assay
    glycosyltransferase activity against a panel of nucleotide-sugar donors and
    peptide/glycan acceptors (e.g. UDP-Glo assays), including Rosetteless-derived
    peptides.
  hypothesis: Jumble is a catalytically active glycosyltransferase.
  experiment_type: biochemical enzyme assay
- description: >-
    Co-localize tagged Jumble at endogenous expression levels (knock-in) with
    Golgi markers developed for S. rosetta, or by immuno-EM, to confirm Golgi
    residence and define the cisternal position.
  hypothesis: Jumble is a Golgi-resident type II membrane protein.
  experiment_type: localization / microscopy
- description: >-
    Compare glycan profiles (glycomics/glycoproteomics, O-glycan release) of
    wild-type versus jumble knockout cells and of purified rosette ECM, and test
    whether Rosetteless glycosylation changes.
  hypothesis: Jumble adds specific glycans to ECM glycoproteins such as Rosetteless.
  experiment_type: glycomics / mass spectrometry
- description: >-
    Mutate predicted catalytic residues (identified from a structural model aligned
    to GalNAc-T catalytic domains) and test the ability of the mutant to rescue
    rosette formation and basal jacalin staining in jumble knockout cells.
  hypothesis: Catalytic activity, not just protein presence, is required for Jumble function.
  experiment_type: genetic complementation
