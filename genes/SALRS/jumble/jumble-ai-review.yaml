references:
- id: PMID:30556809
  title: Predicted glycosyltransferases promote development and prevent spurious cell
    clumping in the choanoflagellate S. rosetta.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary characterization of jumble (full text cached). Verified that the
      paper names GenBank EGD72416 / XM_004998928 as the jumble gene, matching
      UniProt F2TWH0 (EMBL EGD72416.1; RefSeq XM_004998928.1).
  findings:
  - statement: >-
      The Jumble mutant forms tightly packed amorphous clumps and never forms
      rosettes, with or without rosette-inducing factors.
    supporting_text: >-
      that form amorphous, tightly packed clumps of cells, both in the presence
      and absence of RIFs, but never develop into rosettes
  - statement: >-
      Clumping reflects promiscuous adhesion; mutant cells also adhere to wild-type
      cells.
    supporting_text: >-
      Cell aggregation was not strain-specific, as unlabeled Jumble and Couscous
      mutant cells adhered to wild type cells identified by their expression of
      cytoplasmic mWasabi
  - statement: >-
      A single point mutation (L305P) in jumble (EGD72416) causes both clumping and
      rosette defects.
    supporting_text: >-
      we infer that the single point mutation at genome position 1:1,919,681
      causes both the clumping and rosette defect phenotypes in Jumble mutants.
  - statement: >-
      jumble is a single-exon gene encoding a 467 aa protein with one predicted
      transmembrane domain.
    supporting_text: >-
      The jumble gene contains a single exon and is predicted to encode a 467 amino
      acid protein containing a single transmembrane domain.
  - statement: >-
      Transgenic wild-type jumble (N- or C-terminal mTFP fusions) partially rescues
      rosette development; the mutant allele does not.
    supporting_text: >-
      Importantly, we did not detect any rosettes when we transfected Jumble cells
      with mTFP alone, jumblelw1-mTFP, or mTFP-jumblelw1.
  - statement: >-
      No InterPro/Pfam domain; glycosyltransferase relationship predicted only by
      low-confidence CDD and structure-based homology (HHpred/Phyre2).
    supporting_text: >-
      Although Interpro (Finn et al., 2017) and Pfam (Finn et al., 2016) did not
      reveal any known protein domains in Jumble
  - statement: >-
      Homologs are present in other choanoflagellates and fungi but not animals.
    supporting_text: >-
      BLAST searches uncovered unannotated jumble homologs in nine other
      choanoflagellates (Figure 2—figure supplement 2A) and in fungi (Figure
      2—figure supplement 3), but none in animals.
  - statement: >-
      Tagged Jumble localizes apically at the position of the Golgi apparatus;
      the L305P mutant protein is retained in the ER.
    supporting_text: >-
      In contrast, Jumblelw1-mWasabi, was distributed in a tubular pattern
      throughout the cell and co-localized with an endoplasmic reticulum (ER)
      marker
  - statement: >-
      Jumble mutants lose basal-pole jacalin staining; complementation restores
      it.
    supporting_text: >-
      In contrast with wild type cells, the basal patch of jacalin staining was
      absent or significantly diminished in Couscous and Jumble mutants, both in
      the presence and absence of RIFs
  - statement: >-
      In Jumble mutants Rosetteless localizes to the basal pole but is not
      upregulated or secreted upon rosette induction.
    supporting_text: >-
      In both Jumble and Couscous cells, Rosetteless protein properly localized to
      the basal pole, but its expression did not increase nor was it secreted upon
      treatment with RIFs, as normally occurs in wild type cells
  - statement: >-
      Glycosyltransferase targets of Jumble are unknown.
    supporting_text: >-
      While we have not uncovered the target(s) of the predicted glycotransferases
