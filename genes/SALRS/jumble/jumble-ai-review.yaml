product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:946362
  label: Salpingoeca rosetta
description: >-
  jumble encodes a 467-amino-acid, single-exon protein of the choanoflagellate
  Salpingoeca rosetta with a single predicted N-terminal transmembrane segment
  followed by a large C-terminal region. No known protein domain is detected by
  InterPro or Pfam, but fold-recognition methods (HHpred, Phyre2) relate it to
  the catalytic domain of polypeptide N-acetylgalactosaminyltransferases, and it
  is therefore regarded as a predicted glycosyltransferase; no enzymatic activity,
  donor or acceptor substrate has been demonstrated. A fluorescently tagged
  Jumble protein localizes to the apical pole of the cell near the flagellar
  base, at the position of the Golgi apparatus. A missense allele (L305P,
  jumble-lw1) that mislocalizes the protein to the endoplasmic reticulum causes
  cells to clump promiscuously and to fail to form rosette colonies in response
  to bacterial rosette-inducing factors; mutant cells lose basal-pole staining by
  the lectin jacalin and fail to upregulate and secrete the rosette-ECM protein
  Rosetteless. Transgenic wild-type jumble restores rosette formation and basal
  jacalin staining. Jumble is thus required for normal glycan presentation in the
  basal extracellular matrix, for suppression of spurious cell-cell adhesion, and
  for rosette development. Homologs occur across choanoflagellates and in some
  fungi but not in animals.
existing_annotations:
- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: IDA
  original_reference_id: PMID:30556809
  review:
    summary: >-
      A Jumble-mWasabi fusion expressed from the efl promoter in wild-type S.
      rosetta localized to the apical pole of the cell body near the base of the
      flagellum, both with and without rosette-inducing factors. By comparison
      with transmission electron micrographs this position corresponds to the
      Golgi apparatus, and the authors conclude that Jumble localizes to the
      Golgi. The functionally dead L305P allele instead is retained in the ER.
    action: NEW
    reason: >-
      Direct imaging of the tagged protein supports a Golgi location, which is
      also consistent with the predicted type-II-like topology (single N-terminal
      TM segment) typical of Golgi glycosyltransferases. Caveats: the construct is
      tagged and driven by a heterologous promoter, and no Golgi marker exists yet
      in S. rosetta, so organelle identity is assigned by position relative to
      ultrastructure rather than by co-localization. Proposed at the general
      Golgi apparatus level; Golgi membrane or a specific cisterna is not
      established.
    supported_by:
    - reference_id: PMID:30556809
      supporting_text: >-
        Jumble-mWasabi protein localized to the apical pole of the cell body near
        the base of the flagellum.
    - reference_id: PMID:30556809
      supporting_text: >-
        Jumble-mWasabi localization corresponds to the location of the Golgi
        apparatus, for which there is not yet a fluorescent marker in S.
    - reference_id: PMID:30556809
      supporting_text: >-
        Consistent with its role as a glycosyltransferase, Jumble localized to the
        Golgi apparatus, but Couscous appeared to localize in cytoplasmic puncta and
        to the cell membrane.
core_functions:
- description: >-
    Predicted Golgi-resident glycosyltransferase-like protein required for normal
    glycan presentation (jacalin-reactive glycans) at the basal pole and in the
    rosette extracellular matrix, for suppression of promiscuous cell clumping,
    and for rosette development. The glycosyltransferase molecular function is a
    prediction from remote fold recognition only (no InterPro/Pfam signature, a
    low-confidence CDD hit, HHpred/Phyre2 similarity to polypeptide
    GalNAc-transferases); no activity, donor sugar or acceptor has been shown,
    and the mutant phenotype could also reflect a defect in trafficking of
    glycosylated cargo to the basal pole rather than loss of a glycosylation step.
