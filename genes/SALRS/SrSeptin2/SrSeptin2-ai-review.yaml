  label: Salpingoeca rosetta
description: >-
  SrSeptin2 is one of three septin GTPases of the colonial choanoflagellate
  Salpingoeca rosetta. Phylogenetic analysis places it in septin Group 4, the
  group containing yeast Cdc12, rather than with mammalian SEPT2 despite its
  name. The 412-residue protein has an N-terminal septin-type G domain with the
  G1, G3 and G4 GTP-binding motifs, followed by a C-terminal coiled-coil region
  that in other septins mediates higher-order assembly of heteromeric filaments.
  When expressed as a fluorescent fusion, SrSeptin2 is distributed through the
  cytosol and enriched at the basal pole of single cells; in rosette colonies it
  concentrates at the basal poles where neighbouring cells meet. At the basal
  pole it forms filaments that lie between cortical microtubules, and its basal
  enrichment depends on the coiled-coil region. It colocalises with the
  paralogue SrSeptin6, consistent with assembly into heteromeric septin
  filaments. This basal localisation resembles septin localisation in animal
  epithelial cells. No loss-of-function or biochemical data exist, so its
  proposed contribution to rosette development and intercellular contacts is
  untested.
