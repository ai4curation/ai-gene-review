core_functions:
- description: >-
    Septin-family GTP-binding protein (Group 4, Cdc12-like) that forms filaments
    at the basal pole of S. rosetta cells, in single cells and in rosette
    colonies, probably as part of a heteromeric septin complex with SrSeptin6.
    Its molecular activity is inferred from the conserved septin G domain; its
    biological role, including the hypothesised contribution to intercellular
    contacts in rosettes, has not been tested.
