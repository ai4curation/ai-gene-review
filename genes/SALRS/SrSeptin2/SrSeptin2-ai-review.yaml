suggested_questions:
- question: >-
    Is SrSeptin2 required for rosette development, cell division or the integrity
    of rosette cell contacts? Septin knockouts have not been reported in the
    published S. rosetta genome-editing studies.
- question: >-
    Does SrSeptin2 co-assemble with SrSeptin6 and PTSG_04106 into a heteromeric
    filament, and in what order? The colocalisation data predict this but do not
    test it.
- question: >-
    The name SrSeptin2 does not reflect orthology: the protein groups with yeast
    Cdc12 (Group 4). Should database names follow the phylogenetic group instead?
suggested_experiments:
- experiment_type: Gene knockout by genome editing
  description: >-
    Inactivate PTSG_07215 with the selection-based CRISPR pipeline and score
    rosette development, cell division and the basal localisation of SrSeptin6
    and Rosetteless.
- experiment_type: Co-immunoprecipitation or in vitro reconstitution
  description: >-
    Express the three S. rosetta septins together and test complex formation
    and filament assembly, including nucleotide binding and GTPase activity.
- experiment_type: Endogenous tagging or immunofluorescence
  description: >-
    Confirm the basal localisation with an antibody or knock-in tag at the
    endogenous locus, since the published data use a plasmid-expressed fusion.
