- term:
    id: GO:0031105
    label: septin complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: part_of
  supporting_entities:
  - UniRule:UR000878335
  review:
    summary: >-
      UniRule transfer from the septin family. Septins from different groups
      assemble into heteromeric complexes through their G domains. SrSeptin2 (a
      Group 4 septin) colocalises at the basal pole with SrSeptin6 (a Group 1B
      septin), which the authors take as evidence that the two co-assemble; no
      biochemical isolation of an S. rosetta septin complex has been reported.
    action: ACCEPT
    reason: >-
      Membership of a heteromeric septin complex is a defining property of the
      family. S. rosetta has septins from several groups, and the colocalisation
      data are consistent with co-assembly. The electronic annotation is
      appropriate; it should not be upgraded to experimental evidence until a
      complex is purified or an interaction is shown.
    supported_by:
    - reference_id: PMID:30281390
      supporting_text: >-
        Septin paralogues interact directly through their G-domains to form
        heteromeric filaments
    - reference_id: PMID:30281390
      supporting_text: >-
        strongly suggest that SrSeptin2 and SrSeptin6 assemble together at the
        basal pole.
- term:
    id: GO:0045178
    label: basal part of cell
  evidence_type: IDA
  original_reference_id: PMID:30281390
  review:
    summary: >-
      Live imaging of a transfected mTFP1-SrSeptin2 fusion shows enrichment at the
      basal pole of single cells and of rosette cells, and at contacts between
      adjacent rosette cells, which correspond to the basal poles. Basal
      enrichment is lost when the coiled-coil region is deleted.
    action: NEW
    reason: >-
      GOA has no experimental annotation for this protein. Basal part of cell is
      the main finding of the only experimental study and is stated directly for
      both unicellular and colonial cells. The evidence is a tagged, transiently
      expressed fusion rather than staining of the endogenous protein, which is
      acceptable for IDA. The cell-cell contact signal in rosettes is described
      by the authors as the basal pole, so no separate cell-cell contact term is
      proposed.
    supported_by:
