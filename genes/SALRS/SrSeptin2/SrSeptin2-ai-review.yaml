  knowledge_gaps:
  - gap_statement: >-
      No loss-of-function, biochemical or interaction data exist for SrSeptin2.
      GTP binding and hydrolysis, filament assembly with other S. rosetta
      septins, and any requirement for rosette development or cell division are
      all untested.
