  review:
    summary: >-
      Combined InterPro/UniRule inference from the septin family (IPR016491) and
      septin-type G domain (IPR030379) signatures. SrSeptin2 has a complete
      septin-type G domain with G1, G3 and G4 motifs and PIRSR-predicted GTP
      contact residues. GTP binding has not been measured for the protein.
    action: ACCEPT
    reason: >-
      Septin G domains bind guanine nucleotide, and the motifs needed for this are
      present. The term is a biochemical activity of the whole septin family, so
      the electronic transfer to a choanoflagellate septin is sound. It is the
      most specific molecular function supported for SrSeptin2; whether it
      hydrolyses GTP is unknown.
