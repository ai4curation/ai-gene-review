- term:
    id: GO:0035329
    label: hippo signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001220369
  review:
    summary: >-
      TreeGrafter transfer of the IBD placed at PTN002390470 (Warts/LATS,
      "Metazoa-Choanoflagellida"), supported by experimental annotations on Drosophila wts,
      human LATS1/2 and mouse Lats. In S. rosetta, Warts and Yorkie regulate several
      extracellular matrix genes [PMID:41037400], the Yorkie homolog carries four HXRXXS
      Warts motifs [PMID:38729842], and in Capsaspora the Warts homolog restrains nuclear
      entry of the Yorkie homolog [PMID:38517944].
    action: ACCEPT
    reason: >-
      Warts/LATS performs a step of the hippo signaling cascade (phosphorylating Yorkie),
      and the IBD node includes choanoflagellates. That placement is consistent with
      Capsaspora evidence that the Hippo-Warts-Yorkie cascade predates animals, so the
      family-level inference is sound and the term describes the core role. Caveats: no
      S. rosetta experiment shows Warts phosphorylating Yorkie or controlling its
      localization; hippo knockout does not phenocopy the warts rosette-size phenotype;
      and the predicted TEAD-binding region of S. rosetta Yorkie is poorly conserved. A NEW
      IMP is not added: the knockout phenotypes (rosette size, proliferation) are downstream
      outcomes and do not test participation in the cascade itself.
    supported_by:
    - reference_id: PMID:41037400
      supporting_text: >-
        RNA sequencing revealed that Warts and Yorkie regulated several extracellular matrix
        genes involved in multicellularity (including couscous)
    - reference_id: PMID:38729842
      supporting_text: >-
        srYki has 4 putative Warts phosphorylation sites
    - reference_id: PMID:38517944
      supporting_text: >-
        Together, these results show that the Capsaspora Hippo kinase cascade regulates
        coYki by cytoplasmic sequestration, indicating a premetazoan origin of this
        regulatory activity of the Hippo pathway.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002390470
        source_label: Warts/LATS, Metazoa-Choanoflagellida node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          IBD supported by fly wts and mammalian LATS1/2; the cascade is shown to predate
          animals in Capsaspora, so inheritance at the Choanozoa node is plausible.
