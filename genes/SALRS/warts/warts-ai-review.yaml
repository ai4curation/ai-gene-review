- term:
    id: GO:0046620
    label: regulation of organ growth
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001220369
  review:
    summary: >-
      TreeGrafter transfer of an IBD at PTN002390470 seeded by mouse Lats2 (MGI:1354386).
      GO defines the term as modulating "growth of an organ of an organism"; it is a child
      of regulation of developmental growth and regulation of multicellular organismal
      process. S. rosetta is a choanoflagellate that lives as single cells or as clonal
      rosettes of a few dozen cells; it has no organs. Its warts knockout does enlarge
      rosettes [DOI:10.1101/2024.07.13.603360], but a rosette is not an organ.
    action: REMOVE
    reason: >-
      An organ is a multicellular anatomical structure of an animal or plant body, which
      choanoflagellates do not have, so the term cannot be true of this protein whatever its
      function. The source annotation is sound for mice. The fault is that an organ-level
      outcome term was placed at a node ("Metazoa-Choanoflagellida") that includes
      unicellular organisms, while the GO term's taxon constraints exclude only bacteria,
      archaea and two yeasts. The rosette-size phenotype is the closest S. rosetta
      counterpart, but no GO term fits it (there is no rosette term; see the NTR drafted in
      the rosetteless review). It is also a downstream outcome of altered extracellular
      matrix gene expression, not work done by Warts, so no replacement process term is
      proposed.
    supported_by:
    - reference_id: DOI:10.1101/2024.07.13.603360
      supporting_text: >-
        warts pac1 cells grew into giant rosettes containing about twice as many cells as
        wild-type ones (21.1 ± 4.4 versus 10.9 ± 3.8 cells per rosette, respectively)
    - reference_id: PMID:41037400
      supporting_text: >-
        suggesting that Hippo signaling regulates multicellular size in choanoflagellates by
        modulating matrix secretion
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002390470
        source_label: Warts/LATS, Metazoa-Choanoflagellida node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Organ-growth IBD seeded by mouse Lats2; valid for animals, but the node spans
          choanoflagellates, which have no organs.
      - source_id: PANTHER:PTN001220369
        source_label: M. brevicollis Warts leaf
        source_status: NOT_RELEVANT
        comment: Graft point only; M. brevicollis also receives this IBA and has no organs either.
