- id: DOI:10.1101/2024.07.13.603360
  title: A fast and robust gene knockout method for <i>Salpingoeca rosetta</i> informs the
    genetics of choanoflagellate multicellular development
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      bioRxiv preprint (July 2024), full text cached from the PDF. Reports CRISPR knockout of
      the S. rosetta Hippo, Warts and Yorkie homologs (two clones each), growth curves,
      rosette-size counts and ECM imaging of warts knockout rosettes. The cached version
      does not give locus IDs; PTSG_04961 as the warts locus was supplied from the
      preprint's gRNA-design sentence, which is not in this cached version. F2U943 is the
      only S. rosetta protein in the PANTHER Warts subfamily, which supports the mapping.
      Published as PMID:41037400.
  findings:
  - statement: warts knockout rosettes contain about twice as many cells as wild type.
    supporting_text: >-
      warts pac1 cells grew into giant rosettes containing about twice as many cells as
      wild-type ones (21.1 ± 4.4 versus 10.9 ± 3.8 cells per rosette, respectively)
  - statement: warts knockout rosettes reach up to about 60 cells.
    supporting_text: >-
      as many as 60 cells, while their wild type counterparts did not exceed 25 cells
  - statement: warts knockout rosettes have a larger, more branched ECM core.
    supporting_text: >-
      that ECM core appeared larger and with a more conspicuously branched geometry in
      warts pac1
  - statement: warts knockout cells proliferate more slowly than wild type.
    supporting_text: >-
      On the other hand, hippopac1 and warts pac1 KO clones proliferated markedly slower
  - statement: All knockout clones still develop into rosettes.
    supporting_text: >-
      all six KO clones reliably developed into rosettes, as did wild-type cells
  - statement: The authors identify warts as a genetic regulator of rosette size.
    supporting_text: >-
      These observations pinpoint warts as a genetic regulator of S. rosetta rosette size
- id: PMID:41037400
  title: A selection-based knockout approach for a choanoflagellate reveals regulation
    of multicellular development by Hippo signaling.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
