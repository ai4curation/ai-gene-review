taxon:
  id: NCBITaxon:946362
  label: Salpingoeca rosetta
description: >-
  warts (PTSG_04961) encodes the Warts/LATS-family (NDR subgroup, AGC group)
  serine/threonine protein kinase of the colonial choanoflagellate Salpingoeca rosetta.
  The 833-residue protein has a long, largely disordered N-terminal region, a C-terminal
  protein kinase domain (residues 456-763) with the conserved ATP-binding lysine and
  catalytic aspartate and an insert between the two kinase lobes, and an AGC-kinase
  C-terminal extension. It is the S. rosetta member of the choanoflagellate-plus-animal
  Warts clade that includes human LATS1/2 and Drosophila Warts. In animals Warts/LATS,
  activated by Hippo, phosphorylates the coactivator Yorkie/YAP on HXRXXS motifs and
  keeps it out of the nucleus; the S. rosetta Yorkie homolog carries four such motifs.
  In S. rosetta, warts knockout cells proliferate more slowly than wild type, the reverse
  of the animal overgrowth phenotype, yet form rosettes with about twice as many cells as
  wild type (up to about 60 versus at most 25) around a larger, more branched core of
  extracellular matrix. Warts and Yorkie both influence expression of extracellular
  matrix genes, including couscous. Its kinase activity and substrates have not been
  measured.
