core_functions:
- description: >-
    Warts/LATS-family serine/threonine protein kinase of the S. rosetta Hippo pathway,
    inferred from its LATS-clade family placement to restrain the Yorkie homolog, which
    carries four Warts-consensus HXRXXS motifs. In S. rosetta, Warts and Yorkie both
    influence extracellular matrix gene expression, including couscous. Loss of Warts
    roughly doubles the number of cells per rosette, with an enlarged and more branched
    matrix core, and slows cell proliferation. Kinase activity, Yorkie phosphorylation and
    activation by Hippo have not been measured.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0035329
    label: hippo signaling
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:SALRS/warts/warts-uniprot.txt
    supporting_text: PANTHER; PTHR24356:SF418; SERINE_THREONINE-PROTEIN KINASE WARTS; 1.
  - reference_id: PMID:41037400
    supporting_text: >-
      RNA sequencing revealed that Warts and Yorkie regulated several extracellular matrix
      genes involved in multicellularity (including couscous)
  - reference_id: DOI:10.1101/2024.07.13.603360
    supporting_text: >-
      that ECM core appeared larger and with a more conspicuously branched geometry in
      warts pac1
suggested_questions:
- question: >-
    Does S. rosetta Warts phosphorylate the Yorkie homolog on its four HXRXXS motifs, and is
    Yorkie more nuclear in warts knockout cells?
- question: >-
    Are the enlarged rosettes of warts knockouts caused by Yorkie? yorkie knockout rosettes
    are of normal size, so a warts yorkie double knockout is the key epistasis test.
- question: >-
    Why does hippo knockout not phenocopy the warts rosette-size phenotype? Which kinases
    activate Warts in S. rosetta?
- question: >-
    Do larger warts knockout rosettes arise from more cell divisions before rosette
    release, reduced cell loss, or altered matrix secretion (e.g. via couscous)?
- question: >-
    Should GO add taxon constraints restricting organ-level growth terms such as
    regulation of organ growth (GO:0046620) to taxa with organs, or should PAINT place the
    organ-growth IBD at a metazoan rather than a Metazoa-plus-choanoflagellate node?
suggested_experiments:
- hypothesis: S. rosetta Warts is an active kinase that phosphorylates Yorkie at HXRXXS motifs.
  description: >-
    In vitro kinase assay of immunopurified wild-type versus kinase-dead (K485A or D579A)
    Warts on recombinant Yorkie and a four-site S-to-A Yorkie mutant, plus Phos-tag
    immunoblots of Yorkie in wild-type and warts knockout cells.
  experiment_type: biochemical kinase assay
- hypothesis: The warts rosette-size phenotype is mediated by Yorkie.
  description: >-
    Generate warts yorkie double knockouts with the selection-based cassette method and
    count cells per rosette; express a non-phosphorylatable Yorkie in wild-type cells to
    test whether it phenocopies warts loss.
  experiment_type: genetic epistasis
- hypothesis: Warts kinase activity is required to limit rosette size.
  description: >-
    Complement warts knockout cells with wild-type or kinase-dead Warts and score cells
    per rosette, ECM core morphology and doubling time.
  experiment_type: genetic complementation
