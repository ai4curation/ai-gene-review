- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001220369
  review:
    summary: >-
      TreeGrafter transfer. F2U943 was grafted onto PTN001220369, the Monosiga brevicollis
      Warts leaf, and inherits the IBD terms of its parent PTN002390470, a speciation node
      labelled "Metazoa-Choanoflagellida" whose descendants include human LATS1/2,
      Drosophila wts and Nematostella and M. brevicollis Warts (PANTHER 19 tree). The IBA
      for this term on human LATS1 cites mouse Lats2 and human LATS2. No cell-cycle phase
      analysis has been done in S. rosetta; warts knockout cells proliferate more slowly,
      the opposite of the animal loss-of-function phenotype [DOI:10.1101/2024.07.13.603360].
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      G1/S transition is a eukaryote-wide process, so there is no taxon violation. But the
      donor evidence is a cell-cycle role of vertebrate LATS2 (mouse Lats2, human LATS2),
      which says little about a choanoflagellate. In S. rosetta,
      loss of warts slows rather than accelerates proliferation, and no cell-cycle phase
      was measured, so nothing supports a direct role in the G1/S transition. Kept as an
      over-annotation rather than removed, because the IBD placement at the Choanozoa node
      is a phylogenetic judgement I cannot refute with S. rosetta data.
    supported_by:
    - reference_id: DOI:10.1101/2024.07.13.603360
      supporting_text: >-
        On the other hand, hippopac1 and warts pac1 KO clones proliferated markedly slower
    - reference_id: DOI:10.1101/2024.07.13.603360
      supporting_text: >-
        down proliferation in S. rosetta, which is the opposite of their animal
        loss-of-function phenotype
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002390470
        source_label: Warts/LATS, Metazoa-Choanoflagellida node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          IBD supported by vertebrate LATS2 cell-cycle evidence (MGI Lats2, human LATS2);
          sound for vertebrates, but no evidence the role extends to choanoflagellates.
