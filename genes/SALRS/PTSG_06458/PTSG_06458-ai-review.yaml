id: F2UFV3
gene_symbol: PTSG_06458
aliases:
- F2UFV3
- EGD75381
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:946362
  label: Salpingoeca rosetta
description: >-
  PTSG_06458 encodes a 3697-residue single-pass transmembrane cadherin of the colonial choanoflagellate
  Salpingoeca rosetta. After an N-terminal signal peptide (residues 1-20), the extracellular region
  consists of 23 tandem cadherin (EC) repeats followed, close to the membrane, by a fibronectin
  type II domain, a module that binds collagen in animal proteins. A single transmembrane helix
  (3613-3635) is followed by a short cytoplasmic tail of about 60 residues with no recognized
  domain. Many EC repeats carry canonical calcium-binding motifs (DXNDN- and LDRE-type) and the
  PROSITE cadherin signature, so the ectodomain is expected to bind calcium as animal cadherin
  ectodomains do. Individual repeats resemble those of animal FAT, Dachsous, CELSR and protocadherin-family
  cadherins, but no orthology to an animal cadherin family has been established. The protein has
  no cytoplasmic cadherin domain (Pfam Cadherin_C), the beta-catenin-binding module that defines
  classical cadherins. Choanoflagellates lack classical cadherins, and S. rosetta rosette cells
  are joined by cytoplasmic bridges and extracellular matrix rather than adherens junctions. There
  are no experimental data on the protein. Its expression, localization, ligands and function
  are unknown.
