  supporting_entities:
  - InterPro:IPR002126
  - InterPro:IPR015919
  review:
    summary: >-
      InterPro2GO from the cadherin-like domain and superfamily signatures. The 23 EC repeats
      of F2UFV3 match the PROSITE CADHERIN_1 signature seven times, and a motif scan finds 13
      DXNDN-type and 10 LDRE-type calcium-binding motifs in the ectodomain.
