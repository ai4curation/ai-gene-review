suggested_questions:
- question: >-
    Is PTSG_06458 orthologous to any animal cadherin family (FAT, Dachsous, CELSR, protocadherin),
    or is it a choanoflagellate-specific lineage? A phylogeny of the EC-repeat arrays of choanoflagellate
    and sponge cadherins would settle this.
- question: >-
    What does the membrane-proximal fibronectin type II domain bind? Does it bind collagen-like
    proteins of the S. rosetta extracellular matrix?
- question: >-
    Why does TreeGrafter graft S. rosetta PTHR24027:SF422 cadherins onto PTN000616280, a node
    PAINT restricts to Bilateria? Should TreeGrafter withhold IBDs from a graft node whose PAINT
    taxon excludes the query organism?
