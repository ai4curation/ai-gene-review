- id: PMID:22837400
  title: Origin of metazoan cadherin diversity and the antiquity of the classical cadherin/β-catenin
    complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Survey of S. rosetta, Capsaspora and Oscarella cadherins. It establishes
      that classical cadherins (with the beta-catenin-binding CCD) arose in animals, and that
      S. rosetta colonies lack adherens-junction-like structures. It does not discuss PTSG_06458
      individually.
  findings:
  - statement: S. rosetta colonies lack adherens-junction-like structures.
    supporting_text: >-
      even in colony-forming S. rosetta , adjacent cells are linked by cytoplasmic bridges and
      lack structures that resemble the cadherin-based adherens junctions of metazoans
  - statement: The CCD defines classical cadherins and mediates beta-catenin binding.
    supporting_text: >-
      classical cadherins are distinguished by the presence of a cytoplasmic cadherin domain (CCD)
      at the C terminus that regulates interactions with the cytoplasmic protein β-catenin
  - statement: An M. brevicollis cadherin localizes to the microvillar collar.
    supporting_text: >-
      one cadherin (MBCDH1) has been shown to localize to the microvillar collar of M. brevicollis
