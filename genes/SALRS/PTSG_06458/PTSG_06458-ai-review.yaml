core_functions:
- description: >-
    Single-pass transmembrane cell-surface protein with a 23-repeat calcium-binding cadherin ectodomain
    and a membrane-proximal fibronectin type II domain, predicted to bind extracellular ligands
    at the plasma membrane. It is not a classical (catenin-binding) cadherin, and no ligand, partner
    or adhesive activity has been measured.
