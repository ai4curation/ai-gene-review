id: F2UD23
gene_symbol: PTSG_05882
aliases:
- F2UD23
- EGD74518
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:946362
  label: Salpingoeca rosetta
description: >-
  PTSG_05882 encodes an uncharacterized 1856-residue single-pass transmembrane cadherin-domain
  protein of the colonial choanoflagellate Salpingoeca rosetta. After an N-terminal signal
  peptide, the extracellular region carries a von Willebrand factor type D (VWD/Vwde) module, a
  teneurin-type EGF-like domain and eight cadherin-like (EC) repeats. A single transmembrane
  helix (residues 1623-1645) is followed by a cytoplasmic tail of about 210 residues that
  contains an SH2 domain. The SH2 domain keeps the FLVR-motif arginine that binds
  phosphotyrosine in other SH2 domains. The EC repeats lack the canonical DXNDN-type
  calcium-binding motifs and the PROSITE cadherin signature, so they are divergent. The
  domain arrangement (VWD, EGF, EC repeats, TM, cytoplasmic SH2) is shared with Monosiga
  brevicollis MBCDH12. The protein has no cytoplasmic cadherin domain (Pfam Cadherin_C), the
  beta-catenin-binding module that defines classical cadherins. Choanoflagellates lack
  classical cadherins, and S. rosetta rosette cells are joined by cytoplasmic bridges and
  extracellular matrix rather than adherens junctions. There are no experimental data on the
  protein. Its expression, localization, ligands, adhesive activity and SH2-binding partners
  are all unknown.
