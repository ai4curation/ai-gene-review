core_functions:
- description: >-
    Single-pass transmembrane protein with divergent extracellular cadherin-like repeats, VWD
    and EGF modules, and a cytoplasmic SH2 domain that keeps the phosphotyrosine-binding FLVR
    arginine. The architecture suggests a cell-surface receptor that could couple
    extracellular binding to tyrosine-phosphorylation signalling. No ligand, partner or
    activity has been measured, and it is not a classical (catenin-binding) cadherin.
