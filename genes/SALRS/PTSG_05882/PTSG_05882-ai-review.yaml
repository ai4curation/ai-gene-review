    summary: >-
      TreeGrafter transfer from PANTHER node PTN000616280, which PAINT records at
      taxon:33213 (Bilateria). Its IBD for cell morphogenesis is seeded by vertebrate classical
      cadherins (mouse Cdh1, Cdh4, Cdh5 and Cdh11, chicken CDH2 and zebrafish genes). F2UD23 is not a member of that
