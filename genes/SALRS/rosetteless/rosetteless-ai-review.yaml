existing_annotations:
- term:
    id: GO:0031012
    label: extracellular matrix
  evidence_type: IDA
  original_reference_id: PMID:25299189
  review:
    summary: >-
      Immunofluorescence with an epitope-validated anti-Rtls antibody shows Rtls as
      a thick extracellular layer at the basal poles of rosette cells, filling the
      rosette interior; the signal is lost when the antibody is pre-competed with
      its epitope and is absent from Rosetteless mutant cells. The CRISPR allele
      likewise abolishes secretion of Rtls into the rosette interior. Later work
      treats this basal material as the rosette extracellular matrix.
    action: NEW
    reason: >-
      GOA has no annotations for this protein. Extracellular matrix is the
      best-supported location: the protein is secreted and forms a structured
      extracellular layer between cells rather than diffusing into the medium.
      GO:0031012 (a structure external to cells providing structural support or
      cues) fits better than the generic extracellular region.
    additional_reference_ids:
