    - reference_id: PMID:25299189
      supporting_text: >-
        Rosetteless protein is essential for rosette development and forms an
        extracellular layer that coats and connects the basal poles of each cell in
        rosettes.
    - reference_id: PMID:32496191
      supporting_text: >-
        Mutations in rosetteless prevent the secretion of Rosetteless protein at the
        basal end of cells and into the interior or rosettes.
    - reference_id: PMID:30556809
      supporting_text: >-
        the localization of Rosetteless protein to the rosette interior suggests
        that it functions as part of the extracellular matrix (ECM)
core_functions:
- description: >-
    Secreted structural component of the basal extracellular matrix of S. rosetta
    rosette colonies. Rtls is deposited at the basal pole of each cell and, during
    rosette development, forms an extracellular layer that fills the colony
    interior and connects neighbouring cells; loss of the protein (splice-site or
    CRISPR alleles) or antibody blockade abolishes rosette formation without
    affecting growth or chain-colony formation. The molecular basis of its
    activity (for example, whether its C-type lectin-like domains bind glycans on
    other matrix components) is unknown.
  molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:25299189
    supporting_text: >-
      Rosetteless protein is essential for rosette development and forms an
      extracellular layer that coats and connects the basal poles of each cell in
      rosettes.
  - reference_id: PMID:25299189
    supporting_text: >-
      Therefore, we conclude that the function of secreted Rtls is specific to and
      essential for rosette development.
  - reference_id: PMID:32496191
    supporting_text: >-
      The rosetteless C-type lectin gene is necessary for rosette development.
  knowledge_gaps:
  - gap_statement: >-
      The structural-constituent molecular function is inferred from the protein's
      extracellular location and the loss-of-function phenotype; no biochemical
      activity has been measured. Whether the two C-type lectin-like domains bind
      carbohydrate, and which matrix components Rtls contacts, has not been
      tested. For this reason GO:0005201 is used here only to describe the core
      function and is deliberately not proposed as a NEW annotation.
proposed_new_terms:
- proposed_name: rosette colony development
  proposed_definition: >-
    The developmental process in a unicellular colonial organism by which a single
    founding cell undergoes repeated incomplete cytokinesis, with daughter cells
    remaining attached, to form a spherical rosette colony held together by
    intercellular bridges and a shared basal extracellular matrix. Exemplified by
    rosette formation in the choanoflagellate Salpingoeca rosetta.
  justification: >-
    Rosette development in S. rosetta has a defined genetic basis (rosetteless,
    jumble, couscous, Hippo pathway genes) but GO has no term for clonal colony
    development in a unicellular organism. GO:0007275 multicellular organism
    development is not taxon-excluded from choanoflagellates, but GO models
    Dictyostelium sorocarp development (GO:0030587) outside GO:0007275 (under
    GO:0048856 anatomical structure development and GO:0099120 socially cooperative
    development), so placing colony formation under GO:0007275 would be a
    modelling decision for the ontology editors. A candidate parent is GO:0048856.
  supported_by:
  - reference_id: PMID:25299189
    supporting_text: >-
      Therefore, we conclude that the function of secreted Rtls is specific to and
      essential for rosette development.
suggested_questions:
- question: >-
    Do the C-type lectin-like domains of Rtls bind carbohydrate, and are they
    needed for rosette development? A CRISPR allele that removes or mutates the
    CTLDs, or recombinant-domain glycan-array binding, would answer this.
- question: >-
    UniProt names F2U5Y1 "Lung surfactant protein A", a label carried over from the
    genome project's EMBL record. Should the name be changed to Rosetteless, given
    that it has a literature name and no demonstrated similarity of function to
    animal surfactant protein A?
- question: >-
    Should GO add a term for clonal colony (rosette) development, or should such
    processes be annotated to GO:0007275 multicellular organism development?
suggested_experiments:
- experiment_type: Domain deletion by genome editing
  description: >-
    Delete or point-mutate each C-type lectin-like domain in the endogenous rtls
    locus and test rosette development and Rtls secretion, to separate a
    glycan-binding role from a purely structural one.
- experiment_type: Glycan binding assay
  description: >-
    Express the CTLDs recombinantly and test binding to a glycan array and to
    matrix material isolated from wild-type versus jumble and couscous rosettes.
- experiment_type: Interaction proteomics
  description: >-
    Immunoprecipitate Rtls from induced rosette cultures and identify
    co-purifying matrix proteins and glycoproteins.
