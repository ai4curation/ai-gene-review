taxon:
  id: NCBITaxon:946362
  label: Salpingoeca rosetta
description: >-
  Rosetteless (Rtls) is a secreted C-type lectin-like protein of the colonial
  choanoflagellate Salpingoeca rosetta, one of the closest living relatives of
  animals. The 119 kDa protein has an N-terminal signal peptide, two C-type
  lectin-like domains, serine/threonine-rich mucin-like stretches that are
  predicted to be heavily O-glycosylated, and two internal repeats of unknown
  function; carbohydrate binding by its lectin domains has not been tested.
  Rtls is required specifically for rosette development, the clonal process
  by which a single founding cell divides without separating to form a
  spherical colony in response to sulfonolipid signals from Algoriphagus
  bacteria. A mapped splice-site allele, an independent CRISPR-engineered
  premature-stop allele, and function-blocking antibodies all abolish rosette
  formation, while cell growth, chain-colony formation and swimming are
  unaffected. The protein is secreted at the basal pole of each cell; in
  rosettes it forms a thick extracellular layer that fills the colony
  interior and connects the basal poles of neighbouring cells, and in single
  cells and chains it is seen as weak membrane-associated patches and material
  deposited on the substrate. This localisation, and the fact that the other
  two genes known to be required for rosette development encode predicted
  glycosyltransferases needed for Rtls upregulation and secretion, indicate
  that Rtls acts as a component of the basal extracellular matrix that holds
  rosette cells together.
references:
- id: PMID:25299189
  title: The Rosetteless gene controls development in the choanoflagellate S. rosetta.
  findings:
  - statement: >-
      A forward genetic screen identified the Rosetteless mutant, which fails to
      form rosettes but grows normally and forms normal chain colonies.
    supporting_text: >-
      Rosetteless cultures did not form rosettes in ACM, but otherwise appeared in
      wild type, forming normal chain colonies
  - statement: >-
      The causative lesion is a splice-donor mutation in rtls (EGD82922), which
      encodes a secreted protein with two C-type lectin-like domains.
    supporting_text: >-
      The rtls gene encodes a 119 kDa protein with an N-terminal signal peptide and
      two C-type lectin-like domains (CTLDs; Figure 5A).
  - statement: >-
      Function-blocking antibodies against Rtls inhibit rosette development in wild
      type cells without affecting growth.
    supporting_text: >-
      Therefore, we conclude that the function of secreted Rtls is specific to and
      essential for rosette development.
  - statement: >-
      In rosettes, Rtls forms a thick extracellular layer at the basal poles of the
      cells.
    supporting_text: >-
      In rosettes, Rtls (cyan) was detected as a thick layer associated with the
      basal poles of the cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary paper; full text cached. Establishes the genotype to
      phenotype link, domain architecture and extracellular localisation. The
      authors note complementation was not possible at the time; the later CRISPR
      allele (PMID:32496191) supplies the independent confirmation.
- id: PMID:32496191
  title: Genome editing enables reverse genetics of multicellular development in the
    choanoflagellate Salpingoeca rosetta.
  findings:
  - statement: >-
      An independent CRISPR-engineered premature-termination allele of rosetteless
      abolishes rosette development and secretion of Rosetteless protein.
    supporting_text: >-
      Mutations in rosetteless prevent the secretion of Rosetteless protein at the
      basal end of cells and into the interior or rosettes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text cached. Confirms the 2014 forward-genetic result
      with a targeted allele.
- id: PMID:30556809
  title: Predicted glycosyltransferases promote development and prevent spurious cell
    clumping in the choanoflagellate S. rosetta.
  findings:
  - statement: >-
      In jumble and couscous glycosyltransferase mutants, Rosetteless reaches the
      basal pole but is not upregulated or secreted upon rosette induction.
    supporting_text: >-
      In both Jumble and Couscous cells, Rosetteless protein properly localized to
      the basal pole, but its expression did not increase nor was it secreted upon
      treatment with RIFs, as normally occurs in wild type cells
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text cached. Primary paper for jumble and couscous;
      relevant here for the Rtls secretion phenotype in those mutants.
- id: PMID:41037400
  title: A selection-based knockout approach for a choanoflagellate reveals regulation
    of multicellular development by Hippo signaling.
  findings:
  - statement: >-
      rosetteless was inactivated again with a selection-based CRISPR knockout
      pipeline, as one of three known regulators of multicellular development.
    supporting_text: >-
      We inactivated three known S. rosetta multicellular developmental regulators
      (rosetteless, couscous, and jumble)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; only the abstract is cached, so knockout phenotype details
      were not checked.
- id: PMID:31896587
  title: Biophysical principles of choanoflagellate self-organization.
  findings:
  - statement: >-
      All three genes known to be required for rosette development act on the
      extracellular matrix.
    supporting_text: >-
      Interestingly, all 3 genes known to be required for rosette development are
      regulators of the extracellular matrix (ECM)
  reference_review:
