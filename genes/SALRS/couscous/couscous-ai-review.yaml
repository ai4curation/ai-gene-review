- term:
    id: GO:0046354
    label: mannan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001270341
  review:
    summary: >-
      TreeGrafter transfer from the fungal MNN2 family, where Mnn2 builds the branched
      mannose outer chains of cell-wall mannoproteins. The GO term is defined as
      synthesis of mannan, "the main hemicellulose of soft (coniferous) wood, made up of
      D-mannose, D-glucose and D-galactose". S. rosetta has no fungal-type mannan cell
      wall, and the only glycan change detected in couscous mutants is loss of a
      jacalin-reactive glycan at the basal pole, not a mannan [PMID:30556809].
    action: REMOVE
    reason: >-
      The term describes polysaccharide (hemicellulose/cell-wall mannan) biosynthesis, a
      fungal/plant-lineage function that the TreeGrafter node carries over from yeast
      Mnn2. There is no evidence that choanoflagellates synthesize a mannan
      polysaccharide, and Couscous substrates are unknown. The appropriate process for a
      glycoprotein-modifying mannosyltransferase is already captured by glycoprotein
      biosynthetic process. This is an over-propagated electronic inference that can be
      argued against on biological grounds.
    supported_by:
    - reference_id: PMID:30556809
      supporting_text: >-
        MNN2 proteins catalyze the addition of the first branch of mannose-containing
        oligosaccharides found on cell wall proteins
    - reference_id: PMID:30556809
      supporting_text: >-
        In contrast with wild type cells, the basal patch of jacalin staining was absent
        or significantly diminished in Couscous and Jumble mutants
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001270341
        source_label: MNN2-family alpha-1,2-mannosyltransferase node (PTHR31646)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The GO:0046354 IBD on this node is seeded only by Candida albicans MNN2-family
          genes (all 56 IBA rows from the node list the same six CGD seeds; QuickGO
          2026-10-01), yet it reaches oomycetes, green algae and choanoflagellates. A
          fungal cell-wall mannan process does not transfer to a choanoflagellate enzyme
          acting on the rosette basal matrix.
core_functions:
- description: >-
    Predicted alpha-1,2-mannosyltransferase (MNN2-family, GT-A fold with conserved DXD
    motif) that is required for a basal-pole, jacalin-reactive glycosylation pattern of
    the extracellular matrix. The activity, donor and acceptor are inferred by homology
    and from the rescuable glycan defect of the loss-of-function mutant; they have not
    been measured biochemically.
  molecular_function:
    id: GO:0000026
    label: alpha-1,2-mannosyltransferase activity
  directly_involved_in:
  - id: GO:0009101
    label: glycoprotein biosynthetic process
  supported_by:
  - reference_id: PMID:30556809
    supporting_text: >-
      The predicted mannosyltransferase domain shares 28% and 35% amino acid sequence
      identity to alpha 1–2 mannosyltransferase (MNN2) proteins in Saccharomyces
      cerevisiae and Candida albicans, respectively, including the conserved DXD motif
      found in many families of glycosyltransferases
  - reference_id: PMID:30556809
    supporting_text: >-
      In contrast with wild type cells, the basal patch of jacalin staining was absent or
      significantly diminished in Couscous and Jumble mutants, both in the presence and
      absence of RIFs
  - reference_id: PMID:30556809
    supporting_text: >-
      Thus, the glycosylation defects in Jumble and Couscous mutant cells were directly
      linked to the genetic lesions in jumble and couscous, respectively.
suggested_questions:
- question: >-
    Does Couscous have mannosyltransferase activity in vitro, and what are its donor
    (GDP-mannose?), linkage and acceptor specificities?
- question: >-
    Where does native Couscous reside - Golgi, ER, or a post-Golgi/secretory
    compartment - and is its N-terminal hydrophobic segment a cleaved signal peptide or
    a type II signal anchor?
- question: >-
    Which glycoproteins carry the Couscous-dependent basal jacalin epitope, and is
    Rosetteless (with its mucin-like Ser/Thr repeats) or a cadherin among them?
- question: >-
    Is the loss of basal glycans in couscous mutants caused by missing glycosylation or
    by defective trafficking of glycoconjugates to the basal pole?
- question: >-
    What does the PAN/Apple domain contribute - substrate recognition, dimerization or
    binding to extracellular partners?
- question: >-
    How does Hippo pathway (Warts/Yorkie) regulation of couscous expression relate to
    rosette size control?
suggested_experiments:
- hypothesis: Couscous is an active alpha-1,2-mannosyltransferase.
  description: >-
    Express the soluble luminal domain (with and without the PAN domain, and a DXD-motif
    mutant) and assay transfer from GDP-mannose to mannoside acceptors (e.g.
    alpha-1,6-mannobiose, Man-alpha-O-Ser/Thr peptides), with linkage determined by
    NMR or exoglycosidase digestion.
  experiment_type: biochemical enzyme assay
- hypothesis: Native Couscous resides in an early secretory compartment.
  description: >-
    Endogenously tag couscous at its locus by CRISPR knock-in (avoiding overexpression)
    and co-image with ER (HDEL) and Golgi markers; complement with immunostaining using
    an anti-Couscous antibody.
  experiment_type: localization / imaging
- hypothesis: Couscous glycosylates specific ECM or adhesion glycoproteins, including Rosetteless.
  description: >-
    Jacalin affinity enrichment and comparative glycoproteomics of wild-type versus
    couscous knockout cells, with site-level glycan mapping on Rosetteless and cadherins.
  experiment_type: glycoproteomics
- hypothesis: Couscous catalytic activity, not only protein presence, is required for rosette development.
  description: >-
    Complement couscous knockout cells with wild-type couscous versus a DXD-motif
    catalytic mutant and score rosette formation, clumping and basal jacalin staining.
  experiment_type: genetic complementation
