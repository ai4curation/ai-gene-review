id: F2UJ78
gene_symbol: couscous
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:946362
  label: Salpingoeca rosetta
description: >-
  couscous (PTSG_07368) encodes an 866-residue predicted glycosyltransferase of the
  choanoflagellate Salpingoeca rosetta. The protein has an N-terminal hydrophobic
  signal sequence/anchor, a PAN/Apple domain, and a C-terminal alpha-mannosyltransferase
  domain (Pfam Mannosyl_trans3) belonging to the fungal MNN2/MNN5 alpha-1,2-mannosyltransferase
  family, with which it shares 28-35% identity and a conserved DXD motif. Its enzymatic
  activity, sugar donor and acceptor substrates have not been determined. A frameshift
  loss-of-function allele (couscous lw1, originally isolated as the "Branched" mutant)
  abolishes development of clonal multicellular rosettes and instead causes cells to
  aggregate promiscuously into shear-sensitive clumps, including with wild-type cells;
  both defects are rescued by transgenic wild-type couscous. Mutant cells lose a basal
  patch of jacalin-reactive glycans that normally marks the basal extracellular matrix
  and fills the rosette interior, and they fail to upregulate and secrete the C-type
  lectin Rosetteless upon rosette induction, suggesting that Couscous-dependent
  glycosylation contributes to maturation of the basal extracellular matrix. A tagged,
  overexpressed Couscous fusion localized to cytoplasmic puncta, the collar and the cell
  membrane rather than to the Golgi apparatus, so its native compartment is unresolved.
  couscous expression is regulated by the Hippo pathway components Warts and Yorkie.
existing_annotations:
- term:
    id: GO:0000026
    label: alpha-1,2-mannosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001270341
  review:
    summary: >-
      TreeGrafter transfer from the PANTHER PTHR31646 (alpha-1,2-mannosyltransferase
      MNN2) family node. Couscous carries a Mannosyl_trans3 domain that aligns with the
      alpha-mannosyltransferase domain of yeast and Candida MNN2 at 28-35% identity,
      including the conserved DXD motif required for nucleotide-sugar/metal binding in
      GT-A fold glycosyltransferases [PMID:30556809]. No enzymatic assay has been
      performed, so the activity, linkage and acceptor remain predictions.
    action: ACCEPT
    reason: >-
      The catalytic domain places Couscous within a family whose characterized members
      (S. cerevisiae Mnn2, Mnn5) are alpha-1,2-mannosyltransferases, and the DXD motif is
      retained, so there is no sequence evidence of catalytic loss. Loss-of-function
      mutants show a specific, rescuable glycan (jacalin) defect consistent with a
      glycosyltransferase [PMID:30556809]. This is the best-supported description of the
      molecular activity, accepted as a homology-based prediction; the alpha-1,2 linkage
      specificity in particular has not been tested in a choanoflagellate and the acceptor
      is unknown.
    supported_by:
    - reference_id: PMID:30556809
      supporting_text: >-
        The predicted mannosyltransferase domain shares 28% and 35% amino acid sequence
        identity to alpha 1–2 mannosyltransferase (MNN2) proteins in Saccharomyces
        cerevisiae and Candida albicans, respectively, including the conserved DXD motif
        found in many families of glycosyltransferases
    - reference_id: PMID:30556809
      supporting_text: >-
        While we have not uncovered the target(s) of the predicted glycotransferases or
        the exact nature of the interplay between the two phenotypes
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0134
  review:
    summary: >-
      UniProt subcellular-location mapping (ARBA rule) assigning the family-typical Golgi
      type II membrane protein topology. The only experimental localization of Couscous
      (C-terminal mWasabi fusion overexpressed from the efl promoter) found puncta in the
      cytosol, collar and cell membrane, and the authors state it was clearly not at the
      Golgi, while cautioning that tagging or overexpression may have mislocalized it
      [PMID:30556809].
    action: UNDECIDED
    reason: >-
      The family default (Golgi, as for yeast Mnn2) conflicts with the one direct
      observation, which placed tagged Couscous outside the Golgi (possibly ER, untested).
      The authors themselves conclude localization is uncertain, and the N-terminal
      hydrophobic segment is ambiguous between a cleaved signal peptide and a type II
      signal anchor. Neither accepting nor removing the Golgi assignment is justified
      until native localization is determined.
    supported_by:
    - reference_id: PMID:30556809
      supporting_text: >-
        While Couscous-mWasabi was clearly not localized to the Golgi, the puncta may
        co-localize with the ER, where glycosyltransferases are also known to function
    - reference_id: PMID:30556809
      supporting_text: >-
        Therefore, we are currently uncertain about the subcellular localization of
        Couscous protein.
- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN001270341
  review:
    summary: >-
      TreeGrafter transfer of the Golgi location of fungal MNN2-family
      mannosyltransferases. Tagged Couscous did not localize to the Golgi in S. rosetta,
      in contrast to the other rosette-defect glycosyltransferase Jumble, which did
      [PMID:30556809].
    action: UNDECIDED
    reason: >-
      Same conflict as for Golgi membrane: a family-level expectation versus a single
      overexpressed-fusion observation that the authors regard as possibly artefactual.
      Kept undecided pending native localization (antibody staining or endogenous
      tagging with a Golgi marker).
    supported_by:
    - reference_id: PMID:30556809
      supporting_text: >-
        Consistent with its role as a glycosyltransferase, Jumble localized to the Golgi
        apparatus, but Couscous appeared to localize in cytoplasmic puncta and to the cell
        membrane.
- term:
    id: GO:0009101
    label: glycoprotein biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027560
  - InterPro:IPR022751
  review:
    summary: >-
      Combined ARBA/InterPro inference from the alpha-mannosyltransferase domain.
      MNN2-family enzymes extend the mannose outer chains of N- and O-linked glycans on
      glycoproteins. Couscous loss-of-function mutants lose a basal patch of
      jacalin-reactive glycans in the extracellular matrix, rescued by the wild-type gene
      [PMID:30556809].
    action: ACCEPT
    reason: >-
      A glycosyltransferase would do the catalytic work of adding sugars to glycoproteins,
      so this process term fits the predicted activity. It is general enough to cover the
      uncertainty about which glycan class (N- or O-linked) and which acceptor proteins
      are modified. The rescuable glycan defect in the mutant supports a role in
      glycoconjugate synthesis, although the authors do not exclude an indirect
      trafficking effect. No more specific child term (e.g. protein N-linked
      glycosylation) is justified without acceptor identification.
    supported_by:
    - reference_id: PMID:30556809
      supporting_text: >-
        The predicted Couscous amino acid sequence contains a specific type of
        glycosyltransferase domain, an alpha-mannosyltransferase domain, that transfers
        activated mannose onto the outer chain of core N-linked polysaccharides and
        O-linked mannotriose
    - reference_id: PMID:30556809
      supporting_text: >-
        The same was true for Couscous cells, in which transformation with couscous-mTFP
        rescued both rosette development and the wild type glycosylation pattern
