- id: PMID:30556809
  title: Predicted glycosyltransferases promote development and prevent spurious cell
    clumping in the choanoflagellate S. rosetta.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary paper for couscous; full text cached. Names the gene, gives GenBank
      EGD77026 / XM_004990809 (matching UniProt F2UJ78), and reports mapping, rescue,
      localization and glycosylation data.
  findings:
  - statement: >-
      couscous loss-of-function mutants fail to form rosettes and aggregate into
      amorphous, shear-sensitive clumps.
    supporting_text: >-
      For this study, we focused on four Class C mutants — Seafoam, Soapsuds, Jumble, and
      Couscous (previously named Branched in Levin et al., 2014) — that form amorphous,
      tightly packed clumps of cells, both in the presence and absence of RIFs, but never
      develop into rosettes
  - statement: >-
      The causative lesion is a single-nucleotide deletion producing a frameshift and
      early stop codon in couscous (EGD77026).
    supporting_text: >-
      The mutation causes a predicted frameshift leading to an early stop codon in the
      mutant protein, Couscouslw1
  - statement: Transgenic wild-type couscous rescues rosette development.
    supporting_text: >-
      Rosette formation in Couscous mutant cells can be rescued by transgenic expression
      of couscous-mTFP or mTFP-couscous, but not couscouslw1-mTFP, mTFP-couscouslw1, or
      mTFP alone.
  - statement: >-
      Couscous contains an alpha-mannosyltransferase domain related to fungal MNN2 with a
      conserved DXD motif, plus a PAN/Apple domain.
    supporting_text: >-
      The predicted mannosyltransferase domain shares 28% and 35% amino acid sequence
      identity to alpha 1–2 mannosyltransferase (MNN2) proteins in Saccharomyces
      cerevisiae and Candida albicans, respectively, including the conserved DXD motif
      found in many families of glycosyltransferases
  - statement: Tagged Couscous did not localize to the Golgi; native localization is unresolved.
    supporting_text: >-
      While Couscous-mWasabi was clearly not localized to the Golgi, the puncta may
      co-localize with the ER, where glycosyltransferases are also known to function
  - statement: >-
      Mutants lose basal-pole jacalin staining; rescue restores the glycosylation pattern.
    supporting_text: >-
      The same was true for Couscous cells, in which transformation with couscous-mTFP
      rescued both rosette development and the wild type glycosylation pattern
  - statement: >-
      In couscous mutants Rosetteless localizes basally but is not upregulated or
      secreted after rosette induction.
    supporting_text: >-
      In both Jumble and Couscous cells, Rosetteless protein properly localized to the
      basal pole, but its expression did not increase nor was it secreted upon treatment
      with RIFs, as normally occurs in wild type cells
- id: PMID:25299189
  title: The Rosetteless gene controls development in the choanoflagellate S. rosetta.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Original forward-genetic screen in which the couscous mutant was isolated under the
      name Branched; the gene was not mapped in this paper.
  findings:
  - statement: >-
      The Branched (later Couscous) mutant class forms branched chain colonies and no
      rosettes.
    supporting_text: >-
      In contrast, classes D–F developed into highly branched chain colonies
- id: PMID:31896587
  title: Biophysical principles of choanoflagellate self-organization.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Background citation framing couscous as an ECM regulator; no new couscous data.
  findings:
  - statement: couscous is one of three genes known to be required for rosette development.
    supporting_text: >-
      Interestingly, all 3 genes known to be required for rosette development are
      regulators of the extracellular matrix (ECM): a C-type lectin called rosetteless
      (18) and 2 predicted glycosyltransferases called jumble and couscous (19).
- id: PMID:41037400
  title: A selection-based knockout approach for a choanoflagellate reveals regulation
    of multicellular development by Hippo signaling.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Only the abstract is cached. Reports CRISPR knockout of couscous (phenotype details
      not in the abstract) and Warts/Yorkie-dependent regulation of couscous expression.
  findings:
  - statement: couscous was inactivated with a CRISPR-Cas9 selection-based knockout method.
    supporting_text: >-
      We inactivated three known S. rosetta multicellular developmental regulators
      (rosetteless, couscous, and jumble)
  - statement: Warts and Yorkie regulate couscous expression.
    supporting_text: >-
      RNA sequencing revealed that Warts and Yorkie regulated several extracellular matrix
      genes involved in multicellularity (including couscous)
