  review:
    summary: >-
      Combined InterPro/UniRule inference from the septin family (IPR016491) and
      septin-type G domain (IPR030379) signatures. SrSeptin6 has a complete
      septin-type G domain with G1, G3 and G4 motifs and PIRSR-predicted GTP
      contact residues. Nucleotide binding has not been measured.
    action: ACCEPT
    reason: >-
      Guanine-nucleotide binding is a family-wide property of septin G domains,
      including those septins thought to have lost GTPase activity, so GTP
      binding is the appropriate molecular function to transfer. No GTPase
      activity is asserted.
