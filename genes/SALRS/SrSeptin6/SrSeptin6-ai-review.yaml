suggested_questions:
- question: >-
    Does SrSeptin6 retain GTPase activity? Mammalian SEPT6-group septins are
    commonly described as GTPase-deficient; whether the choanoflagellate Group 1B
    septin shares this has not been examined.
- question: >-
    Is SrSeptin6 needed for the basal localisation of SrSeptin2, and for rosette
    development? No septin knockout has been reported.
suggested_experiments:
- experiment_type: Gene knockout by genome editing
  description: >-
    Inactivate PTSG_06009 and test rosette development and the localisation of
    tagged SrSeptin2.
- experiment_type: In vitro GTPase assay
  description: >-
    Purify SrSeptin6 alone and with SrSeptin2 and measure nucleotide binding
    and GTP hydrolysis.
