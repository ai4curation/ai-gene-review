  review:
    summary: >-
      UniRule transfer from the septin family. SrSeptin6 (Group 1B) colocalises
      with SrSeptin2 (Group 4) at the basal pole, which the authors interpret as
      co-assembly into heteromeric filaments. No S. rosetta septin complex has
      been isolated.
    action: ACCEPT
    reason: >-
      Heteromeric complex formation is a defining property of septins, and
      S. rosetta has septins from more than one group. The colocalisation data
      are consistent with this. The annotation is appropriate as electronic
      evidence.
    supported_by:
    - reference_id: PMID:30281390
