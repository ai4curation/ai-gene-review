  label: Salpingoeca rosetta
description: >-
  SrSeptin6 is one of three septin GTPases of the colonial choanoflagellate
  Salpingoeca rosetta. Phylogenetic analysis places it in septin Group 1B, with
  the mammalian SEPT6 family. The 420-residue protein has a septin-type G domain
  with the G1, G3 and G4 GTP-binding motifs, a C-terminal coiled coil and a
  basic disordered tail. When expressed as a fluorescent fusion it is enriched
  at the basal pole of the cell, matching the paralogue SrSeptin2 (a Group 4,
  Cdc12-like septin), and the two proteins colocalise. Together with their
  sequence homology to septins known to form heteromeric filaments, this
  suggests that SrSeptin6 and SrSeptin2 assemble into a common septin structure
  at the basal pole. No loss-of-function or biochemical data exist, so whether
  it hydrolyses GTP and whether it contributes to rosette colony development
  are untested.
