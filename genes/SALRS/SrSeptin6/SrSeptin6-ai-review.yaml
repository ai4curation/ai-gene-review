core_functions:
- description: >-
    Septin-family GTP-binding protein (Group 1B, SEPT6-like) that localises to
    the basal pole of S. rosetta cells together with SrSeptin2, probably as a
    subunit of a heteromeric septin complex. Its molecular activity is inferred
    from the septin G domain; its biological role has not been tested.
