      - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-bioinformatics/RESULTS.md
        supporting_text: >-
          **Q2U1U6 is the C-terminal end of a ~408-aa protein.**

suggested_questions:
  - question: >-
      Should the AO090138000091 gene model (and UniProt Q2U1U6) be corrected to the
      two-exon ~408-aa structure supported by the A. flavus ortholog A0A7U2MCM8 and the
      RIB40 genome sequence?
  - question: >-
      Does the full-length fungal protein belong to a defined polysaccharide lyase
      family (e.g. a CAZy PL family) when assessed with family-level HMMs rather than
      the superfamily signature alone?
  - question: >-
      Is the 745-aa A. oryzae var. brunneus model A0ABQ6LHX9, which fuses this
      lyase-fold protein to an upstream beta-lactamase-related domain, a merged gene
      model?

suggested_experiments:
  - description: >-
      RNA-seq read mapping or RT-PCR across the predicted 65-nt intron
      (AP007170.1:187011-187075) to confirm the two-exon transcript structure.
    hypothesis: >-
      AO090138000091 is transcribed as a two-exon mRNA encoding a ~408-aa protein.
    experiment_type: transcript structure analysis
  - description: >-
      Recombinant expression of the corrected full-length protein and activity screens
      on uronic-acid-containing polysaccharides (alginate, chondroitin sulfate,
      hyaluronan, heparosan, ulvan), monitoring unsaturated product formation at
      232 nm.
    hypothesis: >-
      The full-length protein is a polysaccharide lyase acting on one of these
      substrates.
    experiment_type: biochemical assay
  - description: >-
      Structure-based search (e.g. Foldseek) of the AlphaFold model of the full-length
      ortholog against characterized lyases, followed by conservation analysis of the
      His/Tyr catalytic positions.
    hypothesis: >-
      The fungal toroid domain retains the catalytic residues of a specific
      characterized polysaccharide lyase family.
    experiment_type: computational structural analysis
