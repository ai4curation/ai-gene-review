status: DRAFT
taxon:
  id: NCBITaxon:510516
  label: Aspergillus oryzae RIB40
description: >-
  Q2U1U6 is the TrEMBL translation of locus AO090138000091 on chromosome 6 of
  Aspergillus oryzae RIB40, an uncharacterized protein whose only signature is the
  chondroitin AC/alginate lyase fold (InterPro IPR008929, SUPFAM SSF48230), an
  alpha/alpha-toroid scaffold shared by bacterial polysaccharide lyases and related
  glycosaminoglycan-modifying enzymes. The annotated product (134 aa) is a truncated
  gene model: it is identical to the C-terminal residues 280-408 of the 408-aa
  ortholog in A. flavus, and the missing N-terminal exon is present in the RIB40 genome
  immediately upstream, joined by a 65-nt intron inside which the annotated start codon
  lies. The full-length product of this locus is therefore expected to be a ~408-aa
  protein carrying a complete lyase-like toroid domain. No family-level (Pfam, PANTHER,
  CAZy) assignment and no experimental data exist for this protein or its fungal
  orthologs, so a polysaccharide lyase activity is a fold-level prediction, and its
  substrate, localization and biological role are unknown.
gene_model_issues:
- issue_type: TRUNCATED_GENE_MODEL
  status: CONFIRMED
  description: >-
    The 134-residue model starts at an ATG inside an intron and omits exon 1. The
    RIB40 genome encodes the missing ~279 N-terminal residues immediately upstream,
    joined by a 65-nt GT...AG intron, and the annotated product is identical to the
    C-terminal residues 280-408 of the 408-residue A. flavus ortholog. Functional
    statements apply to the full-length ~408-residue product, not to this translation.
  evidence_types:
  - ORTHOLOG_COMPARISON
  - GENOMIC_SEQUENCE
  supported_by:
  - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-bioinformatics/RESULTS.md
    supporting_text: Q2U1U6 is a **truncated gene model**
  - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-bioinformatics/RESULTS.md
    supporting_text: intronic ATG and omits exon 1.
