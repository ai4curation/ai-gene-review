core_functions:
  - molecular_function:
      id: GO:0016837
      label: "carbon-oxygen lyase activity, acting on polysaccharides"
    description: >-
      Fold-level prediction only. The full-length product of AO090138000091 (~408 aa,
      once the missed N-terminal exon is restored) carries a complete chondroitin
      AC/alginate lyase alpha/alpha-toroid domain, a fold whose characterized members
      cleave uronic-acid-containing polysaccharides by beta-elimination. No Pfam,
      PANTHER or CAZy family places this fungal protein with any characterized lyase,
      so the substrate is unknown and the activity itself is unverified. The 134-aa
      Q2U1U6 translation contains only the last third of the domain and is not
      expected to be catalytically competent as annotated.
    knowledge_gaps:
      - gap_statement: >-
          It is unknown whether the full-length AO090138000091 product has any
          polysaccharide lyase (or related epimerase) activity, and if so on which
          substrate; the protein is placed only at the fold level and lacks any
          family-level assignment linking it to characterized enzymes.
        boundary: >-
          The full-length ortholog carries a complete IPR008929/SSF48230 toroid domain;
          characterized members of this fold act on uronic-acid-containing
          polysaccharides.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
      - gap_statement: >-
          It is unknown whether the corrected two-exon transcript is expressed in A.
          oryzae RIB40 and whether the protein is secreted.
        boundary: >-
          Exon 1 and a canonical GT-AG intron are present in the genome; transcript and
          localization evidence have not been examined.
        gap_kind:
          - BIOLOGY
        dark_aspect: CC_DARK
    supported_by:
      - reference_id: UniProt:Q2U1U6
        supporting_text: >-
          InterPro; IPR008929; Chondroitin_lyas.
      - reference_id: UniProt:Q2U1U6
        supporting_text: >-
