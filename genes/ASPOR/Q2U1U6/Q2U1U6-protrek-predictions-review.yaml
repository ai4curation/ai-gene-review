      id: GO:0009036
      label: type II site-specific deoxyribonuclease activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Top-ranked hit (score 10.26). A restriction endonuclease is a bacterial DNA-cleaving
        enzyme with a PD-(D/E)xK nuclease fold; this protein has an alpha/alpha-toroid
        polysaccharide-lyase fold and acts on carbohydrate, not DNA. Nothing connects the
        two. The score is in the benchmark's bottom quartile, consistent with the retrieval
        having found no real neighbour for this short sequence.
      supported_by:
