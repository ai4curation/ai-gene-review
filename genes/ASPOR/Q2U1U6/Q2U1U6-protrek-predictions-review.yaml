id: Q2U1U6
gene_symbol: AO090138000091
taxon:
  id: NCBITaxon:510516
  label: Aspergillus oryzae RIB40
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a 134-aa Aspergillus oryzae protein carrying a
  chondroitin-lyase-superfamily fold (IPR008929, SSF48230) and predicted to be a
  polysaccharide lyase. The protein has no GOA annotations. All scores are low (10.3
  down to 9.0) and the top of the list is incoherent - type II restriction endonuclease,
  acetone carboxylase, transposase - but the correct chemistry does surface at rank 4:
  gellan lyase activity is a strict descendant of this review's core molecular function
  (carbon-oxygen lyase activity acting on polysaccharides). ProtNLM2 on the same protein
  produced polysaccharide catabolic process and O-glycosyl hydrolase activity, getting
  the substrate class right but the mechanism wrong (lyases eliminate rather than
  hydrolyse). Neither model resolves the substrate, which the sequence evidence does not
  determine either.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 0 less precise (LSP),
  1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
