    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0018710
      label: acetone carboxylase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Rank 2 (score 9.97). Acetone carboxylase is a large multi-subunit bacterial enzyme of
        anaerobic acetone metabolism, unrelated in fold, substrate and taxon. Like rank 1
        this reads as noise rather than a hypothesis; the two together show that when the
        embedding has no good neighbour the returned terms are not merely imprecise but
        arbitrary.
      supported_by:
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-uniprot.txt
          supporting_text: InterPro IPR008929 Chondroitin AC/alginate lyase superfamily
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0016977
      label: chitosanase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 3 (score 9.91). The first hit with any relationship to the sequence: chitosanase
        is a fungal polysaccharide-degrading activity, so the substrate class (a
        glycan) and the taxon are both right, and the retrieval is at least in the
        carbohydrate-active world the domain implies. The mechanism is still wrong -
        chitosanases hydrolyse, while the chondroitin-lyase superfamily eliminates - and no
        chitosanase motifs are present, so it cannot be accepted. Notable that the
        mechanistically correct call (gellan lyase activity, a descendant of this review's
        core function) sits just below at rank 4, meaning the right answer is present in this
        protein's list but not distinguishable by score.
      supported_by:
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-uniprot.txt
          supporting_text: InterPro IPR008929 Chondroitin AC/alginate lyase superfamily
