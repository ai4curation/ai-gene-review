  - genes/ASPOR/Q2U1U6/Q2U1U6-uniprot.txt
  - genes/ASPOR/Q2U1U6/Q2U1U6-goa.tsv
  - genes/ASPOR/Q2U1U6/Q2U1U6-ai-review.yaml
  - genes/ASPOR/Q2U1U6/Q2U1U6-bioinformatics/RESULTS.md
