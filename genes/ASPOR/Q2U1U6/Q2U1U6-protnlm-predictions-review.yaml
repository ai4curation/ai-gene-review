predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0000272
      label: polysaccharide catabolic process
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      summary: >-
        Scored for the 134-residue Q2U1U6 translation, which is a truncated gene model: it
        corresponds only to residues 280-408 of the ~408-aa full-length product (A. flavus
        ortholog A0A7U2MCM8, 128/129 identity), because the AO090138000091 model starts at an
        ATG inside a 65-nt intron and omits the ~279-codon first exon. In the full-length product
        the chondroitin AC/alginate lyase alpha/alpha-toroid domain (IPR008929, SSF48230, Gene3D
        1.50.10.100) spans residues ~62-371, so this accession carries only roughly the last third
        of the toroid and lacks the rest of the fold. Participation in polysaccharide catabolism
        would require the polysaccharide lyase activity that the complete toroid could confer;
        the 134-aa product is not expected to be catalytically competent. Even for the full-length
        gene product the lyase activity is a fold-level, unverified inference with unknown
        substrate, and the gene has no GOA annotations.
      supported_by:
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-uniprot.txt
          supporting_text: >-
            ID   Q2U1U6_ASPOR            Unreviewed;       134 AA. ... DR   InterPro; IPR008929; Chondroitin_lyas.
            ... DR   SUPFAM; SSF48230; Chondroitin AC/alginate lyase; 1.
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-bioinformatics/RESULTS.md
          supporting_text: >-
            **Q2U1U6 is the C-terminal end of a ~408-aa protein.**
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-bioinformatics/RESULTS.md
          supporting_text: >-
            Q2U1U6 covers
            only residues 280-371 of that domain (its SSF48230 match is residues 6-97), i.e.
            roughly the last third of the alpha/alpha toroid.
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-bioinformatics/RESULTS.md
          supporting_text: >-
            The full-length protein has no PANTHER family or Pfam family assignment;
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-hypotheses/prediction-glycoside-hydrolase/openscientist.md
          supporting_text: >-
            No positive evidence for catalysis of any kind.
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0004553
      label: hydrolase activity, hydrolyzing O-glycosyl compounds
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      summary: >-
        The protein's only signature is the chondroitin AC/alginate lyase alpha/alpha-toroid fold
        (IPR008929, SSF48230), whose characterized members cleave uronic-acid-containing
        polysaccharides by beta-elimination rather than hydrolysis. The full-length product of the
        truncated gene model has no Pfam, PANTHER or CAZy glycoside hydrolase family assignment, and
        the re-reviewed gene's core function is a fold-level carbon-oxygen lyase activity acting on
        polysaccharides. No experimental evidence or literature exists for any glycosidase activity.
        The O-glycosyl hydrolase prediction transfers a hydrolytic activity onto a lyase fold and is
        discordant with the only available domain evidence.
      supported_by:
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-uniprot.txt
          supporting_text: >-
            ID   Q2U1U6_ASPOR            Unreviewed;       134 AA. ... DR   InterPro; IPR008929; Chondroitin_lyas.
            ... DR   SUPFAM; SSF48230; Chondroitin AC/alginate lyase; 1.
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-bioinformatics/RESULTS.md
          supporting_text: >-
            The full-length protein has no PANTHER family or Pfam family assignment;
        - reference_id: file:ASPOR/Q2U1U6/Q2U1U6-hypotheses/prediction-glycoside-hydrolase/openscientist.md
          supporting_text: >-
            Predicting a **hydrolase** from a **lyase** fold is a category error.
