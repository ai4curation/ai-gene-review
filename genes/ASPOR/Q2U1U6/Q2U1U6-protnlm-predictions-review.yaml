id: Q2U1U6
gene_symbol: Q2U1U6
taxon:
  id: NCBITaxon:510516
  label: Aspergillus oryzae RIB40
status: COMPLETE
description: >-
  Q2U1U6 (locus AO090138000091) is a 134-residue TrEMBL translation whose only signature is the
  chondroitin AC/alginate lyase alpha/alpha-toroid fold (IPR008929, SSF48230). It is a truncated
  gene model covering the C-terminal residues 280-408 of a ~408-aa fungal ortholog, so the
  full-length product carries a complete lyase-like toroid domain. The gene review assigns a
  fold-level, unverified polysaccharide lyase activity; no experimental data, family-level
  (Pfam, PANTHER, CAZy) assignment or literature exist for this protein or its fungal orthologs.
  Neither polysaccharide catabolism nor O-glycosyl hydrolase activity is established.
