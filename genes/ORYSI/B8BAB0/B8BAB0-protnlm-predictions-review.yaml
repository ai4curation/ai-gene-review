        - reference_id: file:ORYSI/B8BAB0/B8BAB0-uniprot.txt
          supporting_text: >-
            ID   B8BAB0_ORYSI            Unreviewed;       623 AA. ... DR   InterPro; IPR004873; BURP_dom.
            ... DR   InterPro; IPR051897; PG-associated_BURP. ... DR   PANTHER; PTHR31458:SF2; POLYGALACTURONASE
            1 BETA-LIKE PROTEIN 2; 1. ... FT   SIGNAL          1..21 ... FT   DOMAIN          384..595
            ... FT                   /note="BURP"
        - reference_id: file:ORYSI/B8BAB0/B8BAB0-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            Closest paralog: OsBURP16 (Q7XES5), last common ancestor at the grass
            duplication PTN000779097.
        - reference_id: file:ORYSI/B8BAB0/B8BAB0-hypotheses/prediction-pollen-maturation/openscientist.md
          supporting_text: >-
            is **not** a member of the cereal anther-specific **RAFTIN / BURP-VII** clade
        - reference_id: PMID:14612572
          supporting_text: >-
            the occurrence RAFTIN per se is limited to cereals; neither the Arabidopsis genome nor the vast
            collection of ESTs suggests any obvious dicot homologs
        - reference_id: PMID:19363683
          supporting_text: >-
            Interestingly, all the genes of the BURP
            VII subfamily were predominantly expressed in flower organs.
        - reference_id: PMID:40320839
          supporting_text: >-
            the nal11 and
            burp12 mutants had higher endogenous ABA levels and exhibited lower PG
            (polygalacturonase) activity and higher pectin content during low-temperature
            germination.
