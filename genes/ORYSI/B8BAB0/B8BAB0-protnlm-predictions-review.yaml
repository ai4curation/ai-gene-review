id: B8BAB0
gene_symbol: B8BAB0
taxon:
  id: NCBITaxon:39946
  label: Oryza sativa Indica Group
status: COMPLETE
description: >-
  B8BAB0 is the indica gene model of OsBURP12, a secreted PG1beta-like (PANTHER PTHR31458:SF2)
  BURP-domain protein. Its sequence, family placement and the japonica-allele loss-of-function data
  (burp12 mutants with lower polygalacturonase activity and higher pectin during low-temperature seed
  germination) point to a cell-wall/pectin role. The one ProtNLM2 prediction, pollen maturation, matches
  the function of the separate cereal anther-specific RAFTIN/BURP-VII clade, not the PG1beta-like clade
  that contains B8BAB0.
