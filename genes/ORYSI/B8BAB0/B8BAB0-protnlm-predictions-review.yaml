  - genes/ORYSI/B8BAB0/B8BAB0-uniprot.txt
  - genes/ORYSI/B8BAB0/B8BAB0-goa.tsv
  - genes/ORYSI/B8BAB0/B8BAB0-hypotheses/prediction-pollen-maturation/openscientist.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0010152
      label: pollen maturation
    predicted_term_type: GO_BP
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        B8BAB0 has no GOA annotations, so the term would be novel, but it is not supported. B8BAB0 is
        95.6% identical to japonica OsBURP12 (Q6ZA27) and sits in the PG1beta-like subfamily
        PTHR31458:SF2 with a signal peptide, the PG1beta FxxY/FTNYG repeat region and a C-terminal BURP
        domain; its closest PANTHER paralog is OsBURP16. The reproductive-development precedent in the
        BURP superfamily comes from RAFTIN, an anther-specific, cereal-restricted BURP clade (rice RAFTIN
        RNAi collapses pollen), and from the monocot BURP VII subfamily whose members are flower-predominant.
        The OpenScientist analysis places B8BAB0 outside that clade by full-length alignment (46.5% identity
        to tomato PG1beta versus 28.2% to wheat RAFTIN1A). The only gene-specific experiment, on the
        japonica allele, links OsBURP12 to polygalacturonase activity, pectin content and low-temperature
        seed germination, not pollen. The gene review accepts only extracellular region. The pollen label
        is therefore best explained as a transfer across nonisofunctional BURP paralog clades. No study has
        tested OsBURP12 for a pollen phenotype, so the refutation rests on clade placement rather than a
        negative experiment.
