id: B8BAB0
gene_symbol: B8BAB0
taxon:
  id: NCBITaxon:39946
  label: Oryza sativa subsp. indica
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a rice BURP-domain protein of the PG1beta-like
  subfamily, predicted to be the non-catalytic beta subunit of polygalacturonase isozyme
  1. The protein has no GOA annotations. ProTrek's GO channel misses the family: its top
  hits are hydroxyproline O-galactosyltransferase, exine and two phytase activities,
  none of which fits a non-catalytic secreted subunit. The correct concept does appear,
  but only at rank 5 (polygalacturonase inhibitor activity, a descendant of the review's
  enzyme regulator activity), and the free-text Function channel gets there first,
  returning polygalacturonase descriptions at all of its top three ranks. The result is
  a good illustration of how the two channels differ in what they can express: the
  free-text index contains sentences about polygalacturonase-associated proteins, while
  the GO index only offers catalytic terms near that neighbourhood.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/ORYSI/B8BAB0/B8BAB0-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1990714
      label: hydroxyproline O-galactosyltransferase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PSEUDOENZYME_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 13.50). BURP-domain PG1beta proteins are non-catalytic: they
        associate with polygalacturonase isozyme 1 and modulate its activity, and carry no
        glycosyltransferase fold or donor-binding site. Assigning a catalytic transferase
        activity to a regulatory subunit is the characteristic pseudoenzyme error. The
        retrieval is probably reading the cell-wall/hydroxyproline-rich glycoprotein context
        rather than the BURP domain itself.
      supported_by:
        - reference_id: file:interpro/panther/PTHR31458/PTHR31458-metadata.yaml
          supporting_text: >-
            This family of proteins includes non-catalytic subunits of polygalacturonase as well
            as proteins containing a BURP domain at the C-terminus.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0043668
      label: exine
    predicted_term_type: GO_CC
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 2 (score 13.29). Exine is the sporopollenin outer layer of the pollen wall.
        The protein does carry a signal peptide and is expected in the plant cell wall or
        apoplast, so a wall-associated compartment is not unreasonable, but exine
        specifically is a pollen structure and there is no expression evidence placing this
        protein there. Some BURP-family members are anther- and pollen-expressed, so the
        call cannot be firmly excluded; recorded as uncertain rather than incorrect.
      supported_by:
        - reference_id: file:ORYSI/B8BAB0/B8BAB0-uniprot.txt
          supporting_text: >-
            PANTHER classification PTHR31458:SF2 POLYGALACTURONASE 1 BETA-LIKE PROTEIN 2 and
            InterPro IPR051897 PG-associated BURP domain.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0008707
      label: 4-phytase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PSEUDOENZYME_OVERANNOTATION
      summary: >-
        Rank 3 (score 13.24), with 3-phytase activity immediately behind it at rank 4 - two
        adjacent regiospecificities of the same activity, neither supported. Phytases are
        histidine-acid or purple-acid phosphatases; the BURP domain shares no fold or
        catalytic residues with them. As with rank 1, a catalytic activity is being assigned
        to a protein whose family is defined by not being catalytic.
      supported_by:
        - reference_id: file:ORYSI/B8BAB0/B8BAB0-deep-research-falcon.md
          supporting_text: >-
            OsBURP16 overexpression in rice results in increased polygalacturonase enzyme activity,
            decreased pectin content in cell walls, reduced cell adhesion and cell wall integrity.
