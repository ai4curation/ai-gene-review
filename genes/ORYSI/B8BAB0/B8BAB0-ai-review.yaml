core_functions:
  - description: >-
      Secreted PG1beta-like BURP-domain protein of unknown molecular activity. A signal
      peptide and PG1beta-like family membership indicate export through the secretory
      pathway to the extracellular space. A non-catalytic polygalacturonase-associated
      role, as described for the tomato PG1 beta subunit and inferred for the paralog
      OsBURP16, is a hypothesis only, and the B8BAB0 gene model lacks the fourth BURP CH
      motif.
    locations:
      - id: GO:0005576
        label: extracellular region
    supported_by:
      - reference_id: file:ORYSI/B8BAB0/B8BAB0-uniprot.txt
        supporting_text: FT   SIGNAL          1..21
      - reference_id: file:ORYSI/B8BAB0/B8BAB0-uniprot.txt
        supporting_text: DR   PANTHER; PTHR31458:SF2; POLYGALACTURONASE 1 BETA-LIKE PROTEIN 2; 1.
      - reference_id: PMID:1392611
        supporting_text: >-
          a cell wall protein that associates with, and apparently regulates, the
          catalytic PG2 polypeptides
      - reference_id: file:ORYSI/B8BAB0/B8BAB0-bioinformatics/RESULTS-rereview.md
        supporting_text: >-
          B8BAB0 belongs to the PG1beta-like (PTHR31458) BURP family by HMM membership, the
          repeat-rich variable region and the BURP domain
proposed_new_terms: []
suggested_questions:
  - question: >-
      Is the divergent B8BAB0 C-terminus (lacking the fourth BURP CH motif) supported by
      indica transcript evidence, or is it a gene-model error relative to japonica
      Os08g0380100?
  - question: >-
      Does OsBURP12, like the tomato PG1 beta subunit, bind a catalytic
      polygalacturonase and reside in the cell wall? PAINT propagated cell wall terms
      only within Brassicaceae, so this is open for grass PG1beta-like proteins.
  - question: >-
      Is OsBURP12 a member of the PG1beta-like group in the Ding et al. (2009) rice BURP
      classification, given that Liu et al. (2014) list only OsBURP02, OsBURP14 and
      OsBURP16 while PANTHER places OsBURP12 with OsBURP16?
suggested_experiments:
  - hypothesis: >-
      OsBURP12 is secreted to the cell wall and associates with polygalacturonase.
    description: >-
      Express a full-length OsBURP12 (japonica model) fluorescent fusion in rice and
      determine localization with plasmolysis and cell-wall markers; test association
      with rice PG catalytic subunits by co-immunoprecipitation from cell wall extracts.
    experiment_type: subcellular localization / protein interaction
  - hypothesis: >-
      Loss of OsBURP12 changes polygalacturonase activity and pectin content.
    description: >-
      Generate CRISPR knockouts of OsBURP12, alone and with OsBURP16, and measure PG
      activity, uronic acid content and cell adhesion in leaves.
    experiment_type: loss-of-function / biochemical phenotyping
