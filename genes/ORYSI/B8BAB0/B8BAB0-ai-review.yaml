      label: extracellular region
    evidence_type: ISM
    original_reference_id: file:ORYSI/B8BAB0/B8BAB0-uniprot.txt
    qualifier: located_in
    review:
      summary: >-
        B8BAB0 has no GOA annotations. A SignalP signal peptide (1-21), no predicted
        transmembrane segment or retention signal, and membership of the secreted
        PG1beta-like BURP family support export to the extracellular region. The same
        term is carried by Arabidopsis PGL2 (same PANTHER subfamily) by ISM.
      action: NEW
      reason: >-
        Location is the one property supported by the target's own sequence features.
        The more specific plant-type cell wall is not proposed: no grass PG1beta-like
        protein has been localized, and the PAINT cell-wall IBD (PTN004827911) was placed
        on the Brassicaceae SF10 node only, which does not include this clade.
      supported_by:
        - reference_id: file:ORYSI/B8BAB0/B8BAB0-uniprot.txt
          supporting_text: FT   SIGNAL          1..21
        - reference_id: PMID:1392611
          supporting_text: >-
            a cell wall protein that associates with, and apparently regulates, the
            catalytic PG2 polypeptides
