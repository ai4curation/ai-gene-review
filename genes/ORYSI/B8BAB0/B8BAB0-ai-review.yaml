id: B8BAB0
gene_symbol: B8BAB0
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:39946
  label: Oryza sativa Indica Group
description: >-
  B8BAB0 (ORF OsI_29064, chromosome 8) is the indica rice gene model of OsBURP12, a
  PG1beta-like BURP-domain protein whose japonica allele is Q6ZA27 (Os08g0380100).
  It belongs to the plant-specific polygalacturonase-associated BURP family
  (PANTHER PTHR31458, subfamily SF2, shared with the tomato polygalacturonase 1
  non-catalytic beta subunit, Arabidopsis PGL2 and rice OsBURP16). The predicted
  623-residue protein has an N-terminal signal peptide (1-21), a repeat-rich
  variable region built from FxxY/FTNYG-type units typical of PG1beta proteins, and a
  C-terminal BURP domain (384-595). Compared with its japonica allele, the indica gene
  model lacks about 31 residues of the N-terminal propeptide region and ends in a
  divergent 42-residue tail, so it lacks the fourth CH motif of the BURP domain; this is
  probably a gene-model difference. In the PANTHER tree its nearest paralog is OsBURP16,
  from a grass-specific duplication. The tomato PG1beta subunit is a cell wall protein
  that binds and apparently regulates the catalytic polygalacturonase, and OsBURP16
  overexpression increases polygalacturonase activity and lowers pectin content. By
  family membership B8BAB0 is a secreted, probably cell-wall protein. No activity,
  location or process has been shown experimentally for B8BAB0 or for OsBURP12.
existing_annotations:
