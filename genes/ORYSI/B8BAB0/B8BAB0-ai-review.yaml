      - statement: >-
          In the PANTHER 19 tree the closest paralog is OsBURP16 (grass duplication
          PTN000779097); eudicot PG1beta-like proteins join only at the Mesangiosperma
          node; the PAINT IBD node PTN004827911 (Brassicaceae SF10) does not cover
          this clade.
    reference_review:
