  label: Bordetella bronchiseptica RB50
description: BB1783 is a molybdopterin-enzyme-family protein of Bordetella bronchiseptica RB50, designated
  NicB2 in analysis of its nicotinate catabolic locus. Sequence architecture and pathway context support
  a substrate-binding and catalytic role in nicotinate hydroxylation together with NicA and the cytochrome-containing
  NicB1 protein BB1776. This assignment is based on comparative architecture rather than purified BB1783
  enzymology.
