taxon:
  id: NCBITaxon:257310
  label: Bordetella bronchiseptica RB50
description: NicX is a 343-residue 2,5-dihydroxypyridine ring-cleaving dioxygenase encoded at BB1781 in
  Bordetella bronchiseptica RB50. It is assigned to the NicX family and catalyzes formation of N-formylmaleamate
  in the maleamate branch of aerobic nicotinate degradation. The sequence is also represented at the duplicated
  BB0274 locus. Detailed kinetic and structural properties of the RB50 enzyme remain less well characterized
  than those of Pseudomonas NicX.
existing_annotations:
- term:
    id: GO:0047075
    label: 2,5-dihydroxypyridine 5,6-dioxygenase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: Proposed new core activity, inferred by sequence similarity to experimentally characterized
      KT2440 NicX (UniProtKB:Q88FY1) and supported by the reaction-specific NicX family signature.
    action: NEW
    reason: The RB50 record has no GOA rows, so its NicX activity is not yet annotated. The inference
      rests on two concordant sequence-based lines with an experimental anchor. The protein carries the
      NicX-specific InterPro signature IPR058739 (Pfam PF26233), which aminopeptidase members of the same
      PANTHER family lack. It also shares PANTHER subfamily PTHR34448:SF1 with KT2440 NicX (with/from
      UniProtKB:Q88FY1). Q88FY1 was shown with purified enzyme, product identification, solved structures
      and mutagenesis to cleave 2,5-dihydroxypyridine to N-formylmaleamate. The broad PANTHER family name
      (aminopeptidase) is not used as evidence. A Bordetella-specific meeting abstract
      (DOI:10.1096/fasebj.25.1_supplement.714.2) exists, but its cached record is a truncated fragment
      and is not relied on here. Only the molecular function is proposed; no process term is added,
      because no locus-specific nicX disruption is reported for Bordetella.
    supported_by:
    - reference_id: file:BORBR/nicX/nicX-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR058739; NicX.
    - reference_id: file:BORBR/nicX/nicX-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR34448:SF1; BLL6088 PROTEIN; 1.
    - reference_id: file:PSEPK/nicX/nicX-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Catalyzes the dioxygenolytic ring cleavage of 2,5- dihydroxypyridine between
        carbons 5 and 6 generating N-formylmaleamate in the aerobic nicotinate degradation pathway.'
    - reference_id: PMID:33637718
      supporting_text: We found that four residues of NicX (His265, Ser302, His318, Asp320) coordinate the
        iron(II) ion.
