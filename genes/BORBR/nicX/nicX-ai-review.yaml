  findings:
  - statement: Henke and Snider (FASEB J 2011 meeting abstract) report mechanistic studies of NicX encoded
      by Bordetella bronchiseptica BB1781. The cached record holds only bibliographic metadata and a
      truncated abstract fragment, so no experimental finding from it is asserted in this review.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'Identifier: the DOI resolves in OpenAlex (W2969172080) to this title, authors (Henke MT,
      Snider MJ) and journal (FASEB J 2011, volume 25 meeting supplement), so the identifier is correct.
      Content: Crossref and DataCite do not resolve the DOI, the publisher page refuses automated access,
      and OpenAlex supplies only a truncated abstract fragment. The experimental content could not be
      re-checked from a cached source, so no claim in this review depends on it. A meeting abstract, not
      a full peer-reviewed article.'
