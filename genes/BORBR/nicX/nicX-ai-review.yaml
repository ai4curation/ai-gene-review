  label: Bordetella bronchiseptica RB50
description: NicX is a 343-residue 2,5-dihydroxypyridine ring-cleaving dioxygenase encoded at BB1781 in
  Bordetella bronchiseptica RB50. It is assigned to the NicX family and catalyzes formation of N-formylmaleamate
  in the maleamate branch of aerobic nicotinate degradation. The sequence is also represented at the duplicated
  BB0274 locus. Detailed kinetic and structural properties of the RB50 enzyme remain less well characterized
  than those of Pseudomonas NicX.
