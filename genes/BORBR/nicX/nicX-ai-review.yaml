gene_symbol: nicX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:257310
  label: Bordetella bronchiseptica RB50
description: NicX is a 343-residue 2,5-dihydroxypyridine ring-cleaving dioxygenase encoded at BB1781 in
  Bordetella bronchiseptica RB50. It is assigned to the NicX family and catalyzes formation of N-formylmaleamate
  in the maleamate branch of aerobic nicotinate degradation. The sequence is also represented at the duplicated
  BB0274 locus. Detailed kinetic and structural properties of the RB50 enzyme remain less well characterized
  than those of Pseudomonas NicX.
existing_annotations:
- term:
    id: GO:0047075
    label: 2,5-dihydroxypyridine 5,6-dioxygenase activity
  evidence_type: IDA
  original_reference_id: DOI:10.1096/fasebj.25.1_supplement.714.2
  qualifier: enables
  review:
    summary: Proposed new core activity; BB1781 NicX ring cleavage has direct product evidence plus a NicX-specific
      family signature.
    action: NEW
    reason: The RB50 record has no GOA rows, so the protein currently carries no annotation for its characterized
      activity. Two independent lines agree. First, the Henke and Snider meeting abstract reports product mass
      spectrometry and proton NMR showing that the BB1781 product is a functional NicX; this is primary experimental
      evidence, although published only as an abstract. Second, the protein carries the reaction-specific
      NicX family signature IPR058739 and shares PANTHER subfamily PTHR34448:SF1 with KT2440 NicX, whose ring
      cleavage of 2,5-dihydroxypyridine to N-formylmaleamate was shown with purified enzyme and solved structures.
      The broad PANTHER family name (aminopeptidase) is not used as evidence. This proposes only the molecular
      function; no process term is added, because no locus-specific nicX disruption is reported for Bordetella.
      This revises the earlier decision in the notes file to propose no row; the reason for the change is
      recorded there.
    supported_by:
    - reference_id: file:BORBR/nicX/nicX-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR058739; NicX.
    - reference_id: file:BORBR/nicX/nicX-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR34448:SF1; BLL6088 PROTEIN; 1.
    - reference_id: PMID:33637718
      supporting_text: We found that four residues of NicX (His265, Ser302, His318, Asp320) coordinate the
        iron(II) ion.
