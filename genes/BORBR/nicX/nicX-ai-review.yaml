suggested_questions:
- question: Do the duplicated BB1781 and BB0274 loci differ in expression or physiological deployment
    despite being represented by the same protein sequence?
suggested_experiments:
- description: Publish a full purified-RB50 NicX substrate/product and iron-dependence characterization,
    with locus-specific genetic complementation to establish deployment of each duplicate.
