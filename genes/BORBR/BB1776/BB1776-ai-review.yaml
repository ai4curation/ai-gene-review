  label: Bordetella bronchiseptica RB50
description: BB1776 is a predicted cytochrome-containing redox protein of Bordetella bronchiseptica RB50,
  designated NicB1 in analysis of its nicotinate catabolic locus. It contains three cytochrome c domains
  together with molybdopterin-enzyme-related regions and is proposed to support electron transfer in a
  system that also contains NicA and the separate NicB2 protein BB1783. Its specific physiological electron
  acceptor and catalytic contributions remain incompletely resolved.
