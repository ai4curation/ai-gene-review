- term:
    id: GO:0043709
    label: cell adhesion involved in single-species biofilm formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002554534
  review:
    summary: c-di-GMP synthesis can influence biofilms, but a direct cell-adhesion role is not demonstrated.
    action: MARK_AS_OVER_ANNOTATED
    reason: The TreeGrafter transfer conflates a second-messenger regulator with the adhesion machinery.
      BdcA overproduction enhances biofilms; native deletion had no effect on abiotic-surface or airway-cell
      biofilms in the tested 9.73 background. This does not establish that the RB50 protein executes cell
      adhesion. Retain the demonstrated cyclase role and motility regulation.
    supported_by: &id001
    - reference_id: PMID:31209073
      supporting_text: Overexpression of bdcA in the WT background results in almost complete loss of
        motility and increased c-di-GMP production; this loss of motility and enhanced c-di-GMP production
        are BB2109 dependent.
    - reference_id: PMID:31209073
      supporting_text: Amino acid replacement of GGDEF with GGAAF in BdcA is consistent with the conclusion
        that diguanylate cyclase activity is necessary for biofilm formation and motility regulation,
        although we were unable to confirm the stability of the mutant protein.
