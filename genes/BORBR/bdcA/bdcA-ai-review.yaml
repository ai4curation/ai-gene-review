taxon:
  id: NCBITaxon:257310
  label: Bordetella bronchiseptica RB50
description: BdcA is a membrane-associated Cache–GGDEF diguanylate cyclase of Bordetella bronchiseptica.
  It increases intracellular c-di-GMP and suppresses flagellar motility. Its signalling output requires
  the multidomain protein DdpA/BB2109. Overproduction can enhance biofilm formation, whereas native bdcA
  deletion did not impair biofilms under the tested conditions. The ligand sensed by its Cache domain
  is unknown.
