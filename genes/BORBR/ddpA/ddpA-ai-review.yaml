id: A0A0H3LMJ1
gene_symbol: ddpA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:257310
  label: Bordetella bronchiseptica RB50
description: DdpA (BB2109) is a membrane-associated multidomain protein required for BdcA-dependent c-di-GMP
  accumulation and motility/biofilm regulation in Bordetella bronchiseptica. Its GGDEF and EAL regions
  lack key catalytic residues. A separate C-terminal histidine-kinase region is present, but its kinase
  activity, phosphorelay partner, direct interaction with BdcA and proposed c-di-GMP binding remain unestablished.
existing_annotations:
- term:
    id: GO:0000155
    label: phosphorelay sensor kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003661
  - InterPro:IPR036097
  review:
    summary: A histidine-kinase region is present, but its activity and physiological phosphorelay remain
      unverified.
    action: UNDECIDED
    reason: The RB50 record includes distinct HisKA/HATPase-family domains in addition to degenerate GGDEF/EAL
      domains. Degeneracy of the latter does not disprove kinase activity. The kinase ISS source is UniProtKB:P0A601
      (SenX3, Mycobacterium bovis), whereas the BdcA study tests BB2109-dependent phenotypes and does
      not assay kinase chemistry or a cognate response regulator. The transferase and phosphorelay claims
      therefore remain unresolved rather than being rejected as a domain misidentification.
    supported_by:
    - reference_id: PMID:31209073
      supporting_text: The BB2109 protein also harbors another predicted domain (BaeS) usually present
        in histidine kinases.
