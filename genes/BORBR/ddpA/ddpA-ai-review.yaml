  title: Bordetella bronchiseptica Diguanylate Cyclase BdcA Regulates Motility and Is Important for the
    Establishment of Respiratory Infection in Mice.
  findings:
  - statement: BB2109 is necessary for BdcA-dependent phenotypes; proposed binding/scaffolding and kinase
      activities are not directly assayed.
    supporting_text: We also demonstrated that protein BB2109 is necessary for BdcA activity, motility
      inhibition, and biofilm formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached publication identity and relevant text inspected; species, assay and inference
      limits retained.
