    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003661
  - InterPro:IPR036097
  review:
    summary: DdpA is genetically required for BdcA-dependent signal output.
    action: ACCEPT
    reason: The BdcA-dependent c-di-GMP and motility phenotypes establish a signalling role. The molecular
      mechanism is unresolved, so a more specific phosphorelay or binding assignment would exceed the
      evidence.
    supported_by:
    - reference_id: PMID:31209073
      supporting_text: We also demonstrated that protein BB2109 is necessary for BdcA activity, motility
        inhibition, and biofilm formation.
