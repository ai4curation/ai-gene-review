      limits retained.
suggested_questions:
- question: Does DdpA catalyse histidine autophosphorylation and phosphotransfer, and which response regulator
    receives the phosphate?
- question: Does DdpA bind BdcA or c-di-GMP directly, and which domains are necessary for the BdcA-dependent
    phenotype?
