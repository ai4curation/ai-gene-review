  review:
    summary: DdpA is a membrane-associated multidomain protein.
    action: ACCEPT
    reason: The source describes BB2109 as a membrane protein, consistent with the RB50 sequence architecture;
      accept plasma membrane as an inferred localization.
    supported_by:
    - reference_id: PMID:31209073
      supporting_text: We found that the predicted α2 helix of the EAL domain of BB2109, a membrane protein
        that also contains the GGDEF domain, is a plausible match with the α5 helix of the DGC domain
        of BdcA based on complementary charge-charge interactions
