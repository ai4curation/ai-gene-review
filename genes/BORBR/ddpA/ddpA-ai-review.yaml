  title: Architecture and regulatory functions of c-di-GMP signaling in classical Bordetella species.
  findings:
  - statement: Bordetella review identifies DdpA as a degenerate GGDEF/EAL regulator; its regulatory mechanism
      is unresolved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
