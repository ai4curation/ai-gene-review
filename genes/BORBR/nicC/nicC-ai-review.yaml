  review:
    summary: NicC catalyzes NADH-dependent decarboxylative hydroxylation of 6-hydroxynicotinate.
    action: ACCEPT
    reason: The reaction is supported by direct enzymology, not merely the enzyme name or pathway disruption.
      NADH reduces bound FAD, oxygen is required, and 2,5-dihydroxypyridine plus carbon dioxide are the
      products. The 2016 work assayed both Pseudomonas and Bordetella homologs; the 2019 mechanistic study
      specifically assayed Bordetella.
