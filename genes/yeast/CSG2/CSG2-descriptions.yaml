gene_symbol: CSG2
organism: yeast
uniprot_id: P35206
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for calcium regulation. May regulate calcium accumulation by a non-vacuole
    organelle. Also regulates the activity of CSH1 and SUR1 during mannosyl phosphorylinositol
    ceramide synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P35206
  source_id: P35206
- source: Alliance_Imported
  text: Calcium release channel involved in ER calcium homeostasis; integrates ER
    calcium release with the regulation of sphingolipid metabolism and autophagy;
    required for mannosylation of inositolphosphorylceramide and for growth at high
    calcium concentrations; endoplasmic reticulum membrane protein; contains 10 transmembrane
    domains and a potential Ca2+ EF-hand motif; protein abundance increases in response
    to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/CSG2
  source_id: SGD:S000000240
- source: Alliance_Automated
  text: Enables enzyme regulator activity and intracellularly gated calcium channel
    activity. Involved in endoplasmic reticulum calcium ion homeostasis; glycolipid
    metabolic process; and release of sequestered calcium ion into cytosol by endoplasmic
    reticulum. Located in Golgi apparatus. Part of mannosyltransferase complex. Is
    active in endoplasmic reticulum membrane. Used to study Charcot-Marie-Tooth disease.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CSG2
  source_id: SGD:S000000240
