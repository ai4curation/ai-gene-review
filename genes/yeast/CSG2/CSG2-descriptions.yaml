- source: Alliance_Imported
  text: Calcium release channel involved in ER calcium homeostasis; integrates ER
    calcium release with the regulation of sphingolipid metabolism and autophagy;
    required for mannosylation of inositolphosphorylceramide and for growth at high
    calcium concentrations; endoplasmic reticulum membrane protein; contains 10 transmembrane
    domains and a potential Ca2+ EF-hand motif; protein abundance increases in response
    to DNA replication stress
