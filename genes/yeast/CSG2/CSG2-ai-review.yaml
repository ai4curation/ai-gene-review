gene_symbol: CSG2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Csg2 is a ten-transmembrane protein of the endoplasmic reticulum membrane in Saccharomyces
  cerevisiae with two linked roles. It is the shared regulatory subunit of the two inositol phosphorylceramide
  (IPC) mannosyltransferase complexes, Sur1(Csg1)-Csg2 and Csh1-Csg2, which convert IPC and GDP-mannose
  into mannosylinositol phosphorylceramide (MIPC); Csg2 is not itself the glycosyltransferase but is required
  for full Sur1 activity and for any Csh1 activity. Without Csg2, IPC accumulates and cells become sensitive
  to high extracellular Ca2+. Csg2 also acts as an ER calcium release channel that limits luminal ER Ca2+;
  under nitrogen starvation its loss raises ER Ca2+, perturbs sphingolipid synthesis (phytosphingosine
  accumulation) and blocks autophagy.'
