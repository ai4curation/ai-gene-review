suggested_questions:
- question: Is the ER Ca2+ channel activity of Csg2 mechanistically coupled to its role as MIPC 
    synthase regulatory subunit (e.g. Ca2+-dependent regulation of Sur1/Csh1), or are these 
    separable functions of the same protein?
