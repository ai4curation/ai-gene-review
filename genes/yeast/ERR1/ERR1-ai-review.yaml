core_functions:
- description: Predicted Mg2+-dependent phosphopyruvate hydratase (enolase) activity,
    inferred from the complete enolase fold and the full conservation of every catalytic
    and metal-binding residue relative to the characterized yeast enolases ENO1/ENO2.
    This is a homology-based prediction of enzymatic capacity (protein existence PE
    3); the in-vivo activity, biological role, and expression context of ERR1 are
    not established.
  molecular_function:
    id: GO:0004634
    label: phosphopyruvate hydratase activity
  supported_by:
  - reference_id: file:yeast/ERR1/ERR1-uniprot.txt
    supporting_text: EC=4.2.1.11
  - reference_id: PMID:7785338
    supporting_text: The first of these shows 61% and 60% DNA sequence identity to
      Enolases 1 and 2 respectively.
  - reference_id: PMID:23359425
    supporting_text: Err2p and Err3p can convert 2-phosphoglycerate to phosphoenolpyruvate,
      with kinetic parameters similar to those of Eno1p
knowledge_gaps:
- gap_statement: Whether native ERR1 is catalytically active as a phosphopyruvate
    hydratase (enolase) in vivo is unknown. The identical Err2p product and near-identical
    Err3p product have in-vitro enolase activity, but no in-vivo activity measurement
    attributable specifically to the ERR1 locus has been reported.
  boundary: The enolase fold is complete and every canonical catalytic residue (Glu212
    proton donor, Lys346 proton acceptor) and Mg2+-binding residue (Asp247, Glu296,
    Asp321) is conserved identically to ENO2, so ERR1 has the structural capacity
    for catalysis and is not a degenerate pseudoenzyme. Protein existence is only
    inferred from homology (PE 3).
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Distinguishes a genuine, expressed enolase isoform from a conserved-but-silent
    gene copy; determines whether the enolase MF annotations reflect real in-vivo
    function.
  resolution: Express and purify ERR1 protein and assay 2-phosphoglycerate dehydratase
    activity; and/or detect the protein and measure enolase activity from an ERR1-tagged
    strain.
  provenance:
  - reference_id: file:yeast/ERR1/ERR1-uniprot.txt
    supporting_text: '3: Inferred from homology;'
- gap_statement: The in-vivo biological role of ERR1 and the condition(s), if any,
    under which it is expressed are undetermined. It is not established that ERR1
    contributes to glycolytic flux, and no ERR1-specific phenotype or expression dataset
    has been curated here.
  boundary: The characterized glycolytic enolases of S. cerevisiae are ENO1 and ENO2;
    the three ERR genes are distinct sub-telomeric loci present in all strains, but
    their physiological function is uncharacterized. ERR1 has ND (no-data) annotations
    for both cellular_component and biological_process.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: A conserved, strain-invariant sub-telomeric gene family with an intact
    enzyme fold but no known role is a candidate piece of the yeast "unknome"; resolving
    it would reveal why S. cerevisiae maintains extra enolase-like genes beyond ENO1/ENO2.
  resolution: Locus-specific deletion/phenotyping of ERR1 across conditions (fermentative,
    respiratory, sporulation, stress) with ERR2/ERR3 controls; condition-resolved
    transcriptomics/proteomics for the specific ORF.
  provenance:
  - reference_id: PMID:7785338
    supporting_text: three copies being found in all strains of S. cerevisiae studied
- gap_statement: Whether ERR1 has any function distinct from its paralogs ERR2 and
    ERR3, or from the true enolases ENO1/ENO2, cannot be determined from existing
    evidence, and no functional assay can attribute a phenotype to ERR1 rather than
    ERR2/ERR3 without locus-specific genetics.
  boundary: Inline sequence analysis shows the ERR1 protein is 100% identical to ERR2
    and about 99.5% identical to ERR3 (differing by ~2 residues), and 67-68% identical
    to ENO1/ENO2. Because ERR1 and ERR2 are the same protein sequence, any protein-,
    sequence-, or most biochemistry-based evidence is intrinsically ERR-family-level,
    not ERR1-specific.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Determines whether the ERR trio is functionally redundant reserve/pseudogenic
    copies or encodes a distinct, possibly condition-specific, activity; also flags
    that all ERR1 annotations are really family-level attributions.
  resolution: Single, double, and triple ERR deletions plus ERR/ENO combinatorial
    deletions with condition panels; allele-/locus-specific expression reporters to
    separate the copies.
  provenance:
  - reference_id: file:yeast/ERR1/ERR1-uniprot.txt
    supporting_text: '3: Inferred from homology;'
suggested_questions:
- question: Is ERR1 protein expressed and catalytically active as an enolase in vivo,
    and under which growth or developmental condition (e.g. sporulation, stress, respiratory
    growth)?
- question: Do the three ERR genes have any biological role distinct from ENO1/ENO2,
    and can any role be attributed to ERR1 specifically given that its protein sequence
    is identical to ERR2 and nearly identical to ERR3?
suggested_experiments:
- hypothesis: ERR1 encodes a catalytically active Mg2+-dependent phosphopyruvate hydratase.
  description: Heterologously express and purify recombinant ERR1 and measure 2-phosphoglycerate
    dehydratase (enolase) activity and Mg2+ dependence in vitro, comparing kinetic
    parameters to purified ENO1/ENO2.
  experiment_type: enzyme assay
- hypothesis: ERR1 has a condition-specific in-vivo role separable from ENO1/ENO2
    and from the other ERR paralogs.
  description: Construct locus-specific single/double/triple ERR deletions (and ERR+ENO
    combinations) and phenotype across fermentative, respiratory, sporulation, and
    stress conditions; pair with an ORF-specific expression reporter and proteomics
    to detect ERR1-specific expression and any non-redundant phenotype.
  experiment_type: genetic deletion and phenotyping
