    summary: Phylogenetic propagation of the glycolytic-process biological role from
      the enolase family. Whereas the molecular function is defensible from residue
      conservation, the physiological claim that ERR1 actually participates in glycolytic
      flux in vivo is unproven. The characterized glycolytic enolases of S. cerevisiae
