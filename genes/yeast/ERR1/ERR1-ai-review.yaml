  findings:
  - statement: The enolase-related sequence shows 61% and 60% DNA sequence identity
      to Enolases 1 and 2 respectively; it appears species-specific with three copies
      found in all S. cerevisiae strains studied, at conserved genomic locations.
    supporting_text: The first of these shows 61% and 60% DNA sequence identity to
      Enolases 1 and 2 respectively. The Enolase-like sequence appears to be species
      specific, with three copies being found in all strains of S. cerevisiae studied.
      The location of the three copies is the same for all strains.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; this is the foundational report defining the three
      ERR enolase-related genes and their sub-telomeric location. Abstract-only in
      our cache (full text not available). It establishes DNA sequence identity to
      ENO1/ENO2 and genomic copy number/location, NOT enzymatic activity; the SGD
      ISA annotation to phosphopyruvate hydratase activity uses this paper as the
      sequence-similarity source.
- id: PMID:23359425
  title: The Saccharomyces cerevisiae enolase-related regions encode proteins that
    are active enolases.
  findings:
  - statement: Err2p and Err3p, the identical and near-identical ERR-family paralogs
      of Err1p, have enolase-like secondary/quaternary structure, convert 2-phosphoglycerate
      to phosphoenolpyruvate in vitro, and can complement eno1 eno2 loss when overexpressed
      on glucose medium.
    supporting_text: In addition, Err2p and Err3p can convert 2-phosphoglycerate
      to phosphoenolpyruvate, with kinetic parameters similar to those of Eno1p,
      suggesting that these proteins could function as enolases in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only in the local cache. The paper assayed
      Err2p and Err3p rather than the ERR1 locus directly, but ERR1 and ERR2 encode
      the identical UniProt P0CX10 sequence and ERR3 differs by only a few residues,
      so it strongly supports phosphopyruvate hydratase capacity for the ERR subfamily.
- id: file:yeast/ERR1/ERR1-uniprot.txt
  title: UniProt entry P0CX10 (ERR1_YEAST) with inline sequence/domain analysis
  findings:
  - statement: UniProt annotates a complete enolase two-domain architecture (Enolase_N
      PF03952, Enolase_C PF00113; PANTHER PTHR11902) with EC 4.2.1.11, Mg2+ cofactor,
      and by-similarity catalytic residues ACT_SITE 212 (proton donor) and 346 (proton
      acceptor); protein existence level is PE 3 (inferred from homology). The record
      maps both YOR393W and YPL281C mRNAs to this accession, i.e. ERR1 and ERR2 share
      an identical protein sequence.
    supporting_text: 'SIMILARITY: Belongs to the enolase family.'
  - statement: 'Inline sequence comparison (this session): ERR1 is 437 aa with no
      indels relative to yeast enolases; identity is 100% to ERR2 (P0CX11), ~99.5%
      to ERR3 (P42222), 68.0% to ENO1 (P00924) and 67.3% to ENO2 (P00925). All eight
      annotated catalytic / Mg2+ / substrate-binding residues (E212, K346, H160, E169,
      D247, E296, D321, K397) are identical between ERR1 and ENO2, so the enolase
      catalytic machinery is fully intact and ERR1 is not a degenerate pseudoenzyme.'
    supporting_text: 'SIMILARITY: Belongs to the enolase family.'
