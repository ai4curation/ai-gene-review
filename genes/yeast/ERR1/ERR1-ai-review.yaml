id: P0CX10
gene_symbol: ERR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: ERR1 (Enolase-related protein 1; systematic name YOR393W) is one of three
  near-identical Enolase-Related Region (ERR) proteins of Saccharomyces cerevisiae
  (ERR1/ERR2/ERR3), encoded at conserved sub-telomeric loci and found in all S. cerevisiae
  strains examined. The 437-residue protein has the complete two-domain enolase fold
  (an N-terminal capping domain and a C-terminal TIM-barrel) and retains every canonical
  catalytic and metal-binding residue of the enolase family, including the Glu proton
  donor, the Lys proton acceptor, and the aspartate/glutamate/aspartate Mg2+-binding
  triad. On this basis it is predicted to be a Mg2+-dependent phosphopyruvate hydratase
  (enolase, EC 4.2.1.11), catalysing the interconversion of 2-phospho-D-glycerate
  and phosphoenolpyruvate. It is closely related to but distinct from the two abundant
  glycolytic enolases ENO1 and ENO2 (about 67-68% identical), and its own protein
  sequence is essentially identical to ERR2 (100%) and ERR3 (about 99.5%). The ERR1
  locus itself has not been directly characterized experimentally, but the identical
  ERR2 product and near-identical ERR3 product have enolase activity in vitro and
  can complement eno1 eno2 loss when overexpressed. ERR1's native physiological role,
  expression conditions, and subcellular localization remain undetermined.
