- term:
    id: GO:0046084
    label: adenine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:17247984
  qualifier: involved_in
  review:
    summary: IMP from the 1960 Hawthorne & Mortimer chromosome-mapping paper, in which ade8 is an adenine-requiring
      marker. The adenine requirement reflects a block in de novo purine nucleotide (IMP) synthesis; the
      pathway does not produce the free base adenine, so 'adenine biosynthetic process' is the wrong chemical
      entity. Replace with de novo IMP biosynthetic process.
    action: MODIFY
    reason: Yeast does not synthesise free adenine de novo; the ade8 adenine requirement reflects a block
      in de novo IMP synthesis.
    proposed_replacement_terms:
    - id: GO:0006189
      label: '''de novo'' IMP biosynthetic process'
    supported_by:
    - reference_id: PMID:17247984
      supporting_text: 'Chromosome Mapping in Saccharomyces: Centromere-Linked Genes'
    - reference_id: file:yeast/ADE8/ADE8-uniprot.txt
      supporting_text: Purine metabolism; IMP biosynthesis via de novo pathway
