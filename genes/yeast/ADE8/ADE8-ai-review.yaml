id: P04161
gene_symbol: ADE8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADE8 (YDR408C) encodes the monofunctional phosphoribosylglycinamide formyltransferase (GAR
  transformylase, EC 2.1.2.2) of S. cerevisiae. It transfers a formyl group from 10-formyltetrahydrofolate
  to glycinamide ribonucleotide (GAR), forming N2-formyl-N1-(5-phospho-D-ribosyl)glycinamide (FGAR), step
  3 of de novo purine biosynthesis to IMP. Unlike the trifunctional animal GART, the yeast GARS and AIRS
  activities are on the separate ADE5,7 protein. Ade8 is cytoplasmic, is induced by purine and amino-acid
  starvation through Gcn4, and ade8 mutants are adenine auxotrophs that accumulate GAR and, being upstream
  of ADE2, suppress the red pigment of ade2 cells.
