suggested_questions:
- question: Which folate pool (cytosolic 10-formyl-THF produced by Ade3/Mis1 or by other routes) supplies
    Ade8 in vivo, given that ade3 mutants also accumulate GAR?
suggested_experiments:
- description: Assay recombinant Ade8 for GAR transformylase activity with 10-formyl-THF and determine
    whether Ade8 co-assembles with Ade5,7 and other ADE enzymes under adenine limitation.
