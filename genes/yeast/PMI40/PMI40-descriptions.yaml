- source: Alliance_Automated
  text: Enables mannose-6-phosphate isomerase activity. Involved in GDP-mannose biosynthetic
    process and cell wall mannoprotein biosynthetic process. Located in cytoplasm
    and nucleus. Human ortholog(s) of this gene implicated in carbohydrate metabolic
    disorder and congenital disorder of glycosylation Ib. Orthologous to human MPI
    (mannose phosphate isomerase).
