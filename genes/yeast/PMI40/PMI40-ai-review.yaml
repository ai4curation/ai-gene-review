  review:
    summary: pmi40 ts mutants are defective in glycosylation and secretion; loss of PMI blocks GDP-mannose and Dol-P-Man synthesis,
      so cell-wall mannoproteins cannot be made.
    action: KEEP_AS_NON_CORE
    reason: Pmi40 acts upstream by supplying the mannose 6-phosphate precursor; the mannosyl transfers themselves are performed
      by mannosyltransferases. Experimental phenotype is sound, retained as non-core.
    supported_by:
    - reference_id: PMID:1377774
      supporting_text: defective in glycosylation and secretion because of a thermolabile phosphomannose isomerase (PMI) activity
    - reference_id: PMID:1377774
      supporting_text: Inactivation of PMI at the restrictive temperature of 37 degrees C prevents synthesis of the GDP-mannose
        and dolichol-phosphate-mannose required for a number of critical mannosyl transfer reactions and results in cell death.
