taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Mannose-6-phosphate isomerase (phosphomannose isomerase, PMI; EC 5.3.1.8) of Saccharomyces cerevisiae, a zinc-dependent
  monomeric cytosolic enzyme of the type I PMI family that reversibly interconverts D-mannose 6-phosphate and D-fructose 6-phosphate.
  In the biosynthetic direction it diverts glycolytic fructose 6-phosphate into mannose 6-phosphate, the committed precursor
  of GDP-mannose and dolichyl-phosphate-mannose, and is therefore essential for protein N- and O-mannosylation, GPI anchors
  and cell-wall mannoprotein synthesis; pmi40 null mutants require exogenous mannose for growth. In the catabolic direction
  it allows mannose (after phosphorylation by hexokinases) to enter glycolysis.
