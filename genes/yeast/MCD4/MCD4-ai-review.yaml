      supporting_text: "does not appear to cycle between the Golgi and ER"
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P36051
      slot: "CC:SUBCELLULAR LOCATION"
      requested_change: DELETE_VALUE
      asserted_value: "Golgi apparatus membrane"
      confidence: CONFIRMED
      explanation: >-
        UniProt P36051 lists Golgi apparatus membrane in the SUBCELLULAR
        LOCATION comment without an evidence tag. Gaynor et al. fractionated
        Mcd4p with ER markers rather than Golgi/vacuolar markers and found that
        Mcd4p does not traffic through the Och1p Golgi compartment, so the
        unsupported Golgi location should be removed while retaining the
        endoplasmic reticulum membrane location.
      supported_by:
      - reference_id: PMID:10069808
        supporting_text: >-
          Together, these analyses suggest that Mcd4p does
          not traffic or cycle through the Och1p compartment
