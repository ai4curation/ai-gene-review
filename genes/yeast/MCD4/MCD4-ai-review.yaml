id: P36051
gene_symbol: MCD4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  MCD4 encodes the Saccharomyces cerevisiae GPI ethanolamine phosphate
  transferase 1, an essential multipass ER-membrane enzyme that adds
  phosphoethanolamine to the first mannose of GPI-anchor precursors. This
  modification supports later GPI-core mannosylation, efficient recognition by
  the GPI transamidase, lipid remodeling, and forward ER-to-Golgi transport of
  GPI-anchored proteins.
