  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: the core Mcd4 location is the ER membrane, not the
      Golgi membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mcd4 can affect ER-to-Golgi transport of GPI-anchored proteins, but direct
      localization experiments place the multipass enzyme at the ER and Gaynor
      et al. argued that Mcd4p does not itself cycle through the Golgi.
    additional_reference_ids:
    - PMID:10069808
    - PMID:35015055
    supported_by:
