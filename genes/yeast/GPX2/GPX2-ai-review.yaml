core_functions:
- description: 'Atypical 2-Cys (GPx-family) peroxiredoxin: reduces H2O2, alkyl and phospholipid hydroperoxides
    using reduced thioredoxin (Trx1/Trx2 in cytosol, Trx3 in mitochondria) as electron donor, forming
    an intramolecular Cys37-Cys83 disulfide; oxidative-stress-inducible via Yap1.'
  molecular_function:
    id: GO:0140824
    label: thioredoxin-dependent peroxiredoxin activity
  directly_involved_in:
