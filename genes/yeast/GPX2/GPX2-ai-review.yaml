id: P38143
gene_symbol: GPX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GPX2 (YBR244W) encodes a small, monomeric glutathione peroxidase-family protein that functions
  as an atypical 2-Cys peroxiredoxin. Although first described as a glutathione peroxidase and then as
  a phospholipid hydroperoxide glutathione peroxidase, purified Gpx2 reduces hydrogen peroxide, alkyl
  hydroperoxides and phospholipid hydroperoxides far more efficiently with thioredoxin/thioredoxin reductase/NADPH
  than with glutathione; the peroxidatic Cys37 forms an intramolecular disulfide with Cys83 that is reduced
  by thioredoxin. GPX2 expression is induced by oxidative stress in a Yap1-dependent manner. The protein
  is found in the cytoplasm and in mitochondria, where it is peripherally associated with the cytosolic
  face of the outer membrane and the matrix face of the inner membrane and is reduced by cytosolic Trx1/Trx2
  and mitochondrial Trx3. It contributes, redundantly with its paralogs GPX1 and HYR1/GPX3, to protection
  against lipid and non-lipid hydroperoxides, is particularly important under oxidative stress in the
  presence of Ca2+, and is required for efficient sporulation.
