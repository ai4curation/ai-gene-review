- term:
    id: GO:0004602
    label: glutathione peroxidase activity
  evidence_type: IDA
  original_reference_id: PMID:11445588
  qualifier: enables
  review:
    summary: 'IDA from Avery & Avery 2001: recombinant Gpx2 expressed in E. coli showed GSH-dependent
      phospholipid hydroperoxide peroxidase activity. Gpx2 is annotated as a glutathione peroxidase on
      historical grounds. Purified Gpx2 does reduce peroxides with GSH/glutathione reductase/NADPH, but
      far less efficiently than with thioredoxin (Tanaka 2005), and UniProt now names it a glutathione
      peroxidase-like peroxiredoxin (EC 1.11.1.24). GSH-dependent activity is therefore real but minor
      and not the physiological reductant.'
    action: KEEP_AS_NON_CORE
    supported_by:
    - &id009
      reference_id: PMID:11445588
      supporting_text: Studies with cloned GPX1, GPX2, and GPX3 expressed heterologously in Escherichia
        coli confirmed that these genes encode proteins with PHGPx activity.
    - &id001
