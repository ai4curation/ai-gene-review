    label: glutathione peroxidase activity
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: enables
  supporting_entities:
  - SGD_PWY:GLUT-REDOX2-PWY
  review:
    summary: YeastPathways (GLUT-REDOX2-PWY) places Gpx2 on the 'H2O2 + 2 GSH -> GSSG + 2 H2O' (EC 1.11.1.9)
      reaction. This assignment reflects the historical GPx name; biochemically Gpx2 is a thioredoxin-dependent
      peroxiredoxin (EC 1.11.1.24) with weak GSH-dependent activity. The YeastCyc reaction placement is
      therefore misleading for the pathway model. Gpx2 is annotated as a glutathione peroxidase on historical
      grounds. Purified Gpx2 does reduce peroxides with GSH/glutathione reductase/NADPH, but far less
      efficiently than with thioredoxin (Tanaka 2005), and UniProt now names it a glutathione peroxidase-like
      peroxiredoxin (EC 1.11.1.24). GSH-dependent activity is therefore real but minor and not the physiological
      reductant.
    action: KEEP_AS_NON_CORE
    reason: Pathway curators should move Gpx2 to a thioredoxin-dependent peroxide reduction step (EC 1.11.1.24).
    supported_by:
    - *id002
    - *id001
