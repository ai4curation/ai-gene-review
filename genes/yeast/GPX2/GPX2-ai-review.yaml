  - *id011
  - *id006
suggested_questions:
- question: Should the YeastPathways glutathione peroxidase reaction (EC 1.11.1.9) assignment for GPX2/HYR1
    be replaced by the thioredoxin-dependent peroxiredoxin reaction (EC 1.11.1.24), given that Gpx2 prefers
    thioredoxin as donor?
- question: What is the physiological substrate of the mitochondrial inner-membrane-associated Gpx2 pool,
    and is its sporulation role linked to mitochondrial lipid peroxide reduction?
