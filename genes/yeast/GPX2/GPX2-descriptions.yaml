gene_symbol: GPX2
organism: yeast
uniprot_id: P38143
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Glutathione peroxidase-like protein that protects cells from phospholipid
    hydroperoxides and nonphospholipid peroxides during oxidative stress (PubMed:10480913,
    PubMed:11445588). Plays an important role in the oxidative stress-induced response
    in the presence of Ca(2+). Has peroxidase activity using preferentially thioredoxin
    as a reducing power. The redox state of the mitochondrial GPX2 is regulated by
    TRX1 and TRX2 (cytoplasmic thioredoxin), and by TRX3 (mitochondrial matrix thioredoxin)
    (PubMed:16251189). Involved in sporulation (PubMed:21763276).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38143
  source_id: P38143
- source: Alliance_Imported
  text: Phospholipid hydroperoxide glutathione peroxidase; late-acting antioxidant
    system that decreases mitochondrial ROS production and preserves electron transport
    chain (ETC) function; protects cells from phospholipid hydroperoxides and nonphospholipid
    peroxides during oxidative stress; induced by glucose starvation; protein abundance
    increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPX2
  source_id: SGD:S000000448
- source: Alliance_Automated
  text: Enables glutathione peroxidase activity; phospholipid-hydroperoxide glutathione
    peroxidase activity; and thioredoxin-dependent peroxiredoxin activity. Involved
    in cellular response to oxidative stress. Located in cytoplasm. Human ortholog(s)
    of this gene implicated in colorectal adenocarcinoma; colorectal cancer; and spondylometaphyseal
    dysplasia Sedaghatian type. Orthologous to human GPX4 (glutathione peroxidase
    4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GPX2
  source_id: SGD:S000000448
