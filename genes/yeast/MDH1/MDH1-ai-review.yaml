id: P17505
gene_symbol: MDH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MDH1 encodes mitochondrial malate dehydrogenase, a homodimeric NAD+-dependent enzyme of the
  mitochondrial matrix that oxidises (S)-malate to oxaloacetate in the tricarboxylic acid cycle (EC 1.1.1.37).
  It is the most abundant of the three yeast MDH isozymes (MDH1 mitochondrial, MDH2 cytosolic, MDH3 peroxisomal).
  MDH1 expression is glucose repressed; mdh1 null mutants cannot grow on acetate and are impaired on glycerol/lactate.
  Conserved subunit-interface residues (Asp43, His46) control dimer stability and catalysis. Mdh1p interacts
  in vivo with citrate synthase Cit1p, the next enzyme of the cycle, and co-purifies with other TCA-cycle
  enzymes and dehydrogenases in mitochondrial supramolecular complexes, consistent with substrate channelling
  of oxaloacetate. It has also been detected binding mRNAs in a proteome-wide screen.
