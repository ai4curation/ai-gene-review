suggested_questions:
- question: Is the Mdh1p-Cit1p interaction required for oxaloacetate channelling in vivo, and which interface
    residues mediate it?
suggested_experiments:
- description: Map the Mdh1p surface required for Cit1p association by crosslinking-MS and test interface
    mutants for TCA flux (13C labelling) without loss of catalytic activity.
