descriptions:
- source: UniProt
  text: Peroxisomal citrate synthase involved in the citrate homeostasis (PubMed:25982115,
    PubMed:3023912). Catalyzes the condensation of acetyl coenzyme A and oxaloacetate
    to form citrate (PubMed:25982115, PubMed:3023912). Citrate synthase is the rate-
    limiting enzyme of the tricarboxylic acid (TCA) cycle (Probable).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08679
  source_id: P08679
- source: Alliance_Imported
  text: Citrate synthase, peroxisomal isozyme involved in glyoxylate cycle; catalyzes
    condensation of acetyl coenzyme A and oxaloacetate to form citrate; expression
    is controlled by Rtg1p and Rtg2p transcription factors; SCF-Ucc1 regulates level
    of Cit2p to maintain citrate homeostasis; oxaloacetate-dependent positive feedback
    loop inhibits Cit2p ubiquitination; CIT2 has a paralog, CIT1, that arose from
    the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/CIT2
  source_id: SGD:S000000598
- source: Alliance_Automated
  text: Enables citrate synthase activity and identical protein binding activity.
    Involved in citrate metabolic process. Located in peroxisome. Human ortholog(s)
    of this gene implicated in dilated cardiomyopathy and hypertrophic cardiomyopathy.
    Orthologous to human CS (citrate synthase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CIT2
  source_id: SGD:S000000598
