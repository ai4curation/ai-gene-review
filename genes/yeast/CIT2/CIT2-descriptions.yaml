    - rubric: specificity
      score: 3
    overall_notes: Peroxisomal citrate synthase and citrate homeostasis are correct,
      but it calls citrate synthase the rate-limiting TCA enzyme; the review places
      Cit2 in the glyoxylate cycle, not the TCA cycle.
- source: Alliance_Imported
  text: Citrate synthase, peroxisomal isozyme involved in glyoxylate cycle; catalyzes
    condensation of acetyl coenzyme A and oxaloacetate to form citrate; expression
    is controlled by Rtg1p and Rtg2p transcription factors; SCF-Ucc1 regulates level
    of Cit2p to maintain citrate homeostasis; oxaloacetate-dependent positive feedback
    loop inhibits Cit2p ubiquitination; CIT2 has a paralog, CIT1, that arose from
    the whole genome duplication
  source_type: curated
