descriptions:
- source: UniProt
  text: Peroxisomal citrate synthase involved in the citrate homeostasis (PubMed:25982115,
    PubMed:3023912). Catalyzes the condensation of acetyl coenzyme A and oxaloacetate
    to form citrate (PubMed:25982115, PubMed:3023912). Citrate synthase is the rate-
    limiting enzyme of the tricarboxylic acid (TCA) cycle (Probable).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08679
  source_id: P08679
