id: P08679
gene_symbol: CIT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CIT2 encodes the peroxisomal (extramitochondrial) citrate synthase of Saccharomyces cerevisiae.
  Cit2p condenses acetyl-CoA, including acetyl-CoA generated by peroxisomal beta-oxidation, with oxaloacetate
  to form citrate for the glyoxylate cycle, and is required for efficient lipid mobilisation on oleate.
  It carries a C-terminal SKL peroxisomal targeting signal and a cryptic N-terminal signal, and is also
  found in the cytosol. CIT2 is induced by C2 carbon sources; in glucose-grown cells Cit2p is degraded
  via the SCF(Ucc1) ubiquitin ligase, a regulation relieved by oxaloacetate. Cit2p can substitute for
  the mitochondrial isozyme Cit1p in supplying citrate for glutamate synthesis, so only cit1 cit2 double
  mutants are glutamate auxotrophs. It may also have weak methylcitrate synthase activity.
