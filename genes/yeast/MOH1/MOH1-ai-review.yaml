  review:
    summary: Family-level phylogenetic propagation (IBA) from PANTHER PTN002302768,
      seeded by human YPEL5 (UniProtKB:P62699). YPEL5 is curated as an ancillary component
      of the human CTLH E3 ubiquitin ligase, and the single yeast ortholog Moh1 has
      reported AP-MS association with multiple core GID E3-ligase subunits. The transfer
      is therefore biologically plausible, but this is kept as non-core because Moh1
      is not among the structurally defined core yeast GID components and has not
      yet been functionally validated as a GID subunit or regulator.
    action: KEEP_AS_NON_CORE
    reason: The PAINT node links the YPEL5/Moh1 clade to the CTLH/GID E3-ligase complex
      rather than to a remote Mis18/cereblon structural neighborhood, and 2026 literature
      connects Moh1 to yeast GID co-purifications. Retain the component annotation
      as contextual, while not elevating an unvalidated accessory or conditional association
      to a core cellular component.
    supported_by:
