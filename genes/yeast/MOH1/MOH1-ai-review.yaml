id: P38191
gene_symbol: MOH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'MOH1 (YBL049W) is a small (138 aa), low-abundance protein of the Yippee
  family, the single Saccharomyces cerevisiae representative of the family that expanded
  to the five YPEL paralogs (YPEL1-YPEL5) in humans. It comprises a Yippee/Mis18/Cereblon
  (CULT) fold — a zinc-stabilized double beta-meander that coordinates one structural
  Zn(2+) ion through four conserved cysteines (Cys45, Cys48, Cys101, Cys104) and presents
  a cradle-shaped pocket implicated in protein or nucleic-acid binding. The fold is
  a binding/scaffold module rather than a catalytic one, and no enzymatic activity
  has been demonstrated. Functionally, MOH1 is understudied: it is stress-inducible,
  and its deletion increases acute resistance to several lethal stresses (UV, methyl
  methanesulfonate, camptothecin, heat, hyperosmotic shock, hydrogen peroxide and
  acetic acid), increases sensitivity to sodium azide and sulfuric acid, remodels
  the cell envelope in a way that appears to reduce hydrogen-peroxide uptake, and
  impairs long-term stationary-phase and chronological survival. Human YPEL genes
  can partially substitute for MOH1, indicating conservation of function across the
  family. The direct molecular activity, subcellular site of action, and the mechanism
  linking MOH1 to stress tolerance and quiescence remain undetermined. Moh1 co-purifies
  with CCT/TRiC and GID-complex subunits, but its direct binding partner and its function
  in those complexes remain to be established.'
references:
- id: GO_REF:0000015
  title: Use of the ND evidence code for Gene Ontology (GO) terms
  findings: []
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: The ubiquitin ligase complex annotation on MOH1 is a phylogenetically
      propagated (IBA) inference from PANTHER family PTHR13848, seeded by human YPEL5
      (UniProtKB:P62699). YPEL5 is curated as an ancillary subunit of the human CTLH
      E3 ubiquitin ligase, and the single yeast ortholog Moh1 has yeast AP-MS evidence
      for association with core GID E3-ligase subunits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: GO_REF for the PAINT IBA propagation. The PANTHER node transfer
      to yeast MOH1 is plausible, but current evidence points to an accessory or conditional
      association rather than to membership in the structurally defined core GID E3
      ligase.
- id: PMID:30358795
  title: The cellular economy of the Saccharomyces cerevisiae zinc proteome.
  findings:
  - statement: MOH1 is included among 582 known or potential zinc-binding proteins
      identified by a proteome-wide bioinformatic domain/motif survey; this is the
      basis of the RCA zinc ion binding annotation, a prediction rather than a direct
      metal-binding assay of Moh1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Supports zinc binding by computational (RCA) prediction
      from the Yippee domain; consistent with UniProt Zn-binding features and my bioinformatics
      analysis.
- id: PMID:28173693
  title: Pro-Apoptotic Role of the Human YPEL5 Gene Identified by Functional Complementation
    of a Yeast moh1Δ Mutation.
  findings:
  - statement: moh1 deletion increases cell viability under multiple lethal stresses
      (UV, MMS, camptothecin, heat, hyperosmotic shock), and Moh1 is stress-induced;
      human YPEL genes partially complement moh1delta. Framed by the authors as involvement
      in DNA-damage-induced, mitochondria-dependent regulated cell death.
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: PubMed-verified; the only dedicated functional study of MOH1. Abstract-only
      in cache. It establishes a robust stress-sensitizing phenotype and cross-species
      complementation, but the "pro-apoptotic/mitochondria-dependent apoptosis" interpretation
      rests on a single heterologous-complementation viability study in the contested
      yeast programmed-cell-death paradigm; it does not establish a molecular activity.
- id: PMID:42404825
  title: Yippee-like protein Moh1 links gene expression to metabolism and selective
    stress resistance in Saccharomyces cerevisiae.
  findings:
  - statement: moh1 deletion causes stress-specific phenotypes, increases hydrogen-peroxide
      and acetic-acid resistance, increases sodium-azide and sulfuric-acid sensitivity,
      remodels the cell envelope, and reduces intracellular hydrogen-peroxide accumulation
      by decreased uptake rather than by altered mitochondrial ROS production. These
      findings reinforce MOH1 as a stress and cell-envelope regulator without identifying
      its direct molecular activity.
    supporting_text: Functional analyses showed that increased resistance to hydrogen
      peroxide is not due to altered mitochondrial ROS production but rather to reduced
      intracellular ROS accumulation.
    reference_section_type: ABSTRACT
  - statement: Olgun et al. summarize prior AP-MS evidence that Moh1 co-purifies with
      CCT2, CCT3, and multiple core GID E3-ligase subunits, and suggest that Moh1
      might connect CCT-mediated protein folding with GID-mediated degradation during
      stress adaptation.
    supporting_text: Moh1p was reported to interact with the multiple core GID subunits
      by immuno-affinity purification coupled with mass spectrometry
  - statement: Moh1 also has reported AP-MS association with CCT/TRiC, especially
      CCT2 and CCT3, although that association has not yet been functionally validated.
    supporting_text: interaction of Moh1p with with CCT2 and CCT3 subunit proteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified primary research from Microbial Cell, published
      after the initial review. It expands MOH1 phenotypes by connecting moh1delta
      to cell-envelope remodeling and stress-specific permeability changes, and its
      Discussion ties Moh1 to prior AP-MS evidence for CCT/TRiC and GID-complex association.
      It still leaves Moh1's direct ligand and molecular output undefined.
- id: PMID:29911972
  title: The multi-subunit GID/CTLH E3 ubiquitin ligase promotes cell proliferation
    and targets the transcription factor Hbp1 for degradation.
  findings:
  - statement: Lampert et al. identified human YPEL5 as a GID/CTLH subunit and
      directly tested yeast Moh1 in the canonical Fbp1 GID-substrate degradation
      assay, where moh1delta cells degraded Fbp1 with wild-type kinetics while
      gid4delta cells did not; this supports a human source-side complex role for
      YPEL5, but argues that Moh1 is dispensable for core catalytic yeast GID activity.
    supporting_text: YPEL5 and RanBP10, a protein highly homologous to RanBP9, also
      cluster as GID subunits with high probability.
  - statement: Moh1 is dispensable for yeast GID-dependent degradation of Fbp1
      after a switch from non-fermentable carbon to glucose, so any Moh1-GID association
      is not required for the canonical Fbp1 proteolysis assay.
    supporting_text: Moh1-deficient cells degrade TAP-tagged Fbp1 with wild-type
      kinetics
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified primary research. Directly supports both the
      human YPEL5 source-side GID/CTLH complex assignment behind the MOH1 IBA and
      the non-core boundary for yeast Moh1, whose deletion does not block the canonical
      GID-dependent Fbp1 turnover assay.
- id: PMID:9748261
  title: A role for Saccharomyces cerevisiae fatty acid activation protein 4 in regulating
    protein N-myristoylation during entry into stationary phase.
  findings:
  - statement: YBL049W (MOH1) was identified as one of nine putative N-myristoylproteins
      whose deletion reproduces the stationary-phase survival defect of nmt1 mutant
      cells, linking MOH1 phenotypically to maintenance of proliferative potential
      during stationary phase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified founding paper for MOH1. Abstract-only. The parenthetical
      "(homology to Snf7p)" is a superseded homology guess; MOH1 was later recognized
      as a Yippee-family protein. N-myristoylation of Moh1 is predicted here, not
      shown biochemically.
- id: PMID:11240639
  title: The Drosophila gene Yippee reveals a novel family of putative zinc binding
    proteins highly conserved among eukaryotes.
  findings:
  - statement: Defines the Yippee family as a highly conserved eukaryotic family bearing
      a putative zinc-finger-like metal-binding domain; even at the family's founding
      the molecular function was left open.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Family-defining paper; supports the zinc-binding-module
      framing and the family-wide "function largely unknown" status.
- id: PMID:15456898
  title: 'Genomic analysis of stationary-phase and exit in Saccharomyces cerevisiae:
    gene expression and identification of novel essential genes.'
  findings:
  - statement: 'Genome-wide screen that identified MOH1 as one of the stationary-phase-essential
      genes: moh1 deletion causes a large loss of viability during long-term stationary
      phase at 37C, yet MOH1 is not required for growth on nonfermentable carbon sources,
      indicating a specific quiescence-survival role rather than a generic respiratory
      defect.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (abstract-only in cache; the MOH1-specific detail
      is in the full text, surfaced by the falcon deep-research report). Best dedicated
      genetic evidence that MOH1 is required for stationary-phase/quiescence survival.
- id: file:yeast/MOH1/MOH1-deep-research-falcon.md
  title: Falcon deep research report on S. cerevisiae MOH1 (YBL049W)
  findings:
  - statement: Synthesis concluding MOH1 is a small conserved Yippee-family regulatory/adaptor
      protein with a zinc-stabilized beta-tent fold and cradle-shaped binding pocket,
      required for stationary-phase survival, whose precise biochemical activity,
      substrate, and dedicated pathway remain unresolved in the retrievable literature.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Falcon report (Edison Scientific), correct gene/organism, 26 citations;
      corroborates the domain/fold, ortholog and stationary-phase findings independently
      established here. Used for context; positive GO claims are anchored to PMIDs
      and the bioinformatics analysis, not to this report.
- id: file:yeast/MOH1/MOH1-bioinformatics/RESULTS.md
  title: Bioinformatics analysis of MOH1 (Yippee domain, zinc site, ortholog conservation)
  findings:
  - statement: Independently confirms the Yippee zinc signature (C45-x2-C48 ... C101-x2-C104,
      52-residue spacer) matching the UniProt Zn-binding features, ~37-45% identity
      to human YPEL1-5 with all four Zn-cysteines perfectly conserved, and no sequence-level
      evidence for catalytic activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible in-repo analysis; negative control (pyruvate kinase)
      confirms the scripts are not hardcoded.
