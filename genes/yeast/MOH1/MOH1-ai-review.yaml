- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: RCA
  original_reference_id: PMID:30358795
  qualifier: enables
  review:
    summary: Zinc ion binding is the single well-supported molecular feature of Moh1.
      It is predicted by proteome-wide domain/motif analysis (RCA, PMID:30358795),
      corroborated by the UniProt Zn(2+)-binding features (Cys45, Cys48, Cys101, Cys104)
      and independently by in-repo bioinformatics, which recovers the canonical Yippee
      two-CxxC zinc signature and shows perfect conservation of all four cysteines
      across human YPEL1-5. The bound zinc is structural (folds the Yippee domain);
      it is not evidence of a catalytic activity. Accepted as the core molecular feature,
      though the downstream biochemical output remains unknown.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:30358795
      supporting_text: 582 known or potential zinc-binding proteins was identified
        using a bioinformatics analysis that combined global domain searches with
        local motif searches
    - reference_id: file:yeast/MOH1/MOH1-bioinformatics/RESULTS.md
      supporting_text: MOH1 contains exactly the two CxxC motifs that define the Yippee
        zinc site
