core_functions:
- description: Structural zinc binding by the Yippee domain. The conserved Cys45/Cys48/Cys101/
    Cys104 tetrad coordinates a single Zn(2+) ion that stabilizes the Yippee/Mis18/
    CULT fold. This is the only molecular feature of Moh1 supported by convergent
    computational and comparative evidence; the resulting protein/nucleic-acid-binding
    activity of the cradle-shaped pocket, and any biochemical output, are not established.
  molecular_function:
    id: GO:0008270
    label: zinc ion binding
  supported_by:
  - reference_id: PMID:30358795
    supporting_text: 582 known or potential zinc-binding proteins was identified using
      a bioinformatics analysis that combined global domain searches with local motif
      searches
  - reference_id: file:yeast/MOH1/MOH1-bioinformatics/RESULTS.md
    supporting_text: all four zinc-binding cysteines are perfectly conserved
knowledge_gaps:
- gap_statement: The molecular activity of Moh1 is undetermined. Beyond structural
    zinc binding by the Yippee domain, it is not known what Moh1 binds (protein? nucleic
    acid?) or what biochemical output, if any, the cradle-shaped Yippee pocket produces.
    No catalytic activity is supported.
  boundary: The Yippee/Mis18/CULT fold and its structural Zn(2+) site (Cys45/48/101/104)
    are firmly established by UniProt features, PROSITE/Pfam/InterPro domain calls
    and independent in-repo bioinformatics; the fold is a zinc-stabilized binding
    scaffold, not a known catalytic fold.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Moh1 is the single yeast ortholog of the human YPEL family, which
    is implicated in proliferation, senescence and stress adaptation; defining the
    yeast protein's biochemistry would anchor mechanism for the whole conserved family.
  resolution: Biochemical identification of Moh1 ligands/substrates (e.g. interaction
    proteomics of tagged Moh1, in vitro binding assays with the purified Yippee domain,
    structural studies of the pocket) and tests for any enzymatic activity.
  provenance:
  - reference_id: PMID:11240639
    supporting_text: the Hemolin-Yippee interaction remains to be further elucidated
  - reference_id: file:yeast/MOH1/MOH1-bioinformatics/RESULTS.md
    supporting_text: There is no sequence-level evidence for enzymatic activity
- gap_statement: No functionally validated direct physical partner or substrate of
    Moh1 is known. CCT2/CCT3 and multiple core GID-complex subunits are now the strongest
    co-purification candidates, but the Drosophila Yippee-Hemolin interaction has
    no established yeast counterpart and Moh1's function in the CCT/GID network remains
    untested.
  boundary: Large-scale interaction datasets (affinity-capture-MS, genetic interactions)
    exist for Moh1, Olgun et al. highlight prior AP-MS associations with CCT2/CCT3
    and core GID E3-ligase subunits, and human YPEL proteins partially complement
    moh1delta, indicating a conserved but unspecified activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Identifying a direct partner would convert the family from "putative
    binding module" to a defined pathway component.
  resolution: Targeted co-purification/crosslinking-MS with tagged Moh1, and validation
    of candidate partners by reciprocal pulldown and phenotype epistasis.
  provenance:
  - reference_id: PMID:11240639
    supporting_text: the Hemolin-Yippee interaction remains to be further elucidated
  - reference_id: PMID:42404825
    supporting_text: Moh1p was reported to interact with the multiple core GID subunits
      by immuno-affinity purification coupled with mass spectrometry
- gap_statement: The mechanism by which Moh1 shapes stress tolerance and quiescence
    is unknown. It is unexplained why loss of Moh1 increases acute resistance to several
    lethal stresses yet decreases long-term stationary-phase/chronological survival,
    and whether Moh1 acts directly on membranes, metabolism, transcription, or cell
    death machinery.
  boundary: 'The phenotypes are reproducible: moh1delta increases viability under
    UV, MMS, camptothecin, heat and hyperosmotic shock and is stress-induced (PMID:28173693);
    MOH1 is one of the stationary-phase-essential genes required for long-term survival
    in quiescence (PMID:15456898, PMID:9748261). Newer primary work shows that moh1delta
    cells have stress-specific permeability and cell-envelope phenotypes, including
    decreased intracellular hydrogen-peroxide accumulation through decreased uptake
    (PMID:42404825).'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: NARROWING
  significance: Resolving the mechanism would explain a conserved stress/aging factor
    and clarify whether the human YPEL "senescence/stress" phenotypes share this mechanism.
  resolution: Epistasis of moh1delta with defined stress-response and membrane/metabolic
    pathways, and Moh1 localization/partner studies that test whether the observed
    cell-envelope remodeling is a direct or downstream consequence of Moh1 loss.
  provenance:
  - reference_id: PMID:28173693
    supporting_text: exhibited enhanced cell viability compared with the WT-MOH1 strain
      when treated with lethal UV irradiation
  - reference_id: PMID:15456898
    supporting_text: 32 genes essential for survival in stationary-phase at
  - reference_id: PMID:42404825
    supporting_text: consistent with cell envelope remodeling
- gap_statement: Whether "apoptotic process"/regulated cell death is the correct biological-process
    framing for Moh1 is unresolved. The label derives from a single heterologous complementation
    study interpreted within the contested yeast programmed-cell-death paradigm.
  boundary: It is established that Moh1 sensitizes cells to lethal stress (deletion
    is protective) and that human YPEL5 restores this sensitization; the interpretation
    as caspase/mitochondria-dependent apoptosis is the uncertain part.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Determines whether GO apoptosis/regulated-cell-death terms are appropriate
    for this gene and its orthologs.
  resolution: Independent replication with genetic dissection of the metacaspase (YCA1)
    and mitochondrial pathways, distinguishing bona fide regulated cell death from
    passive stress-induced death.
  provenance:
  - reference_id: PMID:28173693
    supporting_text: their involvement in mitochondria-dependent apoptosis induced
      by DNA damage
- gap_statement: The subcellular site of Moh1 action is unknown; no reliable localization
    is curated, and the GOA cellular_component annotation is ND.
  boundary: Moh1 is a low-abundance soluble protein; SGD notes a possible link to
    vacuolar transport and an abnormal-vacuolar-morphology deletion phenotype, but
    these are hypotheses, not localization data.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: Localization would constrain candidate functions (e.g. membrane vs
    nuclear vs cytosolic activity).
  resolution: Endogenous fluorescent tagging and fractionation of Moh1 under normal
    and stress conditions.
