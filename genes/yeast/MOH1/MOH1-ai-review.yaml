suggested_questions:
- question: What does the Yippee-domain pocket of Moh1 bind (protein, nucleic acid,
    small molecule), and does the bound zinc have any role beyond folding the domain?
  experts: []
- question: By what molecular mechanism does moh1 deletion simultaneously increase
    acute stress resistance and decrease long-term stationary-phase survival?
  experts: []
- question: Is the human YPEL family's proliferation/senescence role mechanistically
    the same as the yeast Moh1 stress/quiescence role, given cross-species complementation?
  experts: []
suggested_experiments:
- hypothesis: Moh1 acts as a zinc-dependent binding module for a specific partner
    that mediates its stress-sensitizing function.
  description: Affinity-purify endogenously tagged Moh1 under basal and stress conditions
    and identify co-purifying proteins/nucleic acids by mass spectrometry and RNA
    sequencing; validate top candidates by reciprocal pulldown and epistasis with
    moh1delta stress phenotypes.
  experiment_type: interaction proteomics
- hypothesis: The four conserved cysteines are required for Moh1 function via structural
    zinc coordination.
  description: Construct Cys-to-Ala/Ser substitutions at Cys45/48/101/104, test protein
    stability and rescue of moh1delta stress phenotypes, to determine whether the
    zinc site is required for function in vivo.
  experiment_type: structure-function mutagenesis
- hypothesis: moh1delta hydrogen-peroxide resistance stems from decreased uptake due
    to altered membrane permeability rather than altered ROS metabolism.
  description: Measure intracellular ROS, H2O2 uptake kinetics, and membrane lipid/permeability
    in wild-type vs moh1delta cells, and combine those assays with structure-function
    MOH1 alleles to test the 2026 Olgun et al. cell-envelope model.
  experiment_type: cell physiology / permeability assay
