gene_symbol: CHA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CHA1 encodes the catabolic L-serine/L-threonine dehydratase (deaminase) of Saccharomyces
  cerevisiae, a pyridoxal-phosphate-dependent member of the serine/threonine dehydratase family (EC 4.3.1.17
  and 4.3.1.19) lacking the regulatory ACT domains of the biosynthetic paralog Ilv1. Cha1 deaminates L-serine
  to pyruvate and L-threonine to 2-oxobutanoate, releasing ammonia, which allows the cell to use these
  hydroxy amino acids as nitrogen sources ('catabolism of hydroxyamino acids'). The enzyme follows Michaelian
  kinetics, prefers serine, is not feedback-inhibited by isoleucine, and is strongly induced by serine
  and threonine. It is localised to mitochondria and has been found associated with mtDNA nucleoids. Cha1
  and Ilv1 have distinct physiological roles but limited ability to compensate for one another.
