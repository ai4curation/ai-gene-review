descriptions:
- source: Alliance_Imported
  text: Catabolic L-serine (L-threonine) deaminase; catalyzes the degradation of both
    L-serine and L-threonine; required to use serine or threonine as the sole nitrogen
    source, transcriptionally induced by serine and threonine
  source_type: curated
  url: https://www.yeastgenome.org/locus/CHA1
  source_id: SGD:S000000569
- source: Alliance_Automated
  text: Enables L-serine ammonia-lyase activity and threonine deaminase activity.
    Involved in L-serine catabolic process and L-threonine catabolic process. Located
    in mitochondrial nucleoid. Orthologous to human SDS (serine dehydratase) and SDSL
    (serine dehydratase like).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CHA1
  source_id: SGD:S000000569
