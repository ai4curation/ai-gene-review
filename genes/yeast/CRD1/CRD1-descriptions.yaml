gene_symbol: CRD1
organism: yeast
uniprot_id: Q07560
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the synthesis of cardiolipin (CL) (diphosphatidylglycerol) by specifically
    transferring a phosphatidyl group from CDP-diacylglycerol to phosphatidylglycerol
    (PG) (PubMed:2171667, PubMed:26793177, PubMed:29167800, PubMed:9370334). CL is
    a key phospholipid in mitochondrial membranes and plays important roles in maintaining
    the functional integrity and dynamics of mitochondria under both optimal and stress
    conditions (PubMed:9370334).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07560
  source_id: Q07560
- source: Alliance_Imported
  text: Cardiolipin synthase; produces cardiolipin, which is a phospholipid of the
    mitochondrial inner membrane that is required for normal mitochondrial membrane
    potential and function and for correct integration of membrane-multispanning proteins
    into the mitochondrial outer membrane; required to maintain tubular mitochondrial
    morphology and functions in mitochondrial fusion; also required for normal vacuolar
    ion homeostasis
  source_type: curated
  url: https://www.yeastgenome.org/locus/CRD1
  source_id: SGD:S000002301
- source: Alliance_Automated
  text: Enables cardiolipin synthase (CMP-forming) activity. Involved in several processes,
    including intracellular monoatomic ion homeostasis; mitochondrial membrane organization;
    and protein targeting to membrane. Located in mitochondrion. Human ortholog(s)
    of this gene implicated in combined oxidative phosphorylation deficiency 57. Orthologous
    to human CRLS1 (cardiolipin synthase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CRD1
  source_id: SGD:S000002301
