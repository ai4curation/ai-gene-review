suggested_questions:
- question: Which inner-membrane partners (e.g. Tam41, Pgs1, Gep4) form the reported large Crd1-containing
    complex, and is substrate channelling required for CL synthesis?
- question: Should YeastPathways correct the cardiolipin synthase reaction from 2 PG -> CL + glycerol
    to CDP-DAG + PG -> CL + CMP for S. cerevisiae?
suggested_experiments:
- description: Native mass spectrometry or crosslinking-MS of the Crd1 complex in purified inner membranes
    to identify partners and test substrate channelling from Tam41/Gep4.
