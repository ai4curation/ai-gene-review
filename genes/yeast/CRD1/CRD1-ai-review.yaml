id: Q07560
gene_symbol: CRD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'CRD1 (CLS1) encodes the eukaryotic-type cardiolipin synthase (CMP-forming, EC 2.7.8.41)
  of Saccharomyces cerevisiae, a multi-pass protein of the mitochondrial inner membrane belonging to the
  CDP-alcohol phosphatidyltransferase family. It transfers the phosphatidyl group of CDP-diacylglycerol
  to phosphatidylglycerol, forming cardiolipin (CL) and CMP; the reaction requires a divalent cation (Mg2+)
  and the substrates are supplied in the inner membrane by Tam41 (CDP-DAG) and the Pgs1-Gep4 pathway (PG).
  Crd1 is the only CL synthase in yeast: crd1 null cells lack CL and accumulate PG. CL is required for
  optimal mitochondrial membrane potential, respiratory function, protein import and mtDNA stability at
  elevated temperature, and its loss also produces secondary defects such as impaired vacuolar acidification
  and mislocalisation of CL-binding proteins like Ups1. Crd1 is distinct from the bacterial phospholipase
  D-type cardiolipin synthases that condense two PG molecules.'
