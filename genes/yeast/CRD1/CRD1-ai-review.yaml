- term:
    id: GO:0006612
    label: protein targeting to membrane
  evidence_type: IMP
  original_reference_id: PMID:26235513
  qualifier: involved_in
  review:
    summary: Watanabe et al. found that the lipid-transfer protein Ups1 partitions to inner-membrane vesicles
      in wild-type mitochondria but is evenly distributed between outer and inner membrane vesicles in
      crd1 mitochondria lacking CL. The result shows CL (the product) influences Ups1 membrane association;
      Crd1 itself does not target proteins to membranes. The effect is a downstream consequence of CL
      synthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect, product-mediated effect; Crd1 does not perform protein targeting.
    supported_by:
    - reference_id: PMID:26235513
      supporting_text: Ups1 was recovered exclusively in the IM vesicles in WT mitochondria, while it
        was evenly distributed to the OM and IM vesicles in crd1Δ mitochondria lacking cardiolipin
