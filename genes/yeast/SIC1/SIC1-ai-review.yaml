      so process terms for its own degradation would be inappropriate, and the binding is kept as a non-core
      interaction. This mirrors the treatment of the analogous ubiquitin protein ligase binding annotation
      on the metazoan CKI p27 (from the SKP2-CKS1-p27 phosphopeptide structure). The interaction is nonetheless
      the essential mechanistic context for the core function, since the multisite-phosphorylation threshold
      it embodies is what makes S-phase entry switch-like.'
    supported_by:
    - reference_id: PMID:19008353
      supporting_text: The disordered cyclin-dependent kinase (CDK) inhibitor Sic1 interacts with a single
        site on its receptor Cdc4 only upon phosphorylation of its multiple dispersed CDK sites.
    - reference_id: PMID:19008353
      supporting_text: A requirement for multiple phosphorylation events in Sic1 in principle sets a high
        threshold for the level of active G 1 CDK required to initiate transition to S phase
