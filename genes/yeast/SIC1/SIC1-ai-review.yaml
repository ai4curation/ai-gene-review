- description: 'Multisite-phosphorylation-gated engagement of the SCF(Cdc4) ubiquitin ligase: once Cln1/2-Cdc28
    (with Pho85 priming and Clb5-Cdc28-Cks1 processive phosphorylation) has phosphorylated enough of the
    nine N-terminal CDK sites, several suboptimal Cdc4 phosphodegrons bind the Cdc4 WD40 pocket in dynamic
    exchange, committing Sic1 to Cdc34-dependent ubiquitination and proteasomal destruction. This substrate-side
    interaction is how Sic1 is regulated, not an activity it performs, but the threshold it sets is what
    makes S-phase entry switch-like.'
