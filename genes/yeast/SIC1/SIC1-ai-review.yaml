suggested_questions:
- question: Sic1 carries 'SCF ubiquitin ligase complex binding' although it is the substrate rather than
    an actor in its own ubiquitination, and the analogous metazoan CKI p27 carries 'ubiquitin protein ligase
    binding'. Should GO record substrate recognition on the substrate as a molecular-function binding term,
    or only on the F-box receptor (Cdc4 has-input Sic1), and should the two CKIs be harmonised?
  experts:
  - Tyers M
  - Sicheri F
- question: By what mechanism does Sic1 negatively regulate autophagy upstream of Rim15? Is it a consequence
    of Clb-Cdc28 inhibition (a CDK-dependent effect on Rim15 or its regulators) or a CDK-independent output,
    given that only weak Sic1-Rim15 co-immunoprecipitation was detected?
  experts:
  - Klionsky DJ
  - Yang Z
- question: Is the proposed Cip/Kip-like 'activator' role of Sic1 (promoting nuclear accumulation of Clb5)
    reproducible and separable from kinase inhibition, and if so should it be captured with a cyclin binding
    or adaptor-type annotation in addition to the inhibitor term?
  experts:
  - Alberghina L
  - Vanoni M
suggested_experiments:
- hypothesis: The CDK-inhibitory and Clb5-nuclear-escort functions of Sic1 are separable and map to different
    regions of the protein.
  description: Express sic1 alleles lacking the C-terminal inhibitory domain, lacking the bipartite NLS,
    or carrying both lesions in sic1 null cells, and quantify Clb5-GFP nuclear/cytoplasmic ratio, Clb5-Cdc28
    kinase activity, origin-firing efficiency and S-phase timing in synchronised cultures on glucose versus
    ethanol.
  experiment_type: separation-of-function mutagenesis with live-cell imaging
- hypothesis: Sic1 inhibits autophagy through Clb-Cdc28 inhibition rather than through a direct Sic1-Rim15
    interaction.
  description: Compare autophagy induction (GFP-Atg8 processing and Pho8delta60 assays) in sic1 null cells
    rescued with wild-type Sic1 versus a kinase-inhibition-dead C-terminal mutant that retains stability
    and localisation, and test whether analogue-sensitive cdc28-as1 inhibition phenocopies Sic1 overexpression
    in a rim15-dependent manner.
  experiment_type: epistasis with chemical genetics
