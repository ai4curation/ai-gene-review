gene_symbol: SIC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'SIC1 encodes Sic1 (p40, also called Sdb25), a 284-residue, largely intrinsically disordered,
  non-enzymatic stoichiometric inhibitor of the budding-yeast cyclin-dependent kinase Cdc28 (Cdk1) when
  Cdc28 is complexed with B-type (Clb) cyclins; it does not inhibit Cln-Cdc28 and is unrelated in sequence
  to the metazoan Cip/Kip inhibitors (p27, p21) that occupy the same regulatory position. The C-terminal
  region (roughly residues 215-284, the SIC1_C domain) carries the kinase-inhibitory determinants that
  bind the cyclin-CDK holoenzyme with subnanomolar affinity, while the disordered N-terminal half is a
  phosphoregulatory platform bearing nine CDK consensus sites. SIC1 is transcribed in late anaphase by
  Swi5 (with a contribution from Ace2) once Cdc14 has been released, and the protein accumulates through
  mitotic exit and G1, where it helps extinguish residual Clb2-Cdc28 activity alongside APC/C-Cdh1-driven
  cyclin destruction and keeps the S-phase kinases Clb5/6-Cdc28 silent so that pre-replicative complexes
  can be licensed at replication origins. At Start, Cln1/2-Cdc28 (with Pho85-Pcl1 priming and processive
  phosphorylation by the Clb5-Cdc28-Cks1 complex to which Sic1 is bound) multisite-phosphorylates the
  N-terminus; once enough suboptimal Cdc4 phosphodegrons are occupied, Sic1 engages the WD40 substrate
  receptor Cdc4 of the SCF(Cdc4) ubiquitin ligase in a dynamic, polyvalent complex, is ubiquitinated with
  the E2 Cdc34, and is destroyed by the proteasome, abruptly releasing Clb5/6-Cdc28 to fire origins. This
  multisite threshold makes S-phase entry ultrasensitive to G1 CDK activity. Sic1 is predominantly nuclear
  (it carries a bipartite nuclear localization signal and is degraded by nuclear Cdc4) but also has a
  cytoplasmic pool whose size depends on carbon source, and it promotes nuclear accumulation of its cognate
  cyclin Clb5. Its stability is a signalling hub: the stress kinase Hog1 phosphorylates Thr173 to stabilize
  Sic1 and arrest cells in G1 under osmostress, TORC1 inhibition stabilizes it through Mpk1 and PP2A-Cdc55
  control, CK2 phosphorylation of Ser201 strengthens kinase inhibition, Cdc14 dephosphorylates it at mitotic
  exit, and Pho85 complexed with Clg1, Pcl1 or Pho80 destabilizes it, which links Sic1 to negative control
  of autophagy via the Rim15 kinase. sic1 null cells are viable but fire fewer origins, prolong S phase
  and suffer genome instability, whereas non-degradable Sic1 blocks S-phase entry.'
