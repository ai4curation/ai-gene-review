    label: G1/S transition of mitotic cell cycle
  evidence_type: IGI
  original_reference_id: PMID:7954792
  qualifier: involved_in
  supporting_entities:
  - SGD:S000001885
  review:
    summary: 'G1/S transition of mitotic cell cycle, inferred from the genetic interaction between SIC1
      and CDC4 (SGD:S000001885) in the founding paper: cdc4 and cdc34 mutants arrest in G1 because they
      cannot destroy the Clb-Cdc28 inhibitor p40Sic1, and Sic1 proteolysis is an essential aspect of the
      G1 to S transition.'
    action: ACCEPT
    reason: 'Sic1 sits at the heart of this transition. It is the stoichiometric inhibitor of Clb5/6-Cdc28
      that holds S-phase CDK activity off in G1, and it is the Cln-Cdc28-phosphorylated substrate whose
      SCF(Cdc4)-Cdc34-dependent destruction releases that activity; Cdc4 is the F-box substrate receptor
      that recognises phosphorylated Sic1. Sic1 does the inhibiting itself (an activity, not a mere requirement),
      and the timing of the transition is set by the multisite phosphorylation threshold on Sic1, so the
      participation test is met. The GOA term is the neutral parent; the direction of Sic1''s contribution
      is captured more precisely by negative regulation of G1/S transition of mitotic cell cycle (GO:2000134),
      which is used in core_functions, but the parent term is correct as asserted and matches how the
      analogous metazoan CKI p27 is annotated.'
    supported_by:
    - reference_id: PMID:7954792
      supporting_text: cdc34 mutants cannot enter S phase because they fail to destroy p40SIC1, which is
        a potent inhibitor of Clb but not Cln forms of the Cdc28 kinase.
    - reference_id: PMID:7954792
      supporting_text: Proteolysis of a cyclin-specific inhibitor of Cdc28 is therefore an essential aspect
        of the G1 to S phase transition.
    - reference_id: PMID:18787112
      supporting_text: Such phosphorylation enables Sic1-Cdc4 interaction required for ubiquitination
        of Sic1.
