core_functions:
- description: 'Stoichiometric inhibitor of S-phase cyclin-CDK: Sic1 binds Clb5/6-Cdc28 through its C-terminal
    kinase-inhibitory region and blocks phosphorylation of their substrates, keeping S-phase CDK activity
    off from late mitosis through G1 so that origins can be licensed, and restraining the G1/S transition
    until its own Cln-Cdc28-triggered, SCF(Cdc4)-dependent destruction releases the kinase.'
