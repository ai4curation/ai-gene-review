descriptions:
- source: UniProt
  text: Substrate and inhibitor of the cyclin-dependent protein kinase CDC28. Its
    activity could be important for faithful segregation of chromosomes to daughter
    cells. It acts in response to a signal from a post-start checkpoint.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38634
  source_id: P38634
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Correct that Sic1 is a Cdc28 inhibitor and substrate, but does
      not say it targets Clb-Cdc28 or controls the G1/S transition. The chromosome
      segregation and post-Start checkpoint claims are dated and do not appear in
      the review.
- source: Alliance_Imported
  text: Cyclin-dependent kinase inhibitor (CKI); inhibitor of Cdc28-Clb kinase complexes
    that controls G1/S phase transition, preventing premature S phase and ensuring
    genomic integrity; phosphorylated by Clb5/6-Cdk1 and Cln1/2-Cdk1 kinase which
    regulate timing of Sic1p degradation; phosphorylation targets Sic1p for SCF(CDC4)-dependent
    turnover; functional homolog of mammalian Kip1
  source_type: curated
  url: https://www.yeastgenome.org/locus/SIC1
  source_id: SGD:S000004069
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 5
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 5
    - rubric: specificity
      score: 5
    overall_notes: 'Correct and current: Clb-Cdc28 inhibitor controlling G1/S, multisite
      phosphorylation by Cln1/2- and Clb5/6-Cdk1, and SCF(Cdc4)-dependent turnover.
      Omits the mitotic-exit role. Calling it a functional homolog of Kip1 matches
      the review, which notes it is unrelated in sequence.'
- source: Alliance_Automated
  text: Enables SCF ubiquitin ligase complex binding activity and cyclin-dependent
    protein serine/threonine kinase inhibitor activity. Involved in G1/S transition
    of mitotic cell cycle and negative regulation of macroautophagy. Located in cytoplasm
    and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SIC1
  source_id: SGD:S000004069
  review:
