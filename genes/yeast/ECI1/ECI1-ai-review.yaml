suggested_questions:
- question: How does Eci1p catalyse isomerisation without the catalytic glutamate conserved in other crotonase-family
    isomerases, and which residue substitutes as the proton donor/acceptor?
- question: Is the Eci1p-Dci1p interaction a stable hetero-hexamer in the matrix, or only a transient import (piggy-back)
    association?
suggested_experiments:
- hypothesis: A non-glutamate residue in the Eci1p active site provides the catalytic base.
  description: Solve the Eci1p structure with a 3-enoyl-CoA analogue and test site-directed mutants of candidate
    active-site residues for 3,2-isomerase activity and complementation of eci1 growth on oleate.
