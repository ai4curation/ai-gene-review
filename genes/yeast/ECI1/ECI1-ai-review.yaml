- description: 'Peroxisomal Delta(3)-Delta(2)-enoyl-CoA isomerase: isomerises 3-cis/3-trans-enoyl-CoA intermediates
    to 2-trans-enoyl-CoA so that unsaturated fatty acids with double bonds at odd-numbered positions (e.g. oleate)
    can complete beta-oxidation. Essential for growth on oleate.'
