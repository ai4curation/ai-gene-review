gene_symbol: ECI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ECI1 (YLR284C) encodes the peroxisomal Delta(3)-cis-Delta(2)-trans-enoyl-CoA isomerase (EC 5.3.3.8),
  an auxiliary enzyme of beta-oxidation of unsaturated fatty acids that converts 3-cis- (and 3-trans-) enoyl-CoA
  intermediates, formed when beta-oxidation reaches a double bond at an odd-numbered position, into 2-trans-enoyl-CoAs
  that re-enter the core cycle. The purified recombinant protein is a homohexamer (dimer of trimers) of ~32 kDa
  subunits belonging to the enoyl-CoA hydratase/isomerase (crotonase) family, and it lacks the catalytic glutamate
  conserved in most family members. ECI1 is oleate-induced through an oleate response element bound by Oaf1p/Pip2p.
  Deletion abolishes cellular 3,2-isomerase activity and growth on oleic acid but not on saturated palmitic acid,
  establishing Eci1p as the essential isomerase of the isomerase-dependent route. Eci1p resides in the peroxisomal
  matrix; it interacts with its paralog Dci1p and can be imported via its own PTS1 or piggy-back with Dci1p.
