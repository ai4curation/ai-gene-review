id: P50079
gene_symbol: HSV2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Hsv2 is a fungal PROPPIN beta-propeller phosphoinositide-binding protein in the Atg18 family.
  In budding yeast it binds PI3P/PI(3,5)P2-family lipids, localizes to phagophore, endosomal and vacuolar
  membranes, contributes to autophagy of large cargos and microautophagy, and cooperates with Atg18-retromer
  in vacuole fission.'
