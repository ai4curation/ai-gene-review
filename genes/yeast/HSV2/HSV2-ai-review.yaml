- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0035850
  - PANTHER:PTN000132136
  - SGD:S000006021
  review:
    summary: The mitophagy IBD is at the family root and both seeds sit in the Atg18, Atg21 and WIPI1/2 child
      clade. Hsv2 is in the other root child, where nothing shows a mitophagy role.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBD is at the family root PTN000132136 with two seeds, S. cerevisiae Atg21 (SGD:S000006021)
      and Drosophila Atg18a. Both are in the root child PTN000132137 and join at PTN000132139. Hsv2 is in
      the other root child PTN000132247 (275 leaves, with WDR45 and WDR45B), which holds no seed for this
      term, so the node is placed above its seeds. Hsv2 is not a core autophagy factor; the 2004
      comparison of the three yeast PROPPINs found no strong phenotype for it, and its known autophagic
      roles are micronucleophagy and the uptake of large cargo. Mitophagy has not been tested in hsv2
      deletion cells in the papers read, so the row is an over-annotation and not a removal. The PAINT
      fix is to move the IBD down to PTN000132139.
    supported_by:
    - reference_id: PMID:15155809
      supporting_text: Atg18 is required for all types of autophagy, whereas a strong phenotype has not yet
        been found for Ygr223c.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Both seeds (Atg21, fly Atg18a) are in the other root child PTN000132137; the Hsv2 child PTN000132247 has no seed.
- term:
    id: GO:0000425
    label: pexophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000132136
  - SGD:S000001917
  review:
    summary: The pexophagy IBD is at the family root with a single seed, S. cerevisiae Atg18, in the other root
      child, and the hsv2 deletion strain is reported not to be defective in pexophagy. The term is wrong
      for Hsv2.
    action: REMOVE
    reason: The IBD is at the family root PTN000132136 with one seed, S. cerevisiae Atg18 (SGD:S000001917,
      IMP), which is a leaf of the root child PTN000132137. Hsv2 is in the other root child PTN000132247
      (275 leaves, with WDR45 and WDR45B), which holds no seed, so the node is placed above its seed.
      The function was also looked for on the target. Stromhaug et al. (PMID:15155809) found pexophagy
      blocked in atg18 deletion cells, normal in atg21 deletion cells, and state that the ygr223c (hsv2)
      deletion strain was not defective either, as unpublished data. With no seed in the branch and a
      reported negative on the gene, the row is removed. The PAINT fix is to move the IBD down to the
      Atg18, WIPI1 and WIPI2 node PTN000132139, which takes the term off the Hsv2 side and keeps it on the
      Atg18 orthologs.
    supported_by:
    - reference_id: PMID:15155809
      supporting_text: Similarly, the ygr223c Δ strain was not defective in pexophagy (our unpublished data).
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The single seed (S. cerevisiae Atg18) is in the other root child PTN000132137; the Hsv2
          child PTN000132247 has no seed and the hsv2 deletion strain is reported not defective.
