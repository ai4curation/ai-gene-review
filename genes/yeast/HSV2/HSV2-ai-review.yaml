core_functions:
- description: Hsv2 is a fungal PROPPIN phosphoinositide adaptor that links PI3P-rich phagophore or
    endosomal membranes to autophagy of large cargos, microautophagy, and retromer-associated
    vacuole fission in budding yeast.
  molecular_function:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  directly_involved_in:
  - id: GO:0006914
    label: autophagy
  - id: GO:0016237
    label: microautophagy
  - id: GO:0090148
    label: membrane fission
  locations:
  - id: GO:0061908
    label: phagophore
  - id: GO:0005768
    label: endosome
  supported_by:
  - reference_id: PMID:42135946
    supporting_text: Here we show that Hsv2 is required for autophagy of large cargos such as the
      fatty acid synthase complex (FAS) and ribosomes.
    reference_section_type: ABSTRACT
  - reference_id: PMID:41806572
    supporting_text: Here we demonstrate that Hsv2 is required for rapamycin-induced bulk
      microautophagy and for micronucleophagy.
    reference_section_type: ABSTRACT
  - reference_id: PMID:42135946
    supporting_text: We further found that Hsv2 interacts with the key retromer component Vps35
      and mediates vacuole fission cooperatively with Atg18.
    reference_section_type: ABSTRACT
  - reference_id: PMID:22704557
    supporting_text: K. lactis and S. cerevisiae Hsv2, and human WIPI-1, -3, and -4
      all were found to bind efficiently to PI(3)P, PI(3,5)P2, and PI(5)P (Figure 5).
    reference_section_type: RESULTS
  - reference_id: file:genes/yeast/HSV2/HSV2-uniprot.txt
    supporting_text: DR   PANTHER; PTHR11227; WD-REPEAT PROTEIN INTERACTING WITH PHOSPHOINOSIDES
