    action: MARK_AS_OVER_ANNOTATED
    reason: The IBD is at the family root PTN000132136 with one seed, Drosophila Atg18a (IMP,
      PMID:24265594), which lies in the root child PTN000132137 inside the Atg18, WIPI1 and WIPI2 node
      PTN000132139. Hsv2 is in the other root child PTN000132247 (275 leaves, with WDR45 and WDR45B), which
      holds no seed, so the node is placed above its seed. Hsv2 is not a core autophagy factor in
      budding yeast (no strong phenotype in the 2004 comparison of the three PROPPINs), and glycogen
      autophagy has not been tested in hsv2 deletion cells. The row is an over-annotation and not a
      removal, because Hsv2 does act in the autophagy of some large cargo. The PAINT fix is to move the
      IBD down to PTN000132139.
    supported_by:
    - reference_id: PMID:15155809
      supporting_text: Atg18 is required for all types of autophagy, whereas a strong phenotype has not yet
        been found for Ygr223c.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The single seed (fly Atg18a) is in the other root child PTN000132137; the Hsv2 child PTN000132247 has no seed.
