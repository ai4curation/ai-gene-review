descriptions:
- source: Alliance_Imported
  text: NADP(+)-dependent glutamate dehydrogenase; synthesizes glutamate from ammonia
    and alpha-ketoglutarate; rate of alpha-ketoglutarate utilization differs from
    Gdh1p; expression regulated by nitrogen and carbon sources; GDH3 has a paralog,
    GDH1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GDH3
  source_id: SGD:S000000058
- source: Alliance_Automated
  text: Enables L-glutamate dehydrogenase (NADP+) activity. Involved in L-glutamate
    biosynthetic process. Located in nucleus. Human ortholog(s) of this gene implicated
    in familial hyperinsulinemic hypoglycemia 6; hyperinsulinism; and hypoglycemia.
    Orthologous to human GLUD1 (glutamate dehydrogenase 1) and GLUD2 (glutamate dehydrogenase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GDH3
