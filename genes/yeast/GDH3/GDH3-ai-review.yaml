description: NADP+-specific glutamate dehydrogenase 2 (EC 1.4.1.4) of Saccharomyces cerevisiae, the whole-genome
  duplication paralog of GDH1. GDH3 catalyses the NADPH-dependent reductive amination of 2-oxoglutarate
  with ammonium to L-glutamate. The purified enzyme differs from GDH1 in its allosteric properties and
  its rate of 2-oxoglutarate utilisation, and the two isozymes are differentially expressed according
  to carbon source, with GDH3 contributing mainly under respiratory (non-fermentative) conditions. GDH3
  provides a third route of glutamate biosynthesis besides GDH1 and the glutamine synthetase/glutamate
  synthase cycle; gdh1 glt1 double mutants still grow on ammonium because of GDH3, while gdh1 glt1 gdh3
  triple mutants are strict glutamate auxotrophs.
