id: P53037
gene_symbol: PSD2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Psd2 (YGR170W) is the non-mitochondrial phosphatidylserine decarboxylase of Saccharomyces cerevisiae
  (EC 4.1.1.65), a large type II PSD with two N-terminal C2 domains and a C-terminal PSD domain that is self-processed
  into beta and pyruvoyl-containing alpha chains. It is a peripheral membrane protein on the cytoplasmic face of
  endosomes (originally assigned to a Golgi/vacuole-like fraction), where it decarboxylates phosphatidylserine delivered
  from the ER to make phosphatidylethanolamine. Psd2 accounts for a minor fraction (about 5-10%) of cellular PSD
  activity, but psd1 psd2 double mutants are ethanolamine auxotrophs. Its C2 domains bind the Sec14 homolog Pdr17/PstB2
  and are required for non-vesicular PS transport to the Psd2 site at ER-endosome contacts; Psd2-derived PE also
  supports heavy-metal resistance.
