- source: Alliance_Imported
  text: Phosphatidylserine decarboxylase of the Golgi and vacuolar membranes; converts
    phosphatidylserine to phosphatidylethanolamine; controls vacuolar membrane phospholipid
    content by regulating phospholipids in compartments that will eventually give
    rise to the vacuole; loss of Psd2p causes a specific reduction in vacuolar membrane
    PE levels while total PE levels are not significantly affected
