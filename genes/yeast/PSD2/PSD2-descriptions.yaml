status: COMPLETE
descriptions:
- source: UniProt
  text: Catalyzes the formation of phosphatidylethanolamine (PtdEtn) from phosphatidylserine
    (PtdSer). Plays a central role in phospholipid metabolism and in the interorganelle
    trafficking of phosphatidylserine (PubMed:24366873, PubMed:7890739, PubMed:7890740).
    Phosphatidylethanolamine produced by PSD2 is insufficient to completely provide
    the PtdEtn pool required by mitochondria under respiratory conditions (PubMed:11294902).
    PSD2 is also involved in the PtdSer transport step to the site of PtdEtn synthesis
    on the Golgi/endosome membranes (PubMed:24366873). Required for normal heavy metal
    resistance (PubMed:20016005).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53037
