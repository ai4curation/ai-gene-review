gene_symbol: PSD2
organism: yeast
uniprot_id: P53037
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the formation of phosphatidylethanolamine (PtdEtn) from phosphatidylserine
    (PtdSer). Plays a central role in phospholipid metabolism and in the interorganelle
    trafficking of phosphatidylserine (PubMed:24366873, PubMed:7890739, PubMed:7890740).
    Phosphatidylethanolamine produced by PSD2 is insufficient to completely provide
    the PtdEtn pool required by mitochondria under respiratory conditions (PubMed:11294902).
    PSD2 is also involved in the PtdSer transport step to the site of PtdEtn synthesis
    on the Golgi/endosome membranes (PubMed:24366873). Required for normal heavy metal
    resistance (PubMed:20016005).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53037
  source_id: P53037
- source: Alliance_Imported
  text: Phosphatidylserine decarboxylase of the Golgi and vacuolar membranes; converts
    phosphatidylserine to phosphatidylethanolamine; controls vacuolar membrane phospholipid
    content by regulating phospholipids in compartments that will eventually give
    rise to the vacuole; loss of Psd2p causes a specific reduction in vacuolar membrane
    PE levels while total PE levels are not significantly affected
  source_type: curated
  url: https://www.yeastgenome.org/locus/PSD2
  source_id: SGD:S000003402
- source: Alliance_Automated
  text: Enables phosphatidylserine decarboxylase activity. Involved in phosphatidylcholine
    biosynthetic process. Located in Golgi membrane and endosome membrane.
  source_type: automated
