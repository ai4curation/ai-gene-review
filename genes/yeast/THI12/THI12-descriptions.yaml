gene_symbol: THI12
organism: yeast
uniprot_id: P42883
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Responsible for the formation of the pyrimidine heterocycle in the thiamine
    biosynthesis pathway. Catalyzes the formation of hydroxymethylpyrimidine phosphate
    (HMP-P) from histidine and pyridoxal phosphate (PLP). The protein uses PLP and
    the active site histidine to form HMP-P, generating an inactive enzyme. The enzyme
    can only undergo a single turnover, which suggests it is a suicide enzyme.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P42883
  source_id: P42883
- source: Alliance_Imported
  text: Protein involved in synthesis of the thiamine precursor HMP; member of a subtelomeric
    gene family including THI5, THI11, THI12, and THI13; hydroxymethylpyrimidine is
    also known as HMP
  source_type: curated
  url: https://www.yeastgenome.org/locus/THI12
  source_id: SGD:S000005276
- source: Alliance_Automated
  text: Predicted to enable 4-amino-5-hydroxymethyl-2-methylpyrimidine phosphate synthase
    activity from histidine and PLP. Involved in thiamine biosynthetic process.
  source_type: automated
  url: https://www.yeastgenome.org/locus/THI12
  source_id: SGD:S000005276
