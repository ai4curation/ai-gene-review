- description: Phospholipase C cleavage of IPC, MIPC and M(IP)2C to ceramide and (mannosyl)inositol 
    phosphate, the only known route of complex-sphingolipid catabolism in budding yeast; acts in the
    ER and, after the diauxic shift, at the mitochondrial outer membrane.
