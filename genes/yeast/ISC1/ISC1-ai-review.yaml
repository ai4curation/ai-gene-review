  label: Saccharomyces cerevisiae S288C
description: 'Isc1 is the sole neutral sphingomyelinase-family enzyme of Saccharomyces cerevisiae, a Mg2+-dependent,
  phosphatidylserine-stimulated inositol phosphosphingolipid phospholipase C that hydrolyses the complex
  sphingolipids inositol phosphorylceramide (IPC), mannosyl-IPC and mannosyl-diinositol phosphorylceramide
  to ceramide (phytoceramide) plus the corresponding (mannosyl)inositol phosphate; it also cleaves sphingomyelin
  in vitro, although yeast does not make sphingomyelin. It is the only known enzyme of complex-sphingolipid
  catabolism in budding yeast. Isc1 is an integral membrane protein found in the ER during early growth
  that relocates to the mitochondrial outer membrane in late logarithmic/post-diauxic growth, where its
  activity rises and it generates mitochondrial alpha-hydroxylated very-long-chain phytoceramides needed
  for normal respiratory function. Isc1-derived ceramides also act as signals, for example in hydroxyurea
  resistance and the spindle assembly checkpoint through ceramide-activated PP2A (Cdc55).'
