descriptions:
- source: UniProt
  text: Responsible for the hydrolysis of the phosphosphingolipids (IPS), inositol
    phosphorylceramide (IPC), mannosylinositol phosphorylceramide (MIPC), and mannosyldiinositol
    phosphorylceramide (M(IP)2C) (PubMed:11006294). Regulates sphingolipid metabolism
    in mitochondria, especially the formation of alpha-hydroxylated very long chain
    phytoceramides. The generated ceramides contribute to the normal function of mitochondria
    (PubMed:17880915). Also active on sphingomyelin (SM), but this activity is probably
    not physiologically relevant (PubMed:11006294).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40015
  source_id: P40015
- source: Alliance_Imported
  text: Inositol phosphosphingolipid phospholipase C; hydrolyzes complex sphingolipids
    to produce ceramide; regulates the spindle assembly checkpoint upstream of PP2A-Cdc55;
    activates genes required for non-fermentable carbon source metabolism during the
    diauxic shift; mediates Na+ and Li+ halotolerance; activated by phosphatidylserine,
    cardiolipin and phosphatidylglycerol; mitochondrial outer membrane protein; ortholog
    of mammalian neutral sphingomyelinase type 2
  source_type: curated
  url: https://www.yeastgenome.org/locus/ISC1
  source_id: SGD:S000000821
- source: Alliance_Automated
  text: Enables inositol phosphosphingolipid phospholipase activity. Involved in cellular
    response to hydroxyurea; regulation of mitotic cell cycle spindle assembly checkpoint;
    and sphingolipid metabolic process. Located in endoplasmic reticulum membrane
    and mitochondrial outer membrane. Orthologous to human SMPD2 (sphingomyelin phosphodiesterase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ISC1
  source_id: SGD:S000000821
