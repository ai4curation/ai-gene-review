- source: Alliance_Automated
  text: Enables inositol phosphosphingolipid phospholipase activity. Involved in cellular
    response to hydroxyurea; regulation of mitotic cell cycle spindle assembly checkpoint;
    and sphingolipid metabolic process. Located in endoplasmic reticulum membrane
    and mitochondrial outer membrane. Orthologous to human SMPD2 (sphingomyelin phosphodiesterase
    2).
