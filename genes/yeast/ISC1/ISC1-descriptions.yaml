descriptions:
- source: UniProt
  text: Responsible for the hydrolysis of the phosphosphingolipids (IPS), inositol
    phosphorylceramide (IPC), mannosylinositol phosphorylceramide (MIPC), and mannosyldiinositol
    phosphorylceramide (M(IP)2C) (PubMed:11006294). Regulates sphingolipid metabolism
    in mitochondria, especially the formation of alpha-hydroxylated very long chain
    phytoceramides. The generated ceramides contribute to the normal function of mitochondria
    (PubMed:17880915). Also active on sphingomyelin (SM), but this activity is probably
    not physiologically relevant (PubMed:11006294).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40015
  source_id: P40015
