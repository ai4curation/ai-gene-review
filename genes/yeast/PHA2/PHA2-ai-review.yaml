id: P32452
gene_symbol: PHA2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PHA2 encodes prephenate dehydratase (EC 4.2.1.51) of Saccharomyces cerevisiae, the enzyme
  of the phenylalanine branch of aromatic amino acid biosynthesis that decarboxylates and dehydrates prephenate
  (produced from chorismate by ARO7) to phenylpyruvate, which is then transaminated to phenylalanine by
  ARO8 or ARO9. Pha2 belongs to the PDT family (catalytic PDT domain followed by an ACT regulatory domain,
  as in bacterial PheA-type enzymes) and is a soluble cytoplasmic protein. pha2 mutants are phenylalanine
  auxotrophs. The PHA2 open reading frame (YNL316C) lies adjacent to ATP11 and was sequenced in the course
  of the ATP11 study.
