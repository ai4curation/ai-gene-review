core_functions:
- description: 'Scaffold of the piccolo NuA4 HAT module. Epl1 contributes to the acetylation of nucleosomal
    histones H4 and H2A catalysed by Esa1: without Epl1 there is no nucleosomal activity, and its depletion
    abolishes global H4 and H2A acetylation. Through NuA4 this activity serves gene-specific transcriptional
    activation and DNA double-strand break repair.'
