id: P43572
gene_symbol: EPL1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Epl1 (Enhancer of polycomb-like protein 1, YFL024C) is the essential, non-catalytic scaffold
  subunit of the NuA4 histone acetyltransferase, the yeast member of the Enhancer of Polycomb family.
  Its conserved N-terminal EPcA region binds the MYST acetyltransferase Esa1 and, separately, Yng2 and
  Eaf6, assembling the catalytic HAT module known as piccolo NuA4. Epl1 raises the specific activity of
  Esa1 and, with Yng2, enables it to acetylate nucleosomal histones H4 and H2A, which Esa1 alone cannot
  do. A short basic region at the N-terminal edge of EPcA is required for piccolo NuA4 to bind the nucleosome
  core particle, and Epl1 is the main nucleosome-binding subunit of the module. The C-terminal region
  of Epl1 docks onto the HSA domain of the scaffold subunit Eaf1, tethering the HAT module to the 13-subunit
  NuA4 complex; without it piccolo NuA4 is released as a free, non-targeted complex. Epl1 is nuclear.
  Depletion causes global loss of H4 and H2A acetylation and accumulation of cells in G2/M, and epl1 mutations
  suppress telomere position-effect silencing. Through NuA4 it contributes to gene-specific transcriptional
  activation and to DNA double-strand break repair.
