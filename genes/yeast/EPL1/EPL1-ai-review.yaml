knowledge_gaps:
- gap_statement: How the Epl1 N-terminal basic region promotes nucleosomal acetylation after piccolo NuA4
    has bound the nucleosome is not known.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The short basic region at the N-terminal edge of EPcA lies near the H2A tail, the H4 globular
    domain and nucleosomal DNA, and is needed to acetylate nucleosomes but not to bind them. Huang and
    Tan suggest it may release substrate tails from DNA; this has not been tested.
  provenance:
  - reference_id: PMID:23109429
    supporting_text: these regions may function after the enzyme binds nucleosomes to disengage substrate
      histone tails from nucleosomal DNA
