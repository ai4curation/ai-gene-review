    label: eisosome
  evidence_type: IDA
  original_reference_id: PMID:20526336
  qualifier: located_in
  review:
    summary: >-
      ACCEPT: Pil1 and Ymr031c/Eis1 fluorescence overlapped at eisosomes.
    action: ACCEPT
    reason: >-
      Aguilar et al. tagged Pil1 and Ymr031c, found perfect overlap at
