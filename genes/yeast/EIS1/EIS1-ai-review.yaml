- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: HDA
  original_reference_id: PMID:14562095
  qualifier: located_in
  review:
    summary: >-
      KEEP_AS_NON_CORE: broad cytoplasmic signal is compatible with a peripheral
      eisosome protein but is less informative than eisosome localization.
    action: KEEP_AS_NON_CORE
    reason: >-
      Global localization screens place Eis1/Ymr031c in the cytoplasmic/cell
      periphery fraction, and Eis1 was later shown directly to colocalize with
      Pil1 and Lsp1 in cortical eisosomes. The broad cytoplasm row can be kept
      as a non-core localization rather than treated as the main site.
    additional_reference_ids:
    - PMID:20526336
    supported_by:
    - reference_id: PMID:20526336
      supporting_text: >-
        The signal from Pil1 and Ymr031c perfectly overlapped at eisosomes
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:14576278
  qualifier: located_in
  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: mitochondrial HDA detections are not supported as
      a functional Eis1 site.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Multiple large-scale proteomic studies report mitochondrial enrichment or
      phosphorylation of Eis1, but the best Eis1-directed experiments localize
      the protein to cortical eisosomes and show a requirement for normal Pil1
      and Lsp1 eisosome formation. The mitochondrial rows should be treated as
      secondary high-throughput detections rather than the core site of action.
    additional_reference_ids:
    - PMID:20526336
    supported_by:
    - reference_id: PMID:20526336
      supporting_text: >-
        Collectively, these data show that Ymr031c is physically associated
        with eisosomes and is required for their normal formation.
