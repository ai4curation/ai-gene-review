  evidence_type: HDA
  original_reference_id: PMID:16823961
  qualifier: located_in
  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: mitochondrial proteomics is outweighed by
      Eis1-directed eisosome localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The core Eis1 site is the eisosome at the plasma-membrane cortex. Because
      the cached direct literature shows Pil1/Lsp1-associated eisosome
      localization and an eisosome assembly phenotype, the older
      high-throughput mitochondrion detections are over-specific as functional
      localization calls.
    additional_reference_ids:
    - PMID:20526336
    supported_by:
    - reference_id: PMID:20526336
      supporting_text: >-
        The signal from Pil1 and Ymr031c perfectly overlapped at eisosomes
