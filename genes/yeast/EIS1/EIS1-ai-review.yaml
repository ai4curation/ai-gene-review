  original_reference_id: PMID:19269952
  qualifier: located_in
  review:
    summary: >-
      ACCEPT: tagged Ymr031c localized with Lsp1 and behaved as an eisosome
      component.
    action: ACCEPT
    reason: >-
      Grossmann et al. tagged Ymr031c, observed a cell-periphery/eisosome-like
      localization, reciprocally co-purified Pil1 and Lsp1 with the query
      protein, and found that Ymr031c relocalized together with Lsp1 after Pil1
      C-terminal truncation. This directly supports eisosome localization.
    supported_by:
