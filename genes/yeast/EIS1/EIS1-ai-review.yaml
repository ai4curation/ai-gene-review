id: Q05050
gene_symbol: EIS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  EIS1 is a large peripheral eisosome protein in Saccharomyces cerevisiae. It
  physically associates with Pil1/Lsp1-containing eisosomes at specialized
  plasma-membrane domains and is required for normal eisosome architecture and
  assembly.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      ACCEPT: Eis1 is an eisosome assembly factor, but its direct molecular
      activity is not known.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      Direct experiments show that EIS1 encodes an eisosome-associated protein
      required for normal Pil1/Lsp1 eisosome organization, but they do not
      establish a catalytic, transporter, or specific structural activity that
      can be represented as a GO molecular_function term.
    additional_reference_ids:
    - PMID:20526336
    supported_by:
    - reference_id: PMID:20526336
      supporting_text: >-
        Collectively, these data show that Ymr031c is physically associated
        with eisosomes and is required for their normal formation.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16429126
  qualifier: enables
  supporting_entities:
  - UniProtKB:P53252
  review:
    summary: >-
      KEEP_AS_NON_CORE: this broad Pil1 protein-binding row is consistent with
      later direct Eis1-Pil1 co-purification, but protein binding is not a core
      molecular function.
    action: KEEP_AS_NON_CORE
    reason: >-
      The Krogan proteome survey supports an Eis1/Pil1 physical association
      curated by SGD, and later Eis1-directed experiments confirmed that
      TAP-tagged Ymr031c precipitates Pil1. The annotation is sound, but the
      generic protein-binding term should not be elevated to a standalone core
      activity.
    additional_reference_ids:
    - PMID:20526336
    supported_by:
    - reference_id: PMID:20526336
      supporting_text: >-
        To independently confirm this observation, we performed
        immunoprecipitations of TAP-tagged Ymr031c and, as a control, Lsp1, and
        we found that both specifically precipitated Pil1
