knowledge_gaps:
- gap_statement: Eis1's elemental molecular function at eisosomes is not known.
  boundary: >-
    Direct imaging, immunoprecipitation and deletion experiments establish Eis1
    as a Pil1-associated eisosome component needed for normal assembly, but do
    not distinguish whether Eis1 is a structural scaffold, regulator, or
    recruiter at eisosomes.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
