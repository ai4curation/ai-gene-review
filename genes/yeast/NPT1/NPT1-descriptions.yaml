gene_symbol: NPT1
organism: yeast
uniprot_id: P39683
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the first step in the biosynthesis of NAD from nicotinic acid, the
    ATP-dependent synthesis of beta-nicotinate D- ribonucleotide from nicotinate and
    5-phospho-D-ribose 1-phosphate (PubMed:9521740). Essential for growth under anaerobic
    conditions (PubMed:12062417).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39683
  source_id: P39683
- source: Alliance_Imported
  text: Nicotinate phosphoribosyltransferase; acts in the salvage pathway of NAD+
    biosynthesis; required for silencing at rDNA and telomeres and has a role in silencing
    at mating-type loci; localized to the nucleus
  source_type: curated
  url: https://www.yeastgenome.org/locus/NPT1
  source_id: SGD:S000005735
- source: Alliance_Automated
  text: Enables nicotinate phosphoribosyltransferase activity. Involved in nicotinate
    nucleotide salvage; rDNA heterochromatin formation; and subtelomeric heterochromatin
    formation. Located in nucleus. Orthologous to human NAPRT (nicotinate phosphoribosyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NPT1
  source_id: SGD:S000005735
