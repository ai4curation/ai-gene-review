  label: Saccharomyces cerevisiae S288C
description: NPT1 encodes nicotinate phosphoribosyltransferase (NAPRTase), the ATP-stimulated enzyme that
  condenses nicotinate with 5-phospho-alpha-D-ribose 1-diphosphate to form nicotinate D-ribonucleotide
  (NaMN), the first step of the Preiss-Handler route by which nicotinic acid and nicotinamide (after deamidation
  by Pnc1) are salvaged into NAD+. Npt1 and the kynurenine pathway are the only sources of the nicotinic
  acid moiety of NAD+, so npt1 is lethal with kynurenine-pathway mutations and Npt1 is essential anaerobically.
  Npt1 is cytoplasmic and concentrated in the nucleus in many cells; its activity sustains NAD+ supply
  to Sir2 for telomeric, rDNA and mating-type silencing, and increased NPT1 dosage extends replicative
  lifespan.
