proposed_new_terms: []
suggested_questions:
- question: What controls the cell-to-cell variation in nuclear concentration of Npt1 (about 40% of cells),
    and does it track Sir2 demand for NAD+?
- question: Should the catalytic-activity-independent chaperone activity reported for overexpressed Npt1
    in proteotoxicity models (PMID:33749726) be annotated?
suggested_experiments:
- description: Tether Npt1 to the nucleus or exclude it, then measure silencing, rDNA stability and lifespan
    under nicotinamide-only conditions.
  experiment_type: genetics/cell biology
  hypothesis: Nuclear Npt1 is sufficient for Sir2-dependent silencing.
