taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: HEM4 encodes uroporphyrinogen-III synthase (UROS, EC 4.2.1.75), the fourth enzyme of tetrapyrrole biosynthesis.
  It cyclises the linear tetrapyrrole hydroxymethylbilane, made by Hem3p, into the asymmetric macrocycle uroporphyrinogen
  III, inverting ring D. Without the enzyme the substrate cyclises spontaneously to the non-physiological uroporphyrinogen
  I isomer. Uroporphyrinogen III is the last common precursor of heme and siroheme. Yeast UROS shares only 18-23%
  sequence identity with UROS from other organisms. hem4 deletion abolishes UROS activity and causes porphyrin accumulation,
  respiratory deficiency and heme auxotrophy. The hem4 null strain has served as a complementation host for identifying
  plant UROS. The gene was first isolated as a complementing locus for the ts2326 and cyt mutations and was originally
  thought to be involved in mitochondrial import, an attribution later corrected.
