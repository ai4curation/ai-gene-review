suggested_questions:
- question: Given its low sequence identity to other UROS enzymes, does yeast Hem4p share the two-domain fold and
    active-site residues of human UROS, and is it, like the human enzyme, unusually thermolabile?
suggested_experiments:
- hypothesis: Hem4p availability limits the partition of hydroxymethylbilane between uroporphyrinogen III and spontaneous
    uroporphyrinogen I formation in vivo
  description: Titrate HEM4 expression with a regulatable promoter and quantify uroporphyrin I vs III isomers and
    heme/siroheme output by HPLC.
  experiment_type: genetic titration / metabolite analysis
