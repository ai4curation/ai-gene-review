- source: Alliance_Imported
  text: Uroporphyrinogen III synthase; catalyzes the conversion of hydroxymethylbilane
    to uroporphyrinogen III, the fourth step in heme biosynthesis; deficiency in the
    human homolog can result in the disease congenital erythropoietic porphyria
  source_type: curated
  url: https://www.yeastgenome.org/locus/HEM4
  source_id: SGD:S000005804
- source: Alliance_Automated
  text: Enables uroporphyrinogen-III synthase activity. Involved in heme biosynthetic
    process. Predicted to be active in cytosol. Used to study erythropoietic protoporphyria.
    Human ortholog(s) of this gene implicated in cutaneous porphyria. Orthologous
    to human UROS (uroporphyrinogen III synthase).
