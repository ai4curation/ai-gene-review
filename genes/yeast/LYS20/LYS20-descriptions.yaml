- source: Alliance_Imported
  text: Homocitrate synthase isozyme and functions in DNA repair; catalyzes the condensation
    of acetyl-CoA and alpha-ketoglutarate to form homocitrate, which is the first
    step in the lysine biosynthesis pathway; LYS20 has a paralog, LYS21, that arose
    from the whole genome duplication
