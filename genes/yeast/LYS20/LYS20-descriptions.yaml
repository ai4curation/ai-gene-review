  text: Enables homocitrate synthase activity. Involved in DNA repair and L-lysine
    biosynthetic process. Located in nucleus. Human ortholog(s) of this gene implicated
    in 3-hydroxy-3-methylglutaryl-CoA lyase deficiency and amino acid metabolic disorder.
    Orthologous to human HMGCL (3-hydroxy-3-methylglutaryl-CoA lyase) and HMGCLL1
    (3-hydroxy-3-methylglutaryl-CoA lyase like 1).
