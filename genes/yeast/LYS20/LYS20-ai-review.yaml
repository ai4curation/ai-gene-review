suggested_questions:
- question: In which compartment is homocitrate actually synthesised by Lys20/Lys21 (nucleus, cytosol
    or mitochondria), and how does the nuclear location connect to the mitochondrial homoaconitase and
    homoisocitrate dehydrogenase steps?
- question: Do Lys20 and Lys21 form mixed oligomers in vivo, and does hetero-oligomerisation change lysine
    feedback sensitivity?
suggested_experiments:
- hypothesis: Homocitrate synthesis for lysine biosynthesis is carried out by the nuclear pool of Lys20/Lys21.
  description: Restrict Lys20 (in a lys21 deletion) to the nucleus or exclude it from the nucleus with
    NLS mutations/NES fusions that preserve catalytic activity in vitro, and measure lysine prototrophy,
    homocitrate and alpha-aminoadipate pools.
