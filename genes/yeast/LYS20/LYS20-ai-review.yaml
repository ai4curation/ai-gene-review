description: 'Homocitrate synthase isozyme Lys20 (EC 2.3.3.14) of Saccharomyces cerevisiae, a member of
  the alpha-isopropylmalate synthase/homocitrate synthase (DRE-TIM barrel) family. It catalyses the condensation
  of acetyl-CoA and 2-oxoglutarate to homocitrate, the first and committed step of the alpha-aminoadipate
  pathway of lysine biosynthesis, and is feedback-inhibited by lysine. Lys20 and its paralog Lys21 are
  partially redundant: Lys20 supplies most homocitrate in glucose-grown cells, whereas Lys21 dominates
  during respiratory growth; LYS20 expression is strongly repressed by lysine. Feedback control of homocitrate
  synthesis sets the supply of the co-inducer alpha-aminoadipate semialdehyde for the Lys14 transcriptional
  activator. Lys20 lacks a mitochondrial targeting sequence and is located predominantly in the nucleus,
  partly chromatin-associated. In the nucleus it has a separable, non-catalytic moonlighting role in DNA
  double-strand break repair: it is recruited to breaks and promotes INO80 recruitment and histone eviction,
  which suppresses the DNA-damage sensitivity of esa1 mutants.'
