  review:
    summary: Phylogenetic inference that RLF2/Cac1 has H3-H4 histone complex chaperone activity.
    action: ACCEPT
    reason: Cac1 is the scaffold subunit of CAF-1 and carries the acidic (ED) histone-binding region and
      the winged-helix domain; a fragment of Cac1 alone can assemble tetrasomes, albeit less efficiently
      than Cac1-Cac2. The CAF-1 trimer binds one H3-H4 dimer and two CAF-1-H3-H4 complexes deposit an
      (H3-H4)2 tetramer onto DNA, which is the defining activity of an H3-H4 histone complex chaperone.
