id: Q12495
gene_symbol: RLF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: RLF2 (CAC1) encodes Cac1, the large (p150-like) scaffold subunit of chromatin assembly factor
  1 (CAF-1), the heterotrimeric H3-H4 histone chaperone (Cac1-Cac2-Cac3/Msi1) that deposits newly synthesized
  histones H3-H4 onto DNA immediately behind the replication fork and at sites of repair synthesis. Cac1
  organizes the complex, binding Cac2 and Cac3 through separate regions; its acidic region forms the histone-binding
  surface together with Cac2; a PIP box recruits CAF-1 to PCNA; and two DNA-binding modules (the KER coiled-coil
  region and a C-terminal winged helix domain) engage DNA once H3-H4 is bound, allowing two CAF-1-H3-H4
  complexes to assemble an (H3-H4)2 tetrasome. Cac1 acts in the nucleus on replicating chromatin, and
  its association with chromatin is regulated by Cdc28 and Cdc7 phosphorylation in S phase. CAF-1 is not
  essential for growth, but cac1 mutants have reduced telomeric and HM-locus silencing (originally identified
  as altered Rap1 localization, hence RLF2), sensitivity to UV and double-strand-break agents, and centromeric
  chromatin defects in combination with hir mutations.
