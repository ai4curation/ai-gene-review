- term:
    id: GO:0000786
    label: nucleosome
  evidence_type: IDA
  original_reference_id: PMID:30239791
  qualifier: part_of
  review:
    summary: Complex Portal annotation placing RLF2 (a CAF-1 subunit) as part_of the nucleosome, citing
      a review of CAF-1 mechanism (PMID:30239791).
    action: REMOVE
    reason: CAF-1 is a histone H3-H4 chaperone that deposits H3-H4 onto DNA to build the tetrasome; it
      is not a structural component of the nucleosome core particle, which consists of the histone octamer
      and DNA. The cited paper (full text cached; a review) describes CAF-1 binding a single H3-H4 dimer
      and depositing (H3-H4)2 tetramers onto nucleosome-free DNA, i.e. a transient assembly intermediate,
      not stable membership of the nucleosome. The part_of nucleosome claim is contradicted by the very
      source cited, so it is removed; the chaperone role is captured by GO:0006335 and CAF-1 complex membership
      (GO:0033186).
    supported_by:
    - &id003
      reference_id: PMID:30239791
      supporting_text: The Histone chaperone Chromatin Assembly Factor-1 (CAF-1) interacts with the replisome
        and deposits H3-H4 directly onto newly synthesized DNA.
    - &id004
      reference_id: PMID:30239791
      supporting_text: Two CAF-1•H3-H4 complexes co-associate on nucleosome-free DNA depositing (H3-H4)2
        tetramers in the first step of nucleosome assembly.
