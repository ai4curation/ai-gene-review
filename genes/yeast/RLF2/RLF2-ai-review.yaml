- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: NAS
  original_reference_id: PMID:30239791
  qualifier: involved_in
  review:
    summary: Complex Portal NAS annotation of RLF2/CAF-1 to the broad process DNA replication.
    action: MARK_AS_OVER_ANNOTATED
    reason: CAF-1 does not synthesize or duplicate DNA; it couples nucleosome assembly to replication
      fork progression through PCNA binding. The replication-coupled role is precisely described by GO:0006335
      (DNA replication-dependent chromatin assembly), which is annotated with direct evidence. CAC genes
      are not essential for viability, and no DNA synthesis defect is reported for cac mutants, so the
      parent process DNA replication overstates the contribution.
    supported_by:
    - *id003
    - reference_id: PMID:9030687
      supporting_text: Genes encoding the CAF-I subunits (collectively referred to as CAC genes) are not
        essential for cell viability
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: NAS
  original_reference_id: PMID:30239791
  qualifier: involved_in
  review:
    summary: Complex Portal NAS annotation of RLF2/CAF-1 to DNA repair.
    action: KEEP_AS_NON_CORE
    reason: Deletion of any CAC gene causes UV sensitivity, and cac1 deletion increases the UV sensitivity
      of mutants in every major repair epistasis group, consistent with CAF-1 restoring chromatin on repaired
      DNA (it assembles nucleosomes on templates undergoing nucleotide excision repair in vitro). CAF-1
      is also required for resistance to double-strand-break agents, but it is not required for repair
      of the DNA per se. The contribution is chromatin restoration coupled to repair rather than a repair
      activity, so this is kept as a non-core, pleiotropic process.
    supported_by:
    - reference_id: PMID:9030687
      supporting_text: deletion of any CAC gene causes an increase in sensitivity to ultraviolet radiation,
        without significantly increasing sensitivity to gamma rays
    - reference_id: PMID:9927445
      supporting_text: these data suggest that CAF-I has a role in error-free postreplicative damage repair
        and may also have an auxiliary role in other repair mechanisms
    - reference_id: PMID:16143623
      supporting_text: CAF-1 is not required for repair of the DNA per se or for DNA damage checkpoint
        function.
