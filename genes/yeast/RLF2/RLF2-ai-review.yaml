  review:
    summary: 'Proposed: Cac1 binds DNA directly through its C-terminal winged helix domain and its KER
      region.'
    action: NEW
    reason: Zhang et al. solved the Cac1 C-terminal winged-helix domain and showed it binds DNA sequence-independently;
      mutations abolishing DNA binding cause silencing defects and damage sensitivity. Sauer et al. identified
      a second DNA-binding region (KER) in Cac1 required for high-affinity DNA binding by the trimer,
      and Mattiroli et al. showed H3-H4 binding activates WHD-DNA engagement during tetrasome assembly.
