    summary: RLF2 contributes to H3-H4 binding by CAF-1; CAF-1 was co-purified with H3 and H4 from yeast
      cells.
    action: ACCEPT
    reason: Yeast CAF-1 was isolated from cells in complex with H3 and H4 carrying newly-synthesized histone
      marks (H4K5/K12ac, H3K56ac). Structural work shows the H3-H4 binding site is formed by the acidic
      region of Cac1 in conjunction with Cac2, so contributes_to histone binding is appropriate for RLF2.
      The more specific activity, H3-H4 histone complex chaperone activity, is captured in core_functions.
    supported_by:
    - reference_id: PMID:16503640
      supporting_text: we have purified a complex containing CAF-1 and H3 and H4 from yeast cells
    - reference_id: PMID:28315523
      supporting_text: On CAF-1, the H3-H4 binding site is formed by the acidic region of Cac1 (Liu et
        al., 2016), in conjunction with Cac1-bound Cac2 (Mattiroli et al., 2017).
