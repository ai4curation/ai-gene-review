core_functions:
- description: 'Cac1 is the scaffold subunit of CAF-1 and, within the complex, carries out H3-H4 histone
    complex chaperone activity: its acidic region together with Cac2 binds one H3-H4 dimer, and histone
    binding activates Cac1 DNA-binding modules so that two CAF-1-H3-H4 complexes deposit an (H3-H4)2 tetramer
    onto DNA.'
  molecular_function:
    id: GO:0000510
    label: H3-H4 histone complex chaperone activity
  directly_involved_in:
  - &id011
    id: GO:0006335
    label: DNA replication-dependent chromatin assembly
  in_complex: &id012
    id: GO:0033186
    label: CAF-1 complex
  locations:
  - id: GO:0005634
    label: nucleus
  - &id013
    id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:28418026
    supporting_text: Strikingly, H3-H4 binding is mediated by a composite interface, shaped by Cac1-bound
      Cac2 and the Cac1 acidic region.
  - reference_id: PMID:28418026
    supporting_text: The large subunit, Cac1 organizes the assembly of CAF-1.
  - reference_id: PMID:30239791
    supporting_text: The CAF-1 trimer binds to a single H3-H4 dimer, which induces a conformational rearrangement
      in CAF-1 promoting its interaction with substrate DNA.
  - *id010
  - reference_id: file:yeast/RLF2/RLF2-deep-research-falcon.md
    supporting_text: It is a nuclear histone-chaperone scaffold.
- description: Cac1 binds DNA through a C-terminal winged-helix domain and an N-terminal KER region; together
    with PIP-box binding to PCNA this retains CAF-1 at replication forks for replication-coupled nucleosome
    assembly.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
  - *id011
  in_complex: *id012
  locations:
  - *id013
  supported_by:
  - *id014
  - *id015
  - reference_id: PMID:30239791
    supporting_text: The PIP-box motif mediates the interaction with PCNA
  - reference_id: PMID:11089978
    supporting_text: All silencing defective mutants showed reduced binding to CAF-1 in vitro and altered
      chromatin association of the CAF-1 large subunit in vivo.
proposed_new_terms: []
suggested_questions:
- question: Does the PCNA-binding PIP box of Cac1 warrant a dedicated GO molecular function term (sliding
    clamp binding), given its central role in recruiting CAF-1 to replication and repair sites?
- question: Should CAF-1 subunits carry silent mating-type cassette heterochromatin formation (GO:0030466),
    given that CAF-I is needed for maintenance but not re-establishment of HML silencing?
- question: How do Cdc28 and Cdc7 phosphorylation of Cac1 coordinate CAF-1 chromatin loading with S-phase
    progression independently of PCNA binding?
suggested_experiments:
- description: Combine Cac1 WHD and KER DNA-binding mutants with PIP-box mutants and measure CAF-1 occupancy
    on nascent chromatin (e.g. by nascent-chromatin capture) and tetrasome assembly kinetics in vivo.
  experiment_type: genetic and genomic
  hypothesis: DNA binding and PCNA binding act additively to retain CAF-1 behind the fork, and loss of
    both abolishes replication-coupled H3-H4 deposition.
