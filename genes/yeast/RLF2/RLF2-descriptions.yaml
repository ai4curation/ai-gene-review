gene_symbol: RLF2
organism: yeast
uniprot_id: Q12495
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Acts as a component of the histone chaperone complex chromatin assembly factor
    1 (CAF-1), which assembles histone octamers onto DNA during replication and repair
    (PubMed:9030687, PubMed:9030688). CAF-1 performs the first step of the nucleosome
    assembly process, bringing newly synthesized histones H3 and H4 to replicating
    DNA; histones H2A/H2B can bind to this chromatin precursor subsequent to DNA replication
    to complete the histone octamer (By similarity). Plays a role in the maintenance
    of heterochromatin (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12495
  source_id: Q12495
  review:
    reviewer: AI
    rubrics:
