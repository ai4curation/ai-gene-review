findings:
- category: discrepancy
  text: The automated text places Rlf2 in the nucleosome; the review removes that
    annotation, as CAF-1 is a chaperone and not a nucleosome component.
  sources:
  - Alliance_Automated
- category: gap
  text: SGD names repression of divergent noncoding transcription, which the review
    does not cover.
  sources:
  - Alliance_Imported
