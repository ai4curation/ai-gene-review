gene_symbol: RLF2
organism: yeast
uniprot_id: Q12495
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acts as a component of the histone chaperone complex chromatin assembly factor
    1 (CAF-1), which assembles histone octamers onto DNA during replication and repair
    (PubMed:9030687, PubMed:9030688). CAF-1 performs the first step of the nucleosome
    assembly process, bringing newly synthesized histones H3 and H4 to replicating
    DNA; histones H2A/H2B can bind to this chromatin precursor subsequent to DNA replication
    to complete the histone octamer (By similarity). Plays a role in the maintenance
    of heterochromatin (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12495
  source_id: Q12495
- source: Alliance_Imported
  text: Largest subunit (p90) of the Chromatin Assembly Complex (CAF-1); chromatin
    assembly by CAF-1 is important for multiple processes including histone H3/H4
    tetramerization, silencing at telomeres, mating type loci and rDNA, maintenance
    of kinetochore structure, deactivation of  DNA damage checkpoint after DNA repair,
    chromatin dynamics during transcription, and repression of divergent noncoding
    transcription
  source_type: curated
  url: https://www.yeastgenome.org/locus/RLF2
  source_id: SGD:S000006222
- source: Alliance_Automated
  text: Contributes to histone binding activity. Involved in DNA replication-dependent
    chromatin assembly. Located in chromatin; chromosome, centromeric region; and
    nucleus. Part of CAF-1 complex and nucleosome.
  source_type: automated
  url: https://www.yeastgenome.org/locus/RLF2
  source_id: SGD:S000006222
