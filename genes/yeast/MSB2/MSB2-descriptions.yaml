gene_symbol: MSB2
organism: yeast
uniprot_id: P32334
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Plasma membrane signaling mucin that promotes activation of the MAPK for the
    filamentous growth pathway. Partially redundant with the SHO1 osmosensing branch
    for the activation of STE11.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32334
  source_id: P32334
- source: Alliance_Imported
  text: Mucin family member involved in various signaling pathways; functions as osmosensor
    in the Sho1p-mediated HOG pathway; functions in Cdc42p- and MAP kinase-dependent
    filamentous growth signaling pathway; processed into secreted and cell-associated
    forms by aspartyl protease Yps1p; potential Cdc28p substrate
  source_type: curated
  url: https://www.yeastgenome.org/locus/MSB2
  source_id: SGD:S000003246
- source: Alliance_Automated
  text: Enables osmosensor activity. Involved in several processes, including hyperosmotic
    response; osmosensory signaling pathway via Sho1 osmosensor; and signal transduction
    involved in filamentous growth. Located in extracellular region; plasma membrane;
    and site of polarized growth.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MSB2
  source_id: SGD:S000003246
