id: P32340
gene_symbol: NDI1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Ndi1 (YML120C) is the internal, rotenone-insensitive NADH:ubiquinone oxidoreductase
  of Saccharomyces cerevisiae mitochondria, a type II NADH dehydrogenase (NDH-2; EC 1.6.5.9).
  It is a nuclear-encoded, single-subunit flavoprotein of about 53 kDa that carries non-covalently
  bound FAD and no iron-sulfur clusters. After import via an N-terminal presequence, it associates
  as a monotopic, peripheral protein with the matrix face of the inner membrane, where it oxidizes
  intramitochondrial NADH and passes the electrons via FAD to ubiquinone in the membrane. Unlike
  complex I it pumps no protons and is insensitive to rotenone and piericidin, but is inhibited
  by flavone. S. cerevisiae lacks complex I, so Ndi1 is the main entry point for matrix NADH
  into the respiratory chain; the external enzymes Nde1 and Nde2 and the glycerol-3-phosphate
  shuttle handle cytosolic NADH. Crystal structures show a homodimer whose dimer interface forms
  the amphipathic membrane anchor, with overlapping NADH and quinone binding sites; dimerization
  is needed for activity and membrane targeting. Null mutants grow on glucose and ethanol but
  are impaired on lactate, pyruvate and acetate. Expressed in mammalian cells, Ndi1 reaches
  the mitochondrial matrix side and restores rotenone-insensitive NADH oxidation in complex
  I-deficient cells. Overexpression raises mitochondrial reactive oxygen species and causes
  apoptosis-like death, and deletion lowers ROS and extends chronological lifespan. NDH-2 is
  ancestral in mitochondria and has been lost from the human lineage.'
