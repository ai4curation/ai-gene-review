core_functions:
- description: Non-proton-pumping NADH:ubiquinone oxidoreductase (type-II NADH dehydrogenase, EC 1.6.5.9)
    on the matrix face of the inner mitochondrial membrane; re-oxidises matrix NADH and reduces ubiquinone-6,
    substituting for the absent Complex I.
