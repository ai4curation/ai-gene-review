suggested_questions:
- question: Is the pro-apoptotic effect of NDI1 overexpression entirely explained by increased ROS from
    respiratory flux, or does Ndi1p have an AIF/AMID-like death-effector activity independent of its NADH:ubiquinone
    oxidoreductase function?
suggested_experiments:
- description: Express catalytically inactive (FAD- or NADH-site) Ndi1p variants at high level and test
    whether apoptosis-like death and ROS increase still occur, separating enzymatic and non-enzymatic
    contributions.
