    ND4 subunit is corrected by the Saccharomyces cerevisiae NADH-quinone oxidoreductase
    (NDI1) gene.
  findings:
  - statement: Ndi1 restores NADH-dependent respiration in ND4-mutant human cells with a P:O
      ratio about two-thirds of wild type, consistent with no proton pumping by Ndi1.
    supporting_text: wild-type 143B.TK(-) cells, as expected from the lack of proton pumping activity
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Bai et al., J Biol Chem 2001). Heterologous evidence for
      non-electrogenic activity and matrix-side topology.
- id: PMID:9733747
  title: The Saccharomyces cerevisiae NDE1 and NDE2 genes encode separate mitochondrial
    NADH dehydrogenases catalyzing the oxidation of cytosolic NADH.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Luttik et al., J Biol Chem 1998). Distinguishes internal
      Ndi1 (matrix side) from the external Nde1/Nde2 enzymes that oxidize cytosolic NADH.
- id: PMID:11152939
  title: Stoichiometry and compartmentation of NADH metabolism in Saccharomyces cerevisiae.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified review (Bakker et al., FEMS Microbiol Rev 2001) placing Ndi1
      among parallel NADH reoxidation routes in yeast.
- id: PMID:42822426
  title: Comparative analysis of mitochondrial proteomes across the tree of life.
  findings:
  - statement: Comparative proteomics reconstructs NDH2 in ancestral mitochondria; retained
      in yeast, lost in humans; NDH2 recovered as a candidate pathogen drug target.
    supporting_text: mitochondria inherited NDH2, amino acid and cofactor biosynthetic pathways
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Chen et al. 2026 (Cell). Computational/comparative; provides evolutionary
      context (NDH2 ancestral, lost in human lineage) but is not evidence for NDI1 molecular
      function or localization.
core_functions:
- description: Rotenone-insensitive, non-proton-pumping, FAD-dependent NADH:ubiquinone oxidoreductase
    (type II NADH dehydrogenase) bound as a monotopic homodimer to the matrix face of the
    inner mitochondrial membrane. It oxidizes intramitochondrial NADH and reduces ubiquinone,
    and is the main entry point for matrix NADH into the respiratory chain of S. cerevisiae,
    which lacks complex I.
  molecular_function:
    id: GO:0120555
    label: NADH dehydrogenase (ubiquinone) (non-electrogenic) activity
  directly_involved_in:
  - id: GO:0006120
    label: mitochondrial electron transport, NADH to ubiquinone
  locations:
  - id: GO:0099617
    label: matrix side of mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:3138118
    supporting_text: by flavone (I50 = 95 microM), but not by rotenone or piericidin
  - reference_id: PMID:1900238
    supporting_text: that this NADH dehydrogenase catalyzes the oxidation of NADH generated inside
  - reference_id: PMID:22949654
    supporting_text: transfer of an electron from NADH via FAD to quinone, without proton pumping.
  - reference_id: PMID:9689052
    supporting_text: It is the main entry point into the respiratory chain in this organism, just
      as complex I is in mammalian mitochondria
suggested_questions:
- question: Should the cytosol (GO:0005829) is_active_in row produced by the YeastPathways
    PWY3O-188 GO-CAM conversion be retired? Ndi1 is a matrix-facing inner membrane enzyme,
    and the cytosolic location looks like a pathway-level default in the conversion.
  experts:
  - SGD curators
  - YeastPathways curators
- question: Should the NDI1 overexpression phenotypes (apoptosis-like death and ROS) support
    a regulation-of-apoptosis annotation, or would an annotation to ROS production or no
    process annotation better reflect an indirect effect of excess NADH oxidation?
  experts:
  - SGD curators
- question: Is the native-gel supramolecular assembly of Ndi1 with external dehydrogenases
    and TCA enzymes a stable physiological complex that channels NADH, or a co-migration artifact
    of colorless native PAGE?
  experts:
  - yeast mitochondrial bioenergetics researchers
- question: Which of the two ubiquinone sites seen in the Feng et al. structure is used in
    the membrane, and does the Feng FAD-UQ(I) intermediate model or the Iwata overlapping-site
    model describe catalysis?
  experts:
  - NDH-2 structural biologists
suggested_experiments:
- hypothesis: Ndi1 is active only at the matrix face of the inner membrane, not in the cytosol.
  description: Protease-protection and alkaline carbonate extraction of mitochondria and mitoplasts
    from cells expressing untagged Ndi1, alongside cytosolic fractions, with NADH:UQ oxidoreductase
    assays of each fraction.
  experiment_type: biochemical
- hypothesis: The pro-death effect of NDI1 overexpression requires its catalytic activity and
    the resulting ROS, not a separate apoptotic function.
  description: Overexpress catalytically dead (FAD-binding or NADH-site) and dimerization-defective
    Ndi1 mutants, measure ROS and cell death markers, and test rescue by antioxidants or by
    co-expression of alternative oxidase.
  experiment_type: genetic
