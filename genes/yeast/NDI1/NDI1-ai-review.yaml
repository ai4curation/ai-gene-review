id: P32340
gene_symbol: NDI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NDI1 encodes the internal, rotenone-insensitive type-II NADH:ubiquinone oxidoreductase (NDH-2,
  EC 1.6.5.9) of the S. cerevisiae mitochondrial inner membrane. Budding yeast lacks respiratory Complex
  I, and Ndi1p is the single-subunit, FAD-containing enzyme that re-oxidises NADH generated in the mitochondrial
  matrix (by the TCA cycle, pyruvate dehydrogenase and other matrix dehydrogenases) and transfers the
  electrons to ubiquinone-6, feeding the quinone pool upstream of Complex III without pumping protons.
  Ndi1p is a monotopic peripheral membrane protein facing the matrix; crystal structures show an intimate
  homodimer whose C-terminal amphipathic domains anchor it in the membrane and an active site in which
  NADH and quinone binding sites overlap. ndi1 null mutants lose respiration of matrix NADH-linked substrates
  and grow poorly on lactate, pyruvate and acetate. Overexpression of Ndi1p increases mitochondrial ROS
  and causes apoptosis-like death, and loss of NDI1 extends chronological lifespan; Ndi1 is also used
  as a heterologous replacement for defective mammalian Complex I.
