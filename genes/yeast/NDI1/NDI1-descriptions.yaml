    overall_notes: 'One sentence: oxidises NADH generated inside the mitochondrion.
      True but omits ubiquinone as acceptor, the non-pumping NDH-2 mechanism and the
      complex I replacement role.'
- source: Alliance_Imported
  text: NADH:ubiquinone oxidoreductase; transfers electrons from NADH to ubiquinone
    in respiratory chain but does not pump protons, in contrast to higher eukaryotic
    multisubunit respiratory complex I; upon apoptotic stress, is activated in mitochondria
    by N-terminal cleavage, then translocates to cytoplasm to induce apoptosis; homolog
    of human AIFM2; yeast NDI1 complements several phenotypes of human cell line with
    mutated MT-ND4, implicated in Leber hereditary optic neuropathy
  source_type: curated
  url: https://www.yeastgenome.org/locus/NDI1
