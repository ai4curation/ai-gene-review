gene_symbol: NDI1
organism: yeast
uniprot_id: P32340
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the oxidation of NADH generated inside the Mitochondrion.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32340
  source_id: P32340
- source: Alliance_Imported
  text: NADH:ubiquinone oxidoreductase; transfers electrons from NADH to ubiquinone
    in respiratory chain but does not pump protons, in contrast to higher eukaryotic
    multisubunit respiratory complex I; upon apoptotic stress, is activated in mitochondria
    by N-terminal cleavage, then translocates to cytoplasm to induce apoptosis; homolog
    of human AIFM2; yeast NDI1 complements several phenotypes of human cell line with
    mutated MT-ND4, implicated in Leber hereditary optic neuropathy
  source_type: curated
  url: https://www.yeastgenome.org/locus/NDI1
  source_id: SGD:S000004589
- source: Alliance_Automated
  text: Enables NADH dehydrogenase (ubiquinone) (non-electrogenic) activity and identical
    protein binding activity. Involved in mitochondrial electron transport, NADH to
    ubiquinone and positive regulation of apoptotic process. Located in mitochondrial
    matrix. Used to study Leber hereditary optic neuropathy.
  source_type: automated
  url: https://www.yeastgenome.org/locus/NDI1
  source_id: SGD:S000004589
