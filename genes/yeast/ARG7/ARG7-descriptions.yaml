descriptions:
- source: UniProt
  text: 'Catalyzes two activities which are involved in the cyclic version of arginine
    biosynthesis: the synthesis of acetylglutamate from glutamate and acetyl-CoA,
    and of ornithine by transacetylation between acetylornithine and glutamate.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04728
  source_id: Q04728
- source: Alliance_Imported
  text: Mitochondrial ornithine acetyltransferase; catalyzes the fifth step in arginine
    biosynthesis; also possesses acetylglutamate synthase activity, regenerates acetylglutamate
    while forming ornithine
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARG7
  source_id: SGD:S000004666
- source: Alliance_Automated
  text: Enables L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as
    donor. Involved in L-ornithine biosynthetic process. Located in mitochondrial
    matrix.
  source_type: automated
