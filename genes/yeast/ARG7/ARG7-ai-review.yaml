description: 'Ornithine acetyltransferase (glutamate N-acetyltransferase, ArgJ family, EC 2.3.1.35) of
  Saccharomyces cerevisiae, a mitochondrial matrix enzyme that transfers the acetyl group from N2-acetyl-L-ornithine
  to L-glutamate, releasing L-ornithine and regenerating N-acetyl-L-glutamate. This is the fifth step
  of arginine biosynthesis and closes the cyclic (acetyl-recycling) route of ornithine synthesis. The
  precursor carries a short cleaved mitochondrial presequence and undergoes autoproteolytic internal cleavage
  before mitochondrial targeting into alpha and beta chains that form the active heterodimer. The enzyme
  is strongly inhibited by ornithine but largely insensitive to arginine. Arg7 also has a modest acetyl-CoA-dependent
  N-acetylglutamate synthase activity (EC 2.3.1.1): when overexpressed it can complement arg2 (NAGS) mutants.
  Deletion of ARG7 gives only a leaky arginine requirement, implying an alternative route from acetylornithine
  to ornithine.'
