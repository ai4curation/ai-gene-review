  review:
    summary: The pathway-derived cytosol annotation requires qualification because the mature ornithine-synthesis
      enzyme is mitochondrial, while its precursor undergoes processing before import.
    action: UNDECIDED
    reason: PMID:205532 reports mitochondrial particulate acetyltransferase activity, but PMID:10753950
      independently demonstrates Arg7 autoproteolytic maturation before mitochondrial targeting. This
      is target-specific biochemical processing, not merely the generic fact that a mitochondrial precursor
      is synthesized in the cytosol. Leader-deletion and heterologous-expression experiments do not establish
      a steady-state native cytosolic acetyltransferase pool. Retain UNDECIDED while distinguishing transient
      precursor autocatalysis from the mitochondrial mature enzyme and the pathway-derived compartment
      assignment. The location judgment does not depend on the imported relationship qualifier; no NEW
      cytosolic annotation is proposed.
    supported_by:
    - reference_id: PMID:10753950
      supporting_text: processing occurs before targeting to the mitochondria
