- term:
    id: GO:0103045
    label: L-methionine N-acyltransferase activity
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: enables
  supporting_entities:
  - SGD_PWY:ARGSYNBSUB-PWY
  review:
    summary: YeastPathways-derived (GO_REF:0000123) assertion of L-methionine N-acyltransferase activity
      (L-methionine + acetyl-CoA = N-acetyl-L-methionine + CoA). No experimental evidence shows that this
      mitochondrial arginine-pathway enzyme acetylates methionine; the characterised substrate is L-glutamate.
      The mapping most likely arises from the generic EC 2.3.1.1 name 'amino-acid N-acetyltransferase'
      being projected onto a specific non-glutamate reaction.
    action: REMOVE
    reason: Computational pathway-to-GO mapping with no supporting assay; the only characterised acceptor
      substrate for this enzyme in S. cerevisiae is L-glutamate.
