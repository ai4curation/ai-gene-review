- term:
    id: GO:0000727
    label: double-strand break repair via break-induced replication
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000179968
  - SGD:S000006223
  review:
    summary: Break-induced replication (BIR) uses the replicative CMG helicase to copy the donor template
      after strand invasion; Lydeard et al. showed in S. cerevisiae that BIR requires Mcm2-7, Cdc45 and
      GINS (but not the ORC/Cdc6 loading step). Mcm4, as a motor subunit of the helicase, does part of
      the work (DNA unwinding) of this repair-coupled replication, so participation is satisfied, but
      it is a specialised use of the replicative helicase rather than a core, dedicated role.
    action: KEEP_AS_NON_CORE
    reason: 'The PAINT IBD at the Mcm4 subfamily node PTN000179968 is seeded by this gene''s own IMP annotation
      (SGD:S000006223), which is the expected pattern, not circularity. Kept, but as non-core: BIR is
      a repair context for the same helicase activity.'
    supported_by:
    - reference_id: PMID:20516198
      supporting_text: Here we show that BIR requires the replicative DNA helicase (Cdc45, the GINS, and
        Mcm2-7 proteins) as well as Cdt1
