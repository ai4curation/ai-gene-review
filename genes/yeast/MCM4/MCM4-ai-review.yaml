  review:
    summary: Generic DNA binding from InterPro MCM domain signatures.
    action: MODIFY
    reason: Correct but too general. Mcm4-containing complexes have characterised ATP-dependent ssDNA
      binding (Bochman & Schwacha 2007), and loaded Mcm2-7 double hexamers encircle and slide on dsDNA
      (Remus et al. 2009). Replace with the two specific terms; ssDNA binding is already carried by this
      gene (IBA, IMP).
    proposed_replacement_terms:
    - &id005
      id: GO:0003697
      label: single-stranded DNA binding
    - &id006
      id: GO:0003690
      label: double-stranded DNA binding
    supported_by:
    - reference_id: PMID:17895243
      supporting_text: We demonstrate that both complexes are toroidal and possess a similar ATP-dependent
        single-stranded DNA (ssDNA) binding activity
    - reference_id: PMID:19896182
      supporting_text: DNA runs through a central channel in the double hexamer, and, once loaded, Mcm2-7
        can slide passively along double-stranded DNA
- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IDA
  original_reference_id: PMID:15723534
  qualifier: contributes_to
  review:
    summary: DNA helicase activity for Mcm4. In S. cerevisiae Mcm4 is a motor subunit of the Mcm2-7 ring;
      helicase activity has been measured for the Mcm467 subcomplex (Kaplan et al. 2003; Biswas-Fiss et
      al. 2005), for reconstituted Mcm2-7 under gate-closing conditions (Bochman & Schwacha 2008, where
      Mcm4 K574A abolishes activity), and physiologically for the CMG holoenzyme. The activity is a property
      of the assembled ring (ATPase sites form in trans between neighbouring subunits), so Mcm4 contributes
      to it rather than enabling it alone.
    action: MODIFY
    reason: Correct but less specific than the evidence supports. Mcm4,6,7 and CMG translocate on the
      leading strand with 3'->5' polarity (opposite to DnaB), so the supported, more specific term is
      GO:0043138 3'-5' DNA helicase activity (already annotated to this gene by IDA, contributes_to),
      together with GO:0017116 single-stranded DNA helicase activity (IBA/IDA, contributes_to). Any retained
      annotation should carry contributes_to.
    proposed_replacement_terms:
    - &id001
      id: GO:0043138
      label: 3'-5' DNA helicase activity
    - &id002
      id: GO:0017116
      label: single-stranded DNA helicase activity
    supported_by:
    - reference_id: PMID:15723534
      supporting_text: The DNA helicase activity of Mcm467 complex is also significantly stimulated by
        the ARS1-derived sequences
    - reference_id: PMID:13679365
      supporting_text: The Mcm4,6,7 mechanism is very similar to DnaB, except the proteins translocate
        with opposite polarity along DNA
