id: P30665
gene_symbol: MCM4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MCM4 (CDC54) encodes one of the six related AAA+ ATPase subunits of the heterohexameric Mcm2-7
  complex, the motor of the eukaryotic replicative DNA helicase. In G1, ORC, Cdc6 and Cdt1 load Mcm2-7
  onto origin DNA as an inactive head-to-head double hexamer that encircles and can slide on dsDNA (origin
  licensing, pre-RC formation). At origin firing in S phase, Dbf4-dependent kinase phosphorylates Mcm4
  (its principal MCM target) to recruit Cdc45, and with GINS the Cdc45-Mcm2-7-GINS (CMG) helicase forms,
  encircles the leading-strand template and translocates 3'->5' to unwind DNA ahead of the replisome.
  Mcm2-7 function is needed continuously for fork progression, and the CMG is also required for break-induced
  replication. Mcm4 contributes Walker A/B motifs and an arginine finger to inter-subunit ATPase sites,
  an N-terminal zinc-binding and OB-fold domain with DNA-binding residues, and with Mcm6 and Mcm7 forms
  an Mcm467 subcomplex with in vitro 3'->5' helicase activity. CDK activity drives net nuclear export
  of Mcm2-7 after S phase, helping restrict replication to once per cell cycle.
