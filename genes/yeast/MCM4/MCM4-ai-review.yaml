  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000179711
  - SGD:S000006223
  review:
    summary: Single-stranded DNA binding. Both MCM2-7 and MCM467 from S. cerevisiae show ATP-dependent
      ssDNA binding; the Mcm4 OB-fold carries conserved DNA-binding arginines essential for function,
      and in CMG the leading-strand ssDNA passes through the Mcm ring.
    action: ACCEPT
    reason: PAINT IBD at the MCM2-7 family node PTN000179711, seeded by this gene (SGD:S000006223). ssDNA
      binding is the substrate-engaging activity of the translocating helicase and is experimentally supported
      in yeast.
    supported_by:
    - reference_id: PMID:17895243
      supporting_text: We demonstrate that both complexes are toroidal and possess a similar ATP-dependent
        single-stranded DNA (ssDNA) binding activity
    - reference_id: PMID:26854665
      supporting_text: two conserved DNA binding arginine residues in the yeast Mcm4 and Mcm7 OB domains
        are essential for function
