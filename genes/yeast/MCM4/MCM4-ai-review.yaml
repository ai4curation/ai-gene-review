- description: 'Motor subunit of the CMG (Cdc45-Mcm2-7-GINS) replicative helicase: contributes inter-subunit
    ATPase sites and ssDNA-engaging OB-fold residues to the ring that encircles the leading-strand template
    and unwinds DNA by 3''->5'' translocation, required continuously for replication fork progression.'
