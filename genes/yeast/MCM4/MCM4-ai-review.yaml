- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: IDA
  original_reference_id: PMID:11756674
  qualifier: enables
  review:
    summary: DNA replication origin binding. Mcm2-7 is recruited to origins by ORC-Cdc6-Cdt1 and is loaded
      around origin dsDNA as a head-to-head double hexamer; origin association of Mcm2-7 depends on ORC
      binding elements and the B2 element of ARS1. Wilmes & Bell measured Mcm2-7 origin association by
      ChIP at ARS1 B2 mutants.
    action: KEEP_AS_NON_CORE
    reason: Mcm2-7 associates with origin DNA, but sequence recognition is done by ORC and the loaded
      double hexamer topologically encircles and slides on dsDNA without sequence specificity. The term
      is defensible as a description of where the loaded complex sits, but it is not the intrinsic activity
      of Mcm4; kept as non-core. The intrinsic activities are captured by ssDNA binding and helicase terms.
    supported_by:
    - reference_id: PMID:11756674
      supporting_text: Nonfunctional B2 sequences show a corresponding loss in Mcm2-7p origin association
    - reference_id: PMID:19896182
      supporting_text: DNA runs through a central channel in the double hexamer, and, once loaded, Mcm2-7
        can slide passively along double-stranded DNA
