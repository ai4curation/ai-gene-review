suggested_questions:
- question: Is the GO:0006279 premeiotic DNA replication IDA annotation (PMID:20484375) keyed to the intended
    paper? The cited study analyses Mcm2-7 ATPase active-site mutants biochemically and has no meiotic
    experiments; is there direct S. cerevisiae evidence for MCM4 in premeiotic S phase?
- question: Should the Mcm4-specific regulatory role as the principal DDK substrate (its N-terminal serine/threonine-rich
    region gating Cdc45 recruitment) be captured as a GO-CAM has_input relation on Cdc7-Dbf4 kinase activity
    rather than as any Mcm4 annotation?
- question: Which annotations are safe to transfer to orthologs in PTHR11630:SF66? PAINT propagated BIR,
    strand elongation and mitotic initiation at node PTN000179968 but not pre-RC assembly or origin binding;
    is that omission deliberate?
suggested_experiments:
- hypothesis: The Mcm4 N-terminal zinc-binding cysteine cluster (C349/C352/C371/C376) is required for
    double-hexamer formation or CMG stability rather than for ATPase activity.
  description: Introduce cysteine-to-alanine substitutions at the chromosomal MCM4 locus (plasmid shuffle),
    test viability, and assay purified mutant Mcm2-7 in reconstituted loading and CMG helicase reactions.
