descriptions:
- source: UniProt
  text: Acts as a component of the MCM2-7 complex (MCM complex) which is the putative
    replicative helicase essential for 'once per cell cycle' DNA replication initiation
    and elongation in eukaryotic cells. The active ATPase sites in the MCM2-7 ring
    are formed through the interaction surfaces of two neighboring subunits such that
    a critical structure of a conserved arginine finger motif is provided in trans
    relative to the ATP-binding site of the Walker A box of the adjacent subunit.
    The six ATPase active sites, however, are likely to contribute differentially
    to the complex helicase activity. Once loaded onto DNA, double hexamers can slide
    on dsDNA in the absence of ATPase activity. Required for S phase execution.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P30665
  source_id: P30665
- source: Alliance_Imported
  text: Essential helicase component of heterohexameric MCM2-7 complexes; MCM2-7 complexes
    bind pre-replication complexes on DNA and melt DNA prior to replication; forms
    an Mcm4p-6p-7p subcomplex; shows nuclear accumulation in G1; homolog of S. pombe
    Cdc21p
  source_type: curated
  url: https://www.yeastgenome.org/locus/MCM4
  source_id: SGD:S000006223
- source: Alliance_Automated
  text: Enables DNA replication origin binding activity; helicase activity; and single-stranded
    DNA binding activity. Contributes to 3'-5' DNA helicase activity; four-way junction
    helicase activity; and single-stranded DNA helicase activity. Involved in DNA
    metabolic process. Located in cytoplasm and nuclear replication fork. Part of
    MCM complex; MCM core complex; and nucleoplasm. Used to study endometrial cancer.
    Human ortholog(s) of this gene implicated in immunodeficiency 54. Orthologous
    to human MCM4 (minichromosome maintenance complex component 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MCM4
  source_id: SGD:S000006223
