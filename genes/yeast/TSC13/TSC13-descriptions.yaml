descriptions:
- source: UniProt
  text: Catalyzes the last of the four reactions of the long-chain fatty acids elongation
    cycle. This endoplasmic reticulum-bound enzymatic process, allows the addition
    of 2 carbons to the chain of long- and very long-chain fatty acids/VLCFAs per
    cycle. This enzyme reduces the trans-2,3-enoyl-CoA fatty acid intermediate to
    an acyl-CoA that can be further elongated by entering a new cycle of elongation.
    Thereby, it participates in the production of VLCFAs of different chain lengths
    that are involved in multiple biological processes as precursors of membrane lipids
    and lipid mediators. VLCFAs serve for instance as precursors for ceramide and
    sphingolipids. Required for normal biogenesis of piecemeal microautophagy of the
    nucleus (PMN) bleps and vesicles during nutrient stress.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q99190
  source_id: Q99190
- source: Alliance_Imported
  text: Enoyl reductase; catalyzes last step in each cycle of very long chain fatty
    acid elongation; localizes to ER, highly enriched in a structure marking nuclear-vacuolar
    junctions; coimmunoprecipitates with elongases Elo2p and Elo3p; protein increases
    in abundance and relative distribution to ER foci increases upon DNA replication
    stress; human homolog TECR implicated in nonsyndromic mental retardation, can
    complement yeast mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/TSC13
  source_id: SGD:S000002173
- source: Alliance_Automated
  text: Enables very-long-chain enoyl-CoA reductase activity. Involved in very long-chain
    fatty acid metabolic process. Located in endoplasmic reticulum membrane. Used
    to study non-syndromic intellectual disability. Human ortholog(s) of this gene
    implicated in autosomal recessive intellectual developmental disorder 14 and catecholaminergic
    polymorphic ventricular tachycardia 3. Orthologous to human TECR (trans-2,3-enoyl-CoA
    reductase) and TECRL (trans-2,3-enoyl-CoA reductase like).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TSC13
  source_id: SGD:S000002173
