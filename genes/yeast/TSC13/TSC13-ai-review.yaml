gene_symbol: TSC13
aliases:
- YDL015C
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TSC13 (YDL015C) encodes the very-long-chain enoyl-CoA reductase (trans-2-enoyl-CoA reductase, TECR
  orthologue) of the endoplasmic reticulum fatty acid elongation system, a polytopic ER membrane protein of the
  steroid 5-alpha-reductase family. It catalyses the NADPH-dependent reduction of trans-2,3-enoyl-CoA, the fourth
  and final step of each elongation cycle, regenerating a saturated acyl-CoA two carbons longer that can re-enter
  the cycle; together with the condensing enzymes Elo2/Elo3, the 3-ketoreductase Ifa38 and the dehydratase Phs1
  it produces the C20-C26 very long-chain fatty acids that form the acyl chains of yeast ceramide and sphingolipids.
  TSC13 is essential and has no paralogue; tsc13 hypomorphs accumulate trans-2-enoyl- and 3-hydroxy-acyl-CoA intermediates,
  long-chain bases and ceramides with shortened fatty acids. Tsc13 co-immunoprecipitates with Elo2 and Elo3 and,
  besides the general ER, is enriched at nucleus-vacuole junctions through binding Nvj1, where VLCFA supply supports
  normal piecemeal microautophagy of the nucleus.
