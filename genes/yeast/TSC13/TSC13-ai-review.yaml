suggested_questions:
- question: Why is Tsc13, unlike the other elongation enzymes, concentrated at nucleus-vacuole junctions, and does
    local VLCFA production there contribute directly to piecemeal microautophagy membrane formation?
- question: Does Tsc13 also act as the trans-2-enoyl-CoA reductase in sphingosine-1-phosphate/long-chain base degradation
    in yeast, as TECR does in mammals?
suggested_experiments:
- hypothesis: Nvj1-mediated sequestration of Tsc13 at nucleus-vacuole junctions is required for normal PMN vesicle
    size independently of bulk VLCFA levels.
  description: Compare PMN bleb/vesicle diameter and VLCFA profiles in nvj1 cells expressing Tsc13 versus a Tsc13
    variant fused to an Nvj1-binding domain that restores junction targeting.
