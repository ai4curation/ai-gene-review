      notes: Mentions specific interactions (Caf130p) and WGD paralog.
    overall_notes: Good concise description. Adds paralog info (EGD1) and CCR4-NOT/Caf130p
      interaction not in UniProt.
- source: Alliance_Automated
  text: Involved in cotranslational protein targeting to membrane. Part of CCR4-NOT
    core complex and nascent polypeptide-associated complex. Orthologous to human
    BTF3 (basic transcription factor 3) and BTF3L4 (basic transcription factor 3 like
    4).
  source_type: automated
