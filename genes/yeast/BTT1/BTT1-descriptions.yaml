gene_symbol: BTT1
organism: yeast
uniprot_id: P40314
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Acts as a component of the nascent polypeptide-associated complex (NAC), which
    promotes mitochondrial protein import by enhancing productive ribosome interactions
    with the outer mitochondrial membrane. Also blocks the inappropriate interaction
    of ribosomes translating non- secretory nascent polypeptides with translocation
    sites in the membrane of the endoplasmic reticulum. BTT1 may act as a transcription
    factor that exert a negative effect on the expression of several genes that are
    transcribed by RNA polymerase II.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40314
  source_id: P40314
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
      notes: Accurate but the transcription factor role is largely based on the mammalian
        BTF3 homolog and may overstate yeast evidence.
    - rubric: utility
      score: 5
      notes: Very informative for understanding BTT1 biology.
    - rubric: compactness
      score: 3
      notes: Moderately long.
    - rubric: completeness
      score: 5
      notes: Covers NAC function, mitochondrial import, ER quality control, and transcriptional
        role.
    - rubric: specificity
      score: 4
      notes: Mentions specific mechanisms (ribosome interaction, nascent polypeptides).
    overall_notes: Comprehensive description covering NAC complex role, mitochondrial
      protein import promotion, ER mistargeting prevention, and transcription factor
      activity.
- source: Alliance_Imported
  text: Heterotrimeric nascent polypeptide-associated complex beta3 subunit; complex
    binds ribosomes via its beta-subunits in close proximity to nascent polypeptides;
    interacts with Caf130p of the CCR4-NOT complex; similar to human BTF3; BTT1 has
    a paralog, EGD1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/BTT1
  source_id: SGD:S000002660
  review:
