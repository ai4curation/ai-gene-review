core_functions:
- description: Btt1 is the beta-2 subunit of an alternative yeast nascent-polypeptide-
    associated complex. As part of NAC, it associates with cytosolic translating ribosomes
    near nascent polypeptides and contributes to cotranslational protein folding and
    control of ribosome-nascent-chain targeting to membranes. Its Caf130/CCR4-NOT
    interaction appears specialized for Rpl4/Acl4 quality control rather than
    constitutive CCR4-NOT core-complex membership.
