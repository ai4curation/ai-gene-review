- question: Should Btt1 receive a distinct curated annotation for Caf130/CCR4-NOT-linked
    cotranslational mRNA regulation of ribosomal protein production, separate from
    its core NAC complex annotations?
  experts:
  - Craig EA
  - Deuerling E
  - Collart MA
suggested_experiments:
- hypothesis: Btt1's low-abundance NAC beta-2 functions separate its general ribosome-associated
    NAC activity from its specialized Caf130/CCR4-NOT regulatory role.
