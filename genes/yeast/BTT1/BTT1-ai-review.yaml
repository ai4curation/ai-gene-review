id: P40314
gene_symbol: BTT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: BTT1 encodes the low-abundance beta-2 paralog of the yeast nascent-polypeptide-associated
  complex (NAC). Btt1 pairs with the alpha NAC subunit Egd2 to form an alternative
  NAC heterodimer that associates with cytosolic translating ribosomes near the nascent-chain
  exit tunnel. The best supported core functions are participation in the NAC complex,
  ribosome-linked cotranslational nascent-chain handling/folding, and regulation of
  cotranslational protein targeting to membranes. Btt1 also recruits CCR4-NOT through
  Caf130 in an Rpl4/Acl4 quality-control context, a specialized regulatory role rather
  than the general NAC core function.
