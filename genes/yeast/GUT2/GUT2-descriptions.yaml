  text: Mitochondrial glycerol-3-phosphate dehydrogenase; expression is repressed
    by both glucose and cAMP and derepressed by non-fermentable carbon sources in
    a Snf1p, Rsf1p, Hap2/3/4/5 complex dependent manner
  source_type: curated
