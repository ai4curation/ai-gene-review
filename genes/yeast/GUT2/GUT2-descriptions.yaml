- source: Alliance_Automated
  text: Enables glycerol-3-phosphate dehydrogenase (quinone) activity. Involved in
    glycerol metabolic process. Located in mitochondrial intermembrane space and mitochondrial
    outer membrane. Human ortholog(s) of this gene implicated in type 2 diabetes mellitus.
    Orthologous to human GPD2 (glycerol-3-phosphate dehydrogenase 2).
