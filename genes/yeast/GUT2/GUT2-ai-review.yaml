id: P32191
gene_symbol: GUT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Gut2p is the FAD-dependent mitochondrial glycerol-3-phosphate dehydrogenase (EC 1.1.5.3)
  of S. cerevisiae. Bound to the outer surface of the inner mitochondrial membrane with its active site
  in the intermembrane space, it oxidises sn-glycerol 3-phosphate to DHAP and passes the electrons via
  FAD to ubiquinone and the respiratory chain. It has two roles: it is the second step of glycerol utilisation
  after glycerol kinase Gut1p (gut2 mutants cannot grow on glycerol), and together with cytosolic Gpd1p/Gpd2p
  it forms the glycerol-3-phosphate shuttle that oxidises cytosolic NADH in respiring cells, alongside
  the external NADH dehydrogenases Nde1p/Nde2p. Gut2p associates with these dehydrogenases in a supramolecular
  complex, and active Nde1/2p kinetically inhibits Gut2p.'
