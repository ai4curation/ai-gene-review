suggested_questions:
- question: How is Gut2p partitioned between glycerol catabolism and the NADH shuttle during growth on
    glycerol versus respiratory glucose growth, and how strongly does Nde1/2 activity inhibit it in vivo?
suggested_experiments:
- description: Measure G3P-driven oxygen consumption in mitochondria from nde1 nde2 and wild-type cells
    grown on glycerol versus glucose, and resolve Gut2p topology by protease protection after outer-membrane
    rupture.
