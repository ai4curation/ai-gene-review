id: Q99369
gene_symbol: FSH3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  FSH3 (YOR280C, "Family of Serine Hydrolases 3") is a 266-residue serine
  hydrolase of the alpha/beta-hydrolase fold (AB-hydrolase-3 / Pfam FSH1 family)
  in the budding yeast Saccharomyces cerevisiae. It carries a complete, canonical
  Ser-Asp-His catalytic triad, with the nucleophilic serine (Ser117) in a classic
  GXSXG "nucleophile elbow" motif, and was directly detected as a catalytically
  active serine hydrolase in yeast by activity-based protein profiling. Its
  physiological substrate and specific reaction are undetermined; UniProt assigns
  only the uncommitted esterase activity EC 3.1.-.- and describes it as a "serine
  hydrolase of unknown specificity". FSH3 is one of three paralogous S. cerevisiae
  FSH proteins (with FSH1 and FSH2) and is the yeast counterpart of the human
  candidate tumor-suppressor esterase OVCA2. It localizes to the peroxisome and to
  cytoplasmic pools; its expression is induced by the DNA-damage-checkpoint
  effector Crt1/RFX1 and by oxidative (H2O2) stress. Overexpression of FSH3
  perturbs cellular lipid content (notably reducing phosphatidylcholine) and
  triggers a NUC1-dependent apoptotic phenotype. Single deletion causes no growth
  defect under standard conditions, but a double mutant lacking both FSH3 and the
  peroxisomal lipase Lpx1 has reduced peroxisomal fatty-acid beta-oxidation
  activity, implicating FSH3 (redundantly with Lpx1) in peroxisomal lipid/fatty-acid
  metabolism; its precise molecular contribution and physiological substrate remain
  unresolved.
references:
- id: GO_REF:0000015
  title: Use of the ND evidence code for Gene Ontology (GO) terms
  findings:
  - statement: >-
      SGD applied the ND (No biological Data available) evidence code to FSH3,
      formally recording that no experimental data supported a GO assignment in the
      affected aspect at the time of curation. The later peroxisomal IDA and the
      activity-based serine-hydrolase proteomics supersede this for the CC and MF
      aspects; the biological process remains the genuinely open one.
    reference_section_type: DATABASE_ENTRY
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT/IBA annotations propagated to FSH3 from the OVCA2/FSH family node include
      a nuclear localization that conflicts with the yeast-specific experimental
      evidence: FSH3 carries a functional PTS1 and is a confirmed peroxisomal matrix
      protein. The family-node location is therefore treated here as over-propagated
      for this gene rather than as evidence for a second compartment.
    reference_section_type: DATABASE_ENTRY
- id: PMID:14645503
  title: Synergistic computational and experimental proteomics approaches for more
    accurate detection of active serine hydrolases in yeast.
  findings:
  - statement: >-
      FSH3 was identified as a member of a newly defined eukaryotic serine hydrolase
      family (Fsh), whose other members include the human candidate tumour suppressor
      OVCA2 and a Schizosaccharomyces pombe dihydrofolate reductase. This is the
      origin of the family name and of the UniProt FUNCTION "serine hydrolase of
      unknown specificity".
    supporting_text: >-
      Three of the previously uncharacterized proteins are members of a eukaryotic
      serine hydrolase family, designated as Fsh (family of serine hydrolase),
      identified here for the first time.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The identification combined computational active-site structure analysis with
      chemical labelling of the reactive active-site serine in complex mixtures, so it
      reports an expressed protein with a chemically reactive catalytic serine rather
      than a sequence motif alone. The paper frames this explicitly as a caution about
      annotation transfer, which is why no specific substrate follows from it.
    supporting_text: >-
      The chemical proteomics technology indicates that a functional protein is being
      expressed in the cell, while the computational proteomics technology adds
      details about the specific type of function and residue that is likely being
      labeled.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defines the eukaryotic Fsh (family of serine hydrolase) group and detects FSH3
      as a catalytically active serine hydrolase by combined chemical/computational
      activity-based proteomics. This is the paper UniProt cites for FUNCTION
      ("Serine hydrolase of unknown specificity"). Abstract-only in cache; the FSH3
      identification is in the full text/supplementary of this yeast serine-hydrolase
      survey. Anchored to the yeast serine-hydrolase-family framing and the UniProt
      FUNCTION evidence tag ECO:0000269|PubMed:14645503.
- id: PMID:15494396
  title: Identification of new genes regulated by the Crt1 transcription factor, an
    effector of the DNA damage checkpoint pathway in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      FSH3 transcription is under the control of the DNA-damage-checkpoint effector
      Crt1p (RFX1), confirmed by RT-PCR in wild-type versus crt1-delta strains. This
      is a regulatory relationship - the source of the UniProt INDUCTION note - and
      not evidence of a molecular function or a DNA-damage-response role for the FSH3
      protein itself.
    supporting_text: >-
      Our results indicated that FSH3, YLR345W, and NTH2 are indeed under the
      regulation of Crt1p.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The paper's proposed link between FSH3 and folate metabolism / dihydrofolate
      reductase is explicitly sequence-similarity speculation, with no supporting
      assay, and must not be used to annotate folate metabolism for FSH3.
    supporting_text: >-
      Sequence analysis of the FSH3p indicated that this protein may be involved in
      folate metabolism either by carrying serine hydrolase activity required for the
      novel metabolic pathway involving dihydrofolate reductase (DHFR) or by directly
      interacting with the DHFR enzyme.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Experimentally confirms FSH3 is a transcriptional target of Crt1p (RFX1) by
      RT-PCR in wild-type vs crt1-delta strains (source of UniProt INDUCTION).
      NOTE: this paper's suggestion that FSH3 acts in folate metabolism / with DHFR
      is explicit speculation from OVCA2/DYR-SCHPO sequence similarity, not
      experimental data; it must not be used to annotate folate metabolism.
- id: PMID:36164978
  title: Systematic multi-level analysis of an organelle proteome reveals new peroxisomal
    functions.
  findings:
  - statement: >-
      Fsh3 is an experimentally confirmed peroxisomal matrix protein: it carries an
      unusual but functional PTS1 (G at position -3), and its last 10 residues are
      sufficient to target GFP to peroxisomes in a Pex5-dependent manner. This is the
      direct evidence behind the IDA C:peroxisome annotation.
    supporting_text: >-
      We confirmed that Fsh3, which contains a unique PTS1 sequence (G in position
      −3), is indeed a matrix protein (Fig 2E), and that its C′ motif functions as a
      PTS1 – its last 10 amino acids mediate GFP targeting to peroxisomes in a
      Pex5‐dependent manner (Appendix Fig S7B).
    reference_section_type: RESULTS
  - statement: >-
      A loss-of-function genetic interaction places FSH3 in peroxisomal fatty-acid
      beta-oxidation: the fsh3/lpx1 double deletion, but neither single deletion, has
      significantly reduced beta-oxidation activity, indicating a role overlapping and
      redundant with the peroxisomal lipase Lpx1.
    supporting_text: >-
      A β‐oxidation activity assay of Δlpx1, Δfsh3, and Δlpx1Δfsh3 strains
      supplemented with labeled 8 carbon‐ or 18 carbon‐free fatty acids in media
      supplemented with 0.5% glucose shows a significant reduction in β‐oxidation
      activity compared to the control strain and the two single mutants, suggesting
      an overlapping role for Fsh3 with Lpx1.
    reference_section_type: RESULTS
  - statement: >-
      Among a panel of dark peroxisomal proteins, FSH3 overexpression produced the
      largest lipidome change, a reduction of phosphatidylcholine. This is an
      overexpression phenotype, consistent with but not proof of a direct
      glycerophospholipid-hydrolase activity.
    supporting_text: >-
      cells overexpressing FSH3 had the most significant change in all conditions
      compared to the control strain, with a reduction of PC
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Systematic peroxisome-proteome study; basis of the SGD IDA C:peroxisome
      annotation for FSH3 and reports that FSH3 overexpression gives the strongest
      lipidome change (reduction of phosphatidylcholine) among dark peroxisomal
      proteins. It also reports a deletion-based phenotype: a Fsh3/Lpx1 double
      deletion (but neither single mutant) has reduced peroxisomal beta-oxidation
      activity, suggesting FSH3 has an overlapping role with the peroxisomal lipase
      Lpx1 in fatty-acid beta-oxidation. The PC lipid effect is an overexpression
      phenotype, not proof of a direct PC-hydrolase activity.
- id: PMID:30776074
  title: FSH3 mediated cell death is dependent on NUC1 in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      FSH3 mRNA and protein are induced by hydrogen peroxide, yet fsh3 deletion
      improves growth under H2O2 - FSH3 is dispensable under oxidative stress and its
      loss is advantageous, not deleterious.
    supporting_text: >-
      In this study, hydrogen peroxide (H2O2) exposure increased the expression of
      both mRNA and protein levels of FSH3 in wild-type (WT) yeast cells. The deletion
      of FSH3 improved the yeast growth rate under H2O2-induction as compared to WT
      control cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      FSH3 overexpression produces an apoptotic phenotype (ROS accumulation, reduced
      viability, cell death) that requires NUC1. Because this is a gain-of-function
      phenotype and the single deletion is viable, it constrains a downstream genetic
      dependency rather than establishing a native pro-apoptotic role for FSH3.
    supporting_text: >-
      Moreover, the overexpression of FSH3 in cells lacking NUC1 did not cause any
      growth defect in the presence or absence of H2O2. Our results suggest that FSH3
      induced apoptosis of yeast in a NUC1 dependent manner.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      All three pairwise fsh double deletions (fsh1/fsh2, fsh1/fsh3, fsh2/fsh3) grow
      better than wild type, indicating that the three FSH paralogs are at least
      partly functionally overlapping and that none is individually required.
    supporting_text: >-
      The double deletions fsh1Δ fsh2Δ, fsh1Δ fsh3Δ and fsh2Δ fsh3Δ displayed
      increased growth compared to WT cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      FSH3-specific study: H2O2 induces FSH3; overexpression causes ROS
      accumulation and NUC1-dependent apoptosis; single deletion is viable (grows
      better under H2O2); fsh double deletions grow faster, indicating partial
      redundancy among FSH paralogs. Establishes phenotype without assigning a
      molecular substrate.
- id: PMID:24187129
  title: Screening for hydrolytic enzymes reveals Ayr1p as a novel triacylglycerol
    lipase in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Systematic screening of yeast GXSXG serine-hydrolase candidates confirmed the
      peroxisomal Lpx1p as a lipase acting in vivo and linked peroxisomal lipolysis to
      fatty-acid utilization. FSH3 itself is not assayed here; the reference is
      contextual, establishing that peroxisomal serine hydrolases of this class do
      perform lipid mobilization in yeast.
    supporting_text: >-
      These investigations led to the identification of Ayr1p as a novel
      triacylglycerol lipase of yeast lipid droplets and confirmed the hydrolytic
      potential of the peroxisomal Lpx1p in vivo.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Background/contextual: characterizes GXSXG serine-hydrolase enzymes acting in
      yeast peroxisomal and lipid-droplet lipid metabolism (Ayr1p, Lpx1p). Does not
      assay FSH3 or assign it a substrate; supports the plausibility of a peroxisomal
      serine-hydrolase acting in lipid metabolism.
existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetically inferred (IBA) nuclear localization propagated across the
      OVCA2/FSH family. It is not supported by the yeast-specific experimental
      evidence, which places FSH3 in the peroxisome (IDA), nor by any FSH3 assay.
      This is a weak, over-propagated location for this gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      IBA-only nuclear localization with no experimental support in yeast; the
      experimentally verified compartment is the peroxisome (GO:0005777, IDA).
      Family-wide phylogenetic propagation of a nuclear location is not
      substantiated for FSH3.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q8WZ82
        source_label: OVCA2 (human)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          PANTHER OVCA2 subfamily (PTHR48070:SF6) seed; a nuclear location for the
          family is not substantiated for yeast FSH3, whose experimental compartment
          is the peroxisome.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetically inferred (IBA) cytoplasmic localization. FSH3 has
      cytoplasmic/stress-granule associations (CD-CODE stress granule cross-ref)
      and a soluble alpha/beta-hydrolase is consistent with a cytoplasmic pool, so
      this general location is plausible, but it is non-core relative to the
      experimentally established peroxisomal localization.
    action: KEEP_AS_NON_CORE
    reason: >-
      General, phylogenetically inferred location that is plausible for a soluble
      hydrolase but is not the informative, experimentally supported compartment;
      retained as non-core alongside the IDA peroxisome annotation.
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Correct but uninformatively general. FSH3 has a complete, canonical
      Ser-Asp-His catalytic triad (Ser117 in a GXSXG motif, Asp180, His209) on an
      alpha/beta-hydrolase scaffold, and was detected as a catalytically active
      serine hydrolase by activity-based proteomics. These support the more
      specific mechanism-defined term serine hydrolase activity (GO:0017171).
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0017171
      label: serine hydrolase activity
    reason: >-
      The generic hydrolase activity term should be replaced by the mechanism-specific
      GO:0017171 (serine hydrolase activity), which is directly supported by the intact
      Ser-Asp-His triad, the diagnostic GXSXG nucleophile-elbow motif, and the
      activity-based proteomic detection of FSH3 as an active serine hydrolase. The
      specific substrate/reaction remains unknown (EC 3.1.-.-), so a more specific
      catalytic term is not yet justified.
    supported_by:
    - reference_id: PMID:14645503
      supporting_text: >-
        Three of the previously uncharacterized proteins are members of a eukaryotic
        serine hydrolase family
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q8WZ82
        source_label: OVCA2 (human)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The IBA hydrolase-activity transfer from the OVCA2 esterase subfamily is
          correct in branch but too general; the intact Ser-Asp-His triad and GXSXG
          motif in FSH3 support the more specific serine hydrolase activity.
- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IDA
  original_reference_id: PMID:36164978
  qualifier: located_in
  review:
    summary: >-
      Experimentally determined (IDA) peroxisomal localization from a systematic
      peroxisome-proteome analysis in which FSH3 is one of the newly identified
      peroxisomal proteins. This is the informative, experimentally supported
      compartment for FSH3 and is retained as a core localization.
    action: ACCEPT
    reason: >-
      Direct experimental evidence (IDA) from a systematic peroxisome-proteome study;
      the curator had access to the full dataset. This is the strongest localization
      annotation for FSH3.
    supported_by:
    - reference_id: PMID:36164978
      supporting_text: >-
        Lipidomic analysis on mutants of 10 newly identified peroxisomal proteins
        whose molecular function in the yeast cell is putative or unknown shows that
        cells overexpressing FSH3 had the most significant change in all conditions
        compared to the control strain, with a reduction of PC
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      Root-level placeholder (ND, "no biological data") reflecting the historical
