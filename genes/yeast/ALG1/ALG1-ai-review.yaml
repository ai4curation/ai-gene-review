core_functions:
- description: Adds the first, beta-1,4-linked mannose from GDP-mannose to GlcNAc2-PP-dolichol on the
    cytoplasmic face of the ER, as the core subunit of Alg1-Alg2 and Alg1-Alg11 mannosyltransferase complexes
    building Man5GlcNAc2-PP-Dol.
