suggested_questions:
- question: Does assembly of Alg1 with Alg2 versus Alg11 channel the LLO intermediate between successive
    mannosyltransferases, and what determines the partition of Alg1 between the two complexes?
suggested_experiments:
- description: Reconstitute purified Alg1, Alg2 and Alg11 in nanodiscs at defined stoichiometries and
    measure Man1-Man5 intermediate kinetics to test substrate channelling within the complexes.
