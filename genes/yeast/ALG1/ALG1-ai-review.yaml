id: P16661
gene_symbol: ALG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ALG1 encodes the essential chitobiosyldiphosphodolichol beta-1,4-mannosyltransferase (EC
  2.4.1.142) of S. cerevisiae. Anchored in the ER membrane by an N-terminal transmembrane segment with
  its GT-B catalytic domain on the cytoplasmic face, Alg1p transfers the first, beta-1,4-linked mannose
  from GDP-mannose to GlcNAc2-PP-dolichol, forming Man1GlcNAc2-PP-Dol, the substrate for Alg2p. Alg1p
  self-associates and forms two distinct hetero-oligomeric mannosyltransferase complexes, one with Alg2p
  and one with Alg11p, which together build the Man5GlcNAc2-PP-Dol intermediate on the cytoplasmic side
  of the ER before it is flipped into the lumen. alg1 mutants accumulate GlcNAc2-PP-Dol and are defective
  in N-linked glycosylation; human ALG1 deficiency causes ALG1-CDG.
