descriptions:
- source: UniProt
  text: Participates in the formation of the lipid-linked precursor oligosaccharide
    for N-glycosylation. Involved in assembling the dolichol-pyrophosphate-GlcNAc(2)-Man(5)
    intermediate on the cytoplasmic surface of the ER.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P16661
  source_id: P16661
- source: Alliance_Imported
  text: Mannosyltransferase; involved in asparagine-linked glycosylation in the endoplasmic
    reticulum (ER); essential for viability; human homolog ALG1 complements yeast
    null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALG1
  source_id: SGD:S000000314
- source: Alliance_Automated
  text: Enables chitobiosyldiphosphodolichol beta-mannosyltransferase activity. Involved
    in dolichol-linked oligosaccharide biosynthetic process. Located in endoplasmic
    reticulum membrane. Is active in cytoplasmic side of endoplasmic reticulum membrane.
    Used to study congenital disorder of glycosylation; congenital disorder of glycosylation
    Ik; and congenital disorder of glycosylation type I. Human ortholog(s) of this
    gene implicated in congenital disorder of glycosylation Ik. Orthologous to several
    human genes including ALG1 (ALG1 chitobiosyldiphosphodolichol beta-mannosyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALG1
  source_id: SGD:S000000314
