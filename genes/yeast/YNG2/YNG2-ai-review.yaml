core_functions:
- description: Non-catalytic subunit of the piccolo NuA4 HAT module. Bound to the Epl1 EPcA domain, the
    Yng2 N-terminal region orients the module on the nucleosome so that the H4 and H2A tails reach the
    Esa1 active site; without Yng2, NuA4 activity and genome-wide nucleosomal H4 acetylation are greatly
    reduced. Through NuA4 this activity serves gene-specific transcriptional activation and the repair
    of DNA damage arising in S phase.
