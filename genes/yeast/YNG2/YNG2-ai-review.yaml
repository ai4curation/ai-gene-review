id: P38806
gene_symbol: YNG2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Yng2 (YHR090C, also Eaf4) is the ING-family subunit of the NuA4 histone acetyltransferase
  and one of the four subunits of its catalytic HAT module, piccolo NuA4, with Esa1, Epl1 and Eaf6. It
  has an N-terminal ING region and a C-terminal PHD finger. The N-terminal region, bound to the EPcA domain
  of Epl1, is needed with Esa1 and Epl1 for acetylation of nucleosomal histones H4 and H2A: Yng2 orients
  piccolo NuA4 on the nucleosome so that the H4 and H2A tails reach the Esa1 active site. The PHD finger
  binds histone H3 trimethylated at lysine 4 (and more weakly H3K4me2); it is dispensable for growth but
  directs H4 acetylation near the transcription start sites of highly expressed genes, without being needed
  for NuA4 recruitment there, and together with the Eaf3 chromodomain supports NuA4 action at DNA double-strand
  breaks. Yng2 is nuclear and moves to the cytosol under hypoxia. Cells lacking Yng2 are viable but lose
  most nucleosomal H4 acetylation, grow slowly, have gene-specific transcription defects, delay in mitosis
  and meiosis, and are sensitive to DNA damage in S phase.'
