knowledge_gaps:
- gap_statement: How binding of H3K4me3 by the Yng2 PHD finger directs local H4 acetylation without affecting
    NuA4 occupancy is not known.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: At highly expressed genes the PHD finger is needed for H4 acetylation near the transcription
    start site but not for NuA4 recruitment, whereas at a double-strand break the PHD finger, with the
    Eaf3 chromodomain, is needed for recruitment. How a flexibly tethered HAT module uses the mark to
    choose nucleosomes, and why the two contexts differ, has not been shown.
  provenance:
