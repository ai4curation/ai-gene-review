suggested_questions:
- question: Does the S. cerevisiae APC/C assemble any K11-linked ubiquitin on its substrates (for example
    through Ubc4-initiated multi-monoubiquitination), or is the IBA for protein K11-linked ubiquitination
    (GO:0070979) on APC2 purely a propagation of the UBE2S-dependent human specificity that should be
    re-placed at a metazoan node in the PAINT tree?
- question: Is the tenfold loss of Cdh1 binding to apc2 delta APC/C due to a direct C-box contact on the
    Apc2 cullin body, or to the secondary loss of Apc11 and Doc1 (which contributes the degron co-receptor
    surface) from the complex?
- question: Should the meiosis-specific APC/C-Ama1 process annotations propagated from ComplexPortal to
    every core subunit be retained on Apc2 without any Apc2-specific meiotic evidence, or confined to
    Ama1 and to subunits with meiotic phenotypes (Mnd2, Swm1)?
suggested_experiments:
- hypothesis: The Apc11-binding and Doc1-binding surfaces of Apc2 are separable, and each is independently
    required for processive ubiquitination of Pds1 and Clb2.
  description: Guided by the yeast APC/C cryo-EM models, introduce point mutations in the Apc2 cullin-homology
    domain (Apc11 interface) and in the Apc2 region contacted by Doc1; purify Apc1-TAP complexes from
    each mutant in the pds1 delta clb5 delta SIC1-10X background, score retention of Apc11, Doc1 and Cdh1,
    and assay Ubc4-priming and Ubc1-elongation kinetics on Pds1 and Clb2.
  experiment_type: structure-guided mutagenesis with TAP purification and in vitro ubiquitination kinetics
- hypothesis: Ubiquitin chains built on Pds1 and Clb2 by the Apc2-containing yeast APC/C in vivo are predominantly
    K48-linked with no substantial K11 component.
  description: Immunopurify ubiquitinated Pds1 and Clb2 from metaphase- and anaphase-synchronised cells
    (and from in vitro reactions with purified APC/C, Ubc4 and Ubc1) and quantify linkage types by ubiquitin-AQUA
    mass spectrometry, comparing with ubc1 delta and lysine-to-arginine ubiquitin mutants.
  experiment_type: quantitative ubiquitin linkage mass spectrometry
- hypothesis: Endogenous Apc2 follows the nuclear and kinetochore/spindle localisation reported for tagged
    Cdc23 and Apc9 throughout the cell cycle.
  description: Tag APC2 at its chromosomal locus with a fluorescent protein, confirm the fusion is functional,
    and image it live through the cell cycle alongside Cdc23-CFP and Tub1, including after nocodazole
    treatment and in cdc20-1 cells.
  experiment_type: endogenous tagging and live-cell imaging
