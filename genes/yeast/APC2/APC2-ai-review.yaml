gene_symbol: APC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Apc2 is the cullin-family subunit of the Saccharomyces cerevisiae anaphase-promoting complex/cyclosome
  (APC/C), the 13-subunit cullin-RING E3 ubiquitin ligase that triggers the metaphase-to-anaphase transition,
  drives exit from mitosis and maintains the low-CDK state of G1. The 853-residue, essential protein carries
  a C-terminal cullin-homology domain that anchors the RING-H2 subunit Apc11 to the core complex; the
  Apc2-Apc11 module is the catalytic core of the ligase, recruiting the ubiquitin-charged E2 enzymes Ubc4
  (chain initiation) and Ubc1 (chain elongation) and positioning them over substrates that are recognised
  through their D-box and KEN-box degrons by the coactivators Cdc20, Cdh1/Hct1 or the meiosis-specific
  Ama1 together with the co-receptor Doc1/Apc10. Apc2 also tethers Doc1 to the complex and is needed for
  efficient coactivator (Cdh1) binding, and with Apc11 and Doc1 forms one of the two subcomplexes that
  the large scaffold Apc1 bridges to the TPR subunits Cdc27, Cdc16 and Cdc23. Apc2 has no ubiquitin-thioester
  or substrate-recognition activity of its own: Apc11 alone can transfer ubiquitin in a minimal system,
  whereas loss of Apc2 removes Apc11 and Doc1 from the complex and abolishes APC/C ligase activity. Temperature-sensitive
  apc2 (rsi1) mutants fail to degrade the securin Pds1 and the mitotic cyclin Clb2 and arrest in metaphase;
  deleting PDS1 lets them enter anaphase but they then arrest in telophase because Clb2 persists, and
  compromised alleles are lethal without the CDK inhibitor Sic1. The yeast APC/C assembles predominantly
  K48-linked polyubiquitin chains that target securin and B-type cyclins to the proteasome, and APC/C-Cdh1
  activity that depends on Apc2 also promotes disassembly of the actomyosin ring after cytokinesis. Apc2
  is found in both the nucleus and the cytoplasm, with the intact complex predominantly nuclear during
  the closed mitosis of budding yeast; unlike human ANAPC2 it lacks the zinc-binding insert of the metazoan
  cullin subunit.'
