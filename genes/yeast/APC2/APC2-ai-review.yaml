core_functions:
- description: 'Cullin-like scaffold of the APC/C catalytic module: the Apc2 cullin-homology domain anchors
    the RING-H2 subunit Apc11 and the degron co-receptor Doc1/Apc10 to the Apc1-bridged core and contributes
    to coactivator (Cdh1/Cdc20) binding, positioning the Apc11-bound, ubiquitin-charged E2s Ubc4 and Ubc1
    over D-box/KEN-box substrates so that the complex assembles (predominantly K48-linked) polyubiquitin
    chains that send them to the proteasome.'
  molecular_function:
    id: GO:0160072
    label: ubiquitin ligase complex scaffold activity
  contributes_to_molecular_function:
    id: GO:0061630
