  review:
    summary: PAINT IBA from node PTN000231994 whose only experimental donor for this term is human ANAPC2
      (UniProtKB:Q9UJX6). K11-linked chain assembly by the human APC/C depends on the chain-elongating
      E2 UBE2S, which has no ortholog in S. cerevisiae; the budding-yeast APC/C instead uses Ubc4 to initiate
      and Ubc1 to elongate predominantly K48-linked chains (Rodrigo-Brenni and Morgan 2007, as summarised
      by Williamson et al. 2009).
    action: MODIFY
    reason: 'The IBD placement propagates a metazoan, UBE2S-dependent linkage specificity to the whole
      ANAPC2 family, but there is target-specific evidence of divergence: yeast lacks Ube2S and its APC/C-Ubc4/Ubc1
      system builds K48-linked chains. The ancestral, lineage-independent claim is that Apc2-containing
      APC/C assembles polyubiquitin chains that target substrates to the proteasome; the linkage supported
      in this organism is K48. Re-express as protein K48-linked ubiquitination (GO:0070936), with protein
      polyubiquitination (GO:0000209) as the safe linkage-agnostic term, and suggest that the K11 IBD
      be re-placed at the node where UBE2S-dependent chain building arose.'
    proposed_replacement_terms:
