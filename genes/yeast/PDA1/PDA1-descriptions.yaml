descriptions:
- source: UniProt
  text: The pyruvate dehydrogenase complex catalyzes the overall conversion of pyruvate
    to acetyl-CoA and CO(2).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P16387
  source_id: P16387
- source: Alliance_Imported
  text: E1 alpha subunit of the pyruvate dehydrogenase (PDH) complex; catalyzes the
    direct oxidative decarboxylation of pyruvate to acetyl-CoA; phosphorylated; regulated
    by glucose; PDH complex is concentrated in spots within the mitochondrial matrix,
    often near the ERMES complex and near peroxisomes
  source_type: curated
  url: https://www.yeastgenome.org/locus/PDA1
  source_id: SGD:S000000980
- source: Alliance_Automated
  text: Enables pyruvate dehydrogenase (acetyl-transferring) activity. Involved in
    pseudohyphal growth and pyruvate decarboxylation to acetyl-CoA. Located in mitochondrial
    nucleoid. Part of pyruvate dehydrogenase complex. Used to study pyruvate decarboxylase
    deficiency. Human ortholog(s) of this gene implicated in pyruvate decarboxylase
    deficiency and spermatogenic failure 70. Orthologous to human PDHA1 (pyruvate
    dehydrogenase E1 subunit alpha 1) and PDHA2 (pyruvate dehydrogenase E1 subunit
    alpha 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PDA1
  source_id: SGD:S000000980
