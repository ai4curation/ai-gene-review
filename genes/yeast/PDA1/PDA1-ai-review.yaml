id: P16387
gene_symbol: PDA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PDA1 (YER178W) encodes the E1 alpha subunit of the mitochondrial pyruvate dehydrogenase (PDH)
  complex. With Pdb1p (E1 beta) it forms the alpha2beta2 pyruvate dehydrogenase (acetyl-transferring)
  component (EC 1.2.4.1). This thiamine-diphosphate/Mg2+-dependent component decarboxylates pyruvate and
  reductively acetylates the lipoyl arms of the E2 core (Lat1p), the first and rate-limiting step of the
  PDH reaction from pyruvate to acetyl-CoA in the mitochondrial matrix. Pda1p is the regulatory target
  of the complex. Phosphorylation at Ser-313 by the kinases Pkp1p and Pkp2p inactivates E1, and the phosphatases
  Ptc5p and Ptc6p reverse it, depending on carbon source. Pda1p is also reported in mtDNA nucleoids, and
  pda1 mutants are defective in pseudohyphal growth.
