      supporting_text: two distinct point mutations in PDA1, the Y309A and S313A alleles, yield a dramatic
        fitness defect and loss of pseudohyphal differentiation in nitrogen-limiting conditions
    - reference_id: PMID:24603354
      supporting_text: Strains deleted for BUD6, ITR1, MDS3, NPR3, and PDA1 displayed significantly decreased
        pseudohyphal growth on both SLAD and SLALD medium
