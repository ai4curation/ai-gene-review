  evidence_type: IMP
  original_reference_id: PMID:24603354
  qualifier: involved_in
  review:
    summary: 'IMP from Johnson et al. 2014 (Sks1p kinase network): pda1 deletion and the Y309A/S313A point
      mutations reduce pseudohyphal growth under nitrogen limitation. S313 is the regulatory Pkp1/Pkp2
      phosphosite. The defect probably reflects the metabolic/respiratory need for PDH (the alleles also
      cause a strong fitness defect) rather than a dedicated signalling role.'
    action: KEEP_AS_NON_CORE
    reason: Experimentally supported but likely an indirect, pleiotropic result of losing PDH metabolic
      function.
    supported_by:
