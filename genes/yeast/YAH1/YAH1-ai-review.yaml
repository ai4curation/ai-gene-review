taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  YAH1 (YPL252C) encodes the essential mitochondrial adrenodoxin-type [2Fe-2S] ferredoxin of S. cerevisiae.
  Located in the mitochondrial matrix, Yah1 is reduced by the NADPH-dependent ferredoxin reductase Arh1
  and passes single electrons to several acceptors. It is required for de novo [2Fe-2S] cluster synthesis
  on the Isu1 scaffold (and hence for maturation of both mitochondrial and cytosolic Fe-S proteins), for
  the Cox15-catalysed hydroxylation of heme O to heme A, and for coenzyme Q6 biosynthesis, where it is
  the probable electron donor for the Coq6 ring hydroxylation. Depletion of Yah1 causes mitochondrial
  iron accumulation and loss of Fe-S protein activities.
