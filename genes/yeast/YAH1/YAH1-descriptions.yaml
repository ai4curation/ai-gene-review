descriptions:
- source: UniProt
  text: Iron-sulfur protein that transfers electrons in a wide variety of metabolic
    reactions. Involved in heme A biosynthesis and in iron-sulfur cluster assembly
    (PubMed:10655482). Transfers electrons from adrenodoxin reductase ARH1 to heme
    A synthase COX15, a heme protein that catalyzes the conversion of heme O to heme
    A (PubMed:11248251, PubMed:11788607). Required for the de novo synthesis of Fe-S
    clusters on iron sulfur cluster assembly protein ISU1. Interact in its reduced
    state with ISU1 to productively deliver electrons for Fe-S cluster synthesis (PubMed:12970193,
    PubMed:15211518, PubMed:25358379). Essential for coenzyme Q biosynthesis. May
    transfer the electrons required for the hydroxylation reaction performed by COQ6
    (PubMed:20534343, PubMed:21944752).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12184
  source_id: Q12184
- source: Alliance_Imported
  text: Ferredoxin of the mitochondrial matrix; required for formation of cellular
    iron-sulfur proteins; involved in heme A biosynthesis; human homolog FDX1L can
    complement yeast by allowing growth during down-regulation of yeast YAH1
  source_type: curated
  url: https://www.yeastgenome.org/locus/YAH1
  source_id: SGD:S000006173
- source: Alliance_Automated
  text: Enables iron-sulfur cluster binding activity and oxidoreductase activity,
    acting on NAD(P)H, heme protein as acceptor. Involved in heme A biosynthetic process;
    iron-sulfur cluster assembly; and ubiquinone biosynthetic process. Located in
    mitochondrial matrix. Human ortholog(s) of this gene implicated in episodic mitochondrial
    myopathy with optic atrophy and reversible leukoencephalopathy. Orthologous to
    human FDX2 (ferredoxin 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/YAH1
  source_id: SGD:S000006173
