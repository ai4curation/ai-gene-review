  evidence_type: IDA
  original_reference_id: PMID:20659900
  qualifier: enables
  review:
    summary: 'IDA (Cheng et al. 2010): Adk1 was detected at replication origins by ChIP and binds chromatin/Orc3.
      ChIP shows proximity to origins, most plausibly via ORC, rather than direct sequence-specific binding
      to origin DNA by a cytosolic/IMS adenylate kinase. The moonlighting replication role is captured
      as non-core by the pre-RC assembly row.'
    action: MARK_AS_OVER_ANNOTATED
    reason: ChIP association with origins does not demonstrate sequence-specific origin DNA binding.
