id: P07170
gene_symbol: ADK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADK1 (AKY2; YDR226W) encodes the major adenylate kinase of S. cerevisiae (AK2 subfamily),
  which catalyses the reversible reaction AMP + ATP <-> 2 ADP. About 90% of the protein is cytosolic and
  ~10% is imported, without a cleavable presequence, into the mitochondrial intermembrane space. Adk1
  maintains adenine nucleotide homeostasis and energy charge; adk1 null mutants are viable but slow-growing,
  respiration-deficient and temperature-sensitive, retaining ~10% of cytosolic activity from a minor,
  exclusively cytoplasmic isozyme. Loss of Adk1 catalytic activity changes adenylate pools and derepresses
  the PHO and ADE regulons. Adk1 has also been reported to associate with chromatin and Orc3 and to promote
  pre-replicative complex assembly.
