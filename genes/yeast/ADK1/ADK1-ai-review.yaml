suggested_questions:
- question: Is the pre-RC assembly role of Adk1 catalytic (local ADP/ATP buffering for ORC/Cdc6 ATPases)
    or structural (Orc3 binding)?
- question: Which enzyme supplies the residual ~10% cytosolic adenylate kinase activity in adk1 null cells?
suggested_experiments:
- description: Test whether catalytically dead but Orc3-binding-competent Adk1 variants support pre-RC
    assembly, separating catalytic from scaffolding roles.
