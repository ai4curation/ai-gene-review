    overall_notes: Correct reaction, energy homeostasis and PHO/ADE regulation.
- source: Alliance_Imported
  text: Adenylate kinase, required for purine metabolism; controls ATP homeostasis;
    localized to the cytoplasm and the mitochondria; lacks cleavable signal sequence;
    protein abundance increases in response to DNA replication stress; mutations affecting
    Adk1p catalytic activity deregulate expression of phosphate utilization genes
    PHO5 and PHO84; human homolog AK1 can complement yeast adk1 mutant
  source_type: curated
