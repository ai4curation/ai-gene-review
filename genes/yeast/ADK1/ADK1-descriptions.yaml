descriptions:
- source: UniProt
  text: Catalyzes the reversible transfer of the terminal phosphate group between
    ATP and AMP. Plays an important role in cellular energy homeostasis and in adenine
    nucleotide metabolism. Adenylate kinase activity is critical for regulation of
    the phosphate utilization and the AMP de novo biosynthesis pathways.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07170
