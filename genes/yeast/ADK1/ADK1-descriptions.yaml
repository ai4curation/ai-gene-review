- source: Alliance_Automated
  text: Enables AMP kinase activity; DNA replication origin binding activity; and
    adenyl ribonucleotide binding activity. Involved in ADP biosynthetic process;
    DNA replication initiation; and pre-replicative complex assembly. Located in cytosol
    and mitochondrial intermembrane space. Human ortholog(s) of this gene implicated
    in reticular dysgenesis. Orthologous to human AK2 (adenylate kinase 2).
