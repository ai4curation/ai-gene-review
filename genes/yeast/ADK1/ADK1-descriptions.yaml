gene_symbol: ADK1
organism: yeast
uniprot_id: P07170
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the reversible transfer of the terminal phosphate group between
    ATP and AMP. Plays an important role in cellular energy homeostasis and in adenine
    nucleotide metabolism. Adenylate kinase activity is critical for regulation of
    the phosphate utilization and the AMP de novo biosynthesis pathways.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07170
  source_id: P07170
- source: Alliance_Imported
  text: Adenylate kinase, required for purine metabolism; controls ATP homeostasis;
    localized to the cytoplasm and the mitochondria; lacks cleavable signal sequence;
    protein abundance increases in response to DNA replication stress; mutations affecting
    Adk1p catalytic activity deregulate expression of phosphate utilization genes
    PHO5 and PHO84; human homolog AK1 can complement yeast adk1 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADK1
  source_id: SGD:S000002634
- source: Alliance_Automated
  text: Enables AMP kinase activity; DNA replication origin binding activity; and
    adenyl ribonucleotide binding activity. Involved in ADP biosynthetic process;
    DNA replication initiation; and pre-replicative complex assembly. Located in cytosol
    and mitochondrial intermembrane space. Human ortholog(s) of this gene implicated
    in reticular dysgenesis. Orthologous to human AK2 (adenylate kinase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADK1
  source_id: SGD:S000002634
