taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: XKS1 encodes D-xylulokinase of Saccharomyces cerevisiae, a member of the FGGY carbohydrate
  kinase family that phosphorylates D-xylulose at C-5 using ATP (EC 2.7.1.17), producing D-xylulose 5-phosphate
  that enters the non-oxidative pentose phosphate pathway. This is the final step of the oxidoreductive
  D-xylose pathway (aldose reductase GRE3, xylitol dehydrogenase XYL2, xylulokinase XKS1). XKS1 is required
  for growth on D-xylulose as sole carbon source; its low native expression limits xylulose fermentation,
  and overexpression stimulates growth on xylulose. The partially purified enzyme also accepts D-ribulose.
  Xks1 is a cytoplasmic protein.
