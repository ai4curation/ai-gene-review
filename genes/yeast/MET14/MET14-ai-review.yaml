id: Q02196
gene_symbol: MET14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Met14 is the adenylyl-sulfate kinase (APS kinase, EC 2.7.1.25) of Saccharomyces cerevisiae.
  It phosphorylates the 3'-hydroxyl of adenosine 5'-phosphosulfate (APS), made by the ATP sulfurylase
  Met3, using ATP, to give 3'-phosphoadenylyl sulfate (PAPS). PAPS is the activated sulfate that the PAPS
  reductase Met16 reduces to sulfite in the sulfate assimilation pathway that leads to sulfide, homocysteine,
  methionine, cysteine and glutathione. Met14 is a small, soluble, P-loop kinase in the cytoplasm. The
  purified yeast enzyme is a dimer whose activity rises under reducing (thiol) conditions. met14 mutants
  are unable to assimilate sulfate and need organic sulfur.
