suggested_questions:
- question: Is the reproducible Gpp2p-Gut1p association (two independent AP/AE-MS screens) a regulatory
    complex that prevents a glycerol/glycerol-3-phosphate futile cycle?
- question: Does the in vitro sn-glycerol 1-phosphatase activity of Gpp2p have any physiological substrate?
suggested_experiments:
- description: Validate the Gpp2-Gut1 interaction by co-IP/BiFC under glycerol versus glucose growth and
    test whether it changes glycerol kinase or phosphatase activity.
