id: P40106
gene_symbol: GPP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Gpp2p (Hor2p) is the osmotically induced glycerol-3-phosphate phosphohydrolase (EC 3.1.3.21)
  of S. cerevisiae, a Mg2+-dependent HAD-superfamily (DOG/GPP family) monomeric phosphatase 95% identical
  to Gpp1p. It dephosphorylates sn-glycerol 3-phosphate, produced by Gpd1p/Gpd2p, to glycerol, the final
  step of glycerol synthesis, and in vitro also acts on sn-glycerol 1-phosphate. Gpp2p protein rises on
  hyperosmotic stress through the HOG MAP kinase pathway and GPP2 is also induced by oxidative stress
  (paraquat). Gpp1p and Gpp2p substitute for each other: only the double mutant lacks glycerol-3-phosphatase
  activity and is osmosensitive and paraquat-sensitive. Gpp2p is a soluble cytoplasmic protein, also detected
  in the nucleus.'
