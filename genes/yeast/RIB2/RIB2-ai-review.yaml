id: Q12362
gene_symbol: RIB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'RIB2 (YOL066C; also PUS8) encodes a bifunctional cytoplasmic protein that arose by gene
  fusion. Its C-terminal cytidine/deoxycytidylate-deaminase-family domain (zinc-dependent) is the riboflavin-pathway
  pyrimidine deaminase: in yeast, as in other fungi, the Rib1 product DARPP is first reduced by Rib7 and
  Rib2 then deaminates the ribityl intermediate (2,5-diamino-6-ribitylamino-4(3H)-pyrimidinone 5''-phosphate)
  at C2, so rib2 mutants are riboflavin auxotrophs that accumulate the triaminopyrimidine. Its N-terminal
  RluA-family domain is the cytoplasmic tRNA pseudouridine(32) synthase, forming Psi32 in cytoplasmic
  tRNAs, while the paralogous Pus9 performs the same modification in mitochondria.'
