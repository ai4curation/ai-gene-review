suggested_questions:
- question: GO:0043723 (2,5-diamino-6-ribitylamino-4(3H)-pyrimidinone 5'-phosphate deaminase activity,
    MetaCyc synonym YOL066C-MONOMER) is obsolete, so yeast Rib2 is annotated with the ribosyl-substrate
    bacterial DRAP deaminase term GO:0008835. Should GO restore a ribityl-substrate deaminase term for
    the fungal pathway order (reduction before deamination)?
- question: Has the substrate specificity (ribityl vs ribosyl intermediate) of purified yeast Rib2 deaminase
    domain been determined directly?
suggested_experiments:
- description: Express the isolated C-terminal domain of Rib2 and assay deamination of the ribosyl (DARPP)
    vs ribityl (DARIPP) substrates to define the physiological substrate.
