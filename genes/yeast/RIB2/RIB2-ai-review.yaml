  review:
    summary: Enzyme-directed rRNA pseudouridine synthesis is inherited from a broad RluA node seeded by
      bacterial rRNA pseudouridine synthases (RluA-RluF) and yeast Pus5/Pus9-like members. Rib2/Pus8 is
      the strictly cytoplasmic tRNA Psi32 synthase; there is no evidence that it modifies rRNA, and the
      yeast rRNA pseudouridines are made by snoRNA-guided Cbf5 (cytoplasmic rRNA) and Pus5 (mitochondrial
      21S rRNA). The node placement over-extends rRNA specificity to this tRNA-specific member.
    action: MARK_AS_OVER_ANNOTATED
    reason: Substrate specificity of Rib2/Pus8 is tRNA position 32; rRNA modification not supported.
    supported_by:
    - reference_id: PMID:15466869
      supporting_text: two enzymes, Rib2/Pus8p and Pus9p, are required for Psi32 formation in cytoplasmic
        and mitochondrial tRNAs, respectively
    - reference_id: PMID:15466869
      supporting_text: Pus9p acts mostly in mitochondria, and Rib2/Pus8p is strictly cytoplasmic.
