gene_symbol: RIB2
organism: yeast
uniprot_id: Q12362
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Responsible for synthesis of pseudouridine from uracil-32 in cytoplasmic transfer
    RNAs. Involved in riboflavin biosynthesis. Converts 2,5-diamino-6- (ribosylamino)-4(3H)-pyrimidinone
    5'-phosphate into 5-amino-6- (ribosylamino)-2,4(1H,3H)-pyrimidinedione 5'-phosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12362
  source_id: Q12362
- source: Alliance_Imported
  text: Bifunctional DRAP deaminase tRNA:pseudouridine synthase; the deaminase catalyzes
    the third step in riboflavin biosynthesis and the synthase catalyzes formation
    of pseudouridine at position 32 in cytoplasmic tRNAs; RIB2 has a paralog, PUS9,
    that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/RIB2
  source_id: SGD:S000005427
- source: Alliance_Automated
  text: Enables diaminohydroxyphosphoribosylaminopyrimidine deaminase activity and
    pseudouridine synthase activity. Involved in riboflavin biosynthetic process and
    tRNA pseudouridine synthesis. Located in cytoplasm. Orthologous to human RPUSD2
    (RNA pseudouridine synthase domain containing 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RIB2
  source_id: SGD:S000005427
fetch_date: '2026-11-01'
