- source: Alliance_Automated
  text: Enables diaminohydroxyphosphoribosylaminopyrimidine deaminase activity and
    pseudouridine synthase activity. Involved in riboflavin biosynthetic process and
    tRNA pseudouridine synthesis. Located in cytoplasm. Orthologous to human RPUSD2
    (RNA pseudouridine synthase domain containing 2).
