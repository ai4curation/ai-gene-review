      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Correct bifunctional Psi32 synthase and riboflavin deaminase. Gives
      the ribosyl (bacterial-order) substrate, while the review places Rib2 after
      Rib7 acting on the ribityl intermediate.
- source: Alliance_Imported
  text: Bifunctional DRAP deaminase tRNA:pseudouridine synthase; the deaminase catalyzes
    the third step in riboflavin biosynthesis and the synthase catalyzes formation
    of pseudouridine at position 32 in cytoplasmic tRNAs; RIB2 has a paralog, PUS9,
    that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/RIB2
