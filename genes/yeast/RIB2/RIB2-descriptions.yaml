descriptions:
- source: UniProt
  text: Responsible for synthesis of pseudouridine from uracil-32 in cytoplasmic transfer
    RNAs. Involved in riboflavin biosynthesis. Converts 2,5-diamino-6- (ribosylamino)-4(3H)-pyrimidinone
    5'-phosphate into 5-amino-6- (ribosylamino)-2,4(1H,3H)-pyrimidinedione 5'-phosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12362
  source_id: Q12362
