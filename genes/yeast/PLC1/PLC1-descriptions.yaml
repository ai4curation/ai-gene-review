descriptions:
- source: UniProt
  text: The production of the second messenger molecules diacylglycerol (DAG) and
    inositol 1,4,5-trisphosphate (IP3) is mediated by activated phosphatidylinositol-specific
    phospholipase C enzymes. Required for cell growth, osmoresistance and expression
    of GPD1.
