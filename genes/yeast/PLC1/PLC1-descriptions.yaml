gene_symbol: PLC1
organism: yeast
uniprot_id: P32383
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: The production of the second messenger molecules diacylglycerol (DAG) and
    inositol 1,4,5-trisphosphate (IP3) is mediated by activated phosphatidylinositol-specific
    phospholipase C enzymes. Required for cell growth, osmoresistance and expression
    of GPD1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32383
  source_id: P32383
- source: Alliance_Imported
  text: Phospholipase C; hydrolyzes phosphatidylinositol 4,5-biphosphate (PIP2) to
    generate the signaling molecules inositol 1,4,5-triphosphate (IP3) and 1,2-diacylglycerol
    (DAG); involved in regulating many cellular processes; Plc1p and inositol polyphosphates
    are required for acetyl-CoA homeostasis which regulates global histone acetylation
  source_type: curated
  url: https://www.yeastgenome.org/locus/PLC1
  source_id: SGD:S000006189
- source: Alliance_Automated
  text: Enables phosphatidylinositol-4,5-bisphosphate phospholipase C activity. Involved
    in several processes, including inositol phosphate biosynthetic process; protein
    localization to kinetochore; and signal transduction involved in filamentous growth.
    Located in kinetochore. Human ortholog(s) of this gene implicated in several diseases,
    including autoinflammation, antibody deficiency, and immune dysregulation syndrome;
    carcinoma (multiple); developmental and epileptic encephalopathy 12; familial
    cold autoinflammatory syndrome 3; and myelodysplastic syndrome. Orthologous to
    several human genes including PLCD3 (phospholipase C delta 3) and PLCD4 (phospholipase
    C delta 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PLC1
  source_id: SGD:S000006189
