- source: Alliance_Automated
  text: Enables phosphatidylinositol-4,5-bisphosphate phospholipase C activity. Involved
    in several processes, including inositol phosphate biosynthetic process; protein
    localization to kinetochore; and signal transduction involved in filamentous growth.
    Located in kinetochore. Human ortholog(s) of this gene implicated in several diseases,
    including autoinflammation, antibody deficiency, and immune dysregulation syndrome;
    carcinoma (multiple); developmental and epileptic encephalopathy 12; familial
    cold autoinflammatory syndrome 3; and myelodysplastic syndrome. Orthologous to
    several human genes including PLCD3 (phospholipase C delta 3) and PLCD4 (phospholipase
    C delta 4).
