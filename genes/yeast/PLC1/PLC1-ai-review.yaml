core_functions:
- description: Ca2+-dependent hydrolysis of PI(4,5)P2 to DAG and Ins(1,4,5)P3, the first step of the inositol
    phosphate biosynthetic pathway and the source of phosphoinositide-derived second messengers (glucose
    signalling, vacuole fusion).
