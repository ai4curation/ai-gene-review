suggested_questions:
- question: "How is Plc1 activated in yeast, which lacks heterotrimeric G-protein-coupled PLC-beta and\n\
    \                receptor tyrosine kinase-coupled PLC-gamma (e.g. by Gpr1/Gpa2, Ca2+ transients or\
    \ membrane\n                recruitment), and at which membrane is most IP3 for IP6 synthesis generated?"
- question: "Is the centromeric pool of Plc1 catalytically active, i.e. does it locally generate\n   \
    \             InsPs for RSC recruitment, or does it act structurally on CBF3?"
suggested_experiments:
- description: "Complement plc1 null cells with catalytically dead Plc1 (X/Y-box mutants) to test which\n\
    \                phenotypes (kinetochore function, filamentation, osmoresistance, vacuole fusion)\
    \ require PIP2\n                hydrolysis; use live PIP2/DAG sensors to map where Plc1 acts."
