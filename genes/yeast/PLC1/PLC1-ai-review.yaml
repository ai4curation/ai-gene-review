taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PLC1 (YPL268W) encodes the only canonical phosphoinositide-specific phospholipase C of Saccharomyces
  cerevisiae, a homologue of mammalian PLC-delta with EF-hand, catalytic X/Y-box and C2 domains. Plc1
  is a strictly Ca2+-dependent enzyme that hydrolyses phosphatidylinositol 4,5-bisphosphate to 1,2-diacylglycerol
  and Ins(1,4,5)P3. Its IP3 product is the entry point of the Arg82-Ipk1-Kcs1/Vip1 pathway to IP6 and
  inositol pyrophosphates (needed for mRNA export, PHO regulation and polyphosphate accumulation), while
  DAG production supports vacuole fusion. Plc1 mediates glucose-induced PI turnover and plasma membrane
  H+-ATPase activation, acts with the Gpr1 receptor and Gpa2 in nitrogen-dependent pseudohyphal signalling,
  and is needed for osmoresistance, growth at high temperature and use of non-fermentable carbon sources.
  A pool of Plc1 associates with the CBF3 kinetochore complex at centromeres and is required for normal
  centromeric chromatin and chromosome segregation.
