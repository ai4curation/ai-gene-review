taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Catalytic subunit (Idh2p, YOR136W) of the mitochondrial NAD+-dependent isocitrate dehydrogenase (NAD-IDH,
  EC 1.1.1.41), a hetero-octamer of four Idh1 and four Idh2 subunits built from Idh1/Idh2 heterodimers. Idh2 contains
  the catalytic isocitrate/Mg2+ site where isocitrate is oxidatively decarboxylated to 2-oxoglutarate with reduction
  of NAD+ to NADH, a rate-limiting step of the TCA cycle in the mitochondrial matrix; the homologous Idh1 subunit
  provides allosteric regulation by AMP and isocitrate cooperativity. Both subunits are required for activity; loss
  of NAD-IDH abolishes isocitrate-driven mitochondrial respiration and impairs growth on acetate and glycerol.
