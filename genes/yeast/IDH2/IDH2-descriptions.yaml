descriptions:
- source: UniProt
  text: Performs an essential role in the oxidative function of the citric acid cycle.
    Also binds RNA; specifically to the 5'-untranslated leaders of mitochondrial mRNAs.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P28241
  source_id: P28241
- source: Alliance_Imported
  text: Subunit of mitochondrial NAD(+)-dependent isocitrate dehydrogenase; complex
    catalyzes oxidation of isocitrate to alpha-ketoglutarate in TCA cycle; targeted
    to vacuole via AP-3 pathway
  source_type: curated
  url: https://www.yeastgenome.org/locus/IDH2
  source_id: SGD:S000005662
- source: Alliance_Automated
  text: Contributes to isocitrate dehydrogenase (NAD+) activity. Involved in isocitrate
    metabolic process and tricarboxylic acid cycle. Located in mitochondrion. Part
    of isocitrate dehydrogenase complex (NAD+). Used to study early infantile epileptic
    encephalopathy. Human ortholog(s) of this gene implicated in retinitis pigmentosa
    90. Orthologous to human IDH3A (isocitrate dehydrogenase (NAD(+)) 3 catalytic
    subunit alpha).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IDH2
  source_id: SGD:S000005662
