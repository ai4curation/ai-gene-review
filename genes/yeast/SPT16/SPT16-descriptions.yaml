      cryptic transcription suppression, TBP binding, and replication-coupled nucleosome
      deposition.
- source: Alliance_Imported
  text: Subunit of the heterodimeric FACT complex (Spt16p-Pob3p); FACT associates
    with chromatin via interaction with Nhp6Ap and Nhp6Bp, and reorganizes nucleosomes
    to facilitate access to DNA by RNA and DNA polymerases; specifically required
    for diauxic shift-induced H2B deposition onto rDNA genes; mutations cause reduced
    nucleosome occupancy over highly transcribed regions; coregulates transcription
    with Mot1p through preinitiation complex assembly and nucleosome organization
  source_type: curated
  url: https://www.yeastgenome.org/locus/SPT16
  source_id: SGD:S000003175
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
      notes: Accurate.
    - rubric: utility
      score: 5
      notes: Adds unique biology (diauxic shift, Mot1p, Nhp6) not in UniProt.
    - rubric: compactness
      score: 4
      notes: Dense but appropriately so.
    - rubric: completeness
      score: 4
      notes: Covers heterodimer, chromatin association, diauxic shift, Mot1p. Misses
        H2A-H2B dynamics and repair role.
    - rubric: specificity
      score: 5
      notes: Names specific partners (Pob3p, Nhp6Ap/Bp, Mot1p) and conditions (diauxic
        shift).
    overall_notes: Complementary to UniProt. Identifies heterodimeric partner (Pob3p),
      Nhp6A/Bp association, diauxic shift-specific H2B deposition on rDNA, Mot1p coregulation,
      and nucleosome occupancy effects.
- source: Alliance_Automated
  text: Contributes to histone binding activity and nucleosome binding activity. Involved
    in several processes, including chromatin remodeling; positive regulation of RNA
    polymerase II transcription preinitiation complex assembly; and regulation of
    sister chromatid cohesion. Located in chromatin and nucleus. Part of FACT complex.
    Human ortholog(s) of this gene implicated in neurodevelopmental disorder with
    dysmorphic facies and thin corpus callosum. Orthologous to human SUPT16H (SPT16
    homolog, facilitates chromatin remodeling subunit).
