descriptions:
- source: Alliance_Imported
  text: Cell-wall L-asparaginase II involved in asparagine catabolism; expression
    induced during nitrogen starvation; ORF contains a short non-coding RNA that enhances
    expression of full-length gene; likely arose in via horizontal gene transfer from
    the wine yeast Wickerhamomyces anomalus or a close relative; enzyme preparation
    shows antitumor activity; reference strain S288C has four copies of ASP3; ASP3-2
    has a paralog, ASP3-4, that arose from a segmental duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ASP3-2
