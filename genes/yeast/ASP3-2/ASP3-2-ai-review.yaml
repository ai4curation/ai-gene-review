- id: PMID:36040324
  title: The evolution and role of the periplasmic asparaginase Asp3 in yeast.
  findings:
  - statement: A larger strain survey favors ancestral ASP3 retention/loss over recent HGT. Native copy
      number varies; heterologous S. uvarum expression improves sole-asparagine growth but not apple-juice
      growth.
    supporting_text: Using BLASTP, we detected the presence of at least one copy of ASP3 in the genomes
      of 117 strains (∼7%).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text read for the stated evidence. A larger strain survey favors ancestral
      ASP3 retention/loss over recent HGT. Native copy number varies; heterologous S. uvarum expression
      improves sole-asparagine growth but not apple-juice growth.
- id: PMID:22776361
  title: The ASP3 locus in Saccharomyces cerevisiae originated by horizontal gene transfer from Wickerhamomyces.
  findings:
  - statement: The 2012 recent-HGT proposal is challenged by the larger 2022 survey (PMID:36040324); the
      four identical S288C copies and strain-variable occurrence remain relevant.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Cached abstract inspected; conclusions limited to explicitly reported results. The 2012
      recent-HGT proposal is challenged by the larger 2022 survey (PMID:36040324); the four identical
      S288C copies and strain-variable occurrence remain relevant.
