  label: Saccharomyces cerevisiae S288C
description: L-asparaginase II (cell-wall asparaginase; EC 3.5.1.1) of Saccharomyces cerevisiae, encoded by ASP3-2, one of
  four identical tandem copies (ASP3-1 to ASP3-4) adjacent to the rDNA array on chromosome XII. The precursor carries a 25-residue
  signal peptide and the mature enzyme resides in the cell wall-bounded periplasmic space, where it hydrolyses external L-asparagine
  (and D-asparagine and N-acyl-asparagines) to aspartate and ammonium. Unlike the constitutive cytoplasmic asparaginase I
  (Asp1), ASP3 expression is under nitrogen catabolite repression and is induced by nitrogen starvation or poor nitrogen sources,
  allowing nitrogen scavenging from extracellular asparagine. The ASP3 cluster is absent from many S. cerevisiae strains.
