description: Glutamate-cysteine ligase (gamma-glutamylcysteine synthetase, EC 6.3.2.2) of Saccharomyces cerevisiae.
  Gsh1 catalyses the ATP-dependent condensation of L-glutamate and L-cysteine to gamma-L-glutamyl-L-cysteine, the
  first and rate-limiting step of glutathione biosynthesis, in the cytosol. Unlike the mammalian heterodimeric GCL,
  yeast Gsh1 functions without a separate modifier subunit and is subject to feedback inhibition by glutathione.
  gsh1 mutants are glutathione-deficient and hypersensitive to H2O2, superoxide and cadmium; GSH1 transcription
  is induced by oxidants (Yap1) and cadmium (Met4/Met31/Met32).
