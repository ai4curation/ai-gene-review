suggested_questions:
- question: What are the kinetics of Gsh1 feedback inhibition by glutathione in vivo, and does any yeast protein
    act as a GCLM-like modifier?
suggested_experiments:
- hypothesis: Gsh1 alone is sufficient for full GCL activity and GSH-feedback regulation in yeast.
  description: Purify recombinant Gsh1 and measure Km for glutamate/cysteine and Ki for GSH, then test whether yeast
    lysate fractions modulate these parameters.
