    label: response to hydrogen peroxide
  evidence_type: IMP
  original_reference_id: PMID:7615092
  qualifier: involved_in
  review:
    summary: 'Izawa et al. 1995: a GSH-I deficient mutant is hypersensitive to H2O2 and cannot adapt. The phenotype
      reflects loss of glutathione (the antioxidant), i.e. an indirect consequence of the biosynthetic activity.'
    action: KEEP_AS_NON_CORE
    reason: Downstream physiological consequence of glutathione depletion; not the direct function of Gsh1.
    supported_by:
    - reference_id: PMID:7615092
      supporting_text: A mutant deficient in GSH-I also showed the hypersensitivity and could not adapt to H2O2.
- term:
    id: GO:0046686
    label: response to cadmium ion
  evidence_type: IDA
  original_reference_id: PMID:10921921
  qualifier: involved_in
  review:
    summary: Dormer et al. 2000 showed GSH1 transcription is induced by cadmium via the Met4/Met31/Met32 sulfur-amino-acid
      regulatory network. The evidence is transcriptional induction of the gene, so the protein product is a responder
      to cadmium by expression; glutathione supply supports cadmium detoxification.
    action: KEEP_AS_NON_CORE
    reason: Expression-based response term; Gsh1 supplies glutathione for cadmium tolerance but cadmium response
      is not its core activity.
    supported_by:
    - reference_id: PMID:10921921
      supporting_text: Expression of the yeast GSH1 gene, encoding the first enzyme involved in glutathione biosynthesis,
        gamma-glutamylcysteine synthetase, is regulated by oxidants and the heavy metal cadmium at the level of
        transcription.
