gene_symbol: GSH1
organism: yeast
uniprot_id: P32477
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the ATP-dependent condensation of cysteine and glutamate to form
    the dipeptide gamma-glutamylcysteine (gamma-GC), the first and rate-limiting step
    in the production of glutathione (GSH).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32477
  source_id: P32477
- source: Alliance_Imported
  text: Gamma glutamylcysteine synthetase; catalyzes the first step in glutathione
    (GSH) biosynthesis; expression induced by oxidants, cadmium, and mercury; protein
    abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GSH1
  source_id: SGD:S000003637
- source: Alliance_Automated
  text: Enables glutamate-cysteine ligase activity. Involved in glutathione biosynthetic
    process; response to cadmium ion; and response to hydrogen peroxide. Located in
    cytoplasm. Human ortholog(s) of this gene implicated in bacterial infectious disease;
    congenital nonspherocytic hemolytic anemia 7; cystic fibrosis; hemolytic anemia;
    and myocardial infarction. Orthologous to human GCLC (glutamate-cysteine ligase
    catalytic subunit).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GSH1
  source_id: SGD:S000003637
fetch_date: '2026-11-01'
