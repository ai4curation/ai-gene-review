- source: Alliance_Imported
  text: Ornithine carbamoyltransferase; also known as carbamoylphosphate:L-ornithine
    carbamoyltransferase; catalyzes the biosynthesis of the arginine precursor citrulline;
    localizes to the cytosol;  human ortholog OTC complements the arginine auxotrophy
    of the yeast null mutant; hypomorphic variants in human OTC are associated with
    late-onset ornithine transcarbamylase deficiency
