descriptions:
- source: Alliance_Imported
  text: Ornithine carbamoyltransferase; also known as carbamoylphosphate:L-ornithine
    carbamoyltransferase; catalyzes the biosynthesis of the arginine precursor citrulline;
    localizes to the cytosol;  human ortholog OTC complements the arginine auxotrophy
    of the yeast null mutant; hypomorphic variants in human OTC are associated with
    late-onset ornithine transcarbamylase deficiency
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARG3
  source_id: SGD:S000003624
- source: Alliance_Automated
  text: Enables ornithine carbamoyltransferase activity. Involved in L-arginine biosynthetic
    process. Located in cytosol. Part of ornithine carbamoyltransferase inhibitor
    complex. Used to study ornithine carbamoyltransferase deficiency. Human ortholog(s)
    of this gene implicated in ornithine carbamoyltransferase deficiency. Orthologous
    to human OTC (ornithine transcarbamylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ARG3
  source_id: SGD:S000003624
