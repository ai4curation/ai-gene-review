description: 'Ornithine carbamoyltransferase (OTCase, EC 2.1.3.3) of Saccharomyces cerevisiae. This cytosolic
  anabolic enzyme transfers the carbamoyl group of carbamoyl phosphate (made by the arginine-specific
  carbamoyl-phosphate synthetase CPA1/CPA2) to L-ornithine exported from mitochondria, forming L-citrulline;
  this is the first step of the conversion of ornithine to arginine. Unlike OTCases of mammals, Neurospora
  and fission yeast, the S. cerevisiae enzyme is not mitochondrial. ARG3 activity is regulated by the
  ''epiarginase'' mechanism: in the presence of ornithine and arginine, OTCase forms a one-to-one complex
  with arginase (CAR1) in which OTCase is inhibited while arginase stays active, preventing futile synthesis
  of citrulline while arginine is being catabolised. ARG3 expression is repressed by arginine (ArgR/Mcm1)
  and induced by general amino acid control.'
