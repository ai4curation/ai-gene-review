gene_symbol: ECM31
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ECM31 (YBR176W) encodes the mitochondrial 3-methyl-2-oxobutanoate (ketopantoate) hydroxymethyltransferase
  of S. cerevisiae, the PanB-family enzyme that transfers a hydroxymethyl group from 5,10-methylenetetrahydrofolate
  to 3-methyl-2-oxobutanoate (alpha-ketoisovalerate, a valine-biosynthesis intermediate) to form 2-dehydropantoate
  (ketopantoate). This is the first committed step of pantoate and hence pantothenate (vitamin B5) synthesis;
  ketopantoate is subsequently reduced to pantoate and condensed with beta-alanine by Pan6. ecm31 deletion
  mutants cannot grow on beta-alanine and require pantothenate. Large-scale proteomic and localisation
  studies consistently place Ecm31 in mitochondria. The ECM ('extracellular mutant') name derives from
  a cell-wall screen and does not reflect its function.
