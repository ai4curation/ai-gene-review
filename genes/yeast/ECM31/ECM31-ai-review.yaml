suggested_questions:
- question: YeastPathways places the pantothenate branch in the cytosol, but Ecm31 is mitochondrial; how
    is 2-dehydropantoate (or pantoate) exported from mitochondria to meet beta-alanine and Pan6 (pantothenate
    synthetase), and which ketopantoate reductase acts in yeast?
suggested_experiments:
- description: Purify recombinant Ecm31 and measure 5,10-methylene-THF-dependent ketopantoate formation
    directly, including Mg2+ dependence, to convert the homology/auxotrophy-based activity assignment
    into direct biochemical evidence.
