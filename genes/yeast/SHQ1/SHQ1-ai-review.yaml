- id: PMID:37818102
  title: Human SHQ1 variants R335C and A426V lead to severe ribosome biogenesis defects
    when expressed in yeast.
  findings:
  - statement: Human SHQ1 disease variants impair Cbf5 interaction, H/ACA snoRNA accumulation,
      pre-rRNA processing, and ribosome production in a yeast complementation system.
    supporting_text: Our data provide additional evidence for the critical role of
      SHQ1 in chaperoning the pseudouridine synthase dyskerin
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified 2023 yeast complementation study; corroborates
      the conserved SHQ1-Cbf5 carrier-chaperone model but does not alter the yeast
      GO action calls.
