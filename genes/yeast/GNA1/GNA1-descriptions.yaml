gene_symbol: GNA1
organism: yeast
uniprot_id: P43577
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: Alliance_Imported
  text: Evolutionarily conserved glucosamine-6-phosphate acetyltransferase; required
    for multiple cell cycle events including passage through START, DNA synthesis,
    and mitosis; involved in UDP-N-acetylglucosamine synthesis, forming GlcNAc6P from
    AcCoA; serotonin N‐acetyltransferase (SNAT)-like homolog that catalyzes the in
    vitro conversion of serotonin to N-acetylserotonin (NAS), and 5‐methoxytryptamine
    (5-MT) to melatonin, linking this N‐acetyltransferase to melatonin biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/GNA1
  source_id: SGD:S000001877
- source: Alliance_Automated
  text: Enables aralkylamine N-acetyltransferase activity and glucosamine 6-phosphate
    N-acetyltransferase activity. Involved in UDP-N-acetylglucosamine biosynthetic
    process. Located in cytoplasm and nucleus. Used to study cancer and keratosis
    follicularis spinulosa decalvans. Human ortholog(s) of this gene implicated in
    bone development disease. Orthologous to human GNPNAT1 (glucosamine-phosphate
    N-acetyltransferase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GNA1
  source_id: SGD:S000001877
