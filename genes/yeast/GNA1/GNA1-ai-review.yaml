  label: Saccharomyces cerevisiae S288C
description: 'GNA1 (PAT1) encodes glucosamine-6-phosphate N-acetyltransferase (EC 2.3.1.4), a small homodimeric
  GCN5-related N-acetyltransferase (GNAT) that transfers the acetyl group of acetyl-CoA to glucosamine
  6-phosphate to form N-acetylglucosamine 6-phosphate. This is the second step of the cytosolic hexosamine
  pathway leading to UDP-N-acetylglucosamine, the precursor of chitin, N-linked glycans and GPI anchors.
  GNA1 is essential: its loss gives the same lethal morphology as loss of the downstream enzymes Pcm1/Agm1
  and Qri1/Uap1. Gna1 is found in the cytoplasm and nucleus. Unlike bacterial GlmU, which combines the
  acetyltransferase and uridylyltransferase activities in one polypeptide, yeast uses separate essential
  enzymes. Recombinant Gna1 also acetylates serotonin and 5-methoxytryptamine in vitro, and has been proposed
  to contribute to yeast melatonin synthesis.'
