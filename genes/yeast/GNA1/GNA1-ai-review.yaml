suggested_questions:
- question: Is the serotonin/5-methoxytryptamine N-acetyltransferase activity of Gna1 physiologically
    relevant in vivo (does melatonin production depend on GNA1 at non-limiting GlcN6P acetylation), or
    is it a promiscuous side activity of the GNAT fold?
suggested_experiments:
- description: Measure melatonin and N-acetylserotonin in a strain carrying a GlcN6P-specific Gna1 variant
    (or a GNA1 shuffle with a heterologous GlcN6P acetyltransferase such as human GNPNAT1) fed with serotonin/5-MT.
