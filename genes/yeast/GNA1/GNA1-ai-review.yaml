  review:
    summary: 'IDA from Zhang et al. 2025: recombinant Gna1 acetylates serotonin and (preferentially) 5-methoxytryptamine
      in vitro, proposed as a yeast melatonin-pathway enzyme. The in vitro activity is accepted on the
      curator''s IDA, but its physiological significance in yeast is unproven (no in vivo melatonin data
      in the abstract, and Gna1 is a dedicated GlcN6P acetyltransferase essential for UDP-GlcNAc synthesis).
      Kept as a non-core, possibly promiscuous activity.'
