  review:
    summary: RCA from YeastPathways PANTOSYN2-PWY assigning Cab3 to the PPC decarboxylation step (EC 4.1.1.36).
      The step assignment is correct, but Cab3 alone is not an active decarboxylase; the activity resides
      in the Cab3-Hal3/Vhs3 heterotrimer, so 'contributes_to' (as in the experimental rows) is the accurate
      qualifier. YeastPathways should also list HAL3/SIS2 and VHS3 for this reaction.
    action: ACCEPT
    supported_by:
