    label: cytosol
  in_complex:
    id: GO:0071513
    label: phosphopantothenoylcysteine decarboxylase complex
  supported_by:
  - reference_id: PMID:19915539
    supporting_text: We demonstrate that while known eukaryotic PPCDCs are homotrimers, the active yeast
      enzyme is a heterotrimer that consists of Ykl088w and Hal3/Vhs3 monomers that separately provides
      two essential catalytic residues.
  - reference_id: PMID:26514574
    supporting_text: Instead, Hal3 and Vhs3 only contain the His, while Cab3 has the requisite Cys residue,
      in addition to a non-functional His
  - reference_id: PMID:19915539
    supporting_text: the essential roles of Ykl088w and the Hal3 and Vhs3 pair are complementary, cannot
      be interchanged and can be attributed to PPCDC-related functions.
suggested_questions:
- question: YeastPathways assigns the PPCDC step (EC 4.1.1.36) to CAB3 only; should HAL3/SIS2 and VHS3,
    which provide the catalytic His, be added to that reaction?
- question: Does Cab3's N-terminal scaffolding of the CoA-SPC (binding Cab2 and Cab5) provide substrate
    channelling or regulatory control of CoA flux?
suggested_experiments:
- description: Express Cab3 lacking the N-terminal extension (which mediates Cab2/Cab5 binding) and test
    whether it supports growth and CoA levels, to determine the physiological importance of CoA-SPC assembly
    versus PPCDC activity alone.
