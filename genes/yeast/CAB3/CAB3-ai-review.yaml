core_functions:
- description: Catalytic subunit of the heterotrimeric PPCDC (with Hal3/Sis2 and/or Vhs3) that decarboxylates
    4'-phosphopantothenoylcysteine to 4'-phosphopantetheine; Cab3 supplies the essential catalytic cysteine
    while Hal3/Vhs3 supply the catalytic histidine.
  contributes_to_molecular_function:
    id: GO:0004633
    label: phosphopantothenoylcysteine decarboxylase activity
