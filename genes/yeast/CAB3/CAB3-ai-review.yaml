  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000372091
  - UniProtKB:P0ABQ0
  - UniProtKB:Q69K55
  - UniProtKB:Q96CD2
  review:
    summary: IBA (PTN000372091; E. coli CoaBC, rice and human PPCDC). HFCD enzymes bind FMN at the trimer
      interface, and the yeast PD heterotrimers show bound flavin; Cab3 likely contributes to the shared
      flavin site, but whether Cab3 itself binds FMN (versus Hal3/Vhs3 contributing the binding residues)
      is not resolved.
