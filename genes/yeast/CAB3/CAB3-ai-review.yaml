id: P36076
gene_symbol: CAB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'CAB3 (YKL088W) encodes an essential subunit of the unusual heterotrimeric phosphopantothenoylcysteine
  decarboxylase (PPCDC) of S. cerevisiae, which converts 4''-phosphopantothenoylcysteine to 4''-phosphopantetheine
  (step 3 of CoA biosynthesis). Cab3 belongs to the HFCD (homo-oligomeric flavin-containing Cys decarboxylase)
  superfamily but, unlike homotrimeric PPCDCs elsewhere, the yeast enzyme is a heterotrimer of Cab3 with
  the moonlighting proteins Hal3/Sis2 and/or Vhs3: the catalytic His is supplied by Hal3 or Vhs3, whereas
  Cab3 supplies the essential catalytic Cys (its own His is non-functional), and the flavin cofactor binds
  at the subunit interface. Cab3 is not itself a Ppz1 regulator. Through its non-conserved N-terminal
  extension Cab3 self-associates and binds Cab2 and Cab5, acting as the scaffold of the ~330 kDa cytosolic
  CoA-synthesizing protein complex (CoA-SPC) that also contains Cab4.'
