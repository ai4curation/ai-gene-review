descriptions:
- source: UniProt
  text: Component of the phosphopantothenoylcysteine decarboxylase (PPCDC) involved
    in the coenzyme A synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36076
  source_id: P36076
- source: Alliance_Imported
  text: 'Subunit of PPCDC and CoA-SPC complexes involved in CoA biosynthesis; subunits
    of the phosphopantothenoylcysteine decarboxylase (PPCDC) complex are: Cab3p, Sis2p,
    Vhs3p, while the subunits of the CoA-synthesizing protein complex (CoA-SPC) are:
    Cab2p, Cab3p, Cab4p, and Cab5p as well as Sis2p and Vhs3p; null mutant lethality
    is complemented by E. coli coaBC'
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAB3
  source_id: SGD:S000001571
- source: Alliance_Automated
  text: Enables identical protein binding activity. Contributes to phosphopantothenoylcysteine
    decarboxylase activity. Involved in coenzyme A biosynthetic process. Located in
    cytoplasm. Part of CoA-synthesizing protein complex and phosphopantothenoylcysteine
    decarboxylase complex. Used to study dilated cardiomyopathy. Orthologous to human
    PPCDC (phosphopantothenoylcysteine decarboxylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAB3
  source_id: SGD:S000001571
