  label: Saccharomyces cerevisiae S288C
description: Ornithine decarboxylase (ODC, Spe1p, YKL184W), a cytoplasmic pyridoxal 5'-phosphate-dependent
  class-II (Orn/Lys/Arg) decarboxylase that converts L-ornithine to putrescine and CO2 (EC 4.1.1.17).
  This is the first and rate-limiting step of polyamine biosynthesis; putrescine is then aminopropylated
  to spermidine and spermine by Spe3 and Spe4 using decarboxylated S-adenosylmethionine from Spe2. spe1
  deletion mutants cannot make putrescine and require spermidine or spermine for growth. Activity is modulated
  about 200-fold by polyamine availability at a post-translational level, through antizyme (Oaz1)-mediated
  inhibition of homodimer assembly and ubiquitin-independent proteasomal degradation.
