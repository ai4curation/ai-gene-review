gene_symbol: SPE1
organism: yeast
uniprot_id: P08432
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the first and rate-limiting step of polyamine biosynthesis that
    converts ornithine into putrescine, which is the precursor for the polyamines,
    spermidine and spermine. Polyamines are essential for cell proliferation and are
    implicated in cellular processes, ranging from DNA replication to apoptosis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08432
  source_id: P08432
- source: Alliance_Imported
  text: Ornithine decarboxylase; catalyzes the first step in polyamine biosynthesis;
    degraded in a proteasome-dependent manner in the presence of excess polyamines;
    deletion decreases lifespan, and increases necrotic cell death and ROS generation
  source_type: curated
  url: https://www.yeastgenome.org/locus/SPE1
  source_id: SGD:S000001667
- source: Alliance_Automated
  text: Enables ornithine decarboxylase activity. Involved in putrescine biosynthetic
    process. Located in cytoplasm. Human ortholog(s) of this gene implicated in alopecia;
    disease of cellular proliferation; esophagus squamous cell carcinoma; hepatocellular
    carcinoma; and liver cirrhosis. Orthologous to several human genes including ODC1
    (ornithine decarboxylase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SPE1
  source_id: SGD:S000001667
fetch_date: '2026-11-01'
