id: P38784
gene_symbol: VMA22
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: VMA22 encodes a dedicated endoplasmic-reticulum-associated assembly factor
  for the vacuolar proton-translocating V-type ATPase. Vma22 is not a mature V-ATPase
  subunit. Instead, it associates with Vma12 in a stable ER membrane assembly complex
  that transiently contacts the newly synthesized Vph1/V0 sector subunit, stabilizing
  V0 assembly intermediates before export to the vacuole. In the yeast V0:Vma12-Vma22
  structure, Vma22 occupies the V0 subunit-d surface used by V1 subunit D in the mature
  enzyme, providing a steric checkpoint that blocks premature V1 attachment during
  ER-stage V0 assembly. Loss of VMA22 blocks V-ATPase assembly and activity and causes
  vacuolar acidification defects.
