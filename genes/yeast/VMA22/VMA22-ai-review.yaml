- id: PMID:36724250
  title: Structural basis of V-ATPase V(O) region assembly by Vma12p, 21p, and 22p.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed and full-text PMC cache verified. The cryo-EM study directly
      resolved yeast VO assembly intermediates bound to Vma12p and Vma22p, confirming
      the structural role of Vma12-Vma22p in V-ATPase assembly while still not supporting
      a generic unfolded-protein binding activity.
  findings:
  - statement: Vma12-Vma22p recruits V0 subunits during ER-stage assembly and prevents
      premature V1 association.
    supporting_text: Electron cryomicroscopy shows how the Vma12-22p complex recruits
      subunits a, e, and f to the rotor ring of VO while blocking premature binding
      of V1.
  - statement: The resolved Vma22p structure predicts that it blocks premature V1
      attachment to partially assembled V0 complexes in the ER.
    supporting_text: Thus, the structure of Vma22p suggests that it would block V1
      from binding subunit d, which would prevent premature attachment of V1 to partially
      assembled VO complexes in the ER membrane.
