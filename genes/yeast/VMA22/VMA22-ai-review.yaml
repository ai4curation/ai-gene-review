      interaction between Vma12p and subunit d and prevents premature attachment of
      the V1 complex to the partially assembled VO complex.
proposed_new_terms:
- proposed_name: V-ATPase V0 sector assembly factor activity
  proposed_definition: Binding to V-type ATPase V0-sector assembly intermediates during
    biogenesis of the vacuolar proton-transporting V-type ATPase complex, mediating
    contacts between the Vma12-Vma22 assembly complex and V0 subunits and blocking
    premature V1 binding until the V0 sector has assembled.
  justification: Vma22 has a clear molecular role as part of the ER-localized Vma12-Vma22
    assembly complex that transiently binds Vph1/V0-sector intermediates, but current
    GO terms capture only the biological process or the Vma12-Vma22 complex. Generic
    protein folding chaperone terms would overstate Vma22 as a general foldase rather
    than a V-ATPase assembly factor.
  supported_by:
  - reference_id: PMID:36724250
    supporting_text: During recruitment of subunits a, e, and f, Vma22p mediates the
      interaction between Vma12p and subunit d and prevents premature attachment of
      the V1 complex to the partially assembled VO complex.
suggested_questions:
- question: What function, if any, does the 35-residue disordered loop C-terminal
    to the Vma22p subunit-D-like core perform during Vma12-Vma22-dependent V0 assembly?
- question: Does Vma22 have any separable function outside the Vma12-Vma22 assembly
    complex, or is all detectable Vma22 activity complex-dependent?
- question: Which VMA22 isoform(s), if any, are functional in V-ATPase assembly, and
    do the alternative initiation products differ in stability or assembly-complex
    incorporation?
- question: Does amino-terminal tagging alter Vma22 isoform usage, ER association,
    or localization and account for the high-throughput nuclear signal?
suggested_experiments:
- description: Use structure-guided Vma22 mutants to disrupt Vma12 binding or Vph1
    interaction separately, then measure V0 assembly, Vph1 stability, and vacuolar
    acidification.
  experiment_type: genetics
- description: Reconstitute the Vma12-Vma22 complex with Vph1/V0 assembly intermediates
    and map transient contacts by crosslinking mass spectrometry or cryo-EM.
  experiment_type: biochemistry
- description: Test the UniProt alternative initiation isoforms for expression, ER
    membrane association, Vma12 binding, and complementation of vma22 deletion phenotypes.
  experiment_type: cell biology
