core_functions:
- description: Vma22 is a dedicated ER-associated V-ATPase assembly factor. In complex
    with Vma12, it transiently binds the Vph1/V0-sector assembly intermediate in the
    ER and occupies the V0 subunit-d site to block premature V1 attachment while stabilizing
    V0 assembly before the V-ATPase reaches the vacuole. Vma22 is therefore required
    for V-ATPase complex assembly and downstream vacuolar acidification, but it is
    not a mature V-ATPase subunit.
  proposed_molecular_function: V-ATPase V0 sector assembly factor activity
  directly_involved_in:
  - id: GO:0070072
    label: vacuolar proton-transporting V-type ATPase complex assembly
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  in_complex:
    id: GO:1990871
    label: Vma12-Vma22 assembly complex
  supported_by:
  - reference_id: PMID:7673216
    supporting_text: vma22 delta cells contain no V-ATPase activity due to a failure
      to assemble the enzyme complex.
  - reference_id: PMID:9660861
    supporting_text: Vma12p together with Vma22p forms an assembly complex that interacts
      with Vo subunits in the ER as they are being assembled before transport of the
      V-ATPase complex to the vacuole.
  - reference_id: file:yeast/VMA22/VMA22-deep-research-falcon.md
    supporting_text: '**VMA22 (P38784/YHR060W)** encodes **Vma22p**, an **ER-associated
      peripheral assembly factor** required for **V-ATPase V0-region biogenesis**.'
  - reference_id: PMID:36724250
