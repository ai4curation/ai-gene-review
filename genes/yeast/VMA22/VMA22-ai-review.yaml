  review:
    summary: The PANTHER/IBA unfolded protein binding annotation reflects transfer
      from assembly-factor biology but overstates Vma22 as a general unfolded-protein
      binding chaperone.
    action: MARK_AS_OVER_ANNOTATED
    reason: Vma22 acts in a dedicated Vma12-Vma22 ER assembly complex for the V-ATPase
      V0 sector, and the authors explicitly distinguish these assembly factors from
      general molecular chaperones. Their proposed model places a fully translocated
      and folded Vph1 client at the interaction step, while the experiments establish
      stabilization and assembly rather than client folding. Cryo-EM later resolved
      Vma22p at a defined V0 subunit-d site, blocking premature V1 attachment. GO:0051082
      is obsolete. GO:0044183 protein folding chaperone is not proposed because no
      assistance of protein folding was demonstrated.
