descriptions:
- source: UniProt
  text: Component of serine palmitoyltransferase (SPT), which catalyzes the committed
    step in the synthesis of sphingolipids, the condensation of serine with palmitoyl
    CoA to form the long chain base 3-ketosphinganine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25045
  source_id: P25045
- source: Alliance_Imported
  text: Component of serine palmitoyltransferase; responsible along with Lcb2p for
    the first committed step in sphingolipid synthesis, which is the condensation
    of serine with palmitoyl-CoA to form 3-ketosphinganine
  source_type: curated
  url: https://www.yeastgenome.org/locus/LCB1
  source_id: SGD:S000004911
- source: Alliance_Automated
  text: Enables serine C-palmitoyltransferase activity. Involved in sphingolipid biosynthetic
    process. Located in endoplasmic reticulum. Part of serine palmitoyltransferase
    complex. Used to study amyotrophic lateral sclerosis and hereditary sensory and
    autonomic neuropathy type 1A. Human ortholog(s) of this gene implicated in hereditary
    sensory and autonomic neuropathy type 1A and juvenile amyotrophic lateral sclerosis
    type 27. Orthologous to human SPTLC1 (serine palmitoyltransferase long chain base
    subunit 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LCB1
  source_id: SGD:S000004911
