id: P25045
gene_symbol: LCB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lcb1 (Tsc2/End8) is one of the two large subunits of serine palmitoyltransferase (SPT), the ER-membrane
  enzyme that condenses L-serine with palmitoyl-CoA to form 3-ketosphinganine, the committed and rate-limiting step
  of sphingolipid synthesis in Saccharomyces cerevisiae. Lcb1 and Lcb2 are homologous members of the PLP-dependent
  alpha-oxoamine synthase family and form an obligate heterodimer in which Lcb2 carries the PLP-binding lysine;
  each subunit is unstable without the other. Lcb1 is a multi-pass ER membrane protein whose second and third transmembrane
  segments are needed for stability and Lcb2 interaction. SPT associates with the small activator Tsc3, the negative
  regulators Orm1/Orm2 and the phosphoinositide phosphatase Sac1 in the SPOTS complex, through which TORC2-Ypk1
  signalling and Orm phosphorylation tune sphingolipid flux. LCB1 is essential; lcb1 mutants are long-chain-base
  auxotrophs. Lcb1 is the orthologue of human SPTLC1.
