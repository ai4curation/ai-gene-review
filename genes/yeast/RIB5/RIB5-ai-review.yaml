  label: Saccharomyces cerevisiae S288C
description: RIB5 (YBR256C) encodes riboflavin synthase (EC 2.5.1.9), the last enzyme of de novo riboflavin
  biosynthesis. It catalyses the unusual dismutation of two molecules of 6,7-dimethyl-8-ribityllumazine,
  transferring a four-carbon unit from one to the other to form riboflavin plus 5-amino-6-(D-ribitylamino)uracil,
  which is recycled to lumazine synthase (Rib4). Rib5 is a homotrimer of 25-kDa subunits, each containing
  two internally homologous lumazine-binding domains (donor and acceptor sites), homologous to the alpha
  subunit of bacterial riboflavin synthase. Deletion of RIB5 abolishes the activity and causes riboflavin
  auxotrophy.
