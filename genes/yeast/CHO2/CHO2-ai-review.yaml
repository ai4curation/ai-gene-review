    supporting_text: The membrane fraction obtained from the transformants carrying PEM1 only catalyzed
      the conversion of PE to phosphatidyl-N-monomethylethanolamine (PMME), the first step of the methylation
      pathway.
  - reference_id: PMID:2684666
    supporting_text: Thus, the PEM1-encoded methyltransferase was strictly specific to the first step
  - reference_id: file:yeast/CHO2/CHO2-uniprot.txt
