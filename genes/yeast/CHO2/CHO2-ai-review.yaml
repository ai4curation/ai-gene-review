suggested_questions:
- question: Is Cho2 enriched at specific ER subdomains (e.g. ER-mitochondria or ER-plasma membrane contact
    sites) where PE delivered from Psd1 is methylated?
suggested_experiments:
- description: Proximity labelling or contact-site-specific tethering of Cho2 combined with lipid flux
    measurements to determine where PE methylation occurs relative to mitochondrial PE synthesis.
