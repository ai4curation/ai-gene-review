id: P05374
gene_symbol: CHO2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CHO2 (PEM1) encodes phosphatidylethanolamine N-methyltransferase (PEMT, EC 2.1.1.17) of Saccharomyces
  cerevisiae, a large (869 aa) multi-pass ER membrane protein with two PEMT domains. Using S-adenosyl-L-methionine,
  it catalyses the first of the three sequential methylations that convert phosphatidylethanolamine (PE)
  to phosphatidylcholine (PC), producing phosphatidyl-N-monomethylethanolamine (PMME); the second and
  third methylations are performed mainly by the phospholipid methyltransferase Opi3/Pem2. This methylation
  pathway is the main route of PC synthesis when exogenous choline is absent; cho2 mutants have greatly
  reduced PC and elevated PE, and cho2 opi3 double mutants are choline auxotrophs. Reduced PE methylation
  also derepresses INO1, connecting Cho2 to inositol/phospholipid co-regulation, and depletion of PC in
  cho2 mutants triggers the unfolded protein response. CHO2 is repressed by inositol and choline.
