core_functions:
- description: ER-membrane PE N-methyltransferase catalysing the SAM-dependent first methylation of PE
    to PMME, the committed step of the PE methylation route to PC (Opi3 performs the subsequent methylations).
  molecular_function:
    id: GO:0004608
