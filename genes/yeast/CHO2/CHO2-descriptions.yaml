- source: UniProt
  text: Catalyzes the first step of the methylation pathway of phosphatidylcholine
    biosynthesis, the SAM-dependent methylation of phosphatidylethanolamine (PE) to
    phosphatidylmonomethylethanolamine (PMME). Preferentially converts di-C16:1 substrates.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P05374
  source_id: P05374
- source: Alliance_Imported
  text: Phosphatidylethanolamine methyltransferase (PEMT); catalyzes the first step
    in the conversion of phosphatidylethanolamine to phosphatidylcholine during the
    methylation pathway of phosphatidylcholine biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/CHO2
  source_id: SGD:S000003389
- source: Alliance_Automated
  text: Enables phosphatidylethanolamine N-methyltransferase activity. Involved in
    phosphatidylcholine biosynthetic process. Located in endoplasmic reticulum membrane.
