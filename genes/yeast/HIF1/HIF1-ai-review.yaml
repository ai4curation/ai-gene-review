core_functions:
- description: Nuclear H3-H4 histone chaperone subunit of HAT-B (NuB4). Hif1 binds Hat2 directly and carries
    newly synthesized H3-H4, with H4 acetylated by Hat1, towards deposition; it promotes nucleosome assembly
    in vitro with a cofactor and contributes to chromatin reassembly after DNA double-strand break repair.
    It does not regulate Hat1 catalysis.
