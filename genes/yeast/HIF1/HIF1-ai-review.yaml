id: Q12373
gene_symbol: HIF1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Hif1 (Hat1-interacting factor 1, YLL022C) is a non-catalytic histone chaperone of the NASP/Sim3
  family of interrupted tetratricopeptide-repeat proteins. It is the third subunit of the nuclear form
  of the type B histone acetyltransferase (HAT-B, also called NuB4), joining the catalytic subunit Hat1
  through a direct contact with the WD40 subunit Hat2. Hif1 binds histones H3 and H4 and associates in
  vivo with newly synthesized H4 acetylated by Hat1; it can promote histone deposition onto DNA in vitro
  only together with a cellular extract. It does not regulate Hat1 catalytic activity. Hif1 is mainly
  nuclear and is recruited, with Hat1, to chromatin next to a DNA double-strand break, where loss of Hif1
  impairs chromatin reassembly after repair in sensitized backgrounds. Deletion is viable; hif1 mutants
  show telomeric silencing defects similar to hat1 mutants and are sensitive to histone H3 overexpression.
  Structural studies show Hif1 binds the H3-H4 tetramer and, in vitro, the H2A-H2B dimer by distinct,
  mutually exclusive modes.
