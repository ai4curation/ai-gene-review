- term:
    id: GO:0006334
    label: nucleosome assembly
  evidence_type: IDA
  original_reference_id: PMID:15099519
  qualifier: involved_in
  review:
    summary: Hif1 promotes histone deposition onto DNA in vitro, together with a yeast extract.
    action: ACCEPT
    reason: Hif1 acts as a chromatin assembly factor in a plasmid supercoiling assay, though only in the
      presence of a yeast cytosolic extract; the cooperating activity was later traced to RNA (PMID:25072697).
      In vivo, Hif1 contributes to chromatin reassembly after double-strand break repair (PMID:21454479).
      As a histone chaperone it does part of the work of nucleosome assembly (carrying H3-H4), which meets
      the participation test. Core process.
    supported_by:
    - reference_id: PMID:15099519
      supporting_text: Hif1p is also a chromatin assembly factor, promoting the deposition of histones
        in the presence of a yeast cytosolic extract.
    - reference_id: PMID:25072697
      supporting_text: While not capable of depositing histones onto DNA on its own, Hif1p can act in
        conjunction with a yeast cytosolic extract to assemble nucleosomes onto a relaxed circular plasmid.
- term:
    id: GO:0031509
    label: subtelomeric heterochromatin formation
  evidence_type: IDA
  original_reference_id: PMID:15099519
  qualifier: involved_in
  review:
    summary: hif1 deletion impairs telomeric silencing like hat1 deletion.
    action: KEEP_AS_NON_CORE
    reason: hif1 and hat1 deletions cause similar telomeric silencing defects, and the GOA rows rest mainly
      on genetic interaction data, consistent with the effect being seen in sensitized backgrounds (for
      HAT-B, histone H3 N-terminal tail mutations). Hif1 is a histone chaperone that supplies or deposits
      new H3-H4; it is not known to be a structural component of silent chromatin, so its contribution
      to subtelomeric heterochromatin formation is plausibly indirect, through histone supply. Kept as
      a real but non-core process.
    supported_by: &id003
    - reference_id: PMID:15099519
      supporting_text: hif1Delta and hat1Delta strains display similar defects in telomeric silencing
        and DNA double-strand break repair
    - reference_id: PMID:14761951
      supporting_text: similarly to Hat1, Hif1 influences telomeric silencing
