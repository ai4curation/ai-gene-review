  label: Saccharomyces cerevisiae S288C
description: 'Met8p is a bifunctional homodimeric enzyme that completes siroheme biosynthesis: it oxidises
  precorrin-2 to sirohydrochlorin using NAD+ (precorrin-2 dehydrogenase, EC 1.3.1.76) and then inserts
  ferrous iron into sirohydrochlorin to form siroheme (sirohydrochlorin ferrochelatase, EC 4.99.1.4).
  Both reactions occur in a single active site between the N-terminal NAD-binding domain and the dimer-interface
  domain, with the invariant Asp141 required for both. Siroheme is the prosthetic group of sulfite reductase,
  so met8 mutants cannot assimilate sulfate and require methionine. Met8p acts after Met1p (uroporphyrinogen
  III methyltransferase); together they replace the multifunctional bacterial CysG.'
