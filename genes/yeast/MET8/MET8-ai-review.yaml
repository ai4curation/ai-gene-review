- term:
    id: GO:0004325
    label: protoporphyrin ferrochelatase activity
  evidence_type: IDA
  original_reference_id: PMID:11980703
  qualifier: enables
  review:
    summary: IDA attributed to the Met8p structure paper, whose full text is cached. That paper assays
      chelatase activity only with sirohydrochlorin (using Co2+ as a surrogate for Fe2+) and notes Met8p
      has no structural similarity to protoporphyrin IX ferrochelatase (HemH); protoporphyrin IX was not
      a substrate tested. The activity demonstrated is sirohydrochlorin ferrochelatase, so the term protoporphyrin
      ferrochelatase (protoheme formation, done in yeast by Hem15p) is the wrong child of ferrochelatase.
    action: MODIFY
    reason: Full text shows the chelatase substrate is sirohydrochlorin, not protoporphyrin IX.
    proposed_replacement_terms:
    - &id008
      id: GO:0051266
      label: sirohydrochlorin ferrochelatase activity
    supported_by:
    - &id002
      reference_id: PMID:11980703
      supporting_text: The chelatase activity was assayed by incubating sirohydrochlorin with enzyme and
        cobalt, since cobalt is more stable than ferrous iron
    - &id001
      reference_id: PMID:11980703
      supporting_text: There is no structural similarity between any region of Met8p and the known structures
        of the anaerobic cobalt chelatase, CbiK, or protoporphyrin IX ferrochelatase (HemH)
    - &id004
      reference_id: PMID:11980703
      supporting_text: Met8p is a bifunctional enzyme that carries out both of these reactions.
