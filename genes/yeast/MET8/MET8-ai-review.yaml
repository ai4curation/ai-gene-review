    summary: 'IMP (Raux et al. 1999): met8 mutants are defective in sulfate assimilation because Met8p
      completes siroheme, the prosthetic group of sulfite reductase. Met8p supplies a cofactor rather
      than performing a sulfate-assimilation step.'
