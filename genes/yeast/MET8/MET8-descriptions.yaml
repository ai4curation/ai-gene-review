descriptions:
- source: UniProt
  text: Catalyzes the conversion of precorrin-2 into siroheme. This reaction consist
    of the NAD-dependent oxidation of precorrin-2 into sirohydrochlorin and its subsequent
    ferrochelation into siroheme.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P15807
  source_id: P15807
- source: Alliance_Imported
  text: Bifunctional dehydrogenase and ferrochelatase; involved in the biosynthesis
    of siroheme, a prosthetic group used by sulfite reductase; required for sulfate
    assimilation and methionine biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/MET8
  source_id: SGD:S000000417
- source: Alliance_Automated
  text: Enables precorrin-2 dehydrogenase activity and sirohydrochlorin ferrochelatase
    activity. Involved in siroheme biosynthetic process and sulfate assimilation.
    Predicted to be active in cytosol.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MET8
  source_id: SGD:S000000417
