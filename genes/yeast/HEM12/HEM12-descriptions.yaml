gene_symbol: HEM12
organism: yeast
uniprot_id: P32347
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the sequential decarboxylation of four acetate groups of uroporphyrinogen-III
    (octacarboxyporphyrin) to yield coproporphyrinogen-III (tetracarboxyporphyrin)
    with the formation of intermediate hepta-, hexa- and penta-carboxylate porphyrinogens
    in the heme biosynthesis pathway. Acts on a number of porphyrinogens, but only
    coproporphyrinogen III can ultimately be converted to heme.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32347
  source_id: P32347
- source: Alliance_Imported
  text: Uroporphyrinogen decarboxylase; catalyzes the fifth step in the heme biosynthetic
    pathway; localizes to both the cytoplasm and nucleus; a hem12 mutant has phenotypes
    similar to patients with porphyria cutanea tarda
  source_type: curated
  url: https://www.yeastgenome.org/locus/HEM12
  source_id: SGD:S000002454
- source: Alliance_Automated
  text: Enables uroporphyrinogen decarboxylase activity. Involved in heme biosynthetic
    process. Located in cytoplasm. Is active in cytosol. Used to study porphyria cutanea
    tarda. Human ortholog(s) of this gene implicated in porphyria cutanea tarda. Orthologous
    to human UROD (uroporphyrinogen decarboxylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HEM12
  source_id: SGD:S000002454
