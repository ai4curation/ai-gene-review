  review:
    summary: IPI with Rsp5 (P39940) from a proteome-wide screen of yeast WW-domain interactions (Hesselberth
      et al. 2006); UniProt/IntAct record two Hem12-Rsp5 experiments. Hem12 is not discussed in the main
      text, and 'protein binding' conveys nothing about Hem12 function. A possible Rsp5 (ubiquitin ligase)
      interaction would make Hem12 a substrate, not a binding-function protein.
    action: REMOVE
    reason: Uninformative 'protein binding' from an interaction screen with no functional consequence
      shown and no more informative MF supported; removal does not imply the Rsp5 interaction is false.
    supported_by:
