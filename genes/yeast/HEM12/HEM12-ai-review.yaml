  label: Saccharomyces cerevisiae S288C
description: Uroporphyrinogen decarboxylase (UROD; EC 4.1.1.37) of Saccharomyces cerevisiae, the fifth
  enzyme of heme biosynthesis. Hem12 sequentially removes the four acetate carboxyl groups of uroporphyrinogen
  III (via hepta-, hexa- and penta-carboxylate intermediates) to form coproporphyrinogen III, requiring
  no cofactor; it also acts on uroporphyrinogen I, although only the III isomer leads to heme. The purified
  yeast enzyme behaves as a monomer of about 38 kDa with nanomolar Km values. hem12 mutants are heme-deficient
  and accumulate uroporphyrin ('uroporphyric' mutants), and mutant alleles define a single active centre.
  Hem12 is a soluble cytoplasmic enzyme (GFP also detects some nuclear signal).
