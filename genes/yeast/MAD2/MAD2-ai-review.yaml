core_functions:
- description: >-
    Cdc20-binding HORMA-domain subunit of the mitotic checkpoint complex (Mad2-Mad3-Bub3-Cdc20)
    that binds APC/C-Cdc20 and inhibits its ubiquitin ligase activity toward securin (Pds1)
    and mitotic cyclins, delaying the metaphase-to-anaphase transition until all kinetochores
    are attached; the Mad2-Cdc20 subcomplex also accumulates during mitosis.
  molecular_function:
    id: GO:1990948
    label: ubiquitin ligase inhibitor activity
