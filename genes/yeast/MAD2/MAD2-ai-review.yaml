proposed_new_terms: []
suggested_questions:
- question: >-
    Which SAC-activating signal is generated during break-induced replication and during the
    Topo II checkpoint, given that neither involves failed biorientation or loss of spindle
    tension: is Mad1-Mad2 recruited to kinetochores of the affected chromosome, or is Mad2
    activated through a kinetochore-independent route?
- question: >-
    What is the physiological division of labor between the abundant kinetochore-independent
    Mad2-Cdc20 subcomplex and the stoichiometrically small MCC in budding yeast, and does the
    Mad2-Cdc20 subcomplex inhibit APC/C on its own in vivo?
- question: >-
    Does the nuclear-pore-associated Mad1-Mad2 pool contribute to checkpoint signaling (e.g. as
    a source of pre-formed Mad2-Cdc20) or only serve as a reservoir, and how is Mad2 released
    from pores upon checkpoint activation?
suggested_experiments:
- description: >-
    Live-cell imaging of Mad1-GFP and Mad2-GFP recruitment to kinetochores of the broken
    chromosome versus intact chromosomes during a single-ended DSB undergoing BIR, combined
    with kinetochore-tethered Mad1 and separation-of-function mad2 alleles that retain Mad1
    binding but cannot bind Cdc20.
  hypothesis: >-
    The SAC contribution to prolonged G2/M arrest during BIR is generated by canonical
    Mad1-Mad2 templating at kinetochores of the damaged chromosome, not by a novel
    kinetochore-independent Mad2 activation route.
- description: >-
    Quantitative reconstitution of APC/C-Cdc20 inhibition with purified yeast Mad2-Cdc20
    subcomplex, Mad3-Bub3, and MCC at physiological stoichiometries measured in vivo, using
    securin and Clb2 ubiquitination readouts.
  hypothesis: >-
    The Mad2-Cdc20 subcomplex alone is a weak APC/C inhibitor and the MCC is the effective
    inhibitor, explaining why cells maintain a large Mad2-Cdc20 pool without arresting.
