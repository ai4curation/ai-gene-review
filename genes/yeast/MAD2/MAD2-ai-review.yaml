- term:
    id: GO:0007026
    label: negative regulation of microtubule depolymerization
  evidence_type: IPI
  original_reference_id: PMID:42353152
  qualifier: involved_in
  supporting_entities:
  - SGD:S000028605
  review:
    summary: >-
      Schuyler et al. observed by negative-stain EM that recombinant Tyc1p (the yeast p31comet
      homolog) forms comet-shaped polymers on Taxol-stabilized microtubules, and that Tyc1p
      polymers, including those formed in the presence of purified Mad2p bound to a
      Cdc20-derived Mad2-binding peptide, suppress microtubule depolymerization induced by
      ice-cold CaCl2 in vitro. Mad2p plus peptide alone gave no protection.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The full text is cached. The activity is Tyc1-dependent: Tyc1p polymers alone suppress
      depolymerization, Mad2p plus the DQ36 peptide alone does not, and the paper's title and
      conclusion attribute the effect to Tyc1p polymers. Mad2 was present as a Tyc1 ligand in
      an in vitro EM assay with purified proteins and Taxol-stabilized microtubules; there is no
      in vivo evidence that Mad2 regulates microtubule dynamics, and its established function is
      checkpoint signaling. Annotating Mad2 as involved in negative regulation of microtubule
      depolymerization over-extends this observation. Not REMOVE, because the observation is
      genuine and Mad2 was assayed.
    supported_by:
    - reference_id: PMID:42353152
      supporting_text: >-
        Tyc1p polymers that were formed in the presence of Mad2p in association with a
        Mad2-binding motif peptide were able to suppress Taxol-stabilized microtubule
        depolymerization that was induced by exposure to ice-cold CaCl2.
      reference_section_type: ABSTRACT
    - reference_id: PMID:42353152
      supporting_text: >-
        In conclusion, yeast Tyc1p forms polymers that can suppress Taxol-stabilized
        microtubule depolymerization, potentially yielding an insight into a
        microtubule-associated function for human p31comet.
      reference_section_type: ABSTRACT
