    supporting_text: >-
      Studies with purified proteins revealed that Mad2 and Mad3-Bub3 synergize to effectively
      inhibit securin ubiquitination, while at the same time promoting Cdc20 autoubiquitination.
    reference_section_type: DISCUSSION
  - reference_id: PMID:9461437
