description: >-
  Mad2 is the HORMA-domain spindle assembly checkpoint (SAC) protein of budding yeast, a
  196-residue non-enzymatic conformational switch encoded by YJL030W. The MAD genes were
  discovered in S. cerevisiae as mutants that fail to arrest in mitosis when the spindle is
  disrupted. Mad2 exists in an open (O-Mad2) and a closed (C-Mad2) conformation. It forms a
  tight, cell-cycle-independent complex with Mad1; Mps1-phosphorylated Bub1 recruits
  Mad1-Mad2 heterotetramers to unattached kinetochores, where Mad1-bound C-Mad2 templates
  the conversion of soluble O-Mad2 into C-Mad2 that wraps its safety-belt around the Cdc20
  Mad2-interacting motif. Cdc20-bound C-Mad2 associates with Mad3 and Bub3 to form the
  mitotic checkpoint complex (MCC; Mad2-Mad3-Bub3-Cdc20), and a more abundant Mad2-Cdc20
  subcomplex also accumulates during mitosis. The MCC binds APC/C-Cdc20 and inhibits its
  ubiquitin ligase activity toward securin (Pds1) and mitotic cyclins while stimulating
  Cdc20 autoubiquitination, thereby delaying the metaphase-to-anaphase transition and
  mitotic exit until every kinetochore is bioriented. Because budding yeast undergoes a
  closed mitosis, Mad2 acts within the nucleus; during an unperturbed cycle much of the
  Mad1-Mad2 pool resides at nuclear pore complexes and redistributes to kinetochores upon
  checkpoint activation. MAD2 is dispensable for growth of an unperturbed cell cycle but is
  required for viability when spindle assembly is compromised. Related checkpoint roles
  include the Topo II-dependent G2/M delay, the SAC-mediated prolongation of G2/M arrest
  that gives slow DNA repair processes time to complete, homolog biorientation in
  meiosis I, and the meiotic spindle checkpoint.
existing_annotations:
- term:
    id: GO:0000727
    label: double-strand break repair via break-induced replication
  evidence_type: IMP
  original_reference_id: PMID:41398407
  qualifier: involved_in
  review:
    summary: >-
      A genome-wide screen found that break-induced replication (BIR) is reduced in mad2
      (and bub1, bub3) deletion strains. The authors show that the SAC prolongs the
      DNA-damage-checkpoint-induced G2/M arrest, giving the slow BIR process enough time to
      complete before nuclear division; SAC mutants exit arrest early and BIR is interrupted.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The full text is cached and the phenotype is real, but Mad2 does none of the work of
      BIR itself: it performs no strand invasion, D-loop formation or DNA synthesis. Its
      contribution is checkpoint signaling that delays nuclear division, which BIR depends on
      for time. This is necessity evidence rather than participation, and the paper itself
      frames the SAC's role as prolonging G2/M arrest. Annotating Mad2 as involved_in the
      repair process over-extends the term; the checkpoint contribution is already captured
      by the mitotic checkpoint signaling terms (GO:0007094 and the GO:0044774 IGI row), and
      the paper notes that the mechanism activating the SAC during BIR is unknown.
    supported_by:
    - reference_id: PMID:41398407
      supporting_text: >-
        while DNA damage and spindle checkpoint machineries are both required to delay
        nuclear division and provide adequate time for BIR to complete
      reference_section_type: ABSTRACT
    - reference_id: PMID:41398407
      supporting_text: >-
        We discovered that DDC-induced cell cycle arrest alone is insufficient for BIR
        success; rather, successful BIR completion requires the SAC to prolong G2/M arrest.
      reference_section_type: DISCUSSION
    - reference_id: PMID:41398407
      supporting_text: >-
        Therefore, an alternative mechanism may activate the SAC during BIR.
      reference_section_type: DISCUSSION
