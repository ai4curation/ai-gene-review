  - WB:WBGene00003161
  review:
    summary: >-
      PAINT inference that Mad2 acts at the kinetochore, seeded by experimental kinetochore
      localization across the Mad2 family including S. cerevisiae MAD2 itself. In budding
      yeast, unattached kinetochores recruit Mad1-Mad2 heterotetramers via Mps1-phosphorylated
      Bub1 bound to Spc105, and this kinetochore-localized Mad1-Mad2 catalyzes the Mad2
      conformational transition that seeds MCC assembly.
    action: ACCEPT
    reason: >-
      The kinetochore is the site where Mad2 is activated and where the checkpoint signal is
      generated; the placement of this function at the family root is consistent with
      experimental evidence in budding yeast, fission yeast, metazoans and plants. The target
      appearing in its own WITH/FROM list reflects the yeast experimental annotations that
      helped place the ancestral node and is expected.
    supported_by:
    - reference_id: PMID:27170178
      supporting_text: >-
        Spc105 then recruits the Bub3-Bub1 and Mad1-Mad2 complexes, which produce the
        inhibitory signal that arrests cell division.
      reference_section_type: ABSTRACT
    - reference_id: PMID:27170178
      supporting_text: >-
        The kinetochore-localized Mad1-Mad2 then catalyzes a conformational transition in
        Mad2 and paves the way for the assembly of the mitotic checkpoint complex.
      reference_section_type: INTRODUCTION
