- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      SGD placeholder recording that no molecular function had been assigned. Mad2 is not an
      enzyme, but its molecular activity is well characterized: as the Cdc20-binding subunit of
      the MCC it inhibits the ubiquitin ligase activity of APC/C-Cdc20. Reconstitution with
      purified budding yeast components showed that Mad2 alone inhibits Cdc20 binding to the
      APC/C and that Mad2 synergizes with Mad3-Bub3 to inhibit securin ubiquitination.
    action: MODIFY
    reason: >-
      An informative molecular function is supported by direct biochemical evidence in
      S. cerevisiae (PMID:22940250), so the ND placeholder should be replaced by ubiquitin
      ligase inhibitor activity (GO:1990948), exercised as part of the MCC. The
      Mad1-templated O-Mad2 to C-Mad2 conformational conversion that generates the
      Cdc20-binding form is a second, upstream activity, but it is best captured by the
      MAD1-MAD2 complex and kinetochore terms rather than by an additional MF term.
    proposed_replacement_terms:
    - id: GO:1990948
      label: ubiquitin ligase inhibitor activity
    supported_by:
    - reference_id: PMID:22940250
      supporting_text: >-
        We found that Mad2 alone inhibited Cdc20 binding and autoubiquitination.
      reference_section_type: RESULTS
    - reference_id: PMID:22940250
      supporting_text: >-
        Studies with purified proteins revealed that Mad2 and Mad3-Bub3 synergize to
        effectively inhibit securin ubiquitination, while at the same time promoting Cdc20
        autoubiquitination.
      reference_section_type: DISCUSSION
