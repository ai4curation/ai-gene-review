    overall_notes: 'Correct: central SAC component recruited by Mad1, relayed into
      the MCC, inhibits APC/C-Cdc20. Omits the open-closed conformational switch.'
- source: Alliance_Imported
  text: Component of the spindle-assembly checkpoint complex; delays onset of anaphase
    in cells with defects in mitotic spindle assembly; forms a complex with Mad1p;
    regulates APC/C activity during prometaphase and metaphase of meiosis I; gene
    dosage imbalance between MAD1 and MAD2 leads to chromosome instability
  source_type: curated
