gene_symbol: MAD2
organism: yeast
uniprot_id: P40958
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Central component of the spindle assembly checkpoint which is a feedback control
    that prevents cells with incompletely assembled spindles from leaving mitosis.
    Thought to be recruited to unattached kinetochores by MAD1. During checkpoint
    activity, MAD2 is relayed from the MAD1-MAD2 complex to the mitotic checkpoint
    complex (MCC). MCC and presumably the MAD2-CDC20 subcomplex inhibit the ubiquitin
    ligase activity of the anaphase promoting complex/cyclosome (APC/C) by preventing
    its activation by CDC20.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40958
  source_id: P40958
- source: Alliance_Imported
  text: Component of the spindle-assembly checkpoint complex; delays onset of anaphase
    in cells with defects in mitotic spindle assembly; forms a complex with Mad1p;
    regulates APC/C activity during prometaphase and metaphase of meiosis I; gene
    dosage imbalance between MAD1 and MAD2 leads to chromosome instability
  source_type: curated
  url: https://www.yeastgenome.org/locus/MAD2
  source_id: SGD:S000003567
- source: Alliance_Automated
  text: Involved in several processes, including double-strand break repair via break-induced
    replication; negative regulation of cell cycle phase transition; and positive
    regulation of protein autoubiquitination. Located in kinetochore. Part of mitotic
    checkpoint complex, CDC20-MAD2 subcomplex. Is active in microtubule cytoskeleton.
    Orthologous to human MAD2L1 (mitotic arrest deficient 2 like 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MAD2
  source_id: SGD:S000003567
