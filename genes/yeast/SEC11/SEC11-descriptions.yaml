descriptions:
- source: UniProt
  text: Catalytic component of the signal peptidase complex (SPC) which catalyzes
    the cleavage of N-terminal signal sequences from nascent proteins as they are
    translocated into the lumen of the endoplasmic reticulum (PubMed:10206957, PubMed:11058593,
    PubMed:2644273, PubMed:7615509). Specifically cleaves N-terminal signal peptides
    that contain a hydrophobic alpha-helix (h-region) shorter than 18-20 amino acids
    (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P15367
