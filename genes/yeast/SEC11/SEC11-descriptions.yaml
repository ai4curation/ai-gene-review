descriptions:
- source: UniProt
  text: Catalytic component of the signal peptidase complex (SPC) which catalyzes
    the cleavage of N-terminal signal sequences from nascent proteins as they are
    translocated into the lumen of the endoplasmic reticulum (PubMed:10206957, PubMed:11058593,
    PubMed:2644273, PubMed:7615509). Specifically cleaves N-terminal signal peptides
    that contain a hydrophobic alpha-helix (h-region) shorter than 18-20 amino acids
    (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P15367
  source_id: P15367
- source: Alliance_Imported
  text: 18kDa catalytic subunit of the Signal Peptidase Complex (SPC); the Signal
    Peptidase Complex cleaves the signal sequence of proteins targeted to the endoplasmic
    reticulum; other members are Spc1p, Spc2p, Spc3p, and Sec11p
  source_type: curated
  url: https://www.yeastgenome.org/locus/SEC11
  source_id: SGD:S000001461
- source: Alliance_Automated
  text: Enables signal peptidase activity. Involved in protein maturation and protein
    targeting to ER. Located in endoplasmic reticulum membrane. Part of signal peptidase
    complex. Orthologous to several human genes including SEC11A (SEC11 homolog A,
    signal peptidase complex subunit) and SEC11C (SEC11 homolog C, signal peptidase
    complex subunit).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SEC11
  source_id: SGD:S000001461
