id: P15367
gene_symbol: SEC11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SEC11 encodes the catalytic subunit of the Saccharomyces cerevisiae
  endoplasmic-reticulum signal peptidase complex. Sec11 is an integral ER membrane
  serine protease that partners with Spc1, Spc2, and the essential Spc3 subunit
  to cleave N-terminal signal peptides from secretory and membrane-protein
  precursors during or after their translocation into the ER lumen.
