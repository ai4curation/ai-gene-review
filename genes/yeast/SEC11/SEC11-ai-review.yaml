- id: PMID:10206957
  title: The catalytic mechanism of endoplasmic reticulum signal peptidase appears
    to be distinct from most eubacterial signal peptidases.
  findings:
  - statement: Active-site mutagenesis showed that Sec11 supplies residues needed
      for yeast ER signal peptidase activity.
    supporting_text: Instead, a serine, histidine, and two aspartic acids are important for signal peptidase activity by the Sec11p subunit of the yeast signal peptidase complex.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-cached abstract supports the catalytic Sec11 signal
      peptidase mechanism asserted in this review.
- id: PMID:11058593
  title: Signal peptidase and oligosaccharyltransferase interact in a sequential and
    dependent manner within the endoplasmic reticulum.
  findings:
  - statement: The signal peptides of prepro-alpha-factor and preinvertase must be
      removed in the yeast ER before nearby N-glycosylation sites are efficiently
      used.
    supporting_text: We demonstrate that the signal peptides of prepro-alpha-factor and preinvertase must be cleaved before Asn-X-Ser/Thr acceptor tripeptides located near the signal peptides of these precursors can be efficiently glycosylated within the endoplasmic reticulum of the yeast Saccharomyces cerevisiae.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The abstract directly supports ER-local signal-peptide cleavage
      by yeast SPC, although the paper is mainly about coupling to OST.
- id: PMID:16093310
  title: Large-scale identification of yeast integral membrane protein interactions.
  findings:
  - statement: The study used modified split-ubiquitin screening to map
      interactions among S. cerevisiae integral membrane proteins.
    supporting_text: We carried out a large-scale screen to identify interactions between integral membrane proteins of Saccharomyces cerevisiae by using a modified split-ubiquitin technique.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The identifier resolves to the intended high-throughput
      membrane interactome paper; its only seeded SEC11 use is a generic
      protein binding row that this review removes.
- id: PMID:1846444
  title: Yeast signal peptidase contains a glycoprotein and the Sec11 gene product.
  findings:
  - statement: Purified yeast microsomal signal peptidase is a membrane complex
      that contains Sec11 as its 18-kDa chain.
    supporting_text: Partially purified yeast microsomal signal peptidase appears to be a complex of four polypeptides of 13, 18, 20, and 25 kDa. The 18-kDa chain is the product of the Sec11 gene, which is necessary for signal peptidase activity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC identify the intended primary paper for Sec11
      membership in yeast microsomal signal peptidase.
- id: PMID:2644273
  title: Solubilization and characterization of yeast signal peptidase.
  findings:
  - statement: Yeast signal peptidase is an integral membrane enzyme that removes
      the signal peptide from prepro-alpha-factor in vitro.
    supporting_text: Radiosequencing of the cleaved substrate revealed that the enzyme removed the signal peptide.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Yeast signal peptidase resists carbonate extraction, consistent
      with integral membrane association.
    supporting_text: The membrane association of yeast signal peptidase is resistant to carbonate extraction, indicating that it is an integral membrane protein.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: This is the intended biochemical characterization of yeast
      microsomal signal peptidase activity and membrane association.
- id: PMID:3283143
  title: SEC11 is required for signal peptide processing and yeast cell growth.
  findings:
  - statement: Temperature-sensitive sec11 mutant cells accumulate
      core-glycosylated invertase and acid phosphatase precursors that retain
      their signal peptides.
    supporting_text: At 37 degrees C, the restrictive growth temperature, sec11 cells accumulate core-glycosylated forms of invertase and acid phosphatase, each retaining an intact signal peptide.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Genetic analysis showed that SEC11 is authentic and essential.
    supporting_text: Genetic analysis indicates that the complementing clone contains the authentic SEC11 gene, and that a null mutation at the SEC11 locus is lethal.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: This classic primary paper directly establishes SEC11's
      requirement for signal peptide processing in yeast.
- id: PMID:37968396
  title: The social and structural architecture of the yeast protein interactome.
  findings:
  - statement: The study mapped S. cerevisiae protein interactions using
      GFP-tagged affinity enrichment and two-dimensional AP-MS analysis.
    supporting_text: Here we develop a sensitive high-throughput method using highly reproducible affinity enrichment coupled to mass spectrometry combined with a quantitative two-dimensional analysis strategy to comprehensively map the interactome of Saccharomyces cerevisiae.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: This is the intended high-throughput AP-MS interactome paper;
      it is useful background for an IntAct SEC11-Spc3 edge but not for a
      specific SEC11 molecular-function annotation.
- id: PMID:8910564
  title: Structurally related Spc1p and Spc2p of yeast signal peptidase complex are
    functionally distinct.
  findings:
  - statement: Spc1 and Spc2 are noncatalytic yeast SPC subunits with distinct
      functions.
    supporting_text: These results indicate that although both Spc1p and Spc2p are noncatalytic, they are functionally distinct.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The abstract supports the noncatalytic Spc1/Spc2 subunit
      context for SEC11-containing yeast SPC.
- id: PMID:9148931
  title: The yeast SPC22/23 homolog Spc3p is essential for signal peptidase activity.
  findings:
  - statement: Spc3 is the fourth subunit of yeast SPC and is essential for signal
      peptidase activity.
    supporting_text: Depletion of SPC3 leads to accumulation of precursors of secretory proteins in vivo and to the loss of the signal peptidase activity in vitro.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: This is direct primary evidence for the essential Sec11 partner
      Spc3 and for yeast SPC subunit composition.
- id: PMID:39565596
  title: Spc2 modulates substrate- and cleavage site-selection in the yeast signal
    peptidase complex.
  findings:
  - statement: Loss or mutation of Spc2 compromises yeast SPC substrate
      discrimination and cleavage-site choice.
    supporting_text: Our data show that discrimination between substrates and identification of the cleavage site by SPC is compromised when Spc2 is absent or mutated.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Newer full-text primary study refining the role of a
      noncatalytic SPC subunit in the same yeast ER signal peptidase complex.
- id: PMID:42586426
  title: The Sec11 C-terminal short helix promotes productive engagement of internal
    signal sequences with the signal peptidase complex.
  findings:
  - statement: The Sec11 C-terminal short helix spans the ER membrane and helps
      stabilize internal signal sequences during productive SPC engagement.
    supporting_text: While N-terminal signal sequences of varying hydrophobicity were efficiently cleaved, internal signal sequences with extended N-terminal region were selectively defective in cleavage in the absence of the Sec11 CTS.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Removing the Sec11 CTS does not abolish core Sec11-Spc3 assembly
      or cleavage of standard N-terminal signal sequences.
    supporting_text: Collectively, our data suggest that truncation of the Sec11 CTS neither destabilizes the SPC catalytic core nor compromises its proteolytic activity.
    full_text_unavailable: false
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Newer full-text SEC11 study that directly tests the topology
      and substrate-recognition contribution of the Sec11 C-terminal short helix.
core_functions:
- description: Cleaves N-terminal signal peptides from nascent secretory and
    membrane-protein precursors as the catalytic SEC11 subunit of the ER signal
    peptidase complex.
