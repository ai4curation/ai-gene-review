id: P53868
gene_symbol: ALG9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Alg9 is a multi-pass ER membrane, dolichyl-phosphate-mannose-dependent α1,2-mannosyltransferase
  of glycosyltransferase family 22 (GT-C superfamily). It acts on the lumenal side of the ER during assembly
  of the lipid-linked oligosaccharide. Unlike the other ALG enzymes, which each add a single sugar, Alg9
  catalyses two distinct reactions. It adds the seventh mannose, an α1,2-Man on Man6GlcNAc2-PP-dolichol
  made by Alg3 (EC 2.4.1.259). It also adds the ninth mannose, an α1,2-Man on Man8GlcNAc2-PP-dolichol
  made by Alg12 (EC 2.4.1.261), completing Man9GlcNAc2-PP-dolichol for glucosylation by Alg6. ALG9 is
  not essential. alg9Δ cells accumulate Man6GlcNAc2-PP-dolichol and hypoglycosylate secreted proteins.
