suggested_questions:
- question: How does one Alg9 active site accept two different branches (the B-branch on Man6 and the
    C-branch on Man8) and still keep the assembly order in which Alg12 acts in between?
suggested_experiments:
- description: Use in vitro assays with purified Alg9 and defined Man6- and Man8GlcNAc2-PP-lipid acceptors
    to compare kinetic parameters for the two reactions, and look for mutations that separate them.
