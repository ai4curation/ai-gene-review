descriptions:
- source: UniProt
  text: Mannosyltransferase that operates in the biosynthetic pathway of dolichol-linked
    oligosaccharides, the glycan precursors employed in protein asparagine (N)-glycosylation.
    The assembly of dolichol-linked oligosaccharides begins on the cytosolic side
    of the endoplasmic reticulum membrane and finishes in its lumen. The sequential
    addition of sugars to dolichol pyrophosphate produces dolichol-linked oligosaccharides
    containing fourteen sugars, including two GlcNAcs, nine mannoses and three glucoses.
    Once assembled, the oligosaccharide is transferred from the lipid to nascent proteins
    by oligosaccharyltransferases. In the lumen of the endoplasmic reticulum, catalyzes
    the addition of the seventh and ninth alpha-1,2-linked mannose residues to Man(6)GlcNAc(2)-PP-dolichol
    and Man(8)GlcNAc(2)-PP- dolichol respectively.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53868
  source_id: P53868
- source: Alliance_Imported
  text: Mannosyltransferase, involved in N-linked glycosylation; catalyzes the transfer
    of both the seventh mannose residue on B-arm and ninth mannose residue on the
    C-arm from Dol-P-Man to lipid-linked oligosaccharides; human homolog ALG9 can
    complement yeast null mutant; mutation of human homolog causes type 1 congenital
    disorders of glycosylation
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALG9
  source_id: SGD:S000005163
- source: Alliance_Automated
  text: Enables dol-P-Man:Man(6)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity
    and dol-P-Man:Man(8)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity. Involved
    in dolichol-linked oligosaccharide biosynthetic process. Located in endoplasmic
    reticulum. Used to study bipolar disorder and congenital disorder of glycosylation
    type I. Human ortholog(s) of this gene implicated in autosomal recessive polycystic
    kidney disease and congenital disorder of glycosylation Il. Orthologous to human
    ALG9 (ALG9 alpha-1,2-mannosyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALG9
  source_id: SGD:S000005163
