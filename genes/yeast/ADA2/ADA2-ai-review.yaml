core_functions:
- description: Activating partner of the Gcn5 histone acetyltransferase in the HAT module shared by SAGA,
    SLIK and ADA. Ada2 binds Gcn5 through its ZZ and SANT domains; the SANT domain completes Gcn5's acetyl-CoA
    binding pocket and raises acetyl-CoA binding, so that Ada2 potentiates Gcn5 catalysis, and with Ada3
    it allows Gcn5 to acetylate nucleosomal histone H3 and H2B. Ada2 also holds the module together and,
    through its SWIRM domain, tethers it to the rest of SAGA.
  molecular_function:
    id: GO:0010698
    label: acetyltransferase activator activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0000124
    label: SAGA complex
  supported_by:
  - reference_id: PMID:11773077
    supporting_text: Our results suggest that Ada2 potentiates the Gcn5 catalytic activity and that Ada3
      facilitates nucleosomal acetylation and an expanded lysine specificity.
  - reference_id: PMID:30224453
    supporting_text: Binding of the SAGA subunit partner Ada2 to Gcn5 activates Gcn5's intrinsically weak
      HAT activity on histone proteins
  - reference_id: PMID:30224453
    supporting_text: Instead, the Ada2 SANT domain enhances Gcn5 binding of the enzymatic cosubstrate
      acetyl-CoA.
  - reference_id: PMID:18950642
    supporting_text: in vivo acetylation of K16 of histone H2B was almost totally eliminated at Ada2-regulated
      promoters in the ada2-RLR strain, while acetylation of K9 and K18 of histone H3 was reduced to approximately
      40% of wild-type levels.
  - reference_id: PMID:36965704
    supporting_text: Here we show that the SWIRM domain is required for incorporation of the HAT module
      into the yeast SAGA complex, but not the ADA complex
- description: Transcription coactivator subunit of SAGA and ADA. Ada2 contacts acidic activation domains
    (VP16, Gcn4) through its N-terminus and associates with TBP, activates transcription when tethered
    to DNA, and as part of SAGA, which binds upstream activating sequences, supports RNA polymerase II
    transcription of most genes.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0000124
    label: SAGA complex
  supported_by:
  - reference_id: PMID:7972120
    supporting_text: ADA2 protein interacts with a region of the VP16 acidic activation domain that requires
      ADA2 for activity in vivo.
  - reference_id: PMID:7972120
    supporting_text: ADA2 protein, when fused to a heterologous DNA-binding domain, can stimulate the
      activity of the basal transcription factors in vivo.
  - reference_id: PMID:7642611
    supporting_text: ADA2 associated with the herpesvirus VP16 and yeast GCN4 activation domains but not
      with the activation domain of yeast HAP4
  - reference_id: PMID:28918903
    supporting_text: Our data demonstrate that SAGA acts as a general cofactor required for essentially
      all RNA polymerase II transcription
knowledge_gaps:
- gap_statement: It is not known whether Ada2 binds phosphatidylserine or other phospholipids in vivo,
    or whether lipid binding contributes to SAGA function.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The conserved central region of Ada2 binds phospholipids in vitro, and the mutation that
    weakens Gcn5-dependent acetylation also weakens lipid binding, so the two effects have not been separated.
    A separation-of-function allele, or a test of SAGA activity with defined lipids, would show whether
    lipid binding matters for a nuclear coactivator.
  provenance:
  - reference_id: PMID:18950642
    supporting_text: Since phosphatidylserine binding paralleled Ada2 function, we suggest that lipid
      binding may play a role in the function or regulation of the SAGA complex.
- gap_statement: The mechanism by which Ada2 promotes silencing at telomeres and the rDNA, and whether
