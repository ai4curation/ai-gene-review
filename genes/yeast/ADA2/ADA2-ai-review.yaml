- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G16420
  - PANTHER:PTN000271860
  - SGD:S000002856
  - UniProtKB:Q75LL6
  review:
    summary: Phylogenetic inference of transcription coactivator activity for Ada2 orthologs.
    action: ACCEPT
    reason: Transcription coactivator activity fits Ada2 well. GO defines it as increasing transcription
      through binding a DNA-binding transcription factor, on its own or as part of a complex, including
      coactivators that act by acetylating histones. Ada2 binds the VP16 and Gcn4 activation domains through
      its N-terminus and associates with TBP, activates transcription when tethered to DNA (depending
      on Ada3), and is a subunit of SAGA, a general coactivator of RNA polymerase II transcription. Its
      more specific mechanistic contribution, activation of Gcn5, is added as a NEW acetyltransferase
      activator activity row. Core function. The IBD sits at the eukaryotic Ada2 node, seeded by yeast
      Ada2 and plant ADA2 proteins; Ada2 is inside that clade with no sign of divergence.
    supported_by:
    - reference_id: PMID:7972120
      supporting_text: ADA2 protein interacts with a region of the VP16 acidic activation domain that
        requires ADA2 for activity in vivo.
    - reference_id: PMID:7642611
      supporting_text: ADA2 associated with the herpesvirus VP16 and yeast GCN4 activation domains but
        not with the activation domain of yeast HAP4
    - reference_id: PMID:28918903
      supporting_text: Our data demonstrate that SAGA acts as a general cofactor required for essentially
        all RNA polymerase II transcription
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000271860
        source_status: SUPPORTS_TRANSFER
        comment: Eukaryotic Ada2 ancestor; ADA2 is among the experimentally grounded seeds (PMID:7972120).
