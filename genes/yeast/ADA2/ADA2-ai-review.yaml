- term:
    id: GO:0010698
    label: acetyltransferase activator activity
  evidence_type: IDA
  original_reference_id: PMID:11773077
  review:
    summary: Ada2 binds Gcn5 and potentiates its histone acetyltransferase activity.
    action: NEW
    reason: 'Ada2 is the activating partner of Gcn5, and no existing row says so. Gcn5 alone has weak
      activity on histones; recombinant Ada2-Ada3-Gcn5 reconstitutes nucleosomal HAT activity and lysine
      specificity, with Ada2 potentiating Gcn5 catalysis (PMID:11773077). Crystal structures of the Ada2/Gcn5
      complex show the Ada2 SANT domain completing Gcn5''s acetyl-CoA binding pocket and enhancing acetyl-CoA
      binding (PMID:30224453), and a central-region mutation of Ada2 lowers Gcn5-mediated acetylation
      in vitro and at promoters in vivo (PMID:18950642). Ada2 binds Gcn5 directly (PMID:7957049). This
      matches the definition of acetyltransferase activator activity (binds to and increases the activity
      of an acetyltransferase). Comparator check: other non-catalytic subunits that bind and activate
      a histone acetyltransferase carry this term, for example yeast Vps75 and Asf1 (activators of Rtt109),
      human BRPF1 and fly Br140, Eaf6 and Ing5. Core function.'
    supported_by:
    - reference_id: PMID:11773077
      supporting_text: Our results suggest that Ada2 potentiates the Gcn5 catalytic activity and that
        Ada3 facilitates nucleosomal acetylation and an expanded lysine specificity.
    - reference_id: PMID:11773077
      supporting_text: We show that yeast Ada2, Ada3, and Gcn5 form a catalytic core of the ADA and Spt-Ada-Gcn5-acetyltransferase
        HAT complexes, which is necessary and sufficient in vitro for nucleosomal HAT activity and lysine
        specificity of the intact HAT complexes.
    - reference_id: PMID:30224453
      supporting_text: Binding of the SAGA subunit partner Ada2 to Gcn5 activates Gcn5's intrinsically
        weak HAT activity on histone proteins
    - reference_id: PMID:30224453
      supporting_text: Instead, the Ada2 SANT domain enhances Gcn5 binding of the enzymatic cosubstrate
        acetyl-CoA.
    - reference_id: PMID:18950642
      supporting_text: Indicative of Ada2-RLR affecting Gcn5 function, Ada2-RLR resulted in a decrease
        in Gcn5-mediated histone acetylation in vitro to a level approximately 40% that with wild-type
        Ada2.
