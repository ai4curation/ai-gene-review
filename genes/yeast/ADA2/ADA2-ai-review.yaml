- term:
    id: GO:0000183
    label: rDNA heterochromatin formation
  evidence_type: IMP
  original_reference_id: PMID:19737915
  qualifier: involved_in
  review:
    summary: ada2 deletion reduces silencing at the rDNA.
    action: KEEP_AS_NON_CORE
    reason: In ada2 deletion strains silencing of telomere-proximal and rDNA reporters is reduced, Sir2
      and Sir3 spread into subtelomeric regions and H4 K16 acetylation drops; Ada2 occupies telomeric
      chromatin and binds Sir2 in vivo. The role is real but rests on one study, its mechanism (a boundary-like
      activity, reported as distinct from Gcn5) is not defined, and it is peripheral to Ada2's main function
      as a Gcn5 activator in SAGA and ADA. Kept as non-core.
    supported_by:
    - reference_id: PMID:19737915
      supporting_text: Here we report a new function for Ada2 in promoting transcriptional silencing at
        telomeres and ribosomal DNA.
    - reference_id: PMID:19737915
      supporting_text: This silencing function is the first characterized role for Ada2 distinct from
        its involvement with Gcn5.
