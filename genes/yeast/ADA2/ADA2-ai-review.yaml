id: Q02336
gene_symbol: ADA2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Ada2 (transcriptional adaptor 2, YDR448W) is a non-catalytic subunit of the histone acetyltransferase
  (HAT) module (Gcn5, Ada2, Ada3/Ngg1 and Sgf29) that is shared by the SAGA and SLIK/SALSA transcription
  coactivator complexes and by the smaller ADA complex. It has an N-terminal ZZ-type zinc finger, a SANT
  domain and a C-terminal SWIRM domain. Ada2 binds Gcn5 directly through its ZZ and SANT domains and is
  its activating partner: on its own Gcn5 has weak activity on histones, and Ada2 potentiates Gcn5 catalysis,
  its SANT domain completing the acetyl-CoA binding pocket of Gcn5. Ada2, Ada3 and Gcn5 form a catalytic
  core that is sufficient in vitro for nucleosomal acetylation of histone H3 with the lysine specificity
  of the native complexes, and a conserved central region of Ada2 is needed for full Gcn5-dependent acetylation
  of H3 and H2B at promoters in vivo. Ada2 also holds the HAT module together, bridging Ada3 and Gcn5,
  and its SWIRM domain tethers the module to the rest of SAGA but is not needed for the ADA complex. First
  identified genetically as an adaptor required for activation by acidic activation domains, Ada2 contacts
  the VP16 and Gcn4 activation domains, associates with TBP, and activates transcription when tethered
  to DNA. Through SAGA, a general cofactor of RNA polymerase II transcription that binds upstream activating
  sequences, Ada2 contributes to promoter histone acetylation and gene activation. Ada2 is nuclear. It
  also associates with telomeric chromatin and promotes silencing at telomeres and the rDNA, where its
  loss lets Sir2 and Sir3 spread into subtelomeric regions; this role has been described as distinct from
  its function with Gcn5. ada2 mutants are sensitive to a genotoxic agent and defective in sister chromatid
  recombination. The central region binds phospholipids, including phosphatidylserine, in vitro.'
