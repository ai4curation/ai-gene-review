- term:
    id: GO:0001786
    label: phosphatidylserine binding
  evidence_type: IDA
  original_reference_id: PMID:18950642
  qualifier: enables
  review:
    summary: The central region of Ada2 binds phospholipids, including phosphatidylserine, in vitro.
    action: MARK_AS_OVER_ANNOTATED
    reason: Phosphatidylserine binding was measured in vitro for the conserved central region of Ada2,
      and the ada2-RLR mutation that weakens Gcn5-dependent acetylation also weakens lipid binding. The
      authors only suggest a role for lipid binding; there is no evidence that nuclear Ada2 binds phosphatidylserine
      in vivo or that lipid binding contributes to SAGA function, and Ada2 is not known to act at membranes.
      This is real in vitro binding of unknown physiological relevance, so the annotation is marked as
      over-annotated rather than removed (recorded as a knowledge gap).
    supported_by:
    - reference_id: PMID:18950642
      supporting_text: We also show that the central region of Ada2 interacts with phospholipids.
    - reference_id: PMID:18950642
      supporting_text: Since phosphatidylserine binding paralleled Ada2 function, we suggest that lipid
        binding may play a role in the function or regulation of the SAGA complex.
    - reference_id: file:yeast/ADA2/ADA2-deep-research-claude-code.md
      supporting_text: The same region binds phospholipids in vitro, the basis of the GO "phosphatidylserine
        binding" annotation; the authors only suggest a physiological role.
