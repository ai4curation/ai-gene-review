suggested_questions:
- question: Is Vps1 GTP hydrolysis strongly stimulated by membrane assembly, as on PS/PI(3)P tubules with
    S. cerevisiae Vps1, or only modestly, as reported for C. thermophilum Vps1 on PS liposomes and nanotubes?
    Does the difference come from the ortholog, the lipid composition or the assay?
- question: Does Vps1 cut Atg9 carriers from the Atg9 reservoirs directly, and how is it recruited there?
    Atg9 itself and Atg27 are candidates.
- question: What recruits Vps1 to retromer/Mvp1-coated endosomal tubules, given that the exact mechanism
    of Vps1 recruitment to the retromer complex remains unclear?
- question: Is the microtubule binding reported for the original SPO15 protein reproducible with full-length
    Vps1, and is there any meiotic or sporulation-specific role behind the SPO15 name?
suggested_experiments:
- description: Reconstitute Atg9-vesicle fission from purified Atg9 reservoir membranes or Atg9 proteoliposomes
    with wild-type, K42A and I649K Vps1, and image budding by TIRF or cryo-ET.
- description: Compare lipid-stimulated GTPase rates of S. cerevisiae and C. thermophilum Vps1 side by
    side on identical PS/phosphoinositide templates.
- description: Correlative light-EM of endogenously tagged, functional Vps1 (internal ALFA or RL2 tag)
    to map its distribution across endosomes, endocytic sites, peroxisomes and mitochondria, testing whether
    the mitochondrial proteomics hits reflect a real pool.
proposed_new_terms:
- proposed_name: Atg9 reservoir
  proposed_definition: A post-Golgi membrane compartment, distinct from endosomes and the Golgi apparatus,
    that stores the autophagy protein Atg9 in Atg9-containing vesicles and tubules and from which Atg9
    is delivered to the phagophore assembly site.
  justification: Vps1 associates with Atg9 at the Atg9 reservoirs, and the BiFC signal persists in atg11
    and atg17 mutants that cannot form a phagophore assembly site (PMID:37060997). GO has no cellular-component
    term for this compartment, so the location of Vps1's autophagy role cannot be annotated; the nearest
    term, phagophore assembly site, is where the cargo goes, not where Vps1 acts.
