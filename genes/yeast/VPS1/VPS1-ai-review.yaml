  qualifier: located_in
  review:
    summary: Vps1 was detected in a quantitative proteome of isolated mitochondria from cells grown on
      glucose, galactose and lactate (PMID:24769239, abstract only).
    action: KEEP_AS_NON_CORE
    reason: 'Direct high-throughput evidence: Vps1 was detected in a proteome of isolated mitochondria.
      Under the organelle policy (projects/ORGANELLES.md, rule 2) a direct row from an assay that cannot
      resolve the sub-compartment records what the experiment showed, so it is kept. It is non-core, and
      its biological meaning is doubtful. No imaging study places Vps1 on mitochondria (it is at endosomes,
      endocytic sites, the vacuole and peroxisomes; PMID:30087125, PMID:16520372). Mitochondrial division
      is done by Dnm1, which Vps1 cannot replace (PMID:18445678). A soluble, membrane-binding dynamin
      is a plausible co-purifying protein. The cached entry is abstract-only, so whether the preparation
      was marker-controlled could not be checked.'
    supported_by:
