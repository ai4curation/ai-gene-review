core_functions:
- description: Membrane-scission GTPase that assembles on phosphoinositide-containing endosomal tubules
    and uses GTP hydrolysis to constrict and sever them, releasing retromer/SNX-BAR retrograde carriers
    that return Vps10 and late-Golgi and plasma-membrane proteins to the trans-Golgi network.
  molecular_function:
    id: GO:1990606
    label: membrane scission GTPase motor activity
  directly_involved_in:
