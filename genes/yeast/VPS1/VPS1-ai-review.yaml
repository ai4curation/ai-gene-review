    label: late endosome
  supported_by:
  - reference_id: PMID:42477131
    supporting_text: Vps1 assembles into scaffolds on membrane tubules, and uses GTP hydrolysis to force
      tubule constriction and fission
  - reference_id: PMID:42477131
    supporting_text: Vps10 continuously cycles between endosomes and the trans-Golgi network (TGN) via
      a retrieval pathway that strictly depends on both Vps1 and the retromer complex.
  - reference_id: PMID:24567361
    supporting_text: Vps1 is required for fission of cargo-containing, SNX-BAR–coated tubules from the
      endosome.
  - reference_id: PMID:30087125
    supporting_text: We demonstrate that the fungal DRP Vps1 primarily localizes to and functions at the
      endosomal compartment.
- description: At cortical actin patches, Vps1 works with the amphiphysin Rvs161/Rvs167 and binds actin
    filaments to promote scission of endocytic vesicles from the plasma membrane.
  molecular_function:
    id: GO:1990606
    label: membrane scission GTPase motor activity
  directly_involved_in:
