      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: PMID:8344247
      corrected_value: PMID:1825352
      cause: UNKNOWN
      confidence: SUSPECTED
      explanation: The FUNCTION comment combines SPO15-era statements ('Essential for protein sorting
        in meiotic cell division ...; it binds microtubules. Could also be involved in microtubule-associated
        motility') with the Golgi-retention finding, and tags the whole comment ECO:0000269 with PubMed:8344247
        (Wilsbach and Payne 1993). That paper's abstract supports only the Golgi-retention sentence. The
        microtubule statement matches PubMed:1825352 (Yeh et al. 1991, the SPO15 paper), whose abstract
        reports that E. coli-expressed SPO15/Vps1 co-purifies with microtubules. Checked on abstracts
        only; the full text of PubMed:8344247 could still contain microtubule data. If it does not, the
        microtubule and meiosis sentences should cite PubMed:1825352. PubMed:1825352 is a candidate, not
