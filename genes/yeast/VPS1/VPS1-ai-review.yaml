- term:
    id: GO:1901981
    label: phosphatidylinositol phosphate binding
  evidence_type: IDA
  original_reference_id: PMID:42477131
  qualifier: enables
  review:
    summary: Vps1 lacks a PH domain; in its place, Insert B binds lipids directly. Its lysine-rich 3K
      motif (591-593) mediates binding to PI(3)P, PI(4)P, PI(3,5)P2 and PI(4,5)P2 in PLiMAP assays, and
      fission strictly requires phosphoinositides (PMID:42477131). The KKK-AAA mutant has reduced lipid
      and PI(4,5)P2 binding (PMID:31009484).
    action: NEW
    reason: Two independent studies with purified protein show direct phosphoinositide binding through
      a defined motif, and the mutants that lose it are defective in vivo. The binding is broad across
      headgroups, so the parent term phosphatidylinositol phosphate binding is used rather than any one
      phosphoinositide. No existing annotation covers Vps1 lipid binding. It recruits and licenses Vps1
      at membranes and is non-core relative to the scission activity it supports.
    supported_by:
    - reference_id: PMID:42477131
      supporting_text: confirming that the 3K cluster represents a generic, non-specific phosphoinositide-binding
        motif
    - reference_id: PMID:42477131
      supporting_text: PLiMAP tracking revealed uniform binding across all tested phosphoinositide-bearing
        vesicles, each of which supported robust tubule fission
    - reference_id: PMID:31009484
      supporting_text: Here we demonstrate that the region Insert B, located in a position equivalent
        to the dynamin PH domain, is able to bind directly to lipids and that mutation of three lysine
        residues reduces its capacity to interact with lipids, and in particular with PI(4,5)P2.
