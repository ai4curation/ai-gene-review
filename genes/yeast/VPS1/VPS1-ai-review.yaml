  qualifier: is_active_in
  review:
    summary: 'Location row (is_active_in) based on a mutant phenotype: in vps1Δ cells Atg9 does not reach
      the PAS. The same paper''s localisation data put the Vps1-Atg9 interaction at the Atg9 reservoirs,
      not the PAS. BiFC persists in atg11Δ and atg17Δ cells that cannot form a PAS, and Vps1 colocalises
      only minimally with Atg9 (PMID:37060997, full text read).'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'A transport defect toward the PAS shows where the cargo fails to go, not where Vps1 acts.
      The authors conclude that Vps1 acts at the Atg9 reservoirs, a post-Golgi compartment distinct from
      the PAS. The process is captured by the accepted protein localization to phagophore assembly site
      and autophagosome assembly rows. The location claim goes beyond the evidence, so it is marked over-annotated.
      It is not removed: the minimal colocalisation leaves open a transient pool at the PAS, and the SGD
      curator may have weighed other data.'
