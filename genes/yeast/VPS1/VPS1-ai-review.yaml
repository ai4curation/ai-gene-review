    redundantly with Dnm1, through a Pex19-stabilised peroxisomal pool. The activity is given as GTPase
    activity, not membrane scission GTPase motor activity, because Vps1-driven scission has been reconstituted
    only on endosome-like tubules, not on peroxisomal membranes.
