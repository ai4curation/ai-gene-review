    label: GTPase activity
  evidence_type: IDA
  original_reference_id: PMID:42477131
  qualifier: enables
  review:
    summary: Recombinant Vps1 hydrolyses GTP (basal ~0.6 min-1), stimulated ~30-fold by PC:PS:PI(3)P vesicles.
      In the same reconstitution, hydrolysis is coupled to constriction and severing of membrane tubules,
      and GDP, GppNHp or no nucleotide do not support fission (PMID:42477131).
    action: MODIFY
    reason: The GTPase assay is sound, but this paper shows more than GTP hydrolysis. The hydrolysis drives
      membrane constriction and scission, which is the definition of GO:1990606 membrane scission GTPase
      motor activity (is_a GTPase motor activity is_a GTPase activity). The hydrolysis-dead K42A mutant
      constricts but cannot cut, which ties the chemistry to the mechanical outcome. Replace with the
      more specific term the row's own evidence supports.
    proposed_replacement_terms:
    - id: GO:1990606
      label: membrane scission GTPase motor activity
    supported_by:
    - reference_id: PMID:42477131
      supporting_text: Vps1 assembles into scaffolds on membrane tubules, and uses GTP hydrolysis to force
        tubule constriction and fission
    - reference_id: PMID:42477131
      supporting_text: none of these conditions supported tubule fission
    - reference_id: PMID:42477131
      supporting_text: Vps1 mutants that are unable to assemble or to hydrolyze GTP fail to achieve fission
        in vitro and cause cargo mis-sorting in vivo.
