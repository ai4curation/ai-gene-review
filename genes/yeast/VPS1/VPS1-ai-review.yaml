- term:
    id: GO:0000727
    label: double-strand break repair via break-induced replication
  evidence_type: HMP
  original_reference_id: PMID:41398407
  qualifier: involved_in
  review:
    summary: Genome-wide screen for break-induced replication (BIR) factors. VPS1 is not discussed in
      the main text. In Supplementary Data 3.1 it is in the 'Cellular Trafficking (33)' group, with decreased
      BIR in the ectopic (AM3422) and Chr III disomic systems; Supplementary Data 2.1/2.2 give vps1Δ BIR
      efficiencies of 0.21 and 0.11 (supplementary xlsx files checked; see notes).
    action: MARK_AS_OVER_ANNOTATED
    reason: The phenotype may be real, but nothing shows that Vps1 does any of the work of BIR (strand
      invasion, D-loop extension, repair synthesis). Vps1 is a cytoplasmic membrane-fission dynamin with
      no known nuclear location or DNA-related activity. The authors themselves expected many screen hits
      to affect BIR indirectly, and followed up only the checkpoint and nucleoporin genes. A trafficking
      defect (vacuolar or endosomal homeostasis, stress) is the simplest explanation. The row records
      necessity in a screen, not participation, so it is marked over-annotated rather than removed.
    supported_by:
    - reference_id: PMID:41398407
      supporting_text: we observed that 30 of these genes were indeed required for BIR (Fig. 1e), as their
        deletions significantly decreased BIR efficiency
    - reference_id: PMID:41398407
      supporting_text: The other identified genes, including mitochondrial and metabolism/biosynthetic
        genes (Supplementary Data 3), were expected to affect BIR indirectly
