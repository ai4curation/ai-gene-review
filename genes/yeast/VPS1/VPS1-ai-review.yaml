- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IMP
  original_reference_id: PMID:37060997
  qualifier: involved_in
  review:
    summary: vps1 deletion blocks bulk autophagy (Pho8Δ60, GFP-Atg8 processing) about as strongly as atg9Δ
      and impairs the Cvt pathway. Atg9 fails to reach the PAS, while Atg1 and Atg16 are still recruited,
      which places Vps1 upstream of Atg1 at the Atg9 delivery step (PMID:37060997).
    action: ACCEPT
    reason: 'Vps1 does part of the work of autophagosome assembly: its GTPase and self-assembly activities
      are needed to move Atg9 from the Atg9 reservoirs to the PAS, and Atg9 vesicles supply the founding
      membrane of the phagophore. GTPase-dead mutants do not rescue. The mechanism (presumably fission
      of Atg9 carriers from the reservoirs) is not yet shown directly, but the step and the requirement
      for catalytic activity are. Accepted as a core role.'
    supported_by:
    - reference_id: PMID:37060997
      supporting_text: In the absence of Vps1, Atg9 fails to reach the sites of autophagosome formation,
        and this results in an autophagy defect.
    - reference_id: PMID:37060997
      supporting_text: The function of Vps1 in autophagy requires its GTPase activity.
    - reference_id: PMID:37060997
      supporting_text: Altogether, these data show that Vps1 function is required for the early steps
        of autophagosome formation
