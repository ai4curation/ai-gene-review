id: P21576
gene_symbol: VPS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Vps1 is the dynamin-related GTPase of Saccharomyces cerevisiae that cuts membranes in the
  endomembrane system; the other two yeast dynamin-related proteins, Dnm1 and Mgm1, act on mitochondria.
  It has a dynamin GTPase domain, a stalk and a GTPase effector domain, but no pleckstrin-homology or
  proline-rich domain. In place of the PH domain, an 'Insert B' region carries a lysine-rich motif that
  binds phosphoinositides and a phenylalanine-rich motif that promotes self-assembly. A soluble cytosolic
  pool is recruited to anionic, phosphoinositide-containing membranes, where Vps1 assembles into an unusually
  open helical scaffold. GTP hydrolysis then constricts and severs the underlying tubule. Vps1 acts mainly
  at endosomes. There, with retromer and the SNX-BAR protein Mvp1, it cuts cargo-loaded tubules into retrograde
  carriers. These return the CPY receptor Vps10 and many late-Golgi and plasma membrane proteins to the
  trans-Golgi network, and also retrieve such proteins from the vacuole. Loss of Vps1 therefore causes
  the vacuolar protein sorting (CPY secretion) and Golgi-retention defects for which it was named. Vps1
  also contributes to endocytic vesicle scission at cortical actin patches, together with the amphiphysin
  Rvs161/Rvs167. This role uses direct binding and bundling of actin filaments and is regulated by Pho85-dependent
  phosphorylation of Ser599. It divides peroxisomes independently of, and partly redundantly with, Dnm1,
  through a Pex19-stabilised peroxisomal pool. It moves the lipid scramblase Atg9 from Atg9 reservoirs
  to the phagophore assembly site, which is needed for autophagosome formation. On the vacuole, Vps1 polymers
  couple t-SNAREs and are released by Sec18/NSF at the onset of vacuole fusion.
