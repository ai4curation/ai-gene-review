core_functions:
- description: SDR-family polyprenol dehydrogenase (DHRSX ortholog) that initiates the three-step detour converting
    polyprenol to dolichol (polyprenol -> polyprenal, with Dfg10 then reducing polyprenal to dolichal), and probably
    also reduces dolichal to dolichol, supplying the dolichol carrier for N-glycosylation.
  molecular_function:
    id: GO:0160196
    label: polyprenol dehydrogenase (NAD+) activity
  directly_involved_in:
  - id: GO:0043048
    label: dolichyl monophosphate biosynthetic process
  locations:
