id: Q06417
gene_symbol: TDA5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TDA5 (YLR426W) encodes a membrane-anchored short-chain dehydrogenase/reductase (SDR) with two N-terminal
  transmembrane segments and a Rossmann-fold NAD(P)-binding catalytic domain. It is the functional ortholog of human
  DHRSX, the dual-specificity SDR that oxidises polyprenol to polyprenal (NAD+) and reduces dolichal to dolichol
  (NADPH) in the three-step detour by which the alpha-isoprene unit of polyprenol is saturated to form dolichol,
  with the polyprenal reductase Dfg10 (SRD5A3) catalysing the middle step. tda5 deletion mutants accumulate polyprenol,
  have markedly reduced dolichol, accumulate squalene, are hypersensitive to tunicamycin and underglycosylate carboxypeptidase
  Y; all these phenotypes are rescued by human DHRSX but not by DFG10 or SRD5A3. Dolichol is still detectable in
  tda5 dfg10 double mutants, implying an additional bypass route. The enzymatic activity of Tda5 itself has not
  yet been assayed directly. TDA5 was first named in a screen for genes affecting tolerance of topoisomerase I-induced
  DNA damage, and deletion confers sensitivity to some DNA-damaging agents. Large-scale studies detect the protein
  in the endoplasmic reticulum and in purified mitochondria.
