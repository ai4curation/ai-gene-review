    supporting_text: Deletion of TDA5 caused glycosylation defects, reduced dolichol levels, and accumulated polyprenol.
  - reference_id: PMID:42201967
    supporting_text: All these phenotypes were rescued by expression of DHRSX, but not by DFG10 or SRD5A3.
  - reference_id: PMID:42201967
    supporting_text: These findings show that Tda5 serves the same function as DHRSX in yeast, thereby demonstrating
      conservation of the three-step detour pathway in yeast
  - reference_id: PMID:38821050
    supporting_text: The first and third steps are performed by DHRSX
suggested_questions:
- question: Does purified Tda5 catalyse both the NAD+-dependent oxidation of polyprenol and the NADPH-dependent
    reduction of dolichal (GO:0160197), as DHRSX does?
- question: 'Where does Tda5 act: ER membrane, lipid droplets (as DHRSX), or mitochondria-associated membranes?'
- question: Which enzyme(s) make the residual dolichol in tda5 dfg10 cells (Env9 is a candidate)?
suggested_experiments:
- hypothesis: Tda5 has dual polyprenol dehydrogenase and dolichal reductase activity
  description: Express Tda5 in yeast or HEK293T membranes and assay polyprenol + NAD+ -> polyprenal and dolichal
    + NADPH -> dolichol by LC-MS, as done for DHRSX; test catalytic-tyrosine/lysine mutants.
  experiment_type: enzymology / lipidomics
- hypothesis: Tda5 localises to ER-associated lipid droplets
  description: Endogenous Tda5-mNeonGreen imaging with ER (Sec63), lipid droplet (Erg6) and mitochondrial markers.
  experiment_type: live-cell imaging
