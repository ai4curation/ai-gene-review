  review:
    summary: tda5 deletion accumulates polyprenol (the substrate of step 1) and loses dolichol; human DHRSX, whose
      purified protein oxidises polyprenol to polyprenal with NAD+, rescues all phenotypes, while DFG10/SRD5A3 do
      not.
    action: NEW
    reason: Tda5 is inferred to perform step 1 of the dolichol detour itself (it is the DHRSX-equivalent enzyme),
      not merely be required for it. Evidence is genetic plus heterologous complementation; a direct yeast enzyme
      assay is still lacking. GO:0160197 dolichal reductase is likely as well (DHRSX catalyses both) but has no
      yeast-specific evidence and is raised as a question instead.
    supported_by:
    - reference_id: PMID:42201967
      supporting_text: In tda5Δ cells, polyprenol levels were significantly increased and dolichol levels were more
        severely reduced.
    - reference_id: PMID:42201967
      supporting_text: All these phenotypes were rescued by expression of DHRSX, but not by DFG10 or SRD5A3.
    - reference_id: PMID:38821050
