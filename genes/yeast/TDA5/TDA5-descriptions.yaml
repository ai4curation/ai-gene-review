- source: Alliance_Imported
  text: Protein of unknown function; detected in highly purified mitochondria in high-throughput
    studies; proposed to be involved in resistance to mechlorethamine and streptozotocin;
    null mutant sensitive to expression of top1-T722A allele
  source_type: curated
  url: https://www.yeastgenome.org/locus/TDA5
  source_id: SGD:S000004418
- source: Alliance_Automated
  text: Predicted to enable oxidoreductase activity, acting on the CH-OH group of
    donors, NAD or NADP as acceptor. Involved in response to xenobiotic stimulus.
    Located in endoplasmic reticulum and mitochondrion. Human ortholog(s) of this
    gene implicated in craniosynostosis-scoliosis syndrome. Orthologous to several
    human genes including DHRS3 (dehydrogenase/reductase 3); HSD17B11 (hydroxysteroid
    17-beta dehydrogenase 11); and HSD17B13 (hydroxysteroid 17-beta dehydrogenase
    13).
  source_type: automated
