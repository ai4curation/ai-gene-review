    gene implicated in craniosynostosis-scoliosis syndrome. Orthologous to several
    human genes including DHRS3 (dehydrogenase/reductase 3); HSD17B11 (hydroxysteroid
    17-beta dehydrogenase 11); and HSD17B13 (hydroxysteroid 17-beta dehydrogenase
    13).
