descriptions:
- source: UniProt
  text: Catalyzes the degradation of hydrogen peroxide (H(2)O(2)) generated by peroxisomal
    oxidases to water and oxygen, thereby protecting cells from the toxic effects
    of hydrogen peroxide.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P15202
  source_id: P15202
- source: Alliance_Imported
  text: Catalase A; breaks down hydrogen peroxide in the peroxisomal matrix formed
    by acyl-CoA oxidase (Pox1p) during fatty acid beta-oxidation
  source_type: curated
  url: https://www.yeastgenome.org/locus/CTA1
  source_id: SGD:S000002664
- source: Alliance_Automated
  text: Enables catalase activity. Involved in hydrogen peroxide catabolic process
    and response to reactive oxygen species. Located in mitochondrial matrix and peroxisomal
    matrix. Human ortholog(s) of this gene implicated in several diseases, including
    acatalasia; eye disease (multiple); hyperinsulinism; lung disease (multiple);
    and osteonecrosis. Orthologous to human CAT (catalase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CTA1
  source_id: SGD:S000002664
