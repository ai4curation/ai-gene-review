taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Catalase A, the peroxisomal monofunctional heme catalase (EC 1.11.1.6) of Saccharomyces cerevisiae.
  Cta1 is a homotetramer that dismutates hydrogen peroxide to water and oxygen. It is imported into the peroxisomal
  matrix via a C-terminal PTS1 (SKF) and an internal targeting signal, where it removes H2O2 generated by fatty-acid
  beta-oxidation (acyl-CoA oxidase); under respiratory growth a fraction is also imported into the mitochondrial
  matrix. CTA1 is glucose-repressed and heme/oxygen-dependent. Its paralog Ctt1 (catalase T) is the cytosolic catalase;
  loss of both catalases increases oxidative protein damage.
