- question: How is Cta1 targeted to mitochondria without a presequence, and what fraction of cellular Cta1 is mitochondrial
    under respiratory growth?
- question: Does the NADPH bound in the catalase A structure protect against compound II formation in vivo as for
    mammalian catalase?
