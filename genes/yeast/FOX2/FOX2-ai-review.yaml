id: Q02207
gene_symbol: FOX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FOX2 (YKR009C) encodes the peroxisomal multifunctional enzyme type 2 (MFE-2), a ~100 kDa bifunctional
  protein that catalyses the second and third reactions of fatty acid beta-oxidation in Saccharomyces cerevisiae.
  Its C-terminal hydratase 2 (MaoC-like) domain hydrates trans-2-enoyl-CoA to (3R)-3-hydroxyacyl-CoA (2-enoyl-CoA
  hydratase 2, EC 4.2.1.119), and its two N-terminal short-chain dehydrogenase/reductase (SDR) domains, A and B,
  oxidise (3R)-3-hydroxyacyl-CoA to 3-ketoacyl-CoA with NAD+ ((3R)-3-hydroxyacyl-CoA dehydrogenase). Domain A prefers
  medium- and long-chain and domain B short-chain substrates, and both are needed for optimal growth on oleate.
  Contrary to earlier assumptions, the yeast enzyme lacks crotonase (hydratase 1), (3S)-3-hydroxyacyl-CoA dehydrogenase
  and 3-hydroxyacyl-CoA epimerase activities, so yeast beta-oxidation proceeds through the (3R)-hydroxyacyl-CoA
  stereoisomer. Fox2p is the only MFE in yeast and is essential for growth on fatty acids; it is a peroxisomal matrix
  protein carrying a PTS1 but can also be imported by Pex5p independently of that signal (and weakly by Pex9p).
