suggested_questions:
- question: Should the YeastPathways fatty acid oxidation pathway (and the GO-CAMs derived from it) be corrected
    to the (3R)-hydroxyacyl-CoA route (EC 4.2.1.119 and 3R-specific dehydrogenase) for S. cerevisiae, given that
    Fox2p lacks crotonase and (3S)-dehydrogenase activities?
- question: Which YeastPathways pathway is behind the PWY-5177 rows on Fox2p, and is there any yeast evidence that
    Fox2p acts outside fatty acid beta-oxidation?
suggested_experiments:
- hypothesis: Fox2p is the only source of 2-enoyl-CoA hydratase and 3-hydroxyacyl-CoA dehydrogenase activity in
    oleate-grown yeast peroxisomes.
  description: Assay stereospecific hydratase and dehydrogenase activities (with (3R)- and (3S)-substrates) in purified
    peroxisomes from wild type and fox2 deletion strains grown on oleate.
