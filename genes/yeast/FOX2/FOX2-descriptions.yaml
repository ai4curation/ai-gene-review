descriptions:
- source: UniProt
  text: Second trifunctional enzyme acting on the beta-oxidation pathway for fatty
    acids, possessing hydratase-dehydrogenase-epimerase activities. Converts trans-2-enoyl-CoA
    via D-3-hydroxyacyl-CoA to 3- ketoacyl-CoA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02207
  source_id: Q02207
- source: Alliance_Imported
  text: 3-hydroxyacyl-CoA dehydrogenase and enoyl-CoA hydratase; multifunctional enzyme
    of the peroxisomal fatty acid beta-oxidation pathway; mutation is functionally
    complemented by human HSD17B4
  source_type: curated
  url: https://www.yeastgenome.org/locus/FOX2
  source_id: SGD:S000001717
- source: Alliance_Automated
  text: Enables (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity and enoyl-CoA
    hydratase activity. Involved in fatty acid beta-oxidation. Located in peroxisome.
    Used to study lipid metabolism disorder. Human ortholog(s) of this gene implicated
    in D-bifunctional protein deficiency; Perrault syndrome; and Stiff-Person syndrome.
    Orthologous to human HSD17B4 (hydroxysteroid 17-beta dehydrogenase 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FOX2
  source_id: SGD:S000001717
