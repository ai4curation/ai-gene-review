findings:
- category: discrepancy
  text: UniProt calls Fox2 a hydratase-dehydrogenase-epimerase and the automated text
    gives (3S)-hydroxyacyl-CoA dehydrogenase; the review states the enzyme lacks epimerase
    and (3S) activities and works through (3R)-hydroxyacyl-CoA.
  sources:
  - UniProt
  - Alliance_Automated
