- term:
    id: GO:0099051
    label: vesicle scission involved in endocytosis
  evidence_type: IMP
  original_reference_id: PMID:27093085
  review:
    summary: Rvs167 acts at the endocytic vesicle scission step. It arrives as the invagination deepens
      and leaves at scission. Without Rvs167, invaginations retract instead of being released, and calmodulin-binding
      mutants that impair constriction are defective in vesicle release.
    action: NEW
    reason: 'Participation test: the Rvs161-Rvs167 N-BAR heterodimer does part of the work of scission,
      binding, tubulating and (with calmodulin) constricting the vesicle neck membrane (PMID:20610658,
      PMID:27093085). This is structural membrane-sculpting activity, not mere necessity. Comparator check:
      GO:0099051 is sparsely used (in S. cerevisiae only the dynamin-like VPS1, by IMP), so its absence
      on RVS167 reflects low use of a specific child of endocytosis rather than a convention excluding
      BAR proteins.'
    supported_by:
    - *id030
    - *id012
    - *id011
