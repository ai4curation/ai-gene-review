suggested_questions:
- question: Does the Rvs167 SH3 domain recruit a specific actin regulator (e.g. Iqg1) to the bud neck
    during cytokinesis in hof1 cells, or is its ring-assembly role indirect?
- question: Do Rvs167-subfamily (PTHR47174:SF1) members outside Saccharomycotina, such as S. pombe hob1
    (dispensable for endocytosis) and Neurospora NCU04637, keep the endocytic scission role, or did it
    diverge after the split?
- question: Is direct F-actin binding by Rvs167 real, given that it remains in patches after Latrunculin
    A treatment?
suggested_experiments:
- description: Reconstitute Rvs161-Rvs167 with calmodulin on supported membrane tubes and measure constriction
    and fission directly, with or without the SH3 ligands Las17 and Myo5.
- description: Use correlative light-electron microscopy of rvs167 SH3-deletion and calmodulin-binding
    mutants to separate the roles of membrane sculpting and SH3 recruitment in scission.
