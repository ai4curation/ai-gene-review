id: P39743
gene_symbol: RVS167
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Rvs167 is the S. cerevisiae amphiphysin/BIN-family protein. It has an N-terminal N-BAR domain,
  a central glycine/proline/alanine-rich (GPA) region and a C-terminal SH3 domain. Through its BAR domain
  it forms an obligate heterodimer with Rvs161 (the RVS complex). The heterodimer binds and tubulates
  membranes, and calmodulin binding to the Rvs167 N-BAR enhances its tubulation and constriction activity.
  Rvs167 is recruited late to cortical actin patches, the endocytic sites of budding yeast, as the plasma
  membrane invagination deepens, and it is needed for the scission and release of endocytic vesicles;
  without it invaginations retract. Its SH3 domain binds class I and class II proline-rich motifs in actin-patch
  proteins such as Las17 (WASP), Vrp1, Myo5 and Abp1. Rvs167 is phosphorylated by the Pho85-Pcl and Fus3
  kinases, which inhibits these interactions. Rvs167 also concentrates at the shmoo tip and the tip of
  small buds, where the RabGAPs Gyp5 and Gyl1 recruit it. It acts redundantly with Hof1 in actomyosin
  ring assembly during cytokinesis. Deletion mutants show reduced viability on starvation, salt sensitivity,
  random budding, actin patch delocalization and endocytosis defects.
