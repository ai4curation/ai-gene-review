    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and current: calmodulin-binding N-BAR protein with Rvs161,
      endocytic tubulation and constriction, Gyl1/Gyp5 recruitment to bud tips, amphiphysin
      homolog. Adds exocytosis and CoQ6 trafficking, which the review does not cover.'
- source: Alliance_Automated
  text: Enables calmodulin binding activity; cytoskeletal protein binding activity;
    and identical protein binding activity. Contributes to lipid binding activity.
    Involved in several processes, including actin cortical patch localization; mitotic
    actomyosin contractile ring assembly; and plasma membrane tubulation. Located
    in actin cortical patch; cellular bud tip; and mating projection tip. Part of
    Rvs161p-Rvs167p complex. Orthologous to human AMPH (amphiphysin) and BIN2 (bridging
    integrator 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RVS167
  source_id: SGD:S000002796
