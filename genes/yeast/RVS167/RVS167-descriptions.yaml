gene_symbol: RVS167
organism: yeast
uniprot_id: P39743
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Component of a cytoskeletal structure that is required for the formation of
    endocytic vesicles at the plasma membrane level. Could be implicated in cytoskeletal
    reorganization in response to environmental stresses and could act in the budding
    site selection mechanism.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39743
  source_id: P39743
- source: Alliance_Imported
  text: Calmodulin-binding actin-associated protein; roles in endocytic membrane tabulation
    and constriction, and exocytosis; N-BAR domain protein that interacts with Rvs161p
    to regulate actin cytoskeleton, endocytosis, and viability following starvation
    or osmotic stress; recruited to bud tips by Gyl1p and Gyp5p during polarized growth;
    homolog of mammalian amphiphysin; necessary for efficient trafficking of CoQ6
    to mitochondria
  source_type: curated
  url: https://www.yeastgenome.org/locus/RVS167
  source_id: SGD:S000002796
- source: Alliance_Automated
  text: Enables calmodulin binding activity; cytoskeletal protein binding activity;
    and identical protein binding activity. Contributes to lipid binding activity.
    Involved in several processes, including actin cortical patch localization; mitotic
    actomyosin contractile ring assembly; and plasma membrane tubulation. Located
    in actin cortical patch; cellular bud tip; and mating projection tip. Part of
    Rvs161p-Rvs167p complex. Orthologous to human AMPH (amphiphysin) and BIN2 (bridging
    integrator 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RVS167
  source_id: SGD:S000002796
