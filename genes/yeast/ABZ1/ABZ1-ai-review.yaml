id: P37254
gene_symbol: ABZ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ABZ1 encodes aminodeoxychorismate (ADC) synthase (para-aminobenzoate synthase), a 787-residue bifunctional
  enzyme in which a class I glutamine amidotransferase domain (homologous to E. coli PabA) is fused to a chorismate-binding
  anthranilate-synthase-like domain (homologous to PabB). It converts chorismate and L-glutamine to 4-amino-4-deoxychorismate
  and L-glutamate (EC 2.6.1.85), the first of two steps that produce p-aminobenzoate (PABA) at the branch from the
  shikimate/chorismate pathway; ADC is then aromatised to PABA by Abz2p. PABA is coupled to the pterin moiety by
  Fol1p in the de novo tetrahydrofolate pathway. Abz1p is a cytoplasmic protein, and abz1 mutants are PABA auxotrophs
  that are hypersensitive to sulfonamide antifolates, while ABZ1 overexpression confers sulfonamide resistance.
