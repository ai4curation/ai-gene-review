core_functions:
- description: 'Bifunctional aminodeoxychorismate (ADC) synthase: an N-terminal PabA-like glutamine amidotransferase
    generates ammonia from glutamine that the C-terminal PabB-like domain uses to aminate chorismate to 4-amino-4-deoxychorismate,
    the first committed step of p-aminobenzoate (PABA) synthesis for de novo folate biosynthesis, in the cytosol.'
  molecular_function:
