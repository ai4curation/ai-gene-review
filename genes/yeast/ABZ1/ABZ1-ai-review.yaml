suggested_questions:
- question: Is Abz1p activity feedback-regulated by PABA or folate status, and how is flux partitioned at chorismate
    between PABA and aromatic amino acid synthesis?
- question: How does cytosolic PABA reach the mitochondria-associated Fol1p dihydropteroate synthase?
suggested_experiments:
- hypothesis: PABA produced in the cytosol is imported into mitochondria for dihydropteroate synthesis
  description: Measure PABA and dihydropteroate pools in isolated mitochondria vs cytosol from wild-type and abz1
    cells supplemented with labelled PABA, and screen mitochondrial carrier mutants for sulfonamide hypersensitivity
    in PABA-limited media.
  experiment_type: metabolite tracing / subcellular fractionation
