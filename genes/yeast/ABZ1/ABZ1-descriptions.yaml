gene_symbol: ABZ1
organism: yeast
uniprot_id: P37254
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the biosynthesis of 4-amino-4-deoxychorismate (ADC) from chorismate
    and glutamine. Required for the synthesis of 4- aminobenzoate (PABA), an important
    component in tetrahydrofolate biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P37254
  source_id: P37254
- source: Alliance_Imported
  text: Para-aminobenzoate (PABA) synthase; has similarity to Escherichia coli PABA
    synthase components PabA and PabB; required for the synthesis of para-aminobenzoic
    acid, an important intermediate for folate and ubiquinone Q biosynthesis; protein
    abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/ABZ1
  source_id: SGD:S000005316
- source: Alliance_Automated
  text: Enables aminodeoxychorismate synthase activity. Involved in 4-aminobenzoate
    biosynthetic process. Located in cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ABZ1
  source_id: SGD:S000005316
