- id: PMID:42822426
  title: Comparative analysis of mitochondrial proteomes across the tree of life.
  findings:
  - statement: Comparative proteomic/phylogenetic inference that Saccharomyces mitochondria retained the
      ERMES complex from the last opisthokont common ancestor, whereas human mitochondria lost it.
    supporting_text: the endoplasmic reticulum (ER)-mitochondria encounter structure (ERMES) complex from
      LOCA mitochondria, but human mitochondria lost these pathways
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Chen et al. 2026 comparative mitochondrial proteome study. Computational/phylogenetic
      inference that ERMES was present in the last opisthokont common ancestor and lost in humans; context
      only, not evidence for subunit function.
- id: file:yeast/MDM34/MDM34-deep-research-falcon.md
  title: Falcon deep research report for MDM34
  findings: []
core_functions:
- description: Outer membrane SMP-domain subunit of the ERMES bridge that tethers the mitochondrial outer
    membrane to the ER and forms the mitochondrial end of the ERMES phospholipid transfer path; also recruits
    the Miro GTPase Gem1 to ERMES.
  molecular_function:
    id: GO:0140474
    label: mitochondrion-endoplasmic reticulum membrane tether activity
  directly_involved_in:
  - id: GO:0015914
    label: phospholipid transport
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  - id: GO:0044233
    label: mitochondria-associated endoplasmic reticulum membrane contact site
  in_complex:
    id: GO:0032865
    label: ERMES complex
  supported_by:
  - reference_id: PMID:19556461
    supporting_text: Thus, one core molecular function of the Mmm1/Mdm10/Mdm12/Mdm34 complex is to connect
      ER and mitochondria, which can be bypassed by expressing a synthetic tether.
  - reference_id: PMID:26056272
    supporting_text: Last, we show that the three SMP-containing ERMES subunits form a ternary complex
      in which Mdm12 bridges Mmm1 to Mdm34.
  - reference_id: PMID:27469264
    supporting_text: In the absence of Mmm1, Mdm12 or Mdm34 the PS transport from the ER to mitochondria
      was significantly impaired
  - reference_id: PMID:37165187
    supporting_text: Each bridge consists of three synaptotagmin-like mitochondrial lipid binding protein
      domains oriented in a zig-zag arrangement.
  - reference_id: PMID:38267654
    supporting_text: Mutating Mdm34-L248 to alanine in the endogenous locus caused a complete dissociation
      of Gem1 from ERMES
  - reference_id: file:yeast/MDM34/MDM34-deep-research-falcon.md
    supporting_text: The architecture supports a lipid pathway, but neither isolated-Mdm34 lipid selectivity
      nor a biochemical transfer rate was measured.
suggested_questions:
- question: Does the Mdm34 SMP domain bind and transfer phospholipids itself? No purified-protein lipid
    binding or transfer assay exists for Mdm34; the evidence is homology and the in situ ERMES model.
  experts:
  - Egea lab
  - Kukulski lab
  - Endo lab
- question: Is Gem1 recruitment through the Mdm34 L248 loop required for ERMES lipid transfer, or only
    for regulating ERMES focus number and size?
  experts:
  - Kornmann lab
- question: ERMES is inferred to have been present in the last opisthokont common ancestor and lost in
    the human lineage (Chen et al. 2026, PMID:42822426), with VPS13-family bridge proteins and other contact-site
    machinery likely covering ER-mitochondria lipid supply in animals. Which human proteins, if any, should
    receive the ERMES-equivalent function annotations, and should ERMES complex membership be explicitly
    excluded for human genes in phylogenetic propagation?
  experts:
  - PAINT curators
  - Kornmann lab
suggested_experiments:
- hypothesis: The Mdm34 SMP domain binds glycerophospholipids.
  description: Express and purify the Mdm34 SMP domain (alone and with Mdm12), determine co-purifying
    lipids by lipidomics and test liposome transfer, followed by pocket-lining mutants in vivo with METALIC.
  experiment_type: biochemical
