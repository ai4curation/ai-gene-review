  review:
    summary: MDM34 is a core subunit of the ER-mitochondria encounter structure (ERMES); IBA evidence.
    action: ACCEPT
    reason: 'ERMES membership of MDM34 is among the best-established facts about this protein: the four
      core subunits (Mmm1, Mdm10, Mdm12, Mdm34) co-purify, co-immunoprecipitate, co-localize in a few
      discrete foci at ER-mitochondria contacts and are mutually required for focus formation. Gem1 is
      a fifth, regulatory subunit. This is the central cellular component for the gene and is used as
      in_complex in core_functions.'
    supported_by:
    - reference_id: PMID:19556461
      supporting_text: We identified the Mmm1/Mdm10/Mdm12/Mdm34 complex as a molecular tether between
