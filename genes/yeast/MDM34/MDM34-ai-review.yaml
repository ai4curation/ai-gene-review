id: P53083
gene_symbol: MDM34
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Mdm34 (mitochondrial distribution and morphology 34; also Mmm2; YGL219C) is the mitochondrial
  outer membrane SMP-domain subunit of the ER-mitochondria encounter structure (ERMES). It lacks alpha-helical
  transmembrane segments and associates with the outer membrane, where it partners with the beta-barrel
  subunit Mdm10; its SMP domain contacts the SMP domain of Mdm12, which in turn binds the ER-anchored
  Mmm1, forming a bridge of three SMP domains across ER-mitochondria contacts. Mdm34 is required for ERMES
  assembly into contact-site foci and for the Mmm1-Mdm10 connection, and a disordered loop of Mdm34 binds
  the Miro GTPase Gem1, recruiting this regulatory subunit to ERMES. Loss of Mdm34 slows phosphatidylserine
  transport from the ER to mitochondria, reduces cardiolipin, collapses the mitochondrial network into
  giant spheres and causes mtDNA nucleoid loss; the morphology defect is rescued by an artificial ER-mitochondria
  tether. Mdm34 is predicted, by homology to Mmm1 and Mdm12 and from the in situ ERMES model, to bind
  lipids and act as the outer-membrane end of the lipid transfer path, but lipid binding or transfer by
  Mdm34 itself has not been demonstrated. Mdm34 is a ubiquitinated substrate of mitochondria-associated
  degradation.
