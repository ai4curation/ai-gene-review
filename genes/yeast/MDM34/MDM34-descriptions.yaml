gene_symbol: MDM34
organism: yeast
uniprot_id: P53083
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Component of the ERMES/MDM complex, which serves as a molecular tether to
    connect the endoplasmic reticulum (ER) and mitochondria (PubMed:11907266, PubMed:14981098).
    Components of this complex are involved in the control of mitochondrial shape
    and protein biogenesis, and function in nonvesicular lipid trafficking between
    the ER and mitochondria (PubMed:27469264). MDM34 is required for the interaction
    of the ER-resident membrane protein MMM1 and the outer mitochondrial membrane-resident
    beta-barrel protein MDM10 (By similarity) (PubMed:19556461).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53083
  source_id: P53083
- source: Alliance_Imported
  text: Mitochondrial component of the ERMES complex; links the ER to mitochondria
    and may promote inter-organellar calcium and phospholipid exchange as well as
    coordinating mitochondrial DNA replication and growth; required for mitophagy;
    ERMES complex is often co-localized with peroxisomes and with concentrated areas
    of pyruvate dehydrogenase
  source_type: curated
  url: https://www.yeastgenome.org/locus/MDM34
  source_id: SGD:S000003187
- source: Alliance_Automated
  text: Enables mitochondrion-endoplasmic reticulum membrane tether activity. Involved
    in mitochondrion organization and phospholipid transport. Located in mitochondrial
    outer membrane. Part of ERMES complex. Is active in mitochondria-associated endoplasmic
    reticulum membrane contact site.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MDM34
  source_id: SGD:S000003187
