- source: Alliance_Imported
  text: Mitochondrial component of the ERMES complex; links the ER to mitochondria
    and may promote inter-organellar calcium and phospholipid exchange as well as
    coordinating mitochondrial DNA replication and growth; required for mitophagy;
    ERMES complex is often co-localized with peroxisomes and with concentrated areas
    of pyruvate dehydrogenase
