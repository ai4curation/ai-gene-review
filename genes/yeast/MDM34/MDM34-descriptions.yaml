descriptions:
- source: UniProt
  text: Component of the ERMES/MDM complex, which serves as a molecular tether to
    connect the endoplasmic reticulum (ER) and mitochondria (PubMed:11907266, PubMed:14981098).
    Components of this complex are involved in the control of mitochondrial shape
    and protein biogenesis, and function in nonvesicular lipid trafficking between
    the ER and mitochondria (PubMed:27469264). MDM34 is required for the interaction
    of the ER-resident membrane protein MMM1 and the outer mitochondrial membrane-resident
    beta-barrel protein MDM10 (By similarity) (PubMed:19556461).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53083
