gene_symbol: GLC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GLC3 (YEL011W; allelic with GHA1) encodes the 1,4-alpha-glucan branching enzyme of Saccharomyces
  cerevisiae (EC 2.4.1.18), a GH13-family (GlgB subfamily) transglycosylase with an N-terminal CBM48 carbohydrate-binding
  module. It cleaves a segment from an alpha-1,4-linked glucan chain and reattaches it through an alpha-1,6
  linkage, creating the branch points that make glycogen soluble and provide many non-reducing ends for
  glycogen synthase. Branching activity is absent in glc3 mutant extracts; a partial loss-of-function
  allele produces poorly branched, starch-like glycogen, while the null mutant accumulates very little
  glycogen. GLC3 transcription rises about 20-fold as cells approach stationary phase, and the protein
  is cytosolic, co-localising with glycogen synthase on glycogen particles.
