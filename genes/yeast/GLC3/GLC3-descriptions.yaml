descriptions:
- source: UniProt
  text: Glycogen-branching enzyme participates in the glycogen biosynthetic process
    along with glycogenin and glycogen synthase. Generates alpha-1,6-glucosidic branches
    from alpha-1,4-linked glucose chains, to increase solubility of the glycogen polymer.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32775
  source_id: P32775
- source: Alliance_Imported
  text: Glycogen branching enzyme, involved in glycogen accumulation; contains carbohydrate-remodeling
    activity that attaches a linear chain of α-1,4 linked linear chains to an interior
    glucose residue via an α-1,6 linkage; localizes to the cytoplasm in a punctate
    pattern; relocalizes from nucleus to cytoplasmic foci upon DNA replication stress;
    glycogen accumulation defect of the null mutant is complemented by human GBE1,
    which is associated with glycogen storage disease
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLC3
  source_id: SGD:S000000737
- source: Alliance_Automated
  text: Enables 1,4-alpha-glucan branching enzyme activity. Involved in glycogen biosynthetic
    process. Located in cytoplasm. Used to study glycogen storage disease IV. Human
    ortholog(s) of this gene implicated in glycogen storage disease IV; nervous system
    disease; and pulmonary tuberculosis. Orthologous to human GBE1 (1,4-alpha-glucan
    branching enzyme 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLC3
  source_id: SGD:S000000737
