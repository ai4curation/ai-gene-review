gene_symbol: TDH3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Glyceraldehyde-3-phosphate dehydrogenase 3 (Tdh3, YGR192C) is one of three paralogous NAD+-dependent phosphorylating
  glyceraldehyde-3-phosphate dehydrogenases (GAPDH, EC 1.2.1.12; TDH1, TDH2, TDH3) of Saccharomyces cerevisiae. These homotetrameric
  enzymes catalyse the reversible oxidative phosphorylation of D-glyceraldehyde 3-phosphate to 1,3-bisphosphoglycerate with
  reduction of NAD+ to NADH, the sixth step of glycolysis and an obligatory step of gluconeogenesis. Tdh3 is the dominant
  isoform, supplying about 50-60% of cellular GAPDH activity although its homotetramer has a 2-3-fold lower apparent Vmax
  than Tdh2, and it is a highly abundant cytosolic protein. Besides its cytosolic glycolytic role, Tdh3 has experimentally
  supported moonlighting activities: it binds RNA (including mitochondrial mRNAs and FAS1 mRNA), buffers and allocates labile
  cytosolic heme to the heme-dependent transcription factor Hap1, and is S-nitrosated during oxidative stress-induced cell
  death. Tdh3 is also detected in the cell wall, nucleus and in association with mitochondria.'
