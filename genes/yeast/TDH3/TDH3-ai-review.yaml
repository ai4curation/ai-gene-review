suggested_questions:
- question: Are the heme-buffering and RNA-binding activities of Tdh3 mutually exclusive with catalysis (e.g. via NAD+ site
    occupancy or S-nitrosation of the catalytic cysteine)?
- question: 'Why does tdh3 but not tdh1 or tdh2 deletion affect labile heme pools: abundance only, or isoform-specific sequence
    features?'
suggested_experiments:
- description: Replace TDH3 with TDH2 coding sequence at the TDH3 locus and measure labile heme (heme sensor) and Hap1 reporter
    activity, to separate dosage from isoform-specific heme handling.
