descriptions:
- source: UniProt
  text: Glyceraldehyde-3-phosphate dehydrogenase (GAPDH) involved in glycolysis and
    gluconeogenesis (PubMed:2999100). Catalyzes the reaction of glyceraldehyde-3-phosphate
    to 1,3 bis-phosphoglycerate (PubMed:3905788). The contribution of the TDH1, TDH2,
    and TDH3 to the total glyceraldehyde-3-phosphate dehydrogenase activity is 10-15,
    25- 30, and 50-60%, respectively (PubMed:3905788). . As a side activity, catalyzes
    the hydration of the nicotinamide ring of NADH or NADPH at the C6 position to
    give the corresponding hydrates, NADHX and NADPHX, which exist as R and S epimers,
    that cannot act as electron donors or acceptors and inhibit several dehydrogenases,
    making them toxic.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00359
  source_id: P00359
- source: Alliance_Imported
  text: Glyceraldehyde-3-phosphate dehydrogenase (GAPDH), isozyme 3; involved in glycolysis
    and gluconeogenesis; tetramer that catalyzes the reaction of glyceraldehyde-3-phosphate
    to 1,3 bis-phosphoglycerate; detected in the cytoplasm and cell wall; GAPDH-derived
    antimicrobial peptides secreted by S. cerevisiae are active against a wide variety
    of wine-related yeasts and bacteria; moonlighting role as an AU-rich mRNA binding
    protein that binds to the FAS1 mRNA and controls periodic abundance of Fas1p
  source_type: curated
  url: https://www.yeastgenome.org/locus/TDH3
  source_id: SGD:S000003424
- source: Alliance_Automated
  text: Enables several functions, including glyceraldehyde-3-phosphate dehydrogenase
    (NAD+) (phosphorylating) activity; heme binding activity; and melatonin binding
    activity. Involved in several processes, including gluconeogenesis; glycolytic
    process; and heme transport. Located in fungal-type cell wall; lipid droplet;
    and mitochondrion. Is active in cytosol. Human ortholog(s) of this gene implicated
    in Alzheimer's disease. Orthologous to several human genes including GAPDH (glyceraldehyde-3-phosphate
    dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TDH3
  source_id: SGD:S000003424
