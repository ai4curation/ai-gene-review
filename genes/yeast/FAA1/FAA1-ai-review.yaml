core_functions:
- description: Long-chain fatty acid-CoA ligase that activates exogenous and endogenous C12-C18 fatty acids (preferring
    myristate/palmitate/oleate) to acyl-CoAs, supplying most cellular oleoyl-CoA from imported fatty acids and maintaining
    acyl-CoA pools.
  molecular_function:
    id: GO:0004467
    label: long-chain fatty acid-CoA ligase activity
  directly_involved_in:
  - id: GO:0035336
    label: long-chain fatty-acyl-CoA metabolic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005811
    label: lipid droplet
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:8206942
    supporting_text: In vitro assays of C3:0-C24:0 fatty acids indicate that Faa1p prefers C12:0-C16:0, with myristic
      and pentadecanoic acid (C15:0) having the highest activities
  - reference_id: PMID:11477098
    supporting_text: These studies demonstrated oleoyl CoA levels were reduced to less than 10% wild-type levels
      in faa1 Delta and faa1 Delta faa4 Delta strains
  - reference_id: PMID:11477098
    supporting_text: The faa1 Delta faa4 Delta strain had a marked reduction in endogenous acyl-CoA pools, suggesting
      these enzymes play a role in maintenance of endogenous acyl-CoA pools, metabolism and trafficking
  - reference_id: PMID:27136724
    supporting_text: We found that Faa1-GFP was mainly localized in the plasma membrane
  - reference_id: PMID:10515935
    supporting_text: In addition, several proteins with known function could be attributed to the lipid particle
      fraction during this study, namely Erg7p, Faa1p, Faa4p, and Fat1p
- description: With Faa4p and Fat1p, couples uptake of exogenous long-chain fatty acids across the plasma membrane
    to their activation (vectorial acylation); also required for uptake of sphingoid long-chain bases.
  molecular_function:
