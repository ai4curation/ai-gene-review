gene_symbol: FAA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'FAA1 (YOR317W) encodes the major long-chain fatty acyl-CoA synthetase (ACSL family, EC 6.2.1.3) of
  Saccharomyces cerevisiae. It esterifies C12-C16 saturated (highest with myristate and pentadecanoate) and C14-C18
  unsaturated fatty acids to their CoA thioesters in an ATP- and Mg2+-dependent reaction, providing the bulk of
  cellular oleoyl-CoA synthetase activity from exogenous fatty acids. Together with its paralog Faa4p, and in a
  complex with the FATP-family protein Fat1p, Faa1p couples uptake of exogenous long-chain fatty acids to their
  activation (vectorial acylation): faa1 faa4 double mutants are severely defective in long-chain fatty acid import,
  have depleted acyl-CoA pools and reduced oxidation of exogenous oleate. Faa1p also supplies myristoyl-CoA for
  protein N-myristoylation, activates hexadecenoic acid in the sphingolipid-to-glycerolipid (sphingosine 1-phosphate
  degradation) pathway, and is required with Faa4p for uptake of sphingoid long-chain bases. Faa1p is a peripheral
  membrane protein found at the plasma membrane, on lipid droplets and in the ER. Its acyl-CoA products feed phospholipid
  and neutral lipid synthesis and, via peroxisomal Pxa1/Pxa2 import, beta-oxidation.'
