suggested_questions:
- question: How does Faa1p mediate ATP-independent uptake of sphingoid long-chain bases, which are not substrates
    of its ligase activity? Is there a transport path through the protein or via its partner Fat1p?
- question: Should the YeastPathways fatty acid oxidation pathway attach the cytosolic/plasma-membrane ACSLs (Faa1p,
    Faa4p) as upstream suppliers of acyl-CoA for Pxa1/Pxa2 import, distinct from the intraperoxisomal ligases (Faa2p,
    Fat1p)?
suggested_experiments:
- hypothesis: Faa1p directly translocates sphingoid long-chain bases across the plasma membrane.
  description: Reconstitute purified Faa1p in proteoliposomes and measure ATP-independent transfer of labelled dihydrosphingosine
    across the bilayer, with catalytically dead FACS-motif mutants as controls.
