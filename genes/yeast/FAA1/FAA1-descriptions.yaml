- source: Alliance_Automated
  text: Enables long-chain fatty acid-CoA ligase activity and medium-chain fatty acid-CoA
    ligase activity. Involved in long-chain fatty acid import into cell; long-chain
    fatty-acyl-CoA metabolic process; and sphingoid long-chain base transport. Located
    in lipid droplet and plasma membrane. Used to study Sjogren-Larsson syndrome.
    Human ortholog(s) of this gene implicated in asthma; breast cancer; cardiac arrest;
    intellectual disability (multiple); and prostate cancer. Orthologous to several
    human genes including ACSL4 (acyl-CoA synthetase long chain family member 4).
