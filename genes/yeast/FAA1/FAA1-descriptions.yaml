descriptions:
- source: UniProt
  text: Activates long-chain fatty acids (LCFA) by esterification of the fatty acids
    into metabolically active CoA-thioesters for subsequent degradation or incorporation
    into phospholipids. Also facilitates the transport of LCFAs into the cell, either
    by active transport or by decreasing the intracellular LCFA concentration (PubMed:11477098,
    PubMed:12601005, PubMed:27136724, PubMed:8206942). It may supplement intracellular
    myristoyl-CoA pools from exogenous myristate. Preferentially acts on C12:0-C16:0
    fatty acids with myristic and pentadecanic acid (C15:0) having the highest activities
    (PubMed:8206942). Also involved in long-chain base (LCB) uptake of sphingolipids.
    In contrast ot LCFA uptake, LCB uptake does not require ATP, suggesting that the
    enzyme is directly involved in active LCB uptake (PubMed:27136724). Involved in
    the sphingolipid-to-glycerolipid metabolic pathway, converting the sphingolipid
    metabolite hexadecenoic acid to hexadecenoyl-CoA, which is then further converted
    to glycerolipids (PubMed:22633490).
