gene_symbol: THI6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: THI6 (YPL214C) encodes the bifunctional thiamine biosynthetic enzyme of Saccharomyces cerevisiae,
  a homo-octamer of ~60 kDa subunits. Its N-terminal thiamine-phosphate synthase (TMP pyrophosphorylase,
  EC 2.5.1.3) domain couples 4-amino-2-methyl-5-diphosphomethylpyrimidine (HMP-PP, from Thi20/Thi21) with
  the thiazole phosphate (in eukaryotes the carboxythiazole phosphate derived from Thi4's ADT, with decarboxylation)
  to form thiamine monophosphate, the step that joins the two branches of de novo thiamine synthesis.
  Its C-terminal hydroxyethylthiazole kinase (EC 2.7.1.50) domain phosphorylates 4-methyl-5-(2-hydroxyethyl)thiazole,
  a salvage route for free thiazole that is not needed for de novo synthesis. THI6 is essential for growth
  without thiamine, is cytosolic, and is regulated by thiamine pyrophosphate through Thi2/Thi3/Pdc2.
