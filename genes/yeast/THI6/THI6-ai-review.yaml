suggested_questions:
- question: Does yeast Thi6 use the carboxythiazole phosphate (with decarboxylation) as its physiological
    thiazole substrate, and which enzyme provides it from Thi4's ADT?
suggested_experiments:
- description: Measure Thi6 TMP-synthase kinetics with carboxythiazole phosphate versus thiazole phosphate,
    and test growth of kinase-dead (E370K) strains on hydroxyethylthiazole alone.
