descriptions:
- source: UniProt
  text: Essential for thiamine biosynthesis. The kinase activity is involved in the
    salvage synthesis of TH-P from the thiazole. Condenses 4-methyl-5-(beta-hydroxyethyl)thiazole
    monophosphate (THZ-P) and 2-methyl-4-amino-5-hydroxymethyl pyrimidine pyrophosphate
    (HMP-PP) to form thiamine monophosphate (TMP).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41835
  source_id: P41835
- source: Alliance_Imported
  text: Thiamine-phosphate diphosphorylase and hydroxyethylthiazole kinase; required
    for thiamine biosynthesis; GFP-fusion protein localizes to the cytoplasm in a
    punctate pattern
  source_type: curated
  url: https://www.yeastgenome.org/locus/THI6
  source_id: SGD:S000006135
- source: Alliance_Automated
  text: Enables hydroxyethylthiazole kinase activity and thiamine-phosphate diphosphorylase
    activity. Involved in thiamine biosynthetic process. Located in cytosol.
  source_type: automated
  url: https://www.yeastgenome.org/locus/THI6
  source_id: SGD:S000006135
