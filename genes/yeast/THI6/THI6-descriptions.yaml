descriptions:
- source: UniProt
  text: Essential for thiamine biosynthesis. The kinase activity is involved in the
    salvage synthesis of TH-P from the thiazole. Condenses 4-methyl-5-(beta-hydroxyethyl)thiazole
    monophosphate (THZ-P) and 2-methyl-4-amino-5-hydroxymethyl pyrimidine pyrophosphate
    (HMP-PP) to form thiamine monophosphate (TMP).
