descriptions:
- source: UniProt
  text: Lipid phosphatase which dephosphorylates phosphatidylinositol 3-monophosphate
    (PI3P). Involved in the control of PI3P-dependent signaling and in the maintenance
    of endosomal system integrity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47147
  source_id: P47147
- source: Alliance_Imported
  text: Phosphatidylinositol 3-phosphate (PI3P) phosphatase; involved in various protein
    sorting pathways, including CVT targeting and endosome to vacuole transport; has
    similarity to the conserved myotubularin dual specificity phosphatase family
  source_type: curated
  url: https://www.yeastgenome.org/locus/YMR1
  source_id: SGD:S000003871
- source: Alliance_Automated
  text: Enables mRNA binding activity and phosphatidylinositol-3-phosphate phosphatase
    activity. Involved in phosphatidylinositol dephosphorylation. Located in cytoplasm.
    Used to study Charcot-Marie-Tooth disease and centronuclear myopathy X-linked.
    Human ortholog(s) of this gene implicated in Charcot-Marie-Tooth disease type
    4B1; centronuclear myopathy X-linked; congenital structural myopathy; and disease
    of metabolism. Orthologous to several human genes including MTMR7 (myotubularin
    related protein 7) and MTMR8 (myotubularin related protein 8).
  source_type: automated
  url: https://www.yeastgenome.org/locus/YMR1
  source_id: SGD:S000003871
