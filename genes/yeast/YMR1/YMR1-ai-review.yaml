    label: phosphatidylinositol phosphate biosynthetic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-242
  review:
    summary: YeastPathways RCA places all PWY3O-242 enzymes in 'phosphatidylinositol phosphate biosynthetic process'.
      Ymr1 converts PtdIns3P to PI, i.e. it degrades a PIP; its process is phosphatidylinositol dephosphorylation
      (already annotated).
    action: MODIFY
    reason: YeastPathways PWY3O-242 groups phosphoinositide kinases and phosphatases under a single pathway
      label; Ymr1 hydrolyses the D-3 phosphate of PtdIns3P to produce unphosphorylated phosphatidylinositol
      (PMID:10900271), which is a catabolic dephosphorylation rather than phosphatidylinositol phosphate
      biosynthesis. This is a lateral replacement to GO:0046856 (phosphatidylinositol dephosphorylation),
      which the gene already carries.
    proposed_replacement_terms:
    - id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    supported_by:
    - *id001
