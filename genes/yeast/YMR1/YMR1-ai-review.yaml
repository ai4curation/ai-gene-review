  label: Saccharomyces cerevisiae S288C
description: Ymr1 (YJR110W) is the single myotubularin-family lipid phosphatase of Saccharomyces cerevisiae. Its
  CX5R protein-tyrosine-phosphatase-like domain hydrolyses the 3-phosphate of phosphatidylinositol 3-phosphate to
  yield phosphatidylinositol (EC 3.1.3.64). Ymr1 is a cytoplasmic protein; ymr1 deletion raises cellular PtdIns3P,
  and together with the synaptojanin-like phosphatases Sjl2/Inp52 and Sjl3/Inp53 it limits the level and restricts
  the distribution of Vps34-generated PtdIns3P. ymr1 sjl3 double mutants accumulate PtdIns3P on the vacuole membrane,
  with vacuolar protein sorting defects and vacuole fragmentation, and ymr1 sjl2 sjl3 triple mutants are inviable,
  showing that phosphatase-mediated PtdIns3P turnover is essential for endosomal system integrity.
