- source: Alliance_Automated
  text: Enables ATP hydrolysis activity. Involved in several processes, including
    cellular response to heat; protein folding; and protein-containing complex assembly.
    Located in mitochondrion and plasma membrane. Used to study cancer. Human ortholog(s)
    of this gene implicated in infertility and multiple sclerosis. Orthologous to
    several human genes including HSP90AB1 (heat shock protein 90 alpha family class
    B member 1).
