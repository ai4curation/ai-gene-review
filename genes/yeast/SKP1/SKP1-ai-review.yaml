      the Cdc53-Hrt1 core, the activity it enables is ubiquitin ligase complex scaffold activity (GO:0160072),
      the term used for human SKP1 in the SCF GO-CAM models. Skp1 and Cdc53 are the shared core of all
      thirteen reconstituted complexes.
