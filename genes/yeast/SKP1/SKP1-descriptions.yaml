descriptions:
- source: UniProt
  text: Essential component of the E3 ubiquitin ligase complex SCF (SKP1-CUL1-F-box
    protein) ubiquitin ligase complex, which mediates the ubiquitination and subsequent
    proteasomal degradation of target proteins like phosphorylated SIC1. Participates
    in the attachment of chromosomes to the spindle. Acts as a regulatory component
    of the centromere DNA-binding protein complex CBF3, which is essential for chromosome
    segregation and movement of centromeres along microtubules. CBF3 is required for
    the recruitment of other kinetochore complexes to CEN DNA. It plays a role in
    the attachment of chromosomes to the spindle and binds selectively to a highly
    conserved DNA sequence called CDEIII, found in centromeres and in several promoters.
    The association of CBF3C with CBF3D and SGT1 is required for CBF3C activation
    and CBF3 assembly. SKP1/CBF3D could retrieve cyclins or cyclin-CDK-like proteins
    into the kinetochore thus providing cell cycle-regulated kinetochore activity.
    Involved in the regulation of methionine biosynthesis genes. Facilitates association
    of CDC53 with CDC4 and of ROY1 with YPT52.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52286
  source_id: P52286
- source: Alliance_Imported
  text: Evolutionarily conserved kinetochore protein; part of multiple protein complexes,
    including the SCF ubiquitin ligase complex, the CBF3 complex that binds centromeric
    DNA, and the RAVE complex that regulates assembly of the V-ATPase; protein abundance
    increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/SKP1
  source_id: SGD:S000002736
- source: Alliance_Automated
  text: Enables DNA replication origin binding activity. Contributes to ubiquitin
    protein ligase activity. Involved in several processes, including mitotic cell
    cycle phase transition; negative regulation of gene expression; and protein-containing
    complex assembly. Located in cytoplasm; kinetochore; and nucleus. Part of CBF3
    complex; RAVE complex; and SCF ubiquitin ligase complex. Orthologous to human
    SKP1 (S-phase kinase associated protein 1).
  source_type: automated
