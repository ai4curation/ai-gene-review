      notes: Accurate but uses hedging language (may act, seems to play).
    - rubric: utility
      score: 4
      notes: Good mechanistic detail about substrate specificity (monoglucosylated
        glycoproteins).
    - rubric: compactness
      score: 3
      notes: Moderately long.
    - rubric: completeness
      score: 4
      notes: Covers substrate recognition, ER retention, and quality control.
    - rubric: specificity
      score: 4
      notes: Mentions monoglucosylated glycoproteins which is specific to calnexin
        function.
    overall_notes: Good description covering monoglucosylated glycoprotein interaction,
      protein assembly assistance, ER retention of unfolded proteins, and quality
      control role.
- source: Alliance_Imported
  text: Calnexin; integral membrane ER chaperone involved in folding and quality control
    of glycoproteins; chaperone activity is inhibited by Mpd1p, with which Cne1p interacts;
    24% identical to mammalian calnexin; Ca+ binding not yet shown in yeast
