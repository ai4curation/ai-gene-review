id: P27825
gene_symbol: CNE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: CNE1 encodes the budding yeast calnexin homolog, an ER membrane lectin
  chaperone of the calreticulin/calnexin family. Cne1 promotes ER protein quality
  control by binding glycosylated folding intermediates, assisting folding or retention
  of misfolded glycoproteins, and contributing to ER-associated degradation decisions.
