core_functions:
- description: Cne1p is an ER membrane lectin chaperone that assists folding and quality-control
    retention of glycoprotein folding intermediates. Direct studies support ER localization,
    chaperone activity, and contribution to ER protein quality control/ERAD, while
    direct Ca2+ binding was not detected.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  - id: GO:0036503
    label: ERAD pathway
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:15173200
    supporting_text: Cne1p effectively suppressed the thermal denaturation of CS and
      enhanced the refolding of thermally or chemically denatured CS in a concentration-dependent
      manner.
    reference_section_type: ABSTRACT
  - reference_id: PMID:7814381
    supporting_text: Hence, Cne1p appears to function as a constituent of the S. cerevisiae
      ER protein quality control apparatus.
    reference_section_type: ABSTRACT
  - reference_id: PMID:25229868
    supporting_text: These results suggest that in yeasts, Cne1p interacts with misfolded
      lysozyme proteins possibly causing their retention in the ER and subsequent
      elimination via ER-associated degradation.
    reference_section_type: ABSTRACT
- description: Cne1p recognizes monoglucosylated oligosaccharide features through
    its calnexin lectin site, coupling glycan recognition to ER folding and retention
    decisions for glycoprotein clients.
