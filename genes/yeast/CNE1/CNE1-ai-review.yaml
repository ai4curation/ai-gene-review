- id: PMID:15173200
  title: Expression and characterization of Saccharomyces cerevisiae Cne1p, a calnexin
    homologue.
  findings:
  - statement: Recombinant Cne1p shows chaperone activity and lectin-site dependence
      in citrate synthase denaturation/refolding assays.
    supporting_text: Cne1p effectively suppressed the thermal denaturation of CS and
      enhanced the refolding of thermally or chemically denatured CS in a concentration-dependent
      manner. In addition, the chaperone function of Cne1p was greatly affected in
      the presence of monoglucosylated oligosaccharides (G1M9) that specifically bind
      to the lectin site.
- id: PMID:15251457
  title: P-domain and lectin site are involved in the chaperone function of Saccharomyces
    cerevisiae calnexin homologue.
  findings:
  - statement: Cne1p lectin-site and P-domain mutants demonstrate that both regions
      contribute to full chaperone activity.
    supporting_text: These results suggest that the cooperation between the P-domain
      and the lectin site are important for the complete function of Cne1p. Thus,
      we conclude that P-domain in cooperation with the lectin site of Cne1p functions
      as a chaperone.
- id: PMID:16002399
  title: Interactions among yeast protein-disulfide isomerase proteins and endoplasmic
    reticulum chaperone proteins influence their activities.
  findings:
  - statement: Cne1p interacts functionally with ER oxidoreductase Mpd1p, supporting
      a role in the ER folding/chaperone network but not a generic protein-binding
      annotation.
    supporting_text: Mpd1p alone does not have chaperone activity but that it interacts
      with and inhibits the chaperone activity of Cne1p
- id: PMID:25229868
  title: Unstable mutant lysozymes are degraded through the interaction with calnexin
    homolog Cne1p in Saccharomyces cerevisiae.
  findings:
  - statement: Cne1p interacts with unstable misfolded lysozymes and promotes their
      ER retention and subsequent elimination via ER-associated degradation.
    supporting_text: These results suggest that in yeasts, Cne1p interacts with misfolded
      lysozyme proteins possibly causing their retention in the ER and subsequent
      elimination via ER-associated degradation.
- id: PMID:26928762
  title: 'One library to make them all: streamlining the creation of yeast libraries
    via a SWAp-Tag strategy.'
  findings: []
- id: PMID:7814381
  title: Saccharomyces cerevisiae CNE1 encodes an endoplasmic reticulum (ER) membrane
    protein with sequence similarity to calnexin and calreticulin and functions as
    a constituent of the ER quality control apparatus.
  findings:
  - statement: Cne1p is an ER membrane glycoprotein, and the same study reported no
      detectable Ca2+ binding for Cne1p.
    supporting_text: Furthermore, based on its changed mobility from 76 to 60 kDa
      after endoglycosidase H digestion Cne1p was shown to be N-glycosylated. Localization
      of the Cne1p protein by differential and analytical subcellular fractionation
      as well as by confocal immunofluorescence microscopy showed that it was exclusively
      located in the endoplasmic reticulum (ER), despite the lack of known ER retention
      motifs. Although six Ca(2+)-binding proteins were detected in the ER fractions,
      they were all soluble proteins, and Ca2+ binding activity has not been detected
      for Cne1p.
- id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
  title: PTHR11073 PAINT ancestral annotations for the calreticulin/calnexin family
  findings:
  - statement: PTHR11073 PAINT places the CNE1 protein-folding, ERAD quality-control
      pathway, calcium-binding, and endoplasmic-reticulum-membrane IBA assertions
      on the PTN000117401 calreticulin/calnexin root.
- id: file:yeast/CNE1/CNE1-deep-research-falcon.md
  title: Falcon deep research report for CNE1
  findings:
  - statement: The Falcon report was reviewed and synthesized into the CNE1 curation,
      including core-function framing, family/PANTHER context, and evidence limitations.
