proposed_new_terms:
- proposed_name: monoglucosylated oligosaccharide binding
  proposed_definition: Binding to monoglucosylated N-linked glycan structures on glycoprotein
    folding intermediates in the endoplasmic reticulum.
  justification: Cne1p is a calnexin-family lectin chaperone whose relevant carbohydrate
    specificity is monoglucosylated N-linked oligosaccharide recognition, making
    GO:0070492 oligosaccharide binding the closest currently annotatable term and
    more specific than broad carbohydrate binding.
  proposed_parent:
    id: GO:0070492
    label: oligosaccharide binding
  supported_by:
  - reference_id: PMID:15173200
    supporting_text: the chaperone function of Cne1p was greatly affected in the presence
      of monoglucosylated oligosaccharides (G1M9) that specifically bind to the lectin
      site.
    reference_section_type: ABSTRACT
  - reference_id: PMID:15251457
    supporting_text: The binding of monoglucosylated oligosaccharide (G1M9) with Cne1p
      was clearly demonstrated using lectin site mutants.
    reference_section_type: ABSTRACT
suggested_questions:
- question: What are the endogenous yeast glycoprotein clients whose ER retention
    or ERAD depends directly on Cne1p lectin-chaperone activity?
suggested_experiments:
- hypothesis: Cne1p-dependent ERAD is selective for monoglucosylated glycoprotein
    clients rather than general unfolded proteins.
  description: Use Cne1p proximity labeling or crosslinking immunoprecipitation under
    ER stress, with glycosylation-defective and lectin-site mutant controls, followed
    by quantitative client identification.
  experiment_type: proximity labeling and glycoprotein client proteomics
