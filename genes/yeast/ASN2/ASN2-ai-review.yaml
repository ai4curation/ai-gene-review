  review:
    summary: Gavin et al. genome-wide TAP-MS co-purified ASN2 with its paralog Asn1 (P49089). The pair may form hetero-oligomers,
      but 'protein binding' conveys no function and there is no evidence the interaction modulates activity. Removal does
      not imply the interaction is false.
    action: REMOVE
    reason: Uninformative 'protein binding' from high-throughput co-purification of paralogs.
    supported_by:
    - reference_id: PMID:16429126
      supporting_text: Here we report the first genome-wide screen for complexes in an organism, budding yeast, using affinity
        purification and mass spectrometry.
    - reference_id: PMID:6105958
      supporting_text: both have a molecular weight of 150,000 and they exhibit a slight repression and a similar inhibition
        by asparagine.
