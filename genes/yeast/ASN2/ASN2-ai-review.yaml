taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Asparagine synthetase [glutamine-hydrolyzing] 2 of Saccharomyces cerevisiae (EC 6.3.5.4), a cytosolic class-II
  glutamine amidotransferase that converts L-aspartate, L-glutamine and ATP into L-asparagine, L-glutamate, AMP and diphosphate.
  Asn2 is a highly abundant paralog of Asn1; the two enzymes are biochemically very similar and functionally redundant, so
  that only the asn1 asn2 double mutant requires asparagine. ASN2 expression depends on Gcn4 but, unlike ASN1, not on the
  HAP complex.
