- source: UniProt
  text: Has kinase activity and phosphorylates inositol-1,3,4,5,6- pentakisphosphate
    (Ins(1,3,4,5,6)P5) to produce 1,2,3,4,5,6- hexakisphosphate (InsP6), also known
    as phytate.
