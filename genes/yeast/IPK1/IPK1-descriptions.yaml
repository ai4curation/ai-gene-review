gene_symbol: IPK1
organism: yeast
uniprot_id: Q06667
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Has kinase activity and phosphorylates inositol-1,3,4,5,6- pentakisphosphate
    (Ins(1,3,4,5,6)P5) to produce 1,2,3,4,5,6- hexakisphosphate (InsP6), also known
    as phytate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06667
  source_id: Q06667
- source: Alliance_Imported
  text: Inositol 1,3,4,5,6-pentakisphosphate 2-kinase; nuclear protein required for
    synthesis of 1,2,3,4,5,6-hexakisphosphate (phytate), which is integral to cell
    function; has 2 motifs conserved in other fungi; ipk1 gle1 double mutant is inviable;
    human IPPK can complement ipk1 null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/IPK1
  source_id: SGD:S000002723
- source: Alliance_Automated
  text: Enables inositol-1,3,4,5,6-pentakisphosphate 2-kinase activity. Involved in
    inositol phosphate biosynthetic process and nuclear-transcribed mRNA catabolic
    process, non-stop decay. Located in nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/IPK1
  source_id: SGD:S000002723
