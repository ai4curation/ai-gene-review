- term:
    id: GO:0070481
    label: nuclear-transcribed mRNA catabolic process, non-stop decay
  evidence_type: IMP
  original_reference_id: PMID:17660569
  qualifier: involved_in
  review:
    summary: 'IMP from Wilson et al. 2007 (nonstop mRNA genomic screen): ipk1 deletion suppresses the
      his3-nonstop phenotype. The full text shows this is because ipk1 cells accumulate the substrate
      IP5 (the effect disappears in ipk1 ipk2 double mutants), and it explicitly rules out a separate
      function of Ipk1 in nonstop decay. Ipk1 itself therefore does not participate in non-stop decay;
      the phenotype is an indirect metabolic consequence of losing the IP5 2-kinase.'
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:17660569
      supporting_text: Therefore, these results suggest that the suppression phenotype that we observed
        in an ipk1 Δ strain is a result of the accumulation of IP5 and not a second, unrelated function
        of Ipk1p.
