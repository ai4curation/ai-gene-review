description: IPK1 (GSL1, YDR315C) encodes inositol-1,3,4,5,6-pentakisphosphate 2-kinase (EC 2.7.1.158),
  the enzyme that phosphorylates the axial 2-hydroxyl of Ins(1,3,4,5,6)P5 to produce inositol hexakisphosphate
  (IP6, phytate), the final step of the Plc1-Arg82-Ipk1 pathway from PI(4,5)P2 to IP6. Ipk1 is highly
  selective for IP5 and is the sole route to IP6 in yeast; ipk1 cells lack IP6 and accumulate IP5. Ipk1
  was identified in a gle1 synthetic-lethal screen, and its nuclear IP6 product is required for efficient
  Gle1/Dbp5-dependent mRNA export and supplies the substrate for inositol pyrophosphate synthesis by Kcs1
  and Vip1.
