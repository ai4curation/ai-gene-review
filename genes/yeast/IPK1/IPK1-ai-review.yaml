suggested_questions:
- question: "Is IP6 synthesis by Ipk1 compartmentalised (nuclear versus cytoplasmic pools), and how\n\
    \                much of the IP6 used by Kcs1/Vip1 for inositol pyrophosphate synthesis is made in\
    \ the nucleus?"
- question: "What is the molecular target through which accumulated IP5 in ipk1 cells inhibits\n     \
    \           nonstop mRNA decay?"
suggested_experiments:
- description: "Express nucleus-excluded (NES-tagged) Ipk1 in ipk1 cells and measure IP6, PP-IP levels\n\
    \                and mRNA export to test whether nuclear localization is required."
