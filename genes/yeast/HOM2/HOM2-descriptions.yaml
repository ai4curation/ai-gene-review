gene_symbol: HOM2
organism: yeast
uniprot_id: P13663
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the NADPH-dependent formation of L-aspartate 4- semialdehyde (L-ASA)
    by the reductive dephosphorylation of 4-phospho-L- aspartate (PubMed:4145650).
    Mediates the second step in the biosynthesis of amino acids that derive from aspartate
    (the aspartate family of amino acids), including methioinine and threonine, the
    latter of which is a precursor to isoleucine (PubMed:4145650).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13663
  source_id: P13663
- source: Alliance_Imported
  text: Aspartic beta semi-aldehyde dehydrogenase; catalyzes the second step in the
    common pathway for methionine and threonine biosynthesis; expression regulated
    by Gcn4p and the general control of amino acid synthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/HOM2
  source_id: SGD:S000002565
- source: Alliance_Automated
  text: Enables aspartate-semialdehyde dehydrogenase (NADP+) activity. Involved in
    L-homoserine biosynthetic process; L-methionine biosynthetic process; and L-threonine
    biosynthetic process. Located in cytoplasm; nucleus; and plasma membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/HOM2
  source_id: SGD:S000002565
