  review:
    summary: HOM2 contributes to sulfur amino-acid biosynthesis through the methionine branch of the aspartate
      pathway.
    action: MODIFY
    reason: 'HOM2 reduces aspartyl phosphate to aspartate semialdehyde, a chemical step of the shared
      route leading to methionine. The YeastPathways PWY-821-1 assignment therefore correctly captures
      biosynthetic participation: sulfur incorporation by a different enzyme is not required. Refine the
      true broad sulfur amino-acid process to the already supported L-methionine biosynthetic process,
      its specific branch here.'
    supported_by:
