- id: PMID:39349514
  title: Non-canonical chromatin-based functions for the threonine metabolic pathway.
  findings:
  - statement: Deletion affects rDNA silencing, with rescue by excess threonine supporting a nutrient-dependent
      effect rather than a demonstrated direct chromatin activity.
    supporting_text: The hom3Δ, hom2Δ, and thr4Δ silencing defects are rescued when medium is supplemented
      with exogenous threonine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text reviewed, including catalytic-mutant, nutrient-rescue and plasmid-end-joining
      experiments. These establish functional distinctions but do not identify a new repair catalytic
      activity.
- id: PMID:26936955
  title: Functions for diverse metabolic activities in heterochromatin.
  findings:
  - statement: Earlier silencing screens identify Hom2/Hom6 phenotypes; the detailed Gdh1 mechanism cannot
      be assigned to these proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text reviewed; distinguish target-specific reporter phenotypes from mechanistic
      experiments on Gdh1.
- id: PMID:29959064
  title: Dihydrodipicolinate synthase is absent in fungi.
  findings:
  - statement: Direct characterization of alleged fungal DHDPS candidates supports the alpha-aminoadipate
      rather than DAP lysine route in fungi.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly reports biochemical and complementation tests in Coccidioides and
      Fonsecaea. Used as comparative pathway evidence, not a direct assay of yeast Hom2.
- id: url:https://www.nature.com/articles/srep21067
  title: Structural Insights into the Tetrameric State of Aspartate-β-semialdehyde Dehydrogenases from
    Fungal Species
  findings:
  - statement: Fungal ASADH forms a functional tetramer organized as a dimer of dimers; Trichophyton interface
      mutants link assembly with catalysis.
    supporting_text: The tetrameric organization of trASADH can best be described as “a dimer-of-dimers”
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher text fetched normally after PMID fetch returned HTTP429. Trichophyton
      is the detailed structural/functional target; yeast and pombe sequence comparisons support family
      inference rather than native pombe kinetics.
