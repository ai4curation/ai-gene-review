    summary: InterPro parent MF (aldehyde/oxo-group oxidoreductase, NAD or NADP acceptor); correct but
      less specific than GO:0004073.
    action: MODIFY
    reason: HOM2 reduces the acyl-phosphate substrate aspartyl phosphate to aspartate semialdehyde using
      NADPH. The conserved ASADH assignment supports this specific substrate/cofactor reaction within
      the broader aldehyde/oxo-group oxidoreductase class; refine to GO:0004073, already reviewed for
      this gene.
