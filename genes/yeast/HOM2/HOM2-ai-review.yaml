- term:
    id: GO:0009085
    label: L-lysine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012080
  review:
    summary: The broad ASADH family mapping incorrectly imports the DAP-pathway lysine role into this
      fungal enzyme.
    action: REMOVE
    reason: InterPro:IPR012080 groups ASADH enzymes whose aspartate-semialdehyde product feeds bacterial
      DAP/lysine biosynthesis, but this branch assignment does not transfer to budding yeast. Native S.
      cerevisiae mutant and enzyme analyses in PMID:23106124 establish the alternative alpha-aminoadipate
      route through homocitrate/homoaconitate and Aco2/Lys4, starting from acetyl-CoA and 2-oxoglutarate
      rather than Hom2-derived aspartate semialdehyde. PMID:29959064 independently revisits the alleged
      fungal DAP enzymes in other fungal species. Remove the taxonomically misplaced pathway inference,
      not the conserved ASADH activity.
    supported_by:
    - reference_id: PMID:29959064
      supporting_text: 'we believe that DHDPS and the DAP pathway

        are absent in fungi'
    - reference_id: file:yeast/HOM2/HOM2-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'FUNCTION: Catalyzes the NADPH-dependent formation of L-aspartate 4-'
    - reference_id: PMID:23106124
