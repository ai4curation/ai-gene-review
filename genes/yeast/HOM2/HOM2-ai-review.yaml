- term:
    id: GO:0051287
    label: NAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000534
  review:
    summary: InterPro (IPR000534, 'semialdehyde dehydrogenase, NAD-binding' domain) NAD binding. The domain
      name describes the Rossmann-like fold, not the cofactor specificity; the yeast enzyme is characterised
      as NADP(H)-dependent.
    action: MODIFY
    reason: The IPR000534 dinucleotide-binding domain identifies a Rossmann-type fold, but does not by
      itself distinguish NAD from NADP. The curated HOM2 reaction and the characterized fungal ASADH mechanism
      support NADP(H). Modify to NADP binding on that positive specificity evidence; no claim is made
      that NAD cannot bind at any concentration.
    supported_by:
    - reference_id: file:yeast/HOM2/HOM2-uniprot.txt
      record_section:
