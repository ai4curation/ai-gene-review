id: P13663
gene_symbol: HOM2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Aspartate-semialdehyde dehydrogenase (ASADH, EC 1.2.1.11) of Saccharomyces cerevisiae. Hom2
  catalyses the second step of the aspartate pathway, the NADPH-dependent reductive dephosphorylation
  of L-4-aspartyl phosphate to L-aspartate 4-semialdehyde, which is then reduced to homoserine by Hom6.
  Homoserine is the branch point for threonine (and hence isoleucine) and methionine synthesis, so hom2
  mutants require threonine and methionine. Hom2 is a soluble cytosolic homotetramer; GFP data also show
  a nuclear pool, and rDNA-silencing phenotypes have been reported; rescue of the silencing defect by
  threonine indicates that the phenotype can reflect metabolic supply.
