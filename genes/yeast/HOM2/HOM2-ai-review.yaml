    label: L-lysine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012080
  review:
    summary: The broad ASADH family mapping incorrectly imports the DAP-pathway lysine role into this
      fungal enzyme.
    action: REMOVE
    reason: Budding and fission yeast use the alpha-aminoadipate lysine pathway rather than the aspartate-semialdehyde
      DAP branch. PMID29959064 tested alleged fungal DHDPS candidates and supports that distinction; its
      experimental species are Coccidioides and Fonsecaea, not these yeast targets. This is a taxon-specific
      pathway mismatch, not rejection because lysine lies outside a chosen module.
    supported_by:
    - reference_id: PMID:29959064
      supporting_text: 'we believe that DHDPS and the DAP pathway

        are absent in fungi'
    - reference_id: file:yeast/HOM2/HOM2-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'FUNCTION: Catalyzes the NADPH-dependent formation of L-aspartate 4-'
