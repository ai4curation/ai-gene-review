- term:
    id: GO:0046983
    label: protein dimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012280
  review:
    summary: Conserved homomeric interface formation is part of fungal ASADH assembly; the functional
      complex is tetrameric rather than an isolated active dimer.
    action: ACCEPT
    reason: The InterPro dimerization-domain inference is supported by the fungal dimer-of-dimers architecture
      in the comparative structure study. A tetramer does not contradict formation of its constituent
      dimer interfaces. The detailed structural assay is Trichophyton; transfer to this target is a family
      inference, supported for budding yeast by the curated homotetramer record, and is not a target-specific
      native dimer measurement.
    supported_by:
    - reference_id: url:https://www.nature.com/articles/srep21067
      supporting_text: The tetrameric organization of trASADH can best be described as “a dimer-of-dimers”
- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000319
  - InterPro:IPR005676
  - InterPro:IPR012080
  review:
    summary: InterPro NADP binding; Hom2 uses NADP(H) as cosubstrate (Km for NADP+ 36 uM).
    action: ACCEPT
    reason: Budding-yeast Hom2 is an NADP(H)-dependent aspartate-semialdehyde dehydrogenase; the curated
      kinetic data report NADP+ binding with a Km of 36 micromolar. NADP binding is part of its central
      redox chemistry, not an unrelated peripheral activity.
    supported_by:
