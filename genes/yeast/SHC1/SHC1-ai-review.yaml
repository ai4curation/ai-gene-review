- term:
    id: GO:0030437
    label: ascospore formation
  evidence_type: IDA
  original_reference_id: PMID:11918806
  qualifier: involved_in
  review:
    summary: shc1/shc1 diploids sporulate and undergo meiosis normally, but their ascospores lack chitosan,
      are DAPI-permeable and glusulase-sensitive. The defect is specifically in spore wall maturation,
      so ascospore wall assembly is the more precise process.
    action: MODIFY
    reason: Shc1 is not required for ascospore formation per se (sporulation rate and meiosis normal);
      it is required for building the chitosan layer of the ascospore wall.
    proposed_replacement_terms:
    - id: GO:0030476
      label: ascospore wall assembly
    supported_by:
    - reference_id: PMID:11918806
      supporting_text: shc1/shc1 mutants do not show any defect in the total rate of sporulation and meiosis
        occurs normally.
    - reference_id: PMID:11918806
      supporting_text: All these observations indicate that Shc1p is required for proper maturation of
        the ascospore through its participation in the synthesis of the chitosan layer.
    - reference_id: PMID:11918806
      supporting_text: have very low levels of chitosan in their cell walls.
