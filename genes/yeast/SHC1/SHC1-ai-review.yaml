description: Shc1 (YER096W) is the sporulation-specific paralog of the chitin synthase III activator Skt5/Chs4
  in Saccharomyces cerevisiae. SHC1 is not expressed in vegetative cells but is induced as a mid-late
  sporulation gene (and at high pH). During spore formation Shc1 traffics with Chs3 from cytoplasmic puncta
  to the prospore membrane and activates chitin synthase III to make the chitin that is deacetylated into
  the chitosan layer of the ascospore wall; shc1 homozygous spores lack chitosan and are sensitive to
  glusulase. Unlike Chs4, Shc1 is not needed to localize Chs3, and when overexpressed in vegetative cells
  it can activate but not properly target CSIII.
