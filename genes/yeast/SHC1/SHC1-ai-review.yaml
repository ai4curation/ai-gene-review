suggested_questions:
- question: Is Shc1 needed for Chs3 activity in the high-pH (Rim101) response where SHC1 is also induced?
suggested_experiments:
- hypothesis: Shc1 activates Chs3 directly at the prospore membrane.
  description: Measure CSIII activity in prospore membrane fractions from wild-type, shc1 and chs4 shc1
    sporulating diploids, and test complementation with a CHS4 allele resistant to sporulation-specific
    degradation.
