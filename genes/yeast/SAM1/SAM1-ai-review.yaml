gene_symbol: SAM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Sam1 (Eth10) is one of the two S-adenosylmethionine synthetases (methionine adenosyltransferases,
  EC 2.5.1.6) of Saccharomyces cerevisiae; Sam2 is the paralogue. Sam1 joins L-methionine and ATP to form
  S-adenosyl-L-methionine (AdoMet), passing through a tripolyphosphate intermediate that it hydrolyses
  to phosphate and pyrophosphate. AdoMet is the methyl donor for almost all methylation reactions, including
  histone, nucleic acid, lipid and small-molecule methylation; it is the aminopropyl donor for polyamine
  synthesis; and it is the first intermediate of the methionine (activated methyl) cycle. Sam1 and Sam2
  are partially redundant: sam1 sam2 double mutants lack AdoMet synthesis and need AdoMet, while the single
  mutants are viable. The two proteins interact physically and form heteromeric enzymes. Sam1 is a soluble
  cytoplasmic enzyme. It is part of the SESAME metabolic-enzyme complex, which supplies AdoMet to the
  Set1 H3K4 methyltransferase at target genes. It is recruited to stress granules under some stresses,
  such as heat shock, and its product AdoMet acutely suppresses stress-granule assembly.'
