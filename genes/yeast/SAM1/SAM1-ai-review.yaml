    summary: IMP from a 1973 study of ethionine-resistant regulatory mutants (eth2, eth3, eth10; ETH10
      = SAM1) that measured methionine and AdoMet pools (PMID:4580557). Sam1 converts methionine to AdoMet
      and does not itself regenerate methionine. Methionine is regenerated either through the activated
