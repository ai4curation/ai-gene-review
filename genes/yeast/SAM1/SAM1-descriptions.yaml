gene_symbol: SAM1
organism: yeast
uniprot_id: P10659
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: 'Catalyzes the formation of S-adenosylmethionine from methionine and ATP.
    The reaction comprises two steps that are both catalyzed by the same enzyme: formation
    of S-adenosylmethionine (AdoMet) and triphosphate, and subsequent hydrolysis of
    the triphosphate.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P10659
  source_id: P10659
- source: Alliance_Imported
  text: S-adenosylmethionine synthetase; catalyzes transfer of the adenosyl group
    of ATP to the sulfur atom of methionine; SAM1 has a paralog, SAM2, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SAM1
  source_id: SGD:S000004170
- source: Alliance_Automated
  text: Enables methionine adenosyltransferase activity. Involved in L-methionine
    salvage and S-adenosylmethionine biosynthetic process. Acts upstream of or within
    negative regulation of cytoplasmic stress granule assembly. Located in cytoplasmic
    stress granule. Human ortholog(s) of this gene implicated in hypermethioninemia
    and lung cancer. Orthologous to several human genes including MAT1A (methionine
    adenosyltransferase 1A).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SAM1
  source_id: SGD:S000004170
