gene_symbol: TAM41
organism: yeast
uniprot_id: P53230
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the formation of CDP-diacylglycerol (CDP-DAG) from phosphatidic
    acid (PA) in the mitochondrial inner membrane. Required for the biosynthesis of
    the dimeric phospholipid cardiolipin, which stabilizes supercomplexes of the mitochondrial
    respiratory chain in the mitochondrial inner membrane.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53230
  source_id: P53230
- source: Alliance_Imported
  text: Mitochondrial phosphatidate cytidylyltransferase (CDP-DAG synthase); required
    for cardiolipin biosynthesis; viability of null mutant is strain-dependent; mRNA
    is targeted to the bud; mutant displays defect in mitochondrial protein import,
    likely due to altered membrane lipid composition
  source_type: curated
  url: https://www.yeastgenome.org/locus/TAM41
  source_id: SGD:S000003278
- source: Alliance_Automated
  text: Enables phosphatidate cytidylyltransferase activity. Involved in cardiolipin
    biosynthetic process. Located in mitochondrial inner membrane and mitochondrial
    matrix. Used to study mitochondrial metabolism disease. Human ortholog(s) of this
    gene implicated in combined oxidative phosphorylation deficiency 56. Orthologous
    to human TAMM41 (TAM41 mitochondrial translocator assembly and maintenance homolog).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TAM41
  source_id: SGD:S000003278
