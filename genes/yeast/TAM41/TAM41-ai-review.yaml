suggested_questions:
- question: How does matrix-facing Tam41 access phosphatidic acid in the inner membrane, and which transfer
    system (e.g. Ups1-Mdm35) supplies the PA pool it uses?
suggested_experiments:
- description: Reconstitute purified Tam41 with PA-containing liposomes of varying cardiolipin/PE content
    to test membrane binding and lipid-composition dependence of CDP-DAG synthesis.
