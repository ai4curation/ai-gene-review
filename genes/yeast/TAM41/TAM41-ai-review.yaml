gene_symbol: TAM41
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TAM41 (MMP37, YGR046W) encodes the mitochondrial CDP-diacylglycerol synthase (phosphatidate
  cytidylyltransferase, EC 2.7.7.41) of S. cerevisiae. It is a peripheral protein of the inner mitochondrial
  membrane facing the matrix and converts phosphatidic acid and CTP into CDP-diacylglycerol, the precursor
  used by Pgs1 for phosphatidylglycerol and hence cardiolipin synthesis; the ER CDP-DAG synthase Cds1
  is not present in mitochondria. Purified Tam41 is active in vitro and needs Mg2+ (Co2+ and Cu2+ partly
  substitute). tam41 mutants lack cardiolipin and are temperature-sensitive, with secondary defects in
  TIM23/TIM22 protein import and respiratory supercomplex stability that were first interpreted as a direct
  translocator maintenance role but are explained by cardiolipin deficiency. Tam41 is unrelated in sequence
  to the CDS1-type integral-membrane synthases.
