gene_symbol: URA5
organism: yeast
uniprot_id: P13298
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the transfer of a ribosyl phosphate group from 5- phosphoribose
    1-diphosphate to orotate, leading to the formation of orotidine monophosphate
    (OMP).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13298
  source_id: P13298
- source: Alliance_Imported
  text: Major orotate phosphoribosyltransferase (OPRTase) isozyme; catalyzes the fifth
    enzymatic step in de novo biosynthesis of pyrimidines, converting orotate into
    orotidine-5'-phosphate; URA5 has a paralog, URA10, that arose from the whole genome
    duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/URA5
  source_id: SGD:S000004574
- source: Alliance_Automated
  text: Enables orotate phosphoribosyltransferase activity. Involved in 'de novo'
    pyrimidine nucleobase biosynthetic process and pyrimidine ribonucleoside biosynthetic
    process. Located in cytoplasm and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/URA5
  source_id: SGD:S000004574
fetch_date: '2026-11-01'
