id: P13298
gene_symbol: URA5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: URA5 encodes the major orotate phosphoribosyltransferase (OPRTase, EC 2.4.2.10) of Saccharomyces
  cerevisiae, the fifth enzyme of de novo pyrimidine biosynthesis. The homodimeric type I phosphoribosyltransferase
  (PyrE subfamily) transfers the 5-phosphoribosyl group of PRPP to orotate, forming orotidine 5'-monophosphate
  (OMP) and diphosphate; OMP is then decarboxylated to UMP by Ura3. Ura5 provides about 80% of cellular
  OPRTase activity; the paralogue Ura10 (>75% similar) supplies the remainder, which is why ura5 mutants
  are leaky and ura5 ura10 double mutants are uracil auxotrophs. Unlike the other late pathway genes,
  URA5 expression is not induced by pathway intermediates. Ura5 is a soluble cytoplasmic enzyme.
