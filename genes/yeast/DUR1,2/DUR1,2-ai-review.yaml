  label: Saccharomyces cerevisiae S288C
description: 'Urea amidolyase (Dur1,2p, YBR208C), a large cytoplasmic biotin-dependent multifunctional
  enzyme that degrades urea to ammonia and CO2 in two sequential reactions: an N-terminal amidase-signature
  allophanate hydrolase domain (EC 3.5.1.54) and a C-terminal biotin carboxylase/carboxyltransferase/biotin-carboxyl-carrier
  region that forms urea carboxylase (EC 6.3.4.6). Urea carboxylase ATP-dependently carboxylates urea
  to allophanate (urea-1-carboxylate), which the allophanate hydrolase domain hydrolyses to 2 NH4+ and
  2 CO2. The two activities were originally mapped as the dur1 and dur2 loci but are domains of one polypeptide.
  Dur1,2 is the sole route of urea catabolism in S. cerevisiae (which lacks urease) and catalyses the
  final steps of allantoin degradation, releasing the nitrogen of urea produced by allantoicase (Dal2)
  and ureidoglycolate lyase (Dal3). Expression is induced by allophanate (or the gratuitous inducer oxalurate)
  and repressed by good nitrogen sources.'
