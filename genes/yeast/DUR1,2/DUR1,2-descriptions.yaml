- source: Alliance_Imported
  text: Urea amidolyase; contains both urea carboxylase and allophanate hydrolase
    activities, degrades urea to CO2 and NH3; expression sensitive to nitrogen catabolite
    repression and induced by allophanate, an intermediate in allantoin degradation;
    protein abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/DUR12
  source_id: SGD:S000000412
- source: Alliance_Automated
  text: Enables allophanate hydrolase activity and urea carboxylase activity. Involved
    in urea catabolic process. Located in cytoplasm. Human ortholog(s) of this gene
    implicated in 3-methylcrotonyl-CoA carboxylase 1 deficiency; amino acid metabolic
    disorder; and propionic acidemia. Orthologous to human MCCC1 (methylcrotonyl-CoA
    carboxylase subunit 1) and PCCA (propionyl-CoA carboxylase subunit alpha).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DUR12
