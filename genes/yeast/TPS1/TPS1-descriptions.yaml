descriptions:
- source: UniProt
  text: Synthase catalytic subunit of the trehalose synthase complex that catalyzes
    the production of trehalose from glucose-6-phosphate and UDP-alpha-D-glucose in
    a two step process. Can function independently of the complex.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q00764
  source_id: Q00764
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: synthase subunit of the trehalose complex, also active
      alone. Misses the T6P control of hexokinase that makes TPS1 essential on glucose.'
- source: Alliance_Imported
  text: Synthase subunit of trehalose-6-P synthase/phosphatase complex; synthesizes
    the storage carbohydrate trehalose, which is critically important for survival
    of long-term desiccation; also found in a monomeric form; expression is induced
    by the stress response and repressed by the Ras-cAMP pathway; protein abundance
    increases in response to DNA replication stress and in response to prolonged exposure
    to boric acid; required for pseudohyphal growth
  source_type: curated
  url: https://www.yeastgenome.org/locus/TPS1
  source_id: SGD:S000000330
