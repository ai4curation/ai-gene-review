  evidence_type: IMP
  original_reference_id: PMID:9837904
  qualifier: enables
  review:
    summary: Bell et al. 1998 found deletion of any complex subunit reduced T6P phosphatase activity,
      concluding that all subunits are required for optimal activity, while TPS2 deletion completely abolished
      it. Tps1 is a GT20 synthase and lacks the HAD-type trehalose-phosphatase domain present in Tps2,
      so the reduced TPP activity in tps1 mutants reflects complex integrity rather than Tps1 catalysis.
      Not removed because it is a curator-made experimental annotation, but it should not be read as Tps1
      having phosphatase activity.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:9837904
