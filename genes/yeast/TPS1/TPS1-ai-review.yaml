- description: 'Trehalose-6-phosphate synthase (UDP-forming): catalytic subunit of the trehalose synthase
    complex that condenses UDP-glucose and glucose 6-phosphate into trehalose 6-phosphate, the first step
    of trehalose biosynthesis; its product T6P also restrains hexokinase at the entry into glycolysis.'
