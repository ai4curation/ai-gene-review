id: Q00764
gene_symbol: TPS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'TPS1 encodes the 56 kDa catalytic subunit of trehalose-6-phosphate synthase (EC 2.4.1.15)
  of Saccharomyces cerevisiae, a glycosyltransferase family 20 enzyme that transfers glucose from UDP-glucose
  to glucose 6-phosphate to form trehalose 6-phosphate (T6P), the first step of trehalose biosynthesis.
  Tps1 forms the cytosolic trehalose synthase complex together with the T6P phosphatase Tps2 and the regulatory
  subunits Tsl1 or Tps3; a portion also exists as a free monomer whose activity is stimulated rather than
  inhibited by phosphate. Deletion of TPS1 abolishes T6P synthase activity and trehalose. Beyond trehalose
  synthesis, Tps1 (also known as GGS1/CIF1/FDP1/BYP1) is essential for growth on glucose and other rapidly
  fermented sugars: its product T6P restricts hexokinase and so prevents uncontrolled sugar phosphorylation
  at the onset of glycolysis. Trehalose made by the complex contributes to tolerance of heat and desiccation.'
