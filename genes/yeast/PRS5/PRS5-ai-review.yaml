id: Q12265
gene_symbol: PRS5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Prs5 (YOL061W) is one of five ribose-phosphate pyrophosphokinase (PRPP synthase) subunits in Saccharomyces cerevisiae.
  PRPP synthase forms 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) from ribose 5-phosphate and ATP (EC 2.7.6.1). PRPP is
  the ribose-phosphate donor for de novo and salvage synthesis of purine, pyrimidine and pyridine nucleotides and for histidine
  and tryptophan biosynthesis. S. cerevisiae has five PRS genes, and none of their products is active alone. Co-expression
  in E. coli shows that active enzyme needs specific pairs (Prs1 with Prs2, Prs3 or Prs4; Prs5 with Prs2 or Prs4), and enzyme
  stable in vitro needs at least three subunits. The cytosolic PRPP synthase is therefore a hetero-oligomeric complex of Prs
  subunits. Prs5 (496 aa) carries two non-homologous insertions (NHR5-1, NHR5-2) around its conserved divalent-cation and
  PRPP-binding motifs. It gives active enzyme with Prs2 or Prs4, and its deletion cuts cellular PRPP synthase activity by
  84% without affecting growth. prs5 is synthetically lethal with prs1 or prs3. In stationary or starved cells Prs5 assembles
  into cytoophidia (filaments) that dock with CTP synthase (Ura7) and asparagine synthetase (Asn1) filaments.
