descriptions:
- source: UniProt
  text: 5-phosphoribose 1-diphosphate synthase involved in nucleotide, histidine,
    and tryptophan biosynthesis. Active in heteromultimeric complexes with other 5-phosphoribose
    1-diphosphate synthases (PRS2, PRS3, PRS4 and PRS5).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12265
  source_id: Q12265
- source: Alliance_Imported
  text: 5-phospho-ribosyl-1(alpha)-pyrophosphate synthetase; synthesizes PRPP, which
    is required for nucleotide, histidine, and tryptophan biosynthesis; one of five
    related enzymes, which are active as heteromultimeric complexes; forms cytoplasmic
    foci upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/PRS5
  source_id: SGD:S000005422
- source: Alliance_Automated
  text: Enables ribose phosphate diphosphokinase activity. Involved in 5-phosphoribose
    1-diphosphate biosynthetic process. Located in cytoplasm. Part of ribose phosphate
    diphosphokinase complex. Is active in cytoophidium.
  source_type: automated
  url: https://www.yeastgenome.org/locus/PRS5
  source_id: SGD:S000005422
