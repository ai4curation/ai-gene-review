descriptions:
- source: UniProt
  text: Thiol-specific peroxidase that catalyzes the reduction of hydrogen peroxide
    and organic hydroperoxides to water and alcohols, respectively. Plays a role in
    cell protection against oxidative stress by detoxifying peroxides and as sensor
    of hydrogen peroxide-mediated signaling events. Has a role in telomere silencing,
    which is the repression of chromatin structure which leads to a stop in the transcription
    of nearby genes. Also has a role in the regulation of telomere length. Acts as
    an alkyl-hydroperoxide reductase in the nucleus during post-diauxic growth. Preferentially
    reduces alkyl- hydroperoxides rather than hydrogen peroxide. Acts as an antioxidant
    necessary for stationary phase survival.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40553
  source_id: P40553
