id: P40553
gene_symbol: DOT5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Peroxiredoxin DOT5 (nuclear thiol peroxidase, nTPx; ''disrupter of telomere silencing 5'')
  is the

  Saccharomyces cerevisiae member of the BCP/PrxQ peroxiredoxin subfamily. It is an atypical 2-Cys

  peroxiredoxin: the peroxidatic Cys106 and resolving Cys111 of the same monomer form an intramolecular

  disulfide that is reduced by thioredoxin. DOT5 reduces alkyl hydroperoxides in preference to H2O2

  (EC 1.11.1.24). It is located in the nucleus, its expression rises after the diauxic shift and under

  oxidative stress, and dot5 mutants are oxidant-sensitive and lose viability in stationary phase. DOT5

  also carries an N-terminal arginine-rich HMGN-like motif (aa 6-13) that binds the nucleosome acidic
  patch;

  this mediates chromatin association and underlies the telomeric-silencing, DNA-repair and growth defects

  seen when DOT5 is overexpressed.'
