descriptions:
- source: UniProt
  text: DNA-dependent RNA polymerases catalyze the transcription of DNA into RNA using
    the four ribonucleoside triphosphates as substrates. Component of RNA polymerase
    I (Pol I) which synthesizes ribosomal RNA precursors. Besides, RNA polymerase
    I has intrinsic RNA cleavage activity. The heterodimer formed by RPA34 and RPA49
    stimulates transcript elongation by Pol I. Subunit RPA49 can bind both single-
    stranded and double-stranded DNA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q01080
  source_id: Q01080
- source: Alliance_Imported
  text: RNA polymerase I subunit A49; essential for nucleolar assembly and for high
    polymerase loading rate; required for nucleolar localization of Rpa34p
  source_type: curated
  url: https://www.yeastgenome.org/locus/RPA49
  source_id: SGD:S000005192
- source: Alliance_Automated
  text: Enables DNA binding activity. Contributes to DNA-directed RNA polymerase activity.
    Involved in transcription by RNA polymerase I. Located in nucleolus. Part of RNA
    polymerase I complex. Orthologous to human POLR1E (RNA polymerase I subunit E).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RPA49
  source_id: SGD:S000005192
