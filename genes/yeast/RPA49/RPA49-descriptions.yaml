descriptions:
- source: UniProt
  text: DNA-dependent RNA polymerases catalyze the transcription of DNA into RNA using
    the four ribonucleoside triphosphates as substrates. Component of RNA polymerase
    I (Pol I) which synthesizes ribosomal RNA precursors. Besides, RNA polymerase
    I has intrinsic RNA cleavage activity. The heterodimer formed by RPA34 and RPA49
    stimulates transcript elongation by Pol I. Subunit RPA49 can bind both single-
    stranded and double-stranded DNA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q01080
  source_id: Q01080
