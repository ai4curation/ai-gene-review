- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IDA
  original_reference_id: PMID:24153184
  qualifier: enables
  review:
    summary: >-
      The 3.0 A crystal structure of the 14-subunit S. cerevisiae Pol I includes A49, whose
      heterodimer with A34.5 embraces A135 and contacts A12.2. The polymerase activity belongs to
      the complex; the catalytic centre is formed by A190 and A135.
    action: ACCEPT
    reason: >-
      The activity is correct for the Pol I enzyme of which A49 is a stable subunit, so the term
      is retained. The qualifier, however, should be contributes_to rather than enables: A49 is
      not catalytic, and Pol I lacking the A49-A34.5 dimer (Pol A*) remains catalytically active
      (PMID:9121426; PMID:12893961). The companion row from PMID:9837969 already carries
      contributes_to. A source defect is recorded for the qualifier.
    supported_by:
    - reference_id: PMID:24153184
      supporting_text: The A49-A34.5 heterodimer embraces subunit A135 through extended arms,
        thereby contacting and potentially regulating subunit A12.2.
    - reference_id: PMID:12893961
      supporting_text: It has been known that Pol I without A49 or PAF53 maintains non-specific
        transcription activities
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: SGD
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      confidence: PROBABLE
      explanation: >-
        RPA49 is a non-catalytic, dissociable subunit of RNA polymerase I; the polymerase active
        site is formed by A190 and A135, and Pol I lacking A49 retains catalytic activity. The
        GO:0003899 annotation from PMID:24153184 should use contributes_to, matching the SGD
        annotation from PMID:9837969.
