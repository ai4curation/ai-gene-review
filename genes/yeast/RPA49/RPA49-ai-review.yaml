id: Q01080
gene_symbol: RPA49
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  RPA49 (A49, YNL248C) is a non-essential, RNA polymerase I (Pol I)-specific subunit of the
  14-subunit Pol I enzyme that transcribes the 35S ribosomal RNA precursor in the nucleolus.
  A49 forms a heterodimer with A34.5 (RPA34) through its N-terminal dimerization domain; this
  module sits on the lobe of the A135 subunit near the enzyme funnel, has a fold related to the
  Pol II initiation factor TFIIF, and stimulates the polymerase-intrinsic RNA cleavage activity
  that depends on A12.2. The C-terminal region of A49 forms a tandem winged helix (tWH) domain,
  related to TFIIE, that binds single- and double-stranded DNA with a preference for the
  upstream promoter non-template strand and contacts upstream DNA in transcribing Pol I. The
  A49-A34.5 dimer acts as a built-in elongation factor that raises Pol I processivity
  (including passage through nucleosomes) and polymerase density on rDNA genes. Rpa49 also
  takes part in the Pol I initiation cycle: in its absence the initiation factor Rrn3 is
  recruited less efficiently to the rDNA promoter and fails to be released from the elongating
  polymerase. rpa49 deletion mutants are viable but grow slowly, are cold-sensitive (lethal at
  25 C), have about five-fold reduced rRNA synthesis and a disorganized nucleolus, and are
  synthetically lethal with loss of A14, A12.2 or the HMG-box Pol I factor Hmo1. A49 belongs to
  the RPA49/POLR1E family (PANTHER PTHR14440), whose members include S. pombe Rpa51 and
  mammalian PAF53/POLR1E.
existing_annotations:
- term:
    id: GO:0001188
    label: RNA polymerase I preinitiation complex assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1929022
  - PANTHER:PTN000374345
  review:
    summary: >-
      PAINT propagation from node PTN000374345 (RPA49/POLR1E family, PTHR14440), seeded by mouse
      Polr1e (PAF53). S. cerevisiae Rpa49 has its own experimental support for a role in assembly
      of the initiation-competent Pol I-Rrn3 complex at the promoter: rpa49 mutants are impaired
      in recruitment of Rrn3 to the rDNA promoter, and the A49 tWH binds DNA with a preference for
      the upstream promoter non-template strand.
    action: ACCEPT
    reason: >-
      The IBA places the function at the family node, and yeast Rpa49 lies inside that clade
      (single PANTHER family PTHR14440, no subfamily split). Independent yeast data support the
      claim that Rpa49 does part of the work of preinitiation complex formation: it is needed for
      efficient Rrn3 recruitment to the promoter (PMID:18086878), and its tWH domain is a
      TFIIE-related promoter-DNA-binding module (PMID:20797630). Rpa49 is not essential for
      initiation (Pol I lacking A49 retains basal activity), so this is a contributing rather
      than indispensable role, but the annotation is appropriate.
    supported_by:
    - reference_id: PMID:18086878
      supporting_text: They partially impaired its recruitment to the rDNA promoter, an effect that
        was bypassed by an N-terminal deletion of the Rpa43 subunit encoded by rpa43-35,326
    - reference_id: PMID:20797630
      supporting_text: The C-terminal region of A49 forms a "tandem winged helix" (tWH) domain that
        binds DNA with a preference for the upstream promoter nontemplate strand and is predicted in
        TFIIE.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:27867008
  qualifier: enables
  review:
    summary: >-
      Cryo-EM structures of transcribing Pol I show extra density for the A49 tWH domain at the
      interface between the stalk and upstream DNA in an elongation complex; independent
      biochemical work showed that the isolated A49 tWH binds DNA, and point mutations in the tWH
      (K356A/S358A, K359A) abolish binding.
    action: ACCEPT
    reason: >-
      DNA binding by the A49 C-terminal tWH domain is experimentally established in this species
      (PMID:20797630), and the transcribing Pol I structures place the tWH on upstream DNA
      (PMID:27867008). DNA binding is a core molecular activity of this subunit. A more specific
      child such as double-stranded or single-stranded DNA binding is not adopted because the
      domain binds both forms.
    supported_by:
    - reference_id: PMID:27867008
      supporting_text: 'We fitted the crystal structure of the A49 tWH (PDB: 3NFI) in extra density
        that appeared in the EC_tWH reconstruction in the interface between the stalk and the
        upstream DNA (Figure 4A).'
    - reference_id: PMID:27867008
      supporting_text: Binding of the tWH to the upstream DNA could stabilize its interaction with
        the protrusion domain and enforce a closed clamp, thereby enhancing processivity.
    - reference_id: PMID:20797630
      supporting_text: Here, we show that the Pol I-specific subunits A49 and A34.5 form a subcomplex
        that binds DNA and is related to TFIIF and TFIIE.
