core_functions:
- description: >-
    As the TFIIF/TFIIE-like A49 subunit of RNA polymerase I (heterodimer with A34.5), acts as a
    built-in elongation factor that raises Pol I processivity on rDNA, including through
    nucleosomes, and stimulates A12.2-dependent RNA cleavage.
  contributes_to_molecular_function:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  directly_involved_in:
  - id: GO:0006362
    label: transcription elongation by RNA polymerase I
  - id: GO:0042790
    label: nucleolar large rRNA transcription by RNA polymerase I
  locations:
  - id: GO:0005730
    label: nucleolus
  in_complex:
    id: GO:0005736
    label: RNA polymerase I complex
  supported_by:
  - reference_id: PMID:18160037
    supporting_text: The Pol I-specific subunits A49 and A34.5 form a heterodimer near the enzyme funnel
      that acts as a built-in elongation factor and is related to the Pol II-associated factor TFIIF.
  - reference_id: PMID:32060094
    supporting_text: Pol I mutants lacking either the heterodimeric subunit Rpa34.5/Rpa49 or the C-terminal
      part of the specific subunit Rpa12.2 showed a lower processivity on naked DNA templates, which
      was even more reduced in the presence of a nucleosome.
  - reference_id: PMID:12374750
    supporting_text: Hmo1-Δ and, even more so, rpa49-Δ are characterized by a shortage of rRNA compared
      with the tRNA level.
- description: >-
    Binds promoter-proximal upstream DNA through its C-terminal tandem winged helix domain and
    supports Rrn3-dependent assembly of initiation-competent Pol I at the rDNA promoter, as well
    as Rrn3 release during the transition to elongation.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
  - id: GO:0001188
    label: RNA polymerase I preinitiation complex assembly
  - id: GO:0006361
    label: transcription initiation at RNA polymerase I promoter
  locations:
  - id: GO:0005730
    label: nucleolus
  in_complex:
    id: GO:0005736
    label: RNA polymerase I complex
  supported_by:
  - reference_id: PMID:20797630
    supporting_text: The C-terminal region of A49 forms a "tandem winged helix" (tWH) domain that binds
      DNA with a preference for the upstream promoter nontemplate strand and is predicted in TFIIE.
  - reference_id: PMID:18086878
    supporting_text: These data suggest a dual role of the Rpa49-Rpa34 dimer during the recruitment of
      Rrn3 and its subsequent dissociation from the elongating polymerase.
suggested_questions:
- question: Does the A49 tWH domain contact promoter DNA in the yeast Pol I preinitiation complex
    with core factor and Rrn3, and is this contact what accounts for the Rrn3 recruitment defect
    of rpa49 mutants?
- question: Is the SGD termination annotation (GO:0006363) supported by A49-specific data in
    PMID:18160037, or does it derive from the A12.2-dependent cleavage activity of the enzyme?
- question: Which of the yeast A49 functions (Rrn3 release, tWH DNA binding, nucleosome passage)
    are conserved in S. pombe Rpa51, given that rpa51+ complements rpa49 deletion but only the
    C-terminal two-thirds of Rpa51 are required?
suggested_experiments:
- description: Test whether tWH DNA-binding-deficient A49 (K356A/S358A, K359A) complements rpa49
    deletion for cold sensitivity, Rrn3 release, and Pol I density on rDNA (Miller spreads), to
    separate the DNA-binding role from the A34.5 dimerization role.
  experiment_type: genetic complementation
