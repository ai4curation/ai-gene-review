id: P22140
gene_symbol: EPT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ept1 (YHR123W) is the sn-1,2-diacylglycerol ethanolaminephosphotransferase of Saccharomyces cerevisiae
  (EC 2.7.8.1), a polytopic membrane enzyme of the CDP-alcohol phosphatidyltransferase family. It transfers phosphoethanolamine
  from CDP-ethanolamine to diacylglycerol, releasing CMP, in the final step of the CDP-ethanolamine (Kennedy) branch
  of phosphatidylethanolamine synthesis. Ept1 has broad aminoalcohol specificity and also uses CDP-monomethylethanolamine,
  CDP-dimethylethanolamine and CDP-choline in vitro (EC 2.7.8.2), but the paralog Cpt1 is the main cholinephosphotransferase
  in vivo. Ept1 resides in endomembranes (ER and Golgi), requires Mg2+ and phospholipid activators, is inhibited
  by CMP, and is not essential for growth.
