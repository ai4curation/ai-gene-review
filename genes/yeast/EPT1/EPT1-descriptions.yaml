descriptions:
- source: UniProt
  text: Catalyzes the final step in the CDP-ethanolamine route leading to phosphatidylethanolamine
    (PE). Can also catalyze the formation of phosphatidylcholine (PC) from CDP-choline,
    but does not substantially contribute to PC biosynthesis. Preferentially uses
    CDP- dimethylethanolamine and CDP-propanolamine as aminoalcohol substrates. Shows
    highest activity toward di-unsaturated diacylglycerol species as lipid substrates.
    The CDP-ethanolamine pathway may play a role in maintaining the proper PE species
    distribution.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P22140
  source_id: P22140
