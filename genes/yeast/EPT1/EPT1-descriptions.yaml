gene_symbol: EPT1
organism: yeast
uniprot_id: P22140
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the final step in the CDP-ethanolamine route leading to phosphatidylethanolamine
    (PE). Can also catalyze the formation of phosphatidylcholine (PC) from CDP-choline,
    but does not substantially contribute to PC biosynthesis. Preferentially uses
    CDP- dimethylethanolamine and CDP-propanolamine as aminoalcohol substrates. Shows
    highest activity toward di-unsaturated diacylglycerol species as lipid substrates.
    The CDP-ethanolamine pathway may play a role in maintaining the proper PE species
    distribution.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P22140
  source_id: P22140
- source: Alliance_Imported
  text: sn-1,2-diacylglycerol ethanolamine- and cholinephosphotranferase; not essential
    for viability; EPT1 has a paralog, CPT1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/EPT1
  source_id: SGD:S000001165
- source: Alliance_Automated
  text: Enables diacylglycerol cholinephosphotransferase activity and ethanolaminephosphotransferase
    activity. Involved in phosphatidylcholine biosynthetic process and phosphatidylethanolamine
    biosynthetic process. Located in Golgi apparatus and endoplasmic reticulum. Human
    ortholog(s) of this gene implicated in hereditary spastic paraplegia 81. Orthologous
    to several human genes including SELENOI (selenoprotein I).
  source_type: automated
  url: https://www.yeastgenome.org/locus/EPT1
  source_id: SGD:S000001165
