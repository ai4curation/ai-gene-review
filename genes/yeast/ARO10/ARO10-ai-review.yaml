id: Q06408
gene_symbol: ARO10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ARO10 (YDR380W) encodes a cytosolic thiamine-diphosphate- and Mg2+-dependent 2-oxo-acid decarboxylase
  of the pyruvate decarboxylase family that catalyses the decarboxylation step of the Ehrlich pathway,
  converting transaminated amino acids into the corresponding aldehydes, which are then reduced to fusel
  alcohols or oxidised to fusel acids. Its preferred substrates are the aromatic 2-oxo acids phenylpyruvate,
  indole-3-pyruvate and 4-hydroxyphenylpyruvate, making it the physiologically relevant phenylpyruvate
  decarboxylase; it also decarboxylates branched-chain (4-methyl-2-oxopentanoate, 3-methyl-2-oxopentanoate)
  and sulfur-containing (4-methylthio-2-oxobutanoate) 2-oxo acids with high affinity, contributing to
  isoamyl alcohol, active amyl alcohol and methionol formation. Unlike its paralogs PDC1/5/6 it cannot
  decarboxylate pyruvate. ARO10 transcription is induced by aromatic amino acids via Aro80 and when phenylalanine,
  leucine or methionine is the nitrogen source.
