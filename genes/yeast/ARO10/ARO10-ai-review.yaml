suggested_questions:
- question: 'Why does constitutively expressed ARO10 yield no 2-oxo-acid decarboxylase activity in ammonia-grown
    wild-type cells: post-translational regulation or a required partner protein?'
- question: How should GO capture decarboxylation of 4-methylthio-2-oxobutanoate (methionine Ehrlich branch),
    which has no specific MF term?
suggested_experiments:
- description: Test for post-translational modification or partner proteins of Aro10 by affinity purification
    from phenylalanine- versus ammonia-grown cells, correlating with decarboxylase activity.
