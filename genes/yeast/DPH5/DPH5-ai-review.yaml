  label: Saccharomyces cerevisiae S288C
description: 'DPH5 encodes the S-adenosylmethionine-dependent methyltransferase of the second step of
  diphthamide biosynthesis on translation elongation factor 2 (eEF2). It belongs to the tetrapyrrole (uroporphyrinogen
  III) methylase fold family and acts on the 2-(3-amino-3-carboxypropyl)histidine (ACP-His699) made by
  the Dph1-Dph2-Dph3 step. Yeast Dph5 transfers four methyl groups: three to the amino group (trimethylammonio)
  and one to the carboxylate, giving diphthine methyl ester, which Dph7 (RRT2) then hydrolyses to diphthine
  before Dph6 amidates it. This tetramethylation distinguishes the eukaryotic enzyme from archaeal Dph5,
  which makes N-trimethylated product without esterification. dph5 null mutants are viable, lack diphthamide,
  and are resistant to diphtheria toxin and sordarin. Dph5 is a soluble cytoplasmic protein.'
