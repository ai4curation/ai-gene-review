suggested_questions:
- question: Why does eukaryotic Dph5 esterify the carboxylate (requiring Dph7 to remove it) when archaeal
    Dph5 does not; is the methyl ester a regulatory checkpoint in vivo?
suggested_experiments:
- hypothesis: The O-methyl ester step is a regulated gate on diphthamide completion
  description: Quantify methyl-ester versus diphthine versus diphthamide eEF2 by targeted LC-MS across
    growth phases and stresses, and test Dph5 active-site mutants that retain N-methylation but lose O-methylation
    for growth, frameshifting and toxin phenotypes.
  experiment_type: targeted proteomics / mutagenesis
