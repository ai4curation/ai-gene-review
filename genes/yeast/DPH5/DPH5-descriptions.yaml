gene_symbol: DPH5
organism: yeast
uniprot_id: P32469
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: S-adenosyl-L-methionine-dependent methyltransferase that catalyzes four methylations
    of the modified target histidine residue in translation elongation factor 2 (EF-2),
    to form an intermediate called diphthine methyl ester. The four successive methylation
    reactions represent the second step of diphthamide biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32469
  source_id: P32469
- source: Alliance_Imported
  text: Methyltransferase required for synthesis of diphthamide; diphthamide is a
    modified histidine residue of translation elongation factor 2 (Eft1p or Eft2p);
    not essential for viability; GFP-Dph5p fusion protein localizes to the cytoplasm
  source_type: curated
  url: https://www.yeastgenome.org/locus/DPH5
  source_id: SGD:S000004162
- source: Alliance_Automated
  text: Enables diphthine methyl ester synthase activity. Involved in protein histidyl
    modification to diphthamide. Located in cytoplasm. Human ortholog(s) of this gene
    implicated in neurodevelopmental disorder with short stature, prominent forehead,
    and feeding difficulties. Orthologous to human DPH5 (diphthamide biosynthesis
    5).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DPH5
  source_id: SGD:S000004162
