  text: Enables isopentenyl-diphosphate delta-isomerase activity. Involved in ergosterol
    biosynthetic process and trans, trans-farnesyl diphosphate biosynthetic process.
    Located in cytosol and nucleus. Used to study cancer. Orthologous to human IDI1
    (isopentenyl-diphosphate delta isomerase 1) and IDI2 (isopentenyl-diphosphate
    delta isomerase 2).
