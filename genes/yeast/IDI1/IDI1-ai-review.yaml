id: P15496
gene_symbol: IDI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: IDI1 (BOT2, YPL117C) encodes the type I isopentenyl-diphosphate delta-isomerase of Saccharomyces
  cerevisiae, a Mg2+-dependent Nudix-fold enzyme that catalyses the reversible antarafacial [1,3]-allylic
  rearrangement of isopentenyl diphosphate (IPP) to dimethylallyl diphosphate (DMAPP) (EC 5.3.3.2). In
  yeast IPP is made only by the mevalonate pathway (Erg19), so Idi1 is the source of the allylic DMAPP
  primer that Erg20 condenses with IPP to form geranyl and farnesyl diphosphate, and the enzyme is required
  for synthesis of ergosterol and all downstream isoprenoids. Cys139 is the active-site nucleophile and
  Glu207 is also essential for catalysis. Idi1 is a soluble cytosolic protein (with some nuclear signal
  in GFP surveys).
