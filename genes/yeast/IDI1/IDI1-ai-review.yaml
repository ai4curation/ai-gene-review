- term:
    id: GO:0009240
    label: isopentenyl diphosphate biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT5G16440
  - PANTHER:PTN000853999
  review:
    summary: IBA from node PTN000853999 seeded only by Arabidopsis IPP2 (AT5G16440). In plastids the MEP
      pathway makes both IPP and DMAPP and IDI can run DMAPP -> IPP, so IPP biosynthesis is meaningful
      there. In S. cerevisiae IPP is made exclusively by Erg19 (mevalonate pathway) and Idi1 converts
      it to DMAPP, so the yeast enzyme consumes rather than produces IPP. The reaction is reversible,
      so the term is not strictly wrong, but it misrepresents Idi1's role.
    action: MARK_AS_OVER_ANNOTATED
    reason: Direction of flux in yeast is IPP -> DMAPP; DMAPP biosynthesis is the appropriate process.
    supported_by:
    - reference_id: PMID:7908830
      supporting_text: catalyzes the antarafacial [1.3] allylic rearrangement of isopentenyl diphosphate
        (IPP) to its electrophilic allylic isomer dimethylallyl diphosphate (DMAPP)
    - reference_id: file:yeast/IDI1/IDI1-uniprot.txt
      supporting_text: '-!- PATHWAY: Isoprenoid biosynthesis; dimethylallyl diphosphate'
