suggested_questions:
- question: Is there any primary evidence for a vacuolar pool of Idi1 (or Erg20) supporting the "second
    module in the vacuole" statement propagated from the Hu et al. 2017 review into UniProt and GO?
suggested_experiments:
- description: Quantify the nuclear Idi1-GFP pool and test whether it has any function, e.g. by tethering
    Idi1 to the cytosol with an NES and assaying growth and sterol levels.
