descriptions:
- source: UniProt
  text: Component of a microsomal membrane bound medium-chain fatty acid elongation
    system, which extends medium-chain-length fatty acids to long-chain fatty acids.
    Component of elongase I, which extends 12- 16-carbon fatty acyl-CoAs such as lauroyl-CoA
    to 14-18-carbon fatty acids by incorporation of malonyl-CoA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39540
  source_id: P39540
- source: Alliance_Imported
  text: Elongase I, medium-chain acyl elongase; catalyzes carboxy-terminal elongation
    of unsaturated C12-C16 fatty acyl-CoAs to C16-C18 fatty acids; ELO1 has a paralog,
    ELO2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ELO1
  source_id: SGD:S000003732
- source: Alliance_Automated
  text: Enables fatty acid elongase activity. Involved in fatty acid elongation, unsaturated
    fatty acid. Located in endoplasmic reticulum membrane. Orthologous to human ELOVL3
    (ELOVL fatty acid elongase 3) and ELOVL6 (ELOVL fatty acid elongase 6).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ELO1
  source_id: SGD:S000003732
