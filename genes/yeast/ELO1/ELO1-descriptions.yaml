- source: UniProt
  text: Component of a microsomal membrane bound medium-chain fatty acid elongation
    system, which extends medium-chain-length fatty acids to long-chain fatty acids.
    Component of elongase I, which extends 12- 16-carbon fatty acyl-CoAs such as lauroyl-CoA
    to 14-18-carbon fatty acids by incorporation of malonyl-CoA.
