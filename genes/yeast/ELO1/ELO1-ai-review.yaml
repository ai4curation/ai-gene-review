  review:
    summary: Inherited from PTN000125390 donors including ELO2/ELO3 and ELOVL1, which make the C24-C26
      VLCFAs incorporated into ceramide. Elo1 is the medium-chain elongase producing C16-C18 products;
      the yeast sphingolipid VLCFA requirement is met by Elo2/Elo3 (elo2 elo3 synthetic lethality), with
      Elo1 providing at most indirect C16-C18 precursors.
