suggested_questions:
- question: Does Elo1 contribute measurably to C16-C18 acyl-CoA supply under normal (FAS-active) growth,
    or only when cells import medium-chain fatty acids?
- question: Is the 3-ketoacyl-CoA reductase Ifa38 (or Ayr1) the partner of Elo1 in elongase I, given that
    Rossler et al. found Ybr159w shared by elongases II and III?
suggested_experiments:
- hypothesis: Elo1 specificity for C12-C14 acyl-CoA is intrinsic to its acyl-binding tunnel (molecular
    caliper).
  description: Express Elo1 and Elo1/Elo2 chimeras in elo1 elo2 elo3 (rescued) backgrounds and measure
    in vitro condensation with C10-C20 acyl-CoA primers by LC-MS.
