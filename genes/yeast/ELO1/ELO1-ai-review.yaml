  label: Saccharomyces cerevisiae S288C
description: Fatty acid elongase 1 (Elo1/YJL196C) is the medium-chain member of the three ER-resident
  ELO-family condensing enzymes of Saccharomyces cerevisiae. It catalyses the rate-limiting condensation
  of acyl-CoA with malonyl-CoA (EC 2.3.1.199) as the first step of the ER fatty acid elongation cycle
  (with the shared Ifa38 ketoreductase, Phs1 dehydratase and Tsc13 enoyl reductase). Elo1 defines elongase
  I, which extends C12-C16 saturated and monounsaturated acyl-CoAs (e.g. C14:0, C14:1 delta9) to C16-C18
  products by carboxy-terminal (alpha) elongation; it is dispensable for VLCFA synthesis, which is performed
  by its paralogs Elo2 and Elo3. ELO1 is induced by exogenous myristate and is a multi-pass integral ER
  membrane protein.
