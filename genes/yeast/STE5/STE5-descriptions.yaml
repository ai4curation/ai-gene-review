    - rubric: specificity
      score: 5
    overall_notes: 'Correct and specific: MAPK scaffold for Ste11, Ste7 and Fus3,
      PH-VWA autoinhibition relieved by Gbeta-gamma and PI(4,5)P2, and Gpa1 interaction.
      Matches the review.'
- source: Alliance_Automated
  text: Enables G-protein beta-subunit binding activity; MAP kinase scaffold activity;
    and phosphatidylinositol-4,5-bisphosphate binding activity. Involved in several
    processes, including invasive growth in response to glucose limitation; negative
    regulation of MAPK cascade; and pheromone response MAPK cascade. Located in cytoplasm;
    mating projection tip membrane; and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/STE5
