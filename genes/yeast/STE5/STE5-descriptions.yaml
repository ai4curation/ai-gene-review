descriptions:
- source: UniProt
  text: Component of the pheromone signal transduction pathway. It mediates pheromone
    signals acting between STE20 and STE11. It is absolutely required for pheromone-induced
    transcription of FUS1. May play a role in cell-cycle arrest in response to pheromone.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32917
  source_id: P32917
