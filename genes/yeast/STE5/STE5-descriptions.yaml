      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: 'Correct but dated: component acting between Ste20 and Ste11 and
      required for FUS1 induction. Never calls Ste5 a scaffold.'
- source: Alliance_Imported
  text: Pheromone-responsive MAPK scaffold; couples activation of the G-protein-coupled
    pheromone receptor to MAPK activation; intramolecular interaction of PH and VWA
    domains blocks activation of the assembled signaling cascade (Ste11p, Ste7p and
    Fus3p) under basal conditions; Gβ-γ (Ste4p-Ste18p)-dependent docking at the plasma
    membrane and PI(4,5)P2 binding by the PH domain relieves autoinhibition, activating
    the pathway; interacts with Gα (Gpa1p) to enhance the efficiency of polarity site
    alignment
  source_type: curated
  url: https://www.yeastgenome.org/locus/STE5
  source_id: SGD:S000002510
