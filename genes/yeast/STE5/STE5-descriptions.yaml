gene_symbol: STE5
organism: yeast
uniprot_id: P32917
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Component of the pheromone signal transduction pathway. It mediates pheromone
    signals acting between STE20 and STE11. It is absolutely required for pheromone-induced
    transcription of FUS1. May play a role in cell-cycle arrest in response to pheromone.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32917
  source_id: P32917
- source: Alliance_Imported
  text: Pheromone-responsive MAPK scaffold; couples activation of the G-protein-coupled
    pheromone receptor to MAPK activation; intramolecular interaction of PH and VWA
    domains blocks activation of the assembled signaling cascade (Ste11p, Ste7p and
    Fus3p) under basal conditions; Gβ-γ (Ste4p-Ste18p)-dependent docking at the plasma
    membrane and PI(4,5)P2 binding by the PH domain relieves autoinhibition, activating
    the pathway; interacts with Gα (Gpa1p) to enhance the efficiency of polarity site
    alignment
  source_type: curated
  url: https://www.yeastgenome.org/locus/STE5
  source_id: SGD:S000002510
- source: Alliance_Automated
  text: Enables G-protein beta-subunit binding activity; MAP kinase scaffold activity;
    and phosphatidylinositol-4,5-bisphosphate binding activity. Involved in several
    processes, including invasive growth in response to glucose limitation; negative
    regulation of MAPK cascade; and pheromone response MAPK cascade. Located in cytoplasm;
    mating projection tip membrane; and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/STE5
  source_id: SGD:S000002510
