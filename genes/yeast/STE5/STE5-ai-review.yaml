- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:23953117
  qualifier: enables
  supporting_entities:
  - UniProtKB:C8V7D1
  review:
    summary: In vitro binding of the S. cerevisiae Ste5 Fus3-binding domain (FBD) to a heterologous MAPK,
      Aspergillus nidulans MpkB, used to probe the evolution of Ste5 allosteric activation of MAPKs.
    action: REMOVE
    reason: Bare protein binding is uninformative, and this partner is a MAPK from another fungal species
      tested in vitro as an evolutionary probe (latent allostery), not a physiological partner of S. cerevisiae
      Ste5. The informative MF (MAPK binding) is captured by the S. cerevisiae Fus3 rows. Removal does
      not mean the reported in vitro interaction is false.
    supported_by:
    - reference_id: PMID:23953117
      supporting_text: Several kinases were not allosterically affected by the S. cer. Ste5-FBD (D. han.
        Cek2, C. alb. Cek1, A. nid. MpkB, N. cra. MpkB) even though these kinases readily bound to S.
        cer. Ste5-FBD
    - reference_id: PMID:23953117
      supporting_text: Surprisingly, both Ste5 activator motifs could regulate MAP kinases that diverged
        from Fus3 prior to the emergence of Ste5, suggesting that Ste5 activators arose by exploiting
        latent regulatory features already present in the MAPK ancestor.
