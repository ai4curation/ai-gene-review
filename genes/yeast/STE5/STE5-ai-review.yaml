id: P32917
gene_symbol: STE5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Ste5 is the scaffold protein of the Saccharomyces cerevisiae mating-pheromone MAP kinase
  pathway. It is a non-catalytic 917-residue protein with an N-terminal basic amphipathic plasma-membrane
  (PM) helix, a RING-H2 zinc-finger domain that binds the G-protein beta subunit Ste4, a Fus3-binding
  domain (residues 288-316), a cryptic pleckstrin-homology (PH) domain that binds PtdIns(4,5)P2 and the
  MAPKKK Ste11, and a C-terminal von Willebrand type-A (VWA; "Ste5-ms") domain that binds the MAPKK Ste7.
  Ste5 binds Ste11, Ste7 and Fus3 and, upon pheromone receptor activation, is recruited by the released
  Gbeta-gamma (Ste4-Ste18) dimer, together with direct membrane and PI(4,5)P2 binding, to the cytoplasmic
  face of the plasma membrane at the mating projection tip. Membrane recruitment delivers Ste5-bound Ste11
  to the membrane kinase Ste20 and is sufficient to activate the pathway. Ste5 is also an allosteric activator:
  its VWA domain acts as a co-catalyst that raises the rate of Ste7 phosphorylation of Fus3 about 5000-fold
  without affecting Ste7 phosphorylation of Kss1, making Fus3 activation specific to the mating pathway,
  while the Fus3-binding domain stimulates Fus3 autophosphorylation, leading to feedback phosphorylation
  of Ste5 that dampens pathway output. Ste5 shuttles between nucleus and cytoplasm; G1 Cln/CDK phosphorylation
  of sites flanking the PM helix blocks its membrane binding, restricting pheromone signaling to G1. In
  some strain backgrounds Ste5 also supports Kss1 activation during invasive growth.'
existing_annotations:
- term:
    id: GO:0001403
    label: invasive growth in response to glucose limitation
  evidence_type: IMP
  original_reference_id: PMID:15192700
  qualifier: involved_in
  review:
    summary: In S288c (FLO8-corrected), ste5 deletion abolishes agar invasion and Ste5 is needed for Kss1
      activation by several invasive-growth stimuli including glucose depletion.
    action: KEEP_AS_NON_CORE
    reason: The IMP data support a role of Ste5 in invasive growth in the S288c background, via generating
      active Ste11 that feeds the Kss1 cascade. This is strain dependent (not required in Sigma1278b)
      and secondary to the mating-pathway scaffold role, so kept as non-core.
    supported_by:
    - reference_id: PMID:15192700
      supporting_text: showed that ste4 Δ and ste5 Δ strains were as deficient in invading the agar as
        flo11 Δ and ste20 Δ strains
    - reference_id: PMID:15192700
      supporting_text: Thus, Ste4 and Ste5 are required for Kss1 to be activated by multiple stimuli that
        induce IG.
    - reference_id: PMID:15192700
      supporting_text: The requirement for Ste4 and Ste5 in activation of Kss1 during IG in S288c contrasted
        Σ1278b, which does not require Ste4 or Ste5 for IG or SVG
- term:
    id: GO:0001934
    label: positive regulation of protein phosphorylation
  evidence_type: IDA
  original_reference_id: PMID:19303851
  qualifier: involved_in
  review:
    summary: Reconstitution shows the Ste5 VWA (Ste5-ms) domain increases the kcat of Ste7-catalysed Fus3
      phosphorylation about 5000-fold, i.e. Ste5 positively regulates Fus3 phosphorylation.
    action: ACCEPT
    reason: 'Directly demonstrated by in vitro kinetics (IDA). This regulatory process is a core aspect
      of Ste5 function: it is what makes Fus3 activation mating-pathway specific. The corresponding MF
      is captured by the proposed NEW protein serine/threonine kinase activator activity annotation.'
    supported_by:
    - reference_id: PMID:19303851
      supporting_text: We identify and structurally characterize a domain in Ste5 that catalytically unlocks
        Fus3 for phosphorylation by Ste7.
    - reference_id: PMID:19303851
      supporting_text: This domain specifically increases the kcat for the Ste7➔ Fus3 reaction by ~5000-fold,
        while it has no effect on the kcat or KM of the Ste7➔ Kss1 reaction.
    - reference_id: PMID:19303851
      supporting_text: Thus, the Ste5-ms domain is essentially serving as a substrate specific co-catalyst
        for Ste7➔Fus3 phosphorylation
- term:
    id: GO:0005078
    label: MAP kinase scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:8062390
  qualifier: enables
  review:
    summary: Ste5 is the prototypic MAPK scaffold of the pheromone pathway, binding Ste11, Ste7 and Fus3
      on distinct domains and the Gbeta subunit Ste4 (IDA, PMID:8062390).
    action: ACCEPT
    reason: Core molecular function. Ste5 binds all three kinases of the mating MAPK cascade through separable
      domains, copurifies with them in a large complex, and increases association of Ste11 with Ste7 and
      Fus3; it also binds the upstream Gbeta Ste4, exactly as described in the term definition (binds
      multiple kinases of the cascade and upstream signaling proteins).
    supported_by:
    - reference_id: PMID:8062390
      supporting_text: By two-hybrid analysis, Ste11, Ste7, and Fus3 associate with different domains
        of Ste5, while Kss1, another MAPK, associates with the same domain as Fus3, thus implying that
        Ste5 simultaneously binds a MEKK, MEK, and MAPK.
    - reference_id: PMID:8062390
      supporting_text: Ste5 copurifies with Ste11, Fus3, and a hypophosphorylated form of Ste7, and all
        four proteins cosediment in a glycerol gradient as if in a large complex.
    - reference_id: PMID:8062390
      supporting_text: Ste5 also increases the amount of Ste11 complexed to Ste7 and Fus3 and is required
        for Ste11 to function.
    - reference_id: PMID:7851759
      supporting_text: Ste5p, a protein of unknown biochemical function, interacted with protein kinases
        that operate at each step of the MAP kinase cascade, specifically with Ste11p (an MEKK), Ste7p
        (an MEK), and Fus3p (a MAP kinase).
    - reference_id: PMID:7851759
      supporting_text: This finding suggests that one role of Ste5p is to serve as a scaffold to facilitate
        interactions among members of the kinase cascade.
