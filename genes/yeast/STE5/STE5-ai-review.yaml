core_functions:
- description: 'MAP kinase scaffold of the pheromone response pathway: Ste5 binds Ste11 (MAPKKK), Ste7
    (MAPKK) and Fus3 (MAPK) on separate domains and the Gbeta subunit Ste4, assembling the cascade and,
    upon Gbetagamma/PI(4,5)P2-dependent recruitment to the plasma membrane at the mating projection tip,
    delivering Ste11 to Ste20 to initiate signaling.'
  molecular_function:
    id: GO:0005078
    label: MAP kinase scaffold activity
  directly_involved_in:
  - id: GO:0071507
    label: pheromone response MAPK cascade
  locations:
  - id: GO:0070867
    label: mating projection tip membrane
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8062390
    supporting_text: By two-hybrid analysis, Ste11, Ste7, and Fus3 associate with different domains of
      Ste5, while Kss1, another MAPK, associates with the same domain as Fus3, thus implying that Ste5
      simultaneously binds a MEKK, MEK, and MAPK.
  - reference_id: PMID:8062390
    supporting_text: Ste5 copurifies with Ste11, Fus3, and a hypophosphorylated form of Ste7, and all
      four proteins cosediment in a glycerol gradient as if in a large complex.
  - reference_id: PMID:7851759
    supporting_text: Ste5p, a protein of unknown biochemical function, interacted with protein kinases
      that operate at each step of the MAP kinase cascade, specifically with Ste11p (an MEKK), Ste7p (an
      MEK), and Fus3p (a MAP kinase).
  - reference_id: PMID:7667635
    supporting_text: A haploid-specific interaction between the amino terminus of Ste5p and the G protein
      beta subunit Ste4p was also detected in a two-hybrid assay, and the product of a signaling-defective
      allele of STE4 was defective in this interaction.
  - reference_id: PMID:9732267
    supporting_text: Furthermore, this event has functional significance, as artificial targeting of Ste5
      to the plasma membrane, but not intracellular membranes, activates the pathway in the absence of
      pheromone or Gbetagamma.
  - reference_id: PMID:16847350
    supporting_text: Thus, the PH domain is essential for stable membrane recruitment of Ste5, and this
      association is critical for initiation of downstream signaling because it allows Ste5-bound Ste11
      (MAPKKK) to be activated by membrane-bound Ste20 (MAPKKKK).
- description: 'Allosteric co-activator of Fus3 activation: the Ste5 VWA (Ste5-ms) domain binds Ste7 and
    raises the kcat of Ste7-catalysed Fus3 phosphorylation ~5000-fold (not Kss1), conferring mating-pathway
    specificity; the Fus3-binding domain stimulates Fus3 autophosphorylation, supporting feedback tuning
    of output.'
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:0071507
    label: pheromone response MAPK cascade
  locations:
  - id: GO:0070867
    label: mating projection tip membrane
  supported_by:
  - reference_id: PMID:19303851
    supporting_text: This domain specifically increases the kcat for the Ste7➔ Fus3 reaction by ~5000-fold,
      while it has no effect on the kcat or KM of the Ste7➔ Kss1 reaction.
  - reference_id: PMID:19303851
    supporting_text: Thus, the Ste5-ms domain is essentially serving as a substrate specific co-catalyst
      for Ste7➔Fus3 phosphorylation
  - reference_id: PMID:16424299
    supporting_text: A fragment of Ste5 allosterically activated autophosphorylation of the mitogen-activated
      protein kinase Fus3.
suggested_questions:
- question: Should the Ste5 VWA-domain co-catalyst activity (raising Ste7 kcat toward Fus3) be captured
    as protein serine/threonine kinase activator activity, or does GO need a more specific term for a
    substrate-specific kinase co-catalyst/"substrate unlocking" function distinct from general kinase
    activation?
- question: Is the Ste5 R(S/T)(S/T)SL motif bound by the Fus1 SH3 domain used in vivo during cell fusion,
    or is the Ste5-Fus1 interaction an in vitro/two-hybrid observation without physiological role?
suggested_experiments:
- description: Test Ste5 alleles that separately disrupt the VWA catalytic interface (retaining Ste7 binding)
    and the Fus1-binding R(S/T)(S/T)SL motif for mating efficiency and cell fusion, to separate scaffold,
    co-catalyst and potential fusion roles in vivo.
