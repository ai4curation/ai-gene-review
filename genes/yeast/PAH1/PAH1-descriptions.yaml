descriptions:
- source: UniProt
  text: Mg(2+)-dependent phosphatidate (PA) phosphatase which catalyzes the dephosphorylation
    of PA to yield diacylglycerol (PubMed:16467296, PubMed:16968695, PubMed:17910939,
    PubMed:17971454, PubMed:20876142, PubMed:21081492, PubMed:29765047, PubMed:39577771).
    Required for de novo lipid synthesis and formation of lipid droplets (PubMed:21422231).
    Controls transcription of phospholipid biosynthetic genes and nuclear structure
    by regulating the amount of membrane present at the nuclear envelope (PubMed:15889145).
    Involved in plasmid maintenance, in respiration and in cell proliferation (PubMed:8437575).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32567
  source_id: P32567
- source: Alliance_Imported
  text: Mg2+-dependent phosphatidate (PA) phosphatase; dephosphorylates PA to yield
    diacylglycerol; regulates phospholipid synthesis, nuclear/ER membrane growth,
    lipid droplet formation, triacylglycerol synthesis, vacuolar homeostasis and cell
    wall integrity; phosphorylated by Hsl1p, Pho85p/Pho80p, Cdc28p/Cyclin B, PKA,
    PKC, and CKII, regulating activity, localization, and proteosomal degradation;
    homolog of mammalian lipins 1 and 2; human homologs LPIN1, LPIN2, LPIN3 complement
    the null
  source_type: curated
  url: https://www.yeastgenome.org/locus/PAH1
  source_id: SGD:S000004775
- source: Alliance_Automated
  text: Enables phosphatidate phosphatase activity and transcription cis-regulatory
    region binding activity. Involved in several processes, including acylglycerol
    biosynthetic process; lipid droplet organization; and vacuole fusion, non-autophagic.
    Located in cytosol; lipid droplet; and vacuole. Is active in nuclear membrane.
    Used to study lipid metabolism disorder and myoglobinuria. Human ortholog(s) of
    this gene implicated in Majeed syndrome and myoglobinuria. Orthologous to human
    LPIN1 (lipin 1); LPIN2 (lipin 2); and LPIN3 (lipin 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PAH1
  source_id: SGD:S000004775
