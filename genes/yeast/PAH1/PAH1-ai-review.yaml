      PA phosphatase enzyme
  - reference_id: PMID:16467296
    supporting_text: Lipid analysis showed that mutants lacking PAH1 accumulated PA and had reduced amounts
      of diacylglycerol and its derivative triacylglycerol.
  - reference_id: PMID:24196957
    supporting_text: showed the essential role of PAH1 in triacylglycerol synthesis throughout growth
  - reference_id: PMID:39009344
    supporting_text: activated via its recruitment and dephosphorylation by the protein phosphatase Nem1-Spo7
      at the nuclear/endoplasmic reticulum membrane where the PA phosphatase reaction occurs
proposed_new_terms: []
suggested_questions:
- question: How do the many Pah1 kinases (Cdc28, Pho85, PKA, PKC, CK1/CK2, Hsl1) combine to set the pool
    of active, membrane-bound Pah1 across growth phases?
- question: Does the reported promoter association of Pah1 have any role beyond its control of PA levels
    and Opi1 release?
suggested_experiments:
- description: ChIP-seq of Pah1 in strains with a catalytically dead Pah1 (D398E) or with Opi1 deleted,
    to test whether promoter occupancy is direct and independent of PA signalling.
  experiment_type: genomics/genetics
  hypothesis: Pah1 promoter association is an indirect consequence of nuclear-envelope proximity, and
    gene regulation acts entirely through PA levels.
