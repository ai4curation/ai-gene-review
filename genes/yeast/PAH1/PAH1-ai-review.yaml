    label: transcription cis-regulatory region binding
  evidence_type: IDA
  original_reference_id: PMID:15889145
  qualifier: enables
  review:
    summary: IDA from Santos-Rosa et al. 2005, based on chromatin immunoprecipitation showing Smp2/Pah1
      associated with promoters of phospholipid biosynthetic genes in a Nem1-Spo7-dependent manner.
    action: MARK_AS_OVER_ANNOTATED
    reason: Association with promoter chromatin by ChIP does not show sequence-specific or direct DNA
      binding, and Pah1 has no DNA-binding domain. Its effect on phospholipid gene expression is explained
      by its control of PA levels through the Opi1-Ino2/Ino4 circuit. The experimental association is
      not disputed, but a cis-regulatory DNA-binding activity overstates it.
    supported_by:
    - reference_id: PMID:15889145
      supporting_text: We show that Smp2 associates with the promoters of phospholipid biosynthetic enzymes
        in a Nem1-Spo7-dependent manner.
    - reference_id: PMID:17971454
      supporting_text: failed to complement the pah1Delta mutant phenotypes of temperature sensitivity,
        respiratory deficiency, nuclear/endoplasmic reticulum membrane expansion, derepression of INO1
        expression, and alterations in lipid composition
