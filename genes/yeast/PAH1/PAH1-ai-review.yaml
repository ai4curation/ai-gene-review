id: P32567
gene_symbol: PAH1
aliases:
- SMP2
- PAP1
- YMR165C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PAH1 (formerly SMP2) encodes the yeast lipin, the Mg2+-dependent phosphatidate phosphatase
  (PAP1; EC 3.1.3.4). It dephosphorylates phosphatidic acid (PA) to diacylglycerol (DAG) using a haloacid
  dehalogenase-like DXDX(T/V) catalytic motif (DIDGT, Asp-398/Asp-400). Pah1 controls whether PA is used
  for membrane phospholipid synthesis via CDP-diacylglycerol or for DAG and hence triacylglycerol (TAG)
  and Kennedy-pathway phospholipids. Among the four yeast PA phosphatases (Pah1, App1, Dpp1, Lpp1), Pah1
  is the one essential for TAG synthesis throughout growth. Pah1 is a soluble protein, phosphorylated
  in the cytosol by several kinases (Cdc28, Pho85, PKA, PKC, Hsl1 and others), which keeps it inactive.
  Dephosphorylation by the Nem1-Spo7 phosphatase at the nuclear/ER membrane lets its N-terminal amphipathic
  helix anchor it to the membrane, where it is active. Loss of Pah1 raises PA, derepresses phospholipid
  genes through the PA-Opi1-Ino2/Ino4 circuit and causes nuclear/ER membrane expansion. The pah1 mutant
  also has fewer lipid droplets, fragmented vacuoles defective in homotypic fusion, respiratory deficiency
  and temperature sensitivity, all of which depend on loss of PAP activity.
