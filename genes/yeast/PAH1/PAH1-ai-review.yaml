core_functions:
- description: Mg2+-dependent dephosphorylation of phosphatidic acid to diacylglycerol at the nuclear/ER
    membrane after Nem1-Spo7-mediated dephosphorylation and membrane recruitment; the PAP that supplies
    DAG for TAG synthesis and controls PA partitioning between storage and membrane lipids.
  molecular_function:
    id: GO:0008195
    label: phosphatidate phosphatase activity
