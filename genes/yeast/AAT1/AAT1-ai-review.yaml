id: Q01802
gene_symbol: AAT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Mitochondrial aspartate aminotransferase (AspAT, EC 2.6.1.1) of Saccharomyces cerevisiae,
  a PLP-dependent class-I aminotransferase that reversibly interconverts L-aspartate + 2-oxoglutarate
  and oxaloacetate + L-glutamate in the mitochondrial matrix. Under the tested nitrogen-starvation conditions,
  Aat1 contributes less newly synthesized aspartate than cytosolic Aat2; this comparison does not establish
  a universal flux ratio. Aat1 is acetylated in mitochondria and participates in metabolite exchange between
  mitochondria and cytosol; it is inactivated in frataxin-deficient (yfh1) cells, and its loss causes
  respiratory deficiency and altered iron homeostasis, consistent with a role in a malate-aspartate type
  NADH shuttle.
