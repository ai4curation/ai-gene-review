descriptions:
- source: UniProt
  text: Catalyzes the first step of diphthamide biosynthesis, a post- translational
    modification of histidine which occurs in elongation factor 2 (PubMed:15485916,
    PubMed:24422557, PubMed:27694803, PubMed:31463593, PubMed:34154323). In association
    with DPH2, transfers a 3-amino-3-carboxypropyl (ACP) group from S-adenosyl-L-methionine
    (SAM) to a histidine residue, the reaction is assisted by a reduction system comprising
    KTI11/DPH3 and a NADH-dependent reductase, predominantly CBR1 (PubMed:15485916,
    PubMed:24422557, PubMed:27694803, PubMed:31463593, PubMed:34154323).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40487
