- source: Alliance_Imported
  text: Protein required for synthesis of diphthamide; required along with Dph2p,
    Kti11p, Jjj3p, and Dph5p; diphthamide is a modified histidine residue of translation
    elongation factor 2 (Eft1p or Eft2p); forms a complex with Dph2p that catalyzes
    the first step of diphthamide biosynthesis
