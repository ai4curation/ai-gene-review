gene_symbol: DPH1
organism: yeast
uniprot_id: P40487
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the first step of diphthamide biosynthesis, a post- translational
    modification of histidine which occurs in elongation factor 2 (PubMed:15485916,
    PubMed:24422557, PubMed:27694803, PubMed:31463593, PubMed:34154323). In association
    with DPH2, transfers a 3-amino-3-carboxypropyl (ACP) group from S-adenosyl-L-methionine
    (SAM) to a histidine residue, the reaction is assisted by a reduction system comprising
    KTI11/DPH3 and a NADH-dependent reductase, predominantly CBR1 (PubMed:15485916,
    PubMed:24422557, PubMed:27694803, PubMed:31463593, PubMed:34154323).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40487
  source_id: P40487
- source: Alliance_Imported
  text: Protein required for synthesis of diphthamide; required along with Dph2p,
    Kti11p, Jjj3p, and Dph5p; diphthamide is a modified histidine residue of translation
    elongation factor 2 (Eft1p or Eft2p); forms a complex with Dph2p that catalyzes
    the first step of diphthamide biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/DPH1
  source_id: SGD:S000001365
- source: Alliance_Automated
  text: Enables 4 iron, 4 sulfur cluster binding activity. Contributes to 2-(3-amino-3-carboxypropyl)histidine
    synthase activity. Involved in protein histidyl modification to diphthamide. Located
    in cytoplasm. Part of 2-(3-amino-3-carboxypropyl)histidine synthase complex. Used
    to study diphthamide deficiency syndrome. Human ortholog(s) of this gene implicated
    in diphthamide deficiency syndrome 1. Orthologous to human DPH1 (diphthamide biosynthesis
    1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DPH1
  source_id: SGD:S000001365
