gene_symbol: DPH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'DPH1 (YIL103W) encodes one of the two paralogous catalytic subunits of the 2-(3-amino-3-carboxypropyl)histidine
  synthase (Dph1-Dph2 heterodimer) that performs the first step of diphthamide biosynthesis on translation
  elongation factor 2 (eEF2). The heterodimer is a non-canonical radical-SAM enzyme: each subunit binds
  a [4Fe-4S] cluster through three conserved cysteines, the reduced cluster cleaves S-adenosylmethionine
  at the methionine C(gamma)-S bond, and the 3-amino-3-carboxypropyl (ACP) group is transferred to C2
  of the imidazole of His699, releasing 5''-methylthioadenosine. The Dph1 cluster is the catalytic one,
  while the Dph2 cluster is needed for its reduction by the physiological Dph3(KTI11)/Cbr1/NADH system;
  Dph3 also donates an iron atom that rebuilds the oxygen-damaged [3Fe-4S] cluster. Dph1 and Dph2 are
  not interchangeable. dph1 null cells lack diphthamide, are resistant to diphtheria toxin and sordarin
  and show increased -1 frameshifting. The human ortholog DPH1 (OVCA1) is mutated in a recessive developmental
  syndrome. Dph1 is cytoplasmic.'
