  text: Catalyzes the first intracellular reaction of sulfate assimilation, forming
    adenosine-5'-phosphosulfate (APS) from inorganic sulfate and ATP. Plays an important
    role in sulfate activation as a component of the biosynthesis pathway of sulfur-containing
    amino acids.
