gene_symbol: MET3
organism: yeast
uniprot_id: P08536
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the first intracellular reaction of sulfate assimilation, forming
    adenosine-5'-phosphosulfate (APS) from inorganic sulfate and ATP. Plays an important
    role in sulfate activation as a component of the biosynthesis pathway of sulfur-containing
    amino acids.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08536
  source_id: P08536
- source: Alliance_Imported
  text: ATP sulfurylase; catalyzes the primary step of intracellular sulfate activation,
    essential for assimilatory reduction of sulfate to sulfide, involved in methionine
    metabolism; human homolog PAPSS2 complements yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/MET3
  source_id: SGD:S000003771
- source: Alliance_Automated
  text: Enables sulfate adenylyltransferase (ATP) activity. Involved in sulfate assimilation
    and sulfur amino acid metabolic process. Located in mitochondrion. Human ortholog(s)
    of this gene implicated in spondyloepimetaphyseal dysplasia, Pakistani type. Orthologous
    to human PAPSS1 (3'-phosphoadenosine 5'-phosphosulfate synthase 1) and PAPSS2
    (3'-phosphoadenosine 5'-phosphosulfate synthase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MET3
  source_id: SGD:S000003771
