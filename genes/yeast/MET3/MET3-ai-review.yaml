id: P08536
gene_symbol: MET3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Met3 is the ATP sulfurylase (sulfate adenylyltransferase, EC 2.7.7.4) of Saccharomyces cerevisiae.
  It carries out the first intracellular step of sulfate assimilation, the reaction of inorganic sulfate
  with ATP to give adenosine 5'-phosphosulfate (APS) and pyrophosphate. Met14 (APS kinase) then phosphorylates
  APS to 3'-phosphoadenylyl sulfate (PAPS), which Met16 reduces to sulfite on the way to sulfide and the
  sulfur amino acids. Met3 is a soluble cytoplasmic homo-oligomer (a hexamer in crystal structures). Its
  C-terminal domain resembles APS kinase but is catalytically inactive and serves for oligomerization.
  met3 mutants cannot assimilate sulfate and need methionine or another reduced sulfur source. MET3 is
  a classic member of the methionine-repressed MET regulon, and its promoter is widely used as a methionine-repressible
  expression system.
