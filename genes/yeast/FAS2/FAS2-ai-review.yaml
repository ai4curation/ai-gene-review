id: P19097
gene_symbol: FAS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FAS2 (YPL231W) encodes the alpha subunit of the cytosolic type I fungal fatty acid synthase,
  the 2.6-MDa alpha6beta6 barrel formed with the beta subunit Fas1. Six alpha chains form the central
  equatorial wheel. Each carries the acyl carrier protein (ACP) domain that shuttles intermediates between
  active sites, the 3-oxoacyl-ACP synthase (ketoacyl synthase; the cerulenin target) and NADPH-dependent
  3-oxoacyl-ACP reductase domains, and a C-terminal 4'-phosphopantetheinyl transferase domain. This last
  domain activates the complex by pantetheinylating the ACP in trans before assembly. Together with Fas1
  the complex converts acetyl-CoA, malonyl-CoA and NADPH into long-chain C16/C18 acyl-CoA (EC 2.3.1.86).
  Free alpha subunits are rapidly degraded, which balances the levels of the two subunits.
