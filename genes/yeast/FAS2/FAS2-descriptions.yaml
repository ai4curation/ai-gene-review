gene_symbol: FAS2
organism: yeast
uniprot_id: P19097
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: 'Fatty acid synthetase catalyzes the formation of long-chain fatty acids from
    acetyl-CoA, malonyl-CoA and NADPH. The alpha subunit contains domains for: acyl
    carrier protein, 3-oxoacyl-[acyl-carrier- protein] reductase, and 3-oxoacyl-[acyl-carrier-protein]
    synthase. This subunit coordinates the binding of the six beta subunits to the
    enzyme complex.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P19097
  source_id: P19097
- source: Alliance_Imported
  text: Alpha subunit of fatty acid synthetase (FAS); the FAS complex catalyzes the
    synthesis of long-chain saturated fatty acids and is subject to allosteric regulation
    by palmitoyl-CoA binding distal to the catalytic site to inhibit ketoacyl reductase
    activity; contains the acyl-carrier protein domain and beta-ketoacyl reductase,
    beta-ketoacyl synthase and self-pantetheinylation activities
  source_type: curated
  url: https://www.yeastgenome.org/locus/FAS2
  source_id: SGD:S000006152
- source: Alliance_Automated
  text: Enables 3-oxoacyl-[acyl-carrier-protein] reductase (NADPH) activity; 3-oxoacyl-[acyl-carrier-protein]
    synthase activity; and holo-[acyl-carrier-protein] synthase activity. Contributes
    to fatty acid synthase activity. Involved in long-chain fatty acid biosynthetic
    process. Located in cytosol. Part of fatty acid synthase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/FAS2
  source_id: SGD:S000006152
