descriptions:
- source: UniProt
  text: 'Fatty acid synthetase catalyzes the formation of long-chain fatty acids from
    acetyl-CoA, malonyl-CoA and NADPH. The alpha subunit contains domains for: acyl
    carrier protein, 3-oxoacyl-[acyl-carrier- protein] reductase, and 3-oxoacyl-[acyl-carrier-protein]
    synthase. This subunit coordinates the binding of the six beta subunits to the
    enzyme complex.'
