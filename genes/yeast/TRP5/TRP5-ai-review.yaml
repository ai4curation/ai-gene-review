  label: Saccharomyces cerevisiae S288C
description: Tryptophan synthase (EC 4.2.1.20) of Saccharomyces cerevisiae, a single polypeptide in which an N-terminal
  TrpA-like alpha domain cleaves indole-3-glycerol phosphate to indole and glyceraldehyde 3-phosphate and a C-terminal
  pyridoxal 5'-phosphate-dependent TrpB-like beta domain condenses indole with L-serine to form L-tryptophan, the
  final step of tryptophan biosynthesis. The purified enzyme catalyses the IGP lyase, indole-serine condensation
  and overall reactions. It is an abundant soluble cytoplasmic protein.
