- term:
    id: GO:0046417
    label: chorismate metabolic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:ALL-CHORISMATE-PWY-1
  review:
    summary: Inherited from the YeastPathways superpathway ALL-CHORISMATE-PWY-1 (superpathway of chorismate metabolism).
      TRP5 catalyses condensation of indole (from IGP) with L-serine to tryptophan, a reaction that neither consumes
      nor produces chorismate; it acts on a downstream intermediate. The specific branch process is already annotated,
      and in GO that process is not a descendant of chorismate metabolic process, so this row only reflects superpathway
      membership.
    action: MARK_AS_OVER_ANNOTATED
    reason: Superpathway-inherited BP; the gene product does not act on chorismate.
