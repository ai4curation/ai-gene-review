core_functions:
- description: Biotin-dependent ATP-driven carboxylation of pyruvate to oxaloacetate (EC 6.4.1.1) in the
    cytosol, providing anaplerotic oxaloacetate for aspartate-family amino acid synthesis and the entry
    step of gluconeogenesis from pyruvate.
  molecular_function:
    id: GO:0004736
    label: pyruvate carboxylase activity
  directly_involved_in:
  - id: GO:0006094
    label: gluconeogenesis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:2039506
    supporting_text: has an important anaplerotic role in the production of oxaloacetate from pyruvate
  - reference_id: PMID:1921979
    supporting_text: simultaneous disruption of both genes resulted in inability to grow on glucose as
      sole carbon source, unless aspartate was added to the medium
  - reference_id: PMID:2665820
    supporting_text: pyruvate carboxylase was found to be a cytosolic enzyme in both yeasts
  - reference_id: file:yeast/PYC1/PYC1-uniprot.txt
    supporting_text: Reaction=hydrogencarbonate + pyruvate + ATP = oxaloacetate + ADP +
suggested_questions:
- question: Should yeast pyruvate carboxylases carry a biotin binding (GO:0009374) or biotin carboxylase
    annotation? The biotinyl-lysine and the biotin carboxylase half-reaction are well established for
    the family, but there is no GOA row for either.
- question: Do PYC1/PYC2 heterotetramers have distinct regulatory (acetyl-CoA, aspartate) properties compared
    with the homotetramers?
suggested_experiments:
- description: Measure the PC activity and acetyl-CoA/aspartate sensitivity of purified Pyc1p, Pyc2p and
    mixed tetramers to test whether the paralogs have specialised regulatory properties.
