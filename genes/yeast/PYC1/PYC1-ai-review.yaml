  label: Saccharomyces cerevisiae S288C
description: 'PYC1 (YGL062W) encodes pyruvate carboxylase isozyme 1 (EC 6.4.1.1), a ~130 kDa biotin-dependent
  enzyme. It carboxylates pyruvate to oxaloacetate in two half-reactions: ATP-dependent carboxylation
  of the covalently attached biotin (biotin carboxylase/ATP-grasp domain), then carboxyl transfer to pyruvate
  (carboxyltransferase domain). Like other fungal PCs it forms homotetramers, and unlike the mitochondrial
  animal enzyme it is cytosolic. Pyc1p and its 90%-identical paralog Pyc2p supply oxaloacetate anaplerotically
  for aspartate and the aspartate-family amino acids, and they provide the entry step for gluconeogenesis
  from pyruvate. No bypass exists: pyc1 pyc2 double mutants cannot grow on glucose without aspartate.
  Pyc1p is the major isozyme. pyc1 nulls retain only 10-20% of PC activity, need aspartate for efficient
  growth, and cannot grow on ethanol without aspartate. PYC1 expression is relatively constant on glucose
  and strongly elevated on ethanol. Pyc1p and Pyc2p can form mixed oligomers.'
