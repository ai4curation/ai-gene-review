description: Argininosuccinate lyase (arginosuccinase, EC 4.3.2.1) of Saccharomyces cerevisiae, a cytosolic
  homotetrameric member of the fumarase/lyase class I family. It cleaves argininosuccinate into L-arginine
  and fumarate, the final step of L-arginine biosynthesis. ARG4 is one of the most abundant arginine-pathway
  enzymes, is subject to general amino acid control, and the ARG4 locus is widely used as a model meiotic
  recombination hotspot and genetic marker.
