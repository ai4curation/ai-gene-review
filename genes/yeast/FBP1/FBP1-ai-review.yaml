taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FBP1 encodes fructose-1,6-bisphosphatase (FBPase, EC 3.1.3.11) of Saccharomyces cerevisiae,
  the key gluconeogenic enzyme that hydrolyses fructose 1,6-bisphosphate to fructose 6-phosphate and inorganic
  phosphate. The cytosolic, Mg2+-dependent homotetramer is allosterically inhibited by AMP and fructose
  2,6-bisphosphate, and fructose 2,6-bisphosphate also promotes its inactivating phosphorylation by PKA.
  FBP1 is required for growth on non-fermentable carbon sources and there is no bypass for this step.
  Its expression is glucose-repressed, and on glucose re-feeding the enzyme is rapidly inactivated and
  destroyed (catabolite inactivation) by the Gid/CTLH ubiquitin ligase and the proteasome, or via the
  vacuole import and degradation pathway; a fraction of FBPase has been reported in the periplasm during
  prolonged glucose starvation. FBP1 is not part of glycolysis and opposes the phosphofructokinase step.
