descriptions:
- source: Alliance_Imported
  text: Fructose-1,6-bisphosphatase; key regulatory enzyme in the gluconeogenesis
    pathway, required for glucose metabolism; undergoes either proteasome-mediated
    or autophagy-mediated degradation depending on growth conditions; glucose starvation
    results in redistribution to the periplasm; interacts with Vid30p
  source_type: curated
  url: https://www.yeastgenome.org/locus/FBP1
  source_id: SGD:S000004369
- source: Alliance_Automated
  text: Enables fructose 1,6-bisphosphate 1-phosphatase activity. Involved in gluconeogenesis
    and reactive oxygen species metabolic process. Located in cytosol and periplasmic
    space. Human ortholog(s) of this gene implicated in fructose-1,6-bisphosphatase
    deficiency and leukodystrophy. Orthologous to human FBP1 (fructose-bisphosphatase
    1) and FBP2 (fructose-bisphosphatase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FBP1
