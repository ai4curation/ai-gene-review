id: P14843
gene_symbol: ARO3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ARO3 encodes the phenylalanine-inhibited isozyme of 3-deoxy-D-arabino-heptulosonate 7-phosphate
  (DAHP) synthase (EC 2.5.1.54) of Saccharomyces cerevisiae, a class I DAHP synthase (beta/alpha barrel)
  that condenses phosphoenolpyruvate and D-erythrose 4-phosphate to DAHP, the first committed step of
  the shikimate pathway leading to chorismate and the aromatic amino acids. Aro3 and its paralogue Aro4
  (tyrosine-inhibited) are functionally redundant for growth: either isozyme alone supplies sufficient
  DAHP, and only aro3 aro4 double mutants are aromatic auxotrophs. Feedback specificity (Phe versus Tyr)
  is set by a single residue in a cavity formed by the barrel extension (Ser in Aro3, Gly226 in Aro4).
  ARO3 is a cytosolic enzyme whose expression is controlled by GCN4 general amino acid control.'
