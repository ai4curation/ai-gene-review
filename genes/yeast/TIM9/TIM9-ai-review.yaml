- id: PMID:22984289
  title: Intermembrane space proteome of yeast mitochondria.
  findings:
  - statement: This comprehensive yeast IMS proteome used Tim9 as a known IMS marker
      and identified more than 90% of known soluble IMS proteins in Bax-releasable
      mitochondrial fractions.
    supporting_text: From the known 31 soluble IMS proteins, 29 proteins were
      reproducibly identified, corresponding to a coverage of >90%.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified; full text cached. Supports broad IMS localization
      by subcompartment proteomics and uses Tim9 as a canonical IMS import marker.
- id: PMID:30445040
  title: Structural Basis of Membrane Protein Chaperoning through the Mitochondrial
    Intermembrane Space.
  findings:
  - statement: Reconstituted yeast TIM9-TIM10 binds unfolded alpha-helical carrier
      precursors and a VDAC/Por1 beta-hairpin peptide through the same hydrophobic
      cleft, and Tim9/Tim10 binding-cleft mutations impair carrier and beta-barrel
      biogenesis in vivo.
    supporting_text: Mutations in these binding sites cause cell death or growth
      defects associated with impairment of carrier and β-barrel protein biogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified; full text cached. Direct yeast structural,
      biochemical, and mutational evidence for Tim9-Tim10 holdase activity and
      for small-Tim participation in both TIM22 carrier import and beta-barrel
      precursor handling.
core_functions:
- molecular_function:
    id: GO:0140309
    label: unfolded protein holdase activity
  description: TIM9 functions as part of the Tim9-Tim10 hexameric carrier-holdase
    complex that binds unfolded hydrophobic transmembrane protein precursors and escorts
    them from the TOM complex across the aqueous IMS to the TIM22 complex for inner
    membrane insertion. The substrate shielding/anti-aggregation dimension is the
    defining specificity of this holdase activity; a possible SAM-directed route is
    secondary and less directly documented in the cached TIM9 literature.
  directly_involved_in:
  - id: GO:7770061
    label: TOM-TIM22-mediated mitochondrial inner membrane protein insertion
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  in_complex:
    id: GO:0042719
    label: mitochondrial intermembrane space chaperone complex
  supported_by:
  - reference_id: PMID:12138093
    supporting_text: the reconstituted TIM10 complex is functional because it bound
      to the physiological substrate ADP/ATP carrier and displayed chaperone activity
      in refolding the model substrate firefly luciferase.
  - reference_id: PMID:9822593
    supporting_text: Tim9p is a new subunit of the TIM machinery that guides hydrophobic
      inner membrane proteins across the aqueous intermembrane space.
proposed_new_terms: []
suggested_questions:
- question: What proportion of TIM9 client handling is directed to TIM22 versus SAM
    in vivo, and which individual beta-barrel precursors require the Tim9-Tim10 complex?
- question: How do Tim9's structural contribution to the heterohexamer and Tim10's
    stronger isolated AAC-binding capacity partition client recognition within the
    intact complex?
suggested_experiments:
- description: Perform time-resolved crosslinking of endogenous Tim9 and Tim10 during
    synchronized import of carrier and beta-barrel precursor panels, quantifying handoff
    to TIM22 or SAM.
  hypothesis: Tim9-Tim10 directly handles both client classes, but TIM22-directed
    carrier delivery is the dominant and most robust TIM9-dependent route.
- description: Reconstitute Tim9-Tim10 complexes carrying interface-preserving Tim9
    client-contact mutations and measure complex assembly, aggregation suppression,
    and precursor delivery.
  hypothesis: Tim9 contributes client-contact surfaces beyond its structural role,
    even though isolated Tim10 shows stronger AAC binding than isolated Tim9.
