      holdase activity" was created in Nov 2025 specifically for TIM carrier-holdases
      (go-ontology#30552). The current definition emphasizes binding an unfolded client,
      escorting it to an acceptor or location, and preventing aggregation. The Tim9-Tim10
      complex acts as a chaperone-like protein that protects hydrophobic precursors
