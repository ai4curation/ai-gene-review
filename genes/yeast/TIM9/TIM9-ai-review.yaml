id: O74700
gene_symbol: TIM9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TIM9 is a small mitochondrial intermembrane space (IMS) chaperone that
  forms a hexameric complex with TIM10 (the Tim9-Tim10 or TIM10 complex, composed
  of 3 copies of each subunit). This soluble 70 kDa complex functions as a carrier-holdase
  that escorts hydrophobic transmembrane protein precursors, especially mitochondrial
  carriers, from the TOM complex across the aqueous IMS to the TIM22 complex for insertion
  into the inner membrane. Small Tim complexes have also been implicated in delivery
  of some beta-barrel precursors toward the SAM complex. TIM9 contains a twin CX3C
  motif that forms two intramolecular disulfide bonds in the IMS; during cytoplasmic
  transit these cysteines may coordinate zinc. TIM9 is essential for viability and
  plays both a structural role in complex assembly and a functional role in substrate
  recognition, with its N-terminal region required for efficient trapping of incoming
  substrates.
