- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: IEA annotation from UniProtKB keyword mapping (KW-0479 Metal-binding).
      TIM9 has a twin CX3C motif with four conserved cysteines. However, in the mature
      IMS-localized form, these cysteines form disulfide bonds rather than coordinating
      metal ions. Zinc coordination is thought to occur only transiently during cytoplasmic
      transit, and the mature functional form does not bind zinc (PMID:11867522).
      This IEA is misleading for the functional state of TIM9.
    action: MARK_AS_OVER_ANNOTATED
    reason: While TIM9 may transiently coordinate zinc during its own import through
      the TOM complex, the mature functional form in the IMS contains disulfide bonds
      rather than zinc-coordinated cysteines (PMID:11867522). The UniProt entry itself
      states that the twin CX3C motif "contains 4 conserved Cys residues that form
      2 disulfide bonds in the mitochondrial intermembrane space" and zinc coordination
      is only probable during transit. Annotating TIM9 as a metal ion binding protein
      is misleading for its functional state.
    supported_by:
    - reference_id: UniProt:O74700
      supporting_text: The twin CX3C motif contains 4 conserved Cys residues that
        form 2 disulfide bonds in the mitochondrial intermembrane space. However,
        during the transit of TIM9 from cytoplasm into mitochondrion, the Cys residues
        probably coordinate zinc, thereby preventing folding and allowing its transfer
        across mitochondrial outer membrane
    - reference_id: file:yeast/TIM9/TIM9-deep-research-falcon.md
      supporting_text: Small TIM proteins (including Tim9) are imported through TOM
        and undergo oxidative folding in the IMS via the **MIA (mitochondrial import
        and assembly) pathway**, which introduces disulfides in the conserved CX3C
        motifs
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11483513
  review:
    summary: IPI annotation based on physical interaction with TIM10 (PMID:11483513).
      Tim9 and Tim10 purified from E. coli can form a complex of the same size as
      the endogenous complex. This demonstrates direct protein-protein interaction.
      However, "protein binding" is uninformative -- TIM9 binding to TIM10 reflects
      its role in forming the functional hexameric chaperone complex.
    action: REMOVE
    reason: GO:0005515 "protein binding" is too vague to carry forward as a functional
      annotation. The Tim9-Tim10 interaction itself is real, but the specific biology
      is TIM9's membership in the mitochondrial IMS chaperone complex and its contribution
      to holdase/transporter activity in the assembled heterohexamer. This IPI evidence
      does not require a separate generic protein-binding assertion.
    supported_by:
    - reference_id: PMID:11483513
      supporting_text: Tim9 and Tim10 purified from Escherichia coli can form a complex
        of the same size as the endogenous complex from yeast mitochondria. This shows
        that no other mitochondrial protein is required for the formation of the TIM10
        complex.
    - reference_id: file:yeast/TIM9/TIM9-deep-research-falcon.md
      supporting_text: Tim9 and Tim10 assemble into an essential heterohexameric Tim9/10
        complex** that chaperones hydrophobic preproteins from TOM to TIM22
    - reference_id: file:yeast/TIM9/TIM9-deep-research-falcon.md
      supporting_text: Biochemical substrate-binding evidence indicates that **Tim10**
        (alone) can bind the **ATP/ADP carrier (AAC)** similarly to the Tim9–Tim10
        complex, whereas **Tim9 alone does not bind AAC**, supporting a model where
        Tim10 provides key substrate-binding elements within the complex
