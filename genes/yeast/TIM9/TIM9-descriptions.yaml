- source: Alliance_Automated
  text: Enables unfolded protein holdase activity. Involved in TOM-TIM22-mediated
    mitochondrial inner membrane protein insertion and beta barrel protein insertion
    into mitochondrial outer membrane. Located in mitochondrial inner membrane and
    mitochondrial intermembrane space. Part of TIM22 mitochondrial import inner membrane
    insertion complex and mitochondrial intermembrane space chaperone complex. Orthologous
    to several human genes including TIMM9 (translocase of inner mitochondrial membrane
    9).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TIM9
  source_id: SGD:S000007256
- source: RefSeq
  text: Enables protein transporter activity and unfolded protein binding activity.
    Involved in protein insertion into mitochondrial inner membrane. Located in mitochondrion.
    Part of TIM22 mitochondrial import inner membrane insertion complex and mitochondrial
    intermembrane space protein transporter complex. Orthologous to several human
    genes including TIMM9 (translocase of inner mitochondrial membrane 9). [provided
    by Alliance of Genome Resources, Jul 2025]
