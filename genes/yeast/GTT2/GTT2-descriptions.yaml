- source: Alliance_Automated
  text: Enables glutathione transferase activity. Involved in glutathione metabolic
    process. Located in mitochondrion. Human ortholog(s) of this gene implicated in
    several diseases, including cancer (multiple); eye disease (multiple); hematopoietic
    system disease (multiple); liver disease (multiple); and lung disease (multiple).
    Orthologous to several human genes including GSTT1 (glutathione S-transferase
    theta 1); GSTT2 (glutathione S-transferase theta 2 (gene/pseudogene)); and GSTT2B
    (glutathione S-transferase theta 2B).
