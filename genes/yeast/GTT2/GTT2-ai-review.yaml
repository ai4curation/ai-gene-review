  label: Saccharomyces cerevisiae S288C
description: GTT2 (YLL060C) encodes a homodimeric glutathione S-transferase that is phylogenetically related
  to the zeta class of GSTs. Recombinant Gtt2 conjugates reduced glutathione to the model electrophile
  1-chloro-2,4-dinitrobenzene. It is presumed soluble and cytosolic, unlike its ER-associated paralog
  Gtt1. Strains lacking GTT1 and/or GTT2 are viable but are sensitive to heat shock in stationary phase
  and grow poorly at high temperature. Gtt1 and Gtt2, with the vacuolar GS-X pump Ycf1, are needed for
  glutaredoxin-mediated hydroperoxide resistance, consistent with glutathione conjugation and vacuolar
  sequestration of oxidation products.
