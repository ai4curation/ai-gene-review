core_functions:
- description: Cytosolic glutathione S-transferase (EC 2.5.1.18, zeta-class related) conjugating reduced
    glutathione to electrophiles such as CDNB; homodimer; contributes with Gtt1 to stationary-phase thermotolerance
    and to glutathione-conjugation-dependent hydroperoxide resistance.
