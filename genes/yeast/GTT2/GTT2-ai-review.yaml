    supporting_text: Both Gtt1p and Gtt2p are able to form homodimers, as determined by two hybrid assay.
suggested_questions:
- question: Gtt2 groups with the zeta GST class; does it have maleylacetoacetate isomerase or dichloroacetate
    dehalogenase activity like other zeta GSTs, and what are its endogenous substrates?
