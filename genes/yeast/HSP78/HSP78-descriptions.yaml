  text: Enables ATP hydrolysis activity and misfolded protein binding activity. Involved
    in several processes, including protein refolding; protein stabilization; and
    protein unfolding. Located in mitochondrial matrix. Human ortholog(s) of this
    gene implicated in 3-methylglutaconic aciduria type 7a; 3-methylglutaconic aciduria
    type 7b; and severe congenital neutropenia. Orthologous to human CLPB (ClpB family
    mitochondrial disaggregase).
