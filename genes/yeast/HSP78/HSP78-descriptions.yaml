gene_symbol: HSP78
organism: yeast
uniprot_id: P33416
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required, in concert with mitochondrial Hsp70 (SSC1), for the dissociation,
    resolubilization and refolding of aggregates of damaged proteins in the mitochondrial
    matrix after heat stress. May extract proteins from aggregates by unfolding and
    threading them in an ATP- dependent process through the axial channel of the protein
    hexamer, after which they can be refolded by the Hsp70 chaperone system. Required
    for resumption of mitochondrial respiratory function, DNA synthesis and morphology
    after heat stress. Its main role may be maintaining the molecular chaperone SSC1
    in a soluble and functional state. Also required for the efficient degradation
    of proteins by matrix protease PIM1, independent on its protein remodeling activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33416
  source_id: P33416
- source: Alliance_Imported
  text: Oligomeric mitochondrial matrix chaperone; cooperates with Ssc1p in mitochondrial
    thermotolerance after heat shock; prevents the aggregation of misfolded proteins
    as well as resolubilize protein aggregates; involved in response to ethanol stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/HSP78
  source_id: SGD:S000002666
- source: Alliance_Automated
  text: Enables ATP hydrolysis activity and misfolded protein binding activity. Involved
    in several processes, including protein refolding; protein stabilization; and
    protein unfolding. Located in mitochondrial matrix. Human ortholog(s) of this
    gene implicated in 3-methylglutaconic aciduria type 7a; 3-methylglutaconic aciduria
    type 7b; and severe congenital neutropenia. Orthologous to human CLPB (ClpB family
    mitochondrial disaggregase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HSP78
  source_id: SGD:S000002666
