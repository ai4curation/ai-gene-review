gene_symbol: HSP78
organism: yeast
uniprot_id: P33416
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Required, in concert with mitochondrial Hsp70 (SSC1), for the dissociation,
    resolubilization and refolding of aggregates of damaged proteins in the mitochondrial
    matrix after heat stress. May extract proteins from aggregates by unfolding and
    threading them in an ATP- dependent process through the axial channel of the protein
    hexamer, after which they can be refolded by the Hsp70 chaperone system. Required
    for resumption of mitochondrial respiratory function, DNA synthesis and morphology
    after heat stress. Its main role may be maintaining the molecular chaperone SSC1
    in a soluble and functional state. Also required for the efficient degradation
    of proteins by matrix protease PIM1, independent on its protein remodeling activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33416
  source_id: P33416
