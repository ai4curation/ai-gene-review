  title: Quantitative variations of the mitochondrial proteome and phosphoproteome
    during fermentative and respiratory growth in Saccharomyces cerevisiae.
  findings: []
- id: PMID:7628444
  title: Hsp78, a Clp homologue within mitochondria, can substitute for chaperone
    functions of mt-hsp70.
  findings:
    - statement: >-
        Hsp78 binds newly imported mitochondrial polypeptides and prevents
        misfolded matrix proteins from aggregating when mitochondrial Hsp70 is
        impaired.
      supporting_text: >-
        hsp78 suppresses the defect in mitochondrial protein import under
        permissive conditions in vitro and interacts directly with newly
        imported polypeptide chains.
- id: PMID:8413229
  title: HSP78 encodes a yeast mitochondrial heat shock protein in the Clp family
    of ATP-dependent proteases.
  findings:
    - statement: >-
        Hsp78 is a heat-regulated soluble Clp/Hsp100 protein in the
        mitochondrial matrix.
      supporting_text: >-
        Submitochondrial fractionation showed that hsp78 is a soluble protein
        located in the mitochondrial matrix.
- id: PMID:8830768
  title: The molecular chaperone Hsp78 confers compartment-specific thermotolerance
    to mitochondria.
  findings:
    - statement: >-
        Hsp78 protects mitochondrial respiration and genome integrity during
        severe temperature stress.
      supporting_text: >-
        Hsp78 is crucial for maintenance of respiratory competence and for
        mitochondrial genome integrity under severe temperature stress
        (mitochondrial thermotolerance).
