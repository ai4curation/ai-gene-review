suggested_questions:
  - question: >-
      Should SGD replace generic HSP78 protein-binding rows from Ssa1
      high-throughput studies with the existing misfolded-protein binding and
      the proposed ATP-dependent protein disaggregase activity?
suggested_experiments:
  - description: >-
      Reconstitute Hsp78-driven disaggregation with purified Ssc1, Mdj1, and
      Mge1 on a defined aggregated mitochondrial client to connect ATP hydrolysis,
      aggregate extraction, and productive refolding in one assay.
