  review:
    summary: >-
      This generic protein-binding row comes from a genome-scale AP-MS survey
      and does not state an informative HSP78 molecular function.
    action: REMOVE
    reason: >-
      Hsp78 has a well-defined ATP-dependent disaggregase activity and a
      mitochondrial client-binding role. A high-throughput physical interaction
      with the cytosolic Hsp70 Ssa1 is too generic to keep as a standalone
      molecular-function annotation for this mitochondrial matrix protein.
    supported_by:
      - reference_id: PMID:16429126
        supporting_text: >-
          Here we report the first genome-wide screen for complexes in an
          organism, budding yeast, using affinity purification and mass
          spectrometry.
