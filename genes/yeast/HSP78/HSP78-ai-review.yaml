    summary: >-
      HSP78 should gain the specific integrated molecular-function term for its
      ATP-dependent disaggregase activity.
    action: NEW
    reason: >-
      Existing annotations cover ATP hydrolysis plus protein refolding and
      unfolding processes, but GO:0140545 directly names the Hsp78 activity that
      couples ATP hydrolysis to extraction of polypeptides from aggregates.
    additional_reference_ids:
      - PMID:11734006
    supported_by:
      - reference_id: PMID:16460754
        supporting_text: >-
          The ATP-dependent disaggregation activity of Hsp78 was capable of
          reversing the preprotein import defect of a destabilized mutant form
          of Ssc1.
