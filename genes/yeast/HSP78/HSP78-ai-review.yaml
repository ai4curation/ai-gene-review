id: P33416
gene_symbol: HSP78
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  HSP78 encodes the mitochondrial Hsp100/ClpB-family AAA+ chaperone in
  Saccharomyces cerevisiae. Hsp78 is a soluble mitochondrial matrix protein that
  forms ATP-dependent homohexamers, hydrolyzes ATP, binds damaged matrix
  proteins, and cooperates with the Ssc1/Mdj1/Mge1 mitochondrial Hsp70 system to
  resolubilize and refold heat-induced protein aggregates. Its activity protects
  respiratory competence and mitochondrial genome integrity after severe heat
  stress.
