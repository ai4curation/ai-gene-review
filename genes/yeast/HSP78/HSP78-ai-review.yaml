- id: PMID:11734006
  title: Importance of two ATP-binding sites for oligomerization, ATPase activity
    and chaperone function of mitochondrial Hsp78 protein.
  findings:
    - statement: >-
        Purified Hsp78 forms an ATP-dependent homohexamer, has ATPase activity,
        and cooperates with the mitochondrial Hsp70 system to reactivate
        substrate proteins.
      supporting_text: >-
        Studies on the chaperone activity of Hsp78 show that its cooperation
        with the mitochondrial Hsp70 system, consisting of Ssc1p, Mdj1p and
        Mge1p, is needed for the efficient reactivation of substrate proteins.
- id: PMID:16429126
  title: Proteome survey reveals modularity of the yeast cell machinery.
  findings: []
- id: PMID:16460754
  title: The disaggregation activity of the mitochondrial ClpB homolog Hsp78 maintains
    Hsp70 function during heat stress.
  findings:
    - statement: >-
        Hsp78 has ATP-dependent mitochondrial disaggregation activity and
        resolubilizes heat-induced protein aggregates in intact mitochondria.
      supporting_text: >-
        By establishing an aggregation/disaggregation assay in intact
        mitochondria we demonstrated that Hsp78 is indispensable for the
        resolubilization of protein aggregates generated by heat stress under
        in vivo conditions.
