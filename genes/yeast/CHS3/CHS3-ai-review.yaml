taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Chitin synthase 3 (Chs3p; CAL1/CSD2/DIT101/KIT2) of Saccharomyces cerevisiae is the catalytic subunit
  of chitin synthase III (CSIII), a multi-pass plasma-membrane class IV chitin synthase (GT2 family) that polymerises
  N-acetylglucosamine from UDP-GlcNAc (EC 2.4.1.16). CSIII makes most of the cell''s chitin: the chitin ring at
  the base of the emerging bud (later the bud scar), chitin dispersed in the lateral wall (cross-linked to glucans),
  stress-induced chitin, chitin in mating projections, and during sporulation the chitin that Cda1p/Cda2p convert
  to the chitosan layer of the ascospore wall. Chs3p forms homo-oligomers; its activity requires the activator Chs4p
  (Shc1p during sporulation). Its trafficking is tightly regulated: ER exit requires the chaperone Chs7p and palmitoylation
  by Pfa4p, TGN-to-plasma-membrane transport requires the exomer (Chs5p/Chs6p and ChAPs), and Chs3p cycles between
  the plasma membrane and endosome-derived intracellular stores (chitosomes), being mobilized to the surface under
  cell wall stress via Rho1/Pkc1. At the bud neck it is tethered to septins via Chs4p and Bni4p. chs3 mutants have
  greatly reduced wall chitin and are resistant to Calcofluor White.'
