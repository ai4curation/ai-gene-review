- source: Alliance_Imported
  text: Chitin synthase III; catalyzes the transfer of N-acetylglucosamine (GlcNAc)
    to chitin; required for synthesis of the majority of cell wall chitin, the chitin
    ring during bud emergence, and spore wall chitosan; contains overlapping di-leucine
    and di-acidic signals that mediate, respectively, intracellular trafficking by
    AP-1 and trafficking to plasma membrane by exomer complex; requires AP-3 complex
    for its intracellular retention
