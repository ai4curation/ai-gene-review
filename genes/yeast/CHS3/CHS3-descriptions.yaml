descriptions:
- source: UniProt
  text: Polymerizes chitin, a structural polymer of the cell wall and septum, by transferring
    the sugar moiety of UDP-GlcNAc to the non- reducing end of the growing chitin
    polymer (Probable) (PubMed:9760183). Appears to be responsible for synthesis of
    the majority of the chitin found in the cell wall periphery (PubMed:2050738).
    It is involved in the synthesis of the chitin ring that forms in the cell wall
    just before bud emergence (PubMed:2050738). This ring remains at the base of the
    bud as the bud grows and ultimately forms part of the bud scar marking the division
    site on the mother cell (PubMed:2050738). Also catalyzes the synthesis of chitin
    laid down during mating and spore cell-wall synthesis (PubMed:1293886, PubMed:2050737,
    PubMed:2050738).
