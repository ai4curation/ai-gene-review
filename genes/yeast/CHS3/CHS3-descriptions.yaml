gene_symbol: CHS3
organism: yeast
uniprot_id: P29465
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Polymerizes chitin, a structural polymer of the cell wall and septum, by transferring
    the sugar moiety of UDP-GlcNAc to the non- reducing end of the growing chitin
    polymer (Probable) (PubMed:9760183). Appears to be responsible for synthesis of
    the majority of the chitin found in the cell wall periphery (PubMed:2050738).
    It is involved in the synthesis of the chitin ring that forms in the cell wall
    just before bud emergence (PubMed:2050738). This ring remains at the base of the
    bud as the bud grows and ultimately forms part of the bud scar marking the division
    site on the mother cell (PubMed:2050738). Also catalyzes the synthesis of chitin
    laid down during mating and spore cell-wall synthesis (PubMed:1293886, PubMed:2050737,
    PubMed:2050738).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P29465
  source_id: P29465
- source: Alliance_Imported
  text: Chitin synthase III; catalyzes the transfer of N-acetylglucosamine (GlcNAc)
    to chitin; required for synthesis of the majority of cell wall chitin, the chitin
    ring during bud emergence, and spore wall chitosan; contains overlapping di-leucine
    and di-acidic signals that mediate, respectively, intracellular trafficking by
    AP-1 and trafficking to plasma membrane by exomer complex; requires AP-3 complex
    for its intracellular retention
  source_type: curated
  url: https://www.yeastgenome.org/locus/CHS3
  source_id: SGD:S000000227
- source: Alliance_Automated
  text: Enables chitin synthase activity. Involved in ascospore wall assembly; chitin
    biosynthetic process; and protein localization to bud neck. Located in several
    cellular components, including cytoplasmic vesicle; incipient cellular bud site;
    and prospore membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CHS3
  source_id: SGD:S000000227
