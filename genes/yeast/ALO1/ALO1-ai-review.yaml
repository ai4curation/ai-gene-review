    label: D-arabinono-1,4-lactone oxidase activity
  directly_involved_in:
  - id: GO:0070485
    label: dehydro-D-arabinono-1,4-lactone biosynthetic process
  locations:
  - id: GO:0032473
    label: cytoplasmic side of mitochondrial outer membrane
  description: Alo1 is the mitochondrial outer-membrane FAD-dependent oxidase that
    catalyzes the terminal oxidation of D-arabinono-1,4-lactone in D-erythroascorbate
    biosynthesis, providing the yeast-specific antioxidant linked to oxidative-stress
    resistance.
suggested_questions:
- question: Does Alo1's oxidase activity directly modulate Myo2 recruitment to mitochondria,
    or does Alo1 provide a distinct outer-membrane interaction surface independent
    of D-erythroascorbate synthesis?

suggested_experiments:
- description: Reconstitute Alo1 variants that abolish D-arabinono-1,4-lactone oxidase
    activity but preserve mitochondrial outer-membrane targeting, then assay Myo2
    binding and bud-directed mitochondrial inheritance under oxidative stress.
