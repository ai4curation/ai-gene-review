id: P54783
gene_symbol: ALO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ALO1 (YML086C) encodes D-arabinono-1,4-lactone oxidase (EC 1.1.3.37), the terminal enzyme
  of D-erythroascorbate (dehydro-D-arabinono-1,4-lactone) biosynthesis. It is a covalently FAD-linked
  flavoprotein of the vanillyl alcohol oxidase family, homologous to animal L-gulono-1,4-lactone oxidase
  and plant L-galactono-1,4-lactone dehydrogenase, and uses O2 to oxidise D-arabinono-1,4-lactone (and
  also L-gulono- and L-galactono-1,4-lactone), producing hydrogen peroxide. The enzyme is an integral
  protein of the mitochondrial outer membrane, facing the cytoplasm. alo1 mutants lack erythroascorbate
  and are more sensitive to oxidative stress. Alo1 also binds the cargo-binding domain of the myosin V
  motor Myo2 and is required for normal mitochondrial morphology and inheritance into the bud, particularly
  under oxidative stress.
