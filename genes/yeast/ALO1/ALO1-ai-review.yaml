id: P54783
gene_symbol: ALO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ALO1 encodes a FAD-dependent D-arabinono-1,4-lactone oxidase associated
  with the mitochondrial outer membrane. It catalyzes the terminal oxidation in
  yeast D-erythroascorbate biosynthesis and contributes to oxidative-stress
  resistance. Alo1 also binds the Myo2 cargo-binding domain and supports
  mitochondrial inheritance.
existing_annotations:
- term:
    id: GO:0000001
    label: mitochondrion inheritance
  evidence_type: IGI
  original_reference_id: PMID:39775849
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - SGD:S000004180
  - SGD:S000005248
  review:
    summary: Alo1 supports bud-directed mitochondrial transport and inheritance
      in budding yeast.
    action: KEEP_AS_NON_CORE
    reason: The 2025 Myo2 interactome study identified Alo1 as a robust Myo2-cargo
      domain hit, localized it to the mitochondrial outer membrane, and reported
      mitochondrial morphology and inheritance defects in cells lacking ALO1. SGD's
      IGI annotation is therefore consistent with Alo1 acting with the Myo2 transport
      system in mitochondrial inheritance, but this is a contextual outer-membrane
      transport role rather than Alo1's defining FAD-linked oxidase activity.
    supported_by:
    - reference_id: PMID:39775849
      supporting_text: |-
        One robust hit was Alo1, a poorly
        characterized D-arabinono-1,4-lactone oxidase located in the mitochondrial outer
        membrane. We found that mutants lacking Alo1 exhibited defects in mitochondrial
        morphology and inheritance.
- term:
    id: GO:0000001
    label: mitochondrion inheritance
  evidence_type: IMP
  original_reference_id: PMID:39775849
  qualifier: acts_upstream_of_or_within
  review:
    summary: ALO1 loss perturbs mitochondrial morphology and inheritance.
    action: KEEP_AS_NON_CORE
    reason: Loss-of-function evidence from the 2025 Myo2 interaction study supports
      ALO1 acting upstream of or within mitochondrial inheritance, probably by helping
      recruit the myosin V motor Myo2 to mitochondria. This is a real but secondary
      process annotation beside the core D-erythroascorbate biosynthetic activity.
    supported_by:
    - reference_id: PMID:39775849
      supporting_text: |-
        One robust hit was Alo1, a poorly
        characterized D-arabinono-1,4-lactone oxidase located in the mitochondrial outer
        membrane. We found that mutants lacking Alo1 exhibited defects in mitochondrial
        morphology and inheritance. During oxidative stress, dysfunctional mitochondria
        are immobilized in the mother in wild-type cells. Intriguingly, overexpression
        of ALO1 restored bud-directed transport of mitochondria under these conditions.
        We propose that Alo1 supports the recruitment of Myo2 to mitochondria and its
        activity is particularly important under oxidative stress.
