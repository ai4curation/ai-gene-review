suggested_questions:
- question: Is the Myo2-recruitment role of Alo1 independent of its oxidase activity (e.g. does a catalytically
    dead or FAD-free Alo1 rescue mitochondrial inheritance)?
suggested_experiments:
- description: Express catalytically inactive Alo1 (covalent-FAD histidine mutant) in alo1 cells and test
    erythroascorbate levels, mitochondrial inheritance and Myo2 association separately.
