- source: Alliance_Imported
  text: D-Arabinono-1,4-lactone oxidase; catalyzes the final step in biosynthesis
    of dehydro-D-arabinono-1,4-lactone, which is protective against oxidative stress;
    putative adaptor protein that interacts with the cargo-binding domain of Myo2p
    and has a role in mitochondrial inheritance, especially under conditions of oxidative
    stress; localizes to the mitochondrial outer membrane; null mutant shows improved
    noncanonical amino acid incorporation efficiency in response to the amber (TAG)
    stop codon
