gene_symbol: ALO1
organism: yeast
uniprot_id: P54783
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Can oxidize L-gulono-1,4-lactone as well as D-arabinono-1,4- lactone and L-galactono-1,4-lactone.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54783
  source_id: P54783
- source: Alliance_Imported
  text: D-Arabinono-1,4-lactone oxidase; catalyzes the final step in biosynthesis
    of dehydro-D-arabinono-1,4-lactone, which is protective against oxidative stress;
    putative adaptor protein that interacts with the cargo-binding domain of Myo2p
    and has a role in mitochondrial inheritance, especially under conditions of oxidative
    stress; localizes to the mitochondrial outer membrane; null mutant shows improved
    noncanonical amino acid incorporation efficiency in response to the amber (TAG)
    stop codon
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALO1
  source_id: SGD:S000004551
- source: Alliance_Automated
  text: Enables D-arabinono-1,4-lactone oxidase activity and myosin V binding activity.
    Involved in cellular response to oxidative stress and dehydro-D-arabinono-1,4-lactone
    biosynthetic process. Acts upstream of or within mitochondrion inheritance. Located
    in cytoplasmic side of mitochondrial outer membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALO1
  source_id: SGD:S000004551
fetch_date: '2026-11-01'
