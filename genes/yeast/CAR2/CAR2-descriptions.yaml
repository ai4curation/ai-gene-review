descriptions:
- source: UniProt
  text: Catalyzes the transamination of ornithine into L-glutamate gamma-semialdehyde,
    the second step of arginine degradation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07991
  source_id: P07991
- source: Alliance_Imported
  text: L-ornithine transaminase (OTAse); catalyzes the second step of arginine degradation,
    expression is dually-regulated by allophanate induction and a specific arginine
    induction process; not nitrogen catabolite repression sensitive; protein abundance
    increases in response to DNA replication stress; human homolog OAT complements
    yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAR2
  source_id: SGD:S000004430
- source: Alliance_Automated
  text: Enables L-ornithine transaminase activity. Involved in L-arginine catabolic
    process. Located in cytosol. Used to study gyrate atrophy. Human ortholog(s) of
    this gene implicated in gyrate atrophy. Orthologous to human OAT (ornithine aminotransferase).
