taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ornithine aminotransferase (L-ornithine:2-oxo-acid aminotransferase, EC 2.6.1.13) of Saccharomyces
  cerevisiae, a pyridoxal 5'-phosphate-dependent class-III aminotransferase. CAR2 transfers the delta-amino
  group of L-ornithine to 2-oxoglutarate, yielding L-glutamate 5-semialdehyde (which cyclises to 1-pyrroline-5-carboxylate)
  and L-glutamate. This is the second step of arginine catabolism, following arginase (CAR1), and channels
  ornithine nitrogen and carbon toward glutamate via the proline-utilisation enzymes. Unlike the mitochondrial
  ornithine aminotransferases of animals and plants, the yeast enzyme is found in the soluble cytosolic
  fraction. CAR2 expression is low without inducer and is induced by arginine (and urea); Ty1 insertions
  upstream of the gene can make it constitutive.
