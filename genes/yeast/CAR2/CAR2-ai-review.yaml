  review:
    summary: Mitochondrion IBA from PTN000241155, seeded by animal and plant ornithine aminotransferases
      (human P04181, mouse, rat, Arabidopsis, Drosophila), which are mitochondrial matrix enzymes. No
      fungal protein is among the sources. Yeast OAT fractionates with the soluble cytosolic enzymes,
      whereas the mitochondrial acetylated-cycle enzymes in the same experiment were particulate.
    action: REMOVE
    reason: Target-specific evidence places CAR2 in the cytosol; the mitochondrial location is a lineage-specific
      trait of the animal/plant clade that does not transfer to the fungal enzyme.
    supported_by:
    - reference_id: PMID:205532
      supporting_text: These enzymes were exclusively particulate. Comparison with citrate synthase and
        cytochrome oxidase, and results from isopycnic gradient analysis, suggested that these enzymes
        were associated with the mitochondria.
    - reference_id: PMID:205532
      supporting_text: the two first catabolic enzymes, arginase and ornithine aminotransferase, were
        in the "soluble" fraction of the cell
    propagation_review:
