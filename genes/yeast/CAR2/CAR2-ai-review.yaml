  - UniPathway:UPA00098
  review:
    summary: UniPathway UPA00098 (L-proline biosynthesis; L-glutamate 5-semialdehyde from L-ornithine)
      applied to OATs. Glutamate semialdehyde/P5C from ornithine can be reduced to proline, but in yeast
      the enzyme is induced for arginine catabolism and its product is mainly oxidised to glutamate; proline
      synthesis proceeds primarily from glutamate (PRO1/PRO2/PRO3).
