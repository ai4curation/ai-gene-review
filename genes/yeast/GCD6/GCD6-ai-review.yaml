  title: SGD gene description for GCD6 (yeast)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Catalytic epsilon subunit of eIF2B, GEF for eIF2, regulation by phosphorylated eIF2 and first
      identification as a negative regulator of GCN4 are all verified (PMID:8506384, PMID:10805739, PMID:9472020,
      PMID:8441423). The cytoplasmic foci under replication stress trace to the GFP screen PMID:22842922. The human
      disease statement (CACH/vanishing white matter for EIF2B5) was not checked against a cached paper here but
      is standard knowledge and not used in annotation decisions.
core_functions:
- description: Catalytic subunit of the eIF2B guanine nucleotide exchange factor. Gcd6 binds eIF2 and catalyzes
    GDP-GTP exchange on it, regenerating eIF2-GTP for ternary complex formation in each round of cytoplasmic translation
    initiation. Its exchange activity, within the eIF2B decamer, is the step inhibited by phosphorylated eIF2 during
    the general amino acid control.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0002183
    label: cytoplasmic translational initiation
  - id: GO:0006446
    label: regulation of translational initiation
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0005851
    label: eukaryotic translation initiation factor 2B complex
  supported_by:
  - reference_id: PMID:10805739
    supporting_text: In vitro, eIF2B catalytic function can be provided by the largest (epsilon) subunit alone (eIF2Bepsilon).
  - reference_id: PMID:8506384
    supporting_text: In vitro, this complex catalyzes guanine nucleotide exchange on eIF-2 and overcomes the inhibitory
      effect of GDP on formation of eIF-2.GTP.Met-initiator tRNA(Met) ternary complexes.
  - reference_id: PMID:9472020
    supporting_text: In contrast, the GCD1 and GCD6 subunits form an eIF2B subcomplex that binds equally to eIF2
      and eIF2(alphaP).
suggested_questions:
- question: The Gcd1-Gcd6 catalytic subcomplex is more active than holo-eIF2B and insensitive to eIF2(alphaP) (PMID:9472020).
    Should GO have a cellular component term for the eIF2B catalytic subcomplex, parallel to the regulatory subcomplex,
    so that subunit-level annotations can be precise?
suggested_experiments:
- hypothesis: The cytoplasmic foci that Gcd6 forms under DNA replication stress are eIF2B bodies that sequester
    exchange activity and contribute to translational repression independently of eIF2alpha phosphorylation.
  description: Image Gcd6-GFP foci in wild-type, gcn2-deleted and SUI2-S52A cells after hydroxyurea or MMS treatment,
    co-localize with other eIF2B subunits and eIF2, and measure polysome profiles and GCN4-lacZ expression in each
    background.
