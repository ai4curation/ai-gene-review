- term:
    id: GO:0006446
    label: regulation of translational initiation
  evidence_type: IDA
  original_reference_id: PMID:8506384
  qualifier: involved_in
  review:
    summary: eIF2B complex (including Gcd6) is the GEF whose reduced function derepresses GCN4 translation.
    action: ACCEPT
    reason: 'eIF2B exchange activity is the regulated, rate-setting step of initiation: inhibition of eIF2B by phosphorylated
      eIF2 lowers ternary complex, and reduced-function gcd6 alleles mimic this, derepressing GCN4 translation.
      Gcd6 thus participates directly in regulation of translational initiation; accepted (non-catalytic sensing
      of eIF2(alphaP) lies in the regulatory subcomplex, but the regulated activity is the one Gcd6 provides).'
    supported_by:
    - reference_id: PMID:8506384
      supporting_text: This finding suggests that mutations in GCD-encoded subunits of the complex derepress GCN4
        translation because they mimic eIF-2 alpha phosphorylation in decreasing eIF-2B activity.
