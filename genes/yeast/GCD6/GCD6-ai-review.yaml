id: P32501
gene_symbol: GCD6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Gcd6 is the epsilon subunit of eukaryotic translation initiation factor 2B (eIF2B), the guanine nucleotide
  exchange factor that converts eIF2-GDP into eIF2-GTP so that eIF2 can bind initiator Met-tRNAi and support another
  round of translation initiation. eIF2B is a cytosolic decamer of two copies each of Gcn3 (alpha), Gcd7 (beta),
  Gcd1 (gamma), Gcd2 (delta) and Gcd6 (epsilon); Gcd1 and Gcd6 form the catalytic subcomplex and Gcd6 carries the
  exchange activity in its C-terminal region (residues 518-712, including the W2 domain that also binds eIF2), while
  its N-terminal region couples catalysis to assembly of the full complex. GCD6 is essential. When Gcn2 phosphorylates
  eIF2alpha, phosphorylated eIF2 binds the regulatory subcomplex and blocks productive engagement with the catalytic
  subunits, lowering ternary complex. This reduces general translation and lets ribosomes bypass the inhibitory
  uORFs of GCN4 mRNA; reduced-function gcd6 alleles mimic this and derepress GCN4, which is how the gene was first
  identified. The human ortholog EIF2B5 is mutated in leukoencephalopathy with vanishing white matter.
