      supporting_text: The fact that all five subunits of yeast eIF-2B were first identified as translational regulators
        of GCN4 strongly suggests that regulation of guanine nucleotide exchange on eIF-2 is a key control point
        for translation in yeast cells just as in mammalian cells.
