- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000917496
  - SGD:S000004172
  review:
    summary: >-
      PAINT inference of a cytoplasmic site of activity at the APSES-family node, seeded by
      a single donor, Swi6 (SGD:S000004172). Swi6 genuinely cycles between nucleus and
      cytoplasm (largely cytoplasmic in S, G2 and early M through phosphorylation of Ser160
      next to its NLS), but Mbp1 does not: HA-Mbp1 is nuclear at every cell-cycle stage
      (PMID:20587033), Swi6 export is unaffected in mbp1 cells, and no cytoplasmic activity
      of Mbp1 has been described.
    action: REMOVE
    reason: >-
      Over-propagated IBA argued against on target-specific grounds, exactly as for the
      paralog Swi4. The cytoplasmic localization is a Swi6-specific regulatory property
      (cell-cycle-controlled nuclear import/export of the shared activator subunit), not a
      property of the DNA-binding subunits Mbp1 and Swi4. Even for Swi6 the cytoplasm is
      where the inactive, exported pool resides, so "is_active_in cytoplasm" is not the
      right claim for any member of the node; for Mbp1 it is contradicted by its
      constitutive nuclear localization.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000917496
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Family node grouping the DNA-binding subunits (Swi4, Mbp1) with the regulatory
          subunit Swi6; the cytoplasm evidence belongs only to the Swi6 branch.
      - source_id: SGD:S000004172
        source_label: SWI6
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Swi6 is cytoplasmic in S/G2/M because of Ser160-regulated nuclear transport
          (PMID:12697814); Mbp1 is nuclear throughout the cycle (PMID:20587033).
    supported_by:
    - reference_id: PMID:12697814
      supporting_text: >-
        Swi6p was nuclear during most of the cell cycle, aside from a period in the G 2 -M
        phase
    - reference_id: PMID:12697814
      supporting_text: >-
