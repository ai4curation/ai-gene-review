  - reference_id: file:yeast/MBP1/MBP1-deep-research-falcon.md
    supporting_text: >-
      Mbp1 supplies promoter recognition, whereas Swi6 supplies much of the regulated
      transcriptional activation and coregulatory interface.
  - reference_id: file:yeast/MBP1/MBP1-deep-research-falcon.md
    supporting_text: >-
      During DNA-replication stress, the checkpoint kinase **Rad53** sustains expression of
      an MBF-associated subset by promoting Nrm1 inactivation or dissociation from
      promoter-bound MBF.
proposed_new_terms: []
suggested_questions:
- question: >-
    Mbp1 is the DNA-binding subunit of MBF, yet its IBA for GO:0000978 carries the
    contributes_to qualifier (seeded from the S. pombe MBF subunits, which include the
    non-DNA-binding Cdc10) while the activator IBA (GO:0001228) uses enables, and the same
    family node propagates "is_active_in cytoplasm" from Swi6 and "MBF transcription
    complex" to Swi4. Should the PAINT node distinguish the DNA-binding paralogs (Mbp1,
    Swi4, Res1/Res2) from the shared regulatory subunit (Swi6, Cdc10) so that DNA-binding,
    localization and complex-identity terms are placed on the correct branch?
  experts:
  - Brenda Andrews
  - Curt Wittenberg
- question: >-
    The DNA replication checkpoint sustains MBF-dependent transcription by Rad53-mediated
    phosphorylation and release of the MBF corepressor Nrm1, and Mbp1-dependent genes such as
    RNR1 and TOS4 form a distinct checkpoint-responsive class. Is this output best captured
    on Nrm1 and Rad53 alone, or is there a case (on the evidence that Mbp1/MBF is the
    promoter-bound platform that executes the transcription) for a checkpoint-related
    process annotation on Mbp1, and if so which term would be comparator-consistent with
    Swi6, which shares the complex?
  experts:
  - Robertus A. M. de Bruin
  - Marcus B. Smolka
- question: >-
    UniProt records five Mbp1 phosphosites (Ser110, Ser325, Ser326, Ser330, Ser827) and the
    older literature proposed a dual activator/repressor role for MBF outside G1. Is any of
    these sites a Cdc28, Rad53 or Pho85 site with a demonstrated effect on MCB binding,
    Swi6 association or Nrm1 recruitment, or is all known regulation of MBF exerted through
    Swi6 and Nrm1?
  experts:
  - Robertus A. M. de Bruin
  - Juan Carlos Igual
suggested_experiments:
- hypothesis: >-
    Checkpoint control of MBF-dependent transcription acts entirely through Nrm1 and does not
    require any post-translational modification of Mbp1 itself.
  description: >-
    Map Mbp1 phosphorylation by SILAC phosphoproteomics in synchronised cells with and without
    hydroxyurea or MMS, in RAD53 and rad53 backgrounds, and build non-phosphorylatable and
    phosphomimetic alleles at any Rad53-dependent site. Measure RNR1 and TOS4 nascent
    transcription (4tU-seq) and Mbp1, Swi6 and Nrm1 promoter occupancy by ChIP in each
    allele, in NRM1 and nrm1 backgrounds. If phospho-site mutants of Mbp1 behave as wild
    type while nrm1 alone is epistatic, the checkpoint output should be represented on Nrm1
    rather than on Mbp1.
  experiment_type: phosphoproteomics with promoter occupancy and nascent transcription readouts
- hypothesis: >-
    The Mbp1 and Swi4 DNA-binding domains are interchangeable for viability but not for
    promoter selectivity: an Mbp1 protein carrying the Swi4 APSES domain will rescue the
    lethality of swi4 mbp1 while re-routing the complex to SCB-containing promoters.
  description: >-
    Construct chimeric alleles that swap the N-terminal APSES domains of Mbp1 and Swi4 while
    keeping the native ankyrin and Swi6-binding regions, express them from the native MBP1
    locus, and test viability in swi4 mbp1 cells, genome-wide occupancy (ChIP-seq of the
    tagged chimera versus Mbp1 and Swi4), Nrm1 versus Whi5 co-recruitment, and CLN2 versus
    RNR1 expression timing in elutriated G1 cells. The outcome would separate the
    contribution of DNA-binding specificity from the contribution of the C-terminal
    regulatory regions to the SBF/MBF division of labour.
  experiment_type: domain-swap genetics with genome-wide occupancy
