core_functions:
- description: >-
    Mbp1 is the sequence-specific DNA-binding subunit of the MBF transcription factor. Its
    N-terminal APSES helix-turn-helix domain recognises MCB elements (ACGCGTNA) in the
    promoters of the S-phase cyclin genes CLB5 and CLB6, of SWI4 and of DNA-replication and
    repair genes such as POL1, CDC9, CDC21 and RNR1, and its C-terminal region binds Swi6,
    forming the constitutively nuclear Mbp1-Swi6 heterodimer that occupies MCB-containing
    promoter chromatin. In late G1 MBF activates Pol II transcription of this regulon,
    which together with the SBF-driven G1 cyclin genes constitutes the Start transcriptional
    switch; after G1 the MBF-bound corepressor Nrm1 (an MBF target) switches the complex
    off, and under replication stress Rad53-dependent removal of Nrm1 keeps the
    Mbp1-dependent genes on. MBF is largely redundant with SBF, so mbp1 null cells are viable
    but mbp1 swi4 double mutants cannot pass Start.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
