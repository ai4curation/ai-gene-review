gene_symbol: MBP1
organism: yeast
uniprot_id: P39678
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Binds to MCB elements (Mlu I cell cycle box) found in the promoter of most
    DNA synthesis genes. Transcriptional activation by MBF has an important role in
    the transition from G1 to S phase. It may have a dual role in that it behaves
    as an activator of transcription at the G1-S boundary and as a repressor during
    other stages of the cell cycle.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39678
  source_id: P39678
- source: Alliance_Imported
  text: Transcription factor; involved in regulation of cell cycle progression from
    G1 to S phase, forms a complex with Swi6p that binds to MluI cell cycle box regulatory
    element in promoters of DNA synthesis genes
  source_type: curated
  url: https://www.yeastgenome.org/locus/MBP1
  source_id: SGD:S000002214
- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific.
    Involved in G1/S transition of mitotic cell cycle and positive regulation of transcription
    by RNA polymerase II. Acts upstream of or within maintenance of translational
    fidelity. Located in nucleus. Part of MBF transcription complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MBP1
  source_id: SGD:S000002214
fetch_date: '2026-11-01'
