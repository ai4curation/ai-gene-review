descriptions:
- source: UniProt
  text: Binds to MCB elements (Mlu I cell cycle box) found in the promoter of most
    DNA synthesis genes. Transcriptional activation by MBF has an important role in
    the transition from G1 to S phase. It may have a dual role in that it behaves
    as an activator of transcription at the G1-S boundary and as a repressor during
    other stages of the cell cycle.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39678
  source_id: P39678
