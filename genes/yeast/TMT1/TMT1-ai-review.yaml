id: P32643
gene_symbol: TMT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  TMT1 (YER175C) encodes trans-aconitate methyltransferase, a 299-residue cytosolic
  S-adenosyl-L-methionine (SAM)-dependent small-molecule carboxyl methyltransferase of the
  class I Rossmann-fold methyltransferase superfamily (Tam family; PANTHER PTHR44942:SF4).
  Deletion of the gene abolishes extract activity toward trans-aconitate and weaker
  tricarboxylate acceptors (cis-aconitate, isocitrate, citrate). Tmt1 forms monomethyl
  esters of trans-aconitate, a spontaneous isomerisation product of cis-aconitate that
  inhibits aconitase, and of (2R,3S)-3-isopropylmalate, a leucine-biosynthesis intermediate
  and the enzyme's major endogenous substrate. Its activity rises at the diauxic shift and
  its expression is induced by amino-acid starvation through Gcn4. The resulting
  3-isopropylmalate methyl ester is secreted and promotes invasive growth of haploid cells.
  Methylation of trans-aconitate has been proposed to limit its toxicity, but this has not
  been tested in vivo. A high-resolution crystal structure (PDB 3G5T) shows the enzyme with
  S-adenosyl-L-homocysteine and the methylated trans-aconitate product bound.
