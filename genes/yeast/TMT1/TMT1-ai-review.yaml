- term:
    id: GO:0034198
    label: cellular response to amino acid starvation
  evidence_type: IDA
  original_reference_id: PMID:18092814
  qualifier: involved_in
  review:
    summary: >-
      Dumlao et al. (2008) found that TMT1 is induced by amino-acid starvation (most strongly by
      leucine withdrawal) through Gcn4, and that the product it makes, 3-isopropylmalate methyl
      ester, is secreted and promotes invasive growth.
    action: KEEP_AS_NON_CORE
    reason: >-
      The abstract supports two things: Gcn4-dependent induction under starvation, and Tmt1
      making a secreted signal that promotes invasive growth. Induction alone would be weak
      evidence for taking part in the response. Here, though, the enzyme produces a signalling
      molecule that the authors place in the starvation response, so the annotation is
      defensible. The curator read the full text, which we have not, so we keep the annotation.
      It is non-core because the role is a downstream physiological use of the enzyme's
      activity: the in vivo requirement of Tmt1 for invasive growth is not shown in the
      abstract, and the authors present the signalling role as a model.
    supported_by:
    - reference_id: PMID:18092814
      supporting_text: We find that the Tmt1 methyltransferase functions independently of
        the biosynthetic pathway but is induced when cells are starved for amino acids; the
        largest induction is observed with the removal of leucine from the media. This amino
        acid starvation stress response is controlled by the transcriptional activator Gcn4.
    - reference_id: PMID:18092814
      supporting_text: Our data identifies 3-isopropylmalate methyl ester as an autoinductive
        molecule that provides a signal to yeast to switch from vegetative to invasive growth
        in response to amino acid starvation.
- term:
    id: GO:0046547
    label: trans-aconitate 3-methyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:11695919
  qualifier: enables
  review:
    summary: >-
      Cai et al. (2001) identified YER175c as the trans-aconitate methyltransferase gene.
      Deletion abolished the activity in extracts, plasmid reintroduction overexpressed it,
      and trans-aconitate was the preferred tricarboxylate acceptor (Km 0.66 mM).
    action: ACCEPT
    reason: >-
      This is the defining, experimentally established activity of Tmt1, backed by genetic
      loss and gain of activity with kinetic characterisation. A later study confirms
      comparable kinetics (Km 53 uM, Vmax 70 nmol/min/mg in overexpressing extracts;
      PMID:15147181). The 3G5T crystal structure with the methyl-ester product bound is
      consistent with this activity. One caveat: the kinetics come from extracts of
      overexpressing cells, not purified protein. The genetic evidence still ties the
      activity firmly to this gene product.
    supported_by:
    - reference_id: PMID:11695919
      supporting_text: Extracts of a yeast strain with a disrupted YER175c gene demonstrate
        a complete loss of activity toward the methyl-accepting substrates trans-aconitate,
        cis-aconitate, DL-isocitrate, and citrate.
    - reference_id: PMID:11695919
      supporting_text: We found that trans-aconitate was the best substrate with a Km of 0.66
        mM.
    - reference_id: PMID:15147181
      supporting_text: The Tmt1 methyltransferase recognizes (2R,3S)-3-isopropylmalate with
        similar kinetics as it does trans-aconitate
