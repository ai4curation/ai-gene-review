core_functions:
- description: >-
    Cytosolic SAM-dependent carboxyl methyltransferase that monomethyl-esterifies
    trans-aconitate, the best tricarboxylate acceptor tested. Genetic loss and gain of
    activity, together with kinetics, establish this activity for S. cerevisiae Tmt1.
  molecular_function:
    id: GO:0046547
    label: trans-aconitate 3-methyltransferase activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11695919
    supporting_text: Extracts of a yeast strain with a disrupted YER175c gene demonstrate
      a complete loss of activity toward the methyl-accepting substrates trans-aconitate,
      cis-aconitate, DL-isocitrate, and citrate.
  - reference_id: PMID:11695919
    supporting_text: the activity of the yeast trans-aconitate methyltransferase is localized
      in the cytosol
- description: >-
    Methyl esterification of (2R,3S)-3-isopropylmalate, the major endogenous substrate in
    yeast extracts, giving 3-isopropylmalate-1-methyl ester. This ester is secreted and acts
    as a signal for invasive growth when amino acids are scarce. No GO term exists for this
    activity, so a new term is proposed.
  proposed_molecular_function: 3-isopropylmalate O-methyltransferase activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15147181
    supporting_text: The Tmt1 methyltransferase recognizes (2R,3S)-3-isopropylmalate with
      similar kinetics as it does trans-aconitate
  - reference_id: PMID:18092814
    supporting_text: We show that methyl esterification generates
      3-isopropylmalate-1-methyl ester.
proposed_new_terms:
- proposed_name: 3-isopropylmalate O-methyltransferase activity
  proposed_definition: >-
    Catalysis of the reaction: S-adenosyl-L-methionine + (2R,3S)-3-isopropylmalate =
    S-adenosyl-L-homocysteine + 3-isopropylmalate 1-methyl ester.
  justification: >-
    S. cerevisiae Tmt1 methylates (2R,3S)-3-isopropylmalate with kinetics comparable to
    trans-aconitate, and this is its major endogenous substrate. The product is a secreted
    signalling molecule. GO:0046547 is defined only by the trans-aconitate reaction, and no GO
    term describes 3-isopropylmalate methylation.
  proposed_parent:
    id: GO:0010340
    label: carboxyl-O-methyltransferase activity
  supported_by:
  - reference_id: PMID:15147181
    supporting_text: The Tmt1 methyltransferase recognizes (2R,3S)-3-isopropylmalate with
      similar kinetics as it does trans-aconitate
  - reference_id: PMID:18092814
    supporting_text: We show that methyl esterification generates
      3-isopropylmalate-1-methyl ester.
suggested_questions:
- question: >-
    Does trans-aconitate methylation by Tmt1 protect aconitase or other citric-acid-cycle
    enzymes in vivo? For example, are tmt1 deletion cells sensitive to exogenous
    trans-aconitate, or do they accumulate it at the diauxic shift?
- question: >-
    Is Tmt1 required in vivo for 3-isopropylmalate methyl ester secretion and for invasive
    growth during leucine starvation? Would it be appropriate to annotate it to a
    signal-production or invasive-growth process term?
- question: >-
    Did the substrate specificity of PTHR44942:SF4 (trans-aconitate/3-isopropylmalate in Tmt1,
    cantharidin in the paralog Crg1, natural-product O-methylation in other fungal members)
    diverge before or after the split of the budding- and fission-yeast lineages? This
    determines which, if any, Tmt1 acceptor specificity can be transferred to the
    Schizosaccharomyces SF4 members.
suggested_experiments:
- description: >-
    Purify recombinant Tmt1 and measure steady-state kinetics with trans-aconitate and
    (2R,3S)-3-isopropylmalate. Test tmt1 deletion strains for trans-aconitate sensitivity and
    for loss of secreted 3-isopropylmalate methyl ester and invasive growth under leucine
    starvation.
  experiment_type: biochemistry and yeast genetics
  hypothesis: >-
    Tmt1 is the only enzyme producing 3-isopropylmalate methyl ester in vivo, and its
    trans-aconitate activity protects cells from trans-aconitate toxicity.
- description: >-
    Build a maximum-likelihood phylogeny of fungal PTHR44942:SF4 sequences, including TMT1,
    CRG1 and the S. pombe tandem pair SPAC25B8.09/SPAC25B8.10, rooted with other PTHR44942
    subfamilies. Use it to place the TMT1/CRG1 duplication relative to the
    Saccharomycotina/Taphrinomycotina split.
  experiment_type: phylogenetic analysis
  hypothesis: >-
    The TMT1/CRG1 duplication is specific to the Saccharomycotina, so the fission-yeast genes
    are co-orthologs of both and inherit only the shared SAM-dependent methyltransferase
    activity.
