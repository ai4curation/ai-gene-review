descriptions:
- source: UniProt
  text: Catalyzes the S-adenosylmethionine monomethyl esterification of trans-aconitate
    and 3-isopropylmalate at high affinity and of other molecules like cis-aconitate,
    isocitrate, and citrate at lower velocities and affinities. The function of trans-aconitate
    methylation appears to be in reducing the toxicity of this spontaneous breakdown
    product of cis-aconitate. The role of 3-isopropylmalate methylation is unclear
    but may represent a metabolic branch at 3-isopropylmalate, where some of the material
    is taken in the pathway leading to leucine and some is taken in a pathway to the
    3-isopropylmalate methyl ester, a molecule that provides a signal to switch from
    vegetative to invasive growth in response to amino acid starvation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32643
  source_id: P32643
