descriptions:
- source: UniProt
  text: Dihydroxyacid dehydratase that catalyzes the third step in the common pathway
    leading to biosynthesis of branched-chain amino acids (PubMed:20008079, PubMed:21798060,
    PubMed:21987576, PubMed:22954227, PubMed:25280745, PubMed:26543501, PubMed:27532773,
    PubMed:28505306, PubMed:30850698, PubMed:31303893, PubMed:33620449, PubMed:8299945).
    Catalyzes the dehydration of (2R,3R)-2,3-dihydroxy-3- methylpentanoate (2,3-dihydroxy-3-methylvalerate)
    into 2-oxo-3- methylpentanoate (2-oxo-3-methylvalerate) and of (2R)-2,3-dihydroxy-3-
    methylbutanoate (2,3-dihydroxyisovalerate) into 2-oxo-3-methylbutanoate (2-oxoisovalerate),
    the penultimate precursor to L-isoleucine and L- valine, respectively (PubMed:20008079,
    PubMed:27532773). Required for the synthesis of alpha-isopropylmalate which modulates
    the activity of LEU3 and subsequently regulates the expression of LEU1 (PubMed:20008079).
  source_type: curated
