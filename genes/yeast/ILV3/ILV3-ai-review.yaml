  label: Saccharomyces cerevisiae S288C
description: ILV3 encodes mitochondrial dihydroxy-acid dehydratase (DHAD, EC 4.2.1.9) of Saccharomyces
  cerevisiae, an IlvD/EDD-family enzyme carrying one [2Fe-2S] cluster per subunit and Mg2+. In the mitochondrial
  matrix it dehydrates 2,3-dihydroxyisovalerate to 2-oxoisovalerate and 2,3-dihydroxy-3-methylvalerate
  to (S)-3-methyl-2-oxopentanoate, the third step shared by valine and isoleucine biosynthesis and the
  source of the 2-oxoisovalerate used for leucine synthesis. Because it depends on mitochondrial Fe/S
  cluster assembly, Ilv3 activity collapses under iron limitation, lowering alpha-isopropylmalate and
  thereby Leu3-dependent transcription (e.g. of LEU1); Ilv3 activity is widely used as a reporter of mitochondrial
  [2Fe-2S] biogenesis. ilv3 mutants require isoleucine and valine.
