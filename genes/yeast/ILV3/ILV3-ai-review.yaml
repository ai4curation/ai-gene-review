core_functions:
- description: 'Mitochondrial [2Fe-2S] dihydroxy-acid dehydratase (EC 4.2.1.9) catalysing the third shared
    step of branched-chain amino acid synthesis: dehydration of (R)-2,3-dihydroxyisovalerate to 2-oxoisovalerate
    (valine and leucine precursor) and of (2R,3R)-2,3-dihydroxy-3-methylpentanoate to (S)-3-methyl-2-oxopentanoate
    (isoleucine precursor). Its Fe/S dependence makes it the iron-sensitive node of the pathway.'
