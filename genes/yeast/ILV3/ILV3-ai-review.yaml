suggested_experiments:
- hypothesis: Ilv3 [2Fe-2S] cluster insertion requires a specific late-acting ISC targeting factor distinct
    from Nfu1/Bol3.
  description: Measure Ilv3 activity and 55Fe incorporation in isolated mitochondria from strains lacking
    individual late ISC factors (Isa1/Isa2, Iba57, Bol1, Grx5).
