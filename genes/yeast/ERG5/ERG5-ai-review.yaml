id: P54781
gene_symbol: ERG5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG5 (CYP61, YMR015C) encodes the sterol C-22 desaturase of Saccharomyces cerevisiae, a microsomal
  cytochrome P450 that introduces the C22=C23 double bond into the ergosterol side chain, converting ergosta-5,7,24(28)-trienol
  (5-dehydroepisterol) to ergosta-5,7,22,24(28)-tetraenol (EC 1.14.19.41) using O2 and electrons from
  NADPH-cytochrome P450 reductase. Purified Erg5 reconstituted with P450 reductase converts ergosta-5,7-dienol
  to ergosterol, defining the CYP61 family as sterol Delta22-desaturases. Erg5 is a heme-thiolate P450
  anchored in the ER membrane by a single transmembrane segment and interacts with the ergosome scaffold
  Erg28. ERG5 is not essential; erg5 mutants lack the 22-double bond and are nystatin resistant.
