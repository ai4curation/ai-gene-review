suggested_questions:
- question: Is Erg5 obligately dependent on the NADPH-cytochrome P450 reductase Ncp1, or can cytochrome
    b5 (Cyb5) supply electrons in vivo as reported for other yeast sterol P450s/desaturases?
suggested_experiments:
- description: Measure C-22 desaturation in microsomes from ncp1 and cyb5 single and double mutants to
    define the physiological electron donor(s) for Erg5.
