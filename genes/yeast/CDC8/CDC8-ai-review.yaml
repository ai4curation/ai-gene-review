id: P00572
gene_symbol: CDC8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CDC8 (YJR057W) encodes thymidylate kinase (dTMP kinase, EC 2.7.4.9), the essential enzyme that phosphorylates
  dTMP to dTDP using ATP (or dATP), the step shared by de novo dTTP synthesis and any thymidine salvage. Temperature-sensitive
  cdc8 mutants were isolated as cell-division-cycle mutants that arrest in S phase; their extracts lack dTMP kinase
  activity, and the herpes simplex virus thymidine/thymidylate kinase complements them. Cdc8 is required for both
  nuclear and mitochondrial DNA replication. The purified enzyme also phosphorylates dUMP more weakly (Km 2 mM versus
  0.5 mM for dTMP) and, in vitro, shows a thymidylate-specific nucleoside-diphosphate kinase activity that converts
  dTDP to dTTP, which may partly overlap with the non-essential nucleoside-diphosphate kinase Ynk1. CDC8 transcription
  is cell-cycle regulated, and the enzyme fractionates with the nuclear and cytoplasmic fraction but not mitochondria.
