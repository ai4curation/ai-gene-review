taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the conversion of dTMP to dTDP.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00572
  source_id: P00572
- source: Alliance_Imported
  text: Nucleoside monophosphate and nucleoside diphosphate kinase; functions in the
    de novo biosynthesis of pyrimidine deoxyribonucleotides; thymidylate/uridylate
    kinase that converts nucleoside monophosphates, dTMP and dUMP to nucleoside diphosphates,
    dTDP and dUDP; nucleoside diphosphate kinase that converts nucleoside diphosphates,
    dTDP and dUDP to dTTP and dUTP; essential for mitotic and meiotic DNA replication;
    homologous to S. pombe tmp1; human homolog DTYMK can complement the cdc8 null
    mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDC8
  source_id: SGD:S000003818
- source: Alliance_Automated
  text: Enables dTMP kinase activity; dUMP kinase activity; and nucleoside diphosphate
    kinase activity. Involved in dTDP biosynthetic process; dTTP biosynthetic process;
    and dUDP biosynthetic process. Located in cytoplasm and nucleus. Human ortholog(s)
    of this gene implicated in microcephaly. Orthologous to human DTYMK (deoxythymidylate
    kinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDC8
  source_id: SGD:S000003818
