core_functions:
- description: 'Cystathionine gamma-synthase step of forward trans-sulfuration: L-cysteine + O-acetyl-L-homoserine
    -> L-cystathionine, the first step of homocysteine synthesis from cysteine, in the cytosol.'
  molecular_function:
    id: GO:0003962
