suggested_questions:
- question: Should GO add (or broaden GO:0003962 to cover) an O-acetyl-L-homoserine-utilising cystathionine
    gamma-synthase activity, since fungal CGS enzymes such as Str2p use O-acetylhomoserine rather than
    O-succinylhomoserine?
suggested_experiments:
- description: Purify recombinant Str2p and measure kinetics with O-acetyl-L-homoserine versus O-succinyl-L-homoserine
    and L-cysteine to establish its physiological substrate and confirm CGS activity directly.
