  label: Saccharomyces cerevisiae S288C
description: 'Cystathionine gamma-synthase (Str2p), a PLP-dependent enzyme of the trans-sulfuration family
  that condenses L-cysteine with an O-acylated homoserine (in S. cerevisiae O-acetyl-L-homoserine, made
  by Met2p) to form L-cystathionine. Together with the cystathionine beta-lyase Str3p it forms the forward
  trans-sulfuration route that converts cysteine into homocysteine and thus methionine; the reverse route
  uses Cys4p and Cys3p. Because yeast normally makes homocysteine by direct sulfhydrylation (Met17p),
  Str2p is needed mainly when cysteine or glutathione is the sulfur source: str2 disruptants cannot convert
  cysteine into homocysteine and grow poorly on these sulfur sources. Str2p is a soluble cytoplasmic protein.'
