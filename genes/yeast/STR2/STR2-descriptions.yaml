descriptions:
- source: UniProt
  text: Catalyzes the formation of L-cystathionine from O-succinyl-L- homoserine (OSHS)
    and L-cysteine, via a gamma-replacement reaction. In the absence of thiol, catalyzes
    gamma-elimination to form 2- oxobutanoate, succinate and ammonia.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47164
  source_id: P47164
- source: Alliance_Imported
  text: Cystathionine gamma-synthase, converts cysteine into cystathionine; STR2 has
    a paralog, YML082W, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/STR2
  source_id: SGD:S000003891
- source: Alliance_Automated
  text: Enables cystathionine gamma-synthase activity. Involved in transsulfuration.
    Located in cytoplasm and nucleus.
  source_type: automated
