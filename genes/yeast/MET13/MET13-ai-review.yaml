taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Methylenetetrahydrofolate reductase 2 (MTHFR, EC 1.5.1.53) of Saccharomyces cerevisiae, the main MTHFR
  isozyme. This FAD-containing enzyme reduces 5,10-methylenetetrahydrofolate to 5-methyltetrahydrofolate with NADPH.
  5-methyl-THF is the methyl donor used by methionine synthase to convert homocysteine to methionine, so this step
  commits one-carbon units to the methyl cycle. met13 mutants are methionine auxotrophs (rescued by methionine or
  AdoMet), whereas loss of the paralog MET12 has no phenotype. Like mammalian MTHFR, Met13 is NADPH-dependent and
  inhibited by S-adenosylmethionine. It was once misidentified as a mitochondrial ribosomal protein (MRPL45).
