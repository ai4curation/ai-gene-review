- source: Alliance_Automated
  text: Enables methylenetetrahydrofolate reductase [NAD(P)H] activity. Involved in
    L-methionine biosynthetic process. Located in mitochondrion. Human ortholog(s)
    of this gene implicated in several diseases, including carcinoma (multiple); cardiovascular
    system disease (multiple); hematopoietic system disease (multiple); kidney disease
    (multiple); and liver disease (multiple). Orthologous to human MTHFR (methylenetetrahydrofolate
    reductase).
