  review:
    summary: 'IBA is_active_in microtubule organizing center from sub-node PTN007424001, which is seeded by mitotic
      B-type cyclins and cyclin B orthologs that decorate the centrosome/SPB (S. pombe cdc13 and crs1, human cyclin
      B1/B2, rat cyclin B, S. cerevisiae Clb2). Nothing places Clb6 at the spindle pole body: the only report linking
      clb6 to SPB biology is a phenotypic difference in SPB duplication, with no localization data, and the protein
      is gone by the time the mitotic spindle forms.'
    action: MARK_AS_OVER_ANNOTATED
    reason: SPB/centrosome localization is a property of the mitotic cyclins in this clade. Clb6 is a G1/S cyclin
      that is degraded at the G1/S border by SCF(Cdc4), so it is not present when the MTOC functions the node describes
      occur, and its demonstrated substrates are nucleoplasmic. The propagated term overstates where this member
      is active; flagged rather than removed, since absence of localization evidence is not evidence of absence.
      The CLB5 review makes the same call on the sister propagation, and the case is stronger here because Clb5,
      unlike Clb6, at least contributes genetically to SPB separation.
    supported_by:
    - reference_id: PMID:16508019
      supporting_text: unlike Clb5, which is stable until mitosis, Clb6 is degraded rapidly at the G 1 /S border
      reference_section_type: ABSTRACT
