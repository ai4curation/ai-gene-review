  review:
    summary: PAINT inference of activity at the microtubule organizing center, from a node (PTN007424001)
      whose descendant evidences are mitotic and meiotic cyclins - SGD:S000006323 is CLB2, PomBase:SPBC582.03
      is the fission-yeast mitotic cyclin cdc13 and PomBase:SPBC2G2.09c the meiosis-specific cyclin crs1,
      and the vertebrate donors are cyclin B family members. No S-phase cyclin is among the seeds, and
      nothing places Clb6 at the spindle pole body.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is the scope red flag the IBA guidance describes - the node sits over a mitotic/meiotic-cyclin
      clade, and the spindle role within the budding-yeast B-cyclin family is documented for Clb3, Clb4
      and Clb5, not for Clb6. Clb6 is also destroyed by SCF(Cdc4) at the G1/S border, so it is largely
      gone by the time mitotic spindles are built. The node placement is defensible for the cyclins that
      seeded it but over-reaches when propagated to an S-phase cyclin. Same call as the CLB5 review.
    propagation_review:
      root_cause: PROPAGATION_BAD
