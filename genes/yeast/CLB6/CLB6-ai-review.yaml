gene_symbol: CLB6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Clb6 is one of the two S-phase (B-type) cyclins of the budding yeast Saccharomyces cerevisiae and,
  with its paralog Clb5, the regulatory subunit of the S-phase form of the cyclin-dependent kinase Cdc28 (Cdk1).
  Clb6 has no catalytic activity of its own: it binds Cdc28 to form the Clb6-Cdc28 holoenzyme (ComplexPortal CPX-339)
  and determines when, where and toward which substrates that kinase acts. CLB6 is transcribed in late G1 as part
  of the Cln-dependent Start program, together with CLN1, CLN2 and the DNA-replication genes, and Clb5/Clb6-associated
  kinase activity peaks at the G1-to-S transition, where it cooperates with Dbf4-dependent kinase to fire replication
  origins. Clb6 fires only early origins, whereas Clb5 is additionally required for late ones; accordingly, deleting
  CLB6 alone barely perturbs S phase while deleting CLB5 greatly extends it, and only the double mutant fails to
  initiate replication on time, after which the mitotic cyclins Clb1-Clb4 drive a delayed S phase. The asymmetry
  between the paralogs is largely one of protein lifetime rather than of intrinsic activity: Clb6 lacks the destruction
  box through which the anaphase-promoting complex destroys Clb5, carries Cdc4 degrons in its N terminus, and is
  destroyed at the G1/S border by SCF-Cdc4 (with an APC/C-Cdh1 contribution in G1), so that hyperstabilized Clb6
  expressed from its own promoter restores normal replication kinetics to clb5 cells. Clb6 also confers a substrate
  specificity that Clb5 does not: among all nine Cdc28 cyclins, only Clb6-Cdc28 phosphorylates Swi6 at Ser160, driving
  export of this shared SBF/MBF subunit from the nucleus and thereby altering G1/S transcription, and only Clb6-Cdc28
  phosphorylates the ribonucleotide reductase subunit Rnr2 at its TPSK motif, weakening the Rnr2-Wtm1 interaction
  so that Rnr2-Rnr4 leaves the nucleus and the active reductase can assemble for S phase; clb6 cells retain Rnr2-Rnr4
  in the nucleus and are hypersensitive to hydroxyurea. In meiosis Clb5 and Clb6 are the only B-type cyclins able
  to drive premeiotic DNA replication, and clb5 clb6 diploids neither replicate nor activate the meiotic replication
  checkpoint, segregating unreplicated chromosomes. Clb6 is not essential for vegetative growth, and no direct localization
  of the protein has been reported, although its demonstrated substrates are nuclear.'
