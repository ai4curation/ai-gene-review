  review:
    summary: IBA is_active_in microtubule organizing center from sub-node PTN007424001, which is seeded by mitotic
      B-type cyclins and their partners (S. pombe cdc13, human cyclin B1/B2, rat cyclin B, S. cerevisiae Clb3) that
      decorate the centrosome/SPB. CLB6 is not among the donors, and no spindle, SPB or microtubule phenotype has
      been reported for clb6 cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'SPB/centrosome localization is a property of the mitotic cyclins in this clade. Clb6 is the shortest-lived
      member of the family: it is destroyed at the G1/S border, before spindle assembly, and its documented outputs
      are early-origin firing and the nuclear export of Swi6 and Rnr2 - none of which requires Clb6 at a microtubule
      organizing center. The propagated term therefore overstates where Clb6 is active. Flagged rather than removed,
      because absence of localization evidence is not evidence of loss and the sibling CLB5 review makes the same
      call on this propagation.'
    supported_by:
    - reference_id: PMID:16508019
      supporting_text: We have examined the basis for the differential functions of Clb5 and Clb6 and determined
        that unlike Clb5, which is stable until mitosis, Clb6 is degraded rapidly at the G1/S border.
      reference_section_type: ABSTRACT
