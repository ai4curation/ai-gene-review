core_functions:
- description: Binds and activates the Cdc28 (Cdk1) serine/threonine protein kinase, forming the Clb6-Cdc28 S-phase CDK
    holoenzyme that, together with Clb5-Cdc28 and the Dbf4-dependent kinase, phosphorylates replication-initiation factors
    to fire replication origins at the G1/S transition. Because Clb6 is destroyed by SCF-Cdc4 and the APC in early S phase,
    this activity reaches only the early origins, which is why its loss is masked by the longer-lived Clb5; in meiosis,
    where Clb1-4 cannot substitute, the same activity is required for premeiotic DNA replication and hence for the Mec1-dependent
    replication checkpoint.
  supported_by:
  - reference_id: PMID:8319908
    supporting_text: Thus, the kinase activity associated with Clb5/6 and not with Cln cyclins may be responsible for S-phase
      entry.
    reference_section_type: ABSTRACT
  - reference_id: PMID:8319908
    supporting_text: Deletion of CLB6 has little or no effect, but deletion of CLB5 greatly extends S phase, and deleting
      both genes prevents the timely initiation of DNA replication.
    reference_section_type: ABSTRACT
  - reference_id: PMID:9734354
    supporting_text: Therefore, Clb5p promotes the timely activation of early and late origins, but Clb6p can activate only
      early origins.
    reference_section_type: ABSTRACT
  - reference_id: PMID:29263158
    supporting_text: The Clb5/Clb6-dependent CDK activity peaks at the G 1 -to-S transition and is primarily responsible
      for cooperation with DDK to activate the firing of replication origins.
    reference_section_type: INTRODUCTION
  - reference_id: PMID:9732268
    supporting_text: Diploid clb5/clb5 clb6/clb6 mutants are unable to perform premeiotic DNA replication.
    reference_section_type: ABSTRACT
  - reference_id: PMID:9732268
    supporting_text: We show that premeiotic S phase is inhibited by the Clb/Cdc28-specific CDK inhibitor, Sic1, suggesting
      that the essential role of Clb5 and Clb6 is executed in conjunction with Cdc28.
    reference_section_type: ABSTRACT
