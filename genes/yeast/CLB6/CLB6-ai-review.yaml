  review:
    summary: PAINT inference at the cyclin node PTN000019791 that this cyclin acts at the G1/S transition.
      The node placement is sound for Clb6 and the claim is independently established in this species
      by the two 1993 CLB5/CLB6 papers, which is also why CLB6 itself (SGD:S000003341) appears among the
      descendant evidences.
    action: ACCEPT
    reason: The IBA agrees with direct S. cerevisiae evidence - clb6 deletion delays late G1/S, and clb5
      clb6 double deletion prevents timely initiation of replication. CLB6's own presence in the WITH/FROM
      list is the expected marker that experimental grounding exists on the target itself (CLAUDE.md,
      "What an IBA asserts"), not circularity, and the IBA adds the further claim that the function is
      inherited at the cyclin node rather than lineage-specific.
    supported_by:
    - reference_id: PMID:8253070
