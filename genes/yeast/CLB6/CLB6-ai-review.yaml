suggested_questions:
- question: Does Ser160 phosphorylation by Clb6-Cdc28 stimulate Swi6 nuclear export or block its re-import? Geymonat
    et al. leave both open, and the answer decides whether GO:0046827 (positive regulation of protein export from
    nucleus) or a negative regulation of protein import from nucleus term is the right description of the Swi6 arm;
    the Rnr2 arm is unambiguous about release from the nucleus.
- question: Is the negative effect of Clb6 on SBF/MBF-dependent transcription exerted solely through Swi6 localization?
    The swi6-S160A allele keeps Swi6 nuclear without grossly changing SBF/MBF-driven transcription, while clb6 mutants
    show increased G1-specific transcription, which the authors read as evidence for additional Clb6 routes.
- question: Is the Clb5/Clb6 division of labour entirely a consequence of their different degradation pathways,
    as the stabilized-Clb6 rescue of clb5 implies, or do Swi6 and Rnr2 require a docking surface specific to Clb6?
- question: Is any pool of Clb6 at the spindle pole body, as the propagated microtubule organizing center annotation
    implies, or is the reported clb6 effect on SPB duplication entirely a consequence of altered S-phase or G1 timing?
    No localization data for Clb6 exist either way.
suggested_experiments:
- description: Image endogenously tagged Clb6 in a cdc4 or cdc34 background (or using the hyperstabilized N-terminal
    degron mutants, which are expressed from the CLB6 promoter and remain functional) together with origin (ORC/Mcm),
    SBF/MBF promoter and SPB (Spc42) markers through a synchronous cycle. Stabilization sidesteps the sub-five-minute
    half-life that is the likely reason no Clb6 localization has been reported, and the same strains test the propagated
    nucleus, cytoplasm and microtubule organizing center annotations directly.
  hypothesis: Clb6 protein is present in the nucleus during late G1 and early S phase and is not enriched at the
    spindle pole body; its absence from published localization data reflects its sub-five-minute half-life rather
    than low nuclear abundance.
- description: 'Swap the Clb5 and Clb6 N-terminal degron regions and ask which phenotypes follow the degron and
    which follow the cyclin fold: measure early- and late-origin firing (BrdU-IP or Okazaki-fragment sequencing),
    Swi6 Ser160 phosphorylation and localization, and Rnr2-Rnr4 nuclear retention in each chimera. This separates
    the stability model of Clb5/Clb6 specificity from an intrinsic substrate-docking model.'
  hypothesis: 'The Clb5/Clb6 division of labour is imposed by their degradation pathways rather than by the cyclin
    fold: swapping the N-terminal degron regions swaps the origin-firing and substrate phenotypes.'
- description: Combine an analogue-sensitive cdc28-as1 allele with CLB6 or CLB5 as the only cyclin present and perform
    synchronized quantitative phosphoproteomics to define the Clb6-specific Cdc28 substrate set beyond Swi6 and
    Rnr2, then test whether the Cln2- and Clb2-kinase down-regulation reported by Basco et al. is accompanied by
    direct phosphorylation of those complexes or their regulators, or requires Cdc6.
  hypothesis: Beyond Swi6 and Rnr2, Clb6-Cdc28 has a distinct substrate set from Clb5-Cdc28, and the reported down-regulation
    of Cln2- and Clb2-associated kinase activity is not among its direct targets.
