  review:
    summary: 'Stuart & Wittenberg: diploid clb5 clb6 mutants cannot perform premeiotic DNA replication, yet progress into
      the meiotic program and segregate unreplicated DNA because they fail to activate the Mec1-dependent replication checkpoint.
      clb6 alone has no detectable replication defect, so Clb6''s contribution is defined by the double mutant; the recorded
      WITH entity SGD:S000006324 is CLB5, that partner.'
    action: ACCEPT
    reason: 'Unlike the mitotic cycle, where Clb1-4 can substitute, meiosis has no backup: CLB5 and CLB6 are essential for
      premeiotic S phase, and the Clb/Cdc28-specific inhibitor Sic1 blocks it, placing the requirement on the Clb-Cdc28
      kinase. This is the one process in which the pair is non-redundantly required, so the row is graded core even though
      Clb6''s share of it is redundant with Clb5''s.'
    supported_by:
