gene_symbol: CLB6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Clb6 is one of the two S-phase B-type cyclins (cyclin A/B subfamily) of the budding yeast Saccharomyces cerevisiae
  and, with its paralog Clb5, the regulatory subunit of the S-phase form of the cyclin-dependent kinase Cdc28 (Cdk1). Clb6
  has no catalytic activity of its own: it binds Cdc28, induces the active kinase conformation, and determines which substrates
  that kinase phosphorylates. CLB5 and CLB6 lie in a tail-to-tail arrangement beside the mitotic cyclin genes CLB2 and CLB1
  and arose by gene duplication; both transcripts appear in late G1 as part of the SBF/MBF-dependent Start program alongside
  CLN1, CLN2 and the DNA-replication genes, and the resulting Clb5/Clb6-Cdc28 kinase, rather than Cln-Cdc28, is what commits
  the cell to S phase, cooperating with the Dbf4-dependent kinase to fire replication origins. The two cyclins are partially
  redundant and unequally weighted: Clb6 protein is destroyed by SCF-Cdc4 and the APC in early, unperturbed S phase, whereas
  Clb5 persists, so Clb6 activates only early origins while Clb5 activates early and late ones. Consequently clb6 cells
  show at most a mild late-G1/S delay and no late-origin defect, while clb5 cells have a greatly extended S phase and clb5
  clb6 cells cannot initiate replication on time and depend on the mitotic cyclins Clb1-4 for an inefficient S phase. In
  meiosis there is no such backup: Clb5 and Clb6 are the only B-type cyclins that can drive premeiotic DNA replication,
  and clb5 clb6 diploids fail to replicate, fail to activate the Mec1-dependent replication checkpoint, and segregate unreplicated
  chromosomes. Beyond this shared origin-firing role, Clb6 has substrate preferences that Clb5 does not. Of the nine Cdc28
  cyclins, only Clb6-Cdc28 phosphorylates Ser160 of Swi6, the shared subunit of the SBF and MBF transcription factors, which
  drives Swi6 out of the nucleus and so feeds back negatively on the G1/S transcriptional program that induced CLB6 in the
  first place; the Clb6-Swi6 interaction does not require the RXL/Cy motif through which Clb5 docks its replication substrates.
  Clb6-Cdc28, again not Clb5-Cdc28, also phosphorylates the ribonucleotide reductase small subunit Rnr2 at an N-terminal
  CDK site, weakening its interaction with the nuclear anchor Wtm1 and releasing Rnr2-Rnr4 to the cytoplasm where it forms
  the active RNR holoenzyme with Rnr1; clb6 cells retain Rnr2-Rnr4 in the nucleus and are hypersensitive to hydroxyurea.
  Clb6 therefore acts through nuclear substrates and is not essential for vegetative growth.'
