- id: PMID:29263158
  title: Clb6-Cdc28 Promotes Ribonucleotide Reductase Subcellular Redistribution during S Phase.
  findings:
  - statement: Clb6-Cdc28 phosphorylates Rnr2 on an N-terminal TPSK CDK site, weakening the Rnr2-Wtm1 interaction
      and releasing Rnr2-Rnr4 from the nucleus so that active RNR can assemble in S phase.
    supporting_text: Our results support a model in which the S-phase cyclin-CDK complex Clb6-Cdc28 phosphorylates
      Rnr2 at its N-terminal TPSK motif, which weakens the Rnr2-Wtm1 interaction and facilitates the release of
      preexisting Rnr2-Rnr4 from the nucleus ( Fig. 7 ).
    reference_section_type: DISCUSSION
  - statement: 'Deleting CLB6 or the Rnr2 CDK site increases Rnr2-Wtm1 association, retains Rnr2-Rnr4 in the nucleus
      and sensitizes cells to hydroxyurea: the loss-of-function evidence for the GO:0032880 IMP row.'
    supporting_text: Deletion of CLB6 or removal of the CDK site results in an increased association of Rnr2 with
      its nuclear anchor Wtm1, nuclear retention of Rnr2-Rnr4, and an enhanced sensitivity to the RNR inhibitor
      hydroxyurea.
    reference_section_type: ABSTRACT
  - statement: 'Restates the paralog asymmetry independently: Clb6-Cdc28, but not Clb5-Cdc28, triggers nuclear export
      of Swi6 via Ser160, altering SBF- and MBF-mediated transcription at G1/S.'
    supporting_text: A previous study has shown that Clb6-Cdc28 but not Clb5-Cdc28 triggers nuclear export of transcription
      factor Swi6 in early S phase by specifically phosphorylating Swi6 at serine-160, thus altering Swi4/Swi6 (SBF)
      and Mbp1/Swi6 (MBF)-mediated transcription at the G 1 /S transition ( 41 ).
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Second Clb6-specific substrate (Rnr2 TPSK site, Wtm1 anchor), and the basis of the GO:0032880
      IMP row that this review refines to GO:0046827. Also restates the Clb6-not-Clb5 asymmetry for Swi6.
- id: PMID:8253070
  title: A new pair of B-type cyclins from Saccharomyces cerevisiae that function early in the cell cycle.
  findings:
  - statement: 'The clb6 null mutant is viable but delayed in late G1 and/or S phase, and the clb5 phenotype is
      enhanced in the double null: this is the only single-mutant G1/S phenotype reported for clb6.'
    supporting_text: Loss of function mutants are viable, but clb5- mutants exhibit a delay in S phase whereas clb6-
      mutants show a delay in late G1 and/or S phase.
    reference_section_type: ABSTRACT
  - statement: Clb6 associates with the p34(CDC28) kinase in vivo, the observation behind the bare protein-binding
      IPI row and the curated CLB6-CDC28 complex.
    supporting_text: Both cyclins have the potential to interact with the p34CDC28 kinase in vivo.
    reference_section_type: ABSTRACT
  - statement: CLB5 and CLB6 transcripts are periodic, peaking early in the cell cycle.
    supporting_text: Both genes are periodically expressed, peaking early in the cell cycle.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The companion 1993 paper, and the source of the only single-mutant G1/S phenotype for clb6 ('delay
      in late G1 and/or S phase') and of the Clb6-Cdc28 association in vivo. Abstract-only in the cache.
- id: PMID:8319908
  title: CLB5 and CLB6, a new pair of B cyclins involved in DNA replication in Saccharomyces cerevisiae.
  findings:
  - statement: CLB5 and CLB6 are transcribed as a late-G1 pulse coincident with CLN1, CLN2 and the DNA-replication
      genes, placing CLB6 in the Start transcriptional program.
    supporting_text: We describe a new family of B-type cyclin genes, CLB5 and CLB6, whose transcripts appear in
      late G1 along with those of CLN1, CLN2, and many genes required for DNA replication.
    reference_section_type: ABSTRACT
  - statement: 'Deleting CLB6 alone has little or no replication phenotype, but clb5 clb6 cells fail to initiate
      DNA replication on time: the two S-phase cyclins are redundant rather than one being dispensable.'
    supporting_text: Deletion of CLB6 has little or no effect, but deletion of CLB5 greatly extends S phase, and
      deleting both genes prevents the timely initiation of DNA replication.
    reference_section_type: ABSTRACT
  - statement: S-phase entry is attributed to Clb5/Clb6-associated Cdc28 kinase rather than to Cln-associated kinase.
    supporting_text: Thus, the kinase activity associated with Clb5/6 and not with Cln cyclins may be responsible
      for S-phase entry.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: One of the two 1993 discovery papers; establishes the late-G1 CLB5/CLB6 transcript pulse, the
      clb5 clb6 replication-initiation defect and the mild clb6 single-mutant phenotype. Cached record is abstract-only,
      so the ComplexPortal 'regulation of DNA-templated transcription' IMP keyed to it could not be verified from
      the quote; the claim itself is supported by PMID:14993267 and PMID:7651421.
- id: PMID:9732268
  title: CLB5 and CLB6 are required for premeiotic DNA replication and activation of the meiotic S/M checkpoint.
  findings:
  - statement: clb5 clb6 diploids cannot perform premeiotic DNA replication; in meiosis, unlike the mitotic cycle,
      the S-phase cyclins cannot be replaced by Clb1-Clb4.
    supporting_text: Diploid clb5/clb5 clb6/clb6 mutants are unable to perform premeiotic DNA replication.
    reference_section_type: ABSTRACT
  - statement: Clb6's own contribution to premeiotic replication is undetectable in the clb6/clb6 single mutant,
      which is the caveat attached to the GO:0006279 IMP row.
    supporting_text: No delay or defect in DNA replication could be detected in clb6/clb6 mutants (data not shown).
    reference_section_type: RESULTS
  - statement: 'That contribution is nevertheless real: the clb5 clb6 double mutant is far worse than clb5/clb5
      for both tetrad formation and spore viability, which is what the paired IGI row records.'
    supporting_text: this cyclin can clearly contribute to this process because inactivation of both CLB5 and CLB6
      resulted in a more dramatic defect in both tetrad formation and spore viability as compared with clb5/clb5
      mutants
    reference_section_type: RESULTS
  - statement: Clb5 and Clb6 are the primary activators of the S-phase function of Cdc28.
    supporting_text: The B-type cyclins Clb5 and Clb6 are the primary activators of the S phase function of the
      budding yeast CDK Cdc28.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Source of both premeiotic DNA replication rows. Note the asymmetry the paper itself records:
      no replication defect is detectable in clb6/clb6 single mutants, so Clb6''s contribution rests on the clb5
      clb6 double-mutant tetrad and spore-viability data.'
- id: PMID:9734354
  title: CLB5-dependent activation of late replication origins in S. cerevisiae.
  findings:
  - statement: Clb6 supports the firing of early replication origins only, whereas Clb5 is needed for timely firing
      of both early and late origins; this is the mechanistic basis of the clb5/clb6 phenotypic asymmetry.
    supporting_text: Therefore, Clb5p promotes the timely activation of early and late origins, but Clb6p can activate
      only early origins.
    reference_section_type: ABSTRACT
  - statement: Origin firing is otherwise unperturbed in clb6 single mutants.
    supporting_text: Origin firing appears normal in cIb6 mutants.
    reference_section_type: ABSTRACT
  - statement: In clb5 clb6 cells the mitotic cyclins Clb1-Clb4 substitute and drive an S phase in which both early
      and late origins fire, which is why the double mutant's S phase is delayed in onset rather than prolonged.
    supporting_text: In clb5 clb6 mutants, the other B-type cyclins (Clb1-4p) promote an S phase during which both
      early and late replication origins fire.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Origin-level dissection: Clb6 activates early origins only, and origin firing is otherwise normal
      in clb6 mutants. Abstract-only in the cache; note the abstract contains a typographical ''cIb6'' for ''clb6'',
      which is reproduced verbatim in one supporting_text.'
- id: PMID:16508019
  title: Distinct mechanisms control the stability of the related S-phase cyclins Clb5 and Clb6.
  findings:
  - statement: Clb6 is degraded within minutes at the G1/S border whereas Clb5 persists until mitosis, despite the
      two being transcribed together in G1.
    supporting_text: unlike Clb5, which is stable until mitosis, Clb6 is degraded rapidly at the G 1 /S border
    reference_section_type: ABSTRACT
  - statement: Clb6 lacks a functional APC/C destruction box (RXXL to KXXL) and is instead turned over by SCF(Cdc4)
      through phospho-degron motifs in its N terminus.
    supporting_text: the functional differences exhibited by Clb5 and Clb6 arise from the distinct mechanisms controlling
      their stability
    reference_section_type: ABSTRACT
  - statement: Hyperstabilized Clb6 expressed from the CLB6 promoter rescues the slow S phase of clb5 cells, so
      the Clb5/Clb6 functional difference is a difference in lifetime rather than in intrinsic activity.
    supporting_text: Finally, hyperstabilized Clb6 expressed from the CLB6 promoter rescued the slow S-phase defect
      exhibited by clb5Δ cells.
    reference_section_type: ABSTRACT
  - statement: Either Clb5 or Clb6 alone puts S-phase entry on schedule; only Clb5 is required for timely progression
      through S phase.
    supporting_text: Either Clb5 or Clb6 can promote entry into S phase on schedule ( 1 , 8 , 35 ). However, Clb5
      but not Clb6 is required for timely progression through S phase ( 8 , 35 ).
    reference_section_type: INTRODUCTION
  - statement: Clb6, not Clb5, is the cyclin required to regulate Swi6 nuclear localization.
    supporting_text: Moreover, Clb6 but not Clb5 is required to regulate the nuclear localization of the transcription
      factor Swi6 ( 12 ).
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Explains the Clb5/Clb6 asymmetry as a stability difference (SCF(Cdc4) degron in the Clb6 N terminus
      versus APC/C destruction box in Clb5) and shows that stabilized Clb6 rescues clb5. Added by this review; it
      is not cited by any GOA row but is what justifies treating the shared Clb5/Clb6 annotations as sound for Clb6.
- id: PMID:7651421
  title: Negative regulation of G1 and G2 by S-phase cyclins of Saccharomyces cerevisiae.
  findings:
  - statement: Clb5 and Clb6 negatively regulate G1- and G2-specific functions in addition to their positive role
      in DNA replication.
    supporting_text: In the present study, we show, in addition, that these cyclins negatively regulate G1- and
      G2-specific functions.
    reference_section_type: ABSTRACT
  - statement: 'The negative role is clearest for clb6: clb6 mutants have a shorter pre-Start G1 and a shorter G2
      than wild type and so grow and proliferate faster.'
    supporting_text: The consequences of this negative regulation were most apparent in clb6 mutants, which had
      a shorter pre-Start G1 phase as well as a shorter G2 phase than congenic wild-type cells.
    reference_section_type: ABSTRACT
  - statement: Both Clb5 and Clb6 down-regulate the kinase activities associated with the G1 cyclin Cln2 and the
      mitotic cyclin Clb2 in vivo.
    supporting_text: Nevertheless, both Clb5 and Clb6 were shown to be responsible for down-regulation of the protein
      kinase activities associated with Cln2, a G1 cyclin, and Clb2, a mitotic cyclin, in vivo.
    reference_section_type: ABSTRACT
  - statement: 'The inhibition of mitotic CDK activity was placed genetically downstream of CDC6, so the route is
      indirect: this is why no ''negative regulation of CDK activity'' annotation is proposed here.'
    supporting_text: Genetic evidence suggested that the inhibition of mitotic cyclin-dependent kinase activities
      was dependent on and possibly mediated through the CDC6 gene product.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary source for Clb6 as a negative regulator of G1 and G2 and for the down-regulation of Cln2-
      and Clb2-associated kinase activity; it is reference 4 of PMID:14993267, which cites it for the effect of
      CLB6 dosage on SBF/MBF-dependent transcription. Abstract-only in the cache, and the abstract does not itself
      mention the transcriptional measurements, so the transcription direction is quoted from PMID:14993267's discussion
      rather than from here. Added by this review.
