- description: Within its narrow late-G1/early-S window, Clb6-Cdc28 confers on Cdc28 a substrate specificity
    the paralogous Clb5-Cdc28 does not have, and the two documented private substrates are both nuclear
    proteins that phosphorylation sends to the cytoplasm. Clb6-Cdc28 phosphorylates Ser160 of the SBF/MBF
    subunit Swi6 and is required for Swi6 nuclear export, which damps the SBF- and MBF-dependent G1 programme
