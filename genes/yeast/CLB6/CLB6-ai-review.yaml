- description: With Clb5, supplies the CDK activity that initiates premeiotic DNA replication, a role the mitotic
    cyclins Clb1-Clb4 can cover in mitotic S phase but not in meiosis; clb5 clb6 diploids fail to replicate and
    consequently fail to activate the meiotic replication checkpoint.
