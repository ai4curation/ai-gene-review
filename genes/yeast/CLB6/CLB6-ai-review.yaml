  evidence_type: IMP
  original_reference_id: PMID:8319908
  qualifier: involved_in
  review:
    summary: 'ComplexPortal IMP for regulation of DNA-templated transcription, referenced to Schwob & Nasmyth 1993,
      whose cached record is abstract-only and mentions transcription mainly as an input (CLB5/CLB6 transcription
      depends on Cln activity). The claim is nevertheless verifiable for CLB6 from later work: Clb6-Cdc28, and specifically
      not Clb5-Cdc28, phosphorylates Swi6 at Ser160 and drives its nuclear export, and Swi6 is the shared subunit
      of the SBF and MBF G1/S transcription factors, so its export alters SBF- and MBF-mediated transcription at
      the transition.'
    action: KEEP_AS_NON_CORE
    reason: 'The term is true of Clb6 but the effect is indirect, exerted by relocalizing a transcription factor
      rather than by acting at a promoter, and the direction is genuinely unresolved: exporting Swi6 removes SBF
      activation and relieves MBF repression at the same time, so no sign-specific child term is warranted (raised
      as a suggested question instead). GO:0006355 is therefore as precise as the evidence allows, and it is peripheral
      to the S-phase CDK role, so it is kept as non-core rather than accepted as core or refined. Unlike the sibling
      CLB5 review, which had to leave the same propagated-from-1993 row UNDECIDED, the CLB6 claim can be checked
      against full-text evidence on this gene.'
    supported_by:
    - reference_id: PMID:29263158
      supporting_text: A previous study has shown that Clb6-Cdc28 but not Clb5-Cdc28 triggers nuclear export of
        transcription factor Swi6 in early S phase by specifically phosphorylating Swi6 at serine-160
