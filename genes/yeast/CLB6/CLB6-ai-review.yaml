core_functions:
- description: Regulatory cyclin subunit that binds the cyclin-dependent kinase Cdc28 (Cdk1) and converts
    it into an active protein serine/threonine kinase, forming the Clb6-Cdc28 holoenzyme (ComplexPortal
    CPX-339). CLB6 is transcribed in late G1 with CLN1, CLN2 and the replication genes, and Clb6-Cdc28
    is, with Clb5-Cdc28, the S-phase CDK activity that cooperates with the Dbf4-dependent kinase to fire
    replication origins. Either cyclin alone suffices for timely S-phase entry; Clb6 is destroyed by SCF(Cdc4)
    at the G1/S border and so fires the early origins only, which is why clb6 deletion gives a mild late-G1/S
    delay while clb5 clb6 double deletion prevents timely initiation of replication.
