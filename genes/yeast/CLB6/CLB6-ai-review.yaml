gene_symbol: CLB6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Clb6 is one of the two S-phase B-type cyclins (Clb5 and Clb6) of the budding yeast Saccharomyces
  cerevisiae, and the pair are the cyclins that supply the single essential cyclin-dependent kinase Cdc28
  (Cdk1) with its S-phase activity. Clb6 has no catalytic activity of its own: it is a two-repeat cyclin-box
  protein of the cyclin A/B subfamily that binds Cdc28 and converts it into an active protein serine/threonine
  kinase, the curated Clb6-Cdc28 complex. CLB6 lies tail-to-tail with CLB1 on chromosome VII, mirroring
  the CLB5/CLB2 pair with which it shares a duplication history, and it is transcribed in late G1 as part
  of the SBF/MBF G1/S programme alongside CLN1, CLN2 and the DNA-replication genes, so that Clb6 protein
  peaks just before the commitment to a new cycle. Clb6-Cdc28 then acts with the Dbf4-dependent kinase
  Cdc7-Dbf4 to fire replication origins. Clb5 and Clb6 are nonetheless not interchangeable, and the difference
  is one of protein lifetime rather than of activity: Clb5 carries a destruction box and survives to mitosis,
  whereas Clb6 lacks it, carries Cdc4 degrons in its N-terminal region and is destroyed by SCF(Cdc4) at
  the G1/S border in a manner requiring both Cdc28 and Pho85. Clb6 therefore triggers S-phase entry and
  fires the early origins but is gone before the late ones fire, which is why a clb6 deletion causes only
  a mild late-G1/S delay while a clb5 deletion greatly extends S phase and the double mutant cannot initiate
  replication on time; a hyperstabilized Clb6 rescues the clb5 defect. Within its narrow window Clb6-Cdc28
  has two substrates that the paralogous Clb5-Cdc28 does not phosphorylate, and in both cases phosphorylation
  moves a nuclear protein to the cytoplasm: Ser160 of the SBF/MBF subunit Swi6, which curtails the G1
  transcriptional programme that produced Clb6 in the first place, and the N-terminal TPSK motif of the
  ribonucleotide reductase small subunit Rnr2, which breaks the Rnr2-Wtm1 nuclear anchor so that Rnr2-Rnr4
  can join cytoplasmic Rnr1 and raise dNTP supply for replication. Clb5 and Clb6 are also together required
  for premeiotic DNA replication, and hence for arming the meiotic replication checkpoint, though there
  the requirement is only apparent in the double mutant.'
