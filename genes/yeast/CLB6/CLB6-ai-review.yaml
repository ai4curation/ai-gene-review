- description: As the regulatory subunit of Cdc28, confers a substrate specificity on the kinase that none of the other
    eight cyclins provides, and that in both characterised cases reduces the nuclear pool of the substrate. Clb6-Cdc28 phosphorylates
    Ser160 of the SBF/MBF subunit Swi6, relocating Swi6 to the cytoplasm and so curtailing G1 by damping the SBF- and MBF-dependent
    transcription that induced CLB6; it also phosphorylates the N-terminal CDK site of the ribonucleotide reductase subunit
    Rnr2, disrupting the Rnr2-Wtm1 interaction and releasing Rnr2-Rnr4 from the nucleus to form the active RNR holoenzyme
    that supplies dNTPs for replication. Substrate docking here does not use the RXL/Cy hydrophobic patch through which
    Clb5 recruits its replication substrates.
  supported_by:
  - reference_id: PMID:14993267
    supporting_text: In addition, by purifying all nine cyclins of Cdc28, we show that the specific phosphorylation of serine
      160 is directed largely by Clb6-Cdc28 and not by other G 1 or mitotic cyclin-Cdc28 kinase complexes.
    reference_section_type: DISCUSSION
  - reference_id: PMID:14993267
    supporting_text: Furthermore, Cdc28 combined with the S-phase cyclin Clb6 specifically phosphorylates serine 160 of
      Swi6 in vitro.
    reference_section_type: ABSTRACT
  - reference_id: PMID:14993267
    supporting_text: In this context, Clb6 can be seen as a negative regulator that curtails G 1 by promoting nuclear export
      of Swi6 in addition to other mechanisms of antagonizing G 1 Cdc28 activity ( 4 ).
    reference_section_type: DISCUSSION
  - reference_id: PMID:29263158
    supporting_text: Rnr2 contains a consensus CDK site and exhibits Clb6-dependent phosphorylation in S phase.
    reference_section_type: ABSTRACT
  - reference_id: PMID:29263158
    supporting_text: Thus, we propose that Rnr2-Rnr4 redistribution in S phase is triggered by Clb6-Cdc28-mediated phosphorylation
      of Rnr2, which disrupts the Rnr2-Wtm1 interaction and promotes the release of Rnr2-Rnr4 from the nucleus.
    reference_section_type: ABSTRACT
  - reference_id: PMID:29263158
    supporting_text: Intriguingly, our results demonstrate that the redistribution of R2 in S phase is specifically controlled
      by Clb6 but not its paralog Clb5, with which it shares 50% primary sequence identity ( 36 ).
    reference_section_type: DISCUSSION
