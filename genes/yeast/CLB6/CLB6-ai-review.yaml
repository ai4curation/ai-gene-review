      and is removed unless the cited paper supports a more informative molecular function. The partner here is Cdc28 (Cdk1)
      itself, and Clb6's relationship to Cdc28 is already represented informatively by the cyclin-dependent protein serine/threonine
      kinase regulator activity rows (GO:0016538, IDA/IMP/IBA/IEA) and by the CDK holoenzyme complex row (GO:0000307, IBA/IPI),
      so this high-throughput row adds nothing. Removal does not dispute the reported interaction, which is the best-established
      physical interaction of Clb6.
