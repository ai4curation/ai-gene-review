- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IMP
  original_reference_id: PMID:8319908
  qualifier: involved_in
  supporting_entities: []
  review:
    summary: ComplexPortal mutant-phenotype row for transcriptional regulation, from the abstract-only
      Schwob and Nasmyth paper. Clb6 does regulate transcription, and the direction is known from elsewhere
      - Clb6-Cdc28 phosphorylates Swi6 at Ser160 and drives it out of the nucleus, and CLB6 deletion raises
      SBF- and MBF-dependent gene expression, so the effect is negative.
    action: MODIFY
    reason: 'Correct but less specific than the evidence supports. The sign is the informative part of
      a transcription-regulation claim, and two independent Clb6-specific observations fix it as negative:
      the kinase is required for Swi6 nuclear export, and loss of CLB6 increases SBF/MBF output. GO:0045892
      negative regulation of DNA-templated transcription is an is_a descendant of the annotated term.
      Note that the CLB5 review left its identical row UNDECIDED, correctly, because no equivalent Clb5-specific
