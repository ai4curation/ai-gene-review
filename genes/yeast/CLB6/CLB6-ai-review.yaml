    reason: 'Positive regulation of DNA replication is a core Clb6 process. Clb6-Cdc28 activity peaks at the G1-to-S
      transition and fires early origins, and the only reason the clb6 single mutant looks normal is that the protein
      is destroyed at the G1/S border: stabilized Clb6 expressed from its own promoter rescues the clb5 slow-S-phase
      defect. The genetic partner here (CLB3) is one of the cyclins that covers for Clb5/Clb6 when they are absent.'
    supported_by:
    - reference_id: PMID:8319908
      supporting_text: Deletion of CLB6 has little or no effect, but deletion of CLB5 greatly extends S phase, and
        deleting both genes prevents the timely initiation of DNA replication.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9734354
      supporting_text: Therefore, Clb5p promotes the timely activation of early and late origins, but Clb6p can
        activate only early origins.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9734354
      supporting_text: In clb5 clb6 mutants, the other B-type cyclins (Clb1-4p) promote an S phase during which
        both early and late replication origins fire.
      reference_section_type: ABSTRACT
    - reference_id: PMID:16508019
      supporting_text: Finally, hyperstabilized Clb6 expressed from the CLB6 promoter rescued the slow S-phase defect
        exhibited by clb5Δ cells.
      reference_section_type: ABSTRACT
    - reference_id: PMID:7651421
      supporting_text: Previous genetic analysis has revealed that two B-type cyclins, Clb5 and Clb6, have a positive
        role in DNA replication.
      reference_section_type: ABSTRACT
