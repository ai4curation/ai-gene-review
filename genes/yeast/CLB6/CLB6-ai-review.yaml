- description: 'As the regulatory subunit of the activated Cdc28 kinase, confers Clb6-specific substrate selection:
    Clb6-Cdc28, and not the other eight Cdc28 cyclins, phosphorylates Swi6 at Ser160 and Rnr2 at its TPSK motif,
    in both cases releasing a nuclear protein for export - Swi6 from the nucleus, which alters SBF/MBF-mediated
    G1/S transcription, and Rnr2-Rnr4 from its Wtm1 anchor, which allows the ribonucleotide reductase holoenzyme
    to assemble for S phase.'
