proposed_new_terms: []
suggested_questions:
- question: Does Clb6-driven export of Swi6 raise or lower transcription of G1/S genes overall, given that Swi6
    serves both the activating SBF and the repressing MBF complex? Resolving the sign would allow the generic regulation
    of DNA-templated transcription annotation to be replaced by a directional term.
- question: Is there any Clb6 substrate whose phosphorylation is not a nuclear-export event? Both known Clb6-specific
    substrates (Swi6, Rnr2) are released from the nucleus when phosphorylated, which may reflect a genuine specialization
    of Clb6-Cdc28 or simply the two cases that have been looked at.
- question: Does Clb6 use the cyclin hydrophobic patch and RXL/Cy docking for its specific substrates, as Clb5 does
    for the replication-initiation factors, or does the Swi6 ankyrin-repeat interaction indicate a different docking
    surface? The Clb5-versus-Clb2 specificity study did not assay Clb6.
- question: Do the sister-chromatid cohesion defects of clb5 clb6 cells under replication stress reflect a contribution
    from Clb6 itself, and if so through which substrate? The published phenotype is only available for the double
    mutant.
suggested_experiments:
- description: Compare the Cdc28 phosphoproteome of synchronized cells expressing only Clb6 with that of cells expressing
    only Clb5 (cyclin-swap or analogue-sensitive Cdc28 plus cyclin degrons), to test whether Clb6-specific substrates
    are enriched for nucleocytoplasmic-transport cargo beyond Swi6 and Rnr2.
- description: Image an endogenously tagged, functional Clb6 (and the hyperstabilized SCF-degron mutant) through
    a synchronous cycle with nuclear and SPB markers. No direct Clb6 localization exists, which is why SGD still
    carries a root cellular_component ND row and why the propagated microtubule organizing center annotation cannot
    be settled.
- description: Measure SBF- and MBF-target transcription in clb6 cells and in SWI6-S160A cells by synchronized RNA-seq,
    to determine the direction and magnitude of the transcriptional effect of Clb6-dependent Swi6 export and whether
    it accounts for the regulation of DNA-templated transcription annotation.
