- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IMP
  original_reference_id: PMID:8319908
  qualifier: involved_in
  review:
    summary: 'Regulation of DNA-templated transcription, IMP, assigned by ComplexPortal from Schwob & Nasmyth 1993.
      That paper''s cached record is abstract-only and mentions transcription only as an input to CLB5/CLB6 (their
      expression depends on Cln activity), so the experiment behind this row cannot be read. The claim is nevertheless
      independently supported, and with a direction: Clb6-Cdc28 phosphorylates Swi6 Ser160 and drives Swi6 out of
      the nucleus, which attenuates SBF- and MBF-dependent G1 transcription, and CLB6 overexpression inhibits while
      CLB6 deletion stimulates that gene expression.'
    action: MODIFY
    reason: 'The essence is sound but the term is less specific than the evidence supports. Clb6 is reported as
      a negative regulator of the G1/S transcriptional program across three papers (Geymonat et al. for the Swi6
      Ser160 mechanism, Basco et al. for negative regulation of G1 and G2, Wu et al. restating the asymmetry with
      Clb5), so the signed descendant GO:0045892 is the right term. One conflicting observation is on record and
      bounds the claim: the swi6-S160A allele does not grossly change SBF/MBF transcription, which is why Geymonat
      et al. allow for routes besides Swi6 localization. The direction, not the existence of regulation, is what
      the replacement adds.'
    proposed_replacement_terms:
    - id: GO:0045892
      label: negative regulation of DNA-templated transcription
    supported_by:
    - reference_id: PMID:14993267
      supporting_text: In this context, Clb6 can be seen as a negative regulator that curtails G 1 by promoting
        nuclear export of Swi6 in addition to other mechanisms of antagonizing G 1 Cdc28 activity ( 4 ).
      reference_section_type: DISCUSSION
    - reference_id: PMID:14993267
      supporting_text: This conclusion is supported by the inhibitory effects of Clb6 overexpression and the stimulatory
        effects of CLB6 deletion on SBF- and MBF-dependent gene expression ( 4 ).
      reference_section_type: DISCUSSION
    - reference_id: PMID:14993267
      supporting_text: We propose that Swi6 phosphorylation by Clb6/Cdc28 generates a negative regulatory feedback
        mechanism.
      reference_section_type: DISCUSSION
    - reference_id: PMID:29263158
      supporting_text: A previous study has shown that Clb6-Cdc28 but not Clb5-Cdc28 triggers nuclear export of
        transcription factor Swi6 in early S phase by specifically phosphorylating Swi6 at serine-160, thus altering
        Swi4/Swi6 (SBF) and Mbp1/Swi6 (MBF)-mediated transcription at the G 1 /S transition ( 41 ).
      reference_section_type: DISCUSSION
    - reference_id: PMID:7651421
      supporting_text: In the present study, we show, in addition, that these cyclins negatively regulate G1- and
        G2-specific functions.
      reference_section_type: ABSTRACT
    - reference_id: PMID:14993267
      supporting_text: It is interesting that the S160A mutation that leads to nuclear localization of Swi6 does
        not reveal any major changes in SBF- or MBF-driven transcription ( 46 ).
      reference_section_type: DISCUSSION
