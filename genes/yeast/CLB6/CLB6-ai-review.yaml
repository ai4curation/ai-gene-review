suggested_questions:
- question: Is the Clb6-specific substrate preference (Swi6 Ser160, Rnr2 Thr5) a property of the cyclin's own docking surface,
    or merely a consequence of the two cyclins' different lifetimes? The RXL-independence of the Clb6-Swi6 interaction argues
    for a genuinely different surface, whereas the early SCF-Cdc4/APC degradation of Clb6 argues for timing; a stabilised
    Clb6 and a Clb5 with the Clb6 N-terminus would separate the two.
- question: Does Clb6-Cdc28 phosphorylation of Swi6 Ser160 stimulate nuclear export or prevent re-import? Geymonat et al.
    leave this open, and it determines whether the correct GO term for the Swi6 and Rnr2 outputs is GO:0046827 positive
    regulation of protein export from nucleus or the weaker GO:1900181 used here.
- question: Has Clb6 itself ever been localized? Every cellular-component row on this entry is either propagated (nucleus,
    cytoplasm, microtubule organizing center) or complex-based (GO:0000307), and the SGD cellular_component ND reflects
    that absence; imaging an endogenously tagged Clb6 would settle both the nucleus row and the microtubule organizing center
    flag.
- question: What transcriptional output underlies the Complex Portal 'regulation of DNA-templated transcription' IMP from
    Schwob & Nasmyth 1993, whose full text is not cached, and is it the same Swi6-mediated negative feedback established
    by Geymonat et al. or a distinct effect shared with Clb5?
suggested_experiments:
- description: 'Separate cyclin identity from cyclin lifetime: compare a degron-stabilised Clb6 (CDK site and destruction-box
    variants that escape SCF-Cdc4 and APC) with a Clb5 carrying Clb6''s N-terminal region, in clb5 and clb6 backgrounds,
    using synchronised phosphoproteomics plus origin-firing profiling (BrdU-IP or Okazaki-fragment sequencing). This asks
    whether Clb6 is restricted to early origins and to Swi6/Rnr2 because of when it exists or because of what it binds.'
- description: Image endogenously tagged Clb6 through a synchronous cycle alongside Spc42 (SPB), a nuclear marker and an
    origin marker, in wild-type, cdc4 and cdh1 backgrounds. This would supply the first direct localization data for Clb6,
    test the propagated microtubule organizing center annotation, and either confirm or retire the stale cellular_component
    ND.
- description: 'Distinguish export from import-block for the Clb6 substrates: use nuclear-export inhibition (crm1 ts or
    a leptomycin-sensitive Crm1) and photoconversion or fluorescence-loss-in-photobleaching on Swi6-Ser160 variants and
    on Rnr2-T5A, measuring nuclear residence time rather than steady-state distribution. The result selects between GO:0046827
    and GO:1900181 for the refined protein-localization annotation.'
