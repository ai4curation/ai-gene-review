    reference_section_type: ABSTRACT
- gap_statement: Where the Clb6 protein itself is, and whether it occupies a sub-nuclear site, has never been measured.
    No study images Clb6; its nuclear assignment is inferred from the location of its substrates and of origin firing.
    Its half-life of under five minutes may be why.
  boundary: 'Known: Swi6 and Rnr2 are phosphorylated by Clb6-Cdc28 while held in the nucleus, and the holoenzyme
    fires early replication origins. Unknown: whether Clb6 is enriched at origins or at SBF/MBF promoters, and whether
    any pool is cytoplasmic.'
