- id: PMID:14993267
  title: Clb6/Cdc28 and Cdc14 regulate phosphorylation status and cellular localization of Swi6.
  findings:
  - statement: Clb6-Cdc28 is required for nuclear export of Swi6 and phosphorylates Swi6 Ser160 in vitro, the first
      direct demonstration of a Clb6-specific Cdc28 substrate.
    supporting_text: We show that Clb6/Cdc28 kinase is required for this nuclear export. Furthermore, Cdc28 combined
      with the S-phase cyclin Clb6 specifically phosphorylates serine 160 of Swi6 in vitro.
    reference_section_type: ABSTRACT
  - statement: Purifying all nine Cdc28 cyclins showed that Ser160 phosphorylation is directed largely by Clb6-Cdc28
      and not by the other G1 or mitotic cyclin-Cdc28 complexes, i.e. the specificity is conferred by the cyclin
      subunit.
    supporting_text: In addition, by purifying all nine cyclins of Cdc28, we show that the specific phosphorylation
      of serine 160 is directed largely by Clb6-Cdc28 and not by other G 1 or mitotic cyclin-Cdc28 kinase complexes.
    reference_section_type: DISCUSSION
  - statement: The authors frame Clb6 as a negative regulator that curtails G1 by exporting Swi6, forming a negative-feedback
      loop on the SBF/MBF program that produced Clb6 in the first place.
    supporting_text: In this context, Clb6 can be seen as a negative regulator that curtails G 1 by promoting nuclear
      export of Swi6 in addition to other mechanisms of antagonizing G 1 Cdc28 activity ( 4 ).
    reference_section_type: DISCUSSION
  - statement: CLB6 overexpression inhibits and CLB6 deletion stimulates SBF- and MBF-dependent gene expression
      (citing Basco et al. 1995), which is the direction behind modifying the GOA 'regulation of DNA-templated transcription'
      row to the negative-regulation term.
    supporting_text: This conclusion is supported by the inhibitory effects of Clb6 overexpression and the stimulatory
      effects of CLB6 deletion on SBF- and MBF-dependent gene expression ( 4 ).
    reference_section_type: DISCUSSION
  - statement: 'Caveat on that direction: the swi6-S160A allele keeps Swi6 nuclear without major changes in SBF/MBF-driven
      transcription, so the transcriptional effect of Clb6 is not fully accounted for by Swi6 localization.'
    supporting_text: It is interesting that the S160A mutation that leads to nuclear localization of Swi6 does not
      reveal any major changes in SBF- or MBF-driven transcription ( 46 ).
    reference_section_type: DISCUSSION
  - statement: Whether Ser160 phosphorylation stimulates Swi6 export or blocks its re-import was left unresolved;
      either way Clb6 is the determining cyclin.
    supporting_text: Clearly, the question of whether phosphorylation triggers nuclear export or prevents import
      requires further examination, but in either case Clb6 would play a determining role.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The key Clb6-specific functional paper: Ser160 of Swi6 is phosphorylated by Clb6-Cdc28 and not
      by the other eight Cdc28 cyclin complexes, and Clb6 is required for Swi6 to leave the nucleus. Cached full
      text covers the abstract and discussion only; the cyclin-panel data are in figures not in the cache, but the
      discussion states the result and its caveats explicitly.'
- id: PMID:20489023
  title: A global protein kinase and phosphatase interaction network in yeast.
  findings: []
