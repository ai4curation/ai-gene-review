gene_symbol: CLB6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Clb6 is one of the two S-phase B-type cyclins of the budding yeast Saccharomyces cerevisiae and, with
  its paralog Clb5, the regulatory subunit of the S-phase form of the cyclin-dependent kinase Cdc28 (Cdk1). Like
  every cyclin it has no catalytic activity of its own: it is a cyclin-box protein of the cyclin A/B subfamily that
  binds Cdc28, induces the active kinase conformation and determines which substrates the holoenzyme phosphorylates.
  CLB6 is transcribed in a late-G1 pulse from the same SBF/MBF-dependent program as CLN1, CLN2, CLB5 and the DNA-replication
  genes, and the Clb6-Cdc28 complex becomes active only at the G1/S border, when the Clb-specific inhibitor Sic1
  is destroyed. Clb6-Cdc28 then fires early replication origins, and either Clb6 or Clb5 alone is sufficient to
  put S-phase entry on schedule; clb6 cells are delayed in late G1 and/or S phase, and clb5 clb6 cells cannot initiate
  replication on time and complete an inefficient S phase on the mitotic cyclins Clb1-Clb4 instead. What distinguishes
  Clb6 from Clb5 is not its activity but its lifetime: Clb5 persists until mitosis and is destroyed by APC/C-Cdc20,
  whereas Clb6 lacks a functional destruction box, carries SCF(Cdc4) phospho-degron motifs in its disordered N terminus
  and is degraded within minutes at the G1/S border, which is why it supports only early origin firing. A hyperstabilized
  Clb6 expressed from the CLB6 promoter rescues the slow S phase of clb5 cells, so the two cyclins are largely interchangeable
  activators whose outputs differ because one of them is removed early. Clb6 also has two substrate relationships
  of its own, both nuclear and both acting to release a protein from a nuclear anchor: Clb6-Cdc28, and not Clb5-Cdc28,
  phosphorylates Ser160 of the shared SBF/MBF subunit Swi6 and drives Swi6 to the cytoplasm, forming a negative-feedback
  arm that curtails the G1/S transcriptional program, and it phosphorylates the ribonucleotide reductase small subunit
  Rnr2 on an N-terminal TPSK site, weakening the Rnr2-Wtm1 interaction so that Rnr2-Rnr4 leaves the nucleus to assemble
  active RNR in S phase. Consistent with this braking role, clb6 cells have a shorter pre-Start G1 and a shorter
  G2 than wild type and grow faster, and both Clb5 and Clb6 down-regulate Cln2- and Clb2-associated kinase activity.
  In meiosis the S-phase cyclins are not redundant with Clb1-Clb4: clb5 clb6 diploids cannot perform premeiotic
  DNA replication, fail to activate the Mec1-dependent replication checkpoint and segregate unreplicated chromosomes,
  and Clb6''s contribution, undetectable on its own, is clear in the double mutant. Clb6 acts in the nucleus and
  is not essential for vegetative growth.'
