- term:
    id: GO:0006279
    label: premeiotic DNA replication
  evidence_type: IGI
  original_reference_id: PMID:9732268
  qualifier: involved_in
  supporting_entities:
  - SGD:S000006324
  review:
    summary: 'Genetic-interaction annotation from Stuart & Wittenberg with CLB5 (SGD:S000006324): clb5/clb5 clb6/clb6
      diploids cannot perform premeiotic DNA replication and fail to activate the Mec1-dependent meiotic replication
      checkpoint, segregating unreplicated DNA.'
    action: ACCEPT
    reason: 'Meiosis is the one setting in which the two S-phase cyclins are not redundant with the mitotic cyclins:
      Clb1-Clb4 can substitute for them in mitotic S phase but not in premeiotic replication, and the authors conclude
      that CLB5 and CLB6 are essential for it. The genetic evidence code is appropriate because the requirement
      is shared between the paralogs.'
    supported_by:
