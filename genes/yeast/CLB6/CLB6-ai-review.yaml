suggested_questions:
- question: Should Clb6's two documented private substrates be annotated as one process or two? Both Swi6
    Ser160 phosphorylation and Rnr2 Thr5 phosphorylation remove a nuclear protein from the nucleus, and
    this review refines the single GO:0032880 row to GO:0046827 positive regulation of protein export
    from nucleus to cover them. But the Swi6 event is a transcriptional feedback limb and the Rnr2 event
    is a dNTP-supply step, so a curator may prefer two downstream process terms over one shared transport
    term. Which representation does SGD want?
- question: Does any GO term express the fact that Clb6's functional window is minutes wide? Clb6 lacks
    a destruction box, carries Cdc4 degrons and is destroyed by SCF(Cdc4) at the G1/S border, while its
    paralog Clb5 survives to mitosis; this single difference accounts for Clb6 firing only early origins
    and for a hyperstabilized Clb6 rescuing the clb5 phenotype. The ubiquitin-ligase side of that regulation
    is annotatable on Cdc4 and Cdc34, but nothing on CLB6 records that its narrow lifetime is the functionally
    decisive feature.
- question: Is the microtubule-organizing-center IBA worth reporting upstream? GO:0005815 reaches CLB6
    from PANTHER node PTN007424001, whose descendant evidences are mitotic cyclins (CLB2, the fission-yeast
    B cyclins, vertebrate cyclin B). Clb6 is degraded before spindles form, so this review marks the row
    over-annotated. If PAINT agrees, the node may need to sit below the S-phase cyclins rather than above
    them.
suggested_experiments:
- hypothesis: Clb6-Cdc28 has a substrate set distinct from Clb5-Cdc28, enriched for proteins whose nuclear
    retention depends on a phosphorylatable anchor interface.
  description: Use elutriated small G1 cells of strains in which late-G1 Cdc28 activity is supplied by
    a single inducible cyclin (hyperstabilized Clb6 or Clb5 alone, both from the CLB6 promoter so that
    timing matches), combine with analog-sensitive cdc28-as1, and take quantitative phosphoproteomes within
    minutes of cyclin induction. Score the differential phosphosites for annotated nuclear localisation
    and for known nuclear-anchor partners, then test the top Clb6-private hits by the Rnr2 logic - mutate
    the site to a nonphosphorylatable residue at the endogenous locus and ask whether the protein is retained
    in the nucleus through S phase.
  experiment_type: Quantitative phosphoproteomics with cyclin replacement and analog-sensitive CDK
- hypothesis: Clb6's short lifetime, not its intrinsic specificity, is what restricts it to early replication
    origins.
  description: Compare origin firing genome-wide (BrdU immunoprecipitation, or dense isotope transfer
    with origin mapping) in clb5 cells carrying either wild-type CLB6 or the N-terminally hyperstabilized
    CLB6 allele expressed from the CLB6 promoter, scoring early and late origins separately. The prediction
    is that stabilisation alone restores late-origin firing in clb5 cells, which would separate cyclin
    lifetime from cyclin identity as the determinant of origin timing.
  experiment_type: Genome-wide replication-origin firing assay in allele-swap strains
