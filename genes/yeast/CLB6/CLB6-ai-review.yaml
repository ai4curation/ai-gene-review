  review:
    summary: 'IBA involved_in traversing the Start control point of the mitotic cell cycle from node PTN000808767, whose
      single experimental donor is the S. pombe G1/S B-type cyclin cig2 (SPAPB2B4.03). GO:0007089 denotes commitment to
      S phase through the positive feedback between G1/S transcription and G1 CDK activity. Budding yeast splits the job
      that cig2 does in fission yeast: Cln3, Cln1 and Cln2 run the Start commitment loop, and CLB6 is a product of that
      loop whose kinase executes S phase afterwards.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'For Clb6 the propagation is not just imprecise but points the wrong way. Its role is the G1/S transition downstream
      of Start (GO:0000082, accepted here), and its documented relationship to the Start transcriptional program is to shut
      it off: Clb6-Cdc28 phosphorylates Swi6 and thereby acts as a negative regulator that curtails G1, with CLB6 deletion
      increasing SBF- and MBF-dependent expression. A term for traversing the commitment loop therefore conflates S-phase
      execution, and a negative feedback on the loop, with the loop itself. The CLB5 review makes the same call for the
      sister propagation; flagged rather than removed, since the node placement is defensible for fission yeast.'
    supported_by:
    - reference_id: PMID:8319908
