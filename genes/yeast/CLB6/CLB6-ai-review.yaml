      node PTN007424001 and the GO:0007089 row from PTN000808767, neither of which transfers to an S-phase
      cyclin.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: UniProt electronic-annotation reference for the two ARBA/InterPro rows (GO:0016538 and
      GO:0044772). Both are sound family-level inferences from IPR046965 but less specific than the direct
      evidence, and are cited here only for family membership, since ARBA statements are unvetted predictions.
- id: PMID:14993267
  title: Clb6/Cdc28 and Cdc14 regulate phosphorylation status and cellular localization of Swi6.
  findings:
  - statement: Clb6-Cdc28 is the cyclin-CDK complex that phosphorylates Swi6 at Ser160, established by
      purifying all nine Cdc28 cyclins and assaying them on the same substrate; the specificity was confirmed
      with Cdc28 purified from cells depleted of individual cyclins.
    supporting_text: by purifying all nine cyclins of Cdc28, we show that the specific phosphorylation
      of serine 160 is directed largely by Clb6-Cdc28 and not by other G 1 or mitotic cyclin-Cdc28 kinase
      complexes
    reference_section_type: DISCUSSION
  - statement: Clb6 is required in vivo for nuclear export of Swi6; a small cytoplasmic Swi6 pool remains
      in clb6 mutants, consistent with minor redundancy among the other Clb cyclins.
    supporting_text: We show that Clb6/Cdc28 kinase is required for this nuclear export
    reference_section_type: ABSTRACT
  - statement: The authors read Clb6 as a negative feedback limb on the G1 transcriptional programme that
      produces it - Clb6 is made under MBF control and then phosphorylates Swi6 to reduce further G1-specific
      expression.
    supporting_text: After passing Start, Clb6 is synthesized by Swi6 acting in MBF. The subsequent phosphorylation
      of Swi6 by Clb6 then helps to reduce further G 1 -specific gene expression by localizing Swi6 to
      the cytoplasm
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. Sole source for Clb6-Cdc28 substrate specificity and the
      IDA/IMP grounding of the GO:0016538 rows, and the basis for refining the sign of the GO:0006355
      row.
- id: PMID:16508019
  title: Distinct mechanisms control the stability of the related S-phase cyclins Clb5 and Clb6.
  findings:
  - statement: Clb6 is degraded rapidly at the G1/S border while Clb5 is stable until mitosis; Clb6 lacks
      a destruction box and instead carries Cdc4 degrons in its N terminus, and is hyperstabilized in
      cdc34-3 and cdc4-3 mutants and by mutating N-terminal S/T-P sites.
    supporting_text: unlike Clb5, which is stable until mitosis, Clb6 is degraded rapidly at the G1/S
      border
    reference_section_type: ABSTRACT
  - statement: The functional difference between the paralogs is one of lifetime rather than of activity
      - a hyperstabilized Clb6 expressed from its own promoter rescues the slow S phase of clb5 cells.
    supporting_text: hyperstabilized Clb6 expressed from the CLB6 promoter rescued the slow S-phase defect
      exhibited by clb5Delta cells
    reference_section_type: ABSTRACT
  - statement: Either S-phase cyclin can trigger timely S-phase entry, but Clb6 alone cannot support normal
      progression through S phase.
    supporting_text: Although either Clb5 or Clb6 can trigger the timely entry into S phase, Clb6 cannot
      promote normal progression through S phase without Clb5
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier confirmed against PubMed by title search, full text cached and read. Not
      an existing GOA reference - added by this review. Explains the Clb5/Clb6 asymmetry that all the
      shared annotations rest on, and supports the GO:0005815 over-annotation call.
- id: PMID:20489023
  title: A global protein kinase and phosphatase interaction network in yeast.
  findings:
  - statement: A proteome-scale mass-spectrometric survey of kinase and phosphatase complexes. The CLB6
      entry in it is the Cdc28 association, recorded in GOA as a bare protein-binding IPI; the paper reports
      no Clb6-specific conclusion.
    supporting_text: We identified a kinase and phosphatase interaction (KPI) network of 1844 interactions
      in budding yeast by mass spectrometric analysis of protein complexes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. A high-throughput survey, correctly cited for a Clb6-Cdc28
      interaction but contributing nothing about function beyond it.
- id: PMID:29263158
  title: Clb6-Cdc28 Promotes Ribonucleotide Reductase Subcellular Redistribution during S Phase.
  findings:
  - statement: Clb6-Cdc28 phosphorylates the N-terminal TPSK motif of Rnr2, weakening the Rnr2-Wtm1 nuclear
      anchor so that Rnr2-Rnr4 is released to the cytoplasm in S phase; deleting CLB6 or removing the
      CDK site retains Rnr2-Rnr4 in the nucleus and sensitizes cells to hydroxyurea.
    supporting_text: Deletion of CLB6 or removal of the CDK site results in an increased association of
      Rnr2 with its nuclear anchor Wtm1, nuclear retention of Rnr2-Rnr4, and an enhanced sensitivity to
      the RNR inhibitor hydroxyurea
    reference_section_type: ABSTRACT
  - statement: The effect is specific to Clb6 and is not shared with its 50%-identical paralog Clb5.
    supporting_text: our results demonstrate that the redistribution of R2 in S phase is specifically
      controlled by Clb6 but not its paralog Clb5, with which it shares 50% primary sequence identity
    reference_section_type: DISCUSSION
  - statement: Clb5 fires both early and late replication origins whereas Clb6 fires only the early ones,
      because Clb6 is destroyed early in S phase while Clb5 persists.
    supporting_text: Clb5 is required for the firing of both early and late replication origins, while
      Clb6 is only involved in the firing of the early origins
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. Sole source for the GO:0032880 row and the second of the
      two Clb6-private substrate results.
- id: PMID:8253070
  title: A new pair of B-type cyclins from Saccharomyces cerevisiae that function early in the cell cycle.
  findings:
  - statement: CLB5 and CLB6 are a duplicated pair of B-type cyclin genes arranged tail-to-tail with CLB2
      and CLB1 respectively; both are periodically expressed with a peak early in the cell cycle.
    supporting_text: Both genes are periodically expressed, peaking early in the cell cycle
    reference_section_type: ABSTRACT
  - statement: Neither single deletion is lethal; clb6 mutants delay in late G1 and/or S phase, and the
      clb5 phenotype is worse in the double mutant.
    supporting_text: Loss of function mutants are viable, but clb5- mutants exhibit a delay in S phase
      whereas clb6- mutants show a delay in late G1 and/or S phase
    reference_section_type: ABSTRACT
  - statement: Both cyclins associate with the Cdc28 kinase in vivo.
    supporting_text: Both cyclins have the potential to interact with the p34CDC28 kinase in vivo
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache, but the abstract itself states the clb6 single-mutant phenotype
      and the Cdc28 association that the IMP and IPI rows rest on.
- id: PMID:8319908
  title: CLB5 and CLB6, a new pair of B cyclins involved in DNA replication in Saccharomyces cerevisiae.
  findings:
  - statement: CLB5 and CLB6 transcripts appear in late G1 with CLN1, CLN2 and the DNA replication genes,
      and their transcription depends on Cln activity, which places them downstream of Start rather than
      at it.
    supporting_text: Transcription of CLB5 and CLB6 is normally dependent on Cln activity
    reference_section_type: ABSTRACT
  - statement: clb6 deletion has little or no effect and clb5 deletion greatly extends S phase, while
      the double deletion prevents timely initiation of DNA replication.
    supporting_text: Deletion of CLB6 has little or no effect, but deletion of CLB5 greatly extends S
      phase, and deleting both genes prevents the timely initiation of DNA replication
    reference_section_type: ABSTRACT
  - statement: The mitotic-spindle role within the pair belongs to Clb5, together with Clb3 and Clb4,
      not to Clb6.
    supporting_text: Clb5 also has a function, along with Clb3 and Clb4, in the formation of mitotic spindles
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Source of the IGI rows, of the ComplexPortal IPI and GO:0006355
      rows; the transcription-regulation claim coded from it cannot be checked without the full text,
      which is why that row is refined on the strength of PMID:14993267 instead.
- id: PMID:9732268
  title: CLB5 and CLB6 are required for premeiotic DNA replication and activation of the meiotic S/M checkpoint.
  findings:
  - statement: Clb5 and Clb6 are the primary activators of the S-phase function of Cdc28, a role Clb1-Clb4
      can take over in mitotically growing cells.
    supporting_text: The B-type cyclins Clb5 and Clb6 are the primary activators of the S phase function
      of the budding yeast CDK Cdc28
    reference_section_type: ABSTRACT
  - statement: In meiosis the requirement is apparent only in the double mutant - clb6/clb6 diploids replicate
      normally, whereas clb5/clb5 clb6/clb6 diploids make no premeiotic DNA even after 24 h and then segregate
      unreplicated chromosomes.
    supporting_text: No delay or defect in DNA replication could be detected in clb6/clb6 mutants (data
      not shown)
    reference_section_type: RESULTS
  - statement: The checkpoint failure is attributed to the absence of a replication signal rather than
      to a checkpoint role for the cyclins themselves, which places the cyclins upstream of the signal.
    supporting_text: presumably because no replication signal can be generated
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached and read. Supports the two GO:0006279 rows, and its explicit statement
      that clb6/clb6 single mutants have no defect is why both are kept as non-core rather than accepted
      as core.
