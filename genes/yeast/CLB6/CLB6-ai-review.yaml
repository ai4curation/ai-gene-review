  review:
    summary: IBA involved_in traversing the Start control point from node PTN000808767, whose experimental donor
      is the S. pombe G1/S B-type cyclin cig2. GO:0007089 is defined as commitment to S phase through the positive
      feedback between transcription and G1 CDK activity. In budding yeast that loop is Cln3-Whi5/SBF-Cln1/2; CLB6
      is a product of the Start program, and Clb6-Cdc28 is held inactive by Sic1 until after Start.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Clb6 acts downstream of Start commitment, on the G1/S transition itself (GO:0000082, accepted), and
      its documented relationship to the Start feedback loop runs the other way: Clb6-Cdc28 terminates the SBF/MBF
      program by exporting Swi6, and clb6 mutants have a shorter pre-Start G1 than wild type, i.e. Clb6 is a brake
      on Start rather than part of the commitment switch. The propagation conflates S-phase execution with Start
      commitment, as it does for CLB5 and CLB2; fission yeast has no separate Cln-type Start cyclins, so the donor''s
      role is genuinely different.'
    supported_by:
    - reference_id: PMID:16508019
      supporting_text: Although CLB5 and CLB6 are transcribed in G 1 , Clb5/Cdc28 (and presumably Clb6/Cdc28) complexes
        are not activated until the G 1 /S border when the Clb-specific Cdk inhibitor, Sic1, is degraded by the
        action of the ubiquitin ligase complex, SCF Cdc4 ( S kp1/ C ullin/ F -box) ( 33 , 34 , 41 , 42 ).
      reference_section_type: INTRODUCTION
    - reference_id: PMID:7651421
      supporting_text: The consequences of this negative regulation were most apparent in clb6 mutants, which had
        a shorter pre-Start G1 phase as well as a shorter G2 phase than congenic wild-type cells.
      reference_section_type: ABSTRACT
    - reference_id: PMID:14993267
      supporting_text: In this context, Clb6 can be seen as a negative regulator that curtails G 1 by promoting
        nuclear export of Swi6 in addition to other mechanisms of antagonizing G 1 Cdc28 activity ( 4 ).
      reference_section_type: DISCUSSION
    - reference_id: PMID:8319908
      supporting_text: Transcription of CLB5 and CLB6 is normally dependent on Cln activity, but ectopic CLB5 expression
        allows cells to proliferate in the absence of Cln cyclins.
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000808767
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node seeded by fission-yeast cig2, the G1/S B-type cyclin of an organism without separate Cln-type
          Start cyclins. In budding yeast Start commitment is carried by Cln3/Cln1/Cln2, and Clb6 acts after Start,
          where it negatively regulates the Start transcriptional program.
      residue_claims_not_applicable: The argument is about which gene performs Start commitment in budding yeast
        versus fission yeast, a role question rather than a point-residue one; no residue of Clb6 is at issue.
