  evidence_type: IMP
  original_reference_id: PMID:8319908
  qualifier: involved_in
  review:
    summary: 'Regulation of DNA-templated transcription, IMP, assigned by Complex Portal from Schwob & Nasmyth. The cached
      record for that paper is abstract-only and its abstract mentions transcription only as an input (CLB5/CLB6 transcription
      depends on Cln activity), so the experiment behind this row cannot be read. For Clb6, however, the transcriptional
      output is independently established and signed: Clb6-Cdc28 phosphorylates Swi6 on Ser160, the modification that removes
      the shared SBF/MBF subunit from the nucleus, and CLB6 deletion stimulates while CLB6 overexpression inhibits SBF-
      and MBF-dependent gene expression.'
    action: MODIFY
    reason: 'The general term is correct but the direction is known, so this is a sign refinement rather than a descent:
      Clb6 is a negative regulator that curtails G1 by driving Swi6 out of the nucleus, and both directions of perturbation
      agree. GO:0045892 negative regulation of DNA-templated transcription states that, whereas GO:0006355 leaves the most
      informative part of the claim out. The refined term is a genuine but secondary output of the S-phase kinase, not its
      core function, so it is not carried into core_functions; note that the CLB5 review had to leave the equivalent row
      UNDECIDED because no comparable Clb5-specific evidence exists.'
    proposed_replacement_terms:
    - id: GO:0045892
      label: negative regulation of DNA-templated transcription
    supported_by:
    - reference_id: PMID:14993267
