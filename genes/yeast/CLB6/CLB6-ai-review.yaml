  review:
    summary: 'IGI positive regulation of DNA replication with CLB3 from Schwob & Nasmyth 1993. The Clb cyclins are
      mutually redundant for origin firing: clb5 clb6 cells initiate replication late and get through S phase on
      Clb1-Clb4 activity instead, which is how the contribution of each member is exposed genetically.'
