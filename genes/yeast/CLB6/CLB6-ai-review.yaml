    which peaks at the G1-to-S transition and, with DDK, fires early replication origins; Clb6 supplies no catalytic
    activity of its own and is the subunit that times the kinase, being transcribed in late G1 with CLN1/CLN2 and
    the replication genes and destroyed again at the G1/S border.
