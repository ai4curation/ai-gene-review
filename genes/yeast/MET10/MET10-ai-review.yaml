- term:
    id: GO:0010181
    label: FMN binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:97361
  - PANTHER:PTN000453956
  - RGD:3184
  - RGD:68335
  - UniProtKB:O08336
  - UniProtKB:O08394
  - UniProtKB:P38038
  - UniProtKB:Q9UBK8
  - UniProtKB:Q9UHB4
  review:
    summary: 'PAINT IBA from the diflavin reductase node (PTN000453956: NOS reductase, P450 reductase,
      methionine synthase reductase), whose members bind FMN through an N-terminal flavodoxin domain.
      Met10 lacks that domain: its N-terminal region is PFOR-like, InterPro/Pfam detect only the FAD-binding
      and NAD-binding modules, and the MET10 cloning paper notes the lack of obvious FMN-binding motifs
      (PMID:7928966). The holoenzyme contains FMN (PMID:6751400), but in yeast the flavodoxin-like FMN
      domain is on the beta subunit Met5 (InterPro IPR001094/IPR008254, Pfam PF00258). The IBA therefore
      transfers a domain-dependent cofactor-binding function to a subunit that does not carry the domain.'
    action: REMOVE
    reason: 'Domain-architecture mismatch: the FMN-binding flavodoxin domain is in Met5, not Met10; Met10
      sequence lacks FMN-binding motifs.'
    supported_by:
    - reference_id: PMID:7928966
      supporting_text: together with a lack of obvious flavin mononucleotide-binding motifs in the MET10
        deduced amino acid sequence, suggests that the yeast assimilatory sulfite reductase is a distinct
        type of sulfite reductase
    - reference_id: PMID:6751400
      supporting_text: this enzyme contains two FAD, two FMN and two hemes per molecule
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000453956
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Diflavin reductase node (NOS/CPR/MTRR relatives) whose FMN binding resides in an N-terminal
          flavodoxin domain that Met10 lacks; in yeast SiR that domain is carried by Met5.
