id: P39692
gene_symbol: MET10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Met10 is the alpha (flavoprotein) subunit of the assimilatory NADPH-sulfite reductase of
  Saccharomyces cerevisiae (EC 1.8.1.2), a cytoplasmic alpha2beta2 hemoflavoprotein in which Met10 pairs
  with the siroheme/[4Fe-4S] beta subunit Met5. The enzyme carries out the six-electron reduction of sulfite
  to hydrogen sulfide, the last reductive step of sulfate assimilation, which supplies the sulfide that
  is built into homocysteine and from there into methionine, cysteine and glutathione. Met10 has the C-terminal
  FAD- and NADPH-binding ferredoxin-NADP reductase-like module that takes electrons from NADPH. Its N-terminal
  region resembles pyruvate-flavodoxin oxidoreductase, and it lacks the flavodoxin-like FMN domain of
  bacterial CysJ (that domain is found on Met5 in yeast). met10 mutants are methionine auxotrophs, and
  partial loss-of-function alleles strongly reduce H2S release by wine yeasts during fermentation.
