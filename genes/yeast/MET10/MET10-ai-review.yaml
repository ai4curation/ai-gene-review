  review:
    summary: Affinity-purification/MS proteome survey (PMID:16429126) detected Met10 with Met5 (P47169),
      its partner in the sulfite reductase holoenzyme. The interaction is real and expected, but 'protein
      binding' is uninformative; it is better represented by part_of sulfite reductase complex (NADPH)
      and contributes_to sulfite reductase activity, which are already annotated.
    action: REMOVE
    reason: Uninformative protein binding term; removal does not mean the interaction is false. The
      Met5-Met10 holoenzyme is captured by GO:0009337. This is the standing uninformative-binding
      exception; the measured association is not declared false and no partner enzymatic activity
      is transferred.
