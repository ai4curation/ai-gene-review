- term:
    id: GO:0031509
    label: subtelomeric heterochromatin formation
  evidence_type: IMP
  original_reference_id: PMID:9030687
  qualifier: involved_in
  review:
    summary: 'Proposed: CAC2, as a CAF-1 subunit, is involved in subtelomeric heterochromatin formation.'
    action: NEW
    reason: 'Deletion of any CAC gene strongly reduces silencing of telomere-adjacent reporters, and loss
      of CAF-I subunits destabilizes HML repression. Participation test: CAF-1 performs a step of the
      process itself, depositing H3-H4 into the chromatin that Sir proteins then compact (Enomoto et al.
      propose Rlf2p facilitates timely assembly of histones into telomeric chromatin); it is not merely
      a substrate or upstream requirement. Comparator check: the partner H3-H4 chaperone ASF1 (P32447)
      already carries GO:0031509 and GO:0030466 by IGI (PMID:15840725), as does SIR3 by IMP, so the term
      is used for chromatin-assembly factors in yeast; the CAF-1 subunits currently carry no heterochromatin-formation
      annotation at all in GOA. This is proposed as non-core relative to the general replication-coupled
      assembly function.'
    supported_by:
    - reference_id: PMID:9030687
      supporting_text: Deletion of CAC genes also strongly reduces silencing of genes adjacent to telomeric
        DNA
    - reference_id: PMID:9030688
      supporting_text: We propose that Rlf2p facilitates the efficient and timely assembly of histones
        into telomeric chromatin
    - reference_id: PMID:9436982
      supporting_text: Loss of the other CAF-I subunits (Cac2p and Cac3p/Msi1p) also results in the shmoo
        cluster phenotype, implying that loss of CAF-I activity gives rise to this unstable repression
        of HML.
    additional_reference_ids:
    - PMID:9436982
