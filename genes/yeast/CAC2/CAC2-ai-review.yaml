        Cac2 and the Cac1 acidic region.
    - &id012
      reference_id: PMID:28418026
      supporting_text: Cac2 is indispensable for productive histone binding, while deletion of Cac3 has
        only moderate effects on H3-H4 binding and nucleosome assembly.
    - &id015
      reference_id: PMID:28315525
      supporting_text: Free monomeric yCAF1 (step 1) is loaded with dimeric H3-H4 through association
