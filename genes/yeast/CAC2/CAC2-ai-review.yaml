- id: file:yeast/CAC2/CAC2-deep-research-falcon.md
  title: Falcon deep research report for CAC2
  findings: []
core_functions:
- description: Cac2 is the WD40 middle subunit of CAF-1; bound to Cac1, it forms part of the composite
    H3-H4 binding interface and is required for productive histone binding and (H3-H4)2 deposition in
    replication-coupled nucleosome assembly.
  contributes_to_molecular_function: *id010
  directly_involved_in:
  - id: GO:0006335
    label: DNA replication-dependent chromatin assembly
  in_complex: &id014
    id: GO:0033186
    label: CAF-1 complex
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id011
  - *id012
  - reference_id: PMID:30239791
    supporting_text: The Histone chaperone Chromatin Assembly Factor-1 (CAF-1) interacts with the replisome
      and deposits H3-H4 directly onto newly synthesized DNA.
  - *id013
- description: Through its C-terminal B-domain, Cac2 interacts with Asf1, the upstream H3-H4 chaperone
    that loads histone dimers onto CAF-1.
  contributes_to_molecular_function: *id010
  in_complex: *id014
  supported_by:
  - reference_id: PMID:28315525
    supporting_text: While Cac2 contains a C-terminal Asf1 interaction motif
  - *id015
  - reference_id: PMID:11756556
    supporting_text: We also observed a weak interaction between Asf1p and Cac2p in vitro
proposed_new_terms: []
suggested_questions:
- question: What is the structural basis for Cac2 shaping the H3-H4 binding interface, and does the Asf1
    B-domain interaction directly transfer histones to the Cac1-Cac2 composite site?
- question: Is the hypoxia-induced relocalization of Cac2 to the cytosol functionally meaningful for chromatin
    assembly under low oxygen?
suggested_experiments:
- description: Determine a structure of yeast CAF-1 bound to H3-H4 and Asf1, and test B-domain mutants
    for histone handoff kinetics in vitro and silencing in vivo.
  experiment_type: structural biology
  hypothesis: The Cac2 B-domain docks Asf1 adjacent to the Cac1-Cac2 histone site, enabling direct transfer
    of H3-H4.
