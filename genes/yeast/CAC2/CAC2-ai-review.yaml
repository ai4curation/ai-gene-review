- term: &id010
    id: GO:0000510
    label: H3-H4 histone complex chaperone activity
  evidence_type: IDA
  original_reference_id: PMID:28418026
  qualifier: contributes_to
  review:
    summary: 'Proposed: Cac2 contributes to the H3-H4 histone complex chaperone activity of CAF-1.'
    action: NEW
    reason: HX-MS and mutagenesis of reconstituted yeast CAF-1 show that H3-H4 is bound by a composite
      interface formed by Cac1-bound Cac2 and the Cac1 acidic region, and that Cac2 is indispensable for
      productive histone binding and nucleosome assembly. Cac2 also receives H3-H4 from Asf1 through its
      B-domain. Isolated Cac2 is not a high-affinity chaperone, so the contributes_to qualifier is appropriate.
      The large subunit (RLF2) already carries GO:0000510 by IBA; CAC2 carries only contributes_to histone
      binding, which is less specific.
    supported_by:
    - &id011
      reference_id: PMID:28418026
