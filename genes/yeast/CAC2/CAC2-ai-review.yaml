id: Q04199
gene_symbol: CAC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CAC2 encodes Cac2, the middle (p60-like) WD40-repeat subunit of chromatin assembly factor
  1 (CAF-1), the heterotrimeric H3-H4 histone chaperone (Cac1-Cac2-Cac3/Msi1) that deposits newly synthesized
  H3-H4 onto DNA during DNA replication and repair synthesis. Cac2 binds the large subunit Cac1 and, together
  with the Cac1 acidic region, forms the composite H3-H4 binding interface; it is indispensable for productive
  histone binding and nucleosome assembly by CAF-1. A C-terminal B-domain mediates interaction with the
  upstream H3-H4 chaperone Asf1, which hands off histone dimers to CAF-1. Cac2 is nuclear; it is not essential
  for growth, but cac2 deletion, like loss of the other CAF-1 subunits, reduces telomeric and HM-locus
  silencing and increases UV sensitivity.
