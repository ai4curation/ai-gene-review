gene_symbol: CAC2
organism: yeast
uniprot_id: Q04199
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acts as a component of the histone chaperone complex chromatin assembly factor
    1 (CAF-1), which assembles histone octamers onto replicating DNA (PubMed:9030687).
    It performs the first step of the nucleosome assembly process, bringing newly
    synthesized histones H3 and H4 to replicating DNA; histones H2A/H2B can bind to
    this chromatin precursor subsequent to DNA replication to complete the histone
    octamer (By similarity). Plays a role in the maintenance of heterochromatin (By
    similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04199
  source_id: Q04199
- source: Alliance_Imported
  text: Subunit of chromatin assembly factor I (CAF-1), with Rlf2p and Msi1p; chromatin
    assembly by CAF-1 is important for multiple processes including silencing at telomeres,
    mating type loci, and rDNA; maintenance of kinetochore structure, deactivation
    of the DNA damage checkpoint after DNA repair, chromatin dynamics during transcription;
    and repression of divergent transcription; relocalizes to the cytosol in response
    to hypoxia
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAC2
  source_id: SGD:S000004570
- source: Alliance_Automated
  text: Contributes to histone binding activity. Involved in DNA replication-dependent
    chromatin assembly. Located in chromosome, centromeric region; cytosol; and nucleus.
    Part of CAF-1 complex and nucleosome. Orthologous to human CHAF1B (chromatin assembly
    factor 1 subunit B).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAC2
  source_id: SGD:S000004570
