description: 'HEM15 encodes ferrochelatase (protoheme ferro-lyase, EC 4.98.1.1, formerly 4.99.1.1), the terminal
  enzyme of heme biosynthesis. It inserts Fe2+ into protoporphyrin IX to form protoheme (heme b). The nuclear-encoded
  precursor carries a 31-residue N-terminal mitochondrial presequence. The mature 40.9 kDa protein is a peripheral
  protein of the inner mitochondrial membrane with its active site facing the matrix, where it receives protoporphyrin
  IX from protoporphyrinogen oxidase (Hem14p). hem15 mutants accumulate protoporphyrin IX and are heme-deficient,
  and the purified enzyme shows ferrochelatase kinetics with porphyrin and iron substrates. Correct matrix-side
  localization is needed for efficient heme and b-type cytochrome production: a version lacking the targeting sequence
  still chelates iron but mislocalizes to other membranes and supports less heme synthesis. HEM15 is only mildly
  repressed by glucose.'
