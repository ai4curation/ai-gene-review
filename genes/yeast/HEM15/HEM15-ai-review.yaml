suggested_questions:
- question: Does Hem15p form a physical complex with Hem14p (protoporphyrinogen oxidase) and the mitochondrial iron
    delivery machinery (e.g. Mrs3/Mrs4 carriers or frataxin Yfh1) in yeast, as proposed for mammalian ferrochelatase?
- question: Does yeast ferrochelatase contain an iron-sulfur cluster like the mammalian enzyme, or is it cluster-free
    like bacterial ferrochelatases?
suggested_experiments:
- hypothesis: Hem15p channels protoporphyrin IX directly from Hem14p and receives iron from a dedicated mitochondrial
    donor
  description: Use crosslinking/affinity purification of tagged Hem15p from isolated mitochondria followed by mass
    spectrometry, and test substrate channelling by measuring free protoporphyrin IX release in reconstituted Hem14p-Hem15p
    systems.
  experiment_type: protein interaction / enzymology
