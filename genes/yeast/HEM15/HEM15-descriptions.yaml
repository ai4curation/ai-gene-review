  text: Enables protoporphyrin ferrochelatase activity. Involved in heme biosynthetic
    process. Located in mitochondrion. Is active in mitochondrial inner membrane.
    Used to study cancer. Human ortholog(s) of this gene implicated in cutaneous porphyria
    and erythropoietic protoporphyria. Orthologous to human FECH (ferrochelatase).
