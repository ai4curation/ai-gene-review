  text: Enables cystathionine gamma-lyase activity and cysteine-S-conjugate beta-lyase
    activity. Involved in L-cysteine biosynthetic process; positive regulation of
    hydrogen sulfide biosynthetic process; and transsulfuration. Located in nucleus.
    Is active in cytoplasm. Human ortholog(s) of this gene implicated in amino acid
    metabolic disorder and cystathioninuria. Orthologous to human CTH (cystathionine
    gamma-lyase).
