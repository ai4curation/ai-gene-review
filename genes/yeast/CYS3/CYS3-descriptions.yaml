gene_symbol: CYS3
organism: yeast
uniprot_id: P31373
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the production of cysteine from cystathionine in the reverse transsulfuration
    pathway for the biosynthesis of sulfur- containing amino acids cysteine and methionine.
    In this pathway, homocysteine sulfur is converted to cysteine sulfur (Probable).
    Also has cystathionine beta-lyase and cystathionine gamma-synthase activities
    in vitro. Cystathionine beta-lyase may be physiological, while cystathionine gamma-synthase
    activity is not, as the required substrate O-succinyl-L-homoserine(OSH) does not
    occur naturally in S.cerevisiae (PubMed:8335636).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P31373
  source_id: P31373
- source: Alliance_Imported
  text: Cystathionine gamma-lyase; catalyzes one of the two reactions involved in
    the transsulfuration pathway that yields cysteine from homocysteine with the intermediary
    formation of cystathionine; protein abundance increases in response to DNA replication
    stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/CYS3
  source_id: SGD:S000000010
- source: Alliance_Automated
  text: Enables cystathionine gamma-lyase activity and cysteine-S-conjugate beta-lyase
    activity. Involved in L-cysteine biosynthetic process; positive regulation of
    hydrogen sulfide biosynthetic process; and transsulfuration. Located in nucleus.
    Is active in cytoplasm. Human ortholog(s) of this gene implicated in amino acid
    metabolic disorder and cystathioninuria. Orthologous to human CTH (cystathionine
    gamma-lyase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CYS3
  source_id: SGD:S000000010
