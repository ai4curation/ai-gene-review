descriptions:
- source: UniProt
  text: Catalyzes the production of cysteine from cystathionine in the reverse transsulfuration
    pathway for the biosynthesis of sulfur- containing amino acids cysteine and methionine.
    In this pathway, homocysteine sulfur is converted to cysteine sulfur (Probable).
    Also has cystathionine beta-lyase and cystathionine gamma-synthase activities
    in vitro. Cystathionine beta-lyase may be physiological, while cystathionine gamma-synthase
    activity is not, as the required substrate O-succinyl-L-homoserine(OSH) does not
    occur naturally in S.cerevisiae (PubMed:8335636).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P31373
