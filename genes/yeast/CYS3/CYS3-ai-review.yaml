  review:
    summary: Purified Cys3 cleaved a cysteine-furfural S-conjugate to release 2-furfurylthiol (PMID:29436228),
      a carbon-sulfur (beta-)lyase activity on cysteine S-conjugates, consistent with the cystathionine
