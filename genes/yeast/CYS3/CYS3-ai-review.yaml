- term:
    id: GO:1904828
    label: positive regulation of hydrogen sulfide biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:31582588
  qualifier: involved_in
  review:
    summary: In PMID:31582588 CYS3 overexpression increased H2S production and restored it in sch9 mutants.
      This shows that Cys3, a transsulfuration enzyme that can release H2S from cysteine-derived substrates,
      contributes catalytically to H2S formation; it does not show that Cys3 regulates H2S biosynthesis.
      The regulator in that study is TORC1-Sch9, acting via CYS3/CYS4 expression. A direct process term
      (hydrogen sulfide biosynthetic process) represents the finding better.
    action: MODIFY
    reason: Enzyme producing H2S was annotated with a regulation term; the regulatory role belongs to
      TORC1-Sch9.
    proposed_replacement_terms:
    - id: GO:0070814
      label: hydrogen sulfide biosynthetic process
    supported_by:
    - reference_id: PMID:31582588
      supporting_text: Overexpressing CYS3 significantly increased H2S production by WT cell.
    - reference_id: PMID:31582588
      supporting_text: These data support the hypothesis that the CYS3 and CYS4 genes in the transsulfuration
        pathway mediate H2S production and are regulated by the mTORC1-Sch9 pathway.
