  - SGD_PWY:THREOCAT2-PWY
  review:
    summary: Inferred because YeastPathways includes the Cys3 reaction in a threonine catabolism pathway
      (SGD_PWY:THREOCAT2-PWY). Cys3 does not act on threonine; threonine catabolism to 2-oxobutanoate
      in yeast is carried out by threonine deaminases (Ilv1, Cha1). The link appears to arise only because
      cystathionine cleavage also yields 2-oxobutanoate. No yeast evidence supports Cys3 participating
      in L-threonine catabolism.
    action: REMOVE
    reason: 'Pathway-inheritance artefact: Cys3 does not catalyse any step of threonine catabolism; shared
      product (2-oxobutanoate) is not participation.'
