id: P31373
gene_symbol: CYS3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Cys3 (Cys3p/Str1p, CYI1) is the cytoplasmic pyridoxal 5'-phosphate-dependent cystathionine
  gamma-lyase of Saccharomyces cerevisiae (EC 4.4.1.1). It cleaves L-cystathionine to L-cysteine, 2-oxobutanoate
  and ammonia, the second and final step of the reverse transsulfuration pathway by which yeast, which
  incorporates reduced sulfur first into homocysteine, makes cysteine (and hence glutathione) from homocysteine.
  Cys4 (cystathionine beta-synthase) catalyses the preceding condensation of homocysteine with serine.
  cys3 null mutants are cysteine auxotrophs. The purified homotetrameric enzyme also shows cystathionine
  beta-lyase, cysteine-S-conjugate beta-lyase and (with the non-physiological substrate O-succinylhomoserine)
  cystathionine gamma-synthase activities in vitro, and it contributes to H2S release from cysteine-derived
  substrates. CYS3 mRNA levels fall when the TORC1-Sch9 pathway is inhibited.
