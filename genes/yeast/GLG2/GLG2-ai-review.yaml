gene_symbol: GLG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GLG2 (YJL137C) encodes glycogenin-2, the second of two partially redundant self-glucosylating
  initiator proteins (with GLG1) for glycogen synthesis in Saccharomyces cerevisiae. A GT8-family glucosyltransferase
  (EC 2.4.1.186), purified Glg2 transfers glucose from UDP-glucose onto its own Tyr230 and Tyr232 and
  extends the attached chain to an alpha-1,4-linked oligosaccharide; it can also glucosylate exogenous
  acceptors. The protein-bound primer is elongated by glycogen synthase (Gsy1/Gsy2) and Glg2 remains covalently
  associated with the high-molecular-weight glycogen fraction. Either GLG gene alone supports glycogen
  accumulation, whereas the glg1 glg2 double mutant makes no glycogen. Glg2 is cytosolic and interacts
  with glycogen synthase Gsy2.
