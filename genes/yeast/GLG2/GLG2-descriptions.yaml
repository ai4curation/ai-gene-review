descriptions:
- source: UniProt
  text: Self-glucosylating initiator of glycogen synthesis. It catalyzes the formation
    of a short alpha (1,4)-glucosyl chain covalently attached via a glucose 1-O-tyrosyl
    linkage to internal tyrosine residues and these chains act as primers for the
    elongation reaction catalyzed by glycogen synthase (PubMed:15479227, PubMed:8524228,
    PubMed:8900126). Capable of transferring glucosyl residues to unbound acceptors
    such as free oligoglucans or oligoglucan derivatives (PubMed:8900126).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47011
  source_id: P47011
- source: Alliance_Imported
  text: Glycogenin glucosyltransferase; self-glucosylating initiator of glycogen synthesis,
    also glucosylates n-dodecyl-beta-D-maltoside; similar to mammalian glycogenin;
    GLG2 has a paralog, GLG1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLG2
  source_id: SGD:S000003673
- source: Alliance_Automated
  text: Enables glycogenin glucosyltransferase activity. Involved in glycogen biosynthetic
    process. Located in cytoplasm. Orthologous to human GYG2 (glycogenin 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLG2
  source_id: SGD:S000003673
