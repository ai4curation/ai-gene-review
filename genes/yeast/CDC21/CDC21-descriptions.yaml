  text: Enables thymidylate synthase activity. Involved in dTMP biosynthetic process.
    Located in nuclear periphery. Human ortholog(s) of this gene implicated in several
    diseases, including abdominal aortic aneurysm; digenic dyskeratosis congenita;
    gastrointestinal system cancer (multiple); hematologic cancer (multiple); and
    rheumatoid arthritis. Orthologous to human TYMS (thymidylate synthetase).
