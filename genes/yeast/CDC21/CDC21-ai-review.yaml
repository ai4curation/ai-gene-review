suggested_questions:
- question: How do mitochondria obtain dTTP for mtDNA replication when thymidylate synthase is nuclear-periphery
    associated?
- question: Is the nuclear-periphery localisation of Cdc21p cell-cycle regulated and does it reflect a dNTP-synthesis
    complex near replication sites?
suggested_experiments:
- hypothesis: Cdc21p localisation to the nuclear periphery is S-phase enriched
  description: Live-cell imaging of endogenously tagged Cdc21p through synchronized cell cycles with nuclear envelope
    markers, combined with proximity labelling (APEX2/BioID) to identify neighbours such as Cdc8p or RNR subunits.
  experiment_type: live-cell imaging / proximity proteomics
