gene_symbol: CDC21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CDC21 (TMP1, CRT9) encodes thymidylate synthase (EC 2.1.1.45), a homodimeric enzyme that catalyses
  the reductive methylation of dUMP to dTMP with 5,10-methylene-tetrahydrofolate as the one-carbon donor and reductant,
  releasing 7,8-dihydrofolate. It is the only de novo source of thymidylate, which is phosphorylated to dTTP by
  Cdc8p and Ynk1p, and it is required for both nuclear and mitochondrial DNA synthesis. The cell-cycle mutant cdc21
  is a temperature-sensitive allele of TMP1. Like tmp1 mutants it lacks thymidylate synthase activity and is a thymidylate
  auxotroph at the restrictive temperature. CDC21 transcription peaks just before S phase and depends on MluI cell-cycle
  box (MCB) elements and Swi6. The protein fractionates with nuclei and localises to the nuclear periphery. It is
  inhibited by FdUMP, the active form of 5-fluorouracil, and its dihydrofolate product is recycled to THF by Dfr1p.
