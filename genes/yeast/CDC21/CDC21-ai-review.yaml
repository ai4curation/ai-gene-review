core_functions:
- description: 'Thymidylate synthase: reductive methylation of dUMP to dTMP using 5,10-methylene-THF as both C1
    donor and reductant (yielding dihydrofolate); the sole de novo source of thymidylate for nuclear and mitochondrial
    DNA replication. The enzyme is associated with the nuclear periphery.'
