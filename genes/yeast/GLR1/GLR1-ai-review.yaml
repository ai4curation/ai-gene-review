  review:
    summary: Greetham et al. 2010 co-overexpressed the glutaredoxin system (Grx1 plus Glr1) and observed increased
      protein glutathionylation (GSSP), concluding that glutaredoxins are not general deglutathionylases; Glr1 was
      included to recycle GSSG and lowered GSSG levels. Glr1 does not catalyse protein glutathionylation; any effect
      on GSSP is indirect via the glutathione redox state, and the readout is attributed to Grx1.
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect effect of a co-overexpressed system; the protein performing (de)glutathionylation is not Glr1.
    supported_by:
    - reference_id: PMID:20074363
      supporting_text: overexpression of the glutaredoxin system resulted in an approximate 66% increases in GSSP
        levels, confirming that glutaredoxins do not act as general deglutathionylases in vivo.
    - reference_id: PMID:20074363
      supporting_text: GSSG levels were significantly lowered by the glutaredoxin system presumably due to the activity
        of Glr1.
