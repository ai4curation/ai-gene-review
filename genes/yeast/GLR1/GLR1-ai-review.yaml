gene_symbol: GLR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Glutathione reductase (EC 1.8.1.7) of Saccharomyces cerevisiae, a homodimeric FAD-containing flavoprotein
  disulfide oxidoreductase of the class-I pyridine nucleotide-disulfide oxidoreductase family. Glr1 uses NADPH to
  reduce glutathione disulfide (GSSG) to two molecules of reduced glutathione, maintaining a highly reducing GSH:GSSG
  ratio. Alternative translation initiation produces a mitochondrial isoform (with an N-terminal presequence) and
  a cytosolic isoform; GFP studies also detect nuclear signal and a minor Pex5-dependent peroxisomal pool. Glr1
  is the main cytosolic GSSG-reducing system, with thioredoxin Trx2 and glutaredoxin Grx2 as backups and Ycf1-mediated
  vacuolar sequestration of excess GSSG. GLR1 expression is Yap1-dependent and rises in stationary phase; glr1 mutants
  are sensitive to H2O2.
