gene_symbol: GLR1
organism: yeast
uniprot_id: P41921
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the reduction of glutathione disulfide (GSSG) to reduced glutathione
    (GSH). Constitutes the major mechanism to maintain a high GSH:GSSG ratio in the
    cytosol.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41921
  source_id: P41921
- source: Alliance_Imported
  text: Cytosolic and mitochondrial glutathione oxidoreductase; converts oxidized
    glutathione to reduced glutathione; cytosolic Glr1p is the main determinant of
    the glutathione redox state of the mitochondrial intermembrane space; mitochondrial
    Glr1p has a role in resistance to hyperoxia; also detected in peroxisomes; protein
    abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLR1
  source_id: SGD:S000006012
- source: Alliance_Automated
  text: Enables glutathione-disulfide reductase (NADPH) activity. Involved in several
    processes, including cell redox homeostasis; glutathione metabolic process; and
    protein glutathionylation. Located in cytosol; nucleus; and peroxisome. Used to
    study limb-girdle muscular dystrophy. Human ortholog(s) of this gene implicated
    in chronic obstructive pulmonary disease; congenital nonspherocytic hemolytic
    anemia 10; and macular degeneration. Orthologous to human GSR (glutathione-disulfide
    reductase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLR1
  source_id: SGD:S000006012
