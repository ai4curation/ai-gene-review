    - rubric: specificity
      score: 4
    overall_notes: 'Correct: cytosolic and mitochondrial glutathione reductase, peroxisomal
      pool. Adds the intermembrane-space redox role of the cytosolic form and hyperoxia
      resistance of the mitochondrial form, which the review does not cover.'
- source: Alliance_Automated
  text: Enables glutathione-disulfide reductase (NADPH) activity. Involved in several
    processes, including cell redox homeostasis; glutathione metabolic process; and
    protein glutathionylation. Located in cytosol; nucleus; and peroxisome. Used to
    study limb-girdle muscular dystrophy. Human ortholog(s) of this gene implicated
    in chronic obstructive pulmonary disease; congenital nonspherocytic hemolytic
    anemia 10; and macular degeneration. Orthologous to human GSR (glutathione-disulfide
    reductase).
  source_type: automated
