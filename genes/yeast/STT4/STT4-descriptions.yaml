descriptions:
- source: UniProt
  text: Acts on phosphatidylinositol (PI) in the first committed step in the production
    of the second messenger inositol 1,4,5,- trisphosphate. STT4 functions in PKC1
    protein kinase pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P37297
