    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: PI phosphorylation and the PKC1 pathway are right, but calling
      it the first step in IP3 production is a dated framing. Does not mention PtdIns4P,
      PIK patches or Mss4.
- source: Alliance_Imported
  text: Phosphatidylinositol-4-kinase; functions in Pkc1p protein kinase pathway;
    required for normal vacuole morphology, cell wall integrity, and actin cytoskeleton
    organization; required for autophagosome-vacuole fusion during autophagy and for
    lipophagy in stationary phase cells and during nitrogen starvation; localizes
    to cortical endoplasmic reticulum membrane and endoplasmic reticulum-plasma membrane
    contact site
  source_type: curated
  url: https://www.yeastgenome.org/locus/STT4
