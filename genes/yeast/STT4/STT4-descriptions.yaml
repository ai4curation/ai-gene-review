gene_symbol: STT4
organism: yeast
uniprot_id: P37297
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acts on phosphatidylinositol (PI) in the first committed step in the production
    of the second messenger inositol 1,4,5,- trisphosphate. STT4 functions in PKC1
    protein kinase pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P37297
  source_id: P37297
- source: Alliance_Imported
  text: Phosphatidylinositol-4-kinase; functions in Pkc1p protein kinase pathway;
    required for normal vacuole morphology, cell wall integrity, and actin cytoskeleton
    organization; required for autophagosome-vacuole fusion during autophagy and for
    lipophagy in stationary phase cells and during nitrogen starvation; localizes
    to cortical endoplasmic reticulum membrane and endoplasmic reticulum-plasma membrane
    contact site
  source_type: curated
  url: https://www.yeastgenome.org/locus/STT4
  source_id: SGD:S000004296
- source: Alliance_Automated
  text: Enables 1-phosphatidylinositol 4-kinase activity. Involved in several processes,
    including autophagosome-lysosome fusion; microlipophagy; and regulation of fungal-type
    cell wall organization. Located in endoplasmic reticulum-plasma membrane contact
    site and plasma membrane. Human ortholog(s) of this gene implicated in cerebellar
    hypoplasia; hereditary spastic paraplegia 84; and intestinal atresia. Orthologous
    to several human genes including PI4KA (phosphatidylinositol 4-kinase alpha).
  source_type: automated
  url: https://www.yeastgenome.org/locus/STT4
  source_id: SGD:S000004296
