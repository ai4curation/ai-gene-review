    overall_notes: 'Correct: PI4K in the Pkc1 pathway, required for vacuole morphology,
      cell wall integrity, actin and autophagy, at ER-PM contact sites. Matches the
      review.'
- source: Alliance_Automated
  text: Enables 1-phosphatidylinositol 4-kinase activity. Involved in several processes,
    including autophagosome-lysosome fusion; microlipophagy; and regulation of fungal-type
    cell wall organization. Located in endoplasmic reticulum-plasma membrane contact
    site and plasma membrane. Human ortholog(s) of this gene implicated in cerebellar
    hypoplasia; hereditary spastic paraplegia 84; and intestinal atresia. Orthologous
    to several human genes including PI4KA (phosphatidylinositol 4-kinase alpha).
  source_type: automated
