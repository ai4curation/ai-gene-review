id: P37297
gene_symbol: STT4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Stt4 is the large (1900 aa) essential type III phosphatidylinositol 4-kinase of Saccharomyces cerevisiae,
  orthologous to mammalian PI4KIIIalpha (PI4KA). It phosphorylates phosphatidylinositol at the D-4 position to produce
  PtdIns4P (EC 2.7.1.67) at the plasma membrane, where it is assembled into cortical 'PIK patches' with the scaffold
  Ypp1 (TTC7 homolog) and the membrane anchor Efr3, concentrated at ER-plasma membrane contact sites. The Stt4 pool
  of PtdIns4P is converted by Mss4 to PtdIns(4,5)P2, which recruits Rom2 and activates the Rho1-Pkc1 cell wall integrity
  MAP kinase cascade; it is also counter-regulated in trans by the ER phosphatase Sac1. Stt4 is required for actin
  cytoskeleton organisation, vacuole morphology, cell wall integrity and autophagy, and is a target of wortmannin.
  Stt4 and Golgi Pik1 together produce nearly all cellular PtdIns4P but do not substitute for each other.
