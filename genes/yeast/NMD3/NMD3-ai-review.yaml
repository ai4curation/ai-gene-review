id: P38861
gene_symbol: NMD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 60S ribosomal export protein NMD3 is an essential protein required for
  cytoplasmic assembly and nuclear export of the 60S ribosomal subunit. Functions
  as a Crm1-dependent export adapter that binds nascent 60S particles and mediates
  their transport through nuclear pore complexes. Essential for ribosome biogenesis.
core_functions:
- molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  description: NMD3 functions as a critical adapter protein that recruits the Crm1p
    export receptor to 60S ribosomal subunits, bridging the nascent 60S subunit to
    the nuclear export machinery via its leucine-rich NES motif
  directly_involved_in:
  - id: GO:0000055
    label: ribosomal large subunit export from nucleus
  locations:
  - id: GO:0005654
    label: nucleoplasm
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11086007
    supporting_text: Nmd3p is a Crm1p-dependent adapter protein for nuclear export
      of the large ribosomal subunit.
  - reference_id: PMID:11313466
    supporting_text: Nuclear export of 60s ribosomal subunits depends on Xpo1p and
      requires a nuclear export sequence-containing factor, Nmd3p.
  - reference_id: file:yeast/NMD3/NMD3-deep-research-falcon.md
    supporting_text: Falcon literature synthesis supports Nmd3 as the conserved Crm1/Xpo1-dependent
      60S ribosomal export adaptor.
- molecular_function:
    id: GO:0070180
    label: large ribosomal subunit rRNA binding
  description: NMD3 directly contacts 25S rRNA at multiple helix positions (H38, H69,
    H89) within the inter-subunit face of 60S particles, forming stable complexes
    with nascent and mature subunits
  directly_involved_in:
  - id: GO:0000055
    label: ribosomal large subunit export from nucleus
  supported_by:
  - reference_id: PMID:24240281
    supporting_text: binding sites, which were found to lie in H38, H69 and H89 of
      25S rRNA
  - reference_id: PMID:11105761
    supporting_text: Nmd3p forms a stable complex with free 60S subunits.
  - reference_id: file:interpro/panther/PTHR12746/PTHR12746-metadata.yaml
    supporting_text: PANTHER PTHR12746 is the conserved NMD3 family.
existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Correctly identifies nuclear localization. IBA annotation is based on
      phylogenetic inference and is supported by experimental evidence showing NMD3
      shuttles between nucleus and cytoplasm.
    action: ACCEPT
    reason: NMD3 is explicitly documented in the literature as a shuttling protein
      that mediates nuclear export processes. The primary mapping places the functional
      nuclear localization signal (NLS) at aa 387-435 and the leucine-rich nuclear
      export signal (NES; INIDELLDEL) at aa 491-500.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000297338
        source_label: PTN000297338
        source_status: SUPPORTS_TRANSFER
        comment: The eukaryotic NMD3 ancestral node correctly captures conserved nuclear
          localization for a shuttling 60S-export adaptor.
    supported_by:
    - reference_id: PMID:11086007
      supporting_text: We show here that Nmd3p shuttles
    - reference_id: PMID:11313466
      supporting_text: Nmd3p shuttles between the nucleus and cytoplasm and is exported
        by the nuclear export receptor Xpo1p
  qualifier: is_active_in
