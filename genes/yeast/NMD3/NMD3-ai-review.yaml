    label: protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: Very broad annotation. NMD3 is specifically involved in ribosomal subunit
      transport, not general protein transport.
    action: MODIFY
    reason: While technically correct that NMD3 is involved in "protein transport"
      (as 60S is a protein complex), this term is too general and loses the critical
      specificity of the function. NMD3 is specifically involved in ribosomal subunit
      export, not general protein transport. Should be replaced with more specific
      term for 60S export.
    proposed_replacement_terms:
    - id: GO:0000055
      label: ribosomal large subunit export from nucleus
    additional_reference_ids:
