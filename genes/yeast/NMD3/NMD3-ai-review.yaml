    action: ACCEPT
    reason: UniProt-based IEA annotation is supported by functional studies showing
      NMD3 associates with nucleoplasmic pre-60S particles and is required for late
      nucleoplasmic maturation steps. Sequential late pre-60S work places Nmd3
