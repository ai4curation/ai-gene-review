suggested_questions:
- question: Should NMD3's rRNA-binding and adaptor activities both be retained as
    core molecular functions, or should the annotation emphasize adaptor activity
    as the primary function?
suggested_experiments:
- description: Separate rRNA-binding from Crm1 recruitment by targeted Nmd3 NES and
    rRNA-contact mutants, then quantify effects on pre-60S export and cytosolic maturation.
