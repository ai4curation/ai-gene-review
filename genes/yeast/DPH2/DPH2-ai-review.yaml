- description: Non-catalytic [4Fe-4S] subunit of the Dph1-Dph2 ACP-histidine synthase; its cluster is
    required for electron delivery from Dph3/Cbr1/NADH to the catalytic Dph1 cluster, so Dph2 contributes
    to the first step of diphthamide biosynthesis.
