suggested_questions:
- question: Does the Dph2 cluster relay electrons from Dph3 to the Dph1 cluster directly, and is the Dph2-eEF2
    contact seen in interactome screens the substrate-recruitment interface?
suggested_experiments:
- hypothesis: Electrons from reduced Dph3 enter through the Dph2 cluster
  description: Stopped-flow EPR/Mossbauer of Dph1-Dph2 wild type versus Dph2 cluster-less mutant with
    reduced Dph3 to follow cluster redox states over time.
  experiment_type: spectroscopy
