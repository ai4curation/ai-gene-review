gene_symbol: DPH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'DPH2 (YKL191W) encodes the second paralogous subunit of the 2-(3-amino-3-carboxypropyl)histidine
  synthase (Dph1-Dph2 heterodimer) that performs the first step of diphthamide biosynthesis on translation
  elongation factor 2 (eEF2): radical-type cleavage of S-adenosylmethionine and transfer of the 3-amino-3-carboxypropyl
  group to His699. Dph2 is homologous to the archaeal Dph2 homodimeric enzyme and binds its own [4Fe-4S]
  cluster through conserved cysteines, but in the eukaryotic heterodimer the Dph2 cluster is not catalytic;
  it is required for the physiological Dph3(KTI11)/Cbr1/NADH system to reduce the catalytic cluster in
  Dph1. Both subunits are required in vivo and neither substitutes for the other. dph2 nulls are viable
  but lack diphthamide and resist diphtheria toxin and sordarin; human DPH2 loss-of-function variants
  cause a diphthamide-deficiency developmental disorder, and such variants fail to complement in yeast.
  Dph2 is cytoplasmic.'
