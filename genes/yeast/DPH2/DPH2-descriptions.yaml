gene_symbol: DPH2
organism: yeast
uniprot_id: P32461
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for the first step of diphthamide biosynthesis, a post-translational
    modification of histidine which occurs in elongation factor 2 (PubMed:24422557,
    PubMed:27694803, PubMed:31463593, PubMed:32576952, PubMed:34154323, PubMed:8406038).
    DPH1 and DPH2 transfer a 3-amino-3-carboxypropyl (ACP) group from S-adenosyl-L-
    methionine (SAM) to a histidine residue, the reaction is assisted by a reduction
    system comprising KTI11/DPH3 and a NADH-dependent reductase, predominantly CBR1
    (PubMed:24422557, PubMed:27694803, PubMed:31463593, PubMed:34154323, PubMed:8406038).
    Facilitates the reduction of the catalytic iron-sulfur cluster found in the DPH1
    subunit (PubMed:31463593).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32461
  source_id: P32461
- source: Alliance_Imported
  text: Protein required for synthesis of diphthamide; required along with Dph1p,
    Kti11p, Jjj3p, and Dph5p; diphthamide is a modified histidine residue of translation
    elongation factor 2 (Eft1p or Eft2p); forms a complex with Dph1p that catalyzes
    the first step of diphthamide biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/DPH2
  source_id: SGD:S000001674
- source: Alliance_Automated
  text: Enables 4 iron, 4 sulfur cluster binding activity. Contributes to 2-(3-amino-3-carboxypropyl)histidine
    synthase activity. Involved in protein histidyl modification to diphthamide. Located
    in cytoplasm. Part of 2-(3-amino-3-carboxypropyl)histidine synthase complex. Used
    to study diphthamide deficiency syndrome. Human ortholog(s) of this gene implicated
    in diphthamide deficiency syndrome 2. Orthologous to human DPH2 (diphthamide biosynthesis
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DPH2
  source_id: SGD:S000001674
