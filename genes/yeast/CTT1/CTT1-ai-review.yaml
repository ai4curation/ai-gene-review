id: P06115
gene_symbol: CTT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Catalase T, the cytosolic monofunctional heme catalase (EC 1.11.1.6) of Saccharomyces cerevisiae. Ctt1
  is a homotetramer that dismutates hydrogen peroxide to water and oxygen in the cytosol. Unlike its paralog Cta1
  (peroxisomal catalase A) it lacks a peroxisomal targeting signal. CTT1 expression is stress-inducible, and cytosolic
  catalase activity is induced by reactive nitrogen species in flavohemoglobin- or GSNOR-deficient cells and can
  degrade peroxynitrite in vitro. Loss of both catalases increases oxidative protein damage.
