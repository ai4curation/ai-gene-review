  review:
    summary: A conserved positioning domain in Gcn4 mediates interaction of its target loci with the nuclear pore
      complex and interchromosomal clustering.
    action: MODIFY
    reason: The entity relocated to the nuclear periphery is the bound chromosomal locus, not Gcn4 protein (Gcn4
      is nuclear regardless). The finding is better represented as chromosome attachment to the nuclear envelope
      (GO:0097240), with Gcn4 tethering its target loci to the NPC. Kept peripheral to the core activator function.
    proposed_replacement_terms:
