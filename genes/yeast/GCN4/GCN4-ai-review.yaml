      label: chromosome attachment to the nuclear envelope
    supported_by:
    - reference_id: PMID:31211995
      supporting_text: A conserved "positioning domain" within Gcn4 controls interaction with the NPC and inter-chromosomal
        clustering and promotes transcription of target genes.
