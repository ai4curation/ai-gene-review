core_functions:
- description: Sequence-specific bZIP activator. As a homodimer Gcn4 binds GCREs in RNA polymerase II promoters
    of amino acid and purine biosynthetic genes and activates their transcription when its translation is induced
    by nutrient starvation.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0034198
    label: cellular response to amino acid starvation
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:3907851
    supporting_text: GCN4 protein binds specifically to the 20 bp region of the HIS3 gene that is critical for transcriptional
      regulation in vivo and contains the TGACTC sequence common to coregulated genes.
  - reference_id: PMID:3678204
    supporting_text: demonstrating that GCN4 binds DNA as a dimer
- description: Coactivator recruitment. The acidic activation domains bind Mediator through multiple activator-binding
    domains of Gal11/Med15 in a fuzzy complex, and also engage SAGA and other coactivators, recruiting TBP and RNA
    polymerase II to assemble the preinitiation complex.
  molecular_function:
    id: GO:0036033
    label: mediator complex binding
  directly_involved_in:
  - id: GO:0045899
    label: positive regulation of RNA polymerase II transcription preinitiation complex assembly
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19940160
    supporting_text: We further demonstrate that Gcn4 binds to the Gal11 KIX domain directly
  - reference_id: PMID:15121833
    supporting_text: We find that mutations in subunits of these coactivators reduce the recruitment of TATA binding
      protein (TBP) and RNA polymerase II (Pol II) by Gcn4p at ARG1, ARG4, and SNZ1, implicating all five coactivators
      in PIC assembly at Gcn4p target genes.
suggested_questions:
- question: Is GO:1990139 protein localization to nuclear periphery the intended term for the Gcn4 positioning domain
    (PMID:31211995), given that the relocated entity is the target chromosomal locus? Would a gene-positioning or
    chromosome attachment to the nuclear envelope term fit better?
- question: Which features distinguish the roughly 40% of promoter-bound Gcn4 sites that activate transcription
    from those that do not (PMID:29628310)?
suggested_experiments:
- hypothesis: Gcn4 represses ribosomal protein genes directly through Rap1 binding rather than indirectly through
    competition for coactivators.
  description: Map the Rap1-binding surface on Gcn4, introduce point mutations that abolish Rap1 binding while preserving
    DNA binding and Gal11 binding, and measure ribosomal protein gene transcription, Esa1 occupancy and histone
    H4 acetylation during amino acid starvation.
