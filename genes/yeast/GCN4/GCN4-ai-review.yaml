id: P03069
gene_symbol: GCN4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Gcn4 is the bZIP transcriptional activator of the general amino acid control in Saccharomyces cerevisiae,
  the fungal counterpart of the ATF4 effector of the integrated stress response. It binds DNA as a leucine-zipper
  homodimer at the pseudo-palindromic GCN4 response element ATGA(C/G)TCAT, mostly in nucleosome-depleted promoters
  but also within coding sequences. Its expression is controlled mainly at the translational level: four uORFs in
  the GCN4 mRNA leader keep translation low when amino acids are plentiful, and when Gcn2 phosphorylates eIF2alpha
  during amino acid, purine or carbon limitation, scanning ribosomes bypass the inhibitory uORFs and translate GCN4.
  Gcn4 is imported into the nucleus (Srp1/Kap95) and is unstable there, turned over after Pcl5-Pho85 phosphorylation
  and SCF(Cdc4) ubiquitylation. Its acidic N-terminal and central activation domains recruit Mediator (through Gal11/Med15),
  SAGA, SWI/SNF and TFIID to promote preinitiation complex assembly, inducing amino acid and purine biosynthetic
  genes, transporters and other stress genes. It also represses some genes, notably ribosomal protein genes by binding
  Rap1, and a positioning domain tethers its target loci to nuclear pores.'
