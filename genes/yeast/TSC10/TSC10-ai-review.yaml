  label: Saccharomyces cerevisiae S288C
description: 'Tsc10 (YBR265W) is the 3-ketosphinganine (3-ketodihydrosphingosine) reductase of Saccharomyces cerevisiae,
  a short-chain dehydrogenase/reductase (SDR) family enzyme that catalyses the second step of de novo sphingolipid
  synthesis: NADPH-dependent reduction of 3-ketosphinganine, produced by serine palmitoyltransferase, to sphinganine
  (dihydrosphingosine) (EC 1.1.1.102). Tsc10 is an integral endoplasmic reticulum membrane protein with two C-terminal
  transmembrane segments and an N-terminal catalytic domain facing the cytoplasm. TSC10 is essential unless cells
  are supplied with dihydrosphingosine or phytosphingosine. The enzyme is functionally replaced by the topologically
  distinct human ortholog KDSR (FVT1). Tsc10 has also been detected on lipid droplets.'
