gene_symbol: TSC10
organism: yeast
uniprot_id: P38342
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the reduction of 3'-oxosphinganine (3- ketodihydrosphingosine/KDS)
    to sphinganine (dihydrosphingosine/DHS), the second step of de novo sphingolipid
    biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38342
  source_id: P38342
- source: Alliance_Imported
  text: 3-ketosphinganine reductase; catalyzes the second step in phytosphingosine
    synthesis; essential for growth in the absence of exogenous dihydrosphingosine
    or phytosphingosine; localized to lipid droplets; member of short chain dehydrogenase/reductase
    protein family; mutations in human homolog KDSR cause recessive progressive symmetric
    erythrokeratoderma
  source_type: curated
  url: https://www.yeastgenome.org/locus/TSC10
  source_id: SGD:S000000469
- source: Alliance_Automated
  text: Enables 3-dehydrosphinganine reductase activity. Involved in sphingolipid
    biosynthetic process. Located in endoplasmic reticulum membrane and lipid droplet.
    Used to study erythrokeratodermia variabilis et progressiva 4. Human ortholog(s)
    of this gene implicated in erythrokeratodermia variabilis et progressiva 4 and
    follicular lymphoma. Orthologous to human KDSR (3-ketodihydrosphingosine reductase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TSC10
  source_id: SGD:S000000469
