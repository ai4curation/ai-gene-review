suggested_questions:
- question: Should GO provide a specific cellular component term for the sterol C-4 demethylation complex (Erg25/Erg26/Erg27
    tethered by Erg28), so that the complex need not be annotated with the generic "catalytic complex"?
- question: Is the 75 kDa Erg25-reactive species and plasma-membrane immunostaining reported by Li and Kaplan 1996
    a genuine Erg25 form?
