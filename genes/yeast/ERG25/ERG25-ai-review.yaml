id: P53045
gene_symbol: ERG25
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG25 (YGR060W) encodes the C-4 methylsterol oxidase (sterol-C4-methyl oxidase, SMO), a non-heme di-iron
  oxygenase of the fatty acid hydroxylase/sterol desaturase family with three histidine boxes and a C-terminal KKXX
  ER-retrieval signal. Using O2 and electrons supplied by cytochrome b5, it oxidises the 4alpha-methyl group of
  4,4-dimethylzymosterol (and, in the second round, of 4alpha-methylzymosterol) through alcohol and aldehyde to
  the 4alpha-carboxylic acid, the first of three reactions of each C-4 demethylation round. The carboxy sterol is
  then decarboxylated by Erg26 and the 3-keto product reduced by Erg27; Erg25, Erg26 and Erg27 associate on the
  ER membrane with the scaffold Erg28. ERG25 is essential; erg25 mutants are ergosterol auxotrophs that accumulate
  4,4-dimethylzymosterol, and its iron requirement links sterol synthesis to iron status.
