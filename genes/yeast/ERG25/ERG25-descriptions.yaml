  text: Enables C-4 methylsterol oxidase activity. Involved in ergosterol biosynthetic
    process. Located in endoplasmic reticulum membrane and plasma membrane. Part of
    catalytic complex. Human ortholog(s) of this gene implicated in microcephaly.
