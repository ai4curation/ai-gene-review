gene_symbol: IMD2
organism: yeast
uniprot_id: P38697
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the conversion of inosine 5'-phosphate (IMP) to xanthosine 5'-phosphate
    (XMP), the first committed and rate-limiting step in the de novo synthesis of
    guanine nucleotides, and therefore plays an important role in the regulation of
    cell growth. In contrast to the other IMPDH alleles IMD3 and IMD4, the enzymatic
    activity of IMD2 seems to be intrinsically drug resistant.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38697
  source_id: P38697
- source: Alliance_Imported
  text: Inosine monophosphate dehydrogenase; catalyzes the rate-limiting step in GTP
    biosynthesis, expression is induced by mycophenolic acid resulting in resistance
    to the drug, expression is repressed by nutrient limitation; IMD2 has a paralog,
    YAR073W/YAR075W, that arose from a segmental duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/IMD2
  source_id: SGD:S000001259
- source: Alliance_Automated
  text: Enables chromatin binding activity. Predicted to be involved in GTP biosynthetic
    process. Located in chromatin and cytoplasm. Human ortholog(s) of this gene implicated
    in Leber congenital amaurosis 11; retinitis pigmentosa; and retinitis pigmentosa
    10. Orthologous to several human genes including IMPDH1 (inosine monophosphate
    dehydrogenase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IMD2
  source_id: SGD:S000001259
