  review:
    summary: Electronic telomeric-region location inferred from the subtelomeric heterochromatin formation
      annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO_REF:0000108 infers this location from the process annotation to subtelomeric heterochromatin
      formation. No study has placed Sas4, or any SAS-I subunit, at telomeres: Heise et al. and others
      could not detect Sas2 at telomeres or in ORFs by ChIP. SAS-I acetylates H4K16 genome-wide, mostly
      within ORFs, and its telomeric effect arises because H4K16 acetylation limits SIR spreading; that
