id: Q04003
gene_symbol: SAS4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Sas4 (Something about silencing 4, YDR181C) is a non-catalytic subunit of SAS-I, the histone
  acetyltransferase complex of budding yeast formed by the MYST-family catalytic subunit Sas2, Sas4 and
  the YEATS-domain protein Sas5. The native complex is a trimer with one copy of each subunit, in which
  Sas4 is the central subunit that bridges Sas2 and Sas5. Recombinant Sas2 is active only in the presence
  of Sas4. SAS-I acetylates histone H4 on lysine 16 (and H3 lysine 14 in vitro), acting mainly on free
  histones with only weak activity on nucleosomes, and supplies about 60 percent of cellular H4K16 acetylation.
  Depletion of Sas4 lowers bulk H4K16 acetylation to the level of sas2 null cells and prevents the rise
  of H4K16 acetylation in newly replicated chromatin. SAS-I interacts with the histone deposition factors
  Asf1 and CAF-I, and its H4K16 acetylation opposes Sir2-dependent deacetylation, limiting the spreading
  of SIR heterochromatin from telomeres and the silent mating-type loci. Accordingly sas4 mutants lose
  silencing at HML and telomeres, restore silencing at an HMR locus with a defective silencer, and allow
  silencing to spread past the HMR boundary. Sas4 is nuclear and enters the nucleus independently of Sas2
  and Sas5. It has predicted coiled-coil regions and a C-terminal Sas4 domain with a cullin-homology signature,
  and no known catalytic domain.
