core_functions:
- description: Central non-catalytic subunit of the SAS-I histone acetyltransferase. Sas4 bridges the
    MYST catalytic subunit Sas2 and the accessory subunit Sas5, and Sas2 is active only with Sas4 present.
    Within the complex it contributes to acetylation of histone H4 lysine 16, mainly on free or newly
    deposited histones; in vivo Sas4 is needed for bulk H4K16 acetylation and for its deposition in newly
    replicated chromatin. This acetylation opposes Sir2 and limits the spreading of SIR heterochromatin
    at telomeres and the silent mating-type loci.
