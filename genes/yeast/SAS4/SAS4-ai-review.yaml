  review:
    summary: Chromatin location from the SAS complex identification paper (Osada et al.).
    action: KEEP_AS_NON_CORE
    reason: 'The cited paper (Osada et al. 2001; full text PMC312835) contains no chromatin fractionation
      or ChIP experiment for any Sas protein; its one chromatin-related test showed that the SAS-Asf1
      interaction is not mediated by DNA or chromatin. Other evidence for a chromatin location is indirect
      but consistent: Sas4 co-purifies in modified chromatin immunopurification (mChIP) screens that enrich
      DNA-bound proteins (PMID:21179020), SAS-I is thought to be recruited to newly replicated DNA through
      CAF-I, and Sas4 is needed for H4K16 acetylation to appear in chromatin at replication. ChIP has
      never detected Sas2 at telomeres or ORFs, so any association is likely transient. The core activity
      prefers free histones, so chromatin is kept as a non-core location. The reference problem is recorded
      as a source defect.'
