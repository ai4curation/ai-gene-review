        at telomeric heterochromatin
    - reference_id: PMID:34014972
      supporting_text: The absence of SAS-I causes inappropriate spreading of the SIR complex and gene
        silencing in subtelomeric regions.
    - reference_id: file:yeast/SAS4/SAS4-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Heterochromatin spreading downstream of the silent mating-type locus HMR.
    source_defects:
