- term:
    id: GO:0004402
    label: histone acetyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002212692
  - SGD:S000002589
  review:
    summary: PAINT IBA from the fungal Sas4 family node, seeded by SAS4 itself.
    action: MODIFY
    reason: 'PAINT placed this IBD at PTN002212692, the node that covers Sas4 orthologs in Saccharomycotina
      and Pezizomycotina, with Sas4''s own experimental annotation as the seed, so the placement is sound
      and Sas4 legitimately appears in its own WITH/FROM. The problem is the claim it carries, inherited
      from the seed: Sas4 has no acetyltransferase domain; the catalytic subunit of SAS-I is the MYST-family
      acetyltransferase Sas2. Sutton et al. reconstituted the complex and showed that recombinant Sas2
      is active only when Sas4 is present, and Sas4 depletion in vivo lowers bulk H4K16 acetylation to
      the sas2 null level. The claim is therefore that Sas4 contributes to the activity of the complex,
      not that it enables it; the qualifier error is recorded as a source defect. The activity of the
      complex is site-specific: the native trimer acetylates H4 lysine 16 exclusively in vitro and is
      needed for bulk H4K16 acetylation in vivo; H3 lysine 14 acetylation was seen with the recombinant
      complex in one study and is not established in vivo. Histone acetyltransferase activity is correct
      but general, so the row is modified to histone H4K16 acetyltransferase activity, to be read as contributes_to.'
