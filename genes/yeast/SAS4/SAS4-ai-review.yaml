knowledge_gaps:
- gap_statement: How Sas4 makes Sas2 catalytically active is not known.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Recombinant Sas2 has no detectable activity without Sas4, but no structure of Sas4 or
    of the SAS-I trimer exists and the Sas2-Sas4 interface has not been mapped. Sas4 could activate Sas2
    allosterically, stabilise its fold, or present the histone substrate; telling these apart would explain
    why the complex prefers free histones to nucleosomes.
  provenance:
  - *id003
  - reference_id: file:yeast/SAS4/SAS4-deep-research-claude-code.md
    supporting_text: The mechanism by which Sas4 activates Sas2 is unknown.
- gap_statement: The route by which Sas4 enters the nucleus is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Sas2 and Sas5 are imported by the karyopherins Kap123 and Pse1, but Sas4 is not a substrate
    of either and its predicted NLS is dispensable, so the subunits may be imported separately and assemble
    in the nucleus. Where SAS-I assembles bears on whether it can act on newly synthesized histones before
    they reach chromatin.
  provenance:
  - reference_id: PMID:15788653
    supporting_text: Sas4p was not a substrate of Kap123p or Pse1p, suggesting that the nuclear import
      of the SAS-I subunits occurred independently of each other
  - *id019
