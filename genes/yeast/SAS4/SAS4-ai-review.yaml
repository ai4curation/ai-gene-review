- term:
    id: GO:0031509
    label: subtelomeric heterochromatin formation
  evidence_type: IDA
  original_reference_id: PMID:11731479
  qualifier: involved_in
  review:
    summary: Subtelomeric heterochromatin formation, from the SAS complex identification paper.
    action: MODIFY
    reason: 'Sas4 is needed for telomeric and HML silencing (Xu et al. 1999), but the mechanism is that
      SAS-I opposes heterochromatin: H4K16 acetylation by SAS-I counteracts Sir2 deacetylation and Sir3
      binding, and in its absence SIR proteins spread from about 3 kb to about 15 kb from the telomere
      and repress adjacent genes. The loss of silencing at telomere-proximal reporters is explained by
      this redistribution. SAS-I therefore sets the boundary of subtelomeric heterochromatin rather than
      forming it, and sas4 null alleles also restore silencing at a defective HMR and let silencing spread
      past the HMR boundary. In GO, heterochromatin boundary formation is part_of heterochromatin formation,
      so the existing term is not wrong, but the informative term is heterochromatin boundary formation
      (no subtelomere-specific boundary term exists). The cited paper tested telomeric silencing only
      in sas2 mutants; the Sas4 evidence is in PMID:10471697.'
    proposed_replacement_terms:
    - &id015
      id: GO:0033696
      label: heterochromatin boundary formation
    supported_by:
    - &id011
      reference_id: PMID:10471697
      supporting_text: This study revealed that SAS4 and SAS5 contribute to silencing at HML and the telomeres,
        indicating that SAS4 and SAS5 are positive regulators of silencing at these loci.
    - reference_id: PMID:12379856
      supporting_text: In a sas2Delta strain or a phenocopy Lys16Arg mutant, Sir3p spreads from roughly
