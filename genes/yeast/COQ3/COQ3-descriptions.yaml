gene_symbol: COQ3
organism: yeast
uniprot_id: P27680
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: O-methyltransferase required for two non-consecutive steps during ubiquinone
    biosynthesis (By similarity) (PubMed:10419476). Catalyzes the 2 O-methylation
    of 3,4-dihydroxy-5-(all-trans- hexaprenyl)benzoic acid into 4-hydroxy-3-methoxy-5-(all-trans-
    hexaprenyl)benzoic acid (By similarity) (PubMed:10419476). Also catalyzes the
    last step of ubiquinone biosynthesis by mediating methylation of 3-demethylubiquinone
    into ubiquinone (By similarity). Also able to mediate the methylation of 3-demethylubiquinol-6
    into ubiquinol-6 (PubMed:10419476).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P27680
  source_id: P27680
- source: Alliance_Imported
  text: O-methyltransferase; catalyzes two different O-methylation steps in ubiquinone
    (Coenzyme Q) biosynthesis; component of a mitochondrial ubiquinone-synthesizing
    complex; phosphoprotein
  source_type: curated
  url: https://www.yeastgenome.org/locus/COQ3
  source_id: SGD:S000005456
- source: Alliance_Automated
  text: Enables 3-demethylubiquinol 3-O-methyltransferase activity and polyprenyldihydroxybenzoate
    methyltransferase activity. Involved in ubiquinone biosynthetic process. Located
    in mitochondrial inner membrane. Is extrinsic component of mitochondrial inner
    membrane. Orthologous to human COQ3 (coenzyme Q3, methyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/COQ3
  source_id: SGD:S000005456
