descriptions:
- source: UniProt
  text: O-methyltransferase required for two non-consecutive steps during ubiquinone
    biosynthesis (By similarity) (PubMed:10419476). Catalyzes the 2 O-methylation
    of 3,4-dihydroxy-5-(all-trans- hexaprenyl)benzoic acid into 4-hydroxy-3-methoxy-5-(all-trans-
    hexaprenyl)benzoic acid (By similarity) (PubMed:10419476). Also catalyzes the
    last step of ubiquinone biosynthesis by mediating methylation of 3-demethylubiquinone
    into ubiquinone (By similarity). Also able to mediate the methylation of 3-demethylubiquinol-6
    into ubiquinol-6 (PubMed:10419476).
  source_type: curated
