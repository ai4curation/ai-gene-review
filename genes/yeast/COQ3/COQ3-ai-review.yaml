gene_symbol: COQ3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'COQ3 (YOL096C) encodes the S-adenosyl-L-methionine-dependent O-methyltransferase of coenzyme
  Q6 (ubiquinone) biosynthesis in Saccharomyces cerevisiae, a member of the UbiG/COQ3 family of class
  I SAM-dependent methyltransferases. A single Coq3 polypeptide catalyses both, non-consecutive, ring
  O-methylation steps of the pathway: methylation of 3,4-dihydroxy-5-hexaprenylbenzoate (DHHB) to 4-hydroxy-3-methoxy-5-hexaprenylbenzoate
  (EC 2.1.1.114), and the final step, methylation of 3-demethylubiquinol-6 (demethyl-Q6) to ubiquinol-6
  (EC 2.1.1.64). The protein is imported into mitochondria and is peripherally associated with the matrix
  face of the inner membrane, where it is a member of the multi-subunit Coq polypeptide complex (CoQ synthome)
  organised around Coq4 together with Coq5, Coq6, Coq7 and Coq9; its stability and association with the
  complex depend on the other Coq proteins and on the Coq8 kinase-like protein, which promotes its phosphorylation.
  coq3 null mutants lack Q6 and cannot grow on non-fermentable carbon sources.'
