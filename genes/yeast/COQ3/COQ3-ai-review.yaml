suggested_questions:
- question: Is the physiological substrate of the final Coq3 step 3-demethylubiquinol-6 or 3-demethylubiquinone-6,
    and how is the redox state of the intermediate controlled in the CoQ synthome?
- question: SGD/GOA lack a cellular-component annotation of yeast Coq3 to GO:0110142 ubiquinone biosynthesis
    complex, although human COQ5/COQ6 carry it and yeast Coq3 co-purifies with Coq4 and co-elutes with
    the CoQ synthome; should this be added?
suggested_experiments:
