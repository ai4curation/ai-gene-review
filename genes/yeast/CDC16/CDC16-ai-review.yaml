- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21186364
  qualifier: enables
  supporting_entities:
  - UniProtKB:P53068
  review:
    summary: >-
      Buschhorn et al. 2011 used site-specific photo-crosslinking on budding-yeast APC/C lacking endogenous
      Doc1 and found that Doc1 crosslinks to Cdc27, Cdc16 and Apc1: Doc1 residues S128, K129 and R182
      crosslink specifically to Cdc16, while the Doc1 IR tail (F244) crosslinks to Cdc27. Subunit tagging
      and EM placed Doc1 above Apc1, to the right of Cdc16 and below Cdc27, next to the Apc2-Apc11 catalytic
      module, and showed that substrates bind a bipartite receptor formed by the coactivator and Doc1.
    action: MODIFY
    reason: >-
      The interaction is directly demonstrated and structurally meaningful, but bare protein binding does
      not say what it does. Doc1 is the processivity factor that, with the coactivator, forms the APC/C
      substrate receptor (the ubiquitin ligase-substrate adaptor role), and Cdc16 is the TPR-lobe subunit
      that Doc1 contacts on one side and that, with Cdc23 and Cdc27, holds the coactivator: APC/C purified
      from cdc16-deleted cells binds no Cdh1 and has no measurable activity (PMID:16481473). Cdc16 therefore
      brings the substrate-receptor module (coactivator plus Doc1) together with the Apc2-Apc11 catalytic
      core, which is the definition of ubiquitin ligase complex scaffold activity (GO:0160072); this is
      the same replacement used for the coactivator/Doc1 contacts of human CDC27 and for the cullin scaffold.
      The interaction itself is not disputed.
    proposed_replacement_terms:
    - id: GO:0160072
      label: ubiquitin ligase complex scaffold activity
    additional_reference_ids:
    - PMID:16481473
    supported_by:
    - reference_id: PMID:21186364
      supporting_text: >-
        Doc1–S128amber and Doc1–K129amber, which are located in the C–terminal region of Doc1, and Doc1–R182amber,
        which is located on the back side of Doc1, formed crosslink products with Cdc16.
      reference_section_type: RESULTS
    - reference_id: PMID:21186364
      supporting_text: >-
        In crosslinking experiments we identified Cdc27, Cdc16 and Apc1 as binding partners of Doc1.
      reference_section_type: DISCUSSION
    - reference_id: PMID:21186364
      supporting_text: >-
        Our results suggest that substrates are recruited to the APC/C by binding to a bipartite substrate
        receptor composed of a coactivator protein and Doc1.
      reference_section_type: ABSTRACT
    - reference_id: PMID:16481473
      supporting_text: Complexes from cdc16 Δ and cdc23 Δ strains also showed no Cdh1 interaction.
      reference_section_type: RESULTS
    - reference_id: PMID:16481473
      supporting_text: >-
        Perhaps an interaction between the Doc1 IR domain and the TPR domain of Cdc16 creates a link between
        the two APC subcomplexes
      reference_section_type: DISCUSSION
