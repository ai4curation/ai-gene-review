- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:16481473
  qualifier: involved_in
  review:
    summary: >-
      ComplexPortal NAS attached to the whole APC/C (CPX-756) from the architectural study of Thornton
      et al. 2006. The APC/C ubiquitinates securin and the mitotic cyclins, triggering the metaphase-to-anaphase
      transition and exit from mitosis; APC/C lacking Cdc16 has no activity.
    action: MODIFY
    reason: >-
      The assertion is correct but too general: 'regulation of mitotic cell cycle' covers everything from
