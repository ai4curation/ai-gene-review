- term:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002649387
  - UniProtKB:Q9UJX3
  review:
    summary: >-
      PAINT node PTN002649387 propagates enzyme-substrate adaptor activity across the APC TPR-subunit
      family from a single seed, human ANAPC7. Cdc16 does not read substrate degrons: D-box and KEN-box
      recognition is performed by the coactivator WD40 domain together with Doc1/Apc10, and Cdc16 is the
      TPR-lobe subunit that is contacted by Doc1 and is required, with Cdc23 and Cdc27, for the coactivator
      to bind the complex.
    action: MODIFY
    reason: >-
      The IBA is treated as a considered node judgment and the underlying biology (Cdc16 couples the substrate-recruiting
      module to the ligase) is sound, but the term is misplaced for Cdc16: an enzyme-substrate adaptor
      brings the enzyme its substrate, which for the APC/C is the coactivator (annotated on yeast Cdh1
      and Cdc20 as GO:1990756) together with Doc1. Cdc16 instead provides the docking scaffold that holds
      those adaptors on the catalytic core, with cdc16-deleted APC/C binding no Cdh1 and having no activity;
      that is the definition of ubiquitin ligase complex scaffold activity (GO:0160072), the same replacement
      applied to the ANAPC7-seeded IBA on human CDC27. Whether an ANAPC7 seed justifies an adaptor term
      for the whole family is raised in suggested_questions.
    proposed_replacement_terms:
    - id: GO:0160072
      label: ubiquitin ligase complex scaffold activity
    additional_reference_ids:
    - PMID:16481473
    - PMID:21186364
    supported_by:
    - reference_id: PMID:21186364
