suggested_questions:
- question: >-
    PAINT node PTN002649387 propagates enzyme-substrate adaptor activity (GO:0140767) to the whole APC
    TPR-subunit family from a single ANAPC7 seed. Given that yeast Cdc16 contacts Doc1 and the other TPR
    subunits rather than substrate degrons, should the node carry ubiquitin ligase complex scaffold activity
    (GO:0160072) instead, and is there any evidence that ANAPC7 alone recruits substrates?
  experts: []
- question: >-
    Is the origin re-firing reported for cdc16-ts arrests (PMID:9660930) a direct consequence of losing
    APC/C-dependent proteolysis of a specific replication regulator, or an indirect effect of the prolonged
    high-Cdc28 arrest, and does it justify annotating Cdc16 to negative regulation of DNA replication
    initiation?
  experts:
  - Roberts JM
  - Heichman KA
- question: >-
    Which Cdc28 phosphorylation sites on Cdc16 itself (as opposed to the combined Cdc16/Cdc23/Cdc27 phospho-site
    mutants) are required for APC/C-Cdc20 activation, and do they act by recruiting Cks1-Cdk1 to the TPR
    lobe as proposed for human APC3?
  experts:
  - Morgan DO
  - Toczyski DP
suggested_experiments:
- hypothesis: >-
    The essential contribution of Cdc16 to APC/C activity is structural (holding Cdc27 and Cdc26 in the
    TPR lobe and enabling coactivator docking) rather than direct binding of the coactivator IR tail,
    so a Cdc16 variant that retains Cdc27/Cdc26 incorporation but loses the Doc1 contact surface should
    give a processivity defect resembling doc1 deletion.
  description: >-
    Map the Cdc16 residues crosslinked by Doc1 S128/K129/R182 onto the yeast APC/C cryo-EM model, generate
    surface point mutants at the endogenous locus in the pds1 clb5 SIC1-10X background, verify TPR-lobe
    integrity by Apc1-TAP purification and silver staining, and compare Cdh1 binding, Doc1 occupancy and
    Pds1 ubiquitination processivity (single-encounter assays) with wild-type and doc1-deleted complexes.
  experiment_type: structure-guided mutagenesis with in vitro APC/C activity and processivity assays
- hypothesis: >-
    Re-replication in cdc16-ts arrests depends on the stabilisation of a specific APC/C substrate and
    is not a general property of losing APC/C activity.
  description: >-
    Compare origin re-firing (2D gels, density transfer) in cdc16-ts, cdc23-ts, cdc27-ts and apc2-ts arrests
    at matched times after shift, in the presence and absence of overexpressed Sic1 or of non-degradable
    Clb2 and Clb5, to test whether re-initiation tracks a particular stabilised substrate or the length
    of the high-Cdc28 arrest.
  experiment_type: comparative genetics with replication-origin analysis
