- description: >-
    As a Cdc28/Cdk1-phosphorylated TPR subunit, Cdc16 (with Cdc23 and Cdc27) constitutes the phospho-regulated
    platform through which mitotic CDK activity switches on APC/C-Cdc20: phosphorylation of the TPR module
    is required for Cdc20-dependent ubiquitination of securin and cyclins at anaphase onset, while Cdh1-dependent
    G1 activity is largely phosphorylation independent. No dedicated GO molecular-function term exists
    for this phospho-dependent activation role, so it is recorded as a contribution to the ligase activity.
