core_functions:
- description: >-
    Cdc16 forms the middle element of the APC/C TPR lobe (Cdc23-Cdc16-Cdc27, stabilised by Cdc26, Swm1/Apc13
    and Apc9), providing the docking platform on which the substrate-receptor module, the coactivator
    (Cdc20, Cdh1 or Ama1) plus Doc1/Apc10, is held against the Apc2-Apc11 catalytic module, so that Pds1/securin,
    Clb2 and other D-box/KEN-box substrates are ubiquitinated and degraded at the metaphase/anaphase transition
    and through mitotic exit.
