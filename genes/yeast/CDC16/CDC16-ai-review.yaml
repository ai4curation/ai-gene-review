  review:
    summary: >-
      Heichman and Roberts 1998 (abstract-only in the cache) report that cdc16 temperature-sensitive mutants,
      arrested in a G2-like state with high Cdc28 kinase activity, re-initiate DNA synthesis from normal
      chromosomal origins (2D gels, density transfer) in a Cdc6- and Mcm5-dependent manner, and conclude
      that CDC16 is required to prevent inappropriate origin firing. The paper is written explicitly in
      contradiction to Pichler et al. 1997, who attributed the extra DNA in cdc16 mutants to mitochondrial
      DNA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The phenotype is a genuine SGD IMP and is not dismissed, but the annotation places Cdc16 as a participant
      in negative regulation of replication initiation on the strength of necessity evidence alone: no
      APC/C substrate or mechanism connecting Cdc16 to origin licensing was identified, the observation
      is contested in the literature (the abstract itself records the conflict with Pichler et al. 1997),
      the re-replication occurs in an arrest with high Cdc28 activity that is paradoxical under the accepted
      licensing model, and the effect has not been reproduced as a general property of APC/C loss. It
      most plausibly reflects an indirect consequence of prolonged APC/C failure rather than a distinct
      Cdc16 function, so it is flagged as a likely over-annotation and excluded from the core functions;
      the reference is marked DISPUTED.
