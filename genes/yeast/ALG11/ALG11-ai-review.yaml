core_functions:
- description: Adds the fourth and fifth (alpha-1,2-linked) mannoses from GDP-mannose to Man3GlcNAc2-PP-dolichol
    on the cytoplasmic face of the ER, completing the Man5GlcNAc2-PP-Dol intermediate before its translocation
    to the lumen.
