suggested_questions:
- question: Is Alg11 activity on Man4GlcNAc2-PP-Dol dependent on its association with Alg1, i.e. does
    the Alg1-Alg11 complex alter Alg11 substrate specificity or processivity?
suggested_experiments:
- description: Compare kinetics of purified Alg11 alone versus Alg1-Alg11 co-purified complex on Man3-
    and Man4GlcNAc2-PP-Dol substrates.
