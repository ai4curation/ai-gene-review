id: P53954
gene_symbol: ALG11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ALG11 encodes the GDP-Man:Man3GlcNAc2-PP-Dol alpha-1,2-mannosyltransferase (EC 2.4.1.131)
  of S. cerevisiae, an ER membrane protein of glycosyltransferase family GT4. On the cytoplasmic face
  of the ER it adds two sequential alpha-1,2-linked mannoses from GDP-mannose, converting Man3GlcNAc2-PP-Dol
  to Man4- and then Man5GlcNAc2-PP-Dol, the last cytosolic intermediate of the N-glycan precursor before
  it is flipped into the ER lumen for extension by Dol-P-Man- and Dol-P-Glc-dependent enzymes. Alg11p
  associates with Alg1p in a mannosyltransferase complex distinct from the Alg1-Alg2 complex. alg11 deletion
  causes poor growth, temperature sensitivity and transfer of truncated glycans lacking the lower-arm
  alpha-1,2-mannoses; its activity depends on the conserved EX7E motif.
