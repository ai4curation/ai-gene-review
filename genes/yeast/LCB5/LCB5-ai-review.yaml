id: Q06147
gene_symbol: LCB5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lcb5 is the minor sphingoid long-chain-base kinase of Saccharomyces cerevisiae, a paralog of Lcb4 (53%
  identity) from the whole-genome duplication. It phosphorylates dihydrosphingosine and phytosphingosine (and sphingosine
  in vitro) at C-1 using ATP, but contributes only about 3% of cellular LCB kinase activity; most of its activity
  is soluble, with a minor pool associated with Golgi membranes. Unlike Lcb4 it is not required for ceramide synthesis
  from exogenous long-chain bases. Lcb5 contributes to the LCB-1-phosphate pools that rise transiently during heat
  stress, and lcb5 mutants are somewhat less able to acquire thermotolerance; together with Lcb4 it is required
  for LCB-1-P-triggered Ca2+ influx.
