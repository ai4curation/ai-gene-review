core_functions:
- description: Minor (~3%) sphingoid long-chain-base kinase, paralog of Lcb4; phosphorylates dihydrosphingosine
    and phytosphingosine to their 1-phosphates, largely from a soluble/Golgi-associated pool; contributes to LCB-1-P
    pools relevant to heat-stress resistance.
