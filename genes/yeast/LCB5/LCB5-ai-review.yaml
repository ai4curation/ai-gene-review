suggested_questions:
- question: Does Lcb5 have a distinct physiological niche (e.g. heat-stress LCB-1-P synthesis) not covered by Lcb4,
    given its minor share of total activity?
suggested_experiments:
- description: Express LCB5 from the LCB4 promoter in an lcb4 deletion and test whether it restores ceramide salvage
    and heat-stress LCB-1-P responses.
