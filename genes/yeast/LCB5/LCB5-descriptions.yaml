descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of the sphingoid long chain bases dihydrosphingosine
    (DHS or sphinganine) and phytosphingosine (PHS) to form dihydrosphingosine 1-phosphate
    (DHS-1P) and phytosphingosine 1-phosphate (PHS-1P) respectively (PubMed:11102354,
    PubMed:12493772, PubMed:25345524, PubMed:9677363). Redundant to LCB4, is only
    responsible for few percent of the total activity (PubMed:9677363). Involved in
    the biosynthesis of sphingolipids and ceramides (PubMed:25345524, PubMed:9677363).
    Involved in heat-induced transient cell cycle arrest (PubMed:11056159). Accumulation
    of phosphorylated sphingoid long chain bases (LCBPs) stimulates calcium influx
    and activates calcineurin signaling (PubMed:11102354, PubMed:11278643). Involved
    in heat-stress resistance (PubMed:11056159).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06147
  source_id: Q06147
- source: Alliance_Imported
  text: Minor sphingoid long-chain base kinase; possibly involved in synthesis of
    long-chain base phosphates, which function as signaling molecules; LCB5 has a
    paralog, LCB4, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/LCB5
  source_id: SGD:S000004250
- source: Alliance_Automated
  text: Enables sphingosine kinase activity. Involved in calcium-mediated signaling;
    response to heat; and sphingolipid metabolic process. Located in Golgi membrane.
    Human ortholog(s) of this gene implicated in type 2 diabetes mellitus. Orthologous
    to human SPHK1 (sphingosine kinase 1).
