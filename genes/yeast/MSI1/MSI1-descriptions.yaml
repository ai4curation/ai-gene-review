gene_symbol: MSI1
organism: yeast
uniprot_id: P13712
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acts as a component of the histone chaperone complex chromatin assembly factor
    1 (CAF-1), which assembles histone octamers onto DNA during replication and repair
    (PubMed:9030687). CAF-1 performs the first step of the nucleosome assembly process,
    bringing newly synthesized histones H3 and H4 to replicating DNA; histones H2A/H2B
    can bind to this chromatin precursor subsequent to DNA replication to complete
    the histone octamer (By similarity). Plays a role in the maintenance of heterochromatin
    (By similarity). Independently, MSI1 is involved in regulation of the RAS/cAMP
    pathway via sequestration of NPR1 (PubMed:11238915).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13712
  source_id: P13712
- source: Alliance_Imported
  text: Subunit of chromatin assembly factor I (CAF-1); chromatin assembly by CAF-1
    affects multiple processes including silencing at telomeres, mating type loci,
    and rDNA; maintenance of kinetochore structure; deactivation of DNA damage checkpoint
    after DNA repair; chromatin dynamics during transcription; and repression of divergent
    noncoding transcription; Msi1p localizes to nucleus and cytoplasm and independently
    regulates the RAS/cAMP pathway via sequestration of Npr1p kinase
  source_type: curated
  url: https://www.yeastgenome.org/locus/MSI1
  source_id: SGD:S000000399
- source: Alliance_Automated
  text: Contributes to histone binding activity. Involved in DNA replication-dependent
    chromatin assembly. Located in cytoplasm and nucleus. Part of CAF-1 complex and
    nucleosome.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MSI1
  source_id: SGD:S000000399
