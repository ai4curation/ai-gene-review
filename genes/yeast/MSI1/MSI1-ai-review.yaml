  title: Falcon deep research report for MSI1
  findings: []
core_functions:
- description: Msi1/Cac3 is the WD40 small subunit of CAF-1, binding the Cac1 scaffold and supporting
    (but not forming) the H3-H4 binding interface; as part of CAF-1 it is required in vivo for replication-coupled
    chromatin assembly functions such as telomeric silencing.
  contributes_to_molecular_function:
    id: GO:0000510
    label: H3-H4 histone complex chaperone activity
  directly_involved_in:
  - id: GO:0006335
    label: DNA replication-dependent chromatin assembly
  in_complex:
    id: GO:0033186
    label: CAF-1 complex
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9030687
    supporting_text: The gene encoding the p50 subunit of yeast CAF-I (CAC3) is similar to the human p48
      CAF-I subunit and was identified previously as MSI1
  - reference_id: PMID:28418026
    supporting_text: Cac2 is indispensable for productive histone binding, while deletion of Cac3 has
      only moderate effects on H3-H4 binding and nucleosome assembly.
  - reference_id: PMID:30239791
    supporting_text: In fact, the yeast Cac3 exhibits no interaction with H3–H4, even at micromolar concentrations
      in vitro (63), and Cac3 is not required for robust histone binding in the context of CAF-1 (62).
  - reference_id: PMID:9030687
    supporting_text: Deletion of CAC genes also strongly reduces silencing of genes adjacent to telomeric
      DNA
proposed_new_terms: []
suggested_questions:
- question: What does Msi1/Cac3 contribute to yeast CAF-1 given that it binds H3-H4 weakly if at all and
    is only moderately required for assembly in vitro, yet cac3 deletion phenocopies cac1 and cac2 for
    silencing?
- question: Is the CAF-1-independent Msi1-Npr1 interaction relevant at endogenous Msi1 levels, or only
    upon overexpression, and does it justify a signalling annotation?
- question: Do the other yeast RbAp48-family paralogs (Hat2, Ume1, Wtm1/2) partition the ancestral complex
    memberships, and should the PAINT Rpd3L assertion be restricted to the Ume1 subclade?
suggested_experiments:
- description: Compare nascent-chromatin H3-H4 deposition and silencing in cac3 deletion versus Cac1 mutants
    that specifically lose Cac3 binding, and test whether Cac3 affects CAF-1 stability or PCNA association.
  experiment_type: genetic
  hypothesis: Cac3 stabilizes or regulates CAF-1 in vivo rather than contributing directly to histone
    binding.
