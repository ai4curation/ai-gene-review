- term:
    id: GO:0042393
    label: histone binding
  evidence_type: IDA
  original_reference_id: PMID:16503640
  qualifier: contributes_to
  review:
    summary: MSI1 as a contributor to histone binding by CAF-1, based on co-purification of CAF-1 with
      histones H3 and H4 from yeast cells.
    action: KEEP_AS_NON_CORE
    reason: The contributes_to qualifier correctly frames this as an activity of the complex. However,
      recombinant yeast Cac3 binds H3-H4 weakly or not detectably on its own (reports differ) and is not
      required for robust histone binding by CAF-1; the histone-binding site is formed by the Cac1 acidic
      region together with Cac2. MSI1's contribution to histone binding is therefore at most accessory.
      Retained as non-core because the complex-level statement is true, but it should not be taken as
      evidence that Msi1 is a histone-binding module in yeast CAF-1 (unlike the metazoan RbAp48/p55 orthologs).
    supported_by:
    - reference_id: PMID:16503640
      supporting_text: we have purified a complex containing CAF-1 and H3 and H4 from yeast cells
    - reference_id: PMID:30239791
      supporting_text: In fact, the yeast Cac3 exhibits no interaction with H3–H4, even at micromolar
        concentrations in vitro (63), and Cac3 is not required for robust histone binding in the context
        of CAF-1 (62).
    - reference_id: PMID:28315523
      supporting_text: On CAF-1, the H3-H4 binding site is formed by the acidic region of Cac1 (Liu et
        al., 2016), in conjunction with Cac1-bound Cac2 (Mattiroli et al., 2017).
