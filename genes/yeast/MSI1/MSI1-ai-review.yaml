id: P13712
gene_symbol: MSI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MSI1 (CAC3) encodes Msi1/Cac3, a WD40-repeat protein of the RbAp46/48 (p48) family that is
  the small subunit of chromatin assembly factor 1 (CAF-1), the heterotrimeric H3-H4 histone chaperone
  (Cac1-Cac2-Cac3) that deposits newly synthesized H3-H4 onto DNA during replication and repair. Msi1
  binds the large subunit Cac1; unlike its metazoan orthologs, yeast Msi1 binds H3-H4 weakly or not detectably
  on its own and is only moderately required for histone binding and nucleosome assembly by CAF-1 in vitro,
  although msi1/cac3 deletion gives the same telomeric and HM-locus silencing defects and UV sensitivity
  as loss of the other subunits. Msi1 is found in both nucleus and cytoplasm. It was first identified
  as a multicopy suppressor of RAS-cAMP pathway hyperactivation (ira1, RAS2-Val19); this suppression is
  independent of CAF-1 and involves association with and sequestration of the cytoplasmic kinase Npr1.
