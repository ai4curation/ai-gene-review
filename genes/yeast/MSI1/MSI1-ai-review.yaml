    id: GO:0070210
    label: Rpd3L-Expanded complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN001110151
  - PomBase:SPAC29A4.18
  review:
    summary: Phylogenetic inference that MSI1 is part of the Rpd3L-Expanded complex.
    action: REMOVE
    reason: The node (PTN001110151) groups the yeast RbAp48-like WD40 paralogs (Msi1, Hat2, Ume1, Wtm1,
      Wtm2) with S. pombe Prw1; the Rpd3L assertion rests on Ume1 (and Prw1 for the Clr6 complex). In
      S. cerevisiae the WD40 subunit of Rpd3L is Ume1, which is shared between Rpd3L and Rpd3S, and the
      GO definitions of both GO:0033698 and GO:0070210 name Ume1p, not Msi1p, among the budding-yeast
      subunits. Msi1 has been purified as the small subunit of CAF-1 and has a separate CAF-1-independent
      cytoplasmic role; it is not reported in Rpd3L purifications. The complex membership is a paralog-specific
      property (Ume1) that does not transfer to Msi1.
    supported_by:
    - *id009
    - *id007
    additional_reference_ids:
    - PMID:16286007
