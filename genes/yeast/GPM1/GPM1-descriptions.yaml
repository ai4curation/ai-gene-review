descriptions:
- source: UniProt
  text: Interconversion of 3- and 2-phosphoglycerate with 2,3- bisphosphoglycerate
    as the primer of the reaction. Can also catalyze the reaction of EC 5.4.2.4 (synthase),
    but with a reduced activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00950
  source_id: P00950
- source: Alliance_Imported
  text: Tetrameric phosphoglycerate mutase; mediates the conversion of 3-phosphoglycerate
    to 2-phosphoglycerate during glycolysis and the reverse reaction during gluconeogenesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPM1
  source_id: SGD:S000001635
- source: Alliance_Automated
  text: Enables phosphoglycerate mutase activity. Involved in gluconeogenesis and
    glycolytic process. Located in cytosol; mitochondrial intermembrane space; and
    mitochondrial outer membrane. Human ortholog(s) of this gene implicated in familial
    erythrocytosis 8; glycogen storage disease X; and myoglobinuria. Orthologous to
    several human genes including PGAM1 (phosphoglycerate mutase 1) and PGAM2 (phosphoglycerate
    mutase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GPM1
  source_id: SGD:S000001635
