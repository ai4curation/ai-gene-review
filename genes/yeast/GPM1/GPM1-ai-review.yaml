  label: Saccharomyces cerevisiae S288C
description: 'Cofactor (2,3-bisphosphoglycerate)-dependent phosphoglycerate mutase (dPGM; EC 5.4.2.11) of Saccharomyces cerevisiae,
  a highly abundant homotetrameric enzyme of the histidine-phosphatase superfamily that reversibly interconverts 3-phosphoglycerate
  and 2-phosphoglycerate via a phospho-histidine (His8) intermediate, with His181 acting as general acid/base. It catalyses
  step 8 of glycolysis and the reverse step in gluconeogenesis and is the sole phosphoglycerate mutase supporting both pathways:
  gpm1 deletion mutants cannot grow on glucose and require a mixture of glycerol and ethanol. It also has very low 2,3-bisphosphoglycerate
  synthase and phosphatase side activities. Gpm1 is predominantly cytosolic, with a fraction associated with the mitochondrial
  outer surface and recovered in mitochondrial intermembrane-space preparations.'
