  label: Saccharomyces cerevisiae S288C
description: Homoserine O-acetyltransferase (EC 2.3.1.31; MetX family, alpha/beta-hydrolase fold) of Saccharomyces
  cerevisiae. Met2 transfers the acetyl group of acetyl-CoA to L-homoserine, forming O-acetyl-L-homoserine and committing
  homoserine to the methionine branch rather than to threonine. The product is sulfhydrylated by Met17 to homocysteine.
  The enzyme is specific for L-homoserine and acetyl-CoA (succinyl-CoA is not a donor), its synthesis is repressed
  by methionine, and met2 mutants are methionine auxotrophs. Met2 is cytoplasmic.
