- source: Alliance_Automated
  text: Enables 1-phosphatidylinositol-3-phosphate 5-kinase activity and phosphatidylinositol-3-phosphate
    binding activity. Involved in phosphatidylinositol phosphate biosynthetic process.
    Located in endosome membrane and fungal-type vacuole membrane. Part of PAS complex.
    Human ortholog(s) of this gene implicated in Fleck corneal dystrophy. Orthologous
    to human PIKFYVE (phosphoinositide kinase, FYVE-type zinc finger containing).
