descriptions:
- source: UniProt
  text: The PI(3,5)P2 regulatory complex regulates both the synthesis and turnover
    of phosphatidylinositol 3,5-bisphosphate (PtdIns(3,5)P2). Catalyzes the phosphorylation
    of phosphatidylinositol 3-phosphate on the fifth hydroxyl of the myo-inositol
    ring, to form phosphatidylinositol 3,5-bisphosphate (PubMed:16492811, PubMed:9811604).
    Required for endocytic-vacuolar pathway and nuclear migration (PubMed:16492811,
    PubMed:9751732, PubMed:9811604). The product of the reaction, PI(3,5)P2 is an
    important regulator of vacuole homeostasis perhaps by controlling membrane flux
    to and/or from the vacuole (PubMed:9763421, PubMed:9811604). PI(3,5)P2 regulates
    the transition between trans-SNARE complex formation and vacuole membrane fusion
    (PubMed:30427760). Hyperosmotic shock-induced increase in the levels of PtdIns(3,5)P2
    requires the presence of VAC7, VAC14, and/or FIG4 (PubMed:16492811).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34756
  source_id: P34756
- source: Alliance_Imported
  text: 1-phosphatidylinositol-3-phosphate 5-kinase; vacuolar membrane kinase that
    generates phosphatidylinositol (3,5)P2, which is involved in vacuolar sorting
    and homeostasis
  source_type: curated
  url: https://www.yeastgenome.org/locus/FAB1
