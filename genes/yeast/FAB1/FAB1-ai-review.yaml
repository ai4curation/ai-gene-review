core_functions:
- description: 'PI3P 5-kinase: phosphorylates PtdIns(3)P to PtdIns(3,5)P2 on the vacuole and endosome membranes,
    acting within the Vac14-Fig4 (PAS) regulatory complex; the only source of PI(3,5)P2 in yeast.'
