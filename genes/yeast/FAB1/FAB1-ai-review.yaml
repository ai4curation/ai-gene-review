id: P34756
gene_symbol: FAB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FAB1 (SVL7) encodes the sole phosphatidylinositol 3-phosphate 5-kinase of budding yeast (PIKfyve orthologue,
  EC 2.7.1.150). This ~257 kDa peripheral membrane protein has an N-terminal FYVE zinc finger that binds PI3P, a
  central chaperonin-like (CCT) domain that binds the scaffold Vac14, and a C-terminal PIP kinase domain that phosphorylates
  PI3P on the 5-position to make PI(3,5)P2. Fab1 acts on the limiting membrane of the vacuole and on endosomal membranes
  as part of the Vac14-nucleated PI(3,5)P2 regulatory complex with the opposing phosphatase Fig4, the activator
  Vac7 and Atg18. fab1 mutants lack PI(3,5)P2 and have grossly enlarged, poorly acidified vacuoles and temperature-sensitive
  growth; Fab1-generated PI(3,5)P2 rises sharply on hyperosmotic shock and controls vacuole size, membrane recycling/fission
  and MVB sorting.
