suggested_questions:
- question: How does Vac14/Fig4 binding to the Fab1 CCT domain relieve the autoinhibition imposed by the conserved
    cysteine-rich domain, and is this the step targeted by hyperosmotic activation?
suggested_experiments:
- hypothesis: Osmotic activation of Fab1 requires conformational release of the CCR-kinase domain intramolecular
    contact within the assembled complex
  description: Compare in vitro PI3P 5-kinase activity of Fab1 purified alone, with Vac14-Fig4, and with Vac7, from
    unstressed versus hyperosmotically shocked cells; combine with crosslinking-MS of the CCR-kinase interface.
  experiment_type: biochemistry / structural proteomics
