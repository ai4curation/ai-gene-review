- source: Alliance_Automated
  text: Enables calmodulin binding activity; chromatin binding activity; and protein
    kinase activity. Involved in several processes, including cellular response to
    osmotic stress; positive regulation of transcription by RNA polymerase II; and
    regulation of cell cycle process. Located in cytoplasm and nucleus. Human ortholog(s)
    of this gene implicated in several diseases, including abdominal aortic aneurysm;
    carcinoma (multiple); chronic mucocutaneous candidiasis; colorectal cancer (multiple);
    and intestinal benign neoplasm (multiple). Orthologous to several human genes
    including MAPK12 (mitogen-activated protein kinase 12) and MAPK13 (mitogen-activated
    protein kinase 13).
