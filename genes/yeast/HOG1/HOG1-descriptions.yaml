descriptions:
- source: UniProt
  text: Proline-directed serine/threonine-protein kinase involved in a signal transduction
    pathway that is activated by changes in the osmolarity of the extracellular environment
    (PubMed:10198063, PubMed:10970855, PubMed:11230135, PubMed:11796711, PubMed:12743037,
    PubMed:14680476, PubMed:16321140, PubMed:16896207, PubMed:17220467, PubMed:17346711,
    PubMed:17363249, PubMed:38270553, PubMed:7523111, PubMed:8662716, PubMed:8943326).
    Controls osmotic regulation of transcription via the stress response element (STRE)
    in promoters of target genes (PubMed:11336700, PubMed:7523111). Upon osmotic shock,
    associates with the SKO1-SSN6-TUP1 complex, phosphorylates SKO1, and converts
    it into an activator that subsequently recruits Swi/Snf and SAGA complexes (PubMed:11230135,
    PubMed:12086627, PubMed:17429070). Activates the SMP1 transcription factor and
    the RCK2 kinase, both also involved in the regulation of the expression of a subset
    of osmotic stress-related genes (PubMed:10805732, PubMed:12482976). Phosphorylation
    of HSL1 by HOG1 leads to a G2 arrest essential for cell survival at high osmolarity
    (PubMed:16688223). Also mediates cell-cycle arrest in G1 phase by the dual targeting
    of SIC1 (PubMed:15448699). Phosphorylates methyltransferase DOT1 at least on 'Ser-565'
    and 'Thr- 576' (PubMed:38270553). Regulates MFA2 ARE-mediated translation in response
    to carbon source (PubMed:16260593). Targets RPD3 histone deacetylase to osmoresponsive
    promoters to induce gene expression on stress (PubMed:14737171). Required for
    the Golgi apparatus localization of MNN1 (PubMed:9817752). Plays an essential
    role in maintaining water homeostasis, arsenite detoxification, copper-resistance,
    cold- resistance, hydrogen peroxide response, adaptation to citric acid stress,
    and repression of the mating pathway activity (PubMed:11136466, PubMed:11922108,
    PubMed:15060153, PubMed:15177185, PubMed:15773992, PubMed:16371351, PubMed:16790423,
    PubMed:16857590, PubMed:16885417, PubMed:16920868, PubMed:9744864). Functions
    as an arsenic sensor and effector via direct binding to arsenic and subsequent
    phosphorylation of the ARR1 transcription factor (PubMed:31772124).
