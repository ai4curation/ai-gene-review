- source: Alliance_Imported
  text: Mitogen-activated protein kinase involved in osmoregulation; controls global
    reallocation of RNAPII during osmotic shock; mediates recruitment/activation of
    RNAPII at Hot1p-dependent promoters; binds calmodulin; stimulates antisense transcription
    to activate CDC28; defines novel S-phase checkpoint with Mrc1p that prevent replication/transcription
    conflicts; nuclear form represses pseudohyphal growth; autophosphorylates; protein
    abundance increases under DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/HOG1
