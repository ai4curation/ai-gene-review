- term:
    id: GO:0001100
    label: negative regulation of exit from mitosis
  evidence_type: IDA
  original_reference_id: PMID:32265285
  qualifier: involved_in
  review:
    summary: Hog1 phosphorylates the nucleolar Cdc14 inhibitor Net1 and delays mitotic exit when cells
      are osmostressed in metaphase (Tognetti et al. 2020).
    action: KEEP_AS_NON_CORE
    reason: Direct, well-supported experimental annotation (in vitro and in vivo Net1 phosphorylation,
      nonphosphorylatable Net1 mutant reduces viability). Hog1 carries out the regulatory step itself
      by phosphorylating Net1, so the regulation annotation is appropriate. It is one of several stress-coupled
      cell-cycle checkpoints downstream of Hog1 rather than the core osmosignaling function, so kept as
      non-core.
    supported_by:
    - &id019
      reference_id: PMID:32265285
      supporting_text: Here we show that Hog1 delays mitotic exit when cells are stressed during metaphase.
    - &id001
      reference_id: PMID:32265285
      supporting_text: Hog1 phosphorylates Net1 on T62 and S385 in vitro and in vivo.
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IDA
  original_reference_id: PMID:24508389
  qualifier: enables
  review:
    summary: ChIP shows Hog1 associating with chromatin at stress-induced lncRNA promoters and at the
      CDC28 3' UTR / +1 nucleosome upon osmostress.
    action: KEEP_AS_NON_CORE
    reason: Hog1 is recruited to chromatin of osmostress genes (via Hot1, Sko1 and other factors) and
      ChIP supports chromatin association. Hog1 has no known DNA- or histone-binding domain, so this MF
      reflects recruitment by transcription factors rather than an intrinsic chromatin-binding activity;
      the chromatin location is better expressed as a CC. The SGD curator annotation is kept, but as non-core.
    supported_by:
    - &id014
      reference_id: PMID:24508389
      supporting_text: Therefore, Hog1 associates to and stimulates the recruitment of RNA Pol II at the
        promoters of stress-induced lncRNAs.
    - &id004
      reference_id: PMID:12743037
      supporting_text: In response to high osmolarity, Hot1 targets Hog1 to specific osmostress-responsive
        promoters.
