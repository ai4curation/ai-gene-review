suggested_questions:
- question: Is the Hog1-Hot1 interaction direct? The original two-hybrid study could not confirm it biochemically,
    yet Hot1 recruits Hog1 to promoters; which Hot1 region docks Hog1, and is the GO:0061629 binding replacement
    justified by direct binding?
- question: Should the many Hog1 substrates (Rck2, Sko1, Smp1, Hot1, Sic1, Hsl1, Mrc1, Net1, Ubp3, Dot1,
    Rgc2) be captured as has_input on the MAP kinase activity (e.g. in a GO-CAM for the HOG pathway) rather
    than as protein-binding annotations?
- question: Is the reported calmodulin binding of Hog1 physiologically relevant, and does it depend on
    Ca2+?
suggested_experiments:
- description: Analog-sensitive hog1 allele combined with quantitative phosphoproteomics after osmotic
    shock to distinguish direct Hog1 substrates from indirect Hog1-dependent phosphosites, validated by
    in vitro kinase assays.
