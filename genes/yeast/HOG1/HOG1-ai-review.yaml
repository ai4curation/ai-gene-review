id: P32485
gene_symbol: HOG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Hog1 (YLR113W) is the stress-activated, p38-type mitogen-activated protein kinase at the
  output of the high-osmolarity glycerol (HOG) pathway of Saccharomyces cerevisiae. Osmotic upshift inactivates
  the Sln1-Ypd1-Ssk1 phosphorelay (and engages the Sho1-Ste11 branch), leading via the MAPKKKs Ssk2/Ssk22
  and Ste11 to activation of the MAPKK Pbs2, which dually phosphorylates Hog1 on Thr174 and Tyr176 of
  its TGY activation loop. Active Hog1 is a proline-directed Ser/Thr kinase that acts in the cytoplasm
  (for example on the kinase Rck2 and on regulators of the Fps1 glycerol channel) and accumulates transiently
  in the nucleus, where it is recruited to osmostress-responsive promoters by transcription factors such
  as Hot1, Sko1 and Smp1, phosphorylates them, and promotes RNA polymerase II recruitment, driving induction
  of glycerol-biosynthesis and other stress genes. Hog1 also transiently delays the cell cycle during
  osmostress by phosphorylating Sic1 (G1), Mrc1 (S phase), Hsl1 (G2) and Net1 (mitotic exit), and helps
  insulate the osmostress pathway from the mating and filamentous-growth MAPK pathways. Signalling is
  terminated by the phosphatases Ptp2, Ptp3 and Ptc1-3.
