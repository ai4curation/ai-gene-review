core_functions:
- description: Mitochondrial NADPH-dependent thioredoxin reductase (EC 1.8.1.9) that reduces mitochondrial
    thioredoxin Trx3, sustaining the mitochondrial thioredoxin system (e.g. reduction of Prx1 and mitochondrial
    Gpx2) and protecting against H2O2.
