taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TRR2 (YHR106W) encodes the mitochondrial thioredoxin reductase, a paralog of cytosolic Trr1
  from the yeast whole-genome duplication. It carries an N-terminal mitochondrial transit peptide, the
  CAVC redox-active motif of low-molecular-weight thioredoxin reductases and NADPH- and FAD-binding sites.
  Recombinant Trr2 reduces thioredoxin in the insulin reduction assay, and together with the mitochondrial
  thioredoxin Trx3 it forms the mitochondrial thioredoxin system. Trr2 is located in mitochondria and
  is far less abundant than Trr1. trr2 deletion mutants are more sensitive to hydrogen peroxide, implicating
  Trr2 in mitochondrial defence against oxidative stress.
