descriptions:
- source: UniProt
  text: Acts on mitochondrial thioredoxin 3. Implicated in the defense against oxidative
    stress.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38816
  source_id: P38816
- source: Alliance_Imported
  text: Mitochondrial thioredoxin reductase; involved in protection against oxidative
    stress, required with Glr1p to maintain the redox state of Trx3p; contains active-site
    motif (CAVC) present in prokaryotic orthologs; binds NADPH and FAD; TRR2 has a
    paralog, TRR1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TRR2
  source_id: SGD:S000001148
- source: Alliance_Automated
  text: Enables thioredoxin-disulfide reductase (NADPH) activity. Involved in cellular
    response to oxidative stress. Located in mitochondrion. Orthologous to human AIFM3
    (AIF family member 3).
  source_type: automated
