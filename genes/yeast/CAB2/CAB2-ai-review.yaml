  label: Saccharomyces cerevisiae S288C
description: CAB2 (YIL083C) encodes the essential phosphopantothenoylcysteine synthetase (PPCS) of S.
  cerevisiae, which condenses (R)-4'-phosphopantothenate with L-cysteine to form 4'-phosphopantothenoylcysteine,
  the second step of CoA biosynthesis from pantothenate. The reaction proceeds via a 4'-phosphopantothenoyl-CMP
  (acyl-nucleotide) intermediate; recombinant Cab2 can use both CTP and ATP in vitro, and crystal structures
  with substrate, intermediate and product show that the cysteine amino group attacks the acyl-CMP. The
  null is complemented by the bifunctional bacterial coaBC gene. Cab2 is a cytoplasmic protein (also detected
  in nucleus in high-throughput imaging) and is a component of the ~330 kDa CoA-synthesizing protein complex
  (CoA-SPC) assembled around Cab3 together with Cab4, Cab5 and the PPCDC subunits.
