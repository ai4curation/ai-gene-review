suggested_questions:
- question: Which nucleotide (CTP or ATP) does Cab2 use in vivo? Yeast Cab2 accepts both in vitro, unlike
    human PPCS (ATP) and bacterial CoaB (CTP); the YeastPathways reaction specifies CTP.
suggested_experiments:
- description: Determine kcat/Km of Cab2 for CTP versus ATP at physiological nucleotide concentrations,
    and test complementation by nucleotide-specificity mutants.
