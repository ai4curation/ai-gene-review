gene_symbol: CAB2
organism: yeast
uniprot_id: P40506
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the first step in the biosynthesis of coenzyme A from vitamin B5,
    where cysteine is conjugated to 4'-phosphopantothenate to form 4-phosphopantothenoylcysteine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40506
  source_id: P40506
- source: Alliance_Imported
  text: 'Phosphopantothenoylcysteine synthetase (PPCS); catalyzes the second step
    of coenzyme A biosynthesis from pantothenate; subunit of the CoA-Synthesizing
    Protein Complex (CoA-SPC) that contains: Cab2p, Cab3p, Cab4p, Cab5p, Sis2p and
    Vhs3p subunits; null mutant lethality is complemented by human homolog PPCS and
    by E. coli coaBC, a bifunctional enzyme with PPCS activity'
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAB2
  source_id: SGD:S000001345
- source: Alliance_Automated
  text: Enables phosphopantothenate--cysteine ligase activity. Involved in coenzyme
    A biosynthetic process. Located in cytoplasm and nucleus. Part of CoA-synthesizing
    protein complex. Used to study cancer and dilated cardiomyopathy. Human ortholog(s)
    of this gene implicated in dilated cardiomyopathy 2C. Orthologous to human PPCS
    (phosphopantothenoylcysteine synthetase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAB2
  source_id: SGD:S000001345
