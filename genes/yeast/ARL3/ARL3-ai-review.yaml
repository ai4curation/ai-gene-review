id: Q02804
gene_symbol: ARL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  ADP-ribosylation factor-like protein 3 (Arl3p; locus YPL051W, alias ARP1) is a 198-residue
  monomeric Ras/Arf-superfamily small GTPase in Saccharomyces cerevisiae and the direct fungal
  ortholog of mammalian ARFRP1 (distinct from mammalian ciliary ARL3, which has no ortholog in
  budding yeast). Unlike Gly2-myristoylated Arf proteins, Arl3p carries an N-terminal
  Met1-Phe2 amphipathic motif (1-MFHLV-5) whose initiator methionine is co-translationally
  N-alpha-acetylated by the heterotrimeric NatC acetyltransferase complex (Mak3p/Naa30,
  Mak10p/Naa35, Mak31p/Naa38). N-terminally acetylated Arl3p binds directly to the multipass
  integral membrane receptor Sys1p on the cytoplasmic face of the late Golgi apparatus. At the
  Golgi membrane, GTP-bound Arl3p acts upstream of the small GTPase Arl1p (regulated by GEF
  Syt1p and GAP Gcs1p) to recruit the GRIP-domain golgin Imh1p and cooperate with GARP
  vesicle-tethering complexes, promoting endosome-to-Golgi and Golgi-to-vacuole hydrolase
  trafficking as well as anterograde late-Golgi-to-plasma-membrane transport of the
  GPI-anchored protein Gas1p.
