      Hand-written SGD curator description (uncited and undated in Alliance export) verified
      clause-by-clause against primary yeast studies: Ras/Arf-like GTPase identity (PMID:9920936),
      requirement for Arl1p recruitment to the Golgi (PMID:12620188, PMID:12620189),
      NatC-catalyzed N-terminal acetylation and Sys1p receptor-mediated Golgi association
      (PMID:15077113, PMID:15077114, PMID:33139728), and true 1:1 orthology to mammalian ARFRP1
