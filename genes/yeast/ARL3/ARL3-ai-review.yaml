suggested_questions:
- question: >-
    Does Sys1p-bound Arl3p directly stimulate or recruit the Arl1p GEF Syt1p onto late-Golgi
    membranes, or is an additional guanine nucleotide exchange factor required to load GTP onto
    Arl3p itself in Saccharomyces cerevisiae?
suggested_experiments:
- description: >-
    Reconstitute purified NatC-acetylated Arl3p, full-length Sys1p proteoliposomes, Syt1p, and
    myristoylated Arl1p in vitro to test whether GTP-bound Arl3p directly recruits or
    allosterically activates Syt1p-catalyzed GDP-to-GTP exchange on Arl1p.
