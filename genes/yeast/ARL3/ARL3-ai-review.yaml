- term:
    id: GO:0005829
    label: cytosol
  evidence_type: HDA
  original_reference_id: PMID:26928762
  qualifier: located_in
  review:
    summary: >-
      High-throughput N-terminal SWAT-GFP library localization to the cytosol (PMID:26928762);
      retain as non-core reflecting soluble pool / N-terminal tag interference with NatC-Sys1p
      anchoring.
    action: KEEP_AS_NON_CORE
    reason: >-
      Arl3p is a soluble protein lacking transmembrane segments that transits through the
      cytosol prior to Sys1p capture (and accumulates in the cytosol when its N-terminal
      acetylation motif is masked by an N-terminal SWAT-GFP tag in PMID:26928762 or in mak3/sys1
      mutants, PMID:15077113, PMID:15077114). Retained as non-core consistent with Reactome
      TAS GO:0005829.
    supported_by:
    - reference_id: PMID:26928762
      supporting_text: >-
        To showcase the versatility of the SWAT approach, we constructed and investigated a
        library of ∼1,800 strains carrying SWAT-GFP modules at the amino termini of
        endomembrane proteins and then used it to create two new libraries (mCherry and
        seamless GFP).
    - reference_id: PMID:9920936
      supporting_text: >-
        On subcellular fractionation, unlike its mammalian homologue ARP, yARL3 was detected
        in the soluble fraction but not in the plasma membrane.
