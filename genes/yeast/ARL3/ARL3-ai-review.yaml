- id: PMID:9920936
  title: Characterization of a novel ADP-ribosylation factor-like protein (yARL3) in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Identified yeast ARL3 as >43% identical to mammalian ARP (ARFRP1), demonstrated intrinsic
      GTP binding and hydrolysis of purified recombinant yARL3 without cholera-toxin co-activity,
      and reported cold-sensitive CPY/ALP processing defects in arl3 mutants.
    supporting_text: >-
      Biochemical studies of purified recombinant yARL3 protein revealed properties similar to
      those of ARF and ARL proteins, including the ability to bind and hydrolyze GTP.
