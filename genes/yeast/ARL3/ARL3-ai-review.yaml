      synthesized GTPase lacking any signal peptide or transmembrane segment whose Met1-Phe2
      N-terminus is acetylated by cytosolic/ribosomal NatC (PMID:15077113, PMID:15077114,
      PMID:33139728) and stably tethered to the Golgi apparatus (GO:0005794) by direct binding
      to the integral Golgi membrane receptor Sys1p (loss of Sys1p or NatC releases Arl3p into
      the cytosol), where it recruits cytosolic Arl1p and Imh1p.
    supported_by:
    - reference_id: PMID:15077113
      supporting_text: >-
        Here we show that Arl3p is not myristoylated like most members of the Arf family, but
        is instead amino-terminally acetylated by the NatC complex. Targeting of Arl3p also
        requires a Golgi membrane protein Sys1p.
    - reference_id: PMID:33139728
      supporting_text: >-
        cerevisiae Arl3 (yArl3) was Nt-acetlyated by NatC with a kcat of 4.
core_functions:
- description: >-
    Golgi-localized Arf-like small GTPase switch that binds and hydrolyzes GTP on the
    cytoplasmic face of the Golgi membrane (tethered via NatC-catalyzed Met1 acetylation of its
    1-MFHLV-5 motif and direct binding to integral receptor Sys1p) to recruit Arl1p and the
    GRIP-domain golgin Imh1p for endosome-to-Golgi/vacuole transport and anterograde
    late-Golgi-to-plasma-membrane delivery of Gas1p.
