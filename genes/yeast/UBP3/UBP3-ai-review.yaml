- term:
    id: GO:1901525
    label: negative regulation of mitophagy
  evidence_type: IMP
  original_reference_id: PMID:25704822
  review:
    summary: Experimental identification showing Ubp3-Bre5 complex INHIBITS 
      mitophagy while PROMOTING other autophagy pathways (ribophagy). Not all 
      autophagy pathways are equally regulated by Ubp3. This is selective 
      regulatory function.
    action: KEEP_AS_NON_CORE
    reason: While well-supported by evidence, negative regulation of mitophagy 
      represents a specialized regulatory function, not a core catalytic or 
      primary biological role. Ubp3 is positively required for ribophagy and 
      stress granule assembly (core functions), but negatively regulates 
      mitophagy. Kept as non-core annotation because the primary substrate 
      functions do not directly involve mitochondrial proteins, but rather the 
      complex has broader effects on multiple autophagy pathways.
    supported_by:
    - reference_id: PMID:25704822
      supporting_text: The Ubp3-Bre5 deubiquitination complex was found to
        inhibit mitophagy but, conversely, to promote other types of autophagy,
        including ribophagy [selective regulation of different autophagy
        pathways]
    - reference_id: file:yeast/UBP3/UBP3-deep-research-falcon.md
      supporting_text: |-
        negative regulator of rapamycin-induced mitophagy
      reference_section_type: OTHER
