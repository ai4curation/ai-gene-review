- id: file:yeast/UBP3/UBP3-deep-research-falcon.md
  title: Falcon deep research report for Saccharomyces cerevisiae UBP3 (Q01477 / YER151C)
  findings:
  - statement: Ubp3 is a deubiquitinase that catalyzes hydrolysis of the isopeptide
      bond linking ubiquitin to a substrate lysine, acting through cofactor-controlled
      recruitment (notably Bre5) rather than as a constitutive housekeeping enzyme.
    supporting_text: |-
      Ubp3 catalyzes **deubiquitination**—hydrolysis of the isopeptide bond linking ubiquitin to a substrate lysine
    reference_section_type: OTHER
  - statement: Ubp3 acts in a stable Ubp3·Bre5 complex in which Bre5 is an essential
      positive regulator of activity, not merely a passive binding partner.
    supporting_text: |-
      Bre5 is an essential positive regulator of Ubp3 activity rather than merely a passive binding factor
    reference_section_type: OTHER
  - statement: With Bre5, Ubp3 specifically deubiquitinates the COPII coat subunit
      Sec23 and is described as the only yeast Ubp able to catalyze Sec23 deubiquitination,
      anchoring it in ER-to-Golgi anterograde trafficking.
    supporting_text: |-
      specifically deubiquitinates the COPII subunit **Sec23**
    reference_section_type: OTHER
  - statement: Ubp3·Bre5 also targets a COPI subunit and BRE5 disruption causes Golgi-to-ER
      retrograde transport defects, indicating coordination of both anterograde and
      retrograde ER-Golgi trafficking.
    supporting_text: |-
      Disruption of **BRE5** causes defects in Golgi-to-ER retrograde transport
    reference_section_type: OTHER
  - statement: Ubp3-Bre5 is required for starvation-induced ribophagy, removing an
      inhibitory ubiquitin signal from 60S ribosomal components to permit selective
      vacuolar delivery.
    supporting_text: |-
      Ubp3 is positioned as a DUB that removes an inhibitory ubiquitin signal from ribosomal components
    reference_section_type: OTHER
  - statement: A genome-wide screen identified the Ubp3-Bre5 complex as a negative
      regulator of rapamycin-induced mitophagy while positively promoting bulk autophagy,
      ribophagy, and the Cvt pathway.
    supporting_text: |-
      negative regulator of rapamycin-induced mitophagy
    reference_section_type: OTHER
  - statement: Additional reported roles include RNA polymerase II deubiquitination,
      enhancement of proteasomal degradation of sterol-homeostasis enzymes, Rad4 turnover,
      heat resistance, and replicative lifespan control, plus a 2024 role constraining
      glucose-mediated mitochondrial repression via phosphate budgeting.
    supporting_text: |-
      links Ubp3 to RNAPII deubiquitination, Rad4 proteasomal turnover, heat resistance, and replicative lifespan control
    reference_section_type: OTHER
