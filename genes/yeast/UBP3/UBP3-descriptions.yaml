  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All sources agree on a Bre5-assisted USP-family deubiquitinase acting
    in COPII/Golgi traffic and ribophagy. SGD is the most detailed; the automated
    text adds stress granules.
