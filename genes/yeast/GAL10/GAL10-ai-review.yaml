gene_symbol: GAL10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GAL10 encodes a bifunctional galactose-induced enzyme of Saccharomyces cerevisiae that carries
  two Leloir pathway activities in separate domains. The N-terminal domain (residues ~1-377) is an NAD+-dependent
  UDP-glucose 4-epimerase (EC 5.1.3.2) of the NAD(P)-dependent epimerase/dehydratase family that interconverts
  UDP-galactose and UDP-glucose, regenerating UDP-glucose for the Gal7 uridylyltransferase reaction. The
  C-terminal domain (residues ~378-699) is an aldose 1-epimerase (mutarotase, EC 5.1.3.3) that interconverts
  the alpha and beta anomers of D-galactose and D-glucose, supplying alpha-D-galactose for galactokinase.
  The two active sites act independently. GAL10 lies in the GAL1-GAL10-GAL7 cluster, is co-induced by
  galactose, and the protein is cytosolic.
