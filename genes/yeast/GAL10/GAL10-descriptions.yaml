gene_symbol: GAL10
organism: yeast
uniprot_id: P04397
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Mutarotase converts alpha-aldose to the beta-anomer. It is active on D-glucose,
    L-arabinose, D-xylose, D-galactose, maltose and lactose (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P04397
  source_id: P04397
- source: Alliance_Imported
  text: UDP-glucose-4-epimerase; catalyzes interconversion of UDP-galactose and UDP-D-glucose
    in galactose metabolism; also catalyzes conversion of alpha-D-glucose or alpha-D-galactose
    to their beta-anomers; human homolog GALE implicated in galactosemia, can complement
    yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/GAL10
  source_id: SGD:S000000223
- source: Alliance_Automated
  text: Enables UDP-glucose 4-epimerase activity and aldose 1-epimerase activity.
    Involved in beta-D-galactose catabolic process via UDP-galactose, Leloir pathway.
    Located in cytosol. Used to study galactosemia and thrombocytopenia. Human ortholog(s)
    of this gene implicated in galactose epimerase deficiency and thrombocytopenia.
    Orthologous to human GALE (UDP-galactose-4-epimerase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GAL10
  source_id: SGD:S000000223
