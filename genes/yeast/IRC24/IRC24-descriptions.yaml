gene_symbol: IRC24
organism: yeast
uniprot_id: P40580
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Reduces benzil stereospecifically to (S)-benzoin (PubMed:11796169, PubMed:37602278).
    Also reduces 1-phenyl-1,2- propanedione to 2-hydroxy-1-phenyl-1-propanone (PubMed:11796169).
    Is probably involved in a pathway contributing to genomic integrity (Probable).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40580
  source_id: P40580
- source: Alliance_Imported
  text: Benzil oxidoreductase with preference for NADPH; localizes to the cytoplasm;
    induced by the DNA-damaging agent MMS; null mutant has elevated levels of spontaneous
    Rad52p foci; sequence similarity with short-chain dehydrogenase/reductases; putative
    paralog of IRC24
  source_type: curated
  url: https://www.yeastgenome.org/locus/IRC24
  source_id: SGD:S000001475
- source: Alliance_Automated
  text: Enables oxidoreductase activity, acting on NAD(P)H, oxygen as acceptor and
    oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor.
    Located in cytoplasm. Human ortholog(s) of this gene implicated in several diseases,
    including cortisone reductase deficiency (multiple); heart disease; hypertension
    (multiple); kidney disease; and type 2 diabetes mellitus. Orthologous to several
    human genes including HSD11B1 (hydroxysteroid 11-beta dehydrogenase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IRC24
  source_id: SGD:S000001475
