  review:
    summary: Rhea-mapping IEA from RHEA:31891 (1-phenyl-1,2-propanedione reduction); the most 
      informative existing MF term for this broad-specificity NADPH carbonyl reductase.
    action: ACCEPT
    reason: The protein reduces aryl alpha-diketones (benzil, 1-phenyl-1,2-propanedione) to 
      secondary alcohols with NADPH. That is the reaction class of GO:0004090 (EC 1.1.1.184). The 
      physiological substrate is unknown, which is consistent with this broad term rather than a 
      substrate-specific one.
