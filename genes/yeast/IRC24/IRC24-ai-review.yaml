- term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028442
  - RHEA:25968
  review:
    summary: Combined IEA driven by RHEA:25968 mapped to the EC 1.1.1.- grouping class.
    action: MODIFY
    reason: 'This IEA is generated from the RHEA:25968 narrowMatch xref on the grouping class GO:0016616,
      which was added when GO:0102306 was obsoleted. It is not wrong, but it is uninformative; a RHEA
      reaction mapped to an EC-incomplete grouping class yields annotations that say nothing about substrate
      class. Replace with GO:0004090 (and fix the xref upstream: RHEA:25968 should be a narrowMatch of
      GO:0004090, as its sister reaction RHEA:31891 already is).'
    proposed_replacement_terms:
    - *id001
    supported_by:
    - *id002
- term:
    id: GO:0050664
    label: oxidoreductase activity, acting on NAD(P)H, oxygen as acceptor
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002453021
  - SGD:S000001475
  review:
    summary: IBA to an NAD(P)H oxidase (O2 acceptor) class, seeded by IRC24's own IDA.
    action: MODIFY
    reason: This IBA inherits from PTN002453021, which is seeded by the IRC24 IDA (SGD:S000001475) 
      to GO:0050664. That seed annotation used a term whose acceptor (O2) does not match the benzil 
      reductase assay, so the propagated term is wrong for the same reason. The underlying inherited
      function (an NADPH-dependent carbonyl reductase shared by the IRC24/NRE1 paralogs) is sound 
      and is better expressed as GO:0004090.
    proposed_replacement_terms:
    - *id001
    supported_by:
    - *id003
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      source_entities:
      - source_id: PANTHER:PTN002453021
        source_label: PTN002453021
        source_status: SOURCE_BAD
        comment: The node is seeded by the IRC24 IDA (SGD:S000001475) to GO:0050664. That is a 
          correct experiment captured under a term whose O2 acceptor does not match the benzil/NADPH
          assay, so the inherited term is wrong. The underlying carbonyl reductase function is 
          inherited correctly.
- term:
    id: GO:0050664
    label: oxidoreductase activity, acting on NAD(P)H, oxygen as acceptor
  evidence_type: IDA
  original_reference_id: PMID:11796169
  qualifier: enables
  review:
    summary: Benzil reductase assay annotated to an NAD(P)H:O2 oxidoreductase term.
    action: MODIFY
    reason: GO:0050664 (EC 1.6.3.-) describes NAD(P)H oxidation with molecular oxygen as the 
      electron acceptor (NAD(P)H oxidases). The benzil reductase assay measures NADPH consumption 
      coupled to reduction of an organic diketone; O2 is not the acceptor. The experimental 
      observation is correct, but the term does not describe it. The correct term is GO:0004090 
      carbonyl reductase (NADPH) activity.
    proposed_replacement_terms:
    - *id001
    supported_by:
    - *id004
