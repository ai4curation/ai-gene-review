id: P40580
gene_symbol: IRC24
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: IRC24 (YIR036C) encodes a cytoplasmic classical short-chain dehydrogenase/reductase 
  (SDR) of about 263 residues. Purified recombinant Irc24 reduces aromatic alpha-diketones 
  stereoselectively with NADPH (NADH is used about half as well), converting benzil to (S)-benzoin 
  and 1-phenyl-1,2-propanedione to 2-hydroxy-1-phenyl-1-propanone. These substrates are xenobiotic, 
  and the physiological substrate and pathway are unknown. IRC24 is a paralog of the adjacent gene 
  NRE1 (52% identity), and its deletion raises spontaneous Rad52 focus levels, although no mechanism
  links the reductase to genome maintenance.
