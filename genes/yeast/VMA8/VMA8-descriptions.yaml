descriptions:
- source: UniProt
  text: Subunit of the V1 complex of vacuolar(H+)-ATPase (V-ATPase), a multisubunit
    enzyme composed of a peripheral complex (V1) that hydrolyzes ATP and a membrane
    integral complex (V0) that translocates protons (PubMed:7797485, PubMed:7831318).
    V-ATPase is responsible for acidifying and maintaining the pH of intracellular
    compartments (PubMed:7797485, PubMed:7831318).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32610
  source_id: P32610
- source: Alliance_Imported
  text: Subunit D of the V1 peripheral membrane domain of V-ATPase; part of the electrogenic
    proton pump found throughout the endomembrane system; plays a role in the coupling
    of proton transport and ATP hydrolysis; the V1 peripheral membrane domain of the
    vacuolar H+-ATPase (V-ATPase) has eight subunits
  source_type: curated
  url: https://www.yeastgenome.org/locus/VMA8
  source_id: SGD:S000000777
- source: Alliance_Automated
  text: Contributes to proton-transporting ATPase activity, rotational mechanism.
    Involved in proton transmembrane transport and vacuolar acidification. Located
    in fungal-type vacuole membrane and membrane raft. Part of vacuolar proton-transporting
    V-type ATPase, V1 domain. Orthologous to human ATP6V1D (ATPase H+ transporting
    V1 subunit D).
  source_type: automated
  url: https://www.yeastgenome.org/locus/VMA8
  source_id: SGD:S000000777
