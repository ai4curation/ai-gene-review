descriptions:
- source: UniProt
  text: Subunit of the V1 complex of vacuolar(H+)-ATPase (V-ATPase), a multisubunit
    enzyme composed of a peripheral complex (V1) that hydrolyzes ATP and a membrane
    integral complex (V0) that translocates protons (PubMed:7797485, PubMed:7831318).
    V-ATPase is responsible for acidifying and maintaining the pH of intracellular
    compartments (PubMed:7797485, PubMed:7831318).
