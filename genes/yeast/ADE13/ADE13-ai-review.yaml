id: Q05911
gene_symbol: ADE13
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Ade13 (YLR359W; also BRA1) is the adenylosuccinate lyase of Saccharomyces cerevisiae (EC 4.3.2.2).
  It catalyses two fumarate-releasing beta-eliminations in purine synthesis: cleavage of SAICAR to AICAR (step 8
  of de novo IMP synthesis) and cleavage of adenylosuccinate to AMP (second step of the IMP to AMP branch). Loss
  of activity causes adenine auxotrophy, and accumulation of the upstream intermediate SAICAR in ade13 mutants deregulates
  ADE gene expression. Ade13 activity is feedback-inhibited by AICAR. It is a soluble cytosolic enzyme.'
