- source: Alliance_Automated
  text: Enables N6-(1,2-dicarboxyethyl)AMP AMP-lyase (fumarate-forming) activity.
    Involved in 'de novo' IMP biosynthetic process. Predicted to be active in cytosol.
    Human ortholog(s) of this gene implicated in adenylosuccinase lyase deficiency.
    Orthologous to human ADSL (adenylosuccinate lyase).
