  text: Adenylosuccinate lyase; catalyzes two steps in the 'de novo' purine nucleotide
    biosynthetic pathway; expression is repressed by adenine and activated by Bas1p
    and Pho2p; mutations in human ortholog ADSL cause adenylosuccinase deficiency;
    human ADSL can complement yeast ADE13 null mutant
  source_type: curated
