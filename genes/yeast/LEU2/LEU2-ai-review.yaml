  label: Saccharomyces cerevisiae S288C
description: '3-Isopropylmalate dehydrogenase (beta-isopropylmalate dehydrogenase, EC 1.1.1.85) of Saccharomyces
  cerevisiae, catalysing the third step of the leucine-specific branch of branched-chain amino acid biosynthesis:
  NAD+-dependent oxidative decarboxylation of (2R,3S)-3-isopropylmalate to 4-methyl-2-oxopentanoate (alpha-ketoisocaproate),
  which is then transaminated to leucine by Bat1/Bat2. Leu2 belongs to the isocitrate/isopropylmalate
  dehydrogenase family, requires Mg2+ or Mn2+, and is a soluble cytosolic enzyme. LEU2 transcription is
  repressed by leucine and activated by Leu3 bound to 2-isopropylmalate. leu2 mutations cause leucine
  auxotrophy, and LEU2 is one of the most widely used selectable markers in yeast genetics. Leu2 can also
  oxidatively decarboxylate the analogue beta-ethylmalate in vitro.'
