- term:
    id: GO:0006097
    label: glyoxylate cycle
  evidence_type: IMP
  original_reference_id: PMID:23642236
  qualifier: involved_in
  review:
    summary: The cited study (full text read) proposes a glycine -> glyoxylate -> beta-ethylmalate ->
      alpha-ketovalerate -> butanol route and shows that Leu2 contributes to conversion of beta-ethylmalate
      (formed from glyoxylate and butyryl-CoA by malate synthase) in coupled in vitro assays. This is
      promiscuous activity on a substrate analogue in an engineered/proposed fusel-alcohol pathway, not
      participation in the glyoxylate cycle (the isocitrate lyase/malate synthase bypass of the TCA cycle).
      Leu2 performs no step of the glyoxylate cycle.
    action: REMOVE
    reason: GO:0006097 glyoxylate cycle is defined by the isocitrate lyase and malate synthase reactions;
      the paper's evidence concerns Leu2 acting on beta-ethylmalate downstream of glyoxylate in a putative
      butanol pathway, which is not the glyoxylate cycle.
    supported_by:
    - reference_id: PMID:23642236
      supporting_text: The second coupled reaction, catalyzed by the Leu2 activity, utilizes the produced
        β-ethylmalate to generate α-ketovalerate and releasing NADH as reduced equivalent.
    - reference_id: PMID:23642236
      supporting_text: Concluding, these data indicate that the presence of LEU2 coupled with malate synthase
        activity guarantees the glyoxylate conversion into α-ketovalerate.
