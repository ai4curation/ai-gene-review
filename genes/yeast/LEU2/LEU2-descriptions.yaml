descriptions:
- source: UniProt
  text: Catalyzes the oxidation of 3-carboxy-2-hydroxy-4- methylpentanoate (3-isopropylmalate)
    to 3-carboxy-4-methyl-2- oxopentanoate. The product decarboxylates to 4-methyl-2
    oxopentanoate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P04173
  source_id: P04173
- source: Alliance_Imported
  text: Beta-isopropylmalate dehydrogenase (IMDH); catalyzes the third step in the
    leucine biosynthesis pathway; can additionally catalyze the conversion of beta-ethylmalate
    into alpha-ketovalerate
  source_type: curated
  url: https://www.yeastgenome.org/locus/LEU2
  source_id: SGD:S000000523
- source: Alliance_Automated
  text: Enables 3-isopropylmalate dehydrogenase activity. Involved in L-leucine biosynthetic
    process and glyoxylate cycle. Located in cytosol.
  source_type: automated
  url: https://www.yeastgenome.org/locus/LEU2
