  review:
    summary: 'PAINT IBA from the spermidine synthase node (PTN000168362). Spe4 is the yeast spermine synthase, a
      paralogue of Spe3 that sits in the same PANTHER family. Genetic evidence argues against spermidine synthase
      activity for Spe4: spe3 null cells, which retain SPE4, have no detectable spermidine synthase activity and
      are spermidine auxotrophs. Spe4 therefore uses spermidine as acceptor rather than producing it.'
    action: REMOVE
    reason: 'Paralogue over-propagation: target-specific genetic evidence (spe3 null has no spermidine synthase
      activity despite intact SPE4) shows Spe4 lacks this function; its activity is spermine synthase.'
    supported_by:
    - &id001
      reference_id: PMID:9073064
      supporting_text: To investigate the effect of total loss of the SPE3 gene, we constructed a null mutant of
        this gene, spe3delta, which has no spermidine synthase activity and has an absolute requirement for spermidine
        or spermine for the growth.
    - &id004
