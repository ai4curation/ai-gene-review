taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Spermine synthase (spermidine aminopropyltransferase, EC 2.5.1.22) of Saccharomyces cerevisiae, a paralogue
  of spermidine synthase Spe3 in the spermidine/spermine synthase family. Spe4 transfers the aminopropyl group of
  decarboxylated S-adenosylmethionine to spermidine, forming spermine and 5'-methylthioadenosine. spe4 deletion
  mutants contain no spermine and no spermine synthase activity yet grow normally, showing that spermine is dispensable
  in yeast, in contrast to the essential spermidine made by Spe3. Spe4 is cytosolic and interacts with Spe3 in high-throughput
  screens.
