id: Q08224
gene_symbol: THI20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: THI20 (YOL055C) encodes the major hydroxymethylpyrimidine (HMP)/HMP-phosphate kinase of Saccharomyces
  cerevisiae, a ThiD-TenA fusion protein of the THI20/THI21/THI22 family. Its N-terminal ThiD-like ribokinase
  domain phosphorylates HMP-P to HMP-PP (EC 2.7.4.7), the activated pyrimidine that Thi6 couples to the
  thiazole to make thiamine monophosphate, and also phosphorylates HMP to HMP-P (EC 2.7.1.49), allowing
  salvage of free HMP. Its C-terminal TenA-like domain has thiaminase II activity in vitro, hydrolysing
  thiamine to HMP and 4-methyl-5-(2-hydroxyethyl)thiazole, making Thi20 trifunctional with both biosynthetic
  and degradative activity; the physiological role of the thiaminase activity (thiamine recycling/salvage)
  is not established. Thi20 is cytosolic, induced by thiamine starvation as part of the THI regulon, and
  is functionally redundant with THI21 for HMP-P kinase activity.
