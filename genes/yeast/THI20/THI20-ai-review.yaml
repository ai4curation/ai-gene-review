suggested_questions:
- question: Does the TenA-like thiaminase II domain of Thi20 act in vivo to degrade thiamine or to salvage
    base-degraded thiamine products (as bacterial TenA does), and is it relevant under thiamine-replete
    or stress conditions?
suggested_experiments:
- description: Introduce a catalytic-site mutation into the Thi20 TenA domain (leaving the ThiD domain
    intact) and measure intracellular thiamine/HMP pools and growth on thiamine degradation products.
