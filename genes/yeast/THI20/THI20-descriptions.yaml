descriptions:
- source: UniProt
  text: Trifunctional protein with both thiamine biosynthetic and degradative activity
    (PubMed:15967475). Within the thiamine biosynthesis pathway, catalyzes the phosphorylation
    of hydroxymethylpyrimidine (HMP) to hydroxymethylpyrimidine phosphate (HMP-P),
    as well as of HMP-P to HMP-PP (PubMed:10383756, PubMed:15967475). Also has thiaminase
    II activity and degrades thiamine using water as the nucleophile, resulting only
    in the formation of HMP (4-amino-2-methyl-5-hydroxymethylpyrimidine) and Thz (4-methyl-5-
    thiazole ethanol) (PubMed:15967475).
