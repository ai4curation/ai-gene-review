descriptions:
- source: UniProt
  text: Trifunctional protein with both thiamine biosynthetic and degradative activity
    (PubMed:15967475). Within the thiamine biosynthesis pathway, catalyzes the phosphorylation
    of hydroxymethylpyrimidine (HMP) to hydroxymethylpyrimidine phosphate (HMP-P),
    as well as of HMP-P to HMP-PP (PubMed:10383756, PubMed:15967475). Also has thiaminase
    II activity and degrades thiamine using water as the nucleophile, resulting only
    in the formation of HMP (4-amino-2-methyl-5-hydroxymethylpyrimidine) and Thz (4-methyl-5-
    thiazole ethanol) (PubMed:15967475).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08224
  source_id: Q08224
- source: Alliance_Imported
  text: Trifunctional enzyme of thiamine biosynthesis, degradation and salvage; has
    hydroxymethylpyrimidine (HMP) kinase, HMP-phosphate (HMP-P) kinase and thiaminase
    activities; member of a gene family with THI21 and THI22; HMP and HMP-P kinase
    activity redundant with Thi21p
  source_type: curated
  url: https://www.yeastgenome.org/locus/THI20
  source_id: SGD:S000005416
- source: Alliance_Automated
  text: Enables hydroxymethylpyrimidine kinase activity; phosphomethylpyrimidine kinase
    activity; and thiaminase activity. Involved in thiamine biosynthetic process and
    thiamine catabolic process. Located in cytosol.
