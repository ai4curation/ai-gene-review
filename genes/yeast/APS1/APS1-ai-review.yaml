suggested_questions:
- question: Does Aps1 directly contact the Chs3 dileucine signal in the yeast AP-1 complex, as the gamma/sigma hemicomplex
    does in mammals, or is cargo recognition in yeast AP-1 mediated differently?
- question: Is the AP-1-dependent Fab1 activation (PtdIns(3,5)P2 synthesis) a direct effect of AP-1 vesicles delivering
    Fab1/Vac14 complex components, or an indirect effect of missorted cargo?
suggested_experiments:
- description: Mutate the conserved dileucine-binding pocket residues of Aps1 (by structural alignment to mammalian
    sigma1) and test Chs3 retention in chs6 cells and Snc1 reporter sorting, to separate Aps1 cargo-recognition
    from complex-assembly roles.
  experiment_type: site-directed mutagenesis with cargo-sorting assays
