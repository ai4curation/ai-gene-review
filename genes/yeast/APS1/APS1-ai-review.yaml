  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review: &id002
    summary: Nucleus, transferred (ISS, and its SubCell IEA mapping) from S. pombe Aps1/vas2 (Q9P7N2), whose nuclear
      and cytoplasmic localization comes only from the genome-wide ORFeome GFP screen.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only basis is a large-scale GFP-fusion localization in fission yeast (PMID:16823372); the pombe
      AP-1 study that defined Golgi/endosome localization does not report a nuclear pool, and no S. cerevisiae data
      place Aps1 or any AP-1 subunit in the nucleus. A diffuse nucleocytoplasmic signal of an over-expressed small
      fusion is a common screen artefact. AP-1 has no known nuclear function, so the term over-states the evidence.
    supported_by:
    - &id003
      reference_id: file:SCHPO/vas2/vas2-uniprot.txt
      supporting_text: Cytoplasm {ECO:0000269|PubMed:16823372}. Nucleus
    - &id005
      reference_id: PMID:19624755
      supporting_text: the deletion of any subunit generally caused the disassociation of the heterotetrameric complex
        from endosomes
