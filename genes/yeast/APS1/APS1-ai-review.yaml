  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0101
  review: &id007
    summary: Endosome (ISS from S. pombe Aps1/vas2 Q9P7N2 and its SubCell IEA mapping).
    action: ACCEPT
    reason: S. pombe AP-1, including the Aps1 sigma subunit, localizes to endosomes and the complex dissociates
      from endosomes when any subunit is deleted (PMID:19624755); S. pombe and S. cerevisiae Aps1 are in the same
      PANTHER subfamily (PTHR11753:SF5), so the transfer is phylogenetically grounded. In S. cerevisiae, AP-1 is
      placed at late Golgi/early endosomes, and AP-1-dependent cargo (Chs3, Tlg1) cycles between the TGN and early
      endosomes. Early endosome (GO:0005769) would be more precise, but the yeast TGN and early endosome are not
      cleanly separable compartments, so endosome is kept as stated. Not directly imaged for S. cerevisiae Aps1.
    supported_by:
    - *id005
    - *id006
    - &id009
      reference_id: PMID:11879634
      supporting_text: We propose that clathrin and AP-1 act to recycle Chs3p and Tlg1p from the early endosome
        to the TGN.
