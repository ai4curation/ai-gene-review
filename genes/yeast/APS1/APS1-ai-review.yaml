- term:
    id: GO:0006896
    label: Golgi to vacuole transport
  evidence_type: IMP
  original_reference_id: PMID:17003107
  qualifier: involved_in
  review:
    summary: 'IMP: AP-1 subunit mutants fail to deliver endogenously ubiquitylated cargo to the vacuole lumen (Phelan
      et al. 2006).'
    action: KEEP_AS_NON_CORE
    reason: 'The phenotype is real but the abstract attributes it to a failure to activate Fab1 (PtdIns(3,5)P2 synthesis):
      Fab1 overexpression restores sorting in AP-1 mutants. AP-1 thus appears to act upstream of, rather than as
      the carrier for, delivery of ubiquitylated cargo to the vacuole lumen. The curator read the full text (abstract-only
      cache here) and the term is consistent with AP-1 operating in post-Golgi traffic, so it is retained, but as
      non-core.'
    supported_by:
    - reference_id: PMID:17003107
      supporting_text: Like fab1Delta cells, AP-1 complex component mutants have lost the ability to traffic ubiquitylated
        cargoes to the vacuole lumen
    - reference_id: PMID:17003107
      supporting_text: implying that the protein-sorting defect in these cells is as a result of disruption of PtdIns(3,5)P2
        synthesis
