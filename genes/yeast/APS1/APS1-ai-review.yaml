- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: ND root-term annotation (no molecular function data at the time it was made).
    action: MODIFY
    reason: 'The ND placeholder is superseded. Aps1 is the sigma subunit of AP-1, a clathrin adaptor complex: only
      AP-1 among the yeast AP complexes binds clathrin, and the AP-1 gamma/sigma hemicomplex is the site that recognises
      dileucine sorting signals such as that of Chs3. The sigma subunit contributes to, rather than alone executes,
      the complex-level clathrin-cargo adaptor activity (GO:0035615), which is also present here as an InterPro
      IEA row. Note that the adaptor activity is established for the AP-1 complex in yeast; a dileucine-binding
      role for Aps1 specifically is inferred from the family and is not directly assayed in S. cerevisiae.'
    proposed_replacement_terms:
    - id: GO:0035615
      label: clathrin-cargo adaptor activity
    supported_by:
    - &id013
      reference_id: PMID:10564262
      supporting_text: As assessed by in vitro binding assays and coimmunoprecipitation, only AP-1 interacts with
        clathrin.
    - &id015
      reference_id: PMID:26658609
      supporting_text: Because the dileucine-based motif of Chs3 binds the γ/σ subunits present in both AP-1 and
        AP-1R
    nd_case: STALE
