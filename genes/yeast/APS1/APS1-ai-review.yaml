  review:
    summary: Clathrin-cargo adaptor activity, from the AP1_sigma InterPro signature (IPR044733).
    action: ACCEPT
    reason: 'Aps1 belongs to the AP-1 sigma subfamily, and the yeast AP-1 complex links clathrin to cargo: it is
      the only yeast AP complex that binds clathrin, and its gamma/sigma hemicomplex recognises the dileucine signal
      that sorts Chs3. The activity is a property of the heterotetramer to which Aps1 contributes; it has not been
      reconstituted for Aps1 alone. Yeast AP-1 is also notably dispensable for bulk clathrin function under normal
      conditions.'
