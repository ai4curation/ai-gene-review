id: P35181
gene_symbol: APS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Aps1 (YLR170C; also YAP19) is the 156-residue sigma1 small subunit of the S. cerevisiae AP-1 clathrin
  adaptor complex, a heterotetramer with the gamma-adaptin Apl4, the beta1-adaptin Apl2 and the mu1-adaptin Apm1.
  Aps1 is also the shared sigma subunit of the AP-1R variant, in which Apm2 replaces Apm1. It has a longin-like
  clathrin adaptor small-chain fold and belongs to the adaptor complexes small subunit family (PANTHER PTHR11753,
  subfamily SF5 together with S. pombe Aps1). AP-1 is the only yeast AP complex that binds clathrin; it co-fractionates
  with clathrin-coated vesicles and acts at the late Golgi/early endosome, where it sorts specific membrane cargo.
  Its best-characterised cargo is chitin synthase Chs3, which it keeps in an intracellular TGN/early endosome recycling
  loop through a dileucine signal recognised by the gamma/sigma subunits; AP-1 also retains the syntaxin Tlg1, and
  AP-1R sorts the v-SNARE Snc1. Loss of Aps1 has no detectable phenotype in otherwise wild-type cells but worsens
  the growth and alpha-factor maturation defects of clathrin heavy chain mutants, showing that AP-1 contributes
  to a subset of clathrin functions at the Golgi without being required for clathrin coat function in general.
