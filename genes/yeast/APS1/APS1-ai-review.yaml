core_functions:
- description: Sigma1 subunit of the AP-1 clathrin adaptor heterotetramer (and of the Apm2-containing AP-1R variant);
    together with gamma-adaptin Apl4 it forms the hemicomplex that recognises dileucine sorting signals, contributing
    to AP-1 linking clathrin to cargo such as Chs3 at the late Golgi/early endosome. Complex membership is experimental
    in S. cerevisiae; the sigma-specific cargo-recognition role is inferred from the family.
