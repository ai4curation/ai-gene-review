descriptions:
- source: UniProt
  text: Component of the adapter complexes which link clathrin to receptors in coated
    vesicles (PubMed:10564262). Clathrin-associated protein complexes are believed
    to interact with the cytoplasmic tails of membrane proteins, leading to their
    selection and concentration (PubMed:10564262). AP19 is probably a subunit of the
    Golgi membrane adapter (PubMed:10564262). Component of the AP-1-related (AP-1R)
    complex, an adapter protein complex that mediates sorting of cargo SNARE SNC1
    (PubMed:26658609). In contrast to the APM1-containing AP-1 complex, AP-1R is incapable
    of sorting CHS3 (PubMed:26658609).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P35181
  source_id: P35181
- source: Alliance_Imported
  text: Small subunit of the clathrin-associated adaptor complex AP-1; AP-1 is involved
    in protein sorting at the trans-Golgi network; homolog of the sigma subunit of
    the mammalian clathrin AP-1 complex
  source_type: curated
  url: https://www.yeastgenome.org/locus/APS1
  source_id: SGD:S000004160
- source: Alliance_Automated
  text: Predicted to enable clathrin-cargo adaptor activity. Involved in Golgi to
    vacuole transport. Part of AP-1 adaptor complex. Human ortholog(s) of this gene
    implicated in MEDNIK syndrome; psoriasis 15; and syndromic X-linked intellectual
    disability 5. Orthologous to several human genes including AP1S1 (adaptor related
    protein complex 1 subunit sigma 1) and AP1S2 (adaptor related protein complex
    1 subunit sigma 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/APS1
  source_id: SGD:S000004160
