proposed_new_terms: []
suggested_questions:
- question: What do Lpp1-generated diacylglycerol or reduced PA do at the Golgi (for example in secretory
    vesicle formation), given that lpp1 mutants show no obvious growth phenotype?
- question: Which isoprenoid phosphates (dolichyl-P-P, farnesyl-P-P) are physiological Lpp1 substrates
    in vivo, compared with the dominant Dpp1 activity?
suggested_experiments:
- description: Measure Golgi PA/DAG pools (biosensors such as Spo20-PABD and C1 domains) in lpp1, dpp1
    and pah1 combinations, with and without catalytically dead Lpp1 (His-189/His-235 mutants).
  experiment_type: cell biology/genetics
  hypothesis: Lpp1 sets Golgi PA/DAG levels independently of the Pah1-dependent pool for TAG synthesis.
