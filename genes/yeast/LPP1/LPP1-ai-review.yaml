  label: Saccharomyces cerevisiae S288C
description: LPP1 encodes a Mg2+-independent lipid phosphate phosphatase of the PAP2 (lipid phosphate
  phosphatase) superfamily and is the paralogue of the vacuolar DGPP phosphatase Dpp1. It is an integral
  multi-pass membrane protein of the Golgi. Lpp1 dephosphorylates phosphatidate (PA) to diacylglycerol,
  and also hydrolyses lysophosphatidate (LPA) and diacylglycerol pyrophosphate (DGPP); its substrate preference
  is PA > LPA > DGPP, and it is unusually sensitive to N-ethylmaleimide. Together with Dpp1 it accounts
  for nearly all Mg2+-independent PA and LPA phosphatase activity and contributes to hydrolysis of isoprenoid
  phosphates. lpp1 and dpp1 lpp1 mutants grow normally but have altered cellular PA and phosphatidylinositol
  levels. Lpp1 is not the main source of diacylglycerol for triacylglycerol synthesis, which depends on
  the Mg2+-dependent lipin Pah1.
