gene_symbol: LPP1
organism: yeast
uniprot_id: Q04396
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the dephosphorylation of diacylglycerol diphosphate (DGPP) to phosphatidate
    (PA) and the subsequent dephosphorylation of PA to diacylglycerol (DAG). Together
    with DPP1, regulates intracellular DGPP and PA levels which are phospholipid molecules
    believed to play a signaling role in stress response. Can also use lysophosphatidic
    acid (LPA) as a substrate. Substrate preference is PA > DGPP > LPA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04396
  source_id: Q04396
- source: Alliance_Imported
  text: Lipid phosphate phosphatase; catalyzes Mg(2+)-independent dephosphorylation
    of phosphatidic acid (PA), lysophosphatidic acid, and diacylglycerol pyrophosphate;
    involved in control of the cellular levels of phosphatidylinositol and PA
  source_type: curated
  url: https://www.yeastgenome.org/locus/LPP1
  source_id: SGD:S000002911
- source: Alliance_Automated
  text: Enables diacylglycerol diphosphate phosphatase activity; lysophosphatidic
    acid phosphatase activity; and phosphatidate phosphatase activity. Involved in
    phospholipid metabolic process. Located in membrane. Orthologous to human PLPP1
    (phospholipid phosphatase 1); PLPP2 (phospholipid phosphatase 2); and PLPP3 (phospholipid
    phosphatase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LPP1
  source_id: SGD:S000002911
