descriptions:
- source: UniProt
  text: Catalyzes the dephosphorylation of diacylglycerol diphosphate (DGPP) to phosphatidate
    (PA) and the subsequent dephosphorylation of PA to diacylglycerol (DAG). Together
    with DPP1, regulates intracellular DGPP and PA levels which are phospholipid molecules
    believed to play a signaling role in stress response. Can also use lysophosphatidic
    acid (LPA) as a substrate. Substrate preference is PA > DGPP > LPA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04396
  source_id: Q04396
