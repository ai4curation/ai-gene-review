id: P33412
gene_symbol: ECT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ECT1 (MUQ1) encodes CTP:phosphoethanolamine cytidylyltransferase (ethanolamine-phosphate
  cytidylyltransferase, EC 2.7.7.14) of Saccharomyces cerevisiae, a soluble enzyme of the cytidylyltransferase
  family with two tandem CTP-transferase-like (HxGH) domains, related to mammalian PCYT2. It converts
  phosphoethanolamine and CTP into CDP-ethanolamine and diphosphate, the second step of the CDP-ethanolamine
  (Kennedy) branch of phosphatidylethanolamine synthesis; Ept1 (and Cpt1) then transfer phosphoethanolamine
  to diacylglycerol. ect1 mutants cannot use exogenous ethanolamine for PE synthesis, and in a cho1 background
  (no de novo PS-derived PE) they have almost no PE. Ect1 is cytoplasmic, with GFP signal also in the
  nucleus, and has been implicated in plasma membrane maintenance and sporulation.
