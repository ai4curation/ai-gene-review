suggested_questions:
- question: Is Ect1 activity rate-limiting for PE synthesis via the Kennedy pathway in yeast, as for mammalian
    PCYT2, and how is it regulated by ethanolamine availability?
suggested_experiments:
- description: Titrate ECT1 expression in a psd1 psd2 background and measure flux of labelled ethanolamine
    into PE to determine whether Ect1 controls Kennedy-pathway PE synthesis.
