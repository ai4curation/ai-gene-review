descriptions:
- source: UniProt
  text: Ethanolamine-phosphate cytidylyltransferase which catalyzes the second step
    of phosphatidylethanolamine biosynthesis. Involved in the maintenance of plasma
    membrane and required for proper sporulation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33412
  source_id: P33412
- source: Alliance_Imported
  text: 'Ethanolamine-phosphate cytidylyltransferase; catalyzes the second step of
    phosphatidylethanolamine biosynthesis; involved in the maintenance of plasma membrane;
    similar to mammalian CTP: phosphocholine cytidylyl-transferases; inability of
    the null mutant to synthesize phosphatidylethanolamine and phosphatidylcholine
    from ethanolamine is functionally complemented by human PCYT2'
  source_type: curated
  url: https://www.yeastgenome.org/locus/ECT1
  source_id: SGD:S000003239
- source: Alliance_Automated
  text: Enables ethanolamine-phosphate cytidylyltransferase activity. Involved in
    phosphatidylethanolamine biosynthetic process. Located in cytoplasm and nucleus.
    Human ortholog(s) of this gene implicated in hereditary spastic paraplegia 82.
    Orthologous to human PCYT2 (phosphate cytidylyltransferase 2, ethanolamine).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ECT1
