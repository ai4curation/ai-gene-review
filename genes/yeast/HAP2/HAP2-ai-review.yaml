- term:
    id: GO:0006109
    label: regulation of carbohydrate metabolic process
  evidence_type: NAS
  original_reference_id: PMID:16278450
  qualifier: involved_in
  review:
    summary: This curator statement reflects that the HAP complex activates genes in
      response to growth on nonfermentable carbon sources.
    action: KEEP_AS_NON_CORE
    reason: The yeast CCAAT-binding factor mediates carbon-source-dependent
      derepression, but its documented targets are mainly respiratory and mitochondrial
      electron transport genes rather than carbohydrate-metabolism enzymes as such. The
      term is a broad physiological consequence of the transcriptional activity, not a
      separate function. I keep it as non-core and yeast-specific. It is not a candidate
      for transfer by homology.
    supported_by:
    - reference_id: PMID:7828851
      supporting_text: The CCAAT-binding factor of Saccharomyces cerevisiae activates
        the transcription of these genes in response to growth in a nonfermentable carbon
        source.
