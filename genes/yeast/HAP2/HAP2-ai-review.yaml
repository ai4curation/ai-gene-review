id: P06774
gene_symbol: HAP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  HAP2 (YGL237C) is the NF-YA-type subunit of the budding yeast CCAAT-binding factor
  (Hap2/3/4/5 complex). It is a nuclear protein of 265 residues. A conserved core
  contains a subunit-association domain and a short basic DNA-recognition region, and
  the rest of the protein is largely disordered. HAP2 assembles with HAP3 (NF-YB type)
  and HAP5 (NF-YC type) in a one-step pathway into a heterotrimer that recognises the
  5'-CCAAT-3' box in upstream activation sites such as UAS2 of CYC1. Short regions of
  HAP2 and HAP3 together form a hybrid DNA-binding domain, and none of the three
  subunits binds DNA alone. The DNA-bound heterotrimer recruits the activation subunit
  HAP4, which supplies the transcriptional activation domains. The assembled complex
  activates RNA polymerase II transcription of genes for mitochondrial electron
  transport and respiration when cells grow on nonfermentable carbon sources. hap2
  mutants have reduced levels of all cytochromes and grow slowly on glycerol.
existing_annotations:
- term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence_type: IDA
  original_reference_id: PMID:7828851
  qualifier: contributes_to
  review:
    summary: Purified recombinant HAP2, HAP3 and HAP5 together reconstitute CCAAT-binding
      activity in mobility-shift assays, and all three subunits are required. The
      contributes_to qualifier is the right one, because HAP2 recognises the CCAAT box
      only within the heterotrimer.
    action: ACCEPT
    reason: Direct biochemical evidence in S. cerevisiae shows that HAP2 contributes to
      sequence-specific binding of Pol II promoter CCAAT elements (UAS2 of CYC1). Mutagenesis
      maps a 21-residue HAP2 DNA-binding region in which R199L changes the sequence
      specificity (PMID:8223474). This is the core molecular contribution of HAP2.
    additional_reference_ids:
    - PMID:8223474
    - PMID:16278450
    supported_by:
    - reference_id: PMID:7828851
      supporting_text: purified recombinant HAP2, HAP3, and HAP5 are able to reconstitute
        CCAAT-binding activity in mobility shift analysis
    - reference_id: PMID:7828851
      supporting_text: the HAP2/3/5 heterotrimer represents a unique DNA-binding factor
        in which all three subunits of the complex are absolutely required for DNA-binding
        activity
    - reference_id: PMID:8223474
      supporting_text: Mutation of an arginine at position 199 to leucine alters the
        DNA-binding specificity of the complex to favor CCAAC over CCAAT.
