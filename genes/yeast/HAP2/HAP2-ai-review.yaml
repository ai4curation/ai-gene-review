  review:
    summary: This IBA comes from PAINT node PTN000290575 (NF-YA/HAP2), whose
      experimental donors include yeast HAP2 itself, human NFYA and mouse Nfya. PANTHER
      19 places HAP2 in PTHR12632:SF6 with human NFYA.
    action: ACCEPT
    reason: The node placement is sound. Every characterised NF-YA/HAP2 subunit acts as
      part of a sequence-specific Pol II transcription factor, and HAP2 carries its own
      experimental evidence for this activity (IDA, contributes_to GO:0001228). HAP2 does
      not bind DNA alone, so its contribution is as a subunit, as the IDA rows record. That
      HAP2 appears in the WITH/FROM list is expected, not circular. The PAINT curator placed
      the generic activity term at this node rather than the activator-specific child,
      which fits NF-Y acting as both activator and repressor across the family.
