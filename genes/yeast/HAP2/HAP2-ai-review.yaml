    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:2832951
  qualifier: contributes_to
  review:
    summary: HAP2 and HAP3 copurify with UAS2-binding activity and form a multisubunit
      activation complex without DNA. In S. cerevisiae this complex activates
      CYC1 UAS2 and other respiratory genes.
    action: ACCEPT
    reason: This is the core activity of the yeast complex. The contributes_to qualifier
      is appropriate. HAP4 supplies the activation domains (PMID:16278450, PMID:15075264),
      and UniProt describes HAP2 as primarily structural, so HAP2 contributes the
      DNA-recognition and assembly functions of an activator complex. The activator
      direction is established in yeast. It should not be transferred automatically to
      relatives that lack a HAP4-type subunit.
    additional_reference_ids:
    - PMID:16278450
    - PMID:3547076
    supported_by:
