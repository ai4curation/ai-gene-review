suggested_questions:
- question: Does HAP2 also act in repression complexes (for example with HAP4-independent
    cofactors), as NF-YA does in metazoans, or is the yeast complex exclusively an activator?
- question: Is the CCAAT-binding factor that UniProt describes, citing PMID:11390369 (a
    Hap complex associated with Elongator), the same assembly as HAP2/3/5, or a
    differently named complex?
suggested_experiments:
- description: Genome-wide ChIP-exo of HAP2 under fermentative and respiratory growth,
    in wild type and hap4 deletion strains. This would separate HAP4-independent
    CCAAT occupancy and transcriptional effects from HAP4-dependent activation.
