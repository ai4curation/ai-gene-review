      supporting_text: HAP2 and HAP3 associate in the absence of DNA to form a multisubunit
        activation complex
    - reference_id: PMID:16278450
      supporting_text: The Hap4p subunit contains the transcriptional activation domain
        necessary for stimulating transcription after interacting with Hap2p/Hap3p/Hap5p.
