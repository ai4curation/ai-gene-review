gene_symbol: HAP2
organism: yeast
uniprot_id: P06774
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acts a component of the CCAT-binding factor, which is a transcriptional activator
    and binds to the upstream activation site (UAS2) of the CYC1 gene and other genes
    involved in mitochondrial electron transport and activates their expression. Recognizes
    the sequence 5'-CCAAT-3'. HAP2 has primarily a structural role in the HAP complexes
    I and II.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P06774
  source_id: P06774
- source: Alliance_Imported
  text: Subunit of the Hap2p/3p/4p/5p CCAAT-binding complex; complex is heme-activated
    and glucose-repressed; complex is a transcriptional activator and global regulator
    of respiratory gene expression; contains sequences sufficient for both complex
    assembly and DNA binding; respiratory defect of the null mutant is functionally
    complemented by human NFYA
  source_type: curated
  url: https://www.yeastgenome.org/locus/HAP2
  source_id: SGD:S000003206
- source: Alliance_Automated
  text: Contributes to DNA-binding transcription activator activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in positive regulation of transcription by RNA polymerase
    II and regulation of cellular respiration. Located in nucleus. Part of CCAAT-binding
    activity factor complex. Orthologous to human NFYA (nuclear transcription factor
    Y subunit alpha).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HAP2
  source_id: SGD:S000003206
