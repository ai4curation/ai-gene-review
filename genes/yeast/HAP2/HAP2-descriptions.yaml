- source: Alliance_Imported
  text: Subunit of the Hap2p/3p/4p/5p CCAAT-binding complex; complex is heme-activated
    and glucose-repressed; complex is a transcriptional activator and global regulator
    of respiratory gene expression; contains sequences sufficient for both complex
    assembly and DNA binding; respiratory defect of the null mutant is functionally
    complemented by human NFYA
