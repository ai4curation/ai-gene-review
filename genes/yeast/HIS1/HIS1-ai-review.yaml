  label: Saccharomyces cerevisiae S288C
description: 'ATP phosphoribosyltransferase (ATP-PRTase, EC 2.4.2.17) of Saccharomyces cerevisiae, a cytosolic
  HisG-family enzyme that catalyses the first and committed step of L-histidine biosynthesis: the Mg2+-dependent
  condensation of ATP and 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) to give N1-(5-phospho-beta-D-ribosyl)-ATP
  (PR-ATP) and diphosphate. The protein has the long-form HisG architecture (catalytic HisG domain plus
  C-terminal HisG_C regulatory domain), and by similarity to orthologues its activity is feedback inhibited
  by L-histidine, making it the main point at which flux through the pathway is controlled. his1 mutants
  are histidine auxotrophs, and HIS1 is one of the amino-acid biosynthetic genes under GCN4-mediated general
  amino acid control.'
