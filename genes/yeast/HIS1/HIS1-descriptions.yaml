descriptions:
- source: UniProt
  text: Catalyzes the condensation of ATP and 5-phosphoribose 1- diphosphate to form
    N'-(5'-phosphoribosyl)-ATP (PR-ATP). Has a crucial role in the pathway because
    the rate of histidine biosynthesis seems to be controlled primarily by regulation
    of the enzymatic activity (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00498
  source_id: P00498
- source: Alliance_Imported
  text: ATP phosphoribosyltransferase; a hexameric enzyme, catalyzes the first step
    in histidine biosynthesis; mutations cause histidine auxotrophy and sensitivity
    to Cu, Co, and Ni salts; transcription is regulated by general amino acid control
  source_type: curated
  url: https://www.yeastgenome.org/locus/HIS1
  source_id: SGD:S000000857
- source: Alliance_Automated
  text: Enables ATP phosphoribosyltransferase activity. Involved in L-histidine biosynthetic
    process. Predicted to be located in cytoplasm. Predicted to be active in cytosol.
  source_type: automated
  url: https://www.yeastgenome.org/locus/HIS1
  source_id: SGD:S000000857
