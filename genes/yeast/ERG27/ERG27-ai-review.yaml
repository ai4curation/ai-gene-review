    label: protein stabilization
  evidence_type: IMP
  original_reference_id: PMID:12842197
  qualifier: involved_in
  review:
    summary: Erg27 binds oxidosqualene cyclase Erg7 in lipid particles and protects it from proteolysis in the ER
      and LPs; in erg27 cells a truncated Erg7 mislocalises and its activity is lost, and wild-type ERG27 restores
      both. Erg27 itself performs the stabilising work (physical association), so this is participation, not mere
      requirement. It explains why erg27 mutants accumulate squalene/oxidosqualene rather than 3-keto sterols.
    action: NEW
    reason: Non-catalytic role of Erg27 documented experimentally but not represented in GOA; replaces the uninformative
      Erg7 "protein binding" rows.
