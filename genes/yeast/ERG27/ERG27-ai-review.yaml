    summary: Gachotte et al. 1999 isolated erg27 as a mutant unable to convert 3-keto to 3-hydroxy sterols; when
      fed lanosterol, erg27 accumulates 4-methylzymosterone, zymosterone and other 3-keto sterols. The GO term is
      written in the oxidative direction (3beta-hydroxysterol + NADP+), but the activity term covers the reversible
      reaction and Erg27 acts physiologically as the reductase.
