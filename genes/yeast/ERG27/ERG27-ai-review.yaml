id: Q12452
gene_symbol: ERG27
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG27 (YLR100W) encodes the 3-keto-steroid reductase (EC 1.1.1.270), an NADPH-dependent short-chain
  dehydrogenase/reductase of the HSD17B7/Erg27 subfamily. It completes each of the two C-4 demethylation rounds
  by reducing the 3-oxo group left by Erg26 decarboxylation back to the 3beta-hydroxyl, converting 3-dehydro-4-methylzymosterol
  to 4alpha-methylzymosterol and zymosterone to zymosterol. Erg27 is a peripheral ER membrane protein in the C-4
  demethylation complex with Erg25, Erg26 and the scaffold Erg28, and a minor pool sits on lipid particles. Separately
  from catalysis, Erg27 binds oxidosqualene cyclase Erg7 and protects it from degradation, so erg27 mutants lack
  Erg7 activity and accumulate squalene and oxidosqualenes; erg27 cells are ergosterol auxotrophs.
