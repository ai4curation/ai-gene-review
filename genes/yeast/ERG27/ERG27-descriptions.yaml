  text: 3-keto sterol reductase; catalyzes last of three steps required to remove
    two C-4 methyl groups from an intermediate in ergosterol biosynthesis; Erg27 protein
    is mainly ER-localized in strains devoid of mtDNA (rho° cells); mutants are sterol
    auxotrophs; mutation is functionally complemented by human HSD17B7
