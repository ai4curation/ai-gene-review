  text: Enables 3-beta-hydroxysteroid 3-dehydrogenase (NADP+) activity. Involved in
    ergosterol biosynthetic process. Located in endoplasmic reticulum membrane and
    lipid droplet. Part of catalytic complex. Is active in endoplasmic reticulum.
    Used to study steroid inherited metabolic disorder. Orthologous to human HSD17B7
    (hydroxysteroid 17-beta dehydrogenase 7).
