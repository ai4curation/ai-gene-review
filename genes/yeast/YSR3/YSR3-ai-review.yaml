suggested_questions:
- question: PMID:10531356 (human JBP1/PRMT5) is cited for the Ysr3 ER IDA annotation; what paper was intended?
- question: Should GO add a phytosphingosine-1-phosphate phosphatase activity term so that yeast long-chain base
    phosphate phosphatases are not annotated with sphingosine-1-phosphate phosphatase activity?
suggested_experiments:
- description: Compare purified Lcb3 and Ysr3 kinetics with DHS-1-P and PHS-1-P to test whether Ysr3 has a distinct
    substrate preference or is simply a lower-abundance redundant paralog.
