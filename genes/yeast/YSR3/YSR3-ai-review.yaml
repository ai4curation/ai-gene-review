taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ysr3 (Lbp2; YKR053C) is the minor of two long-chain base 1-phosphate phosphatases of Saccharomyces
  cerevisiae, an eight-transmembrane-helix endoplasmic reticulum membrane protein of the type 2 lipid phosphate
  phosphatase (PAP2) family and paralog of the major enzyme Lcb3/Ysr2. It dephosphorylates sphingoid base 1-phosphates
  such as dihydrosphingosine 1-phosphate (and phytosphingosine 1-phosphate) to free long-chain bases, which can
  then be acylated to ceramide. This phosphorylation-dephosphorylation cycle is required for efficient incorporation
  of exogenous sphingoid bases into sphingolipids and balances long-chain base phosphates against ceramide. ysr3
  single mutants have little phenotype, whereas lcb3 ysr3 double mutants accumulate dihydrosphingosine 1-phosphate;
  YSR3 is expressed at lower levels than LCB3.
