descriptions:
- source: UniProt
  text: Dihydrosphingosine 1-phosphate phosphatase required for efficient ceramide
    synthesis from exogenous sphingoid bases (PubMed:10477278, PubMed:10563329, PubMed:10856228,
    PubMed:9353337, PubMed:9419344). Involved in endocytosis and calcium-mediated
    signaling (PubMed:10856228).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23501
  source_id: P23501
- source: Alliance_Imported
  text: Dihydrosphingosine 1-phosphate phosphatase; membrane protein involved in sphingolipid
    metabolism; YSR3 has a paralog, LCB3, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/YSR3
  source_id: SGD:S000001761
- source: Alliance_Automated
  text: Enables dihydrosphingosine-1-phosphate phosphatase activity and sphingosine-1-phosphate
    phosphatase activity. Involved in phospholipid dephosphorylation and sphingolipid
    biosynthetic process. Located in endoplasmic reticulum membrane. Orthologous to
    human SGPP2 (sphingosine-1-phosphate phosphatase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/YSR3
  source_id: SGD:S000001761
