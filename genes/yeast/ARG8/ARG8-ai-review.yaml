  label: Saccharomyces cerevisiae S288C
description: Acetylornithine aminotransferase (ACOAT; EC 2.6.1.11) of Saccharomyces cerevisiae, a pyridoxal
  5'-phosphate-dependent class-III aminotransferase imported into the mitochondrial matrix via an N-terminal
  transit peptide. Arg8p transfers an amino group from L-glutamate to N-acetylglutamate 5-semialdehyde
  to form N2-acetyl-L-ornithine, the last step of the mitochondrial acetylated segment of arginine biosynthesis
  (ARG2/ARG5,6/ARG8/ARG7) that produces ornithine for export to the cytosolic citrulline/arginine steps.
  It is homologous to ornithine aminotransferases and can also transaminate ornithine in vitro, but this
  side activity is of little physiological importance.
