taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Allantoicase (allantoate amidinohydrolase, Dal2p, YIR029W), a cytosolic enzyme of the allantoicase
  family (two tandem allantoicase repeats with a galactose-binding-like fold) that hydrolyses allantoate
  to (S)-ureidoglycolate and urea (EC 3.5.3.4), the second step of allantoin degradation in S. cerevisiae.
  Dal2 enables use of allantoin as a secondary nitrogen source; its products are further degraded by ureidoglycolate
  lyase (Dal3) and urea amidolyase (Dur1,2). DAL2 lies in the DAL cluster on chromosome IX next to DCG1,
  is subject to nitrogen catabolite repression via UASNTR (GATA) elements, and is only weakly induced
  by allophanate, consistent with a mutant form of the upstream induction sequence in its promoter.
