suggested_questions:
- question: Does yeast Ser1 transaminate 4-phosphohydroxythreonine in vivo (UniProt lists this reaction),
    or is that bacterial PLP-pathway reaction irrelevant in S. cerevisiae, which makes PLP via SNZ/SNO?
suggested_experiments:
- description: Kinetic characterization of purified Ser1 with 3-phosphohydroxypyruvate versus 3-hydroxy-2-oxo-4-phosphonooxybutanoate
    to establish substrate preference.
