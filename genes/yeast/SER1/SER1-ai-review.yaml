  label: Saccharomyces cerevisiae S288C
description: SER1 (ADE9) encodes phosphoserine aminotransferase, a pyridoxal 5'-phosphate-dependent class-V
  aminotransferase that converts 3-phosphohydroxypyruvate and L-glutamate to O-phospho-L-serine and 2-oxoglutarate,
  the second step of the phosphorylated (glycolytic) pathway of L-serine biosynthesis between Ser3/Ser33
  and Ser2. ser1 mutants are serine auxotrophs on glucose, where the alternative glyoxylate route is repressed,
  and show an adenine bradytrophy because serine-derived glycine and one-carbon units feed purine synthesis
  (hence the ade9 allele). Ser1 is a soluble cytoplasmic homodimer whose expression is controlled by GCN4
  general amino acid control and by carbon and nitrogen source.
