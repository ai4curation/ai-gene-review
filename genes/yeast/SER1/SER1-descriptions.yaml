descriptions:
- source: UniProt
  text: Phosphoserine aminotransferase (PSAT) is a pyridoxal 5'- phosphate-dependent
    enzyme involved in the second step of the phosphorylated pathway of serine biosynthesis
    (PubMed:1326413). Catalyzes the reversible conversion of 3-phosphohydroxypyruvate
    to phosphoserine and of 3-hydroxy-2-oxo-4-phosphonooxybutanoate to phosphohydroxythreonine
    (PubMed:1326413). Plays an indirect role in purine biosynthesis (PubMed:10509016).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33330
  source_id: P33330
- source: Alliance_Imported
  text: 3-phosphoserine aminotransferase; catalyzes the formation of phosphoserine
    from 3-phosphohydroxypyruvate, required for serine and glycine biosynthesis; regulated
    by the general control of amino acid biosynthesis mediated by Gcn4p; protein abundance
    increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/SER1
  source_id: SGD:S000005710
- source: Alliance_Automated
  text: Enables O-phospho-L-serine:2-oxoglutarate transaminase activity. Involved
    in L-serine biosynthetic process and purine nucleobase biosynthetic process. Located
    in cytoplasm. Used to study Neu-Laxova syndrome 2 and PSAT deficiency. Human ortholog(s)
    of this gene implicated in Neu-Laxova syndrome 2 and PSAT deficiency. Orthologous
    to human PSAT1 (phosphoserine aminotransferase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SER1
  source_id: SGD:S000005710
