gene_symbol: MPS1
organism: yeast
uniprot_id: P54199
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in mitotic spindle assembly checkpoint signaling, a process that
    delays anaphase until chromosomes are bioriented on the spindle, and in the repair
    of incorrect mitotic kinetochore-spindle microtubule attachments (By similarity).
    Phosphorylates SPC105 on MELT motifs; phosphorylation is required for recruitment
    of the BUB1-BUB3 complex to kinetochores (PubMed:22521787). Phosphorylates CNN1,
    which contributes to the enrichment of CNN1 on anaphase kinetochores (PubMed:22561345).
    Implicated in spindle pole body (SPD) duplication. Phosphorylates the SPC29 and
    SPC110 spindle pole body components (PubMed:11278681, PubMed:19269975).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54199
  source_id: P54199
- source: Alliance_Imported
  text: Dual-specificity kinase; required for SPB duplication and mitotic and meiotic
    spindle checkpoints; triggers formation of force-generating kinetochore-microtubule
    (MT) attachments to promote kinetochore bi-orientation in MI; activation loop
    autophosphorylation enhances kinase activity; substrates include SPB proteins
    (Spc42p, Spc110p, Spc98p), MEN protein Mob1p, kinetochore protein Cnn1p, checkpoint
    protein Mad1p, and MT stabilization factor Stu1p; substrate of APCC(Cdh1); similar
    to human TTK
  source_type: curated
  url: https://www.yeastgenome.org/locus/MPS1
  source_id: SGD:S000002186
- source: Alliance_Automated
  text: Enables kinetochore binding activity and protein kinase activity. Involved
    in several processes, including centromere clustering; microtubule cytoskeleton
    organization; and sister chromatid biorientation. Acts upstream of or within meiotic
    spindle checkpoint signaling and mitotic spindle assembly checkpoint signaling.
    Located in kinetochore; peroxisome; and spindle pole body. Used to study bipolar
    disorder. Orthologous to human TTK (TTK protein kinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MPS1
  source_id: SGD:S000002186
