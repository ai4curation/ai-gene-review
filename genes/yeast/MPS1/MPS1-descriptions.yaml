- source: Alliance_Automated
  text: Enables kinetochore binding activity and protein kinase activity. Involved
    in several processes, including centromere clustering; microtubule cytoskeleton
    organization; and sister chromatid biorientation. Acts upstream of or within meiotic
    spindle checkpoint signaling and mitotic spindle assembly checkpoint signaling.
    Located in kinetochore; peroxisome; and spindle pole body. Used to study bipolar
    disorder. Orthologous to human TTK (TTK protein kinase).
