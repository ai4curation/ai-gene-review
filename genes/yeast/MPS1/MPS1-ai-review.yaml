  review:
    summary: >-
      High-throughput proteome-chip study in which purified yeast kinases, including Mps1, were used to
      phosphorylate arrayed proteins in vitro; Mps1 was among the kinases with detectable in vitro substrate
      phosphorylation.
    action: ACCEPT
    reason: >-
      Generic protein kinase activity is true for Mps1 and is a parent of the more informative dual-specificity
      (GO:0004712) and serine/threonine (GO:0004674) kinase rows that carry the targeted evidence. The
      in vitro chip assay is weak evidence for any particular physiological substrate, but the activity
      itself is beyond doubt.
    supported_by:
    - reference_id: PMID:16319894
      supporting_text: >-
        Here we describe, with the use of proteome chip technology, the in vitro substrates recognized
        by most yeast protein kinases: we identified over 4,000 phosphorylation events involving 1,325
        different proteins.
      reference_section_type: ABSTRACT
    - reference_id: PMID:7737118
      supporting_text: >-
        A mutation predicted to abolish kinase function not only eliminates in vitro protein kinase activity,
        but also behaves like a null mutation in vivo, suggesting that kinase activity contributes to
        the essential function of the protein.
      reference_section_type: ABSTRACT
