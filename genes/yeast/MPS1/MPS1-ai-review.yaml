gene_symbol: MPS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Mps1 (monopolar spindle 1, also Rpk1; YDL028C) is the essential dual-specificity protein kinase of Saccharomyces
  cerevisiae and the founding member of the Mps1/TTK kinase family, a 764-residue protein with a C-terminal
  catalytic domain (residues 440-720) preceded by a long, largely disordered N-terminal region that mediates
  localisation. It phosphorylates serine, threonine and, in vitro, tyrosine, but all mapped physiological
  sites are Ser/Thr, many of them threonines within MELT-like motifs. Mps1 acts at two intranuclear structures.
  At the spindle pole body it is required from the earliest step of SPB duplication, formation of the
  satellite adjacent to the existing pole, and phosphorylates the SPB components Spc42, Spc110 (Ser60,
  Thr64, Thr68) and Spc29; mps1 mutants form a single SPB and a monopolar spindle. At kinetochores, to
  which it is recruited by binding the N-terminal region of Ndc80 in the Ndc80 complex, Mps1 sits at the
  apex of the spindle assembly checkpoint: it phosphorylates the MELT motifs of the Knl1 orthologue Spc105
  to recruit Bub3-Bub1, phosphorylates Bub1 to recruit Mad1-Mad2, and phosphorylates Mad1, thereby driving
  assembly of the mitotic checkpoint complex that inhibits APC/C-Cdc20 and delays anaphase until every
  kinetochore is bioriented; overexpression of Mps1 arrests cells in mitosis with normal spindles, and
  PP1/Glc7 bound to Spc105 antagonises it to silence the checkpoint. The same Spc105-Bub1 phosphorylation
  module underlies a checkpoint-independent role in establishing sister-kinetochore biorientation by re-orienting
  attachments that lack tension, and Mps1 additionally phosphorylates Ndc80, the Dam1 complex and Cnn1
  to regulate kinetochore-microtubule coupling and kinetochore architecture, and phosphorylates MELT motifs
  in Stu1 to recruit Slk19 and cluster unattached kinetochores for microtubule capture. Mps1 autophosphorylation
  releases it from kinetochores, coupling attachment to checkpoint silencing. In meiosis Mps1 is required
  for both rounds of SPB duplication, for force-generating kinetochore-microtubule attachments and for
  maintaining the meiotic spindle checkpoint delay.
