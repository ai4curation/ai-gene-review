  review:
    summary: >-
      PAINT inference that Mps1 acts at the kinetochore, placed at the Mps1/TTK subfamily node (PTN001122082)
      and seeded by experimental kinetochore localisation in fly, mouse, fission yeast and S. cerevisiae
      MPS1 itself. In budding yeast Mps1-myc is seen at kinetochores by chromosome spreads and immuno-EM,
      wild-type Mps1 is enriched by ChIP-seq at the centromeres of all 16 chromosomes, and its kinetochore
      residence is required for both checkpoint signalling and biorientation.
