  evidence_type: IDA
  original_reference_id: PMID:11827982
  qualifier: located_in
  review:
    summary: >-
      Castillo et al. localised Mps1p-myc to SPBs and kinetochores by immunofluorescence, chromosome-spread
      colocalisation with the kinetochore protein Ndc10p, and immuno-EM at microtubule ends; this was
      the first direct demonstration of kinetochore localisation for yeast Mps1.
    action: ACCEPT
    reason: >-
      Direct in vivo localisation in S. cerevisiae, since corroborated by ChIP-seq centromere enrichment
      (PMID:32307893), reconstitution on purified kinetochore particles (PMID:31405987) and identification
      of Ndc80 as its kinetochore receptor (PMID:19300438). Kinetochore is a core site of Mps1 function.
    supported_by:
    - reference_id: PMID:11827982
      supporting_text: >-
        An epitope-tagged version of Mps1p (Mps1p-myc) localizes to SPBs and kinetochores by immunofluorescence
        microscopy and immuno-EM analysis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:11827982
      supporting_text: >-
        To better characterize Mps1p localization, we determined if Mps1p-myc colocalizes with the kinetochore
        protein Ndc10p using chromosome spread analysis.
      reference_section_type: RESULTS
