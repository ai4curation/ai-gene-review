suggested_questions:
- question: >-
    Which Mps1 phosphosites on Spc42, Spc29 and Spc110 are individually required for satellite formation
    and new-SPB assembly, given that Spc110 site mutants are only conditionally defective and the substrate
    that explains the mps1-1 satellite-formation block has not been identified?
- question: >-
    Is the peroxisomal signal reported for NOP1-promoter-driven Mps1-GFP in the high-content peroxi-ome
    screen reproducible at endogenous expression levels, and if so does a peroxisomal pool have any function
    or is it a sequestration artefact of overexpression?
- question: >-
    How is Mps1 kinase activity partitioned between the checkpoint (Spc105 MELT), biorientation (Ndc80,
    Dam1) and clustering (Stu1 MELT) outputs at a single unattached kinetochore, and does Ndc80-tail state
    or Dam1 occupancy of the Ndc80 hub gate substrate access rather than only Mps1 residence?
suggested_experiments:
- description: >-
    Phosphoproteomics of purified SPBs from mps1-as1 cells with and without inhibitor during G1 satellite
    formation, followed by phospho-null and phospho-mimetic mutagenesis of the Mps1-dependent sites on
    Spc42, Spc29 and Spc110 scored by electron tomography of the half-bridge and satellite.
  hypothesis: >-
    A small set of Mps1 phosphosites on Spc42 and Spc29 is jointly required for satellite nucleation,
    explaining the mps1-1 block at the earliest step of SPB duplication.
- description: >-
    Live-cell imaging of endogenously tagged Mps1 together with a peroxisomal marker across glucose and
    oleate growth, compared with the NOP1-promoter overexpression construct used in the peroxi-ome screen,
    and a pex5 or pex3 mutant to test targeting dependence.
  hypothesis: >-
    Peroxisomal localisation of Mps1 is an overexpression artefact and is not observed at endogenous levels.
