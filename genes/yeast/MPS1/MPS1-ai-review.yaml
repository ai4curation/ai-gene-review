    label: spindle assembly
  evidence_type: IMP
  original_reference_id: PMID:15668173
  qualifier: involved_in
  review:
    summary: >-
      Using the analogue-sensitive mps1-as1 allele, Jones et al. showed that inhibiting Mps1 after SPB
      duplication causes severe defects in mitotic spindle formation, sister-kinetochore positioning at
      metaphase and anaphase chromosome segregation, revealing a kinetochore-linked role in spindle assembly
