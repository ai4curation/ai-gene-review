- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0004708
  review:
    summary: >-
      Inter-ontology inference: this MAPK cascade process term was generated automatically from the MAP
      kinase kinase activity IEA (GO:0004708), which itself derives from the EC 2.7.12.2 (dual-specificity
      protein kinase) number that UniProt assigns to Mps1. Mps1 is not a MAP2K and no study places it
      in a MAPK cascade; its substrates are SPB components (Spc42, Spc110), kinetochore scaffolds (Spc105
      MELT motifs, Ndc80, Cnn1, Stu1, Dam1 complex) and checkpoint proteins (Bub1, Mad1).
    action: REMOVE
    reason: >-
      The annotation is a propagation artefact of the EC-number mapping and is biologically wrong for
      Mps1. Every characterised substrate and phenotype concerns spindle pole body duplication, kinetochore-microtubule
      attachment and the spindle assembly checkpoint; none involves a MAP3K-MAP2K-MAPK tier. Removing
      the upstream GO:0004708 mapping removes this row as well.
    supported_by:
    - reference_id: PMID:7737118
      supporting_text: >-
        Phosphoamino acid analysis of substrates phosphorylated by Mps1p indicates that this kinase can
        phosphorylate serine, threonine and tyrosine residues, identifying Mps1p as a dual specificity
        protein kinase.
      reference_section_type: ABSTRACT
    - reference_id: PMID:32307893
      supporting_text: >-
        The Mps1 kinase acts at the apex of the SAC signalling pathway, by phosphorylating the Knl1/Spc105
        kinetochore scaffold on its MELT repeats
      reference_section_type: INTRODUCTION
