core_functions:
- description: >-
    Spindle pole body duplication kinase: Mps1 localises to the SPB and phosphorylates the integral and
    inner-plaque components Spc42, Spc110 (Ser60, Thr64, Thr68) and Spc29, which is required for formation
    of the satellite at which the new SPB arises and for normal Spc42 assembly; without it cells build
    a single pole and a monopolar spindle.
  supported_by:
  - reference_id: PMID:1869587
    supporting_text: >-
