- term:
    id: GO:0110136
    label: protein-RNA complex remodeling
  evidence_type: IDA
  original_reference_id: PMID:20542003
  qualifier: involved_in
  review:
    summary: >-
      Ytm1 participates in the Rea1/Mdn1-dependent remodeling step that removes Ytm1-Erb1-Nop7
      from pre-60S particles.
    action: ACCEPT
    reason: >-
      Ytm1 is the Rea1-recognized MIDO/UBL ligand in this remodeling event. The ATPase does
      the mechanical work, but the Ytm1 interaction is the conserved handle required for ATP-dependent
      release of the subcomplex.
    supported_by:
    - reference_id: PMID:20542003
      supporting_text: Rea1 induces the release of the Ytm1-Erb1-Nop7 subcomplex from 
        the nascent 60S subunit and consequently enables this early pre-60S intermediate
        to exit from the nucleolus.
    - reference_id: PMID:36929751
      supporting_text: The AAA+-ATPase Rea1 participates in the nucleolar exit by 
        releasing the Ytm1-Erb1 heterodimer from the evolving pre-60S particle.
