id: Q12024
gene_symbol: YTM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  YTM1 encodes the conserved WD40-repeat/UBL ribosome biogenesis factor Ytm1. Ytm1 acts in
  the nucleolus as part of the Nop7-Erb1-Ytm1, PeBoW-like subcomplex on 66S/pre-60S particles,
  where its WD40 propeller binds Erb1 and helps assemble and stabilize the Nop7 subcomplex
  for 25S and 5.8S rRNA maturation. Its N-terminal MIDO/UBL region is later recognized by
  the AAA-ATPase Rea1, enabling ATP-dependent release of Ytm1-Erb1-Nop7 as nucleolar large-subunit
  precursors are remodeled and progress toward the nucleoplasm.
existing_annotations:
- term:
    id: GO:0000463
    label: maturation of LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S 
      rRNA, LSU-rRNA)
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000107549
  review:
    summary: >-
      Ytm1/WDR12-family proteins support 60S-subunit pre-rRNA maturation.
    action: ACCEPT
    reason: >-
      The UniRule annotation matches the conserved Nop7-Erb1-Ytm1/WDR12 role: the budding-yeast
      protein is required for efficient processing of 27S pre-rRNA intermediates during 25S/5.8S
      rRNA and large-subunit maturation.
    supported_by:
    - reference_id: PMID:16287855
      supporting_text: Mutations in the WD40 motifs of Ytm1 disrupt binding to Erb1, 
        destabilize the heterotrimer, and delay pre-rRNA processing and nuclear export 
        of preribosomes.
    - reference_id: PMID:18448671
      supporting_text: assembly of Nop7, Erb1, and Ytm1 into preribosomes is 
        interdependent.
- term:
    id: GO:0000466
    label: maturation of 5.8S rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S 
      rRNA, LSU-rRNA)
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000107549
  review:
    summary: >-
      Ytm1/WDR12-family proteins support the 5.8S branch of pre-60S rRNA maturation.
    action: ACCEPT
    reason: >-
      Ytm1 acts in 66S/pre-60S particles containing 27S and 7S pre-rRNAs, so the UniRule 5.8S
      rRNA maturation annotation is consistent with the direct yeast perturbation and Nop7-subcomplex
      assembly evidence.
    supported_by:
    - reference_id: PMID:16287855
      supporting_text: Ytm1 binds directly to Erb1 and is present in a heterotrimeric 
        subcomplex together with Erb1 and Nop7, both within preribosomes and 
        independently of preribosomes.
    - reference_id: PMID:16287855
      supporting_text: Mutations in the WD40 motifs of Ytm1 disrupt binding to Erb1, 
        destabilize the heterotrimer, and delay pre-rRNA processing and nuclear export 
        of preribosomes.
