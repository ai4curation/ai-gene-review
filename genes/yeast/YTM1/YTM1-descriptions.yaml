gene_symbol: YTM1
organism: yeast
uniprot_id: Q12024
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Component of the NOP7 complex, which is required for maturation of the 25S
    and 5.8S ribosomal RNAs and formation of the 60S ribosome.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12024
  source_id: Q12024
- source: Alliance_Imported
  text: Ribosomal assembly factor and 66S pre-ribosomal particle constituent; subunit
    of the Nop7-subcomplex (PeBoW complex), required for an early nucleolar step in
    pre-60S ribosomal particle maturation; interaction of its ubiquitin-like (UBL)
    domain with the MIDAS domain in the Rea1p tail triggers release of the subcomplex
    and possibly other biogenesis factors via cycles of ATP hydrolysis; involved in
    the processing of 27S pre-rRNA; contains an N-terminal UBL domain and seven C-terminal
    WD repeats
  source_type: curated
  url: https://www.yeastgenome.org/locus/YTM1
  source_id: SGD:S000005798
- source: Alliance_Automated
  text: Predicted to enable ribonucleoprotein complex binding activity. Involved in
    chromosome organization; protein-RNA complex remodeling; and ribosome biogenesis.
    Located in nucleolus. Part of PeBoW complex and preribosome, large subunit precursor.
    Orthologous to human WDR12 (WD repeat domain 12).
  source_type: automated
  url: https://www.yeastgenome.org/locus/YTM1
  source_id: SGD:S000005798
