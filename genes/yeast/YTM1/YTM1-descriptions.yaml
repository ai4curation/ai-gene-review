- source: Alliance_Imported
  text: Ribosomal assembly factor and 66S pre-ribosomal particle constituent; subunit
    of the Nop7-subcomplex (PeBoW complex), required for an early nucleolar step in
    pre-60S ribosomal particle maturation; interaction of its ubiquitin-like (UBL)
    domain with the MIDAS domain in the Rea1p tail triggers release of the subcomplex
    and possibly other biogenesis factors via cycles of ATP hydrolysis; involved in
    the processing of 27S pre-rRNA; contains an N-terminal UBL domain and seven C-terminal
    WD repeats
