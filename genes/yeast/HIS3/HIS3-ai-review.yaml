  label: Saccharomyces cerevisiae S288C
description: Imidazoleglycerol-phosphate dehydratase (IGPD, EC 4.2.1.19) of Saccharomyces cerevisiae,
  the HisB orthologue. It catalyses step 6 of L-histidine biosynthesis, the Mn2+-dependent dehydration
  of D-erythro-imidazole glycerol phosphate to imidazole-acetol phosphate. The enzyme assembles into a
  24-mer with 432 symmetry with two Mn2+ ions in each active site, and is the target of triazole-phosphonate
  inhibitors and of the competitive inhibitor 3-amino-1,2,4-triazole used in yeast genetics. HIS3 is a
  cytosolic enzyme induced by histidine starvation through GCN4; the HIS3 gene is widely used as a selectable
  auxotrophic marker.
