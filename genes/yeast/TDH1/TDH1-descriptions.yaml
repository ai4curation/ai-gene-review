descriptions:
- source: UniProt
  text: Glyceraldehyde-3-phosphate dehydrogenase (GAPDH) involved in glycolysis and
    gluconeogenesis (PubMed:2999100). Catalyzes the reaction of glyceraldehyde-3-phosphate
    to 1,3 bis-phosphoglycerate (PubMed:3905788). The contribution of the TDH1, TDH2,
    and TDH3 to the total glyceraldehyde-3-phosphate dehydrogenase activity is 10-15,
    25- 30, and 50-60%, respectively (PubMed:3905788). May be involved in a process
    other than glycolysis because it is synthesized by cells in stationary phase (PubMed:7875559).
    . As a side activity, catalyzes the hydration of the nicotinamide ring of NADH
    or NADPH at the C6 position to give the corresponding hydrates, NADHX and NADPHX,
    which exist as R and S epimers, that cannot act as electron donors or acceptors
    and inhibit several dehydrogenases, making them toxic.
