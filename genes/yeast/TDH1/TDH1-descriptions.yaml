descriptions:
- source: UniProt
  text: Glyceraldehyde-3-phosphate dehydrogenase (GAPDH) involved in glycolysis and
    gluconeogenesis (PubMed:2999100). Catalyzes the reaction of glyceraldehyde-3-phosphate
    to 1,3 bis-phosphoglycerate (PubMed:3905788). The contribution of the TDH1, TDH2,
    and TDH3 to the total glyceraldehyde-3-phosphate dehydrogenase activity is 10-15,
    25- 30, and 50-60%, respectively (PubMed:3905788). May be involved in a process
    other than glycolysis because it is synthesized by cells in stationary phase (PubMed:7875559).
    . As a side activity, catalyzes the hydration of the nicotinamide ring of NADH
    or NADPH at the C6 position to give the corresponding hydrates, NADHX and NADPHX,
    which exist as R and S epimers, that cannot act as electron donors or acceptors
    and inhibit several dehydrogenases, making them toxic.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00360
  source_id: P00360
- source: Alliance_Imported
  text: Glyceraldehyde-3-phosphate dehydrogenase (GAPDH), isozyme 1; involved in glycolysis
    and gluconeogenesis; tetramer that catalyzes the reaction of glyceraldehyde-3-phosphate
    to 1,3 bis-phosphoglycerate; detected in the cytoplasm and cell wall; protein
    abundance increases in response to DNA replication stress; GAPDH-derived antimicrobial
    peptides secreted by S. cerevisiae are active against a wide variety of wine-related
    yeasts and bacteria
  source_type: curated
  url: https://www.yeastgenome.org/locus/TDH1
  source_id: SGD:S000003588
- source: Alliance_Automated
  text: Enables glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating)
    activity and melatonin binding activity. Involved in gluconeogenesis and glycolytic
    process. Located in several cellular components, including fungal-type cell wall;
    lipid droplet; and mitochondrion. Human ortholog(s) of this gene implicated in
    Alzheimer's disease. Orthologous to several human genes including GAPDH (glyceraldehyde-3-phosphate
    dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TDH1
