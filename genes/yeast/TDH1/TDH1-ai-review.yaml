suggested_questions:
- question: Does stationary-phase Tdh1 have a distinct role (e.g. in quiescence or stress survival) beyond supplementing GAPDH
    activity, given that its expression is uncoupled from Tdh2/Tdh3?
suggested_experiments:
- description: Compare chronological lifespan and stress survival of tdh1 single mutants and strains in which TDH1 is replaced
    by TDH2/TDH3 coding sequence under the TDH1 promoter, to test isoform-specific versus dosage roles.
