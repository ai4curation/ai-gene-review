gene_symbol: TDH1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Glyceraldehyde-3-phosphate dehydrogenase 1 (Tdh1, YJL052W) is one of three paralogous NAD+-dependent phosphorylating
  glyceraldehyde-3-phosphate dehydrogenases (GAPDH, EC 1.2.1.12; TDH1, TDH2, TDH3) of Saccharomyces cerevisiae. These homotetrameric
  enzymes catalyse the reversible oxidative phosphorylation of D-glyceraldehyde 3-phosphate to 1,3-bisphosphoglycerate with
  reduction of NAD+ to NADH, the sixth step of glycolysis and an obligatory step of gluconeogenesis. Tdh1 is the minor isoform,
  contributing about 10-15% of cellular GAPDH activity in exponentially growing cells; its expression rises in stationary
  phase, on glucose starvation and after heat shock, and the polypeptide is readily detected only in stationary-phase cells.
  Tdh1 is cytosolic, and like its paralogs is also found in cell-wall extracts, with minor pools co-purifying with mitochondria
  and lipid particles. A slow NAD(P)H-hydratase side activity is recorded for yeast GAPDH.
