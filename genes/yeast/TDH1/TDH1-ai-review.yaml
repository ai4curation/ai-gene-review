    label: melatonin binding
  evidence_type: IDA
  original_reference_id: PMID:31708896
  qualifier: enables
  review:
    summary: Morcillo-Parra et al. immunopurified melatonin-associated proteins from fermenting cells with anti-melatonin
      IgG beads and identified Tdh1/2/3 by MS in one gel band. This is an affinity co-purification without a defined binding
      site, stoichiometry or physiological effect on TDH1.
    action: MARK_AS_OVER_ANNOTATED
    reason: Affinity co-purification of abundant GAPDH paralogs is weak support for a specific melatonin-binding activity;
      the experimental report is retained but likely overstates a physiologic molecular function.
    supported_by:
    - reference_id: PMID:31708896
      supporting_text: 'Surprisingly, most of the proteins identified participate in the glycolytic pathway: pyruvate kinase
        1 (Pyk2p; band a), enolase (Eno1p, Eno2p; band c), fructose biphosphate aldolase (Fba1p; band d), and glyceraldehyde-3-phosphate
        dehydrogenase (Tdh1p, Tdh2p, Tdh3p; band f).'
    - reference_id: PMID:31708896
      supporting_text: We subsequently performed immunopurification melatonin-IgG-Dynabeads and identified a set of proteins
        that interact with melatonin inside the cell.
