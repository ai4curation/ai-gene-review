taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: E2 component (Kgd2p, YDR148C; dihydrolipoyllysine-residue succinyltransferase, KE2) of the mitochondrial
  2-oxoglutarate dehydrogenase complex (KGDH). Kgd2 carries a covalently attached lipoyl group and forms the oligomeric
  core of the complex to which the E1 Kgd1 and, via the adaptor Kgd4, the E3 Lpd1 bind. It transfers the succinyl
  group from the S-succinyldihydrolipoyl arm to coenzyme A, producing succinyl-CoA in the TCA cycle in the mitochondrial
  matrix (EC 2.3.1.61). kgd2 mutants lack KGDH activity and are respiratory-deficient. KGD2 is glucose-repressed
  and HAP2/3-activated. Kgd2 also associates with mitochondrial nucleoids and crosslinks to mtDNA, and its loss
  enhances mtDNA instability in abf2 mutants.
