descriptions:
- source: UniProt
  text: 'The 2-oxoglutarate dehydrogenase complex catalyzes the overall conversion
    of 2-oxoglutarate to succinyl-CoA and CO(2). It contains multiple copies of three
    enzymatic components: 2-oxoglutarate dehydrogenase (E1), dihydrolipoamide succinyltransferase
    (E2) and lipoamide dehydrogenase (E3).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P19262
  source_id: P19262
- source: Alliance_Imported
  text: Dihydrolipoyl transsuccinylase; component of the mitochondrial alpha-ketoglutarate
    dehydrogenase complex, which catalyzes the oxidative decarboxylation of alpha-ketoglutarate
    to succinyl-CoA in the TCA cycle; phosphorylated
  source_type: curated
  url: https://www.yeastgenome.org/locus/KGD2
  source_id: SGD:S000002555
- source: Alliance_Automated
  text: Enables dihydrolipoyllysine-residue succinyltransferase activity. Involved
    in 2-oxoglutarate metabolic process and cellular respiration. Located in mitochondrial
    nucleoid. Part of oxoglutarate dehydrogenase complex. Human ortholog(s) of this
    gene implicated in Alzheimer's disease and pheochromocytoma/paraganglioma syndrome
    7. Orthologous to human DLST (dihydrolipoamide S-succinyltransferase).
  source_type: automated
