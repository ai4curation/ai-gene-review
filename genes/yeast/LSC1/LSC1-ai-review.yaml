  review:
    action: REMOVE
    summary: IBA from PANTHER PTN000122012, the root (LUCA) node of the alpha-subunit family, seeded by animal
      and Dictyostelium alpha subunits and by E. coli and P. aeruginosa SucD. The term is true of those seeds
      but not of Lsc1, whose only partner is the ADP-specific Lsc2 and whose enzyme does not use GTP.
    reason: Whether an alpha subunit takes part in GDP-forming activity is decided by its beta partner, not by
      the alpha subunit. The seeds fall in two groups. The animal and Dictyostelium alpha subunits pair with a
      G-type beta subunit (SUCLG2 lineage) that carries Gln at the nucleotide-specificity position; the E. coli
      and P. aeruginosa enzymes have a single beta subunit that accepts both nucleotides. Neither holds in
      fungi. The beta subunit duplicated before animals, fungi and amoebozoa diverged, and fungi kept only the
      A-type copy; S. cerevisiae has one alpha (Lsc1) and one beta (Lsc2, ortholog of SUCLA2), and 14 of the 15
      fungal genomes in the PANTHER tree have no G-type beta gene. The yeast enzyme was assayed and uses ATP but
      not GTP. The node placement is defensible for the family, but the fungal branch (PTN000874203) has lost
      the function and needs pruning there; this is an argument about the node, not about the number of donors.
      S. pombe SPAC16E8.17c inherits the same row and, lacking a direct assay, is marked as over-annotated.
    supported_by:
    - reference_id: PMID:9874242
      supporting_text: The yeast succinyl-CoA ligase was shown to utilize ATP but not GTP for succinyl-CoA synthesis
    - reference_id: PMID:9765290
      supporting_text: Because the two succinyl-CoA synthetases incorporate the same alpha-subunit, the determinants
