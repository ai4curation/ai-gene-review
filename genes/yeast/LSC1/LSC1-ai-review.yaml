  review:
    action: REMOVE
    summary: IBA from PANTHER PTN000122012, the LUCA node of the alpha-subunit family, seeded by animal
      and Dictyostelium alpha subunits and by E. coli and P. aeruginosa SucD. The term is true of those seeds
      but not of Lsc1, whose only partner is the A-type beta subunit Lsc2 and whose enzyme used ATP but not GTP
      when assayed.
    reason: Whether an alpha subunit takes part in GDP-forming activity is decided by its beta partner, not by
      the alpha subunit. The seeds fall in two groups. The animal and Dictyostelium alpha subunits come from
      genomes that encode a G-type beta subunit (SUCLG2 lineage), and the enzyme purified from Dictyostelium
      uses GTP; the E. coli and P. aeruginosa enzymes have a single beta subunit that accepts both nucleotides.
      Neither holds in S. cerevisiae, which encodes one alpha subunit (Lsc1) and one beta subunit (Lsc2), of the
      A-type (SUCLA2) lineage. The 15 fungal genomes in the PANTHER tree (14 Dikarya and one chytrid) have no
      G-type beta gene. This is not a property of all fungi. Mortierellomycota, Basidiobolus and Rozella keep
      a SUCLG2-type gene, so the G-type gene was lost within fungi. Within Dikarya one Taphrinomycotina species,
      Saitoella complicata, also has a Gln20 SUCLG2-type entry (A0A0E9NQG5); it groups with the Mortierellomycota
      genes only weakly, so vertical retention, transfer and contamination are not distinguished and its origin
      is unresolved. In isolated mitochondria the yeast enzyme
      used ATP but not GTP for succinyl-CoA synthesis; the result is qualitative and known here from the abstract
      only, so a low residual GTP activity is not excluded by the assay alone, and the removal rests on the assay
      together with the genome (one beta gene, of the A-type lineage whose assayed animal member also excludes
      GTP). The node placement is defensible for the family, but the term does not hold for the fungal genomes
      under PTN000874203 and needs pruning there; this is an argument about the node, not about the number of
      donors. S. pombe SPAC16E8.17c inherits the same row and, lacking a direct assay, is marked as over-annotated.
      An OpenScientist run given this hypothesis read the same public evidence the same way (it calls GO:0004776
      an over-annotation on yeast Lsc1) and also notes that the assay is qualitative; it is a second reading of
      the evidence, not independent support.
    supported_by:
    - reference_id: PMID:9874242
      supporting_text: The yeast succinyl-CoA ligase was shown to utilize ATP but not GTP for succinyl-CoA synthesis
    - reference_id: PMID:9765290
      supporting_text: Because the two succinyl-CoA synthetases incorporate the same alpha-subunit, the determinants
        of nucleotide specificity must reside within the beta-subunit
    - reference_id: PMID:7771809
      supporting_text: We have previously shown that the enzyme purified from growing D. discoideum is a GTP-utilizing
        enzyme
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: S. cerevisiae and S. pombe each encode one beta subunit, of the A type, so their alpha subunits
        have no SUCLG2-type partner.
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: The 15 fungal genomes in the PANTHER tree (14 Dikarya and the chytrid Batrachochytrium dendrobatidis)
        have an A-type beta gene and no G-type beta gene.
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: Yeast LSC2 is therefore best read as the ortholog of animal SUCLA2 and a paralog of animal SUCLG2.
    - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      supporting_text: The fungal alpha-subunit clade is node PTN000874203 (21 leaves), on the path from the root to LSC1.
    - reference_id: PMID:36012783
      supporting_text: Because in yeast, succinyl-CoA ligase produces ATP instead of GTP
    - reference_id: file:yeast/LSC1/LSC1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=succinate + ATP + CoA = succinyl-CoA + ADP + phosphate;
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - LINEAGE_OR_TAXON_MISMATCH
      residue_claims_not_applicable: Nucleotide specificity is determined by which beta subunit partners the shared
        alpha subunit, not by residues in the alpha subunit itself.
      source_entities:
      - source_id: PANTHER:PTN000122012
        source_label: succinyl-CoA synthetase alpha subunit LUCA node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Sound for alpha subunits whose genome supplies a GDP-accepting beta subunit (animals, Dictyostelium,
          E. coli, P. aeruginosa). The fungal genomes under PTN000874203 in the PANTHER tree have no G-type beta
          gene, so the term should stop at that node. Early-diverging fungi outside that sample keep a SUCLG2-type
          gene, so the stop is for the genomes under the node, not for the kingdom.
