taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Alpha subunit (Lsc1p, YOR142W) of mitochondrial succinyl-CoA ligase (succinyl-CoA synthetase, EC 6.2.1.5),
  an alpha/beta heterodimer with Lsc2. The enzyme catalyses the only substrate-level phosphorylation of the TCA
  cycle, converting succinyl-CoA, ADP and phosphate to succinate, ATP and CoA. The alpha subunit binds CoA and phosphate
  and carries the phosphohistidine intermediate, while nucleotide specificity resides in the beta subunit; the yeast
  enzyme uses ATP but not GTP. LSC1 is glucose-repressed and induced on non-fermentable carbon sources. Deletion
  abolishes mitochondrial succinyl-CoA ligase activity and impairs growth on glycerol or pyruvate, but, unlike other
  TCA mutants, does not prevent growth on acetate.
