  review:
    action: REMOVE
    summary: IBA from PANTHER PTN000122012 (succinyl-CoA synthetase alpha clade; donors include rat Suclg1, pig
      and E. coli SucD). The alpha subunit is shared by ATP- and GTP-specific enzymes in animals, where nucleotide
      specificity is set by alternative beta subunits. S. cerevisiae has a single, ATP-specific beta subunit (Lsc2)
      and the purified yeast mitochondrial enzyme uses ATP but not GTP, so the GDP-forming activity is directly
      contradicted for this organism.
    supported_by:
    - reference_id: PMID:9874242
      supporting_text: The yeast succinyl-CoA ligase was shown to utilize ATP but not GTP for succinyl-CoA synthesis
    - reference_id: file:yeast/LSC1/LSC1-uniprot.txt
      supporting_text: Reaction=succinate + ATP + CoA = succinyl-CoA + ADP + phosphate;
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - LINEAGE_OR_TAXON_MISMATCH
      residue_claims_not_applicable: Nucleotide specificity is determined by which beta subunit partners the shared
        alpha subunit, not by residues in the alpha subunit itself.
      source_entities:
      - source_id: PANTHER:PTN000122012
        source_label: succinyl-CoA synthetase alpha subunit node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Alpha subunits in animals partner both ATP- (SUCLA2) and GTP-specific (SUCLG2) beta subunits; S.
          cerevisiae has only the ATP-specific Lsc2.
