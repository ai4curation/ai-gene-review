knowledge_gaps:
- gap_statement: Why loss of Lsc1 destabilises mitochondrial DNA is not established. It is unknown whether the
    cause is hypersuccinylation of nucleoid proteins such as Abf2 when succinyl-CoA accumulates, loss of
    nucleoid-bound Lsc1 itself, or the respiratory defect of the mutant.
  boundary: 'Established: Lsc1 is among the proteins cross-linked to mtDNA in organello; lsc1 deletion raises overall
    protein succinylation about 3-fold; succinylation of Abf2 in vitro inhibits its DNA binding; a large-scale
    survey recorded a raised petite frequency for the lsc1 deletion, which SGD curates as increased spontaneous
    loss of the mitochondrial genome. Not established: which of these links the enzyme to mtDNA maintenance, and
    whether Lsc1 has any function at the nucleoid.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
