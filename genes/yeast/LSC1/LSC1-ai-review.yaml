    supporting_text: Disruption of Lsc1p, a succinyl-CoA ligase, leads to an approximate 3-fold increase in overall
      protein succinylation
  - reference_id: PMID:34480900
    supporting_text: Abf2p succinylation in vitro inhibits its DNA-binding activity
suggested_questions:
- question: Do the early-diverging fungi that keep a SUCLG2-type beta gene (Mortierellomycota, Basidiobolus, Rozella;
    also the ascomycete Saitoella complicata, whose Gln20 gene is of unresolved origin)
    have a GDP-forming succinyl-CoA synthetase? No enzyme from these fungi has been assayed, and the Blastocystis
    enzyme shows that Gln at position 20 of the beta subunit does not by itself give GTP specificity.
- question: Does the second Ustilago maydis beta-like protein (A0A0D1E3R8, UMAG_01904) pair with an alpha subunit
    at all? PANTHER places it in the SUCLG2 clade, but it lacks the ATP-grasp domain and both sequence trees place
    it with prokaryotic sequences, so it is not evidence of a GDP-forming enzyme in a fungus of the Dikarya.
- question: Should PAINT stop succinate-CoA ligase (GDP-forming) activity (GO:0004776) at the fungal alpha-subunit
    node PTN000874203, whose genomes in the PANTHER tree all lack a SUCLG2-type beta gene, and how should alpha
    subunits of early-diverging fungi that keep such a gene be treated if they are added to the tree?
- question: Lsc1 cross-links to mtDNA in organello, lsc1 deletion raises overall protein succinylation about 3-fold
    and is recorded with a raised frequency of mitochondrial genome loss, and succinylation of Abf2 lowers its
    DNA binding in vitro. Is the mtDNA effect due to hypersuccinylation of nucleoid proteins, to loss of nucleoid-bound
    Lsc1, or to the respiratory defect, and is the nucleoid association independent of catalysis, as proposed
    for aconitase?
suggested_experiments:
- hypothesis: The yeast alpha subunit is nucleotide-agnostic, so supplying a G-type beta subunit is enough to give
    yeast a GDP-forming succinyl-CoA synthetase.
  description: Express a mitochondrially targeted animal G-type beta subunit (SUCLG2) in an lsc2 deletion strain
    and assay ADP- and GDP-dependent succinyl-CoA synthetase activity in isolated mitochondria, with the reciprocal
    swap of position 20 (Pro to Gln) in Lsc2 as a second test.
- hypothesis: The mtDNA instability of lsc1 mutants is caused by succinyl-CoA accumulation and hypersuccinylation
    of nucleoid proteins, and not by loss of nucleoid-bound Lsc1 protein.
  description: Compare the frequency of mtDNA loss and the succinylation of Abf2 in an lsc1 deletion, in a strain
    expressing catalytically dead Lsc1 (substitution of the phosphohistidine, His284 of the precursor) and in an
    lsc2 deletion that leaves Lsc1 in place. Test whether the catalytically dead protein still co-purifies with
    mtDNA nucleoids and whether Abf2 with lysine-to-arginine substitutions at its succinylation sites suppresses
    the mtDNA loss.
