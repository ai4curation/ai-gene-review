core_functions:
- description: Alpha (CoA/phosphate-binding, phosphohistidine) subunit of the ATP-specific mitochondrial succinyl-CoA
    synthetase; contributes to conversion of succinyl-CoA to succinate with ATP formation in the TCA cycle. The
    alpha subunit is nucleotide-agnostic; ATP specificity comes from its only partner, the A-type beta subunit Lsc2.
  contributes_to_molecular_function:
    id: GO:0004775
    label: succinate-CoA ligase (ADP-forming) activity
  directly_involved_in:
  - id: GO:0006099
    label: tricarboxylic acid cycle
  locations:
  - id: GO:0005739
    label: mitochondrion
  in_complex:
    id: GO:0009361
    label: succinate-CoA ligase complex (ADP-forming)
  supported_by:
  - reference_id: PMID:9874242
    supporting_text: Succinyl-CoA ligase activity was absent in mitochondria isolated from strains deleted for one
      or both LSC genes, but activity was restored by the presence of the appropriate LSC gene on a plasmid
  - reference_id: PMID:9874242
    supporting_text: The yeast succinyl-CoA ligase was shown to utilize ATP but not GTP for succinyl-CoA synthesis
  - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
    supporting_text: Every fungal genome has one or two alpha-subunit genes; S. cerevisiae has exactly one alpha (LSC1)
      and one beta (LSC2).
suggested_questions:
- question: Does any fungus still have a GDP-forming succinyl-CoA synthetase? PANTHER places a second, divergent
    Ustilago maydis protein (A0A0D1E3R8) on the SUCLG2 side of the beta-subunit duplication, but its position is
    unstable between tree methods and it has Ala at the nucleotide-specificity position; does it pair with the alpha
    subunit at all?
- question: Should PAINT stop succinate-CoA ligase (GDP-forming) activity (GO:0004776) at the fungal alpha-subunit
    node PTN000874203, mirroring the loss of the G-type beta paralog on the beta-subunit tree (PTHR11815)?
- question: What does the association of Lsc1 with the mitochondrial nucleoid do, and is it independent of succinyl-CoA
    synthetase activity, as the nucleoid role of aconitase is independent of catalysis?
suggested_experiments:
- hypothesis: The yeast alpha subunit is nucleotide-agnostic, so supplying a G-type beta subunit is enough to give
    yeast a GDP-forming succinyl-CoA synthetase.
  description: Express a mitochondrially targeted animal G-type beta subunit (SUCLG2) in an lsc2 deletion strain
    and assay ADP- and GDP-dependent succinyl-CoA synthetase activity in isolated mitochondria, with the reciprocal
    swap of position 20 (Pro to Gln) in Lsc2 as a second test.
- hypothesis: Nucleoid association of Lsc1 is a moonlighting role separable from catalysis.
