id: P53598
gene_symbol: LSC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Alpha subunit (Lsc1p, YOR142W) of mitochondrial succinyl-CoA ligase (succinyl-CoA synthetase, EC 6.2.1.5),
  an alpha/beta heterodimer with Lsc2. The enzyme catalyses the only substrate-level phosphorylation of the TCA
  cycle, converting succinyl-CoA, ADP and phosphate to succinate, ATP and CoA. The alpha subunit binds CoA and phosphate
  and carries the phosphohistidine intermediate, while nucleotide specificity resides in the beta subunit; the yeast
  enzyme uses ATP but not GTP. LSC1 is glucose-repressed and induced on non-fermentable carbon sources. Deletion
  abolishes mitochondrial succinyl-CoA ligase activity and impairs growth on glycerol or pyruvate, while growth
  on acetate is retained on minimal medium, as for idh1 and kgd1 mutants, through the glyoxylate cycle, and is impaired
  on rich acetate medium. Lsc1 is a soluble protein of the mitochondrial matrix and is also recovered with mitochondrial
  DNA nucleoids. Lsc1 is the single-copy ortholog of the animal alpha subunit SUCLG1. Animals pair that one alpha
  subunit with an ADP-specific (SUCLA2) or a GDP-specific (SUCLG2) beta subunit; S. cerevisiae encodes a single beta
  subunit, Lsc2, of the SUCLA2 lineage, so the yeast enzyme makes ATP only.
