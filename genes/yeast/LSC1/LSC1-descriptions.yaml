descriptions:
- source: UniProt
  text: Succinyl-CoA synthetase functions in the citric acid cycle (TCA), coupling
    the hydrolysis of succinyl-CoA to the synthesis of ATP and thus represents the
    only step of substrate-level phosphorylation in the TCA (PubMed:9874242). The
    alpha subunit of the enzyme binds the substrates coenzyme A and phosphate, while
    succinate binding and nucleotide specificity is provided by the beta subunit (By
    similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53598
  source_id: P53598
- source: Alliance_Imported
  text: Alpha subunit of succinyl-CoA ligase; succinyl-CoA ligase is a mitochondrial
    enzyme of the TCA cycle that catalyzes the nucleotide-dependent conversion of
    succinyl-CoA to succinate; phosphorylated
  source_type: curated
  url: https://www.yeastgenome.org/locus/LSC1
  source_id: SGD:S000005668
- source: Alliance_Automated
  text: Contributes to succinate-CoA ligase (ADP-forming) activity. Involved in succinyl-CoA
    metabolic process. Located in mitochondrial nucleoid. Human ortholog(s) of this
    gene implicated in mitochondrial DNA depletion syndrome 9. Orthologous to human
    SUCLG1 (succinate-CoA ligase GDP/ADP-forming subunit alpha).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LSC1
  source_id: SGD:S000005668
