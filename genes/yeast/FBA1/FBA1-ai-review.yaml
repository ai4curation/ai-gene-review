  label: Saccharomyces cerevisiae S288C
description: FBA1 encodes the sole fructose-1,6-bisphosphate aldolase of Saccharomyces cerevisiae, a homodimeric
  class II (zinc-dependent) aldolase (EC 4.1.2.13). Fba1 reversibly cleaves fructose 1,6-bisphosphate
  into dihydroxyacetone phosphate and glyceraldehyde 3-phosphate during glycolysis and catalyses the reverse
  aldol condensation during gluconeogenesis. It is one of the most abundant cytosolic proteins and a major
  cellular zinc-binding protein. Loss of FBA1 abolishes aldolase activity, so mutants cannot grow on carbon
  sources entering on only one side of the aldolase reaction; the yeast enzyme can be functionally replaced
  by unrelated heterologous aldolases. Small fractions of Fba1 have been found associated with mitochondria.
