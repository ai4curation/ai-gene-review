descriptions:
- source: UniProt
  text: Catalyzes the aldol condensation of dihydroxyacetone phosphate (DHAP or glycerone-phosphate)
    with glyceraldehyde 3-phosphate (G3P) to form fructose 1,6-bisphosphate (FBP)
    in gluconeogenesis and the reverse reaction in glycolysis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P14540
  source_id: P14540
- source: Alliance_Imported
  text: Fructose 1,6-bisphosphate aldolase; required for glycolysis and gluconeogenesis;
    catalyzes conversion of fructose 1,6 bisphosphate to glyceraldehyde-3-P and dihydroxyacetone-P;
    locates to mitochondrial outer surface upon oxidative stress; N-terminally propionylated
    in vivo
  source_type: curated
  url: https://www.yeastgenome.org/locus/FBA1
  source_id: SGD:S000001543
- source: Alliance_Automated
  text: Enables fructose-bisphosphate aldolase activity and melatonin binding activity.
    Involved in canonical glycolysis and gluconeogenesis. Located in cytosol and mitochondrion.
  source_type: automated
  url: https://www.yeastgenome.org/locus/FBA1
  source_id: SGD:S000001543
