descriptions:
- source: UniProt
  text: Acyl-CoA-independent ceramide synthase that catalyzes the conversion of dihydroceramide
    and also phytoceramide to dihydrosphingosine or phytosphingosine. Prefers dihydroceramide.
    Very low reverse hydrolysis activity, catalyzing synthesis of dihydroceramide
    from fatty acid and dihydrosphingosine. Is not responsible for the breakdown of
    unsaturated ceramide. May play a role in heat stress response.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02896
  source_id: Q02896
