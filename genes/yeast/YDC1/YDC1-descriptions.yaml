  text: Enables N-acylsphingosine amidohydrolase activity. Involved in ceramide biosynthetic
    process and ceramide catabolic process. Located in endoplasmic reticulum membrane.
    Used to study leukodystrophy. Human ortholog(s) of this gene implicated in early
    childhood-onset progressive leukodystrophy. Orthologous to human ACER3 (alkaline
    ceramidase 3).
