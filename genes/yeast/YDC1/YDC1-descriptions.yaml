    overall_notes: Opens by calling Ydc1 an 'acyl-CoA-independent ceramide synthase'
      that converts dihydroceramide to dihydrosphingosine, which is the hydrolase
      reaction; the review calls it a ceramidase with only minor reverse activity.
      Heat stress role correct.
- source: Alliance_Imported
  text: Alkaline dihydroceramidase, involved in sphingolipid metabolism; preferentially
