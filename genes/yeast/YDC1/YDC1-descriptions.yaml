gene_symbol: YDC1
organism: yeast
uniprot_id: Q02896
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acyl-CoA-independent ceramide synthase that catalyzes the conversion of dihydroceramide
    and also phytoceramide to dihydrosphingosine or phytosphingosine. Prefers dihydroceramide.
    Very low reverse hydrolysis activity, catalyzing synthesis of dihydroceramide
    from fatty acid and dihydrosphingosine. Is not responsible for the breakdown of
    unsaturated ceramide. May play a role in heat stress response.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02896
  source_id: Q02896
- source: Alliance_Imported
  text: Alkaline dihydroceramidase, involved in sphingolipid metabolism; preferentially
    hydrolyzes dihydroceramide to a free fatty acid and dihydrosphingosine; has a
    minor reverse activity; YDC1 has a paralog, YPC1, that arose from the whole genome
    duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/YDC1
  source_id: SGD:S000006008
- source: Alliance_Automated
  text: Enables N-acylsphingosine amidohydrolase activity. Involved in ceramide biosynthetic
    process and ceramide catabolic process. Located in endoplasmic reticulum membrane.
    Used to study leukodystrophy. Human ortholog(s) of this gene implicated in early
    childhood-onset progressive leukodystrophy. Orthologous to human ACER3 (alkaline
    ceramidase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/YDC1
  source_id: SGD:S000006008
