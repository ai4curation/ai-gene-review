id: Q02896
gene_symbol: YDC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ydc1 (YPL087W) is one of two alkaline ceramidases of Saccharomyces cerevisiae, a multi-pass endoplasmic
  reticulum membrane protein of the ACER family (homologous to human ACER3). It hydrolyses the amide bond of ceramides
  to release a free long-chain base and fatty acid (EC 3.5.1.23), preferring dihydroceramide and acting only slightly
  on phytoceramide, the preferred substrate of its paralog Ypc1. Ydc1 shows only minor reverse (acyl-CoA-independent)
  ceramide synthase activity in vitro; it can contribute ceramide when the acyl-CoA-dependent ceramide synthases
  Lag1 and Lac1 are absent, but this is not a significant source in wild-type cells. YDC1 is not essential; ydc1
  deletion mutants are sensitive to heat stress.
