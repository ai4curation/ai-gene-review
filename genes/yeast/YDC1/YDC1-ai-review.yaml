suggested_questions:
- question: Does Ydc1 act on 2-hydroxylated or very-long-chain dihydroceramides in vivo, and what is its physiological
    substrate pool given that it prefers dihydroceramide while most yeast ceramide is phytoceramide?
suggested_experiments:
- description: Lipidomic profiling of ydc1 and ypc1 single and double mutants under heat stress to identify the
    dihydroceramide species and long-chain bases that depend on Ydc1.
