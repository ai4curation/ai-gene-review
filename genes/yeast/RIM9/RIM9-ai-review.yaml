    label: fungal-type vacuole lumen
  evidence_type: IDA
  original_reference_id: PMID:33002606
  qualifier: located_in
  review:
    summary: >-
      KEEP_AS_NON_CORE: Rim9-GFP reaches the vacuole after alkaline stimulation,
      but the plasma membrane is its core functional site.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cached Tos7 paper cited on this SGD row is abstract-only and does not
      mention RIM9, so this review does not treat that abstract as direct support
      for the RIM9 row. However, the full-text Rim21/Dfg16/Rim9 study directly
      observed Rim9-GFP moving to the vacuolar lumen after alkaline treatment,
      consistent with stimulus-induced internalization and turnover rather than
      a primary vacuolar-lumen function.
    additional_reference_ids:
    - PMID:23019326
    supported_by:
    - reference_id: PMID:23019326
      supporting_text: >-
        After 20 min of alkaline treatment, significant fractions of
        Rim21–2×GFP and Dfg16/Rim9-GFP moved to the vacuolar lumen and
        intracellular punctuates reminiscent of the endosome
