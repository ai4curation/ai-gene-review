- term:
    id: GO:0009268
    label: response to pH
  evidence_type: IMP
  original_reference_id: PMID:23019326
  qualifier: involved_in
  review:
    summary: >-
      NEW: Rim9 is an auxiliary component of the upstream Rim101 ambient-pH
      sensing machinery.
    action: NEW
    reason: >-
      The Rim21/Dfg16/Rim9 study places Rim9 in the integral-membrane
      pH-sensing machinery and shows that rim9 deletion reduces the cellular
      level of the Rim21 sensor. Rim9's role is indirect relative to Rim21, but
      it contributes to the machinery that detects alkaline pH and activates
      downstream Rim101 signaling.
    supported_by:
    - reference_id: PMID:23019326
      supporting_text: >-
        Dfg16 and Rim9 seem to be involved indirectly in pH sensing through
        maintaining the Rim21 level and, presumably, through assisting in its
        plasma membrane localization.
