  review:
    summary: >-
      UNDECIDED: the fungal PAINT node carries this septal-site localization,
      but budding-yeast RIM9 itself has not been shown to enrich at a division
      site.
    action: UNDECIDED
    reason: >-
      PTN001997363 is a coherent PalI/Rim9-family node, but the cell-division
      site IBD is seeded only from a PomBase descendant. The cached
      S. cerevisiae Rim9 experiment supports patchy plasma-membrane and
      Golgi/endosome-like internal localization, but it does not test bud-neck,
      cytokinesis-site, or other division-site enrichment. In the absence of
      target-specific evidence for either loss or presence of this polarized
      subcompartment, the correct action is to leave the row unresolved.
