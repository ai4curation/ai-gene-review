  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      ACCEPT: RIM9 has a defined membrane-signaling role, but no direct
      molecular activity has been established.
    action: ACCEPT
    reason: >-
      Obara et al. placed Rim9 in the plasma-membrane Rim101 sensor machinery
      and showed an auxiliary role in maintaining the level and localization of
      Rim21, rather than a catalytic, transport, or directly assayed binding
      activity. The root molecular_function ND row remains an honest statement
      that no specific MF term is currently supported.
    additional_reference_ids:
    - PMID:23019326
    supported_by:
    - reference_id: PMID:23019326
      supporting_text: >-
        Dfg16 and Rim9 seem to be involved indirectly in pH sensing through
        maintaining the Rim21 level and, presumably, through assisting in its
        plasma membrane localization.
