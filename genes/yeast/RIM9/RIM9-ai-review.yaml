id: Q04734
gene_symbol: RIM9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  RIM9 is a PalI/Rim9-family multipass plasma-membrane protein in Saccharomyces
  cerevisiae. It functions as an auxiliary component of the Rim21-Dfg16-Rim9
  membrane machinery for ambient pH signaling, helping maintain Rim21 abundance
  and plasma-membrane localization, and is internalized toward the vacuole after
  alkaline stimulation.
existing_annotations:
- term:
