- term:
    id: GO:0030437
    label: ascospore formation
  evidence_type: IMP
  original_reference_id: PMID:8417990
  qualifier: involved_in
  review:
    summary: >-
      KEEP_AS_NON_CORE: rim9 mutants have sporulation and IME1-expression
      phenotypes downstream of the Rim101 pH-response pathway.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cached Su and Mitchell abstract directly places rim9 among RIM genes
      needed for full IME1 expression and sporulation. The phenotype is real,
      but ascospore formation is a developmental output of the RIM pathway
      rather than the core molecular role of the Rim9 membrane protein.
    supported_by:
    - reference_id: PMID:8417990
      supporting_text: >-
        We suggest that RIM1, RIM8, RIM9 and RIM13 encode functionally related
        products that act in parallel to MCK1 to stimulate IME1 expression.
