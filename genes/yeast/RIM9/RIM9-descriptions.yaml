descriptions:
- source: UniProt
  text: Required for the proteolytic cleavage of the transcriptional repressor RIM101
    in response to alkaline ambient pH, which is necessary for sporulation and invasive
    growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04734
  source_id: Q04734
- source: Alliance_Imported
  text: Plasma membrane protein of unknown function; involved in the proteolytic activation
    of Rim101p in response to alkaline pH; interacts with Rim21p and Dfg16p to form
    a pH-sensing complex in the Rim101 pathway and is required to maintain Rim21p
    levels; has similarity to A. nidulans PalI;
  source_type: curated
  url: https://www.yeastgenome.org/locus/RIM9
  source_id: SGD:S000004667
- source: Alliance_Automated
  text: Involved in ascospore formation. Located in fungal-type vacuole lumen and
    plasma membrane.
  source_type: automated
