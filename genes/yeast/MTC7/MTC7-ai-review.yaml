id: P32633
gene_symbol: MTC7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  MTC7 is predicted to encode a small, poorly characterized Saccharomyces
  cerevisiae membrane protein with two predicted transmembrane helices and a
  basic, disordered C-terminal region. Genetic-screen data linked MTC7 to
  cdc13-1 modifier phenotypes and led to the maintenance of telomere capping 7
  name, but the evidence does not establish a direct role for Mtc7 in
  chromosome-end capping. The protein product, molecular activity, direct
  partners, precise compartment of action, and mechanistic relationship to
  telomere biology remain unverified.
existing_annotations:
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      UniProt annotates Mtc7 as a predicted multi-pass membrane protein, and the
      sequence contains two predicted transmembrane helices. This is currently
      the only supported cellular-component annotation in GOA.
    action: ACCEPT
    reason: >-
      The membrane annotation is appropriately broad and is supported by
      sequence-based transmembrane prediction in UniProt, but protein existence is
      PE 4 (Predicted), and no stronger compartment-specific experimental
      localization was found in the current GOA/UniProt-derived files. No Huh et
      al. GFP-library compartment call is represented for MTC7 here.
    supported_by:
    - reference_id: UniProt:P32633
      supporting_text: >-
        SUBCELLULAR LOCATION: Membrane; Multi-pass membrane protein. TRANSMEM
        features are annotated at residues 13-33 and 42-62.
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  review:
    summary: >-
      The ND molecular-function annotation remains appropriate. MTC7 has no
      demonstrated enzymatic, binding, transporter, or adaptor activity in the
      accessible literature or Falcon report.
    action: ACCEPT
    reason: >-
      Mtc7 is genetically associated with telomere-capping phenotypes, but no
      molecular function has been measured. SGD retained this ND annotation in
      2013, after both the 2004 telomere-length screen and the 2008 cdc13-1
      modifier screen; retaining the ND annotation is more defensible than
      inferring DNA binding, protein binding, or a telomere structural role.
    supported_by:
    - reference_id: file:yeast/MTC7/MTC7-deep-research-falcon.md
      supporting_text: >-
        No study in the retrieved corpus provides a direct molecular function for
        Mtc7 (no catalytic reaction, substrate specificity, binding activity, or
        domain assignment).
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  review:
    summary: >-
      The generic ND cellular-component placeholder is superseded by the
      sequence-supported membrane annotation.
    action: REMOVE
    reason: >-
      GOA already contains the more informative cellular-component term
      GO:0016020 membrane. No direct evidence supports the previously drafted
      nucleus annotation.
- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  review:
    summary: >-
      The generic ND biological-process placeholder remains appropriate because
      MTC7 has no experimentally established biological process.
    action: ACCEPT
    reason: >-
      Addinall et al. named MTC7 from a cdc13-1 genome-wide genetic interaction
      screen, but that high-throughput phenotype does not show that Mtc7 itself
      carries out chromosome-end capping, acts in the CST complex, or even acts
      at telomeres. An earlier genome-wide telomere-length screen explicitly
      found that the YEL033W short-telomere phenotype failed to cosegregate with
      the deletion marker. Telomere biology remains a hypothesis for targeted
      follow-up, not a demonstrated process annotation; SGD likewise left MTC7 at
      biological_process ND in 2013.
    supported_by:
    - reference_id: PMID:18845848
      supporting_text: >-
        We also identified a number of genes of previously unknown function that
        we term RTC, for restriction of telomere capping, or MTC, for maintenance
        of telomere capping.
    - reference_id: PMID:15161972
      supporting_text: >-
        The single exception, yel033w , showed a short telomere phenotype that
        segregated independently from the antibiotic resistance.
references:
- id: GO_REF:0000015
  title: Use of the ND evidence code for Gene Ontology (GO) terms
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: UniProt:P32633
  title: UniProtKB entry for MTC7_YEAST
  findings:
  - statement: >-
      Mtc7 is a small predicted multi-pass membrane protein with two
      transmembrane helices and no established molecular function.
    supporting_text: >-
      FUNCTION: May be involved in telomere capping. SUBCELLULAR LOCATION:
      Membrane; Multi-pass membrane protein. TRANSMEM features are annotated at
      residues 13-33 and 42-62.
- id: PMID:18845848
  title: >-
    A genomewide suppressor and enhancer analysis of cdc13-1 reveals varied
    cellular processes influencing telomere capping in Saccharomyces cerevisiae
  findings:
  - statement: >-
      MTC7 was named as a maintenance-of-telomere-capping gene from a genome-wide
      cdc13-1 genetic interaction screen.
    supporting_text: >-
      We also identified a number of genes of previously unknown function that we
      term RTC, for restriction of telomere capping, or MTC, for maintenance of
      telomere capping.
  - statement: >-
      The evidence is genetic and phenotypic rather than a direct molecular
      demonstration of Mtc7 function at telomeres.
    supporting_text: >-
      We identified 369 gene deletions, in eight different phenotypic classes,
      that reproducibly demonstrated subtle genetic interactions with the
      cdc13-1 mutation.
- id: PMID:15161972
  title: >-
    A genome-wide screen for Saccharomyces cerevisiae deletion mutants that
    affect telomere length.
  findings:
  - statement: >-
      YEL033W/MTC7 was the one candidate retested in the 2004 genome-wide
      deletion screen whose short-telomere phenotype did not cosegregate with
      the YEL033W deletion marker.
    supporting_text: >-
      The single exception, yel033w , showed a short telomere phenotype that
      segregated independently from the antibiotic resistance.
    finding_review:
      finding_status: CURRENT
      review_notes: >-
        This rules out assigning the short-telomere phenotype directly to the
        collection yel033w deletion allele. Askree et al. instead concluded that
        yel033w deletion segregates with a very-slow-growth phenotype while the
        short telomeres segregate with a suppressor mutation, and retained a
        genetic-interaction interpretation.
  - statement: >-
      The authors concluded that yel033w deletion segregated with very slow
      growth while short telomeres segregated with a suppressor of that growth
      phenotype.
    supporting_text: >-
      the yel033w deletion segregates with a very slow growth phenotype and the
      short telomeres segregate with a suppressor mutation responsible for restored
      growth
  - statement: >-
      Askree et al. retained YEL033W as a candidate genetic interactor of an
      unidentified telomere-function gene, not as a demonstrated telomere-length
      gene.
    supporting_text: >-
      YEL033W , a dubious ORF, appears to genetically interact with an unidentified
      gene with telomere function
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full cached text read. This screen supplies the decisive YEL033W
      cosegregation test, which weakens direct telomere-length interpretation
      while leaving a possible indirect genetic interaction with a telomere gene.
- id: file:yeast/MTC7/MTC7-deep-research-falcon.md
  title: Falcon deep research report for MTC7
  findings:
  - statement: >-
      Falcon found limited direct mechanistic literature for MTC7 and highlighted
      that the available evidence is genetic and phenotypic rather than
      mechanistic.
    supporting_text: >-
      MTC7 is a poorly characterized gene with limited direct mechanistic
      literature; current interpretation relies on genetic association plus
      modern telomere-capping context rather than a definitive molecular
      mechanism.
core_functions: []
proposed_new_terms: []
suggested_questions:
- question: >-
    What molecular activity does Mtc7 carry out, and does it bind a specific
    telomere-associated protein, membrane complex, RNA, or DNA substrate?
- question: >-
    Is Mtc7 physically present at telomeres, at an endomembrane compartment, or
    does it influence telomere capping indirectly through chromatin or stress
    response pathways?
- question: >-
    Which phenotype of mtc7 deletion is primary: defective telomere capping,
    altered telomere length maintenance, or a broader membrane-linked stress
    response that modifies cdc13-1 viability?
suggested_experiments:
- description: >-
    Measure telomere length, single-stranded telomeric DNA accumulation, and
    checkpoint activation in mtc7 deletion cells and mtc7 cdc13-1 double mutants
    across permissive and semi-permissive temperatures.
  experiment_type: genetics
- description: >-
    Determine Mtc7 localization using endogenously tagged, functional Mtc7
    combined with membrane markers and telomere-marker ChIP or live-cell imaging
    assays.
  experiment_type: microscopy
- description: >-
    Identify Mtc7 physical interactors by affinity purification-mass spectrometry
    under normal and telomere-uncapping stress conditions, followed by validation
    of candidates from telomere, chromatin, and membrane pathways.
  experiment_type: proteomics
