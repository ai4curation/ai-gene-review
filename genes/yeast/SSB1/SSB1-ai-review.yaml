core_functions:
- description: >-
    Ssb1 is an ATP-dependent Hsp70 folding chaperone on cytosolic translating
    ribosomes. RAC positions and activates Ssb1 near the 60S exit tunnel, where
    repeated ATP-driven binding and release cycles capture emerging nascent
    chains, limit their aggregation, and promote de novo cotranslational
    folding.
  molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  directly_involved_in:
  - id: GO:0051083
    label: '''de novo'' cotranslational protein folding'
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0022626
    label: cytosolic ribosome
  supported_by:
  - reference_id: PMID:9670014
    supporting_text: These interactions allow Ssb to function as a chaperone on the ribosome, preventing the misfolding of newly synthesized proteins.
    reference_section_type: ABSTRACT
  - reference_id: PMID:23332755
    supporting_text: Deletion of SSB leads to widespread aggregation of newly synthesized polypeptides.
    reference_section_type: ABSTRACT
  - reference_id: PMID:28708998
    supporting_text: Ssb engages most substrates by multiple binding-release cycles to a degenerate sequence enriched in positively charged and aromatic amino acids.
    reference_section_type: ABSTRACT
  - reference_id: PMID:41545346
    supporting_text: Together with detailed biochemical and mutational analyses, these structures enable us to delineate the intricate RAC-dependent cycle, which positions the substrate binding domain of Ssb-ATP close to the tunnel exit to receive nascent chains.
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Do the four Ssb1/Ssb2 substitutions, particularly Ssb1 Cys435 versus Ssb2
    Val435 in the substrate-binding domain, confer any condition-specific
    substrate or regulatory difference despite the paralogs' broad redundancy?
- question: >-
    Does Ssb directly chaperone components of the Bmh-SNF1-Glc7 glucose-repression
    system, or does it act as a regulatory scaffold, and which specific GO process
    term best represents this extra-ribosomal role?
suggested_experiments:
- hypothesis: >-
    Ssb1 and Ssb2 have indistinguishable cotranslational client spectra under
    standard growth conditions, while any divergence is condition-specific.
  description: >-
    Construct otherwise isogenic ssb1Δ ssb2Δ strains complemented with tagged
    Ssb1 or Ssb2 at matched expression levels, compare selective ribosome
    profiling across standard and oxidative-stress conditions, and test
    reciprocal C435V/V435C substitutions to isolate the strongest candidate
    residue.
  experiment_type: selective ribosome profiling and paralog-swap genetics
