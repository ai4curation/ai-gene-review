id: P11484
gene_symbol: SSB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  SSB1 encodes a cytosolic Ssb-type Hsp70 molecular chaperone that associates
  with translating ribosomes near the polypeptide exit tunnel. Its
  ATP-dependent substrate-binding cycle, stimulated by the ribosome-associated
  complex RAC, captures emerging nascent chains and promotes their productive
  cotranslational folding. Ssb1 is nearly identical and broadly redundant with
  Ssb2; together the two proteins also support translation fidelity and
  ribosome biogenesis.
