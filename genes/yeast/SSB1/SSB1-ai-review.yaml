- id: PMID:27001512
  title: The Hsp70 homolog Ssb and the 14-3-3 protein Bmh1 jointly regulate transcription
    of glucose repressed genes in Saccharomyces cerevisiae.
  findings:
  - statement: Ssb has an extra-ribosomal role in glucose repression by bridging the SNF1 and Glc7 complexes together with Bmh.
    supporting_text: Here we show that the defect in glucose-repression in the absence of Ssb is due to the ability of the chaperone to bridge between the SNF1 and Glc7 complexes.
    reference_section_type: ABSTRACT
- id: PMID:28708998
  title: Profiling Ssb-Nascent Chain Interactions Reveals Principles of Hsp70-Assisted
    Folding.
  findings:
  - statement: Ssb repeatedly binds degenerate basic/aromatic motifs as they emerge from the ribosomal tunnel in a RAC-dependent manner.
    supporting_text: Ssb engages most substrates by multiple binding-release cycles to a degenerate sequence enriched in positively charged and aromatic amino acids.
    reference_section_type: ABSTRACT
- id: PMID:28771464
  title: 'Two chaperones locked in an embrace: structure and function of the ribosome-associated
    complex RAC.'
  findings:
  - statement: The Zuo1-Ssz1 RAC heterodimer stimulates Ssb ATPase activity to facilitate de novo folding of nascent chains.
    supporting_text: The RAC heterodimer stimulates the ATPase activity of the ribosome-bound Hsp70 homolog Ssb, which interacts with nascent polypeptide chains to facilitate de novo protein folding.
    reference_section_type: ABSTRACT
- id: PMID:31114879
  title: A dual role of the ribosome-bound chaperones RAC/Ssb in maintaining the fidelity
    of translation termination.
  findings:
  - statement: RAC-Ssb promotes termination fidelity through direct assistance at stalling-prone nascent chains and through assembly of functional ribosomes.
    supporting_text: Here we show that the RAC/Ssb system promotes the fidelity of translation termination via two distinct mechanisms.
    reference_section_type: ABSTRACT
- id: PMID:41545346
  title: The cotranslational cycle of the ribosome-bound Hsp70 homolog Ssb.
  findings:
  - statement: Cryo-EM identifies Rpl25/uL23 as the Ssb ribosomal binding site and resolves the RAC-dependent nascent-chain capture cycle.
    supporting_text: Here, we present two cryo-EM structures of the ribosome-bound yeast Hsp70 Ssb, identifying Rpl25/uL23 as the ribosomal binding site and revealing its interaction with a model nascent chain.
    reference_section_type: ABSTRACT
- id: file:yeast/SSB1/SSB1-deep-research-openscientist.md
  title: OpenScientist GO-focused literature report on SSB1
  findings:
  - statement: Ssb1's primary function is ATP-dependent cotranslational folding of nascent proteins at cytosolic ribosomes.
    supporting_text: Its primary, defining function is **co-translational protein folding**
    reference_section_type: OTHER
- id: file:yeast/SSB1/SSB1-hypotheses/core-function-the-four-amino-acid-differences-between-ssb1-and-ssb2-confer-a-demonstrated-paralo/openscientist.md
  title: OpenScientist hypothesis report on possible Ssb1/Ssb2 specialization
