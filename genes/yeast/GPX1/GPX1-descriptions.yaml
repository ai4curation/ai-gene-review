descriptions:
- source: UniProt
  text: Glutathione peroxidase-like protein that protects cells from phospholipid
    hydroperoxides and nonphospholipid peroxides during oxidative stress (PubMed:10480913,
    PubMed:11445588). Has peroxidase activity using thioredoxin or glutathione as
    a reducing power (PubMed:20572871, PubMed:22659048). Involved in peroxisome formation
    (PubMed:22659048).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36014
  source_id: P36014
