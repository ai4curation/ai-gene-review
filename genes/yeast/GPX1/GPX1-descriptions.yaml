    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and cited: protects against phospholipid and other hydroperoxides,
      uses thioredoxin or glutathione, involved in peroxisome formation. Calls it
      glutathione peroxidase-like and does not state the 2-Cys peroxiredoxin mechanism.'
- source: Alliance_Imported
  text: Phospholipid hydroperoxide glutathione peroxidase; induced by glucose starvation
    that protects cells from phospholipid hydroperoxides and nonphospholipid peroxides
    during oxidative stress; glutathione peroxidase activity is neuroprotective in
    models of Huntington's disease; GPX1 has a paralog, HYR1, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPX1
  source_id: SGD:S000001509
