      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Calls Gpx1 a phospholipid hydroperoxide glutathione peroxidase,
      the older view; the review treats it as an atypical 2-Cys peroxiredoxin. Huntington's
      neuroprotection is a model-system claim not in the review; the peroxisomal role
      is missing.
- source: Alliance_Automated
  text: Enables glutathione peroxidase activity; phospholipid-hydroperoxide glutathione
    peroxidase activity; and thioredoxin-dependent peroxiredoxin activity. Involved
    in peroxisome organization. Located in peroxisomal matrix. Human ortholog(s) of
    this gene implicated in colorectal adenocarcinoma; colorectal cancer; and spondylometaphyseal
    dysplasia Sedaghatian type. Orthologous to human GPX4 (glutathione peroxidase
    4).
  source_type: automated
