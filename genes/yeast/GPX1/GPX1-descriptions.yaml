gene_symbol: GPX1
organism: yeast
uniprot_id: P36014
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Glutathione peroxidase-like protein that protects cells from phospholipid
    hydroperoxides and nonphospholipid peroxides during oxidative stress (PubMed:10480913,
    PubMed:11445588). Has peroxidase activity using thioredoxin or glutathione as
    a reducing power (PubMed:20572871, PubMed:22659048). Involved in peroxisome formation
    (PubMed:22659048).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36014
  source_id: P36014
- source: Alliance_Imported
  text: Phospholipid hydroperoxide glutathione peroxidase; induced by glucose starvation
    that protects cells from phospholipid hydroperoxides and nonphospholipid peroxides
    during oxidative stress; glutathione peroxidase activity is neuroprotective in
    models of Huntington's disease; GPX1 has a paralog, HYR1, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPX1
  source_id: SGD:S000001509
- source: Alliance_Automated
  text: Enables glutathione peroxidase activity; phospholipid-hydroperoxide glutathione
    peroxidase activity; and thioredoxin-dependent peroxiredoxin activity. Involved
    in peroxisome organization. Located in peroxisomal matrix. Human ortholog(s) of
    this gene implicated in colorectal adenocarcinoma; colorectal cancer; and spondylometaphyseal
    dysplasia Sedaghatian type. Orthologous to human GPX4 (glutathione peroxidase
    4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GPX1
  source_id: SGD:S000001509
