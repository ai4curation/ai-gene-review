  label: Saccharomyces cerevisiae S288C
description: 'Glutathione peroxidase-like peroxiredoxin 1 of Saccharomyces cerevisiae, one of three GPx-family paralogs
  (Gpx1, Gpx2, Gpx3/Hyr1). Despite its name, Gpx1 is an atypical 2-Cys peroxiredoxin: a peroxidatic cysteine attacks
  the peroxide and forms an intramolecular disulfide with a resolving cysteine, which is then reduced by thioredoxin
  or by glutathione, used almost equally (unlike Gpx2 and Gpx3, which prefer thioredoxin). It reduces H2O2, alkyl
  hydroperoxides and phospholipid hydroperoxides. GPX1 is induced by glucose starvation and by oleate via Msn2/Msn4;
  Gpx1 localises to the peroxisomal matrix (and is reported at the mitochondrial outer membrane) and is required
  for normal peroxisome formation and growth on oleate, where peroxisomal beta-oxidation generates H2O2.'
