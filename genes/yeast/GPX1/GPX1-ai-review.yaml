suggested_questions:
- question: Which electron donor (peroxisomal thioredoxin or glutathione) reduces Gpx1 inside peroxisomes, given
    that no dedicated peroxisomal thioredoxin is established in yeast?
- question: Is the peroxisome-formation defect of gpx1 cells a direct signalling role of Gpx1 Cys36 or an indirect
    consequence of H2O2 accumulation?
suggested_experiments:
- hypothesis: The peroxisome biogenesis defect of gpx1 cells is caused by peroxisomal H2O2 accumulation rather than
    a specific Gpx1 signalling function.
  description: Express a peroxisome-targeted heterologous catalase or peroxiredoxin in gpx1 cells on oleate and
    test rescue of peroxisome number and growth, compared with Gpx1(C36S).
