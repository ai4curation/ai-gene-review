taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SER2 encodes phosphoserine phosphatase, a Mg2+-dependent HAD-superfamily (SerB family) hydrolase
  that dephosphorylates O-phospho-L-serine to L-serine, the third and final step of the phosphorylated
  (glycolytic) pathway of serine biosynthesis after Ser3/Ser33 and Ser1. ser2 mutants are serine auxotrophs
  on glucose, when the glucose-repressed glyoxylate route cannot compensate. Ser2 is a soluble protein
  found in the cytoplasm and nucleus, and its expression is co-regulated with the other SER genes by carbon
  and nitrogen source.
