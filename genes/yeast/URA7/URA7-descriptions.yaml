gene_symbol: URA7
organism: yeast
uniprot_id: P28274
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the ATP-dependent amination of UTP to CTP with either L-glutamine
    or ammonia as the source of nitrogen.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P28274
  source_id: P28274
- source: Alliance_Imported
  text: Major CTP synthase isozyme (see also URA8); catalyzes ATP-dependent transfer
    of amide nitrogen from glutamine to UTP, forming CTP, final step in de novo biosynthesis
    of pyrimidines; involved in phospholipid biosynthesis; targeted to vacuole via
    AP-3 pathway; capable of forming cytoplasmic filaments termed cytoophidium, especially
    during conditions of glucose depletion; URA7 has paralog URA8 that arose from
    the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/URA7
  source_id: SGD:S000000135
- source: Alliance_Automated
  text: Enables CTP synthase activity. Involved in CTP biosynthetic process; phospholipid
    biosynthetic process; and pyrimidine nucleobase biosynthetic process. Located
    in fungal-type vacuole. Is active in cytoophidium. Human ortholog(s) of this gene
    implicated in immunodeficiency 24. Orthologous to human CTPS1 (CTP synthase 1)
    and CTPS2 (CTP synthase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/URA7
  source_id: SGD:S000000135
