suggested_questions:
- question: Do Ura7 filaments in yeast represent an inactive storage form (as for some CTPS polymers)
    or an active form, and how does polymerisation affect CTP supply for phospholipid synthesis?
- question: What distinguishes the physiological roles of Ura7 and Ura8 beyond expression level and CTP
    sensitivity?
suggested_experiments:
- description: Compare growth, CTP pools and phospholipid composition in strains carrying polymerisation-defective
    versus wild-type Ura7 under glucose starvation.
