- term:
    id: GO:0008654
    label: phospholipid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:9668079
  qualifier: involved_in
  review:
    summary: CTP-insensitive (E161K) Ura7 raises CTP and alters phospholipid synthesis (more PC via the
      Kennedy pathway, more PE and PA, less PS). Ura7 supplies CTP, the substrate of CDP-DAG and CDP-choline/ethanolamine
      synthesis; it does not catalyse a phospholipid-synthesis step itself.
    action: KEEP_AS_NON_CORE
    reason: Experimentally supported regulatory/supply influence on phospholipid synthesis; indirect relative
      to CTP synthase activity.
    supported_by:
    - reference_id: PMID:9668079
      supporting_text: These data indicated that the regulation of CTP synthetase activity by CTP plays
        an important role in the regulation of phospholipid synthesis
    - reference_id: PMID:9668079
      supporting_text: Cells expressing the E161K mutation in the URA7-encoded CTP synthetase exhibited
        an increase (1.5-fold) in the utilization of the Kennedy pathway for phosphatidylcholine synthesis
