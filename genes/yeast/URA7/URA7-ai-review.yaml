id: P28274
gene_symbol: URA7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'URA7 encodes the major CTP synthase (CTP synthetase, EC 6.3.4.2) of Saccharomyces cerevisiae,
  which catalyses the ATP-dependent amination of UTP to CTP using the amide nitrogen of glutamine (or
  ammonia), the final step of de novo CTP synthesis. The enzyme has an N-terminal synthetase (amidoligase)
  domain and a C-terminal class I glutamine amidotransferase domain; it is a dimer that tetramerises in
  the presence of UTP and ATP, is allosterically activated by GTP and feedback-inhibited by CTP (Glu161
  is involved in CTP inhibition), and shows cooperative kinetics. Ura7 and its paralogue Ura8 (78% identical)
  are functionally overlapping: either alone supports growth but the double null is lethal, and Ura7 is
  the major isoform. Ura7 is cytosolic and, like CTP synthases from bacteria to humans, polymerises into
  filaments (cytoophidia), especially on nutrient limitation. Because CTP is a precursor of CDP-diacylglycerol
  and CDP-choline/ethanolamine, CTP synthase regulation influences phospholipid synthesis.'
