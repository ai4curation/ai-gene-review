- source: Alliance_Automated
  text: Enables sphingosine N-acyltransferase activity. Involved in ceramide biosynthetic
    process. Located in endoplasmic reticulum. Part of acyl-CoA ceramide synthase
    complex. Human ortholog(s) of this gene implicated in autosomal recessive congenital
    ichthyosis 9 and progressive myoclonus epilepsy 8. Orthologous to several human
    genes including CERS2 (ceramide synthase 2); CERS4 (ceramide synthase 4); and
    CERS5 (ceramide synthase 5).
