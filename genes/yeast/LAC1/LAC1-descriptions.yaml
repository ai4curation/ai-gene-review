descriptions:
- source: UniProt
  text: Component of the ceramide synthase complex that catalyzes the transfer of
    the acyl chain from acyl-CoA to a sphingoid base, with high selectivity toward
    hexacosanoyl-CoA (C26:0-CoA) (PubMed:11694577, PubMed:15692566, PubMed:37953642,
    PubMed:39528796). N-acylates sphinganine and phytosphingosine bases to form dihydroceramides
    and phytoceramides, respectively (PubMed:11694577, PubMed:15692566). Redundant
    with LAG1 (PubMed:39528796). Facilitates ER-to-Golgi transport of GPI-anchored
    proteins. Has a lower affinity for phytosphingosine (PHS) than dihydrosphingosine
    (DHS); PHS is required for the synthesis of phytoceramides and the formation of
    nuclear envelopes (PubMed:31164445). Along with LAG1, plays a role in pheromone-induced
    MAP kinase-activation of mating and formation of diploid cells (PubMed:26726837).
    May also play a role, together with LAG1, in the polarized membrane distribution
    of phosphatidylinositol 4,5 biphosphate required for STE5 localization to the
    plasma membrane (PubMed:26726837).
