id: P28496
gene_symbol: LAC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Lac1 is one of two redundant catalytic subunits (with its paralog Lag1) of the acyl-CoA-dependent
  ceramide synthase of Saccharomyces cerevisiae, a TLC-domain multipass protein of the endoplasmic reticulum
  membrane. Together with the essential small subunit Lip1, Lac1 transfers very-long-chain (mainly C26:0)
  acyl groups from acyl-CoA onto the sphingoid bases dihydrosphingosine and phytosphingosine, forming
  dihydroceramide and phytoceramide (EC 2.3.1.297/2.3.1.24); the activity is fumonisin B1- and australifungin-sensitive.
  Loss of both LAC1 and LAG1 abolishes acyl-CoA-dependent ceramide synthesis, lowers complex sphingolipid
  levels, impairs ceramide remodelling of GPI anchors and slows ER-to-Golgi transport of GPI-anchored
  proteins.'
