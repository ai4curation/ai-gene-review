id: P48016
gene_symbol: ATH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ATH1 encodes the acid trehalase of Saccharomyces cerevisiae, a glycosyl hydrolase family
  65 enzyme (EC 3.2.1.28) that hydrolyses the disaccharide alpha,alpha-trehalose into two glucose molecules.
  Ath1 is a glycosylated single-pass type II membrane protein that travels through the secretory pathway.
  A pool reaches the cell surface/periplasm, where more than 90% of Ath1 activity is extracellular; this
  pool is required for hydrolysis of exogenous trehalose and for growth on trehalose as carbon source,
  which is respiratory. Another pool is sorted through the multivesicular body pathway into the vacuolar
  lumen, where it is thought to be degraded. Ath1 thus provides the extracellular route of trehalose assimilation,
  in contrast to the cytosolic neutral trehalase Nth1 that mobilises intracellular trehalose stores. ATH1
  is induced under severe saline stress via Hog1.
