gene_symbol: ATH1
organism: yeast
uniprot_id: P48016
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Periplasmic acid trehalase that catalyzes hydrolysis of the disaccharide trehalose
    and required for growth on trehalose as carbon source (PubMed:19703229, PubMed:7502577,
    PubMed:8647289, PubMed:8764988). Growth on trehalose is strictly respiratory (By
    similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P48016
  source_id: P48016
- source: Alliance_Imported
  text: Acid trehalase required for utilization of extracellular trehalose; involved
    in intracellular trehalose degradation during growth recovery after saline stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/ATH1
  source_id: SGD:S000006230
- source: Alliance_Automated
  text: Enables alpha,alpha-trehalase activity. Involved in carbon utilization; trehalose
    catabolic process; and trehalose transport. Located in several cellular components,
    including cell wall-bounded periplasmic space; fungal-type cell wall; and fungal-type
    vacuole lumen. Orthologous to human PGGHG (protein-glucosylgalactosylhydroxylysine
    glucosidase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ATH1
  source_id: SGD:S000006230
