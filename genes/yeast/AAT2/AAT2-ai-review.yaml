- term:
    id: GO:0032938
    label: negative regulation of translation in response to oxidative stress
  evidence_type: IMP
  original_reference_id: PMID:35621265
  qualifier: acts_upstream_of_or_within
  review:
    summary: Aat2 restrains excessive Gcn2-dependent translational repression during peroxide stress,
      independently of its aminotransferase activity.
    action: MODIFY
    reason: Full-text polysome profiles and catalytic-dead rescue support maintenance of translation during
      oxidative stress, opposite to the negative direction in the existing term. Refine to positive regulation
      of translation with the peroxide context explicitly retained; untreated translation was similar
      and universal basal activation is not asserted.
    supported_by:
    - reference_id: PMID:35621265
      supporting_text: Polysome profile analysis revealed that translation was similar in untreated aat2∆
        and wild-type (parent) cells, but ribosome run-off caused by addition of H2O2 was more acute in
        aat2∆ at lower concentrations of peroxide
    - reference_id: PMID:35621265
      supporting_text: binding of catalytically inactive Aat2 to ribosomes is sufficient to restore normal
        activation of Gcn2 and the global translational repression response to acute stress
    proposed_replacement_terms:
    - id: GO:0045727
      label: positive regulation of translation
- term:
    id: GO:0043023
    label: ribosomal large subunit binding
  evidence_type: IDA
  original_reference_id: PMID:35621265
  qualifier: enables
  review:
    summary: Polysome and EDTA-dissociation profiling showed Aat2 binds predominantly 60S subunits; catalytically
      inactive mutants retain this association.
    action: KEEP_AS_NON_CORE
    reason: Moonlighting ribosome association; non-core relative to aminotransferase activity.
    supported_by:
    - reference_id: PMID:35621265
      supporting_text: EDTA treatment to separate the ribosomal subunits further indicated that Aat2 predominantly
        binds to 60S (large) subunits
    - reference_id: PMID:35621265
      supporting_text: Aat2 therefore has a separate ribosome-associated translational regulatory or 'moonlighting'
        function that modulates the ISR independent of its aspartate aminotransferase activity.
