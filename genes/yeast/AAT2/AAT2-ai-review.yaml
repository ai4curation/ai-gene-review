taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Cytosolic aspartate aminotransferase (AspAT, EC 2.6.1.1; ASP5) of Saccharomyces cerevisiae,
  a PLP-dependent class-I aminotransferase that interconverts L-aspartate + 2-oxoglutarate and oxaloacetate
  + L-glutamate. Aat2 is a major source of aspartate in the characterized growth conditions: catalytic-site
  mutants are aspartate auxotrophs and deletion almost abolishes newly synthesized aspartate in the tested
  nitrogen-starvation tracing experiment. Aat2 is mostly cytosolic in glucose-grown cells but is targeted
  to peroxisomes in oleate-grown cells, where it is not required for beta-oxidation. Independently of
  its catalytic activity, a fraction of Aat2 associates with 60S ribosomal subunits and restrains Gcn2
  activation and eIF2alpha phosphorylation during oxidative stress (moonlighting function).'
