      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=L-aspartate + 2-oxoglutarate = oxaloacetate + L-glutamate;
    - reference_id: PMID:36040324
      supporting_text: Intracellular aspartate is converted to glutamate and oxaloacetate, which are easily
        utilised by the cell through the central nitrogen metabolism.
