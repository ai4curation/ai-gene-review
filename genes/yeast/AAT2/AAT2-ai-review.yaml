  review:
    summary: Aspartate transamination is the downstream carbon-skeleton conversion after asparaginase
      releases aspartate.
    action: KEEP_AS_NON_CORE
    reason: An enzyme can participate in asparagine catabolism without binding asparagine itself. The
      reviewed pathway and reaction chemistry support a secondary role; isozyme-specific compartmental
      transport and quantitative flux are not established by the generic pathway import.
    supported_by:
