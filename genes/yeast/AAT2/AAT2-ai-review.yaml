- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IDA
  original_reference_id: PMID:9288922
  qualifier: located_in
  review:
    summary: Aat2 supplies the directly measured peroxisomal aspartate aminotransferase activity in oleate-grown
      yeast.
    action: ACCEPT
    reason: The active enzyme changes compartment with carbon source. This is a core enzyme localization
      under the assayed condition; normal beta-oxidation in aat2 mutants shows that localization does
      not establish an obligatory peroxisomal redox-shuttle role.
    supported_by:
    - reference_id: PMID:9288922
      supporting_text: Whereas virtually all cellular AAT activity was peroxisomal in oleate-grown cells,
        we found that in glucose-grown cells most of the AAT activity resided in the cytosol.
    - reference_id: PMID:9288922
      supporting_text: These results indicate that AAT2 is not essential for the peroxisomal NAD(H) redox
        shuttle.
