descriptions:
- source: UniProt
  text: Plays a key role in amino acid metabolism.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23542
  source_id: P23542
- source: Alliance_Imported
  text: Cytosolic aspartate aminotransferase involved in the metabolism of nitrogen
    and amino acids such as aspartate; localizes to and functions in peroxisomes in
    oleate-grown cells; moonlighting role as a ribosome-associated protein that modulates
    translation in response to stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/AAT2
  source_id: SGD:S000004017
- source: Alliance_Automated
  text: Enables L-aspartate:2-oxoglutarate transaminase activity and ribosomal large
    subunit binding activity. Involved in L-aspartate biosynthetic process. Acts upstream
    of or within negative regulation of translation in response to oxidative stress.
    Located in cytosol and peroxisome. Human ortholog(s) of this gene implicated in
    amyloidosis; amyotrophic lateral sclerosis; developmental and epileptic encephalopathy
    82; pancreatic ductal adenocarcinoma; and transient cerebral ischemia. Orthologous
    to several human genes including GOT1 (glutamic-oxaloacetic transaminase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/AAT2
  source_id: SGD:S000004017
