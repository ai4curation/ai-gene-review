descriptions:
- source: UniProt
  text: Together with closely related KSS1, FUS3 is the final kinase in the signal
    transduction cascade regulating activation/repression of the mating and filamentation
    pathways, induced by pheromone and nitrogen/carbon limitation, respectively. Phosphorylated
    FUS3 activates the mating but suppresses the filamentation pathway, whereas activated
    KSS1 activates both pathways. Pheromone-activated FUS3 functions by inhibiting
    the binding of the transcriptional activator STE12 to filamentation specific genes
    while inducing its binding to and activity at mating specific genes. Non-activated
    FUS3 has a repressive effect on STE12 transcriptional activity. KSS1 can partially
    compensate for the lack of FUS3 but mating efficiency is reduced and the filamentation
    program is partially activated upon pheromone signaling. FUS3 phosphorylates STE7,
    STE5, FAR1, DIG1, DIG2 and STE12.
