descriptions:
- source: UniProt
  text: Together with closely related KSS1, FUS3 is the final kinase in the signal
    transduction cascade regulating activation/repression of the mating and filamentation
    pathways, induced by pheromone and nitrogen/carbon limitation, respectively. Phosphorylated
    FUS3 activates the mating but suppresses the filamentation pathway, whereas activated
    KSS1 activates both pathways. Pheromone-activated FUS3 functions by inhibiting
    the binding of the transcriptional activator STE12 to filamentation specific genes
    while inducing its binding to and activity at mating specific genes. Non-activated
    FUS3 has a repressive effect on STE12 transcriptional activity. KSS1 can partially
    compensate for the lack of FUS3 but mating efficiency is reduced and the filamentation
    program is partially activated upon pheromone signaling. FUS3 phosphorylates STE7,
    STE5, FAR1, DIG1, DIG2 and STE12.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P16892
  source_id: P16892
- source: Alliance_Imported
  text: Mitogen-activated serine/threonine protein kinase involved in mating; phosphoactivated
    by Ste7p; substrates include Ste12p, Far1p, Bni1p, Sst2p; inhibits invasive growth
    during mating by phosphorylating Tec1p, promoting its; inhibits recruitment of
    Ste5p, Cdc42p-mediated asymmetry and mating morphogenesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/FUS3
  source_id: SGD:S000000112
- source: Alliance_Automated
  text: Enables MAP kinase activity and identical protein binding activity. Involved
    in several processes, including invasive growth in response to glucose limitation;
    pheromone response MAPK cascade; and positive regulation of protein export from
    nucleus. Located in cytoplasm; mating projection tip; and nucleus. Human ortholog(s)
    of this gene implicated in several diseases, including Noonan syndrome 13; Parkinson's
    disease; carcinoma (multiple); endometrial disease; and pulmonary hypertension.
    Orthologous to several human genes including MAPK1 (mitogen-activated protein
    kinase 1).
