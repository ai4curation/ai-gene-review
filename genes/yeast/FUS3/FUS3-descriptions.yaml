- source: Alliance_Imported
  text: Mitogen-activated serine/threonine protein kinase involved in mating; phosphoactivated
    by Ste7p; substrates include Ste12p, Far1p, Bni1p, Sst2p; inhibits invasive growth
    during mating by phosphorylating Tec1p, promoting its; inhibits recruitment of
    Ste5p, Cdc42p-mediated asymmetry and mating morphogenesis
