- source: Alliance_Automated
  text: Enables MAP kinase activity and identical protein binding activity. Involved
    in several processes, including invasive growth in response to glucose limitation;
    pheromone response MAPK cascade; and positive regulation of protein export from
    nucleus. Located in cytoplasm; mating projection tip; and nucleus. Human ortholog(s)
    of this gene implicated in several diseases, including Noonan syndrome 13; Parkinson's
    disease; carcinoma (multiple); endometrial disease; and pulmonary hypertension.
    Orthologous to several human genes including MAPK1 (mitogen-activated protein
    kinase 1).
