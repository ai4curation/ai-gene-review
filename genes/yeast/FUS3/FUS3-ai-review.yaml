core_functions:
- description: 'Terminal MAP kinase of the pheromone response cascade: activated on the Ste5 scaffold
    by Ste7 dual phosphorylation (Thr180/Tyr182), Fus3 phosphorylates Ste12, Dig1/Dig2 and Far1 to induce
    mating-gene transcription and G1 arrest, acting at the mating projection tip, in the cytoplasm and
    in the nucleus.'
