- term:
    id: GO:0001403
    label: invasive growth in response to glucose limitation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00090378
  review:
    summary: ARBA IEA assigning invasive growth in response to glucose limitation, presumably propagated
      from the Fus3/Kss1 group.
    action: MODIFY
    reason: Fus3 does not drive haploid invasive growth; it restrains it. Fus3 kinase activity blocks
      cross-activation of invasive-growth gene expression by the pheromone cascade (PMID:10652102), and
      Fus3 phosphorylates Tec1 to trigger its pheromone-induced destruction, so fus3 deletion causes erroneous
      invasive growth (PMID:15620357). The mutant phenotype is therefore evidence for negative regulation,
      and the positive process term misrepresents the direction of Fus3's role. The appropriate term is
      GO:2000218 negative regulation of invasive growth in response to glucose limitation (the same replacement
      is used for the paralog KSS1 review's repressive role).
    proposed_replacement_terms:
    - &id002
      id: GO:2000218
      label: negative regulation of invasive growth in response to glucose limitation
    supported_by:
    - &id003
      reference_id: PMID:10652102
      supporting_text: Fus3 also inhibits haploid invasive growth by blocking cross-activation of invasive
        growth gene expression by the pheromone response signal cascade
    - &id004
      reference_id: PMID:15620357
      supporting_text: deletion of FUS3, or deletion of DIA2 results in a loss of signaling specificity
        such that pheromone pathway signaling erroneously activates filamentation pathway gene expression
        and invasive growth
