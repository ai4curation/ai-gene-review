suggested_questions:
- question: Which Fus3 substrates at the mating projection tip (e.g. Bni1, Ste5, Gpa1-associated targets)
    mediate polarized growth and gradient tracking, and should these be captured as has_input on MAP kinase
    activity in a GO-CAM of the pheromone response?
- question: Is GO:0010526 transposable element silencing the right home for Fus3's post-translational
    suppression of Ty1 retrotransposition, given that all regulation-of-transposition terms are obsolete?
- question: Should Far1-mediated G1 arrest be annotated to Fus3 as a regulation-of-cell-cycle process,
    given that Fus3 directly phosphorylates Far1 (the actual CDK inhibitor)?
suggested_experiments:
- description: Analog-sensitive fus3 allele combined with quantitative phosphoproteomics after pheromone
    treatment in a kss1 deletion background, to define the direct Fus3 substrate set and separate it from
    Kss1-dependent sites.
