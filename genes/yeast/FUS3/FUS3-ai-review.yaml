id: P16892
gene_symbol: FUS3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Fus3 (YBL016W) is the mating-pheromone-response mitogen-activated protein kinase of Saccharomyces
  cerevisiae, a CMGC-family Ser/Thr kinase that forms the MAPK tier of the Ste11 (MAPKKK) -> Ste7 (MAPKK)
  -> Fus3 cascade assembled on the Ste5 scaffold. Pheromone binding to the Ste2/Ste3 receptors releases
  Gbetagamma, which recruits Ste5 to the plasma membrane; there Ste7 dually phosphorylates Fus3 on Thr180
  and Tyr182 of its TEY activation loop, a reaction that Ste5 specifically unlocks, making Fus3 activation
  selective for the mating pathway. Active Fus3 forms a gradient from the tip of the mating projection
  and shuttles into the nucleus. It phosphorylates the Ste12 repressors Dig1/Dig2 and Ste12 to induce
  mating genes, the CDK inhibitor Far1 to impose G1 arrest, Fus2 to promote its nuclear export before
  cell fusion, and the filamentation transcription factor Tec1, triggering its SCF-dependent degradation.
  Through Tec1 destruction and restraint of Kss1 activation, Fus3 insulates the mating response from the
  filamentous/invasive growth pathway, and it provides negative feedback on the cascade through phosphorylation
  of Ste5. Fus3 also restrains Ty1 retrotransposition. Its paralog Kss1 can partially substitute for Fus3
  in mating-gene induction but mainly drives filamentous growth.
