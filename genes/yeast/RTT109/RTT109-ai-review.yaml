- id: PMID:35866610
  title: A role for the Saccharomyces cerevisiae Rtt109 histone acetyltransferase in R-loop homeostasis and
    associated genome instability.
  findings:
  - statement: Rtt109 prevents DNA-RNA hybrid (R-loop) accumulation by acetylating histone H3 lysines 14 and
      23, distinct from its H3K56ac role in replication-coupled nucleosome assembly.
    supporting_text: Rtt109 prevents DNA-RNA hybridization by the acetylation of
      histone H3 lysines 14 and 23
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified, full text cached. Establishes a distinct RTT109 function
      (R-loop/DNA-RNA hybrid suppression via H3K14/H3K23ac) that was already asserted in this review's
      description and core_functions text but previously lacked any supporting citation; this review's
      own curation notes (RTT109-CURATION-REVIEW.md) had already flagged the gap. No single existing GO
      term captures "prevention of R-loop formation" (GO:0062176 R-loop processing is R-loop disassembly,
      the opposite direction), so this is recorded as a proposed_new_terms entry rather than forced onto an
      ill-fitting existing id.
