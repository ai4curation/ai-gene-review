- id: file:yeast/RTT109/RTT109-deep-research-falcon.md
  title: Falcon deep research report on RTT109 (Saccharomyces cerevisiae)
  findings:
  - statement: |
      Rtt109 is the histone acetyltransferase responsible for histone H3 lysine-56
      acetylation (H3K56ac) in budding yeast; loss of RTT109 abolishes detectable
      H3K56ac, establishing it as essential for this mark.
    supporting_text: |-
