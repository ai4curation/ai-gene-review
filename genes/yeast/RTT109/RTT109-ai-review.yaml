  - statement: |
      Rtt109 transfers an acetyl group from acetyl-CoA to the epsilon-amine of lysine
      residues on histone H3, with H3K56 as the dominant in vivo site.
    supporting_text: |-
      Rtt109 catalyzes **acetyl transfer from acetyl‑CoA to the ε‑amine of lysine residues on histone H3**, producing acetyl‑lysine and CoA. In budding yeast, its defining and dominant reaction is acetylation of **histone H3 lysine 56 (H3K56ac)**
    reference_section_type: RESULTS
  - statement: |
      Efficient H3K56 acetylation by Rtt109 requires the histone chaperone cofactors
