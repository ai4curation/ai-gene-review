proposed_new_terms:
- proposed_name: negative regulation of R-loop formation
  proposed_definition: Any process that decreases the rate, frequency, or extent
    of R-loop (DNA-RNA hybrid) formation, for example by a chromatin state or
    histone modification that renders the DNA template less permissive to
    hybridization with nascent RNA.
  justification: RTT109 loss increases cellular R-loop/DNA-RNA hybrid levels via
    loss of H3K14 and H3K23 acetylation (PMID:35866610), a function distinct from
    its defining H3K56ac role in replication-coupled nucleosome assembly and from
    its separate role in repairing R-loop-associated DNA breaks. No existing GO
    term captures formation-prevention specifically; the only R-loop process term,
    GO:0062176 (R-loop processing), is defined as R-loop disassembly, the opposite
    direction of effect. The mechanism here is chromatin-based — H3K14/H3K23
    acetylation rendering the template less permissive to DNA-RNA hybridization —
    but chromatin organization is the mechanism rather than the parent class.
    Because the term being proposed is a negative-regulation class, it is
    parented under GO:0051053 (negative regulation of DNA metabolic process),
    the nearest existing negative-regulation ancestor, R-loop processing being
    itself classified in GO as a DNA metabolic process.
  proposed_parent:
    id: GO:0051053
    label: negative regulation of DNA metabolic process
  supported_by:
  - reference_id: PMID:35866610
    supporting_text: Rtt109 prevents DNA-RNA hybridization by the acetylation of
      histone H3 lysines 14 and 23
