    reference_section_type: RESULTS
  - statement: |
      Rtt109-installed H3K56ac promotes chromatin maturation after DNA replication by
      enhancing ISWI-family remodelers (yeast Isw1; human SNF2h) that resolve
      disorganized nascent chromatin.
    supporting_text: |-
      H3K56ac enhances activity of ISWI remodelers (yeast Isw1; human SNF2h) and helps remodel disorganized nascent chromatin; aberrantly low or high levels of H3K56ac perturb maturation and are linked to genome instability
    reference_section_type: RESULTS
  - statement: |
      rtt109 deletion causes an approximately 9-fold increase in gross chromosomal
      rearrangement frequency, consistent with a genome stability role during replication.
    supporting_text: |-
      In a foundational *Science* study, **rtt109Δ** caused an approximately **9‑fold increase in gross chromosomal rearrangement** frequency and showed phenotypes consistent with replication-associated DNA damage tolerance defects
    reference_section_type: RESULTS
  - statement: |
      Rtt109-mediated H3K56 acetylation is required for proper S-phase chromosome domain
      positioning, including telomere peripheral localization, indicating nuclear chromatin
      action during/after replication.
    supporting_text: |-
