    label: protein-containing complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: HSP82 forms Hsp90 dimers and many co-chaperone/client assemblies, but the generic
      protein-containing complex term does not identify a biologically meaningful assembly.
    action: MARK_AS_OVER_ANNOTATED
    reason: Hsp82 genuinely participates in homodimers and specific client/co-chaperone complexes,
      but GO:0032991 is too broad to convey any of those assemblies. The more informative annotation
      is ATP-dependent protein folding chaperone activity together with experimentally supported
      dimerization. The full-length Hsp82-ATP-analogue-Sba1 crystal structure preserves the concrete
      complex evidence even though no specific complex term is proposed here.
