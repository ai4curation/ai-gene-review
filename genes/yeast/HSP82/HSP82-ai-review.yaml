- term:
    id: GO:0034605
    label: cellular response to heat
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'HSP82 is the heat-inducible Hsp90 isoform, centrally involved in heat stress response. Falcon
      deep research provides quantitative support: Hsp82 is very low at 25-30C and induced at 37C to levels
      similar to the constitutive Hsc82 paralog, and Hsp82 is more thermally stable than Hsc82 (Tm ~60.4C
      vs 57.1C), consistent with a stress-specialized role.'
    action: ACCEPT
    reason: HSP82 is named as a heat shock protein precisely because it is induced by heat stress.
      UniProt confirms it is "required for growth at high temperatures" (PMID:2674684). The gene
      name itself (HSP82 = Heat Shock Protein 82) reflects this core function.
