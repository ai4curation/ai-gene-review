core_functions:
- description: Hsp82 is an ATP-dependent protein folding chaperone that promotes late-stage folding,
    activation, and stability of selected conformationally dynamic clients. Its heat-induced
    expression and greater thermal stability specialize this cytosolic Hsp90 paralog for stress
    while preserving the conserved client-maturation mechanism.
  molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  - id: GO:0034605
    label: cellular response to heat
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:yeast/HSP82/HSP82-deep-research-falcon.md
    supporting_text: Hsp82 (Hsp90) is an **ATP-dependent molecular chaperone** that assists the
      **late-stage folding, activation, and stability** of a large set of specific “client” proteins
      (substrates), including many signaling regulators (notably protein kinases and transcription
      factors).
  - reference_id: file:yeast/HSP82/HSP82-deep-research-falcon.md
    supporting_text: These findings support annotating Hsp82 as the **heat-inducible,
      stress-resilient cytosolic Hsp90 isoform** that preserves the core Hsp90 mechanism while
      shifting stability/dynamics.
- description: Hsp82 directly hydrolyzes ATP, and nucleotide-coupled conformational changes regulate
    its client-folding cycle. ATPase activity is therefore a genuine molecular function, while
    current mechanistic evidence cautions that ATP has a structural role and that
    conformational-state timing can matter more than absolute hydrolysis rate.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:12235160
    supporting_text: We show that N-terminal deletion variants of Hsp90 are severely impaired in
      their ability to hydrolyze ATP. However, nucleotide binding of these constructs is similar to
      that of the wild type protein.
  - reference_id: file:yeast/HSP82/HSP82-deep-research-falcon.md
    supporting_text: A central current concept is that **dwell time in specific conformations** can
      be more functionally determinative than absolute ATPase rate, emphasizing kinetic regulation
      of the cycle in vivo.
  - reference_id: PMID:40691164
    supporting_text: Our results provide further evidence that ATPase is not correlated to viability,
      but rather suggest that the ability to form the closed clamp determines whether a mutant can
      support cell growth.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: Hsp82 is annotated to ATP-dependent protein folding chaperone (GO:0140662) and
      protein folding (GO:0006457) via InterPro-to-GO mapping reflecting Hsp90 family membership.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PANTHER phylogenetic-tree annotation propagates conserved Hsp90 chaperone functions
      (ATP binding, ATP hydrolysis, protein folding, cellular response to heat, protein
      stabilization, identical protein binding, cytosol localization) to S. cerevisiae HSP82.
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings:
  - statement: UniProtKB keyword 'Nucleotide-binding' maps to GO:0000166 nucleotide binding for
      HSP82 based on its conserved Hsp90 ATPase domain.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: HSP82 UniProt subcellular location annotation (cytoplasm) is mapped to GO:0005737
      cytoplasm.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA machine-learning model assigns HSP82 to box C/D snoRNP assembly and proteasome
      assembly based on Hsp90 family signatures and chaperone client patterns.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated IEA pipelines annotate HSP82 with ATP binding, ATP hydrolysis
      activity, protein folding, and unfolded protein binding from UniProt features.
- id: PMID:10564510
  title: Contribution of N- and C-terminal domains to the function of Hsp90 in Saccharomyces
    cerevisiae.
  findings:
  - statement: Direct evidence for non-native-client binding and maturation of selected HSP82
      substrates
    full_text_unavailable: true
- id: PMID:11805837
  title: Systematic identification of protein complexes in Saccharomyces cerevisiae by mass
    spectrometry.
  findings:
  - statement: HSP82 was identified as part of multi-protein complexes in S. cerevisiae by
      systematic affinity purification-mass spectrometry; supports broad protein-binding annotations
      of HSP82 as a chaperone hub.
    full_text_unavailable: true
- id: PMID:11914276
  title: Subcellular localization of the yeast proteome.
  findings:
  - statement: Subcellular localization survey assigns HSP82 to the cytoplasm in S. cerevisiae,
      consistent with its predominant cytosolic chaperone role.
    full_text_unavailable: true
- id: PMID:12235160
  title: N-terminal residues regulate the catalytic efficiency of the Hsp90 ATPase cycle.
  findings:
  - statement: Direct biochemical assay of ATPase activity
    full_text_unavailable: true
- id: PMID:12604615
  title: Aha1 binds to the middle domain of Hsp90, contributes to client protein activation, and
    stimulates the ATPase activity of the molecular chaperone.
  findings:
  - statement: Aha1 binds the middle domain of Hsp90 (HSP82), stimulates ATPase activity, and
      contributes to client protein activation, anchoring HSP82 in the canonical Hsp90 co-chaperone
      cycle.
    full_text_unavailable: true
- id: PMID:12853471
  title: The molecular chaperone Hsp90 plays a role in the assembly and maintenance of the 26S
    proteasome.
  findings:
  - statement: HSP82/Hsp90 is required for assembly and maintenance of the 26S proteasome in vivo,
      supporting GO:0043248 proteasome assembly as a client-dependent secondary function.
    supporting_text: Functional loss of Hsp90 using a temperature-sensitive mutant in yeast caused
      dissociation of the 26S proteasome.
    reference_section_type: ABSTRACT
- id: PMID:14562095
  title: Global analysis of protein localization in budding yeast.
  findings:
  - statement: Genome-wide GFP localization study assigns HSP82 to the cytoplasm in S. cerevisiae.
    full_text_unavailable: true
- id: PMID:14729968
  title: The ctf13-30/CTF13 genomic haploinsufficiency modifier screen identifies the yeast
    chromatin remodeling complex RSC, which is required for the establishment of sister chromatid
    cohesion.
  findings:
  - statement: This paper supplied one IntAct HSP82 physical-interaction row; the generic
      GO:0005515 annotation is removed because protein binding is not an informative molecular
      function for Hsp82.
    full_text_unavailable: true
- id: PMID:15102838
  title: 'A novel mode of chaperone action: heme activation of Hap1 by enhanced association of Hsp90 with
    the repressed Hsp70-Hap1 complex.'
  findings:
  - statement: HSP82/Hsp90 activates the heme-regulated transcription factor Hap1 by enhancing
      association with the repressed Hsp70-Hap1 complex; demonstrates client-specific chaperone
      action.
    full_text_unavailable: true
- id: PMID:15766533
  title: 'Navigating the chaperone network: an integrative map of physical and genetic interactions mediated
    by the hsp90 chaperone.'
  findings:
  - statement: Integrative map of HSP82/Hsp90 physical and genetic interactions defines its central
      position in the yeast chaperone network.
    full_text_unavailable: true
- id: PMID:15879519
  title: A two-hybrid screen of the yeast proteome for Hsp90 interactors uncovers a novel Hsp90
    chaperone requirement in the activity of a stress-activated mitogen-activated protein kinase,
    Slt2p (Mpk1p).
  findings:
  - statement: Yeast two-hybrid screen of the proteome identifies many HSP82/Hsp90 interactors,
      supporting its role as a chaperone hub.
    full_text_unavailable: true
- id: PMID:16407978
  title: The phosphatase Ppt1 is a dedicated regulator of the molecular chaperone Hsp90.
  findings:
  - statement: The phosphatase Ppt1 is a dedicated regulator of HSP82/Hsp90 chaperone activity,
      identifying a specific co-chaperone-like interaction.
    full_text_unavailable: true
- id: PMID:16429126
  title: Proteome survey reveals modularity of the yeast cell machinery.
  findings:
  - statement: Proteome survey of yeast cellular machinery places HSP82 within multi-protein modules
      consistent with its chaperone hub status.
    full_text_unavailable: true
- id: PMID:16487343
  title: The molecular chaperone Hsp90 is required for high osmotic stress response in Saccharomyces
    cerevisiae.
  findings:
  - statement: HSP82/Hsp90 is required for the high osmotic stress response in S. cerevisiae,
      supporting GO:0006970 response to osmotic stress as a client-dependent function.
    full_text_unavailable: true
- id: PMID:16554755
  title: Global landscape of protein complexes in the yeast Saccharomyces cerevisiae.
  findings:
  - statement: HSP82 is part of the global landscape of yeast protein complexes mapped by tandem
      affinity purification.
    full_text_unavailable: true
- id: PMID:16625188
  title: Crystal structure of an Hsp90-nucleotide-p23/Sba1 closed chaperone complex.
  findings:
  - statement: Crystal structure of full-length Hsp82 dimer in closed conformation with SBA1 and ATP
    supporting_text: Here we present the crystal structure of full-length yeast Hsp90 in complex
      with an ATP analogue and the co-chaperone p23/Sba1.
    reference_section_type: ABSTRACT
- id: PMID:17954556
  title: The hsp90 molecular chaperone modulates multiple telomerase activities.
  findings:
  - statement: HSP82/Hsp90 modulates multiple telomerase activities, supporting its role in positive
      regulation of telomere maintenance via telomerase as a client-dependent function.
    full_text_unavailable: true
- id: PMID:18268103
  title: Molecular chaperone Hsp90 stabilizes Pih1/Nop17 to maintain R2TP complex activity that
    regulates snoRNA accumulation.
  findings:
  - statement: HSP82/Hsp90 stabilizes Pih1/Nop17 to maintain R2TP complex activity that regulates
      snoRNA accumulation, providing IMP evidence for box C/D snoRNP assembly involvement.
    supporting_text: Together with the Tah1 cofactor, Hsp90 functions to stabilize Pih1. As a
      consequence, the chaperone is shown to affect box C/D accumulation and maintenance, especially
      under stress conditions.
    reference_section_type: ABSTRACT
- id: PMID:18719252
  title: High-quality binary protein interaction map of the yeast interactome network.
  findings:
  - statement: HSP82 is captured in a high-quality binary interaction map of the yeast interactome.
    full_text_unavailable: true
- id: PMID:18818696
  title: Structural and functional coupling of Hsp90- and Sgt1-centred multi-protein complexes.
  findings:
  - statement: Structural and functional studies couple HSP82/Hsp90 to Sgt1-centered multi-protein
      complexes (yeast-specific Sgt1-Hsp90 interaction), supporting its co-chaperone-mediated client
      recruitment.
    full_text_unavailable: true
- id: PMID:18833289
  title: Structural and functional analysis of SGT1-HSP90 core complex required for innate immunity
    in plants.
  findings:
  - statement: Plant SGT1-HSP90 structural/functional study; cited here for cross-species context on
      conserved Hsp90 chaperone-cochaperone scaffolding rather than direct yeast HSP82 evidence
      (yeast-specific Sgt1-Hsp90 interaction is documented in PMID:18818696).
    full_text_unavailable: true
- id: PMID:19536198
  title: 'An atlas of chaperone-protein interactions in Saccharomyces cerevisiae: implications to protein
    folding pathways in the cell.'
  findings:
  - statement: Yeast atlas of chaperone-protein interactions defines HSP82's extensive
      chaperone-client and chaperone-cochaperone interaction network.
    full_text_unavailable: true
- id: PMID:19696785
  title: Hsp90 is regulated by a switch point in the C-terminal domain.
  findings:
  - statement: Hsp82 is regulated by a C-terminal switch-point that modulates dimerization, ATPase,
      and client activation; supports identical protein binding (homodimerization) annotations.
    full_text_unavailable: true
- id: PMID:20736353
  title: Dynamics of heat shock protein 90 C-terminal dimerization is an important part of its
    conformational cycle.
  findings:
  - statement: C-terminal dimerization dynamics of HSP82 are an integral part of its conformational
      cycle, providing additional support for homodimerization (GO:0042802).
    full_text_unavailable: true
- id: PMID:21170051
  title: Mixed Hsp90-cochaperone complexes are important for the progression of the reaction cycle.
  findings:
  - statement: Mixed Hsp82-cochaperone complexes are important for progression of the chaperone
      reaction cycle, supporting integration of HSP82 in dynamic multi-protein assemblies.
    full_text_unavailable: true
- id: PMID:21734642
  title: Combinatorial depletion analysis to assemble the network architecture of the SAGA and ADA
    chromatin remodeling complexes.
  findings:
  - statement: HSP82 was detected in combinatorial depletion analyses assembling the SAGA/ADA
      chromatin remodeling complex network, consistent with broad interactome.
    full_text_unavailable: true
- id: PMID:21829731
  title: HSP90 controls SIR2 mediated gene silencing.
  findings:
  - statement: HSP90 controls SIR2-mediated gene silencing, supporting client-dependent regulation
      of telomere maintenance and chromatin silencing.
    full_text_unavailable: true
- id: PMID:21892170
  title: Structural analysis of the interaction between Hsp90 and the tumor suppressor protein p53.
  findings:
  - statement: Structural analysis of HSP82-p53 interaction characterizes a client-binding interface
      relevant to Hsp90's tumor-suppressor chaperone activity.
    full_text_unavailable: true
- id: PMID:23217712
  title: CDK-dependent Hsp70 Phosphorylation controls G1 cyclin abundance and cell-cycle
    progression.
  findings:
  - statement: CDK-dependent Hsp70 phosphorylation controls G1 cyclin abundance, with HSP82
      contributing to cell-cycle progression via its co-chaperone partnership with Hsp70.
    full_text_unavailable: true
- id: PMID:23396352
  title: Integration of the accelerator Aha1 in the Hsp90 co-chaperone cycle.
  findings:
  - statement: Aha1 integrates as an accelerator of the HSP82/Hsp90 co-chaperone cycle, providing
      biochemical/structural support for ATPase regulation.
    full_text_unavailable: true
- id: PMID:24012479
  title: High-resolution structural analysis shows how Tah1 tethers Hsp90 to the R2TP complex.
  findings:
  - statement: Tah1 tethers Hsp90 to the R2TP complex through a TPR domain that binds the Hsp90
      C-terminal peptide.
    supporting_text: Tah1 bridges Hsp90 to R2TP. Its minimal TPR domain includes two TPR motifs and
      a capping helix
    reference_section_type: ABSTRACT
- id: PMID:24794838
  title: Structural basis for phosphorylation-dependent recruitment of Tel2 to Hsp90 by Pih1.
  findings:
  - statement: Structural basis for phosphorylation-dependent recruitment of Tel2 to HSP82/Hsp90 by
      Pih1 supports HSP82's role in TTT-R2TP-mediated kinase chaperoning.
    full_text_unavailable: true
- id: PMID:27068472
  title: Systematic Mutant Analyses Elucidate General and Client-Specific Aspects of Hsp90 Function.
  findings:
  - statement: Systematic mutant analysis of Hsp90 function
    full_text_unavailable: true
- id: PMID:27385335
  title: Detection of protein-protein interactions at the septin collar in Saccharomyces cerevisiae
    using a tripartite split-GFP system.
  findings:
  - statement: The tripartite split-GFP study used abundant cytosolic Hsp82 as a negative control,
      supporting diffuse cytosolic localization rather than septin-collar residency.
    full_text_unavailable: true
- id: PMID:31454312
  title: The role of structural pleiotropy and regulatory evolution in the retention of heteromers
    of paralogs.
  findings:
  - statement: Structural pleiotropy and regulatory evolution maintain HSP82-HSC82 paralog
      heteromers, providing further support for identical protein binding (homo- and
      heterodimerization).
    full_text_unavailable: true
- id: PMID:32920053
  title: A Single Site Phosphorylation on Hsp82 Ensures Cell Survival during Starvation in
    Saccharomyces cerevisiae.
  findings:
  - statement: Single-site phosphorylation on HSP82 governs nuclear redistribution during
      starvation; supports both cytoplasmic and nuclear pools of HSP82.
    supporting_text: Ppt1 regulates Hsp82 distribution in the cytoplasm and nucleus by
      dephosphorylating the S485 residue on Hsp82.
    reference_section_type: ABSTRACT
- id: PMID:37968396
  title: The social and structural architecture of the yeast protein interactome.
  findings:
  - statement: HSP82 is part of the social/structural architecture of the yeast protein interactome
      captured by integrative network analysis.
    full_text_unavailable: true
- id: PMID:9371781
  title: In vivo functions of the Saccharomyces cerevisiae Hsp90 chaperone.
  findings:
  - statement: In vivo demonstration of protein folding and refolding functions
    supporting_text: The data suggest that Hsp90 is not required for the de novo folding of most
      proteins, but it is required for a specific subset of proteins that have greater difficulty
      reaching their native conformations.
    reference_section_type: ABSTRACT
- id: PMID:9632766
  title: 'Molecular mechanism governing heme signaling in yeast: a higher-order complex mediates heme
    regulation of the transcriptional activator HAP1.'
  findings:
  - statement: HSP82 forms a higher-order complex that mediates heme regulation of the
      transcriptional activator HAP1, supporting client-dependent response to oxygen levels.
    full_text_unavailable: true
- id: PMID:9817749
  title: In vivo function of Hsp90 is dependent on ATP binding and ATP hydrolysis.
  findings:
  - statement: In vivo Hsp82 function is dependent on ATP binding and ATP hydrolysis, anchoring the
      ATPase cycle as essential for cellular chaperone activity.
    full_text_unavailable: true
- id: PMID:9819422
  title: Cns1 is an essential protein associated with the hsp90 chaperone complex in Saccharomyces
    cerevisiae that can restore cyclophilin 40-dependent functions in cpr7Delta cells.
  findings:
  - statement: Cns1 is an essential Hsp82-associated co-chaperone that can restore cyclophilin
      40-dependent functions in cpr7Delta cells, supporting HSP82 cochaperone-network annotations.
    full_text_unavailable: true
- id: PMID:2674684
  title: hsp82 is an essential protein that is required in higher concentrations for growth of cells
    at higher temperatures.
  findings:
  - statement: HSP82 is essential and required at higher concentrations for growth at elevated
      temperatures
    full_text_unavailable: true
- id: file:yeast/HSP82/HSP82-deep-research-falcon.md
  title: Falcon deep research report on yeast HSP82 (Hsp90)
  findings:
  - statement: 'Hsp82 is an ATP-dependent molecular chaperone that assists late-stage folding, activation,

      and stability of a defined set of specific client proteins, acting as a selective proteostasis

      hub rather than a general chaperone for all misfolded proteins.

      '
    supporting_text: Hsp82 (Hsp90) is an **ATP-dependent molecular chaperone** that assists the
      **late-stage folding, activation, and stability** of a large set of specific “client” proteins
      (substrates), including many signaling regulators (notably protein kinases and transcription
      factors).
    reference_section_type: RESULTS
  - statement: 'Yeast Hsp90 (Hsp82/Hsc82) is a dimeric chaperone cycling between an open, C-terminally

      dimerized state and an ATP-induced closed state with additional N-terminal contacts, regulated

      by co-chaperones.

      '
    supporting_text: 'Yeast Hsp90 (Hsp82/Hsc82) is a **dimeric** chaperone cycling between:

      - an **open** state (C-terminally dimerized) and

      - an **ATP-induced closed** state with additional N-terminal contacts.'
    reference_section_type: RESULTS
  - statement: 'Yeast has approximately 14 Hsp90 co-chaperones that target clients, modulate ATPase activity,

      and stabilize or destabilize conformational states; Sti1/Hop targets clients to open Hsp90,

      Sba1/p23 stabilizes closed states, Aha1 stimulates ATP hydrolysis, and Cdc37 targets kinases.

      '
    supporting_text: 'Yeast has ~14 Hsp90 co-chaperones (diverse domain architectures) that **target clients**,
      **modulate ATPase activity**, and **stabilize or destabilize** conformational states:'
    reference_section_type: RESULTS
  - statement: 'HSP82 is the heat-inducible cytosolic Hsp90 isoform: very low at 25-30C and induced at
      37C to

      levels similar to the constitutive Hsc82, consistent with a stress-specialized role.

      '
    supporting_text: '**Hsp82 is very low at 25–30°C and induced at 37°C to levels similar to Hsc82**,
      consistent with a stress-specialized role.'
    reference_section_type: RESULTS
  - statement: 'Hsp82 is more thermally stable than Hsc82 (Tm ~60.4C vs 57.1C) and shows superior refolding

      (~29% vs ~14% full refolding events in single-molecule assays), while Hsc82 has somewhat

      higher ATPase activity, reflecting isoform specialization mapping to the N-terminal domain.

      '
    supporting_text: Hsp82 is **more thermally stable** than Hsc82 (Tm ~60.4°C vs 57.1°C).
      (girstmair2019thehsp90isoforms pages 1-2, girstmair2019thehsp90isoforms media 00261b28)
    reference_section_type: RESULTS
  - statement: 'Hsp90 is required for basal and pheromone-induced MAPK signaling in yeast, with Ste11

      (the yeast Raf-equivalent MAPKKK) identified as a key endogenous client/substrate required

      for pathway accumulation and function.

      '
    supporting_text: '**MAPK/pheromone signaling:** Hsp90 is required for basal and pheromone-induced
      MAPK signaling, with **Ste11 (yeast Raf-equivalent MAPKKK)** identified as a key endogenous Hsp90
      client/substrate required for accumulation and pathway function.'
    reference_section_type: RESULTS
  - statement: 'The HSP82/HSC82 family is essential: single deletion is viable but double disruption is

      lethal, and at least one cytosolic Hsp90 isoform is required for viability.

      '
    supporting_text: Classic yeast genetics and biochemistry established that the HSP82/HSC82 family
      is **essential** (double disruption lethal), and that Hsp90 supports key signaling regulators.
    reference_section_type: RESULTS
  - statement: 'Cytosolic Hsp90 (Hsp82/Hsc82) is broadly distributed during vegetative growth but

      accumulates in the nucleus in quiescent cells (glucose exhaustion) and in sporulating

      diploids, where nuclear accumulation defects correlate with sporulation/spore-wall defects.

      '
    supporting_text: '**Condition-dependent nuclear accumulation:** A key cell-biological finding is that
      Hsp90 (and the cochaperone Sba1/p23) **accumulates in the nucleus in quiescent cells (glucose exhaustion)**
      and in sporulating diploids; nuclear accumulation defects correlate with **sporulation/spore-wall
      defects**, and pharmacological inhibition (macbecin) similarly disrupts nuclear accumulation and
      spore development.'
    reference_section_type: RESULTS
- id: PMID:12526792
  title: Molecular chaperones Hsp90 and Hsp70 deliver preproteins to the mitochondrial import
    receptor Tom70.
  findings:
  - statement: The Tom70 import paper found that yeast mitochondrial preprotein import uses Hsp70
      rather than Hsp90, contradicting the HSP82 IPI annotation to protein localization to
      mitochondrion.
    supporting_text: In yeast, Hsp70 rather than Hsp90 is used in import, and Hsp70 docking is
      required for the formation of a productive preprotein/Tom70 complex
    reference_section_type: ABSTRACT
- id: PMID:28278223
  title: The structure of FKBP38 in complex with the MEEVD tetratricopeptide binding-motif of Hsp90.
  findings:
  - statement: The FKBP38/FKBP8 TPR domain binds the yeast Hsp90 C-terminal MEEVD motif, and a
      carboxylate-clamp mutation disrupts binding.
    supporting_text: Yeast Hsp90 C-terminal domain failed to bind the K307E mutant of FKBP92-380
      suggesting that its binding was completely disrupted
    reference_section_type: DISCUSSION
- id: PMID:40691164
  title: ATP plays a structural role in Hsp90 function.
  findings:
  - statement: A 2025 Hsp82 nucleotide-pocket mutational analysis supports a structural role for ATP
      in tethering the N and M domains and stabilizing the closed clamp.
    supporting_text: ATP is a linker that physically tethers the N and M domains and stabilizes
      closing
    reference_section_type: ABSTRACT
suggested_questions:
- question: Which client proteins (kinases, transcription factors, ribosome assembly factors) most
    strongly depend on HSP82 nucleotide-state transitions, and how do conformational dwell times map
    to client maturation efficiency?
- question: How does the HSP82/HSC82 paralog ratio shift the chaperone interactome composition
    (co-chaperones, clients) under heat versus standard growth, and what fraction of clients are
    paralog-specific?
- question: What role does single-site phosphorylation (e.g., starvation-dependent) play in
    compartment-specific HSP82 localization (nucleus vs cytoplasm) and client engagement?
suggested_experiments:
- description: Deplete or inhibit HSP82 (e.g., temperature-sensitive alleles, radicicol) and use
    AP-MS to map condition-dependent client losses, comparing standard growth to heat shock and
    starvation conditions to dissect core vs. stress-specific clientele.
- description: Reconstitute the full Hsp82 conformational cycle in vitro with purified HSP82 dimers,
    ATP, and a panel of co-chaperones (Sti1, Aha1, Sba1, Cdc37, Cpr6/7, Cns1) plus a model client
    kinase, and use single-molecule FRET to measure ATP-dependent open/closed dwell times.
- description: Generate separation-of-function HSP82 alleles that selectively impair ATPase,
    dimerization, or co-chaperone binding (using systematic mutagenesis of the M-domain) and measure
    client-specific phenotypes (e.g., HAP1, telomerase, R2TP, proteasome) to dissect contributions
    to each downstream pathway.
