- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: HSP82 has well-characterized ATPase activity that regulates its conformational
      chaperone cycle. The IBA annotation is correct. Falcon deep research places ATP hydrolysis
      within the dimeric open/closed conformational cycle, noting that the constitutive paralog
      Hsc82 has somewhat higher ATPase activity than Hsp82 (~1.3-fold at 30C, ~1.6-fold at 37C),
      with kinetic differences mapping to N-terminal-domain substitutions near the nucleotide
      pocket.
    action: ACCEPT
    reason: ATP hydrolysis and nucleotide exchange are conserved features of the Hsp90 cycle and
      ATPase activity is directly demonstrated for yeast Hsp90 (PMID:12235160). The activity
      annotation does not require the stronger claim that hydrolysis rate alone determines every
      essential in vivo function.
    additional_reference_ids:
    - file:yeast/HSP82/HSP82-deep-research-falcon.md
    supported_by:
    - reference_id: file:yeast/HSP82/HSP82-deep-research-falcon.md
      supporting_text: Client loading, conformational closing, ATP hydrolysis/nucleotide exchange,
        and reopening are **regulated by co-chaperones** that bind distinct surfaces and bias the
        timing of transitions
    - reference_id: file:yeast/HSP82/HSP82-deep-research-falcon.md
      supporting_text: Hsc82 exhibits **higher ATPase activity** than Hsp82 at both 30°C and 37°C in
        comparative assays, and kinetic differences map largely to N-terminal-domain substitutions
        near the nucleotide pocket
