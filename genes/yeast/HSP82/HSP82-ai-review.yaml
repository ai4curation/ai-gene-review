    label: protein folding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: HSP82/Hsp90 is a well-established protein folding chaperone. IBA annotation is
      consistent with the known function of this conserved chaperone family across eukaryotes.
      Falcon deep research frames Hsp82 as a selective proteostasis hub that assists late-stage
      folding, activation, and stability of specific client proteins rather than acting as a general
      chaperone for all misfolded proteins.
    action: ACCEPT
    reason: Protein folding is a core biological process for Hsp90. UniProt describes HSP82 as a
      "Molecular chaperone that promotes the maturation, structural maintenance and proper
      regulation of specific target proteins." Multiple IMP and IDA evidence codes confirm
      involvement in selective client-protein folding (PMID:10564510, PMID:9371781).
