id: P02829
gene_symbol: HSP82
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Hsp82 is the stress-inducible cytosolic Hsp90 paralog in S. cerevisiae and shares about
  97% amino-acid identity with the constitutively expressed Hsc82. It is a homodimeric ATP-dependent
  molecular chaperone that promotes late-stage folding, activation, and structural maintenance of
  selected client proteins, including the MAPKKK Ste11 and transcriptional regulators. ATP binding,
  nucleotide-state exchange, conformational transitions, and cochaperones such as Sti1, Aha1, Cdc37,
  and Sba1 together control client loading, maturation, and release. Hsp82 is expressed at low
  abundance under nonstress conditions, is strongly induced by heat, and is more thermally stable
  than Hsc82. It is predominantly cytosolic during vegetative growth and can accumulate in the
  nucleus during quiescence and sporulation.
