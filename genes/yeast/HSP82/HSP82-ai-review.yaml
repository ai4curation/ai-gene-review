  evidence_type: IDA
  original_reference_id: PMID:32920053
  review:
    summary: 'IDA evidence for nuclear localization from starvation phosphorylation study. Falcon deep
      research reinforces a condition-dependent nuclear pool: Hsp90 (with the co-chaperone Sba1/p23) accumulates
      in the nucleus in quiescent cells (glucose exhaustion) and in sporulating diploids, where nuclear
      accumulation defects correlate with sporulation/spore-wall defects.'
    action: KEEP_AS_NON_CORE
    reason: HSP82 is primarily cytoplasmic but a nuclear pool exists, enhanced during starvation,
      quiescence, and sporulation. The starvation study (PMID:32920053) showed
      phosphorylation-dependent nuclear localization, and falcon deep research corroborates
      condition-dependent nuclear accumulation (Tapia & Morano 2010). Nuclear localization remains a
      regulated, non-core compartment rather than the primary site of action.
