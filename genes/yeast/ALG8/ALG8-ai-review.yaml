suggested_questions:
- question: Can Alg8 activity be shown directly with purified protein and defined Dol-P-Glc and Glc1Man9GlcNAc2-PP-Dol
    substrates, as has been done for Alg6?
suggested_experiments:
- description: Reconstitute purified Alg8 with synthetic Dol-P-Glc analogue and Glc1Man9GlcNAc2-PP-lipid
    acceptor (made with Alg6), and mutate the residue equivalent to Alg6 Asp69 to test the conserved GT-C
    catalytic base.
