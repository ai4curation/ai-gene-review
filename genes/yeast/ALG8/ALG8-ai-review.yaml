gene_symbol: ALG8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Alg8 is a multi-pass ER membrane glucosyltransferase of the ALG6/ALG8 family (GT-C superfamily).
  It adds the second glucose to the lipid-linked oligosaccharide: it transfers glucose from dolichyl-phosphate-glucose
  in α1,3 linkage onto Glc1Man9GlcNAc2-PP-dolichol to give Glc2Man9GlcNAc2-PP-dolichol (EC 2.4.1.265),
  which is the substrate for Alg10 (Die2). The reaction takes place on the lumenal side of the ER membrane.
  Alg8 is a paralogue of Alg6, which adds the first α1,3-glucose. ALG8 is not essential. alg8 cells accumulate
  Glc1Man9GlcNAc2-PP-dolichol and transfer the incompletely glucosylated glycan to proteins. This causes
  underglycosylation of secreted proteins, which becomes severe and growth-limiting when oligosaccharyltransferase
  activity is reduced.'
