  text: Enables dolichyl pyrophosphate Glc1Man9GlcNAc2 alpha-1,3-glucosyltransferase
    activity. Involved in dolichol-linked oligosaccharide biosynthetic process. Located
    in endoplasmic reticulum. Is active in endoplasmic reticulum membrane. Used to
    study congenital disorder of glycosylation type I. Human ortholog(s) of this gene
    implicated in congenital disorder of glycosylation Ih and polycystic liver disease
    3. Orthologous to human ALG8 (ALG8 alpha-1,3-glucosyltransferase).
