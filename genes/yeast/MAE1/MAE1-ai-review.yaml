core_functions:
- description: Mitochondrial matrix malic enzyme that oxidatively decarboxylates (S)-malate to pyruvate
    + CO2 using NAD+ or NADP+, providing intramitochondrial pyruvate (and reducing equivalents) for biosynthesis,
    redundantly with pyruvate kinase during growth on C2 carbon sources.
  molecular_function:
    id: GO:0004470
    label: malic enzyme activity
  directly_involved_in:
  - id: GO:0042866
    label: pyruvate biosynthetic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:9603875
    supporting_text: Disruption of open reading frame YKL029c, which is homologous to malic enzyme genes
      from other organisms, abolished malic enzyme activity in extracts of glucose-grown cells.
  - reference_id: PMID:9603875
    supporting_text: Subcellular fractionation experiments indicated that malic enzyme in S. cerevisiae
      is a mitochondrial enzyme.
  - reference_id: PMID:9603875
    supporting_text: the mitochondrial malic enzyme can meet the biosynthetic requirement of S. cerevisiae
      for pyruvate during growth on ethanol or acetate
suggested_questions:
- question: What is the in vivo cofactor preference (NAD+ vs NADP+) of Mae1p, and does it contribute measurably
    to mitochondrial NADPH supply under anaerobic conditions?
suggested_experiments:
- description: Purify recombinant Mae1p and determine kinetic constants with NAD+ and NADP+, and test
    oxaloacetate decarboxylase side activity; combine with mitochondrial NADPH sensors in mae1 vs wild
    type under anaerobiosis.
