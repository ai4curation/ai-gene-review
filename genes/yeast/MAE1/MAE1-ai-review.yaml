id: P36013
gene_symbol: MAE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'MAE1 encodes the sole malic enzyme of Saccharomyces cerevisiae, a mitochondrial matrix enzyme
  that catalyses the oxidative decarboxylation of (S)-malate to pyruvate and CO2, reducing NAD+ or NADP+
  (the yeast enzyme has been reported to use both). MAE1 is expressed constitutively, with a 3-4-fold
  induction during anaerobic growth on glucose. Mae1p provides an alternative route to pyruvate when pyruvate
  kinase is not available: pyk1 mae1 double mutants cannot grow on ethanol unless alanine or pyruvate
  is supplied, whereas mae1 single mutants lack a clear phenotype. Its role is therefore biosynthetic/anaplerotic
  (pyruvate for alanine, valine, leucine and isoleucine synthesis, and possibly intramitochondrial NADPH),
  rather than a step of the TCA cycle or of gluconeogenesis.'
