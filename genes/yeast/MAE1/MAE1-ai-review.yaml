  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:GLUCONEO-PWY-1
  review:
    summary: YeastPathways RCA from gluconeogenesis I (GLUCONEO-PWY-1), which includes malate -> pyruvate
      by malic enzyme (a MetaCyc route for C4-acid utilisation). In S. cerevisiae Mae1p runs in the opposite
      direction to gluconeogenic flux from C2 substrates (it makes pyruvate from malate); its demonstrated
      role on ethanol is to provide pyruvate for biosynthesis (alanine/branched-chain amino acids), not
      to make PEP or sugars. mae1 single mutants have no clear phenotype on gluconeogenic carbon sources.
    action: MARK_AS_OVER_ANNOTATED
    reason: Pathway-inherited assignment not supported by the physiology of Mae1p in yeast.
    supported_by:
