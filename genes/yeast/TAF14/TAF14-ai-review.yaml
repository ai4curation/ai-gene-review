id: P35189
gene_symbol: TAF14
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Taf14 (TBP-associated factor 14; also Anc1, Tfg3, Taf30, Swp29; YPL129W) is a small, non-essential
  nuclear YEATS-domain protein of budding yeast that is a shared subunit of several transcription and
  chromatin complexes: the general transcription factors TFIID (three copies, tethered by Taf2) and TFIIF
  (with Tfg1 and Tfg2; no counterpart in metazoan TFIIF), the ATP-dependent chromatin remodelers SWI/SNF,
  RSC and INO80, and the NuA3 histone H3 acetyltransferase. Taf14 has three functional regions. The N-terminal
  YEATS domain reads histone H3 acylated at lysine 9, binding H3K9ac through an aromatic cage and H3K9
  crotonylation more tightly through a pi-pi-pi stacking mechanism. The C-terminal extra-terminal (ET)
  domain docks onto a short conserved motif in a core subunit of each host complex (Taf2, Tfg1, Snf5,
  Sth1, Ino80, Sas3 and Yng1), which is how Taf14 is held in these complexes; in NuA3 two such motifs,
  from Sas3 and Yng1, are sandwiched between two ET domains. The linker between the two domains binds
  DNA without sequence specificity; the interaction is autoinhibited in free Taf14 and released when Taf2
  binds, and it is needed for TFIID function when the histone variant H2A.Z is absent. Taf14 thus contributes
  to RNA polymerase II transcription initiation and to chromatin remodeling and histone acetylation by
  its host complexes; disrupting its histone binding impairs gene transcription and the DNA damage response.
  Deletion is viable but causes slow growth, and the gene was first isolated as anc1, an actin non-complementing
  mutant.'
