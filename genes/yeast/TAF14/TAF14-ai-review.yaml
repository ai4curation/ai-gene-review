- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:35970389
  qualifier: enables
  review:
    summary: The Taf14 linker region binds DNA nonspecifically.
    action: ACCEPT
    reason: Purified Taf14 binds DNA in mobility shift assays through the linker between the YEATS and
      ET domains (residues 146 to 170), with low-micromolar, nonspecific affinity; the linker is required
      in vivo when H2A.Z is absent (PMID:35970389). An independent study found the same linker activity,
      autoinhibited in free Taf14 and released by Taf2 binding (PMID:35676274). UniProt's statement that
      Taf14 does not bind DNA rests on the isolated YEATS domain only (PMID:30385749) and is out of date;
      recorded as a source defect on the UniProt reference. Accepted as part of Taf14's contribution to
      TFIID.
    supported_by:
    - &id037
      reference_id: PMID:35970389
      supporting_text: We further show that the linker region of Taf14 interacts with DNA.
    - &id036
      reference_id: PMID:35970389
      supporting_text: This shows that the linker region between amino acid residues 146 and 170 is required
        for DNA binding of Taf14 protein, while the YEATS domain is dispensable for this activity.
    - &id038
      reference_id: PMID:35676274
      supporting_text: Binding of Taf2 promotes a conformational rearrangement in Taf14, resulting in
        a release of the linker for the engagement with DNA and the nucleosome.
    - &id035
      reference_id: PMID:30385749
      supporting_text: Importantly, AF9-YEATS is capable of binding to DNA, whereas Taf14-YEATS is not.
