suggested_questions:
- question: Should UniProt revise the TAF14 FUNCTION sentence "Does not bind DNA (PubMed:30385749)", which
    rests on the isolated YEATS domain, given that the full-length protein binds DNA through its linker
    (PMID:35970389, PMID:35676274)?
- question: Should SGD withdraw the TAF14 mediator complex annotation (IDA, PMID:8187178), which reflects
    TFIIF co-purifying with the first mediator preparation?
suggested_experiments:
- description: Quantify Taf14 partitioning among TFIID, TFIIF, SWI/SNF, RSC, INO80 and NuA3 in cells,
    and test separation-of-function alleles (YEATS cage, linker, ET) for complex-specific transcription
    defects.
knowledge_gaps:
- gap_statement: Which of Taf14's three activities (YEATS acyl-lysine reading, linker DNA binding and
    extra-terminal docking) each of its host complexes depends on, and how Taf14 is shared among those
    complexes in the cell, is not known.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Taf14 is a subunit of at least six complexes. Its extra-terminal domain alone accounts
    for complex association, its linker DNA binding is needed for TFIID function without H2A.Z, and its
    YEATS reading supports transcription and the DNA damage response, yet no role in NuA3 recruitment
    was found for the YEATS domain. Assigning each activity to a host complex would say what Taf14 contributes
    to each, and whether one complex limits Taf14 available to the others.
  provenance:
  - *id016
  - *id029
  - *id040
