core_functions:
- description: 'Zinc-dependent 5-aminolevulinate dehydratase (porphobilinogen synthase): condenses two molecules
    of 5-aminolevulinate to form the monopyrrole porphobilinogen, the second step of tetrapyrrole (heme and siroheme)
    biosynthesis, as a cytosolic homo-octamer.'
