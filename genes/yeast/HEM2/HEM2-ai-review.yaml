suggested_questions:
- question: How is ALAD activity regulated in yeast in response to heme status, given that HEM2 overexpression alone
    increases porphyrin accumulation?
suggested_experiments:
- hypothesis: Hem2p oligomeric state (octamer vs lower-order assemblies) modulates flux into the tetrapyrrole pathway
    in vivo
  description: Introduce assembly-altering mutations analogous to human ALAD morpheein variants into chromosomal
    HEM2 and measure heme, siroheme-dependent sulfite reductase activity and PBG accumulation.
  experiment_type: genetic / metabolite analysis
