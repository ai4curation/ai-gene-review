gene_symbol: HEM2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: HEM2 encodes 5-aminolevulinate dehydratase (ALAD, porphobilinogen synthase, EC 4.2.1.24). This cytosolic
  homo-octameric enzyme condenses two molecules of 5-aminolevulinate (ALA) into the monopyrrole porphobilinogen
  (PBG), the second step of tetrapyrrole biosynthesis. Yeast ALAD belongs to the zinc-requiring class of ALADs (one
  Zn2+ per monomer), needs reduced thiols for full activity, and is inhibited by Pb2+ and Cu2+ and by succinylacetone.
  hem2 mutants lack ALAD activity and are heme auxotrophs that are respiratory-deficient and sterol/unsaturated-fatty-acid-dependent.
  They also need methionine because they cannot make siroheme for sulfite reductase, so PBG feeds both the heme
  and the siroheme branches. Overproduction of Hem2p causes porphobilinogen and porphyrin accumulation, so ALAD
  is one of the rate-limiting steps of yeast heme synthesis.
