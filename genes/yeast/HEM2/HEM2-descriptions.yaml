gene_symbol: HEM2
organism: yeast
uniprot_id: P05373
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes an early step in the biosynthesis of tetrapyrroles. Binds two molecules
    of 5-aminolevulinate per subunit, each at a distinct site, and catalyzes their
    condensation to form porphobilinogen.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P05373
  source_id: P05373
- source: Alliance_Imported
  text: Aminolevulinate dehydratase; a homo-octameric enzyme, catalyzes the conversion
    of 5-aminolevulinate to porphobilinogen, the second step in heme biosynthesis;
    enzymatic activity is zinc-dependent; localizes to the cytoplasm and nucleus;
    human homolog ALAD can complement yeast hem2 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/HEM2
  source_id: SGD:S000003008
- source: Alliance_Automated
  text: Enables porphobilinogen synthase activity and zinc ion binding activity. Involved
    in heme biosynthetic process. Located in cytoplasm and nucleus. Human ortholog(s)
    of this gene implicated in acute porphyria; porphyria cutanea tarda; and sickle
    cell anemia. Orthologous to human ALAD (aminolevulinate dehydratase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HEM2
  source_id: SGD:S000003008
