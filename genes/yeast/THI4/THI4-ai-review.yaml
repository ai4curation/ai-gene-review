  label: Saccharomyces cerevisiae S288C
description: THI4 (YGR144W) encodes thiamine thiazole synthase (ADP-thiazole synthase, EC 2.4.2.60), the
  single enzyme that forms the thiazole moiety of thiamine (vitamin B1) in Saccharomyces cerevisiae and
  other eukaryotes. Thi4 condenses NAD+ and glycine into the adenylated thiazole intermediate ADP-5-ethyl-4-methylthiazole-2-carboxylate
  (ADT), releasing nicotinamide; the thiazole sulfur is donated by its own active-site Cys205, which is
  converted to dehydroalanine in an Fe(II)-dependent sulfide transfer. Each Thi4 polypeptide therefore
  performs a single turnover (a suicide enzyme). Thi4 forms a homo-octamer (tetramer of dimers), binds
  one iron per subunit, is one of the most abundant THI-regulon proteins under thiamine limitation, and
  is strongly repressed by thiamine. It is cytosolic (also detected in the nucleus); thi4 mutants are
  thiamine auxotrophs rescued by hydroxyethylthiazole. Additional roles in stress tolerance and mitochondrial
  DNA damage tolerance have been reported.
