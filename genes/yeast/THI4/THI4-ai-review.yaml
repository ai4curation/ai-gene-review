suggested_questions:
- question: Which enzyme converts Thi4's product ADT to the carboxythiazole phosphate used by Thi6 in
    yeast (YeastPathways assigns this hydrolysis to Thi4 without direct evidence)?
- question: Are the reported stress/mitochondrial DNA damage tolerance phenotypes of thi4 mutants independent
    of thiamine supply (e.g. via iron sequestration by the abundant spent enzyme)?
suggested_experiments:
- description: Incubate purified ADT with yeast cytosolic extracts (and candidate Nudix hydrolases) to
    identify the ADT-to-thiazole-phosphate hydrolase; test thi4 Cys205Ser for rescue of non-thiamine phenotypes.
