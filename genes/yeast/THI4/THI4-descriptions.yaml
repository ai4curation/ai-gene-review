gene_symbol: THI4
organism: yeast
uniprot_id: P32318
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in biosynthesis of the thiamine precursor thiazole. Catalyzes the
    conversion of NAD and glycine to adenosine diphosphate 5- (2-hydroxyethyl)-4-methylthiazole-2-carboxylic
    acid (ADT), an adenylated thiazole intermediate. The reaction includes an iron-
    dependent sulfide transfer from a conserved cysteine residue of the protein to
    a thiazole intermediate. The enzyme can only undergo a single turnover, which
    suggests it is a suicide enzyme. May have additional roles in adaptation to various
    stress conditions and in DNA damage tolerance.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32318
  source_id: P32318
- source: Alliance_Imported
  text: Thiazole synthase; abundant protein involved in the formation of the thiazole
    moiety of thiamine during thiamine biosynthesis; acts more as a co-substrate rather
    than an enzyme by providing the sulphur source for thiazole formation; undergoes
    a single turnover only; required for mitochondrial genome stability in response
    to DNA damaging agents
  source_type: curated
  url: https://www.yeastgenome.org/locus/THI4
  source_id: SGD:S000003376
- source: Alliance_Automated
  text: Enables cysteine-dependent adenosine diphosphate thiazole synthase activity
    and ferrous iron binding activity. Involved in thiamine biosynthetic process and
    thiazole biosynthetic process. Located in cytosol and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/THI4
  source_id: SGD:S000003376
