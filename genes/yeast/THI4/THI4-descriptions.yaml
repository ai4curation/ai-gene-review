- source: Alliance_Imported
  text: Thiazole synthase; abundant protein involved in the formation of the thiazole
    moiety of thiamine during thiamine biosynthesis; acts more as a co-substrate rather
    than an enzyme by providing the sulphur source for thiazole formation; undergoes
    a single turnover only; required for mitochondrial genome stability in response
    to DNA damaging agents
