- term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  evidence_type: IMP
  original_reference_id: PMID:11035018
  qualifier: involved_in
  review:
    summary: >-
      Arh1 depletion dysregulates cellular iron uptake and causes mitochondrial iron overload, together
      with loss of Fe-S enzyme activities.
    action: KEEP_AS_NON_CORE
    reason: >-
      Iron dysregulation is a downstream consequence of defective Fe-S cluster assembly (iron regulon
      signalling depends on Fe-S cluster export); Arh1 is not itself an iron homeostasis regulator.
    supported_by:
    - &id005
      reference_id: PMID:11035018
      supporting_text: >-
        Thus, Arh1p is required for control of cellular and mitochondrial iron levels and for the activities
        of Fe-S cluster proteins
