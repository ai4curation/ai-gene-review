id: P48360
gene_symbol: ARH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  ARH1 (YDR376W) encodes the essential mitochondrial NADPH-adrenodoxin (ferredoxin) reductase of S. cerevisiae.
  It is an FAD-containing flavoprotein of the ferredoxin-NADP reductase type 1 family that fractionates with the inner mitochondrial membrane, where it is thought to associate peripherally on the matrix side next to its soluble partner Yah1.
  Arh1 transfers electrons from NADPH (and less efficiently NADH) to the [2Fe-2S] ferredoxin Yah1, and
  the reduced ferredoxin then supplies electrons for Fe-S cluster synthesis on the Isu1 scaffold, for
  the Cox15-dependent conversion of heme O to heme A, and for coenzyme Q6 biosynthesis (probably the Coq6
  hydroxylation). Loss of Arh1 impairs Fe-S protein activities and causes cellular and mitochondrial iron
  dysregulation.
