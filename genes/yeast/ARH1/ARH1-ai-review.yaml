- term:
    id: GO:0016226
    label: iron-sulfur cluster assembly
  evidence_type: IMP
  original_reference_id: PMID:11035018
  qualifier: involved_in
  review:
    summary: >-
      Arh1 depletion abolishes aconitase and other mitochondrial and cytosolic Fe-S protein activities
      without lowering protein levels, and the Arh1-Yah1 chain is established as the electron source for
      Fe-S cluster synthesis on Isu1 (PMID:12970193). Its partner ferredoxin YAH1 already carries GO:0016226
      in GOA, but ARH1 does not.
    action: NEW
    reason: >-
      Arh1 performs a step of the process itself: it reduces Yah1 with NADPH, and the reduced Yah1 supplies
      the electrons consumed during cluster formation. This is participation, not only necessity.
    supported_by:
    - *id005
    - &id007
      reference_id: PMID:12970193
      supporting_text: >-
        the requirement of an electron transfer chain consisting of ferredoxin (yeast Yah1p) and ferredoxin
        reductase (yeast Arh1p) is well established
