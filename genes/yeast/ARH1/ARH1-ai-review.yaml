- term:
    id: GO:0016226
    label: iron-sulfur cluster assembly
  evidence_type: IMP
  original_reference_id: PMID:11035018
  qualifier: involved_in
  review:
    summary: >-
      Arh1 depletion abolishes aconitase and other mitochondrial and cytosolic Fe-S protein activities
      without lowering protein levels, and the Arh1-Yah1 chain is established as the electron source for
      Fe-S cluster synthesis on Isu1 (PMID:12970193). Its partner ferredoxin YAH1 already carries GO:0016226
      in GOA, but ARH1 does not.
    action: NEW
    reason: >-
      Arh1 contributes the cofactor activity a step depends on: it reduces Yah1 with NADPH, and the reduced
      Yah1 supplies the electrons consumed during cluster formation on Isu1. This is the same electron-supply
      role for which GOA already annotates Arh1 to ubiquinone biosynthesis. Comparator check: the S. pombe
      ortholog arh1 (O59710) carries [2Fe-2S] cluster assembly (GO:0044571, IC, PomBase) and the partner
      ferredoxin Yah1 carries GO:0016226; human FDXR does not, so the convention is mixed rather than a
      systematic exclusion of reductases. The general parent term is used because Yah1 feeds both [2Fe-2S]
      and [4Fe-4S] cluster formation.
    supported_by:
    - *id005
    - &id007
      reference_id: PMID:12970193
      supporting_text: >-
        the requirement of an electron transfer chain consisting of ferredoxin (yeast Yah1p) and ferredoxin
        reductase (yeast Arh1p) is well established
