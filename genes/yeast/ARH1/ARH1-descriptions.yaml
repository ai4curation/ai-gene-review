descriptions:
- source: UniProt
  text: Adrenodoxin reductase transfers electrons from NADPH to adrenodoxin, which
    is involved in heme A biosynthesis and in iron- sulfur cluster assembly (PubMed:15211518,
    PubMed:9727014). Involved in the electron transfer to heme A synthase COX15, a
    heme protein that catalyzes the conversion of heme O to heme A (PubMed:11248251).
    Required for the de novo synthesis of Fe-S clusters on iron sulfur cluster assembly
    protein ISU1. Involved in electron delivery for Fe-S cluster synthesis (PubMed:15211518).
    Essential for coenzyme Q biosynthesis. May be involved in the electron transfer
    required for the hydroxylation reaction performed by COQ6 (PubMed:20534343, PubMed:21944752).
    May play a role in cellular and mitochondrial iron homeostasis (PubMed:11035018).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P48360
  source_id: P48360
- source: Alliance_Imported
  text: Oxidoreductase of the mitochondrial inner membrane; involved in cytoplasmic
    and mitochondrial iron homeostasis and required for activity of Fe-S cluster-containing
    enzymes; one of the few mitochondrial proteins essential for viability
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARH1
  source_id: SGD:S000002784
- source: Alliance_Automated
  text: Enables ferredoxin-NADP+ reductase activity. Involved in intracellular iron
    ion homeostasis and ubiquinone biosynthetic process. Located in mitochondrial
    inner membrane. Used to study Parkinson's disease; auditory system disease; optic
    atrophy; and retinitis pigmentosa. Human ortholog(s) of this gene implicated in
    auditory neuropathy and optic atrophy and multiple mitochondrial dysfunctions
    syndrome 9B. Orthologous to human FDXR (ferredoxin reductase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ARH1
  source_id: SGD:S000002784
