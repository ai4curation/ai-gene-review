gene_symbol: CDC37
organism: yeast
uniprot_id: P06101
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Co-chaperone that binds to numerous kinases and promotes their interaction
    with the Hsp90 complex, resulting in stabilization and promotion of their activity.
    Involved in both the HOG and the PKC MAP kinase signaling cascade necessary for
    adaptation to stress conditions due to high osmolarity or cell wall perturbation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P06101
  source_id: P06101
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
      notes: All statements are well-supported by literature.
    - rubric: utility
      score: 4
      notes: Good for understanding Hsp90/kinase relationship; lacks cell-cycle context.
    - rubric: compactness
      score: 4
      notes: Concise two-sentence summary; could be slightly tighter.
    - rubric: completeness
      score: 3
      notes: Misses essentiality, cell-cycle role, nascent-chain stabilization, and
        SPB duplication.
    - rubric: specificity
      score: 4
      notes: Names specific pathways (HOG, PKC MAPK) which is good; does not name
        specific kinase clients.
    overall_notes: Accurate and informative. Clearly conveys the kinase co-chaperone
      function and stress-signaling role. Misses the essential nature of CDC37, the
      cell-cycle requirement, and the nascent-chain stabilization mechanism. The MAPK
      cascade detail is valuable but arguably non-core.
- source: Alliance_Imported
  text: Essential Hsp90p co-chaperone; necessary for passage through the START phase
    of the cell cycle; stabilizes protein kinase nascent chains and participates along
    with Hsp90p in their folding
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDC37
  source_id: SGD:S000002575
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
      notes: Accurate; nascent chain stabilization is well-documented (PMID:17242065).
    - rubric: utility
      score: 5
      notes: Immediately conveys what CDC37 does and why it matters (essential, cell
        cycle, mechanism).
    - rubric: compactness
      score: 5
      notes: Three tightly packed clauses; no wasted words.
    - rubric: completeness
      score: 4
      notes: Misses stress-signaling pathways and SPB duplication, but captures the
        core well.
    - rubric: specificity
      score: 4
      notes: '"Nascent chains" and "START phase" are specific; could name example
        kinase clients.'
    overall_notes: Excellent compact summary that uniquely captures essentiality,
      cell-cycle requirement, and nascent-chain stabilization mechanism. Lacks the
      stress-signaling (HOG/PKC) context that UniProt provides. The most mechanistically
      informative of the curated descriptions.
- source: Alliance_Automated
  text: Enables protein carrier activity. Involved in several processes, including
    p38MAPK cascade; protein stabilization; and spindle pole body duplication. Located
    in cytoplasm. Orthologous to several human genes including CDC37 (cell division
    cycle 37, HSP90 cochaperone).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDC37
  source_id: SGD:S000002575
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Leads with protein carrier activity, p38MAPK cascade and spindle
      pole body duplication, which the review treats as downstream client effects.
      It never names the Hsp90 kinase co-chaperone role, except in the ortholog name.
- source: RefSeq
  text: Enables unfolded protein binding activity. Involved in several processes,
    including p38MAPK cascade; protein stabilization; and spindle pole body duplication.
    Located in cytoplasm. Orthologous to several human genes including CDC37 (cell
    division cycle 37, HSP90 cochaperone). [provided by Alliance of Genome Resources,
    Jul 2025]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/851746
  source_id: GeneID:851746
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
      notes: Same as Alliance automated; "unfolded protein binding" is misleading
        for this gene.
    - rubric: utility
      score: 2
      notes: No additional value beyond the Alliance automated source.
    - rubric: compactness
      score: 4
      notes: Same brevity as Alliance automated.
    - rubric: completeness
      score: 2
      notes: Same gaps as Alliance automated.
    - rubric: specificity
      score: 2
      notes: Same generic terms as Alliance automated.
    overall_notes: 'Identical to Alliance automated description with provenance attribution.
      Same issues apply: misleading "unfolded protein binding" and lack of mechanistic
      detail.'
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: The curated sources and the review describe a kinase-specific Hsp90
    co-chaperone; the automated text lists only downstream processes.
