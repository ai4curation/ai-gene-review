    label: protein folding
  locations:
  - id: GO:0005737
    label: cytoplasm
  description: Cdc37 binds the Hsp90 protein-folding chaperone system and helps load
    kinase clients into Hsp90-containing maturation complexes. This Hsp90-binding
    adaptor role is an inseparable part of the core kinase co-chaperone mechanism.
  supported_by:
  - reference_id: PMID:17220467
    supporting_text: The interaction of Hsp90, Slt2p, and Hog1p with Cdc37p depends
      on the phosphorylation status of Cdc37p.
proposed_new_terms: []
suggested_questions:
- question: Which yeast kinase clients require Cdc37 primarily for nascent-chain stabilization
    versus later Hsp90-dependent maturation?
- question: Are there yeast stress conditions that shift Cdc37 client specificity
    beyond the kinases already surveyed by abundance and interaction assays?
suggested_experiments:
- experiment_type: quantitative proteomics
  hypothesis: Distinct kinase subclasses show different dependence on Cdc37 for nascent-chain
    stabilization versus post-translational maturation.
  description: Pulse-SILAC or equivalent time-resolved proteomics in phosphosite and
    temperature-sensitive cdc37 mutants, paired with kinase activity assays, to separate
    defects in kinase synthesis, stability, and maturation.
