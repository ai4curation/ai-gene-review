  description: Cdc37 is the kinase-targeting adaptor of the cytosolic Hsp90 chaperone
    system. It binds nascent or unstable protein kinase clients, protects many kinases
    from rapid degradation, and promotes subsequent Hsp90-dependent maturation. This
    client-specific chaperone role explains broad effects on Cdc28/Cak1 cell-cycle
    control, MAPK signaling, and spindle-pole-body duplication without making those
    downstream pathways the core function.
  supported_by:
  - reference_id: PMID:17242065
    supporting_text: Of the 65 kinases assayed, 51 displayed reduced steady-state
      levels by at least twofold in the cdc37S14A mutant strain compared with the
      wild type.
  - reference_id: PMID:17242065
    supporting_text: Cdc37 functions at distinct steps in kinase biogenesis that involves
      protecting nascent chains from rapid degradation followed by its folding function
      in association with Hsp90.
