id: P06101
gene_symbol: CDC37
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: CDC37 encodes an essential cytosolic Hsp90 co-chaperone that specializes
  the Hsp90 system for protein kinase clients. Cdc37 binds protein kinases and Hsp90,
  promotes Hsp90-kinase complex formation, protects nascent kinase chains from rapid
  degradation, and supports post-translational kinase maturation. Its client effects
  explain downstream roles in Cdc28/Cak1-dependent cell-cycle progression, MAP kinase
  signaling, osmotic and cell wall stress responses, and spindle pole body duplication,
  but the core function is kinase-specific chaperone/adaptor activity rather than
  those downstream pathways themselves.
