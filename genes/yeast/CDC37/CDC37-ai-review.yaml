  locations:
  - id: GO:0005737
    label: cytoplasm
  description: Cdc37 has kinase-directed protein-carrier chaperone activity; it protects
    nascent or unstable kinase clients and keeps them competent for subsequent Hsp90-dependent
    maturation. This captures the current GO:0140597 replacement used by SGD for
    the older broad unfolded-protein-binding annotation without treating Cdc37 as
    a generic bulk-folding chaperone.
  supported_by:
  - reference_id: PMID:17242065
    supporting_text: Results from our pulse-labeling studies showed that Cdc37 protects
      nascent kinase chains from rapid degradation shortly after synthesis.
  - reference_id: PMID:40902971
    supporting_text: Cell division cycle 37 (Cdc37) is a kinase-specific cochaperone
      that scaffolds protein kinase clients to the heat shock 90 (Hsp90) chaperone
      system.
- molecular_function:
    id: GO:0031072
    label: heat shock protein binding
  directly_involved_in:
