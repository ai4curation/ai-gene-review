id: P06101
gene_symbol: CDC37
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for yeast CDC37, the kinase-specific Hsp90 co-chaperone. Rank
  1 is the complex the protein is named for, correct and absent from GOA - and the identical term
  is worm hsp-90's rank 2 elsewhere in this cohort, so ProTrek retrieves the same complex independently
  from both of its partners, one of the few internal consistencies visible across the run. The remaining
  four slots are all yeast pheromone-response pathway terms, and they include the unsigned regulation
  term at rank 2, its positive-regulation refinement at rank 3 and its negative regulation at rank
  4: all three signs of the same claim inside one top-five. That is the antonym problem seen in worm
  pink-1, here in a more extreme form. Missing is the core function itself - protein kinase binding,
  the kinase-targeting adaptor activity that the review names first and GOA holds by IEA. As with
  several genes in this cohort, the model retrieves the pathways a protein influences rather than
  the activity by which it influences them. Assessment: 2 correct novel, 1 uncertain. Assessment:
  2 correct novel (COR), 1 uncertain (UNC).
