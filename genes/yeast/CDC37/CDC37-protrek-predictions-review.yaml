        Hsp90 co-chaperone Cdc37
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0062038
    label: positive regulation of pheromone response MAPK cascade
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 17.07) and the most useful of the pheromone-pathway calls: a positive-regulation
      term that refines GOA's positive regulation of MAPK cascade (IMP) onto the specific cascade
      involved. Cdc37 is required for the stability and maturation of the pheromone-pathway kinases,
      so positive regulation is the correct sign. It is credited here on its own merits, with the
      caveat that rank 4 asserts the opposite and scores only 0.19 units lower - the call is right,
      but the method's ordering is not what makes it right.
    supported_by:
