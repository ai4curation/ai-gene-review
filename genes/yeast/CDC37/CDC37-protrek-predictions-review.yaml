  predicted_term:
    id: GO:1990565
    label: HSP90-CDC37 chaperone complex
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 18.49), absent from GOA, which holds only cytoplasm for this protein's
      localization and generic protein binding for its interactions. The HSP90-CDC37 chaperone complex
      is the kinase-specific chaperone module and is exactly what Cdc37 is: the adaptor that loads
      protein kinase clients into Hsp90. Correct, specific and directly usable.
    supported_by:
