  predicted_term:
    id: GO:0010969
    label: regulation of pheromone-dependent signal transduction involved in conjugation with cellular
      fusion
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 2 (score 17.78), absent from GOA. Cdc37 chaperones the pheromone-pathway MAP kinases, so
      an effect on pheromone-dependent signalling is plausible and GOA does hold positive regulation
      of MAPK cascade with IMP support. But this term is unsigned, and ranks 3 and 4 assert the two
      opposite signs of the same relationship, so the retrieval provides no basis for choosing among
      them. Cannot be validated as stated.
    supported_by:
