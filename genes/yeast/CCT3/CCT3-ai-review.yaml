core_functions:
- description: CCT3 is the gamma subunit of the cytosolic TRiC/CCT chaperonin. The
    subunit contributes ATPase and substrate-contact surfaces to the hetero-oligomeric
    double-ring complex, whose ATP-dependent conformational cycle folds actin, tubulin,
    and other cytosolic client proteins. The synthesized function is modeled as subunit
    ATP hydrolysis contributing to the complex-level ATP-dependent protein folding
    chaperone activity.
