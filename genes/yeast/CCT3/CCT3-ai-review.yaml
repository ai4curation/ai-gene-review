id: P39077
gene_symbol: CCT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CCT3 encodes the gamma subunit of the cytosolic group II chaperonin TRiC/CCT.
  As one of eight obligate paralogous subunits in each ring, Cct3 contributes ATPase
  and substrate-contact surfaces to the hetero-oligomeric folding chamber that matures
  actin, tubulin, and other cytosolic clients. Its curated core function is complex-level
  ATP-dependent protein folding, not nonspecific protein binding.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: InterPro2GO mapping methodology. Source of IEA annotations for CCT3
      derived from its InterPro chaperonin (Cpn60/TCP-1) family/domain signatures
      and consistent with the AAA+/group II chaperonin architecture.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT/IBA methodology propagating experimental annotations through
      the PANTHER phylogenetic tree. Current PTHR11353 PAINT supports inherited
      CCT/TRiC protein folding and gamma-subunit CCT-complex membership for CCT3;
      the older GO:0051082 molecular-function IBD no longer appears in the current
      PAINT export.
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings:
  - statement: UniProt keyword-to-GO mapping methodology. Source of IEA ATP-binding/
      chaperone keyword-derived annotations on CCT3, consistent with the Swiss-Prot
      annotation of CCT3 as an ATP-binding T-complex protein.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: UniProt subcellular-location-to-GO mapping methodology. Source of the
      IEA cytoplasm/cytosol localization for CCT3, consistent with the experimentally
      established cytosolic localization of TRiC/CCT.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA machine-learning rule mining methodology. Source of additional
      IEA molecular-function and biological-process annotations on CCT3 derived from
      UniProtKB feature evidence in the chaperonin family.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated annotation pipeline that aggregates multiple electronic
      GO assignment methods. Source of redundant IEA annotations on CCT3 that largely
      recapitulate the experimentally established chaperonin functions.
- id: PMID:15704212
  title: Physiological effects of unassembled chaperonin Cct subunits in the yeast
    Saccharomyces cerevisiae.
  findings:
  - statement: Yeast CCT is a double-ring complex with a stoichiometric set of eight
      distinct Cct subunits.
    supporting_text: Eukaryotic chaperonins, the Cct complexes, are assembled into
      two rings, each of which is composed of a stoichiometric array of eight different
      subunits
- id: PMID:16762366
  title: Quantitative actin folding reactions using yeast CCT purified via an internal
    tag in the CCT3/gamma subunit.
  findings:
  - statement: Purified yeast CCT, tagged through CCT3, catalyzes ATP-dependent actin
      folding; this supports protein-folding and chaperonin activity annotations for
      CCT3 as a TRiC/CCT subunit.
    supporting_text: The eukaryotic cytosolic chaperonin CCT is an essential ATP-dependent
      protein folding machine whose action is required for folding the cytoskeletal
      proteins actin and tubulin
- id: PMID:19536198
  title: 'An atlas of chaperone-protein interactions in Saccharomyces cerevisiae:
    implications to protein folding pathways in the cell.'
  findings:
  - statement: The chaperone interactome study is useful context for CCT contacts
      but reports indirect TAP-tag interactions rather than a specific molecular activity.
    supporting_text: It should be emphasized that the interactions presented are indirect
      TAP-tag based interactions and not direct binary interactions.
- id: PMID:37968396
  title: The social and structural architecture of the yeast protein interactome.
  findings:
  - statement: 'Quantitative AP-MS interactome of yeast: the CCT chaperonin was recovered
      as the full 8-subunit ring by profile-correlation analysis (CCT is non-taggable),
      together with a discrete set of ~21 interactors including tubulin/actin-related
      folding substrates (Tub1, Tub3, Arp1) and two catalytic subunits of PP2A, supporting
      a restricted rather than broad CCT substrate spectrum.'
    supporting_text: For some proteins—for example, the members of the chaperonin
      containing t-complex (CCT)—tagging is not possible because it interferes with
      protein stability or function [...] CCT was nevertheless fully recovered (Fig.
      2d). Besides the 8 conserved, ring-forming members, we also detected a distinct
      set of 21 interacting proteins, about half of which were previously unreported.
      Two of these were catalytic subunits of protein phosphatase 2A, suggesting regulatory
      functions, and others, such as tubulin and actin-related proteins (Tub1, Tub3
      and Arp1) were major known folding substrates.
    reference_section_type: RESULTS
- id: file:yeast/CCT3/CCT3-deep-research-falcon.md
  title: Falcon deep research report for CCT3
  findings:
  - statement: The Falcon report was reviewed and synthesized into the CCT3 curation,
      including core-function framing, family/PANTHER context, and evidence limitations.
- id: PMID:21701561
  title: The crystal structure of yeast CCT reveals intrinsic asymmetry of eukaryotic
    cytosolic chaperonins.
  findings:
  - statement: The 3.8 A crystal structure of yeast CCT-actin resolves the asymmetric
      eight-subunit CCT/TRiC complex and supports Cct3 as a chaperonin-containing
      T-complex subunit.
    supporting_text: We have solved the crystal structure of yeast CCT in complex
      with actin at 3.8 Å resolution, revealing the subunit organisation
