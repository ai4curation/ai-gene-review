    reference_section_type: ABSTRACT
  - reference_id: PMID:15704212
    supporting_text: Eukaryotic chaperonins, the Cct complexes, are assembled into
      two rings, each of which is composed of a stoichiometric array of eight different
      subunits
    reference_section_type: ABSTRACT
suggested_questions:
- question: Which yeast client proteins depend specifically on Cct3 apical-domain
    contacts rather than on generic TRiC/CCT chamber activity?
suggested_experiments:
- hypothesis: Cct3 contributes subunit-specific contacts for a subset of aggregation-prone
    or Q/N-rich clients.
  description: Profile client aggregation, solubility, and folding reporter behavior
    in conditional CCT3 mutants under permissive and restrictive conditions, with
    actin and tubulin reporters as controls.
  experiment_type: conditional mutant proteostasis profiling
