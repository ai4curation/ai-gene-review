- question: >-
    Is Pho91-mediated vacuolar Pi efflux coupled to Na+ (as giant-vacuole
    electrophysiology suggests) or to H+ (as the pH-gradient dependence of Pho91-like
    channels and the UniProt reaction model suggest)?
  experts:
