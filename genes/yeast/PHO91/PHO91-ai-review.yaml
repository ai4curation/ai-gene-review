  - SGD:S000003734
  - UniProtKB:Q13183
  - UniProtKB:Q86YT5
  - UniProtKB:Q8WWT9
  review:
    summary: >-
      This IBA comes from the deep PTHR10283 root node PTN000031793. Its seeds are
      animal SLC13 transporters and yeast Pho87 and Pho90, which are plasma-membrane
      Pi importers. Pho91 itself is not a seed for this term.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Plasma membrane is the ancestral location for the family, but Pho91 has
      diverged to act at the vacuolar membrane. Endogenous untagged Pho91 co-purifies
      with vacuolar markers. Under stringent plasmid-shuffle conditions Pho91 cannot
      support growth as the sole Pi transporter, which argues against meaningful
      activity at the plasma membrane. Rsp5-dependent endocytic turnover suggests
      some Pho91 passes through the plasma membrane or endocytic route, so the term
      is not rejected outright. Still, "is active in plasma membrane" is not
      supported for this paralog. PAINT curators also left Pho91 out of the seeds
      for this node's plasma membrane term while using it for the transporter
      function.
    supported_by:
    - reference_id: PMID:41324358
      supporting_text: In our plasmid shuffling approach, Pho91 did not support growth at all (Figure 4).
    - reference_id: PMID:41324358
      supporting_text: Its co-enrichment with vacuolar proteins suggests that the major fraction of non-tagged Pho91 indeed resides in the vacuole.
    - reference_id: PMID:18165238
      supporting_text: turnover of the low affinity P i transporters is initiated by Rsp5-mediated ubiquitination followed by internalization and degradation by the endocytic pathway
