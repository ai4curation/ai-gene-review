id: P27514
gene_symbol: PHO91
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Pho91 (YNR013C) is an 894-residue polytopic membrane protein of budding yeast that combines an
  N-terminal SPX domain with a C-terminal SLC13/DASS-type (CitMHS) transporter domain of about 13
  transmembrane helices. It is an inorganic phosphate (Pi) transporter of the vacuolar membrane.
  Untagged endogenous Pho91 co-purifies with vacuolar marker proteins. Loss of Pho91 raises
  vacuolar Pi and polyphosphate content, and isolated pho91 deletion vacuoles accumulate Pi faster
  than wild type. Pho91 is needed for inositol pyrophosphate-stimulated Na+/Pi efflux currents in
  giant vacuoles. These data indicate that Pho91 releases Pi from the vacuolar lumen, where it is
  stored as Pi and polyphosphate, into the cytosol. Inositol pyrophosphates bound by its SPX
  domain control this release, so the vacuole can act as a Pi buffer when cytosolic Pi falls.
  Which ion is coupled to Pi transport (Na+ or H+) is not resolved. When overexpressed, Pho91 can
  supply Pi uptake and also transports glycerol-3-phosphate. However, it does not support growth
  as the only Pi transporter under stringent conditions, and its main site of action is the
  vacuole rather than the plasma membrane. Pho91 is turned over by Rsp5-dependent ubiquitination
  and endocytic degradation. Deletion of PHO91, like loss of the other low-affinity carriers Pho87
  and Pho90, deregulates phosphate-repressed PHO genes without lowering internal Pi or
  polyphosphate, through a signalling route that strictly requires the CDK inhibitor Pho81.
