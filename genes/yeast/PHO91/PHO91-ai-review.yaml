- question: >-
    Should GO have a term for phosphate transport from the vacuole to the cytosol,
    the counterpart of GO:1905011, to capture the export direction of Pho91 and its
    plant SPX-MFS homologues?
  experts:
  - GO editors
suggested_experiments:
- experiment_type: reconstitution in proteoliposomes
  description: >-
    Purify Pho91 (wild type and SPX K237A) and reconstitute it in proteoliposomes.
    Measure 32Pi flux under imposed Na+ and H+ gradients, with and without 5-InsP7.
  hypothesis: >-
    Pho91 is an InsPP-inhibited Pi transporter whose direction depends on an ion
    gradient; the SPX K237A mutation releases the inhibition.
