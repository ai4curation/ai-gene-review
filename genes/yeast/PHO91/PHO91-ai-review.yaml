- term:
    id: GO:1990816
    label: vacuole-mitochondrion membrane contact site
  evidence_type: IDA
  original_reference_id: PMID:25026036
  qualifier: located_in
  review:
    summary: >-
      A high-content screen found that the vacuole-mitochondria contact site (vCLAMP)
      is enriched in ion and amino-acid transporters, Pho91 among them. Bru et al.
      note that this localisation used an overexpressed GFP-Pho91 fusion.
    action: KEEP_AS_NON_CORE
    reason: >-
      Pho91 is a vacuolar membrane protein, so presence at a vacuolar contact
      subdomain is plausible, and the curator read the full text. The evidence comes
