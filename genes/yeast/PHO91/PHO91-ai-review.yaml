core_functions:
- description: >-
    Pho91 is a vacuolar-membrane inorganic phosphate transporter that releases Pi
    from the vacuolar lumen (where Pi and polyphosphate are stored) into the
    cytosol. Inositol pyrophosphates bound by its N-terminal SPX domain regulate this
    export, so the vacuole can buffer cytosolic Pi. Transporter activity and
    vacuolar location are experimentally established in S. cerevisiae. The
    export direction is inferred from vacuolar Pi accumulation assays and
    electrophysiology; the coupling ion (Na+ or H+) is unresolved.
  molecular_function:
    id: GO:0005315
    label: phosphate transmembrane transporter activity
  directly_involved_in:
  - id: GO:0035435
    label: phosphate ion transmembrane transport
  locations:
  - id: GO:0000329
    label: fungal-type vacuole membrane
  supported_by:
  - reference_id: PMID:41324358
    supporting_text: Vacuoles lacking Pho91 (pho91Δ) accumulated Pi two times faster than the wildtype and the maximal accumulated concentration was two times higher.
  - reference_id: PMID:30315104
    supporting_text: TbPho91 and Pho91p are responsible for vacuolar Pi and Na+ efflux
  - reference_id: PMID:17804816
