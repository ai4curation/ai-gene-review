- term:
    id: GO:0006797
    label: polyphosphate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000815044
  - SGD:S000000633
  - SGD:S000003734
  - SGD:S000005296
  review:
    summary: >-
      This IBA comes from PTN000815044, seeded by the polyphosphate phenotypes of
      the Pho87, Pho90 and Pho91 mutants reported by Hurlimann et al.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Pho91 neither synthesises nor degrades polyphosphate; the VTC complex and the
      Ppn1/Ppn2 polyphosphatases do that. Pho91 moves Pi out of the vacuole, so
      polyP levels change as a downstream consequence of Pi redistribution. A
      mutant polyP phenotype shows necessity, not participation in the metabolic
      process. The transport process term (GO:0035435) captures what Pho91 does.
    supported_by:
    - reference_id: PMID:41324358
      supporting_text: pho91Δ vtc4Δ double mutants showed an even lower frequency of nuclear Pho4-GFP than wildtype, suggesting that the state of Pi starvation that pho91Δ favours is dependent on vacuolar polyP accumulation.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000815044
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Node seeded by the polyP mutant phenotypes of Pho87, Pho90 and Pho91 (IMP).
          These phenotypes are consequences of Pi transport, not participation in
          polyP synthesis or degradation.
