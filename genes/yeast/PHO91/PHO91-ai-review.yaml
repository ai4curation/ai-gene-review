- term:
    id: GO:2000185
    label: regulation of phosphate transmembrane transport
  evidence_type: IGI
  original_reference_id: PMID:12821119
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000633
  review:
    summary: >-
      The pho87 pho90 pho91 triple mutant derepresses PHO5, PHO84 and PHO89 at an
      intermediate Pi concentration. The authors proposed a role for the low-affinity
      transporters in PHO pathway signalling.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The phenotype is indirect: loss of the transporters changes transcription of
      the PHO regulon, which then changes expression of other transporters. Pho91
      does not regulate another transporter's activity. Hurlimann et al. found that
      the Pho91 polyP phenotype is not a regulatory effect on the PHO pathway. Bru et
      al. explain PHO-pathway activation in pho91 deletion cells as cytosolic Pi
      scarcity, caused by Pi retained in the vacuole, that depends on vacuolar polyP.
      The process Pho91 actually carries out is phosphate transmembrane transport.
    supported_by:
    - reference_id: PMID:17804816
      supporting_text: This phenotype was not caused by a regulatory effect on the PHO pathway
    - reference_id: PMID:41324358
      supporting_text: pho91Δ cells, in which we expect Pi export from the vacuoles to be impaired, showed two times higher frequency of nuclear Pho4-GFP than wildtype.
