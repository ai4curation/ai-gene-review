  review:
    summary: >-
      Hurlimann et al. localised Pho91 to the vacuolar membrane. Bru et al. (2025)
      confirmed this independently of tagging artefacts: endogenous, untagged Pho91
      co-enriches with vacuolar marker proteins in purified vacuoles.
