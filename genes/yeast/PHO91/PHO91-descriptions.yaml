- source: Alliance_Imported
  text: Low-affinity vacuolar phosphate transporter; exports phosphate from vacuolar
    lumen to cytosol; regulates phosphate and polyphosphate metabolism; acts upstream
    of Pho81p in regulation of PHO pathway; localizes to sites of contact between
    vacuole and mitochondria (vCLAMPs); targeted to vacuole via AP-3 pathway; transcription
    independent of Pi and Pho4p activity; overexpression results in vigorous growth
  source_type: curated
