- source: Alliance_Automated
  text: Enables glycerol-3-phosphate transmembrane transporter activity and phosphate
    transmembrane transporter activity. Involved in several processes, including glycerol-3-phosphate
    transmembrane transport; polyphosphate metabolic process; and regulation of phosphate
    transmembrane transport. Located in fungal-type vacuole membrane and vacuole-mitochondrion
    membrane contact site. Human ortholog(s) of this gene implicated in developmental
    and epileptic encephalopathy 25 and hyposulfatemia with skeletal dysplasia. Orthologous
    to several human genes including SLC13A1 (solute carrier family 13 member 1);
    SLC13A2 (solute carrier family 13 member 2); and SLC13A4 (solute carrier family
    13 member 4).
