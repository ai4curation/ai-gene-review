descriptions:
- source: UniProt
  text: Vacuolar phosphate transporter that probably exports phosphate from the vacuolar
    lumen to the cytosol.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P27514
  source_id: P27514
- source: Alliance_Imported
  text: Low-affinity vacuolar phosphate transporter; exports phosphate from vacuolar
    lumen to cytosol; regulates phosphate and polyphosphate metabolism; acts upstream
    of Pho81p in regulation of PHO pathway; localizes to sites of contact between
    vacuole and mitochondria (vCLAMPs); targeted to vacuole via AP-3 pathway; transcription
    independent of Pi and Pho4p activity; overexpression results in vigorous growth
  source_type: curated
  url: https://www.yeastgenome.org/locus/PHO91
  source_id: SGD:S000005296
- source: Alliance_Automated
  text: Enables glycerol-3-phosphate transmembrane transporter activity and phosphate
    transmembrane transporter activity. Involved in several processes, including glycerol-3-phosphate
    transmembrane transport; polyphosphate metabolic process; and regulation of phosphate
    transmembrane transport. Located in fungal-type vacuole membrane and vacuole-mitochondrion
    membrane contact site. Human ortholog(s) of this gene implicated in developmental
    and epileptic encephalopathy 25 and hyposulfatemia with skeletal dysplasia. Orthologous
    to several human genes including SLC13A1 (solute carrier family 13 member 1);
    SLC13A2 (solute carrier family 13 member 2); and SLC13A4 (solute carrier family
    13 member 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PHO91
  source_id: SGD:S000005296
