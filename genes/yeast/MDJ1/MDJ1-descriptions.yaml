- source: Alliance_Automated
  text: Enables ATP-dependent protein folding chaperone and ATPase activator activity.
    Involved in protein folding; protein quality control for misfolded or incompletely
    synthesized proteins; and response to heat. Located in mitochondrial matrix. Part
    of protein folding chaperone complex. Orthologous to human DNAJA3 (DnaJ heat shock
    protein family (Hsp40) member A3).
  source_type: automated
