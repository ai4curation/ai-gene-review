      J-domain cochaperone role.
    supported_by:
    - reference_id: PMID:9973563
      supporting_text: >-
        With these purified components of the mitochondrial Hsp70 chaperone
        system, we have succeeded in reconstituting their chaperone functions in
        the protection of firefly luciferase against thermal damage in vitro.
