id: P35191
gene_symbol: MDJ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  MDJ1 encodes the major mitochondrial matrix DnaJ/Hsp40 cochaperone for the
  mtHsp70 Ssc1 system. Mdj1 stimulates Hsp70-dependent folding/refolding cycles,
  protects mitochondrial matrix proteins from misfolding and heat-induced
  aggregation, and is enriched at mitochondrial nucleoids where it supports
  maintenance of functional mitochondrial DNA.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The cytoplasm IBA is correct but too broad for a mitochondrial matrix
      DnaJ and should be refined to mitochondrial matrix.
    action: MODIFY
    reason: >-
      Mdj1 is imported into mitochondria and acts with Ssc1 in the matrix. The
      PTN002454318 cytoplasm IBD is not wrong because mitochondrion is part_of
      cytoplasm, and the node is seeded by the yeast MDJ1 matrix evidence itself,
      but the existing GO:0005759 mitochondrial matrix annotations state the
      direct compartment more precisely.
    proposed_replacement_terms:
    - id: GO:0005759
      label: mitochondrial matrix
    supported_by:
    - reference_id: PMID:8943361
      supporting_text: >-
        Mdj1p, a DnaJ homolog in the mitochondria of Saccharomyces cerevisiae,
        is involved in the folding of proteins in the mitochondrial matrix.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002454318
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The broad ancestral cytoplasm call is supported and includes MDJ1
          itself among its experimental descendants, but it is less precise than
          mitochondrial matrix for the target.
- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The refolding IBA matches Mdj1's conserved mitochondrial Hsp70 cochaperone role.
    action: ACCEPT
    reason: >-
      The PTN002454318 refolding IBD sits on the current MDJ1 lineage and is
      supported directly by yeast Mdj1 experiments showing impaired folding of
      newly imported proteins and purified Ssc1/Mdj1/Yge1-dependent luciferase
      reactivation.
    supported_by:
    - reference_id: PMID:8168133
      supporting_text: >-
        The efficiency of refolding of a tester protein, dihydrofolate
        reductase, was significantly reduced in mitochondria lacking Mdj1p after
        incubation at elevated temperature.
    - reference_id: PMID:9973563
      supporting_text: >-
        Luciferase denatured at 42 degreesC is actively reactivated by Ssc1p,
        Mdj1p and/or Yge1p after lowering the temperature to 25 degreesC.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002454318
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Current PTHR43096 PAINT retains protein refolding at PTN002454318;
          MDJ1 descends from that node and is itself one of the experimental
          descendants supporting the IBD.
- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Obsolete unfolded protein binding should be replaced with the chaperone activity that Mdj1 performs.
    action: MODIFY
    reason: >-
      Mdj1 executes a DnaJ/Hsp40 protein-folding cochaperone function with
      mitochondrial Hsp70. GO:0051082 is obsolete; GO:0044183 better captures
      this client-folding chaperone activity without asserting a standalone
      ATPase.
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
    supported_by:
    - reference_id: PMID:7957078
      supporting_text: >-
        Mdj1p is shown to regulate the ATP dependent association of an unfolded
        polypeptide chain with mt-hsp70 affecting binding to as well as release
        from mt-hsp70.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002454318
        source_status: SOURCE_STALE_OR_MISSING
        comment: >-
          GOA records the MDJ1 IBA at PTN002454318, but the current PTHR43096
          snapshot retains this node for GO:0042026 protein refolding and no
          longer carries GO:0051082.
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: ATP binding is a domain-transfer overreach for a J-domain cochaperone.
    action: REMOVE
    reason: >-
      Mdj1 is a DnaJ/Hsp40 cochaperone for the ATPase Ssc1. It stimulates the
      Hsp70 cycle but has no Hsp70 nucleotide-binding domain, so the existing
      ATPase activator annotation captures the supported molecular function and
      ATP binding should not be retained as an MDJ1 activity.
    supported_by:
    - reference_id: PMID:9973563
      supporting_text: >-
        The yeast mitochondrial Hsp70, Ssc1p, functions as a molecular
        chaperone with its partner proteins, Mdj1p (DnaJ homologue) and Yge1p
        (GrpE homologue).
