- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Protein folding is supported by Mdj1 loss-of-function experiments.
    action: ACCEPT
    reason: >-
      Loss of Mdj1 impairs folding of newly imported matrix proteins, and later
      biochemical work reconstituted the Ssc1/Mdj1/Yge1p chaperone system in
      vitro.
    supported_by:
    - reference_id: PMID:8168133
      supporting_text: >-
        Import of precursor proteins was not affected by a lack of Mdj1p, but
        folding of newly imported proteins was markedly impaired.
