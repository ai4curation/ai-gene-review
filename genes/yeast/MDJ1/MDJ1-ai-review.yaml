- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16554755
  review:
    summary: Generic protein binding adds no specific functional assertion for Mdj1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This high-throughput complex survey may report a real interaction, but
      GO:0005515 is too generic to represent Mdj1's DnaJ cochaperone activity or
      a specific client-folding function. No more informative molecular-function
      replacement is supported by this evidence alone.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
