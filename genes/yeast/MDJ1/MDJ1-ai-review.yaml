- term:
    id: GO:0009408
    label: response to heat
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Heat-response annotation is consistent with Mdj1 protection against thermal aggregation.
    action: ACCEPT
    reason: >-
      Mdj1 protects mitochondrial proteins from heat-induced aggregation in
      isolated-mitochondrion assays, so retaining a heat-response process
      mapping is biologically sound.
    supported_by:
    - reference_id: PMID:8603724
      supporting_text: >-
        Only the absence of Mdj1p led to enhanced protein aggregation. Thus, a
        central role in the transient protection against heat stress is
        attributed to this mitochondrial DnaJ homologue.
