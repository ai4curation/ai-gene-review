  original_reference_id: PMID:8168133
  review:
    summary: Mdj1 is needed for folding newly imported mitochondrial proteins.
    action: ACCEPT
    reason: >-
      MDJ1 disruption specifically impaired folding of imported precursor
      proteins without blocking their import, supporting a direct role in de
      novo matrix protein folding.
    supported_by:
    - reference_id: PMID:8168133
      supporting_text: >-
        Import of precursor proteins was not affected by a lack of Mdj1p, but
        folding of newly imported proteins was markedly impaired.
- term:
    id: GO:0006515
    label: protein quality control for misfolded or incompletely synthesized proteins
  evidence_type: IMP
  original_reference_id: PMID:7957078
  review:
    summary: Mdj1 keeps mitochondrial misfolded proteins competent for PIM1 degradation.
    action: ACCEPT
    reason: >-
      Mdj1 and mt-Hsp70 maintain misfolded matrix proteins in a soluble state
      that allows PIM1 protease-mediated turnover, so the protein-quality-control
      annotation is directly supported.
    supported_by:
    - reference_id: PMID:7957078
      supporting_text: >-
        ATP dependent proteolytic degradation of misfolded proteins in the
        mitochondrial matrix is mediated by the PIM1 protease and depends on the
        molecular chaperone proteins mt-hsp70 and Mdj1p.
- term:
    id: GO:0009408
    label: response to heat
  evidence_type: IMP
  original_reference_id: PMID:8603724
  review:
    summary: Mdj1 prevents heat-induced aggregation in mitochondria.
    action: ACCEPT
    reason: >-
      Isolated-mitochondrion assays with firefly luciferase showed that loss of
      Mdj1, unlike tested mt-Hsp70 or Mge1 mutations, enhanced aggregation after
      a 40 degrees Celsius temperature shift.
    supported_by:
    - reference_id: PMID:8603724
      supporting_text: >-
        Only the absence of Mdj1p led to enhanced protein aggregation. Thus, a
        central role in the transient protection against heat stress is
        attributed to this mitochondrial DnaJ homologue.
- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IMP
  original_reference_id: PMID:8168133
  review:
    summary: Mdj1 protects heat-denatured proteins for mitochondrial refolding.
    action: ACCEPT
    reason: >-
      Mitochondria lacking Mdj1 had reduced refolding of dihydrofolate reductase
      after elevated-temperature incubation, supporting this process annotation.
    supported_by:
    - reference_id: PMID:8168133
      supporting_text: >-
        The efficiency of refolding of a tester protein, dihydrofolate
        reductase, was significantly reduced in mitochondria lacking Mdj1p after
        incubation at elevated temperature.
- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IDA
  original_reference_id: PMID:9973563
  review:
    summary: Purified Mdj1 participates in Hsp70-dependent luciferase refolding in vitro.
    action: ACCEPT
    reason: >-
      Purified mature Mdj1, Ssc1 and Yge1 reconstitute protection and active
      reactivation of heat-denatured luciferase, directly supporting the
      protein-refolding annotation.
    supported_by:
    - reference_id: PMID:9973563
      supporting_text: >-
        Luciferase denatured at 42 degreesC is actively reactivated by Ssc1p,
        Mdj1p and/or Yge1p after lowering the temperature to 25 degreesC.
- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IMP
  original_reference_id: PMID:8943361
  review:
    summary: Obsolete unfolded protein binding should be replaced with protein folding chaperone.
    action: MODIFY
    reason: >-
      GO:0051082 is obsolete. The Mdj1 mutant data support a client-binding
      Hsp40 cochaperone that protects newly synthesized and newly imported
      matrix proteins, so GO:0044183 is the closest current molecular-function
      term.
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
    supported_by:
    - reference_id: PMID:8943361
      supporting_text: >-
        Mdj1p and mt-Hsp70 were found in a complex with nascent polypeptide
        chains on mitochondrial ribosomes.
