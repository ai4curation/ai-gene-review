    summary: Mitochondrial matrix is the established compartment of Mdj1 action.
    action: ACCEPT
    reason: >-
      Although the cached Zim17 abstract does not describe its Mdj1 assay,
      independent Mdj1 publications establish matrix-localized folding and
      refolding, so the SGD IDA annotation is consistent with the gene's core
