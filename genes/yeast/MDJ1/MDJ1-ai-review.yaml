- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:9973563
  review:
    summary: Mdj1 activates the Ssc1 mitochondrial Hsp70 chaperone system.
    action: ACCEPT
    reason: >-
      Purified mature Ssc1p, Mdj1p and Yge1p reconstitute mitochondrial Hsp70
      chaperone-mediated protection and refolding of heat-denatured luciferase;
