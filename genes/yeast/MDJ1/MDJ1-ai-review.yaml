  review:
    summary: Generic protein binding adds no specific functional assertion for Mdj1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The chaperone-interaction atlas supports many TAP-tag based associations,
      including candidate chaperone substrates, but GO:0005515 does not say what
      Mdj1 does and should not be retained for this generic physical-interaction
      evidence.
    supported_by:
    - reference_id: PMID:19536198
      supporting_text: >-
