descriptions:
- source: UniProt
  text: Allantoin metabolism-specific malate synthase involved in the recycling the
    glyoxylate generated during allantoin degradation by the ureidoglycollate (UG)
    hydrolase reaction.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P21826
  source_id: P21826
- source: Alliance_Imported
  text: Malate synthase; can accept butyryl-CoA as acyl-CoA donor in addition to traditional
    substrate acetyl-CoA; recycles glyoxylate generated during allantoin degradation;
    SWAT-GFP and mCherry fusion proteins localize to the cytosol; expression sensitive
    to nitrogen catabolite repression and induced by allophanate, an intermediate
    in allantoin degradation
  source_type: curated
  url: https://www.yeastgenome.org/locus/DAL7
  source_id: SGD:S000001470
- source: Alliance_Automated
  text: Enables malate synthase activity. Involved in allantoin catabolic process.
    Located in peroxisomal matrix.
  source_type: automated
  url: https://www.yeastgenome.org/locus/DAL7
  source_id: SGD:S000001470
