taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: DAL7 (MLS2) encodes the second malate synthase of Saccharomyces cerevisiae, which condenses
  glyoxylate with acetyl-CoA to form (S)-malate. Unlike the glucose-repressed glyoxylate-cycle isozyme
  Mls1p, DAL7 is insensitive to carbon catabolite repression but subject to nitrogen catabolite repression
  and is induced by allophanate/oxalurate as part of the DAL regulon; its physiological role is to recycle
  the glyoxylate released by ureidoglycolate hydrolysis during allantoin degradation, allowing allantoin
  to be used as a nitrogen source. Dal7p carries a PTS1 signal and, under oleate induction, is imported
  into the peroxisomal matrix by the Pex9p receptor; it is cytosolic in glucose-grown cells. In vitro,
  yeast malate synthase activity can also use butyryl-CoA.
