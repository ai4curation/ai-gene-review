  label: Saccharomyces cerevisiae S288C
description: 'TPS3 (YMR261C) encodes a ~115-kDa regulatory subunit of the cytosolic trehalose synthase
  complex and is a paralog (whole-genome duplication ohnolog) of TSL1. Like Tsl1, Tps3 has an N-terminal
  extension followed by glycosyltransferase family 20 (GT-20) and TPP-like domains homologous to the catalytic
  subunits Tps1 (trehalose-6-phosphate synthase) and Tps2 (trehalose-6-phosphate phosphatase), but no
  catalytic activity has been demonstrated for it. Tps3 binds Tps1 and Tps2 and forms homo- and hetero-oligomers
  with Tsl1. It is a fourth subunit of the complex with functions partially redundant to Tsl1: deletion
  of TPS3, particularly in a tsl1 background, destabilises the complex and lowers TPS and TPP activities
  and trehalose content. TPS3 is glucose-repressed and is more abundant than TSL1 in exponentially growing
  cells.'
