suggested_questions:
- question: Does Tps3 confer the same phosphate and fructose 6-phosphate sensitivity on Tps1 that the
    Tsl1 N-terminus does, or does it regulate the complex differently?
- question: What is the functional consequence, if any, of Tps3 homo-oligomerisation versus Tps3-Tsl1
    hetero-oligomers?
suggested_experiments:
- description: Reconstitute Tps1-Tps2 complexes with purified Tps3 versus Tsl1 and compare Tps1 kinetics
    and complex stability to define paralog-specific regulatory properties.
  experiment_type: biochemistry
