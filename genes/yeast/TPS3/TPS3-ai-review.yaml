    summary: InterPro2GO from IPR001830 (GT-20 domain) to generic catalytic activity. Tps3 is a regulatory
      paralog of Tsl1; the complex's catalytic activities reside in Tps1 and Tps2, and even overproduced
      Tps3 cannot replace Tps1. Transferring 'catalytic activity' from domain homology over-states what
      is known for this protein.
