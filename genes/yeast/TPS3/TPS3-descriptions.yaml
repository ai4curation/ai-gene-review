gene_symbol: TPS3
organism: yeast
uniprot_id: P38426
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Regulatory subunit of the trehalose synthase complex that catalyzes the production
    of trehalose from glucose-6-phosphate and UDP- glucose in a two step process.
    May stabilize the trehalose synthase complex.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38426
  source_id: P38426
- source: Alliance_Imported
  text: Regulatory subunit of trehalose-6-phosphate synthase/phosphatase; involved
    in synthesis of storage carbohydrate trehalose; expression is induced by stress
    conditions and repressed by the Ras-cAMP pathway; TPS3 has a paralog, TSL1, that
    arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TPS3
  source_id: SGD:S000004874
- source: Alliance_Automated
  text: Enables enzyme regulator activity and identical protein binding activity.
    Contributes to alpha,alpha-trehalose-phosphate synthase (UDP-forming) activity
    and trehalose-phosphatase activity. Involved in trehalose biosynthetic process.
    Located in cytoplasm. Part of alpha,alpha-trehalose-phosphate synthase complex
    (UDP-forming).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TPS3
  source_id: SGD:S000004874
