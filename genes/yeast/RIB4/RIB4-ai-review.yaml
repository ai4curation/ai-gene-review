  label: Saccharomyces cerevisiae S288C
description: RIB4 (YOL143C) encodes 6,7-dimethyl-8-ribityllumazine synthase (lumazine synthase, EC 2.5.1.78),
  which condenses 5-amino-6-(D-ribitylamino)uracil with 3,4-dihydroxy-2-butanone 4-phosphate to form 6,7-dimethyl-8-ribityllumazine,
  the penultimate intermediate of riboflavin biosynthesis that riboflavin synthase (Rib5) dismutates to
  riboflavin. Yeast lumazine synthase is a homopentamer (crystal structure at 1.85 A with a phosphonate
  intermediate analogue) rather than the icosahedral capsid that encloses riboflavin synthase in Bacillus.
  RIB4 disruption causes riboflavin auxotrophy. Rib4 is cytoplasmic and nuclear by GFP and has also been
  identified as a soluble mitochondrial intermembrane-space protein.
