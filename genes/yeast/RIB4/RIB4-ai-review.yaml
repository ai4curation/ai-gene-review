    label: riboflavin synthase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  supporting_entities:
  - InterPro:IPR002180
  - InterPro:IPR036467
  review:
    summary: InterPro2GO from the lumazine/riboflavin synthase superfamily (IPR002180, IPR036467) maps
      to 'riboflavin synthase complex', the Bacillus heavy riboflavin synthase in which an icosahedral
      60-mer lumazine-synthase capsid encloses a riboflavin synthase trimer. Yeast Rib4 is a free pentamer
      and Rib5 a separately purified trimer; no Rib4-Rib5 complex has been reported. The superfamily-level
      mapping does not apply to yeast.
    action: REMOVE
    reason: Bacterial capsid complex inferred from domain superfamily; yeast enzymes are separate pentamer/trimer.
    supported_by:
    - reference_id: PMID:7559556
      supporting_text: the enzyme forms a pentamer of identical 16.8-kDa subunits
    - reference_id: PMID:7814407
      supporting_text: the enzyme forms a trimer of identical 25-kDa subunits
