- term:
    id: GO:0036172
    label: thiamine salvage
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000341466
  - PomBase:SPAC6F12.05c
  review:
    summary: IBA (PTN000341466, S. pombe donor). GO 'thiamine salvage' is a thiamine biosynthetic process
      generating thiamine from its derivatives. TPK converts thiamine (imported or de novo) to TPP and
      does not regenerate thiamine, so the term misdescribes its role; TPP formation from salvaged thiamine
      is captured by thiamine diphosphate biosynthetic process.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - *id002
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PomBase:SPAC6F12.05c
        source_label: S. pombe thiamine pyrophosphokinase Tnr3
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The family node is correct (Thi80 is a bona fide TPK); the issue is that the salvage
          term describes regenerating thiamine, whereas TPK uses thiamine as substrate. The same scoping
          issue applies to the donor annotation.
