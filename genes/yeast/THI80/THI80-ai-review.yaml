suggested_questions:
- question: How is mitochondrial TPP supplied in yeast given that Thi80 is cytosolic (import via the Tpc1
    carrier only, or any mitochondrial TPK activity)?
suggested_experiments:
- description: Use conditional THI80 depletion with organelle-specific TPP measurements to determine whether
    all mitochondrial TPP derives from cytosolic Thi80 activity.
