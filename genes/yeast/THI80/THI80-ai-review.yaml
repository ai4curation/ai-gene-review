  label: Saccharomyces cerevisiae S288C
description: 'THI80 (YOR143C) encodes thiamine pyrophosphokinase (TPK, EC 2.7.6.2) of Saccharomyces cerevisiae,
  a homodimeric cytosolic enzyme that transfers a pyrophosphate group from ATP to thiamine, producing
  thiamine diphosphate (TPP), the active cofactor of pyruvate decarboxylase, transketolase, 2-oxoacid
  dehydrogenases and other enzymes. In yeast de novo-synthesised thiamine monophosphate is first dephosphorylated
  to thiamine, so Thi80 is the final step for both de novo and imported thiamine. THI80 is essential:
  it is the only enzyme able to make TPP. Its expression depends on Thi2/Thi3, is controlled by intracellular
  TPP, and is only partially repressed by exogenous thiamine.'
