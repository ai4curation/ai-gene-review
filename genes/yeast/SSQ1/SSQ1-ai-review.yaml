- id: PMID:26545917
  title: 'Iron-Sulfur Cluster Biogenesis Chaperones: Evidence for Emergence of Mutational Robustness of a Highly Specific Protein-Protein Interaction.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract verified. Jac1 HPD-mutant tolerance and biochemical activity differ between S.cerevisiae and S.pombe, supporting evolved partner specificity. This is not a negative generic refolding assay.
core_functions:
- description: Hydrolyzes ATP in a Jac1/Isu-stimulated chaperone cycle that stabilizes scaffold engagement and promotes transfer of nascent Fe-S clusters to Grx5. Mge1-mediated nucleotide exchange resets the cycle. Ssq1 performs the transfer/remodeling work within Fe-S biogenesis; the initial synthesis chemistry is carried out by other ISC components.
