id: Q05931
gene_symbol: SSQ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ssq1 is a specialized mitochondrial matrix Hsp70 ATPase in budding yeast.
  It couples its nucleotide cycle to engagement of the Isu1/Isu2 iron-sulfur cluster
  scaffold and promotes transfer of newly assembled clusters to the carrier Grx5.
  The J-protein Jac1 recruits the scaffold and stimulates Ssq1 ATP hydrolysis, while
  Mge1 promotes nucleotide exchange. This machinery supports maturation of mitochondrial
  and extramitochondrial Fe-S proteins. Ssq1 arose through duplication of the mitochondrial
  Hsp70 gene and differs from the abundant, multifunctional Ssc1 in client and cochaperone
  specificity. Loss of SSQ1 causes conditional growth defects, impaired Fe-S protein
  maturation and mitochondrial iron accumulation; Ssc1 can partially compensate when
  its expression is increased. Ssq1 also binds unfolded proteins and suppresses aggregation
  in vitro. Its contribution to Yfh1 precursor maturation is experimentally observed,
  although the molecular mechanism and its contribution to the broader mutant phenotypes
  remain unresolved.
