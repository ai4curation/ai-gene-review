references:
- id: file:yeast/SSQ1/SSQ1-deep-research-falcon.md
  title: 'Falcon (Edison) deep research report: SSQ1 (Q05931), mitochondrial Hsp70
    chaperone for Fe-S cluster biogenesis'
  findings:
  - statement: 'Ssq1 is a specialized, ATP-dependent mitochondrial Hsp70 chaperone
      that

      drives the Fe-S cluster transfer step: it promotes release of a newly

      assembled [2Fe-2S] cluster from the Isu1/Isu2 scaffold and hands it off to

      the carrier Grx5, rather than synthesizing the cluster itself.'
    supporting_text: '**Ssq1 is an ATP-dependent Hsp70 chaperone/ATPase that drives
      the ISC “transfer step”**: it promotes **release of a newly assembled Fe–S cluster
      from the Isu scaffold** and facilitates **handoff** to downstream factors (notably
      Grx5), enabling maturation of mitochondrial Fe–S proteins and supporting downstream
      cytosolic/nuclear Fe–S biogenesis'
    reference_section_type: OTHER
  - statement: 'Substrate specificity is achieved by recognition of the conserved
      LPPVK

      peptide motif of the Isu1 scaffold at the Hsp70 substrate-binding site;

      Grx5 binds a distinct site and does not stimulate ATPase, allowing

      simultaneous Isu1+Grx5 occupancy for cluster handoff.'
    supporting_text: '**Grx5 binds Ssq1 at a distinct site** (not displaced by excess
      LPPVK peptide) and **does not stimulate Ssq1 ATPase**, enabling simultaneous
      Isu1+Grx5 association on Ssq1 for handoff'
    reference_section_type: OTHER
  - statement: 'The chaperone cycle is driven by the J-protein Jac1 (recruits Isu1
      and

      synergistically stimulates Ssq1 ATPase) and reset by the nucleotide

      exchange factor Mge1.'
    supporting_text: The **J-domain cochaperone Jac1** recruits the Fe–S-loaded scaffold
      and stimulates Ssq1 ATP hydrolysis; Jac1 and Isu1 act **synergistically** to
      stimulate Ssq1 ATPase activity
    reference_section_type: OTHER
  - statement: 'Ssq1 and Jac1 localize to the mitochondrial matrix; ssq1 loss causes

      ~10-fold mitochondrial iron accumulation and reduced activity of Fe-S

      enzymes (aconitase, succinate dehydrogenase, cytochrome bc1).'
    supporting_text: '**Decreased activities** of Fe–S enzymes/proteins including
      **aconitase**, **cytochrome bc1 complex**, and **succinate dehydrogenase** in
      ssq1/jac1 mutants'
    reference_section_type: OTHER
  - statement: 'Ssq1 is a low-abundance, highly specialized Hsp70 distinct from the

      general mtHsp70 Ssc1; it is ~500-1000-fold less abundant than Ssc1 and has

      a narrowly defined native client (the Isu scaffold).'
    supporting_text: Ssq1 represents a rare example of a **highly specialized Hsp70
      system with a narrowly defined native client (the ISC scaffold Isu)**, supporting
      the view that Ssq1’s primary function is to catalyze a specific Fe–S transfer
      step rather than general mitochondrial proteostasis
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Report and evidence table read in full and checked against primary
      sources. Core ISC-transfer synthesis is supported. Quantitative claim of full
      rescue requiring 1000-2000-fold Ssc1 overexpression is misleading: PMID:10779357
      measured twofold Ssc1 increase, approximately 2000-fold relative to baseline
      Ssq1, with only partial rescue. Narrow native specificity does not negate the
      observed in-vitro rhodanese antiaggregation or Cia1 binding. Proposed 1:1:1
      stoichiometry is not independently measured in the report.'
- id: file:yeast/SSQ1/SSQ1-hypotheses/folding-refolding-and-secondary-client-interactions/openscientist.md
  title: OpenScientist focused report on SSQ1 folding, refolding, and secondary client
    interactions
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The focused report found support for Ssq1 holdase and unfolded-substrate
      binding, but not productive refolding or reactivation.
    supporting_text: no published assay demonstrates productive refolding or reactivation
    reference_section_type: RESULTS
  - statement: The focused report recommended retaining GO:0044183 as a broad ancestral
      folding-chaperone inference while caveating GO:0042026 protein refolding as
      non-core for Ssq1.
    supporting_text: 'GO:0044183 protein folding chaperone | MF | IBA (PTHR19375)
      | Retain as ancestral inference | Legitimate IBA; less precise than direct
      data'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Focused report read in full. The retained GO:0044183 and downgraded
      GO:0042026 conclusions were checked against PMID:11601843, PMID:23615440, the
      cached PANTHER PTHR19375 rows and Ssq1 partner-specificity literature. The
      report's generic GO:0140309 recommendation was narrowed to the proposed
      iron-sulfur cluster transfer chaperone activity NTR in this review.
