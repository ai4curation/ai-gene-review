core_functions:
- description: Hydrolyzes ATP in a Jac1/Isu-stimulated chaperone cycle that stabilizes
    scaffold engagement and promotes transfer of nascent Fe-S clusters to Grx5. Mge1-mediated
    nucleotide exchange resets the cycle. Ssq1 performs the transfer/remodeling work
    within Fe-S biogenesis; the initial synthesis chemistry is carried out by other
    ISC components.
  proposed_molecular_function: iron-sulfur cluster transfer chaperone activity
  directly_involved_in:
  - id: GO:0016226
    label: iron-sulfur cluster assembly
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - *id002
  - *id005
proposed_new_terms:
- proposed_name: iron-sulfur cluster transfer chaperone activity
  proposed_definition: Binding and ATP-dependent remodeling of an iron-sulfur cluster
    scaffold protein to promote transfer of a nascent iron-sulfur cluster from the
    scaffold to an acceptor protein.
  justification: Ssq1 binds client/scaffold proteins in an ATP-regulated Hsp70 cycle,
    is stimulated by Jac1 and Isu1, and promotes transfer of nascent Fe-S clusters
    from Isu1 to Grx5. The live ATP hydrolysis term is too generic for this direct
    chaperone role, while GO:0140662 would overstate Ssq1 as an ATP-dependent protein
    foldase and GO:0140309 would misdescribe the carried substrate as an unfolded
    protein delivered to a defined acceptor.
  supported_by:
  - *id002
  - *id004
  - *id005
suggested_questions:
- question: Which Ssq1 assays demonstrate restoration of a client protein folding
    state or activity, and which establish only antiaggregation or ATP-driven Isu
    remodeling? Can GO:0044183, GO:0042026, GO:0140662 or GO:0140309 be distinguished
    without treating native client specialization as a universal functional loss?
- question: Does the Nop1-bait/Ssq1 association in PMID:19536198 TableS2 persist in
    intact cells or compartment-preserving assays, and is it independent of the earlier
    PMID:16554755 dataset? Which physiological interaction, if any, explains it without
    inferring nuclear Ssq1 residence from lysate copurification?
