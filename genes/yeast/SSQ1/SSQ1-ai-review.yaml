suggested_questions:
- question: Which Ssq1 assays demonstrate restoration of a client protein folding state or activity, and which establish only antiaggregation or ATP-driven Isu remodeling? Can GO:0044183, GO:0042026, GO:0140662 or GO:0140309 be distinguished without treating native client specialization as a universal functional loss?
- question: Does the Nop1-bait/Ssq1 association in PMID:19536198 TableS2 persist in intact cells or compartment-preserving assays, and is it independent of the earlier PMID:16554755 dataset? Which physiological interaction, if any, explains it without inferring nuclear Ssq1 residence from lysate copurification?
