id: Q05931
gene_symbol: SSQ1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  SSQ1 encodes a specialized mitochondrial Hsp70-type chaperone dedicated to
  iron-sulfur (Fe/S) cluster biogenesis. Ssq1p mediates the ATP-dependent
  transfer of newly assembled Fe/S clusters from the scaffold proteins
  Isu1/Isu2 to the downstream carrier Grx5, working together with its
  J-protein co-chaperone Jac1 and the nucleotide exchange factor Mge1. This
  transfer step is essential for maturation of all cellular Fe/S proteins,
  both mitochondrial and cytosolic. Ssq1p is also involved in maturation of
  the frataxin homolog Yfh1, which itself participates in Fe/S cluster
  assembly as an iron donor. Unlike the general-purpose mitochondrial Hsp70
  Ssc1, Ssq1p has evolved a highly specific interaction with the conserved
  LPPVK motif of Isu1/Isu2, reflecting its dedicated role in Fe/S cluster
  transfer rather than general protein folding.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The cytoplasm IBA is a family-level localization transfer that conflicts
      with Ssq1's mitochondrial targeting and experimentally supported matrix location.
    action: REMOVE
    reason: Ssq1 is imported into the mitochondrial matrix, where it performs Fe-S
      cluster transfer. No Ssq1-specific evidence supports cytoplasmic activity; this
      broad IBA reflects localization diversity elsewhere in the Hsp70 family.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002321897
        source_label: broad Hsp70 family localization node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Cytoplasmic Hsp70 family members support the source node, but the
          mitochondrial targeting and matrix localization of Ssq1 make this transfer unsafe.
