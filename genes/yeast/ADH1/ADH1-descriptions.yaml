gene_symbol: ADH1
organism: yeast
uniprot_id: P00330
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Preferentially fermentative isozyme that reduces acetaldehyde to ethanol during
    the fermentation of glucose. Major enzyme required for the conversion of acetaldehyde
    to ethanol (Probable) (PubMed:22094012). Plays a key role in the carbohydrate
    metabolism through the regeneration of NAD(+) from glycolytic NADH (Probable).
    In the reverse reaction, preferentially catalyzes the conversion of primary unbranched
    alcohols to their corresponding aldehydes. Also shows activity toward secondary
    alcohols (Probable). Most active with ethanol, and its activity decreases as the
    size of the alcohol is increased (PubMed:8463307).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00330
  source_id: P00330
- source: Alliance_Imported
  text: Alcohol dehydrogenase; fermentative isozyme active as homo- or heterotetramers;
    required for the reduction of acetaldehyde to ethanol, the last step in the glycolytic
    pathway; ADH1 has a paralog, ADH5, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADH1
  source_id: SGD:S000005446
- source: Alliance_Automated
  text: Enables several functions, including alcohol dehydrogenase (NAD+) activity;
    melatonin binding activity; and methylglyoxal reductase (NADH) activity. Involved
    in L-leucine catabolic process and pyruvate fermentation to ethanol. Located in
    cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADH1
  source_id: SGD:S000005446
