id: P00330
gene_symbol: ADH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADH1 encodes alcohol dehydrogenase I, the major constitutively/glucose-expressed cytosolic
  medium-chain zinc alcohol dehydrogenase (MDR family) of S. cerevisiae. It is a homotetramer binding
  two Zn2+ per subunit and catalyses the NADH-dependent reduction of acetaldehyde to ethanol, the terminal
  step of alcoholic fermentation that regenerates NAD+ for glycolysis; it is the only isozyme that efficiently
  performs this step in vivo. The enzyme also oxidises ethanol and other short primary and secondary alcohols
  (activity decreasing with chain length), reduces fusel aldehydes of the Ehrlich pathway to fusel alcohols
  (redundantly with ADH2-5 and SFA1), and shows side activities on allyl alcohol and methylglyoxal.
