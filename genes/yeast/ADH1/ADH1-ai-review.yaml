  review:
    summary: Membrane yeast two-hybrid (MYTH) interactome screen of ABC transporters (baits P34230 PXA2
      and P39109 YCF1) recovered ADH1 as a prey. ADH1 is among the most abundant cytosolic proteins and
      a frequent high-throughput hit; no functional consequence was shown, and "protein binding" is uninformative.
