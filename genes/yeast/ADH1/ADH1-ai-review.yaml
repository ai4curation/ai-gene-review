    reason: Uninformative "protein binding" from a high-throughput screen with no functional follow-up
      and no supportable more specific MF; removal does not assert the interaction is false.
    supported_by:
    - reference_id: PMID:23831759
      supporting_text: Mapping the functional yeast ABC transporter interactome.
