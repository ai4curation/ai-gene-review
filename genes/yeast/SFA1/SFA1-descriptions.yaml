    overall_notes: Correct on the bifunctional ADH and glutathione-dependent formaldehyde
      dehydrogenase. Omits GSNO reductase; Hog1-Sko1 regulation and the replication-stress
      abundance rise are not covered in the review.
- source: Alliance_Automated
  text: Enables oxidoreductase activity, acting on the CH-OH group of donors, NAD
    or NADP as acceptor. Involved in L-leucine catabolic process; formaldehyde catabolic
    process; and furaldehyde metabolic process. Located in mitochondrion. Human ortholog(s)
    of this gene implicated in AMED syndrome; alcohol dependence; asthma; late onset
    Parkinson's disease; and pancreatic cancer. Orthologous to several human genes
    including ADH1B (alcohol dehydrogenase 1B (class I), beta polypeptide) and ADH5
    (alcohol dehydrogenase 5 (class III), chi polypeptide).
  source_type: automated
