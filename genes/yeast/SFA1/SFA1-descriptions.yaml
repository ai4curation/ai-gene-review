gene_symbol: SFA1
organism: yeast
uniprot_id: P32771
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Oxidizes long-chain alcohols and, in the presence of glutathione, is able
    to oxidize formaldehyde (PubMed:8483449). Is responsible for yeast resistance
    to formaldehyde (PubMed:7649298). Also acts as a S-nitroso-glutathione reductase
    by catalyzing the NADH- dependent reduction of S-nitrosoglutathione, thereby regulating
    protein S-nitrosylation (PubMed:11260719).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32771
  source_id: P32771
- source: Alliance_Imported
  text: Bifunctional alcohol dehydrogenase and formaldehyde dehydrogenase; formaldehyde
    dehydrogenase activity is glutathione-dependent; functions in formaldehyde detoxification
    and formation of long chain and complex alcohols, regulated by Hog1p-Sko1p; protein
    abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/SFA1
  source_id: SGD:S000002327
- source: Alliance_Automated
  text: Enables oxidoreductase activity, acting on the CH-OH group of donors, NAD
    or NADP as acceptor. Involved in L-leucine catabolic process; formaldehyde catabolic
    process; and furaldehyde metabolic process. Located in mitochondrion. Human ortholog(s)
    of this gene implicated in AMED syndrome; alcohol dependence; asthma; late onset
    Parkinson's disease; and pancreatic cancer. Orthologous to several human genes
    including ADH1B (alcohol dehydrogenase 1B (class I), beta polypeptide) and ADH5
    (alcohol dehydrogenase 5 (class III), chi polypeptide).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SFA1
  source_id: SGD:S000002327
