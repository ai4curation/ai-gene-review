    overall_notes: 'Correct and cited: long-chain alcohol oxidation, glutathione-dependent
      formaldehyde oxidation and resistance, GSNO reductase. Does not name S-(hydroxymethyl)glutathione
      as the substrate.'
- source: Alliance_Imported
  text: Bifunctional alcohol dehydrogenase and formaldehyde dehydrogenase; formaldehyde
    dehydrogenase activity is glutathione-dependent; functions in formaldehyde detoxification
    and formation of long chain and complex alcohols, regulated by Hog1p-Sko1p; protein
    abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/SFA1
