suggested_questions:
- question: How much does Sfa1p contribute to fusel alcohol formation in wild-type cells, where Adh1p
    dominates aldehyde reduction?
- question: Does Sfa1p have a genuine mitochondrial pool, or is its detection in mitochondrial proteomes
    contamination from the abundant cytosolic enzyme?
suggested_experiments:
- description: Measure isoamyl alcohol and 2-phenylethanol production in adh1-5 aad strains with and without
    SFA1, under conditions that induce SFA1 (formaldehyde, ethanol), to estimate its in vivo Ehrlich-pathway
    flux.
- description: Assay purified Sfa1p with 5-hydroxymethylfurfural and NADH to resolve whether it is a physiologically
    relevant HMF reductase.
