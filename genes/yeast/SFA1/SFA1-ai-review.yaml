id: P32771
gene_symbol: SFA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SFA1 (YDL168W) encodes the S. cerevisiae class III alcohol dehydrogenase, also called glutathione-dependent
  formaldehyde dehydrogenase or S-(hydroxymethyl)glutathione dehydrogenase (EC 1.1.1.284). It is a cytosolic
  medium-chain zinc ADH that binds two Zn2+ per subunit. Its principal activity is the NAD(P)+-dependent
  oxidation of S-(hydroxymethyl)glutathione, the spontaneous adduct of formaldehyde and glutathione, to
  S-formylglutathione, the first step of glutathione-dependent formaldehyde detoxification. sfa1 mutants
  are formaldehyde-sensitive and SFA1 overexpression confers hyper-resistance; SFA1 is induced by formaldehyde,
  ethanol and methyl methanesulfonate. Like other class III ADHs it is also an NADH-dependent S-nitrosoglutathione
  (GSNO) reductase. Loss of SFA1 raises GSNO and protein S-nitrosothiol levels and causes nitrosative-stress
  sensitivity. Independently of glutathione, Sfa1p oxidises long-chain primary alcohols and, in the reductive
  direction, can reduce Ehrlich-pathway fusel aldehydes to fusel alcohols. Here it is one of six redundant
  enzymes, together with Adh1-5p.
