- id: file:yeast/SAS3/SAS3-deep-research-falcon.md
  title: Deep research report on SAS3 (Saccharomyces cerevisiae, UniProt P34218) synthesizing
    yeast-specific literature on NuA3 catalytic HAT function, substrate specificity,
    complex architecture, chromatin targeting, and the 2024 Taf14-Sas3/Yng1 interface
    advance.
  findings:
  - statement: SAS3 is a MYST-family histone acetyltransferase and the catalytic subunit
      of the NuA3 complex, which primarily acetylates histone H3 lysine 14 (H3K14)
      and is also associated with H3K23 acetylation in yeast chromatin.
    reference_section_type: OTHER
    supporting_text: '*S. cerevisiae* **Sas3** is a **MYST-family histone acetyltransferase
      (HAT)** and the **catalytic subunit of the NuA3 complex**, which primarily acetylates
      **histone H3 lysine 14 (H3K14)** and is also associated with **H3K23 acetylation**
      in yeast chromatin.'
  - statement: Sas3 catalyzes acetyl-CoA-dependent lysine acetylation of histone H3,
      transferring an acetyl group from acetyl-CoA to the epsilon-amino group of a
      lysine residue, with H3K14 the best-supported primary physiological target.
    reference_section_type: OTHER
    supporting_text: A HAT transfers an acetyl group from **acetyl-CoA** to the ε-amino
      group of a **lysine** residue on histones (a post-translational modification
      linked to chromatin accessibility and transcription).
  - statement: Loss of SAS3 abolishes NuA3 HAT activity and disrupts complex integrity,
      establishing Sas3 as required for both activity and integrity of the NuA3 complex.
    reference_section_type: OTHER
    supporting_text: Early purification identified Sas3 by peptide sequencing in a
      ~0.4–0.5 MDa NuA3 complex; loss of **SAS3** abolishes NuA3 HAT activity and
      disrupts complex integrity.
  - statement: NuA3 combines a writer (Sas3) with multiple reader domains - Yng1 PHD
      binds H3K4me3, Pdp3 PWWP binds H3K36me3, and Taf14 YEATS binds acyl-lysine marks
      - enabling chromatin-context-sensitive recruitment.
    reference_section_type: OTHER
    supporting_text: 'Reader modules: **Yng1 PHD** binds **H3K4me3**; **Pdp3 PWWP**
      binds **H3K36me3**; **Taf14 YEATS** binds acylated histone marks including **H3K9ac/crotonylation**;
      Taf14 ET binds EBMs in Yng1 and Sas3.'
  - statement: Sas3 mediates NuA3 interaction with the FACT subunit Spt16 through
      an acidic C-terminal region, connecting NuA3 to transcription elongation through
      nucleosomes; SAS3 disruption enhances 6-azauracil sensitivity in an Spt16-mutant
      background.
    reference_section_type: OTHER
    supporting_text: Sas3 mediates NuA3 interaction with **Spt16** (in vivo and in
      vitro), through an acidic C-terminal region; genetic interaction includes enhanced
      **6-azauracil (6-AU)** sensitivity when SAS3 is disrupted in an spt16-truncation
      background.
  - statement: Sas3/NuA3 functions in the nucleus on chromatin, associating with transcribed
