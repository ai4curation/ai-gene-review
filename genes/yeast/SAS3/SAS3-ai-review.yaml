  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: 'Correct paper (Osada et al. 2001, PMC312835), but it does not support
      the two SGD IMP annotations that cite it for SAS3 (GO:0030466, GO:0031509).
      Full text read at PMC312835 (the local cache is abstract-only): Table 1 lists
      sas2, sas4, sas5, sir1 and asf1 alleles and the SAS2 M1-M3 acetyl-CoA-motif
      point mutants, but no sas3 allele, and no SAS3 mutant phenotype is reported.
      The IMP most likely belongs to SAS2/SAS4/SAS5. To be reported to SGD.'
- id: PMID:8782818
  title: Yeast SAS silencing genes and human genes associated with AML and HIV-1 Tat
    interactions are homologous with acetyltransferases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (Reifsnyder et al. 1996, Nat Genet 14:42-49); the
      SAS3 naming paper and the UniProt source for SAS3 involvement in HMR silencing.
      The abstract reports SAS2 and SAS3 as enhancers of sir1 silencing defects. Only
      the abstract is cached, so the specific sas3 alleles and silencing assays were
      not read. PubMed and UniProt list a published erratum, PMID:9140406 (Nat Genet
      16:109, 1997). It was checked but its content could not be read: the PubMed
      record has no abstract or erratum text, and its DOI (10.1038/ng0597-106) returns
      404. Whether it bears on the SAS3 silencing data is therefore unknown.'
- id: PMID:16581777
  title: Methylation of histone H3 mediates the association of the NuA3 histone acetyltransferase
    with chromatin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Martin et al. 2006, Mol Cell Biol 26:3018-28);
      second UniProt source for SAS3 involvement in HMR silencing. The local cache
      is abstract-only; the full text was read at PMC1446952. Fig. 4B and text show
      that deleting NuA3 components, including sas3, rescues the silencing defect
      of HMR-E silencer mutants, i.e. SAS3 opposes silencing at a weakened HMR. No
      SAS3 telomeric phenotype is reported. Supports SAS3/NuA3 as an H3K14 acetyltransferase
      recruited by H3K4/H3K36 methylation in vivo; does not support GO:0030466 or
      GO:0031509.
