- term:
    id: GO:0030466
    label: silent mating-type cassette heterochromatin formation
  evidence_type: IMP
  original_reference_id: PMID:11731479
  review:
    summary: This silencing annotation rests on a misattributed reference. PMID:11731479
      (Osada et al. 2001) is about the SAS-I silencing complex (Sas2p, Sas4p, Sas5p)
      and Sas2p-mediated silencing at HML and telomeres; SAS3 (Ybf2/Sas3) appears
      only in the MYST-family acronym, as background, and as the sequence template
      for the SAS2 acetyl-CoA-motif mutants. The paper provides no SAS3-specific silencing
      evidence. The process term itself is defensible for SAS3 on other evidence (PMID:8782818),
      so the row is kept and demoted rather than removed; the reference problem goes
      to SGD.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:11731479
      supporting_text: The something about silencing (Sas) 2 protein of Saccharomyces
        cerevisiae, a member of the MYST (MOZ, Ybf2/Sas3, Sas2, and TIP60) acetyltransferase
        family, promotes silencing at HML and telomeres. Here we identify a ~450-kD
        SAS complex containing Sas2p, Sas4p, and the tf2f-related Sas5 protein.
    - reference_id: PMID:8782818
      supporting_text: We have identified the Saccharomyces cerevisiae genes SAS2
        and SAS3 through a screen for enhancers of sir1 epigenetic silencing defects.
    reason: Kept as non-core rather than removed, because the term is defensible for
      SAS3 but the cited reference is wrong (same handling as the misattributed IDA
      in genes/human/AHI1). The IMP annotation is misattributed. PMID:11731479 characterizes
      the SAS-I silencing complex (Sas2/Sas4/Sas5) and demonstrates that Sas2p (not
      Sas3p) mediates silencing at HML and telomeres; SAS3 appears only in the MYST
      acronym. SAS3 was independently identified in a screen for enhancers of sir1
      silencing defects (PMID:8782818, Reifsnyder et al. 1996), and UniProt attributes
      HMR silencing involvement to that paper and to PMID:16581777, so the proposed
      upstream fix is to re-reference the annotation to PMID:8782818 rather than retract
      it (see suggested_questions). PMID:16581777 (Martin et al. 2006) is not a re-reference
      target for this positive process term. Its full text (PMC1446952; the local
      cache is abstract-only) shows the opposite direction at HMR, where deletion
      of NuA3 components, including sas3, rescues the silencing defect of HMR-E silencer
      mutants (Fig. 4B), which the authors attribute to reduced acetylation spreading
      into the silent locus. The SAS3 silencing evidence is therefore mixed, and non-core
      is the right status, since the characterised SAS3 activity is euchromatic H3K14
      acetylation. Verified against the full text (PMC312835; the local cache is abstract-only)
      - the yeast strain table (Table 1) contains sas2, sas4, sas5, sir1 and asf1
      alleles but no sas3 allele, and Sas3p is mentioned only as background and as
      the template for the SAS2 M1-M3 acetyl-CoA-motif point mutants. No SAS3 mutant
      phenotype is reported, so this is not an abstract-only judgment; the reference
      most likely belongs to the SAS2/SAS4/SAS5 annotations and should be reported
      to SGD.
  qualifier: involved_in
- term:
    id: GO:0031507
    label: heterochromatin formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: This general process term is entailed by the more specific GO:0030466
      (silent mating-type cassette heterochromatin formation), which this review keeps
      as non-core.
    action: KEEP_AS_NON_CORE
    reason: GO:0030466 is a descendant of this term and is kept as non-core on the
      basis of the sir1-enhancer screen (PMID:8782818), so by the true-path rule this
      parent is also true for SAS3. It carries the same non-core status and adds no
      information beyond the retained child. The SAS3 silencing evidence is mixed
      (PMID:16581777 shows sas3 deletion rescuing HMR-E silencer mutants), and the
      characterised SAS3 activity is euchromatic H3K14 acetylation, so heterochromatin
      formation is not a core function.
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00033536
- term:
    id: GO:0031509
    label: subtelomeric heterochromatin formation
  evidence_type: IMP
  original_reference_id: PMID:11731479
  review:
    summary: This silencing annotation rests on a misattributed reference. PMID:11731479
      (Osada et al. 2001) shows that Sas2p, via the SAS-I complex (Sas2p, Sas4p, Sas5p),
      promotes silencing at telomeres; the conserved acetyl-CoA binding motif mutated
      to demonstrate this is in Sas2p, not Sas3p. SAS3 (Ybf2/Sas3) appears only in
      the MYST-family acronym, as background, and as the sequence template for the
      SAS2 acetyl-CoA-motif mutants. The paper provides no SAS3-specific telomeric/subtelomeric
      silencing evidence.
    action: REMOVE
    supported_by:
    - reference_id: PMID:11731479
      supporting_text: Mutations in the conserved acetyl-CoA binding motif of Sas2p
        are shown to disrupt the ability of Sas2p to mediate the silencing at HML
        and telomeres, providing evidence for an important role for the acetyltransferase
        activity of the SAS complex in silencing.
    reason: Removed because the IMP annotation is misattributed. PMID:11731479 demonstrates
      telomeric silencing is mediated by Sas2p (acetyl-CoA-motif mutations in Sas2p,
      the SAS-I complex), not by Sas3p; SAS3 appears only in the MYST acronym. SAS3/NuA3
      acts mainly as a euchromatic H3K14 acetyltransferase in the 5' half of coding
      regions. The sources checked here give no SAS3 telomeric-silencing phenotype
      to re-reference this row to. The abstract of PMID:8782818 reports SAS3 as an
      enhancer of sir1 silencing defects, a mating-type rather than telomeric assay,
      and the full text of PMID:16581777 (PMC1446952), the other UniProt source for
      SAS3 silencing, reports only an HMR phenotype (sas3 deletion rescuing HMR-E
      silencer mutants) and mentions telomeric silencing only for SET1. Verified against
      the full text (PMC312835; the local cache is abstract-only) - the yeast strain
      table (Table 1) contains sas2, sas4, sas5, sir1 and asf1 alleles but no sas3
      allele, and Sas3p is mentioned only as background and as the template for the
      SAS2 M1-M3 acetyl-CoA-motif point mutants. No SAS3 mutant phenotype is reported,
      so this is not an abstract-only judgment; the IMP most likely belongs to SAS2/SAS4/SAS5
      and should be reported to SGD.
  qualifier: involved_in
