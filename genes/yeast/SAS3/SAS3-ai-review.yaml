    supporting_text: Sas3 is the catalytic subunit of NuA3
  - reference_id: PMID:41318527
    supporting_text: The NuA3 histone acetyltransferase complex in budding yeast,
      composed of six subunits, specifically acetylates lysine 14 on histone H3 (H3K14)
  - reference_id: file:yeast/SAS3/SAS3-deep-research-falcon.md
    reference_section_type: OTHER
    supporting_text: '*S. cerevisiae* **Sas3** is a **MYST-family histone acetyltransferase
      (HAT)** and the **catalytic subunit of the NuA3 complex**, which primarily acetylates
      **histone H3 lysine 14 (H3K14)** and is also associated with **H3K23 acetylation**
      in yeast chromatin.'
proposed_new_terms:
- proposed_name: histone H3K14 acetyltransferase activity
  proposed_definition: Catalysis of acetylation of histone H3 at lysine 14.
  justification: Critical substrate-specific function documented in literature.
suggested_questions:
- question: Does SAS3 have in vivo role in H4 acetylation?
- question: What is relative contribution of SAS3 to total H3K14ac?
- question: What distinguishes NuA3a vs NuA3b targeting?
- question: Does SAS3 interact with HDAC complexes?
- question: Should SGD re-reference the SAS3 GO:0030466 (silent mating-type cassette
    heterochromatin formation) IMP from PMID:11731479 to PMID:8782818, the sir1-enhancer
    screen that identified SAS3, rather than retract it?
- question: Should the SAS3 GO:0031509 (subtelomeric heterochromatin formation) IMP
    from PMID:11731479 be withdrawn, since no SAS3 telomeric phenotype is reported
    there or in the other sources checked (PMID:8782818, PMID:16581777)?
- question: Should UniProt revise the SAS3 function comment that cites PMID:16581777
    for involvement in HMR silencing, given that the paper reports the opposite direction
    (sas3 deletion rescues HMR-E silencer mutants, Fig. 4B)?
suggested_experiments:
- description: Substrate specificity assays with histone variants
- description: Genome-wide ChIP-seq for SAS3 and H3K14ac
- description: Activity analysis in cells lacking GCN5
- description: Test interactions with HDAC complexes
