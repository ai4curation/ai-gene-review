descriptions:
- source: UniProt
  text: Kinase involved in a signal transduction pathway that is activated by changes
    in the osmolarity of the extracellular environment (PubMed:10970855, PubMed:15256499,
    PubMed:7681220). Activates the MAP kinase HOG1 by concomitant phosphorylation
    at 'Thr-174' and 'Tyr-176' (PubMed:38270553, PubMed:7681220).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08018
  source_id: P08018
- source: Alliance_Imported
  text: MAP kinase kinase of the HOG signaling pathway; activated under severe osmotic
    stress; regulates late-stage macroautophagy after autophagosome closure and mitophagy;
    plays a role in regulating Ty1 transposition
  source_type: curated
  url: https://www.yeastgenome.org/locus/PBS2
  source_id: SGD:S000003664
- source: Alliance_Automated
  text: Enables MAP kinase scaffold activity; protein kinase activity; and protein-N-terminal
    amino-acid acetyltransferase activity. Involved in several processes, including
    cellular response to osmotic stress; p38MAPK cascade; and protein import into
    nucleus. Acts upstream of or within positive regulation of macroautophagy. Located
    in cellular bud neck and cellular bud tip. Part of NatB complex. Is active in
    cytoplasm. Human ortholog(s) of this gene implicated in several diseases, including
    carcinoma (multiple); cardiofaciocutaneous syndrome 3; cardiofaciocutaneous syndrome
    4; high grade glioma; and melorheostosis. Orthologous to several human genes including
    MAP2K1 (mitogen-activated protein kinase kinase 1); MAP2K2 (mitogen-activated
    protein kinase kinase 2); and MAP2K5 (mitogen-activated protein kinase kinase
    5).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PBS2
  source_id: SGD:S000003664
