id: P08018
gene_symbol: PBS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Pbs2 is the sole MAP kinase kinase (MAP2K) of the high-osmolarity glycerol (HOG) pathway
  of Saccharomyces cerevisiae. It has a long N-terminal non-catalytic region carrying docking and proline-rich
  motifs and a C-terminal STE-family protein kinase domain. Pbs2 is the convergence point of two osmosensing
  branches: it is phosphorylated and activated by the MAPKKKs Ssk2 and Ssk22 downstream of the Sln1-Ypd1-Ssk1
  phosphorelay, or by Ste11 in the Sho1 branch, where its N-terminal proline-rich motif binds the SH3
  domain of the membrane osmosensor Sho1. Activated Pbs2 dually phosphorylates the p38-type MAPK Hog1
  on Thr174 and Tyr176. Pbs2 also acts as a scaffold that binds Sho1, Ste11 and Hog1, directing Ste11
  output to Hog1 and insulating the HOG cascade from the mating and filamentation MAPK pathways; a separate
  proline-rich motif binds the SH3 domain of Nbp2, which recruits the PP2C phosphatase Ptc1 to the Pbs2-Hog1
  module. Pbs2 is cytoplasmic and excluded from the nucleus, and is transiently recruited to Sho1 at bud
  tips and necks during osmostress. Loss of Pbs2 causes osmosensitivity; it has also been implicated in
  late-stage macroautophagy independently of Hog1.'
