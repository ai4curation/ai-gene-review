core_functions:
- description: 'MAP kinase kinase of the HOG osmostress pathway: activated by Ssk2/Ssk22 (Sln1 branch)
    or Ste11 (Sho1 branch), Pbs2 dually phosphorylates Hog1 on Thr174/Tyr176 in the cytoplasm, relaying
    osmosensory signals to the p38-type MAPK.'
  molecular_function:
    id: GO:0004708
    label: MAP kinase kinase activity
  directly_involved_in:
  - id: GO:0038066
    label: p38MAPK cascade
  - id: GO:0007231
    label: osmosensory signaling pathway
  - id: GO:0071474
    label: cellular hyperosmotic response
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id003
  - *id004
  - *id020
  - *id015
- description: 'Scaffold of the Sho1 branch: Pbs2 binds the Sho1 SH3 domain through its N-terminal proline-rich
    motif and also binds Ste11 and Hog1, acting with Sho1 as a co-scaffold that directs Ste11 to Pbs2
    and insulates HOG signaling from other Ste11-dependent MAPK pathways.'
  molecular_function:
    id: GO:0005078
    label: MAP kinase scaffold activity
  directly_involved_in:
  - id: GO:0007232
    label: osmosensory signaling pathway via Sho1 osmosensor
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id007
  - *id006
  - *id025
  - *id014
  - *id010
suggested_questions:
- question: The UniProt-assigned rows placing Pbs2 in NatB (GO:0031416), with N-terminal acetyltransferase
    activity (GO:0004596) and binding Mdm20 from PMID:12783868 look like a NAT3 (Q06504) accession mix-up;
    can UniProt/GOA confirm and retract them?
- question: Should Pbs2 carry GO:0007234 osmosensory signaling via phosphorelay pathway for its role downstream
    of Ssk2/Ssk22 in the Sln1 branch, symmetrically with the Sho1-branch annotation (GO:0007232), or is
    that term intended only for phosphorelay components?
- question: Does the Hog1-independent role of Pbs2 in late-stage macroautophagy require Pbs2 kinase activity,
    and what is its substrate?
suggested_experiments:
- description: Test kinase-dead (K389M) and docking-motif mutants of Pbs2 in the GFP-Atg8 cleavage and
    Pho8delta60 assays to determine whether the Hog1-independent macroautophagy role needs catalytic or
    scaffold function, and identify Pbs2 substrates by phosphoproteomics in hog1-delta cells.
