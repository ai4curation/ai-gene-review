    and then to phosphatidylcholine, the last two steps of the PE methylation route to PC.
  molecular_function:
    id: GO:0000773
    label: phosphatidyl-N-methylethanolamine N-methyltransferase activity
  directly_involved_in:
  - id: GO:0006656
    label: phosphatidylcholine biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:2445736
    supporting_text: the membrane fraction from the transformants carrying PEM2 catalyzed the synthesis of phosphatidylcholine
      (PC) from PE, indicating that it contains all of the three methylation activities
  - reference_id: PMID:2684666
    supporting_text: When the PEM2 locus was disrupted, the activities for the second and third methylations were
      totally lost, but that for the first methylation remained.
  - reference_id: PMID:2198947
    supporting_text: phospholipid methyltransferase (PLMT) catalyzes the second two methylation reactions
  - reference_id: PMID:6337128
    supporting_text: When grown in the absence of exogenous choline, the opi3-3 mutant had a phospholipid composition
      consisting of 2 to 3% phosphatidylcholine compared with 40 to 50% in wild-type strains.
