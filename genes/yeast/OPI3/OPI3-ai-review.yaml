id: P05375
gene_symbol: OPI3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Opi3 (Pem2, YJR073C) is the phospholipid N-methyltransferase (PLMT) of Saccharomyces cerevisiae, a
  small polytopic membrane protein of the PEMT family that uses S-adenosyl-L-methionine to methylate phosphatidyl-N-monomethylethanolamine
  to phosphatidyl-N,N-dimethylethanolamine and then to phosphatidylcholine (EC 2.1.1.71), the second and third steps
  of the CDP-diacylglycerol (PE methylation) route to PC; the first methylation of PE is performed mainly by Cho2/Pem1,
  although Opi3 can also catalyse it at a low rate. Opi3 is an ER membrane protein, has been detected in mitochondrial
  and cell-periphery fractions, and opi3 mutants accumulate methylated PE intermediates, overproduce and excrete
  inositol, and depend on exogenous choline (Kennedy pathway) to maintain normal PC levels.
