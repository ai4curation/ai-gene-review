gene_symbol: OPI3
organism: yeast
uniprot_id: P05375
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the second two steps of the methylation pathway of phosphatidylcholine
    biosynthesis, the SAM-dependent methylation of phosphatidylmonomethylethanolamine
    (PMME) to phosphatidyldimethylethanolamine (PDME) and of PDME to phosphatidylcholine
    (PC). Can also catalyze the first methylation reaction of PE to PMME in the absence
    of PE methyltransferase CHO2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P05375
  source_id: P05375
- source: Alliance_Imported
  text: Methylene-fatty-acyl-phospholipid synthase; catalyzes the last two steps in
    phosphatidylcholine biosynthesis; also known as phospholipid methyltransferase
  source_type: curated
  url: https://www.yeastgenome.org/locus/OPI3
  source_id: SGD:S000003834
- source: Alliance_Automated
  text: Enables phosphatidyl-N-methylethanolamine N-methyltransferase activity and
    phosphatidylethanolamine N-methyltransferase activity. Involved in phosphatidylcholine
    biosynthetic process. Located in endoplasmic reticulum membrane and mitochondrial
    membrane. Orthologous to human PEMT (phosphatidylethanolamine N-methyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/OPI3
  source_id: SGD:S000003834
