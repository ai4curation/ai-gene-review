descriptions:
- source: UniProt
  text: Catalyzes the irreversible transamination of the L-tryptophan metabolite L-kynurenine
    to form kynurenic acid (KA).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47039
  source_id: P47039
- source: Alliance_Imported
  text: Kynurenine aminotransferase; catalyzes formation of kynurenic acid from kynurenine;
    potential Cdc28p substrate
  source_type: curated
  url: https://www.yeastgenome.org/locus/BNA3
  source_id: SGD:S000003596
- source: Alliance_Automated
  text: Enables L-2-aminoadipate:2-oxoglutarate transaminase activity and L-kynurenine:2-oxoglutarate
    transaminase activity. Involved in kynurenic acid biosynthetic process. Located
    in mitochondrion. Orthologous to several human genes including KYAT1 (kynurenine
    aminotransferase 1).
