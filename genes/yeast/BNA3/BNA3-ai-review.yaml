gene_symbol: BNA3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Bna3 (YJL060W) is a class-I pyridoxal 5'-phosphate-dependent aminotransferase of Saccharomyces cerevisiae
  that acts as the yeast kynurenine aminotransferase (KAT; EC 2.6.1.7), transaminating L-kynurenine with 2-oxoglutarate
  to form kynurenic acid. This side branch diverts kynurenine away from the quinolinate/NAD+ route. Although originally
  named for a presumed role in nicotinic acid biosynthesis as the N-formylkynurenine formamidase, crystallographic
  and biochemical work showed that the formamidase is Bna7 and that Bna3 is the KAT. Bna3 is a homodimer and is
  dual-localized to the cytosol and mitochondria. It has also been reported to have 2-aminoadipate transaminase
  activity.
