descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of D-fructose 6-phosphate to fructose 1,6-bisphosphate
    by ATP, the first committing step of glycolysis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P16861
  source_id: P16861
- source: Alliance_Imported
  text: Alpha subunit of heterooctameric phosphofructokinase; involved in glycolysis,
    indispensable for anaerobic growth, activated by fructose-2,6-bisphosphate and
    AMP, mutation inhibits glucose induction of cell cycle-related genes; binds short
    mRNA sequence repeats and associates with ribosomes
  source_type: curated
  url: https://www.yeastgenome.org/locus/PFK1
  source_id: SGD:S000003472
- source: Alliance_Automated
  text: Enables mRNA binding activity and ribosome binding activity. Contributes to
    6-phosphofructokinase activity and proton-transporting ATPase activity, rotational
    mechanism. Involved in several processes, including fructose 6-phosphate metabolic
    process; glycolytic process; and regulation of intracellular pH. Located in mitochondrion.
    Part of 6-phosphofructokinase complex. Used to study glycogen storage disease.
    Human ortholog(s) of this gene implicated in glycogen storage disease VII. Orthologous
    to human PFKL (phosphofructokinase, liver type); PFKM (phosphofructokinase, muscle);
    and PFKP (phosphofructokinase, platelet).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PFK1
  source_id: SGD:S000003472
