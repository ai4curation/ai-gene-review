  text: Alpha subunit of heterooctameric phosphofructokinase; involved in glycolysis,
    indispensable for anaerobic growth, activated by fructose-2,6-bisphosphate and
    AMP, mutation inhibits glucose induction of cell cycle-related genes; binds short
    mRNA sequence repeats and associates with ribosomes
