    reason: The IBD is grounded in Cak1's own IMP evidence (PMID:8752210, PMID:8752211); the target appearing
      in its own WITH/FROM is expected and marks experimental grounding on the target itself. Activating
      T-loop phosphorylation of the mitotic CDK is a step of the G2/M transition as GO defines it (the
      transition begins when M-cyclin/CDK activity reaches threshold), and the CAK step is the budding-yeast
      variant in the G2/M module (modules/g2_m_transition.yaml). Core function.
