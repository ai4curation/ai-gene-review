- term:
    id: GO:1902749
    label: regulation of cell cycle G2/M phase transition
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008391902
  - UniProtKB:Q15131
  review:
    summary: 'PAINT node PTN008391902 (seeded by human CDK10, UniProtKB:Q15131) propagates regulation
      of the cell cycle G2/M phase transition. GO defines this term as a signalling process that modulates
      a cell-cycle CDK to modulate the G2-to-M switch, which is literally what Cak1 does: it phosphorylates
      Cdc28 Thr169, and cak1-ts cells show a G2 delay with low Cdc28 activity.'
    action: ACCEPT
    reason: 'Consistent with Cak1''s own IMP evidence (PMID:8752210). Two caveats for the record: Cak1
      activity is constant through the cell cycle (PMID:8781234), so it is a constitutive priming step
      rather than a timed switch, and the more direct term GO:0000086 is already carried; the regulation
      term is acceptable but adds little.'
    supported_by:
    - reference_id: PMID:8752210
      supporting_text: A temperature-sensitive mutation in CAK1 confers a G2 delay accompanied by low
        Cdc28p protein kinase activity and shows genetic interactions with altered expression of the gene
        for the major mitotic cyclin, CLB2.
      reference_section_type: ABSTRACT
    - reference_id: PMID:8781234
      supporting_text: Cak1 accounted for most CAK activity in yeast cell lysates, and its activity was
        constant throughout the cell cycle. The CAK1 gene was essential for cell viability.
      reference_section_type: ABSTRACT
