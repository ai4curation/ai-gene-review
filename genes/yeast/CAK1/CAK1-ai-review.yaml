- term:
    id: GO:0051321
    label: meiotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:11739722
  qualifier: involved_in
  review:
    summary: Schaber et al. showed, using a CAK1-independent hyperactive CDC28 allele (CDC28-43244) to
      bypass the mitotic requirement, that cak1-null diploids are blocked early in meiosis (delayed premeiotic
      DNA synthesis, poor induction of IME1 and early/middle sporulation genes, few cells completing MI/MII)
      and that Cak1 catalytic activity is required to activate the Smk1 MAP kinase for spore wall assembly;
      both roles are Cdc28-independent and Cak1 does not phosphorylate Smk1 or Ime2 directly in vitro.
    action: KEEP_AS_NON_CORE
    reason: Real, catalytically dependent function in meiotic development (the kinase-dead cak1-D169R
      allele phenocopies the null), so the annotation is sound and Cak1 is doing work by phosphorylating
      (unidentified) kinase targets. It is, however, a developmental extension of the CDK-activating kinase
      rather than its core function, and the direct meiotic substrate is unknown; the post-meiotic spore-wall
      (Smk1) role is arguably better captured by ascospore formation (GO:0030437), which is left for the
      curator to consider rather than proposed as NEW.
    supported_by:
    - reference_id: PMID:11739722
      supporting_text: We also found that mutants lacking CAK1 are blocked early in meiotic development,
        as they show substantial delays in premeiotic DNA synthesis and defects in the expression of sporulation-specific
        genes, including IME1.
      reference_section_type: ABSTRACT
    - reference_id: PMID:11739722
      supporting_text: Here we show that Smk1p, like other MAP kinases, is phosphorylated in its activation
        loop and that Smk1p is not activated in a cak1 missense mutant.
      reference_section_type: ABSTRACT
    - reference_id: PMID:11739722
      supporting_text: These results indicate that the catalytic activity of Cak1p is required for its
        functions in meiosis and spore formation.
      reference_section_type: RESULTS
- term:
    id: GO:0060633
    label: negative regulation of transcription initiation by RNA polymerase II
  evidence_type: IGI
  original_reference_id: PMID:19269370
  qualifier: involved_in
  supporting_entities:
  - SGD:S000003704
  review:
    summary: Fiedler et al. (signalling E-MAP) found positive genetic interactions between CAK1 and SET2
      (SGD:S000003704) and EAF3 that were confirmed by tetrad analysis, and showed that cak1-DAmP and
      cak1-ts alleles derepress cryptic transcription initiation from an internal TATA in FLO8, placing
      Cak1 (via its substrate Ctk1) in the Set2/Rpd3C(S) pathway that suppresses spurious initiation.
    action: KEEP_AS_NON_CORE
    reason: 'The phenotype is real and mechanistically explained: Cak1 activates Ctk1 (Thr338) and Bur1
      (Thr240) by T-loop phosphorylation, and Ctk1-dependent CTD Ser2 phosphorylation recruits Set2 to
      methylate H3K36, which in turn recruits Rpd3C(S) via Eaf3 to deacetylate coding-region chromatin
      and suppress cryptic intragenic initiation. Cak1 therefore does the work of activating the upstream
      kinase of this pathway, which justifies a regulation-of-transcription-initiation term. It is a downstream
      consequence of CDK activation rather than a core function, and the evidence (positive genetic interaction
      plus a FLO8 cryptic-initiation reporter in cak1 hypomorphs) is genetic.'
    supported_by:
    - reference_id: PMID:19269370
      supporting_text: The positive genetic interactions of CAK1 with SET2 and EAF3 were confirmed by
        tetrad analysis and spot testing, which showed that eaf3Δ and set2Δ suppressed the slow growth
        phenotype observed in a cak1-DAmP background (Figure 6b).
      reference_section_type: RESULTS
    - reference_id: PMID:19269370
      supporting_text: Finally, the cak1-DAmP strain, as well as other previously characterized CAK1 mutants
