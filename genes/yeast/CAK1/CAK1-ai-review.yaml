- term:
    id: GO:0060633
    label: negative regulation of transcription initiation by RNA polymerase II
  evidence_type: IGI
  original_reference_id: PMID:19269370
  qualifier: involved_in
  supporting_entities:
  - SGD:S000006227
  review:
    summary: Same E-MAP study; the partner here is EAF3 (SGD:S000006227), the Rpd3C(S) subunit that reads
      Set2-deposited H3K36 methylation. eaf3 deletion suppressed the slow growth of cak1-DAmP cells, and
      cak1 mutants show the same FLO8 cryptic-initiation defect as set2 and ctk1 mutants.
    action: KEEP_AS_NON_CORE
    reason: 'The phenotype is real and mechanistically explained: Cak1 activates Ctk1 (Thr338) and Bur1
      (Thr240) by T-loop phosphorylation, and Ctk1-dependent CTD Ser2 phosphorylation recruits Set2 to
      methylate H3K36, which in turn recruits Rpd3C(S) via Eaf3 to deacetylate coding-region chromatin
      and suppress cryptic intragenic initiation. Cak1 therefore does the work of activating the upstream
      kinase of this pathway, which justifies a regulation-of-transcription-initiation term. It is a downstream
      consequence of CDK activation rather than a core function, and the evidence (positive genetic interaction
      plus a FLO8 cryptic-initiation reporter in cak1 hypomorphs) is genetic.'
    supported_by:
    - reference_id: PMID:19269370
      supporting_text: The positive genetic interactions of CAK1 with SET2 and EAF3 were confirmed by
        tetrad analysis and spot testing, which showed that eaf3Δ and set2Δ suppressed the slow growth
        phenotype observed in a cak1-DAmP background (Figure 6b).
      reference_section_type: RESULTS
    - reference_id: PMID:19269370
      supporting_text: Finally, the cak1-DAmP strain, as well as other previously characterized CAK1 mutants
        (cak1-22, cak1-23, cak1-95) (Espinoza et al., 1998), showed a significant increase of transcription
        initiation from a cryptic internal TATA site within FLO8 (Figure 6c).
      reference_section_type: RESULTS
    - reference_id: PMID:19269370
      supporting_text: Overall these data demonstrate that Cak1 acts as a key regulator controlling two
        kinases cascades involved in regulating intergenic chromatin integrity (Figure 6d).
      reference_section_type: RESULTS
- term:
    id: GO:0097472
    label: cyclin-dependent protein kinase activity
  evidence_type: IDA
  original_reference_id: PMID:10373527
  qualifier: enables
  review:
    summary: 'Kimmelman et al. showed that Cak1 phosphorylates Kin28 (the TFIIH kinase, itself a CDK)
      on Thr162 in vitro, that Kin28 Thr162 phosphorylation is lost in vivo when Cak1 is inactivated,
      and that this phosphorylation stimulates Kin28 CTD kinase activity: Kin28 joins Cdc28 as a physiological
      Cak1 substrate. (Direct biochemical evidence row.)'
    action: MODIFY
    reason: 'GO:0097472 is defined as cyclin-dependent catalysis of protein phosphorylation, i.e. the
      activity of a CDK holoenzyme. Cak1 is the opposite case: a monomeric kinase that is active without
      a cyclin, has full activity when expressed in E. coli, is not a TFIIH subunit, and whose function
      is to activate CDKs by T-loop phosphorylation. SGD evidently used this term as the nearest available
      home for CDK-activating kinase activity (the dedicated term GO:0019912 was obsoleted in 2025 with
      GO:0097472 and GO:0004672 listed only as terms to consider). The evidence is sound but the term
      asserts cyclin dependence that the same papers rule out, so the row should be recorded as protein
      serine/threonine kinase activity (GO:0004674), with the CAK role captured at the process level by
      GO:0045737 positive regulation of cyclin-dependent protein serine/threonine kinase activity.'
    proposed_replacement_terms:
    - id: GO:0004674
      label: protein serine/threonine kinase activity
    supported_by:
    - reference_id: PMID:10373527
      supporting_text: Finally, we show that Kin28p is no longer phosphorylated on Thr-162 following inactivation
        of Cak1p in vivo, that Cak1p can phosphorylate Kin28p on Thr-162 in vitro, and that this phosphorylation
        stimulates the CTD kinase activity of Kin28p.
      reference_section_type: ABSTRACT
    - reference_id: PMID:10373527
      supporting_text: Thus, Kin28p joins Cdc28p, the major cell cycle Cdk in budding yeast, as a physiological
        Cak1p substrate.
      reference_section_type: ABSTRACT
