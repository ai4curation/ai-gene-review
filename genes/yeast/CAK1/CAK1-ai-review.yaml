  title: A cyclin-dependent kinase-activating kinase (CAK) in budding yeast unrelated to vertebrate CAK.
  findings:
  - statement: Cak1 accounts for most yeast CAK activity, is constant through the cell cycle, and is essential.
    supporting_text: Cak1 accounted for most CAK activity in yeast cell lysates, and its activity was
      constant throughout the cell cycle. The CAK1 gene was essential for cell viability.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent purification of Cak1 (Espinoza et al.; Science 1996); establishes cell-cycle-constant
      activity and essentiality. Abstract-only cache.
- id: PMID:9819350
  title: Localization and regulation of the cdk-activating kinase (Cak1p) from budding yeast.
  findings:
  - statement: Cak1 is dispersed throughout the cell with most protein in the cytoplasm.
    supporting_text: We have found that Cak1p is dispersed throughout the cell as shown by immunofluorescence;
      biochemical subcellular fractionation confirmed that most of the Cak1p is found in the cytoplasm.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Localisation (cytoplasm-predominant, dispersed) and regulation of Cak1; the IDA source
      for GO:0005737. Abstract-only cache.
- id: PMID:9857180
  title: Fission yeast Csk1 is a CAK-activating kinase (CAKAK).
  findings:
  - statement: Cak1/Civ1 provides CAK activity in budding yeast, whereas other species use a CDK7-cyclin
      H type CAK.
    supporting_text: 'Two distinct CAK kinases have been described: in budding yeast Saccharomyces cerevisiae,
      the Cak1/Civ1 kinase is responsible for CAK activity.'
    reference_section_type: ABSTRACT
  reference_review:
