  knowledge_gaps:
  - gap_statement: Whether the reported phosphorylation-independent contribution of Cak1 to Cdc28 maturation
      (suppression of Cdc28 C-terminal mutants by catalytically compromised Cak1) reflects a chaperone-like
      role is unresolved.
    boundary: Thr169 phosphorylation by Cak1 is firmly established as the essential mitotic function;
      CDC28 alleles carrying T169E plus hyperactivating substitutions bypass the requirement for CAK1
      in vegetative growth.
- description: 'Activating T-loop phosphorylation of the transcriptional CDKs: Kin28 Thr162 (TFIIH CTD
    Ser5 kinase), Bur1 Thr240 and Ctk1 Thr338 (CTD Ser2 kinase), stimulating their CTD kinase activity
    and thereby supporting RNA polymerase II transcription and, via Ctk1-Set2-Rpd3C(S), suppression of
    cryptic intragenic initiation.'
  supported_by:
  - reference_id: PMID:10373527
    supporting_text: Finally, we show that Kin28p is no longer phosphorylated on Thr-162 following inactivation
      of Cak1p in vivo, that Cak1p can phosphorylate Kin28p on Thr-162 in vitro, and that this phosphorylation
      stimulates the CTD kinase activity of Kin28p.
    reference_section_type: ABSTRACT
  - reference_id: PMID:10373527
    supporting_text: Thus, Kin28p joins Cdc28p, the major cell cycle Cdk in budding yeast, as a physiological
      Cak1p substrate.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19269370
    supporting_text: In agreement with these data, Ostapenko and Solomon reported that Cak1 phosphorylates
      Ctk1 in vivo (Ostapenko and Solomon, 2005), and we found that deletion of CTK1 (or CTK2 and CTK3)
      also results in a cryptic initiation defect (Figure 6e)
    reference_section_type: RESULTS
  - reference_id: file:yeast/CAK1/CAK1-deep-research-falcon.md
    supporting_text: Wild-type Ctk1 efficiently phosphorylates an RNA-polymerase-II CTD peptide, whereas
      Ctk1-T338A has near-background activity comparable to a catalytic mutant.
    reference_section_type: OTHER
  - reference_id: file:yeast/CAK1/CAK1-deep-research-falcon.md
    supporting_text: Recombinant Cak1 stimulates Bur1–Bur2-associated CTD kinase activity.
    reference_section_type: OTHER
