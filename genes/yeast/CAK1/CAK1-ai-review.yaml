  review:
    summary: 'PAINT node PTN008391902 (a small clade that includes Cak1 itself, SGD:S000001865) inherits
      G2/M transition of the mitotic cell cycle. Cak1 is the sole CDK-activating kinase of budding yeast:
      it phosphorylates Cdc28 Thr169, and cak1-ts cells show a G2 delay with low Cdc28 kinase activity
      (PMID:8752210) and conditional loss of Cdc28 phosphorylation and activity (PMID:8752211).'
