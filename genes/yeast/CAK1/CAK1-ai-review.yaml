core_functions:
- description: 'Monomeric, cyclin-independent CDK-activating kinase: phosphorylates Thr169 in the T-loop
    of Cdc28 (Cdk1), preferentially on the monomeric CDK before cyclin binding, thereby licensing cyclin-Cdc28
    holoenzyme activity for the mitotic cell cycle, including the G2/M transition.'
  supported_by:
  - reference_id: PMID:8752211
    supporting_text: Civ1 binds tightly to and phosphorylates Cdc28, thereby allowing its subsequent activation
      by the binding of a cyclin.
    reference_section_type: ABSTRACT
  - reference_id: PMID:8752210
    supporting_text: A temperature-sensitive mutation in CAK1 confers a G2 delay accompanied by low Cdc28p
      protein kinase activity and shows genetic interactions with altered expression of the gene for the
      major mitotic cyclin, CLB2.
    reference_section_type: ABSTRACT
  - reference_id: PMID:9819350
    supporting_text: Thr-169 is phosphorylated by the cdk-activating kinase (CAK), Cak1p, which was recently
      identified as the physiological CAK in budding yeast.
    reference_section_type: ABSTRACT
  - reference_id: file:yeast/CAK1/CAK1-deep-research-falcon.md
    supporting_text: In comparative assays, yeast Cak1 preferentially phosphorylated monomeric CDKs, whereas
      human Cdk7-containing CAK favored cyclin-bound complexes.
    reference_section_type: OTHER
