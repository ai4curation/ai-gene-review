  review:
    summary: 'Electronic transfer from the UniProt EC number 2.7.11.22 (cyclin-dependent kinase). The
      EC assignment is itself a loose fit: GO:0004693 is defined as cyclin-dependent catalysis, whereas
      Cak1 is a monomeric, cyclin-independent kinase (PMID:8752210, PMID:8752211, PMID:9819350) that activates
      cyclin-dependent kinases rather than being one.'
    action: MODIFY
    reason: 'The term''s defining property (cyclin dependence) is directly contradicted by the discovery
      papers: Cak1 is active as a monomer and has full activity in E. coli. The essence (Ser/Thr kinase
      activity of a CDK-like fold) is right, so the row should be recorded as protein serine/threonine
      kinase activity (GO:0004674); the CDK-activating role is a process, best captured by GO:0045737
      positive regulation of cyclin-dependent protein serine/threonine kinase activity, since the dedicated
      CAK activity term GO:0019912 was obsoleted in 2025.'
    proposed_replacement_terms:
