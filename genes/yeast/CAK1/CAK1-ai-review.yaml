id: P43568
gene_symbol: CAK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'CAK1 (also CIV1) encodes the CDK-activating kinase of Saccharomyces cerevisiae, an essential
  368-residue serine/threonine protein kinase that phosphorylates the activation-loop (T-loop) threonine
  of cyclin-dependent kinases. Unlike the metazoan and fission-yeast CAK (CDK7-cyclin H-MAT1; Mcs6-Mcs2),
  Cak1 is only distantly related to CDKs, lacks the canonical glycine-rich ATP-binding loop, is active
  as a monomer without a cyclin or activating phosphorylation, has full activity when expressed in bacteria
  and is not a subunit of TFIIH; it represents a fungal-specific solution to CDK activation. Its principal
  substrate is Cdc28 (Cdk1), which it phosphorylates on Thr169, preferentially as monomeric CDK before
  cyclin binding; this modification is required for Cdc28 kinase activity, so loss of Cak1 lowers Cdc28
  activity and delays cells in G2 (with a substantial G1 fraction), and CAK1 is essential unless CDC28
  carries T-loop-bypassing hyperactive substitutions. Cak1 also activates the transcriptional CDKs by
  the same mechanism: Kin28 (Thr162, the TFIIH kinase that phosphorylates the RNA polymerase II CTD on
  Ser5), Bur1 (Thr240) and Ctk1 (Thr338, CTD Ser2 kinase), and through Ctk1 it feeds the Set2/Rpd3C(S)
  pathway that suppresses cryptic intragenic transcription initiation. It additionally has Cdc28-independent,
  catalysis-dependent roles in sporulation, being required for timely premeiotic DNA replication and sporulation-gene
  expression and for activation of the Smk1 MAP kinase that drives spore wall assembly, although its direct
  meiotic targets are not identified. Cak1 abundance and activity are constant through the mitotic cell
  cycle, decline in stationary phase and oscillate during meiosis; the protein is dispersed throughout
  the cell with the largest pool in the cytoplasm.'
