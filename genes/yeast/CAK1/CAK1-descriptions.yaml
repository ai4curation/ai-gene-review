descriptions:
- source: Alliance_Imported
  text: Cyclin-dependent kinase-activating kinase; required for passage through the
    cell cycle; phosphorylates and activates Cdc28p; nucleotide-binding pocket differs
    significantly from those of most other protein kinases; required for premeiotic
    DNA synthesis, expression of early and middle sporulation specific genes and direct
    phosphorylation of the Smk1p MAPK to regulate spore morphogenesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAK1
  source_id: SGD:S000001865
- source: Alliance_Automated
  text: Enables cyclin-dependent protein kinase activity. Involved in G2/M transition
    of mitotic cell cycle; meiotic cell cycle; and negative regulation of transcription
    initiation by RNA polymerase II. Located in cytoplasm. Used to study cystinosis;
    encephalitis; and intellectual disability. Human ortholog(s) of this gene implicated
    in several diseases, including autosomal recessive primary microcephaly (multiple);
    familial melanoma; high grade glioma (multiple); pancreatic carcinoma (multiple);
    and type 2 diabetes mellitus. Orthologous to human CDK4 (cyclin dependent kinase
    4) and CDK6 (cyclin dependent kinase 6).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAK1
  source_id: SGD:S000001865
