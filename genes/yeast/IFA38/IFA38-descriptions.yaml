gene_symbol: IFA38
organism: yeast
uniprot_id: P38286
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Component of the microsomal membrane bound fatty acid elongation system, which
    produces the 26-carbon very long-chain fatty acids (VLCFA) from palmitate. Catalyzes
    the reduction of the 3- ketoacyl-CoA intermediate that is formed in each cycle
    of fatty acid elongation. VLCFAs serve as precursors for ceramide and sphingolipids.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38286
  source_id: P38286
- source: Alliance_Imported
  text: Microsomal beta-keto-reductase; contains oleate response element (ORE) sequence
    in the promoter region; mutants exhibit reduced VLCFA synthesis, accumulate high
    levels of dihydrosphingosine, phytosphingosine and medium-chain ceramides
  source_type: curated
  url: https://www.yeastgenome.org/locus/IFA38
  source_id: SGD:S000000363
- source: Alliance_Automated
  text: Enables ketoreductase activity and very-long-chain 3-oxoacyl-CoA reductase
    activity. Involved in fatty acid elongation; sphingolipid biosynthetic process;
    and very long-chain fatty acid biosynthetic process. Located in endoplasmic reticulum
    membrane. Used to study cancer; gynecomastia; polycystic kidney disease; and pseudohermaphroditism.
    Human ortholog(s) of this gene implicated in 17-beta hydroxysteroid dehydrogenase
    3 deficiency and disorder of sexual development. Orthologous to several human
    genes including HSD17B12 (hydroxysteroid 17-beta dehydrogenase 12) and HSDL1 (hydroxysteroid
    dehydrogenase like 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IFA38
  source_id: SGD:S000000363
