taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: IFA38 (YBR159W) encodes the very-long-chain 3-oxoacyl-CoA reductase (3-ketoacyl-CoA reductase, KAR)
  of the endoplasmic reticulum fatty acid elongation system, an SDR-family enzyme orthologous to mammalian HSD17B12.
  It catalyses the NADPH-dependent reduction of 3-oxoacyl-CoA intermediates formed by the Elo2/Elo3 condensing enzymes
  to (3R)-3-hydroxyacyl-CoA, the second of the four reactions that add two carbons per cycle to make the C20-C26
  very long-chain fatty acids used for ceramide and sphingolipid synthesis. Ifa38 resides in the ER membrane, co-localises
  and co-immunoprecipitates with Elo3 and Tsc13, and is shared by elongases II and III. ifa38 null cells are viable
  but grow very slowly, have reduced VLCFA, accumulate long-chain bases, medium-chain ceramides and 3-hydroxy fatty
  acids, and also show reduced 3-hydroxyacyl-CoA dehydration, suggesting Ifa38 supports Phs1 activity; residual
  reductase activity depends on Ayr1, and the ifa38 ayr1 double mutant is inviable. Ifa38 also interacts physically
  with the translation initiation factor eIF2B.
