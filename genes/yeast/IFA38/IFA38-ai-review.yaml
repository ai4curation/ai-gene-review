core_functions:
- description: NADPH-dependent reduction of the 3-oxoacyl-CoA produced by Elo2/Elo3 condensation to (3R)-3-hydroxyacyl-CoA,
    the second step of each ER fatty acid elongation cycle; major 3-ketoreductase for elongases II and III, with
    Ayr1 supplying minor residual activity.
