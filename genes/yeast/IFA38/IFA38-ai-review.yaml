suggested_questions:
- question: Does Ifa38 contribute structurally to Phs1 stability or activity within an elongase complex, given that
    ifa38 microsomes also show reduced 3-hydroxyacyl-CoA dehydration?
- question: What is the functional significance of the Ifa38-eIF2B interaction, and is it separable from VLCFA synthesis?
suggested_experiments:
- hypothesis: Ayr1 is the only source of residual 3-ketoacyl-CoA reductase activity in ifa38 cells.
  description: Assay 3-ketoacyl-CoA reduction in ER membranes from ifa38, ayr1 and conditional ifa38 ayr1 strains,
    and reconstitute purified Ayr1 with Elo3, Phs1 and Tsc13 in proteoliposomes.
