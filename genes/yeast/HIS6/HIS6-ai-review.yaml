  label: Saccharomyces cerevisiae S288C
description: Phosphoribosylformimino-5-aminoimidazole carboxamide ribotide isomerase (ProFAR isomerase,
  EC 5.3.1.16) of Saccharomyces cerevisiae, the HisA orthologue. This (beta/alpha)8-barrel enzyme catalyses
  step 4 of L-histidine biosynthesis, an Amadori rearrangement converting the aminoaldose ProFAR to the
  aminoketose PRFAR, using two conserved aspartates as acid/base catalysts. HIS6 complements both yeast
  his6 and E. coli hisA mutants, and is paralogous to the HisF-like cyclase domain of HIS7. The enzyme
  is cytosolic; large-scale GFP localisation also detects it in the nucleus.
