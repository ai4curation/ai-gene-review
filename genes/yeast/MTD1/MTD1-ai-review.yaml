id: Q02046
gene_symbol: MTD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Monofunctional NAD+-dependent 5,10-methylenetetrahydrofolate dehydrogenase (EC 1.5.1.15) of Saccharomyces
  cerevisiae, a cytosolic homodimer only distantly related to the NADP+-dependent dehydrogenase/cyclohydrolase domains
  of C1-THF synthases. Mtd1 oxidises 5,10-methylene-THF to 5,10-methenyl-THF, supplying cytoplasmic one-carbon units
  to 10-formyl-THF for de novo purine biosynthesis. It can replace the NADP+-dependent dehydrogenase of Ade3 when
  one-carbon flux runs oxidatively, but contributes little to reductive flux. MTD1 disruption abolishes NAD-dependent
  activity and causes a purine requirement in some genetic backgrounds; in ade3 cells it is needed for 10-formyl-THF
  production.
