descriptions:
- source: UniProt
  text: Catalyzes oxidation of cytoplasmic one-carbon units for purine biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02046
  source_id: Q02046
- source: Alliance_Imported
  text: NAD-dependent 5,10-methylenetetrahydrafolate dehydrogenase; plays a catalytic
    role in oxidation of cytoplasmic one-carbon units; expression is regulated by
    Bas1p and Bas2p, repressed by adenine, and may be induced by inositol and choline
  source_type: curated
  url: https://www.yeastgenome.org/locus/MTD1
  source_id: SGD:S000001788
- source: Alliance_Automated
  text: Enables methylenetetrahydrofolate dehydrogenase (NAD+) activity. Involved
    in folic acid-containing compound biosynthetic process; one-carbon metabolic process;
    and purine nucleobase biosynthetic process. Located in cytosol. Orthologous to
    human MTHFD2L (methylenetetrahydrofolate dehydrogenase (NADP+ dependent) 2 like)
    and MTHFD2 (methylenetetrahydrofolate dehydrogenase (NADP+ dependent) 2, methenyltetrahydrofolate
    cyclohydrolase).
  source_type: automated
