taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Peroxisomal NADP+-specific isocitrate dehydrogenase (EC 1.1.1.42) of Saccharomyces cerevisiae, targeted to the
  peroxisomal matrix by a C-terminal PTS1 (Cys-Lys-Leu). It oxidatively decarboxylates isocitrate to 2-oxoglutarate, regenerating
  NADPH inside peroxisomes, whose membrane is impermeable to pyridine nucleotides. This NADPH is required by the auxiliary
  2,4-dienoyl-CoA reductase during beta-oxidation of unsaturated fatty acids, so idp3 mutants grow poorly on unsaturated but
  not saturated fatty acids. IDP3 is induced on fatty-acid carbon sources and is the peroxisomal member of three compartment-specific
  NADP-IDH paralogs (Idp1 mitochondrial, Idp2 cytosolic).
