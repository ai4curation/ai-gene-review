taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: May function in the production of NADPH for fatty acid and sterol synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53982
  source_id: P53982
- source: Alliance_Imported
  text: Peroxisomal NADP-dependent isocitrate dehydrogenase; catalyzes oxidation of
    isocitrate to alpha-ketoglutarate with the formation of NADP(H+), required for
    growth on unsaturated fatty acids; IDP3 has a paralog, IDP2, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/IDP3
  source_id: SGD:S000004954
- source: Alliance_Automated
  text: Enables isocitrate dehydrogenase (NADP+) activity. Involved in fatty acid
    beta-oxidation. Located in peroxisome. Human ortholog(s) of this gene implicated
    in several diseases, including D-2-hydroxyglutaric aciduria 2; carcinoma (multiple);
    hematologic cancer (multiple); high grade glioma (multiple); and lung cancer (multiple).
    Orthologous to several human genes including IDH1 (isocitrate dehydrogenase (NADP(+))
    1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IDP3
  source_id: SGD:S000004954
