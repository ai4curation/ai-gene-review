descriptions:
- source: UniProt
  text: IGPS catalyzes the conversion of PRFAR and glutamine to IGP, AICAR and glutamate.
    The glutaminase domain produces the ammonia necessary for the cyclase domain to
    produce IGP and AICAR from PRFAR. The ammonia is channeled to the active site
    of the cyclase domain.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33734
  source_id: P33734
- source: Alliance_Imported
  text: Imidazole glycerol phosphate synthase; glutamine amidotransferase:cyclase
    that catalyzes the fifth step of histidine biosynthesis and also produces 5-aminoimidazole-4-carboxamide
    ribotide (AICAR), a purine precursor
  source_type: curated
  url: https://www.yeastgenome.org/locus/HIS7
  source_id: SGD:S000000452
- source: Alliance_Automated
  text: Enables glutaminase activity and imidazoleglycerol-phosphate synthase activity.
    Involved in L-histidine biosynthetic process. Predicted to be located in cytoplasm.
    Predicted to be active in cytosol.
  source_type: automated
  url: https://www.yeastgenome.org/locus/HIS7
