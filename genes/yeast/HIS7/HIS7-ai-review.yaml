- term:
    id: GO:0009165
    label: nucleotide biosynthetic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PRPP-PWY-1
  review:
    summary: 'RCA from YeastPathways PRPP-PWY-1, a superpathway that bundles histidine, purine and pyrimidine
      biosynthesis; every enzyme of the superpathway inherits the umbrella process. HIS7 is the one histidine
      enzyme with a genuine link to nucleotide metabolism: it releases AICAR, which re-enters de novo
      purine synthesis. However AICAR is a by-product recycled into the purine pathway (net, the histidine
      pathway consumes rather than produces nucleotide precursors), so ''nucleotide biosynthetic process''
      is an over-annotation of the histidine-biosynthetic role.'
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:10733892
      supporting_text: This enzyme represents a junction between histidine biosynthesis and de novo purine
        biosynthesis.
