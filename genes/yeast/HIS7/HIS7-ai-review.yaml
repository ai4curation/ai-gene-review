  label: Saccharomyces cerevisiae S288C
description: 'Imidazole glycerol phosphate synthase (IGPS, EC 4.3.2.10) of Saccharomyces cerevisiae, a
  bifunctional single-chain fusion of an N-terminal class I glutamine amidotransferase (HisH-like glutaminase)
  domain and a C-terminal (beta/alpha)8-barrel cyclase (HisF-like) domain. It catalyses step 5 of L-histidine
  biosynthesis: glutamine is hydrolysed in the glutaminase site and the nascent ammonia is channelled
  through the cyclase barrel to the cyclase active site, where PRFAR is converted to imidazole glycerol
  phosphate (IGP) and 5-aminoimidazole-4-carboxamide ribonucleotide (AICAR). The glutaminase is strongly
  stimulated by binding of the nucleotide substrate. Because AICAR is an intermediate of de novo purine
  synthesis, the enzyme sits at the junction between histidine and purine metabolism. HIS7 is a cytosolic
  monomer, expressed basally and induced by GCN4 under amino acid starvation.'
