id: P46970
gene_symbol: NMD5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  NMD5 (also called KAP119, systematic name YJR132W) encodes a 1048-residue karyopherin of the
  importin-beta superfamily. It belongs to the importin-7/8/11 family (PANTHER PTHR10997), in the
  same subfamily (SF18) as Drosophila Moleskin/DIM-7 and Arabidopsis SAD2. Nmd5 is a nuclear import
  receptor that does not need an importin-alpha adaptor. It binds its cargoes directly in the
  cytoplasm, docks at the nuclear pore through FG-repeat nucleoporins (Nup1, Nup2 and Nup159), and
  releases the cargo when nuclear RanGTP (Gsp1-GTP) binds. Its main constitutive cargo is the RNA
  polymerase II elongation factor TFIIS (Dst1). It also imports several cargoes whose import is set
  by signalling: the osmotic-stress MAP kinase Hog1 after phosphorylation, the calcineurin-dephosphorylated
  transcription factor Crz1 (through a basic/hydrophobic NLS), and the Hsp70 Ssa4
  during starvation or ethanol stress. The protein is found in both the cytoplasm and the nucleus.
  The deletion mutant is viable and grows slightly slowly. Despite the gene name, there is no
  published evidence that Nmd5 takes part in nonsense-mediated mRNA decay.
