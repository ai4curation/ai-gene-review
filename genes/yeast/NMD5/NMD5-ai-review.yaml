core_functions:
- description: >-
    A Ran-regulated importin-beta-type nuclear import receptor. It binds NLS-containing cargoes
    directly in the cytoplasm without an importin-alpha adaptor, docks at FG-repeat nucleoporins,
    and releases the cargo in the nucleus when RanGTP binds. Its cargoes are TFIIS (Dst1), the
    phosphorylated MAP kinase Hog1, calcineurin-dephosphorylated Crz1, and the Hsp70 Ssa4 under
    stress.
  molecular_function:
    id: GO:0061608
    label: nuclear import signal receptor activity
  directly_involved_in:
  - id: GO:0006606
    label: protein import into nucleus
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9852143
    supporting_text: RanGTP, not RanGDP, dissociated the isolated Kap119p/TFIIS complex and bound
      to Kap119p.
  - reference_id: PMID:11535618
    supporting_text: Residues 394–422 are required for Ca2+-dependent nuclear localization of Crz1p,
      and this sequence is recognized by Nmd5p.
  - reference_id: PMID:9755161
    supporting_text: Rather, HOG1 import requires the activity of a gene, NMD5, that encodes a
      novel importin beta homolog.
  - reference_id: file:interpro/panther/PTHR10997/PTHR10997-entries.csv
    supporting_text: NMD5,1048,PTHR10997:SF18,D-IMPORTIN 7_RANBP7
suggested_questions:
- question: >-
    Nmd5 (SF18) and Drosophila Msk/DIM-7 (SF18) both import an activated MAP kinase (Hog1 and D-ERK
    respectively). Is phospho-MAPK recognition an ancestral property of the SF18 subfamily, and does
    it extend to SPCC550.11 and plant SAD2? Or did the two lineages acquire it independently?
- question: >-
    The gene name NMD5 implies a role in nonsense-mediated mRNA decay, but no published data support
    one. Should SGD/UniProt record the name as historical, so that it does not seed NMD predictions?
suggested_experiments:
- description: >-
    Test direct binding of recombinant Nmd5 to phosphorylated and unphosphorylated Hog1, with or
    without Gsp1-GTP. This would establish whether Hog1 is a direct Nmd5 cargo (so far shown only by
    genetic requirement) and whether phosphorylation regulates the binding, as it does for Crz1.
  experiment_type: in vitro binding / pull-down
