gene_symbol: YNG1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Yng1 (yeast inhibitor of growth 1, YOR064C) is an ING-family protein and a non-catalytic,
  histone-reading subunit of NuA3, the Sas3-dependent histone H3 acetyltransferase complex of budding
  yeast. Its C-terminal PHD finger, which binds two zinc ions, recognizes histone H3 trimethylated at
  lysine 4 (H3K4me3, and more weakly H3K4me2), and an N-terminal motif binds the unmodified H3 tail; together
  they increase the association of Yng1 with the H3 tail. Yng1 is not required for the integrity of NuA3
  but is required for NuA3 to bind and acetylate nucleosomes: it links the catalytic subunit Sas3 to nucleosomes
  and so to H3K14 acetylation. Its N-terminal helices pack into a helical bundle with Nto1 and Eaf6, an
  N-terminal region holds both methyl-lysine readers (Yng1 and Pdp3) on the NuA3 core, and a short motif
  (residues 113 to 124) is bound by the extra-terminal domain of Taf14. Genome-wide, Yng1 colocalizes
  with H3K4me3 at the 5'' ends of transcribed genes, and the PHD finger of Yng1 and the PWWP domain of
  Pdp3 independently recruit NuA3 to H3K4- and H3K36-methylated chromatin. Disrupting H3K4me3 binding
  by Yng1 alters H3K14 acetylation and transcription at a subset of genes. Yng1 is the defining reader
  of the NuA3a form; at least part of the Pdp3-containing NuA3b form also contains Yng1. Yng1 is nuclear,
  deletion is viable, and overexpression is toxic in a PHD-finger and H3K4-methylation-dependent manner.'
