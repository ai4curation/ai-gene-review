      that binds unmodified H3 tails and a carboxyl-terminal PHD finger that specifically recognizes H3K4me3'
  - reference_id: PMID:28108585
    supporting_text: we demonstrate that the PHD finger of Yng1, and the PWWP domain of Pdp3 independently
      target NuA3 to H3K4 and H3K36 methylated chromatin, respectively
suggested_experiments:
- description: Quantitative mass spectrometry of Pdp3-TAP and Yng1-TAP purifications (and of yng1 N-terminal
    deletion strains) to measure Yng1 and Pdp3 stoichiometry in each NuA3 form.
knowledge_gaps:
- gap_statement: It is unresolved whether Yng1 is a stable subunit of the Pdp3-containing NuA3b form,
    and whether its PHD finger is engaged there.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: NuA3a and NuA3b were defined as two forms, with Yng1 as the reader of NuA3a and Pdp3 the
    reader of NuA3b, and GO's NuA3b definition lists no Yng1. Peptide pulldowns later showed that part
    of NuA3 contains both readers and that the Yng1 N-terminal region is needed to keep Pdp3 on the core.
    Whether the two forms are separate complexes or one complex with variable reader occupancy decides
    how H3K4me3 and H3K36me3 targeting are combined at a gene.
  provenance:
  - *id014
  - reference_id: PMID:33010166
    supporting_text: indicating that a portion of NuA3 HAT includes both Yng1 and Pdp3
  - *id015
