core_functions:
- description: Histone-reading subunit of NuA3. The Yng1 PHD finger binds H3K4me3, and an N-terminal motif
    binds the unmodified H3 tail; together they link the catalytic subunit Sas3 to nucleosomes at the
    5' ends of transcribed genes, which NuA3 needs to acetylate H3K14. Yng1 defines the NuA3a form and,
    through its N-terminal region, also holds the H3K36me3 reader Pdp3 on the complex.
  molecular_function:
    id: GO:0140002
    label: histone H3K4me3 reader activity
  contributes_to_molecular_function:
    id: GO:0036408
    label: histone H3K14 acetyltransferase activity
