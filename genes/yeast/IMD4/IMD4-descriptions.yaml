gene_symbol: IMD4
organism: yeast
uniprot_id: P50094
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the conversion of inosine 5'-phosphate (IMP) to xanthosine 5'-phosphate
    (XMP), the first committed and rate-limiting step in the de novo synthesis of
    guanine nucleotides, and therefore plays an important role in the regulation of
    cell growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50094
  source_id: P50094
- source: Alliance_Imported
  text: Inosine monophosphate dehydrogenase; catalyzes the rate-limiting step in the
    de novo synthesis of GTP; member of a four-gene family in S. cerevisiae, constitutively
    expressed; IMD4 has a paralog, IMD3, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/IMD4
  source_id: SGD:S000004520
- source: Alliance_Automated
  text: Enables mRNA binding activity. Predicted to be involved in GTP biosynthetic
    process. Located in cytoplasm. Human ortholog(s) of this gene implicated in Leber
    congenital amaurosis 11; retinitis pigmentosa; and retinitis pigmentosa 10. Orthologous
    to several human genes including IMPDH1 (inosine monophosphate dehydrogenase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IMD4
  source_id: SGD:S000004520
