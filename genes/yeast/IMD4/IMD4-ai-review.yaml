- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16429126
  qualifier: enables
  supporting_entities:
  - UniProtKB:P50095
  review:
    summary: 'Gavin et al. 2006 TAP-MS: Imd4 co-purifies/interacts with its paralog Imd3 (P50095). This reflects
      assembly of mixed IMPDH heterotetramers (McPhillips et al. 2004), a structural feature of the enzyme rather
      than a distinct molecular function; "protein binding" adds no information.'
    action: REMOVE
    reason: Uninformative protein binding; the Imd3-Imd4 association is real (heteromeric IMPDH tetramers) but is
      captured by the IMPDH activity/complex, not by this term. Removal does not mean the interaction is false.
    supported_by:
    - reference_id: PMID:15292516
      supporting_text: Purification of the tagged IMD gene products reveals that the family of polypeptides coassemble
        to form heteromeric IMPDH complexes, suggesting that they form mixed tetramers.
