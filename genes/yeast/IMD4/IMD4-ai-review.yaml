id: P50094
gene_symbol: IMD4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: IMD4 (YML056C) encodes one of three functional inosine-5'-monophosphate dehydrogenases (IMPDH; with
  IMD2 and IMD3; IMD1 is a pseudogene) of Saccharomyces cerevisiae. The enzyme catalyses the NAD+-dependent oxidation
  of IMP to xanthosine 5'-monophosphate (XMP), the first committed and rate-limiting step of guanine nucleotide
  synthesis from IMP; XMP is then aminated to GMP by Gua1. Deletion of all four IMD genes causes guanine auxotrophy,
  and IMD4 alone is sufficient for guanine prototrophy, but unlike the transcriptionally inducible IMD2, IMD4 cannot
  confer resistance to mycophenolic acid (MPA) and its product is efficiently trapped as the MPA-inhibited covalent
  intermediate in vivo. Imd4 contains a CBS (Bateman) regulatory domain and assembles with Imd2 and Imd3 into mixed
  IMPDH tetramers. It is a cytoplasmic enzyme; it has also been recovered among proteins cross-linked to mRNA in
  a proteome-wide survey.
