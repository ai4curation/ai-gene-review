- description: NAD+-dependent IMP dehydrogenase (IMP -> XMP), the committed, rate-limiting step of guanine nucleotide
    synthesis; one of three redundant, co-assembling yeast IMPDH subunits (Imd2/3/4), sufficient alone for guanine
    prototrophy but MPA-sensitive.
