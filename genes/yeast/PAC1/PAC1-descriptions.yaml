gene_symbol: PAC1
organism: yeast
uniprot_id: P39946
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Positively regulates the activity of the minus-end directed microtubule motor
    protein dynein. Plays a central role in positioning the mitotic spindle at the
    bud neck during cell division. Targets cytoplasmic dynein to microtubule plus
    ends, thereby promoting dynein- mediated microtubule sliding along the bud cortex
    and consequently the movement of the mitotic spindle to the bud neck. Following
    plus end binding, dynein may be offloaded to the cortex by NUM1. Required for
    viability in the absence of the kinesin-related microtubule-dependent motor protein
    CIN8.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39946
  source_id: P39946
- source: Alliance_Imported
  text: Regulator of dynein, involved in intracellular transport; part of the dynein/dynactin
    pathway; targets dynein to microtubule tips, which is necessary for sliding of
    microtubules along bud cortex; serves at interface between dynein's ATPase site
    and its microtubule binding stalk, causing individual dynein motors to remain
    attached to microtubules for long periods; synthetic lethal with bni1; homolog
    of human LIS1, mutations in which cause the severe brain disorder lissencephaly
  source_type: curated
  url: https://www.yeastgenome.org/locus/PAC1
  source_id: SGD:S000005795
- source: Alliance_Automated
  text: Enables identical protein binding activity and microtubule plus-end binding
    activity. Involved in nuclear migration along microtubule. Located in cytoplasmic
    microtubule and nucleus. Used to study lissencephaly. Human ortholog(s) of this
    gene implicated in lissencephaly; lissencephaly 1; and nervous system disease.
    Orthologous to human PAFAH1B1 (platelet activating factor acetylhydrolase 1b regulatory
    subunit 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PAC1
  source_id: SGD:S000005795
