  text: Enables identical protein binding activity and microtubule plus-end binding
    activity. Involved in nuclear migration along microtubule. Located in cytoplasmic
    microtubule and nucleus. Used to study lissencephaly. Human ortholog(s) of this
    gene implicated in lissencephaly; lissencephaly 1; and nervous system disease.
    Orthologous to human PAFAH1B1 (platelet activating factor acetylhydrolase 1b regulatory
    subunit 1).
