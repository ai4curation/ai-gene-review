- term:
    id: GO:0140659
    label: cytoskeletal motor regulator activity
  evidence_type: IDA
  original_reference_id: PMID:22939623
  review:
    summary: Purified Pac1/Lis1 alters the mechanochemistry of yeast dynein (prolonged microtubule attachment),
      and stabilizes its uninhibited conformation.
    action: NEW
    reason: Direct in vitro and in vivo evidence that Pac1 regulates the dynein motor; matches the module
      and human LIS1 term GO:0140659. Whether the net effect is inhibitory (holding dynein at plus ends
      until Num1 releases it) or activating (stabilizing the open conformation) depends on context, which
      the regulator parent term accommodates.
    additional_reference_ids:
    - PMID:32341548
    - PMID:26483554
    supported_by:
    - reference_id: PMID:22939623
      supporting_text: Thus, Lis1 operates like a "clutch" that prevents dynein's ATPase domain from transmitting
        a detachment signal to its track-binding domain.
    - reference_id: PMID:32341548
      supporting_text: Our studies demonstrate that, rather than inhibiting dynein motility, Pac1/LIS1
        promotes dynein activity by stabilizing the uninhibited conformation, which ensures appropriate
        dynein localization and activity in cells.
