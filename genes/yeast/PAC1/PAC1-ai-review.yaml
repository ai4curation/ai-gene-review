  review:
    summary: Pac1 self-interaction in a proteome-scale two-hybrid screen.
    action: KEEP_AS_NON_CORE
    reason: Pac1, like all LIS1 proteins, is a LisH-mediated dimer. Dimerization supports but is not strictly
      required for dynein regulation (a monomeric beta-propeller can regulate dynein at high concentration),
      so it is retained as a non-core structural property.
    additional_reference_ids:
