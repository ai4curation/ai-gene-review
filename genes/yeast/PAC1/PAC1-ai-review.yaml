id: P39946
gene_symbol: PAC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Pac1 is the Saccharomyces cerevisiae ortholog of LIS1 (Aspergillus NudF), a dimeric WD40
  beta-propeller protein with an N-terminal LisH dimerization domain that binds the motor domain of cytoplasmic
  dynein (Dyn1). In budding yeast dynein''s principal role is to pull the mitotic spindle into the bud
  neck: dynein is carried to the plus ends of astral microtubules, off-loaded to cortical Num1 receptors
  in the bud, and then walks toward the spindle pole body so that microtubules slide along the bud cortex.
  Pac1 localizes to the plus ends of cytoplasmic microtubules (with help from Bik1/CLIP-170 and the NudE
  homolog Ndl1) and is required for dynein''s plus-end accumulation and hence for microtubule sliding,
  spindle movement into the neck and nuclear segregation; pac1 mutants are synthetically lethal with loss
  of the kinesin-5 Cin8 and sick with loss of the parallel Kar9 pathway. Biochemically, Pac1 engages the
  dynein motor at the interface between the AAA+ ring and stalk, prolonging microtubule attachment, and
  it stabilizes an uninhibited (open) conformation of dynein, coordinating dynein''s plus-end localization
  with its later activation at the cortex.'
