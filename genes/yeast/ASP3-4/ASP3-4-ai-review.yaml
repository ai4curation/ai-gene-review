- term:
    id: GO:0006995
    label: cellular response to nitrogen starvation
  evidence_type: IDA
  original_reference_id: PMID:3042786
  qualifier: involved_in
  review:
    summary: Asparaginase II appears only after nitrogen starvation or growth on poor nitrogen sources
      and is subject to nitrogen catabolite repression at the mRNA level; the enzyme lets cells scavenge
      nitrogen from external asparagine. The annotation reflects regulated expression plus a scavenging
      role rather than a starvation-response mechanism.
    action: KEEP_AS_NON_CORE
    reason: Physiologically relevant context, but secondary to the catalytic role.
    supported_by:
    - reference_id: PMID:238936
      supporting_text: The appearance of the external asparaginase is stimulated by nitrogen starvation,
        requires an available energy source, and is prevented by cycloheximide.
    - reference_id: PMID:3042786
      supporting_text: nitrogen catabolite repression of asparaginase II is achieved by alteration in
        mRNA levels
    - reference_id: file:yeast/ASP3-4/ASP3-4-uniprot.txt
      supporting_text: 'INDUCTION: Subject to nitrogen catabolite repression (NCR). Not found'
