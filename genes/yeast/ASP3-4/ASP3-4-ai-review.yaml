id: P0CX79
gene_symbol: ASP3-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ASP3-4 (YLR160C) is one of four identical, tandemly arrayed copies (ASP3-1 to ASP3-4) in
  the ribosomal-DNA-adjacent region of chromosome XII of S288C that encode asparaginase II (L-asparagine
  amidohydrolase, EC 3.5.1.1), a member of the asparaginase type-I/II family. The protein carries an N-terminal
  signal peptide, is glycosylated and secreted to the periplasm/cell wall, where it hydrolyses external
  L-asparagine to L-aspartate and ammonium. Unlike the constitutive cytoplasmic asparaginase I (ASP1),
  asparaginase II is subject to nitrogen catabolite repression and appears only during nitrogen starvation
  or growth on poor nitrogen sources, allowing cells to scavenge nitrogen from extracellular asparagine.
  It also hydrolyses D-asparagine and N-acyl-asparagines but not L-glutamine.
