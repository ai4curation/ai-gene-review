suggested_questions:
- question: Do the four ASP3 copies contribute additively to periplasmic asparaginase II activity, and
    how does copy number vary among S. cerevisiae strains?
- question: Does asparaginase II contribute measurably to nitrogen supply when asparagine is the sole
    nitrogen source, relative to uptake and cytosolic ASP1?
suggested_experiments:
- description: Delete the entire ASP3 cluster and measure extracellular asparaginase activity and growth
    on L-asparagine as sole nitrogen source under NCR-derepressing conditions.
