  title: >-
    Dedicated chaperones coordinate co-translational regulation of ribosomal protein production with
    ribosome assembly to preserve proteostasis.
  findings:
  - statement: >-
      Acl4 participates in a cytoplasmic Rpl4 production-control pathway that couples nascent
      Rpl4 recognition to RPL4 mRNA stability.
    supporting_text: >-
      the co-translational recognition of Rpl3 and Rpl4 by their respective dedicated chaperone,
      Rrb1 or Acl4, reduces the degradation of the encoding RPL3 and RPL4 mRNAs
