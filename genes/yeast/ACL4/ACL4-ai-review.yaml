- term:
    id: GO:0140318
    label: protein transporter activity
  evidence_type: IDA
  original_reference_id: PMID:26447800
  review:
    summary: >-
      The evidence supports Acl4 directly binding and escorting Rpl4 to the
      pre-60S assembly pathway, matching the current definition of protein
      transporter activity as binding and delivering a specific protein to a
      cellular location.
    action: ACCEPT
    reason: >-
      QuickGO places GO:0140318 under transporter activity and GO:0140597 under
      molecular carrier activity rather than as a parent-child pair. Retaining
      this SGD IDA annotation is therefore not a redundant parent annotation,
      and the PMID:26447800 evidence supports Acl4 escorting Rpl4 to the
      pre-60S assembly pathway.
    supported_by:
    - reference_id: PMID:26447800
      supporting_text: "dedicated chaperone Acl4 accompanies Rpl4"
- term:
    id: GO:0051083
    label: "'de novo' cotranslational protein folding"
  evidence_type: HGI
  original_reference_id: PMID:19325107
  review:
    summary: Cotranslational Rpl4 capture is demonstrated, while the precise folding contribution in the
      HGI source remains unresolved.
    action: UNDECIDED
    reason: GO:0051083 concerns correct noncovalent assembly of nascent chains while translation continues,
      and does not imply a general chaperone for all substrates. PMID:26447800 directly supports cotranslational
      Rpl4 recognition, but recognition/protection need not itself demonstrate the folding step. The cached
      PMID:19325107 remains abstract-only after full-text retrieval attempts; its ACL4 genetic-interaction
      evidence should not be overruled from the abstract or the preference for a more specific carrier
      role.
    supported_by:
    - reference_id: PMID:26447800
      supporting_text: We conclude that Acl4 has the capacity to recognize Rpl4 in a co-translational
        manner.
