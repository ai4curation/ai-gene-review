  publication_type: DEEP_RESEARCH
  findings:
  - statement: The report computes no hydrophobic transmembrane candidate segment, which addresses
      integral membrane insertion rather than soluble contribution.
    supporting_text: '**zero** transmembrane-candidate segments'
    reference_section_type: RESULTS
  - statement: The report recognizes Acl4 cargo escort to nuclear pre-60S assembly.
    supporting_text: dedicated escort chaperone
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The seed/report omitted the source contributes_to qualifier. Lack of a transmembrane
      helix does not refute contribution by a soluble complex subunit; known Rpl4 chaperoning is not
      evidence that all other roles are impossible. PAINT topology/branch-specific loss was not demonstrated.
