  publication_type: DEEP_RESEARCH
  findings:
  - statement: >-
      The follow-up report rejected mitochondrial and transmembrane-transporter IBA
      inheritance for the ACL4/Rpl4-chaperone clade.
    supporting_text: all four mitochondrial sub-claims and the transmembrane-transporter sub-claim fail
    reference_section_type: RESULTS
  - statement: >-
      The follow-up report explicitly found that the contributes_to qualifier does
      not rescue the protein-transmembrane-transporter IBA.
    supporting_text: The `contributes_to` qualifier does not save the mitochondrial terms.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Directly inspected; this report corrected the earlier OpenScientist transporter
      assessment by preserving the contributes_to qualifier and independently adjudicating
