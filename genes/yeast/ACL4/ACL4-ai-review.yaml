id: Q03771
gene_symbol: ACL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: ACL4 encodes a dedicated assembly chaperone for the large ribosomal subunit protein Rpl4/uL4.
  Acl4 captures nascent Rpl4, shields its extended basic internal loop, keeps unassembled Rpl4 soluble,
  and accompanies it from the cytoplasm to nuclear pre-60S assembly sites. Loss of ACL4 causes slow
  growth, reduced 60S subunit production, half-mer polysomes and pre-rRNA processing defects.
existing_annotations:
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      This mitochondrial IBA is a TOM70-family over-propagation from membrane-anchored
      import receptors onto soluble cytoplasmic/nuclear Acl4.
    action: REMOVE
    reason: >-
      The corrected focused mitochondrial report traced all five ACL4 mitochondrial
      IBAs to PANTHER:PTN002340064 and to TOM70/TOM71/TOMM70-type mitochondrial import
      receptors. Acl4 shares their TPR peptide-binding fold but not their N-terminal
      outer-membrane anchor, import-receptor clients or TOM/TIM/SAM/PAM interaction
      context. Primary Acl4 studies instead localize Acl4 to the cytoplasm and nucleus
      and establish a soluble Rpl4-specific chaperone pathway, so the mitochondrial
      outer membrane location should not transfer to Acl4.
    supported_by:
    - reference_id: PMID:26447800
      supporting_text: Acl4 localizes to both the cytoplasm and nucleus
    - reference_id: file:yeast/ACL4/ACL4-hypotheses/mitochondrial-targeting-and-translocation-contribution/openscientist.md
      supporting_text: >-
        experimental seeds are the TPR-domain mitochondrial import receptors TOM70, TOM71, and human TOMM70
