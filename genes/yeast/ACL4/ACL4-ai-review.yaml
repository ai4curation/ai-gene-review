id: Q03771
gene_symbol: ACL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: ACL4 encodes a dedicated assembly chaperone for the large ribosomal subunit protein Rpl4/uL4.
  Acl4 captures nascent Rpl4, shields its extended basic internal loop, keeps unassembled Rpl4 soluble,
  and accompanies it from the cytoplasm to nuclear pre-60S assembly sites. Loss of ACL4 causes slow
  growth, reduced 60S subunit production, half-mer polysomes and pre-rRNA processing defects.
existing_annotations:
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The mitochondrial localization is a Tom70-family over-propagation.
    action: REMOVE
    reason: >-
      The corrected focused report resolves the earlier uncertainty: the mitochondrial
      outer-membrane, matrix-import, inner-membrane-insertion and transmembrane-transporter
      calls originate from TOM70/TOM71/TOMM70 import receptors in the same broad TPR
      PANTHER family, while yeast Acl4 is a soluble cytoplasmic/nuclear Rpl4 carrier
      chaperone with no mitochondrial localization, import substrate, or TOM/TIM
      interaction evidence. These mitochondrial IBA calls should not propagate to the
      ACL4/Rpl4-chaperone clade.
    supported_by:
    - reference_id: PMID:26447800
      supporting_text: Acl4 localizes to both the cytoplasm and nucleus
    - reference_id: file:yeast/ACL4/ACL4-hypotheses/mitochondrial-targeting-and-translocation-contribution/openscientist.md
      supporting_text: all four mitochondrial sub-claims and the transmembrane-transporter sub-claim fail
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
