        source_label: PTN002340064
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The Tom70-family donor assertions are sound for membrane-anchored mitochondrial import
          receptors but unsafe for the soluble ACL4/Rpl4 carrier-chaperone clade.
