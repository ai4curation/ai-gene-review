  findings:
  - statement: >-
      Acl4 forms a soluble TPR complex around the Rpl4 loop and protects Rpl4 from
      degradation during its handoff to nuclear import.
    supporting_text: >-
      Thus, Acl4 serves a dual function to facilitate nuclear import and simultaneously protect
      unassembled RpL4 from the cellular degradation machinery.
