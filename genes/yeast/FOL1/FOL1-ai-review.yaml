id: P53848
gene_symbol: FOL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FOL1 encodes a trifunctional folate biosynthesis enzyme of 824 residues that catalyses three consecutive
  steps of de novo tetrahydrofolate synthesis. Its N-terminal dihydroneopterin aldolase (DHNA/FolB, EC 4.1.2.25)
  domains convert 7,8-dihydroneopterin to 6-hydroxymethyl-7,8-dihydropterin. A central HPPK domain (EC 2.7.6.3)
  pyrophosphorylates this pterin with ATP. A C-terminal dihydropteroate synthase domain (DHPS, EC 2.5.1.15) condenses
  the pterin diphosphate with p-aminobenzoate to form 7,8-dihydropteroate, the step inhibited by sulfonamides. Fol1p
  therefore joins the GTP-derived pterin branch (Fol2p) and the chorismate-derived PABA branch (Abz1p/Abz2p) and
  feeds Fol3p and Dfr1p. All three activities were detected after expression in E. coli and in wild-type yeast but
  not in fol1 deletion strains. FOL1 is essential without folinic acid supplementation, and folate starvation of
  fol1 cells induces filamentous and invasive growth. Fol1p is a low-abundance homodimer located exclusively at
  mitochondrial membranes, which places the central steps of folate synthesis at mitochondria.
