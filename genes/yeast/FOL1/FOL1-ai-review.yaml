suggested_questions:
- question: Is Fol1p on the inner or outer mitochondrial membrane, and which face does its active site face?
- question: How are PABA (made in the cytosol) and dihydropteroate exchanged between cytosol and mitochondria, given
    that Fol3p and Dfr1p are largely cytoplasmic?
suggested_experiments:
- hypothesis: Fol1p is an outer mitochondrial membrane protein facing the cytosol
  description: Submitochondrial fractionation (outer/inner membrane separation, carbonate extraction) and protease-protection
    assays on endogenously tagged Fol1p; complement with import-incompetent variants to test whether mitochondrial
    association is needed for folate synthesis.
  experiment_type: subcellular fractionation
