  review:
    summary: Niedenthal et al. 1996 GFP-fusion study of chromosome XIV ORFs (FOL1 = YNL256W); the curator recorded
      a cytoplasmic signal. The later, more detailed study (fluorescence and immuno-EM with GFP fusions and anti-Fol1p
      antibodies) found Fol1p exclusively at mitochondrial membranes. Because GO cytoplasm includes mitochondria
      the annotation is not false, but it is far less specific than the mitochondrial membrane location.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:8813764
      supporting_text: Analysis of three unknown open reading frames obtained from the budding yeast chromosome
        XIV resulted in distinct staining patterns
    - &id006
      reference_id: PMID:15169867
      supporting_text: Fol1p is exclusively localized to mitochondria as shown by fluorescence microscopy and immune
        electronmicroscopy.
