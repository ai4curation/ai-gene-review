id: Q04212
gene_symbol: ARA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ARA2 (YMR041C) encodes an NAD+-specific D-arabinose 1-dehydrogenase (EC 1.1.1.116) of the
  aldo-keto reductase superfamily, related to the plant L-galactose dehydrogenase of the ascorbate pathway.
  It oxidises D-arabinose to D-arabinono-1,4-lactone with NAD+, with a Km for D-arabinose (0.78 mM) about
  200-fold lower than that of the NADP+-preferring isozyme Ara1. Ara2 supplies most of the lactone used
  for synthesis of D-erythroascorbate (dehydro-D-arabinono-1,4-lactone), the five-carbon ascorbate analogue
  of yeast; ara2 deletion abolishes NAD+-dependent D-arabinose dehydrogenase activity and the rise in
  erythroascorbate after D-arabinose feeding. It is presumed to be a soluble cytoplasmic enzyme.
