suggested_questions:
- question: What enzyme produces the erythroascorbate remaining in ara1 ara2 double mutants, and where
    does endogenous D-arabinose come from in yeast?
suggested_experiments:
- description: Screen other AKRs (e.g. GCY1, YPR1, GRE3) for D-arabinose dehydrogenase activity and measure
    erythroascorbate in ara1 ara2 combined with candidate deletions; directly localise Ara2-GFP.
