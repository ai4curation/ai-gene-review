description: N-acetylglutamate synthase (NAGS; amino-acid acetyltransferase, EC 2.3.1.1) of Saccharomyces
  cerevisiae, a mitochondrial matrix enzyme that acetylates L-glutamate with acetyl-CoA to form N-acetyl-L-glutamate,
  the first step of the acetylated (ornithine-producing) branch of arginine biosynthesis. Like other fungal
  NAGS it is unrelated in sequence to bacterial ArgA. Arg2 is active only in a stoichiometric complex
  (metabolon) with the acetylglutamate kinase domain of Arg5,6; complex formation is required for synthase
  activity and stability and couples arginine feedback inhibition of NAGS and NAGK, the two flux-controlling
  steps of the pathway. Arg2 provides the anaplerotic supply of N-acetylglutamate, which is otherwise
  recycled by ornithine acetyltransferase (Arg7).
