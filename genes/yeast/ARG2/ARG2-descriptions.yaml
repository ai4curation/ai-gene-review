- source: Alliance_Imported
  text: Acetylglutamate synthase (glutamate N-acetyltransferase); mitochondrial enzyme
    that catalyzes the first step in the biosynthesis of the arginine precursor ornithine;
    forms a complex with Arg5,6p
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARG2
  source_id: SGD:S000003607
- source: Alliance_Automated
  text: Enables L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as
    donor. Involved in L-arginine biosynthetic process and L-ornithine biosynthetic
    process. Located in mitochondrial matrix. Part of NAGS/NAGK complex. Human ortholog(s)
    of this gene implicated in N-acetylglutamate synthase deficiency and amino acid
    metabolic disorder. Orthologous to human NAGS (N-acetylglutamate synthase).
  source_type: automated
