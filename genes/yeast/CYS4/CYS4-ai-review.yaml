id: P32582
gene_symbol: CYS4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Cys4 (Str4p) is the cystathionine beta-synthase of Saccharomyces cerevisiae (EC 4.2.1.22),
  a pyridoxal 5'-phosphate-dependent enzyme that condenses L-homocysteine with L-serine to form L-cystathionine.
  This is the first step of reverse transsulfuration, the only route to cysteine in yeast, which assimilates
  reduced sulfur first into homocysteine; Cys3 (cystathionine gamma-lyase) then cleaves cystathionine
  to cysteine. Unlike mammalian CBS, the yeast enzyme has no heme, but it keeps the C-terminal CBS-domain
  regulatory region. The catalytic mechanism runs through an aminoacrylate intermediate. Cys4 can also
  make H2S by beta-replacement of cysteine with homocysteine. cys4 null mutants are cysteine auxotrophs
  and grow slowly. Cys4 is a soluble cytoplasmic protein; it is also found in mitochondrial proteomes
  and in stress-granule preparations. A non-catalytic function of Cys4 in lowering the critical cell size
  for START has been reported, separable from its role in cysteine synthesis.
