- term:
    id: GO:0070814
    label: hydrogen sulfide biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:19531479
  qualifier: involved_in
  review:
    summary: Detailed kinetic analysis of yeast and human CBS (PMID:19531479) showed that CBS generates
      H2S, preferentially by beta-replacement of cysteine with homocysteine. The H2S-producing reactions
      are alternative activities of the enzyme. They are physiologically plausible, and CYS4 overexpression
      affects H2S output in vivo (PMID:31582588), but they are secondary to cystathionine synthesis. Kept
      as non-core.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:19531479
      supporting_text: CBS from both organisms shows a marked preference for H2S generation by beta-replacement
        of cysteine by homocysteine.
