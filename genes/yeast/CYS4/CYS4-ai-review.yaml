  review:
    summary: IMP for the obsolete term 'transsulfuration' (GO:0019346) based on the STR4/CYS4 cloning
      paper (PMID:8366024). The experimental finding, cysteine auxotrophy of the null mutant, is sound.
      The obsolete term's suggested replacement for this reverse (homocysteine to cysteine) direction
      is L-cysteine biosynthetic process.
