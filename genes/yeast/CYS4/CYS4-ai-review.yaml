- term:
    id: GO:0007089
    label: traversing start control point of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:22438835
  qualifier: involved_in
  review:
    summary: In a systematic screen of G1/START timing (PMID:22438835), loss of Cys4 delayed START and
      overexpression reduced the critical size for START. A catalytically dead Cys4-S289D variant still
      reduced critical size and rescued proliferation defects, so this is a reported non-catalytic, moonlighting
      role. The experimental support is direct, but the role is outside the core metabolic function, so
      it is kept as non-core.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:22438835
      supporting_text: 'These results suggest that Cys4p promotes START in two ways: By promoting cell
        growth, which requires its catalytic activity; and by reducing critical size, which does not require
        Cys4p''s catalytic activity.'
