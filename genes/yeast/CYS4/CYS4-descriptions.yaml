descriptions:
- source: Alliance_Imported
  text: Cystathionine beta-synthase; catalyzes synthesis of cystathionine from serine
    and homocysteine, the first committed step in cysteine biosynthesis; responsible
    for hydrogen sulfide generation; advances passage through START by promoting cell
    growth which requires catalytic activity, and reducing critical cell size independent
    of catalytic activity; mutations in human ortholog CBS cause homocystinuria; human
    CBS can complement yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/CYS4
  source_id: SGD:S000003387
- source: Alliance_Automated
  text: Enables cystathionine beta-synthase activity. Involved in hydrogen sulfide
    biosynthetic process; sulfur amino acid metabolic process; and traversing start
    control point of mitotic cell cycle. Located in cytoplasmic stress granule and
    mitochondrion. Is active in cytoplasm. Used to study Down syndrome; breast cancer;
    colon cancer; homocystinuria; and ovarian cancer. Human ortholog(s) of this gene
    implicated in several diseases, including cerebral infarction; homocystinuria;
    hyperhomocysteinemia; malaria; and neural tube defect. Orthologous to human CBS
    (cystathionine beta-synthase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CYS4
  source_id: SGD:S000003387
