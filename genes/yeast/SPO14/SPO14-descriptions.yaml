gene_symbol: SPO14
organism: yeast
uniprot_id: P36126
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for meiosis and spore formation. Seems to be involved in the coordinate
    induction of late meiotic events. PLD activity is induced under sporulation conditions
    and seems to be necessary to complete the meiotic cycle, but not for vegetative
    cell growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36126
  source_id: P36126
- source: Alliance_Imported
  text: Phospholipase D; catalyzes the hydrolysis of phosphatidylcholine, producing
    choline and phosphatidic acid; involved in Sec14p-independent secretion; required
    for meiosis and spore formation; differently regulated in secretion and meiosis;
    participates in transcription initiation and/or early elongation of specific genes;
    interacts with 'foot domain' of RNA polymerase II; deletion results in abnormal
    CTD-Ser5 phosphorylation of RNA polymerase II at specific promoter regions
  source_type: curated
  url: https://www.yeastgenome.org/locus/SPO14
  source_id: SGD:S000001739
- source: Alliance_Automated
  text: Enables D-type glycerophospholipase activity and phosphatidylinositol-3-phosphate
    binding activity. Involved in ascospore-type prospore assembly; cell morphogenesis
    involved in conjugation with cellular fusion; and phospholipid metabolic process.
    Located in endosome; nucleus; and prospore membrane. Used to study developmental
    cardiac valvular defect. Human ortholog(s) of this gene implicated in developmental
    cardiac valvular defect. Orthologous to several human genes including PLD2 (phospholipase
    D2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SPO14
  source_id: SGD:S000001739
