gene_symbol: SPO14
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Spo14 (Pld1) is the major phospholipase D of Saccharomyces cerevisiae, a large HKD-motif
  PLD with PX and PH lipid-binding domains that hydrolyses phosphatidylcholine to phosphatidic acid (PA)
  and choline. Its activity requires phosphatidylinositol 4,5-bisphosphate and the regulator Srf1, and
  is strongly induced during meiosis. Spo14 is dispensable for vegetative growth but essential for sporulation:
  it relocalises to the spindle pole body and the developing prospore membrane, where PA it generates
  recruits the SNARE Spo20 and is needed for fusion of precursor vesicles into the prospore membrane.
  In vegetative cells it is found on endosomes, supports Sec14-independent Golgi secretion, and contributes
  to pheromone-induced polarised growth (mating projection formation), where PA binds and stimulates the
  PAK kinase Ste20.'
