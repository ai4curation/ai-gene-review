id: Q04119
gene_symbol: PPN1
aliases:
- PHM5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  PPN1 encodes a vacuolar fungal endopolyphosphatase-family enzyme that catabolizes
  inorganic polyphosphate by both internal cleavage and chain-end phosphate release.
  The protein is made as a single-pass vacuolar membrane precursor, sorted through
  multivesicular bodies by ubiquitin-dependent internal-vesicle targeting, and
  proteolytically matured in the vacuole. Ppn1 activity shortens long-chain
  vacuolar polyphosphate and can also appear in the cytosol under phosphate-rich
  outgrowth conditions, making it one of the major budding-yeast enzymes that
  mobilizes stored polyphosphate.
