core_functions:
- description: >-
    Proteolytically activated vacuolar endopolyphosphatase that internally
    cleaves long-chain inorganic polyphosphate into shorter polymers.
  molecular_function:
    id: GO:0000298
    label: endopolyphosphatase activity
  directly_involved_in:
  - id: GO:0006798
    label: polyphosphate catabolic process
  locations:
  - id: GO:0000324
    label: fungal-type vacuole
  supported_by:
  - reference_id: PMID:11447286
    supporting_text: >-
      That PPN1 encodes Ppn1 was verified by a 25-fold increase in Ppn1 when
      overexpressed under a GAL promoter and also by several peptide sequences
      that match exactly with sequences in a yeast genome ORF, the mutation of
      which abolishes Ppn1 activity.
  - reference_id: PMID:15792812
    supporting_text: >-
      The protease-processed Ppn1 has been purified 3800-fold to homogeneity and
      the protease cleavage sites determined.
- description: >-
    Growth-condition-dependent exopolyphosphatase that releases orthophosphate
    from the ends of polyphosphate chains.
  molecular_function:
    id: GO:0004309
    label: exopolyphosphatase activity
  directly_involved_in:
  - id: GO:0006798
    label: polyphosphate catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0000324
    label: fungal-type vacuole
  supported_by:
  - reference_id: PMID:17009950
    supporting_text: >-
      It has been shown that the high molecular mass exopolyphosphatase
      localized in cytosol of the yeast Saccharomyces cerevisiae is encoded by
      the PPN1 gene.
  - reference_id: PMID:31175919
    supporting_text: >-
      Ppx1 and Ppn1 exhibited high and Ddp1 and Ppn2 low exopolyphosphatase
      activity: 240, 500, 0.05 and 0.1 U/mg protein, respectively.
suggested_questions:
- question: >-
    Does Ppn1 protein itself enter the nucleus under stationary-to-active growth
    transitions, or does the PPN1 mutant eliminate nuclear exopolyphosphatase
    activity indirectly?
- question: >-
    Which cation and metabolite conditions switch native vacuolar and cytosolic
    Ppn1 between endo- and exopolyphosphatase modes in vivo?
suggested_experiments:
- description: >-
    Use endogenously tagged Ppn1, nuclear fractionation controls, and a
    catalytically inactive Ppn1 mutant through the stationary-to-budding shift to
    test whether the nuclear exopolyphosphatase activity is carried by Ppn1
    itself.
- description: >-
    Quantify polyphosphate chain-length distributions in vacuole-enriched and
    cytosolic fractions of ppn1, ppn2, ppx1 and ddp1 mutant combinations across
    Mg2+, Co2+, phosphate and glucose shifts to connect the purified Ppn1
    activity switch with in vivo flux.
