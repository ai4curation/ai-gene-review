descriptions:
- source: UniProt
  text: Catalyzes the hydrolysis of glutamine to glutamate and ammonia as part of
    the biosynthesis of pyridoxal 5'-phosphate. The resulting ammonia molecule is
    channeled to the active site of a SNZ isoform.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53823
  source_id: P53823
- source: Alliance_Imported
  text: Protein of unknown function; nearly identical to Sno3p; expression is induced
    before the diauxic shift and also in the absence of thiamin
  source_type: curated
  url: https://www.yeastgenome.org/locus/SNO2
  source_id: SGD:S000005278
- source: Alliance_Automated
  text: Predicted to enable pyridoxal 5'-phosphate synthase (glutamine hydrolysing)
    activity. Predicted to contribute to glutaminase activity. Predicted to be involved
    in pyridoxal 5'-phosphate biosynthetic process and pyridoxine metabolic process.
    Predicted to be part of glutaminase complex.
  source_type: automated
