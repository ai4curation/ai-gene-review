suggested_questions:
- question: Does Agp2 itself translocate L-carnitine or polyamines, or is it a non-transporting transceptor
    that signals to induce HNM1, DUR3 and SAM3?
- question: Which signalling pathway and transcription factors link Agp2 at the plasma membrane to expression
    of its target transporter genes?
suggested_experiments:
- description: Express AGP2 in an hnm1 dur3 sam3 background (or heterologously in Xenopus oocytes or proteoliposomes)
    and measure radiolabelled L-carnitine and spermidine uptake to test for direct transport.
