id: P38090
gene_symbol: AGP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: AGP2 (YBR132C) encodes a plasma-membrane protein of the yeast amino acid permease (APC) family
  with 12 predicted transmembrane segments. It was identified as required for high-affinity uptake of
  L-carnitine (supplying the carnitine shuttle for peroxisome-to-mitochondria acetyl transfer) and of
  polyamines, and has been described as a low-affinity, broad-specificity amino acid permease. Later work
  showed that agp2 mutants have reduced expression of other transporter genes, including the polyamine
  permeases DUR3 and SAM3 and the choline permease HNM1, which carries a substantial part of L-carnitine
  uptake; Agp2 is therefore thought to act largely as a plasma-membrane regulator (possibly a transceptor-like
  sensor) of polyamine and carnitine uptake, although a direct transport contribution is not excluded.
  Agp2 is removed from the plasma membrane to the vacuole by endocytosis upon nitrogen starvation.
