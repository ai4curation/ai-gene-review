gene_symbol: AGP2
organism: yeast
uniprot_id: P38090
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: General amino acid permease with broad substrate specificity. Can also transport
    carnitine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38090
  source_id: P38090
- source: Alliance_Imported
  text: Plasma membrane regulator of high affinity polyamine and carnitine transport;
    has similarity to transporters but lacks transport activity; may act as a sensor
    that transduces environmental signals; has a positive or negative regulatory effect
    on transcription of many transporter genes; null mutant is cycloheximide (CHX)
    resistant; ubiquitinated Agp2p is rapidly degraded in a Brp1p-dependent manner
    in the presence of CHX; localizes to the plasma membrane, the vacuolar membrane
    and the ER membrane
  source_type: curated
  url: https://www.yeastgenome.org/locus/AGP2
  source_id: SGD:S000000336
- source: Alliance_Automated
  text: Predicted to enable amino acid transmembrane transporter activity. Involved
    in positive regulation of (R)-carnitine transmembrane transport and positive regulation
    of polyamine transmembrane transport. Located in endoplasmic reticulum membrane;
    fungal-type vacuole membrane; and plasma membrane. Human ortholog(s) of this gene
    implicated in retinitis pigmentosa 68. Orthologous to human SLC7A14 (solute carrier
    family 7 member 14).
  source_type: automated
  url: https://www.yeastgenome.org/locus/AGP2
  source_id: SGD:S000000336
