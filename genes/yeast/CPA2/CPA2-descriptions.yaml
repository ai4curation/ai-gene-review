  text: Enables carbamoyl-phosphate synthase (ammonia) activity and carbamoyl-phosphate
    synthase (glutamine-hydrolyzing) activity. Involved in L-arginine biosynthetic
    process and pyrimidine nucleotide biosynthetic process. Located in cytoplasm.
    Part of carbamoyl-phosphate synthase complex. Human ortholog(s) of this gene implicated
    in carbamoyl phosphate synthetase I deficiency disease; persistent fetal circulation
    syndrome; and vascular disease. Orthologous to human CPS1 (carbamoyl-phosphate
    synthase 1).
