descriptions:
- source: UniProt
  text: Large subunit of the arginine-specific carbamoyl phosphate synthase (CPSase).
    CPSase catalyzes the formation of carbamoyl phosphate from the ammonia moiety
    of glutamine, hydrogencarbonate, and phosphate donated by ATP, constituting the
    first step of 2 biosynthetic pathways, one leading to arginine and/or urea and
    the other to pyrimidine nucleotides. The large subunit (synthetase) binds the
    substrates ammonia (free or transferred from glutamine from the small subunit),
    hydrogencarbonate and ATP and carries out an ATP-coupled ligase reaction, activating
    hydrogencarbonate by forming carboxy phosphate which reacts with ammonia to form
    carbamoyl phosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P03965
  source_id: P03965
- source: Alliance_Imported
  text: Large subunit of carbamoyl phosphate synthetase; carbamoyl phosphate synthetase
    catalyzes a step in the synthesis of citrulline, an arginine precursor
  source_type: curated
  url: https://www.yeastgenome.org/locus/CPA2
  source_id: SGD:S000003870
- source: Alliance_Automated
  text: Enables carbamoyl-phosphate synthase (ammonia) activity and carbamoyl-phosphate
    synthase (glutamine-hydrolyzing) activity. Involved in L-arginine biosynthetic
    process and pyrimidine nucleotide biosynthetic process. Located in cytoplasm.
    Part of carbamoyl-phosphate synthase complex. Human ortholog(s) of this gene implicated
    in carbamoyl phosphate synthetase I deficiency disease; persistent fetal circulation
    syndrome; and vascular disease. Orthologous to human CPS1 (carbamoyl-phosphate
    synthase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CPA2
  source_id: SGD:S000003870
