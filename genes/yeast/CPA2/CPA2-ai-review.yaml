core_functions:
- description: Large (CarB-type, synthetase) subunit of the cytosolic arginine-specific carbamoyl-phosphate
    synthetase (CPSase A). Using two ATP-grasp domains, Cpa2p phosphorylates bicarbonate, condenses carboxyphosphate
    with ammonia (free, or delivered from glutamine by Cpa1p) and phosphorylates carbamate to carbamoyl
    phosphate, which ornithine carbamoyltransferase (ARG3) uses to make citrulline in arginine biosynthesis.
  molecular_function:
