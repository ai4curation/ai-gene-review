id: P03965
gene_symbol: CPA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Large (synthetase, CarB-family) subunit of the arginine-specific carbamoyl-phosphate synthetase
  (CPSase A) of Saccharomyces cerevisiae. Cpa2p contains two ATP-grasp domains and a C-terminal MGS-like
  domain required for catalysis; it binds bicarbonate, two Mg-ATP and ammonia and synthesises carbamoyl
  phosphate. Alone it uses free ammonia (EC 6.3.4.16); in the cytosolic heterodimer with the glutaminase
  subunit Cpa1p it uses ammonia derived from glutamine (EC 6.3.5.5). The product is used by ornithine
  carbamoyltransferase (ARG3) to form citrulline in arginine biosynthesis; carbamoyl phosphate from CPSase
  A also enters a cellular pool shared with the pyrimidine-specific CPSase of URA2.
