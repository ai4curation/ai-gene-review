  label: Saccharomyces cerevisiae S288C
description: Mitochondrial homoaconitase (homoaconitate hydratase, EC 4.2.1.36) of Saccharomyces cerevisiae,
  a member of the aconitase/isopropylmalate isomerase family with a [4Fe-4S] cluster. Lys4 catalyses the
  reversible hydration of cis-homoaconitate to (2R,3S)-homoisocitrate in the alpha-aminoadipate pathway
  of lysine biosynthesis. Purified Lys4 does not act on homocitrate; the preceding dehydration of homocitrate
  to cis-homoaconitate is carried out by the mitochondrial aconitase paralog Aco2, which in yeast contributes
  specifically to lysine biosynthesis, so the homocitrate-to-homoisocitrate isomerisation needs two aconitase-family
  enzymes. Lys4 is in mitochondria, with the downstream homoisocitrate dehydrogenase Lys12, and lys4 mutants
  are lysine auxotrophs.
