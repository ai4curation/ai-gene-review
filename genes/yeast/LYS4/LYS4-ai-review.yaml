- id: file:yeast/LYS4/LYS4-deep-research-sgd.md
  title: SGD gene description for LYS4 (yeast)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: SGD curated description (uncited, undated). Checked claims. Homoaconitase acting in lysine
      biosynthesis holds. The statement that Lys4 converts homocitrate to homoisocitrate is outdated;
      purified yeast homoaconitase only interconverts cis-homoaconitate and homoisocitrate, and the homocitrate
      dehydration is done by the aconitase Aco2 (PMID:23106124). Recorded as an outdated statement. The
      review already follows the newer finding.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: SGD
      record: SGD:S000002642
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: Homoaconitase; catalyzes the conversion of homocitrate to homoisocitrate, which is
        a step in the lysine biosynthesis pathway
      confidence: CONFIRMED
      explanation: The SGD description says Lys4 "catalyzes the conversion of homocitrate to homoisocitrate".
        Fazius et al. 2012 (PMID:23106124) showed that the S. cerevisiae homoaconitase only catalyses the
        interconversion of cis-homoaconitate and homoisocitrate; the preceding dehydration of homocitrate
        to cis-homoaconitate is carried out by the aconitase Aco2, which in yeast contributes specifically
        to lysine biosynthesis. The description should say that Lys4 hydrates cis-homoaconitate to homoisocitrate,
        acting after Aco2 in the isomerisation of homocitrate.
      supported_by:
      - reference_id: PMID:23106124
        supporting_text: these enzymes only catalysed the interconversion between homoaconitate and homoisocitrate.
          In contrast, aconitases from fungi and the thermophilic bacterium Thermus thermophilus converted
          homocitrate to homoaconitate.
      - reference_id: PMID:23106124
        supporting_text: Aco2p specifically and exclusively contributes to lysine biosynthesis
