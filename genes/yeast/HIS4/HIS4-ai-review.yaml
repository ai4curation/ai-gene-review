id: P00815
gene_symbol: HIS4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Histidine biosynthesis trifunctional protein of Saccharomyces cerevisiae, encoded by the
  his4 gene cluster. A single ~95 kDa polypeptide (native homodimer) carries three active sites for three
  steps of L-histidine biosynthesis: an N-terminal phosphoribosyl-AMP cyclohydrolase (HisI-like, EC 3.5.4.19)
  domain, a phosphoribosyl-ATP pyrophosphohydrolase (HisE-like, EC 3.6.1.31) domain, and a C-terminal
  zinc-dependent, NAD+-dependent histidinol dehydrogenase (HisD-like, EC 1.1.1.23) domain that performs
  the final two-step oxidation of L-histidinol via L-histidinal to L-histidine. It is a cytosolic enzyme
  and is transcriptionally induced by amino acid and purine starvation through GCN4. his4 mutants are
  histidine auxotrophs.'
