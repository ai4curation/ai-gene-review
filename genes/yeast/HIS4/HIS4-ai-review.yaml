  review:
    summary: PAINT phylogenetic inference placing L-histidine biosynthesis at the ancestral node of this
      enzyme family; the yeast gene sits squarely within the clade and has its own experimental support.
      HIS4 catalyses steps 2, 3 and 9/10 (PR-ATP pyrophosphohydrolase, PR-AMP cyclohydrolase, histidinol
      dehydrogenase) of the pathway, so this is the core biological process.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:379004
      supporting_text: All this evidence shows that the product of the his4 region is a trifunctional,
        95,000-dalton protein.
    - reference_id: PMID:14190241
      supporting_text: Each of the histidine mutants of Saccharomyces cerevisiae has been correlated with
        a particular step in histidine biosynthesis
