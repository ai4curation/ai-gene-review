- term:
    id: GO:0008198
    label: ferrous iron binding
  evidence_type: IDA
  original_reference_id: PMID:22367199
  qualifier: enables
  review:
    summary: Thakur et al. purified recombinant Jjj3 from iron-supplemented E. coli and showed it binds
      iron like human Dph4, through the cysteines of the CSL domain.
    action: KEEP_AS_NON_CORE
    reason: Direct biochemical evidence on the yeast protein, so the annotation stands. However Dong et
      al. (2014) found that recombinant Dph4/Jjj3 did not readily bind iron and could not act as electron
      donor to Dph1-Dph2, so the physiological significance of iron binding for diphthamide synthesis
      is unresolved; kept as non-core rather than as the defining activity.
    supported_by:
    - reference_id: PMID:22367199
      supporting_text: "Yeast Jjj3, a functional ortholog of human Dph4 also shows a similar \niron-binding\
        \ property"
    - reference_id: PMID:24422557
      supporting_text: |-
        our studies
        suggest that Dph4 does not readily bind iron and thus is unlikely
        to be an electron donor for Dph1-Dph2
