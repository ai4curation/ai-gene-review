core_functions:
- description: 'Required, together with Dph1, Dph2 and Dph3, for the first step of diphthamide synthesis
    on eEF2 (ACP transfer from SAM). Its molecular contribution is unknown: the CSL domain binds metal
    and is needed for toxin sensitivity, but Jjj3 is not the electron donor (that is Dph3), so no molecular
    function is asserted.'
