id: P47138
gene_symbol: JJJ3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: JJJ3 (DPH4) encodes a small type III J-domain protein (DnaJ-like co-chaperone) that also
  carries a C-terminal CSL-type zinc-finger (DPH-type metal-binding) domain, the same domain that forms
  the whole of Dph3/KTI11. It is required for the first step of diphthamide biosynthesis on translation
  elongation factor 2 (eEF2), the transfer of a 3-amino-3-carboxypropyl group from S-adenosylmethionine
  to His699, which is catalysed by the Dph1-Dph2 [4Fe-4S] enzyme with Dph3 as electron donor. jjj3 null
  mutants lack diphthamide and are resistant to diphtheria toxin and sordarin, and the CSL domain rather
  than the J-domain is the part needed for toxin sensitivity. Recombinant Jjj3, like its human ortholog
  DNAJC24, can be isolated in an iron-bound form, but whether it delivers iron or electrons, acts as an
  Hsp70 co-chaperone for Dph1-Dph2 assembly, or does something else is unresolved. GFP tagging places
  it in the cytoplasm and nucleus.
