suggested_questions:
- question: Does Jjj3 act as an Hsp70 (Ssa/Ssb) co-chaperone for folding or assembly of the Dph1-Dph2
    heterodimer, or as a metal donor for its clusters, and is its J-domain needed in vivo under any condition?
suggested_experiments:
- hypothesis: Jjj3 is needed for Fe-S cluster loading or stability of Dph1-Dph2 in vivo
  description: Measure 55Fe incorporation and cluster EPR signals of Dph1-Dph2 purified from wild-type
    versus jjj3 cells, and test whether the J-domain HPD mutant and CSL cysteine mutants complement diphthamide
    formation (Rh-NAD/DT labelling of eEF2).
  experiment_type: in vivo iron labelling / complementation
