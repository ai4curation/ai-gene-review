descriptions:
- source: UniProt
  text: Required for the first step of diphthamide biosynthesis, the transfer of 3-amino-3-carboxypropyl
    from S-adenosyl-L-methionine to a histidine residue. Diphthamide is a post-translational
    modification of histidine which occurs in elongation factor 2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47138
  source_id: P47138
- source: Alliance_Imported
  text: Iron-binding protein; involved in targeting cytoplasmic SRP-independent proteins
    to the ER; contains a CSL Zn finger and a DnaJ-domain; involved in diphthamide
    biosynthesis; ortholog human Dph4
  source_type: curated
  url: https://www.yeastgenome.org/locus/JJJ3
  source_id: SGD:S000003858
- source: Alliance_Automated
  text: Enables ferrous iron binding activity. Involved in protein histidyl modification
    to diphthamide. Located in cytoplasm and nucleus. Orthologous to human DNAJC24
    (DnaJ heat shock protein family (Hsp40) member C24).
  source_type: automated
