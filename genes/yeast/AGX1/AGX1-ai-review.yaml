    summary: IBA from PANTHER PTN000475663 (AGXT/SPT clade; human AGXT P21549, rat Agxt, Arabidopsis AGT1)
      for L-serine:pyruvate transaminase activity. The vertebrate and plant donors are bifunctional alanine:glyoxylate
      / serine:pyruvate aminotransferases.
    action: MARK_AS_OVER_ANNOTATED
    reason: Yeast Agx1 is reported to be highly specific for its amino donor (alanine) and acceptor (glyoxylate)
      substrates, which is target-specific evidence against inheriting the serine:pyruvate activity. Full
      text with the substrate panel is not cached, so this is flagged rather than removed.
