core_functions:
- description: PLP-dependent transamination of glyoxylate with L-alanine to glycine and pyruvate (EC 2.6.1.44);
    the glycine-forming step of the glyoxylate (gluconeogenic) route, important on non-fermentable carbon
    sources.
