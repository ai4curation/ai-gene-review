suggested_questions:
- question: 'Where is Agx1 active: the mitochondrial matrix (three organellar proteomes) or the cytosol
    (N-terminal SWAT-GFP)? A C-terminally tagged or immunolocalization study would settle it.'
- question: Does yeast Agx1 have any serine:pyruvate transaminase activity, as the PANTHER IBA implies
    for the AGXT clade?
suggested_experiments:
- description: Localize C-terminally tagged Agx1 under glucose and ethanol growth and fractionate mitochondria
    with protease protection.
- description: Measure purified Agx1 activity with L-serine/pyruvate versus L-alanine/glyoxylate.
