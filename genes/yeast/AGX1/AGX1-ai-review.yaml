taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: AGX1 (YFL030W) encodes alanine:glyoxylate aminotransferase, a pyridoxal 5'-phosphate-dependent
  fold-type I (class V) aminotransferase that transfers the amino group of L-alanine to glyoxylate, forming
  glycine and pyruvate. It is a homodimer, structurally similar to human AGXT, and reported to be highly
  specific for alanine and glyoxylate. Agx1 provides one of three routes of glycine synthesis in yeast,
  with threonine aldolase (GLY1) and serine hydroxymethyltransferases (SHM1, SHM2). It becomes essential
  for glycine synthesis in gly1 shm1 shm2 cells growing on non-fermentable carbon sources, where glyoxylate
  is available from the glyoxylate cycle. Agx1 is a low-abundance protein detected both in mitochondrial
  proteomes and in the cytosol; its compartment is not firmly established.
