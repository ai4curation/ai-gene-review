        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human AGXT is bifunctional, but yeast Agx1 is described as highly specific for alanine
          and glyoxylate, so the serine:pyruvate activity of the node is not evidently inherited by the
          fungal member.
