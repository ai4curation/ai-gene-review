- source: Alliance_Automated
  text: Enables L-alanine:glyoxylate transaminase activity. Involved in glycine biosynthetic
    process. Located in cytosol and mitochondrion. Used to study primary hyperoxaluria.
    Human ortholog(s) of this gene implicated in kidney disease and primary hyperoxaluria
    type 1. Orthologous to human AGXT (alanine--glyoxylate aminotransferase).
