  text: Alanine:glyoxylate aminotransferase (AGT); catalyzes the synthesis of glycine
    from glyoxylate, which is one of three pathways for glycine biosynthesis in yeast;
    similar to mammalian and plant alanine:glyoxylate aminotransferases; human homolog
    AGXT complements yeast null mutant
  source_type: curated
