gene_symbol: ODC2
organism: yeast
uniprot_id: Q99297
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Transports C5-C7 oxodicarboxylates across the inner membranes of mitochondria.
    Can transport 2-oxoadipate, 2-oxoglutarate, adipate, glutarate, 2-oxopimelate,
    oxaloacetate, citrate and malate. The main physiological role is probably to supply
    2-oxoadipate and 2- oxoglutarate from the mitochondrial matrix to the cytosol
    where they are used in the biosynthesis of lysine and glutamate, respectively,
    and in lysine catabolism.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q99297
  source_id: Q99297
- source: Alliance_Imported
  text: Mitochondrial inner membrane transporter; 2-oxodicarboxylate transporter,
    exports 2-oxoadipate and 2-oxoglutarate from the mitochondrial matrix to the cytosol
    for use in lysine and glutamate biosynthesis and in lysine catabolism; ODC2 has
    a paralog, ODC1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ODC2
  source_id: SGD:S000005748
- source: Alliance_Automated
  text: Enables dicarboxylic acid transmembrane transporter activity. Involved in
    mitochondrial transport. Located in mitochondrial inner membrane. Human ortholog(s)
    of this gene implicated in mitochondrial DNA depletion syndrome 18. Orthologous
    to human SLC25A21 (solute carrier family 25 member 21).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ODC2
  source_id: SGD:S000005748
