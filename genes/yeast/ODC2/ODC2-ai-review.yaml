core_functions:
- description: Counter-exchange of 2-oxoadipate and 2-oxoglutarate (also adipate, glutarate) across the
    mitochondrial inner membrane, exporting matrix-made 2-oxoadipate for cytosolic lysine biosynthesis
    and 2-oxoglutarate for glutamate synthesis; redundant with ODC1.
  molecular_function:
    id: GO:0005310
    label: dicarboxylic acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:1990551
    label: mitochondrial 2-oxoadipate transmembrane transport
  - id: GO:1990550
    label: mitochondrial alpha-ketoglutarate transmembrane transport
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:11013234
    supporting_text: We have localized two hitherto unidentified family members, Odc1p and Odc2p, to the
      inner membranes of mitochondria.
  - reference_id: PMID:11013234
    supporting_text: we have shown in reconstituted liposomes that they transport the oxodicarboxylates
      2-oxoadipate and 2-oxoglutarate by a strict counter exchange mechanism
  - reference_id: PMID:11013234
    supporting_text: The main physiological roles of Odc1p and Odc2p are probably to supply 2-oxoadipate
      and 2-oxoglutarate from the mitochondrial matrix to the cytosol where they are used in the biosynthesis
      of lysine and glutamate, respectively, and in lysine catabolism.
suggested_questions:
- question: Do odc1 odc2 double mutants show a lysine requirement or reduced cytosolic 2-oxoadipate, i.e.
    is ODC-mediated export the only route for 2-oxoadipate out of the matrix?
- question: Should GO add a specific '2-oxoadipate transmembrane transporter activity' (or 2-oxoadipate:2-oxoglutarate
    antiporter) MF term, given that GO:1990551 already exists for the process?
suggested_experiments:
- description: Measure lysine prototrophy and 13C-labelled 2-oxoadipate partitioning between matrix and
    cytosol in odc1, odc2 and odc1 odc2 strains on glucose and on non-fermentable carbon sources.
