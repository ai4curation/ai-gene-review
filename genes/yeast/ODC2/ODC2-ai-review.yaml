taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ODC2 is one of two isoforms (with ODC1; 61% identical) of the mitochondrial 2-oxodicarboxylate
  carrier of

  Saccharomyces cerevisiae, a member of the mitochondrial carrier (SLC25) family located in the inner

  mitochondrial membrane. Reconstituted in liposomes, Odc1p and Odc2p transport 2-oxoadipate and

  2-oxoglutarate by strict counter-exchange, and also accept adipate, glutarate and, less efficiently,

  malate and citrate. Their main physiological role is probably to export 2-oxoadipate, made in the matrix

  by the mitochondrial steps of the alpha-aminoadipate pathway, to the cytosol for lysine biosynthesis,

  and to export 2-oxoglutarate for cytosolic glutamate synthesis (and to handle 2-oxoadipate in lysine

  catabolism). Odc2p is the less abundant isoform.'
