- description: 'GTP cyclohydrolase I: hydrolytic ring opening of GTP and release of formate to give 7,8-dihydroneopterin
    3''-triphosphate, the first committed step of the pterin branch of de novo tetrahydrofolate biosynthesis, in
    the cytoplasm.'
