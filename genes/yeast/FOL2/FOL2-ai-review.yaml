  label: Saccharomyces cerevisiae S288C
description: FOL2 encodes GTP cyclohydrolase I (EC 3.5.4.16), which converts GTP to 7,8-dihydroneopterin 3'-triphosphate
  and formate. This is the first committed step of the pterin branch of de novo folate biosynthesis, whose product
  is then processed to the pterin substrate of the trifunctional Fol1p. The 243-residue protein is highly conserved
  with GTP cyclohydrolase I from bacteria to humans and, like its orthologs, is predicted to be a zinc-dependent
  enzyme. A fol2 knockout has no detectable GTP cyclohydrolase I activity and a recessive conditional lethality
  due to folinic acid auxotrophy. Fol2p is a soluble protein seen in the cytoplasm, with a nuclear pool in GFP and
  proximity-labelling surveys. In animals the same enzyme also starts tetrahydrobiopterin synthesis, but no such
  pathway has been established in budding yeast.
