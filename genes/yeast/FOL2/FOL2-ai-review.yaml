    label: tetrahydrobiopterin biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003162
  - PANTHER:PTN000121833
  - UniProtKB:P30793
  - UniProtKB:P50141
  - WB:WBGene00000298
  - dictyBase:DDB_G0288481
  review:
    summary: 'IBA from PTN000121833, seeded by animal GCH1 orthologs (Drosophila Punch, mouse/rat GCH1, C. elegans
      cat-4, Dictyostelium) that feed tetrahydrobiopterin synthesis. GTP cyclohydrolase I is the first step of both
      BH4 and folate synthesis, but S. cerevisiae has no reported BH4 pathway: no 6-pyruvoyl-tetrahydropterin synthase
      or sepiapterin reductase has been characterised, and the fol2 null phenotype (folinic acid auxotrophy) reflects
      only the folate branch.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Pathway present in animal seed genes but not established in budding yeast; the yeast product feeds folate
      synthesis.
    supported_by:
    - reference_id: PMID:8573145
      supporting_text: GTP-cyclohydrolase I is the first enzyme in the biosynthetic pathway leading to folic acid
        and tetrahydrobiopterin.
    - *id003
    propagation_review:
