suggested_questions:
- question: Does S. cerevisiae make any tetrahydrobiopterin or other unconjugated pterins from Fol2p product, and
    if not, how is the dihydroneopterin triphosphate dephosphorylated before Fol1p (which phosphatase)?
- question: Is Fol2p feedback-regulated (as by GFRP in mammals) by folate status?
suggested_experiments:
- hypothesis: All Fol2p product in yeast is channelled to folate
  description: LC-MS profiling of pterins (neopterin, biopterin, tetrahydrobiopterin) in wild-type, fol2 and fol1
    strains grown with folinic acid, and screening phosphatase mutants for accumulation of dihydroneopterin triphosphate.
  experiment_type: metabolomics
