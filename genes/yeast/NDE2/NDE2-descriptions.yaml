gene_symbol: NDE2
organism: yeast
uniprot_id: Q07500
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: External NADH dehydrogenase required for optimum cellular growth with a number
    of nonfermentable carbon sources, including ethanol. With NDE1, performes the
    mitochondrial oxidation of cytosolic NADH under these growth conditions. Regulates
    the mitochondrial glycerol-3-phosphate dehydrogenase, GUT2, also involved in cytosolic
    NADH oxidation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07500
  source_id: Q07500
- source: Alliance_Imported
  text: Mitochondrial external NADH dehydrogenase; catalyzes the oxidation of cytosolic
    NADH; Nde1p and Nde2p are involved in providing the cytosolic NADH to the mitochondrial
    respiratory chain; NDE2 has a paralog, NDE1, that arose from the whole genome
    duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/NDE2
  source_id: SGD:S000002243
- source: Alliance_Automated
  text: Predicted to enable NADH dehydrogenase activity. Involved in pyruvate fermentation
    to ethanol. Located in mitochondrion.
  source_type: automated
  url: https://www.yeastgenome.org/locus/NDE2
  source_id: SGD:S000002243
