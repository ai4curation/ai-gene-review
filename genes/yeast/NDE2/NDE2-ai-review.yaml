  label: Saccharomyces cerevisiae S288C
description: 'NDE2 encodes the minor external type-II NADH:ubiquinone oxidoreductase (NDH-2, EC 1.6.5.9)
  of S. cerevisiae mitochondria, a paralog of NDE1 from the whole-genome duplication. Like Nde1p it is
  a single-subunit flavoprotein on the intermembrane-space face of the inner membrane that oxidises cytosolic
  NADH and reduces ubiquinone without proton pumping. Its contribution is detectable only genetically:
  an nde2 single mutant has normal mitochondrial NADH oxidation, but NADH-dependent respiration is completely
  abolished in the nde1 nde2 double mutant, which grows more slowly on ethanol and galactose. Nde2p co-purifies
  with Nde1p, Ndi1p and other intermembrane-space-facing dehydrogenases in a supramolecular assembly.'
