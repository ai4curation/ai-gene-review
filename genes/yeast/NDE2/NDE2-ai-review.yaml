suggested_questions:
- question: Under which growth conditions (if any) does Nde2p make a quantitatively significant contribution
    to cytosolic NADH oxidation, given that the nde2 single mutant has no detectable phenotype?
suggested_experiments:
- description: Measure NADH-dependent respiration and Nde2p abundance in nde1 mutants across carbon sources
    and growth phases to define when the minor paralog is expressed and active.
