- term:
    id: GO:0180020
    label: membrane bending activity
  evidence_type: IDA
  original_reference_id: PMID:24567361
  qualifier: enables
  review:
    summary: Purified Mvp1 bends PI3P-containing liposomes into tubules and small vesicles in two independent
      laboratories (PMID:24567361, PMID:32198400). Mutants that cannot bind or tubulate membranes, or cannot
      dimerize, fail to sort CPY or Vps55 in vivo (PMID:32198400, PMID:34524084).
    action: NEW
    reason: Mvp1 is a SNX-BAR whose BAR homodimer deforms membranes. The activity is measured directly on
      purified protein and is needed for function in cells, so it is the evolved molecular function, not
      an incidental in vitro property. GOA has no molecular-function row for this activity (only PI3P and
      phosphatidylinositol binding). GO:0180020 is defined as bending or deforming a membrane.
    additional_reference_ids:
    - PMID:32198400
    - PMID:34524084
    supported_by:
    - reference_id: PMID:24567361
      supporting_text: Membrane tubules were observed in reactions containing 10 µM and 20 µM Mvp1, but not
        in reactions without Mvp1 (Fig. 4 A)
    - reference_id: PMID:32198400
      supporting_text: Mvp1 also deformed liposomes into tubules with mean and median diameters of 49.8 (±13.4)
        nm and 48 nm
