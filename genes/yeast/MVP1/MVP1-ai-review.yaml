- id: file:yeast/MVP1/MVP1-uniprot.txt
  title: UniProt entry P40959 (MVP1_YEAST)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated FUNCTION, SUBUNIT, SUBCELLULAR LOCATION and DOMAIN comments agree with the cited
      papers. The FUNCTION comment describes Mvp1 only as part of the retromer pathway and does not yet mention
      the retromer-independent Vps55 pathway or the Vps1 binding reported in PMID:34524084.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P40959
      slot: CC:FUNCTION
      requested_change: ADD
      asserted_value: UniProtKB:P40959
      confidence: PROBABLE
      explanation: The FUNCTION comment says Mvp1 is a component of the retromer-mediated endosome-to-Golgi
        pathway (PubMed:24567361, PubMed:27883263). Suzuki et al. 2021 (PubMed:34524084) showed that Mvp1
        is the coat for a retromer- and Snx4-independent recycling pathway for Vps55, binds the dynamin-like
        GTPase Vps1 directly in vitro, and is needed for its recruitment in cells lacking retromer and Snx4;
        Kölling 2026 (PubMed:41883240) showed that Vps68 recycling needs both Mvp1 and retromer. The comment
        could add the retromer-independent pathway and its cargo.
      supported_by:
      - reference_id: PMID:34524084
        supporting_text: 'This study reveals that yeast has three major SNX-BAR endosomal recycling pathways:
          retromer, Snx4, and Mvp1.'
      - reference_id: PMID:34524084
        supporting_text: Mvp1 coprecipitated with Vps1-GFP, but not with GFP, suggesting that Mvp1 directly
          binds to Vps1 (Figure 4M).
