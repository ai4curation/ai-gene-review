- id: file:yeast/MVP1/MVP1-notes.md
  title: MVP1 curation notes
  findings: []
core_functions:
- description: Mvp1 is a membrane-bending SNX-BAR coat on the cytosolic face of endosomes. Its BAR homodimer
    shapes PI3P-rich endosomal membrane into narrow tubules that carry recycling cargo, chiefly the Vps55-Vps68
    complex, and it cooperates with retromer for Vps68 and Nhx1. The Mvp1-coated tubules are cut by the
    dynamin-related GTPase Vps1, whose endosomal association Mvp1 promotes, and the resulting carriers return
    their cargo to the trans-Golgi network. In the cytosol Mvp1 is held as an autoinhibited tetramer.
  molecular_function:
    id: GO:0180020
    label: membrane bending activity
  directly_involved_in:
  - id: GO:0097750
    label: endosome membrane tubulation
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  locations:
  - id: GO:0010008
    label: endosome membrane
  supported_by:
  - reference_id: PMID:24567361
    supporting_text: Membrane tubules were observed in reactions containing 10 µM and 20 µM Mvp1, but not
      in reactions without Mvp1 (Fig. 4 A)
  - reference_id: PMID:32198400
    supporting_text: Mvp1 also deformed liposomes into tubules with mean and median diameters of 49.8 (±13.4)
      nm and 48 nm
  - reference_id: PMID:34524084
    supporting_text: The BAR domain of Mvp1 deforms the endosomal membrane to form cargo-containing tubule-like
      structures.
  - reference_id: PMID:34524084
    supporting_text: Strikingly, Vps55-GFP accumulated on the vacuole membrane in mvp1Δ cells (Figure 1E and
      F).
  - reference_id: PMID:41883240
    supporting_text: From this, we conclude that Vps68 recycling depends on both Mvp1 and retromer.
  knowledge_gaps:
  - gap_statement: Whether Mvp1 recruits Vps1 to endosomal tubules by binding it directly, by generating
      the narrow membrane curvature that Vps1 prefers, or both, is unresolved. One study found no Mvp1-Vps1
      binding and an Mvp1-promoted but indirect recruitment; another found direct binding of the purified
      proteins and normal endosomal Vps1 in mvp1Δ cells, with Vps1 lost from endosomes only when retromer
      and Snx4 are also absent.
    boundary: Established - Mvp1 and Vps1 interact genetically and colocalize on endosomes; Mvp1-coated tubules
      exist; Vps1 is needed for their fission and for cargo export; Mvp1 oligomerization is needed for Vps1
      endosomal localization in the triple mutant. Not established - the binding interface, whether binding
      occurs on membranes in vivo, and how Vps1 is targeted to retromer- or Snx4-coated tubules.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: The recruitment mechanism determines whether Mvp1 is a dedicated fission adaptor for Vps1
      or a curvature generator whose geometry Vps1 recognises, which bears on how carriers from the three
      SNX-BAR pathways are cut.
    provenance:
    - reference_id: PMID:24567361
      supporting_text: These data indicate that Vps1 localizes to the endosome via an indirect mechanism that
        is promoted by, but is not entirely dependent upon, Mvp1.
    - reference_id: PMID:24567361
      supporting_text: we have never observed binding of these proteins in solution or on a membrane
    - reference_id: PMID:34524084
      supporting_text: Mvp1 coprecipitated with Vps1-GFP, but not with GFP, suggesting that Mvp1 directly
        binds to Vps1 (Figure 4M).
    - reference_id: PMID:34524084
      supporting_text: Future analysis will be necessary to characterize how Vps1 acts on retromer- and Snx4-mediated
        recycling tubules.
  - gap_statement: The factor that releases the autoinhibited Mvp1 tetramer on the endosome is unknown. The
      N-terminal region is needed both for tetramerization and for sorting in vivo, and may bind a partner
      that opens the tetramer, but no such partner has been identified.
    boundary: Established - full-length Mvp1 is a tetramer of two BAR homodimers with buried membrane-binding
      surfaces; N-terminal truncations are dimeric, bind membranes better, still tubulate liposomes, and
      fail to rescue CPY sorting.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: Regulated opening of the tetramer would control when and where Mvp1 coats form, and the
      same regulation may apply to human SNX8 and other SNX-BARs with long N-termini.
    provenance:
    - reference_id: PMID:32198400
      supporting_text: It is therefore likely that the N-terminus binds to a factor essential for sorting,
        which may assist in opening of the tetramer
    - reference_id: PMID:32198400
      supporting_text: However, Mvp1 Δ2-100 did not rescue the CPY trafficking defect in Δmvp1 cells as assessed
        by CPY secretion
- description: The PX domain of Mvp1 binds phosphatidylinositol 3-phosphate, which recruits the protein
    from the cytosol to endosome membranes; loss of PI3P synthesis or mutation of the PI3P-binding pocket
    (R172) releases Mvp1 from endosomes and abolishes its recycling function.
  molecular_function:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  directly_involved_in:
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  locations:
  - id: GO:0010008
    label: endosome membrane
  supported_by:
  - reference_id: PMID:32198400
    supporting_text: Our sedimentation assays show that full-length Mvp1 interacts with liposomes, but only
      in the presence of PI3P.
  - reference_id: PMID:24567361
    supporting_text: Localization to these puncta is disrupted by loss of the sole PI3K (vps34Δ) and by a
      mutation, R172A, in the PtdIns3P binding pocket of its PX domain, suggesting that Mvp1 localizes to
      PtdIns3P.
  - reference_id: PMID:34524084
    supporting_text: The R172E mutation severely impaired the endosomal localization of Mvp1 (Figure 2C).
  - reference_id: PMID:34524084
    supporting_text: When the R172E mutant was expressed in mvp1Δ cells, Vps55-GFP localized to the vacuole
      membrane (Figure 2D and E), indicating that the endosomal localization of Mvp1 is required for appropriate
      Vps55 localization.
suggested_questions:
- question: Is Mvp1 needed for retromer-dependent retrieval of Vps10, as Chi et al. (2014) and Sun et al.
    (2020) found, or not, as Suzuki et al. (2021) found? Could strain background or tag differences explain
    the discrepancy, and does it account for the different severities reported for the CPY secretion defect?
- question: Does Mvp1 bind Vps1 directly on membranes in vivo, and is that binding needed for fission of
    Mvp1-coated tubules?
- question: Does Mvp1 bind the YHTSDFM motif of Vps55 directly, and what part of Mvp1 recognises it, given
    that the co-immunoprecipitation could be bridged by Vps68 or another protein?
- question: Mvp1 vesiculates liposomes on its own in vitro and promotes Vps1-mediated fission in vivo. Does
    it do part of the work of endosome fission (GO:0140285), or only supply the curved substrate? In GO the
    fission term is carried by fission executors (Vps1, WASH, TMCC1, CORO1C, WIPI1) and by no SNX-BAR.
- question: The S. pombe mvp1 activity in the PomBase GO-CAM gomodel:6918f23700004102 is typed as GO:0140312
    cargo adaptor activity, which is defined by binding vesicle-coat scaffolds. Since Mvp1 is itself the
    coat and the membrane-bending protein, would GO:0180020 membrane bending activity, with has_input to
    the Vps55-Vps68 cargo, describe it better?
suggested_experiments:
- hypothesis: Mvp1 recruits Vps1 through a direct interaction that is needed for scission of Mvp1-coated
    tubules.
  description: Map the Mvp1-Vps1 binding interface with purified proteins (crosslinking mass spectrometry
    or HDX), make interface mutants, and test them in reconstituted fission of PI3P membrane tubules coated
    by Mvp1 alone or by Vps5-Vps17, and in Vps55-GFP recycling and Vps1 endosome recruitment in vivo.
  experiment_type: in vitro reconstitution and yeast genetics
- hypothesis: A partner bound by the Mvp1 N-terminus opens the autoinhibited tetramer on endosomes.
  description: Identify proteins bound by the Mvp1 N-terminal region by proximity labelling (TurboID fused
    at the N-terminus of endogenous Mvp1) in wild-type and vps34Δ cells, then test candidates for their effect
    on Mvp1 tetramer dissociation (SEC-MALS) and liposome binding.
  experiment_type: proteomics and biophysics
- hypothesis: Strain background explains the conflicting Vps10 retrieval phenotypes of mvp1Δ.
  description: Measure Vps10 Golgi and endosome distribution, Vps10 stability and CPY secretion side by side
    in BY4742 and W303 mvp1Δ strains, with endogenously tagged and untagged Vps10, using pulse-chase CPY
    sorting as the quantitative readout.
  experiment_type: yeast cell biology
