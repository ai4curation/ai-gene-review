id: P40959
gene_symbol: MVP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Mvp1 is a sorting nexin of the SNX-BAR subfamily in Saccharomyces cerevisiae and the homologue
  of human SNX8. It has an acidic, largely disordered N-terminal region, a PX domain that binds phosphatidylinositol
  3-phosphate (PI3P), and a C-terminal BAR domain. In the cytosol the full-length protein is an autoinhibited
  homotetramer, a dimer of BAR homodimers in which the concave membrane-binding surfaces and the PX lipid-binding
  pockets are buried; the N-terminal region is needed for this assembly. On PI3P-rich endosomal membranes
  Mvp1 acts as a homodimer that bends membranes into narrow tubules, and in vitro it also converts liposomes
  into small vesicles. Mvp1 coats tubules and vesicles that bud from endosomes, often together with the
  retromer SNX-BAR pair Vps5-Vps17, although it does not form a stable complex with retromer. These carriers
  return membrane proteins from endosomes to the trans-Golgi network before endosomes fuse with the vacuole.
  Mvp1 is the main sorting nexin for the Vps55-Vps68 complex, whose Vps55 subunit carries a sorting motif
  needed to associate with Mvp1, and it acts together with retromer for Vps68 and the Na+/H+ exchanger
  Nhx1; studies disagree on how much it contributes to retrieval of the CPY receptor Vps10. Mvp1 promotes
  the association of the dynamin-related GTPase Vps1 with endosomes and has been reported to bind it directly,
  so that Vps1 can cut the Mvp1-coated tubules into transport carriers. Cells lacking Mvp1 secrete part
  of their carboxypeptidase Y, and loss of Mvp1 together with retromer and Snx4 disrupts endosome function
  and growth at high temperature. One study reported a small nuclear pool and effects on RNA polymerase
  II transcription.
