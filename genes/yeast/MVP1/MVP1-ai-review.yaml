  review:
    summary: Immunocytochemistry of C-LYTAG-tagged Mvp1 gave mostly cytosolic staining with some nuclear
      signal; the study proposes a nuclear fraction that contacts the RNA polymerase II foot domain (PMID:21954159).
    action: MARK_AS_OVER_ANNOTATED
    reason: The full text was read. The nuclear signal is a minor fraction seen with one tag and one method
      (immunostaining, no fractionation), and the authors themselves note that GFP-tagged Mvp1 in the genome-wide
      collection is cytoplasmic. Later studies with endogenously GFP-tagged Mvp1 see cytosol and PI3P-dependent
      endosomal puncta, not nucleus (PMID:24567361, PMID:34524084). Mvp1 has no reported nuclear import signal,
      and the transcriptional phenotypes are indirect deletion effects. The observation is not shown to be
      wrong, but a nuclear location is not established for Mvp1 and should not be propagated.
    supported_by:
