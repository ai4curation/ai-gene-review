    overall_notes: 'Correct and cited: ThDP-dependent ketol transfer, with only the
      S7P + GAP reaction given. Does not mention the E4P supply for aromatic amino
      acids.'
- source: Alliance_Imported
  text: Transketolase; catalyzes conversion of xylulose-5-phosphate and ribose-5-phosphate
    to sedoheptulose-7-phosphate and glyceraldehyde-3-phosphate in the pentose phosphate
    pathway; needed for synthesis of aromatic amino acids; TKL1 has a paralog, TKL2,
    that arose from the whole genome duplication
