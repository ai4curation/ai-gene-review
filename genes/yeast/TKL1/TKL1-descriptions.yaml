gene_symbol: TKL1
organism: yeast
uniprot_id: P23254
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the transfer of a two-carbon ketol group from a ketose donor to
    an aldose acceptor, via a covalent intermediate with the cofactor thiamine pyrophosphate
    (PubMed:8521838). Thus, catalyzes the reversible transfer of a two-carbon ketol
    group from sedoheptulose- 7-phosphate to glyceraldehyde-3-phosphate, producing
    xylulose-5- phosphate and ribose-5-phosphate (PubMed:8521838).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23254
  source_id: P23254
- source: Alliance_Imported
  text: Transketolase; catalyzes conversion of xylulose-5-phosphate and ribose-5-phosphate
    to sedoheptulose-7-phosphate and glyceraldehyde-3-phosphate in the pentose phosphate
    pathway; needed for synthesis of aromatic amino acids; TKL1 has a paralog, TKL2,
    that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TKL1
  source_id: SGD:S000006278
- source: Alliance_Automated
  text: Enables transketolase activity. Involved in pentose-phosphate shunt. Predicted
    to be located in cytoplasm. Predicted to be active in cytosol. Human ortholog(s)
    of this gene implicated in congenital heart disease. Orthologous to human TKT
    (transketolase); TKTL1 (transketolase like 1); and TKTL2 (transketolase like 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TKL1
  source_id: SGD:S000006278
