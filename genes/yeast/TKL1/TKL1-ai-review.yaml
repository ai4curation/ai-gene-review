description: 'Tkl1 (YPR074C) is the major transketolase (EC 2.2.1.1) of Saccharomyces cerevisiae, a thiamine diphosphate-
  and divalent-cation-dependent homodimeric enzyme of the non-oxidative pentose phosphate pathway. It reversibly transfers
  a two-carbon ketol unit from a ketose donor (xylulose 5-phosphate, sedoheptulose 7-phosphate, fructose 6-phosphate) to an
  aldose acceptor, catalysing both transketolase steps of the pathway (S7P + GAP <-> R5P + X5P and F6P + GAP <-> E4P + X5P)
  and thereby connecting pentose phosphates with glycolytic intermediates. Tkl1 provides most cellular transketolase activity:
  tkl1 extracts have no detectable activity, and tkl1 cells grow poorly without aromatic amino acids because transketolase
  supplies erythrose 4-phosphate for the shikimate pathway; the tkl1 tkl2 double mutant is a strict aromatic amino acid auxotroph.
  Tkl1 is an abundant cytosolic protein and the yeast enzyme is a classic structural model for ThDP-dependent catalysis. It
  can associate with its minor paralog Tkl2.'
