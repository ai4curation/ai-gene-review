- description: Major cytosolic ThDP-dependent transketolase catalysing both reversible two-carbon ketol transfers of the non-oxidative
    pentose phosphate pathway, interconverting pentose phosphates with fructose 6-phosphate and glyceraldehyde 3-phosphate
    and supplying erythrose 4-phosphate for aromatic amino acid synthesis.
