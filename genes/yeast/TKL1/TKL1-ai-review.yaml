  - reference_id: PMID:7916691
    supporting_text: Double mutants for both genes, TKL1 and TKL2, are auxotrophic for aromatic amino acids, indicating a
      complete block in the transketolase activity.
suggested_questions:
- question: Does the Tkl1-Tkl2 heterodimer have catalytic properties distinct from the Tkl1 homodimer, and does it matter
    at the low cellular abundance of Tkl2?
suggested_experiments:
- description: Purify Tkl1 homodimer and Tkl1-Tkl2 heterodimer and compare kinetics with X5P/R5P and F6P/E4P substrate pairs.
