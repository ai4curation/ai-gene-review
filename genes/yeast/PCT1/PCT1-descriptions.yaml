descriptions:
- source: UniProt
  text: Catalyzes the key rate-limiting step in the CDP-choline pathway for phosphatidylcholine
    biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13259
  source_id: P13259
- source: Alliance_Imported
  text: Cholinephosphate cytidylyltransferase; a rate-determining enzyme of the CDP-choline
    pathway for phosphatidylcholine synthesis, inhibited by Sec14p, activated upon
    lipid-binding; controls phosphatidylcholine homeostasis; contains an element within
    the regulatory domain involved in both silencing and activation of enzymatic activity
  source_type: curated
  url: https://www.yeastgenome.org/locus/PCT1
  source_id: SGD:S000003434
- source: Alliance_Automated
  text: Enables choline-phosphate cytidylyltransferase activity. Involved in CDP-choline
    pathway. Located in nuclear envelope. Part of NLS-dependent protein nuclear import
    complex. Human ortholog(s) of this gene implicated in congenital generalized lipodystrophy
    and spondylometaphyseal dysplasia with cone-rod dystrophy. Orthologous to several
    human genes including PCYT1A (phosphate cytidylyltransferase 1A, choline).
  source_type: automated
