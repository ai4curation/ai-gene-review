id: P13259
gene_symbol: PCT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Pct1 (Cct1, YGR202C) is the CTP:phosphocholine cytidylyltransferase of Saccharomyces cerevisiae (EC
  2.7.7.15), an amphitropic enzyme of the cytidylyltransferase family that converts phosphocholine and CTP to CDP-choline
  and pyrophosphate. This is the rate-limiting step of the CDP-choline (Kennedy) pathway for phosphatidylcholine
  synthesis, between choline kinase (Cki1) and cholinephosphotransferase (Cpt1). Pct1 is imported into the nucleus
  by the Kap60-Kap95 importin pair via a bipartite basic NLS and is found in the nucleoplasm and on the nuclear
  envelope/ER membranes, where its activity is membrane-associated; nuclear exclusion does not impair PC synthesis.
  CDP-choline pathway flux through Pct1 is modulated by Sec14 and by diacylglycerol availability and is toxic to
  Golgi secretory function in sec14 mutants.
