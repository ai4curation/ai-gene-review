- term:
    id: GO:0042564
    label: NLS-dependent protein nuclear import complex
  evidence_type: IDA
  original_reference_id: PMID:19141610
  qualifier: part_of
  review:
    summary: MacKinnon et al. 2009 showed Pct1 binds Kap60 and associates with Kap95 as import cargo. The GO term
      denotes the alpha/beta importin dimer itself; Pct1 is the transported cargo, not a component of the import
      complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cargo of an importin complex is not part_of that complex; the finding is better captured as nuclear
      localization of Pct1.
    supported_by:
    - reference_id: PMID:19141610
      supporting_text: Pct1 directly interacts with the alpha-importin Kap60 via a bipartite basic region in Pct1,
        and this region of Pct1 was required for its entry into the nucleus.
    - reference_id: PMID:19141610
      supporting_text: Exclusion of Pct1 from the nucleus by elimination of its nuclear localization signal or by
        decreasing Kap60 function did not affect the level of phosphatidylcholine synthesis.
