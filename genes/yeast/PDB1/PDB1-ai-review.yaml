id: P32473
gene_symbol: PDB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PDB1 (YBR221C) encodes the E1 beta subunit of the mitochondrial pyruvate dehydrogenase (PDH)
  complex. It is made with a 33-residue mitochondrial presequence and processed to a 333-residue mature
  protein that is 62% identical to human E1 beta. With Pda1p (E1 alpha) it forms the alpha2beta2 thiamine-diphosphate-dependent
  pyruvate dehydrogenase (acetyl-transferring) component (EC 1.2.4.1). This component decarboxylates pyruvate
  and acetylates the lipoyl domains of the E2 core (Lat1p), the first step in the conversion of pyruvate
  to acetyl-CoA in the mitochondrial matrix. PDB1 is not essential for vegetative growth, and a plasmid
  copy restores a functional PDH complex in the null mutant. Pdb1p has also been found in mtDNA nucleoids.
