id: P46367
gene_symbol: ALD4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ald4p is the major mitochondrial aldehyde dehydrogenase of S. cerevisiae (the K+-activated
  acetaldehyde dehydrogenase, EC 1.2.1.5), a matrix enzyme imported via an N-terminal presequence. It
  oxidizes acetaldehyde and other short aliphatic aldehydes to the corresponding carboxylates using either
  NAD+ or NADP+, with a low micromolar Km for acetaldehyde. ALD4 is glucose-repressed and Ald4p is needed
  for efficient growth on ethanol, where it oxidizes ethanol-derived acetaldehyde to acetate in mitochondria.
  During glucose fermentation it backs up the cytosolic Ald6p in acetate formation (ALD4 is induced when
  Ald6p is absent and ald4 ald6 double mutants are severely delayed). Its NADP+-linked activity also makes
  Ald4p a major source of mitochondrial NADPH, acting downstream of the Pos5 NAD(H) kinase.
