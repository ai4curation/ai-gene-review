- question: Which aldehydes other than acetaldehyde are physiological Ald4p substrates in the matrix (e.g.
    propanal, branched-chain aldehydes from amino acid catabolism, furfural)?
- question: Is the reported association of Ald4p with mtDNA nucleoids functionally meaningful or incidental
    crosslinking of an abundant matrix protein?
suggested_experiments:
- description: Measure matrix NADPH/NADP+ ratios with a compartment-targeted sensor in ald4, pos5 and
    ald4 pos5 strains on ethanol to quantify the contribution of Ald4p to mitochondrial NADPH.
