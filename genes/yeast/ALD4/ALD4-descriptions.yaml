gene_symbol: ALD4
organism: yeast
uniprot_id: P46367
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Potassium-activated aldehyde dehydrogenase involved in acetate formation during
    anaerobic growth on glucose.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P46367
  source_id: P46367
- source: Alliance_Imported
  text: Mitochondrial aldehyde dehydrogenase; K+ dependent enzyme that can use either
    NADP+ or NAD+ as cofactor; required for growth on ethanol and for conversion of
    acetaldehyde to acetate; can substitute for cytosolic NADP-dependent aldehyde
    dehydrogenase when directed to the cytosol; influences lipid metabolism; polymerizes
    into filaments in meiotic cells; phosphorylated; expression is glucose repressed;
    human homolog ALDH2 can complement a yeast ald4 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALD4
  source_id: SGD:S000005901
- source: Alliance_Automated
  text: Enables acetaldehyde dehydrogenase (NADP+) activity and aldehyde dehydrogenase
    (NAD+) activity. Involved in NADPH regeneration; acetate biosynthetic process;
    and ethanol metabolic process. Acts upstream of or within lipid metabolic process.
    Located in mitochondrial nucleoid. Human ortholog(s) of this gene implicated in
    several diseases, including artery disease (multiple); congenital diaphragmatic
    hernia; diabetes mellitus (multiple); liver disease (multiple); and substance-related
    disorder (multiple). Orthologous to several human genes including ALDH1A1 (aldehyde
    dehydrogenase 1 family member A1); ALDH1A2 (aldehyde dehydrogenase 1 family member
    A2); and ALDH1A3 (aldehyde dehydrogenase 1 family member A3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALD4
  source_id: SGD:S000005901
