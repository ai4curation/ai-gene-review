taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: May function in the production of NADPH for fatty acid and sterol synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41939
  source_id: P41939
- source: Alliance_Imported
  text: Cytosolic NADP-specific isocitrate dehydrogenase; catalyzes oxidation of isocitrate
    to alpha-ketoglutarate; levels are elevated during growth on non-fermentable carbon
    sources and reduced during growth on glucose; IDP2 has a paralog, IDP3, that arose
    from the whole genome duplication; mutation in human homolog IDH1 is associated
    with low-grade gliomas and secondary glioblastomas
  source_type: curated
  url: https://www.yeastgenome.org/locus/IDP2
  source_id: SGD:S000004164
- source: Alliance_Automated
  text: Enables isocitrate dehydrogenase (NADP+) activity. Involved in isocitrate
    metabolic process. Located in cytosol. Used to study high grade glioma. Human
    ortholog(s) of this gene implicated in several diseases, including D-2-hydroxyglutaric
    aciduria 2; carcinoma (multiple); hematologic cancer (multiple); high grade glioma
    (multiple); and lung cancer (multiple). Orthologous to several human genes including
    IDH1 (isocitrate dehydrogenase (NADP(+)) 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IDP2
  source_id: SGD:S000004164
