  review:
    summary: PAINT IBA for tricarboxylic acid cycle from PTN008982454 with bacterial Icd as donor. Idp2 is cytosolic and is
      not a TCA-cycle enzyme.
    action: REMOVE
    reason: The IBA node (PTN008982454) carries TCA cycle from bacterial Icd (P9WKL1), where NADP-IDH is the TCA isocitrate-oxidising
      enzyme. In S. cerevisiae the TCA step is catalysed by the mitochondrial NAD+-specific IDH (Idh1/Idh2); the extramitochondrial
      IDP isozymes are not cycle members.
    supported_by:
