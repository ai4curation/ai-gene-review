  label: Saccharomyces cerevisiae S288C
description: Cytosolic NADP+-specific isocitrate dehydrogenase (EC 1.1.1.42) of Saccharomyces cerevisiae, a homodimeric Mg2+/Mn2+-dependent
  enzyme of the isocitrate/isopropylmalate dehydrogenase family that catalyses the reversible oxidative decarboxylation of
  D-threo-isocitrate to 2-oxoglutarate, CO2 and NADPH. IDP2 is glucose-repressed and induced at the diauxic shift and on nonfermentable
  carbon sources, when it carries the major cellular isocitrate/2-oxoglutarate flux. Together with glucose-6-phosphate dehydrogenase
  (Zwf1) it is a principal cytosolic source of NADPH, supporting thiol-based antioxidant defence; it is one of three compartment-specific
  NADP-IDH paralogs (mitochondrial Idp1, cytosolic Idp2, peroxisomal Idp3).
