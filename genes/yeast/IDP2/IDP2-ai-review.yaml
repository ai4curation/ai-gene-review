- term:
    id: GO:0097054
    label: L-glutamate biosynthetic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-13
  review:
    summary: YeastPathways RCA from the superpathway of glutamate biosynthesis (PWY3O-13). Idp2 makes 2-oxoglutarate, the
      carbon skeleton later aminated by Gdh1/Gdh3/Glt1; glutamate formation itself is not catalysed by Idp2. Relocation studies
      show the IDP isozymes can support glutamate synthesis, but under glucose growth the 2-oxoglutarate supply is mainly
      from mitochondrial IDH.
    action: MARK_AS_OVER_ANNOTATED
    reason: Precursor supply via a superpathway; not a step of glutamate biosynthesis.
    supported_by:
    - reference_id: PMID:15001388
      supporting_text: These studies revealed that the IDP isozymes are functionally interchangeable for glutamate synthesis,
        although mitochondrial localization has a positive impact on this function during fermentative growth.
    - reference_id: PMID:15574419
      supporting_text: major cellular flux is through the IDH-catalyzed reaction in glucose-grown cells and through the IDP2-catalyzed
        reaction in cells grown with a nonfermentable carbon source (glycerol and lactate).
