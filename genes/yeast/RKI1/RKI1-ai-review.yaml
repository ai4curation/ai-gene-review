  review:
    summary: PAINT IBA (PTN000232507; donor E. coli RpiA, P0A7Z0) for D-ribose metabolic process. RpiA converts the ribose
      5-phosphate from ribokinase into ribulose 5-phosphate, so Rki1 would carry salvaged or exogenous ribose into the PPP.
      This is plausible for yeast, but no yeast-specific evidence was found; Rki1's established role is the PPP.
    action: KEEP_AS_NON_CORE
