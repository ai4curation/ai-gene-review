taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Rki1 (YOR095C) is the sole ribose-5-phosphate isomerase (type A, RpiA family; EC 5.3.1.6) of Saccharomyces cerevisiae.
  It reversibly interconverts D-ribulose 5-phosphate and D-ribose 5-phosphate in the cytosolic non-oxidative pentose phosphate
  pathway. The reaction links the oxidative branch and the transketolase/transaldolase network to the ribose 5-phosphate used
  for PRPP, nucleotide and histidine synthesis. RKI1 is essential in haploid cells, and viability is restored by RKI1 expression
  and isomerase activity. A partial-loss allele (R189K, 0.6% activity) causes pyridoxine auxotrophy, apparently by limiting
  the pentose-phosphate precursor of vitamin B6 synthesis. GFP tagging places Rki1 in the cytoplasm, with some nuclear signal.
