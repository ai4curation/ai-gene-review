- term:
    id: GO:0008615
    label: pyridoxine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:14690456
  qualifier: involved_in
  review:
    summary: Kondo et al. found that a pyridoxine auxotroph carried an RKI1 R189K allele with 0.6% isomerase activity, confirmed
      by disruption and tetrad analysis. The authors attribute the auxotrophy to a shortage of ribose 5-phosphate or ribulose
      5-phosphate as a starting material for pyridoxine synthesis. Rki1 therefore supplies a pentose-phosphate precursor;
      the PLP synthase Snz1/Sno1 performs the pyridoxine-specific chemistry.
    action: KEEP_AS_NON_CORE
    reason: 'Experimental and reproducible, but indirect: Rki1 supplies a precursor and does not catalyse a pyridoxine-specific
      step. Retained as non-core and not used as a core process.'
    supported_by:
    - reference_id: PMID:14690456
      supporting_text: eventually leads to a shortage of either ribose 5-phosphate or ribulose 5-phosphate as the starting
        or intermediary material for pyridoxine synthesis
    - *id004
