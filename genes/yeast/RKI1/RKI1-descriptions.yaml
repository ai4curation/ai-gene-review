  text: Enables ribose-5-phosphate isomerase activity. Involved in pentose-phosphate
    shunt and pyridoxine biosynthetic process. Located in cytoplasm and nucleus. Human
    ortholog(s) of this gene implicated in polyneuropathy. Orthologous to human RPIA
    (ribose 5-phosphate isomerase A).
