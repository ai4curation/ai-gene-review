id: Q06673
gene_symbol: ECM30
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Ecm30 is a large HID1-family protein of Saccharomyces cerevisiae involved in membrane-trafficking homeostasis.
  It forms a complex with the ubiquitin protease Ubp15, and ecm30 deletion perturbs sorting and transport
  of the amino-acid permease Gap1 and alters cell-surface composition. A cytoplasmic pool is observed
  by GFP localization, while conserved HID1 ancestry supports peripheral membrane and Golgi association
  and a role in Golgi organization. Ecm30 is substantially diverged from some other HID1 proteins; its
  precise biochemical contribution, targeting determinants and relationship to the unstacked budding-yeast
  Golgi remain unresolved.
