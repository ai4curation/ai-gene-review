  label: Saccharomyces cerevisiae S288C
description: GLY1 encodes a low-specificity L-threonine aldolase, a pyridoxal 5'-phosphate-dependent homotetrameric
  lyase that cleaves L-threonine (and L-allo-threonine) to glycine and acetaldehyde. During growth on
  glucose Gly1 is the principal source of glycine in S. cerevisiae, more important than the serine hydroxymethyltransferases
  SHM1 and SHM2; complete glycine auxotrophy requires loss of GLY1, SHM1 and SHM2 (and, on non-fermentable
  carbon, also AGX1). The same reaction is a route of threonine catabolism. Gly1 is an abundant cytosolic
  enzyme, and the acetaldehyde it releases can supply cytosolic acetyl-CoA.
