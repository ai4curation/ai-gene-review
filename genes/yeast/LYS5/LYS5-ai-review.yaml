  label: Saccharomyces cerevisiae S288C
description: 'L-aminoadipate-semialdehyde dehydrogenase-phosphopantetheinyl transferase Lys5 of Saccharomyces
  cerevisiae, a small (31 kDa) Sfp/AcpS-superfamily 4''-phosphopantetheinyl transferase (EC 2.7.8.7).
  Lys5 transfers the 4''-phosphopantetheine moiety of coenzyme A onto Ser880 in the peptidyl-carrier domain
  of the aminoadipate reductase Lys2, converting apo-Lys2 into the active holo-enzyme. Lys5 and Lys2 form
  a two-component system: without Lys5, Lys2 cannot load aminoadipate onto its PCP arm and the reduction
  of L-2-aminoadipate to the 6-semialdehyde in lysine biosynthesis does not occur, so lys5 mutants are
  lysine auxotrophs with the same aminoadipate-utilisation phenotype as lys2 mutants. Lys5 is a low-abundance
  cytosolic protein.'
