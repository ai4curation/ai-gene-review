    label: protein phosphopantetheinylation
  evidence_type: IDA
  original_reference_id: PMID:10320345
  qualifier: involved_in
  review:
    summary: Proposed new annotation. Lys5 is the enzyme that catalyses phosphopantetheinylation of Lys2
      Ser880, so it performs this protein-modification process itself.
    action: NEW
    reason: 'Lys5 performs the modification step (transfer of 4''-phosphopantetheine from CoA to the PCP
      serine), so this passes the ''who performs the step'' test. Comparator check: Candida albicans LYS5
      (Q59N08, CGD IDA/IGI) and Arabidopsis PPT (TAIR IDA) carry GO:0018215; S. cerevisiae LYS5 lacks
      it. GO:0018215 is a protein modification process and is not an ancestor or descendant of the existing
      protein maturation (GO:0051604) annotation.'
    supported_by: *id002
