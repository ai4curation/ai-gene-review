descriptions:
- source: UniProt
  text: Catalyzes the transfer of a 4'-phosphopantetheine moiety from coenzyme A to
    a serine residue of acceptor proteins, such as alpha- aminoadipate reductase.
    Necessary for alpha-aminoadipate reductase activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50113
  source_id: P50113
- source: Alliance_Imported
  text: Phosphopantetheinyl transferase involved in lysine biosynthesis; converts
    inactive apo-form of Lys2p (alpha-aminoadipate reductase) into catalytically active
    holo-form by posttranslational addition of phosphopantetheine
  source_type: curated
  url: https://www.yeastgenome.org/locus/LYS5
  source_id: SGD:S000003122
- source: Alliance_Automated
  text: Enables holo-[acyl-carrier-protein] synthase activity. Involved in L-lysine
    biosynthetic process. Predicted to be located in cytoplasm. Predicted to be active
    in cytosol. Orthologous to human AASDHPPT (aminoadipate-semialdehyde dehydrogenase-phosphopantetheinyl
    transferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LYS5
