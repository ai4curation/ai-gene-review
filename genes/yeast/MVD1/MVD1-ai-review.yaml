id: P32377
gene_symbol: MVD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MVD1 (YNR043W; also known as ERG19) encodes diphosphomevalonate decarboxylase (mevalonate
  pyrophosphate decarboxylase, EC 4.1.1.33), a homodimeric GHMP-fold enzyme that uses ATP to phosphorylate
  and decarboxylate (R)-mevalonate 5-diphosphate, releasing isopentenyl diphosphate (IPP), CO2, ADP and
  phosphate. This is the last step of the mevalonate pathway and produces the C5 building block of all
  isoprenoids, including ergosterol, dolichol, ubiquinone and prenyl groups. Asp302 is essential for catalysis
  and Lys18 contributes to ATP binding. MVD1 is essential for viability; erg19 mutants are ergosterol
  auxotrophs, and elevated Mvd1 expression lowers steady-state sterol levels. Mvd1 is a soluble cytosolic
  enzyme.
