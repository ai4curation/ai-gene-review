descriptions:
- source: UniProt
  text: Dual substrate-specific glycerol-3-phosphate/dihydroxyacetone phosphate sn-1
    acyltransferase, catalyzing the first and committed reaction in the de novo synthesis
    of glycerophospholipids and triacylglycerols (TAGs). Can use both Gly-3-P and
    dihydroxyacetone phosphate with similar efficiencies and has a broad fatty acyl-CoA
    specificity profile. Transfers a fatty acid from fatty acyl-CoA to the sn-1 position
    of glycerol-3-phosphate to produce lysophosphatidic acid (LysoPA). These lipids
    not only are precursors of glycerolipids, but also are dynamic components of signal
    transduction systems that control cell physiology.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36148
  source_id: P36148
- source: Alliance_Imported
  text: Glycerol-3-phosphate/dihydroxyacetone phosphate sn-1 acyltransferase; located
    in lipid particles and the ER; involved in the stepwise acylation of glycerol-3-phosphate
    and dihydroxyacetone in lipid biosynthesis; the most conserved motifs and functionally
    relevant residues are oriented towards the ER lumen
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPT2
  source_id: SGD:S000001775
- source: Alliance_Automated
  text: Enables glycerol-3-phosphate O-acyltransferase activity and glycerone-phosphate
    O-acyltransferase activity. Involved in phospholipid biosynthetic process and
    regulation of triglyceride metabolic process. Located in endoplasmic reticulum
    membrane and lipid droplet.
  source_type: automated
  url: https://www.yeastgenome.org/locus/GPT2
  source_id: SGD:S000001775
