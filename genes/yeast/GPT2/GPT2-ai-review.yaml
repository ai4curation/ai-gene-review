  evidence_type: IMP
  original_reference_id: PMID:31421179
  qualifier: involved_in
  review:
    summary: IMP from Kiegerl et al. 2019 for regulation of triglyceride metabolic process. Mutating the
      phosphorylation motif of Gpt2 raised its activity and sustained TAG synthesis during lipolysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: The paper shows that Gpt2 itself is regulated (by phosphorylation); it does not show Gpt2
      regulating TAG metabolism other than through its own GPAT activity. The effect on TAG levels is
      already captured by the GPAT MF and the TAG/phospholipid biosynthesis BPs. Being a regulated enzyme
      is not the same as regulating a process.
    supported_by:
    - reference_id: PMID:31421179
      supporting_text: Phosphorylation deficiency at the conserved motif increases the enzyme activity
        of Gpt2 and consequently enhances TAG synthesis.
    - reference_id: PMID:31421179
      supporting_text: These data strongly indicate that phosphorylation of Gpt2 at a conserved motif
        plays a critical role in coordinating the synthesis and degradation of TAGs.
