proposed_new_terms: []
suggested_questions:
- question: Which kinase(s) phosphorylate the conserved C-terminal motif of Gpt2, and how is this coordinated
    with TAG lipolysis by Tgl3/Tgl4?
- question: What determines the different fatty-acid channelling of Gpt2 (oleate, broad acyl-CoA use)
    and Sct1 (C16 preference, de novo fatty acids) into TAG versus phospholipids?
suggested_experiments:
- description: Phosphoproteomics of Gpt2 after kinase deletions (e.g. Ypk1/Ypk2, Pho85) during lipolysis,
    combined with TAG turnover assays in phospho-site mutants.
  experiment_type: phosphoproteomics/genetics
  hypothesis: A specific lipolysis-activated kinase phosphorylates Gpt2 to prevent futile TAG cycling.
