id: P36148
gene_symbol: GPT2
aliases:
- GAT1
- YKR067W
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GPT2 (also called GAT1) encodes one of the two redundant glycerol-3-phosphate O-acyltransferases
  (GPATs) of budding yeast. These are dual-substrate sn-1 acyltransferases that acylate sn-glycerol 3-phosphate
  to lysophosphatidic acid, or dihydroxyacetone phosphate to 1-acyl-DHAP, using acyl-CoA. This is the
  first and committed step of de novo glycerolipid synthesis, feeding phosphatidic acid into both membrane
  phospholipids (via CDP-diacylglycerol) and triacylglycerol. Gpt2 uses glycerol 3-phosphate and DHAP
  with similar efficiency and accepts a broad range of acyl-CoAs. It is a multi-pass membrane protein
  of the perinuclear and cortical ER and is also associated with lipid droplets. When cells are fed oleate,
  Gpt2 forms ER crescents closely apposed to lipid droplets and is required for oleate-induced droplet
  accumulation. Gpt2 is a phosphoprotein; phosphorylation at a conserved C-terminal motif restrains its
  activity and prevents a futile TAG synthesis/lipolysis cycle. GPT2 and SCT1/GAT2 are synthetically lethal.
