      two rings, each of which is composed of a stoichiometric array of eight different
      subunits
    reference_section_type: ABSTRACT
suggested_questions:
- question: How does the high-ATP-affinity Cct5 subunit shape client progression through
    the yeast TRiC/CCT ATPase cycle?
suggested_experiments:
- hypothesis: Cct5 ATP binding/hydrolysis helps set the timing of TRiC/CCT chamber
    closure for actin and tubulin clients.
  description: Compare ATPase-cycle reporters, client folding assays, and viability
    for targeted CCT5 ATP-pocket alleles in yeast, separating assembled-complex abundance
    from kinetic effects.
  experiment_type: site-directed mutagenesis with chaperonin folding and ATPase assays
