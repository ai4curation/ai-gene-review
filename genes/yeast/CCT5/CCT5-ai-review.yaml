id: P40413
gene_symbol: CCT5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: CCT5 encodes the epsilon subunit of the cytosolic group II chaperonin
  TRiC/CCT. Cct5 is an obligate subunit of the ATP-driven double-ring folding machine,
  contributes one ATPase/substrate-contact module to the chamber, and is best curated
  as part of the complex that folds actin, tubulin, and other cytosolic clients. The
  subunit-specific literature emphasizes ATP-cycle asymmetry and chamber architecture
  rather than a separate standalone activity.
