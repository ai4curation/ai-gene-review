product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: BNA6 encodes quinolinate phosphoribosyltransferase (QPRTase), which converts quinolinate
  and 5-phospho-alpha-D-ribose 1-diphosphate into nicotinate D-ribonucleotide (NaMN), CO2 and diphosphate.
  This is the step at which the tryptophan-derived kynurenine pathway feeds into NAD+ synthesis, converging
  with the Npt1-dependent nicotinic acid route at NaMN; loss of the kynurenine pathway is lethal in cells
  lacking Npt1. Bna6 is a soluble enzyme of the NadC/ModD family (a hexamer of three dimers) found in
  the cytoplasm and nucleus.
