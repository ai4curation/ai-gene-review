suggested_questions:
- question: Is there a functional reason for the nuclear pool of Bna6 seen in the GFP survey, e.g. local
    NaMN supply for nuclear NAD+ regeneration?
suggested_experiments:
- description: Quantify quinolinate accumulation and NAD+ in bna6 cells grown without nicotinic acid,
    with and without a nuclear-excluded Bna6 variant.
  experiment_type: genetics/metabolomics
  hypothesis: Cytosolic Bna6 suffices for de novo NAD+ synthesis.
