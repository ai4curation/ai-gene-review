id: P24521
gene_symbol: ERG8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG8 (YMR220W) encodes phosphomevalonate kinase (EC 2.7.4.2), which phosphorylates (R)-mevalonate
  5-phosphate with ATP to give (R)-mevalonate 5-diphosphate, the second of three ATP-dependent steps that
  convert mevalonate to isopentenyl diphosphate. Erg8 belongs to the GHMP kinase superfamily (fungal/plant-type
  PMK) and is unrelated in sequence to the animal PMVK enzyme. ERG8 is essential; thermosensitive erg8
  alleles cause ergosterol auxotrophy and loss of PMK activity. Erg8 is a low-abundance soluble cytoplasmic
  protein, with some nuclear GFP signal in genome-wide surveys.
