id: P47096
gene_symbol: BNA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Bna1 (YJR025C) is the 3-hydroxyanthranilate 3,4-dioxygenase (3-HAO; EC 1.13.11.6) of Saccharomyces
  cerevisiae, a small non-heme Fe(2+)-dependent cupin-fold enzyme of the kynurenine pathway. It cleaves the aromatic
  ring of 3-hydroxyanthranilate to 2-amino-3-carboxymuconate 6-semialdehyde, which cyclises spontaneously to quinolinate,
  the precursor that Bna6 converts to nicotinate mononucleotide for de novo NAD+ synthesis from tryptophan. bna1
  deletion mutants require nicotinic acid, and loss of the kynurenine pathway is lethal in combination with loss
  of the Npt1 salvage enzyme. Bna1 is a soluble protein found throughout the cytoplasm.
