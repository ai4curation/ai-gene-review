id: P08566
gene_symbol: ARO1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ARO1 encodes the pentafunctional AROM polypeptide of Saccharomyces cerevisiae, a 1588-residue
  cytosolic homodimeric enzyme that is a fusion of five domains homologous to the monofunctional E. coli
  shikimate-pathway enzymes AroB, AroA, AroK/L, AroD and AroE. AROM catalyses steps 2-6 of the seven-step
  shikimate pathway that converts DAHP into EPSP: 3-dehydroquinate synthase (EC 4.2.3.4), 3-dehydroquinate
  dehydratase (type I, EC 4.2.1.10), shikimate dehydrogenase (NADP+, EC 1.1.1.25), shikimate kinase (EC
  2.7.1.71) and EPSP synthase (3-phosphoshikimate 1-carboxyvinyltransferase, EC 2.5.1.19). Chorismate,
  produced from EPSP by ARO2, is the common precursor of phenylalanine, tyrosine, tryptophan, p-aminobenzoate
  and p-hydroxybenzoate. The DHQ synthase domain binds Zn2+, and ARO1 expression is co-ordinately controlled
  by the GCN4 general amino acid control system. aro1 mutants are aromatic amino acid auxotrophs and homozygous
  aro1 diploids fail to sporulate.'
