id: P32419
gene_symbol: MDH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MDH3 encodes the peroxisomal isozyme of NAD+-dependent malate dehydrogenase (EC 1.1.1.37),
  a homodimer targeted to the peroxisomal matrix by a C-terminal SKL (PTS1); dimerisation precedes import.
  Although its sequence is closest to mitochondrial Mdh1p, Mdh3p acts inside peroxisomes, where it interconverts
  malate and oxaloacetate to reoxidise NADH generated during fatty acid beta-oxidation, because the peroxisomal
  membrane is impermeable to NAD(H). mdh3 mutants have impaired beta-oxidation in intact cells and cannot
  grow on oleate, while growth on other non-fermentable carbon sources is normal or only mildly slowed
  (acetate). Mdh3p contributes about 10% of cellular MDH activity in acetate-grown cells and has also
  been detected binding mRNAs in a proteome-wide screen.
