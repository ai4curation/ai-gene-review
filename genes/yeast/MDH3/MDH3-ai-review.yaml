suggested_questions:
- question: Does Mdh3p participate in the glyoxylate cycle in vivo on acetate, or is the mild acetate
    growth defect secondary to impaired peroxisomal redox balance?
suggested_experiments:
- description: 13C-acetate flux analysis in mdh3 versus wild type, combined with a peroxisome-targeted
    NAD+/NADH sensor, to separate glyoxylate-cycle and redox-shuttle roles.
