    overall_notes: Peroxisomal malate dehydrogenase is correct; 'involved in the glyoxylate
      cycle' understates the review's main role, reoxidising NADH from fatty acid
      beta-oxidation.
- source: Alliance_Automated
  text: Enables L-malate dehydrogenase (NAD+) activity and mRNA binding activity.
    Involved in fatty acid beta-oxidation. Located in peroxisomal matrix. Human ortholog(s)
    of this gene implicated in developmental and epileptic encephalopathy 51. Orthologous
    to human MDH2 (malate dehydrogenase 2).
  source_type: automated
