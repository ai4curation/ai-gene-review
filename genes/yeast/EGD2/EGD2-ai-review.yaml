proposed_new_terms: []
suggested_questions:
- question: Do EGD2 lipid-binding observations represent a physiologic NAC regulatory
    function, or are they in vitro/non-core binding properties?
suggested_experiments:
- description: Schilke et al. (2024) found that EGD2 N- and C-terminal truncations,
    including a UBA-domain deletion, still complemented growth; test those alleles
    directly for effects on nascent-chain aggregation, ribosome association and positioning,
    and cotranslational targeting in NAC/Ssb sensitized backgrounds.
