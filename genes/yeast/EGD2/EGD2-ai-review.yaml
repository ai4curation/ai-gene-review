proposed_new_terms: []
suggested_questions:
- question: Do EGD2 lipid-binding observations represent a physiologic NAC regulatory
    function, or are they in vitro/non-core binding properties?
- question: Should the GO:0051082 replacement used for alpha-beta NAC be GO:0044183,
    or should EGD1/EGD2 retain no molecular-function replacement until GO has a
    general ATP-independent nascent-chain holdase/adaptor term?
- question: Should EGD2-containing NAC be annotated to a mitochondrial protein targeting
    process, given that PMID:9482879 and PMID:11959135 show NAC promotes productive
    mitochondrial-surface ribosome interactions but current GOA captures only the
    endoplasmic-reticulum targeting arm?
suggested_experiments:
- description: Schilke et al. (2024) found that EGD2 N- and C-terminal truncations,
    including a UBA-domain deletion, still complemented growth; test those alleles
    directly for effects on nascent-chain aggregation, ribosome association and positioning,
    and cotranslational targeting in NAC/Ssb sensitized backgrounds.
