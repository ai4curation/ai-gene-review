  findings:
  - statement: A 2024 yeast NAC study found that the core Nac-alpha domain was sufficient
      to rescue growth of cells expressing low beta-NAC levels, consistent with EGD2's
      central contribution in that assay being alpha/beta dimerization and beta-subunit
      stabilization.
    supporting_text: Together, our results suggest that only the core domain of Nacα
      suffices to overcome the growth defect of strains expressing only low levels
      of the beta subunit
  - statement: The same study found that Nac-alpha truncations removing N- or C-terminal
      regions, including the C-terminal UBA-domain segment, still supported growth
      as well as full-length Nac-alpha in the tested complementation assay.
    supporting_text: Deletions removing N-terminal or C-terminal segments that included
      the ubiquitin association domain supported growth as well as full-length protein
      (Figure 6(c)).
