taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Methylthioribulose-1-phosphate dehydratase (MtnB, EC 4.2.1.109) of Saccharomyces cerevisiae, a zinc-dependent
  class II aldolase-family enzyme that dehydrates 5-methylthioribulose 1-phosphate to 2,3-diketo-5-methylthiopentyl
  1-phosphate, step 2 of the methionine salvage (MTA) pathway downstream of Mri1 and upstream of the enolase-phosphatase
  Utr4. MDE1 was identified by deletion-mutant growth tests on 5'-methylthioadenosine and MTA accumulation analysis.
  Mde1 is a cytoplasmic protein; its human orthologue APIP has the same activity and additionally regulates apoptosis/pyroptosis.
