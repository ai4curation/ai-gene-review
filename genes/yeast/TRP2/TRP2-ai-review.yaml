description: 'Anthranilate synthase component I (TrpE family) of Saccharomyces cerevisiae. Trp2 carries the chorismate-binding
  active site of anthranilate synthase (EC 4.1.3.27), the first committed step of L-tryptophan biosynthesis, converting
  chorismate to anthranilate and pyruvate. On its own it uses ammonia as the amino donor; in the native heterotetrameric
  complex with Trp3 (2 Trp2 + 2 Trp3) it uses ammonia generated from L-glutamine by the Trp3 glutamine amidotransferase
  domain. Trp2 is the feedback-regulated enzyme of the pathway: tryptophan inhibits it, and mutation of Ser76 in
  the conserved LLES regulatory motif gives a feedback-resistant enzyme. It is a soluble cytosolic protein under
  general amino acid (GCN4) control.'
