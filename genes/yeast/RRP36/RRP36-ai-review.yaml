  review:
    summary: PAINT propagation from PTN000497661 with yeast RRP36 as donor.
    action: ACCEPT
    reason: Rrp36p co-precipitates the RNA components of the 90S preribosome (35S, 33S/32S pre-rRNA and
      U3 snoRNA but not SCR1 or U2), co-purifies UTP-C and other 90S factors, and its recruitment depends
      on prior loading of UTP-A and UTP-B. A weaker association with pre-40S particles is also reported.
