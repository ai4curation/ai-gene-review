- term:
    id: GO:0042274
    label: ribosomal small subunit biogenesis
  evidence_type: IMP
  original_reference_id: PMID:20038530
  qualifier: involved_in
  review:
    summary: Mutant evidence that Rrp36p depletion reduces free 40S subunits in polysome profiles.
    action: ACCEPT
    reason: Rrp36p depletion produces a clear loss of free 40S subunits with an increased 60S peak, a
      direct consequence of the failure to make 18S rRNA. Small-subunit biogenesis is the pathway-level
      process in which the specific SSU-rRNA maturation step (GO:0000462) sits, and Rrp36p acts within
      it as a 90S preribosome component, so this broader term still carries information and is kept.
    supported_by:
    - reference_id: PMID:20038530
      supporting_text: Depletion of 3HA-Rrp36p resulted in a clear reduction of the sedimentation peak
        corresponding to the free 40S subunits
    - reference_id: PMID:20038530
