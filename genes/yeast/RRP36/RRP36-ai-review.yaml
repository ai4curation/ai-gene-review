core_functions:
- description: Non-catalytic component of the nucleolar 90S preribosome (SSU processome) required for
    the early A0, A1 and A2 cleavages of the 35S pre-rRNA and hence for 18S rRNA and 40S subunit production;
    recruited after UTP-A/UTP-B, associated with UTP-C, and directly contacts Rrp9 and Rrp5. Established
    experimentally in S. cerevisiae; the 18S-specific role is conserved in human RRP36.
  directly_involved_in:
  - id: GO:0000462
    label: maturation of SSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
  locations:
  - id: GO:0005730
    label: nucleolus
  in_complex:
    id: GO:0030686
    label: 90S preribosome
  supported_by:
  - reference_id: PMID:20038530
    supporting_text: We conclude that Rrp36p is specifically required for early cleavages of the 35S pre-rRNA
      at sites A 0 , A 1 , and A 2 in the processing pathway leading to the mature 18S rRNA and the production
      of the 40S ribosomal subunit.
  - reference_id: PMID:20038530
    supporting_text: These interactions suggest that Rrp36p is a component of the 90S preribosomal particles
  - reference_id: PMID:20038530
    supporting_text: We conclude that Rrp36p accumulates predominantly in yeast cell nucleoli.
  - reference_id: PMID:31996908
    supporting_text: As shown by GST pull-down assays, interactions of Rrp36 (A) and the C-terminal domain
      of Sgd1 (B) with Rrp9 are direct interactions.
suggested_questions:
- question: Where does Rrp36 sit in the 90S preribosome, given that it is unmapped in cryo-EM structures?
    Does its coiled-coil segment bridge Rrp9 (U3 snoRNP), Rrp5 and the UTP-C module?
- question: Does Rrp36 bind pre-rRNA directly (e.g. via its basic C-terminal region), or is its association
    with preribosomes entirely protein-mediated?
- question: What does Rrp36 do in the pre-40S particles it remains weakly associated with after A2 cleavage?
suggested_experiments:
- description: UV crosslinking and cDNA analysis (CRAC) with tagged Rrp36p to test for direct pre-rRNA
    or U3 snoRNA contacts and map them relative to sites A0-A2.
  experiment_type: RNA-protein crosslinking
- description: Crosslinking mass spectrometry of affinity-purified 90S particles, combined with AlphaFold-multimer
    models of Rrp36 with Rrp9, Rrp5 and UTP-C subunits, to place Rrp36 within the SSU processome.
  experiment_type: structural proteomics
