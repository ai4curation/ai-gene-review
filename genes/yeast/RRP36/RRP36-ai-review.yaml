id: Q12481
gene_symbol: RRP36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: RRP36 (YOR287C) encodes an essential, 300-residue nucleolar protein of the rRNA and ribosome
  biosynthesis (RRB) regulon that is a non-catalytic component of the 90S preribosome (SSU processome).
  Rrp36p is mostly disordered in its N-terminal half (acidic and basic stretches) and has a central coiled-coil
  segment and a C-terminal lysine/arginine-rich nuclear localisation region; it has no recognisable enzymatic
  motif. It is recruited to nascent preribosomes after the UTP-A and UTP-B modules and associates preferentially
  with the UTP-C module; it makes direct contacts with the U3 snoRNP protein Rrp9 and with Rrp5. Depletion
  of Rrp36p blocks the early cleavages of the 35S pre-rRNA at sites A0, A1 and A2, abolishes production
  of 20S pre-rRNA and 18S rRNA and so of 40S subunits, while 60S subunit rRNAs are made normally. Rrp36p
  remains associated, more weakly, with early pre-40S particles. The function in 18S rRNA production is
  conserved in the human ortholog RRP36 (PANTHER PTHR21738:SF0, a single-subfamily family).
existing_annotations:
- term:
    id: GO:0000462
    label: maturation of SSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000497661
  - SGD:S000005813
  review:
    summary: PAINT propagation from node PTN000497661 (PANTHER PTHR21738:SF0, the family's only subfamily)
      of SSU-rRNA maturation from the tricistronic transcript. S. cerevisiae RRP36 (SGD:S000005813) is
      itself the experimental donor for this node, so the IBA restates the gene's own experimental grounding
      plus the inference that the function is inherited across Rrp36 orthologs.
    action: ACCEPT
    reason: Depletion of Rrp36p in yeast blocks cleavage of the 35S pre-rRNA at A0, A1 and A2 and selectively
      depletes 20S pre-rRNA and 18S rRNA while 60S rRNAs are made normally; the same 18S-specific requirement
      is seen for human RRP36 in HeLa cells, supporting the node placement at the root of the eukaryotic
      family. RRP36 appearing as its own donor is expected, not circular. Rrp36 has no recognisable catalytic
      motif and no evidence that it performs a cleavage itself, so the process term (maturation, not endonucleolytic
      cleavage) is the right level of specificity.
    supported_by:
    - reference_id: PMID:20038530
      supporting_text: We conclude that Rrp36p is specifically required for early cleavages of the 35S
        pre-rRNA at sites A 0 , A 1 , and A 2 in the processing pathway leading to the mature 18S rRNA
        and the production of the 40S ribosomal subunit.
    - reference_id: PMID:20038530
      supporting_text: In contrast, production of the RNA components of the 60S ribosomal subunit, the
        5S, 5.8S, and 25S rRNAs, was not affected by the absence of Rrp36p.
    - reference_id: PMID:20038530
      supporting_text: Altogether, our results show that the function of RRP36 in the production of the
        mature 18S rRNA has been conserved from yeast to human cells
- term:
    id: GO:0000462
    label: maturation of SSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
  evidence_type: IMP
  original_reference_id: PMID:12837249
  qualifier: involved_in
  review:
    summary: Mutant (repressible-allele) evidence from the Peng et al. 2003 noncoding-RNA processing microarray
      screen, in which repression of YOR287C produced a U3-processome-like (SSU processing) profile.
    action: ACCEPT
    reason: The cached record is abstract-only, so the specific YOR287C data cannot be read here; however
      Gerus et al. 2010 explicitly cite this screen as showing a U3 processome-like phenotype for YOR287C
      and independently demonstrate by Northern blotting that Rrp36p depletion blocks A0/A1/A2 cleavage
      and 18S rRNA production. The term is the correct, specific process for this gene.
    supported_by:
    - reference_id: PMID:20038530
      supporting_text: transcriptional repression of the YOR287C ORF induces a U3 processome-like mutant
        phenotype
    - reference_id: PMID:20038530
      supporting_text: We conclude that Rrp36p is specifically required for early cleavages of the 35S
        pre-rRNA at sites A 0 , A 1 , and A 2 in the processing pathway leading to the mature 18S rRNA
        and the production of the 40S ribosomal subunit.
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: No-data annotation for molecular function.
    action: ACCEPT
    reason: No molecular activity of Rrp36p has been established. The protein has no recognisable motif
      beyond C-terminal basic NLS-like sequences, it is not resolved in SSU processome cryo-EM structures,
      and the only biochemical data are direct protein-protein interactions with Rrp9 and Rrp5 in GST
      pull-downs, which do not identify an informative activity term (e.g. RNA binding has not been tested).
      ND remains the correct statement of the molecular function knowledge.
    supported_by:
    - reference_id: PMID:20038530
      supporting_text: These conserved blocks do not correspond to any recognizable protein motif
    - reference_id: PMID:31996908
      supporting_text: some SSU-processome proteins remain unmapped, including Rrp36 and Sgd1 for which
        no 3D structures are established
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20038530
  qualifier: enables
  supporting_entities:
  - UniProtKB:P15790
  review:
    summary: Generic protein binding with CKA1 (casein kinase II alpha subunit, a UTP-C component), from
      co-immunoprecipitation/TAP of Rrp36p with 90S preribosome components (Gerus et al. 2010).
    action: REMOVE
    reason: Bare GO:0005515 protein binding is uninformative and is removed under the protein-binding
      policy; this does not dispute the reported interaction. The partner is a 90S preribosome/SSU processome
      component, and the biologically meaningful content of these interactions (Rrp36p is a 90S preribosome
      subunit, preferentially associated with the UTP-C module) is already captured by the accepted 90S
      preribosome (GO:0030686) annotations. No more specific molecular function (e.g. a defined adaptor
      or bridging activity) is established by these co-purification or two-hybrid data.
    supported_by:
    - reference_id: PMID:20038530
      supporting_text: These interactions suggest that Rrp36p is a component of the 90S preribosomal particles
    - reference_id: PMID:20038530
      supporting_text: suggesting that Rrp36p may be preferentially associated with the UTP-C module
