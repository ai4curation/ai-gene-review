  label: Saccharomyces cerevisiae S288C
description: DPH6 (YLR143W) encodes diphthine-ammonia ligase (diphthamide synthetase, EC 6.3.1.14), the
  enzyme of the final step of diphthamide biosynthesis on translation elongation factor 2 (eEF2). Its
  N-terminal adenine nucleotide alpha hydrolase-like (ATP pyrophosphatase, SGGKDS P-loop-like motif) domain
  uses ATP and free ammonium (not glutamine) to amidate the carboxylate of diphthine on eEF2 His699, releasing
  AMP and diphosphate; the C-terminal region resembles the RutC/YjgF family. Dph6 binds eEF2 and acts
  after Dph7 has removed the methyl ester installed by Dph5. dph6 null cells accumulate diphthine-modified
  eEF2, are resistant to sordarin and diphtheria toxin, and show increased -1 ribosomal frameshifting.
  The human ortholog ATPBD4/DPH6 fully complements the yeast deletion. Dph6 is a cytoplasmic protein.
