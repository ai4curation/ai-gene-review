gene_symbol: DPH6
organism: yeast
uniprot_id: Q12429
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Amidase that catalyzes the last step of diphthamide biosynthesis using ammonium
    and ATP. Diphthamide biosynthesis consists in the conversion of an L-histidine
    residue in the translation elongation factor eEF-2 (EFT1 or EFT2) to diphthamide.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12429
  source_id: Q12429
- source: Alliance_Imported
  text: Diphthamide synthetase; catalyzes the last amidation step of diphthamide biosynthesis
    using ammonium and ATP; evolutionarily conserved in eukaryotes; dph6 mutants exhibit
    diphthine accumulation and resistance to sordarin, which is indicative of defects
    in diphthamide formation on EF2; green fluorescent protein (GFP)-tagged protein
    localizes to the cytoplasm; DPH6/YLR143W is not an essential gene
  source_type: curated
  url: https://www.yeastgenome.org/locus/DPH6
  source_id: SGD:S000004133
- source: Alliance_Automated
  text: Enables diphthine-ammonia ligase activity. Involved in protein histidyl modification
    to diphthamide. Located in cytoplasm. Orthologous to human DPH6 (diphthamine biosynthesis
    6).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DPH6
  source_id: SGD:S000004133
