    reason: The genetic interaction is real and the curators had the full text, so the row is not removed. However,
      suppression of a sit4 hal3 arrest by extra copies of a PP2A catalytic-subunit gene is evidence that PP2A
      activity can compensate for the loss of the related PP6-type phosphatase Sit4, whose role in G1 cyclin
      expression is well established, rather than evidence that Pph21 itself normally acts at the G1/S transition.
