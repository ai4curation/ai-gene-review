  review:
    summary: HA-Pph21 immunoprecipitates from wild-type cells contain the scaffold Tpd3 and the activator Rrd2 in a
      single multimeric complex (sequential IP), and Pph21 activity and methylation depend on Tpd3, Rrd1/Rrd2 and Ppm1;
