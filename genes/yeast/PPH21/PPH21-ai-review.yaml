    reason: The node placement is internally sound (the function, if real, is shared by the two near-identical yeast
      paralogues), but the underlying evidence is multicopy suppression of a G1 arrest caused by loss of a different
      phosphatase (Sit4) together with Hal3. Elevated PP2A catalytic subunit substituting for a Sit4-dependent function
      shows overlap of phosphatase specificity, not that Pph21 normally executes a step of the G1/S transition. The
      characterised cell-cycle roles of the Pph21/Pph22-containing holoenzymes are at G2/M entry, mitotic exit and the
      spindle checkpoint, and pph21 pph22 cells accumulate in G2, not G1. Kept as an over-annotation rather than removed
      because the curators had the full text of the suppressor paper and the term is not contradicted.
