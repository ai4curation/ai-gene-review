- description: Mitotic PP2A activity delivered through the Cdc55- and Rts1-directed holoenzymes, which dephosphorylate
    Cdk1 (Cdc28)- and Polo-dependent phosphosites; the cytoplasmic PP2A-Cdc55 pool promotes mitotic entry by opposing
    Swe1-dependent Tyr19 phosphorylation of Cdc28, while the nuclear pool keeps Net1 and APC-Cdc20 underphosphorylated
    to restrain Cdc14 release and mitotic exit until anaphase and to sustain spindle-checkpoint arrest; loss of both
    catalytic subunits gives G2 accumulation, short spindles, aberrant buds and a disorganised actin cytoskeleton.
  molecular_function:
