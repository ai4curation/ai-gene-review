core_functions:
- description: Catalytic subunit of protein phosphatase 2A that hydrolyses phosphoserine and phosphothreonine on
    protein substrates; the newly made subunit is a low-activity conformer that is switched on by Rrd2 acting with
    the scaffold Tpd3, is carboxymethylated on Leu-369 by Ppm1 (reversed by Ppe1), and thereby assembles into the
    Tpd3-Pph21 core and the Tpd3-Pph21-Cdc55/Rts1 holoenzymes that, redundantly with Pph22, supply essentially all
    cellular PP2A activity.
  molecular_function:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
