suggested_questions:
- question: Is there any physiological context in which Pph21 and Pph22 are not interchangeable? The two genes are
    more than 90% identical and every process annotation rests on the double mutant or on B-subunit mutants, yet
    single deletions reportedly remove different fractions of total PP2A activity (about 51% versus 33%) and PPH21 is
    the more highly expressed gene; isoform-resolved holoenzyme composition and substrate assignment are missing.
  experts:
  - Egon Ogris
  - Veerle Janssens
  - Johan M. Thevelein
- question: Does the Tap42-Rrd2-Pph21 complex released from TORC1 have substrates of its own, distinct from those of
    PP2A-Cdc55/PP2A-Rts1, or does Tap42 act purely as a sequestering inhibitor whose release simply returns the C
    subunit to the canonical holoenzymes? The NDP-gene and Atg13 outputs have been assigned to different assemblies
    and the relationship between the two pools remains unresolved.
  experts:
  - Yu Jiang
  - James R. Broach
  - Takashi Ushimaru
- question: What is the function of the Apj1-dependent Pph21 subnuclear foci formed with Cmr1 and Hos2 after
    replication stress, and do they contain the Tpd3-Cdc55 holoenzyme implicated in checkpoint recovery?
  experts:
  - Grant W. Brown
suggested_experiments:
- hypothesis: Pph21 and Pph22 partition differently between the Cdc55, Rts1 and Tap42 assemblies.
  description: Quantitative affinity-purification mass spectrometry of endogenously tagged Pph21 and Pph22 in the same
    strain background, with and without rapamycin and across a synchronised cell cycle, to measure the stoichiometry
    of each catalytic subunit in the Tpd3-Cdc55, Tpd3-Rts1 and Tap42-Rrd2 complexes, followed by phosphoproteomics of
    pph21 versus pph22 single mutants under the same conditions to test for isoform-specific substrates.
  experiment_type: AP-MS stoichiometry / phosphoproteomics
- hypothesis: Atg13 is a direct substrate of Pph21-containing PP2A holoenzymes after TORC1 inactivation.
  description: Reconstitute Tpd3-Pph21-Cdc55 and Tpd3-Pph21-Rts1 from yeast and assay dephosphorylation of
    TORC1-phosphorylated Atg13 in vitro with phosphosite mapping, comparing with the Tap42-Rrd2-Pph21 complex purified
    from rapamycin-treated cells.
  experiment_type: in vitro reconstitution / phosphosite mapping
