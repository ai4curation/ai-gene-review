id: P23594
gene_symbol: PPH21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'PPH21 encodes one of the two catalytic (C) subunits of protein phosphatase 2A in Saccharomyces
  cerevisiae, a 369-residue PPP-family metallophosphoesterase (EC 3.1.3.16, two active-site manganese ions) that is
  the orthologue of human PPP2CA/PPP2CB. Its paralogue Pph22 is more than 90% identical and functionally redundant:
  either single deletion is tolerated, the two genes together account for essentially all PP2A activity in the cell,
  and the double deletion is lethal or, in some backgrounds, gives very slow growth with G2 accumulation, aberrant
  bud morphology and a disorganised actin cytoskeleton. Pph21 hydrolyses phosphoserine and phosphothreonine residues
  on protein substrates, but on its own it is a promiscuous, low-activity enzyme; physiological specificity is imposed
  by holoenzyme assembly. The newly made C subunit is switched into an active conformation by the PTPA homologue Rrd2
  acting together with the scaffold subunit Tpd3, is reversibly carboxymethylated on its C-terminal Leu-369 by the
  methyltransferase Ppm1 and demethylated by the methylesterase Ppe1, and methylation promotes binding of the
  Tpd3-Pph21 core dimer to the B-type subunit Cdc55 or the B''-type subunit Rts1. The resulting PP2A-Cdc55 and
  PP2A-Rts1 heterotrimers dephosphorylate Cdk1 (Cdc28)- and Polo-dependent phosphosites and thereby promote mitotic
  entry by opposing Swe1-dependent Tyr19 phosphorylation of Cdc28, restrain mitotic exit by keeping Net1 and
  APC-Cdc20 underphosphorylated until anaphase, sustain spindle-checkpoint arrest, and support polarised growth,
  actin organisation and cytokinesis. A minor pool of Pph21 (a few percent in growing cells) is bound instead by the
  essential protein Tap42, together with Rrd2, in a complex that is held on TORC1-containing membranes while nutrients
  are plentiful; rapamycin or nutrient deprivation releases the Tap42-Pph21 complex into the cytosol, and PP2A activity
  is then required for the TORC1-inactivation transcriptional programme (nitrogen-discrimination-pathway genes) and
  for dephosphorylation of Atg13, activation of the Atg1 kinase and assembly of the pre-autophagosomal structure.
  Cdc55/Tpd3 in turn compete with Tap42 for the catalytic subunit and promote Tap42 dephosphorylation, closing a
  regulatory loop between the two pools. Glucose re-addition to starved cells rapidly activates PP2A by C-subunit
  methylation, and the enzyme contributes to glucose repression of SUC2. Pph21 is distributed throughout the
  cytoplasm and enriched in the nucleus at all cell-cycle stages, with transient enrichment at bud tips and the
  post-telophase bud neck, is found in stress-granule cores, and forms Apj1-dependent subnuclear foci with Cmr1 and
  Hos2 after DNA replication stress.'
