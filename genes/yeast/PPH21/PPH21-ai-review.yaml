    action: ACCEPT
    reason: Direct biochemical demonstration that Pph21 is the catalytic subunit of the Tpd3-containing PP2A core and
      holoenzymes, that its activation is coupled to assembly with Tpd3 (activity falls to about 25% in tpd3 cells)
      and that methylation controls its association with Cdc55/Rts1. Core function.
    supported_by:
    - reference_id: PMID:17550305
      supporting_text: Analysis of the HA-PPH21 immunoprecipitates with antibodies to the A subunit, TPD3, revealed
        that these proteins indeed are in the same multimeric complex.
    - reference_id: PMID:17550305
      supporting_text: Contrary to the prediction, the catalytic activity of PPH21 or PPH22 from a strain lacking the
        TPD3 subunit was decreased to approximately 25% or approximately 18%, respectively, of the wild-type activity.
