- source: Alliance_Imported
  text: Catalytic subunit of protein phosphatase 2A, PP2A; functionally redundant
    with Pph22p; C-terminally methylated; forms alternate complexes with several regulatory
    subunits; involved in signal transduction and regulation of mitosis; forms nuclear
    foci upon DNA replication stress; interaction with Tpd3p and Far11p of the PPG1-FAR
    complex antagonizes TORC2 signaling; PPH21 has a paralog, PPH22, that arose from
    the whole genome duplication
  source_type: curated
