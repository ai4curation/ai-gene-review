descriptions:
- source: UniProt
  text: Exact function not known, phosphatase 2A performs an essential cellular function.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23594
  source_id: P23594
- source: Alliance_Imported
  text: Catalytic subunit of protein phosphatase 2A, PP2A; functionally redundant
    with Pph22p; C-terminally methylated; forms alternate complexes with several regulatory
    subunits; involved in signal transduction and regulation of mitosis; forms nuclear
    foci upon DNA replication stress; interaction with Tpd3p and Far11p of the PPG1-FAR
    complex antagonizes TORC2 signaling; PPH21 has a paralog, PPH22, that arose from
    the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/PPH21
  source_id: SGD:S000002292
- source: Alliance_Automated
  text: Enables protein serine/threonine phosphatase activity. Involved in G1/S transition
    of mitotic cell cycle; positive regulation of autophagosome assembly; and regulation
    of translation. Acts upstream of or within regulation of TORC1 signaling. Located
    in cytoplasmic stress granule and nucleus. Part of protein phosphatase type 2A
    complex. Orthologous to several human genes including PPP2CA (protein phosphatase
    2 catalytic subunit alpha).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PPH21
  source_id: SGD:S000002292
