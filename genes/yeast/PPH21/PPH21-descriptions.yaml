- source: Alliance_Automated
  text: Enables protein serine/threonine phosphatase activity. Involved in G1/S transition
    of mitotic cell cycle; positive regulation of autophagosome assembly; and regulation
    of translation. Acts upstream of or within regulation of TORC1 signaling. Located
    in cytoplasmic stress granule and nucleus. Part of protein phosphatase type 2A
    complex. Orthologous to several human genes including PPP2CA (protein phosphatase
    2 catalytic subunit alpha).
  source_type: automated
