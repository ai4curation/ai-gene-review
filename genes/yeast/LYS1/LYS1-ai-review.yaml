- term:
    id: GO:0019477
    label: L-lysine catabolic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:LYSDEGII-PWY
  review:
    summary: Generated from the YeastPathways lysine degradation diagram (LYSDEGII-PWY), which uses the
      reverse saccharopine dehydrogenase reaction (lysine + 2-oxoglutarate -> saccharopine). Lys1 can
      catalyse the reverse reaction in vitro, but the experimentally characterised physiological role
      of Lys1 is the lysine-forming direction, and no S. cerevisiae evidence reviewed here shows Lys1-dependent
      lysine catabolism. Lysine degradation via saccharopine is the role of the bifunctional AASS-type
      enzymes in plants and animals.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:35563734
      supporting_text: Lys1 can convert saccharopine to lysine or the reverse reaction depending on the
        local pH in the active site
    - reference_id: PMID:17002315
      supporting_text: suggesting the ordered addition of nicotinamide adenine dinucleotide (NAD) followed
        by saccharopine in the physiologic reaction direction
