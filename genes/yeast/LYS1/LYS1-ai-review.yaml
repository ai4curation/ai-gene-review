suggested_questions:
- question: Does Lys1 contribute to lysine catabolism in S. cerevisiae under any condition (e.g. lysine
    excess), or is the reverse saccharopine-forming reaction physiologically irrelevant in this yeast?
- question: Is the mRNA binding of Lys1 (>1,000 transcripts, enriched for membrane-protein mRNAs) functionally
    relevant, and does it occur in the cytosol before peroxisomal import?
