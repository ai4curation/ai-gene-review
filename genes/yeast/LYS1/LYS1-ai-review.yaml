gene_symbol: LYS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Saccharopine dehydrogenase [NAD+, L-lysine-forming] (EC 1.5.1.7) of Saccharomyces cerevisiae.
  Lys1 catalyses the final step of the fungal alpha-aminoadipate pathway of lysine biosynthesis, the NAD+-dependent
  cleavage of saccharopine to L-lysine and 2-oxoglutarate. It is a monomeric Rossmann-fold enzyme with
  an ordered kinetic mechanism (NAD+ binds before saccharopine). Lys1 carries a C-terminal PTS1 and is
  imported by Pex5 into the peroxisomal matrix, so lysine synthesis is completed inside peroxisomes; NAD+
  for the reaction is regenerated there by the Mdh3 and Gpd1 redox shuttles, and Lys1 still supports lysine
  synthesis when mislocalised to the cytosol. Lys1 abundance in peroxisomes is increased by the small
  matrix protein Pls1, whose own peroxisomal import depends on Lys1. Lys1 is induced by the Lys14/alpha-aminoadipate
  semialdehyde system and repressed by lysine, and it has also been detected as an mRNA-binding protein.
