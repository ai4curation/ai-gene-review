gene_symbol: LYS1
organism: yeast
uniprot_id: P38998
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the NAD(+)-dependent cleavage of saccharopine to L- lysine and 2-oxoglutarate,
    the final step in the alpha-aminoadipate (AAA) pathway for lysine biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38998
  source_id: P38998
- source: Alliance_Imported
  text: Saccharopine dehydrogenase (NAD+, L-lysine-forming); catalyzes the conversion
    of saccharopine to L-lysine, which is the final step in the lysine biosynthesis
    pathway; contains mRNA binding activity; required for targeting of Pls1p to the
    peroxisomal matrix in the absence of lysine
  source_type: curated
  url: https://www.yeastgenome.org/locus/LYS1
  source_id: SGD:S000001473
- source: Alliance_Automated
  text: Enables mRNA binding activity and saccharopine dehydrogenase (NAD+, L-lysine-forming)
    activity. Involved in L-lysine biosynthetic process. Acts upstream of or within
    protein import into peroxisome matrix. Located in peroxisome.
  source_type: automated
  url: https://www.yeastgenome.org/locus/LYS1
  source_id: SGD:S000001473
