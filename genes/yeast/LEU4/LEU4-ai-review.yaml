description: 'Major 2-isopropylmalate synthase (alpha-isopropylmalate synthase, alpha-IPMS, EC 2.3.3.13)
  of Saccharomyces cerevisiae, catalysing the first committed step of leucine biosynthesis: condensation
  of acetyl-CoA with 3-methyl-2-oxobutanoate (alpha-ketoisovalerate) to give 2-isopropylmalate. LEU4 encodes
  two forms by alternative translation initiation: a long form imported into mitochondria, which provides
  most cellular alpha-IPMS activity, and a short cytosolic form that is also functional. 2-Isopropylmalate
  made in mitochondria is exported to the cytosol by the Oac1 carrier, where it is converted by Leu1 and
  Leu2 and also acts as the coactivator of the transcription factor Leu3. Leu4 homodimers are feedback-inhibited
  by leucine, whereas its paralog Leu9 is leucine-resistant; Leu4-Leu9 heterodimers form in vivo with
  intermediate regulation. leu4 deletion leaves ~20% residual activity from Leu9, and leu4 leu9 double
  mutants are leucine auxotrophs.'
