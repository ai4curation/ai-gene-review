gene_symbol: ILV5
organism: yeast
uniprot_id: P06168
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in the biosynthesis of branched-chain amino acids (BCAA). Catalyzes
    the second common step in the parallel biosynthesis of isoleucine and valine.
    Converts alpha-aceto-alpha-hydroxybutyrate (AHB) to alpha,beta-dihydroxy-beta-methylvalerate
    (DHMV) and alpha- acetolactate (AL) to alpha,beta-dihydroxy-isovalerate (DHV)
    in isoleucine and valine biosynthesis, respectively.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P06168
  source_id: P06168
- source: Alliance_Imported
  text: Acetohydroxyacid reductoisomerase and mtDNA binding protein; involved in branched-chain
    amino acid biosynthesis and maintenance of wild-type mitochondrial DNA; found
    in mitochondrial nucleoids
  source_type: curated
  url: https://www.yeastgenome.org/locus/ILV5
  source_id: SGD:S000004347
- source: Alliance_Automated
  text: Enables double-stranded DNA binding activity and ketol-acid reductoisomerase
    activity. Involved in branched-chain amino acid biosynthetic process and negative
    regulation of mitochondrial DNA metabolic process. Located in mitochondrial nucleoid.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ILV5
  source_id: SGD:S000004347
