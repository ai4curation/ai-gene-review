  evidence_type: IGI
  original_reference_id: PMID:18826960
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000956
  review:
    summary: OXA1 multicopy suppression of mtDNA instability in the ilv5 W327R mutant. GO:1901859 'negative
      regulation of mitochondrial DNA metabolic process' records the mtDNA-stability phenotype; the former
      term 'mitochondrial genome maintenance' (GO:0000002) is now obsolete. The regulatory-sign framing
      is awkward (ilv5 loss causes mtDNA loss, i.e. Ilv5 protects/maintains mtDNA, probably as a nucleoid
      DNA-binding protein) but no better live GO process exists. Second, genetically separable function
      of Ilv5; non-core relative to catalysis.
