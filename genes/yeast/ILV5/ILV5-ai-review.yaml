id: P06168
gene_symbol: ILV5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ILV5 encodes the mitochondrial ketol-acid reductoisomerase (acetohydroxyacid reductoisomerase,
  KARI, EC 1.1.1.86) of Saccharomyces cerevisiae, one of the most abundant mitochondrial matrix proteins.
  Using NADPH and Mg2+, it converts 2-acetolactate to 2,3-dihydroxyisovalerate and 2-aceto-2-hydroxybutyrate
  to 2,3-dihydroxy-3-methylvalerate, the second step shared by valine and isoleucine biosynthesis; ilv5
  mutants require isoleucine and valine. ILV5 is regulated by general amino acid control and leucine.
  Ilv5 is also a bifunctional mtDNA nucleoid protein: it binds double-stranded DNA, associates with nucleoids
  (more so in abf2 cells), and is required for stable inheritance of rho+ mtDNA independently of its enzymatic
  activity, as point mutations separate the two functions and ILV5 overexpression suppresses mtDNA loss
  in abf2 mutants. Cytosol-targeted truncated Ilv5 is used in brewing yeast to reduce vicinal diketone
  (diacetyl) formation.'
