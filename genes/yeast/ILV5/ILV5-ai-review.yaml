suggested_questions:
- question: GO:0000002 mitochondrial genome maintenance is obsolete; is GO:1901859 negative regulation
    of mitochondrial DNA metabolic process really the intended replacement for nucleoid proteins such
    as Ilv5 whose loss causes mtDNA loss?
suggested_experiments:
- hypothesis: The mtDNA-maintenance function of Ilv5 requires its DNA binding but not catalysis.
  description: Compare DNA-binding (EMSA) and nucleoid association of catalytic-dead and mtDNA-defective
    (e.g. W327R) Ilv5 variants with rho+ maintenance in ilv5 and abf2 ilv5 strains.
