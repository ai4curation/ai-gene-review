id: P19414
gene_symbol: ACO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ACO1 encodes the major aconitase (aconitate hydratase, EC 4.2.1.3) of Saccharomyces cerevisiae,
  a [4Fe-4S] cluster enzyme of the aconitase/IPM isomerase family that interconverts citrate and D-threo-isocitrate
  via cis-aconitate. Most of the protein is imported into the mitochondrial matrix, where it catalyses
  the second step of the tricarboxylic acid cycle; aco1 null mutants are glutamate auxotrophs and cannot
  grow on non-fermentable carbon sources. A small cytosolic pool (about 6%) derived from the same translation
  product supplies the isocitrate needed by the cytosolic glyoxylate shunt. ACO1 also makes a minor contribution
  to the homocitrate-to-homoaconitate step of lysine biosynthesis, a reaction handled mainly by its paralog
  ACO2. Independently of catalysis, Aco1p is a component of mitochondrial nucleoids, binds single- and
  double-stranded DNA and is required for mitochondrial DNA maintenance.
