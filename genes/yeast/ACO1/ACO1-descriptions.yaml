gene_symbol: ACO1
organism: yeast
uniprot_id: P19414
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the isomerization of citrate to isocitrate via cis- aconitate, a
    step in the citric acid cycle. Can also provide minor contributions to the reversible
    dehydration of (R)-homocitrate to cis- homoaconitate, a step in the alpha-aminoadipate
    pathway for lysine biosynthesis. Also plays an essential role in mtDNA maintenance.
    May directly protect mtDNA from accumulation of point mutations and ssDNA breaks
    as a component of mitochondrial nucleoids, or by preventing accumulation of iron
    citrate thereby alleviating its detrimental effects in mitochondria.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P19414
  source_id: P19414
- source: Alliance_Imported
  text: 'Aconitase; required for the tricarboxylic acid (TCA) cycle and also independently
    required for mitochondrial genome maintenance; component of the mitochondrial
    nucleoid; mutation leads to glutamate auxotrophy; mutation in human homolog ACO2
    is associated with dominant optic nerve atrophy; human homolog ACO2 can complement
    yeast null mutant '
  source_type: curated
  url: https://www.yeastgenome.org/locus/ACO1
  source_id: SGD:S000004295
- source: Alliance_Automated
  text: Enables several functions, including DNA binding activity; aconitate hydratase
    activity; and iron-sulfur cluster binding activity. Involved in tricarboxylic
    acid cycle. Located in cytosol and mitochondrial nucleoid. Used to study central
    nervous system disease; neurodegenerative disease; optic atrophy 9; and optic
    nerve disease. Human ortholog(s) of this gene implicated in infantile cerebellar-retinal
    degeneration and optic atrophy 9. Orthologous to human ACO2 (aconitase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ACO1
  source_id: SGD:S000004295
