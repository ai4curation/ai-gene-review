descriptions:
- source: UniProt
  text: Catalyzes the isomerization of citrate to isocitrate via cis- aconitate, a
    step in the citric acid cycle. Can also provide minor contributions to the reversible
    dehydration of (R)-homocitrate to cis- homoaconitate, a step in the alpha-aminoadipate
    pathway for lysine biosynthesis. Also plays an essential role in mtDNA maintenance.
    May directly protect mtDNA from accumulation of point mutations and ssDNA breaks
    as a component of mitochondrial nucleoids, or by preventing accumulation of iron
    citrate thereby alleviating its detrimental effects in mitochondria.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P19414
