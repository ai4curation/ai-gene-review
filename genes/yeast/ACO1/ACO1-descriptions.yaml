- source: Alliance_Automated
  text: Enables several functions, including DNA binding activity; aconitate hydratase
    activity; and iron-sulfur cluster binding activity. Involved in tricarboxylic
    acid cycle. Located in cytosol and mitochondrial nucleoid. Used to study central
    nervous system disease; neurodegenerative disease; optic atrophy 9; and optic
    nerve disease. Human ortholog(s) of this gene implicated in infantile cerebellar-retinal
    degeneration and optic atrophy 9. Orthologous to human ACO2 (aconitase 2).
