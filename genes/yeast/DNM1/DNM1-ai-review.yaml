id: P54861
gene_symbol: DNM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Dnm1 is the Saccharomyces cerevisiae dynamin-related GTPase (DRP1 ortholog) that divides
  mitochondria. A soluble cytosolic pool is recruited to the cytoplasmic face of the mitochondrial outer
  membrane by the tail-anchored receptor Fis1 and the adaptors Mdv1 and Caf4, at sites often marked by
  ER tubules. There Dnm1 self-assembles, through its GTPase, middle and GTPase effector (GED) domains,
  into helical spirals whose diameter matches constricted mitochondria; GTP hydrolysis drives a conformational
  change that constricts the underlying membrane. Loss of Dnm1 produces net-like, interconnected mitochondria
  and suppresses fragmentation of fusion-defective fzo1 mutants, showing that Dnm1 fission opposes Fzo1/Mgm1
  fusion. Dnm1 also contributes, together with Vps1, to peroxisome division, and to selective autophagy
  of organelles including nucleophagy, and associates with Num1 cortical anchoring sites that influence
  mitochondrial inheritance.
existing_annotations:
- term:
    id: GO:0000001
    label: mitochondrion inheritance
  evidence_type: IGI
  original_reference_id: PMID:17336903
  qualifier: involved_in
  supporting_entities:
  - SGD:S000002557
  review:
    summary: 'Mitochondrion inheritance (IGI with NUM1): num1 dnm1 double mutants show defective mitochondrial
      transmission between mother and bud.'
    action: KEEP_AS_NON_CORE
    reason: Genetic interaction supports a contribution of Dnm1 (at Num1 cortical anchoring sites) to
      mitochondrial partitioning, but this is secondary to its core fission function.
    supported_by:
    - reference_id: PMID:17336903
      supporting_text: we find that num1 dnm1 double mutants accumulate mitochondria in daughter buds
        and that mother cells are frequently devoid of all mitochondria
    - reference_id: PMID:23341591
      supporting_text: Although the functional significance of Dnm1 at Num1 clusters is not clear, its
        dependence on Caf4 suggests that Dnm1 activity at Num1-tethering sites is different from its activity
        at mitochondrial-division sites.
- term:
    id: GO:0000266
    label: mitochondrial fission
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000174679
  - PANTHER:PTN002480318
  - PomBase:SPBC12C2.08
  - SGD:S000003924
  review:
    summary: Mitochondrial fission. Dnm1 is the dynamin-related GTPase that assembles into helical spirals
      on the mitochondrial outer membrane and constricts it to divide mitochondria; dnm1 mutants have
      net-like, fission-defective mitochondria.
    action: ACCEPT
    reason: Core process, supported by mutant phenotypes (IMP, IGI with FZO1), in vitro assembly/constriction
      (TAS/IDA), the PANTHER IBA and ARBA. Dnm1 performs the constriction step itself.
    supported_by:
    - reference_id: PMID:10559943
      supporting_text: 'Genetic studies indicate that the activities of the GTPases Dnm1 and Fzo1 are
        antagonistic: dnm1 mutations block the mitochondrial fission and fragmentation normally observed
        in the fzo1 mutant strain.'
    - reference_id: PMID:16272155
      supporting_text: The dynamin-related GTPase, Dnm1, self-assembles into punctate structures that
        are targeted to the outer mitochondrial membrane where they mediate mitochondrial division.
    - reference_id: PMID:21170049
      supporting_text: Both dynamin and now Dnm1 have been shown to actively constrict the underlying
        lipid bilayer upon GTP hydrolysis
    - reference_id: PMID:16186251
      supporting_text: suggest a model in which the Fis1–Mdv1 complex triggers division by promoting the
        self-assembly of Dnm1 spirals on the mitochondrial outer membrane
