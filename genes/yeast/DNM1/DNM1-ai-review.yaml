core_functions:
- description: Dynamin-family GTPase that self-assembles into helices on the mitochondrial outer membrane
    and uses GTP hydrolysis to constrict and divide mitochondria.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0000266
    label: mitochondrial fission
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:11553714
    supporting_text: we show that bacterially expressed Dnm1p can bind and hydrolyze GTP in vitro
  - reference_id: PMID:21170049
    supporting_text: Additionally, we show that Dnm1-lipid tubes constrict by ~50 nm upon addition of
      GTP.
  - reference_id: PMID:10559943
    supporting_text: 'Genetic studies indicate that the activities of the GTPases Dnm1 and Fzo1 are antagonistic:
      dnm1 mutations block the mitochondrial fission and fragmentation normally observed in the fzo1 mutant
      strain.'
- description: The same Dnm1 GTPase machinery, recruited by Fis1/Mdv1/Caf4, divides peroxisomes (redundantly
    with Vps1).
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0016559
    label: peroxisome fission
  locations:
  - id: GO:0005777
    label: peroxisome
  supported_by:
  - reference_id: PMID:16968746
    supporting_text: Fluorescence microscopy of cells producing Dnm1-GFP or GFP-Fis1p demonstrated that
      both proteins had a dual localization on mitochondria and peroxisomes.
  - reference_id: PMID:18445678
    supporting_text: Dnm1p-dependent peroxisome fission requires Caf4p, Mdv1p and Fis1p.
suggested_questions:
- question: Is Dnm1 constriction sufficient for complete scission of both mitochondrial membranes in vivo,
    or are additional factors (e.g. Vps1/dynamin-2 equivalents, inner-membrane constriction) required?
- question: What distinguishes Dnm1 activity at Num1 cortical anchors from its activity at division sites?
suggested_experiments:
- description: Time-resolved cryo-ET of Dnm1 spirals on mitochondria in Fis1/Mdv1/Caf4 mutants to determine
    which adaptor controls spiral nucleation versus constriction.
