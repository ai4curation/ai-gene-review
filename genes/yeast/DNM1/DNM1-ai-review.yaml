  review:
    summary: GTPase activity. Recombinant Dnm1 binds and hydrolyses GTP; assembly stimulates hydrolysis,
      and GTP hydrolysis drives constriction of Dnm1-lipid tubes.
    action: ACCEPT
    reason: Core molecular function, directly demonstrated (IDA in several papers), consistent with the
      conserved dynamin-type G domain (IEA, IBA).
    supported_by:
    - reference_id: PMID:11553714
      supporting_text: we show that bacterially expressed Dnm1p can bind and hydrolyze GTP in vitro
    - reference_id: PMID:16186251
      supporting_text: Steady-state kinetics of Dnm1 GTPase activity under assembly conditions.
    - reference_id: PMID:21170049
      supporting_text: Additionally, we show that Dnm1-lipid tubes constrict by ~50 nm upon addition of
        GTP.
