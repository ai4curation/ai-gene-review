gene_symbol: DNM1
organism: yeast
uniprot_id: P54861
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Microtubule-associated force-producing protein that participates mitochondrial
    fission. Fission of mitochondria occurs in many cell types and constitutes an
    important step in mitochondria morphology, which is balanced between fusion and
    fission. Functions antagonistically with FZO1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54861
  source_id: P54861
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Calls Dnm1 microtubule-associated, a claim the review marks as
      over-annotated. Names fission and FZO1 antagonism but not GTPase activity, Fis1/Mdv1
      or peroxisome division.
- source: Alliance_Imported
  text: Dynamin-related GTPase involved in mitochondrial organization; required for
    mitochondrial fission and inheritance; self assembles on mitochondrial tubules
    at incipient division sites; involved in endocytosis; regulates peroxisome fission
    with Vps1p; role in nuclear envelope remodeling during nucleophagy; mutants in
    human ortholog DNM1L, which mediates mitochondrial fission, peroxisomal division,
    autophagy, and mitophagy, are associated with slowly progressive infantile encephalopathy
  source_type: curated
  url: https://www.yeastgenome.org/locus/DNM1
  source_id: SGD:S000003924
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 5
    - rubric: specificity
      score: 4
    overall_notes: 'Broad and current: GTPase, assembly at division sites, peroxisome
      fission with Vps1, nucleophagy. Adds an endocytosis role.'
- source: Alliance_Automated
  text: Enables GTPase activity and identical protein binding activity. Involved in
    several processes, including mitochondrion inheritance; organelle fission; and
    protein homooligomerization. Acts upstream of or within intracellular distribution
    of mitochondria; membrane bending; and membrane fission. Located in cytosol; mitochondrial
    outer membrane; and peroxisome. Is active in mitochondrion. Used to study encephalopathy
    due to defective mitochondrial and peroxisomal fission 1. Human ortholog(s) of
    this gene implicated in encephalopathy due to defective mitochondrial and peroxisomal
    fission 1 and optic atrophy 5. Orthologous to human DNM1L (dynamin 1 like).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DNM1
  source_id: SGD:S000003924
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: GTPase activity is correct. Leads with identical protein binding
      and protein homooligomerization, and the location list is long.
findings:
- category: discrepancy
  text: UniProt calls Dnm1 a microtubule-associated protein. The review marks microtubule
    and microtubule binding as over-annotations.
  sources:
  - UniProt
- category: gap
  text: SGD says Dnm1 is involved in endocytosis. The review does not mention endocytosis.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: Agreement on the mitochondrial fission dynamin. UniProt alone gives
    a microtubule association.
