id: P47143
gene_symbol: ADO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADO1 (YJR105W) encodes adenosine kinase, a PfkB-family (ribokinase-like) carbohydrate kinase that phosphorylates
  adenosine to AMP using ATP. The recombinant enzyme has a Km of about 3 microM for adenosine and also phosphorylates,
  much less efficiently, nucleoside analogues such as cordycepin (3'-deoxyadenosine). ado1 deletion abolishes most
  adenosine kinase activity in extracts, prevents use of S-adenosylmethionine as a purine source, causes adenosine
  excretion and confers cordycepin resistance, but has little effect on adenine utilisation. Its main physiological
  role appears to be recycling of the adenosine generated by the methyl cycle (AdoMet -> S-adenosylhomocysteine
  -> adenosine + homocysteine) back into the adenine nucleotide pool. Ado1 is an abundant soluble protein reported
  in the cytoplasm and nucleus.
