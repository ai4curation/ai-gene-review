suggested_questions:
- question: Is the nuclear pool of Ado1 functionally linked to nuclear methylation reactions (removal of adenosine/SAH
    near chromatin), as proposed for the mammalian nuclear ADK isoform?
suggested_experiments:
- description: Measure intracellular SAH, adenosine and methylation index (AdoMet/SAH) in ado1 deletion strains,
    and test whether cytoplasm-restricted Ado1 fully complements.
