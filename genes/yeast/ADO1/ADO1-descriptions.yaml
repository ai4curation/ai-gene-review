gene_symbol: ADO1
organism: yeast
uniprot_id: P47143
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: ATP dependent phosphorylation of adenosine and other related nucleoside analogs
    to monophosphate derivatives. ADO1 does not play a major role in adenine utilization
    in yeast. Its physiological role could primarily be to recycle adenosine produced
    by the methyl cycle.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47143
  source_id: P47143
- source: Alliance_Imported
  text: Adenosine kinase; required for the utilization of S-adenosylmethionine (AdoMet);
    may be involved in recycling adenosine produced through the methyl cycle
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADO1
  source_id: SGD:S000003866
- source: Alliance_Automated
  text: Enables adenosine kinase activity. Involved in purine nucleobase metabolic
    process. Located in cytoplasm and nucleus. Human ortholog(s) of this gene implicated
    in hypermethioninemia due to adenosine kinase deficiency. Orthologous to human
    ADK (adenosine kinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADO1
  source_id: SGD:S000003866
