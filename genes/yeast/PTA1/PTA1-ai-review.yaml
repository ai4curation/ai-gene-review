      subunits) and as a phosphoregulated subunit whose dephosphorylation by Glc7 is required for poly(A) addition.
      It does not catalyse cleavage or polyadenylation, and it is dispensable in a fully recombinant reconstituted
      CPF, so the claim is scaffold participation in vivo, not catalysis. The general 3'-end processing term is
      used rather than the co-transcriptional cleavage-and-polyadenylation pathway child because the IMP evidence
      is from extracts.
