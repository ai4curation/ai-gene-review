- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IC
  original_reference_id: PMID:10523662
  qualifier: contributes_to
  supporting_entities:
  - GO:0005847
  review:
    summary: Curator inference that Pta1, as a CF II subunit, contributes to the RNA binding of the complex.
    action: KEEP_AS_NON_CORE
    reason: 'The contributes_to qualifier is respected: CF II binds pre-mRNA in a sequence-specific, ATP-dependent
      manner through its Cft2 subunit, and Pta1 is a CF II subunit, so the complex-level claim holds. There is no
      evidence that Pta1 itself contacts RNA; its role in CPF is structural and regulatory, so this is kept as non-core
      rather than as a core function.'
    supported_by:
    - reference_id: PMID:9099738
      supporting_text: Cft2 is cross-linked to pre-mRNA substrate containing the poly(A) site
    - reference_id: PMID:9099738
      supporting_text: The specific binding of Cft2 to the RNA substrate is ATP-dependent
    - reference_id: PMID:10523662
      supporting_text: In this report, we show by protein sequencing and immunoreactivity that the fourth subunit
        of CF II is Pta1, an essential 90-kDa protein originally implicated in tRNA splicing.
