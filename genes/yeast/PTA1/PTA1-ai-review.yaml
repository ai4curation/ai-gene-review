    label: mRNA 3'-end processing
  - id: GO:0030846
    label: termination of RNA polymerase II transcription, poly(A)-coupled
  in_complex:
    id: GO:0005847
    label: mRNA cleavage and polyadenylation specificity factor complex
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19188448
    supporting_text: Furthermore, different regions of Pta1 interact with the CPF subunits Ssu72, Pti1, and Ysh1,
      supporting the idea that Pta1 acts as a scaffold to organize CPF.
  - reference_id: PMID:10523662
    supporting_text: Extracts prepared from pta1 mutant strains are impaired in the cleavage and the poly(A) addition
      of both GAL7 and CYC1 substrates and exhibit little processing activity even after prolonged incubation.
  - reference_id: PMID:29074584
    supporting_text: the phosphatase module contains seven subunits (Pta1, Ref2, Pti1, Swd2, Glc7, Ssu72, and Syc1)
  - reference_id: PMID:16319194
    supporting_text: Moreover, we establish that looping is a consequence of terminator contact with the promoter
      and is dependent upon the Ssu72 and Pta1 components of the CPF complex.
suggested_questions:
- question: Does Pta1 itself contribute to sn/snoRNA (Nrd1-Nab3-Sen1, exosome-coupled) termination? The pta1-Delta75
    allele is defective in snoRNA termination, but later work summarises Pta1 as not regulating sn/snoRNA termination;
    is the Delta75 effect purely loss of Ssu72 recruitment?
- question: Is the pta1-1 pre-tRNA accumulation an indirect consequence of impaired Pol II 3'-end formation or termination,
    or does Pta1/APT act on Pol III transcripts or tRNA processing factors?
- question: Which kinase and which Pta1 residues mediate the phospho-regulation of polyadenylation reversed by Glc7,
    and how does phosphorylation change Pta1 contacts with Fip1 and other CPF subunits?
suggested_experiments:
- description: Cryo-EM or crosslinking-MS of endogenous CPF and APT to map the Pta1 HEAT-repeat surfaces that contact
    Ssu72, Pap1, Pti1, Glc7 and Ysh1/Syc1, followed by point mutants that disrupt single contacts and genome-wide
    nascent RNA (NET-seq) readthrough analysis.
- description: Rapid auxin-degron depletion of Pta1 versus Ssu72 with northern/RNA-seq of pre-tRNAs and snoRNAs
    to separate direct from secondary effects on tRNA processing and snoRNA termination.
