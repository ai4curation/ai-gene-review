core_functions:
- description: Scaffold subunit of the CPF phosphatase module that binds Ssu72, Pap1, Pti1, Glc7 and Ysh1 through
    distinct regions, holding CPF (and the APT complex) together and coupling mRNA 3'-end cleavage/polyadenylation
    to Pol II transcription termination.
