- term:
    id: GO:0008033
    label: tRNA processing
  evidence_type: IMP
  original_reference_id: PMID:1508188
  qualifier: involved_in
  review:
    summary: The pta1-1 nonsense allele accumulates end-trimmed, intron-containing pre-tRNAs.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The phenotype is real but there is no evidence that Pta1 performs or structurally supports a step of
      tRNA processing: splicing endonuclease activity is normal in pta1-1 extracts, and after Pta1 was shown to
      be a CF II/CPF subunit the cause of the tRNA defect was stated to be unknown. The mutant also cripples mRNA
      3''-end formation and Pol II termination, so the pre-tRNA defect is most plausibly indirect. PAINT curators
      propagated CPF membership but not tRNA processing from this donor. The row is flagged rather than removed
      because it is an experimental observation whose full text was not available here.'
    supported_by:
    - reference_id: PMID:1508188
      supporting_text: pta1-1, that causes the accumulation of all 10 end-trimmed, intron-containing pre-tRNAs
    - reference_id: PMID:1508188
