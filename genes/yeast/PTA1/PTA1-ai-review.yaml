- id: file:yeast/PTA1/PTA1-deep-research-sgd.md
  title: SGD gene description for PTA1 (yeast)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: SGD curated description (uncited, undated). Checked claims. Holo-CPF subunit required
      for mRNA and snoRNA 3'-end cleavage and polyadenylation holds (PMID:10523662), as does binding to
      the phosphorylated Pol II CTD. "Involved in pre-tRNA processing" rests on the pta1-1 nonsense allele
      that accumulates intron-containing pre-tRNAs while splicing endonuclease activity stays normal (PMID:1508188);
      the cause of this phenotype is not known (PMID:10523662). As a mutant phenotype the wording is defensible,
      but the review treats the tRNA processing term as over-annotated and probably indirect.
- id: file:yeast/PTA1/PTA1-uniprot.txt
  title: UniProt entry Q01329 (PTA1)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The FUNCTION comment's CPF and APT complex statements hold. Its opening sentence, "Essential
      in pre-tRNA processing", turns a pre-tRNA accumulation phenotype of one nonsense allele into an essential
      function. Pta1 is essential, but as a scaffold of CPF for mRNA 3'-end formation; no role in a pre-tRNA
      processing step has been shown and the cause of the phenotype is unknown.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q01329
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Essential in pre-tRNA processing.
      confidence: PROBABLE
      explanation: The PTA1_YEAST FUNCTION comment begins "Essential in pre-tRNA processing." The only
        tRNA evidence is that the pta1-1 nonsense allele accumulates end-trimmed intron-containing pre-tRNAs,
        while pta1-1 extracts have normal pre-tRNA splicing endonuclease activity (PMID:1508188). Pta1 was
        later identified as a subunit of CF II/CPF required for mRNA cleavage and polyadenylation, and
        the authors state that the cause of the tRNA splicing defect is not known (PMID:10523662). Pta1
        is essential, but its essential role is in mRNA 3'-end formation. Consider rewording to say that
        a pta1 mutant accumulates intron-containing pre-tRNAs by an unknown, possibly indirect, mechanism,
        and leading with the CPF function.
      supported_by:
      - reference_id: PMID:1508188
        supporting_text: Extracts prepared from pta1-1 strains had normal pre-tRNA splicing endonuclease
          activity.
      - reference_id: PMID:10523662
        supporting_text: The cause of the tRNA splicing defect in yeast is not known.
