id: Q01329
gene_symbol: PTA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Pta1 is an essential 785-residue nuclear protein of the symplekin/Pta1 family (ARM-like HEAT-repeat
  N-terminal domain, Pfam SYMPK_PTA1_N) that acts as the central scaffold of the phosphatase module of the cleavage
  and polyadenylation factor (CPF), the complex that cleaves pre-mRNAs at the poly(A) site, adds the poly(A) tail
  and couples 3'-end formation to RNA polymerase II termination. Identified biochemically as the fourth subunit
  of cleavage factor II, Pta1 binds Ssu72 and Pap1 through its N-terminal region and the Ysh1 endonuclease (or,
  alternatively, Syc1) through its C-terminal region, and also associates with Pti1, Ref2, Swd2 and the Glc7 phosphatase;
  it is likewise the organising subunit of the separate APT complex that acts mainly on non-coding Pol II transcripts.
  pta1 mutant extracts are defective in both cleavage and poly(A) addition, and dephosphorylation of Pta1 by Glc7
  is needed for polyadenylation, although Pta1 is dispensable for the chemical steps in a fully recombinant CPF.
  The Pta1 N-terminus is required for Ssu72 function in Pol II CTD Ser5 dephosphorylation, promoter-terminator gene
  looping and snoRNA termination. A pta1 nonsense allele also accumulates intron-containing pre-tRNAs, a phenotype
  of unknown, probably indirect, cause.
