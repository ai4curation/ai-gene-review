- term:
    id: GO:0031124
    label: mRNA 3'-end processing
  evidence_type: IMP
  original_reference_id: PMID:10523662
  qualifier: involved_in
  review:
    summary: pta1 mutant extracts are defective in both pre-mRNA cleavage and poly(A) addition, and are rescued
      by purified CF II.
    action: NEW
    reason: Current GOA carries no mRNA processing term for PTA1, although comparators in the same role carry one
      experimentally (yeast CFT2 and FIP1, IDA; PTI1, IMP; human symplekin SYMPK, same PANTHER subfamily, GO:0031124
