    overall_notes: Correct CPF and APT membership and 3'-end formation. Opens with
      'essential in pre-tRNA processing', which the review marks as an over-annotation
      from an indirect phenotype.
- source: Alliance_Imported
  text: Subunit of holo-CPF; holo-CPF is a multiprotein complex and functional homolog
    of mammalian CPSF, required for the cleavage and polyadenylation of mRNA and snoRNA
    3' ends; involved in pre-tRNA processing; binds to the phosphorylated CTD of RNAPII
