descriptions:
- source: UniProt
  text: Essential in pre-tRNA processing. Component of the cleavage and polyadenylation
    factor (CPF) complex, which plays a key role in polyadenylation-dependent pre-mRNA
    3'-end formation and cooperates with cleavage factors including the CFIA complex
    and NAB4/CFIB. Component of the APT complex, which may be involved in polyadenylation-independent
    transcript 3'-end formation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q01329
  source_id: Q01329
