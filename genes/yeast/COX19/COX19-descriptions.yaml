  text: Protein required for cytochrome c oxidase assembly; located in the cytosol
    and mitochondrial intermembrane space; putative copper metallochaperone that delivers
    copper to cytochrome c oxidase; contains twin cysteine-x9-cysteine motifs
  source_type: curated
  url: https://www.yeastgenome.org/locus/COX19
  source_id: SGD:S000007245
- source: Alliance_Automated
  text: Enables copper ion binding activity and protein folding chaperone. Involved
    in metal ion transport; mitochondrial respiratory chain complex IV assembly; and
    protein maturation. Located in cytosol and mitochondrial intermembrane space.
    Orthologous to human COX19 (cytochrome c oxidase assembly factor COX19).
