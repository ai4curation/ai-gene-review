descriptions:
- source: UniProt
  text: Assembly factor for cytochrome c oxidase (respiratory chain complex IV, CIV)
    (PubMed:12171940, PubMed:25926683). Acts as a COX11 chaperone that supports COX11
    copper coordination (PubMed:25926683). Cannot compensate for the absence of COX11
    (PubMed:25926683).
