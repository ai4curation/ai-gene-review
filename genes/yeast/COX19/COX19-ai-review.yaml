core_functions:
- description: Chaperone for the copper metallochaperone Cox11 in the mitochondrial intermembrane
    space. Cox19 binds a cysteine-containing sequence in Cox11 through a hydrophobic surface
    formed by two conserved tyrosine-leucine dipeptides on its helical hairpin; the interaction
    supports Cox11 copper coordination, is required for stable accumulation of Cox19 in mitochondria,
    and appears to be stimulated by oxidative modification of the target cysteine. Through
    this it is required for CuB-site metallation of Cox1 and for cytochrome c oxidase assembly.
