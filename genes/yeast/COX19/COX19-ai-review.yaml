  label: Saccharomyces cerevisiae
description: Cox19 is a 98-residue twin CX9C protein distributed between the cytosol and the
  mitochondrial intermembrane space, and is required for cytochrome c oxidase assembly. It
  acts as a chaperone for the copper metallochaperone Cox11, binding a cysteine-containing
  sequence in Cox11 through a hydrophobic surface on its helical hairpin defined by two conserved
  tyrosine-leucine dipeptides. The interaction appears to be redox regulated - oxidative modification
  of the target Cox11 cysteine stimulates Cox19 binding - and is required for stable accumulation
  of Cox19 in mitochondria. Cox19 resembles Cox17 in fold and in the ability to coordinate
  Cu(I) in vitro, but its established role is as a Cox11 chaperone supporting Cox11 copper
  coordination rather than as a copper donor in its own right. Cox19 is one of two intermembrane
  space twin CX9C proteins now known to converge on Cox11, the other being Coa4.
