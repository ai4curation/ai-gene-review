suggested_questions:
- question: Should GO:0030001 metal ion transport be retired for Cox19? It was inferred from
    resemblance to Cox17 rather than from demonstrated transport, and the mechanistic follow-up
    recasts Cox19 as a Cox11 chaperone rather than a copper carrier.
  experts:
  - SGD curators
  - GO transport curation group
- question: Cox19 and Coa4 are both intermembrane space twin CX9C proteins that act on Cox11.
    Do they bind Cox11 at the same site, compete, or act sequentially? Neither study examined
    the other protein.
  experts:
  - Herrmann lab
  - Gohil lab
  - Winge lab
- question: Is the in vitro Cu(I) coordination by Cox19 physiologically meaningful, or an
    incidental property of the twin CX9C fold shared with Cox17?
  experts:
  - Winge lab
suggested_experiments:
- hypothesis: Cox19 and Coa4 act on Cox11 at distinct sites and at distinct steps of CuB-site
    metallation.
  description: Test whether Coa4 and Cox19 co-occupy Cox11 by sequential immunoprecipitation,
    map each binding site by crosslinking, and assay complex IV assembly and Cox11 copper
    occupancy in single and double null strains.
  experiment_type: biochemical
- hypothesis: Cu(I) binding by Cox19 is dispensable for its function.
  description: Substitute the Cu(I)-coordinating residues of Cox19 while preserving the tyrosine-leucine
    Cox11-binding surface, and test respiratory growth, complex IV assembly and Cox11 binding.
  experiment_type: genetic
