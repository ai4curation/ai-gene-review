id: P27796
gene_symbol: POT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'POT1 (FOX3) encodes the peroxisomal 3-ketoacyl-CoA thiolase (acetyl-CoA C-acyltransferase, EC 2.3.1.16)
  of Saccharomyces cerevisiae, the enzyme of the final step of each peroxisomal fatty acid beta-oxidation cycle.
  It cleaves a 3-oxoacyl-CoA with free CoA to release acetyl-CoA and an acyl-CoA shortened by two carbons. In yeast,
  beta-oxidation is confined to peroxisomes, and POT1 is the main thiolase there. The enzyme is a soluble homodimer
  (45 kDa subunits) of the peroxisomal matrix. It is imported by the PTS2 pathway: its N-terminal 16 residues form
  a PTS2 that is recognised by the Pex7p receptor together with the Pex18p/Pex21p co-receptors. Expression is induced
  by oleate, and fox3 mutants are blocked at the thiolase step of fatty acid degradation. A minor pool has been
  reported in the mitochondrial intermembrane space, and high-throughput screens detected mRNA binding and in vitro
  antifungal activity, but none of these has a defined physiological role.'
