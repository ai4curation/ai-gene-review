suggested_questions:
- question: Does the small pool of Pot1p detected in the mitochondrial intermembrane space have a physiological
    role, or is it a mistargeting/contamination artefact of the proteomic profiling?
- question: Is the mRNA binding of Pot1p (enriched for translation-related messages) functionally relevant, for
    example for oleate-induced post-transcriptional regulation?
suggested_experiments:
- hypothesis: The IMS-localised Pot1p pool is functionally relevant
  description: Express a PTS2-deleted Pot1p that is retargeted to the IMS (or a variant that excludes it from the
    IMS) in a pot1 deletion strain, and test growth on oleate and acyl-CoA profiles.
  experiment_type: genetic / localisation
