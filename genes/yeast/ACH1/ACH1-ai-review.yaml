  review:
    summary: >-
      Direct S. cerevisiae mutagenesis supports acetyl-CoA hydrolase activity,
      but the later CoA-transferase re-characterization makes this a secondary
      activity of ACH1.
    action: KEEP_AS_NON_CORE
    reason: >-
      Buu et al. showed that Ach1p enzymatic activity depends on its putative
      acetyl-CoA-binding sites, supporting the direct hydrolase assay behind
      this IDA row. Fleck and Brock subsequently found the hydrolase activity to
      be minor relative to the succinyl-CoA:acetate CoA-transferase reaction,
      and they argued that Ach1p conserves energy through mitochondrial acetate
      detoxification rather than acetyl-CoA hydrolysis. This activity is
      retained but should not be treated as the core molecular function.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:12606555
      supporting_text: "Using site-directed mutagenesis analysis, we demonstrated that the enzymatic activity of Ach1p is dependent upon its putative acetyl-CoA binding sites."
