id: P32316
gene_symbol: ACH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  ACH1 encodes an acetyl-CoA hydrolase/transferase-family enzyme that acts mainly
  in mitochondria and catalyzes succinyl-CoA:acetate CoA transfer, linking
  acetate with mitochondrial acetyl-CoA metabolism. Acetyl-CoA hydrolysis is a
  measurable but minor side activity, and a smaller non-mitochondrial pool has
  also been detected. ach1 mutants grow poorly on acetate, and homozygous ach1
  diploids fail to initiate pseudohyphal development, probably as an indirect
  consequence of the mitochondrial acetate defect.
