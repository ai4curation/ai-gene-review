  review:
    summary: >-
      Ach1p has measurable acetyl-CoA hydrolase activity, and PAINT propagation
      from PTN000484586 is sound, but this hydrolytic reaction is minor relative
      to Ach1p's succinyl-CoA:acetate CoA-transferase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBA traces to PTN000484586, a PTHR43609 node that also carries
      S. cerevisiae ACH1 itself as an experimental seed, so this is not a
      weak pairwise transfer or a circular source. Direct mutagenesis supported
      acetyl-CoA hydrolase activity, and later re-characterization showed that
      Ach1p has only minor acetyl-CoA hydrolase activity compared with its
      succinyl-CoA:acetate CoA-transferase activity and explicitly reframed
      the enzyme away from energy-wasting hydrolysis; keep the assertion as a
      real in vitro side activity rather than ACH1's primary activity.
    additional_reference_ids:
    - PMID:12606555
    - PMID:19298859
    supported_by:
    - reference_id: PMID:12606555
      supporting_text: "Using site-directed mutagenesis analysis, we demonstrated that the enzymatic activity of Ach1p is dependent upon its putative acetyl-CoA binding sites."
    - reference_id: PMID:19298859
      supporting_text: "Ach1p showed highest specific activity for the CoASH transfer from succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity."
    - reference_id: PMID:19298859
      supporting_text: "Thereby, Ach1p does not perform the energy wasting hydrolysis of acetyl-CoA but conserves energy by the detoxification of mitochondrial acetate."
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
