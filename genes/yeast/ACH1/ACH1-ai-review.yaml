references:
- id: file:yeast/ACH1/ACH1-deep-research-sgd.md
  title: SGD gene description for ACH1 (yeast)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Checked each claim. The succinyl-CoA to acetate CoA transfer with only minor acetyl-CoA
      hydrolase activity and the acetate-utilization requirement are confirmed by PMID:19298859 and PMID:12606555.
      The requirement for diploid pseudohyphal growth is confirmed by PMID:12606555, where homozygous ach1-1
      diploids failed to start pseudohyphal development; the authors read this as an indirect consequence
      of the mitochondrial acetate defect, so it is described in the review but not annotated.
- id: file:yeast/ACH1/ACH1-uniprot.txt
  title: UniProt entry P32316 (ACH1_YEAST)
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: The CC FUNCTION text was checked against the yeast literature. It is a mammalian-style
      acetyl-CoA hydrolase description. Yeast does not make cholesterol or melatonin, and the yeast enzyme
      is a succinyl-CoA:acetate CoA-transferase with only minor hydrolase activity (PMID:19298859).
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P32316
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Presumably involved in regulating the intracellular acetyl- CoA pool for fatty acid
        and cholesterol synthesis and fatty acid oxidation.
      confidence: CONFIRMED
      explanation: The FUNCTION text says Ach1 is "Presumably involved in regulating the intracellular acetyl-CoA
        pool for fatty acid and cholesterol synthesis and fatty acid oxidation". S. cerevisiae makes ergosterol,
        not cholesterol, and the enzyme was re-characterised as a CoA-transferase that moves CoA from succinyl-CoA
        to acetate, with only minor acetyl-CoA hydrolase activity, acting in mitochondrial acetate detoxification
        and acetate utilization (Fleck and Brock 2009, PMID:19298859). The text should describe that activity
        and role.
      supported_by:
      - reference_id: PMID:19298859
        supporting_text: Ach1p showed highest specific activity for the CoASH transfer from succinyl-CoA to
          acetate and only a minor acetyl-CoA-hydrolase activity.
      - reference_id: PMID:19298859
        supporting_text: Thereby, Ach1p does not perform the energy wasting hydrolysis of acetyl-CoA but conserves
          energy by the detoxification of mitochondrial acetate.
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P32316
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: It may be involved in overall regulation of acetylation during melatonin synthesis.
      confidence: PROBABLE
      explanation: The FUNCTION text says Ach1 "may be involved in overall regulation of acetylation during
        melatonin synthesis". Melatonin synthesis is a vertebrate pathway and no yeast study links Ach1 to it;
        the sentence appears to be carried over from the mammalian acetyl-CoA hydrolase. It should be removed
        from the yeast entry.
