gene_symbol: ACH1
organism: yeast
uniprot_id: P32316
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Presumably involved in regulating the intracellular acetyl- CoA pool for fatty
    acid and cholesterol synthesis and fatty acid oxidation. It may be involved in
    overall regulation of acetylation during melatonin synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32316
  source_id: P32316
- source: Alliance_Imported
  text: Protein with CoA transferase activity; particularly for CoASH transfer from
    succinyl-CoA to acetate; has minor acetyl-CoA-hydrolase activity; phosphorylated;
    required for acetate utilization and for diploid pseudohyphal growth
  source_type: curated
  url: https://www.yeastgenome.org/locus/ACH1
  source_id: SGD:S000000111
- source: Alliance_Automated
  text: Enables acetate CoA-transferase activity and acetyl-CoA hydrolase activity.
    Involved in acetate metabolic process. Located in cytosol and mitochondrion.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ACH1
  source_id: SGD:S000000111
