descriptions:
- source: UniProt
  text: Involved in resistance to compounds that target ergosterol biosynthesis, including
    fenpropimorph, dyclonine, and alverine citrate. Since a deletion in the absence
    of these compounds does not have an effect on growth, is more likely to be involved
    in compound availability.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12529
  source_id: Q12529
- source: Alliance_Imported
  text: SET domain protein of unknown function; deletion heterozygote is sensitive
    to compounds that target ergosterol biosynthesis, may be involved in compound
    availability
  source_type: curated
  url: https://www.yeastgenome.org/locus/SET6
  source_id: SGD:S000006086
- source: Alliance_Automated
  text: Predicted to enable histone methyltransferase activity and protein-lysine
    N-methyltransferase activity. Predicted to be involved in chromatin remodeling.
    Predicted to be active in nucleus. Orthologous to several human genes including
    SMYD2 (SET and MYND domain containing 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SET6
  source_id: SGD:S000006086
