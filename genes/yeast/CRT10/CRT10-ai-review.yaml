  title: Rtt101 and Mms1 in budding yeast form a CUL4(DDB1)-like ubiquitin ligase
    that promotes replication through damaged DNA.
  findings:
  - statement: Crt10 co-purifies with Rtt101 and Mms1 (not Cdc53) by TAP-MS; the
      Crt10-Rtt101 interaction requires Mms1 and the Rtt101 N-terminus, whereas Crt10
      binds Mms1 without Rtt101.
    supporting_text: >-
      The interaction between Crt10 and Rtt101 was dependent on Mms1 ( Fig 4A ).
  - statement: Crt10 associates with Rtt101 constitutively, unlike Mms22, suggesting two
      distinct Rtt101 complexes.
