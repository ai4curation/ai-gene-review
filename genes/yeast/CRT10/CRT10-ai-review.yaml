- term:
    id: GO:0070651
    label: nonfunctional rRNA decay
  evidence_type: IGI
  original_reference_id: PMID:25534857
  qualifier: involved_in
  supporting_entities:
  - SGD:S000006368
  review:
    summary: >-
      Genetic interaction with MMS1 (SGD:S000006368) places Crt10 in the
      Rtt101-Mms1-dependent pathway that clears nonfunctional mutant 25S rRNA.
    action: ACCEPT
    reason: >-
      25S NRD is a ubiquitin-dependent clearance pathway whose E3 is Rtt101-Mms1. Crt10 is
      an accessory subunit of that ligase that, unlike Mms22, specifies its NRD rather
      than DNA-repair function, so Crt10 contributes part of the work of the process (as
      a component of the enzyme that performs it) rather than being a substrate or a
      distant regulator. This is the best-established biological role of Crt10. The
      cached record is abstract-only; the abstract explicitly states the requirement and
      the curators read the full paper.
    supported_by:
    - reference_id: PMID:25534857
      supporting_text: >-
        We herein demonstrated that another accessory component, Crt10 was required for
        25S NRD, but not for DNA repair, suggesting that this accessory component
        specifies the function of the E3 complex differently.
