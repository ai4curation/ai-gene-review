- id: PMID:16600900
  title: Identification and characterization of CRT10 as a novel regulator of Saccharomyces
    cerevisiae ribonucleotide reductase genes.
  findings:
  - statement: crt10 deletion confers HU resistance, partially rescues mec1 null
      lethality and elevates RNR2/RNR3 expression; CRT10 acts in the CRT1 (not SML1)
      pathway downstream of DUN1 and is required for normal CRT1 transcript levels.
    supporting_text: >-
