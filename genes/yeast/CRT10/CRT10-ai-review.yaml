- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: >-
      The subcellular location of Crt10 has not been determined, but its complex
      membership has: Crt10 co-purifies by TAP-MS with Rtt101 and Mms1 (not with the
      Cdc53 cullin), associates with them constitutively, and is a component of two
      distinct Rtt101-Mms1 ligase assemblies, one of which contains the Paf1 complex.
    action: MODIFY
    reason: >-
      Cellular-component data do exist in the form of complex membership, so the
      no-data root term should be replaced by part_of Cul8-RING ubiquitin ligase complex
      (GO:0035361), whose definition names Mms1 as the adaptor and allows several
      specificity factors. Comparator check: the alternative substrate receptor Mms22,
      standing in the same role, carries IDA part_of GO:0035361 from SGD, as do Rtt101,
      Mms1 and Hrt1; Crt10's absence looks like a gap rather than a convention, because
      the paper that showed Crt10 in the complex (PMID:18704118) was curated only to
      protein binding. No subcellular localisation (nucleus vs cytoplasm) has been
      experimentally established, so no location term is proposed.
    proposed_replacement_terms:
    - id: GO:0035361
      label: Cul8-RING ubiquitin ligase complex
    supported_by:
    - reference_id: PMID:18704118
      supporting_text: >-
        Crt10, a regulator of RNR gene transcription ( Fu & Xiao, 2006 ), co-purified with
        both Rtt101 and Mms1, but not with Cdc53
    - reference_id: PMID:18704118
      supporting_text: >-
        Crt10 interacted with Rtt101 in the absence of MMS, whereas the interaction between
        Mms22 and Rtt101 was stimulated after MMS treatment
    - reference_id: PMID:25534857
      supporting_text: >-
