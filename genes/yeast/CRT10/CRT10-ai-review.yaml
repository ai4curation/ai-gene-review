      SML1 pathway.
  - statement: CRT10 expression is induced by DNA damage and HU in a DUN1-dependent
      manner.
    supporting_text: >-
      the expression of CRT10 itself is induced by DNA damaging agents and this induction
      requires DUN1
  reference_review:
