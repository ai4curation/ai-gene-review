core_functions:
- description: >-
    Accessory, putative substrate-specifying subunit of the Rtt101(Cul8)-Mms1 cullin-RING
    ubiquitin ligase, bound through the DDB1-like linker Mms1, that directs the ligase to
    the clearance of nonfunctional 25S rRNA (nonfunctional rRNA decay). The molecular
    activity (for example substrate recognition) is inferred by analogy to DCAFs and has
    not been demonstrated.
  in_complex:
    id: GO:0035361
    label: Cul8-RING ubiquitin ligase complex
  directly_involved_in:
  - id: GO:0070651
    label: nonfunctional rRNA decay
  supported_by:
  - reference_id: PMID:25534857
    supporting_text: >-
      We herein demonstrated that another accessory component, Crt10 was required for 25S
      NRD, but not for DNA repair
  - reference_id: PMID:18704118
    supporting_text: >-
      Crt10, a regulator of RNR gene transcription ( Fu & Xiao, 2006 ), co-purified with
      both Rtt101 and Mms1, but not with Cdc53
  knowledge_gaps:
  - gap_statement: >-
      No ubiquitination substrate of Rtt101-Mms1-Crt10 is known, and it is not known
      whether Crt10 binds the substrate directly (as a true DCAF-like receptor) or
      directs the ligase indirectly, for example through the Paf1-containing assembly.
    boundary: >-
      Established: Crt10 is an Mms1-bound subunit of the Rtt101 ligase and is required
      for 25S nonfunctional rRNA decay but not for DNA-damage tolerance.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Does Crt10 act as the substrate receptor that recruits ribosomal proteins of
    nonfunctional 60S subunits to Rtt101-Mms1 for ubiquitination, and is it sufficient to
    confer this specificity?
- question: >-
    Is the RNR-repression phenotype of crt10 deletion (via reduced CRT1 transcript)
    mediated by the Rtt101-Mms1-Crt10 ligase, and if so, which substrate links it to CRT1
    transcription? Until this is known, a transcription-regulation process term for Crt10
    would rest on indirect genetic evidence only.
- question: >-
    Where in the cell is Crt10 active? No localisation has been reported, so neither a
    nuclear nor a cytoplasmic location can currently be asserted.
suggested_experiments:
- description: >-
    Quantitative ubiquitin-remnant proteomics comparing wild-type, crt10, mms22 and
    rtt101 strains expressing an NRD-inducing 25S rRNA mutant, to identify
    Crt10-dependent ubiquitination sites on 60S ribosomal proteins.
  experiment_type: proteomics
- description: >-
    In vitro reconstitution of Rtt101-Mms1-Hrt1 with or without Crt10, testing
    ubiquitination of purified nonfunctional 60S subunits, and crosslinking to establish
    direct Crt10-substrate contact.
  experiment_type: biochemistry
- description: >-
    Endogenous GFP-tagged Crt10 imaging (low abundance, so with sensitive detection) under
    normal growth, HU and MMS treatment to establish its subcellular location.
  experiment_type: cell biology
