id: Q08226
gene_symbol: CRT10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  CRT10 (YOL063C) encodes a 957-residue, low-abundance (about 125 molecules per cell)
  protein built from two copies of the fungal-specific CRT10 domain (Pfam PF08728) with a
  WD40-like region near the N-terminus. Crt10 is an accessory subunit of the budding-yeast
  Cul8/Rtt101 cullin-RING ubiquitin ligase: it co-purifies with the cullin Rtt101 and the
  DDB1-like linker Mms1, binds Mms1 directly and reaches Rtt101 only through Mms1, and
  associates constitutively rather than in response to DNA damage. It is therefore
  regarded as a putative substrate receptor (DCAF-like adaptor) of the Rtt101-Mms1 ligase,
  although no ubiquitination substrate has been identified. Genetically, Crt10 is required
  for nonfunctional rRNA decay (NRD) of mutant 25S rRNA, a ubiquitin-dependent pathway that
  also requires Rtt101 and Mms1, but unlike the alternative receptor Mms22 it is not needed
  for DNA-damage tolerance; Crt10 also exists in a second ligase assembly that contains the
  Paf1 complex. Crt10 was first identified as a repressor of ribonucleotide reductase
  (RNR) gene expression: crt10 deletion confers hydroxyurea resistance, partially rescues
  mec1 lethality and raises basal and damage-induced RNR2/RNR3 transcripts, acting
  genetically in the Dun1-Crt1 pathway by sustaining CRT1 transcript levels. CRT10
  expression is induced by DNA damage and hydroxyurea in a DUN1-dependent manner.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      No molecular activity of Crt10 has been demonstrated. The published biochemistry
      shows only that Crt10 is bridged to Rtt101 by Mms1, from which the authors infer a
      putative substrate-adaptor role; no substrate, ubiquitination assay or binding
      specificity for Crt10 has been reported.
    action: ACCEPT
    reason: >-
      The literature was searched (Fu and Xiao 2006; Zaidi et al. 2008; Sakata et al.
      2015; large-scale interactome data). The substrate-adaptor role remains a
      hypothesis drawn from analogy to mammalian DCAFs, so a specific MF term such as
      ubiquitin-like ligase-substrate adaptor activity (GO:1990756) would currently be an
      over-reach. The ND annotation accurately represents the state of knowledge.
    supported_by:
    - reference_id: PMID:18704118
      supporting_text: >-
        Mms22 and Crt10 interact with Rtt101 in an Mms1-dependent manner, suggesting that
        they could function as substrate-specific adaptors for the Rtt101-based ubiquitin
        ligase
    - reference_id: PMID:25534857
      supporting_text: >-
        provided a molecular framework for the substrate diversity of the E3 complex
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18704118
  qualifier: enables
  supporting_entities:
  - UniProtKB:P47050
  review:
    summary: >-
      Crt10 co-purifies with the cullin Rtt101 (P47050), but the association is indirect:
      it depends on the linker Mms1 and is lost with Rtt101-deltaN50, which cannot bind
      Mms1. Crt10 binds Mms1 directly.
    action: REMOVE
    reason: >-
      Bare protein binding is uninformative and, for the Rtt101 partner specifically,
      describes a bridged rather than direct interaction. The biologically meaningful
      content of this experiment, Crt10 being a subunit of the Rtt101-Mms1 cullin-RING
      ligase, is captured by part_of Cul8-RING ubiquitin ligase complex (GO:0035361),
      proposed on the cellular_component row. No informative MF term is supported, so
      MODIFY is not appropriate. Removal does not dispute the reported interaction.
    supported_by:
    - reference_id: PMID:18704118
      supporting_text: >-
        The interaction between Crt10 and Rtt101 was dependent on Mms1 ( Fig 4A ). By
        contrast, Crt10 efficiently interacted with Mms1 in the absence of Rtt101 (data
        not shown), and Crt10 failed to co-precipitate with Rtt101-ΔN50, which is
        defective for binding to Mms1 ( Fig 4A ).
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:37968396
  qualifier: enables
