    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Names the osmosensor role redundant with Msb2 in Sho1-mediated
      HOG activation, the Ahk1 scaffold interaction that limits cross talk to Kss1,
      and beta-1,3-glucan and bud-site phenotypes. No gene review exists to check
      it against; it agrees with the HOG module.
- source: Alliance_Automated
  text: Enables osmosensor activity. Involved in several processes, including (1->3)-beta-D-glucan
    biosynthetic process; cellular bud site selection; and osmosensory signaling pathway
    via Sho1 osmosensor. Located in plasma membrane and site of polarized growth.
  source_type: automated
  url: https://www.yeastgenome.org/locus/HKR1
