gene_symbol: HKR1
organism: yeast
uniprot_id: P41809
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Plasma membrane signaling mucin that promotes activation of the MAPK for the
    filamentous growth pathway. May regulate beta-glucan synthesis. Overexpression
    provides resistance to HM-1 killer toxin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41809
  source_id: P41809
- source: Alliance_Imported
  text: Mucin family member that functions as an osmosensor in the HOG pathway; large,
    highly glycosylated protein that functions redundantly with Msb2p in Sho1p-mediated
    osmostresss induction of the HOG signaling pathway; cytoplasmic domain interacts
    with Ahk1p a scaffold protein that prevents cross talk with the Kss1p MAPK of
    the filamentous growth pathway; mutant displays defects in beta-1,3 glucan synthesis
    and bud site selection
  source_type: curated
  url: https://www.yeastgenome.org/locus/HKR1
  source_id: SGD:S000002828
- source: Alliance_Automated
  text: Enables osmosensor activity. Involved in several processes, including (1->3)-beta-D-glucan
    biosynthetic process; cellular bud site selection; and osmosensory signaling pathway
    via Sho1 osmosensor. Located in plasma membrane and site of polarized growth.
  source_type: automated
  url: https://www.yeastgenome.org/locus/HKR1
  source_id: SGD:S000002828
