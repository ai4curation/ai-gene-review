findings:
- category: discrepancy
  text: UniProt describes Hkr1 as a filamentous-growth signalling mucin and does not
    mention HOG osmosensing; SGD and GOA make it a Sho1-branch osmosensor redundant
    with Msb2. There is no HKR1 gene review yet to adjudicate.
  sources:
  - UniProt
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: SGD and the automated text agree on HOG osmosensing; UniProt describes
    the filamentous-growth role instead.
