gene_symbol: KAR2
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for yeast KAR2/BiP, the essential ER-lumenal Hsp70. Ranks 3,
  4 and 5 are all exact GOA matches - ER chaperone complex, post-translational protein targeting to
  membrane translocation (the review's second core function), and ER lumen - which makes the lower
  half of this list the most reliably correct stretch in the yeast batch. The oddity is at the top:
  rank 1 asserts the cortical ER lumen, a sub-compartment narrower than anything the evidence supports,
  and outscores the correct general ER lumen at rank 5 by 1.96 units. Missing are both core molecular
  functions, ATP-dependent protein folding chaperone and the protein-transporting ATPase activity
  that GOA holds with IDA. This is also the second gene in the yeast batch, after CAT2, where the
  GO channel beats the free-text channel: the free-text top hits are comments for other ER proteins,
  including one that is explicitly a nucleotide exchange factor for KAR2 rather than KAR2 itself.
  Assessment: 1 correct-not-novel, 1 correct novel, 1 uncertain. Assessment: 1 correct novel (COR),
  1 correct not novel (CNN), 1 uncertain (UNC).
