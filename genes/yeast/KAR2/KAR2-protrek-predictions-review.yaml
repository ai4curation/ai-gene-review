  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 18.83), absent from GOA. KAR2 is one of the most abundant proteins in
      the ER lumen and is present throughout it, so cortical ER lumen is not false - it is a part
      of where the protein is - but nothing restricts KAR2 to the cortical subdomain, and the term
      asserts a spatial specificity the evidence does not license. The correct, general term is returned
      four ranks lower. Cannot be validated as a meaningful localization claim.
