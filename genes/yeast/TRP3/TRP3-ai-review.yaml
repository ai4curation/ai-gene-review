  label: Saccharomyces cerevisiae S288C
description: 'Bifunctional tryptophan biosynthesis protein of Saccharomyces cerevisiae. The N-terminal TrpG-like
  glutamine amidotransferase domain is anthranilate synthase component II: it hydrolyses L-glutamine and delivers
  ammonia to Trp2, together forming the heteromeric anthranilate synthase complex (EC 4.1.3.27, step 1 of tryptophan
  biosynthesis). The C-terminal TrpC-like domain, joined by a short connector, is indole-3-glycerol-phosphate synthase
  (EC 4.1.1.48), which converts 1-(2-carboxyphenylamino)-1-deoxyribulose 5-phosphate to indole-3-glycerol phosphate
  (step 4). Trp3 is a soluble cytosolic enzyme induced by tryptophan starvation.'
