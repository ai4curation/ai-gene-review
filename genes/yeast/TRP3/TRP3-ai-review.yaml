  review:
    summary: Trp3's GATase domain hydrolyses L-glutamine to provide NH3 for anthranilate formation, so Trp3 does
      catalyse a glutamine-consuming reaction. This is a by-product of its role in tryptophan synthesis rather than
      a role in glutamine metabolism per se; kept as non-core.
