descriptions:
- source: UniProt
  text: Essential for the viability of mitochondrial petite mutant. Catalyzes the
    committed step to the synthesis of the acidic phospholipids.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25578
  source_id: P25578
- source: Alliance_Imported
  text: Phosphatidylglycerolphosphate synthase; catalyzes the synthesis of phosphatidylglycerolphosphate
    from CDP-diacylglycerol and sn-glycerol 3-phosphate in the first committed and
    rate-limiting step of cardiolipin biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/PGS1
  source_id: SGD:S000000510
- source: Alliance_Automated
  text: Enables CDP-diacylglycerol-glycerol-3-phosphate 3-phosphatidyltransferase
    activity. Involved in cardiolipin biosynthetic process. Located in mitochondrion.
    Orthologous to human PGS1 (phosphatidylglycerophosphate synthase 1).
  source_type: automated
