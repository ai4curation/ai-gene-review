taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Pgs1 (Pel1, YCL004W) is the CDP-diacylglycerol--glycerol-3-phosphate 3-phosphatidyltransferase (phosphatidylglycerophosphate
  synthase, EC 2.7.8.5) of Saccharomyces cerevisiae, a phospholipase D-superfamily (HKD motif) enzyme of the mitochondrial
  inner membrane. It condenses CDP-diacylglycerol with sn-glycerol 3-phosphate to form phosphatidylglycerophosphate,
  the committed and rate-limiting step of phosphatidylglycerol and cardiolipin synthesis inside mitochondria (followed
  by Gep4 and Crd1). pgs1 null cells lack PG and CL, are temperature sensitive, cannot grow on non-fermentable carbon
  sources and are petite-lethal; PGS1 expression is regulated by inositol and choline through the Ino2/Ino4-Opi1
  circuit.
