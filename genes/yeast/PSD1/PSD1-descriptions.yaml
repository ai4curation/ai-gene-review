gene_symbol: PSD1
organism: yeast
uniprot_id: P39006
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the formation of phosphatidylethanolamine (PtdEtn) from phosphatidylserine
    (PtdSer). Plays a central role in phospholipid metabolism and in the interorganelle
    trafficking of phosphatidylserine (PubMed:17976194, PubMed:23124206, PubMed:25829489,
    PubMed:29290583, PubMed:8227017, PubMed:8407984). Phosphatidylethanolamine formed
    in the mitochondria is exported to other membranes to fullfill their requirements
    for PtdEtn (PubMed:11294902, PubMed:29290583, PubMed:8530379). Required for normal
    mitochondrial morphology and proper mitochondrial fusion during yeast mating (PubMed:23045528).
    Involved in lipid droplet biogenesis at the endoplasmic reticulum membrane (PubMed:34818062).
    Required for induction of mitophagy during nitrogen starvation (PubMed:30510114).
    Appears to play a specific role in supporting respiratory complex III activity
    (PubMed:30926815).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39006
  source_id: P39006
- source: Alliance_Imported
  text: Phosphatidylserine decarboxylase of the mitochondrial inner membrane; converts
    phosphatidylserine to phosphatidylethanolamine; regulates mitochondrial fusion
    and morphology; partly exposed to the mitochondrial intermembrane space; ER-localized
    fraction is involved in formation of lipid droplets; autocatalytically processed
  source_type: curated
  url: https://www.yeastgenome.org/locus/PSD1
  source_id: SGD:S000005113
- source: Alliance_Automated
  text: Enables phosphatidylserine decarboxylase activity. Involved in several processes,
    including glycerophospholipid biosynthetic process; lipid droplet formation; and
    mitochondrial electron transport, ubiquinol to cytochrome c. Located in lipid
    droplet and mitochondrial inner membrane. Is active in endoplasmic reticulum membrane.
    Used to study Parkinson's disease. Human ortholog(s) of this gene implicated in
    spondyloepimetaphyseal dysplasia. Orthologous to human PISD (phosphatidylserine
    decarboxylase).
  source_type: automated
