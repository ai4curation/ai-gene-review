descriptions:
- source: UniProt
  text: The isoenzyme MDH2 may function primarily in the glyoxylate cycle.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P22133
  source_id: P22133
- source: Alliance_Imported
  text: Cytoplasmic malate dehydrogenase; one of three isozymes that catalyze interconversion
    of malate and oxaloacetate; involved in the glyoxylate cycle and gluconeogenesis
    during growth on two-carbon compounds; interacts with Pck1p and Fbp1; mutation
    in human homolog MDH2 causes early-onset severe encephalopathy
  source_type: curated
  url: https://www.yeastgenome.org/locus/MDH2
  source_id: SGD:S000005486
- source: Alliance_Automated
  text: Enables L-malate dehydrogenase (NAD+) activity. Involved in gluconeogenesis
    and protein import into peroxisome matrix. Located in cytosol and nuclear periphery.
    Human ortholog(s) of this gene implicated in developmental and epileptic encephalopathy
    51. Orthologous to human MDH2 (malate dehydrogenase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MDH2
