core_functions:
- description: Cytosolic NAD+-dependent malate dehydrogenase that oxidises glyoxylate-cycle malate to
    oxaloacetate for gluconeogenesis via PEPCK during growth on C2 carbon sources; glucose-inactivated
    and degraded.
