id: P22133
gene_symbol: MDH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MDH2 encodes the cytosolic isozyme of NAD+-dependent malate dehydrogenase (EC 1.1.1.37),
  the major non-mitochondrial MDH in cells grown on acetate. Mdh2p converts malate produced by the glyoxylate
  cycle (isocitrate lyase/malate synthase) to oxaloacetate in the cytosol, supplying phosphoenolpyruvate
  carboxykinase for gluconeogenesis; mdh2 mutants cannot grow on acetate or ethanol. MDH2 is induced on
  acetate and the protein undergoes glucose-induced catabolite inactivation and proteasomal degradation,
  which depends on its N-terminal extension (a Pro/N-degron). The N-terminus is also required for weak
  physical interactions with PEPCK (Pck1p) and fructose-1,6-bisphosphatase (Fbp1p) that are proposed to
  be important for gluconeogenic function in vivo.
