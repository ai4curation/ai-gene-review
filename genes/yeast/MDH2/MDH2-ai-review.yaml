suggested_questions:
- question: Is the reported requirement of MDH2 for PTS1 import (genome-wide imaging screen) reproducible,
    and if so is it a direct effect or a consequence of altered cytosolic redox/metabolism?
suggested_experiments:
- description: Quantify GFP-PTS1 import in mdh2 null, catalytically inactive mdh2, and wild-type cells
    on glucose and oleate to distinguish a catalytic/metabolic from a structural requirement.
