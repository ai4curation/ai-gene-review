descriptions:
- source: UniProt
  text: Catalytic subunit of serine palmitoyltransferase (SPT), which catalyzes the
    committed step in the synthesis of sphingolipids, the condensation of serine with
    palmitoyl CoA to form the long chain base 3-ketosphinganine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40970
  source_id: P40970
- source: Alliance_Imported
  text: Serine palmitoyltransferase component; responsible along with Lcb1p for the
    first committed step in sphingolipid synthesis, which is the condensation of serine
    with palmitoyl-CoA to form 3-ketosphinganine
  source_type: curated
  url: https://www.yeastgenome.org/locus/LCB2
  source_id: SGD:S000002469
- source: Alliance_Automated
  text: Enables serine C-palmitoyltransferase activity. Involved in sphingolipid biosynthetic
    process. Located in endoplasmic reticulum. Part of serine palmitoyltransferase
    complex. Human ortholog(s) of this gene implicated in hereditary sensory and autonomic
    neuropathy type 1C. Orthologous to human SPTLC2 (serine palmitoyltransferase long
    chain base subunit 2) and SPTLC3 (serine palmitoyltransferase long chain base
    subunit 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LCB2
  source_id: SGD:S000002469
