suggested_questions:
- question: How do Orm1/2 and Tsc3 binding alter the Lcb2 active site or substrate access, given that Orm-mediated
    inhibition is relieved by Ypk1-dependent phosphorylation?
suggested_experiments:
- description: Use cryo-EM of the yeast SPOTS complex in phosphorylated and unphosphorylated Orm states to visualise
    conformational effects on the Lcb2 PLP site.
