gene_symbol: LCB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lcb2 (Scs1/Tsc1) is the catalytic, pyridoxal 5'-phosphate-bearing subunit of serine palmitoyltransferase
  (SPT), the ER-membrane enzyme that condenses L-serine with palmitoyl-CoA to form 3-ketosphinganine, the committed
  and rate-limiting step of sphingolipid synthesis in Saccharomyces cerevisiae. Lcb2 forms an obligate heterodimer
  with the homologous non-catalytic subunit Lcb1, and the enzyme is part of the SPOTS complex with the activator
  Tsc3, the Orm1/Orm2 negative regulators and the phosphatase Sac1, which couples SPT activity to sphingolipid homeostasis.
  LCB2 is essential; lcb2 mutants are long-chain-base auxotrophs lacking SPT activity. Lcb2 is the orthologue of
  human SPTLC2/SPTLC3 and is the target of the inhibitor myriocin.
