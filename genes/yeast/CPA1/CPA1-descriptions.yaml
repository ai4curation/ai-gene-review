descriptions:
- source: UniProt
  text: Small subunit of the arginine-specific carbamoyl phosphate synthase (CPSase).
    CPSase catalyzes the formation of carbamoyl phosphate from the ammonia moiety
    of glutamine, carbonate, and phosphate donated by ATP, constituting the first
    step of 2 biosynthetic pathways, one leading to arginine and/or urea and the other
    to pyrimidine nucleotides. The small subunit (glutamine amidotransferase) binds
    and cleaves glutamine to supply the large subunit with the substrate ammonia.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07258
  source_id: P07258
- source: Alliance_Imported
  text: Small subunit of carbamoyl phosphate synthetase; carbamoyl phosphate synthetase
    catalyzes a step in the synthesis of citrulline, an arginine precursor; translationally
    regulated by an attenuator peptide encoded by YOR302W within the CPA1 mRNA 5'-leader
  source_type: curated
  url: https://www.yeastgenome.org/locus/CPA1
  source_id: SGD:S000005829
- source: Alliance_Automated
  text: Enables carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity and
    glutaminase activity. Involved in L-arginine biosynthetic process and pyrimidine
    nucleotide biosynthetic process. Located in cytoplasm. Part of carbamoyl-phosphate
    synthase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CPA1
  source_id: SGD:S000005829
