id: P07258
gene_symbol: CPA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Small (glutamine amidotransferase, CarA-family) subunit of the arginine-specific carbamoyl-phosphate
  synthetase (CPSase A) of Saccharomyces cerevisiae. Cpa1p forms a cytosolic heterodimer with the large
  synthetase subunit Cpa2p; it binds and hydrolyses L-glutamine (catalytic Cys264 and His349) and delivers
  the ammonia to Cpa2p, conferring glutamine-dependent carbamoyl-phosphate synthesis on the holoenzyme.
  CPSase A supplies carbamoyl phosphate for ornithine carbamoylation to citrulline in arginine biosynthesis
  and is repressed by arginine (translational control via a uORF-encoded arginine attenuator peptide).
  Unlike S. pombe and Neurospora, where the arginine-pathway CPSase is mitochondrial, the yeast enzyme
  is cytosolic and its carbamoyl phosphate joins a single pool shared with the pyrimidine-specific CPSase
  (URA2).
