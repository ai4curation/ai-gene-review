core_functions:
- description: Glutamine amidotransferase (small, CarA-type) subunit of the cytosolic arginine-specific
    carbamoyl-phosphate synthetase (CPSase A; Cpa1p-Cpa2p heterodimer). Cpa1p binds and hydrolyses glutamine
    (catalytic Cys264/His349) and passes the released ammonia to Cpa2p, enabling glutamine-dependent carbamoyl-phosphate
    synthesis for ornithine carbamoylation in arginine biosynthesis.
  molecular_function:
    id: GO:0004359
    label: glutaminase activity
  contributes_to_molecular_function:
    id: GO:0004088
    label: carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity
  directly_involved_in:
  - id: GO:0006526
    label: L-arginine biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0005951
    label: carbamoyl-phosphate synthase complex
  supported_by:
  - reference_id: PMID:206535
    supporting_text: The small component was required in addition to the large one for the physiologically
      functional glutamine-dependent activity.
  - reference_id: PMID:206535
    supporting_text: indicated that binding of glutamine to a site located on the small component was
      followed by transfer of its amide nitrogen to the ammonia site on the heavy component.
  - reference_id: PMID:8626695
    supporting_text: with a 45-kDa CPA1 subunit binding and cleaving glutamine, and a 124-kDa CPA2 subunit
      accepting the ammonia moiety cleaved from glutamine, binding all of the remaining substrates and
      carrying out all of the other catalytic events.
  - reference_id: PMID:9290206
    supporting_text: implicate residues Cys 264 and His 349 in the glutaminase catalytic activity, and
      His 307 in the binding of glutamine to the active site.
