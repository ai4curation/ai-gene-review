descriptions:
- source: UniProt
  text: Catalytic subunit of mitochondrial acetolactate synthase, which catalyzes
    the first of a series of common steps in the biosynthesis of the branched-chain
    amino acids. Catalyzes the irreversible decarboxylation of pyruvate to a bound
    hydroxyethyl group that then condenses with either a second pyruvate molecule
    to form 2- acetolactate (AL) or with 2-ketobutyrate to form 2-aceto-2- hydroxybutyrate
    (AHB). The first product is the precursor for valine and leucine biosynthesis,
    while the second leads to isoleucine.
  source_type: curated
