descriptions:
- source: UniProt
  text: Catalytic subunit of mitochondrial acetolactate synthase, which catalyzes
    the first of a series of common steps in the biosynthesis of the branched-chain
    amino acids. Catalyzes the irreversible decarboxylation of pyruvate to a bound
    hydroxyethyl group that then condenses with either a second pyruvate molecule
    to form 2- acetolactate (AL) or with 2-ketobutyrate to form 2-aceto-2- hydroxybutyrate
    (AHB). The first product is the precursor for valine and leucine biosynthesis,
    while the second leads to isoleucine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07342
  source_id: P07342
- source: Alliance_Imported
  text: Acetolactate synthase; catalyses the first common step in isoleucine and valine
    biosynthesis and is the target of several classes of inhibitors, localizes to
    the mitochondria; expression of the gene is under general amino acid control
  source_type: curated
  url: https://www.yeastgenome.org/locus/ILV2
  source_id: SGD:S000004714
- source: Alliance_Automated
  text: Enables acetolactate synthase activity and flavin adenine dinucleotide binding
    activity. Involved in branched-chain amino acid biosynthetic process. Located
    in mitochondrion. Part of acetolactate synthase complex.
  source_type: automated
