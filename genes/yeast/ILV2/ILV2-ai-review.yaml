id: P07342
gene_symbol: ILV2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Catalytic (large) subunit of mitochondrial acetohydroxyacid synthase (AHAS; acetolactate
  synthase, EC 2.2.1.6) of Saccharomyces cerevisiae. Ilv2 is a thiamine diphosphate-, Mg2+- and FAD-dependent
  enzyme that decarboxylates pyruvate and condenses the resulting hydroxyethyl-ThDP intermediate with
  a second pyruvate (giving 2-acetolactate, the precursor of valine and leucine) or with 2-oxobutanoate
  (giving 2-aceto-2-hydroxybutanoate, the precursor of isoleucine). This is the first common step of branched-chain
  amino acid biosynthesis and occurs in the mitochondrial matrix. Ilv2 is active alone but is stimulated
  several-fold by the regulatory small subunit Ilv6, which also confers valine feedback inhibition that
  is reversed by MgATP. Ilv2 is the target of sulfonylurea herbicides (the SMR1 allele confers sulfometuron
  resistance), and crystal structures of the yeast enzyme with these inhibitors have been determined.
