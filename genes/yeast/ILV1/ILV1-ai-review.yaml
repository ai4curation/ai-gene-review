core_functions:
- description: 'Biosynthetic threonine dehydratase/deaminase (EC 4.3.1.19, PLP-dependent) catalysing the
    first, committed step of L-isoleucine biosynthesis: L-threonine -> 2-oxobutanoate + NH4+. Allosterically
    inhibited by isoleucine and activated by valine, it is the main flux-control point of the isoleucine
    branch.'
