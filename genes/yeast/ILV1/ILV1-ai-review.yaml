    summary: Ramos & Wiame found ilv1 mutants still grow on threonine/serine as sole nitrogen source and
      that cha1 mutation in an ilv1 background abolishes threonine utilisation; the two deaminases show
      limited mutual compensation. The IGI with CHA1 therefore records a genuine but minor, back-up contribution
      of Ilv1 to threonine catabolism; the catabolic enzyme is Cha1.
