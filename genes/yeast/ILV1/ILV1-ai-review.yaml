  label: Saccharomyces cerevisiae S288C
description: ILV1 encodes the biosynthetic threonine dehydratase (threonine deaminase, EC 4.3.1.19) of
  Saccharomyces cerevisiae, a pyridoxal-phosphate-dependent homotetrameric enzyme of the serine/threonine
  dehydratase family with two C-terminal ACT-like regulatory domains. Imported into mitochondria, Ilv1
  deaminates L-threonine to 2-oxobutanoate and ammonia, the first and committed step of L-isoleucine synthesis;
  2-oxobutanoate is then condensed with pyruvate by acetohydroxyacid synthase (Ilv2/Ilv6). Ilv1 is feedback-inhibited
  by isoleucine and activated by valine, and ilv1 mutants require isoleucine. ILV1 expression is under
  general amino acid control. It is distinct from the catabolic, non-allosteric serine/threonine deaminase
  Cha1, although the two enzymes can partially substitute for one another.
