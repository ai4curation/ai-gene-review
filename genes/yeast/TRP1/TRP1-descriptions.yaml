- source: Alliance_Imported
  text: Phosphoribosylanthranilate isomerase; catalyzes the third step in tryptophan
    biosynthesis; in 2004, the sequence of TRP1 from strain S228C was updated by changing
    the previously annotated internal STOP (TAA) to serine (TCA); enhances vegetative
    growth at low and high temperatures when used as an auxotrophic marker in strains
    such as W303
