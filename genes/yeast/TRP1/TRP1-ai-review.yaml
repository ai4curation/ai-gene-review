  label: Saccharomyces cerevisiae S288C
description: N-(5'-phosphoribosyl)anthranilate isomerase (TrpF, PRAI, EC 5.3.1.24) of Saccharomyces cerevisiae,
  a monofunctional TIM-barrel enzyme catalysing the Amadori rearrangement of N-(5-phosphoribosyl)anthranilate to
  1-(2-carboxyphenylamino)-1-deoxyribulose 5-phosphate, step 3 of L-tryptophan biosynthesis. In contrast to the
  other TRP genes, TRP1 is expressed from a weak constitutive promoter not under general amino acid control, but
  its product has high specific activity. A soluble cytoplasmic enzyme; trp1 alleles are widely used as auxotrophic
  markers.
