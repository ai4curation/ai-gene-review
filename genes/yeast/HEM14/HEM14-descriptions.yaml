- source: Alliance_Imported
  text: Protoporphyrinogen oxidase; a mitochondrial enzyme that catalyzes the seventh
    step in the heme biosynthetic pathway, converting protoporphyrinogen IX to protoporphyrin
    IX; inhibited by diphenyl ether-type herbicides
  source_type: curated
  url: https://www.yeastgenome.org/locus/HEM14
  source_id: SGD:S000000816
- source: Alliance_Automated
  text: Enables protoporphyrinogen oxidase activity, oxygen as acceptor. Involved
    in heme biosynthetic process. Located in mitochondrion. Is active in mitochondrial
    inner membrane. Used to study variegate porphyria. Human ortholog(s) of this gene
    implicated in liver disease and variegate porphyria. Orthologous to human PPOX
    (protoporphyrinogen oxidase).
  source_type: automated
