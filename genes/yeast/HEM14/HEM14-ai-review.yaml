description: Protoporphyrinogen oxidase (PPO; EC 1.3.3.4) of Saccharomyces cerevisiae, the seventh enzyme
  of heme biosynthesis. Hem14 is an FAD-containing flavoprotein that catalyses the O2-dependent six-electron
  oxidation of protoporphyrinogen IX to protoporphyrin IX, producing hydrogen peroxide; it is the target
  of diphenylether herbicides such as acifluorfen. The enzyme is nuclear-encoded, synthesized as a 58
  kDa precursor and converted to a mature 55 kDa protein bound to the mitochondrial inner membrane, where
  it supplies protoporphyrin IX to ferrochelatase (Hem15). Mutants lacking PPO activity are heme-deficient.
