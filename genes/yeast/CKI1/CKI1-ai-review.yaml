id: P20485
gene_symbol: CKI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CKI1 encodes the major choline kinase (ATP:choline phosphotransferase, EC 2.7.1.32) of Saccharomyces
  cerevisiae, a soluble cytoplasmic enzyme of the choline/ethanolamine kinase family. It phosphorylates
  choline to phosphocholine using Mg-ATP, the committed step of the CDP-choline (Kennedy) pathway in which
  phosphocholine is then activated by Pct1 and transferred to diacylglycerol by Cpt1 to make phosphatidylcholine.
  Cki1 also phosphorylates ethanolamine, but poorly; ethanolamine kinase activity for the CDP-ethanolamine
  pathway is mainly provided by its paralogue Eki1, with which Cki1 shares partially overlapping functions.
  The CDP-choline pathway contributes net PC synthesis when exogenous choline is available and otherwise
  recycles choline released by PC turnover; loss of Cki1 bypasses the essential requirement for the PI/PC-transfer
  protein Sec14.
