suggested_questions:
- question: What is the in vivo partitioning of ethanolamine phosphorylation between Cki1 and Eki1 under
    ethanolamine-replete conditions, and does Cki1 contribute physiologically to PE synthesis in wild-type
    cells?
suggested_experiments:
- description: Stable-isotope choline and ethanolamine tracing in cki1, eki1 and double mutants complemented
    with substrate-specificity variants of Cki1, to quantify each kinase's in vivo contribution to PC
