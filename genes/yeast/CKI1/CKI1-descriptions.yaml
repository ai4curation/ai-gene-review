gene_symbol: CKI1
organism: yeast
uniprot_id: P20485
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the committed step in the synthesis of phosphatidylcholine by the
    CDP-choline pathway (PubMed:10329685, PubMed:2536698, PubMed:9506987). Also exhibits
    ethanolamine kinase activity but it is a poor substrate at 14% efficiency compared
    with choline (PubMed:2536698, PubMed:9506987).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P20485
  source_id: P20485
- source: Alliance_Imported
  text: Choline kinase; catalyzes the first step in phosphatidylcholine synthesis
    via the CDP-choline (Kennedy pathway); exhibits some ethanolamine kinase activity
    contributing to phosphatidylethanolamine synthesis via the CDP-ethanolamine pathway;
    CKI1 has a paralog, EKI1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/CKI1
  source_id: SGD:S000004123
- source: Alliance_Automated
  text: Enables choline kinase activity and ethanolamine kinase activity. Involved
    in phosphatidylcholine biosynthetic process and phosphatidylethanolamine biosynthetic
    process. Located in cytoplasm. Used to study epilepsy and microcephaly. Human
    ortholog(s) of this gene implicated in epilepsy; intellectual disability; muscular
    dystrophy (multiple); narcolepsy; and recurrent hypersomnia. Orthologous to several
    human genes including CHKA (choline kinase alpha) and CHKB (choline kinase beta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CKI1
  source_id: SGD:S000004123
