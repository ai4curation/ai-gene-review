  text: Enables choline kinase activity and ethanolamine kinase activity. Involved
    in phosphatidylcholine biosynthetic process and phosphatidylethanolamine biosynthetic
    process. Located in cytoplasm. Used to study epilepsy and microcephaly. Human
    ortholog(s) of this gene implicated in epilepsy; intellectual disability; muscular
    dystrophy (multiple); narcolepsy; and recurrent hypersomnia. Orthologous to several
    human genes including CHKA (choline kinase alpha) and CHKB (choline kinase beta).
