findings:
- category: discrepancy
  text: The automated text leads with long-chain fatty acid biosynthesis, which the
    review marks as over-annotated (rescue by an engineered cytosolic form); the native
    product feeds lipoic acid synthesis.
  sources:
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All sources agree on a mitochondrial acetyl-CoA carboxylase. Only
    the automated text implies a long-chain fatty acid role.
