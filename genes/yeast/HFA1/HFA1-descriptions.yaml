- source: Alliance_Automated
  text: Enables acetyl-CoA carboxylase activity. Involved in long-chain fatty acid
    biosynthetic process. Located in mitochondrion. Human ortholog(s) of this gene
    implicated in lipid metabolism disorder. Orthologous to human ACACA (acetyl-CoA
    carboxylase alpha) and ACACB (acetyl-CoA carboxylase beta).
  source_type: automated
