gene_symbol: HFA1
organism: yeast
uniprot_id: P32874
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: 'Catalyzes the rate-limiting reaction in the mitochondrial fatty acid synthesis
    (FAS) type II pathway. Responsible for the production of the mitochondrial malonyl-CoA,
    used for the biosynthesis of the cofactor lipoic acid. This protein carries three
    functions: biotin carboxyl carrier protein, biotin carboxylase, and carboxyltransferase.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32874
  source_id: P32874
- source: Alliance_Imported
  text: Mitochondrial acetyl-coenzyme A carboxylase; catalyzes production of malonyl-CoA
    in mitochondrial fatty acid biosynthesis; relocalizes from mitochondrion to cytoplasm
    upon DNA replication stress; genetic and comparative analysis suggests that translation
    begins at a non-canonical (Ile) start codon at -372 relative to the annotated
    start codon
  source_type: curated
  url: https://www.yeastgenome.org/locus/HFA1
  source_id: SGD:S000004820
- source: Alliance_Automated
  text: Enables acetyl-CoA carboxylase activity. Involved in long-chain fatty acid
    biosynthetic process. Located in mitochondrion. Human ortholog(s) of this gene
    implicated in lipid metabolism disorder. Orthologous to human ACACA (acetyl-CoA
    carboxylase alpha) and ACACB (acetyl-CoA carboxylase beta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HFA1
  source_id: SGD:S000004820
