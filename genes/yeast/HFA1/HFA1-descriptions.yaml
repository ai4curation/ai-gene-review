    overall_notes: 'Correct and current: rate-limiting mitochondrial ACC supplying
      malonyl-CoA to mtFAS for lipoic acid, with the three domain functions named.
      Omits the non-AUG start and the paralogy to ACC1.'
- source: Alliance_Imported
  text: Mitochondrial acetyl-coenzyme A carboxylase; catalyzes production of malonyl-CoA
    in mitochondrial fatty acid biosynthesis; relocalizes from mitochondrion to cytoplasm
    upon DNA replication stress; genetic and comparative analysis suggests that translation
    begins at a non-canonical (Ile) start codon at -372 relative to the annotated
    start codon
  source_type: curated
