descriptions:
- source: UniProt
  text: 'Catalyzes the rate-limiting reaction in the mitochondrial fatty acid synthesis
    (FAS) type II pathway. Responsible for the production of the mitochondrial malonyl-CoA,
    used for the biosynthesis of the cofactor lipoic acid. This protein carries three
    functions: biotin carboxyl carrier protein, biotin carboxylase, and carboxyltransferase.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32874
  source_id: P32874
