id: P32874
gene_symbol: HFA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: HFA1 (YMR207C) encodes the mitochondrial acetyl-CoA carboxylase of S. cerevisiae, a paralog
  of the cytosolic enzyme ACC1 (54% identity) with the same biotin carboxylase, biotin carboxyl carrier
  and carboxyltransferase domain organisation. Hfa1 carboxylates acetyl-CoA to malonyl-CoA (EC 6.4.1.2)
  inside mitochondria, supplying the malonyl-CoA used by the type II mitochondrial fatty acid synthase
  (Mct1, Cem1, Oar1, Htd2, Etr1, Acp1), whose principal product is the octanoyl-ACP precursor of lipoic
  acid. hfa1 null mutants fail to grow on non-fermentable carbon sources and have less than 10% of normal
  lipoic acid, resembling mtFAS mutants. Its N-terminal mitochondrial targeting sequence, encoded upstream
  of the first in-frame AUG and apparently translated from a non-AUG start, is required for function.
  When the targeting sequence is removed, Hfa1 can replace Acc1 in the cytosol, showing the two isozymes
  are catalytically equivalent but compartmentally specialised.
