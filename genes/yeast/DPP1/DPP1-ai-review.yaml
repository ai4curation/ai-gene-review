suggested_questions:
- question: What is the physiological substrate of vacuolar Dpp1 in vivo (DGPP, LPA, PA or isoprenoid
    diphosphates), and does it supply diacylglycerol for vacuole membrane function rather than for bulk
    TAG synthesis?
- question: How does zinc-regulated induction of DPP1 via Zap1 relate to its lipid phosphatase function
    under zinc limitation?
