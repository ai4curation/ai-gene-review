  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:TRIGLSYN-PWY
  review:
    summary: YeastPathways RCA placing Dpp1 in triglyceride biosynthesis (TRIGLSYN-PWY) because it can
      dephosphorylate PA in vitro.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Mg2+-dependent lipin Pah1 is the PA phosphatase that supplies DAG for TAG synthesis throughout
      growth. Dpp1 is a vacuolar, Mg2+-independent enzyme whose physiological substrates appear to be
      DGPP, LPA and isoprenoid diphosphates, and no TAG-synthesis defect has been attributed to dpp1 loss.
      Membership of the TAG pathway is inferred only from in vitro substrate range.
    supported_by:
    - reference_id: PMID:24196957
      supporting_text: showed the essential role of PAH1 in triacylglycerol synthesis throughout growth
    - reference_id: PMID:24196957
      supporting_text: are integral membrane enzymes that are localized to the vacuole and Golgi compartments,
        respectively
