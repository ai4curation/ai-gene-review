taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: DPP1 encodes diacylglycerol pyrophosphate (DGPP) phosphatase, a Mg2+-independent lipid phosphate
  phosphatase of the PAP2 (lipid phosphate phosphatase) superfamily. It is an integral multi-pass membrane
  protein of the vacuolar membrane, and its catalytic motifs follow the three-domain KX6RP/PSGH/SRX5HX3D
  consensus. Dpp1 removes the beta-phosphate of DGPP to give phosphatidate (PA), then dephosphorylates
  PA to diacylglycerol. It also hydrolyses lysophosphatidate and phosphatidylglycerophosphate, and isoprenoid
  diphosphates (farnesyl-PP, geranylgeranyl-PP, dolichyl-PP), with DGPP as the preferred substrate. Together
  with the Golgi paralogue Lpp1 it accounts for nearly all Mg2+-independent PA, LPA and DGPP phosphatase
  activity in the cell, and loss of Dpp1 causes DGPP to accumulate. DPP1 is induced by zinc depletion
  through Zap1, and also by inositol and in stationary phase. Zinc inhibits the enzyme by forming DGPP-zinc
  complexes. The Mg2+-dependent lipin Pah1, not Dpp1, supplies the diacylglycerol used for bulk triacylglycerol
  synthesis.
