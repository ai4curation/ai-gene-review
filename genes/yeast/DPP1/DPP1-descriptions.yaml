descriptions:
- source: UniProt
  text: Catalyzes the dephosphorylation of diacylglycerol diphosphate (DGPP) to phosphatidate
    (PA) and the subsequent dephosphorylation of PA to diacylglycerol (DAG). Together
    with LPP1, regulates intracellular DGPP and PA levels, which are phospholipid
    molecules believed to play a signaling role in stress response. Can also use lysophosphatidic
    acid (LPA) and phosphatidylglycerophosphate as substrates. Substrate preference
    is DGPP > LPA > PA. Activity is independent of a divalent cation ion and insensitive
    to inhibition by N-ethylmaleimide.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05521
