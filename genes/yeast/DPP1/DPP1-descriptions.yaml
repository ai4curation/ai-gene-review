gene_symbol: DPP1
organism: yeast
uniprot_id: Q05521
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the dephosphorylation of diacylglycerol diphosphate (DGPP) to phosphatidate
    (PA) and the subsequent dephosphorylation of PA to diacylglycerol (DAG). Together
    with LPP1, regulates intracellular DGPP and PA levels, which are phospholipid
    molecules believed to play a signaling role in stress response. Can also use lysophosphatidic
    acid (LPA) and phosphatidylglycerophosphate as substrates. Substrate preference
    is DGPP > LPA > PA. Activity is independent of a divalent cation ion and insensitive
    to inhibition by N-ethylmaleimide.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05521
  source_id: Q05521
- source: Alliance_Imported
  text: Diacylglycerol pyrophosphate (DGPP) phosphatase; zinc-regulated vacuolar membrane-associated
    lipid phosphatase, dephosphorylates DGPP to phosphatidate (PA) and Pi, then PA
    to diacylglycerol; involved in lipid signaling and cell metabolism
  source_type: curated
  url: https://www.yeastgenome.org/locus/DPP1
  source_id: SGD:S000002692
- source: Alliance_Automated
  text: Enables diacylglycerol diphosphate phosphatase activity; identical protein
    binding activity; and phosphatase activity. Involved in phospholipid metabolic
    process. Located in fungal-type vacuole membrane and membrane raft. Orthologous
    to several human genes including PLPP4 (phospholipid phosphatase 4) and PLPP5
    (phospholipid phosphatase 5).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DPP1
  source_id: SGD:S000002692
