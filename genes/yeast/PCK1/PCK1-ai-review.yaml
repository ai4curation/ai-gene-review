id: P10963
gene_symbol: PCK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PCK1 encodes the sole phosphoenolpyruvate carboxykinase of Saccharomyces cerevisiae, an ATP-dependent
  enzyme (EC 4.1.1.49) that converts oxaloacetate and ATP to phosphoenolpyruvate, ADP and CO2. It strongly
  prefers ATP/ADP over other nucleotides and functions as a homotetramer in the cytosol. PEPCK catalyses
  the first committed step of gluconeogenesis from C2/C3/C4 substrates; PCK1 is transcribed only on non-fermentable
  carbon sources, is subject to glucose catabolite repression, and the protein is rapidly inactivated
  and degraded after glucose addition. Pck1p has been reported to interact weakly with the gluconeogenic
  cytosolic malate dehydrogenase Mdh2p, which supplies its substrate oxaloacetate.
