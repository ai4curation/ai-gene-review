gene_symbol: BIO3
organism: yeast
uniprot_id: P50277
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the transfer of the alpha-amino group from S- adenosyl-L-methionine
    (SAM) to 7-keto-8-aminopelargonic acid (KAPA) to form 7,8-diaminopelargonic acid
    (DAPA) (PubMed:10333520). It is the only aminotransferase known to utilize SAM
    as an amino donor (PubMed:10333520).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50277
  source_id: P50277
- source: Alliance_Imported
  text: 7,8-diamino-pelargonic acid aminotransferase (DAPA); catalyzes the second
    step in the biotin biosynthesis pathway; BIO3 is in a cluster of 3 genes (BIO3,
    BIO4, and BIO5) that mediate biotin synthesis; BIO3 and BIO4 were acquired by
    horizontal gene transfer (HGT) from bacteria
  source_type: curated
  url: https://www.yeastgenome.org/locus/BIO3
  source_id: SGD:S000005341
- source: Alliance_Automated
  text: Enables S-adenosyl-L-methionine:8-amino-7-oxononanoate transaminase activity.
    Involved in biotin biosynthetic process. Predicted to be active in mitochondrion.
  source_type: automated
  url: https://www.yeastgenome.org/locus/BIO3
  source_id: SGD:S000005341
