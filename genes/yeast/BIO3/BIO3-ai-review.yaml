  review:
    summary: IBA from PANTHER node PTN000241344 (Eukaryota), whose only seed is Arabidopsis AT5G57590 (BIO1), a
      bifunctional BioD-BioA fusion. Its DTBS activity resides in the N-terminal BioD module that yeast Bio3 lacks
      (480 aa, single Aminotran_3 domain). In yeast, DTBS is the separate BIO4 product. The node placement transfers
      a fusion-partner activity to a monofunctional aminotransferase.
    action: REMOVE
    reason: Domain-architecture mismatch; Bio3 has no BioD domain and dethiobiotin synthase activity belongs to
      Bio4.
    supported_by:
