  label: Saccharomyces cerevisiae S288C
description: Bio3p is the 7,8-diaminopelargonic acid (DAPA) aminotransferase (BioA; EC 2.6.1.62) of Saccharomyces
  cerevisiae, a class-III pyridoxal 5'-phosphate-dependent aminotransferase that transfers the alpha-amino group of
  S-adenosyl-L-methionine to 8-amino-7-oxononanoate (KAPA), forming DAPA in the biotin biosynthesis pathway. It is
  unusual among aminotransferases in using SAM as the amino donor. BIO3 lies in a subtelomeric cluster with BIO4
  (dethiobiotin synthetase) and BIO5 (a transporter for KAPA), and enables yeast to make biotin from exogenous
  KAPA or DAPA precursors. Unlike the plant BIO1 enzyme, Bio3p is a monofunctional aminotransferase with no
  dethiobiotin synthetase domain.
