gene_symbol: RIB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: RIB1 (YBL033C) encodes GTP cyclohydrolase II (EC 3.5.4.25), the first enzyme of de novo riboflavin
  biosynthesis. It hydrolytically opens the imidazole ring of GTP and releases formate and pyrophosphate,
  yielding 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate (DARPP), which Rib7 then reduces.
  The enzyme belongs to the RibA/GTP cyclohydrolase II family and binds one catalytic zinc ion per subunit;
  unlike many bacterial RibBA proteins it is monofunctional, the 3,4-dihydroxy-2-butanone-4-phosphate
  synthase activity being carried by the separate Rib3. rib1 mutants are riboflavin auxotrophs and genetic
  epistasis places Rib1 at the first step of the pathway. The protein is soluble and cytoplasmic/nuclear
  by GFP.
