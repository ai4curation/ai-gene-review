- term:
    id: GO:0047724
    label: inosine nucleosidase activity
  evidence_type: IDA
  original_reference_id: PMID:19001417
  qualifier: enables
  review:
    summary: IDA from Belenky et al. 2009 for 'inosine nucleosidase activity' (hydrolysis, EC 3.2.2.2).
      The full text states that Pnp1 was purified to measure phosphorylase activity on inosine and NR,
      i.e. phosphorolytic cleavage producing ribose-1-phosphate, not hydrolysis producing ribose. The
      assay supports purine-nucleoside phosphorylase activity; the hydrolase term mis-types the reaction
      (the hydrolase in that study is Urh1).
    action: MODIFY
    reason: Reaction class is wrong (phosphorolysis vs hydrolysis); the paper's measurement supports the
      phosphorylase term.
    proposed_replacement_terms:
    - id: GO:0004731
      label: purine-nucleoside phosphorylase activity
    supported_by:
    - reference_id: PMID:19001417
      supporting_text: We purified yeast Pnp1 to measure the phosphorylase activity of recombinant Pnp1
        and bovine Pnp on both inosine and NR
    - reference_id: PMID:19001417
      supporting_text: yeast Pnp1 exhibited a specificity constant for NR greater than 9% of the corresponding
        value for inosine
- term:
    id: GO:0070635
    label: nicotinamide riboside hydrolase activity
  evidence_type: IDA
  original_reference_id: PMID:19001417
  qualifier: enables
  review:
    summary: IDA from Belenky 2009 for 'nicotinamide riboside hydrolase activity' (NR + H2O -> nicotinamide
      + D-ribose; term created from this paper for Urh1). For Pnp1 the paper measured phosphorolysis of
      NR, which yields ribose-1-phosphate, not hydrolysis. Pnp1 does cleave NR, so the essence (NR cleavage
      feeding NAD+ salvage) is sound, but the hydrolase term is the wrong reaction class. No GO term exists
      for NR phosphorolysis.
    action: MODIFY
    reason: Pnp1 cleaves NR phosphorolytically; propose a nicotinamide riboside phosphorylase activity
      term.
    proposed_replacement_terms:
    - id: NTR
      label: nicotinamide riboside phosphorylase activity
    supported_by:
