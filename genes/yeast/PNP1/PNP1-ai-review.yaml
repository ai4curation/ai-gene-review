      supporting_text: We purified yeast Pnp1 to measure the phosphorylase activity of recombinant Pnp1
        and bovine Pnp on both inosine and NR
    - reference_id: PMID:19001417
      supporting_text: yeast Pnp1 exhibited a specificity constant for NR greater than 9% of the corresponding
        value for inosine
