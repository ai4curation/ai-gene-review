id: Q05788
gene_symbol: PNP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Purine nucleoside phosphorylase (EC 2.4.2.1) of Saccharomyces cerevisiae, a member of the
  PNP/MTAP phosphorylase family. Pnp1 phosphorolytically cleaves the N-glycosidic bond of inosine and
  guanosine (but not adenosine) to release hypoxanthine or guanine and alpha-D-ribose 1-phosphate, feeding
  the purine bases into Hpt1-dependent salvage and the ribose moiety into the pentose phosphate pathway,
  a route that becomes important when ribosomal RNA is degraded during nutrient starvation. Pnp1 also
  phosphorolyses nicotinamide riboside (NR) to nicotinamide, contributing (together with the more active
  NR hydrolase Urh1 and the minor contributor Meu1) to the Nrk1-independent route by which NR is salvaged
  to NAD+; it has very little activity on nicotinic acid riboside. Pnp1 is a soluble cytoplasmic enzyme.
