proposed_new_terms:
- proposed_name: nicotinamide riboside phosphorylase activity
  proposed_definition: 'Catalysis of the reaction: nicotinamide riboside + phosphate = nicotinamide +
    alpha-D-ribose 1-phosphate.'
  justification: GO has nicotinamide riboside hydrolase activity (GO:0070635) but no term for the phosphorolytic
    cleavage of NR performed by purine nucleoside phosphorylases (yeast Pnp1, mammalian PNP). Because
    NR is a pyridine, not a purine, nucleoside, this reaction falls outside GO:0004731. Belenky et al.
    2009 measured it directly for yeast Pnp1 and bovine Pnp.
  proposed_parent:
    id: GO:0016763
    label: pentosyltransferase activity
  supported_by:
  - reference_id: PMID:19001417
    supporting_text: We purified yeast Pnp1 to measure the phosphorylase activity of recombinant Pnp1
      and bovine Pnp on both inosine and NR
  - reference_id: PMID:19001417
    supporting_text: yeast Pnp1 exhibited a specificity constant for NR greater than 9% of the corresponding
      value for inosine
suggested_questions:
- question: Does Pnp1 phosphorolyse 2'-deoxyinosine and 2'-deoxyguanosine in vivo, as inferred from the
    PNP family, and is that relevant to dNTP pool homeostasis in yeast?
- question: Under what physiological conditions (e.g. starvation-induced RNA turnover) does Pnp1-dependent
    NR phosphorolysis contribute measurably to the NAD+ pool?
suggested_experiments:
- description: Assay purified Pnp1 with 2'-deoxyinosine and 2'-deoxyguanosine, and measure deoxynucleoside
    accumulation in pnp1 cells, to test the inherited deoxynucleoside catabolism annotations.
