- source: UniProt
  text: The purine nucleoside phosphorylases catalyze the phosphorolytic breakdown
    of the N-glycosidic bond in the beta- (deoxy)ribonucleoside molecules, with the
    formation of the corresponding free purine bases and pentose-1-phosphate. Cleaves
    guanosine and inosine (By similarity).
