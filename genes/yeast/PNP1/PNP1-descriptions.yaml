descriptions:
- source: UniProt
  text: The purine nucleoside phosphorylases catalyze the phosphorolytic breakdown
    of the N-glycosidic bond in the beta- (deoxy)ribonucleoside molecules, with the
    formation of the corresponding free purine bases and pentose-1-phosphate. Cleaves
    guanosine and inosine (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05788
  source_id: Q05788
- source: Alliance_Imported
  text: Purine nucleoside phosphorylase; specifically metabolizes inosine and guanosine
    nucleosides; involved in the nicotinamide riboside salvage pathway
  source_type: curated
  url: https://www.yeastgenome.org/locus/PNP1
  source_id: SGD:S000004199
- source: Alliance_Automated
  text: Enables inosine nucleosidase activity; nicotinamide riboside hydrolase activity;
    and purine-nucleoside phosphorylase activity. Involved in nucleobase-containing
    small molecule metabolic process. Predicted to be located in cytoplasm. Predicted
    to be active in cytosol. Human ortholog(s) of this gene implicated in purine nucleoside
    phosphorylase deficiency and purine-pyrimidine metabolic disorder. Orthologous
    to human PNP (purine nucleoside phosphorylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PNP1
  source_id: SGD:S000004199
