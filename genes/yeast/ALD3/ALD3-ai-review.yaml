id: P54114
gene_symbol: ALD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ALD3 (YMR169C) encodes a cytoplasmic, stress-inducible NAD+-dependent aldehyde dehydrogenase
  of the ALDH superfamily, tandemly duplicated with its close paralog ALD2 (YMR170C). Its expression is
  controlled by the general-stress transcription factors Msn2/Msn4 and is induced by osmotic shock, heat
  shock, oxidative stress, drugs and glucose exhaustion (diauxic shift). Together with Ald2, Ald3 oxidizes
  3-aminopropanal, the aldehyde released when the FAD-dependent polyamine oxidase Fms1 cleaves spermine,
  to beta-alanine; this is the route by which S. cerevisiae makes the beta-alanine needed for pantothenate
  and hence coenzyme A synthesis, and ald2 ald3 double mutants require beta-alanine or pantothenate. Ald3
  also has general aliphatic aldehyde dehydrogenase activity and has been implicated in ethanol/acetaldehyde
  oxidation, although an ald2 ald3 double mutant shows only a mild growth defect on ethanol.
