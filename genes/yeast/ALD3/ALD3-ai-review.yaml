suggested_questions:
- question: What fraction of cellular beta-alanine is supplied by Ald3 versus Ald2 under non-stress versus
    stress (Msn2/4-inducing) conditions, given that ALD3 is the more broadly stress-induced paralog?
- question: Is the ethanol-medium growth defect of ald2 ald3 mutants due to acetaldehyde oxidation or
    to a pantothenate/CoA limitation?
suggested_experiments:
- description: Measure kinetic parameters of purified Ald3 versus Ald2 with 3-aminopropanal, acetaldehyde
    and other aliphatic aldehydes, with NAD+ versus NADP+, to define substrate and cofactor specificity.
