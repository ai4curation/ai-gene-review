id: P15700
gene_symbol: URA6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: URA6 encodes the essential UMP kinase (uridylate kinase, EC 2.7.4.14) of Saccharomyces cerevisiae,
  a monomeric short-form member of the adenylate kinase family (UMP-CMP kinase subfamily). It phosphorylates
  UMP to UDP using ATP (or dATP), linking de novo UMP synthesis and uracil/uridine salvage to UTP and
  CTP production; dUMP is used with similar efficiency, and lower activity has been reported with other
  monophosphates (CMP, dCMP, AMP, GMP, dTMP), although reports on the secondary substrates conflict. Ura6
  has measurable AMP kinase activity, enough to suppress loss of the major adenylate kinase Aky2/Adk1
  when overexpressed, and at high copy it suppresses cdc8 (thymidylate kinase) mutants. The enzyme is
  about 80% cytoplasmic and 20% nuclear and is absent from mitochondria.
