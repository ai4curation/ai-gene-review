gene_symbol: URA6
organism: yeast
uniprot_id: P15700
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of pyrimidine nucleoside monophosphates at the
    expense of ATP. Plays an important role in de novo pyrimidine nucleotide biosynthesis.
    Has preference for UMP and dUMP as phosphate acceptors, but can also use CMP,
    dCMP, AMP, GMP, dGMP and dTMP. ATP and dATP are the best phosphate donors, but
    can also use GTP, dGTP, dCTP, and dTTP to some degree.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P15700
  source_id: P15700
- source: Alliance_Imported
  text: Uridylate kinase; catalyzes the seventh enzymatic step in the de novo biosynthesis
    of pyrimidines, converting uridine monophosphate (UMP) into uridine-5'-diphosphate
    (UDP)
  source_type: curated
  url: https://www.yeastgenome.org/locus/URA6
  source_id: SGD:S000001507
- source: Alliance_Automated
  text: Enables AMP kinase activity and UMP kinase activity. Involved in 'de novo'
    pyrimidine nucleobase biosynthetic process. Located in cytoplasm and nucleus.
    Used to study cancer. Human ortholog(s) of this gene implicated in lung non-small
    cell carcinoma. Orthologous to human CMPK1 (cytidine/uridine monophosphate kinase
    1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/URA6
  source_id: SGD:S000001507
