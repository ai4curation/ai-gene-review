taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Mitochondrial isozyme that reduces acetaldehyde to ethanol during the fermentation
    of glucose (Probable) (PubMed:22094012). Involved in the shuttling of mitochondrial
    reducing equivalents to the cytosol, where the redox balance is restored by NADH
    dehydrogenases on the external side of the mitochondrial inner membrane (PubMed:10940011).
    Shows a high affinity for alcohols with a double bond conjugated to the alcohol
    group (PubMed:1101965).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07246
  source_id: P07246
- source: Alliance_Imported
  text: Mitochondrial alcohol dehydrogenase isozyme III; involved in the shuttling
    of mitochondrial NADH to the cytosol under anaerobic conditions and ethanol production
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADH3
  source_id: SGD:S000004688
- source: Alliance_Automated
  text: Enables butanol dehydrogenase (NAD+) activity and ethanol dehydrogenase (NAD+)
    activity. Involved in L-leucine catabolic process. Located in mitochondrial inner
    membrane and mitochondrial matrix.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADH3
  source_id: SGD:S000004688
