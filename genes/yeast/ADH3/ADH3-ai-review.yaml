- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: EXP
  original_reference_id: PMID:2937632
  qualifier: located_in
  review:
    summary: van Loon & Young showed ADH III is located "inside the mitochondrial inner membrane", i.e.
      in the matrix, not in the membrane; other studies place it in the matrix. The inner-membrane annotation
      (and the UniProt SubCell mapping derived from the same paper) misreads this.
    action: MODIFY
    reason: Evidence supports matrix, not membrane, localisation.
    proposed_replacement_terms:
    - id: GO:0005759
      label: mitochondrial matrix
    supported_by:
    - reference_id: PMID:2937632
      supporting_text: Here we demonstrate that ADHIII is located inside the mitochondrial inner membrane.
    - reference_id: PMID:3550419
      supporting_text: Alcohol dehydrogenase isoenzyme III (ADH III) in Saccharomyces cerevisiae, the
        product of the ADH3 gene, is located in the mitochondrial matrix.
