- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN008677163
  - SGD:S000004688
  - SGD:S000004918
  - SGD:S000005446
  review:
    summary: PAINT IBA "cytoplasm" inherited from the cytosolic ADH clade. ADH3 diverged by acquiring
      a mitochondrial presequence and resides in the mitochondrial matrix; although mitochondria are formally
      part of the cytoplasm in GO, this annotation conveys the ancestral cytosolic location that ADH3
      does not share.
    action: MARK_AS_OVER_ANNOTATED
    reason: Lineage-specific relocation to the mitochondrion; matrix location is captured by more specific
      annotations.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008677163
        source_label: PTN008677163
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Cytoplasmic location holds for ADH1/ADH2/ADH5 but ADH3 acquired an N-terminal mitochondrial
          presequence and is imported into the matrix.
    supported_by:
    - reference_id: PMID:3550419
      supporting_text: Alcohol dehydrogenase isoenzyme III (ADH III) in Saccharomyces cerevisiae, the
        product of the ADH3 gene, is located in the mitochondrial matrix.
    - reference_id: PMID:2937632
      supporting_text: two in the cytoplasm (ADHI and ADHII) and one in the mitochondrion (ADHIII)
