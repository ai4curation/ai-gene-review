- question: Which other mitochondrial alcohol dehydrogenase provides residual redox-shuttle activity in
    adh3 ndi1 double mutants?
- question: Is there a GO process term suitable for the mitochondrial ethanol-acetaldehyde redox shuttle
    (NADH shuttle) that should be used for ADH3?
suggested_experiments:
- description: Identify the residual mitochondrial ADH activity in adh3 ndi1 cells by fractionation and
