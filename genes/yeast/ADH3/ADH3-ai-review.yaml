id: P07246
gene_symbol: ADH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADH3 encodes alcohol dehydrogenase III, the mitochondrial isozyme of the yeast medium-chain
  zinc ADH family. It is synthesised with a cleavable N-terminal presequence and imported into the mitochondrial
  matrix, where it is the only ADH present. ADH III interconverts ethanol and acetaldehyde using NAD(H)
  and forms part of an ethanol-acetaldehyde redox shuttle that transfers reducing equivalents from intramitochondrial
  NADH to the cytosol, which is important when the internal NADH dehydrogenase NDI1 is absent and for
  redox balance under anaerobic growth. It can also reduce Ehrlich-pathway fusel aldehydes redundantly
  with the other ADHs and SFA1.
