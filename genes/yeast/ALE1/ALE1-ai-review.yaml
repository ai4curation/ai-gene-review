gene_symbol: ALE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ALE1 (YOR175C; also LPT1/SLC4) encodes the major acyl-CoA-dependent lysophospholipid acyltransferase
  (LPLAT) of budding yeast, a multi-pass membrane-bound O-acyltransferase (MBOAT family, orthologous to
  human MBOAT1/2) residing in the endoplasmic reticulum and enriched in the mitochondria-associated ER
  membrane. Ale1 has broad acceptor specificity: it acylates lysophosphatidylcholine (its preferred substrate),
  lysophosphatidylethanolamine and lysophosphatidic acid, and to a lesser extent lysophosphatidylserine,
  -inositol and -glycerol, preferring unsaturated (monounsaturated) acyl-CoAs, and it also has lyso-PAF
  acetyltransferase activity. It is the main LPCAT and LPEAT of the cell, re-acylating imported or endogenously
  generated lysolipids (including LPC formed by Gpc1 in the PC deacylation/reacylation pathway) and thereby
  contributing to phospholipid synthesis and acyl-chain remodeling. Ale1 also acts as a secondary 1-acylglycerol-3-phosphate
  acyltransferase alongside Slc1: ale1 slc1 double mutants are inviable, showing that Ale1 can supply
  the phosphatidic acid needed for glycerolipid synthesis.'
