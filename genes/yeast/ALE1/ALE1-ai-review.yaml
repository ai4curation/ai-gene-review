suggested_questions:
- question: How much of in vivo PA synthesis for triacylglycerol, as opposed to phospholipid remodeling,
    is carried out by Ale1 in wild-type cells where Slc1 is present?
- question: Does the MAM enrichment of Ale1 channel PE or PC to mitochondria, and is it regulated by growth
    conditions?
- question: Is lyso-PAF acetyltransferase activity physiologically relevant in yeast or an in vitro side
    activity of the broad-specificity MBOAT?
suggested_experiments:
