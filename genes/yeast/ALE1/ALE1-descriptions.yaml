- source: Alliance_Automated
  text: Enables acyltransferase activity, transferring groups other than amino-acyl
    groups. Involved in phosphatidylethanolamine biosynthetic process. Acts upstream
    of or within phosphatidylcholine acyl-chain remodeling and phosphatidylcholine
    biosynthetic process. Located in endoplasmic reticulum membrane. Is active in
    mitochondria-associated endoplasmic reticulum membrane contact site. Orthologous
    to several human genes including MBOAT2 (membrane bound glycerophospholipid O-acyltransferase
    2).
