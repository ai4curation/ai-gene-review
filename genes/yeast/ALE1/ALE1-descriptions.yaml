  text: Broad-specificity lysophospholipid acyltransferase; major lysophosphatidylethanolamine
    acyltransferase that localizes to the mitochondria-associated ER membrane; member
    of the MBOAT family of membrane-bound O-acyltransferases; key component of Lands
    cycle; capable of remodeling phosphatidylcholine containing VLC polyunsaturated
    fatty acids and involved in fatty acid exchange at the sn-2 position of mature
    glycerophospholipids
