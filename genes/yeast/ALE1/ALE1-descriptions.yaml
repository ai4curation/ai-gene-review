descriptions:
- source: UniProt
  text: Broad specificity membrane-bound O-acyltransferase that mediates the incorporation
    of unsaturated acyl chains into the sn-2 position of various lysophospholipids.
    Preferentially acylates lysophosphocholine (LPC), but also lysophosphoethanolamine
    (LPE), lysophosphatidylglycerol (LPG), lysophosphatidic acid (LPA), lysophosphoethanolamine
    (LPE), lysophosphoinositol (LPI), and lysophosphoserine (LPS) (PubMed:17652094,
    PubMed:17675291, PubMed:17726007, PubMed:17890783, PubMed:17996202). Prefers an
    acyl residue to an alkyl residue at the sn-1 position of lysophospholipid acceptors.
    Accepts acyl chains in acyl-CoA from C-2 to C-20, and shows strong preference
    for unsaturated acyl-CoAs with 16-20 carbons (PubMed:17890783). Together with
    SLC1, plays a central role in phosphatidic acid (PA) biosynthesis. PA is the intermediate,
    from which all glycerophospholipids are synthesized (PubMed:17890783). Can also
    introduce an acyl chain at the sn-1 position of the lysophosphatidylcholine analog
    1-hydroxy-2-hexadecyl-sn-glycero-3- phosphocholine (HHPC) (PubMed:29782033).
