gene_symbol: PIK1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Pik1 is one of the two essential type III phosphatidylinositol 4-kinases of Saccharomyces cerevisiae
  (orthologous to mammalian PI4KIIIbeta/PI4KB). It phosphorylates phosphatidylinositol at the D-4 position to generate
  PtdIns4P (EC 2.7.1.67), the precursor of PtdIns(4,5)P2. Pik1 is a soluble protein that is recruited to trans-Golgi
  network cisternae by its calcium-binding regulatory subunit Frq1 (frequenin) and the clathrin adaptor Gga2, and
  it also shuttles into the nucleus (Kap95 import, Msn5 export). The Golgi pool of PtdIns4P made by Pik1 is required
  for exit of secretory cargo from the late Golgi, Golgi and vacuole membrane dynamics, clathrin adaptor progression
  at the TGN and Atg9 trafficking for autophagy; a nuclear pool is also required for viability. Pik1 and the plasma-membrane
  PI4K Stt4 together produce almost all cellular PtdIns4P but cannot substitute for each other.
