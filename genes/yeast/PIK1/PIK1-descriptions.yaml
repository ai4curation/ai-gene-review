    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Correct PI 4-kinase, TGN and nuclear locations, autophagy and Atg9
      trafficking. Cytokinesis remains hedged; Golgi exit of secretory cargo and Frq1
      are not named.
- source: Alliance_Automated
  text: Enables 1-phosphatidylinositol 4-kinase activity. Involved in several processes,
    including microlipophagy; positive regulation of autophagosome assembly; and positive
    regulation of protein transport. Located in nucleus and trans-Golgi network. Human
    ortholog(s) of this gene implicated in autosomal dominant nonsyndromic deafness
    87. Orthologous to human PI4KB (phosphatidylinositol 4-kinase beta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PIK1
  source_id: SGD:S000005211
