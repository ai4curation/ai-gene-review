gene_symbol: PIK1
organism: yeast
uniprot_id: P39104
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Acts on phosphatidylinositol (PI) in the first committed step in the production
    of the second messenger inositol 1,4,5,-trisphosphate (PubMed:19898464, PubMed:8194527,
    PubMed:8248783). PIK1 is part of a nuclear phosphoinositide cycle and could control
    cytokinesis through the actin cytoskeleton (PubMed:8194527). Involved in the response
    to mating pheromone (PubMed:8248783).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39104
  source_id: P39104
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: 'Dated: frames Pik1 as the first committed step to IP3, part of
      a nuclear PI cycle controlling cytokinesis, and in pheromone response. Omits
      the TGN PtdIns4P role in secretion that the review treats as core.'
- source: Alliance_Imported
  text: Phosphatidylinositol 4-kinase; catalyzes the first step in the biosynthesis
    of phosphatidylinositol-4,5-biphosphate; may control cytokinesis through the actin
    cytoskeleton; required for autophagosome formation during autophagy and for lipophagy
    in both stationary phase cells and during nitrogen starvation; may control nonselective
    autophagy and mitophagy through trafficking of Atg9p; localizes to the nucleus
    and to the trans-Golgi network
  source_type: curated
  url: https://www.yeastgenome.org/locus/PIK1
  source_id: SGD:S000005211
