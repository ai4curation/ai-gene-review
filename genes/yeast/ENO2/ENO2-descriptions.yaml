- source: Alliance_Automated
  text: Enables melatonin binding activity and phosphopyruvate hydratase activity.
    Involved in glycolytic process and regulation of vacuole fusion, non-autophagic.
    Located in cytoplasmic side of plasma membrane; fungal-type vacuole; and mitochondrion.
    Part of phosphopyruvate hydratase complex. Human ortholog(s) of this gene implicated
    in Alzheimer's disease; glycogen storage disease XIII; and prostate cancer. Orthologous
    to human ENO1 (enolase 1); ENO2 (enolase 2); and ENO3 (enolase 3).
  source_type: automated
