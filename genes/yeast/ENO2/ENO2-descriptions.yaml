descriptions:
- source: Alliance_Imported
  text: Enolase II, a phosphopyruvate hydratase; catalyzes conversion of 2-phosphoglycerate
    to phosphoenolpyruvate during glycolysis and the reverse reaction during gluconeogenesis;
    mRNA is asymmetrically distributed to daughter cells in a Sir2p-dependent manner,
    and asymmetry is lost during replicative aging; expression induced in response
    to glucose; ENO2 has a paralog, ENO1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ENO2
  source_id: SGD:S000001217
- source: Alliance_Automated
  text: Enables melatonin binding activity and phosphopyruvate hydratase activity.
    Involved in glycolytic process and regulation of vacuole fusion, non-autophagic.
    Located in cytoplasmic side of plasma membrane; fungal-type vacuole; and mitochondrion.
    Part of phosphopyruvate hydratase complex. Human ortholog(s) of this gene implicated
    in Alzheimer's disease; glycogen storage disease XIII; and prostate cancer. Orthologous
    to human ENO1 (enolase 1); ENO2 (enolase 2); and ENO3 (enolase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ENO2
  source_id: SGD:S000001217
