descriptions:
- source: Alliance_Imported
  text: Enolase II, a phosphopyruvate hydratase; catalyzes conversion of 2-phosphoglycerate
    to phosphoenolpyruvate during glycolysis and the reverse reaction during gluconeogenesis;
    mRNA is asymmetrically distributed to daughter cells in a Sir2p-dependent manner,
    and asymmetry is lost during replicative aging; expression induced in response
    to glucose; ENO2 has a paralog, ENO1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ENO2
