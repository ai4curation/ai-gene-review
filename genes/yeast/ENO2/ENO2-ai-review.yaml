id: P00925
gene_symbol: ENO2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ENO2 encodes enolase 2 of Saccharomyces cerevisiae, the predominant of two highly similar
  enolase isozymes (phosphopyruvate hydratase, EC 4.2.1.11) and one of the most abundant proteins in fermenting
  cells. The Mg2+-dependent enzyme reversibly dehydrates 2-phospho-D-glycerate to phosphoenolpyruvate,
  a step shared by glycolysis and gluconeogenesis. Eno2 forms homodimers and heterodimers with Eno1. ENO2
  is essential and is strongly induced by glucose, giving about 20-fold more Eno2 than Eno1 in glucose-grown
  cells. Enolase is predominantly cytosolic, but small pools associate with vacuoles, where enolase stimulates
  homotypic vacuole fusion independently of catalysis, with the mitochondrial surface, and with the cell
  surface.
