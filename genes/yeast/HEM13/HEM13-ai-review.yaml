suggested_questions:
- question: How is protoporphyrinogen IX produced by cytosolic Hem13 delivered to the mitochondrial inner
    membrane for oxidation by Hem14, and is a dedicated carrier or contact site involved?
suggested_experiments:
- description: Target Hem13 to the mitochondrial intermembrane space (as in metazoa) and compare heme
    synthesis and porphyrin accumulation with the native cytosolic enzyme to probe the importance of compartmentation.
