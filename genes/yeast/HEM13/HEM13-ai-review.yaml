  label: Saccharomyces cerevisiae S288C
description: Oxygen-dependent coproporphyrinogen III oxidase (CPO; EC 1.3.3.3) of Saccharomyces cerevisiae,
  the sixth enzyme of heme biosynthesis. Hem13 catalyses the O2-dependent oxidative decarboxylation of
  the propionate side chains of rings A and B of coproporphyrinogen III to vinyl groups, forming protoporphyrinogen
  IX; it has no anaerobic activity. The enzyme is a homodimer and, unlike its metazoan orthologs (mitochondrial
  intermembrane space), is located in the cytosol in yeast. HEM13 expression is repressed by heme and
  oxygen and strongly induced under hypoxia, and this induction is needed to sustain heme formation at
  low oxygen.
