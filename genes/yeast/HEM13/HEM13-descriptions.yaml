descriptions:
- source: UniProt
  text: Involved in the heme biosynthesis. Catalyzes the aerobic oxidative decarboxylation
    of propionate groups of rings A and B of coproporphyrinogen-III to yield the vinyl
    groups in protoporphyrinogen- IX.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P11353
  source_id: P11353
- source: Alliance_Imported
  text: Coproporphyrinogen III oxidase; oxygen-requiring enzyme that catalyzes sixth
    step in heme biosynthetic pathway; transcription is repressed by oxygen and heme
    (via Rox1p and Hap1p); human homolog CPOX can complement yeast mutant and allow
    growth of haploid null after sporulation of a heterozygous diploid
  source_type: curated
  url: https://www.yeastgenome.org/locus/HEM13
  source_id: SGD:S000002451
- source: Alliance_Automated
  text: Enables coproporphyrinogen oxidase activity. Involved in heme biosynthetic
    process. Located in cytoplasm. Is active in cytosol. Human ortholog(s) of this
    gene implicated in hereditary coproporphyria and liver disease. Orthologous to
    human CPOX (coproporphyrinogen oxidase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HEM13
  source_id: SGD:S000002451
