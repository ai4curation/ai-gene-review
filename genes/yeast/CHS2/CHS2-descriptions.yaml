- source: Alliance_Imported
  text: Chitin synthase II; catalyzes transfer of N-acetylglucosamine (GlcNAc) to
    chitin upon activation of zymogenic form; required for chitin synthesis in the
    primary septum during cytokinesis; localization regulated by Cdk1p during mitosis;
    phosphorylation by Dbf2p kinase regulates its dynamics and chitin synthesis during
    cytokinesis
