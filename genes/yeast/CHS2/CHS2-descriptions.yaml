gene_symbol: CHS2
organism: yeast
uniprot_id: P14180
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Polymerizes chitin, a structural polymer of the cell wall and septum, by transferring
    the sugar moiety of UDP-GlcNAc to the non- reducing end of the growing chitin
    polymer (Probable). Required for septum formation (Probable).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P14180
  source_id: P14180
- source: Alliance_Imported
  text: Chitin synthase II; catalyzes transfer of N-acetylglucosamine (GlcNAc) to
    chitin upon activation of zymogenic form; required for chitin synthesis in the
    primary septum during cytokinesis; localization regulated by Cdk1p during mitosis;
    phosphorylation by Dbf2p kinase regulates its dynamics and chitin synthesis during
    cytokinesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/CHS2
  source_id: SGD:S000000242
- source: Alliance_Automated
  text: Enables chitin synthase activity. Involved in chitin biosynthetic process
    and mitotic actomyosin contractile ring contraction. Located in cellular bud neck.
    Orthologous to human HAS3 (hyaluronan synthase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CHS2
  source_id: SGD:S000000242
