  review:
    summary: Chs2p itself synthesizes the chitin that constitutes the primary septum (it performs the polymerisation
      step that builds the structure), so this is participation, not merely requirement. GOA carries only the generic
      chitin biosynthetic process and the contractile-ring term; the comparator HOF1 carries GO:0031671 by IMP in
