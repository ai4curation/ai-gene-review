description: 'Chitin synthase 2 (Chs2p) of Saccharomyces cerevisiae is a multi-pass plasma-membrane class II chitin
  synthase (GT2 family) that polymerises N-acetylglucosamine from UDP-GlcNAc (EC 2.4.1.16; chitin synthase II, Co2+-stimulated,
  trypsin-activated). Chs2p synthesizes the chitinous primary septum at the mother-bud neck during cytokinesis.
  Its expression is cell-cycle regulated: it is held in the ER until mitotic exit, when dephosphorylation by Cdc14
  and phosphorylation by the MEN kinase Dbf2 allow its delivery to the bud neck, where it lays down the primary
  septum behind the contracting actomyosin ring, after which it is endocytosed and degraded in the vacuole. Chs2p
  activity at the neck stabilises the contractile ring during contraction, coupling septum extracellular matrix
  assembly to ring constriction. Catalytic residues in the conserved con1 and con2 regions (e.g. D441, D562, D800,
  W803, T805) are required for activity.'
