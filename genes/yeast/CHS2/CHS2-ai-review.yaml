suggested_questions:
- question: How does Chs2p at the neck mechanically or biochemically stabilize the actomyosin ring - via the septum
    ECM itself or via direct interactions with ring/IPC components (e.g., Hof1, Cyk3, Inn1)?
- question: Is Dbf2 phosphorylation of Chs2 S217 primarily controlling activity, ER export, or residence at the
    neck?
suggested_experiments:
- description: Separate catalytic and scaffolding contributions of Chs2p to ring stability using catalytically dead
    (con2 D800A) Chs2 that still localizes to the neck, imaging ring contraction dynamics.
