- term:
    id: GO:0000822
    label: inositol hexakisphosphate binding
  evidence_type: IDA
  original_reference_id: PMID:27080106
  qualifier: enables
  review:
    summary: SPX domain of Vtc4 binds InsP6 and related inositol (pyro)phosphates; crystal structures
      of SPX-Vtc4 with InsP6 and binding-surface mutants.
    action: ACCEPT
    reason: Direct binding is shown for the Vtc4 SPX domain, and binding-surface mutations impair both
      InsP binding and polyP synthesis in yeast. In the assembled complex the Vtc4 SPX (not Vtc3) is the
      PP-InsP sensor. InsP6 is the experimentally used ligand; the physiological activator is probably
      5-InsP7/1,5-InsP8, but this term is precise for what was measured. Core regulatory input.
    supported_by:
    - reference_id: PMID:27080106
      supporting_text: Substitutions of critical binding surface residues impair InsP binding in vitro,
        inorganic polyphosphate synthesis in yeast
    - reference_id: PMID:36759618
      supporting_text: Together, these findings reveal that it is the SPX domain of Vtc4, rather than
        that of Vtc3, which acts as the PP-InsP nutrient sensor in fully assembled VTC complex.
