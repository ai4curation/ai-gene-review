    supporting_text: Nucleotide- and phosphate-bound structures suggest that the enzyme functions by metal-assisted
      cleavage of the ATP gamma-phosphate, which is then in-line transferred to an acceptor phosphate
      to form polyP chains.
  - reference_id: PMID:36759618
