id: P47075
gene_symbol: VTC4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Vtc4 is the catalytic subunit of the vacuolar transporter chaperone (VTC) complex, the membrane-integral
  polyphosphate (polyP) polymerase of S. cerevisiae. It has an N-terminal SPX domain, a central cytosolic
  triphosphate tunnel metalloenzyme (TTM/VTC) domain and three C-terminal transmembrane helices. The central
  domain transfers the gamma-phosphate of ATP to a growing polyP chain (Mn2+-dependent; active-site Lys458),
  and the nascent chain is threaded through a channel formed by the transmembrane helices of Vtc4, Vtc3
  (or Vtc2) and three Vtc1 subunits, so that synthesis is obligatorily coupled to polyP import into the
  vacuole lumen. Binding of inositol (pyro)phosphates to the Vtc4 SPX domain activates the enzyme, linking
  polyP storage to cellular phosphate status. Vtc4 is required for polyP accumulation and resides mainly
  on the vacuolar membrane, with a pool on the ER and cell periphery. The VTC complex also contributes
  to homotypic vacuole fusion and to microautophagic vesicle scission, and Vtc4 binds calmodulin; these
  roles are less well understood.
