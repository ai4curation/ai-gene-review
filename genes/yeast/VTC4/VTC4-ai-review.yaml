    label: vacuolar transporter chaperone complex
  supported_by:
  - reference_id: PMID:27080106
    supporting_text: Substitutions of critical binding surface residues impair InsP binding in vitro,
      inorganic polyphosphate synthesis in yeast
  - reference_id: PMID:36759618
    supporting_text: Together, these findings reveal that it is the SPX domain of Vtc4, rather than that
      of Vtc3, which acts as the PP-InsP nutrient sensor in fully assembled VTC complex.
proposed_new_terms:
- proposed_name: polyphosphate transmembrane transport
  proposed_definition: The process in which inorganic polyphosphate is transported across a membrane,
    as when a nascent polyphosphate chain is translocated from the cytosol into the vacuole lumen.
  justification: The VTC complex forms a polyP-selective transmembrane channel that couples synthesis
    with import into the vacuole; no GO term describes polyP transport.
  proposed_parent:
    id: GO:0055085
    label: transmembrane transport
  supported_by:
  - reference_id: PMID:36759618
    supporting_text: Fifteen trans-membrane helices form a novel membrane channel enabling the transport
      of newly synthesized polyP into the vacuolar lumen.
suggested_questions:
- question: Is the requirement of Vtc4 for homotypic vacuole fusion (Sec18/NSF priming, LMA1 binding,
    V0 trans-complex formation) a direct role of the protein, or an indirect consequence of lumenal polyP
    signalling to SNAREs?
- question: Does Vtc4 contribute directly to scission of microautophagic vesicles, or does loss of polyP
    synthesis alter vacuolar membrane properties needed for scission?
- question: Which inositol pyrophosphate (5-InsP7 or 1,5-InsP8) is the physiological activator of the
    Vtc4 SPX domain in vivo?
suggested_experiments:
- description: Test vacuole fusion and microautophagy in strains carrying a catalytically dead Vtc4 (K458A
    or R264A/R266A) that still assembles the VTC complex, to separate structural from polyP-dependent
    roles.
