- term:
    id: GO:0034486
    label: vacuolar transmembrane transport
  evidence_type: IMP
  original_reference_id: PMID:36759618
  review:
    summary: Vtc4 contributes TM1 to the 15-helix polyP channel and orients its catalytic domain over
      the channel entrance; channel-residue mutations in any subunit, including Vtc4 K622A/R629A, eliminate
      the vacuolar polyP store.
    action: NEW
    reason: 'Participation test: the VTC transmembrane channel performs polyP translocation across the
      vacuolar membrane, and Vtc4 is a structural part of that channel (TM1 lines the pore; R629 lines
      the narrowest point) as well as supplying the nascent chain. This is participation, not mere necessity.
      No polyP-specific transport term exists, so the general vacuolar transmembrane transport term is
      used; a specific term is proposed in proposed_new_terms.'
    supported_by:
    - reference_id: PMID:36759618
      supporting_text: Fifteen trans-membrane helices form a novel membrane channel enabling the transport
        of newly synthesized polyP into the vacuolar lumen.
    - reference_id: PMID:36759618
      supporting_text: in-cell 31P-NMR measurements showed that mutations targeting on above-mentioned
        channel residues in any subunit eliminated the VTC-generated vacuolar polyP store in yeast strains
    - reference_id: PMID:25315834
      supporting_text: the VTC complex obligatorily couples synthesis of polyP to its import in order
        to avoid toxic intermediates in the cytosol
