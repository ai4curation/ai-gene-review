  text: Enables calmodulin binding activity; inositol hexakisphosphate binding activity;
    and polyphosphate kinase activity. Involved in microautophagy; polyphosphate biosynthetic
    process; and vacuolar transport. Located in endoplasmic reticulum membrane and
    vacuolar membrane. Part of vacuolar transporter chaperone complex.
