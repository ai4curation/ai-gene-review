  text: Vacuolar membrane polyphosphate polymerase; subunit of vacuolar transporter
    chaperone (VTC) complex involved in synthesis and transfer of polyP to vacuole;
    regulates membrane trafficking; role in non-autophagic vacuolar fusion; targeted
    to vacuole via AP-3 pathway; protein abundance increases in response to DNA replication
    stress
