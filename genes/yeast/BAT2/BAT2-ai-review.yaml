core_functions:
- description: Cytosolic branched-chain amino acid aminotransferase (EC 2.6.1.42, PLP-dependent) that
    catalyses the first, transamination step of L-leucine, L-isoleucine and L-valine degradation (Ehrlich
    pathway), converting the BCAAs to their 2-keto acids with 2-oxoglutarate as amino acceptor. It also
    provides a back-up biosynthetic BCAT activity in the cytosol.
  molecular_function:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  directly_involved_in:
  - id: GO:0006552
    label: L-leucine catabolic process
  - id: GO:0006550
    label: L-isoleucine catabolic process
  - id: GO:0006574
    label: L-valine catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
