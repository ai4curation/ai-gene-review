id: P47176
gene_symbol: BAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: BAT2 (ECA40/TWT2) encodes the cytosolic branched-chain amino acid aminotransferase (BCAT,
  EC 2.6.1.42) of Saccharomyces cerevisiae, a PLP-dependent fold-type IV transaminase that lacks the mitochondrial
  presequence of its whole-genome-duplication paralog BAT1. Bat2 reversibly transaminates L-leucine, L-isoleucine
  and L-valine with 2-oxoglutarate. Its predominant physiological role is the first step of BCAA catabolism
  via the Ehrlich pathway, producing the 2-keto acids that are decarboxylated and reduced to fusel alcohols
  (isoamyl alcohol, 2-methylbutanol, isobutanol); BAT2 expression is highest under catabolic conditions
  (BCAAs as nitrogen source, stationary phase). Bat2 also contributes, redundantly with Bat1, to the final
  biosynthetic step, so only bat1 bat2 double mutants are BCAA auxotrophs. Bat2 additionally transaminates
  2-keto-4-methylthiobutyrate in the methionine salvage cycle.
