gene_symbol: BAT2
organism: yeast
uniprot_id: P47176
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Cytoplasmic isozyme of branched-chain-amino-acid aminotransferase, which catalyzes
    the first reaction in the catabolism of the essential branched chain amino acids
    (BCAAs) leucine, isoleucine, and valine (PubMed:21267457, PubMed:8702755, PubMed:8798704).
    Catalyzes the formation of methionine from 2-keto-4- methylthiobutyrate (KMTB)
    in the methionine salvage pathway primarily using BCAAs (leucine, isoleucine,
    and valine) as well as lysine and proline as the amino donors (PubMed:18625006).
    Involved in cell cycle regulation (Probable).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47176
  source_id: P47176
- source: Alliance_Imported
  text: Cytosolic branched-chain amino acid (BCAA) aminotransferase; preferentially
    involved in BCAA catabolism; homolog of murine ECA39; highly expressed during
    stationary phase and repressed during logarithmic phase; BAT2 has a paralog, BAT1,
    that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/BAT2
  source_id: SGD:S000003909
- source: Alliance_Automated
  text: Enables branched-chain-amino-acid:2-oxoglutarate transaminase activity. Involved
    in branched-chain amino acid biosynthetic process and branched-chain amino acid
    catabolic process. Located in cytoplasm. Human ortholog(s) of this gene implicated
    in hypervalinemia and hyperleucine-isoleucinemia. Orthologous to human BCAT1 (branched
    chain amino acid transaminase 1) and BCAT2 (branched chain amino acid transaminase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BAT2
  source_id: SGD:S000003909
