descriptions:
- source: UniProt
  text: Cytoplasmic isozyme of branched-chain-amino-acid aminotransferase, which catalyzes
    the first reaction in the catabolism of the essential branched chain amino acids
    (BCAAs) leucine, isoleucine, and valine (PubMed:21267457, PubMed:8702755, PubMed:8798704).
    Catalyzes the formation of methionine from 2-keto-4- methylthiobutyrate (KMTB)
    in the methionine salvage pathway primarily using BCAAs (leucine, isoleucine,
    and valine) as well as lysine and proline as the amino donors (PubMed:18625006).
    Involved in cell cycle regulation (Probable).
  source_type: curated
