id: P26263
gene_symbol: PDC6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PDC6 (YGR087C) encodes pyruvate decarboxylase isozyme 3 (EC 4.1.1.1), a thiamine diphosphate-
  and Mg2+-dependent paralog of Pdc1p and Pdc5p. It has an unusually low content of sulfur-containing
  amino acids. PDC6 is weakly expressed on glucose and does not compensate for loss of PDC1 and PDC5 under
  standard expression conditions; activation by fusion to the PDC1 promoter can partially restore glucose
  fermentation. It is induced under sulfur limitation (a sulfur-economy response) and during growth on
  ethanol, where its deletion reduces Pdc activity. When expressed individually, Pdc6p decarboxylates
  pyruvate, 2-oxobutanoate, 2-oxopentanoate and branched-chain and sulfur-containing 2-oxo acids. It therefore
  contributes to Ehrlich-pathway fusel alcohol formation from valine and isoleucine, but it shows no detectable
  phenylpyruvate decarboxylase activity in direct assays. It is cytosolic.
