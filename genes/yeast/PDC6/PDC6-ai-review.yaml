- term:
    id: GO:0006067
    label: ethanol metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00043340
  review:
    summary: Pdc6 executes the pyruvate-to-acetaldehyde reaction of ethanol fermentation, with its contribution
      strongly controlled by expression.
    action: MODIFY
    supported_by:
    - reference_id: PMID:22904058
      supporting_text: only Pdc1, Pdc5, and Pdc6 catalyzed the decarboxylation of the linear-chain 2-oxo
        acids pyruvate, 2-oxo-butanoate, and 2-oxo-pentanoate in cell extracts
    - reference_id: PMID:1807827
      supporting_text: Spontaneous mutants, derived from such a pdc1 pdc5 strain, were isolated which
        could again ferment glucose.
    - reference_id: PMID:1807827
      supporting_text: They showed pyruvate decarboxylase activity due to a duplication of PDC6.
    reason: Refine the broad ethanol metabolic process to pyruvate fermentation to ethanol. The original
      ethanol-grown deletion phenotype remains evidence for conditional Pdc activity, not ethanol oxidation.
      Independent promoter-activation genetics establishes fermentative capacity; basal failure to rescue
      pdc1 pdc5 is not catalytic incapacity.
    proposed_replacement_terms:
    - id: GO:0019655
      label: pyruvate fermentation to ethanol
