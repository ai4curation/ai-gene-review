    summary: 'Dickinson et al. 2003 multiple-mutant analysis (genetic interaction with ARO10): any one
      of Pdc1p, Pdc5p, Pdc6p or Aro10p sufficed for decarboxylation of the phenylalanine-derived 2-oxo
