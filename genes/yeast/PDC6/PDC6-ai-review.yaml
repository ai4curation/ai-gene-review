  review:
    summary: 'Hohmann 1991: the PDC6 deletion lowered pyruvate decarboxylase activity in ethanol-grown
      cells, and Pdc-deficient mutants grow poorly on ethanol. The curator mapped this to ethanol metabolic
      process. The phenotype is real, but it concerns growth on ethanol and cannot reflect ethanol catabolism
