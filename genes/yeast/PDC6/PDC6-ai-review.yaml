core_functions:
- description: Thiamine diphosphate/Mg2+-dependent decarboxylation of pyruvate to acetaldehyde. Pdc6p
    is a low-sulfur isozyme that is weakly expressed on glucose and contributes Pdc activity in ethanol-grown
    and sulfur-limited cells.
  molecular_function:
    id: GO:0004737
    label: pyruvate decarboxylase activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:yeast/PDC6/PDC6-uniprot.txt
    supporting_text: Reaction=pyruvate + H(+) = acetaldehyde + CO2; Xref=Rhea:RHEA:45484,
  - reference_id: PMID:22904058
    supporting_text: only Pdc1, Pdc5, and Pdc6 catalyzed the decarboxylation of the linear-chain 2-oxo
      acids pyruvate, 2-oxo-butanoate, and 2-oxo-pentanoate in cell extracts
  - reference_id: PMID:2665820
    supporting_text: The activity of the cytosolic enzyme pyruvate decarboxylase in S. cerevisiae
  - reference_id: PMID:1744053
    supporting_text: However, in cells grown in ethanol medium the PDC6 deletion caused a reduction of
      pyruvate decarboxylase activity.
- description: Ehrlich-pathway decarboxylation of branched-chain 2-oxo acids from valine and isoleucine
    transamination (EC 4.1.1.72), giving isobutanal and 2-methylbutanal, the precursors of the fusel alcohols
    isobutanol and active amyl alcohol. PDC6p does this redundantly with the other Pdc isozymes and Aro10.
  molecular_function:
    id: GO:0047433
    label: branched-chain-2-oxoacid decarboxylase activity
  directly_involved_in:
  - id: GO:0006574
    label: L-valine catabolic process
  - id: GO:0006550
    label: L-isoleucine catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:yeast/PDC6/PDC6-uniprot.txt
    supporting_text: Reaction=(S)-3-methyl-2-oxopentanoate + H(+) = 2-methylbutanal + CO2;
  - reference_id: PMID:22904058
    supporting_text: Aro10, Pdc1, Pdc5, and Pdc6 exhibited activity with all branched-chain and sulfur-containing
      2-oxo acids tested
  - reference_id: PMID:10753893
    supporting_text: whereas in valine catabolism any one of the isozymes of pyruvate decarboxylase will
      decarboxylate alpha-ketoisovalerate
suggested_questions:
- question: Is Pdc6p a physiologically relevant Ehrlich-pathway decarboxylase in sulfur-limited cultures,
    where it is the predominant Pdc isozyme?
- question: Can the conflict between the Dickinson et al. genetics and the Romagnoli et al. cell-extract
    assays on Pdc6p phenylpyruvate activity be resolved with purified enzyme?
suggested_experiments:
- description: Quantify fusel alcohol production in an aro10 pdc1 pdc5 strain expressing only PDC6 under
    sulfur limitation.
