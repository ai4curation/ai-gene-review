- term:
    id: GO:0031249
    label: denatured protein binding
  evidence_type: IPI
  original_reference_id: PMID:21211726
  retired: true
  review:
    summary: IPI annotation for denatured protein binding from Rosenbaum et al. 2011.
      This study demonstrated that San1 directly recognizes misfolded substrates through
      its intrinsically disordered N- and C-terminal domains. The WITH column indicates
      interaction with P11978 (Cdc68/Spt16). GO:0031249 is being obsoleted. For San1,
      the binding is for ubiquitination/degradation targeting, not for chaperone-like
      protection. GO:0051787 (misfolded protein binding) is a more appropriate replacement.
      A new term "misfolded protein sensor activity" may be even more appropriate
      for E3 ligases that recognize misfolded substrates for degradation.
    action: MODIFY
    reason: GO:0031249 (denatured protein binding) is being obsoleted. San1 directly
      binds misfolded proteins through its disordered N- and C-terminal domains, but
      this binding serves to target substrates for ubiquitin-dependent proteasomal
      degradation, not for chaperone-like protection or refolding. GO:0051787 (misfolded
      protein binding) is an existing term that better captures the substrate recognition
      aspect. Ideally, a new term such as "misfolded protein sensor activity" would
      be created to distinguish degradation-targeting recognition from chaperone-like
      binding.
    proposed_replacement_terms:
    - id: GO:0051787
      label: misfolded protein binding
    additional_reference_ids:
    - PMID:15797381
    supported_by:
    - reference_id: PMID:21211726
      supporting_text: the yeast nuclear PQC ubiquitin ligase San1 directly recognizes
        its misfolded substrates via intrinsically disordered N- and C-terminal domains.
        These disordered domains are punctuated with small segments of order and high
        sequence conservation that serve as substrate-recognition sites San1 uses
        to target its different substrates
    - reference_id: PMID:15797381
      supporting_text: San1p has exquisite specificity for aberrant proteins and does
        not target the wild-type versions of its mutant substrates
