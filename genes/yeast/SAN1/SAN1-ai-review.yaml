proposed_new_terms:
- proposed_name: misfolded protein sensor activity
  proposed_definition: Recognition of misfolded protein conformation to initiate quality-control
    degradation. Distinct from chaperone activity in that the binding leads to ubiquitination
    and proteasomal degradation rather than refolding or prevention of aggregation.
  justification: E3 ubiquitin ligases like San1 (yeast) and SYVN1/HRD1 (human) directly
    recognize misfolded proteins, but their binding serves to target substrates for
    degradation rather than for chaperone-like protection. The existing terms GO:0031249
    (denatured protein binding, being obsoleted) and GO:0051787 (misfolded protein
    binding) do not distinguish between binding for chaperoning vs. binding for degradation
    targeting. A new term would capture the specific molecular function of these quality
    control sensors.
suggested_questions:
- question: Should a new GO molecular function term be created for "misfolded protein
    sensor activity" to distinguish E3 ligases that recognize misfolded substrates
    for degradation from chaperones that bind misfolded proteins to prevent aggregation,
    or should GO model this as misfolded-protein substrate specificity with has input
    on the E3 ubiquitin ligase activity?
- question: Is GO:0051787 (misfolded protein binding) an adequate replacement for
    GO:0031249 (denatured protein binding) for San1, or does the degradation-targeting
    context require a more specific term?
- question: Should the peroxisomal localization (HDA, PMID:35563734) be retained as
    a possible minor localization site, or should it be removed as an overexpression
    artifact?
suggested_experiments:
- description: Map the substrate-recognition repertoire of San1 in vivo by ubiquitin-AP-MS
    in san1-delta vs. wild-type strains under proteostatic stress (heat shock, azetidine,
    canavanine) to define the physiological misfolded-substrate spectrum and test
    whether all substrates engage the same disordered N-/C-terminal recognition sites
    characterized in PMID:21211726.
- description: Define the structural basis of San1 misfolded-protein recognition by
    AlphaFold-Multimer prediction and HDX-MS of San1 disordered-domain peptides bound
    to model misfolded substrates (e.g., te-Spt16, sir4-9), with mutational validation
    of the conserved sequence segments interspersed among the disordered regions.
- description: Quantitatively dissect the nuclear- vs. cytoplasmic-PQC division of
    labor between San1 and Ubr1 (PMID:20080635) by single-cell live imaging of fluorescent
    reporter misfolded substrates in san1-delta, ubr1-delta, and double-deletion strains
    under matched stress, scoring nuclear import kinetics and degradation half-lives.
- description: Test whether the HDA peroxisomal signal (PMID:35563734) reflects bona
    fide San1 localization or an overexpression artifact by tagging endogenous SAN1
    with split-GFP at the C-terminus and co-imaging with a peroxisomal marker (Pex3-mCherry)
    under non-stress and PQC-stress conditions.
