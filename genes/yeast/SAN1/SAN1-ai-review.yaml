- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings:
  - statement: UniProt keyword-to-GO mapping methodology. Source of the IEA annotations
      on SAN1 derived from Swiss-Prot keywords (Zinc / Metal-binding / Zinc-finger),
      mapping to zinc ion binding (KW-0863) and metal ion binding (KW-0479) — consistent
      with the experimentally established RING-type zinc finger of San1.
- id: PMID:15078868
  title: Sir Antagonist 1 (San1) is a ubiquitin ligase.
  findings:
  - statement: San1 contains a RING domain and possesses ubiquitin-protein isopeptide
      ligase activity in vitro. Mutant sir4 and spt16 proteins are unstable in SAN1
      cells but stabilized in san1-delta cells.
    supporting_text: We demonstrate that San1 possesses ubiquitin-protein isopeptide
      ligase activity in vitro, and the ubiquitin-protein isopeptide ligase activity
      of San1 is required for its function in vivo
  - statement: San1 targets a specific class of unstable nuclear proteins for degradation.
      Wild-type Spt16, Sir3, Sir2, and Ste6-166 are not affected by san1-delta.
    supporting_text: san1Delta did not affect the stability of wild-type Spt16, Sir3,
      Sir2, or the Spt16-associated proteins Pob3 and Nhp6. Loss of SAN1 also did
      not affect the stability of Ste6-166, a highly unstable protein in yeast
- id: PMID:15797381
  title: Degradation-mediated protein quality control in the nucleus.
  findings:
  - statement: San1 defines a nuclear protein quality control degradation system.
      It targets four distinct mutant nuclear proteins for ubiquitination and proteasomal
      destruction, working with E2 enzymes Cdc34 and Ubc1.
    supporting_text: San1p, a ubiquitin-protein ligase that, in conjunction with the
      ubiquitin-conjugating enzymes Cdc34p and Ubc1p, targets four distinct mutant
      nuclear proteins for ubiquitination and destruction by the proteasome
  - statement: San1 is nuclear localized and requires nuclear localization for function.
      It has exquisite specificity for aberrant proteins and does not target wild-type
      versions.
    supporting_text: San1p has exquisite specificity for aberrant proteins and does
      not target the wild-type versions of its mutant substrates. San1p is nuclear
      localized and requires nuclear localization for function
  - statement: Loss of SAN1 results in a chronic stress response, indicating its essential
      role in nuclear protein quality control.
    supporting_text: Loss of SAN1 results in a chronic stress response, underscoring
      its role of protein quality control in the cell
- id: PMID:20080635
  title: Cytoplasmic protein quality control degradation mediated by parallel actions
    of the E3 ubiquitin ligases Ubr1 and San1.
  findings:
  - statement: 'San1 also participates in cytoplasmic PQC alongside Ubr1. Two strategies
      are employed: chaperone-assisted ubiquitination by Ubr1 and chaperone-dependent
      delivery to nuclear San1.'
    supporting_text: Ubr1 and San1 mediate chaperone-dependent ubiquitination of numerous
      misfolded cytoplasmic proteins
- id: PMID:21211726
  title: 'Disorder targets misorder in nuclear quality control degradation: a disordered
    ubiquitin ligase directly recognizes its misfolded substrates.'
  findings:
  - statement: San1 directly recognizes misfolded substrates via intrinsically disordered
      N- and C-terminal domains, which contain conserved substrate-recognition sites
      interspersed among flexible disordered regions.
    supporting_text: the yeast nuclear PQC ubiquitin ligase San1 directly recognizes
      its misfolded substrates via intrinsically disordered N- and C-terminal domains.
      These disordered domains are punctuated with small segments of order and high
      sequence conservation that serve as substrate-recognition sites
  - statement: The intrinsic plasticity of San1 disordered domains allows it to bind
      many differently shaped misfolded substrates, explaining its broad substrate
      specificity.
    supporting_text: these substrate-recognition sites, interspersed among flexible,
      disordered regions, provide San1 an inherent plasticity which allows it to bind
      its many, differently shaped misfolded substrates
- id: PMID:30358795
  title: The cellular economy of the Saccharomyces cerevisiae zinc proteome.
  findings:
  - statement: San1 was identified as a zinc-binding protein in the yeast zinc proteome
      analysis, consistent with its RING-type zinc finger domain.
    supporting_text: The yeast zinc proteome of 582 known or potential zinc-binding
      proteins was identified using a bioinformatics analysis
- id: PMID:35563734
  title: Pls1 Is a Peroxisomal Matrix Protein with a Role in Regulating Lysine Biosynthesis.
  findings:
  - statement: High-throughput screen for peroxisomal proteins using overexpression
      under strong TEF2 promoter. San1 is not discussed by name in the paper; the
      HDA annotation for peroxisomal localization may be an artifact of overexpression.
    supporting_text: we utilized a collection of strains containing a peroxisomal
      marker in which each protein is expressed from the constitutive and strong TEF2
      promoter
- id: PMID:38302116
  title: Role of the San1 ubiquitin ligase in the heat stress-induced degradation
    of nonnative Nup1 in the nuclear pore complex.
  findings:
  - statement: San1 contributes to proteasome-dependent degradation of nonnative Nup1
      incorporated into the nuclear pore complex under heat stress or impaired NPC
      biogenesis.
    supporting_text: These biochemical and genetic data suggest that San1 is involved
      in the degradation of nonnative Nups generated by genetic mutation or when NPC
      biogenesis is impaired.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified but abstract-only in the local cache. Extends San1
      nuclear PQC to nonnative nuclear-pore-complex substrates.
- id: PMID:39617269
  title: Quiescent cells maintain active degradation-mediated protein quality control
    requiring proteasome, autophagy, and nucleus-vacuole junctions.
  findings:
  - statement: Quiescent yeast cells maintain selective degradation of model misfolded
      proteins through San1- and Ubr1-dependent ubiquitination, with Ubr1 dominant
      for the tested substrates.
    supporting_text: Misfolded proteins were degraded in a manner dependent on the
      E3 ubiquitin ligases Ubr1 and San1, with Ubr1 playing a dominant role.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified, full text cached. Shows that San1 remains part
      of degradation-mediated PQC in quiescent yeast, although Ubr1 dominates the
      tested tGnd1/stGnd1 model substrates.
- id: PMID:39855624
  title: TAP-MS analysis of FACT interactions and regulation by a ubiquitin ligase,
    San1.
  findings:
  - statement: San1-dependent ubiquitylation of the FACT subunit Spt16 influences
      the FACT interactome, connecting San1-mediated substrate degradation to FACT-linked
      chromatin, transcription, and DNA repair networks.
    supporting_text: Further, an intrinsically disordered ubiquitin ligase, San1,
      that ubiquitylates the Spt16 component of FACT for proteasomal degradation to
      regulate chromatin, transcription and genome integrity is found to influence
      the interactions of FACT with a set of proteins including epigenetic, transcription
      and DNA repair factors.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified but abstract-only in the local cache. Updates the
      older Spt16 substrate literature by examining FACT interactions in the presence
      or absence of San1-dependent regulation.
- id: PMID:41370327
  title: Aberrant cohesin function in Saccharomyces cerevisiae activates Mcd1 degradation
    to promote cell lethality.
  findings:
  - statement: Yeast cells with aberrant cohesin function can use San1 and other E3
      ligases to target the cohesin subunit Mcd1 for degradation.
    supporting_text: Our findings further reveal that cells that exhibit aberrant
      cohesin function employ E3 ligases (such as San1) to target Mcd1 for degradation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified, full text cached. Identifies Mcd1/cohesin as
      a new San1-linked degradation context, but the mechanism is a substrate-specific
      extension of the core E3 PQC activity.
- id: PMID:41511351
  title: Proteasomal Degradation of Mutant Huntingtin Exon1 Regulates Autophagy.
  findings:
  - statement: San1-dependent proteasomal degradation of soluble mutant huntingtin
      exon1 is required for efficient autophagic clearance of Htt103QP inclusion bodies
      in a budding-yeast model.
    supporting_text: Collectively, these findings demonstrate that San1, but not Ubr1,
      is required for both proteasomal degradation of Htt103QP and IBophagy.
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified, full text cached. Relevant as a synthetic/model
      substrate that depends on San1, but not a native San1 substrate or a new core
      process for SAN1.
- id: PMID:42300961
  title: Blocking protein quality control degradation leads to structural stabilization
    of DHFR indel variants.
  findings:
  - statement: Deleting either UBR1 or SAN1 stabilizes a subset of yeast-expressed
      DHFR indel folding reporters, supporting the use of San1/Ubr1 knockouts to reveal
      PQC-sensitive hypomorphic variants.
    supporting_text: We show that deletion of Ubr1 or San1 leads to a greater fraction
      of folded DHFR indel variants, primarily positioned toward the N- and C-terminal
      regions in DHFR.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified but abstract-only in the local cache. Relevant as
      a model PQC-reporter study using SAN1 deletion, but not a native substrate or
      new SAN1 mechanism.
