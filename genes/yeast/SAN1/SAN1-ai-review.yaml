- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: IEA annotation inferred from UniProt keyword mapping for zinc binding.
      San1 contains a RING-type zinc finger domain (residues 240-280) that coordinates
      zinc ions, which is essential for its E3 ubiquitin ligase activity.
    action: ACCEPT
    reason: San1 has a well-characterized RING-type zinc finger domain (PROSITE PS50089,
      Pfam PF13639). RING domains coordinate two zinc ions via conserved cysteine
      and histidine residues. This is a structural feature directly tied to San1 core
      E3 ligase activity. The IEA is a broader annotation than what is represented
      by the RING domain, but it is correct.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: IEA annotation for metal ion binding, a parent of zinc ion binding. San1
      binds zinc ions through its RING domain. This is a broader annotation than the
      zinc ion binding annotation but is not incorrect.
    action: ACCEPT
    reason: This is a parent term of GO:0008270 (zinc ion binding). While redundant
      with the more specific zinc ion binding annotation, IEA annotations at a broader
      level are acceptable and not incorrect. The RING domain of San1 coordinates
      zinc ions.
- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: HDA
  original_reference_id: PMID:35563734
  review:
    summary: HDA annotation from a high-throughput screen (PMID:35563734) that identified
      new peroxisomal proteins in yeast using overexpression of proteins under a strong
      TEF2 promoter. SAN1 is not directly discussed in the paper. This study focused
      on identifying a new peroxisomal protein Pls1 (Ynl097c-b) and its role in lysine
      biosynthesis. San1 may have been detected in the screen but appears to be a
      false positive or artifact of overexpression.
    action: REMOVE
    reason: San1 is a well-characterized nuclear protein that requires nuclear localization
      for function (PMID:15797381). No other study has reported peroxisomal localization
      for San1. The HDA annotation from PMID:35563734 comes from a high-throughput
      overexpression screen where proteins were expressed under a strong constitutive
      promoter, which can lead to mislocalization artifacts. San1 is not mentioned
      by name in the paper. Given the strong evidence for nuclear localization and
      the absence of any mechanistic connection to peroxisomal function, this annotation
      is likely artifactual.
    supported_by:
    - reference_id: PMID:15797381
      supporting_text: San1p is nuclear localized and requires nuclear localization
        for function
  qualifier: located_in
