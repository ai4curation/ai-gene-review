suggested_questions:
- question: Is Gcv3 a direct lipoyl donor for Lip3-catalysed transfer to Lat1/Kgd2 (as for GcvH/LipL in Bacillus),
    or does it act as a structural or regulatory component of a lipoylation complex?
- question: Should GO:0140104 molecular carrier activity get a glycine-cleavage-system H-protein child
    for the lipoyl/aminomethyl swinging-arm carrier role?
suggested_experiments:
- description: Reconstitute in vitro lipoyl transfer from purified octanoyl/lipoyl-Gcv3 to apo-Lat1 or apo-Kgd2
    with purified Lip3 to test whether Gcv3 is a direct lipoyl donor.
