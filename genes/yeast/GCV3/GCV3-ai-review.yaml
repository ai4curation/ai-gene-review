  label: Saccharomyces cerevisiae S288C
description: Glycine cleavage system H-protein of Saccharomyces cerevisiae, a small mitochondrial lipoyl-carrier
  protein. Its lipoylated Lys-102 swinging arm accepts the aminomethyl group from glycine decarboxylation by the
  P-protein (Gcv2), presents it to the T-protein (Gcv1) for transfer to tetrahydrofolate, and is reoxidised by dihydrolipoyl
  dehydrogenase (Lpd1). GCV3 is required for growth on glycine as sole nitrogen source and is induced by glycine.
  Independently of glycine cleavage, lipoylated Gcv3 is required for lipoylation of the E2 subunits of pyruvate
  dehydrogenase (Lat1) and 2-oxoglutarate dehydrogenase (Kgd2), acting as the first lipoylated acceptor from which
  lipoate is relayed in the yeast Lip2/Lip5/Lip3 pathway.
