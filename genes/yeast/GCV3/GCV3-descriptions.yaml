  text: Enables lipoic acid binding activity. Involved in glycine catabolic process;
    one-carbon metabolic process; and protein lipoylation. Located in mitochondrion.
    Part of glycine cleavage complex. Used to study glycine encephalopathy. Human
    ortholog(s) of this gene implicated in multiple mitochondrial dysfunctions syndrome
    7. Orthologous to human GCSH (glycine cleavage system protein H).
