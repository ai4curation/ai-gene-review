descriptions:
- source: UniProt
  text: The glycine cleavage system (glycine decarboxylase complex) catalyzes the
    degradation of glycine. The H protein shuttles the methylamine group of glycine
    from the P protein to the T protein (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39726
  source_id: P39726
- source: Alliance_Imported
  text: H subunit of the mitochondrial glycine decarboxylase complex; glycine decarboxylase
    is required for the catabolism of glycine to 5,10-methylene-THF; also required
    for all protein lipoylation; expression is regulated by levels of 5,10-methylene-THF
  source_type: curated
  url: https://www.yeastgenome.org/locus/GCV3
  source_id: SGD:S000000042
- source: Alliance_Automated
  text: Enables lipoic acid binding activity. Involved in glycine catabolic process;
    one-carbon metabolic process; and protein lipoylation. Located in mitochondrion.
    Part of glycine cleavage complex. Used to study glycine encephalopathy. Human
    ortholog(s) of this gene implicated in multiple mitochondrial dysfunctions syndrome
    7. Orthologous to human GCSH (glycine cleavage system protein H).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GCV3
  source_id: SGD:S000000042
