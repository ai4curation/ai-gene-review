  review:
    summary: 'ARBA machine-learning rule assigning galactose-induced transcriptional activation. For Gal1
      this is correct: Gal1 has a GAL3-like inducer activity (galactose/ATP-dependent binding of the Gal80
      repressor). It is a genuine but secondary role relative to its galactokinase activity and to Gal3,
      the principal inducer.'
