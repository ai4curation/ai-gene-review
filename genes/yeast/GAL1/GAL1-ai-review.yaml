gene_symbol: GAL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'GAL1 encodes galactokinase (EC 2.7.1.6) of Saccharomyces cerevisiae, a monomeric ~58 kDa
  GHMP-family kinase that phosphorylates alpha-D-galactose at C1 using ATP to give galactose 1-phosphate,
  the first step of the Leloir pathway of galactose catabolism. The enzyme is highly specific for galactose
  and follows an ordered ternary-complex mechanism. GAL1 is strongly induced by galactose through the
  Gal4/Gal80/Gal3 switch. Gal1 is also bifunctional: like its catalytically inactive paralog Gal3, it
  can bind the Gal80 repressor in a galactose- and ATP-dependent manner and thereby contribute to induction
  of the GAL genes, an activity separable from its kinase function. Gal1 is a soluble cytosolic enzyme.'
