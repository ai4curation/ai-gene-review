descriptions:
- source: UniProt
  text: Galactokinase is a key enzyme in the galactose metabolism where it catalyzes
    the conversion of alpha-D-galactose to galactose 1- phosphate (PubMed:12106903,
    PubMed:13495476, PubMed:14144). Can also induce the transcription of the yeast
    GAL genes in response to the organism being challenged with galactose as the sole
    source of carbon (PubMed:1317007, PubMed:2656659). Its striking amino acid sequence
    similarity to GAL3 might explain its GAL3-like induction activity (PubMed:1317007,
    PubMed:2656659).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P04385
  source_id: P04385
- source: Alliance_Imported
  text: Galactokinase; phosphorylates alpha-D-galactose to alpha-D-galactose-1-phosphate
    in the first step of galactose catabolism; expression regulated by Gal4p; human
    homolog GALK2 complements yeast null mutant; GAL1 has a paralog, GAL3, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GAL1
  source_id: SGD:S000000224
- source: Alliance_Automated
  text: Enables galactokinase activity. Involved in beta-D-galactose catabolic process
    via UDP-galactose, Leloir pathway; carbohydrate phosphorylation; and positive
    regulation of transcription by galactose. Located in cytoplasm. Part of transcription
    regulator complex. Orthologous to human GALK2 (galactokinase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GAL1
  source_id: SGD:S000000224
