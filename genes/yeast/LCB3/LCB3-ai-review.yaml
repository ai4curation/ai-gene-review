id: P47013
gene_symbol: LCB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lcb3 (Ysr2/Lbp1) is the major sphingoid long-chain-base 1-phosphate phosphatase of Saccharomyces cerevisiae,
  a multi-pass type 2 lipid phosphate phosphatase (PAP2 family) of the endoplasmic reticulum membrane. It specifically
  dephosphorylates dihydrosphingosine-1-phosphate and phytosphingosine-1-phosphate to the free long-chain bases,
  but not phosphatidic acid or ceramide-1-phosphate. Together with the long-chain base kinase Lcb4, it forms a phosphorylation-dephosphorylation
  cycle required for efficient incorporation of exogenous and recycled long-chain bases into ceramide at the ER,
  and with the lyase Dpl1 it determines cellular levels of LCB-1-phosphates, which act as signals in heat-stress
  responses and calcium influx. The paralog Ysr3 provides minor, redundant activity; homologues include human SGPP1/SGPP2.
