core_functions:
- description: ER-membrane lipid phosphate phosphatase that dephosphorylates the sphingoid long-chain-base 1-phosphates
    dihydrosphingosine-1-P and phytosphingosine-1-P back to free long-chain bases, enabling their (re)incorporation
    into ceramide and controlling LCB-1-P signalling levels.
