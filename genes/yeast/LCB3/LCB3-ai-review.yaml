suggested_questions:
- question: What are the relative contributions of Lcb3 and its paralog Ysr3 to PHS-1-P versus DHS-1-P turnover
    in vivo, and does Lcb3 topology place its active site in the ER lumen as for other PAP2 enzymes?
suggested_experiments:
- description: Quantify DHS-1-P and PHS-1-P turnover in lcb3, ysr3 and double mutants with C17 tracer LCBs by LC-MS,
    and map Lcb3 active-site orientation by glycosylation-site reporters.
