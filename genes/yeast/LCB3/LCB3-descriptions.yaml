descriptions:
- source: UniProt
  text: Dihydrosphingosine 1-phosphate phosphatase required for efficient ceramide
    synthesis from exogenous sphingoid bases (PubMed:10477278, PubMed:10563329, PubMed:10856228,
    PubMed:11278643, PubMed:11967828, PubMed:12493772, PubMed:12684378, PubMed:12786943,
    PubMed:25345524, PubMed:9195906, PubMed:9353337, PubMed:9419344). Involved in
    endocytosis and calcium-mediated signaling (PubMed:10856228, PubMed:11278643).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47013
  source_id: P47013
- source: Alliance_Imported
  text: Long-chain base-1-phosphate phosphatase; specific for dihydrosphingosine-1-phosphate,
    regulates ceramide and long-chain base phosphates levels, involved in incorporation
    of exogenous long chain bases in sphingolipids; LCB3 has a paralog, YSR3, that
    arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/LCB3
  source_id: SGD:S000003670
- source: Alliance_Automated
  text: Enables dihydrosphingosine-1-phosphate phosphatase activity and sphingosine-1-phosphate
    phosphatase activity. Involved in calcium-mediated signaling. Located in endoplasmic
    reticulum membrane. Orthologous to several human genes including SGPP1 (sphingosine-1-phosphate
    phosphatase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LCB3
  source_id: SGD:S000003670
