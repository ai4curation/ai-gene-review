taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 5-Methylthioribose-1-phosphate isomerase (MtnA, EC 5.3.1.23) of Saccharomyces cerevisiae, a homodimeric
  member of the eIF2B alpha/beta/delta-related family that isomerises 5-methylthioribose 1-phosphate (the product
  of Meu1) to 5-methylthioribulose 1-phosphate, the first committed step (step 1 of 6) of methionine regeneration
  from MTA. Mri1 is required for growth on 5'-methylthioadenosine as sole sulfur source; its crystal structure shows
  an N-terminal domain plus a C-terminal ribose-5-phosphate-isomerase-like domain forming the active-site cleft.
  Mri1 is a low-abundance protein found in cytoplasm and nucleus; it is unrelated in function to the eIF2B regulatory
  subunits despite the shared fold.
