- source: Alliance_Automated
  text: Enables mitochondrial signal sequence receptor activity. Contributes to transmembrane
    protein transporter activity. Involved in protein import into mitochondrial matrix
    and protein insertion into mitochondrial outer membrane. Located in mitochondrial
    outer membrane. Part of mitochondrial outer membrane translocase complex. Orthologous
    to human TOMM22 (translocase of outer mitochondrial membrane 22).
