gene_symbol: TOM22
organism: yeast
uniprot_id: P49334
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Central component of the TOM (translocase of outer membrane) receptor complex
    responsible for the recognition and translocation of cytosolically synthesized
    mitochondrial preproteins. Together with TOM20 and TOM70 functions as the transit
    peptide receptor at the surface of the mitochondrion outer membrane and facilitates
    the movement of preproteins into the TOM40 translocation pore. Docks TOM20 and
    TOM70 for interaction with the general TOM40 import pore (GIP) complex. May regulate
    the TOM machinery organization, stability and channel gating.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P49334
  source_id: P49334
- source: Alliance_Imported
  text: Component of the TOM (Translocase of Outer Membrane) complex; responsible
    for initial import of mitochondrially directed proteins; mediates interaction
    between TOM and TIM complexes and acts as receptor for precursor proteins; implicated
    in mitochondrial accumulation of amyloid beta peptides via direct interaction
    with amyloid beta peptide residues 25-42 followed by transfer to Tom40p and transport
    through the TOM channel
  source_type: curated
  url: https://www.yeastgenome.org/locus/TOM22
  source_id: SGD:S000005075
- source: Alliance_Automated
  text: Enables mitochondrial signal sequence receptor activity. Contributes to transmembrane
    protein transporter activity. Involved in protein import into mitochondrial matrix
    and protein insertion into mitochondrial outer membrane. Located in mitochondrial
    outer membrane. Part of mitochondrial outer membrane translocase complex. Orthologous
    to human TOMM22 (translocase of outer mitochondrial membrane 22).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TOM22
  source_id: SGD:S000005075
