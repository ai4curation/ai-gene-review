descriptions:
- source: UniProt
  text: Central component of the TOM (translocase of outer membrane) receptor complex
    responsible for the recognition and translocation of cytosolically synthesized
    mitochondrial preproteins. Together with TOM20 and TOM70 functions as the transit
    peptide receptor at the surface of the mitochondrion outer membrane and facilitates
    the movement of preproteins into the TOM40 translocation pore. Docks TOM20 and
    TOM70 for interaction with the general TOM40 import pore (GIP) complex. May regulate
    the TOM machinery organization, stability and channel gating.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P49334
  source_id: P49334
