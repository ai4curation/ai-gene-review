    overall_notes: 'Correct and specific: central TOM receptor with Tom20 and Tom70,
      docks them to the Tom40 pore, regulates complex stability and gating.'
- source: Alliance_Imported
  text: Component of the TOM (Translocase of Outer Membrane) complex; responsible
    for initial import of mitochondrially directed proteins; mediates interaction
    between TOM and TIM complexes and acts as receptor for precursor proteins; implicated
    in mitochondrial accumulation of amyloid beta peptides via direct interaction
    with amyloid beta peptide residues 25-42 followed by transfer to Tom40p and transport
    through the TOM channel
  source_type: curated
