descriptions:
- source: UniProt
  text: An aminoacyl-tRNA editing enzyme that deacylates mischarged D-aminoacyl-tRNAs
    (Probable). Hydrolyzes D-tyrosyl-tRNA(Tyr) into D- tyrosine and free tRNA(Tyr)
    (PubMed:10766779). May also deacylate mischarged D-leucyl-tRNA(Leu) (PubMed:10918062).
    Also deacylates mischarged glycyl-tRNA(Ala), protecting cells against glycine
    mischarging by AlaRS (By similarity). Acts via tRNA-based rather than protein-based
    catalysis; rejects L-amino acids rather than detecting D- amino acids in the active
    site (By similarity). By recycling D- aminoacyl-tRNA to D-amino acids and free
    tRNA molecules, this enzyme counteracts the toxicity associated with the formation
    of D-aminoacyl- tRNA entities in vivo and helps enforce protein L-homochirality
    (By similarity).
