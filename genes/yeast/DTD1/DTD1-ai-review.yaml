core_functions:
- description: Cytoplasmic trans-editing hydrolysis of mischarged D-aminoacyl-tRNAs. Activity on
    D-Tyr-tRNA(Tyr) is experimentally established in yeast. Activity on D-Leu-tRNA(Leu) is genetically
    inferred. The enzyme releases the D-amino acid and free tRNA, keeping D-amino acids out of protein
    synthesis.
  molecular_function:
    id: GO:0051499
    label: D-aminoacyl-tRNA deacylase activity
  directly_involved_in:
  - id: GO:0106074
    label: aminoacyl-tRNA metabolism involved in translational fidelity
  locations:
