    supporting_text: Upon disruption of the chromosomal gene, deacylase activity was decreased by more
      than 90%, and the sensitivity to D-tyrosine of the growth of S. cerevisiae was exacerbated.
  - reference_id: PMID:10918062
    supporting_text: Toxic effects of d-tyrosine and d-leucine were reinforced upon deprivation of the
      deacylase.
  - reference_id: file:yeast/DTD1/DTD1-uniprot.txt
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000305|PubMed:10766779}.'
suggested_questions:
- question: Does purified yeast DTD1 deacylate D-Leu-tRNA(Leu) and other D-aminoacyl-tRNAs in vitro with
    broad specificity like E. coli Dtd, or is its substrate range narrower in vivo?
- question: Does yeast DTD1 deacylate Gly-tRNA(Ala), and does DTD1 loss sensitise an AlaRS
    editing-defective yeast strain to glycine?
suggested_experiments:
- description: Purify recombinant yeast DTD1 and measure deacylation kinetics on D-Tyr-tRNA(Tyr),
    D-Leu-tRNA(Leu), L-aminoacyl-tRNAs (negative control) and Gly-tRNA(Ala), including a Gly140/Pro141
    mutant.
- description: Combine dtd1 deletion with an ALA1 editing-site mutation and test growth on glycine and
    alanine to see whether DTD1 protects against Gly-tRNA(Ala) in vivo.
