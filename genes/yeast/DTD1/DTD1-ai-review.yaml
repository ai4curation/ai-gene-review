id: Q07648
gene_symbol: DTD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  DTD1 (YDL219W) encodes the 150-residue cytoplasmic D-aminoacyl-tRNA deacylase of
  budding yeast, a member of the DTD family (PANTHER PTHR10472:SF5) shared with
  bacterial Dtd and animal DTD1. It hydrolyses the ester bond of D-aminoacyl-tRNAs that
  aminoacyl-tRNA synthetases make by mistake, releasing the free D-amino acid and
  reusable tRNA. This trans-editing step keeps D-amino acids out of protein synthesis.
  In yeast, cellular D-Tyr-tRNA(Tyr) deacylase activity tracks DTD1 gene dosage, and
  DTD1 deletion makes cells hypersensitive to D-tyrosine and D-leucine.
  By homology to structurally characterised DTDs, the protein is thought to act as a
  homodimer. A conserved cross-subunit Gly-cisPro motif (Gly140-Pro141) rejects
  L-amino acids, and the deacylation is tRNA-assisted rather than catalysed by protein
  side chains. Family members from bacteria and several eukaryotes also clear glycine
  mischarged onto tRNA(Ala); yeast DTD1 has not been tested directly for this activity.
