- id: PMID:10766779
  title: D-tyrosyl-tRNA(Tyr) metabolism in Saccharomyces cerevisiae.
  findings:
  - statement: DTD1 dosage determines cellular D-Tyr-tRNA(Tyr) deacylase activity, which rises about
      100-fold on overexpression and falls by more than 90% on deletion. The deletion strain is
      hypersensitive to D-tyrosine.
    supporting_text: Upon disruption of the chromosomal gene, deacylase activity was decreased by more
      than 90%, and the sensitivity to D-tyrosine of the growth of S. cerevisiae was exacerbated.
  - statement: Yeast TyrRS produces D-Tyr-tRNA(Tyr), so the substrate forms in vivo.
    supporting_text: the capacity of purified S. cerevisiae tyrosyl-tRNA synthetase to produce
      D-Tyr-tRNA(Tyr) could be shown
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterisation of yeast DTD1. The abstract names the YDL219w (DTD1) gene,
      and the paper matches the GOA IMP row. The cache is abstract-only.
- id: PMID:10918062
  title: Metabolism of D-aminoacyl-tRNAs in Escherichia coli and Saccharomyces cerevisiae cells.
  findings:
  - statement: Of the 19 D-amino acids screened, only D-Tyr and D-Leu were more toxic to the yeast
      deacylase-deleted strain. This implies that D-Leu-tRNA(Leu) is a second substrate, but that is a
      genetic inference.
    supporting_text: Toxic effects of d-tyrosine and d-leucine were reinforced upon deprivation of the
      deacylase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Covers both E. coli and S. cerevisiae. The yeast part is a growth screen of isogenic
      strains with and without the deacylase. Cached abstract-only.
- id: PMID:14562095
  title: Global analysis of protein localization in budding yeast.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genome-wide GFP localisation screen; source of the HDA cytoplasm annotation.
- id: PMID:24302572
  title: Mechanism of chiral proofreading during translation of the genetic code.
  findings:
  - statement: In P. falciparum DTD, an invariant cross-subunit Gly-cisPro dipeptide captures the
      chiral centre of the substrate, and no protein residue catalyses the reaction directly.
    supporting_text: no protein residues are directly involved in catalysis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The structural mechanism comes from P. falciparum DTD (same DTD family). It applies to
      yeast DTD1 by homology, given the conserved Gly140-Pro141.
- id: PMID:28362257
  title: Role of D-aminoacyl-tRNA deacylase beyond chiral proofreading as a cellular defense against
    glycine mischarging by AlaRS.
  findings:
  - statement: Gly-tRNA(Ala) deacylation is conserved across the bacterial and eukaryotic DTDs tested
      (E. coli, P. falciparum, L. major, D. melanogaster and D. rerio). Yeast DTD1 was not tested.
    supporting_text: DTD's activity on non-cognate Gly-tRNAAla is conserved across all bacteria and
      eukaryotes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The full text does not mention S. cerevisiae. It is family-level support only.
