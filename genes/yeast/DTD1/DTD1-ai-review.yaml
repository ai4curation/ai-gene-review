- term:
    id: GO:0097358
    label: D-leucyl-tRNA(Leu) deacylase activity
  evidence_type: IMP
  original_reference_id: PMID:10918062
  qualifier: enables
  review:
    summary: The deacylase-deleted strain grows worse on D-leucine as well as on D-tyrosine. The authors
      infer that D-Leu-tRNA(Leu) is formed in yeast and recycled by the same deacylase.
    action: ACCEPT
    reason: The evidence is genetic rather than biochemical. The cached abstract reports no deacylation
      assay with D-Leu-tRNA(Leu), and UniProt words this as "May also deacylate", citing the paper as
      curator inference (ECO:0000305). The inference is still sound. The orthologous E. coli enzyme has
      demonstrated broad D-aminoacyl-tRNA specificity, and the yeast D-amino-acid sensitivity profile
      (only D-Tyr and D-Leu among 19) is specific. The curator had the full text, so the annotation is
      accepted. For transfer, treat this activity as genetically inferred, not biochemically
      established, in yeast.
    supported_by:
    - reference_id: PMID:10918062
      supporting_text: This observation suggests that, in yeast, at least two d-amino acids succeed in
        being transferred onto tRNAs and that, like in E. coli, the resulting two d-aminoacyl-tRNAs are
        substrates of a same d-aminoacyl-tRNA deacylase.
- term:
    id: GO:0106026
    label: Gly-tRNA(Ala) deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:53744
  review:
    summary: Rhea-mapped electronic annotation of Gly-tRNA(Ala) deacylation. The UniProt catalytic
      activity it maps from is itself "by similarity" to P. falciparum DTD (Q8IIS0).
    action: KEEP_AS_NON_CORE
    reason: Gly-tRNA(Ala) clearance is a conserved DTD-family activity. It was shown in vitro for
      E. coli, P. falciparum, Leishmania, Drosophila and zebrafish DTDs, and it depends on the same
      Gly-cisPro active site, which yeast DTD1 retains. It has not been tested for yeast DTD1. The
      PAINT curators at PTN000049487 propagated the D-Tyr deacylase activity but not this term, so the
      yeast annotation rests on similarity alone. It is plausible and kept, but it is not
      experimentally established in this species and should not be used as a yeast-experimental
      reference for transfer.
    supported_by:
    - reference_id: PMID:28362257
      supporting_text: DTD's activity on non-cognate Gly-tRNAAla is conserved across all bacteria and
        eukaryotes
    - reference_id: file:yeast/DTD1/DTD1-uniprot.txt
      record_section: ["FT:MOTIF"]
      supporting_text: Gly-cisPro motif, important for rejection of L-amino
