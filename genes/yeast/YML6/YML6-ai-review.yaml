core_functions:
- description: Structural constituent of the 54S mitochondrial large ribosomal subunit (uL4m). With
    uL22, it forms the conserved constriction of the nascent-polypeptide exit tunnel, and so contributes
    structure to mitochondrial translation. Membership of the subunit is shown experimentally in S. cerevisiae
    by purification, sequencing and cryo-EM. The structural-constituent and translation roles follow
    from that membership.
