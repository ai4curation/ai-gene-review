- term:
    id: GO:0006417
    label: regulation of translation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000078778
  - UniProtKB:P60723
  review:
    summary: Regulation of translation was propagated from the uL4 family root. The only experimental
      donor is E. coli L4 (P60723), which autogenously represses its own S10 ribosomal-protein operon.
    action: MARK_AS_OVER_ANNOTATED
    reason: Bacterial L4 regulates translation through feedback on the leader mRNA of the S10 operon.
      That mechanism depends on the bacterial operon structure. YML6 is a single nuclear gene, and none
      of the mitochondrial uL4m donors at node PTN000078780 (YML6, human MRPL4, trypanosome uL4m) has
      a regulatory annotation. Notably, the PAINT curators placed the mtLSU term on the mitochondrial
      node, but nothing regulatory. No study of YML6 reports a regulatory activity separate from its structural
      role, and being a subunit of the translating ribosome is not regulation of translation. Placing
      the IBD at the family root over-extends a lineage-specific bacterial function to the mitochondrial
      clade.
    supported_by:
    - reference_id: file:yeast/YML6/YML6-uniprot.txt
      supporting_text: 'FUNCTION: Component of the mitochondrial ribosome (mitoribosome), a'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000078778
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family-root node whose regulation-of-translation IBD rests only on E. coli L4 (P60723)
