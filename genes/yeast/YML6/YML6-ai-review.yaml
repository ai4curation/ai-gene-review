taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: YML6 (YML025C) encodes YmL6, the yeast mitochondrial ribosomal large-subunit protein
  uL4m. It is a nuclear-encoded member of the universal uL4 family. A 26-residue N-terminal transit
  peptide targets it to mitochondria, where it is removed. The mature protein is an integral component
  of the 54S large subunit of the 74S mitoribosome, which makes the few mitochondrial genome-encoded
  proteins, mostly hydrophobic respiratory-chain subunits, at the inner membrane. YmL6 was identified
  by purifying the protein from the mitochondrial large subunit and sequencing it. In cryo-EM structures
  of the yeast mitoribosome, uL4m sits deep in the large subunit and, with uL22, forms the conserved
  constriction of the nascent-polypeptide exit tunnel. Its role is structural; no enzymatic or separate
  regulatory activity has been described.
