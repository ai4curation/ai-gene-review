suggested_questions:
- question: Does YML6 initiate early assembly of the yeast mitochondrial large subunit, as bacterial
    L4 does by binding the 5' domain of 23S rRNA, or has the mitochondrial extension changed when it joins
    the subunit?
- question: Does any mitochondrial uL4m keep an extra-ribosomal regulatory role like the S10-operon autoregulation
    of E. coli L4? If not, should the regulation-of-translation IBD move from the family root PTN000078778
    to a bacterial node?
suggested_experiments:
- description: Profile mtLSU subassemblies in a yml6 deletion strain (sucrose gradients with quantitative
    mass spectrometry) to place uL4m in the 54S assembly hierarchy, and test direct binding of recombinant
    mature YmL6 to 21S rRNA domain I fragments.
  experiment_type: mitoribosome assembly profiling and RNA binding
