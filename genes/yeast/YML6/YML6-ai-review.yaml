    label: mitochondrial inner membrane
  evidence_type: NAS
  original_reference_id: PMID:25609543
  qualifier: located_in
  review:
    summary: The Complex Portal annotation reflects that yeast mitoribosomes are tethered to the inner
      mitochondrial membrane.
    action: KEEP_AS_NON_CORE
    reason: Cryo-electron tomography shows that most mitoribosomes sit right next to the inner membrane.
      Two membrane contacts were seen, made by the 21S rRNA expansion segment 96-ES1 and by Mba1, not by
      uL4m. uL4m lies deep in the large subunit, at the exit-tunnel constriction. Its association with
      the inner membrane is therefore indirect, through the whole mitoribosome, and peripheral. The claim
      is true in that complex-level sense but is not a defining location of the protein.
    supported_by:
    - reference_id: PMID:25609543
      supporting_text: Most mitoribosomes reside in immediate proximity to the inner mitochondrial membrane
    - reference_id: PMID:25609543
      supporting_text: two distinct membrane contact sites, formed by the 21S rRNA expansion segment 96-ES1
        and the inner membrane protein Mba1
