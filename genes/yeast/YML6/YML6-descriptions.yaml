descriptions:
- source: UniProt
  text: Component of the mitochondrial ribosome (mitoribosome), a dedicated translation
    machinery responsible for the synthesis of mitochondrial genome-encoded proteins,
    including at least some of the essential transmembrane subunits of the mitochondrial
    respiratory chain. The mitoribosomes are attached to the mitochondrial inner membrane
    and translation products are cotranslationally integrated into the membrane.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P51998
