descriptions:
- source: UniProt
  text: Component of the mitochondrial ribosome (mitoribosome), a dedicated translation
    machinery responsible for the synthesis of mitochondrial genome-encoded proteins,
    including at least some of the essential transmembrane subunits of the mitochondrial
    respiratory chain. The mitoribosomes are attached to the mitochondrial inner membrane
    and translation products are cotranslationally integrated into the membrane.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P51998
  source_id: P51998
- source: Alliance_Imported
  text: Mitochondrial ribosomal protein of the large subunit; has similarity to E.
    coli L4 ribosomal protein and human mitoribosomal MRP-L4 protein; essential for
    viability, unlike most other mitoribosomal proteins
  source_type: curated
  url: https://www.yeastgenome.org/locus/YML6
  source_id: SGD:S000004487
- source: Alliance_Automated
  text: A structural constituent of ribosome. Predicted to be involved in regulation
    of translation. Located in mitochondrion. Part of mitochondrial large ribosomal
    subunit. Orthologous to human MRPL4 (mitochondrial ribosomal protein L4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/YML6
  source_id: SGD:S000004487
