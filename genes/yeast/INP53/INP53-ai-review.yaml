gene_symbol: INP53
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: INP53 (SJL3, SOP2) encodes a yeast synaptojanin-like polyphosphoinositide phosphatase with an N-terminal
  Sac1-like domain that dephosphorylates PI3P, PI4P and PI(3,5)P2 to PI and a central inositol 5-phosphatase domain
  that hydrolyses PI(4,5)P2, plus a C-terminal proline-rich region that binds clathrin heavy chain. Inp53 is membrane-associated,
  appears in cytoplasmic puncta and functions in clathrin-dependent sorting from the trans-Golgi network to early
  endosomes; after hyperosmotic stress it translocates transiently to cortical actin patches. It binds the adaptor
  Bsp1 via its Sac domain and is partially redundant with Inp51 and Inp52 in controlling PI(4,5)P2 and PI3P levels.
