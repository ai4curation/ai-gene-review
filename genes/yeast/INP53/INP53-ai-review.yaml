suggested_questions:
- question: Which phosphoinositide pool on TGN/endosomal membranes does Inp53 primarily control in vivo (PI4P via
    the Sac domain or PI(4,5)P2 via the 5-phosphatase domain)?
suggested_experiments:
- hypothesis: The Inp53 Sac domain, not its 5-phosphatase domain, is required for TGN-to-endosome sorting
  description: Complement inp53 (in a sensitised inp52 or chc1-ts background) with Sac-dead or 5-phosphatase-dead
    alleles and assay CPY/Kex2 sorting and TGN PI4P biosensor levels.
  experiment_type: genetics / cell biology
