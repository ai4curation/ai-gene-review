gene_symbol: INP53
organism: yeast
uniprot_id: Q12271
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Dephosphorylates a number of phosphatidylinositols (PIs) like phosphatidylinositol
    4,5-bisphosphate (PtdIns(4,5)P2), but also phosphatidylinositol 3-phosphate (PtdIns(3)P),
    phosphatidylinositol 4- phosphate (PtdIns(4)P), and phosphatidylinositol 3,5-bisphosphate
    (PtdIns(3,5)P2). Controls the cellular levels and subcellular distribution of
    phosphatidylinositol 3-phosphate and phosphatidylinositol 4,5-bisphosphate. Plays
    an essential role in a TGN (trans Golgi network)-to-early endosome pathway. Involved
    in clathrin- mediated protein sorting at the TGN.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12271
  source_id: Q12271
- source: Alliance_Imported
  text: Polyphosphatidylinositol phosphatase; dephosphorylates multiple phosphatidylinositol
    phosphates; involved in trans Golgi network-to-early endosome pathway; hyperosmotic
    stress causes translocation to actin patches; contains Sac1 and 5-ptase domains;
    INP53 has a paralog, INP52, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/INP53
  source_id: SGD:S000005635
- source: Alliance_Automated
  text: Enables phosphatidylinositol phosphate phosphatase activity. Involved in phosphatidylinositol
    dephosphorylation. Located in actin cortical patch and membrane. Human ortholog(s)
    of this gene implicated in Parkinson's disease; Parkinson's disease 20; and developmental
    and epileptic encephalopathy 53. Orthologous to human SYNJ1 (synaptojanin 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/INP53
  source_id: SGD:S000005635
