- source: Alliance_Automated
  text: Enables phosphatidylinositol phosphate phosphatase activity. Involved in phosphatidylinositol
    dephosphorylation. Located in actin cortical patch and membrane. Human ortholog(s)
    of this gene implicated in Parkinson's disease; Parkinson's disease 20; and developmental
    and epileptic encephalopathy 53. Orthologous to human SYNJ1 (synaptojanin 1).
