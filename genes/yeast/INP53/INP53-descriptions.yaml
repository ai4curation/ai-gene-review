    overall_notes: Correct substrate list (PI(4,5)P2, PI3P, PI4P, PI(3,5)P2) and the
      TGN-to-early-endosome and clathrin sorting roles. Does not name the Sac1 and
      5-phosphatase domains or the actin-patch relocation.
- source: Alliance_Imported
  text: Polyphosphatidylinositol phosphatase; dephosphorylates multiple phosphatidylinositol
    phosphates; involved in trans Golgi network-to-early endosome pathway; hyperosmotic
    stress causes translocation to actin patches; contains Sac1 and 5-ptase domains;
    INP53 has a paralog, INP52, that arose from the whole genome duplication
