suggested_questions:
- question: What are the in vivo concentrations of NR versus uridine in yeast, and hence which substrate
    dominates Urh1 flux under standard and starvation conditions?
- question: Which residues of Urh1 determine its pyrimidine/pyridine specificity relative to purine-specific
    IUNH family members?
suggested_experiments:
- description: Measure isotope-labelled NR and uridine flux in urh1 versus wild-type cells under carbon
    starvation to apportion Urh1 activity between NAD+ salvage and pyrimidine/ribose salvage.
