id: Q04179
gene_symbol: URH1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Uridine nucleosidase / pyrimidine-pyridine riboside N-ribohydrolase of Saccharomyces cerevisiae,
  a member of the inosine-uridine preferring nucleoside hydrolase (IUNH) family. Urh1 hydrolyses the N-glycosidic
  bond of uridine and cytidine (and, less efficiently, deoxycytidine and 5-fluoro analogues) to free bases
  and ribose, allowing uracil and cytosine to be salvaged and ribose to enter the pentose phosphate pathway,
  for example during starvation-induced RNA turnover. Despite its name, purified Urh1 prefers nicotinamide
  riboside (NR) by about 100-fold over uridine and also hydrolyses nicotinic acid riboside, making it
  the main enzyme of the Nrk1-independent route that converts NR and NaR to nicotinamide/nicotinic acid
  for salvage into NAD+. It shows no activity on purine nucleosides. Urh1 is a soluble cytoplasmic protein.
