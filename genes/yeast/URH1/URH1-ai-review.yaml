- term:
    id: GO:0070635
    label: nicotinamide riboside hydrolase activity
  evidence_type: IDA
  original_reference_id: PMID:19001417
  qualifier: enables
  review:
    summary: 'IDA from Belenky 2009: purified Urh1 hydrolyses NR with ~100-fold higher specificity constant
      than uridine. This is the activity by which Urh1 contributes to NAD+ salvage and is arguably its
      principal physiological substrate.'
    action: ACCEPT
    supported_by:
    - reference_id: PMID:19001417
      supporting_text: We demonstrate that so-called uridine hydrolase is 100-fold more active as a nicotinamide
        riboside hydrolase than as a uridine hydrolase
- term:
    id: GO:0070636
    label: nicotinic acid riboside hydrolase activity
  evidence_type: IDA
  original_reference_id: PMID:19001417
  qualifier: enables
  review:
    summary: 'IDA from Belenky 2009: Urh1 hydrolyses nicotinic acid riboside to nicotinic acid (kcat/Km
      comparable to uridine).'
    action: ACCEPT
    supported_by:
    - reference_id: PMID:19001417
      supporting_text: Urh1 hydrolyzes NaR to NA with a K m of 150
