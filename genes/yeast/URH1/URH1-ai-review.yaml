core_functions:
- description: Hydrolysis of nicotinamide riboside (and nicotinic acid riboside) to the free pyridine
    base and ribose, the first step of the Nrk1-independent NR/NaR salvage route to NAD+.
  molecular_function:
    id: GO:0070635
    label: nicotinamide riboside hydrolase activity
  directly_involved_in:
  - id: GO:0034355
    label: NAD+ biosynthetic process via the salvage pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:19001417
    supporting_text: We demonstrate that so-called uridine hydrolase is 100-fold more active as a nicotinamide
      riboside hydrolase than as a uridine hydrolase
  - reference_id: PMID:19001417
    supporting_text: By genetic criteria, the enzyme with the greatest apparent role in Nrk1-independent
      NR utilization is Urh1
  - reference_id: PMID:17482543
    supporting_text: The mechanism of action of nicotinamide riboside is totally dependent on increased
      net NAD(+) synthesis through two pathways, the Nrk1 pathway and the Urh1/Pnp1/Meu1 pathway, which
      is Nrk1 independent.
- description: Hydrolysis of uridine and cytidine to uracil/cytosine and ribose for pyrimidine base salvage
    and ribose recycling.
