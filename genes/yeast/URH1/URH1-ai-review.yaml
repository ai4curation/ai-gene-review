- term:
    id: GO:0006152
    label: purine nucleoside catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G05620
  - AGI_LocusCode:AT2G36310
  - PANTHER:PTN000266727
  review:
    summary: PAINT IBA for purine nucleoside catabolic process, inherited at PTN000266727 from Arabidopsis
      IUNH-family nucleosidases (AT1G05620/AT2G36310) that hydrolyse purine nucleosides. Yeast Urh1 has
      been tested directly and shows no activity on inosine, adenosine or guanosine; purine nucleoside
      breakdown in yeast is performed by Pnp1 (phosphorolysis). The IUNH clade contains both purine- and
      pyrimidine-specific members, and Urh1 has diverged to the pyrimidine/pyridine-riboside branch, so
      the inherited purine assertion does not hold for it.
    action: REMOVE
    reason: Contradicted by direct substrate-specificity data for Urh1.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000266727
        source_label: PTN000266727
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node seeded by Arabidopsis purine-hydrolysing nucleosidases; yeast Urh1 lacks purine
          nucleoside activity.
    supported_by:
    - reference_id: PMID:11872485
      supporting_text: Protein extracts of strains overexpressing YDR400w show increased hydrolase activity
        only with uridine and cytidine, but no activity with inosine, adenosine, guanosine, and thymidine
        as substrates
    - reference_id: PMID:19001417
      supporting_text: Urh1 hydrolyzed uridine to uracil at high substrate concentrations.
