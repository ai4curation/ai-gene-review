suggested_questions:
- question: What is the physiological direct substrate of Cln3-Cdc28 at Start? Purified Cln3-Cdc28 does
    not dissociate Whi5 from SBF in vitro (Huang et al. 2009), endogenous Cln3-dependent Whi5 phosphorylation
    has been hard to detect, and promoter-local phosphorylation of the RNA polymerase II CTD has been
    proposed; is Whi5 an obligate direct target, one of several, or mainly a target of the Cln1/2 feedback?
- question: How do Cln3 accumulation (growth-scaled synthesis, ER retention/Ydj1 release, SBF-site titration)
    and Whi5 dilution combine to set the critical size at Start, and does their relative weight depend
    on carbon source and ploidy?
- question: Through which Cdc28 substrate does loss of Cln3 - but not Cln1 or Cln2 - fragment the vacuole
    and impair homotypic fusion, and is this a nuclear or cytoplasmic output of the Cln3-Cdc28 complex?
suggested_experiments:
- hypothesis: Cln3-Cdc28 acts locally at SBF-bound promoters rather than as a diffusible kinase.
  description: Combine analog-sensitive Cdc28 with a rapidly degradable (AID) Cln3 and promoter-anchored
    versus free Cln3 variants, then map phosphorylation of Whi5, Stb1, Swi4/Swi6 and the Rpb1 CTD by ChIP-coupled
    phosphoproteomics within minutes of Cln3 release in synchronized small daughter cells.
- hypothesis: The vacuole phenotype of cln3 cells reflects reduced early-G1 Cdc28 activity toward a specific
    vacuole-fusion or inheritance factor.
  description: Perform quantitative phosphoproteomics of vacuole-enriched fractions from wild-type, cln3,
    and CLN3-1 cells, test candidate Cdc28-site mutants in the cell-free homotypic fusion assay, and ask
    whether restoring only nuclear Cln3 (NLS-Cln3) or only cytoplasmic Cln3 (NES-Cln3) rescues vacuole
    morphology.
