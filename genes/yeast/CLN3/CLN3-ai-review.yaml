- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:17560371
  qualifier: located_in
  review:
    summary: 'Proposed localization annotation (not in GOA) from Verges et al. 2007: in early G1 Cln3 is
      retained bound to the endoplasmic reticulum, together with a fraction of Cdc28; retention requires
      Cln3-Cdc28 binding and is relieved in late G1 by the Hsp40 chaperone Ydj1, which counteracts a
      chaperone-regulatory Ji domain in Cln3 and is limiting for nuclear accumulation of Cln3 and timely
      cell cycle entry. Truman et al. 2012 extended the mechanism: Ydj1 and Cln3 bind Ssa1 (Hsp70) reciprocally,
      and CDK phosphorylation of Ssa1 T36 displaces Ydj1 so that Ssa1 binds Cln3 and promotes its degradation.'
    action: NEW
    reason: The ER pool of Cln3 is well documented (fractionation and microscopy in Verges et al. 2007,
      whose abstract states the result explicitly; Whi3-dependent ER retention of newly synthesized Cln3
      in later work from the same group) and is a bona fide, regulated location of the protein rather than
      an artefact, so it merits a located_in annotation. It is a sequestered pre-activation pool, not the
      site of Cln3's kinase-activating function at promoters, so it is recorded as a location only and
      the nucleus remains the compartment of activity. The cached record is abstract-only; the full text
      would be needed to cite the specific fractionation and imaging experiments.
    supported_by:
    - reference_id: PMID:17560371
