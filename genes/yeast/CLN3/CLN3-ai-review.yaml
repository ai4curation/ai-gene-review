  review:
    summary: 'Phylogenetic (PAINT) annotation of the G1/S transition to the G1 cyclin clade (node PTN000019791,
      which also carries cyclin D, Cln1/Cln2 and fission-yeast Puc1). Cln3 is the founding budding-yeast
      G1 cyclin: Cln3-Cdc28 initiates the Start transcriptional program whose output (CLN1/CLN2/CLB5/6)
      commits the cell to S phase, exactly the process that GO:0000082 describes.'
    action: ACCEPT
    reason: The IBD node placement is sound - the G1/S-promoting activity of the G1 cyclin family is ancestral
      - and Cln3 has abundant direct experimental support for the same term (IGI/IMP rows below, and the
      classical Start genetics). The target appears in its own WITH/FROM list (SGD:S000000038 is CLN3),
      which is expected when the target's own experimental annotation contributed to the IBD.
