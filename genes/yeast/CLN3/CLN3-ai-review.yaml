    summary: Phylogenetic annotation of cyclin-dependent protein serine/threonine kinase regulator activity
      to Cln3, the defining molecular function of the cyclin family. Cln3 binds Cdc28 and confers kinase
      activity on it.
    action: MODIFY
    reason: 'The IBD node placement is sound: CDK-regulatory activity is the ancestral function of the
      whole cyclin family and Cln3 is inside the clade, with its own direct evidence (immunoprecipitated
      active Cln3-Cdc28 kinase). But every member of node PTN000019791 is an activating cyclin - the family
