gene_symbol: CLN3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Cln3 (also known as Whi1 or Daf1) is the most upstream of the three G1 cyclins of the budding
  yeast Saccharomyces cerevisiae and the functional counterpart of metazoan cyclin D. It is a rare, very
  unstable cyclin-box protein that binds the essential cyclin-dependent kinase Cdc28 (Cdk1) and confers
  on it a weak but decisive kinase activity. In late G1 the Cln3-Cdc28 complex is recruited to the SBF
  (Swi4-Swi6) transcription factor at G1/S promoters, where it phosphorylates the SBF-bound repressor
  Whi5 and displaces Whi5 and the Rpd3/Hos3 histone deacetylases; the derepressed SBF and MBF then transcribe
  some 200 Start genes, including the downstream G1 cyclins CLN1 and CLN2 and the S-phase cyclins CLB5
  and CLB6, whose positive feedback commits the cell irreversibly to budding, DNA replication and division
  (Start, the G1/S transition). Cln3 is the element that couples this commitment to cell growth: its synthesis
  scales with ribosome content and growth rate, it is held at the endoplasmic reticulum in early G1 by
  the Ssa1/Ydj1 chaperone system and released to the nucleus only in late G1, it carries a C-terminal
  bipartite nuclear localization signal, and its PEST-rich C terminus targets it for rapid Cdc28/Pho85-phosphorylation-dependent,
  SCF-mediated proteolysis. Mating pheromone, nitrogen starvation and poor carbon sources all delay Start
  by lowering Cln3 activity or abundance. Consequently cln3 null cells are viable but large and delayed
  in G1, stabilized CLN3 truncations (WHI1-1/DAF1-1) drive division at abnormally small size, and cells
  lacking all three CLN genes arrest in G1. Beyond Start, loss of Cln3 also fragments the vacuole and
  perturbs its inheritance, a secondary consequence of reduced G1 CDK activity.'
