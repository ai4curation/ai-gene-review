  review:
    summary: Phylogenetic annotation that Cln3 is active in the cytoplasm, propagated from the G1-cyclin
      node whose members include cytoplasmically active cyclins (Cln1/Cln2, cyclin D). Cln3 is indeed
      present in the cytoplasm in early G1 - it is retained at the ER, bound to Cdc28, until Ydj1 releases
      it in late G1 - but that pool is a sequestered, pre-activation pool; Cln3 requires nuclear localization
      for its Start function and artificially cytoplasmic Cln3 only performs Cln2-like tasks.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Target-specific evidence argues against ''active in cytoplasm'' for Cln3: nuclear localization
      is required for its normal roles (Miller & Cross 2001; Edgington & Futcher 2001), and the ER-associated
      cytoplasmic pool is a retention state rather than a site of action (Verges et al. 2007). The clade-level
      inference reflects Cln1/Cln2-type cytoplasmic functions that Cln3 does not normally perform. Not
      wrong as a location, but over-stated as an activity site.'
    supported_by:
    - reference_id: PMID:11509671
      supporting_text: Thus, wild-type Cln3p requires nuclear localization to carry out its normal roles
      reference_section_type: DISCUSSION
    - reference_id: PMID:11509671
      supporting_text: Mislocalized Cln3p, lacking the NLS, is much less active in genetic assays specific
        for Cln3p, but more active in assays normally specific for Cln2p
      reference_section_type: ABSTRACT
    - reference_id: PMID:17560371
      supporting_text: We show here that Cln3 is retained bound to the ER in early G1 cells. ER retention
        requires binding of Cln3 to the cyclin-dependent kinase Cdc28, a fraction of which also associates
        to the ER
      reference_section_type: ABSTRACT
    - reference_id: file:yeast/CLN3/CLN3-deep-research-falcon.md
      supporting_text: The ER is better understood as an early-G1 site of synthesis, sequestration, or
        maturation rather than the site of its final transcriptional output.
