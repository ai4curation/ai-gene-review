core_functions:
- description: 'Regulatory cyclin subunit that binds and activates the cyclin-dependent kinase Cdc28 (Cdk1),
    forming the low-abundance Cln3-Cdc28 holoenzyme that initiates Start: in the nucleus it phosphorylates
    the SBF-bound repressor Whi5 (and associated Rpd3/Hos3 HDAC-dependent repression), derepressing SBF/MBF-driven
    G1/S transcription and thereby committing the cell to the G1/S transition.'
