gene_symbol: CLN3
organism: yeast
uniprot_id: P13365
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Essential for the control of the cell cycle at the G1/S (start) transition.
    CLN3 may be an upstream activator of the G1 cyclins which directly catalyze start.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13365
  source_id: P13365
- source: Alliance_Imported
  text: G1 cyclin involved in cell cycle progression; activates Cdc28p kinase to promote
    G1 to S phase transition; plays a role in regulating transcription of other G1
    cyclins, CLN1 and CLN2; regulated by phosphorylation and proteolysis; acetyl-CoA
    induces CLN3 transcription in response to nutrient repletion to promote cell-cycle
    entry; cell cycle arrest phenotype of the cln1 cln2 cln3 triple null mutant is
    complemented by any of human cyclins CCNA2, CCNB1, CCNC, CCND1, or CCNE1
  source_type: curated
  url: https://www.yeastgenome.org/locus/CLN3
  source_id: SGD:S000000038
- source: Alliance_Automated
  text: Enables cyclin-dependent protein serine/threonine kinase regulator activity.
    Involved in several processes, including G1/S transition of mitotic cell cycle;
    traversing start control point of mitotic cell cycle; and vacuole fusion, non-autophagic.
    Located in nucleus. Part of cyclin-dependent protein kinase holoenzyme complex.
    Used to study amyotrophic lateral sclerosis.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CLN3
  source_id: SGD:S000000038
