    overall_notes: Correct and current in placing Cln3 upstream of Cln1/2 at Start.
      No Whi5, growth sensing or ER retention.
- source: Alliance_Imported
  text: G1 cyclin involved in cell cycle progression; activates Cdc28p kinase to promote
    G1 to S phase transition; plays a role in regulating transcription of other G1
    cyclins, CLN1 and CLN2; regulated by phosphorylation and proteolysis; acetyl-CoA
    induces CLN3 transcription in response to nutrient repletion to promote cell-cycle
    entry; cell cycle arrest phenotype of the cln1 cln2 cln3 triple null mutant is
    complemented by any of human cyclins CCNA2, CCNB1, CCNC, CCND1, or CCNE1
  source_type: curated
