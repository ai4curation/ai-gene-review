core_functions:
- description: Pet100 is a mitochondrial inner-membrane complex IV assembly factor
    with protein-carrier activity toward a Cox7/Cox8/Cox9-containing cytochrome
    c oxidase subassembly. Pet100 functions after COX subunit synthesis and mitochondrial
    localization to promote productive interaction of this module with other late
    complex IV assembly intermediates.
