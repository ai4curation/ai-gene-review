  title: Falcon deep research report on PET100
  findings:
  - statement: Falcon synthesis supports Pet100 as a mitochondrial complex IV assembly factor acting on late subcomplex incorporation.
    supporting_text: "PET100 is best described as a mitochondrial inner-membrane complex IV assembly factor/chaperone."
