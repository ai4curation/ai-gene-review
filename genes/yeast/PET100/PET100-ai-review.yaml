- id: PMID:11498004
  title: Structure and function of Pet100p, a molecular chaperone required for the assembly of cytochrome c oxidase in Saccharomyces cerevisiae.
  findings:
  - statement: Pet100 is required for cytochrome c oxidase assembly and its C-terminal region is essential for function.
    supporting_text: >-
      molecular chaperone required for the assembly of cytochrome c
    full_text_unavailable: true
- id: PMID:15507444
  title: 'A role for Pet100p in the assembly of yeast cytochrome c oxidase: interaction with a subassembly that accumulates in a pet100 mutant.'
  findings:
  - statement: Pet100 associates with a Cox7/Cox8/Cox9-containing assembly intermediate rather than the mature complex IV holoenzyme.
    supporting_text: >-
      We have also localized Pet100p to the inner mitochondrial membrane in wild type cells,
      where it is present in a subassembly (Complex A) with cytochrome c oxidase subunits VII,
      VIIa, and VIII. Pet100p does not interact with the same subunits after they have been
      assembled into the holoenzyme.
    full_text_unavailable: true
- id: PMID:16823961
  title: 'Toward the complete yeast mitochondrial proteome: multidimensional separation techniques for mitochondrial proteomics.'
  findings:
  - statement: High-throughput proteomics support mitochondrial localization of Pet100.
    supporting_text: "Toward the complete yeast mitochondrial proteome"
- id: PMID:38612624
  title: 'More than Just Bread and Wine: Using Yeast to Understand Inherited Cytochrome Oxidase Deficiencies in Humans.'
  findings:
  - statement: >-
      A 2024 COX-deficiency review summarizes Pet100 as a yeast-identified
      complex IV assembly factor associated with subassemblies containing Cox7,
      Cox8, Cox9, Cox5, and Cox6.
    supporting_text: >-
      PET100 was first identified in yeast [74] as being required for COX
      assembly. PET100 was found to be associated with two different
      subassembly complexes, specifically one that contains the smallest
      nuclear-encoded subunits, COX7, COX8, and COX9, and another that contains
      subunits 5 and 6
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified 2024 review; useful background confirming that recent
      yeast-to-human COX-deficiency syntheses still place PET100 in complex IV
      assembly.
