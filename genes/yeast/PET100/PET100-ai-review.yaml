core_functions:
- description: >-
    Pet100 is a mitochondrial inner-membrane complex IV assembly factor that
    promotes productive incorporation of the Cox7/Cox8/Cox9-containing module
    into cytochrome c oxidase. This specific assembly role underlies the
    petite/respiratory-deficient phenotype of pet100 mutants; no molecular
    function term is asserted because the available evidence does not establish
    a protein-macromolecule adaptor activity distinct from complex IV assembly.
