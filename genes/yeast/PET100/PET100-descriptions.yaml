gene_symbol: PET100
organism: yeast
uniprot_id: P38958
taxon_id: NCBITaxon:559292
status: IN_PROGRESS
descriptions:
- source: UniProt
  text: Required for the biogenesis of cytochrome c oxidase. Probably for its assembly
    into an active holoenzyme.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38958
  source_id: P38958
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
      notes: Correct but hedged unnecessarily; the assembly role is well-established.
    - rubric: utility
      score: 2
      notes: Too vague to distinguish PET100 from other CcO assembly factors.
    - rubric: compactness
      score: 5
      notes: Two short sentences; extreme brevity is a weakness here.
    - rubric: completeness
      score: 1
      notes: Misses chaperone identity, subunit specificity, membrane localization,
        subcomplex interaction.
    - rubric: specificity
      score: 1
      notes: '"Cytochrome c oxidase" is the only specific term; nothing distinguishes
        PET100 from other assembly factors.'
    overall_notes: Very sparse and hedged. "Probably" suggests low confidence that
      is no longer warranted given current evidence. Does not identify PET100 as a
      chaperone/assembly factor, or specify which subunits it interacts with, or its
      membrane localization.
- source: Alliance_Imported
  text: Chaperone that facilitates the assembly of cytochrome c oxidase; integral
    to the mitochondrial inner membrane; interacts with a subcomplex of subunits VII,
    VIIa, and VIII (Cox7p, Cox9p, and Cox8p) but not with the holoenzyme
  source_type: curated
  url: https://www.yeastgenome.org/locus/PET100
  source_id: SGD:S000002486
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
      notes: All claims accurate and specific.
    - rubric: utility
      score: 5
      notes: Immediately conveys what PET100 does, where, and with what partners.
    - rubric: compactness
      score: 5
      notes: Three clauses packed with information; no wasted words.
    - rubric: completeness
      score: 5
      notes: Covers function, localization, partners, and temporal specificity.
    - rubric: specificity
      score: 5
      notes: Names Cox7p, Cox9p, Cox8p subunits and specifies "not with the holoenzyme."
    overall_notes: Excellent description. Identifies PET100 as a chaperone, specifies
      inner membrane localization, and names the exact subcomplex it interacts with.
      The negative detail (does not interact with holoenzyme) is valuable for understanding
      the temporal role in assembly. Most informative single description.
- source: Alliance_Automated
  text: Enables protein carrier activity. Involved in chaperone-mediated protein complex
    assembly and mitochondrial respiratory chain complex IV assembly. Located in mitochondrial
    inner membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/PET100
  source_id: SGD:S000002486
- source: RefSeq
  text: Enables unfolded protein binding activity. Involved in mitochondrial cytochrome
    c oxidase assembly. Located in mitochondrial inner membrane. [provided by Alliance
    of Genome Resources, Jul 2025]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/851651
  source_id: GeneID:851651
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
      notes: Same "unfolded protein binding" issue.
    - rubric: utility
      score: 2
      notes: Same as Alliance automated.
    - rubric: compactness
      score: 4
      notes: Same as Alliance automated.
    - rubric: completeness
      score: 2
      notes: Same as Alliance automated.
    - rubric: specificity
      score: 3
      notes: '"Cytochrome c oxidase assembly" is marginally more specific naming.'
    overall_notes: Nearly identical to Alliance automated. Uses "cytochrome c oxidase
      assembly" instead of "complex IV assembly" -- slightly more readable. Same limitations.
