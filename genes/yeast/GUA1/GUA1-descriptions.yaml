gene_symbol: GUA1
organism: yeast
uniprot_id: P38625
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the conversion of xanthine monophosphate (XMP) to GMP in the presence
    of glutamine and ATP through an adenyl-XMP intermediate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38625
  source_id: P38625
- source: Alliance_Imported
  text: GMP synthase; highly conserved enzyme that catalyzes the second step in the
    biosynthesis of GMP from inosine 5'-phosphate (IMP); transcription is not subject
    to regulation by guanine but is negatively regulated by nutrient starvation; reduction-of-function
    mutation gua1-G388D causes changes in cellular guanine nucleotide pools, defects
    in general protein synthesis, and impaired translation of GCN4 mRNA
  source_type: curated
  url: https://www.yeastgenome.org/locus/GUA1
  source_id: SGD:S000004830
- source: Alliance_Automated
  text: Enables GMP synthase (glutamine-hydrolyzing) activity. Involved in GMP biosynthetic
    process. Predicted to be active in cytosol. Human ortholog(s) of this gene implicated
    in acute myelomonocytic leukemia and disease of cellular proliferation. Orthologous
    to human GMPS (guanosine monophosphate synthase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GUA1
  source_id: SGD:S000004830
