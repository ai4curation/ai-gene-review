  - UniProtKB:P04079
  - UniProtKB:P49915
  review:
    summary: IBA from PANTHER PTN000229987 to GMP synthase activity, defined with NH4+ as nitrogen donor
      (RHEA:18301). Gua1 has both the glutamine amidotransferase and ATP-pyrophosphatase domains and uses
      glutamine physiologically (EC 6.3.5.2); GO:0003922 is a sibling, not a child, of GO:0003921. Replace
      with the glutamine-hydrolysing term.
    action: MODIFY
    reason: Gua1 is a two-domain glutamine amidotransferase GMPS; the glutamine-dependent sibling term
      is the physiological activity.
    proposed_replacement_terms:
    - id: GO:0003922
      label: GMP synthase (glutamine-hydrolyzing) activity
    supported_by:
