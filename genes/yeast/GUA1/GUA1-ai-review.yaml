  review:
    summary: RCA from YeastPathways PWY3O-285 (superpathway of purine biosynthesis and salvage pathways).
      IMP made by salvage of hypoxanthine (Hpt1) or adenine (Apt1 then Amd1) must pass through Imd and
      Gua1 to reach guanine nucleotides, so Gua1 does act downstream of some salvage routes; but guanine
      salvage by Hpt1 produces GMP directly, and the gua1 guanine auxotrophy shows salvage bypasses it.
      Keep as non-core.
    action: KEEP_AS_NON_CORE
    reason: Gua1 is required to route salvaged IMP (from hypoxanthine/adenine) to GMP, but salvage of
      guanine itself bypasses Gua1.
