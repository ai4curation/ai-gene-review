id: P38625
gene_symbol: GUA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GUA1 (YMR217W) encodes GMP synthase [glutamine-hydrolysing] (EC 6.3.5.2), a cytosolic two-domain
  glutamine amidotransferase that converts XMP to GMP using glutamine and ATP via an adenyl-XMP intermediate.
  This is the final step of de novo guanine nucleotide synthesis from IMP (IMP -> XMP by IMP dehydrogenase,
  then XMP -> GMP). gua1 null mutants are guanine auxotrophs. A hypomorphic gua1-G388D allele lowers the
  guanine nucleotide pool, impairing translation initiation and tRNA processing and derepressing GCN4
  translation.
