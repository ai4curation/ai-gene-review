        of glutamine and ATP through an adenyl-XMP intermediate
    - reference_id: PMID:8112582
      supporting_text: a strong similarity with Escherichia coli, Bacillus subtilis and Dictyostelium
        discoideum GMP synthetases (GMPS) and other glutamine amidotransferases
