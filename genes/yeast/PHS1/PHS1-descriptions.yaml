gene_symbol: PHS1
organism: yeast
uniprot_id: P40857
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the third of the four reactions of the long-chain fatty acids elongation
    cycle. This endoplasmic reticulum-bound enzymatic process, allows the addition
    of two carbons to the chain of long- and very long-chain fatty acids/VLCFAs per
    cycle. This enzyme catalyzes the dehydration of the 3-hydroxyacyl-CoA intermediate
    into trans-2,3-enoyl-CoA, within each cycle of fatty acid elongation. Thereby,
    it participates in the production of VLCFAs of different chain lengths that are
    involved in multiple biological processes as precursors of membrane lipids and
    lipid mediators.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40857
  source_id: P40857
- source: Alliance_Imported
  text: Essential 3-hydroxyacyl-CoA dehydratase of the ER membrane; involved in elongation
    of very long-chain fatty acids; evolutionarily conserved, similar to mammalian
    PTPLA and PTPLB; involved in sphingolipid biosynthesis and protein trafficking
  source_type: curated
  url: https://www.yeastgenome.org/locus/PHS1
  source_id: SGD:S000003633
- source: Alliance_Automated
  text: Enables very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase activity. Involved
    in fatty acid elongation; sphingolipid biosynthetic process; and vacuolar transport.
    Located in endoplasmic reticulum membrane; fungal-type vacuole; and vacuolar membrane.
    Used to study cancer. Human ortholog(s) of this gene implicated in congenital
    myopathy. Orthologous to human HACD1 (3-hydroxyacyl-CoA dehydratase 1) and HACD2
    (3-hydroxyacyl-CoA dehydratase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PHS1
  source_id: SGD:S000003633
