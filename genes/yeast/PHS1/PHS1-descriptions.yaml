gene_symbol: PHS1
organism: yeast
uniprot_id: P40857
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Catalyzes the third of the four reactions of the long-chain fatty acids elongation
    cycle. This endoplasmic reticulum-bound enzymatic process, allows the addition
    of two carbons to the chain of long- and very long-chain fatty acids/VLCFAs per
    cycle. This enzyme catalyzes the dehydration of the 3-hydroxyacyl-CoA intermediate
    into trans-2,3-enoyl-CoA, within each cycle of fatty acid elongation. Thereby,
    it participates in the production of VLCFAs of different chain lengths that are
    involved in multiple biological processes as precursors of membrane lipids and
    lipid mediators.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40857
  source_id: P40857
