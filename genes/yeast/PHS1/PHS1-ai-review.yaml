gene_symbol: PHS1
aliases:
- YJL097W
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PHS1 (YJL097W) encodes the very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase of S. cerevisiae, the
  founding member of the HACD/PTPLA family (orthologous to mammalian HACD1-4). This essential six-pass endoplasmic
  reticulum membrane protein, with both termini facing the cytosol, catalyses the third of the four reactions of
  the ER fatty acid elongation cycle, dehydrating the (3R)-3-hydroxyacyl-CoA produced by Ifa38 to trans-2,3-enoyl-CoA,
  which Tsc13 then reduces. Conserved residues Tyr-149 and Glu-156 are indispensable and Arg83 and Gly152 contribute
  directly to catalysis. Phs1 functions with the Elo2/Elo3 condensing enzymes to produce C20-C26 very long-chain
  fatty acids; depletion impairs elongation and the conversion of ceramide to inositol phosphorylceramide. High-throughput
  GFP surveys also report a vacuolar membrane signal.
