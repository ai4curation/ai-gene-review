suggested_questions:
- question: Is the vacuolar-membrane GFP signal reported for Phs1 a genuine second pool (e.g. at nucleus-vacuole
    junctions) or a consequence of C-terminal tagging/turnover?
- question: Does Phs1 have any activity toward short-chain or (3S)-3-hydroxyacyl-CoA substrates that would justify
    its YeastCyc placement in glutaryl-CoA degradation?
suggested_experiments:
- hypothesis: Phs1 is stereospecific for (3R)-3-hydroxyacyl-CoA and inactive on short-chain substrates.
  description: Assay purified Phs1 in proteoliposomes with (3R)- and (3S)-3-hydroxybutanoyl-CoA, -hexadecanoyl-CoA
    and -eicosanoyl-CoA and quantify enoyl-CoA by LC-MS.
