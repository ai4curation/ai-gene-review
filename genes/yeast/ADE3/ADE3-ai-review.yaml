    - &id008
      reference_id: PMID:8464869
      supporting_text: These results suggest that the catalytic activity of the C1-THF synthase is involved in purine
        biosynthesis.
    - reference_id: PMID:8464869
      supporting_text: the presence of either the synthetase or dehydrogenase/cyclohydrolase domains of C1-THF synthase
        is enough to complement the adenine requirement in ade3 strains
