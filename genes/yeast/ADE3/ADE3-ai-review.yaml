suggested_questions:
- question: What fraction of cytosolic 10-formyl-THF for purine synthesis comes from Ade3p synthetase (formate)
    versus its dehydrogenase/cyclohydrolase (serine-derived methylene-THF) under different growth conditions?
- question: Is the nuclear pool of Ade3p seen in GFP surveys functionally relevant, for example for local purine
    or thymidylate synthesis?
suggested_experiments:
- hypothesis: Directional flux through Ade3p synthetase vs dehydrogenase depends on mitochondrial formate export
    by Mis1p
  description: 13C-serine and 13C-formate tracing in wild-type, ade3 domain-specific point mutants (synthetase-dead
    vs DH/CH-dead) and mis1 strains, measuring label in purines, thymidylate and methionine.
  experiment_type: stable isotope tracing
