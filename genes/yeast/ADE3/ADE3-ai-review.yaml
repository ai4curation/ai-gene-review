  review:
    summary: ade3 mutants require adenine, and either catalytic domain of C1-THF synthase suffices to rescue, indicating
      its catalytic output (10-formyl-THF, the formyl donor for the two purine transformylase steps) supports de
      novo purine synthesis. Ade3p supplies the C1 cofactor rather than building the purine ring, and yeast makes
      purines as nucleotides (IMP), so this is a downstream, non-core role.
    action: KEEP_AS_NON_CORE
