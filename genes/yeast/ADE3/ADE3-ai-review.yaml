id: P07245
gene_symbol: ADE3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADE3 encodes the cytoplasmic C1-tetrahydrofolate synthase, a homodimeric trifunctional enzyme. Its
  N-terminal domain has NADP-dependent 5,10-methylene-THF dehydrogenase (EC 1.5.1.5) and 5,10-methenyl-THF cyclohydrolase
  (EC 3.5.4.9) activities. Its larger C-terminal domain has ATP-dependent 10-formyl-THF synthetase (formate-tetrahydrofolate
  ligase, EC 6.3.4.3) activity. Together these activities interconvert one-carbon units carried on tetrahydrofolate
  between the formate, formyl, methenyl and methylene oxidation levels in the cytosol. They connect formate and
  serine-derived methylene-THF with 10-formyl-THF, which supplies formyl groups for de novo purine synthesis, and
  with methylene-THF for thymidylate and methionine synthesis. Mis1p is the mitochondrial isozyme. ade3 mutants
  require adenine and, depending on background, histidine. Expressing either catalytic domain alone is enough to
  relieve the adenine requirement, so the C1-THF synthase role in purine synthesis is catalytic.
