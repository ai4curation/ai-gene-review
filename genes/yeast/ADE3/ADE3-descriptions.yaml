- source: Alliance_Imported
  text: Cytoplasmic trifunctional enzyme; catalyzes sequential reactions 10-formyl-THF
    synthetase (EC 6.3.4.3), 5,10-methenyl-THF cyclohydrolase (EC 3.5.4.9), and 5,10-methylene-THF
    dehydrogenase (EC 1.5.1.5), to supply forms of activated one-carbon units required
    for biosynthesis of purines, histidine, methionine, pantothenic acid, the formyl
    group of mitochondrial fMet-tRNAfMet, and the methyl group of thymidylate; null
    mutation causes auxotrophy for adenine and histidine in rich medium
