descriptions:
- source: UniProt
  text: Cytoplasmic isozyme of C-1-tetrahydrofolate synthase. The trifunctional enzyme
    catalyzes the interconversion of the one-carbon derivatives of tetrahydrofolate
    (THF) between different oxidation states by the enzymatic activities 10-formyltetrahydrofolate
    synthetase, 5,lO-methenyltetrahydrofolate cyclohydrolase, and 5,lO- methylenetetrahydrofolate
    dehydrogenase. Involved in the generation of one-carbon intermediates in the biosynthesis
    of the purine bases.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07245
  source_id: P07245
