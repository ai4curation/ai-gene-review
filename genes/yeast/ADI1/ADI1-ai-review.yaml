  review:
    summary: SGD IMP (Hirano 2005) for the Ni(2+)-requiring ARD term. The abstract-only cached paper reports that
      adi1 deletion abolishes growth on MTA-cycle substrates and is rescued by YMR009w or human MTCBP-1; such rescue
      reports the methionine-regenerating (KMTB-forming, Fe-type) reaction, and the same paper is cited for the
      Fe-ARD EXP annotation. Without the full text we cannot tell whether a Ni-dependent activity was assayed.
    action: UNDECIDED
    reason: Full text unavailable; growth complementation as described supports the on-pathway Fe-ARD reaction rather
      than the Ni-ARD reaction, but a curator-read experiment cannot be overruled.
    supported_by:
