      reference_id: PMID:15938715
      supporting_text: Disruption of the yeast ARD homolog, YMR009w gene, abolished ability of the cells to grow
        in this culture condition.
    - &id004
      reference_id: PMID:15938715
      supporting_text: Re-expression of either the YMR009w or MTCBP-1 gene restored the cell growth.
