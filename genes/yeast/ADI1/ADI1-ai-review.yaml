id: Q03677
gene_symbol: ADI1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Acireductone dioxygenase (ARD, MtnD) of Saccharomyces cerevisiae, a small cupin-fold metalloenzyme
  of the methionine salvage (MTA) pathway. In its Fe(2+) form it oxidises the acireductone 1,2-dihydroxy-3-keto-5-methylthiopentene
  with O2 to formate and 4-methylthio-2-oxobutanoate (KMTB), the alpha-keto acid that is transaminated to regenerate
  L-methionine (step 5 of 6 of the salvage pathway). Deletion of ADI1 abolishes growth on 5'-methylthioadenosine
  as sole sulfur source, and the defect is complemented by the human orthologue ADI1/MTCBP-1. The homologous Ni(2+)-containing
  bacterial enzyme produces 3-methylthiopropionate and CO (an off-pathway reaction), but this activity has not been
  demonstrated for the yeast enzyme. Adi1 is a soluble cytoplasmic and nuclear protein induced by heat shock.
