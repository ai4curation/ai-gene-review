gene_symbol: ADI1
organism: yeast
uniprot_id: Q03677
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes 2 different reactions between oxygen and the acireductone 1,2-dihydroxy-3-keto-5-methylthiopentene
    (DHK-MTPene) depending upon the metal bound in the active site (By similarity).
    Fe- containing acireductone dioxygenase (Fe-ARD) produces formate and 2- keto-4-methylthiobutyrate
    (KMTB), the alpha-ketoacid precursor of methionine in the methionine recycle pathway
    (PubMed:15938715, PubMed:18625006). Ni-containing acireductone dioxygenase (Ni-ARD)
    produces methylthiopropionate, carbon monoxide and formate, and does not lie on
    the methionine recycle pathway (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03677
  source_id: Q03677
- source: Alliance_Imported
  text: Acireductone dioxygenease involved in methionine salvage pathway; transcribed
    as polycistronic mRNA with YMR010W and regulated post-transcriptionally by RNase
    III (Rnt1p) cleavage; ADI1 mRNA is induced in heat shock conditions; human ortholog
    ADI1 can complement yeast adi1 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADI1
  source_id: SGD:S000004611
- source: Alliance_Automated
  text: Enables acireductone dioxygenase (Ni2+-requiring) activity and acireductone
    dioxygenase [iron(II)-requiring] activity. Involved in L-methionine cycle. Located
    in cytoplasm and nucleus. Orthologous to human ADI1 (acireductone dioxygenase
    1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADI1
  source_id: SGD:S000004611
