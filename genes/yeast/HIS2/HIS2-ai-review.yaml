- term:
    id: GO:0009165
    label: nucleotide biosynthetic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PRPP-PWY-1
  review:
    summary: RCA propagated from the YeastPathways superpathway PRPP-PWY-1 (superpathway of histidine,
      purine and pyrimidine biosynthesis), which assigns the umbrella process to every member enzyme.
      HIS2 catalyses step 8, histidinol-phosphatase of L-histidine biosynthesis; its substrates and products
      are histidine-pathway intermediates, and it performs no step of nucleotide biosynthesis. Sharing
      PRPP as a precursor with nucleotide synthesis is not participation. The pathway-bundling artefact
      should be removed.
    action: REMOVE
    supported_by:
    - reference_id: PMID:14190241
      supporting_text: Each of the histidine mutants of Saccharomyces cerevisiae has been correlated with
        a particular step in histidine biosynthesis
