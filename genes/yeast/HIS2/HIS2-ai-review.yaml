  label: Saccharomyces cerevisiae S288C
description: Histidinol-phosphatase (HolPase, EC 3.1.3.15) of Saccharomyces cerevisiae, a member of the
  PHP (polymerase and histidinol phosphatase) hydrolase family, HisK subfamily. It catalyses step 8 of
  L-histidine biosynthesis, the hydrolysis of L-histidinol phosphate to L-histidinol and phosphate, providing
  the substrate for histidinol dehydrogenase (the HIS4 C-terminal domain). his2 mutants are histidine
  auxotrophs; the protein is cytosolic.
