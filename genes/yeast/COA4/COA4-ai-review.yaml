- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:14562095
  qualifier: located_in
  review:
    summary: Nuclear localization from the genome-wide C-terminal GFP fusion library, contradicted
      by every other localization source for this protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Flagged because it conflicts with everything else known about this protein, not
      because the evidence behind it could not be inspected. COA4 is a twin CX9C substrate
      of the MIA40-ERV1 disulfide relay, and there is no described route by which such a protein
      reaches the nucleus: import commits it to the intermembrane space, where its two disulfides
      are oxidatively trapped. The call is contradicted by Bax-release IMS proteomics (EXP),
      direct assay localization (IDA), the phylogenetic and InterPro assignments, Reactome,
      and the UniProt subcellular location, and no other source of any kind places this protein
      in the nucleus. The most likely explanation is that C-terminal GFP fusion blocked import
      and the mislocalized fusion was scored outside mitochondria - the same library gives
      this protein a cytoplasmic call too. Marked over-annotated rather than removed so a
      curator with access to the original images can make the final call; REMOVE would be
      defensible.'
    supported_by:
    - reference_id: PMID:14562095
      supporting_text: Global analysis of protein localization in budding yeast
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: HDA
  original_reference_id: PMID:14562095
  qualifier: located_in
  review:
    summary: Cytoplasmic localization from the genome-wide C-terminal GFP fusion library.
      A cytosolic pool is expected for a MIA40 substrate, which dwells in the cytosol before
      import.
    action: KEEP_AS_NON_CORE
    reason: Mia40-pathway substrates genuinely occupy the cytosol before import - twin CX9C
      proteins remain there for several minutes while awaiting the disulfide relay - so a
      cytosolic signal for this protein is biologically expected rather than anomalous. The
      C-terminal GFP tag used by this library can also block import, so this row may partly
      report a tagging artifact, but nothing known about the protein contradicts a genuine
      cytosolic pool. Accepted as a correct compartment and kept non-core because the functionally
      relevant pool - the one that acts on the copper delivery pathway - is the intermembrane
      space one.
    supported_by:
