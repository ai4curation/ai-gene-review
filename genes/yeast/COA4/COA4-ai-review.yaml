core_functions:
- description: Accessory factor of the mitochondrial copper delivery pathway to cytochrome
    c oxidase. Coa4 acts in the intermembrane space downstream of Cox1 synthesis and hemylation
    and upstream of the copper metallochaperone Cox11, with which it physically interacts,
    and is required for normal cytochrome c oxidase abundance and activity. It is not itself
    a copper metallochaperone. Loss of Coa4 reduces mitochondrial and cellular copper and
    causes accumulation of partially assembled complex IV intermediates that generate hydrogen
    peroxide.
