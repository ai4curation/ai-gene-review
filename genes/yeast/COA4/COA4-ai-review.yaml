id: Q05809
gene_symbol: COA4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Coa4 (originally Cmc3; YLR218C) is a 96-residue twin CX9C protein of the yeast
  mitochondrial intermembrane space, peripherally associated with the inner membrane. Its
  CHCH fold is stabilized by two intramolecular disulfides and its import depends on the Mia40-Erv1
  disulfide relay. Coa4 acts in the mitochondrial copper delivery pathway to cytochrome c
  oxidase, functioning downstream of Cox1 synthesis and hemylation and upstream of the copper
  metallochaperone Cox11, with which it physically interacts. Cells lacking Coa4 have reduced
  cytochrome c oxidase activity and abundance, reduced mitochondrial and cellular copper,
  and increased reactive oxygen species from partially assembled complex IV intermediates;
  the respiratory growth defect is suppressed by overexpression of COX11 in a manner requiring
  the copper-coordinating cysteines of Cox11, and separately by overexpression of CYC1. Coa4
  is not itself a copper metallochaperone - it lacks the copper-coordinating cysteine motif
  of Cox17 - and no molecular function has been demonstrated for it. The role is conserved:
  human COA4 complements the yeast null mutant.'
