  review:
    summary: SGD's explicit 'no data' placeholder for molecular function.
    action: ACCEPT
    reason: 'Correct and worth preserving. No catalytic or binding activity has ever been
      demonstrated for Coa4, and metallochaperone activity is positively excluded because
      it lacks the copper-coordinating cysteine motif of Cox17. This ND row is an accurate
      statement of the state of knowledge, and it independently corroborates the decision
      in the human COA4 review not to assert a molecular function term. It should be retired
      only when a real molecular function is demonstrated, not replaced with a generic binding
      term. No supporting_text is attached: this row asserts the absence of demonstrated activity,
      and no quotation can evidence an absence. The argument for keeping it is the reasoning
      above, not a citation.'
