suggested_questions:
- question: Should the nucleus (GO:0005634) and cytoplasm (GO:0005737) HDA rows from the genome-wide
    GFP library be retired? Coa4 is a small twin CX9C Mia40 substrate where C-terminal GFP
    fusion is a known cause of failed intermembrane space import, and the calls conflict with
    EXP proteomics, two IDA rows, IBA, IEA, TAS and UniProt.
  experts:
  - SGD curators
  - GO cellular component curation group
- question: 'What is Coa4''s molecular function? The SGD ND placeholder on GO:0003674 is currently
    the honest answer: no activity has been demonstrated and metallochaperone activity is
    excluded. Is Coa4 stabilizing Cox11, loading it with copper, or gating handoff to Cox1?'
  experts:
  - GO molecular function curation group
  - Gohil lab
- question: Why does high-copy CYC1 suppress the coa4-null respiratory defect? Bestwick et
    al. called this a major clue to Coa4 function and it has not been followed up in fifteen
    years.
  experts:
  - Winge lab
  - Khalimonchuk lab
- question: Does the IMS phosphatase Ptc5 regulate Coa4 by dephosphorylation, as suggested
    by its enrichment in the 2026 Coa4-V5 co-IP? Only co-IP enrichment supports this.
  experts:
  - Gohil lab
suggested_experiments:
- hypothesis: The nuclear and cytoplasmic GFP signals for Coa4 are C-terminal tagging artifacts
    caused by blocked Mia40-dependent import.
  description: Compare subcellular localization of N-terminally tagged, C-terminally tagged
    and untagged Coa4 by fractionation and immunoblot, and test import of each into isolated
    mitochondria in vitro.
  experiment_type: cell biology
- hypothesis: Coa4 is required for copper loading of Cox11 rather than for Cox11 stability
    per se.
  description: Measure copper occupancy of immunopurified Cox11 from wild-type and coa4-null
    mitochondria by ICP-MS, normalized to recovered Cox11 protein so that metallation is separated
    from abundance.
  experiment_type: biochemical
- hypothesis: Ptc5-mediated dephosphorylation regulates the Coa4-Cox11 interaction.
  description: Map Coa4 phosphosites, test phospho-null and phospho-mimetic alleles for respiratory
    growth and cytochrome c oxidase assembly, and assay whether the Coa4-Cox11 co-IP is phosphorylation
    dependent in a ptc5-null background.
  experiment_type: genetic
