- term:
    id: GO:0047681
    label: aryl-alcohol dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      Electronic (ARBA machine-learning rule) assignment of the specific molecular
      function "aryl-alcohol dehydrogenase (NADP+) activity" to AAD3. AAD3 is a
      member of the AKR family, but purified Aad3 was inactive against the tested
      aldehydes and repair of its catalytically essential Tyr73 substitution did not
      restore activity.
    action: REMOVE
    reason: >-
      This specific activity is refuted by direct biochemical testing. PMID:29079624
      found activity only for Aad4 and Aad14; native Aad3 was inactive, and correcting
      its catalytic-site substitution still failed to yield a functional enzyme.
    supported_by:
