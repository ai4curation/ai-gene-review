id: P25612
gene_symbol: AAD3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  AAD3 (systematic name YCR107W) is a Saccharomyces cerevisiae open reading frame
  encoding a 363-residue, full-length member of the aldo/keto reductase (AKR)
  superfamily (Pfam PF00248; aldo/keto reductase 2 subfamily). It is one of a set
  of paralogous "aryl-alcohol dehydrogenase" (AAD) genes (AAD3, AAD4, AAD6, AAD10,
  AAD14, AAD15, AAD16), most residing in subtelomeric regions, that were identified
  by sequence similarity to the NADP(+)-dependent aryl-alcohol dehydrogenase of the
  lignin-degrading white-rot fungus Phanerochaete chrysosporium. Despite the family
  name, purified recombinant Aad3p shows no NADPH-dependent reductase activity toward
  any tested aryl-aldehyde, whereas its paralogs Aad4p and Aad14p are active. Aad3p
  carries a cysteine in place of the catalytically essential tyrosine of the AKR
  catalytic tetrad (Cys73), and reverting this residue to tyrosine does not restore
  activity, so AAD3 is regarded as a pseudogenizing, catalytically inactive member of
  the family. Consistent with this, combined deletion of all seven yeast AAD genes
  produces no defect in aromatic-aldehyde reduction, and AAD3 overexpression neither
  raises aryl-aldehyde reductase activity in cell extracts nor confers aryl-aldehyde
  resistance. AAD3 is thus best described as an AKR-fold protein of the AAD family
  that has lost aryl-alcohol dehydrogenase activity and has no established
  physiological substrate, biological role, or subcellular location.
references:
- id: GO_REF:0000015
  title: Use of the ND evidence code for Gene Ontology (GO) terms
