- id: PMID:10572264
  title: Disruption of seven hypothetical aryl alcohol dehydrogenase genes from Saccharomyces
    cerevisiae and construction of a multiple knock-out strain.
  findings:
  - statement: >-
      The seven S. cerevisiae AAD ORFs were identified in silico by high sequence
      similarity to the aryl-alcohol dehydrogenase of the lignin-degrading fungus
      Phanerochaete chrysosporium, and were named/annotated as putative aryl-alcohol
      dehydrogenases on that homology basis.
    supporting_text: >-
      By in silicio analysis, we have discovered that there are seven open reading
      frames (ORFs) in Saccharomyces cerevisiae whose protein products show a high
      degree of amino acid sequence similarity to the aryl alcohol dehydrogenase (AAD)
      of the lignin-degrading fungus Phanerochaete chrysosporium.
  - statement: >-
      Deletion of the AAD genes, singly and in combination up to a septuple deletant,
      produced no detectable defect in aromatic-aldehyde reduction, arguing against a
      demonstrable, non-redundant aryl-alcohol dehydrogenase role for these genes
      (including AAD3) under the conditions tested.
    supporting_text: >-
      None of the knock-out strains revealed any mutant phenotype when tested for the
      degradation of aromatic aldehydes using both spectrophotometry and high
      performance liquid chromatography (HPLC).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary paper (Delneri et al., Yeast 1999) that explicitly
      constructs and phenotypes deletions of the seven S. cerevisiae AAD genes,
      including AAD3/YCR107W. Cached record is abstract-only (full_text_available:
      false), but the abstract itself directly supports (a) the homology-based origin
      of the AAD annotations and (b) the absence of an aryl-aldehyde-degradation
      phenotype in the AAD deletants. This is the source of the ISS annotations on
      AAD3, and it is the strongest available evidence bearing on AAD3 function.
- id: PMID:29079624
  title: Deciphering the Origin, Evolution, and Physiological Function of the Subtelomeric
    Aryl-Alcohol Dehydrogenase Gene Family in the Yeast Saccharomyces cerevisiae
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMC full text verified. This study purified and assayed the yeast AAD proteins,
      identified the catalytic-site substitution in Aad3, and showed that repairing
      the missing tyrosine still failed to recover activity. It directly supersedes
      the earlier inference that intact AKR-fold membership supports an AAD3 enzyme
      annotation.
  findings:
  - statement: Only Aad4 and Aad14 were active among the seven purified yeast AAD proteins.
    supporting_text: >-
      Enzymatic activity of the seven purified yeast Aad recombinant proteins showed that
      only ScAad14p and ScAad4p were able to reduce a group of candidate aryl-aldehydes with
      the consumption of NADPH
  - statement: Restoring the catalytically essential tyrosine in Aad3 did not recover enzyme activity.
    supporting_text: >-
      correction of the missense mutation in ScAadCys73Tyrp failed to produce a functional
      enzyme
- id: file:yeast/AAD3/AAD3-hypotheses/new-go-0016616-new/openscientist.md
  title: OpenScientist hypothesis report on proposed GO:0016616 for AAD3
  publication_type: DEEP_RESEARCH
  findings:
  - statement: >-
      The focused literature analysis rejects GO:0016616 as an asserted AAD3
      molecular function because direct experiments contradict retained catalysis.
    supporting_text: >-
      Because a molecular-function term — even a broad one — asserts that the gene
      product enables the catalysis, GO:0016616 over-commits for AAD3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The report independently found and correctly prioritized PMID:29079624, distinguished
      AKR-fold ancestry from active catalysis, and concluded that AAD3 should have no asserted
      catalytic molecular function. Its sequence comparison is supplementary; the review's
      decisions rest on the verified primary biochemical study.
