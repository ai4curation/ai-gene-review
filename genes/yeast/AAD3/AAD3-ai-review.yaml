id: P25612
gene_symbol: AAD3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  AAD3 (YCR107W) encodes a 363-residue aldo/keto-reductase-family paralog in
  Saccharomyces cerevisiae. Although its intact open reading frame retains the AKR
  fold, it has cysteine in place of a catalytically essential tyrosine. Purified Aad3
  lacked detectable activity against tested aliphatic and aryl aldehydes, and restoring
  that tyrosine did not produce a functional enzyme. AAD3 therefore appears to be a
  pseudogenizing member of the subtelomeric AAD family rather than a demonstrated
  aryl-alcohol dehydrogenase. Its present physiological role, if any, and subcellular
  localization remain unknown.
