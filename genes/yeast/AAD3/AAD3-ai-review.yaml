core_functions:
- description: >-
    No core molecular function can be assigned. AAD3 is a full-length aldo/keto
    reductase-fold protein of the subtelomeric AAD family, but the purified protein
    is catalytically inactive as an NADPH-dependent aryl-aldehyde reductase, carries
    a cysteine at the catalytic-site tyrosine of the AKR tetrad, and is not rescued
    by repairing that residue; the gene is regarded as pseudogenizing. The family
    "aryl-alcohol dehydrogenase" designation is a homology label inherited from a
    fungal lignin-degradation enzyme and is not supported by activity or phenotype
    data for AAD3. No biological process or subcellular location is established.
  supported_by:
  - reference_id: PMID:29079624
    supporting_text: >-
      Enzymatic activity of the seven purified yeast Aad recombinant proteins showed
      that only ScAad14p and ScAad4p were able to reduce a group of candidate
      aryl-aldehydes with the consumption of NADPH (Fig. 1), validating their
      predicted enzyme category as aryl-alcohol dehydrogenases (EC 1.1.1.90).
  - reference_id: PMID:29079624
    supporting_text: >-
      Repair of an AAD3 missense mutation at the catalytically
      essential Tyr73 residue did not result in a functional enzyme.
  - reference_id: PMID:10572264
    supporting_text: >-
      None of the knock-out strains revealed any mutant phenotype when tested for the
      degradation of aromatic aldehydes using both spectrophotometry and high
      performance liquid chromatography (HPLC).
knowledge_gaps:
- gap_statement: >-
    The aryl-alcohol dehydrogenase activity implied by the gene name has been directly
    tested on purified Aad3p and refuted, but no positive molecular function has taken
    its place. What remains unknown is whether Aad3p retains any catalytic activity
    outside the aryl-/aliphatic-aldehyde substrate panel and NADPH/NADH cofactors that
    were assayed (for example other aldo/keto reductase substrate classes such as
    keto-steroids, sugar aldehydes or quinones), or whether it has a non-catalytic
    role; no EC number can currently be assigned.
  boundary: >-
    What is established: purified recombinant Aad3p shows no reductase activity on the
    aryl-aldehyde panel on which its paralogs Aad4p and Aad14p and the reference
    P. chrysosporium Aad1p are active; no yeast Aad protein was active with NADH as
    cofactor; Aad3p carries Cys73 in place of the catalytically essential tyrosine of
    the AKR tetrad and the Cys73-to-Tyr revertant is still inactive; the AKR fold
    (Pfam PF00248) and full-length 363-residue ORF are nevertheless retained. What is
    NOT established: whether any activity exists on substrate classes outside the
    tested panel, whether the protein binds NADP(H) at all, and whether it has a
    non-catalytic (structural, regulatory or moonlighting) function.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    Aad3p is a strong candidate fold-retaining pseudoenzyme: the family-level activity
    is excluded on the target, yet the ORF is intact and conserved across many
    S. cerevisiae strains. Distinguishing "wholly inert relic" from "retains a
    narrower or non-catalytic activity" determines whether AAD3 should carry any
    molecular-function annotation at all, and guards against the family name being
    re-propagated as an electronic MF annotation.
  resolution: >-
    Broad-substrate profiling of purified Aad3p beyond the aryl-aldehyde panel
    (keto-steroids, sugar aldehydes, quinones, reactive carbonyls such as methylglyoxal)
    with both NADPH and NADH; direct measurement of NADP(H) binding to test whether the
    cofactor pocket is still functional; structure determination to establish which
    elements of the catalytic tetrad and cofactor site remain intact; and interaction
    proteomics to test for a non-catalytic role.
  provenance:
  - reference_id: PMID:29079624
    supporting_text: >-
      Enzymatic activity of the seven purified yeast Aad recombinant proteins showed
      that only ScAad14p and ScAad4p were able to reduce a group of candidate
      aryl-aldehydes with the consumption of NADPH (Fig. 1), validating their
      predicted enzyme category as aryl-alcohol dehydrogenases (EC 1.1.1.90).
  - reference_id: PMID:29079624
    supporting_text: >-
      While PcAad1p can use both NADPH (Km, 39 μM) and NADH (Km, 220 μM), neither of
      the yeast Aad proteins was active with NADH as a reduction cofactor.
- gap_statement: >-
    The biological role of AAD3 in S. cerevisiae — the pathway or physiological
    process (if any) it participates in, and the condition under which it is expressed
    or required — is undetermined. The aryl-alcohol/lignin context inherited from the
    Phanerochaete chrysosporium enzyme does not obviously apply, since budding yeast is
    not a lignin degrader.
  boundary: >-
    What is established: combined deletion of all seven yeast AAD genes (including
    AAD3) causes no defect in aromatic-aldehyde reduction, no change in
    ergosterol/phospholipid profiles, and no mating or sporulation defect; AAD
    transcript levels, AAD3 included, are not induced by aryl-aldehyde exposure; and
    multicopy AAD3 overexpression neither raises aryl-aldehyde reductase activity in
    crude extracts nor improves growth on toxic aryl-aldehydes, in wild-type or adh6
    backgrounds. The aryl-aldehyde detoxification hypothesis is therefore excluded on
    both loss- and gain-of-function grounds. What is NOT established: any other
    condition-specific role, inducing signal, or non-redundant contribution of AAD3
    outside the aryl-aldehyde context that has been probed.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Without a defined biological process, AAD3 cannot be placed in a pathway or
    GO-CAM, and its retention as a full-length ORF (versus loss, as happened to AAD15)
    is unexplained. The obvious candidate process has now been tested and excluded, so
    any remaining role would have to lie outside aryl-aldehyde detoxification.
  resolution: >-
    Condition-dependent phenotyping of aad3 single and AAD-family multiple mutants
    outside the aryl-aldehyde context (oxidative/carbonyl stress, stationary phase,
    varied carbon/nitrogen sources, nutrient limitation), combined with unbiased AAD3
    expression profiling across conditions, to detect any non-redundant,
    condition-specific requirement.
  provenance:
  - reference_id: PMID:10572264
    supporting_text: >-
      Specific tests for changes in the ergosterol and phospholipids profiles did not
      reveal any mutant phenotype and mating and sporulation efficiencies were not
      affected in the septuple deletant.
  - reference_id: PMID:29079624
    supporting_text: >-
      Contrary to expectation, none of the seven AAD transcript levels increased
      following 1 to 2 h treatment with aryl-aldehydes, relative to a no-aldehyde
      control (2-tailed t test, P < 0.05; n = 6).
  - reference_id: PMID:29079624
    supporting_text: >-
      None of the transformants exhibited growth improvement on the four
      aryl-aldehydes, even those bearing AAD1 from P. chrysosporium. Indeed, while
      activity in BY4741 cell crude extracts expressing PcAad1p was 2-fold higher than
      that of the blank-plasmid control, activities in cells expressing ScAad3p,
      ScAad4p, and ScAd14p did not significantly differ (Fig. S7).
- gap_statement: >-
    Why the AAD (aryl-alcohol dehydrogenase) gene family expanded to multiple, largely
    subtelomeric paralogs in Saccharomyces cerevisiae, and why a catalytically dead
    member such as AAD3 is retained as a full-length ORF across most sequenced strains
    rather than being lost or truncated, is unknown.
  boundary: >-
    What is established: S. cerevisiae carries multiple AAD paralogs (AAD3, AAD4,
    AAD6, AAD10, AAD14, AAD15, AAD16) defined by similarity to a single fungal enzyme;
    only AAD4 and AAD14 encode active aryl-aldehyde reductases, while the remaining
    members including AAD3 are described as pseudogenizing; the AAD3 ORF is
    nonetheless intact and full-length (a missense, not a truncating, lesion), and
    AAD3 copy number varies among strains. What is NOT established: the
    selective/evolutionary force behind the expansion, or why the degenerate members
    are retained rather than eroded.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    AAD family expansion is a model case of subtelomeric gene-family proliferation of
    uncertain adaptive value; resolving it explains the retention of AAD3 as a relic
    and informs broader questions about how yeast subtelomeres generate and retain
    paralogs.
  resolution: >-
    Comparative genomics across Saccharomyces and related yeasts (synteny, dN/dS,
    presence/absence, pseudogenization signatures) together with per-paralog
    biochemical characterization to determine which AAD members are under purifying
    selection and functionally distinct, and whether AAD3 shows any signature of
    constraint despite its inactivity.
  provenance:
  - reference_id: PMID:10572264
    supporting_text: >-
      By in silicio analysis, we have discovered that there are seven open reading
      frames (ORFs) in Saccharomyces cerevisiae whose protein products show a high
      degree of amino acid sequence similarity to the aryl alcohol dehydrogenase (AAD)
      of the lignin-degrading fungus Phanerochaete chrysosporium.
  - reference_id: PMID:29079624
    supporting_text: >-
      Our observation that the majority of BY4741 AAD genes were undergoing
      pseudogenization prompted us to survey their distribution and sequence variation
      in diverse sequenced strains, including those adapted to the laboratory (BY4741
      and Sigma1278b), to wine fermentation (EC1118, AWRI1631, AWRI796, Lalvin QA23,
      and VL3), to the brewing of beer (Fosters B and Fosters O) and sake (Kyokai no.
      7), and to life as an opportunistic human pathogen (YJM789) (Table 3).
suggested_questions:
- question: >-
    Given that purified Aad3p is inactive on aryl-aldehydes with either NADPH or NADH,
    is it wholly catalytically dead, or does it retain activity on an untested
    aldo/keto reductase substrate class (keto-steroids, sugar aldehydes, quinones, or
