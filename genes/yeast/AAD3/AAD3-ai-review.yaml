- id: PMID:10572264
  title: Disruption of seven hypothetical aryl alcohol dehydrogenase genes from Saccharomyces
    cerevisiae and construction of a multiple knock-out strain.
  findings:
  - statement: >-
      The seven S. cerevisiae AAD ORFs were identified in silico by high sequence
      similarity to the aryl-alcohol dehydrogenase of the lignin-degrading fungus
      Phanerochaete chrysosporium, and were named/annotated as putative aryl-alcohol
      dehydrogenases on that homology basis.
    supporting_text: >-
      By in silicio analysis, we have discovered that there are seven open reading
      frames (ORFs) in Saccharomyces cerevisiae whose protein products show a high
      degree of amino acid sequence similarity to the aryl alcohol dehydrogenase (AAD)
      of the lignin-degrading fungus Phanerochaete chrysosporium.
  - statement: >-
      Deletion of the AAD genes, singly and in combination up to a septuple deletant,
      produced no detectable defect in aromatic-aldehyde reduction, arguing against a
      demonstrable, non-redundant aryl-alcohol dehydrogenase role for these genes
      (including AAD3) under the conditions tested.
    supporting_text: >-
      None of the knock-out strains revealed any mutant phenotype when tested for the
      degradation of aromatic aldehydes using both spectrophotometry and high
      performance liquid chromatography (HPLC).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary paper (Delneri et al., Yeast 1999) that explicitly
      constructs and phenotypes deletions of the seven S. cerevisiae AAD genes,
      including AAD3/YCR107W. Cached record is abstract-only (full_text_available:
      false), but the abstract itself directly supports (a) the homology-based origin
      of the AAD annotations and (b) the absence of an aryl-aldehyde-degradation
      phenotype in the AAD deletants. This is the source of the ISS annotations on
      AAD3. It is now complemented by the direct biochemical characterization of
      purified Aad3p in PMID:29079624.
- id: PMID:29079624
  title: Deciphering the Origin, Evolution, and Physiological Function of the Subtelomeric
    Aryl-Alcohol Dehydrogenase Gene Family in the Yeast Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Of the seven purified recombinant yeast Aad proteins, only Aad4p and Aad14p
      reduced aryl-aldehydes with NADPH; purified Aad3p was inactive on the whole
      substrate panel.
    supporting_text: >-
      Enzymatic activity of the seven purified yeast Aad recombinant proteins showed
      that only ScAad14p and ScAad4p were able to reduce a group of candidate
      aryl-aldehydes with the consumption of NADPH (Fig. 1), validating their
      predicted enzyme category as aryl-alcohol dehydrogenases (EC 1.1.1.90).
  - statement: >-
      Aad3p carries a cysteine (Cys73) at the position of the catalytically essential
      tyrosine of the aldo/keto reductase catalytic tetrad, and reverting Cys73 to
      tyrosine did not restore any aryl-aldehyde reductase activity, indicating that
      AAD3 has accumulated additional inactivating changes and is pseudogenizing.
    supporting_text: >-
      However, alignment showed that in ScAad3p, a cysteine73 residue was present at
      the corresponding catalytic site tyrosine73. This substitution in ScAad3p could
      have been caused by a single nucleotide mutation from A218 to G218 of its coding
      sequence (Fig. 2 and S1). We therefore performed two site-directed mutagenesis
      experiments. In PcAad1p, the functional Tyr76 was mutated into Cys76 (TG227C to
      TA227C), whereas in ScAad3p, the Cys73 was replaced by Tyr73 (TA218C to TG218C).
      Following heterologous expression and purification, the activities of the
      recombinant proteins were assayed on a variety of aryl-aldehyde substrates. As
      expected, the PcAad1Tyr76Cysp variant was completely inactive on all of these
      substrates; however, correction of the missense mutation in ScAadCys73Tyrp
      failed to produce a functional enzyme (data not shown).
  - statement: >-
      Multicopy overexpression of AAD3 did not raise aryl-aldehyde reductase activity
      in crude extracts and did not improve growth on toxic aryl-aldehydes, in either
      wild-type or adh6 backgrounds.
    supporting_text: >-
      None of the transformants exhibited growth improvement on the four
      aryl-aldehydes, even those bearing AAD1 from P. chrysosporium. Indeed, while
      activity in BY4741 cell crude extracts expressing PcAad1p was 2-fold higher than
      that of the blank-plasmid control, activities in cells expressing ScAad3p,
      ScAad4p, and ScAd14p did not significantly differ (Fig. S7).
  - statement: >-
      The authors conclude that most of the BY4741 AAD genes, AAD3 included, are
      undergoing pseudogenization.
    supporting_text: >-
      Repair of an AAD3 missense mutation at the catalytically
      essential Tyr73 residue did not result in a functional enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary paper (Yang et al., Appl Environ Microbiol 2018; full text
      cached). It is the only study that expresses, purifies and assays the AAD3 gene
      product itself, and it directly tests the catalytic-site defect by site-directed
      mutagenesis. It therefore supersedes the homology-only basis of the
      aryl-alcohol dehydrogenase annotations on AAD3.
- id: PMID:27299603
  title: Copy number variations of genes involved in stress responses reflect the redox
    state and DNA damage in brewing yeasts.
  findings:
  - statement: >-
      In an array-CGH survey of brewing strains, reduced copy number of several AAD
      genes (AAD3, AAD6, AAD10, AAD15 in one lager strain) correlated with redox
      imbalance and oxidative DNA damage; this is a strain-level correlation across
      the AAD family and provides no AAD3-specific mechanism.
    supporting_text: >-
      We found that decreased dosage of AAD genes was correlated with intracellular
      redox disequilibrium and oxidative DNA damage.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Adamczyk et al., Cell Stress Chaperones 2016; full text
      cached). Correlational copy-number study in industrial strains; AAD3 is only
      one of several AAD genes lost together, so it does not establish any function
      for AAD3 and is retained as background context only.
existing_annotations:
- term:
    id: GO:0047681
    label: aryl-alcohol dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      Electronic (ARBA machine-learning rule) assignment of the specific molecular
      function "aryl-alcohol dehydrogenase (NADP+) activity" to AAD3 on the basis of
      AAD/AKR family sequence features. The activity has been tested directly on the
      AAD3 gene product and is absent: purified recombinant Aad3p did not reduce any
      of the aryl-aldehydes on which its paralogs Aad4p and Aad14p are active, the
      protein carries Cys73 in place of the catalytically essential tyrosine of the
      AKR tetrad, and reverting Cys73 to Tyr did not restore activity.
    action: REMOVE
    reason: >-
      This is a demonstrably wrong electronic transfer. The rule assigns the family
      activity to every AAD-like sequence, but the only biochemical study of the AAD3
      protein itself (Yang et al. 2018) found it catalytically inactive across the
      aryl-aldehyde substrate panel, identified a substitution at the catalytic-site
      tyrosine, and showed that correcting that substitution still yields no active
      enzyme, i.e. AAD3 has accumulated additional inactivating changes and is
      pseudogenizing. The earlier family-wide deletion data (no aryl-aldehyde
      phenotype) and the failure of AAD3 overexpression to raise extract activity are
      consistent with this. An annotation asserting the specific enzymatic activity is
      therefore contradicted, not merely over-specific, and should be removed rather
      than generalized.
    supported_by:
    - reference_id: PMID:29079624
      supporting_text: >-
        Enzymatic activity of the seven purified yeast Aad recombinant proteins showed
        that only ScAad14p and ScAad4p were able to reduce a group of candidate
        aryl-aldehydes with the consumption of NADPH (Fig. 1), validating their
        predicted enzyme category as aryl-alcohol dehydrogenases (EC 1.1.1.90).
    - reference_id: PMID:29079624
      supporting_text: >-
        As expected, the PcAad1Tyr76Cysp variant was completely inactive on all of
        these substrates; however, correction of the missense mutation in
        ScAadCys73Tyrp failed to produce a functional enzyme (data not shown).
    - reference_id: PMID:10572264
      supporting_text: >-
        None of the knock-out strains revealed any mutant phenotype when tested for the
        degradation of aromatic aldehydes using both spectrophotometry and high
        performance liquid chromatography (HPLC).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: GO_REF:0000117
        source_label: ARBA machine-learning rule (family AKR / aryl-alcohol dehydrogenase)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Rule assigns the family activity from AKR/AAD sequence features; the AAD3
          target has lost the catalytic-site tyrosine and is inactive when purified and
          assayed, so the transfer is contradicted by direct evidence on the target.
- term:
    id: GO:0006081
    label: aldehyde metabolic process
  evidence_type: ISS
  original_reference_id: PMID:10572264
  qualifier: involved_in
  review:
    summary: >-
      ISS assignment of the broad biological process "aldehyde metabolic process" to
      AAD3, inferred by sequence similarity (with/from UniProtKB:Q01752, the
      P. chrysosporium aryl-alcohol dehydrogenase). The inference presupposes that
      Aad3p is an aldehyde-reducing enzyme, but purified Aad3p has no detectable
      NADPH-dependent aldehyde reductase activity, it lacks the catalytic-site
      tyrosine, correcting that residue does not rescue activity, and neither
      deletion of the AAD family nor overexpression of AAD3 alters aldehyde
      metabolism in vivo.
    action: REMOVE
    reason: >-
      The process annotation is a homology transfer whose premise (an active
      aldehyde reductase) has been tested on the AAD3 product and refuted (Yang et
      al. 2018). A catalytically inactive, pseudogenizing AKR-fold protein cannot be
      said to be involved in aldehyde metabolism, and there is no phenotypic evidence
      linking AAD3 to any aldehyde-related process: the septuple aad deletant has no
      aromatic-aldehyde phenotype and AAD3 overexpression does not change extract
      reductase activity or aryl-aldehyde tolerance. Retaining the term, even as
      non-core, would keep asserting a role that the direct evidence contradicts.
    supported_by:
    - reference_id: PMID:29079624
      supporting_text: >-
        Enzymatic activity of the seven purified yeast Aad recombinant proteins showed
        that only ScAad14p and ScAad4p were able to reduce a group of candidate
        aryl-aldehydes with the consumption of NADPH (Fig. 1), validating their
        predicted enzyme category as aryl-alcohol dehydrogenases (EC 1.1.1.90).
