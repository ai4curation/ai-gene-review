- source: Alliance_Automated
  text: Predicted to enable aryl-alcohol dehydrogenase (NADP+) activity. Predicted
    to be involved in aldehyde metabolic process. Orthologous to human AKR7A2 (aldo-keto
    reductase family 7 member A2) and AKR7A3 (aldo-keto reductase family 7 member
    A3).
