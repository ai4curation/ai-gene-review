descriptions:
- source: Alliance_Imported
  text: Putative aryl-alcohol dehydrogenase; similar to P. chrysosporium aryl-alcohol
    dehydrogenase; mutational analysis has not yet revealed a physiological role;
    AAD3 has a paralog, AAD15, that arose from a segmental duplication; members of
    the AAD gene family comprise three pairs (AAD3 + AAD15, AAD6/AAD16 + AAD4, AAD10
    + AAD14) whose two genes are more related to one another than to other members
    of the family
  source_type: curated
  url: https://www.yeastgenome.org/locus/AAD3
