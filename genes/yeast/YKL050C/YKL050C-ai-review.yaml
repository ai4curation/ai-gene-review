  label: Saccharomyces cerevisiae S288C
description: >-
  YKL050C, now named LPX2, is a peroxisomal matrix EIS1-family paralog in
  Saccharomyces cerevisiae. It has lipase activity and perturbs the yeast
  lipidome when deleted, but its in vivo substrate and lipid-catabolic pathway
  remain unresolved.
