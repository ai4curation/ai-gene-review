knowledge_gaps:
- gap_statement: >-
    The physiological lipid substrate and peroxisomal pathway acted on by Lpx2
    are unknown.
  boundary: >-
    LPX2 deletion changes the lipidome and the protein is a peroxisomal lipase,
    but the Yifrach et al. survey did not identify the direct Lpx2 substrate or
    distinguish a membrane-remodeling role from a vesicle-catabolism role.
