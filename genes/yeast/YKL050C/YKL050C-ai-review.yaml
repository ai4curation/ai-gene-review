  review:
    summary: >-
      REMOVE: YKL050C/LPX2 is now experimentally supported as a lipase.
    action: REMOVE
    nd_case: STALE
    reason: >-
      The root molecular_function ND row is stale. Ploier et al. included
      Ykl050cp in a curated set of GXSXG-motif candidate lipases, and Yifrach
      et al. combined those lipase data with peroxisomal-matrix localization
      and lipidomics to name the gene LPX2. The exact substrate is unresolved,
      so the conservative replacement is broad GO:0016298 lipase activity.
