descriptions:
- source: UniProt
  text: Catalyzes the reaction of 4-carboxy-5-aminoimidazole ribotide (CAIR) and aspartic
    acid with the formation of N-succinyl-5-amino- imidazole-4-carboxamide ribotide
    (SAICAR) in the purine biosynthesis pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P27616
  source_id: P27616
- source: Alliance_Imported
  text: N-succinyl-5-aminoimidazole-4-carboxamide ribotide synthetase; required for
    'de novo' purine nucleotide biosynthesis; red pigment accumulates in mutant cells
    deprived of adenine; protein abundance increases in response to DNA replication
    stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADE1
  source_id: SGD:S000000070
- source: Alliance_Automated
  text: Enables phosphoribosylaminoimidazolesuccinocarboxamide synthase activity.
    Involved in 'de novo' IMP biosynthetic process. Located in cytoplasm and nucleus.
    Human ortholog(s) of this gene implicated in schizophrenia. Orthologous to human
    PAICS (phosphoribosylaminoimidazole carboxylase and phosphoribosylaminoimidazolesuccinocarboxamide
    synthase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADE1
  source_id: SGD:S000000070
