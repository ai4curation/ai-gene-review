id: P27616
gene_symbol: ADE1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ade1 (YAR015W) is the phosphoribosylaminoimidazole-succinocarboxamide (SAICAR) synthetase of Saccharomyces
  cerevisiae (EC 6.3.2.6). It ligates L-aspartate to 5-amino-1-(5-phospho-D-ribosyl)imidazole-4-carboxylate (CAIR)
  using ATP, forming SAICAR in the seventh step of de novo IMP biosynthesis. ade1 mutants require adenine and, like
  ade2 mutants, accumulate a red pigment derived from the upstream intermediate AIR. SAICAR made by Ade1 also serves
  as a signal metabolite that promotes Bas1-Bas2 (Pho2) dependent transcriptional activation of the ADE genes. Ade1
  is a soluble cytoplasmic protein.
