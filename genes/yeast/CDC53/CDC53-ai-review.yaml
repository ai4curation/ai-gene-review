- term:
    id: GO:0000409
    label: regulation of transcription by galactose
  evidence_type: NAS
  original_reference_id: PMID:21323640
  qualifier: involved_in
  review:
    summary: SCF(Das1) degrades the Mig2 repressor upon galactose induction so that GAL1 can be induced; Cdc53 is
      the cullin of that ligase, although the paper itself used a skp1 mutant and das1-delta rather than a cdc53
      allele.
    action: KEEP_AS_NON_CORE
    reason: The SCF does the work of this regulatory step (ubiquitinating Mig2 so that it is degraded and vacates
      the GAL1 promoter), and Cdc53 is the obligatory scaffold of SCF(Das1), so the process is not wrong for Cdc53.
      It is, however, one receptor-specific downstream output among many and the Cdc53 involvement is an author
      inference from SCF composition (skp1dM and das1-delta were the alleles tested; cache is abstract-only), so
      it is graded non-core rather than core.
    supported_by:
    - reference_id: PMID:21323640
      supporting_text: Mig2 degradation was also abolished in cells lacking the protein kinase Snf1 and the F-box
        protein Das1, suggesting that Snf1 triggers galactose-induced protein degradation of Mig2 by SCFDas1.
    - reference_id: PMID:21323640
      supporting_text: We generated a skp1dM mutant strain that is defective for galactose induction of the GAL1
        gene and we have found that galactose-induced protein degradation of the repressor Mig2 is defective in
