    into the Skp1-binding pocket and blocks the neddylation lysine until Skp1-F-box modules displace it, and the
    rubylated cullin is recognised by the Cdc48/p97 cofactor Ubx5. This cycle sets which F-box receptors are loaded
    onto the shared scaffold.'
