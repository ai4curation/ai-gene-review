existing_annotations:
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:10213692
  qualifier: involved_in
  review:
    summary: 'Cdc53 is required for the G1/S transition as the cullin scaffold of SCF(Cdc4) and SCF(Grr1): it assembles
      the ligase that ubiquitinates the Clb-Cdk inhibitor Sic1 and the G1 cyclins, and cdc53 mutants arrest at G1/S
      with a cdc4/cdc34-like phenotype.'
    action: ACCEPT
    reason: Core biological process. cdc53 temperature-sensitive mutants arrest at the G1/S boundary exactly like
      cdc4 and cdc34 mutants, Cdc53 is an essential subunit of the reconstituted SCF(Cdc4) that ubiquitinates phosphorylated
      Sic1 (PMID:9346238, PMID:9346239), and it is likewise required for Cln1/Cln2 ubiquitination by SCF(Grr1).
      Cdc53 does part of the work (it organises the substrate-bound adaptor and the E2 for ubiquitin transfer),
      so the participation test is met; human CUL1 carries the same term. This paper reconstitutes Cln1 ubiquitination
      with SCF(Grr1)-Rbx1 and shows that Rbx1 promotes Cdc34 association with Cdc53, defining the Cdc53-Rbx1 core
      that drives G1 cyclin turnover.
    supported_by:
    - reference_id: PMID:10213692
      supporting_text: Phosphorylated Cln1 was ubiquitinated by SCF (Skp1-Cdc53-F-box protein) complexes containing
        the F-box protein Grr1, Rbx1, and the E2 Cdc34.
    - reference_id: PMID:10213692
      supporting_text: Rbx1 promotes association of Cdc34 with Cdc53 and stimulates Cdc34 auto-ubiquitination in
        the context of Cdc53 or SCF complexes.
    - reference_id: PMID:9346239
      supporting_text: In S. cerevisiae, the G1/S transition requires Cdc4p, Cdc34p, Cdc53p, Skp1p, and the Cln/Cdc28p
        cyclin-dependent kinase (Cdk).
