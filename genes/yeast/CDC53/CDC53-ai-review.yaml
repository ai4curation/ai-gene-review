gene_symbol: CDC53
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Cdc53 is the cullin scaffold of the Saccharomyces cerevisiae SCF (Skp1-Cdc53/Cul1-F-box protein) family
  of cullin-RING E3 ubiquitin ligases and the orthologue of human CUL1. It is an elongated, non-catalytic protein:
  its N-terminal region (residues 9-280) binds Skp1, which in turn carries one of the interchangeable F-box substrate
  receptors (Cdc4, Grr1, Met30, Dia2, Mdm30, Das1, Saf1, Ufo1, Hrt3 and others), while its C-terminal cullin-homology
  region binds the RING-H2 protein Hrt1/Rbx1 and, together with Hrt1, recruits ubiquitin-charged E2 enzymes (chiefly
  Cdc34, also Ubc4) so that the receptor-bound substrate and the E2 thioester are held in a productive geometry.
  Cdc53 forms no essential ubiquitin thioester (a cysteine-less mutant is fully functional); the Cdc53-Hrt1 heterodimer
  is the minimal ubiquitin ligase module that activates Cdc34, and the F-box protein defines which substrate is
  ubiquitinated. Its activity is switched on by covalent attachment of the ubiquitin-like protein Rub1 (yeast NEDD8)
  to a conserved C-terminal lysine, promoted by the Ubc12 E2 and the Dcn1 co-E3 and reversed by the COP9 signalosome;
  the unmodified cullin is sequestered by the CAND1-like exchange factor Lag2, which occupies the Skp1-binding site
  and is displaced by Skp1-F-box modules, and the rubylated cullin is recognised by the Cdc48/p97 cofactor Ubx5.
  Through its receptors, Cdc53-based SCF ligases build proteasome-targeting ubiquitin chains that drive the G1/S
  transition (SCF(Cdc4) destruction of the Clb-Cdk inhibitor Sic1 and of Cdc6, Far1 and Gcn4; SCF(Grr1) destruction
  of the G1 cyclins Cln1/Cln2 and of Gic2), repress methionine biosynthesis genes and couple sulfur and cadmium
  signals to transcription (SCF(Met30) ubiquitination of Met4), regulate DNA replication, replisome disassembly,
  S-phase checkpoint recovery and Sir4-dependent silencing (SCF(Dia2)), promote mitochondrial outer-membrane fusion
  through Fzo1 turnover (SCF(Mdm30)), relieve GAL1 repression by Mig2 (SCF(Das1)) and clear C-degron-bearing orphan
  proteins (SCF(Das1)). CDC53 is essential; cdc53 temperature-sensitive mutants arrest at G1/S with stabilised Sic1
  and elongated multibudded morphology indistinguishable from cdc4 and cdc34 mutants. Cdc53 is found in both the
  nucleus and the cytoplasm, and the site of action of each SCF is set by its F-box receptor.'
