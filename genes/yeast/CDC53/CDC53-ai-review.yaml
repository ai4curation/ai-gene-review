suggested_questions:
- question: Which Cdc53-dependent substrate underlies the Sic1-independent G2/M requirement shared by cdc53, cdc4
    and cdc34 mutants, and is it a Cdc4-, Grr1- or Dia2-loaded SCF that acts there?
- question: Should the receptor-specific downstream outputs now annotated to the shared cullin (HXT/glucose transport
    induction, GAL1 derepression, mitochondrial fusion, Sir4-dependent silencing, checkpoint recovery, methylmercury
    resistance) be modelled instead as SCF(F-box) complex-level GO-CAM activities with the F-box protein as the
    specificity-conferring subunit, leaving Cdc53 with the scaffold activity and the SCF-dependent catabolic process?
- question: What fraction of cellular Cdc53 is rubylated versus Lag2-bound under different nutrient conditions,
    and does Lag2-driven adaptor exchange measurably change the F-box repertoire loaded on Cdc53 in vivo?
suggested_experiments:
- hypothesis: The Sic1-independent G2/M arrest of cdc53 mutants reflects stabilisation of a specific SCF substrate
    rather than a general loss of ubiquitination capacity.
  description: Compare ubiquitin-remnant (diGly) proteomes of cdc53-1 sic1-delta and wild-type cells released from
    a hydroxyurea block at the restrictive temperature, filter candidates by F-box-receptor binding, and test whether
    degron-mutant alleles of the top candidates reproduce the preanaphase arrest.
  experiment_type: conditional-allele ubiquitinome with degron mutagenesis
- hypothesis: Cdc53 is not itself an origin-DNA-binding protein; its ChIP signal at ARS elements is entirely dependent
    on Dia2 replisome/chromatin contacts.
  description: Repeat Cdc53-myc ChIP at ARS305/ARS603 in dia2-delta, dia2 TPR-delta and dia2 F-box-delta strains
    and in cells expressing a Cdc53 N-terminal deletion that cannot bind Skp1; loss of the Cdc53 signal in the Dia2
    and Skp1-binding mutants would support replacing the origin-binding molecular function with a complex-level
    localisation.
  experiment_type: chromatin immunoprecipitation with epistasis
