- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: IDA
  original_reference_id: PMID:16421250
  qualifier: enables
  review:
    summary: Myc-tagged Cdc53 (like Skp1 and Dia2) chromatin-immunoprecipitates with the replication origins ARS305
      and ARS603 in a crosslinker-dependent manner, indicating that an SCF(Dia2) complex is present at origins.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ChIP result is genuine (full text cached) and shows that Cdc53 is recruited to origin chromatin
      as the scaffold of SCF(Dia2); the authors themselves conclude that Dia2 is the origin-binding protein. Cdc53
      has no DNA-binding domain, the origin association is mediated by the Dia2 TPR/LRR regions and the replisome,
      and crosslinked co-precipitation does not establish a binding activity of Cdc53 towards origin DNA. Attributing
      the molecular function DNA replication origin binding to the cullin therefore over-reads the evidence; the
      localisation of the complex to origins is the real finding. Not removed, because the SGD curator read the
      full text and the association is real.
    supported_by:
    - reference_id: PMID:16421250
      supporting_text: both Skp1 and Cdc53 coprecipitated with ARS305 and ARS603 DNA in a cross-linker dependent
        manner. These results strongly suggest that an SCF Dia2 complex is present at replication origins.
    - reference_id: PMID:16421250
      supporting_text: We propose that Dia2 is an origin-binding protein that plays a role in regulating DNA replication.
    - reference_id: PMID:16421250
      supporting_text: Dia2 assembles with Skp1 and Cdc53 in yeast cells and the Dia2 ΔF-box mutant shows phenotypes
        similar to complete deletion of the DIA2 gene.
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IDA
  original_reference_id: PMID:10385629
  qualifier: contributes_to
  review:
    summary: 'Cdc53 contributes to the ubiquitin-protein transferase activity of SCF as the cullin scaffold: the
      Cdc53-Hrt1 heterodimer is the minimal module that activates the E2 Cdc34, and the F-box-Skp1 module adds substrate
      selection.'
    action: ACCEPT
    reason: 'Core molecular function, correctly qualified as contributes_to. Full text cached: Cdc53 alone, and
      more potently Cdc53/Hrt1, promotes Cdc34 autoubiquitination without a reactive thiol, the ligase activity
      of SCF(Cdc4) is intrinsic to the Cdc53/Hrt1 subcomplex, and the authors propose that Cdc53/Hrt1 stabilises
      the transition state of ubiquitin transfer from Cdc34 to a substrate lysine. Cdc53 forms no essential thioester
      (PMID:9499404), so contributes_to, not enables, is the right relationship.'
    supported_by:
    - reference_id: PMID:10385629
      supporting_text: although the ubiquitin ligase activity of SCF Cdc4 is intrinsic to the Cdc53/Hrt1 subcomplex,
        this activity may be enhanced upon assembly of Cdc53/Hrt1 with Cdc4/Skp1.
    - reference_id: PMID:10385629
      supporting_text: Cdc53/Hrt1 comprise a highly conserved module that serves as the functional core of a broad
        variety of heteromeric ubiquitin ligases.
    - reference_id: PMID:10385629
      supporting_text: We propose that Cdc53/Hrt1 stabilizes the oxyanion that is formed in the transition state
        as the carboxyl terminus of ubiquitin is transferred from Cdc34 to the ε-amino group of a substrate lysine.
    - reference_id: PMID:9499404
      supporting_text: Cdc53 thus appears to act as a noncatalytic scaffold protein for Cdc34 and Skp1/F-box proteins.
