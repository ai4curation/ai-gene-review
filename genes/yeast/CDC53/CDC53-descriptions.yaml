- source: Alliance_Automated
  text: Enables DNA replication origin binding activity and protein-macromolecule
    adaptor activity. Contributes to ubiquitin protein ligase activity. Involved in
    several processes, including SCF-dependent proteasomal ubiquitin-dependent protein
    catabolic process; mitotic cell cycle phase transition; and silent mating-type
    cassette heterochromatin formation. Part of SCF ubiquitin ligase complex. Orthologous
    to several human genes including CUL1 (cullin 1).
