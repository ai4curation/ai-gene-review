- source: Alliance_Automated
  text: Enables phosphatidate cytidylyltransferase activity. Involved in CDP-diacylglycerol
    biosynthetic process; phosphatidylinositol metabolic process; and phosphatidylserine
    metabolic process. Located in Golgi to plasma membrane transport vesicle and endoplasmic
    reticulum. Used to study cancer. Orthologous to human CDS1 (CDP-diacylglycerol
    synthase 1) and CDS2 (CDP-diacylglycerol synthase 2).
