gene_symbol: CDS1
organism: yeast
uniprot_id: P38221
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Supplies CDP-diacylglycerol, which may play an important role as both a precursor
    to phosphoinositide biosynthesis in the plasma membrane and as a negative effector
    of phosphatidylinositol 4-kinase activity, thereby exerting an effect on cell
    proliferation via a lipid- dependent signal transduction cascade.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38221
  source_id: P38221
- source: Alliance_Imported
  text: Phosphatidate cytidylyltransferase (CDP-diglyceride synthetase); an enzyme
    that catalyzes that conversion of CTP + phosphate into diphosphate + CDP-diaclglyerol,
    a critical step in the synthesis of all major yeast phospholipids; human homolog
    CDS1 can complement yeast cds1 null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDS1
  source_id: SGD:S000000233
- source: Alliance_Automated
  text: Enables phosphatidate cytidylyltransferase activity. Involved in CDP-diacylglycerol
    biosynthetic process; phosphatidylinositol metabolic process; and phosphatidylserine
    metabolic process. Located in Golgi to plasma membrane transport vesicle and endoplasmic
    reticulum. Used to study cancer. Orthologous to human CDS1 (CDP-diacylglycerol
    synthase 1) and CDS2 (CDP-diacylglycerol synthase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDS1
  source_id: SGD:S000000233
