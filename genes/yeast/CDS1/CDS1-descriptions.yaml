descriptions:
- source: UniProt
  text: Supplies CDP-diacylglycerol, which may play an important role as both a precursor
    to phosphoinositide biosynthesis in the plasma membrane and as a negative effector
    of phosphatidylinositol 4-kinase activity, thereby exerting an effect on cell
    proliferation via a lipid- dependent signal transduction cascade.
  source_type: curated
