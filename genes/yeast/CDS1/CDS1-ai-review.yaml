id: P38221
gene_symbol: CDS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CDS1 encodes the essential ER-resident CDP-diacylglycerol synthase (CTP:phosphatidate cytidylyltransferase,
  EC 2.7.7.41) of Saccharomyces cerevisiae. This multi-pass membrane protein converts phosphatidic acid
  and CTP to CDP-diacylglycerol (CDP-DAG), the activated lipid donor used by phosphatidylserine synthase
  (Cho1) and phosphatidylinositol synthase (Pis1) in the ER, and therefore sits at the branch point between
  the CDP-DAG route of membrane phospholipid synthesis and the diacylglycerol/triacylglycerol route. Cds1
  accounts for essentially all ER CDS activity; mitochondrial CDP-DAG for phosphatidylglycerol and cardiolipin
  synthesis is made by the unrelated enzyme Tam41 in the inner membrane. Reduced Cds1 levels raise PA,
  alter the PI:PS synthesis ratio and derepress INO1 (inositol excretion), linking Cds1 activity to the
  Henry/Opi1 regulatory circuit. CDS activity has also been detected in post-Golgi secretory vesicles.
