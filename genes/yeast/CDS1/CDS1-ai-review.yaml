suggested_questions:
- question: How is Cds1 activity partitioned between ER subdomains (e.g. nuclear ER, lipid-droplet contact
    sites) and does local CDP-DAG supply govern PI versus PS synthesis?
suggested_experiments:
- description: Auxin-degron depletion of Cds1 with time-resolved lipidomics to quantify direct versus
    compensatory effects on PI, PS and TAG synthesis.
