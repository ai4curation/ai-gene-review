  review:
    summary: The cdg1 (cds1 hypomorph) mutant had altered phospholipid synthesis including derepressed
      PS synthase, and CDS1 dosage shifts the PI:PS synthesis ratio. Cds1 supplies the CDP-DAG substrate
      for PS synthesis by Cho1 but does not itself make PS; the effect on PS metabolism is upstream/indirect.
