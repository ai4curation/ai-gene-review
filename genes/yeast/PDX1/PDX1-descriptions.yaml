taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for anchoring dihydrolipoamide dehydrogenase (E3) to the dihydrolipoamide
    transacetylase (E2) core of the pyruvate dehydrogenase complexes of eukaryotes.
    This specific binding is essential for a functional PDH complex.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P16451
  source_id: P16451
- source: Alliance_Imported
  text: E3-binding protein of the mitochondrial pyruvate dehydrogenase complex; plays
    a structural role in the complex by binding and positioning dihydrolipoamide dehydrogenase
    (E3) to the dihydrolipoamide acetyltransferase (E2) core
  source_type: curated
  url: https://www.yeastgenome.org/locus/PDX1
  source_id: SGD:S000003425
- source: Alliance_Automated
  text: Enables structural molecule activity. Involved in pyruvate decarboxylation
    to acetyl-CoA. Located in mitochondrion. Part of pyruvate dehydrogenase complex.
    Human ortholog(s) of this gene implicated in pyruvate decarboxylase deficiency
    and sarcoma. Orthologous to human PDHX (pyruvate dehydrogenase complex component
    X).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PDX1
  source_id: SGD:S000003425
