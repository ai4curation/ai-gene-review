- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:2007123
  qualifier: enables
  review:
    summary: Protein X binds Lpd1 (E3) through its subunit-binding domain and docks it onto the Lat1 (E2) core;
      deleting the subunit-binding domain abolishes high-affinity E3 binding and PDH activity, and recombinant E3BP-E3
      reconstitutes a functional complex. This tethering is better captured by an adaptor term than by the generic
      structural molecule activity, and matches the treatment of human PDHX.
    action: NEW
    reason: Adds the informative MF for the non-catalytic E3-binding subunit.
    supported_by:
    - *id001
    - *id009
    - *id008
