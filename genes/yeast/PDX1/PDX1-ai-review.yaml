id: P16451
gene_symbol: PDX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PDX1 (YGR193C) encodes protein X (E3-binding protein, E3BP), a non-catalytic subunit of the mitochondrial
  matrix pyruvate dehydrogenase (PDH) complex and the yeast counterpart of human PDHX. It contains an N-terminal
  lipoyl domain followed by a peripheral subunit-binding domain, but no acetyltransferase catalytic domain. About
  12 Pdx1 molecules bind the 60-mer Lat1 (E2) core and tether 12 Lpd1 (E3) homodimers to it; the subunit-binding
  domain is essential for high-affinity E3 binding while the lipoyl domain is dispensable. pdx1 null cells are viable
  but their PDH complex lacks E3 and cannot oxidise pyruvate to acetyl-CoA, so Pdx1 is required for mitochondrial
  pyruvate decarboxylation.
