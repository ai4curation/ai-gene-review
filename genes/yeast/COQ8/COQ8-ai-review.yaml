gene_symbol: COQ8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  COQ8 (ABC1, YGL119W) encodes a mitochondrial UbiB-family protein kinase-like (PKL) protein required
  for coenzyme Q6 biosynthesis. Coq8 is imported and processed in mitochondria and associates peripherally
  with the matrix face of the inner membrane. coq8 null mutants lack CoQ and accumulate 3-hexaprenyl-4-hydroxybenzoate,
  and Coq8 overexpression stabilizes the CoQ synthome (Coq3-Coq7, Coq9) in other coq mutants. Coq8 was
  long considered a protein kinase because phosphorylation of Coq3, Coq5 and Coq7 depends on it. Purified
  Coq8, however, has no protein kinase activity in trans and autophosphorylates only in cis, in a way
  that is dispensable in vivo. It has an ADP-selective nucleotide pocket, ATPase activity that depends
  on its KxGQ motif, and binds membranes and lipid CoQ intermediates. How the ATPase and lipid-binding
  activities are coupled to synthome assembly and to the CoQ ring modifications is still unknown.
