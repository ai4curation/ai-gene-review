- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: IMP
  original_reference_id: PMID:22593570
  qualifier: enables
  review:
    summary: >-
      Xie et al. 2012 inferred protein kinase activity because kinase-motif mutations abolished the stabilizing
      effect of Coq8 overexpression. Those motifs form the nucleotide pocket that is also required for
      ATPase activity, and direct assays later showed Coq8 lacks trans protein kinase activity (PMID:27499294;
      NOT annotation from UniProt).
    action: REMOVE
    reason: >-
      Genuinely contradicted by later biochemistry on the same yeast protein; the phenotype is explained
      by loss of the ATPase/nucleotide-binding function rather than protein kinase activity.
    supported_by:
    - reference_id: PMID:22593570
      supporting_text: >-
        we provide evidence that the kinase activity is essential for the stabilizing effect of Coq8
