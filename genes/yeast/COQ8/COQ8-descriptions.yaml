descriptions:
- source: UniProt
  text: 'Atypical kinase involved in the biosynthesis of coenzyme Q, also named ubiquinone,
    an essential lipid-soluble electron transporter for aerobic cellular respiration
    (PubMed:27499294). Its substrate specificity is still unclear: may act as a protein
    kinase that mediates phosphorylation of COQ3, COQ5 and/or COQ7 (PubMed:11279158,
    PubMed:15063807, PubMed:1648478, PubMed:18801050, PubMed:19002377, PubMed:21296186,
    PubMed:25498144, PubMed:9210471, PubMed:9266513). According to other reports,
    acts as a small molecule kinase, possibly a lipid kinase that phosphorylates a
    prenyl lipid in the ubiquinone biosynthesis pathway, as suggested by its ability
    to bind coenzyme Q lipid intermediates (By similarity).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P27697
  source_id: P27697
- source: Alliance_Imported
  text: ATPase required for ubiquinone biosynthesis and respiratory growth; maintains
    levels of CoQ biosynthetic proteins; binds to CoQ biosynthesis intermediates;
    UbiB protein kinase-like family member that lacks canonical protein kinase activity;
    similar to prokaryotic proteins involved in ubiquinone biosynthesis; human homolog
    ADCK3 complements a coq8 null, is associated with CoQ and respiratory-chain deficiencies,
    and is mutated in autosomal-recessive cerebellar ataxia type 2
  source_type: curated
  url: https://www.yeastgenome.org/locus/COQ8
  source_id: SGD:S000003087
- source: Alliance_Automated
  text: Enables ATP hydrolysis activity; lipid binding activity; and protein kinase
    activity. Involved in phosphorylation and ubiquinone biosynthetic process. Located
    in mitochondrial inner membrane and mitochondrial matrix. Used to study coenzyme
    Q10 deficiency disease; nephrotic syndrome type 9; and primary coenzyme Q10 deficiency
    4. Human ortholog(s) of this gene implicated in nephrotic syndrome type 9 and
    primary coenzyme Q10 deficiency 4. Orthologous to human COQ8A (coenzyme Q8A) and
    COQ8B (coenzyme Q8B).
  source_type: automated
  url: https://www.yeastgenome.org/locus/COQ8
  source_id: SGD:S000003087
