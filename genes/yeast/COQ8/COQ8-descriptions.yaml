- source: Alliance_Automated
  text: Enables ATP hydrolysis activity; lipid binding activity; and protein kinase
    activity. Involved in phosphorylation and ubiquinone biosynthetic process. Located
    in mitochondrial inner membrane and mitochondrial matrix. Used to study coenzyme
    Q10 deficiency disease; nephrotic syndrome type 9; and primary coenzyme Q10 deficiency
    4. Human ortholog(s) of this gene implicated in nephrotic syndrome type 9 and
    primary coenzyme Q10 deficiency 4. Orthologous to human COQ8A (coenzyme Q8A) and
    COQ8B (coenzyme Q8B).
