id: P49017
gene_symbol: COQ5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: COQ5 (YML110C) encodes the SAM-dependent C-methyltransferase of coenzyme Q6 (ubiquinone)
  biosynthesis in Saccharomyces cerevisiae, a MenG/UbiE-family class I methyltransferase and the orthologue
  of E. coli UbiE and human COQ5. It catalyses the only C-methylation of the Q ring, converting 2-methoxy-6-hexaprenyl-1,4-benzoquinol
  (demethyl-demethoxy-Q6H2, DDMQ6H2) to 2-methoxy-5-methyl-6-hexaprenyl-1,4-benzoquinol (demethoxy-Q6H2,
  DMQ6H2; EC 2.1.1.201). Coq5 is imported into mitochondria via an N-terminal presequence and is peripherally
  associated with the matrix face of the inner membrane, where it assembles with Coq3, Coq4, Coq6, Coq7
  and Coq9 in the multi-subunit CoQ synthome. Besides its catalytic role, the Coq5 polypeptide is needed
  structurally to stabilise Coq3 and Coq4. coq5 null mutants lack Q6, are respiration deficient and cannot
  grow on non-fermentable carbon sources.
