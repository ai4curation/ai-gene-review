suggested_questions:
- question: How does the Coq5 polypeptide stabilise Coq3 and Coq4 independently of its catalytic activity
    (coq5-2/coq5-5 catalytic mutants retain them, the null does not), and which interface in the CoQ synthome
    is responsible?
suggested_experiments:
- description: Map Coq5 contacts within the CoQ synthome (crosslinking-MS or cryo-EM of the Coq4-centred
    complex) and test whether catalytically dead Coq5 suffices to stabilise Coq3/Coq4 in coq5 null cells.
