descriptions:
- source: UniProt
  text: Methyltransferase required for the conversion of 2- hexaprenyl-6-methoxy-1,4-benzoquinol
    (DDMQH2) to 2-hexaprenyl-3-methyl- 6-methoxy-1,4-benzoquinol (DMQH2).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P49017
  source_id: P49017
- source: Alliance_Imported
  text: 2-hexaprenyl-6-methoxy-1,4-benzoquinone methyltransferase; involved in ubiquinone
    (Coenzyme Q) biosynthesis; localizes to the matrix face of the mitochondrial inner
    membrane in a large complex with other ubiquinone biosynthetic enzymes; respiratory
    defect of the null mutant is partially complemented by human COQ5
  source_type: curated
  url: https://www.yeastgenome.org/locus/COQ5
  source_id: SGD:S000004578
- source: Alliance_Automated
  text: Enables 2-methoxy-6-polyprenyl-1,4-benzoquinol methyltransferase activity.
    Involved in aerobic respiration; methylation; and ubiquinone biosynthetic process.
    Located in mitochondrial inner membrane and mitochondrial matrix. Used to study
    coenzyme Q10 deficiency disease. Human ortholog(s) of this gene implicated in
    primary coenzyme Q10 deficiency 9. Orthologous to human COQ5 (coenzyme Q5, methyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/COQ5
  source_id: SGD:S000004578
