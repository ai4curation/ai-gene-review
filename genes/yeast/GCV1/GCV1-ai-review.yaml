taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Aminomethyltransferase (glycine cleavage system T-protein, EC 2.1.2.10) of Saccharomyces cerevisiae.
  Gcv1 is the T subunit of the mitochondrial glycine decarboxylase complex (P, H, T and L proteins: Gcv2, Gcv3,
  Gcv1 and Lpd1). It accepts the aminomethyl group carried on the lipoyl arm of the H-protein and transfers the
  methylene unit to tetrahydrofolate, releasing ammonia and forming 5,10-methylenetetrahydrofolate. Glycine cleavage
  lets yeast use glycine as sole nitrogen source and supplies mitochondrial one-carbon units; GCV1 expression is
  induced by glycine and responds to the cytoplasmic level of 5,10-methylenetetrahydrofolate.'
