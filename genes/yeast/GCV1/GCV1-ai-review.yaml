  label: Saccharomyces cerevisiae S288C
description: 'Aminomethyltransferase (glycine cleavage system T-protein, EC 2.1.2.10) of Saccharomyces cerevisiae.
  Gcv1 is a mitochondrial subunit of the glycine decarboxylase complex (P, H, T and L proteins: Gcv2, Gcv3, Gcv1,
  Lpd1). It takes the aminomethyl group from the lipoylated H-protein and transfers the methylene unit to tetrahydrofolate,
  releasing ammonia and producing 5,10-methylene-THF. Glycine cleavage lets yeast use glycine as sole nitrogen source
  and is a major supplier of mitochondrial one-carbon units; GCV1 expression is strongly induced by glycine and
  responds to cytoplasmic 5,10-methylene-THF levels.'
