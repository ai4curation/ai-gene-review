core_functions:
- description: 'T-protein of the mitochondrial glycine cleavage system: transfers the aminomethyl group carried
    on the lipoyl arm of the H-protein (Gcv3) to tetrahydrofolate, releasing NH3 and forming 5,10-methylene-THF
    (EC 2.1.2.10), a major source of mitochondrial one-carbon units.'
  molecular_function:
    id: GO:0004047
    label: aminomethyltransferase activity
  directly_involved_in:
  - id: GO:0019464
    label: glycine decarboxylation via glycine cleavage system
  - id: GO:0006730
    label: one-carbon metabolic process
  locations:
  - id: GO:0005739
    label: mitochondrion
  in_complex:
    id: GO:0005960
    label: glycine cleavage complex
  supported_by:
  - reference_id: PMID:9047339
    supporting_text: We have isolated the gene encoding the glycine cleavage T-protein (GCV1) of the yeast Saccharomyces
      cerevisiae and shown through gene disruption and enzyme assays that inactivation of GCV1 destroys glycine
      cleavage function.
  - reference_id: file:yeast/GCV1/GCV1-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=N(6)-[(R)-S(8)-aminomethyldihydrolipoyl]-L-lysyl-[protein] + (6S)-5,6,7,8-tetrahydrofolate
      = N(6)-[(R)-dihydrolipoyl]-L-lysyl- [protein] + (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate + NH4(+);
  - reference_id: PMID:10871621
    supporting_text: We also propose that under normal conditions, cytoplasmic 5,10-CH(2)-H(4)folate is mainly directed
      to generating methyl groups via methionine, whereas one-carbon units generated from glycine in mitochondria
      are more directed to purine biosynthesis.
suggested_questions:
- question: How is the flux of glycine-derived one-carbon units from mitochondria (via GCS) partitioned between
    mitochondrial formate production and direct use, and does Gcv1 abundance limit it?
suggested_experiments:
- description: Measure aminomethyltransferase activity of purified Gcv1 with lipoylated aminomethyl-Gcv3 and tetrahydrofolate,
    and determine its sub-mitochondrial (matrix) localisation by protease protection of isolated mitochondria.
