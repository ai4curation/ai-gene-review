core_functions:
- description: 'T-protein of the mitochondrial glycine cleavage system: transfers the aminomethyl group carried
    on the lipoyl arm of the H-protein (Gcv3) to tetrahydrofolate, releasing NH3 and forming 5,10-methylene-THF
    (EC 2.1.2.10), a major source of mitochondrial one-carbon units.'
