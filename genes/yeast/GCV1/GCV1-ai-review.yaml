  review:
    summary: YeastPathways RCA (GLYCLEAV-PWY) asserts activity in the cytosol, which is the default compartment
      used by the YeastPathways-to-GO-CAM conversion. The glycine cleavage system of S. cerevisiae is mitochondrial;
      Gcv1 carries a mitochondrial presequence and is found in purified mitochondria. There is no evidence for a
      cytosolic glycine cleavage activity.
    action: REMOVE
    reason: Default-compartment artefact of the YeastPathways conversion; Gcv1 is mitochondrial.
