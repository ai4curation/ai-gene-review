- source: Alliance_Automated
  text: Enables FMN binding activity and pyridoxamine phosphate oxidase activity.
    Predicted to be involved in pyridoxal 5'-phosphate biosynthetic process. Located
    in mitochondrial intermembrane space. Human ortholog(s) of this gene implicated
    in pyridoxamine 5'-phosphate oxidase deficiency. Orthologous to human PNPO (pyridoxamine
    5'-phosphate oxidase).
