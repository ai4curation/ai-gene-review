suggested_questions:
- question: Is Pdx3 exclusively in the mitochondrial intermembrane space, or is there a cytosolic pool, and how
    is PLP made in the IMS exported to cytosolic PLP-dependent enzymes?
suggested_experiments:
- description: Determine Pdx3 sub-cellular distribution by fractionation and protease protection with tagged and
    untagged protein, and test whether a cytosol-targeted Pdx3 rescues pyridoxine utilisation in pdx3 cells.
