  label: Saccharomyces cerevisiae S288C
description: Pdx3p is the pyridoxine/pyridoxamine 5'-phosphate oxidase (PNPOx; EC 1.4.3.5) of Saccharomyces cerevisiae,
  an FMN-containing homodimeric flavoenzyme that oxidizes pyridoxine 5'-phosphate and pyridoxamine 5'-phosphate
  to the cofactor pyridoxal 5'-phosphate (PLP), with production of hydrogen peroxide. It is the oxidase step of
  the vitamin B6 salvage pathway, acting after the kinase Bud16p; de novo PLP is made separately by the Snz1/Sno1
  synthase. pdx3 mutants lack PNP/PMP oxidase activity, cannot use pyridoxine as a B6 source, and show pleiotropic
  defects in amino acid, heme, sterol and fatty acid metabolism that follow from PLP shortage. Recombinant Pdx3p
  binds FMN and is catalytically active, whereas the distantly related yeast proteins Ylr456w and Ypr172w, which
  share only the N-terminal PNPOx domain, are inactive. Pdx3p has been detected in the mitochondrial intermembrane
  space.
