taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Cobalamin-independent methionine synthase (MetE; 5-methyltetrahydropteroyltriglutamate-homocysteine
  S-methyltransferase, EC 2.1.1.14) of Saccharomyces cerevisiae. Met6 transfers the methyl group of 5-methyltetrahydropteroyl
  tri-L-glutamate to L-homocysteine, forming L-methionine; this is the final step of de novo methionine synthesis
  and the remethylation step of the S-adenosylmethionine (methyl) cycle. Yeast has no cobalamin-dependent MetH,
  so Met6 is the only methionine synthase and met6 mutants are methionine auxotrophs. Met6 is a zinc-dependent,
  very abundant cytoplasmic enzyme.
