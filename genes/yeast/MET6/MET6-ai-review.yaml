- term:
    id: GO:0008705
    label: methionine synthase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT3G03780
  - AGI_LocusCode:AT5G17920
  - AGI_LocusCode:AT5G20980
  - PANTHER:PTN008412101
  - UniProtKB:C8V8J7
  - UniProtKB:P25665
  review:
    summary: PAINT IBA assigning 'methionine synthase activity' (GO:0008705, defined on the monoglutamate 5-methyltetrahydrofolate
      reaction, EC 2.1.1.13, i.e. the cobalamin-dependent MetH reaction). Met6 is a cobalamin-independent MetE (EC
      2.1.1.14), which uses the triglutamate form of 5-methyltetrahydrofolate; S. cerevisiae has no MetH. The precise
      term is GO:0003871.
    action: MODIFY
    reason: MetE family should carry the EC 2.1.1.14 term, not the EC 2.1.1.13 term.
    proposed_replacement_terms:
    - id: GO:0003871
      label: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
    supported_by:
    - reference_id: file:yeast/MET6/MET6-uniprot.txt
      supporting_text: Reaction=5-methyltetrahydropteroyltri-L-glutamate + L-homocysteine =
    - reference_id: file:yeast/MET6/MET6-uniprot.txt
      supporting_text: 'SIMILARITY: Belongs to the vitamin-B12 independent methionine synthase'
    - reference_id: file:yeast/MET6/MET6-uniprot.txt
      supporting_text: 'pathway; L-methionine from L-homocysteine (MetE route): step 1/1.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      residue_claims_not_applicable: The issue is which EC reaction (2.1.1.13 monoglutamate/MetH vs 2.1.1.14 triglutamate/MetE)
        the term denotes, not a residue gain or loss.
