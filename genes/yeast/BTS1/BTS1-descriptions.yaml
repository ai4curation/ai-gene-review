gene_symbol: BTS1
organism: yeast
uniprot_id: Q12051
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the trans-addition of the 3 molecules of IPP onto DMAPP to form
    geranylgeranyl pyrophosphate. Required for the membrane attachment of YPT1 and
    SEC4. May be involved in vesicle trafficking and protein sorting.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12051
  source_id: Q12051
- source: Alliance_Imported
  text: Geranylgeranyl diphosphate synthase (GGPPS); increases the intracellular pool
    of geranylgeranyl diphosphate, suppressor of bet2 mutation that causes defective
    geranylgeranylation of small GTP-binding proteins that mediate vesicular traffic
  source_type: curated
  url: https://www.yeastgenome.org/locus/BTS1
  source_id: SGD:S000005990
- source: Alliance_Automated
  text: Enables geranylgeranyl diphosphate synthase activity. Involved in geranylgeranyl
    diphosphate biosynthetic process. Is active in mitochondrion. Human ortholog(s)
    of this gene implicated in sensorineural hearing loss. Orthologous to human GGPS1
    (geranylgeranyl diphosphate synthase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BTS1
  source_id: SGD:S000005990
