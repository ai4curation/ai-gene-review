findings:
- category: discrepancy
  text: UniProt describes the reaction as three IPP additions onto DMAPP; the review
    marks the DMAPP and FPP synthase annotations as over-annotations and says the
    physiological reaction uses FPP made by Erg20p.
  sources:
  - UniProt
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All agree on GGPP synthase; UniProt alone frames the reaction as
    starting from DMAPP.
