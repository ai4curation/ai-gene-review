gene_symbol: BTS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: BTS1 encodes geranylgeranyl diphosphate (GGPP) synthase, a type III trans-prenyltransferase of the
  FPP/GGPP synthase family (PTHR12001). It adds one isopentenyl diphosphate to (2E,6E)-farnesyl diphosphate to form
  (2E,6E,10E)-GGPP (EC 2.5.1.29), using Mg2+-coordinated aspartate-rich motifs; Km values are reported for FPP (3.2
  uM) and IPP (0.8 uM). GGPP is the lipid donor for the type I and type II protein geranylgeranyltransferases, which
  modify Rho and Rab GTPases such as Ypt1 and Sec4 and so anchor them to membranes. BTS1 was isolated as a multicopy
  suppressor of bet2-1, a mutation in the beta subunit of Rab geranylgeranyltransferase, and suppresses it by enlarging
  the cellular GGPP pool. BTS1 is not essential, but its disruption reduces geranylgeranylation of many proteins
  and makes cells cold-sensitive. Crystal structures of yeast GGPPS with bisphosphonates show separate FPP, IPP
  and GGPP product binding sites. The upstream FPP is made by the essential FPP synthase Erg20p.
