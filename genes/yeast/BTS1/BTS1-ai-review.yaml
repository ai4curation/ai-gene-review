    summary: YeastPathways RCA from HEXPPSYN-PWY-2 (hexaprenyl diphosphate biosynthesis), which places the Bts1p
      GGPPS reaction upstream of Coq1p hexaprenyl diphosphate synthase. There is no evidence that bts1 mutants are
      coenzyme Q deficient (they are viable, cold-sensitive and defective in protein geranylgeranylation), and the
      allylic primer used by Coq1p in vivo is not established; FPP from Erg20p is generally considered the primer
      for long-chain trans-prenyl synthases. Even if GGPP were a primer, Bts1p would be supplying a precursor rather
      than performing a step of ubiquinone synthesis. Superpathway inflation.
