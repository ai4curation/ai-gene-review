suggested_questions:
- question: Does Bts1p-derived GGPP contribute to any mitochondrial process (e.g. as a primer for Coq1p hexaprenyl
    diphosphate synthesis), or is the GFP-based mitochondrial localisation an artefact?
- question: Is the cold-sensitive growth of bts1 null cells solely due to under-geranylgeranylation of Rab/Rho GTPases?
suggested_experiments:
- hypothesis: Bts1p does not contribute to coenzyme Q6 side-chain synthesis
  description: Measure CoQ6 content and 13C-IPP incorporation into CoQ6 in bts1 null versus wild-type cells (with
    and without ERG20 knockdown) by LC-MS/MS.
  experiment_type: lipidomics / isotope labelling
