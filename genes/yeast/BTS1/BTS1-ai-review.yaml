core_functions:
- description: 'Geranylgeranyl diphosphate synthase: condenses isopentenyl diphosphate with (2E,6E)-farnesyl diphosphate
    to make (2E,6E,10E)-geranylgeranyl diphosphate (GGPP). This GGPP is the lipid donor that geranylgeranyltransferases
    I and II attach to Rho and Rab GTPases (e.g. Ypt1, Sec4) in the cytoplasm.'
