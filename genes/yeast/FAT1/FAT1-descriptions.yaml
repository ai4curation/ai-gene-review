descriptions:
- source: UniProt
  text: Acyl-CoA synthetase required for both the import of long chain fatty acids
    (LCFAs) (C14-C18) and the activation very long chain fatty acids (VLCFAs) (C20-C26)
    by esterification of the fatty acids into metabolically active CoA-thioesters
    for subsequent degradation or incorporation into phospholipids (PubMed:11330068,
    PubMed:12052836, PubMed:12601005, PubMed:9079682, PubMed:9988704). The transport
    and fatty acyl-CoA synthetase activities are genetically separable and are thus
    independent activities (PubMed:12052836). Esterifies VLCFAs in the peroxisome
    matrix. The VLCFAs are actively transported into peroxisomes by a PXA1-PXA2 heterodimeric
    transporter in the peroxisomal membrane (PubMed:22493507).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38225
  source_id: P38225
- source: Alliance_Imported
  text: Very long chain fatty acyl-CoA synthetase and fatty acid transporter; activates
    imported fatty acids with a preference for very long lengths (C20-C26); has a
    separate function in the transport of long chain fatty acids
  source_type: curated
  url: https://www.yeastgenome.org/locus/FAT1
  source_id: SGD:S000000245
- source: Alliance_Automated
  text: Enables long-chain fatty acid transmembrane transporter activity and very
    long-chain fatty acid-CoA ligase activity. Involved in long-chain fatty acid import
    into cell; protein quality control for misfolded or incompletely synthesized proteins;
    and very long-chain fatty acid metabolic process. Located in several cellular
    components, including cytoplasmic side of plasma membrane; lipid droplet; and
    peroxisomal membrane. Human ortholog(s) of this gene implicated in ichthyosis.
    Orthologous to several human genes including SLC27A1 (solute carrier family 27
    member 1); SLC27A2 (solute carrier family 27 member 2); and SLC27A3 (solute carrier
    family 27 member 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FAT1
  source_id: SGD:S000000245
