id: P38225
gene_symbol: FAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FAT1 (YBR041W) encodes the yeast member of the fatty acid transport protein (FATP/SLC27) family, a
  dual-function membrane protein with very long-chain acyl-CoA synthetase activity (VLCS) and a separable role in
  uptake of exogenous long-chain fatty acids. Fat1p provides most cellular C24-acyl-CoA synthetase activity, and
  fat1 deletion strains accumulate C22-C26 very long-chain fatty acids in phospholipids and sphingolipids. In peroxisomes
  Fat1p (with Faa2p) re-esterifies very long-chain fatty acids released by the Pxa1p/Pxa2p ABC transporter on the
  matrix side of the peroxisomal membrane, enabling their beta-oxidation. At the plasma membrane Fat1p has an N(in)-C(in)
  topology with its catalytic motifs facing the cytosol and forms a complex with the long-chain acyl-CoA synthetases
  Faa1p or Faa4p that couples fatty acid import to activation (vectorial acylation); fat1 mutants are impaired in
  long-chain fatty acid uptake and grow poorly under hypoxia or when fatty acid synthesis is blocked. Fat1p is also
  found on lipid droplets and in the ER. Loss of Fat1p alters membrane saturation and secondarily impairs ER protein
  quality control.
