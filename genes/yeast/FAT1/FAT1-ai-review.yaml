core_functions:
- description: Very long-chain (C20-C26) fatty acid-CoA ligase providing most cellular C24-CoA synthetase activity;
    maintains VLCFA homeostasis and re-esterifies VLCFAs delivered by Pxa1p/Pxa2p on the matrix side of the peroxisomal
    membrane for beta-oxidation.
  molecular_function:
    id: GO:0031957
    label: very long-chain fatty acid-CoA ligase activity
  directly_involved_in:
  - id: GO:0000038
    label: very long-chain fatty acid metabolic process
  locations:
  - id: GO:0005778
    label: peroxisomal membrane
  - id: GO:0005783
    label: endoplasmic reticulum
  - id: GO:0005811
    label: lipid droplet
  supported_by:
  - reference_id: PMID:9988704
    supporting_text: Fat1p accounts for approximately 90% of the C24-specific acyl-CoA synthetase activity in glucose-grown
      cells
  - reference_id: PMID:9660783
    supporting_text: Disruption of this gene decreased, but did not abolish, cellular VLCS activity
  - reference_id: PMID:9660783
    supporting_text: FAT1 deletion strains grown on either dextrose or oleic acid medium accumulated very long-chain
      fatty acids
  - reference_id: PMID:22493507
    supporting_text: The Pxa1p-Pxa2p complex functionally interacts with the acyl-CoA synthetases Faa2p and/or Fat1p
      on the inner surface of the peroxisomal membrane for subsequent re-esterification of the VLCFAs
  - reference_id: PMID:9660783
    supporting_text: revealed that VLCS activity was associated with peroxisomes and microsomes but not mitochondria
- description: Required, in a complex with Faa1p or Faa4p at the plasma membrane, for uptake of exogenous long-chain
    fatty acids (vectorial acylation); this transport function is genetically separable from VLCS activity, but
    whether Fat1p itself translocates fatty acids is unresolved.
  molecular_function:
    id: GO:0005324
    label: long-chain fatty acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:0044539
    label: long-chain fatty acid import into cell
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:9079682
    supporting_text: These data support the hypothesis that Fat1p is involved in long-chain fatty acid uptake and
      may represent a long-chain fatty acid transport protein
  - reference_id: PMID:10880966
    supporting_text: have a greatly diminished capacity to transport exogenous long-chain fatty acids, and have
      very long-chain acyl CoA synthetase activities that were 40% wild-type
  - reference_id: PMID:15699031
    supporting_text: is required for both the import of long-chain fatty acids and the activation of very long-chain
      fatty acids; these activities intrinsic to Fat1p are separable functions
  - reference_id: PMID:12601005
    supporting_text: fatty acid import by vectorial acylation in yeast requires a multiprotein complex, which consists
      of Fat1p and Faa1p or Faa4p
  - reference_id: PMID:17679730
    supporting_text: The N(in)-C(in) topology results in the placement of the ATP/AMP and FATP/VLACS domains of
      Fat1p on the inner face of the plasma membrane
suggested_questions:
- question: Does Fat1p directly translocate long-chain fatty acids across the plasma membrane, or does it promote
    uptake only by metabolic trapping together with Faa1p/Faa4p?
- question: How is Fat1p distributed between plasma membrane, ER, lipid droplets and peroxisomal membrane, and what
    targets it to each compartment?
suggested_experiments:
- hypothesis: Fat1p mediates fatty acid translocation independently of acyl-CoA synthesis.
  description: Reconstitute purified wild-type and ligase-dead (ATP/AMP motif) Fat1p in proteoliposomes and measure
    flip-flop/translocation of fluorescent long-chain fatty acids with and without ATP/CoA.
