gene_symbol: NRE1
organism: yeast
uniprot_id: P40579
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Benzil oxidoreductase that reduces benzil stereospecifically to (S)-benzoin
    (PubMed:37602278). Is able to use both NADH and NADPH as cosubstrates, but shows
    a preference for NADPH (PubMed:37602278).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40579
  source_id: P40579
- source: Alliance_Imported
  text: Benzil oxidoreductase with preference for NADPH; localizes to the cytoplasm;
    sequence similarity with short-chain dehydrogenase/reductases; putative paralog
    of IRC24
  source_type: curated
  url: https://www.yeastgenome.org/locus/NRE1
  source_id: SGD:S000001474
- source: Alliance_Automated
  text: Enables oxidoreductase activity, acting on the CH-OH group of donors, NAD
    or NADP as acceptor. Located in cytoplasm. Human ortholog(s) of this gene implicated
    in several diseases, including cortisone reductase deficiency (multiple); dystonia
    (multiple); heart disease; hypertension (multiple); and type 2 diabetes mellitus.
    Orthologous to several human genes including HSD11B1 (hydroxysteroid 11-beta dehydrogenase
    1) and SPR (sepiapterin reductase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NRE1
  source_id: SGD:S000001474
