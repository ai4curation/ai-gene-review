gene_symbol: NRE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NRE1 (YIR035C) encodes a cytoplasmic classical short-chain dehydrogenase/reductase 
  (SDR) of 254 residues, the paralog of the adjacent gene IRC24 (52% identity). Crystal structures 
  (PDB 3KZV, 6UHX) show a Rossmann-fold SDR with the conserved Ser-Tyr-Lys catalytic triad. Purified
  Nre1 reduces the xenobiotic diketone benzil with NADPH, and NADH about half as well, with kinetics
  similar to Irc24. Its physiological substrate and biological role are unknown.
