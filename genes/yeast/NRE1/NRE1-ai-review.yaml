- term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence_type: IDA
  original_reference_id: PMID:37602278
  qualifier: enables
  review:
    summary: Purified His-tagged Nre1 reduces benzil with NADPH (preferred) or NADH.
    action: MODIFY
    reason: The assay (NADPH-dependent reduction of the diketone benzil to the secondary alcohol 
      (S)-benzoin) is sound, but GO:0016616 is the EC 1.1.1.- grouping class and says only that some
      CH-OH/NAD(P) oxidoreduction occurs. The specific term GO:0102306 benzil reductase 
      [(S)-benzoin-forming] activity was obsoleted (go-ontology#30498) because benzil is not a 
      physiological substrate, and annotations were moved up to this grouping term. The reaction is,
      however, an instance of GO:0004090 carbonyl reductase (NADPH) activity (a secondary alcohol + 
      NADP+ = a ketone + NADPH + H+; EC 1.1.1.184, whose synonyms explicitly include xenobiotic 
      ketone reductase). GO already maps the sister EC 1.1.1.320 reaction RHEA:31891 
      (1-phenyl-1,2-propanedione) to GO:0004090. GO:0004090 is the informative term that respects 
      the obsoletion decision; no new benzil-specific term is warranted.
    proposed_replacement_terms:
    - &id002
      id: GO:0004090
      label: carbonyl reductase (NADPH) activity
    supported_by:
    - &id003
      reference_id: PMID:37602278
      supporting_text: Thus, Nre1p is a benzil reductase in vitro and likely paralog of Irc24p.
    - &id004
      reference_id: PMID:37602278
      supporting_text: Both enzymes were active with both coenzymes but showed a two-fold preference
        for NADPH
- term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028442
  - RHEA:25968
  review:
    summary: Combined IEA driven by RHEA:25968 mapped to the EC 1.1.1.- grouping class.
    action: MODIFY
    reason: 'This IEA is generated from the RHEA:25968 narrowMatch xref on the grouping class GO:0016616,
      which was added when GO:0102306 was obsoleted. It is not wrong, but it is uninformative; a RHEA
      reaction mapped to an EC-incomplete grouping class yields annotations that say nothing about substrate
      class. Replace with GO:0004090 (and fix the xref upstream: RHEA:25968 should be a narrowMatch of
      GO:0004090, as its sister reaction RHEA:31891 already is).'
    proposed_replacement_terms:
    - *id002
    supported_by:
    - reference_id: PMID:11796169
      supporting_text: Recombinant B. cereus benzil reductase produced optically pure
