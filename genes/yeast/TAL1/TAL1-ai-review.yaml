  label: Saccharomyces cerevisiae S288C
description: Tal1 (YLR354C) is the major transaldolase (EC 2.2.1.2) of Saccharomyces cerevisiae, a class I (Schiff-base) aldolase-type
  enzyme of the non-oxidative pentose phosphate pathway. It reversibly transfers a dihydroxyacetone unit from sedoheptulose
  7-phosphate to D-glyceraldehyde 3-phosphate, yielding D-erythrose 4-phosphate and D-fructose 6-phosphate, and so links pentose-phosphate
  metabolism with glycolysis in both directions. Lys144 is essential for catalysis. tal1 deletion mutants lack detectable
  transaldolase activity in extracts and accumulate sedoheptulose 7-phosphate but grow normally on rich and synthetic media.
  Tal1 is an abundant cytosolic protein, predicted to be homodimeric by similarity.
