descriptions:
- source: UniProt
  text: Transaldolase involved in the non-oxidative phase in the pentose phosphate
    pathway. Catalyzes the reversible conversion of sedoheptulose-7-phosphate and
    D-glyceraldehyde 3-phosphate into erythrose-4-phosphate and beta-D-fructose 6-phosphate.
    Transaldolase is important for the balance of metabolites in the pentose-phosphate
    pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P15019
  source_id: P15019
- source: Alliance_Imported
  text: Transaldolase, enzyme in the non-oxidative pentose phosphate pathway; converts
    sedoheptulose 7-phosphate and glyceraldehyde 3-phosphate to erythrose 4-phosphate
    and fructose 6-phosphate; TAL1 has a paralog, NQM1, that arose from the whole
    genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TAL1
  source_id: SGD:S000004346
- source: Alliance_Automated
  text: Enables transaldolase activity. Involved in pentose-phosphate shunt. Located
    in nucleus. Human ortholog(s) of this gene implicated in carbohydrate metabolic
    disorder. Orthologous to human TALDO1 (transaldolase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TAL1
  source_id: SGD:S000004346
