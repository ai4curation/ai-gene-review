id: P00924
gene_symbol: ENO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ENO1 encodes enolase 1 of Saccharomyces cerevisiae, one of two highly similar enolase isozymes
  (phosphopyruvate hydratase, EC 4.2.1.11). The Mg2+-dependent enzyme reversibly dehydrates 2-phospho-D-glycerate
  to phosphoenolpyruvate, a step shared by glycolysis and gluconeogenesis. Eno1 and Eno2 polypeptides
  assemble at random into three active dimers (Eno1-Eno1, Eno1-Eno2 and Eno2-Eno2). ENO1 is non-essential;
  it is a minor isozyme in glucose-grown cells but present at levels similar to ENO2 during growth on
  non-fermentable carbon sources. Enolase is predominantly cytosolic, but small pools associate with vacuoles,
  where enolase stimulates homotypic vacuole fusion independently of its catalytic activity, and with
  the mitochondrial surface.
