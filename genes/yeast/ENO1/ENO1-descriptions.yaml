descriptions:
- source: Alliance_Imported
  text: Enolase I, a phosphopyruvate hydratase; catalyzes conversion of 2-phosphoglycerate
    to phosphoenolpyruvate during glycolysis and the reverse reaction during gluconeogenesis;
    expression repressed in response to glucose; protein abundance increases in response
    to DNA replication stress; N-terminally propionylated in vivo; ENO1 has a paralog,
    ENO2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ENO1
  source_id: SGD:S000003486
- source: Alliance_Automated
  text: Enables melatonin binding activity and phosphopyruvate hydratase activity.
    Involved in glycolytic process and regulation of vacuole fusion, non-autophagic.
    Located in fungal-type vacuole and mitochondrion. Part of phosphopyruvate hydratase
    complex. Human ortholog(s) of this gene implicated in Alzheimer's disease; glycogen
    storage disease XIII; and prostate cancer. Orthologous to human ENO1 (enolase
    1); ENO2 (enolase 2); and ENO3 (enolase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ENO1
  source_id: SGD:S000003486
