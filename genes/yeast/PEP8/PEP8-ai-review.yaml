      and saturably (KD about 19 µM). Mutating the YYL motif abolishes saturable binding. Deleting or
      phosphomimicking loop 6 raises the affinity about four-fold, and Mih1 dephosphorylates this loop
      (PMID:28362258).
    action: MODIFY
    reason: 'The evidence for direct cargo-signal recognition is good and supports a cargo-recognition
      function for Pep8. But GO:0038024 cargo receptor activity is defined for receptors that span membranes
      and bind both cargo and coat adaptors ("Cargo receptors span membranes"). Pep8 is a peripheral membrane
      subunit of a coat (PMID:7926738), and the transmembrane receptor in this pathway is Vps10. The activity
      Pep8 contributes to is GO:0140312 cargo adaptor activity: binding cargo signals on one side and
      the coat scaffold (Vps35) and SNX-BAR membrane-deformation machinery on the other. This is a lateral
      correction of the term type, not a refinement. The adaptor activity is executed by the cargo-selective
      complex as a whole, so it is best recorded with contributes_to, as the PAINT rows do for Vps29 and
      Vps35.'
    proposed_replacement_terms:
    - id: GO:0140312
      label: cargo adaptor activity
    supported_by:
    - reference_id: PMID:28362258
      supporting_text: We show that Vps26 directly recognizes a retromer sorting signal and that the phosphorylation
        state of Vps26, controlled by Mih1, modulates the affinity of retromer for the Chs3 recycling
        signal.
    - reference_id: PMID:28362258
      supporting_text: Binding of Vps26 to GST-Chs3(1-52) is saturable, with an estimated equilibrium
        dissociation constant, KD, of 19 μM (Figure 6D).
    - reference_id: PMID:7926738
      supporting_text: Biochemical fractionation indicated that the protein was peripherally bound to
        membranes.
    - reference_id: PMID:11598206
      supporting_text: These domain swap experiments have shown that Vps26p promotes the interactions
        between the cargo-selective component Vps35p and the structural components Vps5p/Vps17p.
