core_functions:
- description: Arrestin-fold subunit of the retromer cargo-selective complex (Vps35-Vps26-Vps29). With
    Vps35 it recognises sorting signals in transmembrane cargo, such as the Chs3 YYL motif, and it couples
    the trimer to the Vps5-Vps17 SNX-BAR layer of the endosomal coat. This allows retrieval of Vps10 and
    late-Golgi proteins from the prevacuolar endosome to the trans-Golgi network.
  contributes_to_molecular_function:
    id: GO:0140312
    label: cargo adaptor activity
  directly_involved_in:
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  locations:
  - id: GO:0010008
    label: endosome membrane
  in_complex:
    id: GO:0030906
    label: retromer, cargo-selective complex
  supported_by:
  - reference_id: PMID:28362258
    supporting_text: We show that Vps26 directly recognizes a retromer sorting signal and that the phosphorylation
      state of Vps26, controlled by Mih1, modulates the affinity of retromer for the Chs3 recycling signal.
  - reference_id: PMID:11598206
    supporting_text: These domain swap experiments have shown that Vps26p promotes the interactions between
      the cargo-selective component Vps35p and the structural components Vps5p/Vps17p.
  - reference_id: PMID:9700157
    supporting_text: In vps26Δ cells ∼90% of Vps10p is found in the vacuole-enriched P13.
  - reference_id: PMID:22593205
    supporting_text: GFP-tagged forms of Vps35 and Vps26 (unpublished data) localize predominantly to punctate
      endosomes
- description: Subunit of the CROP complex, in which the Vps26-Vps29-Vps35 trimer binds the PROPPIN Atg18.
    CROP concentrates Atg18 at foci on the vacuole membrane, tunes its lipid preference toward PI(3,5)P2
    and potentiates its membrane fission activity. CROP is required for vacuole fission under hyperosmotic
    stress. No process term is given, because GO:0140572 vacuole fission has no annotations in S. cerevisiae
    (see suggested questions).
  in_complex:
    id: GO:0170071
    label: CROP complex
  supported_by:
  - reference_id: PMID:35466426
    supporting_text: Thus, both CSC and Atg18 are required for vacuole fission.
  - reference_id: PMID:35466426
    supporting_text: This suggests that the integration of Atg18 into CROP potentiates its membrane fission
      activity
  - reference_id: PMID:35466426
    supporting_text: Also, three proteins from the retromer complex (Vps26, Vps35, and Vps29) bound Atg18
      more strongly upon triggering vacuole fission.
suggested_questions:
- question: Should CROP subunits (Atg18 and the Vps26-Vps29-Vps35 trimer) be annotated to GO:0140572 vacuole
    fission? The trimer is required for salt-induced vacuole fragmentation in vivo and potentiates Atg18
    fission in vitro, yet no S. cerevisiae gene carries the term, and Atg18 carries only membrane fission.
- question: Which Vps26 residues contact the Chs3 YYL signal, and do they overlap with the Snx3- and Vps5-binding
    site that the cryo-ET structure places on the same face of Vps26?
- question: Does Mih1-regulated phosphorylation of Vps26 loop 6 also change binding to Vps10, or is the
    gate specific to plasma-membrane recycling cargo such as Chs3?
- question: How is Vps26 shared between the SNX-BAR retromer, Snx3-retromer and the CROP or Atg21-retromer
    assemblies in vivo, given that PROPPINs and SNX-BARs compete for the trimer?
suggested_experiments:
- description: Map the Chs3-binding surface of Vps26 by crosslinking mass spectrometry or a cryo-EM structure
    of trimer bound to a Chs3(1-52) peptide, then test interface mutants for Chs3 and Vps10 sorting in
    vivo.
- description: Measure Vps26 loop 6 phosphorylation across growth and stress conditions by targeted phosphoproteomics,
    and identify the kinase, to learn what signal Mih1 gating responds to.
- description: Quantify the endosomal versus vacuolar distribution of endogenously tagged Vps26 by correlative
    light and electron microscopy in wild type, vps17Δ and atg18Δ atg21Δ cells, to separate the retromer
    and CROP pools.
