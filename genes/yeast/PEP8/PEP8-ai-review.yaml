- term:
    id: GO:0032456
    label: endosome to plasma membrane transport
  evidence_type: NAS
  original_reference_id: PMID:9700157
  qualifier: involved_in
  review:
    summary: ComplexPortal statement for the yeast retromer complex (CPX-1653), citing Seaman et al. 1998
      and propagated to all five subunits. GO:0032456 was renamed from 'endocytic recycling' (now a narrow
      synonym, still the label on the UniProt record) to 'endosome to plasma membrane transport', and
      is defined as the movement of vesicles from endosomes back to the plasma membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Retromer, with Pep8, is required to keep some endocytosed plasma-membrane proteins at the
      surface: Ftr1 recycling needs Snx3 and the pentameric retromer, and Chs3 export from the endosome
      is retromer-dependent, with Pep8 binding the Chs3 recycling signal directly (PMID:17420293, PMID:28362258).
      In yeast these cargoes return through the Golgi for resecretion, so retromer carriers go from the
      endosome to the Golgi, not to the plasma membrane; retromer''s own step, retrograde transport from
      endosome to Golgi, is accepted on other rows. The cited paper concerns Vps10 retrieval and makes
      no statement about plasma-membrane recycling. The term goes beyond what retromer does in yeast and
      is marked over-annotated, not removed, because the recycling requirement is real. The same call,
      and the same query to ComplexPortal, is made on the matching row of every retromer subunit, since
      all five rows come from one complex-level statement.'
    supported_by:
    - reference_id: PMID:17420293
      supporting_text: Fet3p-Ftr1p is maintained on the plasma membrane via an endocytic recycling pathway
        requiring the sorting nexin Grd19/Snx3p, the pentameric retromer complex, and the Ypt6p Golgi
        Rab GTPase module.
    - reference_id: PMID:17420293
      supporting_text: After export from the endosome, Fet3p-Ftr1p transits through the Golgi apparatus
        for resecretion.
    - reference_id: PMID:28362258
      supporting_text: These results indicate that Chs3 is exported from the endosome via a retromer-dependent
        recycling pathway.
    source_defects:
    - defect_type: WRONG_TERM
      resource: COMPLEX_PORTAL
      record: CPX-1653
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0032456 endosome to plasma membrane transport (NAS, PMID:9700157)
      cause: SCOPE_OVER_REACH
      confidence: SUSPECTED
      explanation: The S. cerevisiae retromer complex CPX-1653 carries GO:0032456 endosome to plasma membrane
        transport (NAS, PMID:9700157), propagated to all five subunits (Vps35, Vps26/Pep8, Vps29, Vps5,
        Vps17). The full text of PMID:9700157 (cached) discusses endosome-to-Golgi retrieval and has no
        statement on transport to the plasma membrane. In yeast, the retromer-dependent recycling route
        for plasma membrane proteins passes through the Golgi (PMID:17420293), so retromer carriers go
        to the Golgi rather than to the plasma membrane; the process may have been carried over from metazoan
