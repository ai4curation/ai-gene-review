  review:
    summary: Genome-wide GFP-fusion localisation screen (Tkach et al. 2012) scored Pep8-GFP at the vacuole
      membrane. Pep8 is not discussed in the main text; the call is in the supplementary data.
    action: KEEP_AS_NON_CORE
    reason: Independent evidence supports a vacuole-membrane pool of Pep8. Immunogold EM placed Pep8 on
      vacuolar membranes (PMID:7926738), Vps26 puncta partly overlap with Atg18 on the vacuole membrane
      in the CROP complex (PMID:35466426), and retromer retrieves Vps10 from vacuoles (PMID:25512334).
      At steady state in wild-type cells, however, most Vps26-GFP is on punctate endosomes, and the strong
      vacuole-membrane signal appears when the SNX-BARs are missing (PMID:22593205). The location is real
      but secondary to the endosome, where retromer does most of its work.
