id: P40335
gene_symbol: PEP8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Pep8 (also called Vps26) is the arrestin-fold subunit of the Saccharomyces cerevisiae
  retromer cargo-selective complex, a Vps35-Vps26-Vps29 trimer. In budding yeast this trimer associates
  with the SNX-BAR heterodimer Vps5-Vps17 to form the pentameric retromer coat on endosomes. Pep8 is
  a peripheral membrane protein that binds the N-terminal region of Vps35 through a conserved Vps35
  motif. It stabilises Vps35 and depends on Vps35 to reach membranes. Pep8 promotes the association
  of the trimer with Vps5-Vps17, and in the assembled coat Vps26 dimers form the base of the Vps35 arches
  and contact the membrane-proximal sorting nexin layer. Purified Pep8 binds the YYL recycling signal
  of the chitin synthase Chs3 directly. The affinity of this binding is tuned by phosphorylation of
  an arrestin-like loop that the CDC25-family phosphatase Mih1 removes. Retromer returns the carboxypeptidase
  Y receptor Vps10 and late-Golgi membrane proteins from the prevacuolar endosome to the trans-Golgi
  network. It also recycles endocytosed plasma-membrane proteins such as Ftr1 and Chs3, which go back
  to the cell surface by way of the Golgi. Cells lacking Pep8 are viable but missort Vps10 to the vacuole
  and secrete carboxypeptidase Y. With Vps35 and Vps29, Pep8 also binds the PROPPINs Atg18 and Atg21.
  The Atg18-containing CROP complex drives vacuole fission under hyperosmotic stress. The trimer binds
  GTP-loaded Ypt7 (Rab7), which links endosomal recycling to fusion with the vacuole.
