  label: Saccharomyces cerevisiae S288C
description: CDC19 (PYK1) encodes pyruvate kinase 1, the major pyruvate kinase of Saccharomyces cerevisiae.
  The homotetrameric cytosolic enzyme transfers the phosphoryl group of phosphoenolpyruvate to ADP, producing
  pyruvate and ATP in the final, irreversible step of glycolysis. Cdc19 requires Mg2+ and K+, is allosterically
  activated by fructose-1,6-bisphosphate, and is further stimulated by PKA phosphorylation; it is highly
  expressed during fermentative growth, whereas its paralog Pyk2 contributes only a minor activity. Loss
  of Cdc19 prevents growth on glucose and other fermentable sugars, and reduced pyruvate kinase flux causes
  PEP accumulation that feeds back on triosephosphate isomerase and shifts flux into the pentose phosphate
  pathway. Pyk1 has also been reported as a component of the SESAME metabolic-enzyme complex associated
  with histone H3T11 phosphorylation.
