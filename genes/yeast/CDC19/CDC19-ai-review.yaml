  review:
    summary: 'NAS from the SESAME paper (abstract only). Links between pyruvate kinase and oxidative stress
      arise indirectly: reduced PK activity raises PEP, which inhibits TPI and diverts flux into the pentose
      phosphate pathway. This is a metabolic consequence of glycolytic flux, not a dedicated stress-response
      role of Cdc19.'
