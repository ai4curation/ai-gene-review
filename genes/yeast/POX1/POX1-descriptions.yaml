descriptions:
- source: Alliance_Imported
  text: Fatty-acyl coenzyme A oxidase; involved in the fatty acid beta-oxidation pathway;
    localized to the peroxisomal matrix; component of a light sensing pathway, converting
    light into a hydrogen peroxide signal, modulating nucleo-cytoplasmic shuttling
    of stress-responsive transcription factor, Msn2p
  source_type: curated
  url: https://www.yeastgenome.org/locus/POX1
  source_id: SGD:S000003173
- source: Alliance_Automated
  text: Predicted to enable acyl-CoA oxidase activity; fatty acid binding activity;
    and flavin adenine dinucleotide binding activity. Involved in fatty acid beta-oxidation.
    Located in peroxisomal matrix. Human ortholog(s) of this gene implicated in Mitchell
    syndrome; congenital bile acid synthesis defect 6; and peroxisomal acyl-CoA oxidase
    deficiency. Orthologous to several human genes including ACOX1 (acyl-CoA oxidase
    1).
  source_type: automated
