  text: Predicted to enable acyl-CoA oxidase activity; fatty acid binding activity;
    and flavin adenine dinucleotide binding activity. Involved in fatty acid beta-oxidation.
    Located in peroxisomal matrix. Human ortholog(s) of this gene implicated in Mitchell
    syndrome; congenital bile acid synthesis defect 6; and peroxisomal acyl-CoA oxidase
    deficiency. Orthologous to several human genes including ACOX1 (acyl-CoA oxidase
    1).
