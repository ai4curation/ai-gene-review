gene_symbol: POX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: POX1 (FOX1) encodes acyl-CoA oxidase (EC 1.3.3.6), the first enzyme of peroxisomal fatty acid beta-oxidation
  in Saccharomyces cerevisiae and the only acyl-CoA oxidase gene in this yeast. The FAD-containing enzyme oxidises
  a 2,3-saturated acyl-CoA with molecular oxygen to the trans-2-enoyl-CoA, and the hydrogen peroxide produced is
  removed by peroxisomal catalase. Pox1p is a homo-oligomeric matrix protein. It lacks both PTS1 and PTS2 signals
  and is imported into peroxisomes by direct binding of an internal region to the N-terminal part of the receptor
  Pex5p. POX1 transcription is strongly induced by oleate, and disruption impairs growth on fatty acids as the sole
  carbon source.
