core_functions:
- description: FAD-dependent acyl-CoA oxidase that catalyses the first, O2-dependent desaturation step (acyl-CoA
    -> trans-2-enoyl-CoA + H2O2) of peroxisomal fatty acid beta-oxidation. It is the only acyl-CoA oxidase in S.
    cerevisiae and is located in the peroxisomal matrix.
