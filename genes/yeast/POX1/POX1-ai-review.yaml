suggested_questions:
- question: What is the chain-length specificity of S. cerevisiae Pox1p, given that it is the only acyl-CoA oxidase
    and must handle all straight-chain substrates entering beta-oxidation?
suggested_experiments:
- hypothesis: Pox1p has broad acyl-CoA chain-length specificity that covers the whole beta-oxidation spiral
  description: Purify recombinant Pox1p and measure kinetic parameters with saturated and unsaturated acyl-CoAs
    of C4 to C22 using an H2O2-coupled assay.
  experiment_type: enzyme kinetics
