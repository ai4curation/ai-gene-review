core_functions:
- description: SAM-dependent C-24 methylation of zymosterol to fecosterol (EC 2.1.1.41), the step that
    adds the C-28 methyl group of ergosterol; active on lipid droplets and in the ER.
  molecular_function:
    id: GO:0003838
    label: sterol 24-C-methyltransferase activity
  directly_involved_in:
  - id: GO:0006696
    label: ergosterol biosynthetic process
  locations:
  - id: GO:0005811
    label: lipid droplet
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:6363386
    supporting_text: 'Various nystatin-resistant mutants defective in S-adenosylmethionine: delta 24-sterol-C-methyltransferase
      (EC 2.1.1.41) were shown to possess alleles of the same gene, erg6.'
  - reference_id: PMID:18563465
    supporting_text: Photolabeling and site-directed mutagenesis were performed on recombinant Saccharomyces
      cerevisiae 24-C-sterol methyltransferase (SMT) to elucidate the location and role of active site
      residues involved in AdoMet binding and catalysis.
  - reference_id: PMID:10515935
    supporting_text: This is very likely for Erg6p ( 27 ) and Erg7p ( 4a ), which are enzymatically active
      in lipid particle preparations.
  - reference_id: PMID:11298754
    supporting_text: several enzymes involved in ergosterol biosynthesis, namely squalene synthase (Erg9p),
      squalene epoxidase (Erg1p) and steroldelta24-methyltransferase (Erg6p), are highly enriched in PAM.
suggested_questions:
- question: Is the lipid-droplet pool of Erg6 the main site of zymosterol methylation in vivo, or is the
    ER pool (where downstream Erg2/Erg3/Erg5/Erg4 act) the physiologically dominant one?
suggested_experiments:
- description: Anchor Erg6 exclusively to the ER or to lipid droplets (e.g. with compartment-specific
    membrane anchors) and quantify fecosterol/ergosterol flux to test which pool supports ergosterol synthesis.
