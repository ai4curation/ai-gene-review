  evidence_type: EXP
  original_reference_id: PMID:6363386
  qualifier: located_in
  review:
    summary: McCammon et al. 1984 detected SMT activity in a mitochondrial fraction (as well as microsomes
      and the floating lipid layer), but note that the distribution between fractions depended on assay
      conditions. Later work shows Erg6 is mainly on lipid droplets with an ER pool; the mitochondrial
      signal is likely contact-site co-fractionation. The fractionation result is not disputed, but as
      a statement of Erg6's location it over-reaches.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:6363386
      supporting_text: 'Despite the single locus for erg6, S-adenosylmethionine: delta 24-sterol-C-methyltransferase
        enzyme activity was found in three separate fractions: mitochondria, microsomes, and the "floating
        lipid layer."'
    - reference_id: PMID:6363386
      supporting_text: The amount of activity in each fraction could be manipulated by assay conditions.
    - reference_id: PMID:9450962
      supporting_text: sterol Delta24-methyltransferase (Erg6p), an enzyme catalyzing a late step in sterol
        biosynthesis, was found mainly in lipid particles cofractionating with triacylglycerols and steryl
        esters.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:14576278
  qualifier: located_in
  review:
    summary: High-throughput mitochondrial proteomics (Sickmann et al. 2003 mitochondrial proteome) detected
      Erg6. Erg6 is an ER/lipid-droplet enzyme that is abundant and enriched in ER subdomains closely
      apposed to other organelles; detection in purified mitochondria most plausibly reflects ER/lipid-droplet
      co-purification at contact sites rather than a mitochondrial pool with a distinct function. Not
      wrong as a fractionation result, but an over-annotation of the protein's location.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:14576278
      supporting_text: The proteins of highly pure yeast mitochondria were separated by several independent
        methods and analyzed by tandem MS.
    - reference_id: PMID:9450962
