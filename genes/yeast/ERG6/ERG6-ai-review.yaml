id: P25087
gene_symbol: ERG6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG6 (YML008C) encodes S-adenosyl-L-methionine:Delta24-sterol C-methyltransferase (SMT, EC
  2.1.1.41) of Saccharomyces cerevisiae, which transfers a methyl group from SAM to C-24 of zymosterol
  to form fecosterol, introducing the C-28 methyl group that distinguishes ergosterol from cholesterol.
  Erg6 is a Rossmann-fold class I SAM-dependent methyltransferase with a sterol methyltransferase C-terminal
  domain; photoaffinity labelling of the recombinant enzyme defined its AdoMet-binding segment (residues
  120-134). Erg6 is a peripheral, monotopic protein that is found mainly on lipid droplets, where it is
  enzymatically active and is a standard lipid-droplet marker, with a smaller ER pool enriched in plasma-membrane-associated
  ER. erg6 null mutants make no ergosterol but grow vegetatively on unmethylated sterol intermediates;
  they show pleiotropic membrane defects including nystatin resistance, cycloheximide and drug hypersensitivity,
  poor transformation, defective mating and tryptophan uptake.
