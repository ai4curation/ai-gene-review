descriptions:
- source: UniProt
  text: Involved in the import of activated long-chain fatty acids from the cytosol
    to the peroxisomal matrix (PubMed:8670886). Also plays a role in the peroxisomal
    uptake of ATP (PubMed:35127709).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41909
  source_id: P41909
- source: Alliance_Imported
  text: Subunit of heterodimeric peroxisomal ABC transport complex, with Pxa2p; required
    for import of long-chain fatty acids into peroxisomes; similar to human adrenoleukodystrophy
    transporters ABCD1and ABCD2, and ALD-related proteins; mutations in ABCD1 cause
    X-linked adrenoleukodystrophy (X-ALD), a peroxisomal disorder; human ABCD1 and
    ABCD2 can each partially complement yeast pxa1 pxa2 double null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/PXA1
  source_id: SGD:S000006068
- source: Alliance_Automated
  text: Enables ATPase-coupled transmembrane transporter activity and long-chain fatty
    acid transmembrane transporter activity. Involved in fatty acid catabolic process;
    long-chain fatty acid import into peroxisome; and nucleobase-containing compound
    transport. Located in peroxisome. Part of ATP-binding activity cassette (ABC)
    transporter complex. Is active in peroxisomal membrane. Used to study adrenoleukodystrophy.
    Human ortholog(s) of this gene implicated in Zellweger syndrome; adrenoleukodystrophy;
    and congenital bile acid synthesis defect 5. Orthologous to several human genes
    including ABCD1 (ATP binding cassette subfamily D member 1) and ABCD2 (ATP binding
    cassette subfamily D member 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PXA1
  source_id: SGD:S000006068
