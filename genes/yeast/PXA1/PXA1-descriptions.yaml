- source: Alliance_Imported
  text: Subunit of heterodimeric peroxisomal ABC transport complex, with Pxa2p; required
    for import of long-chain fatty acids into peroxisomes; similar to human adrenoleukodystrophy
    transporters ABCD1and ABCD2, and ALD-related proteins; mutations in ABCD1 cause
    X-linked adrenoleukodystrophy (X-ALD), a peroxisomal disorder; human ABCD1 and
    ABCD2 can each partially complement yeast pxa1 pxa2 double null mutant
