id: P41909
gene_symbol: PXA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PXA1 (also PAT2/SSH2) encodes one of the two peroxisomal ABC half-transporters of S. cerevisiae.
  Pxa1p and Pxa2p are the two half ATP-binding-cassette transporters of the ABCD (ALDP/PMP70) family in
  the S. cerevisiae peroxisomal membrane; they heterodimerise to form a full transporter that imports
  long-chain and very long-chain acyl groups from the cytosolic acyl-CoA pool into the peroxisome, the
  only site of fatty acid beta-oxidation in yeast. The complex hydrolyses the acyl-CoA during transport
  and translocates the fatty acid moiety, which is re-esterified to CoA on the luminal side by the acyl-CoA
  synthetases Faa2p and/or Fat1p; medium-chain fatty acids instead enter as free acids and are activated
  by Faa2p. pxa mutants fail to oxidise oleate and other long-chain fatty acids and grow poorly on oleate,
  but have normal peroxisomes. The pxa1 pxa2 defect is partly complemented by human ABCD1 or ABCD2 acting
  as homodimers. Pxa1p-Pxa2p also mediates unidirectional ATP uptake into peroxisomes, alongside the Ant1p
  and Aac2p nucleotide carriers. Pxa1p is unstable in the absence of Pxa2p.
