suggested_questions:
- question: Is the acyl-CoA thioesterase step intrinsic to the Pxa1p-Pxa2p transporter (as in PMID:22493507),
    and should GO describe the activity as fatty-acyl-CoA transport (GO:0015607) or as fatty acid transport
    coupled to acyl-CoA hydrolysis?
suggested_experiments:
- description: Reconstitute purified Pxa1p-Pxa2p in proteoliposomes with labelled acyl-CoA (CoA and acyl
    moieties separately labelled) to determine which moiety is translocated and whether ATP hydrolysis
    is coupled to thioester cleavage.
