id: P38169
gene_symbol: BNA4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Bna4 (YBL098W) is the kynurenine 3-monooxygenase (KMO; EC 1.14.13.9) of Saccharomyces cerevisiae, an
  FAD-dependent aromatic-ring hydroxylase anchored in the mitochondrial outer membrane. It hydroxylates L-kynurenine
  to 3-hydroxy-L-kynurenine using NADPH and O2, a step of the kynurenine pathway that leads via Bna5 and Bna1 to
  quinolinate for de novo NAD+ synthesis. bna4 deletion abolishes 3-hydroxykynurenine and quinolinate production
  and suppresses huntingtin toxicity in yeast models. Crystal structures of yeast KMO with bound FAD and inhibitors
  show that some inhibitors uncouple NADPH oxidation to produce hydrogen peroxide. Bna4 has also been detected in
  peroxisome proteomes.
