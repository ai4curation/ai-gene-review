gene_symbol: BNA4
organism: yeast
uniprot_id: P38169
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the hydroxylation of L-kynurenine (L-Kyn) to form 3-hydroxy-L-kynurenine
    (L-3OHKyn). Required for synthesis of quinolinic acid.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38169
  source_id: P38169
- source: Alliance_Imported
  text: Kynurenine 3-monooxygenase; required for the de novo biosynthesis of NAD from
    tryptophan via kynurenine; expression regulated by Hst1p; localizes to mitochondria
    and peroxisomes; putative therapeutic target for Huntington disease
  source_type: curated
  url: https://www.yeastgenome.org/locus/BNA4
  source_id: SGD:S000000194
- source: Alliance_Automated
  text: Enables FAD binding activity; NAD(P)H oxidase H2O2-forming activity; and kynurenine
    3-monooxygenase activity. Involved in 'de novo' NAD+ biosynthetic process from
    L-tryptophan. Located in peroxisome. Orthologous to human KMO (kynurenine 3-monooxygenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BNA4
  source_id: SGD:S000000194
