descriptions:
- source: UniProt
  text: Key enzyme in the regulation of glycerol uptake and metabolism. Catalyzes
    the phosphorylation of glycerol to yield sn- glycerol 3-phosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32190
  source_id: P32190
- source: Alliance_Imported
  text: Glycerol kinase; converts glycerol to glycerol-3-phosphate; glucose repression
    of expression is mediated by Adr1p and Ino2p-Ino4p; derepression of expression
    on non-fermentable carbon sources is mediated by Opi1p and Rsf1p
  source_type: curated
  url: https://www.yeastgenome.org/locus/GUT1
  source_id: SGD:S000001024
- source: Alliance_Automated
  text: Enables glycerol kinase activity. Involved in glycerol metabolic process.
    Located in mitochondrion. Human ortholog(s) of this gene implicated in glycerol
    kinase deficiency. Orthologous to several human genes including GK2 (glycerol
    kinase 2) and GK3 (glycerol kinase 3).
