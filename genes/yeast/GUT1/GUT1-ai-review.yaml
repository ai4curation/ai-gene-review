suggested_questions:
- question: Is the mitochondrial import of Gut1p seen in vitro physiologically significant, e.g. coupling
    glycerol phosphorylation to Gut2p at the inner membrane?
- question: What is the functional meaning of the Gut1p-Gpp2p association (prevention of a glycerol <->
    G3P futile cycle)?
suggested_experiments:
- description: Quantify the cytosolic versus mitochondrial pools of endogenously tagged Gut1p on glycerol
    medium by fractionation with protease protection, and test growth on glycerol of a cytosol-restricted
    Gut1p.
references:
- id: file:yeast/GUT1/GUT1-deep-research-sgd.md
  title: SGD gene description for GUT1 (yeast)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: SGD curated description (uncited, undated). Checked claims. Glycerol kinase converting
      glycerol to glycerol-3-phosphate holds (PMID:8358828). The regulators named are right, but their
      roles are swapped. Adr1 and Ino2-Ino4 are activators that bind UAS elements and drive most GUT1
      expression on glycerol, and Opi1 is a repressor (PMID:10536147); Rsf1 is needed for normal GUT1
      transcript levels on glycerol (PMID:12734673). The text says glucose repression is mediated by
      Adr1 and Ino2-Ino4 and derepression by Opi1 and Rsf1, recorded as a wrong statement. The regulators
      are now in the review description; they regulate the gene and are not annotated as Gut1 functions.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: SGD
      record: SGD:S000001024
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: glucose repression of expression is mediated by Adr1p and Ino2p-Ino4p; derepression
        of expression on non-fermentable carbon sources is mediated by Opi1p and Rsf1p
      confidence: CONFIRMED
      explanation: The SGD description says "glucose repression of expression is mediated by Adr1p and
        Ino2p-Ino4p; derepression of expression on non-fermentable carbon sources is mediated by Opi1p
        and Rsf1p". The promoter study (PMID:10536147) shows the opposite assignment for three of the four
        factors. Adr1 and Ino2/Ino4 bind UAS(ADR1) and UAS(INO), which together give about 90% of GUT1
        expression on glycerol, so they mediate derepressed (activated) expression; Opi1 represses the
        GUT1 promoter. Rsf1 is required for normal GUT1 transcript levels on glycerol (PMID:12734673).
        Suggested wording is that GUT1 expression on non-fermentable carbon sources is activated by Adr1,
        Ino2-Ino4 and Rsf1 and repressed by Opi1.
      supported_by:
      - reference_id: PMID:10536147
        supporting_text: two upstream activation sequences, UAS(INO) and UAS(ADR1), are responsible for
          approximately 90% of the expression during growth on glycerol
      - reference_id: PMID:10536147
        supporting_text: The negative regulator Opi1p mediates repression of the GUT1 promoter
      - reference_id: PMID:12734673
        supporting_text: In that mutant, transcript levels from GUT1 and GUT2 are highly attenuated compared
          with those of the wild-type parent when both are grown on glycerol-based medium.
- id: PMID:10536147
  title: Expression of GUT1, which encodes glycerol kinase in Saccharomyces cerevisiae, is controlled
    by the positive regulators Adr1p, Ino2p and Ino4p and the negative regulator Opi1p in a carbon source-dependent
    fashion.
  findings:
  - statement: Adr1 and Ino2/Ino4 activate GUT1 on non-fermentable carbon sources via UAS elements; Opi1
      represses it.
    supporting_text: In vitro experiments showed Adr1 and Ino2/Ino4 protein-dependent binding to UAS(ADR1)
      and UAS(INO).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed abstract (cached). Defines GUT1 promoter regulation.
- id: PMID:12734673
  title: Rsf1p, a protein required for respiratory growth of Saccharomyces cerevisiae.
  findings:
  - statement: rsf1 deletion strongly lowers GUT1 and GUT2 transcripts on glycerol.
    supporting_text: In that mutant, transcript levels from GUT1 and GUT2 are highly attenuated compared
      with those of the wild-type parent when both are grown on glycerol-based medium.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed abstract (cached). Supports Rsf1 as a positive factor for GUT1 expression.
