gene_symbol: GUT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Gut1p is the glycerol kinase (EC 2.7.1.30) of S. cerevisiae, an FGGY-family carbohydrate
  kinase that phosphorylates glycerol with ATP to sn-glycerol 3-phosphate. This is the first step of the
  phosphorylative glycerol utilisation pathway, in which mitochondrial Gut2p then oxidises glycerol 3-phosphate
  to DHAP. GUT1 is glucose-repressed and, on non-fermentable carbon sources, activated through promoter
  elements bound by Adr1 and by Ino2-Ino4, repressed by Opi1, and dependent on the respiration factor Rsf1; gut1 disruptants have
  no glycerol kinase activity and cannot grow on glycerol, but grow normally on glucose or ethanol. Gut1p
  is mainly cytosolic, with evidence for import of a fraction into mitochondria. Gut1p reproducibly co-purifies
  with the glycerol-3-phosphatase Gpp2p in proteome-wide interaction screens.
