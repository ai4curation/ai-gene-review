id: P41800
gene_symbol: MMM1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Mmm1 (maintenance of mitochondrial morphology 1; YLL006W) is the ER-anchored subunit of the
  ER-mitochondria encounter structure (ERMES), the fungal tethering and lipid-transfer complex that bridges
  the endoplasmic reticulum and the mitochondrial outer membrane. Mmm1 is a single-pass integral ER membrane
  protein with an N-glycosylated lumenal N-terminus and a cytosolic C-terminal synaptotagmin-like mitochondrial
  lipid-binding protein (SMP) domain. The SMP domain dimerizes and binds two Mdm12 molecules to form an
  Mmm1-Mdm12 heterotetramer containing a continuous hydrophobic channel that binds glycerophospholipids;
  together with the mitochondrial subunits Mdm12, Mdm34 and Mdm10 it forms bridge-like assemblies, about
  25 per contact site, clustered in a few foci per cell. The Mmm1-Mdm12 complex is the minimal unit that
  transfers phospholipids between membranes in vitro, and ERMES supports phosphatidylserine transport
  from the ER to mitochondria and ER-mitochondria lipid exchange in vivo. Mmm1 artificially anchored to
  mitochondria, with an intact lipid-binding domain, can sustain ERMES function even when all four core
  ERMES genes are deleted, and native ER-anchored Mmm1 can act as the sole lipid transporter with an artificial
  tether provided Mdm10 is present. Loss of Mmm1 causes collapse of the tubular mitochondrial network
  into giant spheres, loss of mtDNA nucleoids, reduced cardiolipin and impaired respiratory growth; these
  phenotypes are largely secondary to loss of ER-mitochondria tethering and lipid supply, since they are
  bypassed by dominant VPS13 alleles or an artificial tether. Mmm1 has also been implicated, with Mdm12,
  in a late step of mitochondrial outer membrane beta-barrel protein assembly.
