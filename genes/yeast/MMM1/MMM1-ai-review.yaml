- term:
    id: GO:0140474
    label: mitochondrion-endoplasmic reticulum membrane tether activity
  evidence_type: IDA
  original_reference_id: PMID:19556461
  qualifier: enables
  review:
    summary: Mitochondrion-ER membrane tether activity for MMM1, from the synthetic-tether (ChiMERA) complementation
      screen that defined ERMES.
    action: ACCEPT
    reason: Kornmann et al. 2009 showed that the Mmm1/Mdm10/Mdm12/Mdm34 complex physically links the ER
      and the mitochondrial outer membrane and that its loss is partly bypassed by an artificial ER-mitochondria
      tether. Mmm1 is the ER-membrane anchor of the bridge; it relocalizes to the ER when any other subunit
      is missing. The MF term describes the activity of the assembled bridge, and each subunit contributes
      a physically necessary part of it (ER anchor, OM anchor, or the SMP-domain bridge), so the annotation
      is accepted for every core subunit. GO:1990456 (the former BP for this tethering) was obsoleted
      in favour of this MF term (verified in QuickGO).
    supported_by:
    - reference_id: PMID:19556461
      supporting_text: Thus, one core molecular function of the Mmm1/Mdm10/Mdm12/Mdm34 complex is to connect
        ER and mitochondria, which can be bypassed by expressing a synthetic tether.
    - reference_id: PMID:19556461
      supporting_text: ERMES consists of the ER-resident membrane protein Mmm1 and the OMM-resident β-barrel
        protein Mdm10
