  review:
    summary: Phospholipid transport (IGI) for MMM1.
    action: ACCEPT
    reason: 'ERMES mediates non-vesicular phospholipid transfer from the ER to mitochondria: ERMES mutants
      show a two- to fivefold reduction in PS-to-PC conversion, isolated membranes lacking Mmm1, Mdm12
      or Mdm34 are defective in PS transport from ER to mitochondria, the purified Mmm1-Mdm12 complex
      transfers phospholipids between liposomes, and in vivo mass-tagging (METALIC) shows ERMES transport
      activity in living cells. An earlier in vivo radiolabelling study (Nguyen et al. 2012, PMID:22409400)
      found PS-to-PE conversion unaffected in ERMES mutants; this is now generally explained by redundant
      routes (Vps13-Mcp1 at vacuole-mitochondria contacts) rather than by absence of ERMES transfer activity. '
    supported_by:
