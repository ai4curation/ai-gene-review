suggested_questions:
- question: Should the mitochondrial outer membrane IDA row from Hobbs et al. 2001 be retired at SGD?
    The same paper is already used for an ER membrane EXP annotation, and Kornmann et al. 2009 explicitly
    identified the outer membrane assignment as a misannotation.
  experts:
  - SGD curators
- question: Is Mmm1's contribution to outer membrane beta-barrel (Tom40) assembly direct, or a secondary
    consequence of altered outer membrane lipid composition? Do VPS13 bypass alleles or an artificial
    tether restore beta-barrel assembly in mmm1 cells?
  experts:
  - Wiedemann lab
  - Endo lab
- question: Given that mitochondria-tethered Mmm1 alone can sustain ERMES function when Mdm10 is present
    (Covill-Cooke et al. 2026; mitochondria-anchored Mmm1 even complements the quadruple deletion), what
    is the minimal lipid-transfer unit in vivo, and are Mdm12 and Mdm34 transfer modules or primarily
    structural?
  experts:
  - Kornmann lab
  - Endo lab
- question: ERMES is inferred to have been present in the last opisthokont common ancestor and lost in
    the human lineage (Chen et al. 2026, PMID:42822426), with VPS13-family bridge proteins and other contact-site
    machinery likely covering ER-mitochondria lipid supply in animals. Which human proteins, if any, should
    receive the ERMES-equivalent function annotations, and should ERMES complex membership be explicitly
    excluded for human genes in phylogenetic propagation?
  experts:
  - PAINT curators
  - Kornmann lab
suggested_experiments:
- hypothesis: Mmm1-Mdm12 transfers phosphatidylserine directly from the ER to the outer membrane in vivo.
  description: Combine METALIC mass-tag lipid flux measurements with Mmm1 SMP-pocket point mutants (e.g.
    I369S/L274S equivalents) expressed at endogenous levels, in a vps13 bypass-free background.
  experiment_type: lipidomics
- hypothesis: The beta-barrel assembly defect of mmm1 mitochondria is secondary to lipid imbalance.
  description: Assay Tom40 and porin assembly in organello in mmm1 cells rescued by ChiMERA, VPS13 dominant
    alleles, or MCP1 overexpression.
  experiment_type: biochemical
