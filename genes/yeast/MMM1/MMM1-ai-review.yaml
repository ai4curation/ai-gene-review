- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IDA
  original_reference_id: PMID:11266455
  qualifier: located_in
  review:
    summary: Mitochondrial outer membrane, from GFP localization and fractionation (Hobbs et al. 2001),
      which predates the discovery that Mmm1 is an ER protein.
    action: REMOVE
    reason: 'This localization is directly contradicted by later, more discriminating experiments: Kornmann
      et al. 2009 showed that Mmm1 is N-glycosylated (requiring lumenal exposure of its N-terminus in
      the ER), that an ER-targeted TEV protease cleaves it, and that Mmm1-GFP relocalizes to peripheral
      and perinuclear ER when ERMES is disrupted; they explicitly state that Mmm1 had been misannotated
      as a mitochondrial protein, partly because of the TEV accessibility assay used in the earlier work.
      The punctate signal seen by Hobbs et al. is the ERMES focus at the ER-mitochondria interface. SGD
      already annotates ER membrane from the same paper (EXP), so removing the outer membrane row leaves
      the correct localization in place. This is a removal for genuine contradiction, made with the full
      text of both papers available.'
    supported_by:
    - reference_id: PMID:11266455
      supporting_text: We found that Mmm1p-GFP is located in small, punctate structures on the mitochondrial
        outer membrane, adjacent to a subset of matrix-localized mitochondrial DNA nucleoids.
    - reference_id: PMID:19556461
      supporting_text: indicating that Mmm1 is N-glycosylated and therefore is an integral ER membrane
        protein that was misannotated as a mitochondrial protein
    - reference_id: PMID:19556461
      supporting_text: We used the same assay with an ER-targeted TEV protease and confirmed Mmm1 ER-membrane
        insertion
- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: HDA
  original_reference_id: PMID:35563734
  qualifier: located_in
  review:
    summary: Peroxisome, from a high-throughput screen of strains overexpressing each protein from the
      TEF2 promoter in a peroxisome-marker background.
    action: MARK_AS_OVER_ANNOTATED
    reason: Mmm1 is an ER-resident ERMES subunit; nothing in the targeted literature places it in or on
      peroxisomes. The screen relied on strong constitutive overexpression, and overproduced Mmm1 is known
      to accumulate as free ER-resident protein (and to alter peroxisome abundance), so a peroxisome-adjacent
      signal is most plausibly an overexpression artefact or ER-peroxisome proximity. Mmm1 is not named
      in the cached text; the call rests on the screen's dataset. Not removed because ER-peroxisome and
      peroxisome-mitochondria contacts involving ERMES subunits are reported.
    supported_by:
    - reference_id: PMID:35563734
      supporting_text: we utilized a collection of strains containing a peroxisomal marker in which each
        protein is expressed from the constitutive and strong TEF2 promoter
    - reference_id: PMID:30908556
      supporting_text: Our results showed that deregulation of peroxisome abundance can only be observed
        when the Mmm1/Mdm12 stoichiometry is changed either because the Mdm12 protein is absent and the
        Mmm1/Mdm12 complex cannot be formed, or because Mmm1 is overproduced and free ER-resident Mmm1
        protein may accumulate.
