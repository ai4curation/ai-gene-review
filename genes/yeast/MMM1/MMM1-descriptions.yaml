descriptions:
- source: UniProt
  text: Component of the ERMES/MDM complex, which serves as a molecular tether to
    connect the endoplasmic reticulum and mitochondria (PubMed:19556461). Components
    of this complex are involved in the control of mitochondrial shape and protein
    biogenesis, and function in nonvesicular lipid trafficking between the ER and
    mitochondria (PubMed:27469264, PubMed:8089172, PubMed:9628893). The MDM12-MMM1
    subcomplex functions in the major beta-barrel assembly pathway that is responsible
    for biogenesis of all outer membrane beta-barrel proteins, and acts in a late
    step after the SAM complex. The MDM10-MDM12-MMM1 subcomplex further acts in the
    TOM40-specific pathway after the action of the MDM12-MMM1 complex (PubMed:17410204).
    Essential for establishing and maintaining the structure of mitochondria and maintenance
    of mtDNA nucleoids (PubMed:11266455, PubMed:12454062, PubMed:14981098).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41800
  source_id: P41800
- source: Alliance_Imported
  text: ER integral membrane protein, ERMES complex subunit; ERMES links the ER to
    mitochondria and may promote inter-organellar calcium and phospholipid exchange
    as well as coordinating mitochondrial DNA replication and growth; required for
    mitophagy; ERMES complex is often co-localized with peroxisomes and with concentrated
    areas of pyruvate dehydrogenase; localizes to the peroxisome in glucose
  source_type: curated
  url: https://www.yeastgenome.org/locus/MMM1
  source_id: SGD:S000003929
- source: Alliance_Automated
  text: Enables mitochondrion-endoplasmic reticulum membrane tether activity. Contributes
    to lipid transfer activity. Involved in aminophospholipid transport; mitochondrial
    outer membrane translocase complex assembly; and protein insertion into mitochondrial
    outer membrane. Acts upstream of or within phospholipid transport. Located in
    endoplasmic reticulum membrane and mitochondrial outer membrane. Part of ERMES
    complex. Is active in mitochondria-associated endoplasmic reticulum membrane contact
    site.
  source_type: automated
