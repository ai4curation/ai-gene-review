  label: Saccharomyces cerevisiae S288C
description: Uroporphyrinogen-III C-methyltransferase (Met1p, also MET20) catalyses the S-adenosyl-L-methionine-dependent
  methylation of uroporphyrinogen III at C2 and C7 to form precorrin-2, the first committed step of siroheme
  biosynthesis. The subsequent dehydrogenation and iron insertion are carried out by the bifunctional
  Met8p; in bacteria all three steps are fused in CysG. Siroheme is the prosthetic group of sulfite reductase,
  so met1 mutants cannot reduce sulfite and require methionine. Met1p carries a C-terminal CobA/CysG-type
  tetrapyrrole methylase domain and an N-terminal fungal-specific region of unknown function.
