gene_symbol: KGD4
organism: yeast
uniprot_id: P19955
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Molecular adapter that is necessary to a form a stable 2- oxoglutarate dehydrogenase
    enzyme complex (OGDC). Required for incorporation of the E3 subunit (LPD1) into
    the E1-E2 core (KGD1-KGD2) of mitochondrial OGDC, and acting as a stability factor
    for the fully assembled complex.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P19955
  source_id: P19955
- source: Alliance_Imported
  text: Subunit of the mitochondrial alpha-ketoglutarate dehydrogenase; recruits E3
    subunit (Lpd1p) to the E1-E2 (Kgd1p, Kgd2p) core; exists in two forms derived
    from a single mRNA translated from two alternative start sites; evolutionarily
    conserved role in the organization of mitochondrial α-KGDH complexes; homolog
    of human KGD4
  source_type: curated
  url: https://www.yeastgenome.org/locus/KGD4
  source_id: SGD:S000001945
- source: Alliance_Automated
  text: A structural constituent of ribosome. Contributes to oxoglutarate dehydrogenase
    (succinyl-transferring) activity. Involved in 2-oxoglutarate metabolic process
    and tricarboxylic acid cycle. Located in mitochondrial ribosome. Part of oxoglutarate
    dehydrogenase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/KGD4
  source_id: SGD:S000001945
fetch_date: '2026-11-01'
