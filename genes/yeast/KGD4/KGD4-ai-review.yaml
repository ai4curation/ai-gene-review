suggested_questions:
- question: Does the long, UUG-initiated Kgd4L isoform differ from Kgd4S in import, KGDH assembly or any
    non-KGDH role?
- question: Does Kgd4 also bridge E3 to other 2-oxoacid dehydrogenase complexes in yeast (e.g. the 2-oxoadipate
    route via Kgd1/Kgd2 in lysine degradation), or is it strictly OGDC-specific?
suggested_experiments:
- description: Cryo-EM of the yeast KGDH holo-complex with and without Kgd4 to map the Kgd4-Lpd1 and Kgd4-E1/E2
    interfaces and test the adaptor model at structural resolution.
  experiment_type: structural biology
