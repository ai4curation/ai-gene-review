id: P19955
gene_symbol: KGD4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: KGD4 (YMR31/YFR049W) encodes a small mitochondrial protein that is a dedicated, non-catalytic
  subunit of the 2-oxoglutarate (alpha-ketoglutarate) dehydrogenase complex (OGDC/KGDH) of the citric
  acid cycle. Kgd4 binds the E1-E2 core (Kgd1-Kgd2) through its C-terminal region and the E3 dihydrolipoyl
  dehydrogenase Lpd1 through its N-terminal region, acting as a molecular adaptor that recruits E3 to
  the core and stabilises the assembled complex; without Kgd4 the catalytic subunits are stable but E3
  dissociates and overall KGDH activity falls sharply. Kgd4 was first purified from mitochondrial small
  ribosomal subunit preparations (as YMR-31/MRPS36), but this assignment reflects co-sedimentation of
  the similarly sized, abundant KGDH complex. The protein is conserved in fungi and animals (human MRPS36/KGD4)
  and is absent from bacterial OGDH complexes. An alternative upstream UUG start codon produces a longer
  isoform (Kgd4L).
