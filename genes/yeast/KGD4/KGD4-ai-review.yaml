- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IDA
  original_reference_id: PMID:2693936
  qualifier: enables
  review:
    summary: YMR-31 was purified as a mitochondrial small-subunit ribosomal protein by Matsushita et al.
      1989 (N-terminal sequencing of a gradient-purified ribosomal fraction). Heublein et al. 2014 showed
      that Kgd4 co-purifies quantitatively with KGDH, not with ribosomal proteins, and that the KGDH complex
      co-sediments with and contaminates 28S ribosomal preparations. The ribosomal assignment is therefore
      contradicted by later direct evidence; UniProt also carries a CAUTION to this effect. Kgd4 is not
      a structural constituent of the mitoribosome.
    action: REMOVE
    reason: Contradicted by direct affinity-purification and gradient evidence (PMID:25165143) that the
      protein is a KGDH subunit and that its presence in mitoribosome preparations was contamination.
    supported_by:
    - reference_id: PMID:25165143
      supporting_text: A number of independent lines of evidence support the notion that Kgd4 is a structural
        subunit of the KGDH complex and not a subunit of the mitochondrial ribosome.
