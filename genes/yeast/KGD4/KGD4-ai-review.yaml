    summary: Location in the mitochondrial ribosome rests on the 1989 isolation of YMR-31 from ribosomal
      fractions. Heublein et al. 2014 show this reflects co-sedimentation of KGDH with the small ribosomal
      subunit; Kgd4 comigrates quantitatively with KGDH. The ribosome location is contradicted; the protein
      is a mitochondrial (matrix) KGDH subunit.
