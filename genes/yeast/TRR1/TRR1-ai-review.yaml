core_functions:
- description: Cytosolic NADPH-dependent FAD-containing thioredoxin reductase (EC 1.8.1.9; homodimer)
    that reduces Trx1 and Trx2, supplying electrons to thioredoxin-dependent peroxiredoxins (Tsa1, Gpx2,
    Hyr1), ribonucleotide reductase and PAPS reductase; a minor pool is in the mitochondrial IMS.
  molecular_function:
    id: GO:0004791
    label: thioredoxin-disulfide reductase (NADPH) activity
  directly_involved_in:
  - id: GO:0045454
    label: cell redox homeostasis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id004
  - *id009
  - *id003
suggested_questions:
- question: Does cytosolic Trr1 form heterodimers with its mitochondrial paralog Trr2 in vivo (as suggested
    by interactome data), and if so in which compartment?
- question: Is the iron binding reported for Trr1 physiologically relevant, and where would the metal
    bind on this flavoenzyme?
