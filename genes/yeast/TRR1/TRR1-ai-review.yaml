id: P29509
gene_symbol: TRR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TRR1 (YDR353W) encodes the cytoplasmic thioredoxin reductase, an FAD-containing, NADPH-dependent
  homodimeric flavoenzyme of the low-molecular-weight (bacterial-type) thioredoxin reductase family. Trr1
  reduces the cytosolic thioredoxins Trx1 and Trx2, which in turn provide electrons to thioredoxin-dependent
  peroxiredoxins such as Tsa1, to ribonucleotide reductase and to PAPS reductase in sulfate assimilation;
  it is therefore the central enzyme of the cytosolic thioredoxin system and is important for peroxide
  tolerance and cellular thiol-redox homeostasis. Trr1 is mainly cytosolic, with a minor pool in the mitochondrial
  intermembrane space. It interacts in a GTP-dependent manner with the Rho5 GTPase during H2O2-induced
  cell death and has been reported to bind iron.
