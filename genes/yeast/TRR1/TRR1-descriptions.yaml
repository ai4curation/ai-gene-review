descriptions:
- source: UniProt
  text: Central component in the thioredoxin system. Reduces thioredoxins 1 and 2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P29509
  source_id: P29509
- source: Alliance_Imported
  text: Cytoplasmic thioredoxin reductase; key regulatory enzyme that determines the
    redox state of the thioredoxin system, which acts as a disulfide reductase system
    and protects cells against both oxidative and reductive stress; protein abundance
    increases in response to DNA replication stress; TRR1 has a paralog, TRR2, that
    arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TRR1
  source_id: SGD:S000002761
- source: Alliance_Automated
  text: Enables ferrous iron binding activity and thioredoxin-disulfide reductase
    (NADPH) activity. Involved in cell redox homeostasis and cellular response to
    oxidative stress. Located in cytosol and mitochondrial intermembrane space. Orthologous
    to human AIFM3 (AIF family member 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TRR1
  source_id: SGD:S000002761
