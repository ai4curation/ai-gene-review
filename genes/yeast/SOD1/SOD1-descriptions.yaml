taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Destroys radicals which are normally produced within the cells and which are
    toxic to biological systems (PubMed:18948262). Catalyzes the oxidation of hydrogen
    sulfide (H2S) to sulfate, playing an important role in detoxifying H2S and limiting
    the accumulation of reactive sulfur species (RSS) such as persulfides and polysulfides
    (PubMed:36630448).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00445
  source_id: P00445
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Generic radical-destroying statement plus the recent H2S oxidation
      claim. Does not mention superoxide dismutation by name, copper/zinc, Ccs1, or
      the intermembrane-space and nuclear pools.
- source: Alliance_Imported
  text: Cytosolic copper-zinc superoxide dismutase; also sulfide oxidase; detoxifies
    superoxide and hydrogen sulfide; stabilizes Yck1p and Yck2p kinases in glucose
    to repress respiration; phosphorylated by Dun1p, enters nucleus under oxidative
    stress to promote transcription of stress response genes; abundance increases
    under DNA replication stress; localization to mitochondrial intermembrane space
    is modulated by MICOS complex; human ortholog SOD1 implicated in ALS complements
    a null allele
  source_type: curated
  url: https://www.yeastgenome.org/locus/SOD1
  source_id: SGD:S000003865
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 5
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 5
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and broad: Cu/Zn SOD, sulfide oxidase, Yck1/Yck2 stabilization,
      Dun1-dependent nuclear entry and IMS localization, all in the review. Does not
      mention Ccs1. The MICOS claim is not covered by the review.'
- source: Alliance_Automated
  text: Enables oxidoreductase activity, acting on a sulfur group of donors, oxygen
    as acceptor and superoxide dismutase activity. Involved in several processes,
    including intracellular monoatomic cation homeostasis; protein stabilization;
    and removal of superoxide radicals. Located in mitochondrial intermembrane space
    and nucleus. Part of superoxide dismutase complex. Is active in cytosol. Used
    to study amyotrophic lateral sclerosis. Human ortholog(s) of this gene implicated
    in several diseases, including artery disease (multiple); eye disease (multiple);
    glucose metabolism disease (multiple); liver disease (multiple); and neurodegenerative
    disease (multiple). Orthologous to human SOD1 (superoxide dismutase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SOD1
  source_id: SGD:S000003865
