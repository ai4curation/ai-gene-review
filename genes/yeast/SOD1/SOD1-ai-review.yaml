id: P00445
gene_symbol: SOD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SOD1 (YJR104C) encodes copper/zinc superoxide dismutase, an abundant homodimeric enzyme that
  converts superoxide radicals to hydrogen peroxide and oxygen. Each subunit binds one catalytic copper
  and one structural zinc ion; copper is inserted by the dedicated copper chaperone Ccs1 (Lys7), which
  forms a transient heterodimer with apo-Sod1. Sod1 is mainly cytosolic, with a small active fraction
  in the mitochondrial intermembrane space whose import depends on Ccs1, and a pool that relocates to
  the nucleus on oxidative stress. Loss of Sod1 causes oxygen sensitivity, aerobic lysine and methionine
  auxotrophy and oxidative damage. Beyond superoxide dismutation, Sod1 contributes to copper and zinc
  homeostasis, is required for Mac1-dependent copper-deficiency signalling, links oxygen and glucose to
  repression of respiration by stabilising the casein kinases Yck1/Yck2, and has been reported to oxidise
  hydrogen sulfide to sulfate.
