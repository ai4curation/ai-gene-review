    label: glutathione peroxidase activity
  evidence_type: IDA
  original_reference_id: PMID:19755417
  qualifier: enables
  review:
    summary: IDA citing Gutscher et al. 2009 (roGFP2-Orp1 redox relay). The paper characterises Orp1/Gpx3
      as an H2O2-scavenging peroxidase that relays oxidation to a proximal thiol protein; it describes
      Orp1 as a seleno-independent GPx-family member but its assays centre on H2O2-driven thiol oxidation
      rather than GSH as reductant. Hyr1/Gpx3 belongs to the GPx family and has measurable GSH-dependent
      peroxidase/PHGPx activity, but it functions physiologically as an atypical 2-Cys peroxiredoxin whose
      Cys36-Cys82 disulfide is reduced by thioredoxin (UniProt caution; Delaunay et al. 2002). GSH-dependent
      activity is therefore a real but secondary activity.
    action: KEEP_AS_NON_CORE
    supported_by:
