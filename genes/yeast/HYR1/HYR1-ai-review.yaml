gene_symbol: HYR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: HYR1 (GPX3/ORP1, YIR037W) encodes a cysteine-based (non-selenium) glutathione peroxidase-family
  protein that functions as an atypical 2-Cys peroxiredoxin. Its peroxidatic Cys36 is oxidised by hydrogen
  peroxide to a sulfenic acid that either forms an intramolecular disulfide with Cys82, which is reduced
  by thioredoxin, or forms a transient intermolecular disulfide with Cys598 of the transcription factor
  Yap1. Resolution of this mixed disulfide into the Yap1 Cys303-Cys598 disulfide traps Yap1 in the nucleus
  and activates oxidative-stress genes, so Hyr1/Gpx3 is the principal hydroperoxide sensor and redox transducer
  for the Yap1 response; thioredoxin switches the pathway off by reducing both proteins. Hyr1 also reduces
  H2O2 and phospholipid hydroperoxides directly (in vitro it shows GSH-dependent PHGPx activity, but thioredoxin
  is the physiological reductant), is constitutively expressed, and is the most important of the three
  yeast GPx paralogs for peroxide tolerance. It is mainly cytosolic, with a minor pool in the mitochondrial
  intermembrane space.
