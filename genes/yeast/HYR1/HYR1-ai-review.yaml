  - *id007
suggested_questions:
- question: Should Hyr1/Gpx3 carry GO:0140442 'peroxide sensor activity' (or a more appropriate redox-relay
    MF term) to capture its H2O2-sensing, Yap1-oxidising function? The current definition refers to a
    change in the sensor protein's own activity, whereas Gpx3 transfers the oxidation to Yap1.
- question: Is a fraction of Gpx3 truly present in the peroxisomal matrix (as recorded in UniProt from
    Ohdate & Inoue 2012), or does that observation apply only to the paralog Gpx1?
