core_functions:
- description: Atypical 2-Cys GPx-family peroxiredoxin that reduces H2O2 and lipid hydroperoxides using
    thioredoxin; the peroxidatic Cys36 sulfenic acid is also used to oxidise Yap1 Cys598, making Hyr1/Gpx3/Orp1
    the hydroperoxide sensor and transducer that activates the Yap1 oxidative-stress transcriptional response.
  molecular_function:
    id: GO:0140824
    label: thioredoxin-dependent peroxiredoxin activity
