- source: Alliance_Imported
  text: Glutathione peroxidase; functions as hydroperoxide receptor to sense intracellular
    hydroperoxide levels and transduce redox signal to Yap1p transcription factor;
    glutathione peroxidase activity is neuroprotective in models of Huntington's disease;
    HYR1 has a paralog, GPX1, that arose from the whole genome duplication
