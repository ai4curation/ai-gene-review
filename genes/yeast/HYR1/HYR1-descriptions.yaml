descriptions:
- source: UniProt
  text: Involved in oxidative stress response and redox homeostasis. Functions as
    a sensor and transducer of hydroperoxide stress. In response to hydroperoxide
    stress it oxidizes (activates) the transcription activator YAP1, which is involved
    in transcription activation of genes of the oxidative stress response pathway.
    May also play a direct role in hydroperoxide scavenging, being the most active
    of three closely related S.cerevisiae peroxiredoxins (GPX1, GPX2, and HYR1/GPX3)
    with respect to peroxide and lipid hydroperoxide reduction. The three enzymes
    are not required for the glutaredoxin-mediated antioxidant function. In the presence
    of peroxides, HYR1/GPX3 is directly oxidized at Cys-36 to form a cysteine sulfenic
    acid (-SOH). Cys-36-SOH then forms either an intramolecular disulfide bond (Cys-36
    with Cys-82) or a transient, intermolecular disulfide bond with 'Cys- 598' of
    YAP1, which is further resolved into a YAP1 intramolecular disulfide bond ('Cys-303'
    with 'Cys-598'), which causes its nuclear accumulation and activation, and a reduced
    Cys-36 in HYR1/GPX3.
