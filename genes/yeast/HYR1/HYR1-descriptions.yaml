gene_symbol: HYR1
organism: yeast
uniprot_id: P40581
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in oxidative stress response and redox homeostasis. Functions as
    a sensor and transducer of hydroperoxide stress. In response to hydroperoxide
    stress it oxidizes (activates) the transcription activator YAP1, which is involved
    in transcription activation of genes of the oxidative stress response pathway.
    May also play a direct role in hydroperoxide scavenging, being the most active
    of three closely related S.cerevisiae peroxiredoxins (GPX1, GPX2, and HYR1/GPX3)
    with respect to peroxide and lipid hydroperoxide reduction. The three enzymes
    are not required for the glutaredoxin-mediated antioxidant function. In the presence
    of peroxides, HYR1/GPX3 is directly oxidized at Cys-36 to form a cysteine sulfenic
    acid (-SOH). Cys-36-SOH then forms either an intramolecular disulfide bond (Cys-36
    with Cys-82) or a transient, intermolecular disulfide bond with 'Cys- 598' of
    YAP1, which is further resolved into a YAP1 intramolecular disulfide bond ('Cys-303'
    with 'Cys-598'), which causes its nuclear accumulation and activation, and a reduced
    Cys-36 in HYR1/GPX3.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40581
  source_id: P40581
- source: Alliance_Imported
  text: Glutathione peroxidase; functions as hydroperoxide receptor to sense intracellular
    hydroperoxide levels and transduce redox signal to Yap1p transcription factor;
    glutathione peroxidase activity is neuroprotective in models of Huntington's disease;
    HYR1 has a paralog, GPX1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/HYR1
  source_id: SGD:S000001476
- source: Alliance_Automated
  text: Enables glutathione peroxidase activity; phospholipid-hydroperoxide glutathione
    peroxidase activity; and thioredoxin-dependent peroxiredoxin activity. Involved
    in cellular response to oxidative stress. Located in mitochondrial intermembrane
    space and peroxisomal matrix. Human ortholog(s) of this gene implicated in colorectal
    adenocarcinoma; colorectal cancer; and spondylometaphyseal dysplasia Sedaghatian
    type. Orthologous to human GPX4 (glutathione peroxidase 4).
  source_type: automated
