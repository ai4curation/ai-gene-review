- source: Alliance_Automated
  text: Enables glutathione peroxidase activity; phospholipid-hydroperoxide glutathione
    peroxidase activity; and thioredoxin-dependent peroxiredoxin activity. Involved
    in cellular response to oxidative stress. Located in mitochondrial intermembrane
    space and peroxisomal matrix. Human ortholog(s) of this gene implicated in colorectal
    adenocarcinoma; colorectal cancer; and spondylometaphyseal dysplasia Sedaghatian
    type. Orthologous to human GPX4 (glutathione peroxidase 4).
