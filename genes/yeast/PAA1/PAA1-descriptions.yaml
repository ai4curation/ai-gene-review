gene_symbol: PAA1
organism: yeast
uniprot_id: Q12447
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acetylates spermine and probably also other polyamines such as putrescine
    or spermidine. May regulate the levels of polyamines on chromosomal DNA, which
    would modify chromatin structure and affect transcription or replication. Also
    able to acetylate arylalkylamines such as tryptamine and serotonin in vitro.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12447
  source_id: Q12447
- source: Alliance_Imported
  text: Polyamine acetyltransferase; acetylates polyamines (e.g. putrescine, spermidine,
    spermine) and also aralkylamines (e.g. tryptamine, phenylethylamine); may be involved
    in transcription and/or DNA replication
  source_type: curated
  url: https://www.yeastgenome.org/locus/PAA1
  source_id: SGD:S000002478
- source: Alliance_Automated
  text: Enables aralkylamine N-acetyltransferase activity and diamine N-acetyltransferase
    activity. Involved in chromatin organization. Located in cytoplasm. Human ortholog(s)
    of this gene implicated in advanced sleep phase syndrome. Orthologous to human
    AANAT (aralkylamine N-acetyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PAA1
  source_id: SGD:S000002478
