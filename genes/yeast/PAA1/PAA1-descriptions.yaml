descriptions:
- source: UniProt
  text: Acetylates spermine and probably also other polyamines such as putrescine
    or spermidine. May regulate the levels of polyamines on chromosomal DNA, which
    would modify chromatin structure and affect transcription or replication. Also
    able to acetylate arylalkylamines such as tryptamine and serotonin in vitro.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12447
