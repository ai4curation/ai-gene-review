- term:
    id: GO:0006325
    label: chromatin organization
  evidence_type: IMP
  original_reference_id: PMID:15723835
  qualifier: involved_in
  review:
    summary: 'IMP from Liu et al. (2005): paa1 mutants are HU-sensitive, synthetically sick with rad53-21, interact
      genetically with SAGA and partially suppress spt phenotypes. The authors infer that polyamine acetylation
      makes chromatin more accessible, but this is a hypothesis built on genetic interactions; Paa1 is a cytoplasmic
      metabolic enzyme and any chromatin effect would be an indirect consequence of altered polyamine pools rather
      than Paa1 organising chromatin itself.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect, inferred effect of polyamine levels; no evidence that Paa1 acts on chromatin. Retain only
      as a hypothesis pending direct evidence (abstract-only access to the paper).
    supported_by:
    - reference_id: PMID:15723835
      supporting_text: These phenotypes suggest that acetylation of polyamines removes them from chromatin and makes
        the chromatin more accessible.
