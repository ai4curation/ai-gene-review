core_functions:
- description: 'Cytoplasmic polyamine N-acetyltransferase: transfers the acetyl group of acetyl-CoA to putrescine,
    spermidine and spermine; acetylation of spermine in vivo lowers the spermine pool that feeds Fms1-dependent
    beta-alanine/pantothenate (coenzyme A) synthesis. Secondary in-vitro activity on arylalkylamines (tryptamine,
    serotonin).'
  molecular_function:
    id: GO:0004145
    label: diamine N-acetyltransferase activity
  directly_involved_in:
  - id: GO:0006595
    label: polyamine metabolic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15723835
    supporting_text: The recombinant Paa1 protein readily acetylates various polyamines such as putrescine, spermidine,
      and spermine.
  - reference_id: PMID:15723835
    supporting_text: This demonstrates that spermine and perhaps other polyamines are the in vivo targets of Paa1.
  - reference_id: file:yeast/PAA1/PAA1-uniprot.txt
    supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm {ECO:0000269|PubMed:14562095}.'
suggested_questions:
- question: Which nitrogen (N1 versus N8 of spermidine; N1 of spermine) does Paa1 acetylate in vivo, and are the
    acetylated polyamines exported, oxidised by Fms1, or deacetylated?
- question: Do the reproducible Paa1-Ptc2/Ptc3/Ptc4 interactions regulate Paa1 activity or reflect Paa1 acting on
    the phosphatases?
suggested_experiments:
- description: Metabolomic profiling of N-acetylputrescine, N1/N8-acetylspermidine and N1-acetylspermine in paa1
    deletion and overexpression strains, combined with fms1 deletion, to define the in vivo regiochemistry and fate
    of Paa1 products.
