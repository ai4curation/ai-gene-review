    id: GO:0004059
    label: aralkylamine N-acetyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000097489
  - RGD:2006
  - SGD:S000002478
  - UniProtKB:O02785
  - UniProtKB:O97756
  - UniProtKB:P79774
  - UniProtKB:Q16613
  review:
    summary: IBA from PANTHER node PTN000097489 (AANAT/serotonin N-acetyltransferase family; donors include ovine/human
      AANAT and Paa1 itself). Paa1 does acetylate arylalkylamines in vitro (Ganguly et al. 2001), so the inherited
      activity is real, but its physiological substrates are polyamines; arylalkylamine acetylation is a secondary/in-vitro
      activity.
    action: KEEP_AS_NON_CORE
    reason: Correct family-level activity confirmed in vitro for Paa1, but not its main physiological role (polyamine
      acetylation).
    supported_by:
    - reference_id: PMID:11559708
      supporting_text: It was found to have enzyme activity generally typical for AANAT family members, although
        the substrate preference pattern was somewhat broader, the specific activity was lower, and the pH optimum
        was higher.
- term:
    id: GO:0004059
    label: aralkylamine N-acetyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:11559708
  qualifier: enables
  review:
    summary: Ganguly et al. (2001) expressed scAANAT (Paa1) and showed AANAT-type acetylation of arylalkylamines
      with broader specificity and lower specific activity than vertebrate AANAT; deletion reduced arylalkylamine
      acetylation in extracts. Direct evidence for the activity, but the later identification of polyamines as in
      vivo substrates makes this a secondary activity.
    action: KEEP_AS_NON_CORE
    reason: Experimentally demonstrated but physiologically secondary to polyamine N-acetyltransferase activity.
    supported_by:
    - reference_id: PMID:11559708
      supporting_text: It was found to have enzyme activity generally typical for AANAT family members, although
        the substrate preference pattern was somewhat broader, the specific activity was lower, and the pH optimum
        was higher.
    - reference_id: PMID:11559708
      supporting_text: Deletion of scAANAT reduced arylalkylamine acetylation by S. cerevisiae extracts, indicating
        that scAANAT contributes significantly to this process.
- term:
    id: GO:0004145
    label: diamine N-acetyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:15723835
  qualifier: enables
  review:
    summary: Liu et al. (2005) showed that recombinant Paa1 acetylates putrescine, spermidine and spermine. GO:0004145
      (diamine N-acetyltransferase, EC 2.3.1.57 spermidine/spermine N1-acetyltransferase class) is the best available
      GO term for polyamine N-acetyltransferase activity.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:15723835
      supporting_text: The recombinant Paa1 protein readily acetylates various polyamines such as putrescine, spermidine,
        and spermine.
- term:
    id: GO:0004145
    label: diamine N-acetyltransferase activity
  evidence_type: IMP
  original_reference_id: PMID:15723835
  qualifier: enables
  review:
    summary: 'IMP from Liu et al. (2005): PAA1 overexpression lowers spermine and causes a pantothenate/beta-alanine
      requirement, showing that Paa1 acetylates spermine in vivo. Supports the polyamine acetyltransferase activity
      in vivo.'
    action: ACCEPT
    supported_by:
    - reference_id: PMID:15723835
      supporting_text: This demonstrates that spermine and perhaps other polyamines are the in vivo targets of Paa1.
    - reference_id: PMID:15723835
      supporting_text: When Paa1 is overexpressed, leading to a lower level of spermine, cells show a growth dependence
        on either of two downstream compounds in the coenzyme A pathway, pantothenate or beta-alanine.
