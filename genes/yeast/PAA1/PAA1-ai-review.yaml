id: Q12447
gene_symbol: PAA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PAA1 (YDR071C) encodes a cytoplasmic GCN5-related N-acetyltransferase (GNAT) of the arylalkylamine
  N-acetyltransferase (AANAT/SNAT-like) subfamily that acetylates polyamines. Recombinant Paa1 transfers the acetyl
  group of acetyl-CoA to putrescine, spermidine and spermine, and in vitro also acetylates arylalkylamines such
  as tryptamine and serotonin, although it lacks the regulatory N- and C-terminal extensions of vertebrate AANAT.
  Overexpression lowers cellular spermine and makes cells dependent on pantothenate or beta-alanine, indicating
  that spermine is an in vivo substrate and that acetylation diverts spermine away from the Fms1-dependent route
  to beta-alanine and coenzyme A. paa1 null mutants are viable but hydroxyurea-sensitive and show genetic interactions
  with rad53 and SAGA components, which has led to the proposal that polyamine acetylation affects chromatin accessibility.
  Paa1 is reproducibly co-purified with the PP2C phosphatases Ptc2, Ptc3 and Ptc4 in interactome studies, of unknown
  functional significance.
