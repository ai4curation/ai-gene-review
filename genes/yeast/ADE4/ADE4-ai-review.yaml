id: P04046
gene_symbol: ADE4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ade4 (YMR300C) is the glutamine phosphoribosylpyrophosphate amidotransferase (PPAT; EC 2.4.2.14) of
  Saccharomyces cerevisiae, which converts PRPP and glutamine to 5-phospho-beta-D-ribosylamine in the first, committed
  and rate-limiting step of de novo purine synthesis. Unlike the bacterial enzymes it lacks a [4Fe-4S] cluster.
  Ade4 is feedback-inhibited by ATP and ADP, and this control sets the level of the signalling intermediate SAICAR
  that drives Bas1/Bas2-dependent ADE gene expression. Ade4 is cytoplasmic and, under purine depletion and TORC1
  activity, phase-separates into dynamic cytoplasmic condensates that enhance pathway flux.
