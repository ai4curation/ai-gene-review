      not mention the Bub3 GLEBS heterodimer.'
- source: Alliance_Automated
  text: Involved in distributive segregation; negative regulation of cell cycle phase
    transition; and positive regulation of protein autoubiquitination. Part of mitotic
    checkpoint complex. Human ortholog(s) of this gene implicated in colorectal cancer
    and mosaic variegated aneuploidy syndrome 1. Orthologous to human BUB1B (BUB1
    mitotic checkpoint serine/threonine kinase B).
  source_type: automated
