      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: 'Correct: spindle assembly checkpoint component and MCC subunit
      that blocks Cdc20 activation of the APC/C. Names neither the KEN-box pseudosubstrate
      mechanism nor Bub3 and Mad2 partners.'
- source: Alliance_Imported
  text: Subunit of the spindle-assembly checkpoint complex; involved in delaying anaphase
    onset in cells with defects in mitotic spindle assembly; pseudosubstrate inhibitor
    of APC(Cdc20), the anaphase promoting complex involved in Pds1p (securin) turnover;
    MAD3 has a highly diverged paralog, BUB1, that arose from the whole genome duplication;
    N-terminal TPR domain-containing region is homologous with the N-terminal region
    of Bub1p
  source_type: curated
  url: https://www.yeastgenome.org/locus/MAD3
