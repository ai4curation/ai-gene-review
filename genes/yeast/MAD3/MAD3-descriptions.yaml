descriptions:
- source: UniProt
  text: Component of the spindle assembly checkpoint which is a feedback control that
    prevents cells with incompletely assembled spindles from leaving mitosis. Component
    of the mitotic checkpoint complex (MCC) which inhibits the ubiquitin ligase activity
    of the anaphase promoting complex/cyclosome (APC/C) by preventing its activation
    by CDC20.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47074
  source_id: P47074
