- term:
    id: GO:0051754
    label: meiotic sister chromatid cohesion, centromeric
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0263855
  - PANTHER:PTN000361607
  - PomBase:SPCC1322.12c
  review:
    summary: PAINT node PTN000361607 (the ancestor of both Bub1 and Mad3/BubR1) carries meiotic
      centromeric cohesion, seeded by fission-yeast Bub1 (SPCC1322.12c) and Drosophila BubR1
      (FBgn0263855). In fission and budding yeast this function belongs to the Bub1 kinase, which
      phosphorylates H2A to recruit shugoshin and thereby protects centromeric Rec8 cohesin in meiosis I.
      Budding-yeast Mad3 is the kinase-less product of the Bub1/Mad3 duplication and the genome retains
      Bub1 (SGD:S000003420), which carries the same IBA; no study implicates Mad3 in centromeric cohesion,
      and the direct meiotic analyses of Mad3 (prophase timer and nonexchange-chromosome segregation via
      Stu1/CLASP; PMID:15951820 and PMID:39079532) describe different functions.
    action: MARK_AS_OVER_ANNOTATED
    reason: The node placement is defensible for the family ancestor, but the function requires the
      kinase output that Mad3 lacks entirely (PMID:17227844) and is executed in yeast by the paralog
      Bub1. There is no yeast evidence for or against a Mad3 role in cohesion protection, so this is not
      contradicted (hence not REMOVE), but it should not be read as a Mad3 function. Graded one step
      below the human BUB1B row (KEEP_AS_NON_CORE), where mouse oocyte data provide some direct support
      that is absent for yeast Mad3.
    supported_by:
    - reference_id: PMID:17227844
      supporting_text: Mad3 from Saccharomyces cerevisiae has homology to Bub1 but lacks a
        corresponding C-terminal kinase domain.
    - reference_id: PMID:15951820
      supporting_text: We identified a new meiotic role for MAD3; though dispensable for the segregation
        of exchange chromosomes, it is essential for the segregation of nonexchange chromosomes.
    - reference_id: PMID:39079532
      supporting_text: Mad3BUBR1 associates with the TOGL1 domain of Stu1CLASP, a conserved plus-end
        microtubule protein that is important for chromosome capture onto the spindle.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000361607
        source_label: PTN000361607
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node predates the Bub1/Mad3 duplication; the cohesion function is tied to the Bub1
          kinase branch, and the kinase-less Mad3 branch in Saccharomyces has no evidence for it.
      - source_id: PomBase:SPCC1322.12c
        source_label: bub1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Fission-yeast Bub1 kinase protects centromeric cohesion via H2A phosphorylation and
          shugoshin recruitment; the equivalent budding-yeast gene is BUB1, not MAD3.
      - source_id: FB:FBgn0263855
        source_label: BubR1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Drosophila BubR1 retains a kinase domain and has a reported meiotic cohesion role; the
          transfer to a kinase-less fungal Mad3 is not supported by target evidence.
      residue_claims_not_applicable: The argument concerns the absence of the entire C-terminal kinase
        domain in Mad3, not individual residues.
- term:
    id: GO:1902499
    label: positive regulation of protein autoubiquitination
  evidence_type: IDA
  original_reference_id: PMID:22940250
  qualifier: involved_in
  review:
    summary: Foster and Morgan 2012 reconstitute the yeast SAC with purified components and show that
      the Mad3-Bub3 complex stimulates Cdc20 autoubiquitination on the APC/C (clearly with the
      APC/C-affinity-reduced Cdc20-IR mutant, and by reversing Mad2's inhibition of autoubiquitination),
      while inhibiting substrate ubiquitination; the MCC thereby locks Cdc20 on the APC/C in a
      Mnd2/Apc15-dependent autoubiquitination-competent state, and Cdc20 turnover is needed to establish
      and to exit a SAC arrest.
    action: ACCEPT
    reason: Direct in vitro demonstration with purified yeast Mad3-Bub3 that the gene product itself
      performs the regulatory step; in vivo Cdc20 instability during a SAC arrest requires Mad3 (King et
      al. 2007, cited in the paper). This is an integral facet of how the MCC controls APC/C-Cdc20
      during checkpoint signalling rather than a separate pleiotropic role, so it is accepted alongside
      the core SAC rows.
    supported_by:
    - reference_id: PMID:22940250
      supporting_text: The low level of Cdc20-IR autoubiquitination was stimulated by the Mad3-Bub3
        complex (Figure 1C).
    - reference_id: PMID:22940250
      supporting_text: we found that Mad3-Bub3 reversed the inhibitory effect of Mad2 on Cdc20
        autoubiquitination, and the dose response curve was the mirror image of the securin inhibition
        curve (Figure 3B, C)
    - reference_id: PMID:22940250
      supporting_text: In budding yeast, the instability of Cdc20 during a SAC arrest requires Mad2 and
        Mad3 (King et al., 2007; Pan and Chen, 2004).
core_functions:
- description: As the Mad3 subunit of the mitotic checkpoint complex (Mad2-Mad3-Bub3-Cdc20), Mad3 uses
    its KEN-box/homology-region-I pseudosubstrate motifs to bind the APC/C activator Cdc20 and, with
    Mad2 and its constitutive GLEBS-bound partner Bub3, inhibits APC/C-Cdc20 ubiquitination of securin
    (Pds1) and cyclins while locking Cdc20 on the APC/C and promoting its autoubiquitination, so that
    anaphase is delayed until all kinetochores are attached and under tension.
  molecular_function:
    id: GO:1990948
    label: ubiquitin ligase inhibitor activity
  directly_involved_in:
  - id: GO:0007094
    label: mitotic spindle assembly checkpoint signaling
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0033597
    label: mitotic checkpoint complex
  supported_by:
  - reference_id: PMID:22940250
    supporting_text: We found that this complex inhibited Cdc20-dependent securin ubiquitination (IC50
      ~1 μM), but had little effect on autoubiquitination except at very high concentrations (Figure
      1B).
  - reference_id: PMID:22940250
    supporting_text: The presence of Mad2 dramatically increased the potency of the Mad3-Bub3 complex,
      shifting the IC50 from ~1 μM to 6 nM (Figure 3A, C).
  - reference_id: PMID:10704439
    supporting_text: Gene disruption experiments revealed that lack of Mad3p abolishes spindle
      checkpoint function, and mutational analyses indicate that two regions of Mad3/Bub1 homology are
      critical for Mad3p's function.
  - reference_id: PMID:15879521
    supporting_text: Pds1 levels began to decline as soon as the Mad2 or Mad3 levels dropped (Fig. 3A
      ).
  - reference_id: PMID:17227844
    supporting_text: Mad3 forms a stable heterodimer with Bub3.
  - reference_id: file:yeast/MAD3/MAD3-deep-research-falcon.md
    supporting_text: KEN30-to-AAA mutation eliminates detectable Cdc20 binding, prevents MCC assembly,
      and yields a checkpoint-null phenotype.
proposed_new_terms: []
suggested_questions:
- question: Should the checkpoint-independent meiosis I function of Mad3 (association with the Stu1/CLASP
    TOGL1 domain to promote homolog capture and alignment; PMID:39079532) be
    captured in GO, and if so with which process term (homologous chromosome orientation or attachment
    of spindle microtubules to kinetochore in meiosis I) and what molecular function, given that Mad3 has
    no catalytic activity?
- question: Does the IBA-derived meiotic centromeric cohesion annotation reflect any real Mad3 activity
    in budding yeast, or is it a Bub1-branch function of the PTN000361607 node that should be restricted
    to kinase-bearing family members? Do mad3 delta cells retain centromeric Rec8 through anaphase I?
- question: What is the molecular route by which Mad3 supports the Topoisomerase II (catenation) G2/M
    checkpoint, given that this delay is independent of Pds1/securin and therefore cannot simply be
    MCC-mediated APC/C-Cdc20 inhibition?
suggested_experiments:
- hypothesis: The Mad3 requirement for meiotic centromeric cohesion inferred by IBA is not a real
    budding-yeast function; centromeric cohesin protection is carried out by Bub1 and Sgo1.
  description: Image Rec8-GFP at centromeres through anaphase I in mad3 delta, bub1 delta and sgo1 delta
    meioses side by side, and score sister-chromatid separation at meiosis II with CEN5-GFP dots; a
    wild-type-like Rec8 retention in mad3 delta would justify retiring the IBA transfer for Mad3.
  experiment_type: genetic
- hypothesis: The Mad3 KEN boxes and the GLEBS-Bub3 interface make separable contributions to APC/C
    inhibition versus Cdc20 autoubiquitination.
  description: Reconstitute the Foster-Morgan assay with purified Mad3(KEN30A)-Bub3, Mad3(KEN296A)-Bub3
    and Mad3(E382K) preparations and measure securin-ubiquitination IC50 and Cdc20-IR
    autoubiquitination EC50 in the presence and absence of Mad2, to map which Mad3 elements execute
    each output.
  experiment_type: biochemical
- hypothesis: The Mad3-Stu1 TOGL1 association is the physical basis of the distributive segregation
    (nonexchange chromosome) phenotype.
  description: Define the Stu1-binding region of Mad3 by mutagenesis and Mad3-FLAG IP-mass spectrometry,
    then test a Stu1-binding-defective, checkpoint-proficient mad3 allele for achiasmate mini-chromosome
    missegregation and same-pole homolog segregation in meiosis I.
  experiment_type: genetic
