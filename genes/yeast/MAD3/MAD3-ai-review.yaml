- term:
    id: GO:0032837
    label: distributive segregation
  evidence_type: IMP
  original_reference_id: PMID:15951820
  qualifier: involved_in
  review:
    summary: Cheslock et al. 2005 show that MAD3, although dispensable for the segregation of exchange
      chromosomes, is essential for the meiotic segregation of nonexchange (achiasmate) chromosomes and
      acts as a meiotic prophase timer, a role separable from the Mad1/Mad2 metaphase-delay surveillance.
      Later work shows this is a checkpoint-independent function mediated by Mad3 association with the
      TOGL1 domain of Stu1/CLASP that promotes homolog capture and alignment on the meiosis I spindle
      (PMID:39079532).
    action: KEEP_AS_NON_CORE
    reason: Genuine, directly demonstrated meiotic role of the target (abstract-only cache; the curator
      read the full text) that matches the term definition (segregation of homologs that have failed to
      cross over). It is a distinct, lineage-specific meiotic function rather than the core checkpoint
      activity, so it is retained as non-core.
    supported_by:
    - reference_id: PMID:15951820
      supporting_text: We identified a new meiotic role for MAD3; though dispensable for the segregation
        of exchange chromosomes, it is essential for the segregation of nonexchange chromosomes.
    - reference_id: PMID:15951820
