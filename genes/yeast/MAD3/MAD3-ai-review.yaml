    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: Root-term ND placeholder (2013) recording that no specific molecular function had been
      curated for Mad3 beyond generic protein binding.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:1990948
      label: ubiquitin ligase inhibitor activity
    reason: The placeholder is outdated. Mad3-Bub3 purified from E. coli inhibits Cdc20-dependent
      securin ubiquitination by purified yeast APC/C (IC50 ~1 uM alone, 6 nM with Mad2), acting as a
      pseudosubstrate inhibitor through its KEN boxes (PMID:22940250), and in vivo Mad3 is required to
      keep Pds1/securin stable during a checkpoint arrest (PMID:15879521). Ubiquitin ligase inhibitor
      activity (GO:1990948, 'binds to and stops, prevents or reduces the activity of a ubiquitin
      ligase') is therefore an experimentally determined molecular function for the yeast protein and
      should replace the ND stub; it is also the term used for the human orthologue BUB1B in this
      repository.
    supported_by:
    - reference_id: PMID:22940250
      supporting_text: We found that this complex inhibited Cdc20-dependent securin ubiquitination
        (IC50 ~1 μM), but had little effect on autoubiquitination except at very high concentrations
        (Figure 1B).
    - reference_id: PMID:22940250
      supporting_text: The presence of Mad2 dramatically increased the potency of the Mad3-Bub3
