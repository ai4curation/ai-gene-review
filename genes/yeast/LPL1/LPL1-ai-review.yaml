id: Q08448
gene_symbol: LPL1
aliases:
- YOR059C
- YOR29-10
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: LPL1 encodes a lipid droplet-localized phospholipase B that
  catalyzes the hydrolysis of glycerophospholipids at both sn-1 and sn-2
  positions. It plays dual roles in lipid droplet homeostasis and protein
  quality control under stress conditions, being induced by the Rpn4
  transcription factor during proteotoxic stress.
