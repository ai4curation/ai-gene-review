- id: PMID:28100635
  title: Phospholipase Lpl1 links lipid droplet function with quality control
    protein degradation.
  findings:
  - statement: Lpl1 is an unexpected target of the Rpn4 proteotoxic stress
      response and is a phospholipase and lipid-droplet component with dual
      functions, being required for both efficient proteasome-mediated protein
      degradation and the dynamic regulation of lipid droplets.
    supporting_text: 'Here we identify Lpl1 as an unexpected target of the Rpn4 response.
      Lpl1 is a phospholipase and a component of the lipid droplet. Lpl1 has dual
      functions: it is required for both efficient proteasome-mediated protein degradation
      and the dynamic regulation of lipid droplets.'
    reference_section_type: ABSTRACT
  - statement: Lpl1 shows a synthetic genetic interaction with Hac1, master
      regulator of the unfolded protein response, providing a direct link
      between the lipid droplet and proteasomal protein degradation.
    supporting_text: Lpl1 shows a synthetic genetic interaction with Hac1, the
      master regulator of a second proteotoxic stress response, the unfolded
      protein response (UPR)...these results provide a direct link between the
      lipid droplet and proteasomal protein degradation
    reference_section_type: ABSTRACT
- id: file:yeast/LPL1/LPL1-deep-research-falcon.md
  title: 'Deep Research Report (falcon): Functional annotation of Saccharomyces cerevisiae
    LPL1 (YOR059C; UniProt Q08448).'
  findings:
  - statement: The falcon report verifies the target as budding yeast Lpl1
      (LPL1/YOR059C; UniProt Q08448), a lipid-droplet phospholipase, explicitly
      distinct from mammalian lipoprotein lipase (LPL), synthesizing the
      Weisshaar et al. 2017 primary evidence (PMID:28100635).
    supporting_text: The literature summarized here is explicitly for budding
      yeast Saccharomyces cerevisiae Lpl1 encoded by LPL1/YOR059C (UniProt
      Q08448), described in the primary paper as a lipid-droplet phospholipase
    reference_section_type: RESULTS
  - statement: Lpl1 is a type B phospholipase that deacylates
      glycerophospholipids at both sn-1 and sn-2, releasing free fatty acids
      while leaving the polar head group intact; in vitro it is active on PE, PC
      and PS with much lower activity against PI.
    supporting_text: Lpl1 is described as a type B phospholipase that cleaves
      phospholipids at both the sn-1 and sn-2 positions. This deacylation
      releases free fatty acids while leaving the polar head group intact
    reference_section_type: RESULTS
  - statement: In a cho2Δ (PC-biosynthesis-defective) background, Lpl1 is
      required for full supersized lipid-droplet formation; lpl1Δ alone
      resembles wild type, but cho2Δ lpl1Δ shifts the single dominant supersized
      droplet toward an intermediate phenotype.
    supporting_text: lpl1Δ alone resembles wild type in LD appearance, but cho2Δ
      lpl1Δ reduces the frequency of the single dominant supersized droplet and
      shifts toward an intermediate phenotype
    reference_section_type: RESULTS
  - statement: LPL1 is an Rpn4 proteotoxic-stress-response target whose promoter
      contains a canonical PACE motif and is induced by sodium arsenite, linking
      lipid-droplet biology to protein quality control.
    supporting_text: Lpl1 is reported as an "unexpected" target of the Rpn4
      proteotoxic stress response, with transcriptional induction under
      proteotoxic conditions and a canonical PACE motif in its promoter
    reference_section_type: RESULTS
