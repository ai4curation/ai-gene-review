- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Broad biological process term correctly reflecting LPL1
      phospholipase B activity on multiple glycerophospholipids. IBA annotation
      from phylogenetically conserved lipase family members is well-supported by
      experimental evidence showing LPL1 catalyzes lipid metabolism through
      phospholipid hydrolysis.
    action: ACCEPT
    reason: This general lipid metabolic process annotation is appropriate and
      supported by extensive experimental evidence from Selvaraju et al. 2014
      demonstrating phospholipase B activity on PE, PC, PS, PA, and PG. The IBA
      inference from conserved family members aligns with the biochemical
      characterization.
    supported_by:
    - reference_id: PMID:25014274
      supporting_text: The purified Lpl1p showed phospholipase activity with
        broader substrate specificity, acting on all glycerophospholipids
        primarily at sn-2 position and later at sn-1 position.
    - reference_id: file:yeast/LPL1/LPL1-deep-research-falcon.md
      supporting_text: Lpl1 is described as a type B phospholipase that cleaves
        phospholipids at both the sn-1 and sn-2 positions. This deacylation
        releases free fatty acids while leaving the polar head group intact
      reference_section_type: RESULTS
  qualifier: involved_in
