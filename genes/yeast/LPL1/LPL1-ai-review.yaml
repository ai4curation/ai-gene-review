  evidence_type: HDA
  original_reference_id: PMID:26928762
  review:
    summary: This HDA annotation from a high-throughput study likely reflects
      transient ER association during synthesis or lipid droplet biogenesis, but
      the functional localization is lipid droplets. The paper is about a yeast
      library creation method, not focused on LPL1 localization.
    action: KEEP_AS_NON_CORE
    reason: While LPL1 may transiently associate with ER (lipid droplets
      originate from ER), the primary functional localization shown by focused
      studies is lipid droplets. This high-throughput data point is not wrong
      but represents a minor/transient localization compared to the
      well-established lipid droplet localization.
    supported_by:
