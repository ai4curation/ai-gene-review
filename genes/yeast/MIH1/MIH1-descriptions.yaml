  text: Predicted to enable protein tyrosine phosphatase activity. Involved in G2/M
    transition of mitotic cell cycle. Acts upstream of or within spindle elongation.
    Located in cytoplasm and nucleus. Human ortholog(s) of this gene implicated in
    cervical cancer; disease of cellular proliferation; endometrial cancer; prostate
    cancer; and urinary bladder cancer. Orthologous to several human genes including
    CDC25C (cell division cycle 25C).
