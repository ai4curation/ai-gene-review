      translocation.
    supporting_text: >-
      Cdc5 promotes Cdk1 activation by inducing Swe1 degradation and facilitating
      Mih1 nuclear translocation.
    reference_section_type: ABSTRACT
  - statement: >-
      Mih1 is cytoplasmic in meiotic prophase I and enters the nucleus at the
      prophase I to metaphase I transition.
    supporting_text: >-
      Microscopy studies revealed that, during meiotic prophase I, Mih1 was
      predominantly cytoplasmic and largely excluded from the nucleus. As cells
      transitioned from prophase I to metaphase I, Mih1 progressively accumulated in
      the nucleus, coinciding with SPB separation.
    reference_section_type: RESULTS
