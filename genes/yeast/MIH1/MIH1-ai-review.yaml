      The node placement is sound: the G2/M role of the Cdc25 family is ancestral, and
      MIH1 appears among the descendant evidences because of its own IMP annotation
      (PMID:2649252), which is the expected marker that experimental grounding exists on
      the target itself. Budding-yeast genetics is fully consistent (mih1 mutants have a
