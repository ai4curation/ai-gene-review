    summary: >-
      PAINT propagation from the Cdc25-family node PTN000089071, seeded by Drosophila
      string, human CDC25A/B/C and MIH1's own SGD experimental annotation. Mih1 acts
      at the G2/M transition by removing the Swe1-dependent inhibitory Tyr19 phosphate
      from Cdc28, activating Cdc28-Clb2 for mitotic entry. Core process.
    action: ACCEPT
