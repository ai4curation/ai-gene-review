gene_symbol: MIH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Mih1 is the budding-yeast member of the Cdc25 family of M-phase inducer
  phosphatases: a rhodanese-fold, dual-specificity protein phosphatase (catalytic
  Cys320 in the HCX5R active-site loop) whose physiological substrate is the
  cyclin-dependent kinase Cdc28 (Cdk1) phosphorylated on the inhibitory residue
  Tyr19. By removing the phosphate placed on Tyr19 by the Wee1-family kinase Swe1,
  Mih1 activates Cdc28-Clb (mitotic cyclin) complexes and promotes the G2/M
  transition, and it is the structural and functional counterpart of fission-yeast
  cdc25. Unlike cdc25, Mih1 is not essential and is not rate-limiting for mitotic
  entry in an unperturbed cycle: mih1 null cells show only a Swe1-dependent G2 delay,
  because the phosphatase Ptp1 and a PP2A-Rts1-dependent activity provide redundant
  routes to Cdc28-Tyr19 dephosphorylation. The Swe1-Mih1 balance becomes decisive when
  the morphogenesis checkpoint is engaged (cells that fail to bud or polarize, septin
  mutants, hsl1 or hsl7 mutants): the timing of nuclear division is then exquisitely
  sensitive to MIH1 and SWE1 gene dosage, and loss of MIH1 converts a transient G2
  delay into a permanent arrest with elongated buds, while MIH1 overexpression
  suppresses the lethality of SWE1 overexpression. Mih1 is a nucleocytoplasmic
  protein that is predominantly cytoplasmic through most of the cell cycle and
  accumulates in the nucleus in late mitosis through an N-terminal basic import
  signal; because Cdc28-Clb2 itself shuttles, Mih1 can act on it from either
  compartment, but the nuclear pool is the more effective one. Mih1 abundance is
  roughly constant across the cycle and its output is set post-translationally: it is
  hyperphosphorylated through interphase by casein kinase 1 (Yck1/Yck2) and other
  kinases, and is dephosphorylated by PP2A-Cdc55 (whose activity toward Mih1 depends
  on Zds1/Zds2 and the endosulfines Igo1/Igo2) as cells approach mitosis; the Polo
  kinase Cdc5 also acts on Mih1. Mih1 additionally influences anaphase spindle
  elongation dynamics through the phosphorylation state of the microtubule-associated
  protein Bik1, and in meiosis it removes Cdc28-Tyr19 phosphorylation at the
  prophase I to meiosis I transition, where Cdc5 promotes its nuclear entry after the
  recombination checkpoint is satisfied.
