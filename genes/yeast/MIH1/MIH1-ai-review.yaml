  review:
    summary: >-
      Propagated from S. pombe cdc25, which triggers meiosis I by Cdc2-Tyr15
      dephosphorylation. Budding-yeast data now support the same role for Mih1: after
      the meiotic recombination checkpoint is satisfied, meiosis I entry depends on
      removal of Cdc28-Tyr19 phosphorylation controlled by Swe1 versus Mih1, and Cdc5
