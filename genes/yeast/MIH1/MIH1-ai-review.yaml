  review:
    summary: >-
      The founding MIH1 paper: MIH1 was cloned as the budding-yeast gene that
      counteracts fission-yeast wee1+ kinase expressed in S. cerevisiae, and wee1+
      expression in a mih1- strain prevents the initiation of mitosis. This is direct
      mutant-phenotype evidence that Mih1 functions at the G2/M transition as the
      Cdc25 counterpart of Wee1/Swe1. Core process.
    action: ACCEPT
    reason: >-
      Classical IMP evidence read by SGD from the full text; the cached abstract alone
      states the key result. Later work confirmed that the mih1 G2 delay is entirely
      Swe1-dependent and that Mih1 is not essential because Ptp1 and PP2A-Rts1 provide
      redundant Cdc28-Tyr19 dephosphorylation, but that does not weaken the assignment
      of Mih1 to the G2/M transition.
    supported_by:
