core_functions:
- description: >-
    Cdc25-family protein tyrosine phosphatase that removes the Swe1-placed inhibitory
    phosphate from Tyr19 of the cyclin-dependent kinase Cdc28 (Cdk1) in Cdc28-Clb
    complexes, activating mitotic CDK and thereby promoting the G2/M transition. Acts
    on the shuttling Cdc28-Clb2 substrate in both nucleus and cytoplasm, with the
    nuclear pool most effective; its output is tuned by PP2A-Cdc55-dependent
    dephosphorylation and by casein kinase 1 and Cdc5 phosphorylation, and it is the
    phosphatase arm of the morphogenesis checkpoint that couples budding to nuclear
    division.
  supported_by:
  - reference_id: PMID:2649252
    supporting_text: >-
      which is a structural and functional homolog of the cdc25+ mitotic inducer of
      fission yeast
    reference_section_type: ABSTRACT
  - reference_id: PMID:16688214
    supporting_text: >-
      cells unable to activate Cdc28 by tyrosine 19 dephosphorylation (Y19)
      catalyzed by Mih1 (homolog of Cdc25 phosphatase)
    reference_section_type: INTRODUCTION
  - reference_id: PMID:8930890
    supporting_text: >-
      The timing of nuclear division in cells that cannot make a bud is exquisitely
      sensitive to the dosage of SWE1 and MIH1 genes, which control phosphorylation
      of Cdc28 at tyrosine 19.
    reference_section_type: ABSTRACT
