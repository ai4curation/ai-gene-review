suggested_questions:
- question: >-
    Does Mih1 have physiological substrates other than Cdc28 Tyr19 (for example the
    Thr18 site, or non-CDK phosphoproteins such as Bik1), or is the Cdc25-family
    "dual specificity" not exploited in budding yeast?
- question: >-
    Which Mih1 phosphosites (casein kinase 1, Cdc5, Cdk1 targets) change catalytic
    activity versus nuclear import, and how does PP2A-Cdc55 dephosphorylation at
    mitotic entry alter Mih1 output mechanistically?
- question: >-
    Should the SGD ISS row for protein tyrosine phosphatase activity be upgraded to a
    direct-assay code now that purified Mih1 has been shown to dephosphorylate
    Swe1-phosphorylated Cdc28-Clb2 in vitro (Kennedy et al. 2016)?
suggested_experiments:
- description: >-
    Substrate-trapping with a catalytically dead Mih1 (Cys320Ser) combined with
    phospho-tyrosine and phospho-threonine proteomics in synchronized mih1Δ versus
    wild-type cells, to test whether Cdc28 Tyr19 is the only in vivo substrate.
  hypothesis: >-
    Mih1 is a dedicated Cdc28-Tyr19 phosphatase with no additional physiological
    substrates.
- description: >-
    Phosphosite-mutant series of Mih1 (CK1 and Cdc5 sites, singly and combined)
    assayed for in vitro activity toward Swe1-phosphorylated Cdc28-Clb2, nuclear
    accumulation kinetics by live imaging, and morphogenesis-checkpoint recovery
    timing, to separate catalytic from localization control.
  hypothesis: >-
    Interphase hyperphosphorylation restrains Mih1 mainly by limiting nuclear
    access rather than by lowering intrinsic phosphatase activity.
