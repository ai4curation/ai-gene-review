- term:
    id: GO:0051231
    label: spindle elongation
  evidence_type: IMP
  original_reference_id: PMID:30072442
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Raspelli et al. 2018 report that the Swe1/Cdc5-controlled phosphorylation state of
      Mih1 is important for mitotic spindle elongation and that Swe1 and Mih1 control
      phosphorylation of the microtubule-associated protein Bik1. This is a genuine
      mih1 mutant phenotype, but the effect is upstream (through Cdc28 activity and
      Bik1 phosphorylation) rather than Mih1 doing the work of elongating the spindle,
      which SGD already signals with the acts_upstream_of_or_within qualifier.
    action: KEEP_AS_NON_CORE
    reason: >-
      Only the abstract is cached, and SGD read the full text; the phenotype is
      credible and consistent with Mih1 setting Cdc28-Clb2 activity during anaphase.
      It is a secondary consequence of the core Cdc28-activating role, not a core
      function. If refined, the mitotic child GO:0000022 (mitotic spindle elongation)
      would be the more precise term for this study.
    supported_by:
    - reference_id: PMID:30072442
      supporting_text: >-
        Swe1 and the Polo-like kinase Cdc5 control the balance between phosphorylated
        and unphosphorylated forms of Mih1, which is, in turn, important for mitotic
        spindle elongation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:30072442
      supporting_text: >-
        Swe1 and Mih1 are both involved in controlling phosphorylation of Bik1.
      reference_section_type: ABSTRACT
