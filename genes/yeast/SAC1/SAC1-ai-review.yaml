gene_symbol: SAC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Sac1 is an integral ER/Golgi membrane phosphoinositide phosphatase of Saccharomyces cerevisiae (SAC
  domain family, orthologous to human SACM1L). It is a type II transmembrane protein whose N-terminal cytosolic
  SAC domain hydrolyses the 4-phosphate of PtdIns4P (its principal in vivo substrate) and also dephosphorylates
  PtdIns3P in vitro, with low activity on PtdIns(3,5)P2. In growing cells Sac1 is retained in the ER (including
  cortical ER at ER-plasma membrane contact sites) through binding to Dpm1, and it relocates to the Golgi when growth
  slows. At ER-PM contacts Sac1 consumes the plasma membrane PtdIns4P pool generated by Stt4, an activity stimulated
  by Osh proteins and VAPs; on medial Golgi cisternae it is directed by Vps74 to keep PtdIns4P low. By turning over
  PtdIns4P Sac1 maintains the ER-to-Golgi/PM PtdIns4P gradient that drives Osh-mediated lipid exchange, and it influences
  actin organisation, vacuole morphology, Golgi secretory function, dolichol-oligosaccharide synthesis, autophagosome-vacuole
  fusion and sphingolipid homeostasis (as a component of the SPOTS complex with serine palmitoyltransferase and
  Orm1/2).
