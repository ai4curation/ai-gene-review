core_functions:
- description: Hydrolysis of the 4-phosphate of PtdIns4P by the cytosol-facing SAC domain of this ER-anchored phosphatase,
    turning over the Stt4-generated plasma membrane pool at ER-PM contact sites (in trans, stimulated by Osh proteins)
    and Golgi PtdIns4P, thereby maintaining the PtdIns4P gradient across organelles.
