descriptions:
- source: UniProt
  text: Phosphoinositide phosphatase which catalyzes the hydrolysis of phosphatidylinositol
    3-phosphate (PtdIns(3)P) and phosphatidylinositol 4-phosphate (PtdIns(4)P) (PubMed:10625610,
    PubMed:11792713). Has low activity towards phosphatidylinositol-3,5- bisphosphate
    (PtdIns(3,5)P2) (PubMed:10625610). May be involved in the coordination of the
    activities of the secretory pathway and the actin cytoskeleton (PubMed:11514624).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32368
  source_id: P32368
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and cited: PtdIns3P and PtdIns4P phosphatase, low activity
      on PtdIns(3,5)P2. Omits ER/Golgi location, the ER-PM contact role and the SPOTS
      complex.'
- source: Alliance_Imported
  text: Phosphatidylinositol phosphate phosphatase; role in early and medial Golgi
    PtdIns4P hydrolysis; regulated by Vps74p interaction; ER localized transmembrane
    protein which cycles through the Golgi; role in protein trafficking, processing,
    secretion, and cell wall maintenance; regulates sphingolipid biosynthesis by modulating
    PtdIns(4)P metabolism; PtdIns4P PPase activity is crucial for autophagosome-vacuole
    fusion during autophagy; human homolog SACM1L complements autophagy defects of
    the null
  source_type: curated
  url: https://www.yeastgenome.org/locus/SAC1
  source_id: SGD:S000001695
