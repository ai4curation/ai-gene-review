  review:
    summary: IBA glycine biosynthetic process for Shm1 (PTN000188065 IBA).
    action: KEEP_AS_NON_CORE
    reason: Shm1 can form glycine (it contributes to prototrophy in gly1 shm2 backgrounds), but 13C-NMR
      shows the mitochondrial isozyme supplies one-carbon units rather than glycine when both amino acids
      are present, and Gly1/Shm2 are the main glycine sources. Non-core for Shm1.
    supported_by:
    - &id003
      reference_id: PMID:9398220
      supporting_text: when both serine and glycine were present, the mitochondrial SHMT made a significant
        contribution of one-carbon units, but not glycine, for purine synthesis
    - &id004
      reference_id: PMID:8132653
      supporting_text: Gene disruption studies demonstrated that inactivation of SHM1, SHM2, and GLY1
        is required to yield yeast that are completely auxotrophic for glycine
