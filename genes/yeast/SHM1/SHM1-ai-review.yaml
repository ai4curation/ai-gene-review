core_functions:
- description: Mitochondrial PLP-dependent serine/glycine interconversion coupled to THF <-> 5,10-methylene-THF
    (EC 2.1.2.1); supplies mitochondrial one-carbon units and synthesizes serine from glycine when glycine
    is the carbon/one-carbon source.
