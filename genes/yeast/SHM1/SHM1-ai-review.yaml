id: P37292
gene_symbol: SHM1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'SHM1 encodes the mitochondrial serine hydroxymethyltransferase, a pyridoxal 5''-phosphate-dependent
  enzyme with an N-terminal mitochondrial transit peptide that reversibly converts L-serine and tetrahydrofolate
  to glycine and 5,10-methylenetetrahydrofolate. Although it accounts for only about 5% of total cellular
  SHMT activity, its specific activity in mitochondria is high, and it is a major supplier of one-carbon
  units for purine, thymidylate and methionine synthesis. Its direction depends on nutrition: on glycine
  it is the predominant isozyme forming serine from glycine and one-carbon units, and it contributes one-carbon
  units but little glycine when both amino acids are present. Shm1 acts in parallel with the cytosolic
  paralog Shm2 and with Gly1 and Agx1 in glycine/serine interconversion; the classical tmp3 mutant is
  shm1.'
