- term:
    id: GO:0032183
    label: SUMO binding
  evidence_type: IDA
  original_reference_id: PMID:23644018
  review:
    summary: Sumoylated yeast Ubc9 (Ubc9*SUMO, Lys153) cooperates with charged Ubc9~SUMO through non-covalent backside
      SUMO binding to promote SUMO chain assembly.
    action: NEW
    reason: This is a non-covalent SUMO-binding activity distinct from the covalent thioester. It is demonstrated
      biochemically for the yeast protein and underlies the regulatory, non-catalytic role of Ubc9*SUMO in chain
      formation and meiotic synapsis. It is non-core relative to the E2 activity. It also gives a functional reading
      of the many reported Ubc9-Smt3 interactions.
    supported_by:
    - reference_id: PMID:23644018
      supporting_text: Ubc9(*)SUMO cooperates with charged Ubc9 (Ubc9~SUMO) by noncovalent backside SUMO binding
        and by positioning the donor SUMO for optimal transfer
