- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10688190
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q12306
  review:
    summary: High-throughput interaction study (two-hybrid or complex purification) reporting Ubc9 binding to Smt3
      (Q12306).
    action: REMOVE
    reason: Bare protein binding carries no functional information. The Ubc9-Smt3 interaction is genuine, but its
      functional content is captured by SUMO conjugating enzyme activity (the E2 thioester relay; PMID:9341106,
      PMID:9435231) and by the NEW non-covalent SUMO binding row (PMID:23644018). These large-scale datasets cannot
      say which of these interactions they detected, so they do not support a more specific MF. Removing the row
      does not mean the interaction is false.
    supported_by:
    - &id001
      reference_id: PMID:9341106
      supporting_text: Ubc9p was found to form a thioester with Smt3p, indicating that Ubc9p is the functional analog
        of E2s in the Smt3p pathway
