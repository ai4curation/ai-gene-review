core_functions:
- description: SUMO E2 conjugating enzyme. Ubc9 forms a Cys93 thioester with Smt3 and transfers Smt3 to substrate
    lysines (e.g. septins with Siz1, PCNA). It is the only Smt3 E2 in S. cerevisiae. The activity is established
    experimentally in this species, and the IBA at PAINT node PTN000629675 shows it is shared across the eukaryotic
    Ubc9 clade (PTHR24067:SF248 and SF280).
