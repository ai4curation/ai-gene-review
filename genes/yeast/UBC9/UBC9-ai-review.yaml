id: P50623
gene_symbol: UBC9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ubc9 is the sole SUMO (Smt3) conjugating enzyme (E2) of Saccharomyces cerevisiae. It is an essential
  157-residue UBC-fold protein. Ubc9 accepts Smt3 from the Aos1-Uba2 (Sua1-Uba2) E1 onto its active-site Cys93 as
  a thioester, and transfers it to lysines on target proteins, either directly or helped by SP-RING E3s such as
  Siz1/Siz2. Characterised substrates include the septins and PCNA. Ubc9 is mainly nuclear and associates with chromosomes,
  including meiotic chromosomes, where sumoylation promotes synaptonemal complex formation. A small fraction of
  Ubc9 is itself sumoylated at Lys153. This form loses classical E2 activity and instead acts as a cofactor for
  SUMO chain assembly through non-covalent backside SUMO binding. Loss of Ubc9 arrests the cell cycle at G2/M, a
  consequence of the loss of essential sumoylation.
existing_annotations:
- term:
    id: GO:0000022
    label: mitotic spindle elongation
  evidence_type: IMP
  original_reference_id: PMID:7800043
  qualifier: involved_in
  review:
    summary: Depleting UBC9 arrests cells at G2/early M with a short spindle. The annotation reads this arrest phenotype
      as participation in mitotic spindle elongation.
    action: MARK_AS_OVER_ANNOTATED
    reason: In the 1995 study the short spindle is one feature of a terminal G2/M arrest after UBC9 repression.
      At the time UBC9 was thought to be a ubiquitin E2 for cyclin degradation. Ubc9 was later shown to be the SUMO
      E2, with no detectable ubiquitin thioester (PMID:9341106). The spindle defect is a pleiotropic consequence
      of losing essential sumoylation and cell-cycle progression. It does not show that Ubc9 does any of the work
      of spindle elongation. The phenotype is real, so the annotation is not wrong, but it over-reaches as a process
      claim.
    supported_by:
    - reference_id: PMID:7800043
      supporting_text: Repression of UBC9 synthesis prevents cell cycle progression at the G2 or early M phase,
        causing the accumulation of large budded cells with a single nucleus, a short spindle and replicated DNA
    - reference_id: PMID:9341106
      supporting_text: While we were unable to detect formation of a Ub approximately Ubc9p thioester
