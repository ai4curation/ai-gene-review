    - rubric: specificity
      score: 4
    overall_notes: SUMO-conjugating enzyme and autosumoylation are correct, but cyclin
      degradation and APC-mediated proteolysis are stale claims from before Ubc9 was
      shown to be the SUMO E2.
- source: Alliance_Automated
  text: Enables SUMO transferase activity. Involved in mitotic spindle elongation
    and protein sumoylation. Located in condensed nuclear chromosome. Used to study
    cancer. Human ortholog(s) of this gene implicated in disease of cellular proliferation.
    Orthologous to human UBE2I (ubiquitin conjugating enzyme E2 I).
  source_type: automated
