    - rubric: specificity
      score: 4
    overall_notes: SUMO E2 for septins and PCNA is correct, but the S- and M-phase
      cyclin degradation claim reflects its early misidentification as a ubiquitin
      E2.
- source: Alliance_Imported
  text: SUMO-conjugating enzyme involved in the Smt3p conjugation pathway; nuclear
    protein required for S- and M-phase cyclin degradation and mitotic control; involved
    in proteolysis mediated by the anaphase-promoting complex cyclosome (APCC); auto-sumoylates
    on K153 and K157
  source_type: curated
  url: https://www.yeastgenome.org/locus/UBC9
