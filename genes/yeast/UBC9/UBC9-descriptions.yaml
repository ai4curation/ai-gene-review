findings:
- category: discrepancy
  text: UniProt and SGD say Ubc9 is needed for S- and M-phase cyclin degradation.
    The review explains that this came from the 1995 view of Ubc9 as a ubiquitin E2
    and that the G2/M arrest reflects loss of sumoylation.
  sources:
  - UniProt
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: All name the SUMO E2, but UniProt and SGD still carry the outdated
    cyclin-degradation role.
