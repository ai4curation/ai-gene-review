descriptions:
- source: UniProt
  text: E2 ubiquitin-like--protein ligase mediating SUMO/Smt3 attachment to septins
    and PCNA. Seems to be involved in degradation of S- (CLB5) and M-phase cyclins
    (CLB2).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50623
