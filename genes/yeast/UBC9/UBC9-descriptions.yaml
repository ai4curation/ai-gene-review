descriptions:
- source: UniProt
  text: E2 ubiquitin-like--protein ligase mediating SUMO/Smt3 attachment to septins
    and PCNA. Seems to be involved in degradation of S- (CLB5) and M-phase cyclins
    (CLB2).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50623
  source_id: P50623
- source: Alliance_Imported
  text: SUMO-conjugating enzyme involved in the Smt3p conjugation pathway; nuclear
    protein required for S- and M-phase cyclin degradation and mitotic control; involved
    in proteolysis mediated by the anaphase-promoting complex cyclosome (APCC); auto-sumoylates
    on K153 and K157
  source_type: curated
  url: https://www.yeastgenome.org/locus/UBC9
  source_id: SGD:S000002222
- source: Alliance_Automated
  text: Enables SUMO transferase activity. Involved in mitotic spindle elongation
    and protein sumoylation. Located in condensed nuclear chromosome. Used to study
    cancer. Human ortholog(s) of this gene implicated in disease of cellular proliferation.
    Orthologous to human UBE2I (ubiquitin conjugating enzyme E2 I).
  source_type: automated
  url: https://www.yeastgenome.org/locus/UBC9
  source_id: SGD:S000002222
