descriptions:
- source: UniProt
  text: Catalytic subunit of the TRAMP complex which has a poly(A) RNA polymerase
    activity and is involved in a post-transcriptional quality control mechanism limiting
    inappropriate expression of genetic information. Polyadenylation is required for
    the degradative activity of the exosome on several of its nuclear RNA substrates
    like cryptic transcripts generated by RNA polymerase II and III, or hypomethylated
    pre-tRNAi-Met. Polyadenylates RNA processing and degradation intermediates of
    snRNAs, snoRNAs and mRNAs that accumulate in strains lacking a functional exosome.
    TRF4 is also required for proper nuclear division in mitosis, DNA damage repair
    and sister chromatid cohesion. Involved in the regulation of histone mRNA levels.
    May mediate mitotic chromosome condensation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53632
  source_id: P53632
- source: Alliance_Imported
  text: Non-canonical poly(A) polymerase; involved in nuclear RNA degradation as a
    component of TRAMP; catalyzes polyadenylation of hypomodified tRNAs, and snoRNA
    and rRNA precursors; required for mRNA surveillance and maintenance of genome
    integrity, serving as a link between RNA and DNA metabolism; overlapping but non-redundant
    functions with Trf5p; relocalizes to cytosol in response to hypoxia
  source_type: curated
  url: https://www.yeastgenome.org/locus/PAP2
  source_id: SGD:S000005475
- source: Alliance_Automated
  text: Enables 5'-deoxyribose-5-phosphate lyase activity and poly(A) RNA polymerase
    activity. Contributes to 3'-5' RNA helicase activity. Involved in several processes,
    including DNA metabolic process; RNA catabolic process; and RNA processing. Located
    in cytosol and nucleolus. Part of TRAMP complex. Orthologous to human TENT4A (terminal
    nucleotidyltransferase 4A) and TENT4B (terminal nucleotidyltransferase 4B).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PAP2
  source_id: SGD:S000005475
