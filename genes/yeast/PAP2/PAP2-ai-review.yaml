id: P53632
gene_symbol: PAP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: PAP2 (also known as TRF4) encodes the catalytic poly(A) RNA polymerase
  subunit of the TRAMP complex (Trf4/Air2/Mtr4 polyadenylation complex) in S. cerevisiae.
  It adds short adenosine tails to aberrant and specialized nuclear RNAs, marking
  them for degradation by the nuclear exosome. Substrates include hypomodified tRNAs,
  pre-rRNAs, snoRNA precursors, cryptic unstable transcripts (CUTs), histone mRNAs,
  and snRNA processing intermediates. PAP2 was originally identified as a topoisomerase
  I-related function gene and was erroneously thought to be a DNA polymerase; it was
  definitively shown to lack DNA polymerase activity and to function exclusively as
  a poly(A) RNA polymerase. PAP2 also possesses an intrinsic 5'-deoxyribose-5-phosphate
  lyase activity with a possible role in base excision DNA repair. Indirectly, through
  its RNA surveillance function, PAP2 contributes to genome integrity by preventing
  R-loop accumulation and by maintaining nuclear cap-binding complex availability
  during meiosis.
