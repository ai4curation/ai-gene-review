- id: PMID:15828860
  title: A new yeast poly(A) polymerase complex involved in RNA quality control.
  findings:
  - statement: Trf4p is the catalytic subunit of a poly(A) polymerase complex containing
      Air1/Air2 and Mtr4p that discriminates between correctly and incorrectly folded
      tRNAs.
    supporting_text: Trf4p is the catalytic subunit of a new poly(A) polymerase complex
      that contains Air1p or Air2p as potential RNA-binding subunits, as well as the
      putative RNA helicase Mtr4p
- id: PMID:15935758
  title: RNA degradation by the exosome is promoted by a nuclear polyadenylation complex.
  findings:
  - statement: The TRAMP complex (Trf4/Air2/Mtr4) has distributive polyadenylation
      activity that stimulates exosome-mediated RNA degradation.
    supporting_text: the Trf4p/Air2p/Mtr4p polyadenylation complex (TRAMP) showed
      distributive RNA polyadenylation activity
- id: PMID:15935759
  title: Cryptic pol II transcripts are degraded by a nuclear quality control pathway
    involving a new poly(A) polymerase.
  findings:
  - statement: Trf4-dependent polyadenylation targets cryptic pol II transcripts for
      exosome degradation.
    supporting_text: RNAs originating from these regions are rapidly degraded by the
      combined action of the exosome and a new poly(A) polymerase activity that is
      defined by the Trf4 protein
- id: PMID:16260630
  title: Trf4 and Trf5 proteins of Saccharomyces cerevisiae exhibit poly(A) RNA polymerase
    activity but no DNA polymerase activity.
  findings:
  - statement: Trf4 and Trf5 have robust poly(A) polymerase activity but no DNA polymerase
      activity. Activity is Mn2+-dependent and ATP-specific.
    supporting_text: both proteins exhibit a robust poly(A) polymerase activity, neither
      of them shows any evidence of a DNA polymerase activity
- id: PMID:16373491
  title: Contributions of Trf4p- and Trf5p-dependent polyadenylation to the processing
    and degradative functions of the yeast nuclear exosome.
  findings:
  - statement: Trf4 and Trf5 contribute distinct polyadenylation activities to exosome
      processing including U4 snRNA 3'-end processing.
    supporting_text: in the absence of Trf4p, we observed 3'-extended forms of the
      U4 snRNA
- id: PMID:16374505
  title: Yeast Trf5p is a nuclear poly(A) polymerase.
  findings:
  - statement: Trf5p forms a TRAMP5 complex with partially overlapping functions to
      TRAMP4 (Trf4-containing).
    supporting_text: Trf5p co-purified with Mtr4p and Air1p, indicating that it forms
      a complex, designated TRAMP5
- id: PMID:16429126
  title: Proteome survey reveals modularity of the yeast cell machinery.
  findings: []
- id: PMID:16431988
  title: 'Nuclear RNA surveillance in Saccharomyces cerevisiae: Trf4p-dependent polyadenylation
    of nascent hypomethylated tRNA and an aberrant form of 5S rRNA.'
  findings:
  - statement: Trf4p polyadenylates both hypomodified tRNA and aberrant 5S rRNA for
      nuclear surveillance.
    supporting_text: Trf4p-dependent polyadenylation of nascent hypomethylated tRNA
      and an aberrant form of 5S rRNA
- id: PMID:16541108
  title: Surveillance of nuclear-restricted pre-ribosomes within a subnucleolar region
    of Saccharomyces cerevisiae.
  findings:
  - statement: Pre-ribosome surveillance occurs in a subnucleolar region involving
      Trf4.
    supporting_text: Surveillance of nuclear-restricted pre-ribosomes within a subnucleolar
      region
- id: PMID:16973436
  title: Termination of cryptic unstable transcripts is directed by yeast RNA-binding
    proteins Nrd1 and Nab3.
  findings:
  - statement: CUT termination by Nrd1/Nab3 is coupled to TRAMP-mediated degradation.
    supporting_text: Termination of cryptic unstable transcripts is directed by yeast
      RNA-binding proteins Nrd1 and Nab3
- id: PMID:17179095
  title: Contribution of Trf4/5 and the nuclear exosome to genome stability through
    regulation of histone mRNA levels in Saccharomyces cerevisiae.
  findings:
  - statement: Trf4/5 and nuclear exosome regulate histone mRNA levels for genome
      stability.
    supporting_text: Contribution of Trf4/5 and the nuclear exosome to genome stability
      through regulation of histone mRNA levels
- id: PMID:17410208
  title: Dissecting mechanisms of nuclear mRNA surveillance in THO/sub2 complex mutants.
  findings:
  - statement: Trf4 participates in nuclear mRNA surveillance revealed through THO/sub2
      mutant analysis.
    supporting_text: Dissecting mechanisms of nuclear mRNA surveillance in THO/sub2
      complex mutants
- id: PMID:17643380
  title: The exosome subunit Rrp44 plays a direct role in RNA substrate recognition.
  findings:
  - statement: Rrp44 directly recognizes RNA substrates including TRAMP-polyadenylated
      species.
    supporting_text: The exosome subunit Rrp44 plays a direct role in RNA substrate
      recognition
- id: PMID:17983848
  title: Intrinsic 5'-deoxyribose-5-phosphate lyase activity in Saccharomyces cerevisiae
    Trf4 protein with a possible role in base excision DNA repair.
  findings:
  - statement: Trf4 has intrinsic dRP lyase activity via Schiff base mechanism, with
      genetic evidence for role in BER parallel to Rad27-dependent LP-BER.
    supporting_text: Trf4 is able to form a Schiff base intermediate with a 5'-deoxyribose-5-phosphate
      substrate and to excise the abasic residue through a dRP lyase activity
- id: PMID:18007593
  title: Trf4 targets ncRNAs from telomeric and rDNA spacer regions and functions
    in rDNA copy number control.
  findings:
  - statement: Trf4 targets telomeric and rDNA spacer ncRNAs and participates in rDNA
      copy number control.
    supporting_text: Trf4 targets ncRNAs from telomeric and rDNA spacer regions and
      functions in rDNA copy number control
- id: PMID:18022365
  title: Antisense RNA stabilization induces transcriptional gene silencing via histone
    deacetylation in S. cerevisiae.
  findings:
  - statement: Trf4-mediated degradation of antisense transcripts prevents gene silencing.
    supporting_text: Antisense RNA stabilization induces transcriptional gene silencing
      via histone deacetylation
- id: PMID:18456844
  title: Competition between the Rex1 exonuclease and the La protein affects both
    Trf4p-mediated RNA quality control and pre-tRNA maturation.
  findings:
  - statement: Rex1 and La protein compete to modulate Trf4-mediated tRNA quality
      control.
    supporting_text: Competition between the Rex1 exonuclease and the La protein affects
      both Trf4p-mediated RNA quality control and pre-tRNA maturation
- id: PMID:18591258
  title: A yeast exosome cofactor, Mpp6, functions in RNA surveillance and in the
    degradation of noncoding RNA transcripts.
  findings:
  - statement: Mpp6 cooperates with TRAMP in ncRNA degradation.
    supporting_text: Mpp6, functions in RNA surveillance and in the degradation of
      noncoding RNA transcripts
- id: PMID:18951092
  title: Polyadenylation linked to transcription termination directs the processing
    of snoRNA precursors in yeast.
  findings:
  - statement: snoRNA precursor processing is directed by polyadenylation linked to
      transcription termination.
    supporting_text: Polyadenylation linked to transcription termination directs the
      processing of snoRNA precursors in yeast
- id: PMID:19369424
  title: Regulation of NAB2 mRNA 3'-end formation requires the core exosome and the
    Trf4p component of the TRAMP complex.
  findings:
  - statement: NAB2 mRNA 3'-end formation requires Trf4/TRAMP and the exosome.
    supporting_text: Regulation of NAB2 mRNA 3'-end formation requires the core exosome
      and the Trf4p component of the TRAMP complex
- id: PMID:20566885
  title: Structural analysis reveals the characteristic features of Mtr4, a DExH helicase
    involved in nuclear RNA processing and surveillance.
  findings:
  - statement: Mtr4 structural features explain its role in TRAMP-mediated RNA processing.
    supporting_text: Structural analysis reveals the characteristic features of Mtr4,
      a DExH helicase involved in nuclear RNA processing and surveillance
- id: PMID:20696927
  title: Structure and function of the polymerase core of TRAMP, a RNA surveillance
    complex.
  findings:
  - statement: Crystal structure of Trf4p/Air2p at 2.7A reveals conserved nucleotidyltransferase
      fold and Air2p modulation of catalytic activity.
    supporting_text: Air2p, and in particular sequences encompassing a zinc knuckle
      motif near its N terminus, modulate Trf4p activity
- id: PMID:21663793
  title: The RNA helicase Mtr4p modulates polyadenylation in the TRAMP complex.
  findings:
  - statement: Mtr4 helicase modulates TRAMP polyadenylation activity.
    supporting_text: The RNA helicase Mtr4p modulates polyadenylation in the TRAMP
      complex
- id: PMID:22319136
  title: The TRAMP complex shows tRNA editing activity in S. cerevisiae.
  findings:
  - statement: TRAMP complex can perform tRNA editing at introduced substrates due
      to distributive polymerase promiscuity.
    supporting_text: the noncanonical poly(A) polymerase Trf4p in the TRAMP complex
      can be recruited for such an editing reaction at an introduced tRNA transcript
- id: PMID:22532666
  title: RNA unwinding by the Trf4/Air2/Mtr4 polyadenylation (TRAMP) complex.
  findings:
  - statement: TRAMP robustly unwinds RNA duplexes; Trf4p/Air2p stimulate Mtr4p helicase
      activity.
    supporting_text: The unwinding activity of Mtr4p is significantly stimulated by
      Trf4p/Air2p
- id: PMID:22932476
  title: The nuclear localization of SWI/SNF proteins is subjected to oxygen regulation.
  findings:
  - statement: Large-scale GFP study detected Trf4 in both nucleus and cytosol.
    supporting_text: The nuclear localization of SWI/SNF proteins is subjected to
      oxygen regulation
- id: PMID:23222640
  title: Global analysis of yeast mRNPs.
  findings:
  - statement: PAP2/Trf4 identified as mRNA-binding protein in global mRNP analysis.
    supporting_text: Global analysis of yeast mRNPs
- id: PMID:23762389
  title: R-loop mediated transcription-associated recombination in trf4Δ mutants reveals
    new links between RNA surveillance and genome integrity.
  findings:
  - statement: trf4-delta causes R-loop accumulation and transcription-associated
      hyperrecombination, linking RNA surveillance to genome integrity.
    supporting_text: in the absence of Trf4 R-loops accumulate co-transcriptionally
      increasing the recombination and mutation frequencies
- id: PMID:25210768
  title: The nuclear exosome is active and important during budding yeast meiosis.
  findings:
  - statement: TRAMP mutants stabilize CUTs that saturate CBC, causing meiotic DSB
      formation defects.
    supporting_text: CBC mutants display defects in the formation of meiotic double
      strand breaks (DSBs), and we see similar defects in TRAMP mutants
- id: PMID:27076633
  title: Exosome Cofactors Connect Transcription Termination to RNA Processing by
    Guiding Terminated Transcripts to the Appropriate Exonuclease within the Nuclear
    Exosome.
  findings:
  - statement: Exosome cofactors including TRAMP guide terminated transcripts to appropriate
      exonucleases.
    supporting_text: Exosome Cofactors Connect Transcription Termination to RNA Processing
- id: PMID:32561742
  title: Substrate specificity of the TRAMP nuclear surveillance complexes.
  findings:
  - statement: Three distinct TRAMP complexes form in vivo with different substrate
      preferences. Trf4 and Trf5 confer binding specificity.
    supporting_text: on many substrates, including pre-rRNAs and pre-mRNAs, binding
      specificity is apparently conferred by Trf4 and Trf5
- id: PMID:37070168
  title: RNA-dependent interactome allows network-based assignment of RNA-binding
    protein function.
  findings: []
- id: PMID:37968396
  title: The social and structural architecture of the yeast protein interactome.
  findings: []
- id: PMID:39752526
  title: TRAMP assembly alters the conformation and RNA binding of Mtr4 and Trf4-Air2.
  findings:
  - statement: Reconstituted yeast Trf4-Air2-Mtr4 TRAMP assembly constrains peripheral
      RNA-recognition surfaces on Mtr4 and Air2, and tRNA binding by assembled TRAMP
      differs from binding by isolated Mtr4 or Trf4-Air2 subcomplexes.
    supporting_text: We further show that tRNA binding by single active-site subunits,
      Mtr4 and Trf4-Air2, differs from the double active-site TRAMP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified final 2025 PNAS primary paper, apparently updated
      from the 2024 bioRxiv preprint PMID:39211223. It directly refines the mechanism
      of yeast Trf4-Air2-Mtr4 TRAMP assembly, conformational coupling and RNA transfer.
