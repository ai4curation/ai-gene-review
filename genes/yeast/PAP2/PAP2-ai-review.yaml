core_functions:
- description: PAP2/Trf4 is the catalytic poly(A) RNA polymerase subunit of the TRAMP
    complex. Within the TRAMP complex, it adds short poly(A) tails to aberrant and
    specialized nuclear RNAs, marking them for degradation by the nuclear exosome.
    This is the primary surveillance polyadenylation function that targets CUTs, hypomodified
    tRNAs, pre-rRNAs, snoRNA precursors, snRNA intermediates, histone mRNAs, and antisense
    transcripts.
  supported_by:
  - reference_id: PMID:15935758
    supporting_text: In vitro, the Trf4p/Air2p/Mtr4p polyadenylation complex (TRAMP)
      showed distributive RNA polyadenylation activity
  - reference_id: PMID:39752526
    supporting_text: The two enzyme activities of the TRAMP complex ensure that an
      RNA substrate is polyadenylated at its 3′ end and actively unwound before entering
      the exosome
    reference_section_type: INTRODUCTION
  - reference_id: file:yeast/PAP2/PAP2-deep-research-bioreason-sft.md
    supporting_text: '[BioReason] A nuclear RNA-surveillance enzyme that adds short
      adenosine tails to aberrant and specialized RNAs to mark them for exosome-mediated
      decay'
  molecular_function:
    id: GO:1990817
    label: poly(A) RNA polymerase activity
