- id: file:yeast/PAP2/PAP2-deep-research-falcon.md
  title: Falcon deep research report on PAP2/TRF4 (Saccharomyces cerevisiae)
  findings:
  - statement: 'PAP2/TRF4 (UniProt P53632; ORF YOL115W) encodes Trf4, a non-canonical
      poly(A) RNA

      polymerase that functions in nuclear RNA surveillance as part of the TRAMP complex

      (Trf4/5-Air1/2-Mtr4), distinct from canonical mRNA poly(A) polymerases and from

      "PAP2" usages in other organisms.

      '
    supporting_text: The UniProt accession **P53632** corresponds to *S. cerevisiae*
      **TRF4**, also annotated as **PAP2** and **YOL115W**, encoding a **non-canonical
      poly(A) RNA polymerase** that functions in nuclear RNA surveillance as part
      of the **TRAMP** complex (Trf4/5–Air1/2–Mtr4). This is distinct from other “PAP2”
      usages in other organisms and from canonical mRNA poly(A) polymerases.
    reference_section_type: RESULTS
  - statement: 'Trf4 is the catalytic poly(A) polymerase subunit of a nuclear RNA
      quality-control

      system that uses short oligo(A) tailing to channel defective or unstable RNAs
      to the

      nuclear RNA exosome for 3''->5'' processing or degradation.

      '
    supporting_text: PAP2/TRF4 encodes **Trf4**, the **catalytic poly(A) polymerase**
      subunit of a nuclear RNA quality-control system that uses **short oligo(A) tailing**
      to channel defective or unstable RNAs to the **nuclear RNA exosome** for 3′→5′
      processing/degradation.
    reference_section_type: RESULTS
  - statement: 'Trf4 is a non-templated poly(A) RNA polymerase that adds adenosines
      to the free

      3''-OH of RNA substrates; catalysis depends on conserved aspartate residues
      and

      biochemical assays report a preference for Mn2+.

      '
    supporting_text: Trf4 is a **non-templated poly(A) RNA polymerase** that adds
      adenosines to the **free 3′-OH** of RNA substrates.
    reference_section_type: RESULTS
  - statement: 'Trf4 alone is inactive; the minimal active surveillance polymerase
      is a heteromer of

      Trf4 plus Air1 or Air2, consistent with Trf4 lacking an intrinsic RNA-binding
      domain

      and relying on Air proteins for substrate engagement.

      '
    supporting_text: A key biochemical result is that **Trf4 alone is inactive**;
      the minimal active surveillance polymerase is a **heteromer** of **Trf4 + Air1
      or Air2**, consistent with Trf4 lacking an intrinsic RNA-binding domain and
      relying on Air proteins for substrate engagement.
    reference_section_type: RESULTS
  - statement: 'A best-defined substrate class is defective tRNAs, particularly hypomodified
      or

      structurally abnormal initiator tRNAi-Met; Trf4 complexes preferentially

      polyadenylate aberrant/unmodified tRNAs over correctly folded native tRNAs,

      reflecting recognition of structural defects rather than a simple unmodified-vs-modified
      rule.

      '
    supporting_text: Trf4-containing complexes preferentially polyadenylate **aberrant/unmodified**
      tRNAs over correctly folded native tRNAs, indicating recognition of **structural
      defects** rather than a simple “unmodified vs modified” rule.
    reference_section_type: RESULTS
  - statement: 'TRAMP-added tails are typically short in productive surveillance;
      the distribution

      peaks at ~4-5 adenosines with Mtr4-mediated suppression of extension after ~3-5
      A,

      consistent with oligoadenylation acting as an exosome-engagement handle rather
      than a

      stabilizing poly(A) tail. Uncoupled from degradation in vitro, Trf4 complexes
      can add

      much longer tails (~60-70 nt).

      '
    supporting_text: One synthesis places the distribution peak at ~**4–5 A** and
      describes **Mtr4-mediated suppression** of extension after ~**3–5 A**, consistent
      with oligoadenylation serving as an exosome-engagement handle rather than a
      stabilizing poly(A) tail.
    reference_section_type: RESULTS
  - statement: 'TRAMP is the principal nuclear exosome cofactor for degrading pervasive
      transcripts

      and many ncRNAs; Trf4-Air2 is particularly connected to NNS-terminated ncRNA
      decay,

      and Nrd1 can recognize a motif in Trf4 resembling the RNAPII CTD via its CID,
      coupling

      ncRNA termination to exosome targeting.

      '
    supporting_text: TRAMP is a major cofactor for degrading pervasive nuclear transcripts
      and many ncRNAs generated by widespread RNA polymerase II transcription. Trf4–Air2
      is particularly connected to NNS-terminated ncRNA decay, helping prevent accumulation
      of potentially deleterious pervasive transcripts.
    reference_section_type: DISCUSSION
  - statement: 'TRAMP is a nuclear RNA surveillance system; GFP-fusion evidence indicates
      slight

      nucleolar enrichment for some components, and Trf4-GFP can accumulate in the
      nucleolus

      under conditions that cause nucleolar rRNA accumulation, supporting dynamic
      nucleolar

      engagement when substrates build up.

      '
    supporting_text: GFP-fusion evidence indicates **slight nucleolar enrichment**
      for some TRAMP components (Trf5-GFP, Air1-GFP) compared to Trf4-GFP/Air2-GFP,
      and Trf4-GFP can accumulate in the nucleolus under conditions that cause nucleolar
      rRNA accumulation—supporting **dynamic nucleolar engagement** when substrates
      build up.
    reference_section_type: RESULTS
  - statement: 'The expert synthesis frames TRAMP as an exosome specificity and activation
      system

      rather than merely an RNA tailing enzyme: oligoadenylation, Air RNA-binding,
      Mtr4

      helicase activity, and exosome nucleases jointly determine whether RNAs are
      protected,

      processed, or degraded.

      '
    supporting_text: 'a consistent expert view is that TRAMP should be understood
      as an **exosome specificity and activation system**, not merely an RNA tailing
      enzyme: oligoadenylation, RNA-binding (Air proteins), helicase activity (Mtr4),
      and exosome nucleases jointly determine whether RNAs are protected, processed,
      or degraded.'
    reference_section_type: DISCUSSION
  - statement: 'In yeast, TRAMP-mediated nuclear decay can in some contexts occur
      without requiring

      new TRAMP oligoadenylation activity, consistent with models in which targeted
      RNAs may

      already bear tails suitable for Mtr4/exosome engagement.

      '
    supporting_text: It also notes that in yeast, TRAMP-mediated nuclear decay can
      occur **without requiring TRAMP oligoadenylation activity** in some contexts,
      consistent with models in which targeted RNAs may already bear tails suitable
      for Mtr4/exosome engagement.
    reference_section_type: DISCUSSION
