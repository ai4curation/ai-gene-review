- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:10409741
  qualifier: involved_in
  review:
    summary: 'Cdc4 drives the G1/S transition as the WD40 F-box substrate receptor of SCF(Cdc4): it captures
      multisite-phosphorylated Sic1 for Cdc34-dependent ubiquitination and proteasomal destruction, releasing
      Clb5/6-Cdc28 to initiate DNA replication.'
    action: ACCEPT
    reason: 'Core biological process. Sic1 destruction at Start is the founding SCF paradigm: cdc4 mutants
      arrest at G1/S with stabilised Sic1, the arrest is bypassed by SIC1 deletion, and Cdc4-Skp1 is the
      receptor that binds phospho-Sic1 in the reconstituted SCF(Cdc4) ubiquitination reaction. Cdc4 performs
      the recognition step itself (the participation test is met), and the same term is carried by the
      human CKI adaptor SKP2 and used for Cdc4 in the repository G1/S module. This paper re-examined cdc4
      alleles and confirmed that the G1/S block of cdc4-12 and cdc4-delta cells is abolished by SIC1 deletion.'
    supported_by:
    - &id027
      reference_id: PMID:10409741
      supporting_text: Sic1, necessary for G(1)/S transition
    - reference_id: PMID:10409741
      supporting_text: abolished by the deletion of the SIC1 gene
    - &id022
      reference_id: file:yeast/CDC4/CDC4-deep-research-falcon.md
      supporting_text: Sic1 destruction releases S-phase Clb–Cdk activity, promoting the G1/S transition
        and DNA-replication initiation.
