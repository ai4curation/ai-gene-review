suggested_questions:
- question: Which substrate underlies the Sic1-independent G2/M requirement for Cdc4 (cdc4 sic1-delta
    cells arrest before anaphase and the arrest is relieved by PDS1 deletion)? Is there a direct SCF(Cdc4)
    target among mitotic regulators, or is the effect indirect?
- question: Should the established phosphodegron substrates now recorded as bare protein binding on Cdc4
    (Sic1, Rcn1) and the later ones absent from GOA (Far1, Cdc6, Gcn4, Swi5, Ash1, Eco1, Hst3, Tec1, Ame1)
    be modelled as has_input on the Cdc4 adaptor activity in a GO-CAM, rather than as GO:0005515 rows?
- question: Is Cdc4 homodimerisation through the D domain required for productive ubiquitination of all
    substrates, or only for those whose lysines lie far from the degron, and should a dimerisation activity
    be represented alongside the adaptor activity?
suggested_experiments:
- hypothesis: The G2/M function of Cdc4 is mediated by a specific phosphodegron substrate whose stabilisation,
    not Pds1 turnover per se, causes the preanaphase arrest.
  description: Compare ubiquitin-remnant (diGly) proteomes of cdc4-12 sic1-delta and wild-type cells released
    from hydroxyurea at the restrictive temperature, filter candidates by Cdc4-phosphodegron motifs and
    Cdc4-WD40 binding, and test whether degron-mutant alleles of the top candidates reproduce the preanaphase
    arrest.
  experiment_type: conditional-allele ubiquitinome with degron mutagenesis
- hypothesis: Ubiquitin binding by the Cdc4 WD40 propeller regulates only Cdc4 autoubiquitination and
    does not affect substrate ubiquitination kinetics in vivo.
  description: Introduce the ubiquitin-binding-defective propeller mutations at the endogenous CDC4 locus
    and measure Sic1, Far1 and Cdc6 half-lives by cycloheximide chase and single-cell G1/S timing, with
    Cdc4 turnover measured in parallel.
  experiment_type: separation-of-function allele degradation kinetics
