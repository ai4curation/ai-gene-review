gene_symbol: CDC4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Cdc4 is the WD40-repeat F-box protein that serves as the substrate-recognition subunit of
  the SCF(Cdc4) ubiquitin ligase (Skp1-Cdc53/cullin-Hrt1/Rbx1-Cdc4) of Saccharomyces cerevisiae and is
  the founding member of the FBXW7 family. Its N-terminal region carries a nuclear localisation signal
  and a dimerisation (D) domain, the F-box binds Skp1 to tether it to the Cdc53 scaffold, and its C-terminal
  eight-bladed WD40 beta-propeller reads short phosphorylated degrons (Cdc4 phosphodegrons), typically
  diphosphorylated or clustered suboptimal motifs generated by Cdc28/Cdk1, Pho85, Mck1 or Cdc7 priming.
  Cdc4 has no catalytic activity: it captures phosphorylated substrates and positions them for polyubiquitination
  by the Cdc34 E2 bound to the Cdc53-Hrt1 core, which commits them to proteasomal degradation. Its defining
  substrate is the Clb-Cdk inhibitor Sic1, whose multisite-phosphorylation-gated destruction at Start
  releases Clb5/6-Cdc28 to initiate DNA replication; cdc4 mutants therefore arrest at G1/S with replicated-DNA-negative,
  multibudded cells, and additionally show a Sic1-independent block at G2/M. Other substrates include
  the pheromone-arrest CKI Far1 (degraded only in the nucleus, where Cdc4 resides), the replication factor
  Cdc6, the transcription factors Gcn4, Swi5, Tec1 and Ash1, the calcineurin inhibitor Rcn1, the cohesin
  acetyltransferase Eco1, the deacetylase Hst3, kinetochore subunits, and the MAPKK Ste7, whose SCF(Cdc4)-dependent
  ubiquitination tunes MAPK specificity. The WD40 propeller also binds ubiquitin at a surface distinct
  from the degron pocket, which promotes Cdc4 autoubiquitination and turnover. Cdc4 is exclusively nuclear
  and is essential for mitotic growth and for several steps of meiosis.'
