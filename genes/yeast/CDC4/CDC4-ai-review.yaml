- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IGI
  original_reference_id: PMID:7954792
  qualifier: involved_in
  supporting_entities:
  - SGD:S000004069
  review:
    summary: 'Cdc4 has a second, mechanistically less-defined role at the G2/M transition: cdc4 mutants
      relieved of their Sic1-dependent G1 block by SIC1 deletion arrest before anaphase, and that preanaphase
      arrest is relieved by deleting PDS1.'
    action: KEEP_AS_NON_CORE
    reason: The G2/M requirement is genuine (cdc4-delta sic1-delta and cdc4-12 sic1-delta cells arrest
      at G2/M, and cdc4 alleles suppress cdc20-1), but the substrate through which SCF(Cdc4) acts here
      has not been identified, and it is a second role rather than the defining function of the adaptor.
      Kept as non-core, consistent with grading substrate-specific downstream processes below the Sic1/G1/S
      axis. The cached record of the founding Sic1 paper is abstract-only and foregrounds cdc34 and the
      G1/S role; the curator read the full text, in which the cdc4 sic1 double-mutant behaviour underlies
      the G2/M inference, and the same conclusion was reached explicitly by Goh and Surana (PMID:10409741).
      Deferring to SGD on the genetic-interaction evidence.
    additional_reference_ids:
    - PMID:10409741
    supported_by:
    - reference_id: PMID:7954792
      supporting_text: cdc34 mutants cannot enter S phase because they fail to destroy p40SIC1, which
        is a potent inhibitor of Clb but not Cln forms of the Cdc28 kinase.
    - &id001
      reference_id: PMID:10409741
      supporting_text: lacking the CDC4 gene are arrested both at G(1)/S and at G(2)/M
