core_functions:
- description: 'Substrate-recognition adaptor of the nuclear SCF(Cdc4) ubiquitin ligase: the F-box binds
    Skp1 on the Cdc53-Hrt1 scaffold while the WD40 beta-propeller captures multisite/diphosphorylated
    degrons on Sic1 (and Far1, Cdc6, Gcn4, Swi5, Ash1, Rcn1, Eco1) for Cdc34-dependent polyubiquitination
    and proteasomal destruction; Sic1 removal at Start releases Clb5/6-Cdc28 and drives the G1/S transition.'
  molecular_function: *id006
  directly_involved_in:
  - *id014
  - id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0019005
    label: SCF ubiquitin ligase complex
  supported_by:
  - *id003
  - *id004
  - *id016
  - *id008
  - *id012
  - *id027
- description: 'Phosphodegron reading by the WD40 propeller: Cdc4 binds correctly spaced phosphoserine/phosphothreonine
    pairs (for example Eco1 pThr94/pSer98 laid down by sequential Cdk1, Cdc7-Dbf4 and Mck1 action) and
    thereby discriminates which kinase inputs license ubiquitination, converting graded phosphorylation
    into switch-like protein turnover.'
  molecular_function:
    id: GO:0050815
    label: phosphoserine residue binding
