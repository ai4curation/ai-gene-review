- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IDA
  original_reference_id: PMID:9346239
  qualifier: contributes_to
  review:
    summary: As the substrate-recognition subunit of SCF(Cdc4), Cdc4 contributes to the ubiquitin ligase
      activity of the complex; the catalytic ubiquitin transfer is performed by Cdc34 docked on the Cdc53-Hrt1
      core.
    action: ACCEPT
    reason: 'Accepted on the contributes_to claim as seeded: E3 activity is a property of the assembled
      SCF(Cdc4) complex, and Cdc4 supplies the substrate-recognition arm without which the reconstituted
      complex has no substrate-directed activity. The molecular function of the subunit itself is best
      described as ubiquitin-like ligase-substrate adaptor activity (GO:1990756), which is proposed as
      the replacement for the bare protein-binding rows and used in core_functions. The reconstitution
      paper shows that Cdc4, Cdc53 and Skp1 assemble into an E3 that, with E1, Cdc34 and ubiquitin, ubiquitinates
      phospho-Sic1, and that the Cdc4/Skp1 subcomplex is the substrate-binding part.'
    supported_by:
    - &id015
      reference_id: PMID:9346239
      supporting_text: When mixed together, SCFCdc4p subunits, E1 enzyme, the E2 enzyme Cdc34p, and ubiquitin
        are sufficient to reconstitute ubiquitination of Cdk-phosphorylated Sic1p.
    - &id016
      reference_id: PMID:9346239
      supporting_text: Phosphorylated Sic1p substrate is specifically targeted for ubiquitination by binding
        to a Cdc4p/Skp1p subcomplex.
    - reference_id: file:yeast/CDC4/CDC4-deep-research-falcon.md
      supporting_text: Thus, **Cdc4 selects substrates and orients them for ubiquitination; Cdc34 performs
        ubiquitin transfer**.
