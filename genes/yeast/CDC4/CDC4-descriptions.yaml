gene_symbol: CDC4
organism: yeast
uniprot_id: P07834
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Substrate recognition component of a SCF (SKP1-CUL1-F-box protein) E3 ubiquitin-protein
    ligase complex which mediates the ubiquitination and subsequent proteasomal degradation
    of target proteins. Recognizes and binds to phosphorylated target proteins. Directs
    ubiquitination of the phosphorylated CDK inhibitor SIC1. Involved in the degradation
    of CDC6 together with CDC34/UBC3 and CDC53, and in restricting the degradation
    of FAR1 to the nucleus. Is essential for initiation of DNA replication and separation
    of the spindle pole bodies to form the poles of the mitotic spindle. It also plays
    a role in bud development, fusion of zygotic nuclei after conjugation and various
    aspects of sporulation. Required for HTA1-HTB1 locus transcription activation.
    Required for G1/S and G2/M transition.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07834
  source_id: P07834
- source: Alliance_Imported
  text: 'F-box protein required for both the G1/S and G2/M phase transitions; modular
    substrate specificity factor which associates with core SCF (Cdc53p, Skp1p and
    Hrt1p/Rbx1p) to form the SCFCdc4 complex; SCFCdc4 acts as a ubiquitin-protein
    ligase directing ubiquitination of cyclin-dependent kinase (CDK) phosphorylated
    substrates, such as: Sic1p, Far1p, Cdc6p, Clb6p, and Cln3p'
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDC4
  source_id: SGD:S000001885
- source: Alliance_Automated
  text: Enables phosphoserine residue binding activity and ubiquitin binding activity.
    Contributes to ubiquitin protein ligase activity. Involved in several processes,
    including SCF-dependent proteasomal ubiquitin-dependent protein catabolic process;
    mitotic cell cycle phase transition; and protein ubiquitination. Located in nuclear
    matrix. Part of nuclear SCF ubiquitin ligase complex. Human ortholog(s) of this
    gene implicated in developmental delay, hypotonia, and impaired language. Orthologous
    to human FBXW7 (F-box and WD repeat domain containing 7).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDC4
  source_id: SGD:S000001885
