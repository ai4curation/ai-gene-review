core_functions:
- description: NADH-dependent reduction of DHAP to sn-glycerol 3-phosphate, the committed, rate-limiting
    step of glycerol synthesis that supplies osmolyte glycerol during hyperosmotic stress.
  molecular_function:
    id: GO:0141152
    label: glycerol-3-phosphate dehydrogenase (NAD+) activity
  directly_involved_in:
  - id: GO:0006114
    label: glycerol biosynthetic process
  - id: GO:0006973
    label: intracellular accumulation of glycerol
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005777
    label: peroxisome
  supported_by:
  - reference_id: PMID:8196651
    supporting_text: We have cloned a gene encoding the key enzyme of glycerol synthesis, the NADH-dependent
      cytosolic glycerol-3-phosphate dehydrogenase, and we named it GPD1.
  - reference_id: PMID:8196651
    supporting_text: gpd1 delta mutants produced very little glycerol, and they were sensitive to osmotic
      stress.
  - reference_id: PMID:9171333
    supporting_text: Mutants deleted for both GPD1 and GPD2 do not produce detectable glycerol, are highly
      osmosensitive and fail to grow under anoxic conditions.
  - reference_id: PMID:11676566
    supporting_text: These results demonstrate that GPDH, but not the glycerol 3-phosphatase, is rate-limiting
      for glycerol production.
  - *id001
  - reference_id: PMID:15210723
    supporting_text: Gpd1p, the other Gpd isoform, is partly cytosolic and partly peroxisomal and becomes
      more strictly peroxisomal in respiratory-deficient mutants.
suggested_questions:
- question: What does the peroxisomal pool of Gpd1p do metabolically (NADH reoxidation inside peroxisomes,
    a peroxisomal G3P shuttle), given that peroxisomal targeting is dispensable for beta-oxidation?
- question: Does nuclear Gpd1p under osmotic stress have a function beyond sequestration, e.g. linked
    to co-transported Pnc1p and chromatin silencing?
suggested_experiments:
- description: Express Gpd1p variants restricted to cytosol, peroxisome or nucleus (PTS2 deletion, PTS1/NLS
    fusions) in a gpd1 gpd2 background and measure glycerol production, osmotolerance and compartmental
    NADH/NAD+ ratios.
