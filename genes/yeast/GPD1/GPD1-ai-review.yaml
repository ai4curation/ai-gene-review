id: Q00055
gene_symbol: GPD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Gpd1p is the osmotically induced, NAD+-dependent glycerol-3-phosphate dehydrogenase (EC 1.1.1.8)
  of S. cerevisiae. It reduces dihydroxyacetone phosphate to sn-glycerol 3-phosphate using NADH, the first
  and rate-limiting step of glycerol synthesis; glycerol-3-phosphatases (Gpp1p/Gpp2p) then release glycerol.
  GPD1 transcription is induced through the HOG MAP kinase pathway, and gpd1 mutants make little glycerol
  and are osmosensitive, so Gpd1p is the main supplier of glycerol as a compatible solute during hyperosmotic
  stress. The reaction also reoxidizes cytosolic NADH and provides the glycerol-3-phosphate backbone for
  glycerolipid synthesis. Gpd1p is cytosolic and also imported into peroxisomes by an N-terminal PTS2
  (Pex7/Pex21-dependent), where it piggybacks the nicotinamidase Pnc1p; under osmotic stress a fraction
  moves to the nucleus. Its paralog Gpd2p has similar kinetics but is anaerobically induced and partly
  mitochondrial.
