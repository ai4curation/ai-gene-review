    overall_notes: 'Correct and detailed: NAD-dependent G3P dehydrogenase, HOG regulation,
      Ypk1/Ypk2 inhibitory phosphorylation, Pnc1 piggyback import into peroxisomes.
      The Ypk1/Ypk2 regulation is not in the review.'
- source: Alliance_Automated
  text: Enables glycerol-3-phosphate dehydrogenase (NAD+) activity. Involved in intracellular
    accumulation of glycerol and protein import into peroxisome matrix. Located in
    cytosol; nucleus; and peroxisome. Human ortholog(s) of this gene implicated in
    Brugada syndrome 2 and lipid metabolism disorder. Orthologous to human GPD1 (glycerol-3-phosphate
    dehydrogenase 1) and GPD1L (glycerol-3-phosphate dehydrogenase 1 like).
  source_type: automated
