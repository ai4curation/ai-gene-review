gene_symbol: GPD1
organism: yeast
uniprot_id: Q00055
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the production and accumulation of glycerol during hyperosmotic
    stress conditions. Glycerol acts as an osmoregulator that prevents loss of water
    and turgor of the cells.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q00055
  source_id: Q00055
- source: Alliance_Imported
  text: NAD-dependent glycerol-3-phosphate dehydrogenase; key enzyme of glycerol synthesis,
    essential for growth under osmotic stress; expression regulated by high-osmolarity
    glycerol response pathway; protein abundance increases in response to DNA replication
    stress; constitutively inactivated via phosphorylation by the protein kinases
    Ypk1p and Ypk2p, dephosphorylation increases catalytic activity; forms a heterodimer
    with Pnc1p to facilitate its peroxisomal import
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPD1
  source_id: SGD:S000002180
- source: Alliance_Automated
  text: Enables glycerol-3-phosphate dehydrogenase (NAD+) activity. Involved in intracellular
    accumulation of glycerol and protein import into peroxisome matrix. Located in
    cytosol; nucleus; and peroxisome. Human ortholog(s) of this gene implicated in
    Brugada syndrome 2 and lipid metabolism disorder. Orthologous to human GPD1 (glycerol-3-phosphate
    dehydrogenase 1) and GPD1L (glycerol-3-phosphate dehydrogenase 1 like).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GPD1
  source_id: SGD:S000002180
