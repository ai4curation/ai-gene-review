descriptions:
- source: UniProt
  text: Assembly factor for cytochrome c oxidase (respiratory chain complex IV). Stabilizes
    an early formation of cytochrome c oxidase assembly factors, until it is displaced
    by the metallochaperone copper- delivery protein COX17.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02772
  source_id: Q02772
- source: Alliance_Imported
  text: Protein required for assembly of cytochrome c oxidase; exists as an oligomer;
    described as both an integral mitochondrial inner membrane protein facing the
    intermembrane space (IMS) and as a soluble IMS protein; contains a twin Cx9C motif;
    imported into the IMS via the MIA import machinery
  source_type: curated
  url: https://www.yeastgenome.org/locus/PET191
  source_id: SGD:S000003795
- source: Alliance_Automated
  text: Involved in mitochondrial respiratory chain complex IV assembly. Located in
    mitochondrial inner membrane and mitochondrial intermembrane space. Human ortholog(s)
    of this gene implicated in mitochondrial complex IV deficiency nuclear type 9.
    Orthologous to human COA5 (cytochrome c oxidase assembly factor 5).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PET191
  source_id: SGD:S000003795
