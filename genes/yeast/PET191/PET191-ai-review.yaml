core_functions:
- description: Twin CX9C assembly factor for cytochrome c oxidase, residing in the mitochondrial
    intermembrane space in association with the inner membrane as part of a large oligomeric
    complex in which its motif cysteines are disulfide linked. Required for cytochrome c oxidase
    maturation but not a subunit of the mature enzyme. Unlike other twin CX9C proteins of
    this pathway, its import does not require the MIA40 relay. Its molecular activity is undetermined.
  directly_involved_in:
