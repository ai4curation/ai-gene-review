- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: SGD's explicit 'no data' placeholder for molecular function.
    action: ACCEPT
    reason: 'Correct and worth preserving. No catalytic or binding activity has been demonstrated
      for this protein, and the ND placeholder is an accurate statement of the state of knowledge.
      It should be retired only when a real molecular function is shown, not replaced with
      a generic binding term. The same honest-unknown pattern holds across COA4, COX23, CMC2
      and PET191 - four intermembrane space assembly factors in this pathway whose molecular
      functions remain genuinely undetermined. For Pet191 specifically, UniProt''s description
      of it stabilizing an early assembly intermediate until displaced by a copper metallochaperone
      is a model rather than a demonstrated activity, and should not be converted into a chaperone
      or binding annotation. No supporting_text is attached: this row asserts the absence
      of demonstrated activity, and no quotation can evidence an absence. The argument for
      keeping it is the reasoning above, not a citation.'
