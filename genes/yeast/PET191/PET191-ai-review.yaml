  label: Saccharomyces cerevisiae
description: Pet191 is a 108-residue twin CX9C protein required for cytochrome c oxidase maturation
  in yeast, and the ortholog of human COA5. It resides in the mitochondrial intermembrane
  space associated with the inner membrane, where its motif cysteines are present in disulfide
  linkages within a large oligomeric complex; the motif cysteines are functionally important.
  Pet191 is unusual among twin CX9C proteins in that its import is independent of the MIA40
  pathway. It has been proposed to stabilize an early cytochrome c oxidase assembly intermediate
  until displaced by copper metallochaperone action, but no molecular function has been demonstrated.
