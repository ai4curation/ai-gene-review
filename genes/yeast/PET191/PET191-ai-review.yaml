suggested_questions:
- question: Pet191 import is independent of the MIA40 pathway, unlike every other twin CX9C
    protein in this pathway. What is the import route, and does the difference reflect a distinct
    functional role?
  experts:
  - Winge lab
  - Herrmann lab
- question: What is the large oligomeric complex in which Pet191 resides? Its composition
    has never been determined, and it is the most obvious route to a molecular function for
    this protein.
  experts:
  - Winge lab
  - Barrientos lab
- question: Human COA5 is the ortholog and is disease-associated. Is the yeast evidence sufficient
    to support annotation transfer, given the divergent import route?
  experts:
  - GO Consortium PAINT curators
suggested_experiments:
- hypothesis: The Pet191-containing oligomeric complex is an early cytochrome c oxidase assembly
    intermediate.
  description: Determine the composition of the Pet191 complex by blue-native PAGE followed
    by mass spectrometry, in wild-type and in strains blocked at defined steps of complex
    IV assembly.
  experiment_type: biochemical
- hypothesis: Pet191 uses an import receptor distinct from MIA40.
  description: Screen import mutants for failure to accumulate Pet191 in mitochondria, and
    test in vitro import of Pet191 into mitochondria depleted of candidate receptors.
  experiment_type: genetic
