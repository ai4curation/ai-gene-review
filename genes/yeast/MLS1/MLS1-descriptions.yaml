- source: Alliance_Imported
  text: Malate synthase, enzyme of the glyoxylate cycle; involved in utilization of
    non-fermentable carbon sources; expression is subject to carbon catabolite repression;
    localizes in peroxisomes during growth on oleic acid, otherwise cytosolic; can
    accept butyryl-CoA as acyl-CoA donor in addition to traditional substrate acetyl-CoA
