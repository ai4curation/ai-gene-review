taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Malate synthase 1 (Mls1p, YNL117W), the principal glyoxylate-cycle malate synthase of S. cerevisiae
  (EC 2.3.3.9). It condenses glyoxylate with acetyl-CoA to form (S)-malate and CoA, the second committed step of
  the glyoxylate cycle that, together with isocitrate lyase (Icl1), allows net assimilation of two-carbon compounds
  (acetate, ethanol, fatty acids) into C4 intermediates for gluconeogenesis. MLS1 is glucose-repressed and induced
  on non-fermentable carbon sources; mls1 mutants cannot grow on acetate. Mls1 has a C-terminal PTS1 (SKL): it is
  mainly cytosolic in ethanol- or acetate-grown cells but is imported into the peroxisomal matrix in oleate-grown
  cells by the oleate-induced PTS1 receptor Pex9, which co-localises it with peroxisomal acetyl-CoA production from
  beta-oxidation. Its paralog Dal7/Mls2 functions mainly in allantoin degradation.'
