    - rubric: specificity
      score: 4
    overall_notes: 'Correct: UPR transcriptional activator binding the UPRE of KAR2,
      PDI1, EUG1 and FKB2. Omits the Ire1 splicing control and the meiotic repressor
      role.'
- source: Alliance_Imported
  text: Basic leucine zipper (bZIP) transcription factor (ATF/CREB1 homolog); regulates
    the unfolded protein response (UPR) via UPRE binding and membrane biogenesis;
    translation initiation repressed under non-stress conditions by un-spliced intron
    that interacts with 5'-UTR; under ER stress Ire1p nuclease cleaves out inhibitory
    intron and triggers efficient Hac1p translation; involved in UPR-mediated suppression
    of aneuploidy; protein abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/HAC1
  source_id: SGD:S000001863
