descriptions:
- source: UniProt
  text: Transcriptional activator involved in the unfolded protein response (UPR)
    pathway. Recognizes and binds to the UPR element (UPRE) in the promoter of UPR-regulated
    genes such as KAR2, PDI1, EUG1 and FKB2. Increases the synthesis of endoplasmic
    reticulum-resident proteins required for protein folding as well as components
    of the secretory pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41546
  source_id: P41546
