gene_symbol: HAC1
organism: yeast
uniprot_id: P41546
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Transcriptional activator involved in the unfolded protein response (UPR)
    pathway. Recognizes and binds to the UPR element (UPRE) in the promoter of UPR-regulated
    genes such as KAR2, PDI1, EUG1 and FKB2. Increases the synthesis of endoplasmic
    reticulum-resident proteins required for protein folding as well as components
    of the secretory pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41546
  source_id: P41546
- source: Alliance_Imported
  text: Basic leucine zipper (bZIP) transcription factor (ATF/CREB1 homolog); regulates
    the unfolded protein response (UPR) via UPRE binding and membrane biogenesis;
    translation initiation repressed under non-stress conditions by un-spliced intron
    that interacts with 5'-UTR; under ER stress Ire1p nuclease cleaves out inhibitory
    intron and triggers efficient Hac1p translation; involved in UPR-mediated suppression
    of aneuploidy; protein abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/HAC1
  source_id: SGD:S000001863
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific.
    Involved in endoplasmic reticulum unfolded protein response; meiotic cell cycle;
    and regulation of transcription by RNA polymerase II. Located in nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/HAC1
  source_id: SGD:S000001863
