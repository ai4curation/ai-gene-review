suggested_questions:
- question: Does Hac1i bind Ume6-regulated early meiotic gene promoters directly, or is its repression
    of these genes entirely mediated through protein-protein association with the Rpd3-Sin3 HDAC?
- question: Which Hac1 targets require heterodimerization or cooperation with other factors (e.g. Gcn4)
    for UPRE recognition, and does this account for the different UPRE classes?
suggested_experiments:
- description: ChIP-seq of Hac1i under ER stress and in nitrogen-rich pre-meiotic conditions to distinguish
    directly bound activated versus repressed promoters.
