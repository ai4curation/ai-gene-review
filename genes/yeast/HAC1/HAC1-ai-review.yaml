  review:
    summary: Hac1i (the spliced, translated isoform) represses early meiotic genes by associating with
      the Rpd3-Sin3 histone deacetylase recruited by Ume6p (PMID:15141165).
    action: KEEP_AS_NON_CORE
    reason: The repression of early meiotic genes by Hac1i is supported by IDA/IMP evidence and reflects
      a genuine regulatory output, but it is a secondary role relative to the core activator function
      of Hac1 in the UPR.
