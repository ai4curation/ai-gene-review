- source: Alliance_Imported
  text: Cytosolic aldehyde dehydrogenase; activated by Mg2+ and utilizes NADP+ as
    the preferred coenzyme; required for conversion of acetaldehyde to acetate; constitutively
    expressed; localizes to the mitochondrial outer surface upon oxidative stress;
    negative regulator of nonselective autophagy; Stb5p directly regulates the expression
    of ALD6 mRNA and directly binds to the ALD6 promoter
  source_type: curated
