descriptions:
- source: UniProt
  text: Cytosolic aldehyde dehydrogenase which utilizes NADP(+) as the preferred coenzyme.
    Performs the conversion of acetaldehyde to acetate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54115
  source_id: P54115
- source: Alliance_Imported
  text: Cytosolic aldehyde dehydrogenase; activated by Mg2+ and utilizes NADP+ as
    the preferred coenzyme; required for conversion of acetaldehyde to acetate; constitutively
    expressed; localizes to the mitochondrial outer surface upon oxidative stress;
    negative regulator of nonselective autophagy; Stb5p directly regulates the expression
    of ALD6 mRNA and directly binds to the ALD6 promoter
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALD6
  source_id: SGD:S000005982
- source: Alliance_Automated
  text: Enables acetaldehyde dehydrogenase (NADP+) activity. Involved in NADPH regeneration;
    acetate biosynthetic process; and response to salt stress. Located in cytosol
    and mitochondrion. Human ortholog(s) of this gene implicated in several diseases,
    including artery disease (multiple); congenital diaphragmatic hernia; diabetes
    mellitus (multiple); liver disease (multiple); and substance-related disorder
    (multiple). Orthologous to several human genes including ALDH1A1 (aldehyde dehydrogenase
    1 family member A1); ALDH1A2 (aldehyde dehydrogenase 1 family member A2); and
    ALDH1A3 (aldehyde dehydrogenase 1 family member A3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALD6
  source_id: SGD:S000005982
