gene_symbol: ALD6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ald6p is the constitutive, cytosolic, Mg2+-activated aldehyde dehydrogenase of S. cerevisiae
  and the most abundant ALD family member. It is essentially NADP+-specific (Km for NAD+ about 170-fold
  higher than for NADP+) and oxidizes acetaldehyde, propanal and related short aldehydes. As the acetaldehyde
  dehydrogenase of the cytosolic pyruvate dehydrogenase bypass, Ald6p generates most of the acetate formed
  during glucose fermentation, which is activated to cytosolic acetyl-CoA by acetyl-CoA synthetase; ald6
  mutants grow slowly on glucose, produce much less acetate and cannot grow on ethanol. Because it reduces
  NADP+, Ald6p is also a major source of cytosolic NADPH, acting redundantly with glucose-6-phosphate
  dehydrogenase (zwf1 ald6 double mutants are inviable). Loss of ALD6 also alters tolerance to salt stress
  under calcineurin inhibition.
