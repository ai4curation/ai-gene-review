suggested_questions:
- question: Is the mitochondrial detection of Ald6p in proteomic and fractionation studies a genuine peripheral
    association with the outer membrane, or contamination by an abundant cytosolic protein?
- question: How is flux partitioned between Ald6p-derived NADPH and the oxidative pentose phosphate pathway
    under different carbon sources?
suggested_experiments:
- description: Use protease-protection and fluorescence microscopy of endogenously tagged Ald6p in wild-type
    cells to test for any mitochondria-associated pool.
