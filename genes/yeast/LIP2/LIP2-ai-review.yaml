- term:
    id: GO:0016874
    label: ligase activity
  evidence_type: IMP
  original_reference_id: PMID:11356580
  qualifier: enables
  review:
    summary: Generic ligase activity inferred from the lip2 null phenotype and similarity to "lipoyl ligase
      B".
    action: REMOVE
    reason: Contradicted. The row reflects the historical naming of LipB as a lipoyl ligase; LipB-family
      enzymes are acyltransferases, not ligases, and Lip2 expressed in E. coli had octanoyltransferase
      activity and lacked ligase activity (PMID:23960015). A null phenotype cannot establish ligase activity.
      The correct molecular function is GO:0033819, already on the gene.
    supported_by:
    - *id003
    - reference_id: PMID:11356580
      supporting_text: The predicted protein product of this gene has significant identity to the lipoyl
        ligase B of both Escherichia coli and Kluyveromyces lactis.
