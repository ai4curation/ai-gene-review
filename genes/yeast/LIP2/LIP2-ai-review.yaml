gene_symbol: LIP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lip2 is the mitochondrial octanoyltransferase of Saccharomyces cerevisiae that initiates
  lipoic acid assembly. It transfers an octanoyl group from octanoyl-acyl carrier protein, produced by
  mitochondrial type II fatty acid synthesis, onto a lipoyl-domain lysine; the glycine cleavage H protein
  Gcv3 is the first acceptor, and lipoylated Gcv3 is required for the subsequent lipoylation of the E2
  subunits Lat1 (pyruvate dehydrogenase) and Kgd2 (2-oxoglutarate dehydrogenase) in a relay that also
  needs the lipoyl synthase Lip5 and the ligase-family protein Lip3. Lip2 belongs to the LipB family;
  it has octanoyltransferase activity and no ligase activity. lip2 null cells cannot lipoylate any of
  their target proteins, are respiratory deficient and cannot use glycine as a nitrogen source.
