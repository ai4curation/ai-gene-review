description: S-adenosylmethionine decarboxylase (AdoMetDC, EC 4.1.1.50) of Saccharomyces cerevisiae, a pyruvoyl-dependent
  enzyme synthesised as a 46 kDa proenzyme that undergoes autocatalytic serinolysis at Glu87-Ser88 to give a beta
  and an alpha chain, the latter carrying the N-terminal pyruvoyl cofactor. Spe2 decarboxylates S-adenosylmethionine
  to S-adenosyl-3-(methylsulfanyl)propylamine (decarboxylated AdoMet), the sole aminopropyl donor for spermidine
  synthase (Spe3) and spermine synthase (Spe4); spe2 mutants cannot make spermidine or spermine and require exogenous
  polyamine. The aminopropyl transfers release 5'-methylthioadenosine, which is recycled to methionine by the salvage
  pathway. Spe2 is a cytosolic enzyme.
