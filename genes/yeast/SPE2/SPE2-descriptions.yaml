gene_symbol: SPE2
organism: yeast
uniprot_id: P21182
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the decarboxylation of S-adenosylmethionine, a key step in the biosynthetic
    pathway for spermidine and spermine. It is essential for normal growth, sporulation,
    and maintenance of ds-RNA virus.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P21182
  source_id: P21182
- source: Alliance_Imported
  text: S-adenosylmethionine decarboxylase; required for the biosynthesis of spermidine
    and spermine; cells lacking Spe2p require spermine or spermidine for growth in
    the presence of oxygen but not when grown anaerobically
  source_type: curated
  url: https://www.yeastgenome.org/locus/SPE2
  source_id: SGD:S000005412
- source: Alliance_Automated
  text: Enables adenosylmethionine decarboxylase activity. Involved in spermidine
    biosynthetic process and spermine biosynthetic process. Located in cytoplasm and
    nucleus. Human ortholog(s) of this gene implicated in lung non-small cell carcinoma.
    Orthologous to human AMD1 (adenosylmethionine decarboxylase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SPE2
  source_id: SGD:S000005412
fetch_date: '2026-11-01'
