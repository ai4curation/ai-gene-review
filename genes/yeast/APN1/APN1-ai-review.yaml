core_functions:
- description: Incises the DNA backbone 5' of an apurinic/apyrimidinic site using a trinuclear zinc
    active site, producing the 3'-hydroxyl terminus that repair synthesis and ligation require. This is
    the AP-site incision step of base excision repair, and Apn1 supplies essentially all of this activity
    in yeast - in extracts lacking it the 5'-incision at AP sites is undetectable.
  molecular_function:
    id: GO:0003906
    label: DNA-(apurinic or apyrimidinic site) endonuclease activity
  directly_involved_in:
  - id: GO:0006284
    label: base-excision repair
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:1693433
    supporting_text: Gene disruption experiments confirm that the Apn1 protein accounts for greater than
      or equal to 97% of both AP endonuclease and DNA 3'-repair diesterase activities in yeast cell-free
      extracts.
  - reference_id: PMID:9295360
    supporting_text: In extracts of an apn1 deletion mutant, the 5'-incision at AP (apurinic/apyrimidinic)
      sites is not detectable, supporting the notion that yeast contains only one major 5'-AP endonuclease.
  - reference_id: PMID:12767225
    supporting_text: Moreover, Apn1 Asp192Gly completely lacks enzymatic activity, while the activity of
      the E. coli counterpart Asp179Gly is reduced by approximately 40-fold.
- description: Hydrolytically removes 3'-blocking deoxyribose fragments, such as 3'-phosphoglycolaldehyde
    and 3'-phosphoglycolate, from the termini of oxidative DNA strand breaks, restoring the 3'-hydroxyl
    primer that repair synthesis requires. The protein was originally purified by this activity and
    accounts for at least 97% of the DNA 3'-repair diesterase activity of yeast extracts.
  molecular_function:
    id: GO:0090580
    label: phosphodiesterase activity, acting on 3'-phosphoglycolate-terminated DNA strands
  directly_involved_in:
  - id: GO:0006281
    label: DNA repair
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:3056935
    supporting_text: We have used a synthetic DNA substrate containing 3'-phosphoglycolaldehyde esters to
      identify and purify to physical homogeneity the major yeast diesterase that removes such nucleotide
      fragments.
  - reference_id: PMID:12397185
    supporting_text: Recently, it has been demonstrated that, like Apn1 and Apn2 ( 30 , 36 ), purified
      Tdp1 can hydrolyze a PG residue from the 3′ end of DNA ( 16 ).
  - reference_id: PMID:3056935
    supporting_text: The restoration of normal 3'-OH nucleotide primers is the essential first step in the
      excision repair of these radical-induced strand breaks.
- description: Degrades duplex DNA progressively from a free 3' terminus, with no activity on
    single-stranded DNA, excising 3'-terminal mismatched nucleotides, abasic analogues and misincorporated
    8-oxoguanine at nicks and gaps. This cleansing of newly synthesised DNA is a glycosylase-independent
    route for removing 8-oxoG, and its loss is strongly synergistic with loss of Ogg1.
  molecular_function:
    id: GO:0008311
    label: double-stranded DNA 3'-5' DNA exonuclease activity
  directly_involved_in:
