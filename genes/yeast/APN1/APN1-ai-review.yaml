id: P22936
gene_symbol: APN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: APN1 (YKL114C) encodes the major apurinic/apyrimidinic (AP) endonuclease and DNA 3'-repair
  diesterase of Saccharomyces cerevisiae, the eukaryotic counterpart of Escherichia coli endonuclease
  IV (Nfo). It is a 367-residue monomeric metalloenzyme of the AP endonuclease 2 (endonuclease IV) family,
  built on a divalent-metal-dependent TIM-barrel fold whose active-site pocket coordinates a trinuclear
  zinc cluster; two of the coordinating residues, Glu158 and Asp192, are each individually essential for
  activity in vivo. Apn1 incises the phosphodiester backbone 5' of abasic sites created by DNA glycosylases
  or by spontaneous base loss, generating the 3'-hydroxyl primer that DNA polymerase and ligase need, and
  it removes 3'-blocking deoxyribose fragments such as 3'-phosphoglycolaldehyde and 3'-phosphoglycolate
  from oxidative single-strand breaks. Gene disruption shows it supplies at least 97% of both activities
  in yeast extracts, and in extracts lacking it the 5'-incision step of base excision repair on uracil-containing
  DNA is undetectable; a second, minor AP endonuclease (Apn2) is partly redundant with it. The same active
  site supports a robust progressive 3'-to-5' exonuclease activity on duplex but not single-stranded
  DNA, which excises 3'-terminal mismatches, 3'-blocking groups and misincorporated 8-oxoguanine and
  constitutes a glycosylase-independent route for removing 8-oxoG from newly synthesised DNA. Purified
  Apn1 also hydrolyses 3'-phosphotyrosyl links of the kind formed by trapped topoisomerase I, although
  epistasis analysis indicates this activity is incidental to topoisomerase-lesion repair in vivo. Apn1
  is concentrated in the nucleus by a bipartite basic nuclear localisation signal in its C-terminal
  extension, and truncations that fail to concentrate there also fail to protect cells against oxidative
  and alkylating agents; a minor pool reported to depend on Pir1p reaches the mitochondria, where loss of
  Apn1 raises the mitochondrial mutation rate. Loss of APN1 confers hypersensitivity to alkylating and
  oxidising agents and a spontaneous mutator phenotype that is strongly synergistic with loss of the
  8-oxoguanine glycosylase Ogg1.
