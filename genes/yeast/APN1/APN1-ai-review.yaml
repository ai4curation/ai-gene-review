suggested_questions:
- question: Is the mitochondrial pool of Apn1 reproducible outside the originating laboratory, and does a
    Pir1-independent import route exist? UniProt still records only a nuclear location, and the claim
    rests on one 2001 study.
- question: Which activity of Apn1 - AP-site incision, 3'-diesterase or 3'-to-5' exonuclease - is
    rate-limiting for survival of each class of damaging agent, given that a single active site carries
    all three?
- question: Does the 3'-to-5' exonuclease act on DNA handed over by a stalled polymerase, as the proposed
    model requires, and if so which replication factor recruits it?
suggested_experiments:
- hypothesis: The three activities of Apn1 are separable by active-site mutation, so their individual
    contributions to damage resistance can be assigned.
  description: Construct a panel of active-site and substrate-channel variants (beyond E158G and D192G),
    measure AP endonuclease, 3'-diesterase, 3'-to-5' exonuclease and tyrosyl-DNA phosphodiesterase
    activity for each purified protein, and score the matched strains for sensitivity to methyl
    methanesulfonate, bleomycin, hydrogen peroxide and camptothecin and for spontaneous mutation rate in
    an ogg1 background.
- hypothesis: Apn1 reaches the mitochondrial matrix in a Pir1-dependent manner, and a mitochondrially
    restricted Apn1 is sufficient to suppress the mitochondrial mutator phenotype.
  description: Re-examine the localisation with a tagged Apn1 by submitochondrial fractionation with
    protease protection and by live imaging against an endoplasmic-reticulum marker to exclude
    mitochondria-associated membranes, then test whether Apn1 carrying an obligatory matrix targeting
    sequence and lacking the nuclear signal restores the mitochondrial mutation rate of apn1 cells.
- hypothesis: The 3'-to-5' exonuclease of Apn1 operates on primer termini presented by a stalled
    replicative polymerase.
  description: Reconstitute primer extension with purified Pol delta, PCNA and RPA on 8-oxoG- and
    mismatch-terminated primers in the presence and absence of Apn1 and of exonuclease-selective Apn1
    variants, and test for physical association by pull-down from yeast extracts under replication stress.
