- source: Alliance_Imported
  text: Dihydrofolate synthetase, involved in folic acid biosynthesis; catalyzes conversion
    of dihydropteroate to dihydrofolate in folate coenzyme biosynthesis; FOL3 has
    a paralog, RMA1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/FOL3
