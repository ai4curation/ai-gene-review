  review:
    summary: 'IBA from PTN000123998, the node at which PAINT placed both dihydrofolate synthase and folylpolyglutamate
      synthase activities (many bacterial FolC enzymes are bifunctional). In S. cerevisiae the two activities have
      been split between paralogs: Fol3p is the dihydrofolate synthetase, while folylpolyglutamate synthetase activity
      is encoded by MET7 (the yeast experimental source on this IBA is MET7, SGD:S000005767). met7 mutants are methionine
      auxotrophs despite intact FOL3, so Fol3p does not supply the polyglutamylation activity.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Paralog subfunctionalisation: FPGS is Met7p; Fol3p is the DHFS.'
    supported_by:
    - &id001
      reference_id: PMID:10799479
      supporting_text: We show that dihydrofolate synthetase catalyzing the binding of the first glutamyl side chain
        to dihydropteroate yielding dihydrofolate is encoded by the YMR113w gene that we propose to rename FOL3.
    - &id002
      reference_id: PMID:10799479
      supporting_text: We show also that folylpolyglutamate synthetase, which catalyzes the extension of the glutamate
        chains of the folate coenzymes, is encoded by the MET7 gene.
