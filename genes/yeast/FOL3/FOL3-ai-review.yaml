core_functions:
- description: 'Dihydrofolate synthetase: ATP-dependent ligation of the first L-glutamate to 7,8-dihydropteroate
    to form 7,8-dihydrofolate, the step between Fol1p and Dfr1p in de novo folate synthesis, in the cytoplasm. Polyglutamate
    extension is done by its paralog Met7p.'
