  - *id004
  - *id003
suggested_questions:
- question: Does Fol3p retain any residual folylpolyglutamate synthetase activity toward THF in vitro, or is it
    strictly specific for dihydropteroate?
- question: Where does dihydropteroate produced by mitochondrial-membrane Fol1p meet cytoplasmic Fol3p?
suggested_experiments:
- hypothesis: Fol3p is specific for dihydropteroate and cannot extend THF polyglutamates
  description: Assay purified Fol3p and Met7p with dihydropteroate, THF-Glu1 and THF-Glu2 substrates; test whether
    FOL3 overexpression suppresses met7 methionine auxotrophy.
  experiment_type: enzymology / genetic suppression
