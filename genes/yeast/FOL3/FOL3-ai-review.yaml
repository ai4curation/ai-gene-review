gene_symbol: FOL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'FOL3 (YMR113W) encodes dihydrofolate synthetase (DHFS, EC 6.3.2.12), an ATP-dependent glutamate ligase
  of the folylpolyglutamate synthetase (Mur-ligase-like) family. It attaches the first L-glutamate residue to 7,8-dihydropteroate,
  the product of Fol1p, forming 7,8-dihydrofolate, which Dfr1p then reduces to tetrahydrofolate. fol3 mutants lack
  DHFS activity and require folinic acid for growth. In S. cerevisiae the two glutamate-adding activities, which
  are combined in one enzyme in many bacteria, are split between paralogs: Fol3p adds the first glutamate during
  de novo synthesis, and Met7p is the folylpolyglutamate synthetase that extends the glutamate chain of folate coenzymes.
  Fol3p is a cytoplasmic protein.'
