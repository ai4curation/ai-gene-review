  label: Saccharomyces cerevisiae S288C
description: 'YJL068C encodes the S-formylglutathione hydrolase (FGH, EC 3.1.2.12) of Saccharomyces cerevisiae,
  a cytoplasmic serine hydrolase of the esterase D family (alpha/beta-hydrolase fold) and the orthologue
  of human ESD. It hydrolyses S-formylglutathione to formate and free glutathione, the second step of
  glutathione-dependent formaldehyde oxidation: formaldehyde reacts with glutathione to form S-hydroxymethylglutathione,
  which is oxidised by Sfa1 to S-formylglutathione; Yjl068c then releases formate (subsequently oxidised
  by Fdh1) and regenerates glutathione. The protein was purified from yeast as an intracellular ~40 kDa
  monomeric esterase with a pH optimum of 7 and also shows general carboxylesterase activity. The gene
  is non-essential; null mutants have reduced esterase activity and grow slowly in the presence of formaldehyde.'
