suggested_questions:
- question: Which other ester substrates does Yjl068c hydrolyse in vivo (the purified enzyme was isolated
    as a general esterase), and do any contribute to its physiological role beyond formaldehyde detoxification?
- question: Should this ORF receive a standard gene name (it is the yeast orthologue of human ESD / FGH)?
suggested_experiments:
- description: Measure intracellular S-formylglutathione and glutathione levels in yjl068c delta cells
    exposed to formaldehyde, with and without SFA1 overexpression, to test whether FGH is rate-limiting
    for glutathione recycling.
