- source: Alliance_Automated
  text: Enables 1-phosphatidylinositol-3-kinase activity and protein kinase activity.
    Involved in several processes, including cellular response to potassium ion starvation;
    pexophagy; and positive regulation of transcription elongation by RNA polymerase
    II. Located in several cellular components, including fungal-type vacuole membrane;
    nucleus-vacuole junction; and phagophore assembly site. Part of phosphatidylinositol
    3-kinase complex, class III, type I and phosphatidylinositol 3-kinase complex,
    class III, type II. Used to study Parkinson's disease. Orthologous to human PIK3C3
    (phosphatidylinositol 3-kinase catalytic subunit type 3).
