descriptions:
- source: UniProt
  text: Phosphatidylinositol 3-kinase required for cytoplasm to vacuole transport
    (Cvt) and autophagy as a part of the autophagy- specific VPS34 PI3-kinase complex
    I. This complex is essential to recruit the ATG8-phosphatidylinositol conjugate
    and the ATG12-ATG5 conjugate to the pre-autophagosomal structure. Also involved
    in endosome-to-Golgi retrograde transport as part of the VPS34 PI3-kinase complex
    II. This second complex is required for the endosome-to-Golgi retrieval of PEP1
    and KEX2, and the recruitment of VPS5 and VPS7, two components of the retromer
    complex, to endosomal membranes (probably through the synthesis of a specific
    pool of phosphatidylinositol 3- phosphate recruiting the retromer to the endosomes).
    Its activation by VPS15 may lead to the phosphorylation of phosphatidylinositol
    in the sorting compartment membrane. Finally, it might also be involved in ethanol
    tolerance and cell wall integrity.
