descriptions:
- source: UniProt
  text: Phosphatidylinositol 3-kinase required for cytoplasm to vacuole transport
    (Cvt) and autophagy as a part of the autophagy- specific VPS34 PI3-kinase complex
    I. This complex is essential to recruit the ATG8-phosphatidylinositol conjugate
    and the ATG12-ATG5 conjugate to the pre-autophagosomal structure. Also involved
    in endosome-to-Golgi retrograde transport as part of the VPS34 PI3-kinase complex
    II. This second complex is required for the endosome-to-Golgi retrieval of PEP1
    and KEX2, and the recruitment of VPS5 and VPS7, two components of the retromer
    complex, to endosomal membranes (probably through the synthesis of a specific
    pool of phosphatidylinositol 3- phosphate recruiting the retromer to the endosomes).
    Its activation by VPS15 may lead to the phosphorylation of phosphatidylinositol
    in the sorting compartment membrane. Finally, it might also be involved in ethanol
    tolerance and cell wall integrity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P22543
  source_id: P22543
- source: Alliance_Imported
  text: Phosphatidylinositol (PI) 3-kinase that synthesizes PI-3-phosphate; forms
    membrane-associated signal transduction complex with Vps15p to regulate protein
    sorting; activated by the GTP-bound form of Gpa1p; a fraction is localized, with
    Vps15p, to nuclear pores at nucleus-vacuole junctions and may facilitate transcription
    elongation for genes positioned at the nuclear periphery
  source_type: curated
  url: https://www.yeastgenome.org/locus/VPS34
  source_id: SGD:S000004230
- source: Alliance_Automated
  text: Enables 1-phosphatidylinositol-3-kinase activity and protein kinase activity.
    Involved in several processes, including cellular response to potassium ion starvation;
    pexophagy; and positive regulation of transcription elongation by RNA polymerase
    II. Located in several cellular components, including fungal-type vacuole membrane;
    nucleus-vacuole junction; and phagophore assembly site. Part of phosphatidylinositol
    3-kinase complex, class III, type I and phosphatidylinositol 3-kinase complex,
    class III, type II. Used to study Parkinson's disease. Orthologous to human PIK3C3
    (phosphatidylinositol 3-kinase catalytic subunit type 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/VPS34
  source_id: SGD:S000004230
