id: P22543
gene_symbol: VPS34
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Vps34 is the sole phosphatidylinositol 3-kinase of Saccharomyces cerevisiae (class III PI3K, ortholog
  of human PIK3C3). It phosphorylates phosphatidylinositol, but not PtdIns4P or PtdIns(4,5)P2, at the D-3 position
  to generate PtdIns3P (EC 2.7.1.137); it also autophosphorylates. Vps34 acts in a heterodimer with the regulatory
  protein kinase Vps15, which engages the Vps34 activation loop, and the Vps15-Vps34 arm assembles into two distinct
  heterotetrameric complexes: complex I (with Vps30/Atg6, Atg14 and Atg38), targeted by Atg14 to the phagophore
  assembly site where its PtdIns3P is essential for autophagosome formation, autophagy, the Cvt pathway and pexophagy;
  and complex II (with Vps30 and Vps38), targeted to endosomes and the vacuole membrane, where PtdIns3P recruits
  FYVE/PX effectors for carboxypeptidase Y sorting, endosome-to-vacuole traffic and retromer-mediated retrieval.
  Vps34-derived PtdIns3P is also the substrate for Fab1 production of PtdIns(3,5)P2.'
