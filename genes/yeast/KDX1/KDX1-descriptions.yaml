descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase involved in the SLT2 mitogen- activated (MAP)
    kinase signaling pathway that regulates cell wall integrity. May also be involved
    in the mating pheromone and the CWI MAPK pathways.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36005
  source_id: P36005
