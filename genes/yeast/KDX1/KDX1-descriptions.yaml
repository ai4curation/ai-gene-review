- source: Alliance_Automated
  text: Predicted to enable cyclin-dependent protein serine/threonine kinase activity.
    Predicted to be involved in mitotic cell cycle phase transition; regulation of
    cell cycle; and signal transduction. Predicted to be part of cyclin-dependent
    protein kinase holoenzyme complex. Predicted to be active in cytoplasm and nucleus.
    Orthologous to human MAPK7 (mitogen-activated protein kinase 7).
  source_type: automated
