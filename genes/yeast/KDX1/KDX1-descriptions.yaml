findings:
- category: discrepancy
  text: All three texts call Kdx1 a kinase; the review treats it as a pseudokinase
    (DFG to DFN, no TEY) acting non-catalytically with Swi4.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- category: discrepancy
  text: The automated text's CDK activity, CDK holoenzyme and G2/M transition terms
    are removed in the review.
  sources:
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 2
  overall_notes: SGD and UniProt agree on a CWI pathway kinase; the automated text
    describes a CDK. None says it is a pseudokinase.
