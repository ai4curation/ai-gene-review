descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase involved in the SLT2 mitogen- activated (MAP)
    kinase signaling pathway that regulates cell wall integrity. May also be involved
    in the mating pheromone and the CWI MAPK pathways.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36005
  source_id: P36005
- source: Alliance_Imported
  text: Protein kinase; implicated in Slt2p mitogen-activated (MAP) kinase signaling
    pathway; interacts with numerous components in the mating pheromone and CWI MAPK
    pathways; associates with Rlm1p; KDX1 has a paralog, SLT2, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/KDX1
  source_id: SGD:S000001644
- source: Alliance_Automated
  text: Predicted to enable cyclin-dependent protein serine/threonine kinase activity.
    Predicted to be involved in mitotic cell cycle phase transition; regulation of
    cell cycle; and signal transduction. Predicted to be part of cyclin-dependent
    protein kinase holoenzyme complex. Predicted to be active in cytoplasm and nucleus.
    Orthologous to human MAPK7 (mitogen-activated protein kinase 7).
  source_type: automated
  url: https://www.yeastgenome.org/locus/KDX1
  source_id: SGD:S000001644
