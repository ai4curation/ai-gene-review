- term:
    id: GO:0004693
    label: cyclin-dependent protein serine/threonine kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Target-specific pseudokinase evidence contradicts conventional catalytic phosphotransfer.
    action: REMOVE
    reason: >-
      Primary PMID:18268013 and PMID:20641022 characterize Mlp1/Kdx1 as a pseudokinase with a noncatalytic
      transcriptional role; PMID:35420390 independently describes it as catalytically inactive. The Kdx1
      sequence has NFG instead of the canonical DFG magnesium-binding motif. Retention of a protein-kinase
      fold does not make an assertion of kinase activity partly correct. Reject this catalytic transfer
      on target-specific divergence, without claiming that every hypothetical residual or promiscuous
      phosphotransfer reaction has been experimentally excluded. This catalytic judgment does not extend
      to ATP binding, signal transduction, cell-cycle regulation or complex membership. Reproducible alignment
      also maps the canonical SLT2 Lys54 to Kdx1 Arg54, while the adjacent Lys55 is retained.
    supported_by:
    - reference_id: PMID:20641022
      supporting_text: >-
        Induction was only partially dependent on the Mlp1 pseudokinase (Figure 2), a
        catalytically inactive paralog of Mpk1 (Kim et al., 2008).
    - reference_id: file:yeast/KDX1/KDX1-bioinformatics/RESULTS.md
      supporting_text: The canonical SLT2 ATP-site Lys54 aligns to Arg54 in KDX1.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000623980
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The ancestral catalytic assertion is contradicted by target-specific pseudokinase
          sequence and primary noncatalytic characterization. This is not an argument based on donor
          count or target self-inclusion.
