- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      ATP binding remains unresolved independently of catalytic inactivity.
    action: UNDECIDED
    reason: >-
      Reproducible alignment of cached Kdx1/P36005 with SLT2/Q00772 maps the canonical beta3 ATP-site
      Lys54 to Arg54 in Kdx1; the neighboring Lys55 is retained. The earlier claim that K55 establishes
      retention of the invariant ATP-site lysine was therefore incorrect. Primary PMID:20641022 characterizes
      the equivalent Mpk1-K54R mutant as catalytically inactive. These substitutions strengthen the pseudokinase
      interpretation but do not establish inability to bind ATP. Preserve this separate biochemical question
      as UNDECIDED pending direct binding evidence and the focused report.
    supported_by:
    - reference_id: file:yeast/KDX1/KDX1-bioinformatics/RESULTS.md
      supporting_text: The canonical SLT2 ATP-site Lys54 aligns to Arg54 in KDX1.
