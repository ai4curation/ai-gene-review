  text: Phosphatase subunit of the trehalose-6-P synthase/phosphatase complex; involved
    in the synthesis of storage carbohydrate trehalose; positive regulator of autophagy
    involved in the dephosphorylation of Rim15p leading to ATG8 induction; expression
    is induced by stress conditions and repressed by the Ras-cAMP pathway; protein
    abundance increases in response to DNA replication stress
