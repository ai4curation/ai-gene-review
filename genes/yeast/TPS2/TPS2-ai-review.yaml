id: P31688
gene_symbol: TPS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TPS2 (also HOG2/PFK3) encodes the ~100 kDa trehalose-6-phosphate phosphatase subunit (EC
  3.1.3.12) of the Saccharomyces cerevisiae trehalose synthase complex. Tps2 has an N-terminal glycosyltransferase-20-like
  region homologous to Tps1 and a C-terminal HAD-type trehalose-phosphatase domain that dephosphorylates
  trehalose 6-phosphate to free trehalose, the second and final step of trehalose biosynthesis; it is
  Mg2+-dependent and highly specific for trehalose 6-phosphate. tps2 mutants lose T6P phosphatase activity
  and accumulate T6P instead of trehalose on heat shock or entry into stationary phase, and are heat sensitive.
  Tps2 also stabilises the cytosolic Tps1-Tps2-Tsl1/Tps3 complex. In addition, Tps2 acts as a positive
  regulator of autophagy under nitrogen starvation independently of trehalose levels, by promoting dephosphorylation
  and nuclear entry of the Rim15 kinase, which relieves Ume6 repression of ATG8.
