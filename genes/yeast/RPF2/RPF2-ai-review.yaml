suggested_questions:
- question: Does PMID:11864606 report Rpf2 association with the 7S pre-rRNA (5.8S precursor) rather than
    SRP 7S RNA? If so, the GO:0008312 (SRP 7S RNA binding) annotation should be repointed to rRNA binding.
- question: Is 5S rRNA binding (via the R236-containing patch) conserved across the RPF2 subfamily strongly
    enough for PAINT to place GO:0008097 at PTN000296192, given direct EMSA evidence in A. nidulans/S.
    cerevisiae and structural evidence in C. thermophilum?
- question: What triggers release of Rpf2-Rrs1 from the pre-60S, and is the Rpf2 C-terminal tail actively
    involved in 5S RNP rotation or only in stabilising the pre-rotation state?
suggested_experiments:
- hypothesis: Direct 5S rRNA binding by Rpf2 is required in vivo for 5S RNP recruitment and 27SB processing.
  description: Test in vivo complementation of rpf2 shuffle strains with R236A and the triple basic-patch
    mutant to link loss of 5S rRNA binding to 5S RNP recruitment, 27SB processing and growth.
  experiment_type: genetic complementation and pre-rRNA northern analysis
- hypothesis: Rpf2-Rrs1 release from the pre-60S precedes and is required for 5S RNP rotation.
  description: Time-resolved cryo-EM of pre-60S particles from rpf2 C-terminal and R236 mutants to define
    the step at which Rpf2-Rrs1 is released relative to 5S RNP rotation.
  experiment_type: cryo-EM
