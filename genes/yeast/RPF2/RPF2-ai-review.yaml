      rRNA, as a single amino acid mutation significantly reduced the binding ability.
  - reference_id: PMID:17938242
    supporting_text: 'Rpf2 and Rrs1

      are required for recruiting rpL5, rpL11, and 5S rRNA into preribosomes'
  - reference_id: PMID:26159998
    supporting_text: 'We show that the

