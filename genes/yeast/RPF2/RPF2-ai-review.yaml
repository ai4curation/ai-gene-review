id: P36160
gene_symbol: RPF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Rpf2 (YKR081C) is an essential nucleolar ribosome assembly factor of Saccharomyces cerevisiae
  and a member of the Brix-domain (Imp4 superfamily) RPF2 family. It forms an obligate heterodimer with
  Rrs1 in which the Rrs1 long helix completes the Rpf2 Brix fold. The Rpf2-Rrs1 complex binds the E-loop
  of 5S rRNA directly (Rpf2 R236 is a key contact) and binds ribosomal protein uL18/Rpl5; together with
  the import chaperone Syo1 it forms a hexameric 5S RNP precursor (5S rRNA, Rpl5, Rpl11, Rpf2, Rrs1, Syo1).
  Rpf2-Rrs1 recruits the 5S RNP into 90S/early pre-60S particles, docking it onto 25S rRNA domain V in
  an unrotated conformation, and is needed for the subsequent recruitment of the DEAD-box protein Spb4
  and the GTPase Nog2. Loss of Rpf2 blocks processing of 27SB pre-rRNA to 25S (and 5.8S) rRNA and causes
  a 60S subunit deficit. Release of Rpf2-Rrs1, aided by its C-terminal tail, precedes the ~180 degree
  rotation of the 5S RNP that forms the central protuberance.
