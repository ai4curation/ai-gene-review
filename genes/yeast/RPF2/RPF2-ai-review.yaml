- term:
    id: GO:0000027
    label: ribosomal large subunit assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR039770
  review:
    summary: Rpf2 is required for assembly of the 60S subunit; depletion causes a shortage of free 60S
      subunits and blocks 27SB pre-rRNA processing (Morita 2002; Zhang 2007; Bogengruber 2003).
    action: ACCEPT
    reason: 'Ribosomal large subunit assembly is a core process for Rpf2: as part of the Rpf2-Rrs1 heterodimer
      it recruits the 5S RNP (5S rRNA, uL18/Rpl5, uL5/Rpl11) into nascent pre-60S particles, performing
      a structural assembly step itself rather than merely being required. The IEA (Rpf2 family InterPro
      IPR039770) row is consistent with the IMP row and the PANTHER/RPF2-family placement.'
    supported_by:
    - &id001
      reference_id: PMID:17938242
      supporting_text: 'Rpf2 and Rrs1

        are required for recruiting rpL5, rpL11, and 5S rRNA into preribosomes'
    - &id002
      reference_id: PMID:12702244
      supporting_text: 'YKR081c (Rpf2p) and the homologous

        proteins Ssf1p (YHR066w)/Ssf2p (YDR312w) are all involved in the multistep

        process of the assembly of the large ribosomal subunit'
    - &id003
      reference_id: PMID:32719344
      supporting_text: As expected, the levels of free 60S subunits were significantly lower relative
        to 40S subunits in the rpf2Δ255-344 strain, compared with the wild-type strain, indicating a defect
        in 60S subunit assembly.
