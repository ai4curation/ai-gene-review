- term:
    id: GO:0000463
    label: maturation of LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000296192
  - SGD:S000001789
  review:
    summary: Depletion of Rpf2 accumulates 27SB pre-rRNA and reduces 25S rRNA; the Rpf2 subcomplex is
      among the B-factors required for C2 cleavage of 27SB pre-rRNA.
    action: ACCEPT
    reason: Maturation of 25S rRNA from the tricistronic 35S transcript (27SB to 25S) is the defining
      processing defect of rpf2 mutants in S. cerevisiae. As is conventional for pre-60S assembly factors,
      the process term is appropriate because Rpf2 is a structural component of the pre-rRNP undergoing
      processing and is needed for the processing-competent state. The IBA from PTN000296192 (seeded by
      this gene) agrees.
    supported_by:
    - &id004
      reference_id: PMID:12048200
      supporting_text: 'the Rpf2p depletion

        leads to an accumulation of 27 SB pre-rRNA, suggesting that Rpf2p is required

        for the processing of 27 SB into 25 S rRNA'
    - &id005
      reference_id: PMID:17938242
      supporting_text: 'In the

        absence of association of these molecules with pre-rRNPs, processing of 27SB

        pre-rRNA is blocked'
