- term:
    id: GO:0005730
    label: nucleolus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT3G23620
  - FB:FBgn0038585
  - PANTHER:PTN000296192
  - SGD:S000001789
  - UniProtKB:Q8IJC0
  - UniProtKB:Q9H7B2
  review:
    summary: Rpf2 is mainly nucleolar (Morita 2002; Bogengruber 2003), consistent with its association
      with early (90S and early 66S) pre-ribosomes.
    action: ACCEPT
    reason: Nucleolar localization is experimentally established for yeast Rpf2 and is propagated by PAINT
      from this gene and orthologs (Arabidopsis, Drosophila, human, Plasmodium). The ARBA/SubCell IEA
      agrees. Rpf2 also travels with pre-60S particles into the nucleoplasm until 5S RNP rotation, but
      nucleolus is the principal site of its function.
    supported_by:
    - &id006
      reference_id: PMID:12048200
      supporting_text: 'Rpf2p is essential

        for growth and is mainly localized in the nucleolus'
    - &id007
      reference_id: file:yeast/RPF2/RPF2-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Nucleus, nucleolus {ECO:0000269|PubMed:12702244}.'
