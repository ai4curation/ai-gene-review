core_functions:
- description: Direct 5S rRNA binding (E-loop) by the Rpf2-Rrs1 heterodimer, which incorporates the 5S
    RNP (5S rRNA, Rpl5/uL18, Rpl11/uL5) into nascent pre-60S particles. Experimentally established in
    S. cerevisiae (EMSA and mutagenesis of yeast Rpf2 R236 and basic patches, yeast Rpf2-Rrs1-5S RNA structure,
    depletion studies). 5S rRNA binding per se was not propagated at PAINT node PTN000296192, which carries
    the more general rRNA binding.
