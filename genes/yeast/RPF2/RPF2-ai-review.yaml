- term:
    id: GO:0000466
    label: maturation of 5.8S rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
  evidence_type: IMP
  original_reference_id: PMID:11864606
  qualifier: involved_in
  review:
    summary: Wehner & Baserga (2002) report RNA association and processing defects for the Imp4 superfamily;
      27SB processing is the precursor step for both 5.8S (via 7S) and 25S rRNA.
    action: KEEP_AS_NON_CORE
    reason: Because the block is at 27SB pre-rRNA, which is the common precursor of 7S (5.8S) and 26S
      (25S) pre-rRNAs, an effect on 5.8S maturation is mechanistically expected, but the well-documented,
      primary readout is loss of 25S rRNA. Only the abstract of PMID:11864606 is available, so I defer
      to the curator for the existence of the phenotype and keep this as a non-core consequence of the
      27SB block.
    supported_by:
    - &id012
      reference_id: PMID:11864606
      supporting_text: 'The Imp4 superfamily members associate with RNAs that are consistent with their
        distinct roles in

        ribosome biogenesis'
    - *id005
