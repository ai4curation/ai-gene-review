gene_symbol: RPF2
organism: yeast
uniprot_id: P36160
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for biogenesis of the 60S ribosomal subunit.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36160
  source_id: P36160
- source: Alliance_Imported
  text: Essential protein involved in rRNA maturation and ribosomal assembly; involved
    in the processing of pre-rRNA and the assembly of the 60S ribosomal subunit; interacts
    with ribosomal protein L11; localizes predominantly to the nucleolus; constituent
    of 66S pre-ribosomal particles
  source_type: curated
  url: https://www.yeastgenome.org/locus/RPF2
  source_id: SGD:S000001789
- source: Alliance_Automated
  text: Enables 5S rRNA binding activity and 7S RNA binding activity. Involved in
    assembly of large subunit precursor of preribosome; maturation of 5.8S rRNA from
    tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA); and maturation of
    LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA). Located
    in nucleolus. Part of preribosome, large subunit precursor. Orthologous to human
    RPF2 (ribosome production factor 2 homolog).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RPF2
  source_id: SGD:S000001789
