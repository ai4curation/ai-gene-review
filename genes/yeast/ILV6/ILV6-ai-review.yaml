taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Regulatory (small) subunit of mitochondrial acetohydroxyacid synthase (AHAS; acetolactate
  synthase) in Saccharomyces cerevisiae. Ilv6 has no catalytic activity of its own; it binds the catalytic
  subunit Ilv2 to form the heterotetrameric AHAS holoenzyme, stimulating Ilv2 activity up to ~7-10-fold
  and conferring end-product feedback inhibition by valine. A fungal-specific sequence insert in Ilv6
  forms an MgATP-binding site, and MgATP binding reverses valine inhibition. Ilv6 is imported into mitochondria
  with removal of a transit peptide, where AHAS catalyses the first common step of isoleucine, leucine
  and valine biosynthesis. Deletion of ILV6 causes no obvious growth phenotype but abolishes valine feedback
  inhibition of AHAS.
