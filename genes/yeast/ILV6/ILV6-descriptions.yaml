descriptions:
- source: UniProt
  text: Regulatory subunit of mitochondrial acetolactate synthase, which catalyzes
    the first of a series of common steps in the biosynthesis of the branched-chain
    amino acids. Stimulates activity of the acetolactate synthase catalytic subunit
    ILV2 seven- to tenfold and confers sensitivity to inhibition by valine and activation
    by ATP.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25605
  source_id: P25605
