descriptions:
- source: UniProt
  text: Activator protein that regulates the ubiquitin ligase activity and substrate
    specificity of the anaphase promoting complex/cyclosome (APC/C). During telophase
    and in the subsequent G1 phase of the cell cycle, recognizes and binds proteins
    containing a destruction box (D-box) and an additional degradation signal termed
    the KEN box including ASE1, CDC20, the B-type cyclins CLB2 and CLB3, the polo-like
    kinase CDC5 and HSL1, and recruits them in a C-box-dependent manner to the APC/C
    for ubiquitination and subsequent proteolysis. Required for exit from mitosis,
    cytokinesis and formation of prereplicative complexes in G1. Probably is the target
    of a BUB2- dependent spindle checkpoint pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53197
  source_id: P53197
- source: Alliance_Imported
  text: 'Activator of anaphase-promoting complex/cyclosome (APC/C); antagonist of
    the spindle assembly checkpoint; directs ubiquitination of cyclins facilitating
    mitotic exit; targets the APC/C to specific substrates including: Cdc20p, Ase1p,
    Cin8p, Fin1p and Clb5p; partially active in metaphase, and fully active in anaphase;
    cell-cycle regulated; degradation in trans (auto-ubiquitination) by APC-Cdh1 following
    Snf1 complex-mediated phosphorylation is required for faithful meiosis'
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDH1
  source_id: SGD:S000002971
- source: Alliance_Automated
  text: Enables cyclin binding activity and ubiquitin ligase activator activity. Involved
    in positive regulation of anaphase-promoting complex-dependent catabolic process
    and regulation of cell cycle process. Located in cytoplasm and nucleus. Part of
    anaphase-promoting complex. Used to study disease of cellular proliferation. Human
    ortholog(s) of this gene implicated in developmental and epileptic encephalopathy
    109. Orthologous to human FZR1 (fizzy and cell division cycle 20 related 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDH1
  source_id: SGD:S000002971
