  review:
    summary: >-
      Jaquenoud et al. localised Cdh1p-GFP and found it nuclear during G1, the window in which
      APC/C-Cdh1 is active, with Pse1p-mediated import and phosphorylation-dependent Msn5p export
      redistributing it to the cytoplasm from S phase to the end of mitosis.
