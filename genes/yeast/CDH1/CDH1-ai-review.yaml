- term:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:11566880
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. Schwab et al. demonstrated by co-immunoprecipitation that Hct1
      binds the APC/C substrates Clb2, Clb3 and Cdc5 (but not Pds1), that a Clb2 derivative
      unable to bind Hct1 escapes G1 proteolysis, and that Hct1 mutants unable to bind the APC
      (C-box or C-terminal alterations) still bind Clb2, so that Hct1 carries separable
      substrate-binding and APC-binding surfaces and functions as the substrate receptor that
      delivers targets to the ligase.
    action: NEW
    reason: >-
      The substrate-receptor facet of Cdh1 is its defining molecular activity and is currently
      expressed only through cyclin binding (GO:0030332). Human CDC20 and FZR1 carry GO:1990756
      for exactly this activity; the yeast evidence is direct and from this species. This is a
      molecular-function term for an activity Cdh1 itself performs (bringing ligase and substrate
      together), not a process inferred from necessity. It is proposed conservatively, and
      whether SGD prefers to keep the substrate facet on GO:0030332 is raised in
      suggested_questions.
    supported_by:
    - reference_id: PMID:11566880
      supporting_text: >-
        This study provides evidence that Hct1 functions as a substrate receptor that recognizes
        target proteins and recruits them to the APC for ubiquitylation and subsequent
        proteolysis
      reference_section_type: ABSTRACT
    - reference_id: PMID:11566880
      supporting_text: >-
        Thus, alterations of Hct1 at the N- or C-terminus are compatible with the binding of
        Hct1 to Clb2, but interfere with binding to the APC, suggesting that different domains
        of Hct1 are responsible for substrate recognition and APC association
      reference_section_type: RESULTS
    - reference_id: file:yeast/CDH1/CDH1-deep-research-falcon.md
      supporting_text: >-
        Cdh1 is a noncatalytic adaptor/coactivator for APC/C, a multisubunit RING-family E3
        ubiquitin ligase. It forms **APC/C–Cdh1**, recruits appropriately marked proteins to
        the ligase, and promotes their ubiquitylation and subsequent proteasomal destruction.
