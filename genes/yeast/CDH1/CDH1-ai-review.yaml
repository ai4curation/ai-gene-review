    of APC/C(Cdh1).
  findings:
  - statement: Cdh1p-GFP is nuclear in G1 and predominantly cytoplasmic from S phase to the end of mitosis, with export by Msn5p and import by Pse1p regulated by Cdc28p phosphorylation.
    supporting_text: Here we show that Cdh1p is nuclear during the G(1) phase of the cell cycle, but redistributes to the cytoplasm between S phase and the end of mitosis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of both IDA localisation rows.
