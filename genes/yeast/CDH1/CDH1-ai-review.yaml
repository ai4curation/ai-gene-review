id: P53197
gene_symbol: CDH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Cdh1 (Hct1) is one of the two WD40 beta-propeller coactivators of the budding-yeast
  anaphase-promoting complex/cyclosome (APC/C), the multisubunit RING E3 ubiquitin ligase that
  drives mitotic exit and G1. It is not itself catalytic: it docks onto the APC/C core through
  its N-terminal C-box and C-terminal Ile-Arg tail, contacting the TPR subunits Cdc23 and Cdc27,
  and through its C-terminal WD40 propeller it recognises D-box and KEN-box degrons on
  substrates and recruits them to the ligase. APC/C-Cdh1 takes over from APC/C-Cdc20 in late
  anaphase, once Cdc14 phosphatase has removed the inhibitory Cdk1 phosphorylation from Cdh1,
  and stays active through telophase and G1, directing the ubiquitination and proteasomal
  destruction of the mitotic cyclins Clb2 and Clb3, the Polo kinase Cdc5, Cdc20 itself, the
  spindle proteins Ase1, Cin8, Kip1 and Fin1, the septin-associated kinase Hsl1, the IQGAP
  Iqg1, the transcriptional repressors Nrm1 and Yhp1 and other cell-cycle regulators. Clb2
  destruction keeps mitotic CDK activity low in G1 (redundantly with the CDK inhibitor Sic1),
  Cdc5 destruction returns Cdc14 to the nucleolus and so terminates the mitotic-exit network,
  turnover of the microtubule-associated proteins supports spindle disassembly and restrains
  premature spindle pole body separation, and Iqg1 destruction contributes to dismantling the
  actomyosin ring after cytokinesis. Cdh1 is switched off at Start by multisite Cdk1
  phosphorylation, which blocks APC/C binding and drives Msn5-dependent nuclear export, and it
  is further restrained in S phase and mitosis by the pseudosubstrate inhibitor Acm1 (in a
  ternary complex with Bmh1). The protein is nuclear in G1, where APC/C-Cdh1 is active, and
  predominantly cytoplasmic from S phase to the end of mitosis. CDH1 is not essential, but
  cdh1 null cells stabilise Clb2 and other substrates and show defects in spindle and
  actomyosin-ring disassembly. In this species the symbol CDH1 refers to this APC/C activator,
  not to a cadherin.
