        redistributes to the cytoplasm between S phase and the end of mitosis
      reference_section_type: ABSTRACT
    - reference_id: PMID:12456658
      supporting_text: >-
        Cdh1p binds to the importin Pse1p and the exportin Msn5p, which is necessary and
