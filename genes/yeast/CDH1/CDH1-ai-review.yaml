- term:
    id: GO:0030332
    label: cyclin binding
  evidence_type: IDA
  original_reference_id: PMID:11566880
  qualifier: enables
  review:
    summary: >-
      Schwab et al. co-immunoprecipitated Hct1 with the mitotic cyclins Clb2 and Clb3 (and the
      Polo kinase Cdc5) but not with Pds1 or Clb5, showed that a Clb2 derivative unable to bind
      Hct1 is stabilised in G1, and showed that C-box or C-terminal mutants that cannot bind the
      APC still bind Clb2, separating substrate recognition from APC association.
    action: ACCEPT
    reason: >-
      Direct, specific and functionally meaningful: cyclin binding is the substrate-receptor
      face of Cdh1, the evidence that led to the model of Cdc20-family proteins as substrate
      recognition subunits of the APC/C. It is the concrete instance of the
      ubiquitin-like ligase-substrate adaptor activity (GO:1990756) used in core_functions and
      is retained as a core annotation.
    supported_by:
    - reference_id: PMID:11566880
      supporting_text: >-
        Thus, Hct1 can bind Clb2, Clb3 and Cdc5, but not Pds1, thus supporting a role of Hct1 in
        the recruitment of specific APC substrates
      reference_section_type: RESULTS
    - reference_id: PMID:11566880
      supporting_text: >-
        These results indicate that the binding of Clb2 to Hct1 is necessary for the
        stage-specific proteolysis of Clb2, and thus further support a role of Hct1 in substrate
        recruitment
      reference_section_type: RESULTS
