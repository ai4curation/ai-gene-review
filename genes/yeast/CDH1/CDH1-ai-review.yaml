core_functions:
- description: >-
    Substrate receptor of the APC/C: the Cdh1 WD40 propeller recognises D-box and KEN-box
    degrons on late-mitotic and G1 substrates (Clb2, Clb3, Cdc5, Cdc20, Ase1, Cin8, Kip1, Fin1,
    Hsl1, Iqg1, Nrm1, Yhp1) and recruits them to the APC/C catalytic core for polyubiquitination
    and proteasomal degradation; substrate binding is independent of, and separable from, APC/C
    binding.
