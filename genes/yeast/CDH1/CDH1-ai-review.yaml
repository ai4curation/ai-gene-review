proposed_new_terms:
- proposed_name: mitotic actomyosin contractile ring disassembly
  proposed_definition: >-
    The controlled breakdown of a mitotic actomyosin contractile ring, in which its constituent
    proteins (such as type II myosin, myosin light chains and IQGAP) are removed from the
    division site during and after ring contraction, as part of mitotic cytokinesis.
  justification: >-
    Tully et al. (PMID:19109423) show that APC/C-Cdh1 promotes actomyosin-ring disassembly
    during and after contraction, in part through degradation of Iqg1, while contraction itself
    is unaffected. GO has assembly (GO:1903475), maturation (GO:1902406) and contraction
    (GO:1902404) children of actomyosin contractile ring organization but no disassembly term,
    so the CDH1 and APC2 annotations from this paper were placed on 'positive regulation of
    mitotic actomyosin contractile ring contraction', which the paper's data contradict. Septin
    ring disassembly (GO:0031107) is the naming precedent.
  proposed_parent:
    id: GO:0044837
    label: actomyosin contractile ring organization
suggested_questions:
- question: >-
    The 'deactivation of mitotic spindle assembly checkpoint' IMP (PMID:25025567) is based on
    partial APC/C-Cdh1 activity toward securin in SAC-arrested metaphase cells. Does the full
    text show Cdh1 silencing SAC signalling itself (MCC disassembly, Mad2/Mad3 release from
    Cdc20), or only bypassing the checkpoint by degrading securin and Cdc20? If the latter, is
    the parent term (positive regulation of mitotic metaphase/anaphase transition) preferred,
    and should cdh1 null cells' normal anaphase timing be weighed against a core-function
    reading?
  experts: []
- question: >-
    Should yeast Cdh1 carry GO:1990756 ubiquitin-like ligase-substrate adaptor activity, as
    human CDC20 and FZR1 do, given the direct evidence that it binds Clb2/Clb3/Cdc5 independently
    of APC/C association (PMID:11566880)? SGD currently expresses the substrate-receptor facet
    through cyclin binding (GO:0030332) and the activator facet through GO:1990757; neither yeast
    CDC20 nor CDH1 carries GO:1990756, which may be a deliberate convention.
  experts: []
- question: >-
    Would SGD support a 'mitotic actomyosin contractile ring disassembly' term (proposed here)
    so that the CDH1 and APC2 annotations from PMID:19109423 can be moved off 'positive
    regulation of mitotic actomyosin contractile ring contraction', which that paper's data
    contradict (contraction rate is normal in cdh1 null cells)?
  experts: []
suggested_experiments:
- hypothesis: >-
    Cdh1 substrates other than Iqg1 (candidates include Bud4, the anillin homologue) account for
    the residual actomyosin-ring disassembly defect of cdh1 null cells that APC-resistant Iqg1
    does not phenocopy.
  description: >-
    Combine the Iqg1-delta42 APC-resistant allele with degron-mutant alleles of candidate
    bud-neck substrates (Bud4, Hof1, Mlc1-associated factors) and score Myo1-GFP patch
    persistence and septum morphology by time-lapse and electron microscopy; complement with in
    vitro APC/C-Cdh1 ubiquitination of the candidates.
  experiment_type: genetic epistasis with degron mutants and reconstituted ubiquitination
- hypothesis: >-
    The partial metaphase activity of APC/C-Cdh1 toward securin reported by Nagai and Ushimaru
    reflects incomplete Cdk1 phosphorylation of Cdh1 during a nocodazole arrest rather than a
    regulated checkpoint-antagonising function.
  description: >-
    Compare securin and Cdc20 turnover in SAC-arrested cells carrying wild-type CDH1, cdh1
    null, the phospho-site mutant alleles that separate nuclear localisation (sites 1-3) from
    APC/C binding (sites 4-9), and acm1 null, using single-cell degradation reporters; test
    whether Cdc14-dephosphorylation-resistant Cdh1 abolishes the effect.
  experiment_type: single-cell degradation reporter assays with phospho-site mutants
