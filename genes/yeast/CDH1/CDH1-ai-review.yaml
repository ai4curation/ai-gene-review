    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21460798
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q08981
  review:
    summary: >-
      IPI (IntAct) with Acm1 (UniProtKB:Q08981), the pseudosubstrate inhibitor of APC/C-Cdh1.
      Burton et al. showed that Acm1 engages the Cdh1 WD40 propeller through a D-box, a KEN box
      and an additional A-motif, blocking substrate binding without itself being ubiquitinated,
      and a genetic screen mapped Cdh1 WD40 residues (near the D-box-recognition surface)
      required for the A-motif interaction.
    action: REMOVE
    reason: >-
      Generic protein binding (GO:0005515) adds no information about what Cdh1 does. The row
      records Cdh1 as the target of an inhibitor; the functional statement (ubiquitin ligase
      inhibitor activity) belongs on ACM1, not on CDH1, and the informative Cdh1 activities that
      the paper exploits, D-box/KEN-box substrate recognition and APC/C activation, are already
      annotated through GO:0030332, GO:0010997 and GO:1990757. Removal does not assert that the
      interaction is false; the biology is captured in the notes and in the specific MF/BP
      annotations, consistent with the handling of the EMI1/FBXO5 pseudosubstrate rows on human
      FZR1.
    supported_by:
    - reference_id: PMID:21460798
      supporting_text: >-
