- id: file:yeast/CDH1/CDH1-deep-research-falcon.md
  title: Falcon (Edison) deep-research report for yeast CDH1
  findings:
  - statement: >-
      Synthesis describing yeast Cdh1/Hct1 as the noncatalytic late-mitotic/G1 coactivator and
      substrate receptor of the APC/C, docking via the C-box and IR tail, recognising D-box and
      KEN-box degrons, acting principally in the nucleus, and regulated by Cdk1 phosphorylation,
      Cdc14 dephosphorylation, Msn5 export and the Acm1 pseudosubstrate.
    supporting_text: >-
      Cdh1 is a noncatalytic adaptor/coactivator for APC/C, a multisubunit RING-family E3
      ubiquitin ligase. It forms **APC/C–Cdh1**, recruits appropriately marked proteins to
      the ligase, and promotes their ubiquitylation and subsequent proteasomal destruction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      LLM-generated synthesis; the claims used here (substrate receptor, nuclear site of
      activity, C-box/IR-tail docking) were cross-checked against the cached primary papers.
      Note that it also cites unpublished preprints (Ostapenko and Solomon 2018/2024 on
      Snf1-dependent Cdh1 turnover in meiosis), which are not used for any annotation decision.
- id: PMID:11566880
  title: Yeast Hct1 recognizes the mitotic cyclin Clb2 and other substrates of the
    ubiquitin ligase APC.
  findings:
  - statement: Hct1 co-immunoprecipitates with the mitotic cyclins Clb2 and Clb3 and the Polo kinase Cdc5, but not with securin Pds1 or Clb5; a Clb2 derivative that cannot bind Hct1 is stabilised in G1.
    supporting_text: Thus, Hct1 can bind Clb2, Clb3 and Cdc5, but not Pds1, thus supporting a role of Hct1 in the recruitment of specific APC substrates
  - statement: The C-box motif in the N-terminal region of Hct1 is required for APC association but not for substrate binding, separating the two functions.
    supporting_text: Furthermore, these results show that Hct1 requires the newly identified C-box motif to associate with the APC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; title and organism (S. cerevisiae Hct1/Cdh1) verified. Establishes the substrate-receptor model.
- id: PMID:12456658
