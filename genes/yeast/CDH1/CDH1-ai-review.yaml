- term:
    id: GO:1902426
    label: deactivation of mitotic spindle assembly checkpoint
  evidence_type: IMP
  original_reference_id: PMID:25025567
  qualifier: involved_in
  review:
    summary: >-
      Nagai and Ushimaru reported that Cdh1 is partially active in SAC-arrested metaphase cells,
      where it mediates securin (Pds1) degradation and Cdc20 degradation, and concluded that
      Cdh1 opposes the SAC and promotes the anaphase transition. Only the abstract is cached.
    action: MODIFY
    reason: >-
      The abstract describes APC/C-Cdh1 bypassing an active checkpoint by degrading securin
      independently of the SAC-inhibited APC/C-Cdc20, i.e. the SAC remains engaged and Cdh1
      antagonises its effect, rather than silencing checkpoint signalling. That is the parent
      process, positive regulation of mitotic metaphase/anaphase transition (GO:0045842), not
      the more specific 'deactivation of the mitotic spindle assembly checkpoint'. The
      contribution is also partial and single-source (cdh1 null cells enter anaphase normally),
      so it is not a core function. The curator read the full text; if it contains evidence that
      Cdh1 silences SAC signalling per se, retaining the child term would be defensible, and
      this is raised in suggested_questions.
    proposed_replacement_terms:
    - id: GO:0045842
      label: positive regulation of mitotic metaphase/anaphase transition
    supported_by:
    - reference_id: PMID:25025567
      supporting_text: >-
        Here, we show that Cdh1 is partially active and mediates securin degradation even in
        SAC-active metaphase cells
      reference_section_type: ABSTRACT
    - reference_id: PMID:25025567
      supporting_text: >-
        These results indicate that Cdh1 opposes the SAC and promotes anaphase transition
      reference_section_type: ABSTRACT
- term:
