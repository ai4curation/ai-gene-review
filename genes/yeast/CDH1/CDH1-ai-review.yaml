    reference_section_type: ABSTRACT
- description: >-
    APC/C coactivator for mitotic exit and G1: once Cdc14 removes the inhibitory Cdk1
    phosphorylation in late anaphase, Cdh1 docks onto the APC/C core through its C-box and IR
    tail (Cdc27/Cdc23 TPR grooves) and switches the ligase on toward its substrates, driving
    Clb2 destruction (redundantly with Sic1) to keep mitotic CDK activity low through G1, and
    Cdc5 destruction to return Cdc14 to the nucleolus; the activity is terminated at Start by
    Cdk1 phosphorylation, Msn5-mediated nuclear export and the pseudosubstrate inhibitor Acm1.
