- term:
    id: GO:0010697
    label: negative regulation of mitotic spindle pole body separation
  evidence_type: IGI
  original_reference_id: PMID:16688214
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000364
  review:
    summary: >-
      IGI with CDC28 (SGD:S000000364). Crasta et al. showed that cdc28-Y19E cells, which cannot
      activate Cdk1, fail to separate SPBs because persistently active APC/C-Cdh1 degrades the
      microtubule-associated proteins Cin8, Kip1 and Ase1; deleting CDH1 restores their
      accumulation and short-spindle assembly, and spindles form somewhat prematurely in cdh1
      null cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      The genetic interaction is real and the mechanism is direct: Cdh1 restrains SPB separation
      by delivering Cin8, Kip1 and Ase1 to the APC/C for degradation until Cdk1 inactivates it.
      This is a genuine but downstream output of the core substrate-receptor/coactivator
      function, most visible when Cdk1 activation is blocked, so it is retained as a non-core
      process rather than as a defining function.
    supported_by:
    - reference_id: PMID:16688214
      supporting_text: >-
        We show that cells that fail to activate Cdk1 are devoid of spindles due to persistently
        active APCCdh1, which targets microtubule-associated proteins Cin8, Kip1 and Ase1 for
        degradation
      reference_section_type: ABSTRACT
    - reference_id: PMID:16688214
      supporting_text: >-
        The instability of these proteins is dependent on Cdh1 since deletion of CDH1 allows
        accumulation of these proteins and assembly of a short spindle in these mutants
      reference_section_type: DISCUSSION
