- term:
    id: GO:0045842
    label: positive regulation of mitotic metaphase/anaphase transition
  evidence_type: IMP
  original_reference_id: PMID:9831566
  qualifier: involved_in
  review:
    summary: >-
      Zachariae et al. showed that mitotic cyclin proteolysis, which commences in anaphase and
      persists through G1, requires Hct1 binding to the APC, that CDK phosphorylation of Hct1
      blocks the interaction, and that this mutual inhibition explains how mitotic CDK activity
      is suppressed in G1. The paper concerns the anaphase-to-G1 (mitotic exit) phase of APC
      activity, not the metaphase/anaphase transition.
    action: MODIFY
    reason: >-
      GO:0045842 is defined as the transition triggered by activation of the APC by Cdc20 with
      degradation of securin. Cdh1 is dispensable for Pds1/securin degradation and for anaphase
      onset (cdh1 null cells degrade Pds1 normally, PMID:9334304), and the cited study's
      subject is Hct1-dependent cyclin proteolysis from anaphase through G1, which drives the
      high-to-low CDK conversion that defines exit from mitosis. The essence of the annotation
      (Cdh1 promotes a mitotic transition by activating cyclin destruction) is sound, so the
      row should be re-expressed as positive regulation of exit from mitosis (GO:0031536),
      the term SGD uses for the analogous ESP1 evidence, rather than the metaphase/anaphase
      term. Only the abstract is cached; the curator read the full text, but the abstract
      itself places the process in anaphase-to-G1.
    proposed_replacement_terms:
    - id: GO:0031536
      label: positive regulation of exit from mitosis
    supported_by:
    - reference_id: PMID:9831566
      supporting_text: >-
        Proteolysis commences during anaphase, persisting throughout G1 until it is terminated by
        cyclin-dependent kinases (CDKs) as cells enter S phase
      reference_section_type: ABSTRACT
    - reference_id: PMID:9831566
      supporting_text: >-
        The mutual inhibition between APC and CDKs explains how cells suppress mitotic CDK
        activity during G1
      reference_section_type: ABSTRACT
    - reference_id: PMID:9334304
      supporting_text: >-
        cdh1Delta mutants were impaired in the degradation of Ase1 and Clb2 but not in that of
        Pds1
      reference_section_type: ABSTRACT
    - reference_id: PMID:18172166
      supporting_text: >-
        The final step in CDK inactivation that triggers exit from mitosis is brought about by
        two redundant mechanisms: degradation of Clb cyclins by the APC/C-Cdh1 and binding of
        the Clb–CDK inhibitor Sic1 to the kinase complex
      reference_section_type: DISCUSSION
