- term:
    id: GO:2000060
    label: positive regulation of ubiquitin-dependent protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:18172166
  qualifier: involved_in
  review:
    summary: >-
      Visintin et al. showed that Cdc14-activated APC/C-Cdh1 degrades the Polo kinase Cdc5 after
      mitotic exit; cdh1 null cells accumulate Cdc5, release Cdc14 prematurely and are slow to
      return it to the nucleolus, and targeted depletion of Cdc5 restores Cdc14 resequestration
      in cdh1 null cells, defining a negative-feedback loop that limits Cdc14 activity to a short
      window.
    action: MODIFY
    reason: >-
      The finding is correct but the term is generic: the ubiquitin-dependent proteolysis
      that Cdh1 promotes here is APC/C-mediated degradation of Cdc5, which is precisely positive
      regulation of anaphase-promoting complex-dependent catabolic process (GO:1905786), already
      carried by IBA/IMP/IGI. The generic parent should be replaced by the specific child; the
      downstream consequence (Cdc14 return to the nucleolus, silencing of FEAR/MEN) is described
      in the notes rather than annotated, since Cdh1 acts on it only through Cdc5 turnover.
    proposed_replacement_terms:
    - id: GO:1905786
      label: positive regulation of anaphase-promoting complex-dependent catabolic process
    supported_by:
    - reference_id: PMID:18172166
      supporting_text: >-
        Our results indicate that the APC/C-Cdh1 promotes the return of Cdc14 into the nucleolus
        by degrading Cdc5
      reference_section_type: RESULTS
    - reference_id: PMID:18172166
      supporting_text: >-
        Once the phosphatase is fully activated by the MEN, it dephosphorylates Cdh1 to bring
        about activation of APC/C-Cdh1
      reference_section_type: DISCUSSION
