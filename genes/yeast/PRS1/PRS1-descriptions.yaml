gene_symbol: PRS1
organism: yeast
uniprot_id: P32895
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: 5-phosphoribose 1-diphosphate synthase involved in nucleotide, histidine,
    and tryptophan biosynthesis. Active in heteromultimeric complexes with other 5-phosphoribose
    1-diphosphate synthases (PRS2, PRS3, PRS4 and PRS5).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32895
  source_id: P32895
- source: Alliance_Imported
  text: 5-phospho-ribosyl-1(alpha)-pyrophosphate synthetase; synthesizes PRPP, which
    is required for nucleotide, histidine, and tryptophan biosynthesis; plays a key
    role in cell wall integrity (CWI) pathway; one of five related enzymes, which
    are active as heteromultimeric complexes; missense mutations in human homolog
    PRPS1 are associated with neuropathic Arts syndrome and Charcot-Marie Tooth (CMTX5)
    disease
  source_type: curated
  url: https://www.yeastgenome.org/locus/PRS1
  source_id: SGD:S000001664
- source: Alliance_Automated
  text: Contributes to ribose phosphate diphosphokinase activity. Involved in 5-phosphoribose
    1-diphosphate biosynthetic process. Located in cytoplasm. Part of ribose phosphate
    diphosphokinase complex. Used to study Arts syndrome; Charcot-Marie-Tooth disease
    X-linked recessive 5; and X-linked nonsyndromic deafness. Orthologous to human
    PRPSAP1 (phosphoribosyl pyrophosphate synthetase associated protein 1) and PRPSAP2
    (phosphoribosyl pyrophosphate synthetase associated protein 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PRS1
  source_id: SGD:S000001664
