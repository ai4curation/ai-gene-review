  text: Contributes to ribose phosphate diphosphokinase activity. Involved in 5-phosphoribose
    1-diphosphate biosynthetic process. Located in cytoplasm. Part of ribose phosphate
    diphosphokinase complex. Used to study Arts syndrome; Charcot-Marie-Tooth disease
    X-linked recessive 5; and X-linked nonsyndromic deafness. Orthologous to human
    PRPSAP1 (phosphoribosyl pyrophosphate synthetase associated protein 1) and PRPSAP2
    (phosphoribosyl pyrophosphate synthetase associated protein 2).
