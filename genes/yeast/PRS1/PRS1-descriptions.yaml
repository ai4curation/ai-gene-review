- source: Alliance_Imported
  text: 5-phospho-ribosyl-1(alpha)-pyrophosphate synthetase; synthesizes PRPP, which
    is required for nucleotide, histidine, and tryptophan biosynthesis; plays a key
    role in cell wall integrity (CWI) pathway; one of five related enzymes, which
    are active as heteromultimeric complexes; missense mutations in human homolog
    PRPS1 are associated with neuropathic Arts syndrome and Charcot-Marie Tooth (CMTX5)
    disease
