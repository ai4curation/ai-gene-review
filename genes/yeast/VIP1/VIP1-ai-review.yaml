core_functions:
- description: ATP-grasp kinase domain phosphorylates the 1-position of InsP6 and of the Kcs1 
    product 5-InsP7, generating 1-InsP7 and 1,5-InsP8 inositol pyrophosphate signals in the cytosol.
  molecular_function:
    id: GO:0033857
    label: 5-diphosphoinositol pentakisphosphate 1-kinase activity
  directly_involved_in:
  - id: GO:0032958
    label: inositol phosphate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18981179
    supporting_text: 1/3,5-(PP)2-IP4 is the isomeric structure of the bis-diphosphoinositol 
      tetrakisphosphate that is synthesized by yeasts and mammals
  - reference_id: PMID:17412958
    supporting_text: Vip1 and Asp1 acted as enzymes that encode inositol hexakisphosphate (IP6) and 
      inositol heptakisphosphate (IP7) kinase activities
- description: InsP6 1-kinase activity producing 1-InsP7.
  molecular_function:
    id: GO:0052723
    label: inositol hexakisphosphate 1-kinase activity
  directly_involved_in:
  - id: GO:0032958
    label: inositol phosphate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18981179
    supporting_text: the VIP/PPIP5K enzymes convert inositol hexakisphosphate to 
      1/3-diphosphoinositol pentakisphosphate
- description: Pi-inhibited C-terminal phosphatase domain removes the 1-beta-phosphate from 
    1,5-InsP8 (and 1-InsP7), so that the kinase/phosphatase balance couples inositol pyrophosphate 
    levels to phosphate status and the PHO response.
  molecular_function:
    id: GO:0052841
    label: inositol bisdiphosphate tetrakisphosphate diphosphatase activity
  directly_involved_in:
  - id: GO:0030643
    label: intracellular phosphate ion homeostasis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:39966396
    supporting_text: ScVip1PD specifically hydrolyzes 1,5-InsP8 using a conserved phytase active 
      site.
  - reference_id: PMID:17412959
    supporting_text: suggesting that Vip1 mediates synthesis of IP 7 relevant to the PHO system
suggested_questions:
- question: Which Vip1 product (1-InsP7 or 1,5-InsP8) is the physiological ligand of Pho81 and of 
    SPX-domain proteins in budding yeast, and how is the kinase/phosphatase balance of Vip1 set in 
    vivo by Pi?
suggested_experiments:
- description: Compare PHO-pathway signalling and InsP7/InsP8 isomer profiles (capillary 
    electrophoresis-MS) in vip1 kinase-dead versus phosphatase-dead (RH/AA) point mutants under 
    Pi-replete and Pi-starved conditions.
