  label: Saccharomyces cerevisiae S288C
description: 'Vip1 is the budding-yeast diphosphoinositol pentakisphosphate kinase (PPIP5K), a large bifunctional
  cytoplasmic enzyme with an N-terminal ATP-grasp inositol pyrophosphate kinase domain and a C-terminal
  histidine-acid-phosphatase (phytase-like) domain. The kinase domain transfers a beta-phosphate to the
  1-position of the inositol ring, converting InsP6 to 1-InsP7 and the Kcs1 product 5-InsP7 to 1,5-InsP8
  ((PP)2-InsP4). The phosphatase domain hydrolyses the 1-diphosphate, preferring 1,5-InsP8, and is inhibited
  by inorganic phosphate, so that the balance of the two activities couples inositol pyrophosphate levels
  to phosphate availability. Vip1-generated inositol pyrophosphate is required for Pho81-dependent inhibition
  of the Pho80-Pho85 cyclin-CDK in the PHO phosphate-starvation response, and Vip1 also influences cortical
  actin organisation and growth.'
