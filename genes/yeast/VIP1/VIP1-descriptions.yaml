  text: Enables diphosphoinositol-polyphosphate diphosphatase activity and inositol
    phosphate kinase activity. Involved in inositol phosphate biosynthetic process
    and intracellular phosphate ion homeostasis. Located in cytoplasm. Human ortholog(s)
    of this gene implicated in autosomal recessive nonsyndromic deafness 100. Orthologous
    to several human genes including PPIP5K2 (diphosphoinositol pentakisphosphate
    kinase 2).
