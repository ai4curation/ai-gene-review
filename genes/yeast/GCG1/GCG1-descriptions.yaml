- source: Alliance_Imported
  text: Gamma-glutamyl cyclotransferase; cleaves the gamma-glutamyl bond of glutathione
    to yield 5-oxoproline and a Cys-Gly dipeptide; similar to mammalian pro-apoptotic
    protein ChaC1; expression of mouse ChaC1 in yeast increases apoptosis; green fluorescent
    protein (GFP)-fusion protein localizes to the cytoplasm and nucleus; periodically
    expressed during the metabolic cycle
  source_type: curated
