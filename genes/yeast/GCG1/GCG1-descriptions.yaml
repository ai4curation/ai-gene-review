gene_symbol: GCG1
organism: yeast
uniprot_id: P32656
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the cleavage of glutathione into 5-oxo-L-proline and a Cys-Gly dipeptide.
    Acts specifically on glutathione, but not on other gamma-glutamyl peptides. Allows
    utilization of gluthathione through subsequent cleavage of the Cys-Gly dipeptide
    by Cys-Gly metallodipeptidase DUG1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32656
  source_id: P32656
- source: Alliance_Imported
  text: Gamma-glutamyl cyclotransferase; cleaves the gamma-glutamyl bond of glutathione
    to yield 5-oxoproline and a Cys-Gly dipeptide; similar to mammalian pro-apoptotic
    protein ChaC1; expression of mouse ChaC1 in yeast increases apoptosis; green fluorescent
    protein (GFP)-fusion protein localizes to the cytoplasm and nucleus; periodically
    expressed during the metabolic cycle
  source_type: curated
  url: https://www.yeastgenome.org/locus/GCG1
  source_id: SGD:S000000965
- source: Alliance_Automated
  text: Enables gamma-glutamylcyclotransferase activity and glutathione specific gamma-glutamylcyclotransferase
    activity. Involved in glutathione catabolic process. Located in cytoplasm and
    nucleus. Orthologous to human CHAC1 (ChaC glutathione specific gamma-glutamylcyclotransferase
    1) and CHAC2 (ChaC glutathione specific gamma-glutamylcyclotransferase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GCG1
  source_id: SGD:S000000965
