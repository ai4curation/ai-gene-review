description: Gcg1 (YER163C) is the Saccharomyces cerevisiae member of the ChaC subfamily of gamma-glutamylcyclotransferases.
  It is a cytosolic enzyme (also detected in the nucleus) that degrades glutathione specifically, cyclising
  its gamma-glutamyl moiety to 5-oxo-L-proline and releasing L-cysteinylglycine (EC 4.3.2.7); it does
  not act on other gamma-glutamyl peptides. The Cys-Gly product is hydrolysed by the Dug1 dipeptidase
  and 5-oxoproline is returned to glutamate by the ATP-dependent 5-oxoprolinase Oxp1, providing an intracellular
  route for glutathione turnover and recovery of cysteine. Overexpression of Gcg1 depletes cellular glutathione.
