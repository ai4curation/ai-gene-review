suggested_questions:
- question: What is the relative contribution of Gcg1 versus the Dug2/Dug3 complex to intracellular glutathione
    turnover under sulfur limitation in S. cerevisiae?
- question: Is GCG1 transcriptionally induced by sulfur or nitrogen limitation, as DUG genes are, or by
    stress analogous to ATF4-driven CHAC1?
suggested_experiments:
- hypothesis: Gcg1 and Dug2/Dug3 are partially redundant routes for GSH utilization.
  description: Compare growth on glutathione as sole sulfur source and GSH half-life in gcg1, dug3 and
    gcg1 dug3 strains (met15 background), with 5-oxoproline measured in oxp1 combinations.
