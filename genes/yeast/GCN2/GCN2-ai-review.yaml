core_functions:
- description: 'Uncharged-tRNA-activated eIF2alpha kinase. Gcn2 binds deacylated tRNAs through its HisRS-like and
    C-terminal domains on ribosomes, which activates its kinase domain to phosphorylate eIF2alpha (Sui2) Ser51.
    This lowers eIF2-GTP-Met-tRNAi ternary complex and drives GCN2-mediated signaling: repression of general translation
    initiation and translational induction of GCN4.'
  molecular_function:
    id: GO:0004694
    label: eukaryotic translation initiation factor 2alpha kinase activity
  directly_involved_in:
  - id: GO:0140469
    label: GCN2-mediated signaling
  - id: GO:0010998
    label: regulation of translational initiation by eIF2 alpha phosphorylation
  - id: GO:0034198
    label: cellular response to amino acid starvation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1739968
    supporting_text: Substitution of Ser-51 with alanine eliminates phosphorylation of eIF-2 alpha by GCN2 in vivo
      and in vitro and abolishes increased expression of GCN4 and amino acid biosynthetic genes under its control
      in amino acid-starved cells.
  - reference_id: PMID:7623840
    supporting_text: These in vivo and in vitro experiments indicate that synthetase-related sequences regulate
      GCN2 kinase function by monitoring the levels of multiple uncharged tRNAs that accumulate during amino acid
      limitations.
- description: Starvation sensing at the ribosome. Gcn2 binds uncharged tRNA and associates with translating ribosomes
    through its C-terminal domain; both are required for activation, and placing the kinase on the ribosome lets
    it detect uncharged tRNA delivered from the A site with Gcn1.
  molecular_function:
    id: GO:0000049
    label: tRNA binding
  directly_involved_in:
  - id: GO:0140469
    label: GCN2-mediated signaling
  locations:
  - id: GO:0022626
    label: cytosolic ribosome
  supported_by:
  - reference_id: PMID:10983975
    supporting_text: GCN2 bound several deacylated tRNAs with similar affinities, and aminoacylation of tRNAphe
      weakened its interaction with GCN2.
  - reference_id: PMID:9430731
    supporting_text: These results indicate that appropriate ribosome localization of the kinase is an obligate
      step in the mechanism leading to translational control by GCN2.
suggested_questions:
- question: PMID:21849502 describes binding of the elongation factor eEF1A (TEF1/TEF2) to the Gcn2 C-terminus, yet
    GOA carries a translation initiation factor binding row WITH TIF11 (eIF1A) from this paper and UniProt's SUBUNIT
    note names TIF11. Was eIF1A tested, or is this an eEF1A/eIF1A conflation?
- question: Gcn2 phosphorylation of Kog1 down-regulates TORC1 (PMID:28057755). Should this be captured as protein
    serine kinase activity with negative regulation of TORC1 signaling (GO:1904262), rather than protein kinase
    inhibitor activity?
suggested_experiments:
- hypothesis: The Gcn2 contribution to the G1/S DNA-damage checkpoint acts through eIF2alpha phosphorylation rather
    than through a separate checkpoint substrate.
  description: Compare G1/S delay after MMS in gcn2-deleted cells, cells carrying non-phosphorylatable eIF2alpha
    S51A, and S51D phosphomimetic cells lacking Gcn2, and test whether GCN4 deletion phenocopies the gcn2 defect.
