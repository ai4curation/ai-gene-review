id: P15442
gene_symbol: GCN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Gcn2 is the sole eIF2alpha kinase of Saccharomyces cerevisiae and the sensor kinase of the general
  amino acid control (GAAC), the yeast form of the integrated stress response. It is a large multidomain protein
  with an N-terminal RWD domain that binds the activator Gcn1 (in the Gcn1-Gcn20 complex), a pseudokinase domain,
  the protein kinase domain, a histidyl-tRNA synthetase-like domain and a C-terminal domain that mediates dimerization
  and ribosome binding. Gcn2 is a constitutive dimer that associates loosely with translating ribosomes in the cytosol.
  When amino acids (or purines, or glucose) are limiting, uncharged tRNAs accumulate and, delivered with the help
  of Gcn1 at the ribosomal A site, bind the HisRS-like and C-terminal domains; this relieves autoinhibition of the
  kinase domain, which trans-autophosphorylates its activation loop (Thr882/Thr887) and phosphorylates eIF2alpha
  (Sui2) on Ser51 (Ser52 in UniProt numbering). Phosphorylated eIF2 inhibits its guanine nucleotide exchange factor
  eIF2B, lowering ternary complex levels; global translation initiation falls while ribosomes bypass the inhibitory
  uORFs of GCN4 mRNA, so Gcn4 is translated and activates amino acid biosynthetic genes. Gcn2 activity is restrained
  by eEF1A and Yih1 and it also phosphorylates the TORC1 subunit Kog1 to down-regulate TORC1 during starvation.
  It has additional reported roles in a G1/S delay after DNA damage.
