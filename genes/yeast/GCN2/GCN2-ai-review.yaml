- term:
    id: GO:0004860
    label: protein kinase inhibitor activity
  evidence_type: IMP
  original_reference_id: PMID:28057755
  qualifier: enables
  review:
    summary: In starved cells Gcn2 binds TORC1 and phosphorylates its regulatory subunit Kog1, lowering TORC1 activity;
      in gcn2 mutants TORC1 signaling is elevated and unresponsive to starvation.
    action: MODIFY
    reason: The finding (Gcn2 down-regulates TORC1) is sound, but the mechanism reported is phosphorylation of Kog1
      by Gcn2 kinase activity, not a non-catalytic inhibitor activity. GO represents a kinase that inhibits its
      target by phosphorylation with the kinase activity (protein serine kinase activity, already on this gene)
      plus the regulated process. The process is negative regulation of TORC1 signaling (GO:1904262), proposed as
      the replacement; the kinase activity is already covered by GO:0106310 rows. The replacement crosses from the
      molecular-function to the biological-process aspect, so the replacement annotation takes the qualifier
      involved_in, not enables.
    proposed_replacement_terms:
    - id: GO:1904262
      label: negative regulation of TORC1 signaling
    supported_by:
    - reference_id: PMID:28057755
      supporting_text: Gcn2 binds to TORC1 and phosphorylates Kog1, the unique regulatory subunit of TORC1, resulting
        in down-regulation of TORC1 kinase activity.
