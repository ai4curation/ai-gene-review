gene_symbol: CPR6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: CPR6 is one of two CyP-40-like cyclophilin immunophilins in S. cerevisiae
  (the other being CPR7). It is a peptidyl-prolyl cis-trans isomerase (PPIase, EC
  5.2.1.8) that functions as an Hsp90 co-chaperone. CPR6 contains an N-terminal cyclophilin
  PPIase domain and a C-terminal TPR (tetratricopeptide repeat) domain that mediates
  binding to Hsp90 (HSP82/HSC82). It catalyzes the cis-trans isomerization of proline
  imidic peptide bonds in oligopeptides and contributes to protein refolding. CPR6
  binds cyclosporin A. Unlike CPR7, CPR6 is not essential for normal growth. CPR6
  interacts with Hsp90 and also associates with ribosomes.
