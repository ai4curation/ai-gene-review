suggested_questions:
- question: Does the chaperone assay of Mayr et al. (PMID:10942767) demonstrate that
    CPR6 actively promotes refolding, or only in-situ suppression of aggregation?
    The answer decides whether CPR6 (and its paralog CPR7) should carry GO:0044183
    (protein folding chaperone) or an unfolded protein holdase term such as GO:0140309.
    The cached record is abstract-only, so this cannot be settled here.
  experts:
  - Johannes Buchner
  - Klaus Richter
