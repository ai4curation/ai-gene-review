- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  retired: true
  review:
    summary: 'ARBA prediction for unfolded protein binding. GO:0051082 is formally
      obsolete (QuickGO: "obsolete unfolded protein binding") and its own obsoletion
      comment directs replacement by GO:0044183 (protein folding chaperone) or GO:0140309
      (unfolded protein holdase activity); the direct yeast evidence supports GO:0044183
      as the replacement.'
    action: MODIFY
    reason: 'GO:0051082 is obsolete, so it cannot be retained as-is. GO:0044183 (protein
      folding chaperone) is defined simply as "Binding to a protein or a protein-containing
      complex to assist the protein folding process" with no ATP-dependence requirement,
      so it is not restricted to ATP-dependent chaperones (the ATP-dependent foldase
      term is the separate GO:0140662). Direct yeast evidence supports a folding-chaperone
      term rather than discarding the annotation: the abstract of PMID:10942767 reports
      that CPR6 possesses chaperone activity, and SGD independently made a GO:0042026
      (protein refolding) IDA on that same paper, which this review ACCEPTs elsewhere
      in this file. The closest precedent is the direct paralog CPR7, whose IEA and
      IDA GO:0051082 rows — from the same paper — are both already MODIFY to GO:0044183
      (genes/yeast/CPR7/CPR7-ai-review.yaml). Caveat: PMID:10942767 is cached abstract-only
      (full_text_available: false), so the abstract cannot by itself discriminate
      foldase activity (GO:0044183) from in-situ aggregation prevention (GO:0140309,
      unfolded protein holdase activity); GO:0044183 is chosen for consistency with
      the CPR7 decision and with the curator-asserted GO:0042026 refolding annotation,
      and that discrimination is deferred pending full text.'
    supported_by:
    - reference_id: PMID:10942767
      supporting_text: the chaperone activity of Cpr6 is much lower than that of Cpr7
      reference_section_type: ABSTRACT
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
