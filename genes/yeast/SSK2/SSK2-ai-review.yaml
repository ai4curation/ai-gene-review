id: P53599
gene_symbol: SSK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Ssk2 (YNR031C) is a 1579-residue STE-family serine/threonine MAP kinase kinase kinase (MAP3K)
  of Saccharomyces cerevisiae that, together with its paralog Ssk22, forms the MAP3K tier of the Sln1
  branch of the high-osmolarity glycerol (HOG) pathway. A long N-terminal regulatory region holds the
  C-terminal kinase domain autoinhibited; on hyperosmotic stress the Sln1-Ypd1 phosphorelay is inhibited
  and unphosphorylated Ssk1 binds this region, triggering intramolecular autophosphorylation (activation-loop
  Thr1460) and activation. Active Ssk2 phosphorylates and activates the MAPKK Pbs2, which it recognizes
  through a Pbs2 N-terminal docking site that binds the Ssk2/Ssk22 kinase domain; Pbs2 then activates
  the p38-type MAPK Hog1. Ssk2 can also be activated independently of Ssk1 via an N-terminal segment (residues
  177-240) absent from Ssk22. Ssk2 is cytosolic in unstressed cells; after osmotic shock it transiently
  concentrates at the bud neck (requiring the septin Shs1) and bud cortex (requiring Spa2), binds actin,
  and in a kinase-dependent but Ssk1- and Ssk22-independent manner promotes reassembly of the polarized
  actin cytoskeleton and timely cell-cycle completion. Its human homolog is MTK1/MEKK4 (MAP3K4).
