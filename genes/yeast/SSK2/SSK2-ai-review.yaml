- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IDA
  original_reference_id: PMID:12181352
  qualifier: enables
  review:
    summary: Ssk2 was isolated as an actin two-hybrid interactor and forms an approximately 1:1 complex
      with actin after osmotic stress or latrunculin A treatment; an actin-interacting region (aa 323-1032)
      N-terminal to the kinase domain mediates this.
    action: KEEP_AS_NON_CORE
    reason: Direct experimental support (two-hybrid with mapped actin-interacting region, co-precipitation
      with actin in stressed cells). Actin binding is required for the Ssk2-specific actin recovery function
      but not for canonical HOG signalling; the paralog Ssk22 lacks it. Kept as a genuine, non-core activity.
    supported_by:
    - reference_id: PMID:12181352
      supporting_text: was screened, with the two-hybrid system, for actin-interacting proteins leading
        to the identification of the MAPKKK Ssk2p.
    - &id009
      reference_id: PMID:12181352
      supporting_text: Ssk2p concentrates in the neck of budding yeast cells and concurrently forms a
        1:1 complex with actin.
    - &id013
      reference_id: PMID:12181352
      supporting_text: The role of Ssk2p in actin cytoskeleton recovery does require Ssk2p localization
        to the neck, its interaction with actin, and the kinase activity of Ssk2p.
