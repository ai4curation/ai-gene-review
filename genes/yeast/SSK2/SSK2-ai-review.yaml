core_functions:
- description: 'MAP3K of the Sln1 branch of the HOG pathway: activated by binding of unphosphorylated
    Ssk1 and autophosphorylation, Ssk2 phosphorylates and activates the MAPKK Pbs2 (redundantly with Ssk22),
    initiating the Hog1 (p38-type) MAPK cascade in response to hyperosmotic stress.'
  molecular_function:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
  directly_involved_in:
  - id: GO:0038066
    label: p38MAPK cascade
  - id: GO:0007234
    label: osmosensory signaling via phosphorelay pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:7624781
    supporting_text: Pbs2p was activated by MAP kinase kinase kinases (MAPKKKs) Ssk2p and Ssk22p that
      are under the control of the SLN1-SSK1 two-component osmosensor.
  - reference_id: PMID:9482735
    supporting_text: Upon hyperosmotic treatment, SSK2 is autophosphorylated rapidly, and this reaction
      requires the interaction of SSK1 with SSK2.
  - reference_id: PMID:12853477
    supporting_text: The Ssk2/Ssk22 MAPKKKs in the SLN1 branch, when activated, exclusively phosphorylate
      the Pbs2 MAPKK.
suggested_questions:
- question: What activates Ssk2 independently of Ssk1 (via N-terminal residues 177-240), both in the osmostress
    response and in actin recovery, and is it the same upstream input?
- question: What are the Ssk2 substrates, other than Pbs2, that mediate kinase-dependent actin cytoskeleton
    recovery at the bud neck and bud cortex after osmotic stress?
- question: Is Ssk2 actin binding direct (purified proteins) and does it apply to filamentous or monomeric
    actin?
suggested_experiments:
- description: Analog-sensitive ssk2 allele in an ssk22 background combined with quantitative phosphoproteomics
    during recovery from osmotic shock, to identify Pbs2-independent Ssk2 substrates linked to actin repolarization.
- description: In vitro binding of purified Ssk2 actin-interacting region (aa 323-1032) to G-actin and
    F-actin (co-sedimentation) to test whether actin binding is direct.
