gene_symbol: SSK2
organism: yeast
uniprot_id: P53599
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Kinase involved in a signal transduction pathway that is activated by changes
    in the osmolarity of the extracellular environment. Activates the PBS2 MAP kinase
    kinase by phosphorylation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53599
  source_id: P53599
- source: Alliance_Imported
  text: MAP kinase kinase kinase of HOG1 mitogen-activated signaling pathway; interacts
    with Ssk1p, leading to autophosphorylation and activation of Ssk2p which phosphorylates
    Pbs2p; also mediates actin cytoskeleton recovery from osmotic stress; a HOG-independent
    function of Ssk2p mediates the calcium-sensitive phenotype of the ptp2 msg5 double
    disruptant; SSK2 has a paralog, SSK22, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SSK2
  source_id: SGD:S000005314
- source: Alliance_Automated
  text: Enables MAP kinase kinase kinase activity and actin binding activity. Involved
    in cellular response to osmotic stress; p38MAPK cascade; and regulation of actin
    cytoskeleton organization. Located in several cellular components, including cellular
    bud neck; cellular bud tip; and incipient cellular bud site. Orthologous to human
    MAP3K4 (mitogen-activated protein kinase kinase kinase 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SSK2
  source_id: SGD:S000005314
