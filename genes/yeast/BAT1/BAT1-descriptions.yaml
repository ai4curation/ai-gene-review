gene_symbol: BAT1
organism: yeast
uniprot_id: P38891
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Mitochondrial isozyme of branched-chain-amino-acid aminotransferase, involved
    in the biosynthesis of the branched chain amino acids (BCAAs) leucine, isoleucine,
    and valine (PubMed:21267457, PubMed:8702755, PubMed:8798704). Catalyzes the formation
    of methionine from 2-keto-4-methylthiobutyrate (KMTB) in the methionine salvage
    pathway primarily using BCAAs (leucine, isoleucine, and valine) as the amino donors
    (PubMed:18625006). Appears to be involved in the regulation of the cell cycle,
    although this may be indirect via metabolic changes (PubMed:29850466, PubMed:37497662).
    Connects BCAAs and TCA-cycle metabolism governing TCA-cycle flux to activate TORC1
    signaling (PubMed:26659116, PubMed:37497662). High copy suppressor of a temperature-sensitive
    mutation in the ABC transporter, ATM1 (PubMed:8798704).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38891
  source_id: P38891
- source: Alliance_Imported
  text: Mitochondrial branched-chain amino acid (BCAA) aminotransferase; preferentially
    involved in BCAA biosynthesis; homolog of murine ECA39; highly expressed during
    logarithmic phase and repressed during stationary phase; BAT1 has a paralog, BAT2,
    that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/BAT1
  source_id: SGD:S000001251
- source: Alliance_Automated
  text: Enables branched-chain-amino-acid:2-oxoglutarate transaminase activity. Involved
    in branched-chain amino acid biosynthetic process and branched-chain amino acid
    catabolic process. Located in mitochondrial matrix. Human ortholog(s) of this
    gene implicated in hypervalinemia and hyperleucine-isoleucinemia. Orthologous
    to human BCAT1 (branched chain amino acid transaminase 1) and BCAT2 (branched
    chain amino acid transaminase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BAT1
  source_id: SGD:S000001251
