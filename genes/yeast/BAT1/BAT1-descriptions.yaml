- source: Alliance_Automated
  text: Enables branched-chain-amino-acid:2-oxoglutarate transaminase activity. Involved
    in branched-chain amino acid biosynthetic process and branched-chain amino acid
    catabolic process. Located in mitochondrial matrix. Human ortholog(s) of this
    gene implicated in hypervalinemia and hyperleucine-isoleucinemia. Orthologous
    to human BCAT1 (branched chain amino acid transaminase 1) and BCAT2 (branched
    chain amino acid transaminase 2).
