id: P38891
gene_symbol: BAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'BAT1 (ECA39/TWT1) encodes the mitochondrial branched-chain amino acid aminotransferase (BCAT,
  EC 2.6.1.42) of Saccharomyces cerevisiae, a PLP-dependent fold-type IV transaminase imported into the
  mitochondrial matrix by an N-terminal presequence. Bat1 catalyses the last step in the synthesis of
  L-leucine, L-isoleucine and L-valine, transaminating the branched-chain 2-keto acids generated by the
  matrix ILV pathway with glutamate. BAT1 and its cytosolic paralog BAT2 arose from the whole-genome duplication
  and have subfunctionalized: BAT1 is highly expressed under biosynthetic conditions and repressed by
  BCAAs, whereas BAT2 carries most of the catabolic (Ehrlich pathway) transamination. bat1 bat2 double
  mutants are auxotrophic for Ile, Leu and Val. Bat1 can also transaminate 2-keto-4-methylthiobutyrate
  in methionine salvage and has been linked to TORC1 signalling and cell-cycle phenotypes, probably via
  metabolic effects. BAT1 was isolated as a high-copy suppressor of an atm1 mutant.'
