  evidence_type: IPI
  original_reference_id: PMID:11805826
  qualifier: enables
  supporting_entities:
  - UniProtKB:P47176
  review:
    summary: High-throughput affinity-purification/MS study recovering the Bat2 paralog with BAT1. Bat1
      and Bat2 are 81% identical BCAT paralogs and eukaryotic BCATs are homodimers, so co-purification
      most plausibly reflects paralog hetero-association of tagged protein in extracts; the two proteins
      are normally in different compartments (matrix vs cytosol). 'protein binding' conveys no functional
      information and no more specific MF term (e.g. a regulatory or scaffold activity) is supported.
      Removal does not mean the interaction is false.
    action: REMOVE
