  - *id006
suggested_questions:
- question: Is the RCA conversion of every YeastPathways BCAT reaction (Leu, Val and the methionine-salvage
    R15-RXN) to GO:0052656 L-isoleucine:2-oxoglutarate transaminase activity a systematic mapping error
    that should be fixed at source?
suggested_experiments:
- hypothesis: Bat1 contributes to BCAA catabolism in the matrix only when cytosolic Bat2 is absent or
    limiting.
  description: Measure 13C-leucine flux to fusel alcohols in wild type, bat1, bat2 and bat2 strains expressing
    presequence-less Bat1, under ammonium vs BCAA nitrogen sources.
