core_functions:
- description: 'Mitochondrial matrix branched-chain amino acid aminotransferase (EC 2.6.1.42, PLP-dependent)
    catalysing the final step of L-leucine, L-isoleucine and L-valine biosynthesis: transamination of
    2-oxoisocaproate, (S)-3-methyl-2-oxopentanoate and 2-oxoisovalerate using L-glutamate as amino donor.
    It is the predominant biosynthetic BCAT isozyme; cytosolic Bat2 provides partial redundancy.'
  molecular_function:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  directly_involved_in:
  - id: GO:0009098
    label: L-leucine biosynthetic process
  - id: GO:0009099
    label: L-valine biosynthetic process
  - id: GO:1901705
    label: L-isoleucine biosynthetic process
