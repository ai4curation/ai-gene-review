suggested_questions:
- question: Alg6 and Alg8 are paralogues that both make α1,3-Glc linkages. Which acceptor features let
    each one discriminate Man9GlcNAc2 from Glc1Man9GlcNAc2-PP-Dol?
suggested_experiments:
- description: Swap the variable modules between Alg6 and Alg8 and test acceptor specificity in vitro,
    to locate the determinants that distinguish the two paralogues.
