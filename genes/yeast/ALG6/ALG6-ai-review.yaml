id: Q12001
gene_symbol: ALG6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Alg6 is a multi-pass ER membrane glucosyltransferase of the GT-C superfamily (ALG6/ALG8
  family). It adds the first of the three glucose residues to the lipid-linked oligosaccharide: it transfers
  glucose from dolichyl-phosphate-glucose onto the A-branch of Man9GlcNAc2-PP-dolichol in α1,3 linkage
  to give Glc1Man9GlcNAc2-PP-dolichol (EC 2.4.1.267). The reaction takes place on the lumenal side of
  the ER membrane. The cryo-EM structure of yeast Alg6 shows a previously undescribed transmembrane fold
  with conserved and variable modules, and a lumen-facing active site in which Asp69 probably acts as
  the catalytic base. ALG6 is not essential. alg6 mutants accumulate Man9GlcNAc2-PP-dolichol and transfer
  non-glucosylated glycans, which the oligosaccharyltransferase uses poorly. This causes hypoglycosylation
  that becomes severe when OST activity is reduced.'
