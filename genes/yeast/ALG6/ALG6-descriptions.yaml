descriptions:
- source: UniProt
  text: Dolichyl pyrophosphate Man9GlcNAc2 alpha-1,3- glucosyltransferase that operates
    in the biosynthetic pathway of dolichol-linked oligosaccharides, the glycan precursors
    employed in protein asparagine (N)-glycosylation. The assembly of dolichol-linked
    oligosaccharides begins on the cytosolic side of the endoplasmic reticulum membrane
    and finishes in its lumen. The sequential addition of sugars to dolichol pyrophosphate
    produces dolichol-linked oligosaccharides containing fourteen sugars, including
    two GlcNAcs, nine mannoses and three glucoses. Once assembled, the oligosaccharide
    is transferred from the lipid to nascent proteins by oligosaccharyltransferases.
    In the lumen of the endoplasmic reticulum, adds the first glucose residue from
    dolichyl phosphate glucose (Dol-P- Glc) onto the lipid-linked oligosaccharide
    intermediate Man(9)GlcNAc(2)-PP-Dol to produce Glc(1)Man(9)GlcNAc(2)-PP-Dol.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12001
  source_id: Q12001
- source: Alliance_Imported
  text: ER-luminal alpha 1,3 glucosyltransferase; involved in transfer of oligosaccharides
    from dolichyl pyrophosphate to asparagine residues of proteins during N-linked
    protein glycosylation; C998T transition in human ortholog ALG6 causes carbohydrate-deficient
    glycoprotein syndrome type-Ic; wild-type human ortholog ALG6 can partially complement
    yeast alg6 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALG6
  source_id: SGD:S000005528
- source: Alliance_Automated
  text: Enables dolichyl pyrophosphate Man9GlcNAc2 alpha-1,3-glucosyltransferase activity.
    Involved in aerobic respiration and dolichol-linked oligosaccharide biosynthetic
    process. Located in endoplasmic reticulum membrane. Used to study congenital disorder
    of glycosylation type I. Human ortholog(s) of this gene implicated in congenital
    disorder of glycosylation Ic. Orthologous to human ALG6 (ALG6 alpha-1,3-glucosyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALG6
  source_id: SGD:S000005528
