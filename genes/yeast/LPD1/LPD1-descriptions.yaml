descriptions:
- source: UniProt
  text: Lipoamide dehydrogenase is a component of the alpha-ketoacid dehydrogenase
    complexes. This includes the pyruvate dehydrogenase complex, which catalyzes the
    overall conversion of pyruvate to acetyl- CoA and CO(2), and the 2-oxoglutarate
    dehydrogenase complex, which catalyzes the overall conversion of 2-oxoglutarate
    to succinyl-CoA and CO(2) (PubMed:2821168). Also acts as a component of the glycine
    cleavage system (glycine decarboxylase complex), which catalyzes the degradation
    of glycine (PubMed:7498764).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P09624
  source_id: P09624
- source: Alliance_Imported
  text: Dihydrolipoamide dehydrogenase; the lipoamide dehydrogenase component (E3)
    of the pyruvate dehydrogenase and 2-oxoglutarate dehydrogenase multi-enzyme complexes;
    PDH complex is concentrated in spots within the mitochondrial matrix, often near
    the ERMES complex and near peroxisomes; LPD1 has a paralog, IRC15, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/LPD1
  source_id: SGD:S000001876
- source: Alliance_Automated
  text: Enables dihydrolipoyl dehydrogenase (NADH) activity; glycine dehydrogenase
    (decarboxylating) activity; and oxoglutarate dehydrogenase (succinyl-transferring)
    activity. Involved in several processes, including L-serine biosynthetic process;
    branched-chain amino acid catabolic process; and glycine catabolic process. Located
    in mitochondrial nucleoid. Part of glycine cleavage complex; oxoglutarate dehydrogenase
    complex; and pyruvate dehydrogenase complex. Used to study disease of metabolism.
    Human ortholog(s) of this gene implicated in dihydrolipoamide dehydrogenase deficiency.
    Orthologous to human DLD (dihydrolipoamide dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LPD1
  source_id: SGD:S000001876
