suggested_questions:
- question: Which E1/E2 proteins, if any, form the Lpd1-dependent branched-chain 2-oxoacid dehydrogenase activity
    reported in S. cerevisiae, given the absence of clear BCKDH E1/E2 orthologues?
suggested_experiments:
- description: Measure branched-chain 2-oxoacid dehydrogenase activity in kgd1, kgd2, pda1 and lat1 single and double
    deletions to identify which E1/E2 components pair with Lpd1.
