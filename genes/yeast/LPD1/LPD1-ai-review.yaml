id: P09624
gene_symbol: LPD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Dihydrolipoyl dehydrogenase (lipoamide dehydrogenase, E3; EC 1.8.1.4) of Saccharomyces cerevisiae,
  the single FAD-containing homodimeric E3 shared by all mitochondrial lipoate-dependent complexes. Lpd1 reoxidises
  the dihydrolipoyl arms of the pyruvate dehydrogenase (Lat1), 2-oxoglutarate dehydrogenase (Kgd2) and glycine cleavage
  (Gcv3, as L-protein) systems, transferring electrons to NAD+. In KGDH it is recruited to the Kgd1-Kgd2 core by
  Kgd4; a substantial pool is free in the matrix. lpd1 mutants lack PDH, KGDH and glycine cleavage activities, cannot
  grow on glycerol or acetate or on glycine as nitrogen source, and fail to sporulate. LPD1 is glucose-repressed.
  Lpd1-containing complexes are also a source of mitochondrial H2O2.
