  review:
    summary: Sinclair & Dawes show lpd1 mutants lack overall GDC activity. Lpd1 is the L-protein, however; the glycine
      dehydrogenase (decarboxylating) reaction (EC 1.4.4.2) is catalysed by the P-protein Gcv2. Loss of the whole-complex
      activity reflects Lpd1's own dihydrolipoyl dehydrogenase step within GCS, not glycine decarboxylation by Lpd1.
    action: MODIFY
    reason: The activity belongs to Gcv2; Lpd1 enables the E3 step of the complex. At most this could be contributes_to.
