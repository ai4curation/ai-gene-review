suggested_questions:
- question: Is the TenA-like C-terminal domain of Thi21 an active thiaminase II, like that of Thi20, or
    has it diverged?
suggested_experiments:
- description: Assay purified Thi21 (and Thi22) for thiaminase II activity side-by-side with Thi20, and
    test HMP vs HMP-P kinase kinetics to explain the efficiency difference.
