- term:
    id: GO:0050334
    label: thiaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR027574
  review:
    summary: InterPro IPR027574 (thiaminase II) domain mapping. Thi21 has the C-terminal TenA-like domain,
      and its paralog Thi20 has demonstrated thiaminase II activity, but only Thi20 was tested and the
      C-terminal domain is not required for HMP-P kinase activity. Whether Thi21's TenA domain is catalytically
      active is unknown, so the electronic annotation can be neither confirmed nor refuted.
    action: UNDECIDED
    supported_by:
    - reference_id: file:yeast/THI21/THI21-uniprot.txt
      supporting_text: '-!- SIMILARITY: In the C-terminal section; belongs to the thiaminase-2'
    - reference_id: PMID:10383756
      supporting_text: The function of the carboxy-terminal part of the proteins is not yet understood,
        but it is not required for HMP-P kinase activity.
    - reference_id: PMID:15967475
      supporting_text: Incubation of Thi20 with thiamin reveals that it has thiaminase II activity, in
        addition, incubation of Thi20 with HMP (4-amino-2-methyl-5-hydroxymethylpyrimidine) and ATP reveals
        that it has HMP kinase and HMP-P (4-amino-2-methyl-5-hydroxymethylpyrimidine phosphate) kinase
        activity.
core_functions:
- description: 'HMP-P kinase (redundant with Thi20): phosphorylates HMP-P to HMP-PP for thiamine monophosphate
    synthesis by Thi6.'
