id: Q08975
gene_symbol: THI21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: THI21 (YPL258C) encodes a hydroxymethylpyrimidine (HMP)/HMP-phosphate kinase of Saccharomyces
  cerevisiae, a paralog of THI20 within the THI20/THI21/THI22 ThiD-TenA fusion family. Its N-terminal
  ThiD-like domain phosphorylates HMP-P to HMP-PP (EC 2.7.4.7), the activated pyrimidine used by Thi6
  to form thiamine monophosphate, and can also convert HMP to HMP-P, though far less efficiently than
  Thi20. Thi20 and Thi21 are isofunctional and redundant for thiamine biosynthesis; THI21 is induced by
  thiamine starvation. Thi21 carries a C-terminal TenA (thiaminase II)-like domain that is dispensable
  for HMP-P kinase activity; unlike Thi20, its thiaminase activity has not been tested.
