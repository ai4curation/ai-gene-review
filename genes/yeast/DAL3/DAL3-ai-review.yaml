description: Ureidoglycolate lyase (Dal3p, YIR032C; historically called ureidoglycolate hydrolase or ureidoglycolatase),
  a small cupin-fold enzyme of the ureidoglycolate lyase family that cleaves (S)-ureidoglycolate to urea
  and glyoxylate (EC 4.3.2.3), the third step of allantoin degradation in S. cerevisiae. The urea released
  by Dal2 and Dal3 is degraded by urea amidolyase (Dur1,2). DAL3 is in the DAL cluster on chromosome IX,
  is subject to nitrogen catabolite repression and is expressed independently of the allophanate inducer.
  Its C-terminus ends in a CAAX-like motif (Cys-Ile-Ile-Ile), but farnesylation or membrane association
  of Dal3 has not been demonstrated.
