- source: Alliance_Imported
  text: Ureidoglycolate lyase; converts ureidoglycolate to glyoxylate and urea in
    the third step of allantoin degradation; expression is sensitive to nitrogen catabolite
    repression; this enzyme is sometimes referred to 'ureidoglycolate hydrolase' but
    should not be confused with the Arabidopsis thaliana ureidoglycolate hydrolase
    enzyme which converts ureidoglycolate to glyoxylate, ammonia and carbon dioxide
