gene_symbol: DAL3
organism: yeast
uniprot_id: P32459
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the catabolism of the allantoin degradation intermediate (S)-ureidoglycolate,
    generating urea and glyoxylate. Involved in the utilization of allantoin as secondary
    nitrogen source when primary sources are limiting.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32459
  source_id: P32459
- source: Alliance_Imported
  text: Ureidoglycolate lyase; converts ureidoglycolate to glyoxylate and urea in
    the third step of allantoin degradation; expression is sensitive to nitrogen catabolite
    repression; this enzyme is sometimes referred to 'ureidoglycolate hydrolase' but
    should not be confused with the Arabidopsis thaliana ureidoglycolate hydrolase
    enzyme which converts ureidoglycolate to glyoxylate, ammonia and carbon dioxide
  source_type: curated
  url: https://www.yeastgenome.org/locus/DAL3
  source_id: SGD:S000001471
- source: Alliance_Automated
  text: Enables ureidoglycolate lyase activity. Predicted to be involved in allantoin
    catabolic process. Predicted to be located in membrane. Predicted to be active
    in cytosol.
  source_type: automated
  url: https://www.yeastgenome.org/locus/DAL3
  source_id: SGD:S000001471
