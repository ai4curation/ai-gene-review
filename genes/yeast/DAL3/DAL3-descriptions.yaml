descriptions:
- source: UniProt
  text: Catalyzes the catabolism of the allantoin degradation intermediate (S)-ureidoglycolate,
    generating urea and glyoxylate. Involved in the utilization of allantoin as secondary
    nitrogen source when primary sources are limiting.
