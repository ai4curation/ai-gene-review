id: P12684
gene_symbol: HMG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'HMG2 (YLR450W) encodes 3-hydroxy-3-methylglutaryl-coenzyme A reductase isozyme 2 (EC 1.1.1.34),
  which catalyses the NADPH-dependent reduction of (S)-HMG-CoA to (R)-mevalonate, the rate-limiting step
  of the mevalonate pathway feeding ergosterol and other isoprenoids. Like its paralog Hmg1, Hmg2 is a
  polytopic ER and nuclear-envelope membrane protein with an N-terminal sterol-sensing-domain membrane
  region and a cytosolic catalytic domain; the two isozymes are redundant for viability, with Hmg2 contributing
  the minor share of activity under standard aerobic conditions. Hmg2 is distinguished by feedback-regulated
  ER-associated degradation: its membrane domain responds to sterol-pathway signals, it is ubiquitinated
  and extracted from the ER membrane by the proteasome, and the INSIG homolog Nsg1 binds the sterol-sensing
  region and limits its degradation. At elevated levels Hmg2 concentrates in the peripheral ER and induces
  distinct ER membrane proliferations.'
