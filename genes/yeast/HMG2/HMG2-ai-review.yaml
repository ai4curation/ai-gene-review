  review:
    summary: IPI part_of proteasome complex from Smith et al. 2016. Hmg2p was used as a model polytopic
      ERAD substrate and, like Pca1p, was found in a complex with the proteasome at the ER membrane while
      being extracted and degraded. Being a proteasome substrate does not make Hmg2 a component of the
      proteasome complex; part_of asserts subunit membership.
    action: REMOVE
    reason: The cited abstract itself describes Hmg2p as an ERAD substrate, not a proteasome subunit;
      substrate association mis-captured as complex membership.
    supported_by:
    - reference_id: PMID:27226596
      supporting_text: Two other polytopic membrane proteins undergoing ERAD, Ste6*p and Hmg2p, also displayed
        the same outcomes observed for Pca1p.
    - reference_id: PMID:27226596
      supporting_text: Pca1p formed a complex with the proteasome at the membrane in a Doa10p E3 ligase-dependent
        manner.
