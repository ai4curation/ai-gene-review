        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Peroxisomal HMGCR is a contested mammalian finding; yeast Hmg1/Hmg2 are ER and nuclear-envelope
          proteins.
    supported_by:
