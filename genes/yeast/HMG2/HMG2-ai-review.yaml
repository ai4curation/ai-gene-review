  review:
    summary: 'IBA (is_active_in peroxisomal membrane) from node PTN000060347 supported only by human HMGCR
      (P04035), whose peroxisomal localisation is itself debated. No yeast study detects HMG2 in peroxisomes:
      it is an ER/nuclear-envelope polytopic membrane protein in targeted (Koning et al.) and genome-wide
      GFP studies, and S. cerevisiae ergosterol synthesis does not involve a peroxisomal HMGR pool.'
    action: REMOVE
    reason: Compartment over-propagated from a single disputed mammalian source; contradicted by yeast
      localisation data.
    propagation_review:
      root_cause: PROPAGATION_BAD
