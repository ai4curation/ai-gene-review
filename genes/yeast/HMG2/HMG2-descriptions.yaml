- source: Alliance_Imported
  text: HMG-CoA reductase; converts HMG-CoA to mevalonate, a rate-limiting step in
    sterol biosynthesis; one of two isozymes; overproduction induces assembly of peripheral
    ER membrane arrays and short nuclear-associated membrane stacks; forms foci at
    nuclear periphery upon DNA replication stress; primarily expressed on the peri-membrane
    side of the ER; human homolog HMGCR can complement yeast hmg2 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/HMG2
  source_id: SGD:S000004442
