findings:
- category: discrepancy
  text: The automated text places Hmg2 in the proteasome complex; the review removes
    that annotation because Hmg2 is an ERAD substrate.
  sources:
  - Alliance_Automated
- category: gap
  text: Neither UniProt nor SGD mentions the sterol-regulated ER-associated degradation
    of Hmg2 and its control by Nsg1, which the review treats as its distinguishing
    biology.
  sources:
  - UniProt
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: Agreement on HMG-CoA reductase activity. None of the sources describes
    the regulated degradation that sets Hmg2 apart, and the automated text calls it
    a proteasome subunit.
