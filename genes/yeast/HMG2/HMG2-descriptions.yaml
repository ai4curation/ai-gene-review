- source: Alliance_Automated
  text: Enables hydroxymethylglutaryl-CoA reductase (NADPH) activity. Predicted to
    be involved in ergosterol biosynthetic process and isoprenoid biosynthetic process.
    Located in endoplasmic reticulum membrane and nuclear envelope. Part of proteasome
    complex. Is active in endoplasmic reticulum. Human ortholog(s) of this gene implicated
    in several diseases, including attention deficit hyperactivity disorder; coronary
    artery disease (multiple); diabetes mellitus (multiple); muscular disease (multiple);
    and neurodegenerative disease (multiple). Orthologous to human HMGCR (3-hydroxy-3-methylglutaryl-CoA
    reductase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HMG2
