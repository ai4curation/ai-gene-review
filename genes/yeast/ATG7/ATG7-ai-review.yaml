    summary: The cited paper shows Atg12p-dependent membrane association of Apg7p-GFP without identifying the compartment; the extrinsic-component term encodes protein topology rather than a location.
    action: MODIFY
    reason: 'Two problems, neither of which impugns the curator''s underlying observation. First, the term: GO:0097632 asserts protein topology, which GO has already ruled is not a cellular component - its siblings GO:0097633 and GO:0097634 and its autophagosome counterpart GO:0097635 were obsoleted on exactly that ground, and GO:0097632 was missed (GO issue #23424, and #29437 R4). It is also defined as part_of GO:0034045, which asserts a bounding membrane the phagophore assembly site does not have (PMID:32025038). Second, the evidence: the cached record is abstract-only, and the abstract supports Apg12p-dependent membrane association and starvation-dependent pelleting without naming a compartment, so the specific claim of PAS-membrane topology is not something this reviewer can verify. Prior review cited the paper''s title as its supporting text and justified the location by ATG7''s E1-like enzymatic function, which is not localization evidence. Generalize to the compartment, which this gene already carries independently as an IDA from PMID:18497569.'
    proposed_replacement_terms:
    - id: GO:0000407
      label: phagophore assembly site
    supported_by:
    - reference_id: PMID:10233148
      supporting_text: a subpopulation of Apg7pGFP becomes membrane associated in an Apg12p-dependent manner
  qualifier: located_in
