- id: file:yeast/ATG7/ATG7-deep-research-falcon.md
  title: Falcon deep research report for ATG7
  findings:
  - statement: Falcon supports ATG7 as the E1-like activating enzyme for both Atg12 and Atg8 ubiquitin-like conjugation systems in yeast autophagy.
    supporting_text: Atg7 is the E1 enzyme for the autophagy conjugation machinery. It activates Atg12 and also functions as the E1 for Atg8 in the Atg8-PE lipidation pathway.
