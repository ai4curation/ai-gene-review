- id: PMID:42141163
  title: Atg7-Atg12 conjugation and autophagy are negatively regulated by the disordered region of Atg12.
  findings:
  - statement: A 2026 yeast biochemical study showed that the Atg8 and Atg12 N-terminal regions help tune selective transfer through Atg7, refining but not changing the core Atg7 E1-like mechanism.
