- term:
    id: GO:0006501
    label: C-terminal protein lipidation
  evidence_type: IDA
  original_reference_id: PMID:19398890
  review:
    summary: The generic C-terminal protein lipidation term is correct in essence for ATG7, which catalyzes the E1 step of Atg8-phosphatidylethanolamine conjugation, but is less specific than available GO terms.
    action: MODIFY
    supported_by:
    - reference_id: PMID:19398890
      supporting_text: Mutation at the cargo-receptor binding site of Atg8 also affects its general autophagy regulation function.
    reason: 'ATG7 is the E1-like enzyme that activates Atg8 and transfers it to the E2 Atg3, which completes conjugation of the Atg8 C-terminal glycine to phosphatidylethanolamine; ATG7 therefore performs an obligate catalytic step of Atg8 lipidation, and the lipidation process term is appropriate. The MODIFY is a specialization, not a correction: GO:0061739 protein lipidation involved in autophagosome assembly is a child of the annotated GO:0006501 and names the specific Atg8-PE lipidation that ATG7 drives (the originally proposed id, GO:0061683, was an erroneous id for an unrelated, now-obsolete term). GO:0061739 is scoped to autophagosome assembly, whereas Atg8-PE conjugation in yeast also serves the Cvt pathway; GO has no Cvt-specific lipidation term, and ATG7''s Cvt role is captured separately by its ACCEPTed cytoplasm to vacuole targeting by the Cvt pathway (GO:0032258) annotations, so the narrower term is still the best available specialization.'
    proposed_replacement_terms:
    - id: GO:0061739
      label: protein lipidation involved in autophagosome assembly
  qualifier: involved_in
