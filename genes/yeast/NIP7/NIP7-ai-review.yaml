id: Q08962
gene_symbol: NIP7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Nip7 is an essential, conserved, non-ribosomal assembly factor of the 60S ribosomal subunit in
  budding yeast. The 181-residue protein has an N-terminal Nip7-specific domain and a C-terminal
  PUA RNA-binding domain, and it binds RNA in vitro, preferring polyuridine. Nip7 is concentrated
  in the nucleolus, where it is a component of early large-subunit precursor particles (66S
  pre-ribosomes). It associates with free 60S precursors but not with mature 80S ribosomes or
  polysomes. Nip7 forms a subcomplex with the rRNA methyltransferase Nop2; the two proteins depend
  on each other to enter pre-60S particles and together are needed to recruit or stabilise a set
  of later assembly factors (Rpf2, Tif6, Rlp24, Nog1, Nsa2 and Nog2). Loss of Nip7 delays
  processing of 27S pre-rRNA, reduces 25S rRNA and free 60S subunits, and produces halfmer
  polysomes. Nip7 also interacts with the nucleolar protein Nop8 and with the exosome subunit
  Rrp43.
existing_annotations:
- term:
    id: GO:0000463
    label: maturation of LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S
      rRNA, LSU-rRNA)
  evidence_type: IMP
  original_reference_id: PMID:9271378
  qualifier: involved_in
  review:
    summary: The nip7-1 depletion phenotype includes accumulation of 27S pre-rRNA and reduced 25S
      rRNA synthesis, a defect in maturation of LSU rRNA from the 35S tricistronic precursor.
    action: ACCEPT
    reason: Direct yeast mutant evidence. The later B-factor study (PMID:22735702) places Nip7 in the
      group of factors needed for 27SB pre-rRNA processing at site C2 and shows that Nip7, with Nop2,
      is needed to recruit the other B-factors into the particle, so Nip7 contributes structurally to
      the processing step rather than being only a substrate or downstream readout. This term was
      not propagated by PAINT at the eukaryote node; it is a yeast-specific, experimentally grounded
      claim and should not be transferred to SF34 homologs (human NIP7) without their own evidence.
    supported_by:
    - reference_id: PMID:9271378
      supporting_text: Delayed processing of 27S pre-rRNA appeared to be the cause of reduced synthesis
        of 25S rRNA relative to 18S rRNA, which may be responsible for the deficit of 60S subunits in
        these cells.
    - reference_id: PMID:22735702
      supporting_text: Previously, Nop2 and Nip7 were found to be necessary for processing of 27SB
        pre-rRNA
