core_functions:
- description: Nucleolar, non-catalytic assembly factor of early large-subunit precursor particles.
    Nip7 binds RNA through its PUA domain and, in a subcomplex with Nop2, is needed to recruit or
    stabilise later assembly factors in pre-60S particles, which allows 27SB pre-rRNA processing and
    60S subunit production. Established experimentally in S. cerevisiae.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  directly_involved_in:
  - id: GO:1902626
    label: assembly of large subunit precursor of preribosome
  - id: GO:0000463
    label: maturation of LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
  locations:
  - id: GO:0005730
    label: nucleolus
  in_complex:
    id: GO:0030687
    label: preribosome, large subunit precursor
  supported_by:
  - reference_id: PMID:18001138
    supporting_text: This work provides experimental verification that the PUA domain mediates Nip7
      interaction with RNA and reveals that the preference for interaction with polyuridine sequences
      is conserved in Archaea and eukaryotic Nip7 proteins.
  - reference_id: PMID:22735702
    supporting_text: We conclude that Nop2 and Nip7 form a subcomplex and that both are important for
      association of at least six other B-factors, as well as each other, with nascent ribosomes
  - reference_id: PMID:9271378
    supporting_text: A fraction of Nip7p cosedimented through sucrose gradients with free 60S ribosomal
      subunits but not with 80S monosomes or polysomal ribosomes, indicating that it is not a ribosomal
      protein.
suggested_questions:
- question: Which pre-rRNA segment does the Nip7 PUA domain bind within early pre-60S particles, and
    is the in vitro preference for polyuridine relevant to that site?
- question: Is the functional relationship between Nip7 and the exosome subunit Rrp43 a direct
    contribution to pre-rRNA processing, or does it reflect a separate role?
- question: Do NIP7 proteins in other PANTHER subfamilies (for example human NIP7, SF34) retain the
    Nop2-partnered recruitment role, given that their depletion phenotypes are reported to differ?
suggested_experiments:
- description: CRAC or UV cross-linking of Nip7 in vivo to map its pre-rRNA binding site, combined
    with the PUA IVAF161-164AVAA mutant to test whether RNA binding is needed for Nop2 recruitment
    and 27SB processing.
  experiment_type: RNA-protein cross-linking and complementation
