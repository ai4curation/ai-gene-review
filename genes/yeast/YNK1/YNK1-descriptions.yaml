gene_symbol: YNK1
organism: yeast
uniprot_id: P36010
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Major role in the synthesis of nucleoside triphosphates other than ATP. The
    ATP gamma phosphate is transferred to the NDP beta phosphate via a ping-pong mechanism,
    using a phosphorylated active-site intermediate (PubMed:5793714). Required for
    repair of UV radiation- and etoposide-induced DNA damage (PubMed:18983998).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36010
  source_id: P36010
- source: Alliance_Imported
  text: Nucleoside diphosphate kinase; catalyzes the transfer of gamma phosphates
    from nucleoside triphosphates, usually ATP, to nucleoside diphosphates by a mechanism
    that involves formation of an autophosphorylated enzyme intermediate; protein
    abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/YNK1
  source_id: SGD:S000001550
- source: Alliance_Automated
  text: Enables nucleoside diphosphate kinase activity. Involved in DNA damage response
    and nucleoside triphosphate biosynthetic process. Located in cytosol and mitochondrial
    intermembrane space. Human ortholog(s) of this gene implicated in neuroblastoma;
    ovary epithelial cancer; and teratoma. Orthologous to several human genes including
    NME2 (NME/NM23 nucleoside diphosphate kinase 2) and NME1-NME2 (NME1-NME2 readthrough).
  source_type: automated
  url: https://www.yeastgenome.org/locus/YNK1
  source_id: SGD:S000001550
