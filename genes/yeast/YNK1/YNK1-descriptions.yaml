descriptions:
- source: UniProt
  text: Major role in the synthesis of nucleoside triphosphates other than ATP. The
    ATP gamma phosphate is transferred to the NDP beta phosphate via a ping-pong mechanism,
    using a phosphorylated active-site intermediate (PubMed:5793714). Required for
    repair of UV radiation- and etoposide-induced DNA damage (PubMed:18983998).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36010
