id: P36010
gene_symbol: YNK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: YNK1 encodes the single nucleoside diphosphate kinase (NDPK, EC 2.7.4.6) of Saccharomyces
  cerevisiae, the yeast homologue of human NME1/NM23. The homo-oligomeric enzyme transfers the gamma-phosphate
  of a nucleoside triphosphate (normally ATP) to any ribo- or deoxyribonucleoside diphosphate via a ping-pong
  mechanism with a phosphohistidine intermediate, producing the UTP, CTP, GTP and dNTPs needed for RNA
  and DNA synthesis; it has broad specificity, with dTDP, CDP and UDP among the best acceptors in vitro.
  Ynk1 is predominantly cytosolic, with a small fraction imported into the mitochondrial intermembrane
  space, where it has been proposed to supply GTP to IMS proteins. YNK1 is not essential, consistent with
  redundant NDP-phosphorylating activities in yeast, but ynk1 mutants show delayed repair of UV- and etoposide-induced
  nuclear DNA damage and an elevated mutation rate.
