id: P47165
gene_symbol: XPT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'XPT1 (YJR133W) encodes xanthine phosphoribosyltransferase (XPRT), a low-abundance cytoplasmic type
  I phosphoribosyltransferase of the hypoxanthine phosphoribosyltransferase family that is paralogous to Hpt1. Xpt1
  is responsible for salvaging xanthine to XMP: xpt1 disruption impairs xanthine utilisation in vivo and severely
  reduces XPRT activity in extracts while leaving HPRT activity unchanged. XPT1 was isolated as a multicopy suppressor
  of an hpt1 (HGPRT) defect, showing that at elevated dosage Xpt1 can also act on hypoxanthine, and it contributes
  with Hpt1 to inosine/hypoxanthine recycling into adenine nucleotides. The XMP formed feeds GMP synthesis via Gua1.
  Direct biochemical characterisation of purified Xpt1 has not been reported, so its substrate range rests on genetic
  and extract data.'
