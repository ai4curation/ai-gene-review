suggested_questions:
- question: What are the kinetic parameters of purified Xpt1 for xanthine, hypoxanthine and guanine, and does its
    activity explain the residual HPRT-like function seen in hpt1 mutants?
suggested_experiments:
- description: Purify recombinant Xpt1 and determine kcat/Km for xanthine, hypoxanthine and guanine with PRPP; complement
    with xanthine-utilisation growth assays in gua1/imd-blocked backgrounds.
