description: CPS1 encodes carboxypeptidase S (yscS), a vacuolar zinc-dependent M20A
  metallocarboxypeptidase. Cps1 is synthesized as a type II membrane precursor; precursor
  forms are membrane-associated, while mature active enzyme is soluble in the vacuolar
  lumen. The enzyme releases C-terminal amino acids from peptides such as Z-Gly-Leu,
  supporting vacuolar protein breakdown, nitrogen use, and amino-acid recycling.
