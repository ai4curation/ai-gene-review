id: P22217
gene_symbol: TRX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TRX1 (YLR043C) encodes thioredoxin-1, one of the two cytoplasmic thioredoxins of S. cerevisiae
  (with the paralogue TRX2, 78% identical in amino-acid sequence; TRX3 is mitochondrial). It is a small
  CGPC-active-site disulfide oxidoreductase kept reduced by NADPH-thioredoxin reductase Trr1. Reduced
  Trx1 donates electrons to thioredoxin-dependent enzymes, including PAPS reductase (Met16) in sulfate
  assimilation, ribonucleotide reductase and thiol peroxidases (Tsa1, Tsa2, Ahp1, Dot5), reduces protein
  disulfides and glutathione disulfide, and deglutathionylates proteins, maintaining cytosolic and nuclear
  redox homeostasis. trx1 trx2 double mutants are methionine auxotrophs with a prolonged S phase, and
  loss of both thioredoxins and both dithiol glutaredoxins is lethal. Independently of its redox activity,
  most cellular Trx1 is in LMA1, a heterodimer with the proteinase B inhibitor Pbi2, which cooperates
  with Sec18/NSF in SNARE priming for homotypic vacuole fusion (vacuole inheritance) and ER-Golgi vesicle
  fusion. Trx1 is located in the cytosol and nucleus, with a minor pool in the mitochondrial intermembrane
  space.
