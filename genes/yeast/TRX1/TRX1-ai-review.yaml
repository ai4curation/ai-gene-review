suggested_questions:
- question: Is the Golgi-membrane localization recorded in UniProt for Trx1 supported by any direct observation,
    given that the cited IMS proteome paper contains no Golgi data?
- question: What does the IMS pool of Trx1 reduce, and does it cooperate with the Mia40/Erv1 disulfide
    relay?
- question: Why is GO sulfate assimilation annotated (IGI) to TRX2 but not TRX1, when the methionine auxotrophy
    is a property of the trx1 trx2 double mutant and both thioredoxins reduce PAPS reductase?
suggested_experiments:
- description: Compare purified Trx1 and Trx2 as PAPS reductase (Met16) and peroxiredoxin electron donors
    (kcat/Km), and test which isoform predominates in LMA1 in vivo by tagged-subunit pull-down.
