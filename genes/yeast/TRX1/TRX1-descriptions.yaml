- source: Alliance_Imported
  text: Cytoplasmic thioredoxin isoenzyme; part of the thioredoxin system that protects
    cells from oxidative and reductive stress; subunit of the LMA1 complex, with Pbi2p,
    that promotes vacuole inheritance; cofactor for Tsa1p; required for ER-Golgi transport;
    facilitates mitochondrial import of small Tims (Tim9p, Tim10p, Tim13p) by maintaining
    them in reduced form along with Trx2p; component of a signal transduction redox
    relay in a light sensing pathway; abundance increases under DNA replication stress
  source_type: curated
