descriptions:
- source: UniProt
  text: Participates as a hydrogen donor in redox reactions through the reversible
    oxidation of its active center dithiol to a disulfide, accompanied by the transfer
    of 2 electrons and 2 protons. It is involved in many cellular processes, including
    deoxyribonucleotide synthesis, repair of oxidatively damaged proteins, protein
    folding, sulfur metabolism, and redox homeostasis. Thioredoxin-dependent enzymes
    include phosphoadenosine-phosphosulfate reductase MET16, alkyl- hydroperoxide
    reductase DOT5, thioredoxin peroxidases TSA1 and TSA2, alkyl hydroperoxide reductase
    AHP1, and peroxiredoxin HYR1. Thioredoxin is also involved in protection against
    reducing stress. As part of the LMA1 complex, it is involved in the facilitation
    of vesicle fusion such as homotypic vacuole and ER-derived COPII vesicle fusion
    with the Golgi. This activity does not require the redox mechanism.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P22217
  source_id: P22217
- source: Alliance_Imported
  text: Cytoplasmic thioredoxin isoenzyme; part of the thioredoxin system that protects
    cells from oxidative and reductive stress; subunit of the LMA1 complex, with Pbi2p,
    that promotes vacuole inheritance; cofactor for Tsa1p; required for ER-Golgi transport;
    facilitates mitochondrial import of small Tims (Tim9p, Tim10p, Tim13p) by maintaining
    them in reduced form along with Trx2p; component of a signal transduction redox
    relay in a light sensing pathway; abundance increases under DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/TRX1
  source_id: SGD:S000004033
- source: Alliance_Automated
  text: Enables disulfide oxidoreductase activity. Involved in several processes,
    including Golgi vesicle transport; cell redox homeostasis; and vacuole organization.
    Located in several cellular components, including Golgi membrane; cytosol; and
    mitochondrial intermembrane space. Orthologous to human TXN (thioredoxin).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TRX1
