- question: Is the Sct1 versus Gpt2 split in channelling acyl chains to TAG and PC explained by acyl-CoA
    selectivity alone, or by distinct ER subdomains and partner enzymes?
- question: Is the DHAP acyltransferase activity of Sct1 physiologically significant, given its preference
    for glycerol 3-phosphate?
suggested_experiments:
- description: Express chimeric Sct1/Gpt2 proteins swapping acyl-CoA binding regions and measure C16:0
    versus C18:1 incorporation into LPA, TAG and PC in a gat1 sct1 background rescued by each chimera.
  experiment_type: biochemistry/genetics
  hypothesis: Acyl-CoA selectivity determinants explain why Sct1 is the main supplier of saturated DAG
    for TAG and Kennedy-pathway PC.
