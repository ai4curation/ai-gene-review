product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SCT1 (also called GAT2) encodes one of the two redundant glycerol-3-phosphate O-acyltransferases
  (GPATs) of budding yeast. These are dual-substrate sn-1 acyltransferases that transfer an acyl chain
  from acyl-CoA to sn-glycerol 3-phosphate (making lysophosphatidic acid) or to dihydroxyacetone phosphate,
  catalysing the first and committed step of de novo glycerophospholipid and triacylglycerol synthesis.
  Sct1 prefers glycerol 3-phosphate over DHAP and has a marked preference for 16-carbon acyl-CoAs. By
  drawing C16:0-CoA into glycerolipids it competes with the desaturase Ole1 and so influences fatty-acid
  saturation. Metabolic labelling identifies Sct1 as the main supplier of diacylglycerol for TAG and for
  phosphatidylcholine made by the CDP-choline (Kennedy) route. Sct1 is a multi-pass membrane protein of
  the perinuclear and cortical ER and is a phosphoprotein. SCT1 is synthetically lethal with GPT2/GAT1.
  It was first identified as a suppressor of a choline transport defect.
