descriptions:
- source: UniProt
  text: Dual substrate-specific glycerol-3-phosphate/dihydroxyacetone phosphate sn-1
    acyltransferase, catalyzing the first and committed reaction in the de novo synthesis
    of glycerophospholipids and triacylglycerols (TAGs). Prefers Gly-3-P over dihydroxyacetone
    phosphate and has a marked preference for 16-carbon fatty acyl chains. Transfers
    a fatty acid from fatty acyl-CoA to the sn-1 position of glycerol-3-phosphate
    to produce lysophosphatidic acid (LysoPA). These lipids not only are precursors
    of glycerolipids, but also are dynamic components of signal transduction systems
    that control cell physiology (PubMed:11544256). SCT1 is the primary supplier of
    diacylglycerols (DAG), used mainly in TAG synthesis and phosphatidylcholine (PC)
    synthesis through the CDP-choline pathway (PubMed:12167660). Regulates fatty acid
    desaturation, that is, the ratio of unsaturated versus saturated fatty acyl chains,
    by competing with the desaturase OLE1 for the common substrate C16:0-CoA. Sequesters
    C16:0-CoA into lipids, thereby shielding it from desaturation by OLE1 (PubMed:22323296).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32784
