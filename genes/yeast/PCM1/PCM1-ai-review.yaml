  label: Saccharomyces cerevisiae S288C
description: 'PCM1 (AGM1) encodes phosphoacetylglucosamine mutase (EC 5.4.2.3), a Mg2+-dependent member
  of the alpha-D-phosphohexomutase family that interconverts N-acetylglucosamine 6-phosphate and N-acetylglucosamine
  1-phosphate. This is the third step of the cytosolic hexosamine pathway leading to UDP-N-acetylglucosamine,
  the precursor of chitin, N-linked glycans and GPI anchors. PCM1 is essential: deletion mutants arrest
  after about five divisions as strings of undivided cells resembling glucosamine auxotrophs. Pcm1 also
  has weak phosphoglucomutase activity; when overexpressed it can rescue a pgm1 pgm2 mutant on galactose,
  but the phosphoglucomutases cannot substitute for Pcm1. The protein is found in the cytoplasm and nucleus.'
