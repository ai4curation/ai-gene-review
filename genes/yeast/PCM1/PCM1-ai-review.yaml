suggested_questions:
- question: Is the phosphoglucomutase side activity of Pcm1 (GO:0004614 phosphoglucomutase activity, not
    currently in GOA for Pcm1) physiologically relevant at native expression levels, e.g. on galactose,
    or only on overexpression?
suggested_experiments:
- description: Measure kcat/Km of purified Pcm1 for GlcNAc6P versus Glc1P/Glc6P and test, in a pgm1 pgm2
    background, whether regulated PCM1 overexpression or depletion (promoter shut-off) changes Glc1P/Glc6P
    pools and galactose growth.
