descriptions:
- source: UniProt
  text: Catalyzes the conversion of GlcNAc-6-P into GlcNAc-1-P during the synthesis
    of uridine diphosphate/UDP-GlcNAc, which is a biosynthetic precursor of chitin
    and also supplies the amino sugars for N-linked oligosaccharides of glycoproteins
    (PubMed:8174553). Also has phosphoglucomutase activity (PubMed:8119301).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38628
  source_id: P38628
- source: Alliance_Imported
  text: Essential N-acetylglucosamine-phosphate mutase; converts GlcNAc-6-P to GlcNAc-1-P,
    which is a precursor for the biosynthesis of chitin and for the formation of N-glycosylated
    mannoproteins and glycosylphosphatidylinositol anchors
  source_type: curated
  url: https://www.yeastgenome.org/locus/PCM1
  source_id: SGD:S000000784
- source: Alliance_Automated
  text: Enables phosphoacetylglucosamine mutase activity. Involved in chitin biosynthetic
    process. Located in cytoplasm and nucleus. Used to study cancer. Human ortholog(s)
    of this gene implicated in immunodeficiency 23 and teratoma. Orthologous to human
    PGM3 (phosphoglucomutase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PCM1
  source_id: SGD:S000000784
