taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Pyruvate kinase 2 (Pyk2, YOR347C) is the minor pyruvate kinase isoenzyme of Saccharomyces cerevisiae (EC 2.7.1.40),
  a homotetrameric Mg2+/K+-dependent enzyme of the pyruvate kinase family that transfers the phosphoryl group of phosphoenolpyruvate
  to ADP, producing pyruvate and ATP in the last step of glycolysis. Unlike the major isoenzyme Cdc19/Pyk1, Pyk2 is not activated
  by fructose-1,6-bisphosphate, is subject to glucose repression and is expressed at much lower levels; when overexpressed
  it can fully replace Pyk1 activity. It is thought to supply pyruvate kinase activity under conditions of low glycolytic
  flux, such as respiratory or gluconeogenic growth. Pyk2 is a soluble cytosolic protein; a small fraction of glycolytic activity,
  including pyruvate kinase, co-purifies with mitochondria.
