suggested_questions:
- question: Under which physiological conditions (e.g. diauxic shift, growth on ethanol/glycerol) does Pyk2 carry a significant
    fraction of PEP-to-pyruvate flux, and does its FBP insensitivity prevent futile cycling with PEP carboxykinase?
- question: Do Cdc19 and Pyk2 form mixed hetero-tetramers in vivo when co-expressed?
suggested_experiments:
- description: 13C flux analysis in pyk2-deleted versus wild-type cells during growth on ethanol or in glucose-limited chemostats,
    combined with targeted proteomics of Pyk1/Pyk2 levels, to quantify the in vivo contribution of Pyk2.
