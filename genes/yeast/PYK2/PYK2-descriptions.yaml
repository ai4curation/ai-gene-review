descriptions:
- source: UniProt
  text: May be used by cells under conditions in which the level of glycolytic flux
    is very low.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52489
  source_id: P52489
- source: Alliance_Imported
  text: Pyruvate kinase; appears to be modulated by phosphorylation; transcription
    repressed by glucose, and Pyk2p may be active under low glycolytic flux; PYK2
    has a paralog, CDC19, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/PYK2
  source_id: SGD:S000005874
- source: Alliance_Automated
  text: Enables melatonin binding activity and pyruvate kinase activity. Involved
    in glycolytic process. Located in mitochondrion. Human ortholog(s) of this gene
    implicated in Gaucher's disease; hematopoietic system disease (multiple); malaria;
    and type 2 diabetes mellitus. Orthologous to human PKLR (pyruvate kinase L/R)
    and PKM (pyruvate kinase M1/2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PYK2
  source_id: SGD:S000005874
