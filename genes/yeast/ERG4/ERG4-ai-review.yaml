    supporting_text: The yeast ERG4 gene encodes sterol C-24(28) reductase which catalyzes the final step
      in the biosynthesis of ergosterol.
  - reference_id: PMID:10722850
    supporting_text: Deletion of ERG4 resulted in a complete lack of ergosterol and accumulation of the
      precursor ergosta-5,7,22,24(28)-tetraen-3beta-ol.
  - reference_id: PMID:10722850
    supporting_text: Enzyme activity measurements with isolated subcellular fractions revealed that Erg4p
      is localized to the endoplasmic reticulum.
suggested_questions:
- question: Erg4 activity is ER-localised while Erg6 and Erg7 are largely lipid-droplet associated; how
    is the C-24(28)-dehydro intermediate trafficked back to the ER for the final reduction?
suggested_experiments:
- description: Reconstitute purified Erg4 in liposomes and determine kinetics with ergosta-5,7,22,24(28)-tetraenol
    versus earlier 24(28)-methylene sterols (e.g. fecosterol, episterol) to define substrate order preference
    in vivo.
