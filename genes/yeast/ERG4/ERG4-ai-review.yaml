        the precursor ergosta-5,7,22,24(28)-tetraen-3beta-ol.
core_functions:
- description: NADPH-dependent reduction of the C-24(28) double bond of ergosta-5,7,22,24(28)-tetraen-3beta-ol
    to ergosterol (EC 1.3.1.71), the final step of ergosterol biosynthesis, carried out in the ER membrane.
  molecular_function:
    id: GO:0000246
    label: Delta24(24-1) sterol reductase activity
  directly_involved_in:
