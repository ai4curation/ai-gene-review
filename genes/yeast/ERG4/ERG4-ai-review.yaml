id: P25340
gene_symbol: ERG4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ERG4 (YGL012W) encodes sterol C-24(28) reductase (EC 1.3.1.71), the NADPH-dependent enzyme
  that catalyses the final step of ergosterol biosynthesis in Saccharomyces cerevisiae: reduction of the
  C-24(28) methylene double bond of ergosta-5,7,22,24(28)-tetraen-3beta-ol to give ergosterol. Erg4 is
  a polytopic integral membrane protein of the ERG4/ERG24 sterol reductase family (paralogous to the C-14
  reductase Erg24 and related to the lamin B receptor and mammalian DHCR7/TM7SF2 reductases) and resides
  in the endoplasmic reticulum, showing that ergosterol synthesis is completed in the ER. erg4 deletion
  mutants lack ergosterol, accumulate the 24(28)-dehydro precursor, and are viable but hypersensitive
  to divalent cations and a range of drugs, including azoles, cycloheximide, SDS and brefeldin A.'
