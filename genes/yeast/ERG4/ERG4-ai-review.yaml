- term:
    id: GO:0050614
    label: Delta24-sterol reductase activity
  evidence_type: IDA
  original_reference_id: PMID:10722850
  qualifier: enables
  review:
    summary: GO:0050614 'Delta24-sterol reductase activity' is defined by EC 1.3.1.72, reduction of the
      C24=C25 double bond of cholesta-7,24-dienol (the DHCR24 reaction of cholesterol synthesis). Erg4
      instead reduces the exocyclic C-24(28) methylene double bond (EC 1.3.1.71) created by Erg6 methylation,
      as Zweytick et al. show. The experimental activity is sound but the term names a different reaction;
      GO:0000246 is the correct term (already annotated from the same paper as EXP).
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0000246
      label: Delta24(24-1) sterol reductase activity
