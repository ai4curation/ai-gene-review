- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:37968396
  review:
    summary: >-
      A large-scale interactome protein binding annotation is less informative
      than the mechanistic Sqt1-Rpl10 chaperone model.
    action: REMOVE
    reason: >-
      The large-scale interaction recovers the known Sqt1-Rpl10 association, but
      generic protein binding should not be accepted as a molecular function when
      a specific Rpl10 carrier chaperone activity is supported by biochemical
      and structural evidence.
    supported_by:
    - reference_id: PMID:26112308
      supporting_text: >-
        Co-translational capturing of nascent ribosomal proteins by dedicated
        chaperones constitutes an elegant mechanism to prevent unspecific
        interactions and aggregation of ribosomal proteins on their road to
        incorporation.
