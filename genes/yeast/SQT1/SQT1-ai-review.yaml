- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IMP
  original_reference_id: PMID:37086725
  review:
    summary: >-
      Sqt1-dependent release of oxidized Rpl10 from mature ribosomes supports
      ribosome repair during oxidative stress.
    action: NEW
    reason: >-
      Yang et al. directly connected Sqt1 to the cellular oxidative-stress
      response: purified Sqt1 released oxidized Rpl10 from mature 60S subunits,
      Sqt1 was recruited to ribosomes in hydrogen peroxide-treated yeast, and an
      Sqt1 interface mutant that cannot bind Rpl10 retained an oxidative-stress
      growth defect even when supplied with excess Rpl10. GO:0034599 is
      justified as a non-core process annotation because Sqt1 performs the Rpl10
      extraction step in this repair route rather than merely being required for
      downstream stress resistance.
    supported_by:
    - reference_id: PMID:37086725
      supporting_text: >-
        Oxidized Rps26 and Rpl10 are released from ribosomes by their
        chaperones, Tsr2 and Sqt1, and the damaged ribosomes are subsequently
        repaired with newly made proteins.
