description: 'ZDS1 (YMR273C; historical synonyms include HST1, CES1, NRC1 and OSS1)
  encodes a 915-residue, fungus-specific, non-catalytic regulator of the PP2A phosphatase
  that carries the B-type regulatory subunit Cdc55 (PP2A-Cdc55). Through its conserved
  C-terminal Zds_C motif, Zds1 binds Cdc55 and forms a tight stoichiometric complex
  with PP2A-Cdc55. Together with its paralog Zds2, it determines where the phosphatase
  is located and which substrates it acts on: Zds1/Zds2 keep PP2A-Cdc55 in the cytoplasm
  and at the bud cortex, exclude it from the nucleus, and target it to the Cdc25-family
  phosphatase Mih1. Through this, Zds1 promotes Cdk1 activation and mitotic entry.
  At anaphase onset, Zds1 acts downstream of separase to down-regulate PP2A-Cdc55
  activity towards Net1, allowing Cdk-dependent Net1 phosphorylation and timely release
  of Cdc14 from the nucleolus (the FEAR pathway). Zds1 localizes to the cytoplasm,
  presumptive bud sites, the bud cortex/bud tip and, in late mitosis, the bud neck.
  At the bud cortex, the Zds1/Zds2-PP2A-Cdc55 complex acts as a Rho1 effector that
  biases Rho1 output towards polarized growth and glucan synthesis and away from cell
  wall integrity signalling. Additional reported roles include interaction with the
  mRNA export factors Dbp5 and Gfd1 at the cytoplasmic face of the nuclear pore, and
  effects on rDNA, mating-type and telomeric silencing and on replicative life span.'
