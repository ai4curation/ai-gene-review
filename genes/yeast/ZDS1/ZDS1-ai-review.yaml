core_functions:
  - description: Zds1 binds the PP2A B subunit Cdc55 through its C-terminal 
      Zds_C motif, forming a stoichiometric complex with PP2A-Cdc55, and 
      regulates where the phosphatase acts and on which substrates. It retains 
      PP2A-Cdc55 in the cytoplasm and at the bud cortex, excludes it from the 
      nucleus and targets it to Mih1, promoting Cdk1 activation and mitotic 
      entry. At anaphase onset it down-regulates PP2A-Cdc55 activity towards 
      Net1, allowing timely Cdc14 release and mitotic exit.
    molecular_function:
      id: GO:0019888
      label: protein phosphatase regulator activity
    directly_involved_in:
      - id: GO:0010971
        label: positive regulation of G2/M transition of mitotic cell cycle
      - id: GO:0031536
        label: positive regulation of exit from mitosis
      - id: GO:0032880
        label: regulation of protein localization
    locations:
      - id: GO:0005737
        label: cytoplasm
    supported_by:
      - reference_id: PMID:21119008
        supporting_text: We show here that related proteins called Zds1 and Zds2
          form a tight stoichiometric complex with PP2A(Cdc55) and target its 
          activity to Cdc25 but not to Wee1.
      - reference_id: PMID:22427694
        supporting_text: Zds1p physically interacts with, and regulates the 
          localization of, Cdc55p through the Zds_C motif.
      - reference_id: PMID:21536748
        supporting_text: Thus, the cytoplasmic localization of Cdc55 mediated by
          Zds1/Zds2 is required and sufficient for normal mitotic entry.
        reference_section_type: RESULTS
      - reference_id: PMID:18762578
        supporting_text: Ectopic Zds1 expression in turn is sufficient to 
          down-regulate PP2A(Cdc55) and promote Net1 phosphorylation.
        reference_section_type: ABSTRACT
