    review:
      summary: PAINT IBD at the fungal Zds node PTN001999034, seeded only by 
        ZDS1 itself (SGD:S000004886). The seed is ZDS1's own experimental 
        evidence that ectopic Zds1 halves the specific activity of 
        immunopurified PP2A-Cdc55 in metaphase-arrested cells. That ZDS1 is 
        among its own sources is expected and is not circular. The inhibitor 
        term describes only one context-dependent output of Zds1's regulation of
        PP2A-Cdc55.
      action: MODIFY
      reason: Zds1 clearly binds and modulates PP2A-Cdc55, but the inhibitor 
        label is too narrow and partly contradicted. Zds1/Zds2 are strictly 
        required for PP2A-Cdc55-dependent dephosphorylation of Mih1, an 
        activating, substrate-targeting role. They maintain the cytoplasmic pool
        of PP2A-Cdc55 that promotes mitotic entry, and the Queralt lab later 
        concluded that Zds proteins are unlikely to be direct inhibitory 
        components of PP2A-Cdc55. Their effect is better described by the parent
        term protein phosphatase regulator activity (GO:0019888), which covers 
        both the activating and the inhibitory outputs. The context-specific 
        inhibitory evidence is retained on the experimental IMP row as non-core.
