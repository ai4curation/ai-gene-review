suggested_questions:
  - question: Should the PAINT IBD at PANTHER:PTN001999034 assert protein 
      phosphatase regulator activity (GO:0019888) rather than protein 
      phosphatase inhibitor activity (GO:0004864)? The only seed is the ZDS1 
      overexpression IMP, while Zds1/Zds2 also activate PP2A-Cdc55 towards Mih1 
      and promote its cytoplasmic function.
  - question: How does separase convert Zds1 from a PP2A-Cdc55 targeting factor 
      into a down-regulator at anaphase onset? Do cell-cycle-dependent 
      phosphorylation sites on Zds1 switch its effect on substrate selection?
suggested_experiments:
  - hypothesis: Zds1 changes PP2A-Cdc55 activity in a substrate-selective way 
      rather than inhibiting catalysis globally.
    description: Purify PP2A-Cdc55 with and without stoichiometric Zds1 (or the 
      Zds_C fragment) and measure dephosphorylation kinetics of 
      Cdk1-phosphorylated Mih1, Net1 and Swe1 and of a generic phosphopeptide. 
      Include phosphomimetic/non-phosphorylatable Zds1 mutants at the 
      cell-cycle-regulated sites.
    experiment_type: in vitro reconstitution and phosphatase kinetics
