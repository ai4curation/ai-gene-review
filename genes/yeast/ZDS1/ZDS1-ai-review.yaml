    original_reference_id: PMID:18762578
    qualifier: involved_in
    review:
      summary: Proposed process annotation. Zds1 is required downstream of 
        separase for timely early-anaphase (FEAR) release of Cdc14 from the 
        nucleolus. Ectopic Zds1 is sufficient to release Cdc14 and rescues the 
        MEN mutant cdc15-2.
      action: NEW
      reason: 'Participation test: Zds1 does regulatory work in this process. It binds
        Cdc55 through the Zds_C motif and down-regulates nuclear PP2A-Cdc55 activity
