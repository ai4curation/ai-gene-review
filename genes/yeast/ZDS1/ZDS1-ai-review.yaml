  - term:
      id: GO:0004864
      label: protein phosphatase inhibitor activity
    evidence_type: IMP
    original_reference_id: PMID:18762578
    review:
      summary: Ectopic Zds1 expression in metaphase-arrested cells roughly 
        halved the specific activity of immunopurified PP2A-Cdc55 and promoted 
        Net1 phosphorylation and Cdc14 release. This is direct experimental 
        evidence that Zds1 can inhibit PP2A-Cdc55 in the mitotic-exit context.
      action: MODIFY
      reason: 'The measurement is real: ectopic Zds1 reduced PP2A-Cdc55 specific activity,
        which demonstrates that Zds1 binds and modulates the phosphatase. Inhibitor,
        however, captures only the context-specific (anaphase/Net1), overexpression-based
        output. Zds1 also activates PP2A-Cdc55 towards Mih1 and promotes its cytoplasmic
        function at mitotic entry, and the same group later argued that the low-abundance
        Zds proteins are unlikely to be direct inhibitory subunits. The parent term
        protein phosphatase regulator activity (GO:0019888) represents the experimentally
        supported activity without fixing its sign, consistent with the MODIFY of
        the IBA row.'
      supported_by:
        - reference_id: PMID:18762578
          supporting_text: The PP2ACdc55 phosphatase-specific activity decreased
            to about half of its initial value in response to Zds1 induction
        - reference_id: PMID:18762578
          supporting_text: Ectopic Zds1 expression in turn is sufficient to 
            down-regulate PP2A(Cdc55) and promote Net1 phosphorylation.
          reference_section_type: ABSTRACT
        - reference_id: PMID:22427694
          supporting_text: Therefore, it seems unlikely that Zds1p and Zds2p act
            as direct inhibitory components of the PP2ACdc55 complex.
      proposed_replacement_terms:
        - id: GO:0019888
          label: protein phosphatase regulator activity
    qualifier: enables
