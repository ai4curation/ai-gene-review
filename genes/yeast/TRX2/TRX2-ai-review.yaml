id: P22803
gene_symbol: TRX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: TRX2 (YGR209C) encodes thioredoxin-2, one of the two cytoplasmic thioredoxins of S. cerevisiae
  (78% identical to Trx1; Trx3 is mitochondrial). It is a CGPC-active-site disulfide oxidoreductase reduced
  by NADPH-thioredoxin reductase Trr1. Reduced Trx2 donates electrons to PAPS reductase (Met16) in sulfate
  assimilation, to ribonucleotide reductase and to thiol peroxidases (Tsa1, Tsa2, Ahp1, Dot5), reduces
  protein disulfides and glutathione disulfide (backing up glutathione reductase) and deglutathionylates
  proteins such as the vacuolar TRP channel Yvc1. TRX2 is strongly induced by H2O2 and diamide through
  Yap1 and Skn7, and Trx2 feeds back to inactivate Yap1. trx1 trx2 double mutants are methionine auxotrophs.
  Like Trx1, Trx2 also forms the redox-independent LMA1 complex with Pbi2 that promotes Sec18-dependent
  homotypic vacuole fusion and vacuole inheritance. It is found in the cytosol and nucleus.
