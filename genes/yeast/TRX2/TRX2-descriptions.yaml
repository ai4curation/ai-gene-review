descriptions:
- source: UniProt
  text: Participates as a hydrogen donor in redox reactions through the reversible
    oxidation of its active center dithiol to a disulfide, accompanied by the transfer
    of 2 electrons and 2 protons. It is involved in many cellular processes, including
    deoxyribonucleotide synthesis, repair of oxidatively damaged proteins, protein
    folding, sulfur metabolism, and redox homeostasis. Thioredoxin-dependent enzymes
    include phosphoadenosine-phosphosulfate reductase MET16, alkyl- hydroperoxide
    reductase DOT5, thioredoxin peroxidases TSA1 and TSA2, alkyl hydroperoxide reductase
    AHP1, and peroxiredoxin HYR1. Thioredoxin is also involved in protection against
    reducing stress. As part of the LMA1 complex, it is involved in the facilitation
    of vesicle fusion such as homotypic vacuole and ER-derived COPII vesicle fusion
    with the Golgi. This activity does not require the redox mechanism. Through its
    capacity to inactivate the stress response transcription factor YAP1 and its regulator
    the hydroperoxide stress sensor HYR1, it is involved in feedback regulation of
    stress response gene expression upon oxidative stress.
  source_type: curated
