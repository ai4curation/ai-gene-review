descriptions:
- source: UniProt
  text: Catalyzes the eighth step in arginine biosynthesis. Also has a catabolic function
    as the first enzyme of citrulline utilization as nitrogen source via arginine
    and the reactions involved in the arginase pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P22768
  source_id: P22768
- source: Alliance_Imported
  text: Argininosuccinate synthetase; catalyzes the formation of L-argininosuccinate
    from citrulline and L-aspartate in the arginine biosynthesis pathway; potential
    Cdc28p substrate
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARG1
  source_id: SGD:S000005419
- source: Alliance_Automated
  text: Enables argininosuccinate synthase activity. Involved in L-arginine biosynthetic
    process. Located in cytosol. Human ortholog(s) of this gene implicated in citrullinemia;
    classic citrullinemia; hepatocellular carcinoma; and melanoma. Orthologous to
    human ASS1 (argininosuccinate synthase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ARG1
  source_id: SGD:S000005419
