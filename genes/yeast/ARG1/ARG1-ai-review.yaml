  review:
    summary: 'Urea cycle IBA propagated from PAINT node PTN000172504, which co-asserts argininosuccinate
      synthase activity and L-arginine biosynthesis. GO:0000050 describes the ureotelic cycle in which
      arginine is cleaved to urea and ornithine is regenerated for nitrogen excretion. S. cerevisiae does
      not operate such a cycle: ARG1 acts in arginine biosynthesis and in citrulline assimilation as a
      nitrogen source, while arginase (CAR1) is an inducible catabolic enzyme that, in complex with OTCase
      (ARG3), inhibits the biosynthetic step to prevent futile cycling.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The reaction itself is shared with the ureotelic cycle, so the term is not entirely wrong
      at the reaction level, but yeast arginine metabolism does not function as a urea cycle; the biosynthetic
      process term captures the role.
    supported_by:
