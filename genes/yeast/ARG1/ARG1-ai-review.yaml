description: Argininosuccinate synthase (citrulline--aspartate ligase, EC 6.3.4.5) of Saccharomyces cerevisiae.
  This cytosolic homotetrameric enzyme condenses L-citrulline with L-aspartate in an ATP-dependent reaction
  (ATP -> AMP + PPi) to form argininosuccinate, the penultimate step of L-arginine biosynthesis, which
  in yeast runs in the cytosol from ornithine exported by mitochondria. Kinetic studies show positive
  cooperativity toward MgATP modulated by argininosuccinate and arginine. The enzyme also has a catabolic
  role, as the first step of citrulline utilisation as a nitrogen source (citrulline is converted to arginine
  and degraded via arginase). ARG1 expression is repressed by arginine (ArgR/Mcm1 complex) and induced
  by general amino acid control.
