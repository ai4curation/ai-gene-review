  - UniProtKB:P00966
  review:
    summary: This enzyme performs a shared ornithine-to-arginine reaction within the fungal arginine/urea
      reaction network.
    action: KEEP_AS_NON_CORE
    reason: Live GO:0000050 defines ornithine-to-arginine synthesis followed by arginine cleavage to urea
      and regenerated ornithine; it does not require a ureotelic organism or nitrogen excretion. The target
      has the annotated OTC/ASS/ASL reaction and native fungal arginase supplies the return chemistry.
      Retain the existing process annotation as a contextual role, without asserting measured net full-cycle
      flux or a metazoan detoxification function. The primary role remains arginine biosynthesis. PMID:35347
      also establishes a catabolic citrulline-utilization role for yeast ASS; PMID:12679340 shows regulated
      coupling of OTC and arginase, which limits simultaneous cycling rather than changing the enzyme
      reaction.
    supported_by:
    - reference_id: PMID:35347
      supporting_text: anabolic in the biosynthesis of arginine, catabolic as the first enzyme of citrulline
        utilization as nitrogen source
    - reference_id: PMID:12679340
      supporting_text: In the presence of ornithine and arginine, ornithine carbamoyltransferase (OTCase)
        and arginase form a one-to-one enzyme complex in which the activity of OTCase is inhibited whereas
        arginase remains catalytically active
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000172504
        source_status: SUPPORTS_TRANSFER
        comment: The inherited reaction participates in the defined ornithine/arginine/urea topology.
          Ureotelic nitrogen excretion is not part of the GO definition; do not infer a lineage mismatch
          solely from fungal taxonomy.
