id: P53219
gene_symbol: IMO32
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Imo32 (Ygr031w) is a 342-residue Saccharomyces cerevisiae mitochondrial
  matrix alpha/beta-hydrolase of the ABHD11 family (PTHR46118:SF4) whose
  nuclear-encoded precursor undergoes two-step N-terminal maturation in the
  matrix: removal of residues 1-38 by mitochondrial processing peptidase (MPP)
  followed by cleavage of an unstable octapeptide (residues 39-46) by
  mitochondrial octapeptidyl aminopeptidase Oct1 to yield a stable mature chain
  (residues 47-342). Encoded at a locus containing the nested antisense gene
  NAG1 and paralogous to the mitochondrial ethanol O-acetyltransferase Eat1
  (though not involved in ethyl acetate synthesis), Imo32 conserves the
  81-HGLFG-85 oxyanion-hole loop and a Ser152-Glu176-His319 charge-relay
  catalytic triad supporting carboxylic-ester hydrolase activity, whereas its
  endogenous physiological substrate in yeast mitochondria remains unresolved.
existing_annotations:
- term:
    id: GO:0004806
    label: triacylglycerol lipase activity
  evidence_type: IDA
  original_reference_id: PMID:28465236
  qualifier: enables
  review:
    summary: Whole-cell [14C]acetate triacylglycerol reduction upon high-copy IMO32 overexpression does not establish direct triacylglycerol lipase catalysis for a mitochondrial matrix enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Arya et al. (PMID:28465236) inferred triacylglycerol lipase activity from
      decreased cellular [14C]acetate-labeled triacylglycerol levels in yeast
      overexpressing YGR031W (IMO32) or human ABHD11 without demonstrating
      purified triacylglycerol hydrolysis kinetics. Mature Imo32 resides inside
      the mitochondrial matrix (PMID:21525245) away from cytosolic lipid-droplet
      triacylglycerol stores, and co-assayed human ABHD11 shows no natural
      acylglycerol lipase activity (PMID:27544863) and physiologically acts as a
      mitochondrial OGDHc glutaryl-lipoyl thioesterase (PMID:40664791).
    supported_by:
    - reference_id: PMID:28465236
      supporting_text: >-
        Overexpression of ABHD11 also alters the molecular species of
        triacylglycerol in yeast. Similar activity was observed in its yeast
        homolog, Ygr031w. The role of the conserved lipase motif in the
        hydrolase activity was proven by the mutation of all conserved amino
        acid residues of GXSXG motif.
    - reference_id: PMID:27544863
      supporting_text: >-
        Our fluorescent activity assays designed for natural lipase substrates
        revealed no activity of hABHD11 towards mono- or diacylglycerols.
