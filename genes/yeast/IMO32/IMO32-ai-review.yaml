core_functions:
- description: >-
    Soluble mitochondrial matrix alpha/beta-hydrolase processed sequentially by
    MPP and Oct1 whose conserved 81-HGLFG-85 oxyanion loop and
    Ser152-Glu176-His319 charge-relay triad support carboxylic-ester hydrolase
    activity by phylogenetic conservation and GXSXG-dependent whole-cell
    activity, although no direct carboxylic-esterase assay on purified Imo32
    itself has yet been reported (and the sole direct triacylglycerol-lipase
    claim on GO:0004806 was over-annotated).
