knowledge_gaps:
- gap_statement: >-
    Endogenous physiological substrate of mature mitochondrial matrix Imo32—in
    particular whether Imo32 deacylates lipoylated Kgd2 on the yeast
    2-oxoglutarate dehydrogenase complex like mammalian ABHD11 or synthesizes
    non-ethyl short-chain acetate esters—remains unestablished.
  boundary: >-
    Test imo32Delta and imo32-S152A yeast strains for Kgd2 lipoylation adducts,
    2-oxoglutarate dehydrogenase activity, and purified substrate specificity
    against glutaryl-lipoamide vs branched-chain alcohols + acetyl-CoA.
