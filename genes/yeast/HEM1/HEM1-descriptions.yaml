descriptions:
- source: UniProt
  text: Catalyzes the synthesis of 5-aminolevulinate (ALA) from succinyl-CoA and glycine,
    the first and rate-limiting step in heme biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P09950
  source_id: P09950
- source: Alliance_Imported
  text: 5-aminolevulinate synthase; catalyzes the first step in the heme biosynthetic
    pathway; an N-terminal signal sequence is required for localization to the mitochondrial
    matrix; expression is regulated by Hap2p-Hap3p; has a pyridoxal phosphate cofactor
    whose insertion is mediated by Mcx1p
  source_type: curated
  url: https://www.yeastgenome.org/locus/HEM1
  source_id: SGD:S000002640
- source: Alliance_Automated
  text: Enables 5-aminolevulinate synthase activity. Involved in heme biosynthetic
    process and positive regulation of organelle assembly. Located in mitochondrial
    matrix. Used to study erythropoietic protoporphyria. Human ortholog(s) of this
    gene implicated in cutaneous porphyria; erythropoietic protoporphyria; hemochromatosis;
    sideroblastic anemia; and sideroblastic anemia 1. Orthologous to several human
    genes including ALAS2 (5'-aminolevulinate synthase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HEM1
  source_id: SGD:S000002640
