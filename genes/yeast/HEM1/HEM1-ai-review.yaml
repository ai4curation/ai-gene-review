suggested_questions:
- question: Is the hemin inhibition of purified Hem1 physiologically relevant, given that yeast (unlike
    mammals) is thought to regulate heme synthesis mainly downstream of ALA (e.g. at Hem2/Hem3)?
suggested_experiments:
- description: Measure ALA and heme flux in strains expressing hemin-insensitive Hem1 variants to test
    whether feedback inhibition of Hem1 contributes to heme homeostasis in vivo.
