- term:
    id: GO:1902117
    label: positive regulation of organelle assembly
  evidence_type: IMP
  original_reference_id: PMID:32075909
  qualifier: involved_in
  review:
    summary: IMP from Bouchez et al. 2020, who used a heme-deficient (hem1) strain as a tool to titrate
      cellular 'labile' heme with exogenous ALA and showed that heme controls mitochondrial biogenesis
      by stabilising the Hap4 co-activator. The regulatory agent is heme acting through the HAP complex;
      Hem1's contribution is to make the precursor of that signal. The effect on organelle assembly is
      a downstream, pleiotropic consequence of loss of heme rather than a regulatory activity of Hem1.
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect consequence of heme deficiency; Hem1 performs no regulatory step in organelle assembly.
    supported_by:
    - reference_id: PMID:32075909
      supporting_text: Taking advantage of a yeast strain deficient for heme production that enabled controlled
        modulation and monitoring of labile heme levels
    - reference_id: PMID:32075909
      supporting_text: cellular labile heme is critical for the post-translational regulation of HAP complex
        activity
