taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 5-Aminolevulinate (ALA) synthase (EC 2.3.1.37) of Saccharomyces cerevisiae, a homodimeric
  pyridoxal 5'-phosphate-dependent enzyme of the class-II aminotransferase fold that condenses glycine
  with succinyl-CoA to form 5-aminolevulinate, CO2 and CoA. This is the first committed step of tetrapyrrole
  biosynthesis, supplying ALA for both heme and siroheme; hem1 mutants are heme-deficient (lacking cytochromes,
  catalase and sterol synthesis) and methionine-requiring (lacking siroheme-containing sulfite reductase),
  and are rescued by exogenous ALA. Hem1 is nuclear-encoded, synthesized as a precursor with an N-terminal
  presequence, and imported into the mitochondrial matrix where it is processed. The purified enzyme is
  inhibited by hemin.
