- id: file:yeast/MON1/MON1-deep-research-sgd.md
  title: SGD gene description for MON1 (yeast)
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: The Mon1-Ccz1 GEF for Ypt7, its stimulation by membranes and anionic phospholipids, its role
      in Ypt7 vacuolar localization and its requirement for autophagy and the CVT pathway agree with the
      review's sources (PMID:12364329, PMID:24413168). The claim that Mon1 is "targeted to vacuole via AP-3
      pathway" could not be traced to a paper. Mon1-Ccz1 acts as a fusion factor for AP-3 traffic
      (PMID:33225520), which the review covers through the ALP delivery defect of mon1 mutants, and Mon1 is
      recruited to vacuoles by PI3P and released after Yck3 phosphorylation (PMID:24623720), not shown to be
      AP-3 cargo. Left unverified, with no annotation change. The same AP-3 phrase appears in the SGD text of
      the mitochondrial enzyme IDH2.
core_functions:
- description: >-
    Mon1, together with Ccz1, forms the longin-domain Rab7/Ypt7 guanine
    nucleotide exchange factor that activates Ypt7 on late endosomal, MVB and
    vacuolar membranes, driving Rab5-to-Ypt7/Rab7 maturation and fusion of MVB,
    Cvt, and autophagic vesicles with the fungal vacuole.
