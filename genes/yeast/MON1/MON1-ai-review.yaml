    supporting_text: >-
      Our data indicate that the Mon1-Ccz1 complex triggers endosomal
      maturation by activating Ypt7 on late endosomes.
  - reference_id: PMID:12364329
    supporting_text: >-
      Taken together, our data indicate that Ccz1 and Mon1 function at the stage
      of fusion of autophagosomes/Cvt vesicles with the vacuole.
suggested_questions:
- question: >-
    Should the yeast Mon1-Ccz1 module be annotated to a more specific
    Rab5-to-Ypt7/Rab7 transition or vacuolar vesicle fusion process term that
    separates the complex's exchange step from generic protein targeting to
    vacuole?
suggested_experiments:
- hypothesis: >-
    The acidic-lipid binding detected for isolated Mon1 primarily provides
    nonspecific electrostatic membrane recruitment, while Rab5-family GTPases
    and Atg8-family proteins determine the physiologic membrane on which
    Mon1-Ccz1 activates Ypt7.
  description: >-
    Compare Ypt7 activation and endosomal/vacuolar recruitment in cells carrying
    Mon1 and Ccz1 basic-patch mutants, Rab5-binding mutants, and Atg8-binding
    mutants, using allele combinations that separate endosomal maturation from
    Cvt/autophagosomal delivery.
