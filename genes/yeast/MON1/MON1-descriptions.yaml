descriptions:
- source: UniProt
  text: In complex with CCZ1, is required for multiple vacuole delivery pathways including
    the cytoplasm to vacuole transport (Cvt), autophagy, pexophagy and endocytosis.
    The MON1-CCZ1 complex acts at the fusion of vesicles with the vacuole, through
    its regulation of the SNARE complex during the coordinated priming and docking
    stages of fusion, and particularly at the stage of tethering/docking (PubMed:12134085,
    PubMed:12364329, PubMed:12387888, PubMed:14662743, PubMed:15721293, PubMed:32391792,
    PubMed:37463208). The MON1-CCZ1 complex is recruited to membranes enriched in
    charged lipids, particularly phosphatidylinositol 3-phosphate (PtdIns[3]P), by
    GTP- associated small GTPase RAB5 homologs (YPT10, YPT52, YPT53 and VPS21) (PubMed:32391792).
    The MON1-CCZ1 complex recruits GDP-associated small GTPase YPT7 to membranes and
    acts as a guanine nucleotide-exchange factor (GEF), promoting nucleotide-exchange
    on YPT7 and triggering endosomal maturation by recruiting downstream effectors
    such as components of the HOPS tethering complex (PubMed:20797862, PubMed:32391792).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53129
  source_id: P53129
- source: Alliance_Imported
  text: Subunit of heterodimeric guanine nucleotide exchange factor (GEF); subunit
    of Mon1-Ccz1 GEF complex which stimulates nucleotide exchange and activation of
    Ypt7p, a Rab family GTPase involved in membrane tethering and fusion events at
    late endosome and vacuole; GEF activity is stimulated by membrane association
    and anionic phospholipids; role in localizing Ypt7p to vacuolar membrane; required
    for autophagy, CVT pathway, and mitophagy; targeted to vacuole via AP-3 pathway
  source_type: curated
  url: https://www.yeastgenome.org/locus/MON1
  source_id: SGD:S000003092
- source: Alliance_Automated
  text: Enables guanyl nucleotide exchange factor inhibitor activity and phospholipid
    binding activity. Contributes to guanyl-nucleotide exchange factor activity. Involved
    in macroautophagy and vacuolar transport. Located in cytosol; endosome; and fungal-type
    vacuole membrane. Part of Mon1-Ccz1 complex. Orthologous to human MON1A (MON1
    vesicular trafficking associated A) and MON1B (MON1 vesicular trafficking associated
    B).
