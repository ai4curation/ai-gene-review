gene_symbol: LRO1
organism: yeast
uniprot_id: P40345
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes triacylglycerol (TAG) formation by an acyl-CoA independent pathway.
    The enzyme specifically transfers acyl groups from the sn-2 position of a phospholipid
    to diacylglycerol (DAG), thus forming an sn-1-lysophospholipid (PubMed:10747858,
    PubMed:10829075, PubMed:32349126). The preferred acyl donors are phosphatidylethanolamine
    (PE) and phosphatidylcholine (PC). Also capable of using broad acyl donors such
    as phosphatidic acid (PA), phosphatidylserine (PS), phosphatidylglycerol (PG)
    and phosphatidylinositol (PI), as well as monogalactosyldiacylglycerol (MGDG),
    digalactosyldiacylglycerol (DGDG), and acyl-CoA, and it is more likely to use
    unsaturated acyl donors. As acyl acceptors, it prefers 1,2- over 1,3-diacylglycerol
    (DAG). Additionally, has esterification activity that can utilize methanol as
    acyl acceptor to generate fatty acid methyl esters (FAME) (PubMed:30706417). Can
    also utilize ceramide instead of DAG, acylating the ceramides by attaching a fatty
    acid to the hydroxy group on the first carbon atom of the long-chain base to produce
    1-O-acylceramides (PubMed:22738231). Involved in lipid particle synthesis from
    the endoplasmic reticulum, promoting localized TAG production at discrete ER subdomains
    (PubMed:32349126). Relocates from the endoplasmic reticulum to a subdomain of
    the inner nuclear membrane upon nutrient starvation, where it provides a site
    of TAG synthesis, which is coupled with nuclear membrane remodeling (PubMed:31422915).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40345
  source_id: P40345
- source: Alliance_Imported
  text: Acyltransferase that converts diacylglycerol to triacylglycerol (TGA); one
    of several acyltransferases that contribute to TGA synthesis; relocates from ER
    to nuclear membrane in response cell cycle and starvation signals; Lro1p and Dga1p
    can O-acylate ceramides; putative homolog of human lecithin cholesterol acyltransferase
  source_type: curated
  url: https://www.yeastgenome.org/locus/LRO1
  source_id: SGD:S000005291
- source: Alliance_Automated
  text: Enables phospholipid:diacylglycerol acyltransferase activity. Involved in
    several processes, including lipid storage; phospholipid homeostasis; and triglyceride
    biosynthetic process. Located in endoplasmic reticulum; lipid droplet; and nuclear
    inner membrane. Human ortholog(s) of this gene implicated in Norum disease and
    arteriosclerosis. Orthologous to human LCAT (lecithin-cholesterol acyltransferase)
    and PLA2G15 (phospholipase A2 group XV).
