taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: LRO1 encodes phospholipid:diacylglycerol acyltransferase (PDAT; EC 2.3.1.158), an LCAT-related
  enzyme of the alpha/beta-hydrolase (lipase) superfamily. It makes triacylglycerol without acyl-CoA by
  transferring the sn-2 acyl chain of a glycerophospholipid (mainly phosphatidylethanolamine or phosphatidylcholine)
  to 1,2-diacylglycerol, which also releases an sn-1 lysophospholipid. With the acyl-CoA-dependent DGAT
  Dga1 it accounts for most TAG synthesis, and it is the major TAG synthase in exponentially growing cells.
  Lro1 is a single-pass type II ER membrane protein with its catalytic domain in the ER lumen. It concentrates
  at seipin/Nem1-defined ER subdomains where lipid droplets form, and on nutrient depletion it relocates
  to a subdomain of the inner nuclear membrane, where its TAG synthesis remodels nuclear membrane phospholipids.
  In vitro it can use a broad range of acyl donors and acceptors, and it can acylate ceramides to 1-O-acylceramides.
