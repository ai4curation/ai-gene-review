gene_symbol: COX17
organism: yeast
uniprot_id: Q12287
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Copper metallochaperone involved in the assembly of cytochrome c oxidase (respiratory
    chain complex IV, CIV) (PubMed:8662933). Binds two copper ions and delivers them
    to metallochaperone SCO1, which relays the copper to the Cu(A) site on the cytochrome
    c oxidase subunit II (COX2), and to metallochaperone COX11, which relays the copper
    to the Cu(B) site on the cytochrome c oxidase subunit I (COX1) (PubMed:15199057,
    PubMed:8662933, PubMed:9585572).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12287
  source_id: Q12287
- source: Alliance_Imported
  text: Copper metallochaperone that transfers copper to Sco1p and Cox11p; eventual
    delivery to cytochrome c oxidase; contains twin cysteine-x9-cysteine motifs; interacts
    with the MICOS complex, and interaction is promoted by copper ions; human homolog
    COX17 partially complements yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/COX17
  source_id: SGD:S000003932
- source: Alliance_Automated
  text: Enables copper chaperone activity and cuprous ion binding activity. Involved
    in copper ion transport and mitochondrial respiratory chain complex IV assembly.
    Acts upstream of or within protein farnesylation. Located in cytosol and mitochondrial
    intermembrane space. Orthologous to human COX17 (cytochrome c oxidase copper chaperone
    COX17).
  source_type: automated
  url: https://www.yeastgenome.org/locus/COX17
  source_id: SGD:S000003932
