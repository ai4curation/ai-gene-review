  review:
    summary: Protein farnesylation, attributed to Cox17 from a paper that is entirely about
      a different gene, COX10 (heme A:farnesyltransferase).
    action: REMOVE
    reason: 'Three independent problems make this a mis-attribution rather than an annotation
      whose full text merely differs from its abstract. First, the cited reference is titled
      and abstracted wholly about cloning the human COX10 homolog by complementation of a
      yeast cox10 mutant; COX10 and COX17 differ by one digit. Second, the term is wrong even
      for COX10: GO:0018343 is defined as covalent attachment of a farnesyl group to a PROTEIN,
      whereas heme A:farnesyltransferase farnesylates heme, not protein - so no gene in that
      paper performs the annotated activity. Third, the row was assigned by MGI against a
      Saccharomyces cerevisiae UniProt accession. Cox17 is a 69 aa twin CX9C copper chaperone
      with no farnesyltransferase activity, and the substantial Cox17 literature is uniformly
      about copper binding and transfer. This is not a case of second-guessing a curator who
      read a full text that the cache lacks: the annotated activity is absent from the cited
      work altogether. Recommend reporting to the assigning group. Note that the supporting_text
      below deliberately quotes PMID:8662933 rather than the cited PMID:8078902: quoting the
      miscited paper would defeat the point, since the finding is precisely that it supports
      nothing here. The quote instead establishes what COX17 does.'
