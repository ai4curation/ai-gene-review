core_functions:
- description: Copper metallochaperone of the mitochondrial intermembrane space that binds
    Cu(I) and transfers it specifically to Sco1 and to Cox11, the metallochaperones that build
    the CuA site of Cox2 and the CuB site of Cox1 respectively. Cox17 is the common copper
    source for both branches of the cytochrome c oxidase copper delivery pathway.
