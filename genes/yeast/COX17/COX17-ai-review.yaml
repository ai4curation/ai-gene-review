suggested_questions:
- question: The GO:0018343 protein farnesylation IDA row (PMID:8078902) appears to be a COX10
    to COX17 gene mix-up, and the term is wrong even for COX10 since heme A:farnesyltransferase
    farnesylates heme rather than protein. The GO:0005739 row from the same reference shares
    the faulty provenance. Should both be retracted by the assigning group?
  experts:
  - MGI curators
  - SGD curators
  - GO Consortium annotation quality group
- question: 'Copper stoichiometry is reported inconsistently: one Cu(I) ion by ITC versus
    a binuclear cuprous-thiolate cluster by XAS. Is the difference preparation- and redox-dependent,
    and does either form correspond to the physiological donor state?'
  experts:
  - Winge lab
  - bioinorganic chemistry curators
suggested_experiments:
- hypothesis: The cytosolic Cox17 pool is functionally dispensable for cytochrome c oxidase
    assembly.
  description: Compare complex IV assembly and copper metallation in strains expressing Cox17
    tethered to the inner membrane versus freely distributed Cox17, as was done for Cox19.
  experiment_type: genetic
