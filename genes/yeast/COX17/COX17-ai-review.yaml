id: Q12287
gene_symbol: COX17
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Cox17 is a 69-residue cysteine-rich copper metallochaperone of the mitochondrial
  intermembrane space, and the common copper source for both branches of the cytochrome c
  oxidase copper delivery pathway. It binds Cu(I) through a twin CX9C helical-hairpin fold
  and transfers copper directly and specifically to Sco1, which metallates the CuA site of
  Cox2, and to Cox11, which metallates the CuB site of Cox1. Loss of Cox17 blocks a late post-translational
  step of cytochrome c oxidase assembly without affecting synthesis of the mitochondrially
  and nuclearly encoded subunits. Cox17 is distributed between the cytosol and the intermembrane
  space. The copper-binding stoichiometry has been reported both as a single Cu(I) ion and
  as a binuclear cuprous-thiolate cluster depending on preparation and redox state.
