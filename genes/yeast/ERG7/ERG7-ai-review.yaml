id: P38604
gene_symbol: ERG7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG7 (YHR072W) encodes lanosterol synthase (2,3-oxidosqualene cyclase, EC 5.4.99.7) of Saccharomyces
  cerevisiae, which cyclises (S)-2,3-epoxysqualene into lanosterol, forming the tetracyclic sterol nucleus;
  this is the first sterol and the committed cyclisation step of ergosterol biosynthesis. Erg7 belongs
  to the terpene cyclase/mutase family; mutational analysis shows Tyr707 stabilises the chair-boat bicyclic
  and C-8/C-9 lanosteryl cation intermediates. Erg7 is a monotopic, lipophilic membrane protein that is
  located almost exclusively on lipid droplets (lipid particles), with only a minor ER pool, and its oxidosqualene
  accumulates in lipid droplets when the enzyme is absent or inhibited. Erg7 activity, stability and lipid-droplet
  targeting require physical interaction with the 3-keto sterol reductase Erg27. erg7 mutants are ergosterol
  auxotrophs.
