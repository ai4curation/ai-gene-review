suggested_questions:
- question: Is Erg27's requirement for Erg7 activity purely a chaperone/stabilisation effect, or does
    Erg27 binding allosterically activate the cyclase? Could GO capture this dependency (e.g. on Erg27
    as an enzyme regulator) rather than as protein binding on Erg7?
suggested_experiments:
- description: Assay purified Erg7 with and without purified Erg27 in liposomes or lipid-droplet mimetics
    to separate a direct activation effect of Erg27 from protection against proteolysis.
