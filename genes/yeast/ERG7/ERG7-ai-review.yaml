  review:
    summary: 'Protein binding (IPI) with Erg27 (Q12452), detected in the Mo & Bard 2005 split-ubiquitin
      screen of sterol enzymes. The Erg7-Erg27 interaction is functionally important: Erg27 is required
      for Erg7 stability, lipid-particle association and oxidosqualene cyclase activity. ''Protein binding''
      itself is uninformative and no specific MF term captures Erg7''s role in the pair (Erg27 is the
      activating partner, so any regulator term belongs on Erg27). Removed per the protein-binding policy;
      removal does not mean the interaction is false.'
