id: Q08438
gene_symbol: VHS3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Vhs3 (YOR054C) is a moonlighting paralog of Sis2/Hal3 in Saccharomyces cerevisiae. Its PPCDC (HFCD
  flavoprotein) domain associates with Cab3 to form the heterotrimeric phosphopantothenoylcysteine decarboxylase
  of coenzyme A biosynthesis, in which Vhs3 (or Hal3) supplies the catalytic histidine and Cab3 the catalytic cysteine;
  hal3 vhs3 double mutants are inviable because of this PPCDC requirement. Vhs3 also binds the C-terminal catalytic
  domain of the Ser/Thr phosphatase Ppz1 and inhibits it, opposing Ppz1 in monovalent cation homeostasis, though
  it is less prone than Hal3 to leave the trimer and act as a monomeric inhibitor. Vhs3 is a component of the Cab3-centred
  CoA-synthesizing protein complex.
