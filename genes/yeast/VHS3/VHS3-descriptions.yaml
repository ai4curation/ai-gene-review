descriptions:
- source: UniProt
  text: Component of the phosphopantothenoylcysteine decarboxylase (PPCDC) involved
    in the coenzyme A synthesis. Acts as an inhibitory subunit of protein phosphatase
    PPZ1, which is involved in many cellular processes such as G1-S transition or
    salt tolerance.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08438
  source_id: Q08438
- source: Alliance_Imported
  text: 'Negative regulatory subunit of protein phosphatase 1 Ppz1p; involved in coenzyme
    A biosynthesis; subunit of the phosphopantothenoylcysteine decarboxylase (PPCDC;
    Cab3p, Sis2p, Vhs3p) complex and the CoA-Synthesizing Protein Complex (CoA-SPC:
    Cab2p, Cab3p, Cab4p, Cab5p, Sis2p and Vhs3p)'
  source_type: curated
  url: https://www.yeastgenome.org/locus/VHS3
  source_id: SGD:S000005580
- source: Alliance_Automated
  text: Enables identical protein binding activity and protein phosphatase inhibitor
    activity. Contributes to phosphopantothenoylcysteine decarboxylase activity. Involved
    in coenzyme A biosynthetic process and intracellular monoatomic cation homeostasis.
    Part of CoA-synthesizing protein complex and phosphopantothenoylcysteine decarboxylase
    complex. Used to study dilated cardiomyopathy. Orthologous to human PPCDC (phosphopantothenoylcysteine
    decarboxylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/VHS3
