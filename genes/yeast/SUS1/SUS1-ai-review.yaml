    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15311284
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06704
  review:
    summary: Interaction of Sus1 with Cdc31 (PMID:15311284).
    action: REMOVE
    reason: Generic protein binding is uninformative. The reported interaction is real (Sus1 binds Sac3
      and Cdc31 in TREX-2, Sgf11 in the SAGA DUB module, and co-purifies with SAGA/Tra1), but its functional
      meaning is already captured by the TREX-2, DUBm and SAGA complex annotations and by the deubiquitinase
      activator activity term. No more specific MF term describes Sus1's helical-hairpin wrapping of partner
      helices, so removal is the policy action; it does not mean the interaction is false.
