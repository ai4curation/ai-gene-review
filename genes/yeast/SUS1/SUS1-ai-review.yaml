id: Q6WNK7
gene_symbol: SUS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Sus1 (YBR111W-A) is a small (96 aa), noncatalytic, all-helical protein of the ENY2/Sus1 family
  that couples transcription with nuclear mRNA export by belonging to two complexes. In the SAGA
  and SLIK coactivators it is a subunit of the histone H2B deubiquitinating module
  (Ubp8-Sgf11-Sus1-Sgf73), where its articulated helical hairpin wraps the N-terminal helix of
  Sgf11 and clamps it onto the Ubp8 ZnF-UBP domain; all four subunits are required to form the
  active Ubp8 deubiquitinase, and loss of Sus1 raises H2B ubiquitination. In the nuclear
  pore-associated TREX-2 complex (Sac3-Thp1-Sem1-Cdc31-Sus1), two Sus1 chains and Cdc31 wrap the
  Sac3 CID helix; Sus1 is required to target TREX-2 to the nuclear basket, for poly(A)+ mRNA
  export, and for gene gating, the tethering of active GAL genes to nuclear pores. Sus1 occupies
  upstream activating sequences of many Pol II genes, travels with elongating Pol II, contributes
  to synthesis and stability of most transcripts, and is needed for induction and nucleosome
  eviction at cell wall stress-responsive genes. Separation-of-function alleles show that its SAGA
  and TREX-2 roles are mechanistically distinct. Loss of Sus1 also lengthens telomeres and raises
  H2BK123 monoubiquitination, consistent with Sus1 restraining telomere length through its roles
  in H2B deubiquitination and at the nuclear pore rather than by recruiting telomerase.
