- source: Alliance_Imported
  text: Global transcriptional regulator, component of SAGA, TREX-2 complexes; interacts
    with RNA polymerase II; involved in mRNA export coupled transcription activation
    and elongation; involved in post-transcriptional tethering of active genes to
    nuclear periphery and to non-nascent mRNP; plays role in negatively regulating
    telomere length through modulation of H2BK123 mono-ubiquitination and its interaction
    with nuclear pore complex
  source_type: curated
