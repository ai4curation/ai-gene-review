- source: Alliance_Automated
  text: Enables chromatin binding activity and enzyme activator activity. Involved
    in several processes, including RNA metabolic process; poly(A)+ mRNA export from
    nucleus; and post-transcriptional tethering of RNA polymerase II gene DNA at nuclear
    periphery. Located in nucleoplasm. Part of SLIK (SAGA-like) complex and nucleus.
    Is active in SAGA complex. Orthologous to human ENY2 (ENY2 transcription and export
    complex 2 subunit).
