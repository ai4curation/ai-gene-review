core_functions:
- description: >-
    Hst1 is the NAD-dependent histone deacetylase of the Sum1-Rfm1-Hst1
    transcriptional repressor. Sum1 specifies target loci and Rfm1 recruits Hst1,
    whose local deacetylation of promoter chromatin, predominantly H4K5, represses
    middle-sporulation and selected metabolic genes during vegetative growth.
  molecular_function:
    id: GO:0017136
    label: histone deacetylase activity, NAD-dependent
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0000118
    label: histone deacetylase complex
  supported_by:
  - reference_id: PMID:12612074
    supporting_text: Rfm1 interacts with both Sum1 and Hst1 and is required for the Sum1-Hst1 interaction.
    reference_section_type: ABSTRACT
  - reference_id: PMID:29066473
    supporting_text: Set1 appeared to promote the association of the sequence-specific DNA binding protein Sum1 and the HDAC Hst1 with middle sporulation genes to maintain deacetylation, primarily at H4K5, and gene repression.
    reference_section_type: ABSTRACT
proposed_new_terms:
- proposed_name: histone H4K5 deacetylase activity, NAD-dependent
  proposed_definition: >-
    Catalysis of the removal of an acetyl group from lysine 5 of histone H4 using
    NAD+ as a reactant, producing deacetylated histone, nicotinamide, and
    2'-O-acetyl-ADP-ribose.
  justification: >-
    Current GO has an H4K5-specific term for the hydrolytic mechanism and several
    residue-specific NAD-dependent histone deacetylase terms, but no NAD-dependent
    H4K5 child of GO:0017136. Hst1-specific experiments identify H4K5 as its main
    histone H4 target.
  proposed_parent:
    id: GO:0017136
    label: histone deacetylase activity, NAD-dependent
  supported_by:
  - reference_id: PMID:18990212
    supporting_text: This was consistent with the notion that H4 K5 was the main target
      of the histone deacetylase Hst1, whereas other histone H4 lysine residues were
      minor or no targets of Hst1.
    reference_section_type: RESULTS
- proposed_name: negative regulation of de novo NAD+ biosynthetic process
  proposed_definition: >-
    Any process that stops, prevents, or reduces the frequency, rate, or extent
    of de novo NAD+ biosynthesis.
  justification: >-
    GO contains NAD+ biosynthetic process terms but no term representing their
    negative regulation. Hst1 directly represses de novo NAD+ biosynthesis genes
    while leaving the salvage pathway unaffected.
  proposed_parent:
    id: GO:0048519
    label: negative regulation of biological process
  supported_by:
  - reference_id: PMID:12972620
    supporting_text: The NAD(+)-dependent deacetylase activity of Hst1p represses de
      novo NAD(+) biosynthesis genes in the absence of new protein synthesis, suggesting
      a direct effect.
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Which endogenous Hst1 target proteins, if any, are deacetylated outside
    chromatin, and do such substrates account for the secondary DNA-damage and
    recombination phenotypes assigned to the Sir2 family?
- question: >-
    How does the Sum1-Rfm1-Hst1 complex choose between middle-sporulation,
    NAD-biosynthesis, thiamine-biosynthesis, and replication-origin targets as
    nutrient state and intracellular NAD+ change?
suggested_experiments:
- hypothesis: >-
    H4K5 is the dominant physiological histone substrate of promoter-bound Hst1,
    whereas the H3K9, H3K14, and H4K16 residue-specific IBA assignments are not
    broadly applicable to native Hst1 targets.
  description: >-
    Combine acute Hst1 depletion with calibrated residue-specific histone
    acetylation profiling and Hst1/Sum1 ChIP-seq across vegetative, NAD-limited,
    and sporulation-inducing conditions, then test catalytic-dead Hst1 rescue at
    directly bound loci.
  experiment_type: acute depletion, quantitative histone acetyl-proteomics, and ChIP-seq
