id: P53685
gene_symbol: HST1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  HST1 encodes a nuclear NAD-dependent sirtuin deacetylase that is recruited by
  Sum1 and the tethering factor Rfm1 to selected chromosomal loci. Local histone
  deacetylation, prominently at H4K5, represses middle-sporulation and metabolic
  gene programs during vegetative growth and also supports efficient initiation
  at a subset of replication origins. Unlike its paralog Sir2, native Hst1 is a
  gene-specific chromatin regulator rather than a regional silencing factor at
  telomeres or silent mating-type loci.
