    reason: PMID:20439498 ties THI-gene regulation to the NAD-dependent Hst1 repression mechanism. A different
      target-gene set is part of this core promoter-regulatory activity, rather than intrinsically non-core
      because sporulation genes are also targets.
    supported_by:
    - reference_id: PMID:20439498
      supporting_text: We have determined that multiple thiamine ( THI ) genes in Saccharomyces cerevisiae
        are also regulated by the intracellular NAD + concentration via the NAD + -dependent histone deacetylase
        (HDAC) Hst1 and, to a lesser extent, Sir2.
      reference_section_type: ABSTRACT
core_functions:
- description: Hst1 uses NAD-dependent histone deacetylation in the Sum1-Rfm1-Hst1 repressor to suppress
    middle-sporulation and metabolic transcriptional programs. H4K5 predominates at tested targets,
    with H4K16 effects at selected replication origins; cofactor recruitment controls which loci are
    affected.
