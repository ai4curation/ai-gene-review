id: P53685
gene_symbol: HST1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: HST1 encodes a nuclear NAD-dependent sirtuin deacetylase recruited by Sum1 and Rfm1 to
  selected chromosomal loci. Histone deacetylation, prominently at H4K5 and in some contexts H4K16,
  represses middle-sporulation and metabolic gene programs during vegetative growth and supports efficient
  initiation at a subset of replication origins. Hst1 also associates with Set3C. Its usual targeting
  differs from Sir2, but altered targeting in a SUM1-1 background enables Hst1-dependent silencing
  at the HMR mating-type locus.
