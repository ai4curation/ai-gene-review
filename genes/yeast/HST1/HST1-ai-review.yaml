proposed_new_terms:
- proposed_name: histone H4K5 deacetylase activity, NAD-dependent
  proposed_definition: >-
    Catalysis of the removal of an acetyl group from lysine 5 of histone H4 using
    NAD+ as a reactant, producing deacetylated histone, nicotinamide, and
    2'-O-acetyl-ADP-ribose.
  justification: >-
    Current GO has an H4K5-specific term for the hydrolytic mechanism and several
    residue-specific NAD-dependent histone deacetylase terms, but no NAD-dependent
    H4K5 child of GO:0017136. Hst1-specific experiments identify H4K5 as its main
    histone H4 target.
  proposed_parent:
    id: GO:0017136
    label: histone deacetylase activity, NAD-dependent
  supported_by:
  - reference_id: PMID:18990212
    supporting_text: This was consistent with the notion that H4 K5 was the main target
      of the histone deacetylase Hst1, whereas other histone H4 lysine residues were
      minor or no targets of Hst1.
    reference_section_type: RESULTS
suggested_questions:
- question: Do native Hst1 complexes participate directly in DNA-damage response or DNA recombination
    control, and if so through chromatin or non-histone substrates?
- question: How does the Sum1-Rfm1-Hst1 complex choose between middle-sporulation, NAD-biosynthesis,
    thiamine-biosynthesis, and replication-origin targets as nutrient state and intracellular NAD+
    change?
suggested_experiments:
- hypothesis: Hst1 substrate use depends on locus, cofactors and physiological state; H4K5 predominates
    at many tested sites, H4K16 is supported at a subset, and H3K9/H3K14 activity requires a site-specific
    test.
  description: Combine acute Hst1 depletion with calibrated residue-specific histone acetylation profiling
    and Hst1/Sum1 ChIP-seq across vegetative, NAD-limited, and sporulation-inducing conditions, then
    test catalytic-dead Hst1 rescue at directly bound loci.
  experiment_type: acute depletion, quantitative histone acetyl-proteomics, and ChIP-seq
