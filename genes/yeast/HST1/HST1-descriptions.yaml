gene_symbol: HST1
organism: yeast
uniprot_id: P53685
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: NAD-dependent histone deacetylase involved in telomeric silencing. Histone
    deacetylase proteins act via the formation of large multiprotein complexes that
    are responsible for the deacetylation of lysine residues on the N-terminal part
    of the core histones (H2A, H2B, H3 and H4). Histone deacetylation gives a tag
    for epigenetic repression and plays an important role in transcriptional regulation,
    cell cycle progression and developmental events. Restores silencing at HMR in
    SIR2 mutants when overexpressed. Required to repress middle sporulation genes
    during vegetative growth. Acts as a sensor of NAD(+) levels and regulator of NAD(+)
    biosynthesis. Regulates the gene expression of de novo NAD(+) biosynthesis genes.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53685
  source_id: P53685
- source: Alliance_Imported
  text: NAD(+)-dependent histone deacetylase; essential subunit of the Sum1p/Rfm1p/Hst1p
    complex required for ORC-dependent silencing and meiotic repression; non-essential
    subunit of the Set3C deacetylase complex; involved in telomere maintenance; HST1
    has a paralog, SIR2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/HST1
  source_id: SGD:S000005429
- source: Alliance_Automated
  text: Enables histone deacetylase activity, NAD-dependent. Involved in several processes,
    including negative regulation of meiotic nuclear division; negative regulation
    of mitotic recombination; and silent mating-type cassette heterochromatin formation.
    Located in nucleus. Part of Set3 complex. Human ortholog(s) of this gene implicated
    in Huntington's disease. Orthologous to human SIRT1 (sirtuin 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HST1
  source_id: SGD:S000005429
