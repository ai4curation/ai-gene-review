gene_symbol: CHO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CHO1 (PSS1) encodes phosphatidylserine synthase (CDP-diacylglycerol--serine O-phosphatidyltransferase,
  EC 2.7.8.8) of Saccharomyces cerevisiae, a multi-pass membrane enzyme of the CDP-alcohol phosphatidyltransferase
  family. Using Mn2+ or Mg2+, it transfers the phosphatidyl group of CDP-diacylglycerol to L-serine, producing
  phosphatidylserine (PS) and CMP. Cho1 is the only source of PS in yeast; PS is decarboxylated to phosphatidylethanolamine
  by Psd1/Psd2 and then methylated to phosphatidylcholine, so Cho1 initiates the de novo (CDP-DAG) route
  to PE and PC. cho1 null mutants lack PS and require ethanolamine or choline (Kennedy pathway) for growth,
  and show mitochondrial and sporulation defects. Cho1 resides in the ER membrane, with activity also
  reported in mitochondria-associated membrane/outer mitochondrial membrane fractions. Its expression
  is repressed by inositol and choline through the Ino2/Ino4-Opi1 circuit. PS made by Cho1 is required
  for autophagosome biogenesis.
