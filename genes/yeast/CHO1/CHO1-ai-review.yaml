suggested_questions:
- question: Is the PS synthase activity found in mitochondrial fractions entirely due to MAM-resident
    Cho1, or does a pool reside in the outer mitochondrial membrane proper?
- question: Does Cho1 deficiency affect autophagy only through PS depletion, or also through altered PE/ethanolamine
    partitioning between Kennedy and CDP-DAG routes?
suggested_experiments:
- description: Rescue of cho1 autophagy defects by catalytically dead Cho1 versus exogenous lyso-PS supplementation,
    to test whether the autophagy phenotype is purely PS-dependent.
