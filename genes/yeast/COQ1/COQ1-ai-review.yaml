core_functions:
- description: 'Hexaprenyl diphosphate synthase: elongates an allylic prenyl diphosphate primer with isopentenyl
    diphosphate to the all-trans C30 hexaprenyl diphosphate that forms the side chain of coenzyme Q6. It is peripherally
    associated with the matrix face of the inner mitochondrial membrane, and its chain-length specificity sets the
    Q6 tail length.'
  molecular_function:
    id: GO:0036423
    label: hexaprenyl-diphosphate synthase ((2E,6E)-farnesyl-diphosphate specific) activity
  directly_involved_in:
  - id: GO:0006744
    label: ubiquinone biosynthetic process
  locations:
  - id: GO:0031314
    label: extrinsic component of mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:2198286
    supporting_text: The strain deficient in hexaprenyl pyrophosphate synthetase activity, C296-LH3, is complemented
      by the plasmid pG3/T1.
  - *id001
  - *id005
  - *id002
  - *id008
suggested_questions:
- question: 'What allylic primer does Coq1p use in vivo: (2E,6E)-farnesyl diphosphate from Erg20p, or geranylgeranyl
    diphosphate from Bts1p (as drawn in YeastPathways)?'
- question: Is S. cerevisiae Coq1p a homo-oligomer, or does it associate with an as-yet-unidentified partner analogous
    to S. pombe Dlp1 or human PDSS2?
suggested_experiments:
- hypothesis: Coq1p is a homo-oligomeric hexaprenyl diphosphate synthase that preferentially uses FPP as primer
  description: Purify recombinant mature Coq1p, determine its oligomeric state (SEC-MALS), and measure product chain
    length and kinetics with DMAPP, GPP, FPP and GGPP primers plus 14C-IPP.
  experiment_type: in vitro enzymology / biophysics
