id: P18900
gene_symbol: COQ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: COQ1 encodes the mitochondrial hexaprenyl diphosphate synthase of the FPP/GGPP synthase family (PTHR12001).
  It synthesises all-trans-hexaprenyl diphosphate (C30), the isoprenoid side chain of coenzyme Q6, by sequential
  head-to-tail condensation of isopentenyl diphosphate onto an allylic prenyl diphosphate primer, using the conserved
  aspartate-rich (DDxxD) motifs. Coq2p then transfers this chain to 4-hydroxybenzoate. Coq1p is a peripheral protein
  on the matrix side of the inner mitochondrial membrane. coq1 mutants lack hexaprenyl pyrophosphate synthetase
  activity and CoQ6 and are respiratory-deficient. Expressing heterologous prenyl diphosphate synthases of different
  chain-length specificity in a coq1 null strain yields Q5 to Q10, which are all functional to varying degrees,
  though Q6 is optimal. Loss of Coq1p, or of its lipid product, destabilises other Coq polypeptides (Coq3, Coq4,
  Coq6), and orthologous synthases restore their levels, consistent with a role for polyprenylated intermediates
  in assembling the CoQ biosynthetic complex. Unlike the heterotetrameric mammalian PDSS1/PDSS2 and S. pombe Dps1/Dlp1
  enzymes, no second subunit has been described for S. cerevisiae Coq1p.
existing_annotations:
- term:
    id: GO:0000010
    label: heptaprenyl diphosphate synthase activity
  evidence_type: IMP
  original_reference_id: PMID:9708911
  qualifier: enables
  review:
    summary: IMP from Okada et al. 1998, who used a coq1 mutant "defective for hexaprenyl diphosphate synthesis"
      as a host for heterologous prenyl diphosphate synthases (producing UQ-5 to UQ-10). The mutant phenotype supports
      a prenyl diphosphate synthase activity for Coq1p, but GO:0000010 heptaprenyl diphosphate synthase activity
      specifies a C35 product, and S. cerevisiae Coq1p makes the C30 hexaprenyl chain of CoQ6. The term was probably
      chosen via its synonym "trans-hexaprenyltranstransferase activity" (the old EC 2.5.1.30 name), which names
      a C35 product. The correct chain-length term is hexaprenyl diphosphate synthase.
    action: MODIFY
    reason: Coq1p synthesises hexaprenyl (C30), not heptaprenyl (C35), diphosphate; the native ubiquinone of S.
      cerevisiae is Q6. GO:0036423 is the hexaprenyl-diphosphate synthase term used for COQ1 in the ubiquinone module.
      Its FPP-primer specificity is the generally assumed one but has not been tested directly for yeast Coq1p.
    proposed_replacement_terms:
    - id: GO:0036423
      label: hexaprenyl-diphosphate synthase ((2E,6E)-farnesyl-diphosphate specific) activity
    supported_by:
    - &id005
      reference_id: PMID:9708911
      supporting_text: different types of prenyl diphosphate synthases were expressed in a S. cerevisiae COQ1 mutant
        defective for hexaprenyl diphosphate synthesis
    - &id006
      reference_id: PMID:9708911
      supporting_text: we found that the original species of UQ (in this case UQ-6) had maximum functionality
    - &id001
