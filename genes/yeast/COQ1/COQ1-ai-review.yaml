  review:
    summary: IBA part_of polyprenyl diphosphate synthase complex from PTN000243365. In mammals (PDSS1/PDSS2) and
      S. pombe (Dps1/Dlp1) the CoQ side-chain synthase is a heterotetramer of two related subunits, and the IBA
      is seeded from such heteromeric enzymes. S. cerevisiae Coq1p acts as the sole hexaprenyl diphosphate synthase,
      and no Dlp1/PDSS2-type partner subunit has been described; trans-prenyl diphosphate synthases are nevertheless
      obligate oligomers, so a (likely homomeric) complex is plausible. The GO term definition does not require
      heteromers. Kept as non-core pending direct evidence of yeast Coq1p quaternary structure.
    action: KEEP_AS_NON_CORE
