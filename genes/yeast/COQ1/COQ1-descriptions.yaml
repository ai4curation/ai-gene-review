descriptions:
- source: UniProt
  text: Assembly of polyisoprenoid side chains. The polyprenyl synthase of coenzyme
    Q biosynthesis catalyzes the formation from isopentenyl diphosphate of all trans-polyprenyl
    pyrophosphates generally ranging in length of between 6 and 10 isoprene units
    depending on the species.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P18900
  source_id: P18900
- source: Alliance_Imported
  text: Hexaprenyl pyrophosphate synthetase; catalyzes the first step in ubiquinone
    (coenzyme Q) biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/COQ1
  source_id: SGD:S000000207
- source: Alliance_Automated
  text: Enables heptaprenyl diphosphate synthase activity. Involved in ubiquinone
    biosynthetic process. Is extrinsic component of mitochondrial inner membrane.
    Is active in mitochondrion. Human ortholog(s) of this gene implicated in primary
    coenzyme Q10 deficiency 2. Orthologous to human PDSS1 (decaprenyl diphosphate
    synthase subunit 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/COQ1
  source_id: SGD:S000000207
