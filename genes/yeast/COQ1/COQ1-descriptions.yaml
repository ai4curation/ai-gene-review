  text: Assembly of polyisoprenoid side chains. The polyprenyl synthase of coenzyme
    Q biosynthesis catalyzes the formation from isopentenyl diphosphate of all trans-polyprenyl
    pyrophosphates generally ranging in length of between 6 and 10 isoprene units
    depending on the species.
