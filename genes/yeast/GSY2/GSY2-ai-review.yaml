id: P27472
gene_symbol: GSY2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GSY2 (YLR258W) encodes the major, nutrient-regulated glycogen synthase of Saccharomyces cerevisiae
  (EC 2.4.1.11), a GT3-family glucosyltransferase that elongates glycogenin-primed alpha-1,4-glucan chains
  by transferring glucose from UDP-glucose to non-reducing ends. Gsy2 accounts for about 90% of stationary-phase
  synthase activity; gsy1 gsy2 double mutants lack synthase activity and glycogen. The enzyme forms a
  homotetramer whose subunit interface is rearranged by the allosteric activator glucose 6-phosphate (sensed
  by Arg583/Arg587), and it is inactivated by phosphorylation, notably at Ser654 and Thr667 by the Pcl8/Pcl10-Pho85
  cyclin-dependent kinase and by PKA, under the opposing control of Snf1 and the Glc7 phosphatase. Several
  surface maltodextrin-binding sites anchor Gsy2 to glycogen and are required for efficient catalysis
  on glycogen. Gsy2 is cytosolic and concentrated on glycogen particles; in glycogen-free cells it can
  enter the nucleus.
