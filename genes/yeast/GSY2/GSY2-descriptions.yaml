    overall_notes: Correct generic glycogen synthase text, identical to GSY1. No regulation
      or major-isoform status.
- source: Alliance_Imported
  text: Glycogen synthase; expression induced by glucose limitation, nitrogen starvation,
    heat shock, and stationary phase; activity regulated by cAMP-dependent, Snf1p
    and Pho85p kinases as well as by the Gac1p-Glc7p phosphatase; GSY2 has a paralog,
    GSY1, that arose from the whole genome duplication; relocalizes from cytoplasm
    to plasma membrane upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GSY2
  source_id: SGD:S000004248
