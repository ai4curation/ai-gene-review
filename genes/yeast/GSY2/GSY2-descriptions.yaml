gene_symbol: GSY2
organism: yeast
uniprot_id: P27472
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Glycogen synthase participates in the glycogen biosynthetic process along
    with glycogenin and glycogen branching enzyme. Extends the primer composed of
    a few glucose units formed by glycogenin by adding new glucose units to it. In
    this context, glycogen synthase transfers the glycosyl residue from UDP-Glc to
    the non-reducing end of alpha-1,4-glucan.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P27472
  source_id: P27472
- source: Alliance_Imported
  text: Glycogen synthase; expression induced by glucose limitation, nitrogen starvation,
    heat shock, and stationary phase; activity regulated by cAMP-dependent, Snf1p
    and Pho85p kinases as well as by the Gac1p-Glc7p phosphatase; GSY2 has a paralog,
    GSY1, that arose from the whole genome duplication; relocalizes from cytoplasm
    to plasma membrane upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GSY2
  source_id: SGD:S000004248
- source: Alliance_Automated
  text: Enables alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity;
    glycogen binding activity; and identical protein binding activity. Involved in
    glycogen biosynthetic process. Located in glycogen granule. Human ortholog(s)
    of this gene implicated in cardiovascular system disease; glycogen storage disease;
    hyperinsulinism; liver glycogen storage disease; and muscle glycogen storage disease.
    Orthologous to human GYS1 (glycogen synthase 1) and GYS2 (glycogen synthase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GSY2
  source_id: SGD:S000004248
