descriptions:
- source: UniProt
  text: Glycogen synthase participates in the glycogen biosynthetic process along
    with glycogenin and glycogen branching enzyme. Extends the primer composed of
    a few glucose units formed by glycogenin by adding new glucose units to it. In
    this context, glycogen synthase transfers the glycosyl residue from UDP-Glc to
    the non-reducing end of alpha-1,4-glucan.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P27472
  source_id: P27472
