- source: Alliance_Automated
  text: Enables alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity;
    glycogen binding activity; and identical protein binding activity. Involved in
    glycogen biosynthetic process. Located in glycogen granule. Human ortholog(s)
    of this gene implicated in cardiovascular system disease; glycogen storage disease;
    hyperinsulinism; liver glycogen storage disease; and muscle glycogen storage disease.
    Orthologous to human GYS1 (glycogen synthase 1) and GYS2 (glycogen synthase 2).
  source_type: automated
