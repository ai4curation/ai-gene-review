descriptions:
- source: Alliance_Imported
  text: Glutamine synthetase (GS); synthesizes glutamine from glutamate and ammonia;
    with Glt1p, forms the secondary pathway for glutamate biosynthesis from ammonia;
    expression regulated by nitrogen source and by amino acid limitation; forms filaments
    of back-to-back stacks of cylindrical homo-decamers at low pH, leading to enzymatic
    inactivation and storage during states of advanced cellular starvation; relocalizes
    from nucleus to cytoplasmic foci upon DNA replication stress
  source_type: curated
