descriptions:
- source: Alliance_Imported
  text: Glutamine synthetase (GS); synthesizes glutamine from glutamate and ammonia;
    with Glt1p, forms the secondary pathway for glutamate biosynthesis from ammonia;
    expression regulated by nitrogen source and by amino acid limitation; forms filaments
    of back-to-back stacks of cylindrical homo-decamers at low pH, leading to enzymatic
    inactivation and storage during states of advanced cellular starvation; relocalizes
    from nucleus to cytoplasmic foci upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLN1
  source_id: SGD:S000006239
- source: Alliance_Automated
  text: Enables glutamine synthetase activity. Involved in L-glutamine biosynthetic
    process. Located in nuclear periphery. Human ortholog(s) of this gene implicated
    in Alzheimer's disease; Huntington's disease; congenital glutamine deficiency;
    developmental and epileptic encephalopathy 116; and heart disease. Orthologous
    to human GLUL (glutamate-ammonia ligase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLN1
  source_id: SGD:S000006239
