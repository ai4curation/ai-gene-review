  evidence_type: IDA
  original_reference_id: PMID:25817432
  qualifier: located_in
  review:
    summary: Under MMS-induced genotoxic stress a subset of Gln1 foci are intranuclear and co-localise
      with Cmr1 in the intranuclear quality-control compartment (INQ). The authors note Gln1 has no known
      genome-integrity role, so this likely reflects stress-induced sequestration.
    action: KEEP_AS_NON_CORE
    reason: Stress-conditional sequestration, not the site of glutamine synthesis.
    supported_by:
    - reference_id: PMID:25817432
      supporting_text: Some INQ localizing factors such as Gln1 and Dus3 have no reported link to maintenance
        of genome integrity.
- term:
    id: GO:0097054
    label: L-glutamate biosynthetic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-13
  review:
    summary: Inherited from the YeastPathways superpathway of glutamate biosynthesis (PWY3O-13). GS consumes
      L-glutamate and produces L-glutamine; new glutamate in the GS/GOGAT route is formed by glutamate
      synthase (GLT1). GS supplies the substrate for that step rather than synthesising glutamate.
    action: MARK_AS_OVER_ANNOTATED
    reason: Superpathway-inherited process; GLN1's own process is L-glutamine biosynthesis. Its role alongside
      GLT1 is ammonia assimilation, not glutamate formation per se.
