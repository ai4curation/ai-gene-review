description: Glutamine synthetase (glutamate--ammonia ligase, EC 6.3.1.2) of Saccharomyces cerevisiae,
  the sole glutamine synthetase of budding yeast. This cytosolic, oligomeric (type II, eukaryotic-type)
  enzyme ligates ammonium to L-glutamate with ATP hydrolysis to form L-glutamine, the only de novo route
  to glutamine and hence a central entry point of ammonium nitrogen into amide-nitrogen-requiring biosyntheses
  (purines, pyrimidines, amino sugars, asparagine and others). Together with glutamate synthase (GLT1)
  it forms an ammonia-assimilating GS/GOGAT cycle that in yeast is ancillary to NADP-glutamate dehydrogenase
  (GDH1) for glutamate formation. GLN1 transcription is subject to nitrogen catabolite control (increased
  on poor nitrogen sources such as glutamate) and to purine/general amino acid control. Under genotoxic
  or nutrient stress the protein can form cytoplasmic and some intranuclear foci.
