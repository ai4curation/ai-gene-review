gene_symbol: ATG1
organism: yeast
uniprot_id: P53104
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Serine/threonine protein kinase involved in the cytoplasm to vacuole transport
    (Cvt) and found to be essential in autophagy, where it is required for the formation
    of autophagosomes. Involved in the clearance of protein aggregates which cannot
    be efficiently cleared by the proteasome. Required for selective autophagic degradation
    of the nucleus (nucleophagy) as well as for mitophagy which contributes to regulate
    mitochondrial quantity and quality by eliminating the mitochondria to a basal
    level to fulfill cellular energy requirements and preventing excess ROS production
    (PubMed:18818209, PubMed:21576396, PubMed:22768199, PubMed:23230142). Also involved
    in endoplasmic reticulum-specific autophagic process, in selective removal of
    ER- associated degradation (ERAD) substrates (PubMed:21228276). Plays a key role
    in ATG9 and ATG23 cycling through the pre-autophagosomal structure and is necessary
    to promote ATG18 binding to ATG9 through phosphorylation of ATG9 (PubMed:14723849,
    PubMed:20855505, PubMed:24440502, PubMed:24905091). Catalyzes phosphorylation
    of ATG4, decreasing the interaction between ATG4 and ATG8 and impairing deconjugation
    of PE-conjugated forms of ATG8 (PubMed:28821724). Finally, ATG1 is also required
    for the maintenance of cell viability under starvation and for glycogen storage
    during stationary phase. Plays a role in genome stability through suppression
    of abnormal mitosis under starvation, and in regulation of filamentous growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53104
  source_id: P53104
- source: Alliance_Imported
  text: Protein serine/threonine kinase; required for vesicle formation in autophagy
    and the cytoplasm-to-vacuole targeting (Cvt) pathway; structurally required for
    phagophore assembly site formation; forms a complex with Atg13p and Atg17p during
    autophagy; required for re-phosphorylation of Atg13p during termination of autophagy,
    following prolonged nitrogen starvation; essential for cell cycle progression
    from G2/M to G1 under nitrogen starvation
  source_type: curated
  url: https://www.yeastgenome.org/locus/ATG1
  source_id: SGD:S000003148
- source: Alliance_Automated
  text: Enables protein serine kinase activity and protein serine/threonine kinase
    activity. Involved in several processes, including cellular response to potassium
    ion starvation; cytoplasm to vacuole targeting by the Cvt pathway; and macroautophagy.
    Located in several cellular components, including autophagosome membrane; phagophore;
    and vacuole-isolation membrane contact site. Part of Atg1/ULK1 kinase complex.
    Used to study triple-negative breast cancer. Orthologous to human ULK3 (unc-51
    like kinase 3).
  source_type: automated
