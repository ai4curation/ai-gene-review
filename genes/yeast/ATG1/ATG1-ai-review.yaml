core_functions:
- description: Catalytic subunit of the Atg1 kinase complex. Starvation-activated protein Ser/Thr kinase
    that acts at the phagophore assembly site to start autophagosome formation, phosphorylating core Atg
    proteins (Atg9, Atg4, Atg13). Established by in vitro kinase assays and substrate phosphorylation
    of S. cerevisiae Atg1.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
