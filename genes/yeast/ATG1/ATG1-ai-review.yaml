id: P53104
gene_symbol: ATG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ATG1 encodes the serine/threonine protein kinase Atg1 of budding yeast, the catalytic subunit
  of the Atg1 kinase complex (Atg1-Atg13-Atg17-Atg29-Atg31) that starts autophagosome formation. The 897-residue
  protein has an N-terminal protein kinase domain, a central region carrying an Atg8-interacting (AIM/LIR)
  motif, and C-terminal tandem MIT domains that bind Atg13. Under nutrient-rich conditions TORC1 and PKA
  keep the complex inactive. When nitrogen or other nutrients are limiting, dephosphorylated Atg13 bridges
  Atg1 to the Atg17 scaffold, kinase activity rises, and the complex assembles at the pre-autophagosomal
  structure (phagophore assembly site, PAS) next to the vacuole. There it tethers Atg9 vesicles and recruits
  downstream Atg proteins. Atg1 phosphorylates Atg9, which is needed to recruit Atg8 and Atg18 and to
  expand the isolation membrane. It also phosphorylates Atg4, which protects the Atg8-PE pool at the PAS,
  and it re-phosphorylates Atg13 to end autophagy during prolonged starvation. Atg1 also has kinase-independent
  scaffolding functions in autophagosome nucleation. Its AIM-mediated binding to Atg8 places it on the
  isolation membrane and autophagosome, where it promotes maturation and is itself delivered to the vacuole.
  Atg1 is needed for the constitutive cytoplasm-to-vacuole targeting (Cvt) pathway, for which its kinase
  activity is essential, and for bulk and selective forms of autophagy, including mitophagy, reticulophagy,
  piecemeal microautophagy of the nucleus and late nucleophagy. Loss of ATG1 lowers survival during starvation.
