  supported_by:
  - reference_id: PMID:24440502
    supporting_text: Whereas the wild-type protein was active, the kinase-dead Atg1 D211A mutant did not
      show in vitro autophosphorylation activity
  - reference_id: PMID:24440502
    supporting_text: The multimembrane-spanning protein Atg9 is a direct target of this kinase essential
      for autophagy.
  - reference_id: PMID:28821724
    supporting_text: Here we show that phosphorylation by Atg1 inhibits Atg4 function, an event that appears
      to exclusively occur at the site of autophagosome biogenesis.
  - reference_id: PMID:26753620
    supporting_text: We find that on assembly from its cytoplasmic subcomplexes, the Atg1-kinase complex
      becomes activated, enabling it to recruit and tether Atg9-vesicles.
  - reference_id: PMID:12589048
    supporting_text: we find that Apg1 kinase activity is required only for Cvt trafficking of aminopeptidase
      I but not for import via autophagy
- description: Binds the ubiquitin-like protein Atg8 through an AIM/LIR motif (aa 429-432). This targets
    Atg1 to the isolation membrane and autophagosome, where it promotes autophagosome maturation, and
    couples Atg1-Atg13 turnover to autophagic flux. Established by mutational analysis in S. cerevisiae.
  molecular_function:
    id: GO:0032182
    label: ubiquitin-like protein binding
  directly_involved_in:
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0061908
    label: phagophore
  - id: GO:0000421
    label: autophagosome membrane
  supported_by:
  - reference_id: PMID:22778255
    supporting_text: We find that Atg1 contains an AIM and directly interacts with Atg8.
  - reference_id: PMID:22778255
    supporting_text: We also show that mutations in the Atg1 AIM cause a significant defect in autophagy,
      without affecting the functions of Atg1 implicated in triggering autophagosome formation.
  - reference_id: PMID:22885598
    supporting_text: We identify Atg8 as a novel regulator of Atg1/ULK1, which directly binds Atg1/ULK1
      in a LC3-interaction region (LIR)-dependent manner.
  - reference_id: PMID:22885598
    supporting_text: Atg8 targets Atg1/ULK1 to autophagosomes, where it may promote autophagosome maturation
      and/or fusion with vacuoles/lysosomes.
suggested_questions:
- question: Which Atg1 functions in autophagosome nucleation are truly kinase-independent? Analog-sensitive
    Atg1 inhibition left autophagy-mediated import intact (PMID:12589048), but Atg9 phosphorylation by
    Atg1 is reported as essential for autophagy (PMID:24440502).
- question: GO has no term for binding to Atg8-family proteins, so ubiquitin-like protein binding (GO:0032182)
    is used for LIR/AIM-mediated Atg8 binding. Would an 'Atg8-family protein binding' term be useful for
    the many LIR-containing autophagy proteins?
suggested_experiments:
- description: Use phospho-null and phosphomimetic alleles of the full set of in vivo Atg1 sites on Atg9,
    Atg4 and Atg13 in one strain, with analog-sensitive Atg1, to divide the Atg1-dependent steps of autophagosome
    formation into those that need catalysis and those that need only the scaffold.
