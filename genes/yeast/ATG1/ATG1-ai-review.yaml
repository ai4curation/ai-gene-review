  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The CC FUNCTION roles in Cvt, bulk autophagy, mitophagy, nucleophagy, ER-phagy, Atg9
      and Atg4 phosphorylation agree with the review. The two late claims were checked. Glycogen
      storage in stationary phase is an indirect consequence of autophagy; autophagy-defective mutants
      synthesise glycogen but cannot maintain it (PMID:11486014). The filamentous-growth role rests on
      overexpression of autophagy genes inhibiting filamentous growth (PMID:17700056, title only, not
      cached). Both are recorded in the notes as peripheral and not annotated.
