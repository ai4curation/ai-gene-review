    overall_notes: 'Hedged and dated: glucanases possibly act in growth, mating and
      sporulation; hydrolyses 1,3- and 1,6-linkages, possible transglycosylase. Does
      not call Exg1 the major secreted exo-1,3-beta-glucanase.'
