descriptions:
- source: UniProt
  text: Glucanases possibly play a role in cell expansion during growth, in cell-cell
    fusion during mating, and in spore release during sporulation. This enzyme hydrolyzes
    both 1,3-beta- and 1,6-beta- linkages and even has beta-glucosidase activity.
    It could also function biosynthetically as a transglycosylase.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23776
