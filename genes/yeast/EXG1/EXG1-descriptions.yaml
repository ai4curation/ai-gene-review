gene_symbol: EXG1
organism: yeast
uniprot_id: P23776
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Glucanases possibly play a role in cell expansion during growth, in cell-cell
    fusion during mating, and in spore release during sporulation. This enzyme hydrolyzes
    both 1,3-beta- and 1,6-beta- linkages and even has beta-glucosidase activity.
    It could also function biosynthetically as a transglycosylase.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23776
  source_id: P23776
- source: Alliance_Imported
  text: Major exo-1,3-beta-glucanase of the cell wall; involved in cell wall beta-glucan
    assembly; exists as three differentially glycosylated isoenzymes; EXG1 has a paralog,
    SPR1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/EXG1
  source_id: SGD:S000004291
- source: Alliance_Automated
  text: Enables glucan endo-1,6-beta-glucosidase activity and glucan exo-1,3-beta-glucosidase
    activity. Involved in glucan metabolic process. Located in fungal-type cell wall.
  source_type: automated
  url: https://www.yeastgenome.org/locus/EXG1
  source_id: SGD:S000004291
fetch_date: '2026-11-01'
