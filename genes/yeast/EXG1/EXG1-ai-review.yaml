id: P23776
gene_symbol: EXG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  EXG1 encodes the major secreted and soluble-cell-wall
  glucan 1,3-beta-glucosidase of Saccharomyces cerevisiae. The mature
  glycoprotein is processed for secretion, localizes to the extracellular
  region and fungal-type cell wall, hydrolyzes beta-1,3-glucans from their
  nonreducing ends with additional beta-1,6-linked substrate activity in vitro,
  and participates in fungal-type cell-wall beta-glucan metabolism.
