      Full text verifies the high-throughput SWAT localization workflow, but the
      EXG1 vacuole assignment is in supplementary data not present in the cache.
- id: PMID:41439696
  title: Structural Analysis of Laminarin-Derived Oligosaccharides Produced by Transglycosylation
    of Exo-β-1,3-glucanase ScEXG1 from Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Recombinant His-tagged ScEXG1 hydrolyzes beta-1,3 glucan and can
      transglycosylate laminaribiose into beta-1,6-containing tri- and
      tetrasaccharides under low-enzyme in vitro conditions.
    supporting_text: >-
      Exo-β-1,3-glucanase EXG1 (ScEXG1) from Saccharomyces cerevisiae
      hydrolyzes β-1,3-glucans and exhibits transglycosylation activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Newer full text directly characterizes ScEXG1 hydrolysis and
      transglycosylation products, but does not by itself establish that the
      transglycosylation side activity is a normal in vivo GO function.
