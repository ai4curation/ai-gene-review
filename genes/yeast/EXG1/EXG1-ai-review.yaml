- id: PMID:11471729
  title: Characterization of recombinant yeast exo-beta-1,3-glucanase (Exg 1p) expressed
    in Escherichia coli cells.
  findings:
  - statement: >-
      Recombinant EXG1 expressed in E. coli has exo-beta-1,3-glucanase activity
      with broad activity toward beta-1,3, beta-1,6, and other beta-glucosidic
      substrates.
    supporting_text: >-
      Yeast exo-beta-1,3-glucanase gene (EXG1) was expressed in Escherichia
      coli and the recombinant enzyme (Exg1p) was characterized.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache, but the abstract directly supports recombinant Exg1
      exo-beta-1,3-glucanase activity and a broad in vitro substrate profile.
- id: PMID:19129178
  title: Phospholipid transfer protein Sec14 is required for trafficking from endosomes
    and regulates distinct trans-Golgi export pathways.
  findings:
  - statement: >-
      Exg1 remains secreted from sec14(ts) cells and is detected by mass
      spectrometry among proteins secreted into the culture medium.
    supporting_text: >-
      Identity was determined by mass spectrometry and included Hsp150, Cts1,
      Scw4, Scw10, Exg1, Cis3, and Ygp1, proteins known to be secreted by
      S. cerevisiae
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text supports the extracellular-region row by directly identifying
      Exg1 in secreted medium proteins; the paper's main focus is Sec14 pathway
      specificity rather than EXG1 function.
- id: PMID:26928762
  title: 'One library to make them all: streamlining the creation of yeast libraries
    via a SWAp-Tag strategy.'
  findings:
  - statement: >-
      The SWAT paper describes manual localization assignment of validated
      tagged endomembrane proteins, but the cached full text does not expose the
      EXG1 supplementary localization row.
    supporting_text: >-
      Images of all clones were reviewed manually, and up to three
