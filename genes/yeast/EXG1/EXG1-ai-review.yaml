    label: fungal-type vacuole
  evidence_type: HDA
  original_reference_id: PMID:26928762
  qualifier: located_in
  review:
    summary: >-
      The SWAT N-terminal GFP screen reported a vacuole localization for EXG1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The SWAT paper made validated N-terminal GFP and signal-peptide GFP
      libraries and manually assigned localization classes, including vacuole,
      but the cached full text does not expose the supplementary EXG1 row needed
      to verify whether EXG1 was observed in the vacuole lumen or membrane.
      Mature Exg1 has a cleaved signal peptide plus direct secreted and
      cell-wall evidence, so this high-throughput tag call should not be treated
      as a core site of Exg1 action.
    supported_by:
    - reference_id: PMID:26928762
      supporting_text: >-
        Images of all clones were reviewed manually, and up to three
        localizations were assigned to each clone.
