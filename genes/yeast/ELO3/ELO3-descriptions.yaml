- source: Alliance_Automated
  text: Enables fatty acid elongase activity. Involved in late endosome to vacuole
    transport via multivesicular body sorting pathway; lipid biosynthetic process;
    and post-Golgi vesicle-mediated transport. Located in endoplasmic reticulum membrane.
    Human ortholog(s) of this gene implicated in Stargardt disease 3; autosomal dominant
    cerebellar ataxia (multiple); corneal dystrophy; ichthyosis; and intellectual
    disability. Orthologous to several human genes including ELOVL1 (ELOVL fatty acid
    elongase 1); ELOVL3 (ELOVL fatty acid elongase 3); and ELOVL4 (ELOVL fatty acid
    elongase 4).
