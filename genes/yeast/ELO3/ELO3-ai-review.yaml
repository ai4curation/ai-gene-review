taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Fatty acid elongase 3 (Elo3/Sur4/Sre1/Apa1/Vbm1) is a multi-pass endoplasmic reticulum membrane 3-keto-acyl-CoA
  synthase of the ELO family that catalyses the condensation of an acyl-CoA with malonyl-CoA, the first, rate-limiting
  reaction of the ER fatty acid elongation cycle. Elo3 forms elongase III, which extends C18-C24 acyl-CoAs and is
  required for the final C24 to C26 step that produces the C26:0 VLCFA characteristic of yeast ceramide; Ifa38,
  Phs1 and Tsc13 complete each cycle and Tsc13 co-immunoprecipitates with Elo3. Its active site faces the cytosol
  and chain length is determined by a lysine near the luminal end of transmembrane helix 6. Elo3 is partially redundant
  with Elo2 (double mutant inviable). elo3 mutants accumulate C24 VLCFAs, phytosphingosine and inositol phosphorylceramide
  with little mannosylated sphingolipid, and show pleiotropic membrane phenotypes (plasma membrane H+-ATPase, secretion,
  endosomal traffic).
