suggested_questions:
- question: Is the C24 to C26 step strictly Elo3-specific in vivo, or can elevated Elo2 levels partially supply
    C26 VLCFA?
- question: Which elo3/sur4 phenotypes (Pma1 activity, endosomal traffic) are caused by loss of C26 sphingolipids
    per se rather than accumulation of long-chain bases?
suggested_experiments:
- hypothesis: Elo3 is the sole yeast enzyme able to condense C24-CoA.
  description: Measure C24-CoA condensation in microsomes from elo3 and elo2 elo3 (rescued by a regulatable ELO3
    allele) strains, and in proteoliposomes containing purified Elo2 versus Elo3.
