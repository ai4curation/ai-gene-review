core_functions:
- description: 'Condensing enzyme (3-keto-acyl-CoA synthase) of the ER VLCFA elongation cycle: condenses C18-C24
    acyl-CoAs (elongase III), including the C24 to C26 step with malonyl-CoA; works with Ifa38, Phs1 and Tsc13 to
    add two carbons per cycle.'
