  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      Rank 2 (score 9.44), absent from GOA. The Tec1p-Ste12p-Dig1p complex is a DNA-binding transcription
      factor assembly of the filamentation and mating pathways. TOR1 is a 2470-residue PI3K-family
      protein kinase and is not a component of any transcription factor complex; it acts on transcription
      indirectly, through Tap42 and Sch9. Asserting complex membership is a category error, not a
      near miss.
    supported_by:
