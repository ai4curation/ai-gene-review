    summary: >-
      Top-ranked hit (score 9.70), absent from GOA, which holds fungal-type vacuole membrane with
      HDA and IDA support. TORC1 is anchored at the vacuolar membrane and TOR signalling governs autophagy
      and vacuolar function, so an effect on vacuole organization is not implausible - but the score
      sits inside the band where nothing was correct in the other cohort, and the four calls below
      it are unambiguously wrong, so this call carries no credibility from its position. Cannot be
      validated or refuted.
