    summary: >-
      Rank 3 (score 9.25), absent from GOA. The Gin4 complex is a septin-associated bud-neck kinase
      assembly; TOR1 is not part of it and does not localize to the bud neck. Scored MORE_SPECIFIC
      against GOA's cytoplasm, so closure would credit it. Together with rank 2 this is the whole
      failure mode in miniature: the model has identified 'yeast protein kinase or signalling protein'
      and is drawing complexes from that pool at random, which is why all four calls below rank 1
      are complexes or compartments and none is an activity.
