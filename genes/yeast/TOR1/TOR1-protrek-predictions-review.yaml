description: >-
  ProTrek sequence-to-text retrieval for yeast TOR1. The top-1 score is 9.70, the second lowest in
  ARGO139 - below BRCA2 at 9.85 and above only LRRK2 at 9.38 - and the whole top five spans 0.55 units,
  from 9.70 to 9.15. TOR1 at 2470 residues fits the pattern identified for BRCA2: very large multi-domain
  proteins with no single dominant repeat type score far below long proteins built from many copies
  of one domain. None of the curated core functions appears: protein serine/threonine kinase activity
  (IDA, IBA), ATP binding, and TORC1 complex binding are absent, as are GOA's TORC1 complex (IPI)
  and TOR signaling (IMP). What comes back instead are four yeast complexes and compartments belonging
  to other pathways - a transcription factor complex, a septin-associated kinase complex, and two
  mating projection compartments. Those last two are the fourth appearance of the pheromone and mating
  attractor in this yeast batch, after CDC37 (ranks 2 to 5), RAS2 (ranks 2 to 4) and SSA1 (rank 4).
  Taken with the sub-10 abstention band identified in the other cohort, where nothing scoring below
  10 was correct, this is what the model emits when it has nothing: not noise, but the organism's
  annotation prior. Assessment: 1 uncertain, 2 nonparalog incorrect. Assessment: 1 uncertain (UNC),
  2 nonparalog incorrect (NPI).
