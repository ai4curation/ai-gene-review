id: P32356
gene_symbol: NTH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NTH1 encodes the cytosolic neutral trehalase of Saccharomyces cerevisiae, a glycosyl hydrolase
  family 37 enzyme (EC 3.2.1.28) that hydrolyses intracellular alpha,alpha-trehalose into two glucose
  molecules, mobilising trehalose stores accumulated during stationary phase, nutrient limitation and
  stress. Nth1 is a monomer with a disordered N-terminal regulatory segment, a calcium-binding EF-hand-like
  domain and a catalytic (alpha/alpha)6 barrel. It is activated by Ca2+ and, more potently, by PKA phosphorylation
  of N-terminal sites (Ser60, Ser83) followed by binding of the 14-3-3 proteins Bmh1/Bmh2, which stabilises
  the active-site configuration. NTH1 is induced by heat and other stresses; nth1 mutants accumulate more
  trehalose and are impaired in recovery from heat shock, and trehalase activity influences long-term
  desiccation tolerance by degrading the protective trehalose pool.
