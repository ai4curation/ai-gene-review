gene_symbol: NTH1
organism: yeast
uniprot_id: P32356
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Hydrolyzes intracellular trehalose to glucose (Probable) (PubMed:22320399,
    PubMed:29087344). The disaccharide trehalose serves as a storage carbohydrate
    that is mobilized during nutrient stress (Probable). Regulates the level of trehalose
    as a protectant for cell integrity during heat stress (PubMed:7730323, PubMed:7883049).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32356
  source_id: P32356
- source: Alliance_Imported
  text: Neutral trehalase, degrades trehalose; required for thermotolerance and may
    mediate resistance to other cellular stresses; phosphorylated and activated by
    Cdc28p at the G1/S phase transition to coordinately regulate carbohydrate metabolism
    and the cell cycle; inhibited by Dcs1p; NTH1 has a paralog, NTH2, that arose from
    the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/NTH1
  source_id: SGD:S000002408
- source: Alliance_Automated
  text: Enables alpha,alpha-trehalase activity. Involved in cellular response to desiccation
    and trehalose catabolic process. Located in cytoplasm. Human ortholog(s) of this
    gene implicated in diarrhea. Orthologous to human TREH (trehalase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NTH1
  source_id: SGD:S000002408
fetch_date: '2026-11-01'
