descriptions:
- source: UniProt
  text: Hydrolyzes intracellular trehalose to glucose (Probable) (PubMed:22320399,
    PubMed:29087344). The disaccharide trehalose serves as a storage carbohydrate
    that is mobilized during nutrient stress (Probable). Regulates the level of trehalose
    as a protectant for cell integrity during heat stress (PubMed:7730323, PubMed:7883049).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32356
