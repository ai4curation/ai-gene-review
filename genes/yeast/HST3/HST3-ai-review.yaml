- term:
    id: GO:0070403
    label: NAD+ binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: HST3 is an NAD-dependent deacetylase and must bind NAD+ cofactor. UniProt
      documents multiple NAD+-binding residues (positions 60-79, 151-154, 282-284,
      312-314, 333) in the characteristic sirtuin NAD+ binding domain. The inference
      from InterPro IPR003000 (sirtuin domain) is appropriate. This is a required
      cofactor binding activity.
    action: ACCEPT
    reason: Essential cofactor binding for catalytic activity. HST3 catalytic mechanism
      absolutely requires NAD+ binding. The annotation is correctly inferred from
      the sirtuin domain structure.
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003000
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: RCA
  original_reference_id: PMID:30358795
  review:
    summary: Zinc ion binding is specifically documented by UniProt with four coordinating
      residues identified through structure. The cached PMID:30358795 record is an
      abstract-only, proteome-wide yeast zinc survey, so the support for this RCA
      row is SGD review and UniProt's structural/cofactor annotation rather than
      explicit HST3 evidence in the cached abstract. This is equivalent to the retired
      metal ion binding annotation but more specific.
    action: ACCEPT
    reason: Specific instance of the broader metal ion binding annotation. Zinc is
      specifically required for sirtuin catalytic activity and is supported by curated
      SGD reviewed computational analysis together with UniProt feature annotation.
  qualifier: enables
