    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: UniProtKB subcellular location states "Cytoplasm. Nucleus." HST3 is documented
      in both compartments, though primary function is nuclear. Cytoplasmic localization
      is less characterized but appears to be a minor component of HST3 localization.
    action: KEEP_AS_NON_CORE
    reason: HST3 has documented cytoplasmic localization in UniProt, but its characterized
      functions (H3K56 deacetylation, transcription regulation, DNA repair) are nuclear.
      Cytoplasmic localization may represent transit or peripheral functions.
  qualifier: located_in
