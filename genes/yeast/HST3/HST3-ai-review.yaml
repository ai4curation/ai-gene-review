    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: HST3 localizes to the nucleus where it functions as a histone deacetylase.
      UniProt subcellular localization states both cytoplasm and nucleus. This IBA
      annotation is supported by phylogenetic inference from orthologs. IC evidence
      from PMID:12242223 also confirms nuclear localization, which is essential for
      its function in histone deacetylation and transcriptional regulation.
    action: ACCEPT
    reason: HST3 is a nuclear protein required for histone H3K56 deacetylation during
      S/G2 phase transitions (PMID:17977840). IBA annotation is well-supported by
      orthologous relationships across sirtuins and confirmed experimentally.
    supported_by:
    - reference_id: PMID:12242223
      supporting_text: Furthermore, Hst3 was physically present at 2mu ARS in a silencing
        context as well as at the endogenous 2mu plasmid
