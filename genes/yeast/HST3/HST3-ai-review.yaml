product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: NAD-dependent histone deacetylase HST3, a member of the sirtuin family.
  Catalyzes deacetylation of histone H3 lysine 56 (H3K56), a critical residue in nucleosome
  assembly during DNA replication and repair. Functions redundantly with HST4 in regulating
  transcription, sister chromatid recombination, DNA damage checkpoint control, and
  genome stability.
core_functions:
- molecular_function:
    id: GO:0140765
    label: histone H3K56 deacetylase activity, NAD-dependent
  description: NAD-dependent deacetylation of histone H3 lysine 56, catalyzed during
    S/G2 phase transition. Essential NAD-dependent H3K56 deacetylase required for
    cell cycle checkpoint control and proper nucleosome reassembly after DNA replication.
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  - id: GO:1990414
    label: replication-born double-strand break repair via sister chromatid exchange
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:17977840
    supporting_text: Hst3 has NAD-dependent histone deacetylase activity in vitro
      and that it functions during S phase to deacetylate the core domain of histone
      H3 at lysine 56 (H3K56)
  - reference_id: PMID:39746969
    supporting_text: H3K56ac removal after S phase facilitates chromatin maturation
      and genome stability
