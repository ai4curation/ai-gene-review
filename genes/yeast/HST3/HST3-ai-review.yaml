- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IDA
  original_reference_id: PMID:31167142
  review:
    summary: IDA evidence from PMID:31167142 shows comprehensive transcriptomic analysis
      demonstrating HST3 directly regulates transcription. Using NET-seq (native elongating
      transcript sequencing), the authors show that loss of Hst3 and Hst4 leads to
      global increases in nascent transcription at ~1,000 genes. This is direct measurement
      of transcription dynamics, not merely inference. Highly specific to H3K56-mediated
      regulation.
    action: MODIFY
    reason: 'Robust experimental evidence supports transcriptional repression: NET-seq
      shows increased nascent transcription when HST3/HST4 are lost. The parent DNA-templated
      transcription term should be replaced by the more precise negative regulation
      term.'
    proposed_replacement_terms:
    - id: GO:0045892
      label: negative regulation of DNA-templated transcription
    supported_by:
    - reference_id: PMID:31167142
      supporting_text: Loss of Hst3 and Hst4 led to a global shift in the nascent
        RNA transcriptome, with an average fold increase of ~1.4
  qualifier: involved_in
- term:
    id: GO:0009299
    label: mRNA transcription
  evidence_type: IDA
  original_reference_id: PMID:31167142
  review:
    summary: 'PMID:31167142 demonstrates that HST3 negatively regulates RNA polymerase
      II mRNA transcription: metagene analysis shows higher nascent transcript levels
      throughout genic regions, especially near transcription start sites, when HST3/HST4
      activity is lost.'
    action: MODIFY
    reason: Direct NET-seq evidence shows mRNA-coding regions are specifically affected,
      but the direction is repressive rather than neutral participation in mRNA transcription.
      The annotation should therefore use a negative regulation child term consistent
      with the GO:0006351 reviews from the same paper.
    proposed_replacement_terms:
    - id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    supported_by:
    - reference_id: PMID:31167142
      supporting_text: Metagene plots of mean nascent transcript levels, representative
        genome browser views of NET-seq data, and a heatmap of the log2-fold change
        between the hst4Δ HST3-FRB mutant and WT confirmed higher levels of transcription
        throughout genic regions
  qualifier: involved_in
- term:
    id: GO:1990414
    label: replication-born double-strand break repair via sister chromatid exchange
  evidence_type: IMP
  original_reference_id: PMID:23357952
  review:
    summary: PMID:23357952 provides comprehensive evidence that HST3 is required for
      sister chromatid recombination (SCR) of replication-born double-strand breaks.
      The authors identify hst3 among 12 mutants consistently impaired in SCR using
      physical assay of recombination. Loss of HST3 (and HST4) severely impairs the
      ability to repair DSBs with the sister chromatid, with 50-fold decrease in intrachromosomal
      SCR. This is a major genome stability function dependent on H3K56 acetylation
      state.
    action: ACCEPT
    reason: HST3 is a critical factor for proper DSB repair template choice (sister
      chromatid preference). Loss results in genome instability and increased recombination
      with homologs instead of sister chromatids. Core function in genome stability.
    supported_by:
    - reference_id: PMID:23357952
      supporting_text: The hst3Δ mutation is strongly affected in intrachromosomal
        SCR repeat recombination (50-fold decrease)
  qualifier: involved_in
- term:
    id: GO:0046459
    label: short-chain fatty acid metabolic process
  evidence_type: IMP
  original_reference_id: PMID:12618394
  review:
    summary: PMID:12618394 shows that growth on short-chain fatty acids (acetate,
      propionate) is severely impaired in quintuple sir2 hst1 hst2 hst3 hst4 mutant
      strain, with HST3 and HST4 identified as most important for growth on these
      substrates. However, this is not the primary function of HST3. The mechanism
      appears to involve SIR2 family proteins controlling acetyl-CoA synthetase (Acs)
      enzyme activity, suggesting an indirect metabolic role rather than direct involvement
      in lipid metabolism.
    action: MARK_AS_OVER_ANNOTATED
    reason: While HST3 contributes to growth on short-chain fatty acids through its
      requirement for Acs activity regulation, this is not a primary enzymatic function.
      HST3 is a histone deacetylase whose role in fatty acid metabolism is indirect,
      mediated through NAD-dependent regulation of Acs protein acetylation. The annotation
      overstates HST3s direct involvement in metabolic process. Better annotated as
      a regulatory cofactor effect than a metabolic process function.
    additional_reference_ids:
    - PMID:12618394
    supported_by:
    - reference_id: PMID:12618394
      supporting_text: Growth of a quintuple sir2 hst1 hst2 hst3 hst4 mutant strain
        of the yeast Saccharomyces cerevisiae on acetate or propionate was severely
        impaired. The data suggest that the Hst3 and Hst4 proteins are the most important
        for allowing growth on these short-chain fatty acids.
  qualifier: involved_in
