- term:
    id: GO:0031509
    label: subtelomeric heterochromatin formation
  evidence_type: IGI
  original_reference_id: PMID:7498786
  review:
    summary: PMID:7498786 shows that hst3 hst4 double mutants are defective in telomeric
      silencing, establishing that HST3 and HST4 contribute together to subtelomeric
      silencing. IGI (Inferred from Genetic Interaction) is appropriate evidence code,
      using HST4 as the interacting gene. This demonstrates HST3 function in telomeric
      silencing, but it is not the primary biochemical role.
    action: KEEP_AS_NON_CORE
    reason: Experimental evidence demonstrates HST3 requirement for subtelomeric silencing.
      The function is well-characterized even if redundant with HST4, but is best
      kept as a chromatin-silencing process downstream of H3K56 deacetylation rather
      than elevated as a core HST3 activity.
    supported_by:
