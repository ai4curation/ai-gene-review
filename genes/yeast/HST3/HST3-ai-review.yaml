- term:
    id: GO:0000183
    label: rDNA heterochromatin formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: This live PTHR11085 PAINT row asserts rDNA heterochromatin formation
      for HST3, but the current PTN000119247 assertion is seeded by the S. cerevisiae
      paralog HST2 and an S. pombe Sir2-family source. Cached HST3 literature supports
      H3K56 deacetylation, telomeric silencing, 2-micron plasmid silencing, and transcriptional
      homeostasis, not HST3-specific rDNA heterochromatin formation.
    action: REMOVE
    reason: Do not propagate this rDNA-specific Sir2-family/Hst2 chromatin-silencing
      assertion to HST3. HST3's direct characterized role is NAD-dependent H3K56
      deacetylation, while the PAINT node crosses a paralog/context boundary for
      this process term.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000119247
        source_label: PANTHER:PTN000119247
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node is seeded by PomBase:SPCC132.02 and SGD:S000005936, which
          is S. cerevisiae HST2 rather than HST3. Those sources may support rDNA
          heterochromatin for the source proteins, but not transfer of this rDNA-specific
          Hst2/Sir2-family silencing role to HST3.
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000119247
  - PomBase:SPCC132.02
  - SGD:S000005936
- term:
    id: GO:0000781
    label: chromosome, telomeric region
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  review:
    summary: This is a localization annotation indicating HST3 associates with telomeric
      regions of chromosomes. Evidence shows HST3 and HST4 contribute to telomeric
      silencing (PMID:7498786), but this is inferred primarily from functional effects
      rather than direct localization studies. The IEA inference from GO:0031509 (subtelomeric
      heterochromatin formation) is logically sound.
    action: KEEP_AS_NON_CORE
    reason: HST3 function at telomeric regions is secondary to its core H3K56 deacetylase
      activity. The localization annotation is supported by functional genomics (silencing
      phenotypes) but this is not a primary function description. Better captured
      under heterochromatin formation processes.
  qualifier: located_in
  supporting_entities:
  - GO:0031509
