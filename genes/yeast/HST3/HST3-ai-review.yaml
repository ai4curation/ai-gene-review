      subcellular location vocabulary explicitly states HST3 is localized to nucleus
      and cytoplasm. This IEA annotation from UniProt is consistent with the IBA annotation.
    action: ACCEPT
    reason: Redundant but valid annotation. Multiple evidence types (IEA from subcellular
