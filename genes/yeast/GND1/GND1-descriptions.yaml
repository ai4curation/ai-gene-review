descriptions:
- source: UniProt
  text: Catalyzes the oxidative decarboxylation of 6-phosphogluconate to ribulose
    5-phosphate and CO(2), with concomitant reduction of NADP to NADPH.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38720
  source_id: P38720
- source: Alliance_Imported
  text: 6-phosphogluconate dehydrogenase (decarboxylating); catalyzes an NADPH regenerating
    reaction in the pentose phosphate pathway; required for growth on D-glucono-delta-lactone
    and adaptation to oxidative stress; GND1 has a paralog, GND2, that arose from
    the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GND1
  source_id: SGD:S000001226
- source: Alliance_Automated
  text: Enables phosphogluconate dehydrogenase (decarboxylating) activity. Involved
    in cellular response to oxidative stress and pentose-phosphate shunt, oxidative
    branch. Located in mitochondrion. Orthologous to human PGD (phosphogluconate dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GND1
  source_id: SGD:S000001226
