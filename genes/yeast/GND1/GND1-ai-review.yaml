suggested_questions:
- question: Do Gnd1p and Gnd2p differ in kinetic properties or regulation (e.g. NADPH inhibition) that
    would explain retention of both paralogs after the whole-genome duplication?
suggested_experiments:
- description: Purify Gnd2p and compare its kinetics with Gnd1p; measure 6PGD activity and NADPH/NADP+
    ratios in gnd1, gnd2 and gnd1 gnd2 strains under oxidative stress.
