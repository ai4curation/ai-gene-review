  label: Saccharomyces cerevisiae S288C
description: 'GND1 encodes the major cytosolic 6-phosphogluconate dehydrogenase (decarboxylating; EC 1.1.1.44)
  of S. cerevisiae, which catalyses the third and last step of the oxidative pentose phosphate pathway:
  NADP+-dependent oxidative decarboxylation of 6-phospho-D-gluconate to D-ribulose 5-phosphate and CO2.
  The reaction is a major source of cytosolic NADPH for reductive biosynthesis and antioxidant systems
  and supplies pentose phosphates for nucleotide and aromatic amino-acid synthesis. Gnd1p is a highly
  abundant homodimer (about 10^5 molecules per cell) and accounts for roughly 80% of cellular 6-phosphogluconate
  dehydrogenase activity; the paralog GND2 encodes a minor isoenzyme. GND1 is induced, together with 6-phosphogluconolactonase
  and gluconokinase, during growth on glucono-delta-lactone, and gnd1 mutants cannot grow on this carbon
  source.'
