  original_reference_id: PMID:9888818
  qualifier: involved_in
  review:
    summary: The cited paper (Jeong et al. 1999) characterises 'type II TPx', a 176-residue protein with
      catalytic Cys62/Cys120 that has no substantial homology to TPx I; that description matches AHP1
      (176 aa, Prx5 family), not TSA2 (196 aa, 86% identical to TSA1). The antioxidant IMP experiment
      in the abstract (E. coli overexpression, Cys62 mutant) is therefore about AHP1. UniProt cites this
      paper for the TSA2 alias 'TPx type Ib', so the full text mentions TSA2, but we cannot see whether
      any TSA2 mutant was assayed. The biological claim is true for TSA2 from other papers (PMID:15210711),
      but this specific evidence line cannot be verified.
    action: UNDECIDED
    supported_by:
    - reference_id: PMID:9888818
      supporting_text: Comparison of the predicted sequence of 176 amino acids of type II TPx with that
        of the 195 residues of TPx, now renamed type I TPx
