id: Q04120
gene_symbol: TSA2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Peroxiredoxin TSA2 (cytoplasmic thiol peroxidase II, cTPx II) is a typical 2-Cys peroxiredoxin
  of the

  AhpC/Prx1 subfamily in Saccharomyces cerevisiae, 86% identical to the major cytosolic peroxiredoxin

  TSA1. It reduces hydrogen peroxide, peroxynitrite and organic hydroperoxides using electrons from

  thioredoxin: the peroxidatic Cys47 is oxidised to a sulfenic acid that forms an intersubunit disulfide

  with the resolving cysteine of the partner subunit, which is then reduced by thioredoxin. Unlike TSA1,

  TSA2 is expressed at low levels in unstressed cells and is strongly induced by peroxides; it is a key

  defence against organic hydroperoxides (tsa2 deletion cells are sensitive to tert-butyl hydroperoxide).

  TSA2 is cytosolic, and in vivo and in vitro it co-assembles with TSA1 into hetero-oligomeric decamers,

  substoichiometric TSA2 stabilising the decameric state. Like TSA1, it can shift under oxidative or heat

  stress to high-molecular-weight complexes with molecular chaperone (holdase) activity.'
