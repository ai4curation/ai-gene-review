descriptions:
- source: UniProt
  text: Thiol-specific peroxidase that catalyzes the reduction of hydrogen peroxide
    and organic hydroperoxides to water and alcohols, respectively. Plays a role in
    cell protection against oxidative stress by detoxifying peroxides and as sensor
    of hydrogen peroxide-mediated signaling events (PubMed:10681558, PubMed:11741925,
    PubMed:15210711). Can act alternatively as peroxidase and molecular chaperone.
    Oxidative stress and heat shock exposure cause a reversible shift of the protein
    structure from low MW species to high MW complexes, triggering a peroxidase-to-chaperone
    functional switch. The chaperone function of the protein enhances resistance to
    heat shock (PubMed:15163410).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04120
  source_id: Q04120
- source: Alliance_Imported
  text: Stress inducible cytoplasmic thioredoxin peroxidase; cooperates with Tsa1p
    in the removal of reactive oxygen, nitrogen and sulfur species using thioredoxin
    as hydrogen donor; deletion enhances the mutator phenotype of tsa1 mutants; protein
    abundance increases in response to DNA replication stress; TSA2 has a paralog,
    TSA1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TSA2
  source_id: SGD:S000002861
- source: Alliance_Automated
  text: Enables thioredoxin-dependent peroxiredoxin activity. Involved in several
    processes, including cell redox homeostasis; protein complex oligomerization;
    and protein stabilization. Located in cytoplasm. Human ortholog(s) of this gene
    implicated in autosomal recessive spinocerebellar ataxia 32; corneal endothelial
    dystrophy; and methylmalonic aciduria and homocystinuria type cblC. Orthologous
    to several human genes including PRDX1 (peroxiredoxin 1) and PRDX2 (peroxiredoxin
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TSA2
  source_id: SGD:S000002861
