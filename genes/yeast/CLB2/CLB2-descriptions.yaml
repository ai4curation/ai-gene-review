- source: Alliance_Imported
  text: B-type cyclin involved in cell cycle progression; also involved in response
    to DNA damage; activates Cdc28p to promote the transition from G2 to M phase;
    accumulates during G2 and M, then targeted via a destruction box motif for ubiquitin-mediated
    degradation by the proteasome; CLB2 has a paralog, CLB1, that arose from the whole
    genome duplication
