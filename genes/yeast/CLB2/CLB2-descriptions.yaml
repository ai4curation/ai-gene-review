  text: Enables cyclin-dependent protein serine/threonine kinase regulator activity.
    Involved in DNA damage response; G2/M transition of mitotic cell cycle; and regulation
    of cell cycle process. Located in several cellular components, including cellular
    bud neck; microtubule cytoskeleton; and nucleus. Human ortholog(s) of this gene
    implicated in breast cancer and prostate cancer. Orthologous to several human
    genes including CCNB1 (cyclin B1) and CCNB2 (cyclin B2).
