gene_symbol: CLB2
organism: yeast
uniprot_id: P24869
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Essential for the control of the cell cycle at the G2/M (mitosis) transition.
    Interacts with the CDC2 protein kinase to form MPF. G2/M cyclins accumulate steadily
    during G2 and are abruptly destroyed at mitosis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P24869
  source_id: P24869
- source: Alliance_Imported
  text: B-type cyclin involved in cell cycle progression; also involved in response
    to DNA damage; activates Cdc28p to promote the transition from G2 to M phase;
    accumulates during G2 and M, then targeted via a destruction box motif for ubiquitin-mediated
    degradation by the proteasome; CLB2 has a paralog, CLB1, that arose from the whole
    genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/CLB2
  source_id: SGD:S000006323
- source: Alliance_Automated
  text: Enables cyclin-dependent protein serine/threonine kinase regulator activity.
    Involved in DNA damage response; G2/M transition of mitotic cell cycle; and regulation
    of cell cycle process. Located in several cellular components, including cellular
    bud neck; microtubule cytoskeleton; and nucleus. Human ortholog(s) of this gene
    implicated in breast cancer and prostate cancer. Orthologous to several human
    genes including CCNB1 (cyclin B1) and CCNB2 (cyclin B2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CLB2
  source_id: SGD:S000006323
