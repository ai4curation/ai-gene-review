  review:
    summary: 'Grandin & Reed profiled expression and Cdc28-associated kinase activity of all four Clbs: Clb2 is
      expressed and activates Cdc28 from late S phase to mitosis, is the primary mitotic cyclin, and is dispensable
      for (and undetectable in) meiosis.'
    action: ACCEPT
    reason: Direct biochemical timing of Clb2-Cdc28 kinase activity plus deletion phenotypes support the G2/M transition
      as the core process; the same paper shows Clb2 has no meiotic role, which sharpens the annotation to the mitotic
      cell cycle.
    supported_by:
