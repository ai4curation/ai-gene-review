id: P24869
gene_symbol: CLB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Clb2 is the principal mitotic B-type cyclin (cyclin A/B subfamily) of the budding yeast Saccharomyces
  cerevisiae and the regulatory subunit of the cyclin-dependent kinase Cdc28 (Cdk1). Clb2 has no catalytic activity
  of its own: by binding Cdc28 it forms the Clb2-Cdc28-Cks1 holoenzyme, induces the active kinase conformation and
  confers substrate preference and subcellular targeting on the kinase. CLB2 is transcribed from late S phase as
  part of the Mcm1-Fkh2-Ndd1-dependent CLB2 cluster (with positive feedback through Clb2-Cdc28 phosphorylation of
  Ndd1 and Fkh2), so Clb2-Cdc28 activity rises through G2 and supplies the bulk of the M-phase CDK activity that
  drives the G2/M transition. Its outputs include separation of the duplicated spindle pole bodies and bipolar spindle
  assembly (via phosphorylation of the kinesin-5 motors Kip1 and Cin8), promotion of anaphase spindle elongation
  through Net1 phosphorylation and Cdc14 release (FEAR pathway), the switch from polarized to isotropic bud growth,
  inhibition of the G1 transcriptional program, retention of phosphorylated Cdc6 in a licensing-incompetent complex
  to prevent re-replication, and, at DNA double-strand breaks, local Cdk1 activity toward Fun30 and checkpoint proteins.
  Clb2-Cdc28 is held in check by Swe1-mediated inhibitory phosphorylation of Cdc28 Tyr19 (reversed by Mih1), by
  the stoichiometric inhibitor Sic1 and by the GSK-3 kinase Mck1; Clb2 is destroyed by APC/C-Cdc20 from anaphase
  and by APC/C-Cdh1 (Hct1) for mitotic exit and through G1, and its levels are minimal in G1 and undetectable during
  meiosis. The protein is primarily nuclear (bipartite NLS, importin-dependent) but shuttles via a leucine-rich
  NES and is also found on the mitotic spindle, at spindle pole bodies and, uniquely among the Clbs, at the mother-bud
  neck through Bud3-dependent targeting. CLB1 is a close paralog with partially redundant function; clb1 clb2 double
  mutants are inviable and arrest in G2/M.'
