  review:
    summary: 'IBA propagation of G1/S transition from the deep cyclin node PTN000019791, which spans G1/S cyclins
      (cyclin E/A/D, Cln/Clb5-type) and mitotic B-type cyclins. Clb2 is the late-S/G2/M cyclin of budding yeast:
      its transcription (CLB2 cluster, Mcm1-Fkh2-Ndd1) starts in late S phase, it is absent in G1, and G1/S commitment
      is executed by Cln1-3 and Clb5/6-Cdc28.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Clb2-Cdc28 acts at G2/M, not G1/S. Grandin & Reed show Clb1/Clb2 are expressed and activate Cdc28 only
      from late S phase up to mitosis, and Clb2-Cdc28 actually antagonises the G1 program (SBF inhibition) and holds
      Cdc6 in a licensing-incompetent complex. The G1/S function belongs to other members of the ancestral cyclin
      node and has functionally diverged from the B-type mitotic cyclins, so the propagated term overstates Clb2's
      role (same call as the human CCNB1 and fission-yeast cdc13 reviews).
    supported_by:
    - reference_id: PMID:8455600
      supporting_text: Clb1 and Clb2 were expressed and activated p34cdc28 later in the mitotic cell cycle, starting
        in late S phase and continuing up to mitosis.
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000019791
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral cyclin node grouping G1/S cyclins with mitotic A/B cyclins; the G1/S-transition function
          is inherited by the G1/S cyclins (e.g. Clb5, cyclin E/A), not by the mitotic B-type cyclin Clb2.
- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:1849457
  qualifier: involved_in
  review:
    summary: 'Founding genetic evidence: CLB2 was cloned as a high-copy suppressor of the mitosis-defective (but
      Start-competent) cdc28-1N allele; clb1 clb2 double disruption is lethal with a mitotic defect, and cdc28-1N
      clb2 is inviable, placing Clb2-Cdc28 at the G2/M transition. This is the defining function of the gene.'
    action: ACCEPT
    reason: Clb2 is the principal mitotic B-type cyclin; the Clb2-Cdc28 holoenzyme supplies the M-phase CDK activity
      whose rise commits the cell to mitosis (the definition of GO:0000086). Genetic (this paper), biochemical (Clb2-associated
      H1 kinase peaking at G2/M) and localization data all converge on this core role.
    supported_by:
    - reference_id: PMID:1849457
      supporting_text: Neither CLB1 nor CLB2 is essential; however, disruption of both is lethal and causes a mitotic
        defect.
      reference_section_type: ABSTRACT
    - reference_id: PMID:1849457
      supporting_text: the double mutant cdc28-1N clb2::LEU2 is nonviable, whereas cdc28-4 clb2::LEU2 is viable,
        suggesting that the cdc28-1N protein may be defective in its interaction with B-type cyclins.
      reference_section_type: ABSTRACT
- term:
