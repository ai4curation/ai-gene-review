  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000808767
  - PomBase:SPAPB2B4.03
  review:
    summary: IBA to passage through Start (G1/S commitment) from node PTN000808767, whose only experimental donor
      is fission-yeast cdc13. In S. pombe that annotation rests on the engineered situation in which Cdc13-Cdc2
      is the sole cyclin-CDK and can drive G1/S; in budding yeast Start is executed by Cln3 then Cln1/2-Cdc28 with
      SBF/MBF, Clb2 is not present in G1 (CLB2-cluster transcription begins in late S), and Clb2-Cdc28 in fact inhibits
      SBF and holds Cdc6 inactive.
    action: MARK_AS_OVER_ANNOTATED
    reason: The native Clb2 function is at G2/M; there is no evidence Clb2 participates in the G1 CDK-transcription
      positive-feedback loop that defines GO:0007089, and the G1/S row (GO:0000082) is graded the same way. The
      fission-yeast cdc13 review in this repository also marks the source annotation as over-annotated for the endogenous
      protein.
    supported_by:
    - reference_id: PMID:8455600
      supporting_text: Clb1 and Clb2 were expressed and activated p34cdc28 later in the mitotic cell cycle, starting
        in late S phase and continuing up to mitosis.
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN000808767
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node seeded only by S. pombe cdc13, whose Start annotation reflects an engineered single-cyclin
          cell; in wild-type budding yeast the Start function is carried by the Cln cyclins and Clb2 is absent in
          G1.
- term:
    id: GO:0010696
    label: positive regulation of mitotic spindle pole body separation
  evidence_type: IGI
  original_reference_id: PMID:1387566
  qualifier: involved_in
  supporting_entities:
  - SGD:S000002314
  review:
    summary: 'IGI with CLB1: Fitch et al. built all clb deletion combinations; every lethal combination included
      clb2, and conditional clb mutants arrested as large-budded G2 cells whose SPBs had duplicated but not separated,
      with no spindle. Clb2-Cdc28 later shown to phosphorylate the kinesin-5 motors Kip1/Cin8 that drive SPB separation,
      giving a direct mechanism.'
    action: ACCEPT
    reason: Genetic requirement for Clb/Cdc28 in SPB separation and spindle formation, with Clb2 the key contributor,
      and a direct substrate (Kip1 phosphosites required for SPB separation) reported subsequently. This is a core
      mitotic output of the Clb2-Cdc28 kinase; the IGI partner is a redundant B-type cyclin.
    supported_by:
    - reference_id: PMID:1387566
      supporting_text: All lethal combinations included the clb2 deletion, whereas the clb1 clb3 clb4 triple mutant
        was viable, suggesting a key role for CLB2.
      reference_section_type: ABSTRACT
    - reference_id: PMID:1387566
      supporting_text: Electron microscopy showed that the spindle pole bodies had duplicated but not separated,
        and no spindle had formed. This suggests that the Clb/Cdc28 kinase may have a relatively direct role in
        spindle formation.
      reference_section_type: ABSTRACT
