  evidence_type: IPI
  original_reference_id: PMID:22918234
  qualifier: enables
  supporting_entities:
  - SGD:S000005251
  review:
    summary: Co-immunoprecipitation of Clb2 with the GSK-3 kinase Mck1; Mck1 binds Clb2 (not Cdk1) and inhibits
      Clb2-Cdk1 kinase activity in vitro without phosphorylating Clb2, acting as a post-nuclear-division inhibitor
      of the mitotic kinase. Because the partner is a protein kinase and the binding is the proposed inhibitory
      mechanism, protein kinase binding is a more informative term than bare protein binding.
    action: MODIFY
    reason: 'The paper supports an informative molecular-function refinement: Clb2 directly binds the Mck1 protein
      kinase, and this binding (rather than phosphorylation) is the likely route by which Mck1 dampens Clb2-Cdk1
      activity at the end of mitosis. GO:0019901 protein kinase binding captures this; GO:0005515 does not.'
    proposed_replacement_terms:
    - id: GO:0019901
      label: protein kinase binding
    supported_by:
    - reference_id: PMID:22918234
      supporting_text: We observe a direct interaction between Mck1 and Clb2 but not Cdk1 (data not shown); therefore,
        it is most plausible that Mck1 inhibits Clb2-Cdk1 activity through binding of Clb2.
      reference_section_type: DISCUSSION
    - reference_id: PMID:22918234
      supporting_text: Clb2-HA was present in the Mck1-Myc IPs but not in the IP from an untagged strain
      reference_section_type: RESULTS
