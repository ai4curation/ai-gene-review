proposed_new_terms: []
suggested_questions:
- question: Which Clb2-Cdc28 substrates strictly require the bud-neck (Bud3-targeted) or SPB pools of Clb2 rather
    than the nuclear pool, and does the neck pool have a genuine cytokinesis role or only a timing effect?
- question: What does the Nap1-Clb2 interaction do mechanistically (adaptor, chaperone, or substrate presentation),
    given that Nap1 binds Clb2 but not Clb3 and is required for full Clb2 function in bud morphogenesis?
- question: Is the recruitment of Clb2-Cdk1 to double-strand breaks a dedicated, regulated DNA-damage function or
    a consequence of general chromatin association of active mitotic CDK, and which checkpoint substrates besides
    Fun30 depend specifically on Clb2?
suggested_experiments:
- description: Combine analog-sensitive cdc28-as1 with auxin-degron Clb2 (and Clb1) and quantitative phosphoproteomics
    across a synchronous G2/M window to define the Clb2-specific Cdc28 substrate set versus Clb1/Clb3/Clb5 complexes,
    using Clb2 hydrophobic-patch and N260/K270 mutants to separate docking-dependent targets.
- description: Use endogenously tagged Clb2 localization-signal mutants (NLS, NES, residues 213-255) with live imaging
    of spindle elongation, Cdc14 release and cytokinesis to assign each localized Clb2 pool to specific mitotic
    outputs.
