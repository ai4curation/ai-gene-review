- description: As the regulatory subunit of Cdc28, confers mitotic substrate specificity and subcellular targeting
    on the kinase (Swe1, Ndd1/Fkh2, Net1, Cdc6, kinesin-5 motors), directing phosphorylation events in the nucleus
    and on the spindle that promote anaphase spindle elongation via Cdc14 release and maintain the mitotic state
    until APC/C-dependent Clb2 destruction.
