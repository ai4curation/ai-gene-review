- term:
    id: GO:0032888
    label: regulation of mitotic spindle elongation
  evidence_type: IMP
  original_reference_id: PMID:23468650
  qualifier: involved_in
  review:
    summary: 'Liang et al.: overexpressed CLB2 in swe1Δ cells (hyperactive mitotic CDK) causes premature anaphase
      spindle elongation, suppressed by FEAR mutants (net1-6Cdk, spo12Δ) and cdc14-1; earlier work showed clb1Δ
      clb2 cells fail to elongate the spindle. Mitotic Clb2-Cdk1 thus promotes spindle elongation by phosphorylating
      Net1 to release Cdc14, which reverses inhibitory S-phase-CDK phosphorylation (e.g. Spc110).'
    action: MODIFY
    reason: The direction of the effect is unambiguous and mechanistically explained (Clb2-Cdk1 activates the FEAR
      pathway); the more specific child term positive regulation of mitotic spindle elongation (GO:1902846) should
      be used. Clb2-Cdk1 does part of the work (Net1 phosphorylation), so this passes the participation test.
    proposed_replacement_terms:
    - id: GO:1902846
      label: positive regulation of mitotic spindle elongation
    supported_by:
    - reference_id: PMID:23468650
      supporting_text: In contrast, mitotic CDK promotes spindle elongation by activating Cdc14 phosphatase, which
        reverses the protein phosphorylation imposed by S-phase CDK.
      reference_section_type: ABSTRACT
    - reference_id: PMID:23468650
      supporting_text: Here we show evidence indicating that overexpression of mitotic cyclin CLB2 induces premature
        spindle elongation in swe1Δ mutant cells.
      reference_section_type: INTRODUCTION
    - reference_id: PMID:23468650
      supporting_text: Previous work validates the role of mitotic CDK in spindle elongation, as cells lacking both
        Clb1 and Clb2 fail to elongate the spindle.
      reference_section_type: DISCUSSION
