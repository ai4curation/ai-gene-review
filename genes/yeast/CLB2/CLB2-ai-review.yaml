  title: Deep research report for CLB2 (falcon provider)
  findings: []
core_functions:
- description: Binds and activates the Cdc28 (Cdk1) serine/threonine protein kinase, forming the Clb2-Cdc28 mitotic
    CDK holoenzyme whose rising activity in G2 drives the G2/M transition, separation of duplicated spindle pole
    bodies and bipolar spindle assembly.
  supported_by:
  - reference_id: PMID:8455600
    supporting_text: Clb1 and Clb2 were expressed and activated p34cdc28 later in the mitotic cell cycle, starting
      in late S phase and continuing up to mitosis.
    reference_section_type: ABSTRACT
  - reference_id: PMID:1849457
    supporting_text: Neither CLB1 nor CLB2 is essential; however, disruption of both is lethal and causes a mitotic
      defect.
    reference_section_type: ABSTRACT
  - reference_id: PMID:1387566
    supporting_text: Electron microscopy showed that the spindle pole bodies had duplicated but not separated, and
      no spindle had formed. This suggests that the Clb/Cdc28 kinase may have a relatively direct role in spindle
      formation.
    reference_section_type: ABSTRACT
  - reference_id: file:yeast/CLB2/CLB2-deep-research-falcon.md
    supporting_text: Clb2 is not itself an enzyme. Its primary function is to bind, activate, spatially direct,
      and confer substrate preference on the serine/threonine kinase Cdc28/Cdk1.
  molecular_function:
