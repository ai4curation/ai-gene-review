  review:
    summary: IPI from the Gavin et al. 2006 TAP-MS screen detecting Ade16-Ade17 (or, for Ade17, Sol1) association.
      Ade16 and Ade17 are 84% identical paralogous isozymes that form homodimers, so a paralog heteromer is plausible,
      but 'protein binding' conveys nothing about function and no role for the heteromer is known. Removal does
      not imply the interaction is false.
    action: REMOVE
