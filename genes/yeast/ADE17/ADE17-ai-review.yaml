id: P38009
gene_symbol: ADE17
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ade17 (YMR120C) is the major of two paralogous bifunctional AICAR transformylase/IMP cyclohydrolase
  isozymes (with Ade16) of Saccharomyces cerevisiae. It transfers a formyl group from 10-formyltetrahydrofolate
  to AICAR (EC 2.1.2.3) and cyclises the product FAICAR to IMP (EC 3.5.4.10), the final two steps of de novo IMP
  synthesis, and also recycles AICAR released by histidine biosynthesis. Ade17 forms homodimers, is cytosolic and,
  like the other ADE genes, is repressed by adenine through Bas1/Bas2; ade16 ade17 double mutants require adenine
  and histidine.
