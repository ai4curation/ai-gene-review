descriptions:
- source: UniProt
  text: Bifunctional enzyme that catalyzes the last two steps of purine biosynthesis
    (PubMed:10877846, PubMed:9143321). Acts as a transformylase that incorporates
    a formyl group to the AMP analog AICAR (5-amino-1-(5-phospho-beta-D-ribosyl)imidazole-4-carboxamide)
    to produce the intermediate formyl-AICAR (FAICAR) (PubMed:10877846, PubMed:9143321).
    Also catalyzes the cyclization of FAICAR to IMP (PubMed:10877846, PubMed:9143321).
  source_type: curated
