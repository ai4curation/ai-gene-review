  - UniProtKB:P27515
  review:
    summary: IntAct IPI from Gavin et al. 2006 proteome survey PMID:16429126 (affinity purification) recording an
      interaction between Fur1 and Urk1 (uridine kinase, P27515). This Fur1-Urk1 pair recurs in four independent
      high-throughput datasets, so it is probably a genuine association of the two salvage enzymes (Urk1 carries
      a C-terminal UPRTase-like domain), but 'protein binding' conveys nothing about Fur1 function and no functional
      consequence has been shown.
    action: REMOVE
    reason: Uninformative protein binding term; removal does not mean the interaction is false. The reproducible
      Fur1-Urk1 association is noted for curators but defines no molecular function.
