suggested_questions:
- question: Does the reproducible Fur1-Urk1 physical association (four HTP datasets) reflect a salvage metabolon
    or regulation of Fur1 by the UPRT-like C-terminal domain of Urk1?
suggested_experiments:
- hypothesis: Urk1 binding modulates Fur1 UPRTase activity
  description: Reconstitute purified Fur1 with full-length Urk1 or its UPRT-like C-terminal domain and measure UPRTase
    kinetics and GTP/UTP regulation; test co-immunoprecipitation in uracil-induced cells.
  experiment_type: biochemistry
