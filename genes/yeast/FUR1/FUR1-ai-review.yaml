gene_symbol: FUR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FUR1 (YHR128W) encodes uracil phosphoribosyltransferase (UPRTase, EC 2.4.2.9), the cytoplasmic salvage
  enzyme that condenses uracil with PRPP to form UMP and diphosphate. It is the only route by which S. cerevisiae
  uses exogenous or recycled uracil (including uracil produced from cytosine by Fcy1 and from uridine/cytidine by
  Urh1), and it activates 5-fluorouracil and 5-fluorocytosine to toxic nucleotides, so fur1 mutants are 5-FU resistant.
  FUR1 transcription and UPRTase activity are induced by uracil, and the enzyme is subject to nucleotide feedback
  (the fur1-5 R134S allele alters UTP regulation); by similarity to other UPRTases it binds Mg-PRPP and is allosterically
  activated by GTP.
