id: P00546
gene_symbol: CDC28
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: CDC28 encodes Cdk1, the single essential cyclin-dependent serine/threonine protein kinase
  of the budding yeast Saccharomyces cerevisiae and the catalytic engine of its cell division cycle. The
  298-residue protein is catalytically inert on its own and becomes active only in a holoenzyme with one
  of nine cyclins (the G1 cyclins Cln1, Cln2 and Cln3, and the B-type cyclins Clb1-6) together with the
  small phospho-adaptor subunit Cks1; activation also requires phosphorylation of Thr169 in the T-loop
  by the CDK-activating kinase Cak1. Its activity is restrained by Swe1-mediated phosphorylation of Tyr19
  (reversed by the Mih1 phosphatase), which enforces the morphogenesis checkpoint, and by the stoichiometric
  inhibitors Sic1 (B-type cyclin complexes) and Far1 (G1 cyclin complexes during mating-pheromone arrest).
  Cyclin identity retargets the kinase through docking motifs (LP motifs for Cln1/2, RxL and NLxxxL for
  Clb5/6, LxF for Clb2) so that the same catalytic subunit phosphorylates stage-specific sets of S/T-P
  substrates, with Cks1 enabling processive multisite phosphorylation. Cln3-Cdc28 and then Cln1/2-Cdc28
  execute Start, the G1/S commitment, by hyperphosphorylating the SBF inhibitor Whi5 and the CKI Sic1
  (freeing Clb5/6-Cdc28) and by silencing pheromone signalling through Ste5 phosphorylation; Clb5/6-Cdc28
  triggers replication-origin firing and blocks re-licensing; Clb3/4- and Clb1/2-Cdc28 drive spindle pole
  body separation, spindle assembly, chromosome segregation and mitotic entry, and keep APC/C-Cdh1 inhibited
  until cyclin destruction, Cdc14-mediated dephosphorylation and Sic1 re-accumulation reset the cell to
  G1. Through hundreds of substrates it also couples the cycle to bud emergence and polarized growth,
  septin and actomyosin-ring assembly, membrane trafficking, histone-gene and basal transcription, telomerase
  recruitment, cohesion establishment, DNA double-strand-break resection and repair-pathway choice, and
  carbon-store mobilisation, and it drives premeiotic DNA replication, meiotic recombination initiation
  and the meiotic divisions. Cdc28 is distributed between the cytoplasm and nucleus in a cell-cycle-regulated
  manner, with additional pools at spindle pole bodies, cytoplasmic-microtubule plus ends and the bud
  neck.
