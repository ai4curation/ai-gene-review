  review:
    summary: Cdc28 is the budding-yeast Cdk1; with the G1 cyclins Cln1-3 it executes Start, the commitment
      step of the G1/S transition, by phosphorylating Whi5 and the CKI Sic1 and by triggering the SBF/MBF
      transcriptional program. The PAINT node is seeded by pombe cdc2, C. albicans CDC28 and Cdc28 itself,
      which carries direct experimental support.
    action: ACCEPT
    reason: Core cell-cycle function of the single essential CDK; the target's own IDA (PMID:2142620)
      and the classical Start phenotype of cdc28-ts alleles (PMID:7002718) ground the IBD, and inheritance
      of G1/S control across the Cdk1 clade is phylogenetically sound.
    supported_by:
    - reference_id: PMID:2142620
      supporting_text: Cln proteins are an essential component of the active protein kinase complex required
        for the G1 to S transition
      reference_section_type: ABSTRACT
    - reference_id: PMID:7002718
      supporting_text: Each mutation produces stage-specific arrest of cell division at start, the same
        point where mating pheromone interrupts division.
      reference_section_type: ABSTRACT
