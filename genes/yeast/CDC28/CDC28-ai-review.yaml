  qualifier: involved_in
  review:
    summary: Moll et al. showed that CDC28-dependent phosphorylation of three serines in/near the Swi5
      NLS keeps Swi5 cytoplasmic in S/G2/M; mutation of these serines gives constitutive nuclear entry.
      Cdc28 thus prevents, rather than promotes, Swi5-dependent transcription (e.g. of HO) until it is
      inactivated at mitotic exit.
    action: MODIFY
    reason: The direct finding is negative control of Swi5 nuclear import by Cdc28 phosphorylation; a
      'positive regulation of transcription' reading is not supported by the abstract's mechanism (Cdc28
      inactivation, not activity, permits Swi5 nuclear entry). The most accurate term for what Cdc28 does
      here is negative regulation of protein import into nucleus. The curator may have had full-text data
      in view; if so the term direction should be re-checked against it.
