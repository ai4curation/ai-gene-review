- id: file:yeast/CDC28/CDC28-deep-research-falcon.md
  title: Falcon deep research for CDC28
  findings:
  - statement: Cdc28 is the single catalytic CDK subunit that, by exchanging cyclin partners and using
      docking motifs and Cks1 priming, triggers Start, replication, spindle assembly, chromosome segregation
      and mitotic exit.
    supporting_text: Cdc28 is the central catalytic engine of the budding-yeast division cycle. By changing
      cyclin partners and exploiting cyclin-docking motifs, Cks1-dependent phospho-priming, localization,
      and kinase/phosphatase feedback, the same catalytic subunit triggers Start, DNA replication, spindle
      assembly, chromosome segregation, and mitotic exit.
    reference_section_type: OTHER
core_functions:
- description: 'Cyclin-dependent Ser/Thr protein kinase activity of the cyclin-Cdc28-Cks1 holoenzyme:
    with the G1 cyclins Cln1-3 it executes Start (the G1/S transition) by phosphorylating Whi5, Sic1,
    Far1 and Ste5, committing the cell to a new division cycle and triggering the SBF/MBF transcriptional
    program.'
  supported_by:
  - reference_id: PMID:2142620
    supporting_text: Cln proteins are an essential component of the active protein kinase complex required
      for the G1 to S transition
    reference_section_type: ABSTRACT
  - reference_id: PMID:7002718
    supporting_text: Each mutation produces stage-specific arrest of cell division at start, the same
      point where mating pheromone interrupts division.
    reference_section_type: ABSTRACT
