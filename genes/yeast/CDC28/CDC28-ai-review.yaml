proposed_new_terms: []
suggested_questions:
- question: Of the several hundred in vitro Cdc28 substrates, which individual phosphorylation events
    are rate-limiting for ordering specific cell-cycle transitions, versus collectively contributing through
    cyclin-specific activity thresholds?
  experts: []
- question: Is the reported cell-cycle-independent role of Cdc28 at basal-transcription machinery (CTD-Ser5
    phosphorylation with Kin28, RNAPII association) a direct catalytic function of a distinct Cdc28 pool,
    and which cyclin, if any, targets it there?
  experts: []
- question: For substrates where Cdc28 phosphorylation controls localisation (Swi5, Fus2, Ipl1, Rnr2,
    Cac1), should annotations be recorded as regulation of localisation rather than participation in the
    localisation process itself?
  experts: []
suggested_experiments:
- hypothesis: Cyclin-specific docking, not total CDK activity, determines which substrates are phosphorylated
    at each transition.
  description: Combine cdc28-as1 chemical-genetic inhibition with cyclin docking-motif mutants (LP, RxL/NLxxxL,
    LxF) in synchronised cultures and quantitative phosphoproteomics to assign each substrate to a cyclin-Cdc28
    complex and a cell-cycle window.
  experiment_type: chemical genetics + phosphoproteomics
- hypothesis: A chromatin-associated Cdc28 pool at basal promoters acts catalytically on the RNAPII CTD
    or Kin28 rather than structurally.
  description: Compare ChIP-seq occupancy and CTD-Ser5 phosphorylation at Cdc28-bound genes in cdc28-as1
    cells with and without inhibitor, and in kinase-dead versus wild-type Cdc28 tethered to the PMA1 promoter,
    to separate catalytic from scaffolding contributions.
  experiment_type: ChIP-seq / chemical genetics
