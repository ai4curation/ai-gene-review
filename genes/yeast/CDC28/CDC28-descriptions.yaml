- source: Alliance_Automated
  text: Enables RNA polymerase II complex binding activity; cyclin-dependent protein
    serine/threonine kinase activity; and histone binding activity. Involved in several
    processes, including nuclear chromosome segregation; positive regulation of catabolic
    process; and regulation of cell cycle process. Located in cellular bud neck; endoplasmic
    reticulum; and nucleus. Part of cyclin-dependent protein kinase holoenzyme complex.
    Used to study cancer. Human ortholog(s) of this gene implicated in breast cancer;
    cervical cancer; ovarian disease; prostate disease (multiple); and urinary system
    cancer (multiple). Orthologous to several human genes including CDK3 (cyclin dependent
    kinase 3).
