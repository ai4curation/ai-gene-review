- source: Alliance_Imported
  text: Cyclin-dependent kinase (CDK) catalytic subunit; master regulator of mitotic
    and meiotic cell cycles; alternately associates with G1, S, G2/M phase cyclins,
    which provide substrate specificity; regulates metabolism, basal transcription,
    chromosome dynamics, growth and morphogenesis; transcript induction in osmostress
    involves antisense RNA; human homologs CDK1, CDK2, CDK3 can complement yeast conditional
    cdc28 mutants; human CDK1, CDK2 can complement yeast cdc28 null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDC28
