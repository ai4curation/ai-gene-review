descriptions:
- source: UniProt
  text: Cyclin-dependent kinase that acts as a master regulator of the mitotic and
    meiotic cell cycles (By similarity). Required to drive the G1-S transition (PubMed:2664468).
    More than 200 substrates have been identified (PubMed:14574415). Substrate specificity
    is in part regulated by the bound cyclin protein (By similarity). Phosphorylates
    YTA7 during S-phase to promote transcription of histones (PubMed:22156209). May
    phosphorylate CNN1, to contribute to the enrichment of CNN1 on anaphase kinetochores
    (PubMed:22561345).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00546
  source_id: P00546
- source: Alliance_Imported
  text: Cyclin-dependent kinase (CDK) catalytic subunit; master regulator of mitotic
    and meiotic cell cycles; alternately associates with G1, S, G2/M phase cyclins,
    which provide substrate specificity; regulates metabolism, basal transcription,
    chromosome dynamics, growth and morphogenesis; transcript induction in osmostress
    involves antisense RNA; human homologs CDK1, CDK2, CDK3 can complement yeast conditional
    cdc28 mutants; human CDK1, CDK2 can complement yeast cdc28 null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDC28
  source_id: SGD:S000000364
- source: Alliance_Automated
  text: Enables RNA polymerase II complex binding activity; cyclin-dependent protein
    serine/threonine kinase activity; and histone binding activity. Involved in several
    processes, including nuclear chromosome segregation; positive regulation of catabolic
    process; and regulation of cell cycle process. Located in cellular bud neck; endoplasmic
    reticulum; and nucleus. Part of cyclin-dependent protein kinase holoenzyme complex.
    Used to study cancer. Human ortholog(s) of this gene implicated in breast cancer;
    cervical cancer; ovarian disease; prostate disease (multiple); and urinary system
    cancer (multiple). Orthologous to several human genes including CDK3 (cyclin dependent
    kinase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDC28
  source_id: SGD:S000000364
