  label: Saccharomyces cerevisiae S288C
description: TSC3 (YBR058C-A) encodes an 80-residue ER-membrane protein that is a small activating subunit of serine
  palmitoyltransferase (SPT), the Lcb1-Lcb2 enzyme catalysing the first committed step of sphingolipid synthesis
  (serine + acyl-CoA to 3-ketosphinganine). Tsc3 co-immunoprecipitates with Lcb1/Lcb2 and is a stoichiometric component
  of the SPOTS complex (SPT, Orm1/2, Tsc3, Sac1). tsc3 cells have severely reduced SPT activity and die at high
  temperature unless supplied with long-chain bases; Tsc3 also promotes C20 long-chain base formation, implying
  a role in acyl-CoA chain-length selection. It is fungus-specific and not homologous to the animal SPTSSA/B small
  subunits, although it fills an analogous activating role.
