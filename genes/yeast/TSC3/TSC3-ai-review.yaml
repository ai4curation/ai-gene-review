suggested_questions:
- question: 'How does Tsc3 increase SPT activity mechanistically: by stabilising the Lcb1-Lcb2 active site, improving
    acyl-CoA access, or altering acyl-CoA chain-length preference (C18-CoA for C20 LCBs)?'
suggested_experiments:
- hypothesis: Tsc3 shifts SPT acyl-CoA specificity toward longer chains
  description: Measure SPT kinetics with C14-C18 acyl-CoAs using purified Lcb1-Lcb2 with and without Tsc3 (or with
    Tsc3 point mutants at the Lcb2 interface).
  experiment_type: enzymology
