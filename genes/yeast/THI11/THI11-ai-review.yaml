core_functions:
- description: Single-turnover, iron-dependent HMP-P synthase (by similarity to THI5) forming the thiamine
    pyrimidine from PLP and an active-site histidine; redundant with THI5, THI12 and THI13.
  molecular_function:
    id: GO:0106344
    label: 4-amino-5-hydroxymethyl-2-methylpyrimidine phosphate synthase activity from histidine and PLP
  directly_involved_in:
  - id: GO:0009228
    label: thiamine biosynthetic process
  supported_by:
  - reference_id: PMID:12777485
    supporting_text: functionally redundant in terms of HMP formation for thiamin biosynthesis
  - reference_id: PMID:23048037
    supporting_text: We report a structure-function study of the HMP-P synthase from yeast, THI5p
suggested_questions:
- question: Is THI11 expressed and active as a protein under thiamine limitation, or does it contribute
    mainly as a backup copy? Its residue differences from THI5 have not been tested.
suggested_experiments:
- description: Quantify THI11-specific peptides (at the residues that differ from its paralogues) by targeted
    proteomics under thiamine limitation, and test single-copy strains (other three paralogues deleted)
    for HMP-P synthesis rate.
