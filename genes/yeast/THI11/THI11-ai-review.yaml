id: P47183
gene_symbol: THI11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: THI11 (YJR156C) encodes a 4-amino-5-hydroxymethyl-2-methylpyrimidine phosphate (HMP-P) synthase
  of the NMT1/THI5 family, one of four almost identical subtelomeric paralogues (THI5, THI11, THI12, THI13)
  that make the pyrimidine half of thiamine. By similarity to THI5, whose sequence differs from it at
  only a few positions, it is an iron-dependent homodimeric enzyme that builds HMP-P from pyridoxal 5'-phosphate
  and the side chain of one of its own histidine residues in a single turnover. The four paralogues are
  functionally redundant for aerobic HMP synthesis from the vitamin B6 pathway, and the family is induced
  by thiamine limitation.
