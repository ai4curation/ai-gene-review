    summary: >-
      Rank 3 (score 18.53), absent from GOA. The IRE1-TRAF2-ASK1 complex is defined by TNF receptor-associated
      factor 2 and the MAP3K ASK1, neither of which exists in S. cerevisiae; the metazoan JNK arm
      of ER stress signalling has no yeast counterpart. The identical call appears at the identical
      rank for worm ire-1, so the same impossible complex is asserted for two organisms that both
      lack its components. Scored MORE_SPECIFIC against GOA's endoplasmic reticulum, so ontology closure
