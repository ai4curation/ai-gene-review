  label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for yeast IRE1, the sole UPR sensor in S. cerevisiae. The most
  informative comparison in the cohort: this result is nearly identical to worm ire-1, which returns
  the same four terms - Ire1 complex, IRE1-mediated unfolded protein response, IRE1-TRAF2-ASK1 complex,
  ER unfolded protein response - at the same ranks in the same order, with scores shifted down by
  roughly 3 units. Two orthologs separated by about a billion years of divergence produce the same
  ranked list, including the same error. That is direct evidence the retrieval keys on family identity
  rather than on anything species-specific, and it means a mammalian-only complex is asserted for
  both a fungus and a nematode. Rank 5 compounds it: eIF2-alpha phosphorylation in response to ER
  stress is the PERK branch, and yeast has no PERK - IRE1 is its only ER stress sensor, as the gene's
  own review states. Assessment: 1 correct novel, 1 correct-not-novel, 1 nonparalog incorrect. Assessment:
  1 correct novel (COR), 1 correct not novel (CNN), 1 nonparalog incorrect (NPI).
