id: P20967
gene_symbol: KGD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: E1 component (Kgd1p, YIL125W; alpha-ketoglutarate dehydrogenase, KE1) of the mitochondrial 2-oxoglutarate
  dehydrogenase complex (KGDH). Using thiamine diphosphate, Kgd1 decarboxylates 2-oxoglutarate and transfers the
  succinyl group to the lipoyl arm of the E2 core (Kgd2), which forms succinyl-CoA; the E3 Lpd1 reoxidises the dihydrolipoamide
  with NAD+. Kgd1 binds the 24-meric Kgd2 core, and the small subunit Kgd4 bridges the Kgd1-Kgd2 core to Lpd1. KGDH
  catalyses the irreversible 2-oxoglutarate to succinyl-CoA step of the TCA cycle in the mitochondrial matrix; kgd1
  mutants are respiratory-deficient. Part of the complex associates with mitochondrial nucleoids. KGD1 is glucose-repressed
  and activated by the HAP complex.
