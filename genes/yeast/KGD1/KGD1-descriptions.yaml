descriptions:
- source: UniProt
  text: 'The 2-oxoglutarate dehydrogenase complex catalyzes the overall conversion
    of 2-oxoglutarate to succinyl-CoA and CO(2). It contains multiple copies of three
    enzymatic components: 2-oxoglutarate dehydrogenase (E1), dihydrolipoamide succinyltransferase
    (E2) and lipoamide dehydrogenase (E3).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P20967
  source_id: P20967
- source: Alliance_Imported
  text: Subunit of the mitochondrial alpha-ketoglutarate dehydrogenase complex; catalyzes
    a key step in the tricarboxylic acid (TCA) cycle, the oxidative decarboxylation
    of alpha-ketoglutarate to form succinyl-CoA
  source_type: curated
  url: https://www.yeastgenome.org/locus/KGD1
  source_id: SGD:S000001387
- source: Alliance_Automated
  text: Predicted to enable oxoglutarate dehydrogenase (succinyl-transferring) activity.
    Involved in 2-oxoglutarate metabolic process. Located in mitochondrial nucleoid.
    Part of oxoglutarate dehydrogenase complex. Human ortholog(s) of this gene implicated
    in oxoglutarate dehydrogenase deficiency. Orthologous to human OGDH (oxoglutarate
    dehydrogenase) and OGDHL (oxoglutarate dehydrogenase L).
