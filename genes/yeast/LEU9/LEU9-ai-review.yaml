  label: Saccharomyces cerevisiae S288C
description: Minor 2-isopropylmalate synthase (alpha-isopropylmalate synthase II, alpha-IPMS, EC 2.3.3.13)
  of Saccharomyces cerevisiae, a paralog of Leu4 arising from the whole-genome duplication. Leu9 condenses
  acetyl-CoA with 3-methyl-2-oxobutanoate (alpha-ketoisovalerate) to give 2-isopropylmalate, the first
  committed step of leucine biosynthesis, in mitochondria. Leu9 accounts for the residual ~20% of alpha-IPMS
  activity in leu4 mutants; unlike Leu4, the Leu9 homodimer is resistant to leucine feedback inhibition,
  and Leu4-Leu9 heterodimers formed in vivo have intermediate leucine sensitivity. leu9 single deletions
  have no obvious phenotype, while leu4 leu9 double mutants lack alpha-IPMS activity and are leucine auxotrophs.
