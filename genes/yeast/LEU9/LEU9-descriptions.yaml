gene_symbol: LEU9
organism: yeast
uniprot_id: Q12166
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the condensation of the acetyl group of acetyl-CoA with 3-methyl-2-oxobutanoate
    (2-oxoisovalerate) to form 3-carboxy-3- hydroxy-4-methylpentanoate (2-isopropylmalate).
    Redundant to LEU4, responsible for about 20% of alpha-IPMS activity. Involved
    in leucine synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12166
  source_id: Q12166
- source: Alliance_Imported
  text: Alpha-isopropylmalate synthase II (2-isopropylmalate synthase); catalyzes
    the first step in the leucine biosynthesis pathway; the minor isozyme, responsible
    for the residual alpha-IPMS activity detected in a leu4 null mutant; LEU9 has
    a paralog, LEU4, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/LEU9
  source_id: SGD:S000005634
- source: Alliance_Automated
  text: Enables 2-isopropylmalate synthase activity. Involved in L-leucine biosynthetic
    process. Located in mitochondrion.
  source_type: automated
  url: https://www.yeastgenome.org/locus/LEU9
  source_id: SGD:S000005634
