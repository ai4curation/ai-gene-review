descriptions:
- source: UniProt
  text: Catalyzes the condensation of the acetyl group of acetyl-CoA with 3-methyl-2-oxobutanoate
    (2-oxoisovalerate) to form 3-carboxy-3- hydroxy-4-methylpentanoate (2-isopropylmalate).
    Redundant to LEU4, responsible for about 20% of alpha-IPMS activity. Involved
    in leucine synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12166
