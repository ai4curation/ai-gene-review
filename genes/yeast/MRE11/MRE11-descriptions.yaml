descriptions:
- source: UniProt
  text: Core component of the MRN complex, which plays a central role in double-strand
    break (DSB) repair, DNA recombination, maintenance of telomere integrity and meiosis
    (PubMed:14522986, PubMed:22002605, PubMed:22705791, PubMed:23080121, PubMed:7625279,
    PubMed:9651580). The MRN complex is involved in the repair of DNA double-strand
    breaks (DSBs) via homologous recombination (HR), an error-free mechanism which
    primarily occurs during S and G2 phases (PubMed:22002605, PubMed:22705791, PubMed:23080121).
    The complex (1) mediates the end resection of damaged DNA, which generates proper
    single-stranded DNA, a key initial steps in HR, and is (2) required for the recruitment
    of other repair factors and efficient activation of ATM and ATR upon DNA damage
    (PubMed:22002605, PubMed:23080121). Within the MRN complex, MRE11 possesses both
    single-strand endonuclease activity and double- strand-specific 3'-5' exonuclease
    activity (PubMed:14522986, PubMed:22002605). MRE11 first endonucleolytically cleaves
    the 5' strand at DNA DSB ends to prevent non-homologous end joining (NHEJ) and
    licence HR (PubMed:23080121). It then generates a single-stranded DNA gap via
    3' to 5' exonucleolytic degradation, which is required for single-strand invasion
    and recombination (PubMed:22002605). The MRN complex is also required for the
    processing of R-loops (PubMed:31537797).
