  source_id: P32829
- source: Alliance_Imported
  text: Nuclease subunit of the MRX complex with Rad50p and Xrs2p; complex functions
    in repair of DNA double-strand breaks and in telomere stability; Mre11p associates
    with Ser/Thr-rich ORFs in premeiotic phase; nuclease activity required for MRX
    function; widely conserved; forms nuclear foci upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/MRE11
  source_id: SGD:S000004837
- source: Alliance_Automated
  text: Enables DNA binding activity; DNA nuclease activity; and molecular adaptor
    activity. Contributes to AMP kinase activity. Involved in several processes, including
    DNA metabolic process; R-loop processing; and ascospore formation. Located in
    nucleus. Part of Mre11 complex. Used to study breast cancer; intestinal cancer;
    liver cancer; ovarian cancer; and skin cancer. Human ortholog(s) of this gene
    implicated in several diseases, including Lynch syndrome; ataxia-telangiectasia-like
    disorder 1; endometrial cancer; gastrointestinal system cancer (multiple); and
    urinary bladder cancer. Orthologous to human MRE11 (MRE11 double strand break
    repair nuclease).
