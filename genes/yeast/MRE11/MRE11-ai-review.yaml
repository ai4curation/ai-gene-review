- term:
    id: GO:0000729
    label: DNA double-strand break processing
  evidence_type: IMP
  original_reference_id: PMID:23080121
  qualifier: involved_in
  review:
    summary: DNA double-strand break processing. Correct for S. cerevisiae Mre11, but the cited paper
      is a S. pombe study.
    action: ACCEPT
    reason: Mre11 nicks the 5' strand and resects 3'->5' toward the break (PMID:22002605). Sae2 activates
      its dsDNA endonuclease on the 5' strand at blocked ends (PMID:25231868). This is the defining catalytic
      process of Mre11. The cited reference PMID:23080121 analyses S. pombe Rad32 mutants; see source_defects.
    supported_by:
    - &id034
      reference_id: PMID:22002605
      supporting_text: Mre11 nicks the strand to be resected up to 300 nucleotides from the 5'-terminus
        of the DSB
    - reference_id: PMID:25231868
      supporting_text: The endonuclease preferentially cleaves the 5'-terminated dsDNA strand, which explains
        the polarity paradox
    - &id004
      reference_id: PMID:23080121
      supporting_text: Mre11 is also crucial in S. cerevisiae, although the effects of ablating its nuclease
        activities are weaker
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: UNIPROT
      slot: DB:Reference
      requested_change: CHECK
      asserted_value: PMID:23080121
      confidence: PROBABLE
      explanation: This IMP annotation of S. cerevisiae MRE11 (P32829) to 'DNA double-strand break processing'
        cites Limbo et al. 2012 (PMID:23080121). Its in vivo experiments use S. pombe Rad32/Mre11 ATLD17/18
        (W248R) mutants, and its biochemistry uses human MRE11. The full text reports no S. cerevisiae
        mutant phenotype. The annotation belongs on S. pombe rad32 (UniProtKB:Q09683), or it should be
        an ISS on P32829. The term is true for S. cerevisiae Mre11 on other evidence (e.g. PMID:22002605,
        PMID:25231868, PMID:7789757), so a re-key to one of those papers is an alternative fix.
      supported_by:
      - *id004
