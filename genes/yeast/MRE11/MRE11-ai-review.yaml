    label: single-stranded DNA endonuclease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000015644
  - UniProtKB:P49959
  review:
    summary: Single-stranded DNA endonuclease activity, propagated from the family-root PAINT node PTN000015644.
    action: ACCEPT
    reason: This function is directly demonstrated for purified S. cerevisiae Mre11. Single-stranded endonuclease
      activity is lost in the D56N and H125N phosphoesterase-motif mutants (PMID:9858579). It also cleaves
      the 3' ssDNA tail of hairpin substrates (PMID:11454871). The family-root placement is consistent
      with the conserved phosphoesterase motifs shared by all SF1 and SF4 members.
    supported_by:
