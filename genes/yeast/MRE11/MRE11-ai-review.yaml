- term:
    id: GO:0000706
    label: meiotic DNA double-strand break processing
  evidence_type: IMP
  original_reference_id: PMID:9858579
  review:
    summary: 'Meiotic DNA double-strand break processing: nucleolytic release of Spo11 and resection of
      meiotic DSB ends.'
    action: NEW
    reason: Mre11 catalyses steps of this process. Nuclease-dead mre11-H125N diploids accumulate unresected
      meiotic DSBs (PMID:9858579). In vivo, Mre11 nicks Spo11-linked 5' strands and resects them 3'->5'
      (PMID:22002605), and the Reactome Spo11-removal reaction reflects the same chemistry. The participation
      test is passed because Mre11 is the nuclease that performs the cleavage. The term is not a parent
      or child of the GO:0042138 / GO:0010780 formation terms already carried.
    supported_by:
    - *id033
    - *id018
    - *id034
