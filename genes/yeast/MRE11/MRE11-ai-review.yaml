  review:
    summary: 'Molecular adaptor activity: Mre11 is the binding core that bridges Rad50 and Xrs2 in MRX.'
    action: ACCEPT
    reason: Usui et al. showed that Mre11 is the binding core of the MRX complex. It has two Rad50-binding
      regions, and its C-terminal region binds meiotic DSB proteins and is needed only for DSB formation
      (PMID:9845372). Xrs2 binds the complex through its Mre11-binding domain (PMID:15716496). This structural
      role explains the nuclease-independent functions of Mre11 in NHEJ, telomere maintenance and meiotic
      DSB formation (PMID:9858579).
