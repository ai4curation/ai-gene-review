  qualifier: involved_in
  review:
    summary: Meiotic DSB formation. True for S. cerevisiae Mre11, but not shown by the cited S. pombe
      paper.
    action: ACCEPT
    reason: The claim is supported in S. cerevisiae (PMID:7789757, PMID:9845372), so the term is kept,
      consistent with the other rows for it. PMID:23080121 studies S. pombe Rad32 and measures spore viability
      and DSB repair in meiosis, not meiotic DSB formation, so the reference supports neither the organism
      nor the term; see source_defects.
    supported_by:
    - *id026
    - *id004
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: UNIPROT
      slot: DB:Reference
      requested_change: CHECK
      asserted_value: PMID:23080121
      confidence: PROBABLE
      explanation: This IMP annotation of S. cerevisiae MRE11 (P32829) to 'meiotic DNA double-strand break
        formation' cites Limbo et al. 2012 (PMID:23080121). Its in vivo experiments use S. pombe Rad32/Mre11
        ATLD17/18 (W248R) mutants, and its biochemistry uses human MRE11. The full text reports no S.
        cerevisiae mutant phenotype. The annotation belongs on S. pombe rad32 (UniProtKB:Q09683), or it
        should be an ISS on P32829. The term is true for S. cerevisiae Mre11 on other evidence (e.g. PMID:22002605,
        PMID:25231868, PMID:7789757), so a re-key to one of those papers is an alternative fix.
      supported_by:
      - *id004
