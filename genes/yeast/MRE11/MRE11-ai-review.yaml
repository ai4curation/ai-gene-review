- term:
    id: GO:0035753
    label: maintenance of DNA trinucleotide repeats
  evidence_type: IMP
  original_reference_id: PMID:27173583
  qualifier: involved_in
  review:
    summary: Maintenance of DNA trinucleotide repeats.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0035753 is defined as processes sustaining the fidelity and copy number of trinucleotide
      repeats. Ye et al. show the opposite: MRX promotes expansions of short TNRs, and MRX loss suppresses
      them. The Mre11 nuclease is dispensable for this (PMID:27173583). Mre11 therefore destabilizes TNRs,
      so the term misstates the direction of the effect. GO lacks a term for TNR expansion (see suggested_questions).'
    supported_by:
    - reference_id: PMID:27173583
      supporting_text: Mutations that eliminate MRX subunits led to significant suppression of expansions
        whereas mutations that inactivate Rad51 had only a minor effect
    - reference_id: PMID:27173583
      supporting_text: The nuclease function of Mre11 was dispensable for expansions
