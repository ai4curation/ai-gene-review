id: P32829
gene_symbol: MRE11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MRE11 encodes the nuclease subunit of the conserved Mre11-Rad50-Xrs2 (MRX) complex of budding
  yeast. Mre11 is a Mn2+-dependent metallophosphoesterase-family nuclease. Its N-terminal nuclease domain
  has single-stranded DNA endonuclease, Sae2-stimulated double-stranded DNA endonuclease and 3'-5' DNA
  exonuclease activities. Its C-terminal region binds DNA and meiotic proteins. Mre11 is the binding core
  that bridges Rad50 and Xrs2, and Xrs2 is required for its nuclear import. At DNA double-strand breaks,
  MRX recognises and tethers DNA ends. When ends are blocked by proteins such as Spo11 or Ku, Mre11 nicks
  the 5'-terminated strand internally and resects back toward the end. This initiates resection for homologous
  recombination, which Exo1 and Sgs1-Dna2 then extend. Through nuclease-independent, structural functions
  of the complex, Mre11 is also needed for nonhomologous end joining, telomere length maintenance, Tel1-dependent
  DNA damage signaling and, in meiosis, Spo11-dependent DSB formation. Minor roles have been reported
  in mitochondrial DNA repair, base excision repair and trinucleotide repeat expansion.
