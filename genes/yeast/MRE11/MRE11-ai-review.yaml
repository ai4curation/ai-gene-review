  qualifier: involved_in
  review:
    summary: R-loop processing.
    action: UNDECIDED
    reason: Chang et al. found MRN to be required to suppress R-loops at transcription-replication conflicts.
      The yeast experiments used rad50Δ, and the authors state that mre11Δ triple mutants were not made.
      The non-nucleolytic MRE11 function was shown in human cells (PMID:31537797). For S. cerevisiae Mre11
      this is a complex-level inference, not a direct IDA, and 'R-loop processing' may overstate a suppression
      role. Left undecided pending yeast mre11-specific data.
