- term:
    id: GO:0004017
    label: AMP kinase activity
  evidence_type: IDA
  original_reference_id: PMID:17349953
  qualifier: contributes_to
  review:
    summary: Contributes to AMP (adenylate) kinase activity of Mre11-Rad50 complexes.
    action: KEEP_AS_NON_CORE
    reason: The adenylate kinase reaction is catalysed by the Rad50 ABC-ATPase head; a Rad50 signature-motif
      mutant reduces it (PMID:17349953). Mre11 has no adenylate kinase active site. It contributes only
      as the partner subunit of the MR complex, which is the weaker claim the contributes_to qualifier
      makes. Kept as non-core.
    supported_by:
    - reference_id: PMID:17349953
      supporting_text: Mre11/Rad50 complexes from three organisms catalyze the reversible adenylate kinase
        reaction in vitro
    - reference_id: PMID:17349953
      supporting_text: Mutation of the conserved signature motif reduces the adenylate kinase activity
        of Rad50 but does not reduce ATP hydrolysis
