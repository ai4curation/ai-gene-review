proposed_new_terms: []
suggested_questions:
- question: GO has no term for trinucleotide repeat expansion or instability. MRX promotes TNR expansions
    (PMID:27173583), but the only available term, 'maintenance of DNA trinucleotide repeats', implies
    the opposite. Should a 'DNA trinucleotide repeat expansion' process term (or a negative-regulation
    sibling) be created?
- question: Is the meiotic-gene activation defect of mre11Δ, which is not shared by rad50Δ or xrs2Δ (PMID:17396017),
    a direct transcriptional role of the Mre11 C-terminus or an indirect consequence of altered meiotic
    chromosome structure?
- question: Does Mre11 itself, rather than only Rad50/MRN, suppress R-loops at transcription-replication
    conflicts in S. cerevisiae, given that mre11Δ triple mutants with rnh1Δ rnh201Δ could not be built
    (PMID:31537797)?
suggested_experiments:
- description: Use separation-of-function alleles (nuclease-dead H125N vs. C-terminal truncation) in an
    rnh1Δ rnh201Δ background, built with a non-linked RNH1 marker or an auxin degron of Mre11. Measure
    DRIP-seq R-loop levels, to test whether yeast Mre11 suppresses R-loops and whether this needs the
    nuclease.
- description: Map promoter occupancy of Mre11 (ChIP-seq) during early meiosis at the ~90 Mre11-dependent
    spore-development genes, comparing wild type and mre11ΔC49, to test whether the transcriptional effect
    is direct.
