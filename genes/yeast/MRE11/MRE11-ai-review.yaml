  review:
    summary: DSB repair via homologous recombination (IBA; S. cerevisiae MRE11 is a donor).
    action: ACCEPT
    reason: Mre11 initiates HR by endonucleolytic nicking and 3'->5' resection of 5' strands (PMID:22002605,
      PMID:25231868). It is also required for sister-chromatid recombination of replication-born DSBs
      (PMID:23254329). This is the core process for the nuclease.
    supported_by:
    - &id015
