suggested_questions:
- question: Does Apt2 form heterodimers with Apt1 under any condition, and does it have any residual or alternative
    activity (e.g. with other purine bases)?
suggested_experiments:
- description: Express APT2 from the APT1 promoter in an apt1 aah1 purine auxotroph to test whether Apt2 can support
    adenine utilisation in vivo, and co-purify Apt1/Apt2 to test heterodimer formation.
