id: P49435
gene_symbol: APT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: APT1 (YML022W) encodes adenine phosphoribosyltransferase (APRT), a homodimeric type I phosphoribosyltransferase
  of the short-APRT class that condenses adenine with 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) in a Mg2+-dependent
  reaction to form AMP and diphosphate. Together with adenine deaminase (Aah1), Apt1 is one of the two entry points
  by which exogenous adenine enters purine nucleotide pools, and it is the energetically cheapest route to AMP.
  apt1 mutants are resistant to the toxic analogue 8-azaadenine. The paralog APT2 arose by gene duplication but
  its product has no detectable APRT activity and it is not significantly expressed, so Apt1 is the functional APRT.
  Crystal structures of yeast Apt1 define the catalytic loop and PRPP-binding residues. Apt1 is found in the cytoplasm
  and nucleus.
