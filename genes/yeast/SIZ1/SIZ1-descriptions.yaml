descriptions:
- source: UniProt
  text: Acts as an E3 ligase mediating SUMO/Smt3 attachment to septins and PCNA. May
    be involved in chromosome maintenance.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04195
  source_id: Q04195
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: 'Correct: SUMO E3 for septins and PCNA. Very brief; omits the SP-RING
      mechanism, Ubc9 adaptor role, nuclear/bud-neck shuttling and other substrates
      such as Top2 and Cse4.'
- source: Alliance_Imported
  text: SUMO E3 ligase; promotes attachment of small ubiquitin-related modifier sumo
    (Smt3p) to primarily cytoplasmic proteins; regulates Rsp5p ubiquitin ligase activity
    and is in turn itself regulated by Rsp5p; required for sumoylation of septins
    and histone H3 variant Cse4p, a prerequisite for STUbL-mediated Ub-dependent degradation;
    localizes to the septin ring; acts as an adapter between E2, Ubc9p and substrates;
    tends to compensate for survival of DNA damage in absence of Nfi1p
  source_type: curated
  url: https://www.yeastgenome.org/locus/SIZ1
  source_id: SGD:S000002817
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: SUMO E3 acting as Ubc9-substrate adapter, septin ring
      localization, septin and Cse4 sumoylation, and Rsp5 crosstalk, all covered by
      the review. Saying it targets ''primarily cytoplasmic proteins'' understates
      the nuclear PCNA and chromatin substrates the review treats as a core function.'
- source: Alliance_Automated
  text: Enables SUMO transferase activity and double-stranded DNA binding activity.
    Involved in several processes, including DNA double-strand break attachment to
    nuclear envelope; negative regulation of protein ubiquitination; and protein sumoylation.
    Located in several cellular components, including cellular bud neck; chromatin;
    and septin ring. Orthologous to several human genes including PIAS2 (protein inhibitor
    of activated STAT 2); PIAS3 (protein inhibitor of activated STAT 3); and PIAS4
    (protein inhibitor of activated STAT 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SIZ1
  source_id: SGD:S000002817
