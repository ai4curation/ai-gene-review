core_functions:
- description: 'SP-RING-type SUMO E3 ligase for septins at the bud neck: in M phase Siz1 is exported from the nucleus
    and targeted (via its C-terminal domain) to the septin ring, where it bridges Ubc9~Smt3 and the septins Cdc3,
    Cdc11 and Shs1 to catalyse their sumoylation.'
  molecular_function:
    id: GO:0061665
    label: SUMO ligase activity
  directly_involved_in:
  - id: GO:0016925
    label: protein sumoylation
  locations:
  - id: GO:0005940
    label: septin ring
  - id: GO:0005935
    label: cellular bud neck
  supported_by:
  - reference_id: PMID:11577116
    supporting_text: Ull1 is additionally required as well as E1 (Sua1.Uba2 complex), E2 (Ubc9), and ATP
  - reference_id: PMID:11577116
    supporting_text: Thus, this SUMO/Smt3 ligase functions as an adaptor between E2 and the target proteins
  - reference_id: PMID:17077124
    supporting_text: sumoylation of the bud neck-associated septin proteins Cdc3, Cdc11 and Shs1/Sep7 requires
      the C-terminal domain of Siz1
  - reference_id: PMID:17403926
    supporting_text: In M phase, Siz1p is exported from the nucleus by the karyopherin Kap142p/Msn5p and 
      subsequently targeted to the septin ring, where it participates in septin sumoylation
- description: 'Nuclear SUMO E3 ligase for chromatin and genome-maintenance substrates: during interphase Siz1 (imported
    by Kap95) uses its PINIT domain to redirect Ubc9 to the non-consensus PCNA Lys164 (SUMO-PCNA recruits Srs2 to
    restrain recombination in S phase), and sumoylates Top2, Cse4 and transcription/chromatin factors, largely redundantly
    with Siz2.'
  molecular_function:
    id: GO:0061665
    label: SUMO ligase activity
  directly_involved_in:
  - id: GO:0016925
    label: protein sumoylation
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:19748360
    supporting_text: the PINIT domain is essential for redirecting SUMO conjugation to the proliferating cell 
      nuclear antigen (PCNA) at lysine 164
  - reference_id: PMID:18701921
    supporting_text: As expected, sumoylation at K164 was abolished in the siz1 mutant
  - reference_id: PMID:16204216
    supporting_text: Sumoylation of the carboxy-terminus of Top2p, a known SUMO target, is mediated by Siz1p 
      and Siz2p both in vivo and in vitro
  - reference_id: PMID:26960795
    supporting_text: In vitro sumoylation assays using purified Cse4 (Supplemental Figure S1) revealed that 
      Siz1 serves as an E3 for Cse4 sumoylation
  - reference_id: PMID:15931174
    supporting_text: SUMO-modified PCNA recruits Srs2 in S phase in order to prevent unwanted recombination 
      events of replicating chromosomes
  - reference_id: PMID:17403926
    supporting_text: The E3 ligase Siz1p is imported into the nucleus by the karyopherin Kap95p during 
      interphase
suggested_questions:
- question: Which Siz1 substrates are strictly Siz1-specific versus redundantly modified by Siz2 in vivo, and 
    does the local-concentration model fully explain the specific set (PCNA K164, septins, Prp45)?
- question: What is the physiological role of SAP-domain dsDNA binding by Siz1, given that a SAP-deleted Siz1 
    at wild-type levels supports PCNA sumoylation?
- question: What is the functional consequence of septin sumoylation by Siz1 for septin ring dynamics and 
    cytokinesis, given that septin sumoylation-deficient mutants have mild phenotypes?
- question: How does M-phase phosphorylation of Siz1 control its Msn5-dependent nuclear export and its 
    turnover by Slx5/Slx8?
suggested_experiments:
- hypothesis: Siz1-specific substrates are defined by its PINIT and C-terminal targeting domains.
  description: Quantitative SUMO proteomics in siz1, siz2 and siz1 siz2 strains complemented with Siz1 PINIT 
    or C-terminal domain mutants, compared with Siz1 tethered to defined compartments.
  experiment_type: proteomics
- hypothesis: Septin sumoylation by Siz1 regulates septin ring disassembly at cytokinesis.
  description: Live-cell imaging of septin ring dynamics (FRAP, ring splitting) in Siz1 C-terminal deletion 
    mutants and septin lysine-to-arginine mutants, with Ulp1 targeting mutants as controls.
  experiment_type: live-cell imaging
