id: Q04195
gene_symbol: SIZ1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Siz1 (Ull1, YDR409W) is a PIAS-family SP-RING-type SUMO (Smt3) E3 ligase of budding yeast. It 
  comprises an N-terminal SAP motif that binds duplex DNA, a PINIT domain, a zinc-containing SP-RING that 
  binds the SUMO E2 Ubc9, an SP-CTD that together with the SP-RING activates the Ubc9~SUMO thioester, a 
  SUMO-interacting motif, and a C-terminal region required for bud neck targeting. Siz1 acts as an adaptor 
  between Ubc9 and substrates, accelerating SUMO transfer and redirecting it to non-consensus lysines such as 
  PCNA Lys164. Together with its paralog Siz2/Nfi1 it accounts for most SUMO conjugation in vegetative cells, 
  and its substrate choice is governed largely by where it is concentrated. During interphase Siz1 is imported
  into the nucleus by Kap95 and sumoylates nuclear substrates including PCNA (Siz1-dependent SUMO-PCNA 
  recruits the anti-recombinase Srs2 during S phase), topoisomerase II (supporting chromosome transmission 
  fidelity), the centromeric histone Cse4 and many transcription and chromatin factors during the SUMO stress 
  response. In M phase it is phosphorylated, exported by Msn5/Kap142 and targeted to the septin ring at the 
  mother-bud neck, where it sumoylates the septins Cdc3, Cdc11 and Shs1. Siz1 also sumoylates the HECT 
  ubiquitin ligase Rsp5, which in turn ubiquitylates Siz1, a reciprocal crosstalk that dampens both 
  activities.
