  review:
    summary: Parker et al. showed that recombinant full-length Siz1 binds a 76-bp dsDNA fragment, without 
      preference for ss/ds junctions, and that binding depends on the SAP domain (SAP* and SAPdelta mutants).
    action: KEEP_AS_NON_CORE
    reason: The activity is directly demonstrated, so the annotation is correct. However the same paper shows 
      that a SAP-deleted Siz1 expressed at wild-type levels almost fully rescues PCNA sumoylation and damage 
      sensitivity, so DNA binding is an ancillary property of the E3 rather than its core function.
    supported_by:
