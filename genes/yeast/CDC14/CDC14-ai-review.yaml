- term:
    id: GO:0000183
    label: rDNA heterochromatin formation
  evidence_type: NAS
  original_reference_id: PMID:12923057
  qualifier: involved_in
  review:
    summary: 'NAS annotation derived from the RENT-complex literature: RENT (Net1-Sir2-Cdc14) mediates
      rDNA silencing, but the silencing work is done by the Sir2 deacetylase recruited through Net1/Fob1;
      no experiment shows that Cdc14 phosphatase activity contributes to rDNA heterochromatin formation,
      and the cited paper does not examine Cdc14.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Cdc14's membership in RENT is real (GO:0030869), but complex co-membership is not participation
      in the process. The cited abstract discusses only Net1 and Sir2 localisation to rDNA and Fob1-dependent
      silencing; the term's definition (H3K9me3-marked heterochromatin) also fits budding yeast poorly.
      Retain at most as a non-core, indirect association; the RENT complex annotation already captures
      the association.
    supported_by:
    - &id029
      reference_id: PMID:12923057
      supporting_text: rDNA silencing is mediated by a Sir2-containing complex called RENT (regulator
        of nucleolar silencing and telophase exit).
      reference_section_type: ABSTRACT
- term:
    id: GO:0000226
    label: microtubule cytoskeleton organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000596948
  - SGD:S000001924
  - WB:WBGene00000383
  review:
    summary: PAINT-inferred role in microtubule cytoskeleton organization. In budding yeast, released
      Cdc14 dephosphorylates spindle proteins such as Fin1 and Ase1 to stabilize and organize the anaphase
      spindle midzone, and it promotes spindle disassembly at mitotic exit; this is a genuine but downstream,
      substrate-specific role.
    action: KEEP_AS_NON_CORE
    reason: The phylogenetic placement is sound and supported by direct budding-yeast evidence (Cdc14
      dephosphorylates Fin1, which then stabilizes the elongating spindle). However, the core function
      is reversal of CDK phosphorylation to drive mitotic exit; spindle organization is one of several
      downstream consequences, so it is kept as non-core.
    supported_by:
    - &id001
      reference_id: PMID:17173039
      supporting_text: In anaphase, when Clb5-Cdk1 is inactivated, Fin1 is dephosphorylated by the phosphatase
        Cdc14.
      reference_section_type: ABSTRACT
    - &id036
      reference_id: PMID:17173039
      supporting_text: Fin1 dephosphorylation targets it to the poles and microtubules of the elongating
        spindle, where it contributes to spindle integrity.
      reference_section_type: ABSTRACT
