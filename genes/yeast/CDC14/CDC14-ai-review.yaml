core_functions:
- description: CDK-counteracting protein serine/threonine phosphatase that, once released from nucleolar
    Net1 by the FEAR and mitotic exit networks in anaphase, dephosphorylates Cdc28-phosphorylated pSer-Pro
    sites on Cdh1, Sic1 and Swi5 (and hundreds of other CDK substrates) to activate APC/C-Cdh1, stabilize
    Sic1 and extinguish Clb-CDK activity, driving exit from mitosis and resetting G1.
  supported_by:
