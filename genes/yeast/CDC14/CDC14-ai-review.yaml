- term:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:10684
  - EC:3.1.3.48
  review:
    summary: Electronic annotation from the EC 3.1.3.48 / RHEA:10684 mapping. Cdc14 does hydrolyze phosphotyrosine
      in vitro (it is a dual-specificity phosphatase), but no physiological tyrosine-phosphorylated substrate
      is known; its biological activity is directed at CDK pSer-Pro sites.
    action: MODIFY
    reason: '''Protein tyrosine phosphatase activity'' alone misrepresents the enzyme: Cdc14 was shown
      to be a dual-specificity phosphatase, and all characterized in vivo substrates are serine/threonine
      (CDK) sites, with phosphothreonine and phosphotyrosine being poor substrates. The appropriate term
      for the biochemical activity is GO:0008138 protein tyrosine/serine/threonine phosphatase activity,
      and the physiological activity is already captured by GO:0004722.'
    proposed_replacement_terms:
    - id: GO:0008138
      label: protein tyrosine/serine/threonine phosphatase activity
    supported_by:
    - *id003
    - *id006
