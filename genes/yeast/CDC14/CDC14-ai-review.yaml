    and nucleolar substrates: Fin1 and Ase1 to stabilize the anaphase spindle midzone, condensin (Smc4)
    and RNA polymerase I to inhibit rDNA transcription and permit condensin loading, thereby driving rDNA
    condensation and mitotic segregation of the rDNA array; also tunes Top2 phosphorylation for catenane
