id: Q00684
gene_symbol: CDC14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Cdc14 is the essential dual-specificity protein phosphatase of Saccharomyces cerevisiae that
  drives exit from mitosis by reversing phosphorylation deposited by the cyclin-dependent kinase Cdc28
  (Cdk1). It belongs to the protein-tyrosine phosphatase superfamily (Cys283 forms the phosphocysteine
  intermediate, Asp253 is the general acid/base) but physiologically acts on CDK-phosphorylated serine-proline
  sites, preferring pSer-Pro-x-Lys/Arg and engaging substrates through a Pro-x-Leu docking motif. In anaphase
  Cdc14 dephosphorylates the APC/C activator Cdh1, the CDK inhibitor Sic1 and its transcription factor
  Swi5, thereby destroying mitotic cyclins and extinguishing Clb-Cdc28 activity so that cells can enter
  G1. From G1 through metaphase the enzyme is sequestered and inhibited in the nucleolus by Net1/Cfi1
  within the RENT complex (Net1, Sir2, Cdc14). The FEAR network (separase/Esp1, Slk19, Spo12, the Polo
  kinase Cdc5 and inhibition of PP2A-Cdc55) releases it transiently into the nucleus in early anaphase,
  where it stabilizes the spindle midzone (Ase1, Fin1), promotes condensin loading and RNA polymerase
  I inhibition needed for rDNA condensation and segregation, and primes Top2-dependent resolution of sister-chromatid
  links. The mitotic exit network (Tem1 GTPase, Cdc15, Dbf2-Mob1) then drives sustained release into the
  cytoplasm, where Cdc14 localizes to spindle pole bodies and the bud neck and dephosphorylates cytokinesis
  regulators (Iqg1, Inn1, Chs2, Bud3) to couple cytokinesis to nuclear division. Cdc14 also resets SPB
  duplication licensing (Sfi1), is required for meiosis I spindle disassembly and the two consecutive
  meiotic divisions, and in meiosis or after TORC1 inactivation dephosphorylates Atg13 to stimulate autophagy.
