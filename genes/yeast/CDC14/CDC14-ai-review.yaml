proposed_new_terms: []
suggested_questions:
- question: Which of the 455 candidate Cdc14 substrates identified by phosphoproteomics are direct, PxL-docked
    targets versus indirect consequences of CDK inactivation or Fin1-PP1/PP2A relays, and how does substrate
    docking set the ordered timing of dephosphorylation during mitotic exit?
- question: Is there any physiological phosphotyrosine substrate of Cdc14 that would justify retaining
    a protein tyrosine phosphatase annotation, or is its in vivo activity exclusively directed at CDK
    pSer-Pro sites?
- question: What is the direct substrate through which Cdc14 coordinates the osmotic-stress (Hog1) transcriptional
    response, given that no direct Cdc14-Hog1 interaction was detected?
suggested_experiments:
- description: Substrate-trapping (C283S/D253A) Cdc14 pull-downs combined with PxL-motif mutagenesis and
    in vitro dephosphorylation kinetics to distinguish direct from indirect substrates among the phosphoproteomic
    candidates, especially Top2, Hog1-pathway components and Atg13.
- description: Phosphotyrosine-specific phosphoproteomics comparing wild-type and cdc14-ts cells at mitotic
    exit to test whether any tyrosine-phosphorylated proteins are Cdc14-dependent in vivo.
