- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IMP
  original_reference_id: PMID:29694832
  qualifier: involved_in
  review:
    summary: Cdc14 is required for optimal Atg13 dephosphorylation and autophagy induction after TORC1
      inactivation; SGD extends this (from the full text) to mitophagy. A stress-responsive, nutrient-dependent
      role distinct from mitotic exit.
    action: KEEP_AS_NON_CORE
    reason: Supported by IMP evidence and mechanistically plausible (Atg13 is a Cdc14 substrate), but
      autophagy/mitophagy is a secondary role outside the core mitotic-exit function. Abstract-only cache;
      the mitophagy-specific data are in the full text, so the curator's call is deferred to.
    supported_by:
