- source: Alliance_Automated
  text: Enables protein serine/threonine phosphatase activity. Involved in several
    processes, including chromosome organization; meiotic spindle disassembly; and
    regulation of cell cycle process. Located in several cellular components, including
    cellular bud neck; new mitotic spindle pole body; and nucleus. Part of RENT complex.
    Is active in nucleolus. Used to study autosomal recessive nonsyndromic deafness
    32; colorectal carcinoma; and vascular disease. Human ortholog(s) of this gene
    implicated in autosomal recessive nonsyndromic deafness 32. Orthologous to human
    CDC14A (cell division cycle 14A); CDC14B (cell division cycle 14B); and CDC14C
    (cell division cycle 14C).
