id: P37298
gene_symbol: SDH4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SDH4 (YDR178W) encodes the small cytochrome b subunit (CybS) of mitochondrial succinate dehydrogenase
  (complex II). The three-transmembrane-helix Sdh4p and Sdh3p form the integral inner-membrane dimer that
  anchors the catalytic Sdh1p/Sdh2p dimer, and with Sdh2p they build the ubiquinone-reduction site. Sdh4p
  Cys-78 is one axial ligand of the stoichiometric b562 heme, which in yeast is not needed for electron
  transfer or assembly. sdh4 null mutants still grow on rich glycerol medium but have impaired membrane
  attachment of Sdh1p/Sdh2p and less efficient ubiquinone reduction.
