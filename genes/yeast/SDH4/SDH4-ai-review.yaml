core_functions:
- description: Membrane-anchor subunit of complex II. Sdh4p anchors the catalytic dimer and forms part
    of the ubiquinone-binding site, contributing to succinate:quinone oxidoreductase activity. It also
    provides an axial ligand (Cys-78) for the b562 heme.
