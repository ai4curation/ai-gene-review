descriptions:
- source: UniProt
  text: Membrane-anchoring subunit of succinate dehydrogenase (SDH) that is involved
    in system II of the mitochondrial electron transport chain and is responsible
    for transferring electrons from succinate to ubiquinone (coenzyme Q). SDH3 and
    SDH4 form the membrane dimer that anchors the catalytic dimer formed by SDH1 and
    SDH2 to the matrix surface of the mitochondrial inner membrane. Electrons originating
    from the catalytic dimer enter the membrane dimer for ubiquinone reduction.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P37298
  source_id: P37298
- source: Alliance_Imported
  text: Membrane anchor subunit of succinate dehydrogenase (SDH); involved in coupling
    the oxidation of succinate to the transfer of electrons to ubiquinone as part
    of the TCA cycle and the mitochondrial respiratory chain; has similarity to human
    SDH subunit D (SDHD), which is implicated in paraganglioma
  source_type: curated
  url: https://www.yeastgenome.org/locus/SDH4
  source_id: SGD:S000002585
- source: Alliance_Automated
  text: Contributes to succinate dehydrogenase (quinone) activity. Involved in mitochondrial
    electron transport, succinate to ubiquinone and tricarboxylic acid cycle. Located
    in mitochondrial inner membrane. Part of respiratory chain complex II (succinate
    dehydrogenase). Used to study hypertrophic cardiomyopathy; mitochondrial complex
    II deficiency; and paraganglioma. Human ortholog(s) of this gene implicated in
    Carney-Stratakis syndrome; mitochondrial complex II deficiency; paraganglioma;
    and pheochromocytoma/paraganglioma syndrome 1. Orthologous to human SDHD (succinate
    dehydrogenase complex subunit D).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SDH4
  source_id: SGD:S000002585
