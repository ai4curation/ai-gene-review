id: P38149
gene_symbol: DUG2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Dug2 (YBR281C) is the non-catalytic scaffold subunit of the fungal-specific Dug2/Dug3 glutathione
  hydrolase of Saccharomyces cerevisiae (the DUG, "defective in utilization of glutathione", pathway).
  It has an N-terminal WD40 repeat region that binds the glutamine amidotransferase-type subunit Dug3
  and a C-terminal M20A peptidase-like domain that mediates homodimerization but has no peptidase activity.
  The cytosolic (Dug2-Dug3)2 complex cleaves the gamma-glutamyl bond of glutathione (and gamma-Glu-Cys)
  to glutamate and Cys-Gly, which the Dug1 dipeptidase then hydrolyses, allowing glutathione to be used
  as a sulfur and nitrogen source. DUG2 is derepressed under sulfur limitation.
