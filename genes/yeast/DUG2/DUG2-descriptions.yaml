descriptions:
- source: UniProt
  text: Component of the GSH degradosomal complex involved in the degradation of glutathione
    (GSH) and other peptides containing a gamma- glu-X bond.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38149
  source_id: P38149
- source: Alliance_Imported
  text: Component of glutamine amidotransferase (GATase II); forms a complex with
    Dug3p to degrade glutathione (GSH) and other peptides containing a gamma-glu-X
    bond in an alternative pathway to GSH degradation by gamma-glutamyl transpeptidase
    (Ecm38p)
  source_type: curated
  url: https://www.yeastgenome.org/locus/DUG2
  source_id: SGD:S000000485
- source: Alliance_Automated
  text: Enables identical protein binding activity and omega peptidase activity. Contributes
    to glutathione gamma-glutamate hydrolase. Involved in glutathione catabolic process.
    Located in cytoplasm and nuclear periphery. Part of glutathione hydrolase complex.
  source_type: automated
