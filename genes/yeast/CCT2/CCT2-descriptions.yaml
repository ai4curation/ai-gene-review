gene_symbol: CCT2
organism: yeast
uniprot_id: P39076
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin. In yeast
    may play a role in mitotic spindle formation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39076
  source_id: P39076
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
      notes: Correct but overly hedged; "may play a role in mitotic spindle formation"
        and "in vitro" qualifiers understate established functions.
    - rubric: utility
      score: 3
      notes: Does not convey the essential chaperonin complex context.
    - rubric: compactness
      score: 4
      notes: Three short sentences; reasonably concise.
    - rubric: completeness
      score: 3
      notes: Misses subunit identity, ring complex architecture, essentiality.
    - rubric: specificity
      score: 3
      notes: Names actin and tubulin but lacks complex context (TRiC/CCT).
    overall_notes: Accurate but somewhat tentative ("may play a role"). The in vitro
      qualification for actin/tubulin folding undersells what is a well-established
      in vivo function. Mentions ATP hydrolysis mechanism. Does not identify CCT2
      as a specific subunit of the TRiC/CCT ring complex.
- source: Alliance_Imported
  text: Subunit beta of the cytosolic chaperonin Cct ring complex; related to Tcp1p,
    required for the assembly of actin and tubulins in vivo
  source_type: curated
  url: https://www.yeastgenome.org/locus/CCT2
  source_id: SGD:S000001404
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
      notes: Accurate; "in vivo" is appropriately confident for this well-characterized
        function.
    - rubric: utility
      score: 4
      notes: Good for understanding the gene's place in the chaperonin complex.
    - rubric: compactness
      score: 5
      notes: One dense sentence with no wasted words.
    - rubric: completeness
      score: 3
      notes: Misses ATP-dependence, essentiality, other substrates beyond actin/tubulin.
    - rubric: specificity
      score: 5
      notes: Names the specific subunit (beta), complex (Cct ring), and substrates.
    overall_notes: 'Compact and informative. Clearly identifies the subunit (beta),
      the complex (Cct), and the key substrates (actin and tubulins) with in vivo
      confidence. Relationship to Tcp1p is useful context. Missing: ATP-dependence,
      essentiality, broader substrate range.'
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Involved in protein folding. Located in cytoplasm.
    Part of chaperonin-containing T-complex. Used to study Leber congenital amaurosis.
    Orthologous to human CCT2 (chaperonin containing TCP1 subunit 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CCT2
  source_id: SGD:S000001404
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Predicted ATP binding, ATP hydrolysis, folding chaperone, CCT complex,
      cytoplasm. Accurate but generic; no actin or tubulin clients. The Leber amaurosis
      line is padding.
- source: RefSeq
  text: Enables unfolded protein binding activity. Involved in protein folding. Located
    in cytoplasm. Part of chaperonin-containing T-complex. Used to study Leber congenital
    amaurosis. Human ortholog(s) of this gene implicated in Leber congenital amaurosis.
    Orthologous to human CCT2 (chaperonin containing TCP1 subunit 2). [provided by
    Alliance of Genome Resources, Jul 2025]
