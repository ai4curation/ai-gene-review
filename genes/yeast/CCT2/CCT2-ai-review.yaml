suggested_questions:
- question: Which Cct2-specific ATPase and apical-domain features determine actin-side
    substrate engagement in the asymmetric CCT/TRiC cycle?
  experts: []
- question: How much of the reported nuclear TRiC/CCT function requires Cct2-specific
    surfaces versus intact holo-complex abundance?
  experts: []
suggested_experiments:
- hypothesis: Cct2 ATP-site and apical-domain residues make separable contributions
    to chaperonin allostery and client recognition.
  description: Introduce endogenous CCT2 ATP-site and apical-domain mutants and assay
    holo-complex assembly, ATPase cycling, actin/tubulin folding, cytoskeletal organization,
    and nuclear TRiC localization/function.
  experiment_type: structure-guided mutagenesis
