      Heat stress induces vacuole-dependent turnover of Cct2 in Saccharomyces
      cerevisiae, but the abstract does not define a canonical autophagy pathway
      for Cct2 itself.
    supporting_text: >-
      Moreover, heat stress induces the turnover of the aggrephagy receptor Cct2
      and the polyglutamine repeats of the HTT (huntingtin) protein (polyQ-HTT).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache. A newer direct Cct2 heat-stress
      paper, but the abstract states that Cct2 degradation is vacuole-dependent and
      mediated autonomously of canonical autophagy pathways, so it does not support
      a precise new Cct2 GO process term.
