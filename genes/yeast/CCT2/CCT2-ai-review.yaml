description: CCT2 encodes the essential beta subunit of the cytosolic CCT/TRiC group
  II chaperonin, contributing ATP binding, ATP hydrolysis-coupled allostery, and substrate
  interaction surfaces needed for folding actin, tubulin, and other cytosolic clients.
