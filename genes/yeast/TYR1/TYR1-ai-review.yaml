  label: Saccharomyces cerevisiae S288C
description: Prephenate dehydrogenase (TyrA family) of Saccharomyces cerevisiae, catalysing the oxidative decarboxylation
  of prephenate to 4-hydroxyphenylpyruvate, the committed step of the L-tyrosine branch of aromatic amino acid biosynthesis
  (4-hydroxyphenylpyruvate is then transaminated to tyrosine). The recombinant enzyme prefers prephenate over arogenate
  and NAD+ over NADP+, and is only weakly inhibited by tyrosine; the protein carries an N-terminal NAD(P)-binding
  Rossmann motif. TYR1 is a soluble cytoplasmic enzyme whose expression is regulated by phenylalanine rather than
  by general amino acid control.
