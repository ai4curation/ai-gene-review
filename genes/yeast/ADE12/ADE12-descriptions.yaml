descriptions:
- source: UniProt
  text: Plays an important role in the de novo pathway and in the salvage pathway
    of purine nucleotide biosynthesis. Catalyzes the first committed step in the biosynthesis
    of AMP from IMP.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P80210
  source_id: P80210
- source: Alliance_Imported
  text: Adenylosuccinate synthase; catalyzes the first step in synthesis of adenosine
    monophosphate from inosine 5'monophosphate during purine nucleotide biosynthesis;
    exhibits binding to single-stranded autonomously replicating (ARS) core sequence
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADE12
  source_id: SGD:S000005164
- source: Alliance_Automated
  text: Enables DNA replication origin binding activity and adenylosuccinate synthase
    activity. Involved in purine nucleotide biosynthetic process. Located in cytoplasm.
    Orthologous to several human genes including ADSS2 (adenylosuccinate synthase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADE12
  source_id: SGD:S000005164
