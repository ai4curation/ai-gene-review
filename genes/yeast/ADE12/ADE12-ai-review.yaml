id: P80210
gene_symbol: ADE12
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ade12 (YNL220W; also BRA9) is the adenylosuccinate synthetase of Saccharomyces cerevisiae (EC 6.3.4.4),
  a GTP- and Mg(2+)-dependent homodimeric enzyme that condenses IMP with L-aspartate to adenylosuccinate, the first
  committed step of AMP synthesis from IMP. It is shared by the de novo pathway and by purine salvage routes that
  pass through IMP. The enzyme was originally purified as a protein binding single-stranded ARS (replication origin)
  DNA in vitro, which inhibits its activity; no in vivo replication role is established. Ade12 is cytoplasmic.
