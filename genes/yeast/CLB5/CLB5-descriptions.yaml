gene_symbol: CLB5
organism: yeast
uniprot_id: P30283
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for efficient progression through S phase and possibly for the normal
    progression through meiosis. Interacts with CDC28.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P30283
  source_id: P30283
- source: Alliance_Imported
  text: B-type cyclin involved in DNA replication during S phase; activates Cdc28p
    to promote initiation of DNA synthesis; functions in formation of mitotic spindles
    along with Clb3p and Clb4p; required with CLB6 for premeiotic DNA replication
    and activation of the meiotic DNA replication checkpoint; most abundant during
    late G1 phase; CLB5 has a paralog, CLB6, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/CLB5
  source_id: SGD:S000006324
- source: Alliance_Automated
  text: Enables cyclin-dependent protein serine/threonine kinase regulator activity.
    Involved in several processes, including mitotic cell cycle phase transition;
    premeiotic DNA replication; and regulation of cell cycle process. Located in nucleus.
    Part of cyclin-dependent protein kinase holoenzyme complex. Human ortholog(s)
    of this gene implicated in breast cancer and prostate cancer. Orthologous to human
    CCNB1 (cyclin B1) and CCNB2 (cyclin B2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CLB5
  source_id: SGD:S000006324
