  review:
    summary: 'Schwob & Nasmyth: CLB5/CLB6 transcripts appear in late G1 with CLN1/CLN2 and replication genes; clb5
      deletion greatly extends S phase and the clb5 clb6 double deletion prevents timely initiation of DNA replication;
