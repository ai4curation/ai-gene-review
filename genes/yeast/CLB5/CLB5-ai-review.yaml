suggested_questions:
- question: Which replication-initiation substrates (Sld2, Sld3, Orc6, Cdc6, Mcm3) depend specifically on Clb5 hydrophobic-patch
    docking in vivo, and does the Clb5 versus Clb6 difference in late-origin firing reflect substrate preference
    or simply the earlier disappearance of Clb6?
- question: Is Clb5 ever enriched at spindle pole bodies, or is its contribution to SPB separation fully explained
    by nuclear inactivation of APC/C-Cdh1 (relevant to the propagated microtubule organizing center annotation)?
- question: What transcriptional output, if any, underlies the SGD 'regulation of DNA-templated transcription' IMP
    from Schwob & Nasmyth 1993 (e.g. Clb5-dependent shut-off of SBF/MBF targets), and is it distinct from the effect
    of Clb2-Cdc28?
suggested_experiments:
- description: Combine an auxin-degron CLB5 allele (in clb6 and clb3 clb4 backgrounds) with synchronized phosphoproteomics
    and origin-firing profiling (BrdU-IP or Okazaki-fragment sequencing) to define the Clb5-specific Cdc28 substrate
    set and the origins whose timely firing requires Clb5, using hydrophobic-patch (hpm) mutants to separate docking-dependent
    targets.
- description: Image endogenously tagged Clb5 with SPB (Spc42) and origin markers through a synchronous cycle, including
    in cdh1 and clb3 clb4 backgrounds, to test whether any Clb5 pool localizes to SPBs or whether its spindle-related
    function is exerted entirely from the nucleoplasm via Cdh1.
