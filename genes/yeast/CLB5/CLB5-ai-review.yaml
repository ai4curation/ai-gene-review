- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:8319908
  qualifier: involved_in
  review:
    summary: 'Same paper: besides S phase, Clb5 shares with Clb3 and Clb4 a function in mitotic spindle formation,
      and the authors describe CLB5 as involved in the initiation of both S phase and mitosis. Later work showed
      the mechanism: the early Clb3/4/5 kinases inactivate APC-Hct1 during S phase so that Cin8/Kip1/Ase1 and Clb2
      accumulate for SPB separation and mitotic entry.'
    action: KEEP_AS_NON_CORE
    reason: 'Genuine but redundant contribution: Clb5-Cdc28 does part of the work (Hct1 phosphorylation) and the
      clb3 clb4 clb5 triple mutant arrests before mitosis without a spindle, yet in wild-type cells the G2/M transition
      is driven by Clb1/Clb2 and Clb5 is being degraded by APC/C-Cdc20 by metaphase. Retained as a non-core mitotic
      output of the S-phase kinase.'
    supported_by:
    - &id016
      reference_id: PMID:8319908
      supporting_text: Clb5 also has a function, along with Clb3 and Clb4, in the formation of mitotic spindles.
      reference_section_type: ABSTRACT
    - reference_id: PMID:8319908
      supporting_text: Our observation that CLB5 is involved in the initiation of both S phase and mitosis suggests
        that a single primordial B-type cyclin might have been sufficient for regulating the cell cycle of the common
        ancestor of many, if not all, eukaryotes.
      reference_section_type: ABSTRACT
    - &id008
      reference_id: PMID:11438663
      supporting_text: Here we show that this relationship between anaphase-promoting complex (APC) and Clb proteins
        is reversed in S phase such that the early Clb kinases (Clb3, Clb4, and Clb5 kinases) inactivate APC Hct1
        to allow Clb2 accumulation.
      reference_section_type: ABSTRACT
