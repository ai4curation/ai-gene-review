core_functions:
- description: Binds and activates the Cdc28 (Cdk1) serine/threonine protein kinase, forming the Clb5-Cdc28 S-phase
    CDK holoenzyme that, once released from Sic1 inhibition, phosphorylates replication-initiation factors to fire
    early and late replication origins on schedule and thereby drives the G1/S transition and timely completion
    of S phase.
  supported_by:
  - *id002
  - *id007
