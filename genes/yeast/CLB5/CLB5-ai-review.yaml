  review:
    summary: IBA to traversing the Start control point from node PTN000808767, whose experimental donor is the S.
      pombe G1/S B-type cyclin cig2 (SPAPB2B4.03). GO:0007089 is defined as commitment to S phase via the positive
      feedback between transcription and G1 CDK activity. In budding yeast that loop is Cln3-Whi5/SBF-Cln1/2; CLB5
      is a product of the Start transcriptional program and Clb5-Cdc28 is held inactive by Sic1 until after Start,
      then executes S-phase entry.
    action: MARK_AS_OVER_ANNOTATED
    reason: Clb5's role is the G1/S transition (GO:0000082, accepted) downstream of Start commitment, not the transcription/G1-CDK
      feedback that defines Start; clb5 clb6 cells pass Start (bud, duplicate SPBs) on schedule and only delay replication.
      Ectopic CLB5 can drive proliferation without Clns, but that is a bypass, not the native role. The propagated
      term therefore conflates S-phase execution with Start commitment; the CLB2 review makes the same call for
      the sister propagation.
    supported_by:
    - *id007
    - *id006
