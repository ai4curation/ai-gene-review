  review:
    summary: 'Generic protein binding from the Uetz et al. genome-wide two-hybrid screen (interactor: Cdc28, the
      CDK catalytic subunit). The interaction is real and central, but GO:0005515 conveys no molecular function
      and the Clb5-Cdc28 relationship is already captured by GO:0016538 and GO:0000307.'
    action: REMOVE
    reason: Per project curation policy, a bare GO:0005515 protein binding annotation carries no functional information
      and is removed unless the cited paper supports a more informative molecular function. The partner here is
      Cdc28 (Cdk1) itself, and Clb5's relationship to Cdc28 is already represented informatively by the cyclin-dependent
      protein serine/threonine kinase regulator activity rows (GO:0016538, IDA/IBA/IEA) and by the CDK holoenzyme
      complex row (GO:0000307, IPI), so this high-throughput row adds nothing. Removal does not dispute the reported
      interaction, which is the best-established physical interaction of Clb5 (UniProt IntAct NbExp=6).
    supported_by:
