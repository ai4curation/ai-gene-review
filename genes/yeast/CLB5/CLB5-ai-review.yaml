id: P30283
gene_symbol: CLB5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Clb5 is the principal S-phase B-type cyclin (cyclin A/B subfamily) of the budding yeast Saccharomyces
  cerevisiae and, with its paralog Clb6, the regulatory subunit of the S-phase form of the cyclin-dependent kinase
  Cdc28 (Cdk1). Clb5 has no catalytic activity of its own: it binds Cdc28, induces the active kinase conformation
  and, through the conserved hydrophobic patch of its cyclin fold, docks RXL/Cy-motif substrates such as Sic1, Orc6
  and Cdc6 onto the kinase. CLB5 is transcribed in late G1 as part of the MBF/SBF-dependent G1/S program together
  with CLN1, CLN2 and the DNA-replication genes; the newly formed Clb5-Cdc28 complex is held inactive by the stoichiometric
  inhibitor Sic1 until Cln-Cdc28 triggers Sic1 destruction, after which Clb5-Cdc28 phosphorylates replication-initiation
  factors (Sld2, Sld3 and the ORC/Cdc6 licensing machinery) to fire replication origins on schedule. clb5 cells
  initiate S phase but fire only early origins and take more than twice as long to complete replication; clb5 clb6
  cells cannot initiate replication on time and rely on the mitotic cyclins Clb1-4 for an inefficient S phase, while
  ectopic CLB5 can drive proliferation in the absence of Cln cyclins. Once origins have fired, origin-bound Clb5-Cdc28
  helps prevent re-licensing. Clb5 acts in the nucleus, concentrating there from before budding through S phase
  and associating with chromosomal origins until mitosis, and it is degraded by APC/C-Cdc20 at metaphase in a destruction-box-dependent
  manner. Secondary roles include cooperation with Clb3 and Clb4 during S phase to phosphorylate and inactivate
  APC/C-Cdh1 (Hct1), which allows accumulation of Cin8, Kip1, Ase1 and Clb2 for spindle pole body separation and
  spindle assembly, and recruitment with Cdk1 to DNA double-strand breaks where it promotes end resection and checkpoint
  signalling. In meiosis Clb5 and Clb6 are the only B-type cyclins able to drive premeiotic DNA replication; clb5
  clb6 diploids fail to replicate, do not activate the Mec1-dependent replication checkpoint and segregate unreplicated
  chromosomes. CLB5 is not essential for vegetative growth.'
