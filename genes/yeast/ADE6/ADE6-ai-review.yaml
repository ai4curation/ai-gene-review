- term:
    id: GO:0043101
    label: purine-containing compound salvage
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-285
  review:
    summary: RCA from YeastPathways PWY3O-285 (superpathway of purine biosynthesis and salvage pathways),
      a superpathway that unions de novo synthesis with base/nucleoside salvage. FGAM synthase converts
      FGAR to FGAM, an early de novo step that is bypassed by salvage of purine bases; Ade6 has no salvage
      role. ade6 mutants are adenine auxotrophs precisely because salvage of exogenous adenine bypasses
      the de novo pathway.
    action: REMOVE
    reason: Ade6 acts only in the de novo branch; salvage is inherited from a combined biosynthesis+salvage
      superpathway.
    supported_by:
    - reference_id: PMID:1743513
      supporting_text: Strains containing a disrupted ade6 allele were constructed and behaved as stable
        adenine auxotrophs
    - reference_id: PMID:9331966
      supporting_text: The ADE6 gene of Saccharomyces cerevisiae yeast encoding the enzyme formylglycinamidine-ribonucleotide
        (FGAM)-synthetase of de novo synthesis of purine nucleotides was cloned and sequenced
