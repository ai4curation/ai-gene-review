suggested_questions:
- question: Does yeast Ade6 participate in a dynamic purinosome-like assembly with other de novo purine
    enzymes under purine limitation, as reported for human PFAS?
suggested_experiments:
- description: Purify recombinant Ade6 and measure glutamine- versus ammonia-dependent FGAM formation
    to confirm the activity biochemically (current evidence is genetic and sequence-based).
