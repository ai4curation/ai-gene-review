id: P38972
gene_symbol: ADE6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADE6 (YGR061C) encodes phosphoribosylformylglycinamidine (FGAM) synthase (EC 6.3.5.3), a
  large single-chain glutamine amidotransferase (1358 aa) of the eukaryotic PurL type. It catalyses the
  fourth step of de novo purine biosynthesis, the ATP-dependent conversion of N2-formyl-N1-(5-phospho-D-ribosyl)glycinamide
  (FGAR) and glutamine to FGAM and glutamate, on the route to IMP. The enzyme is cytoplasmic. ade6 null
  mutants are stable adenine auxotrophs, and ADE6 transcription is repressed by exogenous adenine, like
  other ADE genes.
