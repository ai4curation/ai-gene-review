  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: PAINT annotation from the cytoplasmic LSM1-family node PTN000400406 indicating
      that LSM1 is involved in deadenylation-dependent decapping of nuclear-transcribed
      mRNA. The node placement is consistent with yeast IMP annotations from PMIDs
      10761922 and 15716506, which directly demonstrate Lsm1p involvement in mRNA
      decapping.
    action: ACCEPT
    reason: This is a core function of LSM1. The annotation is correct and represents
      the primary mechanistic role of the Lsm1-7-Pat1 complex. Bouveret et al. (2000)
      demonstrated that Lsm1p-Lsm7p complex activates the decapping step of mRNA degradation,
      with deletion mutants showing accumulation of capped mRNAs and blocks in mRNA
      decay. PAINT places this function at PTN000400406, the cytoplasmic LSM1 node
      rather than the spliceosomal Lsm2-8 node, and LSM1 itself is one of the descendant
      experimental seeds supporting the IBD.
