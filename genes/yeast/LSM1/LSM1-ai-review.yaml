- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:23222640
  review:
    summary: IDA evidence from global analysis of yeast mRNPs (messenger ribonucleoprotein
      particles) showing LSM1 associated with mRNA.
    action: ACCEPT
    reason: Direct evidence of LSM1 in mRNP complexes confirms functional mRNA binding.
      Consistent with IBA annotation and structural data showing RNA binding pocket.
    supported_by:
    - reference_id: PMID:23222640
      supporting_text: Global analysis of yeast mRNPs
  qualifier: enables
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IDA
  original_reference_id: PMID:23706738
  review:
    summary: IDA evidence for a nuclear "moonlighting" role of LSM1. Haimovich et
      al. (2013) report that cytoplasmic mRNA-decay ("decaysome") components shuttle
      to the nucleus and associate with chromatin just upstream of transcription start
      sites, where they stimulate transcription. This is a separate activity from
      LSM1's well-established cytoplasmic decapping-activation function.
    action: KEEP_AS_NON_CORE
    reason: The SGD curator made this an experimental (IDA) annotation from the full
      text, and the cached abstract independently describes decaysome components associating
      with chromatin near transcription start sites, so there is no basis for removing
      it by second-guessing the curator without full-text access. The nuclear chromatin
      association is nonetheless a secondary role distinct from LSM1's core cytoplasmic
      mRNA-decay function, so it is retained as non-core rather than accepted as core.
    supported_by:
    - reference_id: PMID:23706738
      supporting_text: these components shuttle between the cytoplasm and the nucleus,
        in a manner dependent on proper mRNA degradation. In the nucleus, they associate
        with chromatin-preferentially ∼30 bp upstream of transcription start-sites-and
        directly stimulate transcription initiation and elongation.
  qualifier: enables
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:23706738
  review:
    summary: IDA evidence showing nuclear localization from the "Gene expression is
      circular" study. LSM1 is detected in both nucleus and cytoplasm.
    action: KEEP_AS_NON_CORE
    reason: Nuclear localization is documented and consistent with the UniProt record,
      but it reflects the same secondary shuttling/chromatin-association phenomenon
      as the GO:0003682 annotation from this paper, not LSM1's core site of action.
      Retained as non-core for consistency with the chromatin binding entry and with
      core_functions, which lists only cytoplasm and P-body locations.
    supported_by:
    - reference_id: PMID:23706738
      supporting_text: these components shuttle between the cytoplasm and the nucleus,
        in a manner dependent on proper mRNA degradation
  qualifier: located_in
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:23706738
  review:
    summary: IDA evidence confirming cytoplasmic localization from direct observation
      studies.
    action: ACCEPT
    reason: Cytoplasm is the primary site of LSM1 function. Direct observation confirms
      expected localization.
    supported_by:
    - reference_id: PMID:23706738
      supporting_text: most yeast mRNAs are degraded by the cytoplasmic 5'-to-3' pathway
        (the "decaysome")
  qualifier: located_in
- term:
    id: GO:0000288
    label: nuclear-transcribed mRNA catabolic process, deadenylation-dependent decay
  evidence_type: IMP
  original_reference_id: PMID:10747033
  review:
    summary: IMP evidence from Bouveret et al. (2000) directly demonstrating LSM1
      involvement in deadenylation-dependent mRNA decay through deletion analysis.
    action: ACCEPT
    reason: LSM1 deletion mutants showed increased mRNA half-life and accumulation
      of capped mRNAs, demonstrating a block in the decapping step. This is the seminal
      paper identifying the Lsm1-7 complex role in mRNA decay. Core functional annotation.
    supported_by:
    - reference_id: PMID:10747033
      supporting_text: Deletions of LSM1, 6, 7 and PAT1 genes increased the half-life
        of reporter mRNAs. Interestingly, accumulating mRNAs were capped, suggesting
        a block in mRNA decay at the decapping step.
  qualifier: involved_in
- term:
    id: GO:0000290
    label: deadenylation-dependent decapping of nuclear-transcribed mRNA
  evidence_type: IMP
  original_reference_id: PMID:10761922
  review:
    summary: IMP evidence from Tharun et al. (2000) showing LSM1-Lsm7 mutations inhibit
      mRNA decapping and demonstrating interaction with decapping machinery.
    action: ACCEPT
    reason: Tharun et al. demonstrated that lsm mutations specifically block mRNA
      decapping, and that Lsm proteins co-immunoprecipitate with Dcp1 and mRNA. This
      establishes the mechanistic link between LSM1 and decapping activation. Duplicate
      IMP annotation with different PMID is appropriate as it provides additional
      mechanistic detail.
    supported_by:
    - reference_id: PMID:10761922
      supporting_text: mutations in seven yeast Lsm proteins (Lsm1-Lsm7) also lead
        to inhibition of mRNA decapping
  qualifier: involved_in
- term:
    id: GO:0000932
    label: P-body
  evidence_type: IMP
  original_reference_id: PMID:12730603
  review:
    summary: IMP evidence showing P-body function in mRNA decay where LSM1 acts as
      part of the decapping and decay machinery.
    action: ACCEPT
    reason: SGD manually curated this P-body annotation as IMP from the full Sheth
      & Parker paper. The cached abstract explicitly reports that decapping activators
      and catalysts concentrate in P-bodies and that mRNA-turnover blocks alter P-body
      abundance, matching the Lsm1-7-Pat1 complex's role in cytoplasmic decapping.
      The same paper also supports an IDA P-body row, so this IMP row is retained
      as an independent perturbation-based assertion of the same cellular component.
    supported_by:
    - reference_id: PMID:12730603
      supporting_text: proteins that activate or catalyze decapping are concentrated
        in P bodies
  qualifier: located_in
- term:
    id: GO:0000932
