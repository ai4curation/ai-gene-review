suggested_experiments:
- description: Purify NuA4, free piccolo NuA4 and NuA3 from eaf6 deletion cells and compare subunit composition
    and acetyltransferase activity on nucleosomes (H4, H2A, H3K14) with wild type; in parallel, analyse
    native free piccolo NuA4 by mass spectrometry for Eaf6.
  experiment_type: biochemical purification and HAT assay
knowledge_gaps:
- gap_statement: What Eaf6 contributes to NuA4 and NuA3, and whether native piccolo NuA4 contains it,
    are not known.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Eaf6 is part of the reconstituted and crystallized NuA4 HAT module and a core NuA3 subunit,
    but no study shows it is needed for assembly, stability or acetyltransferase activity of either complex,
    and the native piccolo NuA4 complex was first described as Esa1, Epl1 and Yng2. Measuring H4, H2A
    and H3K14 acetylation and complex integrity in eaf6 cells, and the subunit composition of native piccolo
    NuA4, would settle its role.
  provenance:
  - reference_id: file:yeast/EAF6/EAF6-deep-research-claude-code.md
    supporting_text: No source found shows that Eaf6 is required for piccolo assembly or for HAT activity.
  - reference_id: PMID:12782659
    supporting_text: The picNuA4 complex contains Esa1, Epl1, and Yng2 as subunits and strongly prefers
      chromatin over free histones as substrate.
  - *id012
