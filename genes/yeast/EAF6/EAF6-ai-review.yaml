description: 'Eaf6 (ESA1-associated factor 6, YJR082C) is a small (113-residue), non-catalytic, nuclear
  subunit shared by two MYST-family histone acetyltransferase complexes of budding yeast. In NuA4 it is
  one of the four subunits of the catalytic HAT module (piccolo NuA4), with the acetyltransferase Esa1,
  the scaffold Epl1 and the ING protein Yng2; the module acetylates nucleosomal histones H4 and H2A. In
  NuA3 it is a core subunit with the acetyltransferase Sas3, Nto1, Yng1 and Taf14, in both NuA3 forms:
  NuA3a, which binds H3K4me3 through the Yng1 PHD finger and acetylates H3K14 at promoters, and NuA3b,
  which additionally contains the PWWP protein Pdp3 and binds H3K36me3 in coding regions. Eaf6 has a predicted
  N-terminal coiled coil and no catalytic or histone-reader domain. It is not essential, and its specific
  contribution to the assembly or activity of either complex has not been defined.'
