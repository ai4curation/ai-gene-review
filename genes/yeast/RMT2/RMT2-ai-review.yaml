suggested_experiments:
- hypothesis: >-
    The positive translational-fidelity effect of Rmt2 is caused by loss of
    Rpl12 Arg67 N5 methylation.
  description: >-
    Compare rmt2 deletion with RPL12A/RPL12B Arg67 substitution strains in
    stop-codon readthrough, amino-acid misincorporation, programmed -1
    frameshifting and polysome assays, then test rescue with catalytically active
    and inactive Rmt2.
- hypothesis: >-
    Rmt2 methylates Rpl12 in a nuclear or nuclear-pore-associated compartment
    before completion of 60S assembly.
  description: >-
    Combine compartment-restricted Rmt2 variants, pulse labeling or targeted
    mass spectrometry of nascent Rpl12, and nuclear-pore perturbations to measure
    where Arg67 methylation occurs and whether nuclear-pore association is needed
    for efficient modification.
