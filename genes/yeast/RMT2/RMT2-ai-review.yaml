core_functions:
- description: >-
    Rmt2 catalyzes S-adenosyl-L-methionine-dependent N5/delta methylation of
    arginine residues in proteins. Its verified substrate is ribosomal protein
    L12/Rpl12, which it monomethylates at Arg67, and this activity is associated
    with cytoplasmic and nuclear Rmt2 pools, including a fraction near nuclear
    pores.
