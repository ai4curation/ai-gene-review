suggested_questions:
- question: >-
    Does Rmt2 methylate any physiologically important substrates besides
    Rpl12A/Rpl12B in S. cerevisiae?
- question: >-
    Which Rmt2 pool performs Rpl12 Arg67 methylation: cytoplasmic Rmt2 acting
    on newly synthesized Rpl12, nuclear/nuclear-envelope Rmt2 acting during
    pre-60S assembly, or both pools?
suggested_experiments:
- hypothesis: >-
    Rpl12 Arg67 methylation is sufficient to explain the rmt2Delta translation
    fidelity and 60S subunit phenotypes.
  description: >-
    Create rpl12A/RPL12B Arg67-to-Lys and methylation-mimic alleles as the only
    cellular Rpl12 copies, then compare Rpl12 methylation, 60S/40S ratios,
    amino acid misincorporation, stop-codon readthrough and programmed -1
    frameshifting against wild type and rmt2Delta cells.
  experiment_type: ribosome biochemistry
