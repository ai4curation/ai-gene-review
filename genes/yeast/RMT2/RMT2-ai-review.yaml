proposed_new_terms:
- proposed_name: peptidyl-arginine N5-methylation
  proposed_definition: >-
    The methylation of the delta nitrogen of a peptidyl-arginine residue to form
    peptidyl-N5-methyl-L-arginine.
  justification: >-
    GO has a generic peptidyl-arginine N-methylation term and omega-N product
    terms, but no biological-process child for type IV protein arginine
    methyltransferases such as S. cerevisiae Rmt2 that form
    peptidyl-N5-methyl-L-arginine at the delta nitrogen.
  proposed_parent:
    id: GO:0035246
    label: peptidyl-arginine N-methylation
  supported_by:
  - reference_id: PMID:9873020
    supporting_text: >-
      YDR465c mutant has a defect in the
      methylation of the delta-nitrogen atom of arginine residues
suggested_questions:
- question: >-
    Should GO add a peptidyl-arginine N5-methylation child of GO:0035246 so
    type IV protein arginine methyltransferase reactions can be distinguished
    from omega-N methylation, and should GOA use an annotation extension to
    record Rpl12 Arg67 as Rmt2's verified methyl-acceptor residue?
- question: >-
    Does the nuclear-pore-proximal pool of Rmt2 methylate newly imported Rpl12
    during 60S pre-ribosome assembly, and is this pool regulated after DNA
