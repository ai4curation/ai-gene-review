id: Q03305
gene_symbol: RMT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  RMT2 encodes a fungal type IV protein arginine methyltransferase of the
  class I-like SAM-binding methyltransferase superfamily. Rmt2 transfers a methyl
  group from S-adenosyl-L-methionine to the N5/delta nitrogen of arginine residues
  in proteins, with ribosomal protein L12 as a verified substrate at Arg67. The
  enzyme is detected in both the cytoplasm and nucleus and is enriched near the
  nuclear envelope and nuclear pores; loss of Rmt2 perturbs 60S ribosomal-subunit
  abundance and decreases translation fidelity, consistent with an indirect
  ribosome-assembly and ribosome-performance consequence of failed Rpl12
  methylation.
