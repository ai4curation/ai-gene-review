product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Rmt2 is a S-adenosyl-L-methionine-dependent type-IV protein arginine
  methyltransferase in Saccharomyces cerevisiae. It monomethylates the
  delta-nitrogen of Arg67 in ribosomal protein L12/Rpl12 and localizes to both
  the cytoplasm and nucleus, including a pool near the nuclear envelope and
  nuclear pore complex. Loss of Rmt2 perturbs 60S ribosomal subunit abundance
  and reporter readouts of translation fidelity.
