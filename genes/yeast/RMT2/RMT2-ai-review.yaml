- term:
    id: GO:0045903
    label: positive regulation of translational fidelity
  evidence_type: IDA
  original_reference_id: PMID:26801560
  qualifier: involved_in
  review:
    summary: Reporter assays link Rmt2 to translational accuracy.
    action: ACCEPT
    reason: >-
      Clarke and colleagues tested rmt2Delta alongside other ribosomal protein
      methyltransferase mutants and showed increased stop-codon readthrough,
      amino acid misincorporation, and programmed -1 frameshifting. The effect
      is a direct consequence of losing methylation of a ribosomal protein
      substrate rather than a remote pleiotropic phenotype.
    supported_by:
    - &fidelity_paper
      reference_id: PMID:26801560
      supporting_text: >-
        Loss of each of the ten ribosomal protein methyltransferases resulted
        in increased readthrough of the UAA and UAG stop codons
