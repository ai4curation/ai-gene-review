- term:
    id: GO:0045903
    label: positive regulation of translational fidelity
  evidence_type: IDA
  original_reference_id: PMID:26801560
  qualifier: involved_in
  review:
    summary: >-
      Rmt2 contributes to accurate translation, but this reporter phenotype is a
      downstream ribosome-performance output of defective ribosomal-protein
      methylation, so it is retained as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      The 2016 ribosomal-protein methyltransferase study assayed rmt2 deletion
      with dual-luciferase reporters for stop-codon readthrough, amino-acid
      misincorporation, and programmed -1 frameshifting. These data support a
      translational-fidelity role, but the direct biochemical work performed by
      Rmt2 is N5 methylation of L12/Rpl12 rather than a direct translation step.
    supported_by:
    - reference_id: PMID:26801560
      supporting_text: >-
        Loss of each of the ten ribosomal protein methyltransferases resulted in
        increased readthrough of the UAA and UAG stop codons
