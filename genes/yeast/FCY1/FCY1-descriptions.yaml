descriptions:
- source: UniProt
  text: Catalyzes the hydrolytic deamination of cytosine to uracil or 5-methylcytosine
    to thymine. Is involved in the pyrimidine salvage pathway, which allows the cell
    to utilize cytosine for pyrimidine nucleotide synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12178
  source_id: Q12178
- source: Alliance_Imported
  text: Cytosine deaminase; zinc metalloenzyme that catalyzes the hydrolytic deamination
    of cytosine to uracil; of biomedical interest because it also catalyzes the deamination
    of 5-fluorocytosine (5FC) to form anticancer drug 5-fluorouracil (5FU)
  source_type: curated
  url: https://www.yeastgenome.org/locus/FCY1
  source_id: SGD:S000006266
- source: Alliance_Automated
  text: Enables cytosine deaminase activity. Involved in cytidine metabolic process;
    cytosine metabolic process; and pyrimidine-containing compound salvage. Located
    in cytoplasm and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/FCY1
  source_id: SGD:S000006266
