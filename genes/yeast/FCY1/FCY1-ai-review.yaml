- term:
    id: GO:0008835
    label: diaminohydroxyphosphoribosylaminopyrimidine deaminase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002254009
  - UniProtKB:P25539
  review:
    summary: 'IBA diaminohydroxyphosphoribosylaminopyrimidine (DRAP) deaminase activity from PTN002254009 with E.
      coli RibD (P25539) as the only donor: a deep node in the CMP/dCMP deaminase superfamily covering the riboflavin-pathway
      deaminases. Fcy1 is a 158-residue single-domain cytosine deaminase with no reported activity on riboflavin
      intermediates; in S. cerevisiae the DRAP deaminase step of riboflavin synthesis is carried out by the deaminase
      domain of Rib2, and fcy1 nulls are not reported as riboflavin auxotrophs (they grow normally and are used
      as a 5-FC counter-selectable marker).'
    action: REMOVE
    reason: Over-propagation of a riboflavin-pathway deaminase function across the deaminase superfamily into the
      cytosine-deaminase lineage; the yeast DRAP deaminase is Rib2.
    supported_by:
    - *id001
    - reference_id: file:yeast/RIB2/RIB2-uniprot.txt
      supporting_text: 'RecName: Full=Diaminohydroxyphosphoribosylaminopyrimidine deaminase;'
    propagation_review:
