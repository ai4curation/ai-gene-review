id: Q12178
gene_symbol: FCY1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FCY1 (YPR062W) encodes cytosine deaminase (EC 3.5.4.1), a 158-residue zinc-dependent homodimeric enzyme
  of the cytidine/deoxycytidylate deaminase (CDA-fold) family, unrelated to bacterial CodA. It hydrolyses cytosine
  (and 5-methylcytosine) to uracil and ammonia in the cytoplasm, allowing cytosine, and cytidine after Urh1 cleavage,
  to be salvaged via Fur1 to UMP; it is the limiting step for cytidine utilisation as a UMP precursor. fcy1 mutants
  lose all cytosine deaminase activity and are highly resistant to 5-fluorocytosine, which Fcy1 converts to 5-fluorouracil;
  this property makes yeast cytosine deaminase a widely used prodrug-activating enzyme and counter-selectable marker.
  It has been extensively characterised structurally and mechanistically.
