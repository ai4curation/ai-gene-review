- source: Alliance_Automated
  text: Enables several functions, including DNA binding activity; histone H3K4me3
    reader activity; and nucleosome array spacer activity. Involved in several processes,
    including DNA-templated transcription; double-strand break repair; and regulation
    of transcriptional start site selection at RNA polymerase II promoter. Located
    in nucleolar chromatin. Part of SAGA complex and SLIK (SAGA-like) complex. Is
    active in site of double-strand break. Used to study prostate cancer. Human ortholog(s)
    of this gene implicated in Pilarowski-Bjornsson syndrome; castration-resistant
    prostate carcinoma; developmental and epileptic encephalopathy 94; and prostate
    cancer. Orthologous to human CHD1 (chromodomain helicase DNA binding protein 1)
    and CHD2 (chromodomain helicase DNA binding protein 2).
