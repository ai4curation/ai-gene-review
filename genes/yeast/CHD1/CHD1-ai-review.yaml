taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'CHD1 (Chromatin Helicase DNA-binding protein 1) is an ATP-dependent
  chromatin remodeling enzyme

  that functions as a monomeric protein in yeast. It catalyzes nucleosome sliding
  and spacing through

  ATP hydrolysis, positioning nucleosomes into regular arrays with ~159 bp spacing.
  CHD1 contains

  paired N-terminal chromodomains, a central SNF2-related ATPase catalytic domain,
  and a C-terminal

  DNA-binding domain (SANT/SLIDE). During transcription elongation, CHD1 works with
  RNA Pol II elongation

  factors (Paf1, FACT) to maintain chromatin integrity as polymerase traverses nucleosomal
  obstacles.

  CHD1 also functions in DNA double-strand break repair, heterochromatin organization,
  and nucleosome

  spacing maintenance. Unlike mammalian CHD1, yeast CHD1 chromodomains do not bind
  H3K4me3; rather,

  CHD1 is recruited to genes via elongation factor interactions.

  '
