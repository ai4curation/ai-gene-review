    label: histone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: CHD1 contains SANT and SLIDE domains with intrinsic histone-binding capacity.
      However, biochemical studies show CHD1 makes minimal direct contacts with histone
      proteins during nucleosome remodeling, relying predominantly on DNA interactions.
      IBA annotation reflects ortholog conservation but oversimplifies the actual
      mechanism.
    action: KEEP_AS_NON_CORE
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN002473914
