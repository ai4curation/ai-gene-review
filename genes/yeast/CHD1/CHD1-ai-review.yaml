      **SNF2-family ATP-dependent chromatin remodeller** that uses ATP hydrolysis
      to translocate nucleosomal DNA and thereby **slide and space nucleosomes**,
      particularly over **actively transcribed gene bodies**.'
- molecular_function:
    id: GO:0140658
    label: ATP-dependent chromatin remodeler activity
  description: Transcription-coupled chromatin restoration - CHD1 re-establishes regular
    nucleosome organization in coding regions in the wake of RNA polymerase II passage,
    suppressing exposure of cryptic internal promoters; this maintenance role is coordinated
    with elongation factors (Paf1C/Rtf1, FACT).
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:yeast/CHD1/CHD1-deep-research-falcon.md
    supporting_text: Chd1 is thought to help **re-establish nucleosome organization
      after RNA polymerase II passage**, maintaining chromatin structure over coding
      regions and preventing inappropriate exposure of internal promoter-like DNA.
