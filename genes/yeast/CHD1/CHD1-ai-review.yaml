        comment: PAINT places histone binding on the CHD1/CHD2-like node; this is
          phylogenetically defensible but secondary to direct nucleosomal DNA and
          chromatin engagement by yeast Chd1.
    reason: While histone binding capacity exists structurally, CHD1's primary nucleosome
      engagement mechanism relies on DNA binding through its SANT/SLIDE domains rather
      than histone contacts. This is a secondary capability, not the primary functional
      mode. Better core terms available (chromatin binding, DNA binding).
    supported_by:
