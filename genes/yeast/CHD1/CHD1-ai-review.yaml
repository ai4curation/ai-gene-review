    label: ATP-dependent chromatin remodeler activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: This is the defining molecular function of CHD1. CHD1 catalyzes ATP-dependent
      nucleosome repositioning and spacing through a ratcheting mechanism of its ATPase
      domain lobes. Cryo-EM structures confirm ATP-dependent conformational changes
      drive nucleosome translocation.
    action: ACCEPT
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002473914
        source_status: SUPPORTS_TRANSFER
        comment: PAINT places ATP-dependent chromatin remodeler activity on the
          CHD1/CHD2-like ancestral node, and yeast Chd1 is one of the descendant
          experimental seeds for the IBD.
    reason: Core catalytic function. IBA annotation is fully justified by extensive
      biochemical and structural evidence. CHD1 is the paradigmatic ATP-dependent
      chromatin remodeler in yeast.
    supported_by:
    - reference_id: PMID:10811623
      supporting_text: Biochemical experiments using Chd1p purified from yeast showed
        that it reconfigures the structure of nucleosome core particles
    - reference_id: file:yeast/CHD1/CHD1-deep-research-falcon.md
      supporting_text: Yeast Chd1 is a **monomeric, helicase-type ATPase chromatin
        remodeller** that engages nucleosomal DNA with its ATPase motor at **superhelix
        location 2 (SHL2), ~20 bp from the dyad**, and shifts DNA around the histone
        core through a stepwise translocation cycle, repositioning nucleosomes along
        DNA.
