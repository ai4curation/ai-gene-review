descriptions:
- source: Alliance_Imported
  text: Orotidine-5'-phosphate (OMP) decarboxylase; catalyzes the sixth enzymatic
    step in the de novo biosynthesis of pyrimidines, converting OMP into uridine monophosphate
    (UMP); converts 5-FOA into 5-fluorouracil, a toxic compound
  source_type: curated
  url: https://www.yeastgenome.org/locus/URA3
  source_id: SGD:S000000747
- source: Alliance_Automated
  text: Enables orotidine-5'-phosphate decarboxylase activity. Involved in 'de novo'
    pyrimidine nucleobase biosynthetic process and UMP biosynthetic process. Located
    in cytosol. Human ortholog(s) of this gene implicated in orotic aciduria and purine-pyrimidine
    metabolic disorder. Orthologous to human UMPS (uridine monophosphate synthetase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/URA3
  source_id: SGD:S000000747
