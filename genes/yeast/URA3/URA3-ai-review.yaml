id: P03962
gene_symbol: URA3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: URA3 encodes orotidine 5'-phosphate decarboxylase (ODCase, EC 4.1.1.23), the sixth and final
  enzyme of de novo UMP biosynthesis in Saccharomyces cerevisiae. The ~30 kDa TIM-barrel enzyme decarboxylates
  OMP (made by Ura5/Ura10) to UMP and CO2 without any cofactor; it is a monomer at low concentration and
  dimerises in the presence of substrate, product or active-site inhibitors, and has a very low Km for
  OMP. Ura3 is a soluble cytosolic protein, encoded by a gene induced by pathway intermediates via Ppr1.
  Because ura3 mutants are uracil auxotrophs and Ura3 converts 5-fluoroorotic acid into a toxic product,
  URA3 is one of the most widely used selectable and counter-selectable markers in yeast genetics.
