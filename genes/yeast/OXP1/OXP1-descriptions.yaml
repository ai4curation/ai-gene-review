descriptions:
- source: UniProt
  text: Catalyzes the cleavage of 5-oxo-L-proline to form L-glutamate coupled to the
    hydrolysis of ATP to ADP and inorganic phosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P28273
  source_id: P28273
- source: Alliance_Imported
  text: 5-oxoprolinase; enzyme is ATP-dependent and functions as a dimer; similar
    to mouse Oplah gene; green fluorescent protein (GFP)-fusion protein localizes
    to the cytoplasm; protein abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/OXP1
  source_id: SGD:S000001698
- source: Alliance_Automated
  text: Enables 5-oxoprolinase (ATP-hydrolyzing) activity. Acts upstream of or within
    glutathione metabolic process. Located in cytoplasm. Human ortholog(s) of this
    gene implicated in amino acid metabolic disorder. Orthologous to human OPLAH (5-oxoprolinase,
    ATP-hydrolysing).
  source_type: automated
