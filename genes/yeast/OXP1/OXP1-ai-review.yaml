  label: Saccharomyces cerevisiae S288C
description: Oxp1 (YKL215C) is the ATP-dependent 5-oxoprolinase (EC 3.5.2.9) of Saccharomyces cerevisiae,
  a 1286-residue cytoplasmic homodimer of the hydantoinase/oxoprolinase family. It hydrolyses 5-oxo-L-proline
  (pyroglutamate) to L-glutamate coupled to ATP hydrolysis, using an actin-like ATPase motif. 5-oxoproline
  is generated from glutathione by the ChaC-type cyclotransferase Gcg1 and by non-enzymatic cyclisation
  of glutamine/glutamate; Oxp1 recycles it to glutamate, and its deletion causes intracellular 5-oxoproline
  accumulation.
