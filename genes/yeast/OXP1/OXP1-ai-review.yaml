suggested_questions:
- question: What fraction of cellular 5-oxoproline derives from Gcg1-mediated GSH degradation versus spontaneous
    glutamine/glutamate cyclisation in yeast?
suggested_experiments:
- hypothesis: Gcg1 is the main enzymatic source of the 5-oxoproline that Oxp1 clears.
  description: Quantify 5-oxoproline by LC-MS in oxp1 and oxp1 gcg1 strains, with 13C-glutathione tracing.
