taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Sol4 (YGR248W) is one of two catalytically active 6-phosphogluconolactonases (EC 3.1.1.31) of Saccharomyces cerevisiae,
  together with its closer paralog Sol3. It hydrolyses 6-phospho-D-glucono-1,5-lactone, the product of glucose-6-phosphate
  dehydrogenase (Zwf1), to 6-phospho-D-gluconate, the second step of the oxidative branch of the pentose phosphate pathway.
  Sol4 belongs to the glucosamine/galactosamine-6-phosphate isomerase (NagB) fold family, 6-phosphogluconolactonase subfamily.
  Multicopy SOL4 raises cellular 6-phosphogluconolactonase activity above wild type, whereas deletion of the whole SOL family
  (SOL1-SOL4) leaves little or no activity; the more distant paralogs Sol1 and Sol2 lack detectable lactonase activity and
  instead affect tRNA nuclear export. Sol4 is a cytosolic protein (GST-tagged Sol4 is nuclear-excluded; genome-wide GFP tagging
  also reported a nuclear signal). SOL4 is not essential and has no detectable role in tRNA export.
