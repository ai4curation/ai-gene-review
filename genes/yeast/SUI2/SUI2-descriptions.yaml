- source: RefSeq
  text: Contributes to GTP binding activity and methionyl-initiator methionine tRNA
    binding activity. Involved in formation of translation preinitiation complex.
    Located in cytoplasmic stress granule. Part of eukaryotic 48S preinitiation complex;
    eukaryotic translation initiation factor 2 complex; and multi-eIF complex. Is
    active in cytoplasm. Used to study leukodystrophy. Human ortholog(s) of this gene
    implicated in Alzheimer's disease. Orthologous to human EIF2S1 (eukaryotic translation
    initiation factor 2 subunit alpha). [provided by Alliance of Genome Resources,
    Apr 2025]
