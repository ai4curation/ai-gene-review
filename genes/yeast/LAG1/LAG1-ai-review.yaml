core_functions:
- description: Catalytic subunit (redundant with paralog Lac1) of the ER acyl-CoA dependent ceramide synthase; N-acylates
    phytosphingosine and dihydrosphingosine with very long chain (C26) acyl-CoA to form phytoceramide/dihydroceramide
    (EC 2.3.1.24/2.3.1.297).
