      and acyl-CoA–dependent ceramide synthase reaction.
suggested_questions:
- question: Lag1 and Lac1 are redundant for viability but differ in sphingoid-base preference and ER subdomain localisation;
    does Lag1-specific phytoceramide synthesis have a distinct physiological output (e.g. ER diffusion barriers,
    lifespan) separable from bulk sphingolipid synthesis?
suggested_experiments:
- description: Purify Lag1-only and Lac1-only complexes (with Lip1) and compare kinetic parameters for PHS versus
    DHS and C24/C26-CoA, to quantify paralog specialisation.
