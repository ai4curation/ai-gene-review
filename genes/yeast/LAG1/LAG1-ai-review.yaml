id: P38703
gene_symbol: LAG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lag1 (longevity assurance gene 1) is a multi-pass integral membrane protein of the endoplasmic reticulum
  and one of two redundant catalytic subunits (with its paralog Lac1) of the acyl-CoA dependent, fumonisin B1-sensitive
  ceramide synthase of Saccharomyces cerevisiae. The enzyme transfers very long chain (mainly C26) fatty acyl groups
  from acyl-CoA onto the sphingoid bases phytosphingosine and dihydrosphingosine, producing the phytoceramide/dihydroceramide
  backbone of all yeast complex sphingolipids (IPC, MIPC, M(IP)2C). Lag1 and Lac1 co-purify with the small single-span
  subunit Lip1 in a heterotetrameric ceramide synthase complex. Lag1 belongs to the TLC-domain ceramide synthase
  (CerS) family conserved to human CERS1-6. Lag1 prefers phytosphingosine and is enriched in the nuclear and cortical
  ER; it is phosphorylated by Ypk1 downstream of TORC2 to stimulate sphingolipid synthesis. Loss of both LAG1 and
  LAC1 abolishes acyl-CoA dependent ceramide synthesis, causing severe growth defects, slowed ER-to-Golgi transport
  of GPI-anchored proteins and defective GPI-anchor lipid remodelling; LAG1 deletion alone extends replicative lifespan.
