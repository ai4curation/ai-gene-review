descriptions:
- source: UniProt
  text: Component of the ceramide synthase complex that catalyzes the transfer of
    the acyl chain from acyl-CoA to a sphingoid base, with high selectivity toward
    hexacosanoyl-CoA (C26:0-CoA) (PubMed:11694577, PubMed:12869556, PubMed:37953642).
    N-acylates sphinganine and phytosphingosine bases to form dihydroceramides and
    phytoceramides, respectively (PubMed:12869556). Has a higher affinity for phytosphingosine
    (PHS) than dihydrosphingosine (DHS), and thus preferentially produces phytoceramides
    for the establishment of lateral diffusion barriers in the cortical endoplasmic
    reticulum and nuclear envelope (PubMed:31164445). Redundant with LAC1 but requires
    SUR2 to compensate for sphingolipid biosynthesis (PubMed:31164445, PubMed:39528796).
    Disruption or inhibition of sphingolipid synthesis leads to the activation and
    phosphorylation of YPK1 through the TORC2 and PKH1 pathways, which phosphorylates
    ORM1 and LAG1 to activate sphingolipid synthesis (PubMed:34492164). Facilitates
    ER-to-Golgi transport of GPI-anchored proteins. Involved in the aging process.
    Along with LAC1, plays a role in pheromone-induced MAP kinase- activation of mating
    and formation of diploid cells (PubMed:26726837). May also play a role, together
    with LAC1, in the polarized membrane distribution of phosphatidylinositol 4,5
    biphosphate required for STE5 localization to the plasma membrane (PubMed:26726837).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38703
  source_id: P38703
- source: Alliance_Imported
  text: Ceramide synthase component; involved in synthesis of ceramide from C26(acyl)-coenzyme
    A and dihydrosphingosine or phytosphingosine, functionally equivalent to Lac1p;
    forms ER foci upon DNA replication stress; homolog of human CERS2, a tumor metastasis
    suppressor gene whose silencing enhances invasion/metastasis of prostate cancer
    cells; LAG1 has a paralog, LAC1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/LAG1
  source_id: SGD:S000000995
- source: Alliance_Automated
  text: Enables sphingosine N-acyltransferase activity. Involved in ceramide biosynthetic
    process. Located in endoplasmic reticulum. Part of acyl-CoA ceramide synthase
    complex. Used to study hepatocellular carcinoma; steatotic liver disease; and
    type 2 diabetes mellitus. Human ortholog(s) of this gene implicated in autosomal
    recessive congenital ichthyosis 9. Orthologous to several human genes including
    CERS2 (ceramide synthase 2); CERS4 (ceramide synthase 4); and CERS6 (ceramide
    synthase 6).
