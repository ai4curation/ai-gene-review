descriptions:
- source: UniProt
  text: DNA-dependent RNA polymerase catalyzes the transcription of DNA into RNA using
    the four ribonucleoside triphosphates as substrates. Specific peripheric component
    of RNA polymerase III which synthesizes small RNAs, such as 5S rRNA and tRNAs.
    Essential for tRNA synthesis. The RPC53/RPC4-RPC37/RPC5 subcomplex is required
    for terminator recognition and reinitiation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25441
  source_id: P25441
- source: Alliance_Imported
  text: RNA polymerase III subunit C53
  source_type: curated
  url: https://www.yeastgenome.org/locus/RPC53
  source_id: SGD:S000002309
- source: Alliance_Automated
  text: Contributes to DNA-directed RNA polymerase activity. Involved in tRNA transcription
    by RNA polymerase III; termination of RNA polymerase III transcription; and transcription
    initiation at RNA polymerase III promoter. Part of RNA polymerase III complex.
    Orthologous to human POLR3D (RNA polymerase III subunit D).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RPC53
  source_id: SGD:S000002309
