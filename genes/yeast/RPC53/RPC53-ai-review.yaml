core_functions:
- description: Non-catalytic, Pol III-specific subunit that forms the C53/C37 heterodimer (TFIIF-like dimerization module)
    on the polymerase lobe. As part of Pol III it contributes to DNA-directed RNA synthesis, slowing elongation so that
    Pol III recognises oligo(dT) terminators, and, with C11, enabling facilitated reinitiation. Complex membership and
    tRNA transcription are inherited at the eukaryotic PAINT node PTN000334172. The termination, reinitiation and
    promoter-opening roles are established experimentally in S. cerevisiae only.
  contributes_to_molecular_function:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
