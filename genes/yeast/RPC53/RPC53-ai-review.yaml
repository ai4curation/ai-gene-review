- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007811
  review:
    summary: InterPro2GO mapping from the RPC4 family signature (IPR007811) to DNA binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: No experiment shows that C53 binds DNA by itself. The evidence is photo-crosslinking, which places a segment
      of C53 next to the template strand inside the assembled Pol III elongation complex (PMID:19940126). That shows
      proximity within the polymerase, not an autonomous DNA-binding activity of the subunit. Template DNA is bound by the
      polymerase as a whole, and that role is captured by complex membership and the transcription process terms. The
      family-level mapping overstates what is known for this subunit.
    supported_by:
    - reference_id: PMID:19940126
      supporting_text: Protein-RNA and protein-DNA photochemical cross-linking analysis places a segment of C53 close to the
        RNA 3' end and transcribed DNA strand at the catalytic center of the pol III elongation complex.
- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IDA
  original_reference_id: PMID:3905793
  qualifier: contributes_to
  review:
    summary: Anti-C53 antibodies inhibited specific in vitro transcription of a tRNA gene by purified Pol III. C53 co-purifies
      with the enzyme as one of its subunits.
    action: ACCEPT
    reason: The annotation carries the contributes_to qualifier and is judged on that weaker claim. C53 is a stable subunit
      of the Pol III enzyme, which catalyses the reaction. C53 is not a catalytic subunit, since Pol III lacking C53/C37/C11
      still elongates (PMID:16362040, PMID:19940126). As a subunit, though, it contributes to the activity of the holoenzyme,
      especially at initiation and termination. Antibody inhibition of specific transcription (PMID:3905793, abstract only)
      fits that view. PAINT did not propagate this MF to PTN000334172, so this is a yeast-experimental statement only.
    supported_by:
    - reference_id: PMID:3905793
      supporting_text: Transcription of the tRNAGlu3 gene in vitro was inhibited when RNA polymerase C was preincubated with
        antibodies directed to C128, C82, C53, C34, C23, or C19.
