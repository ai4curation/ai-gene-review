id: P25441
gene_symbol: RPC53
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: RPC53 (C53; YDL150W) encodes an essential, RNA polymerase III-specific subunit of 422 residues, the yeast
  member of the RPC4/POLR3D family. Its conserved C-terminal domain forms a tight heterodimer with C37 (RPC37) that sits
  below the polymerase lobe, analogous to the Pol II initiation factor TFIIF and the Pol I A49/A34 subcomplex. The flexible,
  charged N-terminal region extends towards the active-site cleft. Together with C11, the C53/C37 subcomplex lets Pol III
  recognise oligo(dT) terminators by slowing elongation and supports facilitated reinitiation of transcription. The C53/C37
  subcomplex also helps the transcription bubble open and propagate to the start site during initiation. C53 is a non-catalytic
  subunit that contributes to synthesis of tRNAs and other small nuclear RNAs by the nucleoplasmic Pol III enzyme, and
  temperature-sensitive rpc53 mutants rapidly lose tRNA synthesis.
