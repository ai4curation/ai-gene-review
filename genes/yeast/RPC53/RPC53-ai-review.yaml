    label: transcription initiation at RNA polymerase III promoter
  evidence_type: IDA
  original_reference_id: PMID:16362040
  qualifier: involved_in
  review:
    summary: Pol III reconstituted with C37–C53 but lacking C11 performs only single-round transcription. With C11 it
      performs facilitated reinitiation, committing to the same gene.
    action: ACCEPT
    reason: Reinitiation, the initiation of later transcription cycles, needs the C37–C53 subcomplex (with C11). Independent
      work shows that C53/C37 is also needed for the transcription bubble to propagate to the start site during the first
      round of initiation (PMID:19940126). Together these establish that C53 does part of the work of Pol III initiation.
      Yeast-experimental only; PAINT did not propagate it.
    supported_by:
    - reference_id: PMID:16362040
      supporting_text: the presence of the C37–C53 complex required the simultaneous addition of C11 to Pol IIIΔ for the enzyme
        to reinitiate after the first round of transcription
    - reference_id: PMID:19940126
      supporting_text: In the absence of C53 and C37, the transcription bubble fails to stably propagate to and beyond the transcriptional
        start site even when the DNA template is supercoiled.
