  supported_by:
  - reference_id: PMID:16362040
    supporting_text: The specific requirement for the C37–C53 complex in terminator recognition was determined.
  - reference_id: PMID:19940126
    supporting_text: the C53/C37 subcomplex additionally plays a role in formation of the initiation-ready open promoter complex
  - reference_id: PMID:26605533
    supporting_text: C53 is located below the lobe and extension 2 and its C-terminal dimerization domain is indeed tightly
      associated with the C37 dimerization domain
  - reference_id: PMID:1406624
    supporting_text: Temperature-sensitive rpc53 mutants were generated and showed a rapid inhibition of tRNA synthesis after
      transfer to the restrictive temperature.
suggested_questions:
- question: Should GO have a Pol III-specific child of GO:0001112 (DNA-templated transcription open complex formation) to capture
    the C53/C37 role in promoter opening shown by Kassavetis et al. (PMID:19940126), analogous to the Pol II-specific GO:0001113?
- question: Which experimentally established yeast C53 roles (terminator recognition, reinitiation, promoter opening) are
    conserved in fungal and metazoan RPC4/POLR3D orthologs, given that PAINT propagated only complex membership and tRNA
    transcription from PTN000334172?
- question: What does the flexible, charged ~270-residue N-terminal region of C53, which is not conserved with POLR3D, contribute
    in vivo, given that it reaches the cleft and funnel in crosslinking studies?
suggested_experiments:
- description: Make in vivo truncations of the C53 N-terminal extension, keeping the C-terminal dimerization domain, and measure
    terminator read-through and reinitiation by nascent-RNA profiling (e.g. CRAC/NET-seq of Pol III) at tRNA genes.
- description: Run in vitro termination and promoter-opening assays with Pol IIIΔ reconstituted with C37 and human POLR3D or
    Neurospora RPC4 to test whether the yeast-defined activities transfer across the PTN000334172 clade.
