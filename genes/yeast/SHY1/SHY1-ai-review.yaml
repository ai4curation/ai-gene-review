    supporting_text: We suggest that Shy1 links Cox1 translational regulation to complex
      IV assembly and supercomplex formation.
  - reference_id: file:yeast/SHY1/SHY1-deep-research-falcon.md
    supporting_text: Falcon deep research emphasizes Cox1 maturation and complex IV
      assembly as the core SHY1 function.
proposed_new_terms: []
suggested_questions:
- question: Is protein-containing complex stabilizing activity the best molecular-function
    term for Shy1's Cox1 assembly-intermediate role, or would the evidence support
    a more specific Cox1 cofactor-insertion activity if such a GO term existed?
  experts:
  - Mick DU
  - Rehling P
  - Winge DR
suggested_experiments:
- hypothesis: Shy1 promotes Cox1 heme a3:CuB maturation or maintains Cox1 in an assembly-competent
    state rather than binding unfolded proteins generally.
  description: Reconstitute Shy1-containing Cox1 assembly intermediates with Cox14,
    Mss51, Coa1 and cofactor-insertion factors, then test Shy1 mutants for Cox1 cofactor
    incorporation, assembly-intermediate stability, and release of Mss51.
  experiment_type: mitochondrial complex IV assembly intermediate assay
