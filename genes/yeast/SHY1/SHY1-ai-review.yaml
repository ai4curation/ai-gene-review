- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IMP
  original_reference_id: PMID:11389896
  review:
    summary: The evidence shows that Shy1 occurs in an assembly-associated complex
      and is required for efficient cytochrome c oxidase assembly. It does not show
      general unfolded-protein binding or a broad chaperone substrate range, and is
      better captured by protein-containing complex stabilizing activity.
    action: MODIFY
    reason: The annotation over-interprets an assembly-factor phenotype as broad unfolded-substrate
      binding. Shy1 acts with Cox1-containing complex IV assembly intermediates and
      its loss destabilizes assembled cytochrome c oxidase, which is better represented
      as protein-containing complex stabilizing activity than as generic unfolded
      protein binding.
    proposed_replacement_terms:
    - id: GO:0140777
      label: protein-containing complex stabilizing activity
    supported_by:
    - reference_id: PMID:11389896
      supporting_text: Shy1p may either facilitate assembly of the enzyme, or increase
        its stability.
