- id: PMID:11389896
  title: Shy1p occurs in a high molecular weight complex and is required for efficient
    assembly of cytochrome c oxidase in yeast.
  findings:
  - statement: Shy1 is required for efficient complex IV assembly but residual normal
      enzyme can still form.
    supporting_text: Steady-state levels of the enzyme were found to be strongly reduced,
      the total amount of assembled complex being approximately 30% of control.
- id: PMID:15306853
  title: Mss51p and Cox14p jointly regulate mitochondrial Cox1p expression in Saccharomyces
    cerevisiae.
  findings:
  - statement: Shy1 likely acts downstream of the Cox14-Cox1-Mss51 regulatory complex.
    supporting_text: The release of Mss51p from the complex occurs at a downstream
      step in the assembly pathway, probably catalyzed by Shy1p.
- id: PMID:16823961
  title: 'Toward the complete yeast mitochondrial proteome: multidimensional separation
    techniques for mitochondrial proteomics.'
  findings: []
- id: PMID:17882259
  title: Shy1 couples Cox1 translational regulation to cytochrome c oxidase assembly.
  findings:
  - statement: Shy1 is a complex IV assembly factor that interacts with Cox1 translational
      regulators and assembly intermediates.
    supporting_text: Shy1 interacts with Mss51 and Cox14, translational regulators
      of Cox1.
- id: PMID:17882260
  title: Coa1 links the Mss51 post-translational function to Cox1 cofactor insertion
    in cytochrome c oxidase assembly.
  findings:
  - statement: Coa1 and Shy1 participate in the Cox1 maturation/cofactor insertion
      step of complex IV assembly.
    supporting_text: Shy1 has been implicated in formation of the heme a3-Cu(B) site
      in Cox1.
- id: PMID:24769239
  title: Quantitative variations of the mitochondrial proteome and phosphoproteome
    during fermentative and respiratory growth in Saccharomyces cerevisiae.
  findings: []
- id: PMID:35563734
  title: Pls1 Is a Peroxisomal Matrix Protein with a Role in Regulating Lysine Biosynthesis.
  findings: []
- id: PMID:39289458
  title: Characterization of Shy1, the Schizosaccharomyces pombe homolog of human
    SURF1.
  findings:
  - statement: The fission-yeast SURF1 homolog Shy1 is a mitochondrial complex IV
      assembly factor, corroborating conserved SURF1-family biology.
    supporting_text: Shy1 plays a pivotal role in the sustainability of the regular
      function of mitochondria by participating in the assembly of complex IV in S.
      pombe.
  - statement: S. pombe shy1 deletion only partly phenocopies loss of S. cerevisiae
      SHY1 or human SURF1, so the 2024 fission-yeast paper should be treated as ortholog
      corroboration rather than direct S. cerevisiae evidence.
    supporting_text: Unlike its homologs, deletion of shy1 does not critically disrupt
      respiratory chain assembly, indicating the presence of the compensatory mechanism(s)
      within S. pombe that ensure mitochondrial functionality.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified 2024 fission-yeast homolog paper; corroborates
      SURF1-family conservation but is not direct evidence for S. cerevisiae Shy1
      action calls.
- id: PMID:9162072
  title: SHY1, the yeast homolog of the mammalian SURF-1 gene, encodes a mitochondrial
    protein required for respiration.
  findings:
  - statement: SHY1 encodes the yeast SURF1 homolog and localizes to the inner mitochondrial
      membrane.
    supporting_text: The encoded protein is homologous to the product of the mammalian
      SURF-1 gene.
