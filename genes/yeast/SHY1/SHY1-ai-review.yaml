id: P53266
gene_symbol: SHY1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SHY1 encodes the yeast SURF1-family cytochrome c oxidase assembly factor.
  Shy1 is an intrinsic mitochondrial inner membrane protein required for efficient
  complex IV biogenesis, acting during early Cox1 maturation and coupling Cox1 translational
  regulation by the Mss51/Cox14 module to downstream complex IV assembly. Shy1 is
  not a mature cytochrome c oxidase subunit and is not a general unfolded-protein
  chaperone; its core role is assembly of mitochondrial respiratory chain complex
  IV.
