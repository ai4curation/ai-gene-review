descriptions:
- source: UniProt
  text: Preferentially oxidative, glucose-repressed isozyme that catalyzes the conversion
    of ethanol to acetaldehyde. Main enzyme involved in ethanol consumption. Acts
    on a variety of primary unbranched aliphatic alcohols (Probable) (PubMed:3546317).
    Also produces ethanol from glucose, albeit less than ADH1 (PubMed:22094012).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00331
  source_id: P00331
- source: Alliance_Imported
  text: Glucose-repressible alcohol dehydrogenase II; catalyzes the conversion of
    ethanol to acetaldehyde; involved in the production of certain carboxylate esters;
    regulated by ADR1
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADH2
  source_id: SGD:S000004918
- source: Alliance_Automated
  text: Enables butanol dehydrogenase (NAD+) activity and ethanol dehydrogenase (NAD+)
    activity. Involved in L-leucine catabolic process and ethanol metabolic process.
    Located in cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADH2
  source_id: SGD:S000004918
