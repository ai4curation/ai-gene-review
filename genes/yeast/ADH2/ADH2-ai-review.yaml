id: P00331
gene_symbol: ADH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADH2 encodes alcohol dehydrogenase II, a cytosolic medium-chain zinc alcohol dehydrogenase
  that is strongly repressed by glucose and derepressed after the diauxic shift. With a 10-20-fold lower
  Km for ethanol than ADH I, it oxidises ethanol to acetaldehyde with NAD+, initiating the use of accumulated
  ethanol as a carbon source; it can also produce ethanol from glucose at lower efficiency than ADH1.
  Like the other ADHs it acts on several short primary alcohols and can reduce Ehrlich-pathway fusel aldehydes
  to fusel alcohols redundantly with ADH1, ADH3-5 and SFA1.
