core_functions:
- description: Non-catalytic subunit of the Gcn5 HAT module that, with Ada2, licenses Gcn5 to acetylate
    nucleosomal histones H3 and H2B with the expanded lysine specificity of the native SAGA, SLIK and
    ADA complexes. The Ada2-Ada3-Gcn5 core is necessary and sufficient for nucleosomal HAT activity; Ada3
    binds the complex through Ada2.
  contributes_to_molecular_function:
    id: GO:0004402
    label: histone acetyltransferase activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex: &id001
    id: GO:0000124
    label: SAGA complex
  supported_by:
  - reference_id: PMID:11773077
    supporting_text: We show that yeast Ada2, Ada3, and Gcn5 form a catalytic core of the ADA and Spt-Ada-Gcn5-acetyltransferase
      HAT complexes, which is necessary and sufficient in vitro for nucleosomal HAT activity and lysine
      specificity of the intact HAT complexes.
  - reference_id: PMID:11773077
    supporting_text: We also demonstrate that Ada3 is necessary for Gcn5-dependent nucleosomal HAT activity
      in yeast extracts.
  - reference_id: PMID:9224714
    supporting_text: Both the 0.8- and 1.8-MD Gcn5-containing complexes cofractionate with Ada2 and are
      lost in gcn5delta, ada2delta, or ada3delta yeast strains
- description: 'Transcriptional adaptor subunit of the SAGA coactivator: needed for activation by a subset
    of acidic activators of RNA polymerase II genes, with an N-terminal domain proposed to contact activators.'
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
