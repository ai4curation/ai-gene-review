    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex: *id001
  supported_by:
  - reference_id: PMID:7862114
    supporting_text: Mutations in yeast ADA2, ADA3, and GCN5 weaken the activation potential of a subset
      of acidic activation domains.
  - reference_id: PMID:7862114
    supporting_text: The carboxyl-terminal domain of ADA3 alone suffices for heterotrimeric complex formation
      in vitro and activation of LexA-ADA2 in vivo.
knowledge_gaps:
- gap_statement: How Ada3 enables Gcn5 to acetylate nucleosomes and widens its lysine specificity is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Free Gcn5 acetylates histone peptides but not nucleosomes, and Ada3 is needed for the
    nucleosomal activity of the Ada2-Ada3-Gcn5 core, yet no structure of the HAT module bound to a nucleosome
    shows which Ada3 surfaces contact the substrate. In cryo-EM of yeast SAGA the HAT module could not
    be resolved. Mapping those contacts would say whether Ada3 positions the nucleosome, the H3 tail or
    Gcn5 itself.
  provenance:
  - reference_id: PMID:11773077
    supporting_text: We also demonstrate that Ada3 is necessary for Gcn5-dependent nucleosomal HAT activity
      in yeast extracts.
  - reference_id: PMID:31969703
    supporting_text: the HAT module was invisible, suggesting it became flexible upon nucleosome binding
- gap_statement: Whether the N-terminal domain of Ada3 binds transcriptional activation domains directly
    is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The N-terminal domain is needed in vivo together with the C-terminal, Ada2-binding domain,
    and was proposed to mediate contact with activators, but in current models activators reach SAGA mainly
    through Tra1. A direct binding test would settle whether Ada3 has its own coactivator contact or acts
    only through the HAT core.
  provenance:
  - reference_id: PMID:7862114
    supporting_text: We present a model depicting the ADA complex as a coactivator in which the ADA3 amino-terminal
      domain mediates an interaction between activation domains and the ADA complex.
