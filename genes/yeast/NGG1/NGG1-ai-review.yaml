id: P32494
gene_symbol: NGG1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Ngg1, also called Ada3 (YDR176W), is a non-catalytic subunit of the histone acetyltransferase
  (HAT) module of budding yeast, which it forms with the acetyltransferase Gcn5, the Gcn5 activator Ada2
  and the H3K4me3 reader Sgf29. The same module is shared by three nuclear complexes: the 1.8 MDa SAGA
  coactivator, its variant SLIK/SALSA, and the 0.8 MDa ADA complex. In vitro, Ada2 bridges Ada3 to Gcn5,
  and the C-terminal domain of Ada3 is enough to form the Ada2-Ada3-Gcn5 trimer. Recombinant Gcn5 acetylates
  free histones but not nucleosomes; Ada2, Ada3 and Gcn5 together form the catalytic core of the ADA and
  SAGA complexes, which suffices for nucleosomal acetylation and for the expanded lysine specificity of
  the native complexes, mainly on histone H3 and H2B tails. Ada3 is needed for Gcn5-dependent nucleosomal
  acetylation in yeast extracts, and both native Gcn5 complexes are lost in ada3 mutants. Through SAGA
  it contributes to coactivation of RNA polymerase II transcription: ada3 mutations weaken activation
  by a subset of acidic activators and suppress the toxicity of overexpressed Gal4-VP16, and an N-terminal
  domain of Ada3, needed in vivo together with the C-terminal domain, has been proposed to contact activators.
  NGG1 was first isolated as a gene needed for glucose repression of Gal4-regulated genes.'
