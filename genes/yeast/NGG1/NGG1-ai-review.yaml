  review:
    summary: Phylogenetic inference of SAGA membership from the eukaryotic Ada3/TADA3 node.
    action: ACCEPT
    reason: The PAINT node PTN001005430 is the Ada3/TADA3 ancestor; its descendants with experimental
      SAGA membership include Ngg1 itself, S. pombe Ngg1, Drosophila Ada3 and human and mouse TADA3. Ngg1
      is inside that clade and its own SAGA membership is experimentally shown, so the inherited claim
      holds. Ngg1/Ada3 is a stable subunit of SAGA, in its HAT module with Gcn5, Ada2 and Sgf29, established
      by mass spectrometry of purified SAGA, by co-purification across many tagged subunits and deletion
      strains (PMID:21734642), and by the loss of the native 1.8 MDa complex in ada3 mutants (PMID:9224714).
      Core location. GO:0000124 is a SAGA-type complex, which a reasoner classifies under GO:0000123 histone
      acetyltransferase complex and so under part_of chromatin; SAGA acts on nucleosomes at promoters,
      so that inherited location is reasonable.
