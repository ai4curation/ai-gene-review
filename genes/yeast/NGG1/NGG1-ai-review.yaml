- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1915724
  - PANTHER:PTN001005430
  - UniProtKB:O75528
  review:
    summary: Phylogenetic inference of transcription coactivator activity from the Ada3/TADA3 node.
    action: ACCEPT
    reason: 'The IBA rests on PTN001005430, seeded by mouse and human TADA3. In yeast, Ada3 was defined
      genetically as a transcriptional adaptor: ada3 mutations weaken activation by a subset of acidic
      activators, LexA-Ada3 fusions activate transcription in an Ada2-dependent way, and Ada3 is a subunit
      of SAGA, a coactivator that is recruited by activators and modifies promoter chromatin. GO''s definition
      of coactivator activity covers activity exerted as part of a complex. The proposed direct contact
      between the Ada3 N-terminal domain and activation domains has not been demonstrated (recorded as
      a knowledge gap), so the activity is best read as the subunit''s share of SAGA''s coactivator function.
      Core function, alongside its contribution to Gcn5 HAT activity.'
    supported_by:
    - reference_id: PMID:7862114
      supporting_text: Mutations in yeast ADA2, ADA3, and GCN5 weaken the activation potential of a subset
        of acidic activation domains.
    - reference_id: PMID:7862114
      supporting_text: We present a model depicting the ADA complex as a coactivator in which the ADA3
        amino-terminal domain mediates an interaction between activation domains and the ADA complex.
    - reference_id: PMID:9224714
      supporting_text: these HAT complexes are bona fide native Ada-transcriptional adaptor complexes
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001005430
        source_status: SUPPORTS_TRANSFER
        comment: Eukaryotic Ada3 ancestor seeded by mammalian TADA3; yeast Ada3 genetics and SAGA membership
          agree with the inherited coactivator role.
- term:
    id: GO:0004402
    label: histone acetyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:11773077
  qualifier: contributes_to
  review:
    summary: Ada3 is part of the Ada2-Ada3-Gcn5 catalytic core and is needed for Gcn5-dependent nucleosomal
      acetylation.
    action: ACCEPT
    reason: Gcn5 is the catalytic subunit; Ada3 has no catalytic activity of its own, which the contributes_to
      qualifier on this row correctly reflects. Balasubramanian et al. show that Ada2, Ada3 and Gcn5 form
      a catalytic core that is necessary and sufficient for nucleosomal HAT activity and the lysine specificity
      of the native complexes, and that Ada3 is needed for Gcn5-dependent nucleosomal acetylation in yeast
      extracts; Grant et al. found both native Gcn5 complexes lost in ada3 mutants. The native complexes
      acetylate histone H3 and H2B, so the general histone acetyltransferase term is as precise as this
      contribution allows. Core function.
    supported_by:
    - reference_id: PMID:11773077
      supporting_text: We show that yeast Ada2, Ada3, and Gcn5 form a catalytic core of the ADA and Spt-Ada-Gcn5-acetyltransferase
        HAT complexes, which is necessary and sufficient in vitro for nucleosomal HAT activity and lysine
        specificity of the intact HAT complexes.
    - reference_id: PMID:11773077
      supporting_text: We also demonstrate that Ada3 is necessary for Gcn5-dependent nucleosomal HAT activity
        in yeast extracts.
    - reference_id: PMID:11773077
      supporting_text: Ada3 facilitates nucleosomal acetylation and an expanded lysine specificity
    - reference_id: PMID:9224714
      supporting_text: Both the 0.8- and 1.8-MD Gcn5-containing complexes cofractionate with Ada2 and
        are lost in gcn5delta, ada2delta, or ada3delta yeast strains
