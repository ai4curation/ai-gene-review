    reason: The 0.8 MDa ADA complex is a Gcn5-dependent HAT complex distinct from SAGA, made of the HAT
      module (Gcn5, Ada2, Ada3, Sgf29) plus Ahc1 and Ahc2. Ada3 was shown to be an integral subunit after
      ten chromatographic steps (PMID:10490601), the 0.8 MDa complex is lost in ada3 mutants (PMID:9224714),
      and Ada3 co-purifies with the ADA-specific subunit Ahc2 (PMID:21734642). The 1995 study showed the
      Ada2-Ada3-Gcn5 trimer that forms the HAT core, which GO's ADA complex term was later defined to
      include. Core location; as for SAGA, the inherited chromatin location is reasonable because the
      complex acetylates nucleosomal histones.
