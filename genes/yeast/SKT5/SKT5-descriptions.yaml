descriptions:
- source: UniProt
  text: Activator of the chitin synthase CHS3 which polymerizes chitin, a structural
    polymer of the fungal cell wall.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34226
  source_id: P34226
- source: Alliance_Imported
  text: Activator of Chs3p (chitin synthase III) during vegetative growth; recruits
    Chs3p to the bud neck via interaction with Bni4p; SKT5 has a paralog, SHC1, that
    arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SKT5
  source_id: SGD:S000000157
- source: Alliance_Automated
  text: Enables enzyme activator activity. Involved in chitin biosynthetic process.
    Located in cellular bud neck; incipient cellular bud site; and plasma membrane.
    Orthologous to human DELE1 (DAP3 binding cell death enhancer 1).
  source_type: automated
