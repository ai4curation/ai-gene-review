description: Skt5 (Chs4/Cal2/Csd4, YBL061C) is the vegetative, non-catalytic activator of chitin synthase
  III (Chs3) in Saccharomyces cerevisiae. It binds Chs3 and raises its Vmax post-translationally, and
  is required for most cell wall chitin, including the chitin ring at the mother-bud neck and lateral
  wall chitin. Skt5 is a peripheral plasma membrane protein, farnesylated at a C-terminal CVIM motif (which
  modulates CSIII activity and chitin chain length but not membrane association), and together with Bni4
  links the Chs3 complex to the septin ring at the incipient bud site and bud neck. Skt5 is degraded during
  sporulation, where its paralog Shc1 takes over activation of Chs3.
