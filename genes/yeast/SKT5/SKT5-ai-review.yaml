suggested_questions:
- question: How does Skt5 binding raise Chs3 Vmax mechanistically (allosteric activation of the glycosyltransferase
    vs. relief of a zymogen-like inhibition, as suggested by trypsin bypass)?
- question: Should the Skt5 adaptor role linking Chs3 to Bni4 and the septins be captured with a protein-macromolecule
    adaptor activity term?
suggested_experiments:
- hypothesis: Skt5 directly activates purified Chs3.
  description: Reconstitute purified Chs3 (with Chs7) in proteoliposomes with and without purified farnesylated
    Skt5 and measure UDP-GlcNAc incorporation kinetics.
