taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Mitochondrial matrix alanine aminotransferase (EC 2.6.1.2) of Saccharomyces cerevisiae, a homodimeric PLP-dependent
  class-I aminotransferase that reversibly transfers the amino group between L-alanine and 2-oxoglutarate (L-alanine + 2-oxoglutarate
  = pyruvate + L-glutamate) by a ping-pong mechanism. Alt1 is the sole route of both alanine synthesis and alanine catabolism
  during respiratory growth, and is mainly catabolic during fermentative growth, when alanine is made by another route. ALT1
  is induced by alanine. Its whole-genome duplication paralog Alt2 is cytosolic and has lost alanine transaminase activity.
