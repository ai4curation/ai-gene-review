gene_symbol: ALT1
organism: yeast
uniprot_id: P52893
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Alanine aminotransferase involved in both alanine biosynthesis and utilization.
    Under respiratory conditions, constitutes the sole pathway for alanine biosynthesis
    and catabolism. Under fermentative conditions, it plays a catabolic role and alanine
    is mainly synthesized through an alternative pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52893
  source_id: P52893
- source: Alliance_Imported
  text: Alanine transaminase (glutamic pyruvic transaminase); involved in alanine
    biosynthesis and catabolism; TOR1-independent role in determining chronological
    lifespan; expression is induced in the presence of alanine; repression is mediated
    by Nrg1p; ALT1 has a paralog, ALT2, that arose from the whole genome duplication;
    Alt2p is catalytically inactive
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALT1
  source_id: SGD:S000004079
- source: Alliance_Automated
  text: Enables L-alanine:2-oxoglutarate transaminase activity and pyridoxal phosphate
    binding activity. Involved in L-alanine catabolic process and alanine biosynthetic
    process. Is active in mitochondrion. Human ortholog(s) of this gene implicated
    in neurodevelopmental disorder with spastic paraplegia and microcephaly. Orthologous
    to human GPT (glutamic--pyruvic transaminase) and GPT2 (glutamic--pyruvic transaminase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALT1
  source_id: SGD:S000004079
