descriptions:
- source: UniProt
  text: Alanine aminotransferase involved in both alanine biosynthesis and utilization.
    Under respiratory conditions, constitutes the sole pathway for alanine biosynthesis
    and catabolism. Under fermentative conditions, it plays a catabolic role and alanine
    is mainly synthesized through an alternative pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52893
  source_id: P52893
