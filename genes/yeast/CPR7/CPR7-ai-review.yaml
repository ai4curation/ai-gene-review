suggested_questions:
- question: Which endogenous yeast Hsp90 clients require Cpr7 catalytic PPIase activity
    rather than TPR-mediated co-chaperone scaffolding?
  experts: []
- question: How does Cpr7 coordinate with Cns1, Sti1, Cpr6, and Hsp104 across different
    metabolic or stress states?
  experts: []
suggested_experiments:
- hypothesis: Most CPR7-dependent proteostasis phenotypes require TPR-mediated Hsp90
    co-chaperone function, while a narrower client subset depends on PPIase-domain
    surfaces.
  description: Compare endogenous CPR7 wild type, PPIase-dead, PPIase-domain surface,
    and TPR-disrupting mutants for Hsp90 binding, client maturation, eEF2 solubility,
    stress sensitivity, and protein-refolding phenotypes.
  experiment_type: domain separation-of-function analysis
