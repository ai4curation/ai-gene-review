taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: CPR7 encodes a cytosolic CyP40-family Hsp90 co-chaperone with a cyclophilin
  peptidyl-prolyl isomerase domain and TPR-mediated Hsp90-binding domain; its core
  in vivo role is organizing Hsp90-dependent proteostasis and client maturation, with
  PPIase activity as a supported biochemical function.
