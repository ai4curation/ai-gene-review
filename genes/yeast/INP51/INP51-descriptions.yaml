descriptions:
- source: UniProt
  text: Controls the cellular levels and subcellular distribution of phosphatidylinositol
    4,5-bisphosphate (PtdIns(4,5)P2). Does not utilize phosphatidylinositol 3,5-bisphosphate
    (PtdIns(3,5)P2), nor phosphatidylinositol 3-phosphate (PtdIns(3)P) and phosphatidylinositol
    4-phosphate (PtdIns(4)P). Plays an essential role in a TGN (trans Golgi network)-to-early
    endosome pathway. Involved in endocytosis and acts as a negative regulator of
    the Slm pathway which modulates polarized actin assembly and growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40559
