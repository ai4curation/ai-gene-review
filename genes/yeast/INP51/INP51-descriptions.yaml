gene_symbol: INP51
organism: yeast
uniprot_id: P40559
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Controls the cellular levels and subcellular distribution of phosphatidylinositol
    4,5-bisphosphate (PtdIns(4,5)P2). Does not utilize phosphatidylinositol 3,5-bisphosphate
    (PtdIns(3,5)P2), nor phosphatidylinositol 3-phosphate (PtdIns(3)P) and phosphatidylinositol
    4-phosphate (PtdIns(4)P). Plays an essential role in a TGN (trans Golgi network)-to-early
    endosome pathway. Involved in endocytosis and acts as a negative regulator of
    the Slm pathway which modulates polarized actin assembly and growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40559
  source_id: P40559
- source: Alliance_Imported
  text: Phosphatidylinositol 4,5-bisphosphate 5-phosphatase; synaptojanin-like protein
    with an N-terminal Sac1 domain, plays a role in phosphatidylinositol 4,5-bisphosphate
    homeostasis and in endocytosis; null mutation confers cold-tolerant growth
  source_type: curated
  url: https://www.yeastgenome.org/locus/INP51
  source_id: SGD:S000001264
- source: Alliance_Automated
  text: Enables phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity. Involved
    in phosphatidylinositol dephosphorylation. Located in cytoplasm and membrane.
    Human ortholog(s) of this gene implicated in Parkinson's disease; Parkinson's
    disease 20; and developmental and epileptic encephalopathy 53. Orthologous to
    human SYNJ1 (synaptojanin 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/INP51
  source_id: SGD:S000001264
