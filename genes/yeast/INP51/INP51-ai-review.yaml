- id: file:yeast/INP51/INP51-uniprot.txt
  title: UniProt entry P40559 (INP51)
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: PI(4,5)P2 specificity and the endocytosis role agree with the review. The sentence on an essential
      role in a TGN-to-early endosome pathway is the same sentence used in the INP53 entry and rests on the SOP2
      (= INP53) work, so it appears to be transferred from the paralog. The negative regulation of the Slm pathway
      could not be verified from cached abstracts; it is plausible, since Inp51 lowers the PI(4,5)P2 that recruits
      Slm1/Slm2 (PMID:15689497), but was not added to the review.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P40559
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Plays an essential role in a TGN (trans Golgi network)-to-early endosome pathway.
      confidence: PROBABLE
      explanation: The INP51 FUNCTION comment says "Plays an essential role in a TGN (trans Golgi network)-to-early
        endosome pathway", the same wording as the INP53 entry. The cited work on synaptojanin-like phosphatases in
        Golgi-endosome traffic (Luo and Chang 1997, PMID:9265642) concerns SOP2, a 1,107-residue protein that is
        INP53/SJL3, and Ha et al. 2003 (PMID:12686590) assign the TGN-to-endosome pathway to Inp53. Unless there
