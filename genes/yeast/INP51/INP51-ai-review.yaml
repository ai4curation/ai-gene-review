  review:
    summary: IBA from the synaptojanin node PTN002597976 (79 leaves), seeded by enzyme-assay rows on rat Synj1 and
      Synj2, human SYNJ1 and S. pombe syj1. Inp51 is inside the seeded clade, but the budding yeast synaptojanin-like
      enzymes are reported to be specific for the lipid substrate, and the paralog Inp52 was assayed directly and
      did not hydrolyse Ins(1,4,5)P3. The rise in Ins(1,4,5)P3 in inp51 cells is attributed to increased PI(4,5)P2
      available to Plc1, not to loss of IP3 hydrolysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: The node is soundly seeded and Inp51 sits inside the seeded clade (it joins the S. pombe seed at PTN000128223,
      17 leaves, and the animal seeds at PTN002597977, 77 leaves), so the doubt is on the target and not on the
      tree. Ooms et al. (PMID:11094088, full text) assayed purified recombinant Inp52, which joins Inp51 at the
      7-leaf node PTN001341482, on Ins(1,4,5)P3 and Ins(1,3,4,5)P4 and saw no hydrolysis, while PtdIns(4,5)P2
      was hydrolysed. The same paper summarises the earlier biochemical work on Inp51, Inp52 and Inp53 as each
      enzyme specifically hydrolysing PtdIns(4,5)P2. That statement is second-hand for Inp51, and the cached Inp51
      papers are abstracts that report only the lipid activity, so a negative assay on Inp51 itself was not read.
      Loss is therefore not shown for this gene and the row is kept as an over-annotation and not removed. An
      Ins(1,4,5)P3 5-phosphatase assay on purified Inp51 would settle it.
    supported_by:
    - *id007
    - reference_id: PMID:11094088
      supporting_text: No hydrolysis of Ins(1,4,5)P 3 or Ins(1,3,4,5)P 4 was observed regardless of the amount of
        recombinant protein present in the assay.
    - reference_id: PMID:11094088
      supporting_text: Each of these enzymes specifically hydrolyzes PtdIns(4,5)P 2 forming PtdIns(4)P.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002597976
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Synaptojanin node seeded by rat Synj1 and Synj2, human SYNJ1 and S. pombe syj1. Inp51 is inside
          the seeded clade; the doubt comes from the negative Ins(1,4,5)P3 assay on its paralog Inp52 and the
          reported lipid specificity of the three yeast enzymes (PMID:11094088).
