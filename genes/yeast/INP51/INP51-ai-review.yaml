gene_symbol: INP51
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: INP51 (SJL1) encodes one of the three yeast synaptojanin-like inositol polyphosphate 5-phosphatases.
  It has an N-terminal Sac1-like domain, a central inositol 5-phosphatase catalytic domain and a C-terminal proline-rich
  region with an NPF motif. Inp51 is a membrane-associated PI(4,5)P2 5-phosphatase that converts PI(4,5)P2 to PI4P;
  unlike Inp52/Inp53 it is not known to hydrolyse PI3P, PI4P or PI(3,5)P2. Loss of INP51 raises PI(4,5)P2 2-4-fold
  and confers cold tolerance, while combined loss with INP52 or INP53 causes plasma membrane invaginations, cell
  wall thickening, actin and vacuole defects; inp51 inp52 inp53 is inviable. The EH-domain proteins Tax4 and Irs4
  bind Inp51 and activate it, downregulating PI(4,5)P2 and cell-integrity (Pkc1) signalling; Inp51 also contributes
  to PI(4,5)P2 turnover during endocytosis.
