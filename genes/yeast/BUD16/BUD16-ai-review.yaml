  label: Saccharomyces cerevisiae S288C
description: Bud16p is the principal pyridoxal kinase (PdxK; EC 2.7.1.35) of Saccharomyces cerevisiae, a member
  of the ribokinase-like pyridoxine kinase family that phosphorylates the B6 vitamers pyridoxal, pyridoxine and
  pyridoxamine at the 5'-hydroxymethyl group to generate the phosphorylated forms, including the cofactor pyridoxal
  5'-phosphate (PLP). It provides the vitamin B6 salvage route to PLP that operates in parallel with the de novo
  Snz1/Sno1 PLP synthase. Deletion of BUD16 reduces cellular PLP to about 2% of wild-type levels, causes pyridoxine
  to accumulate, and is synthetically lethal with loss of the de novo pathway; the resulting PLP deficiency leads
  to DNA lesions and gross chromosomal rearrangements. Bud16p is found in the cytoplasm and nucleus and is also
  detected in peroxisomes. The gene was named from a bud-site-selection screen.
