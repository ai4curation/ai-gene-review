id: P37012
gene_symbol: PGM2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PGM2 (also GAL5) encodes the major phosphoglucomutase isozyme of Saccharomyces cerevisiae
  (EC 5.4.2.2), a cytoplasmic alpha-D-phosphohexomutase family enzyme that reversibly interconverts alpha-D-glucose
  1-phosphate and glucose 6-phosphate by a ping-pong mechanism through a phosphoserine enzyme intermediate
  and glucose 1,6-bisphosphate, using Mg2+ (or Zn2+) as metal cofactor. Pgm2 provides about 80-90% of
  cellular phosphoglucomutase activity; its expression is induced by galactose through the Gal4/Gal80/Gal3
  system and repressed by glucose. In galactose-grown cells Pgm2 converts the glucose 1-phosphate generated
  by the Leloir pathway into glycolytic glucose 6-phosphate, and pgm2 mutants accumulate glucose 1-phosphate
  and grow poorly on galactose; on other carbon sources it supplies glucose 1-phosphate for UDP-glucose,
  glycogen, trehalose and glucan synthesis. Loss of Pgm2 also secondarily perturbs Ca2+ and K+ homeostasis
  through altered glucose-phosphate levels.
