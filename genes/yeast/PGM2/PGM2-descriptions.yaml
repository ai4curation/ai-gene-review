descriptions:
- source: UniProt
  text: Major phosphoglucomutase isozyme that catalyzes the reversible isomerization
    of alpha-D-glucose 1-phosphate to alpha-D- glucose 6-phosphate (PubMed:1100398,
    PubMed:23103740, PubMed:4992300, PubMed:5784209). The mechanism proceeds via the
    intermediate compound alpha-D-glucose 1,6-bisphosphate (Probable). Constitutes
    about 80-90% of the phosphoglucomutase activity in the cell (PubMed:14264884,
    PubMed:5231755). Key enzyme in hexose metabolism. The forward reaction is an essential
    step in the energy metabolism of galactose since the product of the galactose
    pathway enzymes in yeast is glucose 1- phosphate. The reverse reaction is an essential
    step for biosynthesis when carbon sources other than galactose are the energy
    source because glucose 1-phosphate is the starting point for the synthesis of
    UDP- glucose, which acts as a precursor for the synthesis of oligosaccharides
    and trehalose (PubMed:14264884).
