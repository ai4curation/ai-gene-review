- description: Ssz1 is the atypical Hsp70 chaperone subunit of ribosome-associated complex (RAC).
    It transiently binds nascent chains and helps transfer them from Zuo1 to Ssb, while enabling
    Zuo1 to stimulate the Ssb ATPase cycle. These activities support cotranslational folding
    and translational fidelity without detectable intrinsic Ssz1 ATP hydrolysis.
