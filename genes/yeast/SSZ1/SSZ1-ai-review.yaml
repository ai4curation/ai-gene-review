id: P38788
gene_symbol: SSZ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Ssz1 is an atypical Hsp70-family chaperone of Saccharomyces cerevisiae that forms
  the ribosome-associated complex (RAC) with the J-domain protein Zuo1. Zuo1 anchors RAC near
  the cytosolic ribosome exit tunnel, where Ssz1 transiently binds short emerging nascent chains
  and helps transfer them to the canonical Hsp70 Ssb1/2. Ssz1 also enables efficient stimulation
  of Ssb ATP hydrolysis by Zuo1. It binds ATP but has no detectable intrinsic ATPase activity
  in the characterized biochemical assays, and nucleotide binding is dispensable for several
  tested in-vivo functions. Loss of Ssz1 disrupts cotranslational protein homeostasis and translational
  fidelity, producing growth, cold-sensitivity and aminoglycoside-sensitivity phenotypes. Ssz1
  is also known as Pdr13 from studies of pleiotropic drug-resistance regulation.

