id: P46969
gene_symbol: RPE1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Rpe1 (YJL121C; POS18) is the sole D-ribulose-5-phosphate 3-epimerase (EC 5.1.3.1) of Saccharomyces cerevisiae.
  It is a cytosolic TIM-barrel enzyme of the RPE family that interconverts D-ribulose 5-phosphate and D-xylulose 5-phosphate
  in the non-oxidative pentose phosphate pathway, supplying xylulose 5-phosphate to transketolase. Like its human orthologue,
  it is predicted to bind one divalent metal ion per subunit. rpe1 deletion mutants lack epimerase activity and cannot grow
  on D-xylulose. rpe1 (pos18) mutants were isolated as hydrogen-peroxide-sensitive, consistent with a role for PPP flux in
  NADPH-dependent oxidative-stress protection.
