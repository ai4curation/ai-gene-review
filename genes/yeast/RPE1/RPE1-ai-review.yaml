    summary: Wang et al. assigned Rpe1 to the predicted yeast zinc proteome by domain/motif searches (RCA). RPE enzymes bind
      one divalent metal per subunit, and the human orthologue is active with Co2+, Fe2+, Mn2+ or Zn2+. Which metal Rpe1 uses
