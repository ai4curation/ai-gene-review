descriptions:
- source: UniProt
  text: Catalyzes the reversible epimerization of D-ribulose 5- phosphate to D-xylulose
    5-phosphate (By similarity). Involved in the protective response to oxidative
    stress.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P46969
  source_id: P46969
- source: Alliance_Imported
  text: D-ribulose-5-phosphate 3-epimerase; catalyzes a reaction in the non-oxidative
    part of the pentose-phosphate pathway; mutants are sensitive to oxidative stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/RPE1
  source_id: SGD:S000003657
- source: Alliance_Automated
  text: Enables D-ribulose-phosphate 3-epimerase activity. Involved in pentose-phosphate
    shunt. Predicted to be located in cytoplasm. Predicted to be active in cytosol.
    Orthologous to several human genes including RPEL1 (ribulose-5-phosphate-3-epimerase
    like 1).
  source_type: automated
