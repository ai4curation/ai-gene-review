descriptions:
- source: UniProt
  text: Non-catalytic subunit of the tRNA-splicing endonuclease complex, a complex
    responsible for identification and cleavage of the splice sites in pre-tRNA. It
    cleaves pre-tRNA at the 5' and 3' splice sites to release the intron. The products
    are an intron and two tRNA half-molecules bearing 2',3' cyclic phosphate and 5'-OH
    termini. There are no conserved sequences at the splice sites, but the intron
    is invariably located at the same site in the gene, placing the splice sites an
    invariant distance from the constant structural features of the tRNA body.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04675
