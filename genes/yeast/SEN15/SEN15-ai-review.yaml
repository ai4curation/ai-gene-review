core_functions:
- description: Essential noncatalytic structural subunit of the heterotetrameric tRNA-splicing
    endonuclease. It pairs directly with the 3'-splice-site catalytic subunit Sen34 and so
    contributes to the enzyme's cleavage of intron-containing pre-tRNAs at both splice sites;
    catalysis is supplied by Sen2 and Sen34. The enzyme acts on the cytosolic face of the
    mitochondrial outer membrane.
  supported_by:
  - reference_id: PMID:9200603
    supporting_text: Our results demonstrate that the eucaryal tRNA splicing endonuclease contains
      two functionally independent active sites for cleavage of the 5' and 3' splice sites,
      encoded by SEN2 and SEN34, respectively.
  - reference_id: file:yeast/SEN15/SEN15-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: Interacts directly with SEN34.
  - reference_id: PMID:12925762
    supporting_text: The endonuclease is peripherally associated with the cytosolic surface of
      the outer mitochondrial membrane.
