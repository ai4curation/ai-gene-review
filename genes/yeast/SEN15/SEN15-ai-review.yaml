- id: PMID:16710424
  title: Cleavage of pre-tRNAs by the splicing endonuclease requires a composite active
    site.
  findings:
  - statement: The 5' splice-site active site is composite, using the Sen2 catalytic triad and
      a Sen34-derived cation-pi sandwich; Sen15 is not part of either active site.
    supporting_text: catalysis at the 5' splice site requires the conserved cation-pi sandwich
      derived from the Sen34 subunit in addition to the catalytic triad of Sen2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; establishes the catalytic architecture and so supports Sen15's
      noncatalytic role.
