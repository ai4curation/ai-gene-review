  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: Nuclear localization mapped from the UniProt subcellular-location line.
    action: KEEP_AS_NON_CORE
    reason: The cited localization study (PMID:12925762) found the endonuclease mainly on
      mitochondria, with at most a small nuclear amount, and it assayed Sen2p, Sen54p and enzyme
      activity rather than Sen15p. A nuclear-restricted complex can splice pre-tRNA
