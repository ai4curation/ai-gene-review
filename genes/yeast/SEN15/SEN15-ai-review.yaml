    summary: Sen15 contributes to the tRNA-intron endonuclease activity of the heterotetrameric
      enzyme, from which it was purified and sequenced.
    action: ACCEPT
    reason: The contributes_to qualifier is exactly right for this subunit. Trotta et al.
      purified the endonuclease and cloned all four subunit genes, Sen15 among them, and placed
      the two catalytic sites in Sen2 and Sen34. Sen15 itself has no catalytic residues, so it
      should not carry an unqualified enables annotation, but as an essential, stoichiometric
      subunit of the active enzyme it contributes to that activity. PAINT did not propagate
