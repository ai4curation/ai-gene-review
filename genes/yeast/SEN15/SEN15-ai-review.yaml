    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011856
  review:
    summary: Generic nucleic acid binding inferred from a superfamily-level match to the
      archaeal endonuclease fold.
    action: MARK_AS_OVER_ANNOTATED
    reason: IPR011856 is a superfamily-level structural signature shared by the catalytic
      subunits and the archaeal enzyme; it does not show that Sen15 contacts RNA. Sen15 keeps
      only a fragment of that fold. No experiment shows S. cerevisiae Sen15 binding nucleic
      acid. In the human enzyme (TSEN15 is in a different PANTHER family, so this is indirect
      evidence only), the pre-tRNA mature domain is recognized by the other three subunits. The
      enzyme as a whole binds pre-tRNA, but assigning generic nucleic acid binding to this
      subunit overstates the evidence. It is not removed, because the negative evidence comes
      from another family.
    supported_by:
    - reference_id: PMID:17166513
      supporting_text: Sen15 and Sen54, which are otherwise non-homologous, contain C-terminal
        sequences similar to the stretch of MJ_endo that spans the last two β -strands
    - reference_id: PMID:37028420
      supporting_text: The mature domain of pre-tRNA is recognized by
        conserved structural elements of TSEN34, TSEN54, and TSEN2.
