suggested_questions:
- question: Does Sen15 itself contribute to the tRNA-independent activities of the yeast SEN
    complex (CBP1 mRNA cleavage, the essential cytoplasmic pre-rRNA-related function), or are
    these explained by its structural role in holding Sen34 in the complex?
- question: PAINT propagated complex and process terms, but not contributes_to GO:0000213, from
    node PTN002003396. Should the MF be propagated to fungal Sen15 orthologs as contributes_to?
- question: Does Sen15 contact the pre-tRNA in the yeast enzyme, or, as in the human structure,
    is substrate recognition carried out entirely by Sen2, Sen34 and Sen54?
suggested_experiments:
- description: Determine a structure of the S. cerevisiae endonuclease bound to pre-tRNA, and
    test Sen15 interface mutants that preserve Sen34 binding for pre-tRNA cleavage, CBP1 mRNA
    cleavage and growth. This would separate Sen15's architectural role from any direct role in
    substrate recognition.
  experiment_type: structural biology and mutational analysis
