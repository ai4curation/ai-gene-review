id: Q04675
gene_symbol: SEN15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  SEN15 (YMR059W) encodes a 128-residue, essential, noncatalytic subunit of the
  heterotetrameric tRNA-splicing endonuclease (Sen2-Sen15-Sen34-Sen54). The endonuclease
  recognizes intron-containing precursor tRNAs and cleaves them at the 5' and 3' splice
  sites, releasing the intron and two tRNA half-molecules (2',3'-cyclic phosphate and 5'-OH
  ends) that are subsequently joined by tRNA ligase. The two active sites reside in Sen2 (5'
  site) and Sen34 (3' site); Sen15 retains only a degenerate C-terminal portion of the archaeal
  endonuclease fold, lacks catalytic residues, and binds Sen34 directly, so it acts as the
  structural partner of Sen34 in the 3'-splice-site half of the enzyme. Sen15 was identified
  by protein sequencing of the purified enzyme. The endonuclease is a low-abundance complex
  that is peripherally associated with the cytosolic face of the mitochondrial outer
  membrane, with little or none detected in the nucleus. The S. cerevisiae complex also has
  tRNA-independent roles (cleavage of the mitochondria-targeted CBP1 mRNA and an essential
  cytoplasmic function linked to pre-rRNA processing), which have been shown for the complex
  and its catalytic subunits rather than for Sen15 individually.
