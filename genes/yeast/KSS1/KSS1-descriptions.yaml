gene_symbol: KSS1
organism: yeast
uniprot_id: P14681
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Together with closely related FUS3, KSS1 is the final kinase in the signal
    transduction cascade regulating activation/repression of the mating and filamentation
    pathways, induced by pheromone and nitrogen/carbon limitation, respectively. Phosphorylated
    KSS1 activates both pathways, whereas activated FUS3 activates the mating but
    suppresses the filamentation pathway. KSS1 activity is down-regulated by FUS3
    during pheromone induction to prevent inappropriate activation of the filamentation
    pathway. During induction of filamentation, KSS1 activates the transcription factor
    STE12 resulting in its binding to and activation of filamentation specific genes.
    Non-activated KSS1 has a kinase-independent repressive effect on STE12 transcriptional
    activity, that is mediated by direct binding to STE12 and depends on the presence
    of DIG1 and DIG2, and that is required for the suppression of filamentation under
    normal growth conditions. SSN3/SRB10 contributes further to the suppression of
    filamentation under these conditions by reducing STE12 stability independent of
    KSS1. FUS3 can partially compensate for the lack of KSS1 but filamentation becomes
    constitutively induced at a low level in the absence of any signal. KSS1 phosphorylates
    STE7, STE5, FAR1, DIG1, DIG2, STE12, and SST2.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P14681
  source_id: P14681
- source: Alliance_Imported
  text: Mitogen-activated protein kinase (MAPK); involved in signal transduction pathways
    that control filamentous growth and pheromone response; regulates septum assembly,
    and may directly phosphorylate Bni4p; the KSS1 gene is nonfunctional in some S288C-related
    strains and functional in W303a strains
  source_type: curated
  url: https://www.yeastgenome.org/locus/KSS1
  source_id: SGD:S000003272
- source: Alliance_Automated
  text: Enables MAP kinase activity. Involved in several processes, including invasive
    growth in response to glucose limitation; positive regulation of division septum
    assembly; and signal transduction involved in filamentous growth. Located in cellular
    bud neck and nucleus. Human ortholog(s) of this gene implicated in several diseases,
    including Noonan syndrome 13; Parkinson's disease; carcinoma (multiple); endometrial
    disease; and pulmonary hypertension. Orthologous to human MAPK1 (mitogen-activated
    protein kinase 1) and MAPK3 (mitogen-activated protein kinase 3).
