  review:
    summary: Invasive growth depends on the shared MAP kinase cascade elements; Kss1 is the MAPK of this
      program.
    action: ACCEPT
    reason: Roberts and Fink established haploid invasive growth as a program using elements of the mating
      MAPK cascade; the curator's IMP for KSS1 is from the full text. Later work confirms Kss1 as the
      MAPK regulating invasion (PMID:9393860) and Dig1/Dig2-dependent control of invasive growth by Kss1
      (PMID:9860980). Invasive growth is a core process for Kss1.
    additional_reference_ids:
    - PMID:9393860
    - PMID:9860980
    supported_by:
    - reference_id: PMID:8001818
      supporting_text: 'Thus, haploid yeast cells can enter either of two developmental pathways: mating
        or invasive growth, both of which depend on elements of a single MAP kinase cascade.'
