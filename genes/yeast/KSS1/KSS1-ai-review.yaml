suggested_questions:
- question: Does unphosphorylated Kss1 repress Ste12 while bound at FRE/PRE promoters (which would justify
    transcription corepressor activity, GO:0003714), or by sequestering Ste12 off DNA?
- question: Is the UniProt 'Periplasm' subcellular location for Kss1 (cited to PMID:11781566) an error,
    e.g. a mis-mapping of cell cortex/cell periphery, and should the GO:0042597 IEA be withdrawn at source?
- question: Is Kss1-dependent Bni4 phosphorylation and bud-neck localization physiological at endogenous
    Kss1 levels, or only revealed by overexpression in slt2 mutants?
suggested_experiments:
- hypothesis: Repressive, unphosphorylated Kss1 is recruited with Ste12-Dig1/Dig2 to FRE promoters.
  description: ChIP of kinase-dead and wild-type Kss1 at FRE-containing promoters (e.g. FLO11 regulators,
    TEC1) in the presence and absence of Dig1/Dig2 to test whether repressive Kss1 is promoter-associated.
  experiment_type: chromatin immunoprecipitation
- hypothesis: Kss1 has no periplasmic pool; any peripheral signal reflects cortical association with Ste5/Ste7.
  description: Endogenously tagged Kss1 imaging and subcellular fractionation to test for any cell-surface/cortical
    pool and resolve the UniProt periplasm assignment.
  experiment_type: fluorescence microscopy
