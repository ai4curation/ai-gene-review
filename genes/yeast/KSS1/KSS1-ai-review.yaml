id: P14681
gene_symbol: KSS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Mitogen-activated protein kinase (MAPK) of the budding yeast filamentous/invasive growth
  pathway and a partially redundant second MAPK of the pheromone response pathway (paralog of Fus3). Kss1
  is dually phosphorylated on its TEY activation-loop motif (Thr183/Tyr185) by the MAPKK Ste7, downstream
  of the MAPKKK Ste11, and binds Ste7 through a high-affinity docking interaction; unlike Fus3 it does
  not require allosteric activation by the Ste5 scaffold. Activated Kss1 is a proline-directed Ser/Thr
  kinase that phosphorylates Ste7, the Ste12 corepressors Dig1 and Dig2, and Ste12, driving Ste12/Tec1-dependent
  transcription of filamentation genes in response to nutrient limitation and contributing to pheromone-induced
  transcription. Unphosphorylated Kss1 has a separate, kinase-independent repressive role: it binds Ste12
  directly and, with Dig1 and Dig2, keeps filamentation gene expression and invasive growth off in the
  absence of signal; Ste7-mediated phosphorylation weakens this interaction. Kss1 shuttles between the
  cytoplasm and the nucleus and accumulates in the nucleus during filamentous growth. During mating signaling,
  active Fus3 limits Kss1 activation to preserve pathway specificity.'
