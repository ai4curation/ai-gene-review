  review:
    summary: Kss1 is the MAPK that transmits the filamentation/invasion signal (Ste11 -> Ste7 -> Kss1
      -> Ste12/Tec1).
    action: ACCEPT
    reason: Core process. Madhani et al. showed that Kss1, not Fus3, is the MAPK of the filamentous growth
      pathway, with both a kinase-dependent activating and a kinase-independent inhibitory role on Ste12.
      Kss1 relocalizes to the nucleus during filamentous growth (PMID:18417610).
    supported_by:
    - &id002
      reference_id: PMID:9393860
      supporting_text: The Fus3 MAPK regulates mating, whereas the Kss1 MAPK regulates filamentation and
        invasion.
    - &id026
      reference_id: PMID:9744865
      supporting_text: The stimulatory function of Kss1 requires both its catalytic activity and its activation
        by the MAPK/ERK kinase (MEK) Ste7; in contrast, the inhibitory function of Kss1 requires neither.
    - &id020
      reference_id: PMID:18417610
      supporting_text: The proteins Bcy1p, Fus3p, Ksp1p, Kss1p, Sks1p, and Tpk2p distributed evenly over
        the cell under conditions of vegetative growth, but they localized predominantly to the nucleus
        during filamentous growth.
