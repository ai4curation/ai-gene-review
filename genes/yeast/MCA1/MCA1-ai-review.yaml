  review:
    summary: Mca1 directly limits the accumulation of insoluble protein
      aggregates.
    action: ACCEPT
    reason: >-
      Deletion and catalytic inactivation of Yca1 caused aggregate and
      autophagic-body accumulation during log-phase growth, while Yca1-GFP
      colocalized with Hsp104-marked aggregates and the Q/N-rich prodomain
      helped deliver Yca1 to insoluble material. This is a core non-death
      protein-quality-control role.
