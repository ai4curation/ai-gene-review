id: Q08601
gene_symbol: MCA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  MCA1, also called YCA1, encodes the sole Saccharomyces cerevisiae type I
  metacaspase. The Q/N-rich N-terminal prodomain targets Mca1 to insoluble
  protein aggregates, while the C-terminal caspase-like protease domain uses
  His220 and Cys276 to cleave substrates after basic residues in a
  calcium-stimulated manner. Mca1 acts in cytosolic protein quality control by
  limiting insoluble aggregate accumulation during vegetative growth, aging,
  and proteotoxic stress, and it also promotes yeast apoptotic programmed cell
  death after oxidative stress, chronological aging, and perturbation of mRNA
  decay.
