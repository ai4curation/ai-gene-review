    label: apoptotic process
  evidence_type: IDA
  original_reference_id: PMID:11983181
  qualifier: involved_in
  review:
    summary: The founding YCA1 paper supports Mca1 involvement in yeast
      apoptotic programmed cell death.
    action: ACCEPT
    reason: >-
      Hydrogen peroxide induced apoptotic markers together with a YCA1-dependent
      caspase-like activity, and the abstract reports both loss of that response
      after disruption and stimulation after Yor197w/YCA1 overexpression. This
      is direct evidence for fungal apoptotic programmed cell death, not just a
      terminal viability readout.
    supported_by:
    - reference_id: PMID:11983181
      supporting_text: >-
        Hydrogen peroxide treatment induces apoptosis together with a
        caspase-like enzymatic activity in yeast
      reference_section_type: ABSTRACT
    - reference_id: PMID:11983181
      supporting_text: >-
        This response is completely abrogated after disruption and strongly
        stimulated after overexpression of Yor197w
      reference_section_type: ABSTRACT
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:16170310
  qualifier: involved_in
  review:
    summary: YCA1 deletion suppresses apoptotic phenotypes caused by an mRNA
      decapping-pathway lesion.
    action: ACCEPT
    reason: >-
      In the Kllsm4Delta1 mRNA-decay mutant, YCA1 deletion reduced rapid death,
      TUNEL-positive DNA fragmentation, ROS accumulation, and mitochondrial
      fragmentation while leaving the mRNA-degradation defect intact. This
      places Mca1 downstream of mRNA-stability stress in the yeast apoptotic
      death program.
    supported_by:
    - reference_id: PMID:16170310
      supporting_text: >-
        Deletion of YCA1 in yeast cells mutated in the LSM4 gene prevents
        mitochondrial fragmentation and rapid cell death during chronological
        ageing of the culture
      reference_section_type: ABSTRACT
    - reference_id: PMID:16170310
      supporting_text: >-
        positioning the budding yeast caspase Yca1 as a downstream executor of
        cell death induced by mRNA stability
      reference_section_type: RESULTS
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:16301538
  qualifier: involved_in
  review:
    summary: YCA1 deletion abrogates H2O2-triggered apoptotic markers and
      increases oxidized-protein accumulation.
    action: ACCEPT
    reason: >-
      The study compared H2O2-treated wild-type and delta yca1 cells and found
      that YCA1 loss blocked phosphatidylserine externalization and
      TUNEL-positive nuclei while increasing oxidized protein burden. Those
      assays connect Mca1 to yeast apoptosis and independently link YCA1 to
      oxidized-protein quality control.
    supported_by:
    - reference_id: PMID:16301538
      supporting_text: >-
        apoptosis was abrogated in the Delta yca1 strain, whereas wild type
        underwent apoptosis as measured by externalization of phosphatidylserine
        and the display of TUNEL-positive nuclei
      reference_section_type: ABSTRACT
