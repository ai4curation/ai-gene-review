suggested_questions:
- question: >-
    Which endogenous substrates connect Mca1 Ca(2+)-dependent cleavage to yeast
    apoptotic programmed cell death, and are they distinct from protein
    aggregate or proteasome-shuttle substrates such as Ddi1?
- question: >-
    Does Mca1 proteolytic activity execute a defined fungal apoptosis step, or
    does apoptotic suppression by YCA1 deletion partly reflect indirect
    proteostasis compensation?
- question: >-
    How should GO represent metacaspase-dependent fungal programmed cell death
    relative to metazoan execution-phase apoptosis without importing mammalian
    intrinsic or extrinsic signaling mechanisms into yeast?
suggested_experiments:
- hypothesis: >-
    Mca1 apoptotic death and Mca1 aggregate clearance depend on separable
    substrates even though both use the same His220/Cys276 protease core.
  description: >-
    Use endogenous MCA1 alleles with catalytic, prodomain-deletion, and
    substrate-recognition mutations to measure Ddi1 cleavage, aggregate
    clearance, H2O2-induced phosphatidylserine externalization, TUNEL-positive
    nuclei, and chronological-aging death in matched strains.
  experiment_type: endogenous separation-of-function yeast genetics
