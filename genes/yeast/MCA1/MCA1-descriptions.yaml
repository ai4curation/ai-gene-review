descriptions:
- source: UniProt
  text: Cysteine protease that cleaves specifically after arginine or lysine residues
    (PubMed:22761449). Mediates cell death (apoptosis) triggered by oxygen stress,
    salt stress or chronological aging. Regulated cell death can prevent a release
    of toxic cellular components, thus avoiding necrotic collapse of the colony, and
    can also provide nutrients for healthy cells. Therefore, regulated cell death
    in yeast colonies can be as important for their development as are apoptosis and
    related processes that occur within metazoa. Promotes the removal of insoluble
    protein aggregates during normal growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08601
  source_id: Q08601
