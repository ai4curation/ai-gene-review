- source: Alliance_Imported
  text: Type I metacaspase; Ca2+-dependent cysteine protease; regulates proteostasis,
    cleaving specific substrates during the stress response; regulates apoptosis in
    response to certain triggers; required for clearance of insoluble protein aggregates
    during normal growth; implicated in cell cycle dynamics and lifespan extension;
    undergoes autocatalytic processing; similar to mammalian metacaspases, but exists
    as a monomer due to an extra pair of anti-parallel beta-strands that block dimerization
  source_type: curated
