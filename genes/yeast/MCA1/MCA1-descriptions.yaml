descriptions:
- source: UniProt
  text: Cysteine protease that cleaves specifically after arginine or lysine residues
    (PubMed:22761449). Mediates cell death (apoptosis) triggered by oxygen stress,
    salt stress or chronological aging. Regulated cell death can prevent a release
    of toxic cellular components, thus avoiding necrotic collapse of the colony, and
    can also provide nutrients for healthy cells. Therefore, regulated cell death
    in yeast colonies can be as important for their development as are apoptosis and
    related processes that occur within metazoa. Promotes the removal of insoluble
    protein aggregates during normal growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08601
  source_id: Q08601
- source: Alliance_Imported
  text: Type I metacaspase; Ca2+-dependent cysteine protease; regulates proteostasis,
    cleaving specific substrates during the stress response; regulates apoptosis in
    response to certain triggers; required for clearance of insoluble protein aggregates
    during normal growth; implicated in cell cycle dynamics and lifespan extension;
    undergoes autocatalytic processing; similar to mammalian metacaspases, but exists
    as a monomer due to an extra pair of anti-parallel beta-strands that block dimerization
  source_type: curated
  url: https://www.yeastgenome.org/locus/MCA1
  source_id: SGD:S000005723
- source: Alliance_Automated
  text: Enables calcium-dependent cysteine-type endopeptidase activity. Involved in
    apoptotic process and protein quality control for misfolded or incompletely synthesized
    proteins. Located in cytosol and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MCA1
  source_id: SGD:S000005723
