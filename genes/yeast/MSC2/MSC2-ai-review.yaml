suggested_questions:
- question: 'Is Msc2 the zinc-translocating subunit of the Msc2-Zrg17 heteromer, as its retained His-Asp-His-Asp
    site A (lost in Zrg17) predicts, and what does Zrg17 contribute: stability, trafficking or regulation?'
- question: Does a minor post-ER (Golgi) pool of Msc2 contribute to Golgi zinc supply in S. cerevisiae,
    as the Golgi localization of its orthologs Cis4 and ZnT5 might suggest?
- question: Should UniProt's FUNCTION text, which still states that Msc2 moves zinc from the nucleus/ER
    to the cytoplasm, be updated to reflect the later evidence that Msc2 mediates zinc entry into the
    ER?
suggested_experiments:
- description: Reconstitute purified Msc2-Zrg17 (and Msc2 alone) in proteoliposomes and measure 65Zn or
    fluorescent-indicator zinc flux and H+ coupling, comparing wild type with Msc2 site-A mutants (H420A/D424A,
    H531A/D535A).
- description: Measure ER-lumenal labile zinc with an ER-targeted genetically encoded zinc sensor in wild
    type, msc2, zrg17 and msc2 site-A point mutants under zinc-limited and zinc-replete conditions.
