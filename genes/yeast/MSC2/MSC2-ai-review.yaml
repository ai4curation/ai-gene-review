  review:
    summary: 'Ellis et al. show that Msc2 is one route of zinc entry into the ER: msc2 mutants have exacerbated
      UPR induction and ERAD defects in low zinc that are suppressed by zinc.'
    action: MODIFY
    reason: 'The paper''s conclusion is directional and compartment-specific (cytosol into ER lumen),
      and GO now has a term for exactly that: zinc ion import into endoplasmic reticulum (GO:0140209,
      is_a zinc ion transport via zinc ion import into organelle). The SGD annotation (2004) predates
      the term, so this is a refinement of the curator''s call, not a reversal. Msc2 itself is the transporter,
      so it does the work of the process. The UPR and ERAD defects are downstream consequences and are
      not annotated as process participation.'
    proposed_replacement_terms:
    - *id008
    supported_by:
    - *id002
    - *id005
