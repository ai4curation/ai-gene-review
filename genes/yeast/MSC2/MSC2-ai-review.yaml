  review:
    summary: msc2 deletion alters cellular zinc content and distribution, which places Msc2 as a zinc
      transporter.
    action: ACCEPT
    reason: The cached record is abstract-only. The phenotype is zinc-specific (iron- and copper-regulated
      genes are unaffected), and later work on the same protein (PMID:15277543, PMID:15961382) supports
      zinc transport across the ER membrane. Li & Kaplan proposed that zinc moves from the nucleus/ER
      to the cytosol, but later work revised the direction to import into the ER. The MF term is the same
      either way, so the curator's annotation stands.
    supported_by:
    - &id009
      reference_id: PMID:11058603
      supporting_text: Regardless of the concentration of Zn2+ in the media, the msc2 strain had a higher
        Zn2+ content than wild type cells.
