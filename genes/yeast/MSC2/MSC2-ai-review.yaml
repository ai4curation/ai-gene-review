    summary: Zinc ion transmembrane transporter activity propagated by PAINT from node PTN000169508, to
      which MSC2 itself, S. pombe Cis4 and vertebrate ZnT5/ZnT7 are experimental donors.
    action: ACCEPT
    reason: MSC2 sits in PANTHER subfamily PTHR45755:SF4 with Cis4 and is inside the clade that inherited
      the function. MSC2 appearing among the node's donors reflects its own experimental grounding (PMID:15277543,
      PMID:11058603). Msc2 keeps the complete His-Asp-His-Asp transmembrane zinc site of transport-competent
      CDF proteins, whereas its partner Zrg17 has lost it. This makes Msc2 the predicted zinc-carrying
      subunit of the Msc2-Zrg17 heteromer. Direct flux assays are still lacking, so the activity rests
      on genetics, family membership and the conserved site.
