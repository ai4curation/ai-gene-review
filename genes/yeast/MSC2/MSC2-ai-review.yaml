id: Q03455
gene_symbol: MSC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MSC2 (YDR205W) encodes a 724-residue, 14-transmembrane cation diffusion facilitator (CDF)
  protein of the ZnT5/SLC30A5-like subfamily. It resides in the endoplasmic reticulum membrane and nuclear
  envelope, where it forms a heteromeric complex with the related CDF protein Zrg17. The Msc2-Zrg17 complex
  is a major route of zinc entry from the cytosol into the ER lumen, especially in zinc-limited cells,
  where Zrg17 is induced by the Zap1 transcription factor. Msc2 keeps the transmembrane His-Asp-His-Asp
  zinc-binding site that Zrg17 lacks, so Msc2 is predicted to be the zinc-translocating subunit. Loss
  of MSC2 alters cellular zinc distribution, increases the unfolded protein response, impairs ER-associated
  degradation in low zinc, and causes zinc-suppressible growth and cell-size defects at high temperature
  on non-fermentable carbon. MSC2 was first isolated in a screen for increased meiotic unequal sister-chromatid
  recombination. Its orthologs in the same subfamily, S. pombe Cis4 and vertebrate ZnT5, carry out the
  equivalent function in the cis-Golgi or Golgi.
