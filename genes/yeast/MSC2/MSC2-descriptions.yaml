gene_symbol: MSC2
organism: yeast
uniprot_id: Q03455
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Probably act as a zinc ion transporter moving zinc from the nucleus/endoplasmic
    reticulum to the cytoplasm. Involved in zinc ion homeostasis and cellular distribution.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03455
  source_id: Q03455
- source: Alliance_Imported
  text: Endoplasmic reticulum zinc transporter; part of a heterodimeric transporter
    with Zrg17p that transfers zinc from the cytosol to the ER lumen; member of the
    cation diffusion facilitator family of efflux pumps; localizes to ER and nucleus;
    mutations affect the cellular distribution of zinc and also confer defects in
    meiotic recombination between homologous chromatids
  source_type: curated
  url: https://www.yeastgenome.org/locus/MSC2
  source_id: SGD:S000002613
- source: Alliance_Automated
  text: Enables zinc ion transmembrane transporter activity. Involved in intracellular
    zinc ion homeostasis; transmembrane transport; and zinc ion transport. Located
    in endoplasmic reticulum. Orthologous to human SLC30A5 (solute carrier family
    30 member 5) and SLC30A7 (solute carrier family 30 member 7).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MSC2
  source_id: SGD:S000002613
