- source: Alliance_Automated
  text: Enables protein phosphatase regulator activity. Involved in several processes,
    including meiosis I; positive regulation of protein localization; and regulation
    of mitotic cell cycle phase transition. Located in several cellular components,
    including cellular bud tip; fungal-type vacuole membrane; and mating projection
    tip. Part of protein phosphatase type 2A complex. Human ortholog(s) of this gene
    implicated in Alzheimer's disease; brain disease; breast cancer; primary cerebellar
    degeneration; and spinocerebellar ataxia 12. Orthologous to several human genes
    including PPP2R2A (protein phosphatase 2 regulatory subunit Balpha) and PPP2R2D
    (protein phosphatase 2 regulatory subunit Bdelta).
  source_type: automated
