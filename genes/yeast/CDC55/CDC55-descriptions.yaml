descriptions:
- source: UniProt
  text: Phosphatase 2A affects a variety of biological processes in the cell such
    as transcription, cell cycle progression and cellular morphogenesis, and provides
    an initial identification of critical substrates for this phosphatase. The regulatory
    subunit may direct the catalytic subunit to distinct, albeit overlapping, subsets
    of substrates.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q00362
  source_id: Q00362
- source: Alliance_Imported
  text: Regulatory subunit B of protein phosphatase 2A (PP2A); Zds1p/2p-dependent
    localization to cytoplasm promotes mitotic entry; localization to nucleus prevents
    mitotic exit; required for correct nuclear division, chromosome segregation during
    achiasmate meiosis; maintains nucleolar sequestration of Cdc14p in early meiosis;
    limits formation of PP2A-Rts1p holocomplexes to ensure timely dissolution of sister
    chromosome cohesion; controls phosphorylation and stability of Cln2p; homolog
    of mammalian B55
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDC55
  source_id: SGD:S000003158
- source: Alliance_Automated
  text: Enables protein phosphatase regulator activity. Involved in several processes,
    including meiosis I; positive regulation of protein localization; and regulation
    of mitotic cell cycle phase transition. Located in several cellular components,
    including cellular bud tip; fungal-type vacuole membrane; and mating projection
    tip. Part of protein phosphatase type 2A complex. Human ortholog(s) of this gene
    implicated in Alzheimer's disease; brain disease; breast cancer; primary cerebellar
    degeneration; and spinocerebellar ataxia 12. Orthologous to several human genes
    including PPP2R2A (protein phosphatase 2 regulatory subunit Balpha) and PPP2R2D
    (protein phosphatase 2 regulatory subunit Bdelta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDC55
  source_id: SGD:S000003158
