suggested_questions:
- question: Is yeast Gfa1 subject to UDP-GlcNAc feedback inhibition and PKA/Snf1 phosphorylation as described
    for mammalian GFAT1, and how does this combine with transcriptional induction to set chitin flux?
- question: What transcription factor(s) mediate GFA1 induction upon cell-wall stress, given that Rlm1
    and Mcm1 are not required?
suggested_experiments:
- description: Measure Gfa1 activity and UDP-GlcNAc inhibition in extracts from wild type and cell-wall
    mutants, and test phospho-site mutants of Gfa1 for effects on chitin content.
