  review:
    summary: 'IGI (with SGD:S000000227) from Lagorce et al. 2002: a gfa1-97 hypomorph in a cell-wall-defective
      gas1 background reduced compensatory chitin synthesis in proportion to the loss of Gfa1 activity,
      and GFA1 overexpression tripled chitin. Gfa1 exerts ~0.9 flux control over chitin synthesis, making
      it the key regulated enzyme feeding the chitin pathway. Non-core relative to its catalytic role
      in UDP-GlcNAc synthesis.'
