description: 'GFA1 encodes glutamine--fructose-6-phosphate aminotransferase [isomerizing] (GFAT; EC 2.6.1.16),
  the sole GFAT of Saccharomyces cerevisiae. Its N-terminal class II glutamine amidotransferase domain
  hydrolyses glutamine and channels ammonia to the C-terminal SIS isomerase domains, which convert fructose
  6-phosphate into glucosamine 6-phosphate. This is the first and committed step of the hexosamine pathway
  leading to UDP-N-acetylglucosamine, the precursor of cell-wall chitin, N-linked glycans and GPI anchors.
  GFA1 is essential; it was identified by complementation of a glucosamine auxotroph. Gfa1 abundance is
  the main control point for chitin flux: its expression rises in response to cell-wall damage and mating
  pheromone, and its overexpression raises chitin about threefold.'
