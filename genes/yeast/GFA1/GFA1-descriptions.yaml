descriptions:
- source: UniProt
  text: Involved in amino sugar synthesis (formation of chitin, supplies the amino
    sugars of asparagine-linked oligosaccharides of glycoproteins).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P14742
  source_id: P14742
- source: Alliance_Imported
  text: Glutamine-fructose-6-phosphate amidotransferase; catalyzes the formation of
    glucosamine-6-P and glutamate from fructose-6-P and glutamine in the first step
    of chitin biosynthesis; GFA1 has a paralogous region, comprising ORFs YMR084W-YMR085W,
    that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GFA1
  source_id: SGD:S000001587
- source: Alliance_Automated
  text: Enables L-glutamine:D-fructose-6-phosphate transaminase (isomerizing) activity.
    Involved in chitin biosynthetic process. Predicted to be active in cytosol. Human
    ortholog(s) of this gene implicated in congenital myasthenic syndrome 12; familial
    hyperlipidemia; glucose metabolism disease (multiple); kidney disease; and obesity.
    Orthologous to several human genes including GFPT1 (glutamine--fructose-6-phosphate
    transaminase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GFA1
  source_id: SGD:S000001587
