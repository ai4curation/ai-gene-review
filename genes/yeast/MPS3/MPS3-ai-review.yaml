  supported_by:
  - reference_id: PMID:16923827
    supporting_text: provide evidence that it interacts with the Mps2 C terminus to tether the half-bridge
      to the core SPB
  - reference_id: PMID:30862629
    supporting_text: We find that the Sad1-UNC-84 (SUN) protein Mps3 forms a ring-like structure around
      the SPB, similar to toroids seen for components of the SPB insertion network (SPIN).
  - reference_id: PMID:12486115
    supporting_text: Execution point experiments revealed that MPS3 function is required for the first
      step of SPB duplication in G1.
