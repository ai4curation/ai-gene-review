core_functions:
- description: 'SPB half-bridge organization and anchoring: at the nuclear side of the half-bridge, Mps3
    recruits Cdc31 and, through its SUN domain binding the KASH-like protein Mps2, tethers the half-bridge
    to the SPB core in a noncanonical LINC complex, enabling SPB duplication and insertion.'
  molecular_function:
    id: GO:0106166
    label: spindle pole body-nuclear membrane anchor activity
  directly_involved_in:
