- term:
    id: GO:0000741
    label: karyogamy
  evidence_type: IMP
  original_reference_id: PMID:16923827
  qualifier: involved_in
  review:
    summary: 'Karyogamy: mutants in the Mps3 SUN domain or the Mps2 C-terminus have karyogamy defects.'
    action: KEEP_AS_NON_CORE
    reason: The karyogamy defects are consistent with aberrant half-bridge structures; the half-bridge,
      which Mps3 organizes, is the site from which nuclear congression and fusion are initiated. Mps3
      therefore contributes structurally to karyogamy, but this is secondary to its core SPB half-bridge
      and anchoring functions.
    supported_by:
    - reference_id: PMID:16923827
      supporting_text: Mutants in the Mps3 SUN domain or Mps2 C terminus have SPB duplication and karyogamy
        defects that are consistent with the aberrant half-bridge structures we observe cytologically.
