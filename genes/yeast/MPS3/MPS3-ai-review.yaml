suggested_questions:
- question: Mps3 is a SPIN component forming a ring at the SPB fenestra with Mps2 (PMID:30862629). Should
    it carry GO:0140480 mitotic spindle pole body insertion into the nuclear envelope, as fission-yeast
    Sad1 does, or is the evidence still insufficient to separate insertion from duplication?
  experts:
  - SGD curators
  - SPB biologists
- question: The budding-yeast t-LINC (Mps3-Mps2-Csm4) couples telomeres to actin via Myo2 rather than
    to microtubules. Is GO:0034993 'meiotic nuclear membrane microtubule tethering complex' the right
    complex term, or does GO need a more general meiotic LINC complex term?
  experts:
  - GO cellular component editors
suggested_experiments:
- description: Structure of the Mps3 SUN domain with the Mps2 luminal C-terminus to test whether this
    high-stoichiometry noncanonical LINC uses the canonical KASH-binding groove.
  hypothesis: Mps2 binds Mps3 at the canonical SUN groove despite lacking a PPPX KASH motif.
  experiment_type: cryo-EM / crosslinking mass spectrometry
