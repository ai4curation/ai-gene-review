id: P47069
gene_symbol: MPS3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Mps3 (monopolar spindle 3; also Nep98) is the single SUN-domain protein of Saccharomyces
  cerevisiae. It is an essential single-pass inner nuclear membrane protein with a nucleoplasmic N-terminal
  region (including an acidic domain) and a luminal C-terminal region containing the SUN domain. Mps3
  is concentrated on the nuclear side of the spindle pole body (SPB) half-bridge, where it recruits the
  centrin Cdc31 and is required for the first step of SPB duplication in G1. Its SUN domain binds the
  C-terminus of the KASH-like outer-nuclear-membrane protein Mps2, forming a noncanonical LINC complex
  that tethers the half-bridge to the SPB core and forms a ring at the SPB insertion site. Outside the
  SPB, the N-terminal acidic domain anchors telomeres at the nuclear periphery during S phase by binding
  Sir4, contributing to telomere clustering and silencing, and binds the histone variant H2A.Z, which
  is needed for INM targeting of Mps3. Mps3 also contributes to establishment of sister chromatid cohesion,
  interacting with and being acetylated by Eco1. In meiotic prophase Mps3 redistributes into multiple
  nuclear envelope patches, binds the telomere protein Ndj1 through its N-terminus, and with Mps2 and
  Csm4 forms a telomere-associated LINC complex that couples telomeres to the cytoskeleton for bouquet
  formation and rapid prophase chromosome movements that promote homolog juxtaposition and regulated recombination.
