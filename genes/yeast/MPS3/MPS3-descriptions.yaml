descriptions:
- source: UniProt
  text: Component of the linker nucleocytoskeleton and cytoskeleton (LINC) complex
    that regulates telomere movement and meiotic recombination during meiosis (PubMed:17245108,
    PubMed:18585352, PubMed:32967926). Connects the spindle pole body with the nuclear
    envelope through its interaction with MPS2 and mediates meiotic bouquet formation
    and rapid chromosome movements in meiotic prophase (PubMed:16923827, PubMed:17495028,
    PubMed:22017544). Functions as an integral membrane anchor for telomeres and is
    a nuclear receptor for the SIR4 pathway of telomere tethering and gene inactivation
    (PubMed:18039933, PubMed:19390087). Essential for nuclear division and fusion
    and required for the first step of spindle pole body duplication in G1 (PubMed:12486115,
    PubMed:12493774). Functions in sister chromatid cohesion establishment (PubMed:15355977,
    PubMed:16682351). Recruits double-strand breaks (DSBs) to the nuclear periphery
    for chromosome healing (PubMed:19217407, PubMed:19390086, PubMed:20016273).
