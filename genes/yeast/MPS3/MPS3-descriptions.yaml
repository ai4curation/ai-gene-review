- source: Alliance_Imported
  text: Nuclear envelope protein; required for SPB insertion, SPB duplication, Kar5p
    localization near the SPB and nuclear fusion; interacts with Mps2p to tether half-bridge
    to core SPB; N-terminal acetylation by Eco1p regulates its role in nuclear organization;
    localizes to the SPB half bridge and telomeres during meiosis; required with Ndj1p
    and Csm4p for meiotic bouquet formation and telomere-led rapid prophase movement;
    member of the SUN protein family (Sad1-UNC-84 homology)
