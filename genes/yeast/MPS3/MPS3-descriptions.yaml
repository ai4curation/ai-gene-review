descriptions:
- source: UniProt
  text: Component of the linker nucleocytoskeleton and cytoskeleton (LINC) complex
    that regulates telomere movement and meiotic recombination during meiosis (PubMed:17245108,
    PubMed:18585352, PubMed:32967926). Connects the spindle pole body with the nuclear
    envelope through its interaction with MPS2 and mediates meiotic bouquet formation
    and rapid chromosome movements in meiotic prophase (PubMed:16923827, PubMed:17495028,
    PubMed:22017544). Functions as an integral membrane anchor for telomeres and is
    a nuclear receptor for the SIR4 pathway of telomere tethering and gene inactivation
    (PubMed:18039933, PubMed:19390087). Essential for nuclear division and fusion
    and required for the first step of spindle pole body duplication in G1 (PubMed:12486115,
    PubMed:12493774). Functions in sister chromatid cohesion establishment (PubMed:15355977,
    PubMed:16682351). Recruits double-strand breaks (DSBs) to the nuclear periphery
    for chromosome healing (PubMed:19217407, PubMed:19390086, PubMed:20016273).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47069
  source_id: P47069
- source: Alliance_Imported
  text: Nuclear envelope protein; required for SPB insertion, SPB duplication, Kar5p
    localization near the SPB and nuclear fusion; interacts with Mps2p to tether half-bridge
    to core SPB; N-terminal acetylation by Eco1p regulates its role in nuclear organization;
    localizes to the SPB half bridge and telomeres during meiosis; required with Ndj1p
    and Csm4p for meiotic bouquet formation and telomere-led rapid prophase movement;
    member of the SUN protein family (Sad1-UNC-84 homology)
  source_type: curated
  url: https://www.yeastgenome.org/locus/MPS3
  source_id: SGD:S000003556
- source: Alliance_Automated
  text: Predicted to enable protein-membrane adaptor activity. Involved in several
    processes, including chromosome organization; nuclear migration involved in conjugation
    with cellular fusion; and subtelomeric heterochromatin formation. Located in chromosome,
    telomeric region; half bridge of spindle pole body; and nucleus.
  source_type: automated
