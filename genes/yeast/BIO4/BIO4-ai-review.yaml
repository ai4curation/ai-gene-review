  label: Saccharomyces cerevisiae S288C
description: Bio4p is the dethiobiotin synthetase (BioD; EC 6.3.3.3) of Saccharomyces cerevisiae, a P-loop NTPase
  family ligase that uses ATP and CO2 to close the ureido ring of 7,8-diaminopelargonate (DAPA), forming
  dethiobiotin, the penultimate intermediate of biotin biosynthesis. Mg2+ is the expected cofactor by similarity to
  bacterial BioD. BIO4 lies in a gene cluster with BIO3 (DAPA aminotransferase) and BIO5 (a transporter for the
  precursor KAPA). Its product dethiobiotin is converted to biotin by the mitochondrial biotin synthase Bio2p.
