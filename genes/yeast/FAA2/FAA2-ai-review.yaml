taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FAA2 (YER015W; also FAM1) encodes the peroxisomal medium- and long-chain fatty acyl-CoA synthetase
  of Saccharomyces cerevisiae (ATP-dependent AMP-binding enzyme family, EC 6.2.1.3). Purified Faa2p has the broadest
  chain-length range of the yeast Faa enzymes, preferring C9:0-C13:0 and tolerating C7:0-C17:0 fatty acids, and
  it is the main (probably exclusive) octanoate/decanoate/laurate-CoA ligase. Faa2p is oleate-induced, imported
  by the PTS1 pathway and associates peripherally with the matrix side of the peroxisomal membrane. There it activates
  medium-chain fatty acids that enter peroxisomes as free acids, and it re-esterifies long-chain and very-long-chain
  fatty acids released by the Pxa1p/Pxa2p ABC transporter, which hydrolyses acyl-CoAs during transport. It thereby
  supplies acyl-CoA substrates directly to the peroxisomal beta-oxidation enzymes (Pox1p, Fox2p, Pot1p). When overexpressed
  it can also activate endogenous myristate pools for protein N-myristoylation.
