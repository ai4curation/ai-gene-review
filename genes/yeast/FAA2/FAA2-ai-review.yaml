suggested_questions:
- question: What fraction of residual peroxisomal very-long-chain acyl-CoA synthetase activity in fat1 mutants is
    due to Faa2p, and do Faa2p and Fat1p physically associate with Pxa1p/Pxa2p at the membrane?
- question: Is Faa2p's association with the peroxisomal membrane mediated by a protein partner (e.g. Pxa1p/Pxa2p)
    or by intrinsic lipid binding?
suggested_experiments:
- hypothesis: Faa2p and Fat1p together account for all intraperoxisomal re-esterification of fatty acids delivered
    by Pxa1p/Pxa2p.
  description: Measure C16-C26 beta-oxidation and intraperoxisomal acyl-CoA formation (tandem MS) in faa2, fat1
    and faa2 fat1 strains, with and without Pxa1p/Pxa2p, using isolated peroxisomes and intact cells.
