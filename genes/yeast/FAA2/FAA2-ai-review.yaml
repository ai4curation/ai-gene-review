core_functions:
- description: 'Intraperoxisomal medium-chain (and long-chain) fatty acid-CoA ligase: activates free C8-C12 fatty
    acids that enter peroxisomes, and re-esterifies longer fatty acids delivered by the Pxa1p/Pxa2p transporter,
    supplying acyl-CoA directly to peroxisomal beta-oxidation.'
