gene_symbol: FAA2
organism: yeast
uniprot_id: P39518
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Activates endogenous medium-chain (MCFA) and long-chain fatty acids (LCFA)
    by esterification of the fatty acids into metabolically active CoA-thioesters
    for subsequent degradation or incorporation into phospholipids (PubMed:8206942).
    Preferentially acts on C9:0-C13:0 fatty acids although C7:0-C17:0 fatty acids
    are tolerated (PubMed:8206942). Is the main if not exclusive MCFA (octanoate,
    decanoate and laureate) acyl-CoA ligase. Required for efficient MCFA beta-oxidation
    inside peroxisomes. Facilitates the transport of MCFAs into peroxisomes by passive
    diffusion, by decreasing the intraorganellar MCFA concentration (PubMed:8670886).
    Also esterifies LCFAs in the peroxisome matrix. The LCFAs are actively transported
    into peroxisomes by a PXA1-PXA2 heterodimeric transporter in the peroxisomal membrane
    (PubMed:22493507).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39518
  source_id: P39518
- source: Alliance_Imported
  text: Medium chain fatty acyl-CoA synthetase; activates imported fatty acids; accepts
    a wide range of fatty acid chain lengths with a preference for medium chains,
    C9:0-C13:0; localized to the peroxisome; comparative analysis suggests that a
    mitochondrially targeted form may result from translation starting at a non-canonical
    codon upstream of the annotated start codon
  source_type: curated
  url: https://www.yeastgenome.org/locus/FAA2
  source_id: SGD:S000000817
- source: Alliance_Automated
  text: Enables decanoate-CoA ligase activity; long-chain fatty acid-CoA ligase activity;
    and very long-chain fatty acid-CoA ligase activity. Involved in fatty acid metabolic
    process; fatty-acyl-CoA transport; and long-chain fatty acid import into peroxisome.
    Located in peroxisomal membrane. Human ortholog(s) of this gene implicated in
    acute myeloid leukemia; congenital diarrhea; and leukemia. Orthologous to several
    human genes including ACSL1 (acyl-CoA synthetase long chain family member 1) and
    ACSL5 (acyl-CoA synthetase long chain family member 5).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FAA2
  source_id: SGD:S000000817
