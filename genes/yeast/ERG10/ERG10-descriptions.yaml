descriptions:
- source: UniProt
  text: Acetyl-CoA acetyltransferase; part of the first module of ergosterol biosynthesis
    pathway that includes the early steps of the pathway, conserved across all eukaryotes,
    and which results in the formation of mevalonate from acetyl-coenzyme A (acetyl-CoA)
    (PubMed:5571829, PubMed:7989303). ERG10 catalyzes the formation of acetoacetyl-CoA
    from acetyl-CoA (PubMed:5571829, PubMed:7989303). The first module starts with
    the action of the cytosolic acetyl-CoA acetyltransferase ERG10 that catalyzes
    the formation of acetoacetyl- CoA. The hydroxymethylglutaryl-CoA synthase ERG13
    then condenses acetyl-CoA with acetoacetyl-CoA to form HMG-CoA. The rate-limiting
    step of the early module is the reduction to mevalonate by the 3-hydroxy-3- methylglutaryl-coenzyme
    A (HMG-CoA) reductases HMG1 and HMG2 which are derived from a single ancestral
    HMGR gene by gene duplication (PubMed:32679672).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41338
  source_id: P41338
- source: Alliance_Imported
  text: Acetyl-CoA C-acetyltransferase (acetoacetyl-CoA thiolase); cytosolic enzyme
    that transfers an acetyl group from one acetyl-CoA molecule to another, forming
    acetoacetyl-CoA; involved in the first step in mevalonate biosynthesis; human
    ACAT1 functionally complements the growth defect caused by repression of ERG10
    expression
  source_type: curated
  url: https://www.yeastgenome.org/locus/ERG10
  source_id: SGD:S000005949
- source: Alliance_Automated
  text: Enables acetyl-CoA C-acetyltransferase activity. Involved in ergosterol biosynthetic
    process. Located in cytoplasm. Human ortholog(s) of this gene implicated in beta-ketothiolase
    deficiency and carbohydrate metabolic disorder. Orthologous to human ACAT1 (acetyl-CoA
    acetyltransferase 1).
