id: P41338
gene_symbol: ERG10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG10 encodes the cytosolic acetoacetyl-CoA thiolase (acetyl-CoA C-acetyltransferase, EC
  2.3.1.9) of Saccharomyces cerevisiae, a homotetrameric member of the thiolase family with conserved
  active-site cysteines (C91, C384). Erg10 catalyses the Claisen condensation of two acetyl-CoA molecules
  to acetoacetyl-CoA, the first committed step of the mevalonate pathway that supplies isoprenoid precursors
  for ergosterol, dolichol, ubiquinone and prenylated proteins. ERG10 is a single-copy essential gene;
  null alleles abolish acetoacetyl-CoA thiolase activity and cause mevalonate auxotrophy. Its expression
  rises when cellular sterol levels are low and in the cold.
