  label: Saccharomyces cerevisiae
description: PNO1 encodes Pno1/Dim2/Rrp20, a conserved KH-domain ribosome biogenesis
  factor required for small ribosomal subunit synthesis. Pno1 binds pre-rRNA, especially
  the ITS1 region, participates in early SSU processome and 90S to pre-40S transitions,
  supports pre-40S export from the nucleus, and works with Nob1 and Rio1 during late
  cytoplasmic 20S pre-rRNA to 18S rRNA maturation. Through these RNA-binding and protein-interaction
  roles, Pno1 helps coordinate assembly-factor remodeling and accurate final 18S rRNA
  processing before nascent 40S subunits enter translation.
