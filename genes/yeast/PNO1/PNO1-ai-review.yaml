    reason: >-
      The InterPro transfer is biologically sound: Pno1 contains conserved KH
      RNA-binding domains, and Vanrobays et al. showed directly that Dim2 binds
      35S, 20S, and methylated 20S pre-rRNAs. GO:0003723 is broader than the SGD IDA
      GO:0042134 rRNA primary transcript binding row, but RNA binding is the
      core molecular activity that lets Pno1 couple pre-rRNA association with
      SSU/pre-40S assembly and Nob1-mediated 18S maturation.
    supported_by:
    - reference_id: GO_REF:0000002
      supporting_text: Gene Ontology annotation through association of InterPro records
        with GO terms
    - reference_id: PMID:15037774
      supporting_text: We concluded that Dim2p is tightly bound to the 35S, 20S,
        and methylated 20S pre-rRNAs.
