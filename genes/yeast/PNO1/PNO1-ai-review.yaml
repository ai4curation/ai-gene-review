  review:
    summary: New InterPro2GO RNA-binding IEA derived from the type-I KH-domain superfamily
      hit. This replaces an older combined RNA-binding IEA row and is consistent
      with direct evidence that the KH-domain factor Pno1/Dim2 binds pre-rRNA.
