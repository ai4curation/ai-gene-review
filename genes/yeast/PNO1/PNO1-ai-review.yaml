- term:
    id: GO:0051082
    label: unfolded protein binding
  retired: true
  evidence_type: IDA
  original_reference_id: PMID:12502737
  review:
    summary: The old proteasome study supports a Pno1-Nob1 interaction and pno1 proteasome
      phenotypes, not direct unfolded-protein binding by Pno1.
    action: REMOVE
    reason: Tone and Toh-e showed that Pno1p forms a complex with Nob1p and that a
      pno1-1 mutant has proteasome maturation phenotypes, but their chaperone model
      was for Nob1p rather than a direct Pno1 unfolded-protein-binding activity. The
      closest Pno1 result in the paper is that pno1-1 blocks nuclear transfer of immature
      20S proteasome precursors, a requirement-for-transport phenotype rather than
      a Pno1 binding assay. Subsequent yeast studies established Dim2/Pno1 as a KH-domain
      SSU/pre-40S assembly factor that binds pre-rRNA and helps Nob1 with final 18S
      rRNA maturation, so generic unfolded-protein binding should not be carried forward
      as a Pno1 molecular function.
    additional_reference_ids:
    - PMID:15037774
    - PMID:21075849
    supported_by:
    - reference_id: PMID:12502737
      supporting_text: These data show that Nob1p and Pno1p form a complex.
    - reference_id: PMID:12502737
      supporting_text: Nob1p serves as a chaperone to join the 20S proteasome with
        the 19S regulatory particle in the nucleus
    - reference_id: PMID:12502737
      supporting_text: Nob1p and Pno1p, but not Ump1p, are required for nuclear transfer
        of the 20S proteasome
    - reference_id: PMID:15037774
      supporting_text: Dim2p, a core constituent of the SSU RRP complex
    - reference_id: PMID:21075849
      supporting_text: Dim2 increases Nob1 RNA affinity.
