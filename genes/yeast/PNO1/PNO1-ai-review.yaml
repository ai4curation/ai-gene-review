suggested_questions:
- question: Should the legacy PNO1 proteasome assembly annotations be retired or replaced
    by updated pre-40S/Nob1 maturation annotations in upstream SGD/GO curation?
suggested_experiments:
- description: Revisit proteasome assembly phenotypes in pno1/dim2 mutants using acute
    degron depletion and ribosome-processing rescue constructs to distinguish direct
    proteasome effects from secondary consequences of impaired ribosome biogenesis.
  experiment_type: conditional depletion/rescue
  hypothesis: The reported proteasome maturation defects are indirect consequences
    of perturbed Nob1/Pno1 ribosome biogenesis or pleiotropic essential-gene stress.
