descriptions:
- source: UniProt
  text: Ornithine decarboxylase (ODC) antizyme protein that negatively regulates ODC
    activity and intracellular polyamine biosynthesis in response to increased intracellular
    polyamine levels (PubMed:15538383). Binds to ODC/SPE1 monomers, inhibiting the
    assembly of the functional ODC homodimer, and targets the monomers for ubiquitin-independent
    proteolytic destruction by the 26S proteasome (PubMed:18089576).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02803
