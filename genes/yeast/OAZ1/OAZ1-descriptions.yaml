gene_symbol: OAZ1
organism: yeast
uniprot_id: Q02803
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Ornithine decarboxylase (ODC) antizyme protein that negatively regulates ODC
    activity and intracellular polyamine biosynthesis in response to increased intracellular
    polyamine levels (PubMed:15538383). Binds to ODC/SPE1 monomers, inhibiting the
    assembly of the functional ODC homodimer, and targets the monomers for ubiquitin-independent
    proteolytic destruction by the 26S proteasome (PubMed:18089576).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02803
  source_id: Q02803
- source: Alliance_Imported
  text: Regulator of ornithine decarboxylase Spe1p; antizyme that binds to Spe1p to
    stimulate ubiquitin-independent degradation by the proteasome; binding of polyamines
    to nascent Oaz1p during translation stimulates +1 ribosomal frameshifting, allowing
    translation of full-length Oaz1p
  source_type: curated
  url: https://www.yeastgenome.org/locus/OAZ1
  source_id: SGD:S000005973
- source: Alliance_Automated
  text: Enables ornithine decarboxylase inhibitor activity. Involved in negative regulation
    of translational frameshifting and regulation of proteasomal protein catabolic
    process. Predicted to be located in cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/OAZ1
  source_id: SGD:S000005973
