    summary: 'Palanimurugan et al. (2004) identified OAZ1 and showed that ODC levels and turnover depend on Oaz1:
      oaz1 deletion stabilises ODC and abolishes spermidine-induced ODC degradation. With the UniProt-curated interaction
      (Oaz1 binds Spe1 monomers and blocks homodimerisation), this supports ornithine decarboxylase inhibitor activity
      as the core molecular function.'
