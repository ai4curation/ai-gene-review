  label: Saccharomyces cerevisiae S288C
description: OAZ1 (YPL052W) encodes the single ornithine decarboxylase antizyme of Saccharomyces cerevisiae, a non-catalytic
  feedback regulator of polyamine synthesis. Oaz1 binds monomers of ornithine decarboxylase (Spe1), preventing formation
  of the active ODC homodimer and targeting ODC for ubiquitin-independent degradation by the 26S proteasome; yeast
  Oaz1 promotes ODC degradation by yeast but not mammalian proteasomes and, unlike mammalian antizyme, has only
  a minor effect on polyamine uptake. Oaz1 synthesis requires a +1 ribosomal frameshift between two overlapping
  ORFs; polyamines stimulate frameshifting by binding the nascent Oaz1 polypeptide, which at low polyamine levels
  stalls ribosomes on its own mRNA. Polyamines also inhibit Ubc4/Ubc5-dependent ubiquitylation and proteasomal turnover
  of Oaz1. Together these mechanisms couple Oaz1 levels to intracellular polyamine concentration, so that rising
  polyamines lower ODC levels and polyamine production. Oaz1 acts in the cytoplasm.
