  review:
    summary: Porat et al. (2008) showed that yeast antizyme binds yeast ODC through a segment equivalent to the
      mammalian AZ-binding element and provokes its degradation by yeast 26S proteasomes. The effect is a positive
      regulation (stimulation) of ODC proteasomal degradation; the parent "regulation" term is correct but unspecific.
    action: MODIFY
    reason: Oaz1 stimulates (rather than merely regulates) proteasomal degradation of ODC; use the positive-regulation
      child term.
    proposed_replacement_terms:
