suggested_questions:
- question: Does yeast Oaz1 regulate polyamine transport under any condition, given that it has only a minor effect
    on uptake compared with mammalian antizyme, and is there a yeast antizyme inhibitor equivalent?
suggested_experiments:
- description: Measure intracellular putrescine/spermidine/spermine and ODC activity in oaz1 deletion and frameshift-independent
    (in-frame) OAZ1 strains across a range of exogenous spermidine to quantify the feedback contribution of Oaz1
    to polyamine pools.
