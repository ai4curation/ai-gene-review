- term:
    id: GO:2001125
    label: negative regulation of translational frameshifting
  evidence_type: IMP
  original_reference_id: PMID:21900894
  qualifier: involved_in
  review:
    summary: Kurian et al. (2011) showed that the nascent Oaz1 polypeptide is itself the polyamine sensor and, at
      low polyamine levels, inhibits the +1 ribosomal frameshift needed to complete its own synthesis (ribosome
      pile-up on OAZ1 mRNA). This is a genuine, cis-acting autoregulatory activity of the Oaz1 product, but it concerns
      the gene's own expression rather than its feedback function on ODC.
    action: KEEP_AS_NON_CORE
    reason: Valid autoregulatory role in decoding OAZ1 mRNA; secondary to ODC inhibition.
    supported_by:
    - reference_id: PMID:21900894
      supporting_text: the nascent antizyme polypeptide is the relevant polyamine sensor that operates in cis to
        negatively regulate upstream RFS on the polysomes, where its own mRNA is being translated.
