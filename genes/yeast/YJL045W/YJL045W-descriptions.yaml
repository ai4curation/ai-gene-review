descriptions:
- source: UniProt
  text: Probable minor catalytic subunit of succinate dehydrogenase (SDH) that is
    involved in complex II of the mitochondrial electron transport chain and is responsible
    for transferring electrons from succinate to ubiquinone (coenzyme Q). Probably
    forms a catalytic dimer with SDH2. Electrons flow from succinate to the FAD bound
    to the catalytic subunit, and sequentially through the iron-sulfur clusters bound
    to SDH2 and enter the membrane dimer formed by SDH3 and SDH4.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47052
  source_id: P47052
- source: Alliance_Imported
  text: Minor succinate dehydrogenase isozyme; participates in oxidation of succinate
    and transfer of electrons to ubiquinone; induced during the diauxic shift in a
    Cat8p-dependent manner; YJL045W has a paralog, SDH1, that arose from the whole
    genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SDH9
  source_id: SGD:S000003581
- source: Alliance_Automated
  text: Enables succinate dehydrogenase (quinone) activity. Involved in cellular respiration.
    Located in mitochondrion. Human ortholog(s) of this gene implicated in several
    diseases, including Leigh disease; dilated cardiomyopathy 1GG; lung non-small
    cell carcinoma; mitochondrial complex II deficiency; and pheochromocytoma/paraganglioma
    syndrome 5. Orthologous to human SDHA (succinate dehydrogenase complex flavoprotein
    subunit A).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SDH9
  source_id: SGD:S000003581
