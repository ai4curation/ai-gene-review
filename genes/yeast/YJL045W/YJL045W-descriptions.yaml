  text: Minor succinate dehydrogenase isozyme; participates in oxidation of succinate
    and transfer of electrons to ubiquinone; induced during the diauxic shift in a
    Cat8p-dependent manner; YJL045W has a paralog, SDH1, that arose from the whole
    genome duplication
