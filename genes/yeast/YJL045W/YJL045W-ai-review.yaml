id: P47052
gene_symbol: YJL045W
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: YJL045W (SDH1b) encodes a minor paralog of the succinate dehydrogenase flavoprotein subunit
  Sdh1p (SDHA family, FAD-dependent oxidoreductase 2 family). On a plasmid it restores respiration and
  SDH activity in sdh1 mutants. Residual SDH activity in sdh1 single disruptants depends on it, so it
  can act as the catalytic flavoprotein of complex II (succinate:quinone oxidoreductase, EC 1.3.5.1),
  oxidizing succinate to fumarate at its FAD and passing electrons to Sdh2p. Its promoter activity is
  100-500-fold lower than SDH1's, and its deletion alone has no obvious phenotype, so it contributes little
  to respiration under standard conditions. It localizes to mitochondria.
