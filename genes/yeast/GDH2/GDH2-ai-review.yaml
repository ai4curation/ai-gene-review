  label: Saccharomyces cerevisiae S288C
description: NAD+-specific glutamate dehydrogenase (EC 1.4.1.2) of Saccharomyces cerevisiae, a large (~120
  kDa subunit) fungal-type NAD-GDH that is unrelated in subunit size and regulation to the hexameric NADP-GDHs
  GDH1 and GDH3. GDH2 catalyses the NAD+-dependent oxidative deamination of L-glutamate to 2-oxoglutarate
  and ammonium, the major (though not sole) route for releasing ammonia from glutamate when glutamate
  or other poor nitrogen sources that are funnelled through glutamate are used; it does not normally contribute
  to glutamate biosynthesis. The enzyme is cytosolic and is regulated by nitrogen catabolite repression;
  it interacts with and is phosphorylated by a complex containing the TORC1-effector kinase Nnk1.
