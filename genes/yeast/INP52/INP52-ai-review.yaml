suggested_questions:
- question: What is the physiological substrate of the Inp52 Sac domain at actin patches (PI4P generated by the
    5-phosphatase domain, or PI3P), and does sequential 5- then 4-dephosphorylation occur in vivo?
suggested_experiments:
- hypothesis: Inp52 performs sequential PI(4,5)P2 -> PI4P -> PI dephosphorylation in cis
  description: Compare PI4P and PI(4,5)P2 dynamics at endocytic sites (biosensors) in strains carrying Sac-dead,
    5-phosphatase-dead and double-dead Inp52 alleles in an inp51 background.
  experiment_type: live-cell imaging / genetics
