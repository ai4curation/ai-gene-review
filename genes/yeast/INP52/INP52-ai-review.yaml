gene_symbol: INP52
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'INP52 (SJL2) encodes a yeast synaptojanin-like polyphosphoinositide phosphatase with two active sites:
  an N-terminal Sac1-like domain that dephosphorylates PI3P, PI4P and PI(3,5)P2 to PI, and a central inositol 5-phosphatase
  domain that hydrolyses PI(4,5)P2 (and PI(3,5)P2) at the 5-position, followed by a C-terminal proline-rich region.
  Inp52 is diffuse in the cytoplasm of resting cells and is recruited to cortical actin patches (endocytic sites)
  through the SH3 protein Abp1 and the adaptor Bsp1, translocating there rapidly after hyperosmotic stress. By turning
  over PI(4,5)P2 at endocytic sites it promotes late stages of endocytic vesicle formation and fission and actin
  patch dynamics; it is partially redundant with Inp51 and Inp53, and the inp51 inp52 inp53 triple mutant is inviable.'
