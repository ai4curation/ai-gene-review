gene_symbol: INP52
organism: yeast
uniprot_id: P50942
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Dephosphorylates a number of phosphatidylinositols (PIs) like phosphatidylinositol
    4,5-bisphosphate (PtdIns(4,5)P2), but also phosphatidylinositol 3-phosphate (PtdIns(3)P),
    phosphatidylinositol 4- phosphate (PtdIns(4)P), and phosphatidylinositol 3,5-bisphosphate
    (PtdIns(3,5)P2). Controls the cellular levels and subcellular distribution of
    phosphatidylinositol 3-phosphate and phosphatidylinositol 4,5-bisphosphate. Specifically
    functions within the early endocytic pathway and actin organization.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50942
  source_id: P50942
- source: Alliance_Imported
  text: Polyphosphatidylinositol phosphatase; dephosphorylates a number of phosphatidylinositol
    phosphates (PtdInsPs, PIPs) to PI; involved in endocytosis; hyperosmotic stress
    causes translocation to actin patches; synaptojanin-like protein with a Sac1 domain;
    INP52 has a paralog, INP53, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/INP52
  source_id: SGD:S000005050
- source: Alliance_Automated
  text: Enables phosphatidylinositol phosphate phosphatase activity. Involved in phosphatidylinositol
    dephosphorylation. Located in actin cortical patch. Human ortholog(s) of this
    gene implicated in Parkinson's disease; Parkinson's disease 20; and developmental
    and epileptic encephalopathy 53. Orthologous to human SYNJ1 (synaptojanin 1) and
    SYNJ2 (synaptojanin 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/INP52
  source_id: SGD:S000005050
