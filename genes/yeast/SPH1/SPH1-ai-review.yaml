core_functions:
- description: Cortical polarity factor at sites of polarized growth (incipient bud site, bud tip, bud
    neck, shmoo tip) that acts partly redundantly with its paralog Spa2 to direct polarized growth, including
    bipolar bud-site selection and mating-projection morphogenesis. Unlike Spa2 it is not needed to recruit
    the Slt2 MAPK module to bud tips, but it is needed for full activation of Slt2, by a mechanism that
    is not known; no Sph1 molecular activity has been demonstrated.
  directly_involved_in:
  - id: GO:0007121
    label: bipolar cellular bud site selection
  locations:
  - id: GO:0005934
    label: cellular bud tip
  - id: GO:0000131
    label: incipient cellular bud site
  - id: GO:0005935
    label: cellular bud neck
  - id: GO:0043332
    label: mating projection tip
  supported_by:
  - reference_id: PMID:9214378
    supporting_text: 'These experiments demonstrate that Sph1p also localizes to sites of polarized growth:
      at the site where the bud will form, the bud tip, and the mother–daughter bud neck.'
  - reference_id: PMID:9214378
    supporting_text: Together these results demonstrate that SPH1 is required for bipolar budding after
      the positioning of the first bud and, together with shmoo formation and mating experiments, show
      that SPH1 and SPA2 have overlapping functions.
  - reference_id: PMID:9443897
    supporting_text: In pheromone-treated cells, Sph1p localizes to the tip of the mating projection.
  - reference_id: PMID:23924898
    supporting_text: Pea2p and Spa2p are needed to recruit Slt2p to bud tips, and Bni1p, Bud6p, and Sph1p
      affect the level of Slt2p activation.
  - reference_id: file:yeast/SPH1/SPH1-deep-research-falcon.md
    supporting_text: Sph1p is best annotated as a **polarized-growth-associated regulatory protein** with
      a demonstrated contribution to activation of the cell-wall-integrity MAP kinase **Slt2p/Mpk1p**.
suggested_questions:
- question: Sph1 is not needed for bud-tip Slt2 or Mkk1 localization (PMID:23924898), so what do its two-hybrid
    MAPKK interactions do? Does Sph1 hold Ste7 at the shmoo tip, which was not tested, and how does it
    promote full Slt2 activation?
- question: Is Sph1 localization Spa2-dependent? PMID:9443897 reports that proper Sph1 localization requires
    Spa2, whereas PMID:9214378 reports that Sph1-GFP localizes in spa2 deletion cells.
- question: Should the PomBase-only GO:0120105 (contractile ring intermediate layer) IBD on the PTHR21601
    Eukaryota root node PTN004550576 be constrained to the Schizosaccharomyces branch, so that it is not
    exported to budding-yeast SPA2 and SPH1?
suggested_experiments:
- description: Image Ste7-GFP at shmoo tips in sph1, spa2 and sph1 spa2 strains, and test whether an
    SHD1-motif mutant of Sph1 abolishes MAPKK binding and the Sph1 contribution to Slt2 activation in
    a ptc1 background.
