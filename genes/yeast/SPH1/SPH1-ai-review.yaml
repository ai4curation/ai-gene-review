- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0005078
  review:
    summary: Inter-ontology inference from the MAP kinase scaffold activity IBA. The better support for
      a link to MAPK signalling is Sph1-specific in vivo data (Li et al. 2013) rather than the scaffold
      inference. In a ptc1 deletion background, where Slt2 dephosphorylation is blocked, sph1 deletion
      significantly lowers the pool of dually phosphorylated (active) Slt2, without affecting Slt2 or
      Mkk1 localization at bud tips. Sph1 is therefore needed for full activation of the cell wall integrity
      MAPK Slt2, through a mechanism that is not known.
    action: KEEP_AS_NON_CORE
    reason: The IEA itself follows mechanically from GO:0005078, which is over-annotated for Sph1 (see
      that row). The phospho-Slt2 data independently tie Sph1 to the Slt2 cascade, as a contributor to
      full Slt2 activation rather than as a transmitting component, and the effect is seen only in a
      sensitized ptc1 background. MAPK signalling is not the best-supported role of Sph1, which is the
      localization-dependent control of polarized growth, so the term is retained as non-core and not
      promoted.
    supported_by:
    - reference_id: PMID:23924898
      supporting_text: The bni1∆ptc1∆, bud6∆ptc1∆, and sph1∆ptc1∆ double mutants had significantly decreased
        pools of active Slt2p relative to the ptc1∆ single mutant (Figure 3).
    - reference_id: PMID:23924898
      supporting_text: Pea2p and Spa2p are needed to recruit Slt2p to bud tips, and Bni1p, Bud6p, and
        Sph1p affect the level of Slt2p activation.
    - reference_id: file:yeast/SPH1/SPH1-deep-research-falcon.md
      supporting_text: Thus, under these experimental conditions, Sph1p helps sustain **full activation**
        of Slt2 rather than serving as its demonstrated bud-tip recruitment scaffold.
