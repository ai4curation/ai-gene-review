- term:
    id: GO:0005078
    label: MAP kinase scaffold activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000492368
  - SGD:S000003944
  review:
    summary: MAP kinase scaffold activity propagated from the PTHR21601 family (GOA cites old node PTN000492368;
      current PAINT places the IBD on the Eukaryota root node PTN004550576, seeded only by S. cerevisiae
      Spa2). Sph1 shares the N-terminal Spa2 homology domain (Pfam GIT_SHD) that binds MAPKKs in Spa2.
      It interacts with Mkk1, Mkk2 and Ste7 by two-hybrid, interacts weakly with Ste11, and these interactions
      do not require Ste5. The one in vivo test of tethering was negative. In Li et al. 2013, sph1 deletion
      did not disrupt bud-tip localization of Slt2-GFP or Mkk1-GFP, whereas spa2 and pea2 deletions did.
      What Sph1 does contribute is full activation of Slt2 (see the GO:0000165 row).
    action: MARK_AS_OVER_ANNOTATED
    reason: The two-hybrid binding of several MAPKKs (PMID:9443897) is consistent with the binding part
      of the scaffold definition, so the term is not simply wrong, but the scaffold role itself, recruiting
      or holding the MAPK module at growth sites, was tested directly for Sph1 and not supported. In the
      same assays the paralog Spa2 (with Pea2) is the recruiter of Slt2 and Mkk1, and Sph1 is instead
      needed for full Slt2 activation by an unknown mechanism. The scaffold activity is therefore a Spa2
      property that the family IBD passes to Sph1 by descent without Sph1-specific functional support,
      and it should not be treated as an Sph1 function. The PAINT fix is to place the IBD on the Spa2
      branch only, or to add a negative (IRD) assertion on the Sph1 branch.
    supported_by:
    - reference_id: PMID:9443897
      supporting_text: 'Sph1p interacts in the two-hybrid system with three mitogen-activated protein
        (MAP) kinase kinases (MAPKKs): Mkk1p and Mkk2p, which function in the cell wall integrity/cell
        polarization MAP kinase pathway, and Ste7p, which operates in the pheromone and pseudohyphal signaling
        response pathways.'
    - reference_id: PMID:9443897
      supporting_text: We speculate that Spa2p and Sph1p may function during pseudohyphal and haploid
        invasive growth to help tether this MAP kinase module to sites of polarized growth.
    - reference_id: PMID:23924898
      supporting_text: In contrast, the deletion of other polarisome component genes did not significantly
        affect Slt2p-GFP localization at bud tips (Figure 2 and Supplemental Figure S3).
    - reference_id: PMID:23924898
      supporting_text: The deletion of polarisome gene BUD6, BNI1, or SPH1 did not affect Mkk1p-GFP localization
        at bud tips or bud necks (Supplemental Figure S4), whereas pea2∆ decreased Mkk1p localization, as
        shown for spa2∆ (van Drogen and Peter, 2002).
    - reference_id: PMID:23924898
      supporting_text: In contrast to Spa2p and Pea2p, however, these components are not required for the
        localization of Slt2p to the bud tip. Instead, these components are needed for full activation of
        Slt2p in response to loss of Ptc1p function (Figure 8).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000492368
        source_label: PTN000492368
        source_status: SOURCE_STALE_OR_MISSING
        comment: GOA node id is absent from the cached PTHR21601 PAINT export; the same IBD (seed SGD:S000003944,
          Spa2) now sits on PTN004550576.
      - source_id: PANTHER:PTN004550576
        source_label: PTN004550576
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The seed (S. cerevisiae Spa2) recruits Slt2 and Mkk1 to bud tips, but Sph1 does not (PMID:23924898)
          despite two-hybrid binding to Mkk1, Mkk2 and Ste7; the Eukaryota placement is also not supported
          for S. pombe Spa2.
