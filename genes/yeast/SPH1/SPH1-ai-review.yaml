  review:
    summary: UniProt subcellular-location mapping (Cytoplasm, cytoskeleton) carries no experimental evidence
      tag for Sph1. Sph1 is a cortical protein at polarized growth sites, and no study shows it associating
      with actin filaments, microtubules or septin filaments.
    action: MARK_AS_OVER_ANNOTATED
    reason: No Sph1 data place the protein in the cytoskeleton; the UniProt keyword appears to be inherited
      from the historical description of Spa2-family proteins as cytoskeletal. The better-supported locations
      are cellular bud tip, bud neck, incipient bud site and mating projection tip.
    supported_by:
