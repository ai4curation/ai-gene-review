- term:
    id: GO:0120105
    label: mitotic actomyosin contractile ring, intermediate layer
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN001091459
  - PomBase:SPAC3G9.05
  review:
    summary: GO:0120105 'mitotic actomyosin contractile ring, intermediate layer' is propagated from the
      S. pombe Spa2 IDA (PomBase:SPAC3G9.05, nanoscale mapping of the fission-yeast ring). GOA cites PTN001091459;
      the current PAINT export places it on the Eukaryota root PTN004550576 with PomBase as the sole seed.
    action: REMOVE
    reason: The term describes a layer of the fission-yeast contractile ring that is defined by the Cdc15/Imp2
      F-BAR SH3 network. Fission-yeast Spa2 is recruited there through a PXXP motif binding those SH3
      domains. Budding-yeast Sph1 is at the bud neck only before cytokinesis, and no study places it in
      the actomyosin ring or any sublayer of it. This is a source-species-specific compartment over-propagated
      by a root-level IBD.
    supported_by:
    - reference_id: PMID:28914606
      supporting_text: Multiple binding partners of Cdc15's and Imp2’s SH3 domains including Pxl1, Fic1,
        Spa2, Rgf3, and Cyk3 (Roberts-Galbraith et al., 2010; Ren et al., 2015; Roberts-Galbraith et al.,
        2009) concentrate in this intermediate zone.
    - reference_id: PMID:25428987
      supporting_text: Spa2's localization pattern is largely due to its interactions with the SH3 domain
        of Cdc15 (at tips and CRs) and Imp2 (at CRs).
    - reference_id: PMID:9443897
      supporting_text: Sph1p concentrates as a cortical patch at the presumptive bud site in unbudded
        cells, at the tip of small, medium and large buds, and at the bud neck prior to cytokinesis.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001091459
        source_label: PTN001091459
        source_status: SOURCE_STALE_OR_MISSING
        comment: GOA node id absent from the cached PTHR21601 PAINT export; the same PomBase-only IBD
          now sits on PTN004550576.
      - source_id: PomBase:SPAC3G9.05
        source_label: spa2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: S. pombe Spa2 is in the ring intermediate layer via Cdc15/Imp2 SH3 binding; no comparable
          data for S. cerevisiae Sph1.
