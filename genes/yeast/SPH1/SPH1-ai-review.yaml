id: Q06160
gene_symbol: SPH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Sph1 (Spa2 homolog 1) is a budding-yeast polarity protein and paralog of the polarisome
  scaffold Spa2, with which it shares the N-terminal Spa2 homology domain (GIT_SHD), the Spa2-box localization
  domain and a C-terminal region. Sph1 concentrates as a cortical patch at sites of polarized growth in
  a cell-cycle-dependent manner: at the presumptive bud site of unbudded cells, at the tips of growing
  buds, at the bud neck before cytokinesis, and at the tip of the mating projection in pheromone-treated
  cells. Its loss impairs bipolar bud-site selection in diploids and shmoo formation, and causes pseudohyphal
  growth defects. Sph1 and Spa2 act partly redundantly: the sph1 spa2 double mutant has a strong haploid
  invasive-growth defect, and Spa2 can substitute for Sph1 whereas Sph1 only partially substitutes for
  Spa2. Like Spa2, Sph1 binds the MAP kinase kinases Mkk1, Mkk2 and Ste7 in two-hybrid assays, but unlike
  Spa2 it is not needed to concentrate Slt2 or Mkk1 at bud tips; instead it is needed for full activation
  of the cell wall integrity MAP kinase Slt2 when the Ptc1 phosphatase is absent, and it contributes to
  Slt2-dependent control of cortical ER inheritance into the bud. Sph1 is conjugated to the ubiquitin-like protein Hub1,
  which is needed for its proper localization during mating-projection formation.'
