gene_symbol: SPH1
organism: yeast
uniprot_id: Q06160
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Polarity-determining protein which forms a conjugate with the ubiquitin-like
    modifier HUB1. Involved in bud site selection and cellular morphogenesis during
    conjugation. Required for pseudohyphal growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06160
  source_id: Q06160
- source: Alliance_Imported
  text: Protein involved in shmoo formation and bipolar bud site selection; localizes
    to sites of polarized growth in a cell cycle dependent- and Spa2p-dependent manner,
    interacts with MAPKKs Mkk1p, Mkk2p, and Ste7p; SPH1 has a paralog, SPA2, that
    arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SPH1
  source_id: SGD:S000004305
- source: Alliance_Automated
  text: Predicted to enable MAP kinase scaffold activity. Involved in bipolar cellular
    bud site selection; invasive filamentous growth; and pseudohyphal growth. Located
    in several cellular components, including cellular bud neck; cellular bud tip;
    and incipient cellular bud site.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SPH1
  source_id: SGD:S000004305
