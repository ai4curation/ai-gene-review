  text: Enables NAD+ synthase (glutamine-hydrolyzing) activity and glutaminase activity.
    Involved in NAD+ biosynthetic process. Located in cytoplasm and nucleus. Human
    ortholog(s) of this gene implicated in high grade glioma; lipid metabolism disorder;
    and nutritional deficiency disease. Orthologous to human NADSYN1 (NAD synthetase
    1).
