    summary: 'IDA from Bieganowski 2003: synthetase-site mutants of Qns1 retain basal glutaminase activity,
      showing the N-terminal nitrilase-related domain hydrolyses glutamine. This is a genuine partial
      reaction, but in the native enzyme it is obligately coupled to ammonia transfer to NaAD; it is a
