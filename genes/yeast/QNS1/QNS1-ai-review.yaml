taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Glutamine-dependent NAD+ synthetase (EC 6.3.5.1) of Saccharomyces cerevisiae, the sole and
  essential enzyme catalysing the final step of NAD+ biosynthesis: ATP-dependent amidation of nicotinic
  acid adenine dinucleotide (deamido-NAD+) to NAD+. Qns1 has an N-terminal nitrilase-related glutamine
  amidotransferase domain that hydrolyses glutamine and channels the released ammonia intramolecularly
  to a C-terminal NAD+ synthetase domain; both active sites are required in cis for function in vivo.
  Because NaAD is the convergence point of the de novo (tryptophan/kynurenine) route and of nicotinic
  acid and nicotinamide salvage, Qns1 is required for NAD+ produced by all of these routes (but not for
  the Nrk1-dependent nicotinamide riboside route, which bypasses NaAD). Qns1 is found diffusely in the
  cytosol and nucleus.'
