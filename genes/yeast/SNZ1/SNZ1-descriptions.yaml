gene_symbol: SNZ1
organism: yeast
uniprot_id: Q03148
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the formation of pyridoxal 5'-phosphate from ribose 5-phosphate
    (RBP), glyceraldehyde 3-phosphate (G3P) and ammonia. The ammonia is provided by
    a SNO isoform. Can also use ribulose 5-phosphate and dihydroxyacetone phosphate
    as substrates, resulting from enzyme- catalyzed isomerization of RBP and G3P,
    respectively.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03148
  source_id: Q03148
- source: Alliance_Imported
  text: Subunit of a two-component pyridoxal-5'-phosphate synthase; involved in pyridoxine
    (vitamin B6) biosynthesis from glyceraldehyde-3-phosphate, ribose-5-phosphate
    and ammonia liberated from glutamine by glutaminase; forms a complex with Sno1p
    that functions as an active glutaminase; member of a stationary phase-induced
    gene family where transcriptional induction occurs during the postdiauxic phase;
    co-regulated with SNO1; paralog of SNZ2 and SNZ3
  source_type: curated
  url: https://www.yeastgenome.org/locus/SNZ1
  source_id: SGD:S000004702
- source: Alliance_Automated
  text: Enables pyridoxal 5'-phosphate synthase (glutamine hydrolysing) activity.
    Involved in L-glutamine catabolic process; pyridoxal 5'-phosphate biosynthetic
    process; and pyridoxine biosynthetic process. Part of glutaminase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SNZ1
  source_id: SGD:S000004702
