descriptions:
- source: UniProt
  text: Catalyzes the formation of pyridoxal 5'-phosphate from ribose 5-phosphate
    (RBP), glyceraldehyde 3-phosphate (G3P) and ammonia. The ammonia is provided by
    a SNO isoform. Can also use ribulose 5-phosphate and dihydroxyacetone phosphate
    as substrates, resulting from enzyme- catalyzed isomerization of RBP and G3P,
    respectively.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03148
  source_id: Q03148
