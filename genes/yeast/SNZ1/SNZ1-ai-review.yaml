    label: L-glutamine catabolic process
  evidence_type: IDA
  original_reference_id: PMID:14764090
  qualifier: involved_in
  review:
    summary: >-
      ComplexPortal IDA: the Snz1-Sno1 complex hydrolyses glutamine. The glutaminase chemistry is performed
      by the Sno1 subunit, but it is barely detectable without Snz1.
    action: KEEP_AS_NON_CORE
