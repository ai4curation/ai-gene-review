id: Q03148
gene_symbol: SNZ1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  SNZ1 (YMR096W) encodes the synthase subunit (Pdx1/PdxS family) of the two-subunit pyridoxal 5'-phosphate
  (PLP) synthase of the fungal-type de novo vitamin B6 pathway. Snz1 forms hexamers and associates with
  the glutaminase subunit Sno1. Sno1 hydrolyses glutamine and channels the ammonia to Snz1, which condenses
  it with ribose 5-phosphate and glyceraldehyde 3-phosphate (or their isomers) to form PLP. Snz1 has no
  detectable organelle targeting and is presumed cytosolic. It is induced on entry into stationary phase
  and is the SNZ paralog required for growth without vitamin B6. The SNZ2/SNZ3 copies are induced by thiamine
  limitation and appear to supply PLP for thiamine biosynthesis.
