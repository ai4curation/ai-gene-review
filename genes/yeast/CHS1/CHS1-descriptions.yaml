gene_symbol: CHS1
organism: yeast
uniprot_id: P08004
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Polymerizes chitin, a structural polymer of the cell wall and septum, by transferring
    the sugar moiety of UDP-GlcNAc to the non- reducing end of the growing chitin
    polymer (PubMed:2941152). Required for mitotic division septum formation during
    adverse conditions (PubMed:2523889).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08004
  source_id: P08004
- source: Alliance_Imported
  text: Chitin synthase I; requires activation from zymogenic form in order to catalyze
    the transfer of N-acetylglucosamine (GlcNAc) to chitin; required for repairing
    the chitin septum during cytokinesis; transcription activated by mating factor
  source_type: curated
  url: https://www.yeastgenome.org/locus/CHS1
  source_id: SGD:S000005136
- source: Alliance_Automated
  text: Enables chitin synthase activity. Involved in septum digestion after cytokinesis.
    Located in chitosome and plasma membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CHS1
  source_id: SGD:S000005136
