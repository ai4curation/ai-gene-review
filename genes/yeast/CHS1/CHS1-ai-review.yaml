suggested_questions:
- question: What protease activates the Chs1p zymogen in vivo, and how is Chs1p activity restricted to the repair
    situation given its high in vitro activity?
- question: Is there a GO process term suitable for 'cell wall repair' after septum digestion that would better
    capture Chs1p's in vivo role than 'septum digestion after cytokinesis'?
suggested_experiments:
- description: Live imaging of tagged Chs1p relative to Cts1p and the birth scar during cell separation in buffered
    vs acidic media, combined with chitin quantitation at birth scars in chs1 mutants.
