description: 'Chitin synthase 1 (Chs1p) of Saccharomyces cerevisiae is a multi-pass plasma-membrane glycosyltransferase
  (GT2 family, class I chitin synthase) that polymerises beta-1,4-linked N-acetylglucosamine from UDP-GlcNAc (EC
  2.4.1.16). It accounts for the bulk of chitin synthase activity measured in vitro (chitin synthase I, Mg2+-dependent,
  trypsin-activated zymogen) yet makes little chitin in vivo. Chs1p acts as a repair or auxiliary enzyme: after
  cell separation it replenishes chitin in the birth-scar region damaged by the periplasmic chitinase Cts1p at acidic
  pH, so chs1 null cells show bud lysis in unbuffered acidic medium. Chs1p resides both at the plasma membrane and
  in intracellular chitosomes (endosome-derived vesicles), with stable levels throughout the cell cycle. It cannot
  substitute for Chs2p in primary septum formation.'
existing_annotations:
- term:
    id: GO:0000920
    label: septum digestion after cytokinesis
  evidence_type: IMP
  original_reference_id: PMID:2523889
  qualifier: involved_in
  review:
    summary: 'IMP from Cabib et al. 1989: chs1 disruptants lyse at the birth scar after cell separation because
      the chitinase that digests the septum damages the wall, and Chs1-dependent chitin synthesis normally repairs
      this damage. The phenotype places Chs1p at the septum-digestion step, but Chs1p does not perform septum digestion
      (the chitinase Cts1p does); it counteracts excessive digestion by repair synthesis.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Chs1p is required to repair, not to execute, septum digestion. The annotation records a real phenotype
      linked to cell separation but over-states Chs1p's participation in the digestion process itself. Not removed
      because the curator read the full text and the mutant phenotype genuinely maps to this stage.
    supported_by:
    - &id001
      reference_id: PMID:2523889
      supporting_text: Because the presence of Chs1 in the cell abolishes lysis, it is concluded that damage to
        the cell wall is caused by excessive chitinase activity at acidic pH, which can normally be repaired through
        chitin synthesis by Chs1.
    - reference_id: PMID:2523889
      supporting_text: The latter emerges as an auxiliary or emergency enzyme.
