descriptions:
- source: UniProt
  text: Phosphorelay intermediate protein that is part of the branched SLN1-YPD1-SKN7/SSK1
    two-component regulatory system, which controls activity of the HOG1 pathway and
    gene expression in response to changes in the osmolarity of the extracellular
    environment. Catalyzes the phosphoryl group transfer from the membrane-bound osmosensing
    histidine kinase SLN1 to two distinct response regulator proteins, SSK1 in the
    cytoplasm, and transcription factor SKN7 in the nucleus.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07688
