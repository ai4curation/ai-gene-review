gene_symbol: YPD1
organism: yeast
uniprot_id: Q07688
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Phosphorelay intermediate protein that is part of the branched SLN1-YPD1-SKN7/SSK1
    two-component regulatory system, which controls activity of the HOG1 pathway and
    gene expression in response to changes in the osmolarity of the extracellular
    environment. Catalyzes the phosphoryl group transfer from the membrane-bound osmosensing
    histidine kinase SLN1 to two distinct response regulator proteins, SSK1 in the
    cytoplasm, and transcription factor SKN7 in the nucleus.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07688
  source_id: Q07688
- source: Alliance_Imported
  text: Osmotic stress-responsive phosphorelay intermediate sensor protein; phosphorylated
    by the plasma membrane sensor Sln1p in response to osmotic stress and then in
    turn phosphorylates the response regulators Ssk1p in the cytosol and Skn7p in
    the nucleus
  source_type: curated
  url: https://www.yeastgenome.org/locus/YPD1
  source_id: SGD:S000002394
- source: Alliance_Automated
  text: Enables protein histidine kinase binding activity and transferase activity,
    transferring phosphorus-containing groups. Involved in osmosensory signaling via
    phosphorelay pathway. Located in cytoplasm and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/YPD1
  source_id: SGD:S000002394
