core_functions:
- description: 'Histidine-containing phosphotransfer (HPt) intermediate of the Sln1 osmosensing phosphorelay:
    accepts phosphate on His64 from the Sln1 receiver domain and transfers it to the Ssk1 receiver domain,
    keeping Ssk1 phosphorylated (and stabilised) so that the Ssk2/Ssk22-Pbs2-Hog1 cascade is off at normal
    osmolarity.'
  molecular_function: *id006
  directly_involved_in:
  - id: GO:0007234
    label: osmosensory signaling via phosphorelay pathway
