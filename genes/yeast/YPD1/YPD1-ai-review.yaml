id: Q07688
gene_symbol: YPD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Ypd1 (YDL235C) is a small (167 aa), soluble, stand-alone histidine-containing phosphotransfer
  (HPt) protein that forms the branch point of the Sln1 multistep His-Asp phosphorelay in Saccharomyces
  cerevisiae. Phosphate from the autophosphorylated plasma-membrane osmosensor histidine kinase Sln1 (His576
  -> receiver Asp1144) is transferred to Ypd1 His64, which in turn phosphorylates the receiver aspartates
  of two response regulators: cytoplasmic Ssk1 (Asp554) and nuclear Skn7 (Asp427). Transfer to Ssk1 is
  fast and effectively irreversible, and Ypd1 binding greatly stabilises phospho-Ssk1, keeping Ssk1 inactive
  and the Ssk2/Ssk22-Pbs2-Hog1 MAPK cascade off under normal osmolarity; hyperosmotic stress reduces relay
  flux so that unphosphorylated Ssk1 activates HOG signalling. Loss of Ypd1 is lethal because of constitutive
  HOG activation. Ypd1 is a four-helix-bundle protein that uses a common hydrophobic docking surface for
  the Sln1, Ssk1 and Skn7 receiver domains, and it is distributed in both cytoplasm and nucleus, shuttling
  between them so that it can deliver phosphate to Skn7 in the nucleus.'
