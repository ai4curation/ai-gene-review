    label: cytoplasm
  supported_by:
  - *id001
  - *id002
  - *id005
  - reference_id: PMID:11073911
    supporting_text: In Saccharomyces cerevisiae, the YPD1 protein facilitates phosphoryl transfer from
      a hybrid sensor kinase, SLN1, to two distinct response regulator proteins, SSK1 and SKN7.
- description: 'Branch-point phosphodonor for the nuclear response regulator/transcription factor Skn7:
    Ypd1 shuttles into the nucleus to phosphorylate the Skn7 receiver domain (Asp427) in the Sln1-Ypd1-Skn7
    branch.'
  molecular_function: *id006
