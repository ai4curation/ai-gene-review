  - *id008
suggested_questions:
- question: Should the Ypd1 docking interactions with receiver domains of response regulators (Ssk1, Skn7)
    be representable in GO (e.g. via has_input on GO:0009927 in a GO-CAM), given that no informative "response
    regulator binding" MF term exists?
- question: Is Ypd1 nucleocytoplasmic shuttling an active, regulated transport step or passive diffusion
    of a 19-kDa protein, and does the nuclear pool change under stresses that act through Skn7 (e.g. cell-wall
    or oxidative stress)?
suggested_experiments:
- description: In vivo Phos-tag or 31P-NMR/antibody-based detection of phospho-His64 Ypd1 in cytoplasmic
    versus nuclear fractions before and after hyperosmotic shock, to test whether the two pools differ
    in phosphorylation and relay flux.
