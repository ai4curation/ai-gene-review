gene_symbol: DFR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: DFR1 encodes dihydrofolate reductase (DHFR, EC 1.5.1.3), a 211-residue NADPH-dependent enzyme that
  reduces 7,8-dihydrofolate to 5,6,7,8-tetrahydrofolate. This is the final step of de novo tetrahydrofolate biosynthesis,
  and the same reaction recycles the dihydrofolate released by thymidylate synthase (Cdc21p) back into the one-carbon
  pool. Dfr1p is the methotrexate-sensitive DHFR of yeast, and multicopy DFR1 confers strong methotrexate resistance.
  dfr1 mutants require dTMP, adenine, histidine and methionine, the end products of folate-dependent one-carbon
  metabolism. They also fail to use folinic acid in rich medium and cannot grow on glycerol, consistent with a mitochondrial
  role. DHFR activity and GFP-tagged Dfr1p are found in both the cytoplasm and mitochondria. Dfr1p was also recovered
  in a proteome-wide screen for RNA-binding proteins.
