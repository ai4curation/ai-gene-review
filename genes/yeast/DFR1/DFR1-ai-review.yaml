  - *id005
  - *id006
  - *id003
  - *id002
suggested_questions:
- question: How is a single DFR1 gene product distributed between cytosol and mitochondria (alternative translation
    start, dual targeting, or import of a fraction)?
- question: Why do dfr1 null mutants fail to utilise folinic acid, and does Dfr1p have a role beyond DHF reduction?
suggested_experiments:
- hypothesis: A fraction of Dfr1p is imported into mitochondria via a weak or alternative N-terminal targeting signal
  description: Protease-protection assays on isolated mitochondria with tagged Dfr1p, N-terminal mutagenesis of
    potential alternative start codons, and testing whether a cytosol-restricted Dfr1p rescues the dfr1 glycerol-growth
    defect.
  experiment_type: mitochondrial import / complementation
