core_functions:
- description: 'NADPH-dependent dihydrofolate reductase: reduces 7,8-dihydrofolate to tetrahydrofolate, completing
    de novo THF synthesis (after Fol3p) and regenerating THF from the DHF released by thymidylate synthase. Single-gene
    enzyme with cytosolic and mitochondrial pools.'
  molecular_function:
    id: GO:0004146
    label: dihydrofolate reductase activity
  directly_involved_in:
