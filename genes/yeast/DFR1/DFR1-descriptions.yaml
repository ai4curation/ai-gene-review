  text: Dihydrofolate reductase involved in tetrahydrofolate biosynthesis; required
    for respiratory metabolism; mutation is functionally complemented by human DHFR
  source_type: curated
  url: https://www.yeastgenome.org/locus/DFR1
  source_id: SGD:S000005762
- source: Alliance_Automated
  text: Enables dihydrofolate reductase activity and mRNA binding activity. Involved
    in dihydrofolate metabolic process and tetrahydrofolate biosynthetic process.
    Located in mitochondrion. Used to study cancer. Human ortholog(s) of this gene
    implicated in acute lymphoblastic leukemia and megaloblastic anemia. Orthologous
    to several human genes including DHFR (dihydrofolate reductase).
  source_type: automated
