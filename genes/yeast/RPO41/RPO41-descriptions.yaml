descriptions:
- source: UniProt
  text: DNA-dependent RNA polymerase catalyzes the transcription of DNA into RNA using
    the four ribonucleoside triphosphates as substrates.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P13433
  source_id: P13433
- source: Alliance_Imported
  text: Mitochondrial RNA polymerase; single subunit enzyme similar to those of T3
    and T7 bacteriophages; requires a specificity subunit encoded by MTF1 for promoter
    recognition; Mtf1p interacts with and stabilizes the Rpo41p-promoter complex,
    enhancing DNA bending and melting to facilitate pre-initiation open complex formation;
    synthesizes RNA primers for mitochondrial DNA replication; capable of DNA-primed
    RNA extension, resulting in 5' input DNA with extended RNA on the 3' end
  source_type: curated
  url: https://www.yeastgenome.org/locus/RPO41
  source_id: SGD:S000001858
- source: Alliance_Automated
  text: Enables DNA-directed RNA polymerase activity. Involved in DNA replication,
    synthesis of primer and mitochondrial transcription. Located in mitochondrial
    nucleoid. Part of mitochondrial DNA-directed RNA polymerase complex. Human ortholog(s)
    of this gene implicated in combined oxidative phosphorylation deficiency 55. Orthologous
    to human POLRMT (RNA polymerase mitochondrial).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RPO41
  source_id: SGD:S000001858
