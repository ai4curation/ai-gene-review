id: P13433
gene_symbol: RPO41
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  RPO41 encodes the catalytic core subunit of the Saccharomyces cerevisiae mitochondrial
  RNA polymerase, a nuclear-encoded, 1351-residue single-subunit enzyme homologous to
  the RNA polymerases of bacteriophages T7 and T3, imported into the mitochondrial
  matrix via an N-terminal targeting sequence. Rpo41 associates with the
  sigma-like specificity factor Mtf1 to form the holoenzyme that melts and initiates
  transcription at the nonanucleotide (ATATAAGTA) mitochondrial promoters; Mtf1 is
  released after initiation and Rpo41 alone carries out elongation. Rpo41 can
  recognise and initiate from promoters by itself on supercoiled or premelted
  templates, but requires Mtf1 to open closed duplex promoters. It is found in
  mitochondrial nucleoids and is required for transcription of all mitochondrial
  genes and for stable maintenance of the wild-type mitochondrial genome. Its
  transcripts can serve as primers for the mitochondrial DNA polymerase Mip1 in
  vitro, and its yeast-specific amino-terminal extension supports mtDNA stability by
  a mechanism separable from RNA synthesis.
existing_annotations:
- term:
    id: GO:0001018
    label: mitochondrial promoter sequence-specific DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000010147
  - PomBase:SPAC26H5.12
  review:
    summary: Phylogenetic inference of mitochondrial promoter-specific DNA binding from
      PANTHER node PTN000010147, whose experimental donor is S. pombe rpo41.
    action: ACCEPT
    reason: RPO41 sits in the same PANTHER subfamily (PTHR10102:SF0) as the donor,
      and the inference is independently supported in S. cerevisiae. Core Rpo41 has an
      intrinsic, promoter sequence-dependent ability to initiate on supercoiled or
      premelted templates, so recognition of the ATATAAGTA promoter is a property of
      Rpo41 itself, not only of Mtf1. On closed duplex DNA, Rpo41 alone binds
      promoter and non-promoter DNA similarly and selectivity emerges in the
      holoenzyme; the term is therefore correct but realised in the Rpo41-Mtf1
      context.
    supported_by:
    - reference_id: PMID:15342628
      supporting_text: Rpo41 requires the mitochondrial promoter sequence (ATATAAGTA)
        for this activity.
    - reference_id: PMID:21911502
      supporting_text: Recent studies indicate that Rpo41 and Mtf1 together contact
        the promoter within and immediately adjacent to the −10 to +5 region
