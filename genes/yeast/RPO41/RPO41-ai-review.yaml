- term:
    id: GO:0006269
    label: DNA replication, synthesis of primer
  evidence_type: IDA
  original_reference_id: PMID:26184436
  qualifier: involved_in
  review:
    summary: In vitro, Rpo41 transcripts from replication origins and promoters prime
      DNA synthesis by Mip1.
    action: KEEP_AS_NON_CORE
    reason: Rpo41 itself catalyses the primer synthesis in the reconstituted assays,
      so this is participation, not mere necessity, and a second laboratory showed
      efficient priming by Rpo41-Mtf1 on Rim1-coated ssDNA. However, the evidence is
      entirely in vitro, and genetic data indicate that transcriptional priming is
      not required for at least some mtDNA replication in vivo, so the role is kept
      as non-core rather than as a core function.
    supported_by:
    - reference_id: PMID:26184436
      supporting_text: Rpo41 primes Mip1 at replication origins and promoter sequences
        in vitro.
    - reference_id: PMID:27311715
      supporting_text: the Saccharomyces cerevisiae mitochondrial RNA polymerase (Rpo41)
        and its transcription factor (Mtf1) is an efficient primase that initiates DNA
        synthesis on ssDNA coated with the yeast mitochondrial ssDNA-binding protein,
        Rim1.
    - reference_id: PMID:7651397
      supporting_text: priming by transcription is not a universal mechanism for mtDNA
        replication initiation
