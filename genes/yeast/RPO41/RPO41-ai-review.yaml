suggested_questions:
- question: Does the mtDNA maintenance function of the Rpo41 amino-terminal extension
    reside in the domain itself or in a factor it recruits, and is it conserved in
    petite-negative yeasts such as S. pombe whose Rpo41 N-terminal regions are divergent?
- question: Is Rpo41-dependent primer synthesis used for mtDNA replication in vivo,
    given that rep/ori-driven biased inheritance persists in rpo41 null rho- strains?
- question: The S. pombe rpo41 review states that the S. cerevisiae enzyme cannot initiate
    on its own; PMID:15342628 shows promoter-dependent initiation by S. cerevisiae Rpo41
    alone on supercoiled templates. Should the comparison be revised?
suggested_experiments:
- description: Express a tagged Rpo41 amino-terminal extension in trans in the rpo41-delta3
    (N-terminal deletion) strain, where it partially suppresses mtDNA loss, and identify
    co-purifying proteins by affinity purification-mass spectrometry to determine how the
    extension stabilises mtDNA independently of transcription.
- description: Test whether Rpo41 RNA synthesis is needed for mtDNA replication initiation
    in vivo by introducing active-site point mutants of Rpo41 into a strain carrying
    a hypersuppressive ori/rep rho- genome (stable without RPO41) and measuring replication
    and transmission of that genome relative to the null and wild type.
