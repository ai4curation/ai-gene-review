core_functions:
- description: Synthesises dolichyl beta-D-glucosyl phosphate from UDP-glucose and dolichyl phosphate
    on the cytoplasmic face of the ER membrane, providing the glucosyl donor for the luminal Alg6/Alg8/Alg10
    steps of Glc3Man9GlcNAc2-PP-dolichol assembly.
  molecular_function:
    id: GO:0004581
