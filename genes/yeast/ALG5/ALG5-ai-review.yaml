id: P40350
gene_symbol: ALG5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ALG5 encodes the ER membrane-anchored UDP-glucose:dolichyl-phosphate glucosyltransferase
  (Dol-P-Glc synthase, EC 2.4.1.117) of S. cerevisiae. It transfers glucose from cytosolic UDP-glucose
  to dolichyl phosphate on the cytoplasmic face of the ER membrane, producing dolichyl beta-D-glucosyl
  phosphate (Dol-P-Glc). After flipping to the luminal leaflet, Dol-P-Glc is the sole glucosyl donor used
  by the luminal glucosyltransferases Alg6, Alg8 and Alg10 to add the three terminal glucoses to Man9GlcNAc2-PP-dolichol,
  completing the Glc3Man9GlcNAc2 lipid-linked oligosaccharide that oligosaccharyltransferase transfers
  to nascent proteins. alg5 mutants are viable but accumulate non-glucosylated Man9GlcNAc2-PP-Dol and
  underglycosylate secretory proteins such as carboxypeptidase Y. Alg5p belongs to glycosyltransferase
  family 2 and is related to the Dol-P-Man synthase Dpm1p.
