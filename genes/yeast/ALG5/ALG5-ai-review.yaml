suggested_questions:
- question: Which protein flips Dol-P-Glc from the cytoplasmic to the luminal leaflet of the ER membrane,
    and is Alg5p physically or functionally coupled to it?
suggested_experiments:
- description: Reconstitute purified Alg5p in proteoliposomes with candidate scramblases and measure transbilayer
    movement of newly synthesised Dol-P-Glc.
