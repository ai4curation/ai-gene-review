knowledge_gaps:
- gap_statement: Direct biochemical substrate, direction and transport mechanism of Ilt1 remain undetermined
    despite a supported inherited basic-amino-acid transporter assignment. The contribution of its
    plasma-membrane and any vacuolar pool to toxin tolerance requires testing.
  boundary: Seven predicted membrane spans and two PQ-loop repeats support a transporter architecture.
    Actual PAINT descent establishes that the basic-amino-acid inference is ancestral inheritance,
    not a pairwise mis-transfer from another subfamily. Target-specific assays have demonstrated
    PM localization and toxin-tolerance dependence, but have not measured amino-acid flux or excluded
    vacuolar localization.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Ilt1 is a conserved PQ-loop membrane protein of unknown activity whose only characterized
    role is in tolerance to industrially relevant ionic liquids; resolving its molecular function
    would clarify a plasma-membrane detoxification/transport mechanism and inform engineering of
    ionic-liquid-tolerant biofuel strains.
  resolution: Direct transport assays (e.g. radiolabelled-substrate uptake/efflux in reconstituted
    proteoliposomes or heterologous cells) across candidate solutes including the ionic-liquid cation
    itself and cationic amino acids; substrate screens; and structure-guided identification of the
    translocation pathway.
  provenance:
  - reference_id: PMID:30045857
    supporting_text: putative PQ-loop motif found in Ypq1, Ypq2, and Rtc2/Ypq3, which are putative
      vacuolar membrane transporters of cationic amino acids
- gap_statement: The mechanistic relationship between inherited amino-acid homeostasis and strain-dependent
    xenobiotic tolerance is unknown.
  boundary: ILT1 deletion impairs tolerance to cationic compounds in BY but not strain 378 under
    the tested conditions. This does not by itself identify a xenobiotic-response step, exclude the
    inherited homeostasis role, or imply absence of other physiological functions.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Distinguishing an incidental xenobiotic-tolerance effect from a native transport/homeostasis
    function is required to place ILT1 in a pathway.
  resolution: Systematic phenotyping (growth across ion/nutrient/stress conditions, metabolomics
    of ilt1 mutants), genetic-interaction mapping, and testing candidate native substrates.
  provenance:
  - reference_id: PMID:30045857
    supporting_text: suggesting that ILT1 has strain-specific functions
suggested_questions:
- question: Does Ilt1 directly transport the imidazolium ionic-liquid cation (or a protective solute)
    across the plasma membrane, or does it act indirectly (e.g. by modulating another transporter
    or membrane property)?
  experts:
  - Trey K. Sato
  - Audrey P. Gasch
- question: What accounts for the background-dependence of the ilt1 phenotype (required in BY but
    not in strain 378)?
- question: How does the inherited basic-amino-acid transport/homeostasis role contribute to cationic-toxin
    tolerance, and does Ilt1 itself perform a xenobiotic-response step? The previous authored NEW
    response term is withdrawn pending participation evidence; necessity and rescue alone do not
    identify that step.
suggested_experiments:
- hypothesis: >-
    Ilt1 is a plasma-membrane transporter whose substrate is a cation relevant to
    ionic-liquid/cationic-dye tolerance.
  description: >-
    Reconstitute purified Ilt1 into proteoliposomes (or express in a heterologous transport-null
    system) and assay uptake/efflux of candidate solutes, including the [C2C1im]+ cation,
    cationic dyes, and cationic amino acids, under a range of pH and ion gradients.
  experiment_type: transport assay
- hypothesis: >-
    Ilt1 abundance or plasma-membrane residence changes upon exposure to cationic xenobiotics.
  description: >-
    Measure Ilt1 protein level, localization, and PTM state (including the reported Ser229
    phosphorylation) with and without [C2C1im]Cl / crystal violet treatment.
  experiment_type: quantitative fluorescence microscopy and immunoblotting
