id: Q03193
gene_symbol: ILT1
aliases:
- YDR090C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Ilt1 (YDR090C; Ionic Liquid Tolerance 1) is a 310-residue budding-yeast protein with
  seven predicted membrane spans and two PQ-loop repeats. Chromosomal GFP fusions localize to the
  plasma membrane. It belongs to a conserved PQ-loop lineage with inferred basic-amino-acid transmembrane
  transport, vacuolar export and intracellular amino-acid homeostasis functions; its target-specific
  transport substrate, direction and possible vacuolar pool have not been directly measured. Loss
  of ILT1 sensitizes the BY background to imidazolium ionic liquids and crystal violet, and complementation
  or additional gene copies improve tolerance. This effect depends on strain background and does
  not require that Ilt1 be a component of the Sge1 efflux mechanism. How its inherited transport
  role relates to cationic-xenobiotic tolerance remains unresolved.
