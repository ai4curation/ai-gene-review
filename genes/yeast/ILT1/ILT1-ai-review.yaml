- id: PMID:30045857
  title: Natural Variation in the Multidrug Efflux Pump SGE1 Underlies Ionic Liquid Tolerance in
    Yeast.
  findings:
  - statement: YDR090C was named ILT1 (ionic liquid tolerance 1) because its deletion sensitizes
      yeast to the imidazolium ionic liquid [C2C1im]Cl; complementation restores tolerance, and the
      protein also protects against other cationic toxins including crystal violet and [C4C1im]Cl
      in the BY (S288c) background.
    supporting_text: ILT1 functions in tolerance to a range of cationic toxins in the BY strain background
    reference_section_type: RESULTS
  - statement: Ilt1-GFP fusion protein localizes to the plasma membrane, consistent with the independent
      Huh et al. GFP-localization dataset.
    supporting_text: both Sge1PLL-GFP and Ilt1-GFP fusion proteins localized to the plasma membrane
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC full text available (PMC6116967). Verified against PubMed; this is the paper
      that named ILT1/YDR090C and provides the only experimental functional data (deletion sensitivity
      to cationic compounds, complementation, plasma-membrane localization, SGE1-independence). Supports
      the tolerance and localization claims verbatim; it does NOT establish a molecular transport
      function for Ilt1.
- id: file:yeast/ILT1/ILT1-paint-lineage.md
  title: 'ILT1: inspected PAINT ancestry'
  findings:
  - statement: Actual accession-mapped ancestry was checked, independently of subfamily labels and
      donor counts.
    supporting_text: All four disputed inherited annotations originate at PTN001044753 and remain
      positive on target leaf PTN000415976.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual nested PANTHER tree retrieved by POST; lineage, target accession, ancestral
      rows and response hash retained in sibling JSON. Related loss assertions outside the target
      lineage are distinguished from inherited losses.
- id: file:yeast/ILT1/ILT1-deep-research-falcon.md
  title: Falcon literature report for yeast ILT1
  findings:
  - statement: Comparative PQ-loop structures and characterized Ypq/PQLC2 relatives support a transporter
      hypothesis but are not target-specific biochemical measurements.
    supporting_text: the specific substrate and physiological role of YDR090C have **not yet been
      established directly** in the available primary literature
  - statement: The report overlooked the dedicated 2018 target microscopy and tolerance experiments.
    supporting_text: No direct experimental localization data for YDR090C/ILT1 was identified in
      the primary literature.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Full body reviewed. Its identity/domain and comparative transporter synthesis is
      informative, but its assertion of no target localization and its naming history miss PMID30045857.
      Primary PM microscopy supplements rather than excludes the inherited vacuolar role. No exact
      cached OpenScientist report was found.
