core_functions:
- description: PQ-loop membrane protein with an inherited basic-amino-acid transport and homeostasis
    role, supported by inspected PAINT ancestry. Plasma-membrane localization is directly observed;
    vacuolar localization/export is phylogenetically inferred. The exact target substrate and the
    mechanistic connection to background-dependent cationic-toxin tolerance require direct testing.
