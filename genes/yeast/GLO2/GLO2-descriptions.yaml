descriptions:
- source: UniProt
  text: Thiolesterase that catalyzes the hydrolysis of S-D- lactoylglutathione to
    form glutathione and D-lactic acid. Involved in the metabolism of methylglyoxal,
    a toxic compound for yeast proliferation, by converting methylglyoxal to lactate
    via S-D- lactoylglutathione by sequential enzyme reactions catalyzed by glyoxalase
    I and glyoxalase II.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05584
