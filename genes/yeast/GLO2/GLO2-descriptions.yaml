gene_symbol: GLO2
organism: yeast
uniprot_id: Q05584
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Thiolesterase that catalyzes the hydrolysis of S-D- lactoylglutathione to
    form glutathione and D-lactic acid. Involved in the metabolism of methylglyoxal,
    a toxic compound for yeast proliferation, by converting methylglyoxal to lactate
    via S-D- lactoylglutathione by sequential enzyme reactions catalyzed by glyoxalase
    I and glyoxalase II.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05584
  source_id: Q05584
- source: Alliance_Imported
  text: Cytoplasmic glyoxalase II; catalyzes the hydrolysis of S-D-lactoylglutathione
    into glutathione and D-lactate; GLO2 has a paralog, GLO4, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLO2
  source_id: SGD:S000002680
- source: Alliance_Automated
  text: Enables hydroxyacylglutathione hydrolase activity. Involved in methylglyoxal
    catabolic process. Located in cytoplasm. Human ortholog(s) of this gene implicated
    in inherited metabolic disorder and paroxysmal nonkinesigenic dyskinesia 1. Orthologous
    to several human genes including HAGH (hydroxyacylglutathione hydrolase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLO2
  source_id: SGD:S000002680
