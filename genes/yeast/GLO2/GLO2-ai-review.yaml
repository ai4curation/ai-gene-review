taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GLO2 (YDR272W) encodes the cytoplasmic glyoxalase II (hydroxyacylglutathione hydrolase, EC
  3.1.2.6) of Saccharomyces cerevisiae, a zinc-dependent metallo-beta-lactamase-fold thiolesterase. It
  hydrolyses (R)-S-lactoylglutathione, produced by glyoxalase I (Glo1) from methylglyoxal and glutathione,
  to D-lactate and free glutathione, completing the cytosolic glyoxalase pathway of methylglyoxal detoxification.
  GLO2 is expressed on both fermentable and non-fermentable carbon sources and is the constitutive isozyme;
  its paralogue GLO4 (59% identical) encodes the mitochondrial-matrix enzyme expressed on glycerol. A
  glo2 glo4 double mutant has no detectable glyoxalase II activity and is as methylglyoxal-sensitive as
  a glo1 mutant. The purified enzyme has a sharp pH optimum around pH 7-8 and also hydrolyses S-D-mandeloylglutathione.
