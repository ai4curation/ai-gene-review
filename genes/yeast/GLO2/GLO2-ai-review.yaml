suggested_questions:
- question: 'How is the division of labour between cytosolic Glo2 and mitochondrial Glo4 set: does S-D-lactoylglutathione
    made by cytosolic Glo1 enter mitochondria, or is there a mitochondrial glyoxalase I activity feeding
    Glo4?'
suggested_experiments:
- description: Compare methylglyoxal sensitivity and S-D-lactoylglutathione accumulation in glo2, glo4
    and glo2 glo4 strains on glucose vs glycerol to quantify each isozyme's contribution under fermentative
    vs respiratory growth.
