suggested_questions:
- question: What ER-resident factor (e.g. NADPH-cytochrome P450 reductase Ncp1) is missing from lipid droplets and
    accounts for the inactivity of the LD-associated Erg1 pool?
- question: Is the LD pool of Erg1 a storage/degradation pool or does it become active at ER-LD contact sites in
    vivo?
