id: P32476
gene_symbol: ERG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG1 (YGR175C) encodes squalene epoxidase (squalene monooxygenase, EC 1.14.14.17), which converts squalene
  to (3S)-2,3-epoxysqualene (2,3-oxidosqualene), the first oxygen-dependent step of the sterol branch and the substrate
  for lanosterol synthase Erg7. The enzyme is a membrane-bound flavoprotein of the squalene monooxygenase family
  that draws electrons from NADPH via NADPH-cytochrome P450 reductase; it is a rate-limiting step of ergosterol
  synthesis and the target of allylamine antifungals such as terbinafine. Erg1p is distributed between the ER membrane
  and lipid droplets, but catalytic activity is detected only in the ER, the LD pool requiring an ER factor for
  activity. erg1 mutants are ergosterol auxotrophs.
