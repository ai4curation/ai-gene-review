- source: Alliance_Imported
  text: Squalene epoxidase; catalyzes epoxidation of squalene to 2,3-oxidosqualene;
    plays essential role in ergosterol-biosynthesis pathway and is specific target
    of antifungal drug terbinafine; directed to ER via guided entry of tail-anchored
    proteins (GET) pathway; degradation by ERAD triggered by membrane lipid saturation;
    human SQLE functionally complements the lethality of the erg1 null mutation
