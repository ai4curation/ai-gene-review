id: Q3E840
gene_symbol: KTI11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'KTI11 (DPH3) encodes a small (82 aa) CSL-type zinc-finger protein that binds a single iron
  (or zinc) in a rubredoxin-like Cys4 site. Reduced by the NADH-dependent cytochrome b5 reductase Cbr1,
  Fe-bound Kti11 acts as an electron donor to the [4Fe-4S] clusters of two radical-SAM type enzymes: the
  Dph1-Dph2 ACP-histidine synthase of the first step of diphthamide biosynthesis on eEF2, and the Elongator
  complex (Elp3) that forms the 5-methoxycarbonylmethyl/carbamoylmethyl side chains of wobble uridines
  in tRNA. Under aerobic conditions it also donates its iron atom to rebuild the oxidatively damaged [3Fe-4S]
  cluster of Dph1-Dph2 into the active [4Fe-4S] form. Kti11 forms a heterodimer with Kti13/Ats1 that is
  required for both modifications. kti11 mutants lack diphthamide and Elongator-dependent tRNA modifications
  and are resistant to diphtheria toxin, sordarin and K. lactis zymocin. Kti11 is found mainly in the
  cytoplasm, with some nuclear signal.'
