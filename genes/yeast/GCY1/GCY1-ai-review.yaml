- term:
    id: GO:0019568
    label: arabinose catabolic process
  evidence_type: IDA
  original_reference_id: PMID:12271459
  qualifier: involved_in
  review:
    summary: Traff et al. 2002 tested ORFs similar to GRE3 (including GCY1) for xylose/arabinose reduction;
      the abstract names Gre3, Ypr1 and YJR096w as the major arabinose reducers, so any Gcy1 contribution
      was minor. Moreover, NADPH-dependent reduction of L-arabinose to arabitol is not arabinose catabolism
      in S. cerevisiae, which cannot use arabinose as a carbon source. Not removed because the curator
      saw the full text, but the process term over-states the role.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:12271459
      supporting_text: Decreased arabitol formation from L-arabinose indicates that Gre3p, Ypr1p and the
        protein encoded by YJR096w are the major arabinose reducers in S. cerevisiae.
- term:
