  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00086410
  - InterPro:IPR044489
  review:
    summary: ARBA mapping (AKR family rule) to arabinose catabolic process. S. cerevisiae has no native
      arabinose catabolic pathway, and the arabinose-reducing AKRs identified in yeast are Gre3, Ypr1
      and YJR096w, not Gcy1. Over-propagated family rule.
    action: REMOVE
