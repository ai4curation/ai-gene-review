taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'GCY1 (YOR120W; galactose-inducible crystallin-like protein 1; AKR3A1) is a cytoplasmic NADP(H)-dependent

  aldo-keto reductase of Saccharomyces cerevisiae. Recombinant Gcy1 reduces a range of aldehydes and ketones

  (DL-glyceraldehyde, aromatic aldehydes, phenylglyoxal) with NADPH, and the Tyr55 hydrogen donor is

  essential for activity. In vivo GCY1 provides glycerol 2-dehydrogenase (NADP+) activity (EC 1.1.1.156),

  oxidising glycerol to dihydroxyacetone, the first step of the DHA route of glycerol dissimilation that

  continues with the DHA kinases DAK1/DAK2; DHA is not formed in gcy1 disruptants under micro-aerobic

  conditions. GCY1 is induced by galactose (GAL4-dependent), salt stress and replication stress, and is

  about 65% identical to its paralog YPR1. It contributes redundantly with other AKRs (GRE3, YPR1) to
  heat

  and oxidative stress tolerance, and has been reported to bind specific mRNAs.'
