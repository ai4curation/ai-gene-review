descriptions:
- source: UniProt
  text: Glycerol dehydrogenase involved in glycerol catabolism under microaerobic
    conditions. Has mRNA binding activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P14065
  source_id: P14065
- source: Alliance_Imported
  text: Glycerol dehydrogenase; involved in an alternative pathway for glycerol catabolism
    used under microaerobic conditions; also has mRNA binding activity; member of
    the aldo-keto reductase (AKR) family; human homolog AKR1B1 can complement yeast
    null mutant; protein abundance increases in response to DNA replication stress;
    GCY1 has a paralog, YPR1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GCY1
  source_id: SGD:S000005646
- source: Alliance_Automated
  text: Enables aldose reductase (NADPH) activity; glycerol 2-dehydrogenase (NADP+)
    activity; and mRNA binding activity. Involved in carbohydrate catabolic process
    and cellular response to oxidative stress. Located in cytoplasm and nucleus. Human
    ortholog(s) of this gene implicated in several diseases, including 46,XY sex reversal
    8; alcohol dependence; congenital bile acid synthesis defect 2; kidney disease
    (multiple); and leukemia (multiple). Orthologous to several human genes including
    AKR1A1 (aldo-keto reductase family 1 member A1); AKR1B1 (aldo-keto reductase family
    1 member B); and AKR1B10 (aldo-keto reductase family 1 member B10).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GCY1
  source_id: SGD:S000005646
