- source: Alliance_Automated
  text: Enables aldose reductase (NADPH) activity; glycerol 2-dehydrogenase (NADP+)
    activity; and mRNA binding activity. Involved in carbohydrate catabolic process
    and cellular response to oxidative stress. Located in cytoplasm and nucleus. Human
    ortholog(s) of this gene implicated in several diseases, including 46,XY sex reversal
    8; alcohol dependence; congenital bile acid synthesis defect 2; kidney disease
    (multiple); and leukemia (multiple). Orthologous to several human genes including
    AKR1A1 (aldo-keto reductase family 1 member A1); AKR1B1 (aldo-keto reductase family
    1 member B); and AKR1B10 (aldo-keto reductase family 1 member B10).
