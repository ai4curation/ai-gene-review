id: P42951
gene_symbol: LSB6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: LSB6 encodes the only type II phosphatidylinositol 4-kinase of budding yeast (PI4K2A/B family; EC 2.7.1.67),
  distinct from the essential type III PI4Ks Stt4 and Pik1. Lsb6 is adenosine-sensitive and wortmannin-insensitive,
  requires Mg2+ or Mn2+, and corresponds to the previously purified membrane-associated 55 kDa PI 4-kinase. It is
  a low-abundance peripheral membrane protein found on the plasma membrane and the vacuole membrane. lsb6 deletion
  has no growth defect or detectable change in phosphoinositide levels, but overexpression partially suppresses
  loss of Stt4, showing it can make PI4P in vivo. Lsb6 was identified as a Las17 (WASp)-binding protein and has
  a reported kinase-independent role in actin-driven endosome motility.
