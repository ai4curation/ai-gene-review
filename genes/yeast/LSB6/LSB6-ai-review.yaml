suggested_questions:
- question: Which PI4P pool does Lsb6 supply in vivo, given that lsb6 cells have no measurable phosphoinositide
    defect while Stt4 and Pik1 are each essential?
suggested_experiments:
- hypothesis: Lsb6 contributes a vacuolar PI4P pool masked in bulk measurements
  description: Image vacuolar PI4P with a P4C/FAPP-PH biosensor in lsb6, pik1-ts and stt4-ts backgrounds, and test
    kinase-dead Lsb6 rescue.
  experiment_type: live-cell imaging / genetics
