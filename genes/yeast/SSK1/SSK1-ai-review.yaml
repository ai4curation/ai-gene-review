  evidence_type: IMP
  original_reference_id: PMID:19633059
  qualifier: involved_in
  review:
    summary: Sln1-branch (including SSK1) deletion blocks the transient actin depolarization triggered
      by low-pH (pH 3.0) stress (Motizuki and Xu 2009).
    action: KEEP_AS_NON_CORE
    reason: Abstract-only cache; the SGD curator attributed an IMP to SSK1 from the full text, which is
      consistent with the abstract statement about Sln1-branch deletions. Ssk1 acts here as the upstream
      signalling input to Hog1 activation; the actin reorganization is executed by Hog1 and polarisome
      proteins. The regulation term is acceptable for an upstream signalling component but is a peripheral,
      context-specific consequence, not a core function.
    supported_by:
    - &id014
      reference_id: PMID:19633059
      supporting_text: Gene deletions on the Sln1p branch of the HOG pathway completely blocked actin
        depolarization, suggesting that Hog1p activation depends mainly on the osmosensor Sln1p.
    - &id015
      reference_id: PMID:19633059
      supporting_text: S. cerevisiae responds to low-pH stress by transiently depolarizing its actin cytoskeleton,
        and that this step requires a mitogen-activated protein kinase, high osmolarity glycerol 1 (Hog1p).
    - reference_id: file:yeast/SSK1/SSK1-deep-research-falcon.md
