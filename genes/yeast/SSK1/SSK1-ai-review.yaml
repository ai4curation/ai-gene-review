core_functions:
- description: 'Phosphorelay response regulator: the CheY-like receiver domain of cytoplasmic Ssk1 accepts
    a phosphoryl group on Asp554 from Ypd1 as the terminal step of the Sln1-Ypd1-Ssk1 osmosensing phosphorelay;
    phosphorylation keeps Ssk1 inactive, and its loss under hyperosmotic stress switches Ssk1 on.'
  molecular_function:
    id: GO:0000156
    label: phosphorelay response regulator activity
  directly_involved_in:
  - id: GO:0007234
    label: osmosensory signaling via phosphorelay pathway
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:8808622
    supporting_text: This phosphate is then sequentially transferred to Sln1p-Asp-1144, then to Ypd1p-His64,
      and finally to Ssk1p-Asp554.
  - reference_id: PMID:18573873
    supporting_text: In either case, unphosphorylated Ssk1 accumulates to activate Ssk2.
  - reference_id: PMID:14665464
    supporting_text: since Ssk1p appears to be cytoplasmically localized under all osmotic conditions
      tested.
- description: 'MAP3K activator: unphosphorylated Ssk1 binds the N-terminal regulatory segment of the
    MAP3Ks Ssk2 and Ssk22 and induces their latent kinase activity, coupling the phosphorelay to the Pbs2-Hog1
    MAPK cascade; phosphorylated Ssk1 conversely inhibits unphosphorylated Ssk1 within Ssk1 dimers.'
  molecular_function:
    id: GO:0030295
    label: protein kinase activator activity
  directly_involved_in:
  - id: GO:1900744
    label: regulation of p38MAPK cascade
  - id: GO:0071474
    label: cellular hyperosmotic response
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:9482735
    supporting_text: The SSK1 C-terminal receiver domain interacts with an N-terminal segment of SSK2.
  - reference_id: PMID:9482735
    supporting_text: Dephosphorylation of SSK2 renders the kinase inactive, but it can be re-activated
      by addition of SSK1 in vitro.
  - reference_id: PMID:18573873
    supporting_text: Therefore, Ssk1 has a dual function as both an activator of Ssk2 and an inhibitor
      of Ssk1 itself.
  - reference_id: file:yeast/SSK1/SSK1-uniprot.txt
    supporting_text: 'SUBUNIT: Interacts with SSK2, SSK22 and YPD1.'
suggested_questions:
- question: Should Ssk1 homodimerization (GO:0042803 protein homodimerization activity), shown by gel
    filtration and co-precipitation of receiver domains in Horie et al. 2008 and central to the Ssk1~P/Ssk1-OH
    inhibition model, be annotated, given SGD curated that paper without adding it?
- question: Is Ssk22 activated by Ssk1 by the same two-step mechanism as Ssk2, and is the Ssk1-Ssk22 interaction
    direct? Current evidence for Ssk22 is largely high-throughput interaction data and pathway genetics.
- question: In a HOG GO-CAM, should Ssk1 be modelled with GO:0000156 (input from Ypd1) causally upstream
    of Ssk2/Ssk22 MAP3K activity, with GO:0030295 carrying has_input Ssk2/Ssk22, rather than as a generic
    binding node?
suggested_experiments:
- description: Reconstitute Ssk2 and Ssk22 activation in vitro with purified Ssk1-OH, Ssk1~P (via Ypd1
    phosphotransfer) and mixed dimers to test quantitatively whether only Ssk1-OH/Ssk1-OH dimers activate
    the MAP3Ks and whether Ssk1 bridges Ssk2 dimerization.
- description: Determine a structure of the Ssk1 receiver domain in complex with the Ssk2 N-terminal regulatory
    segment to define the Ssk2-binding surface (including the D628 region) and how Asp554 phosphorylation
    blocks it.
