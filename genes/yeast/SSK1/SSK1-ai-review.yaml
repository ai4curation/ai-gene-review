    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:14665464
  qualifier: is_active_in
  review:
    summary: GFP-Ssk1 localizes to the cytoplasm under all osmotic conditions tested (Lu et al. 2003).
    action: ACCEPT
    reason: Direct localization evidence; Ssk1 is phosphorylated by Ypd1 in the cytosol and acts on the
      cytoplasmic MAP3Ks Ssk2/Ssk22, so cytoplasm is both where it is located and where it is active.
      Nuclear presence at low level was not excluded by the authors but has no known function.
