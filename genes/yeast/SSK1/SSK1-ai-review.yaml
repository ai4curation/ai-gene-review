id: Q07084
gene_symbol: SSK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Ssk1 (YLR006C) is the cytoplasmic response regulator of the Sln1-Ypd1-Ssk1 multistep phosphorelay
  that controls the Sln1 branch of the high-osmolarity glycerol (HOG) pathway in Saccharomyces cerevisiae.
  It is a non-enzymatic protein whose C-terminal CheY-like receiver domain accepts a phosphoryl group
  on Asp554 from the histidine phosphotransfer protein Ypd1. Under normal osmolarity the active sensor
  kinase Sln1 keeps Ssk1 phosphorylated and inactive; hyperosmotic stress inactivates Sln1, and unphosphorylated
  Ssk1 accumulates, binds the N-terminal regulatory segments of the MAP kinase kinase kinases Ssk2 and
  Ssk22 and induces their kinase activity, which in turn activates the Pbs2-Hog1 MAPK module. Ssk1 is
  largely dimeric, and phosphorylated Ssk1 inhibits unphosphorylated Ssk1, buffering the pathway against
  spurious activation; unphosphorylated Ssk1 is also turned over by a Ubc7-dependent ubiquitin-proteasome
  pathway after adaptation. Through Hog1 signalling, Ssk1 also contributes to responses to other stresses
  such as low external pH.
