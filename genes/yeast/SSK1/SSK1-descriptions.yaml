descriptions:
- source: UniProt
  text: Final receptor of the SLN1-YPD1-SSK1 two-component regulatory system, which
    controls activity of the HOG1 pathway in response to changes in the osmolarity
    of the extracellular environment. Under normal osmotic conditions, maintained
    in a phosphorylated and inactive state by the phosphorelay intermediate protein
    YPD1. Under conditions of high osmolarity, the histidine kinase SLN1 is no longer
    active and the unphosphorylated form of SSK1 interacts with and activates SSK2
    and SSK22, two MAPKKKs that further stimulate the PBS2-HOG1 MAPKK-MAPK cascade.
    Unphosphorylated SSK1 is subsequently degraded by the UBC7- dependent ubiquitin-proteasome
    system to down-regulate the HOG1 pathway after completion of the osmotic adaptation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07084
  source_id: Q07084
- source: Alliance_Imported
  text: Cytoplasmic phosphorelay intermediate osmosensor and regulator; part of a
    two-component signal transducer that mediates osmosensing via a phosphorelay mechanism;
    required for mitophagy; dephosphorylated form is degraded by the ubiquitin-proteasome
    system; potential Cdc28p substrate
  source_type: curated
  url: https://www.yeastgenome.org/locus/SSK1
  source_id: SGD:S000003996
- source: Alliance_Automated
  text: Enables mitogen-activated protein kinase kinase kinase binding activity; phosphorelay
    response regulator activity; and protein kinase activator activity. Involved in
    several processes, including cellular response to acidic pH; cellular response
    to osmotic stress; and regulation of p38MAPK cascade. Is active in cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SSK1
