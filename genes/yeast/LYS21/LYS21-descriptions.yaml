gene_symbol: LYS21
organism: yeast
uniprot_id: Q12122
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the aldol-type condensation of 2-oxoglutarate with acetyl-CoA to
    yield homocitrate. Carries out the first step of the alpha-aminoadipate (AAA)
    lysine biosynthesis pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12122
  source_id: Q12122
- source: Alliance_Imported
  text: Homocitrate synthase isozyme; catalyzes the condensation of acetyl-CoA and
    alpha-ketoglutarate to form homocitrate, which is the first step in the lysine
    biosynthesis pathway; LYS21 has a paralog, LYS20, that arose from the whole genome
    duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/LYS21
  source_id: SGD:S000002289
- source: Alliance_Automated
  text: Enables homocitrate synthase activity. Involved in L-lysine biosynthetic process.
    Located in nucleus. Human ortholog(s) of this gene implicated in 3-hydroxy-3-methylglutaryl-CoA
    lyase deficiency and amino acid metabolic disorder. Orthologous to human HMGCL
    (3-hydroxy-3-methylglutaryl-CoA lyase) and HMGCLL1 (3-hydroxy-3-methylglutaryl-CoA
    lyase like 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LYS21
  source_id: SGD:S000002289
