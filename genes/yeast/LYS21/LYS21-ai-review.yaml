  label: Saccharomyces cerevisiae S288C
description: Homocitrate synthase isozyme Lys21 (EC 2.3.3.14) of Saccharomyces cerevisiae, paralog of
  Lys20 in the  alpha-isopropylmalate synthase/homocitrate synthase family. It condenses acetyl-CoA and
  2-oxoglutarate to homocitrate, the first step of the alpha-aminoadipate pathway of lysine biosynthesis.
  Lys21 is strongly and allosterically inhibited by lysine (Ki about 0.05 mM), which also induces positive
  cooperativity for 2-oxoglutarate. During respiratory (ethanol) growth Lys21 supplies most of the homocitrate,
  whereas on glucose Lys20 and Lys21 are redundant. Although historically called the 'mitochondrial' isozyme,
  Lys21 has been localised experimentally to the nucleus, together with Lys20.
