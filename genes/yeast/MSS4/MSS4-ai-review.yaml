suggested_questions:
- question: What controls the assembly and disassembly of Mss4 PIK patches, and does nuclear shuttling of Mss4 regulate
    the amount available at the plasma membrane?
suggested_experiments:
- hypothesis: Mss4 oligomerisation into PIK patches increases local PI(4,5)P2 synthesis
  description: Identify oligomerisation-defective Mss4 mutants and quantify plasma-membrane PI(4,5)P2 biosensor
    intensity, patch dynamics and actin polarisation.
  experiment_type: mutagenesis / live-cell imaging
