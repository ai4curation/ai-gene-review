id: P38994
gene_symbol: MSS4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MSS4 encodes the essential, sole type I phosphatidylinositol 4-phosphate 5-kinase of budding yeast
  (EC 2.7.1.68). Mss4 phosphorylates PI4P (generated at the plasma membrane by Stt4) to produce PI(4,5)P2, with
  a minor in vitro activity on PI3P; mss4 mutants retain only ~10% of normal PI(4,5)P2. Mss4 is a peripheral protein
  of the plasma membrane, where it assembles into dynamic oligomeric "PIK patches" and is negatively regulated by
  the tandem-PH protein Opy1; it also shuttles through the nucleus. PI(4,5)P2 made by Mss4 is required for polarised
  actin organisation (actin cables and patch polarisation), cell wall integrity signalling, endocytosis and, during
  sporulation, prospore membrane formation.
