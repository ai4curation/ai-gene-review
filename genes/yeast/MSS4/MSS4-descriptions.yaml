gene_symbol: MSS4
organism: yeast
uniprot_id: P38994
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of phosphatidylinositol 4- phosphate on the
    fifth hydroxyl of the myo-inositol ring, to form phosphatidylinositol 4,5-bisphosphate
    (PubMed:9624178, PubMed:22562153). Acts downstream of STT4, but in a pathway that
    does not involve PKC1. May be involved in the organization of the actin cytoskeleton
    (PubMed:8152413).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38994
  source_id: P38994
- source: Alliance_Imported
  text: Phosphatidylinositol-4-phosphate 5-kinase; involved in actin cytoskeleton
    organization and cell morphogenesis; multicopy suppressor of stt4 mutation
  source_type: curated
  url: https://www.yeastgenome.org/locus/MSS4
  source_id: SGD:S000002616
- source: Alliance_Automated
  text: Enables 1-phosphatidylinositol-4-phosphate 5-kinase activity; phosphatidylinositol-3-phosphate
    binding activity; and phosphatidylinositol-4-phosphate binding activity. Involved
    in ascospore-type prospore assembly; cortical actin cytoskeleton organization;
    and phosphatidylinositol phosphate biosynthetic process. Located in nucleus and
    plasma membrane. Used to study cancer. Human ortholog(s) of this gene implicated
    in lethal congenital contracture syndrome 3 and neurodevelopmental disorder with
    intellectual, visual, and language impairment. Orthologous to several human genes
    including PIP5K1A (phosphatidylinositol-4-phosphate 5-kinase type 1 alpha); PIP5K1B
    (phosphatidylinositol-4-phosphate 5-kinase type 1 beta); and PIP5K1C (phosphatidylinositol-4-phosphate
    5-kinase type 1 gamma).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MSS4
  source_id: SGD:S000002616
