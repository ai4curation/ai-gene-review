  label: Saccharomyces cerevisiae S288C
description: GND2 encodes the minor 6-phosphogluconate dehydrogenase (decarboxylating; EC 1.1.1.44) isoenzyme
  of S. cerevisiae, a whole-genome-duplication paralog of GND1. By sequence and family membership it catalyses
  the NADP+-dependent oxidative decarboxylation of 6-phospho-D-gluconate to D-ribulose 5-phosphate, CO2
  and NADPH, the last step of the oxidative pentose phosphate pathway in the cytosol. Gnd2p is a low-abundance
  protein (several hundred molecules per cell in glucose-grown cells versus about 10^5 for Gnd1p) and
  accounts for the roughly 20% of 6-phosphogluconate dehydrogenase activity that remains in gnd1 mutants.
