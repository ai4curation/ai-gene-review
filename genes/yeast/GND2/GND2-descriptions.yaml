descriptions:
- source: UniProt
  text: Catalyzes the oxidative decarboxylation of 6-phosphogluconate to ribulose
    5-phosphate and CO(2), with concomitant reduction of NADP to NADPH.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53319
  source_id: P53319
- source: Alliance_Imported
  text: 6-phosphogluconate dehydrogenase (decarboxylating); catalyzes an NADPH regenerating
    reaction in the pentose phosphate pathway; required for growth on D-glucono-delta-lactone;
    GND2 has a paralog, GND1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GND2
  source_id: SGD:S000003488
- source: Alliance_Automated
  text: Enables phosphogluconate dehydrogenase (decarboxylating) activity. Involved
    in pentose-phosphate shunt, oxidative branch. Located in plasma membrane. Orthologous
    to human PGD (phosphogluconate dehydrogenase).
