id: P43534
gene_symbol: THI5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: THI5 (YFL058W) encodes a 4-amino-5-hydroxymethyl-2-methylpyrimidine phosphate (HMP-P) synthase
  of the NMT1/THI5 family, which makes the pyrimidine half of thiamine. The iron-dependent homodimeric
  enzyme binds pyridoxal 5'-phosphate as a substrate (via an active-site lysine) and builds HMP-P from
  it and the side chain of one of its own histidine residues, which inactivates the enzyme after a single
  turnover. Its fold combines features of periplasmic binding proteins and PLP-dependent enzymes. THI5
  is one of four almost identical subtelomeric paralogues (THI5, THI11, THI12, THI13) that are functionally
  redundant for aerobic HMP synthesis from the vitamin B6 pathway; the quadruple mutant requires thiamine
  or HMP under aerobic conditions. The family is induced by thiamine limitation.
