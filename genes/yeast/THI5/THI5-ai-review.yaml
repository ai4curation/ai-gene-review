suggested_questions:
- question: Do the four THI5-family paralogues differ in expression conditions or in turnover (e.g. Rsp5-dependent
    degradation of spent enzyme) in a way that explains retention of four nearly identical copies?
suggested_experiments:
- description: Measure protein levels and half-lives of individually tagged THI5, THI11, THI12 and THI13
    under thiamine limitation, and test whether spent (His-modified) enzyme is ubiquitinated by Rsp5 and
    degraded.
