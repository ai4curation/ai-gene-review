descriptions:
- source: UniProt
  text: Probably involved in the processes of spore formation and contributes to ascospore
    thermoresistance by participating in the morphogenesis of ascospore walls. The
    enzyme may do this by modifying glucan linkages in the developing ascospore wall,
    thus strengthening it or lending it plasticity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32603
  source_id: P32603
- source: Alliance_Imported
  text: Sporulation-specific exo-1,3-beta-glucanase; contributes to ascospore thermoresistance;
    SPR1 has a paralog, EXG1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SPR1
  source_id: SGD:S000005716
- source: Alliance_Automated
  text: Enables glucan exo-1,3-beta-glucosidase activity. Involved in ascospore formation.
    Located in ascospore wall.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SPR1
  source_id: SGD:S000005716
