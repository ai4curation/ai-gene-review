  title: A screen for spore wall permeability mutants identifies a secreted protease
    required for proper spore wall assembly.
  findings:
  - statement: >-
      Native-promoter Spr1-GFP localizes first to the forming prospore membrane
      and later to the mature spore wall, and leakage of this fusion can report
      loss of the spore-wall diffusion barrier.
    supporting_text: >-
      When expressed from the native SPR1 promoter in wild-type cells, this
      fusion was found to localize to the forming prospore membrane in meiotic
      cells and to the spore wall of mature spores
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text directly supports Spr1 localization to the developing and mature
      spore wall.
