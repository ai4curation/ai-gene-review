- id: PMID:8419289
  title: The Saccharomyces cerevisiae SPR1 gene encodes a sporulation-specific exo-1,3-beta-glucanase
    which contributes to ascospore thermoresistance.
  findings:
  - statement: >-
      spr1 mutant cells lack whole-cell exo-1,3-beta-glucanase activity toward
      laminarin and p-nitrophenyl-beta-D-glucoside and produce spores with
      reduced thermoresistance.
    supporting_text: >-
      We show that spr1 mutant cells do not hydrolyze
      p-nitrophenyl-beta-D-glucoside or laminarin in a whole-cell assay for
      exo-1,3-beta-glucanases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache directly supports the SPR1 exo-1,3-beta-glucanase
      activity and ascospore thermoresistance phenotype.
- id: PMID:8509335
  title: SSG1, a gene encoding a sporulation-specific 1,3-beta-glucanase in Saccharomyces
    cerevisiae.
  findings:
  - statement: >-
      The SSG1/SPR1 coding sequence encodes a signal-peptide-bearing 445 amino
      acid protein homologous to extracellular Exg1, and ssg1/ssg1 diploids
      complete sporulation with delayed mature asci.
    supporting_text: >-
      The N-terminal domain of the putative precursor is a very hydrophobic
      segment with structural features resembling those of signal peptides of
      secreted proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache corroborates that SSG1/SPR1 encodes a
      sporulation-specific secretory exo-1,3-beta-glucanase.
