id: P32603
gene_symbol: SPR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  SPR1 encodes a sporulation-specific secreted GH5
  glucan 1,3-beta-glucosidase in Saccharomyces cerevisiae. Spr1 is induced late
  in sporulation, enters the prospore-membrane lumen, becomes retained in the
  mature ascospore wall, and remodels ascospore wall beta-glucan to promote
  timely spore wall assembly and ascospore thermoresistance.
