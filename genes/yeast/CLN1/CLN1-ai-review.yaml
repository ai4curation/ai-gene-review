  review:
    summary: PAINT transfer of the cyclin-dependent protein kinase holoenzyme complex to the G1 cyclin clade (node
      PTN000019791). Correct for Cln1, whose Cdc28-bound complex is directly documented.
    action: ACCEPT
    reason: 'Cln1 is a cyclin: its entire molecular function is exerted as the regulatory subunit of a Cdc28 holoenzyme,
      so the complex term is not peripheral but part of the core description. The complex is curated in its own
      right as ComplexPortal CPX-1699 (CLN1-CDC28 kinase complex), and Cln1-Cdc28 has been immunoprecipitated
      from yeast extracts and shown to be an active kinase. CLN1 (SGD:S000004812) appears in this row''s WITH/FROM,
      which is expected and not circular: its own experimental evidence for the complex is one of the descendant
      evidences behind the IBD, and the IBA additionally asserts that the complex is inherited rather than lineage-specific.'
    supported_by:
