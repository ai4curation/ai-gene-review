- id: PMID:2147225
  title: Cell cycle arrest caused by CLN gene deficiency in Saccharomyces cerevisiae resembles START-I arrest
    and is independent of the mating-pheromone signalling pathway.
  findings:
  - statement: Null mutations in CLN1, CLN2 and CLN3 together arrest cells in G1; the arrest point is Start and
      is independent of the mating-pheromone signalling pathway.
    supporting_text: |-
      Null mutations in three genes encoding cyclin-like proteins (CLN1, CLN2, and
      CLN3) in Saccharomyces cerevisiae cause cell cycle arrest in G1 (cln arrest)
  - statement: Cln function is specifically required to transit Start, not for later cell cycle stages; cells
      arrested in S phase still completed division after Cln depletion.
    supporting_text: These results are consistent with a specific CLN requirement for START transit
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cross 1990, Mol Cell Biol; abstract-only cache. One of the two IGI sources for GO:0007089, and
      the paper that separated cln arrest from pheromone arrest.
- id: PMID:21945277
  title: Cyclin-specific docking motifs promote phosphorylation of yeast signaling proteins by G1/S Cdk complexes.
  findings:
  - statement: Ste5 and Ste20 fragments are phosphorylated by Cln1- and Cln2-containing Cdk complexes but not
      by Cln3-, Clb5- or Clb2-Cdk, establishing a Cln1/2-specific substrate class reached through LP docking motifs.
    supporting_text: phosphorylation of the Ste5 and Ste20 fragments was observed only with Cln1 and Cln2, and
      not with Cln3, Clb5, or Clb2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Bhaduri & Pryciak 2011, Curr Biol; full text cached. A direct Cln1 experiment, but on the pheromone
      pathway rather than on any term currently annotated to CLN1; it motivates a suggested question rather than
      a new annotation.
- id: PMID:2569741
  title: A family of cyclin homologs that control the G1 phase in yeast.
  findings:
  - statement: CLN1 and CLN2 were isolated as dosage suppressors of a cdc28 temperature-sensitive mutation and
      encode closely related cyclin homologs.
    supporting_text: "Two Saccharomyces cerevisiae genes were isolated based upon their \ndosage-dependent rescue\
      \ of a temperature-sensitive mutation of the gene CDC28"
  - statement: Cln1 and Cln2 are close paralogs within the cyclin family.
    supporting_text: "CLN1 and \nCLN2 encode closely related proteins that also share homology with cyclins."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Hadwiger et al. 1989, PNAS; abstract-only cache. The CLN1/CLN2 cloning paper and the NAS source
      for the GO:1902806 row. Its dominant-allele result (advanced G1/S, resistance to G1 arrest) is for CLN2-1,
      not CLN1.
- id: PMID:2574633
  title: An essential G1 function for cyclin-like proteins in yeast.
  findings:
  - statement: Any one of CLN1, CLN2 or CLN3 is sufficient for proliferation; eliminating all three arrests the
      cell cycle regardless of cell type.
    supporting_text: |-
      Mutational elimination of the CLN1, CLN2, and DAF1/WHI1 products leads
      to cell cycle arrest independent of cell type, while expression of any one of
      the genes allows cell proliferation
  - statement: Conditional expression of CLN1 confined the essential Cln requirement to G1 phase, and Cln function
      decays rapidly once synthesis stops.
    supporting_text: |-
      Using strains where CLN1 was expressed
      conditionally, the essential function of Cln proteins was found to be limited to
      the G1 phase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Richardson et al. 1989, Cell; abstract-only cache. The second IGI source for GO:0007089, and
      the paper whose conditional allele was CLN1 itself.
- id: PMID:8387915
  title: 'Comparison of the Saccharomyces cerevisiae G1 cyclins: Cln3 may be an upstream activator of Cln1, Cln2
    and other cyclins.'
  findings:
  - statement: Cln1 and Cln2 are far more abundant than Cln3 and carry much stronger associated histone H1 kinase
      activity.
    supporting_text: |-
      We find that Cln3 is a much rarer protein than Cln1 or Cln2 and has a
      much weaker associated histone H1 kinase activity
  - statement: Cln1 and Cln2, unlike Cln3, are cell cycle regulated and are down-regulated by pheromone-induced
      G1 arrest.
    supporting_text: |-
      Unlike Cln1 and Cln2, Cln3 is
      not significantly cell cycle regulated, nor is it down-regulated by mating
      pheromone-induced G1 arrest.
  - statement: Artificially expressed CLN1 activates Start less efficiently than CLN3, consistent with Cln3 acting
      upstream and Cln1 acting as a downstream/feedback cyclin.
    supporting_text: |-
      In similar experiments, CLN1 is less efficient than CLN3 at
      activating Start.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Tyers et al. 1993, EMBO J; abstract-only cache. Source of a GO:0016538 IDA row and the direct
      three-way comparison that places Cln1 with Cln2 rather than Cln3.
