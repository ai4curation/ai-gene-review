gene_symbol: CLN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Cln1 is one of the two closely related G1/S cyclins (Cln1 and Cln2) of the budding yeast Saccharomyces
  cerevisiae and, with the upstream G1 cyclin Cln3, forms the trio of Cln proteins of which at least one is required
  for passage through Start, the point in late G1 at which the cell commits to a new division cycle. Cln1 has
  no catalytic activity of its own: it is a cyclin-box protein (Pfam Cyclin_N; the Cln-type Cyclin_CLN family)
  that binds the sole essential cyclin-dependent kinase Cdc28 (Cdk1) and converts it into an active protein serine/threonine
  kinase, the curated Cln1-Cdc28 complex. CLN1 is transcribed in late G1 by the SBF (Swi4-Swi6) transcription
  factor downstream of Cln3-Cdc28, and both its mRNA and protein are strongly cell cycle periodic, peaking in
  G1 and falling as cells enter S phase; the protein is short-lived, with a PEST-rich C-terminal half and ubiquitylation
  by SCF(Grr1). Among the three Cln proteins Cln1 belongs with Cln2 to the abundant, periodic, high-activity tier
  rather than with the rare, constitutively expressed cell-size sensor Cln3, and the division of labour matches
  that split: Cln3-Cdc28 initiates Start transcription, whereas Cln1-Cdc28 and Cln2-Cdc28 execute the downstream
  Start events, including bud emergence and the onset of DNA synthesis, and sharpen the transcriptional switch
  by phosphorylating the SBF co-regulator Stb1. Cln1-Cdc28 reaches a cyclin-class-specific set of substrates through
  LP docking motifs, including the mating MAP kinase scaffold Ste5 and the kinase Ste20, which are phosphorylated
  by Cln1 and Cln2 but not by Cln3 or the B-type cyclins, and which is how cells past Start become refractory
  to pheromone. Together with the Pho85 cyclins Pcl1 and Pcl2, Cln1 and Cln2 supply the late-G1 cyclin-CDK burst
  required for cell morphogenesis - septin ring assembly and polarisation of the bud site - but not for DNA replication.
  Cln1 is distributed between the nucleus and the cytoplasm. Genetically the CLN genes are mutually redundant
  yet collectively essential: cln1 single mutants are viable, cln1 cln2 double mutants are delayed in budding
  and DNA synthesis, and cln1 cln2 cln3 triple mutants arrest as unbudded cells at Start; conditional expression
  of CLN1 was the experiment that first confined the essential Cln requirement to G1.'
