core_functions:
- description: Regulatory cyclin subunit that binds the cyclin-dependent kinase Cdc28 (Cdk1) and converts it into
    an active protein serine/threonine kinase, forming the Cln1-Cdc28 holoenzyme (ComplexPortal CPX-1699). CLN1
    is transcribed by SBF in late G1, and Cln1-Cdc28 is one of the three G1 cyclin-CDK complexes any one of which
    suffices to carry the cell through Start into S phase; loss of all three arrests cells as unbudded G1 cells
    at Start.
