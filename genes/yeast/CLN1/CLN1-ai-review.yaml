- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10688190
  qualifier: enables
  supporting_entities:
  - UniProtKB:P00546
  review:
    summary: Bare protein binding from the Ito et al. comprehensive two-hybrid analysis, with CDC28 (UniProtKB:P00546)
      as the partner. The interaction is real and expected - Cln1 is a Cdc28 cyclin - but the term says nothing
      about what the interaction accomplishes.
    action: MODIFY
    reason: 'Bare protein binding carries no functional information, and the project''s protein-binding policy
      excludes ACCEPT and KEEP_AS_NON_CORE for it. The informative replacement is GO:0019901 protein kinase binding:
      the recorded partner is a protein kinase, and binding a CDK is precisely what a cyclin does. The stronger
      claim that Cln1 *activates* that kinase is asserted separately from the GO:0016538 IDA rows, so GO:0019901
      is the right level for an interaction-detection row.'
