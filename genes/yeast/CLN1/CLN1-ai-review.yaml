proposed_new_terms: []
suggested_questions:
- question: Are Cln1 and Cln2 genuinely interchangeable, or does Cln1 have private substrates? Every molecular
    experiment in the cached literature assays the two together and reports them as equivalent, while the published
    Cln-specific results on nuclear export, LP-motif docking geometry and enrichment at polarised growth sites
    were obtained with Cln2 alone, so Cln1's individual contribution has never been isolated.
- question: Should the Cln1/Cln2 shut-off of the pheromone pathway be annotated to the cyclins at all? Cln1- and
    Cln2-Cdk, but not Cln3-, Clb5- or Clb2-Cdk, phosphorylate Ste5 and Ste20, yet no budding-yeast cyclin carries
    GO:0180040 negative regulation of pheromone response MAPK cascade; SGD instead annotates CLN2 to GO:0000321
    re-entry into mitotic cell cycle after pheromone arrest. Is that a deliberate convention, and if so should
    CLN1 carry a GO:0000321 row too?
- question: Is the curated Cln1-Pho85 interaction (UniProt NbExp=2, from PMID:9032248) physiologically meaningful,
    or does it reflect shared cyclin-box chemistry between the two budding-yeast CDKs? No phenotype or substrate
    has been attributed to a Cln1-Pho85 complex.
- question: Within the late-G1 cyclin-CDK burst that CLN1,2 and PCL1,2 jointly supply for septin ring assembly
    and bud-site polarisation, does Cln1 contribute anything the other three cyclins cannot? The requirement has
    only been demonstrated for the combined activity, which is why no morphogenesis term is proposed for CLN1
    here.
suggested_experiments:
- hypothesis: Cln1 and Cln2 have distinguishable substrate repertoires despite their redundancy in viability assays.
  description: In a cyclin-replacement strain where Cdc28 activity in late G1 is supplied by a single inducible
    cyclin (Cln1 or Cln2 alone), combine analog-sensitive cdc28-as1 with quantitative phosphoproteomics within
    minutes of cyclin induction in elutriated small G1 cells, and compare the two phosphosite sets directly. Score
    LP-motif-containing substrates separately to test whether docking preference rather than abundance accounts
    for any difference.
- hypothesis: Cln1 has a functionally important nuclear pool distinct from its cytoplasmic pool.
  description: Build NLS- and NES-tethered Cln1 variants at the endogenous locus in a cln2 cln3 background and
    ask which compartment-restricted form supports Start, Stb1 phosphorylation, bud emergence and recovery from
    pheromone arrest. The published compartment-partition experiments of this design were done on Cln2, so the
    Cln1 result is not predictable from them.
- hypothesis: The Cln1-Pho85 interaction has no physiological output.
  description: Co-immunoprecipitate endogenously tagged Cln1 and Pho85 across a synchronised cell cycle to establish
    whether the complex forms at native stoichiometry, then test whether any Cln1-dependent phosphorylation event
    survives in a pho85 deletion and whether Pho85 kinase activity is stimulated by purified Cln1 in vitro.
