  review:
    summary: 'Phylogenetic (PAINT) annotation of the G1/S transition to the G1 cyclin clade (node PTN000019791),
      whose experimental descendants include metazoan cyclin D and cyclin E, fission-yeast Puc1/Cig1 and the budding-yeast
      cyclins Cln2, Cln3 and Clb5/6. Cln1 is a canonical member: Cln1-Cdc28 is one of the three G1 cyclin-CDK
      complexes any one of which suffices to carry cells through Start into S phase.'
    action: ACCEPT
    reason: The IBD node placement is sound - driving the G1/S transition is the ancestral function of the G1
      cyclin-CDK clade - and Cln1 has independent experimental grounding for the same biology in this gene (the
      GO:0007089 IGI rows below, and the Cln1-Cdc28 kinase assays). Neither CLN1 (SGD:S000004812) nor its paralog
      CLN2 (SGD:S000006177) is in this row's WITH/FROM, but CLN3 (SGD:S000000038) and the S-phase cyclins Clb5
      (SGD:S000006324) and Clb6 (SGD:S000003341) are, along with human cyclin E1 (UniProtKB:P24864) and cyclin
      D1 (UniProtKB:P24385), so the node is seeded by G1/S cyclins across the clade and the transfer is consistent
      with CLN1's own evidence.
    supported_by:
    - reference_id: PMID:8387915
      supporting_text: |-
        the G1 cyclins Cln1, Cln2 and
        Cln3 regulate entry into the cell cycle (Start) by activating the Cdc28 protein
        kinase
      reference_section_type: ABSTRACT
    - reference_id: PMID:2574633
      supporting_text: |-
        Mutational elimination of the CLN1, CLN2, and DAF1/WHI1 products leads
        to cell cycle arrest independent of cell type, while expression of any one of
        the genes allows cell proliferation
      reference_section_type: ABSTRACT
