- description: 'As one of the two abundant, cell-cycle-periodic Cln proteins, Cln1 supplies the late-G1 kinase
    activity that executes the downstream Start events rather than initiating the Start transcriptional programme:
    Cln1-Cdc28 phosphorylates the SBF co-regulator Stb1 and is required with Cln2 for timely bud emergence and
    onset of DNA synthesis. Its substrate repertoire is cyclin-class-specific, reached through LP docking motifs,
    and includes the mating MAP kinase scaffold Ste5 and the kinase Ste20, which Cln1- and Cln2-Cdk phosphorylate
    but Cln3-, Clb5- and Clb2-Cdk do not. Cln1 is partitioned between the nucleus, where its Start transcription
    substrates lie, and the cytoplasm.'
