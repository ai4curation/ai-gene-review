descriptions:
- source: UniProt
  text: Mitochondrial isozyme of C-1-tetrahydrofolate synthase. The trifunctional
    enzyme catalyzes the interconversion of the one-carbon derivatives of tetrahydrofolate
    (THF) between different oxidation states by the enzymatic activities 10-formyltetrahydrofolate
    synthetase, 5,lO-methenyltetrahydrofolate cyclohydrolase, and 5,lO- methylenetetrahydrofolate
    dehydrogenase.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P09440
  source_id: P09440
- source: Alliance_Imported
  text: Mitochondrial C1-tetrahydrofolate synthase; involved in interconversion between
    different oxidation states of tetrahydrofolate (THF); provides activities of formyl-THF
    synthetase, methenyl-THF cyclohydrolase, and methylene-THF dehydrogenase
  source_type: curated
  url: https://www.yeastgenome.org/locus/MIS1
  source_id: SGD:S000000288
- source: Alliance_Automated
  text: Enables formate-tetrahydrofolate ligase activity; methenyltetrahydrofolate
    cyclohydrolase activity; and methylenetetrahydrofolate dehydrogenase (NADP+) activity.
    Involved in folic acid biosynthetic process. Located in mitochondrion. Human ortholog(s)
    of this gene implicated in several diseases, including Down syndrome; abdominal
    aortic aneurysm; cleft lip; combined immunodeficiency and megaloblastic anemia
    with or without hyperhomocysteinemia; and neural tube defect (multiple). Orthologous
    to human MTHFD1L (methylenetetrahydrofolate dehydrogenase (NADP+ dependent) 1
    like) and MTHFD1 (methylenetetrahydrofolate dehydrogenase, cyclohydrolase and
    formyltetrahydrofolate synthetase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MIS1
  source_id: SGD:S000000288
