- source: Alliance_Automated
  text: Enables formate-tetrahydrofolate ligase activity; methenyltetrahydrofolate
    cyclohydrolase activity; and methylenetetrahydrofolate dehydrogenase (NADP+) activity.
    Involved in folic acid biosynthetic process. Located in mitochondrion. Human ortholog(s)
    of this gene implicated in several diseases, including Down syndrome; abdominal
    aortic aneurysm; cleft lip; combined immunodeficiency and megaloblastic anemia
    with or without hyperhomocysteinemia; and neural tube defect (multiple). Orthologous
    to human MTHFD1L (methylenetetrahydrofolate dehydrogenase (NADP+ dependent) 1
    like) and MTHFD1 (methylenetetrahydrofolate dehydrogenase, cyclohydrolase and
    formyltetrahydrofolate synthetase 1).
