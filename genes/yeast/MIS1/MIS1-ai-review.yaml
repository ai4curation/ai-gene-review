  review:
    summary: Shannon & Rabinowitz characterised the three C1-THF synthase activities of the mitochondrial isozyme.
      These interconvert one-carbon units already on THF (formate + THF to 10-formyl-THF to 5,10-methenyl-THF to
      5,10-methylene-THF); none synthesises folic acid (pteroylglutamate) de novo, which in yeast is the Fol1/Fol2/Fol3
      pathway. The experimental evidence is sound; only the process term is wrong.
    action: MODIFY
    reason: The demonstrated activities are tetrahydrofolate interconversions, not folic acid biosynthesis.
