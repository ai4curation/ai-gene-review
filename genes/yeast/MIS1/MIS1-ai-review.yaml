id: P09440
gene_symbol: MIS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Mitochondrial C1-tetrahydrofolate synthase of Saccharomyces cerevisiae, a homodimeric trifunctional
  enzyme (subunit about 100 kDa) and the mitochondrial isozyme of cytosolic Ade3. Its N-terminal dehydrogenase/cyclohydrolase
  domain carries NADP+-dependent 5,10-methylene-THF dehydrogenase (EC 1.5.1.5) and 5,10-methenyl-THF cyclohydrolase
  (EC 3.5.4.9) activities; its C-terminal domain is an ATP-dependent 10-formyl-THF synthetase (EC 6.3.4.3). Together
  they interconvert formate, 10-formyl-THF, 5,10-methenyl-THF and 5,10-methylene-THF in the mitochondrial matrix.
  This links mitochondrial one-carbon units, e.g. from glycine cleavage, with the cytosolic folate pool through
  formate.
