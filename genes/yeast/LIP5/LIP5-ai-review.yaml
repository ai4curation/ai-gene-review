gene_symbol: LIP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lip5 is the mitochondrial lipoyl synthase of Saccharomyces cerevisiae, the radical SAM enzyme
  that inserts sulfur atoms at C6 and C8 of an octanoyl group bound to a lipoyl-domain lysine. It carries
  two [4Fe-4S] clusters, one that cleaves S-adenosyl-L-methionine to a 5'-deoxyadenosyl radical and an
  auxiliary cluster that donates the sulfur atoms. Lip5 acts after the octanoyltransferase Lip2 in a mitochondrial
  pathway in which the glycine cleavage H protein Gcv3 is lipoylated first and is required for lipoylation
  of the E2 subunits Lat1 and Kgd2. lip5 mutants cannot synthesize lipoic acid but retain the ability
  to attach it, grow poorly on non-fermentable carbon sources and lose mitochondrial DNA at high frequency.
