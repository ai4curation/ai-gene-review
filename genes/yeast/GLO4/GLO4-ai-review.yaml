id: Q12320
gene_symbol: GLO4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GLO4 (YOR040W) encodes the mitochondrial glyoxalase II (hydroxyacylglutathione hydrolase,
  EC 3.1.2.6) of Saccharomyces cerevisiae, a zinc-dependent metallo-beta-lactamase-fold thiolesterase
  that hydrolyses (R)-S-lactoylglutathione to D-lactate and glutathione. It is synthesised with an N-terminal
  mitochondrial presequence (the mature protein begins at Met-11) and resides in the mitochondrial matrix.
  GLO4 is expressed on non-fermentable carbon sources such as glycerol but not on glucose, whereas its
  59%-identical paralogue GLO2 encodes the constitutive cytoplasmic isozyme. Together the two account
  for all glyoxalase II activity of the cell; a glo2 glo4 double mutant is as methylglyoxal-sensitive
  as a glo1 mutant. Compared with Glo2, purified Glo4 shows a broad pH-activity profile (pH 6.5-9) with
  a nearly constant Km for S-D-lactoylglutathione, consistent with operation at the alkaline pH of the
  mitochondrial matrix.
