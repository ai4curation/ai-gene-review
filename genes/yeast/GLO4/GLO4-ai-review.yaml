suggested_questions:
- question: 'What is the source of S-D-lactoylglutathione in the mitochondrial matrix: import from the
    cytosol, or a mitochondrial glyoxalase I-like activity?'
- question: Is D-lactate released by Glo4 in the matrix directly oxidised by mitochondrial D-lactate dehydrogenase
    (Dld1), coupling methylglyoxal detoxification to respiration on glycerol?
suggested_experiments:
- description: Profile S-D-lactoylglutathione in isolated mitochondria from glo4 delta vs wild type grown
    on glycerol, and test methylglyoxal sensitivity of glo4 delta on glycerol medium.
