  review:
    summary: 'YeastPathways PWY-901 is modelled as a cytosolic pathway and the GO-CAM conversion propagated
      ''is_active_in cytosol'' to every enzyme, including Glo4. Glo4 is the mitochondrial-matrix isozyme:
      it carries a cleaved mitochondrial presequence (mature N-terminus Met-11) and active Glo4p was localised
      to the matrix. There is no evidence of a cytosolic pool. The compartment assignment is wrong for
      this paralogue.'
    action: REMOVE
    reason: Pathway-level compartment inherited by the mitochondrial paralogue; contradicted by direct
      localisation to the mitochondrial matrix.
