gene_symbol: GLO4
organism: yeast
uniprot_id: Q12320
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Thiolesterase that catalyzes the hydrolysis of S-D- lactoylglutathione to
    form glutathione and D-lactic acid. Involved in the metabolism of methylglyoxal,
    a toxic compound for yeast proliferation, by converting methylglyoxal to lactate
    via S-D- lactoylglutathione by sequential enzyme reactions catalyzed by glyoxalase
    I and glyoxalase II.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12320
  source_id: Q12320
- source: Alliance_Imported
  text: Mitochondrial glyoxalase II; catalyzes the hydrolysis of S-D-lactoylglutathione
    into glutathione and D-lactate; GLO4 has a paralog, GLO2, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLO4
  source_id: SGD:S000005566
- source: Alliance_Automated
  text: Enables hydroxyacylglutathione hydrolase activity. Involved in methylglyoxal
    catabolic process. Located in mitochondrial matrix. Human ortholog(s) of this
    gene implicated in inherited metabolic disorder and paroxysmal nonkinesigenic
    dyskinesia 1. Orthologous to several human genes including HAGH (hydroxyacylglutathione
    hydrolase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLO4
  source_id: SGD:S000005566
