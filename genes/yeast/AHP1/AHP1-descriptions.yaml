descriptions:
- source: UniProt
  text: Thiol-specific peroxidase that catalyzes the reduction of hydrogen peroxide
    and organic hydroperoxides to water and alcohols, respectively. Plays a role in
    cell protection against oxidative stress by detoxifying peroxides and as sensor
    of hydrogen peroxide-mediated signaling events. Preferentially eliminates organic
    peroxides rather than hydrogen peroxide (PubMed:10391912, PubMed:10681558, PubMed:9988687).
    Relays alkyl hydroperoxides as a signal to the transcription factor CAD1/YAP2
    by inducing the formation of intramolecular disulfide bonds in CAD1, which causes
    its nuclear accumulation and activation (PubMed:20145245). Involved in cellular
    Mn(2+) homeostasis (PubMed:10635552).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38013
  source_id: P38013
