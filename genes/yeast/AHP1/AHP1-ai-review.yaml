taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Peroxiredoxin AHP1 (alkyl hydroperoxide reductase 1; cytoplasmic thiol peroxidase III, cTPx
  III; ''type II

  TPx'') is a Prx5-subfamily peroxiredoxin of Saccharomyces cerevisiae and one of the two most highly

  expressed yeast thiol peroxidases. It reduces organic (alkyl) hydroperoxides in preference to hydrogen

  peroxide, using electrons from thioredoxin (TRX1/TRX2) but not glutathione; the peroxidatic Cys62 forms
  an

  intersubunit disulfide that thioredoxin reduces. AHP1 is a cytosolic protein that protects cells against

  organic peroxides, and ahp1 mutants are also sensitive to several metals and to glutathione depletion.
  It

  relays alkyl hydroperoxide signals to the transcription factor Cad1/Yap2 and is a prominent target of

  oxidative-stress-dependent urmylation (URM1 conjugation). Its C-terminus (AHL) matches the PTS1 consensus,

  and its Candida homologue PMP20 is peroxisomal, but a peroxisomal pool of yeast AHP1 has not been

  established.'
