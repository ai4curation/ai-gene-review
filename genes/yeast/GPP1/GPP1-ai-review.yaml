suggested_questions:
- question: Does the in vitro sn-glycerol 1-phosphatase activity of Gpp1p matter in vivo, given that yeast
    is not known to make sn-glycerol 1-phosphate?
- question: Gpp1p and Gpp2p also dephosphorylate other sugar-phosphates in some reports; which non-glycerol
    substrates (if any) are physiologically relevant?
suggested_experiments:
- description: Measure intracellular sn-glycerol 3-phosphate and glycerol in gpp1, gpp2 and double mutants
    under anaerobic and osmotic shifts using enantiomer-resolved LC-MS.
