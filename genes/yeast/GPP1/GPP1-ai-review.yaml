  supporting_entities:
  - SGD_PWY:PWY3O-48
  review:
    summary: RCA from YeastPathways glycerol biosynthesis (PWY3O-48). The pathway reaction is written
      as 'glycerol 1-phosphate + H2O -> glycerol + phosphate' (EC 3.1.3.21 name) and was mapped to sn-glycerol
      1-phosphatase. But the substrate in this pathway is the product of Gpd1p/Gpd2p, sn-glycerol 3-phosphate;
      the mapping picks the wrong stereoisomer. Replace with sn-glycerol 3-phosphatase activity.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0043136
      label: sn-glycerol 3-phosphatase activity
    supported_by:
    - *id002
    - reference_id: PMID:11058591
      supporting_text: Mutants lacking both GPP1 and GPP2 are devoid of glycerol 3-phosphatase activity
        and produce only a small amount of glycerol, confirming the essential role for this enzyme in
        glycerol biosynthesis.
