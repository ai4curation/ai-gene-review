taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Gpp1p (Rhr2p) is the major glycerol-3-phosphate phosphohydrolase (EC 3.1.3.21) of S. cerevisiae,
  a Mg2+-dependent HAD-superfamily (DOG/GPP family) monomeric phosphatase. It hydrolyses sn-glycerol 3-phosphate,
  made from DHAP by Gpd1p/Gpd2p, to glycerol and phosphate, the second and final step of glycerol synthesis.
  In vitro it is not stereospecific and also dephosphorylates sn-glycerol 1-phosphate. Gpp1p and its 95%
  identical paralog Gpp2p are largely redundant: only the double mutant lacks glycerol-3-phosphatase activity,
  makes little glycerol and is osmosensitive. GPP1 is the constitutively abundant, PKA-dependent isoform;
  it is transiently induced on transfer to anaerobiosis, and gpp1 mutants grow poorly anaerobically because
  glycerol 3-phosphate builds up. The phosphatase step is not rate-limiting for glycerol flux. Gpp1p is
  a soluble cytosolic protein that is also seen in the nucleus.'
