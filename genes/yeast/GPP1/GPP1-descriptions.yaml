gene_symbol: GPP1
organism: yeast
uniprot_id: P41277
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Major isoform of glycerol-1-phosphate phosphohydrolase involved in glycerol
    biosynthesis. Plays a role in osmoadaptation and required for adaptation to anaerobic
    conditions. Is not stereospecific as it is able to act on both the D- and L-forms
    of glycerol 1- (or 3-) phosphate in vitro (PubMed:8662716).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41277
  source_id: P41277
- source: Alliance_Imported
  text: Constitutively expressed DL-glycerol-3-phosphate phosphatase; also known as
    glycerol-1-phosphatase; involved in glycerol biosynthesis, induced in response
    to both anaerobic and osmotic stress; GPP1 has a paralog, GPP2, that arose from
    the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPP1
  source_id: SGD:S000001315
- source: Alliance_Automated
  text: Enables sn-glycerol 1-phosphatase activity and sn-glycerol 3-phosphatase activity.
    Involved in glycerol biosynthetic process. Located in cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/GPP1
  source_id: SGD:S000001315
