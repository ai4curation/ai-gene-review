descriptions:
- source: UniProt
  text: Major isoform of glycerol-1-phosphate phosphohydrolase involved in glycerol
    biosynthesis. Plays a role in osmoadaptation and required for adaptation to anaerobic
    conditions. Is not stereospecific as it is able to act on both the D- and L-forms
    of glycerol 1- (or 3-) phosphate in vitro (PubMed:8662716).
  source_type: curated
