gene_symbol: ETR1
organism: yeast
uniprot_id: P38071
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the NADPH-dependent reduction of trans-2-enoyl thioesters in mitochondrial
    fatty acid synthesis (fatty acid synthesis type II). Fatty acid chain elongation
    in mitochondria uses acyl carrier protein (ACP) as an acyl group carrier, but
    the enzyme accepts both ACP and CoA thioesters as substrates in vitro. Required
    for respiration and the maintenance of the mitochondrial compartment.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38071
  source_id: P38071
- source: Alliance_Imported
  text: 2-enoyl thioester reductase; member of the medium chain dehydrogenase/reductase
    family; localized to mitochondria, where it has a probable role in fatty acid
    synthesis; human MECR functionally complements the respiratory growth defect of
    the null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/ETR1
  source_id: SGD:S000000230
- source: Alliance_Automated
  text: Enables enoyl-[acyl-carrier-protein] reductase (NADPH) activity. Involved
    in aerobic respiration and fatty acid biosynthetic process. Located in mitochondrial
    matrix. Used to study Leber hereditary optic neuropathy with demyelinating disease
    of CNS. Human ortholog(s) of this gene implicated in childhood-onset dystonia
    with optic atrophy and basal ganglia abnormalities and optic atrophy. Orthologous
    to human MECR (mitochondrial trans-2-enoyl-CoA reductase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ETR1
  source_id: SGD:S000000230
