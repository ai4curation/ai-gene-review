- source: Alliance_Automated
  text: Enables enoyl-[acyl-carrier-protein] reductase (NADPH) activity. Involved
    in aerobic respiration and fatty acid biosynthetic process. Located in mitochondrial
    matrix. Used to study Leber hereditary optic neuropathy with demyelinating disease
    of CNS. Human ortholog(s) of this gene implicated in childhood-onset dystonia
    with optic atrophy and basal ganglia abnormalities and optic atrophy. Orthologous
    to human MECR (mitochondrial trans-2-enoyl-CoA reductase).
