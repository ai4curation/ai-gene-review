  label: Saccharomyces cerevisiae S288C
description: ETR1 (YBR026C; also MRF1') encodes the mitochondrial 2-enoyl thioester reductase of type
  II fatty acid synthesis (FAS II), a zinc-independent member of the medium-chain dehydrogenase/reductase
  (MDR) superfamily (quinone oxidoreductase subfamily) orthologous to human MECR. Etr1 catalyses the NADPH-dependent
  reduction of trans-2-enoyl-ACP to saturated acyl-ACP, the final step of each FAS II elongation cycle;
  in vitro it also reduces CoA thioesters. Etr1 is located in the mitochondrial matrix. Deletion causes
  respiratory deficiency, low cytochrome content and rudimentary mitochondria, which can be complemented
  only by mitochondrially targeted reductases, including the structurally unrelated E. coli FabI, showing
  that mitochondrial enoyl-ACP reductase activity is what is required. Overexpression enlarges mitochondria.
  Etr1 was first described as a single-stranded ARS-binding protein, a nuclear function later judged incorrect.
