- question: Is the reported ARS single-stranded DNA binding (PMID:8195160) attributable to Etr1 at all,
    or an artefact of the original screen?
- question: What is the physiological significance of Etr1 activity on CoA thioesters, e.g. in mitochondrial
    chain elongation independent of ACP?
