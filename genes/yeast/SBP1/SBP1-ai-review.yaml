id: P10080
gene_symbol: SBP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: |-
  UniProt P10080 (locus YHL034C; canonical gene symbol SBP1) is the RGG/RRM
  RNA-binding protein Sbp1. SSB1 and SSBR1 are historical synonyms for this
  protein and must not be confused with the unrelated ribosome-associated Hsp70
  chaperone Ssb1/Ssb2. Sbp1 is built from two RRM
  domains separated by a low-complexity RGG (Arg-Gly-Gly) box. Its core molecular
  function is broadly sequence-non-specific mRNA binding with a positional preference
  for the 5' UTR, while the PAB1 transcript contains a specifically recognized A-rich
  5'-UTR tract. Sbp1 acts as a translation repressor through RGG-dependent
  RNA binding and assembly with Pab1/eIF4G-containing initiation complexes, although
  whether Sbp1 binds eIF4G directly or through RNA/Pab1 is disputed. It thereby
  promotes transition of mRNAs out of active translation. Sbp1 is predominantly cytoplasmic in log
  phase and relocalizes to P-bodies and stress granules under stress; it is a
  P-body disassembly factor during recovery from stress, dissolving Edc3/Dhh1/Scd6
  foci in an RGG- and arginine-methylation-dependent manner. The older literature
  additionally reports a nucleolar, snR10/snR11-associated form, but the
  well-characterized contemporary function is cytoplasmic mRNP/translation control.
