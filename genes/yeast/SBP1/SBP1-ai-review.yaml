        Using purified RNA-free proteins, we observed no direct interactions between eIF4G1 and Sbp1, and between eIF4G1 and the RGG domain of Sbp1 (Sbp1RGG)
      reference_section_type: RESULTS
- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:35440550
  review:
    summary: |-
      NEW annotation capturing the molecular basis of Sbp1's P-body disassembly
      activity. Roy et al. 2022 (PMID:35440550) showed by binding studies with purified
      proteins that Sbp1 physically interacts with Edc3 and that the Sbp1-Edc3
      interaction COMPETES with Edc3-Edc3 self-association; addition of purified Sbp1
      (but not the RGG-deletion mutant) significantly decreases Edc3 assemblies. By
      binding Edc3 to prevent it from interacting with its self-assembly partners, Sbp1
      exhibits protein sequestering activity, which is mechanistically distinct from its
      mRNA-binding/translation-repression functions. This term supersedes the generic
      protein binding (GO:0005515) annotations for the Edc3 interaction.
    action: NEW
    reason: Specific, informative MF whose definition covers binding a protein to prevent
      its interaction with other partners. That matches the observed competition between
      Sbp1-Edc3 and Edc3-Edc3 binding and captures the RNA-independent disruption activity
      underlying P-body disassembly. The separate GO:0032984 replacement and proposed
      P-body-disassembly term capture the dissolution of existing assemblies that this MF
      does not fully express; GO:0140311 replaces uninformative protein binding for the
      competitive interaction itself.
    additional_reference_ids:
    - file:yeast/SBP1/SBP1-deep-research-falcon.md
    supported_by:
    - reference_id: PMID:35440550
      supporting_text: |-
        Binding studies using purified proteins revealed that Sbp1 physically interacts with Edc3 and Sbp1-Edc3 interaction competes with Edc3-Edc3 interaction
      reference_section_type: ABSTRACT
- term:
    id: GO:0032055
    label: negative regulation of translation in response to stress
  evidence_type: IMP
  original_reference_id: PMID:16782896
  review:
    summary: |-
      Sbp1 represses translation and promotes P-body engagement particularly under
      stress conditions (e.g. glucose deprivation), consistent with a stress-responsive
      translational-repression role. This is a more contextualized child of the core
      negative-regulation-of-translation function.
    action: KEEP_AS_NON_CORE
    reason: Valid stress-contextualized refinement of the core translational-repression
      role; kept as non-core relative to the general repression function.
    additional_reference_ids:
    - file:yeast/SBP1/SBP1-deep-research-falcon.md
    supported_by:
    - reference_id: PMID:16782896
      supporting_text: |-
        Sbp1p promotes translational repression of mRNA during glucose deprivation
      reference_section_type: ABSTRACT
core_functions:
- description: |-
    Sbp1 binds the 5' UTR of target mRNAs via its two RRM domains and RGG box (positional
    rather than strong sequence specificity) and uses this RNA-binding activity and its
    RGG region to assemble with Pab1/eIF4G-containing complexes and repress both
    cap-dependent and cap-independent translation initiation in the cytoplasm. Direct
    Sbp1-eIF4G binding remains disputed.
  molecular_function:
    id: GO:0048027
    label: mRNA 5'-UTR binding
  directly_involved_in:
  - id: GO:0045947
    label: negative regulation of translational initiation
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:23222640
    supporting_text: |-
      In contrast to Lsm1 and Pat1, Sbp1 shows bias towards the 5′ UTR
    reference_section_type: RESULTS
  - reference_id: PMID:39617253
    supporting_text: |-
      the binding of Sbp1 to the 5'UTRs of mRNAs represses both cap-dependent and cap-independent translation initiation of proteins
    reference_section_type: ABSTRACT
- description: |-
    Under recovery from stress, Sbp1 acts as a P-body disassembly factor: it directly
    binds the P-body scaffold Edc3, and the Sbp1-Edc3 interaction competes with Edc3-Edc3
    self-association, dissolving Edc3/Dhh1/Scd6 foci in an RGG- and
    arginine-methylation-dependent manner. By sequestering Edc3 away from its
    self-assembly partners, Sbp1 promotes disaggregation of the P-body condensate. The
    molecular function here is protein sequestering (Edc3 binding/disruption), distinct
    from the mRNA-binding activity underlying translation repression.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:0032984
    label: protein-containing complex disassembly
  locations:
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:35440550
    supporting_text: |-
      we identify RGG-motif containing translation repressor protein Sbp1 as a disassembly factor of P-bodies since disassembly of P-bodies is defective in Δsbp1
    reference_section_type: ABSTRACT
  - reference_id: PMID:35440550
    supporting_text: |-
      Binding studies using purified proteins revealed that Sbp1 physically interacts with Edc3 and Sbp1-Edc3 interaction competes with Edc3-Edc3 interaction
    reference_section_type: ABSTRACT
  - reference_id: file:yeast/SBP1/SBP1-deep-research-falcon.md
    supporting_text: |-
      Complementation and mutant analyses indicate that the **RGG motif is required** for rescuing PB disassembly defects, and an “arginine methylation defective” mutant (13 Arg→Ala in the RGG motif) fails to rescue, implicating arginine residues (and plausibly methylation state) in function
proposed_new_terms:
- proposed_name: P-body disassembly
  proposed_definition: >-
    The disassembly of a cytoplasmic processing body (P-body), an mRNP granule
    containing translationally repressed mRNAs and mRNA-decay factors.
  supported_by:
  - reference_id: PMID:35440550
    supporting_text: >-
      we identify RGG-motif containing translation repressor protein Sbp1 as a
      disassembly factor of P-bodies since disassembly of P-bodies is defective in
      Δsbp1
    reference_section_type: ABSTRACT
  justification: >-
    The cited experiment is specifically about P-body disassembly, but GO currently
    provides stress granule disassembly (GO:0035617) and P granule disassembly
    (GO:1903864), not a term for P-body disassembly. GO:0032984
    protein-containing complex disassembly is the best available interim parent but
    loses the biologically important granule identity.
suggested_questions:
- question: >-
    Does Sbp1 disassemble P-bodies primarily by sequestering Edc3 from Edc3-Edc3
    contacts, or does it also remodel RNA and other P-body scaffold interactions?
- question: >-
    How are Sbp1's historical nucleolar association with snR10/snR11 and its
    contemporary cytoplasmic translation-control functions partitioned across growth
    conditions?
suggested_experiments:
- hypothesis: >-
    Sbp1's Edc3-binding activity is sufficient to drive P-body dissolution independently
    of its mRNA-binding activity.
  description: >-
    Compare P-body disassembly kinetics after stress recovery in strains expressing
    separation-of-function Sbp1 variants that disrupt the RRM domains, the RGG motif,
    or mapped Edc3-contact surfaces, using endogenous Edc3/Dhh1/Scd6 markers.
  experiment_type: live-cell imaging and separation-of-function mutagenesis
- hypothesis: >-
    The nucleolar and cytoplasmic pools of Sbp1 represent regulated, condition-specific
    functions rather than conflicting localization assignments.
  description: >-
    Quantify endogenously tagged Sbp1 together with nucleolar, P-body, and stress-granule
    markers across logarithmic growth, glucose deprivation, and recovery, and pair the
    imaging with snR10/snR11 and mRNA interaction measurements.
  experiment_type: quantitative microscopy and RNA co-immunoprecipitation
