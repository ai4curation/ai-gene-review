    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:16782896
  review:
    summary: |-
      Cytoplasm is the constitutive site of action for Sbp1. It is largely cytoplasmic
      in mid-log phase, where it carries out translational repression, relocalizing to
      P-bodies/stress granules only under stress.
    action: ACCEPT
    reason: Core, constitutive subcellular localization where Sbp1 performs its
      translation-control function.
    additional_reference_ids:
    - file:yeast/SBP1/SBP1-deep-research-falcon.md
    supported_by:
    - reference_id: file:yeast/SBP1/SBP1-deep-research-falcon.md
      supporting_text: |-
        Sbp1 itself is largely cytoplasmic in mid-log phase and accumulates in PBs under stress conditions (e.g., glucose deprivation/high cell density) or upon overexpression, consistent with conditional relocalization during mRNP remodeling
- term:
    id: GO:0017148
    label: negative regulation of translation
  evidence_type: IDA
  original_reference_id: PMID:22284680
  review:
    summary: |-
      Negative regulation of translation is a CORE function. Rajyaguru et al. showed
      Sbp1 represses translation in an RGG-motif-dependent manner and reported an
      Sbp1-eIF4G interaction. A later purified-protein study found that this interaction
      is not direct and is instead mediated by RNA or a ternary protein. The more specific
      child term negative regulation of translational initiation (GO:0045947) is also
      annotated and preferred.
    action: ACCEPT
    reason: Core biological role with biochemical evidence for repression; the directness
      of the reported Sbp1-eIF4G interaction is disputed by later purified-protein work.
    additional_reference_ids:
    - file:yeast/SBP1/SBP1-deep-research-falcon.md
    supported_by:
    - reference_id: PMID:22284680
      supporting_text: |-
        Npl3 and Sbp1, also directly bind eIF4G and repress translation in a manner dependent on their RGG motifs
      reference_section_type: ABSTRACT
    - reference_id: PMID:28986506
      supporting_text: |-
        Using purified RNA-free proteins, we observed no direct interactions between eIF4G1 and Sbp1, and between eIF4G1 and the RGG domain of Sbp1 (Sbp1RGG)
      reference_section_type: RESULTS
- term:
    id: GO:0031370
    label: eukaryotic initiation factor 4G binding
  evidence_type: IDA
  original_reference_id: PMID:22284680
  review:
    summary: |-
      Rajyaguru et al. reported RGG-dependent Sbp1-eIF4G binding by GST pulldown.
      Later experiments with purified RNA-free proteins detected no direct interaction
      and concluded that the earlier association was likely mediated by endogenous RNA
      or a ternary protein. The curator's IDA annotation is retained, but direct binding
      is explicitly disputed.
    action: ACCEPT
    reason: Retain the curator's specific interaction annotation because the original
      study reported RGG-dependent binding, while recording the later contradictory
      purified-protein result rather than presenting direct binding as settled.
    additional_reference_ids:
