  - *id007
  - *id002
suggested_questions:
- question: Is the PKA site Ser141 phosphorylated in vivo in yeast, and does it regulate Dol-P-Man flux
    under different growth conditions?
- question: Is the Dpm1p-Sac1p interaction used to couple Dol-P-Man/LLO synthesis to growth-dependent
    PtdIns4P control, and does Sac1p binding modulate Dpm1p activity?
suggested_experiments:
- description: Measure Dol-P-Man synthase activity and LLO profiles in strains carrying dpm1 S141A or
    S141D at the genomic locus, under exponential and nutrient-limited growth.
