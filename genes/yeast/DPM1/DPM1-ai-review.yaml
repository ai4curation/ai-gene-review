id: P14020
gene_symbol: DPM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: DPM1 (SED3) encodes dolichol-phosphate mannose (Dol-P-Man) synthase (EC 2.4.1.83), an essential
  tail-anchored ER membrane glycosyltransferase of S. cerevisiae. Its catalytic domain faces the cytoplasm,
  where it transfers mannose from GDP-mannose to dolichyl phosphate to make dolichyl beta-D-mannosyl phosphate.
  After flipping to the luminal leaflet, Dol-P-Man is the mannosyl donor for the luminal mannosyltransferases
  that extend Man5GlcNAc2-PP-Dol to Man9GlcNAc2-PP-Dol (Alg3, Alg9, Alg12), for protein O-mannosylation
  by Pmt mannosyltransferases, and for the mannoses of the GPI-anchor precursor. dpm1 mutants accumulate
  Man5GlcNAc2-PP-Dol and are defective in N-glycosylation, O-mannosylation and GPI anchoring. Activity
  requires a divalent cation, is stimulated by PKA phosphorylation at Ser141 in vitro, and is inhibited
  by aspirin. Through its transmembrane domain Dpm1p also binds and retains the phosphoinositide phosphatase
  Sac1p in the ER of growing cells.
