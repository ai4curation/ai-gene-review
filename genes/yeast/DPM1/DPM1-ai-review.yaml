core_functions:
- description: Transfers mannose from GDP-mannose to dolichyl phosphate on the cytoplasmic face of the
    ER, producing Dol-P-Man, the luminal mannosyl donor for LLO extension, protein O-mannosylation and
    GPI-anchor synthesis.
  molecular_function:
    id: GO:0004582
    label: dolichyl-phosphate beta-D-mannosyltransferase activity
