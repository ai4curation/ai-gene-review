gene_symbol: DPM1
organism: yeast
uniprot_id: P14020
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Transfers mannose from GDP-mannose to dolichol monophosphate to form dolichol
    phosphate mannose (Dol-P-Man) which is the mannosyl donor in pathways leading
    to N-glycosylation, glycosyl phosphatidylinositol membrane anchoring, and O-mannosylation
    of proteins.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P14020
  source_id: P14020
- source: Alliance_Imported
  text: Dolichol phosphate mannose (Dol-P-Man) synthase of ER membrane; catalyzes
    formation of Dol-P-Man from Dol-P and GDP-Man; required for biosynthesis of glycosyl
    phosphatidylinositol (GPI) membrane anchor, as well as O-mannosylation and protein
    N- and O-linked glycosylation; human homolog DPM1 can complement yeast mutant
    strains
  source_type: curated
  url: https://www.yeastgenome.org/locus/DPM1
  source_id: SGD:S000006387
- source: Alliance_Automated
  text: Enables dolichyl-phosphate beta-D-mannosyltransferase activity. Involved in
    GPI anchor biosynthetic process and dolichol-linked oligosaccharide biosynthetic
    process. Located in endoplasmic reticulum membrane. Used to study breast cancer.
    Human ortholog(s) of this gene implicated in congenital disorder of glycosylation
    Ie. Orthologous to human DPM1 (dolichyl-phosphate mannosyltransferase subunit
    1, catalytic).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DPM1
  source_id: SGD:S000006387
