descriptions:
- source: UniProt
  text: Catalyzes the formation of NAD(+) from nicotinamide mononucleotide (NMN) and
    ATP. Can also use the deamidated form; nicotinic acid mononucleotide (NaMN) as
    substrate to form deamido- NAD(+) (NaAD). Key enzyme in both de novo and salvage
    pathways for NAD(+) biosynthesis. Predominantly acts in the salvage pathways via
    NMN.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06178
  source_id: Q06178
