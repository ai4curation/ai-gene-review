    overall_notes: 'Correct: NMNAT transferring AMP from ATP to NMN, in de novo, NAD+
      salvage and NR salvage routes, NMA2 paralog. Calls it nicotinic acid MN adenylyltransferase
      but describes the NMN reaction.'
- source: Alliance_Automated
  text: Enables identical protein binding activity and nicotinamide-nucleotide adenylyltransferase
    activity. Involved in NAD+ biosynthetic process. Located in cytoplasm and nucleus.
    Human ortholog(s) of this gene implicated in Leber congenital amaurosis 9 and
    spondyloepiphyseal dysplasia, sensorineural hearing loss, intellectual developmental
    disorder, and Leber congenital amaurosis. Orthologous to several human genes including
    NMNAT1 (nicotinamide nucleotide adenylyltransferase 1) and NMNAT3 (nicotinamide
    nucleotide adenylyltransferase 3).
