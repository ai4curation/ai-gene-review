gene_symbol: NMA1
organism: yeast
uniprot_id: Q06178
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the formation of NAD(+) from nicotinamide mononucleotide (NMN) and
    ATP. Can also use the deamidated form; nicotinic acid mononucleotide (NaMN) as
    substrate to form deamido- NAD(+) (NaAD). Key enzyme in both de novo and salvage
    pathways for NAD(+) biosynthesis. Predominantly acts in the salvage pathways via
    NMN.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06178
  source_id: Q06178
- source: Alliance_Imported
  text: Nicotinic acid mononucleotide adenylyltransferase; catalyzes the transfer
    of the adenylyl moiety of ATP to nicotinamide mononucleotide to form NAD; involved
    in pathways of NAD biosynthesis, including the de novo, NAD(+) salvage, and nicotinamide
    riboside salvage pathways; homolog of human NMNAT; NMA1 has a paralog, NMA2, that
    arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/NMA1
  source_id: SGD:S000004320
- source: Alliance_Automated
  text: Enables identical protein binding activity and nicotinamide-nucleotide adenylyltransferase
    activity. Involved in NAD+ biosynthetic process. Located in cytoplasm and nucleus.
    Human ortholog(s) of this gene implicated in Leber congenital amaurosis 9 and
    spondyloepiphyseal dysplasia, sensorineural hearing loss, intellectual developmental
    disorder, and Leber congenital amaurosis. Orthologous to several human genes including
    NMNAT1 (nicotinamide nucleotide adenylyltransferase 1) and NMNAT3 (nicotinamide
    nucleotide adenylyltransferase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NMA1
  source_id: SGD:S000004320
