proposed_new_terms: []
suggested_questions:
- question: How is flux divided between Nma1, Nma2 (and peroxisomal Pof1) for NMN versus NaMN in vivo,
    given the high in vitro Km of yeast NMNAT for NaMN?
- question: Do Nma1-Nma2 hetero-oligomers have distinct kinetics or localisation from the homotetramers?
- question: Should the catalytic-activity-independent chaperone (holdase/foldase) activity reported for
    overexpressed Nma1 in proteotoxicity models (PMID:33749726) be annotated, as was proposed for Pnc1?
suggested_experiments:
- description: Measure NaAD and NAD+ formation in nma1, nma2 and nma1 nma2 (rescued by a regulatable allele)
    strains fed nicotinic acid, nicotinamide riboside or tryptophan only.
  experiment_type: genetics/metabolomics
  hypothesis: Nma1 is the dominant NaMN adenylyltransferase in vivo.
