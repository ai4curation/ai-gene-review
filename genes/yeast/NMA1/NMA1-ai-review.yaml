id: Q06178
gene_symbol: NMA1
aliases:
- YLR328W
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NMA1 encodes the major nicotinamide/nicotinic acid mononucleotide adenylyltransferase (NMNAT)
  of yeast, which transfers the AMP moiety of ATP to nicotinamide mononucleotide (NMN) to form NAD+, and
  to nicotinate mononucleotide (NaMN) to form deamido-NAD+ (NaAD). It therefore catalyses a step shared
  by the de novo (kynurenine), nicotinic acid (Preiss-Handler) and nicotinamide riboside salvage routes
  to NAD+. The native enzyme is a homotetramer and Nma1 also associates with its whole-genome-duplication
  paralog Nma2. Nma1 is found in the cytoplasm and nucleus, and increased NMA1 dosage enhances Sir2-dependent
  telomeric and rDNA silencing.
