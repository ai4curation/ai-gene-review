    native-promoter tag, or is it an artefact of N-terminal GFP tagging and NOP1
    overexpression masking mitochondrial import of uS13m?
- question: >-
    What is the basis of the synthetic sickness of sws2 deletion with pds1
    (securin) deletion? Is it a general consequence of respiratory deficiency or
    mtDNA loss that other mitoribosome mutants share?
suggested_experiments:
- description: >-
    Test pds1 deletion combined with deletion of other mt-SSU protein genes (and
    with rho0 strains) to determine whether the SWS2-PDS1 genetic interaction is
    specific to uS13m or a general consequence of losing mitochondrial
    translation.
- description: >-
    Localize endogenously C-terminally tagged Sws2 under oleate (peroxisome
    proliferating) conditions, with mitochondrial and peroxisomal markers, to
    test the reported peroxisomal localization.
