- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IDA
  original_reference_id: PMID:36164978
  qualifier: located_in
  review:
    summary: >-
      From a high-content microscopy screen of the N-terminally GFP-tagged,
      NOP1-promoter-driven SWAT library. Sws2 is not named in the cached
      article text; the call is in the supplementary dataset, which we could not
      inspect. The method fuses GFP to the N-terminus and overexpresses from a
      constitutive promoter, conditions that can perturb N-terminal
      mitochondrial targeting. The paper itself reports that about half of its
      hits are dually localized, with mitochondria as one of the other
      compartments. A later whole-cell proteomics study lists Sws2 among
      multilocalized peroxisomal proteins but explicitly derives that status from
      database annotation, not from new localization data.
    action: UNDECIDED
    reason: >-
      An experimental call we cannot verify from the available text, for a
      protein whose established function is inside mitochondria as a
      mitoribosome component. There is no known peroxisomal role for a
      mitoribosomal protein, but per curation policy an IDA whose supporting data
      we cannot read is not removed. Flagged for expert review.
    supported_by:
    - reference_id: PMID:36164978
      supporting_text: Having a GFP tag on the N′ of each protein allows proper targeting of all known proteins with either a C′ PTS1 or an N′ PTS2 motif
    - reference_id: PMID:36164978
      supporting_text: ~50% of the proteins in our list are dually localized to peroxisomes and other compartments such as mitochondria
    - reference_id: PMID:41686312
      supporting_text: the experimental design of our study does not allow for monitoring the subcellular localization(s) of proteins
