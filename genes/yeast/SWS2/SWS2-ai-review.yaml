id: P53937
gene_symbol: SWS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  SWS2 (YNL081C) encodes uS13m, a 143-residue nuclear-encoded protein of the
  universal uS13 ribosomal protein family that is a structural component of the
  37S small subunit of the mitochondrial ribosome. The 3.25-angstrom cryo-EM
  structure of the yeast 74S mitoribosome (Desai et al. 2017) models Sws2 as
  uS13m in the mt-SSU, where residues contributed by uS13m form several of the
  mitochondria-specific intersubunit bridges (mB8, mB9, mB10, mB13) with the
  large-subunit proteins mL46 and uL5m and 21S rRNA helix H62; the classical
  bacterial uS13 bridge B1b is absent in the yeast mitoribosome. GFP fusions
  localize the protein to mitochondria. Deletion causes respiratory deficiency
  (a high-confidence pet gene) and loss of mitochondrial DNA ([rho0]), as is
  typical for mitoribosomal protein mutants, and slow growth on fermentable
  medium. The gene was named in a synthetic genetic array screen in which
  sws2 deletion was sick in combination with loss of securin (pds1); the basis of
  that interaction is unknown. The protein acts in mitochondrial translation,
  the synthesis of the mitochondrially encoded respiratory-chain and ATP synthase
  subunits on inner-membrane-tethered mitoribosomes.
