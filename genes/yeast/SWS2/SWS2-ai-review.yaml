  review:
    summary: >-
      InterPro2GO mapping from the uS13-like H2TH domain. The nucleic acid
      partner of uS13-family proteins is ribosomal RNA (and tRNA in bacteria), so
      the generic term is correct but less specific than RNA binding, which the
      gene also carries from InterPro.
    action: MODIFY
    reason: >-
      True but too general. The uS13 family contacts rRNA within the ribosome;
      the more specific term RNA binding (GO:0003723), already assigned to this
      gene from the uS13 family signature, is the appropriate refinement. Neither
      term is core: the RNA contacts serve the structural-constituent role.
