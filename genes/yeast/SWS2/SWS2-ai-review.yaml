- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: NAS
  original_reference_id: PMID:25609543
  qualifier: located_in
  review:
    summary: >-
      ComplexPortal (CPX-1603) statement applied to all subunits of the 37S
      mitoribosomal small subunit, based on in situ cryo-electron tomography
      showing that most mitoribosomes sit next to the inner membrane. The
      membrane contacts are made by the large subunit (21S rRNA expansion
      segment 96-ES1 and Mba1), not by small-subunit proteins; uS13m is not an
      integral or peripheral membrane protein in its own right.
    action: KEEP_AS_NON_CORE
    reason: >-
      Defensible at the complex level (the mitoribosome is tethered to the inner
      membrane, so uS13m is associated with it in vivo), but this is an indirect
      localization of a soluble matrix-side complex subunit and is not core.
    supported_by:
    - reference_id: PMID:25609543
      supporting_text: Most mitoribosomes reside in immediate proximity to the inner mitochondrial
        membrane
    - reference_id: PMID:25609543
      supporting_text: two distinct membrane contact sites, formed by the 21S rRNA expansion segment
        96-ES1 and the inner membrane protein Mba1
