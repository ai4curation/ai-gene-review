descriptions:
- source: UniProt
  text: Component of the mitochondrial ribosome (mitoribosome), a dedicated translation
    machinery responsible for the synthesis of mitochondrial genome-encoded proteins,
    including at least some of the essential transmembrane subunits of the mitochondrial
    respiratory chain. The mitoribosomes are attached to the mitochondrial inner membrane
    and translation products are cotranslationally integrated into the membrane.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53937
  source_id: P53937
- source: Alliance_Imported
  text: Component of mitochondrial small ribosomal subunit; similar to E. coli S13
    ribosomal protein; participates in controlling sporulation efficiency; localizes
    to vacuole in response to H2O2; localizes to peroxisomes in glucose-growing cells
  source_type: curated
  url: https://www.yeastgenome.org/locus/SWS2
  source_id: SGD:S000005025
- source: Alliance_Automated
  text: A structural constituent of ribosome. Predicted to be involved in mitochondrial
    translation. Located in peroxisome. Part of mitochondrial small ribosomal subunit.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SWS2
