id: P20051
gene_symbol: URA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: URA4 encodes dihydroorotase (EC 3.5.2.3), the third enzyme of de novo pyrimidine (UMP) biosynthesis
  in Saccharomyces cerevisiae. The ~40 kDa monofunctional zinc metalloenzyme belongs to the class II (homodimeric,
  enterobacterial-type) dihydroorotase subfamily of the amidohydrolase superfamily and catalyses the reversible
  cyclisation of N-carbamoyl-L-aspartate to (S)-dihydroorotate. Unlike animal CAD, the yeast CPSase-ATCase
  protein Ura2 carries only an inactive dihydroorotase-like domain, so Ura4 supplies the sole dihydroorotase
  activity of the cell. URA4 is a soluble cytoplasmic enzyme; its transcription is induced by pathway
  intermediates through the Ppr1 activator, and ura4 mutants are uracil auxotrophs.
