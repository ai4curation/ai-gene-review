descriptions:
- source: UniProt
  text: Histidine kinase that acts as an osmosensor at the plasma membrane. Part of
    the bifurcated SLN1-YPD1-SKN7/SSK1 two-component regulatory system, which controls
    activity of the HOG1 pathway and gene expression in response to changes in the
    osmolarity of the extracellular environment. Under normal osmotic conditions,
    the histidine kinase autophosphorylates His-576. This phosphate is subsequently
    transferred to Asp-1144, from where it is relayed to 'His- 64' of the phosphorelay
    intermediate protein YPD1. Under high osmolarity conditions, the histidine kinase
    is no longer active.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39928
