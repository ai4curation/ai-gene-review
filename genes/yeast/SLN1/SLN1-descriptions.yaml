descriptions:
- source: UniProt
  text: Histidine kinase that acts as an osmosensor at the plasma membrane. Part of
    the bifurcated SLN1-YPD1-SKN7/SSK1 two-component regulatory system, which controls
    activity of the HOG1 pathway and gene expression in response to changes in the
    osmolarity of the extracellular environment. Under normal osmotic conditions,
    the histidine kinase autophosphorylates His-576. This phosphate is subsequently
    transferred to Asp-1144, from where it is relayed to 'His- 64' of the phosphorelay
    intermediate protein YPD1. Under high osmolarity conditions, the histidine kinase
    is no longer active.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39928
  source_id: P39928
- source: Alliance_Imported
  text: Transmembrane histidine phosphotransfer kinase and osmosensor; regulates MAP
    kinase cascade; transmembrane protein with an intracellular kinase domain that
    signals to Ypd1p and Ssk1p, thereby forming a phosphorelay system similar to bacterial
    two-component regulators
  source_type: curated
  url: https://www.yeastgenome.org/locus/SLN1
  source_id: SGD:S000001409
- source: Alliance_Automated
  text: Enables histidine phosphotransfer kinase activity; osmosensor activity; and
    protein histidine kinase activity. Involved in osmosensory signaling via phosphorelay
    pathway. Located in plasma membrane.
  source_type: automated
