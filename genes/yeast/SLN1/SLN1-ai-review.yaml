- term:
    id: GO:0009927
    label: histidine phosphotransfer kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001976860
  - SGD:S000001409
  - UniProtKB:P39838
  review:
    summary: PAINT propagation of histidine phosphotransfer kinase activity within the hybrid histidine
      kinase family.
    action: KEEP_AS_NON_CORE
    reason: The current GO definition of GO:0009927 ('Serves as a phospho-His intermediate enabling the
      transfer of phospho group between a hybrid kinase and a response regulator') describes the histidine
      phosphotransfer (HPt) intermediate role, which in the yeast relay is played by Ypd1; Sln1 is the
      hybrid kinase that donates the phosphate and has no HPt domain. The Ault et al. data show Sln1 receiver-to-Ypd1
      phosphotransfer, i.e. the Sln1 side of the reaction. However, this term is applied to hybrid kinases
      as well as HPt proteins across GO (SGD Sln1, EcoliWiki BarA, TAIR AHK1, and the PAINT PTHR43047
      node), so this is a community convention rather than an isolated error, and the experimental evidence
      is sound. Kept as non-core; the core Sln1 activity is GO:0000155. Whether hybrid kinases should
      carry GO:0009927 is raised as a question.
    supported_by:
    - reference_id: PMID:12455952
      supporting_text: The Sln1p aspartyl phosphate is then transferred to Ypd1p, which in turn transfers
        the phosphoryl group to a conserved aspartate on one of two response regulators, Ssk1p and Skn7p.
    - reference_id: file:yeast/SLN1/SLN1-deep-research-falcon.md
      supporting_text: Direct transfer from Sln1-His576 to Ypd1 is not supported—the intervening Sln1-Asp1144
        step is required
