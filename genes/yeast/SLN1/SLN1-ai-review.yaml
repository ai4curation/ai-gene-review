suggested_questions:
- question: GO:0009927 histidine phosphotransfer kinase activity is now defined as the phospho-His intermediate
    (HPt) role between a hybrid kinase and a response regulator, which in yeast is Ypd1. Should hybrid
    kinases such as Sln1 (and BarA, AHK1, and the PAINT PTHR43047 node) continue to carry it, or should
    the Sln1 receiver-to-Ypd1 phosphotransfer be represented only by GO:0000155 and has_input Ypd1 in
    a GO-CAM?
- question: What physical variable does Sln1 sense (turgor, membrane tension, plasma membrane-cell wall
    contact), and how is the signal transmitted from the periplasmic domain and TMD1 to the HAMP/transmitter?
- question: Should the Sln1-Ypd1-Skn7 branch (hypo-osmotic/cell-wall transcription, e.g. OCH1) be represented
    for Sln1, or only for Ypd1 and Skn7?
suggested_experiments:
- description: Reconstitute full-length Sln1 in proteoliposomes or nanodiscs and measure His576 autophosphorylation
    and phosphotransfer to Ypd1 as a function of membrane tension/osmotic gradient, to establish whether
    the sensing mechanism is intrinsic to Sln1.
- description: Cryo-EM structure of full-length dimeric Sln1 in active (low osmolarity) and inactive states
    to define the conformational change linking the extracellular domain to the kinase.
