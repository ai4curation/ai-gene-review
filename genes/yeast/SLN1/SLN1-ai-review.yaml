gene_symbol: SLN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Sln1 (YIL147C) is the plasma membrane hybrid sensor histidine kinase that acts as the osmosensor/turgor
  sensor of the SLN1 branch of the high-osmolarity glycerol (HOG) pathway in Saccharomyces cerevisiae.
  It spans the membrane twice, with an extracellular domain between the two transmembrane helices that
  promotes dimerization and activity, and a cytoplasmic HAMP region, HisKA/HATPase transmitter and C-terminal
  CheY-like receiver domain. At normal osmolarity Sln1 is active: it autophosphorylates His576 using ATP,
  transfers the phosphoryl group to its own receiver Asp1144, and from there to His64 of the histidine
  phosphotransfer protein Ypd1, which phosphorylates the response regulators Ssk1 (Asp554) and Skn7 (Asp427).
  Phosphorylated Ssk1 cannot activate the MAPKKKs Ssk2/Ssk22, so the Pbs2-Hog1 MAPK cascade is kept off.
  Hyperosmotic stress, or any reduction of turgor, inactivates Sln1; Ssk1 then becomes dephosphorylated
  and activates Ssk2/Ssk22, Pbs2 and Hog1. Via Ypd1 and the nuclear transcription factor Skn7, Sln1 also
  controls transcription of cell-wall-related genes such as OCH1, which increases under hypo-osmotic conditions.
  Loss of SLN1 is lethal because of constitutive HOG pathway activation.'
