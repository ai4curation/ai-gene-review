core_functions:
- description: Plasma membrane hybrid sensor histidine kinase that, at normal turgor, autophosphorylates
    His576 and relays the phosphate through its receiver Asp1144 to Ypd1, keeping Ssk1 phosphorelay-inhibited
    and the Ssk2/Ssk22-Pbs2-Hog1 cascade off; hyperosmotic stress or loss of turgor inactivates the kinase,
    releasing HOG signaling.
  molecular_function:
    id: GO:0000155
    label: phosphorelay sensor kinase activity
  directly_involved_in:
  - id: GO:0007234
    label: osmosensory signaling via phosphorelay pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8808622
    supporting_text: This phosphorelay system is initiated by the autophosphorylation of Sln1p at His576.
  - reference_id: PMID:12455952
    supporting_text: Sln1R is an obligate intermediate in the phosphorelay reaction between Sln1p and
      Ypd1p
  - reference_id: PMID:12821642
    supporting_text: Loss of turgor inactivates the Sln1 histidine kinase activity, leading to subsequent
      phosphorylation and activation of the HOG MAPK pathway.
- description: 'Transmembrane osmosensor: its extracellular/periplasmic domain and first transmembrane
