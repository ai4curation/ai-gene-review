- term:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: ATP-dependent protein folding chaperone is the most informative MF annotation for CCT8-containing CCT/TRiC.
    action: ACCEPT
    reason: CCT/TRiC is an ATP-dependent folding machine, and CCT8 is a core subunit of that complex.
    supported_by:
    - reference_id: PMID:16762366
      supporting_text: The eukaryotic cytosolic chaperonin CCT is an essential ATP-dependent protein folding machine.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11805837
  review:
    summary: >-
      The large-scale mass-spectrometry study supports CCT/TRiC context but not
      a distinct Cct8 protein-binding function.
    action: REMOVE
    reason: >-
      This large-scale mass-spectrometry study is useful evidence for CCT/TRiC
      complex membership, but it does not define a distinct generic
      protein-binding function beyond the established chaperonin activity.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16554755
  review:
    summary: >-
      The affinity-purification complex map supports CCT membership but not a
      standalone generic binding activity.
    action: REMOVE
    reason: >-
      This affinity-purification complex map supports CCT complex membership,
      but the specific curated functions are CCT/TRiC membership and
      ATP-dependent chaperonin-mediated folding rather than generic protein
      binding.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19536198
  review:
    summary: >-
      The TAP-tag chaperone atlas supports CCT/TRiC contacts but GO:0005515 is
      not an informative Cct8 molecular-function assertion.
    action: REMOVE
    reason: PMID:19536198 reports broad TAP-tag chaperone interactions that are often indirect; the more precise function is CCT/TRiC chaperonin activity.
    supported_by:
    - reference_id: PMID:19536198
      supporting_text: The interactions presented are indirect TAP-tag based interactions and not direct binary interactions.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21734642
  review:
    summary: >-
      The SAGA/ADA perturbation network is peripheral to core CCT8 biology and
      does not define a specific Cct8 binding activity.
    action: REMOVE
    reason: >-
      This network analysis of SAGA and ADA perturbations is peripheral to
      CCT8's core chaperonin role and does not define a specific CCT8 binding
      activity; retaining only the CCT/TRiC chaperone annotations is more
      informative.
