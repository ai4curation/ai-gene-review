  label: Saccharomyces cerevisiae
description: CCT8 encodes the theta subunit of the cytosolic chaperonin-containing
  T-complex (CCT/TRiC). CCT/TRiC is an ATP-dependent hetero-oligomeric chaperonin
  formed from eight related subunits in each ring. The assembled complex folds actin,
  tubulin, and other cytosolic proteins.
