- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  retired: true
  review:
    summary: GO:0051082 is formally obsolete; Cct8 contributes to the CCT/TRiC complex's
      ATP-dependent protein-folding chaperone activity.
    action: MODIFY
    reason: GO:0051082 "unfolded protein binding" is obsolete with GO:0044183 protein
      folding chaperone and GO:0140309 unfolded protein holdase activity as consider
      terms. For Cct8, the evidence supports the GO:0140662 ATP-dependent protein
      folding chaperone activity of the CCT/TRiC complex; because Cct8 is one subunit
      of that complex, any final GOA replacement with GO:0140662 should use the contributes_to
      qualifier. This obsolete 2020 IBA is expected to lapse unless PAINT reasserts
      a molecular-function IBD; GO:0140662 is the appropriate non-obsolete replacement
      only if GOA retains a CCT8 molecular-function row derived from this source.
    proposed_replacement_terms:
    - id: GO:0140662
      label: ATP-dependent protein folding chaperone
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
