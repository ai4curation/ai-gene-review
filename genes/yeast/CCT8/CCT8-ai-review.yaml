  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: CCT8 is a CCT/TRiC subunit and supports the protein-folding activity
      of the assembled chaperonin.
    action: ACCEPT
    reason: Yeast CCT catalyzes actin folding, and PTHR11353 places CCT8 in the conserved
      chaperonin family.
    supported_by:
    - reference_id: PMID:16762366
