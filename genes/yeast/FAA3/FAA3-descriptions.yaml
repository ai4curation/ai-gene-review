gene_symbol: FAA3
organism: yeast
uniprot_id: P39002
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Activates endogenous long-chain fatty acids (LCFA) by esterification of the
    fatty acids into metabolically active CoA- thioesters for subsequent degradation
    or incorporation into phospholipids (PubMed:8206942). Acts preferentially on C16
    and C18 fatty acids with a cis-double bond at C-9-C-10 (PubMed:8206942).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39002
  source_id: P39002
- source: Alliance_Imported
  text: Long chain fatty acyl-CoA synthetase; activates imported fatty acids with
    a preference for C16:0-C18:0 chain lengths; green fluorescent protein (GFP)-fusion
    protein localizes to the cell periphery
  source_type: curated
  url: https://www.yeastgenome.org/locus/FAA3
  source_id: SGD:S000001271
- source: Alliance_Automated
  text: Enables long-chain fatty acid-CoA ligase activity and very long-chain fatty
    acid-CoA ligase activity. Involved in long-chain fatty acid metabolic process.
    Located in plasma membrane. Human ortholog(s) of this gene implicated in asthma;
    breast cancer; cardiac arrest; intellectual disability (multiple); and prostate
    cancer. Orthologous to several human genes including ACSL4 (acyl-CoA synthetase
    long chain family member 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FAA3
  source_id: SGD:S000001271
