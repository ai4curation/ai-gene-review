id: P39002
gene_symbol: FAA3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FAA3 (YIL009W) encodes a long-chain fatty acyl-CoA synthetase (ATP-dependent AMP-binding enzyme family,
  EC 6.2.1.3) of Saccharomyces cerevisiae. Purified Faa3p prefers C16 and C18 fatty acids with a cis-double bond
  at C9-C10 (palmitoleate, oleate), and its activity toward saturated substrates such as myristate is about two
  orders of magnitude lower than that of Faa1p or Faa2p. GFP-tagged Faa3p localises to the cell periphery/plasma
  membrane, and Faa3p has been reported to interact with the protein kinase Frk1p. Unlike Faa1p and Faa4p, Faa3p
  has no demonstrated major role in uptake of exogenous fatty acids, and no specific role in peroxisomal beta-oxidation;
  its physiological function remains poorly defined.
