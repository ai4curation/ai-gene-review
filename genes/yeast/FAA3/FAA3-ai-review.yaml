suggested_questions:
- question: What is the in vivo role of Faa3p, given its low activity relative to Faa1p/Faa4p? Does it act on a
    specific pool (e.g. unsaturated fatty acids at the plasma membrane) or under specific conditions (hypoxia, sporulation)?
- question: Does YeastPathways have any yeast evidence for attaching Faa3p to the fatty acid oxidation pathway?
suggested_experiments:
- hypothesis: Faa3p contributes to activation of exogenous unsaturated fatty acids when Faa1p and Faa4p are absent.
  description: Measure oleate and palmitoleate uptake and oleoyl-CoA formation in faa1 faa4 versus faa1 faa3 faa4
    strains under cerulenin or hypoxic conditions, and overexpress FAA3 in faa1 faa4 to test rescue.
