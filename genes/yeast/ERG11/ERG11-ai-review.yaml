id: P10614
gene_symbol: ERG11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG11 (YHR007C) encodes lanosterol 14alpha-demethylase (CYP51, EC 1.14.14.154), a heme-thiolate cytochrome
  P450 anchored in the ER membrane by an N-terminal transmembrane helix. Using three successive O2/NADPH-cytochrome
  P450 reductase-dependent oxidations of the C-32 methyl group (alcohol, aldehyde, then formate release), it converts
  lanosterol to 4,4-dimethyl-5alpha-cholesta-8,14,24-trien-3beta-ol, the first step in the conversion of lanosterol
  to zymosterol and a rate-limiting step of ergosterol synthesis. Erg11 also accepts eburicol. It is essential under
  aerobic conditions (erg11 lethality is bypassed by erg3 loss), is the target of azole antifungals, which coordinate
  the heme iron, and is induced by heme and by oxygen limitation.
