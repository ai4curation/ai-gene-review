suggested_questions:
- question: Do the early (Karst and Lacroute 1977) erg11 alleles described as squalene synthetase-deficient map
    to the YHR007C/CYP51 locus, and if not should the IMP annotation from PMID:200835 be re-attributed?
- question: Does Erg11 association with Erg25/Erg27/Erg28 (the proposed ergosome core) channel the 14-demethylated
    product to Erg24 in vivo?
