- source: Alliance_Imported
  text: Lanosterol 14-alpha-demethylase; catalyzes C-14 demethylation of lanosterol
    to form 4,4''-dimethyl cholesta-8,14,24-triene-3-beta-ol in ergosterol biosynthesis
    pathway; transcriptionally down-regulated when ergosterol is in excess; member
    of cytochrome P450 family; associated and coordinately regulated with the P450
    reductase Ncp1p; human CYP51A1 functionally complements the lethality of the erg11
    null mutation
