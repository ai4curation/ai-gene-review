suggested_questions:
- question: Is Nth2 regulated by PKA phosphorylation and 14-3-3 (Bmh1/2) binding as Nth1 is, and does
    it require calcium for activity?
- question: Under which conditions (heat-shock recovery, stationary phase, specific carbon sources) does
    Nth2 make a measurable contribution relative to Nth1?
- question: Is the reported mitochondrial GFP signal for Nth2 reproducible, and if so does it have any
    functional significance?
suggested_experiments:
- description: Purify recombinant Nth2 and measure trehalase kinetics, Ca2+ dependence and PKA/Bmh-dependent
    activation in parallel with Nth1.
  experiment_type: biochemistry
