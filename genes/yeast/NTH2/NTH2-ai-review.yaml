description: NTH2 (YBR001C) encodes a neutral (cytosolic-type) alpha,alpha-trehalase of glycoside hydrolase
  family 37, a paralog of the main neutral trehalase NTH1 that arose from the whole-genome duplication.
  Nth2 hydrolyses the disaccharide trehalose to two glucose molecules and contributes, with Nth1, to mobilisation
  of intracellular trehalose; its contribution is minor compared with Nth1. The protein retains the GH37
  catalytic residues and the N-terminal calcium-binding region characteristic of fungal neutral trehalases.
  Trehalose breakdown by the neutral trehalases releases glucose from the stress-protective and reserve
  trehalose pool, whereas extracellular trehalose is hydrolysed by the acid trehalase Ath1.
