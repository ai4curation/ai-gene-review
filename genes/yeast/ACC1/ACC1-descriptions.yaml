gene_symbol: ACC1
organism: yeast
uniprot_id: Q00955
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: 'Carries out three functions: biotin carboxyl carrier protein, biotin carboxylase
    and carboxyltransferase. Involved in the synthesis of very-long-chain fatty acid
    synthesis which is required to maintain a functional nuclear envelope. Required
    for acylation and vacuolar membrane association of VAC8 which is necessary to
    maintain a normal morphology of the vacuole.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q00955
  source_id: Q00955
- source: Alliance_Imported
  text: Acetyl-CoA carboxylase, biotin containing enzyme; catalyzes carboxylation
    of cytosolic acetyl-CoA to form malonyl-CoA and regulates histone acetylation
    by regulating the availability of acetyl-CoA; rate-limiting step for de novo biosynthesis
    of long-chain fatty acids; translational regulation in response to nutrients and
    cell cycle stage depends on its upstream ORF; ACC1 has a paralog, HFA1, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ACC1
  source_id: SGD:S000005299
- source: Alliance_Automated
  text: Enables several functions, including acetyl-CoA binding activity; acetyl-CoA
    carboxylase activity; and biotin carboxylase activity. Involved in acetyl-CoA
    biosynthetic process; long-chain fatty acid biosynthetic process; and protein
    import into nucleus. Located in endoplasmic reticulum membrane. Part of acetyl-CoA
    carboxylase complex. Human ortholog(s) of this gene implicated in lipid metabolism
    disorder. Orthologous to human ACACA (acetyl-CoA carboxylase alpha) and ACACB
    (acetyl-CoA carboxylase beta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ACC1
  source_id: SGD:S000005299
