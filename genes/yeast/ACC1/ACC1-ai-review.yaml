id: Q00955
gene_symbol: ACC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ACC1 (FAS3/MTR7, YNR016C) encodes the cytosolic acetyl-CoA carboxylase of S. cerevisiae,
  a ~250 kDa biotin-dependent enzyme that carries biotin carboxylase, biotin carboxyl carrier and carboxyltransferase
  domains on a single polypeptide and functions as a homodimer. It catalyses the ATP-dependent carboxylation
  of acetyl-CoA to malonyl-CoA (EC 6.4.1.2), the committed and rate-limiting step of cytosolic de novo
  fatty acid synthesis by the FAS1/FAS2 fatty acid synthase, and also supplies malonyl-CoA for ER-bound
  very-long-chain fatty acid elongation. Acc1 is essential even with fatty acid supplementation, reflecting
  its requirement for very-long-chain fatty acids needed for nuclear envelope integrity. It is soluble
  in the cytosol and peripherally associated with the cytosolic face of the (nuclear) ER membrane. ACC1
  expression is co-regulated with phospholipid synthesis by Ino2/Ino4/Opi1, and the enzyme is inhibited
  by phosphorylation and by soraphen A. Its paralog HFA1 encodes the mitochondrial isoform.
