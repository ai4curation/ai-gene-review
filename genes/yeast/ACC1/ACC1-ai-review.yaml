suggested_questions:
- question: Is the essential, fatty-acid-irremediable requirement for Acc1 fully explained by malonyl-CoA
    supply to the ER elongases (VLCFA for sphingolipids), or does Acc1 have an additional non-catalytic
    role at the nuclear envelope?
- question: Does Acc1 contribute any malonyl-CoA to mitochondria, or is the mitochondrial pool supplied
    exclusively by Hfa1?
suggested_experiments:
- description: Rescue of acc1 null lethality by targeted expression of a malonyl-CoA synthetase or by
    VLCFA/sphingolipid supplementation, to separate VLCFA supply from any non-catalytic role.
