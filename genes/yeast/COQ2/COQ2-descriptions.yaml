gene_symbol: COQ2
organism: yeast
uniprot_id: P32378
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the prenylation of para-hydroxybenzoate (PHB) with an all-trans
    polyprenyl group. Mediates the second step in the final reaction sequence of coenzyme
    Q (CoQ) biosynthesis, which is the condensation of the polyisoprenoid side chain
    with PHB, generating the first membrane-bound Q intermediate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32378
  source_id: P32378
- source: Alliance_Imported
  text: Para hydroxybenzoate polyprenyl transferase; catalyzes the second step in
    ubiquinone (coenzyme Q) biosynthesis; human COQ2, mutations in which are implicated
    in an increased risk of mutiple-system atrophy, can complement a yeast coq2 null
    mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/COQ2
  source_id: SGD:S000005324
- source: Alliance_Automated
  text: Enables 4-hydroxybenzoate polyprenyltransferase activity. Involved in ubiquinone
    biosynthetic process. Located in mitochondrial inner membrane. Used to study coenzyme
    Q10 deficiency disease; multiple system atrophy; and primary coenzyme Q10 deficiency
    1. Human ortholog(s) of this gene implicated in multiple system atrophy and primary
    coenzyme Q10 deficiency 1. Orthologous to human COQ2 (coenzyme Q2, polyprenyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/COQ2
  source_id: SGD:S000005324
fetch_date: '2026-11-01'
