suggested_questions:
- question: Does Coq2p physically associate with the peripheral CoQ synthome (Coq3-Coq9) at ER-mitochondria contact
    sites, or does it act separately and hand off its product?
- question: How does Coq2p discriminate between 4-hydroxybenzoate and 4-aminobenzoate as prenyl acceptors in vivo?
suggested_experiments:
- hypothesis: Coq2p is spatially coupled to the CoQ synthome
  description: Use proximity labelling (APEX/BioID) of Coq2p in mitochondria from wild-type and coq null strains,
    combined with super-resolution imaging of tagged Coq2p relative to Coq9-marked CoQ domains.
  experiment_type: proximity labelling / imaging
