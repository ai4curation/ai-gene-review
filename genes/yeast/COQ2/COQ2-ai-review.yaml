id: P32378
gene_symbol: COQ2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'COQ2 encodes 4-hydroxybenzoate polyprenyltransferase (PHB:polyprenyltransferase, EC 2.5.1.39), a UbiA-family
  enzyme. Using Mg2+ and an aspartate-rich polyprenyl diphosphate-binding motif, it condenses all-trans-hexaprenyl
  diphosphate (made by Coq1p) with 4-hydroxybenzoate to form 3-hexaprenyl-4-hydroxybenzoate, the first membrane-bound
  intermediate of coenzyme Q6 biosynthesis. The 372-residue precursor has an N-terminal mitochondrial leader and
  multiple transmembrane segments. Mature Coq2p is an integral protein of the mitochondrial inner membrane with
  its catalytic face toward the matrix, and it reaches the inner membrane through the small TIM chaperones of the
  intermembrane space. The enzyme accepts prenyl chains of various lengths: yeast COQ2 complements an E. coli ubiA
  mutant and supports Q8 synthesis there. coq2 null mutants lack PHB:polyprenyltransferase activity and CoQ6, are
  respiratory-deficient, and show reduced steady-state levels of other Coq polypeptides, consistent with a multi-subunit
  CoQ biosynthetic machinery.'
