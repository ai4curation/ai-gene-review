  review:
    summary: >-
      Mcr1 can use NADH to reduce the Dph3 electron carrier in vitro, but the
      cited study identifies Cbr1 as the major physiological Dph3 reductase and
      describes Mcr1 as a slower auxiliary reductase in that assay.
    action: KEEP_AS_NON_CORE
    reason: >-
      The broad NADH dehydrogenase term is compatible with an NADH-dependent
      flavoprotein reductase and is directly supported by the recombinant Mcr1
      assay in PMID:27694803. It should be kept as a non-core annotation because
      the assayed Dph3-reductase activity is secondary to Mcr1's established
      NADH-cytochrome-b5 reductase activity, and the paper itself concluded that
      Cbr1 is the major physiological reductase for Dph3-dependent tRNA wobble
      uridine modification.
    supported_by:
