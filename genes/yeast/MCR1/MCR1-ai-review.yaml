    action: KEEP_AS_NON_CORE
    reason: >-
      CYP51-mediated sterol 14-demethylation is a catalytic step in ergosterol
      biosynthesis, and PMID:10622712 showed that the fungal reaction can be
      driven by cytochrome b5 plus NADH cytochrome-b5 reductase. SGD's
      experimental MCR1 row is retained, but the cached abstract frames this as
      a microsomal electron-transfer system and does not establish that Mcr1,
      rather than the ER-localized paralog Cbr1, is the physiological CYP51
      reductase in vivo.
    supported_by:
