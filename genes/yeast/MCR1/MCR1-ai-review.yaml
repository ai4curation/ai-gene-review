  original_reference_id: PMID:10622712
  qualifier: involved_in
  review:
    summary: >-
      The cytochrome-b5/NADH cytochrome-b5 reductase electron-transfer system
      can support the fungal CYP51 sterol 14-demethylation reaction in vitro.
      This supports retention of the SGD row, but the experiment does not
      resolve whether mitochondrial Mcr1 or ER Cbr1 supplies CYP51 electrons in
