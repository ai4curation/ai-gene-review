- id: PMID:8001120
  title: Incomplete arrest in the outer membrane sorts NADH-cytochrome b5 reductase
    to two different submitochondrial compartments.
  findings:
  - statement: >-
      S. cerevisiae MCR1 encodes mitochondrial NADH-cytochrome b5 reductase
      isoforms partitioned between the outer membrane and intermembrane space.
    supporting_text: >-
      The S. cerevisiae gene MCR1 encodes two mitochondrial isoforms of
      NADH-cytochrome b5 reductase.
    reference_section_type: ABSTRACT
  - statement: >-
      Mcr1 uses incomplete outer-membrane translocation arrest to produce an
      outer-face p34 form and an intermembrane-space p32 form.
    supporting_text: >-
      This precursor protein is inserted into the outer membrane, but only
      about one-third of the molecules become firmly anchored to the outer face
      of that membrane.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; directly establishes Mcr1's identity as a
      mitochondrial NADH-cytochrome b5 reductase and explains its dual
      submitochondrial localization.
- id: file:yeast/MCR1/MCR1-deep-research-sgd.md
  title: SGD gene description for MCR1 (yeast)
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: The mitochondrial NADH-cytochrome b5 reductase identity agrees with the
      literature cited in this review. "Involved in ergosterol biosynthesis" rests on Lamb et al.
      1999 (PMID:10622712), which showed in vitro that purified cytochrome b5 and NADH
      cytochrome b5 reductase can support CYP51 sterol 14alpha-demethylation. The cached
      abstract does not show which yeast reductase supplies CYP51 in vivo; the ER paralog Cbr1
      is the more plausible partner of the ER enzyme. The claim could be neither confirmed nor
      refuted, so no defect is recorded and the review keeps the ergosterol rows as non-core.
suggested_questions:
- question: >-
    Does Mcr1 supply electrons to CYP51 in vivo, or is the ER-localized paralog
    Cbr1 the physiological reductase for sterol 14-demethylation in budding
    yeast?
- question: >-
    Which physiological cytochrome-b5-dependent reactions are fed by the
    outer-membrane p34 form versus the soluble intermembrane-space p32 form of
    Mcr1?
- question: >-
    Does Mcr1 reduce Dph3 in vivo only under high electron demand or Cbr1
    limitation, or does the in vitro Dph3 activity remain physiologically
    marginal in all normal contexts?
suggested_experiments:
- description: >-
    Build separation-of-localization Mcr1 variants that force the reductase to
    the mitochondrial outer membrane or intermembrane space, then measure
    ergosterol intermediates, D-erythroascorbyl-radical reduction, and
    Dph3-dependent mcm5s2U/diphthamide readouts.
