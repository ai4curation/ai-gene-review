id: P36060
gene_symbol: MCR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Mcr1 is the Saccharomyces cerevisiae mitochondrial NADH-cytochrome b5
  reductase. A single MCR1 translation product is split into p34 and p32 forms:
  the p34 form arrests in and anchors at the mitochondrial outer membrane, while
  the p32 form is processed by the inner-membrane protease and released into the
  mitochondrial intermembrane space. The enzyme reduces cytochrome b5 from NADH
  and contributes to the D-erythroascorbate antioxidant system, but its in vivo
  relationship to ER-localized sterol 14-demethylation is unresolved because
  budding yeast also carries the microsomal paralog Cbr1. Mcr1 can weakly
  reduce the Dph3 electron carrier in vitro.
core_functions:
- description: >-
    NADH-dependent reduction of ferricytochrome b5 by the Mcr1 flavoprotein
    reductase in the mitochondrial outer membrane and intermembrane space.
  molecular_function:
    id: GO:0090524
    label: cytochrome-b5 reductase activity, acting on NADH
  locations:
