descriptions:
- source: UniProt
  text: The outer membrane form may mediate the reduction of outer membrane cytochrome
    b5 (PubMed:8001120). The soluble inter-membrane space form may transfer electrons
    from external NADH to cytochrome c, thereby mediating an antimycin-insensitive,
    energy-coupled oxidation of external NADH by yeast mitochondria (PubMed:8001120).
    Involved in the reduction of D-erythroascorbyl free radicals (PubMed:11420140).
    May play a minor role in complementing the function of CBR1 as a DPH3 reductase
    in the first step of diphthamide biosynthesis and tRNA Wobble base mcm5s 2U (5-methoxycarbonylmethyl-2-thiouridine)
    formation (PubMed:27694803).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36060
  source_id: P36060
- source: Alliance_Imported
  text: Mitochondrial NADH-cytochrome b5 reductase; involved in ergosterol biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/MCR1
  source_id: SGD:S000001633
- source: Alliance_Automated
  text: Enables NADH dehydrogenase activity and cytochrome-b5 reductase activity,
    acting on NAD(P)H. Involved in cellular response to oxidative stress and ergosterol
    biosynthetic process. Located in mitochondrial intermembrane space and mitochondrial
    outer membrane. Orthologous to human CYB5RL (cytochrome b5 reductase like).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MCR1
  source_id: SGD:S000001633
