  text: Enables 2-(3-amino-3-carboxypropyl)histidine synthase activity; NADH dehydrogenase
    activity; and cytochrome-b5 reductase activity, acting on NADH. Involved in protein
    histidyl modification to diphthamide and tRNA wobble base 5-methoxycarbonylmethyl-2-thiouridinylation.
    Located in mitochondrial outer membrane and nucleus. Human ortholog(s) of this
    gene implicated in breast cancer and methemoglobinemia. Orthologous to human CYB5R1
    (cytochrome b5 reductase 1); CYB5R2 (cytochrome b5 reductase 2); and CYB5R3 (cytochrome
    b5 reductase 3).
