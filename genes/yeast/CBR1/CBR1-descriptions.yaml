descriptions:
- source: UniProt
  text: NADH-dependent reductase for KTI11/DPH3 and cytochrome b5 (PubMed:10622712,
    PubMed:14930, PubMed:27694803, PubMed:31463593, PubMed:34154323). Required for
    the first step of diphthamide biosynthesis, a post-translational modification
    of histidine which occurs in elongation factor 2 (PubMed:27694803, PubMed:31463593,
    PubMed:34154323). DPH1 and DPH2 transfer a 3-amino-3-carboxypropyl (ACP) group
    from S-adenosyl-L-methionine (SAM) to a histidine residue, the reaction is assisted
    by a reduction system comprising KTI11/DPH3 and a NADH-dependent reductase, predominantly
    CBR1 (PubMed:31463593, PubMed:34154323). By reducing KTI11/DPH3, also involved
    in the formation of the tRNA wobble base modification mcm5s 2U (5- methoxycarbonylmethyl-2-thiouridine),
    mediated by the elongator complex (PubMed:27694803). The cytochrome b5/NADH cytochrome
    b5 reductase electron transfer system supports the catalytic activity of several
    sterol biosynthetic enzymes (PubMed:10622712). Plays a role in bud morphology
    (PubMed:17895367).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38626
  source_id: P38626
- source: Alliance_Imported
  text: Cytochrome b reductase and NADH-dependent reductase for Dph3p; required for
    diphthamide synthesis and tRNA wobble uridine modification; also detected in mitochondria;
    mutation in conserved NADH binding domain of the human ortholog results in type
    I methemoglobinemia
  source_type: curated
  url: https://www.yeastgenome.org/locus/CBR1
  source_id: SGD:S000001305
- source: Alliance_Automated
  text: Enables 2-(3-amino-3-carboxypropyl)histidine synthase activity; NADH dehydrogenase
    activity; and cytochrome-b5 reductase activity, acting on NADH. Involved in protein
    histidyl modification to diphthamide and tRNA wobble base 5-methoxycarbonylmethyl-2-thiouridinylation.
    Located in mitochondrial outer membrane and nucleus. Human ortholog(s) of this
    gene implicated in breast cancer and methemoglobinemia. Orthologous to human CYB5R1
    (cytochrome b5 reductase 1); CYB5R2 (cytochrome b5 reductase 2); and CYB5R3 (cytochrome
    b5 reductase 3).
  source_type: automated
