- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:26928762
  qualifier: located_in
  review:
    summary: >-
      The N-terminal SWAT-GFP nucleus call likely overreports soluble/nuclear
      localization by placing GFP directly upstream of Cbr1's only
      transmembrane anchor.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The SWAT-GFP paper created an N-terminally tagged endomembrane-focused
      library and assigned subcellular localizations at high throughput. Cbr1
      is a single-pass membrane protein whose only transmembrane helix is at
      residues 7-27, so an N-terminal GFP tag is placed directly upstream of
      the membrane anchor and could plausibly mask Cbr1's targeting
      determinant. This unreplicated nucleus call should therefore be treated as
      an over-annotation rather than as a core site for a membrane-anchored
      NADH-cytochrome-b5/Dph3 reductase.
    additional_reference_ids:
    - file:genes/yeast/CBR1/CBR1-uniprot.txt
    supported_by:
    - reference_id: PMID:26928762
      supporting_text: >-
        To establish this strategy we constructed a library containing ~1,800
        strains where all proteins with known or predicted localization to the
        yeast endomembrane system are tagged with an amino terminal
    - reference_id: file:genes/yeast/CBR1/CBR1-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: "TRANSMEM        7..27"
