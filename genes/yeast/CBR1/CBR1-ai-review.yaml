proposed_new_terms:
- proposed_name: NADH-dependent Dph3 reductase activity
  proposed_definition: >-
    Catalysis of the reaction: 2 Fe(3+)-[Dph3] + NADH = 2 Fe(2+)-[Dph3] +
    NAD(+) + H(+).
  justification: >-
    RHEA:71231 captures the NADH-dependent reduction of Dph3, and
    PMID:27694803 shows that S. cerevisiae Cbr1 performs this reaction in the
    physiological reduction system for the Dph1-Dph2 and Elp3 radical-SAM
    enzymes. GO:0090560 describes the downstream 2-(3-amino-3-carboxypropyl)
    histidine synthase reaction catalyzed by Dph1-Dph2 rather than the Cbr1
    reductase step.
  proposed_parent:
    id: GO:0016651
    label: oxidoreductase activity, acting on NAD(P)H
  supported_by:
  - reference_id: PMID:27694803
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
suggested_questions:
- question: >-
    Should GO add an NADH-dependent Dph3 reductase molecular-function term for
    RHEA:71231 so CBR1-like reductases can be annotated to their direct input
    into Dph3-dependent radical-SAM systems rather than to the Dph1-Dph2
    synthase activity?
- question: >-
    Which membrane pool of S. cerevisiae Cbr1 supplies reduced Dph3 in vivo,
    and is Dph3 reduction spatially coupled to the ER, mitochondrial outer
    membrane, or both?
- question: >-
    Under which sterol-biosynthetic conditions does Cbr1 provide
    cytochrome-b5-dependent electrons to yeast cytochrome P450 enzymes in vivo,
    rather than acting primarily on Dph3?
suggested_experiments:
- description: >-
    Retarget Cbr1 selectively to the ER or mitochondrial outer membrane in a
    cbr1 deletion background and measure mcm5s2U formation, diphthamide
    formation under eEF2 overexpression, and Dph3 redox state to determine
    which membrane pool supplies physiological Dph3 reductase activity.
- description: >-
    Measure sterol intermediates and cytochrome P450-dependent sterol flux in
    cbr1, mcr1, and cbr1 mcr1 strains under respiratory, anaerobic, and
    NADPH-cytochrome P450 reductase-limiting conditions to test the in vivo
    contribution of Cbr1 to the fungal cytochrome-b5 electron-transfer system.
