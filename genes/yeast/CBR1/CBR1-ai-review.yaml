      identified that reductase as Cbr1. The annotation should therefore point
      Cbr1 to NADH-dependent Dph3 reductase activity, not the Dph1-Dph2
      ACP-transfer activity described by GO:0090560; Cbr1's contribution to
      that complex-level activity is preserved in the core function as
      contributes_to rather than discarded.
