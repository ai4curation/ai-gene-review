id: P38626
gene_symbol: CBR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Saccharomyces cerevisiae CBR1 encodes a single-pass membrane flavoprotein
  NADH-cytochrome b5 reductase with cytosolic-facing catalytic activity at
  microsomal and mitochondrial outer membranes. Cbr1 reduces ferricytochrome b5
  from NADH and is the major physiological NADH-dependent reductase for Dph3,
  supplying the reduced Dph3 electron/iron carrier that supports both
  Elp3-dependent mcm5s2U tRNA wobble uridine modification and the
  Dph1-Dph2-dependent first step of diphthamide biosynthesis.
core_functions:
- description: >-
    FAD-dependent reduction of ferricytochrome b5 by NADH, matching the
    microsomal EC 1.6.2.2 activity directly characterized for yeast Cbr1.
  molecular_function:
    id: GO:0090524
    label: cytochrome-b5 reductase activity, acting on NADH
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:14930
    supporting_text: >-
      The reductase required NADH as a specific electron donor, and could
      reduce some redox dyes as well as cytochrom b5.
  - reference_id: PMID:16407407
    supporting_text: >-
      We used a eukaryotic model organism, the yeast Saccharomyces cerevisiae,
      to determine the proteome of highly purified mitochondrial outer
      membranes.
- description: >-
    NADH-dependent reduction of Dph3; reduced Dph3 donates electrons and iron
    to radical-SAM systems for mcm5s2U tRNA wobble uridine formation and the
    first step of diphthamide biosynthesis.
  proposed_molecular_function: NADH-dependent Dph3 reductase activity
  directly_involved_in:
  - id: GO:0002926
    label: tRNA wobble base 5-methoxycarbonylmethyl-2-thiouridinylation
  - id: GO:0017183
    label: protein histidyl modification to diphthamide
  contributes_to_molecular_function:
    id: GO:0090560
    label: 2-(3-amino-3-carboxypropyl)histidine synthase activity
  in_complex:
    id: GO:0120513
    label: 2-(3-amino-3-carboxypropyl)histidine synthase complex
  supported_by:
  - reference_id: PMID:27694803
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
  - reference_id: PMID:34154323
    supporting_text: >-
      Under physiological conditions, the reduction of the [4Fe–4S] clusters in
      Dph1–Dph2 requires Dph3 and Cbr1.
  - reference_id: file:genes/yeast/CBR1/CBR1-uniprot.txt
    supporting_text: "KTI11/DPH3 and a NADH-dependent reductase, predominantly CBR1"
