    label: 2-(3-amino-3-carboxypropyl)histidine synthase activity
  evidence_type: IDA
  original_reference_id: PMID:24422557
  qualifier: enables
  review:
    summary: >-
      PMID:24422557 defines the Dph1-Dph2/Dph3 chemistry but predates discovery
      of Cbr1, and GO:0090560 names the downstream synthase rather than Cbr1's
      Dph3 reductase activity.
    action: MODIFY
    reason: >-
