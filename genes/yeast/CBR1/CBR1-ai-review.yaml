- term:
    id: GO:0090560
    label: 2-(3-amino-3-carboxypropyl)histidine synthase activity
  evidence_type: IDA
  original_reference_id: PMID:34154323
  qualifier: enables
  review:
    summary: >-
      The 2021 Dph1-Dph2/Dph3 study supports Cbr1 as a reducing-system
      component, but not as the ACP-transfer enzyme named by GO:0090560.
    action: MODIFY
    reason: >-
      GO:0090560 is the radical-SAM synthase activity of Dph1-Dph2. In this
      system Cbr1 uses NADH to reduce Dph3 upstream, and Dph3 then supplies
      iron and electrons needed by Dph1-Dph2. Cbr1 should be annotated to a
      Dph3 reductase term rather than as the enzyme directly attaching ACP to
      eEF2; Cbr1's membership in the broader reducing system is retained in the
      core function as a contributes_to relationship to GO:0090560.
    proposed_replacement_terms:
    - id: NTR
      label: NADH-dependent Dph3 reductase activity
    supported_by:
    - reference_id: PMID:34154323
      supporting_text: >-
        Under physiological conditions, the reduction of the [4Fe–4S] clusters
        in Dph1–Dph2 requires Dph3 and Cbr1.
