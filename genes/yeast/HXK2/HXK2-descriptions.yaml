gene_symbol: HXK2
organism: yeast
uniprot_id: P04807
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of hexose, such as D-glucose and D-fructose,
    to hexose 6-phosphate (D-glucose 6-phosphate and D- fructose 6-phosphate, respectively)
    (PubMed:332086). Mediates the initial step of glycolysis by catalyzing phosphorylation
    of D-glucose to D-glucose 6-phosphate (PubMed:332086).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P04807
  source_id: P04807
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct but generic, identical to the HXK1 entry; says nothing
      about glucose repression.
- source: Alliance_Imported
  text: Hexokinase isoenzyme 2; phosphorylates glucose in cytosol; predominant hexokinase
    during growth on glucose; represses expression of HXK1, GLK1, induces expression
    of its own gene; antiapoptotic; phosphorylation/dephosphorylation at Ser14 by
    kinase Snf1p, phosphatase Glc7p-Reg1p regulates nucleocytoplasmic shuttling of
    Hxk2p; functions downstream of Sit4p in control of cell cycle, mitochondrial function,
    oxidative stress resistance, chronological lifespan; has paralog HXK1
  source_type: curated
  url: https://www.yeastgenome.org/locus/HXK2
  source_id: SGD:S000003222
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Names glucose repression of HXK1/GLK1, Snf1 and Glc7-Reg1 control
      of Ser14 and nucleocytoplasmic shuttling, antiapoptotic and Sit4-related roles.
      The review says a direct nuclear regulatory role is contested and attributes
      dimer control to Ser15 (Tda1); Sit4 and Glc7-Reg1 are not covered.
- source: Alliance_Automated
  text: Enables hexokinase activity. Involved in several processes, including hexose
    import across plasma membrane; hexose metabolic process; and regulation of transcription
    by glucose. Located in cytosol and mitochondrial membrane. Is active in nucleus.
    Human ortholog(s) of this gene implicated in several diseases, including anemia
    (multiple); artery disease (multiple); glucose metabolism disease (multiple);
    hematologic cancer (multiple); and retinitis pigmentosa (multiple). Orthologous
    to several human genes including GCK (glucokinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HXK2
  source_id: SGD:S000003222
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Hexokinase activity is right; hexose import is rejected by the
      review and 'regulation of transcription by glucose' is left undecided. Long
      disease list.
findings:
- category: discrepancy
  text: SGD presents Hxk2 as a nuclear-shuttling repressor; the review cites live-cell
    imaging and RNA-seq showing negligible direct transcriptional activity and leaves
    the transcription annotation undecided.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- category: gap
  text: SGD's Sit4-dependent control of cell cycle, mitochondrial function and lifespan,
    and the Glc7-Reg1 dephosphorylation, are not covered in the review.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: Agreement on the main glucose hexokinase; sources disagree on whether
    Hxk2 is a direct nuclear regulator.
