suggested_questions:
- question: Is the SGD IDA for guanine catabolic process citing PMID:10542258 (p51-nedasin) a mis-attribution that
    should be re-pointed to PMID:15565584?
- question: What fraction of the xanthine produced by Gud1 is re-salvaged by Xpt1 versus excreted, and does Gud1
    induction after the diauxic shift measurably lower GTP/GMP pools?
suggested_experiments:
- hypothesis: Gud1 lowers guanylic nucleotide pools on entry into quiescence
  description: Measure GTP/GMP and xanthine pools and Xpt1-dependent XMP formation in wild-type, gud1 and gud1 xpt1
    cells across the diauxic shift.
  experiment_type: metabolomics / genetics
