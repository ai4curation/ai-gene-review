- term:
    id: GO:0043101
    label: purine-containing compound salvage
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-1
  review:
    summary: 'YeastPathways-to-GO-CAM row from PWY3O-1 (salvage pathways of purines and their nucleosides); the
      guanine deaminase reaction is drawn inside a purine salvage pathway, so the pathway-level BP ''purine-containing
      compound salvage'' is attached. Gud1 itself does not salvage anything: it converts guanine to xanthine, diverting
      guanine away from Hpt1-mediated GMP salvage. Because S. cerevisiae does not degrade xanthine further, the
      xanthine can be re-salvaged by Xpt1, so Gud1 sits at a branch point of guanine/xanthine interconversion within
      the salvage network rather than performing a salvage step.'
    action: KEEP_AS_NON_CORE
    reason: Pathway-context inheritance; Gud1 is a catabolic deaminase feeding xanthine into the salvage network,
      not a salvage enzyme itself.
    supported_by:
    - *id002
