taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'GUD1 (YDL238C) encodes guanine deaminase (guanase, EC 3.5.4.3), a soluble cytoplasmic member of the
  metallo-dependent amidohydrolase superfamily (ATZ/TRZ family) that hydrolytically deaminates guanine to xanthine
  and ammonia (Km about 60 uM). It is the only guanine deaminase in S. cerevisiae: it removes free guanine from
  the Hpt1-dependent GMP salvage route and converts it into xanthine, which this yeast cannot oxidise further but
  can re-salvage to XMP via Xpt1 or excrete. Gud1 activity rises during post-diauxic growth, consistent with a role
  in reducing the guanylic nucleotide pool when cells approach quiescence. Like its bacterial and mammalian homologues
  it is predicted to use a single active-site zinc ion.'
