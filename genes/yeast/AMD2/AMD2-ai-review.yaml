    title: Identification of a putative amidase gene in yeast Saccharomyces cerevisiae.
    findings: []
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified one-page genomic sequence note (Chang & Abelson, Nucleic
        Acids Res 1990). It reports the identification of the YDR242W/AMD2 open
        reading frame as a PUTATIVE amidase from sequence similarity only; no
        enzyme assay or in-vivo functional characterization is presented.
        Abstract-only in cache (full_text_available: false). Supports family
        assignment and the "putative/probable" framing, not a specific substrate.
  - id: UniProt:P22580
    title: AMD2 - Probable amidase - Saccharomyces cerevisiae
    findings: []
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        UniProtKB reviewed entry (AMDY_YEAST). Domain/family/active-site
        annotations (PF01425, IPR023631, PROSITE PS00571, ACT_SITE 132/209/233)
        and the EC 3.5.1.4 / Rhea:12020 catalytic activity are used here as the
        primary evidence for the generic amidase molecular function. Protein
        existence is level 3 (inferred from homology).
  - id: PMID:32024536
    title: Identification of a Yarrowia lipolytica acetamidase and its use as a yeast genetic marker.
    findings: []
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PMC full text verified. Not about AMD2 directly, but load-bearing for the
        substrate reasoning: S. cerevisiae strain S288C requires a heterologous
        acetamidase (A. nidulans amdS or Y. lipolytica YlAMD1) to grow on
        acetamide as a nitrogen source, and control transformants (relying only
        on the native genome, which includes AMD2) fail to grow on acetamide.
        This shows that native AMD2 is insufficient to confer acetamide
        utilization under those assay conditions; it does not by itself exclude
        weak, condition-dependent, or physiologically irrelevant hydrolysis of
        acetamide. Supports the "substrate unknown" MF knowledge gap.
  - id: PMID:14562095
    title: Global analysis of protein localization in budding yeast.
    findings:
      - statement: >-
          The associated genome-wide C-terminal GFP dataset classifies AMD2/YDR242W
          as mitochondrial, providing a high-throughput localization lead that is
          absent from the current GOA extract and requires independent confirmation.
        supporting_text: >-
          We classify these proteins, representing 75% of the yeast proteome, into 22 distinct subcellular localization categories
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed record and the associated YeastGFP localization table were checked.
        The gene-level mitochondrial call is high-throughput C-terminal-tag evidence,
        not an AMD2-focused validation; it is retained as a localization lead rather
        than promoted to a new GO annotation.
  - id: PMID:8824293
    title: Analysis of the carboxyl-terminal peroxisomal targeting signal 1 in a homologous context in Saccharomyces cerevisiae.
    findings:
      - statement: >-
          PTS1 recognition in S. cerevisiae accepts many noncanonical C-terminal
          tripeptides and depends on the surrounding protein context, making AMD2's
          terminal SKI sequence a testable peroxisomal-targeting hypothesis rather
          than a sufficient localization assignment.
        supporting_text: >-
          We observed efficient import of MDH3 into peroxisomes with a large variety of PTS1 tripeptides.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified primary study in S. cerevisiae. It establishes the relaxed,
        context-dependent PTS1 principle but does not test AMD2 or SKI specifically.
  - id: file:yeast/AMD2/AMD2-hypotheses/function-hypothesis-go-0004040/openscientist.md
    title: OpenScientist hypothesis report for AMD2 GO:0004040
    publication_type: DEEP_RESEARCH
    findings:
      - statement: >-
          The report supports retaining generic amidase activity as a homology-based
          prediction while withholding a substrate-specific child term.
        supporting_text: >-
          The correct curation action is retain, keep general, flag as homology-based,
          substrate experimentally undetermined
    reference_review:
      relevance: HIGH
      correctness: DISPUTED
      review_notes: >-
        The high-level retain-general conclusion agrees with the curated UniProt/domain
        evidence. However, the report assigns the catalytic residues to K176/S210/S238,
        whereas UniProt P22580 annotates Lys132/cisSer209/nucleophilic Ser233; it also
        overlooks the Huh mitochondrial localization dataset and published deletion
        phenotypes. Its AlphaFold and alignment numbers therefore are not used here.
existing_annotations:
  - term:
      id: GO:0004040
      label: amidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: >-
        Domain-defensible generic molecular function. AMD2 is a bona fide member
        of the amidase signature (AS) family (Pfam PF01425; InterPro IPR023631;
        PROSITE PS00571) and retains the conserved catalytic triad: Lys132,
        cisSer209 and nucleophilic Ser233 (all inferred by similarity). GO:0004040 corresponds exactly
        to the family/EC 3.5.1.4 reaction "a monocarboxylic acid amide + H2O =
        a monocarboxylate + NH4+", which is the generic parent activity. The
        annotation is appropriate AT THE GENERIC LEVEL; a specific-substrate
        amidase term would be over-annotation because the AS fold is
        substrate-promiscuous and no substrate has been determined for AMD2.
      action: ACCEPT
      reason: >-
        Correct family- and fold-supported molecular function at the generic
        level. This is the single defensible functional statement for this dark
        gene and is retained as its core function.
      additional_reference_ids:
        - file:yeast/AMD2/AMD2-hypotheses/function-hypothesis-go-0004040/openscientist.md
      supported_by:
        - reference_id: UniProt:P22580
