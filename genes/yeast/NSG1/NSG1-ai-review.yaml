core_functions:
- description: NSG1 acts as an INSIG-family transmembrane chaperone/regulator for
    Hmg2, binding the sterol-sensing-domain-containing transmembrane region of Hmg2
    and stabilizing it against Hrd1-dependent ERAD. This promotes appropriate Hmg2
    abundance within sterol biosynthetic pathway control without NSG1 itself catalyzing
    a sterol biosynthetic reaction.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0016126
    label: sterol biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  substrates:
  - id: SGD:S000004442
    label: HMG2
  supported_by:
  - reference_id: PMID:16270032
    supporting_text: We now show that the yeast INSIG homologs NSG1 and NSG2 function
      to control the stability of yeast Hmg2p, the HMGR isozyme that undergoes regulated
      ubiquitination. Yeast Nsgs inhibit degradation of Hmg2p in a highly specific
      manner, by directly interacting with the sterol-sensing domain (SSD)-containing
      transmembrane region.
    reference_section_type: ABSTRACT
proposed_new_terms:
- proposed_name: sterol-sensing domain protein chaperone activity
  proposed_definition: Binding to and stabilizing the transmembrane sterol-sensing
    domain of a client protein to promote correct folding or prevent ER-associated
    degradation.
  justification: NSG1/INSIG activity toward Hmg2 is more specific than generic unfolded
    protein binding or broad protein folding chaperone activity.
  proposed_parent:
    id: GO:0044183
    label: protein folding chaperone
  supported_by:
  - reference_id: PMID:16270032
    supporting_text: We now show that the yeast INSIG homologs NSG1 and NSG2 function
      to control the stability of yeast Hmg2p, the HMGR isozyme that undergoes regulated
      ubiquitination. Yeast Nsgs inhibit degradation of Hmg2p in a highly specific
      manner, by directly interacting with the sterol-sensing domain (SSD)-containing
      transmembrane region.
    reference_section_type: ABSTRACT
suggested_questions:
- question: How does glucose-starvation NVJ remodeling destabilize Nsg1 while stabilizing
    Nsg2?
- question: Which client-specific determinants make Nsg1 restrain Hmg1 under glucose
    starvation while stabilizing Hmg2 during glucose-replete sterol control?
suggested_experiments:
- hypothesis: NSG1 NVJ recruitment modulates Hmg1/Hmg2 stability or sterol storage
    during glucose limitation.
  description: Combine live-cell NSG1/Hmg1/Hmg2/NVJ marker imaging with reductase
    stability assays in glucose-replete and glucose-restricted cells, using NSG1 mutants
    that disrupt Hmg2 binding or NVJ enrichment.
  experiment_type: live-cell fluorescence microscopy with cycloheximide-chase protein
    stability assay
