id: P38837
gene_symbol: NSG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  NSG1 encodes an INSIG-family multi-pass endoplasmic reticulum membrane protein that binds the sterol-sensing-domain-containing
  Hmg2 HMG-CoA reductase and stabilizes it against Hrd1-dependent ER-associated degradation. Nsg1
  also acts at the nucleus-vacuole junction during glucose-starvation control of HMG-CoA reductases:
  glucose-starvation remodeling destabilizes Nsg1 and thereby activates Hmg1, while Nsg2 is stabilized
  and suppresses Hmg1 to fine-tune sterol synthesis.
