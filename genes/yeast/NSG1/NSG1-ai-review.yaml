  title: Role of Pex31 in metabolic adaptation of the nucleus-vacuole junction.
  findings:
  - statement: NSG1 was identified as a conditional nucleus-vacuole junction resident
      during glucose limitation, supporting the NVJ localization annotation as context-dependent.
    supporting_text: 'Here, we used systematic microscopy-based approaches to compare
      the NVJ at glucose-replete and -restricted conditions and identified five additional
      NVJ proteins: the permanent NVJ resident Shr5 and the conditional residents
      Nsg1, Nsg2, Tcb1 and Pex31.'
- id: PMID:42227952
  title: Glucose starvation signaling via nucleus-vacuole junction remodeling controls
    ergosterol synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified abstract-only cache. Establishes glucose-starvation
      recruitment of Nsg1/Nsg2 and Hmg1/Hmg2 to the nucleus-vacuole junction and reports
      the functional outcome of this remodeling: Nsg1 destabilization activates Hmg1,
      whereas Nsg2 stabilization suppresses Hmg1.'
  findings:
  - statement: Glucose starvation recruits Nsg1 and Nsg2 to the nucleus-vacuole junction
      together with Hmg1 and Hmg2, linking conditional INSIG-family localization to
      starvation-dependent sterol regulation.
    supporting_text: Here, we identify the aspartyl protease Ypf1 and the yeast INSIG
      homologs Nsg1 and Nsg2 as NVJ-localized proteins specifically recruited during
      GS. Ypf1 promotes the recruitment of Nsg1, Nsg2, and the HMG-CoA reductases
      Hmg1 and Hmg2 to the NVJ, likely in association with changes in nuclear membrane
      lipid composition caused by suppression of fatty acid elongases.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: 'Glucose-starvation NVJ remodeling has opposite effects on the two
      yeast INSIG homologs: it destabilizes Nsg1 to activate Hmg1 while stabilizing
      Nsg2 to suppress Hmg1, and loss of both proteins hyperactivates Hmg1 and accumulates
      squalene.'
    supporting_text: This remodeling destabilizes Nsg1, thereby activating Hmg1, while
      stabilizing Nsg2, which suppresses Hmg1 to fine-tune sterol synthesis. Loss
      of both Nsg1 and Nsg2 leads to hyperactivation of Hmg1 and accumulation of squalene,
      a sterol biosynthetic intermediate.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
