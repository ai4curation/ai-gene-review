suggested_questions:
- question: Has ketopantoate reductase activity ever been measured directly for Pan5, and does a pan5 deletion cause
    pantothenate auxotrophy or is it buffered by other NADPH-dependent reductases (as Ilv5-type enzymes do for E.
    coli panE)?
suggested_experiments:
- description: Assay recombinant Pan5 for NADPH-dependent ketopantoate reduction and test pan5 deletion strains
    for growth without pantothenate.
