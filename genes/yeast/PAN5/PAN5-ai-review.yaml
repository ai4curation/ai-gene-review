  label: Saccharomyces cerevisiae S288C
description: Pan5 (YHR063C) is the 2-dehydropantoate 2-reductase (ketopantoate reductase, KPR; EC 1.1.1.169) of
  Saccharomyces cerevisiae. It reduces 2-dehydropantoate (ketopantoate) to (R)-pantoate using NADPH, the second
  step of pantoate formation from 3-methyl-2-oxobutanoate after the hydroxymethyltransferase Ecm31. Pantoate is
  then condensed with beta-alanine by Pan6 to form pantothenate (vitamin B5), the precursor of coenzyme A. Pan5
  belongs to the ApbA/KPR family with an N-terminal Rossmann-fold NADP-binding domain and a C-terminal helical domain,
  and its activity is inferred from similarity to bacterial PanE. It is a cytoplasmic protein.
