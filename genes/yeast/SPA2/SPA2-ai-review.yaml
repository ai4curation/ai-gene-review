- id: file:yeast/SPA2/SPA2-deep-research-falcon.md
  title: 'Falcon (Edison) deep research synthesis: functional annotation of S. cerevisiae
    SPA2 (UniProt P23201)'
  findings:
  - statement: 'SPA2/YLL021W encodes Spa2, a polarisome scaffold protein that organizes

      polarized growth and mating projection formation rather than acting as an

      enzyme; it is a central scaffold coordinating recruitment of other polarisome

      components (Bni1, Bud6, Pea2).'
    supporting_text: Spa2 is a central scaffold that coordinates recruitment/organization
      of other polarisome components (commonly including Bni1, Bud6, Pea2) and thereby
      promotes focal polarization.
    reference_section_type: OTHER
  - statement: 'During pheromone response, Spa2 is required for focal (narrow) polarization

      of the polarisome at the shmoo tip via an ordered SHD-dependent pathway that

      forms a positive feedback loop.'
    supporting_text: Mechanistically, Lawson et al. (2022) provide evidence consistent
      with an ordered pathway in which an N-terminal Spa2 homology domain (SHD) recruits
      Msb3/4, promoting Sec4-dependent delivery of Bud6 to the polarisome, where Bud6
      stimulates the formin Bni1 to generate actin cables; actin-dependent delivery
      then supports additional Spa2 accumulation, completing a positive feedback loop
      that sharpens focal polarization.
    reference_section_type: OTHER
  - statement: 'Spa2 is recruited to the division site in late cell cycle and directly
      binds

      cytokinetic factors Cyk3 and Hof1, coordinating incorporation of the chitin

      synthase Chs2 into the cytokinetic machinery for primary septum formation.'
    supporting_text: Foltman et al. (2018) show Spa2 is recruited to the division
      site in late cell cycle and directly binds cytokinetic factors, including **Cyk3**
      and **Hof1**, via Spa2 N-terminal regions containing Spa2 homology domains.
    reference_section_type: OTHER
  - statement: 'Under glucose starvation Spa2 acts as a nucleotide-state-specific
      actin

      remodeler, nucleating ADP-actin via a dimeric core (aa 281-535) and bundling

      ADP-F-actin via an N-terminal IDR-driven condensation, relocalizing from the

      bud tip to filamentous structures overlapping actin cables.'
    supporting_text: Spa2 promotes rapid **ADP-actin monomer nucleation** via a dimeric
      core region (aa 281–535) and bundles ADP-F-actin through an N-terminal IDR-driven
      condensation (“wetting”) process, dependent on the actin D-loop.
    reference_section_type: OTHER
