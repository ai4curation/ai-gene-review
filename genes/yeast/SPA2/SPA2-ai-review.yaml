- id: PMID:29601579
  title: Cell polarity protein Spa2 coordinates Chs2 incorporation at the division
    site in budding yeast.
  findings:
  - statement: Budding-yeast Spa2 is recruited to the cleavage site where it cooperates
      with secretory vesicle and actomyosin-ring factors to promote Chs2 incorporation
      into ingression progression complexes.
    supporting_text: Our data indicate that Spa2 is recruited to the cleavage site
      to co-operate with the secretory vesicle system and particular actomyosin ring
      components to promote the incorporation of Chs2 into the so-called 'ingression
      progression complexes' during cytokinesis in budding yeast.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed- and PMC-verified 2018 full-text study showing a budding-yeast
      division-site role for Spa2 through Cyk3, Hof1, and Chs2; relevant as a counterpoint
      to the fission-yeast mitotic actomyosin contractile-ring IBA.
- id: PMID:31699995
  title: Polarisome scaffolder Spa2-mediated macromolecular condensation of Aip5 for
    actin polymerization.
  findings:
  - statement: Spa2 regulates the dynamics and reversibility of Aip5 condensates
      by liquid-liquid phase separation in vitro and in vivo.
    supporting_text: The molecular dynamics and reversibility of Aip5 condensates
      are regulated by scaffolding protein Spa2 via liquid-liquid phase separation
      both in vitro and in vivo.
    reference_section_type: ABSTRACT
  - statement: Loss of Spa2 worsens Aip5 condensate stress behavior and disrupts
      actin-cable structures under stress.
    supporting_text: In the absence of Spa2, Aip5 condensates hamper cell growth
      and actin cable structures under stress treatment.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed- and PMC-verified 2019 full-text study showing Spa2-dependent
      Aip5 condensation and actin-cable protection under stress; this is the second
      Spa2/Aip5 paper cited by the refreshed UniProt FUNCTION and SUBCELLULAR LOCATION
      blocks.
