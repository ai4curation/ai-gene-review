    action: REMOVE
    reason: 'This live GOA row replaces the older GO:0005826 actomyosin-contractile-ring
      IBA with a more specific fission-yeast division-site component, but the propagation
      problem remains. PTHR21601 PAINT now places the PomBase-only GO:0120105 IBD
