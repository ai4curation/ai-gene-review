descriptions:
- source: UniProt
  text: Acts as a scaffolding protein at sites of polarized growth (PubMed:12361575,
    PubMed:31362951). Plays a role in the establishment of polarized growth (PubMed:12361575).
    Recruits components of the cell integrity MAPK cascade to sites of polarized growth
    (PubMed:12361575). Localizes actin assembly proteins BUD6 and AIP5 to sites of
    polarized growth to promote actin nucleation and the formation of actin filament
    seeds (PubMed:31362951, PubMed:31699995). Involved in pheromone-induced morphogenesis
    and efficient mating (PubMed:2211820).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23201
