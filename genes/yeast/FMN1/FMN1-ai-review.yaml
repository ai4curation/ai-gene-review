id: Q03778
gene_symbol: FMN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FMN1 (YDR236C) encodes the monofunctional riboflavin kinase (flavokinase, EC 2.7.1.26) of
  S. cerevisiae, which phosphorylates riboflavin with ATP to form FMN, the first step in conversion of
  riboflavin to flavin cofactors. Unlike bacterial bifunctional RibF enzymes, Fmn1 has no FAD synthetase
  activity; FAD is made from FMN by the unrelated Fad1. Deletion of FMN1 prevents growth on rich medium
  unless FMN is supplied. Fmn1 is a 25-kDa membrane-associated protein found mostly (~90%) in microsomal
  (ER) fractions and ~10% in mitochondria, where it is an integral inner-membrane protein with its C-terminal
  catalytic domain facing the matrix, providing intramitochondrial FMN.
