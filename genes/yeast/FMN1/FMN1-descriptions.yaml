- source: Alliance_Imported
  text: Riboflavin kinase, produces riboflavin monophosphate (FMN); FMN is a necessary
    cofactor for many enzymes; predominantly localizes to the microsomal fraction
    and also found in the mitochondrial inner membrane; human RFK functionally complements
    the lethality of the null mutation
  source_type: curated
  url: https://www.yeastgenome.org/locus/FMN1
  source_id: SGD:S000002644
- source: Alliance_Automated
  text: Enables riboflavin kinase activity. Involved in FMN biosynthetic process.
    Located in mitochondrial inner membrane. Used to study cancer. Orthologous to
    human RFK (riboflavin kinase).
