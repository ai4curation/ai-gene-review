  label: Saccharomyces cerevisiae S288C
description: 'Alg7 is the UDP-N-acetylglucosamine:dolichyl-phosphate N-acetylglucosamine-1-phosphate transferase
  (GPT; EC 2.7.8.15). It belongs to the polytopic glycosyltransferase family 4 / MraY-WecA family, and
  the nucleoside antibiotic tunicamycin is its target. Alg7 catalyses the first, committed step of dolichol-linked
  oligosaccharide assembly: it transfers GlcNAc-1-phosphate from cytosolic UDP-GlcNAc onto dolichyl phosphate
  to form GlcNAc-PP-dolichol in the cytoplasmic leaflet of the ER membrane. Alg7 forms a hetero-hexameric
  complex with the Alg13/Alg14 UDP-GlcNAc transferase, which adds the second GlcNAc, so the first two
  steps of LLO assembly are physically coupled, much as MraY and MurG are in bacterial peptidoglycan synthesis.
  ALG7 is essential. Dominant alleles that increase transferase activity alleles confer tunicamycin resistance,
  and hypomorphic alleles reduce LLO levels and N-glycosylation and cause secondary mitochondrial defects.'
