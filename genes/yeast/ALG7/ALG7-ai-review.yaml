suggested_questions:
- question: Does assembly with Alg13/Alg14 stimulate Alg7 activity or channel GlcNAc-PP-Dol to the second
    step?
- question: How is ALG7 expression or activity coupled to cell proliferation and to dolichyl-phosphate
    availability?
suggested_experiments:
- description: Compare Alg7 kinetics alone and within a reconstituted Alg7/Alg13/Alg14 complex, and test
    whether GlcNAc-PP-Dol is channelled by measuring intermediate release.
