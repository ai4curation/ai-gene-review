  evidence_type: IMP
  original_reference_id: PMID:15794922
  qualifier: involved_in
  review:
    summary: aerobic respiration, IMP from Mendelsohn et al. 2005. The alg7 hypomorph lost mtDNA and respiratory
      activity, but the authors attribute this to dysregulated N-glycosylation in general, and an alg6
      LLO mutant behaved the same way. This is an indirect consequence of an LLO defect. Alg7 does none
      of the work of respiration.
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect, pleiotropic phenotype. Being required for mitochondrial maintenance does not make
      Alg7 a participant in aerobic respiration.
    supported_by:
    - reference_id: PMID:15794922
      supporting_text: We show that ALG7 knockdown gave rise to an unexpected phenotype of mitochondrial
        dysfunction.
    - reference_id: PMID:15794922
      supporting_text: our studies provide evidence that the dysregulation of N-glycosylation in haploid
        yeast cells leads to mitochondrial dysfunction
