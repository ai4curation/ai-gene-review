  text: Enables UDP-N-acetylglucosamine-dolichyl-phosphate N-acetylglucosaminephosphotransferase
    activity. Involved in aerobic respiration and dolichol-linked oligosaccharide
    biosynthetic process. Located in endoplasmic reticulum. Part of UDP-N-acetylglucosamine
    transferase complex. Human ortholog(s) of this gene implicated in congenital disorder
    of glycosylation Ij and congenital myasthenic syndrome 13. Orthologous to human
    DPAGT1 (dolichyl-phosphate N-acetylglucosaminephosphotransferase 1).
