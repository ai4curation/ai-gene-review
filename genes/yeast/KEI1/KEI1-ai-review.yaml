suggested_questions:
- question: Does Kei1 contribute residues to the Aur1 active site (making it a co-catalytic rather than purely regulatory
    subunit), as structural studies of the Aur1-Kei1 complex might resolve?
suggested_experiments:
- hypothesis: Kei1 is required for Aur1 folding or active-site conformation rather than only localisation
  description: Purify Aur1 with wild-type Kei1, kei1-1 and Golgi-retention-defective Kei1 variants and compare IPC
    synthase kinetics in detergent micelles independent of localisation.
  experiment_type: biochemistry
