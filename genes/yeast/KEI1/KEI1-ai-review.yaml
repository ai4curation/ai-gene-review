id: Q06346
gene_symbol: KEI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: KEI1 (YDR367W) encodes an essential multi-pass medial-Golgi membrane protein that is the non-catalytic
  regulatory subunit of inositol phosphorylceramide (IPC) synthase. It forms a complex with the catalytic subunit
  Aur1 and is required both for IPC synthase activity (Aur1 alone has hardly detectable activity) and for retaining
  Aur1 in the Golgi, where phosphoinositol is transferred from phosphatidylinositol to ceramide to make IPC, the
  first complex sphingolipid. Kei1 is cleaved by Kex2 into N- and C-terminal chains after Arg-135, recycles between
  medial and late Golgi via COPI, and the temperature-sensitive kei1-1 allele confers aureobasidin A hypersensitivity
  and a thermolabile IPC synthase.
