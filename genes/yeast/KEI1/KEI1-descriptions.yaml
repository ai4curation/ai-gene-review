descriptions:
- source: UniProt
  text: Regulatory component of the inositol phosphorylceramide (ICP) synthase which
    catalyzes the addition of a phosphorylinositol group onto ceramide to form inositol
    phosphorylceramide, an essential step in sphingolipid biosynthesis. Helps the
    medial Golgi localization of IPC synthase in a COPI vesicle-dependent manner.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06346
  source_id: Q06346
- source: Alliance_Imported
  text: Component of inositol phosphorylceramide (IPC) synthase; forms a complex with
    Aur1p and regulates its activity; required for IPC synthase complex localization
    to the Golgi; post-translationally processed by Kex2p; KEI1 is an essential gene
  source_type: curated
  url: https://www.yeastgenome.org/locus/KEI1
  source_id: SGD:S000002775
- source: Alliance_Automated
  text: Enables inositol phosphoceramide synthase regulator activity. Involved in
    inositol phosphoceramide metabolic process and sphingolipid biosynthetic process.
    Located in Golgi membrane. Part of inositol phosphoceramide synthase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/KEI1
  source_id: SGD:S000002775
