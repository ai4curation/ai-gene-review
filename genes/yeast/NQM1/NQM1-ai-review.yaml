suggested_questions:
- question: Does Nqm1p carry measurable transaldolase flux in vivo under the conditions that induce it
    (ethanol/glycerol growth, caloric restriction, oxidative stress), and how does its activity compare
    kinetically with Tal1p?
suggested_experiments:
- description: Measure sedoheptulose 7-phosphate accumulation and 13C-PPP flux in tal1, nqm1 and tal1
    nqm1 strains grown on ethanol or under H2O2 stress, alongside purified-enzyme kinetics of Nqm1p versus
    Tal1p.
