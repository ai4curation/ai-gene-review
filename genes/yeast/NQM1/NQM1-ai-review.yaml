    summary: PAINT IBA for the non-oxidative PPP. The transaldolase reaction Nqm1p catalyses is a step
      of this branch, but under glucose growth Tal1p carries the flux and nqm1 deletion does not alter
      PPP intermediates; Nqm1p's contribution is likely restricted to conditions where it is induced (non-fermentable
      carbon, stress).
