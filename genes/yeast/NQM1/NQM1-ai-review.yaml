  label: Saccharomyces cerevisiae S288C
description: NQM1 (non-quiescent mutant 1) encodes a type-1 transaldolase (EC 2.2.1.2), the whole-genome-duplication
  paralog of TAL1. The crystal structure and enzyme assays identify Nqm1p as an active homodimeric transaldolase
  that transfers a dihydroxyacetone unit from sedoheptulose 7-phosphate to glyceraldehyde 3-phosphate,
  forming erythrose 4-phosphate and fructose 6-phosphate, the reaction of the non-oxidative pentose phosphate
  pathway. Under standard glucose growth Tal1p provides essentially all transaldolase flux and nqm1 deletion
  has no detectable effect on PPP metabolite profiles. NQM1 is glucose-repressed and induced (partly via
  the transcription factor Vhr1) on non-fermentable carbon sources, under caloric restriction and under
  osmotic and oxidative stress; its loss increases H2O2 tolerance and, combined with vhr1 heterozygosity,
  prolongs stationary-phase survival. Nqm1p is cytoplasmic with additional nuclear signal in GFP surveys.
