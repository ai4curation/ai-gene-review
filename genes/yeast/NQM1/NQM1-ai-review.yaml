- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IMP
  original_reference_id: PMID:25887987
  qualifier: involved_in
  review:
    summary: NQM1 is induced by menadione and H2O2, and nqm1 deletion confers increased tolerance to H2O2,
      so NQM1 limits oxidant tolerance. The effect is presumably metabolic (redistribution of PPP/glycolytic
      flux) rather than a direct stress-response activity.
    action: KEEP_AS_NON_CORE
    reason: Experimental phenotype supporting a role in oxidative stress physiology, but downstream of
      its metabolic activity; non-core.
    supported_by:
    - reference_id: PMID:25887987
      supporting_text: |-
        Finally, deletion
        of NQM1 is shown to confer resistance to oxidizing substances.
    - *id005
