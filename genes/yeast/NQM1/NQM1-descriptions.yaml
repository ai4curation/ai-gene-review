descriptions:
- source: UniProt
  text: Transaldolase involved in the non-oxidative phase in the pentose phosphate
    pathway. Catalyzes the reversible conversion of sedoheptulose-7-phosphate and
    D-glyceraldehyde 3-phosphate into erythrose-4-phosphate and beta-D-fructose 6-phosphate.
    Transaldolase is important for the balance of metabolites in the pentose-phosphate
    pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53228
  source_id: P53228
- source: Alliance_Imported
  text: Transaldolase of unknown function; transcription is repressed by Mot1p and
    induced by alpha-factor and during diauxic shift; NQM1 has a paralog, TAL1, that
    arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/NQM1
  source_id: SGD:S000003275
- source: Alliance_Automated
  text: Enables transaldolase activity. Involved in cellular response to oxidative
    stress. Located in nucleus. Human ortholog(s) of this gene implicated in carbohydrate
    metabolic disorder. Orthologous to human TALDO1 (transaldolase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NQM1
  source_id: SGD:S000003275
