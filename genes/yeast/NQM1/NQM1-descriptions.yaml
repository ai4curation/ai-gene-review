descriptions:
- source: UniProt
  text: Transaldolase involved in the non-oxidative phase in the pentose phosphate
    pathway. Catalyzes the reversible conversion of sedoheptulose-7-phosphate and
    D-glyceraldehyde 3-phosphate into erythrose-4-phosphate and beta-D-fructose 6-phosphate.
    Transaldolase is important for the balance of metabolites in the pentose-phosphate
    pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53228
  source_id: P53228
