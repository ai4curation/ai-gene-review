findings:
- category: discrepancy
  text: SGD describes Nqm1 as a transaldolase of unknown function; the review cites
    crystal structure and assays showing an active transaldolase, minor relative to
    Tal1.
  sources:
  - Alliance_Imported
- category: gap
  text: SGD's regulators (Mot1 repression, alpha-factor and diauxic-shift induction)
    are not mentioned in the review, which cites glucose repression and Vhr1 instead.
  sources:
  - Alliance_Imported
