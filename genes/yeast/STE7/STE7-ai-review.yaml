  review:
    summary: PAINT IBA placing Ste7 in the MAPK cascade from the MAP2K clade (PTN000684494).
    action: ACCEPT
    reason: Ste7 is the MAP2K tier of the Ste11-Ste7-Fus3/Kss1 cascades; the generic MAPK cascade term
      is correct and consistent with the phylogenetic placement of Ste7 among MAP2Ks. More specific pathway
      terms (GO:0071507, GO:0001402) are annotated experimentally.
    supported_by:
    - &id003
      reference_id: PMID:8159759
      supporting_text: reconstituted a kinase cascade in which STE11 phosphorylates and activates STE7,
        which in turn phosphorylates the mitogen-activated protein kinase FUS3
    - &id004
      reference_id: file:yeast/STE7/STE7-deep-research-falcon.md
      supporting_text: Ste7 is best described as an ATP-dependent, dual-specificity MAPKK that is activated
        by the MAPKKK Ste11 and activates the MAPKs Fus3 and Kss1 through phosphorylation of their activation-loop
        threonine and tyrosine.
- term:
    id: GO:0000196
    label: cell integrity MAPK cascade
  evidence_type: IGI
  original_reference_id: PMID:10880465
  qualifier: involved_in
  supporting_entities:
  - SGD:S000006387
  review:
    summary: Genetic interaction (with DPM1) placing Ste7 in a Sho1-Ste11-Ste7-Kss1-Ste12 pathway activated
      by glycosylation defects and contributing to cell wall integrity.
    action: MODIFY
    reason: The paper supports Ste7 acting in a Kss1-type MAPK cascade that responds to protein-glycosylation
      defects and contributes to cell wall integrity. However, GO:0000196 cell integrity MAPK cascade
      is defined as the cascade containing the Slt2/Pmk1 MAP kinase (Pkc1-Bck1-Mkk1/2-Slt2 in yeast),
      in which Ste7 is not a tier; the MAP2Ks of that cascade are Mkk1/Mkk2. The essence (Ste7 functions
      in a MAPK cascade here) is sound, so the annotation should be expressed with the generic MAPK cascade
      term rather than the Slt2-specific cascade.
    proposed_replacement_terms:
    - id: GO:0000165
      label: MAPK cascade
    supported_by:
    - reference_id: PMID:10880465
      supporting_text: We specifically suggest that a Sho1 --> Ste20/Ste50 --> Ste11 --> Ste7 --> Kss1
        --> Ste12 pathway is responsible for activation of FUS1 transcription in these mutants.
    - reference_id: PMID:10880465
      supporting_text: we suggest that the Sho1 --> Ste12 pathway contributes to maintenance of cell wall
        integrity in vegetative cells.
- term:
    id: GO:0000749
    label: response to pheromone triggering conjugation with cellular fusion
  evidence_type: IDA
  original_reference_id: PMID:8668180
  qualifier: involved_in
  review:
    summary: Ste7-Kss1/Fus3 complexes from pheromone-treated cells show pheromone-stimulated reciprocal
      phosphorylation; Ste7 docking-region deletions reduce pheromone signaling in vivo.
    action: ACCEPT
    reason: Ste7 is an essential signalling kinase of the pheromone response; this parent process term
      is correct. The more precise process is GO:0071507 pheromone response MAPK cascade, which is also
      annotated.
    supported_by:
    - &id005
      reference_id: PMID:8668180
      supporting_text: Kss1 and Fus3 are mitogen-activated protein kinases (MAPKs or ERKs), and Ste7 is
        their activating MAPK/ERK kinase (MEK), in the pheromone response pathway of Saccharomyces cerevisiae.
    - &id017
      reference_id: PMID:8668180
      supporting_text: Deletions of Ste7 in the region required for its stable association with Kss1 and
        Fus3 in vitro significantly decreased (but did not eliminate) signaling in vivo.
    - &id006
      reference_id: PMID:8668180
      supporting_text: Ste7 phosphorylated Kss1 (or Fus3), and Kss1 (or Fus3) phosphorylated Ste7, in
        a pheromone-stimulated manner
- term:
    id: GO:0001402
    label: signal transduction involved in filamentous growth
  evidence_type: IMP
  original_reference_id: PMID:15456892
  qualifier: involved_in
  review:
    summary: Constitutive Ste7 variants activate Kss1 but not Fus3 in vivo and promote filamentation gene
      expression and invasive growth.
    action: ACCEPT
    reason: Ste7 is the MAP2K of the filamentous/invasive growth pathway, where it activates Kss1 largely
      independently of Ste5. Signal transduction involved in filamentous growth directly captures this
      core signalling role.
    supported_by:
    - reference_id: PMID:15456892
      supporting_text: This specificity occurs because constitutive Ste7 activates Kss1, but not Fus3,
        in vivo and promotes filamentation gene expression while suppressing mating gene expression.
    - reference_id: PMID:15456892
      supporting_text: Instead, we found that constitutive Ste7 promotes invasion without supporting mating
        responses.
    - &id001
      reference_id: PMID:9363895
      supporting_text: We show instead that Kss1 is the principal target of Ste7 in the invasive-growth
        response in both haploids and diploids.
- term:
    id: GO:0001403
    label: invasive growth in response to glucose limitation
  evidence_type: IGI
  original_reference_id: PMID:9363895
  qualifier: involved_in
  supporting_entities:
  - SGD:S000003272
  review:
    summary: Genetic interaction with KSS1 shows that Kss1 is the principal target of Ste7 in haploid
      and diploid invasive growth.
    action: KEEP_AS_NON_CORE
    reason: Ste7 is required for haploid invasive growth, but its direct contribution is relaying the
      filamentous-growth signal to Kss1 (captured by GO:0001402). The developmental growth outcome is
      a valid but downstream, non-core process annotation.
    supported_by:
    - *id001
    - reference_id: PMID:9363895
      supporting_text: Ste7 acts to relieve this negative regulation by switching Kss1 from an inhibitor
        to an activator.
- term:
    id: GO:0001403
    label: invasive growth in response to glucose limitation
  evidence_type: IMP
  original_reference_id: PMID:8001818
  qualifier: involved_in
  review:
    summary: STE7 mutants are defective in haploid filament formation and agar penetration (invasive growth).
    action: KEEP_AS_NON_CORE
    reason: Correct loss-of-function phenotype; Ste7 acts in invasive growth as the MAP2K of the signalling
      pathway rather than as a morphogenetic effector, so this developmental term is kept as non-core.
    supported_by:
    - &id018
