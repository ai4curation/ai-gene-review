  review:
    summary: Genome-wide yeast two-hybrid screen detects Ste7 interaction with the MAP kinase Kss1, one
      of the two direct substrates of Ste7.
    action: MODIFY
    reason: Bare protein binding is uninformative. Kss1 is a MAP kinase that Ste7 docks with high affinity
      (Kd ~5 nM) through a site outside its catalytic core, and then dually phosphorylates (PMID:8668180).
      The informative replacement is mitogen-activated protein kinase binding, which captures the MAPKK-MAPK
      docking interaction that underlies Ste7 substrate selection.
