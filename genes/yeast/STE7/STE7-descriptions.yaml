descriptions:
- source: UniProt
  text: Serine/threonine protein kinase required for cell-type- specific transcription
    and signal transduction in yeast. It is thought that it is phosphorylated by the
    ste11 protein kinase and that it can phosphorylate the FUS3 and or KSS1 kinases.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P06784
  source_id: P06784
- source: Alliance_Imported
  text: Signal transducing MAP kinase kinase; involved in pheromone response where
    it phosphorylates Fus3p; involved in the pseudohyphal/invasive growth pathway
    where it phosphorylates of Kss1p; phosphorylated by Ste11p; degraded by ubiquitin
    pathway
  source_type: curated
  url: https://www.yeastgenome.org/locus/STE7
  source_id: SGD:S000002318
- source: Alliance_Automated
  text: Enables MAP kinase kinase activity. Involved in several processes, including
    MAPK cascade; invasive growth in response to glucose limitation; and pseudohyphal
    growth. Located in cytoplasm and mating projection tip. Human ortholog(s) of this
    gene implicated in several diseases, including carcinoma (multiple); cardiofaciocutaneous
    syndrome 3; cardiofaciocutaneous syndrome 4; high grade glioma; and melorheostosis.
    Orthologous to human MAP2K1 (mitogen-activated protein kinase kinase 1) and MAP2K2
    (mitogen-activated protein kinase kinase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/STE7
  source_id: SGD:S000002318
