    overall_notes: 'Correct: converts guanine and hypoxanthine to GMP and IMP with
      PRPP in purine salvage. No GMP feedback or ADE repression link.'
- source: Alliance_Imported
  text: Dimeric hypoxanthine-guanine phosphoribosyltransferase; catalyzes the transfer
    of the phosphoribosyl portion of 5-phosphoribosyl-alpha-1-pyrophosphate to a purine
    base (either guanine or hypoxanthine) to form pyrophosphate and a purine nucleotide
    (either guanosine monophosphate or inosine monophosphate); mutations in the human
    homolog HPRT1 can cause Lesch-Nyhan syndrome and Kelley-Seegmiller syndrome
  source_type: curated
