descriptions:
- source: UniProt
  text: Converts guanine to guanosine monophosphate, and hypoxanthine to inosine monophosphate.
    Transfers the 5-phosphoribosyl group from 5- phosphoribosylpyrophosphate onto
    the purine. Plays a central role in the generation of purine nucleotides through
    the purine salvage pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04178
