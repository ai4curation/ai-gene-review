gene_symbol: HPT1
organism: yeast
uniprot_id: Q04178
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Converts guanine to guanosine monophosphate, and hypoxanthine to inosine monophosphate.
    Transfers the 5-phosphoribosyl group from 5- phosphoribosylpyrophosphate onto
    the purine. Plays a central role in the generation of purine nucleotides through
    the purine salvage pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04178
  source_id: Q04178
- source: Alliance_Imported
  text: Dimeric hypoxanthine-guanine phosphoribosyltransferase; catalyzes the transfer
    of the phosphoribosyl portion of 5-phosphoribosyl-alpha-1-pyrophosphate to a purine
    base (either guanine or hypoxanthine) to form pyrophosphate and a purine nucleotide
    (either guanosine monophosphate or inosine monophosphate); mutations in the human
    homolog HPRT1 can cause Lesch-Nyhan syndrome and Kelley-Seegmiller syndrome
  source_type: curated
  url: https://www.yeastgenome.org/locus/HPT1
  source_id: SGD:S000002807
- source: Alliance_Automated
  text: Enables hypoxanthine phosphoribosyltransferase activity. Involved in GMP salvage
    and IMP salvage. Located in cytoplasm and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/HPT1
  source_id: SGD:S000002807
