- term:
    id: GO:0032265
    label: XMP salvage
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001262736
  - SGD:S000003894
  review:
    summary: IBA (PTN001262736) for XMP salvage; the only experimental donor is the paralog Xpt1 (SGD:S000003894).
      Purified Hpt1 does not use xanthine, and xpt1 disruption abolishes XPRT activity while HPRT is unaffected,
      so the xanthine function belongs to the Xpt1 lineage and was mis-propagated to the Hpt1 branch of the node.
    action: REMOVE
    reason: 'Contradicted by direct biochemistry: yeast HGPRT does not accept xanthine; XMP salvage is the specialised
      function of the paralog Xpt1.'
    supported_by:
    - reference_id: PMID:6170313
      supporting_text: The enzyme recognized hypoxanthine and guanine, but not adenine or xanthine, as substrates.
    - reference_id: PMID:10217799
      supporting_text: Disruption of XPT1 affects xanthine utilization in vivo and results in a severe reduction
        of xanthine phosphoribosyl transferase (XPRT) activity while HPRT is unaffected.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: SGD:S000003894
        source_label: XPT1 (S. cerevisiae xanthine phosphoribosyltransferase)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Xpt1 has genetic evidence for XPRT activity, but the HGPRT paralog Hpt1 does not use xanthine (purified
          enzyme), so the XMP-salvage function placed at PTN001262736 does not apply to the Hpt1 branch.
