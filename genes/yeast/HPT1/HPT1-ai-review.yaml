id: Q04178
gene_symbol: HPT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'HPT1 (YDR399W) encodes hypoxanthine-guanine phosphoribosyltransferase (HGPRT), a dimeric type I phosphoribosyltransferase
  that transfers the 5-phosphoribosyl group of PRPP to hypoxanthine or guanine to form IMP or GMP, respectively,
  with guanine the preferred substrate; it does not use adenine or xanthine. The reaction follows an ordered bi-bi
  mechanism and requires a divalent metal (Mg2+). Hpt1 is the main salvage enzyme for the 6-oxopurines: it allows
  hypoxanthine and guanine to refill the IMP and GMP pools, and hpt1 mutants (originally isolated as bra6) fail
  to repress the ADE genes in response to adenine. Hpt1 is feedback-inhibited by GMP; mutations that relieve this
  inhibition cause lethal guanylic nucleotide accumulation when guanine is supplied. Xanthine is salvaged by the
  separate paralog Xpt1. Hpt1 is an abundant cytoplasmic (and nuclear) protein.'
