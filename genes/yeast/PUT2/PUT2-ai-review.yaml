suggested_questions:
- question: What fraction of native Put2 is membrane-associated under different growth conditions, and
    does that association affect transfer of P5C from Put1? Matrix enzyme activity and peripheral membrane
    association are compatible; a dedicated Put1-Put2 channeling complex is not established by analogy
    with fused bacterial PutA.
suggested_experiments:
- description: Test Put1-Put2 physical association and P5C channelling in isolated mitochondria (crosslinking,
    co-immunoprecipitation and kinetic coupling assays).
