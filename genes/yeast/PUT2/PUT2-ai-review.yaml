  review:
    summary: RCA from YeastPathways ARGDEG-YEAST-PWY. Arginine-derived P5C (via Car1 arginase, Car2 ornithine
      aminotransferase, Pro3 reduction to proline and Put1 reoxidation) is ultimately oxidized to glutamate
      by PUT2, so PUT2 performs the final step of the aerobic arginine degradation route. Valid but secondary
      to the proline catabolism role.
