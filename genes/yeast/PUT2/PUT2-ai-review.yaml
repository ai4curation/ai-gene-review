id: P07275
gene_symbol: PUT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PUT2 (YHR037W) encodes delta-1-pyrroline-5-carboxylate (P5C) dehydrogenase, an NAD+-dependent
  aldehyde dehydrogenase family enzyme of the mitochondrial matrix (EC 1.2.1.88). It catalyses the second
  and final step of proline utilization, oxidizing L-glutamate 5-semialdehyde (in equilibrium with P5C,
  produced by Put1 proline dehydrogenase) to L-glutamate, so that proline and arginine/ornithine-derived
  P5C can serve as nitrogen sources. PUT2 is induced by proline through the Put3 activator; put2 mutants
  cannot use proline as sole nitrogen source.
