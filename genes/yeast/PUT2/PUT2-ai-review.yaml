  evidence_type: IDA
  original_reference_id: PMID:4145181
  qualifier: involved_in
  review:
    summary: IDA (Lundgren and Ogur 1973) to L-glutamate biosynthetic process. Glutamate is the product
      of the PUT2 reaction, so this is formally correct; physiologically PUT2 acts in proline catabolism
      (proline as a nitrogen source), and de novo glutamate synthesis in yeast is via glutamate dehydrogenase/GOGAT.
    action: KEEP_AS_NON_CORE
    supported_by:
