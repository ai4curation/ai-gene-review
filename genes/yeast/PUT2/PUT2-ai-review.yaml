      supporting_text: Proline is converted to glutamate in the yeast Saccharomyces cerevisiae by the
        sequential action of two enzymes, proline oxidase and delta 1-pyrroline-5-carboxylate (P5C) dehydrogenase
    reason: Glutamate is directly synthesized by Put2 chemistry, so this existing process is retained
      as a secondary description of its catabolic reaction. Source PMID:4145181 is bibliographic-only
      here; support is independent native pathway/enzyme evidence rather than its title.
