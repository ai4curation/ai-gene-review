- source: Alliance_Automated
  text: Enables L-glutamate gamma-semialdehyde dehydrogenase (NAD+) activity. Involved
    in L-glutamate biosynthetic process and L-proline catabolic process. Located in
    mitochondrial matrix. Used to study disease of metabolism. Human ortholog(s) of
    this gene implicated in hyperprolinemia type 2. Orthologous to human ALDH4A1 (aldehyde
    dehydrogenase 4 family member A1).
