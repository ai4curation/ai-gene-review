- source: Alliance_Imported
  text: Delta-1-pyrroline-5-carboxylate dehydrogenase; nuclear-encoded mitochondrial
    protein involved in utilization of proline as sole nitrogen source; deficiency
    of human homolog ALDH4A1 causes type II hyperprolinemia (HPII), an autosomal recessive
    inborn error of metabolism; human homolog ALDH4A1 can complement yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/PUT2
