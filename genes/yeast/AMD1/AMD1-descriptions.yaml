- source: Alliance_Imported
  text: AMP deaminase; tetrameric enzyme that catalyzes the deamination of AMP to
    form IMP and ammonia; thought to be involved in regulation of intracellular purine
    (adenine, guanine, and inosine) nucleotide pools
  source_type: curated
  url: https://www.yeastgenome.org/locus/AMD1
  source_id: SGD:S000004498
- source: Alliance_Automated
  text: Enables AMP deaminase activity. Involved in guanine salvage and purine nucleotide
    metabolic process. Located in cytoplasm. Used to study pontocerebellar hypoplasia.
    Human ortholog(s) of this gene implicated in several diseases, including congestive
    heart failure (multiple); coronary artery disease; hereditary spastic paraplegia
    63; muscular disease (multiple); and pontocerebellar hypoplasia type 9. Orthologous
    to human AMPD1 (adenosine monophosphate deaminase 1); AMPD2 (adenosine monophosphate
    deaminase 2); and AMPD3 (adenosine monophosphate deaminase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/AMD1
