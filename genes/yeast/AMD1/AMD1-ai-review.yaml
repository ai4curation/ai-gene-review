      supporting_text: There are three possible routes to synthesize IMP (and in turn GMP) in the presence of adenine.
    - reference_id: PMID:19635936
      supporting_text: A major conclusion from our results is that, in yeast, a defect in AMP deaminase is associated
        with a severe GDP/GTP pool depletion.
    - reference_id: PMID:19635936
      supporting_text: AMP deaminase (AMPD) is such an interconversion enzyme that allows IMP synthesis from AMP.
