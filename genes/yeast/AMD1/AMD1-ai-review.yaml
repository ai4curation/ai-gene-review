- term:
    id: GO:0006178
    label: guanine salvage
  evidence_type: IGI
  original_reference_id: PMID:19635936
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000857
  review:
    summary: Saint-Marc et al. (2009) (IGI with HIS1) showed that amd1 mutants (alone or combined with aah1, ade8,
      his1) cannot make guanylic nucleotides from adenine when de novo IMP synthesis is repressed. GO:0006178 "guanine
      salvage" is defined as generating guanine (the base) from its derivatives; Amd1 neither makes nor uses guanine.
      What the data show is that Amd1 supplies IMP from salvaged adenine (AMP) for GMP synthesis, i.e. IMP salvage.
    action: MODIFY
    reason: Term definition (formation of guanine base) does not match; Amd1 converts AMP to IMP, feeding guanylate
      synthesis from adenine. Full text read.
    proposed_replacement_terms:
    - id: GO:0032264
      label: IMP salvage
    supported_by:
