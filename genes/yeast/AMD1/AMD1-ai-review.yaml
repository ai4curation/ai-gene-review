core_functions:
- description: Zinc-dependent AMP deaminase (AMP + H2O -> IMP + NH4+) that converts salvaged/excess adenylate into
    IMP, supplying IMP for GMP synthesis when de novo synthesis is repressed by adenine and driving adenylate-pool
    contraction (with Isn1) on glucose shift.
  molecular_function:
    id: GO:0003876
    label: AMP deaminase activity
  directly_involved_in:
  - id: GO:0032264
    label: IMP salvage
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:2690949
    supporting_text: A yeast strain deficient in AMP deaminase activity was produced and shown to be deficient in
      AMP deaminase protein by Western blot analysis.
  - reference_id: PMID:2690949
    supporting_text: One plasmid was selected for its ability to restore AMP catalytic activity to the deficient
      strain.
  - reference_id: PMID:19635936
    supporting_text: AMP deaminase (AMPD) is such an interconversion enzyme that allows IMP synthesis from AMP.
  - reference_id: PMID:19635936
    supporting_text: A major conclusion from our results is that, in yeast, a defect in AMP deaminase is associated
      with a severe GDP/GTP pool depletion.
  - reference_id: PMID:20087341
    supporting_text: Conversion of AXPs into inosine was facilitated by AMP deaminase, Amd1, and IMP-specific 5'-nucleotidase,
      Isn1.
  - reference_id: file:yeast/AMD1/AMD1-uniprot.txt
    supporting_text: Reaction=AMP + H2O + H(+) = IMP + NH4(+); Xref=Rhea:RHEA:14777,
suggested_questions:
- question: Does the inactive paralog Yjl070c regulate Amd1 activity through hetero-oligomerisation (its overexpression
    phenocopies amd1 only when AMD1 is present), and under what physiological conditions?
- question: Is Amd1 allosterically regulated (e.g. by ATP/GTP or phosphate) in yeast as AMPD is in mammals, and
    what is the role of its N-terminal extension and phosphorylation sites (Ser19, Ser58, Ser61, Ser138)?
suggested_experiments:
- description: Co-purify Amd1 with and without Yjl070c and assay AMP deaminase kinetics; test whether Yjl070c overexpression
    lowers Amd1 specific activity in extracts.
