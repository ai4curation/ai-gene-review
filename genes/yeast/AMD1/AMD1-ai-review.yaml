id: P15274
gene_symbol: AMD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'AMD1 (YML035C) encodes the sole active AMP deaminase of Saccharomyces cerevisiae, a zinc-dependent
  amidohydrolase of the adenosine/AMP deaminase family that hydrolyses AMP to IMP and ammonium. The 810-residue
  protein (a ~83 kDa N-terminally truncated form is the classically purified enzyme) is cytoplasmic and non-essential.
  By converting AMP to IMP, Amd1 links the adenylate and guanylate branches of purine metabolism: when adenine is
  supplied and de novo IMP synthesis is repressed, the Apt1-Amd1 route (together with the Aah1-Hpt1 route) supplies
  the IMP needed for GMP synthesis, and amd1 mutants become depleted of GDP/GTP and grow poorly. Amd1, together
  with the IMP 5''-nucleotidase Isn1, also drives the rapid conversion of adenine nucleotides to inosine that shrinks
  the adenylate pool when respiring cells are shifted to glucose. Two paralogs, Yjl070c and Ybr284w, lack AMP, adenosine
  and adenine deaminase activity; Yjl070c interacts with Amd1 and its overexpression phenocopies amd1 loss in an
  Amd1-dependent manner.'
