gene_symbol: PFK2
organism: yeast
uniprot_id: P16862
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of D-fructose 6-phosphate to fructose 1,6-bisphosphate
    by ATP, the first committing step of glycolysis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P16862
  source_id: P16862
- source: Alliance_Imported
  text: Beta subunit of heterooctameric phosphofructokinase; involved in glycolysis;
    indispensable for anaerobic growth; activated by fructose-2,6-bisphosphate and
    AMP; mutation inhibits glucose induction of cell cycle-related genes; moonlighting
    protein that binds short mRNA sequence repeats, and contains 5'-3' dsRNA unwinding
    activity; dynamically associates with translating ribosomes, and promotes translation
    of cell cycle genes such as CLN3 and BUB3
  source_type: curated
  url: https://www.yeastgenome.org/locus/PFK2
  source_id: SGD:S000004818
- source: Alliance_Automated
  text: Enables 5'-3' RNA helicase activity; mRNA binding activity; and ribosome binding
    activity. Contributes to 6-phosphofructokinase activity and proton-transporting
    ATPase activity, rotational mechanism. Involved in several processes, including
    cellular response to glucose stimulus; vacuolar acidification; and vacuolar proton-transporting
    V-type ATPase complex assembly. Acts upstream of or within positive regulation
    of cytoplasmic translation. Located in mitochondrion. Part of 6-phosphofructokinase
    complex. Used to study glycogen storage disease. Human ortholog(s) of this gene
    implicated in glycogen storage disease VII. Orthologous to human PFKL (phosphofructokinase,
    liver type) and PFKM (phosphofructokinase, muscle).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PFK2
  source_id: SGD:S000004818
