- source: Alliance_Automated
  text: Enables 5'-3' RNA helicase activity; mRNA binding activity; and ribosome binding
    activity. Contributes to 6-phosphofructokinase activity and proton-transporting
    ATPase activity, rotational mechanism. Involved in several processes, including
    cellular response to glucose stimulus; vacuolar acidification; and vacuolar proton-transporting
    V-type ATPase complex assembly. Acts upstream of or within positive regulation
    of cytoplasmic translation. Located in mitochondrion. Part of 6-phosphofructokinase
    complex. Used to study glycogen storage disease. Human ortholog(s) of this gene
    implicated in glycogen storage disease VII. Orthologous to human PFKL (phosphofructokinase,
    liver type) and PFKM (phosphofructokinase, muscle).
