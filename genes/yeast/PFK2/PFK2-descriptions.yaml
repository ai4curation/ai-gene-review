- source: Alliance_Imported
  text: Beta subunit of heterooctameric phosphofructokinase; involved in glycolysis;
    indispensable for anaerobic growth; activated by fructose-2,6-bisphosphate and
    AMP; mutation inhibits glucose induction of cell cycle-related genes; moonlighting
    protein that binds short mRNA sequence repeats, and contains 5'-3' dsRNA unwinding
    activity; dynamically associates with translating ribosomes, and promotes translation
    of cell cycle genes such as CLN3 and BUB3
  source_type: curated
