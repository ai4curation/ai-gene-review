id: P16862
gene_symbol: PFK2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Beta subunit of ATP-dependent 6-phosphofructokinase (PFK-1; EC 2.7.1.11) of Saccharomyces cerevisiae. Pfk2 and
  its paralog Pfk1 (alpha subunit) assemble into a cytosolic alpha4beta4 hetero-octamer that phosphorylates fructose 6-phosphate
  to fructose 1,6-bisphosphate, the committed, allosterically regulated step of glycolysis (activated by AMP and fructose
  2,6-bisphosphate, inhibited by ATP). pfk2 single mutants have a stronger glycolytic defect than pfk1 mutants, and pfk1 pfk2
  double mutants cannot grow on glucose. Pfk2 binds the vacuolar V-ATPase and is needed for full V-ATPase proton transport
  and glucose-dependent V1Vo reassembly, supporting vacuolar acidification and cytosolic pH homeostasis. Pfk2 is also an mRNA-binding
  protein that associates with translating ribosomes, shows 5'-3' RNA duplex-unwinding activity in vitro, and promotes translation
  of cell-cycle mRNAs such as CLN3 independently of its glycolytic activity.
