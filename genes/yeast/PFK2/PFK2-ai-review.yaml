core_functions:
- description: Pfk2 (beta) is a subunit of the cytoplasmic alpha4beta4 ATP-dependent 6-phosphofructokinase that phosphorylates
    fructose 6-phosphate to fructose 1,6-bisphosphate, the committed, allosterically controlled (AMP, fructose 2,6-bisphosphate,
    ATP) step of glycolysis.
  contributes_to_molecular_function:
    id: GO:0003872
    label: 6-phosphofructokinase activity
  directly_involved_in:
  - id: GO:0006096
    label: glycolysis
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0005945
    label: 6-phosphofructokinase complex
  supported_by:
  - reference_id: file:yeast/PFK2/PFK2-uniprot.txt
    supporting_text: Reaction=beta-D-fructose 6-phosphate + ATP = beta-D-fructose 1,6-
  - reference_id: PMID:3007939
    supporting_text: Subcloning of both genes in one multicopy vector (YEp13) and reintroduction into the yeast cell resulted
      in a 3.5-fold higher specific activity compared to the wild type.
  - reference_id: PMID:2965996
    supporting_text: A haploid yeast strain containing both disrupted copies of the PFK-genes is not capable of growing on
      rich medium containing 2% glucose.
  - reference_id: PMID:6219673
    supporting_text: Phosphofructokinase from yeast is effectively activated by AMP and fructose-2,6-bisphosphate by increasing
      the affinity of the enzyme to fructose-6-phosphate and the maximum activity toward this substrate.
  - reference_id: PMID:18313953
    supporting_text: labelling of the phosphofructokinase subunits, Pfk1p and Pfk2p, with N- and C-terminal EGFP fragments,
      respectively, resulted in green fluorescence in the cytoplasm
suggested_questions:
- question: Is the 5'-3' RNA-unwinding activity of Pfk2 ATP-dependent and does it use the PFK nucleotide-binding sites, given
    that Pfk2 lacks canonical helicase motifs?
- question: Is the requirement of Pfk2 for V-ATPase reassembly explained solely by glycolytic flux, or by a specific Pfk2-V-ATPase
    interaction?
suggested_experiments:
- description: Test catalytically dead Pfk2 point mutants (PFK2-D301T/D348S) for RNA unwinding, polysome association and rescue
    of the pfk2 cell-size/G1-S phenotype to separate metabolic and RNA functions.
