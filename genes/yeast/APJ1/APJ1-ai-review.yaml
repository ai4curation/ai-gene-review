    correctness: UNVERIFIED
    review_notes: >-
      The report correctly identifies PMID:32492414 as decisive conflicting evidence and
      preserves computed comparison tables. It recommends the more permissive option of
      retaining refolding as non-core; after curator review of the full paper, this review
      removes the IBA because the demonstrated APJ1 output is degradation rather than
      refolding. The report's unverified ancillary PMID leads are not used.
