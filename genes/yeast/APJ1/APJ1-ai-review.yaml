      A 90-residue Apj1 fragment containing the J domain and adjacent Q/A segment is
      sufficient for Hsp104-driven curing of strong [PSI+] in the tested system.
    supporting_text: >-
      we found that a 90-residue fragment that includes the 70-residue J-domain and the
      adjacent 12-residue glutamine/alanine (Q/A) segment is sufficient for curing.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMC full text checked. The result establishes a specialized prion-curing activity,
      but only in the experimental context of Hsp104 overexpression and particular prion
      variants; it is not generalized to basal proteostasis.
- id: PMID:41025326
  title: Nuclear and cytosolic J-domain proteins provide synergistic control of Hsf1 at distinct phases of the heat shock response.
  findings:
  - statement: >-
      Apj1 promotes Hsf1 displacement from heat-shock elements and is required for normal
      attenuation of the heat-shock response.
    supporting_text: >-
      Here, we show that the yeast nuclear JDP Apj1 primarily controls the attenuation
      phase of the HSR by promoting Hsf1's displacement from heat shock elements in
      target DNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMC full text checked. This postdates the GOA snapshot and supplies direct evidence
      for APJ1-dependent negative regulation of the cellular heat response.
