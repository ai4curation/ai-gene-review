id: P53940
gene_symbol: APJ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  APJ1 encodes a low-abundance class A J-domain cochaperone that recruits Hsp70
  activity to specialized nuclear protein-quality-control tasks. Apj1 stimulates
  Hsp70 ATPase activity, accumulates at intranuclear quality-control inclusions
  during proteotoxic stress, and promotes proteasomal turnover of aggregated
  nuclear clients rather than their refolding. It also helps terminate the heat
  shock response by promoting release of Hsf1 from heat-shock elements. Apj1 is
  found mainly in the nucleus and cytoplasm, with additional detections in
  mitochondrial proteomes. Overexpression and domain-dissection studies
  additionally reveal a specialized role in
  Hsp104-dependent curing of strong [PSI+] prion variants.
existing_annotations:
- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      Apj1 is a class A J-domain protein whose conserved HPD-containing J domain
      stimulates the ATPase cycle of cytosolic/nuclear Hsp70s. Target-specific
      experiments show that an intact J domain is required for Apj1 function.
    action: ACCEPT
    reason: >-
      The IBA is supported by an independent APJ1 IDA annotation and by the
      experimentally demonstrated J-domain dependence of its Hsp70-cochaperone roles.
    supported_by:
    - reference_id: file:yeast/APJ1/APJ1-deep-research-falcon.md
      supporting_text: Apj1 is classified as a **class I (class A) J protein** in yeast
- term:
    id: GO:0034605
    label: cellular response to heat
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      Apj1 participates in the heat-shock response primarily during attenuation:
      apj1Δ prolongs Hsf1 occupancy and target-gene expression after heat shock.
    action: ACCEPT
    reason: >-
      The phylogenetic annotation now has direct target-gene support from the 2025
      Hsf1 study; this is a genuine stress-response role, although more specific
      regulation is captured by a proposed new term below.
    additional_reference_ids:
    - PMID:41025326
    supported_by:
    - reference_id: PMID:41025326
      supporting_text: >-
        Here, we show that the yeast nuclear JDP Apj1 primarily controls the attenuation
        phase of the HSR by promoting Hsf1's displacement from heat shock elements in
        target DNA.
      reference_section_type: ABSTRACT
- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      This family-level IBA conflicts with the APJ1-specific nuclear-client study:
      deletion of APJ1 accelerated recovery of heat-aggregated nuclear luciferase,
      whereas Apj1 promoted turnover of insoluble nuclear substrates.
    action: REMOVE
    reason: >-
      Apj1 is a J-domain cochaperone, but its demonstrated specialized role channels
      nuclear aggregates toward proteasomal clearance and can counteract refolding.
      The refolding term is therefore an inappropriate family-level transfer to APJ1.
    additional_reference_ids:
    - PMID:32492414
    - file:yeast/APJ1/APJ1-hypotheses/function-hypothesis-go-0042026/openscientist.md
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001531327
        source_label: PAINT J-domain-protein source node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Refolding is valid for other J-domain cochaperones, but APJ1-specific
          experiments instead show preferential routing of nuclear aggregates to
          proteasomal turnover.
    supported_by:
    - reference_id: PMID:32492414
      supporting_text: >-
        Surprisingly, we observed that recovery of luciferase activity was accelerated
        in the absence of Apj1
      reference_section_type: RESULTS
    - reference_id: PMID:32492414
      supporting_text: >-
        Importantly, Apj1-dependent disaggregation produces soluble species but does not
        support refolding, which is consistent with a function in supporting proteolytic
        turnover of disaggregated proteins.
      reference_section_type: RESULTS
    - reference_id: file:yeast/APJ1/APJ1-hypotheses/function-hypothesis-go-0042026/openscientist.md
      supporting_text: >-
        Weakly supported / partially over-annotated (as a *direct* function).
      reference_section_type: OTHER
- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      The family-level client-binding inference is biologically plausible for a class A
      J-domain protein, but the obsolete/broad binding term is better represented by
      the current chaperone-activity term used by the unfolded-protein-binding project.
    action: MODIFY
    reason: >-
      Apj1 presents aggregation-prone clients to Hsp70 and requires its substrate-binding
      architecture for specialized quality-control functions; GO:0044183 is the
      project's interim informative replacement for this legacy binding annotation.
    proposed_replacement_terms:
