suggested_questions:
- question: >-
    Which endogenous sumoylated or aggregation-prone nuclear clients are directly
    selected by Apj1, and how do its zinc-binding and beta-sandwich regions determine
    client specificity relative to Ydj1?
- question: >-
    Does the mitochondrial-proteomics signal represent a regulated mitochondrial
    precursor quality-control pool, transient association, or co-purification of this
    predominantly nuclear/cytosolic cochaperone?
- question: >-
    Is Apj1's prion-curing specialization used under physiological Hsp104 expression,
    or is it restricted to Hsp104-overexpression and particular [PSI+] variants?
suggested_experiments:
- description: >-
    Reconstitute Apj1-Ssa1 client triage using purified wild-type Apj1, HPD-mutant Apj1,
    and substrate-binding-region mutants with aggregated nuclear clients; quantify Hsp70
    ATPase stimulation, client transfer, refolding, and proteasome-directed ubiquitination.
- description: >-
    Use endogenous proximity labeling before and after heat shock in wild type, slx5Δ,
    and btn2Δ cells to identify Apj1 clients, then measure their solubility and
    proteasome-dependent turnover in apj1Δ and domain-complemented strains.
- description: >-
    Test mitochondrial association with protease-protection and fractionation controls
    using an endogenous N-terminal tag, alongside nuclear/cytosolic markers and import-
    stress conditions that accumulate mitochondrial precursor proteins.
