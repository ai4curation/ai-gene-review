core_functions:
- description: >-
    Specialized nuclear J-domain/Hsp70 cochaperone that recognizes aggregation-prone
    clients and works with Ssa Hsp70 and the Hsp110 nucleotide-exchange factor Sse1 in
    Hsp104-independent disaggregation. This machinery solubilizes insoluble nuclear
    proteins from Btn2-organized inclusions and channels them to proteasomal turnover
    rather than refolding; the conserved J domain activates the Ssa Hsp70 cycle.
