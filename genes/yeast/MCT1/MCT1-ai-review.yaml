id: Q12283
gene_symbol: MCT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MCT1 (YOR221C) encodes the mitochondrial malonyl-CoA:acyl carrier protein transacylase (FabD
  family, EC 2.3.1.39) of S. cerevisiae. It transfers the malonyl group from malonyl-CoA, made in the
  matrix by the acetyl-CoA carboxylase Hfa1, onto the phosphopantetheine arm of the mitochondrial acyl
  carrier protein Acp1. The resulting malonyl-ACP is the two-carbon donor for the type II mitochondrial
  fatty acid synthase (with Cem1, Oar1, Htd2 and Etr1), which produces octanoyl-ACP for lipoic acid synthesis
  and other acyl chains needed for respiratory function. mct1 disruption causes respiratory deficiency,
  as in other mtFAS mutants.
