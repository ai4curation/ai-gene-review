taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PRO2 (YOR323C) encodes gamma-glutamyl phosphate reductase (glutamate-5-semialdehyde dehydrogenase,
  EC 1.2.1.41), the ProA ortholog of the aldehyde dehydrogenase superfamily. It reduces gamma-glutamyl
  5-phosphate with NADPH to L-glutamate 5-semialdehyde, which cyclizes spontaneously to 1-pyrroline-5-carboxylate,
  the second step of proline biosynthesis from glutamate. Pro2 is cytosolic, its activity rises when Pro1
  carries a feedback-relieving mutation, and pro2 null mutants need high proline for full growth, although
  arginine-derived P5C lets them grow slowly without it.
