gene_symbol: PRO2
organism: yeast
uniprot_id: P54885
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the NADPH dependent reduction of L-gamma-glutamyl 5-phosphate into
    L-glutamate 5-semialdehyde and phosphate. The product spontaneously undergoes
    cyclization to form 1-pyrroline-5-carboxylate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54885
  source_id: P54885
- source: Alliance_Imported
  text: Cytosolic gamma-glutamyl phosphate reductase; catalyzes the second step in
    proline biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/PRO2
  source_id: SGD:S000005850
- source: Alliance_Automated
  text: Enables glutamate-5-semialdehyde dehydrogenase (NADP+) activity. Involved
    in L-proline biosynthetic process. Located in cytosol. Human ortholog(s) of this
    gene implicated in cutis laxa (multiple); enterocele; and nervous system disease
    (multiple). Orthologous to human ALDH18A1 (aldehyde dehydrogenase 18 family member
    A1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PRO2
  source_id: SGD:S000005850
