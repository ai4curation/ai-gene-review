  review:
    summary: >-
      Root molecular function ND annotation: when it was made, no molecular function had
      been curated for this gene product from literature.
    action: ACCEPT
    reason: >-
      ACCEPT under the ND acceptance rule (projects/NO_DATA.md). The yeast Coq9 literature checked
      (PMID:16027161, PMID:17391640, PMID:24406904, PMID:26008578, and PMID:25339443, whose yeast work is
      complementation by Coq9p point mutants and DMQ6/CoQ6 ratios) establishes complex membership and the
      requirement of Coq9 for Coq6/Coq7 function and deamination, but identifies no molecular activity of
      the S. cerevisiae protein; the lipid-binding data (PMID:25339443, PMID:30661980) are on recombinant
      human COQ9. Lipid binding of yeast Coq9 is therefore inferable (IBA/InterPro rows) rather than
      shown, and the ND remains a correct statement of the literature on this gene product.
    supported_by:
    - reference_id: file:yeast/COQ9/COQ9-notes.md
      supporting_text: >-
        No paper in this set reports a molecular activity measured on the S. cerevisiae Coq9 protein
    - reference_id: PMID:16027161
      supporting_text: >-
        Coq9p may either catalyze a reaction in the coenzyme Q biosynthetic pathway or have a regulatory
        role similar to that proposed for Coq8p
