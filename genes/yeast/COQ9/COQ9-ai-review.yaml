id: Q05779
gene_symbol: COQ9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  COQ9 (YLR201C) encodes a mitochondrial protein required for coenzyme Q6 biosynthesis. Coq9 is a peripheral
  membrane protein on the matrix face of the inner mitochondrial membrane and a subunit of the CoQ synthome,
  where it co-purifies with Coq3, Coq4, Coq5, Coq6 and Coq7 and is needed for the stability of the complex.
  Coq9 is required for the activities of the Coq6 and Coq7 hydroxylases and for removal of the nitrogen
  from para-aminobenzoate-derived ring intermediates. COQ9 family proteins adopt a TetR-like fold with
  a hydrophobic pocket that binds CoQ and its isoprenylated intermediates. They are thought to extract
  these intermediates from the membrane and present them to COQ7, rather than to catalyse a chemical step
  themselves.
