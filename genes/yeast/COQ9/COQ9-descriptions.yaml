gene_symbol: COQ9
organism: yeast
uniprot_id: Q05779
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Membrane-associated protein that warps the membrane surface to access and
    bind aromatic isoprenes with high specificity, including ubiquinone (CoQ) isoprene
    intermediates and presents them directly to COQ7, therefore facilitating the COQ7-mediated
    hydroxylase step (By similarity). Participates in the biosynthesis of coenzyme
    Q, also named ubiquinone, an essential lipid-soluble electron transporter for
    aerobic cellular respiration (PubMed:16027161, PubMed:25339443).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05779
  source_id: Q05779
- source: Alliance_Imported
  text: Protein required for ubiquinone biosynthesis and respiratory growth; localizes
    to matrix face of mitochondrial inner membrane in a large complex with ubiquinone
    biosynthetic enzymes; ubiquinone is also known as coenzyme Q; human homolog COQ9
    can complement yeast coq9 null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/COQ9
  source_id: SGD:S000004191
- source: Alliance_Automated
  text: Predicted to enable lipid binding activity. Involved in ubiquinone biosynthetic
    process. Located in mitochondrial inner membrane. Part of protein-containing complex.
    Used to study coenzyme Q10 deficiency disease. Human ortholog(s) of this gene
    implicated in primary coenzyme Q10 deficiency 5. Orthologous to human COQ9 (coenzyme
    Q9).
  source_type: automated
  url: https://www.yeastgenome.org/locus/COQ9
  source_id: SGD:S000004191
