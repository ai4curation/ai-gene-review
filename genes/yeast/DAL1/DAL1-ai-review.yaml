    label: cobalt ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017593
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: IEA from InterPro2GO (IPR017593 allantoinase). The mapping probably reflects in vitro metal-activation
      data for some bacterial allantoinases rather than a family-wide cobalt cofactor; for yeast Dal1
      the cofactor is recorded as Zn2+ by similarity and there is no evidence of physiological cobalt
      binding.
    reason: No evidence that yeast Dal1 binds cobalt; the family-wide InterPro2GO mapping over-generalises
      an in vitro metal preference of some homologs.
    supported_by:
    - *id007
