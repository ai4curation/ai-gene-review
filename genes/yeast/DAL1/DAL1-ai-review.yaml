- term:
    id: GO:0006145
    label: purine nucleobase catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT4G04955
  - PANTHER:PTN000909483
  - UniProtKB:Q5B4C7
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: IBA from PTN000909483 (donors Arabidopsis ALN and Aspergillus AlnA, which act in ureide/purine
      catabolism downstream of urate oxidase). In GO, allantoin catabolic process is not a part of purine
      nucleobase catabolic process, and S. cerevisiae lacks urate oxidase and cannot channel endogenous
      purines into allantoin; Dal1 degrades environmentally supplied allantoin. The clade-level inheritance
      is reasonable for organisms with the full purine-to-allantoin route but over-states the yeast role.
    reason: Dal1 acts on allantoin, not on a purine nucleobase; S. cerevisiae has no purine-to-allantoin
      route, so allantoin catabolic process (already annotated) is the accurate process.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000909483
        source_label: PTN000909483
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Plant/Aspergillus donors degrade purines through urate and allantoin; S. cerevisiae lacks
          the upstream urate oxidase step.
    supported_by:
    - *id005
