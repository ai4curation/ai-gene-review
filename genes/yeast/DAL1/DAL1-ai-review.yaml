id: P32375
gene_symbol: DAL1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Allantoinase (Dal1p, YIR027C), a metallo-dependent cyclic amidohydrolase of the amidohydrolase
  (dihydroorotase/allantoinase) superfamily that hydrolyses the hydantoin ring of (S)-allantoin to allantoate
  (EC 3.5.2.5), the first step of allantoin degradation. By homology it binds a binuclear Zn2+ centre
  bridged by a carboxylated lysine. Dal1 enables S. cerevisiae to use allantoin as a secondary nitrogen
  source; the pathway proceeds via allantoate (Dal2), ureidoglycolate (Dal3) and urea, which is degraded
  by urea amidolyase (Dur1,2). DAL1 lies in the DAL gene cluster on chromosome IX, is expressed independently
  of the allophanate inducer, and is subject to nitrogen catabolite repression through GATA (UASNTR) elements.
  S. cerevisiae lacks urate oxidase, so allantoin is obtained from the environment rather than from endogenous
  purine breakdown.
