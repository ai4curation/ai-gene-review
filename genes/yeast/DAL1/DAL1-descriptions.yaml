gene_symbol: DAL1
organism: yeast
uniprot_id: P32375
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the conversion of allantoin (5-ureidohydantoin) to allantoic acid
    by hydrolytic cleavage of the five-member hydantoin ring. Involved in the utilization
    of purines as secondary nitrogen sources, when primary sources are limiting.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32375
  source_id: P32375
- source: Alliance_Imported
  text: Allantoinase; converts allantoin to allantoate in the first step of allantoin
    degradation; expression sensitive to nitrogen catabolite repression
  source_type: curated
  url: https://www.yeastgenome.org/locus/DAL1
  source_id: SGD:S000001466
- source: Alliance_Automated
  text: Enables allantoinase activity. Involved in allantoin catabolic process. Predicted
    to be active in cytoplasm. Human ortholog(s) of this gene implicated in Ritscher-Schinzel
    syndrome; dihydropyrimidinase deficiency; and purine-pyrimidine metabolic disorder.
    Orthologous to several human genes including CRMP1 (collapsin response mediator
    protein 1); DPYS (dihydropyrimidinase); and DPYSL2 (dihydropyrimidinase like 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DAL1
  source_id: SGD:S000001466
