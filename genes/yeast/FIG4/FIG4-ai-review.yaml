suggested_questions:
- question: How is Fig4 phosphatase activity restrained within the Fab1-Vac14 complex so that Fig4 is simultaneously
    required for Fab1 activation, and is catalytic activity needed for that activating role?
suggested_experiments:
- hypothesis: The Fig4 requirement for Fab1 activation is structural (complex assembly) rather than catalytic
  description: Express catalytically dead Fig4 (active-site Cys mutant) in fig4 cells and measure hyperosmotic PI(3,5)P2
    elevation, Fab1-Vac14 co-IP and vacuole morphology.
  experiment_type: genetic / lipidomic
