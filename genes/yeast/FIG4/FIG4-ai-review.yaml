id: P42837
gene_symbol: FIG4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FIG4 encodes a Sac1-domain polyphosphoinositide phosphatase (orthologue of mammalian FIG4/SAC3) that
  removes the 5-phosphate from phosphatidylinositol 3,5-bisphosphate, regenerating PI3P. Fig4 is a Mg2+-activated,
  PI(3,5)P2-selective enzyme that binds the HEAT-repeat scaffold Vac14 and, through it, joins the opposing PI3P
  5-kinase Fab1, Vac7 and Atg18 in a single PI(3,5)P2 regulatory complex on the limiting membrane of the vacuole.
  Fig4 is the major enzyme for PI(3,5)P2 turnover after hyperosmotic shock, yet together with Vac14 it is also needed
  for normal Fab1 activation and PI(3,5)P2 synthesis, giving the complex a dual role in setting PI(3,5)P2 levels
  and vacuole size. fig4 deletion suppresses the enlarged-vacuole and PI(3,5)P2 defects of vac7 mutants.
