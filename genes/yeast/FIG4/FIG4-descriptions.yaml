descriptions:
- source: UniProt
  text: The PI(3,5)P2 regulatory complex regulates both the synthesis and turnover
    of phosphatidylinositol 3,5-bisphosphate (PtdIns(3,5)P2). Major enzyme required
    for hyperosmotic shock-induced turnover of PtdIns(3,5)P2 and requires VAC14 for
    this function. In vivo, mediates turnover of PtdIns(3,5)P2 at the vacuole membrane
    necessary for vacuolar size control. In vitro, catalyzes the removal of phosphate
    from the fifth hydroxyl of the myo-inositol ring of phosphatidylinositol 3,5-bisphosphate.
  source_type: curated
