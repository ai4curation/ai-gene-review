descriptions:
- source: UniProt
  text: The PI(3,5)P2 regulatory complex regulates both the synthesis and turnover
    of phosphatidylinositol 3,5-bisphosphate (PtdIns(3,5)P2). Major enzyme required
    for hyperosmotic shock-induced turnover of PtdIns(3,5)P2 and requires VAC14 for
    this function. In vivo, mediates turnover of PtdIns(3,5)P2 at the vacuole membrane
    necessary for vacuolar size control. In vitro, catalyzes the removal of phosphate
    from the fifth hydroxyl of the myo-inositol ring of phosphatidylinositol 3,5-bisphosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P42837
  source_id: P42837
- source: Alliance_Imported
  text: Phosphatidylinositol 3,5-bisphosphate (PtdIns[3,5]P2) phosphatase; required
    for efficient mating and response to osmotic shock; physically associates with
    and regulated by Vac14p; contains a SAC1-like domain; homologous to human FIG4,
    which is associated with CMT4J, a form of Charcot-Marie-Tooth disorder
  source_type: curated
  url: https://www.yeastgenome.org/locus/FIG4
  source_id: SGD:S000005269
- source: Alliance_Automated
  text: Enables phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity. Involved
    in phosphatidylinositol dephosphorylation. Located in fungal-type vacuole membrane
    and nuclear periphery. Part of PAS complex. Used to study Charcot-Marie-Tooth
    disease type 4J; Yunis-Varon syndrome; amyotrophic lateral sclerosis type 11;
    and bilateral parasagittal parieto-occipital polymicrogyria. Human ortholog(s)
    of this gene implicated in Charcot-Marie-Tooth disease type 4J; Yunis-Varon syndrome;
    amyotrophic lateral sclerosis type 11; and bilateral parasagittal parieto-occipital
    polymicrogyria. Orthologous to human FIG4 (FIG4 phosphoinositide 5-phosphatase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FIG4
  source_id: SGD:S000005269
