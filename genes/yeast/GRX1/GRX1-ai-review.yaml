suggested_questions:
- question: What are the physiological protein substrates of Grx1 that distinguish it from Grx2 (superoxide
    vs H2O2 sensitivity of the mutants)?
- question: Is the hydroperoxidase activity of Grx1 (mM Km for H2O2) relevant in vivo compared with Tsa1/Gpx3?
suggested_experiments:
- hypothesis: Grx1 and Grx2 reduce distinct sets of glutathionylated/disulfide targets.
  description: Redox proteomics (e.g. OxICAT) of grx1, grx2 and grx1 grx2 strains under menadione vs H2O2.
