  qualifier: involved_in
  supporting_entities:
  - SGD:S000006012
  review:
    summary: Greetham et al. found that overexpressing the GRX1/GLR1 system raised glutathionylated protein
      levels, but grx1 grx2 mutants have unaltered glutathionylation and purified Grx1 does not deglutathionylate.
      The increase is an overexpression effect; Grx1 is not shown to catalyse or be physiologically required
      for protein glutathionylation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Overexpression-only phenotype; loss-of-function shows no effect.
    supported_by:
    - reference_id: PMID:20074363
      supporting_text: overexpression of the glutaredoxin system resulted in an approximate 66% increases
        in GSSP levels, confirming that glutaredoxins do not act as general deglutathionylases in vivo.
    - reference_id: PMID:20074363
      supporting_text: we have previously shown that the global levels of protein S-thiolation are unaffected
        in yeast mutants lacking glutaredoxins (GRX1 and GRX2)
    - reference_id: PMID:20074363
      supporting_text: glutaredoxins (Grx1 or Grx2) did not display deglutathionylase activity
