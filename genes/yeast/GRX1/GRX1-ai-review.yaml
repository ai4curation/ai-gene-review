id: P25373
gene_symbol: GRX1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Grx1 (YCL035C) is a cytosolic and nuclear dithiol (CPYC active site) glutaredoxin of Saccharomyces
  cerevisiae, paralogous to Grx2 (64% identity). Using reduced glutathione, it catalyses thiol-disulfide
  exchange reducing protein disulfides and glutathione-mixed disulfides, being recycled by GSH and NADPH-dependent
  glutathione reductase (Glr1). Its specific oxidoreductase activity is much lower than that of Grx2,
  which provides most cellular heat-stable glutaredoxin activity. Grx1 also reduces hydroperoxides (glutathione
  peroxidase-like activity) and conjugates GSH to electrophiles (GST activity) through a monothiol (Cys27)
  mechanism. grx1 mutants are sensitive to superoxide, and GRX1 is induced by oxidative, osmotic and heat
  stress; Grx1/Grx2 overlap functionally with the cytosolic thioredoxins Trx1/Trx2.
