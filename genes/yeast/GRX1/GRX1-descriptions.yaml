descriptions:
- source: UniProt
  text: Component of the glutathione system which performs several activities such
    as glutathione-dependent oxidoreductase, glutathione peroxidase and glutathione
    S-transferase (GST) activity (PubMed:11875065, PubMed:12684511). The disulfide
    bond functions as an electron carrier in the glutathione-dependent synthesis of
    deoxyribonucleotides by the enzyme ribonucleotide reductase. In addition, it is
    also involved in reducing cytosolic protein- and non- protein-disulfides in a
    coupled system with glutathione reductase. Required for resistance to reactive
    oxygen species (ROS) by directly reducing hydroperoxides and for the detoxification
    of ROS-mediated damage. GRX1 is less active as an oxidoreductase than GRX2 (PubMed:18992757,
    PubMed:20417731, PubMed:9571241).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25373
  source_id: P25373
- source: Alliance_Imported
  text: Glutathione-dependent disulfide oxidoreductase; hydroperoxide and superoxide-radical
    responsive, heat-stable, with active site cysteine pair; protects cells from oxidative
    damage; GRX1 has a paralog, GRX2, that arose from the whole genome duplication;
    protein abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GRX1
  source_id: SGD:S000000540
- source: Alliance_Automated
  text: Enables glutathione peroxidase activity and glutathione transferase activity.
    Involved in cellular response to oxidative stress and protein glutathionylation.
    Located in cytoplasm and nucleus. Orthologous to human GLRX2 (glutaredoxin 2).
  source_type: automated
