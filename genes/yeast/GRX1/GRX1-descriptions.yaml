  text: Glutathione-dependent disulfide oxidoreductase; hydroperoxide and superoxide-radical
    responsive, heat-stable, with active site cysteine pair; protects cells from oxidative
    damage; GRX1 has a paralog, GRX2, that arose from the whole genome duplication;
    protein abundance increases in response to DNA replication stress
