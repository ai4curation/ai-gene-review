- term:
    id: GO:0000027
    label: ribosomal large subunit assembly
  evidence_type: IMP
  original_reference_id: PMID:35639884
  review:
    summary: >-
      In rpl39 deletion cells, processing of 27SB and 7S pre-rRNAs is delayed, maturation
      of 27SB-containing pre-60S particles is blocked, and nuclear export of pre-60S
      particles is impaired. eL39 co-purifies with 27SB/7S-containing pre-60S particles,
      showing that it is incorporated into the assembling subunit.
    action: NEW
    reason: >-
      Participation test: eL39 is itself a constituent assembled into the pre-60S particle,
      with rRNA contacts that the authors link to maturation of the subunit, so it
      contributes structure to the assembly process rather than being a substrate whose
      loss is merely necessary. Comparator check (QuickGO, taxon 559292): SGD annotates
      GO:0000027 by IMP to many yeast LSU proteins with comparable depletion phenotypes
      (RPL3, RPL5, RPL10, RPL11A/B, RPL25, RPL33A, RPL40A/B, RPL15A/B, RPL36A/B), so the
      convention exists for this role. eL39 is non-essential and the defect is partial,
      so this is a supporting rather than core process.
    supported_by:
    - reference_id: PMID:35639884
      supporting_text: >-
        Specifically, eL39 is required for efficient processing of both 27SB and 7S
        pre-rRNAs and for export of nascent particles from the nucleus to the cytoplasm.
    - reference_id: PMID:35639884
      supporting_text: >-
        Importantly, eL39-yEGFP co-purified with significant amounts of 27SB and 7S
        pre-rRNAs, but not 35S, 27SA2 and 20S pre-rRNAs (Figure 3A).
