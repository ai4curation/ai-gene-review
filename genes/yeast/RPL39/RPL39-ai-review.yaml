id: P04650
gene_symbol: RPL39
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  RPL39 (YJL189W; also called RPL46/SPB2) encodes eL39, a small (51-residue, highly
  basic) protein of the cytosolic 60S large ribosomal subunit. eL39 is a eukaryote-specific
  ribosomal protein whose domain lines the distal (exit) region of the nascent polypeptide
  exit tunnel, where it contacts nascent chains. It acts as a structural constituent of the
  ribosome in cytoplasmic translation; ribosomes lacking eL39 make about fourfold more
  misreading errors, bind aminoacyl-tRNA to the A site more readily and are hypersensitive
  to paromomycin, and cells lacking it accumulate misfolded and aggregated proteins. eL39 is
  also incorporated into pre-60S particles during their nucleolar maturation and is needed
  for efficient processing of 27SB and 7S pre-rRNAs and for nuclear export of pre-60S
  subunits. The gene is not essential, but its deletion lowers 60S subunit levels and causes
  cold sensitivity, and it is synthetically lethal with loss of eL31 (RPL31A/RPL31B).
