  review:
    summary: >-
      PAINT places cytoplasmic translation at the PTHR19970 root node PTN000463054, from
      which yeast eL39 (PTHR19970:SF0) descends. In yeast the role is supported directly:
      eL39 is a 60S structural protein and its loss changes translational accuracy.
    action: ACCEPT
    reason: >-
      The IBA node placement is sound: eL39 is a universal eukaryotic cytosolic LSU protein,
      and yeast data show that it participates structurally in the translating ribosome,
      where its absence increases the misreading rate and changes A-site binding
      (PMID:10852723) and causes nascent-chain misfolding (PMID:35639884). The term is at the
      right specificity for a cytosolic ribosomal protein.
    supported_by:
    - reference_id: PMID:10852723
      supporting_text: >-
        Each of the two L39 mutants displayed a 4-fold increase of their error frequencies
        over the wild type.
