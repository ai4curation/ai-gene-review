    supporting_text: >-
      Importantly, eL39-yEGFP co-purified with significant amounts of 27SB and 7S
      pre-rRNAs, but not 35S, 27SA2 and 20S pre-rRNAs (Figure 3A).
suggested_questions:
- question: >-
    eL39 deletion increases misreading and nascent-chain aggregation. Should these
    structural contributions be captured with a process term such as regulation of
    translational fidelity, or are they adequately covered by cytoplasmic translation
    for a structural ribosomal protein?
- question: >-
    The GO:0007283 spermatogenesis assertion in PTHR19970 sits on a eutherian RPL39L node
    (PTN004522638), not on the root. Is this placement right? It keeps the term off the
    fungal SF0 members, including this gene and Neurospora NCU08990.
suggested_experiments:
- description: >-
    Ribosome profiling and nascent-chain proteomics in rpl39 deletion cells to identify
    which nascent chains depend on eL39 at the tunnel exit for co-translational folding.
