core_functions:
- description: >-
    eL39 is a structural constituent of the cytosolic 60S large ribosomal subunit. Its
    domain lines the exit region of the nascent polypeptide exit tunnel and contacts
    nascent chains. In cytoplasmic translation it supports decoding accuracy and the
    proper folding of nascent polypeptides. Established experimentally in
    S. cerevisiae (LSU proteomics, 80S structure, crosslinking, deletion phenotypes) and
    inherited across the eL39 family (PAINT root node PTN000463054).
  molecular_function:
    id: GO:0003735
    label: structural constituent of ribosome
  directly_involved_in:
  - id: GO:0002181
    label: cytoplasmic translation
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0022625
    label: cytosolic large ribosomal subunit
  supported_by:
  - reference_id: PMID:24072706
    supporting_text: >-
      Three ribosomal proteins, termed Rpl4, Rpl17, and Rpl39 expose domains to the
      interior of the exit tunnel of eukaryotic ribosomes.
  - reference_id: PMID:10852723
    supporting_text: >-
      Each of the two L39 mutants displayed a 4-fold increase of their error frequencies
      over the wild type.
  - reference_id: PMID:11983894
    supporting_text: >-
      The study identified 42 of the 43 core large ribosomal subunit proteins
- description: >-
    eL39 is incorporated into pre-60S particles in the nucleolus and contributes to
    60S subunit assembly, being required for efficient 27SB and 7S pre-rRNA processing
    and for pre-60S nuclear export (deletion phenotype in S. cerevisiae; non-essential).
  molecular_function:
    id: GO:0003735
    label: structural constituent of ribosome
  directly_involved_in:
