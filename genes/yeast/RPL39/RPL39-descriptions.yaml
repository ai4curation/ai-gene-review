descriptions:
- source: UniProt
  text: Component of the ribosome, a large ribonucleoprotein complex responsible for
    the synthesis of proteins in the cell. The small ribosomal subunit (SSU) binds
    messenger RNAs (mRNAs) and translates the encoded message by selecting cognate
    aminoacyl-transfer RNA (tRNA) molecules. The large subunit (LSU) contains the
    ribosomal catalytic site termed the peptidyl transferase center (PTC), which catalyzes
    the formation of peptide bonds, thereby polymerizing the amino acids delivered
    by tRNAs into a polypeptide chain. The nascent polypeptides leave the ribosome
    through a tunnel in the LSU and interact with protein factors that function in
    enzymatic processing, targeting, and the membrane insertion of nascent chains
    at the exit of the ribosomal tunnel.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P04650
  source_id: P04650
- source: Alliance_Imported
  text: Ribosomal 60S subunit protein L39; required for ribosome biogenesis; loss
    of both Rpl31p and Rpl39p confers lethality; also exhibits genetic interactions
    with SIS1 and PAB1; homologous to mammalian ribosomal protein L39, no bacterial
    homolog
  source_type: curated
  url: https://www.yeastgenome.org/locus/RPL39
  source_id: SGD:S000003725
- source: Alliance_Automated
  text: Predicted to be a structural constituent of ribosome. Predicted to be involved
    in cytoplasmic translation. Located in cytoplasm. Part of cytosolic large ribosomal
    subunit. Orthologous to human RPL39 (ribosomal protein L39); RPL39L (ribosomal
    protein L39 like); and RPL39P5 (ribosomal protein L39 pseudogene 5).
  source_type: automated
