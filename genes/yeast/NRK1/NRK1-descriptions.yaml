  text: Nicotinamide riboside kinase; catalyzes the phosphorylation of nicotinamide
    riboside and nicotinic acid riboside in salvage pathways for NAD+ biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/NRK1
  source_id: SGD:S000005073
- source: Alliance_Automated
  text: Enables ribosylnicotinamide kinase activity. Involved in NAD+ biosynthetic
    process via the salvage pathway and nicotinamide riboside metabolic process. Located
    in fungal-type vacuole. Orthologous to several human genes including NMRK1 (nicotinamide
    riboside kinase 1).
