taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NRK1 encodes nicotinamide riboside kinase, a small uridine-kinase-family enzyme that phosphorylates
  nicotinamide riboside (NR) to nicotinamide mononucleotide (NMN) and nicotinic acid riboside (NaR) to
  nicotinate mononucleotide, using ATP. It defines the Nrk1-dependent route by which yeast salvages exogenous
  or recycled ribosides into NAD+, operating in parallel with an Nrk1-independent route in which Urh1,
  Pnp1 and Meu1 split ribosides to the free bases. Nrk1 is cytoplasmic.
