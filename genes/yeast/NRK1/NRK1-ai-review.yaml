suggested_questions:
- question: Has NaR kinase activity been measured on purified yeast Nrk1, or only on the human NRKs?
- question: Is the vacuolar signal of tagged Nrk1 in a high-throughput library a real minor pool, and
    if so does it relate to riboside import or vacuolar NAD+ metabolite storage?
suggested_experiments:
- description: Purify yeast Nrk1 and determine kcat/Km for NR, NaR, uridine and tiazofurin.
  experiment_type: biochemistry
  hypothesis: Yeast Nrk1, like human NRKs, phosphorylates NaR with efficiency similar to NR.
