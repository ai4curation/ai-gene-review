id: P28240
gene_symbol: ICL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ICL1 encodes isocitrate lyase of Saccharomyces cerevisiae, a homotetrameric Mg2+-dependent
  enzyme that cleaves D-threo-isocitrate into succinate and glyoxylate, the first committed step of the
  glyoxylate cycle that allows net carbon assimilation from C2 compounds. ICL1 is glucose-repressed and
  induced on ethanol or acetate (via Cat8p); icl1 null mutants lack isocitrate lyase activity and cannot
  grow on ethanol or acetate as sole carbon source. Unlike most eukaryotic isocitrate lyases, yeast Icl1p
  is cytosolic rather than peroxisomal. The enzyme also cleaves 2-methylisocitrate to pyruvate and succinate
  in vitro. When glucose is replenished after starvation, Icl1p is inactivated and degraded in the vacuole
  via the Vid pathway.
