gene_symbol: ICL1
organism: yeast
uniprot_id: P28240
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the formation of succinate and glyoxylate from isocitrate, a key
    step of the glyoxylate cycle, which operates as an anaplerotic route for replenishing
    the tricarboxylic acid cycle. Required for growth on ethanol or acetate, but dispensable
    when fermentable carbon sources are available. Also acts on 2- methylisocitrate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P28240
  source_id: P28240
- source: Alliance_Imported
  text: Isocitrate lyase; catalyzes the formation of succinate and glyoxylate from
    isocitrate, a key reaction of the glyoxylate cycle; expression of ICL1 is induced
    by growth on ethanol and repressed by growth on glucose
  source_type: curated
  url: https://www.yeastgenome.org/locus/ICL1
  source_id: SGD:S000000867
- source: Alliance_Automated
  text: Enables isocitrate lyase activity and methylisocitrate lyase activity. Involved
    in glyoxylate cycle. Located in vacuole.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ICL1
  source_id: SGD:S000000867
