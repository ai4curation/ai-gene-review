  review:
    summary: is_active_in cytosol, RCA from the YeastPathways LLO pathway (GLUCOSE-MANNOSYL-CHITO-DOLICHOL),
      which gives one compartment to the whole pathway. That compartment is wrong for Alg3. Alg3 uses
      Dol-P-Man and acts on Man5GlcNAc2-PP-Dol after it has been flipped into the ER lumen. Its active
      site faces the lumen. No part of the Alg3 reaction takes place in the cytosol.
