id: P38179
gene_symbol: ALG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Alg3 is a multi-pass ER membrane mannosyltransferase of the GT-C superfamily (glycosyltransferase
  family 58). It catalyses the first lumenal step of dolichol-linked oligosaccharide assembly. After the
  flippase-dependent translocation of Man5GlcNAc2-PP-dolichol into the ER lumen, Alg3 transfers mannose
  from dolichyl-phosphate-mannose onto the Man5 intermediate in α1,3 linkage, giving Man6GlcNAc2-PP-dolichol
  (EC 2.4.1.258). This begins the Dol-P-Man-dependent extension that continues with Alg9, Alg12 and again
  Alg9. Alg3 has a C-terminal KKXX ER-retrieval signal. ALG3 is not essential: alg3 cells accumulate Man5GlcNAc2-PP-dolichol,
  transfer truncated Endo H-resistant glycans to proteins and under-glycosylate secretory proteins, and
  the mutation is synthetically lethal with defects in oligosaccharyltransferase.'
