suggested_questions:
- question: Alg3 adds the first lumenal mannose. Is it rate-limiting for lumenal LLO extension, and does
    its activity respond to Dol-P-Man supply?
suggested_experiments:
- description: Solve an Alg3 structure in complex with a Dol-P-Man analogue and Man5GlcNAc2-PP-Dol to
    identify the catalytic base, by analogy with ALG6 Asp69.
