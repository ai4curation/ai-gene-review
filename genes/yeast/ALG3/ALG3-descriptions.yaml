descriptions:
- source: UniProt
  text: Dol-P-Man:Man(5)GlcNAc(2)-PP-Dol alpha-1,3- mannosyltransferase that operates
    in the biosynthetic pathway of dolichol-linked oligosaccharides, the glycan precursors
    employed in protein asparagine (N)-glycosylation. The assembly of dolichol-linked
    oligosaccharides begins on the cytosolic side of the endoplasmic reticulum membrane
    and finishes in its lumen. The sequential addition of sugars to dolichol pyrophosphate
    produces dolichol-linked oligosaccharides containing fourteen sugars, including
    two GlcNAcs, nine mannoses and three glucoses. Once assembled, the oligosaccharide
    is transferred from the lipid to nascent proteins by oligosaccharyltransferases.
    In the lumen of the endoplasmic reticulum, adds the first dolichyl beta-D-mannosyl
    phosphate derived mannose in an alpha-1,3 linkage to Man(5)GlcNAc(2)-PP-dolichol
    to produce Man(6)GlcNAc(2)-PP-dolichol.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38179
  source_id: P38179
- source: Alliance_Imported
  text: Dolichol-P-Man dependent alpha(1-3) mannosyltransferase; involved in synthesis
    of dolichol-linked oligosaccharide donor for N-linked glycosylation of proteins;
    G353A missense mutation in human ortholog ALG3 implicated in carbohydrate deficient
    glycoprotein syndrome type IV, which is characterized by microcephaly, severe
    epilepsy, minimal psychomotor development, partial deficiency of sialic acids
    in serum glycoproteins; wild-type human ALG3 can complement yeast alg3 mutant
