  text: Enables dol-P-Man:Man(5)GlcNAc(2)-PP-Dol alpha-1,3-mannosyltransferase activity.
    Involved in dolichol-linked oligosaccharide biosynthetic process. Located in endoplasmic
    reticulum. Used to study congenital disorder of glycosylation and congenital disorder
    of glycosylation Id. Human ortholog(s) of this gene implicated in congenital disorder
    of glycosylation Id. Orthologous to human ALG3 (ALG3 alpha-1,3- mannosyltransferase).
