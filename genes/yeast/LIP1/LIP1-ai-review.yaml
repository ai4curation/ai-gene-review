core_functions:
- description: Single-span ER membrane non-catalytic subunit of the Lag1/Lac1 acyl-CoA ceramide synthase; required
    for ceramide synthase activity in vivo and in vitro, and forms a homodimer bridging Lac1/Lag1 subunits in a
    heterotetrameric complex.
