suggested_questions:
- question: Does Lip1 contribute directly to acyl-CoA or sphingoid base binding at the Lac1/Lag1 active site, or
    does it act purely as a structural/stabilising subunit?
suggested_experiments:
- description: Mutate luminal C-terminal Lip1 residues at the Lac1 interface and assay purified complex activity
    and Lag1/Lac1 stability to separate catalytic contribution from complex assembly.
