gene_symbol: LIP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lip1 is a small (150 aa) single-span type II membrane protein of the endoplasmic reticulum that is
  an essential non-catalytic subunit of the acyl-CoA dependent ceramide synthase of Saccharomyces cerevisiae, together
  with the redundant catalytic TLC-domain subunits Lag1 and Lac1. Lip1 was discovered as a co-purifying component
  of purified ceramide synthase and is required for ceramide synthesis both in vivo and in vitro; its functional
  regions lie in the ER membrane and lumen. Structural work shows a Lip1 homodimer bridging two Lac1/Lag1 catalytic
  subunits in a heterotetramer. Lip1 also helps localise Lag1 to the nuclear ER. It is thereby required for formation
  of the very long chain phytoceramide backbone of yeast complex sphingolipids.
