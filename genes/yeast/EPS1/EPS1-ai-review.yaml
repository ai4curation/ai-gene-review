  findings:
  - statement: Falcon synthesis identifies EPS1 as an ER membrane PDI-family ER quality-control
      and ERAD substrate-recognition factor.
core_functions:
- description: Eps1 functions as an ER membrane PDI-family quality-control factor
    that recognizes aberrant secretory-pathway membrane substrates such as Pma1-D378N,
    retains them in the ER, and promotes their delivery to Doa10-linked ER-associated
    degradation. Its thioredoxin-like CXXC motifs and reductase/chaperone activities
    support a redox-assisted substrate-recognition role, but the most defensible core
    function is ERAD-linked quality control.
  molecular_function:
    id: GO:0003756
    label: protein disulfide isomerase activity
  directly_involved_in:
  - id: GO:0036503
    label: ERAD pathway
  - id: GO:0006457
    label: protein folding
  locations:
