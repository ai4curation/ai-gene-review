    supporting_text: Recognition of Pma1-D378N by the ERAD pathway is dependent on
      Eps1, a transmembrane member of the protein disulfide isomerase (PDI) oxidoreductase
      family.
  - reference_id: file:yeast/EPS1/EPS1-deep-research-falcon.md
    supporting_text: Falcon deep research emphasizes ERAD substrate recognition as
      the best-supported EPS1 function.
