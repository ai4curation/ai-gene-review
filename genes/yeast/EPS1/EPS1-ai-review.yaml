gene_symbol: EPS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'EPS1 encodes an endoplasmic-reticulum membrane protein of the protein
  disulfide isomerase family. The best-supported role of Eps1 is ER quality control:
  it recognizes and retains aberrant secretory-pathway membrane substrates, especially
  Pma1-D378N, and promotes their delivery to the Doa10-linked ER-associated degradation
  pathway. Eps1 has thioredoxin-like CXXC active-site motifs and experimentally reported
  reductase/chaperone activities, but its in vivo specificity is more accurately described
  as membrane-bound ERAD substrate recognition and quality-control routing than as
  general protein folding throughout the secretome.'
