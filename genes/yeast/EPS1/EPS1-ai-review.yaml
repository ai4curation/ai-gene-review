suggested_questions:
- question: Should EPS1 retain a broad unfolded protein binding annotation, or should
    GO curation represent its chaperone role only through PDI redox activity and ERAD
    substrate-recognition/process terms?
  experts:
  - Wang Q
  - Chang A
suggested_experiments:
- hypothesis: Eps1 active-site cysteine chemistry is required for substrate recognition
    rather than for broad oxidative folding.
  description: Reconstitute Eps1-dependent recognition of Pma1-D378N and additional
    ERAD substrates using active-site and membrane-anchor mutants, then measure substrate
    binding, Doa10 handoff, and degradation kinetics.
  experiment_type: ERAD substrate-recognition assay
