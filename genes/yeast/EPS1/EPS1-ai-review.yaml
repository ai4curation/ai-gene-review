- id: PMID:10545109
  title: Eps1, a novel PDI-related protein involved in ER quality control in yeast.
  findings:
  - statement: Eps1 is an ER-localized PDI-family membrane protein needed to retain
      and degrade Pma1-D378N.
    supporting_text: Because Eps1 is required for retention and degradation of Pma1-D378N,
      we propose a model in which Eps1 acts as a novel membrane-bound chaperone in
      ER quality control.
- id: PMID:11157982
  title: Functional differences in yeast protein disulfide isomerases.
  findings:
  - statement: EPS1 is one of the nonessential yeast PDI1 homologs.
    supporting_text: 'The Saccharomyces cerevisiae genome, however, contains four
      other nonessential genes with homology to PDI1: MPD1, MPD2, EUG1, and EPS1.'
- id: PMID:12881414
  title: Substrate recognition in ER-associated degradation mediated by Eps1, a member
    of the protein disulfide isomerase family.
  findings:
  - statement: Eps1 is an ERAD recognition component for Pma1-D378N.
    supporting_text: Genetic interactions with other mutants of the ERAD machinery
      and induction of the unfolded protein response in eps1Delta cells support a
      general role for Eps1 as a recognition component of the ERAD pathway.
- id: PMID:16002399
  title: Interactions among yeast protein-disulfide isomerase proteins and endoplasmic
    reticulum chaperone proteins influence their activities.
  findings:
  - statement: Eps1 interacts with multiple ER PDI/chaperone proteins and has chaperone
      activity in this assay context.
    supporting_text: Eps1p interacts with Pdi1p, Eug1p, Mpd1p, and Kar2p with dissociation
      constants (KD) in the range of 10(-7) to 10(-6).
- id: PMID:25437863
  title: The Eps1p protein disulfide isomerase conserves classic thioredoxin superfamily
    amino acid motifs but not their functional geometries.
  findings:
  - statement: Eps1p retains PDI-family Cys-X-X-Cys motifs but has noncanonical
      thioredoxin-domain geometry, especially in Trx2.
    supporting_text: However, crystal structures show that the Cys-X-X-Cys of the
      second domain is buried and that the adjacent proline is in the trans, rather
      than the cis isomer.
