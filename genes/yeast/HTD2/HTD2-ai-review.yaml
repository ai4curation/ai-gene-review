description: HTD2 (YHR067W; also RMD12) encodes the mitochondrial 3-hydroxyacyl-thioester dehydratase
  2 of type II fatty acid synthesis (FAS II). Htd2 is a hot-dog fold enzyme of the thioesterase/thioester
  dehydratase-isomerase superfamily that dehydrates (3R)-3-hydroxyacyl-ACP to trans-2-enoyl-ACP, the third
  step of each FAS II elongation cycle, between the 3-oxoacyl-ACP reductase Oar1 and the enoyl-thioester
  reductase Etr1. As for other FAS II components, loss of HTD2 makes cells respiratory deficient, lacking
  cytochromes and with abnormal mitochondrial morphology, consistent with the requirement of FAS II-derived
  octanoyl-ACP for lipoic acid synthesis; overexpression enlarges mitochondria. htd2 mutants were isolated
  as cells that could not lose a plasmid encoding a mitochondrially targeted bacterial FAS II analogue.
