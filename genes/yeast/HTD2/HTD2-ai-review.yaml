suggested_questions:
- question: Does Htd2 act on ACP thioesters of all chain lengths produced by FAS II (C4-C16), and does
    it form a complex with other FAS II enzymes?
- question: Why is human HTD2 placed in a different PANTHER family (PTHR43437) from fungal Htd2, and are
    the mammalian and fungal enzymes convergent?
suggested_experiments:
- description: Assay purified Htd2 with (3R)-3-hydroxyacyl-ACP substrates of different chain lengths,
    using holo-Acp1 acylated in vitro, to determine kinetic preference in the ACP-dependent direction.
  experiment_type: biochemistry
