  review:
    summary: Sah1 co-purifies with / interacts with Caf16 (P43569), an ABC-type ATPase associated with the CCR4-NOT
      complex, in high-throughput screens (TAP-MS in Gavin 2006; Y2H in Yu 2008; Michaelis 2023 interactome). 'protein
      binding' says nothing about Sah1 activity and the Caf16 interaction has no established functional consequence
      for SAH hydrolysis. (Gavin 2006, affinity purification/MS.)
    action: REMOVE
    reason: Uninformative 'protein binding' from a large-scale screen and no more informative MF is supported; removal
      does not imply the Sah1-Caf16 interaction is false.
