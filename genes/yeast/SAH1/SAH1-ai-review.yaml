  review:
    summary: 'SGD IMP from Malanovic 2008: reduced Sah1 leads to triacylglycerol accumulation. Sah1 does not act
      on TG; the effect is a downstream consequence of AdoHcy inhibiting Cho2/Opi3 phospholipid methylation, which
      redirects phosphatidic acid toward TG and alters INO1/Opi1 regulation.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect metabolic consequence two steps removed from the enzyme's activity; Sah1 performs no step of
      triglyceride metabolism.
    supported_by:
    - reference_id: PMID:18591246
      supporting_text: This decrease is accompanied by an increase in triacylglycerol (TG) levels, demonstrating
        that Sah1-regulated methylation has a major impact on cellular lipid homeostasis.
