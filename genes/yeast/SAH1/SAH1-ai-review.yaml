taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: S-adenosyl-L-homocysteine hydrolase (AdoHcyase, EC 3.13.2.1) of Saccharomyces cerevisiae, a cytosolic
  NAD+-dependent enzyme of the adenosylhomocysteinase family. Sah1 hydrolyses S-adenosyl-L-homocysteine (AdoHcy),
  the product of every S-adenosylmethionine-dependent transmethylation, to L-homocysteine and adenosine; it is the
  only eukaryotic route for AdoHcy degradation and therefore closes the S-adenosylmethionine (activated methyl)
  cycle, returning homocysteine for remethylation to methionine. Because AdoHcy is a potent product inhibitor of
  methyltransferases, Sah1 activity sets the cellular methylation capacity. Its depletion causes AdoHcy accumulation,
  reduced de novo phosphatidylcholine synthesis via the Cho2/Opi3 phospholipid methylation route, and secondary
  triacylglycerol accumulation. SAH1 is essential in strains lacking sulfur assimilation (met25/met17 backgrounds);
  the reaction equilibrium favours AdoHcy synthesis in vitro, with the hydrolytic direction driven in vivo by removal
  of adenosine and homocysteine.
