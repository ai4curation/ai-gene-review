descriptions:
- source: UniProt
  text: Adenosylhomocysteine is a competitive inhibitor of S- adenosyl-L-methionine-dependent
    methyl transferase reactions; therefore adenosylhomocysteinase may play a key
    role in the control of methylations via regulation of the intracellular concentration
    of adenosylhomocysteine.
