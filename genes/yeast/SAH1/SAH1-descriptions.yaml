descriptions:
- source: UniProt
  text: Adenosylhomocysteine is a competitive inhibitor of S- adenosyl-L-methionine-dependent
    methyl transferase reactions; therefore adenosylhomocysteinase may play a key
    role in the control of methylations via regulation of the intracellular concentration
    of adenosylhomocysteine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39954
  source_id: P39954
- source: Alliance_Imported
  text: S-adenosyl-L-homocysteine hydrolase; catabolizes S-adenosyl-L-homocysteine
    which is formed after donation of the activated methyl group of S-adenosyl-L-methionine
    (AdoMet) to an acceptor; regulates cellular lipid homoeostasis by regulating phosphatidylcholine(PC)synthesis
    and triacylglycerol (TG) levels
  source_type: curated
  url: https://www.yeastgenome.org/locus/SAH1
  source_id: SGD:S000000845
- source: Alliance_Automated
  text: Enables adenosylhomocysteinase activity. Involved in L-methionine cycle; phosphatidylcholine
    biosynthetic process; and triglyceride metabolic process. Located in cytoplasm.
    Used to study hyperhomocysteinemia. Human ortholog(s) of this gene implicated
    in abdominal aortic aneurysm and hypermethioninemia with deficiency of S-adenosylhomocysteine
    hydrolase. Orthologous to human AHCY (adenosylhomocysteinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SAH1
  source_id: SGD:S000000845
