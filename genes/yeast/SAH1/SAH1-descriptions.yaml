- source: Alliance_Imported
  text: S-adenosyl-L-homocysteine hydrolase; catabolizes S-adenosyl-L-homocysteine
    which is formed after donation of the activated methyl group of S-adenosyl-L-methionine
    (AdoMet) to an acceptor; regulates cellular lipid homoeostasis by regulating phosphatidylcholine(PC)synthesis
    and triacylglycerol (TG) levels
  source_type: curated
  url: https://www.yeastgenome.org/locus/SAH1
