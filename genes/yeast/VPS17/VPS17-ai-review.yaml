id: P32913
gene_symbol: VPS17
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Vps17 is a sorting nexin of the SNX-BAR class, the counterpart of human SNX5 and SNX6, and the partner
  of Vps5 in the membrane-binding layer of the yeast retromer coat. It is a hydrophilic peripheral membrane
  protein with a disordered N-terminal region, a PX domain and a C-terminal BAR domain. Its BAR half forms
  a heterodimer with that of Vps5, and the Vps5-Vps17 heterodimer binds phosphatidylinositol 3-phosphate
  (PI3P)-containing endosomal membranes and bends them into tubules. Vps17 is needed for Vps5 to associate
  with membranes and strengthens the binding of Vps5 to the cargo-selective Vps26-Vps29-Vps35 subcomplex,
  although the direct contacts with that subcomplex are made by Vps5. Vps17-coated tubules bud from endosomes
  and carry the carboxypeptidase Y receptor Vps10 back to the trans-Golgi network. vps17 mutants therefore
  secrete carboxypeptidase Y and other soluble vacuolar hydrolases, lose Vps10 to the vacuole and have
  fragmented vacuoles. Vacuoles of vps17 mutants also hyper-fragment under hyperosmotic stress, through
  alternative retromers in which the PROPPINs Atg18 and Atg21 take the place of the sorting nexins. PI3P
  binding by the Vps17 PX domain is reported experimentally but is questioned by its crystal structure,
  which lacks the canonical basic binding residues.
