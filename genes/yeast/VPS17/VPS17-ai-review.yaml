suggested_questions:
- question: Does the Vps17 PX domain bind PI3P? Burda et al. and Yu and Lemmon report binding, but the
    2022 crystal structure lacks basic residues at the canonical site. Is the binding non-canonical, or
    did the earlier assays detect Vps5-dependent or non-specific lipid binding?
- question: What does Vps17 contribute beyond pairing with Vps5? Vps5 alone carries the retromer-binding
    motifs, and a Vps5 homodimer can form retromer coats, yet vps17Δ cells lose Vps10 recycling.
- question: Why do Ear1 sorting results in vps17Δ cells disagree between laboratories (normal in PMID:42135947,
    mislocalised in PMID:41699388)?
suggested_experiments:
- description: Measure PI3P binding of the isolated Vps17 PX domain and of the full Vps5-Vps17 heterodimer
    carrying Vps5 or Vps17 PX-domain mutations, by liposome flotation and SPR, to settle whether Vps17
    contributes PI3P binding.
- description: Compare membrane tubulation and coat order on supported membrane tubes for purified S.
    cerevisiae Vps5 homodimer and the Vps5-Vps17 heterodimer, and test Vps10 and Ear1 recycling in vps17Δ
    cells in one strain background.
