- term:
    id: GO:0005768
    label: endosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000831045
  - SGD:S000005658
  review:
    summary: PAINT IBD at PTN000831045 (VPS17 family, PTHR47433), seeded by Vps17 itself.
    action: ACCEPT
    reason: Vps17 acts at endosomes. Vps17-GFP marks endosomes and the tubules that bud from them (PMID:22593205,
      PMID:24567361). Vps17 among the seeds shows that the claim is grounded on the target, not circular.
      No PAINT loss on the lineage. A family-level inference stops at the organelle, a respectably specific
      term, so this row is kept at endosome; the membrane sub-location is on the NEW endosome membrane
      row and on the refined IPI row.
    supported_by:
    - reference_id: PMID:22593205
      supporting_text: Consistent with this, Vps17-GFP and Vps5-GFP (not shown) localize to endosomes
    - reference_id: PMID:24567361
      supporting_text: Mvp1 and Vps17 retromer SNX-BAR coat tubules that bud from the endosome.
- term:
    id: GO:0005768
    label: endosome
  evidence_type: IPI
  original_reference_id: PMID:9700157
  qualifier: located_in
  supporting_entities:
  - SGD:S000005595
  review:
    summary: Vps17 is in the Vps5-Vps17 subcomplex, which assembles with the cargo-selective subcomplex
      on endosomal membranes; WITH/FROM is Vps5.
    action: MODIFY
    reason: 'The location is right, and the row''s own evidence reaches the membrane: Vps17 is cross-linked
      with Vps5 into the peripheral membrane-associated complex that the authors conclude assembles on
      an endosomal membrane, and its partner Vps5 is labelled by immunogold at the rims of the prevacuolar
      endosome. The IPI code for a location reflects inference from the complex partner; the claim itself
      holds and is confirmed by imaging of Vps17-GFP on endosomes (PMID:22593205, PMID:24567361). GO:0010008
      endosome membrane is the supported part_of descendant, which this review also adds as a NEW row
      on direct evidence. Endosome is a series organelle, not one of the root organelle terms covered
      by the organelle policy, so the ordinary refinement rule applies; the matching rows from this paper
      on the other retromer subunits are refined the same way.'
    proposed_replacement_terms:
    - id: GO:0010008
      label: endosome membrane
    supported_by:
    - reference_id: PMID:9700157
      supporting_text: assemble together on an endosomal membrane
    - reference_id: PMID:24567361
      supporting_text: Mvp1 and Vps17 retromer SNX-BAR coat tubules that bud from the endosome.
    - reference_id: PMID:9700157
      supporting_text: but rather a peripheral membrane-associated complex
    - reference_id: PMID:9700157
      supporting_text: We also show by immunogold EM that Vps5p is localized to discrete regions at the
        rims of the prevacuolar endosome where vesicles appear to be budding.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: located_in
  supporting_entities:
  - GO:0042147
  review:
    summary: Inter-ontology inference from the process term retrograde transport, endosome to Golgi.
    action: MARK_AS_OVER_ANNOTATED
    reason: No direct evidence for a cytosolic pool of wild-type Vps17. This differs from Vps5, whose
      cytosol row is kept as non-core on direct fractionation of a large soluble Vps5 pool; that pool
      assembles in the same way in vps17Δ cells (PMID:9700157), so it does not show Vps17 in the cytosol.
      It fractionates as a particulate, peripheral membrane protein (PMID:8416961), and it is released
      to the cytoplasm only when PtdIns3P synthesis is impaired (PMID:12244127). Being involved in a transport
      process that runs through the cytosol does not place the protein there. A soluble pool is plausible
      for a peripheral coat protein, so the row is not removed.
    supported_by:
    - reference_id: PMID:8416961
      supporting_text: Vps17p can be released from this particulate fraction by treatment with either
        Triton X-100 or urea, indicating that the Vps17p is peripherally associated with a crude membrane
        fraction.
    - reference_id: PMID:12244127
      supporting_text: observed redistribution of Vps5p and Vps17p to the cytoplasm in these mutants
    - reference_id: PMID:9700157
      supporting_text: cytosolic Vps5p from vps17Δ cells continued to elute in the void volume fraction
