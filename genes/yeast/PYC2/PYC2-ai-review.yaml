  review:
    summary: Pyc1p-Pyc2p interaction detected in a systematic screen for heteromers of paralogs (Marchant
      et al. 2019, DHFR-PCA). Pyruvate carboxylase is a homotetramer, and the two 90%-identical paralogs
      can form mixed oligomers. The interaction is real, but 'protein binding' is uninformative; the relevant
      biology is hetero-oligomerization of the PC tetramer.
    action: REMOVE
    reason: Real paralog heteromerization, but 'protein binding' carries no functional information. Removal
      does not imply the interaction is false; the biology is better expressed as PC tetramer composition.
    supported_by:
    - reference_id: PMID:31454312
      supporting_text: we find that heteromerization is frequent among duplicated homomers
    - reference_id: file:yeast/PYC2/PYC2-uniprot.txt
      supporting_text: 'P32327; P11154: PYC1; NbExp=3'
