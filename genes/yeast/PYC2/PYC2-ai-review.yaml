  review:
    summary: Brewster et al. assessed the roles of PYC1 and PYC2 in fermentative and gluconeogenic growth.
      In the abstract, PYC2 alone (pyc1 null) failed to support growth on ethanol without aspartate, so
      PYC2's contribution to gluconeogenic growth is minor. The full text presumably supports the curator's
      IMP (e.g., phenotype of pyc2 in combination). Pyruvate carboxylase is the canonical gluconeogenic
      entry enzyme, so the annotation is biologically sound and is retained, deferring to the curator.
    action: ACCEPT
