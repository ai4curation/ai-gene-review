  label: Saccharomyces cerevisiae S288C
description: 'PYC2 (YBR218C) encodes pyruvate carboxylase isozyme 2 (EC 6.4.1.1), a biotin-dependent,
  cytosolic, homotetrameric enzyme that is 90% identical to Pyc1p. It catalyses ATP-dependent carboxylation
  of pyruvate to oxaloacetate via a covalently bound biotin carboxyl carrier. Pyc2p contributes the minor
  share of cellular PC activity (about 10-20% in pyc1 nulls) and has kinetic constants for ATP and pyruvate
  indistinguishable from Pyc1p. Pyc2p and Pyc1p are functionally redundant for anaplerotic oxaloacetate
  supply: either alone supports growth on glucose, whereas the double mutant needs aspartate. PYC2 is
  expressed mainly early in growth on glucose, and Pyc2p alone does not support growth on ethanol without
  aspartate. Pyc2p forms mixed oligomers with Pyc1p.'
