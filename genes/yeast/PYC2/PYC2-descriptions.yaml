descriptions:
- source: UniProt
  text: Pyruvate carboxylase catalyzes a 2-step reaction, involving the ATP-dependent
    carboxylation of the covalently attached biotin in the first step and the transfer
    of the carboxyl group to pyruvate in the second.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32327
  source_id: P32327
- source: Alliance_Imported
  text: Pyruvate carboxylase isoform; cytoplasmic enzyme that converts pyruvate to
    oxaloacetate; differentially regulated than isoform Pyc1p; mutations in the human
    homolog are associated with lactic acidosis; PYC2 has a paralog, PYC1, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/PYC2
  source_id: SGD:S000000422
- source: Alliance_Automated
  text: Enables pyruvate carboxylase activity. Involved in gluconeogenesis. Located
    in cytosol. Human ortholog(s) of this gene implicated in pyruvate carboxylase
    deficiency disease. Orthologous to human PC (pyruvate carboxylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PYC2
  source_id: SGD:S000000422
