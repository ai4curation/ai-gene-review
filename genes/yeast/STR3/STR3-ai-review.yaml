  - *id002
suggested_questions:
- question: Is Str3p exclusively peroxisomal (PTS1-dependent), and if so how is cystathionine made by
    cytosolic Str2p delivered to the peroxisome and homocysteine exported?
suggested_experiments:
- description: Image N-terminally tagged Str3p (preserving the -SKL PTS1) in wild-type and pex5 cells,
    and test whether a cytosol-retargeted Str3p (SKL deleted) still supports growth on cysteine as sole
    sulfur source in a met17 background.
