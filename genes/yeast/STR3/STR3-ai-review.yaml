core_functions:
- description: PLP-dependent cleavage of L-cystathionine to L-homocysteine, pyruvate and NH4+ (EC 4.4.1.13),
    the second step of forward trans-sulfuration (cysteine -> homocysteine); also releases thiols from
    other S-substituted cysteines. Probably peroxisomal (PTS1, IDA).
  molecular_function:
    id: GO:0047804
    label: cysteine-S-conjugate beta-lyase activity
  directly_involved_in:
