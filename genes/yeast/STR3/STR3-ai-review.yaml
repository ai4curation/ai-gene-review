taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Cystathionine beta-lyase (Str3p), a PLP-dependent enzyme of the trans-sulfuration family
  that cleaves L-cystathionine to L-homocysteine, pyruvate and ammonia, the second step (after Str2p)
  of the forward trans-sulfuration route converting cysteine into homocysteine and methionine. Str3p also
  acts as a broader cysteine-S-conjugate beta-lyase, releasing volatile thiols such as 3-mercaptohexan-1-ol,
  4-mercapto-4-methylpentan-2-one and 2-furfurylthiol from cysteinylated precursors, which contributes
  to wine and baijiu aroma. str3 disruptants cannot convert cysteine into homocysteine. Str3p ends in
  a C-terminal PTS1 (-SKL) and has been found in peroxisomes.
