id: P32462
gene_symbol: ERG24
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG24 (YNL280C) encodes Delta14-sterol reductase (C-14 sterol reductase, EC 1.3.1.70), a polytopic
  ER membrane enzyme of the ERG4/ERG24 (TM7SF2/LBR/DHCR7-related) family. Using NADPH, it reduces the C14=C15 double
  bond introduced by Erg11-mediated demethylation, converting 4,4-dimethyl-cholesta-8,14,24-trienol to 4,4-dimethylzymosterol
  (4,4-dimethylcholesta-8,24-dienol). It is a principal target of morpholine fungicides (fenpropimorph, tridemorph)
  and 15-azasterol. ERG24 null mutants cannot grow aerobically unless sterol uptake is enabled, and they accumulate
  ignosterol (ergosta-8,14-dienol), showing that the downstream Delta8-7 isomerase and desaturases do not act on
  Delta14 sterols.
