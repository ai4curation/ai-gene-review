    supporting_text: verified that both MET12 and MET13 encode functional MTHFR isozymes
  - reference_id: PMID:10600168
    supporting_text: MTHFR catalyzes the reduction of 5, 10-methylenetetrahydrofolate to 5-methyltetrahydrofolate,
      used to methylate homocysteine in methionine synthesis
suggested_questions:
- question: Under what conditions, if any, does Met12 contribute to cellular 5-methyl-THF production, and why does
    overexpressed Met12 fail to rescue methionine auxotrophy despite having MTHFR activity in vitro?
- question: Is Met12 NADH- or NADPH-dependent, and is it regulated by AdoMet like Met13?
suggested_experiments:
- description: Purify Met12 and measure kinetic parameters with NADH versus NADPH and the effect of AdoMet; test
    localisation of tagged Met12 and its in vivo 5-methyl-THF output in met13 cells by folate profiling.
