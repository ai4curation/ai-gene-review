core_functions:
- description: 'Methylenetetrahydrofolate reductase isozyme: reduces 5,10-methylene-THF to 5-methyl-THF in vitro.
    Its physiological role is unclear, since Met13 supplies the methyl-THF for methionine synthesis.'
  molecular_function:
    id: GO:0004489
    label: methylenetetrahydrofolate reductase [NAD(P)H] activity
  directly_involved_in:
