taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Methylenetetrahydrofolate reductase 1 (MTHFR, EC 1.5.1.20) of Saccharomyces cerevisiae, a minor FAD-containing
  MTHFR isozyme paralogous to Met13 (34% identity). Recombinant Met12 reduces 5,10-methylenetetrahydrofolate to
  5-methyltetrahydrofolate, the methyl donor for homocysteine methylation by methionine synthase. However, met12
  disruption causes no methionine requirement and MET12, even on a multicopy plasmid, cannot complement a met12
  met13 double mutant, so Met12's physiological role is unknown. Its cofactor preference and regulation have not
  been characterised.
