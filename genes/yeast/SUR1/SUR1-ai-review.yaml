suggested_questions:
- question: Where exactly does the Sur1-Csg2 enzyme reside (Golgi cisternae vs ER) and does the vacuolar signal
    in high-throughput datasets reflect a functional pool or turnover?
- question: GO:0006676 (M(IP)2C metabolic process) is classified under GPI anchor metabolic process; is that parentage
    intended, given that M(IP)2C is a free sphingolipid rather than a GPI anchor?
suggested_experiments:
- description: Reconstitute purified Sur1-Csg2 and Csh1-Csg2 in liposomes with defined IPC species (IPC-B/C/D) and
    GDP-mannose to quantify the substrate preferences that distinguish the two paralogs.
