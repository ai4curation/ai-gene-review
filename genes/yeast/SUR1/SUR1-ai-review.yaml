id: P33300
gene_symbol: SUR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Sur1 (Csg1/Bcl21; YPL057C) is the catalytic subunit of an inositol phosphorylceramide (IPC) mannosyltransferase
  of Saccharomyces cerevisiae. It is a multi-pass membrane glycosyltransferase of the GT32 (OCH1-like, DXD-motif)
  family that transfers mannose from GDP-mannose to the inositol of IPC, forming mannosylinositol phosphorylceramide
  (MIPC) (EC 2.4.1.370). Sur1 acts as a heterodimer with the regulatory subunit Csg2; a paralog, Csh1, forms a second
  Csh1-Csg2 enzyme with different ceramide-backbone specificity, so loss of SUR1 alone lowers but does not abolish
  MIPC synthesis, while csg1 csh1 double mutants make no mannosylated sphingolipids. MIPC is the obligatory precursor
  of the major yeast sphingolipid M(IP)2C. Mannosylation is dispensable for growth on rich medium, but csg1 mutants
  accumulate IPC and are killed by high extracellular Ca2+, a phenotype linked to altered cell wall synthesis.
