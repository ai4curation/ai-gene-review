gene_symbol: SUR1
organism: yeast
uniprot_id: P33300
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in the synthesis of mannosyl phosphorylinositol ceramide (PubMed:12954640,
    PubMed:9323360). Catalyzes the addition of mannosyl to phosphorylinositol ceramide.
    Suppressor of RVS161 mutation (PubMed:12954640, PubMed:9323360).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33300
  source_id: P33300
- source: Alliance_Imported
  text: Mannosylinositol phosphorylceramide (MIPC) synthase catalytic subunit; forms
    a complex with regulatory subunit Csg2p; function in sphingolipid biosynthesis
    is overlapping with that of Csh1p; SUR1 has a paralog, CSH1, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SUR1
  source_id: SGD:S000005978
- source: Alliance_Automated
  text: Enables inositol phosphorylceramide mannosyltransferase activity. Involved
    in glycosphingolipid biosynthetic process; mannosyl diphosphorylinositol ceramide
    metabolic process; and mannosyl-inositol phosphorylceramide metabolic process.
    Located in fungal-type vacuole membrane. Part of mannosyltransferase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SUR1
  source_id: SGD:S000005978
