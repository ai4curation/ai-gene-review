descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of the sphingoid long chain bases dihydrosphingosine
    (DHS or sphinganine) and phytosphingosine (PHS) to form dihydrosphingosine 1-phosphate
    (DHS-1P) and phytosphingosine 1-phosphate (PHS-1P) respectively (PubMed:11102354,
    PubMed:11795842, PubMed:16141212, PubMed:25345524, PubMed:9677363). Involved in
    the biosynthesis of sphingolipids and ceramides (PubMed:12493772). Required with
    LCB3 for an effective incorporation of DHS into ceramides through a phosphorylation-dephosphorylation
    cycle. Involved in heat-induced transient cell cycle arrest (PubMed:11056159).
    Accumulation of phosphorylated sphingoid long chain bases (LCBPs) stimulates calcium
    influx and activates calcineurin signaling (PubMed:11278643). Involved in heat-stress
    resistance (PubMed:11967828).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12246
  source_id: Q12246
- source: Alliance_Imported
  text: Sphingoid long-chain base kinase; responsible for synthesis of long-chain
    base phosphates, which function as signaling molecules, regulates synthesis of
    ceramide from exogenous long-chain bases, localizes to the Golgi and late endosomes;
    LCB4 has a paralog, LCB5, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/LCB4
  source_id: SGD:S000005697
- source: Alliance_Automated
  text: Enables sphingosine kinase activity. Involved in calcium-mediated signaling
    and sphingolipid metabolic process. Located in bounding membrane of organelle;
    endoplasmic reticulum subcompartment; and plasma membrane. Human ortholog(s) of
    this gene implicated in type 2 diabetes mellitus. Orthologous to human SPHK1 (sphingosine
    kinase 1) and SPHK2 (sphingosine kinase 2).
  source_type: automated
