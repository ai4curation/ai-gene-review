core_functions:
- description: Major (~97%) sphingoid long-chain-base kinase; ATP-dependent phosphorylation of dihydrosphingosine
    and phytosphingosine to their 1-phosphates, acting from palmitoylation-anchored pools at the plasma membrane/cortical
    ER, both for LCB recycling into ceramide (with Lcb3) and for LCB-1-P signalling/degradation.
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0006669
    label: sphinganine-1-phosphate biosynthetic process
  locations:
  - id: GO:0032541
    label: cortical endoplasmic reticulum
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9677363
    supporting_text: LCB4 encodes most (97%) Saccharomyces LCB kinase activity, with the remainder requiring LCB5.
  - reference_id: PMID:9677363
    supporting_text: Log phase lcb4-deleted yeast cells make no LCB phosphates, showing that the Lcb4 kinase synthesizes
      all detectable LCB phosphates under these growth conditions.
  - reference_id: PMID:17686782
    supporting_text: Remarkably, the localization of Lcb4 is restricted to the cortical ER.
suggested_questions:
- question: Which Lcb4 pool (cortical ER versus plasma membrane) produces the LCB-1-P used for ceramide salvage
    versus signalling?
suggested_experiments:
- description: Tether Lcb4 to the PM or cortical ER via compartment-specific anchors in an lcb4 lcb5 background
    and measure exogenous C17-PHS incorporation into ceramide and LCB-1-P-dependent Ca2+ influx.
