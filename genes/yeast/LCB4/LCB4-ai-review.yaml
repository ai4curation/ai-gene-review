id: Q12246
gene_symbol: LCB4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Lcb4 is the major sphingoid long-chain-base (LCB) kinase of Saccharomyces cerevisiae, accounting for
  about 97% of cellular LCB kinase activity. It phosphorylates dihydrosphingosine and phytosphingosine (and sphingosine
  in vitro) at C-1 using ATP, producing the LCB-1-phosphates that are either dephosphorylated by Lcb3 for reincorporation
  into ceramide or cleaved by the lyase Dpl1 to enter glycerophospholipid metabolism (the route by which phytosphingosine
  yields odd-chain fatty acids). Lcb4 belongs to the DAG-kinase-like sphingosine kinase family but has no transmembrane
  segment; it is synthesised in the cytosol, palmitoylated by Akr1 at the Golgi, delivered to the plasma membrane
  and then to the cortical ER, and is phosphorylated by Pho85 and degraded in the vacuole in stationary phase. Its
  LCB-1-phosphate products act as signals in heat stress and Ca2+ influx.
