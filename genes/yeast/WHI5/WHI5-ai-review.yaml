      regulation" child, so this is the convention for the yeast G1/S transition and the IEA
      term is at an appropriate level for a family mapping.
    supported_by:
    - reference_id: PMID:15210111
      supporting_text: >-
        Deletion of WHI5 bypasses the requirement for upstream activators of the G1/S
