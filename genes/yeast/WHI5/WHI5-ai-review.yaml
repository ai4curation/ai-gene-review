core_functions:
- description: >-
    Whi5 acts as the SBF-bound transcriptional corepressor of the G1/S regulon. In the nucleus
    from mitotic exit through early G1 it binds the promoter-bound Swi4-Swi6 (SBF) transcription
    factor at G1/S promoters (CLN1, CLN2, PCL1 and other SCB-regulated genes) and, together
    with Stb1, recruits the Rpd3(L) histone deacetylase (and Hos3) to keep these promoters
    repressed. Cln3-Cdc28 and Pcl9-Pho85 initiate, and Cln1/2-Cdc28 with Cks1 complete,
    multisite phosphorylation of Whi5 that releases it from SBF and the HDACs and drives
    Msn5-dependent nuclear export; because CLN1/CLN2 are SBF targets, this closes the
    positive-feedback loop that constitutes Start. Whi5 is made at a size-independent rate in
    S/G2/M and diluted by growth in G1, so its nuclear concentration couples cell size to the
    timing of the G1/S transition.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
