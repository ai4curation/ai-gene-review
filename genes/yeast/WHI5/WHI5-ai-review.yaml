id: Q12416
gene_symbol: WHI5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  WHI5 encodes a 295-residue, largely disordered, non-enzymatic transcriptional corepressor
  that gates Start, the budding-yeast G1/S commitment point. From mitotic exit through early G1,
  nuclear Whi5 binds the promoter-bound SBF transcription factor (the Swi4-Swi6 heterodimer) at
  the promoters of G1/S genes such as CLN1, CLN2 and PCL1 and holds the G1/S transcriptional
  program off, in part by recruiting the Rpd3(L) histone deacetylase complex (with Stb1) and
  Hos3. Whi5 has no DNA-binding domain of its own and reaches promoters only through SBF; it
  associates stably with SBF but not with the Mbp1-containing MBF complex, whose corepressor is
  the paralogous Nrm1. Whi5 is thus the functional analog, but not a homolog, of the metazoan
  retinoblastoma protein. In late G1, Cln3-Cdc28 (with Pcl9-Pho85) initiates and Cln1/2-Cdc28
  complete a Cks1-assisted multisite phosphorylation of Whi5 that dissociates it from SBF and
  from the HDACs and drives Msn5-dependent nuclear export; because CLN1/CLN2 are SBF targets this
  is the positive-feedback loop that makes Start switch-like and, under normal conditions,
  irreversible. Whi5 is synthesized in S/G2/M at a size-independent rate and is stable, so it is
  diluted as cells grow in G1; small daughters are born with more Whi5 per volume and delay Start
  longer, which is why whi5 null cells are among the smallest viable yeast mutants and why Whi5 is
  a central component of cell-size homeostasis. When CDK activity falls at the end of mitosis,
  Whi5 is re-imported (Kap60-Kap95, with the Ess1 prolyl isomerase acting on its phospho-Ser-Pro
  nuclear targeting sequences) to repress the next cycle. Nuclear Whi5 also restrains SBF during
  meiotic entry and cell-wall stress (with its paralog Whi7/Srl3), and a recent study reports that
  Whi5 is phosphorylated by Atg1 and promotes nitrogen-starvation-induced autophagy.
