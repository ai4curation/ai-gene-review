- id: PMID:26390151
  title: Dilution of the cell cycle inhibitor Whi5 controls budding-yeast cell size.
  findings:
  - statement: >-
      Whi5 is stable, synthesized in S/G2/M at a size-independent rate, and diluted by growth
      in G1; its concentration, not cell size per se, sets the rate of passage through Start.
    supporting_text: >-
      In this model, cell growth dilutes the cell cycle inhibitor Whi5 to drive progression
      through the cell cycle, whereas Cln3 concentration remains constant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Schmoller et al. 2015, Nature; full text cached and read. The inhibitor-dilution model
      is influential but contested by later titration and network models (see
      suggested_questions); the primary observations used here are not in dispute.
