- term:
    id: GO:0007089
    label: traversing start control point of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:26390151
  qualifier: involved_in
  review:
    summary: >-
      Schmoller et al. 2015 (full text cached) use single-cell time-lapse of Whi5-mCitrine and
      Cln3 reporters to show that Whi5 is a stable protein synthesized in S/G2/M at a
      size-independent rate, that its concentration at birth decreases monotonically with cell
      size, and that the rate at which cells pass Start is set by Whi5 concentration rather
      than by cell size per se (decoupled with an inducible WHI5 allele). Dilution of Whi5 by
      growth is proposed as the size-sensing mechanism that triggers Start.
    action: ACCEPT
    reason: >-
      Whi5 is the inhibitory node of the Start positive-feedback loop (SBF -> CLN1/2 ->
      Cln-Cdc28 -| Whi5 -| SBF) and its concentration is the variable that the loop integrates,
      so it is a bona fide component of the Start commitment process as defined by GO:0007089.
      Whether Whi5 dilution is the sole size sensor is contested (see suggested_questions), but
      that debate does not affect Whi5's participation in Start.
    supported_by:
    - reference_id: PMID:26390151
      supporting_text: >-
        In this model, cell growth dilutes the cell cycle inhibitor Whi5 to drive progression
        through the cell cycle, whereas Cln3 concentration remains constant.
    - reference_id: PMID:26390151
      supporting_text: >-
        Inhibitor-dilution results in size-dependent cell cycle progression because smaller
        cells are born with higher Whi5 concentrations.
