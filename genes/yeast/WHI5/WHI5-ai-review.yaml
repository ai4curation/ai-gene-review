- term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002000919
  - SGD:S000001799
  review:
    summary: >-
      PAINT inference at the Whi5/Whi7 node PTN002000919, seeded by the paralog SRL3/WHI7
      (SGD:S000001799). Whi5 has no recognizable DNA-binding domain (UniProt features: two
      disordered regions and compositionally biased acidic/low-complexity segments only). Its
      promoter occupancy is entirely mediated by SBF: it "associates with G1-specific promoters
      via SBF" (de Bruin et al. 2004) and "is recruited to G1/S promoter elements via its
      interaction with SBF/MBF" (Costanzo et al. 2004), and promoter association requires an
      intact Swi4-Swi6 complex. The sequence specificity at SCB elements is contributed by
      Swi4, not by Whi5 or Whi7, so the sequence-specific DNA-binding claim is a role
      conflation: ChIP occupancy of a corepressor has been read as DNA binding.
    action: MODIFY
    reason: >-
      The essence of the annotation (Whi5 is found at Pol II cis-regulatory regions of G1/S
      genes) is right, but the molecular function it asserts, sequence-specific DNA binding, is
      performed by the Swi4 subunit of SBF that recruits Whi5. The activity Whi5 itself
      contributes at those sites is binding to the DNA-bound transcription factor, which is
      already captured experimentally by GO:0061629 (IDA, PMID:15210111) and is the proposed
      replacement. If a DNA-occupancy row is wanted for the family, the non-sequence-specific
      parent GO:0001012 (RNA polymerase II transcription regulatory region DNA binding), as used
      for the analogous human RB1 IBA in this repository, would be the defensible alternative.
      This argues with the node placement (the family lacks a DNA-binding domain; neither
      paralog binds DNA independently), not with the donor count.
    proposed_replacement_terms:
    - id: GO:0061629
      label: RNA polymerase II-specific DNA-binding transcription factor binding
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002000919
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Whi5/Whi7 ancestral node; the family is defined by the Pfam Whi5 (PF08528) G1/S
          transcription-factor-binding module and carries no DNA-binding domain.
      - source_id: SGD:S000001799
        source_label: SRL3
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Whi7/Srl3 is the SBF-recruited paralog; the evidence behind its own GO:0000978 row was
          not inspected here, but like Whi5 it reaches promoters through SBF.
    supported_by:
    - reference_id: PMID:15210110
      supporting_text: >-
        Whi5 associates with G1-specific promoters via SBF during early G1 phase, then
        dissociates coincident with transcriptional activation.
    - reference_id: PMID:15210111
      supporting_text: >-
        Whi5 is recruited to G1/S promoter elements via its interaction with SBF/MBF in vivo
        and in vitro.
    - reference_id: PMID:19823668
      supporting_text: >-
        Whi5 associates indirectly with G1 phase-regulated promoters through interaction with
        SBF and MBF.
    - reference_id: file:yeast/WHI5/WHI5-deep-research-falcon.md
      supporting_text: >-
        Whi5 does not catalyze a reaction and is not known to bind DNA sequence-specifically by
        itself.
