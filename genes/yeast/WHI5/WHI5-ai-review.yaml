proposed_new_terms: []
suggested_questions:
- question: >-
    The yeast Start machinery, including the repressors Whi5, Stb1, Sic1 and Whi7, is
    annotated involved_in GO:0000082 (G1/S transition), whereas metazoan Rb carries
    GO:2000134 (negative regulation of G1/S transition). Is the "component of the switch"
    convention for yeast repressors intended, and should Whi5 and Rb be aligned in one
    direction or the other for cross-species comparison?
  experts:
  - Curt Wittenberg
  - Mike Tyers
  - Brenda Andrews
- question: >-
    Whi5 dilution (Schmoller et al. 2015) competes with Cln3 titration against SBF sites and
    with distributed-network models (Swi6 phosphorylation, Bck2) as the size sensor. Which
    variable is rate-limiting for Start in daughter cells under physiological growth
    conditions, and is Whi5 concentration or Whi5 phospho-state the operative readout?
  experts:
  - Jan M. Skotheim
  - Kurt M. Schmoller
- question: >-
    Whi5 is now reported to promote nitrogen-starvation-induced autophagy as an Atg1 substrate
    (Han et al. 2025). Is this a direct, non-transcriptional role of cytoplasmic Whi5, or an
    indirect consequence of altered SBF-dependent transcription and cell size in whi5 cells?
  experts: []
suggested_experiments:
- hypothesis: >-
    The autophagy phenotype of whi5 cells is a direct consequence of Atg1-dependent
    phosphorylation of cytoplasmic Whi5, separable from its SBF corepressor function.
  description: >-
    Compare GFP-Atg8 processing and Atg1 puncta formation in whi5 cells complemented with (i)
    wild-type WHI5, (ii) the Atg1-site mutant WHI5-S78A/S149A, (iii) a WHI5 allele lacking the
    SBF-binding module so that it cannot repress the G1/S regulon, and (iv) a
    nuclear-restricted WHI5 (12A/NES-mutant) allele, all expressed from the native promoter and
    matched for cell size by growth in a swi4 or bck2 background. A direct role predicts that
    (iii) and (iv) behave differently: the SBF-binding-defective allele should rescue autophagy
    while the nuclear-trapped allele should not.
  experiment_type: structure-function complementation with autophagy flux readouts
- hypothesis: >-
    Whi5 corepressor activity at CLN1/CLN2 promoters requires Rpd3(L) and Hos3 recruitment, and
    the residual repression seen in rpd3 hos3 cells is due to direct masking of the Swi6
    activation surface.
  description: >-
    Perform synchronized (elutriated daughter) time courses of CLN2 nascent transcription
    (4tU-seq) and promoter histone acetylation in wild type, whi5, rpd3 hos3, and whi5 rpd3
    hos3 strains, and in a whi5 allele mutated in the Pfam Whi5 (PF08528) SBF-binding motif.
    Epistasis of whi5 over rpd3 hos3 for early-G1 repression, combined with in vitro
    transcription with purified SBF and Whi5 on a chromatinized CLN2 template with and without
    Rpd3(L), would separate HDAC-dependent from HDAC-independent repression.
  experiment_type: genetic epistasis with nascent transcription and in vitro transcription
