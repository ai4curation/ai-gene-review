gene_symbol: WHI5
organism: yeast
uniprot_id: Q12416
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Transcriptional repressor that negatively regulates G1- specific, SBF- and
    MBF-dependent transcription. Binds via SBF to promoters of G1-specific genes to
    repress transcription in early G1. During G1, phosphorylated by cyclin-CDK CLN3-CDC28
    and progressively hyperphosphorylated by CDK associated with other G1-cyclins,
    which leads to dissociation of WHI5 from SBF, activating SBF-dependent transcription
    in late G1. Elimination of CDK activity at the end of mitosis by the mitotic exit
    network (MEN) allows WHI5 to reassociate with SBF to again repress G1/S transcription.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12416
  source_id: Q12416
- source: Alliance_Imported
  text: Repressor of G1 transcription; binds SCB binding factor (SBF) at SCB target
    promoters in early G1; phosphorylation by G1 cyclin/Cdc28p relieves repression
    and promoter binding by Whi5p, drives nuclear export, and contributes to the determination
    of critical cell size at START and cell fate; dephosphorylated and re-imported
    into the nucleus post-START during the starvation response, reversing commitment;
    repressed in M/early G phase; autophagy regulator and Atg1p substrate; functional
    Rb homolog
  source_type: curated
  url: https://www.yeastgenome.org/locus/WHI5
  source_id: SGD:S000005609
- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity and transcription corepressor activity. Involved in G1/S transition of
    mitotic cell cycle; negative regulation of transcription by RNA polymerase II;
    and traversing start control point of mitotic cell cycle. Acts upstream of or
    within positive regulation of autophagy. Located in cytoplasm and nucleus. Part
    of SBF transcription complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/WHI5
  source_id: SGD:S000005609
