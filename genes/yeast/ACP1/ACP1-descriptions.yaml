gene_symbol: ACP1
organism: yeast
uniprot_id: P32463
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Carrier of the growing fatty acid chain in fatty acid biosynthesis (By similarity).
    May be involved in the synthesis of very- long-chain fatty acids. Accessory and
    non-catalytic subunit of the mitochondrial membrane respiratory chain NADH dehydrogenase
    (Complex I), which functions in the transfer of electrons from NADH to the respiratory
    chain (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32463
  source_id: P32463
- source: Alliance_Imported
  text: Mitochondrial matrix acyl carrier protein; involved in biosynthesis of octanoate,
    which is a precursor to lipoic acid; coordinates mitochondrial fatty acid and
    iron sulfur cluster metabolism; activated by phosphopantetheinylation catalyzed
    by Ppt2p
  source_type: curated
  url: https://www.yeastgenome.org/locus/ACP1
  source_id: SGD:S000001675
- source: Alliance_Automated
  text: Predicted to enable acyl binding activity and acyl carrier activity. Involved
    in iron-sulfur cluster assembly and lipoate biosynthetic process. Located in mitochondrion.
    Part of mitochondrial [2Fe-2S] assembly complex. Orthologous to human NDUFAB1
    (NADH:ubiquinone oxidoreductase subunit AB1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ACP1
  source_id: SGD:S000001675
