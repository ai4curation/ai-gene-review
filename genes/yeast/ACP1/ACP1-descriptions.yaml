descriptions:
- source: UniProt
  text: Carrier of the growing fatty acid chain in fatty acid biosynthesis (By similarity).
    May be involved in the synthesis of very- long-chain fatty acids. Accessory and
    non-catalytic subunit of the mitochondrial membrane respiratory chain NADH dehydrogenase
    (Complex I), which functions in the transfer of electrons from NADH to the respiratory
    chain (By similarity).
  source_type: curated
