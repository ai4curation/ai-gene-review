- question: Which acyl-chain lengths on Acp1 are bound in the Isd11 complex in vivo, and does the acylation
    state signal mitochondrial acetyl-CoA/FAS II status to Fe-S biogenesis?
- question: Does yeast Acp1 interact with other LYR-motif proteins (as mammalian ACP does) despite the
    absence of Complex I in S. cerevisiae?
