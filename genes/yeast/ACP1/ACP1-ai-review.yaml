  review:
    summary: 'Van Vranken et al. 2016: Acp1 is a stable subunit of the yeast ISU complex (Nfs1-Isd11-Isu1);
      Acp1 knockdown destabilises Nfs1-Isd11 and depletes FeS cluster proteins, and the 4-PP acyl chain
      is required. Acp1 contributes structurally to the cysteine desulfurase step, so it participates
      in Fe-S cluster assembly. Core process (second role).'
