description: 'ACP1 (YKL192C) encodes the mitochondrial acyl carrier protein, a small acidic protein that
  is activated by attachment of a 4''-phosphopantetheine (4-PP) prosthetic group by the mitochondrial
  phosphopantetheinyl transferase Ppt2. Holo-Acp1 carries malonyl and growing acyl chains as thioesters
  between the dissociated enzymes of mitochondrial type II fatty acid synthesis (FAS II: Mct1, Cem1, Oar1,
  Htd2, Etr1), whose main product, octanoyl-ACP, is the precursor for lipoic acid synthesis and protein
  lipoylation of mitochondrial 2-oxoacid dehydrogenases and the glycine cleavage system; acp1 null mutants
  retain only 5-10% of wild-type lipoic acid and are respiratory deficient. Acp1 is also a stable, essential
  subunit of the mitochondrial iron-sulfur cluster assembly complex, where its acyl-4-PP chain binds Isd11
  and stabilises the Nfs1-Isd11 cysteine desulfurase, coupling FAS II to Fe-S cluster biogenesis. Unlike
  mammalian and Neurospora ACPs, yeast Acp1 is not a Complex I subunit, because S. cerevisiae lacks Complex
  I.'
