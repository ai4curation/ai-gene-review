descriptions:
- source: UniProt
  text: Hydroxymethylglutaryl-CoA synthase; part of the first module of ergosterol
    biosynthesis pathway that includes the early steps of the pathway, conserved across
    all eukaryotes, and which results in the formation of mevalonate from acetyl-coenzyme
    A (acetyl-CoA) (PubMed:12702274). ERG13 condenses acetyl-CoA with acetoacetyl-CoA
    to form hydroxymethylglutaryl-CoA (HMG-CoA) (PubMed:12702274). The first module
    starts with the action of the cytosolic acetyl-CoA acetyltransferase ERG10 that
    catalyzes the formation of acetoacetyl- CoA. The hydroxymethylglutaryl-CoA synthase
    ERG13 then condenses acetyl-CoA with acetoacetyl-CoA to form HMG-CoA. The rate-limiting
    step of the early module is the reduction to mevalonate by the 3-hydroxy-3- methylglutaryl-coenzyme
    A (HMG-CoA) reductases HMG1 and HMG2 which are derived from a single ancestral
    HMGR gene by gene duplication (PubMed:32679672).
