id: P54839
gene_symbol: ERG13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG13 (YML126C) encodes 3-hydroxy-3-methylglutaryl-CoA (HMG-CoA) synthase (EC 2.3.3.10),
  the thiolase-superfamily condensing enzyme that joins acetyl-CoA to acetoacetyl-CoA (made by Erg10)
  to form (S)-HMG-CoA, the second step of the mevalonate pathway. HMG-CoA is reduced to mevalonate by
  the ER-membrane HMG-CoA reductases Hmg1 and Hmg2, and the pathway supplies isopentenyl diphosphate for
  ergosterol, dolichol, ubiquinone and prenylated proteins. S. cerevisiae has a single HMG-CoA synthase
  (no ketogenic mitochondrial isoform); erg13 mutants deficient in the activity are sterol auxotrophs
  and, under strict anaerobiosis, also require mevalonate. The enzyme acts in the cytosol; genome-wide
  GFP also detects a nuclear signal.
