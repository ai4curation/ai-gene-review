  review:
    summary: NAS from the Hu et al. 2017 review. The review's body text assigns the HMG-CoA synthase and
      HMG-CoA reductase steps to mitochondria; the reductase part is demonstrably wrong (Hmg1/Hmg2 are
      ER/nuclear-envelope membrane proteins), and no primary study cited here shows a mitochondrial Erg13
      pool. S. cerevisiae has a single HMG-CoA synthase with no mitochondrial targeting signal reported
      and no ketogenic (HMGCS2-like) role. Pathway databases and UniProt place the first module in the
      cytosol.
    action: REMOVE
    reason: Author statement in a review that conflicts with primary localisation data for the same pathway
      step; no experimental support for mitochondrial Erg13.
    supported_by:
    - reference_id: PMID:28904410
