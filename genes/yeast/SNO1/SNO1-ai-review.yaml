id: Q03144
gene_symbol: SNO1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  SNO1 (YMR095C) encodes the glutaminase subunit (PdxT/Pdx2 family, class-I glutamine amidotransferase)
  of the two-subunit pyridoxal 5'-phosphate (PLP) synthase of the fungal-type de novo vitamin B6 pathway.
  Sno1 forms a complex with the synthase subunit Snz1, which activates it. Within the complex Sno1 hydrolyses
  L-glutamine to L-glutamate and ammonia and channels the ammonia to Snz1, which condenses it with ribose
  5-phosphate and glyceraldehyde 3-phosphate to form PLP. Sno1 is cytoplasmic and is encoded divergently
  from SNZ1. It is needed for optimal PLP synthesis and for growth without vitamin B6 under some conditions;
  the SNO2/SNO3 paralogs are induced by thiamine limitation.
