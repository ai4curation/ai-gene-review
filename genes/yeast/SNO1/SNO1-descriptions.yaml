gene_symbol: SNO1
organism: yeast
uniprot_id: Q03144
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the hydrolysis of glutamine to glutamate and ammonia as part of
    the biosynthesis of pyridoxal 5'-phosphate. The resulting ammonia molecule is
    channeled to the active site of a SNZ isoform.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03144
  source_id: Q03144
- source: Alliance_Imported
  text: Protein of unconfirmed function; involved in pyridoxine metabolism; expression
    is induced during stationary phase; forms putative glutamine amidotransferase
    complex with Snz1p, with Sno1p serving as the glutaminase; sno1-Δ affects abundance
    of mRNA from downstream gene CTF13
  source_type: curated
  url: https://www.yeastgenome.org/locus/SNO1
  source_id: SGD:S000004701
- source: Alliance_Automated
  text: Contributes to glutaminase activity. Involved in L-glutamine catabolic process;
    negative regulation of apoptotic process; and vitamin B6 biosynthetic process.
    Located in cytoplasm. Part of glutaminase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SNO1
  source_id: SGD:S000004701
