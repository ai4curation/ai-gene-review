      acts as a protein bridge to the Erg6p enzyme required for the next ergosterol biosynthetic step
suggested_questions:
- question: Does Erg28 only position Erg25/26/27 or does it also channel the C-4 oxidised sterol intermediates
    between active sites, and why is the erg28 null not an ergosterol auxotroph?
suggested_experiments:
- description: Reconstitute Erg25, Erg26 and Erg27 in proteoliposomes with and without Erg28 and compare
    C-4 demethylation flux and intermediate release, to test whether the scaffold increases catalytic
    efficiency or substrate channelling.
