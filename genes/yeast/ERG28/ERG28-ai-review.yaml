id: P40030
gene_symbol: ERG28
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG28 (YER044C) encodes a small, multi-pass endoplasmic reticulum membrane protein of the
  conserved ERG28 family that has no catalytic activity of its own. It acts as a transmembrane scaffold
  that tethers the sterol C-4 demethylation enzymes Erg25 (C-4 methylsterol oxidase), Erg26 (C-3 sterol
  dehydrogenase/C-4 decarboxylase) and Erg27 (3-ketosteroid reductase) into an ER-membrane complex, and
  bridges this complex to the downstream C-24 sterol methyltransferase Erg6 and to other ergosterol enzymes
  (Erg11, Erg1). Loss of ERG28 causes slow growth and accumulation of 3-keto and carboxylic acid sterol
  intermediates of C-4 demethylation, without full ergosterol auxotrophy. Orthologues occur in fission
  yeast, plants and humans.
