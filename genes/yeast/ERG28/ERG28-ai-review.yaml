core_functions:
- description: Non-catalytic ER-membrane scaffold that tethers Erg25, Erg26 and Erg27 into the sterol
    C-4 demethylation complex and bridges it to Erg6 and other ergosterol enzymes, enabling efficient
    C-4 demethylation.
