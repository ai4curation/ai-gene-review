id: P12683
gene_symbol: HMG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'HMG1 (YML075C) encodes 3-hydroxy-3-methylglutaryl-coenzyme A reductase isozyme 1 (EC 1.1.1.34),
  which catalyses the NADPH-dependent reduction of (S)-HMG-CoA to (R)-mevalonate and CoA, the rate-limiting
  step of the mevalonate pathway that supplies isoprenoids for ergosterol, dolichol, ubiquinone and protein
  prenylation. Hmg1 is a polytopic membrane protein of the ER and nuclear envelope with an N-terminal
  membrane domain containing a sterol-sensing domain and a C-terminal cytosolic class I HMGR catalytic
  domain. Hmg1 provides most (>=83%) of cellular HMGR activity and is functionally redundant with its
  paralog Hmg2: either single null mutant is viable but the double mutant cannot germinate or grow. At
  elevated levels Hmg1 concentrates in the nuclear envelope and induces stacked ER membrane proliferations
  (karmellae). Hmg1 forms heteromers with Hmg2 in interactome studies.'
