descriptions:
- source: UniProt
  text: HMG-CoA reductase; part of the first module of ergosterol biosynthesis pathway
    constitutes by the early steps of the pathway, conserved across all eukaryotes,
    and which results in the formation of mevalonate from acetyl-coenzyme A (acetyl-CoA)
    (PubMed:3065625, PubMed:3526336). HMG1 and HMG2 catalyze the reduction of hydroxymethylglutaryl-CoA
    (HMG-CoA) to mevalonate that is the rate- limiting step within the first mosule
    (PubMed:3526336). The first module starts with the action of the cytosolic acetyl-CoA
    acetyltransferase ERG10 that catalyzes the formation of acetoacetyl- CoA. The
    hydroxymethylglutaryl-CoA synthase ERG13 then condenses acetyl-CoA with acetoacetyl-CoA
    to form HMG-CoA. The rate-limiting step of the early module is the reduction to
    mevalonate by the 3-hydroxy-3- methylglutaryl-coenzyme A (HMG-CoA) reductases
    HMG1 and HMG2 which are derived from a single ancestral HMGR gene by gene duplication
    (PubMed:32679672).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P12683
  source_id: P12683
- source: Alliance_Imported
  text: HMG-CoA reductase; catalyzes conversion of HMG-CoA to mevalonate, which is
    a rate-limiting step in sterol biosynthesis; one of two isozymes; localizes to
    nuclear envelope; overproduction induces formation of karmellae; forms foci at
    nuclear periphery upon DNA replication stress; expressed almost exclusively on
    the peri-nuclear side of the ER; human homolog HMGCR can complement yeast hmg1
    mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/HMG1
  source_id: SGD:S000004540
- source: Alliance_Automated
  text: Enables hydroxymethylglutaryl-CoA reductase (NADPH) activity. Involved in
    ergosterol biosynthetic process. Located in endoplasmic reticulum membrane and
    nuclear envelope. Is active in endoplasmic reticulum. Human ortholog(s) of this
    gene implicated in several diseases, including attention deficit hyperactivity
    disorder; coronary artery disease (multiple); diabetes mellitus (multiple); muscular
    disease (multiple); and neurodegenerative disease (multiple). Orthologous to human
    HMGCR (3-hydroxy-3-methylglutaryl-CoA reductase).
  source_type: automated
