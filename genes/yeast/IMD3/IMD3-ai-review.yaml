id: P50095
gene_symbol: IMD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: IMD3 (YLR432W) encodes an inosine-5'-monophosphate dehydrogenase (IMPDH; EC 1.1.1.205), one
  of three expressed IMPDH paralogs in S. cerevisiae together with IMD2 and IMD4 (IMD1 is a poorly expressed
  subtelomeric paralog). It catalyses the NAD+-dependent oxidation of IMP to XMP, the first committed
  and rate-limiting step in guanine nucleotide synthesis. Unlike IMD2, IMD3 is not the drug-inducible,
  mycophenolic acid-resistant paralog, and its loss does not cause drug sensitivity. Imd3 forms homotetramers
  and can form mixed tetramers with its close paralog Imd4. The enzyme is cytoplasmic; it has also been
  recovered in mRNP capture experiments.
