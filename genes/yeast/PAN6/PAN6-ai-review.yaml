  label: Saccharomyces cerevisiae S288C
description: Pan6 (YIL145C) is the pantoate--beta-alanine ligase (pantothenate synthetase, PanC family; EC 6.3.2.1)
  of Saccharomyces cerevisiae. It condenses (R)-pantoate with beta-alanine in an ATP-dependent reaction (via a pantoyl-adenylate
  intermediate) to form (R)-pantothenate, vitamin B5, the precursor of coenzyme A. The yeast gene complements an
  E. coli panC mutant and is required for pantothenate prototrophy. Pan6 is found in the cytoplasm, with some nuclear
  signal in GFP surveys.
