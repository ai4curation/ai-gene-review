suggested_questions:
- question: What fraction of cellular D-2-hydroxyglutarate comes from Ser33 versus Ser3 under glucose
    versus non-fermentable growth, and does it have any physiological role?
- question: Do Ser3/Ser33 hetero-tetramers have distinct kinetic or allosteric (serine feedback) properties
    compared with homo-tetramers?
suggested_experiments:
- description: Purify Ser33 homo- and Ser3/Ser33 hetero-oligomers and compare 3-phosphoglycerate turnover
    and serine inhibition.
- description: Quantify D-2HG in ser33, ser3 and double mutants under defined carbon/nitrogen conditions
    with serine supplementation to separate side-activity from pathway flux.
