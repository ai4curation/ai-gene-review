- description: NAD+-dependent oxidation of 3-phosphoglycerate to 3-phosphohydroxypyruvate (EC 1.1.1.95),
    step 1 of the phosphorylated L-serine pathway; main isozyme on glucose, redundant with SER3.
  molecular_function:
