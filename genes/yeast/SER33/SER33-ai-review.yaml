id: P40510
gene_symbol: SER33
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SER33 encodes D-3-phosphoglycerate dehydrogenase 2, one of two paralogous NAD+-dependent
  enzymes (with SER3) that oxidize the glycolytic intermediate 3-phosphoglycerate to 3-phosphohydroxypyruvate,
  the first and committed step of the phosphorylated pathway of L-serine (and hence glycine) biosynthesis.
  Loss of both SER3 and SER33 abolishes phosphoglycerate dehydrogenase activity and causes serine/glycine
  auxotrophy on glucose, whereas on non-fermentable carbon sources the glyoxylate route supplies serine.
  Ser33 is considered the main isoenzyme during growth on glucose and is co-regulated with SER1 and SER2
  by nitrogen source. It is a soluble cytosolic member of the D-isomer specific 2-hydroxyacid dehydrogenase
  family that forms homo-oligomers and hetero-oligomers with Ser3. As a side activity it reduces 2-oxoglutarate
  to D-2-hydroxyglutarate with NADH, making Ser3/Ser33 major sources of cellular D-2-hydroxyglutarate.
