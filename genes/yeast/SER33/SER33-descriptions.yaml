gene_symbol: SER33
organism: yeast
uniprot_id: P40510
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the reversible oxidation of 3-phospho-D-glycerate to 3-phosphonooxypyruvate,
    the first step of the phosphorylated L- serine biosynthesis pathway. Also catalyzes
    the reversible oxidation of 2-hydroxyglutarate to 2-oxoglutarate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40510
  source_id: P40510
- source: Alliance_Imported
  text: 3-phosphoglycerate dehydrogenase and alpha-ketoglutarate reductase; 3PG dehydrogenase
    that catalyzes the first step in serine and glycine biosynthesis; also functions
    as an alpha-ketoglutarate reductase, converting alpha-ketoglutarate to D-2-hydroxyglutarate
    (D-2HG); localizes to the cytoplasm; SER33 has a paralog, SER3, that arose from
    the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SER33
  source_id: SGD:S000001336
- source: Alliance_Automated
  text: Enables (R)-2-hydroxyglutarate (NAD+) dehydrogenase activity and identical
    protein binding activity. Involved in L-serine biosynthetic process. Located in
    cytoplasm. Human ortholog(s) of this gene implicated in Neu-Laxova syndrome 1;
    PHGDH deficiency; and amino acid metabolic disorder. Orthologous to human PHGDH
    (phosphoglycerate dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SER33
  source_id: SGD:S000001336
