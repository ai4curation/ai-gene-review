id: Q05902
gene_symbol: ECM38
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Gamma-glutamyltransferase (gamma-glutamyltranspeptidase, glutathione hydrolase; EC 2.3.2.2 / 3.4.19.13)
  of Saccharomyces cerevisiae, also known as CIS2. Ecm38 is a glycosylated type II membrane protein of the vacuolar
  membrane, synthesised as a proenzyme that autocatalytically splits into heavy and light chains. It cleaves the
  gamma-glutamyl bond of glutathione and glutathione S-conjugates, releasing glutamate (or transferring the gamma-glutamyl
  group to an acceptor amino acid) and Cys-Gly, and is the main enzyme initiating degradation of glutathione stored
  in the vacuole. Expression is induced by nitrogen starvation and repressed by ammonium, consistent with vacuolar
  glutathione serving as a nitrogen and sulfur reserve. Ecm38 also contributes to processing of vacuolar glutathione-xenobiotic
  conjugates.
