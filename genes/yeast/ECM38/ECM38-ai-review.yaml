suggested_questions:
- question: Which Cys-Gly dipeptidase completes vacuolar glutathione hydrolysis after Ecm38 (Dug1 is cytosolic),
    or is Cys-Gly exported from the vacuole first?
- question: Does Ecm38 predominantly hydrolyse or transpeptidate in vivo, and what are its physiological gamma-glutamyl
    acceptors?
suggested_experiments:
- hypothesis: Ecm38-released Cys-Gly is exported from the vacuole and cleaved by cytosolic Dug1.
  description: Follow isotope-labelled vacuolar GSH in wild-type, ecm38, dug1 and ecm38 dug1 strains after nitrogen
    starvation, quantifying vacuolar vs cytosolic Cys-Gly, Cys and Glu by LC-MS.
