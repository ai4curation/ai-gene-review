  review:
    summary: YeastPathways superpathway of glutathione metabolism (PWY3O-114) places the gamma-glutamyltransferase
      reaction in the cytosol by default. Ecm38 is a vacuolar membrane enzyme, not a cytosolic one.
    action: REMOVE
    reason: Ecm38 is a vacuolar-membrane glycoprotein (type II single-pass, active site in the lumen-facing light
      chain) acting on glutathione stored in the vacuole. The YeastPathways pathway-to-GO-CAM conversion assigns
      a default cytosolic location to the reaction, which is contradicted by fractionation and enzymology placing
      the activity on the vacuole.
