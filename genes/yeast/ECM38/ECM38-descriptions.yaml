gene_symbol: ECM38
organism: yeast
uniprot_id: Q05902
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the transfer of the gamma-glutamyl moiety of glutathione (GSH) and
    other gamma-glutamyl compounds to amino acids and peptides. Major GSH-degrading
    enzyme, catalyzing the hydrolytic release of L-glutamate from GSH. Plays a role
    in the turnover of the vacuolar GSH, serving as an alternative nitrogen source
    during nitrogen starvation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05902
  source_id: Q05902
- source: Alliance_Imported
  text: Gamma-glutamyltranspeptidase; major glutathione-degrading enzyme; involved
    in detoxification of electrophilic xenobiotics; expression induced mainly by nitrogen
    starvation
  source_type: curated
  url: https://www.yeastgenome.org/locus/ECM38
  source_id: SGD:S000004290
- source: Alliance_Automated
  text: Enables glutathione gamma-glutamate hydrolase. Involved in glutathione catabolic
    process and xenobiotic metabolic process. Located in fungal-type vacuole. Human
    ortholog(s) of this gene implicated in disease of metabolism and gamma-glutamyl
    transpeptidase deficiency. Orthologous to several human genes including GGT1 (gamma-glutamyltransferase
    1); GGT2P (gamma-glutamyltransferase 2, pseudogene); and GGT3P (gamma-glutamyltransferase
    3 pseudogene).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ECM38
  source_id: SGD:S000004290
