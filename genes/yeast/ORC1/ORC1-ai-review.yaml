- id: file:yeast/ORC1/ORC1-deep-research-falcon.md
  title: Falcon deep research report on ORC1 (yeast)
  findings:
  - statement: 'Orc1 (YML065W; UniProt P54784) is the largest, ~914-aa subunit of
      the heterohexameric

      origin recognition complex (ORC, Orc1-6), with an N-terminal BAH domain and
      a

      C-terminal AAA+ ATPase region.

      '
    supporting_text: encodes **Origin Recognition Complex subunit 1 (Orc1)**, a ~914-aa
      protein that is part of the heterohexameric ORC (Orc1–6)
    reference_section_type: OTHER
  - statement: 'Orc1 has two separable functional modules: an AAA+ initiator module
      for ATP-dependent

      origin recognition/licensing, and an N-terminal BAH chromatin-binding module
      that

      mediates nucleosome binding and recruitment to silencing-associated chromatin.

      '
    supporting_text: an **AAA+ initiator module** contributing to ATP-dependent origin
      recognition/licensing, and an N-terminal **BAH chromatin-binding module** that
      mediates nucleosome binding and recruitment to silencing-associated chromatin
      sites
    reference_section_type: OTHER
  - statement: 'Orc1 is the only ORC subunit experimentally demonstrated to have ATPase
      activity,

      and ATP binding by Orc1 is required for ORC DNA binding, while ATP hydrolysis
      is

      not always required for the binding step itself.

      '
    supporting_text: Functional evidence further indicates that **ATP binding by Orc1
      is required for ORC DNA binding**, while ATP hydrolysis is not always required
      for the binding step itself
    reference_section_type: OTHER
  - statement: 'ORC binds sequence-defined ARS elements and, with Cdc6 and Cdt1, loads
      MCM2-7 to

      form the pre-replicative complex; in early G1 ORC recruits Cdc6 then Cdt1-MCM2-7,

      loading MCM one hexamer at a time into a head-to-head double hexamer.

      '
    supporting_text: In early G1, ORC (including Orc1) recruits **Cdc6**, then **Cdt1–MCM2–7**,
      loading MCM one hexamer at a time to form a head-to-head MCM double hexamer
    reference_section_type: OTHER
  - statement: 'The Orc1 BAH-nucleosome complex was solved at 3.3 Angstrom, with BAH
      making

      extensive contacts to core histones and burying ~1590 square Angstrom of surface;

      unlike Sir3, Orc1 BAH does not strongly discriminate H4K16 acetylation state.

      '
    supporting_text: A structural study determined the Orc1 BAH–nucleosome complex
      at **3.3 Å** and reported that Orc1 BAH forms extensive contacts with core histones,
      **burying ~1590 Å²** of surface
    reference_section_type: OTHER
