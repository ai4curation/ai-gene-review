- id: PMID:38597680
  title: Ordered and disordered regions of the Origin Recognition Complex direct differential
    in vivo binding at distinct motif sequences.
  findings:
  - statement: 'Genome-wide mapping of 38 designed ORC mutants showed that the yeast
      ORC uses separable elements for different binding-site classes: Orc1-BP4 and
      either Orc4-IH or Orc1-BP3 at replication origins, and the Orc1 BAH domain at
      motif-lacking silencing-associated sites.'
    supporting_text: To define the ORC elements guiding its DNA binding in vivo, we
      mapped genomic locations of 38 designed ORC mutants, revealing that different
      ORC elements guide binding at different sites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified 2024 full-text Nucleic Acids Research paper.
      It directly refines the Orc1 origin-binding and BAH-dependent silencing-site
      model and was found during the 2026 IBA/new-literature pass.
- id: PMID:42100701
  title: An Orc1 initiator-specific motif (ISM)-related region limits ORC-ssDNA binding
    and promotes replication origin specificity in budding yeast.
  findings:
  - statement: A conserved ISM-related region of the Orc1 AAA+ domain restrains ORC
      binding to single-stranded DNA, coupling faithful ARS origin selection to repression
      of higher-order ORC-ssDNA complexes.
    supporting_text: Mutations of the Orc1 ISM-related region increase ORC binding
      to ssDNA and promote higher-order ORC-ssDNA complex formation in vitro, indicating
      that this region normally limits ORC-ssDNA binding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified 2026 full-text Frontiers in Microbiology paper
      found during the October 2026 current-literature check. It refines the Orc1
      origin-specificity model without changing the curated core GO functions.
