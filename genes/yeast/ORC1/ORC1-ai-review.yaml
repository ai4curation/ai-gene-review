- term:
    id: GO:0033314
    label: mitotic DNA replication checkpoint signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  retired: true
  review:
    summary: This IBA over-interprets the replication checkpoint phenotype of ORC
      inactivation. Yeast Orc1 is an origin-recognition and pre-RC assembly factor;
      conditional ORC1/ORC2/ORC5 defects cause incomplete replication and consequent
      checkpoint arrest, but that does not make Orc1 a direct participant in checkpoint
      signaling.
    action: REMOVE
    reason: The current ORC1 GOA refresh no longer carries this IBA, and the refreshed
      PTHR10763 PAINT cache has no GO:0033314 IBD assertion at PTN000080056. Biologically,
      PMID:16716188 describes DNA damage and spindle checkpoint arrest downstream
      of incomplete replication in ORC mutants, so the checkpoint term conflates a
      phenotype caused by ORC inactivation with the checkpoint-signaling machinery.
    supported_by:
    - reference_id: PMID:16716188
      supporting_text: Defective initiation in ORC mutant cells results in incomplete
        replication and mitotic arrest enforced by the DNA damage and spindle assembly
        checkpoint pathways.
    propagation_review:
      root_cause: SOURCE_STALE_OR_MISSING
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000080056
        source_label: PTN000080056
        source_status: SOURCE_STALE_OR_MISSING
        comment: The historical GOA row pointed this checkpoint IBA at PTN000080056,
          but the refreshed PTHR10763 PAINT table has no GO:0033314 IBD for that node
          and current GOA no longer emits the ORC1 row. The checkpoint term also describes
          perturbation-triggered arrest downstream of failed ORC initiation rather
          than Orc1's own molecular role.
