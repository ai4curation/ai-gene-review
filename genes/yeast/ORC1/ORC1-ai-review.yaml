core_functions:
- molecular_function:
    id: GO:0003688
    label: DNA replication origin binding
  description: ORC1 specifically recognizes and binds ARS consensus sequences (ACS)
    at chromosomal replication origins through Orc1 basic-patch contacts in the ORC-DNA
    interface. This is the initiating event for all replication origin function.
  directly_involved_in:
  - id: GO:0006270
    label: DNA replication initiation
  supported_by:
  - reference_id: PMID:16824194
    supporting_text: Reconstitution of Saccharomyces cerevisiae prereplicative complex
      assembly in vitro
  - reference_id: PMID:38597680
    supporting_text: a non-repetitive motif whose binding requires Orc1-BP4 and Orc4-IH,
      and a repetitive one where another basic patch, Orc1-BP3, can replace Orc4-IH
- molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  description: ORC1 catalyzes ATP hydrolysis, which provides the energy for conformational
    changes required for origin binding, MCM loading, and complex assembly during
    pre-RC formation at G1.
  directly_involved_in:
  - id: GO:0006267
    label: pre-replicative complex assembly involved in nuclear cell cycle DNA replication
  in_complex:
