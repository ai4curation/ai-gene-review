    supporting_text: Orc1 is the only ORC subunit experimentally demonstrated to have
      ATPase activity
- molecular_function:
    id: GO:0031491
    label: nucleosome binding
  description: ORC1s BAH domain mediates specific nucleosome binding, which facilitates
    proper nucleosome positioning at replication origins and coordinates chromatin
    organization with replication initiation.
  directly_involved_in:
  - id: GO:0034728
    label: nucleosome organization
