  label: Saccharomyces cerevisiae S288C
description: Mitochondrial homoisocitrate dehydrogenase (EC 1.1.1.87) of Saccharomyces cerevisiae, a member
  of the isocitrate/isopropylmalate dehydrogenase family. Lys12 catalyses the NAD+- and Mg2+-dependent
  oxidative decarboxylation of (2R,3S)-homoisocitrate to 2-oxoadipate (alpha-ketoadipate), step 4 of the
  alpha-aminoadipate pathway of lysine biosynthesis. It follows a steady-state random kinetic mechanism
  with the Mg-homoisocitrate complex as substrate and discriminates strongly against isocitrate. Lys12
  has an N-terminal mitochondrial targeting signal and is located in mitochondria, together with the preceding
  homoaconitase steps; it also carries a C-terminal PTS1-like sequence, but it has not been seen in peroxisomes.
  Its expression is repressed by lysine.
