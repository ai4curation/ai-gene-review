id: Q07716
gene_symbol: AIM6
product_type: PROTEIN
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  AIM6 (YDL237W) is an uncharacterized protein of the budding yeast Saccharomyces cerevisiae
  whose molecular function is not experimentally established. It is a 390-residue protein
  synthesized with a predicted N-terminal signal peptide (residues 1-17), and high-throughput
  N-terminal fluorescent-tag datasets place it in the endoplasmic reticulum. The bulk of the
  mature protein adopts the PLC-like
  phosphodiesterase TIM (beta/alpha)8-barrel fold shared by phosphoinositide-specific
  phospholipase C and glycerophosphodiester phosphodiesterase enzymes. It defines its own
  narrow sequence family (the AIM6 family) within a divergent, uncharacterized branch of this
  phosphodiesterase-like superfamily, and no catalytic activity, substrate, or physiological
  reaction has been demonstrated for it. The only experimental phenotype reported is that
  deletion impairs respiratory (non-fermentable-carbon) growth and alters mitochondrial
  transmission, the observation from which the gene took its name (Altered Inheritance of
  Mitochondria); whether this reflects a direct or an indirect role in mitochondrial function
  is unresolved. The gene is non-essential and is conserved among fungi.

references:
- id: PMID:19300474
  title: "Computationally driven, quantitative experiments discover genes required for mitochondrial biogenesis."
  findings:
  - statement: >-
      A quantitative petite-frequency screen identified ~100 previously uncharacterized proteins
      (the AIM series) whose deletion alters mitochondrial biogenesis/inheritance in S. cerevisiae;
      AIM6/YDL237W was named and scored in this study (per-gene data in the paper's Table S2).
    supporting_text: >-
      we have identified 100 proteins whose deficiency alters mitochondrial biogenesis and inheritance in Saccharomyces cerevisiae
  - statement: >-
      The authors caution that such deletion phenotypes need not reflect a direct intramitochondrial
      molecular role, since non-mitochondrial proteins can regulate biogenesis and some mutants may
      affect biogenesis indirectly.
    supporting_text: >-
      raise the possibility that these mutants are somehow indirectly affecting biogenesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified (PMC2648979). This is the source of the AIM6 name and of the sole
      experimental datum for the gene (deletion impairs respiratory growth / alters mitochondrial
      transmission), which UniProt cites as the DISRUPTION PHENOTYPE. The cached full text
      establishes the screen and its interpretive caveats but does not name YDL237W/AIM6 in the
      running text (the per-gene call is in supplementary Table S2), so quotes here are anchored to
      the screen-level findings and caveats, not to a gene-specific sentence.
- id: PMID:29988094
  title: Genome-wide SWAp-Tag yeast libraries for proteome exploration.
  findings:
  - statement: >-
      The gene-level SWAp-Tag/LoQAtE record classifies N-terminally tagged AIM6 as ER-localized
      with NOP1pr-GFP and TEF2pr-mCherry, and as ambiguous/ER with the native-promoter GFP
      construct; the older C-terminal GFP construct was below the detection threshold.
    supporting_text: >-
      We then annotated protein localization in all strains of the NATIVEpr-GFP, NOP1pr-GFP and TEF2-mCherry libraries.
  - statement: >-
      The native-promoter construct restores the natural promoter and native targeting signal,
      making its ER classification particularly relevant to AIM6's predicted signal peptide.
    supporting_text: >-
      a native promoter GFP library termed NATIVEpr-GFP, which restores the natural promoter and endogenous 5’ untranslated regions (UTR) (as well as the native MTS or SP for the relevant proteins)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and the gene-level LoQAtE record were checked. The paper establishes the SWAT
      library design and localization-classification method; the AIM6-specific ER calls reside in
      the associated LoQAtE dataset. The paper also reports that many proteins differ between
      N- and C-terminal tagging, so the proposed ER annotation is retained as high-throughput
      evidence with an explicit tag-orientation caveat.
- id: PMID:24150937
  title: LoQAtE--Localization and Quantitation ATlas of the yeast proteomE. A new tool for multiparametric dissection of single-protein behavior in response to biological perturbations in yeast.
  findings:
  - statement: >-
      LoQAtE exposes gene-level localization and abundance calls, including the AIM6 records used
      here to connect the SWAp-Tag method paper to the ER assignments.
    supporting_text: >-
      This result presents the localization and abundance of all proteins of interest under all conditions tested
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text and the live AIM6/YDL237W LoQAtE entry were checked. This is the atlas/database
      description; PMID:29988094 is the primary source for the N-terminal SWAT libraries that
      generated the relevant AIM6 ER calls.
- id: file:yeast/AIM6/AIM6-hypotheses/function-hypothesis-go-0008081/openscientist.md
  title: OpenScientist hypothesis review of AIM6 phosphoric diester hydrolase activity
  findings:
  - statement: >-
      The provider judged GO:0008081 partially supported as a computational prediction: AIM6 has
      the expected PLC/GDPD-like fold and a plausible predicted active-site scaffold, but no AIM6
      family member has a demonstrated substrate, catalytic activity, or EC number.
    supporting_text: >-
      Partially supported (computational prediction only).
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      The central conclusion and database provenance were curator-checked and are sound: retain
      GO:0008081 as a low-confidence prediction, without upgrading or narrowing it. Two limitations
      qualify the report. Its numerical AlphaFold-distance and family-audit results were delivered
      without executable analysis provenance, so they are treated as leads rather than independently
      reproduced facts; and its localization discussion missed the AIM6-specific SWAp-Tag/LoQAtE ER
      calls documented separately in this review.
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Standard InterPro2GO electronic-annotation reference. The two IEA terms it supports
      (GO:0008081, GO:0006629) both derive from the PLC-like phosphodiesterase superfamily match
      (IPR017946); they are fold-level predictions from a divergent, uncharacterized subgroup, not
      evidence of demonstrated activity.
- id: GO_REF:0000015
  title: Use of the ND evidence code for Gene Ontology (GO) terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Standard SGD ND (no biological data available) reference; correctly used to record that
      AIM6's molecular function, biological process, and cellular component are unknown.

existing_annotations:
- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Electronic InterPro2GO annotation transferred from the PLC-like phosphodiesterase superfamily
      match (IPR017946). Phosphoinositide-specific phospholipase C acts on membrane lipids, but AIM6
      belongs to a divergent, uncharacterized subgroup of the fold with no demonstrated lipid
      substrate or lipid-related activity, and InterPro itself states its function is unclear.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain this as the intended InterPro2GO prediction, not as established core biology. Both
      PI-PLC and glycerophosphodiesterase branches of the matched superfamily can participate in
      lipid metabolism, and AIM6's ER localization is compatible with such a role, but no lipid
      substrate, metabolic change, or direct pathway connection has been demonstrated.
- term:
    id: GO:0008081
    label: phosphoric diester hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Electronic InterPro2GO annotation from the PLC-like phosphodiesterase TIM-barrel superfamily
      match (IPR017946 / IPR039559, CDD cd08577 "PI-PLCc_GDPD_SF_unchar3"). The mature protein does
      adopt this catalytic fold and retains some conserved His/Asp residues consistent with it, so
      the annotation is not demonstrably wrong; however the assignment is a distant, fold-level
      prediction from a subgroup that CDD and InterPro explicitly label uncharacterized, with no
      demonstrated activity, substrate, or assay.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the IEA as a biologically plausible, explicitly computational prediction. The fold and
      candidate catalytic residues support the broad activity, but the AIM6-specific family remains
      uncharacterized and no member has a direct catalytic assay. It therefore remains non-core and
      should not be narrowed to PI-PLC or glycerophosphodiester phosphodiesterase activity.
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      SGD records the molecular function as ND (no biological data available). This correctly states
      that no experimentally supported molecular function is known for AIM6; the only molecular-function
      claim in GOA is the fold-based IEA phosphodiesterase prediction above.
    action: ACCEPT
    reason: >-
      Appropriate use of the root term with ND to signal that AIM6's molecular function is genuinely
      unknown. Consistent with SGD's summary that the protein's biological role and cellular location
      are unknown.
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: >-
      SGD records the cellular component as ND (no biological data available). This historical
      placeholder predates the N-terminal SWAp-Tag/LoQAtE datasets that classify AIM6 in the ER.
    action: ACCEPT
    reason: >-
      Correct use of the root term with ND for the source annotation. Newer high-throughput
      localization evidence now supports a more specific ER annotation, proposed separately below.
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: HDA
  original_reference_id: PMID:29988094
  qualifier: located_in
  review:
    summary: >-
      Proposed NEW annotation from the AIM6 gene-level SWAp-Tag/LoQAtE record. NOP1pr-GFP and
      TEF2pr-mCherry N-terminal constructs were classified as ER, and the NATIVEpr-GFP construct,
      which restores the native promoter and native signal peptide, was classified as ambiguous/ER.
      The original C-terminal GFP signal was below threshold.
    action: NEW
    reason: >-
      Three N-terminal library variants support ER localization, including a native-promoter/native-
      signal-peptide construct, and this agrees with AIM6's independently predicted signal peptide.
      The call remains high-throughput rather than definitive: the method paper documents substantial
      N- versus C-terminal tag differences, and AIM6's precise topology and ER subcompartment are not
      established.
    supported_by:
    - reference_id: PMID:29988094
      supporting_text: >-
        We then annotated protein localization in all strains of the NATIVEpr-GFP, NOP1pr-GFP and TEF2-mCherry libraries.
      reference_section_type: RESULTS
- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: >-
      SGD records the biological process as ND (no biological data available). The one experimental
      handle is that deletion impairs respiratory growth / alters mitochondrial transmission
      (PMID:19300474), but the screen authors caution this may be indirect, so a specific biological
      process is not assignable with confidence.
    action: ACCEPT
    reason: >-
      Correct use of the root term with ND. While the AIM screen phenotype hints at a role connected
      to mitochondrial biogenesis/respiration, the effect may be indirect and no mechanism is known,
      so no specific BP term is warranted. The unknown biological role is captured in knowledge_gaps.

core_functions:
- description: >-
    AIM6 is a fungal ER-localized protein built around a PLC/GDPD-like phosphodiesterase TIM-barrel.
    Phosphoric diester hydrolase activity and participation in lipid metabolism are defensible
    InterPro-derived predictions, but remain unverified and are not promoted here to established
    core molecular function or process. The only demonstrated physiological connection is that
    AIM6 loss impairs respiratory growth/mitochondrial inheritance by an unknown, possibly indirect
    mechanism.
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:29988094
    supporting_text: >-
      We then annotated protein localization in all strains of the NATIVEpr-GFP, NOP1pr-GFP and TEF2-mCherry libraries.
    reference_section_type: RESULTS
  - reference_id: PMID:19300474
    supporting_text: >-
      we have identified 100 proteins whose deficiency alters mitochondrial biogenesis and inheritance in Saccharomyces cerevisiae
    reference_section_type: ABSTRACT
  - reference_id: file:yeast/AIM6/AIM6-hypotheses/function-hypothesis-go-0008081/openscientist.md
    supporting_text: >-
      GO:0008081 is a defensible predicted molecular-function hypothesis.
    reference_section_type: OTHER

proposed_new_terms: []

suggested_questions:
- question: >-
    Does the AIM6 PLC-like phosphodiesterase-fold domain have any catalytic activity in vitro, and
    if so, on what substrate (a phosphoinositide, a glycerophosphodiester, a cyclic phosphate, or
    another phosphodiester)?
- question: >-
    What is AIM6's topology and precise ER subcompartment? Is its predicted N-terminal signal
    peptide cleaved, and is the mature protein soluble in the ER lumen or membrane-associated?
- question: >-
    Is the respiratory-growth / altered-mitochondrial-transmission phenotype of aim6-delta a direct
    consequence of AIM6 activity, or an indirect/pleiotropic effect (e.g. via lipid or
    secretory-pathway homeostasis)?

suggested_experiments:
- hypothesis: >-
    The AIM6 PLC-like domain is a catalytically active phosphodiesterase acting on a specific
    phosphodiester substrate.
  description: >-
    Purify recombinant mature AIM6 (residues 18-390) and assay phosphodiesterase activity against a
    panel of candidate substrates (phosphoinositides, glycerophosphodiesters such as
    glycerophosphocholine, cyclic nucleotides, and generic bis-p-nitrophenyl phosphate) with and
    without divalent cations; test predicted catalytic-residue point mutants (e.g. the His118/His120
    pair) to establish whether the retained fold is enzymatically functional or a pseudoenzyme.
  experiment_type: in vitro enzyme assay / structure-function mutagenesis
- hypothesis: >-
    AIM6 is an ER-resident secretory-pathway protein rather than a resident mitochondrial protein,
    implying that its respiratory phenotype is indirect.
  description: >-
    Validate the high-throughput ER call with an endogenous internal tag that preserves the signal
    peptide, ER-marker colocalization, protease-protection and carbonate-extraction assays, and direct
    testing of signal-peptide cleavage. These experiments should resolve ER topology and exclude a
    minor mitochondrial pool that the SWAp-Tag datasets might miss.
  experiment_type: fluorescence microscopy / subcellular fractionation
- hypothesis: >-
    The aim6-delta respiratory phenotype reports a defined pathway that can be identified by genetic
    and physiological profiling.
  description: >-
    Characterize aim6-delta with quantitative respiratory-growth and petite-frequency assays,
    lipidomic profiling, and epistasis / synthetic-genetic-array analysis against mitochondrial-
    biogenesis and lipid/secretory-pathway mutants to place AIM6 in a functional module and
    distinguish a direct from an indirect mitochondrial role.
  experiment_type: quantitative genetics / metabolic profiling

knowledge_gaps:
- gap_statement: >-
    The molecular function of AIM6 is unknown. Although the mature protein adopts the PLC-like
    phosphodiesterase (PI-PLC/GDPD-type) TIM-barrel fold, it is undetermined whether AIM6 has any
    catalytic activity at all, and if so what its substrate and reaction are. No enzymatic activity,
    substrate, or partner has ever been measured for it.
  boundary: >-
    AIM6 is a verified, non-essential, expressed 390-aa protein (protein-level evidence) with a
    predicted N-terminal signal peptide (1-17). Its C-terminal domain (~residues 115-385) matches the
    PLC-like phosphodiesterase TIM-barrel superfamily (IPR017946) and an AIM6-specific PI-PLC-like
    catalytic-domain entry (IPR039559) built on CDD cd08577, a group explicitly labelled
    "uncharacterized." Some conserved His/Asp residues consistent with the fold are retained. The
    only functional label in GOA beyond root/ND terms is the fold-based IEA phosphodiesterase
    prediction. High-throughput localization now places AIM6 in the ER but does not establish its
    molecular activity.
  gap_kind:
    - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    AIM6 is a conserved fungal protein that defines its own family within a divergent branch of the
    ubiquitous phosphoinositide-phospholipase-C / glycerophosphodiester-phosphodiesterase
    superfamily. Establishing whether it is an active phosphodiesterase (and on what substrate) or a
    pseudoenzyme would assign a first molecular function to a member of the fungal unknome and
    clarify a poorly explored corner of a large, biomedically important enzyme fold.
  resolution: >-
    In vitro phosphodiesterase assays on purified AIM6 against a substrate panel, with
    catalytic-residue mutagenesis to test whether the fold is functional; structural determination of
    the domain to inspect the active-site geometry.
  provenance:
    - reference_id: PMID:19300474
      supporting_text: >-
        68 genes with no previously characterized cellular role
- gap_statement: >-
    The biological role of AIM6 and the mechanism behind its deletion phenotype are unknown. It is
    unresolved whether AIM6 acts directly in mitochondrial biogenesis/respiration or whether the
    respiratory-growth defect of the deletion is an indirect consequence of some other cellular
    activity.
  boundary: >-
    The one experimental phenotype is that aim6-delta impairs respiratory (non-fermentable-carbon)
    growth and alters mitochondrial transmission (the basis of the AIM name), reported in the
    quantitative petite-frequency screen of PMID:19300474. That study explicitly cautions that many
    genes with such phenotypes are not mitochondrial and may affect biogenesis indirectly. AIM6's
    predicted signal peptide and the N-terminal SWAp-Tag/LoQAtE ER calls point toward the secretory
    pathway rather than the mitochondrion, although its precise topology is unresolved.
  gap_kind:
    - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Assigning AIM6 to a specific pathway would explain a reproducible respiratory-growth phenotype
    in a model eukaryote and determine whether it is a genuine (if unusual, secretory-pathway-linked)
    contributor to mitochondrial function or an indirect effector — a distinction the original
    screen flagged as generally unresolved for its hits.
  resolution: >-
    Validate AIM6 ER topology and signal-peptide processing; run epistasis / synthetic-genetic and
    metabolic (lipidomic) profiling of aim6-delta against mitochondrial-biogenesis and
    lipid/secretory-pathway mutants to place AIM6 in a functional module and test direct versus
    indirect models.
  provenance:
    - reference_id: PMID:19300474
      supporting_text: >-
        raise the possibility that these mutants are somehow indirectly affecting biogenesis

status: COMPLETE
