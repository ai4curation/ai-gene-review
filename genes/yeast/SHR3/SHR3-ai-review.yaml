suggested_questions:
- question: For Shr3 and related ER-resident packaging factors, should GO curation
    distinguish folding chaperone activity from cargo-receptor or COPII-adaptor activity
    with a more specific child term?
suggested_experiments:
- description: Reconstitute Shr3 with defined amino acid permease transmembrane segments
    and COPII components to separate its folding/stabilization activity from any direct
    COPII recruitment activity.
  experiment_type: biochemical reconstitution
  hypothesis: Shr3 first stabilizes early permease transmembrane segments and then
    promotes COPII packaging indirectly by producing export-competent cargo.
