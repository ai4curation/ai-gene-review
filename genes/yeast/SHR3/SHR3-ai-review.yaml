id: Q02774
gene_symbol: SHR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: SHR3 encodes an endoplasmic-reticulum membrane packaging chaperone required
  for folding, quality control, and ER exit of yeast amino acid permeases. Shr3 is
  a multi-pass ER membrane protein that assists substrate-specific folding of polytopic
  amino acid transporters, prevents their aggregation and premature ER-associated
  degradation, and promotes COPII-dependent packaging for trafficking from the ER
  toward the Golgi and plasma membrane. Shr3 is not itself an amino acid transporter;
  its core role is client-specific membrane protein chaperoning in the early secretory
  pathway.
