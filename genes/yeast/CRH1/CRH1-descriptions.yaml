descriptions:
- source: UniProt
  text: Dual chitinase/transglycosylase that plays a role in cell wall architecture
    (PubMed:18694928, PubMed:19734368, PubMed:23919454). Chitinase and transglycosylase
    activities are coupled (By similarity). Required for the polysaccharide cross-linking
    at the septa and the cell wall (PubMed:18694928, PubMed:19734368, PubMed:23919454).
    More specifically, transfers chitin to both beta(1-3)- and beta(1-6)glucan in
    the cell wall (PubMed:18694928, PubMed:19734368, PubMed:23919454). The minimal
    number of intact hexopyranose units required in the molecule of the acceptor oligosaccharide
    is two and the effectivity of the acceptor increased with the increasing length
    of its oligosaccharide chain (PubMed:23919454).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53301
  source_id: P53301
- source: Alliance_Imported
  text: Chitin transglycosylase; functions in the transfer of chitin to beta(1-6)
    and beta(1-3) glucans in the cell wall; similar and functionally redundant to
    Utr2; localizes to sites of polarized growth; expression induced by cell wall
    stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/CRH1
  source_id: SGD:S000003421
- source: Alliance_Automated
  text: Enables endochitinase activity and glycosyltransferase activity. Involved
    in chitin metabolic process and fungal-type cell wall organization. Located in
    fungal-type cell wall and incipient cellular bud site.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CRH1
  source_id: SGD:S000003421
