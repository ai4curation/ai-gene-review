descriptions:
- source: UniProt
  text: Dual chitinase/transglycosylase that plays a role in cell wall architecture
    (PubMed:18694928, PubMed:19734368, PubMed:23919454). Chitinase and transglycosylase
    activities are coupled (By similarity). Required for the polysaccharide cross-linking
    at the septa and the cell wall (PubMed:18694928, PubMed:19734368, PubMed:23919454).
    More specifically, transfers chitin to both beta(1-3)- and beta(1-6)glucan in
    the cell wall (PubMed:18694928, PubMed:19734368, PubMed:23919454). The minimal
    number of intact hexopyranose units required in the molecule of the acceptor oligosaccharide
    is two and the effectivity of the acceptor increased with the increasing length
    of its oligosaccharide chain (PubMed:23919454).
  source_type: curated
