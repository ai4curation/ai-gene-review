gene_symbol: ACS2
organism: yeast
uniprot_id: P52910
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the production of acetyl-CoA. Provides the acetyl- CoA source for
    histone acetylation in the nucleus. 'Anaerobic' isozyme of acetyl-coenzyme A synthetase,
    which is required for growth on fermentable carbon sources such as glucose. May
    be involved in the PDH (pyruvate dehydrogenase complex) bypass.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52910
  source_id: P52910
- source: Alliance_Imported
  text: Acetyl-coA synthetase isoform; along with Acs1p, acetyl-coA synthetase isoform
    is the nuclear source of acetyl-coA for histone acetylation; mutants affect global
    transcription; required for growth on glucose; expressed under anaerobic conditions
  source_type: curated
  url: https://www.yeastgenome.org/locus/ACS2
  source_id: SGD:S000004143
- source: Alliance_Automated
  text: Enables acetyl-CoA synthetase activity and acid-ammonia (or amide) ligase
    activity. Involved in acetyl-CoA biosynthetic process. Located in cytosol and
    nucleolus. Human ortholog(s) of this gene implicated in melanoma and orofacial
    cleft. Orthologous to several human genes including ACSS1 (acyl-CoA synthetase
    short chain family member 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ACS2
  source_id: SGD:S000004143
