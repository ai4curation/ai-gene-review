      supporting_text: Yeast acetyl-CoA synthetases (Acs1p and 2p) are exceptional, as they are important
        not only for carbon metabolism but also are shown here to supply the acetyl-CoA for histone acetylation
        by histone acetyltransferases (HATs).
    - reference_id: PMID:26527276
      supporting_text: which contains serine metabolic enzymes, SAM (S-adenosylmethionine) synthetases,
        and an acetyl-CoA synthetase.
