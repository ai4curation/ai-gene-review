gene_symbol: ACS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ACS2 encodes the "non-aerobic" isozyme of acetyl-coenzyme A synthetase (EC 6.2.1.1), an AMP-forming
  enzyme that converts acetate, ATP and CoA to acetyl-CoA, AMP and diphosphate. Acs2p has a higher Km
  for acetate than Acs1p, does not use propionate, and is expressed under both aerobic and anaerobic conditions,
  including on glucose, where it is the only acetyl-CoA synthetase; acs2 mutants cannot grow on glucose
  in batch culture and acs1 acs2 double mutants are inviable. Acs2p is predominantly nuclear (including
  nucleolar) with a cytosolic pool, and it is the main source of nucleocytosolic acetyl-CoA, completing
  the pyruvate dehydrogenase bypass and supplying acetyl-CoA for lipid synthesis and for histone acetylation;
  its loss causes global histone deacetylation, transcriptional defects, impaired rDNA silencing and shortened
  replicative life span. Acs2p has also been reported as a subunit of the SESAME metabolic enzyme complex.
