  original_reference_id: PMID:26527276
  qualifier: involved_in
  review:
    summary: NAS from the SESAME paper. Acs2p supplies the nuclear acetyl-CoA required for histone acetylation,
      and acs2-ts mutants show global histone deacetylation and transcriptional defects (PMID:16857587);
      as a SESAME subunit it is also linked to histone-modification crosstalk. Acs2p provides a substrate
      for chromatin-modifying enzymes rather than modifying chromatin itself, so this is a downstream,
      non-core role.
    action: KEEP_AS_NON_CORE
    supported_by:
