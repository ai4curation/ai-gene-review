  - reference_id: PMID:16857587
    supporting_text: Rapid deacetylation after Acs2p inactivation suggests nuclear acetyl-CoA synthesis
      is rate limiting for histone acetylation.
  - reference_id: PMID:19618123
    supporting_text: find that Acs2p is localized primarily to the nucleus, including the nucleolus, with
      a minor amount in the cytosol
suggested_questions:
- question: Is Acs2p physically required in the SESAME complex for its chromatin function, or is the requirement
    solely for acetyl-CoA supply?
suggested_experiments:
- description: Catalytically dead ACS2 point mutant expressed with an NLS in an acs2 strain supplemented
    with nuclear-targeted heterologous acetyl-CoA source, to separate scaffold versus metabolic roles
    in histone acetylation and SESAME function.
