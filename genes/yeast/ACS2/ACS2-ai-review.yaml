core_functions:
- description: Constitutive, predominantly nuclear/nucleocytosolic AMP-forming acetyl-CoA synthetase;
    the main source of nucleocytosolic acetyl-CoA during fermentative growth (PDH bypass), essential for
    growth on glucose, and rate-limiting supplier of acetyl-CoA for histone acetylation.
  molecular_function:
    id: GO:0003987
    label: acetyl-CoA synthetase activity
