taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 3-Phosphoglycerate kinase (EC 2.7.2.3) of Saccharomyces cerevisiae, a highly abundant monomeric two-domain Mg2+-dependent
  enzyme that catalyses reversible phosphoryl transfer between 1,3-bisphosphoglycerate and ADP, forming 3-phosphoglycerate
  and ATP. It carries out the first substrate-level phosphorylation of glycolysis and, in the reverse direction, the ATP-consuming
  step of gluconeogenesis; PGK1 is the only phosphoglycerate kinase gene in yeast and pgk1 mutants cannot use glucose. Pgk1
  is predominantly cytosolic, with a minor pool detected in mitochondrial fractions. Its strong constitutive promoter is widely
  used for heterologous expression.
