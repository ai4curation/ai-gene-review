descriptions:
- source: UniProt
  text: Catalyzes one of the two ATP producing reactions in the glycolytic pathway
    via the reversible conversion of 1,3- diphosphoglycerate to 3-phosphoglycerate
    (PubMed:6254992). Both L- and D- forms of purine and pyrimidine nucleotides can
    be used as substrates, but the activity is much lower on pyrimidines (By similarity).
    Negatively regulates the biosynthesis of acetyl-CoA from pyruvate in the mitochondrion
    (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00560
