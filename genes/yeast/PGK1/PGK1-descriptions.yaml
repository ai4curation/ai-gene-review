gene_symbol: PGK1
organism: yeast
uniprot_id: P00560
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes one of the two ATP producing reactions in the glycolytic pathway
    via the reversible conversion of 1,3- diphosphoglycerate to 3-phosphoglycerate
    (PubMed:6254992). Both L- and D- forms of purine and pyrimidine nucleotides can
    be used as substrates, but the activity is much lower on pyrimidines (By similarity).
    Negatively regulates the biosynthesis of acetyl-CoA from pyruvate in the mitochondrion
    (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00560
  source_id: P00560
- source: Alliance_Imported
  text: 3-phosphoglycerate kinase; catalyzes transfer of high-energy phosphoryl groups
    from the acyl phosphate of 1,3-bisphosphoglycerate to ADP to produce ATP; key
    enzyme in glycolysis and gluconeogenesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/PGK1
  source_id: SGD:S000000605
- source: Alliance_Automated
  text: Enables phosphoglycerate kinase activity. Involved in gluconeogenesis and
    glycolytic process. Located in mitochondrion. Used to study cancer. Human ortholog(s)
    of this gene implicated in hemolytic anemia and phosphoglycerate kinase 1 deficiency.
    Orthologous to several human genes including PGK2 (phosphoglycerate kinase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PGK1
  source_id: SGD:S000000605
