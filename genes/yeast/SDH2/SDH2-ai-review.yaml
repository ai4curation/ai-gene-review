id: P21801
gene_symbol: SDH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SDH2 (YLL041C) encodes the iron-sulfur protein (Ip) subunit of mitochondrial succinate dehydrogenase
  (SDH; respiratory complex II; succinate:quinone oxidoreductase, EC 1.3.5.1). Sdh2p and the covalent-FAD
  flavoprotein Sdh1p form the matrix-facing catalytic dimer, which the integral membrane subunits Sdh3p
  and Sdh4p anchor to the inner mitochondrial membrane. Electrons from succinate oxidation at the Sdh1p
  FAD pass through the three Sdh2p iron-sulfur clusters ([2Fe-2S], [4Fe-4S], [3Fe-4S]) to the ubiquinone
  site formed with Sdh3p/Sdh4p. Complex II thus couples the TCA-cycle oxidation of succinate to fumarate
  with reduction of ubiquinone in the respiratory chain. Sdh2p is required for holocomplex assembly and
  for growth on non-fermentable carbon sources; assembly depends on factors including Sdh8 (for the Sdh1-Sdh2
  dimer) and Tcm62.
