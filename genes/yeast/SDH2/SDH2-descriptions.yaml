descriptions:
- source: UniProt
  text: Subunit of succinate dehydrogenase (SDH) that is involved in complex II of
    the mitochondrial electron transport chain and is responsible for transferring
    electrons from succinate to ubiquinone (coenzyme Q). SDH1 and SDH2 form the catalytic
    dimer. Electrons flow from succinate to the FAD bound to SDH1, and sequentially
    through the iron-sulfur clusters bound to SDH2 and enter the membrane dimer formed
    by SDH3 and SDH4.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P21801
  source_id: P21801
- source: Alliance_Imported
  text: Iron-sulfur protein subunit of succinate dehydrogenase; the complex couples
    the oxidation of succinate to the transfer of electrons to ubiquinone as part
    of the TCA cycle and the mitochondrial respiratory chain; other members are Sdh1p,
    Sdh3p, and Sdh4p
  source_type: curated
  url: https://www.yeastgenome.org/locus/SDH2
  source_id: SGD:S000003964
- source: Alliance_Automated
  text: Enables succinate dehydrogenase (quinone) activity. Involved in mitochondrial
    electron transport, succinate to ubiquinone and tricarboxylic acid cycle. Located
    in mitochondrial inner membrane. Part of respiratory chain complex II (succinate
    dehydrogenase). Used to study mitochondrial encephalomyopathy and paraganglioma.
    Human ortholog(s) of this gene implicated in Carney-Stratakis syndrome; gastrointestinal
    stromal tumor; mitochondrial complex II deficiency; and pheochromocytoma (multiple).
    Orthologous to human SDHB (succinate dehydrogenase complex iron sulfur subunit
    B).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SDH2
  source_id: SGD:S000003964
