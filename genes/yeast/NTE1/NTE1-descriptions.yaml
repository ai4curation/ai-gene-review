- source: Alliance_Automated
  text: Enables B-type glycerophospholipase activity and phosphatidylcholine lysophospholipase
    A1 activity. Involved in phosphatidylcholine catabolic process and regulation
    of phospholipid biosynthetic process. Located in endoplasmic reticulum membrane
    and lipid droplet. Human ortholog(s) of this gene implicated in Boucher-Neuhauser
    syndrome; Laurence-Moon syndrome; Oliver-McFarlane syndrome; and hereditary spastic
    paraplegia 39. Orthologous to several human genes including PNPLA6 (patatin like
    domain 6, lysophospholipase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NTE1
  source_id: SGD:S000004524
