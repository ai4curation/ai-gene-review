- id: PMID:37269946
  title: The acyltransferase Gpc1 is both a target and an effector of the unfolded
    protein response in Saccharomyces cerevisiae.
  findings:
  - statement: The 2023 Gpc1 study confirms that Nte1- and Plb1-generated
      glycerophosphocholine is the entry substrate for the Gpc1/Ale1 PC
      deacylation/reacylation pathway.
    supporting_text: In PC-DRP (Fig. 1), PC undergoes complete deacylation by
      type B phospholipases, primarily Nte1 and Plb1
    reference_section_type: INTRODUCTION
