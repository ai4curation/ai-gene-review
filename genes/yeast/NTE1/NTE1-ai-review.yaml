- id: PMID:15044461
  title: Neuropathy target esterase and its yeast homologue degrade phosphatidylcholine
    to glycerophosphocholine in living cells.
  findings:
  - statement: Yeast Nte1/YML059c is an ER-localized neuropathy-target-esterase homolog
      required for phosphatidylcholine deacylation to glycerophosphocholine.
    supporting_text: YML059c, a Saccharomyces cerevisiae protein with sequence homology
      to NTE, had similar catalytic properties to the mammalian enzyme in assays of
      microsome preparations and, like NTE, was localized to the endoplasmic reticulum.
      Yeast lacking YML059c were viable under all conditions examined but, unlike
      the wild-type strain, did not convert PtdCho to GroPCho.
    reference_section_type: ABSTRACT
- id: PMID:19841481
  title: NTE1-encoded phosphatidylcholine phospholipase b regulates transcription
    of phospholipid biosynthetic genes.
  findings:
  - statement: Nte1-dependent ER phosphatidylcholine deacylation secondarily regulates
      Opi1-dependent transcription of phospholipid biosynthetic genes.
    supporting_text: The Saccharomyces cerevisiae NTE1 gene encodes an evolutionarily
      conserved phospholipase B localized to the endoplasmic reticulum (ER) that degrades
      phosphatidylcholine (PC) generating glycerophosphocholine and free fatty acids.
      We show here that the activity of NTE1-encoded phospholipase B (Nte1p) prevents
      the attenuation of transcription of genes encoding enzymes involved in phospholipid
      synthesis in response to increased rates of PC synthesis by affecting the nuclear
      localization of the transcriptional repressor Opi1p.
    reference_section_type: ABSTRACT
