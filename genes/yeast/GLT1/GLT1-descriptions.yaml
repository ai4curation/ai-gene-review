gene_symbol: GLT1
organism: yeast
uniprot_id: Q12680
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Forms L-glutamate from L-glutamine and 2-oxoglutarate. Represents an alternative
    pathway to L-glutamate dehydrogenase for the biosynthesis of L-glutamate. Participates
    with glutamine synthetase in ammonia assimilation processes. The enzyme is specific
    for NADH, L- glutamine and 2-oxoglutarate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12680
  source_id: Q12680
- source: Alliance_Imported
  text: NAD(+)-dependent glutamate synthase (GOGAT); synthesizes glutamate from glutamine
    and alpha-ketoglutarate; with Gln1p, forms the secondary pathway for glutamate
    biosynthesis from ammonia; expression regulated by nitrogen source; assembles
    into filaments as cells approach stationary phase and under cytosolic acidification
    and starvation conditions
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLT1
  source_id: SGD:S000002330
- source: Alliance_Automated
  text: Enables glutamate synthase (NADH) activity. Involved in L-glutamate biosynthetic
    process and ammonia assimilation cycle. Is active in cytoophidium. Human ortholog(s)
    of this gene implicated in several diseases, including acquired thrombocytopenia;
    acute lymphoblastic leukemia; dihydropyrimidine dehydrogenase deficiency; neutropenia;
    and pancreatic cancer. Orthologous to human DPYD (dihydropyrimidine dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLT1
  source_id: SGD:S000002330
