- source: Alliance_Imported
  text: NAD(+)-dependent glutamate synthase (GOGAT); synthesizes glutamate from glutamine
    and alpha-ketoglutarate; with Gln1p, forms the secondary pathway for glutamate
    biosynthesis from ammonia; expression regulated by nitrogen source; assembles
    into filaments as cells approach stationary phase and under cytosolic acidification
    and starvation conditions
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLT1
