- source: Alliance_Automated
  text: Enables glutamate synthase (NADH) activity. Involved in L-glutamate biosynthetic
    process and ammonia assimilation cycle. Is active in cytoophidium. Human ortholog(s)
    of this gene implicated in several diseases, including acquired thrombocytopenia;
    acute lymphoblastic leukemia; dihydropyrimidine dehydrogenase deficiency; neutropenia;
    and pancreatic cancer. Orthologous to human DPYD (dihydropyrimidine dehydrogenase).
