id: Q12680
gene_symbol: GLT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Glutamate synthase [NADH] (NADH-GOGAT, EC 1.4.1.14) of Saccharomyces cerevisiae, a large
  plant-like single-chain iron-sulfur flavoprotein (199 kDa subunit, homotrimer) containing FAD, FMN and
  a [3Fe-4S] cluster. GLT1 transfers the amide nitrogen of L-glutamine to 2-oxoglutarate using NADH, producing
  two molecules of L-glutamate. Together with glutamine synthetase (GLN1) it forms the GS/GOGAT ammonia
  assimilation cycle, which in ammonium-grown wild-type yeast is an ancillary route to glutamate alongside
  the NADP-glutamate dehydrogenases GDH1 and GDH3; cells lacking GDH1, GDH3 and GLT1 are glutamate auxotrophs.
  GLT1 expression is repressed by glutamate and activated by Gln3 and Gcn4. Glt1 can assemble into cytoplasmic
  filaments (cytoophidia), preferentially in non-quiescent cells.
