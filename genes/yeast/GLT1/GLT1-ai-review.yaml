core_functions:
- description: NADH-dependent transfer of the glutamine amide nitrogen to 2-oxoglutarate, producing two
    L-glutamate (EC 1.4.1.14); with GLN1 forms the GS/GOGAT ammonia assimilation cycle, an ancillary route
    to glutamate.
  molecular_function:
