    label: ammonia assimilation cycle
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:4362465
    supporting_text: The stoichiometry of the reaction has been determined as 2 mol of glutamate synthesized
      per mol of glutamine consumed.
  - reference_id: PMID:7836314
    supporting_text: The results show that S. cerevisiae has a single NADH-GOGAT enzyme, consisting of
      three 199-kDa monomers
  - reference_id: PMID:9287019
    supporting_text: Triple mutants impaired in GDH1, GLT1, and GDH3 were obtained. These were strict
      glutamate auxotrophs.
