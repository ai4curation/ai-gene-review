descriptions:
- source: UniProt
  text: This enzyme scavenges exogenous and endogenous cytidine and 2'-deoxycytidine
    for UMP synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06549
  source_id: Q06549
- source: Alliance_Imported
  text: Cytidine deaminase; catalyzes the modification of cytidine to uridine in vitro
    but native RNA substrates have not been identified, localizes to both the nucleus
    and cytoplasm
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDD1
  source_id: SGD:S000004235
- source: Alliance_Automated
  text: Enables cytidine deaminase activity and identical protein binding activity.
    Involved in cytidine catabolic process; deoxycytidine catabolic process; and pyrimidine-containing
    compound salvage. Located in cytoplasm and nucleus. Human ortholog(s) of this
    gene implicated in lung non-small cell carcinoma. Orthologous to human CDA (cytidine
    deaminase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDD1
  source_id: SGD:S000004235
