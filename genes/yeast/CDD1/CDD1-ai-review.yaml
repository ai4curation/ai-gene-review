suggested_questions:
- question: Does Cdd1 edit any native yeast RNA under specific growth conditions, or is its editase activity purely
    an ectopic property?
- question: Should the IntAct self-interaction from PMID:23267104 (a S. pneumoniae interaction study) be attributed
    to yeast Cdd1?
suggested_experiments:
- hypothesis: Cdd1 contributes to cytidine salvage only when the Urh1-Fcy1 route is saturated
  description: Measure 13C-cytidine flux to uridine, uracil and UMP in wild-type, cdd1, urh1, fcy1 and combination
    mutants under pyrimidine limitation.
  experiment_type: metabolic flux analysis
