id: Q06549
gene_symbol: CDD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'CDD1 (YLR245C) encodes the cytidine deaminase of S. cerevisiae (EC 3.5.4.5), a 142-residue zinc-dependent
  enzyme of the tetrameric-type cytidine deaminase subfamily that hydrolytically deaminates cytidine (and, in vitro,
  2''-deoxycytidine) to uridine (deoxyuridine) and ammonia. It is cytoplasmic (with some nuclear signal) and forms
  homo-oligomers. Cdd1 is one of several routes in the cytidine-utilisation network: cdd1 null mutants lose cytidine
  deaminase activity and are resistant to 5-fluorocytidine, but for using cytidine as a UMP precursor the Urh1-Fcy1
  route (cytidine to cytosine to uracil) is limiting, not Cdd1. Ectopically, Cdd1 can perform APOBEC-like C-to-U
  editing of a reporter mRNA, but no native edited yeast mRNA has been found.'
