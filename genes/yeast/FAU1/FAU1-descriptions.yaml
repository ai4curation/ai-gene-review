descriptions:
- source: UniProt
  text: Only enzyme known to utilize 5-formyltetrahydrofolate (folinic acid) as substrate.
    Contributes to tetrahydrofolate metabolism in an alternative way of folate biosynthesis.
    May regulate carbon flow through the folate-dependent one-carbon metabolic network
    that supplies carbon for the biosynthesis of purines, thymidine and amino acids.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40099
