descriptions:
- source: UniProt
  text: Only enzyme known to utilize 5-formyltetrahydrofolate (folinic acid) as substrate.
    Contributes to tetrahydrofolate metabolism in an alternative way of folate biosynthesis.
    May regulate carbon flow through the folate-dependent one-carbon metabolic network
    that supplies carbon for the biosynthesis of purines, thymidine and amino acids.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40099
  source_id: P40099
- source: Alliance_Imported
  text: 5,10-methenyltetrahydrofolate synthetase; involved in folic acid biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/FAU1
  source_id: SGD:S000000985
- source: Alliance_Automated
  text: Enables 5-formyltetrahydrofolate cyclo-ligase activity. Involved in folic
    acid-containing compound biosynthetic process. Located in mitochondrion. Human
    ortholog(s) of this gene implicated in epilepsy. Orthologous to human MTHFS (methenyltetrahydrofolate
    synthetase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FAU1
