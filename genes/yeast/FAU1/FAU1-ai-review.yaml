taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FAU1 (YER183C) encodes 5,10-methenyltetrahydrofolate synthetase (MTHFS; 5-formyltetrahydrofolate
  cyclo-ligase, EC 6.3.3.2), a 211-residue member of the 5-formyltetrahydrofolate cyclo-ligase family.
  It catalyses the ATP-dependent, irreversible cyclisation of 5-formyltetrahydrofolate (folinic acid)
  to 5,10-methenyltetrahydrofolate, the only known enzymatic route by which 5-formyl-THF re-enters the
  one-carbon folate pool. 5-Formyl-THF is generated in vivo by a side reaction of serine hydroxymethyltransferase
  and acts as a storage form and inhibitor of folate-dependent enzymes; fau1 disruptants accumulate it
  ~4-fold, and FAU1 is required for folinic acid to satisfy the folate requirement of strains lacking
  de novo folate synthesis. The protein is detected in purified mitochondria by proteomics and homologues
  are cytosolic and mitochondrial, so it probably acts in both compartments.
