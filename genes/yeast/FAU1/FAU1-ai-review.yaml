suggested_questions:
- question: Does Fau1 have a cytosolic pool in addition to the mitochondrial pool detected by proteomics,
    and how is dual targeting achieved without an annotated presequence?
- question: Is the AICAR-dependent methionine deficiency of fau1 ade16 ade17 strains caused by 5-formyl-THF
    inhibition of a specific folate-dependent enzyme (e.g. Met13/Met6)?
suggested_experiments:
- description: Fluorescent-protein tagging at the endogenous FAU1 locus plus subcellular fractionation
    to quantify cytosolic vs mitochondrial Fau1.
