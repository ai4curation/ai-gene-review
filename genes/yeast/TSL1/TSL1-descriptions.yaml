descriptions:
- source: UniProt
  text: Regulatory subunit of the trehalose synthase complex that catalyzes the production
    of trehalose from glucose-6-phosphate and UDP- glucose in a two step process.
    May stabilize the trehalose synthase complex, and confer sensitivity to physiological
    concentrations of phosphate and to fructose 6-phosphate.
