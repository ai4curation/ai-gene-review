- source: Alliance_Imported
  text: Large subunit of trehalose 6-phosphate synthase/phosphatase complex; Tps1p-Tps2p
    complex converts uridine-5'-diphosphoglucose and glucose 6-phosphate to trehalose;
    contributes to survival to acute lethal heat stress; mutant has aneuploidy tolerance;
    protein abundance increases in response to DNA replication stress; TSL1 has a
    paralog, TPS3, that arose from the whole genome duplication
