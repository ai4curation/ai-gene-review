gene_symbol: TSL1
organism: yeast
uniprot_id: P38427
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Regulatory subunit of the trehalose synthase complex that catalyzes the production
    of trehalose from glucose-6-phosphate and UDP- glucose in a two step process.
    May stabilize the trehalose synthase complex, and confer sensitivity to physiological
    concentrations of phosphate and to fructose 6-phosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38427
  source_id: P38427
- source: Alliance_Imported
  text: Large subunit of trehalose 6-phosphate synthase/phosphatase complex; Tps1p-Tps2p
    complex converts uridine-5'-diphosphoglucose and glucose 6-phosphate to trehalose;
    contributes to survival to acute lethal heat stress; mutant has aneuploidy tolerance;
    protein abundance increases in response to DNA replication stress; TSL1 has a
    paralog, TPS3, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TSL1
  source_id: SGD:S000004566
- source: Alliance_Automated
  text: Enables enzyme regulator activity. Contributes to alpha,alpha-trehalose-phosphate
    synthase (UDP-forming) activity and trehalose-phosphatase activity. Involved in
    trehalose biosynthetic process. Located in cytoplasm. Part of alpha,alpha-trehalose-phosphate
    synthase complex (UDP-forming).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TSL1
  source_id: SGD:S000004566
