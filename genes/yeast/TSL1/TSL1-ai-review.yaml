  label: Saccharomyces cerevisiae S288C
description: 'TSL1 (YML100W) encodes the 123-kDa regulatory subunit of the cytosolic trehalose synthase
  complex, which also contains the catalytic subunits Tps1 (trehalose-6-phosphate synthase) and Tps2 (trehalose-6-phosphate
  phosphatase) and the Tsl1 paralog Tps3. Tsl1 carries a long, phosphorylated N-terminal extension followed
  by glycosyltransferase family 20 (GT-20) and TPP-like domains that are homologous to Tps1/Tps2 but are
  not known to be catalytic. Tsl1 binds Tps1 and Tps2, stabilises the complex and modulates Tps1 activity:
  removal of its N-terminal region reduces the inhibition of trehalose-6-phosphate synthase by phosphate
  and its activation by fructose 6-phosphate. Tsl1 and Tps3 are partially redundant; loss of both destabilises
  the complex and lowers TPS and TPP activities and trehalose accumulation. TSL1 is glucose-repressed
  and induced under stress and in stationary phase, when trehalose accumulates as a stress protectant
  and storage carbohydrate.'
