suggested_questions:
- question: Do the GT-20 and TPP-like domains of Tsl1 retain any residual catalytic or substrate-binding
    capacity, or are they purely structural?
- question: How does phosphorylation of the Tsl1 N-terminal extension (multiple MOD_RES sites) alter its
    regulation of Tps1 under stress?
- question: Why do cells keep two partially redundant regulatory paralogs (Tsl1, Tps3); are they differentially
    used under specific stresses or growth phases?
suggested_experiments:
- description: Purify complexes containing Tsl1 only, Tps3 only, or neither, and measure Tps1 kinetics
    (phosphate inhibition, fructose 6-phosphate activation) to separate the regulatory contributions of
    each paralog.
  experiment_type: biochemistry
