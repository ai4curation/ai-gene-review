  review:
    summary: InterPro2GO from IPR001830 (glycosyl transferase family 20), which maps the GT-20 domain
      to generic catalytic activity. Tsl1 contains a GT-20-like domain but is the regulatory subunit of
      the complex; Tps1 carries the synthase activity and Tps2 the phosphatase activity, and no catalytic
      activity has been shown for Tsl1. The domain-based transfer of 'catalytic activity' to this regulatory
      homolog over-states what is known.
    action: MARK_AS_OVER_ANNOTATED
    reason: Domain homology mapping (COMPLEX/PSEUDOENZYME-type overannotation); the catalytic activities
      of the complex reside in Tps1 and Tps2, and Tsl1 is characterised as regulatory.
    supported_by:
