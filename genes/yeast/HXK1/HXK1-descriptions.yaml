gene_symbol: HXK1
organism: yeast
uniprot_id: P04806
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of hexose, such as D-glucose and D-fructose,
    to hexose 6-phosphate (D-glucose 6-phosphate and D- fructose 6-phosphate, respectively)
    (PubMed:332086). Mediates the initial step of glycolysis by catalyzing phosphorylation
    of D-glucose to D-glucose 6-phosphate (PubMed:332086).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P04806
  source_id: P04806
- source: Alliance_Imported
  text: Hexokinase isoenzyme 1; a cytosolic protein that catalyzes phosphorylation
    of glucose during glucose metabolism; expression is highest during growth on non-glucose
    carbon sources; glucose-induced repression involves hexokinase Hxk2p; HXK1 has
    a paralog, HXK2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/HXK1
  source_id: SGD:S000001949
- source: Alliance_Automated
  text: Enables hexokinase activity. Involved in glycolytic process; hexose import
    across plasma membrane; and hexose metabolic process. Located in mitochondrion.
    Human ortholog(s) of this gene implicated in several diseases, including anemia
    (multiple); artery disease (multiple); glucose metabolism disease (multiple);
    hematologic cancer (multiple); and retinitis pigmentosa (multiple). Orthologous
    to several human genes including GCK (glucokinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HXK1
  source_id: SGD:S000001949
