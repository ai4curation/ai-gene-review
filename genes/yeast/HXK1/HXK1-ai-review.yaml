  review:
    summary: Bisson & Fraenkel found that low-Km glucose uptake requires a sugar kinase. The kinase does not translocate glucose;
      later work attributed the effect to kinase-dependent regulation of Hxt transporters and metabolic trapping.
    action: MARK_AS_OVER_ANNOTATED
    reason: Experimental genetic interaction is real, but hexokinase is not a participant in membrane transport; at most it
      acts upstream.
