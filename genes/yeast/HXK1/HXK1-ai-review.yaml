id: P04806
gene_symbol: HXK1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Hexokinase I (hexokinase PI/A; EC 2.7.1.1) of Saccharomyces cerevisiae, a cytosolic homodimeric hexokinase-family
  enzyme that phosphorylates D-glucose, D-fructose and D-mannose to their 6-phosphates using ATP. Together with its paralog
  Hxk2 it is one of only two enzymes able to phosphorylate fructose (glucokinase Glk1 cannot), and it has a relative preference
  for fructose. HXK1 is glucose-repressed and is the main hexokinase expressed during growth on non-fermentable carbon sources
  and at the diauxic shift, when it primes cells for renewed sugar fermentation; on fructose it can support long-term catabolite
  repression in the absence of Hxk2.
