- term:
    id: GO:0032473
    label: cytoplasmic side of mitochondrial outer membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000455350
  - UniProtKB:M4FD55
  - UniProtKB:P52789
  review:
    summary: IBA 'cytoplasmic side of mitochondrial outer membrane' derived from mammalian HK2 (P52789), whose mitochondrial
      binding (to VDAC) depends on an N-terminal hydrophobic helix absent from yeast hexokinases. Yeast evidence is limited
      to proteomic co-fractionation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Lineage-specific localisation propagated to fungal hexokinases. Both WITH/FROM donors of PTN000455350 for this
      term, human HK2 (P52789) and a Brassica hexokinase (M4FD55), carry an N-terminal hydrophobic segment (HK2 MIASHLLAYFF...,
      M4FD55 MGKVAVGATVVCAAAVCAASVYIV...) that anchors them to the outer mitochondrial membrane; the yeast hexokinases begin
      with a charged, non-hydrophobic N-terminus (MVHLGPKKPQARKGSMADVP...) and have no such anchor. The yeast evidence for
      mitochondrial association (proteomics and co-fractionation of all glycolytic enzymes) is captured by the mitochondrion
      rows and does not resolve the outer-membrane cytoplasmic face.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000455350
        source_label: PTN000455350
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Deep hexokinase-family node; the outer-membrane term is seeded only by anchor-bearing animal and plant
          hexokinases.
      - source_id: UniProtKB:P52789
        source_label: HK2 (human)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Binds the mitochondrial outer membrane through its N-terminal mitochondrial-binding peptide, absent from
          yeast Hxk1/Hxk2.
      - source_id: UniProtKB:M4FD55
        source_label: Brassica campestris hexokinase (unreviewed)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Plant hexokinase with an N-terminal hydrophobic membrane-anchor segment, absent from yeast Hxk1/Hxk2.
      residue_claims_not_applicable: The argument is the absence of a whole N-terminal membrane-anchor segment, not substitution
        of point residues.
    supported_by:
    - reference_id: PMID:16962558
      supporting_text: we show that all glycolytic enzymes are associated with mitochondria in yeast
