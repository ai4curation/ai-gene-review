- term:
    id: GO:0098708
    label: D-glucose import across plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00095375
  review:
    summary: ARBA rule assigning 'D-glucose import across plasma membrane' to hexokinases. Hexokinases are cytosolic and do
      not transport glucose; uptake is mediated by Hxt transporters.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The same term is marked as an over-annotation on the genetic-interaction rows of
      this review (PMID:6300872), and rows that share a term are judged alike. The
      observation behind the claim is real: low-Km glucose uptake is lost in a strain
      that lacks the sugar kinases and returns when HXK1, HXK2 or GLK1 is put back. The
      kinase does not move glucose across the membrane, which is the work of the Hxt
      transporters; it acts on the sugar once it is inside. The process term over-reads
      that dependence, and this electronic row repeats the claim without evidence of its
      own.
    supported_by:
    - reference_id: file:yeast/HXK1/HXK1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=D-glucose + ATP = D-glucose 6-phosphate + ADP + H(+);
