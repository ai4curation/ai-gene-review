  review:
    summary: IBA 'intracellular glucose homeostasis' from the hexokinase node PTN000455350, driven largely by mammalian glucokinase/HK
      donors (glucose sensing in beta cells/hepatocytes). For Hxk1 this only restates that glucose is consumed by phosphorylation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect consequence of hexose phosphorylation; no evidence that the yeast enzyme regulates intracellular glucose
      levels as a homeostatic function. The WITH/FROM donors of PTN000455350 for this term are mammalian glucokinases (mouse
      and rat Gck), HKDC1 (human and mouse) and Arabidopsis HXK1/GIN2, all characterised as glucose sensors in specialised
      contexts (beta-cell/hepatocyte glucose sensing, plant sugar signalling). No fungal hexokinase is among the donors, and
      the yeast enzymes share the catalytic activity, not those sensing contexts.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
