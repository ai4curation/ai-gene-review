description: 'DCI1 (YOR180C; also called ECI2/EHD2) encodes a peroxisomal Delta(3,5)-Delta(2,4)-dienoyl-CoA isomerase
  (di-isomerase, EC 5.3.3.21) of the enoyl-CoA hydratase/isomerase (crotonase) family and is about 50% identical
  to the Delta(3)-Delta(2)-enoyl-CoA isomerase Eci1p. Dci1p converts 3,5-dienoyl-CoAs, formed during beta-oxidation
  of unsaturated fatty acids with double bonds at odd-numbered positions, into 2,4-dienoyl-CoAs that are then reduced
  by 2,4-dienoyl-CoA reductase (Sps19p). Extracts of Dci1p-overproducing cells also show a weak intrinsic 3,2-isomerase
  activity, but genetic analysis indicates that Dci1p is not a physiological 3,2-isomerase: dci1 deletion mutants
  grow essentially normally on oleate, and the di-isomerase-dependent route is dispensable for oleate degradation,
  whereas Eci1p is essential. Dci1p is an oleate-induced (Oaf1/Pip2-regulated) peroxisomal matrix protein; it interacts
  with Eci1p and is needed for efficient peroxisomal import of Eci1p, which can enter peroxisomes using either its
  own PTS1 or that of Dci1p.'
