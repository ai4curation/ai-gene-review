core_functions:
- description: 'Peroxisomal Delta(3,5)-Delta(2,4)-dienoyl-CoA isomerase: converts 3,5-dienoyl-CoA intermediates
    of unsaturated fatty acid beta-oxidation into 2,4-dienoyl-CoAs, feeding the 2,4-dienoyl-CoA reductase (Sps19p)
    dependent auxiliary route. Dispensable for growth on oleate because the Eci1p (isomerase-dependent) route suffices.'
  molecular_function:
