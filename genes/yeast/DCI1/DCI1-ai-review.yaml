suggested_questions:
- question: Under which fatty acid diets (e.g. odd-position polyunsaturated fatty acids such as eicosapentaenoic
    or linoleic acid derivatives) does the Dci1p di-isomerase route carry significant flux in vivo?
- question: Does Dci1p form a stable hetero-oligomer with Eci1p in the peroxisomal matrix (piggy-back import), and
    does this complex alter either enzyme's activity?
suggested_experiments:
- hypothesis: Dci1p contributes measurably to beta-oxidation of fatty acids with double bonds at odd positions when
    the Eci1p route is limiting.
  description: Compare 14C-labelled oleate and petroselinate/eicosapentaenoate oxidation and acyl-CoA intermediate
    profiles (LC-MS/MS) in wild type, dci1, eci1, sps19 and double mutants.
