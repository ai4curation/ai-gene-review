descriptions:
- source: UniProt
  text: Peroxisomal di-isomerase that is involved in fatty acid metabolism enzyme
    by converting 3,5-dienoyl-CoAs to the corresponding 2,4-dienoyl-CoAs (PubMed:10381339,
    PubMed:10455114). Required for ECI1 to be located to the peroxisome (PubMed:10381339,
    PubMed:11302517).
