    overall_notes: 'Correct: peroxisomal 3,5-to-2,4-dienoyl-CoA di-isomerase, and
      required for peroxisomal import of Eci1. Does not say the enzyme is dispensable
      on oleate.'
- source: Alliance_Imported
  text: Peroxisomal protein; identification as a delta(3,5)-delta(2,4)-dienoyl-CoA
