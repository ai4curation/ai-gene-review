gene_symbol: DCI1
organism: yeast
uniprot_id: Q08558
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Peroxisomal di-isomerase that is involved in fatty acid metabolism enzyme
    by converting 3,5-dienoyl-CoAs to the corresponding 2,4-dienoyl-CoAs (PubMed:10381339,
    PubMed:10455114). Required for ECI1 to be located to the peroxisome (PubMed:10381339,
    PubMed:11302517).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08558
  source_id: Q08558
- source: Alliance_Imported
  text: Peroxisomal protein; identification as a delta(3,5)-delta(2,4)-dienoyl-CoA
    isomerase involved in fatty acid metabolism is disputed; DCI1 has a paralog, ECI1,
    that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/DCI1
  source_id: SGD:S000005706
- source: Alliance_Automated
  text: Enables delta(3)-delta(2)-enoyl-CoA isomerase activity and delta(3,5)-delta(2,4)-dienoyl-CoA
    isomerase activity. Involved in fatty acid beta-oxidation. Located in peroxisomal
    matrix. Orthologous to several human genes including ECI2 (enoyl-CoA delta isomerase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DCI1
  source_id: SGD:S000005706
