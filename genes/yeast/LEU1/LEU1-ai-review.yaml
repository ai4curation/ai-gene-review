description: '3-Isopropylmalate dehydratase (alpha-isopropylmalate isomerase, EC 4.2.1.33) of Saccharomyces
  cerevisiae, catalysing the second step of the leucine-specific branch of branched-chain amino acid biosynthesis:
  the reversible isomerisation of 2-isopropylmalate to 3-isopropylmalate via the dehydrated intermediate
  2-isopropylmaleate. Leu1 is an aconitase-family [4Fe-4S] enzyme; unlike the bacterial LeuC/LeuD heterodimer,
  the yeast enzyme is a single polypeptide containing both the large and small subunit regions. It is
  a soluble cytosolic enzyme that acts on 2-isopropylmalate exported from mitochondria, and its expression
  is repressed by leucine and activated via Leu3 bound to 2-isopropylmalate. leu1 mutants are leucine
  auxotrophs.'
