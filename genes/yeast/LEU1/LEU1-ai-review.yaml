  review:
    summary: InterPro IPR004431 (LeuD small-subunit domain) maps to the 3-isopropylmalate dehydratase
      complex, which describes the bacterial LeuC-LeuD heterodimer. In fungi the large and small subunit
      regions are fused in one polypeptide, and UniProt records the yeast enzyme as a monomer, so there
