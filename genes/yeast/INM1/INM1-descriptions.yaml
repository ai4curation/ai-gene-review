descriptions:
- source: UniProt
  text: Responsible for the provision of inositol required for synthesis of phosphatidylinositol
    and polyphosphoinositides.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38710
  source_id: P38710
- source: Alliance_Imported
  text: Inositol monophosphatase; involved in biosynthesis of inositol and in phosphoinositide
    second messenger signaling; INM1 expression increases in the presence of inositol
    and decreases upon exposure to antibipolar drugs lithium and valproate
  source_type: curated
  url: https://www.yeastgenome.org/locus/INM1
  source_id: SGD:S000001088
- source: Alliance_Automated
  text: Enables inositol monophosphate 1-phosphatase activity. Involved in inositol
    phosphate catabolic process. Located in cytoplasm and nucleus. Human ortholog(s)
    of this gene implicated in autosomal recessive intellectual developmental disorder
    59; bipolar disorder; intellectual disability; and schizophrenia. Orthologous
    to several human genes including IMPA2 (inositol monophosphatase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/INM1
  source_id: SGD:S000001088
