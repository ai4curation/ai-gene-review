  supporting_entities:
  - PANTHER:PTN000465134
  - UniProtKB:P29218
  review:
    summary: IBA for signal transduction, seeded only by human IMPA1 (P29218). IMPase recycles inositol
      from inositol monophosphates generated by the inositol cycle; it is a metabolic enzyme acting on
      a signalling by-product rather than a component that relays a signal. Yeast data show that IMPase
      activity is limiting for IP3 levels (it supplies inositol), not that INM1 transduces a signal. Signal
      transduction is too broad and indirect for INM1.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
