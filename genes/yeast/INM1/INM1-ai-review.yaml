  label: Saccharomyces cerevisiae S288C
description: 'INM1 (IMP1, YHR046C) encodes one of the two Saccharomyces cerevisiae inositol monophosphatases
  (IMPase, EC 3.1.3.25), a Mg2+-dependent, lithium- and sodium-sensitive member of the inositol monophosphatase
  (FIG) superfamily. Inm1 hydrolyses myo-inositol monophosphates to free myo-inositol and phosphate, catalysing
  the second and final step of de novo myo-inositol synthesis (dephosphorylation of the INO1 product 1D-myo-inositol
  3-phosphate) and recycling inositol from inositol phosphates generated by phospholipase C signalling.
  Inm1 is a soluble protein found in the cytoplasm and nucleus. It is functionally redundant with its
  paralog INM2: inm1 single mutants retain IMPase activity and inm1 inm2 double mutants are not inositol
  auxotrophs. Unusually for a phospholipid-pathway gene, INM1 expression is increased by inositol and
  decreased by lithium and valproate.'
