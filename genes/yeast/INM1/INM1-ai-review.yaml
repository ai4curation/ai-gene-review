suggested_questions:
- question: "Which phosphatase supplies inositol in inm1 inm2 double mutants, which are not inositol\n\
    \            auxotrophs, and does it act on 1D-myo-inositol 3-phosphate in vivo?"
- question: "Do Inm1 and Inm2 differ in substrate stereospecificity (inositol 1- vs 3-phosphate) or in\n\
    \            regulation, given that INM1 is induced by inositol whereas UASINO genes are repressed?"
suggested_experiments:
- description: "Measure inositol-3-phosphate versus inositol-1-phosphate hydrolysis by purified Inm1 and\n\
    \            Inm2 and determine intracellular inositol and Ins3P levels in inm1 inm2 cells with and\
    \ without\n            inositol to identify any residual phosphatase."
