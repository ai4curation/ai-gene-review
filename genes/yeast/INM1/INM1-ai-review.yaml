        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Sole experimental donor; IMPA1 is studied in lithium/inositol-depletion signalling contexts.
          Recycling inositol is a metabolic role, and no yeast evidence places Inm proteins in a signal
          relay.
