core_functions:
- description: 'Inositol monophosphatase: Mg2+-dependent, lithium-sensitive hydrolysis of myo-inositol
    monophosphate (physiologically 1D-myo-inositol 3-phosphate from INO1, and inositol 1-/4-phosphates
    recycled from inositol phosphate signalling) to free myo-inositol, the final step of de novo inositol
    synthesis; redundant with INM2.'
