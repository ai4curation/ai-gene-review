descriptions:
- source: UniProt
  text: Component of a microsomal membrane-bound long-chain fatty acid elongation
    system, which produces the 20-26-carbon very long-chain fatty acids (VLCFA) from
    long-chain fatty acid precursors and is involved ceramide and inositol sphingolipid
    biosynthesis. Component of elongase II, which elongates 16-18 carbon fatty acyl-CoAs
    such as palmitoyl-CoA and stearoyl-CoA to 20-22-carbon fatty acids by incorporation
    of malonyl-CoA (PubMed:12684876, PubMed:9211877). Involved in the synthesis of
    1,3-beta-glucan (PubMed:7768822). The enzymes active site faces the cytosol, whereas
    VLCFA length is determined by a lysine near the luminal end of transmembrane helix
    6 (PubMed:17719544). Plays an important role in lipotoxic cell death induced by
    oleic acid through maintaining a balanced fatty acid composition in thr plasma
    membrane (PubMed:29458843).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25358
