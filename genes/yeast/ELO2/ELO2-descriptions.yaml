descriptions:
- source: UniProt
  text: Component of a microsomal membrane-bound long-chain fatty acid elongation
    system, which produces the 20-26-carbon very long-chain fatty acids (VLCFA) from
    long-chain fatty acid precursors and is involved ceramide and inositol sphingolipid
    biosynthesis. Component of elongase II, which elongates 16-18 carbon fatty acyl-CoAs
    such as palmitoyl-CoA and stearoyl-CoA to 20-22-carbon fatty acids by incorporation
    of malonyl-CoA (PubMed:12684876, PubMed:9211877). Involved in the synthesis of
    1,3-beta-glucan (PubMed:7768822). The enzymes active site faces the cytosol, whereas
    VLCFA length is determined by a lysine near the luminal end of transmembrane helix
    6 (PubMed:17719544). Plays an important role in lipotoxic cell death induced by
    oleic acid through maintaining a balanced fatty acid composition in thr plasma
    membrane (PubMed:29458843).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25358
  source_id: P25358
- source: Alliance_Imported
  text: Fatty acid elongase, involved in sphingolipid biosynthesis; acts on fatty
    acids of up to 24 carbons in length; mutations have regulatory effects on 1,3-beta-glucan
    synthase, vacuolar ATPase, and the secretory pathway; ELO2 has a paralog, ELO1,
    that arose from the whole genome duplication; lethality of the elo2 elo3 double
    null mutation is functionally complemented by human ELOVL1 and weakly complemented
    by human ELOVL3 or ELOV7
  source_type: curated
  url: https://www.yeastgenome.org/locus/ELO2
  source_id: SGD:S000000630
- source: Alliance_Automated
  text: Enables fatty acid elongase activity. Involved in late endosome to vacuole
    transport via multivesicular body sorting pathway and lipid biosynthetic process.
    Located in endoplasmic reticulum membrane. Human ortholog(s) of this gene implicated
    in spinocerebellar ataxia 38. Orthologous to several human genes including ELOVL2
    (ELOVL fatty acid elongase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ELO2
