  label: Saccharomyces cerevisiae S288C
description: Fatty acid elongase 2 (Elo2/Fen1/Gns1/Vbm2) is a multi-pass endoplasmic reticulum membrane 3-keto-acyl-CoA
  synthase of the ELO family that catalyses the rate-limiting condensation of an acyl-CoA with malonyl-CoA, the
  first of the four reactions of the ER fatty acid elongation cycle. Elo2 forms elongase II, which extends C16-C18
  acyl-CoAs to C20-C24 species; the downstream reduction, dehydration and second reduction are carried out by Ifa38,
  Phs1 and Tsc13, with which Elo2 co-immunoprecipitates. Its active site faces the cytosol and product length is
  set by a lysine near the luminal end of transmembrane helix 6. Elo2 is partially redundant with Elo3 (the elo2
  elo3 double mutant is inviable); the VLCFAs produced are the amide-linked acyl chains of ceramide and inositol
  sphingolipids, and loss of Elo2 lowers all sphingolipid classes, raises long-chain bases and causes pleiotropic
  membrane phenotypes (1,3-beta-glucan synthesis, secretion, endosomal traffic).
