core_functions:
- description: 'Condensing enzyme (3-keto-acyl-CoA synthase) of the ER VLCFA elongation cycle: condenses C16-C18
    acyl-CoAs (elongase II) toward C20-C24 products with malonyl-CoA; works with Ifa38, Phs1 and Tsc13 to add two
    carbons per cycle.'
