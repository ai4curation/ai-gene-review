- question: What fraction of the reported vesicle-trafficking and 1,3-beta-glucan phenotypes of elo2/fen1 mutants
    is explained by altered ceramide acyl-chain length versus long-chain base accumulation?
suggested_experiments:
- hypothesis: Elo2 substrate range in vivo is restricted to saturated C16-C22 acyl-CoAs.
  description: Reconstitute purified Elo2 with Ifa38, Phs1 and Tsc13 in proteoliposomes and test saturated versus
    monounsaturated C16-C20 acyl-CoA primers by LC-MS.
