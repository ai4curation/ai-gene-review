suggested_questions:
- question: Is Yat1p associated with the outer mitochondrial membrane (as proposed by Schmalix and Bandlow) or peripheral
    to the inner membrane on the IMS side (as annotated in UniProt)?
- question: Do Yat1p and Yat2p form a functional hetero-complex, as suggested by reproducible Y2H and AP-MS interactions?
suggested_experiments:
- hypothesis: Yat1p is anchored on the cytosolic face of the outer mitochondrial membrane
  description: Protease protection and carbonate extraction of isolated mitochondria and mitoplasts with epitope-tagged
    Yat1p, with Tom70/Tim44/Cyb2 as compartment markers.
  experiment_type: biochemical fractionation
