- description: 'Mitochondrial carnitine O-acetyltransferase: reversibly transfers acetyl groups between acetyl-CoA
    and L-carnitine, providing acetylcarnitine for the carnitine shuttle that moves acetyl units into mitochondria.
    It is induced on ethanol/acetate and is non-redundant with CAT2 and YAT2 when the glyoxylate-cycle bypass is
    absent.'
