id: P80235
gene_symbol: YAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: YAT1 encodes one of the three carnitine O-acetyltransferases (EC 2.3.1.7) of Saccharomyces cerevisiae,
  together with CAT2 and YAT2. These enzymes reversibly transfer acetyl groups between acetyl-CoA and L-carnitine,
  producing acetylcarnitine that can cross organellar membranes as part of the carnitine shuttle. Yat1p is a 78
  kDa mitochondrial protein without a cleavable presequence. It was proposed to sit at the outer mitochondrial membrane,
  while UniProt lists it as peripheral to the inner membrane (intermembrane-space side). Expression is low on glucose
  and strongly induced by ethanol or acetate. Deleting YAT1 alone has little effect, but in a strain lacking the
  glyoxylate-cycle citrate synthase CIT2, all three carnitine acetyltransferases and L-carnitine become essential
  for growth on non-fermentable carbon sources. This points to a non-redundant role for Yat1p in moving acetyl units
  into mitochondria.
