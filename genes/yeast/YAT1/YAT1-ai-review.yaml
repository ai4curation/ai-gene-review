  review:
    summary: ISS to rat CPT2 (P18886), citing Schmalix and Bandlow, who noted similarity to vertebrate carnitine
      acyltransferases. Sequence similarity across the carnitine/choline acyltransferase family does not establish
      palmitoyl (long-chain) specificity. The activity actually measured for Yat1p is carnitine acetyltransferase,
      and the yeast carnitine shuttle is described for acetyl units only. The essence (carnitine acyltransferase)
      is right but the acyl-chain specificity is wrong, so this is replaced with carnitine O-acetyltransferase activity.
