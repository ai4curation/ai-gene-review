  text: Predicted to enable carnitine O-acetyltransferase activity and carnitine O-palmitoyltransferase
    activity. Involved in carnitine metabolic process. Located in mitochondrion. Human
    ortholog(s) of this gene implicated in brain disease; carnitine palmitoyltransferase
    II deficiency; lipid metabolism disorder; mitochondrial metabolism disease; and
    muscular disease. Orthologous to human CPT2 (carnitine palmitoyltransferase 2).
