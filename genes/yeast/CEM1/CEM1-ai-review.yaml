id: P39525
gene_symbol: CEM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CEM1 (YER061C) encodes the mitochondrial beta-ketoacyl-[acyl-carrier-protein] synthase (KAS,
  EC 2.3.1.41) of S. cerevisiae, a FabF-like member of the thiolase superfamily. Within the matrix it
  catalyses the Claisen condensation of acyl-ACP with malonyl-ACP (on the mitochondrial ACP, Acp1) to
  form 3-oxoacyl-ACP, the chain-extending step of the bacterial-like type II mitochondrial fatty acid
  synthase (mtFAS) that also comprises Hfa1, Mct1, Oar1, Htd2 and Etr1. mtFAS produces octanoyl-ACP, the
  precursor of lipoic acid needed for lipoylation of pyruvate and 2-oxoglutarate dehydrogenases, together
  with longer acyl chains needed for respiratory competence. cem1 null mutants are respiratory deficient
  with lowered lipoic acid levels, a defect complemented by the human mitochondrial KAS OXSM.
