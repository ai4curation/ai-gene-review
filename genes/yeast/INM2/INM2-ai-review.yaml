  label: Saccharomyces cerevisiae S288C
description: INM2 (IMP2, YDR287W) encodes one of the two Saccharomyces cerevisiae inositol monophosphatases
  (IMPase, EC 3.1.3.25), a Mg2+-dependent, lithium- and sodium-sensitive member of the inositol monophosphatase
  superfamily. Inm2 hydrolyses myo-inositol monophosphates to free myo-inositol and phosphate, catalysing
  the final step of de novo myo-inositol synthesis from the INO1 product 1D-myo-inositol 3-phosphate and
  recycling inositol from inositol phosphates produced by phospholipase C signalling. It is redundant
  with its paralog INM1; inm1 inm2 double mutants are viable, not auxotrophic for inositol, but accumulate
  inositol monophosphates and have reduced Ins(1,4,5)P3, while INM2 overexpression raises lithium and
  sodium tolerance.
