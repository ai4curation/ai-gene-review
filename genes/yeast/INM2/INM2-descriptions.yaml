descriptions:
- source: UniProt
  text: Responsible for the provision of inositol required for synthesis of phosphatidylinositol
    and polyphosphoinositides and involved in the inositol cycle of calcium signaling.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05533
  source_id: Q05533
- source: Alliance_Imported
  text: Inositol monophosphatase; involved in biosynthesis of inositol; enzymatic
    activity requires magnesium ions and is inhibited by lithium and sodium ions;
    inm1 inm2 double mutant lacks inositol auxotrophy
  source_type: curated
  url: https://www.yeastgenome.org/locus/INM2
  source_id: SGD:S000002695
- source: Alliance_Automated
  text: Enables inositol monophosphate 1-phosphatase activity. Involved in inositol
    phosphate catabolic process. Predicted to be active in cytoplasm. Human ortholog(s)
    of this gene implicated in autosomal recessive intellectual developmental disorder
    59; bipolar disorder; intellectual disability; and schizophrenia. Orthologous
    to several human genes including IMPA2 (inositol monophosphatase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/INM2
  source_id: SGD:S000002695
