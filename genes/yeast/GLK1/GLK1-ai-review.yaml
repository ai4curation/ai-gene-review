id: P17709
gene_symbol: GLK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GLK1 encodes glucokinase-1 of Saccharomyces cerevisiae, a monomeric member of the hexokinase
  family (EC 2.7.1.2) that phosphorylates D-glucose (and D-mannose) at C-6 using ATP, but, unlike the
  hexokinases Hxk1 and Hxk2, does not phosphorylate fructose. Glk1 is one of three yeast glucose-phosphorylating
  enzymes; in strains lacking both hexokinases it is sufficient to support growth on glucose and glycolytic
  flux, whereas a hxk1 hxk2 glk1 triple mutant cannot use glucose. GLK1 is expressed mainly under glucose-limited,
  non-fermentative and stress conditions. Glk1 is a cytosolic enzyme, and the cognate glucose kinases
  influence the high-affinity component of glucose uptake measured in kinetic assays.
