descriptions:
- source: UniProt
  text: Two isoenzymes, hexokinase-1 and hexokinase-2, can phosphorylate keto- and
    aldohexoses in yeast, whereas a third isoenzyme, GLK, is specific for aldohexoses.
    All glucose phosphorylating enzymes are involved in glucose uptake.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P17709
  source_id: P17709
- source: Alliance_Imported
  text: Glucokinase; catalyzes the phosphorylation of glucose at C6 in the first irreversible
    step of glucose metabolism; one of three glucose phosphorylating enzymes; expression
    regulated by non-fermentable carbon sources; GLK1 has a paralog, EMI2, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLK1
  source_id: SGD:S000000545
- source: Alliance_Automated
  text: Enables glucokinase activity. Involved in D-glucose import across plasma membrane;
    glycolytic process; and hexose metabolic process. Located in cytosol and plasma
    membrane. Used to study hyperglycemia; hyperinsulinemic hypoglycemia; maturity-onset
    diabetes of the young; and neonatal diabetes mellitus. Human ortholog(s) of this
    gene implicated in several diseases, including anemia (multiple); artery disease
    (multiple); glucose metabolism disease (multiple); hematologic cancer (multiple);
    and retinitis pigmentosa (multiple). Orthologous to several human genes including
    GCK (glucokinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLK1
  source_id: SGD:S000000545
