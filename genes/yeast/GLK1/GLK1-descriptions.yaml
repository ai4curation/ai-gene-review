descriptions:
- source: UniProt
  text: Two isoenzymes, hexokinase-1 and hexokinase-2, can phosphorylate keto- and
    aldohexoses in yeast, whereas a third isoenzyme, GLK, is specific for aldohexoses.
    All glucose phosphorylating enzymes are involved in glucose uptake.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P17709
  source_id: P17709
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: 'Mostly about the hexokinase family: Glk1 is aldohexose-specific.
      The claim that all glucose phosphorylating enzymes are involved in glucose uptake
      is dated; the review marks glucose import as over-annotated.'
- source: Alliance_Imported
  text: Glucokinase; catalyzes the phosphorylation of glucose at C6 in the first irreversible
    step of glucose metabolism; one of three glucose phosphorylating enzymes; expression
    regulated by non-fermentable carbon sources; GLK1 has a paralog, EMI2, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLK1
  source_id: SGD:S000000545
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct: glucokinase phosphorylating glucose at C6, one of three
      glucose-phosphorylating enzymes, induced on non-fermentable carbon, EMI2 paralog.
      Does not state the lack of fructose activity.'
- source: Alliance_Automated
  text: Enables glucokinase activity. Involved in D-glucose import across plasma membrane;
    glycolytic process; and hexose metabolic process. Located in cytosol and plasma
    membrane. Used to study hyperglycemia; hyperinsulinemic hypoglycemia; maturity-onset
    diabetes of the young; and neonatal diabetes mellitus. Human ortholog(s) of this
    gene implicated in several diseases, including anemia (multiple); artery disease
    (multiple); glucose metabolism disease (multiple); hematologic cancer (multiple);
    and retinitis pigmentosa (multiple). Orthologous to several human genes including
    GCK (glucokinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLK1
  source_id: SGD:S000000545
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 2
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: Correct activity and glycolysis, but includes glucose import and
      plasma membrane, which the review marks as over-annotated. Long disease lists
      dominate.
findings:
- category: discrepancy
  text: Glucose import across the plasma membrane and plasma membrane location (automated)
    and the glucose uptake claim (UniProt) are marked as over-annotated in the review,
    which places Glk1 in the cytosol.
  sources:
  - UniProt
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: All agree on glucose phosphorylation. UniProt and the automated text
    tie Glk1 to glucose uptake and the plasma membrane, which the review does not
    accept.
