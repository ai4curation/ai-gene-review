- description: 'Cln2-Cdc28 primes the multisite phosphorylation of the S-phase CDK inhibitor Sic1 (T5
    phosphorylation via a Cln2-specific docking motif, extended by Clb5-Cdc28 to the SCF(Cdc4) phosphodegrons)
