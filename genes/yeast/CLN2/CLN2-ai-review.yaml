  review:
    summary: 'Phylogenetic (PAINT) annotation of the G1/S transition to the G1 cyclin clade (node PTN000019791,
      whose experimental descendants include cyclin D, cyclin E, Cln3 and Clb5/6). Cln2 is the textbook
      budding-yeast G1/S cyclin: Cln2-Cdc28 closes the Whi5/SBF positive feedback loop and primes Sic1
      and Far1 for SCF-dependent destruction, which is precisely the sequence GO:0000082 describes (build-up
      of G1 CDK, transcription of G1 cyclins, positive feedback committing the cell to S phase).'
    action: ACCEPT
    reason: The IBD node placement is sound (the G1/S-promoting function of G1 cyclin-CDKs is ancestral
      to the clade) and Cln2 has abundant direct experimental support for the same biology on its own
      (the Start/IGI/IMP rows below; Cln2-Cdc28 phosphorylation of Whi5, Stb1, Sic1 and Far1 in cached
      full texts). The target itself is not in this row's WITH/FROM list, but sister members Cln3, Clb5
      and Clb6 are, and the transfer to Cln2 is fully consistent with its own evidence.
