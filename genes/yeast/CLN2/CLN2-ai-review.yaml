  review:
    summary: 'Phylogenetic annotation that Cln2 is active in the nucleus. Although most Cln2 is cytoplasmic
      at steady state, the protein shuttles: hypophosphorylated Cln2-Cdc28 is imported into the nucleus,
      is nuclear in small newborn cells, and an appended NES weakens Cln2 function in complementation
      and cell-size assays. Its key Start substrates (Whi5/SBF at promoters, Sic1, Far1) are nuclear and
      Far1 is degraded specifically in the nucleus after Cln2-Cdc28 phosphorylation.'
    action: ACCEPT
    reason: Nuclear activity of G1 cyclin-CDKs is ancestral for the node and target-specific evidence
      (NES-Cln2 loses functions; forced nuclear localization supports specific Cln2 functions; nuclear
      substrates) confirms that a nuclear pool of Cln2-Cdc28 acts. The target (SGD:S000006177) appears
      in its own WITH/FROM list, as expected.
    supported_by:
    - reference_id: PMID:10611233
      supporting_text: Overall, it appears that Cln2p is required in both the cytoplasm and the nucleus
        of the cell for maximal function
      reference_section_type: DISCUSSION
    - reference_id: PMID:11509671
      supporting_text: These data are consistent with regulated shuttling of Cln2p in and out of the nucleus,
        where nonphosphorylated Cln2p is enriched in the nucleus and phosphorylated Cln2p is enriched
        in the cytoplasm
      reference_section_type: DISCUSSION
    - reference_id: PMID:11792824
      supporting_text: Forced localization showed that some functions of Cln2 required a cytoplasmic location,
        while other functions required a nuclear location
      reference_section_type: ABSTRACT
    propagation_review:
