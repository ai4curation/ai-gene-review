core_functions:
- description: 'Regulatory cyclin subunit that binds and activates the cyclin-dependent kinase Cdc28 (Cdk1),
    forming the Cln2-Cdc28-Cks1 holoenzyme that executes Start: transcribed by SBF in late G1, Cln2-Cdc28
    completes the phosphorylation and displacement of the SBF-bound repressor Whi5 (and phosphorylates
    the SBF co-regulator Stb1), closing the positive feedback loop that makes the G1/S transcriptional
    burst rapid and irreversible and committing the cell to the G1/S transition.'
