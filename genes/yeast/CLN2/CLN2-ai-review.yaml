gene_symbol: CLN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Cln2 is one of the two closely related G1/S cyclins (Cln1 and Cln2) of the budding yeast
  Saccharomyces cerevisiae and, together with the upstream G1 cyclin Cln3, forms the trio of Cln proteins
  of which at least one is required for passage through Start, the point in late G1 at which the cell
  commits to a new division cycle. Cln2 has no catalytic activity of its own: it is a cyclin-box protein
  that binds the sole essential cyclin-dependent kinase Cdc28 (Cdk1) and, with the Cks1 subunit, forms an
  active Cln2-Cdc28 kinase that requires Cak1-dependent phosphorylation of Cdc28 Thr169. CLN2 is transcribed
  in late G1 by the SBF (Swi4-Swi6) transcription factor once Cln3-Cdc28 has begun to inactivate the SBF-bound
  repressor Whi5; the newly made Cln2-Cdc28 then completes Whi5 phosphorylation and displacement (and
  phosphorylates the SBF co-regulator Stb1), closing a positive feedback loop that makes the burst of
  Start transcription rapid, coherent and irreversible. Cln2-Cdc28 also primes the multisite phosphorylation
  of the S-phase CDK inhibitor Sic1 and phosphorylates the pheromone-induced CDK inhibitor Far1, generating
  phosphodegrons recognised by SCF(Cdc4), so that Clb5/6-Cdc28 is released to initiate DNA replication;
  it phosphorylates Cdc6, and its cytoplasmic pool, concentrated at sites of polarized growth, acts on
  polarity and morphogenesis regulators to trigger bud emergence and spindle pole body duplication. Cln2-Cdc28
  additionally shuts off the mating MAP kinase pathway by phosphorylating the scaffold Ste5 (and Ste20),
  which is why cells past Start are refractory to pheromone and why Cln2 promotes recovery from pheromone
  arrest. Cln2 shuttles between nucleus and cytoplasm: Cdc28-dependent phosphorylation of its C terminus
  drives nuclear exclusion, so the unphosphorylated protein is transiently nuclear early in the cycle while
  the bulk is cytoplasmic. The protein is very unstable (half-life about 10 min), with a PEST-rich C
  terminus that is phosphorylated by Cdc28 and recognised mainly by SCF(Grr1); its mRNA and protein
  peak in G1 and fall as cells enter S phase, and both are lost in cells exposed to mating pheromone,
  whose effector Far1 also inhibits Cln-Cdc28 directly. Cln1 and Cln2 belong to a Saccharomycotina-specific
  cyclin family distinct from Cln3 and from the B-type Clb cyclins; cln2 single mutants are viable, cln1
  cln2 double mutants grow slowly with delayed budding and DNA synthesis, and cln1 cln2 cln3 triple mutants
  arrest as unbudded cells at Start. The dominant CLN2-1 truncation, which removes the destabilising C
  terminus, advances the G1/S transition and renders cells resistant to G1-arresting signals.'
