suggested_questions:
- question: Which Cln2-Cdc28 substrates in the cytoplasm account for its Cln2-specific, non-interchangeable
    role in polarization and bud emergence, and does docking through the LP motif or localization at
    polarized-growth sites explain why a mitotic cyclin cannot substitute?
- question: Is the transient nuclear residence of hypophosphorylated Cln2-Cdc28 in newborn cells the
    pool that phosphorylates Whi5 and Sic1, or do cytoplasmic Cln2-Cdc28 complexes act on these substrates
    during their own nucleocytoplasmic shuttling?
- question: To what extent is Cln2 turnover physiologically shared between SCF(Grr1) and SCF(Cdc4), and
    is the F-box choice determined by the compartment in which phosphorylated Cln2 resides?
suggested_experiments:
- hypothesis: Cln2-Cdc28 has a compartment-specific substrate repertoire that underlies the Cln2/Cln3
    functional split.
  description: Combine analog-sensitive cdc28-as1 with rapidly degradable (AID) Cln2 and NLS- versus NES-tethered
    Cln2 variants, then perform quantitative phosphoproteomics within minutes of Cln2 release in synchronized
    small daughter cells to map nuclear (Whi5, Stb1, Sic1, Far1) versus cytoplasmic (polarity, Ste5) targets.
- hypothesis: Cln2-specific docking (VLLPP-type LP motifs) rather than bulk CDK activity is required
    for bud emergence.
  description: Using a cyclin-replacement strain in which Cln1/2/3 are replaced by an inducible mitotic
    cyclin, test whether Cln2 docking-pocket mutants, Cln2-Clb chimeras or LP-motif mutants of candidate
    polarity substrates restore or abolish polarized growth, scoring bud emergence and Cdc42 polarization
    by live imaging.
