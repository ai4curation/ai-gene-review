  review:
    summary: 'Proposed annotation for the positive-feedback arm of Start transcription. Recombinant Cln2-Cdc28
      phosphorylates the SBF-bound repressor Whi5 and releases it from a preassembled Whi5-Swi4-Swi6
      complex in vitro (an activity that purified Cln3-Cdc28 and Pcl9-Pho85 lack), and in vivo the
      slow-migrating Whi5 phosphoforms are completely absent in cln1 cln2 cells (Huang et al. 2009, full
      text cached; the same in vitro result was first reported by de Bruin et al. 2004). Cln2-Cdc28 also
      phosphorylates the SBF co-regulator Stb1 (Ho et al. 1999). The G1/S term definitions (GO:0000082,
      GO:0007089) presuppose this positive feedback of G1 cyclins on SBF-driven transcription, but no
      transcription-branch term is currently annotated to CLN2.'
    action: NEW
    reason: 'Participation test met: Cln2-Cdc28 is the kinase that phosphorylates Whi5 and Stb1, dissociating
      the repressor from SBF and enabling the burst of SBF/MBF-dependent RNA polymerase II transcription
      at Start, so the gene product does the work of the positive regulation rather than merely being required
      for it. Comparator check: the sister cyclin Cln3 carries SGD experimental annotations to the regulation-of-transcription
      branch (GO:0006357, IGI/IMP from the same Huang et al. 2009 study), so the term is one curators
      use for the cyclin that phosphorylates Whi5; the historical caveat that CLN1/CLN2 are dispensable
      for the initial activation of SBF (Cln3 suffices, as noted in Ho et al. 1999) does not contradict
      a positive-regulatory role, since Cln1/Cln2 feedback is what makes the transcriptional burst complete
      and coherent. The positive term is used to match the treatment of Cln3 (GO:0006357 modified to GO:0045944)
      and of the core_functions block; it sits on a different branch from GO:0000082 and GO:0007089, so
      it is not redundant with them. Retained at IDA strength because the in vitro dissociation assay and
      the in vivo phosphoform dependence are in the cached full text.'
    supported_by:
    - reference_id: PMID:19823668
