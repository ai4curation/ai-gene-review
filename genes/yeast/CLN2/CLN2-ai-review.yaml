- term:
    id: GO:0000321
    label: re-entry into mitotic cell cycle after pheromone arrest
  evidence_type: IGI
  original_reference_id: PMID:9927449
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000999
  review:
    summary: 'Leza & Elion 1999 (genetic interaction with POG1): pheromone-arrested cells that fail to
      mate recover by re-entering the cycle; POG1 overexpression blocks alpha-factor repression of CLN1/CLN2
      transcription, and epistasis shows that POG1 promotes recovery through CLN2, with the resulting
      Cln2 protein acting primarily on Ste20, an activator of the mating MAPK cascade.'
    action: KEEP_AS_NON_CORE
    reason: Cln2-Cdc28 does the work of recovery - it phosphorylates Far1 to trigger its degradation
      and phosphorylates the MAPK scaffold Ste5 (and Ste20) to shut off pheromone signalling - so the
      participation test is met and the annotation is correct. It is, however, a context-specific application
      of the same G1 CDK activity that executes Start, and the pheromone-recovery process is downstream
      of the core G1/S function; it is therefore retained as non-core, in line with the treatment of
      substrate-derived downstream processes for the other Cln cyclins. The cached record is abstract-only,
      so the specific epistasis experiments are deferred to the SGD curator.
    supported_by:
    - reference_id: PMID:9927449
      supporting_text: Genetic tests strongly argue that POG1 promotes recovery through upregulation of
        the CLN2 gene and that the resulting Cln2 protein promotes recovery primarily through an effect
        on Ste20, an activator of the mating MAPK cascade
      reference_section_type: ABSTRACT
    - reference_id: PMID:17289571
      supporting_text: In this study, we report that G1 CDK activity inhibits pheromone signaling by inhibiting
        Ste5 membrane recruitment
      reference_section_type: INTRODUCTION
    - reference_id: PMID:11080155
      supporting_text: ubiquitylation of Far1-nls1 or Far1-nls1/2 was dependent on phosphorylation of
        serine 87 by Cdc28–Cln2
      reference_section_type: RESULTS
