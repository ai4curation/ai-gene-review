gene_symbol: CLN2
organism: yeast
uniprot_id: P20438
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Essential for the control of the cell cycle at the G1/S (start) transition.
    Interacts with the CDC28 protein kinase to form MPF.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P20438
  source_id: P20438
- source: Alliance_Imported
  text: G1 cyclin involved in regulation of the cell cycle; activates Cdc28p kinase
    to promote the G1 to S phase transition; late G1 specific expression depends on
    transcription factor complexes, MBF (Swi6p-Mbp1p) and SBF (Swi6p-Swi4p); CLN2
    has a paralog, CLN1, that arose from the whole genome duplication; cell cycle
    arrest phenotype of the cln1 cln2 cln3 triple null mutant is complemented by any
    of human cyclins CCNA2, CCNB1, CCNC, CCND1, or CCNE1
  source_type: curated
  url: https://www.yeastgenome.org/locus/CLN2
  source_id: SGD:S000006177
- source: Alliance_Automated
  text: Enables cyclin-dependent protein serine/threonine kinase regulator activity.
    Involved in re-entry into mitotic cell cycle after pheromone arrest and traversing
    start control point of mitotic cell cycle. Located in cytoplasm and nucleus. Part
    of cyclin-dependent protein kinase holoenzyme complex. Used to study amyotrophic
    lateral sclerosis.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CLN2
  source_id: SGD:S000006177
