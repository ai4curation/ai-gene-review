core_functions:
- description: Glutathione S-transferase (EC 2.5.1.18) conjugating reduced glutathione to electrophilic
    substrates (e.g. CDNB); peripheral ER-membrane protein induced after the diauxic shift and needed
    for stationary-phase thermotolerance. Also shows GSH-dependent peroxidase activity toward organic
    hydroperoxides.
