id: P40582
gene_symbol: GTT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GTT1 (YIR038C) encodes a glutathione S-transferase that does not group with the classical
  GST classes. Recombinant Gtt1 forms homodimers and catalyses the conjugation of reduced glutathione
  to electrophiles such as 1-chloro-2,4-dinitrobenzene, and also has glutathione-dependent peroxidase
  activity toward organic hydroperoxides such as cumene hydroperoxide. Gtt1 is a peripheral membrane protein
  associated with the endoplasmic reticulum. Its expression rises after the diauxic shift and stays high
  in stationary phase, and gtt1 and gtt2 deletion mutants are sensitive to heat shock in stationary phase
  and grow poorly at 39 C. Gtt1 and Gtt2 are needed, with the GS-X pump Ycf1, for glutaredoxin-mediated
  resistance to hydroperoxides, consistent with glutathione conjugation and vacuolar sequestration of
  oxidised products. Gtt1 has also been implicated in oxidative-stress-induced S-glutathionylation of
  the vacuolar TRP channel Yvc1.
