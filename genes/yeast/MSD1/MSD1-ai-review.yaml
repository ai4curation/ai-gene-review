id: P15179
gene_symbol: MSD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  MSD1 (YPL104W) encodes the mitochondrial aspartyl-tRNA synthetase (AspRS) of
  Saccharomyces cerevisiae, a nuclear-encoded class II aminoacyl-tRNA synthetase of the
  bacterial-type (type 1) AspRS lineage, distinct from the cytoplasmic AspRS encoded by DPS1.
  The 658-residue protein has an N-terminal OB-fold anticodon-binding domain, a class II
  catalytic core with the bacterial-type GAD insertion domain between motifs 2 and 3, and
  conserved aspartate- and ATP-binding residues. It catalyzes the ATP-dependent attachment
  of L-aspartate to mitochondrial tRNA(Asp), forming aspartyl-tRNA(Asp) for translation on
  mitochondrial ribosomes. Disruption of MSD1 abolishes aspartylation of mitochondrial
  tRNA(Asp) in isolated mitochondria and produces a respiratory-deficient phenotype typical
  of loss of mitochondrial protein synthesis, with secondary instability of the mitochondrial
  genome. A missense allele (S388N, in the GAD insertion domain) suppresses an acceptor-stem
  mutation in the mitochondrially encoded tRNA(Asp), consistent with direct recognition of
  that tRNA by the enzyme. The protein is found in purified mitochondria and, by analogy with
  other mitochondrial synthetases, acts in the matrix. MSD1 is the yeast ortholog of human
  DARS2 and is used as a complementation model for DARS2 disease variants.
