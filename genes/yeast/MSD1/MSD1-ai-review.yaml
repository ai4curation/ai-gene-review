core_functions:
- description: Mitochondrial aspartyl-tRNA synthetase. Catalyzes ATP-dependent attachment of
    L-aspartate to mitochondrial tRNA(Asp) in the mitochondrial matrix, supplying Asp-tRNA(Asp) for
    translation on mitochondrial ribosomes. In yeast the activity is established genetically and
    biochemically (loss of tRNA(Asp) acylation in disruptant mitochondria; allele-specific
    suppression of a mitochondrial tRNA(Asp) mutation); the matrix location, homodimeric assembly and
    residue-level mechanism are inferred from homology to characterized bacterial and human AspRS.
  molecular_function:
    id: GO:0004815
    label: aspartate-tRNA ligase activity
  directly_involved_in:
  - id: GO:0070127
    label: tRNA aminoacylation for mitochondrial protein translation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:2668951
    supporting_text: Mitochondria from a mutant with a disrupted chromosomal copy of MSD1 are unable
      to acylate mitochondrial aspartyl-tRNA.
  - reference_id: PMID:10710420
    supporting_text: We conclude that the base substitution causes the respiratory rescue and discuss
      the possible mechanism as one which enhances interaction between the mutated tRNA Asp and the
      suppressor version of AspRS.
  - reference_id: file:yeast/MSD1/MSD1-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: Catalyzes the attachment of aspartate to tRNA(Asp) in the'
suggested_questions:
- question: Does purified recombinant Msd1 aminoacylate yeast mitochondrial tRNA(Asp) in vitro, and
    with what kinetics relative to human DARS2?
- question: Does the S388N (NSM3) enzyme aminoacylate the C72U mutant mitochondrial tRNA(Asp) more
    efficiently than wild-type Msd1, as proposed by Chiang and Liaw?
- question: Does Msd1 misacylate mitochondrial tRNA(Asn), as reported for human DARS2, given that the
    yeast mitochondrial Asn-tRNA(Asn) formation route differs from bacteria lacking AsnRS?
