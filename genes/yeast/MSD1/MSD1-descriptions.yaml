  text: Enables aspartate-tRNA ligase activity. Involved in mitochondrial aspartyl-tRNA
    aminoacylation. Located in mitochondrion. Used to study leukodystrophy. Human
    ortholog(s) of this gene implicated in Charcot-Marie-Tooth disease type 2 and
    mitochondrial metabolism disease. Orthologous to human DARS2 (aspartyl-tRNA synthetase
