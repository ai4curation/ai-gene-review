      notes: Uses more generic terms than Alliance automated version.
    overall_notes: Similar to Alliance automated but uses slightly different GO terms
      (e.g., "establishment of protein localization to membrane" instead of TA insertion).
      This is actually less specific. Same misleading "unfolded protein binding" issue.
