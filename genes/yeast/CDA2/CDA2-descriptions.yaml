descriptions:
- source: UniProt
  text: Hydrolyzes the N-acetamido groups of N-acetyl-D-glucosamine residues in chitin
    to form chitosan and acetate (PubMed:11812231, PubMed:9133736). Chitosan is a
    component of the spore wall (PubMed:9133736).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06703
  source_id: Q06703
- source: Alliance_Imported
  text: Chitin deacetylase; together with Cda1p involved in the biosynthesis ascospore
    wall component, chitosan; required for proper rigidity of the ascospore wall
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDA2
  source_id: SGD:S000004299
- source: Alliance_Automated
  text: Enables chitin deacetylase activity and cobalt ion binding activity. Involved
    in ascospore wall assembly and chitin catabolic process. Predicted to be located
    in ascospore-type prospore. Predicted to be active in cytosol.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDA2
  source_id: SGD:S000004299
