suggested_questions:
- question: Is Co2+ the physiological activating metal of Cda2p in the prospore lumen, or does it substitute for
    Zn2+ as in other CE4 enzymes?
- question: Do Cda1p and Cda2p produce chitosan with different acetylation patterns, and does this matter for dityrosine-layer
    attachment?
suggested_experiments:
- description: Determine the deacetylation pattern produced by Cda2p versus Cda1p on chitin oligomers by MS/NMR,
    and test single-mutant spores for quantitative chitosan content.
