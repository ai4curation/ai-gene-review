core_functions:
- description: Sporulation-specific secreted, Co2+-activated CE4 chitin deacetylase that converts Chs3p-derived
    chitin into chitosan in the forming ascospore wall, redundantly with CDA1.
  molecular_function:
    id: GO:0004099
