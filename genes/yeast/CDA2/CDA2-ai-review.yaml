taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Chitin deacetylase 2 (Cda2p) of Saccharomyces cerevisiae is a sporulation-specific, secreted, N-glycosylated
  carbohydrate esterase family 4 (NodB domain) enzyme that hydrolyses the N-acetamido groups of GlcNAc residues
  in chitin to give chitosan and acetate (EC 3.5.1.41). Purified Cda2p is a ~43 kDa monomeric glycoprotein that
  requires at least chitobiose as substrate, has a pH optimum of 8 and is activated by Co2+. CDA2 is a tandem paralog
  of CDA1; both are expressed only during sporulation, contribute equally and redundantly to total chitin deacetylase
  activity, and convert Chs3p-derived chitin into the chitosan layer of the ascospore wall. Spores lacking both
  enzymes lack chitosan and the dityrosine layer and are sensitive to lytic enzymes, ether and heat.
