- term:
    id: GO:0006032
    label: chitin catabolic process
  evidence_type: IDA
  original_reference_id: PMID:11812231
  qualifier: involved_in
  review:
    summary: IDA 'chitin catabolic process' from the Cda2p purification paper. The data show deacetylation of chitin/chitooligosaccharides
      to chitosan, which removes acetyl groups but does not break the glycosidic backbone; GO defines chitin catabolic
      process as breakdown of chitin. The biology (Cda2p acts on chitin) is sound, but the more accurate process
      is chitin metabolism (chitin to chitosan conversion).
    action: MODIFY
    reason: Deacetylation converts chitin into another polymer (chitosan) rather than degrading it; chitin metabolic
      process describes the observed activity without implying breakdown. GO has no chitosan biosynthetic process
      term.
    proposed_replacement_terms:
    - id: GO:0006030
      label: chitin metabolic process
    supported_by:
    - *id003
    - *id001
