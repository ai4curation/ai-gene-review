product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Pep1, better known as Vps10, is the carboxypeptidase Y (CPY) receptor of Saccharomyces cerevisiae
  and the founding member of the Vps10p-domain (sortilin) receptor family. It is a 1,579-residue type
  I transmembrane glycoprotein with a signal peptide, a lumenal region made of two Vps10p domains (each
  a ten-bladed beta-propeller followed by cysteine-rich 10CC modules), a single transmembrane helix and
  a cytoplasmic tail of about 165 residues. In the late Golgi (trans-Golgi network) its lumenal domain
  binds the Golgi-modified precursor of CPY in a sorting-signal-dependent, 1:1 complex. It also binds
  proteinase A, aminopeptidase Y and several other soluble vacuolar proteins, mostly through the second
  Vps10p domain, and it routes some unfolded lumenal proteins to the vacuole for degradation. Receptor-ligand
  complexes leave the trans-Golgi network in clathrin- and Gga-dependent carriers bound for the prevacuolar
  (late) endosome, where the ligands are released and go on to the vacuole. The receptor itself is retrieved
  to the trans-Golgi network by retromer, which reads a bipartite FGEIRL/YSSL signal in the tail through
  Vps26 and Vps35. This cycling lets each receptor sort many ligand molecules. Without Vps10 most CPY
  and part of proteinase A are secreted; without retromer the receptor is delivered to the vacuole membrane.
  Overexpressed paralogs Vth1 and Vth2 can partly replace it.
