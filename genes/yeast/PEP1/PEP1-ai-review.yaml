  evidence_type: HDA
  original_reference_id: PMID:26928762
  qualifier: located_in
  review:
    summary: High-content localisation screen of a SWAp-Tag (SWAT) library in which endomembrane proteins
      carry an N-terminal GFP under the constitutive SpNOP1 promoter; for signal-peptide proteins such as
      Vps10 the GFP is inserted just after the predicted cleavage site (PMID:26928762). The Vps10 call is
      in the supplementary tables, which are not cached.
    action: MARK_AS_OVER_ANNOTATED
    reason: The screen expresses the fusion from a strong generic promoter, and overexpressed Vps10 is
      known to be delivered to the vacuole and degraded (PMID:8534908). At native levels Vps10-GFP is on
      punctate Golgi/endosome structures in wild-type cells and accumulates on the vacuole membrane only
      when retromer fails (PMID:31337624, PMID:9105038). The vacuole is the default destination of the
      receptor when retrieval fails, not its residence. A small pool does reach the vacuole in wild-type
      cells and is detected in purified vacuoles (PMID:35175277) and retrieved from there by retromer
      and Vps1 (PMID:25512334), so the row is not removed; the location is real but minor and probably
      exaggerated by the assay.
    supported_by:
