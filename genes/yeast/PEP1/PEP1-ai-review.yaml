  supporting_entities:
  - GO:0006895
  review:
    summary: Curator inference placing Vps10 in the membrane of the prevacuolar compartment (the yeast
      late endosome), where it releases its ligands and from which retromer retrieves it.
    action: NEW
    reason: Vps10 cycles between the late Golgi and the prevacuolar/endosomal compartment (PMID:8636229,
      PMID:8534908). It accumulates in the exaggerated prevacuolar compartment of class E vps mutants (PMID:8534908).
      It is retrieved from the prevacuolar endosome by retromer, and Vps35 recognises its tail there (PMID:9105038,
      PMID:11038177). As an integral membrane protein it sits in that compartment's membrane. UniProt curates
      the prevacuolar compartment membrane location, but its SubCell term has no GO mapping, which is why
      GOA lacks the row. This is a transit location in the receptor's cycle, where ligand release and receptor
      retrieval take place. It is not the steady-state residence, which is the TGN.
    supported_by:
    - reference_id: PMID:8636229
      supporting_text: A tyrosine-based signal (YSSL80) within the cytosolic domain enables Vps10p to cycle
        between the late-Golgi and prevacuolar/endosomal compartments.
    - reference_id: PMID:8534908
      supporting_text: These data are consistent with a model in which the cytoplasmic tail of Vps10p directs
        cycling of the receptor between a late Golgi sorting compartment and a prevacuolar endosome-like compartment,
        an exaggerated form of which is present in the vps class E mutants.
    - reference_id: PMID:9105038
      supporting_text: the VPS29, VPS30, and VPS35 gene products are required for the normal recycling of
        Vps10p from the prevacuolar endosome back to the Golgi where it can initiate additional rounds of
        vacuolar hydrolase sorting.
    - reference_id: file:yeast/PEP1/PEP1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Prevacuolar compartment membrane; Single-pass type I membrane protein.
