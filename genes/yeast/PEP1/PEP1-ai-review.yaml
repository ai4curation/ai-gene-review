- id: file:yeast/PEP1/PEP1-deep-research-sgd.md
  title: SGD gene description for PEP1 (yeast)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Claims checked: "Type I transmembrane sorting receptor for multiple vacuolar hydrolases"
      is verified (PMID:8187177, PMID:8636229, PMID:10095782, PMID:35175277). The role in post-ER quality
      control and targeting of misfolded proteins to the vacuole is supported by PMID:8909538. Cycling
      between the late Golgi and prevacuolar compartments is verified (PMID:8636229, PMID:8534908). "targeted
      to vacuole via AP-3 pathway" could not be traced to any paper and is contradicted by PMID:9105038
      and PMID:35175277 (see source defect).'
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: SGD
      record: SGD:S000000113
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: targeted to vacuole via AP-3 pathway
      confidence: PROBABLE
      explanation: The SGD description ends "targeted to vacuole via AP-3 pathway". No paper found in PubMed
        searches (Vps10 with AP-3, Apl5, Apl6, Apm3, Aps3 or the ALP pathway) supports this. When retrieval
        fails (vps35 mutants), Vps10 reaches the vacuole through the prevacuolar endosome, a route that needs
        the endosomal t-SNARE Pep12 and that the AP-3 pathway bypasses (PMID:9105038). Vacuolar proteomics
        places Vps10 with the few Gga-dependent, endosomal-pathway vacuolar proteins, in contrast to the
        AP-3 cargoes (PMID:35175277). Unless SGD has a source for an AP-3 route under a specific condition,
        the phrase should be dropped or changed to say that Vps10 reaches the vacuole through the endosome
        when retromer-mediated retrieval fails. This rests on the full texts of PMID:9105038 and PMID:35175277;
        the source SGD used for the phrase was not identified.
      supported_by:
      - reference_id: PMID:9105038
        supporting_text: The route that Vps10p takes to reach the vacuole in a vps35 mutant does not depend
          upon Sec1p mediated arrival at the plasma membrane but does require the activity of the pre-vacuolar
          endosomal t-SNARE, Pep12p.
      - reference_id: PMID:35175277
        supporting_text: and Vps10 along with its cargo proteins. In contrast, our data suggest that the bulk
          of vacuolar membrane proteins is transported via the AP-3 pathway.
- id: file:yeast/PEP1/PEP1-notes.md
  title: PEP1 curation notes
  findings: []
core_functions:
- description: Lumenal-domain receptor that, in the trans-Golgi network, binds the Golgi-modified precursors
    of soluble vacuolar hydrolases (CPY through its QRPL sorting signal, proteinase A, aminopeptidase Y
    and many other soluble vacuolar lumenal proteins, mainly through Vps10p domain 2) and some unfolded
    lumenal proteins. It carries them in clathrin/Gga-dependent carriers to the prevacuolar endosome, from
    where the ligands go on to the vacuole and the receptor is retrieved by retromer for further rounds.
  molecular_function:
    id: GO:0010209
    label: vacuolar sorting signal receptor activity
  directly_involved_in:
  - id: GO:0006623
    label: protein targeting to vacuole
  - id: GO:0006896
    label: Golgi to vacuole transport
  - id: GO:0006895
    label: Golgi to endosome transport
  locations:
  - id: GO:0032588
    label: trans-Golgi network membrane
  supported_by:
  - reference_id: PMID:8187177
    supporting_text: Chemical cross-linking studies demonstrate that Vps10p and the Golgi-modified precursor
      form of CPY directly interact.
  - reference_id: PMID:8636229
    supporting_text: In vitro equilibrium binding studies established that the 1,380-amino acid lumenal
      domain of Vps10p binds CPY precursor in a 1:1 stoichiometry, further supporting the assignment of Vps10p
      as the CPY sorting receptor.
  - reference_id: PMID:10095782
    supporting_text: Domain 2 binds carboxypeptidase Y (CPY), proteinase A (PrA) and hybrids of these proteases
      with invertase.
  - reference_id: PMID:35175277
    supporting_text: Our data suggest that most luminal vacuolar proteins are either transported by the
      Vps10 sorting receptor or the CVT pathway.
  - reference_id: PMID:11179429
    supporting_text: Our results suggest that CCVs mediate Vps10p transport from the TGN to the endosome
      independent of direct interactions between Vps10p and clathrin coats.
  - reference_id: PMID:31337624
    supporting_text: Unlike CPY, which is released from the Vps10 receptor in the endosome, Vps10 is not
      delivered to the vacuole but is recycled from the endosome back to the Golgi by the retromer complex,
      making Vps10 available for additional rounds of CPY sorting
suggested_questions:
- question: What is the structure of the Vps10 lumenal region, and how does domain 2 accommodate both
    the QRPL-type signal of pro-CPY and the apparently sequence-independent binding of unfolded invertase
    hybrids?
- question: Where is the vacuolar sorting signal of each newly identified cargo (Pep4, Ape3, Yhr202w, Ydr415c,
    Atg42, Npc2), and why does Ydr415c depend on domain 1 when the others depend on domain 2?
- question: What triggers ligand release in the prevacuolar endosome (pH, proteolytic processing, competition),
    given that the receptor and ligand bind in a 1:1 complex?
- question: Does the Vti1 two-hybrid interaction of the Vps10 tail reflect a transient contact during
    SNARE-dependent fusion of Vps10-containing carriers, or is it nonspecific?
- question: Is there a published basis for the SGD statement that Vps10 is targeted to the vacuole via
    the AP-3 pathway?
suggested_experiments:
- description: Determine a cryo-EM or crystal structure of the Vps10 lumenal domain bound to pro-CPY or
    a QRPL peptide, and test the contacts by mutagenesis with CPY secretion and vacuolar proteomics readouts.
- description: Measure Vps10-ligand binding as a function of pH and of propeptide processing in vitro,
    to define the release mechanism in the prevacuolar endosome.
- description: Image native-level Vps10-mNeonGreen together with Gga2, retromer and Pep12 markers by live
    super-resolution microscopy, to measure dwell times at the TGN, the prevacuolar endosome and the vacuole
    in wild-type cells.
