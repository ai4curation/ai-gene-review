- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IMP
  original_reference_id: PMID:31332264
  qualifier: involved_in
  review:
    summary: In vps10 cells, vacuolar processing of the mitophagy reporter Tom70-GFP is significantly
      reduced, alongside reduced maturation and partial secretion of proteinase A (Pep4) (PMID:31332264,
      full text read).
    action: MARK_AS_OVER_ANNOTATED
    reason: The phenotype is real, but Vps10 does none of the work of mitophagy. The authors attribute
      the defect to inefficient delivery of the Pep4 zymogen, the protease that degrades the cargo once
      it reaches the vacuole, and bulk autophagy and ribophagy are unaffected in the same strain. The
      entity doing the degradative step is Pep4; Vps10 is upstream, as the sorting receptor that delivers
      it. The row records necessity through an indirect route, so it is marked over-annotated rather than
      removed.
    supported_by:
    - reference_id: PMID:31332264
      supporting_text: In contrast, the degradation of an excess of peroxisomes via pexophagy as well as
        mitochondria via mitophagy was significantly hampered in a VPS10-deletion strain and correlated with
        a decreased maturation level of Pep4.
    - reference_id: PMID:31332264
      supporting_text: The results show that Vps10-mediated targeting of Pep4 limits the proteolytic capacity
        of the vacuole in a substrate-dependent manner.
    - reference_id: PMID:31332264
      supporting_text: The VPS10-deletion has no effect on the degradation of the cytosolic protein Pgk1
        via bulk autophagy or on the degradation of ribosomes via ribophagy.
