        to the predicted signal peptide cleavage point
    - reference_id: PMID:8534908
      supporting_text: Immunofluorescence studies indicate that overexpressed receptor is delivered to the
        vacuole.
    - reference_id: PMID:31337624
      supporting_text: When Vps10-GFP was expressed from its native promoter in WT cells, it localized on
