descriptions:
- source: UniProt
  text: Succinyl-CoA synthetase functions in the citric acid cycle (TCA), coupling
    the hydrolysis of succinyl-CoA to the synthesis of ATP and thus represents the
    only step of substrate-level phosphorylation in the TCA (PubMed:9874242). The
    beta subunit provides nucleotide specificity of the enzyme and binds the substrate
    succinate, while the binding sites for coenzyme A and phosphate are found in the
    alpha subunit (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53312
