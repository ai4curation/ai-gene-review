descriptions:
- source: UniProt
  text: Succinyl-CoA synthetase functions in the citric acid cycle (TCA), coupling
    the hydrolysis of succinyl-CoA to the synthesis of ATP and thus represents the
    only step of substrate-level phosphorylation in the TCA (PubMed:9874242). The
    beta subunit provides nucleotide specificity of the enzyme and binds the substrate
    succinate, while the binding sites for coenzyme A and phosphate are found in the
    alpha subunit (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53312
  source_id: P53312
- source: Alliance_Imported
  text: Beta subunit of succinyl-CoA ligase; succinyl-CoA ligase is a mitochondrial
    enzyme of the TCA cycle that catalyzes the nucleotide-dependent conversion of
    succinyl-CoA to succinate
  source_type: curated
  url: https://www.yeastgenome.org/locus/LSC2
  source_id: SGD:S000003476
- source: Alliance_Automated
  text: Contributes to succinate-CoA ligase (ADP-forming) activity. Involved in succinyl-CoA
    metabolic process. Located in mitochondrion. Human ortholog(s) of this gene implicated
    in mitochondrial DNA depletion syndrome 5. Orthologous to human SUCLA2 (succinate-CoA
    ligase ADP-forming subunit beta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LSC2
  source_id: SGD:S000003476
