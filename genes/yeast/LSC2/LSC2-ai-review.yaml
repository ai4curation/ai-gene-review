core_functions:
- description: Beta (succinate- and ATP-binding, nucleotide-specificity) subunit of the ATP-specific mitochondrial
    succinyl-CoA synthetase; contributes to conversion of succinyl-CoA to succinate with ATP formation in the TCA
    cycle. Lsc2 retains Pro at the position where the characterised GTP-specific beta subunits have Gln, the residue
    state shared with bacterial enzymes that use ATP; exclusion of GTP has been shown by assay only for the yeast
    and animal A-type enzymes.
  contributes_to_molecular_function:
    id: GO:0004775
    label: succinate-CoA ligase (ADP-forming) activity
  directly_involved_in:
