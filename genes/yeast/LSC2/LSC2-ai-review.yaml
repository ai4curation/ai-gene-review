- id:
    file:yeast/LSC2/LSC2-hypotheses/beta-nucleotide-specificity-phylogeny/openscientist.md
  title: OpenScientist focused report on whether Lsc2 is an ADP-specific beta subunit by descent
  findings:
  - statement: An independent run concluded that Lsc2 is ADP-forming, carries Pro at the guanine-specificity position
      and lies outside the animal GDP-forming SUCLG2 clade.
    supporting_text: yeast Lsc2 falls **outside** the animal SUCLG2/GDP clade in 99% of replicates
  - statement: The run found Gln at the specificity position only in animal SUCLG2 and Pro in every fungal, plant and
      SUCLA2 sequence it sampled.
    supporting_text: Gln-20β is present **only** in the animal GDP-forming SUCLG2 clade
  - statement: The run could not resolve whether Lsc2 is specifically sister to animal SUCLA2 and, following PMID:9765291,
      treated the A-type/G-type duplication as an animal-lineage event that fungi predate.
    supporting_text: Distance methods only weakly support this (yeast+SUCLA2 grouping ~54%; yeast sits on a long branch)
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
      review_notes: The run used a k-mer distance tree of 18 sequences with no Dictyostelium or choanoflagellate
        paralogs, and named a maximum-likelihood tree with broader sampling as the way to settle the point. That
        analysis was then done locally. It recovers a clade of the fungal subunits and animal SUCLA2 with no
        SUCLG2-type member (ultrafast bootstrap 90), and Dictyostelium and Monosiga each have one gene on each
        side, so the duplication is older than fungi and Lsc2 is a SUCLA2 ortholog. The two analyses agree on
        every fact that bears on the annotations; only the dating of the duplication differs.
      supported_by:
      - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
        supporting_text: The fungal subunits and animal SUCLA2 form one clade in the PANTHER tree, the neighbor-joining
          tree and the maximum-likelihood tree.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read in full. The prompt named the gene and the hypothesis, so this is an independent reading of
      the same public evidence, not independent evidence; the local bioinformatics results were withheld from it.
      Its quotes from PMID:9874242, PMID:16481318, PMID:22751660 and PMID:9765291 were checked against the cached
      abstracts. Its remark that GO:0004775 is IEA-only refers to the UniProt cross-reference; GOA already has
      IDA and IMP rows from PMID:9874242. PMID:8144675, which it cites for the E. coli structure, is not cached
      here and was not used.
