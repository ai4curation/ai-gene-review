- id: PMID:9874242
  title: Genes of succinyl-CoA ligase from Saccharomyces cerevisiae.
  findings:
  - statement: Mitochondrial succinyl-CoA ligase activity needs both LSC1 and LSC2.
    supporting_text: Succinyl-CoA ligase activity was absent in mitochondria isolated from strains deleted for one
      or both LSC genes, but activity was restored by the presence of the appropriate LSC gene on a plasmid
  - statement: The yeast enzyme is ATP-specific.
    supporting_text: The yeast succinyl-CoA ligase was shown to utilize ATP but not GTP for succinyl-CoA synthesis
  - statement: Both LSC genes are glucose-repressed and induced on nonfermentable carbon sources.
    supporting_text: The expression of these genes was repressed by growth on glucose and was induced threefold
      to sixfold during growth on nonfermentable carbon sources
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
