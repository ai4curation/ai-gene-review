- id: PMID:22751660
  title: Biochemical and structural characterization of the GTP-preferring succinyl-CoA synthetase from Thermus aquaticus.
  findings:
  - statement: Pro20 of the beta subunit does not exclude GTP use; T. aquaticus SCS has Pro20 and prefers GTP, and
      E. coli SCS uses both nucleotides but prefers ATP.
    supporting_text: This contrasts with Escherichia coli SCS, which uses GDP/GTP but prefers ADP/ATP
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract read. Shows that the position-20 residue is a marker, not a complete determinant, which
      limits what can be inferred for Lsc2 from sequence alone.
