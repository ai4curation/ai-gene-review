    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IC
  original_reference_id: PMID:28819139
  qualifier: located_in
  review:
    action: NEW
    summary: Proposed sub-compartment. Lsc2 is a soluble protein of the mitochondrial matrix, and the existing rows
      stop at the organelle.
    reason: Lsc2 has no sub-compartment row, and four lines agree. (1) Voegtle et al. 2017 fractionated yeast mitochondria
      by sonication and by carbonate extraction and assigned soluble proteins to the matrix by reference to outer-membrane
      and intermembrane-space proteomes. Lsc2 (YGR244C) is listed as soluble and as a matrix protein in their
