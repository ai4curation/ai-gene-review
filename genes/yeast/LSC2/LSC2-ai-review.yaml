suggested_questions:
- question: Is Pro at position 20 of the mature beta subunit enough to explain why yeast succinyl-CoA synthetase
    does not use GTP? E. coli and Thermus aquaticus enzymes also have Pro there and accept GTP, so other residues
    of the Lsc2 nucleotide site must contribute.
- question: Why did fungi dispense with the G-type beta subunit that animals, choanoflagellates and Dictyostelium
    retain, and is import of GTP by Ggc1p the compensating adaptation or a separate, older trait?
- question: What does the divergent second beta-like protein of Ustilago maydis (A0A0D1E3R8) do? PANTHER places
    it on the SUCLG2 side of the duplication, but its position is unstable between tree methods, and every other
    fungal genome in the PANTHER tree has only the A-type beta subunit.
- question: From which copy of the eukaryotic beta-subunit duplication do the plant, stramenopile and excavate
    subunits descend? PANTHER puts them on the SUCLG2 side and a maximum-likelihood tree puts plants on the SUCLA2
    side, both without strong support.
- question: Do the phosphoserines of Lsc2 (Ser102, Ser263, Ser276) regulate succinyl-CoA synthetase during the shift
    between fermentative and respiratory growth?
suggested_experiments:
- hypothesis: Nucleotide specificity of yeast succinyl-CoA synthetase is set by a small number of residues in the
    Lsc2 ATP-grasp site, with position 20 of the mature subunit a main contributor.
  description: Purify recombinant Lsc1/Lsc2 and measure kcat/Km with ADP and GDP for wild type and for a Pro-to-Gln
    substitution at the position aligned to Pro20 of E. coli SucC; compare with the E. coli P20Q enzyme.
- hypothesis: The yeast alpha subunit can partner a G-type beta subunit, so loss of GDP-forming activity in fungi
    is explained by loss of the beta paralog alone.
  description: Express a mitochondrially targeted animal SUCLG2 in an lsc2 deletion strain and assay GDP-dependent
    succinyl-CoA synthetase activity in isolated mitochondria and growth on glycerol.
