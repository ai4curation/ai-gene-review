  title: Genetic evidence for the expression of ATP- and GTP-specific succinyl-CoA synthetases in multicellular eucaryotes.
  findings:
  - statement: The A-beta and G-beta genes are proposed to have arisen by duplication early in the evolution of
      multicellular eukaryotes.
    supporting_text: suggests that the A-beta and G-beta genes arose by duplication early in the
