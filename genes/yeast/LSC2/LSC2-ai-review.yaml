      review_notes: The dating rested on C. elegans and vertebrate sequences. Genome-scale trees place the duplication
        before the divergence of animals, fungi and amoebozoa, with loss of the G-type copy in fungi.
      supported_by:
      - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
        supporting_text: Because Dictyostelium and the choanoflagellate Monosiga each have one gene in each clade,
          the duplication predates the divergence of animals, fungi and amoebozoa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read. Defines the A-beta and G-beta lineages to which Lsc2 is compared.
