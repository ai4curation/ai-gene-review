id: P53312
gene_symbol: LSC2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Beta subunit (Lsc2p, YGR244C) of mitochondrial succinyl-CoA ligase (succinyl-CoA synthetase, EC 6.2.1.5),
  an alpha/beta heterodimer with Lsc1. The enzyme catalyses the substrate-level phosphorylation step of the TCA
  cycle, converting succinyl-CoA, ADP and phosphate to succinate, ATP and CoA. The beta subunit carries the ATP-grasp
  nucleotide site, binds succinate and Mg2+, and determines nucleotide specificity; S. cerevisiae has a single beta
  subunit and its enzyme uses ATP but not GTP. LSC2 is glucose-repressed and induced on non-fermentable carbon sources;
  its deletion abolishes mitochondrial succinyl-CoA ligase activity and impairs growth on glycerol or pyruvate.
  Lsc2 is a soluble protein of the mitochondrial matrix. It belongs to the A-type beta-subunit lineage, whose assayed
  members are ATP-specific, and is the ortholog of animal SUCLA2. Gene trees place the duplication of the eukaryotic
  beta subunit before the divergence of animals, fungi and amoebozoa; animals kept both copies (SUCLA2 and the
  GDP-specific SUCLG2), whereas S. cerevisiae, like nearly all Dikarya examined, has only the A-type copy. Some
  early-diverging fungi keep both.
