- id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
  title: Evolution of the succinyl-CoA synthetase subunit families (LSC1 / LSC2)
  findings:
  - statement: Lsc2 is best read as the ortholog of animal SUCLA2 and a paralog of SUCLG2.
    supporting_text: Yeast LSC2 and S. pombe SPCC1620.08 both fall in the SUCLA2 (A-type) daughter clade, not in the
      SUCLG2 (G-type) clade.
  - statement: Lsc2 has Pro at position 20 of the mature subunit, the commonest residue in the family.
    supporting_text: Yeast LSC2 has Pro at position 20, as do human SUCLA2, E. coli SucC and most members of the family.
  - statement: Gln at position 20 is found in the characterised GTP-specific enzymes but is not confined to them
      or to the clade under PTN000929335, and it does not by itself decide nucleotide specificity.
    supporting_text: Gln at position 20 is not sufficient for GTP specificity, and is not required for GTP use or
      preference.
  - statement: The G-type beta gene was lost within fungi. S. cerevisiae and the other fungal genomes in the PANTHER
      tree have only the A-type gene, and Mortierellomycota, Basidiobolus and Rozella keep a SUCLG2-type gene.
      The ascomycete Saitoella complicata also has a Gln20 SUCLG2-type entry, whose origin (vertical retention,
      transfer or contamination) is unresolved.
    supporting_text: Early-diverging fungi (Mortierellomycota, Basidiobolus, Rozella) keep a SUCLG2-type beta gene
      with Gln at position 20, so the G-type beta gene was lost within fungi and not in the common ancestor of all
      fungi.
  - statement: The analysis does not show which nucleotide specificity is ancestral.
    supporting_text: This analysis does not show which nucleotide specificity is ancestral.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Local analysis, rerun and rewritten on 2026-11-12 with a 64-sequence panel, a scan of all PANTHER
      leaves and a UniProt-wide census of fungal beta subunits. Its trees are single-gene trees; deep placements
      are unresolved, as its Limitations section states.
