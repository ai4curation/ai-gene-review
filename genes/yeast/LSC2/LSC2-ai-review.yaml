      interacting well with the guanine base
suggested_questions:
- question: Is Pro at position 20 of the mature beta subunit enough to explain why yeast succinyl-CoA synthetase
    does not use GTP? E. coli and Thermus aquaticus enzymes also have Pro there and accept GTP, and the Blastocystis
    enzyme has Gln there and is ATP-specific, so other residues of the Lsc2 nucleotide site must contribute.
- question: Why was the G-type beta subunit lost in most Dikarya and several other fungal lineages, while Mortierellomycota,
    Basidiobolus, Rozella and the ascomycete Saitoella retain a SUCLG2-type gene, as animals, choanoflagellates and Dictyostelium do? Is the SUCLG2-type
    enzyme of those fungi GDP-forming, and is import of GTP by Ggc1p the compensating adaptation or a separate,
    older trait?
- question: What does the divergent second beta-like protein of Ustilago maydis (A0A0D1E3R8, UMAG_01904) do? It
    lacks the ATP-grasp domain. PANTHER places it in the SUCLG2 clade, but both sequence trees place it with prokaryotic
    sequences, outside both human paralogs. The neighbouring gene UMAG_01903 (A0A0D1CWH6) is a divergent alpha-like
    protein, so the two may form a separate enzyme.
- question: From which copy of the eukaryotic beta-subunit duplication do the plant, stramenopile and excavate
    subunits descend? PANTHER puts them on the SUCLG2 side and both sequence trees put the plant, stramenopile
    and trypanosomatid subunits on the SUCLA2 side, without strong support for plants and trypanosomatids; the
    Trichomonas subunits are unresolved.
- question: Do the phosphoserines of Lsc2 (Ser102, Ser263, Ser276) regulate succinyl-CoA synthetase during the shift
    between fermentative and respiratory growth?
suggested_experiments:
- hypothesis: Nucleotide specificity of yeast succinyl-CoA synthetase is set by a small number of residues in the
    Lsc2 ATP-grasp site, with position 20 of the mature subunit a main contributor.
  description: Purify recombinant Lsc1/Lsc2 and measure kcat/Km with ADP and GDP for wild type and for a Pro-to-Gln
    substitution at the position aligned to Pro20 of E. coli SucC; compare with the E. coli P20Q enzyme.
- hypothesis: The yeast alpha subunit can partner a G-type beta subunit, so the absence of GDP-forming activity
    in S. cerevisiae is explained by absence of the G-type beta paralog alone.
  description: Express a mitochondrially targeted animal SUCLG2 in an lsc2 deletion strain and assay GDP-dependent
    succinyl-CoA synthetase activity in isolated mitochondria and growth on glycerol.
