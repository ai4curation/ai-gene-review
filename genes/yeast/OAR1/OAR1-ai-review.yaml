id: P35731
gene_symbol: OAR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: OAR1 (YKL055C) encodes the mitochondrial NADPH-dependent 3-oxoacyl-[acyl-carrier-protein]
  reductase (FabG-like short-chain dehydrogenase/reductase, EC 1.1.1.100) of S. cerevisiae. It reduces
  3-oxoacyl-ACP to (3R)-3-hydroxyacyl-ACP, the first reductive step of each cycle of the type II mitochondrial
  fatty acid synthase (with Hfa1, Mct1, Cem1, Htd2, Etr1 and Acp1). mtFAS produces octanoyl-ACP for lipoic
  acid synthesis and other acyl chains required for respiratory function. oar1 null mutants are respiratory
  deficient with reduced lipoic acid, a defect rescued only by co-expression of both subunits of the human
  heterotetrameric mitochondrial ketoacyl reductase (HSD17B8 and CBR4).
