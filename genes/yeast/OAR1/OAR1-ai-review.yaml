  review:
    summary: IBA (quinone binding) from node PTN002449501, sourced from human CBR4 (Q8N4T8), which has
      an in vitro quinone reductase activity. In vivo CBR4 functions with HSD17B8 as the mitochondrial
      KAR, and no quinone binding has been shown for Oar1, an NADPH-dependent 3-oxoacyl-ACP reductase.
      The inherited term reflects a substrate promiscuity of one source rather than the conserved function
      of the clade.
    action: MARK_AS_OVER_ANNOTATED
    reason: No evidence for quinone binding by Oar1; propagated from a promiscuous activity of CBR4.
