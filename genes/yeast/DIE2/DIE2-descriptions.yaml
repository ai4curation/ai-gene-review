descriptions:
- source: UniProt
  text: Dol-P-Glc:Glc(2)Man(9)GlcNAc(2)-PP-Dol alpha-1,2- glucosyltransferase that
    operates in the biosynthetic pathway of dolichol-linked oligosaccharides, the
    glycan precursors employed in protein asparagine (N)-glycosylation. The assembly
    of dolichol-linked oligosaccharides begins on the cytosolic side of the endoplasmic
    reticulum membrane and finishes in its lumen. The sequential addition of sugars
    to dolichol pyrophosphate produces dolichol-linked oligosaccharides containing
    fourteen sugars, including two GlcNAcs, nine mannoses and three glucoses. Once
    assembled, the oligosaccharide is transferred from the lipid to nascent proteins
    by oligosaccharyltransferases. In the lumen of the endoplasmic reticulum, adds
    the third and last glucose residue from dolichyl phosphate glucose (Dol-P-Glc)
    onto the lipid-linked oligosaccharide intermediate Glc(2)Man(9)GlcNAc(2)-PP-Dol
    to produce Glc(3)Man(9)GlcNAc(2)-PP-Dol.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50076
  source_id: P50076
- source: Alliance_Imported
  text: Dolichyl-phosphoglucose-dependent alpha-1,2-glucosyltransferase; located in
    the ER; functions in pathway that synthesizes the dolichol-linked oligosaccharide
    precursor for N-linked protein glycosylation; has a role in regulation of ITR1
    and INO1; human homolog ALG10B can complement yeast die2 null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/DIE2
  source_id: SGD:S000003459
- source: Alliance_Automated
  text: Enables dolichyl pyrophosphate Glc2Man9GlcNAc2 alpha-1,2-glucosyltransferase
    activity. Involved in dolichol-linked oligosaccharide biosynthetic process. Located
    in endoplasmic reticulum membrane. Human ortholog(s) of this gene implicated in
    long QT syndrome 2. Orthologous to several human genes including ALG10 (ALG10
    alpha-1,2-glucosyltransferase).
