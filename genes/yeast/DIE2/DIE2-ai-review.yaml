id: P50076
gene_symbol: DIE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Die2 (also called Alg10) is a multi-pass ER membrane glucosyltransferase of the ALG10 family
  (GT-C superfamily). It catalyses the final step of lipid-linked oligosaccharide assembly: it transfers
  glucose from dolichyl-phosphate-glucose in α1,2 linkage onto Glc2Man9GlcNAc2-PP-dolichol to give the
  complete Glc3Man9GlcNAc2-PP-dolichol donor (EC 2.4.1.256). The reaction takes place on the lumenal side
  of the ER membrane. The terminal α1,2-glucose is a key recognition element for the oligosaccharyltransferase,
  so only fully assembled LLO is used efficiently. DIE2 is not essential. alg10 mutants accumulate Glc2Man9GlcNAc2-PP-dolichol
  and hypoglycosylate secreted proteins, and they show synthetic growth defects with reduced OST activity
  (wbp1).'
