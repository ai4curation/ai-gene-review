suggested_questions:
- question: Die2/Alg10 belongs to a GT-C family distinct from Alg6/Alg8. Does it use the same conserved-module
    catalytic aspartate as Alg6?
suggested_experiments:
- description: Determine a Die2/Alg10 structure with a Dol-P-Glc analogue and test candidate lumenal acidic
    residues by mutagenesis in the in vitro glucosylation assay.
