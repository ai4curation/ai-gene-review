core_functions:
- description: Dol-P-Glc-dependent α1,2-glucosylation of Glc2Man9GlcNAc2-PP-dolichol. This adds the terminal
    glucose and completes the Glc3Man9GlcNAc2-PP-dolichol donor that OST prefers. It is the last ER-lumenal
    LLO step.
  molecular_function:
    id: GO:0106073
