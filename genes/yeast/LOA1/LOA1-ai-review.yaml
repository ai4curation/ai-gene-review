- term:
    id: GO:0006623
    label: protein targeting to vacuole
  evidence_type: HMP
  original_reference_id: PMID:12134085
  qualifier: involved_in
  review:
    summary: Bonangelino et al. 2002 genome-wide screen of deletion strains for carboxypeptidase Y secretion
      gave the gene its VPS66 name. Later work showed it encodes a lipid-droplet LPA acyltransferase;
      no mechanism links Loa1 directly to vacuolar protein targeting, and a CPY-missorting phenotype in
      a lipid-metabolism mutant is most plausibly an indirect membrane-lipid effect. Not contradicted,
      but very unlikely to reflect a direct role in protein targeting.
    action: MARK_AS_OVER_ANNOTATED
    reason: Single high-throughput screen phenotype for an LPA acyltransferase; the product is not known
      to perform any step of protein targeting to the vacuole.
    supported_by:
    - reference_id: PMID:12134085
      supporting_text: To identify genes involved in sorting to the vacuole, we conducted a genome-wide
        screen of 4653 homozygous diploid gene deletion strains of Saccharomyces cerevisiae for missorting
        of carboxypeptidase Y.
