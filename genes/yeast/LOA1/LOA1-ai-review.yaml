  label: Saccharomyces cerevisiae S288C
description: LOA1 (YPR139C; also VPS66) encodes a lysophosphatidic acid:oleoyl-CoA acyltransferase of
  the glycerolipid acyltransferase (AGPAT/PlsC-like) family. Loa1 acylates 1-acyl-sn-glycerol-3-phosphate
  (LPA) to phosphatidic acid with a preference for oleoyl-CoA. The protein localises to the endoplasmic
  reticulum and to lipid droplets, is active on purified lipid droplets, and is one of the few lipid-droplet-specific
  proteins identified by proteomics. Cells lacking LOA1 have reduced triacylglycerol content, altered
  glycerolipid acyl-chain composition and more numerous lipid droplets, while overexpression yields fewer
  droplets, indicating that Loa1 channels PA toward triacylglycerol synthesis and influences lipid droplet
  biogenesis. Slc1 and Ale1 provide the bulk of ER LPA acyltransferase activity for phospholipid synthesis.
