suggested_questions:
- question: Is Loa1 activity on lipid droplets physically coupled to Dga1/Pah1 to channel PA into TAG
    locally on the droplet surface?
- question: Is the VPS66 carboxypeptidase Y missorting phenotype reproducible, and if so is it an indirect
    consequence of altered membrane lipid composition?
suggested_experiments:
- description: Express LOA1 variants targeted exclusively to the ER or to lipid droplets in loa1 cells
    and measure TAG synthesis and LD number to determine which pool of Loa1 supports TAG homeostasis.
  experiment_type: cell biology
