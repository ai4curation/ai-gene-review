id: P41940
gene_symbol: PSA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PSA1 (VIG9/MPG1/SRB1) encodes the essential, highly abundant cytoplasmic GDP-mannose pyrophosphorylase
  (mannose-1-phosphate guanylyltransferase, EC 2.7.7.13) of S. cerevisiae. It condenses alpha-D-mannose
  1-phosphate with GTP to form GDP-alpha-D-mannose and pyrophosphate, the final step of GDP-mannose synthesis
  after phosphomannose isomerase (Pmi40p) and phosphomannomutase (Sec53p). GDP-mannose is the mannosyl
  donor for the cytoplasmic-face Alg1/Alg2/Alg11 steps of N-glycan precursor assembly, for Dpm1p-made
  Dol-P-Man, for Golgi mannosyltransferases (via the Vrg4p transporter), and for GPI and O-mannosyl glycans,
  so Psa1p activity underpins essentially all protein mannosylation and cell-wall mannoprotein synthesis.
  Hypomorphic psa1/vig9 alleles cause immature glycosylation, drug hypersensitivity and osmotically remediable
  cell-wall defects; PSA1 was also isolated as SRB1, a suppressor linked to osmotic fragility and cell-cycle
  progression.
