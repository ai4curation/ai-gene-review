core_functions:
- description: GTP-dependent conversion of alpha-D-mannose 1-phosphate to GDP-alpha-D-mannose in the cytosol,
    the terminal step of GDP-mannose synthesis that supplies mannosyl donor for N-, O- and GPI glycosylation
    and cell-wall mannan.
  molecular_function:
    id: GO:0004475
    label: mannose-1-phosphate guanylyltransferase (GTP) activity
  directly_involved_in:
  - id: GO:0009298
    label: GDP-mannose biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id002
  - *id006
  - *id007
  - *id003
suggested_questions:
- question: Does yeast have a GMPPA-like regulatory partner, as in metazoa (GMPPA/GMPPB), that allosterically
    controls Psa1p by GDP-mannose feedback?
- question: Is there any evidence for a GDP-dependent (EC 2.7.7.22) activity of Psa1p, or should the YeastPathways
    reaction be corrected to EC 2.7.7.13?
suggested_experiments:
- description: Assay purified Psa1p with Man-1-P plus GDP and phosphate versus GTP, and measure feedback
    inhibition by GDP-mannose, to settle the YeastPathways reaction assignment and identify regulatory
    mechanisms.
