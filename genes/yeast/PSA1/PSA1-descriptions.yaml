    limb-girdle muscular dystrophy type 2T; congenital muscular dystrophy-dystroglycanopathy
    type A14; muscular dystrophy-dystroglycanopathy; and muscular dystrophy-dystroglycanopathy
    type B14. Orthologous to human GMPPB (GDP-mannose pyrophosphorylase B).
