gene_symbol: PSA1
organism: yeast
uniprot_id: P41940
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in cell wall synthesis where it is required for glycosylation. Involved
    in cell cycle progression through cell-size checkpoint.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41940
  source_id: P41940
- source: Alliance_Imported
  text: GDP-mannose pyrophosphorylase (mannose-1-phosphate guanyltransferase); synthesizes
    GDP-mannose from GTP and mannose-1-phosphate in cell wall biosynthesis; required
    for normal cell wall structure
  source_type: curated
  url: https://www.yeastgenome.org/locus/PSA1
  source_id: SGD:S000002213
- source: Alliance_Automated
  text: Enables mannose-1-phosphate guanylyltransferase (GTP) activity. Involved in
    GDP-mannose biosynthetic process and cell wall mannoprotein biosynthetic process.
    Located in cytoplasm. Human ortholog(s) of this gene implicated in autosomal recessive
    limb-girdle muscular dystrophy type 2T; congenital muscular dystrophy-dystroglycanopathy
    type A14; muscular dystrophy-dystroglycanopathy; and muscular dystrophy-dystroglycanopathy
    type B14. Orthologous to human GMPPB (GDP-mannose pyrophosphorylase B).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PSA1
  source_id: SGD:S000002213
