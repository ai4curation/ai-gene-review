suggested_questions:
- question: Does Bdh1p reduce diacetyl to (R)-acetoin at physiologically relevant rates in vivo, relative
    to Ara1p and other diacetyl reductases?
- question: What is the function of the reciprocally regulated paralog Bdh2p, which is inactive toward
    2,3-butanediol?
suggested_experiments:
- description: Measure diacetyl, acetoin and butanediol isomers in bdh1, ara1 and bdh1 ara1 strains during
    wine-type fermentation, combined with in vitro diacetyl reductase kinetics of purified Bdh1p.
