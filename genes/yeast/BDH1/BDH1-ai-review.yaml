gene_symbol: BDH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Bdh1p (YAL060W) is a cytosolic, homodimeric, medium-chain dehydrogenase/reductase that acts
  as the NAD(H)-specific (2R,3R)-2,3-butanediol dehydrogenase of S. cerevisiae (EC 1.1.1.4), with zinc
  binding inferred from conserved family features. It stereospecifically oxidizes (2R,3R)-2,3-butanediol
  to (3R)-acetoin and meso-butanediol to (3S)-acetoin, and in the reverse direction reduces acetoin to
  the corresponding butanediols, and reduces diacetyl through acetoin to butanediol. Acetoin oxidation
  to diacetyl was not detected in the original assay, illustrating directional asymmetry. During fermentation
  it is the principal enzyme converting acetoin to (2R,3R)-2,3-butanediol (bdh1 deletion causes acetoin
  accumulation), while meso-butanediol levels also depend on NADPH-dependent reductases such as Ara1p.
  Bdh1p also allows aerobic use of 2,3-butanediol as a carbon source. The adjacent paralog BDH2 is reciprocally
  regulated and its product is inactive toward 2,3-butanediol.
