    supporting_text: The YAL060W gene product can therefore be classified as an NAD-dependent (2R,3R)-2,3-butanediol
      dehydrogenase (BDH).
  - reference_id: PMID:10938079
    supporting_text: The enzyme was found to be a homodimer that, in the presence of NAD(+), but not of
      NADP, could catalyze the stereospecific oxidation of (2R,3R)-2, 3-butanediol
  - reference_id: PMID:10938079
    supporting_text: In the presence of NADH, it could catalyze the stereospecific reduction of racemic
      acetoin
  - reference_id: PMID:19966022
    supporting_text: Deletion of BDH1 resulted in an accumulation of acetoin and a diminution of 2,3-butanediol
      in two S. cerevisiae strains under two different growth conditions.
  - reference_id: PMID:19966022
    supporting_text: The concentrations of (2R,3R)-2,3-butanediol are mostly dependent on Bdh1p activity
  - reference_id: PMID:10938079
    supporting_text: S. cerevisiae could grow on 2,3-butanediol as the sole carbon and energy source.
  - reference_id: file:yeast/BDH1/BDH1-uniprot.txt
    record_section:
    - CC:SUBCELLULAR LOCATION
    supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000269|PubMed:14562095}.'
suggested_questions:
- question: Does Bdh1p reduce diacetyl to (R)-acetoin at physiologically relevant rates in vivo, relative
    to Ara1p and other diacetyl reductases?
- question: What is the function of the reciprocally regulated paralog Bdh2p, which is inactive toward
    2,3-butanediol?
suggested_experiments:
- description: Measure diacetyl, acetoin and butanediol isomers in bdh1, ara1 and bdh1 ara1 strains during
    wine-type fermentation, combined with in vitro diacetyl reductase kinetics of purified Bdh1p.
