- id: PMID:19329666
  title: Engineering of 2,3-butanediol dehydrogenase to reduce acetoin formation by glycerol-overproducing,
    low-alcohol Saccharomyces cerevisiae.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article inspected externally at PMC2681661; local cache remains abstract-only.
      Wine-strain deletion doubles diacetyl and removes detectable R,R-butanediol; native NADH-dependent
      Bdh1 is compared with the engineered 221EIA223-to-SRS NADPH-specific variant. These are distinct
      coenzyme specificities.
  findings:
  - statement: Native Bdh1 uses NADH; the NADPH enzyme is a deliberately engineered coenzyme-specificity
      mutant.
    supporting_text: the engineered gene BDH1(221,222,223), coding for an NADPH-dependent Bdh1 enzyme
      with the amino acid changes 221 EIA 223 to 221 SRS 223
