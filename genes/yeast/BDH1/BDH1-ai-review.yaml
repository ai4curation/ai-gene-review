  review:
    summary: RCA acetoin biosynthetic process from YeastPathways acetoin biosynthesis (diacetyl -> acetoin).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'In vivo the net role of Bdh1p is consumption of acetoin: bdh1 deletion causes acetoin to
      accumulate, not to fall. Any diacetyl -> acetoin reduction by Bdh1p is a side reaction shared with
      other reductases (Ara1p and others), and acetoin itself is formed mainly by decarboxylation reactions
      upstream. Labelling Bdh1p as an acetoin biosynthesis enzyme over-states this.'
    supported_by:
    - reference_id: PMID:19966022
      supporting_text: Deletion of BDH1 resulted in an accumulation of acetoin and a diminution of 2,3-butanediol
