      dehydrogenase (BDH).
  - reference_id: PMID:10938079
    supporting_text: The enzyme was found to be a homodimer that, in the presence of NAD(+), but not of
      NADP, could catalyze the stereospecific oxidation of (2R,3R)-2, 3-butanediol
  - reference_id: PMID:10938079
    supporting_text: In the presence of NADH, it could catalyze the stereospecific reduction of racemic
      acetoin
  - reference_id: PMID:19966022
