core_functions:
- description: Cytosolic NAD(H)-dependent, zinc-containing (R,R)-2,3-butanediol dehydrogenase that stereospecifically
    interconverts (R)-acetoin and (2R,3R)-2,3-butanediol (and (S)-acetoin/meso-butanediol); in fermentation
    it reduces acetoin to butanediol, and on butanediol as carbon source it catalyses the first oxidation
    step.
