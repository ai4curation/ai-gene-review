gene_symbol: SLC1
organism: yeast
uniprot_id: P33333
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acyltransferase that catalyzes the sn-2-specific, acyl-CoA- dependent acylation
    of lysophosphatidic acid (LPA) to phosphatidic acid (PA) in lipid particles (PubMed:9401016).
    Together with ALE1, plays a central role in PA biosynthesis. PA is the intermediate,
    from which all glycerophospholipids are synthesized (PubMed:17890783). Can also
    acylate lysophosphoinositol (LPI) and lysophosphoserine (LPS) (PubMed:17675291).
    The fatty acyl substrates include 18:1-acyl-CoA, 14:0-acyl-CoA, 12:0-acyl-CoA
    and 10:0-acyl-CoA (PubMed:20694142).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33333
  source_id: P33333
- source: Alliance_Imported
  text: 1-acyl-sn-glycerol-3-phosphate acyltransferase; catalyzes the acylation of
    lysophosphatidic acid to form phosphatidic acid, a key intermediate in lipid metabolism;
    enzymatic activity detected in lipid particles and microsomes
  source_type: curated
  url: https://www.yeastgenome.org/locus/SLC1
  source_id: SGD:S000002210
- source: Alliance_Automated
  text: Enables 1-acylglycerol-3-phosphate O-acyltransferase activity; 1-acylglycerophosphocholine
    O-acyltransferase activity; and 1-acylglycerophosphoethanolamine O-acyltransferase
    activity. Involved in glycerophospholipid biosynthetic process. Located in lipid
    droplet. Human ortholog(s) of this gene implicated in congenital generalized lipodystrophy
    type 1 and lipodystrophy. Orthologous to human AGPAT1 (1-acylglycerol-3-phosphate
    O-acyltransferase 1) and AGPAT2 (1-acylglycerol-3-phosphate O-acyltransferase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SLC1
