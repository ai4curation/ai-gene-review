descriptions:
- source: UniProt
  text: Acyltransferase that catalyzes the sn-2-specific, acyl-CoA- dependent acylation
    of lysophosphatidic acid (LPA) to phosphatidic acid (PA) in lipid particles (PubMed:9401016).
    Together with ALE1, plays a central role in PA biosynthesis. PA is the intermediate,
    from which all glycerophospholipids are synthesized (PubMed:17890783). Can also
    acylate lysophosphoinositol (LPI) and lysophosphoserine (LPS) (PubMed:17675291).
    The fatty acyl substrates include 18:1-acyl-CoA, 14:0-acyl-CoA, 12:0-acyl-CoA
    and 10:0-acyl-CoA (PubMed:20694142).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33333
