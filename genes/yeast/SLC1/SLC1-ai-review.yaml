core_functions:
- description: sn-2-specific acyl-CoA:lysophosphatidic acid acyltransferase converting LPA to phosphatidic
    acid, the precursor of glycerophospholipids and TAG; active in ER and lipid droplet membranes, partially
    redundant with Ale1.
  molecular_function:
    id: GO:0003841
    label: 1-acylglycerol-3-phosphate O-acyltransferase activity
  directly_involved_in:
  - id: GO:0006654
    label: phosphatidic acid biosynthetic process
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  - id: GO:0005811
    label: lipid droplet
  supported_by:
  - reference_id: PMID:17675291
    supporting_text: In yeast, it is generated from lysophosphatidic acid, which is acylated by Slc1p,
      an sn-2-specific, acyl-coenzyme A-dependent 1-acylglycerol-3-phosphate O-acyltransferase.
  - reference_id: PMID:9401016
    supporting_text: the second step, acylation of lysophosphatidic acid, requires S1c1p
  - reference_id: PMID:24868093
    supporting_text: While both Say1 and Rer2 are present and active at the LD and ER, similar to Ayr1
      (60), Gpt2 (61), and Slc1 (62), not all proteins are active in all subcellular populations.
suggested_questions:
- question: What fraction of cellular PA synthesis is carried out by lipid-droplet-resident versus ER-resident
    Slc1, and is the LD pool physiologically significant for TAG synthesis?
- question: Does Slc1 contribute to sn-2 acyl remodelling of PI and PS in vivo, as suggested by its in
    vitro lysophospholipid acyltransferase activities?
suggested_experiments:
- description: Lipidomic flux analysis (13C-oleate pulse-chase) in slc1 and ale1 single mutants and an
    Slc1 variant restricted to ER or LD, to separate de novo PA synthesis from remodelling activity.
