id: P33333
gene_symbol: SLC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SLC1 encodes the major acyl-CoA-dependent 1-acyl-sn-glycerol-3-phosphate acyltransferase
  (lysophosphatidic acid acyltransferase, LPAAT; EC 2.3.1.51) of Saccharomyces cerevisiae. It acylates
  the sn-2 position of lysophosphatidic acid to form phosphatidic acid (PA), the branch-point intermediate
  from which CDP-diacylglycerol-derived glycerophospholipids and, via diacylglycerol, triacylglycerol
  are made. Slc1 is an integral membrane protein of the AGPAT/PlsC acyltransferase family (HXXXXD motif)
  that is active in both the endoplasmic reticulum and lipid droplets. In microsomal assays it also accepts
  other lysophospholipids (lyso-PC, lyso-PE, lyso-PS, lyso-PI) and can operate in reverse on PA, suggesting
  an additional role in sn-2 acyl remodelling. It is partially redundant with the MBOAT-family acyltransferase
  Ale1/Slc4; the slc1 ale1 double deletion is lethal. A dominant SLC1 allele was first identified as a
  suppressor of sphingolipid long-chain base deficiency.
