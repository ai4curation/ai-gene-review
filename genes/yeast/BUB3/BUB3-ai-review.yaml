- id: PMID:24066227
  title: Bub3 reads phosphorylated MELT repeats to promote spindle assembly checkpoint
    signaling.
  findings:
  - statement: >-
      Bub3 is the reader of Mps1-phosphorylated Spc105 MELT motifs; the Bub1-Bub3-MELT(P)
      structure (PDB 4BL0) shows the phosphopeptide on the side of the propeller; R217A/R239A
      abolishes kinetochore localization of Bub3 and Bub1 and the checkpoint.
    supporting_text: >-
      In this study, we report that Bub3, a 7-bladed β-propeller, is the MELT(P) reader.
    reference_section_type: ABSTRACT
  - statement: >-
      bub3 cells fail to arrest in nocodazole, re-replicate and re-bud; wild-type BUB3 but not
      the interface mutant rescues.
    supporting_text: >-
      Conversely, bub3Δ cells and bub3Δ expressing Bub3R217A–R239A-mCherry cells were unable
      to arrest, re-replicated their DNA, and re-budded, indicative of a disrupted SAC
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the defining mechanistic paper for yeast Bub3.
- id: PMID:24402315
  title: Mad1 kinetochore recruitment by Mps1-mediated phosphorylation of Bub1 signals
    the spindle checkpoint.
  findings:
  - statement: >-
      Bub3 co-purifies with kinetochores in a Spc105-MELT-phosphorylation-dependent manner;
      tethering the Bub1 middle region to Spc105-6A bypasses the need for kinetochore-bound
      Bub1/3, so Bub3's kinetochore role is to localize Bub1.
    supporting_text: >-
      This suggests that the only requirement for Bub3 kinetochore localization in spindle
      checkpoint initiation is to localize Bub1.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:27170178
  title: Dual mechanisms regulate the recruitment of spindle assembly checkpoint proteins
    to the budding yeast kinetochore.
  findings:
  - statement: >-
      Bub3-Bub1 binding to Spc105 follows mass action; Mps1 phosphorylation enables and Glc7
      dephosphorylation suppresses recruitment; each kinetochore recruits two Mad1-Mad2
      heterotetramers per Bub3-Bub1.
    supporting_text: >-
      Surprisingly, the kinetochore recruits two Mad1-Mad2 heterotetramers for every Bub3-Bub1
      molecule.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
