- id: PMID:41398407
  title: Genome-wide screen reveals dependence of break induced replication on several
    distinct checkpoints.
  findings:
  - statement: >-
      BIR is reduced in bub1, bub3 and mad2 deletions because the SAC is needed to prolong the
      G2/M arrest that gives BIR time to complete.
    supporting_text: >-
      Our screen identified a BIR defect in strains with deletion of the SAC genes BUB1 and
      BUB3, suggesting a role for the SAC in BIR.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached; establishes necessity of the SAC for BIR completion, not participation
      of Bub3 in the repair reaction.
- id: file:yeast/BUB3/BUB3-deep-research-falcon.md
  title: Deep research report for S. cerevisiae BUB3 (falcon / Edison Scientific Literature)
  findings:
  - statement: >-
      Literature synthesis: Bub3 is a non-enzymatic seven-bladed WD40 propeller (PDB 1YFQ at
      1.1 A) acting as phospho-MELT receptor and Bub1/Mad3 scaffold; the 2024 meiosis and GCR
      studies are pathway-level context rather than new Bub3 activities.
    supporting_text: >-
      Bub3 is a seven-bladed WD40 phosphopeptide receptor and checkpoint-complex scaffold that
      binds phosphorylated Spc105/KNL1 MELT motifs at unattached kinetochores, recruits
      Bub1-dependent SAC machinery, associates with Mad3, and contributes to MCC-mediated
      inhibition of APC/C–Cdc20.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Automated synthesis; every claim used in this review was checked against the cached
      primary papers.
