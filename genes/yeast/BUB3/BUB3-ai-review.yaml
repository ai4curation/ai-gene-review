  review:
    summary: >-
      PAINT inference from the Bub3 ancestral node PTN000103865 that Bub3 acts at the
      kinetochore, seeded by experimental kinetochore localization across the family including
      S. cerevisiae BUB3 itself. In budding yeast Bub3-mCherry co-localizes with the Mis12
      complex subunit Mtw1 during every cell cycle, and the phospho-MELT-binding mutant
      Bub3-R217A/R239A never does.
    action: ACCEPT
    reason: >-
      The kinetochore is where Bub3 performs its defining function, reading Mps1-phosphorylated
      MELT motifs on Spc105 and docking Bub1 there. Every characterized eukaryotic Bub3
      ortholog localizes to unattached kinetochores, so placement at the family root is sound.
      The target appearing in its own WITH/FROM list reflects the SGD experimental annotations
      that helped place the node and is expected.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000103865
        source_label: eukaryotic Bub3 IBD in PTHR10971
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The current PTHR10971 PAINT export places kinetochore localization on
          PTN000103865, an opisthokont/plant Bub3 node seeded by budding yeast,
          fission yeast, fly, mouse, Arabidopsis, and human descendants. This
          broad node supports BUB3's conserved phospho-MELT-dependent
          kinetochore localization.
    additional_reference_ids:
    - file:interpro/panther/PTHR10971/PTHR10971-paint.tsv
    supported_by:
    - reference_id: PMID:24066227
      supporting_text: >-
        Bub3-mCherry localizes to kinetochores during each cell cycle in unperturbed S.
        cerevisiae cells.
      reference_section_type: RESULTS
    - reference_id: PMID:27170178
      supporting_text: >-
        Spc105 then recruits the Bub3-Bub1 and Mad1-Mad2 complexes, which produce the
        inhibitory signal that arrests cell division.
      reference_section_type: ABSTRACT
- term:
    id: GO:0000776
    label: kinetochore
  evidence_type: IDA
  original_reference_id: PMID:24066227
  qualifier: located_in
  review:
    summary: >-
      Primorac et al. imaged Bub3-mCherry with Mtw1-GFP in live, unsynchronized S. cerevisiae
      cells and found Bub3 co-localizing with kinetochores from shortly before budding until
      approximately metaphase, whereas the MELT(P)-binding mutant Bub3-R217A/R239A never
      co-localized with Mtw1 and also displaced Bub1-GFP from kinetochores.
    action: ACCEPT
    reason: >-
      Direct in vivo localization of the yeast protein to kinetochores, with a structure-guided
      point mutant establishing that the localization depends on the phospho-MELT-binding
      surface of the propeller. This is the site of Bub3's core function.
    supported_by:
    - reference_id: PMID:24066227
      supporting_text: >-
        Bub3-mCherry appeared to co-localize with Mtw1 shortly before budding and until
        approximately metaphase
      reference_section_type: RESULTS
    - reference_id: PMID:24066227
      supporting_text: >-
        In contrast to Bub3-mCherry, Bub3R217A–R239A-mCherry never co-localized with Mtw1-GFP
        during the cell cycle, indicative of defective kinetochore recruitment
      reference_section_type: RESULTS
- term:
    id: GO:0000776
    label: kinetochore
  evidence_type: IDA
  original_reference_id: PMID:24402315
  qualifier: located_in
  review:
    summary: >-
      London and Biggins purified kinetochore particles from yeast and showed that Bub3-3GFP
      (like Bub1-3GFP) co-purifies with wild-type kinetochores but not with kinetochores
      carrying the phospho-deficient Spc105-6A MELT mutant or the Bub1(M)-Spc105-6A fusion,
      confirming that Bub3 associates with kinetochores through phosphorylated MELT motifs.
    action: ACCEPT
    reason: >-
      Biochemical demonstration that Bub3 is a kinetochore-associated protein in budding yeast
      and that its association requires Mps1-phosphorylated Spc105. The paper also shows that
      once Bub1 is tethered to the kinetochore, Bub3 is dispensable for Mad1 recruitment,
      which defines Bub3's kinetochore role as the receptor that localizes Bub1.
    supported_by:
    - reference_id: PMID:24402315
      supporting_text: >-
        Mps1 phosphorylation of Spc105 was recently shown to recruit Bub1 and Bub3 (the Bub1/3
        complex) to the kinetochore
      reference_section_type: INTRODUCTION
    - reference_id: PMID:24402315
      supporting_text: >-
        the endogenous Bub1 and Bub3 proteins did not associate with these fusion kinetochores
      reference_section_type: RESULTS
    - reference_id: PMID:24402315
      supporting_text: >-
        This suggests that the only requirement for Bub3 kinetochore localization in spindle
        checkpoint initiation is to localize Bub1.
      reference_section_type: DISCUSSION
- term:
    id: GO:0000776
    label: kinetochore
  evidence_type: IDA
  original_reference_id: PMID:27170178
  qualifier: located_in
  review:
    summary: >-
      Quantitative live-cell study of SAC protein recruitment by unattached budding yeast
      kinetochores. Binding of Bub3-Bub1 to Spc105 follows mass action; Mps1 phosphorylation
      of MELT repeats enables, and Glc7 dephosphorylation suppresses, Bub3-Bub1 recruitment;
      low Bub1 abundance and steric hindrance limit each Spc105 to about one Bub3-Bub1, and
      the kinetochore recruits two Mad1-Mad2 heterotetramers per Bub3-Bub1.
    action: ACCEPT
    reason: >-
      Direct in vivo quantification of the Bub3-Bub1 complex at unattached kinetochores in S.
      cerevisiae, the site at which Bub3 reads phospho-MELT motifs and nucleates checkpoint
      signaling.
    supported_by:
    - reference_id: PMID:27170178
      supporting_text: >-
        Mps1 kinase, which phosphorylates MELT repeats to enable Bub3-Bub1 recruitment, and
        Glc7 phosphatase, which dephosphorylates MELpT to suppress Bub3-Bub1 recruitment
      reference_section_type: RESULTS
    - reference_id: PMID:27170178
      supporting_text: >-
        Surprisingly, the kinetochore recruits two Mad1-Mad2 heterotetramers for every
        Bub3-Bub1 molecule.
      reference_section_type: ABSTRACT
