    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; partial requirement for Bub3.
- id: PMID:17227844
  title: Structural analysis of Bub3 interactions in the mitotic spindle checkpoint.
  findings:
  - statement: >-
      Mad3 and Bub1 GLEBS motifs are necessary and sufficient for Bub3 binding (Kd about 3-4
      uM), occupy the same top-face groove of the propeller in crystal structures (PDB
      2I3S/2I3T) and are mutually exclusive; interface mutants are checkpoint deficient.
    supporting_text: >-
      Crystal structures of these peptides with Bub3 show that the interactions for Mad3 and
      Bub1 are similar and mutually exclusive.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; structural definition of the Bub1-Bub3 and Mad3-Bub3 complexes.
