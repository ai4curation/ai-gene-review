proposed_new_terms: []
suggested_questions:
- question: >-
    Does the ubiquitin-binding top surface of the Bub3 propeller have any physiological role,
    given that in vivo that surface is occupied by the Bub1 or Mad3 GLEBS motif, and if so does
    ubiquitin compete with GLEBS binding or act on a GLEBS-free Bub3 pool?
- question: >-
    How does compromised Topo II function (and, during break-induced replication, a
    single-ended DSB) engage the Bub3-dependent checkpoint machinery when no kinetochore is
    unattached: is Bub3-Bub1 recruited to MELT-phosphorylated kinetochores in these
    conditions, or is the MCC assembled through a kinetochore-independent route?
- question: >-
    Why does each Spc105 recruit only about one Bub3-Bub1 despite six phosphorylatable MELT
    repeats, and does the Bub3-Mad3 pool ever bind MELT(P) motifs directly at yeast
    kinetochores, as BubR1-Bub3 can in human cells?
suggested_experiments:
- description: >-
    Separation-of-function bub3 alleles that abolish ubiquitin binding but preserve GLEBS and
    phospho-MELT binding (guided by the Doa1 top-surface mutations of Pashkova et al.), assayed
    for nocodazole arrest, Cdc20 autoubiquitination in vitro and MCC-APC/C disassembly.
  hypothesis: >-
    Ubiquitin binding by Bub3 is dispensable for SAC establishment but modulates the
    ubiquitin-dependent disassembly of the MCC from APC/C-Cdc20 during checkpoint silencing.
- description: >-
    Live-cell imaging of Bub3-GFP and Bub1-GFP at kinetochores of top2-B44 cells and of cells
    undergoing break-induced replication, combined with the MELT-phosphorylation-deficient
    spc105-6A allele, to test whether these non-canonical arrests use the canonical
    Bub3-MELT(P) recruitment route.
  hypothesis: >-
    The Topo II checkpoint and the SAC contribution to BIR arrest both proceed through
    Mps1-dependent MELT phosphorylation and Bub3-Bub1 kinetochore recruitment rather than
    through a kinetochore-independent MCC.
