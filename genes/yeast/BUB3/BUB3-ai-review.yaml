core_functions:
- description: >-
    Phospho-MELT reader and kinetochore adaptor: in the constitutive Bub1-Bub3 complex, the
    side of the Bub3 WD40 propeller binds Mps1-phosphorylated MELT motifs of Spc105/Knl1 while
    its top face holds the Bub1 GLEBS motif, docking Bub1 at unattached kinetochores; Bub1 in
    turn (after Mps1 phosphorylation) recruits Mad1-Mad2, so Bub3 converts kinetochore
    phosphorylation into assembly of the SAC signaling platform.
  molecular_function:
    id: GO:0140483
    label: kinetochore adaptor activity
  directly_involved_in:
  - id: GO:0007094
    label: mitotic spindle assembly checkpoint signaling
  locations:
