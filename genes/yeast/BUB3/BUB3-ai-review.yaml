- id: PMID:16651657
  title: A mitotic topoisomerase II checkpoint in budding yeast is required for genome
    stability but acts independently of Pds1/securin.
  findings:
  - statement: >-
      Bub3 is partially required for the Topo II-dependent G2/M delay, which uses SAC
      components but is not triggered by biorientation failure or loss of tension.
    supporting_text: >-
      The spindle checkpoint protein Bub3 appeared to be partially required for the G2/M
      delay, since in numerous experiments, top2-B44 bub3 Δ cells always had a G2/M period
      that was extended compared with wild-type cells, but that was shorter than top2-B44
