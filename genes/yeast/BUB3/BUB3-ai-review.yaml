  - SGD:S000005552
  review:
    summary: >-
      PAINT inference from node PTN000103837 (the Bub3/Rae1 WD40 ancestor), seeded by a single
      S. cerevisiae IDA (SGD S000005552; PMID:21070969) in which Pashkova et al. defined a
      large subset of WD40 beta-propellers as ubiquitin-binding domains whose conserved top
      surface binds the ubiquitin I44 hydrophobic patch.
    action: KEEP_AS_NON_CORE
    reason: >-
      The inference is phylogenetically reasonable, since the ubiquitin-binding top face is a
      conserved structural property of this propeller family, but the same top face of Bub3
      is occupied by the Bub1 and Mad3 GLEBS motifs in vivo, and no physiological role for
      ubiquitin binding by Bub3 in checkpoint signaling has been described. Retained as a
      plausible in vitro biochemical property that is not part of Bub3's core
      phospho-MELT-reader / MCC function. The same call was made for the human ortholog.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000103837
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Ancestral Bub3/Rae1 WD40 node; the descendant evidence is the in vitro ubiquitin
          binding survey of yeast WD40 propellers (PMID:21070969) with no checkpoint
          functional context.
    additional_reference_ids:
    - file:interpro/panther/PTHR10971/PTHR10971-paint.tsv
    supported_by:
    - reference_id: PMID:21070969
      supporting_text: >-
        We define a large subset of WD40 β-propellers as a class of ubiquitin-binding domains.
      reference_section_type: ABSTRACT
    - reference_id: PMID:17227844
      supporting_text: >-
        In both structures, the GLEBS peptide snakes along the top surface of the
