    label: bub1-bub3 complex
  supported_by:
  - reference_id: PMID:24066227
    supporting_text: >-
      In this study, we report that Bub3, a 7-bladed β-propeller, is the MELT(P) reader.
    reference_section_type: ABSTRACT
  - reference_id: PMID:24066227
    supporting_text: >-
      Mutations targeting the Bub3 interface prevent kinetochore recruitment of the SAC kinase
      Bub1.
    reference_section_type: ABSTRACT
  - reference_id: PMID:24402315
    supporting_text: >-
      This suggests that the only requirement for Bub3 kinetochore localization in spindle
      checkpoint initiation is to localize Bub1.
    reference_section_type: DISCUSSION
  - reference_id: PMID:27170178
    supporting_text: >-
      Spc105 then recruits the Bub3-Bub1 and Mad1-Mad2 complexes, which produce the inhibitory
      signal that arrests cell division.
    reference_section_type: ABSTRACT
- description: >-
    Structural subunit of the mitotic checkpoint complex: Bub3 bound to the Mad3 GLEBS motif is
    incorporated with closed Mad2 and Cdc20 into the kinetochore-independent MCC
    (Mad2-Mad3-Bub3-Cdc20), which binds APC/C-Cdc20, inhibits ubiquitination of securin and
    mitotic cyclins, and locks Cdc20 on the APC/C while promoting its autoubiquitination,
    thereby delaying anaphase. Bub3 solubilizes and structures Mad3 rather than contacting the
    APC/C itself, so it contributes to, rather than independently exerts, the ubiquitin ligase
    inhibitor activity.
