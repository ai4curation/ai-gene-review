      reference_section_type: ABSTRACT
- term:
    id: GO:0043130
    label: ubiquitin binding
  evidence_type: IDA
  original_reference_id: PMID:21070969
  qualifier: enables
  review:
    summary: >-
      Pashkova et al. used the Doa1/Ufd3 propeller as a paradigm and then showed that WD40
      beta-propellers from a functionally diverse set of yeast proteins bind ubiquitin in a
      similar fashion through the conserved top surface. The cached full text does not name
      Bub3 in its running text; the SGD curator presumably drew on the figure panel surveying
      yeast propellers, which is not in the cache.
    action: KEEP_AS_NON_CORE
    reason: >-
      The SGD curator read the full paper, and an in vitro ubiquitin pull-down by the Bub3
      propeller is biochemically plausible given the family-wide result, so the annotation is
      not disputed. But the assay was in vitro, the top face used for ubiquitin binding is
      the GLEBS-binding face that is occupied by Bub1 or Mad3 in the cell, and no
      checkpoint-related consequence of ubiquitin binding by Bub3 is known. It is retained as
      a non-core biochemical property rather than a core function.
    supported_by:
    - reference_id: PMID:21070969
      supporting_text: >-
        We further demonstrate that WD40 β-propellers from a functionally diverse set of
        proteins bind ubiquitin in a similar fashion.
      reference_section_type: ABSTRACT
