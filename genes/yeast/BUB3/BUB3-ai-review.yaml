- term:
    id: GO:0000727
    label: double-strand break repair via break-induced replication
  evidence_type: IMP
  original_reference_id: PMID:41398407
  qualifier: involved_in
  review:
    summary: >-
      A genome-wide screen for break-induced replication (BIR) genes recovered bub1 and bub3
      deletions, and BIR was reduced in bub1, bub3 and mad2 mutants in three BIR systems. The
      authors show that the SAC prolongs the DNA-damage-checkpoint-induced G2/M arrest so that
      the slow BIR process has time to complete; SAC mutants exit arrest early and BIR synthesis
      is interrupted.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The full text is cached and the phenotype is genuine, but Bub3 does none of the work of
      BIR: it performs no strand invasion, D-loop formation or DNA synthesis. Its contribution
      is checkpoint signaling that delays nuclear division, which BIR depends on for time.
      This is necessity rather than participation, and the paper itself frames the SAC's role
      as extending G2/M arrest. The checkpoint contribution is already captured by the mitotic
      spindle assembly checkpoint signaling rows (GO:0007094) and the GO:0044774 IGI row, so
      annotating Bub3 as involved_in the repair process over-extends the term. The same call
      was made for the paralogous MAD2 row in this repository.
    supported_by:
    - reference_id: PMID:41398407
      supporting_text: >-
        Our screen identified a BIR defect in strains with deletion of the SAC genes BUB1 and
        BUB3, suggesting a role for the SAC in BIR.
      reference_section_type: RESULTS
    - reference_id: PMID:41398407
      supporting_text: >-
        while DNA damage and spindle checkpoint machineries are both required to delay nuclear
        division and provide adequate time for BIR to complete
      reference_section_type: ABSTRACT
    - reference_id: PMID:41398407
      supporting_text: >-
        Specifically, we propose that G2/M checkpoint arrest established in cells undergoing
        BIR repair is extended by the SAC, and that this is important for BIR completion.
      reference_section_type: RESULTS
