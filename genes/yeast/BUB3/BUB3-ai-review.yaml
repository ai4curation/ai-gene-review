- id: PMID:10704439
  title: MAD3 encodes a novel component of the spindle checkpoint which interacts
    with Bub3p, Cdc20p, and Mad2p.
  findings:
  - statement: >-
      Mad3p binds Bub3p by two-hybrid and co-immunoprecipitation through homology region II
      (the GLEBS motif), and also interacts with Cdc20p and Mad2p.
    supporting_text: >-
      Bub1p is known to bind Bub3p (Roberts et al. 1994) and we use two-hybrid assays and
      coimmunoprecipitation experiments to show that Mad3p can also bind to Bub3p.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; first description of the Mad3-Bub3 interaction.
- id: PMID:10837255
  title: Complex formation between Mad1p, Bub1p and Bub3p is crucial for spindle checkpoint
    function.
  findings:
  - statement: >-
      Mad1p associates with Bub1p and Bub3p in a regulated manner that increases on checkpoint
      activation; a Mad1p motif required for the complex is essential for checkpoint function.
    supporting_text: >-
      Mutation of this motif abolishes checkpoint function, indicating that formation of the
      Mad1p-Bub1p-Bub3p complex is a crucial step in the spindle checkpoint mechanism.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache.
- id: PMID:11726501
  title: Bub3 interaction with Mad2, Mad3 and Cdc20 is mediated by WD40 repeats and
    does not require intact kinetochores.
  findings:
  - statement: >-
      Bub3 associates with Cdc20, Mad1 and Mad2 in a checkpoint-upregulated manner; the
      Bub3-Cdc20 complex needs all checkpoint proteins but not kinetochores; Bub3 WD40 mutants
      W31G/W120G lose Mad2, Mad3 and Cdc20 binding and checkpoint function.
    supporting_text: >-
      point mutations altering the conserved WD40 motifs of Bub3, which might be involved in
      the formation of a beta-propeller fold devoted to protein-protein interactions, disrupt
      its association with Mad2, Mad3 and Cdc20, as well as proper checkpoint response.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; defining paper for Bub3 in the yeast MCC.
- id: PMID:15879521
  title: Two complexes of spindle checkpoint proteins containing Cdc20 and Mad2 assemble
    during mitosis independently of the kinetochore in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Mad2, Mad3 and Bub3 are in stoichiometric excess over Cdc20 and APC/C; a small
      Mad2-Mad3-Bub3-Cdc20 complex and a larger Mad2-Cdc20 complex form in mitosis independently
      of the kinetochore.
    supporting_text: >-
      There is a small amount of Mad2-Mad3-Bub3-Cdc20 and a much larger amount of a complex
      that contains Mad2-Cdc20.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
