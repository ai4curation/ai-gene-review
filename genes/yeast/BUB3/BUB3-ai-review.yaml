taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Bub3 is the WD40-repeat spindle assembly checkpoint (SAC) protein of budding yeast, a
  341-residue non-enzymatic seven-bladed beta-propeller encoded by YOR026W. BUB3 was
  discovered, with BUB1 and BUB2, as a gene required for cell cycle arrest in response to
  loss of microtubule function, and its deletion abolishes the checkpoint: bub3 cells treated
  with nocodazole fail to arrest, re-bud and re-replicate their DNA. Bub3 forms constitutive,
  mutually exclusive heterodimers with Bub1 and with Mad3 (the BubR1 ortholog), each of which
  binds the top face of the propeller through a GLEBS motif. In the Bub1-Bub3 complex, Bub3
  is the reader of the Mps1-phosphorylated MELT motifs of the outer-kinetochore scaffold
  Spc105/Knl1: a conserved interface on the side of the propeller docks the phospho-MELT
  peptide, and mutations at this interface (R217A/R239A) prevent kinetochore recruitment of
  both Bub3 and Bub1 and disrupt the checkpoint. Kinetochore-bound Bub1-Bub3 in turn provides
  the receptor for Mad1-Mad2, whose recruitment depends on Mps1 phosphorylation of Bub1, so
  the Bub1-Bub3 complex converts kinetochore phosphorylation into assembly of the checkpoint
  signaling platform. Bub3 bound to Mad3 is incorporated, together with closed Mad2 and
  Cdc20, into the mitotic checkpoint complex (MCC; Mad2-Mad3-Bub3-Cdc20), which forms during
  mitosis independently of the kinetochore, binds APC/C-Cdc20 and inhibits ubiquitination of
  securin (Pds1) and mitotic cyclins while locking Cdc20 on the APC/C and promoting its
  autoubiquitination. In this way Bub3 delays the metaphase-to-anaphase transition until every
  kinetochore is bioriented. Because budding yeast undergoes a closed mitosis, Bub3 acts
  within the nucleus, concentrating at kinetochores from shortly before budding until
  metaphase and otherwise being diffusely nuclear. Bub3 also contributes to the Topo
  II-dependent G2/M delay and, through the SAC, to the prolonged G2/M arrest that allows slow
  DNA repair processes such as break-induced replication to complete.
