gene_symbol: BUB3
organism: yeast
uniprot_id: P26449
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in mitotic spindle assembly checkpoint signaling, a process that
    delays anaphase until chromosomes are bioriented on the spindle, and in the repair
    of incorrect mitotic kinetochore-spindle microtubule attachments (PubMed:15879521,
    PubMed:24066227). Component of the mitotic checkpoint complex (MCC) which inhibits
    the ubiquitin ligase activity of the anaphase promoting complex/cyclosome (APC/C)
    by preventing its activation by CDC20 (PubMed:15879521).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P26449
  source_id: P26449
- source: Alliance_Imported
  text: Kinetochore checkpoint WD40 repeat protein; localizes to kinetochores during
    prophase and metaphase, delays anaphase in the presence of unattached kinetochores;
    forms complexes with Mad1p-Bub1p and with Cdc20p, binds Mad2p and Mad3p; functions
    at kinetochore to activate APC/C-Cdc20p for normal mitotic progression
  source_type: curated
  url: https://www.yeastgenome.org/locus/BUB3
  source_id: SGD:S000005552
- source: Alliance_Automated
  text: Enables ubiquitin binding activity. Involved in double-strand break repair
    via break-induced replication; negative regulation of cell cycle phase transition;
    and positive regulation of protein autoubiquitination. Located in kinetochore
    and nucleus. Part of bub1-bub3 complex and mitotic checkpoint complex. Orthologous
    to human BUB3 (BUB3 mitotic checkpoint protein).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BUB3
  source_id: SGD:S000005552
fetch_date: '2026-11-01'
