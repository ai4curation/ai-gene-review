    overall_notes: 'Detailed and correct: WD40 kinetochore checkpoint protein, Mad1-Bub1
      and Cdc20 complexes, binds Mad2 and Mad3. The final clause on activating APC/C-Cdc20
      is a less familiar role not discussed in the review.'
- source: Alliance_Automated
  text: Enables ubiquitin binding activity. Involved in double-strand break repair
    via break-induced replication; negative regulation of cell cycle phase transition;
    and positive regulation of protein autoubiquitination. Located in kinetochore
    and nucleus. Part of bub1-bub3 complex and mitotic checkpoint complex. Orthologous
    to human BUB3 (BUB3 mitotic checkpoint protein).
  source_type: automated
