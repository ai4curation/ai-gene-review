  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: >-
      SSA1 has been detected in the cell wall by IDA (PMID:8755907). IEA is consistent.
    action: KEEP_AS_NON_CORE
    reason: >-
