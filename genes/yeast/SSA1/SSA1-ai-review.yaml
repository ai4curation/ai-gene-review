id: P10591
gene_symbol: SSA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  SSA1 encodes the major constitutively expressed cytosolic Ssa-family Hsp70
  chaperone in Saccharomyces cerevisiae. Ssa1 binds non-native polypeptides and
  uses an ATP-driven substrate-binding cycle to promote folding and refolding,
  prevent aggregation, and support proteostasis. J-domain cochaperones such as
  Ydj1 and Sis1 stimulate its ATPase cycle, while nucleotide-exchange factors
  including Sse1/Sse2 and Fes1 promote ADP release. Ssa1 also cooperates with
  Hsp104 and Hsp40 in recovery of aggregated proteins and applies this core
  chaperone mechanism to protein targeting, degradation, and stress responses.
