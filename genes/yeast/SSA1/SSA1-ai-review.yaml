- term:
    id: GO:0006616
    label: SRP-dependent cotranslational protein targeting to membrane, translocation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: >-
      SSA1 has been implicated in protein translocation to the ER membrane (IDA from
      PMID:8754838). However, PMID:8947547 found that depletion of Ssa1/2p had no effect
      on translocation efficiency in vitro. The role may be more indirect.
    action: MODIFY
    reason: >-
      The cited SSA/Ydj1 evidence concerns post-translational precursor
      translocation rather than the SRP-dependent cotranslational route. The
      replacement captures the supported mechanism without making it core.
    proposed_replacement_terms:
      - id: GO:0031204
        label: post-translational protein targeting to membrane, translocation
