gene_symbol: SSA1
organism: yeast
uniprot_id: P10591
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: May play a role in the transport of polypeptides both across the mitochondrial
    membranes and into the endoplasmic reticulum. A functional difference between
    SSA1 and SSA2 proteins is expected. SSA1 can participate in the ATP-dependent
    disassembly of clathrin-coated vesicles.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P10591
  source_id: P10591
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
      notes: Correct but tentative; clathrin disassembly role is well-established.
    - rubric: utility
      score: 3
      notes: Covers some functions but misses the major roles (folding, degradation,
        prion).
    - rubric: compactness
      score: 4
      notes: Three sentences.
    - rubric: completeness
      score: 2
      notes: Misses HSP70 identity, protein folding, ubiquitin-dependent degradation,
        NLS transport, prion propagation, Ydj1p complex.
    - rubric: specificity
      score: 3
      notes: Names clathrin disassembly and mitochondrial/ER transport.
    overall_notes: Somewhat outdated description. Mentions mitochondrial/ER transport,
      functional difference from SSA2, and clathrin disassembly. Hedges with "may
      play a role". Misses HSP70 family identity, protein folding, prion propagation,
      and nuclear transport.
- source: Alliance_Imported
  text: ATPase involved in protein folding and NLS-directed nuclear transport; HSP70
    family member; required for Ub-dependent degradation of short-lived proteins;
    Ydj1p accelerates ATP hydrolysis and release; mechanosensor-mediated phosphorylation
    by Pkc1p promotes the global heat shock response; localizes to the nucleus, cytoplasm
    and cell wall; role in [URE3] prion propagation and vacuolar-mediated degradation
    of gluconeogenic enzymes; targets Hsp104p to prion fibrils; 98% identity with
    paralog Ssa2p
  source_type: curated
  url: https://www.yeastgenome.org/locus/SSA1
  source_id: SGD:S000000004
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 2
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 3
    overall_notes: 'Correct: Hsp70 ATPase in folding and nuclear transport, stimulated
      by Ydj1, with roles in [URE3] propagation and Hsp104 targeting. A long list
      of separate findings (Pkc1 phosphorylation, cell wall localization, gluconeogenic
      enzyme degradation) with little mechanism.'
- source: Alliance_Automated
  text: Enables ATP hydrolysis activity and tRNA binding activity. Involved in several
    processes, including gene expression; intracellular protein transport; and protein-containing
    complex disassembly. Located in fungal-type cell wall; fungal-type vacuole membrane;
    and nucleus. Human ortholog(s) of this gene implicated in several diseases, including
    artery disease (multiple); autoimmune disease of musculoskeletal system (multiple);
    inner ear disease (multiple); lung disease (multiple); and schizophrenia (multiple).
    Orthologous to several human genes including HSPA1L (heat shock protein family
    A (Hsp70) member 1 like); HSPA1A (heat shock protein family A (Hsp70) member 1A);
    and HSPA1B (heat shock protein family A (Hsp70) member 1B).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SSA1
  source_id: SGD:S000000004
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Never says Hsp70 chaperone or protein folding. It leads with ATP
      hydrolysis and tRNA binding, and the processes are generic ('gene expression').
      Cell wall and vacuole membrane are peripheral, and the disease list is long.
- source: RefSeq
  text: Enables ATP hydrolysis activity; tRNA binding activity; and unfolded protein
    binding activity. Involved in several processes, including establishment of protein
    localization to organelle; gene expression; and protein-containing complex disassembly.
    Located in fungal-type cell wall; fungal-type vacuole membrane; and nucleus. Human
    ortholog(s) of this gene implicated in several diseases, including Kawasaki disease;
    artery disease (multiple); autoimmune disease of musculoskeletal system (multiple);
    neurodegenerative disease (multiple); and schizophrenia (multiple). Orthologous
    to several human genes including HSPA1L (heat shock protein family A (Hsp70) member
    1 like); HSPA1A (heat shock protein family A (Hsp70) member 1A); and HSPA1B (heat
    shock protein family A (Hsp70) member 1B). [provided by Alliance of Genome Resources,
    Jul 2025]
  source_type: automated
