  label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for yeast SSA1, the major cytosolic Hsp70. The curated core function
  is ATP-dependent protein folding chaperone, and the top five contains no ATP term, no chaperone
  activity and no folding term. The closest is rank 5, denatured protein binding - which is also what
  ProTrek returns at rank 2 for rat Hspa8 and at rank 2 for rat St13, making it the model's generic
  HSP70-family answer rather than anything about Ssa1. Ranks 1 and 2 are the protein aggregate center
  and its assembly, the same pair returned for yeast HSP104 at ranks 4 and 5; both proteins are cytosolic
  chaperones that act on aggregates, so the overlap is defensible, but the model gives the disaggregase
  and the Hsp70 overlapping answers instead of distinguishing them. Rank 4, mating type switching,
  is a yeast-wide attractor that also surfaces - as regulation of mating type switching, where it
  is impossible - at ranks 2 and 3 for worm skn-1. Assessment: 1 correct novel, 1 uncertain, 1 correct-not-novel.
  Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 uncertain (UNC).
