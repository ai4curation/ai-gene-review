  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 16.06), absent from GOA. Cytosolic Hsp70 is recruited to the sequestration
      sites where misfolded proteins are concentrated, and GOA already holds stress granule disassembly
      (IDA) for this gene, so the compartment claim is consistent with what is annotated and adds
      a localization the record lacks. Correct and usable, with the caveat that the same term is returned
      for HSP104 and so is not discriminating between the two.
