- source: Alliance_Automated
  text: Enables dol-P-Man:Man(7)GlcNAc(2)-PP-Dol alpha-1,6-mannosyltransferase activity.
    Involved in dolichol-linked oligosaccharide biosynthetic process. Located in endoplasmic
    reticulum. Used to study congenital disorder of glycosylation type I. Human ortholog(s)
    of this gene implicated in congenital disorder of glycosylation Ig. Orthologous
    to human ALG12 (ALG12 alpha-1,6-mannosyltransferase).
