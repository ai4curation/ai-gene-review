descriptions:
- source: UniProt
  text: Mannosyltransferase that operates in the biosynthetic pathway of dolichol-linked
    oligosaccharides, the glycan precursors employed in protein asparagine (N)-glycosylation.
    The assembly of dolichol-linked oligosaccharides begins on the cytosolic side
    of the endoplasmic reticulum membrane and finishes in its lumen. The sequential
    addition of sugars to dolichol pyrophosphate produces dolichol-linked oligosaccharides
    containing fourteen sugars, including two GlcNAcs, nine mannoses and three glucoses.
    Once assembled, the oligosaccharide is transferred from the lipid to nascent proteins
    by oligosaccharyltransferases. In the lumen of the endoplasmic reticulum, adds
    the eighth mannose residue in an alpha-1,6 linkage onto Man(7)GlcNAc(2)-PP-dolichol
    to produce Man(8)GlcNAc(2)-PP-dolichol.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53730
  source_id: P53730
- source: Alliance_Imported
