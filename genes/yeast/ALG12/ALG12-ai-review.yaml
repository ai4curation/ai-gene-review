  review:
    summary: 'RCA is_active_in cytosol produced by the YeastPathways LLO pathway converter, which placed
      all reactions of the pathway in the cytosol. This is wrong for Alg12p: it is a multi-pass ER membrane
      enzyme that uses Dol-P-Man in the ER lumen and acts on Man7GlcNAc2-PP-Dol after the LLO has been
      flipped to the luminal leaflet. No part of its activity occurs in the cytosol.'
    action: REMOVE
    reason: Compartment default contradicted by the luminal orientation of all Dol-P-Man-dependent LLO
      glycosyltransferases.
    supported_by:
    - &id005
      reference_id: PMID:15987956
