core_functions:
- description: Transfers mannose from Dol-P-Man in alpha-1,6 linkage to Man7GlcNAc2-PP-dolichol in the
    ER lumen, forming Man8GlcNAc2-PP-Dol during luminal extension of the N-glycan precursor.
  molecular_function:
    id: GO:0052917
    label: dol-P-Man:Man(7)GlcNAc(2)-PP-Dol alpha-1,6-mannosyltransferase activity
