  label: Saccharomyces cerevisiae S288C
description: ALG12 (ECM39) encodes the Dol-P-Man:Man7GlcNAc2-PP-Dol alpha-1,6-mannosyltransferase (EC
  2.4.1.260) of S. cerevisiae, a multi-pass ER membrane protein of glycosyltransferase family GT22 whose
  active site faces the ER lumen. Using dolichyl-phosphate-mannose as donor, Alg12p adds the eighth mannose,
  in alpha-1,6 linkage, to Man7GlcNAc2-PP-dolichol (the product of Alg9p), creating the C-arm branch point
  that Alg9p then extends to Man9GlcNAc2-PP-Dol. Its strict acceptor specificity helps enforce the ordered
  assembly of the branched lipid-linked oligosaccharide. alg12 deletion is viable but accumulates Man7GlcNAc2-PP-Dol,
  leading to mild hypoglycosylation of secretory proteins; human ALG12 deficiency causes ALG12-CDG.
