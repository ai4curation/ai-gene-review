  - *id005
  - *id002
suggested_questions:
- question: What structural features of Alg12p's acceptor site restrict it to Man7GlcNAc2-PP-Dol carrying
    the Alg9-added alpha-1,2 mannose, enforcing ordered LLO assembly?
suggested_experiments:
- description: Determine a structure of Alg12p bound to Dol-P-Man analogues and test acceptor specificity
    with synthetic Man6-Man8 LLO isomers.
