descriptions:
- source: UniProt
  text: Component of LSm protein complexes, which are involved in RNA processing and
    may function in a chaperone-like manner (PubMed:10747033, PubMed:24513854). Component
    of the cytoplasmic LSM1- LSM7 complex which is involved in mRNA degradation by
    activating the decapping step (PubMed:10747033, PubMed:10761922, PubMed:17513695,
    PubMed:24513854). Together with PAT1, the LSM1-LSM7 complex binds to osmotic stress-activated
    mRNAs to attenuate the osmotic stress response, probably by limiting ribosome
    access to the mRNA and consequently translation (PubMed:30059503). Component of
    the nuclear LSM2-LSM8 complex, which is involved in spliceosome assembly (PubMed:10747033).
    The LSM2-LSM8 complex plays a role in the biogenesis of the spliceosomal U4/U6-U5
    tri-snRNP complex by accelerating PRP24- mediated annealing of U4/U6 di-snRNA
    (PubMed:10747033, PubMed:24240276, PubMed:29717126). The LSM2-LSM8 complex binds
    U6 snRNA terminating with a non-cyclic 3' phosphate group (PubMed:29717126). LSM2-LSM8
    is probably also involved in degradation of nuclear pre-mRNA by targeting them
    for decapping (PubMed:15485930). LSM2-LSM8 could be involved in processing of
    pre-tRNAs, pre-rRNAs and U3 snoRNA, although involvement may be indirect (PubMed:12077351,
    PubMed:12438310, PubMed:15075370). In a complex that probably contains LSM2-LSM7,
    but not LSM1 or LSM8, associates with the precursor of the RNA component of RNase
    P (pre-P RNA) and may be involved in maturing pre-P RNA; the complex also associates
    with snoRNA SNR5 (PubMed:10369684, PubMed:15075370).
