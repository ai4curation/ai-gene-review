suggested_questions:
- question: The Lsm6 PAINT node PTN000111600 propagates P-body but not deadenylation-dependent decapping
    or the Lsm1-7-Pat1 complex, although yeast LSM6 deletion blocks decapping (PMID:10747033). Is decapping
    deliberately restricted to the Lsm1 node, and if so should Lsm2-7 subunits carry a contributes_to-style
    or complex-level annotation instead?
- question: Should the nuclear Lsm2-8-dependent decapping of nucleus-retained mRNAs and intron-containing
    pre-mRNAs (lsm6 deletion stabilises them, PMID:15485930) be captured by a GO process term, and which
    entity performs that decapping step?
- question: The GO:0000290 IMP annotation to LSM6 cites PMID:15716506, an LSM1 mutagenesis study; would
    PMID:10747033 (lsm6 deletion) be the more appropriate reference?
suggested_experiments:
- description: Use separation-of-function lsm6 point mutants at the Lsm3 and Lsm5 interfaces, or at Arg74,
    to test whether nuclear Lsm2-8 functions (U6 levels, pre-rRNA and pre-tRNA processing, nuclear mRNA
    decay) can be uncoupled from cytoplasmic Lsm1-7 decapping in S. cerevisiae.
- description: Use auxin-inducible depletion of Lsm6 with CRAC or iCLIP to determine whether the Lsm2-8
    complex binds pre-rRNA and pre-tRNA directly in an Lsm6-dependent manner, distinguishing a direct
    chaperone role from an indirect effect of U6 loss.
