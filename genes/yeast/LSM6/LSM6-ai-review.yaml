- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IDA
  original_reference_id: PMID:10369684
  qualifier: contributes_to
  review:
    summary: Immunoprecipitation of the Lsm proteins recovered U6 snRNA and pre-RNase P RNA; annotated
      with contributes_to as LSM6 binds RNA as part of a heteroheptameric ring.
    action: MODIFY
    reason: The contributes_to qualifier is correct, because RNA recognition is a property of the ring
      (in Lsm2-8 the 3' uridines are contacted by Lsm3, Lsm2, Lsm8 and Lsm4, while the invariant Arg of
      Lsm6 is needed for high-affinity binding). The RNA identified here is U6 snRNA, so U6 snRNA binding
      is the informative term, still as contributes_to.
    proposed_replacement_terms:
    - id: GO:0017070
      label: U6 snRNA binding
    supported_by:
    - &id008
      reference_id: PMID:10369684
      supporting_text: Immunoprecipitation revealed that an evolutionarily related subgroup of seven Sm-like
        proteins is directly associated with the nuclear U6 and pre-RNase P RNAs.
    - &id004
      reference_id: PMID:24513854
      supporting_text: mutation of the conserved Arg to Ala in any of the Lsm6/3/2/8/4 subunits results
        in drastic reduction of binding affinity between the 3′-end U-rich sequence of U6 snRNA and the
        Lsm2-8 complex
