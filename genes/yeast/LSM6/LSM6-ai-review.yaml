    summary: PAINT annotation from PTN000111530, the node uniting the SmF and Lsm6 branches of PTHR11021;
      LSM6 (Q06406) is in subfamily PTHR11021:SF1 and is itself among the experimental donors.
    action: ACCEPT
    reason: 'Both SmF (canonical Sm ring) and Lsm6 (Lsm2-8 ring of U6 snRNP) act in nuclear pre-mRNA splicing,
      so a deep node placement is coherent. Yeast LSM6 is inside the clade and has direct evidence: it
      is a subunit of the U6 snRNP and tri-snRNP, and Lsm proteins are required for stable U6 accumulation.'
