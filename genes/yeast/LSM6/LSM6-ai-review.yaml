id: Q06406
gene_symbol: LSM6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: LSM6 is a small (86-residue) Sm-fold protein of budding yeast and one of six subunits shared
  by two heteroheptameric Lsm rings that bind the 3' ends of RNAs. In the nucleus it is part of the Lsm2-8
  ring (order Lsm8-2-3-6-5-7-4), which binds the 3' oligouridylate end of U6 snRNA, stabilises U6, accelerates
  Prp24-mediated U4/U6 annealing and remains part of the U6 snRNP, the U4/U6 di-snRNP and the U4/U6.U5
  tri-snRNP that enters the spliceosome. The nuclear Lsm2-8 complex also promotes decapping and 5' degradation
  of nucleus-retained mRNAs and pre-mRNAs, and Lsm proteins act as chaperone-like factors in normal processing
  of pre-tRNAs, pre-rRNAs and the U3 snoRNA. A minor Lsm2-7 complex lacking Lsm1 and Lsm8 associates with
  snoRNA snR5 and pre-RNase P RNA in the nucleolus. In the cytoplasm LSM6 is part of the Lsm1-7 ring (order
  Lsm1-2-3-6-5-7-4), which with Pat1 binds deadenylated mRNAs and activates decapping and 5'-3' decay,
  and which accumulates in P-bodies. Within both rings LSM6 contacts only Lsm3 and Lsm5, and its invariant
  Arg74 contributes to high-affinity binding of U-rich RNA 3' ends. LSM6 is not essential for vegetative
  growth, unlike Lsm2-5 and Lsm8.
existing_annotations:
- term:
    id: GO:0000290
    label: deadenylation-dependent decapping of nuclear-transcribed mRNA
  evidence_type: IMP
  original_reference_id: PMID:15716506
  qualifier: involved_in
  review:
    summary: LSM6, as a subunit of the cytoplasmic Lsm1-7-Pat1 complex, is required for decapping of deadenylated
      mRNAs. The cited paper is an LSM1 mutagenesis study; LSM6 itself was shown to be required for decapping
      by deletion analysis (PMID:10747033) and by mutation (PMID:10761922).
    action: ACCEPT
    reason: Deletion of LSM6 stabilises reporter mRNAs, which accumulate in capped form, placing the block
      at decapping (PMID:10747033); mutations in each of Lsm1-Lsm7 inhibit decapping (PMID:10761922).
      The cited reference (PMID:15716506) mutates LSM1, so the attribution to LSM6 is a complex-level
      inference, but the claim is independently established for LSM6. The Lsm6 PAINT node PTN000111600
      did not propagate this term, so it should be treated as experimentally established in S. cerevisiae
      but not as an inherited branch-wide annotation.
    supported_by:
    - &id021
      reference_id: PMID:10747033
      supporting_text: Deletions of LSM1, 6, 7 and PAT1 genes increased the half-life of reporter mRNAs.
        Interestingly, accumulating mRNAs were capped, suggesting a block in mRNA decay at the decapping
        step.
    - &id022
      reference_id: PMID:10761922
      supporting_text: Here we show that mutations in seven yeast Lsm proteins (Lsm1-Lsm7) also lead to
        inhibition of mRNA decapping.
    - reference_id: PMID:15716506
      supporting_text: The heteroheptameric Lsm1p-7p complex is a general activator of decapping and also
        functions in protecting the 3' ends of deadenylated mRNAs from a 3'-trimming reaction.
    additional_reference_ids:
    - PMID:10747033
    - PMID:10761922
