- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR047575
  review:
    summary: InterPro2GO mapping from the Sm domain (IPR047575) to RNA binding.
    action: MODIFY
    reason: 'RNA binding is the activity shared by the whole SmF/Lsm6 family and is true of LSM6, but
      it is general. In LSM6 it is exerted within heptameric rings: the Lsm2-8 ring binds the U6 snRNA
      3'' end and the Lsm1-7 ring binds mRNA (it co-immunoprecipitates mRNA and prefers oligo-U ends),
      with LSM6 contributing through its invariant Arg74. The informative replacements are U6 snRNA binding
      and mRNA binding, both best stated with contributes_to.'
    proposed_replacement_terms:
    - id: GO:0017070
      label: U6 snRNA binding
    - id: GO:0003729
      label: mRNA binding
