- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:18029398
  qualifier: located_in
  review:
    summary: Spiller et al. showed that nuclear accumulation of Lsm proteins depends on complex formation
      with Lsm8 (Lsm2-8), and that Lsm1 and Lsm8 compete to localise the shared subunits.
    action: ACCEPT
    reason: LSM6 is a shared subunit of the nuclear Lsm2-8 ring; nuclear localisation is well supported
      and is where its splicing function is carried out.
    supported_by:
    - &id005
      reference_id: PMID:18029398
      supporting_text: We show that, in yeast, the nuclear accumulation of Lsm proteins depends on complex
        formation and that the Lsm8p subunit plays a crucial role.
    - &id012
      reference_id: PMID:18029398
      supporting_text: A shift of Lsm proteins from the nucleus to the cytoplasm under stress conditions
        indicates that this competition is biologically significant.
