gene_symbol: MEU1
organism: yeast
uniprot_id: Q07938
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the phosphorolytic cleavage of S-methyl-5'- thioadenosine (MTA)
    to adenine and 5-methylthioribose1-phosphate. Involved in the breakdown of MTA,
    a major by-product of polyamine biosynthesis. Responsible for the first step in
    the methionine salvage pathway after MTA has been generated from S-adenosylmethionine.
    Has broad substrate specificity with 6-aminopurine nucleosides as preferred substrates.
    Seems to be implicated in the regulation of the expression of the ADH2 gene.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07938
  source_id: Q07938
- source: Alliance_Imported
  text: Methylthioadenosine phosphorylase (MTAP); catalyzes the initial step in the
    methionine salvage pathway; affects polyamine biosynthesis through regulation
    of ornithine decarboxylase (Spe1p) activity; regulates ADH2 gene expression
  source_type: curated
  url: https://www.yeastgenome.org/locus/MEU1
  source_id: SGD:S000004007
- source: Alliance_Automated
  text: Enables S-methyl-5-thioadenosine phosphorylase activity and mRNA binding activity.
    Involved in L-glutamate biosynthetic process and L-methionine cycle. Located in
    cytoplasm. Human ortholog(s) of this gene implicated in biliary tract benign neoplasm
    and diaphyseal medullary stenosis with malignant fibrous histiocytoma. Orthologous
    to human MTAP (methylthioadenosine phosphorylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MEU1
  source_id: SGD:S000004007
