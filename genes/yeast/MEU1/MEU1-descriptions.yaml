descriptions:
- source: UniProt
  text: Catalyzes the phosphorolytic cleavage of S-methyl-5'- thioadenosine (MTA)
    to adenine and 5-methylthioribose1-phosphate. Involved in the breakdown of MTA,
    a major by-product of polyamine biosynthesis. Responsible for the first step in
    the methionine salvage pathway after MTA has been generated from S-adenosylmethionine.
    Has broad substrate specificity with 6-aminopurine nucleosides as preferred substrates.
    Seems to be implicated in the regulation of the expression of the ADH2 gene.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07938
