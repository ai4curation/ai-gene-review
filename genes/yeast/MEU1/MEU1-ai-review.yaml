suggested_questions:
- question: What phenotype underlies the SGD 'L-glutamate biosynthetic process' IMP for MEU1 (PMID:8807288), and
    is it a secondary consequence of MTA accumulation or ADH2 regulation?
- question: Is the reported Meu1 association with its own mRNA functionally relevant (e.g. autoregulation)?
