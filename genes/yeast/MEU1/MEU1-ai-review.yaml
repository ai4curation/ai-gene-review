  qualifier: involved_in
  review:
    summary: SGD IMP from Donoviel & Young 1996 (MEU1 as multicopy enhancer of UAS2-dependent ADH2 expression).
      The cached abstract reports only ADH2-expression and no-growth-defect phenotypes and does not mention glutamate;
      the basis of the glutamate-biosynthesis annotation must be in the full text, which we could not read. A direct
      role of an MTA phosphorylase in glutamate synthesis is not expected biologically, but an experimental curator
      call cannot be dismissed without the full text.
    action: UNDECIDED
    reason: Full text not available; abstract does not describe a glutamate phenotype.
    supported_by:
    - reference_id: PMID:8807288
      supporting_text: Disruption of MEU1 reduced endogenous ADH2 expression about twofold but had no effect on
        cell viability or growth.
