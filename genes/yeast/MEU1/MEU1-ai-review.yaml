  label: Saccharomyces cerevisiae S288C
description: S-methyl-5'-thioadenosine phosphorylase (MTAP, EC 2.4.2.28) of Saccharomyces cerevisiae, a homotrimeric
  PNP/MTAP-family enzyme that phosphorolyses 5'-methylthioadenosine (MTA), the by-product of spermidine/spermine
  synthesis, to adenine and 5-methylthioribose 1-phosphate. This is the entry step of the methionine salvage pathway
  and also recycles adenine. meu1 deletion abolishes MTAP activity, causes MTA accumulation, and raises ornithine
  decarboxylase activity and polyamine pools, because downstream salvage metabolites (notably 4-methylthio-2-oxobutanoate)
  feed back to repress ODC. MEU1 was first isolated as a multicopy enhancer of UAS2-dependent ADH2 expression. Meu1
  is a cytoplasmic/nuclear soluble protein that has also been recovered bound to its own mRNA.
