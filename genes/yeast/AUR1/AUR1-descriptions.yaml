descriptions:
- source: UniProt
  text: Catalytic component of the inositol phosphorylceramide synthase which catalyzes
    the addition of a phosphorylinositol group onto ceramide to form inositol phosphorylceramide,
    an essential step in sphingolipid biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36107
  source_id: P36107
- source: Alliance_Imported
  text: Phosphatidylinositol:ceramide phosphoinositol transferase; required for sphingolipid
    synthesis; can mutate to confer aureobasidin A resistance; also known as IPC synthase
  source_type: curated
  url: https://www.yeastgenome.org/locus/AUR1
  source_id: SGD:S000001487
- source: Alliance_Automated
  text: Enables inositol phosphoceramide synthase activity. Involved in inositol phosphoceramide
    metabolic process and sphingolipid biosynthetic process. Located in Golgi apparatus.
    Part of inositol phosphoceramide synthase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/AUR1
  source_id: SGD:S000001487
