taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Aur1 is the catalytic subunit of inositol phosphorylceramide (IPC) synthase in Saccharomyces
  cerevisiae, an essential multipass membrane enzyme of the medial Golgi that transfers the phosphoinositol
  head group from phosphatidylinositol to ceramide (mainly alpha-hydroxylated very-long-chain phytoceramide),
  producing IPC and diacylglycerol (EC 2.7.1.227). This is the first committed step in the synthesis of
  complex sphingolipids, and the active site faces the Golgi lumen. Aur1 functions in a complex with the
  essential regulatory subunit Kei1, which is needed for its activity and Golgi retention. Aur1 is the
  target of the antifungal cyclic peptide aureobasidin A (and of khafrefungin and rustmicin); loss of
  activity causes ceramide accumulation and cell death.'
