knowledge_gaps:
- gap_statement: How much Sgf29 binding to H3K4me3 contributes to SAGA occupancy at promoters, compared
    with activator-dependent recruitment, is unresolved.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Bian et al. report loss of SAGA from GAL1 and lower SAGA occupancy at promoters genome-wide
    without Sgf29, while Shukla et al. find that core SAGA subunits still reach the GAL1 UAS. The two
    studies measured different subunits and regions, so whether Sgf29 retains the whole complex or only
    its HAT module on H3K4me3 nucleosomes is not known. ChIP of HAT-module and core subunits in the same
    sgf29 and Tudor-mutant strains, at UAS and promoter-proximal nucleosomes, would separate the two.
  provenance:
  - reference_id: PMID:21685874
    supporting_text: We found that, indeed, scSgf29 deletion or mutations resulted in the loss of SAGA
      recruitment to GAL1
  - reference_id: PMID:22224423
    supporting_text: However, Sgf29p does not alter the recruitment of Spt20p that maintains the overall
      structural and functional integrity of SAGA.
