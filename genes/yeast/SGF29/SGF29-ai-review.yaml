  review:
    summary: Phylogenetic inference of SAGA membership from the SGF29 family node.
    action: ACCEPT
    reason: The PAINT node PTN000488952 is the SGF29 ancestor; its experimentally grounded descendants
      include Sgf29 itself, S. pombe Sgf29 and Drosophila Sgf29. Sgf29 is inside that clade and its own
      SAGA membership is shown experimentally, so the inherited claim holds. Sgf29 was identified as a
      SAGA subunit by multidimensional mass spectrometry and placed in the HAT module, which is present
      in all Gcn5 complexes, by combinatorial deletion proteomics (PMID:21734642). Core location. GO:0000124
      is a SAGA-type complex, which a reasoner classifies under GO:0000123 histone acetyltransferase complex
      and so under part_of chromatin; SAGA and its HAT module act on promoter nucleosomes, so that inherited
      location is reasonable.
