- term:
    id: GO:0006325
    label: chromatin organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0140002
  review:
    summary: Inferred from histone H3K4me3 reader activity through the GO link from chromatin-protein
      adaptor activity to chromatin organization.
    action: MODIFY
    reason: 'Correct but general. Sgf29''s reading of H3K4me3 serves histone acetylation by the HAT module:
      its Tudor domain is needed in vivo for normal H3K9, K14 and K18 acetylation and in vitro for the
      module''s preference for, and processive acetylation of, H3K4me3 nucleosomes. In GO, histone modifying
      activity is part of GO:0006338 chromatin remodeling, the more specific child of chromatin organization.
      As the adaptor that positions the HAT module on its substrate, Sgf29 does part of the work of that
      process.'
    proposed_replacement_terms:
    - id: GO:0006338
      label: chromatin remodeling
    supported_by:
    - reference_id: PMID:21685874
      supporting_text: We found that these mutants could not rescue H3K9, H3K14 and H3K18 global acetylation
    - reference_id: PMID:26401015
      supporting_text: We find that the SAGA HAT module preferentially acetylates H3K4me3 nucleosomes
        in a mixture containing excess unmodified nucleosomes and that this effect requires the Tudor
        domain of Sgf29.
- term:
