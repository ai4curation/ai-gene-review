      supporting_text: Consistently, transcription of GAL1 was severely reduced in all the Sgf29 deletion
        or Tudor domain deletion strains
    - reference_id: PMID:21734642
      supporting_text: its deletion rescued GAL4-VP16-mediated toxicity, while also being required for
