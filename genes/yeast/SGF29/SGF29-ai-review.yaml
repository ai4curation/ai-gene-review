- term:
    id: GO:0008104
    label: intracellular protein localization
  evidence_type: IMP
  original_reference_id: PMID:22224423
  qualifier: involved_in
  review:
    summary: sgf29 deletion weakens TBP recruitment to SAGA-regulated core promoters.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The mutant phenotype is real: without Sgf29, TBP occupancy at the GAL1 core promoter and
      other SAGA-regulated promoters falls and transcription drops, while Spt20, TAF10, TAF12 and Ubp8
      are still recruited to the UAS. But the mechanism is not known; Sgf29 has no TBP-binding activity
      of its own (TBP contacts in SAGA are made by Spt3, Spt8 and others), and the effect could follow
      from reduced H3 acetylation at the promoter. Generalising this downstream effect on another protein
      to intracellular protein localization overstates Sgf29''s role; the transcriptional consequence
      is captured by the transcription regulation rows.'
    supported_by:
    - reference_id: PMID:22224423
      supporting_text: the recruitment of TBP (TATA box binding protein that nucleates the assembly of
        general transcription factors to form the preinitiation complex for transcriptional initiation)
        to the core promoter of GAL1 is weakened in Δsgf29.
    - reference_id: PMID:25216679
      supporting_text: SAGA-TBP binding involves a network of interactions between subunits Spt3, Spt8,
        Spt20, and Spt7.
