  evidence_type: IDA
  original_reference_id: PMID:25216679
  qualifier: involved_in
  review:
    summary: Crosslinking-MS and genetic analysis of SAGA architecture and module function.
    action: ACCEPT
    reason: SAGA, whose HAT module includes Sgf29, is a coactivator of RNA polymerase II transcription.
      sgf29 deletion suppresses Gal4-VP16 toxicity and impairs Gal4-VP16-driven reporter expression like
      other ADA genes, and reduces transcription of SAGA-dependent genes such as GAL1. SAGA also represses
      some promoters, so the undirected regulation term is appropriate. Core process.
