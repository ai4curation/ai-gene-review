core_functions:
- description: 'Chromatin reader of the Gcn5 HAT module: the C-terminal tandem Tudor domain binds the
    histone H3 N-terminus with di- or trimethylated lysine 4, anchoring SAGA''s HAT module on H3K4me3
    promoter nucleosomes so that Gcn5 acetylates them preferentially and processively. Sgf29 is dispensable
    for HAT activity on peptides and for SAGA integrity.'
