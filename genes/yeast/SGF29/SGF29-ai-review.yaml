    action: ACCEPT
    reason: Bian et al. find that deleting SGF29 or its H3K4me-binding Tudor domains causes loss of SAGA
      at GAL1 (ChIP of Ada2) and lower SAGA occupancy at promoters genome-wide (ChIP of Spt8), and that
      the effect depends on Set1-dependent H3K4 methylation. Shukla et al. find that Spt20, TAF10, TAF12
      and Ubp8 still reach the GAL1 UAS without Sgf29, so activators can recruit SAGA independently of
      Sgf29. The two results are compatible if Sgf29 retains SAGA, or its HAT module, on H3K4me3 nucleosomes
      near promoters rather than providing the initial UAS recruitment; the term covers maintenance of
      the complex at a regulatory region. Reading H3K4me3 is the mechanism, so Sgf29 does the work of
      this localization. Core process; the relative contributions are recorded as a knowledge gap.
    supported_by:
    - reference_id: PMID:21685874
      supporting_text: We found that, indeed, scSgf29 deletion or mutations resulted in the loss of SAGA
        recruitment to GAL1
    - reference_id: PMID:21685874
      supporting_text: We also found that SAGA localization was decreased at promoters genome-wide when
        compared with WT strain, as determined by ChIP through the Spt8 subunit
    - reference_id: PMID:22224423
      supporting_text: However, Sgf29p does not alter the recruitment of Spt20p that maintains the overall
        structural and functional integrity of SAGA.
    - reference_id: file:yeast/SGF29/SGF29-deep-research-claude-code.md
      supporting_text: A reasonable reconciliation, which is my interpretation, is that activators (via
        Tra1) provide the primary recruitment of SAGA.
