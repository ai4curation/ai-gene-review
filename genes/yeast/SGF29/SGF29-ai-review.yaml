id: P25554
gene_symbol: SGF29
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Sgf29 (SAGA-associated factor 29, YCL010C) is a non-catalytic chromatin reader subunit of
  the histone acetyltransferase (HAT) module of budding yeast, which it forms with the acetyltransferase
  Gcn5 and the adaptor subunits Ada2 and Ada3. The module is shared by the SAGA coactivator, its variant
  SLIK/SALSA and the smaller ADA complex. Sgf29 has an N-terminal coiled-coil region and a C-terminal
  tandem Tudor domain whose two Tudor folds pack face to face; one pocket holds the free N-terminal alanine
  of histone H3 and the other the methylated lysine 4, so Sgf29 selectively binds H3K4me2 and H3K4me3,
  the marks enriched at active promoters. Sgf29 sits at the periphery of the HAT module and is not needed
  for the integrity of SAGA or for HAT activity on histone peptides, but its Tudor domain is needed in
  vivo for normal global acetylation of histone H3 at lysines 9, 14 and 18, and it lets the HAT module
  preferentially and processively acetylate H3K4me3 nucleosomes. Sgf29 is recruited with SAGA to the GAL1
  upstream activating sequence, and its loss reduces HAT-module occupancy, TBP recruitment and transcription
  at SAGA-dependent genes; sgf29 mutants show the classic Ada phenotypes. It also contributes to a heterochromatin
  boundary that limits the spread of silencing at HMR.
