        SAGA-mediated transcriptional activity
    - reference_id: PMID:25216679
      supporting_text: The conserved transcription coactivator SAGA is comprised of several modules that
        are involved in activator binding, TBP binding, histone acetylation (HAT) and deubiquitination
        (DUB).
