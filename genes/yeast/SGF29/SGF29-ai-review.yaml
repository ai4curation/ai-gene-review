  review:
    summary: Deleting SGF29 or its Tudor domains severely reduces GAL1 transcription.
    action: ACCEPT
    reason: Sgf29 deletion or Tudor-domain deletions cause H3K9 hypoacetylation across GAL1, loss of HAT-module
