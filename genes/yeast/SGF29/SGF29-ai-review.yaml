- term:
    id: GO:0140671
    label: ADA complex
  evidence_type: IMP
  original_reference_id: PMID:21734642
  qualifier: part_of
  review:
    summary: sgf29 and ahc2 deletion purifications define ADA composition.
    action: ACCEPT
    reason: Combinatorial depletion proteomics showed that the ADA complex contains Sgf29, as a HAT-module
      subunit, and the new subunit Ahc2; tagged Sgf29 co-precipitates Ada3, and ADA purified from an ahc2
      deletion keeps Gcn5, Ada2, Sgf29 and Ada3. Core location; the complex acetylates nucleosomal histones,
      so its inherited chromatin location is reasonable.
    supported_by:
    - reference_id: PMID:21734642
