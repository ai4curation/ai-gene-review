suggested_questions:
- question: Does the Rnr2-Rnr4 heterodimer stay intact through catalytic cycles in vivo, or can holo-Rnr2 act transiently
    without Rnr4 once the cofactor is assembled?
- question: Is nuclear Rnr2-Rnr4 merely stored, or does it contribute to dNTP synthesis near replication or repair
    sites?
suggested_experiments:
- hypothesis: Nuclear retention of Rnr2-Rnr4 limits dNTP synthesis outside S phase
  description: Compare dNTP pools and mutation rates in wtm1 and dif1 mutants versus strains forcing cytoplasmic
    Rnr2-Rnr4 (NES-tagged), synchronised through the cell cycle.
  experiment_type: genetics / dNTP measurement
