id: P09938
gene_symbol: RNR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: RNR2 (CRT6, YJL026W) encodes the radical-bearing small (R2, beta) subunit of the class Ia ribonucleotide
  reductase of Saccharomyces cerevisiae. Rnr2 binds the di-iron centre that generates and stores the tyrosyl radical
  required to initiate nucleotide reduction in the large subunit (Rnr1, or Rnr3 after DNA damage). In yeast the
  functional small subunit is an obligate 1:1 heterodimer of Rnr2 with the catalytically inactive paralog Rnr4,
  which lacks iron ligands but is needed for Rnr2 folding, cofactor assembly and docking with the large subunit;
  Rnr2 homodimers are essentially inactive. The holoenzyme reduces ADP, GDP, CDP and UDP to the deoxyribonucleoside
  diphosphates, the rate-limiting step of dNTP synthesis. RNR2 is essential. The Rnr2-Rnr4 heterodimer is held in
  the nucleus outside S phase by Wtm1 and imported by Dif1, and is released to the cytoplasm to join Rnr1 in S phase
  or after DNA damage under Mec1-Rad53-Dun1 checkpoint control; RNR2 transcription is also damage-inducible.
