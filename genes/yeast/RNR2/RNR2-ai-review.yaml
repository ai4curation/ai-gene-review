core_functions:
- description: Radical-bearing small (beta) subunit of class Ia ribonucleotide reductase. As the Rnr2-Rnr4 heterodimer
    it binds the di-iron centre that forms the tyrosyl radical used by Rnr1 (or Rnr3) to reduce NDPs to dNDPs; it
    is stored in the nucleus and exported to the cytoplasm in S phase or after DNA damage to assemble the active
    enzyme.
  contributes_to_molecular_function:
    id: GO:0004748
    label: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor
  directly_involved_in:
  - id: GO:0009263
    label: deoxyribonucleotide biosynthetic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0005971
    label: ribonucleoside-diphosphate reductase complex
  supported_by:
