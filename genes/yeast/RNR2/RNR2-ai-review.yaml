    summary: Soaking Y2Y4 crystals with Fe(II) produced density at both Fe1 and Fe2 sites of Rnr2 (not Rnr4). Ferrous
      iron assembles the diferric-tyrosyl radical cofactor, so this cofactor binding is intrinsic to Rnr2's catalytic
