gene_symbol: RNR2
organism: yeast
uniprot_id: P09938
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Provides the precursors necessary for DNA synthesis. Catalyzes the biosynthesis
    of deoxyribonucleotides from the corresponding ribonucleotides. RNR2 provides
    the diiron-tyrosyl radical center.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P09938
  source_id: P09938
- source: Alliance_Imported
  text: Ribonucleotide-diphosphate reductase (RNR), small subunit; the RNR complex
    catalyzes the rate-limiting step in dNTP synthesis and is regulated by DNA replication
    and DNA damage checkpoint pathways via localization of the small subunits; RNR2
    has a paralog, RNR4, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/RNR2
  source_id: SGD:S000003563
- source: Alliance_Automated
  text: Enables molecular adaptor activity; protein heterodimerization activity; and
    transition metal ion binding activity. Contributes to ribonucleoside-diphosphate
    reductase activity, thioredoxin disulfide as acceptor. Involved in deoxyribonucleotide
    biosynthetic process. Located in cytoplasm and nucleus. Part of ribonucleoside-diphosphate
    reductase complex. Human ortholog(s) of this gene implicated in autosomal dominant
    progressive external ophthalmoplegia with mitochondrial DNA deletions 5; mitochondrial
    DNA depletion syndrome 8a; pancreatic cancer; and sensorineural hearing loss.
    Orthologous to human RRM2B (ribonucleotide reductase regulatory TP53 inducible
    subunit M2B) and RRM2 (ribonucleotide reductase regulatory subunit M2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RNR2
  source_id: SGD:S000003563
