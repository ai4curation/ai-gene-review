- term:
    id: GO:0030437
    label: ascospore formation
  evidence_type: IMP
  original_reference_id: PMID:7969036
  qualifier: involved_in
  review:
    summary: Coe et al. deleted the intergenic promoter shared by SPS18 and SPS19, abolishing expression
      of both genes; the four-fold sporulation defect (spore wall maturation) cannot be assigned to SPS19.
      Later work showed that SPS19 itself is dispensable for sporulation on acetate and needed only when
      petroselinate is the carbon source, i.e. for fatty acid utilisation rather than spore formation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mutation removed expression of both SPS18 and SPS19; an sps19-specific deletion sporulates
      normally on acetate, so ascospore formation is not a function of Sps19p.
    supported_by:
    - reference_id: PMID:7969036
      supporting_text: |-
        A null mutation
        deleting the intergenic promoter prevented expression of both genes, and when
        homozygous in diploids, reduced the extent of sporulation four-fold
    - reference_id: PMID:9268358
      supporting_text: |-
        SPS19 is dispensable for growth and
        sporulation on solid acetate and oleate media, but is essential for these
        processes to occur on petroselineate.
