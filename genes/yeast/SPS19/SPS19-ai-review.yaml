description: 'SPS19 encodes the peroxisomal 2,4-dienoyl-CoA reductase of S. cerevisiae (NADPH-dependent,
  (3E)-enoyl-CoA-producing; EC 1.3.1.124), a short-chain dehydrogenase/reductase family homodimer imported
  into the peroxisomal matrix via a C-terminal SKL PTS1. It is an auxiliary enzyme of peroxisomal fatty
  acid beta-oxidation required to degrade unsaturated fatty acids with double bonds at even-numbered positions:
  it reduces 2,4-dienoyl-CoA intermediates with NADPH to 3-enoyl-CoA, which the delta3-delta2-enoyl-CoA
  isomerase Eci1p then returns to the core beta-oxidation spiral. sps19 deletion mutants grow normally
  on oleate (cis-9) but cannot use petroselinate (cis-6). SPS19 is strongly induced by oleate through
  an oleate response element shared with the divergently transcribed sporulation gene SPS18, and is also
  weakly induced late in sporulation, but it is dispensable for sporulation on acetate.'
