suggested_questions:
- question: Should GO provide an unsaturated-fatty-acid beta-oxidation process term (cf. MetaCyc 'oleate
    beta-oxidation' / even-position double-bond degradation), so that auxiliary enzymes such as Sps19p
    and Eci1p can be annotated more specifically than 'fatty acid catabolic process'?
suggested_experiments:
- description: Test sporulation of an sps19 single deletion (with SPS18 intact) and of an sps18 single
    deletion to assign the spore-wall maturation defect of the shared-promoter deletion to the correct
    gene.
