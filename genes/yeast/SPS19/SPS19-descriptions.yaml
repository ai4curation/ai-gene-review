descriptions:
- source: UniProt
  text: Auxiliary enzyme of beta-oxidation. Participates in the degradation of unsaturated
    fatty enoyl-CoA esters having double bonds in both even- and odd-numbered positions
    in peroxisome. Catalyzes the NADP-dependent reduction of 2,4-dienoyl-CoA to yield
    trans-3-enoyl-CoA. Dispensable for growth and sporulation on solid acetate and
    oleate media, but is essential for these processes to occur on petroselineate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32573
