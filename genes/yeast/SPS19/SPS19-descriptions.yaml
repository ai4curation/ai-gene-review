gene_symbol: SPS19
organism: yeast
uniprot_id: P32573
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Auxiliary enzyme of beta-oxidation. Participates in the degradation of unsaturated
    fatty enoyl-CoA esters having double bonds in both even- and odd-numbered positions
    in peroxisome. Catalyzes the NADP-dependent reduction of 2,4-dienoyl-CoA to yield
    trans-3-enoyl-CoA. Dispensable for growth and sporulation on solid acetate and
    oleate media, but is essential for these processes to occur on petroselineate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32573
  source_id: P32573
- source: Alliance_Imported
  text: Peroxisomal 2,4-dienoyl-CoA reductase; auxiliary enzyme of fatty acid beta-oxidation;
    homodimeric enzyme required for growth and sporulation on petroselineate medium;
    expression induced during late sporulation and in the presence of oleate
  source_type: curated
  url: https://www.yeastgenome.org/locus/SPS19
  source_id: SGD:S000005146
- source: Alliance_Automated
  text: Enables 2,4-dienoyl-CoA reductase (NADPH) activity. Involved in ascospore
    formation and fatty acid catabolic process. Located in peroxisomal matrix. Orthologous
    to human DECR2 (2,4-dienoyl-CoA reductase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SPS19
  source_id: SGD:S000005146
