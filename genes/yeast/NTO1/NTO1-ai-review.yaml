  title: Deep research report for NTO1 (claude_code provider)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Used as a literature map. Its structural claims were checked against the cached full
      text of PMID:41318527 and its Nto1 PHD-finger claims against PMID:33010166; both hold. Its five-subunit
      composition excerpt is unattributed (the report says so), and it could not retrieve the N354A mutant
