gene_symbol: NTO1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Nto1 (NuA three ORF 1, YPR031W) is a non-catalytic scaffold subunit of NuA3, the MYST-family
  histone H3 acetyltransferase complex of budding yeast whose catalytic subunit is Sas3. It is the yeast
  counterpart of the metazoan BRPF and JADE scaffolds and has an N-terminal EPL1 (Enhancer of Polycomb-like)
  domain, a central PZP module (two PHD fingers joined by a zinc knuckle, binding five zinc ions) and
  a long C-terminal helix. In the cryo-EM structure of NuA3, Nto1 and the N-terminal region of Sas3 form
  the core of the complex; the Nto1 PZP module and Sas3 together build the cleft that binds the histone
  H3 tail, with Nto1 residues contacting H3 residues 9 to 15 and helping to select lysine 14 for acetylation,
  and the Nto1 C-terminal helix forms a helical bundle with Yng1, Eaf6 and Sas3. A point mutation in the
  Nto1 tail-binding loop (N354A) partly reduces NuA3 activity, and loss of Nto1 lowers Sas3 and Yng1 protein
  levels. A PHD finger of Nto1 binds histone H3 trimethylated at lysine 36 weakly in vitro, but in cells
  H3K36me3 binding of NuA3 depends mainly on the PWWP subunit Pdp3. Nto1 is present in both forms of the
  complex, NuA3a (targeted to H3K4me3 by Yng1) and NuA3b (targeted to H3K36me3 by Pdp3), which acetylate
  H3K14 on nucleosomes at actively transcribed genes and tune the induction of genes repressed by the
  Rpd3 deacetylases. A genome-wide GFP survey places Nto1 in the nucleus and cytoplasm; its known function
  is nuclear.
