core_functions:
- description: Non-catalytic scaffold of NuA3. With the N-terminal region of Sas3, Nto1 forms the core
    of the complex, and its PZP module builds one side of the cleft that binds the histone H3 tail and
    positions lysine 14 for acetylation by Sas3; its C-terminal helix anchors Yng1 and Eaf6. Nto1 thereby
    contributes to the H3K14 acetyltransferase activity of both NuA3a and NuA3b on nucleosomes at transcribed
    genes.
  molecular_function:
    id: GO:0042393
    label: histone binding
  contributes_to_molecular_function:
    id: GO:0036408
    label: histone H3K14 acetyltransferase activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0033100
    label: NuA3 histone acetyltransferase complex
  supported_by:
  - *id009
  - *id005
  - *id006
  - reference_id: PMID:41318527
    supporting_text: Two N-terminal α-helices of Yng1, a long C-terminal helix (residues 550-603) of Nto1,
      and Eaf6 assemble in a helical bundle, positioned on one side of the NuA3 core.
suggested_questions:
- question: Does a Nto1 PHD-finger mutation that spares the tail-binding cleft (outside residues 298-299
    and 349-367) still affect NuA3 targeting or H3K14 acetylation?
suggested_experiments:
- description: Compare H3K14 acetylation and NuA3 occupancy in nto1 cleft mutants (N354A, Y357A) and in
    PHD1 methyl-pocket mutants, in PDP3 and pdp3 deletion backgrounds, by ChIP-seq.
knowledge_gaps:
- gap_statement: It is not known whether the Nto1 PHD fingers read a histone methyl mark in vivo or act
    only in binding the unmodified H3 substrate in the catalytic cleft.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: A Nto1 PHD finger binds H3K36me3 weakly in vitro, but NuA3 H3K36me3 binding in cells depends
    on Pdp3. The same PZP region contacts unmodified H3 residues 9 to 15 in the substrate cleft, so the
    transcription defects of the PHD1 mutant (Q264T/A265Y) could reflect loss of substrate engagement
    rather than of mark reading. Separating the two would say whether Nto1 is a reader or only a cleft-forming
    scaffold.
  provenance:
  - *id014
  - *id005
  - reference_id: PMID:33010166
    supporting_text: Both the Yng1 N-terminal region and the Nto1 PHD finger likely mediate non-specific
      interactions between NuA3 HAT and chromatin as they recognize unmodified histones.
