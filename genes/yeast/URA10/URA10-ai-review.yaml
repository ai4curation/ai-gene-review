id: P30402
gene_symbol: URA10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: URA10 encodes the minor orotate phosphoribosyltransferase (OPRTase, EC 2.4.2.10) of Saccharomyces
  cerevisiae, a paralogue of URA5 (>75% similar) in the PyrE subfamily of type I phosphoribosyltransferases.
  It converts orotate and PRPP to orotidine 5'-monophosphate (OMP) and diphosphate in de novo UMP biosynthesis,
  but contributes only about 20% of total cellular OPRTase activity and is a low-abundance protein. Ura10
  activity explains the leaky phenotype of ura5 mutants; loss of both paralogues causes uracil auxotrophy.
  In contrast to URA5, URA10 transcription is induced by dihydroorotate through the Ppr1 activator, together
  with URA1, URA3 and URA4. Ura10 is a soluble cytoplasmic enzyme.
