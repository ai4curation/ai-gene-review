gene_symbol: URA10
organism: yeast
uniprot_id: P30402
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the transfer of a ribosyl phosphate group from 5- phosphoribose
    1-diphosphate to orotate, leading to the formation of orotidine monophosphate
    (OMP).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P30402
  source_id: P30402
- source: Alliance_Imported
  text: Minor orotate phosphoribosyltransferase (OPRTase) isozyme; catalyzes the fifth
    enzymatic step in the de novo biosynthesis of pyrimidines, converting orotate
    into orotidine-5'-phosphate; URA10 has a paralog, URA5, that arose from the whole
    genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/URA10
  source_id: SGD:S000004884
- source: Alliance_Automated
  text: Enables orotate phosphoribosyltransferase activity. Involved in 'de novo'
    pyrimidine nucleobase biosynthetic process and pyrimidine ribonucleoside biosynthetic
    process. Located in cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/URA10
  source_id: SGD:S000004884
