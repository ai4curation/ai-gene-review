gene_symbol: POF1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'POF1 (YCL047C; promoter of filamentation 1) is an NMN-specific nicotinamide mononucleotide

  adenylyltransferase (NMNAT, EC 2.7.7.1) of Saccharomyces cerevisiae, the founding member of a fungal

  Pof1-type NMNAT subfamily with little overall similarity to the canonical NMNATs Nma1 and Nma2 but with

  their two ATP-recognition motifs. Recombinant Pof1 converts NMN and ATP to NAD+ (Km for NMN about

  2.3 mM, alkaline pH optimum) and, unlike Nma1/Nma2, does not appear to use nicotinic acid mononucleotide.

  POF1 contributes to NAD+ synthesis in the nicotinamide riboside (NR) salvage route (NR -> NMN -> NAD+):

  pof1 deletion lowers NAD+, causes NR release, impairs NR utilisation and NR-induced lifespan extension,

  and Pof1 is essential for growth on NR when NMA1 and NMA2 are absent. Pof1-GFP is found in the cytoplasm

  and nucleus. POF1 was first identified as a high-copy suppressor of the kss1 filamentation defect and

  has been reported to have weak ATPase activity and to associate with the E2 enzyme Ubc7.'
