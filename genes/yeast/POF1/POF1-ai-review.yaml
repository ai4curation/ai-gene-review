  review:
    summary: pof1 cells are sensitive to DTT, tunicamycin, heat and peroxides; overexpression suppresses
      pct1 heat sensitivity. No ERAD substrate turnover was measured, and the pleiotropic stress sensitivities
      are also explained by the lowered NAD+ of pof1 mutants. Involvement in the ERAD quality control
      pathway is not established.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
