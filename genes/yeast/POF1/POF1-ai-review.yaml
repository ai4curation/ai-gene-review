      supporting_text: According to the results, Δpof1 cells showed increased sensitivity to hydrogen
        peroxide, tert-butyl hydroperoxide, heat shock and protein unfolding agents, such as dithiothreitol
        and tunicamycin.
    - reference_id: PMID:24759102
      supporting_text: Deletion of POF1 significantly lowers NAD(+) levels and decreases the efficiency
        of NR utilization, resistance to oxidative stress, and NR-induced life span extension.
