- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000778915
  - SGD:S000000552
  review:
    summary: PAINT ATP hydrolysis activity for the Pof1 node, seeded solely by POF1's own IDA (PMID:22204397).
      The measured activity was very low (5 nmol Pi per hour per uM enzyme) and was reported before Pof1
      was shown to be an NMNAT; NMNATs cleave ATP during adenylyl transfer, so slow ATP turnover in the
      absence of NMN does not establish a separate ATPase function.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:22204397
      supporting_text: Besides, Pof1p presented an ATPase-specific activity of 5 nmol of released phosphate
        per hour per μM enzyme (Figure 5A).
    - reference_id: PMID:24759102
      supporting_text: Unlike other yeast NMNATs, Pof1 exhibits NMN-specific adenylyltransferase activity.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: SGD:S000000552
        source_label: POF1 (S. cerevisiae), IDA PMID:22204397
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Sole seed is the target itself; the underlying in vitro ATPase rate is very low and predates
          identification of Pof1 as an ATP-consuming NMNAT.
