gene_symbol: POF1
organism: yeast
uniprot_id: P25576
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the formation of NAD(+) from nicotinamide mononucleotide (NMN) and
    ATP. Involved in the salvage pathway for NAD(+) biosynthesis via NMN (PubMed:24759102).
    Involved in the filamentation pathway. Suppresses the filamentation defect of
    a KSS1 deletion (PubMed:21460040).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25576
  source_id: P25576
- source: Alliance_Imported
  text: Nicotinamide mononucleotide-specific adenylyltransferase (NMNAT); catalyzes
    the conversion of nicotinamide mononucleotide (NMN) to nicotinamide adenine dinucleotide
    (NAD+); role in the nicotinamide riboside (NR) salvage pathway of NAD+ biosynthesis;
    involved in NR and NAD+ homeostasis; ATPase involved in protein quality control
    and filamentation pathways; interacts physically with Kss1p and suppresses the
    filamentation defect of a kss1 deletion
  source_type: curated
  url: https://www.yeastgenome.org/locus/POF1
  source_id: SGD:S000000552
- source: Alliance_Automated
  text: Enables ATP hydrolysis activity and nicotinamide-nucleotide adenylyltransferase
    activity. Involved in several processes, including NAD+ biosynthetic process via
    the salvage pathway; invasive growth in response to glucose limitation; and pseudohyphal
    growth. Located in cytoplasm and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/POF1
  source_id: SGD:S000000552
