descriptions:
- source: UniProt
  text: Catalyzes the formation of NAD(+) from nicotinamide mononucleotide (NMN) and
    ATP. Involved in the salvage pathway for NAD(+) biosynthesis via NMN (PubMed:24759102).
    Involved in the filamentation pathway. Suppresses the filamentation defect of
    a KSS1 deletion (PubMed:21460040).
