gene_symbol: RNR1
organism: yeast
uniprot_id: P21524
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Provides the precursors necessary for DNA synthesis. Catalyzes the biosynthesis
    of deoxyribonucleotides from the corresponding ribonucleotides.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P21524
  source_id: P21524
- source: Alliance_Imported
  text: Major isoform of large subunit of ribonucleotide-diphosphate reductase; the
    RNR complex catalyzes rate-limiting step in dNTP synthesis, regulated by DNA replication
    and DNA damage checkpoint pathways via localization of small subunits; relative
    distribution to the nucleus increases upon DNA replication stress; RNR1 has a
    paralog, RNR3, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/RNR1
  source_id: SGD:S000000872
- source: Alliance_Automated
  text: Enables identical protein binding activity and nucleotide binding activity.
    Contributes to ribonucleoside-diphosphate reductase activity, thioredoxin disulfide
    as acceptor. Involved in deoxyribonucleotide biosynthetic process. Located in
    cytoplasm. Part of ribonucleoside-diphosphate reductase complex. Human ortholog(s)
    of this gene implicated in autosomal recessive progressive external ophthalmoplegia
    with mitochondrial DNA deletions 6. Orthologous to human RRM1 (ribonucleotide
    reductase catalytic subunit M1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RNR1
  source_id: SGD:S000000872
