findings:
- category: discrepancy
  text: SGD says the nuclear share of Rnr1 rises under replication stress; the review
    marks the HDA nucleus annotation as over-annotated and states Rnr1 stays cytoplasmic
    while the small subunits relocate.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All agree on the ribonucleotide reductase large subunit. They differ
    only on the Rnr1 nuclear pool.
