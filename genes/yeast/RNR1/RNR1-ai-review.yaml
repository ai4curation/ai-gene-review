core_functions:
- description: 'Catalytic large subunit of class Ia ribonucleotide reductase: thioredoxin-dependent reduction
    of ADP/GDP/CDP/UDP to dNDPs, with allosteric specificity and activity sites that balance dNTP pools;
    rate-limiting step of de novo dNTP synthesis for DNA replication and repair.'
