      binding sites for allosteric effectors.
  - reference_id: PMID:10535923
    supporting_text: RNR1 contains the active site for reduction and the binding sites for the nucleotide
      allosteric effectors.
  - reference_id: PMID:12732713
    supporting_text: During the normal cell cycle, Rnr1 and Rnr3 are predominantly localized to the cytoplasm
suggested_questions:
- question: How are dNTPs produced by cytoplasmic Rnr1-containing RNR delivered to mitochondria for mtDNA
    replication, given that RNR1 overexpression rescues mip1 mutants?
suggested_experiments:
- hypothesis: In vivo alpha6 hexamer formation by Rnr1 tracks dATP levels and limits activity
  description: Use in-cell crosslinking or FRET between Rnr1 monomers in wild-type, sml1 and dATP-feedback-insensitive
    (activity-site) mutants, correlating oligomer state with dNTP pools across the cell cycle.
  experiment_type: in vivo biophysics / metabolomics
