id: P21524
gene_symbol: RNR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: RNR1 encodes the major large (alpha, R1) subunit of class Ia ribonucleotide reductase, which
  reduces ADP, GDP, CDP and UDP to the corresponding 2'-deoxyribonucleoside diphosphates, the rate-limiting
  and committed step of de novo dNTP synthesis for nuclear and mitochondrial DNA replication and repair.
  Rnr1 carries the catalytic site (redox-active cysteine pair and a C-terminal CXXC motif that regenerates
  the neighbouring monomer's active site in trans), the specificity site that binds ATP/dATP/dGTP/dTTP
  to select the substrate, and the ATP-cone activity site at which ATP activates and dATP inhibits the
  enzyme by promoting alpha6 hexamers. It acts as an alpha2 homodimer (or Rnr1-Rnr3 heterodimer after
  DNA damage) with the Rnr2-Rnr4 beta-beta' heterodimer that holds the diferric tyrosyl radical; reduced
  thioredoxin re-reduces the enzyme. RNR1 is essential, cell-cycle (G1/S) and DNA-damage induced, and
  the intrinsically disordered inhibitor Sml1 binds Rnr1 to restrain activity. Rnr1 is cytoplasmic, whereas
  the small subunits are nuclear until S phase or checkpoint activation releases them.
