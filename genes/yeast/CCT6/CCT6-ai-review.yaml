    reference_section_type: ABSTRACT
suggested_questions:
- question: Which physiological effects of CCT6 overexpression are caused by unassembled
    Cct6p versus altered flux through assembled TRiC/CCT?
suggested_experiments:
- hypothesis: Unassembled Cct6p suppresses selected conditional phenotypes by sequestering
    or buffering client proteins independently of increasing assembled TRiC/CCT.
  description: Measure assembled TRiC/CCT, free Cct6p, and candidate client interactions
    across CCT6 overexpression and ATP-motif mutant backgrounds that differ in suppression
    but retain viability.
  experiment_type: native complex profiling with affinity purification and genetic
    suppression assays
