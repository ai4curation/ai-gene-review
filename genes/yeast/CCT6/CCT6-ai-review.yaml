id: P39079
gene_symbol: CCT6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CCT6 encodes the zeta subunit of the cytosolic group II chaperonin TRiC/CCT.
  Cct6 contributes to the ATP-driven chaperonin chamber that folds actin, tubulin,
  and other cytosolic clients, and yeast genetics also shows that excess unassembled
  Cct6 can suppress diverse conditional phenotypes in an ATP-motif-dependent state.
