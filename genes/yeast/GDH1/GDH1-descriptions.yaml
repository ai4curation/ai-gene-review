gene_symbol: GDH1
organism: yeast
uniprot_id: P07262
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the incorporation of an ammonium ion into alpha- ketoglutarate to
    form L-glutamate, the major route of assimilation of ammonia into an organic form
    in yeast.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07262
  source_id: P07262
- source: Alliance_Imported
  text: NADP(+)-dependent glutamate dehydrogenase; synthesizes glutamate from ammonia
    and alpha-ketoglutarate; rate of alpha-ketoglutarate utilization differs from
    Gdh3p; expression regulated by nitrogen and carbon sources; GDH1 has a paralog,
    GDH3, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GDH1
  source_id: SGD:S000005902
- source: Alliance_Automated
  text: Enables L-glutamate dehydrogenase (NADP+) activity. Involved in L-glutamate
    biosynthetic process. Located in nucleus. Human ortholog(s) of this gene implicated
    in familial hyperinsulinemic hypoglycemia 6; hyperinsulinism; and hypoglycemia.
    Orthologous to human GLUD1 (glutamate dehydrogenase 1) and GLUD2 (glutamate dehydrogenase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GDH1
  source_id: SGD:S000005902
