  label: Saccharomyces cerevisiae S288C
description: NADP+-specific glutamate dehydrogenase 1 (EC 1.4.1.4) of Saccharomyces cerevisiae, a cytosolic
  homohexamer of the Glu/Leu/Phe/Val dehydrogenase family. GDH1 catalyses the NADPH-dependent reductive
  amination of 2-oxoglutarate with ammonium to L-glutamate, the principal route by which ammonium is assimilated
  into organic nitrogen during growth on fermentable carbon sources. It is one of three routes to glutamate,
  together with its whole-genome-duplication paralog GDH3 (which has distinct allosteric properties and
  is favoured under respiratory conditions) and the glutamine synthetase/glutamate synthase (GLN1/GLT1)
  cycle; loss of all three routes causes strict glutamate auxotrophy. The catabolic direction is carried
  out by the NAD+-dependent enzyme GDH2.
