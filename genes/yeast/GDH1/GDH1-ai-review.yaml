  review:
    summary: A 1976 study partially purified an NADP-GDH activity from yeast nuclear fractions with properties
      somewhat different from the cytoplasmic enzyme. The paper predates the identification of GDH3, so
      the nuclear activity cannot be confidently attributed to GDH1; nuclear fractions of that era were
      also prone to cytosolic contamination. Curator-assigned experimental annotation; abstract-only in
      cache.
    action: KEEP_AS_NON_CORE
    reason: Possible minor nuclear pool; not the site of the enzyme's metabolic function.
    supported_by:
