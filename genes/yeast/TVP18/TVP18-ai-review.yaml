    summary: >-
      PTN001779219 places vesicle-mediated transport on the opisthokont
      TVP18/flower ancestor using both Drosophila flower and S. cerevisiae
      TVP18 as experimentally characterized seeds.
    action: ACCEPT
    reason: >-
      Accept as a broad core biological-process annotation. The PAINT row is an
      ancestral-node assertion, not a pairwise transfer from Drosophila; the
      target's own SGD experimental annotation is one of the seeds supporting
