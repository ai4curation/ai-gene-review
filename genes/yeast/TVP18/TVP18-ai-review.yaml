- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      SGD root molecular_function ND placeholder; a specific yeast TVP18
      molecular activity has not been demonstrated.
    action: ACCEPT
    reason: >-
      No literature on this gene product, in this species, identifies a function in this
      aspect, so the ND follows the evidence-code guideline and is accepted
      (projects/NO_DATA.md). Inferred rows in the same aspect do not make it stale.
      Earlier action KEEP_AS_NON_CORE, because: Keep as a non-core placeholder. TVP18 is
      experimentally implicated as a Golgi/endosomal membrane protein in
      vesicle-mediated transport, but the yeast literature supports localization,
      genetic interaction, and physical association with TVP15/YIP4 rather than a
      defined catalytic, channel, or binding activity. The family-level Drosophila
      calcium-channel annotation in PTHR13314 is not enough to assert calcium channel
      activity for yeast TVP18 because the newer GO:0005262 IBD is placed at the broad
      opisthokont PTN001779219 node from Drosophila fwe alone, while the fungal
      PTN001779222 node carries only Golgi membrane and the matching calcium-import
      process is confined to a metazoan node.
