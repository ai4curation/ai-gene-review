id: Q04767
gene_symbol: TVP18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  TVP18 encodes a conserved, small multi-pass membrane protein of the
  TVP18/calcium-channel-flower family that resides in Tlg2-containing
  Golgi/endosomal membranes in Saccharomyces cerevisiae. Physical interaction
  data implicate TVP18, together with TVP15 and Yip1-family membrane proteins,
  in normal vesicle-mediated trafficking through late Golgi/endosomal
  compartments, but the specific molecular activity executed by yeast TVP18 has
  not been determined.
