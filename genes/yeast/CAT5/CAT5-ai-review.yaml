suggested_questions:
- question: Does yeast Coq7p use NADH directly as reductant on a quinone substrate (as shown for human COQ7), or
    does it act on the quinol form with another electron donor?
- question: Which kinase(s) phosphorylate Coq7p, and how is the Ptc7p-dependent dephosphorylation coordinated with
    the switch to respiratory growth?
suggested_experiments:
- hypothesis: Yeast Coq7p is an NADH-dependent DMQ6 (quinone) hydroxylase
  description: Purify recombinant yeast Coq7p (e.g. in detergent or nanodisc), reconstitute iron, and measure DMQ6
    -> demethyl-Q6 conversion with NADH vs NADPH vs reduced DMQ6H2 alone, with O2 consumption and 18O incorporation.
  experiment_type: in vitro enzymology
