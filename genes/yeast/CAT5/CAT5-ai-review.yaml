core_functions:
- description: 'Di-iron demethoxyubiquinone (DMQ6) hydroxylase: hydroxylates C6 of 2-hexaprenyl-3-methyl-6-methoxy-1,4-benzoquinol,
    the penultimate step of coenzyme Q6 biosynthesis. It acts as a peripheral protein on the matrix face of the
    inner mitochondrial membrane within the CoQ synthome, and Ptc7p-mediated dephosphorylation activates it.'
