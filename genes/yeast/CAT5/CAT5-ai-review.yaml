gene_symbol: CAT5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'CAT5 (also COQ7; the yeast homologue of C. elegans clk-1) encodes the mitochondrial demethoxyubiquinone
  hydroxylase, a di-iron carboxylate enzyme. It hydroxylates the late intermediate demethoxy-Q6 (DMQ6, as the quinol)
  at C6, the penultimate step of coenzyme Q6 biosynthesis; Coq3p then O-methylates the resulting hydroxyl to complete
  CoQ6. Coq7p is a peripheral, interfacial membrane protein on the matrix face of the inner mitochondrial membrane.
  It is part of the multi-subunit CoQ biosynthetic complex (CoQ synthome) together with Coq3-Coq6 and Coq9, and
  also has a structural role, stabilising Coq3p and Coq4p. Its activity is a regulatory control point: phosphorylation
  inhibits it, while dephosphorylation by the mitochondrial phosphatase Ptc7p activates it and raises CoQ6 levels,
  and the Q6/DMQ6 ratio changes with growth phase and oxidative stress. Null mutants lack CoQ6 and are respiratory-deficient.
  Certain point mutants accumulate DMQ6, as do null mutants supplied with exogenous Q6 or overexpressing Coq8p.
  The gluconeogenic gene activation defect that gave CAT5 its name is a secondary consequence of respiratory deficiency.'
