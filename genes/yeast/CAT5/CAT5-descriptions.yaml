gene_symbol: CAT5
organism: yeast
uniprot_id: P41735
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the hydroxylation of 2-hexaprenyl-3-methyl-6- methoxy-1,4-benzoquinol
    (DMQH2) during ubiquinone biosynthesis (PubMed:16624818, PubMed:23940037, PubMed:8621692,
    PubMed:9452453). Also catalyzes the hydroxylation of the 5-methoxy-2-methyl-3-(all-
    trans-polyprenyl)benzoquinone at the C6 position and participates in the biosynthesis
    of ubiquinone (By similarity). Also has a structural role in the COQ enzyme complex,
    stabilizing COQ3 and COQ4 polypeptides (PubMed:16624818).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41735
  source_id: P41735
- source: Alliance_Imported
  text: Protein required for ubiquinone (Coenzyme Q) biosynthesis; localizes to the
    matrix face of the mitochondrial inner membrane in a large complex with ubiquinone
    biosynthetic enzymes; required for gluconeogenic gene activation
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAT5
  source_id: SGD:S000005651
- source: Alliance_Automated
  text: Enables 3-demethoxyubiquinol 3-hydroxylase activity. Involved in ubiquinone
    biosynthetic process. Located in mitochondrial inner membrane. Used to study primary
    coenzyme Q10 deficiency 8. Human ortholog(s) of this gene implicated in autosomal
    recessive distal hereditary motor neuronopathy 9 and primary coenzyme Q10 deficiency
    8. Orthologous to human COQ7 (coenzyme Q7, hydroxylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAT5
  source_id: SGD:S000005651
