id: Q06568
gene_symbol: NDL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Ndl1 is the Saccharomyces cerevisiae member of the NudE/NUDEL family (homolog of Aspergillus
  NudE and animal NDE1/NDEL1), a small coiled-coil protein that acts in the dynein pathway positioning
  the mitotic spindle at the bud neck. Ndl1 binds the LIS1 homolog Pac1 through its coiled coil and the
  N-terminal region of the dynein intermediate chain, and increases the association of Pac1 with dynein.
  It is found transiently at the plus ends of cytoplasmic microtubules, where it co-localizes with Pac1
  and dynein in a Pac1-dependent manner, and it promotes the efficient plus-end targeting of Pac1 and
  hence of dynein, which is later off-loaded to cortical Num1 sites. Loss of Ndl1 reduces dynein at plus
  ends and the cortex roughly tenfold, causes mild spindle-positioning and nuclear-segregation defects
  that are exacerbated in combination with loss of the parallel Kar9 pathway, and is suppressed by Pac1
  overexpression, indicating an important but non-essential supporting role for Pac1 and dynein. Tagged
  Ndl1 has also been reported in the nucleus and, in a proteome-wide screen, at peroxisomes, without a
  known function there.
