- term:
    id: GO:0045505
    label: dynein intermediate chain binding
  evidence_type: IDA
  original_reference_id: PMID:37730751
  review:
    summary: Purified yeast dynein recruits Ndl1 via the N-terminal region of the intermediate chain (ICN);
      dynein lacking the ICN does not bind Ndl1.
    action: NEW
    reason: Direct in vitro binding with a deletion control; the ICN is the only contact point for Ndl1
      on yeast dynein. This is the conserved NudE-family dynein-binding mode (NDE1/NDEL1 bind dynein IC).
    supported_by:
    - reference_id: PMID:37730751
      supporting_text: Whereas WT dynein strongly recruited Ndl1 to microtubules, dynein∆ICN complexes
        did not, indicating the ICN is indeed a conserved hub for binding Ndl1/Ndel1 and p150/Nip100 in
        yeast and mammals
    - reference_id: PMID:37730751
      supporting_text: These data also indicate that the ICN is the only contact point on the yeast dynein
        complex for Ndl1.
