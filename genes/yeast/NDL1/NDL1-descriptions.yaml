gene_symbol: NDL1
organism: yeast
uniprot_id: Q06568
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for nuclear migration to the bud neck during cell division. Targets
    cytoplasmic dynein to microtubule plus ends thereby promoting dynein-mediated
    microtubule sliding along the bud cortex and consequently the movement of the
    mitotic spindle to the bud neck.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06568
  source_id: Q06568
- source: Alliance_Imported
  text: Homolog of nuclear distribution factor NudE; NUDEL; interacts with Pac1p and
    regulates dynein targeting to microtubule plus ends; localizes to cytosol, nucleus
    and peroxisomes
  source_type: curated
  url: https://www.yeastgenome.org/locus/NDL1
  source_id: SGD:S000004244
- source: Alliance_Automated
  text: Enables microtubule plus-end binding activity. Involved in nuclear migration
    along microtubule. Located in cytoplasmic microtubule; nucleus; and peroxisome.
  source_type: automated
  url: https://www.yeastgenome.org/locus/NDL1
  source_id: SGD:S000004244
