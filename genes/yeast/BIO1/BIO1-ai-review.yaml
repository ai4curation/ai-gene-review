  review:
    summary: IEA from InterPro IPR047128 (PhyH) to fatty acid alpha-oxidation. The mapping reflects the
      peroxisomal phytanoyl-CoA hydroxylase role of human PHYH; BIO1 is a neofunctionalized PhyH-family
      paralog whose only known role is in biotin synthesis, and there is no evidence that it acts in branched-chain
      fatty acid alpha-oxidation.
    action: REMOVE
