    summary: IEA from InterPro IPR047128 (PhyH) to phytanoyl-CoA dioxygenase activity. BIO1 does have
      the PhyH-type Fe(II)/2-oxoglutarate oxygenase domain, but phytanoyl-CoA is the substrate of the
      human peroxisomal enzyme and there is no evidence that BIO1 hydroxylates phytanoyl-CoA. The family-level
      parent 2-oxoglutarate-dependent dioxygenase activity captures what can be inferred.
    action: MODIFY
    reason: Substrate-specific family term over-states what is known; generalize to the 2-oxoglutarate-dependent
      dioxygenase parent.
