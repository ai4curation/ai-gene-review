gene_symbol: BIO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4932
  label: Saccharomyces cerevisiae
description: BIO1 encodes a biotin biosynthesis protein found in biotin-prototrophic Saccharomyces cerevisiae
  strains (e.g. A364a and sake/industrial strains) in a subtelomeric BIO1-BIO6 cluster; the S288C reference
  strain lacks a functional copy and is a biotin auxotroph. Expression of BIO1 together with BIO6 restores
  biotin prototrophy to S288C. BIO1 arose by duplication of YJR154W and belongs to the phytanoyl-CoA dioxygenase
  (PhyH) family of Fe(II)/2-oxoglutarate-dependent oxygenases. It is required for an early step that supplies
  the pimelate moiety upstream of 8-amino-7-oxononanoate (KAPA). Although named a 'putative pimeloyl-CoA
  synthetase' by analogy with Bacillus BioW, its catalytic reaction is unknown; Bio1-dependent biotin
  synthesis requires oxygen, consistent with an oxygenase rather than a CoA ligase.
