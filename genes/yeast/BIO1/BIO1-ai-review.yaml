suggested_questions:
- question: 'What reaction does Bio1 catalyse: oxidative cleavage of a longer-chain fatty acyl precursor
    to a pimeloyl thioester, or another oxygen-dependent step upstream of KAPA?'
- question: Is the product of Bio1 a pimeloyl-CoA, a pimeloyl-ACP or free pimelate, and which enzyme (Bio6?)
    condenses it with alanine?
suggested_experiments:
- description: Purify Bio1 (or the more active C. fabianii orthologue) and assay Fe(II)/2-oxoglutarate-
    and O2-dependent turnover of candidate acyl-CoA substrates by LC-MS, coupled with 13C-labelling of
    biotin in BIO1 BIO6 S288C strains.
