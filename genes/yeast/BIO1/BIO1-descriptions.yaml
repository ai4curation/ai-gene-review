descriptions:
- source: Alliance_Imported
  text: Putative pimeloyl-CoA synthetase involved in biotin biosynthesis; highly degraded
    pseudogenic paralog of YJR154W; functional copies present in S. cerevisiae strains
    YJM627 and A364a; functional pimeloyl-CoA synthetase (PCAS) genes are homologs
    of the bioW gene in Bacillus sp. and the bioC-bioH complex of E. coli
