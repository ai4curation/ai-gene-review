- source: Alliance_Imported
  text: Major of three pyruvate decarboxylase isozymes; key enzyme in alcoholic fermentation;
    decarboxylates pyruvate to acetaldehyde; involved in amino acid catabolism; subject
    to glucose-, ethanol-, and autoregulation; activated by phosphorylation in response
    to glucose levels; N-terminally propionylated in vivo; protein tyrosine nitration
    on Tyr157 or Tyr344 inhibits activity and impairs fermentation
