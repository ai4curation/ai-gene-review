  title: Substrate specificity of thiamine pyrophosphate-dependent 2-oxo-acid decarboxylases in Saccharomyces
    cerevisiae.
  findings:
  - statement: Individual Pdc1, Pdc5 and Pdc6 constructs catalyze pyruvate decarboxylation, whereas Aro10
      is not a pyruvate decarboxylase.
    supporting_text: only Pdc1, Pdc5, and Pdc6 catalyzed the decarboxylation of the linear-chain 2-oxo
      acids pyruvate, 2-oxo-butanoate, and 2-oxo-pentanoate in cell extracts
  - statement: The aromatic substrate phenylpyruvate distinguishes Pdc5 from Pdc1/Pdc6 under the tested
      conditions.
    supporting_text: Only Aro10 and Pdc5 catalyzed the decarboxylation of the aromatic substrate phenylpyruvate,
      with Aro10 showing superior kinetic properties.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Single-decarboxylase constructs in a quintuple-null yeast background
      establish pyruvate, linear, branched-chain and sulfur-containing substrate activities. Only Pdc5
      and Aro10 had measurable phenylpyruvate activity; indolepyruvate and 4-hydroxyphenylpyruvate were
      not in this panel.
