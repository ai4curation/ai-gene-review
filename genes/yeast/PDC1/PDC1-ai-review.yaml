id: P06169
gene_symbol: PDC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  PDC1 (YLR044C) encodes pyruvate decarboxylase isozyme 1 (EC 4.1.1.1), a homotetrameric thiamine
  diphosphate- and Mg2+-dependent enzyme. It decarboxylates pyruvate to acetaldehyde and CO2 in the
  cytosol. Pdc1p is the major isozyme under most conditions and provides most of the Pdc activity for
  alcoholic fermentation. It also supplies acetaldehyde for cytosolic acetyl-CoA synthesis. The enzyme
  is allosterically activated by pyruvate. It also decarboxylates other linear and branched-chain
  2-oxo acids. The branched-chain substrates come from valine and isoleucine transamination, so Pdc1p
  contributes, redundantly with Pdc5p, Pdc6p and Aro10p, to the Ehrlich pathway that produces fusel
  alcohols. As a side reaction it can carboligate aldehydes to acyloins such as acetoin. Loss of PDC1
  is compensated by strong induction of PDC5 (autoregulation). Under standard glucose-grown
  conditions, pdc1 pdc5 double mutants lack detectable Pdc activity and fail to ferment; activating
  PDC6 expression can partially restore fermentation. Pdc1p is cytosolic, with some reported nuclear
  enrichment. Pdc1p activity is modulated post-translationally: it is a phosphoenzyme whose
  growth-phase-dependent phosphorylation requires the phosphatase Sit4p and supports full activity,
  and nitration of Tyr157 or Tyr344 by reactive nitrogen species inhibits it and impairs fermentation.
