suggested_questions:
- question: Is the nuclear enrichment of Pdc1p/Pdc5p functionally linked to PDC1/PDC5 autoregulation,
    and does it require catalytic activity?
- question: Which expression, strain or assay conditions explain the difference between genetic phenylalanine
    catabolism attributed to Pdc1 and its lack of measurable phenylpyruvate decarboxylation in the single-enzyme
    substrate panel?
suggested_experiments:
- description: Assay purified Pdc1p with phenylpyruvate, 4-hydroxyphenylpyruvate and indole-3-pyruvate
    under substrate-activating conditions to settle its aromatic 2-oxo-acid activity.
