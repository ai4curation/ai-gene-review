      pyruvate decarboxylase carboligation, while the experimental work focuses on Bdh1/Ara1. Not an isozyme-specific
      Pdc kinetic experiment.
  findings:
  - statement: Pdc carboligation supplies acetoin to the optional butanediol branch.
    supporting_text: Acetoin can be formed from acetaldehyde and/or pyruvate through an anomalous reaction
      of pyruvate decarboxylase.
- id: PMID:1807827
  title: PDC6, a weakly expressed pyruvate decarboxylase gene from yeast, is activated when fused spontaneously
    under the control of the PDC1 promoter.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary spontaneous promoter-recombination study. The abstract directly establishes
      restoration of glucose fermentation by a PDC1-PDC6 fusion; partial complementation limits any claim
      of equivalence to native PDC1. This qualifies baseline pdc1 pdc5 phenotypes.
  findings:
  - statement: Activation of PDC6 by promoter recombination partially restores glucose fermentation in
      a pdc1 pdc5 background; baseline low expression does not imply lack of catalytic capacity.
    supporting_text: Spontaneous mutants, derived from such a pdc1 pdc5 strain, were isolated which could
      again ferment glucose.
- id: file:yeast/PDC1/PDC1-uniprot.txt
  title: UniProt entry P06169 (PDC1)
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Fetched curated record; enzyme and family evidence checked independently of protein
      names and electronic GO statements. The FUNCTION comment lists phenylpyruvate among the preferred
      substrates of Pdc1. This rests on multiple-mutant genetics (Dickinson et al. 2003); the isozyme-by-isozyme
      assays of Romagnoli et al. 2012 (PMID:22904058) detected phenylpyruvate decarboxylation only for
      Aro10 and Pdc5. The evidence conflicts, so the review leaves phenylpyruvate decarboxylase activity
      UNDECIDED for Pdc1; no source defect is recorded because the claim is contested rather than refuted.
  findings:
  - statement: PANTHER subfamily membership is recorded in the source; its official label was cross-checked
      against the local PANTHER ontology. Membership alone does not imply every substrate or cofactor
      property of other members.
    record_section: ["DR:PANTHER"]
    supporting_text: DR   PANTHER; PTHR43452:SF30; PYRUVATE DECARBOXYLASE ISOZYME 1-RELATED; 1.
- id: file:yeast/PDC1/PDC1-deep-research-sgd.md
  title: SGD gene description for PDC1 (yeast)
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Checked the major pyruvate decarboxylase isozyme identity, its role in alcoholic
      fermentation and amino acid catabolism, and glucose-, ethanol- and autoregulation (consistent with
      the review). Regulation by phosphorylation is supported by PMID:23692511 (abstract only), which shows
      that Pdc1 is a Sit4-dependent phosphoenzyme whose dephosphorylation lowers activity. Tyrosine nitration
      at Tyr157 or Tyr344 inhibiting activity and fermentation is supported by PMID:35304512. Both are now
      in the review description. N-terminal propionylation could not be verified; the cached
      propionylation paper (PMID:23043182) does not name Pdc1 in its text, so the claim is probably from
      its supplementary data. These post-translational modifications add no GO annotation.
- id: PMID:23692511
  title: Pyruvate decarboxylase activity is regulated by the Ser/Thr protein phosphatase Sit4p in the yeast Saccharomyces
    cerevisiae.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed title verified with esummary; abstract only. Pdc1 is a phosphoserine-containing
      enzyme whose phosphorylation depends on growth phase and Sit4; dephosphorylation halves activity.
  findings:
  - statement: Pdc1 is a phosphoenzyme and dephosphorylation reduces its activity.
    supporting_text: Dephosphorylation of Pdc1p by alkaline phosphatase inhibited activity by 50%.
- id: PMID:35304512
  title: Molecular mechanism of ethanol fermentation inhibition via protein tyrosine nitration of pyruvate decarboxylase
    by reactive nitrogen species in yeast.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed title verified with esummary; full text cached. Reactive nitrogen species nitrate
      Pdc1 at Tyr38, Tyr157 and Tyr344; nitration at Tyr157 or Tyr344 lowers activity, and Phe substitutions
      restore ethanol production.
  findings:
  - statement: Nitration of Pdc1 at Tyr157 or Tyr344 reduces its activity.
    supporting_text: The biochemical analysis using the recombinant purified Pdc1 enzyme indicated that
      PTN at Tyr157 or Tyr344 significantly reduced the Pdc1 activity.
- id: PMID:23043182
  title: Protein N-terminal acetyltransferases act as N-terminal propionyltransferases in vitro and in vivo.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: PubMed title verified with esummary. Candidate source for the SGD propionylation statement;
      Pdc1 is not named in the cached text, so the claim was not verified.
core_functions:
- description: Thiamine diphosphate/Mg2+-dependent non-oxidative decarboxylation of pyruvate to acetaldehyde
    and CO2 in the cytosol, the decarboxylation step of alcoholic fermentation. Pdc1p is the major isozyme
    under most conditions.
  molecular_function:
    id: GO:0004737
    label: pyruvate decarboxylase activity
  directly_involved_in:
