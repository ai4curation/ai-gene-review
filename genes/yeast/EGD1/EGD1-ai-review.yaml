id: Q02642
gene_symbol: EGD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: EGD1 encodes the beta-1 subunit of the yeast nascent polypeptide-associated
  complex (NAC). EGD1 pairs mainly with the alpha subunit EGD2 to form the abundant
  alpha-beta NAC heterodimer at the ribosomal exit tunnel. NAC contacts nascent polypeptides,
  prevents inappropriate interactions with cytosolic and ER targeting factors, supports
  early cotranslational folding/targeting decisions, and has additional non-core roles
  in selective autophagy phenotypes.
