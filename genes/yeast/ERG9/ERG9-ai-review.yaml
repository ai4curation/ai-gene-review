id: P29704
gene_symbol: ERG9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ERG9 (YHR190W) encodes squalene synthase (farnesyl-diphosphate farnesyltransferase, EC 2.5.1.21)
  of Saccharomyces cerevisiae, which catalyses the first committed step of sterol biosynthesis: head-to-head
  condensation of two molecules of farnesyl diphosphate (FPP) to presqualene diphosphate, followed by
  NAD(P)H-dependent reductive rearrangement to squalene. Erg9 thus sits at the branch point that partitions
  FPP between sterols and non-sterol isoprenoids (dolichol, ubiquinone, prenylated proteins). It is a
  member of the phytoene/squalene synthase family, requires Mg2+, and is anchored to the ER membrane by
  a hydrophobic C-terminal segment; the truncated soluble catalytic domain retains full two-step activity.
  The microsomal enzyme requires phospholipid for activity. Erg9 is enriched in plasma-membrane-associated
  ER and erg9 mutants are sterol auxotrophs.'
