suggested_questions:
- question: How is Erg9 activity/abundance regulated post-translationally (e.g. sterol-dependent degradation
    as for mammalian SQS) to balance FPP use between sterol and non-sterol isoprenoid branches in yeast?
suggested_experiments:
- description: Measure Erg9 protein turnover (cycloheximide chase) under ergosterol depletion and repletion,
    and in ERAD mutants (hrd1, doa10), to test for sterol-regulated degradation.
