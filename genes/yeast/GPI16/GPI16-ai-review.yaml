  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: No molecular activity has been demonstrated for Gpi16 itself; it is an essential non-catalytic
      subunit of the GPI transamidase.
    action: ACCEPT
    reason: Retain the ND root. Catalysis of the transamidation is attributed to the Gpi8/PIGK caspase-like
      subunit; Gpi16 is required for complex stability and for GPI attachment but no activity of its own
      has been shown. The PAINT node PTN000311103 propagates only the complex and the attachment process,
      not an activity, and human PIGT carries no contributes_to transamidase-activity annotation, so no
      MF is proposed here.
    supported_by:
    - &id008
      reference_id: PMID:35165458
      supporting_text: The PIGK subunit functions as the catalytic component
    - &id005
      reference_id: PMID:11598210
      supporting_text: Gpi8p and Gpi16p are unstable if either of them is removed by depletion
