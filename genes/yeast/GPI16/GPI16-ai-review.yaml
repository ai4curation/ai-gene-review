core_functions:
- description: 'Essential non-catalytic PIG-T subunit of the ER-membrane GPI-anchor transamidase. Its
    lumenal domain is required for stability of the catalytic Gpi8 subunit and of the assembled complex,
    which removes the C-terminal GPI-attachment signal of precursor proteins and attaches the preassembled
    GPI anchor. Experimentally established in S. cerevisiae: complex membership (affinity purification),
