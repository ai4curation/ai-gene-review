id: P38875
gene_symbol: GPI16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'GPI16 (YHR188C) encodes the PIG-T family subunit of the endoplasmic reticulum GPI-anchor
  transamidase (GPIT), the five-subunit membrane enzyme (Gpi8, Gaa1, Gpi16, Gpi17, Gab1) that cleaves
  the C-terminal GPI-attachment signal of newly translocated precursor proteins and replaces it with a
  preassembled glycosylphosphatidylinositol anchor. Gpi16 is an essential N-glycosylated type I membrane
  glycoprotein: its large lumenal domain (predicted beta-propeller) is followed by a single C-terminal
  transmembrane helix and a short cytosolic tail carrying an ER retrieval signal. It co-purifies with
  Gaa1 and Gpi8 in 430-650 kDa complexes; Gpi8 and Gpi16 are mutually required for stability, and depletion
  of Gpi16 causes accumulation of the complete GPI lipid and of unprocessed GPI-protein precursors. Gpi16
  is non-catalytic (catalysis is performed by the caspase-like Gpi8 subunit), and unlike its mammalian
  ortholog PIGT it does not appear to form an interchain disulfide bond with Gpi8.'
