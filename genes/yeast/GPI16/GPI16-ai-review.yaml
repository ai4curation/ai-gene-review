- term:
    id: GO:0006506
    label: GPI anchor biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00196
  review:
    summary: UniPathway mapping places Gpi16 in GPI anchor (glycolipid) biosynthesis, but the transamidase
      acts after the anchor lipid is complete, attaching it to protein.
    action: MODIFY
    reason: 'GO:0006506 covers formation of the GPI glycolipid itself. Depleting Gpi16 leaves the complete
      GPI lipid CP2 accumulated rather than blocking its synthesis, placing the subunit at the attachment
      step. GO:0016255 attachment of GPI anchor to protein is not a descendant of GO:0006506 (OLS: it
      sits under GO:0180046 GPI anchored protein biosynthesis), so this is a lateral correction to the
      step the gene performs; the gene already carries GO:0016255.'
