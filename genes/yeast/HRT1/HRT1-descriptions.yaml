- source: Alliance_Imported
  text: RING-H2 domain core subunit of multiple ubiquitin ligase complexes; subunit
    of Skp1-Cullin-F-box (SCF) that tethers the Cdc34p (E2) and Cdc53p (cullin) SCF
    subunits, and is required for degradation of Gic2p, Far1p, Sic1p and Cln2p; subunit
    of the Rtt101p-Mms1p-Mms22p ubiquitin ligase that stabilizes replication forks
    after DNA lesions; subunit of the Cul3p-Elc1p-Ela1p ubiquitin ligase involved
    in Rpb1p degradation as part of transcription-coupled repair
