- source: Alliance_Automated
  text: Enables protein-macromolecule adaptor activity. Contributes to ubiquitin-protein
    transferase activity. Involved in several processes, including G1/S transition
    of mitotic cell cycle; SCF-dependent proteasomal ubiquitin-dependent protein catabolic
    process; and silent mating-type cassette heterochromatin formation. Located in
    cytoplasm and nucleus. Part of Cul3-RING ubiquitin ligase complex; Cul8-RING ubiquitin
    ligase complex; and SCF ubiquitin ligase complex. Used to study cancer. Orthologous
    to human RBX1 (ring-box 1).
