  review:
    summary: Rbx1 promotes association of Cdc34 with Cdc53 and stimulates Cdc34 autoubiquitination in the context
      of Cdc53 or SCF, i.e. it bridges the E2 to the cullin scaffold; the curator rendered this as adaptor activity.
    action: MODIFY
    reason: 'An adaptor term undersells what the RING does. Hrt1 does not merely juxtapose Cdc34 and Cdc53: the
      Cdc53/Hrt1 module activates Cdc34 (NEM-insensitive, thioester-independent stimulation of chain assembly, PMID:10385629),
      and RING mutations abolish ligase activity without disturbing complex assembly (PMID:10230407), which is ubiquitin
      protein ligase activity (GO:0061630), already carried by the PAINT node. The E2-recruiting facet is ubiquitin
      conjugating enzyme binding (GO:0031624). Either is more informative than a generic macromolecule-adaptor term.'
