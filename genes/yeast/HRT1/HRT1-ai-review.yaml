core_functions:
- description: 'Catalytic RING subunit of cullin-RING ubiquitin ligases: Hrt1 binds the C-terminal domain of a cullin
    (Cdc53, Cul3 or Rtt101) and recruits and activates the ubiquitin-charged E2 Cdc34 (or Ubc4), so that ubiquitin
    is transferred directly from the E2 thioester onto a lysine of the substrate held by the cullin''s receptor
    module; the Cdc53/Hrt1 heterodimer is a minimal, thioester-independent ubiquitin ligase that builds K48-linked
    chains committing substrates to the proteasome.'
  molecular_function:
    id: GO:0061630
