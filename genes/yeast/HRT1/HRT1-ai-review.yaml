suggested_questions:
- question: Should the receptor-specific downstream outputs now annotated to the shared RING (GAL1 derepression,
    mitochondrial fusion, Sir4-dependent silencing, checkpoint recovery, methylmercury resistance, glucose-transport
    induction, nucleosome assembly) be modelled instead as SCF(F-box)/CRL3/CRL8 complex-level GO-CAM activities
    with the receptor as the specificity-conferring subunit, leaving Hrt1 with the ligase activity and the cullin-RING
    catabolic process?
- question: Hrt1 promotes Rub1 conjugation to Cdc53 and Rtt101 (Kamura 1999; Scott 2010), yet the yeast GOA carries
    no NEDD8 transferase / protein neddylation annotation for HRT1 although human RBX1 has both. Is this a deliberate
    curation gap, and should the rubylation activity be annotated from the yeast primary literature?
- question: The ~25 IPI 'protein binding' rows pairing Hrt1 with cullins, adaptors, F-box proteins and uncharacterised
    proteins from high-throughput screens carry no functional information; should they be re-curated as cullin family
    protein binding (GO:0097602) plus complex membership, or captured as has_input relations in GO-CAM?
suggested_experiments:
- hypothesis: Hrt1's ubiquitin-ligase and Rub1-ligase activities can be separated genetically, so that loss of cullin
    rubylation accounts for only part of the hrt1 null phenotype.
  description: Build hrt1 alleles that selectively impair Ubc12~Rub1 engagement versus Cdc34~Ub engagement (guided
    by the RBX1-UBC12-CUL1-DCN1 and RBX1-CDC34 structures), express them as the sole copy, and compare Cdc53/Rtt101
    rubylation, Sic1/Cln2/Rpb1 turnover and viability with rub1-delta and dcn1-delta controls.
  experiment_type: structure-guided separation-of-function alleles
- hypothesis: Hrt1 contributes to Rtt101(Mms1-Mms22) and Cul3(Elc1-Ela1) outputs in vivo, which has been presumed
    from its being the only cullin-binding RING but never tested directly.
  description: Use an auxin-inducible degron on Hrt1 to deplete it acutely in G2/M-arrested cells and measure MMS-induced
    Rpb1 polyubiquitylation and degradation, fork recovery after MMS, and H3 K56ac ubiquitylation, comparing with
    cul3-delta, rtt101-delta and cdc53-ts controls.
  experiment_type: conditional depletion with pathway-specific readouts
