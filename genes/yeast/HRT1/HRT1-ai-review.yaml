- term:
    id: GO:0019788
    label: NEDD8 transferase activity
  evidence_type: TAS
  original_reference_id: file:yeast/HRT1/HRT1-uniprot.txt
  qualifier: enables
  review:
    summary: 'Proposed NEW annotation. Hrt1 is the RING E3 for Rub1 (yeast NEDD8) conjugation to cullins: with the
      E2 Ubc12 and the co-E3 Dcn1 it promotes Rub1 attachment to Cdc53 (Lys760) and Rtt101, the modification that
      activates cullin-RING ligases and opposes Lag2 sequestration.'
    action: NEW
    reason: 'Participation test: the Hrt1 RING itself catalyses the step - it activates Ubc12~Rub1 and is required
      for Rub1 transfer onto Cdc53 Lys760 (Kamura et al. 1999, PMID:10579999, cited by UniProt; Scott et al. 2010,
      summarised in the deep research), and Rub1 modification of the Cdc53/Hrt1 core is demonstrated with purified
      proteins in the cached Lag2 paper. Comparator check: human RBX1 carries NEDD8 transferase activity (GO:0019788),
      NEDD8 ligase activity (GO:0061663) and protein neddylation (GO:0045116) by IDA/TAS, so the absence for yeast
      Hrt1 is a gap rather than a convention. Proposed conservatively with the UniProt record as the traceable source
      because the primary papers are not in the local publication cache.'
    supported_by:
    - reference_id: file:yeast/HRT1/HRT1-uniprot.txt
      supporting_text: Also stimulates CDC34/UBC3 autoubiquitination and promotes the neddylation of CDC53 and RTT101.
    - reference_id: file:yeast/HRT1/HRT1-deep-research-falcon.md
      supporting_text: Hrt1 also works with Ubc12 and Dcn1 in the distinct Rub1/NEDD8-like pathway to modify cullins.
    - reference_id: file:yeast/HRT1/HRT1-deep-research-falcon.md
      supporting_text: The Hrt1 RING stimulated substrate-independent discharge of Ubc12~Rub1 and was necessary
        for Rub1 transfer to **Cdc53 Lys760**; Cdc53 K760R prevented modification.
    - reference_id: PMID:19942853
      supporting_text: Although both hCul1/hRbx1 and Cdc53/Hrt1 complexes were efficiently modified by Rub1
