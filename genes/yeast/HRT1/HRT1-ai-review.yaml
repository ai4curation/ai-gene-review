    supported_by:
    - reference_id: PMID:10230407
      supporting_text: YeastROC1 encodes an essential gene whose reduced expression resulted in multiple, elongated
        buds and accumulation of Sic1p and Cln2p.
    - reference_id: PMID:10385629
      supporting_text: HRT1–myc9 cells did not enter S phase or form mitotic spindles, and exhibited a strong delay
        in bud emergence.
    - reference_id: PMID:10385629
      supporting_text: Consistent with their failure to duplicate DNA, Sic1 persisted at high levels in elutriated
        HRT1myc9 cells, but was degraded concomitant with bud emergence in HRT1 cells
