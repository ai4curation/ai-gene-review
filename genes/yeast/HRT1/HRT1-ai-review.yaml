id: Q08273
gene_symbol: HRT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Hrt1 (also called Rbx1 or Roc1; systematic name YOL133W) is the 121-residue RING-H2 zinc-finger protein
  that forms the catalytic subunit of all cullin-RING ubiquitin ligases in Saccharomyces cerevisiae, and it is the
  only cullin-binding RING-box protein the yeast genome encodes. Its N-terminal region pairs with the C-terminal
  cullin domain of Cdc53 (Cul1), Cul3 or Rtt101 (Cul8), while its RING domain, which coordinates structural zinc,
  binds the ubiquitin-charged E2 Cdc34 (and can use Ubc4) and activates it so that ubiquitin passes directly from
  the E2 thioester to a lysine on a substrate held at the far end of the cullin by an interchangeable receptor module.
  Hrt1 forms no ubiquitin thioester of its own: the Cdc53/Hrt1 heterodimer stimulates Cdc34 without a reactive cysteine
  and constitutes a minimal ubiquitin ligase that is further activated by assembly with Skp1 and an F-box protein.
  The same RING acts with the E2 Ubc12 and the co-E3 Dcn1 to attach the NEDD8 orthologue Rub1 to a conserved C-terminal
  lysine of Cdc53 (and to Rtt101), the modification that activates the ligase and counteracts sequestration of the
  Cdc53/Hrt1 core by the CAND1-like protein Lag2. Through SCF ligases Hrt1 is essential for cell-cycle progression:
  SCF(Cdc4) destroys the CDK inhibitor Sic1 and nuclear Far1, SCF(Grr1) destroys the G1 cyclins Cln1/2, and conditional
  hrt1 mutants arrest at the G1/S transition with stabilised Sic1 and Cln2; other SCFs use the same core to ubiquitinate
  Met4, Gcn4, Gic2, Mig2, Fzo1, Sir4 and Mrc1. As the RING of the Cul3(Elc1-Ela1) ligase it contributes to K48-polyubiquitination
  and proteasomal degradation of the RNA polymerase II subunit Rpb1 after DNA damage, and as the RING of Rtt101(Mms1)
  ligases it supports replication-fork progression through damaged DNA. Substrate choice resides in the receptor
  modules rather than in Hrt1 itself. GFP-Hrt1 is distributed in both nucleus and cytoplasm, its effective location
  being set by the assembled ligase. HRT1 is essential for viability, and human RBX1 complements the deletion, reflecting
  the conservation of the cullin-RING catalytic module from yeast to humans.'
existing_annotations:
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:10213692
  qualifier: involved_in
  review:
    summary: Rbx1/Hrt1 is the subunit that lets recombinant SCF(Grr1) ubiquitinate phosphorylated Cln1 with Cdc34,
      and it promotes Cdc34 association with Cdc53; G1-cyclin turnover by SCF(Grr1) and Sic1 turnover by SCF(Cdc4)
      are the SCF steps that gate entry into S phase.
    action: ACCEPT
    reason: 'Core process. Hrt1 performs the ubiquitin-transfer step of the G1/S switch: hrt1 conditional mutants
      arrest at G1/S with stabilised Sic1 and Cln2 (PMID:10385629), and reduced ROC1 expression accumulates Sic1
      and Cln2 (PMID:10230407). Abstract-only cache for this reference, but the abstract itself states the Rbx1
      result.'
    additional_reference_ids:
    - PMID:10385629
    - PMID:10230407
    supported_by:
    - reference_id: PMID:10213692
      supporting_text: Phosphorylated Cln1 was ubiquitinated by SCF (Skp1-Cdc53-F-box protein) complexes containing
        the F-box protein Grr1, Rbx1, and the E2 Cdc34.
    - reference_id: PMID:10213692
      supporting_text: Rbx1 promotes association of Cdc34 with Cdc53 and stimulates Cdc34 auto-ubiquitination in
        the context of Cdc53 or SCF complexes.
    - reference_id: PMID:10385629
      supporting_text: Conditional inactivation of hrt1 ts results in stabilization of the SCF Cdc4 substrates Sic1
        and Cln2 and cell cycle arrest at G 1 /S.
    - reference_id: file:yeast/HRT1/HRT1-uniprot.txt
      supporting_text: Component of the SCF(CDC4) ubiquitin ligase required for ubiquitination of the cyclin-dependent
        kinase inhibitor SIC1 and for the G1-to-S phase transition.
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:10230407
  qualifier: involved_in
  review:
    summary: Reduced expression of yeast ROC1/HRT1 gives multiple elongated buds and accumulation of Sic1 and Cln2,
      the SCF(Cdc4) and SCF(Grr1) substrates whose destruction drives the G1/S transition.
