  review:
    summary: Sequential epitope tagging, affinity purification and mass spectrometry of Skp1- and Cdc53-associated
      proteins recovered Hrt1 together with all SCF components and nine F-box proteins; Hrt1 co-purifies with Cdc53
      as the cullin-bound RING subunit.
