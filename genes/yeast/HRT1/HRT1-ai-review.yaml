  evidence_type: NAS
  original_reference_id: PMID:20139071
  qualifier: involved_in
  review:
    summary: 'Author statement transferred from the Cul8/Rtt101 complex-composition paper: Cul8-Mms1-Mms22 ligases
      (with Esc4 or Ctf4) act at stalled replication forks and their loss causes MMS/HU sensitivity; Hrt1 is the
      RING of every Rtt101 ligase and promotes Rtt101 rubylation.'
    action: KEEP_AS_NON_CORE
    reason: The Rtt101(Mms1-Mms22) ligase does the work of promoting fork progression through damaged DNA (UniProt),
      and Hrt1 supplies its catalytic RING, so the term is not wrong; but it is a receptor-defined output of one
      of the three cullin scaffolds, the cited paper never manipulates HRT1 (full text cached; all genetics are
      cul8, mms1, mms22, esc4 and ctf4), and 'regulation of DNA replication' is a loose description of fork-restart
      support. Graded non-core; the core process is cullin-RING ubiquitination.
    supported_by:
    - reference_id: PMID:20139071
      supporting_text: Genetic evidence indicates that Cul8, together with Mms1, Mms22, and Esc4, is involved in
        the repair of DNA damage that can occur during DNA replication.
    - reference_id: PMID:20139071
      supporting_text: 'Herein, we report that Cul8 forms at least four different protein complexes: Cul8-Mms1-Mms22-Esc4,
        Cul8-Mms1-Mms22-Ctf4, Cul8-Mms1-Esc2, and Cul8-Mms1-Orc5.'
    - reference_id: file:yeast/HRT1/HRT1-uniprot.txt
      supporting_text: Component of the RTT101(MMS1-MMS22) ubiquitin ligase that promotes fork progression through
        damaged DNA or natural pause sites.
- term:
    id: GO:0006289
    label: nucleotide-excision repair
  evidence_type: NAS
  original_reference_id: PMID:17296727
  qualifier: involved_in
  review:
    summary: Elc1, Ela1 and Cul3 are required for K48-polyubiquitylation and degradation of Rpb1 in DNA-damaged
      cells, and the authors propose an Elc1-Ela1-Cul3-Roc1 ligase; they also show that Pol II degradation is not
      a prerequisite for Rad26-dependent transcription-coupled repair but a separate route to lesion removal.
    action: MODIFY
    reason: 'The term is too specific and partly mis-scoped: the ligase removes stalled Pol II from the template,
      an alternative to transcription-coupled NER rather than a step of the excision reaction, and the authors explicitly
      presume rather than test Roc1/Hrt1 involvement (full text cached). The defensible process is the DNA damage
      response (GO:0006974), in which the CRL3(Ela1) ligase - with Hrt1 as its RING - degrades Pol II after damage.
      The specific catabolic step is already recorded by the GO:0006511 NAS row from the same paper. Non-core for
      the shared RING.'
    proposed_replacement_terms:
    - id: GO:0006974
      label: DNA damage response
    supported_by:
    - reference_id: PMID:17296727
      supporting_text: Further, our genetic analyses indicate that Pol II polyubiquitylation and degradation are
        not a prerequisite for Rad26-mediated TCR; rather, these two processes provide separate means of lesion
        removal from the transcribed strand.
    - reference_id: PMID:17296727
      supporting_text: Although we have not examined the effects of ROC1 inactivation upon Pol II polyubiquitylation
        and degradation, the fact that Roc1 is the only RING protein in yeast that binds the various cullins, including
        cullin 3, we presume that Roc1 also is indispensable for Pol II polyubiquitylation and degradation.
    - reference_id: file:yeast/HRT1/HRT1-uniprot.txt
      supporting_text: Component of the CRL3(ELA1) ubiquitin ligase required for ubiquitination of RPB1, the largest
        subunit of RNA polymerase II (Pol II), which targets Pol II for proteasomal degradation in DNA-damaged cells.
