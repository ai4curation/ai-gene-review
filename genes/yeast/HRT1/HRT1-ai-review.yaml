- term:
    id: GO:0000781
    label: chromosome, telomeric region
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: located_in
  supporting_entities:
  - GO:0031509
  review:
    summary: Electronic inference of telomeric-region localisation from the subtelomeric heterochromatin formation
      annotation (GO:0031509), itself an NAS transfer from the SCF(Dia2)/Sir4 silencing paper.
    action: REMOVE
    reason: Over-propagated inter-ontology inference. The only basis is the NAS row for GO:0031509, which records
      that dia2-delta cells lose telomeric silencing because SCF(Dia2) ubiquitylates Sir4; nothing places Hrt1 at
      telomeres (the paper never mentions Hrt1, and no Hrt1 ChIP or imaging at telomeric chromatin exists), and
      a ligase acting on a soluble silencing factor need not reside at the site of action. GFP-Hrt1 is diffusely
      nuclear and cytoplasmic (PMID:11080155). Same call as the CDC53 and SKP1 reviews.
    supported_by:
    - reference_id: PMID:22844255
      supporting_text: cells lacking Dia2, a component of the SCF(Dia2) E3 ubiquitin ligase involved in DNA replication,
        display defects in silencing at the telomere and HMR locus
    - reference_id: PMID:11080155
      supporting_text: The core SCF subunits Cdc53, Hrt1 and Skp1 were distributed in the nucleus and the cytoplasm,
        whereas the F-box protein Cdc4 was exclusively nuclear.
    - reference_id: file:yeast/HRT1/HRT1-deep-research-falcon.md
      supporting_text: Nuclear and cytoplasmic SCF functions are plausible, but the retrieved evidence does **not**
        justify assigning Q08273 an exclusive compartment or a fixed organelle localization.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: GO:0031509
        source_label: subtelomeric heterochromatin formation
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The source is itself an NAS process annotation inferred from dia2-delta silencing phenotypes; the
          inter-ontology link converts a process inference into a location claim that no direct evidence supports.
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IDA
  original_reference_id: PMID:10385629
  qualifier: contributes_to
  review:
    summary: Hrt1 supplies the RING-H2 activity that activates the ubiquitin-charged E2 Cdc34 and transfers ubiquitin
      onto substrates held by the cullin's receptor module; the Cdc53/Hrt1 subcomplex alone stimulates Cdc34 (auto)ubiquitination,
      and hrt1 mutants stabilise Sic1 and Cln2.
    action: ACCEPT
    reason: 'Core molecular function. Full text cached: recombinant GST-Hrt1 stimulates SCF(Cdc4) ubiquitination
      of phospho-Sic1 more than fivefold, SCF(Grr1) is inactive on Cln2 without Hrt1, and the Cdc53/Hrt1 module
      activates Cdc34 without a reactive thiol (NEM-insensitive), i.e. it is a RING E3 that does not form its own
      ubiquitin thioester. The contributes_to qualifier is appropriate for a subunit that is catalytic only within
      the assembled cullin-RING complex.'
    supported_by:
    - reference_id: PMID:10385629
      supporting_text: GST–Hrt1 potently stimulated ubiquitination of phospho–MBP–Sic1.
    - reference_id: PMID:10385629
      supporting_text: those that contained Hrt1 sustained Cdc34-dependent ubiquitination of Cln2
    - reference_id: PMID:10385629
      supporting_text: Cdc53/Hrt1-dependent autoubiquitination of Cdc34 is indifferent to NEM.
    - reference_id: PMID:10385629
      supporting_text: although the ubiquitin ligase activity of SCF Cdc4 is intrinsic to the Cdc53/Hrt1 subcomplex,
        this activity may be enhanced upon assembly of Cdc53/Hrt1 with Cdc4/Skp1.
    - reference_id: file:yeast/HRT1/HRT1-uniprot.txt
      supporting_text: The RING-type zinc finger domain is essential for ubiquitin ligase activity.
