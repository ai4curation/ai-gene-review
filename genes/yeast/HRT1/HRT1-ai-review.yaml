- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:14747994
  qualifier: involved_in
  review:
    summary: SCF core subunits have a second, Sic1-independent requirement for completing mitosis; the author statement
      attaches the G2/M term to every SCF subunit in the in vitro E2 survey.
    action: KEEP_AS_NON_CORE
    reason: The G2/M requirement of the SCF core (cdc53, cdc4, cdc34 mutants relieved of the G1 block still fail
      to complete mitosis) is genuine but mechanistically undefined and was not tested for hrt1 in the cited paper
      (abstract-only cache); as the RING shared by all SCFs Hrt1 would participate, but it is a secondary role,
      graded non-core to match CDC53/SKP1/CDC4.
    supported_by:
    - reference_id: PMID:14747994
      supporting_text: We have reconstituted and purified 1 known and 12 novel yeast SCF complexes, and explored
        the ability of these complexes to function with 5 different purified E2 enzymes
    - reference_id: PMID:10385629
      supporting_text: these observations suggest that Hrt1 is an essential core component that contributes to the
        E3 activity of all SCF complexes.
- term:
    id: GO:0000409
    label: regulation of transcription by galactose
  evidence_type: NAS
  original_reference_id: PMID:21323640
  qualifier: involved_in
  review:
    summary: SCF(Das1) degrades the Mig2 repressor on galactose induction so that GAL1 can be induced; Hrt1 is the
      RING of that ligase, although the paper used skp1dM and das1-delta alleles and never manipulated HRT1.
    action: KEEP_AS_NON_CORE
    reason: The SCF does the work of this regulatory step (ubiquitinating Mig2 so it is degraded and leaves the
      GAL1 promoter) and Hrt1 is the catalytic RING of every SCF, so the term is not wrong; but it is one receptor-specific
      output among many and the Hrt1 involvement is an author inference from SCF composition (abstract-only cache).
      Graded non-core, matching the CDC53 and SKP1 reviews.
    supported_by:
    - reference_id: PMID:21323640
      supporting_text: Mig2 degradation was also abolished in cells lacking the protein kinase Snf1 and the F-box
        protein Das1, suggesting that Snf1 triggers galactose-induced protein degradation of Mig2 by SCFDas1.
    - reference_id: PMID:21323640
      supporting_text: We generated a skp1dM mutant strain that is defective for galactose induction of the GAL1
        gene and we have found that galactose-induced protein degradation of the repressor Mig2 is defective in
        this strain.
    - reference_id: file:yeast/HRT1/HRT1-deep-research-falcon.md
      supporting_text: Its localization and biological outputs are consequently complex-dependent rather than defined
