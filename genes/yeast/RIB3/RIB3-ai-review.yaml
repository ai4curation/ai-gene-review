suggested_questions:
- question: What is the molecular basis of the flavin-independent role of Rib3 in expression of cytochrome
    oxidase and cytochrome b, and does it require the IMS pool?
- question: Is the IMS localisation of Rib3 (and Rib4) linked to a local supply of riboflavin intermediates
    for mitochondrial flavoproteins?
suggested_experiments:
- description: Target Rib3 exclusively to cytosol or IMS in a rib3 deletion background and test riboflavin
    prototrophy and respiratory growth separately.
