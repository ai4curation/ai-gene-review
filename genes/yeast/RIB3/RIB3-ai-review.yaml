id: Q99258
gene_symbol: RIB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: RIB3 (YDR487C) encodes 3,4-dihydroxy-2-butanone-4-phosphate synthase (DHBP synthase, EC 4.1.99.12),
  the riboflavin-pathway enzyme that converts D-ribulose 5-phosphate into formate and 3,4-dihydroxy-2-butanone
  4-phosphate, the four-carbon precursor of the xylene ring that Rib4 condenses with the pyrimidine intermediate.
  It is a homodimeric, Mg2+/Mn2+-dependent RibB-family enzyme, monofunctional in yeast (GTP cyclohydrolase
  II is the separate Rib1). Rib3 is mostly cytosolic, with a small fraction in the mitochondrial intermembrane
  space, and has a second, flavin-independent function required for respiratory growth and expression
  of cytochrome oxidase and cytochrome b, revealed by an A137T allele that impairs respiration without
  lowering flavin levels.
