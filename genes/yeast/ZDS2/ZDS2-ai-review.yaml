gene_symbol: ZDS2
aliases:
- MCS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ZDS2 (YML109W, also MCS1) encodes a 942-residue, largely disordered,
  fungus-specific protein that is the paralog of Zds1. Zds2 binds directly to the
  B-type regulatory subunit Cdc55 of protein phosphatase 2A through its conserved
  C-terminal Zds_C/ZH4 region and forms a stable complex with PP2A-Cdc55 (Cdc55,
  the scaffold Tpd3 and the catalytic subunit). Together with Zds1, it holds PP2A-Cdc55
  in the cytoplasm and at the bud cortex and keeps it out of the nucleus. It also
  steers the phosphatase towards particular substrates, for example promoting dephosphorylation
  of the Cdc25-family phosphatase Mih1. Through this context-dependent control of
  PP2A-Cdc55, Zds2 acts redundantly with Zds1 to promote mitotic entry (overriding
  the Swe1-dependent morphogenesis checkpoint) and to allow timely early-anaphase
  release of Cdc14 from the nucleolus during mitotic exit. Zds2 localizes to the cytoplasm,
  the bud cortex/bud tip of growing buds and the bud neck in late mitosis. Loss of
  both paralogs causes a G2 delay with elongated buds, and Zds2 contributes to the
  Zds1/Zds2-PP2A-Cdc55 module that biases Rho1 signalling towards polarized growth.
  Single zds2 deletion has mild phenotypes, including reduced rDNA silencing and a
  shortened replicative life span.'
