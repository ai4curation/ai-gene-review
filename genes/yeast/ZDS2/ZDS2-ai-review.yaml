- hypothesis: Binding of the Zds2 ZH4/Zds_C region to Cdc55 changes PP2A-Cdc55 catalytic
    activity in a substrate-dependent way, stimulating dephosphorylation of Mih1
    and reducing dephosphorylation of Net1.
  description: Reconstitute PP2A-Cdc55 (Pph21, Tpd3, Cdc55) from purified components,
    add full-length Zds2 or the ZH4 fragment (wild type versus the zds2-3 R863H/V868A
    mutant), and measure dephosphorylation kinetics of Cdk1-phosphorylated Mih1,
    Net1 and Swe1 peptides and full-length proteins.
