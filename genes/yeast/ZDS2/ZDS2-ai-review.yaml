    towards Mih1.
- question: Is the in vitro inhibition of PP2A-Cdc55 seen after Zds1 overexpression
    a direct effect of Zds binding on catalysis, or an indirect consequence of
    redistributing PP2A-Cdc55 between compartments and substrates?
- question: Does Zds2 have functions distinct from Zds1, given their opposite effects
    on rDNA silencing, Sir3 phosphorylation and replicative life span?
