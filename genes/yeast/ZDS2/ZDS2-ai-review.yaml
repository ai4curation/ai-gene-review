core_functions:
- description: Zds2 binds the PP2A B subunit Cdc55 directly through its conserved
    C-terminal ZH4/Zds_C region and, redundantly with Zds1, regulates PP2A-Cdc55.
    It retains the phosphatase in the cytoplasm and at the bud cortex, excludes it
    from the nucleus and targets it to substrates such as Mih1. This promotes Cdk1
    activation and mitotic entry, and permits timely Cdc14 release during mitotic
    exit.
