- hypothesis: Zds2 regulates rDNA silencing through PP2A-Cdc55-dependent control
    of Sir3 phosphorylation.
  description: Compare rDNA silencing, Sir3 phosphorylation and replicative life span
    in zds2 deletion, zds2-ZH4 deletion, cdc55 deletion and zds2 cdc55 strains, and
