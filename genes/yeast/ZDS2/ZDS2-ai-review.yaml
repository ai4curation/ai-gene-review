  review:
    summary: PAINT IBD at the fungal Zds node PTN001999034, seeded only by ZDS1
      (SGD:S000004886), whose IMP/IGI rows rest on the finding that ectopic Zds1
      halves PP2A-Cdc55 specific activity in metaphase-arrested cells. Zds2 binds
      the same Cdc55 surface and ectopic Zds2 also triggers Cdc14 release, so ZDS2
      lies inside the clade that inherits the shared function. "Inhibitor", however,
      describes only one context-dependent output of that function.
    action: MODIFY
    reason: The node placement is sound, since Zds1 and Zds2 share the same Cdc55-binding
      Zds_C region and act redundantly on PP2A-Cdc55. The specific term is too narrow
      and partly contradicted. Zds proteins are required for PP2A-Cdc55 to dephosphorylate
      Mih1 (an activating, substrate-targeting role) and maintain the cytoplasmic
      pool of PP2A-Cdc55 that promotes mitotic entry. Their inhibitory effect is confined
      to nuclear/Net1 functions during mitotic exit, and the Queralt lab itself later
      concluded that the Zds proteins are unlikely to be direct inhibitory components
      of PP2A-Cdc55. The parent term protein phosphatase regulator activity (GO:0019888),
      defined as binding to and modulating the activity of a protein phosphatase,
      captures both the positive and the negative outputs. No direct phosphatase-inhibition
      experiment exists for Zds2 itself.
    proposed_replacement_terms:
