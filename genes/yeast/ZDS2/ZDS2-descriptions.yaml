descriptions:
- source: UniProt
  text: Acts as a negative regulator of polarized growth via an alternative mechanism
    to ZDS1. In heat-stressed cells appears to play a role in localizing BCY1 to the
    cytoplasm. Seems to interact with, and down-regulate, CDC42. Also acts as a suppressor
    of PKC1. May act as an integration point for distinct signaling pathways helping
    to maintain a balance among these different pathways.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54786
  source_id: P54786
