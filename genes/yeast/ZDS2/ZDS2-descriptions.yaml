gene_symbol: ZDS2
organism: yeast
uniprot_id: P54786
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acts as a negative regulator of polarized growth via an alternative mechanism
    to ZDS1. In heat-stressed cells appears to play a role in localizing BCY1 to the
    cytoplasm. Seems to interact with, and down-regulate, CDC42. Also acts as a suppressor
    of PKC1. May act as an integration point for distinct signaling pathways helping
    to maintain a balance among these different pathways.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54786
  source_id: P54786
- source: Alliance_Imported
  text: Protein with a role in regulating Swe1p-dependent polarized growth; involved
    in maintenance of Cdc55p in the cytoplasm where it promotes mitotic entry; interacts
    with silencing proteins at the telomere; implicated in the mitotic exit network
    through regulation of Cdc14p localization; ZDS2 has a paralog, ZDS1, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ZDS2
  source_id: SGD:S000004577
- source: Alliance_Automated
  text: Predicted to enable protein phosphatase inhibitor activity. Involved in several
    processes, including establishment of cell polarity; positive regulation of G2/M
    transition of mitotic cell cycle; and rDNA heterochromatin formation. Located
    in cellular bud neck; cellular bud tip; and cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ZDS2
  source_id: SGD:S000004577
fetch_date: '2026-11-01'
