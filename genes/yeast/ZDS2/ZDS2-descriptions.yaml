    overall_notes: 'Dated: frames Zds2 around polarized growth, Bcy1 localisation,
      Cdc42 and Pkc1, and never names its direct partner, PP2A-Cdc55.'
- source: Alliance_Imported
  text: Protein with a role in regulating Swe1p-dependent polarized growth; involved
    in maintenance of Cdc55p in the cytoplasm where it promotes mitotic entry; interacts
    with silencing proteins at the telomere; implicated in the mitotic exit network
    through regulation of Cdc14p localization; ZDS2 has a paralog, ZDS1, that arose
    from the whole genome duplication
  source_type: curated
