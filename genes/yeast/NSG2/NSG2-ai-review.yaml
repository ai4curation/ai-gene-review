      chaperone/regulator of Hmg2 stability with conditional NVJ localization.
    supporting_text: NSG2/YNL156C is best annotated as an ER and starvation-induced
      NVJ multi-pass INSIG-family membrane protein that participates in sterol homeostasis
      primarily by modulating the stability and/or activity of HMG-CoA reductase isozymes.
