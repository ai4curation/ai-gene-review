proposed_new_terms:
- proposed_name: sterol-sensing domain protein chaperone activity
  proposed_definition: Binding to and stabilizing the transmembrane sterol-sensing
    domain of a client protein to promote correct folding or prevent ER-associated
    degradation.
  justification: Nsg2 and related Nsg/INSIG-family proteins interact directly with
    the sterol-sensing-domain-containing transmembrane region of Hmg2 and inhibit
    its HRD-dependent degradation. GO:0044183 protein folding chaperone is the
    closest available molecular-function parent but overemphasizes de novo folding,
    GO:1904293 negative regulation of ERAD pathway captures the downstream process
    rather than the activity, and GO:0050821 protein stabilization likewise captures
    the outcome rather than SSD-client binding specificity.
  proposed_parent:
    id: GO:0044183
    label: protein folding chaperone
  supported_by:
  - reference_id: PMID:16270032
    supporting_text: We now show that the yeast INSIG homologs NSG1 and NSG2 function
      to control the stability of yeast Hmg2p, the HMGR isozyme that undergoes regulated
      ubiquitination. Yeast Nsgs inhibit degradation of Hmg2p in a highly specific
      manner, by directly interacting with the sterol-sensing domain (SSD)-containing
      transmembrane region.
    reference_section_type: ABSTRACT
suggested_questions:
- question: What client specificity distinguishes Nsg2 from Nsg1 at native expression
    levels, and which HMG-CoA reductase isozyme or sterol-sensing-domain clients require
    Nsg2 specifically?
- question: Does stabilized Nsg2 suppress Hmg1 at the nucleus-vacuole junction by
    directly binding the Hmg1 sterol-sensing domain, by changing Hmg1 assembly, or
    indirectly through local nuclear-membrane lipid composition?
- question: What structural or membrane-composition cues cause glucose-starvation
    NVJ remodeling to stabilize Nsg2 while destabilizing the paralogous Nsg1?
suggested_experiments:
- description: Compare Hmg1 and Hmg2 stability, ERAD flux, and sterol intermediate
    levels in nsg1, nsg2, and nsg1 nsg2 mutants under sterol-replete, sterol-depleted,
    and low-glucose conditions.
  experiment_type: genetics
- description: Map Nsg2 client contacts by crosslinking or co-immunoprecipitation
    of functional tagged Nsg2 with Hmg1/Hmg2 SSD-domain mutants.
  experiment_type: biochemistry
- description: Quantify Nsg2 recruitment to the NVJ during glucose starvation and
    test whether disrupting NVJ tethering changes sterol ester, squalene, or HMG-CoA
    reductase activity phenotypes.
  experiment_type: microscopy
