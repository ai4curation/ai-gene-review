core_functions:
- description: Nsg2 is a dedicated INSIG-family ER membrane chaperone/regulator for
    sterol-sensing-domain-containing HMG-CoA reductase clients, especially Hmg2. It
    contributes to sterol biosynthesis/homeostasis by stabilizing Hmg2 and limiting
    HRD-dependent ERAD. Nsg2 has functional overlap but not complete equivalence
    to Nsg1.
