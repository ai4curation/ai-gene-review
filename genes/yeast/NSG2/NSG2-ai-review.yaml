- id: PMID:41132095
  title: Role of Pex31 in metabolic adaptation of the nucleus-vacuole junction
  findings:
  - statement: Nsg2 is a conditional nucleus-vacuole junction resident during low-glucose
      conditions.
    supporting_text: 'Here, we used systematic microscopy-based approaches to compare
      the NVJ at glucose-replete and -restricted conditions and identified five additional
      NVJ proteins: the permanent NVJ resident Shr5 and the conditional residents
      Nsg1, Nsg2, Tcb1 and Pex31.'
- id: PMID:42227952
  title: Glucose starvation signaling via nucleus-vacuole junction remodeling controls
    ergosterol synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified abstract-only cache. Establishes glucose-starvation
      recruitment of Nsg1/Nsg2 and Hmg1/Hmg2 to the nucleus-vacuole junction and reports
      the functional outcome of this remodeling: Nsg1 destabilization activates Hmg1,
      whereas Nsg2 stabilization suppresses Hmg1.'
  findings:
  - statement: Glucose starvation recruits Nsg2 to the NVJ with Nsg1 and the Hmg1/Hmg2
      HMG-CoA reductases, and the remodelled NVJ stabilizes Nsg2 to suppress Hmg1-dependent
      sterol synthesis.
    supporting_text: Ypf1 promotes the recruitment of Nsg1, Nsg2, and the HMG-CoA
      reductases Hmg1 and Hmg2 to the NVJ, likely in association with changes in nuclear
      membrane lipid composition caused by suppression of fatty acid elongases. This
      remodeling destabilizes Nsg1, thereby activating Hmg1, while stabilizing Nsg2,
      which suppresses Hmg1 to fine-tune sterol synthesis.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: file:yeast/NSG2/NSG2-deep-research-falcon.md
  title: Falcon deep research report for NSG2
  findings:
