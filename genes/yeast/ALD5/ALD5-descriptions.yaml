gene_symbol: ALD5
organism: yeast
uniprot_id: P40047
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Minor mitochondrial aldehyde dehydrogenase isoform. Plays a role in regulation
    or biosynthesis of electron transport chain components. Involved in the biosynthesis
    of acetate during anaerobic growth on glucose.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40047
  source_id: P40047
- source: Alliance_Imported
  text: Mitochondrial aldehyde dehydrogenase; involved in regulation or biosynthesis
    of electron transport chain components and acetate formation; activated by K+;
    utilizes NADP+ as the preferred coenzyme; constitutively expressed
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALD5
  source_id: SGD:S000000875
- source: Alliance_Automated
  text: Enables acetaldehyde dehydrogenase (NADP+) activity and aldehyde dehydrogenase
    (NAD+) activity. Involved in acetate biosynthetic process. Located in mitochondrial
    matrix. Human ortholog(s) of this gene implicated in several diseases, including
    artery disease (multiple); congenital diaphragmatic hernia; diabetes mellitus
    (multiple); liver disease (multiple); and substance-related disorder (multiple).
    Orthologous to several human genes including ALDH1A1 (aldehyde dehydrogenase 1
    family member A1); ALDH1A2 (aldehyde dehydrogenase 1 family member A2); and ALDH1B1
    (aldehyde dehydrogenase 1 family member B1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALD5
  source_id: SGD:S000000875
