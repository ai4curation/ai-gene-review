suggested_questions:
- question: Is the respiratory/cytochrome deficiency of ald5 mutants caused by loss of Ald5p catalytic
    activity (e.g. on a specific aldehyde) or by a non-catalytic role?
- question: Does Ald5p have a preferred physiological substrate other than acetaldehyde, given its poor
    kinetics with acetaldehyde?
suggested_experiments:
- description: Complement ald5 with a catalytic-cysteine mutant of Ald5p and assay respiration, cytochrome
    content and acetate production to separate catalytic from non-catalytic roles.
