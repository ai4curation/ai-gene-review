gene_symbol: ALD5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ald5p is a minor mitochondrial aldehyde dehydrogenase of S. cerevisiae, targeted to the matrix
  by a 23-residue N-terminal presequence. The recombinant enzyme oxidizes acetaldehyde and propanal using
  NAD+ or NADP+ without strong cofactor preference and is strongly stimulated by K+, but it has much lower
  catalytic efficiency than Ald4p or Ald6p. Genetic studies show that Ald5p provides the mitochondrial
  contribution to acetate formation during anaerobic growth on glucose, second to the cytosolic Ald6p.
  ald5 mutants also show reduced respiration and cytochrome content, suggesting an additional, poorly
  understood role in maintaining the mitochondrial electron transport chain. Ald5p makes at most a minor
  contribution to acetaldehyde oxidation during growth on ethanol.
