descriptions:
- source: UniProt
  text: 'Multifunctional protein that encodes the first 2 enzymatic activities of
    the de novo pyrimidine pathway: carbamoylphosphate synthetase (CPSase; EC 6.3.5.5)
    and aspartate transcarbamylase (ATCase; EC 2.1.3.2). The CPSase-function is accomplished
    in 2 steps, by a glutamine-dependent amidotransferase activity (GATase) that binds
    and cleaves glutamine to produce ammonia, followed by an ammonium-dependent carbamoyl
    phosphate synthetase, which reacts with the ammonia, hydrogencarbonate and ATP
    to form carbamoyl phosphate. The endogenously produced carbamoyl phosphate is
    sequestered and channeled to the ATCase active site. ATCase then catalyzes the
    formation of carbamoyl-L- aspartate from L-aspartate and carbamoyl phosphate.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07259
  source_id: P07259
- source: Alliance_Imported
  text: Bifunctional carbamoylphosphate synthetase/aspartate transcarbamylase; catalyzes
    the first two enzymatic steps in the de novo biosynthesis of pyrimidines; both
    activities are subject to feedback inhibition by UTP
  source_type: curated
  url: https://www.yeastgenome.org/locus/URA2
  source_id: SGD:S000003666
- source: Alliance_Automated
  text: Enables aspartate carbamoyltransferase activity; carbamoyl-phosphate synthase
    (ammonia) activity; and carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity.
    Involved in 'de novo' pyrimidine nucleobase biosynthetic process; negative regulation
    of pyrimidine nucleobase metabolic process; and pyrimidine nucleoside biosynthetic
    process. Located in cytoplasm and membrane. Human ortholog(s) of this gene implicated
    in developmental and epileptic encephalopathy 50. Orthologous to human CAD (carbamoyl-phosphate
    synthetase 2, aspartate transcarbamylase, and dihydroorotase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/URA2
