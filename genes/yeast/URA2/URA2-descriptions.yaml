- source: Alliance_Automated
  text: Enables aspartate carbamoyltransferase activity; carbamoyl-phosphate synthase
    (ammonia) activity; and carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity.
    Involved in 'de novo' pyrimidine nucleobase biosynthetic process; negative regulation
    of pyrimidine nucleobase metabolic process; and pyrimidine nucleoside biosynthetic
    process. Located in cytoplasm and membrane. Human ortholog(s) of this gene implicated
    in developmental and epileptic encephalopathy 50. Orthologous to human CAD (carbamoyl-phosphate
    synthetase 2, aspartate transcarbamylase, and dihydroorotase).
