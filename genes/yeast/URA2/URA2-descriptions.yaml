descriptions:
- source: UniProt
  text: 'Multifunctional protein that encodes the first 2 enzymatic activities of
    the de novo pyrimidine pathway: carbamoylphosphate synthetase (CPSase; EC 6.3.5.5)
    and aspartate transcarbamylase (ATCase; EC 2.1.3.2). The CPSase-function is accomplished
    in 2 steps, by a glutamine-dependent amidotransferase activity (GATase) that binds
    and cleaves glutamine to produce ammonia, followed by an ammonium-dependent carbamoyl
    phosphate synthetase, which reacts with the ammonia, hydrogencarbonate and ATP
    to form carbamoyl phosphate. The endogenously produced carbamoyl phosphate is
    sequestered and channeled to the ATCase active site. ATCase then catalyzes the
    formation of carbamoyl-L- aspartate from L-aspartate and carbamoyl phosphate.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07259
