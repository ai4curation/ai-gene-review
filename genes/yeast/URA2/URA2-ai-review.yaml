core_functions:
- description: 'Pyrimidine-specific glutamine-dependent carbamoyl-phosphate synthetase (CPSase P) activity
    of the N-terminal GATase and CPSase domains of the multifunctional Ura2p: glutamine hydrolysis provides
    ammonia that is condensed with bicarbonate and 2 ATP into carbamoyl phosphate, which is channelled
    to the fused ATCase domain. Feedback-inhibited by UTP and activated by XMP.'
  molecular_function:
    id: GO:0004088
