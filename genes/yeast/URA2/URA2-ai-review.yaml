id: P07259
gene_symbol: URA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ura2p is the large (~240 kDa) cytoplasmic multifunctional enzyme of Saccharomyces cerevisiae
  that catalyses the first two steps of de novo pyrimidine (UMP) biosynthesis. It is a CAD-like protein
  with an N-terminal glutamine amidotransferase (GATase) domain and a carbamoyl-phosphate synthetase domain
  that together form the pyrimidine-specific glutamine-dependent CPSase P (EC 6.3.5.5), a catalytically
  inactive dihydroorotase-like domain, and a C-terminal aspartate carbamoyltransferase (ATCase, EC 2.1.3.2)
  domain. Carbamoyl phosphate made by the CPSase domain is channelled to the ATCase active site to form
  N-carbamoyl-L-aspartate. Both activities are feedback-inhibited by UTP (CPSase also activated by XMP)
  and the gene is repressed by pyrimidines. Dihydroorotase is supplied separately by URA4. Ura2p is distinct
  from, and paralogous to, the arginine-specific CPSase A (CPA1/CPA2).
