id: P38840
gene_symbol: ARO9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ARO9 encodes aromatic aminotransferase II (also kynurenine aminotransferase I) of Saccharomyces
  cerevisiae, a cytosolic PLP-dependent class I aminotransferase of the same subfamily as ARO8. Its expression
  is induced by aromatic amino acids, and it is the main catabolic aromatic aminotransferase: it transaminates
  tryptophan, phenylalanine and tyrosine to the corresponding 2-oxo acids, the first step of the Ehrlich
  pathway that yields fusel alcohols such as 2-phenylethanol and tryptophol. Unlike Aro8, Aro9 uses pyruvate,
  phenylpyruvate or 4-hydroxyphenylpyruvate, but not 2-oxoglutarate, as amino acceptor (EC 2.6.1.58 and
  2.6.1.28 type reactions). It is responsible for all kynurenine aminotransferase activity of the cell,
  is one of the main 4-methylthio-2-oxobutanoate transaminases of the methionine salvage pathway, and
  can substitute for Aro8 in Phe/Tyr biosynthesis, since only aro8 aro9 double mutants are Phe/Tyr auxotrophs.'
