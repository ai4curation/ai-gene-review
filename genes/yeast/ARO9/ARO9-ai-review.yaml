suggested_questions:
- question: GOA carries aromatic-amino-acid:2-oxoglutarate transaminase (GO:0008793) for ARO9 from PMID:6763508
    and PMID:9491082, while UniProt (citing the same papers) states that Aro9 does not accept 2-oxoglutarate.
    Should the experimental rows be re-mapped to the pyruvate/phenylpyruvate-acceptor terms (GO:0047312,
    GO:0080098, GO:0047299)?
- question: GO has no L-kynurenine:pyruvate transaminase term; is one needed to describe Aro9's kynurenine
    aminotransferase activity accurately?
