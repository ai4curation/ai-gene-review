descriptions:
- source: UniProt
  text: General aromatic amino acid transaminase involved in several otherwise unrelated
    metabolic pathways. Mainly involved in tryptophan degradation. Active with phenylalanine,
    tyrosine and tryptophan as amino donors and with phenylpyruvate, hydroxyphenylpyruvate
    and pyruvate as amino acceptors. Does not accept glutamate or 2- oxoglutarate
    as substrates. Also active with methionine, leucine, glutamine and kynurenine.
    Catalyzes the formation of methionine from 2- keto-4-methylthiobutyrate (KMTB)
    in the methionine salvage pathway primarily using aromatic amino acids (tyrosine,
    phenylalanine and tryptophan) as the amino donors. Catalyzes the irreversible
    transamination of the L-tryptophan metabolite L-kynurenine to form kynurenic acid
    (KA) with pyruvate as amino acceptor.
