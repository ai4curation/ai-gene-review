gene_symbol: LAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: LAT1 (YNL071W; also PDA2/ODP2) encodes the dihydrolipoyllysine-residue acetyltransferase
  (E2, EC 2.3.1.12) of the mitochondrial pyruvate dehydrogenase (PDH) complex. Lat1p carries a covalently
  bound lipoyl cofactor on its N-terminal lipoyl domain. Its C-terminal catalytic domain transfers the
  acetyl group from acetyl-dihydrolipoyl-E2 to coenzyme A, forming acetyl-CoA (written in the reverse
  direction in UniProt). The catalytic domain self-assembles into a 60-mer pentagonal-dodecahedral core.
  E1 (Pda1p/Pdb1p) binds to this core, and E3 (Lpd1p) binds through the E3-binding protein Pdx1p. The
  complex sits in the mitochondrial matrix and converts pyruvate to acetyl-CoA and CO2, linking glycolysis
  to the TCA cycle.
