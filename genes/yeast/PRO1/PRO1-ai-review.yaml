taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PRO1 (YDR300C) encodes glutamate 5-kinase (gamma-glutamyl kinase, EC 2.7.2.11), the ProB
  ortholog that phosphorylates L-glutamate with ATP to gamma-glutamyl 5-phosphate, the first step of proline
  biosynthesis. Pro1 is cytosolic and has an amino-acid-kinase domain followed by a C-terminal PUA domain.
  Unlike bacterial and plant enzymes, yeast Pro1 is nearly insensitive to feedback inhibition by physiological
  proline concentrations; the D154N substitution raises gamma-glutamyl kinase and gamma-glutamyl phosphate
  reductase (Pro2) activities, causing proline accumulation and freeze tolerance, consistent with a Pro1-Pro2
  complex that channels the labile intermediate. PRO1 expression is under general amino acid control.
  Loss of Pro1 catalytic activity is also reported to impair selective autophagy of ribosomes.
