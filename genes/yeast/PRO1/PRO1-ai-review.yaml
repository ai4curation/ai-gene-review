suggested_questions:
- question: Is the ribophagy defect of pro1 cells due to proline (or gamma-glutamyl phosphate) depletion,
    or does Pro1 protein contribute directly, e.g. via its PUA domain?
- question: Do Pro1 and Pro2 form a stable complex in yeast that channels gamma-glutamyl phosphate?
suggested_experiments:
- description: Test whether proline supplementation or a catalytically active Pro1 lacking the PUA domain
    rescues ribophagy in pro1 cells.
- description: Co-immunoprecipitation or proximity labelling of Pro1 and Pro2 at endogenous levels.
