descriptions:
- source: UniProt
  text: Catalyzes the transfer of a phosphate group to glutamate to form glutamate
    5-phosphate which rapidly cyclizes to 5-oxoproline.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32264
  source_id: P32264
- source: Alliance_Imported
  text: Cytosolic gamma-glutamyl kinase; catalyzes the first step in proline biosynthesis;
    required for nitrogen starvation-induced ribophagy but not for nonselective autophagy;
    PRO1 has a paralog, YHR033W, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/PRO1
  source_id: SGD:S000002708
- source: Alliance_Automated
  text: Enables glutamate 5-kinase activity. Involved in L-proline biosynthetic process
    and ribophagy. Located in cytosol.
