description: Saccharopine dehydrogenase [NADP+, L-glutamate-forming] (saccharopine reductase, EC 1.5.1.10)
  of Saccharomyces cerevisiae. Lys9 catalyses the NADPH-dependent reductive condensation of L-2-aminoadipate
  6-semialdehyde with L-glutamate to form saccharopine, step 2 of the fungal-specific segment of the alpha-aminoadipate
  lysine pathway, between the Lys2 reductase and Lys1 saccharopine dehydrogenase steps. It follows an
  ordered sequential mechanism with NADPH binding first. The crystal structure (PDB 2AXQ) shows a Rossmann-fold
  NADP-binding domain and a saccharopine dehydrogenase C-terminal domain. Lys9 is an abundant cytosolic
  protein; lys9 mutants accumulate aminoadipate semialdehyde and require lysine. LYS9 expression depends
  on the pathway-specific activator Lys14, which senses aminoadipate semialdehyde.
