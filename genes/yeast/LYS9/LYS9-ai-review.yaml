    summary: SWAT N-terminal GFP library screen scored by eye without co-localisation markers. Lys9 is
      an abundant soluble cytoplasmic enzyme (about 57,500 molecules per cell) with no membrane-association
      motif; a 'cell periphery' call for such a protein most likely reflects cortical cytoplasmic signal
