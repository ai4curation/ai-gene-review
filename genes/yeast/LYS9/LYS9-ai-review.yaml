- term:
    id: GO:0071944
    label: cell periphery
  evidence_type: HDA
  original_reference_id: PMID:26928762
  qualifier: located_in
  review:
    summary: SWAT N-terminal GFP library screen scored by eye without co-localisation markers. Lys9 is
      an abundant soluble cytoplasmic enzyme (about 57,500 molecules per cell) with no membrane-association
      motif; a 'cell periphery' call for such a protein most likely reflects cortical cytoplasmic signal
      rather than plasma-membrane or cell-wall association. Not a meaningful location for Lys9.
    action: MARK_AS_OVER_ANNOTATED
    source_defects:
      - defect_type: OTHER
        resource: SGD
        slot: GO_ID
        requested_change: CHECK
        asserted_value: GO:0071944
        cause: OTHER
        confidence: PROBABLE
        explanation: >-
          The Yofe et al. SWAT result was an N-terminal GFP visual call from a
          library driven by a constitutive promoter and scored without
          co-localization markers. The SWAT collection required a duplicate
          repeating localization assignment and PCR validation, so the screen
          call should be treated as reproducible rather than unsupported.
          Nevertheless, LYS9 is an abundant soluble NADP(+),
          L-glutamate-forming saccharopine reductase that is independently
          annotated to cytoplasm and modeled in cytosol in the SGD and PomBase
          lysine-biosynthesis GO-CAMs. The cell-periphery row is likely a
          reproducible overexpression/cortical-background call; please
          check whether it should be deleted rather than retained as a native
          LYS9 localization.
        supported_by:
          - reference_id: PMID:26928762
            supporting_text: Only strains with a duplicate repeating localization assignment and validated by PCR were chosen to compose the SWAT-GFP and SWAP-SP-GFP collections
          - reference_id: PMID:26928762
            supporting_text: Since no co-localization markers were used we only assigned localizations that
              could be easily discriminated by eye
    supported_by:
    - reference_id: PMID:26928762
      supporting_text: Since no co-localization markers were used we only assigned localizations that
        could be easily discriminated by eye
