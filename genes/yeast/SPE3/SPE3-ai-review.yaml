    label: L-methionine salvage
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-351
  review:
    summary: YeastPathways RCA inherited from the 'superpathway of methionine salvage' (PWY3O-351), which chains
      polyamine synthesis to MTA salvage. Spe3 produces MTA as a co-product of spermidine synthesis but performs
      no step that regenerates methionine; the salvage steps are catalysed by Meu1, Mri1, Mde1, Utr4, Adi1 and the
      transaminases.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Superpathway inflation: generating the salvage substrate is not participating in methionine salvage.'
