description: 'Spermidine synthase (putrescine aminopropyltransferase, EC 2.5.1.16) of Saccharomyces cerevisiae,
  a member of the spermidine/spermine synthase family that transfers the aminopropyl group of decarboxylated S-adenosylmethionine
  to putrescine, forming spermidine and 5''-methylthioadenosine. Spe3 is the only spermidine synthase in yeast:
  spe3 null mutants lack spermidine synthase activity and have an absolute requirement for spermidine (or high spermine),
  which is needed for hypusine modification of eIF5A and growth. Spermidine is further converted to spermine by
  Spe4, with which Spe3 interacts. Spe3 is a cytosolic enzyme; its MTA product feeds the methionine salvage pathway.'
