  evidence_type: IPI
  original_reference_id: PMID:16429126
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q12455
  review:
    summary: High-throughput interaction between Spe3 and Spe4 (spermine synthase), detected in the Gavin 2006 TAP-MS
      complex survey. A Spe3-Spe4 association is biologically plausible (sequential aminopropyltransferases sharing
      dcAdoMet; plant SPDS/SPMS form hetero-complexes), but 'protein binding' does not describe the activity of
      either enzyme.
    action: REMOVE
    reason: Reproducible across three independent screens (AP-MS, Y2H, interactome) and biologically plausible,
      but bare protein binding carries no functional information; removal does not imply the interaction is false.
      A confirmed Spe3-Spe4 complex would be better captured as a complex term.
