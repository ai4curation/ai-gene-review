- source: Alliance_Automated
  text: Enables FMN adenylyltransferase activity. Involved in FAD biosynthetic process.
    Located in cytosol and mitochondrion. Used to study cancer. Human ortholog(s)
    of this gene implicated in muscular dystrophy. Orthologous to human FLAD1 (flavin
    adenine dinucleotide synthetase 1).
