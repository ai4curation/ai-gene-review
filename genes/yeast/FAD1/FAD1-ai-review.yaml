  review:
    summary: Bruni et al. 2021 detected natural Fad1 in purified mitochondria (anti-FADS antiserum) and
      showed membrane-potential-dependent import of tagged Fad1; abundance depends on carbon source. This
      contrasts with Wu et al. 1995, who found no mitochondrial FAD synthetase activity in wild type,
      so the mitochondrial pool is minor/conditional.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:34575116
      supporting_text: we showed that a natural Fad1p exists in yeast mitochondria and that, in its recombinant
        form, the protein is able, per se, to both enter mitochondria and to be destined to cytosol
    - reference_id: PMID:34575116
      supporting_text: Thus, the Fad1p content in mitochondria seems to depend on the carbon source.
