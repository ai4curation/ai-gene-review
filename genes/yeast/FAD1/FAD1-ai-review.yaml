  label: Saccharomyces cerevisiae S288C
description: FAD1 (YDL045C) encodes FAD synthase (FMN adenylyltransferase, EC 2.7.7.2), the essential
  enzyme that adenylates FMN with ATP to form FAD, the last step of FAD biosynthesis from riboflavin.
  Fad1 is a 306-residue Mg2+-dependent member of the PAPS reductase (ATP pyrophosphatase) fold family,
  unrelated to the bacterial bifunctional RibF FAD synthetases; its crystal structure has been solved
  in complex with FAD. FAD1 disruption is lethal. Fad1 is mainly cytosolic, supplying FAD to extramitochondrial
  flavoproteins and to the mitochondrial FAD carrier Flx1, but a mitochondrial Fad1 pool has also been
  detected, whose abundance depends on carbon source and possibly on alternative FAD1 mRNA 3'UTRs.
