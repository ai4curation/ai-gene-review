suggested_questions:
- question: How large and how physiologically important is the mitochondrial Fad1 pool relative to FAD
    import via Flx1, given that Wu et al. (1995) detected no mitochondrial FAD synthetase activity in
    wild type?
- question: Is there any nuclear Fad1 in S. cerevisiae (as suggested by S. pombe GFP data and rat nuclear
    FADS)?
suggested_experiments:
- description: Endogenous FAD1 tagging with organelle markers on glucose vs glycerol, combined with 3'UTR-swap
    alleles, to test 3'UTR-dependent mitochondrial targeting.
