id: P28777
gene_symbol: ARO2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ARO2 encodes chorismate synthase (EC 4.2.3.5) of Saccharomyces cerevisiae, the seventh and
  last enzyme of the shikimate pathway, which catalyses the 1,4-trans-elimination of phosphate from 5-enolpyruvylshikimate
  3-phosphate (EPSP) to give chorismate, the branch-point precursor of phenylalanine, tyrosine, tryptophan,
  p-aminobenzoate and p-hydroxybenzoate. The reaction is redox-neutral but requires reduced FMN; like
  the Neurospora enzyme, yeast Aro2 is bifunctional and carries an intrinsic NADPH-dependent flavin (FMN)
  reductase activity that supplies the reduced cofactor. The protein forms a D2-symmetric homotetramer
  with a novel beta-alpha-beta-alpha fold, is cytosolic, and its gene is induced by GCN4 under amino acid
  starvation. aro2 mutants require aromatic amino acids and homozygous aro2 diploids fail to sporulate.
