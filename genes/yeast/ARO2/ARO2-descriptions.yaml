descriptions:
- source: UniProt
  text: Bifunctional chorismate synthase and flavin reductase that catalyzes the conversion
    of 5-enolpyruvylshikimate 3-phosphate (EPSP) to form chorismate, which is the
    last common intermediate in the synthesis of the three aromatic amino acids phenylalanine,
    tyrosine and tryptophan (PubMed:8971708). Also acts as a flavin reductase (FR)
    able to generate reduced flavin mononucleotide in the presence of NADPH (PubMed:8971708).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P28777
  source_id: P28777
- source: Alliance_Imported
  text: Bifunctional chorismate synthase and flavin reductase; catalyzes the conversion
    of 5-enolpyruvylshikimate 3-phosphate (EPSP) to form chorismate, which is a precursor
    to aromatic amino acids; protein abundance increases in response to DNA replication
    stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARO2
  source_id: SGD:S000003116
- source: Alliance_Automated
  text: Enables FMN reductase (NADPH) activity; chorismate synthase activity; and
    riboflavin reductase (NADPH) activity. Involved in aromatic amino acid biosynthetic
    process. Located in cytoplasm.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ARO2
