gene_symbol: URA8
organism: yeast
uniprot_id: P38627
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the ATP-dependent amination of UTP to CTP with either L-glutamine
    or ammonia as the source of nitrogen. Plays an important role in the regulation
    of phospholipid synthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38627
  source_id: P38627
- source: Alliance_Imported
  text: Minor CTP synthase isozyme (see also URA7); catalyzes the ATP-dependent transfer
    of the amide nitrogen from glutamine to UTP, forming CTP, the final step in de
    novo biosynthesis of pyrimidines; involved in phospholipid biosynthesis; capable
    of forming cytoplasmic filaments termed cytoophidium, especially during conditions
    of glucose depletion; URA8 has a paralog, URA7, that arose from the whole genome
    duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/URA8
  source_id: SGD:S000003864
- source: Alliance_Automated
  text: Enables CTP synthase activity. Involved in CTP biosynthetic process. Located
    in cytoophidium. Human ortholog(s) of this gene implicated in immunodeficiency
    24. Orthologous to human CTPS1 (CTP synthase 1) and CTPS2 (CTP synthase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/URA8
  source_id: SGD:S000003864
fetch_date: '2026-11-01'
