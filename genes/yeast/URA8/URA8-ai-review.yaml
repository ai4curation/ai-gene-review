suggested_questions:
- question: Under which physiological conditions (e.g. stationary phase, lipid demand, nutrient stress)
    does Ura8 contribute substantially to CTP and phospholipid synthesis relative to Ura7, and does filament
    formation regulate Ura8 activity as it does Ura7?
suggested_experiments:
- hypothesis: Ura8 filament assembly inhibits or stores the enzyme in stationary phase
  description: Compare CTP pools and Ura8 specific activity in ura7 cells expressing wild-type or filament-defective
    Ura8 point mutants through growth phases; image Ura8-GFP filaments in parallel.
  experiment_type: genetics / metabolomics / imaging
