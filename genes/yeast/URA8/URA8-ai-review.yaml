id: P38627
gene_symbol: URA8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'URA8 (YJR103W) encodes CTP synthase 2, the minor of the two S. cerevisiae CTP synthases
  (78% identical to the major isozyme Ura7). It catalyses the final step of de novo pyrimidine ribonucleotide
  synthesis, the ATP-dependent amination of UTP to CTP using the amide nitrogen of glutamine (or ammonia),
  via an N-terminal synthetase (amidoligase) domain and a C-terminal class I glutamine amidotransferase
  domain. The purified enzyme is a dimer that tetramerises in the presence of UTP and ATP, is activated
  by GTP and is feedback-inhibited by CTP, which makes UTP kinetics cooperative. URA8 and URA7 are functionally
  overlapping: either alone supports growth but the double null is lethal. CTP supply links the enzyme
  to phospholipid (CDP-diacylglycerol, CDP-choline/ethanolamine) synthesis. Ura8 is cytosolic and, like
  Ura7, assembles into cytoplasmic filaments (cytoophidia) together with Ura7.'
