suggested_questions:
- question: Is Gad1 activity regulated by Ca2+/calmodulin in vivo, as for plant GADs, given the reported
    calmodulin binding of the yeast enzyme?
suggested_experiments:
- description: Purify recombinant Gad1 and measure glutamate decarboxylase kinetics with and without Ca2+/calmodulin
    to test whether the reported calmodulin binding regulates activity.
