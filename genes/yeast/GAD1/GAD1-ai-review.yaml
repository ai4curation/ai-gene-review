  label: Saccharomyces cerevisiae S288C
description: Glutamate decarboxylase (Gad1p, YMR250W), a cytosolic pyridoxal 5'-phosphate-dependent group
  II decarboxylase that converts L-glutamate to 4-aminobutanoate (GABA) and CO2 (EC 4.1.1.15). This is
  the first, committed step of the GABA shunt, in which GABA is transaminated by Uga1p to succinate semialdehyde
  and oxidised by Uga2p to succinate, bypassing the 2-oxoglutarate dehydrogenase and succinyl-CoA synthetase
  steps of the TCA cycle. Increased Gad1 dosage raises tolerance to H2O2 and diamide only when the downstream
  shunt enzymes are present, linking glutamate catabolism through GABA to redox buffering. Like plant
  GADs, the yeast enzyme cross-reacts with plant GAD antiserum and has been reported to bind calmodulin.
