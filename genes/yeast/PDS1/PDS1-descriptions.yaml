descriptions:
- source: UniProt
  text: Regulatory protein, which plays a central role in chromosome stability. Probably
    acts by blocking the action of key proteins. During the mitosis, it blocks Separase/ESP1
    function, preventing the proteolysis of the cohesin complex and the subsequent
    segregation of the chromosomes. At the onset of anaphase, it is ubiquitinated,
    conducting to its destruction and to the liberation of ESP1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40316
