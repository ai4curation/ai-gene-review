gene_symbol: PDS1
organism: yeast
uniprot_id: P40316
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Regulatory protein, which plays a central role in chromosome stability. Probably
    acts by blocking the action of key proteins. During the mitosis, it blocks Separase/ESP1
    function, preventing the proteolysis of the cohesin complex and the subsequent
    segregation of the chromosomes. At the onset of anaphase, it is ubiquitinated,
    conducting to its destruction and to the liberation of ESP1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40316
  source_id: P40316
- source: Alliance_Imported
  text: Securin; inhibits anaphase by binding separin Esp1p; blocks cyclin destruction
    and mitotic exit, essential for meiotic progression and mitotic cell cycle arrest;
    localization is cell-cycle dependent and regulated by Cdc28p phosphorylation
  source_type: curated
  url: https://www.yeastgenome.org/locus/PDS1
  source_id: SGD:S000002520
- source: Alliance_Automated
  text: Enables enzyme binding activity. Involved in several processes, including
    negative regulation of exit from mitosis; nuclear division; and recombinational
    repair. Located in cytoplasm; nucleus; and spindle. Part of separase-securin complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/PDS1
  source_id: SGD:S000002520
