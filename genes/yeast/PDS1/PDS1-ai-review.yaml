    label: intracellular protein localization
  evidence_type: IMP
  original_reference_id: PMID:11149918
  qualifier: involved_in
  review:
    summary: >-
      In pds1 mutants Esp1 fails to accumulate in the nucleus and to associate
      with the spindle; an Esp1-NLS fusion restores nuclear entry but not full
      spindle binding, and premature expression of non-degradable Pds1 drives
      early nuclear accumulation of Esp1. Pds1 therefore targets Esp1 to the
      nucleus and subsequently to the spindle.
    action: MODIFY
    reason: >-
      The function is real and Pds1 does the work (it is required and, in
      Hornig et al., sufficient for separase nuclear accumulation), but the
      term is too general. The evidence supports the specific descendants
      protein localization to nucleus (defined as a process in which a protein
      transports or maintains the localization of another protein to the
      nucleus) and protein localization to mitotic spindle.
