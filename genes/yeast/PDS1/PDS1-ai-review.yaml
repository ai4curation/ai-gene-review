core_functions:
- description: >-
    Pseudosubstrate inhibition of the separase Esp1: Pds1 residues 258-269
    occupy the cysteine-endopeptidase active site, with Pro263 at the P1
    position preventing cleavage, and the extended separase-interaction segment
    holds Esp1 inactive in the nucleus until APC/C-Cdc20-mediated destruction
    of Pds1 at anaphase onset; checkpoint-dependent stabilisation of Pds1
    prolongs this restraint after DNA damage or spindle defects.
  molecular_function:
    id: GO:0004869
    label: cysteine-type endopeptidase inhibitor activity
