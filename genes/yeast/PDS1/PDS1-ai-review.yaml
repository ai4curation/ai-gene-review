proposed_new_terms: []
suggested_questions:
- question: >-
    Which Pds1 residues or segments are responsible for the activating,
    chaperone-like effect on Esp1 (full proteolytic competence after securin
    destruction), and are they separable from the active-site pseudosubstrate
    segment 258-269?
- question: >-
    How does Pds1 promote meiotic double-strand-break formation and
    synaptonemal complex assembly in prophase I, and is this mediated by
    precocious Mcd1 destruction or by an Esp1-independent activity?
- question: >-
    Is the single-strand-annealing repair defect of pds1 mutants a direct
    consequence of unrestrained separase cleaving cohesin at breaks, or does
    it reflect loss of the checkpoint-imposed arrest?
suggested_experiments:
- hypothesis: >-
    Pds1 carries a separase-activation function that is genetically separable
    from active-site inhibition.
  description: >-
    Generate structure-guided Pds1 alleles that delete or mutate the
    active-site segment (258-269) while preserving the domain III/IV contacts
    (271-316), and the converse, and assay Esp1 solubility, nuclear
    accumulation, Scc1 cleavage kinetics after Pds1 degradation, and chromosome
    loss in vivo.
  experiment_type: Separation-of-function mutagenesis with biochemical and live-cell readouts
- hypothesis: >-
    The meiotic prophase I defects of pds1 cells are caused by unrestrained
    Esp1 activity rather than by an Esp1-independent Pds1 function.
  description: >-
    Combine pds1 deletion with a protease-dead or non-degradable-inhibitor
    esp1 allele, or with non-cleavable Mcd1 and Rec8, and score DSB formation,
    synaptonemal complex assembly and prophase I exit.
  experiment_type: Epistasis analysis in synchronous meiosis
