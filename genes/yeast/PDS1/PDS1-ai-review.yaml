    reference_section_type: ABSTRACT
    full_text_unavailable: true
- description: >-
    Separase chaperone and targeting factor: Pds1 binds Esp1 in the cytoplasm
    during S phase, drives its accumulation in the nucleus and its loading onto
    spindle pole bodies and midzone, stabilises the separase fold through
    contacts outside the active site, and is required for Esp1 to attain full
    proteolytic activity toward Scc1/Mcd1 once Pds1 has been degraded.
