- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IGI
  original_reference_id: PMID:27325700
  qualifier: involved_in
  supporting_entities:
  - SGD:S000002161
  review:
    summary: >-
      IGI with MCD1/SCC1 (SGD:S000002161). Pakchuen et al. showed that
      combining pds1 deletion with a Scc1 allele lacking the Cdc5 priming
      phosphorylation sites (scc1-15A) causes marked sensitivity to phleomycin,
      to HO-induced double-strand breaks and to UV, with pds1 deletion alone
      reducing UV survival.
    action: ACCEPT
    reason: >-
      Pds1 is the classical effector of the DNA-damage checkpoint in budding
      yeast: Mec1/Chk1-dependent phosphorylation stabilises it so that Esp1
      stays inhibited and anaphase is blocked after damage (PMID:15533838,
      PMID:12050115 background). Pds1 therefore does the work of the response
      (the inhibiting), and the broad term is appropriate for a genetic
      interaction. Consistent with the recombinational-repair rows.
    additional_reference_ids:
    - PMID:15533838
    supported_by:
    - reference_id: PMID:27325700
      supporting_text: The same scc1-15A pds1Δ double mutant, however, exhibits marked sensitivity to the DNA-damaging agent phleomycin
      reference_section_type: ABSTRACT
    - reference_id: PMID:27325700
      supporting_text: When irradiated with 254 nm UV light at 50 J/m2, the pds1Δ mutant showed reduced viability, compared with wild type
      reference_section_type: RESULTS
- term:
    id: GO:0007127
    label: meiosis I
  evidence_type: IMP
  original_reference_id: PMID:19001291
  qualifier: involved_in
  review:
    summary: >-
      Cooper et al. showed that Pds1 destruction is required for the metaphase
      I to anaphase I transition, that pds1 null cells arrest in prophase I
      with defects in meiotic double-strand-break formation and synaptonemal
      complex assembly, and that Mcd1 is precociously destroyed in meiotic
      pds1 cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      Well-supported IMP with full text available. Pds1 does participate in
      meiosis I both as the separase inhibitor whose destruction times
      anaphase I and, unexpectedly, in maintaining Mcd1 and permitting
      recombination during prophase I. The broad term was chosen by the
      curator to cover these several facets and is retained; it is graded
      non-core because the meiotic programme reuses the mitotic
      securin-separase switch and the prophase-I roles are mechanistically
      unresolved.
    supported_by:
    - reference_id: PMID:19001291
      supporting_text: Similar to its mitotic function, Pds1p destruction is required for metaphase I-anaphase I transition.
      reference_section_type: ABSTRACT
    - reference_id: PMID:19001291
      supporting_text: Pds1p is required for recombination in both double-strand-break formation and synaptonemal complex assembly
      reference_section_type: ABSTRACT
- term:
