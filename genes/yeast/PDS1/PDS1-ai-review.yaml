  review:
    summary: >-
      Live-cell imaging of Pds1-GFP after release from G1 arrest showed the
      protein accumulating almost exclusively in the nucleus through S phase
      and G2, disappearing at the metaphase-anaphase transition apart from a
      spindle-associated fraction.
