    action: MODIFY
    reason: >-
      Not wrong, but far too shallow to be useful. The securin domain's
      function is to inhibit separase and thereby prevent premature
      sister-chromatid separation; the experimental record for Pds1 supports
      the specific term negative regulation of mitotic sister chromatid
      separation, which is also how the PTTG1 and Cut2 reviews resolved the
      same mapping.
