id: P40316
gene_symbol: PDS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  PDS1 encodes securin, a largely intrinsically disordered nuclear protein that
  is the stoichiometric binding partner and inhibitor of the separase Esp1, a
  cysteine endopeptidase. From S phase until metaphase Pds1 holds Esp1 in a
  separase-securin complex: its C-terminal separase-interaction segment
  traverses all Esp1 domains and residues 258-269 occupy the separase active
  site as an uncleavable pseudosubstrate, blocking access of the cohesin
  kleisin Scc1/Mcd1. The same interaction is an activating, chaperone-like
  one, since Pds1 is needed for efficient nuclear accumulation of Esp1, for
  its delivery to the spindle pole bodies and midzone, and for separase to
  attain full proteolytic activity after Pds1 is gone. At the
  metaphase-to-anaphase transition APC/C-Cdc20 ubiquitinates Pds1 through its
  N-terminal destruction box and the proteasome destroys it, liberating Esp1 to
  cleave Scc1/Mcd1 and trigger sister-chromatid separation; residual Pds1 is
  cleared by APC/C-Cdh1 in telophase and its persistence delays mitotic exit.
  Pds1 is the effector on which the spindle-assembly and DNA-damage checkpoints
  converge, because Mad2-dependent inhibition of APC/C-Cdc20 and
  Mec1/Chk1-dependent phosphorylation both stabilise it and thereby arrest
  cells before anaphase. Cdc28 phosphorylation of Pds1 strengthens Esp1
  binding, and the protein shuttles between nucleus and cytoplasm through an
  NLS and Msn5-dependent export. Pds1 is destroyed in two waves during meiosis, in anaphase
  I and anaphase II, and pds1 null cells additionally show defects in meiotic
  recombination and prophase I progression, mild DNA-damage sensitivity and
  a defect in single-strand-annealing repair. Pds1 shares no recognisable
  sequence similarity with metazoan securin (PTTG1) or fission-yeast Cut2, but
  is functionally equivalent to them.
existing_annotations:
- term:
    id: GO:0000070
    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:9635435
  qualifier: involved_in
  review:
    summary: >-
      Ciosk et al. showed that Pds1 forms a stable complex with Esp1, that
      APC-dependent destruction of Pds1 is the APC's sole role in triggering
      Scc1 dissociation from chromatids, and that Pds1 is the inhibitor from
      which Esp1 must be liberated for sister separation; pds1 mutants
      mis-segregate chromosomes.
    action: ACCEPT
    reason: >-
      Pds1 is a genuine participant in mitotic sister chromatid segregation
      rather than a mere bystander: it inhibits separase before anaphase and,
      through the same interaction, delivers Esp1 to the nucleus and spindle
      and licenses its full activity (PMID:12123570, PMID:11149918), and pds1
      null cells have elevated chromosome loss (PMID:19001291). The term is
      broad but appropriate for an IMP that captures the whole outcome of the
      Pds1-Esp1 switch; the specific regulatory arm is captured by the MODIFY
      to GO:2000816 elsewhere in this review.
    additional_reference_ids:
    - PMID:12123570
    supported_by:
    - reference_id: PMID:9635435
      supporting_text: Pds1p forms a stable complex with a 180 kDa protein called Esp1p, which is essential for the dissociation of Scc1p from sister chromatids and for their separation
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:9635435
      supporting_text: "destruction of Pds1p is the APC's sole role in triggering Scc1p's dissociation from chromatids"
      reference_section_type: ABSTRACT
      full_text_unavailable: true
- term:
    id: GO:0000725
    label: recombinational repair
  evidence_type: IGI
  original_reference_id: PMID:15533838
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000897
  review:
    summary: >-
      IGI with RAD51 (SGD:S000000897). DeMase et al. found that pds1 rad51
      double mutants were not more radiation sensitive than the single mutants
      (epistasis), while pds1 rad9 double mutants were synergistic, placing
      PDS1 in a RAD51-dependent double-strand-break repair pathway; pds1
      mutants were specifically defective in single-strand annealing but
      normal for sister-chromatid exchange.
    action: KEEP_AS_NON_CORE
    reason: >-
      The genetic evidence is sound and the curator read the full text, so the
      annotation is retained. It is non-core because Pds1 does not itself act
      on DNA: its contribution to repair is most plausibly indirect, through
      checkpoint-dependent stabilisation of Pds1 that keeps separase inhibited
      and cohesin intact while breaks are repaired (the paper's own framing).
      The SSA-specific defect could justify the more specific descendant
      GO:0045002 (double-strand break repair via single-strand annealing) but
      the cache is abstract-only, so the curator's choice of the parent term
      is deferred to.
    supported_by:
    - reference_id: PMID:15533838
      supporting_text: whereas pds1 rad9 double mutants were synergistically more radiation sensitive than single mutants, pds1 rad51 mutants were not
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:15533838
      supporting_text: the pds1 mutant was defective in SSA but efficient at ligating cohesive ends present on a linear plasmid
      reference_section_type: ABSTRACT
      full_text_unavailable: true
- term:
    id: GO:0000725
    label: recombinational repair
  evidence_type: IGI
  original_reference_id: PMID:15533838
  qualifier: involved_in
  supporting_entities:
  - SGD:S000002625
  review:
    summary: >-
      IGI with RAD9 (SGD:S000002625). pds1 rad9 double mutants are
      synergistically more radiation sensitive than either single mutant,
      indicating that PDS1 and RAD9 control different DNA double-strand break
      repair pathways.
    action: KEEP_AS_NON_CORE
    reason: >-
      Same paper and same reasoning as the RAD51 IGI row: the synergy is real
      and experimentally established, but Pds1's role in repair is a
      consequence of its checkpoint-effector/separase-inhibitor function
      rather than direct participation in recombination, so it is kept as a
      non-core process.
    supported_by:
    - reference_id: PMID:15533838
      supporting_text: whereas pds1 rad9 double mutants were synergistically more radiation sensitive than single mutants, pds1 rad51 mutants were not
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:15533838
      supporting_text: PDS1 and RAD9 have different roles in recombinational repair
      reference_section_type: ABSTRACT
      full_text_unavailable: true
- term:
    id: GO:0000725
    label: recombinational repair
  evidence_type: IMP
  original_reference_id: PMID:15533838
  qualifier: involved_in
  review:
    summary: >-
      pds1 mutants are radiation sensitive, show reduced viability after
      X-ray, UV and MMS exposure despite normal spontaneous and damage-induced
      sister-chromatid exchange, and are defective in single-strand annealing
      repair of an HO-induced double-strand break.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retained on the strength of the mutant phenotype and the curator's
      full-text reading, but classed non-core: Pds1 has no DNA-transacting
      activity, and the repair defect is best explained by loss of the
      checkpoint-imposed pre-anaphase arrest and of cohesin protection that
      Pds1 provides by inhibiting Esp1. The abstract explicitly states that
      Pds1 acts by blocking anaphase promotion.
    supported_by:
    - reference_id: PMID:15533838
      supporting_text: In response to DNA damage, the Saccharomyces cerevisiae securin Pds1 blocks anaphase promotion by inhibiting ESP1-dependent degradation of cohesins.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:15533838
      supporting_text: The rates of spontaneous SCE and frequencies of DNA damage-associated SCE were similar in wild type and pds1 strains, but the latter exhibited reduced viability after exposure to DNA damaging agents.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
- term:
    id: GO:0001100
    label: negative regulation of exit from mitosis
  evidence_type: IMP
  original_reference_id: PMID:27418100
  qualifier: involved_in
  review:
    summary: >-
      Hatano et al. showed that the fraction of securin that survives the
      metaphase-anaphase transition still inhibits separase in anaphase and
      thereby represses mitotic exit; APC/C-Cdh1-mediated destruction of the
      remaining Pds1 in telophase liberates separase, which promotes Cdc14
      release and mitotic exit in a positive-feedback loop.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is a direct regulatory activity of Pds1 (it does the inhibiting), so
      the annotation is correct and the participation test is met. It is
      graded non-core because it is the same separase-inhibitor activity
      extended into late anaphase, and the late-mitotic role rests on a single
      study whose full text is not cached; the core function is the
      pre-anaphase restraint of sister-chromatid separation.
    supported_by:
    - reference_id: PMID:27418100
      supporting_text: we show that securin still inhibits separase to repress mitotic exit in anaphase in budding yeast
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:27418100
      supporting_text: APC/C-Cdh1-mediated securin degradation at telophase further liberated separase, which promotes Cdc14 release and mitotic exit
      reference_section_type: ABSTRACT
      full_text_unavailable: true
