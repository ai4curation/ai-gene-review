- id: PMID:11149918
  title: 'A novel role of the budding yeast separin Esp1 in anaphase spindle elongation:
    evidence that proper spindle association of Esp1 is regulated by Pds1.'
  findings:
  - statement: >-
      Pds1-GFP accumulates almost exclusively in the nucleus through S phase
      and a fraction persists on spindle pole bodies and the spindle midzone in
      anaphase.
    supporting_text: Pds1 interacts with the spindle at the metaphase-anaphase transition and a fraction remains at the spindle pole bodies and the spindle midzone in anaphase cells
    reference_section_type: ABSTRACT
  - statement: >-
      Pds1 binding during S phase is required for efficient nuclear targeting
      of Esp1 and for its subsequent spindle association; an Esp1-NLS fusion
      does not fully restore spindle binding in pds1 mutants.
    supporting_text: Association with Pds1 occurs during S phase and is required for efficient nuclear targeting of Esp1.
    reference_section_type: ABSTRACT
  - statement: >-
      Pds1 and Esp1 co-immunoprecipitate; the Esp1 N-terminus (1-535)
      interacts with the Pds1 C-terminus (300-373) by two-hybrid.
    supporting_text: The level of coprecipitated Pds1-128 protein was significantly lower than the amount of Pds1 present in the immunoprecipitated wild-type sample
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; directly reports Pds1 localisation and the requirement
      of Pds1 for Esp1 nuclear and spindle targeting.
