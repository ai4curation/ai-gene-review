- term:
    id: GO:0051306
    label: mitotic sister chromatid separation
  evidence_type: IDA
  original_reference_id: PMID:12123570
  qualifier: involved_in
  review:
    summary: >-
      ComplexPortal-derived IDA for the separase-securin complex. Hornig et al.
      showed that securin both directly inhibits separase proteolytic activity
      and is required for separase to accumulate in the nucleus and to gain
      full proteolytic activity in anaphase after securin's own destruction.
    action: ACCEPT
    reason: >-
      Pds1 passes the participation test for this process through its
      activating, chaperone-like arm: without it separase is mislocalised and
      catalytically incompetent, so cohesin cleavage and sister separation
      depend on prior Pds1 binding. The inhibitory arm is captured separately
      by GO:2000816. Accepted as core.
    supported_by:
    - reference_id: PMID:12123570
      supporting_text: securin is required to support separase activity in anaphase
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:12123570
      supporting_text: Securin also ensures that separase gains full proteolytic activity in anaphase.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
