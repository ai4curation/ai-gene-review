  review:
    summary: >-
      IntAct-derived IPI with Esp1 (UniProtKB:Q03018) from the Yu et al.
      high-throughput yeast two-hybrid interactome map. The interaction is
      genuine and is the defining securin-separase contact, but the generic
      term conveys no functional information.
    action: MODIFY
    reason: >-
      Bare protein binding is uninformative. The Pds1-Esp1 interaction
      detected here is the one shown by biochemistry (PMID:12123570) and
      crystallography (PMID:28146474) to place Pds1 residues 258-269 in the
      separase active site and block substrate access, so the informative
      molecular function is cysteine-type endopeptidase inhibitor activity
      (Esp1 is a caspase-like cysteine protease). The cached record is
      abstract-only and does not mention Pds1, so no verbatim quote for the
      specific pair is available.
    proposed_replacement_terms:
    - id: GO:0004869
      label: cysteine-type endopeptidase inhibitor activity
