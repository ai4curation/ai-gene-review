suggested_questions:
- question: Is the G1 arrest of ore2/pro3 ts mutants a specific checkpoint response to proline limitation,
    or general amino acid starvation?
suggested_experiments:
- description: Determine the NADH versus NADPH preference of purified Pro3 under physiological cofactor
    concentrations.
