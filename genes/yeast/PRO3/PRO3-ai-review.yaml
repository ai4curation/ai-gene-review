  label: Saccharomyces cerevisiae S288C
description: 'PRO3 (YER023W; ORE2) encodes delta1-pyrroline-5-carboxylate reductase (EC 1.5.1.2), which
  reduces P5C to L-proline with NADPH or NADH in the final step of proline biosynthesis. It is a homo-oligomeric
  cytosolic enzyme; keeping it in the cytosol, apart from mitochondrial P5C dehydrogenase (Put2), prevents
  futile proline/P5C cycling. Pro3 also reduces P5C formed in the cytosol from arginine via ornithine,
  so arginine can supply proline in pro1 and pro2 mutants. Pro3 is the only P5C reductase in yeast: pro3
  mutants are strict proline auxotrophs, and temperature-sensitive alleles (ore2) arrest in G1 unless
  proline is supplied.'
