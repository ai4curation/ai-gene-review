  source_id: SGD:S000000825
- source: Alliance_Automated
  text: Enables identical protein binding activity and pyrroline-5-carboxylate reductase
    activity. Involved in L-proline biosynthetic process. Located in cytosol. Human
    ortholog(s) of this gene implicated in autosomal recessive cutis laxa type IIB;
    autosomal recessive cutis laxa type IIIB; and hypomyelinating leukodystrophy 10.
    Orthologous to human PYCR1 (pyrroline-5-carboxylate reductase 1); PYCR2 (pyrroline-5-carboxylate
    reductase 2); and PYCR3 (pyrroline-5-carboxylate reductase 3).
  source_type: automated
