descriptions:
- source: UniProt
  text: Multifunctional enzyme acting as 1,4-alpha-D-glucan:1,4- alpha-D-glucan 4-alpha-D-glycosyltransferase
    and amylo-1,6-glucosidase in glycogen degradation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q06625
  source_id: Q06625
- source: Alliance_Imported
  text: Glycogen debranching enzyme; contains glucanotranferase and alpha-1,6-amyloglucosidase
    activities; required for glycogen degradation; phosphorylated in mitochondria;
    activity is inhibited by Igd1p; protein abundance increases in response to DNA
    replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GDB1
  source_id: SGD:S000006388
- source: Alliance_Automated
  text: Enables 4-alpha-glucanotransferase activity and amylo-alpha-1,6-glucosidase
    activity. Involved in glycogen catabolic process. Located in mitochondrion. Human
    ortholog(s) of this gene implicated in glycogen storage disease III. Orthologous
    to human AGL (amylo-alpha-1,6-glucosidase and 4-alpha-glucanotransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GDB1
  source_id: SGD:S000006388
