suggested_questions:
- question: Does Igd1 inhibition of Gdb1 act on both catalytic half-reactions or only one, and is it the
    main post-translational control on yeast debranching?
- question: Is the mitochondrial detection of Gdb1 in proteomic surveys a co-purification artefact of
    glycogen particles, or is there a genuine organelle-associated pool?
suggested_experiments:
- hypothesis: Igd1 inhibits only one of the two Gdb1 catalytic sites.
  description: Assay separated transferase and glucosidase activities of purified Gdb1 point mutants (GH13
    vs GH133 catalytic residues) with and without Igd1 to map the inhibited site.
