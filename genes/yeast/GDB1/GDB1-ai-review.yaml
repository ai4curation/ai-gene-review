id: Q06625
gene_symbol: GDB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GDB1 (YPR184W) encodes the glycogen debranching enzyme of Saccharomyces cerevisiae, a 1536-residue
  cytosolic bifunctional protein homologous to mammalian AGL. Its N-terminal alpha-amylase (GH13) region
  carries 4-alpha-glucanotransferase activity (EC 2.4.1.25), which moves maltosyl/maltotriosyl units from
  the short outer chains left by glycogen phosphorylase (Gph1) onto another chain, and its C-terminal
  GH133 region carries amylo-alpha-1,6-glucosidase activity (EC 3.2.1.33), which releases the remaining
  alpha-1,6-linked glucose stub as free glucose. Together with Gph1 it completes cytosolic glycogenolysis;
  gdb1 deletion blocks glycogen degradation. GDB1 is co-regulated with the other glycogen genes (induced
  at the diauxic shift and by stress) and its activity is inhibited by the small fermentation-stress protein
  Igd1.
