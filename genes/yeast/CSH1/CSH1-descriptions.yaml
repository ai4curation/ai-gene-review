descriptions:
- source: UniProt
  text: Involved in the synthesis of mannosyl phosphorylinositol ceramide (PubMed:12954640).
    Catalyzes the addition of mannosyl to phosphorylinositol ceramide (PubMed:12954640).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38287
  source_id: P38287
- source: Alliance_Imported
  text: Mannosylinositol phosphorylceramide (MIPC) synthase catalytic subunit; forms
    a complex with regulatory subunit Csg2p; function in sphingolipid biosynthesis
    is overlapping with that of Sur1p; CSH1 has a paralog, SUR1, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/CSH1
  source_id: SGD:S000000365
- source: Alliance_Automated
  text: Enables inositol phosphorylceramide mannosyltransferase activity. Involved
    in glycosphingolipid biosynthetic process and mannosyl diphosphorylinositol ceramide
    metabolic process. Located in Golgi apparatus. Part of mannosyltransferase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CSH1
  source_id: SGD:S000000365
