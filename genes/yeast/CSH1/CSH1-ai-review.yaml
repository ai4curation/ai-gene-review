id: P38287
gene_symbol: CSH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'CSH1 (YBR161W) encodes a GT32-family multi-pass membrane glycosyltransferase that mannosylates inositol
  phosphorylceramide (IPC) using GDP-mannose to form mannosyl-inositol phosphorylceramide (MIPC), the precursor
  of M(IP)2C. It is a paralog of Sur1/Csg1 and acts redundantly with it: csg1 cells only reduce mannosylated sphingolipid
  synthesis, while csg1 csh1 double mutants make none. Csh1 forms a separate complex with the regulatory subunit
  Csg2, which it absolutely requires for activity, and it differs from Csg1 in ceramide-substrate specificity (revealed
  in ipt1, sur2 and scs7 backgrounds). Its biosynthetic activity is assigned to the Golgi, although high-throughput
  GFP screens detect the tagged protein at the vacuolar membrane.'
