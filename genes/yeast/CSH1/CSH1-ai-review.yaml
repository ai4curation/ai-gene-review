suggested_questions:
- question: Is the vacuolar-membrane signal of Csh1-GFP (two independent screens) a turnover artefact, or does a
    post-Golgi pool of the Csh1-Csg2 enzyme mannosylate IPC at the vacuole?
- question: Which ceramide features (hydroxylation state, chain length) distinguish Csh1 from Csg1 substrate preference?
suggested_experiments:
- hypothesis: Csh1 is active in the Golgi and only transits to the vacuole for degradation
  description: Endogenously tagged Csh1 colocalisation with medial/late Golgi markers in pep4 versus wild-type cells,
    with MIPC synthesis measured in Golgi- versus vacuole-enriched fractions.
  experiment_type: cell biology / lipidomics
