- id: PMID:35713525
  title: Pleiotropic roles of N-glycans for enzyme activities and stabilities of MIPC
    synthases, Csh1 and Sur1/Csg1, in Saccharomyces cerevisiae.
  findings:
  - statement: N-glycans on Csh1 and Sur1 affect MIPC-subtype synthesis and protein stability.
    supporting_text: Sur1 N224Q and Csh1 N51Q mutants exhibited a decrease in the activity to synthesize
      specific MIPC subtypes for each enzyme, suggesting that these N-glycans play a role in substrate
      recognition through their catalytic domains.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only 2022 Csh1/Sur1 N-glycan paper; corroborates distinct Sur1/Csh1
      MIPC-subtype recognition without requiring any additional GO process annotation.
- id: PMID:42169399
  title: Mannosylinositol Phosphorylceramide Biosynthesis Is Required for Cell Surface
    Adaptation to Ethanol Stress in Saccharomyces cerevisiae.
  findings:
  - statement: Csg1/Csh1-dependent MIPC production is required for ethanol stress tolerance.
    supporting_text: Cells lacking the MIPC synthases Csg1 and Csh1 exhibited pronounced ethanol
      hypersensitivity and loss of viability.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only 2026 double-mutant ethanol-stress paper; useful downstream phenotype
      context, but Csh1 makes MIPC rather than directly executing ethanol-response or cell-wall-integrity
      signaling steps.
