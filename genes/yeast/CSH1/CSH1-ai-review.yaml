  evidence_type: HDA
  original_reference_id: PMID:14562095
  qualifier: located_in
  review:
    summary: 'Huh et al. 2003 GFP screen: vacuole (membrane). Csh1 is a multi-pass glycosyltransferase of the secretory
      pathway; MIPC is made in the Golgi (where Csh1 was placed by Uemura et al.), so a steady-state vacuolar GFP
      signal in a high-throughput screen may reflect delivery of the tagged protein to the vacuole for turnover,
      or a genuine post-Golgi pool, rather than the site of MIPC synthesis. Two independent screens agree, so it
      is not dismissed.'
    action: KEEP_AS_NON_CORE
    reason: Observed location distinct from the site of MIPC synthesis.
