- id: PMID:12954640
  title: Csg1p and newly identified Csh1p function in mannosylinositol phosphorylceramide synthesis by interacting
    with Csg2p.
  findings:
  - statement: Csg1 and Csh1 redundantly synthesize MIPC, with Csh1 having different substrate specificity from Csg1.
    supporting_text: Analyses using Deltacsg1 and Deltacsh1 cells in the Deltaipt1, Deltasur2,
      or Deltascs7 genetic background demonstrated that Csh1p has a different substrate specificity from Csg1p.
    reference_section_type: ABSTRACT
  - statement: Csh1 functions with Csg2 in a distinct IPC mannosyltransferase complex.
    supporting_text: These results suggested that two distinct inositol phosphorylceramide
      mannosyltransferase complexes, Csg1p-Csg2p and Csh1p-Csg2p, exist
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct CSH1 genetics and Csg2-interaction paper; the cached abstract contains the
      key MIPC-synthesis, Csh1-specificity, and Csh1-Csg2 complex evidence.
