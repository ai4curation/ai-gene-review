descriptions:
- source: Alliance_Imported
  text: Acetylglutamate kinase and N-acetyl-gamma-glutamyl-phosphate reductase; N-acetyl-L-glutamate
    kinase (NAGK) catalyzes the 2nd and N-acetyl-gamma-glutamyl-phosphate reductase
    (NAGSA), the 3rd step in arginine biosynthesis; synthesized as a precursor which
    is processed in the mitochondrion to yield mature NAGK and NAGSA; enzymes form
    a metabolon complex with Arg2p; NAGK C-terminal domain stabilizes the enzymes,
    slows catalysis and is involved in feed-back inhibition by arginine
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARG56
  source_id: SGD:S000000871
- source: Alliance_Automated
  text: Enables N-acetyl-gamma-glutamyl-phosphate reductase (NADP+) activity and acetylglutamate
    kinase activity. Involved in regulation of DNA-templated transcription. Located
    in mitochondrial matrix. Human ortholog(s) of this gene implicated in N-acetylglutamate
    synthase deficiency and amino acid metabolic disorder. Orthologous to human NAGS
    (N-acetylglutamate synthase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ARG56
