- source: Alliance_Automated
  text: Enables N-acetyl-gamma-glutamyl-phosphate reductase (NADP+) activity and acetylglutamate
    kinase activity. Involved in regulation of DNA-templated transcription. Located
    in mitochondrial matrix. Human ortholog(s) of this gene implicated in N-acetylglutamate
    synthase deficiency and amino acid metabolic disorder. Orthologous to human NAGS
    (N-acetylglutamate synthase).
