descriptions:
- source: Alliance_Imported
  text: Acetylglutamate kinase and N-acetyl-gamma-glutamyl-phosphate reductase; N-acetyl-L-glutamate
    kinase (NAGK) catalyzes the 2nd and N-acetyl-gamma-glutamyl-phosphate reductase
    (NAGSA), the 3rd step in arginine biosynthesis; synthesized as a precursor which
    is processed in the mitochondrion to yield mature NAGK and NAGSA; enzymes form
    a metabolon complex with Arg2p; NAGK C-terminal domain stabilizes the enzymes,
    slows catalysis and is involved in feed-back inhibition by arginine
  source_type: curated
