id: Q01217
gene_symbol: ARG5,6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ARG5,6 of Saccharomyces cerevisiae encodes an 863-residue mitochondrially targeted precursor
  that is proteolytically processed in the mitochondrial matrix into two enzymes of the acetylated branch
  of arginine biosynthesis: N-acetylglutamate kinase (NAGK, EC 2.7.2.8; N-terminal part, ARG6), which
  phosphorylates N-acetyl-L-glutamate, and N-acetyl-gamma-glutamyl-phosphate reductase (EC 1.2.1.38; C-terminal
  part, ARG5), which reduces N-acetylglutamyl phosphate to N-acetylglutamate semialdehyde with NADPH.
  The kinase is feedback-inhibited by arginine and, via an ascomycete-specific C-terminal domain, forms
  a complex with N-acetylglutamate synthase (Arg2) that is required for synthase activity and coordinates
  feedback regulation of the first two steps. Arg5,6 has also been reported to bind specific nuclear and
  mitochondrial DNA loci and to influence transcript levels of target genes.'
