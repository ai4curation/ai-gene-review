  review:
    summary: YeastPathways-derived (GO_REF:0000123) location assigning activity to the cytosol. This enzyme
      of the acetylated (ornithine-producing) part of the yeast arginine pathway is a mitochondrial matrix
      protein, shown by subcellular fractionation and by the cleaved mitochondrial presequence; the cytosol
      term contradicts the experimental location data.
    action: REMOVE
    reason: The RCA conversion appears to assign cytosol as a default compartment for the ARGSYNBSUB-PWY
      pathway. The five enzymes of the acetylated compound cycle are exclusively particulate and mitochondrial
      (PMID:205532); cytosol is not part of the mitochondrion in GO, so the annotation is contradicted
      rather than merely general.
    supported_by:
    - reference_id: PMID:205532
      supporting_text: These enzymes were exclusively particulate.
    - reference_id: PMID:205532
      supporting_text: suggested that these enzymes were associated with the mitochondria
