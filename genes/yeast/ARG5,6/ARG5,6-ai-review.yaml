  evidence_type: IPI
  original_reference_id: PMID:11553611
  qualifier: part_of
  review:
    summary: Proposed reciprocal complex annotation. The acetylglutamate kinase chain derived from Arg5,6
      was identified by microsequencing as the protein co-immunoprecipitating with HA-tagged Arg2, and
      the ascomycete-specific C-terminal domain of the kinase is required for synthase activity. GOA has
      the NAGS/NAGK complex on ARG2 (IPI, same paper) but not on Arg5,6; the kinase is a structural and
      catalytic member of the complex, so the membership applies to it as well.
    action: NEW
    supported_by:
    - reference_id: PMID:11553611
      supporting_text: hemagglutinin-tagged synthase coprecipitated with a protein proven by microsequencing
        to be the kinase
    - reference_id: PMID:12603335
      supporting_text: we demonstrate that the ascomycete-specific domain is required to maintain synthase
        activity and protein level
