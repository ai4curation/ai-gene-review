    summary: >-
      Top-ranked hit (score 20.15), absent from GOA. Sir2's documented histone specificities are H3K9,
      H3K14 and H4K16; H3K18 deacetylation is a SIRT7 activity in mammals and is not among the specificities
      established for Sir2. The call is a within-sirtuin-family residue substitution, and PANTHER
      assigns this protein to both the SIRT1 and SIRT5 subfamily nodes, which is the kind of ambiguity
      that produces exactly this error.
