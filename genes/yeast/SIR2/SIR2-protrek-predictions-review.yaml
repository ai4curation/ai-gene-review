description: >-
  ProTrek sequence-to-text retrieval for yeast SIR2, the founding NAD-dependent sirtuin. This is the
  residue lottery, the chromatin analogue of the substrate lottery seen in CAT2 and rat Slc5a1, and
  the sharpest illustration in the cohort of specificity without reliability. Four of the five calls
  are residue-specific NAD-dependent histone deacetylase activities spanning only 0.97 score units:
  H3K18 (rank 1), H3K14 (rank 2), H3K56 (rank 3) and H4K16 (rank 5). Two of them - H3K14 and H4K16
  - are exact GOA matches. The other two are the specificities of different sirtuins: H3K18 is a SIRT7
  activity in mammals, and H3K56 deacetylation in S. cerevisiae is carried out by Hst3 and Hst4, Sir2's
  own paralogs. A curator receives four confident, near-tied, mutually exclusive-looking residue claims
  and must check every one. Rank 4 is worse than any of them: negative regulation of silent mating-type
  cassette heterochromatin formation is the exact negation of Sir2's single best-known function, which
  GOA holds with IMP support - the same antonym failure seen in worm pink-1 and yeast CDC37, here
  inverting the defining role of the protein. Assessment: 1 correct-not-novel, 2 paralog incorrect.
  Assessment: 1 correct not novel (CNN), 2 paralog incorrect (PLI).
