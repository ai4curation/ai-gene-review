- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: Correct but uninformatively generic term; SIR2's experimentally grounded
      repair involvement is the specific child GO:0006303 (NHEJ), and it is a secondary
      consequence of silencing rather than a core function.
    action: KEEP_AS_NON_CORE
    reason: 'Not an over-annotation. SIR2 carries an IMP annotation to GO:0006303
      (double-strand break repair via nonhomologous end joining), and GO:0006303 is
      a descendant of GO:0006302 which is a descendant of this term (ancestry checked
      against QuickGO), so by the true-path rule DNA repair involvement follows from
      evidence already accepted in this review. What is wrong with the term is only
      its altitude: it is the generic ancestor and says far less than the NHEJ child,
      and SIR2 is not a repair enzyme - its requirement for end joining is a downstream
      consequence of its silencing function, whose mechanism is not established by
      the cached evidence and is not asserted here. Retained as non-core rather than
      removed or flagged as over-annotated.'
    supported_by:
    - reference_id: PMID:9501103
      supporting_text: using an in vivo plasmid rejoining assay, we demonstrate that
        SIR2, SIR3 and SIR4, three genes shown previously to function in TPE, are
        essential for Ku-dependent DSB repair
    - reference_id: PMID:12923057
      supporting_text: Silencing within the yeast rDNA repeats inhibits hyperrecombination
