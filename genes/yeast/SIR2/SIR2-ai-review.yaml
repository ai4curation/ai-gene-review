    label: histone deacetylase activity, NAD-dependent
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: SIR2 is the founding member of NAD-dependent histone deacetylases. The
      crystal structure of Sir2 in complex with a Sir4 fragment (PDB 4IAO; Sir2 captured
      with its catalytic Zn site and an ADP-ribose product) resolves the conserved
      NAD-dependent deacetylase catalytic domain and shows that Sir4 binding allosterically
