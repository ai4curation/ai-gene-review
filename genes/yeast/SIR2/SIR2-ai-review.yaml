- term:
    id: GO:0009435
    label: NAD+ biosynthetic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-4158
  review:
    summary: The SGD NAD biosynthesis superpathway model contains Sir2's NAD-consuming
      deacetylase reaction, but Sir2 does not participate in NAD+ biosynthesis itself.
    action: REMOVE
    reason: Sir2 consumes NAD+ and releases nicotinamide; the downstream salvage
      enzymes synthesize NAD+. The YeastPathways model explains how Sir2's deacetylase
      reaction feeds the salvage cycle by producing a substrate, but Sir2 does not
      do the work of NAD+ biosynthesis, so this RCA process row should not be retained.
