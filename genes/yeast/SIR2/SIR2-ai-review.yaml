- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: Generic term, but correctly applied - the sirtuin reaction is formally
      an acyl transfer, and UniProt classifies SIR2 under EC 2.3.1.286 (EC class 2.3,
      acyltransferases).
    action: KEEP_AS_NON_CORE
    reason: Not an error. SIR2 does not simply hydrolyse the acetyl-lysine bond; it
      consumes NAD+ and transfers the acetyl group onto ADP-ribose, and the UniProt
      record for P06700 records this explicitly - EC 2.3.1.286 and the reaction "N(6)-acetyl-L-lysyl-[protein]
      + NAD(+) + H2O = 2''-O-acetyl-ADP-D-ribose + nicotinamide + L-lysyl-[protein]".
      The GOA row derives from UniProt keyword KW-0808 (Transferase), which UniProt
      assigns on exactly that basis. The term is therefore correct but uninformatively
      generic, so it is kept as non-core in favour of the specific NAD-dependent deacetylase
      terms rather than removed.
    supported_by:
    - reference_id: PMID:10811920
      supporting_text: members of the SIR2 family catalyze an NAD-nicotinamide exchange
        reaction that requires the presence of acetylated lysines
- term:
