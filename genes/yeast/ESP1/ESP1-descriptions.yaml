gene_symbol: ESP1
organism: yeast
uniprot_id: Q03018
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Caspase-like protease, which plays a central role in the chromosome segregation
    by cleaving the MCD1/SCC1 subunit of the cohesin complex at the onset of anaphase.
    During most of the cell cycle, it is inactivated by securin/PDS1 protein. It also
    promotes anaphase spindle elongation. A component of the FEAR (CDC14 early anaphase
    release) network which promotes CDC14 release from the nucleolus during early
    anaphase. Cleaves SLK19.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03018
  source_id: Q03018
- source: Alliance_Imported
  text: Separase/separin, a caspase-like cysteine protease; cleaves Mcd1p/Scc1p, a
    mitotic cohesin complex subunit, resulting in the dissociation of cohesin from
    chromatin and sister chromatid separation; cleaves meiotic-cohesin subunit Rec8p
    along chromosome arms in meiosis I and at centromeric sites during meiosis II;
    inhibits PP2A-Cdc55p to promote mitotic exit; inhibited by Pds1p (securin); relative
    distribution to the nucleus increases upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/ESP1
  source_id: SGD:S000003330
- source: Alliance_Automated
  text: Enables cysteine-type endopeptidase activity. Involved in several processes,
    including negative regulation of protein localization to nucleolus; nuclear division;
    and regulation of cell cycle process. Located in cytoplasm; nucleus; and spindle.
    Part of separase-securin complex. Orthologous to human ESPL1 (extra spindle pole
    bodies like 1, separase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ESP1
  source_id: SGD:S000003330
