- id: file:interpro/panther/PTHR12792/PTHR12792-review.md
  title: 'PANTHER family review PTHR12792: IBA propagation assessment for the separase family'
  findings:
  - statement: >-
      PTHR12792 is the separase family; PAINT node PTN000300670 carries the endopeptidase,
      nucleus, cytoplasm, mitotic spindle and meiotic separation IBDs and PTN000980533 the
      fungal mitotic SPB IBD; all propagations to fungal separases were judged appropriate.
    reference_section_type: OTHER
- id: file:yeast/ESP1/ESP1-deep-research-falcon.md
  title: 'Deep research report (Edison/falcon): ESP1 (YGR098C; UniProt Q03018) in Saccharomyces cerevisiae'
  findings:
  - statement: >-
      Literature synthesis confirming Esp1 as the Scc1/Mcd1-cleaving separase regulated by
      Pds1/APC/C, Cdk1 phosphorylation and PP2A-Cdc55/Slk19; additional substrates Rec8 and
      Slk19; roles in spindle elongation (unknown substrate), the FEAR network and Ty1
      retrotransposition.
    supporting_text: >-
      Slk19 is cleaved by Esp1, but a non-cleavable Slk19 allele does not reproduce the
      spindle-elongation defect, arguing that Slk19 is not that missing substrate.
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Claims cross-checked against the cached primary papers (Ciosk 1998, Uhlmann 2000,
      Buonomo 2000, Jensen 2001, Hornig 2002, Baskerville 2008); the Ty1 and Cdk1-phosphosite
      claims rest on papers not cached here and are not used for annotation decisions.
- id: file:yeast/ESP1/ESP1-uniprot.txt
  title: UniProt entry Q03018 (ESP1_YEAST, Separin)
  findings:
  - statement: >-
      UniProt records Esp1 as a caspase-like protease (EC 3.4.22.49) with active-site Cys1531
      that cleaves MCD1/SCC1 at anaphase onset, is inactivated by PDS1, promotes anaphase
      spindle elongation, is a FEAR network component and cleaves SLK19; located in the nucleus,
      cytoplasm and spindle pole body.
    reference_section_type: DATABASE_ENTRY
- id: PMID:11081625
  title: Cleavage of cohesin by the CD clan protease separin triggers anaphase in
    yeast.
  findings:
  - statement: >-
      Separin/Esp1 is a caspase-related cysteine protease that alone cleaves Scc1 in vitro;
      Scc1 cleavage in metaphase-arrested cells suffices to trigger sister separation and
      segregation.
    supporting_text: >-
      separin is a cysteine protease related to caspases that alone can cleave Sccl in vitro
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Defining biochemical identification of Esp1 as the cohesin-cleaving cysteine protease (abstract-only cache).
- id: PMID:11081626
  title: Disjunction of homologous chromosomes in meiosis I depends on proteolytic
    cleavage of the meiotic cohesin Rec8 by separin.
  findings:
  - statement: >-
      Cleavage of the meiotic kleisin Rec8 by separin at one of two sites is necessary for
      chiasma resolution and homologue disjunction at meiosis I.
    supporting_text: >-
      cleavage of Rec8 by separin at one of two different sites is necessary for the
      resolution of chiasmata and the disjunction of homologous chromosomes during meiosis
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes Rec8 as a second Esp1 substrate; the abstract foregrounds meiosis I, so the
      'meiosis II' rows are graded MODIFY to meiotic chromosome separation rather than removed.
- id: PMID:11149918
  title: 'A novel role of the budding yeast separin Esp1 in anaphase spindle elongation:
    evidence that proper spindle association of Esp1 is regulated by Pds1.'
  findings:
  - statement: >-
      Esp1-GFP accumulates in the nucleus in G2, is mobilised onto the SPBs and spindle midzone
      at anaphase onset, and persists there into mid-anaphase; Pds1 association is required for
      nuclear targeting and spindle loading.
    supporting_text: >-
      The protein accumulates in the nucleus in G2 and is mobilized onto the spindle pole
      bodies and spindle midzone at anaphase onset, where it persists into midanaphase
    reference_section_type: ABSTRACT
  - statement: Esp1 has a role in anaphase spindle elongation that persists after loss of cohesion.
    supporting_text: we show that Esp1 has a novel role in promoting anaphase spindle elongation
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of the nucleus, cytoplasm, spindle and SPB localisations.
- id: PMID:12123570
  title: The dual mechanism of separase regulation by securin.
  findings:
  - statement: >-
      Securin directly inhibits separase proteolytic activity and substrate binding, yet is
      required and sufficient for nuclear accumulation of separase and for its full activation
      after securin destruction.
    supporting_text: >-
      securin is required and sufficient to cause accumulation of separase in the nucleus,
      where its known cleavage targets reside
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; supports nucleus IDA and the mitotic sister chromatid separation IDA.
- id: PMID:14551257
  title: The role of the polo kinase Cdc5 in controlling Cdc14 localization.
  findings:
  - statement: >-
      Epistasis places Esp1 upstream of Slk19 in one branch of the FEAR network, parallel to
      Spo12/Bns1; esp1-1 mutants are defective in Cdc14 nucleolar release and mitotic exit even
      when cohesin is removed, and Esp1's protease activity is not required for this function.
    supporting_text: >-
      In summary our epistasis analyses indicate that ESP1 and SLK19 function in the same
      pathway and that SLK19 functions downstream of ESP1
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the title foregrounds Cdc5 but the paper directly assays esp1-1 mutants.
