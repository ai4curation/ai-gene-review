- id: PMID:18321989
  title: Cleavage of Mcd1 by caspase-like protease Esp1 promotes apoptosis in budding
    yeast.
  findings:
  - statement: >-
      On hydrogen peroxide treatment Esp1 is released from Pds1 and cleaves Mcd1; the Mcd1
      C-terminal fragment translocates to mitochondria and amplifies cell death. Esp1 depletion
      prevents the cleavage and Esp1 overexpression is sufficient to trigger it.
    supporting_text: >-
      No obvious Mcd1 decrease was observed in the presence of H 2 O 2 when Esp1 was depleted
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; single study of a stress-specific role, graded KEEP_AS_NON_CORE.
- id: PMID:18430955
  title: The protease activity of yeast separase (esp1) is required for anaphase spindle
    elongation independently of its role in cleavage of cohesin.
  findings:
  - statement: >-
      Stringent esp1 ts alleles across the ORF block anaphase spindle elongation even when Mcd1
      is depleted or cleaved by TEV protease; the active-site mutant esp1-C1531S cannot rescue,
      so the spindle function requires endoprotease activity on an unidentified substrate.
    supporting_text: >-
      Therefore, like Mcd1 cleavage, anaphase spindle elongation functions of Esp1 require
      endoproteolytic activity
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of the regulation of mitotic spindle elongation rows.
