- id: PMID:9635435
  title: An ESP1/PDS1 complex regulates loss of sister chromatid cohesion at the metaphase
    to anaphase transition in yeast.
  findings:
  - statement: >-
      Pds1 forms a stable complex with the 180 kDa Esp1, which is essential for dissociation of
