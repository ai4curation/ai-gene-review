- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16713564
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q00362
  review:
    summary: >-
      Queralt et al. found that separase, activated at anaphase onset, interacts with and
      down-regulates the PP2A-Cdc55 phosphatase (Cdc55, UniProtKB:Q00362), facilitating
      Cdk-dependent Net1 phosphorylation and Cdc14 release.
    action: REMOVE
    reason: >-
      Generic protein binding is uninformative. The interaction is genuine and biologically
      important, but the mechanism by which separase down-regulates PP2A-Cdc55 is unresolved:
      the follow-up study (PMID:18762578) considered direct inhibition unlikely because
      PP2A-Cdc55 is in large stoichiometric excess over separase and placed Zds1/Zds2 downstream
      as the likely PP2A regulators, so a phosphatase-inhibitor MF cannot be asserted. The FEAR
      role that this interaction underlies is captured by the process annotations positive
      regulation of exit from mitosis (GO:0031536) and negative regulation of protein
      localization to nucleolus (GO:1904750). Removal does not dispute the interaction.
    supported_by:
    - reference_id: PMID:16713564
      supporting_text: >-
        The sister chromatid-separating protease separase, activated at anaphase onset,
        interacts with and downregulates PP2A(Cdc55), thereby facilitating Cdk-dependent Net1
        phosphorylation
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:18762578
      supporting_text: >-
        A model by which separase binding to PP2ACdc55 directly inhibits its phosphatase
        activity nevertheless appears unlikely, as PP2ACdc55 is present in a large
        stoichiometric excess over separase.
      reference_section_type: DISCUSSION
