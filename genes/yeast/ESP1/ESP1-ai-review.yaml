suggested_questions:
- question: >-
    Which spindle-associated protein is the Esp1 substrate whose cleavage is required for
    anaphase spindle elongation, given that Slk19 cleavage is dispensable and no further
    substrates were found among (D/E)xxR-motif candidates?
- question: >-
    How does non-proteolytic Esp1 down-regulate PP2A-Cdc55 in the FEAR network: does it act as a
    scaffold that brings Zds1/Zds2 to PP2A-Cdc55, or does it directly inhibit the small
    separase-bound fraction of the phosphatase? Is a molecular-function term (e.g. a phosphatase
    inhibitor or scaffold activity) justified for this role?
- question: >-
    Is the hydrogen peroxide-induced, Esp1-dependent Mcd1 cleavage a regulated cell-death
    programme distinct from checkpoint-bypass mitotic death, and should the apoptotic-process
    annotation be retained in the light of subsequent yeast regulated-cell-death literature?
suggested_experiments:
- description: >-
    N-terminomics (TAILS or similar) on synchronised anaphase cells expressing protease-dead
    esp1-C1531S versus wild-type ESP1, to define the complete in vivo Esp1 cleavage repertoire and
    identify the spindle-elongation substrate.
- description: >-
    Reconstitute the separase/Zds1/PP2A-Cdc55 interaction with purified components and test
    whether wild-type or protease-dead Esp1 alters PP2A-Cdc55 phosphatase activity toward Net1
    in vitro, to distinguish direct inhibition from scaffolding.
- description: >-
    Live-cell imaging of endogenously tagged Esp1, Pds1 and Scc1 after auxin-degron depletion of
    Pds1, quantifying the kinetics of Esp1 nuclear/spindle localisation, Scc1 cleavage and spindle
    elongation relative to anaphase onset.
