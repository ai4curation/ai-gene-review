id: Q03018
gene_symbol: ESP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  ESP1 encodes separase (separin), the 1,630-residue caspase-like cysteine endopeptidase
  (clan CD, peptidase family C50, EC 3.4.22.49) of budding yeast. Its C-terminal catalytic
  domain (His1505/Cys1531 dyad) hydrolyses peptide bonds after arginine in (D/E)xxR motifs,
  and its long N-terminal alpha-helical region provides regulatory and substrate-docking
  surfaces. Through most of the cell cycle Esp1 is held inactive in the separase-securin
  complex: securin Pds1 threads along the whole length of the enzyme, inserts a pseudosubstrate
  segment into the active site, and at the same time acts as a chaperone that stabilises Esp1
  and carries it into the nucleus and onto the spindle. When the spindle assembly checkpoint is
  satisfied, APC/C-Cdc20 ubiquitinates Pds1 and its destruction liberates Esp1, which cleaves
  the cohesin kleisin Scc1/Mcd1 at two sites, opening the cohesin ring and triggering sister
  chromatid separation and anaphase. In meiosis Esp1 cleaves the meiotic kleisin Rec8 to
  resolve chiasmata and allow homologue disjunction at meiosis I and sister separation at
  meiosis II. Esp1 also cleaves the kinetochore/spindle protein Slk19, requires its protease
  activity for anaphase spindle elongation independently of cohesin cleavage, and acts as a
  non-proteolytic component of the FEAR network that, through down-regulation of PP2A-Cdc55
  (with Zds1/Zds2) and Net1 phosphorylation, releases the Cdc14 phosphatase from the nucleolus
  in early anaphase to promote mitotic exit. Esp1 is cytoplasmic and nuclear before mitosis,
  accumulates in the nucleus in G2 in a Pds1-dependent manner, and at anaphase onset
  concentrates on the spindle pole bodies and the spindle midzone. Loss of Esp1 leaves sister
  chromatids joined, blocks spindle elongation and produces a catastrophic nuclear division;
  premature activation causes precocious sister separation and chromosome missegregation.
