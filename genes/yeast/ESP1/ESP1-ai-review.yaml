- term:
    id: GO:0000070
    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:9635435
  qualifier: involved_in
  review:
    summary: >-
      Ciosk et al. showed that Esp1 forms a stable complex with Pds1 and is essential for the
      dissociation of Scc1 from sister chromatids and for their separation at the metaphase to
      anaphase transition; esp1 mutants fail to separate sisters.
    action: ACCEPT
    reason: >-
      Esp1 performs the cohesin-cleavage step that detaches sister chromatids, so it is a genuine
      participant in mitotic sister chromatid segregation rather than merely required for it.
      The more specific step is captured by GO:0051306 (mitotic sister chromatid separation),
      which is also annotated.
    supported_by:
    - reference_id: PMID:9635435
      supporting_text: >-
        Pds1p forms a stable complex with a 180 kDa protein called Esp1p, which is essential
        for the dissociation of Scc1p from sister chromatids and for their separation
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:11081625
      supporting_text: >-
        Cleavage of Sccl in metaphase arrested cells is sufficient to trigger the separation
        of sister chromatids and their segregation to opposite cell poles
      reference_section_type: ABSTRACT
      full_text_unavailable: true
- term:
    id: GO:0000280
    label: nuclear division
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028466
  review:
    summary: >-
      ARBA machine-learning inference of nuclear division. Esp1 is indeed essential for nuclear
      division, but its contribution is one defined step, cohesin cleavage that separates sister
      chromatids.
    action: MODIFY
    reason: >-
      The prediction is not wrong but far too general: nuclear division covers mitosis and
      meiosis as a whole, whereas separase executes a single defined step. The informative term
      is mitotic sister chromatid separation (GO:0051306), already annotated experimentally.
      Graded as in the human ESPL1 review of the same ARBA rule.
    proposed_replacement_terms:
    - id: GO:0051306
      label: mitotic sister chromatid separation
    supported_by:
    - reference_id: PMID:12123570
      supporting_text: >-
        Sister chromatid separation and segregation at anaphase onset are triggered by cleavage
        of the chromosomal cohesin complex by the protease separase
      reference_section_type: ABSTRACT
      full_text_unavailable: true
