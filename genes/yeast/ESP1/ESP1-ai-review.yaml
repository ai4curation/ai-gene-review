- id: PMID:27418100
  title: Positive feedback promotes mitotic exit via the APC/C-Cdh1-separase-Cdc14
    axis in budding yeast.
  findings:
  - statement: >-
      Residual securin inhibits separase in anaphase; APC/C-Cdh1-mediated securin degradation at
      telophase further liberates separase, which promotes Cdc14 release and mitotic exit via
      its proteolytic and FEAR functions.
    supporting_text: >-
