suggested_questions:
- question: What are the relative in vivo contributions of Ald2p versus Ald3p to beta-alanine supply,
    given that ALD3 is the more broadly stress-induced paralog?
- question: Does Ald2p oxidize other polyamine-derived aminoaldehydes (e.g. 4-aminobutanal) in vivo?
suggested_experiments:
- description: Purify recombinant Ald2p and Ald3p and determine kinetic parameters for 3-aminopropanal
    versus acetaldehyde with NAD+ and NADP+ to define cofactor and substrate specificity.
