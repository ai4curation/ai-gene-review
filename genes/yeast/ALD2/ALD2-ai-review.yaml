- term:
    id: GO:0008774
    label: acetaldehyde dehydrogenase (acetylating, NAD+) activity
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: enables
  supporting_entities:
  - SGD_PWY:PWY3O-4300
  review:
    summary: RCA acetaldehyde dehydrogenase (acetylating, NAD+) activity from YeastPathways ethanol degradation
      (PWY3O-4300).
    action: REMOVE
    reason: GO:0008774 is the CoA-dependent acetylating reaction (acetaldehyde + CoA + NAD+ = acetyl-CoA
      + NADH, EC 1.2.1.10). Ald2p is a non-acetylating class ALDH (EC 1.2.1.3) that produces free carboxylates;
      no CoA-dependent activity has been reported for any S. cerevisiae ALD, and yeast forms acetyl-CoA
      from acetate via Acs1/Acs2. This is an incorrect reaction mapping in the pathway-to-GO conversion.
    supported_by:
    - reference_id: file:yeast/ALD2/ALD2-uniprot.txt
      supporting_text: Reaction=an aldehyde + NAD(+) + H2O = a carboxylate + NADH + 2 H(+);
