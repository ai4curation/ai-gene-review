id: P47771
gene_symbol: ALD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Ald2p is a cytosolic, NAD+-dependent aldehyde dehydrogenase (ALDH superfamily, EC 1.2.1.3)
  encoded in tandem with its close paralog ALD3. Its best-established physiological role is the oxidation
  of 3-aminopropanal, produced by the polyamine oxidase Fms1 from spermine, to beta-alanine; together
  with Ald3p it is required for the pantothenate (vitamin B5) and coenzyme A biosynthetic route in S.
  cerevisiae, which derives beta-alanine from polyamines rather than from aspartate. ALD2 expression is
  controlled by Msn2/Msn4 and induced by osmotic stress and glucose exhaustion. Ald2p makes at most a
  minor contribution to acetaldehyde oxidation: ald2 ald3 mutants show only a slightly reduced growth
  rate on ethanol and do not affect acetate formation during glucose fermentation.'
