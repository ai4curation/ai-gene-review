descriptions:
- source: UniProt
  text: Cytoplasmic aldehyde dehydrogenase involved in ethanol oxidation. Required
    for pantothenic acid production through the conversion of 3-aminopropanal to beta-alanine,
    an intermediate in pantothenic acid (vitamin B5) and coenzyme A (CoA) biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47771
  source_id: P47771
- source: Alliance_Imported
  text: Cytoplasmic aldehyde dehydrogenase; involved in ethanol oxidation and beta-alanine
    biosynthesis; uses NAD+ as the preferred coenzyme; expression is stress induced
    and glucose repressed; very similar to Ald3p
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALD2
  source_id: SGD:S000004780
- source: Alliance_Automated
  text: Enables 3-aminopropanal dehydrogenase (NAD+) activity. Involved in beta-alanine
    biosynthetic process and polyamine catabolic process. Located in cytoplasm. Human
    ortholog(s) of this gene implicated in several diseases, including artery disease
    (multiple); congenital diaphragmatic hernia; diabetes mellitus (multiple); liver
    disease (multiple); and substance-related disorder (multiple). Orthologous to
    several human genes including ALDH1A1 (aldehyde dehydrogenase 1 family member
    A1); ALDH1A2 (aldehyde dehydrogenase 1 family member A2); and ALDH1A3 (aldehyde
    dehydrogenase 1 family member A3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALD2
  source_id: SGD:S000004780
