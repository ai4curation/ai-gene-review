  text: Enables 3-aminopropanal dehydrogenase (NAD+) activity. Involved in beta-alanine
    biosynthetic process and polyamine catabolic process. Located in cytoplasm. Human
    ortholog(s) of this gene implicated in several diseases, including artery disease
    (multiple); congenital diaphragmatic hernia; diabetes mellitus (multiple); liver
    disease (multiple); and substance-related disorder (multiple). Orthologous to
    several human genes including ALDH1A1 (aldehyde dehydrogenase 1 family member
    A1); ALDH1A2 (aldehyde dehydrogenase 1 family member A2); and ALDH1A3 (aldehyde
    dehydrogenase 1 family member A3).
