gene_symbol: SWI6
organism: yeast
uniprot_id: P09959
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Part of a complex involved in cell-cycle-dependent transcription. SWI4 and
    SWI6 are required for formation of the cell- cycle box factor-DNA complex. The
    repeated element in the upstream region of HO (5'-CACGAAAA-3') is called the cell
    cycle box (CCB).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P09959
  source_id: P09959
- source: Alliance_Imported
  text: Transcription cofactor; forms complexes with Swi4p and Mbp1p to regulate transcription
    at the G1/S transition; involved in meiotic gene expression; also binds Stb1p
    to regulate transcription at START; cell wall stress induces phosphorylation by
    Mpk1p, which regulates Swi6p localization; required for the unfolded protein response,
    independently of its known transcriptional coactivators
  source_type: curated
  url: https://www.yeastgenome.org/locus/SWI6
  source_id: SGD:S000004172
- source: Alliance_Automated
  text: Enables transcription coactivator activity. Involved in several processes,
    including G1/S transition of mitotic cell cycle; cellular response to heat; and
    positive regulation of reciprocal meiotic recombination. Located in cytoplasm
    and nucleus. Part of MBF transcription complex and SBF transcription complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SWI6
  source_id: SGD:S000004172
