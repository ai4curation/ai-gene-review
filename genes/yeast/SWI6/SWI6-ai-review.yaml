- id: PMID:9628912
  title: Meiotic role of SWI6 in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      swi6 null cells show reduced spore viability and recombination frequency, with reduced
      RAD51 and RAD54 transcripts; SWI6 dosage raises both RAD51 expression and
      recombination.
    supporting_text: >-
      These results suggest that SWI6 enhances the expression level of the recombination
      genes in meiosis in a dosage-dependent manner, which results in an effect on the
      frequency of meiotic recombination.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Leem et al. 1998, Nucleic Acids Res; abstract-only cache. Source of the meiotic
      recombination IMP row; the effect is transcriptional and dosage-dependent.
- id: PMID:9719633
  title: Structural and functional architecture of the yeast cell-cycle transcription
    factor swi6.
  findings:
  - statement: >-
      Swi6 contains a central 141-residue transcriptional activation segment and a second
      C-terminal activator adjacent to the Swi4/Mbp1 heteromerisation sequences.
    supporting_text: >-
      A second protease sensitive region connects the ANK domain to the remaining 30 kDa
      C-terminal portion of Swi6 which contains a second transcriptional activator and
      sequences required for heteromerisation with Swi4 or Mbp1.
  - statement: >-
      The ankyrin repeats antagonise the activation regions.
    supporting_text: >-
      Transactivation by the activating regions of Swi6 is antagonised when either are
      combined with the central ankyrin repeat motifs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Sedgwick et al. 1998, J Mol Biol; abstract-only cache. Source of the transcription
      coactivator activity rows; the definitive domain map of Swi6.
- id: file:yeast/SWI6/SWI6-deep-research-falcon.md
  title: SWI6 deep research (falcon literature synthesis)
  findings:
  - statement: >-
      Swi6 has no sequence-specific DNA-binding activity and makes no defining DNA contacts
      in SBF or MBF; it is the shared activation and interaction subunit.
    supporting_text: >-
      Swi6 itself has no demonstrated sequence-specific DNA-binding activity and does not
      make the defining DNA contacts in either complex.
  - statement: >-
      Under cell-wall stress Mpk1 forms a complex with Swi4, recruits Swi6 to the nucleus,
      and later phosphorylates Swi6 at Ser238 to reduce further nuclear import.
    supporting_text: >-
      During wall stress, activated Mpk1 forms a complex with Swi4 and recruits Swi6 to the
      nucleus; Swi6 is required in this complex for full stress-induced *FKS2*
      transcription.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Edison/falcon literature synthesis; identity check correctly separates budding-yeast
      Swi6 from the unrelated S. pombe HP1-family Swi6. Used for framing only; every
      annotation decision is anchored to a cached primary publication.
