        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Family node grouping the DNA-binding subunits (Swi4, Mbp1, pombe Res1/Res2) with
          the shared non-DNA-binding regulatory subunit (Swi6, pombe Cdc10); an
          enables-qualified DNA-binding TF term fits only the DNA-binding branch.
      - source_id: SGD:S000000913
        source_label: SWI4
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Swi4 is the SCB-binding subunit of SBF; its activator activity is a genuine
          DNA-binding TF activity, which Swi6 gates but does not possess.
      - source_id: SGD:S000002214
        source_label: MBP1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mbp1 is the MCB-binding subunit of MBF; the same division of labour applies.
      - source_id: PomBase:SPAC22F3.09c
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          S. pombe MBF DNA-binding subunit; supports the term for the DNA-binding branch
