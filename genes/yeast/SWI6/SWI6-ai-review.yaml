- id: PMID:8423776
  title: Analysis of the SWI4/SWI6 protein complex, which directs G1/S-specific transcription
    in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      The sequence-specific DNA-binding domain resides in Swi4; Swi6 controls its
      accessibility within the complex.
    supporting_text: >-
      From these data, we propose that the sequence-specific DNA-binding domain resides
      in SWI4 but that SWI6 controls the accessibility of this domain in the SWI4/6
      complex.
  - statement: >-
      Two regions of Swi6 (TPLH repeats and leucine zipper) are required for DNA binding by
      the complex although not for Swi4 association.
    supporting_text: >-
