core_functions:
- description: >-
    Swi6 is the transcription-activation subunit of the SBF transcription factor. Through
    its C-terminal heteromerisation region it binds the C terminus of the SCB-binding subunit
    Swi4, relieving the intramolecular auto-inhibition that otherwise masks the Swi4
    DNA-binding domain, so that the Swi4-Swi6 heterodimer can occupy SCB elements in the
    promoters of CLN1, CLN2, PCL1, PCL2, HO and cell-wall genes from late mitosis through G1.
    Its two activation regions, flanking the central ankyrin domain, are held silent by the
    Whi5-Stb1-Rpd3L corepressor assembly until Cln3-Cdc28 phosphorylates Whi5 (and probably
    Swi6) at Start, after which Swi6 activates Pol II transcription of the G1/S regulon;
    Ser160-regulated nuclear import and Msn5-dependent export restrict this activity to late
    M and G1.
