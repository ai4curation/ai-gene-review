id: P09959
gene_symbol: SWI6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  SWI6 encodes the 803-residue, ~90 kDa regulatory and transcription-activation subunit
  shared by the two G1/S transcription factors of budding yeast: SBF (SCB-binding factor,
  the Swi4-Swi6 heterodimer) and MBF (MCB-binding factor, the Mbp1-Swi6 heterodimer).
  Swi6 has no DNA-binding domain of its own. Sequence-specific recognition of SCB (CRCGAAA)
  and MCB (ACGCGT) promoter elements is supplied by the APSES domains of its partners Swi4 and
  Mbp1, to which Swi6 binds through a conserved C-terminal heteromerisation region; in SBF
  this binding relieves an intramolecular auto-inhibition in which the Swi4 C terminus masks
  the Swi4 DNA-binding domain, so full-length Swi4 cannot occupy SCBs without Swi6. Swi6
  contributes two transcriptional activation regions that flank a central block of four to
  five ankyrin repeats (crystal structure of residues 188-514), the ankyrin domain
  antagonising the activation regions, and it is the surface through which the Whi5
  corepressor (with Stb1 and the Rpd3L histone deacetylase) holds promoter-bound SBF silent
  in early G1 and through which Cln3-Cdc28 is recruited to those promoters. Once Whi5 is
  phosphorylated at Start, SBF/MBF activate Pol II transcription of the G1 cyclin genes CLN1,
  CLN2, PCL1 and PCL2, the S-phase cyclins CLB5/CLB6, HO, and DNA-replication, repair and
  cell-wall genes, roughly 200 promoters in all; the CLN1/CLN2 positive feedback makes the
  transition switch-like, and swi4 swi6 or swi4 mbp1 double mutants are inviable because G1
  cyclin transcription fails. Swi6 availability is controlled by nucleocytoplasmic shuttling:
  phosphorylation of Ser160 next to its nuclear localization signal (by Cdc28, reversed by
  Cdc14 with help from the Ess1 prolyl isomerase) keeps it cytoplasmic from late G1 through
  late M, Msn5- and Crm1-dependent export in G2/M is required to re-set SBF for the next
  cycle, and it re-enters the nucleus at the end of mitosis. Independently of Start, Swi6 is
  the activator recruited to Swi4-Mpk1(Slt2) complexes on the FKS2, CHA1, YKR013w and YLR042c
  promoters under cell-wall stress (including growth at 39 degrees C), and is phosphorylated
  by Mpk1 at Ser238 to limit its nuclear import; it also contributes to the transcriptional
  response to oxidants, and in meiosis a dosage-dependent Swi6 function raises RAD51/RAD54
  expression and recombination frequency.
