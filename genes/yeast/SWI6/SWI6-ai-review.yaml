proposed_new_terms: []
suggested_questions:
- question: >-
    The PAINT node PTN000917496 propagates an enables-qualified DNA-binding transcription
    activator activity (GO:0001228) to Swi6, whose donors are exclusively the DNA-binding
    paralogs Swi4, Mbp1 and pombe Res1, while the companion DNA-binding IBA (GO:0000978)
    correctly uses contributes_to. Should the family be split so that the DNA-binding
    subunits (Swi4, Mbp1, Res1, Res2) and the shared activation subunits (Swi6, Cdc10) receive
    DNA-binding-TF versus coactivator terms on their own branches, and would GO prefer
    contributes_to GO:0001228 or enables GO:0003713 as the canonical representation of a
    non-DNA-binding activation subunit of an obligate heterodimeric transcription factor?
  experts:
  - Brenda Andrews
  - Linda Breeden
- question: >-
    Swi6 nuclear export in G2/M is required for SBF, but not MBF, activity in the next cycle
    (Msn5), while a separate Crm1-responsive NES preferentially supports MBF output. What is
    the molecular "re-setting" event that occurs in the cytoplasm, is it Cdc14- or
    Ess1-dependent dephosphorylation of Ser160/Ser238 or dissociation from a partner, and
    does it justify a cytoplasmic activity annotation for Swi6 rather than a mere location?
  experts:
  - J. Carlos Igual
  - Kenneth D. Belanger
- question: >-
    Whi5 phosphorylation and Swi6 phosphorylation by Cln3-Cdc28 are partially redundant
    routes to SBF activation (combined non-phosphorylatable WHI5 and SWI6 alleles give a
    large-cell phenotype that neither gives alone). Which Swi6 residues carry the activating
    phosphorylations, and do they act by releasing Rpd3L/Stb1 from the Swi6 repressive
    regions or by unmasking the activation regions from the ankyrin domain?
  experts:
  - Curt Wittenberg
  - Jan M. Skotheim
suggested_experiments:
- hypothesis: >-
    The two Swi6 activation regions are partner-specific: the central 141-residue activator
    is required for SBF-dependent but not MBF-dependent transcription (or vice versa), so
    that SBF and MBF outputs can be uncoupled without perturbing complex formation.
  description: >-
    Build swi6 alleles that ablate each activation region while retaining the C-terminal
    heteromerisation region (which keeps Swi4/Mbp1 binding intact), integrate them at the
    native locus, and measure nascent transcription (4tU-seq) of SCB- versus MCB-driven
    genes (CLN2, PCL1 versus RNR1, CLB5, POL1) in elutriated synchronous cultures, together
    with 4xSCB- and 4xMCB-lacZ reporters, Swi6 promoter occupancy by ChIP and cell-size
    distributions. Partner-specific loss of output would explain how one shared subunit
    drives two differently timed programs.
  experiment_type: structure-function mutagenesis with reporter and nascent-transcription readouts
- hypothesis: >-
    Cytoplasmic residence of Swi6 in G2/M is required because a partner or modification
    acquired at the promoter must be removed before Swi6 can re-activate SBF, and this
    re-setting step is a defined dephosphorylation.
  description: >-
    In msn5 null cells, in which Swi6 stays nuclear and inactive, compare the
    phosphorylation state of Swi6 (phosphosite mass spectrometry of Swi6-TAP purified from
    G1 cells) and its associated proteins with wild-type; then test whether nuclear-restricted
    Swi6 is rescued by co-expression of a nuclear-targeted Cdc14 or by phosphosite alanine
    substitutions (S160A, S238A, the four Cdc28 sites) and whether rescue restores CLN2
    transcription measured by single-cell RNA FISH. This would identify the cytoplasmic
    re-setting event and settle whether the cytoplasm is a site of Swi6 activity or only of
    its storage.
  experiment_type: phosphoproteomic and genetic analysis of nucleocytoplasmic shuttling
- hypothesis: >-
    Swi6 is the direct binding surface for the Rpd3L complex at SBF/MBF promoters, and Cln3-Cdc28
    phosphorylation of Swi6 (independently of Whi5) reduces Rpd3L occupancy.
  description: >-
    Reconstitute binding of purified Rpd3L (or its Sin3/Stb1 subunits) to recombinant Swi6
    fragments and to the Swi4-Swi6 heterodimer, map the interacting Swi6 region, and then
    test in vivo, by anchor-away or auxin depletion of Whi5 combined with SWI6 phosphosite
    alleles, whether Sin3 ChIP signal at CLN2 and CLB5 tracks Swi6 phosphorylation. A direct
    Swi6-Rpd3L contact would explain the Swi6-dependent, Swi4-independent Sin3 occupancy of
    CLN2 reported by Wang et al. 2009.
  experiment_type: biochemical reconstitution with in vivo ChIP validation
