- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:9719633
  qualifier: enables
  review:
    summary: >-
      Sedgwick et al. 1998 (J Mol Biol; abstract-only cache): limited proteolysis,
      hydrodynamics and reporter assays map Swi6 into a dispensable N-terminal domain, a
      central 141-residue transcriptional activation segment associated with the ankyrin
      domain, and a C-terminal portion carrying a second activation region plus the sequences
      required for heteromerisation with Swi4 or Mbp1; the ankyrin repeats antagonise both
      activation regions.
    action: ACCEPT
    reason: >-
      Direct demonstration that Swi6 carries transactivation regions and reaches promoters
      only through its DNA-bound partners, which is the definition of a coactivator that
      acts as part of a complex. This is the molecular function Swi6 contributes to SBF and
      MBF and is core.
    supported_by:
    - reference_id: PMID:9719633
      supporting_text: >-
        Within the central region, a 141 residue segment that is capable of transcriptional
        activation encompasses a structural domain of approximately 85 residues.
    - reference_id: PMID:9719633
      supporting_text: >-
        A second protease sensitive region connects the ANK domain to the remaining 30 kDa
        C-terminal portion of Swi6 which contains a second transcriptional activator and
        sequences required for heteromerisation with Swi4 or Mbp1.
- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IMP
  original_reference_id: PMID:9719633
  qualifier: enables
  review:
    summary: >-
      Same paper, mutational evidence: deletion and fusion constructs show that the
      N-terminal 15 kDa domain is dispensable for Swi6 activity in vivo and that the
      activation regions are silenced when combined with the central ankyrin repeats, i.e.
      the activator function is intrinsic to defined Swi6 segments and modulated by the
      ankyrin domain.
    action: ACCEPT
    reason: >-
      Structure-function mapping of the activation regions within Swi6 from a different
      evidence angle than the IDA row; same core molecular function.
    supported_by:
    - reference_id: PMID:9719633
      supporting_text: >-
        Transactivation by the activating regions of Swi6 is antagonised when either are
        combined with the central ankyrin repeat motifs.
    - reference_id: PMID:20641022
      supporting_text: >-
        Additionally, Swi6 is the transcriptional activation component of SBF (Sedgwick et
        al., 1998).
