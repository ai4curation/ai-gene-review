        MBF contains Swi6 and a 120-kilodalton protein (p120).
- term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN000917496
  - PomBase:SPAC22F3.09c
  - PomBase:SPBC336.12c
  - PomBase:SPBC725.16
  review:
    summary: >-
      PAINT inference at the APSES-family node, seeded by the three S. pombe MBF subunits and
      carrying the contributes_to qualifier. Swi6 has no DNA-binding domain and no intrinsic
      DNA-binding activity; sequence-specific recognition of SCB and MCB elements is
      performed by Swi4 and Mbp1. Swi6 is nonetheless required for the SBF-DNA complex to
      form: full-length Swi4 cannot bind SCBs without it, TPLH-repeat and leucine-zipper
      mutations in Swi6 leave Swi4-Swi6 association intact but abolish DNA binding of the
      complex, and SCB footprints disappear in swi6 null cells.
    action: ACCEPT
    reason: >-
      The contributes_to qualifier is exactly the right claim for a non-DNA-binding subunit
      that is required for the sequence-specific DNA binding of the complex it belongs to;
      grading this row on that weaker claim, it is correct and core. The PAINT curator placed
      the DNA-binding term at the family node but marked the Swi6/Cdc10 branch as
      contributing rather than enabling, which is precisely the division of labour shown
      biochemically (PMID:8423776, PMID:10490612). An enables-qualified DNA-binding term for
      Swi6 would be wrong; this one is not.
    supported_by:
    - reference_id: PMID:8423776
      supporting_text: >-
        From these data, we propose that the sequence-specific DNA-binding domain resides
        in SWI4 but that SWI6 controls the accessibility of this domain in the SWI4/6
        complex.
    - reference_id: PMID:8423776
      supporting_text: >-
        Deletion of the lucine zipper motif in SWI6 also allows SWI4/6 complex formation,
        but it eliminates the DNA-binding ability of the SWI4/6 complex.
    - reference_id: PMID:10490612
      supporting_text: >-
        In contrast, Swi6 has no DNA binding activity but is present in the SBF complex
        because of its interaction with Swi4 via the carboxy-terminal regions (CTRs) of the
        two proteins
    - reference_id: file:yeast/SWI6/SWI6-deep-research-falcon.md
      supporting_text: >-
        Swi6 relieves an autoinhibitory interaction between the Swi4 C terminus and its
        N-terminal DNA-binding domain, thereby permitting productive promoter binding.
- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000917496
  - PomBase:SPAC22F3.09c
  - SGD:S000000913
  - SGD:S000002214
  review:
    summary: >-
      PAINT inference at the APSES-family node, seeded exclusively by DNA-binding subunits:
      Swi4 (SGD:S000000913), Mbp1 (SGD:S000002214) and an S. pombe MBF DNA-binding subunit.
      Swi6 is not in the WITH list, has no APSES domain and no DNA-binding activity of its
      own; it is the transcription-activation subunit that binds the DNA-bound Swi4 or Mbp1
      and supplies the activation regions. GO:0001228 is defined as a DNA-binding
      transcription factor activity, i.e. an activity of the protein that itself binds the
      cis-regulatory sequence.
    action: MODIFY
    reason: >-
      The biological essence (Swi6 activates Pol II transcription of the G1/S regulon as a
      subunit of SBF/MBF) is right, but the molecular-function class is wrong for this
      member of the node: the family conflates the two DNA-binding paralogs (Swi4, Mbp1) with
      the regulatory subunit, and an enables-qualified DNA-binding TF activity cannot
      transfer to a subunit that does not contact DNA (PMID:10490612; PMID:1465410). SGD
      itself annotates Swi6's own activity as GO:0003713 transcription coactivator activity
      (IDA/IMP from PMID:9719633, the mapping of its two activation regions), and the
      companion GO:0000978 IBA already carries the appropriate contributes_to qualifier for
      the DNA-binding side. Replacing the term with GO:0003713 keeps the activator claim at
      the level Swi6 actually executes; the alternative of retaining GO:0001228 with a
      contributes_to qualifier would also be acceptable.
    proposed_replacement_terms:
    - id: GO:0003713
      label: transcription coactivator activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
