  review:
    summary: >-
      PAINT inference at the APSES-family node PTN000917496 (Swi4, Mbp1 and Swi6 with their
      C. albicans and S. pombe counterparts), seeded in part by Swi6's own experimental G1/S
      rows (SGD:S000004172 in the WITH list is the target itself, which is expected). Every
      extant member of the node is a subunit of a G1/S transcription factor (SBF, MBF, pombe
      MBF), so the node placement is sound.
    action: ACCEPT
    reason: >-
      Swi6 is the shared activating subunit of SBF and MBF, the transcription factors whose
      activation at Start constitutes the G1/S transcriptional switch; swi4 swi6 double
      mutants are inviable because G1 cyclin transcription fails (PMID:1832338). The inherited
      function is the core function of the gene and the target-in-WITH pattern reflects
      experimental grounding on Swi6 itself, not circularity.
    supported_by:
    - reference_id: PMID:1832338
      supporting_text: >-
        We show that the essential role of SWI4 and SWI6 is to ensure the activity of
        G1-specific cyclin genes.
    - reference_id: PMID:10490612
      supporting_text: >-
        The Swi6 protein is a common subunit of both transcription factors and is presumed
        to play a regulatory role.
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:10490612
  qualifier: involved_in
  review:
    summary: >-
      Baetz and Andrews 1999 (full text cached; annotation sourced via ComplexPortal for the
      SBF complex). The paper reconstitutes SBF from insect-cell Swi4 and Swi6, shows that
      full-length Swi4 cannot bind SCBs without Swi6, and that Swi6 binding to the Swi4 C
      terminus relieves the auto-inhibition, all framed by SBF-driven induction of the G1
      cyclin genes at the G1/S transition; in swi6 null cells SCB-driven CLN1/CLN2 expression
      is severely reduced even though Swi4 is present and nuclear.
    action: ACCEPT
    reason: >-
      Swi6 is the subunit that licenses SBF DNA binding and supplies the activation function
      at Start; the biochemical mechanism reported here (Swi6-dependent relief of Swi4
      auto-inhibition, coincident with Swi6 nuclear entry in late M/G1) is one of the layers
      that restrict G1/S transcription to the correct window. Core function.
    supported_by:
    - reference_id: PMID:10490612
      supporting_text: >-
        The interaction of the carboxy-terminal region of Swi4 with Swi6 alleviates this
        inhibition, allowing Swi4 to bind DNA.
    - reference_id: PMID:10490612
      supporting_text: >-
        In swi6 Δ strains, SCB-driven expression of CLN1 and CLN2 is severely reduced and
        the expression of HO is eliminated despite the fact that Swi4 protein is present and
        stable in swi6 Δ mutants
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:2649246
  qualifier: involved_in
  review:
    summary: >-
      Andrews and Herskowitz 1989 (Cell; abstract-only cache): gel-retardation and
      footprinting identify the cell-cycle box factor (CCBF, later SBF) that binds the CCB
      repeats responsible for late-G1 expression of HO; swi4 and swi6 mutant extracts lack
      the CCBF-promoter complex, and SWI4 and SWI6 are the only SWI genes required for
      CCB-driven expression in vivo.
    action: ACCEPT
    reason: >-
      Loss of Swi6 abolishes the factor that confers late-G1 (G1/S) periodicity on HO
      transcription; this is founding IMP evidence that Swi6 acts in the Start transcriptional
      program. SGD applies GO:0000082 uniformly to the Start transcription machinery, and the
      same row is ACCEPTed in the SWI4 review.
    supported_by:
    - reference_id: PMID:2649246
      supporting_text: >-
        We show that the SWI4 and SWI6 genes are required for formation of the
        CCBF-promoter complex in vitro, either as components of CCBF or as modulators of
        CCBF activity.
    - reference_id: PMID:2649246
      supporting_text: >-
        These observations indicate that the CCBF is responsible for cell-cycle regulation
        of HO and lead to the view that two of the SWI genes, SWI4 and SWI6, are
        specifically involved in this regulatory event.
