    supported_by:
    - reference_id: PMID:10490612
      supporting_text: >-
        In contrast, Swi6 has no DNA binding activity but is present in the SBF complex
        because of its interaction with Swi4 via the carboxy-terminal regions (CTRs) of the
        two proteins
    - reference_id: PMID:1465410
      supporting_text: >-
        we propose that Swi4 is responsible for binding to the SCB sequence while Swi6,
        through its association with Swi4, regulates activity of the complex.
    - reference_id: PMID:9719633
      supporting_text: >-
        Within the central region, a 141 residue segment that is capable of transcriptional
        activation encompasses a structural domain of approximately 85 residues.
    - reference_id: file:yeast/SWI6/SWI6-deep-research-falcon.md
      supporting_text: >-
        Swi6 itself has no demonstrated sequence-specific DNA-binding activity and does not
