id: P07244
gene_symbol: ADE57
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Ade5,7 (YGL234W) is a bifunctional enzyme of Saccharomyces cerevisiae de novo purine synthesis encoded
  by the ADE5,7 locus. Its N-terminal domain is glycinamide ribonucleotide (GAR) synthetase (phosphoribosylamine-glycine
  ligase, EC 6.3.4.13; step 2) and its C-terminal domain is aminoimidazole ribonucleotide (AIR) synthetase (phosphoribosylformylglycinamidine
  cyclo-ligase, EC 6.3.3.1; step 5); the separately encoded Ade8 (GAR transformylase) and Ade6 (FGAM synthetase)
  catalyse the intervening steps. Both activities are ATP-dependent. Expression is activated by Bas1/Bas2 under
  adenine limitation. Ade5,7 is cytoplasmic.
