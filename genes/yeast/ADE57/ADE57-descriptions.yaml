descriptions:
- source: UniProt
  text: Catalyzes the second and fifth step in the 'de novo' purine biosynthesis pathway;
    contains phosphoribosylamine--glycine ligase (GARS) and phosphoribosylformylglycinamidine
    cyclo-ligase (AIRS) activities.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07244
  source_id: P07244
- source: Alliance_Imported
  text: Bifunctional enzyme of 'de novo' purine nucleotide pathway; contains both
    phosphoribosylglycinamidine synthetase/glycinamide ribotide synthetase (EC 6.3.4.13)
    ["Ade5"] and phosphoribosylaminoimidazole synthetase/aminoimidazole ribotide synthetase
    (EC 6.3.3.1) ["Ade7"] activities
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADE57
  source_id: SGD:S000003203
- source: Alliance_Automated
  text: Predicted to enable phosphoribosylamine-glycine ligase activity and phosphoribosylformylglycinamidine
    cyclo-ligase activity. Predicted to be involved in adenine biosynthetic process
    and purine nucleotide biosynthetic process. Located in cytoplasm. Orthologous
    to human GART (phosphoribosylglycinamide formyltransferase, phosphoribosylglycinamide
    synthetase, phosphoribosylaminoimidazole synthetase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADE57
  source_id: SGD:S000003203
