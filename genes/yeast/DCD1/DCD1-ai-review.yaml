gene_symbol: DCD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: DCD1 (YHR144C) encodes deoxycytidylate (dCMP) deaminase (EC 3.5.4.12), a zinc-dependent member of the
  cytidine/deoxycytidylate deaminase family that hydrolytically deaminates dCMP to dUMP and ammonia. dUMP is the
  substrate of thymidylate synthase (Cdc21), so Dcd1 provides a route to dTMP from deoxycytidine nucleotides that
  runs in parallel with dUTP hydrolysis by Dut1; S. cerevisiae has no dCTP deaminase. dcd1 mutants lack detectable
  dCMP deaminase activity and are resistant to 5-fluoro-dCMP, and dcd1 dmp1 double mutants require dUMP or dTMP,
  showing that Dcd1 is one of two sources of dUMP. The yeast enzyme resembles the allosteric dCMP deaminases of
  animals and phage, which are activated by dCTP and inhibited by dTTP and so balance dCTP against dTTP; a putative
  dTTP-binding site was identified by sequence comparison. DCD1 transcription is not cell-cycle regulated. The protein
  is cytoplasmic.
