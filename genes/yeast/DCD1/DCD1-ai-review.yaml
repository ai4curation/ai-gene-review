suggested_questions:
- question: Is yeast Dcd1 allosterically activated by dCTP and inhibited by dTTP as predicted, and how much does
    it contribute to dTTP supply relative to Dut1?
- question: What is the molecular identity of the dmp1 mutation that, with dcd1, causes dUMP auxotrophy?
suggested_experiments:
- hypothesis: Dcd1 is a dCTP-activated, dTTP-inhibited allosteric enzyme in yeast
  description: Purify recombinant Dcd1 and measure dCMP deamination kinetics with dCTP and dTTP effectors; correlate
    with dNTP pool imbalances in dcd1 and dcd1-allosteric-site mutants.
  experiment_type: enzymology / dNTP measurement
