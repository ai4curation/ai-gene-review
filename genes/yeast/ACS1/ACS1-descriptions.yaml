    - rubric: specificity
      score: 4
    overall_notes: Correct aerobic isozyme for non-fermentable carbon and histone
      acetyl-CoA source; hedged on acetate assimilation.
- source: Alliance_Imported
  text: Acetyl-coA synthetase isoform; along with Acs2p, acetyl-CoA synthetase isoform
    is the nuclear source of acetyl-coA for histone acetylation; expressed during
    growth on nonfermentable carbon sources and under aerobic conditions; metabolites
    mediate the formation of filament assemblies in meiotic cells, storing Acs1p in
    an inactive state and promoting efficient return to growth after starvation
  source_type: curated
  url: https://www.yeastgenome.org/locus/ACS1
