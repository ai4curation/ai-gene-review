descriptions:
- source: UniProt
  text: Catalyzes the production of acetyl-CoA. Provides the acetyl- CoA source for
    histone acetylation in the nucleus. 'Aerobic' isozyme of acetyl-coenzyme A synthetase,
    which supports growth on nonfermentable carbon sources such as glycerol and ethanol.
    May be required for assimilation of ethanol and acetate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q01574
  source_id: Q01574
