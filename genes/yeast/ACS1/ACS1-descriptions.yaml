gene_symbol: ACS1
organism: yeast
uniprot_id: Q01574
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the production of acetyl-CoA. Provides the acetyl- CoA source for
    histone acetylation in the nucleus. 'Aerobic' isozyme of acetyl-coenzyme A synthetase,
    which supports growth on nonfermentable carbon sources such as glycerol and ethanol.
    May be required for assimilation of ethanol and acetate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q01574
  source_id: Q01574
- source: Alliance_Imported
  text: Acetyl-coA synthetase isoform; along with Acs2p, acetyl-CoA synthetase isoform
    is the nuclear source of acetyl-coA for histone acetylation; expressed during
    growth on nonfermentable carbon sources and under aerobic conditions; metabolites
    mediate the formation of filament assemblies in meiotic cells, storing Acs1p in
    an inactive state and promoting efficient return to growth after starvation
  source_type: curated
  url: https://www.yeastgenome.org/locus/ACS1
  source_id: SGD:S000000050
- source: Alliance_Automated
  text: Enables acetyl-CoA synthetase activity and acid-ammonia (or amide) ligase
    activity. Involved in acetyl-CoA biosynthetic process and pyruvate fermentation
    to acetate. Located in cytosol. Human ortholog(s) of this gene implicated in melanoma
    and orofacial cleft. Orthologous to several human genes including ACSS1 (acyl-CoA
    synthetase short chain family member 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ACS1
  source_id: SGD:S000000050
