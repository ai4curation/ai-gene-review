- source: Alliance_Automated
  text: Enables acetyl-CoA synthetase activity and acid-ammonia (or amide) ligase
    activity. Involved in acetyl-CoA biosynthetic process and pyruvate fermentation
    to acetate. Located in cytosol. Human ortholog(s) of this gene implicated in melanoma
    and orofacial cleft. Orthologous to several human genes including ACSS1 (acyl-CoA
    synthetase short chain family member 1).
  source_type: automated
