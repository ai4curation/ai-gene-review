    supporting_text: The Km for acetate of Acs1p was about 30-fold lower than that of Acs2p and Acs1p,
      but not Acs2p, could use propionate as a substrate.
  - reference_id: PMID:1363452
    supporting_text: As expected, the mutant was unable to grow on acetate as sole carbon source.
  - reference_id: PMID:16857587
    supporting_text: In glycerol with ethanol, Acs1p is an alternate acetyl-CoA source for HATs.
suggested_questions:
- question: Is the mitochondrial pool of Acs1p detected by proteomics catalytically relevant, given that
    mitochondrial and nucleocytosolic acetyl-CoA pools are biochemically isolated?
suggested_experiments:
- description: Compartment-restricted (NLS/NES or mitochondrial-targeted) ACS1 alleles in an acs2-ts background
    to test which Acs1p pool supports acetate growth and histone acetylation.
