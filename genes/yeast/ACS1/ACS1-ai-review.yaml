- term:
    id: GO:0019654
    label: pyruvate fermentation to acetate
  evidence_type: IMP
  original_reference_id: PMID:1363452
  qualifier: involved_in
  review:
    summary: 'IMP: De Virgilio et al. showed that acs1 disruption abolishes growth on acetate as sole
      carbon source. GO:0019654 "pyruvate fermentation to acetate" names an anaerobic, ATP-yielding route
      that ends in acetate; Acs1p does not take part in producing acetate but activates acetate to acetyl-CoA
      during aerobic growth on acetate. The phenotype supports a role in acetate catabolism (utilisation
      of acetate as carbon source).'
    action: MODIFY
    reason: 'Wrong direction/pathway: the mutant phenotype is failure to assimilate acetate, not failure
      to form it by fermentation. Replace with acetate catabolic process.'
    proposed_replacement_terms:
    - id: GO:0045733
      label: acetate catabolic process
    supported_by:
    - reference_id: PMID:1363452
      supporting_text: As expected, the mutant was unable to grow on acetate as sole carbon source.
core_functions:
- description: Glucose-repressed, high-affinity ("aerobic") AMP-forming acetyl-CoA synthetase that activates
    acetate to acetyl-CoA in the nucleocytosolic compartment, supporting growth on acetate and serving
    as an alternate acetyl-CoA source (including for histone acetylation) on non-fermentable carbon.
  molecular_function:
    id: GO:0003987
    label: acetyl-CoA synthetase activity
  directly_involved_in:
