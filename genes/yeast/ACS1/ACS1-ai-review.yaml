id: Q01574
gene_symbol: ACS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ACS1 encodes the "aerobic" isozyme of acetyl-coenzyme A synthetase (EC 6.2.1.1), an AMP-forming
  acyl-CoA synthetase that converts acetate, ATP and CoA to acetyl-CoA, AMP and diphosphate. Compared
  with Acs2p it has a ~30-fold lower Km for acetate and can also activate propionate. ACS1 is subject
  to glucose (and ethanol) repression and is induced on non-fermentable carbon sources and in stationary
  phase; acs1 mutants cannot grow on acetate but still grow on ethanol because Acs2p compensates. Acs1p
  functions in the nucleocytosolic compartment as part of the pyruvate dehydrogenase bypass (pyruvate
  -> acetaldehyde -> acetate -> acetyl-CoA) and can supply acetyl-CoA for histone acetylation when cells
  grow on glycerol/ethanol; a fraction has also been detected in mitochondrial proteomes. The protein
  is inactivated and degraded upon glucose addition.
