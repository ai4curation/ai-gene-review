- term:
    id: GO:0016880
    label: acid-ammonia (or amide) ligase activity
  evidence_type: IDA
  original_reference_id: PMID:18305111
  qualifier: enables
  review:
    summary: IDA from Abe et al., who discovered that adenylate-forming acyl-CoA synthetases, including
      an acetyl-CoA synthetase, form N-acyl-cysteine amide bonds when L-cysteine replaces CoA. This is
      an in vitro side reaction of the adenylate intermediate with a non-physiological acceptor; no in
      vivo role is known. The abstract does not name the source of the acetyl-CoA synthetase; deferring
      to the curator on the identity, it is retained as a non-core, promiscuous activity.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:18305111
      supporting_text: this unexpected enzyme activity was also observed for acetyl-CoA synthetase and
        firefly luciferase
    - reference_id: PMID:18305111
      supporting_text: When l-cysteine was used as a substrate instead of CoA, N-acyl-l-cysteine was surprisingly
        detected as a reaction product.
