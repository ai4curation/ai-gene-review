id: P38709
gene_symbol: YHL012W
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: YHL012W encodes a probable UTP--glucose-1-phosphate uridylyltransferase (UDP-glucose pyrophosphorylase;
  EC 2.7.7.9) of the UDPGP type 1 family. It arose in the whole-genome duplication as a paralog of UGP1,
  which encodes the essential, major cellular UGPase. By sequence, YHL012W is predicted to convert UTP
  and glucose 1-phosphate into UDP-glucose in the cytosol, but its activity, expression conditions and
  physiological role have not been characterised experimentally; it cannot substitute for UGP1, whose
  deletion is lethal.
