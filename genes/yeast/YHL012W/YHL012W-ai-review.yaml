suggested_questions:
- question: Is YHL012W catalytically active as a UGPase, and does it differ from Ugp1 in substrate (e.g.
    Gal1P, GlcNAc1P) or NTP specificity?
- question: Under which developmental or stress conditions (e.g. sporulation, stationary phase) is YHL012W
    expressed, and does it supply UDP-glucose for a specialised wall (e.g. spore wall)?
suggested_experiments:
- description: Purify recombinant YHL012W and assay UGPase and other UDP-sugar pyrophosphorylase activities;
    test whether overexpression of YHL012W rescues a ugp1 deletion.
