  review:
    summary: PAINT IBA at the eukaryotic UDPGP type 1 node (PTN000237130), grounded by Ugp1 (SGD:S000001518)
      and UGPases from human, fungi, plants and trypanosomatids. YHL012W is a WGD paralog of UGP1 that
      retains the full UDPGP domain, so inheritance of UGPase activity is a sound phylogenetic inference.
      No direct biochemical assay of YHL012W has been reported, which is why this is accepted on phylogenetic
      rather than experimental grounds.
