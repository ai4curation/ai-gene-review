descriptions:
- source: UniProt
  text: Catalyzes the hydrolysis of N-formyl-L-kynurenine to L- kynurenine, the second
    step in the kynurenine pathway of tryptophan degradation. Kynurenine may be further
    oxidized to nicotinic acid, NAD(H) and NADP(H). Required for elimination of toxic
    metabolites.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04066
  source_id: Q04066
- source: Alliance_Imported
  text: Formylkynurenine formamidase; involved in the de novo biosynthesis of NAD
    from tryptophan via kynurenine
  source_type: curated
  url: https://www.yeastgenome.org/locus/BNA7
  source_id: SGD:S000002836
- source: Alliance_Automated
  text: Enables arylformamidase activity. Involved in NAD+ biosynthetic process and
    positive regulation of cell growth. Predicted to be active in cytosol. Orthologous
    to human AFMID (arylformamidase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BNA7
  source_id: SGD:S000002836
