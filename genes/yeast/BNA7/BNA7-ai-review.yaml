id: Q04066
gene_symbol: BNA7
aliases:
- YDR428C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: BNA7 encodes kynurenine formamidase (arylformamidase), an alpha/beta-hydrolase that hydrolyses
  N-formyl-L-kynurenine to L-kynurenine and formate, the second step of the kynurenine pathway from tryptophan
  to quinolinate and de novo NAD+. Its catalytic serine and HGGXW oxyanion-hole motif were defined from
  crystal structure and biochemical work that also reassigned Bna3 as a kynurenine aminotransferase rather
  than the formamidase. Deletion causes slow growth when nicotinic acid is absent.
