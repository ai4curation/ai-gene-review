suggested_questions:
- question: Why is bna7 deletion only partially defective (slow growth) without nicotinate - is there
    a second formamidase or non-enzymatic deformylation?
suggested_experiments:
- description: Measure N-formylkynurenine and kynurenine in bna7 and bna7 double mutants with candidate
    hydrolases, and test residual formamidase activity in bna7 extracts.
  experiment_type: genetics/biochemistry
  hypothesis: A minor second activity accounts for residual kynurenine production in bna7 cells.
