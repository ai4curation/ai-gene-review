descriptions:
- source: UniProt
  text: Catalyzes the reversible dehydration of (R)-homocitrate to cis-homoaconitate,
    a step in the alpha-aminoadipate pathway for lysine biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P39533
