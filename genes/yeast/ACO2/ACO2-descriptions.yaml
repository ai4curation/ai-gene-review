- source: Alliance_Imported
  text: Putative mitochondrial aconitase isozyme; similarity to Aco1p, an aconitase
    required for the TCA cycle; expression induced during growth on glucose, by amino
    acid starvation via Gcn4p, and repressed on ethanol
  source_type: curated
  url: https://www.yeastgenome.org/locus/ACO2
  source_id: SGD:S000003736
- source: Alliance_Automated
  text: Predicted to enable 4 iron, 4 sulfur cluster binding activity and aconitate
    hydratase activity. Involved in tricarboxylic acid cycle. Located in mitochondrion.
