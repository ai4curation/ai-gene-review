id: P39533
gene_symbol: ACO2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ACO2 encodes a mitochondrial paralog of aconitase (aconitase/IPM isomerase family, [4Fe-4S])
  that has specialised as a homocitrate dehydratase in the alpha-aminoadipate pathway of lysine biosynthesis.
  Purified Aco2p reversibly converts (R)-homocitrate to cis-homoaconitate, which homoaconitase (Lys4p)
  then hydrates to homoisocitrate; it is about 950-fold more active with homoaconitate than with cis-aconitate,
  a specificity attributed to an active-site lysine (K610) in place of the arginine of TCA-cycle aconitases.
  Aco2p cannot replace Aco1p in the TCA cycle (it does not rescue the glutamate auxotrophy of aco1 mutants).
  ACO2 is expressed mainly during glucose growth, and aco2 deletion causes a fitness defect under glucose-limited
  (trehalose) respiro-fermentative growth with modest changes in aconitate and 2-oxoglutarate, which has
  been interpreted as a minor aconitase contribution.
