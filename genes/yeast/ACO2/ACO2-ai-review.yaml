core_functions:
- description: 'Mitochondrial homocitrate dehydratase: reversible dehydration of (R)-homocitrate to cis-homoaconitate,
    the first half of the homocitrate-to-homoisocitrate isomerisation in alpha-aminoadipate-pathway lysine
    biosynthesis (completed by Lys4p).'
  proposed_molecular_function: homocitrate dehydratase activity
  directly_involved_in:
  - id: GO:0009085
    label: L-lysine biosynthetic process
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - *id004
  - *id001
  - &id009
    reference_id: file:yeast/ACO2/ACO2-uniprot.txt
    supporting_text: Reaction=(2R)-homocitrate = cis-homoaconitate + H2O;
proposed_new_terms:
- proposed_name: homocitrate dehydratase activity
  proposed_definition: 'Catalysis of the reaction: (2R)-homocitrate = cis-homoaconitate + H2O.'
  justification: GO:0004409 homoaconitate hydratase activity is defined as the homoisocitrate <-> cis-homoaconitate
    reaction (EC 4.2.1.36, Lys4p). The preceding dehydration of (R)-homocitrate (RHEA:26101) has no GO
    term, yet it is the physiological activity of yeast Aco2p and is also performed by fungal and Thermus
    aconitases.
  proposed_parent:
    id: GO:0016836
    label: hydro-lyase activity
  supported_by:
  - *id009
  - *id001
suggested_questions:
- question: Does the aco2 fitness defect on limiting glucose reflect a genuine aconitase (TCA) contribution
    or an indirect effect of reduced lysine/2-oxoglutarate balance via the homocitrate step?
suggested_experiments:
- hypothesis: The physiological contribution of Aco2p is via homocitrate dehydration rather than citrate
    isomerisation.
  description: Measure lysine requirement and TCA flux (13C-glucose) in aco2 and aco2-K610R strains on
    trehalose to separate homocitrate-dehydratase from aconitase contributions.
