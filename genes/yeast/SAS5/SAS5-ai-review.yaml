core_functions:
- description: Accessory subunit of the SAS-I histone acetyltransferase, attached to the catalytic subunit
    Sas2 through the bridging subunit Sas4. Sas5 stimulates Sas2 and is needed for full activity of the
    complex, which acetylates histone H4 lysine 16, mainly on free or newly deposited histones. This acetylation
    opposes Sir2 and limits the spreading of SIR heterochromatin at telomeres and the silent mating-type
    loci. How Sas5 stimulates the complex, and whether its YEATS domain reads histone acylation in vivo,
    is not known.
  contributes_to_molecular_function: *id013
  directly_involved_in:
  - *id009
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0033255
    label: SAS acetyltransferase complex
  supported_by:
  - *id004
  - *id019
  - *id005
  - *id014
  - *id010
  - *id018
knowledge_gaps:
- gap_statement: How Sas5 stimulates the acetyltransferase activity of SAS-I is not known.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Sas5 is needed for full activity of the complex but contacts Sas2 only through Sas4. UniProt
    suggests it may stabilise the complex or help recognise the substrate; no experiment distinguishes
    these, and there is no structure of the trimer.
  provenance:
  - *id004
  - *id005
  - reference_id: file:yeast/SAS5/SAS5-uniprot.txt
    supporting_text: suggesting that it may be required to stabilize the complex or help in substrate
      recognition
- gap_statement: Whether the Sas5 YEATS domain binds acylated histones in the cell, and whether that binding
    matters for SAS-I, is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The isolated YEATS domain binds benzoylated H3 peptides, in preference to acetylated ones,
    with affinities in the hundreds of micromolar, and a pocket mutation (W82A) abolishes binding in vitro.
    Testing that mutant for H4K16 acetylation and boundary function in vivo would show whether Sas5 reads
    histone marks to target the complex.
  provenance:
  - *id020
  - *id021
