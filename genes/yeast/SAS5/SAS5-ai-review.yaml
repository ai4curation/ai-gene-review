- term:
    id: GO:0004402
    label: histone acetyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:12626510
  qualifier: enables
  review:
    summary: 'Reconstitution: Sas5 stimulates the HAT activity of Sas2.'
    action: MODIFY
    reason: 'Sas5 has no acetyltransferase domain; the catalytic subunit of SAS-I is the MYST-family acetyltransferase
      Sas2. Sutton et al. reconstituted the complex and found that Sas2 activity absolutely requires Sas4
      and is stimulated by Sas5, and Schaper et al. found both accessory subunits required for maximal
      activity. The claim is therefore that Sas5 contributes to the activity of the complex, not that
      it enables it; the qualifier error is recorded as a source defect. The activity of the complex is
      site-specific: the native trimer acetylates H4 lysine 16 exclusively in vitro and is needed for
      bulk H4K16 acetylation in vivo; H3 lysine 14 acetylation was seen with the recombinant complex in
      one study and is not established in vivo. Histone acetyltransferase activity is correct but general,
      so the row is modified to histone H4K16 acetyltransferase activity, to be read as contributes_to.'
    proposed_replacement_terms:
    - &id013
      id: GO:0046972
      label: histone H4K16 acetyltransferase activity
    supported_by:
