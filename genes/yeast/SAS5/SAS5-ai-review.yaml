- term:
    id: GO:0042393
    label: histone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000574151
  - UniProtKB:Q9ULM3
  review:
    summary: PAINT IBA for histone binding from the ancestral YEATS node (seed YEATS2).
    action: KEEP_AS_NON_CORE
    reason: 'The YEATS domain is an acyl-lysine reader fold, and PAINT placed histone binding at the family
      ancestor with human YEATS2 as seed. Sas5 retains the reader pocket: its isolated YEATS domain binds
      acylated histone H3 peptides in vitro, preferring benzoyl-lysine at K14 and K27, a crystal structure
      shows the H3K27bz peptide in the aromatic cage, and W82A abolishes binding. The affinities are weak
      (hundreds of micromolar), the experiments use peptides and the isolated domain, and no study has
      tested whether the YEATS domain binds histones in the cell or matters for SAS-I targeting or activity.
      The claim holds at the level of histone binding but is not part of Sas5''s established function,
      so it is kept as non-core.'
    supported_by:
    - reference_id: PMID:35296687
      supporting_text: Sas5YEATS prefers binding with H3K14 and H3K27
    - &id020
