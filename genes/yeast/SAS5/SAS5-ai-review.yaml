id: Q99314
gene_symbol: SAS5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Sas5 (Something about silencing 5, YOR213C) is a non-catalytic subunit of SAS-I, the histone
  acetyltransferase complex of budding yeast formed by the MYST-family catalytic subunit Sas2, the bridging
  subunit Sas4 and Sas5. The native complex is a trimer with one copy of each subunit, and Sas5 is attached
  to Sas2 through Sas4. Sas5 stimulates the activity of the complex, which acetylates histone H4 on lysine
  16 (and H3 lysine 14 in vitro), acts mainly on free histones with only weak activity on nucleosomes,
  and supplies about 60 percent of cellular H4K16 acetylation. SAS-I interacts with the histone deposition
  factors Asf1 and CAF-I, and its H4K16 acetylation opposes Sir2-dependent deacetylation, limiting the
  spreading of SIR heterochromatin from telomeres and the silent mating-type loci; sas5 mutants lose silencing
  at HML and telomeres, restore silencing at an HMR locus with a defective silencer, and allow silencing
  to spread past the HMR boundary. Sas5 has an N-terminal YEATS domain, a phosphoserine at position 144
  and a disordered C-terminal tail. Its YEATS domain binds acylated, preferentially benzoylated, histone
  H3 peptides weakly in vitro; whether it binds histones in the cell is not known. Sas5 is a paralog of
  Taf14 but, unlike Taf14, has been found only in SAS-I. It is imported into the nucleus by the karyopherins
  Kap123 and Pse1 through a signal in its N-terminal region.
