    - reference_id: file:yeast/SAS5/SAS5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: In the complex, SAS5 is required for maximal histone acetyltransferase (HAT) activity
        of the complex, suggesting that it may be required to stabilize the complex or help in substrate
        recognition.
    source_defects:
