- term:
    id: GO:0031509
    label: subtelomeric heterochromatin formation
  evidence_type: IDA
  original_reference_id: PMID:11731479
  qualifier: involved_in
  review:
    summary: Subtelomeric heterochromatin formation, from the SAS complex identification paper.
    action: MODIFY
    reason: 'Sas5 is needed for telomeric and HML silencing (Xu et al. 1999), but the mechanism is that
      SAS-I opposes heterochromatin: H4K16 acetylation by SAS-I counteracts Sir2 deacetylation and Sir3
      binding, and in its absence SIR proteins spread from about 3 kb to about 15 kb from the telomere
      and repress adjacent genes. The loss of silencing at telomere-proximal reporters is explained by
      this redistribution. SAS-I therefore sets the boundary of subtelomeric heterochromatin rather than
      forming it, and sas5 null alleles also restore silencing at a defective HMR and let silencing spread
      past the HMR boundary. In GO, heterochromatin boundary formation is part_of heterochromatin formation,
      so the existing term is not wrong, but the informative term is heterochromatin boundary formation
      (no subtelomere-specific boundary term exists). The cited paper tested telomeric silencing only
      in sas2 mutants; the Sas5 evidence is in PMID:10471697.'
    proposed_replacement_terms:
    - *id009
    supported_by:
    - &id018
      reference_id: PMID:10471697
      supporting_text: This study revealed that SAS4 and SAS5 contribute to silencing at HML and the telomeres,
        indicating that SAS4 and SAS5 are positive regulators of silencing at these loci.
    - *id017
    - *id010
    - *id011
    - reference_id: file:yeast/SAS5/SAS5-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Heterochromatin spreading downstream of the silent mating-type locus HMR.
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: SGD
      requested_change: CHECK
      asserted_value: PMID:11731479
      corrected_value: PMID:10471697
      confidence: SUSPECTED
      explanation: This IDA row cites Osada et al. 2001, whose telomeric and HML silencing assays (full
        text, PMC312835) were done with sas2 point mutants only; silencing phenotypes of sas4 and sas5
        mutants are reported by Xu et al. 1999 (PMID:10471697), as mutant phenotypes (IMP). The boundary-setting
        role of SAS-I would also be better captured by heterochromatin boundary formation (GO:0033696).
      supported_by:
      - *id018
