      reference_id: PMID:12626510
      supporting_text: recombinant Sas2 has HAT activity that absolutely requires Sas4 and is stimulated
        by Sas5
    - reference_id: PMID:12626510
      supporting_text: The recombinant SAS complex acetylates H4 lysine 16 and H3 lysine 14.
    - &id014
      reference_id: PMID:15659401
      supporting_text: SAS complex exclusively acetylates lysine 16 of histone H4 in vitro and is required
