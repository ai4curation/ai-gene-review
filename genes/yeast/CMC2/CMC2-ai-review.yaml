suggested_questions:
- question: Should the nucleus HDA row from the GFP library be retired for Cmc2? No source
    of any kind places a MIA40 substrate in the nucleus, and the same artifact pattern appears
    on COA4 in this pathway. The cytoplasm row from the same library is retained, since a
    cytosolic pool is expected for a Mia40 substrate awaiting import.
  experts:
  - SGD curators
  - GO cellular component curation group
- question: Is the proposed Cmc1/Cmc2 role in copper distribution between cytochrome c oxidase
    and Sod1 real? UniProt hedges it and no direct evidence exists.
  experts:
  - Barrientos lab
  - Winge lab
- question: AlphaFold-Multimer predicts a conserved CMC2-COX2 interaction (doi:10.1038/s41467-026-77112-z)
    with no experimental follow-up. Does Cmc2 act on the CuA branch, as that would imply?
  experts:
  - Barrientos lab
  - Gohil lab
suggested_experiments:
- hypothesis: The nuclear GFP signal for Cmc2 is a C-terminal tagging artifact caused by blocked
    MIA40-dependent import.
  description: Compare localization of N-terminally tagged, C-terminally tagged and untagged
    Cmc2 by fractionation and immunoblot, and assay in vitro import of each into isolated
    mitochondria.
  experiment_type: cell biology
- hypothesis: Cmc2 acts on the CuA branch of copper delivery via a direct contact with Cox2.
  description: Test the predicted Cmc2-Cox2 interaction by co-immunoprecipitation from crosslinked
    mitochondria, following the approach that validated Coa4-Cox11.
  experiment_type: biochemical
