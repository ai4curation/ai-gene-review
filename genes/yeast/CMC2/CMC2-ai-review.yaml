core_functions:
- description: Twin CX9C protein of the mitochondrial intermembrane space, peripherally associated
    with the inner membrane and imported by the MIA40-ERV1 disulfide relay. Cmc2 interacts
    with its homologue Cmc1 and is required for cytochrome c oxidase assembly and respiration.
    Its molecular activity is undetermined; a proposed role in copper distribution between
    cytochrome c oxidase and Sod1 remains unproven.
