  label: Saccharomyces cerevisiae
description: Cmc2 is a 109-residue twin CX9C protein of the mitochondrial intermembrane space,
  peripherally associated with the inner membrane, and a homologue of Cmc1. It is imported
  by the MIA40-ERV1 disulfide relay and is required for cytochrome c oxidase assembly and
  respiration. Cmc2 interacts with Cmc1, and the pair have been proposed to participate in
  copper trafficking and distribution between mitochondrial cytochrome c oxidase and Sod1,
  though this remains a proposal rather than a demonstrated activity. No molecular function
  has been established.
