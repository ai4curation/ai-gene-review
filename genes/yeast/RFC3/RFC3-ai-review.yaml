      supporting_text: Loading of Rad17/3/1 required the presence of both the clamp loader and ATP
    - reference_id: PMID:12604797
      supporting_text: These data suggest that the two pairs of complexes, PCNA–RFC and Rad17/3/1–RFC-Rad24,
        define nonexchangeable clamp-clamp loader systems which are active during DNA replication and
        the checkpoint response, respectively.
