- term:
    id: GO:0006272
    label: leading strand elongation
  evidence_type: IDA
  original_reference_id: PMID:1346062
  qualifier: involved_in
  review:
    summary: Yeast RFC was purified by its ability to stimulate pol delta on primed single-stranded DNA with
      PCNA and RPA; by analogy with SV40 and T4 systems these factors were proposed to form a
      leading-strand replication complex.
    action: KEEP_AS_NON_CORE
    reason: The experiment shows primed-template elongation in vitro; the leading-strand designation is by
      analogy with SV40 in vitro replication. RFC/PCNA in fact act on both strands (PCNA must be loaded
      at every Okazaki fragment), so the strand-specific term captures only part of the role. Not wrong
      (RFC loads PCNA for leading-strand pol epsilon too), and as an experimental curator call it is kept,
      but the general DNA strand elongation term is the core one.
    supported_by:
    - reference_id: PMID:1346062
      supporting_text: By analogy with the phage T4 and SV40 DNA replication in vitro systems, the yeast
        RFC, PCNA, RPA, and DNA polymerase delta activities function together as a leading-strand DNA replication
        complex.
