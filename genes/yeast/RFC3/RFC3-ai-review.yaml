suggested_questions:
- question: Should the small RFC subunits in budding yeast carry contributes_to GO:0061860 DNA clamp unloader
    activity on the basis of the Elg1-RFC and Ctf18-RFC unloading data? In yeast this activity is currently
    annotated to the Elg1-RFC complex (ComplexPortal CPX-422) and the PAINT IBA sits on the large-subunit
    (Elg1/ATAD5, RFC1) nodes, whereas PomBase annotates the fission yeast small subunits (including rfc3)
    by IC. Which convention should apply to shared small subunits?
- question: Does Rfc3 contribute catalytically to clamp unloading by Elg1-RFC, given that nucleotide binding
    but not hydrolysis is reported to suffice for unloading?
suggested_experiments:
- description: Test arginine-finger (catalytic) point mutants of Rfc3 in reconstituted RFC, Rad24-RFC,
    Ctf18-RFC and Elg1-RFC to separate its catalytic contribution to PCNA/9-1-1 loading from its
    structural contribution to PCNA unloading, and assay the corresponding alleles in vivo for replication,
    checkpoint activation and cohesion defects.
