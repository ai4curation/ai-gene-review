core_functions:
- description: ATPase small subunit of replication factor C (Rfc1-Rfc5) that contributes to ATP-dependent
    loading of the PCNA sliding clamp onto primer-template DNA, enabling processive DNA synthesis by
    DNA polymerases delta and epsilon during chromosomal replication. Rfc3 binds ATP, hydrolyses ATP
    (alone with single-stranded-DNA stimulation), supplies the catalytic arginine finger to the Rfc4 ATP
    site, and forms a strong direct contact with PCNA. Experimentally established in S. cerevisiae.
