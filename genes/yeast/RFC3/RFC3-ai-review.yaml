  review:
    summary: Purified Rad24-RFC (Rad24 with Rfc2-Rfc5) loads the Rad17-Mec3-Ddc1 checkpoint clamp onto
      gapped and partial-duplex DNA in an ATP-dependent manner and releases it upon ATP hydrolysis.
    action: ACCEPT
    reason: Direct biochemical demonstration of clamp loading by a complex of which Rfc3 is a stoichiometric
      subunit; contributes_to is the correct qualifier. The paper also shows that RFC loads PCNA and
      Rad24-RFC loads 9-1-1 as non-exchangeable pairs, both of which contain Rfc3.
    supported_by:
