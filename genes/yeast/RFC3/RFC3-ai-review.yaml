id: P38629
gene_symbol: RFC3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  RFC3 (YNL290W) encodes the 40-kDa small subunit of replication factor C (RFC), an essential
  AAA+ ATPase of the activator 1 small-subunit family. Rfc3 is one of the four small subunits
  (Rfc2-Rfc5) that form the shared core of the canonical clamp loader RFC (with Rfc1) and of the
  three alternative RFC-like complexes, in which Rfc1 is replaced by Rad24, Ctf18 (with Ctf8 and
  Dcc1) or Elg1. Within RFC, these complexes use ATP binding and hydrolysis to open the
  homotrimeric sliding clamp PCNA (Pol30) and close it around primer-template DNA, where PCNA
  confers processivity on DNA polymerases delta and epsilon during chromosomal DNA replication
  and repair synthesis. In RFC, Rfc3 makes a strong direct contact with PCNA and supplies the
  catalytic arginine finger for the ATP site of the neighbouring Rfc4 subunit; purified Rfc3
  alone has a single-stranded-DNA-stimulated ATPase activity. As part of Rad24-RFC it contributes
  to loading of the Ddc1-Mec3-Rad17 (9-1-1) checkpoint clamp at primer-template junctions in the
  DNA damage checkpoint; as part of Ctf18-RFC it contributes to sister chromatid cohesion
  establishment and to PCNA unloading; and as part of Elg1-RFC it is a structural component of the
  complex that removes PCNA from chromatin after replication. RFC3 is essential for growth, and
  the protein is nuclear.
existing_annotations:
- term:
    id: GO:0000077
    label: DNA damage checkpoint signaling
  evidence_type: NAS
  original_reference_id: PMID:12604797
  qualifier: involved_in
  review:
    summary: Rfc3 is one of the four small subunits of the Rad24-RFC complex, the clamp loader that
      loads the Rad17-Mec3-Ddc1 (9-1-1) checkpoint clamp onto partial duplex DNA in an ATP-dependent
      reaction (Majka and Burgers 2003). Loading of the checkpoint clamp is an early step of DNA damage
      checkpoint signaling.
    action: ACCEPT
    reason: Majka and Burgers purified Rad24-RFC (Rad24 plus Rfc2-5) and showed directly that it loads
      the 9-1-1 clamp, whereas canonical RFC does not. Rfc3 is a stoichiometric subunit of the loader,
      so it does part of the work of the clamp-loading step, which is the step by which the checkpoint
      clamp is placed on DNA. This passes the participation test (the complex containing Rfc3 performs
      the step). The NAS code reflects that a checkpoint signaling phenotype of rfc3 alleles is not
      tested in this paper; the role is established for the complex. This is one of the core,
      complex-specific roles of the shared small subunits.
    supported_by:
    - reference_id: PMID:12604797
      supporting_text: Here, we provide experimental evidence that, indeed, the RFC-Rad24 clamp loader
        loads the Rad17/3/1 clamp around partial duplex DNA in an ATP-dependent process.
    - reference_id: PMID:12604797
      supporting_text: Rad24 interacts with the four small subunits of replication factor C (RFC) to
        form the RFC-Rad24 complex.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008921
  review:
    summary: InterPro2GO mapping from the clamp loader C-terminal domain (IPR008921). RFC binds
      primer-template DNA in a structure-specific manner, and isolated Rfc3 has an ATPase that is
      stimulated by single-stranded DNA, implying DNA contact.
    action: KEEP_AS_NON_CORE
    reason: DNA binding by RFC is well established for the complex (structure-specific primer-template
      binding; Fien and Stillman 1992), and the single-stranded-DNA stimulation of the purified Rfc3
      ATPase (Li and Burgers 1994) indicates that Rfc3 itself engages DNA. The evidence does not
      establish a more specific DNA-binding term for Rfc3 alone (the primer-template junction is
      recognised by the assembled pentamer), so the general term is retained. It is a supporting
      property of the clamp-loading activity rather than a core function in its own right.
    supported_by:
    - reference_id: PMID:8302859
      supporting_text: Purified Rfc3p has an ATPase activity that is markedly stimulated by single-stranded
        DNA but not by double-stranded DNA or RNA.
    - reference_id: PMID:1346062
      supporting_text: Like its human-cell counterpart, RFC from S. cerevisiae (scRFC) has an associated
        DNA-activated ATPase activity as well as a primer-template, structure-specific DNA binding activity.
