  text: Subunit of heteropentameric Replication factor C (RF-C); which is a DNA binding
    protein and ATPase that acts as a clamp loader of the proliferating cell nuclear
    antigen (PCNA) processivity factor for DNA polymerases delta and epsilon; relocalizes
    to the cytosol in response to hypoxia
