- source: Alliance_Automated
  text: Enables ATP hydrolysis activity. Contributes to DNA clamp loader activity.
    Involved in leading strand elongation. Located in cytosol and nucleus. Part of
    chromosome. Orthologous to human RFC5 (replication factor C subunit 5).
