gene_symbol: NDE1
organism: yeast
uniprot_id: P40215
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: External NADH dehydrogenase required for optimum cellular growth with a number
    of nonfermentable carbon sources, including ethanol. With NDE2, performes the
    mitochondrial oxidation of cytosolic NADH under these growth conditions. Regulates
    the mitochondrial glycerol-3-phosphate dehydrogenase, GUT2, also involved in cytosolic
    NADH oxidation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40215
  source_id: P40215
- source: Alliance_Imported
  text: Mitochondrial external NADH dehydrogenase; type II NAD(P)H:quinone oxidoreductase
    that catalyzes the oxidation of cytosolic NADH; Nde1p and Nde2p provide cytosolic
    NADH to the mitochondrial respiratory chain; NDE1 has a paralog, NDE2, that arose
    from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/NDE1
  source_id: SGD:S000004753
- source: Alliance_Automated
  text: Enables NADH dehydrogenase activity. Involved in pyruvate fermentation to
    ethanol and regulation of apoptotic process. Located in mitochondrial membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/NDE1
  source_id: SGD:S000004753
fetch_date: '2026-11-01'
