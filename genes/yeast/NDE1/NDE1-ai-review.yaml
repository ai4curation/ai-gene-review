suggested_questions:
- question: Is the cytosol-exposed outer-membrane topomer of Nde1p catalytically active, and does its
    pro-death activity require NADH dehydrogenase activity?
suggested_experiments:
- description: Purify Nde1p and Nde2p and compare kinetic parameters (NADH Km, kcat with ubiquinone-6)
    to determine whether the minor contribution of Nde2p reflects expression level or intrinsic activity.
