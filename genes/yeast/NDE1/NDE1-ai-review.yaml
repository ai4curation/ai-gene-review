core_functions:
- description: Major external, non-proton-pumping NADH:ubiquinone oxidoreductase (NDH-2) on the intermembrane-space
    face of the inner mitochondrial membrane; oxidises cytosolic NADH and reduces ubiquinone, feeding
    the respiratory chain.
