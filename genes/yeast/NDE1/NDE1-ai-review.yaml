id: P40215
gene_symbol: NDE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NDE1 encodes the major external type-II NADH:ubiquinone oxidoreductase (NDH-2, EC 1.6.5.9)
  of S. cerevisiae mitochondria. This single-subunit flavoprotein sits on the intermembrane-space face
  of the inner membrane and oxidises cytosolic NADH that has crossed the outer membrane, passing electrons
  to ubiquinone without proton pumping and thus coupling cytosolic redox balance directly to respiration
  without a redox shuttle. nde1 deletion reduces mitochondrial NADH oxidation about threefold and slows
  growth on non-fermentable carbon sources such as ethanol; NDE2 encodes a minor paralogous isoform, and
  the nde1 nde2 double mutant completely lacks external NADH-dependent respiration. Nde1p is part of a
  supramolecular assembly of intermembrane-space-facing dehydrogenases. A second Nde1 topomer spans the
  outer membrane and is exposed to the cytosol; this surface-exposed form is rapidly degraded by the proteasome/Cdc48
  system and Yme1 and promotes cell death in response to pro-apoptotic stimuli, analogous to mammalian
  AIF.
