      it possesses histone acetyltransferase activity
  - reference_id: PMID:31699900
    supporting_text: The Piccolo NuA4 complex, similar to the ADA complex, also exhibited
      crotonyltransferase activity toward nucleosomes in a manner dependent on its catalytic
      activity
