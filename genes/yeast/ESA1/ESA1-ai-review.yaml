core_functions:
- description: Catalytic component of the NuA4 histone acetyltransferase complex that catalyzes
    acetylation of histone H4 (K5, K8, K12, K16), H3 (K14), H2A/H2B, and histone variant H2A.Z.
    Also possesses crotonyl-CoA transferase activity. ESA1 is essential for transcriptional
    activation of growth genes, double-strand break repair, cell cycle progression through
    S and G2/M phases, and chromatin organization. Functions through dynamic localization
    and recruitment to target genes via protein-protein interactions within the NuA4 complex.
  molecular_function:
    id: GO:0010485
    label: histone H4 acetyltransferase activity
  directly_involved_in:
