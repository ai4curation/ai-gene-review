- term:
    id: GO:0010629
    label: negative regulation of gene expression
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: ESA1/NuA4 is documented as a POSITIVE regulator of transcription, not negative. This
      annotation appears to be an artifact of ARBA ML misclassification and is contradicted by the
      primary literature.
    action: REMOVE
    reason: Literature overwhelmingly documents NuA4 as a transcriptional ACTIVATOR and POSITIVE
      regulator. PMID:10835360 'Activation domain-specific...transcription stimulation';
      PMID:15175650 'Recruitment...poises...for...activation'; PMID:19822662 'stimulates
      transcription elongation'. While ESA1 may have indirect negative effects on some genes through
      complex silencing mechanisms (PMID:16436512), the primary and direct documented role is
      POSITIVE regulation. The 'negative regulation' annotation appears to be an algorithmic error
      in ARBA machine learning model.
    supported_by: []
  qualifier: involved_in
  supporting_entities:
