suggested_questions:
- question: How does H4 acetylation by ESA1 promote chromatin accessibility at DSBs while ESA1 also
    promotes rDNA heterochromatin formation? What is the mechanistic basis for these apparently
    paradoxical 'distinct roles'?
- question: Is H3K56 acetylation during DNA replication a function of ESA1 or is this restricted to
    Gcn5? Current annotations do not explicitly capture S-phase-specific acetyltransferase activity.
- question: What is the biological significance of ESA1's 2-hydroxyisobutyrylation capability? Is
    this an in vitro artifact or a documented in vivo modification in yeast?
- question: Are there documented cases where ESA1/NuA4 acts as a net repressor of transcription
    beyond the complex rDNA silencing mechanisms?
- question: How is ESA1 catalytic activity regulated in different cell cycle phases? Is there
    phosphorylation-dependent regulation as suggested by PMID:16135807?
- question: What is the relationship between ESA1-catalyzed histone acetylation and ESA1-catalyzed
    histone crotonylation? Do these occur on the same nucleosomes or mark different genes?
suggested_experiments:
- description: Chromatin immunoprecipitation (ChIP) of ESA1 across the genome combined with H3K56ac,
    H4K5/8/12/16ac, and H3K14ac marks to map site-specific acetylation patterns
- description: Quantitative mass spectrometry analysis of ESA1 substrate specificity and
    stoichiometry for histone and non-histone substrates in vivo
- description: Conditional degron/degradation studies of ESA1 to assess immediate vs. indirect
    effects on transcription, DNA repair, and autophagy
- description: Biochemical reconstitution of NuA4 complex with recombinant ESA1 mutants to define
    structure-function relationships for catalysis, substrate recognition, and complex assembly
- description: Metabolomics analysis of esa1 mutants vs. wildtype to assess changes in fatty acid
    synthesis, autophagy flux, and cellular energy metabolism
- description: Detailed analysis of ESA1 posttranslational modifications (phosphorylation,
    autoacetylation) and their functional consequences
- description: Comparison of crotonylation vs. acetylation marks by ESA1 on the same substrates
    using mass spectrometry and ChIP-seq
