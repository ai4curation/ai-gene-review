      This annotation appears to be an artifact of ARBA ML misclassification and is contradicted
      by the primary literature.
    action: REMOVE
    reason: Literature overwhelmingly documents NuA4 as a transcriptional ACTIVATOR and POSITIVE
      regulator. PMID:10835360 'Activation domain-specific...transcription stimulation'; PMID:15175650
      'Recruitment...poises...for...activation'; PMID:19822662 'stimulates transcription elongation'.
      While ESA1 may have indirect negative effects on some genes through complex silencing
      mechanisms (PMID:16436512), the primary and direct documented role is POSITIVE regulation.
      The 'negative regulation' annotation appears to be an algorithmic error in ARBA machine
      learning model.
