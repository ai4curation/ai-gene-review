    supporting_text: we express a yeast ORF with homology to MYST family members and show it
      possesses histone acetyltransferase activity
  - reference_id: PMID:31699900
    supporting_text: Gcn5 and Esa1 function as histone crotonyltransferases to regulate
      crotonylation-dependent transcription
