    label: rDNA heterochromatin formation
  evidence_type: IMP
  original_reference_id: PMID:16436512
  review:
    summary: ESA1 has documented but mechanistically unclear roles in rDNA silencing. This appears
      paradoxical given ESA1's primary role as a transcriptional activator.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:16436512 ''Distinct roles for the essential MYST family HAT Esa1p in transcriptional
      silencing'' demonstrates ESA1 involvement in rDNA heterochromatin. However: (1) Mechanistically
      counterintuitive - how does H4 acetylation (typically euchromatin mark) promote heterochromatin
      formation? (2) The paper title emphasizes ''distinct roles'' suggesting indirect or complex mechanism;
      (3) ESA1''s primary documented function is transcriptional activation, not silencing. Mark as non-core.'
    supported_by:
    - reference_id: PMID:16436512
      supporting_text: Jan 25. Distinct roles for the essential MYST family HAT Esa1p in
        transcriptional silencing.
