descriptions:
- source: UniProt
  text: Phosphorylase is an important allosteric enzyme in carbohydrate metabolism.
    Enzymes from different sources differ in their regulatory mechanisms and in their
    natural substrates. However, all known phosphorylases share catalytic and structural
    properties.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P06738
  source_id: P06738
- source: Alliance_Imported
  text: Glycogen phosphorylase required for the mobilization of glycogen; non-essential;
    regulated by cyclic AMP-mediated phosphorylation; phosphorylation by Cdc28p may
    coordinately regulate carbohydrate metabolism and the cell cycle; expression is
    regulated by stress-response elements and by the HOG MAP kinase pathway
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPH1
  source_id: SGD:S000006364
- source: Alliance_Automated
  text: Enables glycogen phosphorylase activity. Involved in glycogen catabolic process.
    Located in cytoplasm. Human ortholog(s) of this gene implicated in glycogen storage
    disease; glycogen storage disease V; glycogen storage disease VI; lactic acidosis;
    and liver disease. Orthologous to human PYGB (glycogen phosphorylase B); PYGL
    (glycogen phosphorylase L); and PYGM (glycogen phosphorylase, muscle associated).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GPH1
  source_id: SGD:S000006364
