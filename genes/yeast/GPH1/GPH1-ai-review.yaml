gene_symbol: GPH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GPH1 (YPR160W) encodes the sole glycogen phosphorylase of Saccharomyces cerevisiae (EC 2.4.1.1),
  a pyridoxal 5'-phosphate-dependent GT35-family enzyme that releases glucose 1-phosphate from the non-reducing
  ends of glycogen alpha-1,4 chains by phosphorolysis, stopping four residues from a branch point; the
  resulting limit dextrin is processed by the debranching enzyme Gdb1. The active enzyme is a dimer and,
  unlike mammalian phosphorylases, is activated by phosphorylation of a single N-terminal threonine (Thr31).
  gph1 null cells lack phosphorylase activity and over-accumulate glycogen; GPH1 is induced in late exponential
  phase together with glycogen synthesis genes. Gph1 is cytosolic, concentrated in foci corresponding
  to glycogen particles, and degrades the cytosolic glycogen pool, distinct from the vacuolar pool hydrolysed
  by Sga1. Loss of GPH1 also reduces growth on non-fermentable carbon sources and alters phospholipid
  composition, probably indirectly.
