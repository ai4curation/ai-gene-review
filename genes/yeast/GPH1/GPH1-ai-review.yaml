suggested_questions:
- question: Are the growth defect on lactate/glycerol and the phosphatidylcholine decrease of gph1 mutants
    direct consequences of impaired glycogen mobilisation, or a separate role?
- question: Which kinase phosphorylates Gph1 Thr31 in vivo, and how does activation by a single N-terminal
    threonine differ structurally from the mammalian Ser14 mechanism?
