  review:
    summary: Hat1 is recruited to an HO-induced double-strand break and contributes to its repair.
    action: KEEP_AS_NON_CORE
    reason: hat1 deletion combined with H3 tail mutations specifically impairs recombinational repair
      of double-strand breaks, and Hat1 is recruited to a break, where it is needed for the rise in H4
      K12 acetylation and for chromatin reassembly after repair (PMID:21454479). Hat1 acts by supplying
      acetylated histones for chromatin restoration rather than in the repair reaction itself, so this
      is a real but non-core process.
