proposed_new_terms:
- proposed_name: histone acetyltransferase type B complex
  proposed_definition: A protein complex that catalyzes the acetylation of lysine residues on newly synthesized
    histone H4 that has not yet been incorporated into chromatin. In Saccharomyces cerevisiae the complex
    comprises the catalytic subunit Hat1 and the WD40 subunit Hat2, and in the nucleus also the histone
    chaperone Hif1.
  justification: GO has no term for the type B histone acetyltransferase. Hat1, Hat2 and Hif1 are annotated
    to GO:0000123 histone acetyltransferase complex, which is part_of chromatin, although the complex
    is defined by acting on histones not yet in chromatin. Proposed parent GO:0031248 protein acetyltransferase
    complex for that reason. Same request as in modules/scer_hat_b_complex.yaml.
  proposed_parent:
    id: GO:0031248
    label: protein acetyltransferase complex
  supported_by:
  - *id005
  - reference_id: PMID:14761951
    supporting_text: Hif1 is a component of a yeast heterotrimeric HAT-B complex, in which Hat2 bridges
      Hat1 and Hif1 proteins
proposed_ontology_changes:
- change_type: EDGE_DELETION
  ontology: GO
  about_node:
    id: GO:0000123
    label: histone acetyltransferase complex
  subject:
    id: GO:0000785
    label: chromatin
  predicate: BFO:0000050
  change_dsl: delete edge GO:0000123 BFO:0000050 GO:0000785
  justification: 'GO:0000123 is logically defined as any complex capable of histone acetyltransferase
    activity and is part_of chromatin, so every such complex is inferred to be part of chromatin. HAT-B
    is a counterexample: it acetylates histone H4 that is not in chromatin, yet Hat1, Hat2 and Hif1 inherit
    part_of chromatin through their GO:0000123 annotations. HAT-B is recruited to chromatin next to a
    double-strand break, so it is sometimes on chromatin, but not always part of it. The edge was added
    in geneontology/go-ontology#23892. Same request as in modules/scer_hat_b_complex.yaml.'
  origin: SELF_PROPOSED
  confidence: PROBABLE
  request_status: NOT_FILED
  ontology_state_verified: '2026-11-15'
  supported_by:
  - *id005
  - reference_id: file:yeast/HAT1/HAT1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Acetylates 'Lys-12' of free histone H4 in the cytoplasm.
knowledge_gaps:
- gap_statement: Hat1's catalytic base is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Glu255, proposed as the general base and annotated as the active site in UniProt (by author
    statement), is not essential for activity, and neither is any other nearby acidic residue, so Hat1
    may use an unusual catalytic mechanism among histone acetyltransferases.
  provenance:
  - reference_id: PMID:18753131
    supporting_text: Surprisingly neither this residue nor any other acidic residues near the enzymes
      active site were essential for enzymatic activity.
