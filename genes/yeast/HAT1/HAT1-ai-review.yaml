id: Q12341
gene_symbol: HAT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Hat1 (YPL001W, also KAT1) is the catalytic subunit of the type B histone acetyltransferase
  (HAT-B), a GNAT-family acetyltransferase with a Hat1-specific N-terminal domain. It transfers an acetyl
  group from acetyl-CoA to lysine 12, and to a lesser extent lysine 5, of newly synthesized histone H4
  that is not yet in chromatin; it does not acetylate H4 packaged in nucleosomes. Hat1 works with the
  WD40 subunit Hat2, which gives the complex high-affinity binding to H4 and recognizes the unmodified
  H3 tail, and in the nucleus the two also bind the histone chaperone Hif1 to form the NuB4 complex. Hat1
  is found in the cytoplasm and, predominantly, the nucleus, and its nuclear localization and catalytic
  activity are both needed for its in vivo roles. hat1 deletion is viable with little phenotype on its
  own, but together with histone H3 N-terminal tail mutations it impairs telomeric silencing and the recombinational
  repair of DNA double-strand breaks. Hat1 is recruited to chromatin next to a double-strand break, is
  required for the break-induced rise in H4 K12 acetylation there, and contributes to chromatin reassembly
  after repair.
