core_functions:
- description: Catalytic subunit of HAT-B. Hat1 acetylates lysine 12 (primary site) and lysine 5 (minor
    site) of newly synthesized histone H4 that is not yet in chromatin, using acetyl-CoA, in the cytoplasm
    and predominantly in the nucleus, where its activity is required in vivo. Hat2 confers high-affinity
    H4 binding; the nuclear complex also carries the H3-H4 chaperone Hif1.
