  review:
    summary: Abz2p itself catalyses the final step of PABA synthesis (ADC -> PABA + pyruvate), shown with purified
      enzyme, and abz2 deletion causes PABA auxotrophy rescued only by PABA or folate. GOA lacks this process although
      ABZ1 carries it; here the gene product performs the step, so this is participation rather than mere requirement.
