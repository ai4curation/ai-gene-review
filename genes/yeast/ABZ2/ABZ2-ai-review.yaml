id: Q03266
gene_symbol: ABZ2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ABZ2 (YMR289W) encodes 4-amino-4-deoxychorismate (ADC) lyase (EC 4.1.3.38), a pyridoxal-phosphate-dependent
  enzyme of the class IV aminotransferase fold that converts ADC, produced from chorismate by Abz1p, into p-aminobenzoate
  (PABA) and pyruvate. This is the last step of PABA biosynthesis, which supplies the aminobenzoyl moiety of folates.
  Abz2p founds a fungal group of ADC lyases with little sequence similarity to bacterial PabC or plant ADC lyases,
  yet it complements an E. coli pabC mutant. The purified enzyme is active only as a homodimer. Abz2p is cytoplasmic,
  so PABA synthesis in yeast occurs in the cytosol. abz2 deletion mutants require PABA or folate for growth and
  are hypersensitive to sulfanilamide.
