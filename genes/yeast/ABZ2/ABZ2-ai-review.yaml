    - *id003
core_functions:
- description: Homodimeric PLP-dependent 4-amino-4-deoxychorismate lyase (fungal-specific class IV aminotransferase-fold
    enzyme) that eliminates pyruvate from ADC and aromatises it to p-aminobenzoate, the second and last step of
    PABA synthesis for de novo folate biosynthesis, in the cytosol.
  molecular_function:
    id: GO:0008696
    label: 4-amino-4-deoxychorismate lyase activity
  directly_involved_in:
  - id: GO:0008153
    label: 4-aminobenzoate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id002
  - reference_id: PMID:17873082
    supporting_text: ABZ2 was able to rescue the p-aminobenzoate auxotrophy of an Escherichia coli pabC mutant
  - *id004
  - *id001
suggested_questions:
- question: What structural features let the fungal Abz2p lyase, which is unrelated in sequence to bacterial PabC,
    perform the same beta-elimination/aromatisation chemistry?
suggested_experiments:
- hypothesis: Abz2p uses a PLP-lysine Schiff base mechanism like E. coli PabC despite low sequence identity
  description: Determine the crystal structure of Abz2p with PLP and ADC/PABA, and test candidate catalytic lysine
    mutants for loss of ADC lyase activity and complementation of abz2 PABA auxotrophy.
  experiment_type: structural biology / site-directed mutagenesis
