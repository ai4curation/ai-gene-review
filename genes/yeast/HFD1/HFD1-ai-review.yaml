    label: aldehyde catabolic process
  evidence_type: IMP
  original_reference_id: PMID:25545362
  qualifier: involved_in
  review:
    summary: >-
      Deleting HFD1 was required to accumulate fatty aldehydes for heterologous alkane production, showing
      that Hfd1 is the main route removing long-chain fatty aldehydes.
    action: KEEP_AS_NON_CORE
    reason: >-
      Fatty aldehyde oxidation is a genuine Hfd1 role (aldehyde detoxification/turnover); evidence is
      from an engineered strain.
    supported_by:
    - reference_id: PMID:25545362
      supporting_text: >-
        elimination of the hexadecenal dehydrogenase Hfd1 and expression of a redox system are essential
        for alkane biosynthesis in yeast
- term:
    id: GO:0047770
    label: carboxylate reductase activity
  evidence_type: IMP
  original_reference_id: PMID:22633490
  qualifier: enables
  review:
    summary: >-
      GO:0047770 carboxylate reductase activity is EC 1.2.99.6 (aldehyde + generic acceptor + H2O = carboxylate
      + reduced acceptor). Hfd1 is an NAD+-dependent aldehyde dehydrogenase; the reaction studied in PMID:22633490
      is NAD+-dependent oxidation of hexadecenal to hexadecenoic acid, for which UniProt cites EC 1.2.1.3
      and RHEA:33739.
    action: MODIFY
    reason: >-
      The underlying finding (oxidation of the S1P-derived fatty aldehyde) is sound, but the acceptor-unspecified
      EC 1.2.99.6 term is the wrong enzyme class; the NAD+-dependent long-chain fatty aldehyde dehydrogenase
      term is correct.
    proposed_replacement_terms:
    - id: GO:0050061
      label: long-chain fatty aldehyde dehydrogenase (NAD+) activity
    supported_by:
    - *id001
    - reference_id: file:yeast/HFD1/HFD1-uniprot.txt
      supporting_text: Reaction=hexadecanoate + NADH + 2 H(+) = hexadecanal + NAD(+) + H2O;
- term:
    id: GO:0050061
    label: long-chain fatty aldehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:33739
  review:
    summary: >-
      RHEA-based IEA (RHEA:33739 hexadecanal/hexadecanoate, NAD+), which UniProt annotates experimentally
      from PMID:22633490; purified Hfd1 also oxidizes hexadecanal (PMID:27669165).
    action: ACCEPT
    reason: Correct and more specific than GO:0004029 for the sphingolipid-degradation role.
    supported_by:
    - &id010
      reference_id: PMID:27669165
      supporting_text: >-
        we observed Hfd1p activity in vitro with hexadecanal, similar to that observed with 4-HBz
    - *id001
