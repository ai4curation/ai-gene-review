id: Q04458
gene_symbol: HFD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  HFD1 (YMR110C) encodes a broad-specificity, NAD+-dependent fatty aldehyde dehydrogenase of the ALDH3-like
  branch of the aldehyde dehydrogenase superfamily. It is a tail-anchored protein found on the mitochondrial
  outer membrane and on lipid droplets, with its catalytic domain facing the cytoplasm. Hfd1 has two characterized
  physiological roles. In the sphingosine 1-phosphate degradation route it oxidizes the S1P breakdown
  product hexadecenal to hexadecenoic acid, which is then activated to acyl-CoA for glycerolipid synthesis
  (the role of human ALDH3A2). In coenzyme Q biosynthesis it catalyses the last step of the tyrosine-to-4-hydroxybenzoate
  pathway, oxidizing 4-hydroxybenzaldehyde to 4-hydroxybenzoate, the aromatic ring precursor of CoQ6;
  hfd1 mutants are deficient in 4-hydroxybenzoate and CoQ when para-aminobenzoate is unavailable, and
  the defect is rescued by human ALDH3A1. Hfd1 also limits long-chain fatty aldehyde accumulation in general.
