gene_symbol: HFD1
organism: yeast
uniprot_id: Q04458
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the oxidation of long-chain aliphatic aldehydes to fatty acids.
    Responsible for conversion of the sphingosine 1-phosphate (S1P) degradation product
    hexadecenal to hexadecenoic acid (PubMed:22633490). Involved in coenzyme Q (CoQ)
    biosynthesis, catalyzing the last step in the tyrosine to 4-hydroxybenzoate (4-HB)
    pathway. Oxidizes 4-hydroxybenzaldehyde (4-Hbz) to 4-HB, the aromatic precursor
    for coenzyme Q (PubMed:27669165, PubMed:27693056).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04458
  source_id: Q04458
- source: Alliance_Imported
  text: Dehydrogenase involved in ubiquinone and sphingolipid metabolism; converts
    4-hydroxybenzaldehyde into 4-hydroxybenzoate for ubiquinone anabolism, hexadecenal
    to hexadecenoic acid in sphingosine 1-phosphate catabolism; human homolog ALDH3A2,
    mutated in Sjogren-Larsson syndrome, can rescue yeast hfd1 mutant; human ALDH3A1,
    but not ALDH3A2, rescues pABA- respiratory growth phenotype of hfd1 null; data
    suggest that dual functions of Hfd1p have diverged in human ALDH3A1, ALDH3A2
  source_type: curated
  url: https://www.yeastgenome.org/locus/HFD1
  source_id: SGD:S000004716
- source: Alliance_Automated
  text: Enables 4-hydroxybenzaldehyde dehydrogenase (NAD+) activity and carboxylate
    reductase activity. Involved in aldehyde catabolic process; sphingolipid metabolic
    process; and ubiquinone biosynthetic process. Located in endosome membrane; lipid
    droplet; and mitochondrial outer membrane. Used to study Sjogren-Larsson syndrome.
    Human ortholog(s) of this gene implicated in Sjogren-Larsson syndrome and arteriosclerosis.
    Orthologous to several human genes including ALDH3A1 (aldehyde dehydrogenase 3
    family member A1); ALDH3A2 (aldehyde dehydrogenase 3 family member A2); and ALDH3B1
    (aldehyde dehydrogenase 3 family member B1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HFD1
  source_id: SGD:S000004716
