- source: Alliance_Automated
  text: Enables 4-hydroxybenzaldehyde dehydrogenase (NAD+) activity and carboxylate
    reductase activity. Involved in aldehyde catabolic process; sphingolipid metabolic
    process; and ubiquinone biosynthetic process. Located in endosome membrane; lipid
    droplet; and mitochondrial outer membrane. Used to study Sjogren-Larsson syndrome.
    Human ortholog(s) of this gene implicated in Sjogren-Larsson syndrome and arteriosclerosis.
    Orthologous to several human genes including ALDH3A1 (aldehyde dehydrogenase 3
    family member A1); ALDH3A2 (aldehyde dehydrogenase 3 family member A2); and ALDH3B1
    (aldehyde dehydrogenase 3 family member B1).
