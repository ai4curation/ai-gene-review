descriptions:
- source: UniProt
  text: Catalyzes the oxidation of long-chain aliphatic aldehydes to fatty acids.
    Responsible for conversion of the sphingosine 1-phosphate (S1P) degradation product
    hexadecenal to hexadecenoic acid (PubMed:22633490). Involved in coenzyme Q (CoQ)
    biosynthesis, catalyzing the last step in the tyrosine to 4-hydroxybenzoate (4-HB)
    pathway. Oxidizes 4-hydroxybenzaldehyde (4-Hbz) to 4-HB, the aromatic precursor
    for coenzyme Q (PubMed:27669165, PubMed:27693056).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04458
  source_id: Q04458
