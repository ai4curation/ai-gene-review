- source: Alliance_Imported
  text: Dehydrogenase involved in ubiquinone and sphingolipid metabolism; converts
    4-hydroxybenzaldehyde into 4-hydroxybenzoate for ubiquinone anabolism, hexadecenal
    to hexadecenoic acid in sphingosine 1-phosphate catabolism; human homolog ALDH3A2,
    mutated in Sjogren-Larsson syndrome, can rescue yeast hfd1 mutant; human ALDH3A1,
    but not ALDH3A2, rescues pABA- respiratory growth phenotype of hfd1 null; data
    suggest that dual functions of Hfd1p have diverged in human ALDH3A1, ALDH3A2
  source_type: curated
