gene_symbol: SWI4
organism: yeast
uniprot_id: P25302
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Part of a complex involved in cell-cycle-dependent transcription. SWI4 and
    SWI6 are required for formation of the cell- cycle box factor-DNA complex. The
    repeated element in the upstream region of HO (5'-CACGAAAA-3') is called the cell
    cycle box (CCB).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P25302
  source_id: P25302
- source: Alliance_Imported
  text: DNA binding component of the SBF complex (Swi4p-Swi6p); a transcriptional
    activator that in concert with MBF (Mbp1-Swi6p) regulates late G1-specific transcription
    of targets including cyclins and genes required for DNA synthesis and repair;
    Slt2p-independent regulator of cold growth; acetylation at two sites, K1016 and
    K1066, regulates interaction with Swi6p
  source_type: curated
  url: https://www.yeastgenome.org/locus/SWI4
  source_id: SGD:S000000913
- source: Alliance_Automated
  text: Enables DNA-binding transcription activator activity, RNA polymerase II-specific
    and identical protein binding activity. Involved in G1/S transition of mitotic
    cell cycle; cellular response to heat; and positive regulation of transcription
    by RNA polymerase II. Located in chromatin. Part of SBF transcription complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/SWI4
  source_id: SGD:S000000913
