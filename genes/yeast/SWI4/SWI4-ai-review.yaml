- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000917496
  - SGD:S000004172
  review:
    summary: >-
      PAINT inference of a cytoplasmic site of activity at the APSES-family node, seeded by a
      single donor, Swi6 (SGD:S000004172). Swi6 genuinely cycles between nucleus and
