proposed_new_terms: []
suggested_questions:
- question: >-
    Swi4 is the DNA-binding subunit of SBF, yet its IBA for GO:0000978 carries the
    contributes_to qualifier (seeded from S. pombe MBF subunits) while the activator IBA
    (GO:0001228) uses enables. Should the PAINT node distinguish the DNA-binding paralogs
    (Swi4, Mbp1, Res1/Res2) from the shared regulatory subunit (Swi6, Cdc10) so that
    DNA-binding and complex-identity terms (SBF versus MBF, cytoplasm) are placed on the
    correct branch rather than on the family node?
  experts:
  - Brenda Andrews
  - Linda Breeden
- question: >-
    Swi4-dependent, Swi6-independent promoter binding under cell-wall stress (the Swi4-Mpk1
    complex on FKS2) is currently represented only through GO:0034605 cellular response to
    heat and a generic transcription-regulation term. Is a cell-wall-integrity signalling or
    fungal-type cell wall organization process term the intended representation of this
    Rlm1-independent branch, and should the Swi4-Mpk1 complex itself be modelled as a
    distinct transcription regulator complex?
  experts:
  - David E. Levin
- question: >-
    Whi5 and Swi6 phosphorylation provide partially redundant routes to SBF activation, and
    Bck2 can activate SBF targets independently of Cln3. Which input is rate-limiting for
    SBF-driven CLN1/CLN2 transcription in daughter cells under physiological growth, and does
    Swi4 itself carry Cdc28 phosphorylations (UniProt records Ser255 and Ser806) that
    modulate SCB binding or Clb2-mediated shut-off?
  experts:
  - Curt Wittenberg
  - Jan M. Skotheim
suggested_experiments:
- hypothesis: >-
    The G1/S and cell-wall-stress functions of Swi4 are separable at the level of the
    C-terminal region: the Mpk1 docking site and the Swi6-binding surface can be mutated
    independently so that one output is lost while the other is retained.
  description: >-
    Construct swi4 alleles that ablate the MAPK docking motif but not the Swi6 interaction,
    and conversely alleles that block Swi6 binding while leaving the Mpk1 site intact
    (guided by the Baetz-Andrews C-terminal auto-inhibition mutants). Measure, in elutriated
    daughter cells and in cells shifted to 39 degrees C or Congo Red, CLN2 and FKS2 nascent
    transcription (4tU-seq), Swi4 and Mpk1 occupancy of the CLN2 and FKS2 promoters by ChIP,
    and cell-wall-stress sensitivity. A clean separation would confirm two distinct
    activation mechanisms operating on the same DNA-binding subunit.
  experiment_type: structure-function mutagenesis with promoter occupancy and nascent transcription readouts
- hypothesis: >-
    Full-length Swi4 is monomeric in vivo and the reported Swi4 self-association reflects
    the intramolecular C-to-N auto-inhibitory contact rather than homodimerisation.
  description: >-
    Co-express differentially tagged full-length SWI4 alleles from the native locus and test
    reciprocal co-immunoprecipitation in swi6 null and SWI6 backgrounds, with and without
    benzonase to exclude chromatin bridging; complement with single-molecule photobleaching
    or FRET of Swi4-GFP at SCB reporter arrays. Absence of trans association would settle
    the identical-protein-binding question and support the intramolecular model.
  experiment_type: in vivo stoichiometry and interaction analysis
