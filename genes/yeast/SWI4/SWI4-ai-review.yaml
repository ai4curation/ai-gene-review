- id: file:yeast/SWI4/SWI4-deep-research-falcon.md
  title: SWI4 deep research (falcon literature synthesis)
  findings:
  - statement: >-
      Swi4 is constitutively nuclear; regulation of SBF is by auto-inhibition, Swi6, Whi5
      and cyclin-Cdk1 rather than by Swi4 nuclear export.
    supporting_text: >-
      Swi4 is predominantly **nuclear** and was reported to remain nuclear throughout the
      mitotic cell cycle.
  - statement: >-
      SBF is Swi4-Swi6; MBF is the paralogous Mbp1-Swi6 complex and does not contain Swi4.
    supporting_text: >-
      SBF contains Swi4 plus Swi6, whereas the related MBF complex substitutes Mbp1 for
      Swi4 while retaining Swi6.
  - statement: >-
      The Swi4 C-to-N-terminal contact is an intramolecular auto-inhibitory fold-back, not
      homo-oligomerisation.
    supporting_text: >-
      Evidence that full-length Swi4 is monomeric favors **intramolecular** masking rather
      than inhibition through Swi4 oligomerization.
  - statement: >-
      The central ankyrin repeats of Swi4 bind the mitotic Clb2-Cdc28 kinase (Siegmund and
      Nasmyth 1996, not cached here).
    supporting_text: >-
      Four ankyrin repeats mediate protein interactions, including association with mitotic
      **Clb2–Cdc28/Cdk1**.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Automated Edison/falcon literature synthesis (11 page-level citations to Baetz and
      Andrews 1999, Siegmund and Nasmyth 1996, Su et al. 2024, Ravi et al. 2024 and the
      Nishikawa 2008 thesis). Its statements on Swi4 localization, SBF versus MBF
      composition and the monomeric/intramolecular auto-inhibition model were checked
      against the cached Baetz and Andrews full text and are used only to corroborate
      those primary-literature rows; the Clb2-Cdc28/ankyrin, Whi5/Swi6 redundancy and 2024
      SWI4 LUTI meiotic-entry material is orientation only and grades no annotation.
