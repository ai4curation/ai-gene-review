- id: PMID:40124484
  title: Swi4-dependent SWI4 transcription couples cell size to cell cycle commitment.
  findings:
  - statement: >-
      Swi4-dependent SWI4 autoregulation contributes to Swi4 accumulation during G1 and to
      the timing of Start.
    supporting_text: >-
      The role of Swi4-dependent SWI4 transcription in the Start transition is supported by
      four main lines of evidence
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Goswami et al. 2025, iScience; full text cached and read. Newer primary evidence that
      SBF-mediated SWI4 autoregulation contributes to Swi4 accumulation and the cell-size
      timing of Start; it reinforces the accepted G1/S and Pol II transcription rows.
- id: PMID:10490612
  title: Regulation of cell cycle transcription factor Swi4 through auto-inhibition
    of DNA binding.
  findings:
  - statement: >-
      Swi4 remains nuclear throughout the cell cycle, in contrast to Swi6.
    supporting_text: >-
      We conclude that, unlike Swi6, whose localization changes throughout the cell cycle,
      Swi4 remains nuclear throughout the cell cycle.
  - statement: >-
      Full-length Swi4 cannot bind SCBs without Swi6 because its C terminus intramolecularly
      masks the N-terminal DNA-binding domain; Swi6 binding to the C terminus relieves this.
    supporting_text: >-
      The interaction of the carboxy-terminal region of Swi4 with Swi6 alleviates this
      inhibition, allowing Swi4 to bind DNA.
  - statement: >-
      Swi4 is monomeric in solution and SBF is a 1:1 Swi4-Swi6 heterodimer.
    supporting_text: >-
      SBF ran at 180 kDa, a size which is close to the predicted size of a heterodimer of
      Swi4 (123 kDa) and Swi6 (91 kDa).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Baetz and Andrews 1999, Mol Cell Biol; full text cached and read. The key mechanistic
      paper for Swi4 auto-inhibition, localization and SBF reconstitution; also the source
      of the identical-protein-binding row, which the paper's own conclusion (monomeric
      Swi4) argues against.
