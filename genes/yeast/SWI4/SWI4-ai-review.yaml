id: P25302
gene_symbol: SWI4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  SWI4 encodes the 1093-residue sequence-specific DNA-binding subunit of SBF (SCB-binding
  factor), the Swi4-Swi6 heterodimer that drives the G1/S (Start) transcriptional program of
  budding yeast and is the functional analog of the metazoan E2F-DP activator. Its N-terminal
  APSES/KilA-N helix-turn-helix domain recognises the SCB element (consensus CRCGAAA, the
  "cell-cycle box" first defined in the HO promoter), a central block of ankyrin repeats binds
  the mitotic Clb2-Cdc28 kinase, and a conserved C-terminal region both binds Swi6 and folds
  back onto the DNA-binding domain so that full-length, monomeric Swi4 cannot bind DNA on its
  own; Swi6 binding to the C terminus relieves this auto-inhibition and supplies the
  transcriptional activation function. Swi4 is nuclear throughout the cell cycle, whereas Swi6
  shuttles and is nuclear only in late M and G1, so SBF assembles on SCB-containing promoters
  from late mitosis onward and sits there in a Whi5-repressed state until Cln3-Cdc28 (with
  Pcl9-Pho85, and with contributions from Swi6 phosphorylation and Bck2) inactivates Whi5.
  SBF then activates the G1 cyclin genes CLN1, CLN2, PCL1 and PCL2, the HO endonuclease gene,
  a battery of cell-wall and bud-emergence genes and several downstream transcription factors
  (roughly 180 promoters by ChIP-chip); because CLN1/CLN2 are SBF targets this closes the
  positive-feedback loop that makes Start switch-like. Clb-Cdc28 activity turns SBF off in
  G2/M. swi4 null cells are viable because the paralogous MBF (Mbp1-Swi6) complex can
  substitute at many promoters, but swi4 swi6 and swi4 mbp1 double mutants are inviable
  because G1 cyclin transcription fails. Independently of Start, Swi4 is the transcription
  factor targeted non-catalytically by the cell-wall-integrity MAP kinase Slt2/Mpk1 (and its
  pseudokinase paralog Mlp1): phosphorylated Mpk1 docks on the Swi4 C-terminal region,
  relieves auto-inhibition and forms a Swi6-independent Swi4-Mpk1 complex on the FKS2, CHA1,
  YKR013w and YLR042c promoters, after which Swi6 is recruited for transcription; this
  pathway is engaged by cell-wall stresses including growth at 39 degrees C. During meiotic
  entry SBF must be silenced, which is achieved jointly by Whi5 and by a long undecoded SWI4
  transcript isoform that represses the canonical SWI4 promoter.
