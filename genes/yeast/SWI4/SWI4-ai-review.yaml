- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:10490612
  qualifier: involved_in
  review:
    summary: >-
      Baetz and Andrews 1999 (full text cached; annotation sourced via ComplexPortal for the
      SBF complex). The paper reconstitutes SBF from insect-cell Swi4 and Swi6, shows that
      Swi4 alone cannot bind SCBs, that the Swi4 C terminus auto-inhibits DNA binding, and
      that Swi6 relieves the inhibition, all in the explicit context of SBF-driven induction
      of G1 cyclin genes at the G1/S transition.
    action: ACCEPT
    reason: >-
      The G1/S role of SBF is the framing and the biological readout of the paper (SCB::lacZ
      reporter activity in vivo), and the mechanistic finding, Swi6-relieved auto-inhibition
      of Swi4 DNA binding, is one of the regulatory layers that restricts SBF activity to
      late M/G1. Core function.
    supported_by:
    - reference_id: PMID:10490612
      supporting_text: >-
        Maximal expression of the G 1 cyclin genes CLN1 , CLN2 , PCL1 , and PCL2 at Start
        requires the activity of a transcription factor, SBF (SCB binding factor)
    - reference_id: PMID:10490612
      supporting_text: >-
        The interaction of the carboxy-terminal region of Swi4 with Swi6 alleviates this
        inhibition, allowing Swi4 to bind DNA.
- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:2649246
  qualifier: involved_in
  review:
    summary: >-
      Andrews and Herskowitz 1989 (Cell; abstract-only cache): gel-retardation and
      footprinting identify the cell-cycle box factor (CCBF, later SBF) that binds the CCB
      repeats responsible for late-G1 expression of HO; swi4 and swi6 mutant extracts lack
      the CCBF-promoter complex, and SWI4 and SWI6 are the only SWI genes required for
      CCB-driven expression in vivo.
    action: ACCEPT
    reason: >-
      Loss of Swi4 abolishes the factor that confers late-G1 (i.e. G1/S) periodicity on HO
      transcription; this is the founding IMP evidence that Swi4 acts in the G1/S
      transcriptional program. The paper predates the identification of the CLN targets, but
      the mutant phenotype is on the cell-cycle-regulated transcription that GO:0000082
      describes, and SGD applies GO:0000082 uniformly to the Start transcription machinery.
    supported_by:
    - reference_id: PMID:2649246
      supporting_text: >-
        We show that the SWI4 and SWI6 genes are required for formation of the
        CCBF-promoter complex in vitro, either as components of CCBF or as modulators of
        CCBF activity.
    - reference_id: PMID:2649246
      supporting_text: >-
        These observations indicate that the CCBF is responsible for cell-cycle regulation
        of HO and lead to the view that two of the SWI genes, SWI4 and SWI6, are
        specifically involved in this regulatory event.
