id: P01120
gene_symbol: RAS2
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for yeast RAS2, the Ras-family GTPase that drives cAMP/PKA signalling.
  The canonical function - regulation of adenylate cyclase, and the GTPase activity GOA holds with
  IDA and IBA - appears nowhere in the top five. Ranks 2, 3 and 4 are three pheromone-pathway terms,
  and two of them are the same terms, at the same two ranks, that ProTrek returns for yeast CDC37
  elsewhere in this batch: GO:0010969 at rank 2 and GO:0062038 at rank 3 for both proteins. Two unrelated
  yeast proteins receiving an identical pair of calls at identical ranks is a clean demonstration
  of a species-level attractor - the model has recognised 'S. cerevisiae protein' and is emitting
  the pathway that dominates yeast's annotated signalling literature. Rank 5 is an exact GOA match
  on positive regulation of pseudohyphal growth (IMP), which is the MAPK branch RAS2 genuinely feeds
  through Cdc42 and Ste20, so the correct call sits one rank below two wrong versions of its neighbouring
  pathway. Assessment: 1 correct novel, 2 nonparalog incorrect. Assessment: 1 correct novel (COR),
  2 nonparalog incorrect (NPI).
