predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0019003
    label: GDP binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 16.79), absent from GOA, which holds GTP binding (IDA) and generic nucleotide
      binding (IEA) but not GDP binding. RAS2 cycles between GTP- and GDP-bound states, and the GDP-bound
      form is the inactive state that CDC25 acts on - so GDP binding is correct, specific, and a genuine
      addition to the record. The one useful call in this list.
    supported_by:
    - reference_id: file:yeast/RAS2/RAS2-uniprot.txt
      supporting_text: >-
        Ras-like protein 2
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0010969
    label: regulation of pheromone-dependent signal transduction involved in conjugation with cellular
      fusion
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      Rank 2 (score 16.61), absent from GOA. The pheromone response pathway runs Ste2/Gpa1 to Ste20,
      Ste11, Ste7 and Fus3; RAS2 is not a component of it, and RAS2/cAMP-PKA signalling is generally
      antagonistic to the mating response. The retrieval has reached the correct MAPK neighbourhood
      by way of the kinases the filamentation and pheromone branches share, and then named the wrong
      branch. The identical term appears at the identical rank for CDC37 in this same batch.
    supported_by:
    - reference_id: file:yeast/RAS2/RAS2-uniprot.txt
      supporting_text: >-
        Belongs to the small GTPase superfamily. Ras family.
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0062038
    label: positive regulation of pheromone response MAPK cascade
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      Rank 3 (score 16.23), the positive-regulation refinement of rank 2 and wrong for the same reason
      - and again identical to CDC37's rank 3. RAS2 does positively regulate a MAPK cascade, but it
      is the filamentation cascade terminating on Ste12/Tec1, not the pheromone response. The distinction
      matters precisely because the two branches share Ste11 and Ste7, which is what makes this a
      hard error for a sequence-only method to avoid and an easy one for a curator to catch.
    supported_by:
    - reference_id: file:yeast/RAS2/RAS2-uniprot.txt
      supporting_text: >-
        Belongs to the small GTPase superfamily. Ras family.
