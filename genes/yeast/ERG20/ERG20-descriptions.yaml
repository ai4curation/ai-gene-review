- source: Alliance_Automated
  text: Enables (2E,6E)-farnesyl diphosphate synthase activity; dimethylallyltranstransferase
    activity; and isopentenyl-diphosphate delta-isomerase activity. Involved in ergosterol
    biosynthetic process and trans, trans-farnesyl diphosphate biosynthetic process.
    Located in endoplasmic reticulum. Human ortholog(s) of this gene implicated in
    porokeratosis. Orthologous to human FDPS (farnesyl diphosphate synthase).
