  text: Farnesyl pyrophosphate synthetase; has both dimethylallyltranstransferase
    and geranyltranstransferase activities; catalyzes the formation of C15 farnesyl
    pyrophosphate units for isoprenoid and sterol biosynthesis
  source_type: curated
