suggested_questions:
- question: The ERG20 IDA to IPP isomerase activity (GO:0004452) and ergosterol biosynthesis cite PMID:7908830,
    an Idi1 mutagenesis paper; should SGD move these to IDI1?
- question: Is there primary evidence for a vacuolar location of the yeast mevalonate/FPP module (Erg20,
    Idi1), as stated in the Hu et al. 2017 review and UniProt, or should those NAS annotations be retired?
suggested_experiments:
- description: Re-examine Erg20 localisation (endogenous tag, fractionation) under respiratory and sterol-limited
    conditions to test the reported ER association and any vacuolar pool.
