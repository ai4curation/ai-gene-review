id: P08524
gene_symbol: ERG20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG20 (YJL167W) encodes farnesyl diphosphate synthase (FPPS) of Saccharomyces cerevisiae,
  an essential, single-copy member of the FPP/GGPP synthase (polyprenyl synthetase) family that acts as
  a homodimeric, Mg2+-dependent trans-prenyltransferase. Erg20 catalyses the sequential head-to-tail condensation
  of isopentenyl diphosphate (IPP) with dimethylallyl diphosphate (DMAPP) to give geranyl diphosphate
  (GPP; EC 2.5.1.1) and of a second IPP with GPP to give (2E,6E)-farnesyl diphosphate (FPP; EC 2.5.1.10).
  FPP is the branch-point C15 isoprenoid that feeds ergosterol synthesis (via squalene synthase Erg9)
  and all essential non-sterol isoprenoids, including dolichols, the hexaprenyl tail of coenzyme Q6 (via
  Coq1), heme A farnesylation and protein prenylation; no other yeast prenyltransferase can supply this
  FPP. Erg20 is a soluble cytosolic enzyme that has also been found associated with the ER. Mutations
  at the chain-length/product-release region (e.g. K197E in erg20-2) cause GPP release and excretion of
  geraniol, and Erg20 activity can be rate-limiting for ergosterol synthesis.
