- source: Alliance_Imported
  text: Proline oxidase; nuclear-encoded mitochondrial protein involved in utilization
    of proline as sole nitrogen source; PUT1 transcription is induced by Put3p in
    the presence of proline and the absence of a preferred nitrogen source
  source_type: curated
  url: https://www.yeastgenome.org/locus/PUT1
  source_id: SGD:S000004132
- source: Alliance_Automated
  text: Enables proline dehydrogenase activity. Involved in L-proline catabolic process.
    Located in mitochondrion. Human ortholog(s) of this gene implicated in amino acid
    metabolic disorder; hydroxyprolinemia; hyperprolinemia type 1; and schizophrenia
    4. Orthologous to human PRODH (proline dehydrogenase 1) and PRODH2 (proline dehydrogenase
    2).
