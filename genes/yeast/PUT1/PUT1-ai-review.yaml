  label: Saccharomyces cerevisiae S288C
description: PUT1 (YLR142W) encodes mitochondrial proline dehydrogenase (proline oxidase, EC 1.5.5.2),
  a FAD-containing enzyme that oxidises L-proline to 1-pyrroline-5-carboxylate and passes electrons to
  ubiquinone in the respiratory chain. Together with P5C dehydrogenase (Put2) it converts proline to glutamate,
  allowing proline, and arginine via proline, to be used as a nitrogen source. PUT1 is induced by proline
  and its expression needs oxygen and a functional respiratory chain. Purified Put1p has a high Km for
  proline (36 mM) and uses CoQ1 efficiently; the electron-transfer flavoprotein is not required.
