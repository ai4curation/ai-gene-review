descriptions:
- source: UniProt
  text: Catalyzes the reversible transfer of the terminal phosphoryl group of ATP
    to the acceptor molecule GMP. Essential for recycling GMP and indirectly, cGMP.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P15454
  source_id: P15454
- source: Alliance_Imported
  text: Guanylate kinase; converts GMP to GDP; required for growth and mannose outer
    chain elongation of cell wall N-linked glycoproteins
  source_type: curated
  url: https://www.yeastgenome.org/locus/GUK1
  source_id: SGD:S000002862
- source: Alliance_Automated
  text: Enables GMP kinase activity. Involved in GDP biosynthetic process. Located
    in cytoplasm and nucleus. Used to study cancer. Human ortholog(s) of this gene
    implicated in mitochondrial DNA depletion syndrome-21. Orthologous to human GUK1
    (guanylate kinase 1).
  source_type: automated
