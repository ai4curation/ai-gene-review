id: P15454
gene_symbol: GUK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GUK1 (YDR454C) encodes guanylate kinase (EC 2.7.4.8), the essential cytoplasmic monomeric
  enzyme that transfers the gamma-phosphate of ATP to GMP to form GDP, the obligatory step linking GMP
  (from de novo synthesis via Imd/Gua1 or from guanine salvage via Hpt1) to GDP/GTP and dGTP. GUK1 disruption
  is lethal. Hypomorphic alleles (bra3/pur5) accumulate GMP, which feedback-inhibits hypoxanthine-guanine
  phosphoribosyltransferase (Hpt1), deregulating ADE gene expression, causing purine excretion and purine-analogue
  resistance.
