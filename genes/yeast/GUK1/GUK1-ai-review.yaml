suggested_questions:
- question: Does Guk1 also phosphorylate dGMP efficiently in vivo, and is it the sole route to dGDP for
    DNA synthesis in yeast?
suggested_experiments:
- description: Determine kinetic parameters of purified Guk1 for GMP versus dGMP and measure dGTP pools
    in hypomorphic guk1 (bra3) mutants.
