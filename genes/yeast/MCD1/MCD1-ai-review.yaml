- description: >-
    Closes the cohesin ring that topologically entraps the replicated sister chromatids, establishing sister chromatid
    cohesion during S phase and maintaining it, especially at the pericentromere, until anaphase; Esp1 (separase)
    cleavage of Mcd1 after Arg-180 and Arg-268 then opens the ring and triggers sister-chromatid separation, so
    Mcd1 is the cleavable gate that couples cohesion to chromosome segregation.
