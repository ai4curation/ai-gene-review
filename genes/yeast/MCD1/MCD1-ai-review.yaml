suggested_questions:
- question: >-
    Neither budding-yeast MCD1 nor its RAD21 orthologs carry GO:0007091 metaphase/anaphase transition of mitotic
    cell cycle, yet the kleisin is the cleavable link whose separase cleavage constitutes the transition (analogous
    to fibrinogen carrying GO:0042730 fibrinolysis). Should the SGD 'G2/M transition' IPI row derived from the Cdc5-docking
    study be re-termed to GO:0007091, or dropped on the grounds that Mcd1 is only the substrate, with the biology
    recorded as has_input on ESP1?
  experts:
  - Nasmyth K
  - Uhlmann F
  - Koshland D
- question: >-
    Budding-yeast cohesin builds cis loops and compacts arms in G2/M (Hi-C), and mcd1-1 is condensation-defective,
    but no yeast cohesin subunit carries GO:0140588 chromatin looping, and the 2024 'extrinsic motor' model questions
    whether yeast cohesin extrudes loops in vivo. Should Mcd1 receive a chromatin-looping/loop-anchoring annotation,
    and if so under which evidence?
  experts:
  - Uhlmann F
  - Aragon L
  - Koshland D
- question: >-
    Eco1 acetylates Mcd1 Lys-210 in vitro, but the functional consequence (if any) of Mcd1 acetylation, as opposed
    to Smc3 K112/K113 acetylation, has not been established; is there a physiological role that would justify recording
    Mcd1 as a participant rather than merely a substrate in cohesion establishment?
  experts:
  - Nasmyth K
  - Skibbens RV
suggested_experiments:
- hypothesis: Mcd1's cohesive and loop-organizing pools are separable by residues in its middle region.
  description: >-
    Auxin-inducible degradation of endogenous Mcd1 in G2/M-arrested cells, complemented by structure-guided middle-region
    mutants (Scc3-docking, Cdc5-priming and S83 sites), combined with sister-chromatid-resolved Hi-C and FISH cohesion
    assays to separate the contributions of Mcd1-cohesin to cis loop/arm compaction versus sister chromatid cohesion.
  experiment_type: degron genetics + Hi-C + FISH
- hypothesis: Mcd1 Lys-210 acetylation by Eco1 has no role in cohesion establishment.
  description: >-
    Compare mcd1-K210R and K210Q alleles (with and without smc3-K113Q bypass and wpl1 deletion) for cohesion establishment
    by GFP-dot assays, Smc3 acetylation kinetics, and Wpl1 sensitivity, to test whether Mcd1 acetylation has any
    physiological output distinct from Smc3 acetylation.
  experiment_type: site-directed mutagenesis + cohesion assay
- hypothesis: >-
    The oxidative-stress Esp1 cleavage of Mcd1 uses the mitotic cleavage sites and is dispensable for death when
    both sites are mutated.
  description: >-
    Express separase-noncleavable Mcd1 (R180D R268D) from the endogenous locus in cells kept viable by a TEV-cleavable
    rescue, treat with H2O2, and quantify Mcd1 fragment formation, mitochondrial relocalization and survival to
    determine whether the stress-induced cleavage and death amplification depend on the canonical separase sites.
  experiment_type: cleavage-site mutagenesis + cell-death assay
