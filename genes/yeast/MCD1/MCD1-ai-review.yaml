core_functions:
- description: >-
    Acts as the alpha-kleisin adaptor of cohesin: its N-terminal domain binds the Smc3 ATPase head and its C-terminal
    winged-helix domain binds the Smc1 head, bridging the two heads to close the Smc1-Smc3-Mcd1 ring, while its
    central region docks Scc3 and, through phospho-priming, the polo kinase Cdc5; this non-catalytic bridging/scaffolding
    role assembles a functional mitotic cohesin complex on chromatin.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
