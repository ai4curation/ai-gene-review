id: Q12158
gene_symbol: MCD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Mcd1 (Scc1, Pds3, Rhc21) is the alpha-kleisin subunit of the mitotic cohesin complex of Saccharomyces cerevisiae
  and the ortholog of fission-yeast Rad21 and human RAD21. It is an essential 566-residue nuclear protein whose
  N-terminal domain binds the ATPase head/neck of Smc3 and whose C-terminal winged-helix domain binds the ATPase
  head of Smc1, so that Mcd1 bridges the two SMC heads and closes the tripartite Smc1-Smc3-Mcd1 ring; its central,
  largely unstructured region carries the docking site for the HEAT-repeat subunit Scc3 (Irr1), the two separase
  cleavage sites (after Arg-180 and Arg-268) and the Cdc5 polo-kinase phosphorylation and docking sites. Mcd1 has
  no catalytic activity; ATP binding and hydrolysis are performed by the Smc heads. MCD1 is transcribed in late
  G1, the protein is loaded with the rest of cohesin onto chromosomes by the Scc2-Scc4 loader, initially at centromeres
  and at arm sites roughly every 10-15 kb, and during DNA replication the loaded rings are converted by Eco1-dependent
  acetylation of Smc3 into a cohesive form that topologically entraps the two sister chromatids. Mcd1-containing
  cohesin holds sisters together from S phase until metaphase, most importantly in the pericentromeric domain where
  it resists spindle forces and allows biorientation; it also compacts chromosome arms in cis and is required for
  mitotic condensation of the rDNA and arm sequences. At anaphase onset, APC/C-Cdc20-mediated destruction of the
  securin Pds1 releases the separase Esp1, which cleaves Mcd1 at its two sites (accelerated by Cdc5 phosphorylation
  of Ser-175/Ser-263), opening the ring and triggering sister-chromatid separation; the cleaved fragments are degraded
  and cohesin is rebuilt from newly synthesized Mcd1 in the next cycle. Because cohesin tethers the undamaged sister
  next to a break, Mcd1-cohesin is required for post-replicative repair of double-strand breaks by sister-chromatid
  exchange; after a break in G2/M, Mec1-Chk1-dependent phosphorylation of Mcd1 Ser-83 converts chromatin-bound cohesin
  into cohesive cohesin (damage-induced cohesion), a property specific to Mcd1 and not shared by its meiotic paralog
  Rec8, and separase-dependent removal of Mcd1 is later needed for efficient resection and repair. Under oxidative
  stress Esp1 also cleaves Mcd1, and a small C-terminal fragment relocates to mitochondria and amplifies cell death
  in a cytochrome c-dependent manner.
