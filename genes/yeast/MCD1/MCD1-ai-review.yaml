- term:
    id: GO:0006473
    label: protein acetylation
  evidence_type: IDA
  original_reference_id: PMID:11864574
  qualifier: involved_in
  review:
    summary: >-
      Ivanov et al. (abstract only cached) identified Eco1 as an acetyltransferase and showed that in vitro it acetylates
      itself and cohesin subunits; UniProt records Mcd1 Lys-210 as an Eco1 acetylation site. In this experiment
      Mcd1 is the acetyl-acceptor substrate; the acetyl transfer is catalysed entirely by Eco1.
    action: REMOVE
    reason: >-
      Being acetylated is not participating in protein acetylation: the gene product that performs the step is Eco1,
      and GO records substrate relationships on the enzyme (has input), not on the substrate. Mcd1 contributes no
      catalysis, scaffold or cofactor activity to the reaction, and the physiologically important Eco1 substrate
      for cohesion establishment is Smc3 (K112/K113), with no established function for Mcd1 acetylation. The in
      vitro acetylation itself is not disputed and is properly captured as a UniProt PTM feature; removal only corrects
      the process attribution.
    supported_by:
    - reference_id: PMID:11864574
      supporting_text: In vitro Eco1 acetylates itself and components of the cohesin complex but not histones.
      reference_section_type: ABSTRACT
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:18321989
  qualifier: involved_in
  review:
    summary: >-
      Full text read. Under H2O2 stress Esp1, released from Pds1, cleaves Mcd1; a small C-terminal fragment moves
      to mitochondria, collapses membrane potential and amplifies death in a Cyc1-dependent manner. Overexpressing
      the C-terminal 40 residues lowers survival, whereas MCD1/mcd1 heterozygotes (reduced Mcd1) survive H2O2 better,
      so Mcd1 dosage modulates the death response.
    action: KEEP_AS_NON_CORE
    reason: >-
      The Mcd1 fragment is an active effector here (its translocation causes the mitochondrial potential loss),
      so participation is met and the IMP stands, but it is a single-study, oxidative-stress-specific role that
      reuses the mitotic cleavage event, and whether yeast H2O2-induced death is a bona fide apoptotic process remains
      debated. Peripheral to the core chromosome function, as also judged in the ESP1 review.
    supported_by:
    - reference_id: PMID:18321989
      supporting_text: >-
        the survival rate of Mcd1-C40aa overexpressed cells decreased significantly, compared with the wild type
      reference_section_type: RESULTS
    - reference_id: PMID:18321989
      supporting_text: underexpression of MCD1 (only one copy of functional MCD1 ) increased cell's survival rate
      reference_section_type: RESULTS
