    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11805837
  qualifier: enables
  supporting_entities:
  - UniProtKB:P32908
  review:
    summary: >-
      IPI with the cohesin subunit Smc1. The C-terminal winged-helix domain of Mcd1 binds the Smc1 ATPase head;
      together these contacts are how the kleisin bridges the Smc1 and Smc3 heads and closes the tripartite cohesin
      ring, with Scc3 hung on the middle of the kleisin. This row derives from the Ho et al. high-throughput HMS-PCI
      mass-spectrometry screen (abstract only cached), in which the cohesin subunits co-purified; the dataset itself
      only establishes co-complex membership and does not define a Mcd1 molecular function beyond the mitotic cohesin-complex
      membership already captured by GO:0030892.
    action: REMOVE
    reason: >-
      Generic protein binding is uninformative, and this high-throughput HMS-PCI co-purification row does not establish
      a direct partner-Mcd1 contact or assay Mcd1's adaptor activity. The cohesin interaction is not disputed; this
      row is better dropped while targeted architecture and FRET rows carry the evidence-backed GO:0030674 replacement.
    supported_by:
