- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IPI
  original_reference_id: PMID:27325700
  qualifier: involved_in
  supporting_entities:
  - SGD:S000004603
  review:
    summary: >-
      Full text read. Kim et al. show by ChIP-seq that Cdc5 (polo kinase) is deposited on chromosome arms of G2/M-arrested
      cells through PBD-dependent binding to phosphorylated Ser/Thr residues in the middle region (residues 158-275)
      of Scc1/Mcd1, that cohesin is essentially the only chromosomal platform for this PBD-dependent Cdc5 binding,
      and that the priming-site mutant scc1-15A gives a synthetic growth defect and phleomycin sensitivity with
      pds1 deletion. The mechanistic content concerns Cdc5-dependent phosphorylation of Mcd1 near its separase cleavage
      sites (Ser-175/Ser-263), which accelerates cleavage at anaphase onset, and a DNA-damage role; nothing in the
      paper assays the G2-to-M commitment (M-CDK activation) that GO:0000086 denotes.
    action: MODIFY
    reason: >-
      The term GO:0000086 'G2/M transition of mitotic cell cycle' is defined by M-cyclin/CDK activation and G2 commitment
      to M phase; the paper does not address that transition (cells were benomyl-arrested in G2/M and the phenotypes
      concern anaphase cleavage and DSB sensitivity). The cell-cycle process that the Mcd1-Cdc5 association actually
      feeds is the metaphase-to-anaphase transition, in which Mcd1 supplies the cleavable sister-sister link that
      separase opens and Cdc5 phosphorylation of Mcd1 tunes the timing of that cleavage (PMID:10403247, PMID:11371343).
      GO:0007091 is therefore proposed as the more accurate cell-cycle term. Caveat for the curator: RAD21 orthologs
      in human and S. pombe do not currently carry GO:0007091 (the kleisin is the substrate the transition acts
      on), so if the substrate role is judged non-participatory the row should be dropped rather than retained under
      the G2/M term.
    proposed_replacement_terms:
    - id: GO:0007091
      label: metaphase/anaphase transition of mitotic cell cycle
    additional_reference_ids:
    - PMID:10403247
    - PMID:11371343
    supported_by:
    - reference_id: PMID:27325700
      supporting_text: >-
        In cohesin-depleted cells, Cdc5 binding to chromosomes was almost completely abolished, revealing that among
        chromosome-bound proteins, cohesin is the only major target of PBD-dependent Cdc5 binding.
      reference_section_type: ABSTRACT
    - reference_id: PMID:27325700
      supporting_text: The scc1-plk(−) mutation enhanced temperature sensitivity of the pds1Δ mutant (Fig. 8B)
      reference_section_type: RESULTS
    - reference_id: PMID:10403247
      supporting_text: >-
        A mutant Scc1 is described that is resistant to Esp1-dependent cleavage and which blocks both sister-chromatid
        separation and the dissociation of Scc1 from chromosomes.
      reference_section_type: ABSTRACT
- term:
    id: GO:0000775
    label: chromosome, centromeric region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0047
  review:
    summary: >-
      UniProt subcellular-location mapping. Budding-yeast cohesin is loaded at CEN sequences and is strongly enriched
      over a ~20-50 kb pericentromeric domain, where it forms the metaphase 'barrel' that resists spindle tension;
      Mcd1 is the kleisin of that centromeric cohesin pool, and MCD1 overexpression in G1 is sufficient to enrich
      Smc1 at core CEN and pericentric sequences (PMID:31582854).
    action: ACCEPT
    reason: >-
      Centromeric/pericentromeric enrichment of Mcd1-containing cohesin is directly demonstrated by ChIP and imaging
      in budding yeast, and it is the physiologically most important cohesin pool for biorientation; the electronic
      mapping is consistent with the experimental picture.
    supported_by:
    - reference_id: PMID:31582854
      supporting_text: >-
        In Saccharomyces cerevisiae CEN sequences are cohesin loading sites where complexes initially access chromosomes
        before spreading towards pericentric regions
      reference_section_type: RESULTS
    - reference_id: PMID:31582854
      supporting_text: >-
        expression of MCD1 from the GAL1-10 promoter caused a significant enrichment of Smc1 both at core CEN sequences
        and the surrounding pericentric regions (Fig. 2c)
      reference_section_type: RESULTS
- term:
    id: GO:0000794
    label: condensed nuclear chromosome
  evidence_type: IDA
  original_reference_id: PMID:18614046
  qualifier: located_in
  review:
    summary: >-
      Heidinger-Pauli et al. (abstract only cached) study Mcd1-containing cohesin bound to chromatin in G2/M-arrested
      cells, where a DSB converts it into cohesive cohesin via Chk1-dependent phosphorylation of Mcd1 Ser-83. Mcd1
      is on mitotic (condensed) chromosomes from S phase until anaphase: Guacci et al. show punctate nuclear Mcd1
      in mid-M cells and its requirement for rDNA and arm condensation, and Toth et al. show Scc1 on chromosome
      spreads until anaphase onset.
    action: ACCEPT
    reason: >-
      Localization to M-phase chromosomes is well established for Mcd1 (chromosome spreads, ChIP, FLIP on the metaphase
      pericentromeric barrel) and the curator read the full text; the cached abstract is consistent (chromatin-bound
      cohesin in G2/M). Accepted as a core location.
    supported_by:
    - reference_id: PMID:18614046
      supporting_text: Serine 83 phosphorylation promotes chromatin-bound cohesin to become cohesive.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9335334
      supporting_text: >-
        Mcd1p was barely detectable in G1 phase, at high levels in S phase, and at lower levels in mid-M phase with
        a punctate nuclear localization in S and mid-M phases
      reference_section_type: RESULTS
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000286904
  - SGD:S000002161
  - SGD:S000006211
  review:
    summary: >-
      PAINT inference (node PTN000286904, seeded by MCD1's own experimental annotation and by REC8). Mcd1 associates
      with chromatin from late G1 until anaphase as part of the cohesin ring, and its chromatin association is abolished
      in smc1, smc3, scc3 and scc2 mutants, showing that it binds chromatin as a subunit of the loaded complex.
    action: ACCEPT
    reason: >-
      Chromatin binding is directly supported by chromatin fractionation, chromosome spreads and ChIP for Mcd1/Scc1,
      and is a reasonable molecular-function-level description for a chromatin-bound structural subunit. MCD1 appearing
      in its own WITH/FROM is expected: its IDA is one of the descendant evidences behind the IBD.
    supported_by:
    - reference_id: PMID:9990856
      supporting_text: >-
        Scc1p’s abundance in both supernatants and chromatin pellets was greatly reduced in both smc1-259 and smc3-42
        mutants
      reference_section_type: RESULTS
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IDA
  original_reference_id: PMID:18614046
  qualifier: enables
  review:
    summary: >-
      Abstract-only cached. The study distinguishes chromatin-bound cohesin from cohesive cohesin and shows that
      DSB-induced phosphorylation of Mcd1 Ser-83 converts the former into the latter in G2/M; chromatin-bound Mcd1-cohesin
      is the starting material of the assay.
    action: ACCEPT
    reason: >-
      Consistent with all other evidence that Mcd1 is a chromatin-bound protein; deferring to the SGD curator on
      the specific assay (ChIP) in the full text.
    supported_by:
    - reference_id: PMID:18614046
      supporting_text: Serine 83 phosphorylation promotes chromatin-bound cohesin to become cohesive.
      reference_section_type: ABSTRACT
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IDA
  original_reference_id: PMID:9990856
  qualifier: enables
  review:
    summary: >-
      Toth et al. fractionated chromatin and prepared chromosome spreads from synchronized cells: Scc1-HA is recovered
      in chromatin pellets and on spread chromosomes from late G1 until anaphase, colocalizes with Scc3 and Smc3,
      and its chromatin association depends on Smc1, Smc3, Scc3 and the loader Scc2.
    action: ACCEPT
    reason: Direct chromatin-fractionation and chromosome-spread evidence for Mcd1 chromatin association.
    supported_by:
    - reference_id: PMID:9990856
      supporting_text: >-
        The amount of Scc1–HA6p bound to chromosomes in spreads was also strongly reduced in scc3-1 (Fig. 6 C),
        scc2-1, smc1-259 , and smc3-42 mutant
      reference_section_type: RESULTS
    - reference_id: PMID:9990856
      supporting_text: >-
        The colocalization of Scc1p with Scc3p and Smc3p in chromosome spreads and the interdependence of their
        association with chromosomes suggests that Scc1p, Scc3p, Smc1p, and Smc3p also bind chromosomes as a multisubunit
        complex.
      reference_section_type: DISCUSSION
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10882066
  qualifier: enables
  supporting_entities:
  - UniProtKB:P40541
  review:
    summary: >-
      IPI with the cohesin subunit Scc3 (Irr1). The central region of Mcd1 is the docking site for the HEAT-repeat
      subunit Scc3/Irr1; together these contacts are how the kleisin bridges the Smc1 and Smc3 heads and closes
      the tripartite cohesin ring, with Scc3 hung on the middle of the kleisin. Ciosk et al. (abstract only cached)
      show that cohesin complexes containing Scc1 and Scc3 assemble normally in scc2/scc4 mutants but fail to load
      onto chromosomes, i.e. the Mcd1-Scc3 association is loader-independent. Bare 'protein binding' does not convey
      this: the informative molecular function is Mcd1's role as the kleisin adaptor that brings the two SMC heads
      and the HEAT-repeat subunit together to assemble a functional cohesin ring.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative. The Mcd1-Scc3 (Irr1) interaction is genuine and structurally defined
      (PMID:11983169; FRET in PMID:17660750; crystal/cryo-EM structures 1W1W, 4UX3, 6QPQ, 6ZZ6 listed in UniProt),
      and it reflects Mcd1's non-catalytic adaptor/bridging role connecting Smc1, Smc3 and Scc3, which GO captures
      as protein-macromolecule adaptor activity (the same resolution used for human RAD21 and fission-yeast Rad21).
      Complex membership is separately annotated (GO:0030892).
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:10882066
      supporting_text: complex is to facilitate the loading of cohesin complexes onto chromosomes.
      reference_section_type: ABSTRACT
    - reference_id: PMID:17660750
      supporting_text: >-
        Biochemical evidence suggests that Scc3 interacts with the Scc1 C-terminal half, and associates with the
        cohesin complex in an Scc1-dependent manner (Haering et al, 2002).
      reference_section_type: RESULTS
    additional_reference_ids:
    - PMID:17660750
    - PMID:11983169
