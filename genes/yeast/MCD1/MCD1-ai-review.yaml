- term:
    id: GO:0006302
    label: double-strand break repair
  evidence_type: IMP
  original_reference_id: PMID:11448778
  qualifier: involved_in
  review:
    summary: >-
      Sjogren & Nasmyth (abstract only cached) showed that cohesin mutants (scc1 among them) are defective in post-replicative
      repair of gamma-irradiation-induced DSBs in G2, and that it is passage through S phase with cohesin, i.e.
      established cohesion, rather than cohesin per se that is needed: the sister chromatid must be held in place
      as the recombination template.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mcd1-cohesin does part of the work of sister-chromatid-templated repair by physically tethering the intact
      sister next to the broken one (the scaffold form of participation), so involved_in is appropriate, and the
      same term is carried by human RAD21 and S. pombe rad21. It is nevertheless secondary to the core cohesion
      function, and the cached abstract does not name the scc1 allele used, so the curator is deferred to on that
      detail.
    supported_by:
    - reference_id: PMID:11448778
      supporting_text: >-
        We show here that passage through S phase in the presence of cohesin, and not cohesin per se, is essential
        for efficient double-strand break repair during G2 in yeast.
      reference_section_type: ABSTRACT
    - reference_id: PMID:16888651
      supporting_text: >-
        Our results indicate that cohesion is required to assist postreplicative repair of DNA breaks by holding
        sister chromatids together, ensuring the choice of the sister chromatid as HR partner, rather than having
        an enzymatic role in the HR reaction.
      reference_section_type: DISCUSSION
- term:
    id: GO:0006302
    label: double-strand break repair
  evidence_type: IMP
  original_reference_id: PMID:23178808
  qualifier: involved_in
  review:
    summary: >-
      McAleenan et al. (abstract only cached) show that DSBs trigger separase-dependent dissociation of cohesin
      loaded in the previous S phase and that a separase-resistant MCD1 allele reduces resection and compromises
      repair even when damage-induced cohesin is loaded; regulated removal of the Mcd1 kleisin is thus part of the
      repair programme.
    action: KEEP_AS_NON_CORE
    reason: >-
      Genuine, allele-specific (non-cleavable Mcd1) evidence that the kleisin's cleavability is required for efficient
      post-replicative repair, complementing the tethering role above. Here Mcd1 is the substrate whose removal
      Esp1 performs, but the annotation is retained because Mcd1-cohesin also supplies the sister-tethering structure
      that the repair depends on; non-core relative to cohesion.
    supported_by:
    - reference_id: PMID:23178808
      supporting_text: >-
        a separase-resistant allele of the gene coding for the α-kleisin subunit of cohesin, Mcd1 (also known as
