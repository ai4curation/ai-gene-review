- source: Alliance_Imported
  text: Essential alpha-kleisin subunit of the cohesin complex; required for sister
    chromatid cohesion in mitosis; subject to proteolytic cleavage by separase Esp1p,
    resulting in dissociation of cohesin from chromatin and the separation of sister
    chromatids at the mitotic metaphase-to-anaphase transition; apoptosis induces
    cleavage and translocation of a C-terminal fragment to mitochondria; expression
    peaks in S phase
  source_type: curated
