- source: Alliance_Automated
  text: Enables chromatin binding activity and protein kinase binding activity. Involved
    in several processes, including G2/M transition of mitotic cell cycle; chromosome
    organization; and replication-born double-strand break repair via sister chromatid
    exchange. Located in condensed nuclear chromosome and mitochondrion. Part of mitotic
    cohesin complex. Used to study Cornelia de Lange syndrome and Roberts syndrome.
    Human ortholog(s) of this gene implicated in Barrett's esophagus; Cornelia de
    Lange syndrome 4; endometrial cancer; hepatocellular carcinoma; and lung non-small
    cell carcinoma. Orthologous to several human genes including RAD21L1 (RAD21 cohesin
    complex component like 1).
