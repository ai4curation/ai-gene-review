descriptions:
- source: UniProt
  text: Cleavable component of the cohesin complex involved in chromosome cohesion
    during cell cycle. The cohesin complex is required for the cohesion of sister
    chromatids after DNA replication. The cohesin complex apparently forms a large
    proteinaceous ring within which sister chromatids can be trapped. At metaphase-anaphase
    transition, this protein is cleaved by ESP1 and dissociates from chromatin, allowing
    sister chromatids to segregate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12158
  source_id: Q12158
- source: Alliance_Imported
  text: Essential alpha-kleisin subunit of the cohesin complex; required for sister
    chromatid cohesion in mitosis; subject to proteolytic cleavage by separase Esp1p,
    resulting in dissociation of cohesin from chromatin and the separation of sister
    chromatids at the mitotic metaphase-to-anaphase transition; apoptosis induces
    cleavage and translocation of a C-terminal fragment to mitochondria; expression
    peaks in S phase
  source_type: curated
  url: https://www.yeastgenome.org/locus/MCD1
  source_id: SGD:S000002161
- source: Alliance_Automated
  text: Enables chromatin binding activity and protein kinase binding activity. Involved
    in several processes, including G2/M transition of mitotic cell cycle; chromosome
    organization; and replication-born double-strand break repair via sister chromatid
    exchange. Located in condensed nuclear chromosome and mitochondrion. Part of mitotic
    cohesin complex. Used to study Cornelia de Lange syndrome and Roberts syndrome.
    Human ortholog(s) of this gene implicated in Barrett's esophagus; Cornelia de
    Lange syndrome 4; endometrial cancer; hepatocellular carcinoma; and lung non-small
    cell carcinoma. Orthologous to several human genes including RAD21L1 (RAD21 cohesin
    complex component like 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MCD1
  source_id: SGD:S000002161
