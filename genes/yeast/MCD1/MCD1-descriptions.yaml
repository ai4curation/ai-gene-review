descriptions:
- source: UniProt
  text: Cleavable component of the cohesin complex involved in chromosome cohesion
    during cell cycle. The cohesin complex is required for the cohesion of sister
    chromatids after DNA replication. The cohesin complex apparently forms a large
    proteinaceous ring within which sister chromatids can be trapped. At metaphase-anaphase
    transition, this protein is cleaved by ESP1 and dissociates from chromatin, allowing
    sister chromatids to segregate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12158
  source_id: Q12158
