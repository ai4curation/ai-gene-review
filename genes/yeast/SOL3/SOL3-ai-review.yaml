taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Sol3 (YHR163W) is a 6-phosphogluconolactonase (EC 3.1.1.31) of Saccharomyces cerevisiae. It hydrolyses 6-phospho-D-glucono-1,5-lactone
  to 6-phospho-D-gluconate, the second step of the oxidative pentose phosphate pathway, between glucose-6-phosphate dehydrogenase
  (Zwf1) and 6-phosphogluconate dehydrogenase (Gnd1/Gnd2). It belongs to the four-member Sol family (NagB/RpiA-like fold).
  Only Sol3 and its closest paralog Sol4 have detectable lactonase activity and act redundantly; Sol1 and Sol2 lack activity
  and instead affect tRNA nuclear export. Sol3 is predominantly cytosolic, with some nuclear GFP signal in genome-wide screens.
