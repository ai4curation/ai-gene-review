descriptions:
- source: UniProt
  text: Performs an essential role in the oxidative function of the citric acid cycle.
    Also binds RNA; specifically to the 5'-untranslated leaders of mitochondrial mRNAs.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P28834
  source_id: P28834
- source: Alliance_Imported
  text: Subunit of mitochondrial NAD(+)-dependent isocitrate dehydrogenase; complex
    catalyzes the oxidation of isocitrate to alpha-ketoglutarate in the TCA cycle
  source_type: curated
  url: https://www.yeastgenome.org/locus/IDH1
  source_id: SGD:S000004982
- source: Alliance_Automated
  text: Contributes to isocitrate dehydrogenase (NAD+) activity. Involved in isocitrate
    metabolic process and tricarboxylic acid cycle. Located in mitochondrial nucleoid.
    Part of isocitrate dehydrogenase complex (NAD+). Used to study early infantile
    epileptic encephalopathy. Human ortholog(s) of this gene implicated in retinitis
    pigmentosa 46 and retinitis pigmentosa 99. Orthologous to several human genes
    including IDH3B (isocitrate dehydrogenase (NAD(+)) 3 non-catalytic subunit beta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IDH1
  source_id: SGD:S000004982
