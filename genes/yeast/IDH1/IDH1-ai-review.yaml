    supporting_text: IDH2 was previously shown to contain the catalytic site, whereas IDH1 contributes regulatory
      properties including cooperativity with respect to isocitrate and allosteric activation by AMP
  - reference_id: PMID:11714283
    supporting_text: Overall, results are consistent with isocitrate binding by IDH2 for catalysis and with isocitrate
      binding by IDH1 being a prerequisite for allosteric activation by AMP
  - reference_id: PMID:16884682
    supporting_text: Yeast NAD+-specific isocitrate dehydrogenase (IDH) is an octamer of four IDH1 and four IDH2
      subunits, and the basic structural unit of the enzyme is an IDH1/IDH2 heterodimer
