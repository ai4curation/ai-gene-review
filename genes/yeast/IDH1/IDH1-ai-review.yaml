gene_symbol: IDH1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Regulatory subunit (Idh1p, YNL037C) of the mitochondrial NAD+-dependent isocitrate dehydrogenase (NAD-IDH,
  EC 1.1.1.41), a hetero-octamer of four Idh1 and four Idh2 subunits organised as Idh1/Idh2 heterodimers. The enzyme
  oxidatively decarboxylates isocitrate to 2-oxoglutarate with NAD+ in the mitochondrial matrix and is a rate-limiting
  step of the TCA cycle. Idh2 carries the catalytic site, whereas the homologous Idh1 site binds isocitrate and
  AMP and confers cooperativity and allosteric activation by AMP; Idh1 residues also contribute to the Idh2 active
  site. Loss of either subunit abolishes NAD-IDH activity, impairs growth on acetate and glycerol and increases
  petite formation. Idh1 has also been reported to bind the 5'-untranslated leaders of mitochondrial mRNAs.
