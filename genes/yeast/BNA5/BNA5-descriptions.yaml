descriptions:
- source: UniProt
  text: Catalyzes the cleavage of L-kynurenine (L-Kyn) and L-3- hydroxykynurenine
    (L-3OHKyn) into anthranilic acid (AA) and 3- hydroxyanthranilic acid (3-OHAA),
    respectively.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05979
  source_id: Q05979
- source: Alliance_Imported
  text: Kynureninase; required for the de novo biosynthesis of NAD from tryptophan
    via kynurenine; expression regulated by Hst1p
  source_type: curated
  url: https://www.yeastgenome.org/locus/BNA5
  source_id: SGD:S000004221
- source: Alliance_Automated
  text: Enables kynureninase activity. Involved in 'de novo' NAD+ biosynthetic process
    from L-tryptophan. Located in cytoplasm and nucleus. Is active in cytoophidium.
    Human ortholog(s) of this gene implicated in hydroxykynureninuria. Orthologous
    to human KYNU (kynureninase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BNA5
