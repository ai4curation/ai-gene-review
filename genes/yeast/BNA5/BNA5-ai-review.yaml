- term:
    id: GO:0034354
    label: obsolete 'de novo' NAD+ biosynthetic process from L-tryptophan
  evidence_type: IGI
  original_reference_id: PMID:12062417
  qualifier: involved_in
  supporting_entities:
  - SGD:S000005735
  review:
    summary: Panozzo et al. showed BNA5 (and other kynurenine-pathway genes) are co-lethal with npt1 (with/from
      NPT1, SGD:S000005735), demonstrating that Bna5 is needed for de novo NAD+ synthesis from tryptophan.
      The GO term is now obsolete.
    action: MODIFY
    reason: GO:0034354 was obsoleted; its replaced_by GO:0034628 is defined as de novo synthesis beginning
      from L-aspartate (the bacterial/plant route), which does not describe the yeast kynurenine route.
      Re-map to NAD+ biosynthetic process (Bna5 also carries GO:0006569 and GO:0019805 for the pathway
      specifics).
