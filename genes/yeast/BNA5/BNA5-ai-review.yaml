id: Q05979
gene_symbol: BNA5
aliases:
- YLR231C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: BNA5 encodes kynureninase, a pyridoxal 5'-phosphate-dependent hydrolase of the kynurenine
  pathway that cleaves 3-hydroxy-L-kynurenine to 3-hydroxyanthranilate and L-alanine (and L-kynurenine
  to anthranilate and L-alanine). This step lies between kynurenine 3-monooxygenase (Bna4) and 3-hydroxyanthranilate
  3,4-dioxygenase (Bna1) on the route from tryptophan to quinolinate and hence to de novo NAD+ synthesis;
  together with the Npt1-dependent nicotinic acid route it provides the only source of the pyridine moiety
  of NAD+ in yeast. Bna5 is a soluble cytoplasmic (and partly nuclear) enzyme that can assemble into cytoophidium
  filaments in quiescent cells.
