id: P18409
gene_symbol: MDM10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Mdm10 (mitochondrial distribution and morphology 10; YAL010C) is a beta-barrel integral
  protein of the mitochondrial outer membrane with two distinct roles. As a subunit of the ER-mitochondria
  encounter structure (ERMES), it is the outer-membrane anchor on which the SMP-domain subunits Mdm34
  and Mdm12 assemble with the ER-anchored Mmm1 to form bridges that tether the ER to mitochondria and
  transfer phospholipids between them; Mdm10 itself has no lipid-binding SMP domain. Independently, Mdm10
  associates with the SAM (sorting and assembly machinery; TOB) core complex to form SAM-Mdm10, which
  acts in the late steps of TOM complex biogenesis: it promotes release of newly folded Tom40 from SAM,
  its association with Tom22 and the small Tom proteins, and membrane integration of the alpha-helical
  Tom22 precursor. Mdm10 is distributed throughout the outer membrane rather than being confined to ERMES
  foci. Loss of Mdm10 produces giant spherical mitochondria, defective mitochondrial inheritance and motility,
  mtDNA instability, reduced cardiolipin and increased peroxisome number, phenotypes that combine the
  consequences of losing ER-mitochondria tethering with defective TOM assembly.'
