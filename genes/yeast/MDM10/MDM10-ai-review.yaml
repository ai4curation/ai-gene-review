suggested_questions:
- question: What molecular activity does Mdm10 contribute to SAM-Mdm10? It regulates the timing of Tom40
    release and promotes Tom22 integration, but no GO molecular function term captures this; is it best
    treated as a protein-folding/insertase cofactor or as a structural adaptor?
  experts:
  - Pfanner/Wiedemann lab
  - Endo lab
- question: How is the Mdm10 pool partitioned between ERMES and SAM, and is the partition regulated (e.g.
    by Tom7 or Gem1) to coordinate lipid supply with outer membrane protein biogenesis?
  experts:
  - Endo lab
  - Kornmann lab
- question: Should the SGD ND molecular_function row be retired now that tether activity (IDA) is annotated?
  experts:
  - SGD curators
- question: ERMES is inferred to have been present in the last opisthokont common ancestor and lost in
    the human lineage (Chen et al. 2026, PMID:42822426), with VPS13-family bridge proteins and other contact-site
    machinery likely covering ER-mitochondria lipid supply in animals. Which human proteins, if any, should
    receive the ERMES-equivalent function annotations, and should ERMES complex membership be explicitly
    excluded for human genes in phylogenetic propagation?
  experts:
  - PAINT curators
  - Kornmann lab
suggested_experiments:
- hypothesis: Distinct Mdm10 surfaces mediate ERMES binding and SAM binding.
  description: Use separation-of-function Mdm10 mutants (guided by the in situ ERMES model and SAM-Mdm10
    structures) to test whether ChiMERA rescue and Tom40 assembly can be uncoupled.
  experiment_type: genetic
