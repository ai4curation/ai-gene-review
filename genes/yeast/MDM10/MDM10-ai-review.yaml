- term:
    id: GO:0007031
    label: peroxisome organization
  evidence_type: IMP
  original_reference_id: PMID:30908556
  qualifier: involved_in
  review:
    summary: 'Peroxisome organization (IMP): mdm10 deletion increases the number of mature peroxisomes.'
    action: KEEP_AS_NON_CORE
    reason: The phenotype is reproducible and was dissociated from respiratory defects, mtDNA loss and
      mitochondrial network changes, and its mechanism differs from that in mdm12 cells. No mechanism
      has been identified in which Mdm10 performs a step of peroxisome biogenesis or division, so this
      is retained as a genuine but non-core phenotype-level annotation.
    supported_by:
    - reference_id: PMID:30908556
      supporting_text: First, we confirmed previous studies from other groups showing that absence of
        Mdm10 or Mdm12 leads to an increased number of mature peroxisomes.
    - reference_id: PMID:30908556
      supporting_text: Finally, we present evidence that the contribution of ERMES subunits Mdm10 and
        Mdm12 to peroxisome number involves two different mechanisms.
- term:
    id: GO:0015914
    label: phospholipid transport
  evidence_type: IGI
  original_reference_id: PMID:19556461
  qualifier: involved_in
  supporting_entities:
  - SGD:S000002301
  review:
    summary: Phospholipid transport (IGI) from the ERMES discovery paper.
    action: ACCEPT
    reason: 'Mdm10 lacks an SMP domain and does not itself bind lipids, but it is the outer-membrane anchor
      of the ERMES bridge: mdm10 mutants show slowed PS-to-PC conversion, and native ER-anchored Mmm1
      can serve as the sole lipid transporter (with an artificial tether) only when Mdm10 is present,
      i.e. Mdm10 is the mitochondrial partner the transfer machinery depends on. (Mdm10 becomes dispensable
      only when Mmm1 is itself artificially anchored in the outer membrane.) Mdm10 therefore contributes
      structure on which the transfer depends (scaffold, in the sense of the participation test), which
      justifies involved_in. Not used as a core molecular function for Mdm10.'
    supported_by:
    - reference_id: PMID:19556461
      supporting_text: Mutants of ERMES showed a two- to fivefold reduction in PS-to-PC conversion rate
    - reference_id: PMID:42095818
      supporting_text: our results suggest that Mmm1 can act as the sole lipid transporter at the ER-mitochondrial
        contact sites, provided that Mdm10 is present, even in the absence of the other two subunits
- term:
    id: GO:0032865
    label: ERMES complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN001997910
  - SGD:S000000008
  review:
    summary: MDM10 is a core subunit of the ER-mitochondria encounter structure (ERMES); IBA evidence.
    action: ACCEPT
    reason: 'ERMES membership of MDM10 is among the best-established facts about this protein: the four
      core subunits (Mmm1, Mdm10, Mdm12, Mdm34) co-purify, co-immunoprecipitate, co-localize in a few
      discrete foci at ER-mitochondria contacts and are mutually required for focus formation. Gem1 is
      a fifth, regulatory subunit. This is the central cellular component for the gene and is used as
      in_complex in core_functions.'
    supported_by:
    - reference_id: PMID:19556461
      supporting_text: We identified the Mmm1/Mdm10/Mdm12/Mdm34 complex as a molecular tether between
        ER and mitochondria.
