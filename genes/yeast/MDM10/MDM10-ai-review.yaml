- term:
    id: GO:0007005
    label: mitochondrion organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR027539
  review:
    summary: Mitochondrion organization (IEA, InterPro) based on the classic mdm/mmm abnormal mitochondrial
      morphology phenotype of MDM10 mutants.
    action: KEEP_AS_NON_CORE
    reason: 'Loss of any ERMES subunit converts the tubular mitochondrial network into a few giant spherical
      mitochondria, which is how these genes were discovered. The phenotype is real, but it is largely
      a downstream consequence of losing ER-mitochondria tethering and lipid supply: an artificial tether
      restores morphology of mdm12 and mdm34 mutants, and dominant VPS13 alleles suppress ERMES-deficiency
      phenotypes. The term is broad and correct at the level of necessity, but it is not the core activity,
      so it is kept as non-core rather than removed.'
    supported_by:
    - reference_id: PMID:19556461
      supporting_text: mdm12Δ, mmm1Δ, mdm10Δ, and mdm34Δ strains displayed enlarged and spherical mitochondria
        as compared with the tubular WT mitochondria
    - reference_id: PMID:26370498
      supporting_text: The fact that it suppresses ERMES mtDNA defects indicates that these are secondary
        to the loss of a primary ERMES function.
