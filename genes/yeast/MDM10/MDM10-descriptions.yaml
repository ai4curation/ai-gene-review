  text: Enables mitochondrion-endoplasmic reticulum membrane tether activity. Involved
    in several processes, including establishment of mitochondrion localization; outer
    mitochondrial membrane organization; and peroxisome organization. Located in mitochondrial
    outer membrane. Part of SAM complex. Is active in ERMES complex.
