gene_symbol: MDM10
organism: yeast
uniprot_id: P18409
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Component of the ERMES/MDM complex, which serves as a molecular tether to
    connect the endoplasmic reticulum and mitochondria. Components of this complex
    are involved in the control of mitochondrial shape and protein biogenesis and
    may function in phospholipid exchange. MDM10 is involved in the late assembly
    steps of the general translocase of the mitochondrial outer membrane (TOM complex).
    Functions in the TOM40-specific route of the assembly of outer membrane beta-barrel
    proteins, including the association of TOM40 with the receptor TOM22 and small
    TOM proteins. Can associate with the SAM(core) complex as well as the MDM12-MMM1
    complex, both involved in late steps of the major beta-barrel assembly pathway,
    that is responsible for biogenesis of all outer membrane beta-barrel proteins.
    May act as a switch that shuttles between both complexes and channels precursor
    proteins into the TOM40-specific pathway. Plays a role in mitochondrial morphology
    and in the inheritance of mitochondria.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P18409
  source_id: P18409
- source: Alliance_Imported
  text: Moonlighting protein component of both the ERMES and SAM complex; subunit
    of the ERMES complex that acts as a molecular tether between the mitochondria
    and the ER, necessary for both efficient phospholipid exchange between organelles
    and for mitophagy; SAM/TOB complex subunit that functions in the assembly of outer
    membrane beta-barrel proteins; involved in mitochondrial inheritance and morphology;
    ERMES complex often co-localizes with peroxisomes adjacent to mitochondria-ER
    junctions
  source_type: curated
  url: https://www.yeastgenome.org/locus/MDM10
  source_id: SGD:S000000008
- source: Alliance_Automated
  text: Enables mitochondrion-endoplasmic reticulum membrane tether activity. Involved
    in several processes, including establishment of mitochondrion localization; outer
    mitochondrial membrane organization; and peroxisome organization. Located in mitochondrial
    outer membrane. Part of SAM complex. Is active in ERMES complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MDM10
  source_id: SGD:S000000008
