- source: Alliance_Imported
  text: Moonlighting protein component of both the ERMES and SAM complex; subunit
    of the ERMES complex that acts as a molecular tether between the mitochondria
    and the ER, necessary for both efficient phospholipid exchange between organelles
    and for mitophagy; SAM/TOB complex subunit that functions in the assembly of outer
    membrane beta-barrel proteins; involved in mitochondrial inheritance and morphology;
    ERMES complex often co-localizes with peroxisomes adjacent to mitochondria-ER
    junctions
