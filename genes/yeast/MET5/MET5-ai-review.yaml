    summary: UniPathway mapping (UPA00140, H2S from sulfite, NADPH route). Sulfite reductase directly
      produces H2S, and MET5 mutants strongly reduce H2S formation (PMID:19236486). Correct.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:19236486
      supporting_text: H(2)S is a necessary intermediate in the assimilation of sulfur by yeast through
        the sulfate reduction sequence with the key enzyme being sulfite reductase
    - reference_id: PMID:19236486
      supporting_text: Specific mutations in the MET10 and MET5 genes, which encode the catalytic alpha-
        and beta-subunits of the sulfite reductase enzyme, respectively, were identified in six of the
        isolated strains.
    reason: This protein performs a catalytic or electron-transfer component step in the sulfate-to-sulfide
      biosynthetic route. The hydrogen-sulfide biosynthesis term covers that multistep pathway; it does
      not assert that an upstream enzyme directly releases sulfide. Retain the pathway claim on the established
      chemistry.
