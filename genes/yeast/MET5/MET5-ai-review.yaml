- term:
    id: GO:0004783
    label: sulfite reductase (NADPH) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN001285008
  - SGD:S000003898
  review:
    summary: The siroheme/iron-sulfur catalytic beta subunit contributes to the assembled NADPH-dependent
      sulfite reductase. The supported activity belongs to the alpha/beta enzyme, without claiming autonomous
      whole-reaction turnover by this isolated subunit.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:6751400
      supporting_text: The enzyme consists of two types of subunit, alpha and beta, having molecular weights
        of 116,000 and 167,000, respectively.
    reason: The NADPH-dependent six-electron sulfite-reduction reaction belongs to the assembled alpha/beta
      enzyme. This subunit contributes the electron-input module (Met10) or sulfite-reducing hemoprotein
      module (Met5/Sir1), as appropriate. The review retains the original assertion and its machine fields;
      the synthesized core explicitly uses contributes_to_molecular_function and does not claim autonomous
      turnover by an isolated subunit.
