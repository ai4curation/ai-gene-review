id: P47169
gene_symbol: MET5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Met5 (Ecm17) is the beta (hemoprotein) subunit of the assimilatory NADPH-sulfite reductase
  of Saccharomyces cerevisiae (EC 1.8.1.2). Two Met5 and two Met10 subunits form a cytoplasmic alpha2beta2
  hemoflavoprotein that reduces sulfite to hydrogen sulfide with six electrons from NADPH, the final reductive
  step of sulfate assimilation; the sulfide is then incorporated into homocysteine and from there into
  methionine, cysteine and glutathione. Met5 holds the catalytic siroheme-[4Fe-4S] centre (C-terminal
  nitrite/sulfite reductase ferredoxin-like and 4Fe-4S domains), which needs siroheme made by Met1 and
  Met8. It also has a flavodoxin-like FMN-binding domain, which in bacterial sulfite reductases sits on
  the flavoprotein subunit. met5 mutants lack sulfite reductase activity, require organic sulfur, and
  in wine yeast give much lower H2S release during fermentation. Assignment of FMN to the beta subunit
  is supported by flavodoxin-domain architecture and holoenzyme cofactor content, rather than a direct
  isolated-subunit FMN assay.
