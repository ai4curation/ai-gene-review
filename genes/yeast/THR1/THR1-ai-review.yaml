suggested_questions:
- question: Is homoserine toxicity in thr1 mutants caused by misincorporation of homoserine in place of
    threonine during translation (it is suppressed by cycloheximide and depends on proteasome function)?
suggested_experiments:
- description: Use mass spectrometry to detect homoserine misincorporation into the proteome of thr1 mutants
    under threonine starvation, testing the toxic-threonine-analog model.
