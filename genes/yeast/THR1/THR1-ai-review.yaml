gene_symbol: THR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: THR1 (YHR025W) encodes homoserine kinase (EC 2.7.1.39), a ~40 kDa GHMP-family kinase that
  forms a homodimer. It catalyses the ATP-dependent O-phosphorylation of L-homoserine to O-phospho-L-homoserine,
  committing homoserine (the branch point shared with methionine synthesis) to the threonine branch of
  the aspartate-family pathway (step 4 of 5). THR1 is under GCN4 general amino acid control. thr1 deletion
  mutants are threonine auxotrophs. They also accumulate the toxic intermediate homoserine, which causes
  pleiotropic sensitivities (temperature, pH, salts, 5-fluorocytosine), rapid death during threonine starvation
  or in serum, and attenuated survival in mouse infection models. These phenotypes are suppressed by blocking
  homoserine production (hom3, hom6).
