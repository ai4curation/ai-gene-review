id: P38115
gene_symbol: ARA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ARA1 (YBR149W) encodes an NADP+-preferring D-arabinose 1-dehydrogenase [NAD(P)+] (EC 1.1.1.117)
  of the aldo-keto reductase superfamily (AKR3C). The cytosolic enzyme oxidises D-arabinose, L-xylose,
  L-fucose and L-galactose to the corresponding 1,4-lactones, but with very high Km values (about 160
  mM for D-arabinose), and together with D-arabinono-1,4-lactone oxidase (ALO1) it can form D-erythroascorbate
  in vitro. In vivo it makes a limited contribution to erythroascorbate synthesis, the NAD+-specific isozyme
  Ara2 being the main source. Ara1 is a homodimer; the smaller polypeptide once taken for a second subunit
  is an N-terminal degradation product. Like other AKRs it also acts as a broad NADPH-dependent carbonyl
  reductase, for example reducing (R)-acetoin to meso-2,3-butanediol.
