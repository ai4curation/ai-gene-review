core_functions:
- description: Cytosolic, NADP+-preferring, low-affinity D-arabinose 1-dehydrogenase that makes D-arabinono-1,4-lactone
    for erythroascorbate synthesis, as a minor isozyme alongside Ara2.
  molecular_function:
