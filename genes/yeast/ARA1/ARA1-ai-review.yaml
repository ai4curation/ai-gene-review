    supporting_text: D-Erythroascorbic acid was formed in vitro from D-arabinose by D-arabinose dehydrogenase
      and D-arabinono-1,4-lactone oxidase
  - reference_id: PMID:17151466
    supporting_text: A deficient mutant of ARA1 lost almost all NADP(+)-ARA activity, but intracellular
      D-erythroascorbic acid was only halved
suggested_questions:
- question: Given its ~160 mM Km for D-arabinose, is Ara1's physiological role sugar oxidation or NADPH-dependent
    reduction of other carbonyl substrates?
suggested_experiments:
- description: Profile Ara1 kinetics on aldoses (reductive direction), dicarbonyls and other carbonyl
    substrates with NADPH, and compare metabolite profiles of ara1 and ara1 ara2 strains.
