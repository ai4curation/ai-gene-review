  review:
    summary: PAINT IBA from a large aldo-keto reductase node (PTN000198921) seeded by mammalian aldose
      reductases (AKR1B), yeast Gre3/Ypr1-type AKRs and others. Aldose reductase means NADPH-dependent
      reduction of an aldose to the alditol. Ara1 is an AKR and acts as an NADPH-dependent carbonyl reductase
      on acetoin (PMID:33845171), but no aldose-to-alditol reduction has been reported for Ara1; its characterised
      sugar reaction is the opposite chemistry (C-1 oxidation of aldoses to lactones with NADP+).
    action: UNDECIDED
    reason: Plausible for a promiscuous AKR but untested; neither supported nor contradicted by Ara1-specific
      data.
