description: Anthranilate phosphoribosyltransferase (TrpD, EC 2.4.2.18) of Saccharomyces cerevisiae. A Mg2+-dependent
  homodimeric glycosyltransferase family 3 enzyme that transfers the 5-phosphoribosyl group of PRPP to anthranilate
  to give N-(5-phosphoribosyl)anthranilate, step 2 of L-tryptophan biosynthesis. Crystal structures of the yeast
  enzyme are available. It is a soluble cytoplasmic protein; trp4 mutants are tryptophan auxotrophs.
