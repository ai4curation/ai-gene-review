- source: UniProt
  text: Catalyzes the transfer of the phosphoribosyl group of 5- phosphorylribose-1-pyrophosphate
    (PRPP) to anthranilate to yield N-(5'- phosphoribosyl)-anthranilate (PRA), the
    second step in tryptophan biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07285
  source_id: P07285
- source: Alliance_Imported
  text: Anthranilate phosphoribosyl transferase; transferase of the tryptophan biosynthetic
    pathway; catalyzes the phosphoribosylation of anthranilate; subject to the general
    control system of amino acid biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/TRP4
  source_id: SGD:S000002762
- source: Alliance_Automated
  text: Enables anthranilate phosphoribosyltransferase activity. Involved in L-tryptophan
