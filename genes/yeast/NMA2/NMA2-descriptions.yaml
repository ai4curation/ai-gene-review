descriptions:
- source: UniProt
  text: Catalyzes the formation of NAD(+) from nicotinamide mononucleotide (NMN) and
    ATP (PubMed:12597897). Can also use the deamidated form; nicotinic acid mononucleotide
    (NaMN) as substrate to form deamido-NAD(+) (NaAD). Key enzyme in both de novo
    and salvage pathways for NAD(+) biosynthesis (By similarity). Predominantly acts
    in the salvage pathways via NMN (PubMed:11884393).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53204
