gene_symbol: NMA2
organism: yeast
uniprot_id: P53204
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the formation of NAD(+) from nicotinamide mononucleotide (NMN) and
    ATP (PubMed:12597897). Can also use the deamidated form; nicotinic acid mononucleotide
    (NaMN) as substrate to form deamido-NAD(+) (NaAD). Key enzyme in both de novo
    and salvage pathways for NAD(+) biosynthesis (By similarity). Predominantly acts
    in the salvage pathways via NMN (PubMed:11884393).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53204
  source_id: P53204
- source: Alliance_Imported
  text: Nicotinic acid mononucleotide adenylyltransferase; catalyzes the transfer
    of the adenylyl moiety of ATP to nicotinamide mononucleotide to form NAD; involved
    in de novo and salvage synthesis of NAD(+); homolog of human NMNAT; NMA2 has a
    paralog, NMA1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/NMA2
  source_id: SGD:S000003242
- source: Alliance_Automated
  text: Enables nicotinamide-nucleotide adenylyltransferase activity. Involved in
    NAD+ biosynthetic process. Located in nucleus. Human ortholog(s) of this gene
    implicated in Leber congenital amaurosis 9 and spondyloepiphyseal dysplasia, sensorineural
    hearing loss, intellectual developmental disorder, and Leber congenital amaurosis.
    Orthologous to several human genes including NMNAT1 (nicotinamide nucleotide adenylyltransferase
    1) and NMNAT3 (nicotinamide nucleotide adenylyltransferase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NMA2
  source_id: SGD:S000003242
