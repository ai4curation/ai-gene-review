id: P53204
gene_symbol: NMA2
aliases:
- YGR010W
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NMA2 encodes the second nicotinamide/nicotinic acid mononucleotide adenylyltransferase (NMNAT)
  of yeast, a whole-genome-duplication paralog of Nma1. It transfers the AMP moiety of ATP to nicotinamide
  mononucleotide to form NAD+ and, like other eukaryotic NMNATs, can adenylylate nicotinate mononucleotide
  to deamido-NAD+. Recombinant Nma2 differs kinetically from Nma1 (higher Km for ATP, Co2+ preference).
  Nma2 is concentrated in the nucleus, where it is thought to regenerate NAD+ for Sir2, and extra NMA2
  copies enhance telomeric and rDNA silencing. Nma2 interacts with Nma1.
