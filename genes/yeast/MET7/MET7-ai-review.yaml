core_functions:
- description: ATP-dependent addition of glutamate residues to tetrahydrofolyl-(Glu)n coenzymes (EC 6.3.2.17),
    producing the polyglutamylated folates used by one-carbon enzymes including Met6 methionine synthase;
    active in cytosol and mitochondria.
