id: Q08645
gene_symbol: MET7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: MET7 (MET23, YOR241W) encodes folylpolyglutamate synthetase (FPGS, EC 6.3.2.17), the ATP-dependent
  Mur-ligase-family enzyme that adds successive gamma-linked glutamate residues to tetrahydrofolate coenzymes.
  Polyglutamylation retains folates in the cell and organelles and makes them preferred substrates of
  folate-dependent one-carbon enzymes. A separate enzyme, FOL3, adds the first glutamate (dihydrofolate
  synthetase). MET7-dependent FPGS activity is found in both the cytoplasm and mitochondria. Cytosolic
  FPGS is required for methionine synthesis, because cobalamin-independent methionine synthase (Met6)
  uses polyglutamylated 5-methyl-tetrahydrofolate, so met7 mutants are methionine auxotrophs. met7 mutants
  also lose mitochondrial DNA (petite) because they are deficient in dTMP synthesis, and they show synthetic
  phenotypes with mutations in glycine/serine one-carbon interconversion (gly1, ser1, shm2).
