  review:
    summary: YeastPathways 'methionine biosynthesis' (PWY3O-238) groups MET7 with MET6 because cobalamin-independent
      methionine synthase uses polyglutamylated 5-methyl-THF as methyl donor. met7 mutants are methionine
      auxotrophs and cytoplasmic FPGS alone rescues this. Met7p supplies the co-substrate rather than
      catalysing a methionine-forming step, so the link is real but indirect.
