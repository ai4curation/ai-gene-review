suggested_questions:
- question: Is the mitochondrial FPGS pool encoded by MET7 physiologically important? DeSouza et al. (2000)
    and Cherest et al. (2000) disagree on whether the met7 petite phenotype reflects loss of mitochondrial
    FPGS or cytosolic dTMP deficiency.
- question: Should folate polyglutamylation enzymes carry L-methionine biosynthetic process (via the Met6
    polyglutamyl-methyl-THF requirement), or should that link be expressed through has_input on MET6?
suggested_experiments:
- description: Use a C-terminally tagged MET7 at the endogenous locus, or immunogold labelling, to test
    the ER localization reported from the N-terminal SWAT-GFP screen and to resolve the mitochondrial
    sub-compartment (matrix vs inner membrane).
