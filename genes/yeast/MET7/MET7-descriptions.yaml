taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Catalyzes conversion of folates to polyglutamate derivatives allowing concentration
    of folate compounds in the cell and the intracellular retention of these cofactors,
    which are important substrates for most of the folate-dependent enzymes that are
    involved in one-carbon transfer reactions involved in purine, pyrimidine and amino
    acid synthesis. Required for methionine synthesis and maintenance of intact mitochondrial
    DNA. Involved in telomere maintenance.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08645
  source_id: Q08645
