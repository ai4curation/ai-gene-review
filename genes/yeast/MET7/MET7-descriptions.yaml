gene_symbol: MET7
organism: yeast
uniprot_id: Q08645
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes conversion of folates to polyglutamate derivatives allowing concentration
    of folate compounds in the cell and the intracellular retention of these cofactors,
    which are important substrates for most of the folate-dependent enzymes that are
    involved in one-carbon transfer reactions involved in purine, pyrimidine and amino
    acid synthesis. Required for methionine synthesis and maintenance of intact mitochondrial
    DNA. Involved in telomere maintenance.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08645
  source_id: Q08645
- source: Alliance_Imported
  text: Folylpolyglutamate synthetase; catalyzes extension of the glutamate chains
    of the folate coenzymes, required for methionine synthesis and for maintenance
    of mitochondrial DNA; protein abundance increases in response to DNA replication
    stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/MET7
  source_id: SGD:S000005767
- source: Alliance_Automated
  text: Enables tetrahydrofolylpolyglutamate synthase activity. Involved in one-carbon
    metabolic process. Located in mitochondrion. Orthologous to human FPGS (folylpolyglutamate
    synthase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/MET7
  source_id: SGD:S000005767
