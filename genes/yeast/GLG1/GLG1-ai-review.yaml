gene_symbol: GLG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GLG1 (YKR058W) encodes glycogenin-1, one of two partially redundant self-glucosylating initiator
  proteins (with GLG2) for glycogen synthesis in Saccharomyces cerevisiae. A GT8-family glucosyltransferase
  (EC 2.4.1.186), it uses UDP-glucose to attach glucose to its own tyrosine residues (Tyr232 and Tyr600
  are implicated in vivo) and extends the attached chain by alpha-1,4 linkages, producing the protein-bound
  oligosaccharide primer that glycogen synthase (Gsy1/Gsy2) elongates. Either GLG1 or GLG2 alone supports
  near-normal glycogen accumulation, but the glg1 glg2 double mutant makes no glycogen despite normal
  glycogen synthase levels. Glg1 is cytosolic and associates with glycogen synthase; it is induced at
  the diauxic transition.
