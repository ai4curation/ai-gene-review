    overall_notes: 'Correct and specific: self-glucosylating initiator forming a tyrosine-linked
      alpha-1,4 primer for glycogen synthase; can glucosylate free acceptors. Does
      not mention redundancy with GLG2.'
- source: Alliance_Imported
  text: Glycogenin glucosyltransferase; self-glucosylating initiator of glycogen synthesis,
    also glucosylates n-dodecyl-beta-D-maltoside; SWAT-GFP and mCherry fusion proteins
    localize to the cell periphery and vacuole respectively; similar to mammalian
    glycogenin; GLG1 has a paralog, GLG2, that arose from the whole genome duplication
  source_type: curated
