gene_symbol: GLG1
organism: yeast
uniprot_id: P36143
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Self-glucosylating initiator of glycogen synthesis. It catalyzes the formation
    of a short alpha (1,4)-glucosyl chain covalently attached via a glucose 1-O-tyrosyl
    linkage to internal tyrosine residues and these chains act as primers for the
    elongation reaction catalyzed by glycogen synthase. Capable of transferring glucosyl
    residues to unbound acceptors such as free oligoglucans or oligoglucan derivatives.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36143
  source_id: P36143
- source: Alliance_Imported
  text: Glycogenin glucosyltransferase; self-glucosylating initiator of glycogen synthesis,
    also glucosylates n-dodecyl-beta-D-maltoside; SWAT-GFP and mCherry fusion proteins
    localize to the cell periphery and vacuole respectively; similar to mammalian
    glycogenin; GLG1 has a paralog, GLG2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLG1
  source_id: SGD:S000001766
- source: Alliance_Automated
  text: Enables glycogenin glucosyltransferase activity. Involved in glycogen biosynthetic
    process. Predicted to be located in vacuole. Predicted to be active in cytoplasm.
    Human ortholog(s) of this gene implicated in glycogen storage disease and glycogen
    storage disease XV. Orthologous to human GYG1 (glycogenin 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLG1
  source_id: SGD:S000001766
