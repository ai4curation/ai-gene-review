id: P21147
gene_symbol: OLE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: OLE1 (YGL055W) encodes the sole delta-9 fatty acyl-CoA desaturase of S. cerevisiae, an essential,
  oxygen-dependent, multi-pass integral membrane enzyme of the endoplasmic reticulum belonging to the
  stearoyl-CoA desaturase (SCD) family. Ole1 introduces a cis double bond between C9 and C10 of palmitoyl-CoA
  and stearoyl-CoA to form palmitoleoyl-CoA and oleoyl-CoA, the source of essentially all unsaturated
  fatty acids in yeast membrane lipids. It uses a His-box diiron catalytic centre and, unlike mammalian
  SCDs, carries a C-terminal cytochrome b5-like domain that supplies electrons, so it does not depend
  on free cytochrome b5. ole1 mutants are unsaturated fatty acid auxotrophs; conditional alleles (originally
  isolated as mdm2) cause secondary defects in mitochondrial inheritance. OLE1 expression is tightly regulated
  by oxygen, temperature and fatty acids through the ER-membrane-anchored transcription factors Spt23
  and Mga2.
