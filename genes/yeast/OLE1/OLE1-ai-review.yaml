    label: mitochondrion inheritance
  evidence_type: IMP
  original_reference_id: PMID:2202739
  qualifier: involved_in
  review:
    summary: 'IMP (McConnell et al. 1990): the mdm2 mutant, later shown to be an OLE1 allele, is temperature-sensitive
      for transfer of mitochondria into buds. The defect is a downstream consequence of loss of unsaturated
      fatty acids: the mutant desaturase relocalises within minutes, before mitochondrial inheritance
      is affected, and Ole1 is an ER desaturase with no role in organelle transport machinery.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect phenotype of a lipid biosynthetic enzyme.
    supported_by:
    - reference_id: PMID:2202739
      supporting_text: We have isolated mutants of Saccharomyces cerevisiae that are temperature-sensitive
        for the transfer of mitochondria into a growing bud
    - reference_id: PMID:12475963
      supporting_text: Temperature-sensitive mutants of the single essential acyl chain desaturase, Ole1p,
        of yeast have previously been isolated in screens for mitochondrial inheritance mutants
    - reference_id: PMID:12475963
      supporting_text: This relocalization takes place within minutes at nonpermissive conditions, a time
        scale at which mitochondrial morphology and inheritance is not yet affected
