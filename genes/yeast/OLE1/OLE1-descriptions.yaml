descriptions:
- source: UniProt
  text: Stearoyl-CoA desaturase that utilizes O(2) and electrons from reduced cytochrome
    b5 to introduce the first double bond into saturated fatty acyl-CoA substrates
    (PubMed:1978720, PubMed:7947684). Catalyzes the insertion of a cis double bond
    at the delta-9 position into fatty acyl-CoA substrates including palmitoyl-CoA
    and stearoyl-CoA (PubMed:1978720, PubMed:2674136). Required for the biosynthesis
    of membrane phospholipids, cholesterol esters and triglycerides (PubMed:16443825,
    PubMed:1978720, PubMed:7947684). Regulates fatty acid desaturation, that is, the
    ratio of unsaturated versus saturated fatty acyl chains, by competing with the
    acyltransferase STC1 for the common substrate C16:0-CoA. SCT1 sequesters C16:0-CoA
    into lipids, thereby shielding it from desaturation by OLE1 (PubMed:22323296).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P21147
  source_id: P21147
- source: Alliance_Imported
  text: Stearoyl-CoA 9-desaturase; required for unsaturated fatty acid biosynthesis
    and for mitochondrial inheritance; catalyzes the formation of a double bond at
    the Δ9 position of palmitic and stearic acids to generate monounsaturated palmitoleic
    and oleic acids; integral membrane protein of the endoplasmic reticulum; homologous
    of human SCD
  source_type: curated
  url: https://www.yeastgenome.org/locus/OLE1
  source_id: SGD:S000003023
- source: Alliance_Automated
  text: Enables electron transfer activity; palmitoyl-CoA 9-desaturase activity; and
    stearoyl-CoA 9-desaturase activity. Involved in mitochondrion inheritance and
    unsaturated fatty acid biosynthetic process. Located in endoplasmic reticulum
    membrane. Human ortholog(s) of this gene implicated in autosomal dominant nonsyndromic
    deafness 79. Orthologous to human SCD (stearoyl-CoA desaturase) and SCD5 (stearoyl-CoA
    desaturase 5).
  source_type: automated
  url: https://www.yeastgenome.org/locus/OLE1
  source_id: SGD:S000003023
