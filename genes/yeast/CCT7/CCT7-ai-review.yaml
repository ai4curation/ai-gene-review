description: CCT7 encodes the eta subunit of the cytosolic chaperonin-containing T-complex/TRiC.
  Cct7 is one of eight distinct CCT subunits in each ring of the hetero-oligomeric
  double-ring chaperonin and contributes ATP binding/hydrolysis and subunit-specific
  surfaces to the complex-level ATP-dependent protein folding chaperone activity.
  The mature TRiC/CCT complex folds actin, tubulin, and other cytosolic clients.
