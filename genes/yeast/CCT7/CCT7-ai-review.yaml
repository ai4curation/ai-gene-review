      organization of the cytosolic chaperonin complex that contains Cct7.
    supporting_text: We have solved the crystal structure of yeast CCT in complex
      with actin
- id: PMID:40070846
  title: The conformational landscape of TRiC ring-opening and its underlying stepwise
    mechanism revealed by cryo-EM.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text is cached; the paper resolves ADP-state yeast TRiC
      ring-opening intermediates and places CCT7 in the CCT3/CCT6/CCT8/CCT7/CCT5
      outward-leaning wave.
  findings:
  - statement: ADP-state yeast TRiC structures place CCT7 in a stepwise ring-opening
      wave after CCT3, CCT6, and CCT8.
    supporting_text: and expands to the outward leaning of the consecutive CCT6/8/7/5
      subunits.
