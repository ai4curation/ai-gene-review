suggested_questions:
- question: Should the two CACAO glycosylation rows for VPS74 (GO:0006487 and GO:0035269,
    both IMP from PMID:18410729) be retained at all, given that the cited paper states
    the role in glycosylation must be indirect and that the mechanistic term GO:0045053
    was annotated by SGD from the same figures?
- question: Is the SGD row GO:0006890, retrograde vesicle-mediated transport from Golgi
    to endoplasmic reticulum (IMP from PMID:18635803), supported by an assay of Golgi-to-ER
    traffic in the full text, or should it be GO:0000301, retrograde transport and
    vesicle recycling within Golgi, which is what the abstract describes?
- question: What determines whether a Golgi glycosyltransferase is a Vps74p client,
    a Bre5p/Ubp3p client, both, or neither? Och1p binds Vps74p in vitro yet its retention
    in vivo is largely Vps74p-independent, and Ktr3p and Mnn11p depend on Vps74p only
    under some nutrient conditions.
- question: Does Vps74p engage Sac1 in cis on Golgi membranes or in trans at ER-Golgi
    contact sites, and is the Vps74p-Sac1 complex the physiological route by which
    medial-Golgi PtdIns4P is turned over?
- question: Which yeast myosin, if any, substitutes for the MYO18A link that GOLPH3
    uses in mammals, and does Vps74p contribute to Golgi membrane tension or shape
    in budding yeast at all?
suggested_experiments:
- hypothesis: The glycosylation defect of vps74-delta cells is wholly attributable
    to loss of mannosyltransferase retention, not to any direct role of Vps74p in glycan
    synthesis.
  description: Tether Kre2p, Mnn2p and Mnn5p in the Golgi independently of Vps74p,
    for example by appending a Vps74p-independent retention determinant or by fusing
    them to a resident multi-TM Golgi protein, in a vps74-delta background, then assay
    invertase and Hsp150p mobility. Full rescue of glycosylation without restoring
    Vps74p would settle the phenotype-versus-process question behind the two CACAO
    rows.
  experiment_type: genetic rescue and glycoprotein mobility assay
- hypothesis: Vps74p acts in intra-Golgi retrograde recycling and not in Golgi-to-ER
    transport.
  description: Compare vps74-delta with ret1 and sec21 COPI mutants in a direct Golgi-to-ER
    retrieval assay, for example HDEL-reporter retrieval or cisternal maturation followed
    by live four-dimensional imaging of Och1p and Mnn9p, scoring intra-Golgi recycling
    and Golgi-to-ER return separately.
  experiment_type: trafficking assay and live-cell imaging
- hypothesis: Nutrient status switches clients between the Vps74p and Bre5p/Ubp3p retention
    pathways by changing client ubiquitination.
  description: Quantify ubiquitination of Ktr3p, Mnn4p and Mnn11p in wild-type, vps74-delta,
    bre5-delta and double mutants grown in rich versus synthetic medium, in parallel
    with mNeon imaging of their Golgi versus vacuolar distribution.
  experiment_type: ubiquitination profiling and quantitative imaging
- hypothesis: Vps74p recruits the Sac1 catalytic domain to medial-Golgi membranes in
    trans from the ER.
  description: Use split-fluorophore or proximity-labelling reporters to localize the
    Vps74-Sac1 complex relative to ER-Golgi contact sites, combined with a Sac1 variant
    anchored exclusively in the ER or exclusively in the Golgi, and measure medial-Golgi
    PtdIns4P with a quantitative reporter in each case.
  experiment_type: proximity labelling and phosphoinositide reporter imaging
