      with this, deleting VPS74 does not disturb the ER glycosyltransferase Alg5p or
      other ER residents. GO:0000301 retrograde transport, vesicle recycling within
      Golgi is the term that matches the mechanism. The cached record is abstract-only,
      so this is a lateral correction of the term rather than a challenge to the curator's
      reading of the experiment.
