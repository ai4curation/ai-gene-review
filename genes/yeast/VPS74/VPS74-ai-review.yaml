  - *id_18410729_retention
  - *id_18410729_mislocal
  - *id_22889169_arg
  - *id_22889169_loss
  - *id_32673164_dual
- description: Phosphatidylinositol-4-phosphate recognition through a conserved basic
    pocket of the GPP34 fold (W88, R97, K178, R181), which both recruits the protein
    from the cytosol onto Pik1-marked Golgi membranes and, in complex with the directly
    bound Sac1 phosphatase catalytic region, directs dephosphorylation of the medial-Golgi
    PtdIns4P pool, keeping that pool low and coupling Golgi enzyme sorting to local
    phosphoinositide and sphingolipid homeostasis.
  molecular_function:
