  review:
    summary: Tu et al. showed that Vps74p binds a pentameric motif in glycosyltransferase
      cytosolic tails and also binds COPI, and proposed that it maintains their steady-state
      Golgi localization by promoting their incorporation into COPI-coated vesicles.
    action: MODIFY
    reason: The essence is right, in that Vps74p acts in COPI-dependent retrograde
      traffic, but the compartment pair is wrong. What the paper describes, and what
      every subsequent study supports, is recycling of resident enzymes between Golgi
