core_functions:
- description: Cargo adaptor on the cytosolic face of cis and medial Golgi membranes
    that binds a pentameric motif in the short N-terminal cytosolic tails of resident
    mannosyltransferases (Kre2p, Mnn2p, Mnn5p, Och1p, Ktr3p, Mnn4p) with one surface
    and COPI coatomer, via an N-terminal arginine cluster, with another, loading those
    enzymes into retrograde COPI vesicles and so retaining them in their resident cisternae
    rather than letting them travel on to the vacuole for degradation. The activity
    requires beta-hairpin-dependent tetramerization and PtdIns4P-dependent membrane
    recruitment.
  molecular_function:
    id: GO:0140312
    label: cargo adaptor activity
  directly_involved_in:
  - id: GO:0045053
    label: protein retention in Golgi apparatus
  - id: GO:0000301
    label: retrograde transport, vesicle recycling within Golgi
  locations:
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0005797
    label: Golgi medial cisterna
  supported_by:
