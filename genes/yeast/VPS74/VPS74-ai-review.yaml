id: Q06385
gene_symbol: VPS74
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Vps74p (also called Mnn3p) is the budding-yeast member of the GOLPH3/GPP34
  family and the orthologue of human GOLPH3 and GOLPH3L. It is a soluble, tetrameric
  protein recruited to the cytosolic face of Golgi membranes by direct recognition
  of phosphatidylinositol 4-phosphate through a basic pocket in its GPP34 fold, so
  its Golgi residence depends on ongoing PtdIns4P synthesis by the Pik1 PI 4-kinase.
  On the membrane it works as a cargo adaptor, or sorting receptor: one surface binds
  a short pentameric motif in the N-terminal cytosolic tails of cis- and medial-Golgi
  mannosyltransferases such as Kre2p, Mnn2p, Mnn5p, Och1p, Ktr3p and Mnn4p, while
  an N-terminal arginine cluster binds COPI coatomer, coupling those enzymes to retrograde
  COPI vesicles and thereby holding them in their resident cisternae instead of letting
  them escape to the vacuole, where they are degraded. Vps74p also binds the catalytic
  domain of the Sac1 phosphoinositide phosphatase and, with it, keeps PtdIns4P low
  on medial-Golgi cisternae, linking Golgi enzyme sorting to local phosphoinositide
  and sphingolipid homeostasis. Because the glycosyltransferases it retains build
  N- and O-linked mannose chains, cells lacking Vps74p secrete hypoglycosylated proteins
  and have altered cell-wall mannan, even though Vps74p itself is cytosolic and performs
  no glycosylation chemistry. In mammalian cells the same fold additionally links
  Golgi membranes to the actomyosin motor MYO18A, a partner that budding yeast lacks.'
