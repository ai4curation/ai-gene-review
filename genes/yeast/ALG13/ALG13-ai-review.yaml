- term:
    id: GO:0098548
    label: cytoplasmic side of Golgi membrane
  evidence_type: IDA
  original_reference_id: PMID:16100110
  qualifier: located_in
  review:
    summary: IDA 'cytoplasmic side of Golgi membrane' from Gao et al. 2005. The paper's own abstract states
      that Alg14 recruits Alg13 to the cytosolic face of the ER, where GlcNAc2-PP-Dol is made; nothing
      in it concerns the Golgi. The cytoplasmic-side concept is right but the organelle appears to be
      a term-selection slip; the correct term is cytoplasmic side of ER membrane.
    action: MODIFY
    reason: Same paper explicitly places Alg13 at the cytosolic face of the ER, not the Golgi.
    proposed_replacement_terms:
