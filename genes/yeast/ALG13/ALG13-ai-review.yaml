id: P53178
gene_symbol: ALG13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ALG13 encodes the soluble catalytic subunit of the bipartite UDP-N-acetylglucosamine transferase
  (Alg13-Alg14; EC 2.4.1.141) of S. cerevisiae, an essential enzyme related to the C-terminal UDP-sugar-binding
  domain of bacterial MurG (glycosyltransferase family GT28, GT-B fold). Alg13p has no transmembrane segment
  and binds the donor UDP-GlcNAc; it is recruited to the cytoplasmic face of the ER membrane by the membrane
  anchor subunit Alg14p, and only the Alg13-Alg14 heterodimer is active. The complex transfers a second
  beta-1,4-linked GlcNAc to GlcNAc-PP-dolichol to form GlcNAc2-PP-dolichol (chitobiosyl-PP-Dol), the second
  step of N-glycan precursor assembly. Depletion of Alg13p causes accumulation of GlcNAc1-PP-Dol, N-glycosylation
  defects and growth arrest; a cytosolic pool of Alg13p not bound to Alg14p is catalytically inactive.
  Human ALG13 variants cause ALG13-CDG.
