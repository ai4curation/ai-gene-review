core_functions:
- description: UDP-GlcNAc-binding catalytic subunit of the Alg13-Alg14 heterodimeric UDP-N-acetylglucosamine
    transferase, which adds the second GlcNAc to GlcNAc-PP-dolichol on the cytoplasmic face of the ER
    to form GlcNAc2-PP-Dol.
  contributes_to_molecular_function:
    id: GO:0004577
    label: N-acetylglucosaminyldiphosphodolichol N-acetylglucosaminyltransferase activity
  directly_involved_in:
  - id: GO:0006488
    label: dolichol-linked oligosaccharide biosynthetic process
  locations:
  - id: GO:0098554
    label: cytoplasmic side of endoplasmic reticulum membrane
  in_complex:
    id: GO:0043541
    label: UDP-N-acetylglucosamine transferase complex
  supported_by:
  - *id001
  - *id003
  - *id004
  - *id007
  - reference_id: PMID:18547528
    supporting_text: shows that the interaction of Alg13 with the sugar donor is primarily through the
      residues in the C-terminal half of the protein.
suggested_questions:
- question: Does the soluble, inactive Alg13 pool have a regulatory role (e.g. sensing UDP-GlcNAc or Alg14
    availability), or is it simply excess protein?
suggested_experiments:
- description: Quantify Alg13 partitioning between membrane and cytosol under different UDP-GlcNAc levels
    and growth conditions, and test whether the cytosolic pool is degraded or recruited on demand.
