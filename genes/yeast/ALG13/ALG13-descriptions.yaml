descriptions:
- source: UniProt
  text: Involved in protein N-glycosylation. Essential for the second step of the
    dolichol-linked oligosaccharide pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53178
  source_id: P53178
- source: Alliance_Imported
  text: Catalytic component of UDP-GlcNAc transferase; required for the second step
    of dolichyl-linked oligosaccharide synthesis; anchored to the ER membrane via
    interaction with Alg14p; similar to bacterial and human glycosyltransferases;
    protein abundance increases in response to DNA replication stress; both human
    homologs ALG13 and ALG14 are required to complement yeast alg13 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALG13
  source_id: SGD:S000003015
- source: Alliance_Automated
  text: Enables identical protein binding activity. Contributes to N-acetylglucosaminyldiphosphodolichol
    N-acetylglucosaminyltransferase activity. Involved in dolichol-linked oligosaccharide
    biosynthetic process. Located in cytoplasmic side of Golgi membrane and cytosol.
    Part of UDP-N-acetylglucosamine transferase complex. Human ortholog(s) of this
    gene implicated in developmental and epileptic encephalopathy 36. Orthologous
    to human ALG13 (ALG13 UDP-N-acetylglucosaminyltransferase subunit).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALG13
  source_id: SGD:S000003015
