- source: Alliance_Imported
  text: Catalytic component of UDP-GlcNAc transferase; required for the second step
    of dolichyl-linked oligosaccharide synthesis; anchored to the ER membrane via
    interaction with Alg14p; similar to bacterial and human glycosyltransferases;
    protein abundance increases in response to DNA replication stress; both human
    homologs ALG13 and ALG14 are required to complement yeast alg13 mutant
