  label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for yeast HSP60, the mitochondrial group I chaperonin. Rank 1
  is an exact GOA match at 17.99 with a 2.4-unit gap to rank 2, the largest top-1 margin in the yeast
  batch, and ranks 3 and 5 are the specific and general forms of de novo protein folding, both correct.
  The failure is rank 2: the mitosome is the degenerate mitochondrion of Giardia and Entamoeba, organisms
  that have lost oxidative phosphorylation entirely; S. cerevisiae has ordinary mitochondria and no
  mitosome. Chaperonin 60 is indeed one of the few proteins retained in mitosomes, which is presumably
  why the sentence sits close to this query in the embedding space - the family association is real
  and the compartment assignment is still impossible for this organism. Rank 4 makes a milder version
  of the same error, placing a matrix chaperonin at the cristae. As with HSP104 in the same batch,
  the core molecular function - ATP-dependent protein folding chaperone, held in GOA by IEA - never
  appears; the retrieval returns compartments and processes and no enzymology. Assessment: 1 correct-not-novel,
  1 correct novel, 1 nonparalog incorrect. Assessment: 1 correct novel (COR), 1 correct not novel
  (CNN), 1 nonparalog incorrect (NPI).
