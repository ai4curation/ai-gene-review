    error_type: TAXON_CONSTRAINT_VIOLATION
    summary: >-
      Rank 2 (score 15.59). The mitosome is the reduced, cristae-less, genome-less mitochondrion-derived
      organelle of amitochondriate eukaryotes such as Giardia and Entamoeba. S. cerevisiae has fully
      functional mitochondria and no mitosome, so the compartment does not exist in this organism.
      The association is not random - chaperonin 60 is among the small set of proteins retained in
      mitosomes - which makes it the kind of error that reads plausibly to a non-specialist. Scored
      MORE_SPECIFIC against GOA's cytoplasm, so ontology closure credits it.
    supported_by:
