gene_symbol: BNA2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Bna2 (YJR078W) is the sole tryptophan 2,3-dioxygenase-type enzyme of Saccharomyces cerevisiae, a heme
  protein of the indoleamine 2,3-dioxygenase (IDO) family (EC 1.13.11.52). It opens the indole ring of L-tryptophan
  with O2 to give N-formyl-L-kynurenine, the first and committing step of the kynurenine pathway that supplies quinolinate
  for de novo NAD+ synthesis; yeast lacks a separate TDO. UniProt also lists D-tryptophan as a substrate. Because
  molecular oxygen is required, de novo NAD+ synthesis is aerobic and yeast is a nicotinic acid auxotroph anaerobically.
  Bna2 is cytoplasmic.
