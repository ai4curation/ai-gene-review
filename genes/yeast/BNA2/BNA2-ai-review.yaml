suggested_questions:
- question: GO now defines indoleamine 2,3-dioxygenase activity (GO:0033754) on D-tryptophan; should IDO-family
    enzymes whose physiological substrate is L-tryptophan (Bna2, human IDO1) be annotated to GO:0004833, and does
    GO intend a separate L-Trp IDO term?
