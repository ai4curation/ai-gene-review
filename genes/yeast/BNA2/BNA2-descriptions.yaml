gene_symbol: BNA2
organism: yeast
uniprot_id: P47125
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the first step in tryptophan catabolism in order to supply de novo
    nicotinamide adenine dinucleotide (NAD(+)) via the kynurenine pathway. Plays a
    role in the cellular response to telomere uncapping.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47125
  source_id: P47125
- source: Alliance_Imported
  text: 'Tryptophan 2,3-dioxygenase or indoleamine 2,3-dioxygenase; required for de
    novo biosynthesis of NAD+ from tryptophan via kynurenine; up-regulated by telomere
    uncapping, and interacts genetically with capping gene CDC13; overexpression reduces
    lipid droplet accumulation by skewing glycolytic flux towards biosynthesis of
    shikimate, aromatic amino acids, and NAD+ during aging and extends lifespan; regulated
    by Hst1p and Aftp '
  source_type: curated
  url: https://www.yeastgenome.org/locus/BNA2
  source_id: SGD:S000003839
- source: Alliance_Automated
  text: Enables indoleamine 2,3-dioxygenase activity. Involved in 'de novo' NAD+ biosynthetic
    process from L-tryptophan. Located in cytoplasm. Orthologous to human IDO1 (indoleamine
    2,3-dioxygenase 1) and IDO2 (indoleamine 2,3-dioxygenase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BNA2
  source_id: SGD:S000003839
