id: P34110
gene_symbol: VPS35
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Vps35 is the large alpha-helical subunit of the retromer cargo-selective complex (CSC)
  of Saccharomyces cerevisiae, a heterotrimer with Vps26 and Vps29. It is a hydrophilic peripheral
  membrane protein; most of it sits on endosomal membranes and a small fraction is cytosolic. Its
  N-terminal region, including a conserved PRLYL motif, binds Vps26, and its C-terminal region binds
  Vps29. On the prevacuolar (late) endosome the CSC assembles with the SNX-BAR heterodimer Vps5-Vps17
  to form the pentameric retromer coat, or with the PX protein Snx3. In the fungal coat structure two
  Vps35 molecules meet at their C-termini to form the legs of arches that rise from the sorting-nexin
  layer, and Vps35-Vps35 contacts are needed for the coat to constrict membrane tubules. Vps35 binds
  the cytosolic tails of cargo proteins in a retrieval-signal-dependent manner, together with Vps26
  for bipartite signals. It thereby selects the CPY receptor Vps10, the late-Golgi proteases Kex2 and
  DPAP A (Ste13), Ear1 and, through Snx3, the iron transporter Ftr1 for retrograde carriers that return
  them from endosomes, and from the vacuole membrane, to the trans-Golgi network. vps35 null cells
  therefore secrete procarboxypeptidase Y and lose Vps10 and late-Golgi membrane proteins to the vacuole.
  Through a conserved region in its N-terminal half (repeat 6), Vps35 binds the GTP-bound Rab7 homologue
  Ypt7; this interaction targets the CSC to the vacuole membrane and is needed for cargo export from
  endosomes. With Vps26 and Vps29, Vps35 also binds the PROPPIN Atg18 in the CROP complex, which promotes
  Atg18-driven membrane fission and is required for salt-induced vacuole fragmentation. Vps35 is the
  orthologue of human VPS35, a Parkinson's disease gene.
