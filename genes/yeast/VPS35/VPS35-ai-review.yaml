      activity of Vps35. Vps35 carries the binding determinant. Loss of Ypt7 recognition (Vps35Δ6) mis-sorts
      Vps10, Ste13 and Ftr1 to the vacuole, and Ypt7 activation regulates cargo export from endosomes (PMID:22593205).
