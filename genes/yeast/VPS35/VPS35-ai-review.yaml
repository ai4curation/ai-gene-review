  review:
    summary: Immobilised GST-Ypt7 and the GTP-locked GST-Ypt7(Q68L) capture Vps35, Vps26 and Vps29 from
      yeast extracts, but GST-Vps21 does not. A Vps35 internal deletion of repeat 6 (aa 218-252) abolishes
