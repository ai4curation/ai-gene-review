      CSC during formation of recycling tubules.
suggested_questions:
- question: Does the CROP complex (CSC with Atg18) cut endosomal retromer carriers as well as vacuole membranes,
    and what decides whether the CSC binds SNX-BARs (coat assembly) or Atg18 (fission)?
- question: Which Vps35 surfaces recognise cargo directly, as opposed to through Vps26? Do the cargo-specific
    vps35 alleles that separate A-ALP from Vps10 retrieval map onto the Ear1/Vps10 bipartite-signal binding
    sites?
- question: Is the role of Vps35 in Ftr1 and Snc1 recycling only the endosome-to-Golgi step, or do any
    retromer carriers in yeast go directly to the plasma membrane?
- question: Does the reported complementation of vps35 null Ni2+ and Cd2+ phenotypes by human VPS35 and
    PD variants (SGD description) have a published source, and does it agree with the copper data in which
    D686N fails to rescue?
suggested_experiments:
- description: Reconstitute CROP from purified CSC (wild type, Vps35 dimer-interface mutants) and Atg18
    on PI(3,5)P2-containing giant vesicles. Compare fission with that of SNX-BAR/CSC coats, and test Vps5
    competition, by time-lapse imaging.
- description: Map Vps35-cargo contacts by site-specific photo-cross-linking of Vps10 and A-ALP tails on
    membrane-assembled yeast retromer. Combine with the cargo-specific vps35 alleles (PMID:10198044) to
    assign the binding surfaces.
- description: Follow endocytosed Ftr1-GFP with a Golgi marker, and with a Golgi-to-plasma membrane block
    (sec mutant), in wild type and vps35Δ cells. This would show whether any retromer-dependent recycling
    avoids the Golgi.
