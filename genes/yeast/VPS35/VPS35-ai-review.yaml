  review:
    summary: ComplexPortal statement for the yeast retromer complex, citing Seaman et al. 1998. The full
      text of that paper discusses retrieval from the prevacuolar endosome to the late Golgi and has no
      statement about transport to the plasma membrane. GO:0032456 was renamed from 'endocytic recycling'
      to 'endosome to plasma membrane transport' and is defined as the movement of vesicles from endosomes
      back to the plasma membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'In S. cerevisiae, Vps35 contributes to recycling of some plasma membrane proteins only through
      the endosome-to-Golgi step. Retromer- and Snx3-dependent recycling of Fet3-Ftr1 passes through the
      Golgi for resecretion (PMID:17420293). Retromer is a minor route that returns Snc1 to the Golgi and
      has no role in FM4-64 recycling (PMID:32074001). Retromer''s TGN cargoes do not visit the plasma membrane
      (PMID:11038177). The cited paper does not make the claim. The real contribution, retrograde transport
      from endosome to Golgi, is accepted on other rows. Direct endosome-to-plasma-membrane transport goes
      beyond the yeast evidence, so the row is marked over-annotated rather than removed: retromer is required
      for Ftr1 to stay at the cell surface.'
