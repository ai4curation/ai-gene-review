  supported_by:
  - reference_id: PMID:11038177
    supporting_text: By genetic and biochemical means we now show that Vps35p directly associates with
      the cytosolic domains of cargo proteins.
  - reference_id: PMID:31337624
    supporting_text: From these results, we propose that cargo recognition by the yeast retromer is mediated
      through Vps26 and Vps35.
  - reference_id: PMID:9700157
    supporting_text: Based on these findings we propose a model in which Vps35p/Vps29p/Vps26p function
      to select cargo for retrieval, and Vps5p/Vps17p assemble onto the membrane to promote vesicle formation.
  - reference_id: PMID:10198044
    supporting_text: Vps35p is required for the prevacuolar compartment-to-TGN transport of both A-ALP
      and Vps10p.
  - reference_id: PMID:36644906
    supporting_text: In line with this, genetic ablation of retromer oligomerization impairs endosomal protein
      exit in yeast and human cells.
- description: Rab effector binding of GTP-bound Ypt7 (Rab7) through a conserved region in the N-terminal
    half of Vps35 (repeat 6). The interaction is required for cargo export from maturing endosomes, and
    the SNX-BAR coat later displaces Ypt7 from cargo-bound CSC during tubule formation. Ypt7 binding also
    targets a non-core pool of the CSC to the vacuole membrane, which is not listed as a location here.
