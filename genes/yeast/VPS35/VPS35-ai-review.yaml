      supporting_text: assemble together on an endosomal membrane
    - reference_id: PMID:9700157
      supporting_text: Previous studies have shown that Vps35p and Vps5p can be stripped off the membrane
        by treatment with 1M NaCl
    - reference_id: PMID:1498362
