  review:
    summary: Vps35 is a salt-strippable peripheral membrane protein. In density gradients it co-fractionates
      with an endosomal membrane population marked by Pep12, and with Vps5/Vps17 on dense vesicle/tubule
      fractions. Its membrane association depends on Vps29 (SGD:S000001054) and the other retromer subunits
      (PMID:9700157).
    action: MODIFY
    reason: The endosome location is right, but the paper's own data show more than that. Vps35 is a peripheral
      protein bound to the cytosolic face of endosomal membranes, and the authors conclude that the two
      subcomplexes assemble on an endosomal membrane. GO:0010008 endosome membrane is the supported is_a/part_of
      descendant. Endosome is not one of the root organelle terms covered by the organelle policy, so the
      ordinary refinement rule applies. The stage (late/prevacuolar endosome) is recorded by the separate
      IBA row.
    proposed_replacement_terms:
    - id: GO:0010008
      label: endosome membrane
    supported_by:
