    review_notes: 'Checked each claim. Endosomal retromer subunit required for retrograde transport: PMID:9700157,
      PMID:9105038. Receptor recognising retrieval signals on cargo: PMID:11038177. Subcomplex with Vps26
      and Vps29 that selects cargo: PMID:9700157. Interacts with Ypt7: PMID:22593205, PMID:21062894. All
      of these agree with the review. Not traced: that wild-type human VPS35, or the PD-associated vps35-D686N
      or vps35-P299S variants, complement the Ni2+ resistance and Cd2+ sensitivity of the vps35 null mutant.
      Three PubMed searches found no source, and the related copper study (PMID:27262440) reports that D686N
      fails to rescue copper sensitivity, a different phenotype.'
core_functions:
- description: Central alpha-solenoid subunit of the retromer cargo-selective complex (Vps35-Vps26-Vps29).
    On the prevacuolar endosome membrane it binds retrieval signals in the cytosolic tails of membrane
    cargo (Vps10, A-ALP/DPAP A, Kex2, Ear1; Ftr1 through Snx3) and links them, through Vps26 and Vps29,
    to the Vps5-Vps17 SNX-BAR coat. Cargo is thereby packaged into tubular carriers that return it to the
    trans-Golgi network.
  contributes_to_molecular_function:
    id: GO:0140312
    label: cargo adaptor activity
