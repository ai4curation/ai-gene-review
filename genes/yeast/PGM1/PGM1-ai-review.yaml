id: P33401
gene_symbol: PGM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PGM1 encodes the minor phosphoglucomutase isozyme of Saccharomyces cerevisiae (EC 5.4.2.2),
  a cytoplasmic, Mg2+-dependent alpha-D-phosphohexomutase family enzyme that reversibly interconverts
  alpha-D-glucose 1-phosphate and glucose 6-phosphate via a glucose 1,6-bisphosphate intermediate. Pgm1
  provides roughly 10-20% of cellular phosphoglucomutase activity, the remainder coming from its paralog
  Pgm2. In the forward direction phosphoglucomutase converts the glucose 1-phosphate produced by the Leloir
  pathway into glycolytic glucose 6-phosphate, and cells lacking both PGM1 and PGM2 have no detectable
  activity and cannot grow on galactose; in the reverse direction it supplies glucose 1-phosphate for
  UDP-glucose and hence for glycogen, trehalose and cell-wall glucan synthesis. Purified Pgm1 has only
  residual ribose-1-phosphate mutase activity; Pgm3 is the main phosphoribomutase.
