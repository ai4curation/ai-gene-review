descriptions:
- source: UniProt
  text: Minor phosphoglucomutase isozyme that catalyzes the reversible interconversion
    of alpha-D-glucose 1-phosphate and alpha-D- glucose 6-phosphate (PubMed:23103740,
    PubMed:5784209). The mechanism proceeds via the intermediate compound alpha-D-glucose
    1,6-bisphosphate (Probable). Constitutes about 10-20% of the phosphoglucomutase
    activity in the cell (PubMed:14264884, PubMed:5231755). Key enzyme in hexose metabolism.
    The forward reaction is an essential step in the energy metabolism of galactose
    since the product of the galactose pathway enzymes in yeast is glucose 1-phosphate.
    The reverse reaction is an essential step for biosynthesis when carbon sources
    other than galactose are the energy source because glucose 1-phosphate is the
    starting point for the synthesis of UDP-glucose, which acts as a precursor for
    the synthesis of oligosaccharides and trehalose (PubMed:14264884).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33401
  source_id: P33401
- source: Alliance_Imported
  text: Phosphoglucomutase, minor isoform; catalyzes the conversion from glucose-1-phosphate
    to glucose-6-phosphate, which is a key step in hexose metabolism; PGM1 has a paralog,
    PGM2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/PGM1
  source_id: SGD:S000001610
- source: Alliance_Automated
  text: Enables phosphoglucomutase activity. Involved in several processes, including
    UDP-alpha-D-glucose metabolic process; carbohydrate biosynthetic process; and
    glucose 1-phosphate metabolic process. Located in cytoplasm. Used to study congenital
    disorder of glycosylation It. Human ortholog(s) of this gene implicated in congenital
    disorder of glycosylation It; endometrial cancer; and teratoma. Orthologous to
    several human genes including PGM5 (phosphoglucomutase 5).
  source_type: automated
