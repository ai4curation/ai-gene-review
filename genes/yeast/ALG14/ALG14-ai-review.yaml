id: P38242
gene_symbol: ALG14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Alg14 is a single-pass endoplasmic reticulum membrane protein. It is the non-catalytic,
  membrane-anchoring subunit of the bipartite UDP-N-acetylglucosamine transferase (Alg13/Alg14) that performs
  the second step of dolichol-linked oligosaccharide (LLO) assembly: transfer of GlcNAc from UDP-GlcNAc
  onto GlcNAc-PP-dolichol to form the chitobiose core GlcNAc2-PP-dolichol (EC 2.4.1.141). Alg14 is related
  to the N-terminal membrane-associating domain of bacterial MurG and has no catalytic sequences of its
  own. It recruits the soluble, MurG C-terminal-like catalytic subunit Alg13 from the cytosol to the cytoplasmic
  face of the ER and is necessary and sufficient for Alg13 membrane association and activity. Alg14 has
  an N-terminus in the ER lumen, one transmembrane segment and a cytosolic C-terminal domain. Together
  with Alg7 (GlcNAc-1-P transferase) and Alg13 it forms a hetero-oligomeric early dolichol-cycle complex.
  ALG14 is essential, and depletion causes GlcNAc1-PP-dolichol to accumulate and protein N-glycosylation
  to fail. In oleate-grown cells Alg14 is enriched in ER domains associated with lipid droplets.'
