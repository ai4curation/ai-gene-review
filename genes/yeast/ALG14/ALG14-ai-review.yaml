- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: HDA
  original_reference_id: PMID:35563734
  qualifier: located_in
  review:
    summary: peroxisome, HDA from a high-throughput peroxisome-proteome screen (David et al. 2022). In
      that screen every protein was overexpressed from the strong TEF2 promoter. ALG14 is not discussed
      in the paper text. Alg14 is a single-pass ER membrane protein with well-documented ER localization.
      A peroxisomal signal for an overexpressed ER membrane protein is most likely an overexpression or
      ER-derived artefact, and it has no functional support.
    action: MARK_AS_OVER_ANNOTATED
    reason: Unconfirmed peroxisomal signal from an overexpression screen. It conflicts with several focused
      studies that place Alg14 in the ER membrane, and no peroxisomal function is known.
    supported_by:
    - reference_id: PMID:35563734
      supporting_text: expressed from the constitutive and strong TEF2 promoter
