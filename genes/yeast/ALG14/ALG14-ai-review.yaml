suggested_questions:
- question: Does Alg14 contact the GlcNAc1-PP-dolichol acceptor directly, as the MurG N-terminal domain
    does for lipid I, or is acceptor binding entirely provided by Alg13?
- question: What targets Alg14 to lipid-droplet-associated ER domains in oleate-grown cells, and does
    this partitioning change flux through early LLO assembly?
suggested_experiments:
- description: Crosslink or photo-label GlcNAc1-PP-dolichol analogues in reconstituted Alg13/Alg14 (and
    Alg7/Alg13/Alg14) complexes to map which subunit binds the lipid acceptor.
