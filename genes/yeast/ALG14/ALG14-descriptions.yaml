- source: Alliance_Automated
  text: Enables protein-membrane adaptor activity. Contributes to N-acetylglucosaminyldiphosphodolichol
    N-acetylglucosaminyltransferase activity. Involved in dolichol-linked oligosaccharide
    biosynthetic process. Located in several cellular components, including cytoplasmic
    side of Golgi membrane; lipid droplet; and nuclear membrane. Part of UDP-N-acetylglucosamine
    transferase complex. Human ortholog(s) of this gene implicated in congenital myasthenic
    syndrome 15 and epilepsy. Orthologous to human ALG14 (ALG14 UDP-N-acetylglucosaminyltransferase
    subunit).
