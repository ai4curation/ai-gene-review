gene_symbol: ALG14
organism: yeast
uniprot_id: P38242
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in protein N-glycosylation. Essential for the second step of the
    dolichol-linked oligosaccharide pathway. Anchors the catalytic subunit ALG13 to
    the ER.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38242
  source_id: P38242
- source: Alliance_Imported
  text: Component of UDP-GlcNAc transferase; required for second step of dolichyl-linked
    oligosaccharide synthesis; anchors catalytic subunit Alg13p to ER membrane; localizes
    to the peroxisome; similar to bacterial and human glycosyltransferases; both human
    homologs ALG13 and ALG14 are required to complement yeast alg14 mutant; mutations
    of human ALG14 cause congenital myasthenic syndrome
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALG14
  source_id: SGD:S000000274
- source: Alliance_Automated
  text: Enables protein-membrane adaptor activity. Contributes to N-acetylglucosaminyldiphosphodolichol
    N-acetylglucosaminyltransferase activity. Involved in dolichol-linked oligosaccharide
    biosynthetic process. Located in several cellular components, including cytoplasmic
    side of Golgi membrane; lipid droplet; and nuclear membrane. Part of UDP-N-acetylglucosamine
    transferase complex. Human ortholog(s) of this gene implicated in congenital myasthenic
    syndrome 15 and epilepsy. Orthologous to human ALG14 (ALG14 UDP-N-acetylglucosaminyltransferase
    subunit).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALG14
  source_id: SGD:S000000274
