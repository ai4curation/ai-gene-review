gene_symbol: DUG1
organism: yeast
uniprot_id: P43616
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalytic component of the GSH degradosomal complex involved in the degradation
    of glutathione (GSH) and other peptides containing a gamma-glu-X bond. Also functions
    in a DUG2-DUG3-independent manner as a dipeptidase with high specificity for Cys-Gly
    and no activity toward tri- or tetrapeptides.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P43616
  source_id: P43616
- source: Alliance_Imported
  text: Cys-Gly metallo-di-peptidase; forms a complex with Dug2p and Dug3p to degrade
    glutathione (GSH) and other peptides containing a gamma-glu-X bond in an alternative
    pathway to GSH degradation by gamma-glutamyl transpeptidase (Ecm38p); human homolog
    CNDP2 can complement yeast dug1 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/DUG1
  source_id: SGD:S000001940
- source: Alliance_Automated
  text: Enables identical protein binding activity; metallodipeptidase activity; and
    omega peptidase activity. Involved in glutathione catabolic process. Located in
    cytoplasm. Human ortholog(s) of this gene implicated in glomerulonephritis and
    kidney disease. Orthologous to human CNDP1 (carnosine dipeptidase 1) and CNDP2
    (carnosine dipeptidase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DUG1
  source_id: SGD:S000001940
