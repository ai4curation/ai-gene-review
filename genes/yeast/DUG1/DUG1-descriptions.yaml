findings:
- category: discrepancy
  text: 'UniProt and SGD place Dug1 in a Dug1-Dug2-Dug3 complex. The review finds
    the heteromeric complex unsupported: Dug1 is a homodimer acting after (Dug2-Dug3)2.'
