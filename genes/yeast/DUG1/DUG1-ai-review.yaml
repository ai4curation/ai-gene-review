gene_symbol: DUG1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Cys-Gly metallodipeptidase of the peptidase M20A family (CNDP2/Dug1 family) in Saccharomyces cerevisiae.
  Dug1 is a cytoplasmic homodimer that hydrolyses L-cysteinylglycine to L-cysteine and glycine with high specificity,
  requiring Zn2+ or Mn2+, and is inactive toward tri- and tetrapeptides. It acts at the final step of glutathione
  degradation in both the gamma-glutamyl cycle (Cys-Gly released by the vacuolar gamma-glutamyltransferase Ecm38)
  and the fungus-specific DUG pathway, where the (Dug2-Dug3)2 glutamine amidotransferase first cleaves the gamma-glutamyl
  bond of glutathione. Loss of DUG1 causes Cys-Gly accumulation and prevents use of glutathione or Cys-Gly as sole
  sulfur source. The S. pombe orthologue and human CNDP2 also show Cys-Gly dipeptidase activity.
