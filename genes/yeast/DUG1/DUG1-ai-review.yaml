  supporting_entities:
  - SGD:S000004290
  review:
    summary: Omega peptidase activity was inferred from the genetic requirement of DUG1 (together with ECM38 in
      the with/from) for growth on gamma-glutamyl compounds, when Dug1 was thought to be the catalytic subunit of
      a GSH degradosome. Later biochemistry showed that purified Dug1 cleaves only Cys-Gly and is inactive on glutathione
      and other tripeptides, and that the gamma-glutamyl (isopeptide) bond of GSH is cleaved by the (Dug2-Dug3)2
      glutamine amidotransferase. Dug1 therefore does not perform an omega-peptidase reaction; its activity is a
      normal alpha-peptide-bond metallodipeptidase.
    action: MODIFY
    reason: The gamma-glutamyl bond cleavage attributed to the DUG pathway is catalysed by Dug2-Dug3; Dug1 acts
      downstream on Cys-Gly, an alpha-linked dipeptide.
