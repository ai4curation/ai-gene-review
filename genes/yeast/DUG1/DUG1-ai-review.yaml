suggested_questions:
- question: Does Dug1 form any transient functional assembly with (Dug2-Dug3)2 in vivo (substrate channelling of
    Cys-Gly), given that yeast two-hybrid detected a weak Dug1-Dug2 interaction but co-purification did not?
- question: How does vacuolar Cys-Gly produced by Ecm38 reach cytosolic Dug1, or is there a separate vacuolar Cys-Gly
    dipeptidase?
suggested_experiments:
- hypothesis: Dug1 is the sole Cys-Gly dipeptidase acting on Cys-Gly derived from vacuolar glutathione turnover.
  description: Measure vacuolar and cytosolic Cys-Gly pools in dug1, ecm38 and dug1 ecm38 strains under nitrogen
    starvation, using fractionation and LC-MS.
