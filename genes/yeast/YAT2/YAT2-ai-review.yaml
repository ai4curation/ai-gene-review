id: P40017
gene_symbol: YAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: YAT2 (YER024W) encodes a cytosolic carnitine O-acetyltransferase (EC 2.3.1.7), one of the three carnitine
  acetyltransferases of Saccharomyces cerevisiae together with CAT2 and YAT1. It reversibly transfers acetyl groups
  from acetyl-CoA to L-carnitine. This lets cytosolic acetyl units (for example those derived from ethanol or acetate)
  be carried into mitochondria as acetylcarnitine through the carnitine shuttle. Yat2p accounts for a significant
  part of total cellular carnitine acetyltransferase activity on ethanol. In a strain lacking the peroxisomal citrate
  synthase CIT2, YAT2, CAT2, YAT1 and L-carnitine are all required for growth on non-fermentable carbon sources.
  Overexpressing any one of the three enzymes does not compensate for loss of another, so each has a distinct metabolic
  role.
