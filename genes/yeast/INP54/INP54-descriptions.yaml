taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Regulates the phosphatidylinositol (4,5)-diphosphate levels on the cytoplasmic
    surface of the endoplasmic reticulum and thereby regulates secretion. Does not
    utilize phosphatidylinositol 3,5- bisphosphate (PtdIns(3,5)P2), nor phosphatidylinositol
    3-phosphate (PtdIns(3)P) and phosphatidylinositol 4-phosphate (PtdIns(4)P).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08227
  source_id: Q08227
- source: Alliance_Imported
  text: Phosphatidylinositol 4,5-bisphosphate 5-phosphatase; role in secretion; localizes
    to the endoplasmic reticulum via the C-terminal tail; lacks the Sac1 domain and
    proline-rich region found in the other 3 INP proteins
  source_type: curated
  url: https://www.yeastgenome.org/locus/INP54
  source_id: SGD:S000005426
- source: Alliance_Automated
  text: Enables phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity. Involved
    in phosphatidylinositol dephosphorylation. Located in endoplasmic reticulum.
  source_type: automated
  url: https://www.yeastgenome.org/locus/INP54
  source_id: SGD:S000005426
