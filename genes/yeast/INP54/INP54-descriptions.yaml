- source: UniProt
  text: Regulates the phosphatidylinositol (4,5)-diphosphate levels on the cytoplasmic
    surface of the endoplasmic reticulum and thereby regulates secretion. Does not
    utilize phosphatidylinositol 3,5- bisphosphate (PtdIns(3,5)P2), nor phosphatidylinositol
    3-phosphate (PtdIns(3)P) and phosphatidylinositol 4-phosphate (PtdIns(4)P).
