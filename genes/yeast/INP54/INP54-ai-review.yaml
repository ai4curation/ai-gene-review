id: Q08227
gene_symbol: INP54
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: INP54 encodes the smallest of the four budding yeast inositol polyphosphate 5-phosphatases (~44 kDa).
  It lacks the Sac1-like and proline-rich domains of Inp51-53 and consists of a 5-phosphatase catalytic domain followed
  by a C-terminal leucine-rich region and a 13-residue hydrophobic tail that anchors it post-translationally in
  the endoplasmic reticulum membrane with the catalytic domain facing the cytosol. Inp54 hydrolyses PI(4,5)P2 to
  PI4P and is thought to keep PI(4,5)P2 low on the cytoplasmic surface of the ER; inp54 null cells show about two-fold
  increased secretion of a reporter protein, implicating it in regulation of secretion from the ER.
