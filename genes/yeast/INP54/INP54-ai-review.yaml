suggested_questions:
- question: Does Inp54 act in trans at ER-plasma membrane contact sites on plasma-membrane PI(4,5)P2, analogous
    to Sac1 acting on PI4P, rather than on an ER-resident PI(4,5)P2 pool?
suggested_experiments:
- hypothesis: Inp54 dephosphorylates plasma-membrane PI(4,5)P2 at ER-PM contacts
  description: Measure PM PI(4,5)P2 biosensor levels in inp54 cells with and without tether deletion (ist2 scs2
    scs22 tcb1/2/3) and test whether an artificial ER-PM linker rescues.
  experiment_type: cell biology / lipid imaging
