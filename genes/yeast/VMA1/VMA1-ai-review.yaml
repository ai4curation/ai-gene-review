    label: Golgi membrane
  evidence_type: NAS
  original_reference_id: PMID:30910982
  qualifier: located_in
  review:
    summary: 'Accepted: Vma1p is a common V1 catalytic subunit and Stv1-containing V-ATPases function
      at Golgi/endosomal membranes.'
    action: ACCEPT
    reason: 'The Golgi row is consistent with the Stv1-containing yeast V-ATPase: Vma1p is the catalytic
      A subunit shared by Vph1- and Stv1-containing complexes, and Stv1p targets a V-ATPase isoform to
      the Golgi apparatus and endosomes.'
    additional_reference_ids:
    - PMID:30910982
    supported_by:
    - reference_id: PMID:30910982
      supporting_text: 'In the yeast Saccharomyces cerevisiae, isoform diversity is limited to two different
        versions of the proton-translocating subunit a: Vph1p, which is targeted to the vacuole, and Stv1p,
        which is targeted to the Golgi apparatus and endosomes.'
