id: P17255
gene_symbol: VMA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Vma1p is the catalytic A subunit of the Saccharomyces cerevisiae V-type H+-ATPase. The precursor
  is translated as a 1071-amino-acid protein in which the PI-SceI/VDE intein interrupts the A subunit;
  protein splicing excises the homing endonuclease and ligates the N- and C-terminal exteins to produce
  the mature V1 catalytic subunit. Mature Vma1p hydrolyzes ATP in the peripheral V1 sector of vacuolar
  and Golgi/endosomal V-ATPase complexes, driving rotary proton translocation through the membrane V0
  sector to acidify the fungal vacuole and other endomembrane compartments.
functional_isoforms:
- id: VMA1_PI_SCEI
  name: PI-SceI/VDE intein
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000002459
    residues: 284-737
  description: >-
    Endonuclease PI-SceI is excised from the 1071-aa VMA1 precursor by protein
    self-splicing. This non-core cleavage product binds and cleaves the
    sequence present in inteinless VMA1 alleles to initiate meiotic homing.
  isoform_specific_terms:
  - id: GO:0043565
    label: sequence-specific DNA binding
  - id: GO:1990238
    label: double-stranded DNA endonuclease activity
  - id: GO:0016539
    label: intein-mediated protein splicing
