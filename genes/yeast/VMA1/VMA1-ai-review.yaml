- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007869
  review:
    summary: 'Modified: the excised PI-SceI/VDE intein binds a specific VMA1 homing site rather than DNA
      generically.'
    action: MODIFY
    reason: P17255 is translated as a 1071-aa precursor whose intein is excised to produce the mature
      V-ATPase catalytic subunit; the InterPro DNA-binding row reflects the PI-SceI homing endonuclease
      segment, not the proton-pumping A subunit. UniProt's curated PI-SceI function supports the more
      specific sequence-specific DNA binding term.
    proposed_replacement_terms:
    - id: GO:0043565
      label: sequence-specific DNA binding
    additional_reference_ids:
    - PMID:2139027
    - PMID:2146742
    - file:yeast/VMA1/VMA1-uniprot.txt
    supported_by:
    - reference_id: PMID:2139027
      supporting_text: N- and C-terminal regions of the deduced sequence (residues 1-284 and 739-1,071)
        are very similar to those of the catalytic subunits of carrot (69 kDa) and Neurospora crassa (67
        kDa) vacuolar membrane H(+)-ATPases
    - reference_id: PMID:2146742
      supporting_text: 'The TFP1 gene of the yeast Saccharomyces cerevisiae encodes two proteins: the
        69-kilodalton (kD) catalytic subunit of the vacuolar proton-translocating adenosine triphosphatase
        (H(+)-ATPase) and a 50-kD protein.'
    - reference_id: file:yeast/VMA1/VMA1-uniprot.txt
      supporting_text: PI-SceI is an endonuclease that can cleave at a site present in a VMA1 allele that
        lacks the derived endonuclease segment of the open reading frame; cleavage at this site only occurs
        during meiosis and initiates 'homing', a genetic event that converts a VMA1 allele lacking VDE
        into one that contains it.
