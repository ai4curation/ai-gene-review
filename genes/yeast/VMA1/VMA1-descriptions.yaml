- source: Alliance_Automated
  text: Enables proton-transporting ATPase activity, rotational mechanism. Involved
    in proton transmembrane transport and vacuolar acidification. Located in fungal-type
    vacuole membrane. Part of vacuolar proton-transporting V-type ATPase, V1 domain.
    Human ortholog(s) of this gene implicated in autosomal recessive cutis laxa type
    IID and developmental and epileptic encephalopathy 93. Orthologous to human ATP6V1A
    (ATPase H+ transporting V1 subunit A).
