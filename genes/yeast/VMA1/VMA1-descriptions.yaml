- source: Alliance_Imported
  text: Subunit A of the V1 peripheral membrane domain of V-ATPase; protein precursor
    undergoes self-catalyzed splicing to yield the extein Tfp1p and the intein Vde
    (PI-SceI), which is a site-specific endonuclease; the V1 peripheral membrane domain
    of the vacuolar H+-ATPase (V-ATPase) has eight subunits; involved in methionine
    restriction extension of chronological lifespan in an autophagy-dependent manner
  source_type: curated
