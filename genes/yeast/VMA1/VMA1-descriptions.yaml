descriptions:
- source: UniProt
  text: Catalytic subunit of the V1 complex of vacuolar(H+)-ATPase (V-ATPase), a multisubunit
    enzyme composed of a peripheral complex (V1) that hydrolyzes ATP and a membrane
    integral complex (V0) that translocates protons (PubMed:18055462, PubMed:2139027).
    V-ATPase is responsible for acidifying and maintaining the pH of intracellular
    compartments (PubMed:18055462, PubMed:2139027). . PI-SceI is an endonuclease that
    can cleave at a site present in a VMA1 allele that lacks the derived endonuclease
    segment of the open reading frame; cleavage at this site only occurs during meiosis
    and initiates 'homing', a genetic event that converts a VMA1 allele lacking VDE
    into one that contains it.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P17255
  source_id: P17255
- source: Alliance_Imported
  text: Subunit A of the V1 peripheral membrane domain of V-ATPase; protein precursor
    undergoes self-catalyzed splicing to yield the extein Tfp1p and the intein Vde
    (PI-SceI), which is a site-specific endonuclease; the V1 peripheral membrane domain
    of the vacuolar H+-ATPase (V-ATPase) has eight subunits; involved in methionine
    restriction extension of chronological lifespan in an autophagy-dependent manner
  source_type: curated
  url: https://www.yeastgenome.org/locus/VMA1
  source_id: SGD:S000002344
- source: Alliance_Automated
  text: Enables proton-transporting ATPase activity, rotational mechanism. Involved
    in proton transmembrane transport and vacuolar acidification. Located in fungal-type
    vacuole membrane. Part of vacuolar proton-transporting V-type ATPase, V1 domain.
    Human ortholog(s) of this gene implicated in autosomal recessive cutis laxa type
    IID and developmental and epileptic encephalopathy 93. Orthologous to human ATP6V1A
    (ATPase H+ transporting V1 subunit A).
  source_type: automated
  url: https://www.yeastgenome.org/locus/VMA1
  source_id: SGD:S000002344
