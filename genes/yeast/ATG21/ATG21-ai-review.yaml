  review:
    summary: Atg21 has direct, non-core mitophagy evidence in S. cerevisiae.
    action: KEEP_AS_NON_CORE
    reason: Keep as non-core. Budding-yeast Atg21 was implicated in a genome-wide mitophagy screen,
      but mitophagy is a cargo-specific Atg21 role rather than the conserved PROPPIN lipid-adaptor
      core. The accessible paper text does not mention Atg21 directly, so this row defers to the
      SGD curator's reading of the genome-wide screen data.
