taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Acts as a component of the CCR4-NOT core complex, which in the nucleus seems
    to be a general transcription factor, and in the cytoplasm the major mRNA deadenylase
    involved in mRNA turnover. The NOT protein subcomplex negatively regulates the
    basal and activated transcription of many genes. Preferentially affects TC-type
    TATA element-dependent transcription. Could directly or indirectly inhibit component(s)
    of the general transcription machinery.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53836
  source_id: P53836
- source: Alliance_Imported
  text: Part of the CCR4-NOT transcriptional regulatory complex; involved in controlling
    mRNA initiation, elongation, and degradation; contains a PH-like domain; CAF120
    has a paralog, SKG3, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAF120
  source_id: SGD:S000005222
- source: Alliance_Automated
  text: Predicted to enable protein kinase activity. Predicted to be involved in signal
    transduction. Located in cellular bud neck.
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAF120
  source_id: SGD:S000005222
