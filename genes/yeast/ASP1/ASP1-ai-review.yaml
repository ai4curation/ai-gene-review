taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: L-asparaginase I of Saccharomyces cerevisiae (EC 3.5.1.1), the constitutively expressed intracellular asparaginase
  that hydrolyses L-asparagine to L-aspartate and ammonium. Asp1 belongs to the asparaginase 1 family and lacks a signal peptide;
  the recombinant enzyme is homo-oligomeric, shows sigmoidal (allosteric) kinetics with a K0.5 in the micromolar range, and
  requires the catalytic residues Thr64, Tyr78, Thr141 and Lys215. Asp1 allows asparagine to be used as a nitrogen source;
  a natural loss-of-function allele in wine strains alters fermentation rate and acetic acid production when asparagine is
  the main nitrogen source. It is distinct from the nitrogen-regulated, secreted cell-wall asparaginase II encoded by the
  ASP3 cluster.
