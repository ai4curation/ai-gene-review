core_functions:
- description: >-
    As the oligomeric core of the mitochondrial import (MIM) complex, Mim1 forms a
    proteinaceous conduit in the mitochondrial outer membrane that binds
    alpha-helical transmembrane anchors of newly synthesised precursor proteins and
    integrates them into the lipid bilayer. Substrates comprise multi-spanning
    alpha-helical outer-membrane proteins, signal-anchored proteins (including the
    TOM receptors Tom20 and Tom70) and a subset of tail-anchored proteins; some are
    handed over from the TOM receptor Tom70 and others are inserted
    Tom70-independently. The cation preference of the reconstituted pore matches
    the positively charged residues that typically flank the transmembrane segments
    of these substrates. The oligomerisation that builds this conduit is driven by
    two GXXXG helix-dimerisation motifs within the transmembrane segment: the
    transmembrane segment alone is the minimal functional unit, and mutating the
    GXXXG motifs abolishes both oligomer formation and activity, which explains the
    otherwise unusual concentration of sequence conservation in the membrane-spanning
    region. Because Tom20 and Tom70 are direct clients, and because MIM couples to
    the SAM machinery during early assembly steps of TOM subunits, biogenesis of the
    entire TOM translocase depends on this activity; the requirement for the
    beta-barrel Tom40 appears to be indirect, mediated through the small Tom proteins
    that Tom40 assembly needs.
