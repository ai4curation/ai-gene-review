id: Q08176
gene_symbol: MIM1
product_type: PROTEIN
aliases:
- TOM13
- YOL026C
- Mitochondrial import protein 1
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  MIM1 (also named TOM13) is a small, 113-residue integral protein of the
  Saccharomyces cerevisiae mitochondrial outer membrane, anchored by a single
  central alpha-helical transmembrane segment with its N-terminal domain facing
  the cytosol and its C-terminal domain facing the intermembrane space. Mim1
  self-associates into an oligomer of roughly 400-450 kDa that, together with one
  to two copies of the small partner protein Mim2, forms the mitochondrial import
  (MIM) complex. The MIM complex is the outer-membrane insertase for precursor
  proteins that are held in the membrane by alpha-helical anchors rather than by a
  beta-barrel, and its substrates span three classes: multi-spanning alpha-helical
  proteins such as Ugo1, signal-anchored (N-terminally anchored) proteins including
  the import receptors Tom20 and Tom70, and a subset of tail-anchored proteins.
  MIM works both downstream of the TOM receptor Tom70, from which it accepts
  precursors, and independently of Tom70 for other single-spanning substrates, and
  it cooperates with the sorting and assembly machinery (SAM) during the late
  maturation of the beta-barrel protein Tom40. Because Tom20, Tom70 and the final
  assembly of Tom40 all depend on it, loss of Mim1 collapses biogenesis of the TOM
  translocase and secondarily compromises general mitochondrial protein import,
  whereas SAM-dependent insertion of porin and the translocation of matrix and
  inner-membrane precursors are not themselves Mim1-dependent. Purified Mim1
  reconstituted into planar lipid bilayers behaves as an aqueous, strongly
  cation-preferring pore that closes at high membrane potentials and whose
  selectivity is attenuated by co-reconstituted Mim2, consistent with the MIM
  complex furnishing a protein-conducting conduit suited to the positively charged
  residues that flank alpha-helical transmembrane segments; no physiological ion
  flux through Mim1 has been demonstrated. Mim1 defines a protein family (Pfam
  TOM13/PF08219, InterPro IPR013262, PANTHER PTHR28241) that is highly conserved
  among fungi, with the conservation concentrated in the transmembrane region.
existing_annotations:
- term:
    id: GO:0140595
    label: MIM complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: >-
      Phylogenetic (PAINT) propagation from node PANTHER:PTN002000670 in the
      MITOCHONDRIAL IMPORT PROTEIN 1 family (PTHR28241) asserting that MIM1
      orthologues are constituents of the MIM complex. The GO:0140595 definition
      (an outer-membrane insertase complex that inserts alpha-helical proteins
      from the cytosol) is exactly what the Mim1-Mim2 assembly is, and MIM1's own
      SGD annotation (SGD:S000005386) appears in the WITH/FROM because the yeast
      protein is one of the experimentally characterised descendants the PAINT
      curator used to place the IBD -- expected grounding, not circularity.
    action: ACCEPT
    reason: >-
      The node placement is sound. Mim1 oligomers are the bulk of the complex
      (PMID:28916712) and the direct Mim1-Mim2 interaction that defines it is
      experimentally established (PMID:22467864). Complex membership is a core
      cellular-component statement for this gene and is independently supported by
      IPI evidence in the same GOA.
    supported_by:
    - reference_id: PMID:28916712
      supporting_text: Mim1 oligomers form the major constituent of the MIM complex
    - reference_id: PMID:22467864
      supporting_text: "Mim2 physically and\ngenetically interacts with Mim1, and both proteins form the MIM complex."
- term:
    id: GO:0045040
    label: protein insertion into mitochondrial outer membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      PAINT propagation from PANTHER:PTN002000670 asserting that the ancestral
      function of the MIM1/TOM13 family is participation in insertion of proteins
      into the mitochondrial outer membrane. This is the correct level of
      specificity: it names the membrane, the direction and the substrate class
      without over-committing to a particular client protein.
    action: ACCEPT
    reason: >-
      The IBD node placement is well supported. The yeast protein has direct
      experimental evidence for this process (PMID:32348752 IDA in the same GOA),
      and the family is functionally homogeneous - MIM1 orthologues throughout the
      fungi are the outer-membrane insertase for alpha-helically anchored
      precursors. There is no evidence of loss or functional divergence in the
      S. cerevisiae lineage that would place it outside the clade that inherited
      the function.
    supported_by:
    - reference_id: PMID:32348752
      supporting_text: "the mitochondrial import (MIM) complex\ninserts precursors of multi-spanning α-helical proteins"
    - reference_id: PMID:22467864
      supporting_text: "Some of the single-span proteins and all known\nmultiple-span proteins are inserted into the membrane in a pathway that depends\non the MOM protein Mitochondrial Import 1 (Mim1)."
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      Automated combined-IEA assignment from InterPro:IPR013262 (OMP_MIM1/TOM13_mt)
      and the UniProt subcellular-location keyword SL-0172. The inference is
      trivially correct here: the family signature is defined on a protein whose
      outer-membrane residence has been demonstrated directly.
    action: ACCEPT
    reason: >-
      Redundant with, but fully consistent with, three independent IDA annotations
      in the same GOA. Protease-protection and alkaline-carbonate extraction of
      isolated mitochondria place Mim1 as an integral protein of the outer membrane
      (PMID:15326197, PMID:15608614). The IEA is at the right level of granularity
      and needs no modification.
    supported_by:
    - reference_id: PMID:15608614
      supporting_text: Thus, Mim1 is an outer-membrane protein.
- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      A purely logical by-product: GOC generated this BP from the MF annotation
      GO:0022832 via an inter-ontology link (the WITH/FROM field is literally
      GO:0022832). GO:0055085 is defined as "the process in which a solute is
      transported across a lipid bilayer, from one side of a membrane to the
      other". No solute transport by Mim1 has ever been demonstrated in vivo; the
      only underlying observation is an in vitro bilayer conductance measurement on
      recombinant protein, and the authors themselves interpret that pore as a
      conduit for precursor polypeptide segments rather than for ions.
    action: REMOVE
    reason: >-
      The term asserts a physiological role (solute translocation across the outer
      membrane) that no evidence supports, and it does so at a level of generality
      that conveys nothing about MIM1. Mim1's genuine transport-related process is
      already captured precisely and with experimental evidence by GO:0045040
      "protein insertion into mitochondrial outer membrane", which is not a
      descendant of GO:0055085 because insertion terminates in the bilayer rather
      than crossing it. Removing this annotation loses no information and prevents
      MIM1 from being retrieved as a solute transporter. Note that the annotation
      will regenerate for as long as GO:0022832 remains on the gene product, so the
      durable fix is at the MF (see the GO:0022832 entry below).
    supported_by:
    - reference_id: PMID:28916712
      supporting_text: We conclude that the Mim1–Mim2 complex forms a channel with cation preference and is thus conducive to the translocation of precursor segments carrying positive charges.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:22467864
  qualifier: enables
  review:
    summary: >-
      IntAct-derived IPI recording the direct Mim1-Mim2 interaction (WITH/FROM
      UniProtKB:Q3E798). The underlying interaction is real, reproducible
      (IntAct NbExp=3) and biologically important - it is the interaction that
      constitutes the MIM complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      "Protein binding" is uninformative as a molecular function: it names no
      activity and, by project convention, is not retained as a functional
      statement. The entire informative content of this annotation - that Mim1
      binds Mim2 and that the two form a complex - is already captured, with the
      same reference, by the GO:0140595 "MIM complex" part_of annotations. Retain
      the interaction record in IntAct/ComplexPortal, but it should not stand as
      MIM1's molecular function; the molecular function that is missing is the
      insertase activity of the complex (see the proposed GO:0032977 entry).
    supported_by:
    - reference_id: PMID:22467864
      supporting_text: "Mim2 physically and\ngenetically interacts with Mim1, and both proteins form the MIM complex."
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IDA
  original_reference_id: PMID:28916712
  qualifier: is_active_in
  review:
    summary: >-
      SGD IDA with the stronger is_active_in qualifier, from the systematic survey
      of yeast outer-membrane channels. The paper isolated outer-membrane vesicles
      from purified mitochondria, and treats Mim1 throughout as an outer-membrane
      protein with a defined topology (cytosolic N-terminus, intermembrane-space
      C-terminus) whose activity belongs to that membrane.
    action: ACCEPT
    reason: >-
      Correct, and the is_active_in qualifier is justified: Mim1's demonstrated
      activities - insertion of alpha-helical precursors and, in reconstitution,
      pore formation - are activities of the outer membrane, not merely activities
      of a protein that happens to reside there. Localisation itself is
      independently established by carbonate extraction and protease protection in
      two other studies.
    supported_by:
    - reference_id: PMID:28916712
      supporting_text: The 13-kD protein Mim1 contains a predicted central α-helical transmembrane segment and exposes its N-terminal domain to the cytosol and its C-terminal domain to the intermembrane space
    - reference_id: PMID:28916712
      supporting_text: Mim1 promotes the biogenesis of several α-helical precursor proteins of the mitochondrial outer membrane by an unknown mechanism
- term:
    id: GO:0022832
    label: voltage-gated channel activity
  evidence_type: IDA
  original_reference_id: PMID:28916712
  qualifier: enables
  review:
    summary: >-
      SGD IDA from a systematic electrophysiological screen of the yeast
      mitochondrial outer membrane. The measurement itself is strong: recombinant
      full-length Mim1, purified from inclusion bodies and reconstituted into
      planar lipid bilayers, gave a reproducible main conductance state of ~580 pS
      that closed at high positive or negative membrane potentials; the activity
      was abolished by Mim1-specific antibodies, reproduced with protein made in a
      second (wheat-germ) expression system, strongly cation selective
      (PK+/PCl- = 23.5:1), and modulated by co-reconstitution of the physiological
      partner Mim2 (PK+/PCl- falling to 11:1). What is at issue is not the
      observation but what molecular function should be ascribed on the basis of
      it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0022832 is not factually wrong, but as MIM1's molecular function it
      over-reads an in vitro biophysical property. Two problems. (i) The
      "voltage-gated" element describes closure of the pore at high absolute
      membrane potential, the generic behaviour shared by every protein-conducting
      channel of this membrane (Tom40, Sam50 and Mdm10 all behave this way in the
      same study), not the operation of a voltage sensor gating a conductance
      pathway for signalling; nothing in the paper claims Mim1 responds to
      physiological changes in outer-membrane potential, and the outer membrane is
      not a potential-bearing membrane. (ii) The physiological cargo is polypeptide,
      not ions. The authors' own conclusion is explicitly that the cation preference
      makes the pore conducive to the translocation of precursor segments carrying
      positive charges, and the article's summary line describes Mim1 as forming a
      channel for protein import. No ion flux through Mim1 in intact mitochondria
      has been shown.
      I deliberately do NOT propose MODIFY to GO:0022843 "voltage-gated monoatomic
      cation channel activity", even though it is the substrate-correct child of the
      measured selectivity, for two reasons. First, moving to the more specific
      child makes the claim stronger in exactly the direction the biology does not
      support: it commits GO to the assertion that MIM1's function is to conduct
      monoatomic cations, whereas the parent term's vagueness at least leaves the
      substrate open. Second, it would make the downstream inter-ontology damage
      worse rather than better - GO:0022832 already spawns the spurious GO:0055085
      "transmembrane transport" BP, and GO:0022843 would spawn a more specific and
      more definitely wrong cation-transport process. KEEP_AS_NON_CORE is also the
      wrong shape: it implies a genuine secondary job, but there is no second
      activity here - the pore that was measured is the same conduit that performs
      the insertase function, viewed through an electrode. MARK_AS_OVER_ANNOTATED
      keeps the experimental record attached to the gene while signalling that this
      is not MIM1's molecular function; the function that belongs in that slot is
      membrane insertase activity (GO:0032977), proposed below.
    supported_by:
    - reference_id: PMID:28916712
      supporting_text: Upon reconstitution into planar lipid bilayers, Mim1 exhibited a characteristic channel activity that was inhibited by Mim1-specific antibodies
    - reference_id: PMID:28916712
      supporting_text: that closed upon application of high positive or negative voltages
    - reference_id: PMID:28916712
      supporting_text: The Mim1 channel was cation selective with a ratio of PK+/PCl− of 23.5:1 based on a positive reversal potential of 53 mV
    - reference_id: PMID:28916712
      supporting_text: We conclude that the Mim1–Mim2 complex forms a channel with cation preference and is thus conducive to the translocation of precursor segments carrying positive charges.
- term:
    id: GO:0045040
    label: protein insertion into mitochondrial outer membrane
  evidence_type: IMP
  original_reference_id: PMID:15608614
  qualifier: involved_in
  review:
    summary: >-
      SGD IMP from the study that named Mim1. Conditional depletion of Mim1
      (GAL10-regulated allele) abrogates assembly of the TOM complex and causes
      Tom40 to accumulate as a low-molecular-mass species; the block is downstream
      of TOB/SAM-mediated insertion of Tom40, and is specific, since biogenesis of
      the TOB/SAM and porin complexes is unaffected.
    action: ACCEPT
    reason: >-
      The term is correct for the gene and is core. One caveat worth recording for
      the curator: as of 2005 the direct evidence in this particular paper concerns
      TOM complex assembly at a step after insertion - the authors state explicitly
      that the Mim1-requiring steps are located after the TOB-complex-dependent
      insertion of Tom40 - so this reference is a weaker support for GO:0045040 than
      for GO:0070096, which SGD also annotated from it. The insertase reading of the
      phenotype was established later, when Mim1 was shown to be required for
      membrane insertion of the signal-anchored receptors Tom20 and Tom70
      (PMID:17974559) and then directly as the MIM translocase (PMID:32348752).
      Since a stronger IDA for the same term from PMID:32348752 is present in the
      same GOA, the term stands; no change is needed.
    supported_by:
    - reference_id: PMID:15608614
      supporting_text: Depletion of Mim1 abrogates assembly of the TOM complex and results in accumulation of Tom40
    - reference_id: PMID:15608614
      supporting_text: The steps in the assembly of the TOM complex requiring Mim1 are located after the TOB-complex-dependent insertion of Tom40 into the outer membrane.
    additional_reference_ids:
    - PMID:17974559
    - PMID:32348752
- term:
    id: GO:0045040
    label: protein insertion into mitochondrial outer membrane
  evidence_type: IDA
  original_reference_id: PMID:32348752
  qualifier: involved_in
  review:
    summary: >-
      ComplexPortal IDA from the study that defined the MIM complex as the main
      translocase for alpha-helical outer-membrane proteins. Beyond the
      multi-spanning substrates already known, this work showed that MIM inserts
      both N-terminally (signal-anchored) and C-terminally (tail-anchored)
      single-spanning precursors, described three dynamic populations of the complex
      (TOM-associated, free, SAM-coupled), and concluded that MIM is a major and
      versatile protein translocase of the outer membrane.
    action: ACCEPT
    reason: >-
      This is the strongest and most direct evidence for the term in the GOA, and
      it is the annotation that best states MIM1's core biological process. The
      term's granularity is right: it names the membrane and the substrate class
      without over-committing to any one client.
    supported_by:
    - reference_id: PMID:32348752
      supporting_text: "We report that the yeast MIM\ncomplex promotes the insertion of proteins with N-terminal (signal-anchored) or\nC-terminal (tail-anchored) membrane anchors."
    - reference_id: PMID:32348752
      supporting_text: "We conclude that the MIM complex\nis a major and versatile protein translocase of the mitochondrial outer\nmembrane."
- term:
    id: GO:0140595
    label: MIM complex
  evidence_type: IPI
  original_reference_id: PMID:22467864
  qualifier: part_of
  review:
    summary: >-
      Direct interaction evidence that Mim1 is a subunit of the MIM complex.
      Two GOA rows carry this assertion from the same reference (ComplexPortal,
      and SGD with WITH/FROM SGD:S000007618 = MIM2); they are collapsed here into a
      single review entry. The complex is a bona fide, stoichiometrically defined
      entity - Mim1 oligomers plus one to two copies of Mim2 - and is registered as
      ComplexPortal CPX-2281.
    action: ACCEPT
    reason: >-
      Well supported and core. This is the annotation that carries the real content
      of the Mim1-Mim2 interaction (and makes the separate GO:0005515 "protein
      binding" annotation redundant). The complex is distinct from both TOM and
      TOB/SAM by size-exclusion chromatography, so the CC assignment is not merely
      a restatement of outer-membrane residence.
    supported_by:
    - reference_id: PMID:22467864
      supporting_text: "Mim2 physically and\ngenetically interacts with Mim1, and both proteins form the MIM complex."
    - reference_id: PMID:28916712
      supporting_text: A second subunit, the 10-kD protein Mim2, possesses the same topology as Mim1 yet is present in the MIM complex in lower abundance (one to two copies per complex; Dimmer et al., 2012).
    - reference_id: PMID:15608614
      supporting_text: Mim1 was present in a high-molecular-mass complex of a molecular size of about 400–450 kDa, which is distinct from that of the TOM and TOB complexes.
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IDA
  original_reference_id: PMID:15608614
  qualifier: located_in
  review:
    summary: >-
      SGD IDA. Mim1 fractionates with mitochondria; it is degraded by low
      concentrations of proteinase K applied to intact mitochondria (while the
      intermembrane-space marker cytochrome b2 is protected, confirming the outer
      membrane was intact), and it resists alkaline carbonate extraction, behaving
      like the integral outer-membrane proteins Tom40 and Tom70. A His-tagged
      allele further showed the N-terminus is cytosolic.
    action: ACCEPT
    reason: >-
      Textbook-quality localisation evidence combining protease accessibility with
      carbonate extraction. One of the best-supported facts about this protein and
      the basis of the UniProt ECO:0000269 subcellular-location assignment.
    supported_by:
    - reference_id: PMID:15608614
      supporting_text: Mim1 was recovered in the membrane fraction like known outer membrane proteins, Tom40 and Tom70
    - reference_id: PMID:15608614
      supporting_text: Hence, the N terminus of the protein is exposed to the cytosol.
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IDA
  original_reference_id: PMID:15326197
  qualifier: located_in
  review:
    summary: >-
      SGD IDA from the independent discovery of the same protein under the name
      Tom13. Protease treatment and alkaline extraction of isolated mitochondria
      carrying a C-terminally tagged allele showed Tom13 to be an integral protein
      of the mitochondrial outer membrane, behaving like Tom70 and Tim23 and unlike
      the peripheral protein Tom38/Sam35.
    action: ACCEPT
    reason: >-
      Independent replication of the outer-membrane localisation by a different
      laboratory using a differently tagged construct. Note only that this study,
      using a C-terminal tag, concluded that the C-terminus is cytosolic, whereas
      the later consensus (from an N-terminally tagged allele and from subsequent
      topology work) places the N-terminus in the cytosol and the C-terminus in the
      intermembrane space. The topology discrepancy does not affect the
      outer-membrane assignment, which both studies agree on.
    supported_by:
    - reference_id: PMID:15326197
      supporting_text: Tom13 was, like integral membrane proteins Tom70 and Tim23, not extracted by alkaline treatment of mitochondria, but was solubilized by treatment of mitochondria with Triton X-100
    - reference_id: PMID:15326197
      supporting_text: These results indicate that Tom13 and Tom38 are an integral membrane protein and a peripheral membrane protein, respectively, of the mitochondrial outer membrane
- term:
    id: GO:0070096
    label: mitochondrial outer membrane translocase complex assembly
  evidence_type: IMP
  original_reference_id: PMID:15608614
  qualifier: involved_in
  review:
    summary: >-
      SGD IMP. Depletion of Mim1 causes a massive deficiency of assembled TOM
      complex, with Tom40 stalled as a low-molecular-mass species; the defect is in
      assembly rather than stability, and it is downstream of TOB/SAM-mediated
      insertion of the Tom40 beta-barrel. The specificity of the phenotype is
      established by the fact that the TOB/SAM and porin complexes assemble
      normally without Mim1.
    action: ACCEPT
    reason: >-
      This is the phenotype through which the gene was characterised, and the term
      is exactly right for it. The evidence is loss-of-function with an appropriate
      specificity control, so it is not an artefact of a general import collapse.
      Core biological process: TOM biogenesis is the largest in vivo consequence of
      MIM1's insertase activity, since Tom20 and Tom70 are direct MIM substrates.
      One mechanistic caveat that post-dates this paper: the requirement for the
      beta-barrel Tom40 is now understood to be indirect - Mim1 does not act on
      Tom40 itself but on the small Tom proteins that Tom40 assembly needs
      (reviewed in PMID:21825073, citing Becker et al., 2010). This does not affect
      the term or the action, since GO:0070096 is about involvement in assembling
      the complex and Mim1's involvement is not in doubt; it only means the Tom40
      arm of the phenotype should not be read as direct beta-barrel handling.
    supported_by:
    - reference_id: PMID:15608614
      supporting_text: Our data show that a primary function of Mim1 is to facilitate assembly of the TOM complex.
    - reference_id: PMID:15608614
      supporting_text: The biogenesis of other outer membrane complexes containing β-barrel proteins, such as TOB/SAM and porin complexes, was not affected by the lack of Mim1.
    - reference_id: PMID:21825073
      supporting_text: a recent study showed that Mim1 does not directly promote the biogenesis of Tom40 but functions via the import of small Tom proteins that are needed for Tom40 assembly (Becker et al., 2010)
- term:
    id: GO:0070096
    label: mitochondrial outer membrane translocase complex assembly
  evidence_type: IMP
  original_reference_id: PMID:17974559
  qualifier: involved_in
  review:
    summary: >-
      SGD IMP from the study that resolved which TOM subunits depend on Mim1. Mim1
      is required for efficient membrane insertion and assembly of the
      signal-anchored receptors Tom20 and Tom70 but not of the tail-anchored Tom22,
      and Mim1 associates with SAM(core) components in a large SAM complex, which
      accounts for its role in the late steps of Tom40 assembly. Disruption reduces
      TOM complex levels while leaving the respiratory chain intact.
    action: ACCEPT
    reason: >-
      Independent IMP for the same process from a second laboratory, and the most
      mechanistically informative of the two: it converts a generic "TOM assembly"
      defect into a substrate-resolved statement (Tom20 and Tom70 yes, Tom22 no)
      and connects Mim1 to SAM. The substrate selectivity is itself the strongest
      argument that the underlying activity is insertion of alpha-helical anchors
      rather than a general chaperoning of TOM.
    supported_by:
    - reference_id: PMID:17974559
      supporting_text: "We report that Mim1 is required\nfor efficient membrane insertion and assembly of Tom20 and Tom70, but not Tom22."
    - reference_id: PMID:17974559
      supporting_text: "We show that Mim1 associates with SAM(core) components to a large SAM complex,\nexplaining its role in late steps of the assembly pathway of Tom40."
    - reference_id: PMID:18177669
      supporting_text: "Here we show that Mim1 is required for the integration of\nthe import receptor Tom20 into the outer membrane."
    - reference_id: PMID:18187149
      supporting_text: "Mutations in the transmembrane segment that destabilize Tom20, or deletion of\nMim1, prevent Tom20 from functioning as a receptor for protein import into\nmitochondria."
    additional_reference_ids:
    - PMID:18177669
    - PMID:18187149
- term:
    id: GO:0032977
    label: membrane insertase activity
  evidence_type: IDA
  original_reference_id: PMID:32348752
  qualifier: contributes_to
  review:
    summary: >-
      Proposed new annotation, not present in the GOA. GO:0032977 is defined as
      binding transmembrane domain-containing proteins and mediating their
      integration into a membrane - a precise description of what the Mim1-Mim2
      complex does. MIM binds and inserts multi-spanning alpha-helical precursors,
      signal-anchored precursors (Tom20, Tom70) and a subset of tail-anchored
      precursors into the mitochondrial outer membrane, accepting some of them from
      the TOM receptor Tom70.
    action: NEW
    reason: >-
      Both halves of the GO:0032977 definition are now directly evidenced rather
      than inferred: PMID:21825073 shows that multispanning precursor proteins
      interact with Mim1 directly (the binding half) and that the Mim1 complex
      promotes their insertion and assembly into the outer membrane (the
      integration half).

      MIM1 currently has no molecular function annotation that describes what the
      protein does. Its only two MF annotations are GO:0005515 "protein binding"
      (uninformative) and GO:0022832 "voltage-gated channel activity" (an in vitro
      biophysical property that misstates the physiological cargo). This leaves a
      gene whose biological process and cellular component are precisely curated
      but whose activity is invisible to any MF-based query. The qualifier is
      contributes_to rather than enables because insertase activity is delivered by
      the Mim1-Mim2 heterocomplex; Mim1 is the major constituent and the
      pore-forming subunit, but Mim2 is required in vivo for the biogenesis of MIM
      substrates and it demonstrably modifies the conduction properties of the
      pore, so the activity is properly assigned at the complex level with Mim1
      contributing to it.
    supported_by:
    - reference_id: PMID:32348752
      supporting_text: "We report that the yeast MIM\ncomplex promotes the insertion of proteins with N-terminal (signal-anchored) or\nC-terminal (tail-anchored) membrane anchors."
    - reference_id: PMID:32348752
      supporting_text: "the mitochondrial import (MIM) complex\ninserts precursors of multi-spanning α-helical proteins"
    - reference_id: PMID:22467864
      supporting_text: "Some of the single-span proteins and all known\nmultiple-span proteins are inserted into the membrane in a pathway that depends\non the MOM protein Mitochondrial Import 1 (Mim1)."
    - reference_id: PMID:17974559
      supporting_text: "We report that Mim1 is required\nfor efficient membrane insertion and assembly of Tom20 and Tom70, but not Tom22."
    - reference_id: PMID:21825073
