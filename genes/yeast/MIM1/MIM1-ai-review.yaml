- term:
    id: GO:0034389
    label: lipid droplet organization
  evidence_type: IMP
  original_reference_id: PMID:41748941
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation, not present in the GOA - the reporting study is from
      2026. The MIM complex is reported to have a second function unrelated to
      protein insertion: the lipid metabolism enzyme Ayr1 captures MIM and thereby
      nucleates mitochondria-lipid droplet contact sites, and lipid droplet number
      in cells depends on both MIM and Ayr1. Mechanistically the capture is
      substrate mimicry - Ayr1 engages MIM through a single hydrophobic segment as
      a precursor would, but is never released - so the second function is a
      subverted insertase reaction rather than a separate activity, and it is
      carried by a distinct MIM-Ayr1 population rather than by the same complexes
      that insert precursors.
    action: NEW
    reason: >-
      GO:0034389 is the closest existing term that can carry this: the paper reports
      a cellular-level effect on lipid droplet number, which is within "the
      assembly, arrangement of constituent parts, or disassembly of a lipid
      particle". It is deliberately the general process term rather than anything
      contact-site specific, because GO has no mitochondrion-lipid droplet contact
      site term - GO:0160259 exists for the ER-lipid droplet apposition and
      GO:0044233 for ER-mitochondrion, but the mitochondrion-lipid droplet
      combination is absent. Two terms are proposed in proposed_new_terms to fill
      that gap; until they exist, this annotation records the biology at the only
      granularity the ontology currently supports.
      Flagged as provisional for two reasons a curator should weigh. First, this is
      a single 2026 study with no independent replication, and the cached record is
      abstract-only, so the underlying experiments have not been examined here.
      Second, the qualifier is involved_in rather than anything stronger because the
      activity belongs to the MIM-Ayr1 assembly; whether Mim1 or Ayr1 is the
      determining partner is not resolved by the abstract. If a curator prefers to
      wait for replication before annotating, the reference and findings are
      recorded either way.
    supported_by:
    - reference_id: PMID:41748941
      supporting_text: "Here we report that the MIM complex performs a second major function in\nlipid-droplet homeostasis."
    - reference_id: PMID:41748941
      supporting_text: "MIM and Ayr1 enhance the lipid droplet\nnumber in cells."
    - reference_id: PMID:41748941
      supporting_text: "The lipid metabolism\nenzyme Ayr1 captures the MIM complex, promoting the formation of\nmitochondria-lipid droplet contact sites."
    - reference_id: PMID:41748941
      supporting_text: "Ayr1 binds to MIM via its single hydrophobic segment in a\nsubstrate-mimicry mechanism but remains bound and is not released into the outer\nmembrane."
