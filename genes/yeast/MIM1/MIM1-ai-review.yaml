- term:
    id: GO:0070096
    label: mitochondrial outer membrane translocase complex assembly
  evidence_type: IMP
  original_reference_id: PMID:15608614
  qualifier: involved_in
  review:
    summary: >-
      SGD IMP. Depletion of Mim1 causes a massive deficiency of assembled TOM
      complex, with Tom40 stalled as a low-molecular-mass species; the defect is in
      assembly rather than stability, and it is downstream of TOB/SAM-mediated
      insertion of the Tom40 beta-barrel. The specificity of the phenotype is
      established by the fact that the TOB/SAM and porin complexes assemble
      normally without Mim1.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is the phenotype through which the gene was characterised, and the
      loss-of-function evidence is sound, with an appropriate specificity control so
      it is not an artefact of a general import collapse. What has changed is its
      status as a core process rather than its validity as an observation.
      There is an open GO obsoletion request against this term
      (geneontology/go-ontology#32108, opened May 2026, 21 EXP annotations
      affected; MIM1's two IMPs are almost certainly among them). Its rationale,
      from the parent reorganization issue #31711, is that "Assembly of TOM isn't
      a separate assembly process, assembly is only affected by import pathways so
      the correct way to annotate this would be to add TOM subunits as targets of
      the appropriate import pathways."
      That argument is the same one this review reached independently from the
      primary literature: the TOM-assembly phenotype is a downstream consequence of
      the insertase acting on Tom20 and Tom70, and the Tom40 arm of it is indirect
      besides. Demoted from core accordingly.
      KEEP_AS_NON_CORE rather than REMOVE or MODIFY, deliberately: the term is
      still live and non-obsolete in the current release, the underlying
      loss-of-function evidence is sound, and the obsoletion request is open rather
      than decided. Pre-empting a GO decision that has not been taken would be
      worse than recording the position. If #32108 is accepted, the destination is
      GO:7770059 with the affected TOM subunits carried as targets/has_input
      rather than a re-term to another assembly term.

      One mechanistic caveat that post-dates this paper: the requirement for the
      beta-barrel Tom40 is now understood to be indirect - Mim1 does not act on
      Tom40 itself but on the small Tom proteins that Tom40 assembly needs
      (reviewed in PMID:21825073, citing Becker et al., 2010). PMID:18187149 reached
      the same conclusion independently and earlier by a different route: mim1-delta
      mitochondria import less Tom40 because they contain less functional Tom20, yet
      the Tom40 that arrives progresses normally through both assembly intermediates.
      That specific observation is in tension with this paper, which reported the
      second intermediate reduced on depletion; the disagreement is about how much of
      the Tom40 defect is import versus assembly, not about whether Mim1 is required
      for TOM biogenesis. This does not affect
      the term or the action, since GO:0070096 is about involvement in assembling
      the complex and Mim1's involvement is not in doubt; it only means the Tom40
      arm of the phenotype should not be read as direct beta-barrel handling.
    supported_by:
    - reference_id: PMID:15608614
      supporting_text: Our data show that a primary function of Mim1 is to facilitate assembly of the TOM complex.
    - reference_id: PMID:15608614
      supporting_text: The biogenesis of other outer membrane complexes containing β-barrel proteins, such as TOB/SAM and porin complexes, was not affected by the lack of Mim1.
    - reference_id: PMID:21825073
      supporting_text: a recent study showed that Mim1 does not directly promote the biogenesis of Tom40 but functions via the import of small Tom proteins that are needed for Tom40 assembly (Becker et al., 2010)
    - reference_id: PMID:18187149
      supporting_text: but does not diminish the overall rate of Tom40 assembly
    - reference_id: PMID:18187149
      supporting_text: "This is consistent with the known role of Tom20 as a receptor for Tom40 import:"
