- description: >-
    A second, provisional function reported in 2026 and not yet independently
    replicated: the MIM complex also acts as a mitochondrial anchor for lipid
    droplets. The lipid metabolism enzyme Ayr1 engages MIM through a single
    hydrophobic segment, exactly as an insertase substrate would, but is not
    released into the membrane; the trapped MIM-Ayr1 assembly then nucleates
    mitochondria-lipid droplet contact sites, and cellular lipid droplet number
    depends on both partners. The two roles are carried by separate populations of
    the complex - MIM-Ayr1 for lipid droplet recruitment, MIM-preprotein for
    insertion - so this is a captured insertase rather than a second catalytic
    activity of Mim1. Recorded here because the primary study frames it as a major
    function of the complex, but it should be read as provisional: one paper,
    abstract-only in this cache, and no molecular function or cellular component
    term yet exists for a mitochondrion-lipid droplet tether or contact site.
