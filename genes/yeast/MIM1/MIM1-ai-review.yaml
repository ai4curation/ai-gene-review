  knowledge_gaps:
  - gap_statement: >-
      No ontology term can express what MIM does at the lipid droplet. GO has
      GO:0160259 for the ER-lipid droplet contact site and GO:0170007 for the
      corresponding tether activity, and GO:0044233 for the ER-mitochondrion
      apposition, but nothing for the mitochondrion-lipid droplet combination. The
      function can currently only be recorded at the generic GO:0034389 "lipid
      droplet organization" level, which loses both the structure and the mechanism.
    boundary: >-
      What is established is that Ayr1 captures MIM via substrate mimicry without
      being released, that the resulting assembly promotes mitochondria-lipid
      droplet contact sites, and that lipid droplet number depends on MIM and Ayr1.
      The gap is in the ontology, not in the biology of the contact site itself.
    gap_kind:
    - ONTOLOGY
    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      Mitochondria-lipid droplet contacts are an active area in both yeast and
      mammalian metabolism, so the missing terms will be needed for more than this
      one gene.
    resolution: >-
      Request the two terms proposed in this review's proposed_new_terms:
      "mitochondrion-lipid droplet membrane contact site" (child of GO:0044232) and
      "mitochondrion-lipid droplet tether activity" (child of GO:0043495).
    provenance:
    - reference_id: PMID:41748941
      supporting_text: "The lipid metabolism\nenzyme Ayr1 captures the MIM complex, promoting the formation of\nmitochondria-lipid droplet contact sites."
  - gap_statement: >-
      Which partner supplies the lipid droplet-facing determinant of the tether is
      undetermined, so it is not established whether Mim1 enables the tethering
      activity or merely contributes the mitochondrial anchor while Ayr1 does the
      recognising.
    boundary: >-
      The interaction surface on the MIM side is characterised - Ayr1's single
      hydrophobic segment engages the precursor-binding site - but the lipid
      droplet side of the bridge is not.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      Determines whether any future tether-activity annotation belongs on MIM1, on
      AYR1, or on both with contributes_to.
    provenance:
    - reference_id: PMID:41748941
      supporting_text: "Ayr1 binds to MIM via its single hydrophobic segment in a\nsubstrate-mimicry mechanism but remains bound and is not released into the outer\nmembrane."
proposed_new_terms:
- proposed_name: protein-conducting channel activity
  proposed_definition: >-
    Enables the passage of a polypeptide chain, or of a transmembrane segment of a
    polypeptide chain, through a transmembrane aqueous pore. Channels of this class
    exhibit measurable single-channel conductance, ion selectivity and
    voltage-dependent closure when reconstituted into artificial bilayers, but
    their physiological permeant is protein rather than a solute; the ion
    conductance is a property of the unoccupied pore.
  justification: >-
    GO currently offers no molecular function term for the pore character of a
    protein translocase. Curators who wish to record the electrophysiology of a
    reconstituted translocase - which has been measured for Tom40, Sam50, Mdm10 and
    Mim1, and for translocation channels in other membranes - have only ion-channel
    terms available, and the resulting annotations assert a solute-transport
    function the proteins do not have and, through inter-ontology links, propagate
    that error into the biological process ontology. MIM1 is a concrete case:
    GO:0022832 on MIM1 generates a spurious GO:0055085 "transmembrane transport".
    A dedicated term would let the observation be curated faithfully while keeping
    the substrate honest, and would sit naturally alongside GO:0032977 "membrane
    insertase activity" and GO:0008320 "transmembrane protein transporter activity"
    as the pore-level counterpart of those activities.
  proposed_parent:
    id: GO:0015267
    label: channel activity
  supported_by:
  - reference_id: PMID:28916712
    supporting_text: The mitochondrial import component Mim1 forms a channel
  - reference_id: PMID:28916712
    supporting_text: We conclude that the Mim1–Mim2 complex forms a channel with cation preference and is thus conducive to the translocation of precursor segments carrying positive charges.
- proposed_name: mitochondrion-lipid droplet membrane contact site
  proposed_definition: >-
    A membrane contact site between the mitochondrial outer membrane and the lipid
    droplet monolayer, structured by a bridging complex.
  justification: >-
    GO already carries GO:0160259 "endoplasmic reticulum membrane-lipid droplet
    contact site" and GO:0044233 for the ER-mitochondrion apposition, but has no
    term for the mitochondrion-lipid droplet contact site. PMID:41748941 reports
    that the MIM complex, captured by Ayr1, nucleates exactly this structure in
    yeast, and mitochondria-lipid droplet contacts are also well described in
    mammalian tissue. Without the term the localisation of MIM's second function
    cannot be recorded at all. Proposed alongside a tether molecular function, by
    analogy with the GO:0160259 / GO:0170007 pair that already exists for the ER
    case.
  proposed_parent:
    id: GO:0044232
    label: organelle membrane contact site
  supported_by:
  - reference_id: PMID:41748941
    supporting_text: "The lipid metabolism\nenzyme Ayr1 captures the MIM complex, promoting the formation of\nmitochondria-lipid droplet contact sites."
- proposed_name: mitochondrion-lipid droplet tether activity
  proposed_definition: >-
    The binding activity of a molecule that brings together a lipid droplet with the
    mitochondrial outer membrane to establish a membrane contact site.
  justification: >-
    The molecular-function counterpart of the contact-site term above, mirroring the
    existing GO:0170007 "endoplasmic reticulum-lipid droplet tether activity". The
    MIM-Ayr1 assembly performs this role in yeast per PMID:41748941. Proposed with
    lower confidence than the cellular-component term: the tether is the MIM-Ayr1
    assembly rather than Mim1 alone, and on the reported mechanism it is Ayr1 that
    supplies the lipid droplet-facing determinant while MIM supplies the
    mitochondrial anchor, so which partner "enables" the tether activity is not
    settled by the abstract alone.
  proposed_parent:
    id: GO:0043495
    label: protein-membrane adaptor activity
  supported_by:
  - reference_id: PMID:41748941
    supporting_text: "The functional diversity is mediated by different MIM complexes:\nMIM-Ayr1 for recruiting lipid droplets and MIM-preprotein for protein insertion\ninto the outer membrane."
suggested_questions:
- question: >-
    Do the three soluble-domain findings actually conflict? PMID:18177669 found the
    N- and C-terminal domains dispensable for growth and TOM assembly, while
    PMID:19345216 assigned the N-terminal domain a discrete role in regulating the
    SAM-mediated early reaction of Tom40 assembly. Is this a quantitative
    contribution visible to an in vitro kinetic assay but invisible to an in vivo
    complementation assay, or a genuine disagreement?
  experts:
  - Rapaport D
  - Lithgow T
- question: >-
    Is the MIM-Ayr1 lipid droplet function conserved, and is it really a second
    function of the same machine rather than a moonlighting role of Ayr1 that
    happens to use MIM as an anchor? Note that Ayr1 was independently identified as
    an NADPH-regulated outer-membrane channel in the same screen that found the Mim1
    channel (PMID:28916712) - is the channel activity of either protein related to
    the contact-site role?
  experts:
  - Becker T
  - Pfanner N
  - Bohnert M
- question: >-
    If Ayr1 occupies the precursor-binding site without being released, does the
    MIM-Ayr1 population compete with protein insertion? Does lipid droplet load or
    lipid status modulate outer-membrane protein biogenesis through this
    competition?
  experts:
  - Becker T
  - den Brave F
- question: >-
    Is the reconstituted Mim1 conductance a physiologically meaningful ion pathway
    in the intact outer membrane, or is it strictly the unoccupied state of a
    protein-conducting conduit? Does loss of MIM1 change outer-membrane
    permeability to ions in vivo?
  experts:
  - Kruger V
  - Wagner R
  - Meisinger C
- question: >-
    The reported size of the Mim1-containing complex differs by method: ~180 kDa by
    glycerol gradient, ~300 kDa by BN-PAGE, 400-450 kDa by gel filtration, plus a
    separate report of association with SAM(core). PMID:18187149 notes the Mim1
    complex needs more digitonin to solubilise than TOM does. Do these correspond to the three dynamic MIM populations later
    described (free MIM, TOM-coupled MIM, SAM-coupled MIM), or to differences in
    detergent, tagging and chromatographic method?
  experts:
  - Rapaport D
  - Becker T
  - Endo T
- question: >-
    If the transmembrane segment of Mim1 is the minimal functional domain and the
    N- and C-terminal domains are dispensable for both function and biogenesis,
    what do those soluble domains actually do? Their poor conservation across fungi
    contrasts sharply with the near-invariant transmembrane region, yet they are
    retained in every orthologue.
  experts:
  - Rapaport D
  - Popov-Celeketic J
- question: >-
    How do the two GXXXG motifs build a functional conduit? Do they generate a
    defined oligomer with a fixed subunit count and a lipid-lined or
    protein-lined pore, and is the ~580 pS conductance a property of that same
    oligomer? Where does Mim2 sit relative to the GXXXG interfaces?
  experts:
  - Rapaport D
  - Wagner R
  - Becker T
- question: >-
    How does the MIM complex recognise an alpha-helical transmembrane anchor, and
    what distinguishes a MIM-dependent tail-anchored substrate from a
    MIM-independent one such as Tom22?
  experts:
  - Doan KN
  - Becker T
  - Rapaport D
- question: >-
    The Tom40 requirement is now agreed to be indirect, but two different indirect
    routes have been proposed and they are not the same: PMID:18187149 attributes it
    to reduced functional Tom20 lowering Tom40 import, while PMID:20026336 and
    PMID:21825073 attribute it to Mim1-dependent insertion of the small Tom proteins
    that Tom40 assembly needs. Do both contribute, and in what proportion? A related
    loose end is that PMID:18187149 found Tom40 assembly rate undiminished in
    mim1-delta whereas PMID:15608614 found the second assembly intermediate reduced
    on depletion.
  experts:
  - Pfanner N
  - Wiedemann N
  - Becker T
  - Lithgow T
- question: >-
    The non-homologous counterparts are now identified - pATOM36 in trypanosomes and
    MTCH1/MTCH2 in mammals, with pATOM36 and Mim1/Mim2 reciprocally interchangeable.
    Do any of them share the pore-forming, cation-preferring architecture measured
    for Mim1, or is a proteinaceous conduit only one of several ways to solve
    alpha-helical insertion? No plant counterpart has yet been named.
  experts:
  - Rapaport D
  - Schneider A
  - Wagner R
suggested_experiments:
- description: >-
    Resolve the soluble-domain disagreement directly by applying both readouts to
    the same allele set: take the Mim1(deltaN), Mim1(deltaC) and Mim1(TM) variants
    and assay them side by side with the in vivo complementation and steady-state
    readouts of PMID:18177669 and the in vitro multi-step Tom40 assembly kinetics of
    PMID:19345216, in one genetic background.
  hypothesis: >-
    The N-terminal domain makes a quantitative contribution to the rate of the
    SAM-mediated early reaction that is fully compensated in vivo, so both published
    results are correct at their own resolution.
- description: >-
    Test whether the MIM-Ayr1 and MIM-preprotein populations compete. Titrate Ayr1
    levels and measure insertion of a panel of MIM substrates (a multi-span such as
    Ugo1, a signal-anchored such as Tom20, a tail-anchored client), and conversely
    ask whether precursor overload displaces Ayr1 and reduces mitochondria-lipid
    droplet contacts.
  hypothesis: >-
    Because Ayr1 occupies the precursor-binding site by substrate mimicry, the two
    functions draw on one pool of complexes and are reciprocally limiting.
- description: >-
    Ask whether the reconstituted Mim1 channel conductance is altered by bound Ayr1,
    using the planar-bilayer setup of PMID:28916712 with co-reconstituted Ayr1
    instead of Mim2.
  hypothesis: >-
    If Ayr1 occupies the conduit as a non-released pseudo-substrate, it should
    occlude or substantially alter the 580 pS conductance, which would also test
    whether the measured pore is the physiological precursor path.
- hypothesis: >-
    The Mim1 conductance measured in reconstitution is the empty state of a
    protein-translocation conduit and makes no contribution to outer-membrane ion
    permeability in vivo.
  description: >-
    Measure outer-membrane ion permeability directly in mitochondria and
    outer-membrane vesicles from mim1-delta and wild-type cells, in a por1-delta
    background so that the dominant VDAC conductance does not mask the signal, and
    compare with the conductance predicted from Mim1 copy number.
  experiment_type: electrophysiology
- hypothesis: >-
    The pore whose conductance was measured is the physical path taken by a
    translocating precursor, so an arrested substrate should occlude it.
  description: >-
    Trap a precursor in transit - for example a Ugo1 or Tom20 fusion arrested by a
    tightly folded C-terminal domain or by a bound ligand - and test whether the
    arrested substrate blocks the Mim1 conductance in reconstituted planar bilayers.
  experiment_type: single-channel electrophysiology with substrate trapping
- hypothesis: >-
    The Mim1-Mim2 complex admits transmembrane helices through a defined lumen or
    lipid-facing groove whose architecture can be resolved.
  description: >-
    Determine the structure of the detergent- or nanodisc-solubilised Mim1-Mim2
    complex, ideally with a trapped substrate, by cryo-EM, settling the oligomeric
    state of Mim1, the stoichiometry of Mim2, and whether insertion proceeds through
    a continuous aqueous pore or a lipid-thinning site.
  experiment_type: cryo-EM structure determination
- hypothesis: >-
    A substrate transmembrane segment contacts Mim1 and Mim2 in a defined order
    during insertion.
  description: >-
    Use site-specific photo-crosslinking with unnatural amino acids placed along the
    transmembrane segment of a signal-anchored substrate to map the sequence of Mim1
    and Mim2 contacts during in organello insertion.
  experiment_type: site-specific photo-crosslinking
- hypothesis: >-
    The three reported MIM populations (TOM-coupled, free, SAM-coupled) are
    functionally specialised for different substrate classes.
  description: >-
    Separate the populations by affinity purification via Tom70, via SAM(core) and
    via free Mim1, and assay each preparation in vitro for insertion of a
    signal-anchored, a tail-anchored and a multi-spanning substrate.
  experiment_type: affinity purification with in vitro insertion assay
- hypothesis: >-
    The Mim1-Mim2 complex is sufficient, without other mitochondrial components, to
    insert an alpha-helical precursor into a membrane.
  description: >-
    Reconstitute purified Mim1-Mim2 into proteoliposomes and assay insertion of a
    radiolabelled alpha-helical precursor by carbonate resistance and protease
    protection, providing the direct in vitro basis for a GO:0032977 membrane
    insertase annotation with an enables rather than contributes_to qualifier.
  experiment_type: reconstitution into proteoliposomes
- hypothesis: >-
    Positive charges flanking a transmembrane segment are what make a precursor
    MIM-dependent, matching the cation preference of the pore.
  description: >-
    Swap the positively charged flanking residues of a MIM-dependent substrate for
    negatively charged ones (and the converse for a MIM-independent substrate such
    as Tom22) and measure insertion efficiency in vivo and in organello in wild-type
    and mim1-delta mitochondria.
  experiment_type: charge-swap mutagenesis with import assay
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT phylogenetic inference placing MIM complex membership and outer-membrane
      protein insertion at node PANTHER:PTN002000670 of the MITOCHONDRIAL IMPORT
      PROTEIN 1 family (PTHR28241). S. cerevisiae MIM1 (SGD:S000005386) appears in
      the WITH/FROM field because its own experimental annotations are among the
      descendant evidences used to place the IBD.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Standard GO_REF for IBA annotations. The two IBAs it supports here
      (GO:0140595, GO:0045040) are both independently corroborated by experimental
      annotations on the yeast gene itself, so the node placement can be checked
      against direct evidence and holds.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology
    links
  findings:
  - statement: >-
      Inter-ontology logical inference generating GO:0055085 "transmembrane
      transport" from the molecular function GO:0022832 (the WITH/FROM field is
      literally GO:0022832). The inference is mechanically valid but inherits the
      substrate imprecision of the source MF annotation.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The GO_REF itself is correctly applied; the problem lies with the source
      annotation it operates on, not with the inference method. Recorded here so
      that the REMOVE recommendation on GO:0055085 is not read as a criticism of
      the pipeline.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Automated cellular-component assignment of GO:0005741 from
      InterPro:IPR013262 (OMP_MIM1/TOM13_mt) and UniProtKB-SubCell:SL-0172. Fully
      concordant with three independent IDA annotations on the same gene.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correct, though redundant with direct experimental evidence for the same term.
- id: PMID:15326197
  title: Two novel proteins in the mitochondrial outer membrane mediate beta-barrel
    protein assembly.
  findings:
  - statement: >-
      YOL026C, named Tom13 in this study, encodes an integral protein of the
      mitochondrial outer membrane, identified in a survey of essential yeast genes
      of unknown function.
    supporting_text: Tom13, the gene product of YOL026C
    reference_section_type: RESULTS
  - statement: >-
      Protease treatment and alkaline carbonate extraction of isolated mitochondria
      show Tom13 to be an integral outer-membrane protein, behaving like Tom70 and
      Tim23 and unlike the peripheral protein Tom38/Sam35.
    supporting_text: Tom13 was, like integral membrane proteins Tom70 and Tim23, not extracted by alkaline treatment of mitochondria, but was solubilized by treatment of mitochondria with Triton X-100
    reference_section_type: RESULTS
  - statement: >-
      Depletion of Tom13 markedly retards assembly of newly imported Tom40 into the
      mature TOM40 complex, while earlier assembly intermediates still form.
    supporting_text: When we incubated Tom40 with Tom13↓ mitochondria, its assembly into the final TOM40 complex was markedly retarded
    reference_section_type: RESULTS
  - statement: >-
      The defect is specific to Tom40: import and insertion of the other beta-barrel
      protein porin is unaffected by Tom13 depletion, although it is impaired by
      depletion of Tom38/Sam35. This distinguishes Tom13/Mim1 from a general
      beta-barrel assembly factor.
    supporting_text: import of porin into mitochondria was substantially impaired in Tom38↓ mitochondria, but not in Tom13↓ mitochondria
    reference_section_type: RESULTS
  - statement: >-
      Depletion of Tom13 does not impair translocation of matrix or inner-membrane
      precursors in vitro, showing that the phenotype is not a general collapse of
      mitochondrial import.
    supporting_text: The import rates of the precursor of mtHsp60 (Fig. 3 A) and of AAC (Fig. 3 B) were not affected by depletion of Tom13 or Tom38 at all.
    reference_section_type: RESULTS
  - statement: >-
      Using C-terminally tagged Tom13-HA, the authors concluded that the protein
      exposes its COOH terminus to the cytosol. This specific topological inference
      did not survive: three later studies place the C-terminus in the
      intermembrane space and the N-terminus in the cytosol.
    supporting_text: These results indicate that Tom13 and Tom38 are an integral membrane protein and a peripheral membrane protein, respectively, of the mitochondrial outer membrane and expose at least their COOH termini to the cytosol
    reference_section_type: RESULTS
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:18177669
      - PMID:19345216
      - PMID:28916712
      review_notes: >-
        Overturned, with a mechanistic explanation for the original error:
        PMID:15608614 reports that a C-terminally tagged Mim1 had compromised
        function, so the tag used here perturbed the very topology it was reporting.
        PMID:18177669 and PMID:19345216 independently establish cytosolic-N /
        intermembrane-space-C using N-terminal tags and protease protection. Do not
        curate topology from this reference; its outer-membrane localisation finding
        is unaffected and remains the basis of the GO:0005741 IDA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Correctly cited for the GO:0005741 IDA
      annotation. Note one point on which the field later diverged from this paper:
      using a C-terminally tagged allele the authors concluded that Tom13 exposes
      its COOH terminus to the cytosol, whereas subsequent work with an
      N-terminally tagged allele (PMID:15608614) and later topology studies place
      the N-terminus in the cytosol and the C-terminus in the intermembrane space.
      The discrepancy is now resolved in favour of the latter: PMID:18177669 states
      the cytosolic-N / intermembrane-space-C topology directly, and PMID:15608614
      reports that a C-terminally tagged Mim1 "had compromised function", which
      explains why a C-terminal tag gave the anomalous result here. Recorded as a
      caveat on this one inference only; it does not affect the outer-membrane
      localisation the paper is cited for, which is independently confirmed.
- id: PMID:15608614
  title: Mim1, a protein required for the assembly of the TOM complex of mitochondria.
  findings:
  - statement: >-
      Mim1 is an integral protein of the mitochondrial outer membrane: it is
      degraded by low proteinase K concentrations applied to intact mitochondria
      (with the intermembrane-space marker cytochrome b2 protected) and resists
      alkaline carbonate extraction.
    supporting_text: Thus, Mim1 is an outer-membrane protein.
    reference_section_type: RESULTS
  - statement: >-
      Carbonate extraction places Mim1 in the membrane fraction alongside the known
      integral outer-membrane proteins Tom40 and Tom70.
    supporting_text: Mim1 was recovered in the membrane fraction like known outer membrane proteins, Tom40 and Tom70
    reference_section_type: RESULTS
  - statement: >-
      An N-terminally His-tagged allele, which supports wild-type growth, loses
      anti-His immunoreactivity on protease shaving of intact mitochondria,
      establishing that the N-terminus faces the cytosol.
    supporting_text: Hence, the N terminus of the protein is exposed to the cytosol.
    reference_section_type: RESULTS
  - statement: >-
      Mim1 resides in a high-molecular-mass complex of about 400-450 kDa that is
      chromatographically distinct from both TOM and TOB/SAM; Mim1 is therefore not
      a subunit of either.
    supporting_text: Mim1 was present in a high-molecular-mass complex of a molecular size of about 400–450 kDa, which is distinct from that of the TOM and TOB complexes.
    reference_section_type: RESULTS
  - statement: >-
      Conditional depletion of Mim1 abrogates assembly of the TOM complex, with
      Tom40 accumulating as a low-molecular-mass species.
    supporting_text: Depletion of Mim1 abrogates assembly of the TOM complex and results in accumulation of Tom40
    reference_section_type: ABSTRACT
  - statement: >-
      The Mim1-requiring steps lie downstream of TOB/SAM-mediated insertion of the
      Tom40 beta-barrel into the outer membrane, so Mim1 acts late in TOM maturation
      rather than at beta-barrel insertion itself.
    supporting_text: The steps in the assembly of the TOM complex requiring Mim1 are located after the TOB-complex-dependent insertion of Tom40 into the outer membrane.
    reference_section_type: DISCUSSION
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:20026336
      - PMID:18187149
      review_notes: >-
        The placement of a Mim1-requiring step downstream of TOB/SAM insertion of
        Tom40 has been superseded in mechanism, though not in the observation that
        prompted it. PMID:20026336 showed Mim1 acts on the small alpha-helical Tom
        subunit Tom6 rather than on Tom40 itself, and PMID:18187149 found Tom40
        import reduced but its assembly rate undiminished in mim1-delta, attributing
        the deficit to less functional Tom20. Both make Mim1's contribution to Tom40
        maturation indirect. Marked DISPUTED rather than OVERTURNED because the two
        superseding papers propose different indirect routes, and PMID:18187149's
        assembly-rate result is itself in tension with this paper's reduced second
        intermediate.
  - statement: >-
      The requirement is specific: biogenesis of the TOB/SAM and porin complexes
      proceeds normally in the absence of Mim1.
    supporting_text: The biogenesis of other outer membrane complexes containing β-barrel proteins, such as TOB/SAM and porin complexes, was not affected by the lack of Mim1.
    reference_section_type: DISCUSSION
  - statement: >-
      Sequence conservation within the Mim1 family is high among fungi and is
      concentrated in the predicted transmembrane region.
    supporting_text: Mim1 is highly conserved among fungi. This sequence conservation is restricted to the predicted transmembrane region
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. The title was a placeholder in the seeded file
      and has been filled in from the cached record. Correctly cited for the
      GO:0005741 IDA and the GO:0070096 IMP. Its use as the reference for a
      GO:0045040 IMP is weaker than for GO:0070096, because the paper places the
      Mim1-dependent step after insertion; the insertase reading came from later
      work (PMID:17974559, PMID:32348752).
- id: PMID:17974559
  title: 'Biogenesis of the mitochondrial TOM complex: Mim1 promotes insertion and
    assembly of signal-anchored receptors.'
  findings:
  - statement: >-
      Mim1 is required for efficient membrane insertion and assembly of the
      signal-anchored TOM receptors Tom20 and Tom70, but not of the tail-anchored
      Tom22 - a substrate-resolved specificity that points to insertion of
      N-terminal alpha-helical anchors as the underlying activity.
    supporting_text: "We report that Mim1 is required\nfor efficient membrane insertion and assembly of Tom20 and Tom70, but not Tom22."
    reference_section_type: ABSTRACT
  - statement: >-
      Mim1 associates with SAM(core) components in a large SAM complex, which
      accounts for its involvement in the late steps of Tom40 assembly.
    supporting_text: "We show that Mim1 associates with SAM(core) components to a large SAM complex,\nexplaining its role in late steps of the assembly pathway of Tom40."
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:20026336
      review_notes: >-
        The SAM(core) association itself is not contested and is echoed by
        PMID:32348752. What is superseded is the explanatory clause - that this
        association accounts for a Mim1 role in late Tom40 assembly. PMID:20026336
        resolved the SAM machinery into modular forms and placed Mim1 upstream, at
        insertion of the small Tom subunit Tom6, with the SAM-Tom5/Tom40 module
        acting afterwards. Cite this reference for the physical association, not for
        the mechanism of the Tom40 requirement.
  - statement: >-
      The combined requirement for beta-barrel Tom40 maturation and for insertion of
      the signal-anchored receptors makes Mim1 central to efficient TOM assembly.
    supporting_text: "Thus, Mim1 plays an important role in the efficient assembly of the\nmitochondrial TOM complex."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only, but the abstract states the annotated finding
      explicitly, and UniProt independently records FUNCTION and DISRUPTION
      PHENOTYPE from this paper with ECO:0000269. Correctly cited for the GO:0070096
      IMP.
- id: PMID:22467864
  title: A crucial role for Mim2 in the biogenesis of mitochondrial outer membrane
    proteins.
  findings:
  - statement: >-
      Mim2 interacts physically and genetically with Mim1, and the two proteins
      constitute the MIM complex. This is the primary evidence behind both the
      GO:0140595 IPI annotations and the GO:0005515 IPI.
    supporting_text: "Mim2 physically and\ngenetically interacts with Mim1, and both proteins form the MIM complex."
    reference_section_type: ABSTRACT
  - statement: >-
      Some single-span and all known multiple-span mitochondrial outer-membrane
      proteins are inserted by a Mim1-dependent pathway, establishing the substrate
      scope of the MIM route as it stood in 2012.
    supporting_text: "Some of the single-span proteins and all known\nmultiple-span proteins are inserted into the membrane in a pathway that depends\non the MOM protein Mitochondrial Import 1 (Mim1)."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only, but the interaction it is cited for is stated
      in the abstract and is independently recorded in IntAct (NbExp=3, EBI-31062 /
      EBI-3700002) and in UniProt with ECO:0000269. The paper supports the
      GO:0140595 IPI well; it supports the GO:0005515 IPI equally well, but that
      term is uninformative rather than incorrect.
- id: PMID:28916712
  title: Identification of new channels by systematic analysis of the mitochondrial
    outer membrane.
  findings:
  - statement: >-
      Recombinant full-length Mim1 reconstituted into planar lipid bilayers shows a
      characteristic channel activity that is abolished by Mim1-specific antibodies.
    supporting_text: Upon reconstitution into planar lipid bilayers, Mim1 exhibited a characteristic channel activity that was inhibited by Mim1-specific antibodies
    reference_section_type: RESULTS
  - statement: >-
      A second, independent expression system gives the same conductance,
      strengthening the assignment of the activity to Mim1 itself rather than to a
      contaminant.
    supporting_text: Mim1 synthesized in wheat germ lysate exhibited the same channel activity.
    reference_section_type: RESULTS
  - statement: >-
      The pore closes at high positive or negative membrane potentials - the
      voltage-dependence on which the GO:0022832 annotation rests, and the same
      behaviour exhibited by the other protein-conducting channels of this membrane.
    supporting_text: that closed upon application of high positive or negative voltages
    reference_section_type: RESULTS
  - statement: >-
      The Mim1 channel is strongly cation selective, with PK+/PCl- of 23.5:1 at a
      reversal potential of 53 mV.
    supporting_text: The Mim1 channel was cation selective with a ratio of PK+/PCl− of 23.5:1 based on a positive reversal potential of 53 mV
    reference_section_type: RESULTS
  - statement: >-
      Co-reconstitution with the physiological partner Mim2 attenuates the
      conductance and lowers selectivity to PK+/PCl- of 11:1, showing the measured
      pore is a property of the MIM complex rather than an artefact of isolated
      Mim1.
    supporting_text: Thus, coreconstitution of Mim2 with Mim1 attenuated the channel properties of Mim1 but still retained a considerable cation preference.
    reference_section_type: RESULTS
  - statement: >-
      The authors interpret the cation preference functionally as suited to
      polypeptide translocation, not to ion flux: MIM substrates carry positively
      charged residues flanking their transmembrane segments.
    supporting_text: We conclude that the Mim1–Mim2 complex forms a channel with cation preference and is thus conducive to the translocation of precursor segments carrying positive charges.
    reference_section_type: RESULTS
  - statement: >-
      Mim1 oligomers are the major constituent of the MIM complex, with Mim2 present
      at one to two copies per complex and sharing the same topology.
    supporting_text: A second subunit, the 10-kD protein Mim2, possesses the same topology as Mim1 yet is present in the MIM complex in lower abundance (one to two copies per complex; Dimmer et al., 2012).
    reference_section_type: RESULTS
  - statement: >-
      Mim1 spans the membrane once via a predicted central alpha-helix, with the
      N-terminal domain cytosolic and the C-terminal domain in the intermembrane
      space.
    supporting_text: The 13-kD protein Mim1 contains a predicted central α-helical transmembrane segment and exposes its N-terminal domain to the cytosol and its C-terminal domain to the intermembrane space
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read in detail, since this is the sole basis for the
      contested GO:0022832 annotation. The experiments are sound and correctly
      attributed to Mim1; the reservation is interpretive rather than about the
      citation. The paper's own framing throughout is that the channel is a
      protein-import conduit - the summary line reads "The mitochondrial import
      component Mim1 forms a channel that is predicted to have an alpha-helical
      structure for protein import" - which is why an ion-channel GO term over-reads
      it. Not marked DISPUTED: nothing in the literature contradicts the
      measurements themselves.
- id: PMID:32348752
  title: The Mitochondrial Import Complex MIM Functions as Main Translocase for α-Helical
    Outer Membrane Proteins.
  findings:
  - statement: >-
      The MIM complex inserts precursors of multi-spanning alpha-helical
      outer-membrane proteins, complementing TOM-SAM for the beta-barrel class.
    supporting_text: "the mitochondrial import (MIM) complex\ninserts precursors of multi-spanning α-helical proteins"
    reference_section_type: ABSTRACT
  - statement: >-
      MIM also inserts single-spanning precursors with either N-terminal
      (signal-anchored) or C-terminal (tail-anchored) membrane anchors, extending
      the substrate scope well beyond multi-span proteins.
    supporting_text: "We report that the yeast MIM\ncomplex promotes the insertion of proteins with N-terminal (signal-anchored) or\nC-terminal (tail-anchored) membrane anchors."
    reference_section_type: ABSTRACT
  - statement: >-
      Free MIM complexes insert single-spanning proteins independently of Tom70,
      while other precursors are handed over from the TOM receptor Tom70, defining
      two routes into the complex.
    supporting_text: "Free MIM complexes insert single-spanning proteins that are\nimported in a Tom70-independent manner."
    reference_section_type: ABSTRACT
  - statement: >-
      Coupling of MIM to SAM promotes early assembly steps of TOM subunits,
      providing the mechanistic link between MIM and TOM biogenesis.
    supporting_text: "coupling of MIM and SAM\npromotes early assembly steps of TOM subunits"
    reference_section_type: ABSTRACT
  - statement: >-
      The overall conclusion is that MIM is a major and versatile protein
      translocase of the mitochondrial outer membrane - the statement that most
      directly warrants a membrane insertase molecular function.
    supporting_text: "We conclude that the MIM complex\nis a major and versatile protein translocase of the mitochondrial outer\nmembrane."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only, but every claim used here is stated in the
      abstract. Correctly cited for the ComplexPortal GO:0045040 IDA, and it is the
      strongest single support for the proposed GO:0032977 membrane insertase
      annotation.
- id: PMID:15242642
  title: Exploration of essential gene functions via titratable promoter alleles.
  findings:
  - statement: >-
      Genome-scale promoter-shutoff screen of essential yeast genes. MIM1 was one
      of the genes whose phenotypic signature assigned it to mitochondrial import,
      which is the origin of the gene name; UniProt cites this work with
      ECO:0000269 for the FUNCTION statement on Q08176.
    supporting_text: "We identified genes involved in ribosome biogenesis\n(HAS1, URB1, and URB2), protein secretion (SEC39), mitochondrial import (MIM1),\nand tRNA charging (GSN1)."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Historically important as the source of the MIM1 gene name and the first
      indication of a mitochondrial-import role, but it is a genome-scale
      phenotypic inference, not a mechanistic study of this gene. Supports no
      annotation on its own; cited for provenance. Cached record is abstract-only.
- id: PMID:18177669
  title: Mim1 functions in an oligomeric form to facilitate the integration of Tom20
    into the mitochondrial outer membrane.
  findings:
  - statement: >-
      States the membrane topology of Mim1 directly - cytosolic N-terminal domain,
      central transmembrane segment, intermembrane-space C-terminal domain. This is
      the primary source for the topology that PMID:28916712 later restates, and it
      resolves the discrepancy with the C-terminally tagged construct used in
      PMID:15326197.
    supporting_text: "The protein is composed of an N-terminal cytosolic domain, a\ncentral putative transmembrane segment (TMS) and a C-terminal domain facing the\nintermembrane space."
    reference_section_type: ABSTRACT
  - statement: >-
      Mim1 is required for integration of the import receptor Tom20 into the outer
      membrane, corroborating the independent finding of PMID:17974559.
    supporting_text: "Here we show that Mim1 is required for the integration of\nthe import receptor Tom20 into the outer membrane."
    reference_section_type: ABSTRACT
  - statement: >-
      Mechanism of oligomerisation: Mim1 self-associates through two GXXXG
      helix-dimerisation motifs in its transmembrane segment, and GXXXG mutants are
      neither oligomeric nor active. This is the mechanistic basis for the
      "Mim1 oligomers" that constitute the bulk of the MIM complex, and it explains
      the unusual concentration of sequence conservation in the transmembrane
      region noted in PMID:15608614.
    supporting_text: "We show that Mim1 forms homo-oligomeric structures via\nits TMS, which contains two helix-dimerization GXXXG motifs. Mim1 with mutated\nGXXXG motifs did not form oligomeric structures and was inactive."
    reference_section_type: ABSTRACT
  - statement: >-
      The transmembrane segment alone is the minimal functional domain; the N- and
      C-terminal domains are dispensable for both function and biogenesis.
    supporting_text: "Thus, the TMS of Mim1 is the minimal functional\ndomain of the protein."
    reference_section_type: ABSTRACT
  - statement: >-
      Organism confirmed from the full text: the study is done in Saccharomyces
      cerevisiae strain YPH499, with a mim1 null strain made by replacing the MIM1
      open reading frame with a HIS3 cassette. Note that mim1-delta is viable,
      which qualifies the "essential gene" designation MIM1 carried from the early
      deletion-project and promoter-shutoff screens.
    supporting_text: The S. cerevisiae WT strain YPH499 was used.
    reference_section_type: METHODS
  - statement: >-
      The GXXXG motifs are mapped and functionally tested. A variant mutating both
      motifs fails to complement, forms no dimer, and gives no detectable
      Mim1-containing complex on BN-PAGE, while phenocopying mim1-delta for reduced
      Tom20 and the low-molecular-mass Tom40 species.
    supporting_text: This variant was not able to complement the function of native Mim1 under all conditions tested
    reference_section_type: RESULTS
  - statement: >-
      Oligomerisation is necessary for function, not merely correlated with it -
      the direct warrant for treating the oligomer rather than the monomer as the
      functional unit in core_functions.
    supporting_text: Collectively, these results demonstrate that the ability of Mim1 to form oligomers is essential for the function of the protein in the biogenesis of the TOM complex.
    reference_section_type: RESULTS
  - statement: >-
      Cross-linking and dual-tag co-isolation establish a minimum stoichiometry of
      two Mim1 copies per complex.
    supporting_text: Mim1-containing complex harbours at least two copies of Mim1.
    reference_section_type: RESULTS
  - statement: >-
      Cross-species complementation: the Neurospora crassa orthologue rescues
      mim1-delta only partially and only when overexpressed, whereas the
      Schizosaccharomyces pombe orthologue complements fully. This is the only
      direct functional evidence bearing on the N. crassa protein and is a caution
      against treating the phylogenetic propagation to that orthologue as
      equivalence of function.
    supporting_text: Mim1 from N. crassa could rescue the growth phenotype of Δmim1 cells only partially and upon its overexpression
    reference_section_type: RESULTS
  - statement: >-
      The soluble domains tolerate wide sequence variation, consistent with the
      conservation being concentrated in the transmembrane segment.
    supporting_text: it appears that major variations in both the cytosolic and IMS domains of Mim1 can be tolerated.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not present in the GOA, so it supports no existing annotation, but it is the
      primary source for two claims the review makes and is cited by UniProt with
      ECO:0000269 on Q08176. Added because it settles the topology question and
      supplies the structural mechanism behind the oligomeric conduit in
      core_functions. Full text has been read (publisher PDF, extracted into the
      cache) and confirms the organism as S. cerevisiae strain YPH499, which the
      abstract does not state - the earlier reliance on UniProt's ECO:0000269 link
      for the yeast attribution is no longer needed. One caveat on the cached text:
      it is PDF-extracted, so a few hyphenated line breaks are imperfectly rejoined
      (e.g. one occurrence of "homooligomer") and the source PDF renders some GXXXG
      occurrences as "G XXXG".
- id: PMID:18187149
  title: The transmembrane segment of Tom20 is recognized by Mim1 for docking to the
    mitochondrial TOM complex.
  findings:
  - statement: >-
      Independent laboratory (Lithgow group) reaching the same conclusion as
      PMID:17974559 and PMID:18177669 by a different route: Mim1/Tom13 catalyses
      docking of the Tom20 transmembrane segment into the TOM complex.
    supporting_text: "This crucial\ndocking reaction is catalyzed by the unique assembly factor Mim1/Tom13."
    reference_section_type: ABSTRACT
  - statement: >-
      Loss of Mim1 prevents Tom20 from functioning as an import receptor, linking
      the insertion defect to a functional consequence for protein import.
    supporting_text: "Mutations in the transmembrane segment that destabilize Tom20, or deletion of\nMim1, prevent Tom20 from functioning as a receptor for protein import into\nmitochondria."
    reference_section_type: ABSTRACT
  - statement: >-
      Organism confirmed from the full text: S. cerevisiae, using the BY4743
      deletion-consortium background and W303 strains, with mim1-delta cells.
    supporting_text: The Δtom20 strain BY4743 was purchased from the Saccharomyces Genome Deletion Consortium.
    reference_section_type: METHODS
  - statement: >-
      Cysteine-scanning cross-linking shows Mim1 is not itself a stable neighbour
      of docked Tom20; the authors' reading is that Mim1 acts catalytically on the
      assembly reaction rather than forming part of the product. This is the
      cleanest experimental support for an insertase/assembly-factor molecular
      function as opposed to a structural subunit role.
    supporting_text: Mim1 is not one of the prominent cross-linked partners of Tom20.
    reference_section_type: RESULTS
  - statement: >-
      Independent evidence that the Tom40 requirement is indirect, predating the
      Becker 2010 result cited via PMID:21825073 and proposing a different route:
      mim1-delta mitochondria import less Tom40 because they have less functional
      Tom20, but Tom40 that does arrive progresses normally through the 250K and
      100K assembly intermediates. Note this is in tension with PMID:15608614,
      which reported the second intermediate reduced on Mim1 depletion.
    supporting_text: but does not diminish the overall rate of Tom40 assembly
    reference_section_type: RESULTS
  - statement: >-
      The mechanistic explanation offered for the general import defect of
      mim1-delta cells - it is downstream of Tom20 mispositioning, not a direct
      effect on translocation.
    supporting_text: Tom20 is not correctly positioned in the outer membrane in the absence of Mim1, and therefore Tom20 is not fully functional in Δmim1 cells.
    reference_section_type: RESULTS
  - statement: >-
      Specificity control: porin assembly, which needs both TOM and SAM, proceeds
      without Mim1, confirming those machineries are intact.
    supporting_text: porin is assembled into the outer membrane of mitochondria without need of Mim1
    reference_section_type: RESULTS
  - statement: >-
      A third value for the size of the Mim1 complex, ~300 kDa by BN-PAGE, against
      400-450 kDa by gel filtration and ~180 kDa by glycerol gradient. The paper
      notes the complex also needs more digitonin to solubilise than TOM does,
      which is a plausible methodological source of the spread.
    supporting_text: distinct from the ∼ 400–450 kDa TOM complex
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Upgraded from MEDIUM once the full text was read (publisher PDF, extracted
      into the cache). Not in the GOA, but it is more than corroboration: the
      cysteine-free Mim1(3S) cross-linking experiment argues that Mim1 acts
      catalytically rather than as a structural component of the assembled
      product, and the Tom40 import-versus-assembly separation is independent
      support for the indirectness now recorded on the GO:0070096 entries. Organism
      is S. cerevisiae (BY4743, W303), which the abstract does not state, so the
      earlier reliance on UniProt's ECO:0000269 link is no longer needed. Cached
      text is PDF-extracted; a few hyphenated line breaks are imperfectly rejoined.
- id: PMID:21825073
  title: The mitochondrial import protein Mim1 promotes biogenesis of multispanning
    outer membrane proteins.
  findings:
  - statement: >-
      Establishes the multispanning alpha-helical substrate class by
      loss-of-function and gain-of-function together, which is stronger than
      depletion alone.
    supporting_text: "We report that mitochondria lacking the\nmitochondrial import protein 1 (Mim1) are impaired in the biogenesis of\nmultispanning outer membrane proteins, whereas overexpression of Mim1 stimulates\ntheir import."
    reference_section_type: ABSTRACT
  - statement: >-
      The Mim1 complex cooperates with Tom70 in binding precursors and promotes
      their insertion and assembly - the sentence that most directly matches both
      halves of the GO:0032977 membrane insertase definition.
    supporting_text: "The Mim1 complex cooperates with the receptor Tom70 in binding of\nprecursor proteins and promotes their insertion and assembly into the outer\nmembrane."
    reference_section_type: ABSTRACT
  - statement: >-
      Direct physical interaction between Mim1 and its precursor substrates. This
      is the first report of such an interaction and supplies the "binds
      transmembrane domain-containing proteins" half of GO:0032977, which had
      previously been inferred from phenotype rather than observed.
    supporting_text: The critical component for the subsequent import into the outer membrane is Mim1, and the precursor proteins directly interact with Mim1.
    reference_section_type: INTRODUCTION
  - statement: >-
      Important mechanistic correction to the early literature: the Tom40 defect in
      Mim1-deficient mitochondria is indirect, arising from failure to import the
      small Tom proteins that Tom40 assembly requires, rather than from Mim1 acting
      on the beta-barrel itself.
    supporting_text: a recent study showed that Mim1 does not directly promote the biogenesis of Tom40 but functions via the import of small Tom proteins that are needed for Tom40 assembly (Becker et al., 2010)
    reference_section_type: INTRODUCTION
  - statement: Organism explicitly stated as Saccharomyces cerevisiae.
    supporting_text: For this paper, we studied the biogenesis of multispanning outer membrane proteins in the model organism Saccharomyces cerevisiae.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Not in the GOA, but the strongest available support for the
      proposed GO:0032977 annotation because it reports direct precursor binding
      rather than inferring it from a depletion phenotype. Also the source of the
      Tom40-is-indirect correction now recorded against the GO:0070096 entry, and
      of the Mim1-Tom70 interaction UniProt records with ECO:0000269.
- id: PMID:21825074
  title: Multispan mitochondrial outer membrane protein Ugo1 follows a unique Mim1-dependent
    import pathway.
  findings:
  - statement: >-
      Companion paper to PMID:21825073 from an independent laboratory, reaching the
      same conclusion for the model multispan substrate Ugo1.
    supporting_text: "Conversely, the\nmultifunctional outer membrane protein mitochondrial import 1 (Mim1) plays a\ncentral role in mediating the insertion of Ugo1."
    reference_section_type: ABSTRACT
  - statement: Organism explicitly stated as yeast.
    supporting_text: "In this paper, we address this issue using yeast mitochondria\nand the multispan protein Ugo1."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read. Not in the GOA; added as the independent companion to
      PMID:21825073 (the two appeared back-to-back and cite each other as
      "Comment in"). Its value here is corroboration by a second group using a
      different assay, which is why the multispan substrate class is treated as
      well established rather than single-laboratory.
- id: PMID:19345216
  title: The three domains of the mitochondrial outer membrane protein Mim1 have discrete
    functions in assembly of the TOM complex.
  findings:
  - statement: >-
      Second independent primary source for the cytosolic-N / intermembrane-space-C
      topology, published a year after PMID:18177669. PMID:28916712 cites the two
      together, so with both now in the review the topology rests on two
      laboratories rather than one.
    supporting_text: "Mim1, is anchored in the outer membrane with its N-terminus\nexposed to the cytosol and its C-terminus in the mitochondrial intermembrane\nspace."
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: CORROBORATED
      review_notes: >-
        Independently reported by PMID:18177669 and restated by PMID:28916712.
        Explicitly NOT affected by the dispute over this paper's domain-function
        claim - the topology stands and is the better-supported of the two results.
  - statement: >-
      Assigns discrete roles to the soluble domains: the N-terminal domain regulates
      the SAM-mediated early reaction of Tom40 assembly, and Mim1 also influences a
      Sam37-dependent late reaction.
    supporting_text: "an \"early reaction\" mediated by the SAM\ncomplex is regulated by the N-terminal domain of Mim1"
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:18177669
      review_notes: >-
        Directly contested by PMID:18177669, which found that deleting either
        soluble domain caused no growth or TOM-assembly phenotype and concluded the
        transmembrane segment is the minimal functional domain. Not marked
        OVERTURNED: the two studies used different readouts - an in vitro
        multi-step Tom40 assembly kinetic assay here versus in vivo complementation
        and steady-state levels there - so a quantitative contribution of the
        N-terminal domain that an in vivo growth assay cannot resolve would satisfy
        both. Curate with caution; no GO term in this review depends on it.
  - statement: >-
      Concludes that Mim1 acts at more than one step of TOM assembly, which is the
      framing that makes the Tom40 requirement partly separable from the
      Tom20/Tom70 insertase role.
    supporting_text: "Thus, Mim1 participates at multiple stages in the assembly of the TOM\ncomplex."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Not in the GOA. Corroborates the topology, but its central claim is in direct
      tension with PMID:18177669 from the same period: this paper assigns "discrete
      functions" to the three domains and attributes regulation of the SAM early
      reaction to the N-terminal domain, whereas Popov-Celeketic et al. found that
      deleting either soluble domain caused no growth or TOM-assembly phenotype and
      concluded the transmembrane segment is the minimal functional domain. The
      assays differ - an in vitro multi-step Tom40 assembly readout here versus in
      vivo complementation and steady-state levels there - so a quantitative
      contribution of the N-terminal domain that is invisible to a growth assay
      would reconcile them. Marked DISPUTED for the domain-function claim only; the
      topology it reports is not disputed and is corroborated. No GO action depends
      on the disputed point. Cached record is abstract-only.
- id: PMID:20026336
  title: Two modular forms of the mitochondrial sorting and assembly machinery are
    involved in biogenesis of alpha-helical outer membrane proteins.
  findings:
  - statement: >-
      This is the primary source for the "Becker et al., 2010" result that
      PMID:21825073 cites second-hand and that the review used to record the Tom40
      requirement as indirect. Mim1 inserts the small alpha-helical Tom subunit
      Tom6, which the SAM-Tom5/Tom40 module then acts on; Mim1 is therefore
      upstream of Tom40 maturation via the small Tom proteins rather than acting on
      the beta-barrel itself.
    supporting_text: "binds\nthe alpha-helical precursor of Tom6 after the precursor has been inserted into\nthe outer membrane in an Mim1 (mitochondrial import protein 1)-dependent manner"
    reference_section_type: ABSTRACT
  - statement: >-
      The parallel SAM-Mdm10 module handles Tom22, which is consistent with
      PMID:17974559 finding Tom22 to be the one TOM subunit whose insertion does not
      require Mim1.
    supporting_text: "The second large SAM complex, SAM-Mdm10 (mitochondrial distribution and\nmorphology protein), binds the alpha-helical precursor of Tom22 and promotes its\nmembrane integration."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not in the GOA. Added because the review twice relies on the Tom40-is-indirect
      correction and was citing it only through PMID:21825073's summary of it; this
      is the study itself. It also supplies an independent rationalisation of the
      Tom22 exception reported by PMID:17974559. Cached record is abstract-only.
- id: PMID:31945731
  title: The Biogenesis of Mitochondrial Outer Membrane Proteins Show Variable Dependence
    on Import Factors.
  findings:
  - statement: >-
      Establishes tail-anchored proteins as MIM substrates, independently of and
      slightly before the ComplexPortal-annotated PMID:32348752.
    supporting_text: "enlarge the repertoire of MIM substrates to include also\ntail-anchored proteins"
    reference_section_type: ABSTRACT
  - statement: >-
      Important qualification of the substrate class: MIM dependence is partial and
      substrate-specific rather than universal among single-span outer-membrane
      proteins.
    supporting_text: "we\nfound that the MIM complex is required for the membrane insertion of some\nsingle-span proteins"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not in the GOA. Added because it is the source that qualifies the substrate
      scope: "some" single-span proteins, with others MIM-independent. This matters
      for reading GO:0045040 at the right strength - MIM is a major but not
      obligatory route for single-span clients. Full text available in the cache.
- id: PMID:35262629
  title: The multi-factor modulated biogenesis of the mitochondrial multi-span protein
    Om14.
  findings:
  - statement: >-
      Further qualification of substrate dependence, for a multi-span client: Mim1
      supports but is not strictly required for Om14 integration, and membrane
      properties contribute alongside proteinaceous factors.
    supporting_text: "We\nfurther demonstrate that Mim1 and Porin support optimal membrane integration of\nOm14 but none of them are absolutely required."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not in the GOA. Added as the counterweight to the earlier multi-span papers:
      PMID:21825073 and PMID:21825074 establish MIM as central for multi-span
      clients, and this later study shows the dependence is not absolute for every
      such client. Full text available in the cache.
- id: PMID:23959800
  title: The role of Djp1 in import of the mitochondrial protein Mim1 demonstrates
    specificity between a cochaperone and its substrate protein.
  findings:
  - statement: >-
      Concerns the biogenesis of Mim1 itself rather than its activity: the cytosolic
      Hsp40 cochaperone Djp1 and the receptors Tom70/Tom71 are needed for Mim1 to
      reach the outer membrane, and without Djp1 overexpressed GFP-Mim1 is massively
      mislocalised to the ER.
    supporting_text: we identified Tom70 and Djp1 as crucial players in the biogenesis of Mim1
    reference_section_type: ABSTRACT
  - statement: >-
      Newly synthesised Mim1 interacts directly with Tom70. Note the direction: here
      Tom70 acts on Mim1 as a client, which is the converse of the Mim1-Tom70
      cooperation in substrate handover reported by PMID:21825073.
    supporting_text: Our results indeed demonstrate a direct interaction of newly synthesized Mim1 molecules with Tom70.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not in the GOA and supports no annotation on MIM1's own function - it is about
      how Mim1 gets to the membrane, not what it does there. Recorded because the
      Mim1-Tom70 relationship appears in the review in the opposite direction
      (Tom70 handing precursors to MIM), and a reader meeting both could easily
      conflate them. Full text available in the cache.
- id: PMID:29923829
  title: Independent evolution of functionally exchangeable mitochondrial outer membrane
    import complexes.
  findings:
  - statement: >-
      States the taxonomic restriction directly: the Mim1/Mim2 complex is
      fungi-specific, which is the phylogenetic context for the narrow PANTHER
      family PTHR28241 and for the absence of a metazoan orthologue.
    supporting_text: "require the\nfungi-specific Mim1/Mim2 complex"
    reference_section_type: ABSTRACT
  - statement: >-
      Demonstrates convergent evolution experimentally rather than by inference: the
      trypanosome protein pATOM36 is a functional analogue of Mim1/Mim2 with neither
      sequence nor topological similarity, shown by reciprocal complementation in
      both directions.
    supporting_text: "we show by reciprocal\ncomplementation that the MOM protein pATOM36 of trypanosomes is a functional\nanalogue of yeast Mim1/Mim2 complex, even though these proteins show neither\nsequence nor topological similarity"
    reference_section_type: ABSTRACT
  - statement: >-
      pATOM36 rescues nearly all mim1 and mim2 deletion phenotypes in yeast,
      including the mitochondrial morphology defects.
    supporting_text: "Expression of pATOM36 rescues almost all\ngrowth, mitochondrial biogenesis, and morphology defects in yeast cells lacking\nMim1 and/or Mim2."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not in the GOA. Added because it puts the orthology framing on an experimental
      footing. The review previously described the MIM/MTCH convergent-evolution
      story from the GO:7770059 term definition alone; this paper demonstrates
      functional exchangeability with a non-homologous protein directly. It also
      explains why PTHR28241 is fungal and why phylogenetic propagation of MIM
      function stops at the fungal clade. Full text available in the cache.
- id: PMID:41748941
  title: Mitochondria contact lipid droplets through the mitochondrial import complex
    binding to lipid metabolism enzyme Ayr1.
  findings:
  - statement: >-
      Reports a second, non-import function for the MIM complex: the lipid
      metabolism enzyme Ayr1 captures MIM and thereby nucleates mitochondria-lipid
      droplet contact sites.
    supporting_text: "Here we report that the MIM complex performs a second major function in\nlipid-droplet homeostasis."
    reference_section_type: ABSTRACT
  - statement: >-
      The contact-site claim itself, and the mechanism of capture.
    supporting_text: "The lipid metabolism\nenzyme Ayr1 captures the MIM complex, promoting the formation of\nmitochondria-lipid droplet contact sites."
    reference_section_type: ABSTRACT
  - statement: >-
      A functional consequence at the cellular level - lipid droplet number depends
      on MIM and Ayr1 - which is what would justify a lipid droplet organization
      biological process annotation.
    supporting_text: "MIM and Ayr1 enhance the lipid droplet\nnumber in cells."
    reference_section_type: ABSTRACT
  - statement: >-
      Mechanistically elegant and important for how the two functions relate: Ayr1
      engages the same site as a precursor would, via a single hydrophobic segment,
      but is never released. The second function is therefore a subverted insertase
      reaction, not a separate activity of the same protein.
    supporting_text: "Ayr1 binds to MIM via its single hydrophobic segment in a\nsubstrate-mimicry mechanism but remains bound and is not released into the outer\nmembrane."
    reference_section_type: ABSTRACT
  - statement: >-
      The two functions are carried by distinct complex populations rather than by
      one complex switching roles.
    supporting_text: "The functional diversity is mediated by different MIM complexes:\nMIM-Ayr1 for recruiting lipid droplets and MIM-preprotein for protein insertion\ninto the outer membrane."
    reference_section_type: ABSTRACT
  - statement: >-
      Quantifies the scope of the import function, higher than any earlier estimate
      in this review.
    supporting_text: "The mitochondrial import (MIM) complex functions as main translocase for\nimporting the precursors of more than 90% of integral outer-membrane proteins."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Published 2026, not yet reflected in the GOA. This is the only reference in
      the review that reports a function outside protein insertion, and it is the
      basis for the proposed GO:0034389 annotation and the two proposed contact-site
      terms. Two cautions for a curator: it is a single study with no independent
      replication yet, and the cached record is abstract-only, so the specific
      experiments behind the contact-site and lipid-droplet-number claims have not
      been examined here. Worth noting the internal consistency with PMID:28916712,
      which identified Ayr1 as an outer-membrane channel in the same screen that
      found the Mim1 channel; the two proteins were already known to co-occur in
      that fraction.
- id: PMID:40782022
  title: 'Conserved function, divergent evolution: mitochondrial outer membrane insertases
    across eukaryotes.'
  findings:
  - statement: >-
      Current review-level statement of the MIM complex's composition and function,
      including the cooperation with Tom20 and Tom70.
    supporting_text: "the mitochondrial\nimport (MIM) complex, composed of Mim1 and Mim2, facilitates the integration of\nvarious α-helical OMM proteins, often in cooperation with import receptors such\nas Tom20 and Tom70"
    reference_section_type: ABSTRACT
  - statement: >-
      Places the yeast MIM complex, trypanosome pATOM36 and mammalian MTCH1/MTCH2 as
      convergently evolved solutions to the same problem.
    supporting_text: "the functional MIM counterpart\npATOM36 performs a similar role despite lacking sequence and structural\nhomology, reflecting a case of convergent evolution."
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      A 2025 review, not primary evidence, and it supports no annotation on its own.
      Included for one specific reason: it is the cited xref for GO:7770059 "alpha
      helical protein insertion into mitochondrial outer membrane", the pathway-branch
      term whose definition names the MIM complex explicitly. A curator considering
      that term for MIM1 will land on this reference. Cached record is abstract-only.
