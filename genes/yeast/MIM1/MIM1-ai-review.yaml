core_functions:
- description: >-
    As the oligomeric core of the mitochondrial import (MIM) complex, Mim1 forms a
    proteinaceous conduit in the mitochondrial outer membrane that binds
    alpha-helical transmembrane anchors of newly synthesised precursor proteins and
    integrates them into the lipid bilayer. Substrates comprise multi-spanning
    alpha-helical outer-membrane proteins, signal-anchored proteins (including the
    TOM receptors Tom20 and Tom70) and a subset of tail-anchored proteins; some are
    handed over from the TOM receptor Tom70 and others are inserted
    Tom70-independently. The cation preference of the reconstituted pore matches
    the positively charged residues that typically flank the transmembrane segments
    of these substrates. The oligomerisation that builds this conduit is driven by
    two GXXXG helix-dimerisation motifs within the transmembrane segment: the
    transmembrane segment alone is the minimal functional unit, and mutating the
    GXXXG motifs abolishes both oligomer formation and activity, so oligomerisation
    is necessary for function rather than merely correlated with it; the complex
    carries at least two copies of Mim1, and the requirement explains the otherwise
    unusual concentration of sequence conservation in the membrane-spanning region.
    Mim1 is not a stable neighbour of its assembled clients - it is not among the
    prominent cross-linking partners of docked Tom20 - so it acts catalytically on
    the insertion reaction rather than remaining part of the product. Because Tom20 and Tom70 are direct clients, and because MIM couples to
    the SAM machinery during early assembly steps of TOM subunits, biogenesis of the
    entire TOM translocase depends on this activity; the requirement for the
    beta-barrel Tom40 appears to be indirect, mediated through the small Tom proteins
    that Tom40 assembly needs. On the process term in this slot: the term
    that belongs here is the alpha-helical child GO:7770059, matching the MODIFY
    recommendation on the three GO:0045040 annotations and the NEW annotation
    proposed for it. GO:0045040 stands in only because GO:7770059 cannot yet be
    asserted through this repository's validation stack - it is live in OLS and the
    GO API but absent from the semantic-sql GO build the term validator resolves
    labels against, which was confirmed against a freshly downloaded build, so the
    lag is upstream rather than a stale local cache. Swap the child in once
    semantic-sql catches up. GO:0070096 was dropped from this slot when the two
    annotations to it were demoted to non-core.
