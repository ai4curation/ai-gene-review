gene_symbol: MIM1
organism: yeast
uniprot_id: Q08176
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Component of the MIM complex required for mitochondrial outer membrane protein
    import (PubMed:22467864). The MIM complex cooperates with the receptor TOM70 in
    binding of precursor proteins and promotes their insertion and assembly into the
    outer membrane (PubMed:21825073). Involved in import of the subset of proteins
    with multiple alpha- helical transmembrane segments, including UGO1 (PubMed:21825073,
    PubMed:21825074). Required for the assembly of the TOM (translocase of outer membrane)
    receptor complex, which is responsible for the recognition and translocation of
    cytosolically synthesized mitochondrial preproteins (PubMed:15242642, PubMed:15326197,
    PubMed:15608614). Required specifically for assembly of TOM40, TOM20, and TOM70,
    but not TOM22 (PubMed:17974559, PubMed:18187149).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08176
  source_id: Q08176
- source: Alliance_Imported
  text: Mitochondrial protein required for outer membrane protein import; cooperates
    with Tom70p to import the subset of proteins with multiple alpha-helical transmembrane
    segments, including Ugo1p, Tom20p, and others; forms a complex with Mim2p in the
    outer membrane that functions as cation-selective channel for translocation of
    positively charged precursor segments; also has a role in assembly of Tom20p into
    the TOM complex
  source_type: curated
  url: https://www.yeastgenome.org/locus/MIM1
  source_id: SGD:S000005386
- source: Alliance_Automated
  text: Enables voltage-gated channel activity. Involved in mitochondrial outer membrane
    translocase complex assembly and protein insertion into mitochondrial outer membrane.
    Part of MIM complex. Is active in mitochondrial outer membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MIM1
