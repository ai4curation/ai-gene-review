    action: MARK_AS_OVER_ANNOTATED
    reason: The Golgi location goes back to early fractionation, which placed Vps5 in a particulate fraction
      that contained Golgi together with transport vesicles and possibly endosomes (PMID:9175702). Horazdovsky
      et al. found the Vps5 membrane fraction distinct from Golgi membranes (PMID:9285823). Imaging places
      Vps5 and Vps17 on endosomes, and Vps17-coated tubules bud from endosomes distinct from Sec7-marked
      Golgi (PMID:22593205, PMID:24567361). The trans-Golgi network is the destination of the carriers,
      not where the coat is shown to act. Not removed, because the yeast late Golgi and endosomes are hard
      to separate and a transient Golgi pool has not been excluded.
