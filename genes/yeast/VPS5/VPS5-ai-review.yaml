    summary: Mapping from the UniProt subcellular location 'Cytoplasm'.
    action: KEEP_AS_NON_CORE
    reason: Correct. Vps5 is a hydrophilic protein with no signal sequence or transmembrane segment, and
      a large fraction is a free cytosolic pool (PMID:9175702, PMID:9285823). The mapping's evidence does
      not resolve cytosol from membrane-bound pools, so the term is as precise as the row supports. Its
      functional location is the cytoplasmic face of the endosome membrane, so this is non-core.
    supported_by:
    - reference_id: PMID:9285823
