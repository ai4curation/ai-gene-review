    summary: Immunofluorescence shows the membrane-associated pool of Vps5 on an endosome-like organelle
      that accumulates in the class E vps27 mutant; fractionation shows Vps5 as a peripheral, particulate
      protein (PMID:9175702, abstract only).
    action: MODIFY
    reason: 'The location is right, and the row''s own evidence reaches the membrane: fractionation separates
      a free cytosolic pool from a particulate one, and immunofluorescence places the membrane-associated
      pool on an endosome-like organelle that accumulates in the class E vps27 mutant. That pool is on
      the endosome membrane. GO:0010008 endosome membrane is the supported part_of descendant and is already
      on the gene (IBA and IEA, accepted). Endosome is a series organelle, not one of the root organelle
      terms covered by the organelle policy, so the ordinary refinement rule applies; the matching rows
      from this paper on the other retromer subunits are refined the same way.'
