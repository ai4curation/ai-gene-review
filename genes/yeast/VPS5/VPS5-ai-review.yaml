- term:
    id: GO:0032456
    label: endosome to plasma membrane transport
  evidence_type: NAS
  original_reference_id: PMID:9700157
  qualifier: involved_in
  review:
    summary: ComplexPortal statement for the yeast retromer complex (CPX-1653), citing Seaman et al. 1998
      and propagated to all five subunits. GO:0032456 was renamed from 'endocytic recycling' (now a narrow
      synonym, still the label on the UniProt record) to 'endosome to plasma membrane transport', and
      is defined as the movement of vesicles from endosomes back to the plasma membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Retromer, Vps5 included, is required to keep the iron transporter Ftr1 at the cell surface:
      Ftr1-GFP goes to the vacuole lumen in vps5Δ and the other retromer mutants (PMID:17420293). But
      Ftr1 returns through the Golgi for resecretion, and Vps5''s known cargoes (Vps10, Kex2, A-ALP) return
      to the trans-Golgi network (PMID:9175702), so the carriers that Vps5-Vps17 shapes go to the Golgi,
      not to the plasma membrane. The real contribution, retrograde transport from endosome to Golgi,
      is accepted on other rows, and the cited paper describes only that retrieval. The term goes beyond
      what retromer does in yeast and is marked over-annotated, not removed, because the recycling requirement
      is real. The same call, and the same query to ComplexPortal, is made on the matching row of every
      retromer subunit, since all five rows come from one complex-level statement.'
    supported_by:
    - reference_id: PMID:9700157
      supporting_text: Conservation of the yeast retromer complex components in higher eukaryotes suggests
        an important general role for this complex in endosome-to-Golgi retrieval.
    - reference_id: PMID:9175702
      supporting_text: These results support a model in which Vps5p is required for retrieval of membrane
        proteins from a prevacuolar/late endosomal compartment back to the late Golgi apparatus.
    - reference_id: PMID:17420293
      supporting_text: Ftr1p-GFP is mislocalized to the lumen of the vacuole in cells that lack a functional
        retromer complex (vps5Δ, vps17Δ, vps26Δ, vps29Δ, and vps35Δ) or the sorting nexin Grd19p (grd19Δ).
    - reference_id: PMID:17420293
      supporting_text: After export from the endosome, Fet3p-Ftr1p transits through the Golgi apparatus
        for resecretion.
    source_defects:
    - defect_type: WRONG_TERM
      resource: COMPLEX_PORTAL
      record: CPX-1653
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0032456 endosome to plasma membrane transport (NAS, PMID:9700157)
      cause: SCOPE_OVER_REACH
      confidence: SUSPECTED
      explanation: The S. cerevisiae retromer complex CPX-1653 carries GO:0032456 endosome to plasma membrane
        transport (NAS, PMID:9700157), propagated to all five subunits (Vps35, Vps26/Pep8, Vps29, Vps5,
        Vps17). The full text of PMID:9700157 (cached) discusses endosome-to-Golgi retrieval and has no
        statement on transport to the plasma membrane. In yeast, the retromer-dependent recycling route
        for plasma membrane proteins passes through the Golgi (PMID:17420293), so retromer carriers go
        to the Golgi rather than to the plasma membrane; the process may have been carried over from metazoan
        retromer. Raised as a query, since the complex description may rest on a source other than the
        cited paper; the alternatives are to drop the term or to cite a yeast paper that supports it.
      supported_by:
      - reference_id: PMID:17420293
        supporting_text: After export from the endosome, Fet3p-Ftr1p transits through the Golgi apparatus
          for resecretion.
