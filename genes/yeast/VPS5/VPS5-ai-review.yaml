id: Q92331
gene_symbol: VPS5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Vps5 is a sorting nexin of the SNX-BAR class, homologous to human SNX1 and SNX2, and one
  of the two membrane-binding subunits of the yeast retromer coat. It has a long disordered N-terminal
  region, a PX domain that binds phosphatidylinositol 3-phosphate (PI3P), and a C-terminal BAR domain
  through which it forms a heterodimer with the sorting nexin Vps17. Much of Vps5 is in a soluble cytosolic
  pool. With Vps17 it is recruited to PI3P-containing endosomal membranes, where the Vps5-Vps17 heterodimer
  bends the membrane into tubules. Motifs in the Vps5 N-terminus bind Vps29 and Vps35 and so recruit the
  cargo-selective Vps26-Vps29-Vps35 subcomplex; oligomers of that subcomplex cross-link the sorting-nexin
  layer and constrict the tubule into a coated carrier. These carriers return the carboxypeptidase Y receptor
  Vps10 and late-Golgi membrane proteins such as Kex2 from endosomes to the trans-Golgi network. vps5
  mutants therefore secrete carboxypeptidase Y, deliver late-Golgi proteins to the vacuole and have fragmented
  vacuoles. Vps5-Vps17 competes with the PROPPINs Atg18 and Atg21 for the cargo-selective subcomplex;
  these alternative retromers drive vacuole fragmentation under hyperosmotic stress. The Vps5 paralog
  from the whole-genome duplication, Vin1, instead pairs with Vrl1 in the endosomal VINE complex.
