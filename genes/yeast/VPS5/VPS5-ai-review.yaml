core_functions:
- description: SNX-BAR subunit that, as a heterodimer with Vps17, binds PI3P-containing endosomal membranes
    and bends them into the tubules that become retromer-coated retrograde carriers.
  molecular_function:
    id: GO:0180020
    label: membrane bending activity
  directly_involved_in:
  - id: GO:0097750
    label: endosome membrane tubulation
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  locations:
  - id: GO:0010008
    label: endosome membrane
  in_complex:
    id: GO:0030905
    label: retromer, tubulation complex
  supported_by:
  - reference_id: PMID:28100638
    supporting_text: The SNX-BAR heterodimer thus requires PI-3-P binding for membrane recruitment and
      tubulation activity.
  - reference_id: PMID:36644906
    supporting_text: High concentrations of sorting nexins alone constrict membrane tubes to an invariant
      radius of 19 nm.
  - reference_id: PMID:24567361
    supporting_text: Mvp1 and Vps17 retromer SNX-BAR coat tubules that bud from the endosome.
  - reference_id: PMID:9700157
    supporting_text: We also show by immunogold EM that Vps5p is localized to discrete regions at the
      rims of the prevacuolar endosome where vesicles appear to be budding.
- description: Binds PI3P through its PX domain, which targets Vps5 (and Vps17) from the cytosol to endosomal
    membranes whose PI3P is made by the Vps34 complex II.
  molecular_function:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  directly_involved_in:
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  locations:
  - id: GO:0010008
    label: endosome membrane
  supported_by:
  - reference_id: PMID:12244127
    supporting_text: We demonstrate that the PX domains of Vps5p and Vps17p specifically bind to PtdIns3P
      in vitro and in vivo.
  - reference_id: PMID:28100638
    supporting_text: The SNX-BAR heterodimer thus requires PI-3-P binding for membrane recruitment and
      tubulation activity.
- description: Recruits the cargo-selective Vps26-Vps29-Vps35 subcomplex to the endosome membrane. Motifs
    in the disordered Vps5 N-terminus bind Vps29 and Vps35 while the PX-BAR domains hold the membrane,
    which assembles the pentameric retromer coat that retrieves Vps10.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  locations:
  - id: GO:0010008
    label: endosome membrane
  in_complex:
    id: GO:0030904
    label: retromer complex
  supported_by:
  - reference_id: PMID:40234461
    supporting_text: Here, we show that Vps5 binds both Vps29 and Vps35 subunits through its unstructured
      N-terminal domain.
  - reference_id: PMID:38598303
    supporting_text: these data suggest that Vps5 interacts with Vps29 through an N-terminal bipartite
      pocket- and sheet-binding motif that is critical for both retromer assembly and efficient sorting
  - reference_id: PMID:22593205
    supporting_text: the Vps5 and Vps17 sorting nexins are required for recruitment to endosomes, and
      the GTP-loaded form of Ypt7 is required for vacuole localization.
suggested_questions:
- question: Does Vps5 bend membranes in vivo without Vps17? In vps17Δ cells Vps5 is reported to form
    retromer with two Vps5 molecules and to sort Ear1 normally while Vps10 is missorted (PMID:42135947),
    but other work finds Ear1 mislocalised in vps17Δ cells (PMID:41699388).
- question: How much of the vacuole fragmentation phenotype of vps5 deletions comes from VAM10, the ORF
    embedded in VPS5 and deleted with it, and how much from loss of the Vps5-Vps17 retromer and the resulting
    shift toward Atg18-, Atg21- or Hsv2-retromer?
- question: Does yeast Vps5-Vps17 retromer send any cargo from endosomes directly to the plasma membrane,
    as the ComplexPortal endocytic recycling annotation implies, or do all its known cargoes go through
    the trans-Golgi network?
suggested_experiments:
- description: Express VPS5 deletions from a VAM10-preserving allele (or complement VAM10 separately)
    and score vacuole morphology and Vps10-mNeonGreen recycling, to separate the VAM10 and VPS5 contributions
    to the vps5Δ phenotype.
- description: Reconstitute supported membrane tube constriction with purified S. cerevisiae Vps5 homodimer
    versus the Vps5-Vps17 heterodimer, with and without the cargo-selective subcomplex, to test whether
    Vps17 is needed for bending or only for cargo specificity.
