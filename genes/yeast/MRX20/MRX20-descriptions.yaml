  text: Predicted to enable citrate secondary active transmembrane transporter activity.
    Predicted to be involved in mitochondrial citrate transmembrane transport and
    mitochondrial transport. Predicted to be located in mitochondrial inner membrane.
    Predicted to be active in mitochondrion. Human ortholog(s) of this gene implicated
    in 2-hydroxyglutaric aciduria; combined D-2- and L-2-hydroxyglutaric aciduria;
    and congenital myasthenic syndrome. Orthologous to human SLC25A1 (solute carrier
    family 25 member 1).
