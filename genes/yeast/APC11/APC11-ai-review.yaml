- term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  evidence_type: IDA
  original_reference_id: PMID:10888670
  qualifier: enables
  review:
    summary: >-
      Leverson et al. 2000 is the defining paper: purified recombinant Apc11 binds Ubc4 directly (GST pull-down),
      mediates E1- and E2-dependent ubiquitination of itself and of the APC/C substrate Clb2 (including
      D-box-deleted Clb2) with Ubc4 but not Cdc34, and does so without Apc2; activity is abolished by mutation
      of the metal-binding cysteines C41, C44 or C91 and reduced by W81A, which also impairs E2 binding
      and fails to complement apc11-13 in vivo.
    action: ACCEPT
    reason: >-
      Direct biochemical demonstration with purified components in the gene's own organism, with structure-function
      analysis tying the activity to the RING-H2 finger and to viability. Apc11 is a RING E3 that bridges
      E2 and substrate without a thioester intermediate, which is exactly the GO definition of ubiquitin
      protein ligase activity (E2-to-substrate transfer). Core molecular function; 'enables' is appropriate
      because the isolated subunit is active.
    supported_by:
    - reference_id: PMID:10888670
      supporting_text: >-
        Using purified, recombinant proteins we showed that Apc11p interacted directly with the Ubc4 ubiquitin
        conjugating enzyme (E2).
    - reference_id: PMID:10888670
      supporting_text: >-
        His-Apc11p mediated the polyubiquitination of Clb2p in the presence of Ubc4p, but not Cdc34p (Figure
        5 D, compare lanes 2 and 4).
    - reference_id: PMID:10888670
      supporting_text: >-
        However, Apc11p bearing mutations in putative metal-binding cysteines (C41, C44, or C91) showed
        little or no activity in this assay (Figure 5 A, lanes 3, 4, and 9), demonstrating that the RING-H2
        finger is absolutely required for its E3 activity.
    - reference_id: PMID:10888670
      supporting_text: >-
        Our work, and that of others, indicates that RING-based E3s do not act as ubiquitin carriers that
        form thioester intermediates, but instead act as bridges between E2s and substrates that provide
        a favorable environment for the transfer of ubiquitin.
    - reference_id: PMID:10888670
      supporting_text: >-
        Thus, the Apc11p RING-H2 finger performs a crucial function that is essential for cell viability.
