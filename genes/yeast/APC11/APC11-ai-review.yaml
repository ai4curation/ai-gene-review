  review:
    summary: >-
      PAINT inference from PTN000129805, the RING-box family node spanning RBX1/RBX2/APC11, that Apc11 is
      active in the nucleus; the descendants include fly, mouse, human and fission-yeast RING-box proteins
      and the yeast Hrt1/Rbx1 (SGD:S000005493). Apc11 has no direct localisation record in UniProt or SGD,
      but the ligase it belongs to acts on nuclear substrates.
    action: ACCEPT
    reason: >-
      The IBA is a sound phylogenetic judgment: cullin-RING ligases of this family act on nuclear cell-cycle
      regulators in every lineage examined, and in budding yeast the APC/C-Cdh1 ligase is functionally nuclear
      (degron reporters are degraded only when nuclear, per the Arnold et al. 2015 data summarised in the
      deep-research file) and the TPR subunits Cdc16/Cdc23/Cdc27 function in the nucleus. Apc11 ubiquitinates
      securin and B-type cyclins as part of that complex, so nucleus is the compartment in which its activity
      is exercised. No study has imaged tagged Apc11 directly, which is a knowledge gap rather than a reason
      to doubt the placement.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000129805
        source_label: PANTHER:PTN000129805
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The broad RING-box PAINT node correctly captures nuclear activity inherited by APC11/RBX-family
          cullin-RING E3 subunits; budding-yeast Apc11 has no evidence of compartmental divergence that
          would invalidate the transfer.
    supported_by:
    - reference_id: PMID:10888670
      supporting_text: "Cdc16p/APC6, Cdc23p/APC8, Cdc27p/APC3, and APC7 were identified as tetratricopeptide repeat (TPR)- containing proteins, which function in the nucleus"
