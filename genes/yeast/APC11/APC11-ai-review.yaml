core_functions:
- description: >-
    RING E3 catalytic subunit of the anaphase-promoting complex/cyclosome: the Apc11 RING-H2 finger, docked
    on the cullin-homology domain of Apc2, binds the ubiquitin-conjugating enzyme Ubc4 directly and activates
    the ubiquitin-charged E2s Ubc4 (chain initiation) and Ubc1 (K48-linked chain elongation) so that ubiquitin
    is transferred directly, without an Apc11 thioester intermediate, to coactivator-bound D-box/KEN-box
    substrates such as the securin Pds1 and the B-type cyclins Clb5 and Clb2, driving their proteasomal
    destruction at the metaphase/anaphase transition and at mitotic exit; Apc11 itself confers no degron
    specificity.
