- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:16481473
  qualifier: involved_in
  review:
    summary: >-
      ComplexPortal NAS row attached to the APC/C core complex (CPX-756) citing Thornton et al. 2006. The
      statement is true but shallow: the APC/C does not merely modulate the mitotic cycle, it executes two
      irreversible transitions by ubiquitinating securin and the B-type cyclins, which the paper identifies
      as the only obligatory APC/C targets, and Apc11 is the RING subunit that catalyses that ubiquitination.
    action: MODIFY
    reason: >-
      'Regulation of mitotic cell cycle' is a broad grouping term. The specific processes this complex-level
      assertion stands for are the metaphase/anaphase transition (Pds1/securin destruction; apc11 ts mutants
      arrest with short spindles and undivided nuclei) and exit from mitosis (Clb2 destruction, which Apc11
      catalyses directly in vitro). Re-express the row with GO:0007091 and GO:0010458, as was done for the
      identical ComplexPortal row on Apc2, rather than keeping an uninformative ancestor; the biology is
      not in doubt.
    proposed_replacement_terms:
    - id: GO:0007091
      label: metaphase/anaphase transition of mitotic cell cycle
    - id: GO:0010458
      label: exit from mitosis
    supported_by:
    - reference_id: PMID:16481473
      supporting_text: >-
        Previously, we showed that the only obligatory targets of the APC for cell cycle progression are
        securin and the B-type cyclins
    - reference_id: PMID:10888670
      supporting_text: >-
        Immunofluorescence staining demonstrated that, for both mutants, >70% of the cells arrested with
        large buds, short mitotic spindles, and DAPI-staining masses at the bud-neck (Figure 1 B).
    - reference_id: PMID:10888670
      supporting_text: >-
        Targets of APC/C include securin proteins (Pds1p in budding yeast and Cut2p in fission yeast), whose
        destruction is required for the separation of sister chromatids at anaphase
    - reference_id: PMID:10888670
      supporting_text: mitotic cyclins, such as Clb2p, which must be destroyed before mitotic exit
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR024991
  review:
    summary: >-
      InterPro2GO mapping from the APC11-type RING-H2 zinc-finger entry IPR024991. The RING-H2 cross-brace
      coordinates zinc through its cysteine/histidine ligands, and Leverson et al. 2000 showed that mutating
      the predicted metal-binding cysteines C41, C44 and C91 abolishes both complementation and E3 activity.
    action: ACCEPT
    reason: >-
      Zinc coordination is structurally required for the RING fold and hence for the ligase activity; the
      mutational data are consistent with this even though zinc content was not measured directly for the
      yeast protein (the human ortholog binds three Zn2+ per RING). The term is a structural, not a functional,
      descriptor, but it is correct.
    supported_by:
    - reference_id: PMID:10888670
      supporting_text: >-
        To test the importance of the RING-H2 domain in Apc11p, we mutated residues predicted to participate
        in metal binding and the formation of the cross-brace motif (Figure 2 A, C41A, C44A, C91A).
    - reference_id: PMID:10888670
      supporting_text: >-
        However, Apc11p bearing mutations in putative metal-binding cysteines (C41, C44, or C91) showed
        little or no activity in this assay (Figure 5 A, lanes 3, 4, and 9), demonstrating that the RING-H2
        finger is absolutely required for its E3 activity.
