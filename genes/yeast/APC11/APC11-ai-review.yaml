  review:
    summary: >-
      PAINT inference from the RING-box family node PTN000129805 that Apc11 binds a cullin-family protein,
      seeded by human RBX1/RBX2/ANAPC11, fly Roc proteins and a Dictyostelium RING-box protein. For Apc11
      the cullin partner is Apc2, whose C-terminal cullin-homology domain anchors the RING subunit to the
      complex.
    action: ACCEPT
    reason: >-
      Pairing with a cullin (or the cullin-like Apc2) is the defining ancestral property of the RING-box
      family, and the yeast data support it in vivo: apc2 deletion causes complete loss of Apc11 from Apc1-TAP
      purifications, whereas apc11 deletion only partially reduces Apc2, so Apc2 independently tethers
      Apc11; cryo-EM of the yeast complex places the Apc2-Apc11 module as a unit. Leverson et al. 2000 could
      not detect a direct interaction between GST-Apc11 and an Apc2 C-terminal fragment in vitro, but that
      negative result with a truncated partner does not outweigh the in vivo dependency and the conserved
      structural pairing. The annotation is informative because it names the specific partner class, unlike
      generic protein binding.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000129805
        source_label: PANTHER:PTN000129805
        source_status: SUPPORTS_TRANSFER
