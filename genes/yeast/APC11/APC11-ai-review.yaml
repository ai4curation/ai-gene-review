- id: PMID:10888670
  title: The APC11 RING-H2 finger mediates E2-dependent ubiquitination.
  findings:
  - statement: Purified Apc11 alone mediates E1- and Ubc4-dependent polyubiquitination of Clb2 in vitro,
      independent of Apc2.
    supporting_text: The ability of Apc11p to act as an E3 was dependent on the integrity of the RING-H2
      finger, but did not require the presence of the cullin-like APC subunit Apc2p.
  - statement: Apc11 binds the E2 Ubc4 directly; W81A and the metal-binding cysteine mutants impair binding
      and E3 activity, and the RING is essential for viability.
    supporting_text: Thus, the Apc11p RING-H2 finger performs a crucial function that is essential for cell
      viability.
  - statement: apc11 ts alleles arrest in mitosis with large buds and short spindles.
    supporting_text: Immunofluorescence staining demonstrated that, for both mutants, >70% of the cells
      arrested with large buds, short mitotic spindles, and DAPI-staining masses at the bud-neck (Figure
      1 B).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Leverson et al. 2000 Mol Biol Cell; full text cached. The defining yeast Apc11 paper: ts alleles,
      RING mutagenesis, direct Ubc4 binding, purified-component ubiquitination of Clb2, and the C-terminal
      tail deletion. Source of the SGD IDA for GO:0061630.
- id: PMID:11114178
  title: Ama1p is a meiosis-specific regulator of the anaphase promoting complex/cyclosome
    in yeast.
  findings:
  - statement: Ama1 is a meiosis-specific Cdc20-family coactivator that associates with the core APC/C
      and directs Clb1 degradation during meiosis I.
    supporting_text: In conclusion, this study indicates that Ama1p directs a meiotic APC/C that functions
      solely outside mitotic cell division.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cooper et al. 2000 PNAS; full text cached. Source of the ComplexPortal NAS rows for the APC/C-Ama1
      variant (CPX-762). Apc11 is not assayed; the paper supports complex-level statements only.
- id: PMID:12477395
  title: Proteomics analysis identifies new components of the fission and budding
    yeast anaphase-promoting complexes.
  findings:
  - statement: TAP/DALPC proteomics brought the yeast APC/C to 13 subunits and showed earlier methods were
      biased against small subunits.
    supporting_text: Our data increase the total number of identified APC subunits to 13 in both yeasts
      and indicate that previous approaches were biased against the identification of small subunits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Yoon et al. 2002 Curr Biol; abstract-only in cache. Source of the ComplexPortal IPI row for APC/C
      membership.
- id: PMID:16481473
  title: An architectural map of the anaphase-promoting complex.
  findings:
  - statement: Apc11 forms with Apc2 and Doc1 the catalytic subcomplex bridged by Apc1 to the TPR subcomplex;
      apc2 deletion removes Apc11 from the complex.
    supporting_text: These data suggest that Apc2 independently tethers Doc1 and Apc11.
  - statement: APC/C purified from strains lacking Apc11 (or any essential subunit other than Cdc27) has
      no detectable Pds1-ubiquitination activity.
    supporting_text: Of the mutant complexes, only cdc27 Δ APC displayed detectable activity against Pds1
  - statement: Securin and the B-type cyclins are the only obligatory APC/C targets for cell-cycle progression.
    supporting_text: Previously, we showed that the only obligatory targets of the APC for cell cycle progression
      are securin and the B-type cyclins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Thornton et al. 2006 Genes Dev; full text cached. Subunit-deletion architecture of the yeast APC/C
      in the APC-nonessential background; source of the SGD IMP rows and the ComplexPortal IDA/NAS rows.
