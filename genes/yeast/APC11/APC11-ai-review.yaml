id: Q12157
gene_symbol: APC11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Apc11 is the 165-residue RING-H2 zinc-finger subunit of the Saccharomyces cerevisiae anaphase-promoting
  complex/cyclosome (APC/C), the 13-subunit cullin-RING E3 ubiquitin ligase that triggers the metaphase-to-anaphase
  transition, drives exit from mitosis and maintains the low-CDK state of G1. Together with the cullin-family
  subunit Apc2 it forms the catalytic module of the complex: the RING-H2 finger binds the ubiquitin-conjugating
  enzyme Ubc4 directly and, in the assembled ligase, activates the ubiquitin-charged E2s Ubc4 (chain initiation)
  and Ubc1 (chain elongation) so that ubiquitin is transferred directly from the E2 to lysines of the substrate
  without an Apc11-ubiquitin thioester intermediate; the resulting chains are predominantly K48-linked and
  target substrates to the 26S proteasome. Purified Apc11 alone supports E1- and Ubc4-dependent polyubiquitination
  of the mitotic cyclin Clb2 in vitro, and this activity depends on the zinc-coordinating cysteines of the
  RING (Cys41, Cys44, Cys91) and on the E2-contacting Trp81, but not on the yeast-specific acidic C-terminal
  tail (residues 104-165). Apc11 confers no substrate specificity: degron (D-box, KEN-box) recognition is
  supplied by the coactivators Cdc20, Cdh1/Hct1 or the meiosis-specific Ama1 together with Doc1/Apc10, while
  Apc2 tethers Apc11 to the Apc1 scaffold and positions the RING for E2 access. Through this activity Apc11
  executes the ubiquitination of the securin Pds1 and of the B-type cyclins (Clb5, Clb2 and, in meiosis, Clb1)
  whose destruction permits sister-chromatid separation, mitotic exit and the first meiotic division. RING-defective
  and temperature-sensitive apc11 mutants arrest as large-budded cells with short spindles and undivided nuclei,
  and the integrity of the RING is essential for viability. Apc11 acts within the nuclear APC/C and is present
  at roughly 400 molecules per cell.
