proposed_new_terms: []
suggested_questions:
- question: >-
    Direct binding of Apc11 to the E2 Ubc4 is demonstrated with purified proteins, yet neither yeast Apc11
    nor human ANAPC11, RBX1 or fission-yeast apc11 carries GO:0031624 ubiquitin conjugating enzyme binding.
    Is E2 engagement deliberately subsumed under ubiquitin protein ligase activity for RING E3s, or would
    an explicit E2-binding annotation on Apc11 (IDA PMID:10888670) be welcome?
- question: >-
    Leverson et al. 2000 could not detect a direct interaction between GST-Apc11 and the Apc2 cullin-homology
    fragment (residues 471-853) in vitro, whereas apc2 deletion removes Apc11 from the complex in vivo.
    Does the yeast Apc2-Apc11 interface, as resolved in the 2024 cryo-EM structures, involve regions N-terminal
    to the cullin homology domain or require Rub1 modification of Apc2?
- question: >-
    No study has imaged Apc11 itself; nuclear localisation is inferred from APC/C-Cdh1 degron reporters
    and tagged TPR subunits. Is there any cytoplasmic pool of Apc11-containing APC/C, and does Apc11 stay
    bound to the complex throughout the cell cycle?
suggested_experiments:
- hypothesis: >-
    The Apc11 RING surface that engages Ubc4 for chain initiation is separable from the surface that supports
    Ubc1-dependent K48 chain elongation, and each is independently required for timely destruction of
    Pds1 and Clb2 in vivo.
  description: >-
    Reconstitute yeast APC/C-Cdh1 with structure-guided Apc11 point mutants at the E2-contacting helix
    (R80/W81 region) and at the RING zinc sites; assay Ubc4-dependent priming and Ubc1-dependent K48 elongation
    on Pds1 and Clb2 in vitro, and measure metaphase duration and Clb2 half-life after replacing endogenous
    APC11 with each mutant.
  experiment_type: structure-guided mutagenesis with in vitro ubiquitination kinetics and cellular
    rescue
- hypothesis: >-
    Endogenous Apc11 is predominantly nuclear throughout the cell cycle and co-localises with the APC/C
    on the spindle and at kinetochores in mitosis.
  description: >-
    Tag APC11 at its genomic locus with a small fluorescent tag at the N terminus (large C-terminal tags
    are known to be temperature sensitive), image through the cell cycle alongside Cdc23-mCherry, and quantify
    nuclear versus cytoplasmic signal in G1, S and mitotic cells.
  experiment_type: endogenous tagging and live-cell imaging
