      5 D, compare lanes 2 and 4).
  - reference_id: PMID:10888670
    supporting_text: >-
      These data indicate that, while Apc11p probably does not confer specificity toward destruction box-containing
      substrates, it is capable of mediating ubiquitin transfer from E2 to proteins other than itself,
