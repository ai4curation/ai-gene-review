id: P37291
gene_symbol: SHM2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SHM2 encodes the cytosolic serine hydroxymethyltransferase, a pyridoxal 5'-phosphate-dependent
  homotetramer that reversibly converts L-serine and tetrahydrofolate to glycine and 5,10-methylenetetrahydrofolate.
  It carries most of the cell's SHMT activity and, when serine is the one-carbon source, is the main provider
  of glycine and of one-carbon units for purine synthesis, converging with the C1-tetrahydrofolate synthase
  Ade3 on cytosolic 5,10-methylene-THF. Shm2 acts with Gly1 (threonine aldolase), Agx1 and the mitochondrial
  paralog Shm1 in glycine synthesis; complete glycine auxotrophy requires loss of SHM1, SHM2 and GLY1.
  Its transcription is controlled by GCN4 general amino acid control. A catalysis-independent genetic
  interaction with SRP40 suggests an additional role related to cell size or ribosome biogenesis.
