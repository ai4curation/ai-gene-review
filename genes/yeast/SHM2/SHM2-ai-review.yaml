suggested_questions:
- question: What is the catalysis-independent function of Shm2 revealed by its genetic interaction with
    SRP40, and does it involve direct binding to snoRNP or ribosome biogenesis factors?
- question: Is Shm2's membership in the SESAME complex required for its metabolic flux, or only for SESAME's
    chromatin role?
suggested_experiments:
- description: Test catalytically dead Shm2 alleles for physical association with Srp40/snoRNP components
    and for rescue of cell-size phenotypes in shm2 ade3 cells.
