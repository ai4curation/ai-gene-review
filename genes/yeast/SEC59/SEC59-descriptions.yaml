descriptions:
- source: UniProt
  text: Catalyzes CTP-mediated phosphorylation of dolichol, the terminal step in de
    novo dolichyl monophosphate (Dol-P) biosynthesis (PubMed:12213788, PubMed:1323123,
    PubMed:2657387). Dol-P is a lipid carrier essential for the synthesis of N-linked
    and O-linked oligosaccharides and for GPI anchors (PubMed:12213788, PubMed:1323123,
    PubMed:2657387).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P20048
  source_id: P20048
- source: Alliance_Imported
  text: Dolichol kinase; catalyzes the terminal step in dolichyl monophosphate (Dol-P)
    biosynthesis; required for viability and for normal rates of lipid intermediate
    synthesis and protein N-glycosylation
  source_type: curated
  url: https://www.yeastgenome.org/locus/SEC59
  source_id: SGD:S000004615
- source: Alliance_Automated
  text: Enables dolichol kinase activity. Involved in dolichyl monophosphate biosynthetic
    process. Located in endoplasmic reticulum membrane. Used to study congenital disorder
    of glycosylation type I. Human ortholog(s) of this gene implicated in congenital
    disorder of glycosylation Im. Orthologous to human DOLK (dolichol kinase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SEC59
  source_id: SGD:S000004615
