suggested_questions:
- question: Which face of the ER membrane does Sec59 phosphorylate dolichol on, and how does the cytosolic CTP substrate
    reach the active site of this polytopic enzyme?
suggested_experiments:
- hypothesis: Sec59 dolichol kinase activity is limiting for Dol-P-dependent glycosylation under stress
  description: Titrate SEC59 expression (tet-off) and quantify Dol-P, Dol-P-Man, LLO and CPY glycosylation, and
    test whether sec59-1 is suppressed by increased dolichol supply (TDA5/DFG10 overexpression).
  experiment_type: genetics / lipidomics
