  label: Saccharomyces cerevisiae S288C
description: SEC59 (YMR013C) encodes dolichol kinase (EC 2.7.1.108), an essential polytopic endoplasmic-reticulum
  membrane protein of the polyprenol kinase family (about 14 predicted transmembrane segments) that phosphorylates
  dolichol with CTP to form dolichyl monophosphate (Dol-P), the terminal step of de novo Dol-P synthesis. Dol-P
  is the lipid carrier for assembly of the N-glycan precursor and the acceptor for Dol-P-mannose and Dol-P-glucose
  synthesis, which feed N-glycosylation, protein O-mannosylation and GPI-anchor synthesis. The temperature-sensitive
  sec59-1 mutant was isolated as a secretion mutant that accumulates underglycosylated precursors in the ER; its
  membranes have greatly decreased dolichol kinase activity and Dol-P falls to under 10% of wild type at the restrictive
  temperature, while Dol-P-mannose synthesis is restored by exogenous Dol-P. Overexpression of SEC59 raises dolichol
  kinase activity about 10-fold. Human DOLK complements sec59-1, and diacylglycerol kinase activity is separate
  from Sec59.
