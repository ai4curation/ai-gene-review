core_functions:
- description: 'Spindle-pole-body-localised small GTPase that initiates the mitotic exit network: GTP-bound
    Tem1, concentrated on the daughter-bound SPB once the anaphase spindle has delivered that pole into
    the bud, engages the protein kinase Cdc15 and recruits it to the Nud1 scaffold, launching the Cdc15
    -> Dbf2-Mob1 -> Cdc14 cascade that reverses mitotic CDK phosphorylation and drives exit from mitosis
    and cytokinesis.'
  supported_by:
  - reference_id: PMID:21321099
    supporting_text: The GTPase Tem1 localizes on the spindle pole bodies (SPBs) and initiates MEN signaling.
    reference_section_type: ABSTRACT
  - reference_id: PMID:21937712
    supporting_text: We further show that both Tem1 and Cdc5 are required to recruit the MEN kinase Cdc15
      to spindle pole bodies, which is both necessary and sufficient to induce MEN signaling.
    reference_section_type: ABSTRACT
  - reference_id: PMID:32074005
    supporting_text: We propose that MEN signaling is initiated by Tem1 at the dSPB and that association
      of the downstream MEN kinases with both SPBs serves to amplify MEN signaling, enabling the timely
      exit from mitosis.
    reference_section_type: ABSTRACT
  - reference_id: PMID:10219244
    supporting_text: In late anaphase, Cdc14 dissociates from RENT, disperses throughout the cell in a
      Tem1-dependent manner, and ultimately triggers mitotic exit.
    reference_section_type: ABSTRACT
  - reference_id: PMID:12628189
    supporting_text: the Amn1 protein that binds directly to Tem1 and prevents its association with its
      target kinase Cdc15
    reference_section_type: ABSTRACT
