  review:
    summary: Geymonat et al. purified recombinant Tem1, Bub2 and Bfa1, measured Tem1's nucleotide binding
      and intrinsic GTPase activity in vitro, and showed that Bfa1 plus Bub2 act together as a two-component
      GAP on Tem1 while Bfa1 alone inhibits both hydrolysis and exchange.
    action: ACCEPT
    reason: Direct in vitro measurement of GTP hydrolysis by purified Tem1 is exactly what GO:0003924
      asserts. The intrinsic rate is slow (later quantified at about 0.011 per minute) but it is a genuine,
      GAP-stimulated catalytic activity that underlies the whole nucleotide cycle of the MEN switch. Abstract-only
      cache, but the abstract states the finding explicitly.
