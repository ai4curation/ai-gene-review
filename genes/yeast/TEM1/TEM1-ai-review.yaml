    summary: 'Scarfone et al. generated Tem1 mutants (Q79L and others) that are refractory to the Bub2/Bfa1
      GAP and showed that constitutively active Tem1 is SPOC-defective: cells with misaligned spindles
      exit mitosis and cytokinesis proceeds, producing aneuploid progeny. GAP-stimulated GTP hydrolysis
      on Tem1 is therefore the step through which the spindle position checkpoint restrains mitotic exit.'
    action: ACCEPT
    reason: 'Tem1 is the node at which the SPOC acts, and the checkpoint output is executed by Tem1''s
      own catalysis: Kin4-protected Bub2-Bfa1 stimulates Tem1 to hydrolyse GTP and leave the SPB, and
      mutants that cannot do so (Q79L) or that cannot be removed from the SPB abolish the checkpoint.
      This is genuine participation, not merely being required. Full text cached; SGD''s IMP is well supported.
      Core, as the inhibitory face of the same switch that drives mitotic exit.'
    supported_by:
    - reference_id: PMID:25658911
      supporting_text: We investigated the mechanism by which the GAP Bub2/Bfa1 controls GTP hydrolysis
        on Tem1 and generated a series of mutants leading to constitutive Tem1 activation. These mutants
        are SPOC-defective and invariably lead to symmetrical localization of Bub2/Bfa1/Tem1 at spindle
        poles, indicating that GTP hydrolysis is essential for asymmetry.
      reference_section_type: ABSTRACT
    - reference_id: PMID:25658911
      supporting_text: Mutation of Q79 into leucine generates a hyperactive, dominant Tem1 that is refractory
        to its GAP, recruits more efficiently Cdc15 to SPBs and leads to unscheduled mitotic exit in the
        presence of spindle positioning defects.
      reference_section_type: DISCUSSION
    - reference_id: PMID:21321099
      supporting_text: We also find that removal of Tem1 from the SPBs is critical for the SPOC to impede
        cell cycle progression.
      reference_section_type: ABSTRACT
