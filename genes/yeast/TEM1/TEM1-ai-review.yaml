  review:
    summary: Campbell et al. quantified MEN-component localisation and showed that movement of the nucleus
      into the bud causes active Tem1 to accumulate on the daughter SPB, that Tem1 then recruits Cdc15,
      and that the downstream kinase cascade accumulates on both SPBs to amplify the signal; MEN signalling
      is initiated by Tem1 at the dSPB.
    action: MODIFY
    reason: 'The biology is correct but ''positive regulation of signaling'' is both too general and the
      wrong relationship: Tem1 is not an external regulator of some signalling process, it is the small
      GTPase that relays the signal at the head of the MEN, a Ras-like signal transduction cascade. The
      direct-participation term GO:0007264 ''small GTPase-mediated signal transduction'' (an intracellular
      signaling cassette in which a small monomeric GTPase relays a signal) describes exactly what the
      paper shows Tem1 doing; the mitotic-exit outcome is already captured by GO:0031536.'
    proposed_replacement_terms:
    - id: GO:0007264
      label: small GTPase-mediated signal transduction
    supported_by:
    - reference_id: PMID:32074005
      supporting_text: Movement of half of the nucleus into the bud during anaphase causes the active
        form of the MEN GTPase Tem1 to accumulate at the dSPB. In response to Tem1's activity at the dSPB,
        the MEN kinase cascade, which functions downstream of Tem1, accumulates at both SPBs.
      reference_section_type: ABSTRACT
    - reference_id: PMID:32074005
      supporting_text: We propose that MEN signaling is initiated by Tem1 at the dSPB and that association
