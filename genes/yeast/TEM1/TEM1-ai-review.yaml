- term:
    id: GO:0040001
    label: establishment of mitotic spindle localization
  evidence_type: IMP
  original_reference_id: PMID:21937712
  qualifier: involved_in
  review:
    summary: Rock and Amon studied how Cdc15 integrates Tem1-derived spatial signals with Cdc5 temporal
      cues; SGD extracted from the full text that cells lacking Tem1 function show defects in positioning
      the mitotic spindle along the mother-bud axis. Independent work shows that MEN activity in metaphase
      drives asymmetric Kar9 distribution on spindle poles, which is required for correct spindle orientation,
      and that altered Tem1 activity or symmetric Bub2-Bfa1-Tem1 localisation perturbs Kar9 asymmetry
      and spindle alignment.
    action: KEEP_AS_NON_CORE
    reason: 'Genuine but secondary and mechanistically indirect: the spindle-orientation role is exerted
      through MEN kinase activity on Kar9 (Dbf2-Mob1 phosphorylation) rather than by Tem1 acting on the
      spindle, and Tem1 inactivation affects Kar9 localisation and spindle orientation without affecting
      spindle positioning at the bud neck. The cache is abstract-only and the abstract does not mention
      spindle positioning, so the curator''s full-text reading is deferred to; retained as a non-core
      pleiotropic role alongside the core mitotic-exit function.'
    supported_by:
    - reference_id: PMID:21937712
      supporting_text: We show here that during an unperturbed cell cycle, restricting MEN activity to
        anaphase can occur in a Tem1 GTPase-independent manner.
      reference_section_type: ABSTRACT
    - reference_id: PMID:25658911
      supporting_text: Thus, asymmetry of the Bub2/Bfa1/Tem1 complex is crucial to control Kar9 distribution
        and spindle positioning during mitosis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:25658911
      supporting_text: Although Tem1 inactivation causes similar phenotypes for what concerns Kar9 localization
