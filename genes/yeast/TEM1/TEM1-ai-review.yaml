  review:
    summary: Scarfone et al. assayed Bub2/Bfa1-stimulated GTP hydrolysis on purified Tem1 in vitro and
      showed that the switch-II mutant Tem1-Q79L is completely refractory to GAP stimulation, behaving
      in vivo as a hyperactive, GTP-locked GTPase that is SPOC-defective and symmetrically localised.
    action: ACCEPT
    reason: 'Full-text evidence: in vitro GTP hydrolysis assays on wild-type Tem1 versus Q79L directly
      demonstrate the GTPase activity and its dependence on the catalytic glutamine. Confirms and extends
      the Geymonat 2002 IDA; core catalytic activity of the gene product.'
    supported_by:
    - reference_id: PMID:25658911
      supporting_text: We investigated the mechanism by which the GAP Bub2/Bfa1 controls GTP hydrolysis
        on Tem1 and generated a series of mutants leading to constitutive Tem1 activation. These mutants
        are SPOC-defective and invariably lead to symmetrical localization of Bub2/Bfa1/Tem1 at spindle
        poles, indicating that GTP hydrolysis is essential for asymmetry.
      reference_section_type: ABSTRACT
    - reference_id: PMID:25658911
      supporting_text: Tem1-Q79L was completely refractory to stimulation of GTP hydrolysis by the GAP
        Bub2/Bfa1 in vitro, suggesting that in vivo it is preferentially in its active GTP-bound form.
      reference_section_type: RESULTS
