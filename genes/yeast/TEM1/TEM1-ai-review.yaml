  review:
    summary: Wang et al. showed that Tem1 binds its target kinase Cdc15 and that the daughter-specific
      Amn1 protein competes with Cdc15 for Tem1, thereby switching MEN signalling off after mitotic exit.
      UniProt records the same finding (AMN1 and CDC15 compete for association with TEM1).
    action: MODIFY
    reason: 'The Tem1-Cdc15 interaction is the defining effector interaction of a signalling GTPase: GTP-bound
