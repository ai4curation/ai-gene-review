  review:
    summary: PAINT inference at the Tem1/Spg1 node PTN000634389 from fission-yeast Spg1, the GTPase that
      initiates the septation initiation network (SIN) and thereby septum formation. In budding yeast
      the orthologous MEN, initiated by Tem1, is likewise required for cytokinesis including primary septum
      formation (Cdc14 and Dbf2-Mob1 act on Chs2, Inn1, Iqg1 and other cytokinesis regulators), and budding-yeast
      genes such as DBF20 and MNN10 are annotated to division septum assembly.
    action: KEEP_AS_NON_CORE
    reason: 'The node placement is reasonable: both Spg1 and Tem1 sit atop SPB-scaffolded kinase cascades
      whose outputs include septum/cytokinesis regulation, and hyperactive Tem1-Q79L accelerates actomyosin-ring
      contraction in budding yeast. However, in S. cerevisiae the septation output is several steps downstream
      of Tem1 (via Cdc15, Dbf2-Mob1 and Cdc14) and the SIN-centric wording reflects the fission-yeast
      donor; the core budding-yeast process is positive regulation of exit from mitosis, with cytokinesis
      as a downstream consequence. Kept as a non-core, family-level role.'
    supported_by:
