gene_symbol: TEM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Tem1 is the essential Ras/Rab-like small GTPase of Saccharomyces cerevisiae that sits at
  the head of the mitotic exit network (MEN), the SPB-scaffolded, Hippo-like kinase cascade that ends
  mitosis. It binds GTP and GDP with unusually low (micromolar) affinity, exchanges nucleotide spontaneously,
  and hydrolyses GTP slowly on its own but some 400-fold faster when stimulated by the two-component GTPase-activating
  protein Bub2-Bfa1, in which Bfa1 binds Tem1 and Bub2 supplies the catalytic TBC domain. Bub2-Bfa1 is
  also Tem1''s receptor at the cytoplasmic face of the spindle pole body: Tem1 accumulates preferentially
  on the SPB destined for the bud, and when that pole enters the daughter cell in anaphase, away from
  the mother-confined Kin4 kinase that keeps the GAP active, Tem1 builds up on the daughter SPB and engages
  its effector, the protein kinase Cdc15. Tem1 recruits Cdc15 to the SPB scaffold Nud1, where Cdc15 phosphorylates
  Nud1 to dock and activate the Dbf2-Mob1 kinase; Dbf2-Mob1 then phosphorylates Cdc14 so that the phosphatase,
  released from its nucleolar Net1/RENT anchor, spreads through the cell, reverses mitotic CDK phosphorylation
  and drives cyclin destruction, mitotic exit and cytokinesis. The GTP-bound form is preferentially recruited
  to SPBs and binds Cdc15 more tightly, but Cdc15 discriminates only modestly between nucleotide states,
  and the current view is that spindle position controls Tem1 chiefly by setting its local concentration
  at the SPB rather than by switching its GTP:GDP ratio; concentrating Tem1 artificially at SPBs or in
  cytoplasmic assemblies bypasses the need for nucleotide binding. The same GAP-controlled hydrolysis
  makes Tem1 the target of the spindle position checkpoint: on mispositioned spindles Tem1 remains GDP-bound
  and symmetrically distributed, mitotic exit is delayed, and GAP-refractory mutants such as Tem1-Q79L
  exit mitosis regardless of spindle position and yield aneuploid cells. In metaphase, MEN activity emanating
  from asymmetric Bub2-Bfa1-Tem1 also promotes asymmetric loading of Kar9 on spindle poles and thus correct
  spindle orientation toward the bud. After exit, the daughter-specific Amn1 protein binds Tem1 and displaces
  Cdc15 to reset the pathway for G1. Tem1 is orthologous to the fission-yeast Spg1 GTPase that initiates
  the septation initiation network.'
