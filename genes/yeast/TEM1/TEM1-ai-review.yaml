suggested_questions:
- question: Does Tem1 binding activate the Cdc15 kinase allosterically, or does it act purely by concentrating
    Cdc15 at the SPB scaffold? Cdc15 binds Tem1-GTP only about fourfold more tightly than Tem1-GDP, so
    the mechanism that converts Tem1 engagement into productive, SPB-competent Cdc15 remains unresolved.
- question: Is Lte1 a genuine guanine-nucleotide exchange factor for Tem1 in vivo, or does it promote
    mitotic exit only by confining Kin4 and Bfa1? The measured spontaneous exchange rate of Tem1 suggests
    that no GEF is required, which would argue against annotating Lte1 with GEF activity toward Tem1.
- question: Should the Tem1/Spg1-family IBA to 'positive regulation of mitotic division septum assembly'
    be re-expressed for budding yeast as positive regulation of cytokinesis, given that the septation
    output in S. cerevisiae is several kinase steps downstream of Tem1?
suggested_experiments:
- description: Direct measurement of the nucleotide state of endogenous Tem1 across the cell cycle (e.g.
    rapid pull-down of Tem1 from synchronised cultures followed by HPLC or mass-spectrometric GDP/GTP
    quantification) to test the model that the Tem1 GTP:GDP ratio does not rise at anaphase and that localisation
    rather than nucleotide switching controls MEN activation.
  experiment_type: biochemistry
- description: In vitro reconstitution of Cdc15 kinase activation on purified Nud1-containing SPB fragments
    with Tem1 in defined nucleotide states, to distinguish allosteric activation of Cdc15 by Tem1 from
    concentration-dependent recruitment.
  experiment_type: biochemistry
