gene_symbol: TEM1
organism: yeast
uniprot_id: P38987
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: GTP-binding protein involved in termination of M phase. May play a role in
    triggering the degradation of G2 cyclin to inactivate M- phase promoting factor
    at the termination of mitosis. Acts upstream of CDC15 kinase and may be required
    to activate the CDC15 protein kinase pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38987
  source_id: P38987
- source: Alliance_Imported
  text: GTPase involved in initiation of Mitotic Exit Network (MEN); GTP-binding protein
    of the Ras superfamily; accumulates at daughter spindle pole body and activates
    MEN kinase cascade; controls actomyosin and septin dynamics during cytokinesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/TEM1
  source_id: SGD:S000004529
- source: Alliance_Automated
  text: Enables GTPase activity. Involved in several processes, including establishment
    of mitotic spindle localization; negative regulation of protein localization to
    nucleolus; and regulation of exit from mitosis. Located in spindle pole body.
  source_type: automated
  url: https://www.yeastgenome.org/locus/TEM1
  source_id: SGD:S000004529
