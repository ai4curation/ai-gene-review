descriptions:
- source: UniProt
  text: GTP-binding protein involved in termination of M phase. May play a role in
    triggering the degradation of G2 cyclin to inactivate M- phase promoting factor
    at the termination of mitosis. Acts upstream of CDC15 kinase and may be required
    to activate the CDC15 protein kinase pathway.
