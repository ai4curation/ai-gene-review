  review:
    summary: IBA from PTN000599576, the adenylate kinase node that also covers ATP-using AK1/AK2 enzymes.
      Adk2 sits in the AK3 (GTP:AMP) subclade and has target-specific biochemical evidence that ATP is
      not a phosphate donor, so the ATP:AMP activity is lost/diverged in this lineage. The correct activity
      is captured by the IBA to nucleoside triphosphate adenylate kinase activity from the AK3 node.
    action: REMOVE
    reason: Adk2 (yeast AK3 orthologue) uses GTP or ITP but does not accept ATP as phosphate donor, so
      ATP:AMP 'AMP kinase activity' is incorrect for this protein.
