suggested_questions:
- question: What is the physiological role of the matrix GTP:AMP phosphotransferase, given that its loss
    has no phenotype (e.g. recycling AMP from matrix acyl-CoA synthetases using succinyl-CoA synthetase-derived
    GTP)?
- question: Is the inner-membrane association of Adk2 functionally significant or a fractionation artefact?
suggested_experiments:
- description: Measure matrix AMP/GTP/GDP pools and acyl-CoA synthetase-dependent processes (e.g. lipoylation,
    mtFAS) in adk2 null cells under respiratory growth and heat stress.
