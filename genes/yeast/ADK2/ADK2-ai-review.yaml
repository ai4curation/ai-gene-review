id: P26364
gene_symbol: ADK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADK2 (AKY3/PAK3; YER170W) encodes the mitochondrial matrix GTP:AMP phosphotransferase of
  S. cerevisiae, the orthologue of vertebrate AK3. It catalyses NTP + AMP -> NDP + ADP using GTP or ITP
  but not ATP as phosphate donor. A strain-dependent frameshift near the 3' end yields a short (PAK3)
  or long (AKY3) C-terminus; both forms are active at 30 C, but the long form is more stable to heat and
  denaturation. Expression is low on glucose and rises on non-fermentable carbon sources. Disruption has
  no detectable phenotype, so its physiological role in mitochondrial nucleotide homeostasis (e.g. recycling
  AMP and GTP generated in the matrix) remains undefined.
