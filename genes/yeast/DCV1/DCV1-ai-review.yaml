knowledge_gaps:
- gap_statement: The molecular function of DCV1 is unknown. No catalytic activity,
    transport activity, or specific binding partner has been assigned to DCV1, and
    the Sur7/PalI/Rim9 family to which it belongs has no defined molecular activity
    — its members are non-catalytic tetraspan membrane proteins whose scaffolding/sensing
    role is not captured by any GO molecular-function term. PMID:36601911 establishes
    a cellular role in plasma-membrane and polarity organization, but not a defined
    molecular activity.
  boundary: DCV1 is firmly established as a 202-residue polytopic integral membrane
    protein (N-terminal signal peptide plus three transmembrane helices) belonging
    to the fungal Sur7/PalI/Rim9 family (Pfam SUR7; InterPro IPR009571; PANTHER PTHR28013,
    subfamily SF3 with the PalI/Rim9 orthologs, including the S. cerevisiae paralog
    RIM9). Its WGD paralog is TOS7. What is NOT known is any activity the protein
    performs.
  gap_kind:
  - BIOLOGY
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: DCV1 is a conserved-family plasma-membrane protein with a demonstrated
    pheromone-polarity phenotype but no resolved molecular mechanism. Assigning its
    activity would clarify how a Sur7/PalI-family claudin-like protein restricts
    plasma-membrane lipid distribution and would show whether this is a scaffolding,
    sensing or organizing activity.
  resolution: DCV1-specific biochemistry and interaction mapping (affinity/proximity
    proteomics, reconstitution) to identify partners or any activity; and, for the
    ontology gap, a GO molecular-function term for the scaffolding/pH-sensing activity
    of Sur7/PalI-family tetraspan membrane proteins.
  provenance:
  - reference_id: PMID:36601911
    supporting_text: We propose that Dcv1 helps demarcate the mating-specific front
      domain primarily by restricting PM lipid distribution.
    reference_section_type: ABSTRACT
- gap_statement: The exact GO biological-process term for DCV1's pheromone-response
    polarity role remains unresolved. PMID:36601911 establishes that Dcv1 influences
    mating-specific front-rear polarity, pheromone-gradient tracking, cell fusion
    and plasma-membrane lipid restriction, but the full text should be curated before
    choosing a specific term and separating direct participation from downstream
    phenotypes.
  boundary: dcv1 deletion is viable under standard conditions but is lethal/synthetically
    sick when Cdc28 activity is compromised, and dcv1 was a hit in a genome-wide
    chemical-genetic screen of the CDC28 network. The DCV1-specific pheromone-polarity
    phenotype is now the strongest biological-process lead; membership in the PalI/Rim9
    subfamily remains only homology-based support for any Rim101 or ambient-pH role.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: A precise process term would connect DCV1 to the mating-cell polarity
    program without over-reading downstream fusion or gradient-tracking phenotypes
    as direct functions.
  resolution: Read and curate the full PMID:36601911 paper, then test dcv1 for defects
    in Rim101 processing / alkaline-pH growth; dissect the dcv1-cdc28 genetic interaction
    by epistasis or suppressors; and test functional redundancy with the paralog
    TOS7 via a dcv1 tos7 double mutant.
  provenance:
  - reference_id: PMID:36601911
    supporting_text: dcv1Δ conferred mislocalization of sensory, polarity and trafficking
      proteins, as well as PM lipids. These phenotypes correlated with defects in
      pheromone-gradient tracking and cell fusion.
    reference_section_type: ABSTRACT
- gap_statement: The relationship between DCV1's plasma-membrane pool and its curated
    nuclear-envelope pool remains unresolved. PMID:36601911 establishes plasma-membrane
    localization in vegetative and pheromone-responding cells, while SGD curates a
    nuclear-envelope IDA from PMID:33002606 whose full text is still not cached.
  boundary: DCV1 is certainly membrane-embedded, and plasma-membrane localization
    is now directly supported for Dcv1. What remains unknown is whether the nuclear-envelope
    signal represents a functional second location, a biosynthetic/ER pool of a secretory-pathway
    membrane protein, or a construct-specific condition in the Tos7-focused paper.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: The plasma membrane is directly supported, but the nuclear-envelope
    evidence should be reconciled before deciding whether DCV1 has a condition-specific
    nuclear-envelope function.
  resolution: Read the full PMID:33002606 source and image endogenously tagged Dcv1
    against nuclear-envelope/ER, plasma-membrane/eisosome and bud-neck markers under
    standard, pheromone and alkaline-pH conditions.
  provenance:
  - reference_id: PMID:36601911
    supporting_text: Although Dcv1 localized uniformly on the plasma membrane (PM)
      of vegetative cells, it was confined to the rear of cells responding to pheromone,
      away from the pheromone receptor.
    reference_section_type: ABSTRACT
suggested_questions:
- question: Does DCV1 function in the Rim101/PacC ambient-pH signalling pathway, as
    its PalI/Rim9 subfamily membership suggests, or has it diverged from that role?
- question: Why is DCV1 required for viability specifically when Cdc28 (Cdk1) activity
    is limiting, and what does this reveal about a link between a Sur7/PalI membrane
    protein and the cell cycle?
- question: Is DCV1 functionally redundant with its whole-genome-duplication paralog
    TOS7?
- question: Does any endogenously tagged Dcv1 pool enrich at the bud neck or cytokinesis
    plane, or is the inherited cell-division-site IBA also a fission-yeast localization
    over-propagated to budding yeast?
- question: What is the exact GO biological-process term for Dcv1-dependent restriction
    of plasma-membrane lipids during mating front-rear polarity?
suggested_experiments:
- description: Endogenously tag DCV1 (e.g. C-terminal GFP) and image it against nuclear-envelope/ER
    and plasma-membrane/eisosome (MCC) markers under standard, pheromone and alkaline-pH
    conditions to resolve the nuclear-envelope IDA relative to the directly observed
    pheromone-responsive plasma-membrane pool.
  hypothesis: DCV1 may have condition-dependent nuclear-envelope and plasma-membrane
    pools; simultaneous compartment markers and endogenous tagging can determine their
    distribution.
- description: Assay dcv1 mutants for Rim101 proteolytic processing and for growth
    at alkaline pH, and test genetic interactions with RIM9 and other RIM-pathway
    genes.
  hypothesis: DCV1 contributes to the Rim101 pH-response pathway characteristic of
    its PalI/Rim9 subfamily.
- description: Construct dcv1 tos7 single and double deletions and characterize growth,
    cell-wall stress sensitivity, secretion, and CDC28-dependence to test paralog
    redundancy.
  hypothesis: DCV1 and its WGD paralog TOS7 share overlapping functions masked by
    redundancy in single mutants.
- description: Image endogenously tagged Dcv1 with a septin or Myo1 bud-neck marker
    throughout the cell cycle to test the inherited cell-division-site localization.
  hypothesis: The PANTHER cell-division-site IBD may reflect fission-yeast source
    localization that is not inherited by budding-yeast Dcv1.
