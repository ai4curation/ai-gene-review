core_functions:
- description: >-
    DCV1 is a Sur7/PalI-family polytopic membrane protein with no resolved specific molecular activity. Curated direct-assay evidence places it at the nuclear envelope; conserved family inference also motivates plasma-membrane and polarized-growth-site hypotheses. These locations are not mutually exclusive. A defined catalytic, binding or scaffolding activity has not yet been established for this target.
