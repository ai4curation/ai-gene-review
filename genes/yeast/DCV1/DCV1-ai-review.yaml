core_functions:
- description: DCV1 is a Sur7/PalI-family polytopic membrane protein with no resolved
    specific molecular activity. Direct imaging places Dcv1 at the plasma membrane
    in vegetative cells and at the rear of pheromone-responding cells, and dcv1 loss
    disrupts plasma-membrane lipid and mating-polarity protein distribution. DCV1
    has also been reported at the nuclear envelope, most plausibly as a second or
    conditional membrane pool. A defined catalytic, binding or scaffolding activity
    has not yet been established for this target.
