gene_symbol: DCV1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: DCV1 (systematic name YFR012W) is a small (202-residue) polytopic integral
  membrane protein of the budding yeast Saccharomyces cerevisiae. It has an N-terminal
  signal sequence and three predicted transmembrane helices, and belongs to the fungal
  Sur7/PalI/Rim9 family of tetraspan membrane proteins (Pfam SUR7 / InterPro SUR7-Rim9-like;
  PANTHER PTHR28013), which also contains its budding-yeast paralog RIM9 and, by whole-genome
  duplication, TOS7. Family members are plasma-membrane / eisosome-associated proteins;
  DCV1 localizes to the plasma membrane in vegetative cells, is excluded from the
  pheromone-response front, has also been reported at the nuclear envelope, and is
  required for normal mating front-rear polarity; it is proposed to act by restricting
  plasma-membrane lipid distribution. Its molecular activity remains unresolved.
  It is dispensable for viability under standard conditions, and its principal recorded
  genetic characteristic is a requirement for Cdc28 (Cdk1) activity for viability
  -- the source of its name, "Demands Cdc28 kinase activity for Viability".
