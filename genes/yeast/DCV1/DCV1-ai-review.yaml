  label: Saccharomyces cerevisiae
description: >-
  DCV1 (systematic name YFR012W) is a small (202-residue) polytopic integral membrane protein of the budding yeast Saccharomyces cerevisiae. It has an N-terminal signal sequence and three predicted transmembrane helices, and belongs to the fungal Sur7/PalI/Rim9 family of tetraspan membrane proteins (Pfam SUR7 / InterPro SUR7-Rim9-like; PANTHER PTHR28013), which also contains its budding-yeast paralog RIM9 and, by whole-genome duplication, TOS7. Family members are plasma-membrane / eisosome-associated proteins, and several act in the fungal Rim101/PacC ambient-pH signalling pathway; DCV1 has itself been localized to the nuclear envelope. Its own molecular function and biological role are not experimentally established. It is dispensable for viability under standard conditions, and its principal recorded genetic characteristic is a requirement for Cdc28 (Cdk1) activity for viability — the source of its name, "Demands Cdc28 kinase activity for Viability".
