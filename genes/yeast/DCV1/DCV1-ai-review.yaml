suggested_questions:
- question: >-
    Does DCV1 function in the Rim101/PacC ambient-pH signalling pathway, as its PalI/Rim9 subfamily membership suggests, or has it diverged from that role?
- question: >-
    Why is DCV1 required for viability specifically when Cdc28 (Cdk1) activity is limiting, and what does this reveal about a link between a Sur7/PalI membrane protein and the cell cycle?
- question: >-
    Is DCV1 functionally redundant with its whole-genome-duplication paralog TOS7?
suggested_experiments:
- description: >-
    Endogenously tag DCV1 (e.g. C-terminal GFP) and image it against nuclear-envelope/ER and plasma-membrane/eisosome (MCC) markers under standard and alkaline-pH conditions to resolve the conflicting nuclear-envelope (IDA) vs plasma-membrane (IBA/IEA) localizations.
  hypothesis: >-
    DCV1 may have condition-dependent nuclear-envelope and plasma-membrane pools; simultaneous compartment
    markers and endogenous tagging can determine their distribution.
- description: >-
    Assay dcv1 mutants for Rim101 proteolytic processing and for growth at alkaline pH, and test genetic interactions with RIM9 and other RIM-pathway genes.
  hypothesis: >-
    DCV1 contributes to the Rim101 pH-response pathway characteristic of its PalI/Rim9 subfamily.
- description: >-
    Construct dcv1 tos7 single and double deletions and characterize growth, cell-wall stress sensitivity, secretion, and CDC28-dependence to test paralog redundancy.
  hypothesis: >-
    DCV1 and its WGD paralog TOS7 share overlapping functions masked by redundancy in single
    mutants.
