    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: 'RCO1 contains two PHD (plant homeobox) zinc finger domains (residues
      260-309 and 414-472) that

      coordinate zinc ions as structural cofactors. The UniProt record explicitly
      identifies these ZN_FING

      features with PHD-type zinc fingers. Zinc binding is essential for the structural
