- id: file:yeast/RCO1/RCO1-deep-research-falcon.md
  title: Falcon deep research report on RCO1 (Q04779, YMR075W)
  findings:
  - statement: 'RCO1 (Q04779/YMR075W) encodes Rco1, a non-catalytic PHD zinc-finger
      chromatin

      regulatory protein that is a unique, defining subunit of the Rpd3S histone

      deacetylase complex. It is not itself a deacetylase but acts as a reader,

      targeting, and regulatory subunit required for Rpd3S activity and chromatin

      engagement at gene bodies.

      '
    supporting_text: '**RCO1 encodes Rco1, a non-catalytic chromatin regulatory protein**.
      It is not itself a histone deacetylase; rather, it is a **reader/targeting and
      regulatory subunit** required for proper activity and chromatin engagement of
      the **Rpd3S (Rpd3 small) HDAC complex**.'
    reference_section_type: OTHER
  - statement: 'Rco1 contains two plant homeodomain (PHD) zinc-finger modules (PHD1
      and PHD2)

      that bind the extreme N-terminus of histone H3 (H3 1-20). H3K4 trimethylation

      reduces this binding, providing a mechanism that restricts Rpd3S away from

      H3K4me3-rich promoter nucleosomes. The PHD fingers thus read unmodified H3K4

      (H3K4me0).

      '
    supporting_text: Rco1 contains **two plant homeodomain (PHD) zinc-finger modules
      (PHD1 and PHD2)**. Biochemical evidence indicates that both PHD1 and PHD2 bind
      the **extreme N-terminus of histone H3 (H3 1–20)** and that **H3K4 trimethylation
      reduces binding**—a mechanism that helps restrict Rpd3S away from promoter nucleosomes
      enriched in H3K4me3.
    reference_section_type: OTHER
  - statement: 'The primary biological role of Rpd3S, dependent on Rco1, is to deacetylate

      histones in coding regions in the wake of RNA Pol II, suppressing cryptic

      (spurious intragenic) transcription initiation. Recruitment is coupled to the

      Set2-dependent H3K36 methylation pathway, read by Eaf3, with Rco1 contributing

      complementary histone-tail engagement.

      '
    supporting_text: Rpd3S is a histone deacetylase complex that operates **co-transcriptionally
      across coding regions (ORFs/gene bodies)** to remove histone acetylation “in
      the wake” of RNA polymerase II (Pol II), thereby **suppressing cryptic (spurious
      intragenic) transcription initiation**. Rco1 is one of the Rpd3S-specific subunits
      underlying this gene-body surveillance function.
    reference_section_type: OTHER
  - statement: 'Rco1 is a critical interaction hub within Rpd3S, which is classically
      a

      five-subunit complex (Rpd3, Sin3, Ume1, Eaf3, Rco1). Structural studies show

      two copies of Rco1 and two copies of Eaf3 organized around catalytic Rpd3;

      the homodimeric Rco1 is required for full function and forms Eaf3-Rco1 modules

      via a Sin3 interaction domain (SID) engaging the Eaf3 MRG domain.

      '
    supporting_text: 'Rpd3S is classically described as a five-subunit complex (Rpd3,
      Sin3, Ume1, Eaf3, Rco1). Mechanistic work shows Rco1 is a critical interaction
      hub: Rco1 forms key contacts with Eaf3 (via a Sin3 interaction domain/SID interacting
      with Eaf3’s MRG domain) and is required for full Rpd3S nucleosome engagement
      and cryptic transcription suppression.'
    reference_section_type: OTHER
  - statement: 'Rco1 is predominantly chromatin-associated and localizes to active
      ORFs/gene

      bodies rather than promoters, consistent with the co-transcriptional, gene-body

      role of Rpd3S. Fractionation places wild-type Rco1 mainly in the chromatin

      fraction.

      '
    supporting_text: Rco1 is predominantly **chromatin-associated** and localizes
      to **active ORFs / gene bodies** rather than promoters, consistent with Rpd3S
      function in transcribed coding regions. Fractionation studies place wild-type
      Rco1 mainly in the **chromatin fraction**.
    reference_section_type: OTHER
  - statement: 'RCO1/YMR075W/Q04779 is the PHD zinc-finger/plant homeodomain-containing

      chromatin regulator subunit of Rpd3S, not an enzyme on its own. The zinc-finger

      PHD modules require coordinated zinc for their fold and histone-mark reader

      activity.

      '
    supporting_text: '**RCO1/YMR075W/UniProt Q04779** in *Saccharomyces cerevisiae*
      is the **Rco1** subunit of the **Rpd3S histone deacetylase complex**; primary
      literature describes it as a **PHD zinc-finger/plant homeodomain-containing**
      chromatin regulator, not an enzyme on its own.'
    reference_section_type: OTHER
