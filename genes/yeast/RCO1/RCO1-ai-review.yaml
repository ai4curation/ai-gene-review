- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: NAS
  original_reference_id: PMID:9512514
  review:
    summary: 'RCO1 is part of the Rpd3S complex, which suppresses cryptic transcription
      initiation within gene

      bodies. This represents negative regulation of transcription at internal promoters.
      However, the

      evidence is NAS (derived from ComplexPortal annotation), indicating this is
      a statement from the

      literature without direct experimental evidence in the cited paper.

      '
    action: KEEP_AS_NON_CORE
    reason: 'The annotation is mechanistically correct - Rpd3S does negatively regulate
      transcription by

      suppressing cryptic initiation. However, RCO1''s specific role is in H3K4me0
      / unmodified-H3

      recognition (via its PHD fingers) and complex assembly, not direct transcription
      regulation

      (recognition of H3K36me3 is contributed by the Eaf3 chromodomain). The negative
      regulation is a

      consequence of chromatin organization. The more specific and core function is
      "negative regulation of antisense

      RNA transcription" (GO:0060195), which better captures RCO1''s role in maintaining
      promoter

      directionality. This broader annotation should be marked non-core.

      '
    supported_by:
    - reference_id: PMID:9512514
      supporting_text: Histone deacetylase activity of Rpd3 is important for transcriptional
        repression in vivo
    - reference_id: file:yeast/RCO1/RCO1-deep-research-falcon.md
      supporting_text: Rpd3S is a histone deacetylase complex that operates **co-transcriptionally
