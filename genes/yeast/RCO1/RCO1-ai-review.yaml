        source_status: SUPPORTS_TRANSFER
        comment: Current PTHR47636 IBD for the fungal Rco1-family role in Pol II transcriptional
          regulation through Rpd3S; RCO1 is inside the annotated clade and has direct
          yeast support.
  qualifier: involved_in
