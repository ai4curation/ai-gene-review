    summary: 'RCO1 is required for maintaining transcription of many genes by suppressing
      cryptic transcription

      and maintaining productive transcription elongation. Deletion of rco1 causes
      reduction in expression

      of many genes and activation of cryptic transcripts. This could be viewed as
