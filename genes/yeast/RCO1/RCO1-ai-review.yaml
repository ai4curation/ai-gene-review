taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'RCO1 (Regulator of Chromatin Organization 1) is a 684-amino acid transcriptional
  regulatory protein that functions as an essential subunit of the Rpd3S histone deacetylase
  complex. It contains two PHD (plant homeobox) zinc finger domains that bind the
  extreme N-terminus of histone H3 and preferentially read the unmodified H3 tail
  (H3K4me0), with H3K4 trimethylation reducing binding. RCO1''s PHD fingers thus provide
  one reader module, while recognition of the H3K36me3 mark is contributed by the
  chromodomain of its partner subunit Eaf3; the two distinct reader modules act together
  to restrict Rpd3S to H3K36-methylated gene bodies while excluding it from H3K4me3-rich
  promoter chromatin. RCO1 exists as a homodimer within Rpd3S and serves as a central
  interaction hub coordinating complex assembly and nucleosome deacetylation. By combining
  its own H3K4me0/unmodified-H3-tail readout with Eaf3-mediated H3K36me3 recognition,
  RCO1 enables Rpd3S to suppress cryptic transcription initiation within gene bodies
  and maintain proper chromatin structure during transcription elongation.

  '
existing_annotations:
- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  supporting_entities:
  - PANTHER:PTN001236278
  - SGD:S000004680
  review:
    summary: 'The PANTHER IBA annotation to regulation of transcription by RNA polymerase
      II traces to the

      current PTN001236278 IBD in the Rco1 family. The term is broad, but sound: Rco1
      is the

      Rpd3S-specific chromatin reader/scaffold subunit that helps the complex maintain
      coding-region

      histone hypoacetylation and suppress cryptic intragenic and antisense initiation
      during Pol II

      transcription.

      '
    action: KEEP_AS_NON_CORE
    reason: 'The inherited process is consistent with the direct budding-yeast evidence
      used to seed

      PTN001236278. Although RCO1 does not bind DNA as a sequence-specific transcription
      factor or

      modify Pol II directly, GO:0006357 covers modulation of transcription by RNA

      polymerase II; Rco1 executes that process as part of Rpd3S by recognizing/positioning

      H3K36me-marked coding-region chromatin for Rpd3-dependent deacetylation. Negative
      regulation of antisense RNA transcription and the proposed chromatin organization
      row below capture more specific facets, so the broad parent is sound but non-core.

      '
    supported_by:
    - reference_id: file:yeast/RCO1/RCO1-deep-research-perplexity.md
      supporting_text: The primary biological function of the Rpd3S complex, which
        depends critically on proper Rco1 function, is to suppress the initiation
        of cryptic transcripts that would otherwise initiate from internal promoters
        within the bodies of actively transcribed genes
    - reference_id: file:yeast/RCO1/RCO1-deep-research-falcon.md
      supporting_text: Rpd3S is a histone deacetylase complex that operates **co-transcriptionally
        across coding regions (ORFs/gene bodies)** to remove histone acetylation “in
        the wake” of RNA polymerase II (Pol II), thereby **suppressing cryptic (spurious
        intragenic) transcription initiation**. Rco1 is one of the Rpd3S-specific
        subunits underlying this gene-body surveillance function.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
