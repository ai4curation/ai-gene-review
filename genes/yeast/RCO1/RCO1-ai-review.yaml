  review:
    summary: 'RCO1 interacts with multiple protein partners including Hsp90 chaperone,
      Rpd3, Sin3, Ume1, Eaf3,

      and other complex members. Multiple IPI annotations from co-immunoprecipitation
      studies demonstrate

      protein-protein interactions. However, "protein binding" is an uninformative
      molecular function term

      that does not describe the specific binding interactions or their biological
      significance. The specific

      interaction partners and complexes are already captured by other annotations
      (Rpd3S complex membership).

      '
    action: REMOVE
    reason: 'While RCO1 does bind proteins (as documented by multiple IPI studies
      from PMIDs 15766533, 16429126,

      16554755, 17101441, 19536198, 21179020, 23878396, 24843044, and 37968396), the
      term "protein binding"

      is too generic and uninformative. It does not distinguish between interaction
      partners or provide

      functional context. The specific interactions that matter most - with Rpd3S
      complex subunits Rpd3,

      Sin3, Ume1, and Eaf3 - are already captured by the "part_of: Rpd3S complex"
      annotation, while the

      high-throughput chaperone and interactome rows do not establish a more specific
      molecular-function

      term for Rco1. Removal only rejects the bare GO:0005515 assertion as uninformative.

      '
    supported_by:
