- term:
    id: GO:0006334
    label: nucleosome assembly
  evidence_type: NAS
  original_reference_id: PMID:22177115
  review:
    summary: 'The Rpd3 core complex is described as a "chromatin stabilization module"
      that maintains nucleosome

      integrity and prevents nucleosome eviction. This could be interpreted as related
      to nucleosome

      assembly, though it is more accurately described as nucleosome maintenance and
      stabilization.

      '
    action: MARK_AS_OVER_ANNOTATED
    reason: 'RCO1''s role is chromatin stabilization and nucleosome maintenance, not
      nucleosome assembly per se.

      The term "nucleosome assembly" typically refers to the assembly of nucleosome
      core particles from

      histone proteins and DNA, which is not RCO1''s primary function. RCO1 maintains
      existing nucleosomes

      and prevents their disruption during transcription. The proposed chromatin organization
      row captures that Rpd3S function more directly than nucleosome assembly.

      '
    supported_by:
    - reference_id: PMID:22177115
      supporting_text: The Rpd3 core complex is a chromatin stabilization module
  qualifier: involved_in
