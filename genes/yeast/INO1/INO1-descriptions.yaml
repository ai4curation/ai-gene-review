descriptions:
- source: UniProt
  text: Key enzyme in myo-inositol biosynthesis pathway that catalyzes the conversion
    of glucose 6-phosphate to 1-myo-inositol 1- phosphate in a NAD-dependent manner
    (PubMed:14684747, PubMed:23902760, Ref.6, Ref.8). Rate-limiting enzyme in the
    synthesis of all inositol- containing compounds (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P11986
  source_id: P11986
- source: Alliance_Imported
  text: Inositol-3-phosphate synthase; involved in synthesis of inositol phosphates
    and inositol-containing phospholipids; transcription is coregulated with other
    phospholipid biosynthetic genes by Ino2p and Ino4p, which bind the UASINO DNA
    element
  source_type: curated
  url: https://www.yeastgenome.org/locus/INO1
  source_id: SGD:S000003689
- source: Alliance_Automated
  text: Enables inositol-3-phosphate synthase activity. Involved in inositol biosynthetic
    process. Located in cytoplasm. Orthologous to human ISYNA1 (inositol-3-phosphate
    synthase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/INO1
  source_id: SGD:S000003689
