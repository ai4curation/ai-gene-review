description: 'INO1 (YJL153C) encodes myo-inositol-3-phosphate synthase (MIPS, EC 5.5.1.4), the NAD+-dependent
  homotetrameric enzyme that converts D-glucose 6-phosphate into 1D-myo-inositol 3-phosphate via oxidation,
  enolisation, intramolecular aldol cyclisation and reduction. This is the first, committed and rate-limiting
  step of de novo myo-inositol synthesis; the product is dephosphorylated by the inositol monophosphatases
  Inm1/Inm2 to free inositol, the precursor of phosphatidylinositol, phosphoinositides, inositol phosphates
  and sphingolipid head groups. Ino1 is a cytoplasmic protein; ino1 mutants are inositol auxotrophs. INO1
  is the most highly regulated gene of the yeast phospholipid network: transcription is activated by Ino2-Ino4
  via the UASINO element and repressed by Opi1 when inositol is available, and enzyme activity is additionally
  regulated by phosphorylation and indirectly inhibited by valproate.'
