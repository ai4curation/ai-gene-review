- source: Alliance_Automated
  text: Enables UDP-glucose:hexose-1-phosphate uridylyltransferase activity. Involved
    in beta-D-galactose catabolic process via UDP-galactose, Leloir pathway. Located
    in cytoplasm. Used to study galactosemia. Human ortholog(s) of this gene implicated
    in cataract and classic galactosemia. Orthologous to human GALT (galactose-1-phosphate
    uridylyltransferase).
