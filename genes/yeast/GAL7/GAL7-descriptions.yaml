descriptions:
- source: Alliance_Imported
  text: Galactose-1-phosphate uridyl transferase; synthesizes glucose-1-phosphate
    and UDP-galactose from UDP-D-glucose and alpha-D-galactose-1-phosphate in the
    second step of galactose catabolism; human homolog UGP2 can complement yeast null
    mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/GAL7
  source_id: SGD:S000000222
- source: Alliance_Automated
  text: Enables UDP-glucose:hexose-1-phosphate uridylyltransferase activity. Involved
    in beta-D-galactose catabolic process via UDP-galactose, Leloir pathway. Located
    in cytoplasm. Used to study galactosemia. Human ortholog(s) of this gene implicated
    in cataract and classic galactosemia. Orthologous to human GALT (galactose-1-phosphate
    uridylyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GAL7
