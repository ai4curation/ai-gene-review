suggested_questions:
- question: Do the Gal1/Gal10-dependent cytoplasmic foci of Gal7 represent a functional multi-enzyme Leloir
    assembly with substrate channeling?
suggested_experiments:
- hypothesis: Gal7 foci are functional Leloir enzyme assemblies that channel galactose 1-phosphate.
  description: Proximity labelling or co-immunoprecipitation of tagged Gal1, Gal7 and Gal10 under galactose
    induction, combined with flux measurements in foci-disrupting Gal7 truncation mutants (residues 67-134).
  experiment_type: protein interaction / metabolic flux
