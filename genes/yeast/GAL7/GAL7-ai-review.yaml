  label: Saccharomyces cerevisiae S288C
description: GAL7 encodes galactose-1-phosphate uridylyltransferase (GALT, EC 2.7.7.12) of Saccharomyces
  cerevisiae, a type 1 GalT family enzyme that transfers UMP from UDP-glucose to alpha-D-galactose 1-phosphate,
  producing UDP-galactose and glucose 1-phosphate in the second step of the Leloir pathway. The enzyme
  binds a structural zinc ion and, by homology, is a homodimer. GAL7 lies in the GAL1-GAL10-GAL7 cluster
  and is induced by galactose. Gal7 is a cytoplasmic enzyme; GFP-Gal7 forms discrete cytoplasmic foci
  in cells co-expressing Gal1 and Gal10, suggesting possible spatial organisation of the Leloir enzymes.
