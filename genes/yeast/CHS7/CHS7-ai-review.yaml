  title: Chs7p, a new protein involved in the control of protein export from the endoplasmic
    reticulum that is specifically engaged in the regulation of chitin synthesis in
    Saccharomyces cerevisiae.
  findings:
  - statement: Chs7 is an ER membrane protein required for Chs3 export from the
      ER and normal chitin synthase III activity.
    supporting_text: These results show that Chs7p forms part of a new mechanism
      specifically involved in Chs3p export from the ER and consequently, in the
      regulation of CSIII activity.
- id: PMID:15623581
  title: Specialized membrane-localized chaperones prevent aggregation of polytopic
    proteins in the ER.
  findings:
  - statement: Chs7 belongs to a set of specialized ER membrane chaperones that
      keep their polytopic client proteins from aggregating during ER folding.
    supporting_text: In cells individually lacking one of these components only
      their cognate substrates, hexose transporters, phosphate transporters, and
      chitin synthase-III, respectively, aggregate and consequently fail to exit
      the ER membrane.
