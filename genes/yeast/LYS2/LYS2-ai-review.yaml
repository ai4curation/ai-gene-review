  label: Saccharomyces cerevisiae S288C
description: L-2-aminoadipate reductase (alpha-aminoadipate reductase; EC 1.2.1.31/1.2.1.95) of Saccharomyces
  cerevisiae, a large (1392 aa) single-module, NRPS-like enzyme with adenylation, peptidyl-carrier (PCP)
  and NAD(P)H-binding reductase domains. Lys2 activates L-2-aminoadipate by ATP-dependent adenylation,
  loads it as a thioester onto the phosphopantetheine arm of its PCP domain, and releases L-2-aminoadipate
  6-semialdehyde by NADPH-dependent reductive cleavage. This is the first step of the fungal-specific
  segment of the alpha-aminoadipate lysine pathway. Lys2 is inactive until its PCP Ser880 is phosphopantetheinylated
  by the dedicated phosphopantetheinyl transferase Lys5. Lys2 is cytosolic. LYS2 is a widely used selectable
  and counter-selectable genetic marker; lys2 and lys5 mutants can use alpha-aminoadipate as a nitrogen
  source and are selected on that basis.
