gene_symbol: LYS2
organism: yeast
uniprot_id: P07702
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the activation of alpha-aminoadipate by ATP- dependent adenylation
    and the reduction of activated alpha-aminoadipate by NADPH. The activated alpha-aminoadipate
    is bound to the phosphopantheinyl group of the enzyme itself before it is reduced
    to (S)-2-amino-6-oxohexanoate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07702
  source_id: P07702
- source: Alliance_Imported
  text: Alpha aminoadipate reductase; catalyzes the reduction of alpha-aminoadipate
    to alpha-aminoadipate 6-semialdehyde, which is the fifth step in biosynthesis
    of lysine; activation requires posttranslational phosphopantetheinylation by Lys5p
  source_type: curated
  url: https://www.yeastgenome.org/locus/LYS2
  source_id: SGD:S000000319
- source: Alliance_Automated
  text: Enables L-aminoadipate-semialdehyde dehydrogenase [NAD(P)+] activity. Involved
    in L-lysine biosynthetic process. Predicted to be located in cytoplasm. Predicted
    to be active in cytosol. Orthologous to human AASDH (aminoadipate-semialdehyde
    dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/LYS2
  source_id: SGD:S000000319
