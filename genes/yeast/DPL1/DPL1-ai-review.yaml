gene_symbol: DPL1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Dpl1 is the sphingoid long-chain base 1-phosphate lyase of Saccharomyces cerevisiae, a pyridoxal
  5''-phosphate-dependent enzyme anchored in the endoplasmic reticulum membrane by a single N-terminal
  transmembrane segment and active as an oligomer. It irreversibly cleaves phosphorylated sphingoid bases
  (dihydrosphingosine-1-phosphate, preferred, and phytosphingosine-1-phosphate) at the C2-C3 bond into
  a long-chain fatty aldehyde (hexadecanal or 2-hydroxyhexadecanal) and phosphoethanolamine (EC 4.1.2.27).
  This is the only exit route from sphingolipid metabolism: it controls cellular levels of long-chain
  base phosphates, which act as signals, and channels phytosphingosine into odd-chain fatty acids that
  are incorporated into glycerophospholipids. dpl1 mutants accumulate long-chain base phosphates, are
  sensitive to exogenous sphingoid bases, and show altered nutrient-deprivation and Ca2+ signalling responses.'
