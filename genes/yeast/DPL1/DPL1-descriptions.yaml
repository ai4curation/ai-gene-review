gene_symbol: DPL1
organism: yeast
uniprot_id: Q05567
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Sphingosine-1-phosphate lyase that cleaves phosphorylated sphingoid bases
    (PSBs), such as sphingosine-1-phosphate, into fatty aldehydes and phosphoethanolamine
    (PubMed:20696404, PubMed:25345524, PubMed:9334171). Prefers C-16 dihydrosphingosine-l-phosphate
    (DHS-P) as a substrate. Regulates intracellular levels of sphingolipid long-chain
    base phosphates (LCBPs) (PubMed:11795842). Plays a role in the regulation of global
    responses to nutrient deprivation in yeast (PubMed:10329480).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q05567
  source_id: Q05567
- source: Alliance_Imported
  text: Dihydrosphingosine phosphate lyase; regulates intracellular levels of sphingolipid
    long-chain base phosphates (LCBPs), degrades phosphorylated long chain bases,
    prefers C16 dihydrosphingosine-l-phosphate as a substrate; localizes to the ER
    and to the peroxisome
  source_type: curated
  url: https://www.yeastgenome.org/locus/DPL1
  source_id: SGD:S000002702
- source: Alliance_Automated
  text: Enables identical protein binding activity and sphinganine-1-phosphate aldolase
    activity. Involved in calcium-mediated signaling; cellular response to starvation;
    and sphingolipid metabolic process. Located in cortical endoplasmic reticulum;
    endoplasmic reticulum membrane; and perinuclear endoplasmic reticulum. Human ortholog(s)
    of this gene implicated in RENI syndrome. Orthologous to human SGPL1 (sphingosine-1-phosphate
    lyase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DPL1
  source_id: SGD:S000002702
