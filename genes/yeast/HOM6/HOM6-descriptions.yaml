descriptions:
- source: UniProt
  text: Catalyzes the conversion of L-aspartate-beta-semialdehyde (L- Asa) to L-homoserine
    (L-Hse), the third step in the biosynthesis of amino acids that derive from aspartate
    (the aspartate family of amino acids), including methioinine and threonine, the
    latter of which is a precursor to isoleucine; production of homoserine leads to
    a branch- point in the pathway as it can either be O-phosphorylated for processing
    to threonine, or O-acylated for processing to methionine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P31116
  source_id: P31116
