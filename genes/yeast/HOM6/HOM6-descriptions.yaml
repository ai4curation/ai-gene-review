gene_symbol: HOM6
organism: yeast
uniprot_id: P31116
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the conversion of L-aspartate-beta-semialdehyde (L- Asa) to L-homoserine
    (L-Hse), the third step in the biosynthesis of amino acids that derive from aspartate
    (the aspartate family of amino acids), including methioinine and threonine, the
    latter of which is a precursor to isoleucine; production of homoserine leads to
    a branch- point in the pathway as it can either be O-phosphorylated for processing
    to threonine, or O-acylated for processing to methionine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P31116
  source_id: P31116
- source: Alliance_Imported
  text: Homoserine dehydrogenase (L-homoserine:NADP oxidoreductase); dimeric enzyme
    that catalyzes the third step in the common pathway for methionine and threonine
    biosynthesis; enzyme has nucleotide-binding, dimerization and catalytic regions
  source_type: curated
  url: https://www.yeastgenome.org/locus/HOM6
  source_id: SGD:S000003900
- source: Alliance_Automated
  text: Enables NAD+ binding activity and homoserine dehydrogenase activity. Involved
    in L-homoserine biosynthetic process; L-methionine biosynthetic process; and L-threonine
    biosynthetic process. Located in cytoplasm and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/HOM6
  source_id: SGD:S000003900
