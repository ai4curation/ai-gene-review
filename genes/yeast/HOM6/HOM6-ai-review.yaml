id: P31116
gene_symbol: HOM6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Homoserine dehydrogenase (HSD, EC 1.1.1.3) of Saccharomyces cerevisiae. Hom6 reduces L-aspartate 4-semialdehyde
  to L-homoserine using NADPH or NADH (ordered Bi Bi mechanism, pro-S hydride transfer), the third and final step
  of homoserine synthesis from aspartate. Homoserine is the branch point between threonine (and isoleucine) and
  methionine synthesis. Hom6 is a dimer with a Rossmann-like nucleotide-binding region, a dimerisation region and
  a novel catalytic region, and is a candidate antifungal target. It is cytoplasmic, with some nuclear GFP signal.
