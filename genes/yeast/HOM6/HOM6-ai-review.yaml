  title: Non-canonical chromatin-based functions for the threonine metabolic pathway.
  findings:
  - statement: Hom6 has separable metabolic, rDNA-silencing and DNA-damage-response functions; catalytic
      mutants differ, and no direct MRX physical interaction was established.
    supporting_text: Although we have no evidence for a direct physical interaction, our data reveal that
      Hom6 catalytic activity is required for this functional relationship.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text reviewed, including catalytic-mutant, nutrient-rescue and plasmid-end-joining
      experiments. These establish functional distinctions but do not identify a new repair catalytic
      activity.
