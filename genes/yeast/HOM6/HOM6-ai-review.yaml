  findings:
  - statement: Earlier silencing screens identify Hom2/Hom6 phenotypes; the detailed Gdh1 mechanism cannot
      be assigned to these proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text reviewed; distinguish target-specific reporter phenotypes from mechanistic
      experiments on Gdh1.
