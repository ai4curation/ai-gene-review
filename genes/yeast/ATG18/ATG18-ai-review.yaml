id: P43601
gene_symbol: ATG18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Saccharomyces cerevisiae Atg18 is a PROPPIN beta-propeller phosphoinositide effector
  that cycles between the cytosol, phagophore assembly site, vacuole and endosome membranes.
  It binds PI3P and PI(3,5)P2, forms the Atg2-Atg18 complex for phagophore growth, and also
  acts with Fab1/retromer machinery in PtdIns(3,5)P2-dependent vacuole and endolysosomal membrane
  fission.
