id: P34761
gene_symbol: WHI3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Whi3 is a cytoplasmic RRM-containing RNA-binding protein of budding yeast that binds GCAU-rich motifs in hundreds
  of mRNAs, most notably the mRNA of the G1 cyclin CLN3, and also many mRNAs encoding membrane, secretory and cell wall proteins.
  By modestly destabilizing these mRNAs and repressing CLN3 translation, and by retaining Cln3-Cdc28 complexes in the cytoplasm
  through an N-terminal Cdc28-binding region, Whi3 acts as a dose-dependent inhibitor of Start: whi3 mutants are small and
  pass G1/S early, while excess Whi3 causes large cells or G1 arrest. PKA phosphorylation of Ser568 reduces its binding to
  CLN3 mRNA. Whi3 is peripherally associated with the endoplasmic reticulum and relocates to stress granules and P-bodies
  under stress. Its polyQ/polyN regions drive formation of a stable super-assembly (mnemon) after prolonged unproductive pheromone
  exposure or in aged cells; this inactivates Whi3, frees CLN3, and encodes a mother-cell-restricted memory of deceptive courtship.
  Whi3 also promotes filamentous growth, FLO11-dependent adhesion and cell wall integrity through post-transcriptional effects
  on regulators such as Yak1 and Tec1.'
