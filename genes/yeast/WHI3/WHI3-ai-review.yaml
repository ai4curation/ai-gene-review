    reason: CACAO row. Several independent cell-integrity assays (PMC full text, Fig. 4), RRM-dependent, support the term,
      and Whi3 binds many mRNAs encoding cell wall proteins, giving a plausible mechanism. The evidence is phenotypic and
      the grouping term 'organization or biogenesis' is appropriately broad. It is an indirect consequence of Whi3's mRNA
      regulation, so it is kept as non-core rather than accepted as core.
