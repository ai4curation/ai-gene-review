suggested_questions:
- question: Does Whi3 regulate YAK1, TEC1, TPK1, CLN1/2 and NIP100 expression directly (by binding their mRNAs under specific
    conditions) or indirectly, and by what mechanism are these effects positive when its effect on CLN3 is repressive?
- question: Does Whi3 recruit Ccr4-Not to 3' GCAU motifs, and is mRNA destabilization or translational repression the dominant
    mechanism for its control of Start?
- question: Should GOA's 'positive regulation of translational elongation' and 'positive regulation of DNA-templated transcription'
    rows for WHI3 (CACAO, from drug sensitivity and FLO11 promoter phenotypes) be retained, given that Whi3 is a cytoplasmic
    RNA-binding protein with no assayed role in either process?
suggested_experiments:
- hypothesis: Whi3 positively controls Yak1 and Tec1 translation directly
  description: Ribosome profiling or polysome fractionation of YAK1 and TEC1 mRNAs in WT, whi3 and whi3-dRRM cells under adhesion-inducing
    conditions, combined with CLIP to test direct Whi3 binding.
  experiment_type: ribosome profiling / CLIP
- hypothesis: Whi3 promotes CLN3 mRNA decay through Ccr4-Not recruitment
  description: Measure CLN3 poly(A) tail length and half-life in whi3, ccr4 and whi3 ccr4 strains, and test Whi3-Not1 co-immunoprecipitation
    in an RNase-treated lysate.
  experiment_type: mRNA decay / co-immunoprecipitation
