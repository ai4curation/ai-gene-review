- term:
    id: GO:0045727
    label: positive regulation of translation
  evidence_type: IMP
  original_reference_id: PMID:21149646
  qualifier: involved_in
  review:
    summary: 'CACAO. Malcher et al.: in whi3 cells Yak1-HA and GFP-Yak1 protein fall about threefold while YAK1 mRNA is unchanged
      (Fig. 3).'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'CACAO row. The paper shows a post-transcriptional decrease of Yak1 protein in whi3 mutants (immunoblot plus transcript
      quantification, Fig. 3A-C). It does not measure translation (no polysome, ribosome-profiling or reporter-translation
      assay), so it cannot distinguish translation from protein stability. The authors note that YAK1 mRNA was not found among
      Whi3-bound mRNAs and that the effect may be indirect. Translation as a general process is therefore a stronger claim
      than the data: wrong granularity / phenotype read as process. Where Whi3''s effect on translation has been measured
      directly (CLN3), it is inhibitory.'
    supported_by:
    - &id012
      reference_id: PMID:21149646
      supporting_text: Our study further suggests that Whi3 controls YAK1 expression at the post-transcriptional level and
        that Yak1 targets the transcriptional regulators Sok2 and Phd1 to control FLO11
    - &id013
      reference_id: PMID:24386402
      supporting_text: In addition, the whi3 mutation causes a small increase in the translational efficiency of CLN3 mRNA
