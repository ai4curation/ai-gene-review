id: P53090
gene_symbol: ARO8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ARO8 encodes aromatic aminotransferase I (aromatic/aminoadipate aminotransferase 1) of Saccharomyces
  cerevisiae, a cytosolic PLP-dependent class I (subgroup I) aminotransferase that forms a domain-swapped
  homodimer. It is the principal biosynthetic aromatic aminotransferase, transaminating phenylpyruvate
  and 4-hydroxyphenylpyruvate with glutamate to give phenylalanine and tyrosine (EC 2.6.1.57); it is redundant
  with ARO9 for this role, as only aro8 aro9 double mutants are Phe/Tyr auxotrophs. Aro8 is a broad-specificity
  enzyme: it also transaminates L-2-aminoadipate/2-oxoadipate (EC 2.6.1.39; it accounts for about half
  of the 2-aminoadipate aminotransferase activity of extracts and is considered an alpha-aminoadipate
  aminotransferase of the lysine pathway), converts 4-methylthio-2-oxobutanoate to methionine in the methionine
  salvage pathway (redundantly with ARO9, BAT1 and BAT2), and also accepts tryptophan, methionine and
  leucine as amino donors. It can also feed aromatic amino acid catabolism via the Ehrlich pathway. ARO8
  expression is under GCN4 general amino acid control.'
