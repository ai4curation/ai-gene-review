descriptions:
- source: UniProt
  text: General aromatic amino acid transaminase involved in several otherwise unrelated
    metabolic pathways. Responsible for phenylalanine and tyrosine biosynthesis. Active
    with glutamate, phenylalanine, tyrosine and tryptophan as amino donors and with
    phenylpyruvate, hydroxyphenylpyruvate, 2-oxoglutarate and pyruvate as amino acceptors.
    Also active with methionine, alpha-aminoadipate and leucine as amino donors when
    phenylpyruvate is the amino acceptor and in the reverse reactions with the corresponding
    oxo acids and phenylalanine as amino donor. Catalyzes the formation of methionine
    from 2-keto-4- methylthiobutyrate (KMTB) in the methionine salvage pathway primarily
    using aromatic amino acids (tyrosine, phenylalanine and tryptophan) as the amino
    donors. Catalyzes the formation of alpha-aminoadipate from alpha-ketoadipate in
    the lysine biosyntheic pathway.
  source_type: curated
