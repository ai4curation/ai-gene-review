suggested_questions:
- question: How does Psk1/Psk2 phosphorylation of Ugp1 Ser11 physically target the enzyme to the cell
    periphery, and which plasma-membrane partner (e.g. the Fks1 beta-1,3-glucan synthase complex) does
    it associate with?
- question: Does the WGD paralog YHL012W contribute any measurable UGPase activity in vivo, and under
    which conditions is it expressed?
suggested_experiments:
- description: Compare UDP-Glc channelling into beta-glucan vs glycogen in strains expressing only phospho-mimetic
    or non-phosphorylatable Ugp1 with plasma-membrane-tethered Ugp1, using 13C-glucose flux analysis.
