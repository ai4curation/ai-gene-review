- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11805837
  qualifier: enables
  supporting_entities:
  - UniProtKB:P31374
  review:
    summary: 'PMID:11805837 (TAP/MS complexes) reports a physical association of Ugp1 with PSK1. This
      is the PAS kinase-substrate relationship: Psk1/Psk2 phosphorylate Ugp1 on Ser11, which redirects
      it to the cell periphery and shifts UDP-glucose toward beta-glucan rather than glycogen synthesis.
      The interaction is real and biologically meaningful, but ''protein binding'' says nothing about
      Ugp1''s own activity; the regulation is better captured on the kinase side (substrate of PSK1/PSK2)
      than as a binding MF on Ugp1.'
    action: REMOVE
    reason: Uninformative 'protein binding' MF for a kinase-substrate interaction. Removal does not mean
      the interaction is false; it is better represented as Ugp1 being a PSK1/PSK2 substrate.
    supported_by:
    - reference_id: PMID:17531808
