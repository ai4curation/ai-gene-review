id: P32861
gene_symbol: UGP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: UGP1 encodes the major UTP--glucose-1-phosphate uridylyltransferase (UDP-glucose pyrophosphorylase,
  UGPase; EC 2.7.7.9) of Saccharomyces cerevisiae, a homo-octameric cytosolic enzyme of the UDPGP type
  1 family that reversibly converts glucose 1-phosphate and UTP into UDP-glucose and pyrophosphate. UDP-glucose
  is the glucosyl donor for glycogen (glycogenin/Gsy2), trehalose (Tps1), cell-wall beta-1,3- and beta-1,6-glucans,
  dolichyl-phosphate glucose used in N-glycan assembly, and UDP-galactose interconversion in the Leloir
  pathway. UGP1 is essential for viability, mainly because cells cannot build a proper cell wall without
  UDP-glucose, although a few percent of normal activity suffices for growth. PAS kinases Psk1 and Psk2
  phosphorylate Ugp1 without changing its catalytic activity; phosphorylation relocates a pool of the
  enzyme to the cell periphery and partitions UDP-glucose toward glucan rather than glycogen synthesis.
  A WGD paralog, YHL012W, encodes a probable second, minor UGPase.
