  review:
    summary: IBA for glycogen metabolic process at the UDPGP node. Ugp1 supplies UDP-Glc, the glucosyl
      donor for glycogenin and glycogen synthase, and loss of Ugp1 phosphorylation increases glycogen.
      Ugp1 catalyses a precursor step of the glycogen pathway rather than glycogen synthesis per se, and
