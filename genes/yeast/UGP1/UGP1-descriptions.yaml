descriptions:
- source: UniProt
  text: Plays a central role as a glucosyl donor in cellular metabolic pathways.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32861
  source_id: P32861
- source: Alliance_Imported
  text: UDP-glucose pyrophosphorylase (UGPase); catalyses the reversible formation
    of UDP-Glc from glucose 1-phosphate and UTP, involved in a wide variety of metabolic
    pathways, expression modulated by Pho85p through Pho4p; involved in PKA-mediated
    oxidative stress resistance and long-term survival in stationary phase; UGP1 has
    a paralog, YHL012W, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/UGP1
  source_id: SGD:S000001518
- source: Alliance_Automated
  text: Enables UTP:glucose-1-phosphate uridylyltransferase activity. Involved in
    UDP-alpha-D-glucose metabolic process and carbohydrate biosynthetic process. Located
    in cytoplasmic stress granule and plasma membrane. Used to study cancer. Human
    ortholog(s) of this gene implicated in developmental and epileptic encephalopathy
    83. Orthologous to human UGP2 (UDP-glucose pyrophosphorylase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/UGP1
  source_id: SGD:S000001518
