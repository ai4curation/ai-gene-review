findings:
- category: gap
  text: SGD's regulation of UGP1 expression by Pho85 through Pho4 and its PKA-mediated
    oxidative stress and stationary-phase survival roles are not mentioned anywhere
    in the review.
  sources:
  - Alliance_Imported
- category: gap
  text: No source mentions the review's PAS kinase (Psk1/Psk2) phosphorylation that
    partitions UDP-glucose toward glucan synthesis, or that UGP1 is essential.
  sources:
