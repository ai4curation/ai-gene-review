- source: Alliance_Imported
  text: UDP-glucose pyrophosphorylase (UGPase); catalyses the reversible formation
    of UDP-Glc from glucose 1-phosphate and UTP, involved in a wide variety of metabolic
    pathways, expression modulated by Pho85p through Pho4p; involved in PKA-mediated
    oxidative stress resistance and long-term survival in stationary phase; UGP1 has
    a paralog, YHL012W, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/UGP1
