- source: Alliance_Automated
  text: Enables UTP:glucose-1-phosphate uridylyltransferase activity. Involved in
    UDP-alpha-D-glucose metabolic process and carbohydrate biosynthetic process. Located
    in cytoplasmic stress granule and plasma membrane. Used to study cancer. Human
    ortholog(s) of this gene implicated in developmental and epileptic encephalopathy
    83. Orthologous to human UGP2 (UDP-glucose pyrophosphorylase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/UGP1
