descriptions:
- source: UniProt
  text: Involved in the small subunit (SSU) processome assembly and function, and
    in the 18S rRNA synthesis. Required for the early cleavages at sites A0, A1 and
    A2. Stimulates DBP8 RNA helicase ATPase activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53743
  source_id: P53743
- source: Alliance_Imported
  text: Essential nucleolar protein involved in pre-18S rRNA processing; binds to
    RNA and stimulates ATPase activity of Dbp8; involved in assembly of the small
    subunit (SSU) processome
  source_type: curated
  url: https://www.yeastgenome.org/locus/ESF2
  source_id: SGD:S000005337
- source: Alliance_Automated
  text: Enables ATPase activator activity and RNA binding activity. Involved in ribosomal
    small subunit biogenesis. Located in nucleolus. Orthologous to human ABT1 (activator
    of basal transcription 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ESF2
  source_id: SGD:S000005337
