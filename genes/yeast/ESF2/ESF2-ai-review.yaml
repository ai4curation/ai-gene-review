- term:
    id: GO:0032040
    label: small-subunit processome
  evidence_type: IDA
  original_reference_id: PMID:15964808
  qualifier: part_of
  review:
    summary: Esf2-TAP co-purifies with U3, the 5' ETS, many UTP proteins, Esf1 and the helicases
      Has1, Dbp4/Hca4 and Dbp8. It co-sediments with 90S preribosomes in glycerol gradients, and
      the authors conclude it is an accessory component of the SSU processome.
    action: NEW
    reason: A cellular-component claim supported directly by affinity purification and gradient
      co-sedimentation in yeast, and by the authors' conclusion. It is not represented in the
      existing annotation set, which records only the processes and the nucleolus. Other SSU
      processome factors in the same accessory role, such as Dbp8 and Esf1, are standardly
      annotated to this component. Esf2 is transient and substoichiometric rather than a core U3
      RNP subunit, but GO:0032040 covers early-associating proteins of the preribosomal complex.
    supported_by:
    - reference_id: PMID:15964808
      supporting_text: Esf2p is a novel accessory component of the SSU processome.
    - reference_id: PMID:15964808
      supporting_text: The protein colocalized with fast-migrating particles that correspond to 90S
        preribosomes
core_functions:
- description: RNA-binding accessory component of the nucleolar SSU processome/90S preribosome that
    is required for timely assembly and compaction of the processome on nascent pre-rRNA. It is
    therefore required for the early A0, A1 and A2 cleavages that produce 18S rRNA. It acts
    structurally and as a cofactor, not as a nuclease.
