- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:16772403
  qualifier: enables
  review:
    summary: Purified recombinant GST-Esf2 binds His6-Dbp8 directly and stimulates Dbp8 ATP
      hydrolysis. It lowers Dbp8's Km for ATP from 194 to 86 uM and raises kcat. The C-terminal
      region of Esf2 is required for Dbp8 binding, for stimulation and for viability. Esf2 alone
      has only background ATPase activity.
    action: ACCEPT
    reason: A direct in vitro demonstration with purified components and kinetic parameters, a
      negative-control GST fusion (Rpa34), and a binding-deficient deletion mutant that fails to
      stimulate. This matches the GO definition of an activator that binds an ATPase and increases
      its activity. It is a core, mechanistically defined molecular function of yeast Esf2. PAINT
      did not propagate this term from node PTN000267771, although the yeast IDA was available,
      so it should be treated as experimentally established only in S. cerevisiae.
    supported_by:
    - reference_id: PMID:16772403
      supporting_text: Thus, Esf2 stimulates Dbp8 ATP hydrolysis activity likely by increasing its
        affinity for ATP, thereby increasing its ATPase activity.
    - reference_id: PMID:16772403
      supporting_text: The C-terminal domain of Esf2 is required for Dbp8 binding, for stimulation
        of ATP hydrolysis and for its in vivo function.
    - reference_id: PMID:16772403
      supporting_text: GST-Esf2 and GST-Rpa34 alone showed only residual background activity
