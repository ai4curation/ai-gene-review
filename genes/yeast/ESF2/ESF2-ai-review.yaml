- id: PMID:15964808
  title: Esf2p, a U3-associated factor required for small-subunit processome assembly
    and compaction.
  findings:
  - statement: Esf2 depletion inhibits early pre-rRNA cleavages A0-A2 and lowers 18S rRNA synthesis
      without affecting the 5.8S/25S pathway.
    supporting_text: Esf2p-depleted cells are defective for pre-rRNA processing at the early
      nucleolar cleavage sites A 0 through A 2 and consequently are inhibited for 18S rRNA synthesis
  - statement: Esf2 is required for SSU processome assembly and compaction on nascent transcripts.
    supporting_text: We conclude that in the absence of Esf2p, terminal knob deposition and SSU
      processome assembly upon nascent rRNA are kinetically delayed and that once assembled, the
      SSU processomes fail to rearrange into a compact structure.
  - statement: Esf2 is an accessory, nucleolar component of the SSU processome.
    supporting_text: Esf2p is a novel accessory component of the SSU processome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary functional characterization (full text cached, PMC1156982). Source of the
      IMP process rows and the IDA nucleolus row.
- id: PMID:16772403
  title: The nucleolar protein Esf2 interacts directly with the DExD/H box RNA helicase,
    Dbp8, to stimulate ATP hydrolysis.
  findings:
  - statement: Esf2 binds Dbp8 directly and stimulates its ATPase activity by lowering Km for ATP;
      the Esf2 C-terminal region is required.
    supporting_text: Thus, Esf2 stimulates Dbp8 ATP hydrolysis activity likely by increasing its
      affinity for ATP, thereby increasing its ATPase activity.
  - statement: Esf2 binds RNA in vitro without apparent sequence specificity.
    supporting_text: We conclude that recombinant GST-Esf2 binds RNA in vitro, albeit likely
      without any apparent sequence specificity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC1483223). Source of the ATPase activator and RNA binding IDA
      rows.
