suggested_questions:
- question: Is the primary defect in Esf2-depleted cells a failure of SSU processome assembly and
    compaction, or a failure to release U3 and the 5' ETS RNP after the early cleavages?
- question: Is stimulation of the Dbp8 ATPase by Esf2 conserved in the ABT1/DDX49 pair in human, or
    in the fly CG32706/Dbp8-ortholog pair? PAINT did not propagate ATPase activator activity from
    yeast, so any transfer needs separate evidence.
- question: Does Esf2 also stimulate the other processome helicases it co-purifies with (Has1,
    Dbp4/Hca4)?
suggested_experiments:
- hypothesis: The Dbp8-cofactor activity is conserved in the ABT1/Esf2 subfamily.
  description: Purify human ABT1 and DDX49, or fly CG32706 and its Dbp8 ortholog, and measure helicase
    ATPase kinetics with and without the Esf2-family partner. Include a C-terminal deletion
    equivalent to Esf2 delta-C (residues 206-317) as a binding-deficient control.
  experiment_type: in vitro biochemistry
- hypothesis: Esf2 binds a defined site on the pre-rRNA within the 90S particle.
  description: Map Esf2 RNA contacts in vivo by CRAC/CLIP in yeast to identify its pre-rRNA binding
    sites, which in vitro assays could not resolve because binding was not sequence-specific.
  experiment_type: CRAC/CLIP crosslinking
