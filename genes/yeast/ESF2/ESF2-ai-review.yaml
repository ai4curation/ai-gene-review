id: P53743
gene_symbol: ESF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  ESF2 (eighteen S factor 2; YNR054C; the yeast member of the ABT1/Esf2 family) encodes an
  essential 316-residue nucleolar protein with a central non-canonical RNA recognition motif
  (RRM) flanked by disordered/coiled-coil N- and C-terminal regions. Esf2 is an accessory,
  transiently associated component of the U3 snoRNA-containing small-subunit (SSU)
  processome/90S preribosome. It is required for timely assembly and compaction of the SSU
  processome on nascent 35S pre-rRNA, and consequently for the early cleavages at sites A0, A1
  and A2 that release the 18S rRNA precursor; depletion lowers 18S rRNA production without
  affecting the 5.8S/25S pathway. Esf2 binds pre-rRNA (5' ETS) in vivo and binds rRNA fragments
  in vitro without apparent sequence specificity. Through its C-terminal region it binds the
  DEAD-box RNA helicase Dbp8 directly and acts as a cofactor that stimulates Dbp8 ATP hydrolysis
  by lowering its Km for ATP. Esf2 has no intrinsic catalytic activity of its own; it acts as an
  RNA-binding assembly cofactor of the processome. It is released with 5' ETS fragments after A2
  cleavage and does not travel with pre-40S particles.
