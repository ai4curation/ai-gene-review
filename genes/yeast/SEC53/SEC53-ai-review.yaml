id: P07283
gene_symbol: SEC53
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SEC53 (ALG4) encodes the essential cytosolic phosphomannomutase (EC 5.4.2.8) of S. cerevisiae,
  a homodimeric HAD-superfamily enzyme. It interconverts D-mannose 6-phosphate and alpha-D-mannose 1-phosphate,
  working physiologically in the Man-6-P -> Man-1-P direction between phosphomannose isomerase (Pmi40p)
  and GDP-mannose pyrophosphorylase (Psa1p). It is therefore required for GDP-mannose synthesis and, through
  GDP-mannose, for Dol-P-Man formation and for all mannosylation reactions of the secretory pathway. Temperature-sensitive
  sec53 mutants accumulate unglycosylated, incompletely folded secretory proteins in the ER, a defect
  that is bypassed in vitro by GDP-mannose or by mannose 1-phosphate plus GTP. Sec53p is the yeast counterpart
  of human PMM2, whose deficiency causes PMM2-CDG.
