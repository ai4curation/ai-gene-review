descriptions:
- source: UniProt
  text: Involved in the synthesis of the GDP-mannose and dolichol- phosphate-mannose
    required for a number of critical mannosyl transfer reactions such as folding
    and glycosylation of secretory proteins in the ER lumen.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07283
  source_id: P07283
- source: Alliance_Imported
  text: Phosphomannomutase; involved in synthesis of GDP-mannose and dolichol-phosphate-mannose;
    required for folding and glycosylation of secretory proteins in the ER lumen;
    human homolog PMM2 complements yeast mutants
  source_type: curated
  url: https://www.yeastgenome.org/locus/SEC53
  source_id: SGD:S000001849
- source: Alliance_Automated
  text: Enables phosphomannomutase activity and protein homodimerization activity.
    Involved in dolichol phosphate mannose biosynthetic process. Located in cytosol.
    Used to study congenital disorder of glycosylation Ia. Human ortholog(s) of this
    gene implicated in congenital disorder of glycosylation and congenital disorder
    of glycosylation Ia. Orthologous to human PMM1 (phosphomannomutase 1) and PMM2
    (phosphomannomutase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SEC53
  source_id: SGD:S000001849
