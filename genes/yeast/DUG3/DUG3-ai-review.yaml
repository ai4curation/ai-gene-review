suggested_questions:
- question: GO:0036374 is classified under threonine-type peptidase activity (appropriate for GGT); should
    the Dug3 Cys-nucleophile reaction be classified under cysteine-type omega peptidase instead?
- question: Does Dug3 undergo N-terminal processing (Met removal) to expose Cys2, as in other GATase II
    enzymes?
suggested_experiments:
- hypothesis: Dug3 Cys2 is the catalytic nucleophile forming a gamma-glutamyl-enzyme intermediate.
  description: Trap the acyl-enzyme with GSH and analyse by intact-protein MS on purified (Dug2-Dug3)2,
    comparing wild type and C2A/C2S mutants.
