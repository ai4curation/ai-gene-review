  review:
    summary: ISS to E. coli PurF based on weak similarity of the GATase II domain (25% identity over 108
      aa). Amidophosphoribosyltransferase (PRPP + glutamine -> phosphoribosylamine) requires a PRT domain
      that Dug3 lacks; the experimentally established Dug3 activity is cleavage of the gamma-glutamyl
      bond of glutathione. Purine synthesis step 1 in yeast is performed by Ade4.
    action: REMOVE
    reason: Domain-level similarity transferred a full two-domain enzyme reaction; contradicted by the
      characterised Dug3 activity and missing PRT domain.
    supported_by:
    - reference_id: PMID:17179087
      supporting_text: coli PurF, an amidophosphoribosyltransferase shows 27% identity (41% similarity)
        to Gfa1p over a 159-aa stretch and 25% identity (40% similarity) to Dug3p over a 108-aa stretch.
    - reference_id: PMID:22277648
      supporting_text: Dug3p has a functional glutamine amidotransferase (GATase) II domain that is catalytically
        important for glutathione degradation as demonstrated through mutational analysis.
    - reference_id: PMID:22277648
      supporting_text: In vitro reconstitution assays revealed that Dug2p and Dug3p were required together
        for the cleavage of glutathione into glutamate and Cys-Gly.
