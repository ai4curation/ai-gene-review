id: P53871
gene_symbol: DUG3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Dug3 (YNL191W) is the catalytic subunit of the fungal-specific Dug2/Dug3 glutathione hydrolase
  of Saccharomyces cerevisiae. It carries an N-terminal class II glutamine amidotransferase (Ntn-hydrolase)
  domain whose N-terminal cysteine (Cys2) is essential and is proposed to be the nucleophile that cleaves
  the gamma-glutamyl bond of glutathione. Dug3 is active only in complex with the WD40/M20A-like protein
  Dug2, forming a cytosolic (Dug2-Dug3)2 enzyme (Km for GSH 1.2 mM) that releases glutamate and Cys-Gly;
  Cys-Gly is then hydrolysed by Dug1. This DUG pathway allows glutathione to be used as a sulfur source,
  and DUG3 is derepressed by sulfur limitation.
