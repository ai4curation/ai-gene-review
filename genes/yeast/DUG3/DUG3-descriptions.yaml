  text: Component of glutamine amidotransferase (GATase II); forms a complex with
    Dug2p to degrade glutathione (GSH) and other peptides containing a gamma-glu-X
    bond in an alternative pathway to GSH degradation by gamma-glutamyl transpeptidase
    (Ecm38p)
  source_type: curated
