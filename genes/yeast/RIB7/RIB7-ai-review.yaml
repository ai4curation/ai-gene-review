core_functions:
- description: NAD(P)H-dependent reduction of the ribosyl side chain of DAROPP to the ribityl chain (DARIPP),
    the second step of fungal riboflavin biosynthesis, between Rib1 (GTP cyclohydrolase II) and Rib2 (deaminase).
    GO:0008703 is the closest existing term; the physiological substrate is the 2,5-diamino pyrimidinone
    (EC 1.1.1.302).
