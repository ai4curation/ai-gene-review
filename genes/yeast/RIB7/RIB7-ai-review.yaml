  label: Saccharomyces cerevisiae S288C
description: RIB7 (YBR153W) encodes 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate (DAROPP)
  reductase (EC 1.1.1.302), the second enzyme of riboflavin (vitamin B2) biosynthesis in Saccharomyces
  cerevisiae. Following GTP cyclohydrolase II (Rib1), Rib7 reduces the ribosyl side chain of DAROPP to
  the ribityl chain using NAD(P)H, giving DARIPP, which is then deaminated by Rib2. This order (reduction
  before deamination) is characteristic of fungi and archaea and is the reverse of the bacterial/plant
  RibD/RibG route, whose reductase domain acts on the deaminated uracil (AROPP). Rib7 is a soluble homodimer
  of the dihydrofolate-reductase-like RibD C-terminal (HTP reductase) fold; the crystal structure with
  NADPH shows a conserved glycine-rich NADPH pyrophosphate-binding motif, and Thr35 (a lysine in bacterial
  RibD) governs preference for the 2-amino pyrimidinone substrate. rib7 mutants are riboflavin auxotrophs
  that accumulate a triaminopyrimidine derivative.
