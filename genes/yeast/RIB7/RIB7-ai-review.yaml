    summary: Lv et al. 2013 purified recombinant Rib7, solved its structure with NADPH and assayed NADPH-dependent
      reduction of both DAROPP (physiological fungal substrate) and AROPP (the bacterial RibD substrate
      named in GO:0008703). Wild-type Rib7 reduces AROPP in vitro but prefers DAROPP. GO has no term for
      the DAROPP reductase reaction (EC 1.1.1.302), so GO:0008703 is the closest available term; it is
      accepted with the caveat that the in vivo substrate differs at C2 (see proposed_new_terms).
    action: ACCEPT
