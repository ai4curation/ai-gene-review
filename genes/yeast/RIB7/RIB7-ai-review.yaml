proposed_new_terms:
- proposed_name: 2,5-diamino-6-(5-phospho-D-ribosylamino)pyrimidin-4(3H)-one reductase activity
  proposed_definition: 'Catalysis of the reaction: 2,5-diamino-6-(1-D-ribitylamino)pyrimidin-4(3H)-one
    5''-phosphate + NAD(P)+ = 2,5-diamino-6-(1-D-ribosylamino)pyrimidin-4(3H)-one 5''-phosphate + NAD(P)H
    + H+.'
  justification: EC 1.1.1.302 (RHEA:27274, RHEA:27278) is the fungal/archaeal riboflavin pathway reductase
    (yeast Rib7) acting before deamination. GO currently only has GO:0008703 (EC 1.1.1.193), which names
    the deaminated uracil substrate of bacterial RibD, so fungal and archaeal reductases are annotated
    with a term for a different reaction.
  proposed_parent:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  supported_by:
  - *id005
  - *id002
suggested_questions:
- question: Should GO add a distinct term for EC 1.1.1.302 (DAROPP reductase) so that fungal Rib7 and
    archaeal orthologs are not annotated to the bacterial AROPP reductase term GO:0008703?
suggested_experiments:
- description: Determine steady-state kinetics (kcat/Km) of purified Rib7 with DAROPP versus AROPP and
    with NADPH versus NADH, to quantify substrate and cofactor preference in vivo-relevant terms.
