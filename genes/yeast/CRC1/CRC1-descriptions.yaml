descriptions:
- source: UniProt
  text: Transports carnitine, acetylcarnitine, propionylcarnitine and to a much lower
    extent medium- and long-chain acylcarnitines.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12289
  source_id: Q12289
- source: Alliance_Imported
  text: Mitochondrial inner membrane carnitine transporter; required for carnitine-dependent
    transport of acetyl-CoA from peroxisomes to mitochondria during fatty acid beta-oxidation;
    human homolog SLC25A20 complements yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/CRC1
  source_id: SGD:S000005626
- source: Alliance_Automated
  text: Enables carnitine:O-acyl-L-carnitine antiporter activity. Involved in carnitine
    transmembrane transport and fatty acid metabolic process. Located in mitochondrial
    inner membrane. Used to study lipid metabolism disorder. Human ortholog(s) of
    this gene implicated in carnitine-acylcarnitine translocase deficiency. Orthologous
    to human SLC25A20 (solute carrier family 25 member 20).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CRC1
