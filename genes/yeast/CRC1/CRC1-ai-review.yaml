suggested_questions:
- question: Does Crc1 operate strictly as an exchanger in vivo, or also as a carnitine uniporter, and
    what is its contribution to acetyl transport on ethanol/acetate versus oleate?
suggested_experiments:
- description: Measure carnitine/acetylcarnitine exchange kinetics in mitochondria from wild-type and
    crc1 cells, and acetylcarnitine accumulation in crc1 cit2 strains grown on oleate.
