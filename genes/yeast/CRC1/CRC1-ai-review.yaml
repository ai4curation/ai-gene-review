id: Q12289
gene_symbol: CRC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CRC1 (YOR100C) encodes the mitochondrial carnitine/acylcarnitine carrier of S. cerevisiae,
  the orthologue of human SLC25A20, a member of the mitochondrial carrier family in the inner mitochondrial
  membrane. Reconstituted Crc1 transports carnitine, acetylcarnitine and propionylcarnitine, and only
  weakly medium- and long-chain acylcarnitines. It imports acetylcarnitine (made from peroxisomal or cytosolic
  acetyl-CoA by carnitine acetyltransferases) into the matrix in exchange for free carnitine, so that
  Cat2 can regenerate acetyl-CoA in the matrix. This carnitine-dependent acetyl transfer is one of two
  routes moving acetyl units from peroxisomal beta-oxidation to mitochondria, the other being the glyoxylate-cycle
  route.
