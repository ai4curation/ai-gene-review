  review:
    summary: IDA (van Roermund et al. 1999) to fatty acid metabolic process. Crc1 is needed for carnitine-dependent
      transfer of acetyl units from peroxisomal fatty acid beta-oxidation to mitochondria, so it supports
      fatty acid catabolism indirectly. It does not act on fatty acids itself and transports long-chain
      acylcarnitines only weakly, so this is a downstream/contextual process rather than its core role.
    action: KEEP_AS_NON_CORE
    supported_by:
