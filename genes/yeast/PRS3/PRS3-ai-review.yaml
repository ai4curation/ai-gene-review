gene_symbol: PRS3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Prs3 (YHL011C) is one of five ribose-phosphate pyrophosphokinase (PRPP synthase) subunits in Saccharomyces cerevisiae
  and, with Prs1, one of the two major subunits. PRPP synthase forms 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) from ribose
  5-phosphate and ATP (EC 2.7.6.1). PRPP is the ribose-phosphate donor for de novo and salvage synthesis of purine, pyrimidine
  and pyridine nucleotides and for histidine and tryptophan biosynthesis. S. cerevisiae has five PRS genes, and none of their
  products is active alone. Co-expression in E. coli shows that active enzyme needs specific pairs (Prs1 with Prs2, Prs3 or
  Prs4; Prs5 with Prs2 or Prs4), and enzyme stable in vitro needs at least three subunits. The cytosolic PRPP synthase is
  therefore a hetero-oligomeric complex of Prs subunits. Prs3 interacts strongly with Prs1, and the Prs1+Prs3 pair forms the
  only binary enzyme stable in extracts. prs3 nulls have reduced nucleotide pools, are synthetically lethal with prs5, and
  show pleiotropic phenotypes: failure to arrest in G1 on nutrient limitation, a disorganized actin cytoskeleton, and NaCl,
  caffeine and temperature sensitivity that is rescued by osmotic support.'
