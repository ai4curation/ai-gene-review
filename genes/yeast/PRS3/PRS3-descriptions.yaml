descriptions:
- source: UniProt
  text: 5-phosphoribose 1-diphosphate synthase involved in nucleotide, histidine,
    and tryptophan biosynthesis. Active in heteromultimeric complexes with other 5-phosphoribose
    1-diphosphate synthases (PRS2, PRS3, PRS4 and PRS5).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38689
  source_id: P38689
- source: Alliance_Imported
  text: 5-phospho-ribosyl-1(alpha)-pyrophosphate synthetase; synthesizes PRPP, which
    is required for nucleotide, histidine, and tryptophan biosynthesis; one of five
    related enzymes, which are active as heteromultimeric complexes
  source_type: curated
  url: https://www.yeastgenome.org/locus/PRS3
  source_id: SGD:S000001003
- source: Alliance_Automated
  text: Contributes to ribose phosphate diphosphokinase activity. Involved in 5-phosphoribose
    1-diphosphate biosynthetic process. Located in cytoplasm. Part of ribose phosphate
    diphosphokinase complex. Human ortholog(s) of this gene implicated in several
    diseases, including Arts syndrome; X-linked deafness 1; X-linked recessive disease
    (multiple); gout; and retinitis pigmentosa. Orthologous to human PRPS1 (phosphoribosyl
    pyrophosphate synthetase 1) and PRPS2 (phosphoribosyl pyrophosphate synthetase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PRS3
  source_id: SGD:S000001003
