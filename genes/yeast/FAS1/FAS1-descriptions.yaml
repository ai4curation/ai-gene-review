descriptions:
- source: UniProt
  text: 'Fatty acid synthetase catalyzes the formation of long-chain fatty acids from
    acetyl-CoA, malonyl-CoA and NADPH. The beta subunit contains domains for: [acyl-carrier-protein]
    acetyltransferase and malonyltransferase, S-acyl fatty acid synthase thioesterase,
    enoyl- [acyl-carrier-protein] reductase, and 3-hydroxypalmitoyl-[acyl-carrier-
    protein] dehydratase.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07149
  source_id: P07149
- source: Alliance_Imported
  text: Beta subunit of fatty acid synthetase (FAS); the FAS complex catalyzes the
    synthesis of long-chain saturated fatty acids and is subject to allosteric regulation
    by palmitoyl-CoA binding distal to the catalytic site to inhibit ketoacyl reductase
    activity; contains acetyltransacylase, dehydratase, enoyl reductase, malonyl transacylase,
    and palmitoyl transacylase activities; specific target of the broad-spectrum antifungal
    NPD6433
  source_type: curated
  url: https://www.yeastgenome.org/locus/FAS1
  source_id: SGD:S000001665
- source: Alliance_Automated
  text: Enables (3R)-hydroxyacyl-[acyl-carrier-protein] dehydratase activity; acyltransferase
    activity, transferring groups other than amino-acyl groups; and enoyl-[acyl-carrier-protein]
    reductase (NADPH) activity. Contributes to fatty acid synthase activity. Involved
    in long-chain fatty acid biosynthetic process. Located in cytosol and lipid droplet.
    Part of fatty acid synthase complex.
  source_type: automated
  url: https://www.yeastgenome.org/locus/FAS1
  source_id: SGD:S000001665
