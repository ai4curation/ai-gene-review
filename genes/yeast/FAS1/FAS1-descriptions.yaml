descriptions:
- source: UniProt
  text: 'Fatty acid synthetase catalyzes the formation of long-chain fatty acids from
    acetyl-CoA, malonyl-CoA and NADPH. The beta subunit contains domains for: [acyl-carrier-protein]
    acetyltransferase and malonyltransferase, S-acyl fatty acid synthase thioesterase,
    enoyl- [acyl-carrier-protein] reductase, and 3-hydroxypalmitoyl-[acyl-carrier-
    protein] dehydratase.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07149
