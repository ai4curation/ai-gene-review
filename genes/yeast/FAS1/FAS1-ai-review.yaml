id: P07149
gene_symbol: FAS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FAS1 (YKL182W) encodes the beta subunit of the cytosolic type I fungal fatty acid synthase,
  a 2.6-MDa barrel-shaped alpha6beta6 complex formed with the alpha subunit encoded by FAS2. The beta
  chain forms the two dome-shaped reaction chambers and carries the acetyltransferase, enoyl-ACP reductase
  (FMN- and NADPH-dependent), 3-hydroxyacyl-ACP dehydratase and malonyl/palmitoyl transferase (MPT) domains.
  The MPT domain both loads malonyl units onto the ACP and releases the finished C16/C18 chain by transfer
  to CoA. Together with the Fas2 ACP, ketoacyl synthase and ketoacyl reductase domains, the complex converts
  acetyl-CoA, malonyl-CoA and NADPH into long-chain acyl-CoA (EC 2.3.1.86), the main source of saturated
  fatty acids for membrane lipids. fas1 mutants are fatty acid auxotrophs that die rapidly when fatty
  acids are withdrawn.
