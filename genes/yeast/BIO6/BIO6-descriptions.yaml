findings:
- category: insight
  text: The review notes BIO6 is a BIO3 paralog with a class-III aminotransferase
    fold, not a BioF-family enzyme, so the KAPA synthase assignment that both texts
    repeat rests on genetics (KAPA rescue) rather than on assayed activity.
