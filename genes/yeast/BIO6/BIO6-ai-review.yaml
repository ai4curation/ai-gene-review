gene_symbol: BIO6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4932
  label: Saccharomyces cerevisiae
description: BIO6 encodes a pyridoxal 5'-phosphate-dependent class-III aminotransferase-fold protein required
  for biotin biosynthesis in biotin-prototrophic S. cerevisiae strains (sake yeasts, A364a and others);
  it is absent from the S288C reference strain, which is a biotin auxotroph. BIO6 arose by duplication
  of BIO3 (adenosylmethionine-8-amino-7-oxononanoate aminotransferase, 52% identity) and lies in a subtelomeric
  cluster with BIO1. Disruption of BIO6 causes biotin auxotrophy that is rescued by 8-amino-7-oxononanoate
  (KAPA), placing Bio6 at or before KAPA formation; it is widely assumed to be the yeast KAPA synthase
  (replacing the absent BioF), but its activity has not been demonstrated biochemically. Co-expression
  of BIO1 and BIO6 restores biotin prototrophy to S288C.
