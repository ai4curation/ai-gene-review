  review:
    summary: 'IEA (InterPro IPR005815 BioA / PANTHER PTN001736496) to adenosylmethionine-8-amino-7-oxononanoate
      transaminase (BioA, DAPA aminotransferase) activity. BIO6 is a BIO3 paralog and is classified with
      BioA proteins, but genetics shows it acts before KAPA: KAPA rescues bio6 but not bio3, so BIO3 alone
      supplies the DAPA aminotransferase step and BIO6 has a different, neofunctionalized role.'
    action: REMOVE
    reason: Family-level transfer of the BIO3/BioA activity to a neofunctionalized paralog that acts upstream
      of KAPA.
