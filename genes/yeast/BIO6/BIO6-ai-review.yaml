suggested_questions:
- question: Does purified Bio6 condense L-alanine with a pimeloyl thioester (CoA or ACP) to form KAPA,
    despite belonging to the class-III (BioA-type) rather than class-II (BioF-type) PLP enzyme family?
suggested_experiments:
- description: Express and purify Bio6 and assay PLP-dependent KAPA formation from L-alanine and pimeloyl-CoA
    or pimeloyl-ACP by LC-MS, alongside Bio3 as a DAPA aminotransferase control.
