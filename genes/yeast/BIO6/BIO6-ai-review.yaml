    summary: ISS with Buchnera BioF (Q89AK6, 8-amino-7-oxononanoate synthase). BIO6 is a class-III aminotransferase
      (BioA-like) and is not in the class-II BioF family, so the similarity basis is weak. However, the
      genetic data (bio6 rescued by KAPA; S. cerevisiae has no BioF) are consistent with Bio6 forming
      KAPA, and later literature refers to Bio6 as KAPA synthase. Without biochemical demonstration of
