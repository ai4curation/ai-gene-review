  text: Enables mevalonate kinase activity. Involved in ergosterol biosynthetic process
    and isopentenyl diphosphate biosynthetic process, mevalonate pathway. Located
    in cytosol and nucleus. Used to study cancer and mevalonic aciduria. Human ortholog(s)
    of this gene implicated in hyperimmunoglobulinemia D periodic fever syndrome;
    lipid metabolism disorder; mevalonic aciduria; and porokeratosis. Orthologous
    to human MVK (mevalonate kinase).
