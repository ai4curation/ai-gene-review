id: P07277
gene_symbol: ERG12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG12 (YMR208W; also known as RAR1) encodes mevalonate kinase (EC 2.7.1.36), the GHMP-family
  kinase that phosphorylates (R)-mevalonate with ATP to form (R)-mevalonate 5-phosphate, the first of
  three ATP-dependent steps that convert mevalonate to isopentenyl diphosphate (IPP) in the mevalonate
  pathway. IPP feeds farnesyl diphosphate and thus ergosterol, dolichol, ubiquinone, heme A and protein
  prenyl groups. Erg12 is the only mevalonate kinase in S. cerevisiae and loss-of-function erg12 mutants
  are ergosterol auxotrophs. The enzyme is competitively inhibited at the ATP site by farnesyl and geranyl
  diphosphate, a feedback point on the sterol pathway. Erg12 is a soluble cytosolic protein, with some
  nuclear GFP signal in genome-wide surveys.
