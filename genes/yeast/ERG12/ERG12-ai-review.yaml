- id: file:yeast/ERG12/ERG12-uniprot.txt
  title: UniProt entry P07277 (ERG12_YEAST)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The mevalonate kinase activity, the conversion of mevalonate to 5-phosphomevalonate
      and the order of the FPP module (ERG12, ERG8, ERG19/MVD1, IDI1, ERG20) are correct. The pathway
      sentence placing this module in the vacuole is not. It is copied from a secondary review
      (PMID:32679672) and contradicts the entry's own SUBCELLULAR LOCATION line (Cytoplasm, cytosol).
      High-throughput GFP localization (PMID:14562095, PMID:26928762) also scores Erg12 as cytoplasmic
      or cytosolic, and the review places the enzyme in the cytosol. The same sentence appears in the
      ERG19 and ERG20 entries.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P07277
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: The second module is carried out in the vacuole and involves the formation of farnesyl
        diphosphate, which is also an important intermediate in the biosynthesis of ubiquinone, dolichol,
        heme and prenylated proteins.
      confidence: PROBABLE
      explanation: The FUNCTION comment says "The second module is carried out in the vacuole". This
        comes from a review (PMID:32679672) that cites no localization data for it. The entry's own
        SUBCELLULAR LOCATION gives Erg12 as cytosolic, and genome-wide GFP localization scores Erg12 as
        cytoplasmic/cytosolic, not vacuolar. The mevalonate-to-farnesyl-diphosphate enzymes (Erg12, Erg8,
        Erg19, Idi1, Erg20) are soluble cytosolic enzymes. The sentence should say the module is cytosolic,
        or drop the location. The same text is in the ERG19 (P32377) and ERG20 (P08524) entries.
      supported_by:
      - reference_id: file:yeast/ERG12/ERG12-uniprot.txt
        record_section: ["CC:SUBCELLULAR LOCATION"]
        supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm, cytosol'
