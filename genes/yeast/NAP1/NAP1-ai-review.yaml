id: P25293
gene_symbol: NAP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  NAP1 encodes a conserved histone chaperone with roles in chromatin assembly,
  ribosome biogenesis, and cell cycle regulation. Nap1p functions primarily as
  an H2A-H2B chaperone, cooperating with the karyopherin Kap114 to transport
  histone H2A-H2B dimers into the nucleus for deposition into nucleosomes;
  binding of Ran-GTP (Gsp1) to this complex promotes accurate nucleosome
  assembly. Nap1p also participates in histone exchange, facilitating
  replacement of canonical H2A-H2B dimers with variant dimers. Beyond
  chromatin, Nap1p serves as an assembly chaperone for the small ribosomal
  subunit protein eS6 (Rps6a/Rps6b), promoting its solubility and
  contributing to 40S subunit biogenesis. During mitosis, Nap1p regulates
  septin organization at the bud neck and modulates B-type cyclin (Clb2p)
  function, linking chromatin dynamics to cell cycle progression. Orthologous
  to human NAP1L1-4.
existing_annotations:
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      The PTN000221934 IBD node propagates chromatin as a broad site of action
      for the NAP/SET/Vps75 family. Nap1 itself has direct H2A-H2B chaperone
      evidence and nuclear nucleosome-assembly/remodeling roles, so the broad
      chromatin component assignment is retained as biologically compatible but
      non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      PTN000221934 carries chromatin, nucleus, chromatin binding, and histone
      binding calls for the broad NAP/SET/Vps75 family node. The chromatin IBD
      is seeded by a putative fission-yeast NAP protein and budding-yeast Vps75
      rather than by direct budding-yeast Nap1 evidence, so it is kept as a
      compatible site-of-action annotation but not elevated over the more
      specific nucleus and H2A-H2B chaperone rows.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000221934
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The current PTHR11875 PAINT slice places chromatin at PTN000221934.
          This IBD is sparse for budding-yeast Nap1 itself, with direct seeds
          from PomBase:SPBC36B7.08c and the VPS75 paralog rather than
          SGD:S000001756.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      Nap1 functions in both the cytosol and the nucleus. Falcon deep research notes
      that Nap1 is mostly cytoplasmic but also functions in the nucleus, where it
      supports H2A-H2B release, nucleosome assembly, and nucleosome disassembly.
      The nucleus IBA is retained as a core site of Nap1 action.
    action: ACCEPT
    reason: >-
      Nap1's predominant steady-state pool is cytosolic, but its direct H2A-H2B
      deposition and eviction reactions also act in the nucleus. The PAINT node
      is supported by budding-yeast NAP1 itself, and the core H2A-H2B chaperone
      activities require the nucleus as an authentic site of action.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000221934
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTN000221934 is the current PAINT node for the NAP-family nucleus IBA;
          the descendant experimental evidence includes budding-yeast
          SGD:S000001756/NAP1 itself.
    additional_reference_ids:
    - file:yeast/NAP1/NAP1-deep-research-falcon.md
    supported_by:
    - reference_id: file:yeast/NAP1/NAP1-deep-research-falcon.md
      supporting_text: but also acts in the nucleus where it supports targeted histone
        release/import, nucleosome assembly and remodeling during transcription
      reference_section_type: ABSTRACT
- term:
    id: GO:0006334
    label: nucleosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      Nucleosome assembly is a core biological process for NAP1. Falcon deep research
      supports that Nap1 is a conserved nucleosome assembly protein that promotes
      correct nucleosome organization by delivering H2A-H2B dimers into nucleosomes
      rather than allowing random histone-DNA association.
    action: ACCEPT
    reason: Retained as supported or plausible for this gene and evidence context.
    propagation_review:
