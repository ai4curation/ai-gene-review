id: P25293
gene_symbol: NAP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NAP1 encodes a conserved histone chaperone with roles in chromatin assembly,
  ribosome biogenesis, and cell cycle regulation. Nap1p functions primarily as an
  H2A-H2B chaperone, cooperating with the karyopherin Kap114 to transport histone
  H2A-H2B dimers into the nucleus for deposition into nucleosomes; binding of Ran-GTP
  (Gsp1) to this complex promotes accurate nucleosome assembly. Nap1p also participates
  in histone exchange, facilitating replacement of canonical H2A-H2B dimers with variant
  dimers. Beyond chromatin, Nap1p serves as an assembly chaperone for the small ribosomal
  subunit protein eS6 (Rps6a/Rps6b), promoting its solubility and contributing to
  40S subunit biogenesis. During mitosis, Nap1p regulates septin organization at the
  bud neck and modulates B-type cyclin (Clb2p) function, linking chromatin dynamics
  to cell cycle progression. Orthologous to human NAP1L1-4.
