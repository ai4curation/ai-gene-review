    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified abstract-only cache. This paper assayed Xenopus laevis
      Npm2 and Nap1 acidic IDRs and TTLL4-catalyzed glutamylation, so it is
      family-level support for acidic-IDR histone-chaperone chemistry rather
