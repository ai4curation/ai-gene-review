- term:
    id: GO:0042393
    label: histone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'Histone binding is a core molecular function of NAP1. Falcon deep research

      confirms the primary substrate is the H2A-H2B dimer, which Nap1 binds with

      nanomolar affinity as a stable homodimer, shielding the basic DNA-binding

      surfaces of the histones.'
    action: ACCEPT
    reason: Histone binding is the direct client-recognition activity underlying
      Nap1's H2A-H2B, H3-H4, and H2AZ-H2B chaperone rows, and PTN000221934 matches
      the conserved NAP-family histone-binding placement.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000221934
        source_status: SUPPORTS_TRANSFER
        comment: PTN000221934 is the current broad NAP-family PAINT node for histone
          binding; the descendant experimental evidence includes SGD:S000001756/NAP1
          and SGD:S000005190/VPS75, and budding-yeast Nap1 shows no lineage-specific
          loss of H2A-H2B binding or chaperoning.
    additional_reference_ids:
