  title: Histone chaperone Nap1 dismantles an H2A/H2B dimer from a partially unwrapped
    nucleosome.
  findings:
  - statement: 'Nap1 can dismantle an H2A-H2B dimer from a partially unwrapped nucleosome;

      partial unwrapping by a translocase dramatically facilitates this Nap1-mediated

      dimer removal.'
    supporting_text: partial unwrapping of a nucleosome by an RNA polymerase dramatically
      facilitates an H2A/H2B dimer dismantling from the nucleosome by Nucleosome Assembly
      Protein 1 (Nap1)
    reference_section_type: ABSTRACT
  - statement: 'The acidic C-terminal flexible tails of Nap1 engage an H2A-H2B interface
      that

      is normally buried in the nucleosome and inaccessible to Nap1''s globular domains,

      consistent with a ''penetrating fuzzy binding'' chaperone mechanism.'
    supporting_text: the highly acidic C-terminal flexible tails of Nap1 contribute
      to the H2A/H2B binding by associating with the binding interface buried and
      not accessible to Nap1 globular domains, supporting the penetrating fuzzy binding
      mechanism seemingly shared across various histone chaperones
    reference_section_type: ABSTRACT
