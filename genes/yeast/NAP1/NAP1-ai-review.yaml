- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  retired: true
  review:
    summary: The retired UniProt keyword DNA-binding row should not be retained
      for Nap1; Nap1's acidic surfaces mimic DNA to shield histone H2A-H2B rather
      than representing a core naked-DNA-binding function.
    action: REMOVE
    reason: UniProt withdrew this keyword row in the current source. Nap1's core
      H2A-H2B chaperone chemistry is better described as acidic DNA mimicry that
      binds and stabilizes histones, so a naked DNA-binding keyword is misleading.
    supported_by:
    - reference_id: PMID:38571760
      supporting_text: glutamylation of these chaperone polyelectrolyte acidic
        stretches functions to enhance DNA electrostatic mimicry, promoting the
        binding and stabilization of H2A/H2B heterodimers and facilitating nucleosome
        assembly
      reference_section_type: ABSTRACT
