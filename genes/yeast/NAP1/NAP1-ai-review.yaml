- term:
    id: GO:0042393
    label: histone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: |-
      Histone binding is a core molecular function of NAP1. Falcon deep research
      confirms the primary substrate is the H2A-H2B dimer, which Nap1 binds with
      nanomolar affinity as a stable homodimer, shielding the basic DNA-binding
      surfaces of the histones.
    action: ACCEPT
    reason: Retained as supported or plausible for this gene and evidence context.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000221934
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTN000221934 is the current broad NAP-family PAINT node for histone
          binding; the descendant experimental evidence includes
          SGD:S000001756/NAP1 and SGD:S000005190/VPS75, and budding-yeast Nap1
          shows no lineage-specific loss of H2A-H2B binding or chaperoning.
    additional_reference_ids:
    - file:yeast/NAP1/NAP1-deep-research-falcon.md
    supported_by:
    - reference_id: file:yeast/NAP1/NAP1-deep-research-falcon.md
      supporting_text: The primary substrate of Nap1 is the **H2A–H2B dimer**
      reference_section_type: RESULTS
    - reference_id: file:yeast/NAP1/NAP1-deep-research-falcon.md
      supporting_text: Nagae et al. describe Nap1 as a **~48 kDa monomer** that forms
        a stable homodimer and binds a single H2A–H2B dimer with **nanomolar affinity**
      reference_section_type: RESULTS
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      The PTN000221934 IBD node transfers chromatin binding from plant and
      mammalian NAP/SET-family evidence, with no fungal seed in the current
      PAINT slice. The term is broad and less informative than H2A-H2B histone
      complex chaperone activity, so it is kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Nap1 can act on nucleosomal H2A-H2B substrates, but its curated direct
      activity is the more specific GO:0000511 H2A-H2B histone complex
      chaperone activity. Because this chromatin-binding IBA is broad, lacks a
      fungal experimental seed at the current PAINT node, and does not add a
      distinct biochemical output, it is retained only as a non-core inherited
      interaction context.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000221934
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTN000221934 is the current PTHR11875 node for chromatin binding. Its
          chromatin-binding IBD is seeded by plant and mammalian entries rather
          than by fungal Nap1/Vps75 evidence, and the term is less precise than
          Nap1's direct H2A-H2B chaperone activity.
