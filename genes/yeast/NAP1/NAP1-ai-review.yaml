    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'Nap1 functions in both the cytosol and the nucleus. Falcon deep research
      notes

      that Nap1 is mostly cytoplasmic but also functions in the nucleus, where it

      supports H2A-H2B release, nucleosome assembly, and nucleosome disassembly.

      The nucleus IBA is retained as a core site of Nap1 action.'
    action: ACCEPT
    reason: Nap1's predominant steady-state pool is cytosolic, but its direct H2A-H2B
      deposition and eviction reactions also act in the nucleus. The PAINT node is
      supported by budding-yeast NAP1 itself, and the core H2A-H2B chaperone activities
      require the nucleus as an authentic site of action.
