        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTN000221935 is the current eukaryote-scoped IBD node for nucleosome
          assembly in PTHR11875 and includes budding-yeast NAP1 itself among the
          experimental descendant evidence.
    additional_reference_ids:
    - file:yeast/NAP1/NAP1-deep-research-falcon.md
    supported_by:
    - reference_id: file:yeast/NAP1/NAP1-deep-research-falcon.md
