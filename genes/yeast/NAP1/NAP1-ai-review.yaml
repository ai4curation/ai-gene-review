- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:18086883
  qualifier: located_in
  review:
    summary: Nap1 is detected in the nucleus, consistent with the nuclear phase
      of H2A-H2B import and nucleosome assembly; PMID:18086883 showed that CK2
      phosphorylation promotes Nap1 nuclear import.
    action: ACCEPT
    reason: Nucleus is a core Nap1 localization because Nap1 shuttles into the
      nucleus with histone cargo and acts there in H2A-H2B deposition and chromatin
      assembly.
    supported_by:
    - reference_id: PMID:18086883
      supporting_text: Nap1 can shuttle between the nucleus and cytoplasm, and
        we also showed that CK2 phosphorylation promotes the import of Nap1 into
        the nucleus.
      reference_section_type: ABSTRACT
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:18086883
  qualifier: located_in
  review:
    summary: PMID:18086883 observed wild-type and phosphosite-mutant Nap1-GFP
      fusions predominantly in the cytoplasm of exponentially growing cells.
    action: ACCEPT
    reason: Cytoplasm is a core Nap1 localization because Nap1 is predominantly
      cytoplasmic at steady state and handles H2A-H2B before nuclear import.
    supported_by:
    - reference_id: PMID:18086883
      supporting_text: In exponentially growing cells, wild-type and mutant Nap1
