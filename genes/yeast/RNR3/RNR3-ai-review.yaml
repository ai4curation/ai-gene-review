core_functions:
- description: Alternative, DNA-damage-inducible large (R1/alpha) subunit of class Ia ribonucleotide reductase.
    Within Rnr1/Rnr3 heterodimers it contributes catalytic and allosteric sites to the holoenzyme that reduces NDPs
    to dNDPs with the Rnr2-Rnr4 radical-bearing small subunit, boosting dNTP supply for DNA repair and replication
    under genotoxic stress.
  contributes_to_molecular_function:
    id: GO:0004748
    label: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor
