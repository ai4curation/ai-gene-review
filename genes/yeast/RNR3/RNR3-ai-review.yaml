id: P21672
gene_symbol: RNR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: RNR3 (DIN1, YIL066C) encodes the minor, DNA-damage-inducible large (R1, alpha) subunit of class Ia
  ribonucleotide reductase, about 80% identical to the essential major large subunit Rnr1. The large subunit carries
  the catalytic cysteines that reduce ribonucleoside diphosphates (ADP, GDP, CDP, UDP) to the corresponding 2'-deoxyribonucleoside
  diphosphates and the allosteric specificity and activity (ATP/dATP) sites that balance dNTP pools; the radical
  needed for catalysis is supplied by the Rnr2-Rnr4 small-subunit heterodimer. RNR3 is barely expressed in unperturbed
  cells but is strongly induced by DNA damage and replication stress through the Mec1-Rad53-Dun1 checkpoint and
  Crt1 derepression. It is not essential, and purified Rnr3 alone has less than 1% of the activity of Rnr1, but
  it is strongly activated when it forms a heterodimer with Rnr1, and high-copy RNR3 suppresses rnr1 lethality.
  Rnr3, like Rnr1, is cytoplasmic, where the active holoenzyme assembles with the small subunit.
