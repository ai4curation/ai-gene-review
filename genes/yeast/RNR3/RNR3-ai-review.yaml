suggested_questions:
- question: Does Rnr3 contribute measurably to dNTP pools in vivo after DNA damage, given that rnr3 nulls have no
    obvious damage phenotype and Rnr3 levels stay below one-tenth of Rnr1?
- question: Is the Rnr3 detected in mitochondrial proteomes a contaminant, or is a fraction of RNR associated with
    the mitochondrial outer membrane to supply mtDNA synthesis?
suggested_experiments:
- hypothesis: Rnr1/Rnr3 heterodimers increase dNTP output when Rnr1 is limiting
  description: Measure dNTP pools and replication fork progression after MMS in rnr1 hypomorph strains with and
    without RNR3, and in strains expressing catalytically dead Rnr3 (active-site cysteine mutants).
  experiment_type: genetics / dNTP measurement
