gene_symbol: IPT1
organism: yeast
uniprot_id: P38954
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the addition of a phosphorylinositol group onto mannosyl phosphorylinositol
    ceramide (MIPC) to form mannosyl diphosphorylinositol ceramide (M(IP)2C), the
    major sphingolipid in membranes of S.cerevisiae.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38954
  source_id: P38954
- source: Alliance_Imported
  text: Inositolphosphotransferase; involved in synthesis of mannose-(inositol-P)2-ceramide
    (M(IP)2C), the most abundant sphingolipid; can mutate to resistance to the antifungals
    syringomycin E and DmAMP1 and to K. lactis zymocin
  source_type: curated
  url: https://www.yeastgenome.org/locus/IPT1
  source_id: SGD:S000002479
- source: Alliance_Automated
  text: Enables transferase activity, transferring phosphorus-containing groups. Involved
    in mannosyl diphosphorylinositol ceramide metabolic process; negative regulation
    of autophagy; and sphingolipid biosynthetic process. Located in Golgi membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/IPT1
  source_id: SGD:S000002479
fetch_date: '2026-11-01'
