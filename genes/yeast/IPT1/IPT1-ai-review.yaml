  label: Saccharomyces cerevisiae S288C
description: 'Ipt1 (inositolphosphotransferase 1) is the mannosyl-diinositol phosphorylceramide (M(IP)2C)
  synthase of Saccharomyces cerevisiae, a multipass Golgi membrane protein of the Aur1 family. It transfers
  a second phosphoinositol group from phosphatidylinositol onto mannosylinositol phosphorylceramide (MIPC),
  releasing diacylglycerol and producing M(IP)2C, the terminal and most abundant complex sphingolipid
  of yeast membranes (EC 2.7.1.228). ipt1 deletion mutants lack M(IP)2C and accumulate MIPC but grow nearly
  normally; they are resistant to M(IP)2C-targeting antifungal plant defensins such as DmAMP1, slightly
  resistant to high Ca2+, and (together with skn1) show increased autophagy under nitrogen starvation.'
