suggested_questions:
- question: GO:0045140 inositol phosphoceramide synthase activity is classified under 
    hexosyltransferase activity, although IPC and M(IP)2C synthases transfer phosphoinositol from PI
    (phosphotransferases, EC 2.7.1.227/228). Should the term be re-parented, with a sibling term 
    added for the M(IP)2C synthase reaction?
proposed_new_terms:
- proposed_name: mannosylinositol phosphorylceramide inositolphosphotransferase activity
  proposed_definition: 'Catalysis of the reaction: a mannosylinositol-1-phospho-N-acylsphingoid base (MIPC)
    + a 1,2-diacyl-sn-glycero-3-phospho-(1D-myo-inositol) = an inositol phosphomannosylinositol-1-phospho-N-acylsphingoid
    base (M(IP)2C) + a 1,2-diacyl-sn-glycerol.'
  justification: EC 2.7.1.228 / RHEA:64540 and RHEA:55604 describe the terminal step of yeast 
    complex sphingolipid synthesis, experimentally attributed to Ipt1, but GO has no corresponding 
    MF; current annotations fall back to the generic GO:0016772. A sibling of GO:0045140 inositol 
    phosphoceramide synthase activity would capture it.
