  review:
    summary: SGD EXP from Racenis et al. 1992, which first detected NADPH-specific acyl/alkyl-DHAP reductase
      (EC 1.1.1.101) activity in total yeast membranes. The study predates gene identification, but the
      activity it measured was later shown to be encoded by AYR1 (deletion and E. coli expression).
    action: ACCEPT
    reason: Activity is the defining catalytic function of Ayr1; the curator linked the 1992 biochemistry
      to the gene, consistent with the 2000 genetic identification.
    supported_by:
    - reference_id: PMID:1512203
      supporting_text: Total membrane fraction of S. cerevisiae also exhibited acyl/alkyl DHAP reductase
        (EC 1.1.1.101) activity, which has not been reported previously.
    - reference_id: PMID:10617610
      supporting_text: Heterologous expression of Ayr1p in Escherichia coli resulted in gain of ADR activity
        in the prokaryote, confirming that YIL124w is the structural gene of the enzyme
