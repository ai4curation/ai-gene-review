    label: ligand-gated channel activity
  evidence_type: IDA
  original_reference_id: PMID:28916712
  qualifier: enables
  review:
    summary: IDA from Kruger et al. 2017; purified Ayr1 reconstituted in planar bilayers gave a cation-selective
      channel whose gating was stimulated by NADPH (abolished by mutating the Rossmann-fold glycines),
      but not by the substrate acyl-DHAP.
    action: KEEP_AS_NON_CORE
    reason: Experimental annotation from a single electrophysiology study; it has not been independently
      confirmed, and a physiological transport role is not known. Retain as non-core rather than overrule
      the curator.
    supported_by:
    - reference_id: PMID:28916712
      supporting_text: We conclude that Ayr1 forms a cation-selective channel that is stimulated by NADPH.
