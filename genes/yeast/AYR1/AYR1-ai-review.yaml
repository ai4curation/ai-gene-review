  review:
    summary: PAINT IBA for triacylglycerol lipase activity at an SDR node grounded only in Ayr1's own
      experimental annotation (24187129). Ayr1 is a short-chain dehydrogenase/reductase, not a canonical
      alpha/beta-hydrolase lipase; the lipase activity is minor.
    action: KEEP_AS_NON_CORE
    reason: The Ayr1 lipase activity is experimentally supported but quantitatively minor relative to
      Tgl3/Tgl4; retain as a secondary activity rather than a core function. Clade-wide inheritance of
      lipase activity among SDR relatives is not established by other family members.
    supported_by:
