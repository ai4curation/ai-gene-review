proposed_new_terms: []
suggested_questions:
- question: Which enzyme supplies the residual (about one third) microsomal acyl-DHAP reductase activity
    in ayr1 cells, and how much of cellular phosphatidate flux passes through the DHAP route versus direct
    glycerol-3-phosphate acylation?
- question: Is the NADPH-stimulated channel activity reported for reconstituted Ayr1 physiologically relevant
    in the mitochondrial outer membrane, or is it a property of the purified SDR in bilayers?
suggested_experiments:
- description: Quantify 13C-glycerol versus 13C-DHAP incorporation into lysophosphatidate and PA in wild
    type, ayr1, and ayr1 with candidate microsomal SDR deletions.
  experiment_type: metabolic labelling/genetics
  hypothesis: A second microsomal reductase accounts for residual ADR activity, and the DHAP route carries
    a substantial share of de novo PA synthesis.
