id: P40471
gene_symbol: AYR1
aliases:
- YIL124W
- GBG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: AYR1 encodes NADPH-dependent 1-acyldihydroxyacetone-phosphate reductase (ADR; EC 1.1.1.101),
  a short-chain dehydrogenase/reductase (SDR) family enzyme that reduces 1-acyl-dihydroxyacetone phosphate
  (acyl-DHAP) to 1-acyl-sn-glycerol 3-phosphate (lysophosphatidic acid). This is the second step of the
  dihydroxyacetone-phosphate route to phosphatidic acid, linking the dual-specificity G3P/DHAP acyltransferases
  Gpt2/Gat1 and Sct1/Gat2 to the lysophosphatidate acyltransferases (Slc1, Ale1). Ayr1 is a constitutive
  lipid droplet protein that is also present in the endoplasmic reticulum and, by fractionation, in the
  mitochondrial outer membrane. Its deletion abolishes ADR activity in lipid droplets and lowers it about
  3-fold in microsomes, implying an additional microsomal ADR; ayr1 spores fail to germinate. Ayr1 has
  a minor triacylglycerol lipase activity that contributes to triacylglycerol mobilization in the absence
  of the main lipases Tgl3/Tgl4/Tgl5. When purified and reconstituted, it has also been reported to form
  an NADPH-stimulated, cation-selective channel in lipid bilayers.
