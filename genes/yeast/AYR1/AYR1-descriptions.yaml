descriptions:
- source: UniProt
  text: Can convert acyl and alkyl dihydroxyacetone-phosphate (DHAP) into glycerolipids
    and ether lipids, respectively. Required for the biosynthesis of phosphatidic
    acid via the DHAP pathway, where it reduces 1-acyl DHAP to lysophosphatidic acid
    (LPA) (PubMed:10617610, PubMed:1512203). Also has triacylglycerol (TAG) lipase
    activity. Involved in the mobilization of the non-polar storage lipids triacylglycerols
    (TAGs) from lipid particles by hydrolysis of TAGs (PubMed:24187129). Required
    for spore germination (PubMed:10617610). Plays a role in cell wall biogenesis,
    but this effect may be indirect by affecting the activities of cell wall synthesis
    enzymes (PubMed:23956635). Lipolysis of TAG by AYR1 is essential for starvation-induced
    autophagy (PubMed:26162625). Forms an NADPH- regulated cation-selective channel
    in the mitochondrial outer membrane (PubMed:28916712).
