gene_symbol: AYR1
organism: yeast
uniprot_id: P40471
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Can convert acyl and alkyl dihydroxyacetone-phosphate (DHAP) into glycerolipids
    and ether lipids, respectively. Required for the biosynthesis of phosphatidic
    acid via the DHAP pathway, where it reduces 1-acyl DHAP to lysophosphatidic acid
    (LPA) (PubMed:10617610, PubMed:1512203). Also has triacylglycerol (TAG) lipase
    activity. Involved in the mobilization of the non-polar storage lipids triacylglycerols
    (TAGs) from lipid particles by hydrolysis of TAGs (PubMed:24187129). Required
    for spore germination (PubMed:10617610). Plays a role in cell wall biogenesis,
    but this effect may be indirect by affecting the activities of cell wall synthesis
    enzymes (PubMed:23956635). Lipolysis of TAG by AYR1 is essential for starvation-induced
    autophagy (PubMed:26162625). Forms an NADPH- regulated cation-selective channel
    in the mitochondrial outer membrane (PubMed:28916712).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40471
  source_id: P40471
- source: Alliance_Imported
  text: Bifunctional triacylglycerol lipase and 1-acyl DHAP reductase; NADPH-dependent
    1-acyl dihydroxyacetone phosphate reductase involved in phosphatidic acid biosynthesis;
    lipid droplet triacylglycerol lipase involved in mobilization of non-polar lipids;
    found in lipid particles, endoplasmic reticulum and mitochondrial outer membrane;
    forms NADPH-regulated channel in mitochondrial outer membrane; required for spore
    germination; role in cell wall biosynthesis; capable of metabolizing steroid hormones
  source_type: curated
  url: https://www.yeastgenome.org/locus/AYR1
  source_id: SGD:S000001386
- source: Alliance_Automated
  text: Enables acylglycerone-phosphate reductase (NADP+) activity; ligand-gated channel
    activity; and triacylglycerol lipase activity. Involved in phosphatidic acid biosynthetic
    process and triglyceride catabolic process. Located in endoplasmic reticulum and
    lipid droplet. Is active in mitochondrial outer membrane. Human ortholog(s) of
    this gene implicated in Stargardt disease 5. Orthologous to human RDH8 (retinol
    dehydrogenase 8).
  source_type: automated
