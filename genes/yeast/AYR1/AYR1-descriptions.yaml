  text: Enables acylglycerone-phosphate reductase (NADP+) activity; ligand-gated channel
    activity; and triacylglycerol lipase activity. Involved in phosphatidic acid biosynthetic
    process and triglyceride catabolic process. Located in endoplasmic reticulum and
    lipid droplet. Is active in mitochondrial outer membrane. Human ortholog(s) of
    this gene implicated in Stargardt disease 5. Orthologous to human RDH8 (retinol
    dehydrogenase 8).
