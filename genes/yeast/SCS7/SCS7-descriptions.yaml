descriptions:
- source: UniProt
  text: Ceramide hydroxylase involved in the hydroxylation of sphingolipid-associated
    very long chain fatty acids (PubMed:16652392, PubMed:19074599, PubMed:26977056,
    PubMed:9353282, PubMed:9368039, PubMed:9559540). Postulated to hydroxylate the
    very long chain fatty acid of dihydroceramides and phytoceramides at C-2 (PubMed:26977056,
    PubMed:9368039).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03529
  source_id: Q03529
- source: Alliance_Imported
  text: Sphingolipid alpha-hydroxylase; functions in the alpha-hydroxylation of sphingolipid-associated
    very long chain fatty acids, has both cytochrome b5-like and hydroxylase/desaturase
    domains, not essential for growth
  source_type: curated
  url: https://www.yeastgenome.org/locus/SCS7
  source_id: SGD:S000004885
- source: Alliance_Automated
  text: Enables fatty acid 2-hydroxylase activity; sphingolipid C4-monooxygenase activity;
    and zinc ion binding activity. Involved in ceramide biosynthetic process; inositol
    phosphoceramide metabolic process; and very long-chain fatty acid metabolic process.
    Located in endoplasmic reticulum. Human ortholog(s) of this gene implicated in
    hereditary spastic paraplegia 35. Orthologous to human FA2H (fatty acid 2-hydroxylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SCS7
  source_id: SGD:S000004885
