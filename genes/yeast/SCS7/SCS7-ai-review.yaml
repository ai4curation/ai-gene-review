id: Q03529
gene_symbol: SCS7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Scs7 (Fah1) is the sphingolipid fatty acid alpha-hydroxylase of Saccharomyces cerevisiae, an integral
  ER-membrane enzyme of the sterol desaturase/FA2H family with an N-terminal cytochrome b5 domain. It hydroxylates
  the C-2 position of the very-long-chain (C26) fatty acyl chain of ceramides, mainly phytoceramides, using electrons
  from cytochrome b5 and O2, generating the alpha-hydroxylated ceramides that form the predominant inositolphosphorylceramide
  species IPC-C and the downstream mannosylated sphingolipids. Its 2.6 A crystal structure shows a helical catalytic
  cap on four transmembrane helices with a di-zinc centre coordinated by ten conserved histidines near the cytosolic
  membrane surface. Scs7 acts in parallel with Sur2, which hydroxylates C-4 of the sphingoid base. scs7 deletion
  is viable, eliminates alpha-hydroxy C26 fatty acids from sphingolipids, suppresses the Ca2+ sensitivity of csg
  mutants and confers syringomycin E resistance. Scs7 is the yeast homologue of human FA2H.
