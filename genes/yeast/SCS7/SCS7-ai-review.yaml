core_functions:
- description: ER-membrane cytochrome b5-fused, di-zinc fatty acid hydroxylase that alpha(C-2)-hydroxylates the
    C26 very-long-chain fatty acyl moiety of phytoceramide (and dihydroceramide), producing the 2-hydroxy ceramides
    that give rise to IPC-C and downstream mannosylated sphingolipids.
