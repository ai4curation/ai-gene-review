suggested_questions:
- question: Does Scs7 act on free ceramide only, or also on IPC, and what is its relative preference for phytoceramide
    versus dihydroceramide in vivo?
suggested_experiments:
- description: Assay purified or microsomal Scs7 with defined C26 phytoceramide, dihydroceramide and IPC substrates
    and cytochrome b5/b5 reductase to determine substrate preference and whether the fused b5 domain suffices for
    electron supply.
