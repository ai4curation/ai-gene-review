description: JEM1/KAR8 encodes an ER membrane DnaJ/Hsp40-family co-chaperone with
  a lumen-facing J-domain. Jem1 works with the ER Hsp70 Kar2/BiP and overlaps partly
  with Scj1 to support ER protein folding and ERAD of soluble luminal misfolded substrates
  by keeping them soluble and retrotranslocation competent. Jem1 is also required
  for nuclear membrane fusion during mating karyogamy at the ER/nuclear envelope membrane
  system.
