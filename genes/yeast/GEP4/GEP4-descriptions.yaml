taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Phosphatidylglycerophosphatase involved in the biosynthesis of cardiolipin
    (CL), a unique dimeric phosphoglycerolipid predominantly present in mitochondrial
    membranes and which has important functions for cellular energy metabolism, mitochondrial
    dynamics and the initiation of apoptotic pathways. Required for the stability
    of respiratory chain supercomplexes and for growth at elevated temperature, in
    presence of ethidium bromide or in absence of prohibitins.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38812
  source_id: P38812
- source: Alliance_Imported
  text: Mitochondrial phosphatidylglycerophosphatase (PGP phosphatase); dephosphorylates
    phosphatidylglycerolphosphate to generate phosphatidylglycerol, an essential step
    during cardiolipin biosynthesis; null mutant is sensitive to tunicamycin, DTT
  source_type: curated
  url: https://www.yeastgenome.org/locus/GEP4
  source_id: SGD:S000001142
- source: Alliance_Automated
  text: Enables phosphatidylglycerophosphatase activity. Involved in cardiolipin biosynthetic
    process. Located in mitochondrial matrix. Is extrinsic component of mitochondrial
    inner membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/GEP4
  source_id: SGD:S000001142
