id: P38812
gene_symbol: GEP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Gep4 (YHR100C) is the mitochondrial phosphatidylglycerophosphate (PGP) phosphatase of Saccharomyces
  cerevisiae, a HAD-superfamily phosphatase of the PGPP1/Gep4 family. It is a peripheral protein on the
  matrix side of the mitochondrial inner membrane, where it dephosphorylates phosphatidylglycerophosphate
  (made from CDP-diacylglycerol and glycerol-3-phosphate by Pgs1) to phosphatidylglycerol (EC 3.1.3.27),
  the second step of the mitochondrial phosphatidylglycerol branch and an obligatory step for cardiolipin
  synthesis by Crd1. Loss of Gep4 causes accumulation of PGP and loss of phosphatidylglycerol and cardiolipin;
  a mitochondrially targeted E. coli PgpA restores cardiolipin, showing functional conservation with the
  bacterial PGP phosphatases. gep4 mutants are sensitive to elevated temperature and ethidium bromide
  and are synthetically sick with loss of prohibitins.
