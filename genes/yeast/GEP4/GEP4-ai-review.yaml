suggested_questions:
- question: Does Gep4 have substrates other than PGP in vivo (HAD phosphatases are often promiscuous),
    and does it act on the lyso-PGP or other glycerophospholipid phosphates?
- question: Is Gep4 activity regulated by Tam41/Pgs1 levels or by respiratory growth, given the requirement
    for CL in supercomplex stability?
suggested_experiments:
- description: Purify recombinant Gep4 and measure steady-state kinetics with PGP versus other phosphomonoester
    lipids and soluble phosphates to define its substrate range.
