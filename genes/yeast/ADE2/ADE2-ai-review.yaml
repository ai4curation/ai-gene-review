id: P21264
gene_symbol: ADE2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Ade2 (YOR128C) is the phosphoribosylaminoimidazole (AIR) carboxylase of Saccharomyces cerevisiae,
  catalysing step 6 of de novo IMP synthesis. Like other fungal and plant enzymes it is a two-domain fusion: an
  N-terminal PurK-like ATP-grasp domain that carboxylates AIR with bicarbonate and ATP to N5-carboxyaminoimidazole
  ribonucleotide (N5-CAIR), and a C-terminal class I PurE domain that rearranges N5-CAIR to CAIR. ade2 mutants require
  adenine and accumulate a red vacuolar pigment derived from AIR, the basis of the widely used red/white colony
  colour assay. Ade2 is cytoplasmic.'
existing_annotations:
- term:
    id: GO:0004638
    label: phosphoribosylaminoimidazole carboxylase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - CGD:CAL0000185210
  - PANTHER:PTN000549205
  - SGD:S000005654
  - UniProtKB:P09029
  review:
    summary: PAINT IBA (PANTHER:PTN000549205) for AIR carboxylase activity. Right step, but the term is the class
      II direct-carboxylase reaction.
    action: MODIFY
    reason: GO:0004638 (EC 4.1.1.21) describes direct CO2-dependent carboxylation of AIR, the class II (animal PAICS)
      chemistry. Ade2 is the fungal/plant fusion of a PurK-type ATP-grasp N5-CAIR synthetase and a class I PurE
      N5-CAIR mutase (InterPro IPR005875 PurK, IPR033747 PurE_ClassI); the Cryptococcus ortholog was shown to use
      AIR + ATP + HCO3- and to make N5-CAIR. The two specific activities describe Ade2 correctly.
    proposed_replacement_terms:
    - id: GO:0034028
      label: 5-(carboxyamino)imidazole ribonucleotide synthase activity
    - id: GO:0034023
      label: 5-(carboxyamino)imidazole ribonucleotide mutase activity
    supported_by:
    - reference_id: PMID:9500840
      supporting_text: The N-terminal domain is related to E. coli PurK and a series of kinetic experiments show
        that the ADE2-PurK activity uses AIR, ATP, and HCO3- as substrates.
    - reference_id: PMID:9500840
      supporting_text: Amino acid sequence alignments, C-terminal deletion mutants, and biochemical assays indicate
        that the ADE2 enzyme is a two-domain, bifunctional protein.
