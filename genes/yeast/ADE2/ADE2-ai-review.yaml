suggested_questions:
- question: Should YeastPathways and the PAINT/EC mappings represent fungal Ade2 as the two-step PurK (EC 6.3.4.18)
    + class I PurE (EC 5.4.99.18) route rather than the class II EC 4.1.1.21 direct carboxylation?
- question: Has the N5-CAIR intermediate been demonstrated directly for S. cerevisiae Ade2, as it has for the Cryptococcus
    neoformans ortholog?
suggested_experiments:
- hypothesis: S. cerevisiae Ade2 forms N5-CAIR from AIR, ATP and bicarbonate and converts it to CAIR, like the Cryptococcus
    ortholog.
  description: Purify recombinant Ade2 and its isolated N- and C-terminal domains; assay AIR + ATP + HCO3- turnover
    and detect N5-CAIR by NMR; test complementation of E. coli purK and purE mutants by each domain.
