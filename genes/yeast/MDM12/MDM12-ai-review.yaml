id: Q92328
gene_symbol: MDM12
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Mdm12 (mitochondrial distribution and morphology 12; YOL009C) is the soluble, cytosolic
  SMP-domain subunit of the ER-mitochondria encounter structure (ERMES). It has no transmembrane segment
  and is held at ER-mitochondria contacts by its partners: its SMP domain binds the SMP domain of the
  ER-anchored Mmm1 to form an Mmm1-Mdm12 heterotetramer, and it bridges Mmm1 to the outer membrane SMP-domain
  subunit Mdm34, giving a zig-zag bridge of SMP domains across the contact. Crystal structures show a
  hydrophobic phospholipid-binding channel in Mdm12, which binds glycerophospholipids. Free Mdm12 transfers
  lipids between liposomes only weakly, whereas the Mmm1-Mdm12 complex is an efficient lipid transfer
  unit, and mutations in the Mdm12 pocket impair phosphatidylserine transport from the ER to mitochondria.
  Mdm12 is required for assembly of ERMES foci and for the Mmm1-Mdm10 connection. Its loss causes giant
  spherical mitochondria defective in inheritance, mtDNA nucleoid loss, reduced cardiolipin and an increase
  in peroxisome number; the mitochondrial defects are rescued by an artificial ER-mitochondria tether.
  Mdm12 has also been implicated with Mmm1 in a late step of outer membrane beta-barrel protein assembly.'
