- term:
    id: GO:0000001
    label: mitochondrion inheritance
  evidence_type: IMP
  original_reference_id: PMID:9024686
  qualifier: involved_in
  review:
    summary: 'Mitochondrion inheritance (IMP): mdm12 cells have giant round mitochondria that are defective
      for inheritance by daughter buds.'
    action: KEEP_AS_NON_CORE
    reason: 'A correctly recorded mutant phenotype, and the historical basis of the MDM name. Mdm12 is
      not known to perform a step of mitochondrial transport into the bud: the defect is most plausibly
      secondary to the collapse of the mitochondrial network and loss of ER-mitochondria tethering (the
      morphology defect of mdm12 cells is restored by an artificial tether, and ERMES-deficiency phenotypes
      are bypassed by VPS13 alleles; Nguyen et al. 2012 concluded directly that ERMES-mutant inheritance
      defects are secondary to the morphology defect). Kept, deferring to the experimental record, as
      non-core.'
    supported_by:
    - reference_id: PMID:9024686
      supporting_text: possess abnormally large, round mitochondria that are defective for inheritance
        by daughter buds
    - reference_id: PMID:22409400
      supporting_text: we report that mitochondrial inheritance defects in ERMES mutants are a secondary
        consequence of mitochondrial morphology defects, arguing against a primary role for ERMES in mitochondrial
        association with actin and mitochondrial movement
    - reference_id: PMID:19556461
      supporting_text: ChiMERA expression also restored the mitochondrial morphology of mdm12Δ and mdm34Δ
        strains
    - reference_id: PMID:26370498
      supporting_text: The fact that it suppresses ERMES mtDNA defects indicates that these are secondary
        to the loss of a primary ERMES function.
