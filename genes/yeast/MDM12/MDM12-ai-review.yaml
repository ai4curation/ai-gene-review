    label: phospholipid homeostasis
  evidence_type: NAS
  original_reference_id: PMID:21945531
  qualifier: involved_in
  review:
    summary: Phospholipid homeostasis (NAS) from the ERMES composition/topology study.
    action: KEEP_AS_NON_CORE
    reason: ERMES mutants show reduced cardiolipin and slowed PS-to-PC conversion; these are consequences
      of impaired ER-to-mitochondria phospholipid transfer, which MDM12 executes as part of ERMES. The
      homeostasis term is a reasonable but indirect description of that role; the direct process is captured
      by phospholipid transport / intermembrane lipid transfer.
    supported_by:
    - reference_id: PMID:21945531
