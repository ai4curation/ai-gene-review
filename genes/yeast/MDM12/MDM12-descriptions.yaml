- source: Alliance_Automated
  text: Enables mitochondrion-endoplasmic reticulum membrane tether activity. Contributes
    to lipid transfer activity. Involved in several processes, including aminophospholipid
    transport; mitochondrial outer membrane translocase complex assembly; and mitochondrion
    inheritance. Acts upstream of or within phospholipid transport. Located in mitochondrial
    outer membrane. Is active in ERMES complex.
