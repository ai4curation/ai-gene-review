descriptions:
- source: UniProt
  text: Component of the ERMES/MDM complex, which serves as a molecular tether to
    connect the endoplasmic reticulum and mitochondria (PubMed:19556461, PubMed:22250200).
    Components of this complex are involved in the control of mitochondrial shape
    and protein biogenesis, and function in nonvesicular lipid trafficking between
    the ER and mitochondria (PubMed:19556461, PubMed:27469264). MDM12 is required
    for the interaction of the ER-resident membrane protein MMM1 and the outer mitochondrial
    membrane-resident beta-barrel protein MDM10. The MDM12- MMM1 subcomplex functions
    in the major beta-barrel assembly pathway that is responsible for biogenesis of
    all mitochondrial outer membrane beta-barrel proteins, and acts in a late step
    after the SAM complex. The MDM10-MDM12-MMM1 subcomplex further acts in the TOM40-specific
    pathway after the action of the MDM12-MMM1 complex. Essential for establishing
    and maintaining the structure of mitochondria and maintenance of mtDNA nucleoids
    (By similarity) (PubMed:17410204).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q92328
  source_id: Q92328
- source: Alliance_Imported
  text: Mitochondrial outer membrane protein, ERMES complex subunit; required for
    transmission of mitochondria to daughter cells; required for mitophagy; may influence
    import and assembly of outer membrane beta-barrel proteins; localizes to mitochondria–ER
    contact sites; ERMES complex is often co-localized with peroxisomes and with concentrated
    areas of pyruvate dehydrogenase
  source_type: curated
  url: https://www.yeastgenome.org/locus/MDM12
  source_id: SGD:S000005369
- source: Alliance_Automated
  text: Enables mitochondrion-endoplasmic reticulum membrane tether activity. Contributes
    to lipid transfer activity. Involved in several processes, including aminophospholipid
    transport; mitochondrial outer membrane translocase complex assembly; and mitochondrion
    inheritance. Acts upstream of or within phospholipid transport. Located in mitochondrial
    outer membrane. Is active in ERMES complex.
  source_type: automated
