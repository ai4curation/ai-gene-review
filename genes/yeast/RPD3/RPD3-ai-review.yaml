references:
- id: file:yeast/RPD3/RPD3-deep-research-falcon.md
  title: Falcon deep research report on RPD3
  findings:
  - statement: 'Rpd3 (YNL330C, UniProt P32561) is a Class I, Zn2+-dependent histone deacetylase that

      acts as the catalytic subunit of the Sin3-associated HDAC complexes Rpd3L and Rpd3S,

      rather than as a free enzyme. It is regarded as the founding member of Class I HDACs

      in yeast.

      '
    supporting_text: The literature synthesized here refers specifically to *S. cerevisiae* **Rpd3**
      (gene **RPD3**, ORF **YNL330C**), a **class I histone deacetylase (HDAC)** that is the
      catalytic subunit of **Sin3-associated** HDAC complexes **Rpd3L** and **Rpd3S**.
  - statement: 'The Rpd3 active site is zinc-dependent; a 2023 Rpd3S-nucleosome cryo-EM structure

      identifies the catalytic Zn2+ coordinated/stabilized by D186, H188, and D274 in Rpd3.

      '
    supporting_text: 'Mechanistically, its catalytic site is **Zn²⁺-dependent**: a 2023 Rpd3S–nucleosome
      cryo-EM structure describes a catalytic Zn²⁺ coordinated/stabilized by **D186, H188, and D274**
      in Rpd3.'
  - statement: 'The HDAC reaction catalyzed by Rpd3-containing complexes is hydrolytic removal of

      acetyl groups from epsilon-N-acetyl-lysine residues on histone tails, modulating

      chromatin accessibility and transcriptional output.

      '
    supporting_text: Rpd3-containing complexes remove acetyl groups from ε-N-acetyl-lysine residues
      on histone tails (lysine deacetylation), modulating chromatin accessibility and
      transcriptional output.
  - statement: 'Rpd3 forms two distinct Sin3-associated complexes that target different genomic

      regions: Rpd3L (large, promoter-associated) and Rpd3S (small, gene-body-associated).

      '
    supporting_text: 'A central organizing principle is that Rpd3 forms **two distinct Sin3-associated
      complexes** that target different genomic regions:'
  - statement: 'In the 12-subunit Rpd3L complex, Rpd3 is the sole catalytic subunit; the complex is

      an asymmetric dimer with two copies each of Sin3, Rpd3, and Ume1, and the active site

      of one Rpd3 is occluded by a leucine from Rxt2, indicating complex-mediated regulation

      of catalytic accessibility.

      '
    supporting_text: It showed Rpd3 is the **sole catalytic subunit** and that the complex is
      organized as an **asymmetric dimer** in which **two copies each of Sin3, Rpd3, and Ume1** form
      two lobes. Importantly, it found that the **active site of one Rpd3 is occluded** by a leucine
      from **Rxt2**, indicating complex-mediated regulation of catalytic accessibility.
  - statement: 'Rpd3L shares the Rpd3/Sin3/Ume1 catalytic-scaffold core with Rpd3S but contains

      Rpd3L-specific accessory subunits including Pho23, Rxt2, Rxt3, Sap30, Sds3, and Dep1,

      and acts primarily at promoters performing localized deacetylation near recruitment

      sites of DNA-binding factors.

      '
    supporting_text: Rpd3L is described as acting primarily at **promoters**, performing localized
      deacetylation near recruitment sites of DNA-binding factors.
  - statement: 'The Rpd3S complex core comprises Rpd3, Sin3, and Ume1 (shared with Rpd3L) plus the

      Rpd3S-specific chromatin-binding subunits Eaf3 and Rco1. The complete nucleosome-bound

      Rpd3S assembly has stoichiometry 1x Sin3, 1x Rpd3, 1x Ume1, and 2x each of Eaf3 and Rco1.

      '
    supporting_text: A 2023 report on the complete Rpd3S–nucleosome assembly describes a
      nucleosome-bound complex with **1× Sin3, 1× Rpd3, 1× Ume1, and 2× each of Eaf3 and Rco1**.
  - statement: 'Rpd3S is recruited to transcribed gene bodies cotranscriptionally via Set2-dependent

      H3K36 methylation read by the Eaf3 chromodomain, while Rco1 PHD1 recognition of

      unmodified H3K4 helps restrict Rpd3S activity to coding regions.

      '
    supporting_text: Rpd3S is recruited to gene bodies via Set2-dependent **H3K36 methylation**;
      Eaf3’s chromodomain recognizes H3K36me2/3.
  - statement: 'Rpd3S is targeted to transcribed regions and suppresses cryptic/spurious intragenic

      transcription initiation, restoring deacetylated chromatin behind elongating RNA

      polymerase II.

      '
    supporting_text: Rpd3S is targeted to **transcribed regions** and functions to **suppress
      cryptic/spurious intragenic transcription initiation**, restoring deacetylated chromatin
      behind elongating RNA polymerase II.
  - statement: 'Rpd3S deacetylates multiple histone-tail acetyl-lysine sites: assayed H3 sites include

      H3K9ac, H3K14ac, H3K18ac, H3K23ac, H3K27ac and assayed H4 sites include H4K5ac, H4K8ac,

      H4K12ac, H4K16ac, with chromatin context and binding mode determining which lysines are

      presented to the active site.

      '
    supporting_text: '* **H3 sites assayed**: **H3K9ac, H3K14ac, H3K18ac, H3K23ac, H3K27ac**. (guan2023diversemodesof
      pages 5-6)

      * **H4 sites assayed**: **H4K5ac, H4K8ac, H4K12ac, H4K16ac**. (guan2023diversemodesof pages 5-6)'
  - statement: 'Purified Rpd3L is enzymatically active and responsive to known HDAC inhibitors such as

      SAHA (vorinostat), supporting use of the yeast complex as a model for class I HDAC

      pharmacology and complex-specific inhibitor discovery.

      '
    supporting_text: The 2023 Rpd3L structural paper reports that purified Rpd3L is enzymatically
      active and **responsive to known inhibitors such as SAHA (vorinostat)**, demonstrating
      assayability of the native complex.
