- term:
    id: GO:0031507
    label: heterochromatin formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The broad heterochromatin-formation IBA transfers positive heterochromatin assembly
      biology from other HDACs; budding-yeast Rpd3 instead antagonizes Sir-dependent spreading at
      silent-chromatin boundaries.
    action: MODIFY
    reason: 'The PTN000743059 PAINT node transfers GO:0031507 from fly Rpd3 and human HDAC1/HDAC2. In
      budding yeast, Rpd3 should not be read as a Sir complex factor that nucleates or spreads silent
      chromatin; direct experiments show that Rpd3L counteracts Sir2-dependent silencing at HM and telomeric
      boundaries and that RPD3 deletion enhances, rather than establishes, silencing at HM, telomeric,
      and rDNA loci. The PAINT node therefore crosses a regulatory-sign boundary: the source HDACs promote
      heterochromatin formation, whereas the S. cerevisiae evidence supports Rpd3-dependent heterochromatin
      boundary formation and negative regulation of silent chromatin formation.'
    proposed_replacement_terms:
    - id: GO:0033696
      label: heterochromatin boundary formation
    additional_reference_ids:
    - PMID:10388812
    - PMID:19372273
    supported_by:
    - reference_id: PMID:10388812
      supporting_text: deletion of the SIN3 and RPD3 genes enhances silencing, implying that the
        Sin3-Rpd3 complex functions to counteract, rather than to establish or maintain, silencing.
    - reference_id: PMID:19372273
      supporting_text: Rpd3p-mediated heterochromatin boundary regulation. Together, these data
        provide insight into the molecular mechanisms for the anti-silencing functions of Rpd3p
        during the formation of heterochromatin boundaries.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      source_entities:
