taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: RPD3 encodes a class I, zinc-dependent histone deacetylase that serves as a catalytic
  subunit of Sin3-associated Rpd3L and Rpd3S chromatin-modifying complexes in Saccharomyces
  cerevisiae. Rpd3L is recruited mainly to promoters by DNA-binding regulators and couples histone
  deacetylation to transcriptional repression or activation depending on promoter and stress
  context, whereas Rpd3S is recruited to transcribed coding regions through Set2-dependent H3K36
  methylation to restore deacetylated chromatin and suppress cryptic intragenic transcription. Rpd3
  also contributes to chromatin-boundary regulation at silent loci, replication timing and
  transcription-replication conflict buffering, heat-shock and nutrient-responsive transcriptional
  reprogramming, and rDNA organization during starvation responses.
