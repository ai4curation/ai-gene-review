gene_symbol: OAC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: OAC1 (YKL120W) encodes the mitochondrial oxaloacetate carrier, a member of the mitochondrial
  carrier (SLC25) family located in the inner mitochondrial membrane. Reconstituted Oac1 transports oxaloacetate,
  malonate, sulfate and thiosulfate by uniport and by exchange, and also transports alpha- and beta-isopropylmalate
  with high affinity. In vivo, Oac1 exports alpha-isopropylmalate (the first committed intermediate of
  leucine biosynthesis, made by mitochondrial Leu4) to the cytosol, probably in exchange for oxaloacetate;
  oac1 leu4 double mutants are leucine auxotrophs on fermentable carbon sources. It was originally proposed
  to import cytosolic oxaloacetate made by pyruvate carboxylase into mitochondria.
