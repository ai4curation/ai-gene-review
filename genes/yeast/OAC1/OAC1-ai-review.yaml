suggested_questions:
- question: What is the in vivo counter-substrate for alpha-isopropylmalate export by Oac1 (oxaloacetate,
    sulfate or another anion), and does Oac1 still import oxaloacetate under respiratory conditions?
suggested_experiments:
- description: Measure matrix and cytosolic alpha-IPM and oxaloacetate pools in oac1, leu4 and oac1 leu4
    strains by compartment-resolved metabolomics on glucose and on non-fermentable carbon sources.
