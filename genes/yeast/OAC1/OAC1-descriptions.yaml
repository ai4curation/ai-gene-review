descriptions:
- source: UniProt
  text: Antiporter that exchanges dicarboxylates and sulfur oxoanions across the inner
    membrane of mitochondria. Exports alpha- isopropylmalate from mitochondrial matrix
    to the cytosol, where it serves as a precursor for leucine biosynthesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32332
  source_id: P32332
- source: Alliance_Imported
  text: Mitochondrial inner membrane transporter; transports oxaloacetate, sulfate,
    thiosulfate, and isopropylmalate; member of the mitochondrial carrier family
  source_type: curated
  url: https://www.yeastgenome.org/locus/OAC1
  source_id: SGD:S000001603
- source: Alliance_Automated
  text: Enables dicarboxylic acid transmembrane transporter activity and sulfate transmembrane
    transporter activity. Involved in isopropylmalate transport; oxaloacetate transport;
    and sulfate transmembrane transport. Located in mitochondrial inner membrane.
    Orthologous to several human genes including SLC25A35 (solute carrier family 25
    member 35).
  source_type: automated
  url: https://www.yeastgenome.org/locus/OAC1
  source_id: SGD:S000001603
