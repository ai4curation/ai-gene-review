gene_symbol: CYB5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CYB5 (YNL111C) encodes the major microsomal cytochrome b5 of S. cerevisiae, a small tail-anchored
  heme protein inserted in the endoplasmic reticulum membrane with its b5 heme domain facing the cytoplasm.
  It acts as a one-electron carrier that shuttles reducing equivalents (from NADH-cytochrome b5 reductase
  or NADPH-cytochrome P450 reductase) to membrane-bound oxygenases. In ergosterol biosynthesis it is required
  for efficient sterol C-4 demethylation by the C-4 methylsterol oxidase Erg25, and it can alone support
  the CYP51 (Erg11) 14alpha-demethylation reaction, which explains why cells lacking NCP1 still make ergosterol;
  multicopy CYB5 suppresses the azole hypersensitivity of ncp1 mutants. CYB5 is not essential when the
  P450 reductase is present.
