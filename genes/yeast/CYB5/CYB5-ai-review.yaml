suggested_questions:
- question: Is free Cyb5 required for Erg3 C-5 desaturation and for Ole1 fatty acid desaturation in vivo,
    given that Ole1 and Scs7 carry fused b5 domains?
suggested_experiments:
- description: Profile sterols and fatty acids in cyb5, cyb5 ncp1 (with sterol supplementation) and cyb5
    ole1-b5-domain mutants to assign which oxygenases depend on free Cyb5 in vivo.
