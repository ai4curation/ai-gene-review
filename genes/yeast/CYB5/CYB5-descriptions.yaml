taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Membrane bound hemoprotein which function as an electron carrier for several
    membrane bound oxygenases. It plays a role in fatty-acid desaturation and is also
    involved in several steps of the sterol biosynthesis pathway, particularly in
    the 4-demethylation of the 4,4'-dimethyl zymosterol.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40312
  source_id: P40312
- source: Alliance_Imported
  text: Cytochrome b5; involved in the sterol and lipid biosynthesis pathways; acts
    as an electron donor to support sterol C5-6 desaturation
  source_type: curated
  url: https://www.yeastgenome.org/locus/CYB5
  source_id: SGD:S000005055
- source: Alliance_Automated
  text: Enables electron transfer activity. Involved in sterol biosynthetic process.
    Located in endoplasmic reticulum membrane. Human ortholog(s) of this gene implicated
    in methemoglobinemia and methemoglobinemia and ambiguous genitalia. Orthologous
    to human CYB5A (cytochrome b5 type A) and CYB5B (cytochrome b5 type B).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CYB5
  source_id: SGD:S000005055
