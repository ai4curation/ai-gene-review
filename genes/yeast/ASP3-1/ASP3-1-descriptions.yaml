descriptions:
- source: Alliance_Imported
  text: Cell-wall L-asparaginase II involved in asparagine catabolism; expression
    induced during nitrogen starvation; ORF contains a short non-coding RNA that enhances
    expression of full-length gene; likely arose in via horizontal gene transfer from
    wine yeast Wickerhamomyces anomalus or close relative; enzyme preparation shows
    antitumor activity; reference strain S288C has four copies of ASP3; ASP3-1 has
    paralog ASP3-3 that arose from a segmental duplication
