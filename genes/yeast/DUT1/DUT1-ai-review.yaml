suggested_questions:
- question: What fraction of dUMP for thymidylate synthesis comes from Dut1 versus the Dcd1 dCMP deaminase route
    in S. cerevisiae?
- question: Is the dITPase side activity of Dut1 relevant in vivo, e.g. in ham1 mutants exposed to base analogues?
suggested_experiments:
- hypothesis: Dut1 contributes to dITP detoxification when Ham1 is absent
  description: Compare HAP/base-analogue sensitivity and dITP pools in ham1 single mutants versus ham1 strains carrying
    a dUTPase-hypomorphic DUT1 allele, rescued by dTMP.
  experiment_type: genetics / nucleotide pool measurement
