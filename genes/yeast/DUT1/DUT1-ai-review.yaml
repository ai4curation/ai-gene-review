gene_symbol: DUT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'DUT1 (YBR252W) encodes dUTP pyrophosphatase (dUTPase, EC 3.6.1.23), a homotrimeric, Mg2+-dependent
  enzyme that hydrolyses dUTP to dUMP and diphosphate. The reaction has two roles: it keeps the dUTP/dTTP ratio
  low so that DNA polymerases do not incorporate uracil, and it supplies dUMP, the substrate of thymidylate synthase
  (Cdc21) for dTMP and hence dTTP synthesis. DUT1 is essential; dut1 null cells survive only with exogenous dTMP
  under some conditions, and their death results from massive uracil incorporation and futile Ung1-initiated excision
  repair. Each trimer binds three substrates between subunits using the conserved dUTPase motifs, and a conserved
  tyrosine excludes ribonucleotides. Purified Dut1 also hydrolyses the non-canonical nucleotide dITP in vitro, although
  the physiological relevance of this side activity is unknown. Dut1 is a soluble protein found in both the cytoplasm
  and nucleus.'
