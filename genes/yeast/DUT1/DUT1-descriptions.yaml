- source: Alliance_Imported
  text: Deoxyuridine triphosphate diphosphatase (dUTPase); catalyzes hydrolysis of
    dUTP to dUMP and PPi, thereby preventing incorporation of uracil into DNA during
    replication; critical for the maintenance of genetic stability; also has diphosphatase
    activity on deoxyinosine triphosphate; human homolog DUT allows growth of yeast
    haploid dut1 null mutant after sporulation of heterozygous diploid
