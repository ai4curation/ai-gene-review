gene_symbol: DUT1
organism: yeast
uniprot_id: P33317
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Involved in nucleotide metabolism via production of dUMP, the immediate precursor
    of thymidine nucleotides, and decreases the intracellular concentration of dUTP
    so that uracil cannot be incorporated into DNA (PubMed:21548881, PubMed:8223452).
    Shows a significant activity against dITP, another potentially mutagenic nucleotide
    (PubMed:21548881).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33317
  source_id: P33317
- source: Alliance_Imported
  text: Deoxyuridine triphosphate diphosphatase (dUTPase); catalyzes hydrolysis of
    dUTP to dUMP and PPi, thereby preventing incorporation of uracil into DNA during
    replication; critical for the maintenance of genetic stability; also has diphosphatase
    activity on deoxyinosine triphosphate; human homolog DUT allows growth of yeast
    haploid dut1 null mutant after sporulation of heterozygous diploid
  source_type: curated
  url: https://www.yeastgenome.org/locus/DUT1
  source_id: SGD:S000000456
- source: Alliance_Automated
  text: Enables dITP diphosphatase activity and dUTP diphosphatase activity. Involved
    in dITP catabolic process and dUTP catabolic process. Located in cytoplasm and
    nucleus. Used to study cancer. Human ortholog(s) of this gene implicated in diabetes
    mellitus. Orthologous to human DUT (deoxyuridine triphosphatase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DUT1
  source_id: SGD:S000000456
