descriptions:
- source: UniProt
  text: Involved in nucleotide metabolism via production of dUMP, the immediate precursor
    of thymidine nucleotides, and decreases the intracellular concentration of dUTP
    so that uracil cannot be incorporated into DNA (PubMed:21548881, PubMed:8223452).
    Shows a significant activity against dITP, another potentially mutagenic nucleotide
    (PubMed:21548881).
