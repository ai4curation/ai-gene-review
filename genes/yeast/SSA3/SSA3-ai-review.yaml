core_functions:
- description: |-
    Ssa3 is a stress-inducible cytosolic Hsp70 (Ssa subfamily) that acts as an
    ATP-dependent protein folding chaperone: its N-terminal nucleotide-binding
    (ATPase) domain binds and hydrolyzes ATP to drive cycles of high- and
    low-affinity binding of exposed hydrophobic segments on non-native
    polypeptides, preventing aggregation and promoting productive
    folding/refolding in the cytosol. Partner-class annotations also place Ssa3
    in the Hsp70/Hsp40/Hsp110 co-chaperone network, while SSA-family experiments
    support an additional role in post-translational precursor translocation.
  molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  - id: GO:0042026
    label: protein refolding
  - id: GO:0031204
    label: post-translational protein targeting to membrane, translocation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:yeast/SSA3/SSA3-deep-research-falcon.md
    supporting_text: |-
      SSA3 encodes a **cytosolic ATP-dependent protein chaperone** that participates in proteostasis by assisting folding/refolding and limiting aggregation of stress-denatured proteins.
    reference_section_type: OTHER
  - reference_id: PMID:9789005
    supporting_text: |-
      These findings indicate that, in vivo, the Hsp70 system assists in folding at least some newly translated cytosolic enzymes
    reference_section_type: ABSTRACT
