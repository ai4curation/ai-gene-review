      and SSA4 paralogy.
- source: Alliance_Automated
  text: Enables ATP hydrolysis activity. Involved in SRP-dependent cotranslational
    protein targeting to membrane, translocation; protein folding; and protein quality
    control for misfolded or incompletely synthesized proteins. Located in cytosol.
    Human ortholog(s) of this gene implicated in several diseases, including artery
    disease (multiple); autoimmune disease of musculoskeletal system (multiple); inner
    ear disease (multiple); lung disease (multiple); and schizophrenia (multiple).
    Orthologous to several human genes including HSPA1L (heat shock protein family
    A (Hsp70) member 1 like); HSPA1A (heat shock protein family A (Hsp70) member 1A);
    and HSPA1B (heat shock protein family A (Hsp70) member 1B).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SSA3
  source_id: SGD:S000000171
  review:
