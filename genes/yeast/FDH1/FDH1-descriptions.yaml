descriptions:
- source: UniProt
  text: Catalyzes the NAD(+)-dependent oxidation of formate to carbon dioxide. Formate
    oxidation is the final step in the methanol oxidation pathway in methylotrophic
    microorganisms (PubMed:11921099, PubMed:12144528, PubMed:9178506). Has a role
    in the detoxification of exogenous formate in non-methylotrophic organisms (PubMed:11921099).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08911
