suggested_questions:
- question: Does loss of FDH1 (in S288C, where FDH2 is non-functional) reduce formaldehyde tolerance,
    i.e. is formate oxidation flux-limiting for glutathione-dependent formaldehyde detoxification?
- question: Should the S288C reference FDH2 (YPL275W/YPL276W) be treated as a strain-specific pseudogene
    in pathway models of formate oxidation?
suggested_experiments:
- description: Compare formaldehyde sensitivity and formate secretion of fdh1 delta, yjl068c delta and
    sfa1 delta single mutants in S288C to test whether the FDH step contributes to formaldehyde detoxification.
