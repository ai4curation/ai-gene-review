id: Q08911
gene_symbol: FDH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FDH1 (YOR388C) encodes the NAD(+)-dependent formate dehydrogenase (EC 1.17.1.9) of Saccharomyces
  cerevisiae, a cytosolic member of the D-isomer-specific 2-hydroxyacid dehydrogenase family that oxidises
  formate to CO2 with reduction of NAD(+) to NADH. The enzyme is strictly NAD(+)-specific (Asp196/Tyr197
  determine coenzyme specificity) and is induced by formate. Its physiological role is the disposal of
  formate, whether supplied exogenously or produced intracellularly, for example as the end product of
  glutathione-dependent formaldehyde oxidation (Sfa1, then S-formylglutathione hydrolase Yjl068c) or from
  one-carbon metabolism; fdh mutants secrete formate instead of oxidising it. In strains carrying an intact
  paralogue FDH2 (e.g. CEN.PK) the two genes together provide all formate dehydrogenase activity, whereas
  in the S288C reference background FDH2 is split into two truncated ORFs (YPL275W/YPL276W) so FDH1 is
  the functional copy. Formate oxidation allows co-consumption of formate with glucose and increases biomass
  yield.
