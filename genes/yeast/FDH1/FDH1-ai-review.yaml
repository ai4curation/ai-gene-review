- term:
    id: GO:0046294
    label: formaldehyde catabolic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY-1801-1
  review:
    summary: 'Inherited from YeastPathways PWY-1801-1 ''formaldehyde oxidation II (glutathione-dependent)'',
      whose last step is formate oxidation. Fdh1 does not act on formaldehyde or a formaldehyde adduct:
      formaldehyde is consumed by Sfa1 and the resulting S-formylglutathione is hydrolysed to formate
      by Yjl068c. Fdh1 acts downstream on formate, which it also oxidises from other sources (exogenous
      formate, one-carbon metabolism). Its specific process is formate catabolism (annotated separately).
      No cached evidence shows fdh1 formaldehyde sensitivity. The pathway assignment is defensible at
      the level of complete oxidation of formaldehyde to CO2, so kept as non-core rather than removed.'
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:11921099
      supporting_text: These findings are consistent with a role of formate dehydrogenase in the detoxification
