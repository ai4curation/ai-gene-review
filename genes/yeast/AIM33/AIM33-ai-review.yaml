existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      PAINT plasma-membrane placement for the AIM33/PGA3 lineage.
    action: ACCEPT
    reason: >-
      The IBA is placed at PANTHER node PTN001064672 with the WGD paralog PGA3 as supporting
      evidence. The local PAINT loss table independently records loss of the ancestral
      mitochondrion placement at this same AIM33/PGA3 subfamily node, so the tree curation
      specifically supports lineage specialization away from the mitochondrial family
      location. AIM33's mitochondrial-genome phenotype is not localization evidence. Retain
      plasma membrane as a phylogenetic prediction while noting that endogenous imaging has
      not yet tested it directly.
- term:
    id: GO:0004128
    label: cytochrome-b5 reductase activity, acting on NAD(P)H
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      PAINT cytochrome-b5 reductase assignment, supported by the diagnostic reductase domains.
    action: ACCEPT
    reason: >-
      PAINT places this activity at PTN000452207 and carries it into the AIM33 lineage, with
      MCR1 and PGA3 among the supporting family members. AIM33 retains the FAD-binding FR-type
      and NAD(P)H-binding domains expected for this activity, and no target-specific catalytic
      loss or active-site divergence is documented. Lack of a direct AIM33 enzyme assay is a
      knowledge gap, not evidence that the IBA is erroneous. The annotation is accepted as a
      phylogenetic prediction; donor preference, turnover, and physiological electron-transfer
      partner still require direct measurement.
    supported_by:
    - reference_id: file:yeast/AIM33/AIM33-hypotheses/function-hypothesis-go-0004128/openscientist.md
      supporting_text: >-
        Retaining GO:0004128 as an **IBA** MF term is methodologically acceptable, but it
        should be treated as *inferred/unconfirmed*
- term:
    id: GO:0006696
    label: ergosterol biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      PAINT assignment to ergosterol biosynthesis through the reductase-family lineage.
    action: ACCEPT
    reason: >-
      PAINT places this process term at PTN000452208 with MCR1 as supporting evidence and
      retains it on the AIM33 lineage. No target-specific loss is recorded. The respiratory
      and mitochondrial-genome phenotypes do not contradict an ergosterol-related redox role,
      because membrane sterol composition can affect respiratory competence indirectly.
      Accept the phylogenetic process prediction while keeping direct AIM33 pathway evidence
      as an explicit gap.
- term:
    id: GO:0004128
    label: cytochrome-b5 reductase activity, acting on NAD(P)H
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      ARBA electronic annotation independently supports the PAINT reductase assignment.
    action: ACCEPT
    reason: >-
      ARBA00027922 recognizes the same reductase-family features that support the IBA call.
      This electronic annotation is not independent biochemical proof, but it is consistent
      with the PAINT placement and AIM33 domain architecture. Retain it while distinguishing
      prediction from direct enzyme evidence.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Electronic membrane localization from the UniProt SubCell mapping; well supported by
      predicted transmembrane helices and the global membrane-proteome dataset.
    action: ACCEPT
    reason: >-
      AIM33 has multiple predicted transmembrane helices (UniProt TRANSMEM 15-35, 42-62,
      180-200), and UniProt classifies it as a multi-pass membrane protein. "Membrane" is a
      well-supported, appropriately general cellular-component term and is compatible with
      the more specific PAINT plasma-membrane prediction.
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO electronic annotation of general oxidoreductase activity — the
      best-supported, appropriately general molecular-function call for AIM33.
    action: ACCEPT
    reason: >-
      AIM33 carries the FAD-binding FR-type domain and the NAD_binding_1 domain characteristic
      of flavin/pyridine-nucleotide oxidoreductases, and is predicted to bind FAD. Oxidoreductase
      activity (GO:0016491) is strongly supported by the domain architecture while remaining
      agnostic about the specific electron acceptor, which is unknown. This is the honest core
      molecular-function term for this protein.
