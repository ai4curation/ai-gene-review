id: Q04516
gene_symbol: AIM33
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  AIM33 (YML087C) is a 312-aa, multi-pass membrane flavoprotein in the flavoprotein
  pyridine-nucleotide cytochrome reductase family. Its FAD-binding FR-type and
  NAD(P)H-binding domains, together with phylogenetic annotation, support a predicted
  cytochrome-b5 reductase activity at the plasma membrane and a role in ergosterol
  biosynthesis. These assignments have not been tested by an AIM33-specific enzyme assay,
  localization experiment, or pathway perturbation. AIM33 expression rises in respiratory
  medium and is regulated by Pbp1, while deletion reduces spontaneous mitochondrial-genome
  loss and impairs growth on non-fermentable carbon. Thus AIM33 links a predicted
  plasma-membrane redox function to respiratory competence and mitochondrial-genome
  inheritance by a mechanism that remains unknown.
references:
- id: file:yeast/AIM33/AIM33-hypotheses/function-hypothesis-go-0004128/openscientist.md
  title: OpenScientist review of the AIM33 cytochrome-b5 reductase hypothesis
  findings:
  - statement: >-
      A blinded hypothesis test found the PAINT molecular-function transfer defensible and
      not a paralog over-annotation, while emphasizing that AIM33 has not been assayed directly.
    supporting_text: >-
      Retaining GO:0004128 as an **IBA** MF term is methodologically acceptable, but it
      should be treated as *inferred/unconfirmed*
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      The report independently supports retaining GO:0004128 and identifies intact reductase
      domains and motifs. Its recommendations to remove plasma membrane and weaken ergosterol
      biosynthesis omit the withheld local PAINT mitochondrial-loss event, and it repeats the
      stale UniProt increase-in-petite direction. Those CC/BP and phenotype conclusions are
      not used.
