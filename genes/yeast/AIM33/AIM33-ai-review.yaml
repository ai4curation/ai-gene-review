- id: PMID:19300474
  title: "Computationally driven, quantitative experiments discover genes required for mitochondrial biogenesis."
  findings:
  - statement: >-
      Genome-wide petite-frequency screen that assigned mitochondrial-biogenesis /
      transmission phenotypes to >100 genes (the "AIM" class); the source of the curated
      AIM33 disruption phenotype (altered frequency of mitochondrial genome loss).
    supporting_text: >-
      Using computational predictions combined with traditional quantitative experiments,
      we have identified 100 proteins whose deficiency alters mitochondrial biogenesis and
      inheritance in Saccharomyces cerevisiae.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMC-verified full text. AIM33/YML087C is one of the deletion strains assayed; the
      gene-specific petite-frequency value is reported in the supplementary tables (S2/S6),
      not the main text, so no AIM33-specific verbatim quote is available from the cached
      copy. This is the reference behind UniProt's DISRUPTION PHENOTYPE. Note a
      curated-source discrepancy on direction: UniProt states deletion "increases" while
      SGD states "reduced" frequency of mitochondrial genome loss (see knowledge_gaps).
- id: PMID:16847258
  title: "A global topology map of the Saccharomyces cerevisiae membrane proteome."
  findings:
  - statement: >-
      Experimentally constrained membrane-topology dataset covering AIM33/YML087C, supporting
      its assignment as an integral (multi-pass) membrane protein.
    supporting_text: >-
      we report the cloning and expression of 617 S. cerevisiae membrane proteins as fusions
      to a C-terminal topology reporter and present experimentally constrained topology models
      for 546 proteins.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMC-verified. Genome-scale topology study; AIM33 is one of the 546 modeled proteins
      (the paper text does not discuss AIM33 individually). Supports the "Membrane; multi-pass"
      call in UniProt but does not localize AIM33 to a specific membrane.
- id: PMID:33984024
  title: Pbp1, the yeast ortholog of human Ataxin-2, functions in the cell growth on
    non-fermentable carbon sources.
  findings:
  - statement: >-
      AIM33 is strongly induced in glycerol/lactate respiratory medium, and its transcript
      abundance is reduced in a pbp1 deletion strain under that condition.
    supporting_text: >-
      Interestingly, among down-regulated 24 genes in the pbp1Δ mutant cultured in YPGL
      medium, 4 genes involved in the gluconeogenesis pathway (PCK1, FBP1, ICL1, and MLS1)
      and 9 genes related to mitochondrial function (COX10, MRPL4, MRPS35, MSY1, DIA4,
      AIM33, IBA57, GCV2, and SLM5), which were highlighted in underline (Table 1).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text verified. The microarray table reports AIM33 signals of 94 in YPD and
      1658 in YPGL in wild type, versus 773 in pbp1Δ YPGL (0.47 of wild type). This is
      direct AIM33 expression evidence but not a catalytic or localization assay.
- id: PMID:40568959
  title: An Investigation of TDA1 Deficiency in Saccharomyces cerevisiae During Diauxic
    Growth.
  findings:
  - statement: >-
      AIM33 was reproducibly upregulated in tda1 deletion cells during post-diauxic growth,
      and the paper restates the reduced-petite and non-fermentable-growth phenotypes.
    supporting_text: >-
      Interestingly, three genes that are thought to be related to mitochondrial function,
      but not very well understood, were all upregulated in all three experiments, namely
      AIM33, IAI11, and PUS2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text verified. The consistent AIM33 effect was modest (mean log2 fold change
      0.42 ± 0.10). The discussion also calls AIM33 mitochondrial without citing an
      AIM33-specific localization experiment; that unsupported statement is not used here.
