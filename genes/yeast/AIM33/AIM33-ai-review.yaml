core_functions:
- description: >-
    Predicted plasma-membrane cytochrome-b5 reductase acting on NAD(P)H, with a
    phylogenetically inferred role in ergosterol biosynthesis. This synthesis is supported
    by PAINT node placement and the conserved FAD/NAD(P)H reductase domains; no
    AIM33-specific catalytic, localization, or pathway assay has yet confirmed it.
  molecular_function:
    id: GO:0004128
    label: cytochrome-b5 reductase activity, acting on NAD(P)H
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0006696
    label: ergosterol biosynthetic process
  knowledge_gaps:
  - gap_statement: >-
      AIM33's PAINT-predicted cytochrome-b5 reductase activity has not been tested directly,
      and its physiological electron-transfer partner and donor preference are unknown.
    boundary: >-
      PAINT places GO:0004128 on the AIM33 lineage, and AIM33 carries the diagnostic
      FAD-binding FR-type and NAD(P)H-binding reductase domains. This supports retention of
      the annotation but does not supply kinetic or partner-specific measurements.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      Identifying the electron-transfer partner would connect the phylogenetic annotation to
      a biochemical mechanism and test whether the PAINT-predicted ergosterol role is direct.
    resolution: >-
      Purify recombinant AIM33 (or the soluble reductase domain) and assay NAD(P)H-dependent
      reduction of candidate acceptors (cytochrome b5, coenzyme Q6, ferricyanide,
      cytochrome c, methemoglobin); determine donor specificity (NADH vs NADPH) and confirm
      FAD content.
  - gap_statement: >-
      The PAINT plasma-membrane placement has not been tested by AIM33-specific endogenous
      localization or topology experiments.
    boundary: >-
      AIM33 is predicted to be a multi-pass membrane protein. PAINT places it at the plasma
      membrane and records loss of the ancestral mitochondrion location at the AIM33/PGA3
      subfamily node. Its mitochondrial-genome phenotype does not establish its location.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      Direct localization would test the lineage-specific PAINT call and constrain the
      physiological redox partner.
    resolution: >-
      Determine endogenous localization with a functional tagged AIM33 allele and orthogonal
      membrane fractionation, explicitly comparing plasma membrane, ER, and mitochondria.
  - gap_statement: >-
      The mechanism by which AIM33 loss reduces spontaneous mitochondrial-genome loss while
      impairing respiratory growth is unknown.
    boundary: >-
      Hess et al. identified the mitochondrial-inheritance phenotype; later primary literature
      states that AIM33 deletion reduces spontaneous mitochondrial-genome loss and blocks growth
      on non-fermentable carbon. UniProt retains the opposite direction, apparently as a stale
      curation discrepancy.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      Connecting a predicted plasma-membrane reductase to mitochondrial-genome inheritance
      would explain why loss of AIM33 makes petite formation less frequent yet compromises
      respiratory growth.
    resolution: >-
      Re-measure petite frequency of a clean aim33-delta strain with wild-type controls; test
      mtDNA copy number/integrity, membrane potential, and respiratory-complex assembly; look
      for genetic interactions with mitochondrial genome-maintenance genes.
    provenance:
    - reference_id: PMID:19300474
      supporting_text: >-
        Using computational predictions combined with traditional quantitative experiments,
        we have identified 100 proteins whose deficiency alters mitochondrial biogenesis and
        inheritance in Saccharomyces cerevisiae.
suggested_questions:
- question: >-
    Which cytochrome-b5 species or other physiological partner accepts electrons from AIM33,
    and does AIM33 prefer NADH or NADPH?
- question: >-
    Does endogenous AIM33 localize to the plasma membrane as PAINT predicts, and what is its
    membrane topology?
- question: >-
    How does loss of a predicted plasma-membrane reductase reduce petite formation while
    impairing growth on non-fermentable carbon?
suggested_experiments:
- hypothesis: >-
    AIM33 has the PAINT-predicted NAD(P)H-dependent cytochrome-b5 reductase activity.
  description: >-
    Express and purify recombinant AIM33 (full-length in detergent/nanodiscs and the isolated
    soluble reductase domain), confirm bound FAD spectroscopically, and measure steady-state
    NADH- and NADPH-dependent reduction of candidate acceptors (cytochrome b5, coenzyme Q6/CoQ
    analogs, ferricyanide, cytochrome c, methemoglobin).
  experiment_type: enzyme kinetics / spectroscopy
- hypothesis: >-
    AIM33 localizes to the plasma membrane as predicted by the lineage-specific PAINT placement.
  description: >-
    Determine endogenous localization of a functional tagged AIM33 allele by live-cell
    colocalization with plasma-membrane, ER, and mitochondrial markers and by orthogonal
    membrane fractionation; verify that the tag preserves the respiratory and petite phenotypes.
  experiment_type: localization / cell biology
- hypothesis: >-
    Loss of AIM33 reduces petite formation through a redox or sterol-dependent mechanism.
  description: >-
    In a clean aim33-delta strain, quantify petite frequency against isogenic wild type,
    measure mtDNA copy number and integrity, mitochondrial membrane potential, and
    respiratory-complex assembly; measure sterol composition and test genetic interactions
    with PGA3, MCR1, CBR1, and ergosterol-pathway genes.
  experiment_type: yeast genetics / functional genomics
