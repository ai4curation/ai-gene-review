  text: Enables CDP-diacylglycerol-inositol 3-phosphatidyltransferase activity. Involved
    in phosphatidylinositol biosynthetic process. Located in Golgi membrane and mitochondrial
    outer membrane. Used to study cancer. Orthologous to human CDIPT (CDP-diacylglycerol--inositol
    3-phosphatidyltransferase).
