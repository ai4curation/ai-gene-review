id: P06197
gene_symbol: PIS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Pis1 (YPR113W) is the CDP-diacylglycerol--inositol 3-phosphatidyltransferase (phosphatidylinositol
  synthase, EC 2.7.8.11) of Saccharomyces cerevisiae, an essential polytopic membrane enzyme of the CDP-alcohol
  phosphatidyltransferase family. It transfers the phosphatidyl group of CDP-diacylglycerol to myo-inositol, releasing
  CMP, and is the sole route to phosphatidylinositol, the precursor of phosphoinositides, inositol sphingolipids
  and GPI anchors. Activity requires Mn2+ or Mg2+, is constitutively expressed, and in vivo is limited mainly by
  myo-inositol availability. Pis1 activity is found in the ER (microsomes), the Golgi and the cytosolic face of
  the mitochondrial outer membrane.
