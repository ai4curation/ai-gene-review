- term:
    id: GO:0000196
    label: cell integrity MAPK cascade
  evidence_type: IGI
  original_reference_id: PMID:10880465
  qualifier: involved_in
  supporting_entities:
  - SGD:S000006387
  review:
    summary: Cullen et al. (2000) found that glycosylation-defective mutants (e.g. dpm1) activate a Sho1-Ste20/Ste50-Ste11-Ste7-Kss1-Ste12
      pathway, and that loss of pheromone-pathway components is synthetically sick with these mutants,
      suggesting this pathway contributes to cell wall integrity.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0000196 cell integrity MAPK cascade is defined as the MAPK cascade containing the Slt2
      MAP kinase (Pkc1-Bck1-Mkk1/2-Slt2). The pathway implicated here is explicitly the Kss1 (filamentous
      growth) module, not the Slt2 cascade, so the genetic interaction with DPM1 supports a contribution
      of Ste11-dependent Kss1 signaling to cell wall maintenance rather than Ste11 acting as a tier of
      the Slt2 cascade. Reported Ste11-Mkk1 and Ste11-Slt2 links (Leng and Song 2016; Wang et al. 2011)
      are crosstalk. The biology is real but the term overstates Ste11's role; if kept it is non-core.
    supported_by:
    - reference_id: PMID:10880465
      supporting_text: We specifically suggest that a Sho1 --> Ste20/Ste50 --> Ste11 --> Ste7 --> Kss1
        --> Ste12 pathway is responsible for activation of FUS1 transcription in these mutants.
    - reference_id: PMID:10880465
      supporting_text: we suggest that the Sho1 --> Ste12 pathway contributes to maintenance of cell wall
        integrity in vegetative cells
    - reference_id: file:yeast/STE11/STE11-deep-research-falcon.md
      supporting_text: Reported Cmk2 and Ptk2 connections are putative/context-dependent, and Mpk1/Slt2
        activation is indirect
- term:
    id: GO:0001402
    label: signal transduction involved in filamentous growth
  evidence_type: IMP
  original_reference_id: PMID:8259520
  qualifier: involved_in
  review:
    summary: Liu et al. (1993) showed that the pheromone-pathway kinases, including Ste11, and Ste12 are
      required for diploid filamentous (pseudohyphal) growth, independently of the pheromone receptor
      and G protein.
    action: ACCEPT
    reason: Ste11 is the MAP3K of the Kss1 filamentous growth MAPK cascade (Ste20-Ste11-Ste7-Kss1), so
      it performs a signaling step in this pathway. This is one of Ste11's three core pathway roles. The
      newer term GO:0062031 filamentous growth MAPK cascade names Ste11 as its MAP3K in its definition
      and would be more precise (see suggested_questions), but GO:0001402 is the term SGD uses consistently
      for the other components (Ste7, Kss1, Ste20, Ste50), so it is accepted as is.
    supported_by:
    - reference_id: PMID:8259520
      supporting_text: in diploids some of the same kinases and STE12 are required for filamentous growth
    - reference_id: PMID:8001818
      supporting_text: the same components of the MAP kinase cascade necessary for diploid pseudohyphal
        development (STE20, STE11, STE7, and STE12) are also required for both filament formation and
        agar penetration in haploids
