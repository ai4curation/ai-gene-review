suggested_questions:
- question: Should SGD annotations of Ste11, Ste7, Kss1 and Ste20 to GO:0001402 (signal transduction involved
    in filamentous growth) be migrated to the more specific GO:0062031 (filamentous growth MAPK cascade),
    whose definition names this kinase cascade?
- question: Is Ste11 a direct kinase for Mkk1 (Ser407/Thr411) in the Nst1-mediated crosstalk to the cell
    integrity pathway, or is Slt2 activation downstream of Ste11 indirect? This decides whether any cell
    integrity MAPK cascade annotation for Ste11 is warranted.
- question: What is the source of the Ste11 self-interaction curated from PMID:8670882 (a mammalian Rac1/POR1
    paper), and does Ste11 homodimerize under physiological conditions?
suggested_experiments:
- description: In vitro kinase assays with purified full-length Ste11 (Ste20-phosphorylated or phosphomimetic)
    and purified Mkk1, Ste7 and Pbs2 to test whether Mkk1 is a direct substrate and to compare kinetics
    across the MAPKKs.
