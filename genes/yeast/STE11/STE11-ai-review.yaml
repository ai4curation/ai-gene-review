id: P23561
gene_symbol: STE11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Ste11 (YLR362W) is the MEKK-family MAP kinase kinase kinase (MAP3K) of Saccharomyces cerevisiae,
  a Ser/Thr protein kinase with an N-terminal SAM domain and autoinhibitory region and a C-terminal kinase
  domain. It is shared by three MAPK pathways. In the pheromone response it phosphorylates and activates
  the MAPKK Ste7, which activates Fus3 (and Kss1), with the kinases assembled on the Ste5 scaffold. In
  the filamentous/invasive growth pathway it acts through Ste7 to activate Kss1. In the Sho1 branch of
  the high-osmolarity glycerol (HOG) pathway it phosphorylates the MAPKK Pbs2, which activates Hog1. Ste11
  is activated when the PAK kinase Ste20 (or Cla4 in the HOG branch) phosphorylates its N-terminal regulatory
  region, relieving autoinhibition. It binds the adaptor Ste50 constitutively through a SAM-SAM interaction,
  and Ste50 links it to membrane-bound Cdc42 and Opy2. Pathway specificity comes from adaptors that pair
  Ste11 with its substrate: Ste5 with Ste7 for mating, and Sho1 with Pbs2 for osmosignaling. Ste11 is
  cytoplasmic and is transiently recruited to plasma-membrane signaling complexes.'
