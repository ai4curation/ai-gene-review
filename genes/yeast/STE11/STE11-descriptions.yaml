    overall_notes: 'Correct and complete: MEKK in pheromone, filamentous growth and
      HOG pathways, phosphorylating Ste7 and Pbs2, regulated by Ste20 and Ste50. Matches
      the review.'
- source: Alliance_Automated
  text: Enables MAP kinase kinase kinase activity; SAM domain binding activity; and
    identical protein binding activity. Involved in several processes, including intracellular
    signal transduction; invasive growth in response to glucose limitation; and pseudohyphal
    growth. Located in cytoplasm. Human ortholog(s) of this gene implicated in cerebral
    cavernous malformation. Orthologous to human MAP3K2 (mitogen-activated protein
    kinase kinase kinase 2) and MAP3K3 (mitogen-activated protein kinase kinase kinase
    3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/STE11
