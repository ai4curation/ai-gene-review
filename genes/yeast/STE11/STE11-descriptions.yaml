gene_symbol: STE11
organism: yeast
uniprot_id: P23561
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Serine/threonine protein kinase required for cell-type- specific transcription
    and signal transduction in yeast. It is thought that it phosphorylates the STE7
    protein kinase which itself, phosphorylates the FUS3 and or KSS1 kinases.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23561
  source_id: P23561
- source: Alliance_Imported
  text: Signal transducing MEK kinase; involved in pheromone response and pseudohyphal/invasive
    growth pathways where it phosphorylates Ste7p, and the high osmolarity response
    pathway, via phosphorylation of Pbs2p; regulated by Ste20p and Ste50p; protein
    abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/STE11
  source_id: SGD:S000004354
- source: Alliance_Automated
  text: Enables MAP kinase kinase kinase activity; SAM domain binding activity; and
    identical protein binding activity. Involved in several processes, including intracellular
    signal transduction; invasive growth in response to glucose limitation; and pseudohyphal
    growth. Located in cytoplasm. Human ortholog(s) of this gene implicated in cerebral
    cavernous malformation. Orthologous to human MAP3K2 (mitogen-activated protein
    kinase kinase kinase 2) and MAP3K3 (mitogen-activated protein kinase kinase kinase
    3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/STE11
  source_id: SGD:S000004354
