descriptions:
- source: UniProt
  text: Activator protein that regulates the ubiquitin ligase activity and substrate
    specificity of the anaphase promoting complex/cyclosome (APC/C). At the metaphase-to-anaphase
    transition, recognizes and binds proteins containing a D-box including the B-type
    cyclins CLB2 and CLB5, HSL1 and securin PDS1, and recruits them in a C- box-dependent
    manner to the APC/C for ubiquitination and subsequent proteolysis. Required for
    sister chromatid separation and disassembly of the mitotic spindle. Target of
    the spindle checkpoint pathway through participation in the mitotic checkpoint
    complex (MCC) and the MAD2-CDC20 subcomplex. MCC and presumably the MAD2-CDC20
    subcomplex inhibit the ubiquitin ligase activity of the anaphase promoting complex/cyclosome
    (APC/C) by preventing its activation by CDC20 until proper attachment of all chromosomes
    to the spindle.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P26309
  source_id: P26309
- source: Alliance_Imported
  text: Activator of anaphase-promoting complex/cyclosome (APC/C); APC/C is required
    for metaphase/anaphase transition; directs ubiquitination of mitotic cyclins,
    Pds1p, and other anaphase inhibitors; cell-cycle regulated; potential Cdc28p substrate;
    relative distribution to the nucleus increases upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDC20
  source_id: SGD:S000003084
- source: Alliance_Automated
  text: Enables anaphase-promoting complex binding activity and ubiquitin ligase activator
    activity. Involved in several processes, including anaphase-promoting complex-dependent
    catabolic process; positive regulation of protein metabolic process; and regulation
    of nuclear division. Located in nuclear periphery. Part of anaphase-promoting
    complex and mitotic checkpoint complex, CDC20-MAD2 subcomplex. Used to study melanoma.
    Orthologous to human CDC20 (cell division cycle 20).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDC20
  source_id: SGD:S000003084
