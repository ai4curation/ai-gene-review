  - reference_id: PMID:15060174
    supporting_text: >-
      Cdc20 and Cdh1 can also bind to substrates, suggesting that they activate ubiquitination by recruiting substrates
      to the catalytic center located in the complex
  - reference_id: PMID:17889668
    supporting_text: >-
      The Cdc20p protein family functions as adaptors linking the substrate to the catalytically active APC/C ubiquitin
      ligase
  - *id028
- description: >-
    Inhibited effector of the spindle assembly checkpoint: while kinetochores are unattached, Cdc20 is captured
    by Mad2, Mad3 and Bub3 into the mitotic checkpoint complex and the more abundant Mad2-Cdc20 subcomplex, both
    assembled in mitosis independently of the kinetochore, which sequester Cdc20 and hold APC/C-Cdc20 inactive until
    all chromosomes are bioriented.
  molecular_function:
