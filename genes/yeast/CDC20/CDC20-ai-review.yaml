gene_symbol: CDC20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Cdc20 is the essential mitotic coactivator of the anaphase-promoting complex/cyclosome (APC/C), the multisubunit
  cullin-RING E3 ubiquitin ligase that drives the metaphase-to-anaphase transition and the onset of mitotic exit
  in Saccharomyces cerevisiae. Cdc20 has no catalytic activity: its N-terminal C-box (and, dispensably, its C-terminal
  IR tail) dock it onto the tetratricopeptide-repeat subunits Cdc23 and Cdc27 of the mitotically phosphorylated
  APC/C, and its C-terminal seven-bladed WD40 beta-propeller recognises destruction-box and KEN-box degrons on substrates,
  so that Cdc20 both switches on the ligase and selects what it ubiquitinates. The essential targets of APC/C-Cdc20
  are the securin Pds1, whose destruction releases the separase Esp1 to cleave cohesin and separate sister chromatids,
  and the S-phase cyclin Clb5 (with an early phase of Clb2 degradation), whose loss allows release of the Cdc14
  phosphatase and hands over to APC/C-Cdh1 and Sic1 for completion of mitotic exit; cells lacking both Pds1 and
  Clb5 can proliferate without Cdc20. Cdc20 is the direct target of the spindle assembly checkpoint: while any kinetochore
  is unattached, Mad2, Mad3 and Bub3 capture Cdc20 into the mitotic checkpoint complex (Mad2-Mad3-Bub3-Cdc20) and
  a more abundant Mad2-Cdc20 subcomplex, both assembled in mitosis independently of the kinetochore, which block
  substrate recognition and keep the APC/C inactive until all chromosomes are bioriented; checkpoint-resistant cdc20
  alleles no longer bind the Mad proteins. CDC20 is transcribed in late S/M phase, the protein is nuclear (bipartite
  NLS) and is itself an APC/C substrate degraded by APC/C-Cdh1 in G1 via its own D-box and KEN box. In meiosis,
  Cdc20 accumulates in nuclei and directs securin destruction at the onset of both meiotic divisions, and APC/C-Cdc20
  also destroys the Ume6 repressor early in meiosis to permit early meiotic gene expression; under proteasome inhibition
  or genotoxic stress Cdc20 relocalises with other APC/C subunits to perinuclear quality-control foci.
