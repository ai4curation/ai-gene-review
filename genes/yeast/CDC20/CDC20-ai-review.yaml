- id: file:yeast/CDC20/CDC20-deep-research-falcon.md
  title: Deep research report for yeast CDC20 (falcon / Edison Scientific Literature)
  findings:
  - statement: >-
      Cdc20 is a non-enzymatic, limiting APC/C coactivator and substrate receptor; the APC/C catalytic module and
      E2s, not Cdc20, perform ubiquitin transfer.
    supporting_text: Cdc20 is a transient regulatory subunit rather than a stable stoichiometric core component
  - statement: >-
      Pds1/securin and Clb5 are the best-established physiological targets whose Cdc20-dependent destruction drives
      anaphase and mitotic exit.
    supporting_text: >-
      Cdc20-dependent destruction of **both Pds1 and Clb5** accounts for its core role in anaphase and mitotic exit
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      LLM-generated synthesis (falcon); used only for framing, every claim re-checked against cached primary papers.
      Contains no same-symbol confusion.
core_functions:
- description: >-
    Ubiquitin ligase activator of the anaphase-promoting complex/cyclosome: Cdc20 docks on the TPR subunits Cdc23/Cdc27
    of the mitotic APC/C through its C-box, converting it into the active APC/C-Cdc20 ligase that ubiquitinates
    securin Pds1 and cyclin Clb5 to trigger sister-chromatid separation and initiate mitotic exit, and that directs
    securin destruction at anaphase onset of both meiotic divisions.
  molecular_function:
    id: GO:1990757
    label: ubiquitin ligase activator activity
  directly_involved_in:
  - id: GO:0031145
    label: anaphase-promoting complex-dependent catabolic process
  - id: GO:0045842
    label: positive regulation of mitotic metaphase/anaphase transition
  - id: GO:0040020
    label: regulation of meiotic nuclear division
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0005680
    label: anaphase-promoting complex
  supported_by:
  - *id011
  - *id018
  - *id025
  - *id026
  - *id027
  - reference_id: file:yeast/CDC20/CDC20-deep-research-falcon.md
    supporting_text: >-
      addition of Cdc20 to APC/C stimulates cyclin ubiquitin-ligase activity in vitro, and Cdc20 overproduction
      can induce APC/C-dependent proteolysis in yeast
- description: >-
    Substrate adaptor of the APC/C: the Cdc20 WD40 beta-propeller binds D-box/KEN-box degrons on substrates (Pds1,
    Clb5, Clb2, Hsl1, and the meiotic repressor Ume6) and bridges them to the Apc2/Apc11 catalytic module for polyubiquitination
    and proteasomal degradation, in a cooperative trimolecular activator-substrate-core complex.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  directly_involved_in:
  - id: GO:0031145
    label: anaphase-promoting complex-dependent catabolic process
