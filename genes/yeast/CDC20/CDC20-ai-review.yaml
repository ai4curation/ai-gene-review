suggested_questions:
- question: >-
    Should budding-yeast Cdc20 carry GO:1990756 (ubiquitin-like ligase-substrate adaptor activity) alongside GO:1990757,
    as human CDC20 does via IDA and GO-CAM, given that the WD40 degron-receptor function is established for the
    yeast protein (Burton & Solomon 2001; Thornton et al. 2006)?
- question: >-
    Is GO:0051321 (meiotic cell cycle) the best representation of APC/C-Cdc20-mediated Ume6 destruction, or should
    the Mallory et al. 2007 evidence be re-expressed as APC/C-dependent catabolic process in a meiotic context together
    with a more specific meiotic process term?
- question: >-
    Are the many GO:0005515 rows for Mad2/Mad3/Bub3 better retired now that GO:0033597 and GO:1990333 exist for
    the same papers, and is there any informative term for the Bub1-Cdc20 rows given Bub1 is not an MCC subunit
    in budding yeast?
suggested_experiments:
- hypothesis: >-
    The Cdc20 C-box activates the APC/C independently of substrate recruitment, whereas the WD40 propeller is required
    only for degron-dependent substrate binding.
  description: >-
    Compare purified yeast APC/C activity toward Pds1 and Clb5 with full-length Cdc20, a C-box-only N-terminal fragment,
    and WD40 degron-surface mutants in reconstituted ubiquitination assays, and test the same alleles for cdc20-delta
    complementation and Pds1 degradation kinetics in vivo.
  experiment_type: reconstituted ubiquitination assay and allele complementation
- hypothesis: >-
    Cdc20 relocalisation to perinuclear INQ foci under proteasome inhibition sequesters APC/C-Cdc20 and delays the
    metaphase/anaphase transition.
  description: >-
    Live-image Cdc20-GFP, Pds1-myc levels and sister-chromatid separation in MG132- or MMS-treated cells with and
    without cmr1-delta, to determine whether INQ residency correlates with retention of Pds1 and delayed anaphase.
  experiment_type: live-cell imaging and substrate degradation timecourse
