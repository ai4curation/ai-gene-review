id: P38182
gene_symbol: ATG8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Atg8 is a ubiquitin-like autophagy protein that is proteolytically processed
  at its C terminus and conjugated to phosphatidylethanolamine on phagophore, autophagosome,
  and Cvt vesicle membranes. Membrane-bound Atg8 tethers and hemifuses membranes during phagophore
  expansion and autophagosome maturation, and it presents an Atg8-family docking surface for
  selective-autophagy receptors and other Atg proteins. In Saccharomyces cerevisiae it supports
  starvation-induced macroautophagy and selective routes including the Cvt pathway, mitophagy,
  ER-phagy, nucleophagy, and vacuolar membrane remodeling.'
