    overall_notes: Correct on the diphthine methylesterase step and retromer recycling
      of Can1 and Mup1. Ends on an rDNA transcription screen hit with no stated role.
- source: Alliance_Imported
  text: Methylesterase performing penultimate step of diphthamide biosynthesis; hydrolyzes
    methylated diphthine to produce diphthine and allows Dph6-catalyzed amidation
    reaction to occur; deletion leads to resistance to sordarin and accumulation of
    methylatediphthine; WD40 domain-containing protein; involved in endosomal recycling;
    forms complex with Rtt10p that functions in retromer-mediated pathway for recycling
    internalized cell-surface proteins
  source_type: curated
