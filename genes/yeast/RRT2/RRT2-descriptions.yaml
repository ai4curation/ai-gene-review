gene_symbol: RRT2
organism: yeast
uniprot_id: P38332
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the demethylation of diphthine methyl ester to form diphthine, an
    intermediate in diphthamide biosynthesis, a post- translational modification of
    histidine which occurs in translation elongation factor 2 (EFT1 and EFT2). Also
    plays a role in the regulation of the retromer complex and is required for the
    recycling from endosomes of plasma membrane proteins like CAN1 and MUP1. Identified
    in a screen for mutants with decreased levels of rDNA transcription.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38332
  source_id: P38332
- source: Alliance_Imported
  text: Methylesterase performing penultimate step of diphthamide biosynthesis; hydrolyzes
    methylated diphthine to produce diphthine and allows Dph6-catalyzed amidation
    reaction to occur; deletion leads to resistance to sordarin and accumulation of
    methylatediphthine; WD40 domain-containing protein; involved in endosomal recycling;
    forms complex with Rtt10p that functions in retromer-mediated pathway for recycling
    internalized cell-surface proteins
  source_type: curated
  url: https://www.yeastgenome.org/locus/RRT2
  source_id: SGD:S000000450
- source: Alliance_Automated
  text: Enables diphthine methylesterase activity and protein methylesterase activity.
    Involved in endocytic recycling and protein histidyl modification to diphthamide.
    Located in endosome. Orthologous to human DPH7 (diphthamide biosynthesis 7).
  source_type: automated
  url: https://www.yeastgenome.org/locus/RRT2
  source_id: SGD:S000000450
