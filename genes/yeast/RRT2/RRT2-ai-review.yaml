suggested_questions:
- question: Is the Ere1 endosomal recycling role mechanistically linked to the methylesterase activity
    (e.g. a methyl-esterified cargo or regulator), or is it an independent moonlighting function of the
    WD40 scaffold?
- question: Should GO:0061685 diphthine methylesterase activity be classified under GO:0051723 protein
    methylesterase activity, since its substrate is a protein residue?
suggested_experiments:
- hypothesis: The Rrt2 esterase active site is dispensable for Can1 recycling
  description: Identify catalytic residues (conserved Ser/His/Asp candidates) by mutagenesis and in vitro
    esterase assays on dph7 eEF2, then test the catalytically dead alleles for Can1-GFP recycling in vps23
    background.
  experiment_type: mutagenesis / separation-of-function
