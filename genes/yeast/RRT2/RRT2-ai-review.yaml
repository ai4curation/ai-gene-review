- term:
    id: GO:0017178
    label: diphthine-ammonia ligase activity
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: enables
  supporting_entities:
  - SGD_PWY:PWY-6482-1
  review:
    summary: YeastPathways (PWY-6482-1) assigns RRT2/YBR246W to DIPHTINE--AMMONIA-LIGASE-RXN, citing Su
      et al. 2012, and the GO-CAM conversion turns that into diphthine-ammonia ligase activity.
    action: REMOVE
    reason: Incorrect enzyme assignment. Su et al. 2012 only showed that ybr246w cells accumulate diphthine.
      Rrt2/Dph7 lacks the ATP-binding (adenine nucleotide alpha hydrolase) domain needed for the ATP-dependent
      amidation; the amidating ligase is Dph6/YLR143W, and Dph7 is the diphthine methylesterase acting
      one step earlier.
    supported_by:
    - reference_id: PMID:24739148
      supporting_text: |-
        However, Dph7 is not the diphthamide synthetase, as
        it lacks the ATP-binding domain required.
    - reference_id: PMID:23169644
      supporting_text: we thought it was a scaffold or adaptor protein instead of the actual enzyme that
        catalyzes the amidation reaction because it lacks an ATP-dependent catalytic domain
    - reference_id: PMID:24739148
      supporting_text: |-
        Dph7 is a methylesterase that hydrolyzes
        methylated diphthine to produce diphthine
