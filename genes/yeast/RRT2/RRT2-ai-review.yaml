  label: Saccharomyces cerevisiae S288C
description: 'RRT2 (also DPH7, ERE1; YBR246W) encodes a WD40-repeat beta-propeller protein, ortholog of
  human DPH7/WDR85, that catalyses the third step of eukaryotic diphthamide biosynthesis on translation
  elongation factor 2 (eEF2): hydrolysis of the diphthine methyl ester made by Dph5 to diphthine and methanol
  (EC 3.1.1.97), which allows Dph6 to amidate diphthine to diphthamide. rrt2/dph7 null cells accumulate
  (methylated) diphthine on eEF2, show enhanced Dph5-eEF2 association, increased -1 frameshifting and
  resistance to sordarin. It is the first WD40 protein shown to have enzymatic activity; the catalytic
  residues are not established. Rrt2 is mainly cytoplasmic; independently, as Ere1 it is transiently recruited
  to endosomes with Ere2 and is required for retromer-dependent recycling of the arginine permease Can1
  to the plasma membrane. It lacks an ATP-binding domain and is not the diphthamide synthetase.'
