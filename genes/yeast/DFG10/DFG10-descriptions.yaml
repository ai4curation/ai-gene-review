gene_symbol: DFG10
organism: yeast
uniprot_id: P40526
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Plays a key role in early steps of protein N-linked glycosylation by being
    involved in the conversion of polyprenol into dolichol (PubMed:20637498, PubMed:38821050).
    Acts as a polyprenal reductase that mediates the reduction of polyprenal into
    dolichal in a NADP-dependent mechanism (PubMed:38821050). Dolichols are required
    for the synthesis of dolichol-linked monosaccharides and the oligosaccharide precursor
    used for N-glycosylation (PubMed:20637498, PubMed:38821050).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40526
  source_id: P40526
- source: Alliance_Imported
  text: Probable polyprenol reductase; catalyzes conversion of polyprenol to dolichol,
    the precursor for N-glycosylation; involved in filamentous growth; mutations in
    human homolog SRD5A3 confer CDG (Congenital Disorders of Glycosylation); human
    SRD5A3 can complement yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/DFG10
  source_id: SGD:S000001311
- source: Alliance_Automated
  text: Enables polyprenal reductase activity. Involved in dolichol-linked oligosaccharide
    biosynthetic process; dolichyl monophosphate biosynthetic process; and pseudohyphal
    growth. Located in endoplasmic reticulum. Used to study congenital disorder of
    glycosylation type I. Human ortholog(s) of this gene implicated in Kahrizi syndrome
    and congenital disorder of glycosylation Iq. Orthologous to human SRD5A3 (steroid
    5 alpha-reductase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DFG10
  source_id: SGD:S000001311
