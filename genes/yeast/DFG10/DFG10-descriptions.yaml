    overall_notes: 'Current (PMID:38821050): NADP-dependent polyprenal reductase converting
      polyprenal to dolichal for N-glycosylation. Does not name Tda5 or the ER location.'
- source: Alliance_Imported
  text: Probable polyprenol reductase; catalyzes conversion of polyprenol to dolichol,
    the precursor for N-glycosylation; involved in filamentous growth; mutations in
    human homolog SRD5A3 confer CDG (Congenital Disorders of Glycosylation); human
    SRD5A3 can complement yeast null mutant
  source_type: curated
