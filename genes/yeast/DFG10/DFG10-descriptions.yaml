- source: Alliance_Automated
  text: Enables polyprenal reductase activity. Involved in dolichol-linked oligosaccharide
    biosynthetic process; dolichyl monophosphate biosynthetic process; and pseudohyphal
    growth. Located in endoplasmic reticulum. Used to study congenital disorder of
    glycosylation type I. Human ortholog(s) of this gene implicated in Kahrizi syndrome
    and congenital disorder of glycosylation Iq. Orthologous to human SRD5A3 (steroid
    5 alpha-reductase 3).
  source_type: automated
