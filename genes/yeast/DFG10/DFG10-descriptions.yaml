findings:
- category: discrepancy
  text: SGD describes a polyprenol reductase. The review and UniProt cite PMID:38821050
    showing Dfg10 reduces polyprenal to dolichal and has no activity on polyprenol.
  sources:
  - Alliance_Imported
  - UniProt
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: UniProt, the automated text and the review use the current polyprenal
    reductase assignment. SGD keeps the older polyprenol reductase description.
