  label: Saccharomyces cerevisiae S288C
description: 'DFG10 (YIL049W) encodes polyprenal reductase (EC 1.3.1.94), a multi-pass endoplasmic-reticulum membrane
  enzyme of the steroid 5-alpha-reductase family (SRD5A3 subfamily) and the ortholog of human SRD5A3. It catalyses
  the NADPH-dependent saturation of the alpha-isoprene unit of polyprenal to give dolichal, the middle step of the
  three-step detour that converts polyprenol to dolichol: the SDR enzyme Tda5 (DHRSX) oxidises polyprenol to polyprenal
  beforehand and reduces dolichal to dolichol afterwards. Dfg10 expressed in mammalian cell membranes reduces polyprenal
  but has no detectable activity on polyprenol, correcting the earlier view that it was the polyprenol reductase.
  dfg10 cells have strongly reduced dolichol with large increases in polyprenol and polyprenal, accumulate squalene,
  underglycosylate carboxypeptidase Y and grow slowly; SRD5A3 complements them. Dolichol is then phosphorylated
  by Sec59 to dolichyl phosphate, the lipid carrier for N-glycosylation, O-mannosylation and GPI-anchor synthesis.
  DFG10 was first identified as required for diploid filamentous (pseudohyphal) growth, a downstream consequence
  of its glycosylation defect.'
