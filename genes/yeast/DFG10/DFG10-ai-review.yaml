suggested_questions:
- question: Why do tda5 dfg10 double mutants retain dolichol, and does Dfg10 also regulate isoprenoid flux upstream
    (squalene accumulation in dfg10)?
suggested_experiments:
- hypothesis: Dfg10 and Tda5 form a channelling complex for the polyprenal intermediate
  description: Co-immunoprecipitation / proximity labelling of tagged Dfg10 and Tda5 in ER membranes and measurement
    of polyprenal leakage in strains with forced separation.
  experiment_type: biochemistry / lipidomics
