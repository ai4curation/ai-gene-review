- source: Alliance_Automated
  text: Enables several functions, including ATP hydrolysis activity; adenyl ribonucleotide
    binding activity; and protein-transporting ATPase activity. Involved in several
    processes, including cellular heat acclimation; cytoplasmic stress granule disassembly;
    and protein folding in endoplasmic reticulum. Located in cytoplasm and nuclear
    periphery. Part of TRC complex. Human ortholog(s) of this gene implicated in 3-methylglutaconic
    aciduria type 7a; 3-methylglutaconic aciduria type 7b; and severe congenital neutropenia.
    Orthologous to human CLPB (ClpB family mitochondrial disaggregase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HSP104
  source_id: SGD:S000003949
