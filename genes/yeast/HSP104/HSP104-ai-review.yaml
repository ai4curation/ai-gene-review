    label: protein refolding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: HSP104 participates in protein refolding, though it does so indirectly
      -- it solubilizes aggregated proteins and hands them off to Hsp70/Hsp40 for
      actual refolding (PMID:9674429). The IBA annotation is reasonable as HSP104
      is required for the overall refolding process.
    action: ACCEPT
    reason: While HSP104 itself does not refold proteins (that is done by Hsp70/40),
      it is an essential component of the refolding pathway by extracting substrates
      from aggregates. PMID:9674429 demonstrates that "in concert with Hsp40 and Hsp70,
      Hsp104 can reactivate proteins that have been denatured and allowed to aggregate."
      The annotation to the BP "protein refolding" is appropriate.
