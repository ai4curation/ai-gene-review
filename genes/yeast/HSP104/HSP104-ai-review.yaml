- id: PMID:31027887
  title: Hsp104 and Potentiated Variants Can Operate as Distinct Nonprocessive Translocases.
  findings:
  - statement: Wild-type HSP104 performs ATP-dependent partial translocation of soluble
      polypeptide substrates through its axial pore, supporting HSP104's ATP-dependent
      disaggregase mechanism but not transmembrane protein transport.
    supporting_text: We establish that Hsp104 and Hsp104 A503S can operate as nonprocessive
      translocases for soluble substrates
- id: PMID:41020413
  title: Hsp104-Hsp70-Hsp110 chaperones disintegrate kinase aggregates formed upon
    stress in Saccharomyces cerevisiae.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified 2025 abstract; corroborates HSP104/Hsp70/Sse1
      mobilization of heat- or Hsp90-inhibition-induced Ste11 aggregates.
  findings:
  - statement: A 2025 Ste11 model-substrate study further supports the involvement
      of HSP104 with Hsp70 and Hsp110/Sse1 in mobilizing stress-induced yeast kinase
      aggregates.
    supporting_text: Ste11 aggregates disappear upon recovery from stress. This phenomenon
      is impaired in the absence of Hsp104 or Sse1
