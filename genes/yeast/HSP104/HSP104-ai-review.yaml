  locations:
  - id: GO:0005829
    label: cytosol
  description: The defining molecular function of HSP104. It threads aggregated polypeptides
    through its central hexameric pore in an ATP-driven process, solubilizing protein
    aggregates for subsequent refolding by Hsp70/Hsp40. HSP104 is essential for induced
    thermotolerance and mechanically unfolds aggregated polypeptides as part of disaggregation.
- molecular_function:
    id: GO:0051087
    label: protein-folding chaperone binding
  description: HSP104 physically and functionally cooperates with Hsp70/Hsp40 chaperones,
    which are required for substrate delivery and downstream refolding.
proposed_new_terms:
- proposed_name: prion fibril fragmentation activity
  proposed_definition: A molecular function that fragments a prion amyloid fibril
    into smaller oligomeric seeds that can be transmitted to daughter cells and thereby
    maintain cellular prion propagation.
  justification: HSP104-dependent fragmentation of prion fibrils is a directly established,
    mechanistically distinct yeast function required to create infectious seeds. Current
    GO lacks a term that represents prion fibril fragmentation; the existing ATP-dependent
    protein disaggregase term does not capture the propagation-producing outcome of
    partial fibril fragmentation.
  supported_by:
  - reference_id: PMID:18312264
    supporting_text: Prion propagation requires the Hsp104-dependent fragmentation
      of prion fibrils to create infectious seeds.
suggested_questions:
- question: Should the PTHR11638 fungal Hsp104 PAINT node gain an IBD to GO:0140545
    "ATP-dependent protein disaggregase activity" now that SGD directly annotates
    budding-yeast HSP104 to that term?
- question: Does HSP104's role in prion propagation warrant a specific annotation?
    There is no GO term for "prion fibril fragmentation" or similar.
- question: Is the TRC complex (GO:0072380) membership a true moonlighting function
    or a misidentification in the high-throughput study?
suggested_experiments:
- description: Reconstitute stress-specific kinase aggregate disassembly with purified
    HSP104/Ssa1/Sse1/Ydj1 to define whether Ste11 mobilization uses the same partial-threading
    cycle as canonical heat-aggregated substrates.
- description: Determine whether HSP104's role in ER protein folding (PMID:10931304)
    is truly indirect or if there is a direct mechanism, such as translocation through
    the ER membrane.
