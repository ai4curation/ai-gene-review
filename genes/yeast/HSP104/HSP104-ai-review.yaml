references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: 'PAINT/IBA methodology propagates experimental annotations within a
      phylogenetic tree. Source of all 7 current IBA annotations on HSP104: cytoplasm (GO:0005737),
      ATP hydrolysis activity (GO:0016887), protein refolding (GO:0042026), protein
      unfolding (GO:0043335), cytosol (GO:0005829), protein-folding chaperone binding (GO:0051087),
      and cellular heat acclimation
      (GO:0070370). All are consistent with the well-established HSP100/Clp disaggregase
      family function.'
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings:
  - statement: UniProt keyword-to-GO mapping methodology. Source of the IEA "nucleotide
      binding" (GO:0000166) annotation for HSP104, derived from a Swiss-Prot keyword
      and consistent with the AAA+ ATPase architecture of the protein.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: UniProt subcellular-location-to-GO mapping methodology. Source of the
      IEA "nucleus" (GO:0005634) and "cytoplasm" (GO:0005737) annotations for HSP104,
      both consistent with the experimentally established localization of the disaggregase
      (PMID:10467108).
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: 'ARBA machine-learning rule-mining methodology that propagates GO terms
      from UniProtKB feature evidence. Source of six IEA annotations on HSP104: cytosol
      (GO:0005829), protein folding (GO:0006457), cellular response to heat (GO:0034605),
      identical protein binding (GO:0042802), protein unfolding (GO:0043335), and
      intracellular organelle lumen (GO:0070013).'
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated annotation pipeline that aggregates multiple electronic
      GO assignment methods. Source of the IEA "ATP binding" (GO:0005524) and "ATP
      hydrolysis activity" (GO:0016887) annotations on HSP104, which are redundant
      with experimental evidence for the ATP-dependent disaggregase activity.
- id: PMID:2188365
  title: HSP104 required for induced thermotolerance.
  findings:
  - statement: HSP104 deletion mutants cannot acquire thermotolerance after mild heat
      pretreatment, establishing HSP104 as essential for induced thermotolerance.
    supporting_text: when given a mild pre-heat treatment, the mutant cells did not
      acquire tolerance to heat, as did wild-type cells.
- id: PMID:7984243
  title: Protein disaggregation mediated by heat-shock protein Hsp104.
  findings:
  - statement: HSP104 mediates resolubilization of heat-inactivated protein from insoluble
      aggregates, establishing the disaggregation function.
    supporting_text: 'Hsp104 functions in a manner not previously described for other
      heat-shock proteins: it mediates the resolubilization of heat-inactivated luciferase
      from insoluble aggregates.'
- id: PMID:9674429
  title: 'Hsp104, Hsp70, and Hsp40: a novel chaperone system that rescues previously
    aggregated proteins.'
  findings:
  - statement: HSP104 in concert with Hsp70 and Hsp40 can reactivate aggregated proteins
      via a protein remodeling activity requiring specific chaperone interactions.
    supporting_text: in concert with Hsp40 and Hsp70, Hsp104 can reactivate proteins
      that have been denatured and allowed to aggregate, substrates refractory to
      the action of other chaperones.
- id: PMID:9797333
  title: Evidence for the interplay between trehalose metabolism and Hsp104 in yeast.
  findings:
  - statement: HSP104 disruption affects trehalose metabolism during heat shock, likely
      through indirect effects on enzyme integrity.
    supporting_text: The activities of trehalose-synthesizing and -hydrolyzing enzymes
      are low in the HSP104 disruption mutant during heat shock.
- id: PMID:10467108
  title: Direct evidence for the intracellular localization of Hsp104 in Saccharomyces
    cerevisiae by immunoelectron microscopy.
  findings:
  - statement: ImmunoEM shows HSP104 in cytoplasm and nucleus, concentrating around
      protein aggregates during heat shock.
    supporting_text: At normal temperature (25 degrees C), a small amount of Hsp104
      was located in the cytoplasm and nucleus.
- id: PMID:10931304
  title: Trehalose is required for conformational repair of heat-denatured proteins
    in the yeast endoplasmic reticulum but not for maintenance of membrane traffic
    functions after severe heat stress.
  findings:
  - statement: Cytosolic HSP104 is required for conformational repair of heat-denatured
      proteins in the ER, suggesting indirect role in ER protein quality control.
    supporting_text: not only ER chaperones but also the cytosolic Hsp104 chaperone
      is required for conformational repair events in the ER lumen.
- id: PMID:11867765
  title: Analysis of the AAA sensor-2 motif in the C-terminal ATPase domain of Hsp104
    with a site-specific fluorescent probe of nucleotide binding.
  findings:
  - statement: Fluorescent probe (Y819W) directly measures ATP and ADP binding at
      NBD2; R826M sensor-2 mutation decreases nucleotide affinity and reveals interdomain
      communication.
    supporting_text: The fluorescence of this tryptophan changes in response to ATP
      and ADP binding, allowing the K(d) and Hill coefficient to be determined for
      each nucleotide.
- id: PMID:16135516
  title: Substrate binding to the molecular chaperone Hsp104 and its regulation by
    nucleotides.
  findings:
  - statement: ATP-dependent substrate binding demonstrated; ATP at NBD1 is crucial
      for polypeptide interaction, and substrate binding triggers conformational change
      committing to ATP hydrolysis.
    supporting_text: the affinity of Hsp104 toward polypeptides is regulated by nucleotides.
      In the presence of ATP or adenosine-5' -O-(3-thiotriphosphate), the chaperone
      formed complexes with RCMLa, whereas no binding was observed in the presence
      of ADP.
- id: PMID:16554755
  title: Global landscape of protein complexes in the yeast Saccharomyces cerevisiae.
  findings:
  - statement: High-throughput TAP-tag/MS study identifying HSP104 interactions with
      multiple yeast proteins.
    supporting_text: We used tandem affinity purification to process 4,562 different
      tagged proteins of the yeast Saccharomyces cerevisiae.
- id: PMID:19536198
  title: 'An atlas of chaperone-protein interactions in Saccharomyces cerevisiae:
    implications to protein folding pathways in the cell.'
  findings:
  - statement: Systematic TAP-tag analysis of all 63 yeast chaperones, mapping HSP104
      interaction network.
    supporting_text: Systematic analysis of physical TAP-tag based protein-protein
      interactions of all known 63 chaperones in Saccharomyces cerevisiae has been
      carried out.
- id: PMID:20404203
  title: CryoEM structure of Hsp104 and its mechanistic implication for protein disaggregation.
  findings:
  - statement: CryoEM structure confirms hexameric ring architecture with M-domain
      on the exterior, where it can interact with aggregated proteins.
    supporting_text: Hsp104 is a ring-forming AAA+ machine that recognizes both aggregated
      proteins and prion-fibrils as substrates and, together with the Hsp70 system,
      remodels substrates in an ATP-dependent manner.
- id: PMID:20850366
  title: A chaperone cascade sorts proteins for posttranslational membrane insertion
    into the endoplasmic reticulum.
  findings:
  - statement: HSP104 identified as part of the TRC complex for tail-anchored protein
      targeting to ER.
    supporting_text: we reveal the composition of a conserved multiprotein TMD recognition
      complex (TRC) and show that distinct TRC subunits recognize the two types of
      TMD signals.
- id: PMID:21474779
  title: Species-specific collaboration of heat shock proteins (Hsp) 70 and 100 in
    thermotolerance and protein disaggregation.
  findings:
  - statement: Middle domain of HSP104 determines species-specific interaction with
      Hsp70, required for disaggregation and thermotolerance.
    supporting_text: the interaction between Hsp70/DnaK and helix 2 of the middle
      domain of Hsp104/ClpB determines the specificity required for protein disaggregation
      both in vivo and in vitro, as well as for cellular thermotolerance.
- id: PMID:22842922
  title: Dissecting DNA damage response pathways by analysing protein localization
    and abundance changes during DNA replication stress.
  findings:
  - statement: High-throughput microscopy confirms HSP104 cytoplasmic localization.
    supporting_text: Relocalization of proteins is a hallmark of the DNA damage response.
      We use high-throughput microscopic screening of the yeast GFP fusion collection
- id: PMID:24291094
  title: Coordination of translational control and protein homeostasis during severe
    heat stress.
  findings:
  - statement: HSP104 and Hsp70 are required for stress granule disassembly and restoration
      of translation during heat stress recovery.
    supporting_text: heat-SG disassembly and restoration of translation activity during
      heat stress recovery is intimately linked to disaggregation of damaged proteins
      present in the mixed assemblies and requires Hsp104 and Hsp70 activity.
- id: PMID:25817432
  title: Cmr1/WDR76 defines a nuclear genotoxic stress body linking genome integrity
    and protein quality control.
  findings:
  - statement: HSP104 localizes at the intranuclear quality control compartment (INQ)
      at the nuclear periphery.
    supporting_text: Cmr1--together with Mrc1/Claspin, Pph3, the chaperonin containing
      TCP1 (CCT) and 25 other proteins--define a novel intranuclear quality control
      compartment (INQ) that sequesters misfolded, ubiquitylated and sumoylated proteins
      in response to genotoxic stress.
- id: PMID:18312264
  title: Substrate threading through the central pore of the Hsp104 chaperone as a
    common mechanism for protein disaggregation and prion propagation.
  findings:
  - statement: Substrate threading through HSP104's central pore is the mechanism
      for both protein disaggregation and prion propagation.
    supporting_text: HAP variants that harbour a reduced threading activity were affected
      in both protein disaggregation and prion propagation, demonstrating that substrate
      threading represents the common mechanism for the processing of both substrate
      classes.
- id: file:yeast/HSP104/HSP104-deep-research-falcon.md
  title: Falcon deep research report on HSP104 (Saccharomyces cerevisiae)
  findings:
  - statement: 'Hsp104 is a hexameric AAA+ ATP-dependent disaggregase of the Hsp100/ClpB

      family that does not perform proteolysis but instead remodels aggregated

      proteins to enable their reactivation; together with partner chaperones it

      rescues previously aggregated proteins rather than merely preventing

      aggregation.

      '
    reference_section_type: RESULTS
    supporting_text: Hsp104 is a member of the Hsp100/Clp family of oligomeric AAA+
      ATPases that does not itself perform proteolysis but instead remodels aggregated
      proteins to enable their reactivation.
  - statement: 'Hsp104 expression is sufficient for acquired thermotolerance and promotes

      resolubilization and reactivation of proteins that unfolded and aggregated

      after heat shock.

      '
    reference_section_type: RESULTS
    supporting_text: expression of Hsp104 is sufficient for thermotolerance, and Hsp104
      promotes resolubilization and reactivation of proteins that have unfolded and
      aggregated after heat shock.
  - statement: 'Hsp104 is a hexameric AAA+ ATPase with two nucleotide-binding domains

      (NBD1 and NBD2); it extracts clients by ATP-driven unfolding and threading

      through an axial channel, with the NBD2 pore-loop (conserved GYVG-loop,

      Tyr-662) required for disaggregation.

      '
    reference_section_type: RESULTS
    supporting_text: Hsp104 extracts clients by ATP-driven unfolding and threading
      through an axial channel; integrity of the NBD2 pore-loop region (including
      the conserved GYVG-loop containing Tyr-662) is required for refolding/disaggregation
      function.
  - statement: 'Hsp104 operates in a multichaperone disaggregation pathway with Hsp70
      and

      Hsp40; reactivation of aggregated luciferase requires ATP and depends on

      SSA-encoded Hsp70 and the Hsp40 co-chaperone Ydj1.

      '
    reference_section_type: RESULTS
    supporting_text: Hsp104-mediated reactivation of aggregated luciferase in yeast
      lysates requires ATP and depends on SSA-encoded Hsp70 activity and the Hsp40
      co-chaperone Ydj1.
  - statement: 'Hsp110 nucleotide-exchange factors (Sse1/Sse2) coordinate Hsp70 cycling
      and

      are essential for efficient Hsp104-dependent disaggregation in both cytosol

      and nucleus.

      '
    reference_section_type: RESULTS
    supporting_text: yeast Hsp110 nucleotide-exchange factors (Sse1/Sse2) coordinate
      Hsp70 cycling and are essential for efficient Hsp104-dependent disaggregation
      in both cytosol and nucleus
  - statement: 'A defining yeast-specific role of Hsp104 is amyloid prion fibril

      fragmentation, generating transmissible seeds (propagons) needed for

      prion inheritance such as [PSI+].

      '
    reference_section_type: RESULTS
    supporting_text: A defining yeast-specific role of Hsp104 is its centrality in
      amyloid prion fragmentation, which generates transmissible seeds
  - statement: 'Hsp104 levels must be finely tuned: both deletion and overexpression
      can

      cure [PSI+], and Hsp70 (Ssa1) antagonizes Hsp104 overexpression-mediated

      curing.

      '
    reference_section_type: RESULTS
    supporting_text: both Hsp104 deletion and Hsp104 overexpression can cure [PSI+].
      Importantly, Hsp70 (Ssa1) antagonizes Hsp104 overexpression-mediated curing
  - statement: 'Hsp104 is predominantly cytosolic under non-stress conditions but

      relocalizes to stress-induced protein quality control foci associated with

      stress granules, Q-bodies/CytoQ, and nuclear deposits (INQ/IPOD).

      '
    reference_section_type: RESULTS
    supporting_text: Hsp104 is largely cytosolic under non-stress conditions but relocalizes
      to stress-induced foci associated with CytoQ/Q-bodies, stress granules, and
      nuclear quality-control deposits such as INQ/IPOD.
  - statement: 'Under glucose starvation, ATP depletion drives sequestration of proteins

      into stress compartments (stress granules and Q-bodies), and Hsp104 ATPase

      activity is a key ATP-consuming process governing the abundance and size of

      these compartments.

      '
    reference_section_type: RESULTS
    supporting_text: is identified as a key ATP-consuming process that determines
      the abundance and size of these compartments
  - statement: 'Heat-induced stress granules (Pab1-GFP) resolve within ~2 h in wild-type

      cells but recovery is dramatically slower in hsp104-delta cells, consistent

      with an Hsp104-dependent clearance process.

      '
    reference_section_type: RESULTS
    supporting_text: stress granule foci (Pab1-GFP) begin resolving within ~2 hours
      in wild-type cells, whereas recovery is dramatically slower in hsp104Δ cells
  - statement: 'Nucleotide-state-specific middle-domain (MD):NBD contacts tune Hsp104

      activity and Hsp70 collaboration, and the MD can help ensure that

      processed substrates remain functional after Hsp104 action.

      '
    reference_section_type: RESULTS
    supporting_text: the MD helps ensure that processed substrates remain functional
      after Hsp104 action
