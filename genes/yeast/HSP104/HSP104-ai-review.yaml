- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: HSP104 is a well-characterized ATPase with two AAA-type nucleotide-binding
      domains per monomer. ATP hydrolysis is central to its disaggregase function.
      Extensive biochemical characterization (PMID:9624144, PMID:11782421, PMID:16135516)
      demonstrates robust ATPase activity.
    action: ACCEPT
    reason: ATP hydrolysis is a core enzymatic activity of HSP104, required for its
      protein disaggregation mechanism. Supported by multiple IDA and IMP annotations.
      PMID:16135516 directly demonstrates ATPase activity and its regulation by substrate
      binding.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000181243
        source_label: PANTHER:PTN000181243
        source_status: SUPPORTS_TRANSFER
        comment: ATP hydrolysis is conserved across the PTHR11638 AAA+ family and
          HSP104 is itself among the experimentally grounded descendants.
    supported_by:
    - reference_id: PMID:16135516
      supporting_text: upon association with a polypeptide, a conformational change
        occurs within Hsp104 that strongly reduces the dynamics of nucleotide exchange
        and commits the bound polypeptide to ATP hydrolysis.
