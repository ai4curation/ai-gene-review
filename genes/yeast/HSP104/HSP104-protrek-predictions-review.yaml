status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for yeast HSP104, the hexameric AAA+ disaggregase. The defining
  molecular function - ATP-dependent protein disaggregase activity, the review's first core function
  - does not appear in the top five, and neither does anything about ATP, threading, hexamers or prion
  propagation. What comes back are three correct stress-response process terms and two aggregate-compartment
  terms: ranks 4 and 5 name the protein aggregate center and its assembly, which is the object HSP104
  acts on rather than the action. Scores are also low in absolute terms (16.19 down to 15.13) for
  a 908-residue protein with 23 GOA terms and decades of characterisation. The free-text channel returns
  HSP104's own comment at 19.65, naming dissociation, resolubilization and refolding of aggregates
  in concert with YDJ1, SSA1 and HSP26 - the mechanism the GO channel misses entirely. Assessment:
  2 correct-not-novel, 1 correct novel. Assessment: 1 correct novel (COR), 2 correct not novel (CNN).
