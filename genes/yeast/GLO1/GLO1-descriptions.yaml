gene_symbol: GLO1
organism: yeast
uniprot_id: P50107
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the conversion of hemimercaptal, formed from methylglyoxal and glutathione,
    to S-lactoylglutathione (PubMed:11050082, PubMed:8824231). Can use gamma-glutamylcysteine
    as a substrate (PubMed:8824231).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50107
  source_id: P50107
- source: Alliance_Imported
  text: Monomeric glyoxalase I; catalyzes the detoxification of methylglyoxal (a by-product
    of glycolysis) via condensation with glutathione to produce S-D-lactoylglutathione;
    required for full activity of O-acetyl homoserine sulfhydrylase, Met17p; expression
    regulated by methylglyoxal levels and osmotic stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GLO1
  source_id: SGD:S000004463
- source: Alliance_Automated
  text: Enables lactoylglutathione lyase activity. Involved in glutathione metabolic
    process and methylglyoxal catabolic process. Located in cytoplasm and nucleus.
    Human ortholog(s) of this gene implicated in autistic disorder; kidney disease
    (multiple); type 2 diabetes mellitus; and vascular disease (multiple). Orthologous
    to human GLO1 (glyoxalase I).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GLO1
  source_id: SGD:S000004463
