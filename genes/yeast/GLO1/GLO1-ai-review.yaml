suggested_questions:
- question: Do the two active sites of monomeric yeast Glo1 differ in metal occupancy (Fe vs Zn/Mn) in
    vivo, and does this tune activity under metal limitation?
- question: Is the reported nuclear GFP signal for Glo1 functionally relevant (e.g. protection of nuclear
    proteins/DNA from methylglyoxal glycation) or passive diffusion?
suggested_experiments:
- description: Measure methylglyoxal-derived AGE accumulation and methylglyoxal sensitivity in glo1 delta
    strains complemented with single-active-site mutants (E163Q or E318Q) to test whether one site suffices
    in vivo.
