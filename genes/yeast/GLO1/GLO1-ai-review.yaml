  review:
    summary: 'Based on the requirement for glutathione: gsh1 mutants are hypersensitive to methylglyoxal
      and are not rescued by Glo1 overproduction. Glo1 uses the glutathione-methylglyoxal hemithioacetal
      as substrate and the glyoxalase cycle regenerates glutathione, so glutathione metabolism is touched
      but not the biological purpose; the specific process is methylglyoxal catabolism. Kept as non-core
      rather than removed, as it is a curator IMP call.'
