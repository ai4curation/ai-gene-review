  label: Saccharomyces cerevisiae S288C
description: GLO1 (YML004C) encodes glyoxalase I (lactoylglutathione lyase, EC 4.4.1.5) of Saccharomyces
  cerevisiae, the first enzyme of the glutathione-dependent glyoxalase system. It isomerises the hemithioacetal
  formed non-enzymatically from methylglyoxal and glutathione into (R)-S-lactoylglutathione, which glyoxalase
  II (cytosolic Glo2 or mitochondrial Glo4) then hydrolyses to D-lactate and glutathione. Unlike the dimeric
  human and bacterial enzymes, yeast Glo1 is a 326-residue monomer carrying two glyoxalase domains, each
  forming a functional metal-dependent active site (probably one Zn(II)/Mn(II) and one Fe(II) site). It
  can also use gamma-glutamylcysteine as a much poorer thiol substrate. GLO1 is non-essential, but its
  overexpression raises glyoxalase I activity about 95-fold and confers methylglyoxal resistance; the
  enzyme is soluble and cytoplasmic.
