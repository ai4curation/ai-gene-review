  review:
    summary: IBA from PANTHER PTN000075336 (dephospho-CoA kinase node; donors E. coli CoaE P0A6I9, mouse
      Coasy, Arabidopsis DPCK). Cab4 shares the PANTHER family PTHR10695 with COASY because mammalian
      COASY fuses PPAT and DPCK domains, but Cab4 contains only the cytidylyltransferase-like PPAT domain
      (IPR004821) and no CoaE/DPCK domain (IPR001977). In yeast DPCK activity is provided by the separate
      gene CAB5 (CoaE family). The propagation to Cab4 is a domain-architecture error.
    action: REMOVE
    reason: Cab4 lacks the dephospho-CoA kinase domain; the activity belongs to Cab5. IBA propagated across
      a fused (COASY-type) family to a single-domain PPAT.
    supported_by:
    - reference_id: file:yeast/CAB4/CAB4-uniprot.txt
      supporting_text: DR   InterPro; IPR004821; Cyt_trans-like.
    - reference_id: file:yeast/CAB4/CAB4-uniprot.txt
      supporting_text: 'SIMILARITY: Belongs to the eukaryotic CoaD family. {ECO:0000305}.'
    - reference_id: PMID:19266201
      supporting_text: Null mutants could be complemented by their bacterial counterparts coaBC, coaD
        and coaE, respectively.
    propagation_review:
