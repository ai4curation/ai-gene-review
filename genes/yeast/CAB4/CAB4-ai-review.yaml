id: P53332
gene_symbol: CAB4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CAB4 (YGR277C) encodes the essential phosphopantetheine adenylyltransferase (PPAT) of S.
  cerevisiae, which transfers an adenylyl group from ATP to 4'-phosphopantetheine to give 3'-dephospho-CoA
  and pyrophosphate (step 4 of CoA biosynthesis). Cab4 belongs to the eukaryotic CoaD family (nucleotidyltransferase/cytidylyltransferase-like
  Rossmann fold) and, unlike the bifunctional mammalian CoA synthase (COASY), carries only the PPAT domain;
  the final dephospho-CoA kinase step is performed by the separate protein Cab5. The cab4 null is complemented
  by E. coli coaD. Cab4 is cytoplasmic (also seen in the nucleus in high-throughput imaging) and is a
  component of the CoA-synthesizing protein complex (CoA-SPC) together with Cab2, Cab3, Cab5 and the PPCDC
  subunits.
