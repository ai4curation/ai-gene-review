gene_symbol: CAB4
organism: yeast
uniprot_id: P53332
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Reversibly transfers an adenylyl group from ATP to 4'- phosphopantetheine,
    yielding dephospho-CoA (dPCoA) and pyrophosphate (By similarity). Plays a role
    in the physiological regulation of the intracellular CoA concentration.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53332
  source_id: P53332
- source: Alliance_Imported
  text: 'Subunit of the CoA-Synthesizing Protein Complex (CoA-SPC); subunits of this
    complex are: Cab2p, Cab3p, Cab4p, Cab5p, Sis2p and Vhs3p; involved in histone
    acylation; probable pantetheine-phosphate adenylyltransferase (PPAT); PPAT catalyzes
    the fourth step in the biosynthesis of coenzyme A from pantothenate; null mutant
    lethality is complemented by E. coli coaD (encoding PPAT) and by human COASY'
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAB4
  source_id: SGD:S000003509
- source: Alliance_Automated
  text: Predicted to enable dephospho-CoA kinase activity and pantetheine-phosphate
    adenylyltransferase activity. Involved in coenzyme A biosynthetic process. Located
    in cytoplasm and nucleus. Part of CoA-synthesizing protein complex. Used to study
    cancer. Human ortholog(s) of this gene implicated in mucopolysaccharidosis III;
    neurodegeneration with brain iron accumulation 6; and pontocerebellar hypoplasia
    type 12. Orthologous to human COASY (Coenzyme A synthase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAB4
  source_id: SGD:S000003509
