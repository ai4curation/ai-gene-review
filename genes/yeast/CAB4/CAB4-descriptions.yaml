- source: Alliance_Automated
  text: Predicted to enable dephospho-CoA kinase activity and pantetheine-phosphate
    adenylyltransferase activity. Involved in coenzyme A biosynthetic process. Located
    in cytoplasm and nucleus. Part of CoA-synthesizing protein complex. Used to study
    cancer. Human ortholog(s) of this gene implicated in mucopolysaccharidosis III;
    neurodegeneration with brain iron accumulation 6; and pontocerebellar hypoplasia
    type 12. Orthologous to human COASY (Coenzyme A synthase).
  source_type: automated
