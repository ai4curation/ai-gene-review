findings:
- category: discrepancy
  text: The automated text gives Cab4 dephospho-CoA kinase activity; the review removes
    that IBA because Cab4 is a single-domain PPAT and Cab5 is the DPCK.
  sources:
  - Alliance_Automated
- category: gap
  text: SGD says Cab4 (and Cab5) is involved in histone acylation; neither review
    mentions it.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: UniProt and SGD agree on monofunctional PPAT. The automated text
    also assigns the Cab5 activity.
