- description: 'NADPH-dependent D-xylose reductase: reduces D-xylose to xylitol, the first step of the
    oxidoreductive xylose pathway (GRE3 -> XYL2 -> XKS1 -> pentose phosphate pathway). Gre3 is the major
    xylose reductase of S. cerevisiae and a broad-specificity aldose reductase (EC 1.1.1.21/1.1.1.431).'
  molecular_function:
    id: GO:0032866
