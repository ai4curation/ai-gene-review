gene_symbol: GRE3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GRE3 encodes the NADPH-dependent aldose reductase of Saccharomyces cerevisiae, a monomeric
  ~37 kDa member of the aldo-keto reductase (AKR) superfamily closely related to the xylose reductases
  of pentose-fermenting yeasts. Gre3 reduces a broad range of aldehydes and aldoses (D-xylose, L-arabinose,
  D-galactose, DL-glyceraldehyde, aromatic aldehydes) to the corresponding alcohols/alditols with a strong
  preference for NADPH, and reduces the toxic glycolytic by-product methylglyoxal. It is the major D-xylose
  reductase of S. cerevisiae, catalysing the first step (D-xylose to xylitol) of the endogenous oxidoreductive
  xylose pathway that continues through xylitol dehydrogenase (XYL2) and xylulokinase (XKS1), and is one
  of several AKRs (with YPR1 and YJR096W) that reduce L-arabinose to arabitol. GRE3 transcription is induced
  by osmotic, ionic, oxidative and heat stress via the HOG pathway and Msn2/Msn4, and the protein is found
  in the cytoplasm (and nucleus) by GFP localization.
