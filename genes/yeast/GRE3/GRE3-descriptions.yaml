descriptions:
- source: UniProt
  text: Aldose reductase with a broad substrate specificity (Probable) (PubMed:7747971).
    Reduces the cytotoxic compound methylglyoxal (MG) to acetol and (R)-lactaldehyde
    under stress conditions. MG is synthesized via a bypath of glycolysis from dihydroxyacetone
    phosphate and is believed to play a role in cell cycle regulation and stress adaptation
    (PubMed:11525399). In pentose- fermenting yeasts, aldose reductase catalyzes the
    reduction of xylose into xylitol, with a preference for NADPH as cosubstrate (PubMed:11481678,
    PubMed:11722921). The purified enzyme catalyzes this reaction, but the inability
    of S.cerevisiae to grow on xylose as sole carbon source indicates that the physiological
    function is more likely methylglyoxal reduction (Probable) (PubMed:11722921).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38715
  source_id: P38715
- source: Alliance_Imported
  text: Aldose reductase; involved in methylglyoxal, d-xylose, arabinose, and galactose
    metabolism; stress induced (osmotic, ionic, oxidative, heat shock, starvation
    and heavy metals); regulated by HOG pathway; overexpression allows xylose fermentation
    in strains expressing heterologous xylitol dehydrogenase and xylulokinase; protein
    abundance increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GRE3
  source_id: SGD:S000001146
- source: Alliance_Automated
  text: Enables D-xylose reductase (NADPH) activity and mRNA binding activity. Involved
    in cellular response to osmotic stress; cellular response to oxidative stress;
    and monosaccharide catabolic process. Located in cytoplasm and nucleus. Human
    ortholog(s) of this gene implicated in 46,XY sex reversal 8; alcohol dependence;
    congenital bile acid synthesis defect 2; and leukemia (multiple). Orthologous
    to several human genes including AKR1E2 (aldo-keto reductase family 1 member E2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GRE3
  source_id: SGD:S000001146
