- source: Alliance_Automated
  text: Contributes to ribose phosphate diphosphokinase activity. Involved in 5-phosphoribose
    1-diphosphate biosynthetic process. Located in cytoplasm. Part of ribose phosphate
    diphosphokinase complex. Used to study diabetes insipidus and fundus dystrophy.
    Human ortholog(s) of this gene implicated in several diseases, including Arts
    syndrome; X-linked deafness 1; X-linked recessive disease (multiple); gout; and
    retinitis pigmentosa. Orthologous to several human genes including PRPS1 (phosphoribosyl
    pyrophosphate synthetase 1) and PRPS2 (phosphoribosyl pyrophosphate synthetase
    2).
