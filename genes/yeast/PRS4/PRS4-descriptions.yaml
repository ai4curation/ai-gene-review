taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: 5-phosphoribose 1-diphosphate synthase involved in nucleotide, histidine,
    and tryptophan biosynthesis. Active in heteromultimeric complexes with other 5-phosphoribose
    1-diphosphate synthases (PRS2, PRS3, PRS4 and PRS5).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38063
  source_id: P38063
- source: Alliance_Imported
  text: 5-phospho-ribosyl-1(alpha)-pyrophosphate synthetase, synthesizes PRPP; which
    is required for nucleotide, histidine, and tryptophan biosynthesis; one of five
    related enzymes, which are active as heteromultimeric complexes; PRS4 has a paralog,
    PRS2, that arose from the whole genome duplication; a missense mutation in the
    conserved residue R196 of its human homolog PRPS1 is pathogenic
  source_type: curated
  url: https://www.yeastgenome.org/locus/PRS4
  source_id: SGD:S000000164
- source: Alliance_Automated
  text: Contributes to ribose phosphate diphosphokinase activity. Involved in 5-phosphoribose
    1-diphosphate biosynthetic process. Located in cytoplasm. Part of ribose phosphate
    diphosphokinase complex. Used to study diabetes insipidus and fundus dystrophy.
    Human ortholog(s) of this gene implicated in several diseases, including Arts
    syndrome; X-linked deafness 1; X-linked recessive disease (multiple); gout; and
    retinitis pigmentosa. Orthologous to several human genes including PRPS1 (phosphoribosyl
    pyrophosphate synthetase 1) and PRPS2 (phosphoribosyl pyrophosphate synthetase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PRS4
  source_id: SGD:S000000164
