descriptions:
- source: UniProt
  text: Regulatory subunit of the cyclic AMP-dependent protein kinase (PKA), an effector
    of the Ras/cAMP pathway. Inhibits PKA activity in the absence of cAMP. cAMP activates
    PKA and promotes growth and proliferation in response to good nutrient conditions.
    Together with ZDS1, provides a negative feedback control on the cell wall integrity-
    signaling pathway by acting as a negative regulator of MAP kinase SLT2/MPK1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P07278
  source_id: P07278
- source: Alliance_Imported
  text: 'Regulatory subunit of the cyclic AMP-dependent protein kinase (PKA); PKA
    is a component of a signaling pathway that controls a variety of cellular processes,
    including metabolism, cell cycle, stress response, stationary phase, and sporulation;
    regulator of meiotic commitment '
  source_type: curated
  url: https://www.yeastgenome.org/locus/BCY1
  source_id: SGD:S000001295
- source: Alliance_Automated
  text: Enables cAMP-dependent protein kinase inhibitor activity and identical protein
    binding activity. Involved in several processes, including cellular response to
    glucose starvation; negative regulation of Ras protein signal transduction; and
    protein localization to bud neck. Located in several cellular components, including
    chromatin; nucleus; and plasma membrane. Human ortholog(s) of this gene implicated
    in congestive heart failure and disease of mental health. Orthologous to several
    human genes including PRKAR2A (protein kinase cAMP-dependent type II regulatory
    subunit alpha) and PRKAR2B (protein kinase cAMP-dependent type II regulatory subunit
    beta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/BCY1
  source_id: SGD:S000001295
