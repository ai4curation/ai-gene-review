  review:
    summary: >-
      The PAINT-inherited process is biologically related to cAMP signaling but
      scopes Bcy1 onto the upstream GPCR-to-adenylate-cyclase arm.
    action: MODIFY
    reason: >-
      BCY1 acts downstream of Ras, Gpr1/Gpa2, and adenylate cyclase: cAMP binds
      Bcy1 and relieves PKA inhibition. The more precise process is negative
      regulation of cAMP/PKA signal transduction, not activation of adenylate
      cyclase by a GPCR.
