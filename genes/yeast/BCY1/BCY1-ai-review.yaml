  label: Saccharomyces cerevisiae S288C
description: >-
  BCY1 encodes the cAMP-binding regulatory subunit of budding-yeast protein
  kinase A. Bcy1 homodimerizes and binds Tpk1, Tpk2, and Tpk3 catalytic
  subunits to form the inactive PKA holoenzyme; cAMP binding relieves that
  inhibition and releases active catalytic kinase. Bcy1 is distributed between
  the nucleus and cytosol in a carbon-source- and phosphorylation-regulated
  manner, with additional chromatin and plasma-membrane-associated pools, and it
  gates Ras/cAMP/PKA signaling outputs that control nutrient-responsive growth,
  stress physiology, starvation responses, P-body assembly, and transcriptional
  programs.
