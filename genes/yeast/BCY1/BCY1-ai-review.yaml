        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The PTN000180782 placement groups genuine cAMP/PKA signaling genes,
          but GO:0007189 names an upstream receptor-to-adenylate-cyclase step.
    supported_by:
    - reference_id: PMID:3037314
      supporting_text: encodes a regulatory subunit of the cyclic AMP-dependent protein kinase
