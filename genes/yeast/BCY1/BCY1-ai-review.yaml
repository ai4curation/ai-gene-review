suggested_questions:
- question: >-
    How are the stress- and carbon-source-specific Bcy1 pools at chromatin, the
    plasma membrane, the nucleus, and the cytosol coupled to different Tpk
    catalytic isoforms and substrate sets?
- question: >-
    Does Bcy1 homodimer composition or post-translational modification state
    bias the holoenzyme toward Tpk1, Tpk2, or Tpk3 during glucose depletion,
    nitrogen starvation, osmotic stress, and heat stress?
suggested_experiments:
- description: >-
    Quantify endogenous Bcy1-Tpk1, Bcy1-Tpk2, and Bcy1-Tpk3 holoenzymes by
    affinity purification/mass spectrometry across glucose-rich,
    glucose-depleted, nitrogen-starved, heat-stressed, and osmotic-stress
    conditions.
  experiment_type: affinity purification and mass spectrometry
- description: >-
    Combine phosphosite-mutant Bcy1 alleles with live-cell imaging and
    phosphoproteomics to map which Bcy1 phosphorylation clusters control
    nuclear, cytosolic, plasma-membrane, and chromatin-associated PKA outputs.
  experiment_type: phosphosite mutagenesis and live-cell imaging
