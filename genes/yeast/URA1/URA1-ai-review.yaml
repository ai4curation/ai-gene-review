id: P28272
gene_symbol: URA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: URA1 encodes the cytosolic, fumarate-dependent dihydroorotate dehydrogenase (DHODH, EC 1.3.98.1)
  of Saccharomyces cerevisiae, the fourth enzyme of de novo pyrimidine (UMP) biosynthesis. The FMN-containing
  homodimer oxidises (S)-dihydroorotate to orotate and transfers the electrons to fumarate, producing
  succinate, so that pyrimidine synthesis is independent of oxygen and of the respiratory chain. Ura1
  is a class 1A DHODH about 70% identical to Lactococcus lactis PyrDA and was acquired by Saccharomyces
  yeasts through horizontal gene transfer from a bacterium; it replaced the ancestral mitochondrial, quinone-dependent
  class 2 DHODH that most fungi (including S. pombe) still use, and this replacement is linked to the
  ability of S. cerevisiae to grow anaerobically. In vitro the enzyme can also use artificial acceptors,
  quinones and (poorly) oxygen. URA1 transcription is induced by dihydroorotate through Ppr1.
