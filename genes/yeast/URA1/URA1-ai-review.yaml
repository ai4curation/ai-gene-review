core_functions:
- description: 'Fumarate-dependent dihydroorotate dehydrogenase (class 1A, FMN): oxidises (S)-dihydroorotate
    to orotate in the cytosol with fumarate as electron acceptor, the fourth step of de novo UMP synthesis;
    independence from the respiratory chain allows pyrimidine synthesis under anaerobiosis.'
  molecular_function:
    id: GO:1990663
    label: dihydroorotate dehydrogenase (fumarate) activity
  directly_involved_in:
  - id: GO:0044205
    label: '''de novo'' UMP biosynthetic process'
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1409592
    supporting_text: in vitro studies have revealed that the DHOdehase of S. cerevisiae uses fumarate
      as terminal electron acceptor
  - reference_id: PMID:1409592
    supporting_text: The DHOdehase from Sch. pombe was localized in the mitochondria whereas its homolog
      from S. cerevisiae was found to be cytosolic
  - reference_id: PMID:15014982
    supporting_text: Saccharomyces cerevisiae has a cytoplasmatic enzyme, whose activity is independent
      of the presence of oxygen
  - reference_id: PMID:15014982
    supporting_text: Only the cytoplasmic DHODase promotes growth in the absence of oxygen
  - reference_id: file:yeast/URA1/URA1-uniprot.txt
    supporting_text: Reaction=(S)-dihydroorotate + fumarate = orotate + succinate;
suggested_questions:
- question: Under aerobic growth, does Ura1 use any acceptor other than fumarate in vivo (e.g. oxygen
    or quinones), and does the resulting succinate feed significantly into mitochondrial metabolism?
suggested_experiments:
- description: Replace URA1 with a mitochondrially targeted class 2 DHODH (e.g. S. pombe ura3) and compare
    growth and pyrimidine pools under aerobic, hypoxic and anaerobic conditions to quantify the fitness
    advantage of the horizontally acquired enzyme.
