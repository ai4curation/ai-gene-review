gene_symbol: URA1
organism: yeast
uniprot_id: P28272
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the conversion of dihydroorotate to orotate with fumarate as the
    electron acceptor. Molecular oxygen can replace fumarate in vitro. Does not use
    oxaloacetate or NAD or NADP as electron acceptors.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P28272
  source_id: P28272
- source: Alliance_Imported
  text: Dihydroorotate dehydrogenase; catalyzes the fourth enzymatic step in the de
    novo biosynthesis of pyrimidines, converting dihydroorotic acid into orotic acid
  source_type: curated
  url: https://www.yeastgenome.org/locus/URA1
  source_id: SGD:S000001699
- source: Alliance_Automated
  text: Enables dihydroorotate dehydrogenase activity. Involved in 'de novo' pyrimidine
    nucleobase biosynthetic process. Located in cytoplasm. Human ortholog(s) of this
    gene implicated in postaxial acrofacial dysostosis. Orthologous to human DHODH
    (dihydroorotate dehydrogenase (quinone)).
  source_type: automated
  url: https://www.yeastgenome.org/locus/URA1
  source_id: SGD:S000001699
