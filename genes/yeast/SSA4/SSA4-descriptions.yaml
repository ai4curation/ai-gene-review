review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
    notes: >-
      Agreement on core HSP70 function and on an ancillary translocation role, but all
      imported descriptions repeat the same incorrect SRP-dependent cotranslational
      mechanism. SGD curated uniquely conveys the stress-responsive and Cd2+-specific
      biology.
  overall_notes: >-
    No UniProt FUNCTION description is available. SGD curated provides the most useful
    SSA4-specific stress biology, especially cadmium/VHS1 and starvation responses, but
    its targeting clause needs correction to post-translational translocation. The
    automated sources are generic and inherit the same mechanistic error.
