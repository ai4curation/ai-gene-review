- id: PMID:11279056
  title: Starvation promotes nuclear accumulation of the hsp70 Ssa4p in yeast cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record and cached abstract verified; directly supports reversible, starvation-specific nuclear accumulation of Ssa4 and identifies the N-terminal Star sequence/Nmd5 import mechanism.
  findings:
  - statement: Ssa4 accumulates reversibly in nuclei during starvation through an N-terminal targeting mechanism rather than residing constitutively in the nucleus.
    supporting_text: |-
      In contrast, the hsp70 Ssa4p concentrates in nuclei upon starvation. Nuclear concentration of Ssa4p in starving cells is reversible
    reference_section_type: ABSTRACT
- id: PMID:16429126
  title: Proteome survey reveals modularity of the yeast cell machinery.
  reference_review:
