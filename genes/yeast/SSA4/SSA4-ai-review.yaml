- id: file:yeast/SSA4/SSA4-hypotheses/existing-go-0005886-keep-as-non-core/openscientist.md
  title: OpenScientist hypothesis review of the SSA4 plasma-membrane IBA annotation
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      The report correctly found no target-specific plasma-membrane evidence and its live
      absence result is corroborated by the current local PAINT snapshot. It nevertheless
      mischaracterizes the pinned SSA4 GOA snapshot, which does contain the 2025 IBA, and
      speculates about donor origins; those claims are not used.
  findings:
  - statement: The plasma-membrane IBA lacks SSA4-specific experimental support; the available yeast plasma-membrane proteomics annotations concern other paralogs, while supported Ssa membrane-proximal roles concern ER or mitochondrial membranes rather than plasma membrane.
    supporting_text: |-
      The only yeast PM evidence for this family (HDA, PMID:16622836) covers the paralogs Ssa1/Ssa2/Ssb1, is contamination-prone, and **excludes Ssa4**; the genuine peripheral membrane roles of Ssa chaperones concern the **ER/mitochondrial outer membrane**, not the plasma membrane.
    reference_section_type: OTHER
core_functions:
- description: |-
    Stress-inducible cytosolic Hsp70 chaperone: Ssa4 binds exposed hydrophobic
    segments of non-native polypeptides and uses ATP-driven cycling of its
    nucleotide-binding domain to assist folding/refolding of nascent and
    stress-denatured proteins, prevent aggregation, and (with the Hsp104
    disaggregase and cochaperones) recover proteins from aggregates following
    heat shock.
