      (POM34), a key component of nuclear pore complex (NPC), and translocates from
      the cytoplasm to the nucleus, where it regulates the expression of its
      downstream gene, Viable in a Hal3 Sit4 background 1 (VHS1), resulting in reduced
      Cd accumulation in yeast cells.
    reference_section_type: ABSTRACT
- id: PMID:8754838
  title: Functional interaction of cytosolic hsp70 and a DnaJ-related protein, Ydj1p, in protein translocation in vivo.
