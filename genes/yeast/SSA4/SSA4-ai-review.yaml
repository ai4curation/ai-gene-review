- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:11279056
  review:
    summary: |-
      Nuclear localization of Ssa4 is real but conditional: Chughtai et al. (2001) show
      Ssa4p concentrates in nuclei specifically upon starvation (reversible, with active
      export on refeeding) via an N-terminal Star sequence and the beta-importin Nmd5p.
      Zheng et al. (2024) independently show nuclear translocation under cadmium stress,
      association with Pom34, and regulation of VHS1 expression linked to reduced
      cadmium accumulation. These are context-specific relocalizations rather than the
      default site of chaperone action, so nucleus is retained as non-core. Falcon
      confirms Ssa4 is otherwise classified as a cytosolic/cytoplasmic Hsp70.
    action: KEEP_AS_NON_CORE
    reason: Starvation- and cadmium-induced nuclear accumulation are real but context-specific localizations, not the core cytosolic site of chaperone function.
    additional_reference_ids:
    - PMID:39456809
    - file:yeast/SSA4/SSA4-deep-research-falcon.md
    supported_by:
