id: P00890
gene_symbol: CIT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CIT1 encodes the major mitochondrial citrate synthase of Saccharomyces cerevisiae, which
  condenses acetyl-CoA with oxaloacetate to form citrate in the mitochondrial matrix, the first committed
  step of the tricarboxylic acid cycle. Unlike its paralog CIT3, Cit1p is specific for acetyl-CoA and
  has no methylcitrate synthase activity. It is active as a homodimer; phosphorylation of Ser462 blocks
  dimerisation and activity and is reversed by the matrix phosphatase Ptc7p. Deletion of CIT1 impairs
  respiratory metabolism and growth on acetate, and a cit1 cit2 double mutant is a glutamate auxotroph.
  Cit1p has been found in a supramolecular association with other matrix dehydrogenases and TCA-cycle
  enzymes.
