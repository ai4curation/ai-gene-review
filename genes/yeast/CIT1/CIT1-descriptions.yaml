- source: Alliance_Imported
  text: Mitochondrial citrate synthase; catalyzes condensation of acetyl coenzyme
    A and oxaloacetate to form citrate, which is the first and rate-limiting step
    of the TCA cycle; transcription subject to glucose repression; CIT1 has a paralog,
    CIT2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/CIT1
  source_id: SGD:S000005284
- source: Alliance_Automated
  text: Enables citrate synthase activity. Involved in acetyl-CoA catabolic process;
    citrate metabolic process; and tricarboxylic acid cycle. Located in mitochondrion.
    Human ortholog(s) of this gene implicated in dilated cardiomyopathy and hypertrophic
    cardiomyopathy. Orthologous to human CS (citrate synthase).
  source_type: automated
