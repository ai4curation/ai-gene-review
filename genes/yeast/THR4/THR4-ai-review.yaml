suggested_questions:
- question: Is the nuclear GFP signal of Thr4p functionally meaningful, or passive diffusion of a soluble
    monomeric enzyme?
suggested_experiments:
- description: Measure the kinetic parameters of purified recombinant Thr4p and test for allosteric regulation,
    e.g. by S-adenosylmethionine as seen in plant threonine synthases, to establish how flux at the homoserine
    branch point is controlled in fungi.
