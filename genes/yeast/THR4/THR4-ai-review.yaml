  label: Saccharomyces cerevisiae S288C
description: 'THR4 (YCR053W) encodes threonine synthase (EC 4.2.3.1). This pyridoxal 5''-phosphate (PLP)-dependent
  enzyme of the fold-type II (tryptophan synthase beta-like) family catalyses the final step of threonine
  biosynthesis: gamma-elimination of phosphate from O-phospho-L-homoserine followed by beta-addition of
  water to give L-threonine. The 2.7 A crystal structure shows an active monomer of three domains, with
  PLP covalently bound at the domain interface. Threonine synthase activity in yeast extracts depends
  on THR4. thr4 mutants are threonine auxotrophs. Genetic suppression and homoserine-challenge experiments
  implicate toxic intermediate accumulation in their pleiotropic stress and serum sensitivities and reduced
  survival in mouse infection. Thr4p is a soluble cytoplasmic protein. Nuclear localization and rDNA-silencing
  phenotypes have also been reported; rescue of the silencing defect by threonine indicates that the phenotype
  can reflect metabolic supply.'
