  evidence_type: IDA
  original_reference_id: PMID:11756443
  qualifier: enables
  review:
    summary: Garrido-Franco et al. (2002) solved the crystal structure of yeast threonine synthase with
      PLP covalently anchored in the PLP-binding domain. PLP is the essential cofactor for the gamma-elimination/beta-addition
      chemistry.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:11756443
      supporting_text: The crystal structure of threonine synthase from Saccharomyces cerevisiae has been
        solved at 2.7 A resolution
    - reference_id: PMID:11756443
      supporting_text: a PLP-binding domain that covalently anchors the cofactor
    reason: The yeast Thr4 structure in PMID:11756443 directly establishes the PLP-binding active site.
      PLP mediates the phosphohomoserine-to-threonine elimination/addition chemistry, so this is an integral
      catalytic cofactor rather than a peripheral binding claim.
