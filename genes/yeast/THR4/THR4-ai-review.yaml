- term:
    id: GO:0009090
    label: L-homoserine biosynthetic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:THRESYN-PWY
  review:
    summary: THR4 acts downstream of homoserine formation and does not catalyze its biosynthesis.
    action: REMOVE
    reason: THR4 converts phosphohomoserine to threonine after Thr1 has consumed homoserine. PMID:20305003
      explicitly places Thr1 and Thr4 in the sequential conversion of homoserine to threonine, and PMID:20305002
      links loss of this downstream route to homoserine toxicity. GO:0009090 requires participation in
      formation of homoserine; membership in the larger THRESYN-PWY route does not establish that direction.
      Remove this incorrect biosynthetic assertion while retaining the separately supported threonine-biosynthesis
      claim.
    supported_by:
    - reference_id: PMID:20305003
      supporting_text: Homoserine is converted to threonine by the sequential actions of homoserine kinase
        (Thr1p) and threonine synthase (Thr4p).
    - reference_id: PMID:20305002
      supporting_text: they are dependent on the toxic biosynthetic intermediate homoserine
