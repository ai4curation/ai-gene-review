  url: https://www.uniprot.org/uniprot/P16120
  source_id: P16120
- source: Alliance_Imported
  text: Threonine synthase; conserved protein that catalyzes formation of threonine
    from O-phosphohomoserine; expression is regulated by the GCN4-mediated general
    amino acid control pathway
  source_type: curated
  url: https://www.yeastgenome.org/locus/THR4
  source_id: SGD:S000000649
- source: Alliance_Automated
  text: Enables pyridoxal phosphate binding activity and threonine synthase activity.
    Involved in L-threonine biosynthetic process. Located in cytoplasm and nucleus.
    Orthologous to several human genes including THNSL2 (threonine synthase like 2).
  source_type: automated
