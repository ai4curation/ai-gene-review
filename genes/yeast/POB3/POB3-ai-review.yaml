    label: nucleus
  supported_by:
  - reference_id: PMID:15987999
    supporting_text: The yeast FACT complex has a role in transcriptional initiation
  - reference_id: PMID:14585989
    supporting_text: The FACT complex travels with elongating RNA polymerase II
- molecular_function:
    id: GO:0031491
    label: nucleosome binding
  description: Support of DNA replication fork progression and replication-coupled
    nucleosome assembly. POB3 is essential for DNA replication, physically associates
    with DNA polymerase alpha, and participates in replication-coupled chromatin assembly
    behind the advancing replication fork.
  directly_involved_in:
  - id: GO:0006261
    label: DNA-templated DNA replication
  locations:
