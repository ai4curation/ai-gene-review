id: Q04636
gene_symbol: POB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: POB3 is the small subunit of the FACT (Facilitates Chromatin Transcription)
  complex, an essential heterodimeric histone chaperone that works with Spt16 to dynamically
  reorganize nucleosomes during transcription elongation and DNA replication. Unlike
  mammalian SSRP1, yeast POB3 lacks intrinsic DNA-binding capacity and instead cooperates
  with Nhp6 proteins for DNA recognition. POB3 specifically binds H2A-H2B dimers
  through its acidic C-terminus and contributes to H3-H4 interactions through its
  middle pleckstrin homology domains. The protein is essential for cell viability
  and localizes to active transcription sites and replication forks within chromatin.
core_functions:
- molecular_function:
    id: GO:0031491
    label: nucleosome binding
  description: Histone chaperone activity through nucleosome reorganization. POB3
    is the critical histone chaperone subunit of FACT that mediates reversible disassembly
    and reassembly of nucleosomes through binding to H2A-H2B dimers (C-terminal acidic
    domain) and H3-H4 tetramers (middle pleckstrin homology domains). This nucleosome
    dynamics activity is the molecular foundation for all of POB3's functional roles.
  directly_involved_in:
  - id: GO:0006325
    label: chromatin organization
  - id: GO:0034728
    label: nucleosome organization
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:11432837
    supporting_text: Spt16-Pob3 and the HMG protein Nhp6 combine to form the nucleosome-binding
      factor SPN
  - reference_id: PMID:18089575
    supporting_text: Structural and functional analysis of the Spt16p N-terminal domain
      reveals overlapping roles
  - reference_id: PMID:26414936
    supporting_text: we found the acidic C-terminus of Pob3 forming cross-links to
      histone H2A and H2B most efficiently
- molecular_function:
    id: GO:0042393
    label: histone binding
  description: Facilitation of RNA Polymerase II transcription elongation and initiation.
    POB3 travels with elongating RNA polymerase II and facilitates nucleosome passage
    during transcript elongation. FACT also promotes preinitiation complex assembly
    and stabilizes TBP binding to TATA boxes.
  directly_involved_in:
  - id: GO:0140673
    label: transcription elongation-coupled chromatin remodeling
  - id: GO:0045899
    label: positive regulation of RNA polymerase II transcription preinitiation complex
      assembly
  locations:
