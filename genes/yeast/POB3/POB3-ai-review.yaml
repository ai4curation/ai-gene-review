    supporting_text: The Saccharomyces cerevisiae DNA polymerase alpha catalytic subunit
      interacts with Cdc68/Spt16 and with Pob3
  - reference_id: PMID:10924459
    supporting_text: POB3 is required for both transcription and replication
existing_annotations:
- term:
    id: GO:0035101
    label: FACT complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: POB3 is an integral, obligate component of the FACT complex. IBA evidence
      from phylogenetic analysis is appropriate given the conserved role of POB3/SSRP1
      orthologs across eukaryotes. This annotation correctly identifies POB3's core
      cellular role as a structural component of the FACT heterodimer.
    action: ACCEPT
    reason: POB3 is the second essential subunit of FACT, functioning obligately with
      Spt16. The PANTHER IBD at PTN002492356 places FACT-complex membership on the
      conserved eukaryotic SSRP1/POB3 family, which is supported by direct complex
      evidence from budding yeast, fission yeast, fly, plant, human, and trypanosome
      descendants. This is a sound core inference, not a similarity-only transfer.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002492356
        source_status: SUPPORTS_TRANSFER
        comment: Current PTHR45849 PAINT places FACT-complex membership at PTN002492356
          with taxon:2759 Eukaryota, supporting transfer to budding-yeast POB3 as
          a conserved eukaryotic FACT subunit.
    supported_by:
    - reference_id: PMID:9705338
      supporting_text: Characterization of the CP complex, an abundant dimer of Cdc68
        and Pob3 proteins
    - reference_id: PMID:10413469
      supporting_text: purified Spt16 and Pob3 form a stable, abundant, elongated
        heterodimer
  qualifier: part_of
