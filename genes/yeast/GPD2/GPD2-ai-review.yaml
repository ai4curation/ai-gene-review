    label: cytosol
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:9171333
    supporting_text: Mutants deleted for both GPD1 and GPD2 do not produce detectable glycerol, are highly
      osmosensitive and fail to grow under anoxic conditions.
  - reference_id: PMID:9171333
    supporting_text: Thus, glycerol formation is strictly required as a redox sink for excess cytosolic
      NADH during anaerobic metabolism.
  - reference_id: PMID:9171333
    supporting_text: Mutants lacking GPD2 show poor growth under anaerobic conditions.
  - reference_id: PMID:15210723
    supporting_text: Gpd2p is known to be a cytosolic protein but possesses a classical mitochondrial
      presequence, which we show is sufficient for mitochondrial targeting.
  - *id001
  - reference_id: PMID:11676566
    supporting_text: We showed that the overexpression of GPD2, encoding the other isoform of glycerol-3-phosphate
      dehydrogenase (Gpd2p), is equally as effective as the overexpression of GPD1 in increasing glycerol
      production
suggested_questions:
- question: Which reactions does the mitochondrial pool of Gpd2p balance (intramitochondrial NADH from
    lysine/glutamate synthesis), and is the alternative initiator Met-49 used to make a cytosol-only form?
- question: Should GPD1/GPD2 carry 'glycerol-3-phosphate shuttle' (GO:0006127), given that Gut2p does
    and Overkamp 2000 names Gpd1p/Gpd2p as the soluble component?
suggested_experiments:
- description: Compare anaerobic growth and glycerol yield of gpd1 gpd2 strains complemented with cytosol-only
    (presequence-deleted) versus mitochondria-only Gpd2p.
