core_functions:
- description: NADH-dependent reduction of DHAP to sn-glycerol 3-phosphate, the committed step of glycerol
    production that acts as the redox sink for excess NADH in anaerobic metabolism.
  molecular_function:
    id: GO:0141152
    label: glycerol-3-phosphate dehydrogenase (NAD+) activity
  directly_involved_in:
  - id: GO:0006114
    label: glycerol biosynthetic process
  locations:
