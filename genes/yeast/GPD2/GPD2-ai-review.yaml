taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Gpd2p is the second NAD+-dependent glycerol-3-phosphate dehydrogenase (EC 1.1.1.8) of S.
  cerevisiae. Like Gpd1p it reduces dihydroxyacetone phosphate to sn-glycerol 3-phosphate with NADH, but
  GPD2 is not osmotically regulated; it is induced under anoxia and other conditions of cytosolic NADH
  excess, independently of the HOG pathway. Glycerol formation by Gpd2p is the main redox sink that reoxidizes
  surplus NADH during anaerobic fermentation: gpd2 mutants grow poorly anaerobically and gpd1 gpd2 double
  mutants make no glycerol and cannot grow without oxygen. Gpd2p is mostly cytosolic but has an N-terminal
  mitochondrial presequence that directs a fraction into mitochondria, making respiratory-deficient cells
  dependent on Gpd2p. It can also act as the cytosolic half of the glycerol-3-phosphate shuttle with mitochondrial
  Gut2p.'
