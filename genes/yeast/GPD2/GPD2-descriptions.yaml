gene_symbol: GPD2
organism: yeast
uniprot_id: P41911
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the production of glycerol under anaerobic growth conditions. Glycerol
    production serves as a redox sink by consuming the excess cytosolic NADH during
    anaerobic metabolism.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41911
  source_id: P41911
- source: Alliance_Imported
  text: NAD-dependent glycerol 3-phosphate dehydrogenase; expression is controlled
    by an oxygen-independent signaling pathway required to regulate metabolism under
    anoxic conditions; located in cytosol and mitochondria; constitutively active
    but is inactivated via phosphorylation by energy-stress responsive kinase SNF1;
    GPD2 has a paralog, GPD1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GPD2
  source_id: SGD:S000005420
- source: Alliance_Automated
  text: Enables glycerol-3-phosphate dehydrogenase (NAD+) activity. Involved in glycerol
    metabolic process. Located in mitochondrion. Human ortholog(s) of this gene implicated
    in Brugada syndrome 2 and lipid metabolism disorder. Orthologous to human GPD1
    (glycerol-3-phosphate dehydrogenase 1) and GPD1L (glycerol-3-phosphate dehydrogenase
    1 like).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GPD2
  source_id: SGD:S000005420
