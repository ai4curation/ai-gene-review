gene_symbol: ADE16
organism: yeast
uniprot_id: P54113
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Bifunctional enzyme that catalyzes the last two steps of purine biosynthesis
    (PubMed:10877846, PubMed:9143321). Acts as a transformylase that incorporates
    a formyl group to the AMP analog AICAR (5-amino-1-(5-phospho-beta-D-ribosyl)imidazole-4-carboxamide)
    to produce the intermediate formyl-AICAR (FAICAR) (PubMed:10877846, PubMed:9143321).
    Also catalyzes the cyclization of FAICAR to IMP (PubMed:10877846, PubMed:9143321).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54113
  source_id: P54113
- source: Alliance_Imported
  text: Enzyme of 'de novo' purine biosynthesis; contains both 5-aminoimidazole-4-carboxamide
    ribonucleotide transformylase and inosine monophosphate cyclohydrolase activities;
    ADE16 has a paralog, ADE17, that arose from the whole genome duplication; ade16
    ade17 mutants require adenine and histidine
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADE16
  source_id: SGD:S000004018
- source: Alliance_Automated
  text: Enables IMP cyclohydrolase activity and phosphoribosylaminoimidazolecarboxamide
    formyltransferase activity. Involved in 'de novo' IMP biosynthetic process. Located
    in cytosol. Human ortholog(s) of this gene implicated in intellectual disability
    and purine-pyrimidine metabolic disorder. Orthologous to human ATIC (5-aminoimidazole-4-carboxamide
    ribonucleotide formyltransferase/IMP cyclohydrolase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADE16
  source_id: SGD:S000004018
