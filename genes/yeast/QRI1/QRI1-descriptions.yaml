descriptions:
- source: UniProt
  text: UDP-N-acetylglucosamine pyrophosphorylase that utilizes N- acetylglucosamine-1-phosphate
    as substrate (PubMed:9603950). Together with AGM1, is involved in the production
    of UDP-N-acetylglucosamine from N-acetylglucosamine-6-phosphate (PubMed:9603950).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P43123
  source_id: P43123
- source: Alliance_Imported
  text: UDP-N-acetylglucosamine pyrophosphorylase; catalyzes the formation of UDP-N-acetylglucosamine
    (UDP-GlcNAc), which is important in cell wall biosynthesis, protein N-glycosylation,
    and GPI anchor biosynthesis; protein abundance increases in response to DNA replication
    stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/QRI1
  source_id: SGD:S000002261
- source: Alliance_Automated
  text: Enables UDP-N-acetylglucosamine diphosphorylase activity. Involved in UDP-N-acetylglucosamine
    biosynthetic process. Located in cytoplasm and nucleus. Orthologous to human UAP1
    (UDP-N-acetylglucosamine pyrophosphorylase 1) and UAP1L1 (UDP-N-acetylglucosamine
    pyrophosphorylase 1 like 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/QRI1
  source_id: SGD:S000002261
