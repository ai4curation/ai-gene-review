suggested_questions:
- question: Does yeast Qri1 accept N-acetylgalactosamine 1-phosphate or other hexosamine-1-phosphates,
    as human UAP1/AGX1 does, and is this relevant given yeast has no known UDP-GalNAc-dependent glycosylation?
suggested_experiments:
- description: Assay purified Qri1 with GalNAc1P, GlcN1P and Glc1P to define substrate specificity relative
    to Ugp1.
