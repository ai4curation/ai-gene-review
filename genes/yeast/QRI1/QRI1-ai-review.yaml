  label: Saccharomyces cerevisiae S288C
description: QRI1 (UAP1) encodes UDP-N-acetylglucosamine pyrophosphorylase (EC 2.7.7.23), a UDPGP-family
  nucleotidyltransferase that condenses UTP and N-acetylglucosamine 1-phosphate into UDP-N-acetylglucosamine
  and pyrophosphate. This is the final step of the cytosolic hexosamine pathway (Gfa1, Gna1, Pcm1, Qri1).
  Its product, UDP-GlcNAc, is the substrate for chitin synthases, the first two steps of N-linked glycan
  assembly on dolichol, and GPI-anchor synthesis. QRI1 is essential, and human or Candida albicans UAP1
  can replace it. The enzyme is found in the cytoplasm and, in GFP surveys, also in the nucleus.
