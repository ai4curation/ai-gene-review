core_functions:
- description: >-
    SAM-dependent tRNA cytosine-C5 methyltransferase that forms m5C at C48/C49
    (variable loop/T-stem junction, intron-independent) and at C34 (wobble,
    pre-tRNA-Leu(CAA)) and C40 (pre-tRNA-Phe) of intron-containing precursor
    tRNAs in the nucleus. It is the sole tRNA m5C methyltransferase of S.
    cerevisiae.
  molecular_function:
    id: GO:0016428
    label: tRNA (cytidine-N5)-methyltransferase activity
  directly_involved_in:
  - id: GO:0030488
    label: tRNA methylation
  - id: GO:0002127
    label: tRNA wobble base cytosine methylation
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - reference_id: PMID:10445884
    supporting_text: These results demonstrate that the protein product of a single
      gene is responsible for complete m5C methylation of yeast tRNA.
  - reference_id: PMID:22760636
    supporting_text: there is a Trm4 methyltransferase-dependent increase in the proportion
      of tRNA(Leu(CAA)) containing m(5)C at the wobble position
  - reference_id: PMID:9767141
    supporting_text: Epitope tagged Ncl1p was found to be localized to the nucleus,
      including the nucleolus
suggested_questions:
- question: >-
    Does Ncl1 have a cytoplasmic pool that methylates mature tRNAs at C48/C49
    (intron-independent sites), as NSUN2 does in animals, or is all of its
    activity on nuclear pre-tRNA?
- question: >-
    Does Ncl1 methylate any non-tRNA substrates in vivo (mRNA, ncRNA, or
    mitochondrial RNA)? Transcriptome-wide m5C mapping in trm4 deletion cells
    would show this.
- question: >-
    For transfer to S. pombe: Ncl1's multisite specificity is split between the
    paralogs Trm4a (C34, C48) and Trm4b (C49, C50). Should site-specific process
    terms (for example wobble C34 methylation) be propagated from Ncl1 to either
    paralog only when that paralog has paralog-resolved methylome evidence?
suggested_experiments:
- description: >-
    Bisulfite or nanopore m5C mapping of total and polyA+ RNA in wild-type versus
    ncl1 deletion and catalytic-dead (C310A) strains, to determine the full
    in vivo substrate set, including any mRNA targets.
- description: >-
    Live-cell imaging of endogenously tagged Ncl1 under normal growth and H2O2
    stress, to test whether part of the enzyme moves to the cytoplasm.
