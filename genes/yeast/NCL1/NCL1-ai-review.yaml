- term:
    id: GO:0070301
    label: cellular response to hydrogen peroxide
  evidence_type: IMP
  original_reference_id: PMID:22760636
  qualifier: involved_in
  review:
    summary: >-
      trm4 deletion cells are hypersensitive to H2O2 (complemented by TRM4
      re-expression), and H2O2 raises Trm4-dependent m5C34 in tRNA-Leu(CAA),
      selectively increasing translation of UUG-rich mRNAs such as RPL22A.
    action: KEEP_AS_NON_CORE
    reason: >-
      Ncl1 does part of the work of this response: the H2O2-induced increase in
      wobble m5C34 is made by Ncl1 itself, and it reprograms codon-biased
      translation. The evidence goes beyond a sensitivity phenotype, with
      complementation, modification mapping and reporter/proteomic data. It is a
      context-specific consequence of the core tRNA methyltransferase activity
      and so is kept as non-core.
    supported_by:
    - reference_id: PMID:22760636
      supporting_text: In yeast exposed to hydrogen peroxide, there is a Trm4 methyltransferase-dependent
        increase in the proportion of tRNA(Leu(CAA)) containing m(5)C at the wobble
        position, which causes selective translation of mRNA from genes enriched in
        the TTG codon.
    - reference_id: PMID:22760636
      supporting_text: re-expression of Trm4 conferred resistance to H2O2 exposure
