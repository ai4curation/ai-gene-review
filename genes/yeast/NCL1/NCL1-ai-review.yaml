- id: PMID:10445884
  title: 'Multisite-specific tRNA:m5C-methyltransferase (Trm4) in yeast Saccharomyces
    cerevisiae: identification of the gene and substrate specificity of the enzyme.'
  findings:
  - statement: Recombinant Ncl1/Trm4 methylates C34, C40, C48 and C49 of yeast tRNAs
      in vitro using SAM; C34/C40 methylation needs intron-containing pre-tRNA.
    supporting_text: Modification of tRNA occurs at all four positions (34, 40, 48,
      and 49) at which m5C has been found in yeast tRNAs sequenced so far.
  - statement: Ncl1/Trm4 is the sole tRNA m5C methyltransferase in S. cerevisiae.
    supporting_text: Disruption of the ORF YBL024w leads to the complete absence of
      m5C in total yeast tRNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; title, gene (YBL024w) and organism confirmed
      in the cached PubMed record. Defining biochemical paper for the gene.
- id: PMID:17567576
  title: The carboxyl-terminal extension of yeast tRNA m5C methyltransferase enhances
    the catalytic efficiency of the amino-terminal domain.
  findings:
  - statement: The N-terminal catalytic domain binds tRNA; the C-terminal extension
      is dispensable for m5C formation but enhances catalytic efficiency.
    supporting_text: It is not required for m(5)C formation and does not appear to
      contribute to substrate specificity. However, it enhances considerably the catalytic
      efficiency of the amino-terminal domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; describes domain architecture and tRNA binding
      of S. cerevisiae Trm4p.
- id: PMID:22760636
  title: Reprogramming of tRNA modifications controls the oxidative stress response
    by codon-biased translation of proteins.
  findings:
  - statement: H2O2 increases Trm4-dependent wobble m5C34 in tRNA-Leu(CAA), promoting
      translation of UUG-rich mRNAs; trm4 deletion causes H2O2 hypersensitivity, complemented
      by TRM4.
    supporting_text: there is a Trm4 methyltransferase-dependent increase in the proportion
      of tRNA(Leu(CAA)) containing m(5)C at the wobble position
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary in vivo evidence for wobble m5C34 and the
      oxidative-stress role.
- id: PMID:9767141
  title: NCL1, a novel gene for a non-essential nuclear protein in Saccharomyces cerevisiae.
  findings:
  - statement: Ncl1p is nuclear, including nucleolus and nuclear periphery; NCL1 is
      non-essential; deletion confers paromomycin sensitivity without altering ribosome
      levels.
    supporting_text: Disruption of NCL1 does not affect steady-state levels of large
      and small ribosome subunits, monoribosomes, and polyribosomes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; localization and phenotype paper that named
      the gene.
- id: PMID:16387656
  title: Rapid tRNA decay can result from lack of nonessential modifications.
  findings:
  - statement: trm4 trm8 double deletion causes rapid decay of tRNA-Val(AAC), showing
      that Ncl1-dependent modifications contribute to tRNA stability.
    supporting_text: Detailed examination of a trm8-delta trm4-delta double mutant demonstrates
      rapid degradation of preexisting tRNA(Val(AAC)) accompanied by its de-aminoacylation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed record cached (abstract only); PMID verified by title via web
      search. Supports a tRNA-stability consequence of Ncl1 activity; not used to add
      a process term.
- id: PMID:21187895
  title: A quantitative systems approach reveals dynamic control of tRNA modifications
    during cellular stress.
  findings:
  - statement: trm4 mutants are sensitive to H2O2, MMS, NaAsO2 and NaOCl; m5C in tRNA
      increases after H2O2.
    supporting_text: deficiencies in the m5C-producing methyltransferase Trm4 confer
      sensitivity to H2O2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; earlier stress-sensitivity profiling of trm4 mutants
      that underlies PMID:22760636.
- id: PMID:23913415
  title: Yeast Nop2 and Rcm1 methylate C2870 and C2278 of the 25S rRNA, respectively.
  findings:
  - statement: Yeast 25S rRNA m5C residues are made by Rcm1 and Nop2; 25S m5C is unchanged
      in trm4 deletion cells.
    supporting_text: The peak corresponding to the m5C with a retention time of approximately
      12 min reduces to half in the Δrcm1 mutant compared with wild type and Δtrm4.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; direct evidence against an rRNA methyltransferase
      role for Ncl1 in the 25S rRNA.
- id: PMID:30646830
  title: 'Division of labour: tRNA methylation by the NSun2 tRNA methyltransferases
    Trm4a and Trm4b in fission yeast.'
  findings:
  - statement: The C34/C48 and C49/C50 activities split between S. pombe Trm4a and
      Trm4b are united in S. cerevisiae Trm4; Trm4 C34/C40 activity is intron-dependent,
      C48/C49 activity intron-independent.
    supporting_text: S. pombe show an unusual separation of activities of the NSun2/Trm4
      enzymes that are united in a single enzyme in other eukaryotes like humans, mice
      and Saccharomyces cerevisiae.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; fission-yeast study that frames ScTrm4 as the single-enzyme
      counterpart of Trm4a and Trm4b.
