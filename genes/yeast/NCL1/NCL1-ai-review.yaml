id: P38205
gene_symbol: NCL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  NCL1 (also called TRM4; ORF YBL024W) encodes the multisite-specific tRNA
  cytosine-C5 methyltransferase of budding yeast, a 684-residue member of the
  RsmB/NOP2 (NSUN) family of SAM-dependent RNA m5C methyltransferases. It is the
  only enzyme forming 5-methylcytidine in yeast tRNA: deletion abolishes m5C in
  total tRNA. The recombinant enzyme methylates cytosine at positions 34 and 40
  (in intron-containing pre-tRNA-Leu(CAA) and pre-tRNA-Phe, respectively) and at
  positions 48 and 49 (intron-independent, at the variable loop/T-stem junction).
  The N-terminal domain carries the catalytic centre and binds tRNA, while the
  C-terminal extension raises catalytic efficiency. Ncl1 is a non-essential
  nuclear protein enriched in the nucleolus and at the nuclear periphery. Its
  modifications contribute to tRNA stability (trm4 trm8 double mutants undergo
  rapid tRNA decay), and hydrogen-peroxide exposure increases Trm4-dependent
  wobble m5C34 in tRNA-Leu(CAA), which favours translation of UUG-rich mRNAs and
  supports survival of oxidative stress. Yeast 25S rRNA m5C is made by Rcm1 and
  Nop2, not Ncl1. Ncl1 is the single budding-yeast counterpart of the two
  fission-yeast paralogs Trm4a and Trm4b, which split its C34/C48 and C49/C50
  activities between them.
