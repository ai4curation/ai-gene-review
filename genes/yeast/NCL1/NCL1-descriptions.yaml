findings:
- category: discrepancy
  text: UniProt suggests a ribosome-biogenesis role from paromomycin sensitivity;
    the review removes the rRNA methyltransferase and rRNA processing rows and attributes
    25S rRNA m5C to Rcm1 and Nop2.
  sources:
  - UniProt
review:
  reviewer: AI
  rubrics:
