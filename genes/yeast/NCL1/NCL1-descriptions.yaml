    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 5
    - rubric: specificity
      score: 5
    overall_notes: 'Accurate and current: SAM-dependent tRNA m5C methyltransferase
      on tRNAs and pre-tRNAs, and the H2O2-induced wobble m5C34 in tRNA-Leu(CAA) that
      favours UUG/TTG-rich translation and oxidative-stress survival.'
- source: Alliance_Automated
  text: Enables tRNA (cytidine-N5)-methyltransferase activity and tRNA binding activity.
    Involved in cellular response to hydrogen peroxide and tRNA wobble base cytosine
    methylation. Located in nucleus. Human ortholog(s) of this gene implicated in
    autosomal recessive intellectual developmental disorder 5. Orthologous to human
    NSUN2 (NOP2/Sun RNA methyltransferase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NCL1
  source_id: SGD:S000000120
