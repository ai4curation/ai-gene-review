gene_symbol: NCL1
organism: yeast
uniprot_id: P38205
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Methylates cytosine to m5C at several positions in different tRNAs and pre-tRNAs
    containing intron. Able to modify tRNAs at all four positions (34, 40, 48 and
    49) at which m5C has been found in tRNAs. May be involved in ribosome biogenesis
    as its disruption leads to increased sensitivity to the antibiotic paromomycin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38205
  source_id: P38205
- source: Alliance_Imported
  text: 'S-adenosyl-L-methionine-dependent tRNA: m5C-methyltransferase; methylates
    cytosine to m5C at several positions in tRNAs and intron-containing pre-tRNAs;
    increases proportion of tRNALeu(CAA) with m5C at wobble position in response to
    hydrogen peroxide, causing selective translation of mRNA from genes enriched in
    TTG codon; loss of NCL1 confers hypersensitivity to oxidative stress; similar
    to Nop2p and human proliferation associated nucleolar protein p120'
  source_type: curated
  url: https://www.yeastgenome.org/locus/NCL1
  source_id: SGD:S000000120
- source: Alliance_Automated
  text: Enables tRNA (cytidine-N5)-methyltransferase activity and tRNA binding activity.
    Involved in cellular response to hydrogen peroxide and tRNA wobble base cytosine
    methylation. Located in nucleus. Human ortholog(s) of this gene implicated in
    autosomal recessive intellectual developmental disorder 5. Orthologous to human
    NSUN2 (NOP2/Sun RNA methyltransferase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NCL1
  source_id: SGD:S000000120
