taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: DGA1 encodes the yeast acyl-CoA:diacylglycerol acyltransferase (DGAT; EC 2.3.1.20), the sole
  DGAT2-family member in Saccharomyces cerevisiae. It catalyses the acyl-CoA-dependent esterification
  of 1,2-diacylglycerol to triacylglycerol, the terminal committed step of triacylglycerol synthesis.
  Together with the acyl-CoA-independent phospholipid:diacylglycerol acyltransferase Lro1 it accounts
  for most cellular TAG synthesis, and it is the dominant TAG synthase in stationary phase. Dga1 is a
  multi-pass membrane protein of the ER, with both termini facing the cytosol, and it is strongly enriched
  on lipid droplets. It acts at seipin/Nem1-defined ER subdomains where droplets form. Dga1 also has acyl-CoA:monoacylglycerol
  acyltransferase (MGAT) activity, and it contributes to formation of 1-O-acylceramides.
