proposed_new_terms: []
suggested_questions:
- question: How is the activity of Dga1 partitioned between the ER membrane and lipid droplet surface,
    given that a multi-pass protein with a luminal loop is detected on the monolayer-bounded droplet?
- question: Does Dga1 MGAT activity contribute physiologically to recycling lipolysis-derived monoacylglycerol
    into TAG in vivo?
suggested_experiments:
- description: Compare TAG synthesis in strains expressing Dga1 tethered to the ER versus to lipid droplets
    (e.g. hairpin-anchor swaps) in a dga1 lro1 background.
  experiment_type: cell biology/lipidomics
  hypothesis: Dga1 activity on lipid droplets contributes to droplet growth independently of ER-localised
    activity.
