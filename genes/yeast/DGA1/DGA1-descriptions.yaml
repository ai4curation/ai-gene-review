gene_symbol: DGA1
organism: yeast
uniprot_id: Q08650
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the terminal and only committed step in triacylglycerol (TAG) synthesis
    by using diacylglycerol (DAG) and fatty acyl-CoA as substrates. Required for storage
    lipid synthesis. Major DAG esterifying enzyme in stationary phase when TAG production
    is particularly active. Involved in lipid particle synthesis from the endoplasmic
    reticulum, promoting localized TAG production at discrete ER subdomains, and in
    ergosterol biosynthesis (PubMed:11741946, PubMed:11751830, PubMed:11751875, PubMed:14640980,
    PubMed:15155725, PubMed:21321129, PubMed:32349126). Also has monoacylglycerol
    acyltransferase (MGAT) activity, catalyzing the acyl-CoA-dependent esterification
    of monoacylglycerol to diacylglycerol (PubMed:20554061). Can also utilize ceramide
    instead of DAG, acylating the ceramides by attaching a fatty acid to the hydroxy
    group on the first carbon atom of the long-chain base to produce 1-O-acylceramides
    (PubMed:22738231).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q08650
  source_id: Q08650
- source: Alliance_Imported
  text: Diacylglycerol acyltransferase; catalyzes the terminal step of triacylglycerol
    (TAG) formation, acylates diacylglycerol using acyl-CoA as an acyl donor; Lro1p
    and Dga1p can O-acylate ceramides; localized to lipid particles
  source_type: curated
  url: https://www.yeastgenome.org/locus/DGA1
  source_id: SGD:S000005771
- source: Alliance_Automated
  text: Enables 2-acylglycerol O-acyltransferase activity and diacylglycerol O-acyltransferase
    activity. Involved in several processes, including intracellular triglyceride
    homeostasis; lipid storage; and triglyceride biosynthetic process. Located in
    endoplasmic reticulum membrane and lipid droplet. Human ortholog(s) of this gene
    implicated in metabolic dysfunction-associated steatotic liver disease. Orthologous
    to several human genes including MOGAT1 (monoacylglycerol O-acyltransferase 1);
    MOGAT2 (monoacylglycerol O-acyltransferase 2); and MOGAT3 (monoacylglycerol O-acyltransferase
    3).
  source_type: automated
