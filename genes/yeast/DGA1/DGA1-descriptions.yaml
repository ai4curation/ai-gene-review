- source: Alliance_Automated
  text: Enables 2-acylglycerol O-acyltransferase activity and diacylglycerol O-acyltransferase
    activity. Involved in several processes, including intracellular triglyceride
    homeostasis; lipid storage; and triglyceride biosynthetic process. Located in
    endoplasmic reticulum membrane and lipid droplet. Human ortholog(s) of this gene
    implicated in metabolic dysfunction-associated steatotic liver disease. Orthologous
    to several human genes including MOGAT1 (monoacylglycerol O-acyltransferase 1);
    MOGAT2 (monoacylglycerol O-acyltransferase 2); and MOGAT3 (monoacylglycerol O-acyltransferase
    3).
