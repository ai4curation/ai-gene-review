core_functions:
- description: >-
    Shr5/Erf4 is the accessory subunit of the ER Ras palmitoyltransferase. It
    forms a complex with DHHC protein Erf2 and contributes to Ras
    palmitoyltransferase activity by stabilizing Erf2 and its acyl-enzyme
    intermediate, enabling Ras2 palmitoylation and membrane targeting.
  contributes_to_molecular_function:
    id: GO:0016409
    label: palmitoyltransferase activity
