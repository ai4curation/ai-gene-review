  review:
    summary: Shr5/Erf4 physically associates with the catalytic subunit Erf2.
    action: MODIFY
    reason: >-
      The interaction with Erf2 is direct and central to the complex, but the
      bare protein-binding term should be replaced by the informative
      complex-level molecular-function annotation: Shr5/Erf4 contributes to
      Erf2 Ras palmitoyltransferase activity. SHR5 already carries a
      contributes_to GO:0016409 row from the same paper, so the replacement
      should preserve that qualifier.
    proposed_replacement_terms:
    - id: GO:0016409
      label: palmitoyltransferase activity
    supported_by:
    - reference_id: PMID:12193598
      supporting_text: >-
        Erf2p co-purifies with Erf4p (26 kDa) when it is expressed in yeast or
        in Escherichia coli.
