  - reference_id: PMID:12379641
    supporting_text: >-
      We show here that Erf4p, like Erf2p, is involved in the plasma membrane
      localization of Ras2p.
  - reference_id: PMID:22904317
    supporting_text: >-
      Erf4 is required for the stable formation of the palmitoyl-Erf2
      intermediate, the first step of palmitoyl transfer to protein substrates.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does the nucleus-vacuole-junction Shr5 pool represent an active Erf2-Erf4
    palmitoyltransferase complex or an inactive reservoir of the accessory
    subunit?
suggested_experiments:
- experiment_type: split-fluorescence complex localization
  hypothesis: >-
    Shr5 at nucleus-vacuole junctions is a functional Erf2-associated
    palmitoyltransferase pool.
  description: >-
    Tag endogenous Erf2 and Shr5 with complementary fluorescence reporters and
    test whether complex-positive NVJ signal coincides with Ras2
    palmitoylation or relocalization under metabolic states that remodel NVJs.
