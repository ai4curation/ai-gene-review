id: P41912
gene_symbol: SHR5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  SHR5 encodes the S. cerevisiae Erf4 accessory subunit of the
  endoplasmic-reticulum Ras palmitoyltransferase. Erf4 forms a complex with the
  DHHC catalytic subunit Erf2, stabilizes the acyl-Erf2 intermediate and the
  Erf2 architecture, and thereby contributes to Ras2 palmitoylation and plasma
  membrane targeting.
