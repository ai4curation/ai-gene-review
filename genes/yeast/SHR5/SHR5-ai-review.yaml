- term:
    id: GO:0006612
    label: protein targeting to membrane
  evidence_type: IMP
  original_reference_id: PMID:7532279
  qualifier: involved_in
  review:
    summary: Shr5 is required for Ras membrane attachment and palmitoylation.
    action: ACCEPT
    reason: >-
      The original shr5 mutant phenotype connects Shr5 to Ras membrane
      attachment, and later work showed that this occurs through the
      Erf2-Erf4 Ras palmitoyltransferase complex.
    additional_reference_ids:
    - PMID:12193598
    supported_by:
    - reference_id: PMID:7532279
      supporting_text: >-
        We found that less Ras protein is attached to the membrane in shr5
        mutants than in wild-type cells and that the Ras proteins are markedly
        underpalmitoylated, suggesting that Shr5 is involved in palmitoylation
        of Ras proteins.
