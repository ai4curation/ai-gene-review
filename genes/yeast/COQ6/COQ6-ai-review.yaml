  review:
    summary: ISA to E. coli UbiH (P25534), the bacterial C1 hydroxylase of 2-octaprenyl-6-methoxyphenol,
      made by Gin et al. 2003 when Coq6 was only predicted to be "required for one or more steps". Later
      experimental work showed Coq6 acts exclusively at C5 (and C4-deamination), and the C1 steps in eukaryotes
      are performed by a COQ4-dependent oxidative decarboxylation, so 2-methoxy-6-polyprenylphenol is
      not a pathway intermediate. The term is also specific to octaprenyl/NADPH chemistry. Contradicted
      by later experimental evidence on the same protein.
