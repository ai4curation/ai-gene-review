id: P53318
gene_symbol: COQ6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: COQ6 (YGR255C) encodes an FAD-dependent monooxygenase (UbiH/COQ6 family) of coenzyme Q6 (ubiquinone)
  biosynthesis in Saccharomyces cerevisiae. Coq6 catalyses the C5-hydroxylation of the aromatic ring,
  converting 4-hydroxy-3-hexaprenylbenzoate (HHB) to 3,4-dihydroxy-5-hexaprenylbenzoate (DHHB; EC 1.14.15.45),
  the substrate of the Coq3 O-methyltransferase. Electrons are supplied from NADPH via the mitochondrial
  ferredoxin reductase Arh1 and ferredoxin Yah1. When Q6 is made from para-aminobenzoate, Coq6 also performs
  the C4-deamination, hydroxylating 3-hexaprenyl-4-aminobenzoate at C5 and then replacing the C4 amino
  group with a hydroxyl. Coq6 is imported into mitochondria in a membrane-potential-dependent manner and
  is a peripheral protein on the matrix side of the inner membrane, a member of the Coq4-organised CoQ
  synthome. The ring C1 hydroxylation once attributed to Coq6 by analogy with bacterial UbiH is instead
  achieved through a COQ4-dependent oxidative decarboxylation. coq6 mutants lack Q6, accumulate HHB and
  cannot respire; their defect is bypassed by vanillic acid or 3,4-dihydroxybenzoate.
