  - reference_id: PMID:21944752
    supporting_text: the ferredoxin Yah1 and the ferredoxin reductase Arh1 may be the in vivo source of
      electrons for Coq6
  - reference_id: PMID:12721307
    supporting_text: Coq6p is a peripheral membrane protein that localizes to the matrix side of the inner
      mitochondrial membrane.
  - reference_id: PMID:26260787
    supporting_text: We show here that the FAD-dependent monooxygenase Coq6, which is known to hydroxylate
      position C5, also deaminates position C4 in a reaction implicating molecular oxygen, as demonstrated
      with labeling experiments.
suggested_questions:
- question: Should UniProt/HAMAP MF_03193 and YeastPathways PWY3O-19 drop the C1 hydroxylation (EC 1.14.15.46
    / 1.14.13.-) from Coq6, given Ozeir 2011 and the COQ4 oxidative decarboxylation (Pelosi 2024)?
- question: Is there a GO term (or should one be requested) for the Coq6 C4-deamination of 3-hexaprenyl-4-aminobenzoate
    (RHEA:58392 and the following deamination), needed for Q6 synthesis from pABA?
suggested_experiments:
- description: Reconstitute purified Coq6 with Arh1/Yah1/NADPH and test HHB, HAB and 2-methoxy-6-hexaprenylphenol
    as substrates to confirm that C1 hydroxylation is absent in vitro.
