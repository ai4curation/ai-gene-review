descriptions:
- source: UniProt
  text: FAD-dependent monooxygenase required for two non-consecutive steps during
    ubiquinone biosynthesis. Required for the C5-ring hydroxylation during ubiquinone
    biosynthesis by catalyzing the hydroxylation of 4-hydroxy-3-(all-trans-hexaprenyl)benzoic
    acid to 3,4- dihydroxy-5-(all-trans-hexaprenyl)benzoic acid (PubMed:21944752).
    Also acts downstream of COQ4, for the C1-hydroxylation during ubiquinone biosynthesis
    by catalyzing the hydroxylation of 2-methoxy-6-(all-trans- hexaprenyl)phenol to
    2-methoxy-6-(all-trans-hexaprenyl)benzene-1,4- diol. The electrons required for
    the hydroxylation reaction are funneled indirectly from NADPH via ferredoxin (YAH1)
    and ferredoxin reductase (ARH1) to COQ6 (PubMed:21944752). Can also convert 3-
    hexaprenyl-4-aminobenzoic acid (HAB), a COQ2-prenylated pABA, to DHHB in a two
    step process (PubMed:26260787). HAB is first hydroxylated at C5 to yield 3-hexaprenyl-4-amino-5-hydroxybenzoic
    acid (HHAB) which is further deaminated at C4 by COQ6 to produce DHHB (PubMed:26260787).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53318
  source_id: P53318
- source: Alliance_Imported
  text: Flavin-dependent monooxygenase involved in ubiquinone biosynthesis; responsible
    for hydroxylation at position C5 and deamination at C4 during ubiquinone (Coenzyme
    Q) biosynthesis; localizes to matrix face of mitochondrial inner membrane in a
    large complex with other ubiquinone biosynthetic enzymes; human homolog COQ6 can
    complement yeast null mutant and is implicated in steroid-resistant nephrotic
    syndrome (SRNS)
  source_type: curated
  url: https://www.yeastgenome.org/locus/COQ6
  source_id: SGD:S000003487
- source: Alliance_Automated
  text: Enables 4-hydroxy-3-all-trans-polyprenylbenzoate oxygenase activity and oxidoreductase
    activity, acting on paired donors, with incorporation or reduction of molecular
    oxygen, reduced flavin or flavoprotein as one donor, and incorporation of one
    atom of oxygen. Involved in ubiquinone biosynthetic process. Located in mitochondrial
    inner membrane. Used to study nephrotic syndrome; primary coenzyme Q10 deficiency
    6; and schwannomatosis. Human ortholog(s) of this gene implicated in primary coenzyme
    Q10 deficiency 6. Orthologous to human COQ6 (coenzyme Q6, monooxygenase).
  source_type: automated
