findings:
- category: discrepancy
  text: UniProt says Coq6 also performs the C1 hydroxylation downstream of COQ4; the
    review says this step is a COQ4-dependent oxidative decarboxylation, not a Coq6
    reaction.
  sources:
  - UniProt
review:
