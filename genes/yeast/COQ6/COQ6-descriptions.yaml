- source: Alliance_Imported
  text: Flavin-dependent monooxygenase involved in ubiquinone biosynthesis; responsible
    for hydroxylation at position C5 and deamination at C4 during ubiquinone (Coenzyme
    Q) biosynthesis; localizes to matrix face of mitochondrial inner membrane in a
    large complex with other ubiquinone biosynthetic enzymes; human homolog COQ6 can
    complement yeast null mutant and is implicated in steroid-resistant nephrotic
    syndrome (SRNS)
