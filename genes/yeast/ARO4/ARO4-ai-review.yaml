id: P32449
gene_symbol: ARO4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ARO4 encodes the tyrosine-inhibited isozyme of 3-deoxy-D-arabino-heptulosonate 7-phosphate
  (DAHP) synthase (EC 2.5.1.54) of Saccharomyces cerevisiae, a class I DAHP synthase (beta/alpha barrel)
  that condenses phosphoenolpyruvate and D-erythrose 4-phosphate to DAHP, the first committed step of
  the shikimate pathway leading to chorismate and the aromatic amino acids. Aro4 and its paralogue Aro3
  (phenylalanine-inhibited) are functionally redundant: either isozyme alone supports normal growth and
  only aro3 aro4 double mutants are aromatic auxotrophs. Tyrosine feedback inhibition depends on Gly226
  in a regulatory cavity; a G226S exchange switches the enzyme to the Aro3-like regulation pattern; feedback-resistant
  ARO4 alleles are widely used in metabolic engineering. ARO4 is cytosolic and induced by GCN4 under amino
  acid starvation.'
