descriptions:
- source: UniProt
  text: Stereospecific condensation of phosphoenolpyruvate (PEP) and D-erythrose-4-phosphate
    (E4P) giving rise to 3-deoxy-D-arabino- heptulosonate-7-phosphate (DAHP).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32449
  source_id: P32449
- source: Alliance_Imported
  text: 3-deoxy-D-arabino-heptulosonate-7-phosphate (DAHP) synthase; catalyzes the
    first step in aromatic amino acid biosynthesis and is feedback-inhibited by tyrosine
    or high concentrations of phenylalanine or tryptophan; relative distribution to
    the nucleus increases upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARO4
  source_id: SGD:S000000453
- source: Alliance_Automated
  text: Enables 3-deoxy-7-phosphoheptulonate synthase activity. Involved in positive
    regulation of catalytic activity. Located in cytoplasm and nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ARO4
  source_id: SGD:S000000453
