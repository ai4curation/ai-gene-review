id: P49723
gene_symbol: RNR4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: RNR4 (CRT3, YGR180C) encodes the second, catalytically inactive small (beta') subunit of the class
  Ia ribonucleotide reductase of Saccharomyces cerevisiae, a fungal-specific paralog of the radical-bearing Rnr2.
  Rnr4 lacks three of the conserved iron ligands, binds no iron, and its residual 'radical' tyrosine is dispensable,
  yet it is essential (or required for normal growth, depending on strain background) because it forms an obligate
  1:1 heterodimer with Rnr2 that folds and stabilises Rnr2, allows assembly of the di-iron tyrosyl radical cofactor
  on Rnr2, and promotes docking of the small subunit onto the Rnr1 (or Rnr3) large subunit. rnr4 null extracts have
  about 15-fold less radical and very low activity, and RNR2 and RNR4 cannot replace one another. The Rnr2-Rnr4
  heterodimer is held in the nucleus by Wtm1 and imported by Dif1 outside S phase and moves to the cytoplasm in
  S phase or after DNA damage, where it joins the large subunit to reduce ribonucleoside diphosphates to dNDPs.
  RNR4 transcription is induced by DNA damage through the Mec1-Rad53-Dun1 pathway.
