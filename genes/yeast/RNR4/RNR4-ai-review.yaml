core_functions:
- description: Catalytically inactive beta' subunit of class Ia ribonucleotide reductase that contributes to NDP
    reduction by forming the obligate Rnr2-Rnr4 heterodimer, enabling di-iron tyrosyl radical assembly on Rnr2 and
    docking of the small subunit with Rnr1/Rnr3 in the cytoplasm.
  contributes_to_molecular_function:
