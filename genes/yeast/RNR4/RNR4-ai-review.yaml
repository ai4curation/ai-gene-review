suggested_questions:
- question: Why did budding yeast (and related fungi) evolve an inactive beta' partner rather than an Rnr2 homodimer,
    and does Rnr4 confer a regulatory advantage (e.g. nuclear retention or checkpoint control)?
- question: Does Rnr4 contribute residues to the radical transfer pathway or only stabilise Rnr2?
suggested_experiments:
- hypothesis: Rnr4 is a structural scaffold without a role in radical transfer
  description: Measure radical transfer (PCET) kinetics in Rnr1:Rnr2-Rnr4 with point mutants at the Rnr4 C-terminal
    docking tail versus the Rnr2 tail, using unnatural-amino-acid radical traps.
  experiment_type: biochemistry / spectroscopy
