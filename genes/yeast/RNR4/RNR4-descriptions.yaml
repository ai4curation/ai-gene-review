- source: Alliance_Imported
  text: Ribonucleotide-diphosphate reductase (RNR) small subunit; the RNR complex
    catalyzes the rate-limiting step in dNTP synthesis and is regulated by DNA replication
    and DNA damage checkpoint pathways via localization of the small subunits; relocalizes
    from nucleus to cytoplasm upon DNA replication stress; RNR4 has a paralog, RNR2,
    that arose from the whole genome duplication
  source_type: curated
