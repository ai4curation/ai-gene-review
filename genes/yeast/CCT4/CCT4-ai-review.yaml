suggested_questions:
- question: Are there CCT4-specific substrate preferences within yeast CCT/TRiC that
    are separable from the activity of the assembled complex?
suggested_experiments:
- description: Compare substrate folding outcomes after CCT4-specific conditional
    depletion against depletion of other CCT subunits to identify any subunit-biased
    substrate effects.
