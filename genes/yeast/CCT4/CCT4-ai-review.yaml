      supporting_text: Expression of the equivalent subunit in yeast, GFP-Cct4, rescues
        growth of the temperature-sensitive strain cct4-1 at the non-permissive temperature,
        indicative of conserved subunit-specific activities for CCTdelta.
      full_text_unavailable: true
- term:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  evidence_type: IMP
  original_reference_id: PMID:18272176
  qualifier: enables
  review:
    summary: The CCT4 G345D phenotype supports CCT4's role in the ATP-driven TRiC/CCT
      folding cycle.
    action: ACCEPT
    reason: G345D in CCT4 abolishes cooperative ATP binding across the chaperonin
      rings and causes temperature-sensitive growth with actin, budding, and cell-shape
      defects, supporting the ATP-dependent chaperonin activity of CCT4-containing
      TRiC/CCT.
    supported_by:
    - reference_id: PMID:18272176
      supporting_text: this mutation abolishes both intra- and inter-ring cooperativity
        in ATP binding by CCT
