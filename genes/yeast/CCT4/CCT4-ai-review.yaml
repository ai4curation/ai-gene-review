id: P39078
gene_symbol: CCT4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: CCT4 encodes the delta subunit of the cytosolic chaperonin-containing
  T-complex (CCT/TRiC). CCT/TRiC is an ATP-dependent hetero-oligomeric chaperonin
  with two stacked rings built from eight related subunits. The complex assists folding
  of actin, tubulin, and other cytosolic substrates. CCT4 contributes as an integral
  subunit of the assembled CCT complex rather than as a free general protein-binding
  factor.
