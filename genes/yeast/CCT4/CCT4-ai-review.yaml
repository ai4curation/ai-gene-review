      activity in a yeast cct4-1 rescue assay, but not yeast Cct4 localization directly.
      Retain the SGD IDA cell-periphery localization as a non-core, subunit-specific
      finding from the uncached full text while keeping cytosolic chaperonin activity
      as CCT4's primary function.
    supported_by:
