id: Q12432
gene_symbol: EAF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Eaf3 is a nuclear MRG-family chromodomain protein that binds
  methylated histone H3K36 and acts in the NuA4 histone acetyltransferase
  complex, the Rpd3S histone deacetylase complex, and the Eaf5/7/3/TINTIN
  module. Through these complexes it couples histone H3K36 methylation and RNA
  polymerase II passage to coding-region histone acetylation control,
  transcription elongation-associated nucleosome dynamics, and repression of
  cryptic intragenic and antisense transcription.
existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: NAS
  original_reference_id: PMID:9512514
  qualifier: involved_in
  review:
    summary: Rpd3S-dependent negative regulation of RNA polymerase II
      transcription. Although the original NAS row cites a general Rpd3
      repression paper, later direct Rpd3S studies establish Eaf3 as the
      H3K36me-coupled subunit that helps repress internal and antisense
      initiation during transcription elongation.
    action: ACCEPT
    reason: Eaf3 is specific to the Rpd3S complex and is needed to direct Rpd3S
      toward Set2-methylated coding regions, where Rpd3S deacetylates chromatin
      and suppresses cryptic transcription.
    supported_by:
    - &rpd3s_repression
      reference_id: PMID:16286007
      supporting_text: Rco1 and Eaf3 were subunits specific to Rpd3S.
    - &eaf3_h3k36
      reference_id: PMID:16364921
      supporting_text: The Eaf3 chromodomain interacts with methylated H3-K36
        peptides
    - &antisense
      reference_id: PMID:21248844
      supporting_text: the Rpd3S deacetylation complex enforces strong
        directionality to
