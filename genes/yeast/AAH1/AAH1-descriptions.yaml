descriptions:
- source: UniProt
  text: Catalyzes the hydrolytic deamination of adenine to hypoxanthine. Plays an
    important role in the purine salvage pathway and in nitrogen catabolism. Also
    exhibits a low activity towards N(6)- substituted adenines that are commonly known
    as the plant hormones cytokinins.
