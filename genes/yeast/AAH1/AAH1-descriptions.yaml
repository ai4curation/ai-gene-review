gene_symbol: AAH1
organism: yeast
uniprot_id: P53909
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the hydrolytic deamination of adenine to hypoxanthine. Plays an
    important role in the purine salvage pathway and in nitrogen catabolism. Also
    exhibits a low activity towards N(6)- substituted adenines that are commonly known
    as the plant hormones cytokinins.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53909
  source_id: P53909
- source: Alliance_Imported
  text: Adenine deaminase (adenine aminohydrolase); converts adenine to hypoxanthine;
    involved in purine salvage; transcriptionally regulated by nutrient levels and
    growth phase; Aah1p degraded upon entry into quiescence via SCF and the proteasome
  source_type: curated
  url: https://www.yeastgenome.org/locus/AAH1
  source_id: SGD:S000005085
- source: Alliance_Automated
  text: Enables adenine deaminase activity. Involved in adenine catabolic process
    and hypoxanthine salvage. Located in cytoplasm and nucleus. Human ortholog(s)
    of this gene implicated in asthma; colon cancer; pleural disease (multiple); severe
    combined immunodeficiency (multiple); and uterine fibroid. Orthologous to human
    ADA (adenosine deaminase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/AAH1
  source_id: SGD:S000005085
