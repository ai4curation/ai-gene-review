  supporting_entities:
  - UniProtKB:P38352
  review:
    summary: 'Ho et al. 2002 HMS-PCI: Aah1 associates with the F-box protein Saf1 (P38352). Escusa et al. (2007)
      showed that this is a substrate-receptor interaction through which SCF(Saf1) ubiquitylates and degrades Aah1
      on entry into quiescence; it describes how Aah1 is regulated, not an Aah1 molecular function.'
    action: REMOVE
    reason: Uninformative protein binding; the Aah1-Saf1 interaction is real (Aah1 is an SCF-Saf1 degradation substrate)
      but does not define an Aah1 activity. Removal does not mean the interaction is false.
    supported_by:
    - reference_id: PMID:17517885
      supporting_text: we show that Saf1p interacts with both Aah1p and Skp1p.
    - reference_id: PMID:17517885
      supporting_text: the adenine deaminase Aah1p is specifically degraded via a process requiring the F-box protein
        Saf1p
