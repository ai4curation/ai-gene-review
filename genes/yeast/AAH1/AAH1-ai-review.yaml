id: P53909
gene_symbol: AAH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: AAH1 (YNL141W) encodes adenine deaminase (adenine aminohydrolase), a zinc-dependent amidohydrolase
  of the adenosine/AMP deaminase family (fungal adenine deaminase subfamily, evolutionarily derived from adenosine
  deaminases rather than from bacterial-type adenine deaminases) that hydrolyses adenine to hypoxanthine and ammonium.
  Adenine is the preferred substrate of the purified enzyme, which also slowly cleaves N6-substituted adenines (cytokinins).
  Together with adenine phosphoribosyltransferase (Apt1), Aah1 is one of the two routes by which exogenous adenine
  enters purine metabolism; the hypoxanthine it produces is converted to IMP by Hpt1, so the Aah1-Hpt1 route supplies
  IMP and guanylate when adenine represses de novo synthesis. Aah1 activity is not induced by adenine but is reduced
  on poor nitrogen sources, and when cells enter quiescence Aah1 is ubiquitylated and degraded via the SCF(Saf1)
  ubiquitin ligase. Aah1 is an abundant protein found in the cytoplasm and nucleus.
