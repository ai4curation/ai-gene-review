id: P28003
gene_symbol: FUN19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Fun19 is a nonessential Saccharomyces cerevisiae SWIRM-domain protein with an inferred nuclear chromatin-regulatory
  role. Its conserved domain supports chromatin binding, and phylogenetic evidence places it in an Rpd3L-related
  chromatin-complex lineage with roles in chromatin remodeling and transcriptional regulation. Fun19 and
  its whole-genome-duplication paralog YOR338W differ from canonical Ada2 proteins in domain architecture
  and complex context. The precise Fun19 interaction partners, target genes and mechanism of transcriptional
  regulation remain experimentally unresolved.
