- id: PMID:1583694
  title: Molecular analysis of Saccharomyces cerevisiae chromosome I. On the number
    of genes and the identification of essential genes using temperature-sensitive-lethal
    mutations.
  findings:
  - statement: FUN19 was defined during the molecular analysis of chromosome I and
      shown to be non-essential; at the time its predicted product showed no significant
      homology to known proteins.
    supporting_text: FUN19 itself proved to be non-essential.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary source that named FUN19 ("Function UNknown
      19"); establishes non-essentiality and the historical absence of homology, underpinning
      the "dark gene" framing.
- id: PMID:16461455
  title: Structure and function of the SWIRM domain, a conserved protein module found
    in chromatin regulatory complexes.
  findings:
  - statement: The SWIRM domain is a chromatin-associated module found in Swi3, Rsc8,
      Ada2 and LSD1; the Swi3 SWIRM binds DNA and nucleosomes and SWIRM domains are
      required for assembly and in vivo function of their complexes.
    supporting_text: The SWIRM domain is a module found in the Swi3 and Rsc8 subunits
      of SWI/SNF-family chromatin remodeling complexes, and the Ada2 and BHC110/LSD1
      subunits of chromatin modification complexes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Domain-level source (does not study FUN19 itself). Justifies the
      chromatin/nucleosome-association inference from FUN19's SWIRM domain while making
      clear the domain is a shared module that does not specify a complex.
- id: PMID:36965704
  title: The SAGA HAT module is tethered by its SWIRM domain and modulates activity
    of the SAGA DUB module.
  findings:
  - statement: In S. cerevisiae Ada2, the SWIRM domain tethers the Ada2/Gcn5/Ada3/Sgf29
      HAT module to the SAGA coactivator complex rather than acting as the acetyltransferase
      or an autonomous activation module.
    supporting_text: This depletion of just the HAT module proteins from the SAGA
      complex upon deletion of the Ada2 SWIRM domain indicates that the SWIRM domain
      plays a central role in tethering all four HAT module subunits to the rest of
      the SAGA complex.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary mechanistic Ada2/SAGA study. It does not assay Fun19, but
      it shows that the SWIRM domain retained by Fun19 is a SAGA-HAT tether in Ada2,
      not a standalone coactivator module.
- id: file:yeast/FUN19/FUN19-hypotheses/transcription-coactivation-after-ada2-saga-divergence/openscientist.md
  title: OpenScientist hypothesis report for FUN19 Ada2/SAGA coactivation divergence
  publication_type: DEEP_RESEARCH
  findings:
  - statement: A focused report argued that Fun19's retention of the SWIRM tethering
      domain is insufficient to retain Ada2-like positive coactivator activity after
      loss of the ZZ/SANT effector architecture and SAGA-type complex membership.
    supporting_text: Retaining the "docking" piece while losing the "business end"
      is not a conservative basis for inferring retained activation.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Focused report read. Its negative conclusion on Fun19 coactivator
      activity and positive regulation is supported by PMID:36965704 and by the Fun19
      subfamily's loss of SAGA-type complex membership. The report overstates the
      weakness of the neutral chromatin and Rpd3L IBAs, which remain plausible PAINT
      inferences pending direct target experiments.
- id: PMID:18407956
  title: A multidimensional chromatography technology for in-depth phosphoproteome
    analysis.
  findings:
  - statement: FUN19 is phosphorylated in vivo (Thr194, Ser207, Ser211) as detected
      by large-scale mass spectrometry, confirming the protein is expressed.
    supporting_text: A multidimensional chromatography technology for in-depth phosphoproteome
      analysis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Proteome-scale phosphosite dataset; the FUN19 phosphosites are recorded
      in UniProt (Thr194/Ser207/Ser211). Establishes expression, not function.
- id: PMID:19779198
  title: Global analysis of Cdk1 substrate phosphorylation sites provides insights
    into evolution.
  findings:
  - statement: FUN19 Ser207 was identified as a Cdk1-dependent phosphorylation site
      in a genome-wide analysis of Cdk1 substrates in budding yeast.
    supporting_text: we analyzed the position and conservation of large numbers of
      phosphorylation sites for the cyclin-dependent kinase Cdk1 in the budding yeast
      Saccharomyces cerevisiae
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Large-scale Cdk1 substrate map; FUN19 Ser207 is one of 547 sites.
      Recorded in UniProt as a Cdk1 site. Establishes phosphoregulation potential,
      not a specific molecular function.
