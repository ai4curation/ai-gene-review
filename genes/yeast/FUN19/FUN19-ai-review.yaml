- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Transcription coactivator activity is retained as an ancestral Fun19 inference pending mechanism-specific
      follow-up.
    action: ACCEPT
    reason: >-
      The actual tree retains the positive coactivator assertion from PTN000271860 in the Fun19 branch.
      Fun19 differs from Ada2 in ZZ/SANT architecture and the fungal clade carries a curated loss of SAGA-type
      membership, but neither establishes loss of every coactivation mechanism. Coactivator activity can
      be supplied by different chromatin complexes; absence of a target assay or a donor in the same terminal
      subfamily is not a negative result. Restore the inherited assertion and seek a focused assessment
      of functional directionality and conserved interfaces without assuming that the SAGA loss propagates
      to all regulatory functions.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000271860
        source_label: PTN000271860
        source_status: SUPPORTS_TRANSFER
        comment: Actual treeinfo lineage and the corresponding current PAINT IBD were checked. No
          target-specific loss of this assertion is established. Direct target experiments are
          distinguished from inherited function.
