core_functions:
- description: Inferred nuclear chromatin-binding regulator in an Rpd3L-related complex;
    conserved SWIRM/phylogenetic evidence supports chromatin remodeling and transcriptional
    regulation, while direct Fun19 mechanism and activation context remain to be established.
  molecular_function:
    id: GO:0003682
    label: chromatin binding
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0070210
    label: Rpd3L-Expanded complex
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:16461455
    supporting_text: the Swi3 SWIRM binds free DNA and mononucleosomes with high and
      comparable affinity
knowledge_gaps:
- gap_statement: The molecular activity of FUN19 is unknown. No enzymatic activity,
    DNA/ nucleosome-binding activity, or binding partner has been demonstrated, and
    it is undetermined whether FUN19's own SWIRM domain binds DNA/nucleosomes as the
    Swi3/Rsc8 SWIRM domains do.
  boundary: 'What is firmly established is only the domain architecture: a C-terminal
    SWIRM domain (residues 316-413; Pfam PF04433) attached to a largely disordered,
    low-complexity N-terminal region, placing FUN19 in the ADA2/LSD1 SWIRM superfamily.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: A direct Fun19 assay would test and mechanistically refine the curated
    ancestral chromatin-binding inference; the current inference is not equivalent
    to absence of functional evidence.
  resolution: In vitro DNA/nucleosome-binding assays with recombinant FUN19 (and its
    SWIRM domain), plus affinity purification / mass spectrometry to identify partners.
  provenance:
  - reference_id: PMID:1583694
    supporting_text: FUN19 itself proved to be non-essential.
- gap_statement: The biological process FUN19 participates in is unknown. Family-level
    annotations point toward chromatin-based transcriptional regulation, but no pathway,
    target genes, or process have been experimentally linked to FUN19.
  boundary: Fun19 is expressed and has a conserved SWIRM domain. Its actual phylogeny
    retains ancestral regulatory functions while explicitly recording loss of SAGA-type-complex
    membership in the fungal Fun19/Laf clade; a change of complex does not identify
    the direction of every transcriptional effect.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: The FUN19 subfamily bridges two opposing chromatin activities in its
    relatives (acetylation via Ada2, deacetylation via laf1/laf2); resolving which,
    if either, FUN19 contributes to would clarify the evolutionary fate of a duplicated
    chromatin-regulatory module in budding yeast.
  resolution: Genome-wide expression/chromatin profiling of a fun19 (and fun19 yor338w
    double) deletant, and testing physical association with Rpd3/Sin3 or SAGA/ADA
    complex members.
  provenance:
  - reference_id: PMID:16461455
    supporting_text: The SWIRM domain is a module found in the Swi3 and Rsc8 subunits
      of SWI/SNF-family chromatin remodeling complexes, and the Ada2 and BHC110/LSD1
      subunits of chromatin modification complexes.
- gap_statement: The subcellular localization of FUN19 and its membership (if any)
    in a defined protein complex are unverified. It is not established whether FUN19
    is nuclear, nor whether it is a subunit of any S. cerevisiae Rpd3/Sin3-type or
    SAGA-type complex.
  boundary: Actual ancestry supports nucleus and Rpd3L-Expanded association, with
    no direct Fun19 localization/purification assay identified. GO:0070210 explicitly
    includes budding-yeast architecture; it is not restricted to fission yeast.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: Direct localization and complex isolation would test and refine the
    retained phylogenetic assertions and define Fun19-specific partners.
  resolution: Fluorescent-protein localization of endogenous FUN19 and affinity-purification
    mass spectrometry to test co-purification with Rpd3/Sin3 or SAGA/ADA subunits.
  provenance:
  - reference_id: PMID:16461455
    supporting_text: the Rsc8 and Swi3 SWIRM domains are essential for the proper
      assembly and in vivo functions of their respective complexes
suggested_questions:
- question: Does the FUN19 SWIRM domain bind DNA or nucleosomes in vitro, and with
    what specificity, as its Swi3/Rsc8 counterparts do?
- question: Is FUN19 a bona fide subunit of an S. cerevisiae chromatin-modifying complex
    (e.g. a Rpd3/Sin3-type HDAC), by analogy to the fission yeast SF21 relatives laf1/laf2,
    or does it act independently?
- question: Does FUN19 act redundantly with its whole-genome-duplication paralog YOR338W,
    such that phenotypes are only revealed in the double deletant?
suggested_experiments:
- hypothesis: FUN19's SWIRM domain confers chromatin/nucleosome association.
  description: Express and purify recombinant full-length FUN19 and its isolated SWIRM
    domain and test binding to free DNA and reconstituted mononucleosomes by EMSA
    and quantitative binding assays, benchmarking against the Swi3 SWIRM domain.
  experiment_type: in vitro DNA/nucleosome binding
- hypothesis: FUN19 associates with a chromatin-modifying complex in vivo.
  description: Affinity-purify endogenously tagged FUN19 from S. cerevisiae and identify
    co-purifying proteins by mass spectrometry, specifically testing for Rpd3/Sin3-
    type HDAC or SAGA/ADA subunits, and determine subcellular localization by fluorescence
    microscopy.
  experiment_type: affinity purification-mass spectrometry and localization
- hypothesis: FUN19 and YOR338W are functionally redundant paralogs.
  description: Construct fun19, yor338w single and fun19 yor338w double deletants
    and profile growth, stress responses (including heat), and genome-wide transcription
    to reveal phenotypes masked by paralog redundancy.
  experiment_type: genetic (single/double deletion) and transcriptomic analysis
