    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Ada2-like positive coactivator activity should be generalized to sign-neutral
      transcription coregulator activity for the divergent Fun19/Laf SWIRM-only branch.
    action: MODIFY
    reason: PTN000271860 correctly captures Ada2-family coactivator biology, but the
      Fun19 lineage is a divergent SF21 branch that explicitly lost SAGA-type complex
      membership and retained only SWIRM, lacking the Ada2 ZZ/SANT architecture used
      with Gcn5/Ada3 in the SAGA HAT module. The focused report and PMID:36965704
      show that the retained SWIRM is a SAGA-HAT tether in Ada2, not an autonomous
      activation module, while the retained PTN000271931 complex context is Rpd3L-Expanded
      rather than SAGA. Together this argues that the PAINT placement over-propagates
      the activation-specific molecular function, but not the sign-neutral transcription
      coregulator parent retained at the Fun19 leaf.
