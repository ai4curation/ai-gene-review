id: P08417
gene_symbol: FUM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: FUM1 encodes the single fumarase (fumarate hydratase, EC 4.2.1.2) of Saccharomyces cerevisiae,
  a homotetrameric class II fumarase that reversibly hydrates fumarate to (S)-malate. One translation
  product is targeted to mitochondria and processed by the mitochondrial processing peptidase; about 70%
  remains in the matrix, where it catalyses the fumarate-to-malate step of the tricarboxylic acid cycle,
  and the rest folds into an import-incompetent form and returns to the cytosol. fum1 mutants are respiratory
  deficient and excrete fumarate. Upon DNA double-strand breaks, the cytosolic enzyme is recruited to
  the nucleus and promotes DNA repair in a manner that depends on its catalytic activity and can be replaced
  by high concentrations of fumarate.
