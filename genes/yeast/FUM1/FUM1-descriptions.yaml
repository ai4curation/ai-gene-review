descriptions:
- source: UniProt
  text: 'Catalyzes the reversible stereospecific interconversion of fumarate to L-malate
    (PubMed:11585823, PubMed:1587456, PubMed:20231875, PubMed:3040736). In mitochondrion,
    catalyzes the hydration of fumarate to L-malate in the tricarboxylic acid (TCA)
    cycle to facilitate a transition step in the production of energy in the form
    of NADH (PubMed:1587456, PubMed:20231875). In cytoplasm and nucleus, involved
    in DNA repair in response to DNA damage: following DNA double-strand breaks (DSBs),
    translocates from the cytosol to the nucleus and promotes DNA repair by catalyzing
    the dehydration of L-malate to fumarate (PubMed:20231875).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08417
  source_id: P08417
- source: Alliance_Imported
  text: Fumarase; converts fumaric acid to L-malic acid in the TCA cycle; cytosolic
    and mitochondrial distribution determined by the N-terminal targeting sequence,
    protein conformation, and status of glyoxylate shunt; phosphorylated in mitochondria
  source_type: curated
  url: https://www.yeastgenome.org/locus/FUM1
  source_id: SGD:S000006183
- source: Alliance_Automated
  text: Enables fumarate hydratase activity. Involved in double-strand break repair;
    fumarate metabolic process; and tricarboxylic acid cycle. Located in cytosol and
    mitochondrial matrix. Is active in nucleus. Used to study leiomyomatosis. Human
    ortholog(s) of this gene implicated in fumarase deficiency; leiomyomatosis; and
    lung non-small cell carcinoma. Orthologous to human FH (fumarate hydratase).
