- id: file:human/ABHD11/ABHD11-bioinformatics/RESULTS.md
  title: PTHR46118 (PROTEIN ABHD11) Phylogeny, Active-Site Conservation, and Coordinate Crosswalk
  findings:
  - statement: Multiple sequence alignment confirms Eat1 (P53208) preserves the 46-HGLGA-50 oxyanion motif and Ser115-Asp139-His302 catalytic triad.
    supporting_text: >-
      | `UniProtKB:P53208` | `EAT1` | *Saccharomyces cerevisiae* | `PTHR46118:SF4` | 328 (`sv=1`) | `46-HGLGA-50` | `Ser115` (`ILGHSMGGK`) | `Asp139` (`IIGIDVPPV`) | `His302` (`PNAGHWIQA`) | Active mitochondrial ethanol O-acetyltransferase / thioesterase / esterase |
suggested_questions:
- question: >-
    Which active-site cap residues in Saccharomyces cerevisiae Eat1 favor
    nucleophilic attack by ethanol over water on the Ser115 acetyl-enzyme
    intermediate relative to its paralog Imo32, and is S. cerevisiae Eat1
    processed by MPP or Oct1 inside the mitochondrial matrix like Kluyveromyces
    lactis and Wickerhamomyces anomalus Eat1?
suggested_experiments:
- hypothesis: >-
    Endogenous S. cerevisiae Eat1 resides inside the mitochondrial matrix and
    undergoes N-terminal presequence cleavage that enhances its alcohol
    O-acetyltransferase/thioesterase selectivity ratio.
  description: >-
    Perform mitoplast proteinase K protection and N-terminal LC-MS/MS
    terminomics on endogenous S. cerevisiae Eat1 from isolated mitochondria,
    and compare ethanol O-acetyltransferase vs acetyl-CoA hydrolase kinetics of
    full-length vs N-terminally processed Eat1.
  experiment_type: Submitochondrial protease-protection fractionation, N-terminomics, and steady-state enzyme kinetics
