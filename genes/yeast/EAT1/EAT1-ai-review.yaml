  label: Saccharomyces cerevisiae S288C
description: >-
  Eat1 (Ygr015c) is a 328-residue Saccharomyces cerevisiae mitochondrial
  ethanol O-acetyltransferase (EC 2.3.1.268) that evolved within the ABHD11/Imo32
  alpha/beta-hydrolase family (PTHR46118:SF4) following a Saccharomycetaceae
  gene duplication. Using a conserved 46-HGLGA-50 oxyanion loop and covalent
  Ser115-Asp139-His302 charge-relay catalytic triad, Eat1 transfers an acetyl
  group from acetyl-CoA to the hydroxyl oxygen of ethanol to synthesize the
  volatile ester ethyl acetate in mitochondria, accounting for at least half of
  endogenous ethyl acetate production in S. cerevisiae while retaining
  secondary acetyl-CoA thioesterase and ethyl acetate acetylesterase hydrolase
  side-activities when water competes as the acyl acceptor.
