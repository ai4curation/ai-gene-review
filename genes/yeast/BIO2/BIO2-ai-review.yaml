  label: Saccharomyces cerevisiae S288C
description: Bio2p is the mitochondrial biotin synthase (BioB; EC 2.8.1.6) of Saccharomyces cerevisiae, a radical
  SAM enzyme that catalyses the final step of biotin biosynthesis, inserting a sulfur atom between C6 and C9 of
  dethiobiotin to close the thiophane ring of biotin. By similarity to bacterial BioB it binds a [4Fe-4S] cluster
  that reductively cleaves S-adenosylmethionine to generate 5'-deoxyadenosyl radicals, and a [2Fe-2S] cluster that
  serves as the sulfur source; reducing equivalents come from ferredoxin. The protein carries an N-terminal
  mitochondrial transit peptide and localizes to mitochondria. Disruption of BIO2 blocks conversion of dethiobiotin
  to biotin.
