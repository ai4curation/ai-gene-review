suggested_questions:
- question: Which mitochondrial Fe-S assembly factors and ferredoxin (Yah1) reductant supply Bio2, and is Bio2 single-turnover
    in vivo like E. coli BioB?
suggested_experiments:
- description: Purify Bio2 and measure dethiobiotin-to-biotin conversion with Yah1/Arh1 as reductant; test biotin
    production in yah1 or isu-depleted strains fed dethiobiotin.
