product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Carnitine O-acetyltransferase (CAT2) is a mitochondrial and peroxisomal enzyme that catalyzes the reversible transfer of acetyl groups from acetyl-CoA to carnitine, forming acetylcarnitine. This shuttle reaction is critical for transporting activated acetyl groups across the impermeable inner mitochondrial and peroxisomal membranes. CAT2 exists as two isoforms derived from alternative initiation: the mitochondrial isoform (located at the inner mitochondrial membrane) and the peroxisomal isoform (located in the peroxisomal matrix). The enzyme plays a central role in carnitine-dependent metabolic processes and stress protection, particularly in response to oxidative stress. CAT2 is essential for fatty acid oxidation in peroxisomes and supports mitochondrial metabolism by facilitating acetyl-CoA transport. In S. cerevisiae only carnitine acetyltransferase (short-chain) activity has been described; the enzyme acts on acetyl-CoA/acetylcarnitine rather than long-chain acylcarnitines.
  Cat2p provides the dominant cellular CAT activity (~95% in oleate-grown cells, >99% in galactose-grown cells) and functions redundantly with the glyoxylate-cycle (CIT2) route, such that combined loss of both pathways abolishes growth on oleate.'
core_functions:
- molecular_function:
    id: GO:0004092
    label: carnitine O-acetyltransferase activity
  description: Primary enzymatic function. CAT2 catalyzes the reversible acetylation of carnitine using acetyl-CoA as the acetyl donor (EC 2.3.1.7). This activity is essential for the carnitine shuttle, which transfers activated acetyl groups across organellar membranes.
