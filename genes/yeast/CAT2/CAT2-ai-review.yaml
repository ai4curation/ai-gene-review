- id: PMID:38377076
  title: Proteins that carry dual targeting signals can act as tethers between peroxisomes and partner organelles.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified 2024 yeast study. Directly tests overexpressed Cat2 in the context of
      mitochondrial/peroxisomal dual targeting, but the overexpression tethering phenotype is not used
      as evidence for a new endogenous CAT2 process annotation.
  findings:
  - statement: Overexpressed Cat2 with preserved PTS1 localized across mitochondria and peroxisomes and
      was used as a candidate dual-affinity protein in a 2024 PerMit-tethering study.
    supporting_text: Whereas Cat2-RFP-HA-PTS was found to localize distributed over mitochondria and in
      peroxisomes, Pxp2-RFP-HA-PTS occurred in foci at mitochondria frequently proximal to a peroxisome
    reference_section_type: RESULTS
