    summary: >-
      Rank 2 (score 19.24), 0.55 units below the correct call. Carnitine O-palmitoyltransferase is
      the long-chain member of the family - CPT1/CPT2 in mammals - and is the committed step of long-chain
      fatty acid import into mitochondria. S. cerevisiae has no long-chain carnitine acyltransferase,
      and CAT2 is short-chain specific. Scored MORE_SPECIFIC against GOA's generic transferase activity,
      so closure would credit a wrong specificity as a refinement.
    supported_by:
