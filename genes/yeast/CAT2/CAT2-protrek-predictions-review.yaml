description: >-
  ProTrek sequence-to-text retrieval for yeast CAT2, the mitochondrial and peroxisomal carnitine O-acetyltransferase.
  A clean substrate-lottery result, and the closest analogue in this cohort to rat Slc5a1: ranks 1,
  2 and 3 are the acetyl-, palmitoyl- and octanoyl-transferase members of one enzyme family, in that
  order, separated by 0.55 and 0.91 score units. The correct one happens to be first here, which it
  was not for Slc5a1 - but nothing in the output distinguishes the right answer from the two wrong
  chain-length specificities below it, and the gene review is explicit that in S. cerevisiae only
  short-chain carnitine acetyltransferase activity has been described. The free-text channel actually
  gets this one wrong at rank 1, returning the carnitine octanoyltransferase comment (highest activity
  for C6-C10 substrates, converting the pristanic acid beta-oxidation end product) at 19.05 and the
  correct short-chain carnitine acetylase comment only at rank 2 - one of the few cases in either
  cohort where the GO channel outperforms the free-text channel. Assessment: 1 correct-not-novel,
  2 paralog incorrect. Assessment: 1 correct not novel (CNN), 2 paralog incorrect (PLI).
