descriptions:
- source: UniProt
  text: Glyceraldehyde-3-phosphate dehydrogenase (GAPDH) involved in glycolysis and
    gluconeogenesis (PubMed:2999100). Catalyzes the reaction of glyceraldehyde-3-phosphate
    to 1,3 bis-phosphoglycerate (PubMed:3905788). The contribution of the TDH1, TDH2,
    and TDH3 to the total glyceraldehyde-3-phosphate dehydrogenase activity is 10-15,
    25- 30, and 50-60%, respectively (PubMed:3905788). . As a side activity, catalyzes
    the hydration of the nicotinamide ring of NADH or NADPH at the C6 position to
    give the corresponding hydrates, NADHX and NADPHX, which exist as R and S epimers,
    that cannot act as electron donors or acceptors and inhibit several dehydrogenases,
    making them toxic.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00358
  source_id: P00358
- source: Alliance_Imported
  text: Glyceraldehyde-3-phosphate dehydrogenase (GAPDH), isozyme 2; involved in glycolysis
    and gluconeogenesis; tetramer that catalyzes reaction of glyceraldehyde-3-phosphate
    to 1,3 bis-phosphoglycerate; detected in cytoplasm and cell wall; protein abundance
    increases in response to DNA replication stress; GAPDH-derived antimicrobial peptides
    are active against a wide variety of wine-related yeasts and bateria; TDH2 has
    a paralog, TDH3, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TDH2
  source_id: SGD:S000003769
- source: Alliance_Automated
  text: Enables glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating)
    activity; melatonin binding activity; and promoter-specific chromatin binding
    activity. Involved in several processes, including gluconeogenesis; glycolytic
    process; and reactive oxygen species metabolic process. Located in several cellular
    components, including fungal-type cell wall; lipid droplet; and mitochondrion.
    Human ortholog(s) of this gene implicated in Alzheimer's disease. Orthologous
    to several human genes including GAPDH (glyceraldehyde-3-phosphate dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TDH2
  source_id: SGD:S000003769
