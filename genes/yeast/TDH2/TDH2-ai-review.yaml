suggested_questions:
- question: Is the Tdh2 chromatin association detected by HyCCAPP/ChIP at glycolytic and GAL promoters specific, or a consequence
    of very high protein abundance?
suggested_experiments:
- description: ChIP of Tdh2 at GAL1/ENO2 promoters normalised to a highly expressed non-DNA-binding cytosolic control protein,
    with catalytic-site and surface mutants, to test whether chromatin association is specific.
