core_functions:
- description: NAD+-dependent phosphorylating glyceraldehyde-3-phosphate dehydrogenase catalysing the reversible conversion
    of D-glyceraldehyde 3-phosphate + Pi + NAD+ to 1,3-bisphosphoglycerate + NADH in the cytosol, operating in the glycolytic
    direction on glucose and the gluconeogenic direction on non-fermentable carbon sources.
