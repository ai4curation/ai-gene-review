gene_symbol: TDH2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Glyceraldehyde-3-phosphate dehydrogenase 2 (Tdh2, YJR009C) is one of three paralogous NAD+-dependent phosphorylating
  glyceraldehyde-3-phosphate dehydrogenases (GAPDH, EC 1.2.1.12; TDH1, TDH2, TDH3) of Saccharomyces cerevisiae. These homotetrameric
  enzymes catalyse the reversible oxidative phosphorylation of D-glyceraldehyde 3-phosphate to 1,3-bisphosphoglycerate with
  reduction of NAD+ to NADH, the sixth step of glycolysis and an obligatory step of gluconeogenesis. Tdh2 contributes about
  25-30% of cellular GAPDH activity in growing cells on both glucose and ethanol, forms catalytically active homotetramers
  with higher apparent Vmax than Tdh3, and overlaps functionally with Tdh3 as a major glycolytic isoform. It is predominantly
  cytosolic, with additional pools in the cell wall and, in high-throughput studies, the nucleus, mitochondria and lipid particles.
  GAPDH S-nitrosation has been linked to oxidative stress-induced cell death in yeast.
