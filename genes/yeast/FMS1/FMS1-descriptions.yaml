descriptions:
- source: UniProt
  text: Involved in the production of beta-alanine, a precursor of pantothenic acid.
    Multicopy suppressor of fenpropimorph resistance.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50264
  source_id: P50264
- source: Alliance_Imported
  text: Polyamine oxidase; converts spermine to spermidine, which is required for
    the essential hypusination modification of translation factor eIF-5A; also involved
    in pantothenic acid biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/FMS1
  source_id: SGD:S000004622
- source: Alliance_Automated
  text: Enables polyamine oxidase activity. Involved in pantothenate biosynthetic
    process and spermine catabolic process. Located in cytoplasm. Human ortholog(s)
    of this gene implicated in several diseases, including ACTH-independent macronodular
    adrenal hyperplasia; Brunner Syndrome; alcohol use disorder; autism spectrum disorder;
    and panic disorder. Orthologous to several human genes including PAOX (polyamine
    oxidase) and SMOX (spermine oxidase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FMS1
  source_id: SGD:S000004622
