taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'FMS1 (YMR020W) encodes a cytoplasmic FAD-dependent polyamine oxidase of the flavin monoamine
  oxidase family. Fms1 binds one FAD per subunit and oxidatively cleaves spermine to spermidine plus 3-aminopropanal;
  it also oxidizes N1-acetylspermine and N1-acetylspermidine with similar efficiency, and N8-acetylspermidine
  poorly, but not spermidine. The 3-aminopropanal it releases is oxidized by Ald2/Ald3 to beta-alanine,
  which in S. cerevisiae is the sole endogenous source of beta-alanine for pantothenate and coenzyme A
  synthesis: fms1 deletion mutants require beta-alanine or pantothenate, and FMS1 overexpression causes
  pantothenate excretion, making Fms1 rate-limiting for this route. Fms1 is also the only route by which
  yeast converts spermine back to spermidine, which is needed for hypusine modification of eIF5A when
  spermidine synthesis is blocked. FMS1 was originally isolated as a multicopy suppressor of fenpropimorph
  sensitivity.'
