core_functions:
- description: FAD-dependent oxidative cleavage of spermine to spermidine and 3-aminopropanal in the cytosol;
    the 3-aminopropanal is converted by Ald2/Ald3 to beta-alanine, the sole endogenous beta-alanine source
    for pantothenate/CoA synthesis in yeast. Fms1 is rate-limiting for this route.
  molecular_function:
