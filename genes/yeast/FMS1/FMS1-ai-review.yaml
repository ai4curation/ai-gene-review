suggested_questions:
- question: Does Fms1 act on N1-acetylspermine/N1-acetylspermidine in vivo (i.e. is there a yeast spermidine/spermine
    N1-acetyltransferase feeding it), or is free spermine the physiological substrate?
- question: How does Fms1 overexpression confer fenpropimorph resistance - via increased pantothenate/CoA
    supply to sterol synthesis, or via polyamine/H2O2 effects?
suggested_experiments:
- description: Metabolite profiling (spermine, spermidine, N1-acetylpolyamines, beta-alanine, pantothenate)
    in fms1 deletion and overexpression strains to determine the in vivo substrate preference and flux.
