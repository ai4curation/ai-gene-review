  review:
    summary: IBA from PANTHER PTN000463822 (ENOPH1 clade) for L-methionine cycle.
    action: MODIFY
    reason: GO:0033353 'L-methionine cycle' is now defined as the SAM/SAH/homocysteine (activated methyl)
      cycle. Utr4 acts in the separate 5'-methylthioadenosine salvage (Yang) cycle, whose GO term is GO:0071267
      L-methionine salvage; the former term GO:0019509 'L-methionine salvage from methylthioadenosine'
      is obsolete, so these rows appear to be legacy migrations. The node placement itself is sound; the
      issue is term scope.
    proposed_replacement_terms:
    - &id002
      id: GO:0071267
      label: L-methionine salvage
    supported_by:
    - &id003
      reference_id: PMID:18625006
      supporting_text: 'The methionine salvage pathway is universally used to regenerate methionine from

        5''-methylthioadenosine'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: SGD:S000000764
