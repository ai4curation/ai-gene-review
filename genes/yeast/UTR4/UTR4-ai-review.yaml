  label: Saccharomyces cerevisiae S288C
description: UTR4 (YEL038W) encodes enolase-phosphatase E1, a Mg2+-dependent HAD-superfamily enzyme of
  the MasA/MtnC family that converts 2,3-diketo-5-methylthiopentyl-1-phosphate to the acireductone 1,2-dihydroxy-3-keto-5-methylthiopentene
  by sequential enolization and dephosphorylation (EC 3.1.3.77). This is steps 3-4 of the methionine salvage
  pathway, which regenerates methionine from 5'-methylthioadenosine produced by polyamine synthesis; the
  acireductone is then oxidised by the dioxygenase Adi1. Genetic analysis identified Utr4 as the enolase-phosphatase
  of the yeast salvage cycle, whereas its homolog YNL010W is not involved. Utr4 is a soluble monomeric
  protein found in the cytoplasm and nucleus.
