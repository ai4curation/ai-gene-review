suggested_questions:
- question: Should the legacy GO:0033353 (L-methionine cycle) annotations on MTA-salvage enzymes (Utr4,
    Adi1, Mde1, Mri1) be migrated to GO:0071267 L-methionine salvage now that GO:0033353 is defined as
    the SAM/SAH cycle?
- question: Does the nuclear pool of Utr4 seen by GFP have any function, or is it diffusion of a small
    soluble enzyme?
suggested_experiments:
- description: Purify recombinant Utr4 and measure enolase and phosphatase half-reactions with DK-MTP-1-P
    to confirm it does not release the HK-MTPenyl-1-P intermediate.
