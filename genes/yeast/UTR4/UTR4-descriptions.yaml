descriptions:
- source: UniProt
  text: Bifunctional enzyme that catalyzes the enolization of 2,3- diketo-5-methylthiopentyl-1-phosphate
    (DK-MTP-1-P) into the intermediate 2-hydroxy-3-keto-5-methylthiopentenyl-1-phosphate
    (HK- MTPenyl-1-P), which is then dephosphorylated to form the acireductone 1,2-dihydroxy-3-keto-5-methylthiopentene
    (DHK-MTPene).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32626
  source_id: P32626
- source: Alliance_Imported
  text: Protein with sequence similarity to acireductone synthases; involved in methionine
    salvage; found in both the cytoplasm and nucleus
  source_type: curated
  url: https://www.yeastgenome.org/locus/UTR4
  source_id: SGD:S000000764
- source: Alliance_Automated
  text: Predicted to enable acireductone synthase activity. Involved in L-methionine
    cycle. Located in cytoplasm and nucleus. Orthologous to human ENOPH1 (enolase-phosphatase
    1).
  source_type: automated
