    label: protein folding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'Protein folding (oxidative folding of secretory clients) is a core biological

      process for Pdi1p. Oxidizing equivalents flow Ero1p->Pdi1p->substrate, and a

      principal experimental client is carboxypeptidase Y (CPY), whose maturation

      requires Pdi1p disulfide formation and isomerization.'
    action: ACCEPT
    reason: >-
      The PAINT propagation matches the conserved role of PDI-family oxidoreductases
      in oxidative protein folding. Yeast evidence directly supports PDI1 as the
      essential ER protein disulfide isomerase that introduces and rearranges client
      disulfides, including during CPY maturation.
    supported_by:
