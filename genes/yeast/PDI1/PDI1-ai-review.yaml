suggested_questions:
- question: >-
    What direct evidence, if any, did ComplexPortal use to annotate Pdi1p to
    positive regulation of the endoplasmic reticulum unfolded protein response from
    PMID:21700223, and should that source row instead be limited to the
    Htm1/Mnl1-Pdi1 glycoprotein-ERAD functions that are visible from the abstract?
- question: >-
    Does the Pdi1p chaperone activity reported by PMID:16002399 warrant annotation
    to a current holdase or client-binding molecular-function term, or is it only
    an assay-level readout of its catalytic thiol-disulfide exchange cycle?
suggested_experiments:
- hypothesis: >-
    Pdi1p has a separable holdase/client-binding activity in addition to its
    catalytic protein disulfide isomerase and ERAD reductase activities.
  description: >-
    Purify wild-type Pdi1p and active-site, client-binding-surface, and Htm1/Mnl1
    complex-formation mutants; compare their ability to prevent aggregation of
    reduced and nonreduced ER client proteins in vitro and test whether any holdase
    defect separates genetically from disulfide isomerization and Htm1-dependent
    glycan trimming in yeast.
  experiment_type: in vitro holdase assay with separation-of-function mutants
