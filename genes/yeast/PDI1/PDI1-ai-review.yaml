core_functions:
- description: Pdi1p catalyzes thiol-disulfide exchange in the ER lumen to oxidize
    and isomerize disulfide bonds in nascent secretory and cell-surface proteins;
    Ero1p preferentially reoxidizes the Pdi1p a-domain to maintain this oxidative
    folding relay.
