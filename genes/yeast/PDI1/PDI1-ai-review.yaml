- id: PMID:39930008
  title: Initiation of ERAD by the bifunctional complex of Mnl1/Htm1 mannosidase and
    protein disulfide isomerase.
  findings:
  - statement: The Mnl1-Pdi1 complex first trims misfolded, globular glycoproteins
      via Mnl1 and then uses the Pdi1 component to reduce their disulfides, while
      Mnl1 blocks Pdi1's canonical oxidative folding activity so that Pdi1 acts as
      an ERAD reductase.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
    supporting_text: The Mnl1-Pdi1 complex first demannosylates misfolded, globular
      proteins that are recognized through the C-terminal domain (CTD) of Mnl1; Pdi1
      causes the CTD to ignore completely unfolded polypeptides.
  - statement: Pdi1 is the reductase component of the yeast Mnl1-Pdi1 complex that
      reduces disulfides in misfolded glycoproteins before ERAD retrotranslocation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
    supporting_text: The disulfides of these globular proteins are then reduced by
      the Pdi1 component of the complex. Mnl1 blocks the canonical oxidative function
      of Pdi1, allowing it to function as a disulfide reductase in ERAD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified final 2025 Nat Struct Mol Biol article superseding
      the 2024 bioRxiv preprint PMID:39464000; it directly establishes how the Mnl1/Htm1-Pdi1
      complex initiates yeast glycoprotein ERAD.
