  label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for yeast PDI1, the essential ER protein disulfide isomerase.
  This gene's AIGR review has an empty core_functions list, so the assessment here is made against
  GOA alone. Rank 1 is the right enzyme activity and an exact GOA match, but at 15.75 it is one of
  the lower rank-1 scores in the yeast batch and the entire top five spans 0.61 score units - a flat
  ranking that gives no basis for preferring the correct call over the ones below it. Rank 4 is the
  informative failure: the Tapasin-ERp57 complex is the mammalian MHC class I peptide-loading complex,
  and it follows directly from PANTHER's assignment of Pdi1p to the PDIA3/ERp57 subfamily, which is
  visible in the gene's own UniProt cross-references. Yeast has no MHC and no tapasin. The free-text
  channel does not identify the protein either: its top hits are comments for Ero1, the oxidase that
  reoxidizes Pdi1 (and which names pdi1 in its own text), and for a PDI paralog whose isomerase activity
  the comment describes as very low. Assessment: 2 correct-not-novel, 1 correct novel. Assessment:
  1 correct novel (COR), 2 correct not novel (CNN).
