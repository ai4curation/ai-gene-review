- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:1939179
  qualifier: enables
  review:
    summary: Metal analysis of purified yeast arginase identified a tightly bound structural Zn2+ that
      stabilises the trimer (removal lowers thermal stability). Real, but a structural cofactor rather
      than the catalytic function.
    action: ACCEPT
    reason: Binding of the structural zinc site stabilizes the native arginase fold and oligomer. Structural
      cofactor binding is a core biochemical property, not peripheral merely because it is distinct from
      catalysis. PMID:1939179 directly measured the metal and stability effects; the proteome survey is
      corroborative.
    supported_by:
    - reference_id: PMID:1939179
      supporting_text: Both the loosely associated catalytic Mn2+ ion and the more tightly associated
        structural Zn2+ ion confer stability to the enzyme.
