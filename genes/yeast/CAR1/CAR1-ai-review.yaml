  review:
    summary: Arginase executes the arginine-to-ornithine-and-urea reaction shared by catabolism and the
      urea-cycle topology.
    action: KEEP_AS_NON_CORE
    reason: GO:0000050 defines ornithine-to-arginine synthesis followed by arginine hydrolysis to urea
      and regenerated ornithine; it does not require ureotelic excretion. These yeasts possess the relevant
      OTC/ASS/ASL and arginase reactions. Retain the existing annotation as contextual participation in
      that network, distinct from the principal nitrogen-source catabolic role. This does not assert a
      measured net steady-state cycle flux or simultaneous maximal operation of anabolic and catabolic
      enzymes. The substrate-triggered CAR1-ARG3 inhibitory complex (PMID:12679340) constrains simultaneous
      cycling; it does not eliminate the inherited reaction or redefine the GO term.
    supported_by:
    - reference_id: PMID:12679340
      supporting_text: In the presence of ornithine and arginine, ornithine carbamoyltransferase (OTCase)
        and arginase form a one-to-one enzyme complex in which the activity of OTCase is inhibited whereas
        arginase remains catalytically active
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000144386
        source_status: SUPPORTS_TRANSFER
        comment: The node-level inherited urea-cycle reaction is compatible with native fungal reaction
          topology. Neither donor taxonomy nor absence of ureotelic excretion establishes a phylogenetic
          failure.
