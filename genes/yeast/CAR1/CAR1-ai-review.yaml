  review:
    summary: Urea cycle IBA from PAINT node PTN000144386, whose urea-cycle seeds are ureotelic animal
      arginases (e.g. RGD:2150 Arg1). Yeast arginase hydrolyses arginine as the entry step of arginine
      catabolism for nitrogen use, not as part of a ureotelic cycle that regenerates ornithine for nitrogen
      excretion; in fact the epiarginase complex blocks OTCase when arginase is active, which is the opposite
      of cycling.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0006527
      label: L-arginine catabolic process
    reason: Reaction-level overlap with the urea cycle, but S. cerevisiae does not operate a urea cycle;
      the L-arginine catabolic process term captures the role (consistent with the ARG1 review of the
      same node).
    supported_by:
    - reference_id: PMID:12679340
      supporting_text: In the presence of ornithine and arginine, ornithine carbamoyltransferase (OTCase)
        and arginase form a one-to-one enzyme complex in which the activity of OTCase is inhibited whereas
        arginase remains catalytically active
