id: P00812
gene_symbol: CAR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Arginase (L-arginine amidinohydrolase, EC 3.5.3.1) of Saccharomyces cerevisiae. This cytosolic
  homotrimeric metalloenzyme hydrolyses L-arginine to L-ornithine and urea, the first step of arginine
  catabolism that allows yeast to use arginine as a nitrogen source; ornithine is then transaminated
  by ornithine aminotransferase (CAR2) and urea is degraded by urea amidolyase. Biochemical analysis
  of purified enzyme identified a weakly bound catalytic Mn2+ site and a tighter site occupied
  predominantly by Zn2+ that stabilizes the trimer; occasional preparations contained Mn2+ at the
  tighter site. CAR1 expression is induced by arginine and subject to nitrogen catabolite repression.
  In the presence of ornithine and arginine, arginase also binds ornithine carbamoyltransferase (ARG3)
  in a one-to-one "epiarginase" complex in which arginase remains active but inhibits OTCase,
  preventing futile cycling between arginine biosynthesis and degradation; two C-terminal cysteines
  are required for this regulatory function but not for catalysis. Because arginase is the source of
  urea, which reacts with ethanol to form the carcinogen ethyl carbamate, homozygous CAR1 deletion
  lowers urea and ethyl carbamate in rice wine fermentation; arginase-deficient baker's yeast
  accumulates arginine and glutamate and shows improved freeze tolerance in frozen dough.
