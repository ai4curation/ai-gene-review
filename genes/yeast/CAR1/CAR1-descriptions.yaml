taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the hydrolysis of L-arginine into urea and L- ornithine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P00812
  source_id: P00812
- source: Alliance_Imported
  text: Arginase, catabolizes arginine to ornithine and urea; expression responds
    to both induction by arginine and nitrogen catabolite repression; disruption decreases
    production of carcinogen ethyl carbamate during wine fermentation and also enhances
    freeze tolerance
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAR1
  source_id: SGD:S000006032
- source: Alliance_Automated
  text: Enables arginase activity; ornithine carbamoyltransferase inhibitor activity;
    and transition metal ion binding activity. Involved in urea cycle. Located in
    cytosol. Part of ornithine carbamoyltransferase inhibitor complex. Human ortholog(s)
    of this gene implicated in allergic disease; asthma; hepatocellular carcinoma;
    and hyperargininemia. Orthologous to human ARG1 (arginase 1) and ARG2 (arginase
    2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAR1
  source_id: SGD:S000006032
