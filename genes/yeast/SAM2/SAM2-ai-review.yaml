taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: S-adenosylmethionine synthase 2 (Sam2p, methionine adenosyltransferase, EC 2.5.1.6) catalyses
  the ATP-dependent conversion of L-methionine to S-adenosyl-L-methionine (SAM), the universal methyl
  donor and precursor of polyamines, with release of phosphate and diphosphate. It is one of two highly
  similar cytosolic AdoMet synthases in S. cerevisiae (with Sam1p); the paralogs are functionally redundant,
  a sam1 sam2 double mutant being unable to make SAM, and they form hetero-oligomers. SAM2 was originally
  identified as ETH2 through ethionine-resistant regulatory mutants. Sam1p and Sam2p are also subunits
  of the SESAME metabolic enzyme complex with pyruvate kinase Pyk1, which supplies SAM to the Set1 H3K4
  methyltransferase and links metabolism to histone modification.
