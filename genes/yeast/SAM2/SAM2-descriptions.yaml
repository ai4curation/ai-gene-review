gene_symbol: SAM2
organism: yeast
uniprot_id: P19358
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: 'Catalyzes the formation of S-adenosylmethionine from methionine and ATP.
    The reaction comprises two steps that are both catalyzed by the same enzyme: formation
    of S-adenosylmethionine (AdoMet) and triphosphate, and subsequent hydrolysis of
    the triphosphate.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P19358
  source_id: P19358
- source: Alliance_Imported
  text: S-adenosylmethionine synthetase; catalyzes transfer of the adenosyl group
    of ATP to the sulfur atom of methionine; comparative analysis suggests that a
    mitochondrially targeted form may result from translation starting at a non-canonical
    codon upstream of the annotated start codon
  source_type: curated
  url: https://www.yeastgenome.org/locus/SAM2
  source_id: SGD:S000002910
- source: Alliance_Automated
  text: Enables methionine adenosyltransferase activity. Involved in L-methionine
    catabolic process and S-adenosylmethionine biosynthetic process. Located in cytoplasmic
    stress granule. Human ortholog(s) of this gene implicated in hypermethioninemia
    and lung cancer. Orthologous to several human genes including MAT1A (methionine
    adenosyltransferase 1A).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SAM2
  source_id: SGD:S000002910
