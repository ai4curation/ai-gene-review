suggested_questions:
- question: Given the low substrate specificity of the post-zymosterol enzymes, does Erg2 act in vivo on zymosterol
    as well as fecosterol when Erg6 is absent?
- question: Does Erg2 share any ligand-binding or chaperone-like property with its mammalian homolog SIGMAR1 beyond
    isomerase activity?
