- term:
    id: GO:0000247
    label: C-8 sterol isomerase activity
  evidence_type: IMP
  original_reference_id: PMID:18459942
  qualifier: enables
  review:
    summary: >-
      Yeast erg2 mutant experiments in a plant 8,7 sterol isomerase study
      support the native ERG2 activity.
    action: ACCEPT
    reason: >-
      Rahier et al. used a S. cerevisiae erg2 mutant lacking 8,7 sterol
      isomerase activity as the complementation background for the maize
      enzyme, and constructed corresponding S. cerevisiae 8,7SI mutants that
      were assayed by sterol analysis. This directly depends on the assignment
      of native ERG2 as the yeast C-8 sterol isomerase.
    supported_by:
    - reference_id: PMID:18459942
      supporting_text: yeast erg2 mutant lacking 8,7SI activity
    - reference_id: PMID:18459942
      supporting_text: Saccharomyces cerevisiae 8,7SI
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16300994
  qualifier: enables
  supporting_entities:
  - UniProtKB:P32462
  review:
    summary: >-
      Split-ubiquitin assays support an Erg2p-Erg24p interaction, but the bare
      protein-binding term should be removed as uninformative for ERG2.
    action: REMOVE
    reason: >-
      Mo and Bard reported that Erg2p and Erg24p appear to interact in an ER
      sterol-enzyme network, so removing this row is not a claim that the
      interaction is false. Rather, GO:0005515 conveys only a generic physical
      association rather than Erg2p's C-8 sterol isomerase function, and the
      evidence does not support a more specific Erg2p molecular activity.
    supported_by:
    - reference_id: PMID:16300994
      supporting_text: >-
        Erg24p and Erg2p, two enzymes that are sensitive to morpholine
        antifungals, appear to interact with one another
    - reference_id: file:yeast/ERG2/ERG2-uniprot.txt
      supporting_text: 'P32352; P32462: ERG24; NbExp=3'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:37968396
  qualifier: enables
  supporting_entities:
  - UniProtKB:P32462
  review:
    summary: >-
      The recent affinity-enrichment interaction row corroborates the
      Erg2p-Erg24p association, but GO:0005515 should be removed as
      uninformative for ERG2.
    action: REMOVE
    reason: >-
      Michaelis et al. generated a high-throughput GFP affinity-enrichment mass
      spectrometry yeast interactome that SGD uses for an Erg2p-Erg24p IPI.
      This supports a physical association in the sterol-enzyme network, so
      removing this row is not a claim that the interaction is false. The
      evidence does not support a distinct catalytic, adaptor, or regulatory
      molecular activity for Erg2p.
    supported_by:
