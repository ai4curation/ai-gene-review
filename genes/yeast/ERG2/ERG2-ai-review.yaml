id: P32352
gene_symbol: ERG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG2 (YMR202W) encodes C-8 sterol isomerase (Delta8-Delta7 sterol isomerase), which moves the B-ring
  double bond of fecosterol from C8-C9 to C7-C8 to form episterol, the step between Erg6 (C-24 methylation) and
  Erg3 (C-5 desaturation) in the post-zymosterol part of ergosterol synthesis. Erg2 is a single-pass ER membrane
  protein of the ERG2/sigma-1 receptor family; it is unrelated in sequence to the EBP-type 8,7-isomerase of animals,
  so the same reaction is carried out by non-homologous proteins in fungi and mammals. Erg2 is inhibited by morpholine
  and piperidine fungicides and by sigma ligands such as SR31747A; its expression rises under sterol depletion and
  anaerobiosis. Disruption abolishes ergosterol production.
