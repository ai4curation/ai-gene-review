  evidence_type: IDA
  original_reference_id: DOI:10.1016/S0031-9422(00)80523-3
  qualifier: enables
  review:
    summary: >-
      Direct legacy biochemical evidence supports Erg2p C-8 sterol isomerase
      activity.
    action: ACCEPT
    reason: >-
      The 1984 Baloch et al. DOI resolves to an inhibitor study of ergosterol
      biosynthesis in S. cerevisiae and Ustilago maydis and is used by UniProt
      as direct evidence for the fecosterol-to-episterol ERG2 reaction. The
      assignment is independently corroborated by direct ERG2 inhibitor-binding
      experiments and by Rhea.
    supported_by:
    - reference_id: file:yeast/ERG2/ERG2-uniprot.txt
      supporting_text: Reaction=fecosterol = episterol; Xref=Rhea:RHEA:33435
    - reference_id: PMID:8988026
      supporting_text: The yeast gene ERG2 encodes a sterol C8-C7 isomerase
