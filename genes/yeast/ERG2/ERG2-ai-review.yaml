id: P32352
gene_symbol: ERG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  ERG2 encodes the S. cerevisiae endoplasmic-reticulum membrane C-8 sterol
  isomerase, which moves the B-ring double bond of fecosterol from C8-C9 to
  C7-C8 to form episterol in the late ergosterol biosynthetic pathway. Erg2p is
  a single-pass ER membrane protein of the fungal ERG2/sigma-1 receptor family,
  physically associates with the sterol C-14 reductase Erg24p, and is inhibited
  by morpholine and piperidine fungicides and by sigma ligands.
