core_functions:
- description: Cytosolic PLP-dependent GABA:2-oxoglutarate aminotransferase (EC 2.6.1.19) converting GABA
    to succinate semialdehyde with glutamate regeneration; middle step of the GABA shunt and required
    for GABA use as nitrogen source. Specific for GABA (no beta-alanine activity).
