  label: Saccharomyces cerevisiae S288C
description: 4-aminobutyrate:2-oxoglutarate aminotransferase (GABA transaminase, Uga1p, YGR019W), a class-III
  pyridoxal 5'-phosphate-dependent aminotransferase that transfers the amino group of GABA to 2-oxoglutarate,
  yielding succinate semialdehyde and L-glutamate (EC 2.6.1.19). Unlike plant GABA-Ts it uses 2-oxoglutarate
  rather than pyruvate/glyoxylate as acceptor, and unlike the mammalian enzyme and the S. kluyveri Pyd4
  paralog it does not transaminate beta-alanine. Uga1p lacks a mitochondrial presequence and acts in the
  cytosol, where it forms the middle step of the GABA shunt (Gad1 -> Uga1 -> Uga2). It is required for
  use of GABA as a nitrogen source and is induced by GABA and subject to nitrogen catabolite repression;
  loss of Uga1 also causes thermosensitivity and heat-induced ROS accumulation.
