gene_symbol: UGA1
organism: yeast
uniprot_id: P17649
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for the degradation of gamma-aminobutyric acid (GABA), which is important
    for utilization of GABA as nitrogen source and for oxidative stress tolerance.
    Deaminates GABA to succinate semialdehyde, which in turn is converted to succinate
    by the succinate- semialdehyde dehydrogenase UGA2. Cannot transaminate beta-alanine
    (BAL).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P17649
  source_id: P17649
- source: Alliance_Imported
  text: Gamma-aminobutyrate (GABA) transaminase; also known as 4-aminobutyrate aminotransferase;
    involved in the 4-aminobutyrate and glutamate degradation pathways; required for
    normal oxidative stress tolerance and nitrogen utilization; protein abundance
    increases in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/UGA1
  source_id: SGD:S000003251
- source: Alliance_Automated
  text: Enables 4-aminobutyrate:2-oxoglutarate transaminase activity. Involved in
    GABA shunt. Located in cytosol. Human ortholog(s) of this gene implicated in Alzheimer's
    disease; GABA aminotransferase deficiency; and Huntington's disease. Orthologous
    to human ABAT (4-aminobutyrate aminotransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/UGA1
  source_id: SGD:S000003251
fetch_date: '2026-11-01'
