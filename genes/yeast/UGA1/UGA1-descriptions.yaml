descriptions:
- source: UniProt
  text: Required for the degradation of gamma-aminobutyric acid (GABA), which is important
    for utilization of GABA as nitrogen source and for oxidative stress tolerance.
    Deaminates GABA to succinate semialdehyde, which in turn is converted to succinate
    by the succinate- semialdehyde dehydrogenase UGA2. Cannot transaminate beta-alanine
    (BAL).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P17649
