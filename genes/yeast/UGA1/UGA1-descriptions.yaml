- source: Alliance_Imported
  text: Gamma-aminobutyrate (GABA) transaminase; also known as 4-aminobutyrate aminotransferase;
    involved in the 4-aminobutyrate and glutamate degradation pathways; required for
    normal oxidative stress tolerance and nitrogen utilization; protein abundance
    increases in response to DNA replication stress
