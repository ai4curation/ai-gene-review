core_functions:
- description: Redundant (with Ssk2) Ssk1-activated MAP3K of the Sln1 branch of the HOG pathway that phosphorylates
    and activates the MAPKK Pbs2, initiating the Hog1 (p38-type) MAPK cascade in response to hyperosmotic
    stress.
