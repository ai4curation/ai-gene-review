  review:
    summary: Ssk22 is activated by the Ssk1 response regulator of the Sln1-Ypd1-Ssk1 phosphorelay; unlike
      Ssk2 it has no Ssk1-independent activation route.
    action: NEW
    reason: 'Ssk22 performs the MAP3K step of the Sln1 phosphorelay osmosensory pathway: unphosphorylated
      Ssk1 binds its N-terminal regulatory domain and activates it, and Hog1 activation via Ssk22 in ste11
      ssk2 backgrounds strictly requires Ssk1. Comparator check: the paralog Ssk2, in the identical role,
      carries GO:0007234 by SGD IGI/IPI (PMID:9482735), whereas downstream Pbs2 and Hog1 do not, so the
      convention is that the phosphorelay components plus the directly coupled MAP3Ks carry the term.
      The term is neither ancestor nor descendant of GO:0038066.'
    additional_reference_ids:
