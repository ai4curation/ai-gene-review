  review:
    summary: HTP AP-MS (Ho et al. 2002) detected the Ssk22-Ssk1 interaction.
    action: REMOVE
    reason: Bare protein binding is uninformative. Ssk1 is the phosphorelay response regulator whose unphosphorylated
      form binds the N-terminal regulatory domain of Ssk2/Ssk22 and activates the kinase; the interaction
      is genuine and repeatedly detected, but GO has no informative MF for binding an upstream activator,
      and its functional content is captured by the MAP kinase kinase kinase activity annotations and
