suggested_questions:
- question: Does Ssk22 have any function not shared with Ssk2, and why is it retained given its low abundance
    and weaker contribution to salt tolerance?
- question: Does purified, Ssk1-activated Ssk22 phosphorylate Pbs2 on both Ser514 and Thr518 as the Ssk2/Ssk22
    pair does?
suggested_experiments:
- description: In vitro kinase assay of immunopurified Ssk22 (wild type vs kinase-dead) on kinase-dead
    Pbs2 with Ser514/Thr518 phospho-specific detection, to convert the ISS MAP3K annotation to direct
    evidence.
- description: Endogenously tagged Ssk22-GFP imaging before and after osmotic shock to establish its subcellular
    localization.
