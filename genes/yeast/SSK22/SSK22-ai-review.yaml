taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Ssk22 (YCR073C) is a STE-family serine/threonine MAP kinase kinase kinase (MAP3K) of Saccharomyces
  cerevisiae and the paralog of Ssk2, with which it forms the functionally redundant MAP3K tier of the
  Sln1 branch of the high-osmolarity glycerol (HOG) pathway. Under hyperosmotic stress, unphosphorylated
  Ssk1 released from the Sln1-Ypd1 phosphorelay binds the N-terminal regulatory region of Ssk22 and activates
  its C-terminal kinase domain; Ssk22 then phosphorylates and activates the MAPKK Pbs2, whose N-terminal
  docking site binds the Ssk22 kinase domain, leading to activation of the p38-type MAPK Hog1. Ssk22 is
  a low-abundance protein, is strictly Ssk1-dependent (lacking the Ssk1-independent activation segment
  of Ssk2), and contributes less than Ssk2 to salt tolerance; it does not share the actin-binding and
  actin-recovery functions of Ssk2. No Ssk22-specific function or subcellular localization has been experimentally
  established.
