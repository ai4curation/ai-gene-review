- source: Alliance_Imported
  text: MAP kinase kinase kinase of HOG1 mitogen-activated signaling pathway; functionally
    redundant with Ssk2p; interacts with and is activated by Ssk1p; phosphorylates
    Pbs2p; SSK22 has a paralog, SSK2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SSK22
  source_id: SGD:S000000669
- source: Alliance_Automated
  text: Enables protein kinase activity. Involved in p38MAPK cascade. Predicted to
