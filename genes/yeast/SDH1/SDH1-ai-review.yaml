id: Q00711
gene_symbol: SDH1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Flavoprotein subunit (Sdh1p, YKL148C; SDHA homolog) of mitochondrial succinate dehydrogenase (complex
  II, succinate:ubiquinone oxidoreductase, EC 1.3.5.1). Sdh1 carries a covalently bound FAD and the dicarboxylate
  site at which succinate is oxidised to fumarate in the TCA cycle; electrons pass from FAD through the iron-sulfur
  clusters of Sdh2 to ubiquinone bound by the membrane anchor Sdh3/Sdh4 (with heme b562), linking the TCA cycle
  to the respiratory chain. Sdh1 is a peripheral subunit on the matrix face of the inner membrane. Its flavination
  needs the assembly factor Sdh5, the chaperone Sdh8 keeps flavinated Sdh1 competent to bind Sdh2, and Tcm62 assists
  complex assembly. Loss of Sdh1 abolishes SDH activity and respiratory growth; the weakly expressed paralog SDH1b
  (YJL045W) can partially substitute.
