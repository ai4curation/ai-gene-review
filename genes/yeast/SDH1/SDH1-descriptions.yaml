descriptions:
- source: UniProt
  text: Catalytic subunit of succinate dehydrogenase (SDH) that is involved in complex
    II of the mitochondrial electron transport chain and is responsible for transferring
    electrons from succinate to ubiquinone (coenzyme Q). SDH1 and SDH2 form the catalytic
    dimer. Electrons flow from succinate to the FAD bound to SDH1, and sequentially
    through the iron-sulfur clusters bound to SDH2 and enter the membrane dimer formed
    by SDH3 and SDH4.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q00711
