- source: Alliance_Imported
  text: Flavoprotein subunit of succinate dehydrogenase; couples the oxidation of
    succinate to the transfer of electrons to ubiquinone as part of the TCA cycle
    and the mitochondrial respiratory chain; FAD binding to Sdh1p is required for
    the assembly of the succinate dehydrogenase subunits; mutations in human ortholog
    SDHA are associated with Leigh syndrome and predisposition to several cancers
  source_type: curated
