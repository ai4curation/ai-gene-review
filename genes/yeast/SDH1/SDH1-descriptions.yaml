- source: Alliance_Automated
  text: Enables flavin adenine dinucleotide binding activity and succinate dehydrogenase
    (quinone) activity. Involved in mitochondrial electron transport, succinate to
    ubiquinone and tricarboxylic acid cycle. Located in mitochondrial inner membrane.
    Part of respiratory chain complex II (succinate dehydrogenase). Used to study
    several diseases, including Leigh disease; endocrine organ benign neoplasm (multiple);
    gastrointestinal stromal tumor; leukodystrophy; and mitochondrial complex II deficiency.
    Human ortholog(s) of this gene implicated in several diseases, including Leigh
    disease; dilated cardiomyopathy 1GG; lung non-small cell carcinoma; mitochondrial
    complex II deficiency; and pheochromocytoma/paraganglioma syndrome 5. Orthologous
    to human SDHA (succinate dehydrogenase complex flavoprotein subunit A).
