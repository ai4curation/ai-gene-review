gene_symbol: SDH1
organism: yeast
uniprot_id: Q00711
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalytic subunit of succinate dehydrogenase (SDH) that is involved in complex
    II of the mitochondrial electron transport chain and is responsible for transferring
    electrons from succinate to ubiquinone (coenzyme Q). SDH1 and SDH2 form the catalytic
    dimer. Electrons flow from succinate to the FAD bound to SDH1, and sequentially
    through the iron-sulfur clusters bound to SDH2 and enter the membrane dimer formed
    by SDH3 and SDH4.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q00711
  source_id: Q00711
- source: Alliance_Imported
  text: Flavoprotein subunit of succinate dehydrogenase; couples the oxidation of
    succinate to the transfer of electrons to ubiquinone as part of the TCA cycle
    and the mitochondrial respiratory chain; FAD binding to Sdh1p is required for
    the assembly of the succinate dehydrogenase subunits; mutations in human ortholog
    SDHA are associated with Leigh syndrome and predisposition to several cancers
  source_type: curated
  url: https://www.yeastgenome.org/locus/SDH1
  source_id: SGD:S000001631
- source: Alliance_Automated
  text: Enables flavin adenine dinucleotide binding activity and succinate dehydrogenase
    (quinone) activity. Involved in mitochondrial electron transport, succinate to
    ubiquinone and tricarboxylic acid cycle. Located in mitochondrial inner membrane.
    Part of respiratory chain complex II (succinate dehydrogenase). Used to study
    several diseases, including Leigh disease; endocrine organ benign neoplasm (multiple);
    gastrointestinal stromal tumor; leukodystrophy; and mitochondrial complex II deficiency.
    Human ortholog(s) of this gene implicated in several diseases, including Leigh
    disease; dilated cardiomyopathy 1GG; lung non-small cell carcinoma; mitochondrial
    complex II deficiency; and pheochromocytoma/paraganglioma syndrome 5. Orthologous
    to human SDHA (succinate dehydrogenase complex flavoprotein subunit A).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SDH1
  source_id: SGD:S000001631
