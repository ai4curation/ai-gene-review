taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Succinate-semialdehyde dehydrogenase (Uga2p/Uga5p, YBR006W), a cytoplasmic homotetrameric
  member of the aldehyde dehydrogenase family that oxidises succinate semialdehyde to succinate (EC 1.2.1.16).
  The purified recombinant enzyme is highly specific for succinate semialdehyde and uses NAD+ (preferred)
  or NADP+, and is inhibited by adenine nucleotides. Uga2 catalyses the last step of the GABA shunt (Gad1
  -> Uga1 -> Uga2), completing conversion of glutamate via GABA to succinate, and is required for growth
  on GABA as nitrogen source. UGA2 is induced by H2O2, and its loss reduces oxidative stress tolerance,
  consistent with the shunt contributing to cellular redox balance.
