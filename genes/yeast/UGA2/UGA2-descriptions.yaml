gene_symbol: UGA2
organism: yeast
uniprot_id: P38067
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the oxidation of succinate semialdehyde to succinate. Can utilize
    both NAD(+) or NADP(+) as a coenzyme, but has a 2.5-fold lower activity with NADP(+)
    than with NAD(+) (PubMed:25092794). Functions in a gamma-aminobutyrate (GABA)
    degradation pathway that allows growth utilizing GABA as a nitrogen source (PubMed:3888627).
    Functions in the GABA shunt, which allows to bypass 2 reactions in the TCA cycle
    by removing alpha-ketoglutarate from the cycle and feeding succinate and NADH
    back into the cycle (Probable).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38067
  source_id: P38067
- source: Alliance_Imported
  text: Succinate semialdehyde dehydrogenase; involved in the utilization of gamma-aminobutyrate
    (GABA) as a nitrogen source; part of the 4-aminobutyrate and glutamate degradation
    pathways; localized to the cytoplasm
  source_type: curated
  url: https://www.yeastgenome.org/locus/UGA2
  source_id: SGD:S000000210
- source: Alliance_Automated
  text: Enables succinate-semialdehyde dehydrogenase (NAD+) activity and succinate-semialdehyde
    dehydrogenase (NADP+) activity. Involved in GABA catabolic process; GABA shunt;
    and cellular response to oxidative stress. Located in cytoplasm. Human ortholog(s)
    of this gene implicated in succinic semialdehyde dehydrogenase deficiency. Orthologous
    to human ALDH5A1 (aldehyde dehydrogenase 5 family member A1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/UGA2
  source_id: SGD:S000000210
