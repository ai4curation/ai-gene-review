gene_symbol: HEM3
organism: yeast
uniprot_id: P28789
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the tetrapolymerization of the monopyrrole porphobilinogen (PBG)
    into the hydroxymethylbilane pre-uroporphyrinogen in several discrete steps.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P28789
  source_id: P28789
- source: Alliance_Imported
  text: Porphobilinogen deaminase; catalyzes the conversion of 4-porphobilinogen to
    hydroxymethylbilane, the third step in heme biosynthesis; localizes to the cytoplasm
    and nucleus; expression is regulated by Hap2p-Hap3p, but not by levels of heme;
    human homolog HMBS can complement yeast mutant and allow growth of haploid null
    after sporulation of a heterozygous diploid
  source_type: curated
  url: https://www.yeastgenome.org/locus/HEM3
  source_id: SGD:S000002364
- source: Alliance_Automated
  text: Enables hydroxymethylbilane synthase activity. Involved in heme biosynthetic
    process. Located in cytoplasm and nucleus. Used to study cancer. Human ortholog(s)
    of this gene implicated in acute intermittent porphyria; porphyria; and sickle
    cell anemia. Orthologous to human HMBS (hydroxymethylbilane synthase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HEM3
  source_id: SGD:S000002364
