core_functions:
- description: 'Porphobilinogen deaminase (hydroxymethylbilane synthase): uses a covalently bound dipyrromethane
    cofactor to polymerise four porphobilinogen units head-to-tail into the linear tetrapyrrole hydroxymethylbilane
    (preuroporphyrinogen), the third step of tetrapyrrole (heme and siroheme) biosynthesis, in the cytosol.'
