  label: Saccharomyces cerevisiae S288C
description: HEM3 encodes porphobilinogen deaminase (hydroxymethylbilane synthase, EC 2.5.1.61), a soluble cytosolic
  enzyme of the HMBS family. Using a covalently attached dipyrromethane cofactor, it joins four molecules of porphobilinogen
  head-to-tail into the linear tetrapyrrole hydroxymethylbilane (preuroporphyrinogen), releasing four ammonium ions.
  Uroporphyrinogen-III synthase (Hem4p) then cyclises this product. hem3 mutants lack this activity, historically
  assayed as "uroporphyrinogen I synthase", and are heme auxotrophs. They also need methionine because they cannot
  synthesise siroheme for sulfite reductase. HEM3 transcription depends on the HAP2/3 complex, as for HEM1. Overproduction
  of Hem3p leads to porphobilinogen and porphyrin accumulation, so PBG deaminase is one of the rate-limiting steps
  of yeast heme synthesis.
