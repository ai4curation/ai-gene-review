suggested_questions:
- question: Is PBG deaminase activity post-translationally regulated in yeast (e.g. by heme or by cofactor assembly),
    given its rate-limiting role?
suggested_experiments:
- hypothesis: Apo-to-holo conversion (dipyrromethane cofactor assembly) of Hem3p limits flux through the yeast heme
    pathway
  description: Measure the fraction of Hem3p carrying the dipyrromethane cofactor and its ES1-ES3 intermediates
    under heme-replete vs heme-limited conditions by native MS, and relate it to porphyrin flux.
  experiment_type: biochemistry / mass spectrometry
