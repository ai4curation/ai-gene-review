- source: UniProt
  text: Catalyzes the Claisen rearrangement of chorismate to prephenate (PubMed:10428795,
    PubMed:10894726, PubMed:2187528, PubMed:2646272, PubMed:31498992, PubMed:9642265).
    Acts at the first branch point in the aromatic amino acid pathway where it steers
    biosynthesis towards phenylalanine and tyrosine, and away from tryptophan (Probable).
