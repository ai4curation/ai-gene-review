gene_symbol: ARO7
organism: yeast
uniprot_id: P32178
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the Claisen rearrangement of chorismate to prephenate (PubMed:10428795,
    PubMed:10894726, PubMed:2187528, PubMed:2646272, PubMed:31498992, PubMed:9642265).
    Acts at the first branch point in the aromatic amino acid pathway where it steers
    biosynthesis towards phenylalanine and tyrosine, and away from tryptophan (Probable).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32178
  source_id: P32178
- source: Alliance_Imported
  text: Chorismate mutase; catalyzes the conversion of chorismate to prephenate to
    initiate the tyrosine/phenylalanine-specific branch of aromatic amino acid biosynthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/ARO7
  source_id: SGD:S000006264
- source: Alliance_Automated
  text: Enables L-tyrosine binding activity; chorismate mutase activity; and tryptophan
    binding activity. Involved in L-phenylalanine biosynthetic process; L-tyrosine
    biosynthetic process; and chorismate metabolic process. Located in cytoplasm and
    nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ARO7
  source_id: SGD:S000006264
