id: P32178
gene_symbol: ARO7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ARO7 (OSM2) encodes chorismate mutase (EC 5.4.99.5) of Saccharomyces cerevisiae, the enzyme
  at the first branch point of aromatic amino acid biosynthesis, which catalyses the Claisen rearrangement
  of chorismate to prephenate and thereby commits chorismate to phenylalanine and tyrosine synthesis rather
  than tryptophan. Aro7 is a monofunctional, all-helical homodimer (AroQ class) that is allosterically
  regulated: tyrosine is a feedback inhibitor and tryptophan an activator, both binding the same two allosteric
  sites at the dimer interface (built from helix 8 and helices 4/5 of different subunits); the mixed Trp/Tyr-bound
  state is the most active. A T226I substitution locks the enzyme in the activated state. ARO7 is constitutively
  expressed at low level (not under GCN4 control), the protein is cytoplasmic, and aro7 mutants require
  phenylalanine and tyrosine; the allele osm2 was isolated as osmosensitive.'
