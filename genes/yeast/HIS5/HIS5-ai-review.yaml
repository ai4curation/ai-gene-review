  review:
    summary: RCA from YeastPathways PWY3O-4115. Phenylalanine catabolism (Ehrlich pathway) transamination
      in yeast is attributed to Aro8/Aro9; there is no experimental evidence that His5 contributes, and
      its demonstrated role is histidine biosynthesis. The pathway-database inclusion appears to be by
      analogy to bacterial HisC promiscuity and is not supported for the yeast enzyme.
    action: REMOVE
