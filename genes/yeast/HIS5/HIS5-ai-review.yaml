taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Histidinol-phosphate aminotransferase (EC 2.6.1.9) of Saccharomyces cerevisiae, the HisC
  orthologue and a class II (fold type I) pyridoxal 5'-phosphate-dependent aminotransferase. It catalyses
  step 7 of L-histidine biosynthesis, the reversible transamination of imidazole-acetol phosphate with
  L-glutamate to give L-histidinol phosphate and 2-oxoglutarate. It is a cytosolic enzyme and its gene
  is under GCN4 general amino acid control. Bacterial HisC enzymes can transaminate aromatic amino acids
  in vitro, but in yeast the aromatic aminotransferases Aro8 and Aro9 account for phenylalanine and tyrosine
  transamination, since aro8 aro9 double mutants are Phe/Tyr auxotrophs despite an intact HIS5.
