- term:
    id: GO:0008793
    label: aromatic-amino-acid:2-oxoglutarate transaminase activity
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: enables
  supporting_entities:
  - SGD_PWY:PWY3O-4115
  review:
    summary: RCA from YeastPathways PWY3O-4115 (phenylalanine degradation/Ehrlich pathway transamination),
      which lists HIS5 alongside the aromatic aminotransferases Aro8/Aro9, presumably by analogy to the
      substrate promiscuity of bacterial HisC. No yeast experiment shows His5 transaminating aromatic
      amino acids, and aro8 aro9 double mutants are phenylalanine/tyrosine auxotrophs, indicating His5
      cannot substitute in vivo. A minor in vitro side activity cannot be excluded, so marked as over-annotation
      rather than removed.
    action: MARK_AS_OVER_ANNOTATED
    supported_by:
    - reference_id: PMID:9491082
      supporting_text: aro8 and aro9 double mutants which are auxotrophic for both phenylalanine and tyrosine
- term:
    id: GO:0009165
    label: nucleotide biosynthetic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PRPP-PWY-1
  review:
    summary: RCA propagated from the YeastPathways superpathway PRPP-PWY-1 (superpathway of histidine,
      purine and pyrimidine biosynthesis), which assigns the umbrella process to every member enzyme.
      HIS5 catalyses step 7, histidinol-phosphate aminotransferase of L-histidine biosynthesis; its substrates
      and products are histidine-pathway intermediates, and it performs no step of nucleotide biosynthesis.
      Sharing PRPP as a precursor with nucleotide synthesis is not participation. The pathway-bundling
      artefact should be removed.
    action: REMOVE
    supported_by:
    - reference_id: PMID:14190241
      supporting_text: Each of the histidine mutants of Saccharomyces cerevisiae has been correlated with
        a particular step in histidine biosynthesis
