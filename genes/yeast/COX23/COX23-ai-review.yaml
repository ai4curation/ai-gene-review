taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Cox23 is a 151-residue intermembrane space protein required for cytochrome c
  oxidase assembly, and a homologue of the copper chaperone Cox17. Deletion causes respiratory
  deficiency; the defect is rescued by high copper in the medium, but only when COX17 is simultaneously
  present on a high-copy plasmid, placing Cox23 in the mitochondrial copper delivery pathway
  upstream of or alongside Cox17 rather than as an independent copper donor. A spontaneous
  suppressor screen later showed that a mutation in Cox1 abrogates the requirement for Cox23,
  indicating that Cox23 acts on a Cox1-containing assembly intermediate. Cox23 is distributed
  between the cytosol and the intermembrane space. Despite two decades of genetics, no molecular
  function has been demonstrated, and SGD's ND placeholder on GO:0003674 remains the accurate
  summary.
