core_functions:
- description: Intermembrane space assembly factor for cytochrome c oxidase, acting within
    the mitochondrial copper delivery pathway. Loss of Cox23 blocks cytochrome oxidase expression;
    the defect is rescued by exogenous copper only when COX17 is overexpressed, and is bypassed
    entirely by a mutation in Cox1, indicating that Cox23 acts on a Cox1-containing assembly
    intermediate in a Cox17-dependent manner. Its molecular activity is undetermined.
  directly_involved_in:
  - id: GO:0033617
    label: mitochondrial respiratory chain complex IV assembly
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  supported_by:
  - *id003
  - *id004
suggested_questions:
- question: Cox23 is one of four intermembrane space assembly factors in this pathway (with
    COA4, CMC2, PET191) carrying an ND molecular_function placeholder. Is a new GO molecular
    function term needed for accessory factors that support metallochaperone action without
    binding metal themselves?
  experts:
  - GO molecular function curation group
- question: AlphaFold-Multimer predicts a conserved COX23-COX1 interaction (doi:10.1038/s41467-026-77112-z),
    which would fit the Cox1 suppressor genetics. This is a prediction with no experimental
    follow-up in that paper. Is it worth testing directly?
  experts:
  - Winge lab
  - Barrientos lab
suggested_experiments:
- hypothesis: Cox23 acts on a Cox1-containing assembly intermediate through a direct contact
    with Cox1.
  description: Test the predicted Cox23-Cox1 interaction by co-immunoprecipitation from crosslinked
    mitochondria, as was done successfully for Coa4-Cox11, and ask whether the interaction
    is lost in the suppressor Cox1 mutant background.
  experiment_type: biochemical
