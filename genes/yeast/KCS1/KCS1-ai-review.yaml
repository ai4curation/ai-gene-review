core_functions:
- description: 'ATP-dependent pyrophosphorylation of inositol polyphosphates at the 5-position: IP6 ->
    5-PP-InsP5 (IP7), IP5 -> PP-InsP4, and 1-IP7 -> 1,5-IP8, generating the inositol pyrophosphate messengers
    that regulate phosphate/polyphosphate homeostasis, vacuole biogenesis and INO1 expression.'
