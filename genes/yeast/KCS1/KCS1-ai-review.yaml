suggested_questions:
- question: "What is the molecular function of the Kcs1 leucine heptad-repeat (bZIP-like) region\n   \
    \             required for vacuole biogenesis and INO1 expression, and does it mediate protein interactions\
    \ or\n                localization?"
- question: "Is there a nuclear pool of Kcs1, or do its PP-InsP products diffuse into the nucleus to\n\
    \                regulate PHO and INO1 transcription and telomere length?"
suggested_experiments:
- description: "Separate catalytic and non-catalytic roles by expressing kinase-dead Kcs1 and a\n    \
    \            leucine-zipper deletion in kcs1 cells, measuring IP7/IP8 isomers, INO1 transcription\
    \ and vacuole\n                morphology; localize endogenously tagged Kcs1 under phosphate and inositol\
    \ limitation."
