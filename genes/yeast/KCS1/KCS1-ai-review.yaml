id: Q12494
gene_symbol: KCS1
aliases:
- YDR017C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: KCS1 (YDR017C) encodes the sole Saccharomyces cerevisiae inositol hexakisphosphate kinase
  (IP6K; EC 2.7.4.21), a member of the inositol phosphokinase (IPK) family related to IPMK/Arg82. Kcs1
  pyrophosphorylates the 5-position of IP6 to produce 5-diphosphoinositol pentakisphosphate (5-IP7), converts
  IP5 to PP-IP4, and converts the Vip1 product 1-IP7 to 1,5-IP8. Kcs1 accounts for most cellular inositol
  pyrophosphate synthesis; kcs1 cells have fragmented vacuoles, cell-wall and salt stress defects, low
  polyphosphate, derepressed PHO genes, longer telomeres and, through loss of INO1 transcription, inositol
  auxotrophy. Besides the kinase domain, Kcs1 carries a leucine heptad-repeat (bZIP-like) region needed
  for vacuole biogenesis and INO1 expression. Kcs1 is mainly cytoplasmic.
