gene_symbol: KCS1
organism: yeast
uniprot_id: Q12494
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Converts inositol hexakisphosphate (InsP6) to diphosphoinositol pentakisphosphate
    (InsP7/PP-InsP5). Involved in phosphate regulation and polyphosphate accumulation.
    Required for resistance to salt stress, cell wall integrity, vacuole morphogenesis,
    and telomere maintenance.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q12494
  source_id: Q12494
- source: Alliance_Imported
  text: Inositol hexakisphosphate (IP6) and inositol heptakisphosphate (IP7) kinase;
    generation of high energy inositol pyrophosphates by Kcs1p is required for many
    processes such as vacuolar biogenesis, stress response, RNA polymerase I-mediated
    rRNA transcription and telomere maintenance; phosphorylated by the AMPK Snf1p,
    leading to reduced levels of pyrophosphorylated IP7, increased filamentous and
    invasive growth and increased cell elongation
  source_type: curated
  url: https://www.yeastgenome.org/locus/KCS1
  source_id: SGD:S000002424
- source: Alliance_Automated
  text: Enables diphosphoinositol pentakisphosphate kinase activity; inositol hexakisphosphate
    kinase activity; and inositol-1,3,4,5,6-pentakisphosphate kinase activity. Involved
    in inositol phosphate biosynthetic process and regulation of inositol phosphate
    biosynthetic process. Acts upstream of or within intracellular phosphate ion homeostasis.
    Located in cytoplasm. Orthologous to human IP6K1 (inositol hexakisphosphate kinase
    1); IP6K2 (inositol hexakisphosphate kinase 2); and IP6K3 (inositol hexakisphosphate
    kinase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/KCS1
  source_id: SGD:S000002424
