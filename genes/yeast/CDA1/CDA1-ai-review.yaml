  review:
    summary: YeastPathways (PWY3O-70, chitosan biosynthesis) assigns the generic BP 'polysaccharide biosynthetic
      process' via the GO-CAM conversion. Cda1p modifies an existing polymer (chitin) to generate chitosan, so this
      is a true but very general description of its role; the informative process is ascospore wall assembly.
    action: KEEP_AS_NON_CORE
