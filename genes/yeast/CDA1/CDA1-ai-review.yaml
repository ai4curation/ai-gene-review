core_functions:
- description: Sporulation-specific secreted CE4 chitin deacetylase that converts chitin (made by Chs3p) into chitosan
    in the forming ascospore wall, redundantly with CDA2; the chitosan layer is required for a rigid, resistant
    spore wall and for deposition of the outer dityrosine layer.
  molecular_function:
    id: GO:0004099
    label: chitin deacetylase activity
  directly_involved_in:
  - id: GO:0030476
    label: ascospore wall assembly
  locations:
  - id: GO:0042764
    label: ascospore-type prospore
  - id: GO:0005628
    label: prospore membrane
  supported_by:
  - *id002
  - *id005
  - *id003
  - *id006
suggested_questions:
- question: Do Cda1p and Cda2p differ in substrate preference (degree/pattern of deacetylation) or in their precise
    location within the prospore membrane lumen, or are they fully interchangeable?
- question: How is Cda1/Cda2 activity coupled to Chs3p-mediated chitin synthesis during spore wall assembly (e.g.,
    co-translocation or substrate channelling)?
suggested_experiments:
- description: Purify recombinant Cda1p and compare metal dependence (Co2+, Zn2+), kinetics and deacetylation pattern
    on defined chitooligosaccharides with Cda2p.
