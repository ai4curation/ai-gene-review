id: Q06702
gene_symbol: CDA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Chitin deacetylase 1 (Cda1p) of Saccharomyces cerevisiae is a sporulation-specific, secreted, N-glycosylated
  member of the carbohydrate esterase family 4 (polysaccharide deacetylase/NodB domain) that hydrolyses the N-acetamido
  groups of GlcNAc residues in chitin to yield chitosan and acetate (EC 3.5.1.41). CDA1 and its tandem paralog CDA2
  are transcribed only during a defined window of sporulation and together account for all chitin deacetylase activity
  of the cell; they are functionally redundant. Acting in the lumen between the two leaflets of the prospore membrane,
  the enzymes convert chitin made by the chitin synthase Chs3p into the chitosan layer of the ascospore wall, which
  is in turn the foundation for the outermost dityrosine layer. cda1 cda2 double mutant spores lack chitosan, lack
  dityrosine fluorescence and are sensitive to lytic enzymes, ether and heat, although they remain viable. The CE4
  active site is metal-dependent, with Co2+ the activating cation for the characterised paralog.
