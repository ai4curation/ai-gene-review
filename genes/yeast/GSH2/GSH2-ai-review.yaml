  review:
    summary: Traceable author statement from Adamis et al. 2009 (cadmium-glutathione complex formation), which discusses
      cytoplasmic glutathione; the abstract does not mention Gsh2 directly. Gsh2 is a soluble enzyme lacking targeting
      signals and glutathione synthesis is cytosolic, so the location is correct even if weakly sourced.
    action: ACCEPT
    supported_by:
