id: Q08220
gene_symbol: GSH2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Glutathione synthetase (EC 6.3.2.3) of Saccharomyces cerevisiae, an ATP-grasp enzyme of the eukaryotic
  GSH synthase family. Gsh2 catalyses the second and final step of glutathione biosynthesis, the ATP- and Mg2+-dependent
  ligation of glycine to gamma-L-glutamyl-L-cysteine to form glutathione, in the cytosol. It is a homodimer whose
  domains close around the substrates upon binding. GSH2 is not essential, but gsh2 disruptants lack detectable
  glutathione.
