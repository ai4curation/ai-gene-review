  text: Enables several functions, including anion binding activity; glutathione synthase
    activity; and magnesium ion binding activity. Involved in glutathione biosynthetic
    process. Predicted to be located in cytoplasm. Predicted to be active in cytosol.
    Used to study Huntington's disease. Human ortholog(s) of this gene implicated
    in Alzheimer's disease; congenital nonspherocytic hemolytic anemia 6; glutathione
    synthetase deficiency; and glutathione synthetase deficiency with 5-oxoprolinuria.
    Orthologous to human GSS (glutathione synthetase).
