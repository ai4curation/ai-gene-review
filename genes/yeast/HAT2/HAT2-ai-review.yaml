id: P39984
gene_symbol: HAT2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Hat2 (YEL056W) is the non-catalytic, histone-binding subunit of the type B histone acetyltransferase
  (HAT-B), a WD40 beta-propeller protein of the RbAp46/RbAp48/Msi1 family. With the catalytic subunit
  Hat1 it forms the Hat1-Hat2 complex that acetylates newly synthesized, non-chromatin histone H4 on lysine
  12 (and lysine 5); Hat2 gives the complex high-affinity binding to the H4 tail, stimulates Hat1 activity
  and recognizes the unmodified N-terminal tail of histone H3, which favours new over parental histones.
  The complex is found in the cytoplasm and, predominantly, the nucleus, where Hat2 bridges Hat1 to the
  histone chaperone Hif1 to form the nuclear NuB4 complex; Hat2 is required for Hat1''s nuclear localization.
  hat2 deletion is viable and impairs telomeric silencing when combined with histone H3 tail mutations.
  In budding yeast the RbAp46/48 family has divided its roles among paralogs: Hat2 in HAT-B, Msi1 in CAF-1
  and Ume1 in the Rpd3L histone deacetylase.'
