  review:
    summary: Hat2 is part of the HAT that modifies new histone H4 before chromatin assembly.
    action: ACCEPT
    reason: HAT-B acetylates newly synthesized H4, and the nuclear complex hands acetylated H3-H4 towards
      assembly (PMID:15099519). Histone acetylation process terms are obsolete in GO (they represent molecular
      functions), and no assembly step has been shown to require Hat2 directly, so chromatin organization
      is as specific as the evidence allows.
    supported_by:
    - reference_id: PMID:8858151
