core_functions:
- description: Histone-binding WD40 subunit of HAT-B. Hat2 gives Hat1 high-affinity binding to the histone
    H4 tail, reads the unmodified histone H3 tail, stimulates acetylation of newly synthesized H4 on lysine
    12 by the complex, bridges Hat1 to Hif1 in the nuclear NuB4 complex, and is needed for Hat1's nuclear
    localization.
