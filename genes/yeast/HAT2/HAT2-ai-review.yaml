    label: subtelomeric heterochromatin formation
  evidence_type: IDA
  original_reference_id: PMID:15099519
  qualifier: involved_in
  review:
    summary: Hat2 deletion impairs telomeric silencing (with Hif1/Hat1 data).
    action: KEEP_AS_NON_CORE
    reason: hat2 deletion alone does not change telomeric silencing; a defect appears when hat2 (or hat1)
      deletion is combined with lysine-to-arginine mutations in the histone H3 tail, and the effect runs
