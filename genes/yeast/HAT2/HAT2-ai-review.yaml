  evidence_type: IDA
  original_reference_id: PMID:8858151
  qualifier: contributes_to
  review:
    summary: Hat2 is required, with Hat1, for the purified type B HAT activity on histone H4 K12.
    action: MODIFY
    reason: 'The annotation carries contributes_to, which is the right claim: Hat2 has no catalytic domain
      (the GNAT fold is in Hat1), but hat2 mutant extracts lose type B activity and Hat2 stimulates Hat1
      and supplies high-affinity binding to histone H4. The activity of the complex is site-specific acetylation
      of free H4 on lysine 12, so the term is correct but general; the supported, more specific term is
      histone H4K12 acetyltransferase activity, keeping the contributes_to qualifier.'
