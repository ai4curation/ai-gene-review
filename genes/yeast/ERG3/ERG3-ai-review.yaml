id: P32353
gene_symbol: ERG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ERG3 (YLR056W) encodes the Delta7-sterol 5(6)-desaturase (C-5 sterol desaturase, EC 1.14.19.20), a
  multi-pass ER membrane non-heme di-iron enzyme of the fatty acid hydroxylase/sterol desaturase family with three
  histidine boxes. Using O2 and electrons from cytochrome b5 (NAD(P)H-dependent, cyanide-sensitive, CO-insensitive),
  it introduces the C5=C6 double bond into episterol to give ergosta-5,7,24(28)-trienol (5-dehydroepisterol), the
  step after Erg2 and before Erg5/Erg4. The protein has a luminal, N-glycosylated N-terminus and a cytosol-facing
  catalytic centre, and is an ERAD substrate. erg3 null mutants are viable but lack ergosterol, accumulating Delta7
  sterols; erg3 loss suppresses the lethality of erg11 loss and confers resistance to some saponins such as aescin.
