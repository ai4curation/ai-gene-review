suggested_questions:
- question: The text definition of GO:0000248 "C-5 sterol desaturase activity" describes the C-22 desaturation of
    5,7,24(28)-ergostatrienol (the Erg5/GO:0000249 reaction). Should GO correct the definition to the Delta7-sterol
    C5-desaturation, or obsolete GO:0000248 in favour of GO:0050046?
- question: Is the cytochrome b5 (Cyb5) or a P450 reductase the physiological electron donor for Erg3 in vivo?
