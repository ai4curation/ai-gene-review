  review:
    summary: Osumi et al. 1979 characterised microsomal Delta5-desaturation in yeast (requires O2 and NAD(P)H, cyanide-sensitive,
      CO-insensitive, resembling fatty acyl-CoA desaturation), i.e. the Erg3 reaction. GO:0000248 "C-5 sterol desaturase
      activity" is labelled as the C-5 desaturase, but its current text definition gives the reaction 5,7,24(28)-ergostatrienol
      + O2 + NADPH -> 5,7,22,24(28)-ergostatetraenol, which is the C-22 desaturation catalysed by Erg5 (cf. GO:0000249).
      The Erg3 reaction (episterol -> 5-dehydroepisterol, EC 1.14.19.20) is exactly described by GO:0050046 delta7-sterol
      5(6)-desaturase activity, already annotated by IBA/IEA/RCA.
    action: MODIFY
    reason: Experimental support is for C-5 desaturation of Delta7 sterols; GO:0050046 is the term whose definition
      matches.
    proposed_replacement_terms:
    - id: GO:0050046
      label: delta7-sterol 5(6)-desaturase activity
    supported_by:
    - &id007
      reference_id: PMID:34600
      supporting_text: Studies were carried out on the delta 5-desaturation reaction in ergosterol biosynthesis
        with a particulate fraction of cell-free extract of yeast.
    - &id006
      reference_id: PMID:34600
      supporting_text: These results suggested an involvement in delta 5-desaturation of a mixed function oxidase
        system resembling that for the fatty acyl-CoA desaturation reaction.
