- id: PMID:20471941
  title: Initiation of the TORC1-regulated G0 program requires Igo1/2, which license
    specific mRNAs to evade degradation via the 5'-3' mRNA decay pathway.
  findings:
  - statement: Rim15 phosphorylates the paralogous Igo1 and Igo2 to couple transcription with
      post-transcriptional mRNA protection during G0 initiation.
    supporting_text: Here, we report that Rim15 coordinates transcription with posttranscriptional
      mRNA protection by phosphorylating the paralogous Igo1 and Igo2 proteins.
  - statement: Phosphorylated Igo proteins associate with the decapping activator Dhh1 and shelter
      newly expressed mRNAs from 5'-3' decay.
    supporting_text: This event, which stimulates Igo proteins to associate with the mRNA decapping
      activator Dhh1, shelters newly expressed mRNAs from degradation via the 5'-3' mRNA decay
      pathway, thereby enabling their proper translation during initiation of the G(0) program.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache (PMC2919320 exists). The paper that named
      IGO1/IGO2, mapped Rim15 phosphorylation to Ser64 and established the G0 and mRNA-protection
      phenotypes; source of the P-body, nucleus, mRNA stabilization, deadenylation-dependent decay
      and G1-to-G0 annotations.
- id: PMID:23273919
  title: Yeast endosulfines control entry into quiescence and chronological life span
    by inhibiting protein phosphatase 2A.
  findings:
  - statement: Rim15-phosphorylated endosulfines directly inhibit PP2A-Cdc55.
    supporting_text: Here, we show that Rim15, analogous to the greatwall kinase in Xenopus,
      phosphorylates endosulfines to directly inhibit the Cdc55-protein phosphatase 2A
      (PP2A(Cdc55)).
  - statement: PP2A-Cdc55 inhibition keeps Gis1 phosphorylated and promoter-bound, driving
      nutrient-regulated transcription.
    supporting_text: Inhibition of PP2A(Cdc55) preserves Gis1 in a phosphorylated state and
      consequently promotes its recruitment to and activation of transcription from promoters of
      specific nutrient-regulated genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache. Establishes the PP2A-Cdc55 inhibitor
      mechanism for the yeast endosulfines (purified-protein inhibition, Ser64-dependent Cdc55
      binding, cdc55/pph21 but not rts1 epistasis); source of the IDA/IMP inhibitor rows and two
      G1-to-G0 IGI rows.
- id: PMID:23861665
  title: Budding yeast greatwall and endosulfines control activity and spatial regulation
    of PP2A(Cdc55) for timely mitotic progression.
  findings:
  - statement: Igo1 co-immunoprecipitates Pph21 and Cdc55 but not Rts1, dependent on Rim15
      phosphorylation of Ser64, with binding maximal in late S/G2.
    supporting_text: Thus, efficient interaction between Igo1 and PP2A requires Rim15-dependent
      phosphorylation of Igo1 on Ser64.
  - statement: Greatwall-phosphorylated Igo1 inhibits affinity-purified PP2A-Cdc55 in vitro in a
      dose-dependent manner and induces mitotic entry in Xenopus egg extracts.
    supporting_text: Phosphorylated Igo1 inhibits PP2A(Cdc55) activity in vitro and induces mitotic
      entry in Xenopus egg extracts, indicating that it bears a conserved PP2A-binding and
      -inhibitory activity.
  - statement: In vivo, loss of Igo1/Igo2 reduces PP2A-Cdc55 activity and delays mitotic entry under
      temperature stress via Swe1-dependent Cdk1 Tyr19 phosphorylation.
    supporting_text: Surprisingly, deletion of IGO1 and IGO2 in yeast cells leads to a decrease in
      PP2A phosphatase activity, suggesting that endosulfines act also as positive regulators of
      PP2A in yeast.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. Independent confirmation of the Ser64-dependent
      PP2A-Cdc55 binding and in vitro inhibition, plus the paradoxical in vivo positive role in
      mitotic entry; source of one IDA inhibitor row and the mitotic phase-transition IGI row.
- id: file:yeast/IGO1/IGO1-deep-research-falcon.md
  title: Deep research report for IGO1 (yeast), Falcon provider
  findings:
  - statement: Summarises the Ser64-dependent PP2A-Cdc55 inhibition mechanism and the cdc55/pph21
      versus rts1 epistasis.
    supporting_text: Loss of the PP2A catalytic subunit Pph21 produced related suppression, whereas
      loss of the alternative PP2A regulatory subunit Rts1 did not, demonstrating specificity for
      PP2A-Cdc55 rather than PP2A generally.
  - statement: Records the later START, gametogenesis and hyperosmotic-stress roles (Talarek 2017,
      Sarkar 2014, Hollenstein 2021) and flags the mRNA-decay role as context-dependent.
    supporting_text: The mRNA-decay role is supported, but it is context-dependent and does not
      account for every Igo1 phenotype.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Falcon (Edison) literature synthesis; claims about Bontron 2013 and Juanes 2013
      were checked against the cached abstracts/full text. Its summaries of Sarkar 2014, Talarek
      2017 and Hollenstein 2021 (not cached here) are used only for context in the description
      and core-function narrative, and it correctly flags the 2024 Nature Communications study as
      fission-yeast igo1, not P53897.
