- term:
    id: GO:1901992
    label: positive regulation of mitotic cell cycle phase transition
  evidence_type: IGI
  original_reference_id: PMID:23861665
  qualifier: involved_in
  supporting_entities:
  - SGD:S000007496
  review:
    summary: Juanes et al. 2013 (full text cached) found that igo1 igo2 cells (IGI with IGO2) and
      rim15 cells delay mitotic entry and progression by 10-30 min at 16 C or 38 C, accumulate
      Swe1-dependent Cdk1 Tyr19 phosphorylation, retain Cdc55 in the nucleus, and have reduced
      PP2A-Cdc55 activity; swe1 deletion or Cdc28-Y19F rescues the temperature sensitivity.
      Igo1-Cdc55 binding peaks in late S/G2.
    action: KEEP_AS_NON_CORE
    reason: The evidence is direct and the term is apt - the delayed step is the G2/M transition
      (mitotic entry) but spindle elongation and nuclear division are also delayed, which is why
      the curator chose the phase-transition parent rather than the G2/M-specific child. It is
      graded non-core because the requirement is conditional (no mitotic delay at 25 C) and
      because the mechanism is not the canonical endosulfine one - in budding yeast PP2A-Cdc55
      promotes mitotic entry, and the endosulfines are needed in vivo to sustain PP2A-Cdc55
      activity and cytoplasmic localisation, contrary to their in vitro inhibitor activity; the
      authors speculate about a chaperone-like role. The core, well-mechanised function of Igo1 is
      the nutrient-regulated PP2A-Cdc55 inhibition that drives quiescence entry. Note that a more
      specific child, GO:0010971 positive regulation of G2/M transition of mitotic cell cycle,
      would also be defensible for the mitotic-entry data.
