gene_symbol: IGO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Igo1 (Initiation of G zero 1; YNL157W) is a small (168 residue), largely disordered
  endosulfine-family phosphoprotein of Saccharomyces cerevisiae, the paralog of Igo2 and the
  budding-yeast counterpart of human ENSA/ARPP19. Its defining activity is phosphorylation-gated
  inhibition of the PP2A-Cdc55 holoenzyme (the yeast PP2A-B55): when the Greatwall-related kinase
  Rim15 phosphorylates the conserved Ser64 in the YFDSGDY motif, phospho-Igo1 binds the Cdc55
  regulatory subunit (not Rts1-containing PP2A) and inhibits PP2A-Cdc55 phosphatase activity, so
  that selected PP2A-Cdc55 substrates remain phosphorylated. Rim15 is released from TORC1/PKA
  inhibition on nitrogen or carbon limitation; Igo1/Igo2 then keep the transcription factor Gis1
  phosphorylated and promoter-bound, sustaining Msn2/4- and Gis1-dependent expression of
  nutrient-regulated genes, and Rim15-phosphorylated Igo proteins also associate with the decapping
  activator Dhh1 and shelter these newly made transcripts from the deadenylation-dependent 5'-3'
  decay pathway. Through this the Rim15-Igo1/2-PP2A-Cdc55 module governs initiation of the
  G0/quiescence programme, glycogen accumulation and chronological life span; the same module lowers
  the Cln3-Cdk1 threshold for START by limiting Whi5 dephosphorylation, is required for entry into
  sporulation, and transmits a rapid Hog1-independent phosphorylation response to hyperosmotic
  stress. In cycling cells Igo1 binds PP2A-Cdc55 most strongly in late S/G2 and, paradoxically,
  cells lacking Igo1/Igo2 show reduced PP2A-Cdc55 activity, nuclear-retained Cdc55 and elevated
  Swe1-dependent Cdk1 Tyr19 phosphorylation, delaying mitotic entry under temperature stress - so in
  budding yeast, where PP2A-Cdc55 promotes rather than opposes mitotic entry, the endosulfines
  support the pro-mitotic activity of the phosphatase. Igo1 and Igo2 are largely redundant. The
  protein is cytoplasmic and nuclear, with a P-body-associated pool during initiation of G0.
