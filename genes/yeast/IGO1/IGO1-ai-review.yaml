core_functions:
- description: Rim15 (Greatwall)-phosphorylated inhibitor of the PP2A-Cdc55 (PP2A-B55) phosphatase
    that gates entry into quiescence. When TORC1/PKA signalling falls on nutrient limitation, Rim15
    phosphorylates Igo1 on Ser64; phospho-Igo1 binds the Cdc55 regulatory subunit and inhibits
    PP2A-Cdc55, so that Gis1 stays phosphorylated and promoter-bound and Msn2/4- and
    Gis1-dependent nutrient-regulated genes are transcribed, initiating the G0 programme, glycogen
    storage and normal chronological life span. The same phospho-switch lowers the Cln3-Cdk1
    threshold at START (by limiting Whi5 dephosphorylation), is required for entry into
    sporulation, and relays a rapid Hog1-independent hyperosmotic-stress phosphorylation response.
