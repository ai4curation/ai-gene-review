      that helps adapt START size to metabolic state.
  - reference_id: file:yeast/IGO1/IGO1-deep-research-falcon.md
    supporting_text: Igo1/Igo2 are also needed for pre-meiotic autophagy, but defective autophagy
      does not fully explain failed sporulation.
- description: Post-transcriptional licensing of the G0 transcriptome. Rim15-phosphorylated Igo1
    associates with the decapping activator Dhh1 (and the Pbp1/Pbp4/Lsm12 P-body-associated
    proteins) and shelters newly transcribed Msn2/4- and Gis1-dependent mRNAs from the
    deadenylation-dependent 5'-3' decay pathway (Ccr4, Dhh1) so that they can be translated during
    initiation of G0. Whether protection is exerted by direct engagement of the decay machinery or
    through the same PP2A-Cdc55 inhibition is unresolved, and suppression by ccr4/dhh1 deletion
    was not reproduced in every strain background; the inhibitor activity is given as the
    molecular function because it is the only activity of Igo1 demonstrated biochemically.
