gene_symbol: IGO1
organism: yeast
uniprot_id: P53897
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Required for TORC1 to properly control gene expression and chronological life
    span. Plays an essential role in initiation of the G0 program by preventing the
    degradation of specific nutrient-regulated mRNAs via the 5'-3' mRNA decay pathway.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P53897
  source_id: P53897
- source: Alliance_Imported
  text: Protein required for initiation of the G0 program; prevents degradation of
    nutrient-regulated mRNAs via the 5'-3' mRNA decay pathway; phosphorylation (S63)
    by Rim15p increases interaction with and inhibition of PP2A-Cdc55 for timely mitotic
    progression; can also activate PP2A-Cdc55 complexes and influence Cdc55p localization
    along with Igo2p; GFP protein localizes to the cytoplasm and nucleus; IGO1 has
    a paralog, IGO2, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/IGO1
  source_id: SGD:S000005101
- source: Alliance_Automated
  text: Enables protein serine/threonine phosphatase inhibitor activity. Involved
    in negative regulation of mRNA catabolic process and positive regulation of cell
    cycle process. Located in P-body and nucleus. Orthologous to human ARPP19 (cAMP
    regulated phosphoprotein 19) and ENSA (endosulfine alpha).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IGO1
  source_id: SGD:S000005101
