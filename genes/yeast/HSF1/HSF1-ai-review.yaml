    label: mitochondrion
  evidence_type: HDA
  original_reference_id: PMID:14576278
  qualifier: located_in
  review:
    summary: Detected in large-scale proteomic surveys of purified yeast mitochondria.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Hsf1 is a nuclear transcription factor; there is no small-scale evidence for a mitochondrial pool.
      The mitochondrial protein-import defect of the hsf1/mas3 mutant is an indirect consequence of reduced
      chaperone gene expression, not mitochondrial residence. Detection in organelle proteomes most likely
      reflects co-purification.
