gene_symbol: HSF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Hsf1 is the single, essential heat shock transcription factor of Saccharomyces cerevisiae (833 aa).
  It binds heat shock elements (inverted nGAAn repeats) as a homotrimer through an N-terminal winged helix-turn-helix
  DNA-binding domain and activates RNA polymerase II transcription through N- and C-terminal activation
  domains that recruit Mediator. Unlike metazoan HSF1, yeast Hsf1 is constitutively trimeric and largely
  nuclear, and its activity is tuned by heat-induced phosphorylation and by negative feedback from Hsp70
  and Hsp90. Its essential housekeeping function is basal transcription of a compact set of chaperone
  genes (notably Hsp70 and Hsp90 genes); restoring their basal expression allows growth without Hsf1.
  Under heat and proteotoxic stress (including ribosome assembly defects) Hsf1 drives induction of chaperone
  genes needed for thermotolerance.
