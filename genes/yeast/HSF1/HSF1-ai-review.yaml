- id: file:yeast/HSF1/HSF1-uniprot.txt
  title: UniProtKB entry P10961 (HSF_YEAST)
  findings: []
core_functions:
- description: >-
    Sequence-specific HSE-binding transcription activator that drives basal and stress-induced RNA polymerase
    II transcription of chaperone genes (Hsp70, Hsp90) to maintain proteostasis.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0034605
    label: cellular response to heat
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:yeast/HSF1/HSF1-uniprot.txt
    supporting_text: >-
      DNA-binding transcription factor that specifically binds heat shock promoter elements (HSE) and
      activates transcription.
  - reference_id: PMID:3044612
    supporting_text: >-
      Expression of specific DNA-binding activity in E. coli and of transcriptional activity in yeast
      confirmed the identity of the cloned gene.
  - reference_id: PMID:27320198
    supporting_text: >-
      Strikingly, rescuing basal expression of Hsp70 and Hsp90 chaperones enabled robust cell growth in
      the complete absence of Hsf1.
suggested_questions:
- question: >-
    Which features of the Hsf1 activation domains and Hsp70 binding sites determine the switch between
    basal (essential) and stress-induced transcription of the chaperone gene set?
- question: >-
    Is the reported mitochondrial detection of Hsf1 in organelle proteomes a genuine mitochondrial pool
    or a co-purification artefact?
suggested_experiments:
- hypothesis: >-
    Hsp70 binding to Hsf1 is the principal negative feedback that couples orphan ribosomal protein accumulation
    to Hsf1 activation.
  description: >-
    Map and mutate Hsp70-binding sites in Hsf1 and test Hsf1 target induction after acute ribosome assembly
    arrest and heat shock.
