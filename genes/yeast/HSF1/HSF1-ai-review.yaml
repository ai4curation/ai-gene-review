- term:
    id: GO:0043555
    label: regulation of translation in response to stress
  evidence_type: IDA
  original_reference_id: PMID:31124783
  qualifier: involved_in
  review:
    summary: Ribosome assembly stress rapidly activates Hsf1 target genes.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper shows that Hsf1 transcriptionally upregulates its target genes in response to ribosome
      assembly arrest (likely via titration of Hsp70 by orphan ribosomal proteins). Hsf1 acts on transcription,
      not translation; a regulation-of-translation term overstates what Hsf1 itself does.
    supported_by:
    - reference_id: PMID:31124783
      supporting_text: >-
        Here, we show that arrest of ribosome biogenesis in the budding yeast Saccharomyces cerevisiae
        triggers rapid activation of a highly specific stress pathway that coordinately upregulates Hsf1
        target genes and downregulates RP genes.
