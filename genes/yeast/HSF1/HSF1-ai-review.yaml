  review:
    summary: >-
      Hsf1 binds heat shock elements (inverted nGAAn repeats) in the promoters of RNA polymerase II-transcribed
      chaperone genes; IBA from the HSF family.
    action: ACCEPT
    reason: >-
      Sequence-specific binding to HSEs in Pol II promoters is the defining molecular property of HSF-family
      proteins and is directly supported for yeast Hsf1 (specific DNA-binding activity of the cloned protein).
      The PAINT node placement is consistent with the conserved HSF DNA-binding domain.
    supported_by:
    - reference_id: file:yeast/HSF1/HSF1-uniprot.txt
      supporting_text: >-
        DNA-binding transcription factor that specifically binds heat shock promoter elements (HSE) and
        activates transcription.
    - reference_id: PMID:3044612
      supporting_text: >-
        Expression of specific DNA-binding activity in E. coli and of transcriptional activity in yeast
        confirmed the identity of the cloned gene.
