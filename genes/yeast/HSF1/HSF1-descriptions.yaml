    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Correct on trimer, variable HSEs and diverse stress activation.
      Adds recent claims (Mediator/Pol II condensates, RQC translation-stress signal,
      transient acidification) that the review does not cover; omits the essential
      basal role.
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity and sequence-specific DNA
    binding activity. Involved in several processes, including negative regulation
    of TORC1 signaling; regulation of establishment of protein localization to chromosome;
    and regulation of gene expression. Located in nucleus. Part of protein-DNA complex.
    Human ortholog(s) of this gene implicated in Huntington's disease; cataract; and
    cataract 5 multiple types. Orthologous to human HSF1 (heat shock transcription
    factor 1); HSF2 (heat shock transcription factor 2); and HSF4 (heat shock transcription
    factor 4).
  source_type: automated
