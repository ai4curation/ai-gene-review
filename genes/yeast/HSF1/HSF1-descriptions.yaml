descriptions:
- source: UniProt
  text: DNA-binding transcription factor that specifically binds heat shock promoter
    elements (HSE) and activates transcription.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P10961
  source_id: P10961
- source: Alliance_Imported
  text: Trimeric heat shock transcription factor; forms condensate with Mediator and
    RNA Pol II upon heat shock; activates multiple genes in response to diverse stresses
    and transient intracellular acidification; recognizes variable heat shock elements
    (HSEs) consisting of inverted NGAAN repeats; monitors translational status through
    RQC (Ribosomal Quality Control)-mediated translation-stress signal; human homolog
    HSF1 with linker region mutations can complement yeast hsf1 mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/HSF1
  source_id: SGD:S000003041
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity and sequence-specific DNA
    binding activity. Involved in several processes, including negative regulation
    of TORC1 signaling; regulation of establishment of protein localization to chromosome;
    and regulation of gene expression. Located in nucleus. Part of protein-DNA complex.
    Human ortholog(s) of this gene implicated in Huntington's disease; cataract; and
    cataract 5 multiple types. Orthologous to human HSF1 (heat shock transcription
    factor 1); HSF2 (heat shock transcription factor 2); and HSF4 (heat shock transcription
    factor 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/HSF1
  source_id: SGD:S000003041
