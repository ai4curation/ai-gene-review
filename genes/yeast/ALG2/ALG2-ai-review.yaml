id: P43636
gene_symbol: ALG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Alg2 is a bifunctional GDP-mannose-dependent mannosyltransferase (glycosyltransferase family
  4, GT-B fold) that sits in the ER membrane. It acts on the cytoplasmic face of the ER during assembly
  of the dolichol-linked oligosaccharide precursor for N-glycosylation. It adds an α1,3-linked mannose
  to Man1GlcNAc2-PP-dolichol (EC 2.4.1.132) and then an α1,6-linked mannose (EC 2.4.1.257). These two
  steps form the branched trimannosyl core Man3GlcNAc2-PP-dolichol, which Alg11 then extends. In vitro
  the two mannoses can be added in either order. Yeast Alg2 has two N-terminal transmembrane helices and
  two C-terminal hydrophobic segments that bind the membrane. Alg2 associates with Alg1 in an ER membrane
  complex. ALG2 is essential.
