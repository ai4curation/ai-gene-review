suggested_questions:
- question: In vivo, does Alg2 add the α1,3-mannose before the α1,6-mannose, given that it can work in
    either order in vitro?
- question: Does Alg1-Alg2 complex formation channel Man1GlcNAc2-PP-Dol directly to Alg2?
suggested_experiments:
- description: Profile LLO intermediates in alg2 point mutants that selectively impair one of the two
    transfer reactions, to determine the in vivo reaction order.
