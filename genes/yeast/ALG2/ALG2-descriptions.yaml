gene_symbol: ALG2
organism: yeast
uniprot_id: P43636
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Mannosylates Man(2)GlcNAc(2)-dolichol diphosphate and Man(1)GlcNAc(2)-dolichol
    diphosphate to form Man(3)GlcNAc(2)-dolichol diphosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P43636
  source_id: P43636
- source: Alliance_Imported
  text: Mannosyltransferase in the N-linked glycosylation pathway; catalyzes two consecutive
    steps in N-linked glycosylation pathway; mutants exhibit temperature-sensitive
    growth and abnormal accumulation of lipid-linked oligosaccharide Man2GlcNAc2-PP-Dol;
    mutations of human ALG2 cause congenital myasthenic syndrome; human ALG2 complements
    temperature sensitivity and dolichol-linked oligosaccharide biosynthesis defect
    of alg2-1 mutant, but mutant form from a patient with CDG-Ii fails to complement
  source_type: curated
  url: https://www.yeastgenome.org/locus/ALG2
  source_id: SGD:S000003033
- source: Alliance_Automated
  text: Enables GDP-Man:Man(1)GlcNAc(2)-PP-Dol alpha-1,3-mannosyltransferase activity;
    GDP-Man:Man(2)GlcNAc(2)-PP-Dol alpha-1,6-mannosyltransferase activity; and initiation-specific
    glycolipid 1,6-alpha-mannosyltransferase activity. Involved in dolichol-linked
    oligosaccharide biosynthetic process. Located in endoplasmic reticulum. Human
    ortholog(s) of this gene implicated in congenital disorder of glycosylation Ii
    and congenital myasthenic syndrome 14. Orthologous to human ALG2 (ALG2 alpha-1,3/1,6-mannosyltransferase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ALG2
  source_id: SGD:S000003033
