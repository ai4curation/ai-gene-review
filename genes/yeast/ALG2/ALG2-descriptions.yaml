- source: Alliance_Imported
  text: Mannosyltransferase in the N-linked glycosylation pathway; catalyzes two consecutive
    steps in N-linked glycosylation pathway; mutants exhibit temperature-sensitive
    growth and abnormal accumulation of lipid-linked oligosaccharide Man2GlcNAc2-PP-Dol;
    mutations of human ALG2 cause congenital myasthenic syndrome; human ALG2 complements
    temperature sensitivity and dolichol-linked oligosaccharide biosynthesis defect
    of alg2-1 mutant, but mutant form from a patient with CDG-Ii fails to complement
  source_type: curated
