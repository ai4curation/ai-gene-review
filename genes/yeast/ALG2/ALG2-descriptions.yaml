- source: Alliance_Automated
  text: Enables GDP-Man:Man(1)GlcNAc(2)-PP-Dol alpha-1,3-mannosyltransferase activity;
    GDP-Man:Man(2)GlcNAc(2)-PP-Dol alpha-1,6-mannosyltransferase activity; and initiation-specific
    glycolipid 1,6-alpha-mannosyltransferase activity. Involved in dolichol-linked
    oligosaccharide biosynthetic process. Located in endoplasmic reticulum. Human
    ortholog(s) of this gene implicated in congenital disorder of glycosylation Ii
    and congenital myasthenic syndrome 14. Orthologous to human ALG2 (ALG2 alpha-1,3/1,6-mannosyltransferase).
