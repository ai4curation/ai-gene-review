descriptions:
- source: UniProt
  text: Plays a role in the physiological regulation of the intracellular CoA concentration.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q04430
  source_id: Q04430
- source: Alliance_Imported
  text: Pantothenate kinase, ATP:D-pantothenate 4'-phosphotransferase; cytoplasmic
    enzyme that catalyzes the first committed step in the universal biosynthetic pathway
    for coenzyme A (CoA) synthesis; transcription is regulated by Upc2p via a sterol
    response element; overexpressed human homologs, PANK1 and PANK3, complement yeast
    hypomorphic alleles, while PANK2, a gene implicated in pantothenate-kinase associated
    neurodegeneration, partially complements after the mitochondrial transit peptide
    is removed
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAB1
  source_id: SGD:S000002939
- source: Alliance_Automated
  text: Enables pantothenate kinase activity. Involved in coenzyme A biosynthetic
    process and ergosterol metabolic process. Located in cytoplasm. Used to study
    pantothenate kinase-associated neurodegeneration. Human ortholog(s) of this gene
    implicated in cataract and pantothenate kinase-associated neurodegeneration. Orthologous
    to several human genes including PANK4 (pantothenate kinase 4 (inactive)).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAB1
  source_id: SGD:S000002939
