- term:
    id: GO:0008204
    label: ergosterol metabolic process
  evidence_type: IMP
  original_reference_id: PMID:31409644
  qualifier: involved_in
  review:
    summary: 'IMP (Chiu et al. 2019): altering Cab1 activity changes sterol intermediate levels and antifungal
      susceptibility. The abstract attributes this to changes in expression of ERG genes and sterol intermediates
      downstream of CoA/acetyl-CoA supply; Cab1 does not catalyse any step of ergosterol metabolism. This
      is an indirect, pleiotropic consequence of CoA limitation, which the guidelines say should not be
      captured as involvement in the process.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Indirect effect of CoA supply on sterol metabolism; Cab1 performs no step of ergosterol metabolism.
    supported_by:
    - reference_id: PMID:31409644
      supporting_text: Here, we show that the pantothenate kinase Cab1p, which catalyzes the first step
        in the metabolism of pantothenic acid for CoA biosynthesis in budding yeast (Saccharomyces cerevisiae),
        significantly regulates the levels of sterol intermediates and the activities of ergosterol biosynthesis-targeting
        antifungals.
    - reference_id: PMID:31409644
      supporting_text: Genome-wide transcription and MS-based analyses revealed that this regulation is
        mediated by changes both in the expression of ergosterol biosynthesis genes and in the levels
        of sterol intermediates.
