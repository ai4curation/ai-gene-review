id: Q04430
gene_symbol: CAB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CAB1 (YDR531W) encodes the sole pantothenate kinase of S. cerevisiae, a type II (eukaryotic
  PanK/Fumble-family) enzyme that ATP-dependently phosphorylates (R)-pantothenate (vitamin B5) to 4'-phosphopantothenate,
  the first and rate-limiting step of coenzyme A biosynthesis. CAB1 is essential; a G351S allele causes
  a conditional fatty-acid-synthase-deficient phenotype, and the null can be complemented by bacterial
  coaA and mammalian PanK genes. Cab1 is predominantly cytoplasmic (high-throughput imaging also detects
  it in the nucleus, and a minor pool associates with the mitochondrial outer membrane), and unlike Cab2-Cab5
  it is not part of the CoA-synthesizing protein complex. By controlling CoA supply, Cab1 activity strongly
  influences acetyl-CoA-dependent pathways, including sterol intermediate levels and susceptibility to
  ergosterol-pathway antifungals. Yeast cab1 mutants are used to model human PKAN (PANK2 deficiency).
