suggested_questions:
- question: Is yeast Cab1 feedback-inhibited by acetyl-CoA/malonyl-CoA like mammalian PANKs (UniProt asserts
    this only by similarity), and is this how CoA levels couple to sterol synthesis?
- question: Does the minor mitochondrial-outer-membrane-associated pool of Cab1 have a distinct role in
    mitochondrial CoA supply?
suggested_experiments:
- description: Kinetic analysis of purified Cab1 with acyl-CoA effectors (acetyl-CoA, malonyl-CoA, CoA)
    to establish feedback regulation in yeast.
