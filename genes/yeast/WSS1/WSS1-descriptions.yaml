descriptions:
- source: UniProt
  text: Metalloendopeptidase that acts selectively on DNA-binding proteins. DNA is
    needed to bring the protease and substrates together to enable proteolysis. Involved
    in the repair of toxic DNA-protein cross-links (DPCs) such as covalently trapped
    topoisomerase 1 (TOP1) adducts on DNA lesions or DPCs induced by reactive compounds
    such as formaldehyde. Involved in DNA damage response and processing of stalled
    or collapsed replication forks by removing the covalently trapped TOP1 from chromatin.
    DPC proteolysis enables the repair of the lesions via downstream DNA repair pathways.
    May be recruited to DPCs via the SUMOylation of substrate proteins at damaged
    DNA sites.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38838
  source_id: P38838
- source: Alliance_Imported
  text: SUMO-ligase and SUMO-targeted metalloprotease; involved in DNA repair; removes
    DNA-protein crosslinks at stalled replication forks during replication of damaged
    DNA; clears chromatin-bound sumoylated proteins; localizes to single spot on nuclear
    periphery of mother cells but not daughters; exhibits vacuolar localization upon
    genotoxic stress; activated by DNA binding; member of minigluzincins protease
    family with mammalian DVC1/Spartan
  source_type: curated
  url: https://www.yeastgenome.org/locus/WSS1
  source_id: SGD:S000001176
- source: Alliance_Automated
  text: Enables SUMO binding activity; SUMO ligase activity; and metalloendopeptidase
    activity. Involved in DNA metabolic process; histone catabolic process; and protein
    sumoylation. Located in fungal-type vacuole and nuclear envelope.
  source_type: automated
  url: https://www.yeastgenome.org/locus/WSS1
  source_id: SGD:S000001176
