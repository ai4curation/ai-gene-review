- term:
    id: GO:0000324
    label: fungal-type vacuole
  evidence_type: IDA
  original_reference_id: PMID:26349035
  qualifier: located_in
  review:
    summary: Wss1-GFP accumulates in the vacuole after genotoxic stress (4-NQO) or Top1 overexpression
      in tdp1 cells. Under unstressed conditions it is nuclear.
    action: KEEP_AS_NON_CORE
    reason: The full-text paper shows a direct, condition-dependent localization, so the annotation
      is correct as stated. Wss1 does its DPC-processing work in the nucleus. Vacuolar
      accumulation is a stress-induced fate that the authors link speculatively to autophagy, so it
      is peripheral to the core function. PAINT did not propagate it, and it should not be
      transferred to orthologs.
    supported_by:
    - reference_id: PMID:26349035
      supporting_text: Upon genotoxic stress, Wss1 is vacuolar, suggesting a link between genotoxic stress
        and autophagy involving the Doa1 adapter.
    - reference_id: PMID:26349035
      supporting_text: Unexpectedly, in the absence of Tdp1, stimulating Top1 expression with GAL promoter
        resulted in accumulation of Wss1-GFP within the vacuole
- term:
    id: GO:0004222
    label: metalloendopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:24998930
  qualifier: enables
  review:
    summary: Core activity. Recombinant Wss1 cleaves DNA-bound substrates such as Top1 directly, in
      a DNA-dependent and zinc-dependent manner.
    action: ACCEPT
    reason: This is the defining biochemical activity of Wss1, shown in vitro with purified protein
      (PMID:24998930). Balakirev et al. confirmed it independently (PMID:26349035), with DNA-induced
      and thiol-reagent-induced cleavage of Wss1 itself and of associated proteins, which
      o-phenanthroline inhibits. The crystal structure shows a canonical HExxH...H zinc
      metalloprotease active site (PMID:28811590).
    supported_by:
    - reference_id: PMID:24998930
      supporting_text: in vitro assays indicate that substrates such as topoisomerase 1 are processed by
        the metalloprotease directly and in a DNA-dependent manner
    - reference_id: PMID:26349035
      supporting_text: Activation of Wss1 results in metalloprotease self-cleavage and proteolysis of associated
        proteins.
