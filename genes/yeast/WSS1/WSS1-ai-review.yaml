- term:
    id: GO:0032183
    label: SUMO binding
  evidence_type: IDA
  original_reference_id: PMID:26349035
  qualifier: enables
  review:
    summary: Recombinant Wss1 binds SUMO and preformed poly-SUMO chains, and mutating the
      SUMO-interacting motifs reduces binding.
    action: ACCEPT
    reason: Two labs have reproduced the binding (PMID:20516210, PMID:26349035), and it maps to the
      two C-terminal SIMs that UniProt annotates from mutagenesis. SUMO binding is the
      molecular basis for recruiting Wss1 to sumoylated DPCs and for its SUMO-dependent
      processing of Top1cc in tdp1 cells. The histone-degradation role does not require it
      (PMID:32130911), so it is a substrate-targeting function rather than part of catalysis.
    supported_by:
    - reference_id: PMID:26349035
      supporting_text: The double SIM mutant showed diminished binding
    - reference_id: PMID:20516210
      supporting_text: Wss1, a putative metalloprotease, physically binds SUMO
- term:
    id: GO:0036205
    label: histone catabolic process
  evidence_type: IMP
  original_reference_id: PMID:32130911
  qualifier: involved_in
  review:
    summary: During hydroxyurea-induced replication stress, Wss1 directly degrades core histones that
      bind single-stranded DNA non-covalently. This does not require Cdc48 or SUMO binding.
    action: ACCEPT
    reason: Wss1 itself does the proteolysis, so this is participation and not only necessity. The
      abstract says the histones are degraded directly. The finding extends the core function,
      DNA-dependent proteolysis of DNA-bound proteins, to non-covalent substrates, and accounts for
      wss1 sensitivity to hydroxyurea. Only the abstract is cached. The curators' IMP annotation
      agrees with the abstract, and I defer to them.
    supported_by:
    - reference_id: PMID:32130911
      supporting_text: Wss1 provides cells tolerance to replication stress by directly degrading core histone
        subunits that non-specifically and non-covalently bind to single-stranded DNA
- term:
    id: GO:0061665
    label: SUMO ligase activity
  evidence_type: IDA
  original_reference_id: PMID:26349035
  qualifier: enables
  review:
    summary: In vitro, substoichiometric recombinant Wss1 promoted SUMO chain formation and
      auto-sumoylation, depending on SIM2. The authors call this an "E3-like" SUMO ligase activity.
    action: KEEP_AS_NON_CORE
    reason: The data are direct and the annotation reflects them. The activity is an unusual,
      SIM-dependent juxtaposition mechanism with no catalytic E3 domain, it has not been
      reproduced by other labs, and it is not the established physiological activity of Wss1.
      PAINT did not propagate this term from WSS1. I treat it as a non-core, species-specific
      experimental observation that should not be transferred to orthologs.
    supported_by:
    - reference_id: PMID:26349035
      supporting_text: This E3-like activity depends on SIM2
