- term:
    id: GO:0005635
    label: nuclear envelope
  evidence_type: IDA
  original_reference_id: PMID:18336552
  qualifier: located_in
  review:
    summary: The abstract describes Wss1-GFP as a single sharp spot near the nuclear membrane,
      distinct from the spindle pole bodies and nucleolus, and present only in mother cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: The observation is a nuclear focus adjacent to the nuclear membrane, not a nuclear
      envelope localization. The abstract says the spot is near the membrane, not in it. The later
      study saw diffuse nuclear staining with an occasional focus (PMID:26349035). Wss1 has no
      transmembrane segment or known envelope anchor. Nucleus, already annotated, captures the
      observation; a periphery-associated focus is a finer detail that has not been
      characterised molecularly. Only the abstract is cached. The term is not clearly wrong, but
      it overstates what was seen and should not be transferred.
    supported_by:
    - reference_id: PMID:18336552
      supporting_text: the protein is present in a single sharp spot near the nuclear membrane, distinct
        from the spindle pole bodies and nucleolus
