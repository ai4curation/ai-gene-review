      Wss1-dependent.
  - reference_id: PMID:20516210
    supporting_text: Wss1, a putative metalloprotease, physically binds SUMO
suggested_questions:
- question: Is the SIM-dependent "E3-like" SUMO chain-extension activity of Wss1 (PMID:26349035)
    reproducible at physiological expression levels, and does it contribute to DPC repair?
- question: What is the physiological role of Wss1 self-cleavage? Does it activate the enzyme, limit
    its activity, or mark it for turnover?
- question: What is the single perinuclear focus of Wss1 in mother cells, and is it associated with a
    specific nuclear-periphery structure?
suggested_experiments:
- description: Compare wild-type, E116Q and SIM-mutant Wss1 expressed from the endogenous locus for
    SUMO conjugate levels and auto-sumoylation, to test whether the reported SUMO ligase-like activity
    occurs without overexpression.
- description: Map Wss1 self-cleavage sites and test cleavage-resistant mutants for formaldehyde and
    camptothecin (tdp1) sensitivity, to determine whether autoprocessing is needed for DPC repair.
