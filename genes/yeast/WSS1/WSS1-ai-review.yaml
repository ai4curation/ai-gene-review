id: P38838
gene_symbol: WSS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  Wss1 (weak suppressor of smt3; YHR134W) is a nuclear zinc metalloprotease of the WLM
  (Wss1-like metalloprotease) family and the founding member of the Wss1/SPRTN class of
  DNA-protein crosslink (DPC) proteases. The protein has an N-terminal WLM protease domain
  with an HExxH...H zinc site (His115, Glu116, His119, His125; crystal structure of the
  protease domain solved). C-terminal to this domain lie a DNA-binding region, an SHP box and
  a VIM motif that bind Cdc48, and two SUMO-interacting motifs. Wss1 is a DNA-dependent
  endopeptidase: DNA, especially single-stranded DNA, brings the enzyme and its DNA-bound
  substrates together and activates proteolysis, which includes self-cleavage. In vivo Wss1
  degrades proteins covalently trapped on DNA, such as topoisomerase 1 cleavage complexes and
  formaldehyde-induced crosslinks. It works in parallel with Tdp1, the Ddi1 protease and the
  proteasome, and is assisted by the Cdc48 segregase and its adaptors Doa1 and Ubx5. During
  hydroxyurea-induced replication stress it also degrades core histones bound non-covalently to
  single-stranded DNA. Cells lacking Wss1 accumulate DPCs, show gross chromosomal
  rearrangements, and are sensitive to formaldehyde, camptothecin in a tdp1 background, UV,
  hydroxyurea and oxidants. Wss1 binds SUMO and poly-SUMO chains through its SIMs. One study
  reported a SIM-dependent SUMO chain-extension activity. An earlier report of SUMO
  isopeptidase activity was not reproduced. GFP-tagged Wss1 is nuclear, often in a single
  focus at the nuclear periphery of mother cells, and accumulates in the vacuole under
  genotoxic stress.
