core_functions:
- description: DNA-dependent zinc metalloendopeptidase that proteolyses proteins covalently crosslinked
    to DNA (e.g. topoisomerase 1 cleavage complexes and formaldehyde-induced DPCs) in the nucleus. DNA
    binding brings enzyme and substrate together and activates proteolysis, and the remaining peptide
    adduct is then handled by downstream repair and bypass pathways.
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0106300
    label: protein-DNA covalent cross-linking repair
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:24998930
    supporting_text: in vitro assays indicate that substrates such as topoisomerase 1 are processed by the
      metalloprotease directly and in a DNA-dependent manner
  - reference_id: PMID:28811590
    supporting_text: The catalytic center of ScWss121-148 is a tetrahedron structure composed of the zinc
      ion in the center, as well as three histidines (His-125, His-119, and His-115)
  - reference_id: file:yeast/WSS1/WSS1-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: DR   PANTHER; PTHR46622:SF1; DNA-DEPENDENT METALLOPROTEASE WSS1; 1.
  - reference_id: file:SCHPO/wss1/wss1-bioinformatics/RESULTS-rereview.md
    supporting_text: Q9P7B5 and P38838 share the same zinc-motif arrangement
- description: Degradation of core histones bound non-covalently to single-stranded DNA during
    replication stress. This extends the DNA-dependent protease activity to non-covalent DNA-bound
    substrates and does not require Cdc48 or SUMO binding.
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0036205
    label: histone catabolic process
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:32130911
    supporting_text: Wss1 provides cells tolerance to replication stress by directly degrading core histone
      subunits that non-specifically and non-covalently bind to single-stranded DNA
- description: Binding of SUMO and poly-SUMO chains through two C-terminal SUMO-interacting motifs. This
    targets Wss1, together with Cdc48 and Doa1, to sumoylated DNA-bound proteins, including Top1
    cleavage complexes in cells lacking Tdp1.
  molecular_function:
