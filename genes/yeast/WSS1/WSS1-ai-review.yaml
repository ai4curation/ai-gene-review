- term:
    id: GO:0016925
    label: protein sumoylation
  evidence_type: IDA
  original_reference_id: PMID:26349035
  qualifier: involved_in
  review:
    summary: Wss1 overexpression increased high-molecular-weight SUMO conjugates in cells and promoted
      SUMO chain formation and auto-sumoylation in vitro. This required SIM2 and did not depend on
      known SUMO E3 ligases.
    action: KEEP_AS_NON_CORE
    reason: The full-text data support the annotation as stated. The activity is described as
      E3-like, arises from SIM-mediated juxtaposition of E2~SUMO and acceptor SUMO, has been
      reported by one lab only, and was seen largely under overexpression. Wss1's established
      physiological role is proteolytic. PAINT did not propagate this term from WSS1, consistent
      with its being a study-specific finding rather than an inherited function. It is kept as
      non-core and should not be transferred.
    supported_by:
    - reference_id: PMID:26349035
      supporting_text: This E3-like activity depends on SIM2
    - reference_id: PMID:26349035
      supporting_text: Upon DNA damage Wss1/Cdc48/Doa1 is recruited to sumoylated targets and catalyzes SUMO
        chain extension through a newly recognized SUMO ligase activity.
- term:
    id: GO:0016925
    label: protein sumoylation
  evidence_type: IGI
  original_reference_id: PMID:11606525
  qualifier: involved_in
  supporting_entities:
  - SGD:S000002918
  review:
    summary: WSS1 was isolated as a high-copy suppressor of the temperature-sensitive SUMO allele
      smt3-331.
    action: KEEP_AS_NON_CORE
    reason: This is the same claim as the IDA row and is kept with the same action. The genetic
      evidence on its own is indirect. High-copy suppression of smt3-331 shows a functional link to
      SUMO but does not show that Wss1 conjugates SUMO. Balakirev et al. later found that the
      suppression requires both SIM2 and an intact protease domain (PMID:26349035), so it may
      reflect clearance of toxic SUMO conjugates rather than sumoylation itself.
    supported_by:
    - reference_id: PMID:11606525
      supporting_text: the isolation of WSS1, a high-copy smt3 suppressor
    - reference_id: PMID:26349035
      supporting_text: The ts-suppression required both correct SUMO binding via SIM2 and an intact protease
        domain
