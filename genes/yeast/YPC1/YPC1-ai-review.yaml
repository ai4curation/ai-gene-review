taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Ypc1 (YBR183W) is an alkaline ceramidase of Saccharomyces cerevisiae, a multi-pass endoplasmic reticulum
  membrane protein of the ACER family (homologous to human ACER3) that localizes to the cortical ER. It hydrolyses
  phytoceramide (preferred) and dihydroceramide, but not unsaturated mammalian-type ceramide, to a free long-chain
  base and fatty acid (EC 3.5.1.23). Uniquely among the two yeast ceramidases, Ypc1 has substantial reverse activity:
  it condenses free fatty acid with phytosphingosine or dihydrosphingosine to make ceramide without acyl-CoA, an
  activity that is resistant to fumonisin B1 and in vivo prefers C24/C26 fatty acids. This reverse reaction is a
  minor ceramide source in wild-type cells but sustains sphingolipid synthesis when the acyl-CoA-dependent ceramide
  synthases Lag1 and Lac1 are absent. YPC1 is not essential; it contributes to H2O2 resistance and shortens chronological
  life span under caloric restriction.'
