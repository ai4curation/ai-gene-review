suggested_questions:
- question: UniProt lists RHEA:38891 (unsaturated C16-ceramide hydrolysis) for Ypc1 citing PMID:10702247, whose
    abstract states Ypc1 does not hydrolyse unsaturated ceramide; should this reaction be removed from the entry?
- question: Should GO represent CoA-independent (reverse ceramidase) ceramide synthesis distinctly from acyl-CoA-dependent
    ceramide synthase (GO:0050291), to avoid mis-annotation of alkaline ceramidases?
suggested_experiments:
- description: Measure in vivo flux through Ypc1 reverse activity with stable-isotope-labelled fatty acids in a
    lag1 lac1 background versus wild type to quantify its contribution to very-long-chain ceramide pools.
