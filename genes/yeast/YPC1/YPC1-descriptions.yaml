descriptions:
- source: UniProt
  text: Alkaline ceramidase that hydrolyzes phytoceramide and also dihydroceramide
    into phytosphingosine or dihydrosphingosine. Prefers phytoceramide. Also has reverse
    activity as acyl-CoA-independent ceramide synthase, catalyzing synthesis of phytoceramide
    and dihydroceramide from palmitic acid and phytosphingosine or dihydrosphingosine.
    Is not responsible for the breakdown of unsaturated ceramide (PubMed:10702247,
    PubMed:10900202, PubMed:11694577, PubMed:24866405). Preferentially uses very long
    chain fatty acids (C-24 and C-26) in vivo compared to C-16 in vitro (PubMed:24866405).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38298
