descriptions:
- source: UniProt
  text: Alkaline ceramidase that hydrolyzes phytoceramide and also dihydroceramide
    into phytosphingosine or dihydrosphingosine. Prefers phytoceramide. Also has reverse
    activity as acyl-CoA-independent ceramide synthase, catalyzing synthesis of phytoceramide
    and dihydroceramide from palmitic acid and phytosphingosine or dihydrosphingosine.
    Is not responsible for the breakdown of unsaturated ceramide (PubMed:10702247,
    PubMed:10900202, PubMed:11694577, PubMed:24866405). Preferentially uses very long
    chain fatty acids (C-24 and C-26) in vivo compared to C-16 in vitro (PubMed:24866405).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38298
  source_id: P38298
- source: Alliance_Imported
  text: Alkaline ceramidase; also has reverse (CoA-independent) ceramide synthase
    activity; catalyzes both breakdown and synthesis of phytoceramide; overexpression
    confers fumonisin B1 resistance; YPC1 has a paralog, YDC1, that arose from the
    whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/YPC1
  source_id: SGD:S000000387
- source: Alliance_Automated
  text: Enables N-acylsphingosine amidohydrolase activity and sphingosine N-acyltransferase
    activity. Involved in ceramide biosynthetic process and ceramide catabolic process.
    Located in cortical endoplasmic reticulum and endoplasmic reticulum membrane.
    Used to study leukodystrophy. Human ortholog(s) of this gene implicated in early
    childhood-onset progressive leukodystrophy. Orthologous to human ACER3 (alkaline
    ceramidase 3).
  source_type: automated
  url: https://www.yeastgenome.org/locus/YPC1
  source_id: SGD:S000000387
