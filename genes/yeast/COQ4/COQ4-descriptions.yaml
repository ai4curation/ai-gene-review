descriptions:
- source: UniProt
  text: Lyase that catalyzes the C1-decarboxylation of 4-hydroxy-3- methoxy-5-(all-trans-hexaprenyl)benzoic
    acid into 2-methoxy-6-(all- trans-hexaprenyl)phenol during ubiquinone biosynthesis
    (By similarity). May play a role in organizing a multi-subunit COQ enzyme complex
    required for coenzyme Q biosynthesis (PubMed:15548532, PubMed:17391640, PubMed:19022396).
    Required for steady-state levels of COQ3, COQ4, COQ6, COQ7 and COQ9 polypeptides
    (PubMed:15548532, PubMed:17391640, PubMed:19022396).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O13525
  source_id: O13525
- source: Alliance_Imported
  text: Protein with a role in ubiquinone (Coenzyme Q) biosynthesis; possibly functioning
    in stabilization of Coq7p; located on matrix face of mitochondrial inner membrane;
    component of a mitochondrial ubiquinone-synthesizing complex; human homolog COQ4
    can complement yeast coq4 null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/COQ4
  source_id: SGD:S000002612
- source: Alliance_Automated
  text: Predicted to enable 4-hydroxy-3-methoxy-5-polyprenylbenzoate decarboxylase
    activity. Involved in ubiquinone biosynthetic process. Located in mitochondrial
    inner membrane. Is extrinsic component of mitochondrial inner membrane. Used to
    study coenzyme Q10 deficiency disease. Human ortholog(s) of this gene implicated
    in primary coenzyme Q10 deficiency 7 and spastic ataxia. Orthologous to human
    COQ4 (coenzyme Q4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/COQ4
  source_id: SGD:S000002612
