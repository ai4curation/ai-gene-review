id: O13525
gene_symbol: COQ4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  COQ4 (YDR204W) encodes a mitochondrial protein of the COQ4 family that is required for coenzyme Q6
  biosynthesis. Coq4 is a peripheral membrane protein on the matrix face of the inner mitochondrial
  membrane and is a central organizer of the CoQ synthome (the multi-subunit complex of Coq3, Coq4, Coq5,
  Coq6, Coq7 and Coq9), being needed for the steady-state levels of several other Coq polypeptides.
  Catalytically, Coq4 carries out the C1 oxidative decarboxylation of the polyprenylated ring intermediate,
  a single oxygen-dependent step that replaces both the bacterial UbiD/UbiX decarboxylase and the UbiH
  C1 hydroxylase; yeast Coq4 shows this activity when expressed in Escherichia coli ubiD and ubiD ubiH
  mutants and in Corynebacterium glutamicum. The protein carries the conserved HDxxH(x)11E metal-binding
  motif, and the human ortholog binds zinc. coq4 null mutants make no CoQ and accumulate
  3-hexaprenyl-4-hydroxybenzoate.
