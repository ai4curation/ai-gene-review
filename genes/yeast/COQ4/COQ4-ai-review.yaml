proposed_new_terms:
- proposed_name: polyprenylhydroxybenzoate oxidative decarboxylase activity
  proposed_definition: >-
    Catalysis of the O2-dependent oxidative decarboxylation of a ring-carboxylated polyprenyl
    benzoate intermediate of coenzyme Q biosynthesis (such as
    4-hydroxy-3-methoxy-5-polyprenylbenzoate), removing the C1 carboxyl group and introducing
    the C1 hydroxyl group in a single step.
  justification: >-
    GO:0120539 is defined as a non-oxidative decarboxylation to 2-methoxy-6-polyprenylphenol,
    and GO:0120538 assigns the C1 hydroxylation to a separate ferredoxin-dependent enzyme
    (Coq6), but Pelosi et al. show that COQ4 performs both C1 reactions as one oxidative
    decarboxylation. COQ4 reviews (yeast, S. pombe, human) and ubiquinone_biosynthesis use
    GO:0120539 for want of a matching term.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  supported_by:
  - reference_id: PMID:38295803
    supporting_text: >-
      these two reactions occur in a single oxidative decarboxylation step catalyzed by COQ4
suggested_questions:
- question: >-
    GO:0120539 is defined as a non-oxidative decarboxylation to 2-methoxy-6-polyprenylphenol, but Pelosi
    et al. (PMID:38295803) report an O2-dependent oxidative decarboxylation that yields the C1-hydroxylated
    product in one step and can act on non-methoxylated polyprenyl-4-hydroxybenzoates. Should GO add an
    oxidative-decarboxylase term for COQ4, and should GO:0120538 (ferredoxin-dependent C1 hydroxylase)
    be withdrawn from Coq6 orthologs?
suggested_experiments:
- description: >-
    Reconstitute purified, zinc-loaded yeast Coq4 with polyprenyl-4-hydroxybenzoate and
    4-hydroxy-3-methoxy-5-polyprenylbenzoate in vitro under aerobic and anaerobic conditions to identify
    the true substrate, product and oxidant of the C1 reaction.
