id: O13525
gene_symbol: COQ4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: >-
  COQ4 (YDR204W) encodes a mitochondrial protein of the COQ4 family that is required for coenzyme Q6 biosynthesis.
  Coq4 is a peripheral membrane protein on the matrix face of the inner mitochondrial membrane and is
  a central organizer of the CoQ synthome (the multi-subunit complex of Coq3, Coq4, Coq5, Coq6, Coq7 and
  Coq9), being needed for the stability of several other Coq polypeptides. Catalytically, COQ4 family
  proteins carry out the C1 oxidative decarboxylation of the ring intermediate 4-hydroxy-3-methoxy-5-polyprenylbenzoate,
  replacing both the bacterial UbiD/UbiX decarboxylase and the UbiH C1 hydroxylase; the enzyme is predicted
  to use a zinc cofactor. coq4 null mutants make no CoQ and accumulate 3-hexaprenyl-4-hydroxybenzoate.
