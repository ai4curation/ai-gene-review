  label: Saccharomyces cerevisiae S288C
description: Tkl2 (YBR117C) is the minor transketolase (EC 2.2.1.1) of Saccharomyces cerevisiae, a paralog of Tkl1 (71% identity)
  belonging to the ThDP-dependent transketolase family. When overexpressed in a tkl1 background it provides measurable transketolase
  activity and rescues the aromatic amino acid requirement of the tkl1 tkl2 double mutant, showing it is a functional transketolase
  of the non-oxidative pentose phosphate pathway, supplying erythrose 4-phosphate and interconverting pentose phosphates with
  glycolytic intermediates. Under standard growth conditions Tkl2 is a very low-abundance protein, tkl2 single mutants have
  no significant phenotype and no reduction in transketolase activity, and its contribution becomes apparent only in the absence
  of Tkl1. Tkl2 is cytoplasmic and can form heteromers with Tkl1.
