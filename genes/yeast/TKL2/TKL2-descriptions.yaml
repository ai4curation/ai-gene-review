    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Same wording as TKL1. 'Needed for synthesis of aromatic amino acids'
      holds only in the absence of Tkl1, and the text does not say Tkl2 is minor.
- source: Alliance_Automated
  text: Predicted to enable transketolase activity. Involved in pentose-phosphate
    shunt. Located in cytoplasm and nucleus. Human ortholog(s) of this gene implicated
    in congenital heart disease. Orthologous to human TKT (transketolase); TKTL1 (transketolase
    like 1); and TKTL2 (transketolase like 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TKL2
