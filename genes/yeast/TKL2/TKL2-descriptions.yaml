gene_symbol: TKL2
organism: yeast
uniprot_id: P33315
taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Catalyzes the transfer of a two-carbon ketol group from a ketose donor to
    an aldose acceptor, via a covalent intermediate with the cofactor thiamine pyrophosphate
    (By similarity). Thus, catalyzes the reversible transfer of a two-carbon ketol
    group from sedoheptulose- 7-phosphate to glyceraldehyde-3-phosphate, producing
    xylulose-5- phosphate and ribose-5-phosphate (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33315
  source_id: P33315
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: The reaction is given by similarity. Does not say that Tkl2 is
      the minor isoform with no single-mutant phenotype.
- source: Alliance_Imported
  text: Transketolase; catalyzes conversion of xylulose-5-phosphate and ribose-5-phosphate
    to sedoheptulose-7-phosphate and glyceraldehyde-3-phosphate in the pentose phosphate
    pathway; needed for synthesis of aromatic amino acids; TKL2 has a paralog, TKL1,
    that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/TKL2
  source_id: SGD:S000000321
  review:
