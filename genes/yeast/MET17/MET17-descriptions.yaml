descriptions:
- source: UniProt
  text: Catalyzes the conversion of O-acetyl-L-homoserine (OAH) into homocysteine
    in the methionine biosynthesis pathway (PubMed:36379252, PubMed:36455053, PubMed:4609980,
    PubMed:7765825, PubMed:795806). Required to efficiently reduce toxic levels of
    hydrogen sulfide generated when the sulfate assimilation pathway (SAP) is active
    (PubMed:36379252, PubMed:36455053). Also catalyzes the conversion of O- acetylserine
    (OAS) into cysteine, the last step in the cysteine biosynthesis pathway (PubMed:36455053,
    PubMed:4609980, PubMed:7765825, PubMed:795806). However, it seems that in S.cerevisiae
    cysteine biosynthesis occurs exclusively through the cystathionine pathway and
    not via direct incorporation of sulfur into OAS (PubMed:1732168). It therefore
    has no metabolic role in cysteine biosynthesis and may only have a regulatory
    role controlling OAS levels (PubMed:12586406).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P06106
  source_id: P06106
- source: Alliance_Imported
  text: O-acetyl homoserine-O-acetyl serine sulfhydrylase; involved in methionine
    and cysteine biosynthesis; long considered essential for inorganic sulfur assimilation,
    but inefficient homocysteine synthase Hsu1p enables met17 null cells to assimilate
    enough inorganic sulfur for survival and proliferation; growth failure of met17
    null can be explained by toxic accumulation of H2S gas due to a metabolic bottleneck
  source_type: curated
  url: https://www.yeastgenome.org/locus/MET17
  source_id: SGD:S000004294
- source: Alliance_Automated
  text: Enables O-acetylhomoserine sulfhydrylase activity and cysteine synthase activity.
    Involved in L-homocysteine biosynthetic process; L-methionine biosynthetic process;
    and sulfate assimilation. Located in cytoplasm and plasma membrane.
  source_type: automated
  url: https://www.yeastgenome.org/locus/MET17
  source_id: SGD:S000004294
