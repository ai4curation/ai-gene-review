id: P06106
gene_symbol: MET17
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: O-acetylhomoserine sulfhydrylase / homocysteine synthase (Met17, also known as Met15 or Met25; EC 2.5.1.49)
  of Saccharomyces cerevisiae. This PLP-dependent cytoplasmic enzyme fixes sulfide produced by the sulfate assimilation
  pathway onto O-acetyl-L-homoserine to form L-homocysteine, the precursor of methionine, S-adenosylmethionine and
  (via cystathionine) cysteine. The purified enzyme also sulfhydrylates O-acetyl-L-serine to cysteine in vitro,
  but yeast lacks serine acetyltransferase and makes cysteine by transsulfuration, so this secondary activity has
  no known metabolic role. met17 cells were long considered organic-sulfur auxotrophs; they can in fact assimilate
  inorganic sulfur via the weaker homocysteine synthase Hsu1 (Yll058w), but fail to grow under standard conditions
  largely because of hydrogen sulfide accumulation.
