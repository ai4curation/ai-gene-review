id: P43635
gene_symbol: CIT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'CIT3 encodes a minor mitochondrial citrate synthase of Saccharomyces cerevisiae with dual
  specificity: it condenses oxaloacetate with either acetyl-CoA (citrate synthase) or propionyl-CoA (2-methylcitrate
  synthase) with similar catalytic efficiency. Cit3p is imported into mitochondria and is regulated like
  CIT1. It contributes to TCA-cycle citrate synthesis (CIT3 deletion in a cit1 background severely reduces
  respiratory growth) and is the mitochondrial methylcitrate synthase of the 2-methylcitrate cycle that
  converts propionyl-CoA to pyruvate; cit3 mutants fail to metabolise propionate to pyruvate and accumulate
  acetate and isobutanol from pyruvate.'
