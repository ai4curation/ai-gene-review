  text: Dual specificity mitochondrial citrate and methylcitrate synthase; catalyzes
    the condensation of acetyl-CoA and oxaloacetate to form citrate and that of propionyl-CoA
    and oxaloacetate to form 2-methylcitrate
  source_type: curated
  url: https://www.yeastgenome.org/locus/CIT3
  source_id: SGD:S000006205
- source: Alliance_Automated
  text: Enables 2-methylcitrate synthase activity and citrate synthase activity. Involved
    in propionate catabolic process and tricarboxylic acid cycle. Located in mitochondrion.
    Human ortholog(s) of this gene implicated in dilated cardiomyopathy and hypertrophic
    cardiomyopathy. Orthologous to human CS (citrate synthase).
