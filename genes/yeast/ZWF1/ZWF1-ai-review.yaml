suggested_questions:
- question: Which non-NADPH roles of Zwf1 underlie the failure of zwf1 cells to adapt to H2O2, as suggested by glutathione-reductase-independent
    sensitivity?
suggested_experiments:
- description: Restore cytosolic NADPH in zwf1 cells with an orthogonal NADPH source (e.g. heterologous NADP-dependent dehydrogenase)
    and test whether H2O2 adaptation and organic-sulfur independence are rescued.
