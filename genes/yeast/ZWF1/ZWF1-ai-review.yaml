id: P11412
gene_symbol: ZWF1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Zwf1 (YNL241C, also MET19) is the sole glucose-6-phosphate 1-dehydrogenase (G6PD, EC 1.1.1.49) of Saccharomyces
  cerevisiae. It oxidises D-glucose 6-phosphate to 6-phospho-D-glucono-1,5-lactone with reduction of NADP+, the first and
  rate-controlling step of the oxidative pentose phosphate pathway, and is a principal source of cytosolic NADPH. zwf1 null
  mutants grow normally on rich glucose media but require an organic sulfur source (methionine, cysteine, AdoMet or glutathione),
  reflecting the NADPH demand of sulfate assimilation, and are hypersensitive to hydrogen peroxide and other oxidants, with
  a lowered cytosolic NADPH/NADP+ ratio, poor glutathione recycling and failure to mount an adaptive response to H2O2. Loss
  of Zwf1 suppresses the glucose-negative phenotype of 6-phosphogluconate dehydrogenase mutants. ZWF1 transcription is repressed
  by elevated AdoMet. Zwf1 is a cytosolic protein homologous to human G6PD.
