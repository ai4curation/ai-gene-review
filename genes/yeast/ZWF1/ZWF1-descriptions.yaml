  text: Enables glucose-6-phosphate dehydrogenase activity. Involved in pentose-phosphate
    shunt, oxidative branch and response to hydrogen peroxide. Located in cytoplasm.
    Used to study congenital nonspherocytic hemolytic anemia. Human ortholog(s) of
    this gene implicated in several diseases, including anemia (multiple); bilirubin
    metabolic disorder; cerebrovascular disease; malaria (multiple); and neonatal
    jaundice. Orthologous to human G6PD (glucose-6-phosphate dehydrogenase).
