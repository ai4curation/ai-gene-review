descriptions:
- source: UniProt
  text: Catalyzes the rate-limiting step of the oxidative pentose- phosphate pathway,
    which represents a route for the dissimilation of carbohydrates besides glycolysis.
    The main function of this enzyme is to provide reducing power (NADPH) and pentose
    phosphates for fatty acid and nucleic acid synthesis (By similarity).
