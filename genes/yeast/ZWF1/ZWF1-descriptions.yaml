- source: Alliance_Imported
  text: Glucose-6-phosphate dehydrogenase (G6PD); catalyzes the first step of the
    pentose phosphate pathway; involved in adaptation to oxidative stress; negative
    regulator of nonselective autophagy, independent of Stb5p; protein abundance increases
    in response to DNA replication stress; homolog of human G6PD which is deficient
    in patients with hemolytic anemia; human G6PD can complement yeast zwf1 null mutant
