gene_symbol: ZWF1
organism: yeast
uniprot_id: P11412
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the rate-limiting step of the oxidative pentose- phosphate pathway,
    which represents a route for the dissimilation of carbohydrates besides glycolysis.
    The main function of this enzyme is to provide reducing power (NADPH) and pentose
    phosphates for fatty acid and nucleic acid synthesis (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P11412
  source_id: P11412
- source: Alliance_Imported
  text: Glucose-6-phosphate dehydrogenase (G6PD); catalyzes the first step of the
    pentose phosphate pathway; involved in adaptation to oxidative stress; negative
    regulator of nonselective autophagy, independent of Stb5p; protein abundance increases
    in response to DNA replication stress; homolog of human G6PD which is deficient
    in patients with hemolytic anemia; human G6PD can complement yeast zwf1 null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/ZWF1
  source_id: SGD:S000005185
- source: Alliance_Automated
  text: Enables glucose-6-phosphate dehydrogenase activity. Involved in pentose-phosphate
    shunt, oxidative branch and response to hydrogen peroxide. Located in cytoplasm.
    Used to study congenital nonspherocytic hemolytic anemia. Human ortholog(s) of
    this gene implicated in several diseases, including anemia (multiple); bilirubin
    metabolic disorder; cerebrovascular disease; malaria (multiple); and neonatal
    jaundice. Orthologous to human G6PD (glucose-6-phosphate dehydrogenase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ZWF1
  source_id: SGD:S000005185
