- id: file:yeast/YAR1/YAR1-hypotheses/function-hypothesis-go-0001228/openscientist.md
  title: OpenScientist hypothesis review of YAR1 GO:0001228
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The report documents a small ankyrin architecture lacking an identified
      DNA-binding domain.
    supporting_text: The protein contains only two ankyrin repeats (residues 49–121)
      and no recognizable DNA-binding domain.
    reference_section_type: RESULTS
  - statement: The report explicitly lacks a target transcription-complex interaction
      test.
    supporting_text: Whether YAR1 interacts with SWI4/SWI6/MBP1
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The domain distinction informs GO:0001228, but domain absence and
      bulk acidity were not by themselves sufficient for the BP and MBF/SBF rows because
      non-DNA-binding subunits need not carry APSES. The REMOVE conclusion is now
      independently corroborated by the recovered PTHR24198 PAINT table, Complex Portal
      CPX-946/CPX-950, and IntAct.
- id: file:yeast/YAR1/YAR1-hypotheses/transcriptional-regulation-and-mbf-sbf-membership/openscientist.md
  title: OpenScientist focused review of YAR1 transcription and MBF/SBF membership
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The focused report found no primary experimental evidence that Yar1
      directly regulates Pol II transcription or belongs to MBF or SBF.
    supporting_text: There is **no primary experimental evidence** that Yar1 promotes
      RNA Pol II transcription or is a subunit of the MBF
    reference_section_type: RESULTS
  - statement: The focused report found that curated SBF and MBF complex definitions
      contain Swi4/Swi6 and Mbp1/Swi6, respectively, but not Yar1.
    supporting_text: SBF (CPX-946) = Swi4 + Swi6; MBF (CPX-950) = Mbp1 + Swi6; **Yar1/P46683
      absent from both**
    reference_section_type: RESULTS
  - statement: The focused report found that Yar1's curated IntAct interactome lacks
      Swi4, Swi6, and Mbp1.
    supporting_text: 15 records; partners = Rps3, Ltv1 + Hsp70/Hsp40 chaperones (Ssa1/2,
      Ssb1, Sse1, Sis1, Ydj1, Hsp78/26, Erj5, Ess1, Sfm1); **no Swi4/Swi6/Mbp1**
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Local focused report; its PTHR24198 PAINT provenance was cross-checked
      against the cached PAINT table, and Complex Portal/IntAct API checks confirmed
      the reported absence of Yar1 from CPX-946/CPX-950 and from curated Swi4/Swi6/Mbp1
      interactions.
