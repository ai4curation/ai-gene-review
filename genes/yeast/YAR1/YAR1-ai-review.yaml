        source_label: PTN000917496
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The source node includes APSES-domain transcription factors such
          as SWI4/MBP1; YAR1 shares ankyrin repeats but lacks the DNA-binding domain
          that confers GO:0001228 activity.
