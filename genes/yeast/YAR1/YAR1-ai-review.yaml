  description: >-
    Yar1 is a dedicated carrier chaperone for Rps3. It binds nascent Rps3,
    maintains Rps3 solubility, and accompanies Rps3 from cytoplasm to nucleus so
    it can be incorporated into pre-40S ribosomal particles.
  supported_by:
  - reference_id: PMID:22570489
    supporting_text: Yar1 protects Rps3 from aggregation in vitro and increases its solubility in vivo.
  - reference_id: PMID:26112308
    supporting_text: Affinity purification of four chaperones (Rrb1, Syo1, Sqt1 and Yar1) selectively enriched the mRNAs encoding their specific ribosomal protein clients (Rpl3, Rpl5, Rpl10 and Rps3).
  - reference_id: file:yeast/YAR1/YAR1-deep-research-falcon.md
    supporting_text: >-
      Yar1 is **not an enzyme** and no catalytic reaction has been assigned in
      the cited primary literature; rather, it is best understood as an
      **anti-aggregation, escort-type chaperone** whose function is implemented
      by **direct binding** to its client ribosomal protein Rps3
      (koch2012yar1protectsthe pages 1-2, koch2012yar1protectsthe pages 2-3).
proposed_new_terms: []
suggested_questions:
- question: Do endogenous Yar1 interaction or localization data support a secondary role with MBF/SBF
    or another transcription complex, distinct from its Rps3 chaperoning function?
suggested_experiments:
- description: >-
    Test whether point mutations that disrupt the Yar1-Rps3 interface abolish
    Rps3 solubility and nuclear delivery without broadly altering stress-response
    pathways.
