- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The DNA-binding activator transfer is unlikely for the small Rps3-chaperone
      architecture.
    action: REMOVE
    reason: The target consists of a small ankyrin-repeat protein and lacks the APSES
      DNA-binding domain of SWI4/MBP1-like DNA-binding activators. Its established
      client-binding architecture and specific Rps3 chaperoning support rejection
      of this particular DNA-binding MF. This is a domain-specific judgment, not proof
      that an ankyrin protein cannot regulate transcription or join a transcription
      complex. The provider did not reconstruct the PAINT tree, and whole-protein
      acidity alone is not a DNA-binding exclusion test.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
