    label: MBF transcription complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: MBF membership is over-propagated from an ankyrin-repeat node that includes
      true MBF/SBF subunits.
    action: REMOVE
    reason: PTN000917496 currently carries MBF-complex membership from experimentally
      grounded fungal transcription factors, but Yar1 has target-specific Rps3 carrier-chaperone
      evidence and no curated placement in MBF. The focused MBF/SBF reassessment verified
      that the curated yeast MBF complex contains Mbp1 and Swi6 and not Yar1, and
      that Yar1 lacks Swi4, Swi6, or Mbp1 among its curated IntAct partners. Shared
      ankyrin repeats explain why the family groups Yar1 near MBF/SBF factors, but
      they are generic interaction modules and not evidence that the compact YAR1/Rps3-chaperone
      branch retained MBF membership.
    propagation_review:
