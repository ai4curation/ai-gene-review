id: P46683
gene_symbol: YAR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  YAR1 encodes an ankyrin repeat protein that functions as a dedicated chaperone
  for the small ribosomal subunit protein Rps3. Yar1 binds newly synthesized Rps3,
  prevents Rps3 aggregation, supports its solubility and nuclear delivery, and
  thereby promotes small ribosomal subunit biogenesis and export.
existing_annotations:
- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The DNA-binding activator transfer is unlikely for the small Rps3-chaperone architecture.
    action: REMOVE
    reason: The target consists of a small ankyrin-repeat protein and lacks the APSES DNA-binding domain
      of SWI4/MBP1-like DNA-binding activators. Its established client-binding architecture and specific
      Rps3 chaperoning support rejection of this particular DNA-binding MF. This is a domain-specific
      judgment, not proof that an ankyrin protein cannot regulate transcription or join a transcription
      complex. The provider did not reconstruct the PAINT tree, and whole-protein acidity alone is not
      a DNA-binding exclusion test.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000917496
        source_label: PANTHER:PTN000917496
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The source node includes APSES-domain transcription factors such as SWI4/MBP1; YAR1 shares
          ankyrin repeats but lacks the DNA-binding domain that confers GO:0001228 activity.
    additional_reference_ids:
    - file:interpro/panther/PTHR24198/PTHR24198-paint.tsv
    supported_by:
    - reference_id: PMID:22570489
      supporting_text: Yar1 directly interacts with the small ribosomal subunit protein Rps3 and accompanies
        newly synthesized Rps3 from the cytoplasm into the nucleus where Rps3 is assembled into pre-ribosomal
        subunits.
    - reference_id: file:yeast/YAR1/YAR1-hypotheses/function-hypothesis-go-0001228/openscientist.md
      supporting_text: The protein contains only two ankyrin repeats (residues 49–121) and no recognizable
        DNA-binding domain.
