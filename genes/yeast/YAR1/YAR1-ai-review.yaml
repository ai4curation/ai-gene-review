id: P46683
gene_symbol: YAR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: YAR1 encodes an ankyrin repeat protein that functions as a dedicated
  chaperone for the small ribosomal subunit protein Rps3. Yar1 binds newly synthesized
  Rps3, prevents Rps3 aggregation, supports its solubility and nuclear delivery, and
  thereby promotes small ribosomal subunit biogenesis and export.
