    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The transcription-regulatory or complex-membership inference requires a role-specific assessment.
    action: UNDECIDED
    reason: Absence of an APSES DNA-binding domain challenges the DNA-binding activator MF but does not
      exclude a non-DNA-binding transcriptional subunit or regulator; Swi6/Cdc10-like source roles make
