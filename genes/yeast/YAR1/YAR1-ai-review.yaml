- id: file:yeast/YAR1/YAR1-hypotheses/function-hypothesis-go-0001228/openscientist.md
  title: OpenScientist hypothesis review of YAR1 GO:0001228
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The report documents a small ankyrin architecture lacking an identified DNA-binding
      domain.
    supporting_text: The protein contains only two ankyrin repeats (residues 49–121) and no recognizable
      DNA-binding domain.
    reference_section_type: RESULTS
  - statement: The report explicitly lacks a target transcription-complex interaction test.
    supporting_text: Whether YAR1 interacts with SWI4/SWI6/MBP1
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'The domain distinction informs GO:0001228, but blanket removal of regulation/MBF/SBF
      does not follow: non-DNA-binding subunits need not carry APSES. Bulk acidity is not a sufficient
      exclusion test, and actual PAINT topology was not recovered.'
