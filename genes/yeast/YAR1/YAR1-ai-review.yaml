    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Positive Pol II transcription regulation is over-propagated through a
      broad ankyrin-repeat PAINT node.
    action: REMOVE
    reason: The current PAINT snapshot still places positive regulation of Pol II
      transcription at PTN000917496, a broad ankyrin-repeat fungal node that also
      covers genuine Swi4/Mbp1/Swi6-like transcription factors. A focused reassessment
      found no primary evidence that YAR1 promotes Pol II transcription and no MBF/SBF
      or IntAct support for contact with Swi4, Swi6, or Mbp1. Instead, the accessible
      direct literature places Yar1 on newly synthesized Rps3, whose solubility and
      delivery to pre-40S particles it supports. The broad ankyrin repeat is therefore
      the wrong basis for propagating a transcription-regulator BP term onto the Rps3
      chaperone branch.
