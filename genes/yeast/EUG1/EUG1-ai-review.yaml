- id: PMID:1406650
  title: The yeast EUG1 gene encodes an endoplasmic reticulum protein that is functionally related to protein disulfide isomerase.
  findings:
  - statement: >-
      Eug1p is a soluble ER protein induced by ER protein accumulation;
      overexpression can support growth without Pdi1p but only partially
      restores a vacuolar glycoprotein-folding phenotype.
    supporting_text: >-
      The product of the EUG1 gene of Saccharomyces cerevisiae is a soluble
      endoplasmic reticulum protein with homology to both the mammalian protein
      disulfide isomerase (PDI) and the yeast PDI homolog encoded by the essential
      PDI1 gene.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary characterization of EUG1. The cache is
      abstract-only; conclusions are limited to statements visible in that
      abstract.
- id: PMID:11485577
  title: Mutation of yeast Eug1p CXXS active sites to CXXC results in a dramatic increase in protein disulphide isomerase activity.
  findings:
  - statement: >-
      Native CXXS Eug1p has very little oxidative-refolding or isomerase-only
      activity, whereas CXXC mutants approach genuine PDI activity; the authors
      conclude that general disulfide isomerization is not its main in-vivo
      function.
    supporting_text: >-
      The wild-type protein showed very little activity, not only in oxidative
      refolding but also in assays where only isomerase activity was required.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary biochemical study that directly distinguishes
      native Eug1p from engineered CXXC variants. The cache is abstract-only.
- id: PMID:11157982
  title: Functional differences in yeast protein disulfide isomerases.
  findings:
  - statement: >-
      Eug1p is not functionally interchangeable with Pdi1p: EUG1 suppression
      of pdi1 deletion requires endogenous CXXC-containing homologues, and PDI
      family mutant combinations impair CPY folding.
    supporting_text: >-
      This shows that the homologues are not functionally interchangeable.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified genetic analysis central to defining Eug1p as a
      cooperative auxiliary component of the ER redox-folding network. The
      cache is abstract-only, so assay-level claims defer to curator review.
