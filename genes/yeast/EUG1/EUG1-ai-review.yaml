core_functions:
- description: >-
    Specialized auxiliary ER redox-folding factor in the PDI family. Eug1p's
    two CXXS active sites confer very weak native classical oxidative-refolding
    and isomerase activity, and genetic evidence places it in a cooperative,
    noninterchangeable network with CXXC-containing PDI homologues that supports
    folding of secretory-pathway clients.
  molecular_function:
    id: GO:0003756
    label: protein disulfide isomerase activity
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - id: GO:0005788
    label: endoplasmic reticulum lumen
  supported_by:
  - reference_id: PMID:11485577
    supporting_text: These results lead us to propose that general disulphide isomerization is not the main function of Eug1p in vivo.
  - reference_id: PMID:11157982
    supporting_text: This shows that the homologues are not functionally interchangeable.
proposed_new_terms: []
suggested_questions:
- question: Which native ER client proteins depend selectively on Eug1p rather than Pdi1p, Mpd1p, Mpd2p, or Eps1p?
- question: Does native CXXS Eug1p primarily rearrange particular client disulfides, or does it have a distinct noncatalytic role not captured by current GO terms?
suggested_experiments:
- description: >-
    Compare wild-type Eug1p and CXXC-engineered variants on identified native ER
    client substrates at endogenous expression, measuring oxidation state,
    folding kinetics, and secretion.
- description: >-
    Combine acute depletion of individual PDI-family members with client-level
    redox proteomics to identify Eug1p-selective substrates and distinguish
    catalytic cooperation from generic stress induction.
