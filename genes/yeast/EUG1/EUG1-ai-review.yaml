id: P32474
gene_symbol: EUG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  EUG1 encodes a soluble endoplasmic-reticulum-lumen protein disulfide
  isomerase (PDI) family member with two atypical CXXS active-site motifs.
  Eug1p is induced when proteins accumulate in the ER and participates in the
  cooperative redox folding of secretory-pathway clients. Native Eug1p has
  very weak classical oxidative-refolding and disulfide-isomerase activity
  relative to Pdi1p, and it cannot by itself supply all essential Pdi1p
  functions, indicating a specialized auxiliary role in ER protein folding.
