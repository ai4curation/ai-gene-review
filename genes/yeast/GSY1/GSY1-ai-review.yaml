id: P23337
gene_symbol: GSY1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: GSY1 (YFR015C) encodes the minor isoform of UDP-glucose-dependent glycogen synthase (EC 2.4.1.11)
  in Saccharomyces cerevisiae, an 85-kDa GT3-family enzyme about 80% identical to its paralog Gsy2. It
  extends the glycogenin-primed alpha-1,4-glucan chain by transferring glucose from UDP-glucose to non-reducing
  ends, and is allosterically activated by glucose 6-phosphate and inhibited by phosphorylation. Gsy1
  co-purifies with Gsy2 in yeast glycogen synthase preparations; gsy1 deletion leaves about 85% of stationary-phase
  synthase activity, whereas gsy1 gsy2 double mutants lack synthase activity and glycogen. Gsy1-derived
  activity stays at a constant low level through the growth cycle, whereas Gsy2 activity rises with nutrient
  depletion. The enzyme is cytosolic and, like Gsy2, is expected to associate with glycogen particles.
