gene_symbol: GSY1
organism: yeast
uniprot_id: P23337
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Glycogen synthase participates in the glycogen biosynthetic process along
    with glycogenin and glycogen branching enzyme. Extends the primer composed of
    a few glucose units formed by glycogenin by adding new glucose units to it. In
    this context, glycogen synthase transfers the glycosyl residue from UDP-Glc to
    the non-reducing end of alpha-1,4-glucan.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P23337
  source_id: P23337
- source: Alliance_Imported
  text: Glycogen synthase; expression induced by glucose limitation, nitrogen starvation,
    environmental stress, and entry into stationary phase; GSY1 has a paralog, GSY2,
    that arose from the whole genome duplication; relocalizes from nucleus to cytoplasmic
    foci upon DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/GSY1
  source_id: SGD:S000001911
- source: Alliance_Automated
  text: Enables alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity.
    Involved in glycogen biosynthetic process. Located in mitochondrion. Human ortholog(s)
    of this gene implicated in cardiovascular system disease; glycogen storage disease;
    hyperinsulinism; liver glycogen storage disease; and muscle glycogen storage disease.
    Orthologous to human GYS1 (glycogen synthase 1) and GYS2 (glycogen synthase 2).
  source_type: automated
  url: https://www.yeastgenome.org/locus/GSY1
  source_id: SGD:S000001911
