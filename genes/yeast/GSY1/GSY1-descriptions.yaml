- source: Alliance_Imported
  text: Glycogen synthase; expression induced by glucose limitation, nitrogen starvation,
    environmental stress, and entry into stationary phase; GSY1 has a paralog, GSY2,
    that arose from the whole genome duplication; relocalizes from nucleus to cytoplasmic
    foci upon DNA replication stress
  source_type: curated
