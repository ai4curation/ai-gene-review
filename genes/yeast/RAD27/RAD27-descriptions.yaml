descriptions:
- source: UniProt
  text: Structure-specific nuclease with 5'-flap endonuclease and 5'- 3' exonuclease
    activities involved in DNA replication and repair. During DNA replication, cleaves
    the 5'-overhanging flap structure that is generated by displacement synthesis
    when DNA polymerase encounters the 5'-end of a downstream Okazaki fragment. It
    enters the flap from the 5'-end and then tracks to cleave the flap base, leaving
    a nick for ligation. Also involved in the long patch base excision repair (LP-BER)
    pathway, by cleaving within the apurinic/apyrimidinic (AP) site- terminated flap.
    Acts as a genome stabilization factor that prevents flaps from equilibrating into
    structures that lead to duplications and deletions. Also possesses 5'-3' exonuclease
    activity on nicked or gapped double-stranded DNA, and exhibits RNase H activity.
    Also involved in replication and repair of rDNA and in repairing mitochondrial
    DNA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P26793
  source_id: P26793
- source: Alliance_Imported
  text: 5' flap endonuclease, 5' to 3' exonuclease and gap endonuclease; required
    for Okazaki fragment processing and maturation, for long-patch base-excision repair
    and large loop repair (LLR), ribonucleotide excision repair; cleaves off RNA flap
    in a RNA:DNA hybrid intermediate during processing of DNA lagging strand; relocalizes
    to the cytosol in response to hypoxia; member of the S. pombe RAD2/FEN1 family
  source_type: curated
  url: https://www.yeastgenome.org/locus/RAD27
  source_id: SGD:S000001596
- source: Alliance_Automated
  text: Enables 5'-3' exonuclease activity and 5'-flap endonuclease activity. Involved
    in DNA metabolic process. Located in cytosol and mitochondrion. Is active in nucleus.
    Used to study cancer. Orthologous to human FEN1 (flap structure-specific endonuclease
    1).
