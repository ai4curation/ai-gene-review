- source: Alliance_Imported
  text: 5' flap endonuclease, 5' to 3' exonuclease and gap endonuclease; required
    for Okazaki fragment processing and maturation, for long-patch base-excision repair
    and large loop repair (LLR), ribonucleotide excision repair; cleaves off RNA flap
    in a RNA:DNA hybrid intermediate during processing of DNA lagging strand; relocalizes
    to the cytosol in response to hypoxia; member of the S. pombe RAD2/FEN1 family
