      favors formation and cleavage of primarily short flaps, up to eight nucleotides in length
  - reference_id: PMID:16079237
    supporting_text: These results suggest that PCNA mediates the entry of the flap endonuclease and DNA
      ligase I into the process of Okazaki fragment joining, and this ordered entry is necessary to prevent
      CAG repeat tract expansions.
- description: Maintains the fidelity and copy number of tandem repeat arrays by removing flaps before
    they can equilibrate into hairpin-containing structures. Loss of Rad27 causes CAG trinucleotide repeat
    expansion and contraction and severe ribosomal DNA copy-number instability accompanied by accumulation
    of unligated Okazaki fragments.
