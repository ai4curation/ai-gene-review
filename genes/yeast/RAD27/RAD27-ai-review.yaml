id: P26793
gene_symbol: RAD27
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: RAD27 (also known as RTH1 and YKL510; the Saccharomyces cerevisiae flap endonuclease 1) encodes
  the budding-yeast orthologue of FEN1, a magnesium-dependent structure-specific nuclease of the XPG/RAD2
  family. Rad27 cleaves 5' single-stranded flaps, strongly preferring a double-flap substrate in which
  the upstream primer carries a one-nucleotide 3' tail; the tail positions cleavage exactly one nucleotide
  into the annealed region, so that every product is a nick that DNA ligase I (Cdc9) can seal. The same
  active site supports a processive 5'-to-3' exonuclease activity on duplex DNA and cleaves RNA flaps
  within RNA:DNA hybrid intermediates. Its central cellular role is Okazaki fragment maturation on the
  lagging strand, acting on the flaps produced by DNA polymerase delta strand-displacement synthesis together
  with PCNA (Pol30), which binds the Rad27 PIP box and both targets and stimulates the enzyme; a second,
  minor route uses Dna2 to trim long RPA-coated flaps before Rad27 makes the final cut, and DNA2 and RAD27
  interact physically and are synthetically lethal. Rad27 also removes abasic-site flaps in long-patch
  base excision repair and trims incompatible 5' ends during nonhomologous end joining with Pol4 and Dnl4/Lif1;
  its human orthologue additionally incises the RNA strand of R-loops, an activity the yeast enzyme is
  expected to share on the basis of its RNA-flap cleavage but which has not been tested directly. Loss
  of RAD27 leaves unligated Okazaki fragments and causes pronounced genome instability, including expansion
  and contraction of CAG trinucleotide repeats and severe ribosomal DNA copy-number changes. Rad27 is
  predominantly nuclear and enriched in the nucleolus, and a functional pool is present in mitochondria,
  where it contributes to mitochondrial DNA integrity.
