core_functions:
- description: Cleaves the 5' flap displaced by DNA polymerase delta during lagging-strand synthesis,
    incising one nucleotide into the annealed region of a double-flap substrate so that the RNA/DNA primer
    is removed and Cdc9 can ligate the resulting nick. PCNA (Pol30) binds the Rad27 PIP box and orders
    its entry, with Cdc9, into Okazaki fragment joining.
