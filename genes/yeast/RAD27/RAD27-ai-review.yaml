existing_annotations:
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Phylogenetic (PANTHER) inference that Rad27 acts in DNA replication. Correct but under-specified:
      its replication role is confined to lagging-strand Okazaki fragment maturation, where it cleaves
      the primer flap displaced by DNA polymerase delta so that Cdc9 can ligate the nick.'
    action: MODIFY
    reason: Rad27 is not a general replication factor. Reconstituted yeast Okazaki fragment processing
      places it as the nuclease that removes the displaced flap, and rad27 mutants accumulate unligated
      Okazaki fragments in vivo. GO:0033567 states this precisely.
    proposed_replacement_terms:
    - id: GO:0033567
      label: DNA replication, Okazaki fragment processing
    additional_reference_ids:
    - PMID:16837458
    - PMID:41140146
    supported_by:
    - reference_id: PMID:16837458
      supporting_text: A second pathway involves reiterative single nucleotide or short oligonucleotide
        displacement by pol delta and cleavage by FEN1.
    - reference_id: PMID:41140146
      supporting_text: The rad27Δ mutant accumulates Okazaki fragments in the rDNA region, without inducing
        the formation of detectable DSBs.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000118792
        source_label: FEN1 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: Node-level 'DNA replication' is correct for the family but understates a role confined
          to Okazaki fragment maturation.
      - source_id: UniProtKB:P39748
        source_label: human FEN1
        source_status: SUPPORTS_TRANSFER
        comment: Human orthologue's replication role is likewise Okazaki fragment processing.
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Phylogenetic inference that Rad27 acts in DNA repair. Rad27 contributes to more than one
      repair route in budding yeast - long-patch base excision repair, end processing during nonhomologous
      end joining, and completion of double-strand-break-induced gene conversion - so the grouping term
      is appropriate.
    action: ACCEPT
    reason: Unlike the replication annotation, which maps to a single pathway, the repair contributions
      genuinely span several sub-pathways, and the specific children (GO:0006284, GO:0006303) are separately
      annotated in this set.
    supported_by:
    - reference_id: PMID:15342630
      supporting_text: Genetic studies in Saccharomyces cerevisiae have implicated the DNA polymerase
        Pol4 and the DNA structure-specific endonuclease FEN-1(Rad27) in the processing of DNA ends to
        be joined by Dnl4/Lif1.
- term:
    id: GO:0006310
    label: DNA recombination
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Phylogenetic inference that Rad27 acts in DNA recombination. Rad27 loss does impair recombination-dependent
      processes such as MAT gene conversion, but through failure of the lagging-strand synthesis that
      accompanies repair synthesis, not through a dedicated recombination activity.
    action: KEEP_AS_NON_CORE
    reason: Rad27 has no strand-exchange, resection or junction-resolution activity; its recombination
      phenotypes are attributable to its Okazaki-fragment role at the modified replication fork established
      after strand invasion. Retained as a genuine but non-core process.
    supported_by:
    - reference_id: PMID:10025407
      supporting_text: We propose a novel model for DSB-induced gene conversion in which a strand invasion
        creates a modified replication fork, involving leading and lagging strand synthesis from the donor
        template.
