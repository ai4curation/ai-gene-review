gene_symbol: IDP1
organism: yeast
uniprot_id: P21954
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Mitochondrial IDP1 may regulate flux through the tricarboxylic acid cycle
    and respiration. Its probably critical function is the production of NADPH.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P21954
  source_id: P21954
- source: Alliance_Imported
  text: Mitochondrial NADP-specific isocitrate dehydrogenase; catalyzes the oxidation
    of isocitrate to alpha-ketoglutarate; not required for mitochondrial respiration
    and may function to divert alpha-ketoglutarate to biosynthetic processes
  source_type: curated
  url: https://www.yeastgenome.org/locus/IDP1
  source_id: SGD:S000002224
- source: Alliance_Automated
  text: Enables isocitrate dehydrogenase (NADP+) activity. Involved in L-glutamate
    biosynthetic process. Located in mitochondrial nucleoid. Used to study high grade
    glioma. Human ortholog(s) of this gene implicated in autoimmune disease; bile
    duct disease; hematologic cancer (multiple); hepatocellular clear cell carcinoma;
    and high grade glioma (multiple). Orthologous to human IDH1 (isocitrate dehydrogenase
    (NADP(+)) 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/IDP1
  source_id: SGD:S000002224
