gene_symbol: IDP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Mitochondrial NADP+-specific isocitrate dehydrogenase (EC 1.1.1.42) of Saccharomyces cerevisiae,
  a homodimeric enzyme imported via an N-terminal mitochondrial presequence. IDP1 catalyses the Mg2+/Mn2+-dependent
  oxidative decarboxylation of D-threo-isocitrate to 2-oxoglutarate, CO2 and NADPH in the mitochondrial
  matrix. It is one of three NADP-IDH isozymes (mitochondrial IDP1, cytosolic IDP2, peroxisomal IDP3)
  and is distinct from the NAD+-specific heterooctameric IDH (IDH1/IDH2) that carries TCA-cycle flux.
  IDP1 is constitutively expressed, is dispensable for growth and respiration, and does not substitute
  for IDH in the TCA cycle; its roles are provision of mitochondrial NADPH and an ancillary supply of
  2-oxoglutarate for glutamate synthesis (idp1 idh double mutants are glutamate auxotrophs on glucose).
