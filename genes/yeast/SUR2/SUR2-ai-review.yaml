  label: Saccharomyces cerevisiae S288C
description: Sur2 (Syr2; YDR297W) is the sphingolipid C4-hydroxylase of Saccharomyces cerevisiae, an integral endoplasmic
  reticulum membrane enzyme of the sterol desaturase/fatty acid hydroxylase family that uses a histidine-box diiron
  centre, O2 and electrons from cytochrome b5. It hydroxylates C-4 of the sphingoid base, converting sphinganine
  (dihydrosphingosine) and dihydroceramides to phytosphingosine and phytoceramides (EC 1.14.18.5), which provides
  the 4-hydroxylated long-chain base characteristic of yeast sphingolipids. sur2 null mutants are viable and make
  normal amounts of sphingolipids built on dihydrosphingosine instead of phytosphingosine. The 4-hydroxyl group
  is required for growth inhibition by the Pseudomonas syringae lipodepsipeptide syringomycin E, which is how SYR2
  was first identified.
