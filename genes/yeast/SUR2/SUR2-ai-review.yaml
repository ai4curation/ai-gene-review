- term:
    id: GO:0042284
    label: sphingolipid delta-4 desaturase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000933245
  - PomBase:SPBC887.15c
  review:
    summary: 'IBA (PTN000933245, seeded from S. pombe SPBC887.15c) for sphingolipid delta-4 desaturase activity,
      i.e. formation of sphing-4-enine (sphingosine-type) ceramides. Sur2 is a C4 hydroxylase, not a desaturase:
      S. cerevisiae sphingolipids carry 4-hydroxylated (phyto) or saturated (dihydro) bases, and sur2 mutants simply
      lack the 4-hydroxyl group. Delta-4 desaturation is done by the unrelated DEGS/Des1 family, which S. cerevisiae
      lacks.'
    action: REMOVE
    reason: The desaturase reaction is not carried out by Sur2; the propagated activity conflicts with the experimentally
      defined C4-hydroxylase chemistry of this protein.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PomBase:SPBC887.15c
        source_label: S. pombe Sur2 ortholog
        source_status: UNRESOLVED
        comment: Donor annotation not inspected here. Sur2-family enzymes are C4-hydroxylases; delta-4 desaturation
          belongs to the unrelated DEGS family, absent from S. cerevisiae.
    supported_by:
    - reference_id: PMID:9556590
      supporting_text: yeast strains carrying a disrupted SYR2 allele produced sphingoid long chain bases lacking
        the 4-hydroxyl group present in wild type strains
    - reference_id: PMID:9556590
