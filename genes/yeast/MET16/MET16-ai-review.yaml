- term:
    id: GO:0006750
    label: glutathione biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:22234534
  qualifier: involved_in
  review:
    summary: MET16 overexpression increased intracellular and volumetric glutathione (PMID:22234534).
      Met16 does no step of glutathione synthesis, which is carried out by Gsh1 and Gsh2. It supplies
      sulfite upstream, from which the cysteine used for GSH is ultimately made. The result shows that
      sulfate reduction flux limits GSH yield in an engineering context, not that Met16 participates in
      glutathione biosynthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: Upstream precursor supply; Met16 performs no step of glutathione synthesis.
    supported_by:
    - reference_id: PMID:22234534
      supporting_text: Especially, in the MET16 over-expressing strain, the volumetric GSH concentration
        was up to 1.7-fold higher than that of the parental strain
