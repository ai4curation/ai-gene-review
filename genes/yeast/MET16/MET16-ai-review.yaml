id: P18408
gene_symbol: MET16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Met16 is the thioredoxin-dependent 3'-phosphoadenylyl-sulfate (PAPS) reductase of Saccharomyces
  cerevisiae (EC 1.8.4.8). It reduces PAPS, made by Met3 and Met14, to free sulfite and adenosine 3',5'-bisphosphate
  (PAP), with reduced thioredoxin as the electron donor and cosubstrate. This is the reductive step that
  turns activated sulfate into sulfite, which the Met5/Met10 sulfite reductase then reduces to sulfide
  for homocysteine, methionine, cysteine and glutathione synthesis. The purified enzyme is a dimer that
  follows a ping-pong mechanism and binds thioredoxin before PAPS. Met16 belongs to the CysH subfamily
  of PAPS reductases and is a soluble cytoplasmic protein. MET16 is transcriptionally controlled by Met4.
  Met16 also reduces the selenium analogue 3'-phosphoadenylyl selenate to selenite, so it takes part in
  selenate assimilation. MET16 overexpression raises cellular glutathione.
