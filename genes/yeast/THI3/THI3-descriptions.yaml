- source: Alliance_Imported
  text: Regulatory protein that binds Pdc2p and Thi2p transcription factors; activates
    thiamine biosynthesis transcription factors Pdc2p and Thi2p by binding to them,
    but releases and de-activates them upon binding to thiamine pyrophosphate (TPP),
    the end product of the pathway; has similarity to decarboxylases but enzymatic
    activity is not detected
