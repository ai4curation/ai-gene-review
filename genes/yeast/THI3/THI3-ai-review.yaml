suggested_questions:
- question: Are the reported thi3 effects on leucine/isoleucine-derived fusel alcohols explained entirely
    by reduced TPP supply to Aro10 and the Pdc isozymes, or does Thi3p modulate decarboxylase activity
    post-translationally (e.g. by hetero-oligomerising with Aro10 or Pdc proteins)?
- question: Has Thi3p lost the catalytic residues (e.g. the catalytic glutamate/histidines of PDC) that
    would explain its lack of decarboxylase activity?
suggested_experiments:
- description: Supplement thi3 mutants with excess thiamine, or express THI genes constitutively, and
    measure isoamyl alcohol and active amyl alcohol formation to test whether the Ehrlich phenotype is
    indirect.
- description: Assay purified Thi3p with TPP for binding affinity and for residual 2-oxo-acid decarboxylase
    or carboligase activity.
