  review:
    summary: Dickinson et al. 2000 inferred from multiple-mutant metabolite studies that any member of
      the PDC1/PDC5/PDC6/ARO10/THI3 family allows isoleucine catabolism, and earlier work attributed leucine-derived
      2-oxo-acid decarboxylation to YDL080C (THI3). Later work showed the broad-specificity decarboxylase
      is Aro10p. When each family member was expressed alone in a quintuple-null strain, Thi3p showed
      no decarboxylation of any branched-chain 2-oxo acid. The earlier genetic effects are better explained
      by Thi3p's regulatory role. The UniProt entry carries a CAUTION recording this conflict.
    action: REMOVE
    reason: Direct enzyme assays (Romagnoli et al. 2012) found no branched-chain 2-oxo acid decarboxylase
      activity for Thi3p; the earlier genetic inference is superseded.
