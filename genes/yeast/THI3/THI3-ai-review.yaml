id: Q07471
gene_symbol: THI3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: THI3 (YDL080C, KID1) encodes a nuclear thiamine diphosphate (TPP)-binding protein of the
  TPP-dependent 2-oxo-acid decarboxylase family. It is a paralog of the pyruvate decarboxylases Pdc1/5/6p
  and of Aro10p, but it is a regulatory protein. Thi3p senses intracellular TPP. When TPP is low (thiamine
  starvation), TPP-free Thi3p associates with the transcription factors Thi2p and Pdc2p and is required
  for their activation of the THI regulon, the genes for thiamine biosynthesis and uptake. It also autoregulates
  its own promoter. TPP binding to Thi3p disrupts these complexes, and Thi3p mutants unable to bind TPP
  constitutively derepress THI genes. Early multiple-mutant studies suggested a role in leucine and isoleucine
  decarboxylation in the Ehrlich pathway, but individually expressed Thi3p shows no decarboxylase activity
  with pyruvate, branched-chain, aromatic or linear 2-oxo acids. Those phenotypes are therefore probably
  indirect consequences of its regulation of thiamine/TPP supply.
