id: Q03764
gene_symbol: EKI1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Eki1 (YDR147W) is the ethanolamine kinase of Saccharomyces cerevisiae (EC 2.7.1.82), a soluble cytoplasmic
  member of the choline/ethanolamine kinase family. It phosphorylates ethanolamine with ATP to phosphoethanolamine,
  the committed step of the CDP-ethanolamine branch of the Kennedy pathway that converts exogenous or recycled ethanolamine
  into phosphatidylethanolamine (followed by Ect1 and Ept1). Eki1 also phosphorylates choline, but ethanolamine
  is the preferred substrate; together with its paralog Cki1 (the principal choline kinase) it accounts for all
  cellular ethanolamine and choline kinase activity, and the two enzymes partially overlap in vivo. eki1 deletion
  has no growth phenotype under standard conditions because PE is mainly made by the Psd1/Psd2 route.
