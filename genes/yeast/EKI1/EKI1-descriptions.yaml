descriptions:
- source: UniProt
  text: Catalyzes the committed step of phosphatidylethanolamine synthesis via the
    CDP-ethanolamine branch of the Kennedy pathway. Also exhibits choline kinase activity,
    thus contributing to phosphatidylcholine synthesis via the CDP-choline pathway,
    but its preferred substrate is ethanolamine.
  source_type: curated
