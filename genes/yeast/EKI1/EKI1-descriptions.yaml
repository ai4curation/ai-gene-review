gene_symbol: EKI1
organism: yeast
uniprot_id: Q03764
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Catalyzes the committed step of phosphatidylethanolamine synthesis via the
    CDP-ethanolamine branch of the Kennedy pathway. Also exhibits choline kinase activity,
    thus contributing to phosphatidylcholine synthesis via the CDP-choline pathway,
    but its preferred substrate is ethanolamine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03764
  source_id: Q03764
- source: Alliance_Imported
  text: Ethanolamine kinase; primarily responsible for phosphatidylethanolamine synthesis
    via the CDP-ethanolamine pathway; exhibits some choline kinase activity, thus
    contributing to phosphatidylcholine synthesis via the CDP-choline pathway; EKI1
    has a paralog, CKI1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/EKI1
  source_id: SGD:S000002554
- source: Alliance_Automated
  text: Enables choline kinase activity and ethanolamine kinase activity. Involved
    in phosphatidylcholine biosynthetic process and phosphatidylethanolamine biosynthetic
    process. Located in cytoplasm. Human ortholog(s) of this gene implicated in epilepsy;
    intellectual disability; muscular dystrophy (multiple); narcolepsy; and recurrent
    hypersomnia. Orthologous to several human genes including CHKA (choline kinase
    alpha) and CHKB (choline kinase beta).
  source_type: automated
  url: https://www.yeastgenome.org/locus/EKI1
  source_id: SGD:S000002554
