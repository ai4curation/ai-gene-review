gene_symbol: FAA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'FAA4 (YMR246W) encodes a long-chain fatty acyl-CoA synthetase (ACSL family, EC 6.2.1.3), the closest
  paralog of Faa1p in Saccharomyces cerevisiae. Purified Faa4p prefers myristate among saturated fatty acids and
  strongly favours cis-9 monounsaturated C14-C18 fatty acids, and it is relatively sensitive to triacsin C. Faa4p
  is partially redundant with Faa1p: faa1 faa4 double mutants lack most long-chain acyl-CoA synthetase activity
  toward oleate, are severely impaired in long-chain fatty acid import, have depleted acyl-CoA pools and reduced
  oxidation of exogenous oleate. Faa4p forms a complex with Fat1p for vectorial acylation, activates hexadecenoic
  acid in the sphingolipid-to-glycerolipid pathway, and contributes weakly to uptake of sphingoid long-chain bases.
  Faa4p resides in the ER and on lipid droplets, relocalising from the ER to the lipid droplet surface on entry
  into stationary phase where it supplies acyl-CoA for triacylglycerol synthesis; a minor pool is at the plasma
  membrane.'
