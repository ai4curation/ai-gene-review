gene_symbol: FAA4
organism: yeast
uniprot_id: P47912
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Activates long-chain fatty acids (LCFA) by esterification of the fatty acids
    into metabolically active CoA-thioesters for subsequent degradation or incorporation
    into phospholipids. Also facilitates the transport of LCFAs into the cell, either
    by active transport or by decreasing the intracellular LCFA concentration (PubMed:11477098,
    PubMed:12601005, PubMed:7962057). Contributes, with FAA1, to the activation of
    imported myristate (PubMed:7962057). Also involved in long-chain base (LCB) uptake.
    In contrast ot LCFA uptake, LCB uptake does not require ATP, suggesting that the
    enzyme is directly involved in LCB uptake (PubMed:27136724). Involved in the sphingolipid-to-
    glycerolipid metabolic pathway, converting the sphingolipid metabolite hexadecenoic
    acid to hexadecenoyl-CoA, which is then further converted to glycerolipids (PubMed:22633490).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47912
  source_id: P47912
- source: Alliance_Imported
  text: Long chain fatty acyl-CoA synthetase; activates fatty acids with a preference
    for C12:0-C16:0 chain lengths; role in the competitive import of long-chain fatty
    acids and sphingoid long-chain bases; role in stationary phase survival; localizes
    to lipid particles and the plasma membrane; role in sphingolipid-to-glycerolipid
    metabolism; forms cytoplasmic foci upon replication stress; faa1 faa4 double null
    complemented by any of human ACSBG1, ACSL1, 3, 4, 5, 6, SLC27A2, or 4
  source_type: curated
  url: https://www.yeastgenome.org/locus/FAA4
  source_id: SGD:S000004860
- source: Alliance_Automated
  text: Enables long-chain fatty acid-CoA ligase activity. Involved in long-chain
    fatty acid import into cell; long-chain fatty-acyl-CoA metabolic process; and
    sphingoid long-chain base transport. Located in lipid droplet and plasma membrane.
    Used to study Sjogren-Larsson syndrome. Human ortholog(s) of this gene implicated
    in asthma; breast cancer; cardiac arrest; intellectual disability (multiple);
    and prostate cancer. Orthologous to several human genes including ACSL4 (acyl-CoA
    synthetase long chain family member 4).
  source_type: automated
  url: https://www.yeastgenome.org/locus/FAA4
  source_id: SGD:S000004860
