descriptions:
- source: UniProt
  text: Activates long-chain fatty acids (LCFA) by esterification of the fatty acids
    into metabolically active CoA-thioesters for subsequent degradation or incorporation
    into phospholipids. Also facilitates the transport of LCFAs into the cell, either
    by active transport or by decreasing the intracellular LCFA concentration (PubMed:11477098,
    PubMed:12601005, PubMed:7962057). Contributes, with FAA1, to the activation of
    imported myristate (PubMed:7962057). Also involved in long-chain base (LCB) uptake.
    In contrast ot LCFA uptake, LCB uptake does not require ATP, suggesting that the
    enzyme is directly involved in LCB uptake (PubMed:27136724). Involved in the sphingolipid-to-
    glycerolipid metabolic pathway, converting the sphingolipid metabolite hexadecenoic
    acid to hexadecenoyl-CoA, which is then further converted to glycerolipids (PubMed:22633490).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47912
