- source: Alliance_Imported
  text: Long chain fatty acyl-CoA synthetase; activates fatty acids with a preference
    for C12:0-C16:0 chain lengths; role in the competitive import of long-chain fatty
    acids and sphingoid long-chain bases; role in stationary phase survival; localizes
    to lipid particles and the plasma membrane; role in sphingolipid-to-glycerolipid
    metabolism; forms cytoplasmic foci upon replication stress; faa1 faa4 double null
    complemented by any of human ACSBG1, ACSL1, 3, 4, 5, 6, SLC27A2, or 4
