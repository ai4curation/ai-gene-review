id: Q03941
gene_symbol: CAB5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CAB5 (YDR196C) encodes the essential dephospho-CoA kinase (DPCK) of S. cerevisiae, a CoaE-family
  P-loop kinase that phosphorylates the 3'-hydroxyl of the ribose of 3'-dephospho-CoA using ATP to form
  coenzyme A, the final (fifth) step of CoA biosynthesis. The null is lethal and is complemented by E.
  coli coaE and by human COASY. Cab5 is a component of the CoA-synthesizing protein complex (CoA-SPC)
  through binding to the N-terminus of Cab3, and fractionation and protease-protection experiments show
  that most Cab5 is associated with mitochondria as an extrinsic protein of the outer membrane, facing
  the cytosol. High-throughput studies additionally detect it at the ER, nuclear envelope and lipid droplets.
  A Cab5 R146C mutation modelling human COASY-associated neurodegeneration (CoPAN) reduces mitochondrial
  CoA and causes iron and lipid phenotypes.
