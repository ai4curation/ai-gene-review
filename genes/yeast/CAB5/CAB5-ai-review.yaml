suggested_questions:
- question: How is a mitochondrial-outer-membrane-associated Cab5 reconciled with a soluble cytosolic
    CoA-SPC scaffolded by Cab3 - does the complex assemble at the outer membrane, and is CoA made there
    for import into mitochondria?
suggested_experiments:
- description: Co-fractionation/proximity labelling of Cab2-Cab4 with mitochondria to test whether the
    whole CoA-SPC is recruited to the outer membrane via Cab5.
