descriptions:
- source: UniProt
  text: Catalyzes the phosphorylation of the 3'-hydroxyl group of dephosphocoenzyme
    A to form coenzyme A.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03941
  source_id: Q03941
- source: Alliance_Imported
  text: 'Subunit of the CoA-Synthesizing Protein Complex (CoA-SPC); subunits of this
    complex are: Cab2p, Cab3p, Cab4p, Cab5p, Sis2p and Vhs3p; probable dephospho-CoA
    kinase (DPCK) that catalyzes the last step in coenzyme A biosynthesis; involved
    in histone acylation; null mutant lethality is complemented by human homologs
    DCAKD and COASY and by E. coli coaE (encoding DPCK); extrinsic component of the
    mitochondrial outer membrane that also localizes to lipid droplets'
  source_type: curated
  url: https://www.yeastgenome.org/locus/CAB5
  source_id: SGD:S000002604
- source: Alliance_Automated
  text: Predicted to enable dephospho-CoA kinase activity. Involved in coenzyme A
    biosynthetic process. Located in lipid droplet; mitochondrion; and nucleus. Is
    extrinsic component of mitochondrial outer membrane. Part of CoA-synthesizing
    protein complex. Used to study neurodegeneration with brain iron accumulation
    6. Orthologous to human DCAKD (dephospho-CoA kinase domain containing).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CAB5
  source_id: SGD:S000002604
