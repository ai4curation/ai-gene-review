id: P17065
gene_symbol: SEC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Sec2 is the post-Golgi Rab guanine nucleotide exchange factor for
  Sec4 in budding yeast. It is recruited to Ypt31/Ypt32-positive, PI4P-containing
  late Golgi and nascent secretory vesicle membranes, activates Sec4 to drive
  vesicle transport toward polarized exocytic sites, and cycles off vesicles at
  the bud tip or bud neck as exocytic tethering and fusion proceed. The same
  Sec2-Sec4 module is reused in secondary membrane-supply contexts, including
  Atg9 traffic during autophagosome biogenesis and delivery of post-Golgi
  vesicles to prospore membranes during sporulation.
