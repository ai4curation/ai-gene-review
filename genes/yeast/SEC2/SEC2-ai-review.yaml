- term:
    id: GO:0051286
    label: cell tip
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - CGD:CAL0000197956
  - PANTHER:PTN001024876
  - PomBase:SPAC23C4.10
  review:
    summary: PAINT places Sec2-family active localization at the fungal node
      PANTHER:PTN001024876, seeded by Candida and fission-yeast Sec2 evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PAINT node is sound for the tip-growing fungal sources but
      over-propagates their GO:0051286 cell-tip compartment to budding yeast.
      S. cerevisiae Sec2 acts at cellular bud tips and bud necks in vegetative
      cells, and its true cell-tip descendant is the condition-specific shmoo
      tip rather than the mitotic exocytic sites that this IBA was intended to
      capture.
    supported_by:
    - reference_id: PMID:19053807
      supporting_text: Sec2,(47) a protein that functions as the Guanine
        nucleotide exchange factor for the rab GTPase Sec4, mediates vesicle
        tethering to the exocyst and localizes at the shmoo tip.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001024876
        source_label: PTN001024876
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Fission yeast and Candida use true cell tips as vegetative
          exocytic growth sites; the analogous S. cerevisiae mitotic sites are
          cellular bud tips and bud necks, not GO:0051286.
