  label: Saccharomyces cerevisiae S288C
description: 'DAK2 (dihydroxyacetone kinase 2; glycerone kinase) is one of two closely related

  dihydroxyacetone kinase isoforms of Saccharomyces cerevisiae (with DAK1), belonging to the fused DhaK-DhaL

  DAK family. It phosphorylates dihydroxyacetone (DHA) with ATP to give dihydroxyacetone phosphate

  (EC 2.7.1.29; Km for DHA about 5 uM), feeding DHA into glycolysis/gluconeogenesis. This is the second

  step of the oxidative (DHA) route of glycerol dissimilation after the NADP+-dependent glycerol

  dehydrogenase GCY1, and DHA kinase activity is also required to detoxify DHA, which is toxic to yeast:
  a

  dak1 dak2 double mutant is highly DHA-sensitive, whereas overexpression of either kinase allows growth
  on

  DHA as sole carbon source. The protein is soluble and cytosolic. By similarity to bifunctional mammalian

  triokinase it may also phosphorylate D-glyceraldehyde, but this has not been shown for the yeast enzyme.'
