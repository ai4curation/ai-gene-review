suggested_questions:
- question: "Which of Ddp1's substrates (inositol pyrophosphates, Ap6A/Ap5A, polyphosphate, capped RNA)\n\
    \                is physiologically dominant, and do they compete in vivo?"
- question: "Does Ddp1 preferentially hydrolyse the 1-PP (Vip1) or 5-PP (Kcs1) position of IP7/IP8 in\n\
    \                yeast?"
suggested_experiments:
- description: "Quantify IP7/IP8 isomers (CE-MS), Ap6A and polyP in ddp1 null and catalytic-dead\n   \
    \             strains, alone and combined with ppn1 ppn2 ppx1, to define in vivo substrates."
