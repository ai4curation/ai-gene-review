- YOR163W
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: DDP1 (YOR163W) encodes the Saccharomyces cerevisiae diphosphoinositol polyphosphate phosphohydrolase,
  a Nudix (MutT motif) hydrolase orthologous to human DIPP1-3 (NUDT3/4/10/11). Ddp1 removes the beta-phosphate
  from the pyrophosphate groups of inositol pyrophosphates, converting PP-InsP5 (IP7) back to IP6 and
  [PP]2-InsP4 (IP8) to PP-InsP5, thereby opposing the Kcs1 and Vip1 kinases. The same active site hydrolyses
  diadenosine hexa- and pentaphosphates (Ap6A preferred, Ap5A) and adenosine tetra-/pentaphosphates, and
  Ddp1 also has inorganic polyphosphate endopolyphosphatase activity and in vitro mRNA decapping activity.
  It requires divalent cations (Mg2+, Mn2+, Zn2+) and localises to the cytoplasm and nucleus.
