- source: Alliance_Imported
  text: Diadenosine and diphosphoinositol polyphosphate phosphatase; hydrolyzes diphosphorylated
    inositol polyphosphates and diadenosine polyphosphates; high specificity for diadenosine
    hexa- and pentaphosphates; contains endopolyphosphatase activity with a high affinity
    for polyphosphates, an activity also observed for its human DIPP homologs; possesses
    mRNA decapping activity; nudix hydrolase family member; protein abundance increases
    in response to DNA replication stress
  source_type: curated
