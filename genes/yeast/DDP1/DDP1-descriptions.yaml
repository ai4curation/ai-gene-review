descriptions:
- source: UniProt
  text: May eliminate potentially toxic dinucleoside polyphosphates during sporulation.
    Most active against diadenosine 5',5'''-P1,P6- hexaphosphate (Ap6A). Can also
    hydrolyze diadenosine 5',5'''-P1,P5- pentaphosphate (Ap5A), adenosine 5'-pentaphosphate
    (p5A), and adenosine 5'-tetraphosphate (p4A) are also substrates, but not diadenosine
    5',5'''-P1,P4-tetraphosphate (Ap4A) or other dinucleotides, mononucleotides, nucleotide
    sugars, or nucleotide alcohols. Also cleaves a beta-phosphate from the diphosphate
    groups in PP-InsP5 (diphosphoinositol pentakisphosphate) and [PP]2-InsP4 (bisdiphosphoinositol
    tetrakisphosphate) (PubMed:10085096, PubMed:10419486). Also has endopolyphosphatase
    activity (PubMed:31175919).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q99321
