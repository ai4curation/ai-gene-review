descriptions:
- source: UniProt
  text: May eliminate potentially toxic dinucleoside polyphosphates during sporulation.
    Most active against diadenosine 5',5'''-P1,P6- hexaphosphate (Ap6A). Can also
    hydrolyze diadenosine 5',5'''-P1,P5- pentaphosphate (Ap5A), adenosine 5'-pentaphosphate
    (p5A), and adenosine 5'-tetraphosphate (p4A) are also substrates, but not diadenosine
    5',5'''-P1,P4-tetraphosphate (Ap4A) or other dinucleotides, mononucleotides, nucleotide
    sugars, or nucleotide alcohols. Also cleaves a beta-phosphate from the diphosphate
    groups in PP-InsP5 (diphosphoinositol pentakisphosphate) and [PP]2-InsP4 (bisdiphosphoinositol
    tetrakisphosphate) (PubMed:10085096, PubMed:10419486). Also has endopolyphosphatase
    activity (PubMed:31175919).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q99321
  source_id: Q99321
- source: Alliance_Imported
  text: Diadenosine and diphosphoinositol polyphosphate phosphatase; hydrolyzes diphosphorylated
    inositol polyphosphates and diadenosine polyphosphates; high specificity for diadenosine
    hexa- and pentaphosphates; contains endopolyphosphatase activity with a high affinity
    for polyphosphates, an activity also observed for its human DIPP homologs; possesses
    mRNA decapping activity; nudix hydrolase family member; protein abundance increases
    in response to DNA replication stress
  source_type: curated
  url: https://www.yeastgenome.org/locus/DDP1
  source_id: SGD:S000005689
- source: Alliance_Automated
  text: Enables phosphodiesterase decapping endonuclease activity and pyrophosphatase
    activity. Involved in diadenosine polyphosphate catabolic process and polyphosphate
    catabolic process. Located in cytoplasm and nucleus. Orthologous to several human
    genes including NUDT10 (nudix hydrolase 10).
  source_type: automated
  url: https://www.yeastgenome.org/locus/DDP1
  source_id: SGD:S000005689
