id: P40456
gene_symbol: ESL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: Esl1 (YIL151C) is a 1118-residue budding-yeast Est1/SMG-family protein with a central 14-3-3-like
  Est-one-homology domain and a C-terminal PIN domain containing conserved acidic residues. It is closely
  related to Esl2 and structurally related to metazoan SMG5/6 proteins. Single and double deletions did
  not cause accumulation of the two tested nonsense-mediated decay substrates, or defects in the tested
  telomere-length, senescence and subtelomeric-silencing assays. These findings distinguish its detected
  physiological effects from canonical NMD and telomere maintenance, while leaving direct nucleic-acid
  binding and dispensable complex association unresolved. The double mutant shows inappropriate expression
  of nutrient-responsive genes, genetic interactions with Rim101-pathway components and Trf4, increased
  respiratory-deficient colony formation, and altered genotoxin responses. Some genotoxin phenotypes depend
  on conserved PIN residues, whereas most tested transcript-expression changes do not. Its direct substrates,
  molecular mechanism and subcellular distribution remain unresolved.
