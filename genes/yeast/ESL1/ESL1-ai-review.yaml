core_functions:
- description: Esl1 is an Est1/SMG-family PIN-domain protein with a detected contribution to nutrient-associated
    gene-expression phenotypes together with Esl2. Double-mutant transcript levels and genetic interactions
    establish physiological effects but do not identify its direct substrates or the step it performs.
    Canonical NMD was negative in two tested substrate assays. Telomerase association and telomeric nucleic-acid
    binding remain unresolved because maintenance phenotypes do not measure these functions.
  supported_by:
  - reference_id: PMID:23893744
    supporting_text: Esl1 and Esl2 contribute to the regulation of adaptive gene expression responses
      of environmental sensing pathways
    reference_section_type: ABSTRACT
  - reference_id: PMID:23893744
    supporting_text: esl1Δ esl2Δ double mutants may have a defect in adapting the expression of hexose
      and one-carbon metabolism genes to environmentally appropriate requirements
    reference_section_type: RESULTS
knowledge_gaps:
- gap_statement: The direct molecular activity of Esl1 is undetermined. It is unknown whether Esl1 is
    a catalytically active endoribonuclease in vivo, and if so what its RNA substrates are; the conserved
    PIN catalytic residues are intact but no biochemical nuclease assay of Esl1 has been reported, and
    the characterized adaptive gene-expression phenotype is largely independent of PIN catalytic integrity.
  boundary: Esl1 has an EOH/14-3-3-like region and a PIN domain with conserved acidic residues; the experimentally
    generated esl1-nd allele changes D952 and E982. SMG6 provides an active-nuclease comparator, whereas
    the related SMG5 protein is catalytically impaired. The two assayed NMD substrates and tested telomere-maintenance
    outcomes were normal in single/double mutants. These data do not directly test telomeric binding or
    complex association. A bleomycin-response phenotype depends on the altered PIN residues, without establishing
    purified Esl1 nuclease activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Identifying direct substrates and biochemical activity would explain the relationship
    between the conserved Est1/SMG architecture and the adaptive-expression/genome-stability phenotypes.
  resolution: In vitro endoribonuclease assays with purified Esl1 and its PIN domain; CLIP/RIP-style identification
    of bound RNAs; comparison of wild-type vs nuclease-dead alleles for each phenotype.
  provenance:
  - reference_id: PMID:23893744
    supporting_text: Esl1 and Esl2 may regulate the expression of the altered transcripts in a largely
      nuclease-independent manner
    reference_section_type: RESULTS
  - reference_id: PMID:23893744
    supporting_text: all other PIN domain-containing proteins characterized to date exert ribonuclease
      activity in vitro and/or in vivo
    reference_section_type: RESULTS
- gap_statement: The molecular partners and substrates of Esl1 are unknown, including any protein-protein
    interaction mediated by its 14-3-3-like EOH domain (the domain that in metazoan SMG5/6 engages the
    NMD factor UPF1) and any direct link to the Rim101 pH-sensing machinery.
  boundary: A large-scale two-hybrid interaction with Mdt1/Pin4 and genetic interactions with rim8, dfg16
    and trf4 provide candidate relationships. They do not establish which EOH/PIN interaction or substrate
    accounts for the physiological phenotype.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Identifying an Esl1 interaction partner would reveal the mechanism connecting the Est1/SMG
    fold to nutrient/pH-adaptive gene expression and clarify whether the EOH domain retains a regulatory
    protein-interaction function analogous to its metazoan counterparts.
  resolution: Affinity-purification/mass-spectrometry and proximity-labeling of tagged Esl1; targeted
    tests of physical interaction with Rim101-pathway and TRAMP components.
  provenance:
  - reference_id: PMID:23893744
    supporting_text: provide a basis for future investigations into the detailed mechanisms by which they
      exert this function
    reference_section_type: DISCUSSION
- gap_statement: The ESL1-specific (non-redundant) contribution and in vivo biological role are not resolved,
    because almost all phenotypes are stronger in esl1 esl2 double mutants and the transcriptome signature
    was measured only in the double mutant.
  boundary: esl1 single mutants show telomere/NMD-negative results and specific synthetic-sick interactions
    (with FUS3, DAL81, SNX4, and synthetic-lethal with TRF4), and the pair is redundant for the adaptive
    gene-expression, mitochondrial-stability and genotoxin phenotypes; but no ESL1-only phenotype defines
    its unique function.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Distinguishing the individual roles of ESL1 and ESL2 is needed to know whether ESL1 has
    a dedicated regulon or is fully redundant with its paralog.
  resolution: Condition- and stress-resolved transcriptomics and phenotyping of esl1 single mutants (including
    nuclease-dead), with direct comparison to esl2 and the double mutant.
  provenance:
  - reference_id: PMID:23893744
    supporting_text: the effect was more pronounced when ESL1 and ESL2 were simultaneously deleted, suggesting
      functional redundancy between the two proteins
    reference_section_type: RESULTS
suggested_questions:
- question: Is Esl1 a catalytically active endoribonuclease in vivo, and if so, what RNAs does it cleave
    during nutrient/pH adaptation?
- question: Does the 14-3-3-like Est-one-homology domain of Esl1 mediate a regulatory protein-protein
    interaction analogous to the SMG5/6–UPF1 interaction in metazoa?
- question: What is the subcellular localization of Esl1, and does it change with nutrient or pH conditions?
- question: Does Esl1 physically associate with telomerase holoenzyme, telomeric-repeat DNA or TLC1 RNA
    despite the normal tested telomere-maintenance phenotypes? Reconcile the verified PAINT ancestry with
    the direct functional negatives. The focused report is incorporated but does not resolve the physical-capacity
    question; its absence-of-evidence arguments do not justify REMOVE or a NOT assertion.
- question: What molecular step does Esl1 itself perform in the observed gene-expression/nutrient-adaptation
    phenotype, and does it support a process annotation independently of double-mutant transcriptome effects?
    The two previous authored NEW process rows and speculative custom MF proposal are withdrawn pending
    that evidence.
suggested_experiments:
- hypothesis: Esl1 regulates a specific set of nutrient/pH-responsive mRNAs via its PIN domain.
  description: Perform RIP-seq/CLIP-seq on tagged Esl1 under high- and low-glucose and alkaline conditions,
    and compare mRNA half-lives in wild-type, esl1 esl2, and nuclease-dead alleles.
- hypothesis: Esl1 acts in a pathway parallel to Rim101 in environmental adaptation.
  description: Epistasis and interaction analysis of Esl1 with Rim101-pathway components (Rim8, Dfg16,
    Rim13, Rim20) under alkaline and low-glucose stress, with transcriptome readout.
