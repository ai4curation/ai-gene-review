- id: file:yeast/ESL1/ESL1-deep-research-falcon.md
  title: Falcon literature report for yeast ESL1
  findings:
  - statement: The report explicitly lacked the dedicated Lai 2013 paper and therefore inferred functions
      from other EST/SMG proteins.
    supporting_text: which could not be fully accessed during this literature search.
  - statement: Its suggestion that Esl1 alone is the yeast PIN-containing family member overlooks the
      directly characterized Esl2 paralog.
    supporting_text: ESL1 is notable as the only yeast family member annotated as possessing a PIN domain,
      making it structurally distinct from its yeast paralogs.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Read full scientific body. Useful EST/SMG/PIN background, but it missed PMID:23893744
      and Esl2 and therefore cannot adjudicate the target negatives or establish target telomere/NMD/nuclease
      functions. The dedicated full-text study takes precedence. No exact OpenScientist report existed
      at the initial cache check; the newly generated focused report is separately assessed here.
- id: file:yeast/ESL1/ESL1-hypotheses/telomerase-association-and-nucleic-acid-binding/openscientist.md
  title: OpenScientist focused assessment of ESL1 telomerase association and nucleic-acid binding
  findings:
  - statement: The report recommends removing the three inherited telomerase MF/CC terms while acknowledging
      that direct target binding assays are absent and that the primary full texts were not read. It supplies
      STRING channel and global sequence-identity tables, but no executable analysis or aligned sequences.
      These are useful leads and scope limits, not a demonstrated ancestral loss.
    supporting_text: full text of the two primary papers was not read
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Entire report, HTML version and all three CSV artifacts read. The actual PAINT lineage
      already verifies positive IBD PTN000403280 above target PTN007651903; a family/subfamily label is
      not the origin or validity test of that assertion. Zero STRING experimental-channel scores mean
      no recorded positive link, not tested noninteraction; uniform database scores do not identify their
      underlying source. Low global identity does not establish interface loss. NMD-substrate negatives
      do not negate another function by parity. Primary PMID:23893744 full experiments and newly fetched PMID:22544908
      KlEst1 binding results do not test Esl1 binding or complex association. Retain all three UNDECIDED
      calls and manual follow-up rather than REMOVE/NOT or another duplicate report.
- id: PMID:22544908
  title: Functional analysis of the single Est1/Ebs1 homologue in Kluyveromyces lactis reveals roles in
    both telomere maintenance and rapamycin resistance.
  findings:
  - statement: Purified Kluyveromyces lactis Est1 N-terminal domain contacts Ter1 RNA in a UV-crosslinking
      assay (Fig.4), although EMSA did not recover a complex. This is a positive paralog/comparator assay,
      not a test of Saccharomyces Esl1 or evidence that only the Est1/Ebs1 branch can bind telomerase
      RNA.
    supporting_text: we were able to demonstrate a direct physical interaction between Est1
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Fetched PubMed/PMC3416500 record and read assay Results and Discussion: UV crosslinking
      provides binding evidence despite unsuccessful EMSA; TPR/DSH mutants constrain the KlEst1 interface.
      No Esl1 construct is tested. This comparator can guide a target assay but does not establish an
      Esl1 loss.'
