- id: PMID:23893744
  title: Yeast hEST1A/B (SMG5/6)-like proteins contribute to environment-sensing adaptive gene expression
    responses.
  findings:
  - statement: Esl1 (Yil151c) and its paralog Esl2 (Ykr096w) are structural orthologs of metazoan hEST1A/B
      (SMG5/6), sharing a 14-3-3-like Est-one-homology domain and a C-terminal PIN endonuclease domain
      with the four conserved catalytic acidic residues.
    supporting_text: this similarity encompassed the region corresponding to the 14-3-3–like Est-one-homology
      domain (45–51% similarity; Figure 1, A and B) and the C-terminal PIN endonuclease domain (49–53%
      similarity; Figure 1, A and C) with complete conservation of four critical D/E residues required
      for nuclease activity of the PIN-domain proteins
    reference_section_type: RESULTS
  - statement: Single/double mutants showed no defect in the tested NMD-substrate and telomere-maintenance
      assays; these phenotype measurements did not test DNA/RNA binding or complex incorporation.
    supporting_text: unlike their metazoan orthologs, Esl1 and Esl2 were not involved in nonsense-mediated
      mRNA decay or telomere maintenance pathways
    reference_section_type: ABSTRACT
  - statement: Loss of Esl1 and Esl2 deregulates ~50 transcripts, most expressed inversely to the appropriate
      metabolic response to environmental nutrient supply.
    supporting_text: absence of Esl1 and Esl2 led to more than two-fold deregulation of ∼50 transcripts,
      most of which were expressed inversely to the appropriate metabolic response to environmental nutrient
      supply
    reference_section_type: ABSTRACT
  - statement: esl1 esl2 double mutants are synthetic sick with rim8 and dfg16, components of the Rim101
      pH-response environmental-sensing pathway.
    supporting_text: esl1Δ esl2Δ double mutants were synthetic sick with null mutations for Rim8 and Dfg16,
      which form the environmental-sensing complex of the Rim101 pH response gene expression pathway
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Dedicated primary full text read, including methods and Figures 2–6. Ade2-1 and pre-CYH2
      RNA measurements with upf1 controls provide scoped NMD-negative evidence. Telomere-length, senescence,
      silencing and transcript measurements provide functional negatives but do not measure Esl1 nucleic-acid
      binding or holoenzyme membership. Transcriptomic and genetic effects motivate adaptive-regulation
      hypotheses but do not identify the biochemical step performed by Esl1.
