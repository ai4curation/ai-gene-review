    label: fungal-type vacuole
  evidence_type: IDA
  original_reference_id: PMID:11853670
  qualifier: located_in
  review:
    summary: The older fungal-type vacuole row should be narrowed to the vacuolar membrane.
    action: MODIFY
    reason: Modify to GO:0000329 fungal-type vacuole membrane. Ypt7 is a prenylated Rab that cycles onto
      vacuolar and late-endosomal membranes rather than acting in the vacuolar lumen or the entire organelle.
    proposed_replacement_terms:
    - id: GO:0000329
      label: fungal-type vacuole membrane
    supported_by:
    - reference_id: PMID:7489715
      supporting_text: Ypt7p, a ras-like GTPase implicated previously in endocytosis in yeast, is largely
        localized to the vacuole and is required on both partners during the in vitro vacuole fusion reaction.
      reference_section_type: ABSTRACT
