id: P32939
gene_symbol: YPT7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Saccharomyces cerevisiae YPT7 encodes the Rab7/Ypt7-family small GTPase that acts as a prenylated
  GTP/GDP molecular switch on late-endosomal and fungal-type vacuole membranes. Active Ypt7 recruits effector
  complexes including HOPS and retromer to coordinate late endosome-to-vacuole transport, homotypic non-autophagic
  vacuole fusion, autophagic cargo delivery to the vacuole, and retromer-mediated cargo export during
  endosome maturation.
existing_annotations:
- term:
    id: GO:0000011
    label: vacuole inheritance
  evidence_type: IDA
  original_reference_id: PMID:7489715
  qualifier: involved_in
  review:
    summary: Ypt7 is directly required for the homotypic vacuole fusion step used during inheritance.
    action: KEEP_AS_NON_CORE
    reason: Keep as non-core. Haas et al. directly showed that Ypt7 is required on both partner vacuoles
      during homotypic vacuole fusion, the membrane-fusion step that establishes the daughter-cell vacuole
      during inheritance. The deeper molecular role is the Rab7/Ypt7 GTP switch on late-endosomal and
      fungal-type vacuole membranes.
    supported_by:
    - reference_id: PMID:7489715
      supporting_text: Ypt7p is the first GTPase for which a direct role in organelle inheritance has
        been established.
      reference_section_type: ABSTRACT
- term:
