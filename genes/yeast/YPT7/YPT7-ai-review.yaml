core_functions:
- description: Ypt7 acts as the Rab7-family GTP/GDP switch on late-endosomal and fungal-type vacuole membranes,
    where its GTP-bound state recruits HOPS and retromer effectors to coordinate late endosome-to-vacuole
    transport, homotypic non-autophagic vacuole fusion, and retromer-mediated cargo export.
