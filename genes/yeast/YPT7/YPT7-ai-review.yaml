suggested_questions:
- question: Does the Ypt7-retromer pathway that drives Pdr16-marked lipid-droplet internalization during
    nutrient limitation represent a dedicated lipophagy route or a repurposed late-endosome/vacuole fusion
    state?
  experts: []
suggested_experiments:
- description: Compare lipid-droplet internalization and Pdr16 turnover in cells carrying nucleotide-locked
    or effector-selective Ypt7 mutants, and ask whether the phenotype separates genetically from the established
    HOPS-dependent late endosome-to-vacuole and homotypic vacuole-fusion roles.
