  evidence_type: HDA
  original_reference_id: PMID:24769239
  qualifier: located_in
  review:
    summary: The mitochondrial HDA row is likely co-purification from vacuole-mitochondrion contacts.
    action: REMOVE
    reason: Remove. Ypt7 is a prenylated Rab whose direct active compartments are late endosome and fungal-type
      vacuole membranes. The vCLAMP row already captures the direct vacuole-mitochondrion contact-site
      pool, whereas a whole-mitochondrion assignment from high-throughput proteomics overstates that contact-site
      association.
    additional_reference_ids:
    - PMID:25026035
    supported_by:
    - reference_id: PMID:25026035
      supporting_text: vCLAMPs depend on the vacuolar HOPS tethering complex subunit Vps39/Vam6 and the
        Rab GTPase Ypt7
      reference_section_type: ABSTRACT
- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: HDA
  original_reference_id: PMID:16407407
  qualifier: located_in
  review:
    summary: The mitochondrial outer membrane HDA row is likely co-purification from contact sites rather
      than a real outer-membrane targeting signal.
    action: REMOVE
    reason: Remove. Ypt7 lacks a mitochondrial targeting mechanism and acts as a Rab on vacuolar/late-endosomal
      membranes. The direct vCLAMP study supports a vacuole-mitochondrion contact-site role instead of
      residence on the mitochondrial outer membrane.
    additional_reference_ids:
