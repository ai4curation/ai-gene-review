descriptions:
- source: UniProt
  text: Component of the phosphopantothenoylcysteine decarboxylase (PPCDC) involved
    in the coenzyme A synthesis. Acts as an inhibitory subunit of protein phosphatase
    PPZ1, which is involved in many cellular processes such as G1-S transition or
    salt tolerance. Also modulates the expression of the ENA1 ATPase.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P36024
  source_id: P36024
- source: Alliance_Imported
  text: 'Negative regulatory subunit of protein phosphatase 1 (Ppz1p); involved in
    coenzyme A biosynthesis; subunit of the phosphopantothenoylcysteine decarboxylase
    (PPCDC: Cab3p, Sis2p, Vhs3p) complex and the CoA-Synthesizing Protein Complex
    (CoA-SPC: Cab2p, Cab3p, Cab4p, Cab5p, Sis2p and Vhs3p); dose-dependent regulator
    of replicative lifespan; SIS2 has a paralog, VHS3, that arose from the whole genome
    duplication'
  source_type: curated
  url: https://www.yeastgenome.org/locus/SIS2
  source_id: SGD:S000001780
- source: Alliance_Automated
  text: Enables identical protein binding activity and protein serine/threonine phosphatase
    inhibitor activity. Contributes to phosphopantothenoylcysteine decarboxylase activity.
    Involved in coenzyme A biosynthetic process; regulation of mitotic cell cycle;
    and response to salt stress. Located in chromatin and nucleus. Part of CoA-synthesizing
    protein complex and phosphopantothenoylcysteine decarboxylase complex. Used to
    study dilated cardiomyopathy. Orthologous to human PPCDC (phosphopantothenoylcysteine
    decarboxylase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SIS2
  source_id: SGD:S000001780
