    overall_notes: 'Correct and complete: Ppz1 regulatory subunit, PPCDC (Cab3-Sis2-Vhs3)
      and CoA-SPC complex members, and the VHS3 paralog. Calling Ppz1 ''protein phosphatase
      1'' is loose. The replicative lifespan claim is not covered in the review.'
- source: Alliance_Automated
  text: Enables identical protein binding activity and protein serine/threonine phosphatase
    inhibitor activity. Contributes to phosphopantothenoylcysteine decarboxylase activity.
    Involved in coenzyme A biosynthetic process; regulation of mitotic cell cycle;
    and response to salt stress. Located in chromatin and nucleus. Part of CoA-synthesizing
    protein complex and phosphopantothenoylcysteine decarboxylase complex. Used to
    study dilated cardiomyopathy. Orthologous to human PPCDC (phosphopantothenoylcysteine
    decarboxylase).
  source_type: automated
