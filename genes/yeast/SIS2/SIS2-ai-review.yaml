id: P36024
gene_symbol: SIS2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Sis2 (Hal3; YKR072C) is a moonlighting protein of Saccharomyces cerevisiae with two essential, partially
  redundant roles shared with its paralog Vhs3. First, its C-terminal PPCDC (HFCD flavoprotein) domain forms a heterotrimer
  with Cab3 that is the yeast phosphopantothenoylcysteine decarboxylase, the third step of coenzyme A biosynthesis:
  Hal3/Vhs3 contribute the catalytic histidine for the oxidative decarboxylation and Cab3 the catalytic cysteine,
  so neither homotrimer is active. Sis2 is also part of the larger Cab3-centred CoA-synthesizing protein complex.
  Second, Sis2 binds the C-terminal catalytic domain of the Ser/Thr phosphatase Ppz1 as a monomer and inhibits it,
  thereby promoting ENA1 expression, Na+/Li+ tolerance and G1/S progression. Sis2 has a long acidic C-terminal tail
  and is found in cytoplasm and nucleus.'
