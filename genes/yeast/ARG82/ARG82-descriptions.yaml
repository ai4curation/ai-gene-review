  text: Enables inositol phosphate kinase activity; phosphatidylinositol kinase activity;
    and protein-macromolecule adaptor activity. Involved in several processes, including
    organophosphate biosynthetic process; protein stabilization; and regulation of
    transcription by RNA polymerase II. Located in nucleus. Orthologous to human IPMK
    (inositol polyphosphate multikinase).
