suggested_questions:
- question: "Is the nuclear PI(4,5)P2 3-kinase activity of Arg82 physiologically relevant in yeast,\n\
    \                given the near absence of detectable PIP3, and which transcriptional outputs depend\
    \ on it rather\n                than on soluble inositol phosphates?"
- question: "Does Arg82 act as a chaperone that prevents degradation of free Mcm1/Arg80, or does it\n\
    \                transiently assemble with the ArgR-Mcm1 complex on promoters? A more specific MF\
    \ term than\n                adaptor activity may be warranted."
- question: "YeastPathways maps Arg82 and Kcs1 IP5 pyrophosphorylation to GO:0120517 (IP5 -> IP6);\n \
    \               should the YeastPathways-to-GO mapping for this reaction be corrected to GO:0000827?"
suggested_experiments:
- description: "Compare arg82 null, kinase-dead and polyaspartate-deletion alleles by targeted\n     \
    \           inositol-lipid and inositol-phosphate profiling and RNA-seq to partition transcriptional\
    \ effects\n                between soluble InsPs, lipid 3-kinase activity and MADS-box stabilization."
