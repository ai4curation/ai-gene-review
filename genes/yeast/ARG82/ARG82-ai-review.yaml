taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ARG82 (ArgRIII, IPK2, YDR173C) encodes the Saccharomyces cerevisiae inositol polyphosphate
  multikinase (IPMK), the sole inositol trisphosphate kinase of yeast. In the nucleus, Arg82 phosphorylates
  the phospholipase C product Ins(1,4,5)P3 predominantly at the 6-position and then the 3-position (Ins(1,4,5)P3
  -> Ins(1,4,5,6)P4 -> Ins(1,3,4,5,6)P5), and can also phosphorylate IP3 at the 3-position and Ins(1,3,4,5)P4
  at the 6-position; IP5 is then converted to IP6 by Ipk1. Arg82 also pyrophosphorylates IP5 to PP-IP4
  and has a reported nuclear PI(4,5)P2 3-kinase activity. arg82 cells accumulate IP3, lack IP6 and inositol
  pyrophosphates, and are defective in mRNA export, PHO gene repression, NCR gene activation, vacuole
  biogenesis and stress responses. Independently of its kinase activity, an acidic polyaspartate domain
  lets Arg82 bind and stabilize the MADS-box transcription factors Mcm1 and Arg80 (ArgRI), which is required
  for arginine-dependent regulation of arginine anabolic and catabolic genes by the ArgR-Mcm1 complex.
