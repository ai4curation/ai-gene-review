core_functions:
- description: 'Inositol polyphosphate multikinase: ATP-dependent 6- then 3-phosphorylation of Ins(1,4,5)P3
    via Ins(1,4,5,6)P4 to Ins(1,3,4,5,6)P5, the sole route from the PLC product to IP5 (and thence IP6
    via Ipk1) in yeast, acting in the nucleus.'
