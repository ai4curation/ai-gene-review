id: P53853
gene_symbol: VPS75
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Vps75 (YNL246W) is a NAP-family histone chaperone that forms a stable complex with the fungal
  histone H3 acetyltransferase Rtt109 and acts as its activating cofactor. A Vps75 homodimer binds one
  or two Rtt109 molecules; Vps75 raises Rtt109's catalytic rate about 100-fold, stabilizes it, carries
  it into the nucleus through its own nuclear localization signal, and uses its disordered acidic C-terminal
  domain to position the histone H3 N-terminal tail at the Rtt109 active site, so the complex preferentially
  acetylates H3 K9 and K27 of newly synthesized histones. Vps75 is not required for H3 K56 acetylation,
  which depends on the chaperone Asf1. As a chaperone in its own right, Vps75 binds H3-H4 (preferentially
  as a tetramer), assembles nucleosomes in vitro, and independently of Rtt109 is recruited to transcribed
  genes, where it cooperates with the RSC remodeller in H2A-H2B eviction. Vps75 is mainly nuclear. Despite
  its name, which comes from a genome-wide vacuolar protein sorting screen, no direct role in vacuolar
  sorting has been shown.
