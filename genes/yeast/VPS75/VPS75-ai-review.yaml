core_functions:
- description: Activating cofactor of the fungal histone H3 acetyltransferase Rtt109. Vps75 forms a stable
    complex with Rtt109, raises its catalytic rate about 100-fold, stabilizes it and imports it into the
    nucleus, and positions the H3 tail at the active site so that newly synthesized H3 is acetylated on
    K9 and K27.
  molecular_function: *id002
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0070775
    label: H3 histone acetyltransferase complex
  supported_by:
  - *id013
  - *id014
  - reference_id: PMID:21463458
