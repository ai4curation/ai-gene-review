gene_symbol: ADH4
organism: yeast
uniprot_id: P10127
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Alcohol dehydrogenase specific for ethanol. Acts mainyl as a mitochondrial
    formaldehyde dehydrogenase and has no effect on ethanol production (PubMed:2193925).
    Shows drastically reduced activity towards primary alcohols from 4 carbon atoms
    upward. Isomers of aliphatic alcohol, as well as secondary alcohols and glycerol
    are not used at all (PubMed:17938904, PubMed:3282541). The role of ADH4 in yeast
    metabolism is not yet known, but ADH4 is not responsible for the production of
    ethanol during growth on glucose nor responsible for the oxidation of ethanol
    to acetaldehyde (PubMed:22094012).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P10127
  source_id: P10127
- source: Alliance_Imported
  text: Alcohol dehydrogenase isoenzyme type IV; dimeric enzyme demonstrated to be
    zinc-dependent despite sequence similarity to iron-activated alcohol dehydrogenases;
    transcription is induced in response to zinc deficiency
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADH4
  source_id: SGD:S000003225
- source: Alliance_Automated
  text: Enables ethanol dehydrogenase (NAD+) activity. Involved in L-leucine catabolic
    process. Located in mitochondrion. Orthologous to human ADHFE1 (alcohol dehydrogenase
    iron containing 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADH4
  source_id: SGD:S000003225
