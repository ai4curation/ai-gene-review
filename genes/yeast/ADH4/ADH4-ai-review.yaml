      than a family label.
- id: file:yeast/ADH4/ADH4-uniprot.txt
  title: UniProt entry P10127 (ADH4)
  findings:
  - statement: PANTHER subfamily membership is recorded in the source; its official label was cross-checked
      against the local PANTHER ontology. Membership alone does not imply every substrate or cofactor
      property of other members.
    record_section: ["DR:PANTHER"]
    supporting_text: DR   PANTHER; PTHR11496:SF102; ALCOHOL DEHYDROGENASE 4; 1.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Fetched UniProt record checked for curated catalytic, localization, cofactor and family
      statements. DE/GO fields are not independent functional support; similarity-based zinc assignments
      are qualified. The CC FUNCTION statements on ethanol specificity, reduced activity toward longer
      primary alcohols and the limited role in ethanol production agree with PMID:3282541 and PMID:22094012.
      The statement that Adh4 acts mainly as a mitochondrial formaldehyde dehydrogenase is not supported
      by its cited source, PMID:2193925, which studied a mitochondrial acetaldehyde-reducing activity in
      a strain already mutated in ADH4 and does not report formaldehyde oxidation; the yeast formaldehyde
      dehydrogenase is Sfa1p (PMID:12499363).
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P10127
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Acts mainyl as a mitochondrial formaldehyde dehydrogenase and has no effect on
        ethanol production (PubMed:2193925).
      confidence: PROBABLE
      explanation: The FUNCTION comment says that Adh4 "Acts mainyl as a mitochondrial formaldehyde
        dehydrogenase" and cites PubMed:2193925. That paper (Drewke et al. 1990) describes a novel
        mitochondrial acetaldehyde-reducing activity in an adh0 strain that is irreversibly mutated in
        ADH1, ADH3 and ADH4, so the activity it studied cannot be Adh4, and its abstract does not mention
        formaldehyde. No other cited source shows formaldehyde dehydrogenase activity for Adh4; the
        characterised yeast formaldehyde dehydrogenase is Sfa1p. The sentence should be removed or
        supported by a source that assayed Adh4 with formaldehyde; "mainyl" is also a typo for "mainly".
      supported_by:
      - reference_id: PMID:2193925
        supporting_text: This strain (adh0), being irreversibly mutated in the genes ADH1, ADH3, and ADH4
          and carrying a point mutation in the gene ADH2 coding for the glucose-repressible isozyme ADHII,
          still produces up to one third of the theoretical maximum yield of ethanol
      - reference_id: PMID:12499363
        supporting_text: or by Sfa1p (formaldehyde dehydrogenase.)
- id: PMID:22094012
  title: Molecular and physiological aspects of alcohol dehydrogenases in the ethanol metabolism of Saccharomyces
    cerevisiae.
  findings:
  - statement: Quadruple-deletion strains distinguish efficient Adh1-dependent ethanol formation from
      weak Q4/Q5 phenotypes and failure of Q4/Q5 to use ethanol.
    supporting_text: Strains Q4 and Q5 grew poorly on glucose and produced ethanol, but were neither able
      to utilise the produced ethanol nor grow on added ethanol.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary study of five ADH quadruple-deletion strains, despite its broad title. Aerobic
      batch glucose/ethanol phenotypes support Adh1 dominance, Q2/Q3 partial fermentation and Q4/Q5 failure
      to grow on ethanol; they do not establish universal inactivity of Adh4 under every expression or
      zinc condition.
- id: PMID:17938904
  title: Acetaldehyde addition throughout the growth phase alleviates the phenotypic effect of zinc deficiency
    in Saccharomyces cerevisiae.
  findings:
  - statement: Zinc-depleted industrial yeast shows Adh4-associated compensation; the Fe-dependent descriptor
      is not a direct metal assay in the accessible abstract.
    supporting_text: we observed partial compensation by the upregulation of the poorly efficient Fe-dependent
      Adh4p in our conditions.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Primary zinc-depleted industrial-yeast physiology reports partial compensation associated
      with Adh4 upregulation. Its Fe-dependent designation conflicts with the purified-enzyme zinc result;
      the cached abstract does not establish a direct iron reconstitution assay.
- id: file:yeast/ADH4/ADH4-deep-research-sgd.md
  title: SGD gene description for ADH4 (yeast)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: All three claims check out. Adh4 is a dimeric alcohol dehydrogenase activated by zinc
      rather than ferrous ions despite its group III (iron-activated) family membership (PMID:3282541),
      and ADH4 transcription is induced by zinc deficiency, as the review describes.
- id: PMID:2193925
  title: Ethanol formation in adh0 mutants reveals the existence of a novel acetaldehyde-reducing activity
    in Saccharomyces cerevisiae.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Describes a mitochondrial acetaldehyde-reducing activity in a strain
      lacking functional ADH1-4, so it is evidence about Adh-independent ethanol formation, not about
      Adh4. Cited by UniProt for a formaldehyde dehydrogenase role of Adh4 that it does not support.
suggested_questions:
- question: Is ADH4 a zinc- or iron-dependent enzyme in vivo, and does its Zap1-dependent induction under
    zinc deficiency reflect a zinc-sparing replacement for ADH1?
- question: What is the physiological substrate and role of mitochondrial ADH4?
suggested_experiments:
- description: Determine the metal content of ADH4 purified from zinc-replete and zinc-deficient yeast
    by ICP-MS and correlate with activity.
