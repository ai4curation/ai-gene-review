id: P10127
gene_symbol: ADH4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Adh4 is a dimeric NAD(H)-dependent alcohol dehydrogenase in the group III family, structurally
  distinct from the zinc-containing medium-chain Adh1/Adh2/Adh3 enzymes. Purified Adh4 is activated by
  zinc rather than ferrous ions and catalyzes ethanol/acetaldehyde interconversion, with reduced activity
  toward longer primary alcohols. It has been localized to mitochondria and is induced by Zap1 during
  zinc deficiency. Its contribution to bulk ethanol production in standard laboratory glucose cultures
  is limited, and strains retaining only ADH4 among ADH1-5 do not grow on ethanol. Altered-expression
  and zinc-limited conditions implicate a conditional contribution to fermentative redox metabolism. Adh4
  can also redundantly reduce aldehydes to fusel alcohols in the Ehrlich pathway.
