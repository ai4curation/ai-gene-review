id: P10127
gene_symbol: ADH4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADH4 encodes alcohol dehydrogenase IV, a member of the iron-containing (group III) alcohol
  dehydrogenase family, unrelated in fold to the zinc MDR isozymes ADH1/2/3/5. It is normally expressed
  at low levels (induced by Zap1 under zinc deficiency) and has been localised to mitochondria. The purified
  dimeric enzyme oxidises ethanol with NAD+ and shows reduced activity on longer alcohols; it was reported
  to be activated by zinc rather than ferrous ions, although others describe it as Fe-dependent. Strains
  expressing ADH4 as their only ADH cannot use ethanol and ADH4 makes no major contribution to fermentative
  ethanol production; it can, redundantly with the other ADHs and SFA1, reduce Ehrlich-pathway aldehydes
  to fusel alcohols.
