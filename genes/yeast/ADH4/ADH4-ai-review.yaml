- term:
    id: GO:0006068
    label: ethanol catabolic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-4300
  review:
    summary: YeastPathways RCA (ethanol degradation) assigned to every ADH isozyme. Strains in which ADH4
      is the sole ADH gene could neither use produced ethanol nor grow on added ethanol, so ADH4 does
      not support ethanol catabolism in vivo.
    action: REMOVE
    reason: Contradicted by quadruple-deletion analysis.
    supported_by:
    - reference_id: PMID:22094012
      supporting_text: Strains Q4 and Q5 grew poorly on glucose and produced ethanol, but were neither
        able to utilise the produced ethanol nor grow on added ethanol.
- term:
    id: GO:0006550
    label: L-isoleucine catabolic process
  evidence_type: RCA
  original_reference_id: GO_REF:0000123
  qualifier: involved_in
  supporting_entities:
  - SGD_PWY:PWY3O-4109
  review:
    summary: YeastPathways RCA (PWY3O-4109) placing ADH4 at the final aldehyde-reduction step of L-isoleucine
      catabolism (Ehrlich pathway). Gene-specific evidence for this amino acid is lacking, but the general
      finding that any ADH1-5 or SFA1 can perform the final fusel-alcohol step makes a redundant contribution
      plausible.
    action: KEEP_AS_NON_CORE
    reason: Plausible by analogy to tested Ehrlich branches; redundant, not core.
    supported_by:
    - reference_id: PMID:12499363
      supporting_text: the final step of amino acid catabolism (conversion of an aldehyde to a long chain
        or complex alcohol) can be accomplished by any one of the ethanol dehydrogenases (Adh1p, Adh2p,
        Adh3p, Adh4p, Adh5p) or by Sfa1p (formaldehyde dehydrogenase.)
- term:
    id: GO:0006552
    label: L-leucine catabolic process
  evidence_type: IGI
  original_reference_id: PMID:12499363
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000349
  review:
    summary: Dickinson et al. (2003) used combinatorial ADH/AAD/SFA1 mutants to show the final fusel-alcohol
      step of amino-acid catabolism (here leucine to isoamyl alcohol) can be carried out by any one of
      ADH1-5 or SFA1. ADH4 therefore catalyses a step of leucine catabolism, though redundantly.
    action: ACCEPT
    reason: Genetic interaction evidence that the enzyme performs the reductive step of the Ehrlich pathway.
    supported_by:
    - reference_id: PMID:12499363
      supporting_text: the final step of amino acid catabolism (conversion of an aldehyde to a long chain
        or complex alcohol) can be accomplished by any one of the ethanol dehydrogenases (Adh1p, Adh2p,
        Adh3p, Adh4p, Adh5p) or by Sfa1p (formaldehyde dehydrogenase.)
