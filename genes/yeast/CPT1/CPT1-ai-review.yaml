- id: file:yeast/CPT1/CPT1-uniprot.txt
  title: UniProtKB entry P17898 (CPT1_YEAST)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The FUNCTION comment was checked against its cited papers. The CDP-choline route, the
      diacylglycerol species preference and the choline recycling role hold. The sentence that Cpt1 preferentially
      uses CDP-monomethylethanolamine is contradicted by two of the cited papers (PMID:15225629, PMID:1847919),
      which assign CDP-monomethylethanolamine to Ept1 and CDP-choline/CDP-dimethylethanolamine to Cpt1.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P17898
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Preferentially uses CDP-monomethylethanolamine as aminoalcohol substrate.
      confidence: CONFIRMED
      explanation: The CPT1_YEAST FUNCTION comment says "Preferentially uses CDP-monomethylethanolamine
        as aminoalcohol substrate." The cited in vivo study (PMID:15225629) found that CDP-monomethylethanolamine
        is used preferentially by Ept1p, whereas CDP-dimethylethanolamine and CDP-propanolamine are converted
        by Cpt1p; the mixed-micelle study (PMID:1847919) found Cpt1 relatively specific for CDP-choline
        and CDP-dimethylethanolamine. The sentence appears to transfer the Ept1 result to Cpt1 and should
        say that Cpt1 prefers CDP-choline and CDP-dimethylethanolamine.
      supported_by:
      - reference_id: PMID:15225629
        supporting_text: in vivo CDP-monomethylethanolamine is preferentially used as substrate by Ept1p,
          whereas CDP-dimethylethanolamine and CDP-propanolamine are converted by Cpt1p
      - reference_id: PMID:1847919
        supporting_text: the CPT1 gene product manifested relative specificity for CDP-choline and -dimethylethanolamine
