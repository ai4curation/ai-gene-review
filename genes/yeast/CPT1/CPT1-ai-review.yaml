suggested_questions:
- question: 'What is the functional significance of the Cpt1-Ept1 interaction detected in several interactome
    screens: do they form heteromers that alter substrate selectivity or localisation?'
- question: Is the Golgi-localised cholinephosphotransferase activity due to Cpt1 itself, and does it
    supply the PC pool relevant to Sec14-dependent secretion?
suggested_experiments:
- description: Localise endogenously tagged Cpt1 relative to Golgi and ER markers by super-resolution
    microscopy, and measure Golgi PC synthesis in cpt1 and ept1 mutants.
