- id: file:yeast/CPT1/CPT1-deep-research-sgd.md
  title: SGD gene description for CPT1 (yeast)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: SGD curated description (uncited, undated). Checked claims. Cholinephosphotransferase
      required for PC biosynthesis holds (PMID:3029130, PMID:7961735). The requirement for inositol-dependent
      regulation of EPT1 transcription is supported by PMID:7961831 (EPT1 transcripts no longer respond
      to inositol in cpt1 cells) and is now in the review description. The EPT1 paralog relationship
      is consistent with the review.
- id: PMID:7961831
  title: Studies employing Saccharomyces cerevisiae cpt1 and ept1 null mutants implicate the CPT1 gene
    in coordinate regulation of phospholipid biosynthesis.
  findings:
  - statement: Inositol lowers EPT1 transcripts in wild type but not in cpt1 cells; a functional CPT1
      is required for inositol-dependent regulation of phospholipid synthesis.
    supporting_text: in the cpt1 strain, EPT1 transcript levels were not affected by inositol
  reference_review:
