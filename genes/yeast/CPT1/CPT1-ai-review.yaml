id: P17898
gene_symbol: CPT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: CPT1 encodes sn-1,2-diacylglycerol cholinephosphotransferase (EC 2.7.8.2) of Saccharomyces
  cerevisiae, a multi-pass membrane enzyme of the CDP-alcohol phosphatidyltransferase family. Using Mg2+,
  it transfers phosphocholine from CDP-choline to diacylglycerol to form phosphatidylcholine and CMP,
  the final step of the CDP-choline (Kennedy) pathway; it also accepts CDP-dimethylethanolamine. Cpt1
  is relatively specific for CDP-choline, whereas its paralogue Ept1 uses CDP-ethanolamine and CDP-choline;
  Cpt1 provides most cellular cholinephosphotransferase activity. The CDP-choline pathway makes net PC
  when exogenous choline is supplied and otherwise recycles choline from PC turnover, helping to shape
  PC molecular species. Cpt1 is located in the ER membrane, with activity also detected in Golgi and mitochondrial
  outer membrane fractions; it is nonessential and its expression is repressed by inositol.
