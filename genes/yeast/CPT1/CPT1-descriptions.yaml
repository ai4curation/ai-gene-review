descriptions:
- source: UniProt
  text: Catalyzes the final step in the CDP-choline route leading to phosphatidylcholin
    (PC). Preferentially uses CDP-monomethylethanolamine as aminoalcohol substrate.
    Shows highest activity toward di- and mono- unsaturated diacylglycerol species
    as lipid substrates. The CDP-choline pathway only contributes to net PC synthesis
    if exogenous choline is present. In its absence, this pathway recycles choline
    from PC turnover and may contribute to maintaining the proper PC species composition.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P17898
  source_id: P17898
