gene_symbol: NCP1
organism: yeast
uniprot_id: P16603
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: This enzyme is required for electron transfer from NADP to cytochrome P450
    in microsomes. It can also provide electron transfer to heme oxygenase and cytochrome
    B5. Involved in ergosterol biosynthesis. Has NADPH-dependent ferrireductase activity
    on the plasma membrane.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P16603
  source_id: P16603
- source: Alliance_Imported
  text: NADP-cytochrome P450 reductase; involved in ergosterol biosynthesis; associated
    and coordinately regulated with Erg11p
  source_type: curated
  url: https://www.yeastgenome.org/locus/NCP1
  source_id: SGD:S000001084
- source: Alliance_Automated
  text: Enables NADPH dehydrogenase activity; NADPH-hemoprotein reductase activity;
    and electron transfer activity. Involved in ergosterol biosynthetic process. Located
    in endoplasmic reticulum membrane; mitochondrial outer membrane; and plasma membrane.
    Human ortholog(s) of this gene implicated in Antley-Bixler syndrome with disordered
    steroidogenesis; congenital adrenal hyperplasia; cytochrome P450 oxidoreductase
    deficiency; and musculoskeletal system disease. Orthologous to human POR (cytochrome
    p450 oxidoreductase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NCP1
  source_id: SGD:S000001084
