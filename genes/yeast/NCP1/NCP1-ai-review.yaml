id: P16603
gene_symbol: NCP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: NCP1 (YHR042W) encodes NADPH--cytochrome P450 reductase (CPR, EC 1.6.2.4), a diflavin reductase
  that binds FAD and FMN and transfers electrons from NADPH to microsomal cytochrome P450 enzymes and
  other hemoproteins. It is anchored by an N-terminal transmembrane segment in the endoplasmic reticulum
  membrane with its catalytic domain facing the cytoplasm, and is also detected in mitochondrial outer
  membrane and plasma membrane fractions. NCP1 supplies electrons to the ergosterol-pathway oxygenases
  squalene epoxidase (Erg1), lanosterol 14alpha-demethylase (Erg11/CYP51) and sterol C-22 desaturase (Erg5/CYP61).
  Deletion is viable but lowers ergosterol and makes cells highly sensitive to azole antifungals; cytochrome
  b5 (CYB5) provides an alternative electron supply. NCP1 also accounts for the NADPH-dependent ferrireductase
  activity of isolated plasma membranes and can reduce Dph3 in vitro.
