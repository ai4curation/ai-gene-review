    supporting_text: function with the monooxygenases squalene epoxidase, CYP51, and CYP61 in the ergosterol
      biosynthesis pathway
  - reference_id: PMID:11485306
    supporting_text: Protein functionality was demonstrated by cytochrome c reduction and reconstitution
      of CYP61-mediated sterol Delta(22)-desaturation
suggested_questions:
- question: How is electron supply to Erg11 partitioned between Ncp1 and the Cyb5/Cbr1 route in wild-type
    cells, and does the mitochondrial outer membrane pool of Ncp1 support any P450 or other reductive
    activity there?
suggested_experiments:
- description: Quantify sterol intermediates and azole sensitivity in ncp1, cyb5, cbr1 and combined mutants,
    and test an ER-restricted versus MOM-targeted Ncp1 for complementation, to separate the contributions
    of each electron route and compartment.
