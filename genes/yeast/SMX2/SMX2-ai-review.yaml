      reference_id: PMID:9150140
      supporting_text: It contains U1 snRNP as well as Mud2p, which resembles human U2AF65.
    - &id001
      reference_id: PMID:2529976
      supporting_text: U1 snRNP and a substrate containing both a 5' splice site and a branchpoint sequence
        are required for optimal formation of this commitment complex.
    - &id002
      reference_id: PMID:9012791
      supporting_text: These six proteins were sequenced as described above and identified as the yeast
        homologs of the human Sm proteins D1, D2, D3, E, F, and G
- term:
    id: GO:0000245
    label: spliceosomal complex assembly
  evidence_type: NAS
  original_reference_id: PMID:11720284
  qualifier: involved_in
  review:
    summary: Spliceosomal complex assembly. SmG enters each spliceosome as part of the Sm cores of U1,
      U2 and U4/U6.U5 snRNPs.
    action: KEEP_AS_NON_CORE
    reason: 'Sm-ring proteins are structural components of the snRNPs whose stepwise recruitment builds
      the spliceosome (PMID:16618970), so SmG contributes structure to the assembling particle. The specific
      direct evidence in yeast is genetic: SmG RNA-site and interface alleles are synthetically lethal
      with loss of the U2 snRNP Lea1-Msl1 subassembly (PMID:27417296). This is a sub-process of the core
      process (mRNA splicing via spliceosome) and is kept as non-core.'
    supported_by:
    - &id015
      reference_id: PMID:27417296
      supporting_text: We surmise that the function or structural integrity of the yeast U2 snRNP is especially
        sensitive to otherwise benign perturbations of the RNA binding or subunit interfaces of the Sm
        ring when either component of the Lea1•Msl1 subassembly of the U2 snRNP is missing.
    - &id003
      reference_id: PMID:27417296
      supporting_text: Seven different Sm proteins (B, D1, D2, D3, E, F, and G) assemble into a toroidal
        ring that forms the core scaffold of the U1, U2, U4, and U5 small ribonuclear proteins (snRNPs)
        that orchestrate pre-mRNA splicing
- term:
    id: GO:0000387
    label: spliceosomal snRNP assembly
  evidence_type: NAS
  original_reference_id: PMID:11720285
  qualifier: involved_in
  review:
    summary: Spliceosomal snRNP assembly. SmG is one of the seven Sm proteins that assemble, via the F-E-G
      subcomplex, into the heptameric ring around the snRNA Sm site, forming the snRNP core.
    action: ACCEPT
    reason: 'The Sm ring is the product of snRNP core assembly, and SmG contributes structure to it directly:
      it binds SmE (PMID:9528767), is present once per snRNP core (PMID:11302706), and its Sm-site RNA-binding
      residues are needed in combination with those of other Sm subunits for viability (PMID:27417296).
      Being a subunit that self-assembles into the complex is participation in its assembly, not mere
      necessity.'
    supported_by:
    - &id008
      reference_id: PMID:9528767
      supporting_text: We observed interactions between SmB and SmD3, SmE and SmF, and SmE and SmG.
    - reference_id: PMID:11302706
      supporting_text: These results indicate that there is only a single copy of each Sm protein in the
        spliceosomal snRNP core domain and therefore strongly support the heptamer ring model of the spliceosomal
        snRNP core domain.
    - &id004
      reference_id: PMID:27417296
      supporting_text: These all-against-all results for SmG suggest that six intact RNA binding sites
        in the Sm ring can suffice for in vivo function, but five sites may not.
- term:
    id: GO:0000395
    label: mRNA 5'-splice site recognition
  evidence_type: NAS
  original_reference_id: PMID:2529976
  qualifier: involved_in
  review:
    summary: mRNA 5'-splice site recognition, annotated by ComplexPortal from U1 snRNP literature. 5'-splice
      site recognition is carried out by U1 snRNA base pairing assisted by U1-specific proteins; SmG is
      part of the U1 Sm core.
    action: KEEP_AS_NON_CORE
    reason: SmG is a U1 snRNP core component (PMID:9012791), and the U1 snRNP mediates 5'-splice site
      recognition in commitment complex formation (PMID:2529976). There is no evidence that SmG itself
      contacts the 5' splice site; its role is the shared structural Sm core, and genetic data show SmG
      mutations are relatively insensitive to loss of U1-specific subunits (PMID:27417296). Kept as non-core
      rather than removed because the Sm core is an integral part of the U1 particle that performs the
      step.
    supported_by:
    - *id001
    - *id002
