  review:
    summary: IMP, 7-methylguanosine cap hypermethylation, by ComplexPortal from PMID:9528767. In that
      paper the experiment depleted SmE (and cited earlier SmD1/SmD3 work), not SmG.
    action: MARK_AS_OVER_ANNOTATED
