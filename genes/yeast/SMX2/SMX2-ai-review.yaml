    label: commitment complex
  evidence_type: NAS
  original_reference_id: PMID:9150140
  qualifier: part_of
  review:
    summary: Commitment complex (CC1/CC2) is the earliest yeast spliceosomal complex and is defined by
      U1 snRNP bound to the pre-mRNA; SmG enters it as part of the U1 snRNP Sm core.
    action: KEEP_AS_NON_CORE
    reason: SmG is a stable U1 snRNP core protein (PMID:9012791), and the commitment complex contains
      U1 snRNP (PMID:9150140, PMID:2529976). The term is correct by membership but describes one transient
      stage of a shared structural scaffold; the core localization is the snRNPs themselves. The NAS references
      do not assay SmG directly.
    supported_by:
