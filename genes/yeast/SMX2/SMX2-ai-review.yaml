core_functions:
- description: Structural subunit of the heptameric Sm ring that forms the core of the spliceosomal U1,
    U2, U4 and U5 snRNPs. SmG contributes one nucleotide-binding triad (Phe35-Asn37-Arg64) to the ring
    that encircles the uridine-rich Sm site of the snRNA, and in this way supports snRNP integrity and
    pre-mRNA splicing. The individual RNA contacts are redundant, but the ring cannot tolerate the loss
    of two subunit RNA sites.
  contributes_to_molecular_function:
    id: GO:0017069
    label: snRNA binding
  directly_involved_in:
  - id: GO:0000398
    label: mRNA splicing, via spliceosome
  - id: GO:0000387
    label: spliceosomal snRNP assembly
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0097525
    label: spliceosomal snRNP complex
  supported_by:
  - *id006
  - *id021
  - *id004
  - *id002
  - *id011
  - *id014
  - *id008
suggested_questions:
- question: Should Sm-ring subunits whose individual nucleotide contacts are structurally defined carry
    contributes_to snRNA binding (GO:0017069) rather than only the broad RNA binding inherited from the
    SmG/Lsm7 PAINT node?
- question: How is the Sm ring assembled in S. cerevisiae, which lacks SMN; does Brr1 act as a Gemin2-like
    chaperone for the F-E-G subcomplex containing SmG?
suggested_experiments:
- description: Biochemically test the requirement of the SmG Phe35-Asn37-Arg64 triad for Sm-ring assembly
    on U snRNA in yeast extracts (e.g. snRNP assembly/stability and U snRNA levels in the F35A-N37A-R64A
    strain at restrictive temperature), to separate RNA-binding from ring-stability effects.
