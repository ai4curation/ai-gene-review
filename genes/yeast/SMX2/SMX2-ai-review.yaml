id: P40204
gene_symbol: SMX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SMX2 (YFL017W-A) encodes Sm protein G (SmG), a 77-residue Sm-fold protein. It is one of the
  seven essential canonical Sm proteins (SmB, SmD1, SmD2, SmD3, SmE, SmF and SmG) that form the heptameric
  Sm ring, the core scaffold of the spliceosomal U1, U2, U4 and U5 snRNPs. SmG first associates with SmE
  and SmF in an F-E-G subcomplex. In the assembled ring it binds a uridine of the snRNA Sm site through
  a Phe35-Asn37-Arg64 triad, contacts the neighbouring SmE through Arg23, and occurs as a single copy
  per snRNP core. In S. cerevisiae SmG has been identified by biochemical purification and mass spectrometry
  in U1, U2 and U5 snRNPs, the U4/U6.U5 tri-snRNP, prespliceosomes, the Cef1/CWC complex and the penta-snRNP,
  and it is present in cryo-EM structures of yeast spliceosomes. The gene is essential. Single alanine
  substitutions in its RNA-binding triad are tolerated, but combined triad mutations cause temperature-sensitive
  growth, and pairing them with RNA-site mutations in other Sm subunits is lethal. This indicates that
  the Sm ring tolerates the loss of one RNA contact site but not two. SmG acts mainly in the nucleus,
  in pre-mRNA splicing; snRNP biogenesis may involve a cytoplasmic precursor stage.
