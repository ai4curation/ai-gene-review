taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Plays a role in pre-mRNA splicing as a core component of the spliceosomal
    U1, U2, U4 and U5 small nuclear ribonucleoproteins (snRNPs), the building blocks
    of the spliceosome (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P40204
  source_id: P40204
- source: Alliance_Imported
  text: Core Sm protein Sm G; part of heteroheptameric complex (with Smb1p, Smd1p,
    Smd2p, Smd3p, Sme1p, and Smx3p) that is part of the spliceosomal U1, U2, U4, and
    U5 snRNPs; homolog of human Sm G
  source_type: curated
  url: https://www.yeastgenome.org/locus/SMX2
  source_id: SGD:S000002965
- source: Alliance_Automated
  text: Predicted to contribute to RNA binding activity. Involved in 7-methylguanosine
    cap hypermethylation and mRNA splicing, via spliceosome. Part of U2-type prespliceosome
    and spliceosomal snRNP complex. Orthologous to several human genes including SNRPG
    (small nuclear ribonucleoprotein polypeptide G).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SMX2
  source_id: SGD:S000002965
