descriptions:
- source: UniProt
  text: This enzyme has both RNase and DNase activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P08466
  source_id: P08466
- source: Alliance_Imported
  text: Major mitochondrial nuclease; has RNAse and DNA endo- and exonucleolytic activities;
    prevents genome instability by degrading extranuclear DNA sequences; roles in
    mitochondrial recombination, apoptosis and maintenance of polyploidy;  involved
    in fragmentation of genomic DNA during PND (programmed nuclear destruction); role
    in preventing L-A mycovirus pathogenesis; encodes ortholog of mammalian endoG
  source_type: curated
  url: https://www.yeastgenome.org/locus/NUC1
  source_id: SGD:S000003744
- source: Alliance_Automated
  text: Enables DNA endonuclease activity; DNA exonuclease activity; and RNA nuclease
    activity. Involved in several processes, including DNA metabolic process; mitophagy;
    and regulation of mitochondrial DNA metabolic process. Located in cytosol; mitochondrial
    inner membrane; and nucleus. Orthologous to several human genes including ENDOG
    (endonuclease G).
  source_type: automated
  url: https://www.yeastgenome.org/locus/NUC1
  source_id: SGD:S000003744
