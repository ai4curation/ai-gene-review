suggested_experiments:
- hypothesis: Cytosolic Nuc1 attenuates L-A and Killer viruses by directly cleaving viral dsRNA or a viral replication intermediate
    during meiosis.
  description: Purify meiotic cytosolic Nuc1-RNP complexes from wild-type and H138A nuclease-dead strains, identify bound
    viral RNAs by RT-qPCR or RNA sequencing, and compare L-A/M1 RNA cleavage products in wild-type, nuc1-null, and nuclease-dead
    sporulating cells.
  experiment_type: nuclease substrate mapping
- hypothesis: During mitophagy, Nuc1 degrades mtDNA before or during vacuolar autophagic-body breakdown rather than regulating
    the core Atg11/Atg32 mitophagy pathway.
  description: Follow mtDNA escape reporters and mitophagy flux in nuc1 catalytic and mitochondrial-localization mutants,
    with and without ATG15, to distinguish failed mtDNA degradation from altered delivery of mitochondria to the vacuole.
  experiment_type: epistasis and live-cell mtDNA reporter assay
