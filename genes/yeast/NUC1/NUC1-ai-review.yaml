id: P08466
gene_symbol: NUC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  NUC1 encodes the budding yeast mitochondrial EndoG-family nuclease, a
  metal-dependent DNA/RNA nuclease that resides at the mitochondrial inner
  membrane and accounts for most nonspecific nuclease activity in mitochondria.
  It acts in mitochondrial nucleic-acid turnover and mitochondrial DNA
  recombination, can degrade mitochondrial DNA destined for mitophagy-associated
  vacuolar escape, and is released from mitochondria into the cytosol during
  sporulation to attenuate L-A and Killer double-stranded RNA mycoviruses. Nuc1
  also has a conserved apoptotic nuclease role: mitochondrial release, nuclear
  import, and chromatin association of Nuc1 drive yeast apoptotic death in
  overexpression and respiration-dependent death contexts, and Nuc1 is required
  for apoptotic-like DNA laddering of discarded meiotic nuclei during
  gametogenesis.
