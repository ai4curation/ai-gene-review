descriptions:
- source: UniProt
  text: Protein kinase required for the cell cycle where it is involved in mitotic
    exit (PubMed:11371343, PubMed:32099015). A component of the fear (CDC14 early
    anaphase release) network which promotes CDC14 release from the nucleolus during
    early anaphase (PubMed:11832211, PubMed:32099015). Phosphorylates SCC1/MCD1 and
    NET1 (PubMed:12056824).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P32562
  source_id: P32562
- source: Alliance_Imported
  text: Polo-like kinase required for mitotic exit; regulates mitotic spindle assembly,
    nuclear shape, and protein localization to the nucleolus and SPBs; controls targeting
    and activation of Rho1p at the division site via Rho1p-GEFs; role in adaptation
    to DNA damage promotes genome instability during replicative senescence; regulates
    meiotic commitment, spindle assembly, chiasmata formation, recombination intermediate
    resolution and SC disassembly; human homologs PLK1 and PLK3 complement cdc5 mutants
  source_type: curated
  url: https://www.yeastgenome.org/locus/CDC5
  source_id: SGD:S000004603
- source: Alliance_Automated
  text: Enables centromeric DNA binding activity; phosphoprotein binding activity;
    and protein kinase activity. Involved in several processes, including chromosome
    organization; nuclear division; and regulation of protein localization to nucleus.
    Acts upstream of or within regulation of protein localization to nucleolus. Located
    in cellular bud neck; microtubule cytoskeleton; and nucleus. Human ortholog(s)
    of this gene implicated in urinary bladder cancer. Orthologous to several human
    genes including PLK1 (polo like kinase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/CDC5
  source_id: SGD:S000004603
