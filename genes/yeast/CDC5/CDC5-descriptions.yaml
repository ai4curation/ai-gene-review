findings:
- category: discrepancy
  text: The automated text says Cdc5 binds centromeric DNA; the review modifies that
    annotation because the evidence is cohesin-mediated chromatin association and
    Cdc5 has no DNA-binding domain.
  sources:
  - Alliance_Automated
