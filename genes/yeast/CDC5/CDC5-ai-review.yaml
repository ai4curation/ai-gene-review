core_functions:
- description: 'Mitotic-entry kinase: docked at the bud neck and in the nucleus, Cdc5 phosphorylates the
    Cdk1-inhibitory kinase Swe1 to trigger its degradation, promotes nuclear entry of the Cdc25 phosphatase
    Mih1, and phosphorylates the co-activator Ndd1 on Fkh2-bound CLB2-cluster promoters, together driving
    the G2/M transition.'
  supported_by:
  - reference_id: PMID:41927924
    supporting_text: Cdc5 promotes Cdk1 activation by inducing Swe1 degradation and facilitating Mih1
      nuclear translocation
  - reference_id: PMID:11438652
    supporting_text: These results also suggest that Cdc5 may be a negative regulator of Swe1.
  - reference_id: PMID:17122856
    supporting_text: through direct phosphorylation of the coactivator protein Ndd1p
  molecular_function: &id002
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
