- description: 'Mitotic-exit kinase (FEAR and MEN): Cdc5 phosphorylates the nucleolar anchor Net1/Cfi1
    and Cdc14 to release Cdc14 in early anaphase, and at the SPB inhibits the Bfa1-Bub2 GAP, recruits
    Cdc15 together with Tem1, and primes Net1 so that Dbf2-Mob1 reaches the nucleolus to fully activate
    Cdc14 and drive exit from mitosis.'
  supported_by:
  - reference_id: PMID:14551257
    supporting_text: overexpression of CDC5 led to Cdc14 release from the nucleolus in S phase-arrested
      cells, which correlated with the appearance of phosphorylated forms of Cdc14 and Cfi1/Net1.
  - reference_id: PMID:12637549
    supporting_text: when Bfa1 is phosphorylated by Cdc5, its GAP activity with Bub2 is inhibited although
      its ability to interact with Tem1 is unaffected
  - reference_id: PMID:21937712
    supporting_text: both Tem1 and Cdc5 are required to recruit the MEN kinase Cdc15 to spindle pole bodies,
      which is both necessary and sufficient to induce MEN signaling
  - reference_id: PMID:33481703
    supporting_text: priming phosphorylation of Cfi1/Net1, the nucleolar anchor of Cdc14, by the Polo-like
