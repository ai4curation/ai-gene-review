  review:
    summary: Affinity purification and two-hybrid assays show a Cdc5-Swe1 interaction; Cdc5 overexpression
      titrates Swe1 function and Cdc5 is proposed as a negative regulator of Swe1.
    action: REMOVE
    reason: Bare protein binding is uninformative. The interaction is real and is the basis of the G2/M-transition
      annotation, but this paper does not characterise the binding mode (the polo-box/phospho-dependence
      of Swe1 docking was established later), so no more specific MF can be assigned from it. Removal
      does not imply the interaction is false.
