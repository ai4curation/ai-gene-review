- description: 'Cytokinesis kinase at the bud neck: Cdc5 phosphorylates the Rho1 GEFs Tus1 and Rom2 to
    target and activate Rho1 at the division site and primes the F-BAR protein Hof1 for Dbf2-Mob1 phosphorylation,
    promoting actomyosin-ring assembly, contraction and membrane ingression.'
  supported_by:
