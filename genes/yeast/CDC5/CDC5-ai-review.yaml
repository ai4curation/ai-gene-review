    label: cellular bud neck
  - id: GO:0005634
    label: nucleus
- description: 'Chromosome-segregation kinase: pre-deposited on cohesin via polo-box binding to Cdk1-primed
    Scc1, Cdc5 phosphorylates Scc1 adjacent to its separase sites to enhance cleavage at anaphase, is
    enriched at centromeres to remove centromeric cohesin, cooperates with Cdc14 to regulate Top2-mediated
    catenane resolution, and phosphorylates Cdh1 after Cdk1 priming to inactivate APC/C-Cdh1 so that Cin8/Kip1
    accumulate for SPB separation and bipolar spindle assembly.'
  supported_by:
  - reference_id: PMID:11371343
    supporting_text: the Polo/Cdc5 kinase phosphorylates serine residues adjacent to Scc1 cleavage sites
      and strongly enhances their cleavage
  - reference_id: PMID:27325700
    supporting_text: The Cdc5-cohesin association is mediated by direct interaction between the polo-box
      domain of Cdc5 and Scc1 phosphorylated at multiple sites in its middle region.
  - reference_id: PMID:27226485
    supporting_text: Cdc5 associates with centromeric chromatin and cohesin-associated regions.
  - reference_id: PMID:18500339
    supporting_text: adequate accumulation of Cin8 and Kip1 requires inactivation of the anaphase-promoting
      complex-activator Cdh1 through sequential phosphorylation by Cdk1 and polo kinase
