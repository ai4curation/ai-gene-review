- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IPI
  original_reference_id: PMID:27325700
  qualifier: involved_in
  supporting_entities:
  - SGD:S000002161
  - SGD:S000003610
  review:
    summary: Cdc5 promotes the G2/M transition by phosphorylating the Cdk1 inhibitory kinase Swe1 for
      degradation and by promoting nuclear entry of the Cdc25 phosphatase Mih1; it also phosphorylates
      the CLB2-cluster co-activator Ndd1. The IPI reference (Pakchuen 2016) documents PBD-dependent docking
      of Cdc5 on cohesin in G2/M-phase cells rather than the transition itself, so the G2/M role rests
      mainly on the Swe1/Mih1 literature.
    action: ACCEPT
    reason: 'Core function: Cdc5 does the work of the transition (it is the kinase that primes Swe1 destruction
      and drives Mih1 import). The cited paper supports the timing (Cdc5 pre-deposited on cohesin in G2/M
      cells) and the polo-box docking mechanism, and the Swe1/Mih1 papers supply the mechanistic evidence;
      the term is retained as the module-level G2/M annotation for the budding-yeast Polo kinase.'
    additional_reference_ids:
    - PMID:11438652
    - PMID:41927924
    supported_by:
    - reference_id: PMID:27325700
      supporting_text: budding yeast Plk1, Cdc5, is pre-deposited onto cohesin engaged in cohesion on
        chromosome arms in G2/M phase cells
    - reference_id: PMID:11438652
      supporting_text: These results also suggest that Cdc5 may be a negative regulator of Swe1.
    - reference_id: PMID:41927924
      supporting_text: Cdc5 promotes Cdk1 activation by inducing Swe1 degradation and facilitating Mih1
        nuclear translocation
    - reference_id: file:yeast/CDC5/CDC5-deep-research-falcon.md
