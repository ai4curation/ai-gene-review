proposed_new_terms: []
suggested_questions:
- question: Cdc5's phosphorylation of Ndd1 on Fkh2-bound CLB2-cluster promoters (PMID:17122856) is represented
    in GOA only as kinase activity and an Fkh2 interaction; should a transcription-regulation process
    term (e.g. positive regulation of transcription by RNA polymerase II) be added to Cdc5, or is that
    role deliberately confined to NDD1/FKH2?
- question: Should 'DNA conformation change' remain on Cdc5 given that Top2 performs the topological step
    and Cdc5 only modulates Top2 phosphorylation/SUMOylation/localisation, or is a sister-chromatid-segregation
    term the intended level?
- question: Cdc5-dependent checkpoint adaptation (Rad53 attenuation, PMID:20126259) has no GOA process
    term; is this intentional because the mechanism is still indirect, or should a DNA-damage-checkpoint
    regulation term be considered?
suggested_experiments:
- description: Analog-sensitive cdc5-as1 with stage-resolved phosphoproteomics to separate direct Cdc5
    substrates from Cdk1-, Dbf2-Mob1- and Cdc15-dependent secondary events at the SPB, nucleolus and bud
    neck.
- description: Site-directed mutagenesis of Cdc5-dependent Top2 phosphosites (identified by phosphoproteomics
    in cdc5-as1 cells) to test whether direct Top2 phosphorylation, rather than Ulp2/SUMO-dependent effects,
    mediates catenane resolution.
- description: Separation-of-function alleles (kinase-dead, PBD phosphopeptide-pocket and Dbf4-surface
    mutants) scored for Swe1 turnover, Cdc14 release, SPB separation and Rho1 activation to map which
    outputs require catalysis versus PBD docking.
