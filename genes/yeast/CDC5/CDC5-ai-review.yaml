- term:
    id: GO:0000712
    label: resolution of meiotic recombination intermediates
  evidence_type: IMP
  original_reference_id: PMID:12717442
  qualifier: involved_in
  review:
    summary: Cells lacking Cdc5 during meiosis synapse and initiate recombination normally but fail to
      resolve joint molecules as crossovers; Cdc5 expression alone in ndt80 cells drives JM resolution.
      Mechanistically Cdc5 phosphorylates and activates the Mus81-Mms4 resolvase, so it acts as the kinase
      that licenses resolution rather than the nuclease.
    action: KEEP_AS_NON_CORE
    reason: Genuine, well-replicated meiotic function, but meiosis-specific and executed via activation
      of the Mus81-Mms4 resolvase; non-core relative to the mitotic entry/segregation/exit roles.
    additional_reference_ids:
    - PMID:18832066
    supported_by:
    - reference_id: PMID:12717442
      supporting_text: fail to efficiently resolve recombination intermediates as crossovers
    - reference_id: PMID:18832066
      supporting_text: Cdc5 kinase promotes JM resolution in the absence of all other members of the Ndt80
        regulon.
