id: P32562
gene_symbol: CDC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: 'Cdc5 is the sole Polo-like kinase of Saccharomyces cerevisiae, an essential serine/threonine
  protein kinase (EC 2.7.11.21) with an N-terminal catalytic domain and a C-terminal polo-box domain (PBD)
  that docks the enzyme onto substrates and anchors pre-phosphorylated by Cdk1 (Cdc28) and other priming
  kinases. Its transcript and protein peak in G2/M, its activity is restricted to mitosis, and the protein
  is destroyed by APC/C-Cdh1 in G1. Through PBD-directed targeting Cdc5 acts at the nucleus and chromosomes,
  the spindle pole body (SPB), the nucleolus and the mother-bud neck, and it coordinates the late cell
  cycle by phosphorylating a small number of well-characterised substrates at each site. It promotes mitotic
  entry by phosphorylating the Wee1-type kinase Swe1 for degradation, promoting nuclear entry of the Cdc25
  phosphatase Mih1 and phosphorylating the co-activator Ndd1 to drive CLB2-cluster transcription. It licenses
  sister-chromatid separation by phosphorylating the cohesin subunit Scc1/Mcd1 adjacent to its separase
  cleavage sites, docking on cohesin along chromosome arms and at centromeres, and it promotes bipolar
  spindle formation by phosphorylating the APC/C activator Cdh1 after Cdk1 priming so that the kinesins
  Cin8 and Kip1 accumulate for SPB separation. It is a component of both pathways that activate the Cdc14
  phosphatase for mitotic exit: in the FEAR network it phosphorylates the nucleolar anchor Net1/Cfi1 and
  Cdc14 to release Cdc14 in early anaphase, and in the mitotic exit network it inhibits the Bfa1-Bub2
  GAP, recruits the Cdc15 kinase to SPBs with Tem1, and primes Net1 so that Dbf2-Mob1 can reach the nucleolus.
  At the bud neck it phosphorylates the Rho1 GEFs Tus1 and Rom2 to activate Rho1 and phosphorylates the
  F-BAR protein Hof1, promoting actomyosin-ring assembly and cytokinesis. Together with Cdc14 it regulates
  topoisomerase II to resolve sister-chromatid catenanes during anaphase. In meiosis, Ndt80-induced Cdc5
  drives exit from pachytene, synaptonemal-complex disassembly, resolution of recombination intermediates
  via Mus81-Mms4, monopolin recruitment for sister-kinetochore mono-orientation, and Swe1/Mih1-dependent
  Cdk1 activation at meiosis I entry. Cdc5 also attenuates the DNA-damage checkpoint by limiting Rad53
  hyperphosphorylation, allowing adaptation to persistent damage, and it shapes the mitotic nucleus during
  prolonged arrest.'
