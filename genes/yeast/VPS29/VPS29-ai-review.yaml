  review:
    summary: ComplexPortal process for the retromer complex (CPX-1653); shown on the UniProt record as
      the synonym 'endocytic recycling'.
    action: KEEP_AS_NON_CORE
    reason: Vps29 is required to recycle endocytosed Ftr1, which needs Snx3 and retromer and goes back
      to the surface through the Golgi (PMID:17420293). It is also required for retromer-dependent recycling
      of Chs3 (PMID:28362258). In yeast retromer performs the endosome-to-Golgi leg of these routes rather
      than a direct endosome-to-plasma-membrane step, so the term is a real but secondary outcome of the
      core retrieval function. The cited paper itself concerns Vps10 retrieval.
    supported_by:
    - reference_id: PMID:17420293
      supporting_text: Ftr1p-GFP is mislocalized to the lumen of the vacuole in cells that lack a functional
        retromer complex (vps5Δ, vps17Δ, vps26Δ, vps29Δ, and vps35Δ) or the sorting nexin Grd19p (grd19Δ).
    - reference_id: PMID:17420293
      supporting_text: After export from the endosome, Fet3p-Ftr1p transits through the Golgi apparatus
        for resecretion.
    - reference_id: PMID:28362258
