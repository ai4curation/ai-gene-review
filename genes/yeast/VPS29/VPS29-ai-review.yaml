- id: file:yeast/VPS29/VPS29-deep-research-sgd.md
  title: SGD gene description for VPS29 (yeast)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Every claim traced. Retromer subunit and subcomplex with Vps35 and Vps26 (PMID:9700157);
      endosome-to-Golgi retrograde transport (PMID:9105038, PMID:9700157); "endosomal protein" is accurate
      for the membrane pool, though most Vps29 is soluble (PMID:9700157). The text omits the Vps5-binding
      role (PMID:38598303, PMID:40234461) and the CROP complex (PMID:35466426).
core_functions:
- description: Phosphoesterase-fold scaffold subunit of the retromer cargo-selective complex (Vps35-Vps26-Vps29).
    It binds the C-terminal region of Vps35 and the N-terminal motifs of the SNX-BAR Vps5, which ties
    the cargo-selective trimer to the Vps5-Vps17 membrane layer. This allows retrieval of Vps10 and late-Golgi
    proteins from the prevacuolar endosome to the trans-Golgi network.
  contributes_to_molecular_function:
    id: GO:0140312
    label: cargo adaptor activity
  directly_involved_in:
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  locations:
  - id: GO:0005768
    label: endosome
  in_complex:
    id: GO:0030906
    label: retromer, cargo-selective complex
  supported_by:
  - reference_id: PMID:38598303
    supporting_text: Taken together, these data suggest that Vps5 interacts with Vps29 through an N-terminal
      bipartite pocket- and sheet-binding motif that is critical for both retromer assembly and efficient
      sorting.
  - reference_id: PMID:9105038
    supporting_text: Together, the data indicate that the VPS29, VPS30, and VPS35 gene products are required
      for the normal recycling of Vps10p from the prevacuolar endosome back to the Golgi where it can initiate
      additional rounds of vacuolar hydrolase sorting.
  - reference_id: PMID:9700157
    supporting_text: demonstrating that Vps35p is required for membrane association of Vps29p.
- description: Subunit of the CROP complex, in which the Vps26-Vps29-Vps35 trimer binds the PROPPIN Atg18
    and potentiates its membrane fission activity, as required for vacuole fission. No process term is
    given, because GO:0140572 vacuole fission has no annotations in S. cerevisiae (see suggested questions).
  in_complex:
    id: GO:0170071
    label: CROP complex
  supported_by:
  - reference_id: PMID:35466426
    supporting_text: Thus, both CSC and Atg18 are required for vacuole fission.
  - reference_id: PMID:35466426
    supporting_text: the CSC mutants vps26Δ, vps29Δ and vps35Δ showed fewer and larger vacuoles than the
      wild type
suggested_questions:
- question: Does the disordered acidic segment of yeast Vps29 (residues 173-242), which is absent from
    human VPS29, contribute to the unusually stable association of the trimer with Vps5-Vps17 in S. cerevisiae?
- question: Is the Vps29 hydrophobic pocket that binds the Vps5 FTDPL motif also used by other yeast retromer
    partners, for example a TBC-domain Rab GAP or the PROPPINs in CROP, so that these partners compete with
    Vps5?
- question: Should CROP subunits be annotated to GO:0140572 vacuole fission, given that vps29Δ cells have
    fewer and larger vacuoles and the trimer potentiates Atg18-driven fission?
suggested_experiments:
- description: Delete or replace the yeast-specific disordered segment of Vps29 and test pentamer stability
    by co-immunoprecipitation, Vps10 sorting and CPY secretion, compared with the Vps5 PL-motif mutant.
- description: Purify yeast Vps29 and test it for metal binding and phosphoesterase activity on generic
    and phosphopeptide substrates, to confirm that the yeast protein, like the mammalian one, is a catalytically
    inactive scaffold.
