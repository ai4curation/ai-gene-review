taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Vps29 is the smallest subunit of the Saccharomyces cerevisiae retromer cargo-selective
  complex, a Vps35-Vps26-Vps29 trimer that associates with the SNX-BAR heterodimer Vps5-Vps17 to form
  the pentameric retromer coat on endosomes. It has a metallophosphoesterase-like fold. The mammalian
  orthologue binds metals but shows no phosphoesterase activity, and the fold serves as a protein-interaction
  scaffold. The yeast protein is longer than its human orthologue and carries a predicted disordered acidic
  segment. Vps29 binds the C-terminal region of Vps35, and in the coat it sits at the apex of the Vps35
  arch. Most Vps29 is soluble, in a cytosolic complex with Vps35, and the protein depends on Vps35 for
  membrane association. Vps29 is needed for the trimer to join Vps5-Vps17. A bipartite motif, including
  a Pro-Leu motif in the disordered N-terminus of Vps5, binds a conserved hydrophobic pocket and a second
  site on Vps29, and this contact is required for pentamer assembly and Vps10 recycling. Retromer retrieves
  the carboxypeptidase Y receptor Vps10 and late-Golgi membrane proteins from the prevacuolar endosome
  to the trans-Golgi network, so vps29 mutants mislocalise Vps10 to the vacuole and secrete carboxypeptidase
  Y. With the sorting nexin Snx3, retromer also recycles endocytosed plasma-membrane proteins such as
  Ftr1 by way of the Golgi. Vps29 is also part of the retromer-PROPPIN assemblies with Atg18 (the CROP
  complex, which drives vacuole fission) and Atg21, and the trimer binds GTP-loaded Ypt7.
