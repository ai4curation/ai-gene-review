descriptions:
- source: UniProt
  text: Membrane-anchoring mono-heme cytochrome b subunit of succinate dehydrogenase
    (SDH) that is involved in system II of the mitochondrial electron transport chain
    and is responsible for transferring electrons from succinate to ubiquinone (coenzyme
    Q). SDH3 and SDH4 form the membrane dimer that anchors the catalytic dimer formed
    by SDH1 and SDH2 to the matrix surface of the mitochondrial inner membrane. Electrons
    originating from the catalytic dimer enter the membrane dimer for ubiquinone reduction.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33421
  source_id: P33421
- source: Alliance_Imported
  text: Subunit of succinate dehydrogenase and of TIM22 translocase; functions as
    cytochrome b subunit of succinate dehydrogenase, which couples oxidation of succinate
    to transfer of electrons to ubiquinone as part of the TCA cycle and the mitochondrial
    respiratory chain; also required for mitochondrial inner membrane protein import
    as part of the TIM22 complex; SDH3 has a paralog, SHH3, that arose from the whole
    genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/SDH3
  source_id: SGD:S000001624
- source: Alliance_Automated
  text: Contributes to succinate dehydrogenase (quinone) activity. Involved in mitochondrial
    electron transport, succinate to ubiquinone; protein insertion into mitochondrial
    inner membrane; and tricarboxylic acid cycle. Located in mitochondrial inner membrane.
    Part of TIM22 mitochondrial import inner membrane insertion complex and respiratory
    chain complex II (succinate dehydrogenase). Human ortholog(s) of this gene implicated
    in Carney-Stratakis syndrome; gastrointestinal stromal tumor; lung non-small cell
    carcinoma; paraganglioma; and pheochromocytoma/paraganglioma syndrome 3. Orthologous
    to human SDHC (succinate dehydrogenase complex subunit C).
  source_type: automated
  url: https://www.yeastgenome.org/locus/SDH3
  source_id: SGD:S000001624
