descriptions:
- source: UniProt
  text: Membrane-anchoring mono-heme cytochrome b subunit of succinate dehydrogenase
    (SDH) that is involved in system II of the mitochondrial electron transport chain
    and is responsible for transferring electrons from succinate to ubiquinone (coenzyme
    Q). SDH3 and SDH4 form the membrane dimer that anchors the catalytic dimer formed
    by SDH1 and SDH2 to the matrix surface of the mitochondrial inner membrane. Electrons
    originating from the catalytic dimer enter the membrane dimer for ubiquinone reduction.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P33421
  source_id: P33421
