id: P33421
gene_symbol: SDH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SDH3 (YKL141W) encodes the large cytochrome b subunit (CybL) of mitochondrial succinate dehydrogenase
  (complex II). With Sdh4p it forms the integral inner-membrane dimer that anchors the catalytic Sdh1p/Sdh2p
  dimer on the matrix side. Together with Sdh2p and Sdh4p it builds the ubiquinone-reduction site. Sdh3p
  His-106 and Sdh4p Cys-78 are the axial ligands of a stoichiometric b562 heme, but in yeast this heme
  is not needed for succinate-to-quinone electron transfer or for assembly. Sdh3p is also a subunit of
  the TIM22 carrier translocase. There it forms a subcomplex with Tim18 and supports assembly of the membrane-integral
  TIM22 subunits, which insert carrier proteins into the inner membrane.
