  review:
    summary: InterPro2GO (cytochrome b560 domains IPR014314/IPR018495) to electron transfer activity.
      Sdh3p holds the b562 heme with Sdh4p, but in yeast heme is dispensable for succinate-to-quinone
      electron transfer (Oyedotun et al. 2007). Whether the heme carries electrons is unresolved. Sdh3p's
      established MF is forming the quinone site and the membrane anchor.
    action: KEEP_AS_NON_CORE
    reason: Plausible for the b-heme subunit, but yeast heme-ligand mutants transfer electrons without
      heme, so this is not the subunit's demonstrated core activity.
    supported_by:
    - reference_id: PMID:18028869
      supporting_text: Our results strongly suggest that heme is not required for electron transport from
        succinate to quinone nor is it necessary for assembly of the S. cerevisiae SDH.
