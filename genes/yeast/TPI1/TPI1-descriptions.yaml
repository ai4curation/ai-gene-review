descriptions:
- source: Alliance_Imported
  text: Triose phosphate isomerase, abundant glycolytic enzyme; mRNA half-life is
    regulated by iron availability; transcription is controlled by activators Reb1p,
    Gcr1p, and Rap1p through binding sites in the 5' non-coding region; inhibition
    of Tpi1p activity by PEP (phosphoenolpyruvate) stimulates redox metabolism in
    respiring cells; E104D mutation in human homolog TPI1 causes a rare autosomal
    disease; human TPI1 can complement yeast null mutant
