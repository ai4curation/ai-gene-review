descriptions:
- source: Alliance_Imported
  text: Triose phosphate isomerase, abundant glycolytic enzyme; mRNA half-life is
    regulated by iron availability; transcription is controlled by activators Reb1p,
    Gcr1p, and Rap1p through binding sites in the 5' non-coding region; inhibition
    of Tpi1p activity by PEP (phosphoenolpyruvate) stimulates redox metabolism in
    respiring cells; E104D mutation in human homolog TPI1 causes a rare autosomal
    disease; human TPI1 can complement yeast null mutant
  source_type: curated
  url: https://www.yeastgenome.org/locus/TPI1
  source_id: SGD:S000002457
- source: Alliance_Automated
  text: Enables triose-phosphate isomerase activity. Involved in glycolytic process.
    Located in mitochondrion. Used to study cancer and triosephosphate isomerase deficiency.
    Human ortholog(s) of this gene implicated in carbohydrate metabolic disorder and
    triosephosphate isomerase deficiency. Orthologous to human TPI1 (triosephosphate
    isomerase 1).
  source_type: automated
  url: https://www.yeastgenome.org/locus/TPI1
  source_id: SGD:S000002457
