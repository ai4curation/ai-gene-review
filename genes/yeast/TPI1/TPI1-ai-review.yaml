suggested_questions:
- question: How much of the redox/oxidant-tolerance phenotype of reduced TIM activity (DHAP accumulation, PPP rerouting) operates
    in wild-type cells under oxidative stress?
suggested_experiments:
- description: Titrate TPI1 expression (promoter series) and measure DHAP, methylglyoxal, glycerol and pentose-phosphate flux
    to define the activity threshold at which glycolytic flux becomes limiting.
