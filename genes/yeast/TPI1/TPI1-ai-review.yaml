  label: Saccharomyces cerevisiae S288C
description: Triosephosphate isomerase (Tpi1, YDR050C) is the single triose-phosphate isomerase of Saccharomyces cerevisiae
  (EC 5.3.1.1), a homodimeric TIM-barrel enzyme that catalyses the reversible interconversion of dihydroxyacetone phosphate
  (DHAP) and D-glyceraldehyde 3-phosphate (GAP). In glycolysis it converts the DHAP produced by aldolase into GAP so that
  both trioses enter lower glycolysis; in gluconeogenesis it supplies DHAP for the aldolase condensation. Tpi1 is one of the
  most abundant cytosolic proteins. tpi1 null mutants cannot grow on glucose as sole carbon source, accumulate DHAP and redirect
  glucose carbon from ethanol to glycerol. Small pools co-purify with mitochondria and plasma-membrane fractions.
