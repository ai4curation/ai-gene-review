gene_symbol: ERG26
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'ERG26 (YGL001C) encodes the sterol-4alpha-carboxylate 3-dehydrogenase (decarboxylating) (C-3 sterol
  dehydrogenase/C-4 decarboxylase, EC 1.1.1.170), an NAD(P)-dependent enzyme of the 3beta-HSD family. In each of
  the two C-4 demethylation rounds it oxidises the 3beta-hydroxyl of the 4alpha-carboxysterol produced by Erg25,
  which drives decarboxylation and yields a 3-keto sterol (3-dehydro-4-methylzymosterol, then zymosterone) for reduction
  by Erg27. Erg26 is a peripheral ER membrane protein that associates with Erg25, Erg27 and the scaffold Erg28 in
  the C-4 demethylation complex. ERG26 is essential: in heme-competent cells loss of Erg26 causes accumulation of
  carboxysterols and toxic oxygenated sterol intermediates that block growth even with exogenous sterol, and a temperature-sensitive
  erg26 allele also perturbs glycerolipid and phospholipid synthesis.'
