- term:
    id: GO:0102175
    label: 3-beta-hydroxysteroid dehydrogenase (NAD+)/C4-decarboxylase activity
  evidence_type: IMP
  original_reference_id: PMID:9811880
  qualifier: enables
  review:
    summary: IMP from Gachotte et al. 1998 to the NAD+-specific child term (GO:0102175, is_a GO:0000252). The mutant
      phenotype (carboxysterol accumulation) establishes the decarboxylating dehydrogenase step but not its cofactor;
      the full text only cites earlier NAD-depletion experiments from other systems, and UniProt/Rhea write the
      yeast reaction with NAD(P)+. The parent term is fully supported; the NAD+ specificity is not demonstrated
      for Erg26.
    action: KEEP_AS_NON_CORE
    reason: Function correct, but cofactor specificity (NAD+ vs NADP+) is not established by the cited evidence;
      the cofactor-neutral parent GO:0000252 is used as the core term.
    supported_by:
    - *id009
    - reference_id: PMID:9811880
      supporting_text: Several groups have demonstrated the accumulation of carboxylic acid sterol intermediates
        by incubating radiolabeled substrates with microsomes depleted in NAD cofactors
