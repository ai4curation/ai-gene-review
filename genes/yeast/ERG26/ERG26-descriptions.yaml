  text: Enables 3-beta-hydroxysteroid dehydrogenase (NAD+)/C4-decarboxylase activity.
    Involved in ergosterol biosynthetic process. Located in endoplasmic reticulum
    membrane. Part of catalytic complex. Is active in endoplasmic reticulum. Used
    to study cancer. Human ortholog(s) of this gene implicated in CHILD syndrome and
    CK syndrome. Orthologous to human NSDHL (NAD(P) dependent 3-beta-hydroxysteroid
    dehydrogenase NSDHL).
