gene_symbol: XYL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: XYL2 (YLR070C) encodes the NAD-dependent xylitol dehydrogenase (D-xylulose reductase, EC
  1.1.1.9) of Saccharomyces cerevisiae, a zinc-containing medium-chain alcohol dehydrogenase related to
  sorbitol dehydrogenase (SOR1/SOR2) and to the xylitol dehydrogenase of Scheffersomyces (Pichia) stipitis.
  Xyl2 interconverts xylitol and D-xylulose with NAD(H) as specific cofactor; it catalyses the second
  step of the endogenous oxidoreductive D-xylose pathway (GRE3 aldose reductase -> XYL2 -> XKS1 xylulokinase).
  Its activity is induced by xylose, but expression is low, contributing to the poor native growth of
  S. cerevisiae on xylose. It is presumed cytosolic.
