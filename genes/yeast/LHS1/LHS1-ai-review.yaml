proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: >-
    Binding to an unfolded or misfolded protein to prevent its aggregation without
    actively catalyzing refolding. The holdase maintains the client protein in a
    soluble, folding-competent state. This is mechanistically distinct from foldase
    activity (GO:0044183) and from carrier-holdase activity (GO:0140309).
  justification: Lhs1p's direct Kar2 nucleotide-exchange activity is nucleotide-dependent,
    but purified Lhs1p can suppress luciferase aggregation independently of nucleotide
    binding. Obsolete GO:0051082 captured binding only; GO:0044183 requires assisting
    folding, and GO:0140309 keeps a carrier-specific definition requiring escort
    to an acceptor molecule or location. See go-ontology#30552. The proposed parent
    is the molecular_function root because GO has no general chaperone-activity grouping
    term; GO:0044183 protein folding chaperone is itself a direct child of GO:0003674.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:19759005
    supporting_text: These results demonstrate that Lhs1p can function as a nucleotide-independent
      holdase in vitro.
  - reference_id: PMID:10409721
    supporting_text: Together, this suggests that Cer1p has a chaperoning activity
      required for proper refolding of denatured pro-CPY which is mediated by direct
      interaction with the unfolded polypeptide.
suggested_questions:
- question: Should GO annotations separate Lhs1p's Kar2 NEF role from its independent
    holdase/chaperone activity with additional experimental qualifiers?
suggested_experiments:
- description: Compare LHS1 nucleotide-binding mutants and holdase-defective mutants
    in matched ER translocation and client-folding assays to separate NEF and direct
    chaperone functions.
