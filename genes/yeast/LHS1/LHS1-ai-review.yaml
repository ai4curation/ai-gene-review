gene_symbol: LHS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: LHS1 encodes a Grp170/Hsp110-like Hsp70-family chaperone of the endoplasmic
  reticulum lumen. Lhs1p cooperates with Kar2/BiP during ER protein biogenesis as
  a Kar2 nucleotide exchange factor, functions as a client holdase, supports efficient
  translocation and folding of secretory and ER client proteins, and helps select
  a subset of misfolded membrane proteins for Hrd1-dependent ER-associated degradation.
