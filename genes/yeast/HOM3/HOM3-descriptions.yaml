descriptions:
- source: UniProt
  text: Phosphorylates aspartate, the first step in the biosynthesis of amino acids
    that derive from aspartate (the aspartate family of amino acids), including methioinine
    and threonine, the latter of which is a precursor to isoleucine.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P10869
  source_id: P10869
- source: Alliance_Imported
  text: Aspartate kinase (L-aspartate 4-P-transferase); cytoplasmic enzyme that catalyzes
    the first step in the common pathway for methionine and threonine biosynthesis;
    subject to allosteric feedback inhibition by threonine; expression regulated by
    Gcn4p and the general control of amino acid synthesis
  source_type: curated
  url: https://www.yeastgenome.org/locus/HOM3
  source_id: SGD:S000000854
- source: Alliance_Automated
  text: Enables aspartate kinase activity. Involved in L-homoserine biosynthetic process.
    Located in cytoplasm.
  source_type: automated
