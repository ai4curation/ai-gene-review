  review:
    summary: Hom3 binds FKBP12 (Fpr1, P20081) in two-hybrid and in vitro assays, and Fpr1 contributes to threonine
      feedback inhibition of aspartokinase. The interaction is genuine, but 'protein binding' says nothing about
      Hom3's function; Hom3 is the client, not an effector.
    action: REMOVE
    reason: Uninformative generic protein binding; the Fpr1 interaction is real and is best captured as regulation
      of Hom3, not as a Hom3 MF.
    supported_by:
