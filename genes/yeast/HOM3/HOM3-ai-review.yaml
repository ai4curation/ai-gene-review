gene_symbol: HOM3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: Aspartate kinase (aspartokinase, EC 2.7.2.4) of Saccharomyces cerevisiae. Hom3 phosphorylates L-aspartate
  with ATP to L-4-aspartyl phosphate, the first committed step of the aspartate pathway leading to homoserine and
  thence threonine, isoleucine and methionine. The enzyme is a homohexamer allosterically feedback-inhibited by
  threonine, which induces a compact inactive conformation; this inhibition is the main control point of carbon
  flow into the pathway, and the peptidyl-prolyl isomerase FKBP12 (Fpr1) binds Hom3 and contributes to feedback
  inhibition. Feedback-resistant HOM3 alleles cause threonine/homoserine overproduction. Hom3 is cytoplasmic.
