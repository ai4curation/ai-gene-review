  text: Enables glycine dehydrogenase (decarboxylating) activity. Involved in glycine
    decarboxylation via glycine cleavage system and one-carbon metabolic process.
    Located in mitochondrion. Human ortholog(s) of this gene implicated in glycine
    encephalopathy and glycine encephalopathy 1. Orthologous to human GLDC (glycine
    decarboxylase).
