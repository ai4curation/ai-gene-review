descriptions:
- source: UniProt
  text: The glycine cleavage system (glycine decarboxylase complex) catalyzes the
    degradation of glycine. The P protein binds the alpha- amino group of glycine
    through its pyridoxal phosphate cofactor; CO(2) is released and the remaining
    methylamine moiety is then transferred to the lipoamide cofactor of the H protein.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P49095
