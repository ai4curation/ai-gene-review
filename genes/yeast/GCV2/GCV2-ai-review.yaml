  label: Saccharomyces cerevisiae S288C
description: Glycine dehydrogenase (decarboxylating), the P-protein of the mitochondrial glycine cleavage system
  (glycine decarboxylase complex) of Saccharomyces cerevisiae (EC 1.4.4.2). Using pyridoxal 5'-phosphate, Gcv2 decarboxylates
  glycine and transfers the remaining aminomethyl group to the lipoyl arm of the H-protein Gcv3, which then passes
  it to the T-protein Gcv1; the reduced lipoamide is reoxidised by Lpd1. GCV2 (gsd2) is needed to convert glycine
  to serine and to use glycine as sole nitrogen source, and its expression is specifically induced by glycine.
