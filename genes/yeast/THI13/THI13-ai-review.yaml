gene_symbol: THI13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: THI13 (YDL244W) is one of four nearly identical subtelomeric THI5-family genes (THI5, THI11,
  THI12, THI13) of Saccharomyces cerevisiae encoding 4-amino-5-hydroxymethyl-2-methylpyrimidine phosphate
  (HMP-P) synthase, the enzyme that forms the pyrimidine moiety of thiamine (vitamin B1) in yeasts. Unlike
  the bacterial/plant radical-SAM ThiC route from aminoimidazole ribotide, the THI5-family enzyme builds
  HMP-P from its own active-site histidine and a pyridoxal 5'-phosphate (PLP) bound to an active-site
  lysine, in an iron-dependent single-turnover (suicide) reaction; it is a member of the NMT1/THI5 (SsuA-like
  periplasmic-binding-protein fold) family and is thought to be a homodimer. The four paralogs are functionally
  redundant for HMP formation, differ subtly in transcriptional regulation, and are repressed by thiamine
  as part of the THI regulon. Function for THI13 itself is inferred from the THI5 paralog and from combinatorial
  deletion genetics.
