suggested_questions:
- question: Do the four THI5-family paralogs (THI5/11/12/13) differ in expression condition (e.g. aerobic
    vs anaerobic, PLP availability) such that Thi13 makes a distinct physiological contribution, and is
    the Rsp5 interaction a route to turnover of the spent suicide enzyme?
suggested_experiments:
- description: Express THI13 as the sole THI5-family gene (triple deletion background) and measure HMP-P
    formation in vitro (single-turnover yield per subunit) and growth without thiamine.
