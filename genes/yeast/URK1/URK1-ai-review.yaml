id: P27515
gene_symbol: URK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: URK1 (YNR012W) encodes the uridine/cytidine kinase of S. cerevisiae (EC 2.7.1.48), a cytoplasmic enzyme
  of the Udk/UCK family that phosphorylates uridine to UMP and cytidine to CMP using ATP or GTP as phosphate donor.
  It provides the direct nucleoside route of pyrimidine salvage, in parallel with the Urh1 nucleoside hydrolase
  plus Fur1/Fcy1 base route; urk1 urh1 double mutants cannot use uridine and urk1 mutants are resistant to 5-fluorocytidine.
  The 501-residue protein has an N-terminal P-loop uridine kinase domain and a C-terminal uracil phosphoribosyltransferase-like
  domain, and it associates with Fur1 and with DAS2 in multiple interaction screens. Pathway databases also place
  it on a deoxycytidine salvage route.
