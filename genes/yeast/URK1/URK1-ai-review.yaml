suggested_questions:
- question: Does Urk1 phosphorylate deoxycytidine in vivo at a physiologically relevant rate (YeastCyc RXN-14093),
    and is a separate deoxycytidine kinase term warranted?
- question: Is the C-terminal UPRT-like domain of Urk1 catalytically active, and does it mediate the reproducible
    Urk1-Fur1 and Urk1-Das2 associations?
suggested_experiments:
- hypothesis: Urk1 has measurable deoxycytidine kinase activity
  description: Assay purified Urk1 with uridine, cytidine and 2'-deoxycytidine (ATP and GTP donors) and test 5-fluorodeoxycytidine
    sensitivity of urk1, urh1 and double mutants.
  experiment_type: enzymology / genetics
