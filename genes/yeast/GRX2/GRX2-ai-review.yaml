taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Grx2 (YDR513W) is the major dithiol (CPYC) glutaredoxin of Saccharomyces cerevisiae, accounting
  for most cellular heat-stable glutathione-dependent disulfide oxidoreductase activity. It reduces protein
  disulfides and glutathione-mixed disulfides using GSH (recycled by Glr1/NADPH), and can reduce GSSG
  with dihydrolipoamide, serving as a backup to glutathione reductase for cytosolic GSSG reduction. Two
  isoforms arise from alternative in-frame AUGs: a long isoform with a mitochondrial presequence imported
  into the matrix (with unprocessed form on the outer membrane) and a short cytosolic isoform. Grx2 also
  shows glutathione peroxidase-like and glutathione S-transferase activities, has ~15-fold higher specific
  activity and lower Km for GSH than its paralog Grx1, and grx2 mutants are sensitive to hydrogen peroxide.'
