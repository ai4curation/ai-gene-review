suggested_questions:
- question: What is the specific function of the mitochondrial Grx2 isoform, given overlap with the monothiol
    Grx5 and mitochondrial Trx3?
- question: Which electron donor supports Grx2-mediated GSSG reduction in the glr1 cytosol in vivo (thioredoxin
    reductase, lipoamide)?
suggested_experiments:
- hypothesis: The mitochondrial Grx2 isoform protects matrix proteins from glutathionylation under oxidative
    stress.
  description: Compare matrix roGFP2-based EGSH and protein glutathionylation in M35V (mitochondria-only)
    versus M1 mutant (cytosol-only) GRX2 alleles under H2O2.
