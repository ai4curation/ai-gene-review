descriptions:
- source: UniProt
  text: Component of the glutathione system which performs several activities such
    as glutathione-dependent oxidoreductase, glutathione peroxidase and glutathione
    S-transferase (GST) activity (PubMed:11875065, PubMed:12684511). The disulfide
    bond functions as an electron carrier in the glutathione-dependent synthesis of
    deoxyribonucleotides by the enzyme ribonucleotide reductase. In addition, it is
    also involved in reducing cytosolic protein- and non- protein-disulfides in a
    coupled system with glutathione reductase. Required for resistance to reactive
    oxygen species (ROS) by directly reducing hydroperoxides and for the detoxification
    of ROS-mediated damage. GRX2 is more active as an oxidoreductase than GRX1 (PubMed:18992757,
    PubMed:20417731, PubMed:9571241). Responsible for the S-glutathionylation of DHBP
    synthase (PubMed:21565288).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P17695
  source_id: P17695
- source: Alliance_Imported
  text: Cytoplasmic glutaredoxin; thioltransferase, glutathione-dependent disulfide
    oxidoreductase involved in maintaining redox state of target proteins, also exhibits
    glutathione peroxidase activity, expression induced in response to stress; GRX2
    has two in-frame start codons resulting in a shorter isoform that is retained
    in the cytosol and a longer form translocated to the mitochondrial matrix; GRX2
    has a paralog, GRX1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/GRX2
  source_id: SGD:S000002921
- source: Alliance_Automated
  text: Enables disulfide oxidoreductase activity; glutathione peroxidase activity;
    and glutathione transferase activity. Involved in cellular response to oxidative
    stress and glutathione metabolic process. Located in cytosol and mitochondrion.
    Orthologous to human GLRX2 (glutaredoxin 2).
