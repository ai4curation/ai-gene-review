taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: 'Glucose-6-phosphate isomerase (phosphoglucose isomerase; EC 5.3.1.9) of Saccharomyces cerevisiae, a homodimeric
  cytosolic enzyme that reversibly interconverts alpha-D-glucose 6-phosphate and beta-D-fructose 6-phosphate, the second step
  of glycolysis and the penultimate step of gluconeogenesis. PGI1 is a single-copy gene and the only activity linking glucose
  6-phosphate and fructose 6-phosphate pools: pgi1 null mutants cannot grow on glucose (glucose 6-phosphate is diverted only
  into the pentose phosphate pathway) or on fructose alone, and need small amounts of glucose to grow and sporulate on fructose
  or acetate. The enzyme also accelerates anomerization of glucose 6-phosphate, fructose 6-phosphate and mannose 6-phosphate,
  and shows anomeric specificity consistent with channelling of beta-D-fructose 6-phosphate to phosphofructokinase.'
