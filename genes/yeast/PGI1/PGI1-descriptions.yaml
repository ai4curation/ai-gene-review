taxon_id: NCBITaxon:559292
status: COMPLETE
descriptions:
- source: UniProt
  text: Isomerase that catalyzes the conversion of alpha-D-glucose-6- phosphate to
    beta-D-fructose-6-phosphate, the second step in glycolysis, and the reverse reaction
    in gluconeogenesis, within the cytoplasm (PubMed:1730590, PubMed:6572382). Also
    shows C2-epimerase activity, interconverting D-glucose-6-phosphate (G6P) and D-mannose-6-
    phosphate (M6P) (By similarity). Also displays anomerase activity, interconverting
    alpha and beta-anomeric forms of G6P, D-fructose-6- phosphate and M6P (PubMed:1730590,
    PubMed:4570473, PubMed:6572382).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P12709
  source_id: P12709
