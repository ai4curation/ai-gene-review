- source: Alliance_Automated
  text: Enables glucose-6-phosphate 1-epimerase activity and glucose-6-phosphate isomerase
    activity. Involved in canonical glycolysis; gluconeogenesis; and glucose 6-phosphate
    metabolic process. Located in mitochondrion. Human ortholog(s) of this gene implicated
    in arthritis; congenital hemolytic anemia (multiple); intellectual disability;
    and neuromuscular disease. Orthologous to human GPI (glucose-6-phosphate isomerase).
