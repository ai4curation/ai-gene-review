gene_symbol: PGI1
organism: yeast
uniprot_id: P12709
taxon_id: NCBITaxon:559292
status: STUB
descriptions:
- source: UniProt
  text: Isomerase that catalyzes the conversion of alpha-D-glucose-6- phosphate to
    beta-D-fructose-6-phosphate, the second step in glycolysis, and the reverse reaction
    in gluconeogenesis, within the cytoplasm (PubMed:1730590, PubMed:6572382). Also
    shows C2-epimerase activity, interconverting D-glucose-6-phosphate (G6P) and D-mannose-6-
    phosphate (M6P) (By similarity). Also displays anomerase activity, interconverting
    alpha and beta-anomeric forms of G6P, D-fructose-6- phosphate and M6P (PubMed:1730590,
    PubMed:4570473, PubMed:6572382).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P12709
  source_id: P12709
- source: Alliance_Imported
  text: Glycolytic enzyme phosphoglucose isomerase; catalyzes the interconversion
    of glucose-6-phosphate and fructose-6-phosphate; required for cell cycle progression
    and completion of the gluconeogenic events of sporulation
  source_type: curated
  url: https://www.yeastgenome.org/locus/PGI1
  source_id: SGD:S000000400
- source: Alliance_Automated
  text: Enables glucose-6-phosphate 1-epimerase activity and glucose-6-phosphate isomerase
    activity. Involved in canonical glycolysis; gluconeogenesis; and glucose 6-phosphate
    metabolic process. Located in mitochondrion. Human ortholog(s) of this gene implicated
    in arthritis; congenital hemolytic anemia (multiple); intellectual disability;
    and neuromuscular disease. Orthologous to human GPI (glucose-6-phosphate isomerase).
  source_type: automated
  url: https://www.yeastgenome.org/locus/PGI1
  source_id: SGD:S000000400
