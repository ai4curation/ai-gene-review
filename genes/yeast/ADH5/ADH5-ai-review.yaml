id: P38113
gene_symbol: ADH5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: ADH5 encodes alcohol dehydrogenase V, a cytoplasmic medium-chain zinc alcohol dehydrogenase
  that arose with ADH1 from the whole-genome duplication. It retains the ADH catalytic and zinc-binding
  residues and can reduce acetaldehyde to ethanol, but it is expressed at low levels; strains in which
  it is the only ADH grow poorly on glucose and cannot use ethanol, so its contribution to bulk ethanol
  metabolism is minor. Genetic analysis shows it can, redundantly with ADH1-4 and SFA1, reduce Ehrlich-pathway
  aldehydes to fusel alcohols.
