descriptions:
- source: UniProt
  text: Can reduces acetaldehyde to ethanol (Probable). The role of ADH5 in yeast
    metabolism is not yet known, but ADH5 is not responsible for the production of
    ethanol during growth on glucose nor responsible for the oxidation of ethanol
    to acetaldehyde (PubMed:22094012).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P38113
  source_id: P38113
- source: Alliance_Imported
  text: Alcohol dehydrogenase isoenzyme V; involved in ethanol production; ADH5 has
    a paralog, ADH1, that arose from the whole genome duplication
  source_type: curated
  url: https://www.yeastgenome.org/locus/ADH5
  source_id: SGD:S000000349
- source: Alliance_Automated
  text: Predicted to enable alcohol dehydrogenase (NAD+) activity. Involved in L-leucine
    catabolic process and pyruvate fermentation to ethanol. Located in cytoplasm and
    nucleus.
  source_type: automated
  url: https://www.yeastgenome.org/locus/ADH5
  source_id: SGD:S000000349
