proposed_new_terms: []
suggested_questions:
- question: >-
    Does Swe1 phosphorylate Orm2 directly, or is the sphingolipid-biosynthesis phenotype of swe1Δ a consequence
    of altered Cdc28 activity (the cdc28-Y19F allele phenocopies swe1Δ)? An in vitro kinase assay with
    purified Swe1 and Orm2, and Orm2 phosphosite mapping in swe1Δ versus cdc28-Y19F cells, would settle
    whether GO:0090154 reflects a distinct Swe1 activity.
  experts:
  - Kohlwein SD
  - Dunn T
- question: >-
    Which of Swe1's serine/threonine activities, if any, are physiological? EC 2.7.11.1 and the Rhea serine
    reaction are carried on the record, yet the only characterised substrate residue is Cdc28 Tyr19; is
    the Ser/Thr activity limited to autophosphorylation, and should the entry carry EC 2.7.10.2 as S.
    pombe wee1 does?
  experts:
  - Kellogg DR
  - Lew DJ
- question: >-
    What is the mechanism behind the Tyr19-independent requirement for Swe1 in resuming the cell cycle
    after ribosome-biogenesis arrest (PMID:15107621), and does it justify 're-entry into mitotic cell
    cycle' as a distinct process annotation?
  experts:
  - Agostoni Carbone ML
suggested_experiments:
- hypothesis: >-
    Swe1 phosphorylates Orm2 directly on sites that relieve Orm repression of serine palmitoyltransferase.
  description: >-
    Purify recombinant Swe1 and kinase-dead Swe1-K473R, perform in vitro kinase assays on Orm2, map sites
    by mass spectrometry, then test non-phosphorylatable Orm2 alleles for myriocin sensitivity in wild-type,
    swe1Δ and cdc28-Y19F backgrounds to separate direct Orm2 phosphorylation from CDK-mediated effects.
  experiment_type: in vitro kinase assay and phosphosite mutagenesis
- hypothesis: >-
    Swe1's Ser/Thr activity contributes to physiological substrates beyond Cdc28 Tyr19 (or is restricted
    to autophosphorylation).
  description: >-
    Use an analogue-sensitive SWE1 allele with thiophosphate labelling in vivo to capture direct Swe1
    substrates, and classify the phosphosites by residue; compare with phosphoproteomes of swe1Δ versus
    cdc28-Y19F cells to identify Swe1-dependent, CDK-independent Ser/Thr sites.
  experiment_type: chemical-genetic substrate labelling and phosphoproteomics
