- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:8253069
  qualifier: involved_in
  review:
    summary: >-
      Booher et al. (1993) cloned SWE1 as the S. cerevisiae wee1 homologue and showed that Swe1 immunoprecipitates
      tyrosine-phosphorylate and inactivate Clb2-Cdc28 but not Cln2-Cdc28, and that SWE1 overexpression
      arrests cells in G2 with short spindles. Swe1 is therefore a negative regulator of the G2/M transition,
      not a positive participant in it.
    action: MODIFY
    reason: >-
      The direction of Swe1's action is what matters biologically: it inhibits the M-cyclin/CDK complex
      whose activation constitutes the G2/M transition. GO:0000086 is defined as the transition itself
      and does not capture that Swe1 opposes it; the child term GO:0010972 (negative regulation of G2/M
      transition of mitotic cell cycle), already carried by SWE1 via IBA, is the accurate and more informative
      term for exactly this experiment. The essence of the annotation is sound, so MODIFY rather than
      REMOVE.
    proposed_replacement_terms:
    - &id001
      id: GO:0010972
      label: negative regulation of G2/M transition of mitotic cell cycle
    supported_by:
    - reference_id: PMID:8253069
      supporting_text: >-
        Swe1 immunoprecipitates were capable of tyrosine phosphorylating and inactivating p34CDC28 complexed
        with Clb2, a G2-type cyclin, but not p34CDC28 complexed with Cln2, a G1-type cyclin, consistent
        with the inability of Swe1 overexpression to inhibit the G1/S transition.
      reference_section_type: ABSTRACT
    - reference_id: PMID:8253069
      supporting_text: >-
        SWE1 overexpression arrests cells in G2 with short spindles whereas deletion of SWE1 did not alter
        the cell cycle but did eliminate the G2 delay observed in mih1- mutants.
      reference_section_type: ABSTRACT
- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:8253069
  qualifier: involved_in
  review:
    summary: >-
      Mutant-phenotype evidence from the same paper: swe1 deletion does not alter the unperturbed cell
      cycle but eliminates the G2 delay of mih1 mutants, and SWE1 overexpression arrests cells in G2.
      Both phenotypes show Swe1 acting as a brake on mitotic entry that is opposed by the Mih1 (Cdc25)
      phosphatase.
    action: MODIFY
    reason: >-
      As for the IDA row, the more specific negative-regulation term GO:0010972 describes the biology
      (Swe1 delays G2/M) better than the parent transition term; the phenotypes are epistatic with MIH1
      and in the direction of inhibition.
    proposed_replacement_terms:
    - *id001
    supported_by:
    - reference_id: PMID:8253069
      supporting_text: >-
        SWE1 overexpression arrests cells in G2 with short spindles whereas deletion of SWE1 did not alter
        the cell cycle but did eliminate the G2 delay observed in mih1- mutants.
      reference_section_type: ABSTRACT
- term:
    id: GO:0000320
    label: re-entry into mitotic cell cycle
  evidence_type: IGI
  original_reference_id: PMID:15107621
  qualifier: involved_in
  supporting_entities:
  - SGD:S000001240
  review:
    summary: >-
      Saracino et al. (2004) found that additional deletion of SWE1 in sda1-1, rix1-1 or tif6Δ ribosome-biogenesis
      mutants markedly delays budding and DNA replication when cells are released from the conditional
      G1 arrest, and that this delay is independent of Cdc28 Tyr19 phosphorylation. Swe1 thus has a Tyr19-independent
      role in resuming the cycle after such a G1 arrest.
    action: KEEP_AS_NON_CORE
    reason: >-
      The genetic interaction is documented by the SGD curator from the primary paper (abstract-only in
      the cache) and describes a genuine phenotype, but it is peripheral: the mechanism is unknown, it
      is explicitly independent of Swe1's characterised Cdc28-Tyr19 kinase output, and the 'non-dividing
      state' is a conditional ts-mutant G1 arrest rather than quiescence, which stretches the term definition.
      Retain as a non-core annotation; the core function remains G2/M inhibition.
    supported_by: &id002
    - reference_id: PMID:15107621
      supporting_text: >-
        Our data suggest that Swe1 is required for timely entry into cell cycle after a G1 arrest caused
        by impairment in pre-60S biogenesis and in protein synthesis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:15107621
      supporting_text: However, such a prolonged delay is independent of the Tyr19 phosphorylation in
        Cdc28.
      reference_section_type: ABSTRACT
