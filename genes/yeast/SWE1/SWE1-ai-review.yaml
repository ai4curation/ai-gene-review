- id: PMID:8253069
  title: >-
    Properties of Saccharomyces cerevisiae wee1 and its differential regulation of p34CDC28 in response
    to G1 and G2 cyclins.
  findings:
  - statement: >-
      Swe1 is the S. cerevisiae Wee1 homologue; Swe1 immunoprecipitates tyrosine-phosphorylate and inactivate
      Clb2-Cdc28 but not Cln2-Cdc28, and SWE1 overexpression arrests cells in G2.
    supporting_text: >-
      Swe1 immunoprecipitates were capable of tyrosine phosphorylating and inactivating p34CDC28 complexed
      with Clb2, a G2-type cyclin, but not p34CDC28 complexed with Cln2, a G1-type cyclin, consistent
      with the inability of Swe1 overexpression to inhibit the G1/S transition.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Founding paper for SWE1; title/abstract verified against cache. Directly supports protein tyrosine
      kinase activity and negative regulation of G2/M.
- id: PMID:8887667
  title: >-
    Spindle pole body separation in Saccharomyces cerevisiae requires dephosphorylation of the tyrosine
    19 residue of Cdc28.
  findings:
  - statement: >-
      SWE1 overexpression, like the phosphomimetic cdc28-E19 allele, prevents spindle pole body separation,
      implying that Tyr19 dephosphorylation promotes SPB separation.
    supporting_text: >-
      We also find that the overexpression of SWE1, the budding-yeast homolog of wee1, also leads to a
      failure to segregate SPBs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; overexpression phenotype downstream of Cdc28 inhibition.
- id: PMID:8930890
  title: Cdc28 tyrosine phosphorylation and the morphogenesis checkpoint in budding yeast.
  findings:
  - statement: >-
      The morphogenesis checkpoint delay of nuclear division in unbudded cells requires SWE1 and is controlled
      by SWE1/MIH1 dosage acting on Cdc28 Tyr19.
    supporting_text: >-
      We show that the ability of this checkpoint to delay nuclear division requires the SWE1 gene, encoding
      a protein kinase that inhibits the master cell cycle regulatory kinase Cdc28.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defines Swe1 as the morphogenesis checkpoint effector; abstract-only cache but abstract explicitly
      states the SWE1 requirement.
- id: PMID:9744879
  title: A morphogenesis checkpoint monitors the actin cytoskeleton in yeast.
  findings:
  - statement: >-
      Actin cytoskeleton perturbation (mutants or latrunculin-A) triggers a Swe1p-dependent, Cdc28p tyrosine-phosphorylation-mediated
      delay of nuclear division.
    supporting_text: >-
      Thus, myo2-66 and tpm1Δ mutants experienced a cell cycle delay resulting from Cdc28p tyrosine phosphorylation
      (reversible by Swe1p elimination or Mih1p overexpression).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the checkpoint monitors actin organisation.
- id: file:yeast/SWE1/SWE1-deep-research-falcon.md
  title: Falcon deep research for SWE1
  findings:
  - statement: >-
      Independent literature synthesis identifying Swe1 as the morphogenesis-checkpoint effector acting
      through Cdc28 Tyr19 phosphorylation.
    supporting_text: >-
      SWE1 is required for the normal delay in nuclear division in cells unable to form a bud, whereas
      budded cells are much less dependent on Cdc28 Tyr19 phosphorylation for ordinary cell-cycle timing.
