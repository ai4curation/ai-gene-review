- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: HDA
  original_reference_id: PMID:16319894
  qualifier: enables
  review:
    summary: >-
      Proteome-chip study in which most yeast kinases, Swe1 among them, were assayed for in vitro phosphorylation
      of ~4,400 immobilised proteins. Confirms Swe1 is an active protein kinase at the generic level.
    action: ACCEPT
    reason: >-
      Accurate parent-level molecular function, corroborated by the direct demonstration that Swe1 phosphorylates
      Cdc28 (PMID:8253069). The more specific protein tyrosine kinase activity term is the informative
      one, but the parent is not wrong and high-throughput evidence at this level is appropriate.
    supported_by:
    - reference_id: PMID:16319894
      supporting_text: >-
        Here we describe, with the use of proteome chip technology, the in vitro substrates recognized
        by most yeast protein kinases: we identified over 4,000 phosphorylation events involving 1,325
        different proteins.
      reference_section_type: ABSTRACT
- term:
