- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:2.7.11.1
  review:
    summary: >-
      EC-number mapping (UniProt assigns EC 2.7.11.1 to SWE1). Wee1-family kinases are dual-specificity
      enzymes and UniProt states that Swe1 can act on serines as well as tyrosines, so serine/threonine
      activity is credible; however the physiologically defining reaction is phosphorylation of Cdc28
      Tyr19, a tyrosine.
    action: KEEP_AS_NON_CORE
    reason: >-
      Not wrong (dual-specificity family; UniProt 'Can act both on serines and on tyrosines'), but no
      physiological serine/threonine substrate of Swe1 is established and the core catalytic output is
      tyrosine phosphorylation of Cdc28. Kept as a non-core activity rather than promoted to core; the
      S. pombe wee1 review treats its Ser/Thr rows the same way relative to the Tyr15 kinase activity.
    supported_by:
    - reference_id: PMID:8253069
      supporting_text: >-
        Swe1 immunoprecipitates were capable of tyrosine phosphorylating and inactivating p34CDC28 complexed
        with Clb2, a G2-type cyclin, but not p34CDC28 complexed with Cln2, a G1-type cyclin, consistent
        with the inability of Swe1 overexpression to inhibit the G1/S transition.
      reference_section_type: ABSTRACT
