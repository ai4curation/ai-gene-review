    label: positive regulation of sphingolipid biosynthetic process
  evidence_type: IGI
  original_reference_id: PMID:26634277
  qualifier: involved_in
  supporting_entities:
  - SGD:S000001609
  - SGD:S000004710
  review:
    summary: >-
      Chauhan et al. (2016) found that swe1Δ (and cdc28-Y19F) cells are hypersensitive to the SPT inhibitor
      myriocin because of reduced long-chain-base synthesis, that phytosphingosine or deletion of the
      SPT repressors ORM1/ORM2 rescues them, and that the effect is independent of the Ypk1 pathway; the
      authors propose that Swe1 derepresses SPT, presumably by phosphorylating Orm2. This row records
      the synergistic myriocin sensitivity of ypk1Δ swe1Δ and ypk2Δ swe1Δ double mutants (IGI partners
      YPK1 and YPK2).
    action: KEEP_AS_NON_CORE
    reason: >-
      The genetic evidence that Swe1 positively influences sphingolipid synthesis is solid and the SGD
      curation faithfully records it, but the mechanism is unresolved: no direct Swe1 phosphorylation
      of Orm2 is shown ('presumably'), and the cdc28-Y19F phenocopy suggests the effect may run through
      Cdc28 inhibition rather than a separate Swe1 activity. Retained as a non-core annotation; the core
      function of Swe1 remains CDK inhibition.
    supported_by:
    - reference_id: PMID:26634277
      supporting_text: >-
        Importantly, the double deletion mutants ypk1 swe1 and ypk2 swe1 were more sensitive to myriocin
        than the single deletion mutants, indicating synergistic effects
      reference_section_type: RESULTS
