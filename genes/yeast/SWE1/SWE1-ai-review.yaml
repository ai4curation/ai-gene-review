id: P32944
gene_symbol: SWE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae
description: >-
  Swe1 is the Saccharomyces cerevisiae orthologue of Wee1, a nuclear and bud-neck-localised protein kinase
  that phosphorylates the cyclin-dependent kinase Cdc28 (Cdk1) on the inhibitory residue Tyr19. It acts
  selectively on Cdc28 bound to mitotic B-type cyclins (Clb2 in particular), not on Cln-Cdc28, and thereby
  lowers M-phase CDK activity and delays entry into mitosis; the Cdc25-family phosphatase Mih1 reverses
  the modification. Swe1 is dispensable for an unperturbed cell cycle but is the effector of the morphogenesis
  checkpoint: when bud emergence, actin organisation or septin assembly is defective, Swe1 is stabilised
  and holds Clb-Cdc28 inactive so that nuclear division waits for a bud, prolonging polarised growth and
  giving elongated buds. Swe1 accumulates in the nucleus in late G1/S and a subpopulation is then recruited
  to the daughter side of the septin collar by the Hsl1 kinase and its adaptor Hsl7; at the neck it is
  progressively phosphorylated by Cla4, Clb2-Cdc28 and the Polo kinase Cdc5 and ubiquitylated (SCF-Met30
  and Dma1/2 have been implicated) for proteasomal destruction, which lifts CDK inhibition and triggers
  mitosis. Clb2-Cdc28 phosphorylation of Swe1 first stabilises a Swe1-Clb2-Cdc28 complex that keeps the
  CDK tyrosine-phosphorylated, a feedback loop that sharpens the G2/M switch. The same catalytic output
  is reused in other contexts: Swe1 maintains the meiotic recombination (pachytene) checkpoint arrest
  by phosphorylating Cdc28, contributes to the response to interrupted DNA replication, modestly influences
  cell size at division, and has been linked genetically to sphingolipid biosynthesis. Swe1 has a C-terminal
  Ser/Thr-family kinase domain (residues 444-794) and a long, heavily phosphorylated, largely disordered
  N-terminal regulatory region.
