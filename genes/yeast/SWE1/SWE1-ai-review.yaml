    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11283351
  qualifier: enables
  supporting_entities:
  - UniProtKB:P38274
  review:
    summary: >-
      Genome-wide two-hybrid screen (Ito et al. 2001) recording a Swe1-Hsl7 interaction. Hsl7 is the adaptor
      that, with Hsl1, recruits Swe1 to the daughter side of the bud neck where it is hyperphosphorylated
      and degraded (PMID:10805747); the interaction is biologically real but the term records only 'binding'.
    action: REMOVE
    reason: >-
      Bare GO:0005515 conveys no information about what Swe1 does; per repository policy such rows are
      resolved to an informative molecular function where the paper supports one and otherwise removed.
      The Swe1-Hsl7 interaction is not in doubt and is recorded in the notes and references, but it describes
      regulation OF Swe1 (recruitment, phosphorylation or dephosphorylation of the kinase) rather than
      an activity Swe1 itself performs, so no more specific MF term is warranted. Removal does not assert
      that the interaction is false.
    supported_by:
    - reference_id: PMID:11283351
      supporting_text: >-
        Here we have completed the comprehensive analysis using this system to identify 4,549 two-hybrid
        interactions among 3,278 proteins.
      reference_section_type: ABSTRACT
