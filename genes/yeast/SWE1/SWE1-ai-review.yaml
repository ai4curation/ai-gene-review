  qualifier: involved_in
  review:
    summary: >-
      Genome-wide cell-size screen of the deletion collection (Jorgensen et al. 2002) in which swe1Δ was
      scored as size-abnormal. Independent focused work (Harvey & Kellogg 2003, PMID:12593792, not cached)
      showed that swe1Δ cells are smaller and that Swe1 is required for normal cell-size control at mitotic
      entry, paralleling the classic 'wee' phenotype in S. pombe, although the effect is much weaker in
      budding yeast where Start is the main size-control point.
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine but modest contribution: Swe1 delays mitotic entry while the bud grows, which sets cell
      size at division. The evidence here is a high-throughput screen whose abstract does not single out
      SWE1, so it is retained as a non-core annotation rather than elevated to core.
    supported_by:
    - reference_id: PMID:12089449
      supporting_text: >-
        We determined cell size distributions for the complete set of approximately 6000 Saccharomyces
        cerevisiae gene deletion strains and identified approximately 500 abnormally small (whi) or large
        (lge) mutants.
      reference_section_type: ABSTRACT
- term:
    id: GO:0010697
    label: negative regulation of mitotic spindle pole body separation
  evidence_type: IGI
  original_reference_id: PMID:8887667
  qualifier: involved_in
  supporting_entities:
  - SGD:S000000364
  review:
    summary: >-
      Lim et al. (1996) showed that cdc28-E19 (phosphomimetic Tyr19) cells and cells overexpressing SWE1
      duplicate but fail to separate spindle pole bodies, and proposed that Tyr19 dephosphorylation promotes
      SPB separation. The effect of Swe1 is via its inhibitory phosphorylation of Clb-Cdc28, whose activity
      drives SPB separation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The observation is real but the term is an over-specific reading of it: the SPB-separation block
      is one downstream consequence of Cdc28 Tyr19 phosphorylation (already captured by GO:0010972), was
      seen only under SWE1 overexpression, and Swe1 does not regulate SPB separation in the unperturbed
      cycle (swe1Δ has no cell-cycle phenotype, PMID:8253069). Annotating every CDK-dependent event that
      Swe1 can block as a separate 'negative regulation of X' would multiply terms without adding biology.
    supported_by: &id003
    - reference_id: PMID:8887667
      supporting_text: >-
        We also find that the overexpression of SWE1, the budding-yeast homolog of wee1, also leads to
        a failure to segregate SPBs.
      reference_section_type: ABSTRACT
    - reference_id: PMID:8887667
      supporting_text: >-
        On the basis of these results, we propose that one of the roles of Tyr-19 dephosphorylation is
        to promote SPB separation.
      reference_section_type: ABSTRACT
