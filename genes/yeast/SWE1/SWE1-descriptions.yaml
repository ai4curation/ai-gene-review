descriptions:
- source: UniProt
  text: Protein kinase that acts as a negative regulator of entry into mitosis (G2
    to M transition) by phosphorylating and inhibiting the mitosis-promoting cyclin
    B-bound CDC28 at 'Tyr-19'. SWE1-mediated inhibition of CDC28 acts in a cell size
    or morphogenesis checkpoint to delay mitosis in response to defects in growth,
    actin organization or bud formation. Inhibits the activity of B-type cyclins in
    replication initiation strongly for CLB2, moderately for CLB3 and CLB4, and there
    is no apparent inhibition for CLB5 and CLB6, correlating with the normal expression
    timing of those cyclins. Hyperphosphorylation and degradation of SWE1 when all
    checkpoint requirement are met releases CLB2-CDC28 from inhibition and allows
    for progression through the cell cycle. SWE1-dependent CDC28 phosphorylation is
    also required for pachytene arrest upon activation of the recombination checkpoint
    during meiosis. Also involved in the regulation of nitrogen starvation- and short
    chain alcohol-induced filamentous growth, or filamentous differentiation in response
    to slowed DNA synthesis. Can act both on serines and on tyrosines.
