    supporting_text: Reaction=pyruvate + H(+) = acetaldehyde + CO2; Xref=Rhea:RHEA:45484,
  - reference_id: PMID:22904058
    supporting_text: only Pdc1, Pdc5, and Pdc6 catalyzed the decarboxylation of the linear-chain 2-oxo
      acids pyruvate, 2-oxo-butanoate, and 2-oxo-pentanoate in cell extracts
  - reference_id: PMID:2665820
    supporting_text: The activity of the cytosolic enzyme pyruvate decarboxylase in S. cerevisiae
  - reference_id: PMID:2185016
    supporting_text: Deletion mutants lacking both PDC1 and PDC5 did not show any detectable pyruvate
      decarboxylase activity in vitro and were unable to ferment glucose.
- description: Ehrlich-pathway decarboxylation of branched-chain 2-oxo acids from valine and isoleucine
    transamination (EC 4.1.1.72), giving isobutanal and 2-methylbutanal, the precursors of the fusel alcohols
    isobutanol and active amyl alcohol. PDC5p does this redundantly with the other Pdc isozymes and Aro10.
  molecular_function:
    id: GO:0047433
    label: branched-chain-2-oxoacid decarboxylase activity
