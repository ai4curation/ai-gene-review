core_functions:
- description: Thiamine diphosphate/Mg2+-dependent decarboxylation of pyruvate to acetaldehyde in the
    cytosol. Pdc5p is redundant with Pdc1p for alcoholic fermentation and becomes the main isozyme when
    PDC1 is absent or thiamine is limiting.
  molecular_function:
    id: GO:0004737
    label: pyruvate decarboxylase activity
  directly_involved_in:
