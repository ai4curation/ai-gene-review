id: P16467
gene_symbol: PDC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: PDC5 (YLR134W) encodes pyruvate decarboxylase isozyme 2 (EC 4.1.1.1), a thiamine diphosphate-
  and Mg2+-dependent enzyme 88% identical to Pdc1p. It decarboxylates pyruvate to acetaldehyde in the
  cytosol. PDC5 is weakly expressed in wild-type glucose-grown cells but is strongly induced when PDC1
  is deleted (autoregulation), under thiamine limitation and under nitrogen limitation. Pdc5p alone can
  sustain fermentation, and pdc1 pdc5 double mutants lack Pdc activity and cannot ferment glucose. Pdc5p
  also decarboxylates branched-chain and sulfur-containing 2-oxo acids. Unlike Pdc1p and Pdc6p, it also
  decarboxylates phenylpyruvate, so it contributes, redundantly with Aro10p, to Ehrlich-pathway fusel
  alcohol production. Like Pdc1p, it can form acyloins by carboligation. It is cytosolic, with reported
  nuclear enrichment.
