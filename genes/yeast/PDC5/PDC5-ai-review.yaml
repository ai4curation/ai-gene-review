suggested_questions:
- question: Does Pdc5p contribute meaningfully to 2-phenylethanol production in vivo when Aro10 is present,
    for example under thiamine limitation when PDC5 is induced?
suggested_experiments:
- description: Measure 4-hydroxyphenylpyruvate and indole-3-pyruvate decarboxylation by purified Pdc5p,
    given its demonstrated phenylpyruvate activity.
