id: P08019
gene_symbol: SGA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:559292
  label: Saccharomyces cerevisiae S288C
description: SGA1 (YIL099W) encodes the intracellular sporulation-specific glucoamylase of Saccharomyces
  cerevisiae (glucan 1,4-alpha-glucosidase, EC 3.2.1.3), a glycosylated GH15-family exo-hydrolase that
  releases glucose from the non-reducing ends of alpha-1,4-glucans. The partially purified enzyme hydrolyses
  glycogen, starch, maltotriose and maltose with an acidic pH optimum (5.5), and it fractionates with
  vacuolar hydrolases. SGA1 is expressed mainly during sporulation, when Sga1 is found in the vacuole
  and at prospore membranes, and it degrades glycogen that has been delivered to the vacuole by autophagy
  (glycophagy), a pool distinct from the cytosolic glycogen degraded by Gph1 and Gdb1. sga1 loss protects
  glycogen stores only late in stationary phase.
