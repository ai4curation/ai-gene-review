suggested_questions:
- question: Does Sga1 also hydrolyse alpha-1,6 branch points in vivo (as many glucoamylases do slowly),
    or does vacuolar glycogen degradation need another debranching activity?
- question: How is Sga1 targeted to the vacuole (it is glycosylated but annotated as intracellular), and
    what is its role at the prospore membrane?
