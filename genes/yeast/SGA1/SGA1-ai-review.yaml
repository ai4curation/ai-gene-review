  review:
    summary: YeastPathways places the whole glycogen catabolism pathway, including the glucoamylase step,
      in the cytosol. Sga1 is a glycosylated vacuolar hydrolase with an acidic pH optimum, recovered with
      vacuolar marker enzymes and seen in the vacuole by imaging; it degrades the vacuolar (autophagy-delivered)
      glycogen pool, not cytosolic glycogen.
