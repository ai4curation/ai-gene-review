  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaX is the tau subunit of the Bacillus subtilis DNA clamp loader. Three tau subunits assemble
  with one HolA/delta and one HolB/delta-prime subunit to load the beta sliding clamp onto primed DNA
  using ATP. Tau also connects replisome components. It contributes to DNA synthesis through clamp loading
  and replisome organization rather than catalyzing nucleotide incorporation.
