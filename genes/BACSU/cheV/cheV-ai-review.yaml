  review:
    summary: The CheW-like domain of CheV supports receptor-CheA coupling, partly overlapping the adaptor role of CheW (PMID:8169224; PMID:11553614).
    action: NEW
    reason: The CheW-like domain couples receptors to CheA and can compensate for loss of CheW.
      The phosphorylation-dependent receiver domain contributes a distinct activity; no generic
      protein binding is proposed. The primary studies explicitly place this coupling activity
      in the receptor-CheA complex, supporting GO:0030159 physical support for assembly of a
      multiprotein receptor signaling complex rather than only generic signaling adaptor activity.
      No adaptor MF existed among the machine-seeded annotations.
    supported_by:
    - reference_id: PMID:8169224
      supporting_text: Thus, CheV and CheW appear in part to be functionally redundant.
    - reference_id: PMID:11553614
      supporting_text: 'CheV is

        phosphorylated in vitro on a conserved aspartate in the presence of

        phosphorylated CheA (CheA-P).'
