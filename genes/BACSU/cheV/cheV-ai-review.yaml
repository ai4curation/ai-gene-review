  label: Bacillus subtilis subsp. subtilis str. 168
description: CheV is a two-domain chemotaxis coupling and adaptation protein in Bacillus subtilis.
  Its N-terminal CheW-like domain couples receptors to the CheA kinase, partly overlapping the
  function of CheW. Its C-terminal receiver domain accepts phosphate from CheA on a conserved
  aspartate, and this phosphorylation is required for normal adaptation to asparagine even when
  basal receptor-kinase coupling remains functional.
