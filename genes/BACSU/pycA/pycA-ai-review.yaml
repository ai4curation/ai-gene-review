  - SGD:S000000422
  - SGD:S000003030
  review:
    summary: Gluconeogenesis is a plausible but secondary role of bacterial pyruvate carboxylase.
    action: KEEP_AS_NON_CORE
    reason: Pyruvate carboxylase supplies oxaloacetate that PEP carboxykinase can convert to PEP, so a
      gluconeogenic contribution from C3 substrates is plausible and is physiological for liver and yeast
      PCs. For B. subtilis the demonstrated or expected primary role is anaplerotic oxaloacetate supply,
      and no gluconeogenic flux through this enzyme has been measured, so the row is kept as non-core.
    supported_by:
    - reference_id: file:BACSU/pycA/pycA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Fulfills an anaplerotic function in B.subtilis as it is necessary for growth on
        glucose, but is not required for sporulation (PubMed:4146915).
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN001821692
        source_status: SUPPORTS_TRANSFER
        comment: Seeded by liver and yeast pyruvate carboxylases; the process transfers to bacterial descendants
          as a secondary role.
