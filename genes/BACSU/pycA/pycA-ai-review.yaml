  label: Bacillus subtilis subsp. subtilis str. 168
description: PycA is the single-chain, biotin-dependent pyruvate carboxylase of Bacillus subtilis. Each
  chain carries biotin carboxylase, carboxyltransferase and biotin carboxyl carrier domains, so the enzyme
  first carboxylates its covalently bound biotin with bicarbonate and ATP and then transfers the carboxyl
  group to pyruvate to form oxaloacetate. PycA provides the anaplerotic supply of oxaloacetate needed
  for growth on glucose. It is allosterically activated by acetyl-CoA and is further stimulated by direct
  binding of the apo form of the c-di-AMP receptor DarB under potassium limitation.
