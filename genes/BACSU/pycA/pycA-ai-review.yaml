- term:
    id: GO:0006107
    label: oxaloacetate metabolic process
  evidence_type: IC
  original_reference_id: PMID:35130724
  qualifier: involved_in
  review:
    summary: PycA forms oxaloacetate to replenish the citric acid cycle (anaplerosis).
    action: NEW
    reason: PycA directly catalyses oxaloacetate formation from pyruvate, and the B. subtilis evidence
      places it in anaplerotic replenishment of TCA-cycle intermediates. GO has no anaplerosis term; oxaloacetate
      metabolic process is the most specific process in which PycA performs the step, and it matches the
      term carried by the E. coli PEP carboxylase review.
    supported_by:
    - reference_id: PMID:35130724
      supporting_text: Apo-DarB helps to replenish the cycle by activating both pyruvate carboxylase gene
        expression and enzymatic activity
    - reference_id: file:BACSU/pycA/pycA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Fulfills an anaplerotic function in B.subtilis as it is necessary for growth on
        glucose, but is not required for sporulation (PubMed:4146915).
