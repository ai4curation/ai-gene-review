  label: Bacillus subtilis subsp. subtilis str. 168
description: SsbA is the principal single-stranded DNA-binding protein of Bacillus subtilis. It coats
  exposed single-stranded DNA during replication and recruits or regulates DNA-processing partners through
  its C-terminal region. SsbA also participates directly in recombination and repair, including activation
  of RecA-mediated strand exchange with DprA and stimulation of RecQ helicase.
