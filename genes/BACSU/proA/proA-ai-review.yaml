taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: Bacillus subtilis ProA is a soluble cytoplasmic gamma-glutamyl phosphate reductase that uses
  NADPH to reduce L-glutamyl 5-phosphate to L-glutamate 5-semialdehyde. The latter cyclizes spontaneously
  to pyrroline-5-carboxylate, a precursor of proline. ProA supplies the common reductive step for both
  the anabolic ProB route and the osmotically induced ProJ route.
