- id: PMID:25367752
  title: 'Evolution of proline biosynthesis: enzymology, bioinformatics, genetics, and transcriptional
    regulation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review. The repository cache contains the abstract, while the publisher
      full text was independently inspected at https://onlinelibrary.wiley.com/doi/10.1111/brv.12146 on
      2026-11-07 UTC. The pathway overview supports conserved chemistry and alternative routes; it is
      not a target-specific activity or localization assay. Older channeling interpretations do not establish
      a stable complex on these target proteins.
  findings:
  - statement: The prevalent glutamate route separates kinase phosphorylation from reductase production
      of glutamate semialdehyde, which cyclizes spontaneously before the final proline-forming reduction.
    supporting_text: glutamate is phosphorylated to γ-glutamyl phosphate by γ-glutamyl kinase, reduced
      to γ-glutamyl semialdehyde by γ-glutamyl phosphate reductase, cyclized spontaneously to Δ(1)-pyrroline-5-carboxylate
- id: PMID:21784929
  title: Osmotically controlled synthesis of the compatible solute proline is critical for cellular defense
    of Bacillus subtilis against high osmolarity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. JH642-derivative genetics separates ProB/ProJ branches and shared
      ProA; reference target is strain168. Feedback resistance of ProJ is argued physiologically rather
      than measured here.
  findings:
  - statement: 'In JH642-derived B. subtilis, ProA is shared by anabolic and osmoadaptive proline synthesis:
      its disruption eliminates osmoadaptive synthesis and causes proline auxotrophy.'
    supporting_text: Disruption of the proA gene also abolished osmoadaptive proline biosynthesis but
      caused, in contrast to the disruption of proHJ, proline auxotrophy.
- id: PMID:8083159
  title: Multiple copies of the proB gene enhance degS-dependent extracellular protease production in
    Bacillus subtilis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; UniProt identifies strain168 and records sequence conflicts in
      the original sequence. Gene organization supports pathway context. Multicopy protease phenotypes
      do not establish a direct protease regulatory activity of ProB.
  findings:
  - statement: The B. subtilis proB and proA genes are adjacent and encode successive reactions in the
      glutamate route. The multicopy protease phenotype does not itself establish direct regulation of
      proteases by either enzyme.
    supporting_text: The proB gene encoding gamma-glutamyl kinase was followed by the proA gene encoding
      glutamyl-gamma-semialdehyde dehydrogenase at an interval of 39 nucleotides, suggesting that the
      genes constitute an operon.
  full_text_unavailable: true
