id: P54595
gene_symbol: dgcK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DgcK is a six-pass membrane diguanylate cyclase of Bacillus subtilis with a cytoplasmic GGDEF
  catalytic domain. It converts GTP into cyclic di-GMP and couples locally to the inactive-GGDEF receptor
  YdaK and the PilZ receptor MotI/DgrA. These receptor interactions connect messenger production to an
  incompletely characterized extracellular polysaccharide system and to inhibition of flagellar motility;
  their contribution depends on growth conditions and receptor expression.
