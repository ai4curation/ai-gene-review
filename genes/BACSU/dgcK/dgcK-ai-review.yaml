- term:
    id: GO:1902201
    label: negative regulation of bacterial-type flagellum-dependent cell motility
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002895351
  - UniProtKB:P46139
  - UniProtKB:P76236
  - UniProtKB:P76237
  - UniProtKB:P76330
  review:
    summary: DgcK-generated messenger activates the MotI/DgrA motility-inhibition pathway.
    action: ACCEPT
    reason: The cyclase performs the signaling reaction and interacts directly with DgrA; this is an upstream
      functional contribution to inhibition of flagellar motility, not an assertion that DgcK itself binds
      the motor. Its c-di-GMP-dependent motility role is supported independently of the IBA, with no lineage
      loss detected. Primary biochemical and cellular experiments used NCIB 3610 or derivatives, not an
      assumed 168 culture. The reviewed 168 sequence is identical end-to-end to the corresponding protein
      in the NCIB 3610 comI-Q12L chromosome CP020102.1; accession, length and SHA-256 are recorded in
      the gene notes. This supports conserved protein activity without transferring strain-dependent biofilm
      capacity.
    supported_by:
    - reference_id: PMID:32156823
      supporting_text: Both, DgcK and DgcP interact with DgrA in vitro
    - reference_id: PMID:23893111
      supporting_text: We conclude that DgcK, DgcP, and DgcW possess diguanylate cyclase activity both
        in vivo and in vitro
