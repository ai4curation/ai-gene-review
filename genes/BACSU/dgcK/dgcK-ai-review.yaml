- term:
    id: GO:0043709
    label: cell adhesion involved in single-species biofilm formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002895351
  - UniProtKB:P31129
  review:
    summary: A specific cell-adhesion step in biofilm formation is not established for DgcK.
    action: MARK_AS_OVER_ANNOTATED
    reason: DgcK supplies messenger to YdaK-associated EPS output, but the polymer is unidentified and
      the primary study explicitly leaves its biofilm role unresolved. Standard native DGC deletion assays
      did not establish a biofilm defect; overexpression-dependent colony morphology is not evidence that
      DgcK executes cell adhesion. PAINT has no lineage loss, but the inferred process is more specific
      than target evidence supports.
    supported_by:
    - reference_id: PMID:28536559
      supporting_text: The function of the unknown EPS in terms of BF formation, however, requires further
        examinations.
    - reference_id: PMID:28536559
      supporting_text: the presence of dgc genes and particularly the presence of dgcK and furthermore
        an intact conserved I-site motif (RxxD) of YdaK are indispensable for the production of an unknown
        EPS
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002895351
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The 2018-02-09 PAINT IBD at PTN002895351 assigns GO:0043709 and includes the DgcK leaf
          PTN002895402; its recorded descendant evidence includes UniProtKB:P31129. The issue is node-level
          scope of a specific adhesion process, not donor count. DgcK retains cyclase activity, but its
          experimentally characterized YdaK output is an unknown EPS with unresolved native biofilm function
          (PMID:28536559), not established cell adhesion.
      residue_claims_not_applicable: The issue is process specificity of a conserved active cyclase, not
        catalytic-residue loss.
