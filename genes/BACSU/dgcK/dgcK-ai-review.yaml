- id: PMID:23893111
  title: Functional characterization of core components of the Bacillus subtilis cyclic-di-GMP signaling
    pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical and cellular experiments used NCIB 3610 or derivatives, not an assumed
      168 culture. The reviewed 168 sequence is identical end-to-end to the corresponding protein in the
      NCIB 3610 comI-Q12L chromosome CP020102.1; accession, length and SHA-256 are recorded in the gene
      notes. This supports conserved protein activity without transferring strain-dependent biofilm capacity.
  findings:
  - statement: DgcK is an active diguanylate cyclase in purified-domain and cellular assays.
    supporting_text: We conclude that DgcK, DgcP, and DgcW possess diguanylate cyclase activity both in
      vivo and in vitro
- id: PMID:28536559
  title: New Functions and Subcellular Localization Patterns of c-di-GMP Components (GGDEF Domain Proteins)
    in B. subtilis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected; distinguish induced EPS/colony morphology from native biofilm formation.
  findings:
  - statement: DgcK participates in the YdaK-dependent unknown-EPS system; direct cell adhesion is not
      demonstrated.
    supporting_text: the presence of dgc genes and particularly the presence of dgcK and furthermore an
      intact conserved I-site motif (RxxD) of YdaK are indispensable for the production of an unknown
      EPS
  - statement: The EPS contribution to biofilm formation remains unresolved.
    supporting_text: The function of the unknown EPS in terms of BF formation, however, requires further
      examinations.
- id: PMID:32156823
  title: Cyclic di-GMP Signaling in Bacillus subtilis Is Governed by Direct Interactions of Diguanylate
    Cyclases and Cognate Receptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical and cellular experiments used NCIB 3610 or derivatives, not an assumed
      168 culture. The reviewed 168 sequence is identical end-to-end to the corresponding protein in the
      NCIB 3610 comI-Q12L chromosome CP020102.1; accession, length and SHA-256 are recorded in the gene
      notes. This supports conserved protein activity without transferring strain-dependent biofilm capacity.
  findings:
  - statement: DgcK is a six-pass membrane protein that interacts with YdaK.
    supporting_text: Purified soluble domains of DgcK, an integral membrane protein with 6 transmembrane
      helices (TMs), and of YdaK, which harbors 4 TMs
  - statement: DgcK also interacts directly with DgrA/MotI.
    supporting_text: Both, DgcK and DgcP interact with DgrA in vitro
