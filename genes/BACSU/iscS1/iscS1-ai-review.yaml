  review:
    action: NEW
    summary: YrvO directly supplies sulfur to MnmA during reconstituted wobble-uridine thiolation.
    reason: The PS832/168-lineage protein mobilizes cysteine sulfur and directly transfers it to its cognate
      MnmA; it performs a chemical step rather than merely being required or serving as a consumed substrate.
      PMID:25825430 demonstrates ATP-dependent s(2)U formation by the purified pair. The source-to-reference-strain
      bridge remains the previously recorded identity inference. GO:0002143 explicitly includes the multistep
      transfer from L-cysteine to U34 and is under tRNA modification/thiolation. Same-role sulfur carriers
      ECOLI TusA and TusE both have direct IDA annotations to this process; those comparator annotations
      inform scope, not evidence support. No matching O34599/YrvO/iscS1 entry was found in the cached
      GO-CAM index. Neither existing IscS1 MF row is an ancestor/descendant process duplicate, and no
      other NEW process is proposed. This does not assign terminal tRNA sulfurtransferase activity to
      YrvO.
    supported_by:
    - reference_id: PMID:25825430
      supporting_text: In vitro experiments demonstrated s(2)U formation by YrvO and MnmA, and kinetic
        analysis established a partnership between the B. subtilis proteins that is contingent upon the
        presence of ATP.
    - reference_id: PMID:25825430
      supporting_text: YrvO is able to transfer sulfur directly to MnmA.
