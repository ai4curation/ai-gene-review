  label: Bacillus subtilis subsp. subtilis str. 168
description: IscS1, also called YrvO, is a pyridoxal-phosphate-dependent cysteine desulfurase that mobilizes
  sulfur from L-cysteine for its cognate tRNA thiouridylase MnmA. The Bacillus subtilis YrvO–MnmA pair
  supports ATP-dependent C2 thiolation of tRNA wobble uridine without the Escherichia coli Tus relay.
  This dedicated sulfur-delivery role does not imply that IscS1 is a general iron-sulfur scaffold or the
  universal donor for all cellular sulfur pathways.
