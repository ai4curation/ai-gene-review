    correctness: VERIFIED
    review_notes: Abstract inspected; normal forced retrieval and full-text provider chain did not
      recover the scanned full article. Only explicit abstract results are used. Comparative
      Pelobacter biochemistry is not represented as a direct target-species assay. E1
      lipoyl-transfer interpretation is also explained in the independent 2010 review.
