  title: Purification and characterization of acetoin:2,6-dichlorophenolindophenol oxidoreductase,
    dihydrolipoamide dehydrogenase, and dihydrolipoamide acetyltransferase of the Pelobacter
    carbinolicus acetoin dehydrogenase enzyme system.
  findings:
