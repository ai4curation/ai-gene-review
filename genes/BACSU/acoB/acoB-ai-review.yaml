- id: PMID:10368162
  title: Biochemical and molecular characterization of the Bacillus subtilis acetoin catabolic
    pathway.
  findings:
  - statement: The introduction identifies AcoB as the beta subunit in previously characterized AoDH
      systems; the Bacillus Results link its native acoABCL sequences to those corresponding
      components. This is component assignment by sequence, not an isolated Bacillus beta-subunit
      assay.
    supporting_text: "Striking similarities between the acoABCL -encoded\namino acid sequences and the
      corresponding enzyme components of the\nwell-known AoDH ES from P. putida ( 15 ), P.\ncarbinolicus
      ( 22 ), A. eutrophus ( 23 ), C. magnum ( 16 ), and K.\npneumoniae ( 6 ) were found."
    reference_section_type: RESULTS
  - statement: Comparative AcoB nomenclature identifies the beta component used in the Bacillus
      sequence assignment.
    supporting_text: acoB (encoding the β subunit of AoDH E1)
    reference_section_type: INTRODUCTION
  - statement: Native strain168 acoA disruption eliminates detectable E1 activity and
      acetoin-supported stationary-cell growth; E2/E3 roles additionally use comparative sequence
      evidence.
    supporting_text: "These experiments clearly demonstrated that an aco -encoded\nAoDH ES is present
      in B. subtilis and that it is the major\nenzyme system responsible for the catabolism of acetoin."
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. The beta-subunit phrase in the introduction describes
      comparative systems; native Bacillus sequence similarity identifies the corresponding
      component. The acoA disruption assay measures assembled E1, not isolated AcoB catalysis.
