core_functions:
- description: 'Octanoyl-GcvH:protein N-octanoyltransferase (amidotransferase, EC 2.3.1.204): transfers
    the octanoyl group from octanoyl-GcvH to client E2 lipoyl domains via a Cys150 thioester intermediate,
    supplying LipA with its substrate in the Bacillus GcvH-relay lipoylation route.'
  proposed_molecular_function: lipoyl-GcvH:protein N-lipoyltransferase activity
  directly_involved_in:
  - *id008
  supported_by:
  - *id003
  - *id009
  - *id007
proposed_new_terms:
- proposed_name: lipoyl-GcvH:protein N-lipoyltransferase activity
  proposed_definition: 'Catalysis of the reaction: N6-[(R)-lipoyl]-L-lysyl-[glycine-cleavage complex H
    protein] + L-lysyl-[lipoyl-carrier protein] = L-lysyl-[glycine-cleavage complex H protein] + N6-[(R)-lipoyl]-L-lysyl-[lipoyl-carrier
    protein]; the enzyme class also transfers the octanoyl precursor (N6-octanoyl-L-lysyl-[glycine-cleavage
    complex H protein] as donor, RHEA:20213), relaying the acyl group from GcvH to client E2 lipoyl domains.'
  justification: LipL-type amidotransferases (EC 2.3.1.204, RHEA:20213) use a protein donor, GcvH, distinct
    from the octanoyl-ACP donor reaction that defines GO:0033819. Current GO has created GO:7770091 lipoyl-GcvH:protein
    N-lipoyltransferase activity (QuickGO, cross-referenced to EC 2.3.1.204, RHEA:16413 and RHEA:20213,
    with octanoyl-[GcvH]:protein N-octanoyltransferase activity as a related synonym), but that term is
    absent from the GO release configured for validation here. This entry records the term until the configured
    release contains GO:7770091, at which point the id should be swapped in.
  supported_by:
  - *id003
  - *id006
  - *id007
