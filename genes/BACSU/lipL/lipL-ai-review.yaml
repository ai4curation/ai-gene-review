  label: Bacillus subtilis subsp. subtilis str. 168
description: LipL is the octanoyl-GcvH:protein amidotransferase of Bacillus subtilis, the second enzyme
  of its GcvH-relay route of endogenous lipoic acid assembly. After LipM loads an octanoyl group from
  acyl carrier protein onto the glycine cleavage H protein GcvH, LipL transfers it by transamidation to
  the lipoyl domains of the E2 subunits of pyruvate dehydrogenase and the other 2-oxoacid dehydrogenases,
  through a thioester-linked acyl-enzyme intermediate on Cys150 (probably acting with a lysine as a Cys-Lys
  dyad). The octanoylated E2 domains are then converted to lipoyl domains by lipoyl synthase LipA. LipL
  belongs to the lipoate-protein ligase superfamily but has neither octanoyl-ACP transferase nor ligase
  activity; it is required for lipoic acid synthesis and also has a role in lipoate scavenging.'
