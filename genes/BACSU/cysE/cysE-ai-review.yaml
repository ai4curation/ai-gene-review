    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher text inspected independently of the abstract-only normal cache. Bacillus168
      and specified derivative strains; purified CysK-His6 in E. coli. Positive OAS/sulfide catalysis,
      negative serine/OAS plus homocysteine cystathionine assays, and downstream sulfur-use growth phenotypes.
      Do not convert necessity into direct methionine catabolism.
- id: PMID:18974048
  title: The CymR regulator in complex with the enzyme CysK controls cysteine metabolism in Bacillus subtilis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Author-hosted full primary inspected; normal cache abstract-only. Strain168 physiology,
      His-tagged CysE at either terminus, CysK-His6 and MBP-CysK with Factor X cleavage controls. Direct
      enzyme activity, CymR binding and negative CysE-CysK interaction tests. Printed CysE cloning coordinates
      (+1..+626) do not unambiguously reconstruct current217aa sequence; no invented exact construct identity
      or gene-model correction.
