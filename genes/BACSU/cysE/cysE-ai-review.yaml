taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CysE is the soluble serine acetyltransferase of Bacillus subtilis168. It produces O-acetylserine
  from serine and acetyl-CoA for cysteine synthesis and is feedback-inhibited by cysteine. O-acetylserine
  also influences the CymR-CysK regulatory system. Under the tested conditions CysE is active independently
  of CysK and does not form the regulatory cysteine synthase complex found in several other bacteria.
