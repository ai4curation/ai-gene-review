  review:
    summary: Methionine utilization phenotypes do not establish direct methionine breakdown by this enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: CysE supplies OAS for cysteine formation and for the MccA-mediated reverse-transsulfuration
      route. The cysE14 growth defect establishes precursor dependence, while CysE chemistry acts on serine
      and acetyl-CoA, not on methionine or its breakdown intermediates. Keep the source row, but the broad
      catabolic participation claim exceeds the demonstrated biochemical role.
