description: >-
  ProTrek sequence-to-text retrieval for FtsZ, the bacterial tubulin homolog and master organiser
  of cell division. All three top calls are exact GOA matches and two of them - protein polymerization
  and FtsZ-dependent cytokinesis - are this review's core processes. Nothing in the top five is wrong.
  As with ETR1, retrieval reproduces a well-curated annotation set faithfully; the GTPase activity
  that this review names as the primary molecular function is not in the top five, so the picture
  is complete on process and empty on catalysis. Assessment: 3 correct not novel (CNN).
