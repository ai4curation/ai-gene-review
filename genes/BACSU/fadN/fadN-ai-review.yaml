  review:
    summary: FadN oxidizes hydroxyacyl-CoA using NAD+ by conserved-role inference.
    action: ACCEPT
    reason: The curated Rhea/EC reaction is concordant with specific dehydrogenase domains and native
      yusL genetics. This is a well-supported reaction assignment, but PMID:17189250 purified YsiA rather
      than FadN and therefore provides no isolated FadN rate or stereoselectivity measurement.
    supported_by:
