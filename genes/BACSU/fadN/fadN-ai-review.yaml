id: O32178
gene_symbol: fadN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: FadN (YusL) is a large fatty-acid beta-oxidation protein of Bacillus subtilis 168 with an
  NAD-dependent hydroxyacyl-CoA dehydrogenase module and an additional enoyl-CoA hydratase/isomerase-like
  domain. Native yusL disruption impairs palmitate utilization. Hydroxyacyl-CoA oxidation is assigned
  by conserved catalytic architecture; its additional hydration chemistry and exact partner organization
  remain incompletely characterized.
