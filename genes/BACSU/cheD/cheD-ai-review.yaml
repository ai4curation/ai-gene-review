id: P40404
gene_symbol: cheD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CheD is a receptor-modifying and regulatory protein in Bacillus subtilis chemotaxis.
  It deamidates selected receptor glutamines, including McpC Gln609, and can activate receptors
  through binding independently of deamidation. CheD also stimulates CheC phosphatase activity.
  CheY-P-dependent association of CheD with CheC provides adaptation feedback by controlling
  its availability to receptors; McpB is activated by binding rather than being deamidated by
  CheD.
