references:
- id: file:BACSU/cheB/cheB-hypotheses/kgap-cheb-deamidation-sites/openscientist.md
  title: OpenScientist analysis of candidate CheB receptor deamidation sites in B. subtilis
  findings:
  - statement: >-
      The native deamidation sites cannot be named, and the existing candidate is demoted: McpB Gln371
      superposes on Tsr Ser255, inside the HAMP domain and 42 residues from the nearest demonstrated
      column, while the columns of the two experimentally deamidated E. coli residues fall on McpB
      Leu413 and Asp427. Glutamine does occupy the demonstrated column in three other B. subtilis
      receptors, but a base-rate control puts that occupancy at chance, so they are predictions rather
      than sites. The demonstrated receptor deamidase of this organism is CheD, not CheB, and because
      this CheB uses one serine nucleophile for both reactions, no existing allele separates
      deamidation from demethylation, so the contribution cannot be ranked.
    supporting_text: >-
      McpB Gln371 does not fall at a position equivalent to a demonstrated deamidation site
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Verified against this entry's own 357-residue UniProt record: the catalytic serine at position
      173, and that the deamidase assignment here, EC 3.5.1.44 beside the methylesterase EC, carries
      HAMAP rule evidence rather than experimental evidence for this organism. Not reproduced here:
      the structural superposition onto the Tsr cytoplasmic domain and the resulting column
      assignments, the eight-receptor mapping and the base-rate statistics. The run leans toward
      calling the deamidase rows over-annotated; they are left as ACCEPT because the E. coli donor
      evidence is experimental, the family assignment is sound, and the rows assert an inherited
      capability rather than a native site or a physiological contribution, which is what this
      analysis removes.
