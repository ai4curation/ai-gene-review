knowledge_gaps:
- gap_statement: The native receptor sites and physiological contribution of Bacillus CheB deamidation
    remain less directly resolved than its receptor demethylation function.
  boundary: >-
    Conserved-family evidence supports deamidase capability, while direct receptor demethylation and a
    phosphorylated receiver domain are established. McpB Q371 is discussed as a candidate CheB
    substrate in PMID22931217 rather than demonstrated there. An OpenScientist run
    (kgap-cheb-deamidation-sites) leaves the native sites unnamed and demotes the one candidate this
    boundary carried. The decisive check was whether McpB Gln371 sits at a position equivalent to a
    demonstrated deamidation site, and it does not: superposing the McpB cytoplasmic domain on the
    E. coli Tsr cytoplasmic domain places Gln371 at Tsr Ser255, inside the HAMP domain and 42
    residues from the nearest demonstrated column, while the columns of the two residues actually
    shown to be CheB-deamidated in E. coli fall on McpB Leu413 and Asp427. The inference the whole
    family argument rests on does hold in the reference organism, where a deamidated glutamine
    occupies the same column as a methyl-accepting glutamate in paralogues, so the reasoning is sound
    and it is this candidate that fails. The activity is not left without any conceivable substrate
    here: across eight mappable B. subtilis chemoreceptors, glutamine occupies the demonstrated
    column in three, McpA Gln412, TlpB Gln412 and TlpC Gln318. But the run runs the base-rate control
    that this kind of claim needs and reports against itself: five of 40 mapped columns carry
    glutamine, 0.125 against a background glutamine frequency of 0.078 in the same methylation-helix
    regions, a one-sided binomial p of 0.197 and 1.61-fold enrichment. Those three are predictions,
    not sites. The heavier finding is about enzyme assignment rather than alignment. The demonstrated
    receptor deamidase of this organism is CheD, not CheB, and the single mapped B. subtilis
    deamidation site, McpC Gln609, is a CheD site. Because this CheB uses one serine nucleophile for
    both the esterase and the deamidase reaction, the only available catalytic allele removes both at
    once, so the contribution of deamidation cannot be ranked against demethylation for this gene
    product by any existing genetic tool. The two protein-glutamine glutaminase rows are left as
    ACCEPT. Their stated reason is that the rows record an inherited biochemical capability without
    asserting a native site, which this analysis does not contradict: the donor evidence in E. coli
    is genuinely experimental, the family assignment is sound, and what the run removes is a
    candidate site and any claim about physiological contribution, neither of which those rows
    assert. Verified here against this entry's own record, which is 357 residues: the catalytic
    serine at position 173, and that the deamidase assignment on this entry, EC 3.5.1.44 alongside
    the methylesterase EC, carries HAMAP rule evidence rather than experimental evidence for this
    organism. Not reproduced here: the structural superposition onto Tsr and the resulting column
    assignments, the eight-receptor mapping, and the base-rate statistics.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  resolution: >-
    Measure site-resolved receptor deamidation by purified Bacillus CheB and test the same sites in
    cheB and cheD backgrounds. The run adds two refinements: the candidate sites worth testing first
    are the glutamines at the demonstrated column, McpA Gln412, TlpB Gln412 and TlpC Gln318, rather
    than McpB Gln371, which is not at an equivalent position; and because this CheB uses a single
    serine nucleophile for both reactions, separating the two activities genetically needs more than
    the existing catalytic allele, which abolishes both.
  provenance:
  - reference_id: PMID:22931217
    supporting_text: 'CheD deamidates Q609 in McpC and does not

      deamidate McpB.'
  - reference_id: file:BACSU/cheB/cheB-hypotheses/kgap-cheb-deamidation-sites/openscientist.md
    supporting_text: >-
      McpB Gln371 does not fall at a position equivalent to a demonstrated deamidation site
  - reference_id: file:BACSU/cheB/cheB-hypotheses/kgap-cheb-deamidation-sites/openscientist.md
    supporting_text: >-
      These are predictions, not sites.
