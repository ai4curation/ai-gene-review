- id: PMID:8395512
  title: Chemotactic methylesterase promotes adaptation to high concentrations of attractant
    in Bacillus subtilis.
  findings:
  - statement: CheB mediates receptor demethylation during adaptation.
    supporting_text: 'CheBB is required for removal of

      methyl groups from the receptors upon attractant stimulus'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache remains abstract-only after normal acquisition and force retry where
      attempted; full access was also sought at the publisher. Explicit abstract findings are
      used without inventing methods. UniProt connects X67806/CAA48007.1 to Q05522 (cheB, former
      cheL). The current record incorporates a later sequence revision at residue 66. The abstract
      does not resolve the experimental strain, so it is not claimed to be an unmodified modern
      168 reference construct.
