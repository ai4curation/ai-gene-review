taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CheB is a receiver-regulated receptor methylesterase in Bacillus subtilis chemotaxis.
  It removes methyl esters from chemoreceptor glutamates and participates in sensory adaptation,
  particularly at high attractant concentrations where methylation-independent mechanisms do
  not fully compensate. CheA can phosphorylate its receiver domain. A receptor deamidase activity
  is inferred from the conserved CheB enzyme family, but the native deamidation substrates and
  their contributions are less firmly established than receptor demethylation.
