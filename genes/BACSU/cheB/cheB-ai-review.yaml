knowledge_gaps:
- gap_statement: The native receptor sites and physiological contribution of Bacillus CheB deamidation
    remain less directly resolved than its receptor demethylation function.
  boundary: Conserved-family evidence supports deamidase capability, while direct receptor demethylation
    and a phosphorylated receiver domain are established. McpB Q371 is discussed as a candidate
    CheB substrate in PMID22931217 rather than demonstrated there.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Measure site-resolved receptor deamidation by purified Bacillus CheB and test
    the same sites in cheB and cheD backgrounds.
