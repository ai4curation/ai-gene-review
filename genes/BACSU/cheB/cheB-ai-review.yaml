  review:
    summary: CheB receptor deamidase capability is inferred from conserved enzyme-family evidence; specific native Bacillus substrate sites remain unverified (PMID:22931217).
    action: ACCEPT
    reason: Retain the conserved CheB deamidase activity supported by PAINT and the curated
      HAMAP enzyme-family assignment. PMID22931217 treats Bacillus receptor deamidation by CheB
      as plausible, not directly demonstrated there. This supports an inferred biochemical capability
      without asserting that McpB Q371 or any specific native site has been experimentally assigned
      to this enzyme.
    supported_by:
    - reference_id: PMID:22931217
      supporting_text: While the CheB methylesterase also deamidates conserved glutamines on
        the chemoreceptors in E. coli and potentially in B. subtilis as well, these glutamines
        are distinct from those targeted by CheD
