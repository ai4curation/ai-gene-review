id: P42435
gene_symbol: nasD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: NasD is the large catalytic subunit of the cytosolic Bacillus subtilis 168 NasDE nitrite
  reductase. Its flavin, iron-sulfur and siroheme cofactors support six-electron reduction of nitrite
  to ammonium. Native activity is NADH dependent; a minor NADPH-supported signal in crude extracts has
  not been assigned specifically to NasDE. Together with the required small subunit NasE, it supports
  nitrogen assimilation and anaerobic nitrite reduction downstream of respiratory nitrate metabolism.
existing_annotations:
- term:
    id: GO:0008942
    label: nitrite reductase [NAD(P)H] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.7.1.4
  review:
    summary: The supported donor-specific activity is NADH-dependent nitrite reduction.
    action: MODIFY
    reason: Native cell-extract assays and polarity-controlled deletions establish the NasDE contribution
      to NADH-dependent nitrite reduction. Refine the broad term to this measured main activity. The reported
      NADPH-supported signal below 10% of the NADH rate was measured in crude extract; it does not distinguish
      direct NasDE turnover from transhydrogenase-mediated electron transfer or other extract activities.
      Its attribution therefore remains unresolved. NasD supplies the large-subunit catalytic machinery.
    supported_by:
    - reference_id: PMID:9765565
      supporting_text: NADH-dependent nitrite reductase activity was detected in a cell extract prepared
        from the wild-type strain grown with nitrite, but activity with NADPH was much lower; no activity
        was detected when ammonium was used as sole nitrogen source (Table 2).
    - reference_id: PMID:9765565
      supporting_text: Activity with NADPH was less than 10% of that with NADH.
    - reference_id: PMID:9765565
      supporting_text: However, extracts prepared from LAB1943 and LAB1982 grown with nitrite or ammonium
        in the presence of IPTG had no significant nitrite reductase activity, indicating that both nasD
        and nasE genes are required for enzyme activity.
    proposed_replacement_terms:
    - id: GO:0106316
      label: nitrite reductase (NADH) activity
