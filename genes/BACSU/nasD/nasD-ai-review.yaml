  review:
    summary: NasD performs the nitrite-reduction step of nitrate assimilation.
    action: ACCEPT
    reason: The native NasDE enzyme reduces nitrite to ammonium for biosynthesis. Its additional anaerobic
      role does not negate this directly demonstrated assimilatory function.
    supported_by:
    - reference_id: PMID:9765565
