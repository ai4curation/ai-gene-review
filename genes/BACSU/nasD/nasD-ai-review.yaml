  title: Nitrogen and oxygen regulation of Bacillus subtilis nasDEF encoding NADH-dependent nitrite reductase
    by TnrA and ResDE.
  findings:
  - statement: Native extracts show NADH-dependent nitrite reduction and a weaker NADPH-supported signal;
      the latter does not establish direct NADPH use by NasDE.
    supporting_text: NADH-dependent nitrite reductase activity was detected in a cell extract prepared
      from the wild-type strain grown with nitrite, but activity with NADPH was much lower; no activity
      was detected when ammonium was used as sole nitrogen source (Table 2).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article read. Native JH642/168-lineage activity, subunit-deletion controls
      and cytosolic fractionation support NasDE. The abstract reverses the narGHI/nasBC anabolic/catabolic
      pairing; the body correctly distinguishes respiratory NarGHJI from assimilatory NasBC.
