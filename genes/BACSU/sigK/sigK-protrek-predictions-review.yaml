id: P12254
gene_symbol: sigK
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for sigma-K, the late mother-cell-specific sporulation sigma
  factor. Completing the trio, its top five again leads with intracellular immature spore and sporulation
  and omits sigma factor activity. For sigma-K the leading call is not merely uninformative but wrong-compartment:
  sigma-K acts in the mother cell, not in the developing forespore, so the same rank-1 term that is
  arguably defensible for sigF and sigG is a mislocalisation here - which is exactly what makes the
  identical output across three paralogs diagnostic rather than harmless. Assessment: 1 correct not
  novel (CNN), 1 less precise (LSP), 1 nonparalog incorrect (NPI).
source_documents:
