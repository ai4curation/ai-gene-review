  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0042763
    label: intracellular immature spore
  predicted_term_type: GO_CC
  review:
    assessment: NPI
    confidence_score: 0
    error_type: LOCALIZATION_DEFAULT
    summary: >-
      Top-ranked hit (score 14.77) and the same term returned first for sigF and sigG. Sigma-K is
      the mother-cell sigma factor: it is reconstituted by SpoIVCA excision of the skin element and
      activated by SpoIVFB-mediated cleavage of pro-sigma-K in the mother cell membrane, and it directs
      coat and cortex gene transcription from the mother-cell compartment. Placing it in the immature
      spore inverts the compartment. Scored as an error rather than uncertain precisely because the
      identical call for all three paralogs shows the model is not resolving compartment at all.
    supported_by:
    - reference_id: file:BACSU/sigK/sigK-uniprot.txt
      supporting_text: >-
        RNA polymerase sigma-K factor
