- id: PMID:8555198
  title: Flavin-dependent alkyl hydroperoxide reductase from Salmonella typhimurium. 1. Purification and
    enzymatic activities of overexpressed AhpF and AhpC proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected. Explicitly compares native-isolated and E. coli-expressed
      Salmonella proteins; NADH/NADPH Km comparison is from DTNB assays, not native flux. Used as comparative
      biochemical evidence for Bacillus.
  findings:
  - statement: The Salmonella pair directly reduces both organic hydroperoxides and hydrogen peroxide.
    supporting_text: Anaerobic hydroperoxide reductase assays have demonstrated that cumene hydroperoxide,
      ethyl hydroperoxide, and hydrogen peroxide can all be reduced by the combined enzyme system.
  - statement: Both pyridine nucleotides are usable; the measured preference is assay-specific.
    supporting_text: Although AhpF can use either NADH or NADPH as the electron donor for these activities,
      NADH is the preferred reductant
- id: PMID:8555199
  title: Flavin-dependent alkyl hydroperoxide reductase from Salmonella typhimurium. 2. Cystine disulfides
    involved in catalysis of peroxide reduction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected for redox titration and truncation findings; exact cysteine
      numbering belongs to the Salmonella proteins. No purified Bacillus kinetics inferred.
  findings:
  - statement: AhpF regenerates the intersubunit AhpC disulfide during peroxide turnover.
    supporting_text: The AhpC cystine disulfide center, shown to exist as an intersubunit disulfide bond,
      is stoichiometrically reducible by NADH in the presence of a catalytic amount of AhpF and can be
      reoxidized by ethyl hydroperoxide.
