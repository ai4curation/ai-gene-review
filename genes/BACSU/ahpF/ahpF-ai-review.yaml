taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: Bacillus subtilis AhpF is a flavoprotein disulfide reductase that regenerates oxidized AhpC
  for peroxide detoxification. Its C-terminal FAD/pyridine-nucleotide region supplies electrons to an
  N-terminal thioredoxin-like relay that reduces the AhpC disulfide. B. subtilis AhpF is encoded with
  AhpC in the stress-responsive ahpCF operon. Its AhpC-directed catalytic assignment is supported by this
  native context and conserved AhpF domains; target-specific donor kinetics and any peripheral-membrane
  pool remain unresolved.
