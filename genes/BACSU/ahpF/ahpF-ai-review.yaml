  review:
    summary: The proton-pumping claim is an unsupported consequence of the respiratory EC mapping.
    action: REMOVE
    reason: This logical electronic row derives specifically from GO:0008137, whose reaction translocates
      four protons. Complete-target AhpF domain identity and native ahpCF locus place BSU40100 in the
