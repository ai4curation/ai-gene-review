- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IDA
  original_reference_id: PMID:19535335
  qualifier: enables
  review:
    summary: BdbD binds calcium at an interdomain site that modulates oxidizing power.
    action: NEW
    reason: The crystal structure and metal analysis identify a calcium site distinct from the active-site
      cysteines, and calcium removal alters redox potential. This is specific functional calcium binding,
      not generic protein binding or a claim that calcium is an obligatory catalytic metal.
    supported_by:
    - reference_id: PMID:19535335
      supporting_text: presence of Ca2+ at the site significantly affects the redox properties of the
        protein, despite being some 14 Å away from the enzyme active site.
- term: &id005
    id: GO:0006457
    label: protein folding
  evidence_type: IC
  original_reference_id: PMID:11744713
  qualifier: involved_in
  review:
    summary: BdbD contributes directly to oxidative protein folding.
    action: NEW
    reason: 'BdbD performs the oxidation step rather than merely being a substrate of the process: direct
      purified-domain peptide oxidation combines with disulfide-dependent heterologous PhoA activity/stability
      in strain 168. The same oxidase role carries protein folding for E. coli DsbA (IDA PMID:1429594)
      and P. putida DsbA in the comparator reviews. ComGC dependence alone is not the basis for this addition,
      and direct ComGC folding remains unproven in the 2002 primary study.'
    supported_by:
    - *id003
    - &id006
      reference_id: file:BACSU/bdbD/bdbD-source-analysis/11744713-excerpts.md
      supporting_text: 'The secretion of active

        PhoA by the bdbD strain was not restored when the transcription of bdbC was induced with IPTG
        (2.48 ⫾ 0.39 units/A600),

        showing that BdbD, like BdbC (2), assists in the secretion of

        active PhoA.'
