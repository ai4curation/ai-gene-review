- id: PMID:22882210
  title: The biofilm formation defect of a Bacillus subtilis flotillin-defective mutant involves the protease
    FtsH.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. NCIB3610 study with 168 cloning intermediates. The authors warn that
      DRM proteins should not be equated with raft-associated proteins. FtsH/biofilm results do not establish
      a BdbD biofilm function.
- id: PMID:11744713
  title: The bdbDC operon of Bacillus subtilis encodes thiol-disulfide oxidoreductases required for competence
    development.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal cache remains abstract-only after force retry. Full publisher PDF was
      independently obtained from the University of Groningen repository and read; selected exact excerpts
      and acquisition hashes are retained in BdbD source analysis. Strain 168 and derivatives were used.
      PhoA functional results support oxidative folding; the authors explicitly state that direct ComGC
      folding evidence was not yet obtained.
- id: PMID:11844773
  title: Mutations in the thiol-disulfide oxidoreductases BdbC and BdbD can suppress cytochrome c deficiency
    of CcdA-defective Bacillus subtilis cells.
  findings:
  - statement: BdbC/BdbD pairing is inferred from genetic and comparative evidence.
    supporting_text: This gene organization and the fact that BdbD and BdbC are apparent orthologs of
      E. coli DsbA and DsbB, respectively, indicate that BdbC and BdbD function as a pair.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Genetic suppression and topology support a BdbC/BdbD redox pair; the
      conserved quinone-contact arginine is comparative evidence, not a BdbC quinone-reduction assay.
      Loss of an oxidizing pathway can rescue reductase deficiency, so rescue is not positive evidence
      for participation in cytochrome maturation or sporulation.
- id: PMID:19535335
  title: Crystal structure and biophysical properties of Bacillus subtilis BdbD. An oxidizing thiol:disulfide
    oxidoreductase containing a novel metal site.
  findings:
  - statement: Soluble BdbD directly transfers its disulfide to a cysteine-containing peptide.
    supporting_text: These experiments clearly demonstrate that oxidized sBdbD is able to transfer its
      disulfide bond to the apo-cytochrome c550 active site mimic peptide.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Assayed pACN2 construct derives from strain 1A1 and matches frozen O32218
      residues 30–222 exactly plus engineered Met and LEHHHHHH. Peptide oxidation, calcium binding/redox
      effects and membrane fractionation are direct; full membrane-coupled turnover and direct ComGC oxidation
      are not shown. The demonstrated membrane attachment supersedes a predicted cleaved-signal interpretation;
      exact native processing was not sequenced.
- id: file:BACSU/bdbD/bdbD-source-analysis/11744713-excerpts.md
  title: Selected primary evidence from PMID:11744713
  findings:
  - statement: Direct action on ComGC remained unproven in the competence study.
    supporting_text: 'Although ComGC is

      likely to be a target for the BdbD-BdbC system, no direct

      evidence for the role of the BdbD and BdbC proteins in folding

      of ComGC protein has been obtained so far.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verbatim selected excerpts from the genuine institutional-repository publisher PDF;
      full source remains in ignored acquisition cache and hashes are recorded alongside.
core_functions:
- description: Oxidizes exported protein thiols through a membrane-anchored DsbA-like catalytic domain.
    Direct substrate chemistry was measured using a soluble domain and a CXXCH peptide; ComGC is a genetically
    supported native candidate, not a purified-substrate demonstration.
  molecular_function: *id004
  directly_involved_in:
  - *id005
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id003
  - *id006
suggested_questions:
- question: Which quinone and BdbC cysteine pairs support physiological reoxidation of BdbD, and can
    complete turnover be reconstituted with defined lipids and substrates?
- question: Which native substrates are directly oxidized by BdbD, and which oxidation events are
    productive folding rather than antagonistic modifications requiring a reductase?
- question: Does the bacterial detergent-resistant microdomain containing this Bdb protein meet the
    lipid-composition and spatial criteria of GO:0045121, and can target-specific imaging or
    native-domain isolation resolve that mapping independently of detergent fractionation?
suggested_experiments:
- description: Reconstitute membrane-embedded BdbC with sequence-matched BdbD, defined quinones and reduced
    ComGC; measure quinone reduction, BdbD redox state and site-specific substrate disulfides independently.
  experiment_type: biochemical reconstitution
