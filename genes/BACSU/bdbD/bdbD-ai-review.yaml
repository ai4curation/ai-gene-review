    summary: BdbD catalyzes protein/peptide thiol-disulfide oxidation.
    action: NEW
    reason: Purified sequence-verified BdbD residues 30–222 transfer their disulfide to a CXXCH peptide.
      The reversible GO definition includes oxidation; this does not establish disulfide isomerization
