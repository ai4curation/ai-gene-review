- term:
    id: GO:0045121
    label: membrane raft
  evidence_type: EXP
  original_reference_id: PMID:20713508
  qualifier: located_in
  review:
    summary: bdbD is reported in detergent-resistant membrane fractions, but equivalence to the GO membrane-raft
      compartment is unresolved.
    action: UNDECIDED
    reason: The full primary papers explicitly distinguish detergent-resistant fractions from lipid rafts.
      GO:0045121 specifies sterol- and sphingolipid-enriched domains, whereas the Bacillus work concerns
      analogous bacterial functional microdomains and primarily NCIB3610. The curated UniProt note itself
      says the fractions may be equivalent to eukaryotic rafts. Retain the original claim without accepting
      exact compartment identity or rejecting the fractionation observation; plasma-membrane residence
      is independently supported.
    supported_by:
    - &id002
      reference_id: PMID:20713508
      supporting_text: While it is important to emphasize that the DRM fraction is not to be equated with
        lipid rafts, there is evidence that this fraction includes many of the proteins thought to be
        present in lipid rafts ( Brown 2002 ).
    additional_reference_ids:
    - PMID:20713508
    - PMID:22882210
