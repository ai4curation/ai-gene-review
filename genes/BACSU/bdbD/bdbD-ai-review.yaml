- term: &id004
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IDA
  original_reference_id: PMID:19535335
  qualifier: enables
  review:
    summary: BdbD catalyzes protein/peptide thiol-disulfide oxidation.
    action: NEW
    reason: Purified sequence-verified BdbD residues 30–222 transfer their disulfide to a CXXCH peptide.
      The reversible GO definition includes oxidation; this does not establish disulfide isomerization
      or reduction as the physiological direction.
    supported_by:
    - &id003
      reference_id: PMID:19535335
      supporting_text: These experiments clearly demonstrate that oxidized sBdbD is able to transfer its
        disulfide bond to the apo-cytochrome c550 active site mimic peptide.
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IDA
  original_reference_id: PMID:19535335
  qualifier: enables
  review:
    summary: BdbD binds calcium at an interdomain site that modulates oxidizing power.
    action: NEW
    reason: The crystal structure and metal analysis identify a calcium site distinct from the active-site
      cysteines, and calcium removal alters redox potential. This is specific functional calcium binding,
      not generic protein binding or a claim that calcium is an obligatory catalytic metal.
    supported_by:
    - reference_id: PMID:19535335
      supporting_text: presence of Ca2+ at the site significantly affects the redox properties of the
        protein, despite being some 14 Å away from the enzyme active site.
- term: &id005
    id: GO:0006457
    label: protein folding
  evidence_type: IC
  original_reference_id: PMID:11744713
  qualifier: involved_in
  review:
    summary: BdbD contributes directly to oxidative protein folding.
    action: NEW
    reason: 'BdbD performs substrate oxidation rather than merely being a necessary substrate of the process:
      direct purified-domain peptide oxidation combines with disulfide-dependent heterologous PhoA activity/stability
      in strain 168. This is an authored IC process proposal based on participation in productive oxidative
      folding. The E. coli DsbA IDA PMID:1429594 row and P. putida DsbA row cited as comparators in the
      previous reason are also repository-authored NEW proposals, not upstream GOA convention. Current
      verified-accession QuickGO checks found no GO:0006457 row for E. coli DsbA P0AEG4, PA14 DsbA Q02DM0
      or BdbD O32218; that systematic absence raises a convention question, rather than proving oversight.
      The target-specific purified chemistry plus PhoA functional maturation supports retaining this explicit
      proposal, while that convention remains unresolved. GO:0006457 covers assistance in correct tertiary
      assembly, including covalent assembly; no other BP in this review is an ancestor or descendant duplicate.
      ComGC dependence alone is not the basis, and direct ComGC folding was not demonstrated in the 2002
      study.'
    supported_by:
    - *id003
    - &id006
      reference_id: file:BACSU/bdbD/bdbD-source-analysis/11744713-excerpts.md
      supporting_text: 'The secretion of active

        PhoA by the bdbD strain was not restored when the transcription of bdbC was induced with IPTG
        (2.48 ⫾ 0.39 units/A600),

        showing that BdbD, like BdbC (2), assists in the secretion of

        active PhoA.'
