  - *id006
suggested_questions:
- question: Which quinone and BdbC cysteine pairs support physiological reoxidation of BdbD, and can complete
    turnover be reconstituted with defined lipids and substrates?
- question: Which native substrates are directly oxidized by BdbD, and which oxidation events are productive
    folding rather than antagonistic modifications requiring a reductase?
suggested_experiments:
- description: Reconstitute membrane-embedded BdbC with sequence-matched BdbD, defined quinones and reduced
    ComGC; measure quinone reduction, BdbD redox state and site-specific substrate disulfides independently.
  experiment_type: biochemical reconstitution
