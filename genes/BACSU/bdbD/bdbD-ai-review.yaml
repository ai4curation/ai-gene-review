id: O32218
gene_symbol: bdbD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: BdbD is a membrane-anchored DsbA-like thiol-disulfide oxidoreductase that introduces disulfide
  bonds into proteins on the external side of the Bacillus subtilis cytoplasmic membrane. Its soluble
  catalytic domain oxidizes a cysteine-containing peptide, and a structurally defined calcium-binding
  site increases its oxidizing power. BdbD and BdbC support oxidative folding of exported proteins and
  stabilize the competence pilin ComGC; oxidation of other substrates can instead oppose productive maturation.
