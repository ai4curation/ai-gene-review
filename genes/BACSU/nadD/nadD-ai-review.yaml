  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  NadD (YqeJ) is the nicotinate mononucleotide adenylyltransferase of Bacillus subtilis 168. It catalyzes
  the reversible, ATP-dependent adenylylation of nicotinate D-ribonucleotide (NaMN) to deamido-NAD+ (NaAD),
  the penultimate step of NAD+ synthesis that precedes amidation by NAD+ synthetase. The purified enzyme
  also adenylylates NMN but is specific for the nicotinate substrate. It is a dimer, and crystal structures
  of the apo and product-bound enzyme show a nucleotidyltransferase alpha/beta fold and a conserved functional
  dimer, with contacts between nicotinate and backbone atoms explaining the preference for the deamidated
  substrate.
