  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaC is the replicative DNA helicase of Bacillus subtilis. Its ATP-dependent oligomer unwinds
  parental DNA ahead of the replication fork. DnaI and the accessory protein DnaB assist its functional
  loading, while DnaG synthesizes RNA primers on the exposed template. Bacillus DnaC is the counterpart
  of the helicase called DnaB in Escherichia coli; Bacillus DnaB is a different loading protein.
