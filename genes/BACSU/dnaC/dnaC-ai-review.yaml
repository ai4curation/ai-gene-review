- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007692
  - InterPro:IPR007693
  - InterPro:IPR007694
  - InterPro:IPR036185
  review:
    action: MODIFY
    summary: The protein contributes directly to the replication machinery.
    reason: DnaC is the replicative DNA helicase of Bacillus subtilis. Its ATP-dependent oligomer unwinds
      parental DNA ahead of the replication fork. DnaI and the accessory protein DnaB assist its functional
      loading, while DnaG synthesizes RNA primers on the exposed template. Bacillus DnaC is the counterpart
      of the helicase called DnaB in Escherichia coli; Bacillus DnaB is a different loading protein. Purified-component
      experiments or direct DNA engagement establish a molecular role; process participation is not inferred
      solely from essentiality. The specific division of labor is retained in the core function. Refine
      to DNA-templated DNA replication, because this helicase-loading/strand-unwinding machinery acts
      on parental DNA rather than RNA-templated DNA synthesis.
    supported_by:
    - reference_id: PMID:12718886
      supporting_text: DnaI and DnaB interact physically and functionally with the DnaC helicase and mediate
        its functional delivery onto DNA.
    proposed_replacement_terms:
    - id: GO:0006261
      label: DNA-templated DNA replication
