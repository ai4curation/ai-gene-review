  - UniProtKB:P0ACB0
  review:
    action: ACCEPT
    summary: The conserved DnaC–DnaI helicase-loader assembly is supported.
    reason: 'The GO definition uses E. coli protein names: its DnaB is the helicase, which is called DnaC
      in Bacillus; its loader DnaC corresponds to Bacillus DnaI. This annotation describes the homologous
      functional complex and does not identify Bacillus DnaB as a helicase. Reconstitution and conserved
      PAINT placement support the claim.'
    supported_by:
    - reference_id: PMID:12718886
      supporting_text: DnaI and DnaB interact physically and functionally with the DnaC helicase and mediate
        its functional delivery onto DNA.
    - reference_id: PMID:20122408
      supporting_text: DnaE does not serve as the lagging strand replicase, like DNA polymerase delta
        in eukaryotes, but instead functions like eukaryotic DNA polymerase alpha, adding a stretch of
        deoxynucleotides to the RNA primer before handoff to PolC.
