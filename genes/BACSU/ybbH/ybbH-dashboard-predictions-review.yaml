description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for B. subtilis
  NZ_CP017763.1_2226 is "MurR/RpiR-family DNA-binding transcriptional regulator
  associated with amino sugar utilization." (tier A). Its GO terms are GO:0003700
  DNA-binding transcription factor activity (high), GO:0006355 regulation of
  DNA-templated transcription (high) and GO:0043610 regulation of carbohydrate
  utilization (medium). The dashboard sequence (UniParc UPI0001CE3D69, 291 aa) is 98.2%
  identical to B. subtilis 168 YbbH/MurR (Q45581, 283 aa); it differs at one internal
  residue and at the C-terminal tail, and keeps the full HTH_RpiR and SIS domains, so the
  call is scored on Q45581. All three terms are correct. GO:0003700 and GO:0006355 are
  already in GOA (IBA and IEA), so they are CNN. GO:0043610 is not in GOA and is
  supported: MurR represses the murQ-murR-murP-amiE-nagZ-namZ operon, which encodes the
  MurNAc PTS transporter and the MurNAc 6-phosphate etherase used to take up and
  catabolize the amino sugar MurNAc released by cell wall turnover (COR). The call is
  accurate and appropriately hedged on the evidence it saw (domains, STRING genomic
  context, distant HexR-like homologs). Its refusal to call the protein HexR is right,
  even though YbbH is slightly more identical to E. coli HexR (33%) than to E. coli MurR
  (27%); gene context, not identity, assigns it to MurR. The literature it did not see
  goes further than the call: B. subtilis murR deletion raises murQ promoter activity
  (PMID:30038046), so the protein is a repressor of this operon, and "transcription
  repressor" and the MurNAc operon target are now justified. The MurNAc 6-phosphate
  effector remains an inference from E. coli MurR. Recommended dashboard verdict:
  supported (slightly under-called relative to the literature, not to the evidence
  shown). Corrected annotation: "MurR (formerly YbbH), RpiR-family HTH/SIS
  transcriptional repressor of the murQ-murR-murP-amiE-nagZ-namZ MurNAc
  (peptidoglycan) recycling operon; effector probably MurNAc 6-phosphate, by analogy
  with E. coli MurR".
