    id: GO:0043610
    label: regulation of carbohydrate utilization
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Correct and not in GOA. ybbH (murR) lies in the murQ-murR-murP-amiE-nagZ-namZ
      operon, which encodes the MurNAc PTS transporter MurP and the MurNAc 6-phosphate
      etherase MurQ, and B. subtilis murR deletion increases murQ promoter activity
      (PMID:30038046). MurR therefore regulates the genes that take up and catabolize the
      amino sugar MurNAc, which fits regulation of carbohydrate utilization (MurNAc
      recovered from cell wall turnover under nutrient limitation, as cells enter
      stationary phase). The gene review adds the negative child, GO:0180068, as a NEW
      annotation. The more exact process, negative regulation of N-acetylmuramic
      acid catabolic process, has no GO term (GO has only the positive-regulation term
      GO:0160159). The dashboard reached this term from STRING genomic context rather
      than from the B. subtilis literature, but the term itself is right. The medium
      extractor confidence was appropriate for the evidence shown.
