- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct and already in GOA for Q45581 (IBA from the PANTHER RpiR/MurR family node
      and InterPro2GO IEA). The query has the HTH_RpiR winged-helix DNA-binding domain
      (residues 3-79) and the C-terminal SIS domain, the architecture of one-component
      RpiR-family repressors, and the characterized E. coli ortholog MurR binds operator
      DNA. B. subtilis murR deletion raises murQ promoter activity (PMID:30038046),
      which supports the more specific GO:0001217 DNA-binding transcription repressor
      activity proposed in the gene review. That child is not in GOA, so the prediction
      is CNN rather than LSP. The extractor declined to add a repressor term because the
      call text said "regulator"; that is faithful to the call.
    supported_by:
    - reference_id: PMID:30038046
      supporting_text: >-
        The results indicated that murR is a negative regulator since its deletion
        resulted in the stronger PmurQ activity
    - reference_id: PMID:18723630
      supporting_text: >-
        MurNAc-6-phosphate, the substrate of MurQ, was identified as a specific inducer
        that weakens binding of MurR to the operator.
