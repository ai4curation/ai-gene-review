references:
- id: file:BACSU/ybbH/ybbH-dashboard-prediction-evidence/dashboard_page.txt
  title: gene-annotate dashboard review page for NZ_CP017763.1_2226
  findings:
  - statement: The call rests on the domains and the STRING genomic context of ybbH.
    supporting_text: >-
      The 100%-identity STRING homolog ybbH associates strongly with murQ (963) and a PTS
      sugar transporter (923), supporting amino sugar utilization context.
  - statement: The call deliberately withheld the HexR and MurNAc-specific repressor
      assignments.
    supporting_text: >-
      A specific HexR assignment or N-acetylmuramic acid-specific repressor annotation
      is unsupported because distant homolog contexts and network associations do not
      establish those identities or regulatory mechanisms.
- id: file:BACSU/ybbH/ybbH-bioinformatics/RESULTS.md
  title: 'ybbH/murR (Q45581): sequence comparison with RpiR-family regulators and SubtiWiki
    record'
  findings:
  - statement: The dashboard sequence is the B. subtilis YbbH/MurR protein with an
      altered C-terminal tail.
    supporting_text: >-
      The dashboard sequence is 98.2% identical to Q45581 over 283 aligned columns.
  - statement: Sequence identity alone does not separate MurR from HexR.
    supporting_text: >-
      YbbH is about as similar to E. coli HexR (33.0%) as to E. coli MurR (27.0%); by
      pairwise identity alone it is slightly closer to HexR.
- id: PMID:30038046
  title: Cross Talk among Transporters of the Phosphoenolpyruvate-Dependent Phosphotransferase
    System in Bacillus subtilis.
  findings:
  - statement: B. subtilis MurR represses the murQ promoter.
    supporting_text: >-
      The results indicated that murR is a negative regulator since its deletion
      resulted in the stronger PmurQ activity
- id: PMID:20400549
  title: Muropeptide rescue in Bacillus subtilis involves sequential hydrolysis by beta-N-acetylglucosaminidase
    and N-acetylmuramyl-L-alanine amidase.
  findings:
  - statement: ybbH is the murR ortholog in the B. subtilis MurNAc cluster.
    supporting_text: >-
      The first three genes, ybbI , ybbH , and ybbF , are orthologs of the genes
      encoding the MurNAc-6-phosphate etherase ( murQ ), the MurNAc-6-phosphate-specific
      transcriptional repressor ( murR ), and the MurNAc-specific phosphotransferase
      system ( murP ) of E. coli
- id: PMID:27729505
  title: Peptidoglycan Recycling in Gram-Positive Bacteria Is Crucial for Survival in
    Stationary Phase.
  findings:
  - statement: murR (ybbH) lies in the MurNAc recycling cluster with murQ and murP.
    supporting_text: >-
      including murQ (formerly ybbI), murR (formerly ybbH), murP (formerly ybbF)
- id: PMID:18723630
  title: The transcriptional factors MurR and catabolite activator protein regulate
    N-acetylmuramic acid catabolism in Escherichia coli.
  findings:
  - statement: E. coli MurR is a DNA-binding repressor of MurNAc catabolism genes,
      induced by MurNAc 6-phosphate.
    supporting_text: >-
      MurNAc-6-phosphate, the substrate of MurQ, was identified as a specific inducer
      that weakens binding of MurR to the operator.
