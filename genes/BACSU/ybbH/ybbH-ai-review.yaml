- term:
    id: GO:1901135
    label: carbohydrate derivative metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001347
  - InterPro:IPR046348
  review:
    summary: >-
      InterPro2GO mapping from the SIS domain, a domain shared by sugar-phosphate
      isomerases (e.g. GlmS) and RpiR-family regulators. MurR has no catalytic activity;
      the MurNAc 6-phosphate etherase step in the pathway is performed by MurQ, and the
      transport step by MurP.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MurR does not carry out any step of carbohydrate derivative metabolism; it
      regulates expression of the enzymes that do. The SIS-domain mapping is appropriate
      for SIS enzymes but over-annotates SIS regulators. The regulatory role is captured
      by GO:0045892 and the proposed term "negative regulation of N-acetylmuramic acid
      catabolic process".
    supported_by:
    - reference_id: PMID:20400549
      supporting_text: The first three genes, ybbI , ybbH , and ybbF , are orthologs of
        the genes encoding the MurNAc-6-phosphate etherase ( murQ ), the
        MurNAc-6-phosphate-specific transcriptional repressor ( murR ), and the
        MurNAc-specific phosphotransferase system ( murP ) of E. coli
    - reference_id: file:BACSU/ybbH/ybbH-deep-research-claude-code.md
      supporting_text: MurR is a regulator rather than a metabolic enzyme, so this term
        over-reads its role.
- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: IMP
  original_reference_id: PMID:30038046
  qualifier: involved_in
  review:
    summary: >-
      Morabbi Heravi and Altenbuchner (2018) placed a murQ promoter-lacZ fusion at the
      amyE locus and compared wild type with a murR deletion strain. Deletion of murR
      increased murQ promoter activity, while the ptsA promoter was unaffected. Because
      the reporter is ectopic, the effect is in trans and not a polar effect on the
      operon. This is the only direct experimental evidence on B. subtilis MurR.
    action: NEW
    reason: >-
      Direct B. subtilis genetic evidence that MurR negatively regulates transcription
      from the murQ promoter. It does not show that the effect is direct (no DNA binding
      assay), so the MF repressor term rests partly on the HTH domain and on the E. coli
      ortholog.
    supported_by:
    - reference_id: PMID:30038046
      supporting_text: The results indicated that murR is a negative regulator since
        its deletion resulted in the stronger PmurQ activity
    - reference_id: PMID:30038046
      supporting_text: So far, most studies on this operon have concerned the catabolic
        enzymes, whereas the nature of its regulation by MurR remains unknown
- term:
    id: GO:0180068
    label: negative regulation of carbohydrate utilization
  evidence_type: IMP
  original_reference_id: PMID:30038046
  qualifier: involved_in
  review:
    summary: >-
      MurR represses the operon encoding the MurNAc PTS transporter MurP and the MurNAc
      6-phosphate etherase MurQ (PMID:30038046). In B. subtilis this pathway recovers
      MurNAc released by cell wall turnover, mainly during the transition to stationary
      phase and under nutrient limitation, when it prolongs starvation survival rather
      than supporting growth (PMID:27729505, PMID:31296364). That matches carbohydrate
      utilization in GO's sense of using alternative carbon sources once the primary
      source is depleted.
    action: NEW
    reason: >-
      Correct but general. It names the regulated process only as carbohydrate
      utilization; the exact process, negative regulation of N-acetylmuramic acid
      catabolic process, has no GO term and is requested below. Kept until that term
      exists.
    supported_by:
    - reference_id: PMID:30038046
      supporting_text: The results indicated that murR is a negative regulator since
        its deletion resulted in the stronger PmurQ activity
    - reference_id: PMID:31296364
      supporting_text: We showed, that these fragments are recovered during nutrient
        limitation, which prolongs starvation survival of Bacillus subtilis and
        Staphylococcus aureus.
