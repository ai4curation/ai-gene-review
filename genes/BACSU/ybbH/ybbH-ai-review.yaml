core_functions:
- description: >-
    Transcriptional repressor of the murQ-murR-murP-amiE-nagZ-namZ MurNAc recycling
    operon. Repression is shown genetically in B. subtilis; direct operator binding and
    release by a sugar-phosphate effector (probably MurNAc 6-phosphate, sensed by the SIS
    domain) are inferred from the HTH_RpiR and SIS domains and from E. coli MurR.
  molecular_function:
    id: GO:0001217
    label: DNA-binding transcription repressor activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  supported_by:
  - reference_id: PMID:30038046
    supporting_text: The results indicated that murR is a negative regulator since its
      deletion resulted in the stronger PmurQ activity
  - reference_id: PMID:20400549
    supporting_text: The first three genes, ybbI , ybbH , and ybbF , are orthologs of
      the genes encoding the MurNAc-6-phosphate etherase ( murQ ), the MurNAc-6-phosphate-specific
      transcriptional repressor ( murR ), and the MurNAc-specific phosphotransferase system
      ( murP ) of E. coli
  - reference_id: PMID:18723630
    supporting_text: MurNAc-6-phosphate, the substrate of MurQ, was identified as a specific
      inducer that weakens binding of MurR to the operator.
  knowledge_gaps:
  - gap_statement: >-
      The operator sequence, whether MurR binds it directly, and the effector that
      relieves repression in B. subtilis are unknown. MurNAc 6-phosphate is predicted by
      analogy with E. coli MurR but has not been tested, and YbbH is no more similar to
      E. coli MurR than to the HexR regulators, which sense a different sugar phosphate.
    gap_kind:
    - BIOLOGY
proposed_new_terms:
- proposed_name: negative regulation of N-acetylmuramic acid catabolic process
  proposed_definition: >-
    Any process that stops, prevents or reduces the frequency, rate or extent of
    N-acetylmuramic acid catabolic process.
  justification: >-
    GO has GO:0160159 positive regulation of N-acetylmuramic acid catabolic process but
    no negative (or unsigned) regulation term. MurR repressors in E. coli and B. subtilis
    repress the operons encoding the MurNAc PTS transporter MurP and the MurNAc
    6-phosphate etherase MurQ, so their process role is negative regulation of MurNAc
    catabolism. The nearest existing term, GO:0180068 negative regulation of
    carbohydrate utilization, is correct and is annotated here, but it does not name
    the regulated substrate. The new term would be a child of GO:0009895 and would
    regulate GO:0097173 N-acetylmuramic acid catabolic process; GO has no unsigned
    regulation term for this process either.
  proposed_parent:
    id: GO:0009895
    label: negative regulation of catabolic process
  supported_by:
  - reference_id: PMID:30038046
    supporting_text: The results indicated that murR is a negative regulator since its
      deletion resulted in the stronger PmurQ activity
  - reference_id: PMID:18723630
    supporting_text: In this way MurR represses transcription from the murQ promoter and
      also interferes with its own transcription.
suggested_questions:
- question: >-
    Should UniProt rename Q45581 from "Uncharacterized HTH-type transcriptional
    regulator YbbH" to "HTH-type transcriptional regulator MurR", given the gene name
    used in the literature and SubtiWiki and the murR deletion reporter data of
    PMID:30038046?
- question: >-
    Is B. subtilis MurR released by MurNAc 6-phosphate, as E. coli MurR is, or by
    another sugar phosphate? If MurNAc 6-phosphate is confirmed, GO:0141096
    ligand-modulated transcription repressor activity would be the appropriate MF.
- question: >-
    Does a phylogeny of COG1737 regulators place YbbH in the MurR clade with E. coli
    MurR, rather than the HexR clade, as gene context implies?
suggested_experiments:
- description: >-
    EMSA or DNase I footprinting of purified MurR on the murQ promoter region, with and
    without MurNAc 6-phosphate, GlcNAc 6-phosphate and other sugar phosphates, to define
    the operator and the effector.
  experiment_type: in vitro DNA binding
- description: >-
    murQ promoter-lacZ reporter in wild type and murR deletion strains during growth into
    stationary phase and with added MurNAc, in murQ and murP backgrounds, to test whether
    intracellular MurNAc 6-phosphate relieves repression in vivo.
  experiment_type: reporter assay
