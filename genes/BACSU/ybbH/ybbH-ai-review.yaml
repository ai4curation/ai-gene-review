taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  YbbH, now named MurR, is a cytoplasmic one-component transcriptional repressor of the
  RpiR (MurR/RpiR, COG1737) family. It has an N-terminal winged helix-turn-helix
  DNA-binding domain (HTH_RpiR, residues 3-79; crystal structure of residues 1-108, PDB
  2O3F) and a C-terminal SIS sugar-phosphate-binding domain (residues 123-264). The gene
  is the second gene of the murQ-murR-murP-amiE-nagZ-namZ (ybbI-ybbH-ybbF-ybbE-ybbD-ybbC)
  operon. This operon recovers N-acetylmuramic acid (MurNAc) from cell wall peptidoglycan
  turnover products: NagZ and AmiE release MurNAc from muropeptides outside the cell, the
  MurP PTS transporter takes it up as MurNAc 6-phosphate, and the MurQ etherase converts
  MurNAc 6-phosphate to GlcNAc 6-phosphate. Recycling occurs mainly at the transition to
  stationary phase and supports survival in late stationary phase. Deletion of murR
  increases activity of the murQ promoter in a lacZ reporter, so MurR represses the
  operon. By analogy with the E. coli ortholog MurR (YfeT), which binds an operator at
  the murQ promoter and is released by MurNAc 6-phosphate, B. subtilis MurR probably
  binds operator DNA directly and responds to MurNAc 6-phosphate via its SIS domain.
  Neither DNA binding, the operator, nor the effector has been shown for the B. subtilis
  protein, and its sequence identity to E. coli MurR (about 27%) is no higher than to
  the paralogous HexR regulators. Swiss-Prot still names the protein an "uncharacterized
  HTH-type transcriptional regulator".
