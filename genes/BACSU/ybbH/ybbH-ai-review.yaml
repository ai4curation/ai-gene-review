  - InterPro:IPR001347
  - InterPro:IPR046348
  - InterPro:IPR047640
  review:
    summary: >-
      InterPro2GO mapping from the SIS domain (residues 123-264). In RpiR-family
      regulators the SIS domain is the effector-sensing module that binds a sugar
      phosphate; in E. coli MurR the effector is MurNAc 6-phosphate. The effector of
      B. subtilis MurR has not been identified.
    action: KEEP_AS_NON_CORE
    reason: >-
      Binding of a phosphorylated sugar effector is the expected mechanism by which the
      SIS domain modulates repression, but it is untested for the B. subtilis protein, so
      it is kept as non-core rather than core. The broad term is as precise as the
      evidence allows: MurNAc 6-phosphate is the likely ligand by analogy with E. coli MurR, but
      it has not been tested for the B. subtilis protein, and GO has no MurNAc
      6-phosphate binding term.
    supported_by:
