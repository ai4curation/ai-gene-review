  review:
    summary: LhaT transfers a lipid-derived acetyl group to the N-terminal nitrogen of a diacylglyceryl
      lipoprotein.
    action: NEW
    reason: The only seeded row records localization, leaving a directly demonstrated molecular activity
      uncovered. Native deletion/complementation and an in vitro reaction using recombinant B. subtilis
      YpjA in E. coli membranes, lipid-generating enzymes and a fluorescent model lipopeptide support
      the activity; mass spectrometry confirms a +42-Da product. GO:0008080 is donor-agnostic and matches
      acetyl transfer to nitrogen. GO:0004596 is inappropriate because its defined donor is acetyl-CoA,
      whereas LhaT accepts the lipid-loaded acetyl group. The reconstitution used a C20 geranylgeranyl
      analogue and mixed mono/diacetylated donors; native C35 preference and donor regioselectivity were
      not resolved. This is target biochemical evidence, not a blanket transfer to the entire DUF1405/PTHR40042
      family; a B. anthracis member was experimentally inactive.
    supported_by:
    - reference_id: PMID:40626731
      supporting_text: the integral membrane protein YpjA to transfer the ester-linked acetyl group from
        Ac-HepG to an amide-linked bond with the α-amino termini of DA-LP substrates
