core_functions:
- description: Transfer of an acetyl group from acetylated HepG carrier lipid to the α-amino group of
    the N-terminal cysteine in a diacylglyceryl lipoprotein. The enzyme acts at the plasma membrane, with
    the extracytoplasmic reaction face inferred from the mature substrate and pathway model; direct use
    of acetyl-CoA is not asserted.
