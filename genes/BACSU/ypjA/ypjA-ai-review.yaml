      supporting_text: the Ac-CoA/YvoF/YpjA lipopeptide product was mass shifted by +42 Da
    - reference_id: PMID:40626731
      supporting_text: We substituted the commercially available geranylgeranyl pyrophosphate (GGPP) (four
        isoprenyl repeats) for the native heptaprenyl pyrophosphate (seven isoprenyl repeats) carrier
