  review:
    summary: LhaT is an integral plasma-membrane enzyme that acetylates extracellular-facing lipoprotein
      amino termini.
    action: ACCEPT
    reason: 'The curated UniProt membrane assignment is independently corroborated by the primary biochemical
      study: recombinant B. subtilis YpjA was recovered in E. coli membranes and supported lipopeptide
      acetylation, with native deletion/complementation confirming its pathway role. Transmembrane prediction
      supports an integral protein; the extracellular reaction face follows the accessibility of the mature
      Lsp-cleaved lipoprotein amino terminus and the proposed pathway, rather than a direct topology-mapping
      experiment. UniProt lists three predicted segments whereas the study predicts six helices; exact
      helix count is not needed to support plasma membrane.'
