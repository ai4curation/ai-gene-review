suggested_questions:
- question: Which native HepG acetylation state and regioisomer supplies LhaT most efficiently, and how
    is the carrier transported or flipped across the membrane?
suggested_experiments:
- description: Reconstitute LhaT in oriented proteoliposomes with purified native C35 monoacetyl and diacetyl
