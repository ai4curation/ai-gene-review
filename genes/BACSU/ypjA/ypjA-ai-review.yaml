taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: YpjA, also called LhaT, is an integral plasma-membrane lipoprotein N-acetyltransferase in
  Bacillus subtilis. It transfers an acetyl group from an acetylated heptaprenylglyceryl lipid carrier
  to the free N-terminal cysteine amino group of mature diacylglyceryl lipoproteins on the extracytoplasmic
  membrane surface. The acetylated lipid is supplied by PcrB-dependent ether-lipid synthesis and YvoF-mediated
  O-acetylation. LhaT uses the lipid acetyl donor rather than acetyl-CoA directly; the transport mechanism
  supplying the external carrier pool remains unknown.
