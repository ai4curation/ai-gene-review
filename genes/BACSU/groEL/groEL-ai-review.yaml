taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GroEL is the Hsp60-family chaperonin of Bacillus subtilis. Together with the heptameric GroES
  lid, its ATP-driven cage promotes folding of non-native proteins in the cytoplasm. It participates in
  protein homeostasis and the heat-shock response, including maintenance of the HrcA regulatory system.
  GroEL also accumulates outside cells during stationary phase through nonclassical release.
