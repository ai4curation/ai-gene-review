  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for ComK, the master transcriptional regulator of genetic competence
  in B. subtilis. Rank 1 is the review's core biological process and is absent from GOA - a genuinely
  useful addition to a three-term annotation set - but rank 2 immediately offers the opposite sign
  at only 0.57 units below. The free-text channel is instructive in a different way: its top hit (score
  22.94, the highest in the cohort) is 'Repressor of comK', i.e. the description of ComK's antagonist
  rather than of ComK itself. Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 nonparalog
  incorrect (NPI).
