  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 19.95) and absent from GOA, whose three IEA terms stop at DNA binding,
      DNA-templated transcription and the unsigned establishment of competence. This is exactly this
      review's core biological process: ComK binds K-box motifs as a tetramer and positively autoregulates
      to drive the bistable competence switch. Correct, correctly signed, specific and novel - one
      of ProTrek's best additions in the cohort. GO-GPT returned no non-UNC call for this gene.
