    summary: >-
      Rank 2 (score 19.38), the negative-regulation counterpart of the correct rank-1 call, 0.57 units
      behind it. ComK is the activator; its negative regulators are MecA-ClpCP and Rok. Returning
      both signs adjacent means the correct call at rank 1 is not distinguishable by score from its
      contradiction, and the free-text channel compounds this by ranking the ComK repressor's description
      first - so a user reading either channel could conclude ComK represses competence.
