id: P37870
gene_symbol: rpoB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  rpoB (BSU01070) encodes the beta subunit of Bacillus subtilis DNA-directed RNA polymerase.
  With beta-prime it forms the active-centre cleft of the core enzyme and takes part
  directly in RNA-chain synthesis; mutations in rpoB confer rifampicin resistance.
  The core associates with sigma factors to form promoter-specific holoenzymes, and
  stalled complexes are recycled by the helicase-like protein HelD.
