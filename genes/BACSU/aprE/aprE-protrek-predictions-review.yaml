    id: GO:0070051
    label: fibrinogen binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 13.37, the lowest top-1 score of any gene so far in this cohort). Fibrinogen
      binding is a documented property of nattokinase, the closely related subtilisin from B. subtilis
      natto, and subtilisin E has broad specificity for large uncharged residues, so the claim is
      not refutable. But it is not annotated for this protein, it is not among its core functions,
      and it describes a therapeutic curiosity rather than the enzyme's biological role in quorum-sensing
      pheromone processing and protein turnover. Recorded as uncertain.
