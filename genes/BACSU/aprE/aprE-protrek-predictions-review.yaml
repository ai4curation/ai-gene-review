    summary: >-
      Rank 2 (score 13.29). Envenomation terms describe a venomous organism injecting a toxin into
      another organism; B. subtilis is a soil bacterium with no venom apparatus. The term is the same
      one that was ProTrek's correct rank-3 call for snake venom fibrolase elsewhere in this cohort,
      which makes the pair a clean demonstration that retrieval matches the biochemistry (fibrinogen
      cleavage) without checking whether the organismal context that the term encodes is available
      at all.
