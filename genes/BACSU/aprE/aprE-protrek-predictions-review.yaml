id: P04189
gene_symbol: aprE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for subtilisin E, a major secreted alkaline serine protease of
  B. subtilis. The GO channel fails: its top five are fibrinogen binding, two snake-venom envenomation
  terms and a zymogen-inhibition term, at scores of 13.4 and below, and none of the annotated serine-endopeptidase
  biology appears. The free-text channel is correct at rank 1 ('Subtilisin is an extracellular alkaline
  serine protease... Has a high substrate specificity to fibrin'). The fibrin theme is not random
  - subtilisin-family enzymes such as nattokinase are genuinely fibrinolytic - but the retrieval carries
  it into snake-venom terms that cannot apply to a bacterium. Notably BioReason-SFT made the same
  fibrin-directed error on this gene (negative regulation of blood coagulation, scored NPI there),
  so two unrelated models are pulled the same way by subtilisin's fibrinolytic literature. Assessment:
  1 uncertain (UNC), 2 nonparalog incorrect (NPI).
