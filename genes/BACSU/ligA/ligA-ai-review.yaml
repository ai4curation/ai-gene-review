id: O31498
gene_symbol: ligA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: LigA is the NAD-dependent DNA ligase of Bacillus subtilis, formerly called YerG. It seals
  nicks by joining adjacent 3′-hydroxyl and 5′-phosphate termini in duplex DNA, supporting chromosome
  replication and DNA repair. NAD supplies the adenylate used during ligation. LigA is distinct from the
  organism’s ATP-dependent DNA ligases.
