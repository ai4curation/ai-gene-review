taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CheY is the soluble response regulator connecting the Bacillus subtilis chemotaxis
  kinase CheA to the flagellar switch. Phosphorylation at Asp54 promotes switch interactions
  and counterclockwise rotation associated with smooth swimming. CheY-P also contributes to
  CheC-CheD feedback at receptors and is dephosphorylated by the native phosphatases FliY and
  CheC. Its response to attractant differs in sign from that of Escherichia coli CheY.
