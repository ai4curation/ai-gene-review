suggested_experiments:
- hypothesis: Repeated CheY receiver phosphorylation and hydrolysis can support net phosphate drainage from CheA phosphohistidine beyond a single stoichiometric phosphotransfer event.
  description: Measure CheA-P disappearance, CheY-P formation and decay, and free phosphate release together under multiple-turnover conditions. Compare wild-type CheY with an Asp54 receiver mutant and no-CheY controls to distinguish phosphotransfer stoichiometry from sustained receiver-mediated net hydrolysis. These measurements would quantify the reaction without themselves deciding the GO annotation convention.
  experiment_type: Purified-protein phosphotransfer and phosphate-release kinetics
