  original_reference_id: PMID:25313396
  qualifier: involved_in
  review:
    summary: Retain the swarming context with its strain limitation.
    action: KEEP_AS_NON_CORE
    reason: The full publisher text of PMID25313396 includes this gene in the fla-che swarming
      panel (Figure 4). Constructs were introduced through PY79/DS2569 and tested in strain
      3610, not literal strain 168. Its conserved signaling or switch contribution supports
      the existing assignment; swarming is a contextual outcome, and this evidence does not
      make CheA or CheY structural assembly factors.
    supported_by:
    - reference_id: PMID:25313396
- term:
    id: GO:0101006
    label: protein histidine phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT3G04280
  - PANTHER:PTN001981629
  review:
    summary: Resolve net histidine-phosphate hydrolysis before judging this PAINT assertion.
    action: UNDECIDED
    reason: The frozen PAINT snapshot places GO:0101006 at PTHR43228 ancestral node PTN001981629
      with ARR22 evidence, and the lineage check finds no IRD/IKR loss. The GO definition describes
      the net hydrolysis of protein histidine phosphate. CheY accepts phosphate on Asp54 and
      subsequently loses it, so receiver-mediated phosphate drainage cannot be ruled out merely
      because the immediate intermediate is phosphoaspartate. The available Bacillus assays
      do not establish catalytic turnover on a protein phosphohistidine substrate or resolve
      the intended annotation convention. Neither a target-specific loss nor a categorical plant-only
      propagation defect is demonstrated.
    supported_by:
    - reference_id: PMID:8369293
      supporting_text: Loss of CheY function resulted in tumbling behavior in B. subtilis.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN001981629
        source_label: PTN001981629
        comment: The PTHR43228 paint.tsv snapshot places GO:0101006 here. No lineage IRD/IKR
          was found; the net-reaction interpretation remains unresolved.
      - source_id: AGI_LocusCode:AT3G04280
        source_label: ARR22
        comment: Recorded descendant evidence for the ancestral assertion. Source count and
          plant identity alone do not demonstrate an incorrect propagation.
