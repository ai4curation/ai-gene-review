- id: PMID:1447979
  title: Identification and characterization of FliY, a novel component of the Bacillus subtilis
    flagellar switch complex.
  findings:
  - statement: Cloned FliY contributes structurally to the switch, with complementation supporting
      this role.
    supporting_text: 'The homology, multiple phenotypes,

      and interspecies complementation suggest that FliY forms part of the B. subtilis

      switch complex.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The abstract explicitly separates rescued motility from fully normal chemotaxis
      and identifies FliY with the historical cheD complementation group. This is not the modern
      receptor deamidase CheD. Native phosphatase chemistry is established independently in
      PMID12920116.
