  original_reference_id: GO_REF:0000033
  review:
    summary: FliY accelerates hydrolysis of the motor-response regulator CheY-P.
    action: ACCEPT
    reason: FliY itself accelerates CheY-P hydrolysis in vitro and its CheY-P-binding-site perturbation
      changes rotational bias. This motor-associated phosphatase helps reset the activated response regulator
      at its site of action. CheC–CheD feedback and stimulation of CheC by CheD are distinct mechanisms
      and are not used as evidence for FliY catalysis.
    supported_by:
    - &id001
      reference_id: PMID:12920116
      supporting_text: We showed that FliY increases the rate of CheY-P hydrolysis in vitro.
    - &id003
      reference_id: PMID:14749334
      supporting_text: CheC appears to be primarily involved in restoring normal CheY-P levels following
        the addition of attractant, whereas FliY seems to act on CheY-P constitutively.
