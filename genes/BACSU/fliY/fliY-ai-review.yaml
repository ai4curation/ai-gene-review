  findings: []
- id: PMID:1447979
  title: Identification and characterization of FliY, a novel component of the Bacillus subtilis flagellar
    switch complex.
  findings:
  - statement: Cloned FliY contributes structurally to the switch, with complementation supporting this
      role.
    supporting_text: 'The homology, multiple phenotypes,

      and interspecies complementation suggest that FliY forms part of the B. subtilis

      switch complex.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The abstract explicitly separates rescued motility from fully normal chemotaxis and
      identifies FliY with the historical cheD complementation group. This is not the modern receptor
      deamidase CheD. Native phosphatase chemistry is established independently in PMID12920116.
- id: PMID:30455280
  title: Organization of the Flagellar Switch Complex of Bacillus subtilis.
  findings:
  - statement: Targeted cross-linking and interaction experiments support physical FliM/FliY assemblies
      within the switch ring.
    supporting_text: the middle domain of FliY, which forms an additional, more outboard array, and the
      C-terminal domains of FliM and FliY, which are organized into both FliY homodimers and FliM heterodimers.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text inspected, especially targeted cross-linking and BACTH Results
      and Methods. fliG/fliM/fliY constructs were amplified from strain3610; chromosomal constructions
      included PY79. The proposed overall architecture is a model constrained by physical-contact experiments,
      not a solved intact Bacillus C-ring structure. Conserved structural role is inferred for the168
      reference.
