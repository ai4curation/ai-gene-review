- id: PMID:25313396
  title: FlgM is secreted by the flagellar export apparatus in Bacillus subtilis
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached source remains abstract-only after normal force retry, but the publisher full
      article was inspected at https://journals.asm.org/doi/10.1128/jb.02324-14. Figure 4 includes this
      gene; strains are predominantly 3610 after construction through PY79/DS2569. FliY contributes to
      hook-basal-body completion; CheA and CheY are signaling proteins, not essential HBB structural components.
      The minimal requirements for FlgM secretion are not the requirements for flagellar assembly. No
      full-text quotation is fabricated in the abstract-only cache.
- id: PMID:14749334
  title: Bacillus subtilis CheC and FliY are members of a novel class of CheY-P-hydrolyzing proteins in
    the chemotactic signal transduction cascade.
  findings:
  - statement: The study distinguishes constitutive FliY CheY-P turnover from the adaptation-associated
      role of CheC.
    supporting_text: CheC appears to be primarily involved in restoring normal CheY-P levels following
      the addition of attractant, whereas FliY seems to act on CheY-P constitutively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cached abstract distinguishes FliY from CheC. CheD stimulation of CheC is not evidence
      for FliY; the FliY-specific turnover/behavior statements are used instead.
