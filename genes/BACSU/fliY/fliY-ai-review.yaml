suggested_questions:
- question: How do the relative in vivo contributions of FliY phosphohydrolysis and CheC-CheD
    feedback change across attractants and adaptation states?
suggested_experiments:
- description: Compare motor-proximal CheY-P decay and switching in phosphatase-selective FliY
    mutants and CheC interaction mutants while monitoring intact flagellar assembly.
  hypothesis: Signal reset by FliY can be separated from CheC-dependent receptor feedback and
    from the structural contribution of the C-ring.
