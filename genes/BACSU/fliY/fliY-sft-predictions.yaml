description: BioReason-Pro SFT predictions for Bacillus subtilis FliY are supported for CheY-P
  phosphatase activity, dephosphorylation, flagellar assembly, swimming and contextual swarming, and
  cytoplasmic/basal-body localization. Five predictions are CNN, one COR, one LSP and two NPI.
  Assembly and swarming evidence includes strain 3610 experiments and conserved-role inference to
  reference 168. The two raw ID/label mismatches are judged by their supplied GO IDs and retained
  unchanged.
