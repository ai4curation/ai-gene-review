  source_version: wanglab/protein_catalogue
  source_reference_id: doi:10.64898/2026.03.19.712954
  predicted_term:
    id: GO:0030428
    label: cell septum
  predicted_term_type: GO_CC
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      The specific cell-septum assignment is inconsistent with the established flagellar-switch compartment
      and architecture of FliY. Primary switch-organization experiments identify FliY/FliM assemblies
      and flagellum-dependent membrane association, rather than a septal structure (PMID:30455280).
      The comparative FliY study PMID:23532838 explicitly places FliY in the flagellar switch; its
      Thermotoga structural work is not presented as a new Bacillus localization experiment. The
      focused OpenScientist report integrates these observations with CheC/FliN-related domain assignments
      and a flagellar interaction neighborhood; those computations support the mechanistic assignment
      but are not independent localization experiments or exhaustive proof against every possible secondary
      localization. No examined primary source establishes septal residence. NPI reflects the unsupported
      substitution of the division septum for the demonstrated flagellar structure; the particular model-error
      mechanism is unknown.
    supported_by:
    - *id004
    - &id005
      reference_id: PMID:30455280
      supporting_text: Cross-linked FliY dimers occurred in both the membrane and soluble fractions
        in the cells assembling flagella but were almost exclusively in the soluble fraction of the
        nonflagellate Δ fliM ΔfliY cells
    - reference_id: PMID:23532838
      supporting_text: Unlike CheC and CheX, FliY is localized in the flagellar switch complex, which also contains the stator-coupling protein FliG and the target of CheY-P, FliM.
