    label: bacterial-type flagellum-dependent swarming motility
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: FliY supplies the flagellar switch structure and motor-signal reset used during surface
      swarming. PMID:25313396 Figure 4 includes the fliY mutant DS5384 in the swarming-defect panel,
      while PMID:30455280 identifies its physical switch contribution; the judgment therefore does
      not rest on necessity alone. Swarming is a specific contextual motility process, not a
      less-precise version of general motility regulation. The experiment is in strain 3610, with
      constructs passed through PY79/DS2569; inference to reference 168 concerns the conserved FliY
      protein role and does not assert that unmodified 168 was observed to swarm. The term already
      has an IMP annotation, so the supported contextual prediction is CNN.
    supported_by:
    - reference_id: file:BACSU/fliY/fliY-notes.md
      supporting_text: Mutations in the fla-che operon abolish swarming motility.
