id: P24073
gene_symbol: fliY
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for FliY, the bifunctional flagellar motor switch protein and
  CheY-P phosphatase of B. subtilis. The top three calls are all correct and two are novel: the C-ring
  localisation that this review assigns as the core location is absent from GOA, and the swimming-motility
  refinement matches the term BioReason-SFT independently scored COR on this same gene. The one thing
  the model does not recover is the phosphatase activity - the review's primary molecular function,
  and the property that distinguishes FliY from the plain structural FliN that ProTrek's free-text
  channel returns. Assessment: 2 correct novel (COR), 1 correct not novel (CNN).
