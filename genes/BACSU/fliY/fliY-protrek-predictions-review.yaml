    summary: >-
      Top-ranked hit (score 15.24) and absent from GOA, which carries no cellular-component annotation
      for this protein. The C ring of the flagellar basal body is exactly where this review places
      FliY, integrated via its FliN-like C-terminal domain. Correct, specific and novel - it supplies
      the missing localisation for an otherwise well-annotated protein.
