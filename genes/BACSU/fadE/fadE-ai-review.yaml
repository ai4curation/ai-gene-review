  review:
    summary: FadE acyl-CoA oxidation is supported; the ETF-specific reaction remains incompletely resolved.
    action: UNDECIDED
    reason: GO:0003995 explicitly specifies ETF as electron acceptor. Native yusJ and etfA/B disruption
      phenotypes support an ETF-linked pathway hypothesis, but PMID:17189250 does not measure purified
      FadE-to-ETF transfer. The PAINT loss check found no IRD/IKR; this is uncertainty about reaction
      specificity, not a claimed evolutionary loss or a rejection based on donor number. Both IBA and
      InterPro claims receive the same judgment.
    supported_by:
