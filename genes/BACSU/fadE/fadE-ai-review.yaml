  review:
    summary: Native genetics and enzyme/ETF homology support inferred ETF-linked FadE activity.
    action: ACCEPT
    reason: Accept the shared acyl-CoA dehydrogenase claim as a mechanistic inference, rather than requiring
      purified reconstitution for every accepted activity. Native yusJ/fadE and etfA/etfB disruptions
      produce convergent YsiA-regulon derepression interpreted as upstream acyl-CoA accumulation, as well
      as palmitate-utilization defects. Together with the enzyme/ETF identities and inherited family evidence,
      this supports an ETF-linked acyl-CoA-dehydrogenation system in strain168. Direct transfer between
      purified cognate proteins remains unmeasured, and palmitate utilization does not define the isolated
      enzyme chain-length profile. This target-specific inference does not resolve the distinct enterobacterial
      or PAO1 electron relay.
    supported_by:
    - reference_id: file:BACSU/fadE/fadE-uniprot.txt
      supporting_text: Reaction=a 2,3-saturated acyl-CoA + A = a 2,3-dehydroacyl-CoA + AH2;
    - reference_id: file:BACSU/fadE/fadE-source-analysis/primary-scope.md
      supporting_text: IPTG induces downstream genes to mitigate insertion polarity.
    - &id001
      reference_id: PMID:17189250
      supporting_text: the knock-out of acyl-CoA dehydrogenation through yusJ, etfA, or etfB disruption
        resulted in YsiA inactivation
    propagation_review:
      root_cause: UNRESOLVED
