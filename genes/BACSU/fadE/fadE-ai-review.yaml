  label: Bacillus subtilis subsp. subtilis str. 168
description: FadE (YusJ) is a FAD-dependent acyl-CoA dehydrogenase contributing to fatty-acid beta-oxidation
  in Bacillus subtilis 168. It participates in an ETF-linked degradation system and contributes to palmitate
  utilization. Its expression is controlled by FadR.
