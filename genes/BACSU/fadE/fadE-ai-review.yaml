id: O32176
gene_symbol: fadE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: FadE (YusJ) is a FAD-dependent acyl-CoA dehydrogenase contributing to fatty-acid beta-oxidation
  in Bacillus subtilis 168. Native genetic evidence links it to palmitate utilization and an ETF-dependent
  pathway; the exact electron-transfer partner of the isolated enzyme remains unresolved. Its expression
  is controlled by FadR.
