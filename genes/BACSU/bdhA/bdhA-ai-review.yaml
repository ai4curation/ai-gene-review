gene_symbol: bdhA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: BdhA, formerly YdjL, is the major acetoin reductase/2,3-butanediol dehydrogenase of Bacillus
  subtilis. The zinc-containing enzyme catalyzes NADH-dependent reduction of (R)-acetoin to (R,R)-2,3-butanediol
  and the reverse NAD+-dependent oxidation. It acts in the cytoplasm during oxygen-limited fermentation;
  loss of bdhA abolishes detectable acetoin reductase/butanediol dehydrogenase activity and early stationary-phase
  butanediol production. A pool of the protein also accumulates extracellularly during stationary phase.
