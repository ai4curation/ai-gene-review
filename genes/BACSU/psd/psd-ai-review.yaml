id: P39822
gene_symbol: psd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  psd encodes the phosphatidylserine decarboxylase of Bacillus subtilis, a
  pyruvoyl-dependent enzyme made as a proenzyme that is processed into two
  chains. It decarboxylates phosphatidylserine to phosphatidylethanolamine,
  the second and final step of phosphatidylethanolamine synthesis after the
  integral-membrane phosphatidylserine synthase PssA, whose gene lies just
  upstream. The enzyme is located in the cytoplasmic membrane, concentrated
  at the septum. A psd null mutant has no phosphatidylethanolamine,
  accumulates phosphatidylserine and remains viable, with increased
  glucolipid content.
