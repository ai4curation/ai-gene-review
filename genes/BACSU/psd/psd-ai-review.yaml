proposed_new_terms: []
suggested_questions:
- question: >-
    How does B. subtilis compensate for the complete loss of
    phosphatidylethanolamine in psd and pss null mutants, and is the
    glucolipid increase the compensating change?
suggested_experiments:
- description: >-
    Compare growth, membrane protein function and septal lipid domains in a
    psd null mutant and in a psd mutant also lacking glucolipid synthesis to
    test whether glucolipids substitute for phosphatidylethanolamine.
