taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: Bacillus subtilis ProB is a soluble cytoplasmic glutamate 5-kinase that transfers phosphate
  from ATP to L-glutamate, producing L-glutamyl 5-phosphate for the first step of proline biosynthesis.
  ProB supplies the kinase step of the anabolic branch; the separate ProJ paralog supplies the osmotically
  induced branch.
