taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: OpuCB is the integral membrane translocation subunit of the Bacillus subtilis OpuC ABC
  importer. The assembled transporter acquires glycine betaine, choline, carnitine and choline-O-sulfate
  for osmoprotection. OpuC comprises the OpuCA ATPase, the OpuCB and OpuCD membrane proteins, and
  the OpuCC substrate-binding protein. Imported choline-O-sulfate accumulates intact as a compatible
  solute under the conditions studied, whereas imported choline can be converted to glycine betaine
  by separate enzymes.
