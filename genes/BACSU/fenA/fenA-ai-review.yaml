taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: FenA, also called YpcP or ExoR, is a standalone 5-prime flap endonuclease and 5-prime-to-3-prime
  nuclease in Bacillus subtilis. It cleaves RNA-DNA and DNA flap intermediates and preferentially removes
  primer RNA during lagging-strand Okazaki fragment maturation. Its nuclease function overlaps partly
  with PolA, while RnhC can provide an alternative internal RNA-incision step. FenA has no DNA polymerase
  activity.
