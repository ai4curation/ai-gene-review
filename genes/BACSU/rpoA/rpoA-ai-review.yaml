    summary: Alpha dimerization nucleates RNAP core assembly.
    action: NEW
    reason: >-
      UniProt-curated, experimentally referenced statement that alpha dimerization
      is the first step of the sequential assembly of RNAP. The alpha subunit does
      structural work in this process (it is the platform the other subunits bind),
      so it is a participant, not a substrate.
