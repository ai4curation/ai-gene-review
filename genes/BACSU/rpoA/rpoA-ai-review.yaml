id: P20429
gene_symbol: rpoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  rpoA (BSU01430) encodes the alpha subunit of Bacillus subtilis DNA-directed RNA
  polymerase. Two alpha subunits form the dimeric platform on which beta and beta-prime
  assemble into the alpha2 beta beta' core, which in B. subtilis also carries the
  Firmicutes-specific delta and epsilon subunits and omega. The alpha N-terminal domain
  mediates dimerization and assembly, and the C-terminal domain contacts upstream
  promoter elements and transcription regulators such as CcpA and Spx. Alpha does
  not contribute active-site residues.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011260
  - InterPro:IPR011773
  - UniRule:UR000076114
  review:
    summary: Alpha binds promoter DNA through its C-terminal domain (UP elements).
    action: MODIFY
    reason: >-
      Correct but general. The alpha C-terminal domain binds UP elements, AT-rich
      promoter DNA upstream of the -35 hexamer, which is transcription cis-regulatory
      region binding (GO:0000976, an is_a descendant of DNA binding). The specific
      term is proposed as the replacement; it remains non-core to alpha's assembly
      role.
    proposed_replacement_terms:
    - id: GO:0000976
      label: transcription cis-regulatory region binding
    supported_by:
    - reference_id: file:BACSU/rpoA/rpoA-uniprot.txt
      supporting_text: >-
        the C-terminal domain is involved in interaction with transcriptional regulators
        and with upstream promoter elements.
      record_section:
      - CC:DOMAIN
