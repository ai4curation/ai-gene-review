suggested_questions:
- question: >-
    B. subtilis GOA carries EXP rows for 5'-3' RNA polymerase activity (GO:0034062)
    on every core subunit, including the non-catalytic alpha and omega, from assays
    of the whole enzyme (PMID:33339820, PMID:18289874, PMID:6802805). Should such
    whole-enzyme activity assays be attributed only to the beta and beta-prime active-centre
    subunits, with alpha and omega annotated to complex membership and assembly instead?
