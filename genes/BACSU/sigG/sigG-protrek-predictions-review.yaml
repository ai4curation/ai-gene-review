  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0042763
    label: intracellular immature spore
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 15.89), the same term that leads sigF and sigK. Sigma-G acts in the forespore,
      so the compartment is at least consistent for this member of the trio, but the term denotes
      the spore structure rather than a transcription factor's location and GOA has no cellular-component
      annotation here. Uncertain, and uninformative for discriminating the paralogs.
    supported_by:
