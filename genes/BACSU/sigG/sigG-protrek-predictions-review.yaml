id: P19940
gene_symbol: sigG
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for sigma-G, the late forespore-specific sporulation sigma factor.
  Its top five is effectively identical to sigF's and sigK's - intracellular immature spore, sporulation,
  a sporulation regulation or refinement term - with no call that distinguishes late forespore transcription
  from early forespore or mother-cell transcription, and with sigma factor activity absent from the
  whole top five despite being annotated by IBA and IEA. The three-way paralog collapse is the clearest
  single result for this cohort. Assessment: 1 less precise (LSP), 2 uncertain (UNC).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/BACSU/sigG/sigG-uniprot.txt
- genes/BACSU/sigG/sigG-goa.tsv
