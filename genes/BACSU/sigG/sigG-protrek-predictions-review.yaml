    label: positive regulation of sporulation resulting in formation of a cellular spore
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 15.35) and absent from GOA; the same call and the same reasoning as sigF's rank
      3. Sigma-G auto-stimulates its own transcription and drives late forespore gene expression,
      so a positive contribution to sporulation is defensible, but the term is generic and the model
      gives no sign that it distinguishes sigma-G from sigma-F. Uncertain.
    supported_by:
