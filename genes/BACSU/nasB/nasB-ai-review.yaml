gene_symbol: nasB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: NasB is the flavin-containing electron-transfer component of the Bacillus subtilis 168 assimilatory
  nitrate reductase NasBC. Its dinucleotide-binding and iron-sulfur regions deliver reducing equivalents
  to the molybdenum-containing catalytic subunit NasC, enabling nitrate reduction to nitrite. The system
  is described as NADH dependent. NasB is related to nitrite-reductase large subunits but lacks the characteristic
  siroheme-associated motif and functions in nitrate assimilation.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005117
  - InterPro:IPR006067
  - InterPro:IPR023753
  - InterPro:IPR036136
  review:
    summary: NasB supplies electron transfer to the NasBC nitrate reductase.
    action: MODIFY
    reason: The generic oxidoreductase claim can be resolved to its contribution to nitrate reductase
      activity. NasC supplies the molybdenum catalytic site; NasB is a required electron-transfer component,
      not an independently demonstrated nitrate catalyst.
    supported_by:
    - reference_id: PMID:9765565
      supporting_text: Our previous results showed that nitrate reductase encoded by nasB and nasC located
        upstream of the nasD gene functions only in nitrate assimilation during aerobic growth (3, 17).
    - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC94119/
      supporting_text: 'In B. subtilis, the nasBC genes code for the NADH-nitrate reductase: NasB is a
        diaphorase with NADH- and FAD-binding domains, and NasC is the catalytic subunit.'
    proposed_replacement_terms:
    - id: GO:0008940
      label: nitrate reductase activity
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006067
  review:
    summary: The heme-binding mapping does not fit specialized NasB.
    action: REMOVE
    reason: The native primary sequence analysis distinguishes NasB from NasD by the absence of the conserved
      siroheme-associated motif. Together with its nitrate-reductase electron-transfer role, this argues
      against transferring heme binding from the broad nitrite/sulfite-reductase domain IPR006067. This
      is a target-specific motif and function conflict, not rejection based on a name.
    supported_by:
    - reference_id: file:BACSU/nasB/nasB-source-analysis/native-nas-system.md
      supporting_text: NasB resembles nitrite reductases but lacks the conserved siroheme-associated cysteine
        motif present in NasD.
    - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC94119/
      supporting_text: 'In B. subtilis, the nasBC genes code for the NADH-nitrate reductase: NasB is a
        diaphorase with NADH- and FAD-binding domains, and NasC is the catalytic subunit.'
