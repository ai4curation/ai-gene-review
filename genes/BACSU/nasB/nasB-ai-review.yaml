- term:
    id: GO:0098809
    label: nitrite reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012744
  review:
    summary: NasB specializes in nitrate-reductase electron transfer rather than nitrite reduction.
    action: REMOVE
    reason: Native experiments assign nitrite reduction to NasDE and nitrate assimilation to NasBC. NasB
      lacks the siroheme-associated motif characteristic of the catalytic nitrite-reductase region. The
      IPR012744 family-level substrate mapping is therefore inappropriate for this specialized member;
      this decision does not depend on independent-subunit catalysis.
    supported_by:
    - reference_id: file:BACSU/nasB/nasB-source-analysis/native-nas-system.md
      supporting_text: NasB resembles nitrite reductases but lacks the conserved siroheme-associated cysteine
        motif present in NasD.
    - reference_id: PMID:9765565
      supporting_text: Our previous results showed that nitrate reductase encoded by nasB and nasC located
        upstream of the nasD gene functions only in nitrate assimilation during aerobic growth (3, 17).
    - reference_id: PMID:9765565
      supporting_text: However, extracts prepared from LAB1943 and LAB1982 grown with nitrite or ammonium
        in the presence of IPTG had no significant nitrite reductase activity, indicating that both nasD
        and nasE genes are required for enzyme activity.
