  review:
    summary: >-
      Bare protein binding of the beta-prime subunit reported by IPI (PMID:19940246;
      WITH UniProtKB:C0H3R4).
    action: REMOVE
    reason: >-
      Generic protein binding carries no functional information. The reported interaction
