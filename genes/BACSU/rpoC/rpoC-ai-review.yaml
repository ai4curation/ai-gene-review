        source_status: SUPPORTS_TRANSFER
        comment: >-
          The pan-domain RNA polymerase complex claim at this node is sound and E.
          coli beta-prime is inside the clade; the node term is necessarily the domain-neutral
          parent, and the bacterial child GO:0000345 is the correct level for this
          member.
