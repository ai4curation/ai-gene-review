  review:
    summary: >-
      The beta-prime subunit forms the RNAP active-centre cleft with its partner large
      subunit and takes part directly in nucleotide addition.
    action: ACCEPT
    reason: >-
      The contributes_to qualifier is exactly right: beta and beta-prime together
      build the catalytic centre (beta-prime carries the catalytic Mg(2+) site, beta
      the RNA-DNA hybrid and NTP-contacting surfaces), so neither is active alone
      but both directly execute the reaction of the assembled enzyme. This is the
      core function of the subunit; the core_functions entry records contribution
      semantics.
    supported_by:
