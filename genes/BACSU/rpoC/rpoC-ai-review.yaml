id: P37871
gene_symbol: rpoC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  rpoC (BSU01080) encodes the beta-prime subunit, the largest subunit of Bacillus
  subtilis DNA-directed RNA polymerase. Beta-prime forms the active-centre cleft with
  beta and carries the catalytic Mg(2+) site and two structural Zn(2+) sites, so it
  takes part directly in nucleotide addition by the core enzyme.
