  review:
    summary: >-
      Pan-domain IBA placing beta-prime in a DNA-directed RNA polymerase complex.
    action: MODIFY
    reason: >-
      Correct but general: the PAINT node is pan-domain (bacterial, archaeal and eukaryotic
      RNAPs). For a bacterial beta-prime subunit the specific child term GO:0000345
      cytosolic DNA-directed RNA polymerase complex, which GO defines as the eubacterial
      alpha2 beta beta' omega enzyme, is supported and already carried by this gene.
    proposed_replacement_terms:
