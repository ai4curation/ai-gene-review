- term:
    id: GO:0120530
    label: UDP-alpha-D-glucose biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:15640167
  qualifier: involved_in
  review:
    summary: >-
      PgcA catalyses the first step of UDP-glucose synthesis in B. subtilis
      (glucose 6-phosphate to alpha-glucose 1-phosphate), immediately upstream of GtaB.
      Loss of PgcA activity phenocopies gtaB loss: phage resistance from missing wall
      teichoic acid glucosylation, impaired biofilm formation, and Mg2+-reversible cell
      deformation.
    action: NEW
    reason: >-
      Participation test: PgcA catalyses a step of the pathway (it produces GtaB's
      substrate), so it does part of the work of UDP-glucose biosynthesis. Comparator check:
      dedicated phosphoglucomutases in other organisms carry UDP-glucose metabolism
      process terms (S. cerevisiae PGM2 has GO:0006011 by IGI), and E. coli Pgm is given
      the same NEW annotation in this project. This is PgcA's principal physiological role.
    additional_reference_ids:
    - PMID:31589605
    supported_by:
    - reference_id: PMID:15640167
      supporting_text: Since PgcA and GtaB catalyze successive steps in UDP-Glc synthesis
    - reference_id: PMID:31589605
      supporting_text: PgcA catalyzes the first step in UDP-glucose (UDP-Glc) biosynthesis, the conversion of Glc-6-P to Glc-1-P
- term:
    id: GO:0008966
    label: phosphoglucosamine mutase activity
  evidence_type: IDA
  original_reference_id: PMID:31589605
  qualifier: enables
  review:
    summary: >-
      Patel et al. (2019) purified PgcA and showed in vitro that it isomerizes glucosamine
      1-phosphate with a catalytic efficiency of about 9.4 mM-1 s-1, about 20-fold below
      its phosphoglucomutase activity. Genetically, pgcA is synthetically lethal with glmR
      unless GlmM is overproduced, and the PgcA G47S substrate-loop variant raises this
      activity about 4-fold and suppresses glmR phenotypes.
    action: NEW
    reason: >-
      Direct biochemical demonstration with purified protein, backed by genetic evidence
      that the activity contributes to peptidoglycan precursor supply in vivo. It is a
      secondary, moonlighting activity and does not replace the essential GlmM, so it is
      recorded as a non-core NEW molecular function.
    supported_by:
    - reference_id: PMID:31589605
      supporting_text: However, even native PgcA (with G47) has PNGM activity (~20-fold lower than PGM activity), and our results demonstrate that this functions in support of PG synthesis.
    - reference_id: PMID:31589605
      supporting_text: Correspondingly, the PgcA G47S protein had a >4-fold increase in catalytic efficiency (kcat/KM) in the PNGM reaction relative to the PgcA protein
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:15640167
  qualifier: located_in
  review:
    summary: >-
      Alpha-PGM activity attributable to PgcA is recovered in the soluble fraction of B.
      subtilis cell extracts (lost in pgcA point mutants), and the protein has no signal
      peptide or transmembrane segment.
    action: NEW
    reason: >-
      No cellular-component annotation exists for PgcA. The soluble-extract activity,
      lost in pgcA mutants, places the enzyme in the cytoplasm, consistent with its role
      in synthesizing a cytoplasmic nucleotide-sugar precursor. Cytoplasm rather than
      cytosol is used because the evidence is a soluble-fraction assay, not a
      localization study.
    supported_by:
    - reference_id: PMID:15640167
      supporting_text: Backcrossing of the two mutations into the 168 reference strain was accompanied by impaired α-phosphoglucomutase activity in the soluble cell extract fraction
core_functions:
- description: >-
    Alpha-phosphoglucomutase that converts glycolytic glucose 6-phosphate into
    alpha-D-glucose 1-phosphate in the cytoplasm, supplying GtaB for UDP-glucose
    synthesis. UDP-glucose is the glucosyl donor for the diglucosyl-diacylglycerol
    glycolipid (lipoteichoic acid anchor) and for wall teichoic acid glucosylation, and
    it is the nutrient signal for UgtP-mediated cell-size control.
