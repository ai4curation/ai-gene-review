id: P18159
gene_symbol: pgcA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  PgcA (formerly YhxB; mutant alleles gtaC and gtaE) is the alpha-phosphoglucomutase of
  Bacillus subtilis, a 581-residue cytoplasmic member of the alpha-D-phosphohexomutase
  superfamily (PANTHER PTHR45745, the PGM2-like phosphohexose/phosphopentose mutase
  family). It catalyses the Mg2+-dependent, reversible interconversion of glucose
  6-phosphate and alpha-D-glucose 1-phosphate through a phosphoserine (Ser146)
  intermediate activated by glucose 1,6-bisphosphate. In vivo PgcA links glycolysis to
  envelope biosynthesis: it supplies the alpha-glucose 1-phosphate that GtaB converts to
  UDP-glucose, which is the glucosyl donor for the diglucosyl-diacylglycerol membrane
  glycolipid (made by UgtP/YpfP and used as the lipoteichoic acid anchor), for
  glucosylation of the major wall teichoic acid and for the minor glucosyl-GalNAc wall
  teichoic acid. pgcA mutants lack alpha-phosphoglucomutase activity in soluble
  extracts, resist phages phi29, rho11 and SPP1 (which need glucosylated wall teichoic
  acid), form shiny colonies, show Mg2+-reversible deformed cell shape, are defective in
  biofilm formation and are smaller in rich medium, as UDP-glucose is the nutrient
  signal sensed by the UgtP-FtsZ cell-size pathway. Purified PgcA also has a
  phosphoglucosamine mutase activity about 20-fold lower than its phosphoglucomutase
  activity; this secondary activity supports peptidoglycan precursor synthesis and
  becomes essential when GlmR is absent.
