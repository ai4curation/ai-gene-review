suggested_questions:
- question: >-
    Does PgcA have measurable phosphopentomutase activity on ribose 1-phosphate or
    2-deoxyribose 1-phosphate, and if so, does it contribute to nucleoside catabolism in
    B. subtilis alongside the dedicated phosphopentomutase? The answer decides whether
    the PTHR45745 root-node phosphopentomutase IBD should be pruned for the bacterial
    SF1 branch.
- question: >-
    Is the phosphoglucosamine mutase side activity conserved across Firmicute PgcA
    orthologs, for example the Staphylococcus aureus PgcA members of the same subfamily,
    and does it matter under gluconeogenic growth?
suggested_experiments:
- description: >-
    Assay purified PgcA with alpha-D-glucose 1-phosphate, ribose 1-phosphate,
    2-deoxyribose 1-phosphate, glucosamine 1-phosphate and mannose 1-phosphate (with
    glucose 1,6-bisphosphate activation) to obtain a full substrate-specificity profile,
    and measure ribose 1-phosphate pools in pgcA and phosphopentomutase single and double
    mutants after nucleoside feeding.
  experiment_type: enzyme kinetics and metabolomics
