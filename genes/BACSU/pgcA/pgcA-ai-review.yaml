      gtaC and gtaE alpha-PGM-deficient mutations map to pgcA (yhxB); pgcA is the
      structural gene of alpha-PGM, and its loss impairs UDP-glucose-dependent envelope
      functions, biofilm formation and cell morphology.
    supporting_text: demonstrated that pgcA is the structural gene of α-PGM
  - statement: >-
      Lipoteichoic acid poly(glycerol phosphate) levels are not reduced in pgcA, gtaB or
      ypfP mutants, so LTA is presumably anchored on unsubstituted diacylglycerol when
      the glycolipid is missing.
    supporting_text: The level of the poly(Gro-P) moiety of LTA was not affected in the pgcA- , gtaB- , and ypfP -deficient mutants
