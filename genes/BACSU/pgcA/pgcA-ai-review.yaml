  supporting_entities:
  - UniPathway:UPA00894
  review:
    summary: >-
      UniPathway-to-GO mapping of UPA00894. In the UniProt entry, UPA00894 corresponds to
      the curated PATHWAY statement "Glycolipid metabolism; diglucosyl-diacylglycerol
      biosynthesis" (Lazarevic et al. 2005), yet it surfaces as enterobacterial common
      antigen (ECA) biosynthesis. ECA is an outer-membrane glycolipid restricted to
      Enterobacterales; Gram-positive B. subtilis has no outer membrane and no ECA genes.
    action: MODIFY
    reason: >-
      The underlying pathway assignment is sound and experimentally supported: PgcA
      catalyses the first of three consecutive steps (PgcA, GtaB, UgtP/YpfP) in synthesis
      of diglucosyl-diacylglycerol, the major membrane glycolipid and lipoteichoic acid
      anchor. The GO term is wrong for this organism and arises from the UniPathway
      mapping, so the annotation is redirected to GO:0009247 glycolipid biosynthetic
      process. The defect is recorded for upstream correction.
    proposed_replacement_terms:
    - id: GO:0009247
      label: glycolipid biosynthetic process
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: GO:0009246
      corrected_value: GO:0009247
      corrected_label: glycolipid biosynthetic process
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        P18159 (B. subtilis PgcA) carries DR UniPathway UPA00894, which matches its curated
        PATHWAY comment (glycolipid metabolism; diglucosyl-diacylglycerol biosynthesis),
        but the UniPathway-to-GO mapping emits GO:0009246 enterobacterial common antigen
        biosynthetic process. B. subtilis is a Gram-positive bacterium lacking ECA. Either
        UPA00894 is mis-mapped in unipathway2go or the UniPathway cross-reference is
        wrong; a glycolipid biosynthesis term (GO:0009247) fits the curated pathway.
      supported_by:
