- term:
    id: GO:0006166
    label: purine ribonucleoside salvage
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001860097
  - SGD:S000004891
  review:
    summary: >-
      PAINT IBA placed at the PTHR45745 root node PTN001860097, seeded only by S.
      cerevisiae PRM15/PGM3 (SGD:S000004891), the major yeast phosphoribomutase that
      recycles ribose 1-phosphate from nucleoside breakdown. There is no B. subtilis
      evidence connecting PgcA to purine nucleoside salvage; all PgcA phenotypes and
      biochemistry concern glucose 1-phosphate supply for UDP-glucose and, secondarily,
      glucosamine 1-phosphate for peptidoglycan.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Node-placement argument. The process was inferred from a single fungal member of
      subfamily SF1 whose in vivo role reflects a lineage-specific shift in substrate
      preference: yeast Pgm3/PRM15 and the dedicated phosphoglucomutase Pgm2 have similar
      kinetics on ribose 1-phosphate, but Pgm2 prefers glucose 1-phosphate 2000-fold more
      than Pgm3, and only pgm3 deletion causes ribose 1-phosphate accumulation. Ribose
      1-phosphate mutase chemistry is therefore a shared, low-level property of
      phosphohexomutases, and which enzyme does the physiological pentose work depends on
      the lineage. In B. subtilis, PgcA is the dedicated glucose 1-phosphate mutase
      (pgcA point mutants lose alpha-PGM activity and UDP-glucose-dependent envelope
      functions). Carrying the yeast salvage process from the root onto the bacterial
      PgcA branch assumes the fungal physiology is ancestral, which no bacterial
      evidence supports. Marked rather than removed because a minor contribution of PgcA
      to ribose 1-phosphate recycling has not been tested and cannot be excluded.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001860097
        source_label: PTN001860097
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Root-level IBD seeded only by yeast PRM15; the pentose-salvage process reflects a
          fungal lineage specialization rather than a function shown in bacterial SF1
          members such as PgcA.
    supported_by:
    - reference_id: PMID:23103740
      supporting_text: The Pgm2 and Pgm3 proteins had almost equal kinetic properties on ribose-1-phosphate, but Pgm2 had a 2000 times higher preference for glucose-1-phosphate when compared to Pgm3.
    - reference_id: PMID:23103740
      supporting_text: We conclude that Pgm3 functions as the major phosphoribomutase in vivo.
    - reference_id: PMID:15640167
      supporting_text: demonstrated that pgcA is the structural gene of α-PGM
- term:
    id: GO:0008973
    label: phosphopentomutase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001860097
  - SGD:S000004891
  - UniProtKB:Q96G03
  review:
    summary: >-
      PAINT IBA from the PTHR45745 root node PTN001860097, seeded by yeast PRM15/PGM3 and
      human PGM2 (Q96G03), both of which are phosphopentomutases that also act on glucose
      1-phosphate. PgcA has been assayed only on glucose 1-phosphate (major activity) and
      glucosamine 1-phosphate (about 20-fold lower); its activity on ribose 1-phosphate or
      2-deoxyribose 1-phosphate has never been measured.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The catalytic capacity is plausible: phosphohexomutases of several families accept
      pentose 1-phosphates at some rate (all three yeast PGMs, including the dedicated
      phosphoglucomutase Pgm1, show activity on ribose 1-phosphate), and PgcA is
      demonstrably promiscuous, also acting on glucosamine 1-phosphate. But the IBD
      reflects the substrate preference of the eukaryotic seeds, PRM15 (a ribose
      1-phosphate specialist) and PGM2, and the bacterial PgcA branch is characterized as a
      glucose 1-phosphate mutase whose in vivo role is UDP-glucose supply. Presenting
      phosphopentomutase as an enabled activity of PgcA, with nothing measured for the
      bacterial enzyme, over-states what is known. This is a judgment about node
      placement: the pentomutase specialization appears derived in the fungal and
      animal lineages, not shown to be ancestral for SF1. Flagged rather than removed
      because low-level pentomutase activity is not excluded.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001860097
        source_label: PTN001860097
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Root-level phosphopentomutase IBD seeded by yeast PRM15 and human PGM2; no
          pentomutase measurement exists for bacterial SF1 members, whose characterized
          representative PgcA is a glucose 1-phosphate mutase.
    supported_by:
    - reference_id: PMID:23103740
      supporting_text: All tested enzymes were active on both substrates with Pgm1 exhibiting only residual activity on ribose-1-phosphate.
    - reference_id: PMID:31589605
      supporting_text: However, even native PgcA (with G47) has PNGM activity (~20-fold lower than PGM activity)
