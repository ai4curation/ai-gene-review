suggested_questions:
- question: Which B. subtilis secretory preproteins are processed preferentially by SipS rather than
    SipT, and what signal-peptide features determine that preference?
- question: Is the lethality of the sipS sipT double mutant due to accumulation of unprocessed
    preproteins jamming the Sec translocon, or to failure to process a specific essential substrate?
suggested_experiments:
- description: N-terminomics of the membrane and secreted proteome in sipS, sipT and conditional
    sipS(ts) sipT strains to map unprocessed signal peptides and their cleavage sites.
  hypothesis: SipS and SipT have overlapping but distinct substrate sets defined by signal-peptide
    c-region features.
  experiment_type: N-terminomics after genetic depletion
- description: In vitro cleavage kinetics of purified SipS and SipT on a panel of native B. subtilis
    preprotein signal peptides.
  hypothesis: Substrate preference differences observed in vivo reflect intrinsic catalytic preferences
    of the two enzymes.
  experiment_type: in vitro enzyme kinetics
