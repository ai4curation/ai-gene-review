gene_symbol: sipS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: SipS is one of five chromosomally encoded type I signal peptidases (SipS, SipT, SipU,
  SipV and SipW) of Bacillus subtilis. The 184-residue protein is anchored in the cytoplasmic membrane
  by a single N-terminal transmembrane segment, with its catalytic domain on the extracytoplasmic
  side, and cleaves the N-terminal signal peptides from secretory preproteins after their
  translocation, releasing the mature proteins. It is a serine-lysine dyad (S26, LexA-like) peptidase
  in which Ser43 and Lys83 are essential for activity. SipS and its paralog SipT are the major
  signal peptidases of the cell; either alone is dispensable, but loss of both is lethal, probably
  because unprocessed preproteins jam the secretion machinery. sipS transcription is growth-phase
  dependent and controlled by the DegS-DegU two-component system, together with genes for secreted
  degradative enzymes.
