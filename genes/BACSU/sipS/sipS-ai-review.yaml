core_functions:
- description: SipS is a major membrane-anchored type I signal peptidase of B. subtilis that cleaves
    N-terminal signal peptides from translocated secretory preproteins, releasing mature proteins; it
    shares this essential role with its paralog SipT.
  supported_by:
  - reference_id: PMID:9694797
    supporting_text: only cells lacking both SipS and SipT were not viable, which may be caused by
      jamming of the secretion machinery with secretory preproteins
  - reference_id: PMID:8951809
    supporting_text: in the absence of SipS the rate of processing of several preproteins was reduced
  - reference_id: PMID:10982814
    supporting_text: certain mutants in the c-region of the signal peptide result in alternate site
      cleavage by both Lep and SipS enzymes
