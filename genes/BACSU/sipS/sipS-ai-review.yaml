  review:
    summary: SipS is a serine-lysine dyad endopeptidase; this mechanistic class is correct but the
      substrate-defined core activity is signal peptidase activity.
    action: KEEP_AS_NON_CORE
    reason: Site-directed mutagenesis showed that Ser43 and Lys83 are critical for SipS activity and
      supports a Ser-Lys catalytic dyad, so the serine-type endopeptidase classification inherited from
      the PAINT signal peptidase node (seeded by E. coli LepB) is correct and B. subtilis SipS is
      squarely inside that clade. GO:0004252 is not an ancestor of GO:0009003 signal peptidase activity
      (which sits under endopeptidase activity only), so this row cannot be refined to the core term by
      MODIFY; it is kept as a correct non-core mechanistic annotation, as in the E. coli LepB review.
    supported_by:
