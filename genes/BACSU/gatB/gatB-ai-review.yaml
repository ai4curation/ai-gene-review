id: O30509
gene_symbol: gatB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GatB is the synthetase subunit of the GatCAB tRNA-dependent amidotransferase in Bacillus
  subtilis; it activates and amidates the tRNA-bound amino-acid side chain using ATP. Both glutamyl-tRNA(Gln)
  and aspartyl-tRNA(Asn) can feed the indirect pathways in this organism, which also retains a direct
  AsnS route.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR014746
  review:
    summary: GatB has a defined catalytic contribution within the GatCAB reaction.
    action: MODIFY
    reason: The general catalytic claim is sound but underspecified. The replacements retain both demonstrated
      tRNA-transamidation capacities. Complex-level activity is a subunit contribution, not an assertion
      that the isolated polypeptide performs every chemical step. Both glutamyl-tRNA(Gln) and aspartyl-tRNA(Asn)
      can feed the indirect pathways in this organism, which also retains a direct AsnS route.
    supported_by: &id001
    - &id002
      reference_id: PMID:9342321
      supporting_text: The enzyme furnishes a means for formation of correctly charged Gln-tRNA Gln through
        the transamidation of misacylated Glu-tRNA Gln
    - &id003
      reference_id: file:BACSU/gatB/gatB-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalytic subunit of the Asp/Glu-tRNA(Asn/Gln) amidotransferase complex GatCAB
        (Probable). GatCAB allows the formation of correctly charged Asn-tRNA(Asn) or Gln-tRNA(Gln) through
        the multi- step transamidation of misacylated Asp-tRNA(Asn) or Glu-tRNA(Gln) in organisms which
        lack either or both of asparaginyl-tRNA or glutaminyl- tRNA synthetases (PubMed:9789001). The
        reaction takes place in the presence of glutamine and ATP through an activated phospho-Asp- tRNA(Asn)
        or phospho-Glu-tRNA(Gln). This subunit specifically recognizes tRNA(Gln) and tRNA(Asn), and mediates
        the transamidation of misloaded Glu and Asp respectively by catalyzing formation of the activated
        gamma-phospho-intermediate and its subsequent aminolysis using ammonia produced by the gatA subunit.
        Recognizes the first base pair and the D-loop of its specific tRNA substrates (By similarity).
        {ECO:0000255|HAMAP-Rule:MF_00121, ECO:0000269|PubMed:9789001, ECO:0000305|PubMed:9789001}.
    proposed_replacement_terms:
    - id: GO:0050566
      label: asparaginyl-tRNA synthase (glutamine-hydrolyzing) activity
    - id: GO:0050567
      label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000001255
  review:
    summary: GatB participates in modification of the amino acid already esterified to tRNA.
    action: MODIFY
    reason: The transamidase changes the amino-acid side chain on already-charged tRNA; it does not itself
      perform the initial aminoacyl-ester formation. Use charged-tRNA amino acid modification for this
      direct role. This is a role-specific refinement of the broader translation context, preserving actual
      enzymatic or structural participation.
    supported_by: *id001
    proposed_replacement_terms:
    - id: GO:0019988
      label: charged-tRNA amino acid modification
