  review:
    summary: GatB supplies ATP-dependent synthetase chemistry in both supported tRNA transamidations.
    action: MODIFY
    reason: Refine the broad ligase claim to the two established tRNA-bound substrates. GatB performs
      activation and ammonia-dependent amidation while GatA provides glutamine hydrolysis; the complete
      glutamine-dependent activity belongs to the assembled complex. Both glutamyl-tRNA(Gln) and aspartyl-tRNA(Asn)
      can feed the indirect pathways in this organism, which also retains a direct AsnS route.
