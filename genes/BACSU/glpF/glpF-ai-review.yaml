id: P18156
gene_symbol: glpF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GlpF is a MIP-family glycerol facilitator in the Bacillus subtilis cytoplasmic membrane.
  It provides a pore for passive glycerol diffusion, supplying intracellular glycerol to glycerol kinase.
  Its gene is cotranscribed with glpK, and expression of this uptake and phosphorylation system is controlled
  by glycerol 3-phosphate and the GlpP regulator.
