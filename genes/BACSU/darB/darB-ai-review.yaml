id: O31698
gene_symbol: darB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DarB is a homodimeric CBS-domain cyclic di-AMP receptor in Bacillus subtilis that couples
  potassium availability to enzyme regulation. At low messenger levels, apo-DarB binds Rel, stimulates
  alarmone synthesis and suppresses alarmone hydrolysis; it also binds and activates pyruvate carboxylase.
  Cyclic di-AMP binding prevents these regulatory interactions, linking ionic status to the stringent
  response and anaplerotic metabolism.
references:
- id: PMID:33619274
  title: 'A meet-up of two second messengers: the c-di-AMP receptor DarB controls (p)ppGpp synthesis in
    Bacillus subtilis.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Fetched PubMed identity and cached primary text checked; direct assays distinguished
      from the proposed regulatory model.
  findings:
  - statement: DarB is a regulator, not an alarmone synthetase.
    supporting_text: No pppGpp synthesis was detected with DarB alone indicating that DarB is unable to
      synthesize pppGpp
- id: PMID:35714772
  title: Structural basis for c-di-AMP-dependent regulation of the bacterial stringent response by receptor
    protein DarB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Fetched PubMed identity and cached primary text checked; direct assays distinguished
      from the proposed regulatory model.
  findings:
  - statement: The CBS-domain homodimer directly binds cyclic dinucleotides.
    supporting_text: We also confirm the DarB dimer binds two cyclic dinucleotide molecules or two AMP
      molecules
  - statement: Messenger occupancy prevents the apo-DarB interaction with Rel.
    supporting_text: In absence of c-di-AMP, DarB binds to Rel and stimulates (p)ppGpp synthesis, whereas
      the presence of c-di-AMP abolishes this interaction.
- id: PMID:35130724
  title: Sustained Control of Pyruvate Carboxylase by the Essential Second Messenger Cyclic di-AMP in
    Bacillus subtilis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Fetched PubMed identity and cached primary text checked; direct assays distinguished
      from the proposed regulatory model.
  findings:
  - statement: Apo-DarB directly activates pyruvate carboxylase; ligand binding prevents interaction and
      activation.
    supporting_text: Both the interaction and the activation of enzyme activity require apo-DarB and are
      inhibited by c-di-AMP.
- id: PMID:36652515
  title: The structure of DarB in complex with Rel(NTD) reveals nonribosomal activation of Rel stringent
    factors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Fetched PubMed identity and cached primary text checked; direct assays distinguished
      from the proposed regulatory model.
  findings:
  - statement: The DarB-Rel complex directly engages the Rel synthesis domain.
    supporting_text: DarB directly engages the SYNTH domain of Rel to stimulate (p)ppGpp synthesis.
