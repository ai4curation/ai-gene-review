gene_symbol: ltaS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  LtaS1 (UniProt name; locus yfnI, BSU07260; called YfnI in the primary
  literature) is one of four LtaS-type lipoteichoic acid (LTA) synthases of
  Bacillus subtilis. It is a 639-residue polytopic membrane protein with five
  N-terminal transmembrane helices and a large extracytoplasmic catalytic
  domain of the alkaline phosphatase/sulfatase fold (LTA synthase family,
  PANTHER PTHR47371). Like the major synthase LtaS2 (YflE), it uses the
  membrane lipid phosphatidylglycerol as the glycerolphosphate donor, releasing
  diacylglycerol, and is a bona-fide polyglycerolphosphate LTA synthase: it
  hydrolyses phosphatidylglycerol in a Mn2+-dependent manner in vitro and, in
  the absence of LtaS2, is sufficient for LTA polymer production in B. subtilis,
  though the polymer it makes then has altered (longer) chain length. Expression
  of yfnI depends on the extracytoplasmic-function sigma factor SigM, placing it
  in the cell-envelope stress response. The full-length protein is cleaved after
  an AXA motif by the type I signal peptidases SipT and SipV, and the catalytic
  domain is released into the culture medium in a Sec/SRP-dependent way. Unlike
  yflE, yfnI cannot restore growth of an S. aureus ltaS depletion strain.
