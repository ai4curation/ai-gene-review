    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN005342890
  - UniProtKB:P39401
  review:
    summary: >-
      Phylogenetic propagation of membrane location across the LTA synthase /
      OpgB family (PANTHER PTHR47371).
    action: MODIFY
    reason: >-
      The claim is correct but general. Gram type does not explain the
      granularity: GO:0005886 plasma membrane is "the membrane surrounding a
      cell that separates the cell from its external environment", which is the
      cytoplasmic (inner) membrane in diderms and monoderms alike, so the
      OpgB-type donors sit in a plasma membrane too. The stop at GO:0016020
      reads as a conservative PAINT choice. For LtaS1 the specific compartment
      is supported directly - five transmembrane helices, with the substrate
      phosphatidylglycerol and the glycolipid anchor in that same membrane - and
      the gene already carries GO:0005886 from the UniProt mapping.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN005342890
        source_label: LTA synthase / OpgB family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Within-subfamily transfer: the IBD donor E. coli MdoB/OpgB (P39401)
          and this protein are both PTHR47371:SF3 PHOSPHOGLYCEROL TRANSFERASE I
          (interpro/panther/PTHR47371/PTHR47371-entries.csv), so the node
          placement is not being stretched across the family's synthase/OpgB
          split. The membrane claim holds; the stop at generic membrane is a
          conservative PAINT choice rather than a consequence of Gram type, and
          the specific compartment here is the plasma membrane.
    supported_by:
    - reference_id: PMID:21255105
      supporting_text: All four proteins have the same predicted membrane topology
        and domain structure as S. aureus LtaS.
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN005342890
  - UniProtKB:P39401
  - UniProtKB:P43975
  review:
    summary: >-
      Phylogenetic propagation of transferase activity across the LTA synthase /
      OpgB family.
    action: MODIFY
    reason: >-
      The activity is correct but very general. LtaS1 (YfnI) transfers the
      glycerolphosphate head group of phosphatidylglycerol onto the growing LTA
      chain (EC 2.7.8.-), a transfer of a substituted phosphate group, so
      GO:0016780 phosphotransferase activity, for other substituted phosphate
      groups is the most specific existing term. GO has no specific
      polyglycerolphosphate LTA synthase term. Mn2+-dependent PG hydrolysis was
      shown in vitro for all four orthologues, and YfnI produces LTA polymer in
      B. subtilis and in the S. aureus complementation assay.
    proposed_replacement_terms:
    - id: GO:0016780
      label: phosphotransferase activity, for other substituted phosphate groups
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN005342890
        source_label: LTA synthase / OpgB family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Within-subfamily transfer: both IBD donors, E. coli MdoB/OpgB (P39401)
          and H. influenzae HI_0275 (P43975), and this protein are all
          PTHR47371:SF3 PHOSPHOGLYCEROL TRANSFERASE I
          (interpro/panther/PTHR47371/PTHR47371-entries.csv). The node stops at
          top-level transferase because the donors' own specific term,
          GO:0008960 phosphatidylglycerol-membrane-oligosaccharide
          glycerophosphotransferase activity, is the OpgB reaction on
          membrane-derived oligosaccharides, which LtaS1 does not catalyse. The
          activity claim is sound, and the nearest term covering the LtaS
          reaction is the shared parent GO:0016780.
    supported_by:
    - reference_id: PMID:21255105
      supporting_text: We show that all four orthologues are able to hydrolyse fluorescently
        labelled PG in a Mn2+-dependent manner.
    - reference_id: PMID:17483484
      supporting_text: These results suggest that B. subtilis yflE and yfnI both encode
        glycerol phosphate LTA synthases with at least partially overlapping functions
- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IDA
  original_reference_id: PMID:21255105
  qualifier: enables
  review:
    summary: >-
      Mn2+ is the catalytic metal of the LtaS-type active site. The purified
      LtaS1 (YfnI) catalytic domain gives its highest phosphatidylglycerol-hydrolysing
      activity with MnCl2 and only weak activity with Mg2+ or Ca2+, and UniProt
      records four Mn(2+)-coordinating residues (Glu252, Thr297, Asp472, His473)
      in the sulfatase-fold active site, Thr297 also being the catalytic
      nucleophile.
    action: NEW
    reason: >-
      The protein itself binds the metal, so there is no participation question
      to answer: the metal is a cofactor of the reaction LtaS1 catalyses, not
      something another gene product supplies to it. Wörmann et al. tested
      Mg2+, Mn2+, Ca2+ and Zn2+ side by side on the purified enzymatic domains of
      all four B. subtilis LtaS-type proteins and found Mn2+ dependence in every
      case, matching the Mn(2+) cocrystal of the S. aureus orthologue. The
      metal-binding residues are curated on the UniProt entry (ECO:0000250, from
      that structure). GOA has no metal-binding row for any of the four
      paralogues, so this is added as NEW rather than refined from an existing
      annotation.
    supported_by:
    - reference_id: PMID:21255105
      supporting_text: As presented in Fig. 3A and Fig. S2, all four proteins showed
        the highest activity in the presence of MnCl2.
    - reference_id: PMID:21255105
      supporting_text: Addition of MgCl2 and CaCl2 in place of MnCl2 resulted only
        in weak enzyme activity and no activity above background was seen in the
        presence of ZnCl2.
    - reference_id: PMID:19168632
      supporting_text: The cocrystal structure with glycerol-phosphate and the coordination
        of a Mn(2+) cation allowed us to propose a reaction mechanism
    - reference_id: file:BACSU/ltaS1/ltaS1-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: |-
        BINDING         252
        FT                   /ligand="Mn(2+)"
        FT                   /ligand_id="ChEBI:CHEBI:29035"
        FT                   /evidence="ECO:0000250"
