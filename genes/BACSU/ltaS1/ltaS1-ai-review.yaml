    supporting_text: Furthermore, in B. subtilis LtaSBS, YfnI or YqgS are sufficient
      for polyglycerolphosphate polymer production.
  - reference_id: PMID:17483484
    supporting_text: In contrast, anhydrotetracycline-inducible expression of yfnI
      promoted LTA synthesis
proposed_new_terms:
- proposed_name: polyglycerophosphate lipoteichoic acid synthase activity
  proposed_definition: >-
    Catalysis of the transfer of the sn-glycerol-1-phosphate head group of
    phosphatidylglycerol onto the terminal glycerophosphate of a growing
    polyglycerophosphate lipoteichoic acid chain, producing 1,2-diacyl-sn-glycerol
    and extending the polyglycerophosphate backbone by one unit. This term covers
    chain elongation only; transfer of the first glycerophosphate unit onto the
    diglucosyl-diacylglycerol anchor is the separate lipoteichoic acid primase
    activity.
  justification: >-
    GO has no molecular function term for the polyglycerolphosphate LTA synthase
    reaction (EC 2.7.8.-); an OLS search for lipoteichoic acid synthase or
    primase activity returns nothing. The nearest term, GO:0016780, is a genus
    several levels too general for the four B. subtilis LtaS-type enzymes, and
    its one relevant existing child, GO:0008960
    phosphatidylglycerol-membrane-oligosaccharide glycerophosphotransferase
    activity, is the Gram-negative OpgB reaction. The proposed term is defined to
    be disjoint from the proposed lipoteichoic acid primase activity (elongation
    versus the first transfer onto the glycolipid anchor); an enzyme shown to do
    both would carry both terms, and neither term entails the other.
  proposed_parent:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
suggested_questions:
- question: >-
    What determines the increased LTA chain length produced by YfnI when LtaS2
    is absent, and does the SigM-controlled induction of yfnI tune LTA structure
    during envelope stress?
suggested_experiments:
- description: >-
    Measure LTA chain-length distributions (by gel mobility and by NMR of
    purified LTA) in B. subtilis strains expressing YfnI alone versus LtaS2
    alone, under SigM-inducing and non-inducing conditions, to connect enzyme
    identity and regulation to polymer structure.
  experiment_type: polymer structural analysis
