core_functions:
- description: >-
    Polyglycerolphosphate lipoteichoic acid synthase. Using phosphatidylglycerol
    as the glycerolphosphate donor, it polymerises the polyglycerolphosphate LTA
    backbone at the outer face of the cytoplasmic membrane in a Mn2+-dependent
    manner. It is a secondary, SigM-controlled synthase: in the absence of the
    major synthase LtaS2 it supports LTA production, although the resulting
    polymer has an increased chain length.
  molecular_function:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  directly_involved_in:
