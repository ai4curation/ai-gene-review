- id: PMID:21255105
  title: Enzymatic activities and functional interdependencies of Bacillus subtilis
    lipoteichoic acid synthesis enzymes.
  findings:
  - statement: All four B. subtilis LtaS-type proteins hydrolyse phosphatidylglycerol
      in a Mn2+-dependent manner in vitro.
    supporting_text: We show that all four orthologues are able to hydrolyse fluorescently
      labelled PG in a Mn2+-dependent manner.
  - statement: LtaS(BS), YfnI and YqgS are polymer-forming LTA synthases; any one
      of the three suffices for LTA polymer production in B. subtilis.
    supporting_text: Furthermore, in B. subtilis LtaSBS, YfnI or YqgS are sufficient
      for polyglycerolphosphate polymer production.
  - statement: In the absence of LtaS(BS), YfnI produces LTA of retarded mobility,
      indicating an enzymatic interdependency.
    supporting_text: B. subtilis strains expressing YfnI in the absence of LtaS(BS)
      produced LTA of retarded mobility, presumably caused by an increase in chain
      length
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed metadata and PMC full text checked. YfnI is this entry
      (Q797B3, LtaS1).
