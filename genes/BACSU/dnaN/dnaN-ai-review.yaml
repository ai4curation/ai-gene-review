id: P05649
gene_symbol: dnaN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaN forms the homodimeric beta sliding clamp of Bacillus subtilis. The ring encircles duplex
  DNA and tethers DNA polymerases to support processive synthesis. DnaN supports both PolC and DnaE and
  influences DnaE fidelity. It also participates in replication-initiation control through its interaction
  with YabA. It is neither the DNA-polymerizing nor the proofreading catalytic subunit.
