id: P18157
gene_symbol: glpK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GlpK is the ATP-dependent glycerol kinase of Bacillus subtilis. It converts glycerol to sn-glycerol
  3-phosphate for catabolism through GlpD to dihydroxyacetone phosphate. This intracellular phosphorylation
  traps imported glycerol and supplies the inducer of the glp regulon. GlpK activity is coupled to the
  phosphotransferase regulatory system, although glycerol itself is not imported by that system.
