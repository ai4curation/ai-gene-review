- id: PMID:2127799
  title: 'Glycerol catabolism in Bacillus subtilis: nucleotide sequence of the genes encoding glycerol
    kinase (glpK) and glycerol-3-phosphate dehydrogenase (glpD).'
  findings:
  - statement: Cloning and complementation connect the sequenced glpK locus to native glycerol catabolism.
    supporting_text: glpK coding for glycerol kinase, glpD coding for glycerol-3-phosphate (G3P) dehydrogenase
  full_text_unavailable: true
- id: PMID:7773413
  title: Mutations in the glycerol kinase gene restore the ability of a ptsGHI mutant of Bacillus subtilis
    to grow on glycerol.
  findings:
  - statement: Suppressors of impaired glycerol growth in a pts deletion map to glpK, connecting PTS regulation
      to glycerol kinase.
    supporting_text: They were shown to carry mutations in the glycerol kinase gene.
  full_text_unavailable: true
