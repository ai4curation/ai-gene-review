id: P37540
gene_symbol: holB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: HolB is the delta-prime subunit of the Bacillus subtilis DNA clamp loader. Together with
  three DnaX/tau subunits and HolA/delta, it builds the complex that loads the beta sliding clamp onto
  primed DNA. Its role is clamp-loader assembly and function, not DNA polymerization or 3′–5′ proofreading
  catalysis.
