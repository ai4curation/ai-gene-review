id: P29072
gene_symbol: cheA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CheA is the central histidine kinase in Bacillus subtilis chemotaxis. Receptor
  complexes coupled through CheW and CheV regulate its autophosphorylation and phosphotransfer
  to response regulators including CheY, CheB and CheV. Asparagine-bound McpB increases kinase
  activity and the CheY-P pool, promoting smooth swimming; this response has the opposite sign
  to the canonical Escherichia coli attractant response.
