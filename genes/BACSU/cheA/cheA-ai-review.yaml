- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IMP
  original_reference_id: PMID:25313396
  qualifier: involved_in
  review:
    summary: CheA-dependent signaling supports swarming in the tested strain3610 system.
    action: KEEP_AS_NON_CORE
    reason: The full publisher text of PMID25313396 includes this gene in the fla-che swarming panel (Figure
      4). Constructs were introduced through PY79/DS2569 and tested in strain 3610, not literal strain
      168. Its conserved signaling or switch contribution supports the existing assignment; swarming is
      a contextual outcome, and this evidence does not make CheA or CheY structural assembly factors.
    supported_by:
    - reference_id: PMID:25313396
