id: P37538
gene_symbol: darA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DarA is a cytoplasmic PII-like cyclic di-AMP receptor in Bacillus subtilis. The homotrimer
  binds three cyclic di-AMP molecules at intersubunit pockets and undergoes ligand-associated conformational
  changes. Genetic experiments link DarA to adaptation under extreme potassium limitation and salt stress,
  with compensatory changes in osmolyte and amino-acid metabolism. Its direct downstream regulatory partner
  remains unresolved, so those phenotypes do not define a particular enzyme or transporter target.
