taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: BdbC is a small four-pass cytoplasmic-membrane thiol-disulfide oxidoreductase of the DsbB
  family in Bacillus subtilis. Together with BdbD it supports oxidative folding of exported proteins and
  stability of the competence pilin ComGC. Its proposed role is to reoxidize BdbD through a membrane redox
  relay; the specific physiological quinone and purified coupled reaction remain less directly characterized
  than BdbD substrate oxidation.
