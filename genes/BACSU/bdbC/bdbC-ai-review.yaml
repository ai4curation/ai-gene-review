- id: PMID:11744713
  title: The bdbDC operon of Bacillus subtilis encodes thiol-disulfide oxidoreductases required for competence
    development.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal cache remains abstract-only after force retry. Full publisher PDF was
      independently obtained from the University of Groningen repository and read; selected exact excerpts
      and acquisition hashes are retained in BdbD source analysis. Strain 168 and derivatives were used.
      PhoA functional results support oxidative folding; the authors explicitly state that direct ComGC
      folding evidence was not yet obtained.
- id: PMID:11844773
  title: Mutations in the thiol-disulfide oxidoreductases BdbC and BdbD can suppress cytochrome c deficiency
    of CcdA-defective Bacillus subtilis cells.
  findings:
  - statement: BdbC/BdbD pairing is inferred from genetic and comparative evidence.
    supporting_text: This gene organization and the fact that BdbD and BdbC are apparent orthologs of
      E. coli DsbA and DsbB, respectively, indicate that BdbC and BdbD function as a pair.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Genetic suppression and topology support a BdbC/BdbD redox pair; the
      conserved quinone-contact arginine is comparative evidence, not a BdbC quinone-reduction assay.
      Loss of an oxidizing pathway can rescue reductase deficiency, so rescue is not positive evidence
      for participation in cytochrome maturation or sporulation.
- id: PMID:19535335
  title: Crystal structure and biophysical properties of Bacillus subtilis BdbD. An oxidizing thiol:disulfide
    oxidoreductase containing a novel metal site.
  findings:
  - statement: Soluble BdbD directly transfers its disulfide to a cysteine-containing peptide.
    supporting_text: These experiments clearly demonstrate that oxidized sBdbD is able to transfer its
      disulfide bond to the apo-cytochrome c550 active site mimic peptide.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Assayed pACN2 construct derives from strain 1A1 and matches frozen O32218
      residues 30–222 exactly plus engineered Met and LEHHHHHH. Peptide oxidation, calcium binding/redox
      effects and membrane fractionation are direct; full membrane-coupled turnover and direct ComGC oxidation
      are not shown. The demonstrated membrane attachment supersedes a predicted cleaved-signal interpretation;
      exact native processing was not sequenced.
core_functions:
- description: Supports extracytoplasmic oxidative protein folding as the inferred BdbD-reoxidizing membrane
    relay. DsbB-family architecture and genetic substrate-folding evidence support the role, while the
    physiological quinone and coupled BdbC reaction remain unverified.
  molecular_function:
    id: GO:0015035
    label: protein-disulfide reductase activity
  directly_involved_in:
