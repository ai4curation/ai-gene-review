- term:
    id: GO:0045121
    label: membrane raft
  evidence_type: EXP
  original_reference_id: PMID:20713508
  qualifier: located_in
  review:
    summary: Detergent-resistant fraction association is reported; the target-specific mapping to
      the GO membrane-raft compartment remains uncertain.
    action: UNDECIDED
    reason: 'UNDECIDED reflects unresolved compartment identity and target-level localization, not lack
      of access to the main papers. The authors caution that DRM recovery is not equivalent to raft residence;
      the current GO definition requires sterol- and sphingolipid-enriched domains, while these studies
      discuss analogous bacterial microdomains. This does not establish that Bdb raft association is false,
      but also does not justify accepting the exact GO compartment from fractionation alone. The detailed
      protein-specific fraction attribution and equivalence to the ontology compartment remain unconfirmed
      here. Plasma-membrane location is independently supported. SecA and SecY do not settle this target:
      the current SecA review cites partial flotillin colocalization in PMID:27362352, and SecY ACCEPT
      cites PMID:23651456 DRM/FloT evidence, rather than the same Bdb observations. No term-level negative
      conclusion or evolutionary loss is asserted.'
    supported_by:
    - &id003
      reference_id: PMID:20713508
      supporting_text: While it is important to emphasize that the DRM fraction is not to be equated
        with lipid rafts, there is evidence that this fraction includes many of the proteins thought
        to be present in lipid rafts ( Brown 2002 ).
    additional_reference_ids:
    - PMID:20713508
