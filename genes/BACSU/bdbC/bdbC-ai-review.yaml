    summary: BdbC is the inferred protein-disulfide redox-recycling component of the BdbC/BdbD pair.
    action: ACCEPT
    reason: GO:0015035 is defined reversibly as interconversion of reduced protein sulfides and oxidized
      protein disulfides, so its label does not restrict it to net reduction. DsbB/BdbC family membership,
