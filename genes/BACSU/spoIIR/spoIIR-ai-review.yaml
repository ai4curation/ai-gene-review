- id: PMID:18378688
  title: Evidence that the Bacillus subtilis SpoIIGA protein is a novel type of signal-transducing
    aspartic protease.
  findings:
  - statement: SpoIIR is a putative forespore-made signaling protein and SpoIIGA
      is a putative protease; together they are necessary and sufficient for
      accurate, rapid, and abundant processing of pro-sigma(E) to sigma(E),
      demonstrated by heterologous reconstitution in E. coli.
    supporting_text: "expression of SpoIIR, a"
    reference_section_type: ABSTRACT
  - statement: SpoIIGA interacts with SpoIIR; the data support a model in which
      SpoIIR binding to the N-terminal (membrane) domain of SpoIIGA drives a
      conformational change that assembles an active aspartic-protease dimer in
      the C-terminal domain on the mother-cell side of the membrane, cleaving
      pro-sigma(E).
    supporting_text: "SpoIIGA interacts with SpoIIR."
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Provides direct evidence for the SpoIIR-SpoIIGA
      interaction and the sufficiency of the pair for pro-sigma(E) processing;
      only abstract-level text is cached but the abstract itself explicitly
