id: P39151
gene_symbol: spoIIR
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
description: >-
  SpoIIR is a small forespore-produced signaling protein that triggers
  mother-cell activation of the sporulation sigma factor sigma E during
  Bacillus subtilis endospore formation. After transcription of spoIIR in the
  forespore under sigma F control, SpoIIR is secreted into the intermembrane
  space between the forespore and the mother cell where it binds the
  N-terminal, membrane-embedded domain of the mother-cell-anchored aspartic
  protease SpoIIGA; this interaction is proposed to relieve auto-inhibition
  and drive dimerization of SpoIIGA's C-terminal protease domain, which then
  cleaves pro-sigma-E to release active sigma E in the mother cell. SpoIIR is
  thus the intercellular signal that couples sigma F activation in the
  forespore to sigma E activation in the mother cell.
