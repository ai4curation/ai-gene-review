- term:
    id: GO:0016504
    label: peptidase activator activity
  evidence_type: NAS
  review:
    summary: >-
      SpoIIR binds the N-terminal membrane domain of the aspartic protease
      SpoIIGA and triggers assembly of an active protease dimer that cleaves
      pro-sigma-E, i.e. SpoIIR acts as a peptidase activator.
    action: NEW
    reason: >-
      PMID:18378688 shows that SpoIIR and SpoIIGA together are necessary and
      sufficient for accurate pro-sigma(E) processing and that SpoIIR binds
      SpoIIGA; this fits the definition of peptidase activator activity better
      than the generic protein binding term.
    supported_by:
      - reference_id: PMID:18378688
        supporting_text: "SpoIIGA interacts with SpoIIR."
      - reference_id: PMID:18378688
        supporting_text: "expression of SpoIIR, a"
