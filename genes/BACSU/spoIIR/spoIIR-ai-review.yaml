core_functions:
- description: >-
    Acts as the forespore-to-mother-cell signaling ligand that binds and
    activates the mother-cell-anchored aspartic protease SpoIIGA, which in
    turn cleaves pro-sigma-E to release active sigma E in the mother cell.
  molecular_function:
    id: GO:0016504
    label: peptidase activator activity
  directly_involved_in:
  - id: GO:0030435
    label: sporulation resulting in formation of a cellular spore
  supported_by:
  - reference_id: PMID:18378688
    supporting_text: "SpoIIGA interacts with SpoIIR."
  - reference_id: PMID:18378688
    supporting_text: "expression of SpoIIR, a"
suggested_questions:
- question: >-
    What is the exact stoichiometry and geometry of the SpoIIR-SpoIIGA
    complex at the sporulation septum, and does one SpoIIR molecule activate
    a single SpoIIGA dimer or does clustering of SpoIIR drive higher-order
    protease assembly?
- question: >-
    How is SpoIIR delivered to the mother-cell face of the SpoIIGA N-terminal
    domain - does it traverse the intermembrane space by simple diffusion after
    Sec-dependent export, or is a dedicated forespore-inner-membrane transport
    machinery involved?
suggested_experiments:
- hypothesis: >-
    Binding of SpoIIR to the N-terminal membrane domain of SpoIIGA is the sole
    trigger required to convert SpoIIGA from an inactive monomer/oligomer to
    an active aspartic-protease dimer capable of cleaving pro-sigma-E.
  description: >-
    Reconstitute purified SpoIIR and full-length SpoIIGA (with a fluorescent
    protease reporter substrate mimicking the pro-sigma(E) cleavage site) in
    nanodiscs or proteoliposomes and monitor SpoIIGA dimerization (by
    single-molecule tracking / FRET) and cleavage activity as a function of
    SpoIIR concentration. Test SpoIIR truncations and interface mutations for
    loss of SpoIIGA activation.
  experiment_type: In vitro reconstitution + single-molecule FRET + cleavage assay
- hypothesis: >-
    SpoIIR reaches the mother-cell membrane by regulated secretion across the
    forespore inner membrane, and its export is coupled to sigma F activation.
  description: >-
    Fuse SpoIIR to sfGFP and to a translocation-sensitive redox reporter and
    track its localization in wild-type and Sec-mutant (secA-ts, secY-ts,
    signal-recognition-particle-depleted) sporulating cells by fluorescence
    microscopy. Combine with pulse-chase and formaldehyde crosslinking to
    identify partners engaged during export and to place SpoIIR delivery
    kinetically relative to pro-sigma-E cleavage.
  experiment_type: Fluorescence microscopy + genetic depletion + pulse-chase crosslinking
