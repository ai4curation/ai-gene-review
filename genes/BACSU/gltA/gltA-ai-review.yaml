- term:
    id: GO:0004359
    label: glutaminase activity
  evidence_type: IC
  original_reference_id: PMID:34931064
  qualifier: enables
  review:
    summary: Native B. subtilis GltAB structural and mutant work places an Ntn-amidotransferase domain on
      GltA and shows that substituting its N-terminal nucleophile cysteine (C1A) abolishes GOGAT
      activity.
    action: NEW
    reason: Curator inference from native-species evidence. The B. subtilis GltAB cryo-EM study assigns
      GltA an Ntn-amidotransferase domain, and its catalytically inactive GltAB C1A mutant, used as
      the paper's null control, carries a substitution of the Ntn nucleophile. In Ntn numbering the
      nucleophile is mature residue 1. Cys22 is the first cysteine of P39812 and is the UniProt
      GATase active site, so C1A is Cys22Ala (see the residue mapping on the PMID:34931064 finding).
      The mutant was assayed for overall GOGAT activity, not for isolated glutaminase, so the
      activity is inferred from the domain plus loss of the nucleophile rather than measured
      directly. Two caveats. First, GOA carries GO:0004359 on the glutaminase subunits of other
      ammonia-channelling amidotransferases (CarA, HisH, GatA and others) but on no GOGAT large
      chain in any organism. Second, GOGAT is self-regulated and gates its glutaminase site so that
      L-glutamine is not hydrolysed wastefully when no acceptor is bound. The term therefore records
      the subunit's own partial reaction, which the bacterial_ammonia_assimilation module assigns to
      the large chain, not a free, uncoupled glutaminase role. The complete NADPH-GOGAT reaction
      stays on the contributes-to core function.
    supported_by:
    - reference_id: PMID:34931064
      supporting_text: GltA is a multi-domain protein that consists of an Ntn-amidotransferase domain, a central
        domain, a synthase domain, and the GXGXG domain
    - reference_id: PMID:34931064
      supporting_text: Enzyme kinetics of wild-type GltAB (orange) and its mutant GltABC1A (light orange), show
        that the mutant is completely inactive.
    - reference_id: file:BACSU/gltA/gltA-uniprot.txt
      record_section: ["FT:ACT_SITE"]
      supporting_text: /note="For GATase activity"
    - reference_id: PMID:11188694
      supporting_text: The outstanding property of glutamate synthase is the ability to coordinate the activity
        of its various functional sites to avoid wasteful consumption of L-glutamine.
references:
- id: PMID:11188694
  title: Cross-talk and ammonia channeling between active centers in the unexpected domain arrangement
    of glutamate synthase.
  findings:
  - statement: A bacterial glutamate synthase core structure links the L-glutamine hydrolysis site to
      the L-glutamate synthesis site through an internal ammonia tunnel.
    supporting_text: Channeling of the ammonia intermediate is brought about by an internal tunnel of
      31 A length, which runs from the site of L-glutamine hydrolysis to the site of L-glutamate synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Structural study of a bacterial NADPH-GOGAT large-chain core; the
      abstract does not name the organism, so it is used as comparative mechanistic evidence for the
      conserved amidotransferase domain.
