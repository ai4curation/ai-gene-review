- id: PMID:34931064
  title: A counter-enzyme complex regulates glutamate metabolism in Bacillus subtilis.
  findings:
  - statement: Native GltAB structures localize the small- and large-chain redox cofactors.
    supporting_text: The higher resolution did permit unambiguous assignment of two 4Fe-4S clusters in
      GltB, and a 3Fe-4S clusters and FMN in GltA.
  - statement: GltA has an Ntn-amidotransferase domain, and the C1A substitution of its N-terminal nucleophile
      cysteine (Cys22 of P39812) gives a completely inactive GltAB.
    supporting_text: Enzyme kinetics of wild-type GltAB (orange) and its mutant GltABC1A (light orange), show
      that the mutant is completely inactive.
    residue_mappings:
    - as_reported:
        accession: NtnMatureChain:P39812_22-1520
        position: 1
        residue: C
      canonical:
        accession: UniProtKB:P39812
        position: 22
        residue: C
        sequence_version: 3
      note: >-
        The paper does not state its numbering scheme. C1A cannot be canonical numbering, because P39812
        residue 1 is Met. Ntn amidotransferases conventionally number the nucleophile cysteine as residue 1
        of the mature domain. Cys22 is the first cysteine in P39812 (residues 1-21, MTYNQMPKAQGLYRPEFEHDA,
        contain none), it follows the conserved HDA motif, and UniProt annotates it as ACT_SITE 22 "For
        GATase activity". It is therefore the only residue that can be called Cys1. Compare A. brasilense
        GltB, where the mature chain starts at the active-site Cys37 (PDB 1EA0 begins at 37). The study used
        strain NCIB3610; the mapping is to the strain 168 canonical sequence. The as_reported side names the
        mature-chain numbering, which no database sequence carries, so it is reported unresolved by the
        residue-mapping validator.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Biochemistry and cryo-EM use NCIB3610, not strain168. GltAB is a heterodimer;
      GudB6–GltA6B6 is a regulated counter-enzyme assembly, not a constitutive GltAB oligomer. GltA inhibits
      active GudB in that strain, but168 GudB is cryptic, so no168 physiological inhibitory-function annotation
      is proposed.
- id: PMID:18326565
  title: 'Glutamate metabolism in Bacillus subtilis: gene expression and enzyme activities evolved to
    avoid futile cycles and to allow rapid responses to perturbations of the system.'
  findings:
  - statement: Native glutamate dehydrogenases cannot replace anabolic GOGAT under the studied conditions.
    supporting_text: 'Both RocG and GudB1 were unable to catalyze the anabolic reaction, most probably

      because of their very high K(m) values for ammonium.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Primary abstract read; normal PMC/publisher full-text recovery attempted. The physiological
      limitation is not chemical irreversibility: high-ammonium reverse assays and heterologous E. coli
      GDH differ from native anabolic capacity.'
