  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GltA is the large catalytic subunit of the Bacillus subtilis NADPH-dependent glutamate synthase.
  Its glutaminase and FMN-associated synthase centers couple glutamine hydrolysis to reductive amination
  of 2-oxoglutarate, with electrons delivered by the GltB small subunit. The large chain contains FMN
  and a [3Fe–4S] cluster. Together with glutamine synthetase, GltAB provides the principal ammonium-assimilation
  route to glutamate in strain 168, whose native glutamate dehydrogenases principally support catabolism.
