suggested_questions:
- question: Is the mismatch-licensed MutS-beta clamp interaction also needed for MutS anti-recombination
    during natural transformation?
suggested_experiments:
- hypothesis: Purified B. subtilis MutS binds mismatches with an ATP-dependent clamp transition like E.
    coli MutS, and the beta-clamp motif increases mismatch residence time.
  description: Measure mismatch binding, ATPase stimulation and single-molecule residence of wild-type
    and clamp-binding-defective MutS in the presence and absence of loaded beta clamp.
  experiment_type: purified-protein biochemistry and single-molecule imaging
