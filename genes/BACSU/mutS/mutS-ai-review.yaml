id: P49849
gene_symbol: mutS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: MutS of Bacillus subtilis is the mismatch-recognition ATPase of a MutH-independent mismatch
  repair system. Encoded in a mutS-mutL operon, it recognizes base-pair mismatches arising during replication
  and, through a C-terminal motif, binds the beta sliding clamp, which stabilizes MutS at the mismatch
  near the replisome. Mismatch-bound MutS then recruits MutL, whose endonuclease activity initiates strand
  removal without a MutH/Dam methylation signal. Loss of MutS raises the spontaneous mutation frequency
  by about two orders of magnitude and relaxes the barrier to recombination with divergent DNA during
  transformation.
