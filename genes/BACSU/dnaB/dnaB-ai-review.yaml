  original_reference_id: PMID:15186423
  qualifier: located_in
  review:
    action: ACCEPT
    summary: DnaB is recovered in a membrane-associated fraction distinct from its soluble pool.
    reason: PMID20071750 directly compares soluble and membrane-associated DnaB by immunoblotting; membrane-associated
      DnaB is relatively protected from the C-terminal truncation seen in soluble extracts. PMID15186423
      independently reports enrichment of DnaB and oriC in the membrane fraction. These observations support
      membrane association, without asserting an integral membrane topology or a uniform growth-phase
      distribution.
    supported_by:
    - reference_id: PMID:20071750
      supporting_text: Proteolysis is confined to cytosolic, not to membrane-associated DnaB, and affects
        oligomerization.
