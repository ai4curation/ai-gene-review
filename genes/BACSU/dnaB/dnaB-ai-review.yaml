  review:
    action: ACCEPT
    summary: The protein contributes directly to the replication machinery.
    reason: DnaB is a DNA-binding, DNA-remodeling helicase-loading accessory protein in Bacillus subtilis.
      It cooperates with DnaD and DnaI to place the DnaC replicative helicase on DNA during chromosome
      initiation and replication restart. DnaB binds single- and double-stranded DNA, oligomerizes and
      occurs in cytosolic and membrane-associated pools. It is distinct from the unrelated helicase named
      DnaB in Escherichia coli. Purified-component experiments or direct DNA engagement establish a molecular
      role; process participation is not inferred solely from essentiality. The specific division of labor
      is retained in the core function.
    supported_by: &id002
    - &id001
      reference_id: PMID:20071750
      supporting_text: We show that DnaB has two separate ssDNA-binding sites one located within residues
        1-300 and another between residues 365-428, and a dsDNA-binding site within residues 365-428.
    - reference_id: PMID:12718886
      supporting_text: DnaI and DnaB interact physically and functionally with the DnaC helicase and mediate
        its functional delivery onto DNA.
