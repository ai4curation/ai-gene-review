  review:
    action: ACCEPT
    summary: DnaB has a soluble intracellular pool subject to growth-phase-dependent C-terminal truncation.
    reason: Immunoblot fractionation in PMID20071750 detects DnaB in soluble extracts, with C-terminal
      truncation increasing in late growth. This supports the cytoplasmic pool independently of its membrane-associated
      pool; origin-proximal foci do not imply that all DnaB is permanently membrane bound.
