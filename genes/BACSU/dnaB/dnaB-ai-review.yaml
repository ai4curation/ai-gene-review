  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaB is a DNA-binding, DNA-remodeling helicase-loading accessory protein in Bacillus subtilis.
  It cooperates with DnaD and DnaI to place the DnaC replicative helicase on DNA during chromosome initiation
  and replication restart. DnaB binds single- and double-stranded DNA, oligomerizes and occurs in cytosolic
  and membrane-associated pools. It is distinct from the unrelated helicase named DnaB in Escherichia
  coli.
