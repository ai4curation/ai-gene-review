  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted article and supplement inspected. Methods explicitly specify native
      B. subtilis 168 sequences without tags. The 13-protein reaction starts from a flapped minicircle
