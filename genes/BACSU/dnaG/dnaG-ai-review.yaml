id: P05096
gene_symbol: dnaG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaG is the DNA-directed RNA polymerase that makes short RNA primers during Bacillus subtilis
  chromosome replication. It cooperates with the DnaC replicative helicase at the replication fork. The
  primers are initially extended with DNA by DnaE before transfer to PolC for rapid synthesis. Its N-terminal
  zinc-binding region, central catalytic region and C-terminal helicase-interaction region support this
  priming activity.
