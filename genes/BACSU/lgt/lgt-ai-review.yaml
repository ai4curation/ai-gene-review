  label: Bacillus subtilis subsp. subtilis str. 168
description: 'lgt encodes phosphatidylglycerol--prolipoprotein diacylglyceryl transferase, a polytopic
  cytoplasmic-membrane enzyme of Bacillus subtilis that transfers a diacylglyceryl group from phosphatidylglycerol
  to the lipobox cysteine of translocated prolipoproteins, the first step of bacterial lipoprotein maturation
  and a prerequisite for signal peptide cleavage by LspA. Unlike in Escherichia coli, lgt is not essential
  in B. subtilis: non-lipidated precursors still cross the membrane but are partly released from the cell,
  which lowers cell-associated lipoproteins such as the PrsA foldase and impairs protein secretion. Mutations
  in lgt (gerF) also block spore germination, consistent with the lipoprotein nature of several germination
  proteins. Subsequent lipoprotein N-acetylation by LhaT/YpjA is a separate downstream activity and does
  not make Lgt itself an N-acyltransferase.'
