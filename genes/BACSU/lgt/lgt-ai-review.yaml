suggested_questions:
- question: Which B. subtilis lipoproteins are released to the medium as non-lipidated precursors in an
    lgt mutant, and do any of them retain function off the membrane?
- question: Is the gerF germination defect fully explained by loss of lipidation of the GerXC germinant-receptor
    subunits and GerD?
suggested_experiments:
- description: Quantify membrane-retained versus released lipoproteins in wild-type and lgt-null B. subtilis
    by fractionation proteomics.
  experiment_type: membrane and secretome proteomics
