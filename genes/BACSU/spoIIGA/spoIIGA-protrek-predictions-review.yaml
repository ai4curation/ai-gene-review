id: P13801
gene_symbol: spoIIGA
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SpoIIGA, the membrane-embedded aspartic protease that cleaves
  pro-sigma-E in the mother cell. As with the other sporulation-machinery genes, the GO channel returns
  generic sporulation process and spore-structure terms and never reaches the aspartic-type endopeptidase
  activity that GOA carries with IMP evidence and that this review names as the core function. Both
  GO-GPT and BioReason-SFT do recover that activity, so on this gene ProTrek is the weakest of the
  three. Its own free-text channel is precise at 21.13. Assessment: 1 correct not novel (CNN), 1 less
  precise (LSP), 1 nonparalog incorrect (NPI).
