    summary: >-
      Rank 2 (score 13.71). SpoIIGA is anchored in the septal membrane with its catalytic domain facing
      the mother-cell cytoplasm, which is where it cleaves pro-sigma-E; GOA places it at the plasma
      membrane by IDA. Placing it inside the immature spore inverts the compartment, the same error
      made for sigma-K. This term leads or appears in the top five of five different sporulation genes
      in the cohort regardless of which compartment each protein occupies.
