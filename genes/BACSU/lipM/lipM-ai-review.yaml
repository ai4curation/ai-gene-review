- term:
    id: GO:0016979
    label: lipoate-protein ligase activity
  evidence_type: IGI
  original_reference_id: PMID:20882995
  qualifier: enables
  negated: true
  review:
    summary: 'NOT lipoate-protein ligase activity: LipM fails to complement an E. coli lipA lplA strain
      supplied with lipoate, so it lacks ligase activity.'
    action: ACCEPT
    reason: This is a negated (NOT) annotation and it is correct. GO:0016979 is ATP-dependent ligation
      of free lipoate. In the full text, lipM expression rescued an E. coli lipB lplA strain without lipoate
      but failed to rescue a lipA lplA strain given lipoate, which only a ligase could do, and the authors
      conclude that LipM lacks lipoate ligase activity despite its similarity to LplA. The companion paper
      shows that LplJ is the sole lipoate ligase of B. subtilis. The negative annotation usefully separates
      LipM from the ligases it resembles.
    supported_by:
    - reference_id: PMID:20882995
      supporting_text: Therefore, despite its sequence similarity to E. coli LplA (Figure 8, and 9), YqhM
        lacks lipoate ligase activity and instead has octanoyltransferase activity (Figure 2).
    - reference_id: PMID:21338420
      supporting_text: We show that LplJ encodes the sole lipoyl ligase of this bacterium.
    - reference_id: file:BACSU/lipM/lipM-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Does not display lipoate protein ligase activity, despite its sequence similarity
        to LplA.
