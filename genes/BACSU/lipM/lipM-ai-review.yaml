  label: Bacillus subtilis subsp. subtilis str. 168
description: 'LipM is the octanoyltransferase that starts endogenous lipoic acid assembly in Bacillus
  subtilis. It transfers an octanoyl chain from octanoyl-acyl carrier protein, the product of type II
  fatty acid synthesis, specifically to the lipoyl lysine of the glycine cleavage H protein GcvH, through
  a thioester acyl-enzyme intermediate on Cys150. GcvH then acts as an intermediate carrier: the amidotransferase
  LipL moves the octanoyl group to the E2 subunits of the 2-oxoacid dehydrogenases, and lipoyl synthase
  LipA inserts the sulfur atoms. Although LipM resembles the lipoate-protein ligase LplA in sequence,
  it has no ligase activity, and deletion of lipM abolishes endogenous lipoylation, making cells lipoate
  auxotrophs whose requirement can be bypassed by acetate plus branched-chain fatty acid precursors. LipM-type
  enzymes are the octanoyltransferases of firmicutes and are also found in cyanobacteria.'
