  evidence_type: IMP
  original_reference_id: PMID:29196522
  qualifier: involved_in
  review:
    summary: MotI directly inhibits flagellar motility through the MotA stator.
    action: ACCEPT
    reason: Suppressor analysis, tethered-cell rotation, titration and localization establish a molecular
      clutch mechanism. This is participation by a direct motor regulator, not merely a downstream motility
      phenotype or an enzyme activity. Primary biochemical and cellular experiments used NCIB 3610 or
      derivatives, not an assumed 168 culture. The reviewed 168 sequence is identical end-to-end to the
      corresponding protein in the NCIB 3610 comI-Q12L chromosome CP020102.1; accession, length and SHA-256
      are recorded in the gene notes. This supports conserved protein activity without transferring strain-dependent
      biofilm capacity.
    supported_by:
    - reference_id: PMID:29196522
      supporting_text: MotI acts like a molecular clutch on the flagellar motor by interacting with MotA
        and preventing contact with FliG.
- term:
    id: GO:0140678
    label: molecular function inhibitor activity
  evidence_type: ISS
  original_reference_id: PMID:29196522
  supporting_entities:
  - NCBIProtein:AQZ91192.1
  review:
    summary: MotI non-covalently inhibits MotA motor function.
    action: NEW
    reason: Ligand binding alone omits the established regulatory output. MotI interacts with MotA to
      inhibit stator–rotor engagement, fitting the more specific molecular function inhibitor activity
      through non-covalent target binding without covalent modification; it is not a cytoskeletal motor
      regulator, so GO:0140659 is inappropriate. The assays used the NCIB 3610 background; ISS records
      transfer to the sequence-identical 168 protein, checked against AQZ91192.1 in CP020102.1. This term
      is absent from the seeded rows and their replacements.
    supported_by:
    - reference_id: PMID:29196522
      supporting_text: MotI acts like a molecular clutch on the flagellar motor by interacting with MotA
        and preventing contact with FliG.
