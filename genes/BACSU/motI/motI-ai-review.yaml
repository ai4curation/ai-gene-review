  label: Bacillus subtilis subsp. subtilis str. 168
description: MotI, also called DgrA or YpfA, is a PilZ-domain cyclic di-GMP receptor and flagellar motility
  inhibitor in Bacillus subtilis. Ligand-bound MotI interacts with the MotA stator protein and acts as
  a molecular clutch that uncouples stator–rotor engagement, reducing swimming speed or stopping motor-driven
  rotation. MotI occupies a soluble cytoplasmic pool and transient MotA-dependent membrane-associated
  puncta; ligand occupancy, expression level and the local cyclase network regulate its output.
