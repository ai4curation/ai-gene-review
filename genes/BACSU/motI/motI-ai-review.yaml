  review:
    summary: MotI has a cytoplasmic pool as well as transient membrane-associated foci.
    action: ACCEPT
    reason: Functional internal fluorescent fusions reveal cytoplasmic fluorescence and MotA-dependent
      membrane puncta, with distribution dependent on induction level. The cytoplasmic assignment remains
      informative for soluble receptor molecules; it is not evidence for an unrelated cellular location.
      Primary biochemical and cellular experiments used NCIB 3610 or derivatives, not an assumed 168 culture.
      The reviewed 168 sequence is identical end-to-end to the corresponding protein in the NCIB 3610
      comI-Q12L chromosome CP020102.1; accession, length and SHA-256 are recorded in the gene notes. This
      supports conserved protein activity without transferring strain-dependent biofilm capacity.
