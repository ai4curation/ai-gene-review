suggested_questions:
- question: Does YmfI retain any 3-oxoacyl-ACP reductase activity, or has the paralog lost FabG substrate
    recognition entirely?
- question: Should GO have a specific molecular function term for EF-P 5-aminopentanone reductase (NADPH)
    activity, and should a Rhea reaction be created for it?
- question: Should PAINT prune the YmfI-type clade (NCBIfam NF047420) from the FabG fatty acid elongation
    node PTN001211919?
suggested_experiments:
- hypothesis: YmfI has lost FabG activity and is specific for the EF-P-bound substrate.
  description: Assay purified YmfI with acetoacetyl-ACP or acetoacetyl-CoA and NADPH, test whether ymfI
    complements a conditional fabG mutant, and measure kinetics with EF-P-5-aminopentanone versus a free
    5-aminopentanone analogue.
- hypothesis: Structural features of YmfI recognise EF-P domain I around Lys32.
  description: Determine a YmfI structure, alone and in complex with modified EF-P, and test EF-P surface
    mutants for loss of YmfI-dependent reduction.
