  review:
    summary: NAD(P)-dependent CH-OH/carbonyl oxidoreductase activity, placed at a deep SDR node (PTN002449287).
      YmfI is shown to reduce the 5-aminopentanone group on EF-P Lys32 to 5-aminopentanol with NADPH
      (PMID:28787546).
    action: ACCEPT
    reason: 'The node assertion names only the chemistry shared across the classical SDR clade, and experiment
      bears it out for YmfI. The reaction it catalyses, EF-P-5-aminopentanol + NADP(+) = EF-P-5-aminopentanone
      + NADPH (run in the reductive direction), is a CH-OH/carbonyl interconversion with NADP as acceptor,
      so the term is right whatever the substrate specificity. No more specific GO term exists for this
      protein-bound substrate, and Rhea has no entry for the reaction (checked 2026-11-02), so this term
      is as precise as the ontology allows and it is the core activity. Unlike the fatty acid elongation
      row, this IBA does not depend on YmfI having kept FabG substrate specificity.'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002449287
        source_label: SDR ancestral node (PTHR42879)
        source_status: SUPPORTS_TRANSFER
        comment: The node asserts only the CH-OH/carbonyl plus NAD(P) chemistry shared by the whole
          classical SDR clade, which YmfI demonstrably performs on its own substrate, so the transfer
          holds even though YmfI's substrate differs from the seeds'.
      residue_claims_not_applicable: YmfI retains the SDR catalytic residues; Tyr150 is required in
        vivo (PMID:28787546). No residue loss is asserted.
    supported_by:
