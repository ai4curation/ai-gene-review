id: O31767
gene_symbol: ymfI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: YmfI is an NADPH-dependent short-chain dehydrogenase/reductase (SDR) of Bacillus subtilis
  that performs the last step of the post-translational modification of translation elongation factor
  P (EF-P). B. subtilis EF-P carries a 5-aminopentanol group on Lys32; YmfI reduces the carbonyl of the
  EF-P-bound 5-aminopentanone intermediate to give 5-aminopentanolylated EF-P. Purified YmfI acts on EF-P
  in vitro only with NADPH, and the conserved SDR active-site tyrosine (Tyr150) is needed in vivo. Without
  YmfI, EF-P accumulates in the 5-aminopentanone state, which inhibits swarming motility, the main process
  that needs EF-P in B. subtilis, whereas unmodified EF-P remains functional. Although YmfI is a paralog
  of the fatty acid synthesis enzyme FabG, B. subtilis has its own essential FabG and ymfI mutants grow
  almost normally, so YmfI is a dedicated EF-P-modifying enzyme rather than a fatty acid elongation enzyme.
