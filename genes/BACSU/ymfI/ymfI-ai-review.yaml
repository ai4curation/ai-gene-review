references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:28787546
  title: Carbonyl reduction by YmfI in Bacillus subtilis prevents accumulation of an inhibitory EF-P modification
    state.
  findings:
  - statement: YmfI reduces EF-P-bound 5-aminopentanone to 5-aminopentanol with NADPH, directly and
      sufficiently in vitro.
    supporting_text: We conclude that YmfI is an enzyme that directly catalyzes the reduction of 5-aminopentanone
      to 5-aminopentanol.
  - statement: In the absence of YmfI the 5-aminopentanone state accumulates and inhibits swarming motility;
      abolishing modification (EF-P K32R) suppresses the defect.
    supporting_text: In the absence of YmfI, accumulation of 5-aminopentanonated EF-P is inhibitory to
      swarming motility.
  - statement: The SDR active-site tyrosine Tyr150 is needed for YmfI function in vivo.
    supporting_text: The ectopic ymfI complementation construct did not restore swarming motility to the
      ymfI mutant, however, when the ymfI putative active site residue tyrosine 150 was mutated to an
      alanine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Hummels et al. 2017 Mol Microbiol 106:236-251); full text cached. Defines
      YmfI activity.
- id: PMID:27002156
  title: Translation Control of Swarming Proficiency in Bacillus subtilis by 5-Amino-pentanolylated Elongation
    Factor P.
  findings:
  - statement: B. subtilis EF-P carries a 5-aminopentanol moiety on Lys32 that is required for swarming
      motility.
    supporting_text: We identified a 5-aminopentanol moiety attached to Lys(32) of B. subtilis EF-P that
      is required for swarming motility.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Rajkovic et al. 2016, J Biol Chem 291:10976-10985, not mBio). Identifies
      the modification whose final step YmfI performs; does not itself study YmfI. Abstract-only in cache.
- id: PMID:29615499
  title: EF-P Posttranslational Modification Has Variable Impact on Polyproline Translation in Bacillus
    subtilis.
  findings:
  - statement: ynbB, gsaB and ymfI are required for EF-P 5-aminopentanolylation, which is assembled
      directly on EF-P; YmfI acts in the final step.
    supporting_text: Tandem mass spectrometry analysis of the PTM mutant strains indicated that ynbB,
      gsaB, and ymfI are required for modification
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Witzky et al. 2018 mBio 9:e00306-18); full text cached. Places YmfI
      at the last step and identifies the upstream enzymes.
