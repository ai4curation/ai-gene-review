- term:
    id: GO:0018205
    label: peptidyl-lysine modification
  evidence_type: IDA
  original_reference_id: PMID:28787546
  qualifier: involved_in
  review:
    summary: YmfI performs the final step of EF-P Lys32 5-aminopentanolylation, reducing the EF-P-bound
      5-aminopentanone (PMID:28787546).
    action: NEW
    reason: GOA has no process row apart from the over-propagated fatty acid elongation term. YmfI does
      the work on the modified residue itself; purified YmfI with NADPH converts EF-P isolated from a
      ymfI mutant, and in that mutant EF-P Lys32 carries 5-aminopentanone instead of 5-aminopentanol.
      YmfI also requires Lys32 to act. The term parallels the EpmC row (peptidyl-lysine hydroxylation,
      a child of this term) in the E. coli EF-P pathway. The modification is assembled on EF-P, so the
      protein is the substrate throughout and a peptidyl-lysine modification term, not a small-molecule
      biosynthesis term, is the right one.
    supported_by:
    - *id001
    - reference_id: PMID:28787546
      supporting_text: We further conclude, based on YmfI’s ability to alter EF-P electrophoretic mobility
        in vitro, that YmfI alone is capable of catalyzing the reduction reaction when the substrate is
        ligated to EF-P.
    - reference_id: PMID:28787546
      supporting_text: We conclude that YmfI requires EF-P lysine residue 32 to promote swarming motility
        and alter EF-P electrophoretic mobility.
    - &id005
      reference_id: PMID:29615499
      supporting_text: We have recently shown that YmfI reduces 5-aminopentanone to 5-aminopentanol in
        the final step of EF-P modification (24).
