  review:
    summary: Fatty acid elongation, propagated from the FabG (3-oxoacyl-ACP reductase) node PTN001211919,
      whose seeds are enterobacterial FabG proteins.
    action: REMOVE
    reason: 'YmfI sits in PANTHER subfamily PTHR42879:SF2 with FabG, so it inherits the FabG process,
      but the biology argues the node has been placed too deep for this clade. (1) The demonstrated YmfI
      substrate is a 5-aminopentanone moiety attached to EF-P Lys32, not a 3-oxoacyl-ACP. (2) B. subtilis
      encodes its own FabG (fabG/ylpF, BSU15910, UniProt P51831, RecName 3-oxoacyl-[acyl-carrier-protein]
      reductase FabG), and FabG is essential, whereas ymfI mutants lose only 5% of growth rate, the same
      slight defect as efp mutants, so YmfI is not doing fatty acid synthesis. (3) NCBIfam separates
      YmfI-type proteins into a dedicated EF-P modification family (NF047420 EF_P_mod_YmfI). No 3-oxoacyl-ACP
      reductase activity has been reported for YmfI. This is an over-propagation of the FabG process
      to a neofunctionalised paralog within the subfamily, which is the sanctioned use of REMOVE for
      an electronic inference; it is not a duplicate of the GO:0016616 row, which rests on the shared
      chemistry rather than on FabG substrate specificity.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001211919
        source_label: FabG node (PTHR42879)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node is sound for FabG itself, but it is placed above the YmfI-type clade; the
          family review records it as needing pruning so that EF-P-modifying paralogs are excluded.
      - source_id: UniProtKB:P0AEK2
        source_label: E. coli FabG
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Enterobacterial fatty acid synthesis seed; B. subtilis has its own dedicated, essential
          FabG (P51831), so the role is already filled in this organism.
      - source_id: UniProtKB:P0A2C9
        source_label: Salmonella FabG
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Second enterobacterial FabG seed; both seeds are from the same lineage and role.
      residue_claims_not_applicable: The argument is substrate specificity and organism gene content,
        not loss of a catalytic residue; YmfI keeps the SDR catalytic machinery.
    supported_by:
