id: Q04777
gene_symbol: alsD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: AlsD is the zinc-containing acetolactate decarboxylase of Bacillus subtilis. It converts
  acetolactate to (R)-acetoin and carbon dioxide, connecting AlsS-dependent acetolactate formation to
  acetoin accumulation and downstream 2,3-butanediol production. The alsSD operon is induced during stationary-phase
  and anaerobic growth. The enzyme can convert both acetolactate enantiomers to (R)-acetoin; the native
  pathway supplies (S)-acetolactate.
