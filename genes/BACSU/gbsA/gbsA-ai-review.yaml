- term: &id002
    id: GO:0031456
    label: glycine betaine biosynthetic process
  evidence_type: IC
  original_reference_id: PMID:8752328
  qualifier: involved_in
  review:
    action: NEW
    summary: GbsA supplies the aldehyde-to-betaine reaction in the biosynthetic route.
    reason: This protein performs the oxidation step rather than serving only as a required
      substrate or regulator. Native radiolabeled precursor conversion, differential precursor
      rescue and heterologous complementation identify the GbsAB route; purified GbsA enzymology
      independently establishes the final reaction. Same-role E. coli BetA/BetB comparator checks
      and the biosynthetic-process scope support this annotation convention; no additional ancestor
      process is added.
    supported_by:
    - reference_id: PMID:9297465
      supporting_text: 'The enzyme was specific for

        glycine betaine aldehyde and could use both NAD+ and NADP+ as cofactors, but

        NAD+ was strongly preferred.'
    - reference_id: file:BACSU/gbsB/gbsB-source-analysis/round1-primary-excerpts.txt
      supporting_text: "Mutations\nin the gbsAB and gbsB genes confer different growth pheno-\ntypes in
        high-osmolarity medium in the presence of glycine\nbetaine aldehyde. The D(gbsAB::neo)2 mutant
        strain JBB5\ncould not use this compound for osmoprotection, whereas the\ngbsA1\ngbsB strain JBB4
        was able to grow in high-osmolarity\nmedium containing 1 mM glycine betaine aldehyde (Fig. 5A).\n\
        The inability of strains JBB5 and JBB4 to use choline as an\nosmoprotectant is a reflection of
        a defect in the glycine betaine\nsynthesis pathway in these strains (Fig. 5B). The gbsAB1\nstrain\n\
        JH642 accumulated choline and converted it quantitatively\ninto glycine betaine (Fig. 5B, lanes
        1 and 2), whereas choline\nwas taken up by strains JBB5 and JBB4 but no glycine betaine\nwas synthesized
        (Fig. 5B, lanes 3 to 6). Thus, the gbsAB gene\ncluster is essential for the synthesis of glycine
        betaine in B.\nsubtilis.\n"
