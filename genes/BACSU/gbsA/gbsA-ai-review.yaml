id: P71016
gene_symbol: gbsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GbsA is a soluble betaine-aldehyde dehydrogenase that oxidizes betaine aldehyde to glycine
  betaine in Bacillus subtilis. It performs the second step of the choline-derived osmoprotectant
  biosynthetic route after GbsB. Purified GbsA is a homodimer and strongly prefers NAD+ over NADP+,
  although both can support oxidation. The enzyme tolerates high salt and glycine-betaine concentrations,
  enabling compatible-solute accumulation during osmotic stress; consumption of the reactive aldehyde
  also limits precursor toxicity.
