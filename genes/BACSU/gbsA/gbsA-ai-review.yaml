      panel contains propionaldehyde, pivalaldehyde, isovaleraldehyde, acetaldehyde and benzaldehyde
      at 0.5 or 50 mM; it does not assay the substrate named by GO:0019145. Thus the authors'
      specificity statement does not establish a negative result for aminobutyraldehyde
      dehydrogenase (NAD+) activity. PAINT places GbsA below PTN009173044; heterogeneous descendant
      activities alone do not demonstrate that this particular ancestral assertion was placed too
      deeply, and no target-specific loss is established. Retain UNDECIDED rather than promoting an
      untested capability or declaring over-propagation without discriminating evidence. This is
      uncertainty after reading the full paper, not an access limitation. The molecular-function
      claim does not require membership in a plant or animal pathway; absence of such a pathway
