  evidence_type: IDA
  original_reference_id: PMID:23893111
  qualifier: enables
  review:
    summary: PdeH hydrolyzes c-di-GMP to pGpG.
    action: ACCEPT
    reason: Purified PdeH converts substrate to pGpG in LC–MS-MS assays, and loss/complementation experiments
      establish control of cellular messenger levels. These experiments support both the curated IDA and
      EC-derived row. Primary biochemical and cellular experiments used NCIB 3610 or derivatives, not
      an assumed 168 culture. The reviewed 168 sequence is identical end-to-end to the corresponding protein
      in the NCIB 3610 comI-Q12L chromosome CP020102.1; accession, length and SHA-256 are recorded in
      the gene notes. This supports conserved protein activity without transferring strain-dependent biofilm
      capacity.
    supported_by:
    - reference_id: PMID:23893111
      supporting_text: c-di-GMP was hydrolyzed to pGpG when incubated with PdeH
