id: P14203
gene_symbol: pdeH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: PdeH (formerly YuxH) is the experimentally established cyclic di-GMP phosphodiesterase of
  Bacillus subtilis. Its EAL catalytic domain hydrolyzes the cyclic messenger to linear pGpG in a magnesium-dependent
  reaction. PdeH limits cellular c-di-GMP accumulation and thereby opposes activation of the MotI/DgrA
  motility inhibitor; this degradation arm can influence the global messenger pool alongside local cyclase–receptor
  interactions.
