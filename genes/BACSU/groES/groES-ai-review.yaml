- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000080668
  - UniProtKB:P9WPE5
  review:
    summary: The ancestral metal-binding inference remains unresolved for Bacillus GroES.
    action: UNDECIDED
    reason: The PAINT assertion represents an ancestral judgment, not merely a transfer from one donor.
      Mycobacterial Cpn10 directly binds metals, and E. coli GroES has calcium-responsive assembly, but
      target coordination/site conservation has not been established here. No PAINT loss was found and
      no loss is asserted; retain uncertainty rather than reject the claim from donor count or from lack
      of a target assay alone.
    supported_by:
    - reference_id: file:BACSU/groES/groES-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: Belongs to the GroES chaperonin family.
    - reference_id: PMID:11807250
      supporting_text: The binding sites for metal ions in the dome loop of cpn10 have been identified
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:P9WPE5
        source_status: UNRESOLVED
        comment: Mtb Cpn10 has direct dome-loop metal-binding evidence; this establishes the source activity,
          but Bacillus target coordination and ancestral conservation have not been established. No PAINT
          loss is asserted.
