status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GroES is the heptameric cochaperonin of Bacillus subtilis. It binds the apical face of a
  GroEL ring and caps the folding chamber, enabling substrate encapsulation and productive protein folding.
  This heat-inducible cytoplasmic protein contributes to the ATP-dependent chaperonin cycle through its
  structural and regulatory role; GroEL supplies the ATPase machinery.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018369
  - InterPro:IPR020818
  review:
    summary: The electronic ATP-binding transfer lacks target-specific confirmation.
    action: UNDECIDED
    reason: The cochaperonin caps an ATP-driven machine, but nucleotide binding by the GroEL partner does
      not establish binding by GroES. Direct physical tests on E. coli GroES are negative (PMID7867782);
      those tests do not assay this target. No target-specific nucleotide-binding assay was recovered,
      and the mycobacterial Cpn10 ATP-transport proposal in PMID12837792 is explicitly hypothetical. Preserve
      the row as unresolved rather than infer an independent ATPase or claim a universal negative.
    supported_by:
    - reference_id: file:BACSU/groES/groES-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: GroES binds to the apical surface of the GroEL ring, thereby capping the opening
        of the GroEL channel.
    - reference_id: PMID:7867782
      supporting_text: Using rigorous physical methods, isothermal calorimetry and equilibrium binding,
        no interaction between GroES and nucleotides could be detected.
