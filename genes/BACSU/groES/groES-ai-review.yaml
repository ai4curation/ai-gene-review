  findings:
  - statement: Native Bacillus GroE depletion changes HrcA function and native GroEL is affinity-captured;
      purified activation reactions use E. coli GroEL/GroES.
    supporting_text: An in vitro binding assay using affinity chromatography showed direct and specific
      interaction between HrcA114 and GroEL.
