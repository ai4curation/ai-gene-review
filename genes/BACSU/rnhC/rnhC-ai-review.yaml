taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: RnhC is RNase HIII, a magnesium-dependent ribonuclease that cleaves RNA paired to DNA. It
  resolves longer RNA-DNA hybrids, including R loops, and internally incises RNA primers during Okazaki
  fragment processing, facilitating subsequent PolA-dependent repair in reconstituted reactions. Metal
  availability affects its substrate preference; single-ribonucleotide incision is measurable in vitro
  but inefficient under physiological metal conditions compared with RnhB.
