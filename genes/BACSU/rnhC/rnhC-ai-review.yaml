  review:
    action: REMOVE
    summary: Bacterial RNase HIII is not the RNase H2 protein complex.
    reason: The current GO definition requires a protein complex whose catalytic subunit belongs to RNase
      H2/HII. RnhC is the experimentally distinguished HIII enzyme; the purified single-polypeptide HIII
      activity and HIII-specific architecture do not support membership in the H2 complex. Shared RNase
      HII/HIII ancestry is not evidence of this specific complex membership.
    supported_by:
    - *id001
