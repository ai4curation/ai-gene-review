  - UniProtKB:P10442
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: RnhC can incise single ribonucleotides in vitro, but efficient physiological RER is assigned
      to RnhB.
    reason: The checked term describes removal of an embedded ribonucleotide and replacement with deoxyribonucleotide.
      RnhC shows metal-dependent single-rNMP incision, so the chemistry is not categorically absent. However,
      activity is much less effective under physiological metal conditions than RnhB, whereas RnhC efficiently
      processes longer hybrids. The real in-vitro activity has an unresolved native contribution; therefore
      flag physiological RER propagation as over-annotation rather than infer a complete catalytic loss
      from RNase HIII identity.
    supported_by:
    - *id004
- term: &id006
    id: GO:0033567
    label: DNA replication, Okazaki fragment processing
  evidence_type: IDA
  original_reference_id: PMID:30670546
  review:
    action: NEW
    summary: RnhC directly cleaves primer RNA during reconstituted Okazaki processing.
    reason: RnhC itself performs internal RNA cleavage on model Okazaki fragments and increases processing
      with PolA; this is direct catalytic participation, not an inference from growth necessity. GO0033567
      is under DNA metabolism and lagging-strand synthesis, not the existing RNA-catabolic branch, and
      no existing or proposed term duplicates it. The same-role primer-removal comparator FenA P54161
      carries this exact term in QuickGO. E. coli PolA P00582 has broader replication annotations but
      no exact GO0033567 row; yeast Rad27 P26793 and human FEN1 P39748 instead carry GO0043137 for primer
      removal. These results support annotating enzymes that execute primer removal while documenting
      heterogeneous process granularity, not a presumed universal annotation gap. GO0043137 is not a descendant
      of GO0033567 in the checked ontology; it overlaps the existing RNA-catabolic branch and is not additionally
      proposed. The GO-CAM index has no target entry. Sequence identity between strain 168 and PY79 is
      established, while strain-specific growth phenotypes remain distinguished.
    supported_by:
    - *id003
    - *id001
    - *id005
