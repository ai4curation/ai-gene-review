id: O35020
gene_symbol: mnmA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: MnmA is an ATP-dependent tRNA-uridine 2-sulfurtransferase that introduces sulfur at C2 of
  wobble uridine. In Bacillus subtilis it works with the adjacent cysteine desulfurase YrvO/IscS1 through
  an abbreviated sulfur-delivery pathway. Biochemical reconstitution and genetic complementation support
  this cognate pair, distinct from the Tus-dependent relay of Escherichia coli.
