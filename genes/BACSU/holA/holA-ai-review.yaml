id: P54459
gene_symbol: holA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: HolA is the delta subunit of the Bacillus subtilis DNA clamp-loader complex. It assembles
  with three DnaX/tau and one HolB/delta-prime subunit to support opening and loading of the beta sliding
  clamp onto primed DNA. This structural contribution promotes processive chromosome replication; HolA
  is not the DNA-polymerizing catalytic subunit.
