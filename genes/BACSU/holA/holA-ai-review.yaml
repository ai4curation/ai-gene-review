  review:
    action: UNDECIDED
    summary: Direct DNA binding by the isolated subunit is not resolved.
    reason: Complex formation and clamp-loading contribution do not establish an autonomous DNA-binding
      interface on this subunit. The broad domain-based assignment may represent a property of the loader,
      but the accessible target experiments do not settle it.
