- term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010372
  - EC:2.7.7.7
  review:
    action: MODIFY
    summary: Replace polymerase catalysis with the subunit’s contribution to DNA clamp loading.
    reason: The biological connection to replication is sound, but nucleotide incorporation belongs to
      PolC/DnaE. DnaX, HolA and HolB form the tau3–delta–delta-prime loader. The replacement is interpreted
      as contributes_to at subunit level, as represented in the core function; the preserved machine row
      is not evidence of autonomous polymerase activity.
    supported_by: *id001
    proposed_replacement_terms:
    - id: GO:0003689
      label: DNA clamp loader activity
