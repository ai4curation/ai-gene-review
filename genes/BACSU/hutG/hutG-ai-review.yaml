id: P42068
gene_symbol: hutG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  HutG of Bacillus subtilis is a binuclear manganese formimidoylglutamase
  (N-formimino-L-glutamate formiminohydrolase, EC 3.5.3.8) of the arginase
  (ureohydrolase) family. It hydrolyses N-formimidoyl-L-glutamate, the
  product of the conserved histidase-urocanase-imidazolonepropionase trunk,
  directly to L-glutamate and formamide, completing the one-step terminal
  route of histidine utilization encoded in the hut operon. The purified
  enzyme has an alkaline pH optimum and prefers Mn(2+) over other divalent
  cations.
existing_annotations:
- term:
    id: GO:0006548
    label: L-histidine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005923
  - UniRule:UR000099065
  review:
    summary: >-
      HutG performs the terminal FIGLU-to-glutamate step of histidine
      catabolism in B. subtilis.
    action: ACCEPT
    reason: >-
      HutG itself catalyses a pathway step, the hydrolysis of
      N-formimidoyl-L-glutamate to L-glutamate and formamide, so this is
      participation rather than mere necessity. The curated UniProt pathway
      statement, backed by the primary enzymology of Kaminskas et al., places
      the enzyme in histidine degradation, and the gene lies in the hut
      operon. The route-specific child terms for the formamide and formate
      branches are obsolete, so GO:0006548 is the appropriate process term.
    supported_by:
    - reference_id: file:BACSU/hutG/hutG-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: "glutamate; L-glutamate from N-formimidoyl-L-glutamate (hydrolase"
    - reference_id: file:BACSU/hutG/hutG-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR005923; HutG."
- term:
    id: GO:0008783
    label: agmatinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G08870
  - AGI_LocusCode:AT4G08900
  - CGD:CAL0000194495
  - PANTHER:PTN000144486
  - UniProtKB:P60651
  - UniProtKB:Q57757
  - UniProtKB:Q5JI38
  review:
    summary: >-
      Agmatinase activity propagated from PAINT node PTN000144486 into the
      HutG formimidoylglutamase subfamily.
    action: REMOVE
    reason: >-
      The IBD node is seeded by agmatinases and plant dual arginase/agmatinase
      enzymes, but P42068 sits in PTHR11358:SF35, the formimidoylglutamase
      subfamily, whose members have diverged to hydrolyse the formimino group
      of N-formimidoyl-L-glutamate. B. subtilis HutG has a characterized
      histidine-degradation activity and its HAMAP and NCBIfam rules are
      HutG-specific; no agmatine turnover has been reported for it. The
      PTHR11358 family review records SF35 as diverged and the agmatinase
      grant as excluding SF35, so this is an over-propagation below the
      seeded node rather than a feature of the enzyme.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000144486
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Agmatinase node seeded by agmatinases and plant arginase/agmatinase
          enzymes; the SF35 formimidoylglutamase clade below it has diverged
          to N-formimidoyl-L-glutamate hydrolysis.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11358/PTHR11358-review.yaml
      supporting_text: "This does not extend agmatinase"
    - reference_id: file:BACSU/hutG/hutG-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR11358:SF35; FORMIMIDOYLGLUTAMASE; 1."
    - reference_id: file:BACSU/hutG/hutG-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: "DR   NCBIfam; TIGR01227; hutG; 1."
