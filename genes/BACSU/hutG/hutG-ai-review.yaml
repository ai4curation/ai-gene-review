suggested_questions:
- question: >-
    Do any SF35 formimidoylglutamases retain measurable agmatinase activity,
    which would justify keeping PTN000144486's agmatinase IBD over this
    subfamily rather than pruning it?
suggested_experiments:
- description: >-
    Assay purified B. subtilis HutG with agmatine and L-arginine alongside
    N-formimidoyl-L-glutamate to test whether the ancestral agmatinase
    activity has been lost in the SF35 subfamily.
