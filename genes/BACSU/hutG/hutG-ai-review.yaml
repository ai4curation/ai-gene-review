      in histidine degradation; it produces L-glutamate and formamide, not
      putrescine. The process is inherited only because the subfamily sits
      below PTN000144486, and is removed with the agmatinase row.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
