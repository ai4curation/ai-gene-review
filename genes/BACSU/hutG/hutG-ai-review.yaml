- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000099065
  review:
    summary: >-
      HutG is a binuclear manganese enzyme; the purified enzyme uses Mn(2+)
      preferentially.
    action: KEEP_AS_NON_CORE
    reason: >-
      Manganese binding is real and is required for catalysis by the
      binuclear-metal ureohydrolase active site, and the cofactor preference
      was measured on the B. subtilis enzyme. Cofactor binding supports the
      formimidoylglutamase activity rather than being a separate function, so
      it is kept as non-core.
    supported_by:
    - reference_id: file:BACSU/hutG/hutG-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: "Note=Binds 2 manganese ions per subunit. Can also use other divalent"
    - reference_id: file:BACSU/hutG/hutG-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "DR   InterPro; IPR020855; Ureohydrolase_Mn_BS."
