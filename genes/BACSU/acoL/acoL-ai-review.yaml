- id: PMID:10368162
  title: Biochemical and molecular characterization of the Bacillus subtilis acetoin catabolic
    pathway.
  findings:
  - statement: Native strain168 acoA disruption eliminates detectable E1 activity and acetoin-supported
      stationary-cell growth; E2/E3 roles additionally use comparative sequence evidence.
    supporting_text: 'These experiments clearly demonstrated that an aco -encoded

      AoDH ES is present in B. subtilis and that it is the major

      enzyme system responsible for the catabolism of acetoin.'
    reference_section_type: RESULTS
  - statement: Component-specific sequence features support the inferred enzyme role, rather
      than an isolated native-subunit assay.
    supporting_text: 'AcoL exhibited the putative flavin adenine dinucleotide-binding domain

      ( 5 ) at the N-terminal region, an active disulfide bridge

      site at position Cys 38 and Cys 43 , a putative

      NAD(H)-binding region in the central part, and the putative interface

      region at the C terminus and therefore matched the characteristic

      properties of dihydrolipoamide dehydrogenases ( 16 , 22 ).'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected.
- id: PMID:20508247
  title: Lipoic acid metabolism in microbial pathogens.
  findings:
  - statement: B. subtilis encodes a separate pyruvate dehydrogenase E3 (PdhD) besides the acetoin-cluster
      AcoL.
    supporting_text: Bacillus subtilis contains the PDH E1α, E1β, E2, and E3 subunits (encoded by
      pdhA , pdhB , pdhC , and pdhD , respectively)
  - statement: The reconstituted Pelobacter acetoin dehydrogenase rejects pyruvate and alpha-ketoglutarate.
    supporting_text: Reconstituted AoDH containing the E1, E2, and E3 subunits from the bacterium
      Pelobacter carbinolicus is specific for acetoin and does not use pyruvate or α-ketoglutarate
      as substrate
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review article; cached full text checked for the quoted statements.
- id: PMID:1898934
  title: Purification and characterization of acetoin:2,6-dichlorophenolindophenol oxidoreductase,
    dihydrolipoamide dehydrogenase, and dihydrolipoamide acetyltransferase of the Pelobacter
    carbinolicus acetoin dehydrogenase enzyme system.
  findings:
  - statement: Purified native E1, E2 and E3 reconstitute acetoin-dependent CoA-linked NAD reduction;
      artificial DCPIP assays are a separate measurement.
    supporting_text: 'The combination of purified Ao:DCPIP OR, DHLTA, and

      DHLDH in the presence of thiamine pyrophosphate and the substrate acetoin or

      methylacetoin resulted in a coenzyme A-dependent reduction of NAD.'
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Native E3 is dimeric and NAD(H)-specific; its N terminus contains the FAD-binding
      site.
    supporting_text: 'DHLDH had a

      native Mr of 110,000, consisted of two identical subunits of Mr 54,000, and

      reacted only with NAD(H) as a coenzyme. The N-terminal amino acid sequence

      included the flavin adenine dinucleotide-binding site and exhibited a high

      degree of homology to other DHLDHs.'
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract inspected; normal forced retrieval and full-text provider chain did
      not recover the scanned full article. Only explicit abstract results are used. Comparative
      Pelobacter biochemistry is not represented as a direct target-species assay.
