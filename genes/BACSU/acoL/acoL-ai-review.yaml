gene_symbol: acoL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: AcoL is the FAD-dependent dihydrolipoyl dehydrogenase associated with the acetoin
  catabolic system in Bacillus subtilis strain 168. It reoxidizes the reduced protein-bound
  lipoyl cofactor while reducing NAD+, allowing repeated cycles of acetoin cleavage and acetyl-CoA
  production. Its E3 assignment is supported by the acoABCL locus, the native acetoin-use phenotype
  and conserved FAD-, NAD(H)- and redox-disulfide features; these observations do not establish
  a separately purified Bacillus E3 assay.
