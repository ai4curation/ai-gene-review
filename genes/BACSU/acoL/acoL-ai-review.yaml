- term:
    id: GO:0006103
    label: 2-oxoglutarate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000530299
  - RGD:735073
  - SGD:S000001876
  - UniProtKB:P09622
  - UniProtKB:P0A9P0
  review:
    summary: Housekeeping-E3 2-oxoglutarate role propagated to the operon-encoded acetoin-system
      E3; likely over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: PTN000530299 is seeded by housekeeping dihydrolipoamide dehydrogenases (yeast LPD1, E.
      coli Lpd, human DLD) that serve the 2-oxoglutarate dehydrogenase complex. B. subtilis AcoL is
      instead the E3 encoded in the acetoin-specific acoABCL cluster, and B. subtilis separately
      encodes the pyruvate dehydrogenase E3 PdhD. No experiment places AcoL in a 2-oxoglutarate
      dehydrogenase complex, and the reconstituted homologous Pelobacter acetoin system does not
      use alpha-ketoglutarate. Shared E3 chemistry makes a minor 2-oxoglutarate role not
      impossible, so the row is marked over-annotated rather than removed; the PAINT node itself
      is sound for its housekeeping descendants.
    supported_by:
    - reference_id: PMID:10368162
      supporting_text: 'AcoL exhibited the putative flavin adenine dinucleotide-binding domain

        ( 5 ) at the N-terminal region, an active disulfide bridge

        site at position Cys 38 and Cys 43 , a putative

        NAD(H)-binding region in the central part, and the putative interface

        region at the C terminus and therefore matched the characteristic

        properties of dihydrolipoamide dehydrogenases ( 16 , 22 ).'
      reference_section_type: RESULTS
    - reference_id: PMID:1898934
      supporting_text: 'DHLDH had a

        native Mr of 110,000, consisted of two identical subunits of Mr 54,000, and

        reacted only with NAD(H) as a coenzyme. The N-terminal amino acid sequence

        included the flavin adenine dinucleotide-binding site and exhibited a high

        degree of homology to other DHLDHs.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:10368162
      supporting_text: Inverted repeats were identified 6 bp downstream from acoL and 100 bp upstream
        from acoA , thus further indicating the separation of acoR and ORF1 from the genes of a putative
        acoABCL operon.
      reference_section_type: RESULTS
    - reference_id: PMID:20508247
      supporting_text: Bacillus subtilis contains the PDH E1α, E1β, E2, and E3 subunits (encoded by
        pdhA , pdhB , pdhC , and pdhD , respectively)
    - reference_id: PMID:20508247
      supporting_text: Reconstituted AoDH containing the E1, E2, and E3 subunits from the bacterium
        Pelobacter carbinolicus is specific for acetoin and does not use pyruvate or α-ketoglutarate
        as substrate
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000530299
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The PTHR22912 IBD is sound for housekeeping E3 descendants that serve the
          2-oxoglutarate dehydrogenase complex. AcoL is the acetoin-cluster E3 paralog in a genome that
          also encodes the housekeeping PdhD, so the process transfer to AcoL is not supported.
