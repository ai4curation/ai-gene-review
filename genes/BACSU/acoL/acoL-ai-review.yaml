  review:
    summary: AcoL has the E3 dihydrolipoyl dehydrogenase chemistry.
    action: ACCEPT
    reason: The NAD+-dependent reoxidation of reduced lipoyl residues is the E3 recycling step.
      The 1999 native locus study identifies the FAD/NAD(H)-binding and active-disulfide features
      of AcoL; curated sequence features and the PAINT PTN000530299 activity assertion corroborate
      a conserved E3 role. This is functional inference, not a purified Bacillus E3 measurement.
    supported_by:
    - reference_id: PMID:10368162
      supporting_text: 'AcoL exhibited the putative flavin adenine dinucleotide-binding domain

        ( 5 ) at the N-terminal region, an active disulfide bridge

        site at position Cys 38 and Cys 43 , a putative

        NAD(H)-binding region in the central part, and the putative interface

        region at the C terminus and therefore matched the characteristic

        properties of dihydrolipoamide dehydrogenases ( 16 , 22 ).'
      reference_section_type: RESULTS
    - reference_id: PMID:1898934
      supporting_text: 'DHLDH had a

        native Mr of 110,000, consisted of two identical subunits of Mr 54,000, and

        reacted only with NAD(H) as a coenzyme. The N-terminal amino acid sequence

        included the flavin adenine dinucleotide-binding site and exhibited a high

        degree of homology to other DHLDHs.'
      reference_section_type: ABSTRACT
