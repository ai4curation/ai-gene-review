- term:
    id: GO:0180001
    label: cyclic-di-AMP binding
  evidence_type: IDA
  original_reference_id: PMID:33790011
  qualifier: enables
  review:
    summary: Bind cyclic di-AMP through the RCK_C domain to sense the messenger at the KhtTU antiporter.
    action: NEW
    reason: Direct biochemical and structural assays establish c-di-AMP binding by this gene product.
      The activity is absent from the seed annotation rows, and is neither an ancestor nor a descendant
      of another proposed activity. This adds a demonstrated molecular function, not an inference from
      a downstream phenotype.
    supported_by:
    - reference_id: PMID:33790011
      supporting_text: We have confirmed c-di-AMP binding to KhtT and determined the crystal structure
        of this complex.
