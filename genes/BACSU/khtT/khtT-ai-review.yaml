  review:
    summary: KhtT regulates the membrane transporter KhtU rather than independently transporting cations.
    action: MODIFY
    reason: The RCK domain belongs to a cytosolic regulatory subunit. Reconstitution in PMID:33790011 shows
      that KhtU alone transports potassium and that adding KhtT restrains that activity; c-di-AMP relieves
      restraint. The specific supported molecular role is transporter regulation. This is a correction
      of the role, not a descendant refinement of transport chemistry.
    proposed_replacement_terms:
    - id: GO:0141108
      label: transporter regulator activity
