id: O07535
gene_symbol: khtT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: KhtT is the cytosolic regulatory subunit of the Bacillus subtilis KhtTU potassium/proton
  antiporter. Its RCK_C domain binds cyclic di-AMP. Apo-KhtT restrains KhtU-mediated potassium export,
  whereas cyclic di-AMP binding relieves this restraint; alkaline pH increases the sensitivity of the
  complex to the messenger. KhtU supplies the membrane transport pathway and can transport without KhtT.
