  review:
    summary: KhtT controls potassium export through its interaction with KhtU.
    action: MODIFY
    reason: 'The experimentally executed role is regulation of potassium transport: apo-KhtT slows KhtU
      and ligand binding relieves the brake. Refine the process to that regulatory role without assigning
      the membrane transport step to the cytosolic subunit. The sign is conditional on ligand state, so
      a sign-neutral regulatory term is appropriate.'
    proposed_replacement_terms:
    - id: GO:0043266
      label: regulation of potassium ion transport
    supported_by:
    - reference_id: PMID:33790011
      supporting_text: indicating that KhtT inhibits the function of KhtU, in accordance with our in vitro
        data and previous findings
    - reference_id: PMID:33790011
      supporting_text: demonstrating that c-di-AMP activates KhtTU and that pH increases its sensitivity
        to this nucleotide.
