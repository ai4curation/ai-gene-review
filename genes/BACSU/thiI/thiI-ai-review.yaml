gene_symbol: thiI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  ThiI of Bacillus subtilis is the tRNA-uracil-4 sulfurtransferase that makes
  4-thiouridine (s4U) at position 8 of tRNA. It is the short, Firmicutes-type ThiI:
  N-terminal THUMP and ferredoxin-like tRNA-binding domains and a PP-loop (AANH)
  pyrophosphatase domain that adenylates U8, but no C-terminal rhodanese-like domain.
  Its sulfur comes from the adjacent cysteine desulfurase NifZ (B. subtilis lacks a
  canonical IscS), and ThiI with NifZ makes s4U in vitro. Without a rhodanese
  domain, sulfur appears to pass through an alternative transient site. Gene
  inactivation shows that thiI and nifZ are required for tRNA s4U but not for
  thiamine biosynthesis. Unlike E. coli and Salmonella ThiI, B. subtilis ThiI
  therefore has no role in thiazole or thiamine synthesis.
