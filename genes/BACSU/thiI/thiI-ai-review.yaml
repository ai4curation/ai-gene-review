- term:
    id: GO:0009229
    label: thiamine diphosphate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000075655
  - UniPathway:UPA00060
  review:
    summary: Contradicted for B. subtilis; thiI is not required for thiamine.
    action: REMOVE
    reason: >-
      The UniRule/UniPathway rule assumes the E. coli-type bifunctional ThiI. B.
      subtilis ThiI lacks the rhodanese domain, which in Salmonella is necessary and
      sufficient for thiazole synthesis, and B. subtilis thiI inactivation leaves
      thiamine synthesis intact. Target-specific experimental evidence contradicts
      the inference.
    supported_by:
    - reference_id: PMID:22773787
      supporting_text: Gene inactivation experiments in B. subtilis indicate the requirement of ThiI and NifZ for the biosynthesis of 4-thiouridine, but not thiamine
    - reference_id: PMID:22773787
      supporting_text: in Bacillus subtilis and most species from the Firmicutes phylum, ThiI lacks the rhodanese domain that contains the site responsible for the sulfurtransferase activity
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniRule:UR000075655
      requested_change: CHECK
      asserted_value: GO:0009229
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        UniRule UR000075655 (HAMAP MF_00021) assigns thiamine diphosphate biosynthesis
        (UniPathway UPA00060) to all ThiI. Rhodanese-less ThiI, as in B. subtilis and
        most Firmicutes, is not required for thiamine (PMID:22773787), and the
        rhodanese domain is what supports thiazole synthesis in Salmonella
        (PMID:21724998). The pathway and ThiS-related statements should be conditioned
        on the C-terminal rhodanese domain (IPR026340 / TIGR04271 ThiI_C_thiazole),
        which O34595 lacks.
      supported_by:
      - reference_id: PMID:21724998
        supporting_text: the C-terminal rhodanese domain of ThiI was sufficient for thiazole synthesis in vivo
