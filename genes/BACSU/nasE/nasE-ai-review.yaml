  review:
    summary: NasDE activity is cytosolic.
    action: MODIFY
    reason: 'The primary fractionation experiment resolves the broad cytoplasm annotation to cytosol:
      nearly all native NasDE activity partitioned there, with none in the membrane fraction.'
    supported_by:
    - reference_id: PMID:9765565
      supporting_text: No nitrite reductase activity was detected in the membrane fraction, whereas nearly
        all activity was present in the cytosolic fraction, indicating that the NasDE enzyme is a cytoplasmic
        protein.
