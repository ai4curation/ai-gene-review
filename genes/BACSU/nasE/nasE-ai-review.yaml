  review:
    summary: The two donor-specific nitrite reductase activities are experimentally distinguishable.
    action: MODIFY
    reason: Native NasDE strongly favors NADH but also exhibits NADPH-dependent activity below 10% of
      the NADH activity. Resolve the combined term to both supported donor-specific activities; the minor
      NADPH reaction does not imply equal physiological importance. NasE is a required complex subunit;
      this does not assert an isolated NasE active site.
    supported_by:
    - reference_id: PMID:9765565
      supporting_text: NADH-dependent nitrite reductase activity was detected in a cell extract prepared
        from the wild-type strain grown with nitrite, but activity with NADPH was much lower; no activity
        was detected when ammonium was used as sole nitrogen source (Table 2).
    - reference_id: PMID:9765565
      supporting_text: Activity with NADPH was less than 10% of that with NADH.
    - reference_id: PMID:9765565
      supporting_text: However, extracts prepared from LAB1943 and LAB1982 grown with nitrite or ammonium
        in the presence of IPTG had no significant nitrite reductase activity, indicating that both nasD
        and nasE genes are required for enzyme activity.
    proposed_replacement_terms:
    - id: GO:0106316
      label: nitrite reductase (NADH) activity
    - id: GO:0106314
      label: nitrite reductase (NADPH) activity
