taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: NasE is the small Rieske-like subunit of the cytosolic Bacillus subtilis 168 NasDE nitrite
  reductase. It is required with NasD for NADH-preferring reduction of nitrite to ammonium and is predicted
  to bind a 2Fe-2S cluster. The assembled enzyme supports both nitrogen assimilation and anaerobic nitrite
  reduction; NasE is not independently established as a nitrite-reducing catalyst.
