- term:
    id: GO:0042128
    label: nitrate assimilation
  evidence_type: IC
  original_reference_id: PMID:9765565
  review:
    summary: NasE contributes to nitrate assimilation as a component of the assimilatory nitrite reductase.
    action: NEW
    reason: NasE supplies a component of the enzyme performing the nitrite-to-ammonium step, rather than
      being its substrate or only a regulator. Native JH642-lineage experiments establish loss of enzyme
      activity and nitrite-supported growth after nasE disruption even when downstream nasF expression
      is restored; sequence and cofactor evidence identify the small enzyme component. This supports participation
      in nitrate assimilation beyond generic growth necessity. Exact-term queries found no GO:0042128
      annotation on the ECOLI, PSEPK and MYCS2 NirD-family small-subunit comparators, so absence alone
      is not treated as a curation gap. The native functional evidence motivates this proposal; the existing
      annotation on the noncatalytic NasB electron-transfer component also shows that catalytic autonomy
      is not a requirement for this process. No process ancestor or descendant is already asserted for
      NasE, and the cached GO-CAM index contains no target entry.
    supported_by:
    - reference_id: PMID:9765565
      supporting_text: However, extracts prepared from LAB1943 and LAB1982 grown with nitrite or ammonium
        in the presence of IPTG had no significant nitrite reductase activity, indicating that both nasD
        and nasE genes are required for enzyme activity.
    - reference_id: PMID:9765565
      supporting_text: Since it was previously shown that NasD and NasE have high homology to subunits
        of nitrite reductases (17), together these results confirm that the nasD and the nasE genes encode
        subunits of assimilatory nitrite reductase.
