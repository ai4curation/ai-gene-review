id: O06492
gene_symbol: gatC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GatC is the small structural subunit of the GatCAB tRNA-dependent amidotransferase in Bacillus
  subtilis, supporting assembly and stability. Both glutamyl-tRNA(Gln) and aspartyl-tRNA(Asn) can feed
  the indirect pathways in this organism, which also retains a direct AsnS route.
existing_annotations:
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000033428
  review:
    summary: GatC participates in modification of the amino acid already esterified to tRNA.
    action: MODIFY
    reason: The transamidase changes the amino-acid side chain on already-charged tRNA; it does not itself
      perform the initial aminoacyl-ester formation. Use charged-tRNA amino acid modification for this
      direct role. This is a role-specific refinement of the broader translation context, preserving actual
      enzymatic or structural participation.
    supported_by: &id002
    - &id003
      reference_id: PMID:9342321
      supporting_text: The enzyme furnishes a means for formation of correctly charged Gln-tRNA Gln through
        the transamidation of misacylated Glu-tRNA Gln
    - &id001
      reference_id: file:BACSU/gatC/gatC-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Structural subunit of the Asp/Glu-tRNA(Asn/Gln) amidotransferase complex GatCAB
        (Probable). GatCAB allows the formation of correctly charged Asn-tRNA(Asn) or Gln-tRNA(Gln) through
        the multi- step transamidation of misacylated Asp-tRNA(Asn) or Glu-tRNA(Gln) in organisms which
        lack either or both of asparaginyl-tRNA or glutaminyl- tRNA synthetases (PubMed:9789001). The
        reaction takes place in the presence of glutamine and ATP through an activated phospho-Asp- tRNA(Asn)
        or phospho-Glu-tRNA(Gln). This subunit forms a belt that wraps around the interface of the catalytic
        subunits A and B to stabilize the complex (By similarity). {ECO:0000255|HAMAP- Rule:MF_00122,
        ECO:0000269|PubMed:9789001, ECO:0000305|PubMed:9789001}.
    proposed_replacement_terms:
    - id: GO:0019988
      label: charged-tRNA amino acid modification
- term:
    id: GO:0006450
    label: regulation of translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003837
  - InterPro:IPR036113
  review:
    summary: GatC-mediated complex stability supports fidelity of tRNA-dependent amino-acid conversion.
    action: ACCEPT
    reason: The term concerns modulation of genetic-code interpretation and is not restricted to ribosomal
      decoding factors. Native-target assembly evidence and the conserved GatC scaffold support the existing
      family inference. Mycobacterial experiments independently show that GatCAB/transamidosome stability
      can tune specific mistranslation without simply abolishing catalytic activity. This is a conserved
      mechanistic inference for the target, not a measured Bacillus or PAO1 error-rate phenotype. PMID:33072044
      further identifies a gatC stop-codon mutation producing a GatC–GatA fusion with increased specific
      mistranslation in M. smegmatis; extrapolation to this target is based on conserved scaffold function,
      not an asserted native stress phenotype.
    supported_by:
    - *id001
    - reference_id: PMID:34225495
      supporting_text: 'alteration of GatCAB stability may be a mechanism for modulation of

        translational fidelity.'
    - reference_id: PMID:33072044
      supporting_text: A forward genetic screen identifies a GatC-GatA fusion that mediates high rates
        of mistranslation.
- term:
    id: GO:0070681
    label: obsolete glutaminyl-tRNAGln biosynthesis via transamidation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000385050
  - UniProtKB:O43716
  review:
    summary: GatC participates in modification of the amino acid already esterified to tRNA.
    action: MODIFY
    reason: The transamidase changes the amino-acid side chain on already-charged tRNA; it does not itself
      perform the initial aminoacyl-ester formation. Use charged-tRNA amino acid modification for this
      direct role. The live GO record explicitly obsoletes GO:0070681 as a pathway variant and cautions
      against automatic migration to tRNA charging.
    supported_by: *id002
    proposed_replacement_terms:
    - id: GO:0019988
      label: charged-tRNA amino acid modification
