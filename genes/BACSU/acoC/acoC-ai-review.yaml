core_functions:
- description: Lipoyl-dependent transfer of acetyl to CoA in acetoin breakdown. This E2 reaction
    is chemically shared with other dehydrogenase systems; its chemistry does not by itself
    assign AcoC to a pyruvate dehydrogenase complex.
