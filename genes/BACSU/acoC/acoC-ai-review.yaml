  label: Bacillus subtilis subsp. subtilis str. 168
description: AcoC is the lipoyl-bearing E2 acetyltransferase of the acetoin catabolic system
  in Bacillus subtilis strain 168. Its lipoyl arm accepts acetyl equivalents generated by AcoA/AcoB,
  and its acetyltransferase activity transfers acetyl to coenzyme A, producing acetyl-CoA and
  a reduced lipoyl arm for E3-dependent reoxidation. The E2 assignment rests on the native aco
  pathway and conserved lipoyl and catalytic features; the published acoC clone differs slightly
  at its C terminus from the reference sequence.
