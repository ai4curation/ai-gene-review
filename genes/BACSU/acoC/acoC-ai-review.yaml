  review:
    summary: AcoC catalyzes the E2 lipoyl-to-CoA acetyl transfer.
    action: ACCEPT
    reason: The native-system assignment, lipoyl-bearing architecture and curated E2 chemistry
      support this reaction as a functional inference. GO:0004742 is written reversibly; acetoin
      catabolism uses the acetyl-CoA-forming direction. Its acceptance does not imply membership
      in a pyruvate-specific complex. The AF006075 clone differs slightly from reference O31550,
      so the reference protein is not presented as an independently assayed identical construct.
    supported_by:
    - reference_id: PMID:10368162
      supporting_text: 'The N-terminal

        region of B. subtilis AcoC shares most characteristics with

        the dihydrolipoamide acyltransferases of various origins—such as

        Lys 43 , which is presumably lipoylated, and

        Gly 33 and Gly 54 , which flank this lysine

        residue—and with the corresponding C-terminal catalytic domains of

        various dihydrolipoamide acyltransferases, including the conserved

        putative active-site histidine-aspartate couple ( 3 , 16 , 22 ).'
      reference_section_type: RESULTS
