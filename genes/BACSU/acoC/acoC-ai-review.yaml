- id: PMID:10368162
  title: Biochemical and molecular characterization of the Bacillus subtilis acetoin catabolic
    pathway.
  findings:
  - statement: Native strain168 acoA disruption eliminates detectable E1 activity and acetoin-supported
      stationary-cell growth; E2/E3 roles additionally use comparative sequence evidence.
    supporting_text: 'These experiments clearly demonstrated that an aco -encoded

      AoDH ES is present in B. subtilis and that it is the major

      enzyme system responsible for the catabolism of acetoin.'
    reference_section_type: RESULTS
  - statement: Component-specific sequence features support the inferred enzyme role, rather
      than an isolated native-subunit assay.
    supporting_text: 'The N-terminal

      region of B. subtilis AcoC shares most characteristics with

      the dihydrolipoamide acyltransferases of various origins—such as

      Lys 43 , which is presumably lipoylated, and

      Gly 33 and Gly 54 , which flank this lysine

      residue—and with the corresponding C-terminal catalytic domains of

      various dihydrolipoamide acyltransferases, including the conserved

      putative active-site histidine-aspartate couple ( 3 , 16 , 22 ).'
    reference_section_type: RESULTS
  - statement: The published acoC sequence has minor C-terminal differences from the earlier
      reference sequence.
    supporting_text: 'It was

      identical with the sequence recently deposited in the data bank by

      others ( 17 , 34 ), except for a few minor deviations in the

      carboxy-terminal region of acoC and one deviation in acoR , which all occurred in not
      highly conserved regions.'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected.
