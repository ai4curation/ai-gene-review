- term:
    id: GO:0004122
    label: cystathionine beta-synthase activity
  evidence_type: IDA
  original_reference_id: PMID:17056751
  qualifier: enables
  review:
    summary: The cited purified-enzyme experiment contradicts cystathionine beta-synthase activity.
    action: REMOVE
    reason: The full results of PMID17056751 test homocysteine with either serine or OAS. Neither colorimetric
      nor HPLC analysis detects cystathionine from CysK; only YrhA/MccA is positive with OAS. Thus this
      positive IDA row contradicts its cited target-specific assay, rather than merely naming a different
      gene in the title. The original payload is preserved.
    supported_by:
    - reference_id: file:BACSU/cysK/cysK-source-analysis/primary-evidence.md
      supporting_text: Under the same conditions, no cystathionine β-synthase activity was detected with
        CysK.
    - reference_id: PMID:17056751
    source_defects:
    - defect_type: MISSING_NEGATION
      resource: CAFA
      slot: Qualifier
      asserted_value: enables
      corrected_value: NOT|enables
      corrected_label: NOT cystathionine beta-synthase activity under the assayed conditions
      requested_change: CHECK
      cause: UNKNOWN
      confidence: CONFIRMED
      explanation: 'The frozen source row assigns UniProtKB:P37887 (B. subtilis 168 CysK) a positive GO:0004122
        IDA, PMID:17056751, assigned_by CAFA, date 20170124. The full Results test purified CysK-His6
        with 10 mM homocysteine and serine: HPLC and ninhydrin detect no cystathionine. Replacing serine
        by OAS also gives no CysK product, whereas YrhA/MccA is positive with OAS. Thus the positive assertion
        contradicts the cited target assay. Withdraw the positive row and review a NOT-qualified annotation
        with the experimental scope; the proposed corrected qualifier is not a claim of zero activity
        under every possible condition. The separate positive OAS/sulfide cysteine-synthase annotation
        remains valid. No undocumented gene-symbol collision is inferred.'
      supported_by:
      - reference_id: file:BACSU/cysK/cysK-source-analysis/primary-evidence.md
        supporting_text: Under the same conditions, no cystathionine β-synthase activity was detected
          with CysK.
      report_status: NOT_REPORTED
