taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CysK is the principal PLP-dependent O-acetylserine sulfhydrylase of Bacillus subtilis168,
  forming cysteine from O-acetylserine and sulfide. The homodimer also binds the transcriptional repressor
  CymR and stabilizes promoter association. O-acetylserine weakens this regulatory complex, coupling enzyme-substrate
  availability to cysteine-metabolism gene expression. CysK does not require a CysE-CysK complex for catalysis
  under the tested conditions.
