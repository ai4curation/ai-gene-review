    summary: Methionine utilization phenotypes do not establish direct methionine breakdown by this enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: CysK recaptures sulfide into cysteine and regulates CymR-dependent sulfur metabolism. The
      cysK single mutant grows on methionine; the double-mutant phenotype supports an alternative downstream
