id: P54576
gene_symbol: mcpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: McpC is a plasma-membrane methyl-accepting chemotaxis receptor of Bacillus subtilis
  that mediates responses to many amino acids. Its extracellular sensing domain directly binds
  several amino acids and also interacts with transport-associated binding proteins that support
  indirect sensing. CheD deamidates cytoplasmic Gln609, increasing receptor-dependent activation
  of CheA; CheD binding supplies an additional activation mechanism.
