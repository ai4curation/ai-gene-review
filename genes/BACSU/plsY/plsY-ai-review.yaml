- gap_statement: The source of sn-glycerol 1-phosphate in B. subtilis, and whether its supply rather
    than acyltransferase specificity sets the fraction of heterochiral lipid, is unresolved.
  boundary: AraM (EgsA) is the only known bacterial glycerol-1-phosphate dehydrogenase, but
    engineered E. coli made correctly configured archaeal lipids without AraM, so at least one other
    route to glycerol 1-phosphate exists in bacteria and is unidentified.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: If glycerol 1-phosphate supply is limiting, the stereochemistry of the bacterial
    membrane is set upstream of PlsY, and the acyltransferases are permissive rather than
    determining; that distinction decides whether a stereo-specific molecular function term belongs
    on PlsY at all.
  resolution: Quantify glycerol 1-phosphate pools and lipid backbone chirality in wild-type and araM
    deletion B. subtilis, and search genetically for the alternative route suggested by the
    engineered E. coli result.
  provenance:
  - reference_id: PMID:42286214
