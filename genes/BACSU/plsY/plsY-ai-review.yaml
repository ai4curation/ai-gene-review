proposed_new_terms:
- proposed_name: acyl-phosphate glycerol-1-phosphate acyltransferase activity
  proposed_definition: 'Catalysis of the reaction: acyl phosphate + sn-glycerol 1-phosphate =
    3-acyl-sn-glycerol 1-phosphate + orthophosphate.'
  justification: GO has acyl-phosphate glycerol-3-phosphate acyltransferase activity (GO:0043772)
    for the PlsX/PlsY reaction on the R enantiomer, and an OLS search of the acyltransferase branch
    found no counterpart for sn-glycerol 1-phosphate, the S enantiomer that archaeal lipids use.
    Purified B. subtilis and E. coli PlsY acylate glycerol 1-phosphate as well as glycerol
    3-phosphate, so the reaction is directly observed and there is currently no way to state it in
    GO. The term is requested so that the observation can be recorded when a curator judges it
    annotatable; this review does not itself assert the activity for B. subtilis PlsY in vivo,
    because the enzyme prefers glycerol 3-phosphate in a membrane, no kinetic constants exist, the
    in vivo source of glycerol 1-phosphate is unidentified, and the heterochiral lipid report that
    motivates the inference comes from a single laboratory. The companion reaction on the product
    side, acylation of (S)-lysophosphatidic acid by PlsC, has the same status and would be a
    separate request.
  proposed_parent:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  supported_by:
  - reference_id: PMID:42286214
    supporting_text: While PlsB is strictly stereospecific for glycerol
      3-phosphate, PlsY and PlsC can utilize both stereo-forms of the
      glycerol-phosphate.
    reference_section_type: ABSTRACT
  - reference_id: PMID:42286214
    supporting_text: Similar to BsPlsY, EcPlsY can utilize both G1P and G3P, resulting in the
      synthesis of two stereospecific version of LPA.
    reference_section_type: RESULTS
knowledge_gaps:
- gap_statement: Whether PlsY acylates sn-glycerol 1-phosphate in the living cell, and so whether
    it has a second, stereochemically distinct physiological reaction, is unknown.
  boundary: What is established is that purified B. subtilis PlsY acylates glycerol 1-phosphate as
    well as glycerol 3-phosphate in detergent, with only minor differences in product levels, and
    that in liposomes it still acylates glycerol 1-phosphate but clearly prefers glycerol
    3-phosphate; separately, that B. subtilis phosphatidylglycerol contains both glycerol-phosphate
    enantiomers. What is unknown is whether the glycerol 1-phosphate-backbone lipid is made by
    PlsY, what supplies its glycerol 1-phosphate in vivo, and what the kinetic preference is.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: B. subtilis is the test case for the lipid divide being crossable within ordinary
    bacterial phospholipid biosynthesis. If PlsY acylates glycerol 1-phosphate in vivo, one
    bacterial enzyme accounts for heterochiral membranes, and GO currently has no term for that
    reaction.
  resolution: Measure the dependence of glycerol 1-phosphate-backbone phosphatidylglycerol on PlsY
    and on glycerol 1-phosphate supply, by chiral lipid analysis of an araM (egsA) deletion and of
    PlsY-depleted cells complemented with the strictly glycerol 3-phosphate-specific E. coli PlsB,
    and determine kinetic constants for both enantiomers on reconstituted PlsY.
  provenance:
  - reference_id: PMID:42286214
