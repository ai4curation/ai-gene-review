taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: PlsY (formerly YneS) is the glycerol-phosphate acyltransferase that performs the
  first acylation step of membrane phospholipid synthesis in Bacillus subtilis. It is a small
  polytopic integral protein of the cytoplasmic membrane that transfers a fatty acyl group from
  acyl-phosphate, made from acyl-ACP by PlsX, to sn-glycerol 3-phosphate to form
  1-acyl-sn-glycerol 3-phosphate (lysophosphatidic acid); it uses neither acyl-CoA nor acyl-ACP
  as donor, and is inhibited by acyl-CoA. B. subtilis lacks PlsB, so PlsY is its only
  glycerol-phosphate acyltransferase and is required for phospholipid synthesis and growth.
  Purified PlsY also acylates sn-glycerol 1-phosphate in vitro, at levels close to those with
  glycerol 3-phosphate in detergent but with a clear glycerol 3-phosphate preference when
  reconstituted in a membrane. That activity could account for the minor glycerol
  1-phosphate-backbone phosphatidylglycerol reported in B. subtilis, but its use in the living
  cell has not been shown.
