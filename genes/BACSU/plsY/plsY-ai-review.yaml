      sn-glycerol 1-phosphate in detergent, with only minor differences in product levels, whereas
      PlsB is strictly specific for glycerol 3-phosphate.
    supporting_text: Remarkably, the addition of glycerol 3-phosphate, as well as glycerol
      1-phosphate, resulted in the substantial production of LPA, with only minor differences in
      quantities over time.
    reference_section_type: RESULTS
  - statement: When PlsY is reconstituted into liposomes the glycerol 3-phosphate product
      predominates significantly, so the near-equal use of the two enantiomers is a property of the
      detergent assay rather than of the membrane-embedded enzyme.
    supporting_text: However, the levels of (R)-LPA (containing a G3P lipid backbone) were
      significantly higher compared to the levels of (S)-LPA, a difference that was not observed for
      the enzyme in detergent (Fig.
    reference_section_type: RESULTS
  - statement: The authors infer that in vivo heterochirality of B. subtilis phosphatidylglycerol
      follows from PlsY being the sole GPAT; this is a consistency argument, not a measurement in
      cells, and the authors state that kinetic analysis is still required.
    supporting_text: As in this microorganism, PlsY is its sole GPAT, the observed in vivo
