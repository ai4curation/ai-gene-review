- id: PMID:35767906
  title: Chiral analysis of glycerol phosphates - can bacteria biosynthesize heterochiral
    phospholipid membranes?
  findings:
  - statement: Both glycerol-phosphate enantiomers were detected in B. subtilis and three other
      Gram-positive bacteria, with a 4:1 ratio of glycerol 3-phosphate to glycerol 1-phosphate, and
      both enantiomers were found in the glycerol backbone of some phosphatidylglycerol species.
    supporting_text: By using chiral chromatography, the presence of both enantiomers in the glycerol
      backbone of some molecular species of PG was revealed.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: PubMed-verified identifier, title and journal (J Chromatogr A 1676:463267, 2022);
      this is the Palyzova et al. 2022 report cited by Rieche et al. Marked UNVERIFIED rather than
      VERIFIED because only the abstract is cached, the result is a single laboratory's and has not
      been independently replicated, and the abstract does not state how backbone glycerol was
      distinguished from the sn-1-linked headgroup glycerol of phosphatidylglycerol. The whole in
      vivo heterochirality argument for PlsY rests on this report.
- id: PMID:12682299
