core_functions:
- description: Catalyses the first acylation of bacterial phospholipid synthesis, transferring a
    fatty acyl group from acyl-phosphate (supplied by PlsX from acyl-ACP) to the sn-1 position of
    sn-glycerol 3-phosphate to give lysophosphatidic acid, in the cytoplasmic membrane. As the only
    glycerol-phosphate acyltransferase of B. subtilis, it commits glycerol 3-phosphate and newly
    made fatty acids to membrane phospholipid, and its loss stops phospholipid synthesis entirely.
  molecular_function:
    id: GO:0043772
    label: acyl-phosphate glycerol-3-phosphate acyltransferase activity
