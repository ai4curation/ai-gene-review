suggested_questions:
- question: Should GO provide stereochemistry-neutral parent terms for the glycerol-phosphate
    acylation reactions, with the G3P and G1P reactions as children, rather than only the
    G3P-specific terms it has now?
  experts:
  - GO molecular function curators
  - lipid metabolism curators
- question: Given that PlsY is the sole GPAT of B. subtilis and that its phosphatidylglycerol
    carries both backbone enantiomers, what evidence would GO require before annotating a
    stereo-alternative activity to a bacterial acyltransferase?
  experts:
  - GO Consortium biocurators
  - bacterial lipid biochemists
- question: Is the acyl-phosphate route the point at which the glycerol-phosphate enantiomer is
    selected, or is selection made upstream by the dehydrogenases that supply G3P and G1P?
  experts:
  - Bacterial membrane lipid biochemists
suggested_experiments:
- hypothesis: The minor glycerol 1-phosphate-backbone phosphatidylglycerol of B. subtilis is made by
    PlsY acting on glycerol 1-phosphate.
  description: Deplete PlsY in cells complemented by E. coli plsB, which is strictly specific for
    glycerol 3-phosphate, and analyse membrane phospholipid backbone chirality by chiral
    chromatography-mass spectrometry. Loss of the S-backbone species on PlsB-only complementation
    would show the activity is PlsY's; its persistence would point to another enzyme or to a
    headgroup artefact.
  experiment_type: genetic complementation plus chiral lipidomics
- hypothesis: Glycerol 1-phosphate supply, not PlsY specificity, limits heterochiral lipid
    production.
  description: Compare backbone chirality and glycerol 1-phosphate pools in wild type, an araM
    (egsA) deletion, and a strain overexpressing araM, by GC/MS and LC/MS of glycerol phosphates and
    chiral analysis of phosphatidylglycerol.
  experiment_type: metabolite and lipid quantification in defined mutants
- hypothesis: PlsY discriminates between the glycerol-phosphate enantiomers kinetically, with a
    preference that depends on the membrane environment.
  description: Determine steady-state kinetic constants of reconstituted B. subtilis PlsY for
    glycerol 3-phosphate and glycerol 1-phosphate in a single-enzyme assay with chemically
    synthesised acyl-phosphate, in detergent and in liposomes, so the coupled-assay limitation of
    the published work is removed.
  experiment_type: enzyme kinetics on reconstituted protein
