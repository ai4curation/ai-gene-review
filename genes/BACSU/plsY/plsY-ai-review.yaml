      plsC (yhdO) and plsX are among them, and this work is the source of the essentiality claim
      used for the PlsX/PlsY pathway.
    supporting_text: Among approximately 4,100 genes of the organism, only 192 were shown to be
      indispensable by this or previous work.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
