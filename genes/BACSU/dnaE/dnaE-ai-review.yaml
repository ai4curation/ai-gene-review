taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaE is the DnaE3-type DNA polymerase of Bacillus subtilis that cooperates with PolC in chromosome
  replication. It efficiently extends RNA primers made by DnaG, allowing subsequent rapid elongation by
  PolC. DnaE has no intrinsic 3′–5′ proofreading exonuclease; its fidelity is influenced by the beta clamp,
  PolC proofreading and mismatch repair. Its functions extend beyond a simple assignment as the bulk lagging-strand
  polymerase.
