- id: PMID:10216873
  title: Two evolutionarily closely related ABC transporters mediate the uptake of choline for synthesis
    of the osmoprotectant glycine betaine in Bacillus subtilis.
  findings:
  - statement: Primary complex-level uptake evidence; JH642 and RMKB assay strains are derivatives
      of 168, not independently purified reference-strain subunits. Full author-hosted article inspected.
      OpuCC has a documented two-residue difference between the original study sequence and the genome-project
      sequence; the other OpuC components were reported identical. Subunit ATPase/permease assignment
      is sequence/mechanism-based; lipoprotein modification was tested.
    supporting_text: 'Molecular analysis allowed us to demonstrate that the opuB and opuC operons
      each

      encode a binding protein-dependent ABC transport system that consists of four

      components.'
