- id: PMID:9925583
  title: High-affinity transport of choline-O-sulfate and its use as a compatible solute in Bacillus subtilis.
  findings:
  - statement: OpuC acquires choline-O-sulfate from the environment for osmoprotection.
    supporting_text: 'choline-O-sulfate

      was specifically acquired from the environment via OpuC.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary complex-level uptake evidence; JH642 and RMKB assay strains are derivatives
      of 168, not independently purified reference-strain subunits. Full author-hosted article inspected.
      Choline-O-sulfate was not hydrolyzed and did not support sole C/N/S nutrition under the tested conditions.
- id: PMID:10216873
  title: Two evolutionarily closely related ABC transporters mediate the uptake of choline for synthesis
    of the osmoprotectant glycine betaine in Bacillus subtilis.
  findings:
  - statement: OpuC mediates high-affinity choline uptake; its measured apparent Km is 38 micromolar and
      Vmax is 75 nmol per minute per mg protein.
    supporting_text: 'Kinetic analysis of [14C]-choline uptake via OpuB (K(m) = 1

      microM; Vmax = 21 nmol min-1 mg-1 protein) and OpuC (K(m) = 38 microM; Vmax = 75

      nmol min-1 mg-1 protein) revealed that each of these ABC transporters exhibits

      high affinity and substantial transport capacity.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary complex-level uptake evidence; JH642 and RMKB assay strains are derivatives
      of 168, not independently purified reference-strain subunits. Full author-hosted article inspected.
      OpuCC has a documented two-residue difference between the original study sequence and the genome-project
      sequence; the other OpuC components were reported identical. Subunit ATPase/permease assignment
      is sequence/mechanism-based; lipoprotein modification was tested.
- id: PMID:8752321
  title: 'Three transport systems for the osmoprotectant glycine betaine operate in Bacillus subtilis:
    characterization of OpuD.'
  findings:
  - statement: Strains retaining individual uptake systems establish that OpuC transports glycine betaine
      with low-micromolar affinity.
    supporting_text: 'These mutants were used to determine the

      kinetic parameters for glycine betaine transport through OpuA, OpuC, and OpuD.

      Each of these uptake systems shows high substrate affinity, with Km values in

      the low micromolar range'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary complex-level uptake evidence; JH642 and RMKB assay strains are derivatives
      of 168, not independently purified reference-strain subunits.
- id: PMID:31061098
  title: 'Sustained sensing in potassium homeostasis: Cyclic di-AMP controls potassium uptake by KimA
    at the levels of expression and activity.'
  findings:
  - statement: OpuCA binds cyclic di-AMP in the DRaCALA screen.
    supporting_text: Of the proteins containing a CBS domain, the Mg 2+ transporter MgtE, the ATP-binding
      protein OpuCA of the compatible solute transporter OpuC and YkuL, a protein of unknown function,
      showed increased binding affinity toward the di-nucleotide ( Fig. 3 A ).
  - statement: Competition distinguishes specific cyclic-di-AMP binding from ATP binding.
    supporting_text: For all tested proteins, ATP was unable to block c-di-AMP binding, whereas cold c-di-AMP
      outcompeted the radioactively labeled c-di-AMP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Construct DNA is explicitly from B. subtilis 168; OpuCA is tested
      in the DRaCALA binding panel. The demonstrated KimA inhibition cannot be transferred to OpuCA.
