taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: OpuCA is the ATP-binding energy-coupling subunit of the Bacillus subtilis OpuC ABC importer.
  The assembled transporter acquires glycine betaine, choline, carnitine and choline-O-sulfate for
  osmoprotection. OpuC comprises the OpuCA ATPase, the OpuCB and OpuCD membrane proteins, and the
  OpuCC substrate-binding protein. Imported choline-O-sulfate accumulates intact as a compatible
  solute under the conditions studied, whereas imported choline can be converted to glycine betaine
  by separate enzymes. OpuCA also specifically binds cyclic di-AMP; the effect of this binding on
  native OpuC transport remains to be established.
