- term: &id004
    id: GO:0180001
    label: cyclic-di-AMP binding
  evidence_type: IDA
  original_reference_id: PMID:31061098
  qualifier: enables
  review:
    action: NEW
    summary: OpuCA directly and specifically binds cyclic di-AMP.
    reason: DRaCALA detected binding by recombinant OpuCA cloned from B. subtilis 168. Unlabeled cyclic
      di-AMP competed for binding, whereas ATP did not. The strain-provenance sentence identifies the
      construct; the binding and competition results establish this activity. The paper demonstrates transport
      inhibition for KimA, not for OpuCA, so no regulatory-process annotation follows from this experiment.
    supported_by:
    - reference_id: PMID:31061098
      supporting_text: Of the proteins containing a CBS domain, the Mg 2+ transporter MgtE, the ATP-binding
        protein OpuCA of the compatible solute transporter OpuC and YkuL, a protein of unknown function,
        showed increased binding affinity toward the di-nucleotide ( Fig. 3 A ).
    - reference_id: PMID:31061098
      supporting_text: For all tested proteins, ATP was unable to block c-di-AMP binding, whereas cold
        c-di-AMP outcompeted the radioactively labeled c-di-AMP.
