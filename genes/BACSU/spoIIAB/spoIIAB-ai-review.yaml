references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: Maps InterPro anti-sigma-factor family records to sigma factor antagonist
      activity, negative regulation of transcription, and sporulation-related GO terms.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: Phylogenetic-tree-based propagation supports SpoIIAB as an anti-sigma
      factor for sigma F, consistent with orthologs across Bacillus and other Firmicutes.
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings:
  - statement: UniProt keywords ATP-binding, Kinase, Nucleotide-binding, Serine/threonine-protein
      kinase, Sporulation, and Transferase map to the corresponding GO terms.
    supporting_text: "KW   ATP-binding; Direct protein sequencing; Kinase; Nucleotide-binding;"
- id: GO_REF:0000104
  title: Electronic Gene Ontology annotations created by transferring manual GO annotations
    between related proteins based on shared sequence features
  findings:
  - statement: Manual annotations from characterized anti-sigma-factor kinases (e.g.
      SpoIIAB, RsbW) are propagated by shared sequence features (ATP-binding kinase
      domain plus anti-sigma-factor fold).
- id: GO_REF:0000116
  title: Automatic Gene Ontology annotation based on Rhea mapping
  findings:
  - statement: UniProt/Rhea catalytic-activity mapping (EC 2.7.11.1; L-seryl/L-threonyl-protein
      + ATP → phospho-form + ADP) supports protein serine/threonine kinase activity.
    supporting_text: "Reaction=L-seryl-[protein] + ATP = O-phospho-L-seryl-[protein] + ADP +"
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Consensus of multiple IEA pipelines supports serine/threonine kinase
      activity and ATP binding for SpoIIAB, consistent with the manually curated function.
- id: PMID:25278935
  title: Cross-phosphorylation of bacterial serine/threonine and tyrosine protein
    kinases on key regulatory residues.
  findings:
  - statement: SpoIIAB is one of three two-component-like serine/threonine kinases
      in B. subtilis (with RsbT and RsbW) surveyed for cross-phosphorylation with
      Hanks-type and tyrosine kinases.
    supporting_text: "the three two-component-like serine/threonine kinases: RsbT (Kang et al., 1998), RsbW (Yang et al., 1996), and SpoIIAB (Min et al., 1993)"
  - statement: SpoIIAB is among the recipient kinases most readily cross-phosphorylated
      by Hanks-type kinases in this in vitro survey, suggesting integration of SpoIIAB
      activity into a broader kinase network.
    supporting_text: "the BY-kinase PtkA and the two-component-like kinases RsbW and SpoIIAB show the highest propensity to be phosphorylated by other kinases"
suggested_questions:
- question: >-
    Do cross-phosphorylation events by Hanks-type kinases (e.g. PrkC, PrkD, YabT)
    on SpoIIAB reported in vitro (PMID:25278935) occur under physiological sporulation
    conditions in B. subtilis, and do they modulate the timing or amplitude of sigma F
    activation in the forespore?
- question: >-
    How is the septum-localized asymmetric release of sigma F from SpoIIAB coupled
    to SpoIIE phosphatase activity in the forespore, and what determines the precise
    threshold of SpoIIAA dephosphorylation required to titrate SpoIIAB and free sigma F?
suggested_experiments:
- hypothesis: >-
    Cross-phosphorylation of SpoIIAB by Hanks-type kinases modulates its
    anti-sigma-F activity or ATPase turnover during sporulation.
  description: >-
    Introduce phospho-mimetic and phospho-null substitutions at SpoIIAB residues
    identified as cross-phosphorylation targets and measure sigma F activity in vivo
    (e.g. using a P_spoIIQ-lacZ or fluorescent reporter), SpoIIAA phosphorylation
    kinetics in vitro, and sporulation efficiency. Include ΔprkC/ΔprkD/ΔyabT backgrounds
    to test whether removing the donor kinases perturbs sigma F timing.
  experiment_type: Site-directed mutagenesis + reporter assay + genetic epistasis
- hypothesis: >-
    Compartment-specific SpoIIAB degradation contributes to release of sigma F in
    the forespore, in addition to SpoIIE-driven SpoIIAA dephosphorylation.
  description: >-
    Use fluorescent tags on SpoIIAB and time-lapse microscopy of sporulating cells
    to quantify SpoIIAB abundance in mother cell versus forespore before and after
    septation. Combine with pulse-chase and protease-deficient backgrounds
    (e.g. ClpXP/LonA mutants) to test whether SpoIIAB turnover is asymmetric and
    protease-dependent.
  experiment_type: Live-cell fluorescence microscopy + pulse-chase
