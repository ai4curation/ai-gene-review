status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: YdaK is a four-pass membrane cyclic di-GMP receptor in Bacillus subtilis. Its catalytically
  degenerate GGDEF domain retains an I-site that binds the messenger and undergoes conformational changes,
  but does not synthesize c-di-GMP. YdaK interacts with the membrane cyclase DgcK and couples this local
  signal to the YdaLMN-associated extracellular polysaccharide system. The polymer and its physiological
  contribution to native biofilms remain incompletely characterized.
