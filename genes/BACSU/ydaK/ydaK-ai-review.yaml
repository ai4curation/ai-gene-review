  review:
    summary: YdaK is a four-pass plasma-membrane receptor.
    action: ACCEPT
    reason: Predicted transmembrane segments are supported by cellular localization and by the loss of
      the membrane-associated functional response when the N-terminal transmembrane region is removed.
      Primary biochemical and cellular experiments used NCIB 3610 or derivatives, not an assumed 168 culture.
      The reviewed 168 sequence is identical end-to-end to the corresponding protein in the NCIB 3610
      comI-Q12L chromosome CP020102.1; accession, length and SHA-256 are recorded in the gene notes. This
      supports conserved protein activity without transferring strain-dependent biofilm capacity.
    supported_by:
    - reference_id: PMID:32156823
      supporting_text: Purified soluble domains of DgcK, an integral membrane protein with 6 transmembrane
        helices (TMs), and of YdaK, which harbors 4 TMs
- term: &id001
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: ISS
  original_reference_id: PMID:23893111
  supporting_entities:
  - NCBIProtein:AQZ89334.1
  review:
    summary: YdaK binds c-di-GMP despite loss of GGDEF cyclase activity.
    action: NEW
    reason: Purified YdaK domain binds c-di-GMP in calorimetry, and later hydrogen–deuterium exchange
      and I-site mutagenesis establish ligand-dependent structural responses. This MF is absent from the
      seeded review. ISS records transfer from experimentally studied NCIB 3610 to the sequence-identical
      168 YdaK, checked against AQZ89334.1 (283 aa) in CP020102.1. No cyclase activity or generic biofilm
      process is inferred from the GGDEF domain alone.
    supported_by:
    - reference_id: PMID:23893111
      supporting_text: we were able to measure c-di-GMP binding to this domain, likely at the conserved
        I-site, with a dissociation constant of ∼1.1 μM
    - reference_id: PMID:32156823
      supporting_text: binding of c-di-GMP to YdaK leads to major conformational changes in the entire
        GGDEF domain
