proposed_new_terms:
- proposed_name: lipoteichoic acid primase activity
  proposed_definition: >-
    Catalysis of the transfer of the sn-glycerol-1-phosphate head group of
    phosphatidylglycerol onto the diglucosyl-diacylglycerol glycolipid anchor,
    producing 1,2-diacyl-sn-glycerol and the glycerophosphate-glycolipid primer
    (GroP-Glc2-DAG) that initiates polyglycerophosphate lipoteichoic acid
    synthesis; the enzyme adds only the first glycerophosphate unit and does not
    elongate the chain.
  justification: >-
    GO has no molecular function term for the LTA priming reaction (EC 2.7.8.-),
    which is mechanistically distinct from polymer elongation. The nearest term,
    GO:0016780, is a genus several levels too general and does not distinguish
    primase from synthase.
  proposed_parent:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
suggested_questions:
- question: >-
    What is the physiological role of the YvgJ-primed GroP-Glc2-DAG intermediate
    in B. subtilis, and do the polymer-forming synthases LtaS2/LtaS1/YqgS depend
    on YvgJ priming, or can they both prime and elongate?
suggested_experiments:
- description: >-
    Reconstitute the priming and elongation steps in vitro with purified YvgJ
    and a polymer-forming synthase (e.g. LtaS2) on defined glycolipid substrates,
    to test whether YvgJ-made GroP-Glc2-DAG is the preferred substrate for
    elongation.
  experiment_type: in vitro reconstitution
