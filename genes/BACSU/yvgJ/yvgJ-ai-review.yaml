core_functions:
- description: >-
    Lipoteichoic acid primase. Using phosphatidylglycerol as the
    glycerolphosphate donor, it transfers a single glycerolphosphate unit onto
    the diglucosyl-diacylglycerol glycolipid anchor at the outer face of the
    cytoplasmic membrane in a Mn2+-dependent manner, producing the GroP-Glc2-DAG
    primer. It does not elongate the polyglycerolphosphate backbone.
