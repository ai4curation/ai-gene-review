  review:
    summary: >-
      Phylogenetic propagation of transferase activity across the LTA synthase /
      OpgB family. YvgJ is an LTA primase: it transfers a single
      glycerolphosphate onto the glycolipid anchor.
    action: MODIFY
    reason: >-
      The activity is correct but very general. YvgJ transfers the
      glycerolphosphate head group of phosphatidylglycerol onto the glycolipid
      anchor (EC 2.7.8.-), a transfer of a substituted phosphate group, so
      GO:0016780 phosphotransferase activity, for other substituted phosphate
      groups is the most specific existing term. GO has no specific LTA primase
      term. Mn2+-dependent PG hydrolysis was shown in vitro for all four
      orthologues, and YvgJ specifically accumulates the GroP-Glc2-DAG primer.
    proposed_replacement_terms:
