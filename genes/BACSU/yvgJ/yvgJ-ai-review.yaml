id: O32206
gene_symbol: yvgJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  YvgJ (locus BSU33360) is one of four LtaS-type enzymes of Bacillus subtilis.
  It is a 617-residue polytopic membrane protein with five N-terminal
  transmembrane helices and a large extracytoplasmic catalytic domain of the
  alkaline phosphatase/sulfatase fold (LTA synthase family, PANTHER PTHR47371),
  with the conserved Mn2+-binding and active-site residues. Unlike the three
  polymer-forming synthases (LtaS2, LtaS1, YqgS), YvgJ functions as a
  lipoteichoic acid (LTA) primase: using phosphatidylglycerol as the
  glycerolphosphate donor, it transfers a single glycerolphosphate unit onto the
  diglucosyl-diacylglycerol glycolipid anchor, producing the GroP-Glc2-DAG
  glycolipid intermediate rather than a polyglycerolphosphate polymer. It
  hydrolyses phosphatidylglycerol in a Mn2+-dependent manner in vitro, but when
  expressed alone (in B. subtilis or in an S. aureus ltaS depletion strain) it
  does not produce detectable LTA polymer. The full-length protein is predicted
  to be cleaved after an AXA motif and the catalytic domain secreted. YvgJ is
  the B. subtilis counterpart of the Listeria monocytogenes LTA primase Lmo0644.
