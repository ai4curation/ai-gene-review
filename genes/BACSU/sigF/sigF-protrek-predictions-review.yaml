- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0045881
    label: positive regulation of sporulation resulting in formation of a cellular spore
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 14.31) and absent from GOA. Sigma-F does drive the early forespore transcriptional
      program and is required for sporulation to proceed, so positive regulation is directionally
      right at the level of the whole process; but the term is a regulation-of-process wrapper around
      the same generic sporulation content as rank 2, and sigma-F is better described as executing
      the program than as regulating it. Left uncertain. The substantive point for this gene is what
      is missing: neither sigma factor activity nor the compartment-specific forespore biology that
      distinguishes sigma-F from sigma-G appears anywhere.
    supported_by:
    - reference_id: file:BACSU/sigF/sigF-uniprot.txt
      supporting_text: >-
        RNA polymerase sigma-F factor
