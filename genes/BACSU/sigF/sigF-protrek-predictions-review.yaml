id: P07860
gene_symbol: sigF
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for sigma-F, the early forespore-specific sporulation sigma factor.
  This gene is one of three sporulation sigma factors in the cohort (sigF, sigG, sigK) and their ProTrek
  outputs are nearly interchangeable: all three lead with intracellular immature spore, then sporulation,
  then a sporulation refinement, and none of the three recovers sigma factor activity - the annotated
  core molecular function - anywhere in its top five. That is the same paralog-indistinguishability
  the BioReason evaluation reported for this trio, reproduced by a completely different model architecture.
  ProTrek's free-text channel does return sigma-factor descriptions at 21.7, so once again the GO
  channel is the weaker one. Assessment: 1 less precise (LSP), 2 uncertain (UNC).
