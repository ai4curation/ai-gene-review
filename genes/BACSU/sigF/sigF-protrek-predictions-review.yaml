predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0042763
    label: intracellular immature spore
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 14.75). Sigma-F is activated in the forespore compartment, so a forespore-associated
      localisation is not unreasonable; but intracellular immature spore denotes the developing spore
      as a structure, and sigma-F is a transcription factor acting on the forespore chromosome rather
      than a component of the spore. GOA carries no cellular-component annotation for this protein
      to check against. Recorded as uncertain, and noted as the term that leads the list for all three
      sporulation sigma factors regardless of which compartment each acts in.
    supported_by:
