- id: PMID:21824914
  title: A single methyltransferase YefA (RlmCD) catalyses both m5U747 and m5U1939 modifications in Bacillus
    subtilis 23S rRNA.
  findings:
  - statement: Native strain 168 knockout and complementation assign both rRNA methylation sites to YefA/RlmCD.
    supporting_text: Analysis of the rRNA from the ΔyefA::Cm strain by MALDI-MS showed that methylation
      had been lost at both U747 (Figure 2D) and U1939 (Figure 2E and F).
  - statement: An active yefA copy restores both methylations in the native deletion strain.
    supporting_text: Transforming this latter strain with an active copy of yefA on a plasmid restored
      to a significant degree the methylation at both U747 (Figure 2G) and U1939 (Figure 2H).
  - statement: The tested enzyme does not supply tRNA m5U; TrmFO carries the separate tRNA reaction.
    supporting_text: Further HPLC analysis showed that YefA is not involved in m5U modification of tRNAs
      (Supplementary Figure S5).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected, including strain 168 methods, native MALDI-MS loss/rescue, E. coli
      triple-null complementation, and tRNA HPLC controls. U747/U1939 use E. coli-equivalent numbering.
      No general essentiality or antibiotic-resistance phenotype is inferred.
