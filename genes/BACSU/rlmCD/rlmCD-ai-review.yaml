taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: RlmCD (YefA; BSU06730) is the Bacillus subtilis strain 168 S-adenosylmethionine-dependent
  23S rRNA uridine-C5 methyltransferase that forms m5U at two separated sites corresponding to Escherichia
  coli U747 and U1939. Native deletion and complementation establish both substrate sites, while expression
  in an E. coli methyltransferase-null strain independently demonstrates dual rRNA substrate recognition.
  RlmCD is not the tRNA U54 methyltransferase in this bacterium; that reaction is carried out by the unrelated
  folate-dependent TrmFO. Loss of RlmCD had no major viability effect under the standard laboratory conditions
  tested.
