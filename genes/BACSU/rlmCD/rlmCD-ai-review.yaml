core_functions:
- description: SAM-dependent C5 methylation of 23S rRNA at U747 and U1939 (E. coli-equivalent numbering),
    directly demonstrated by native strain 168 loss/rescue and supported by heterologous dual-site rescue.
    This is an rRNA reaction, distinct from TrmFO-dependent tRNA U54 methylation.
