id: C0SPB0
gene_symbol: ytcI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  ytcI encodes an uncharacterised AMP-forming acyl-CoA synthetase (acyl-CoA ligase) of Bacillus
  subtilis. Its AMP-binding and AMP-binding C-terminal domains and the conserved AMP-binding
  motif place it in the medium-chain acyl-CoA synthetase (ACSM) family of the ANL
  adenylate-forming superfamily, which activates carboxylic acids to their CoA thioesters
  through an acyl-adenylate intermediate. It has no fatty acid synthase domains. YtcI is the
  only member of this family in B. subtilis and is 58% identical to Staphylococcus aureus MbcS,
  an acyl-CoA synthetase that activates 2-methylbutyrate and isobutyrate to the acyl-CoA primers
  of branched-chain fatty acid synthesis. That makes YtcI a candidate short-chain,
  branched-chain acyl-CoA synthetase, but its substrate and physiological role have not been
  determined.
