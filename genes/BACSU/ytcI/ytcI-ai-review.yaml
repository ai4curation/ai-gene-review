- term:
    id: GO:0031956
    label: medium-chain fatty acid-CoA ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00086692
  review:
    summary: >-
      Unsupported chain-length specificity. The ARBA rule assigns medium-chain (C6-C12)
      activity, but the characterised relatives in YtcI's subfamily act on short-chain acids.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Nothing measured on YtcI supports a medium-chain substrate. The nearest characterised
      relative, MbcS (58% identity), activates the C4-C5 branched acids 2-methylbutyrate and
      isobutyrate, and the subfamily member Msed_0406 uses C2-C5 acids. The ARBA association
      rule likely reflects the mammalian medium-chain ACSM members of the wider family. The
      ligase activity itself is captured by the accepted GO:0015645 row.
    supported_by:
    - reference_id: PMID:36806679
      supporting_text: purified MbcS is an ATP-dependent acyl-CoA synthetase that selectively
        catalyzes the activation of 2-methylbutyrate and isobutyrate
      reference_section_type: ABSTRACT
    - reference_id: file:BACSU/ytcI/ytcI-uniprot.txt
      record_section: ["PE"]
      supporting_text: "PE   3: Inferred from homology;"
