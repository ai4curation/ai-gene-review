    summary: >-
      Correct at the precision family evidence supports. YtcI is an AMP-forming acyl-CoA
      synthetase; every characterised member of the family ligates CoA to a fatty acid.
    action: ACCEPT
    reason: >-
      The PTHR43605 root IBD for fatty acid ligase activity is seeded by eight experimentally
      characterised ACSM enzymes, and the characterised members of YtcI's own subfamily SF10,
      S. aureus MbcS and M. sedula Msed_0406, are short-chain fatty acid-CoA ligases. A more
      specific term (GO:0031955 short-chain fatty acid-CoA ligase activity) is likely but rests
      only on homology to MbcS, so the general term is kept and no refinement is asserted.
    supported_by:
    - reference_id: file:BACSU/ytcI/ytcI-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: DR   NCBIfam; NF047394; AcylCoAsynMbcS; 1.
