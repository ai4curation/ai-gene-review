- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2152200
  - MGI:MGI:99538
  - PANTHER:PTN001944787
  review:
    summary: >-
      The IBA's basis is weak, but the claim may be right for YtcI for a different reason. The
      root-node IBD rests on mouse Acsm1 and Acsm3, whose acyl-CoA products go mainly to
      oxidation; independently, YtcI's closest characterised relative, S. aureus MbcS, makes
      branched short-chain acyl-CoA primers for branched-chain fatty acid synthesis.
    action: UNDECIDED
    reason: >-
      As a phylogenetic claim the IBD is poorly grounded: its two seeds (MGI:2152200 Acsm1,
      MGI:99538 Acsm3, PMID:11470804) direct their acyl-CoAs to oxidation, and an acyl-CoA
      synthetase that activates fatty acids for degradation does not take part in their
      synthesis. For PP_2213 this led to MARK_AS_OVER_ANNOTATED. For YtcI there is a separate
      line: it is 58% identical to MbcS (same PANTHER subfamily PTHR43605:SF10 and NCBIfam
      NF047394), and MbcS activates 2-methylbutyrate and isobutyrate to the acyl-CoAs that FabH
      uses to initiate branched-chain fatty acid synthesis, a primer-supplying step comparable
      to the one Bkd performs. B. subtilis incorporates exogenous 2-methylbutyrate into
      branched-chain fatty acids. If YtcI is the MbcS counterpart, it would do part of the work
      of fatty acid biosynthesis by forming its primer substrate, but this rests on homology
      alone and YtcI has never been assayed. Neither keeping nor removing the row is supported
      by evidence on the gene; a genetic and biochemical test is proposed.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43605/PTHR43605-paint.tsv
      supporting_text: "PTHR43605\tPTN001944787\tGO:0006633\tP\tIBD\tfalse\tMGI:MGI:2152200|MGI:MGI:99538\ttaxon:\t20170228"
    - reference_id: PMID:11470804
      supporting_text: acyl-CoAs produced by MACS1 and Sa protein are utilized mainly for oxidation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:36806679
      supporting_text: MbcS functions to convert extracellular 2-methylbutyric and isobutyric
        acids to their respective acyl-CoAs that are used by 3-ketoacyl-ACP synthase III (FabH)
        to initiate BCFA biosynthesis
      reference_section_type: ABSTRACT
    - reference_id: PMID:36806679
      supporting_text: it is known that extracellular short-chain acids, like 2-methylbutyrate
        (aC5), are incorporated into BCFA in Bacillus subtilis
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN001944787
        source_label: PTN001944787
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Root-node IBD seeded by mouse Acsm1 and Acsm3, whose acyl-CoA products are used
          mainly for oxidation (PMID:11470804), so the root placement does not establish a
          fatty acid synthesis role. A role for YtcI is plausible only through its MbcS-like
          subfamily, which the root IBD does not represent.
      - source_id: MGI:MGI:2152200
        source_label: Acsm1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mammalian medium-chain acyl-CoA synthetase; its evidence concerns mammalian
          fatty acid metabolism, not a bacterial primer-forming step.
      - source_id: MGI:MGI:99538
        source_label: Acsm3
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: As for Acsm1; abstract points to oxidation of the acyl-CoA products.
- term:
    id: GO:0006637
    label: acyl-CoA metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001944787
  - RGD:727928
  - UniProtKB:Q08AH3
  review:
    summary: >-
      Supported at family level. Members of PTHR43605 form acyl-CoA thioesters from free acids,
      and YtcI carries the full AMP-binding ligase architecture.
    action: ACCEPT
    reason: >-
      The IBD is seeded by experimentally characterised ACSM enzymes including human ACSM2A
      (Q08AH3), and YtcI sits inside the clade with no sign of lost catalytic machinery (it
      keeps the PROSITE AMP-binding signature). Whatever its substrate, its product would be an
      acyl-CoA, so this process term is as specific as the evidence allows. Consistent with
      PP_2213.
    supported_by:
