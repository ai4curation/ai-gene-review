  review:
    summary: >-
      Wrong reaction. GO:0004321 is the fatty acid synthase reaction (acetyl-CoA + malonyl-CoA
      -> long-chain acyl-CoA, EC 2.3.1.86), not the ATP-dependent acyl-CoA synthetase (ligase,
      EC 6.2.1) reaction of this family.
    action: REMOVE
    reason: >-
      YtcI is an AMP-forming acyl-CoA ligase (EC 6.2.1.-; Pfam AMP-binding, PROSITE
      AMP_BINDING) with no ketoacyl synthase, reductase, dehydratase or acyl carrier domains, so
      it cannot catalyse the multi-step fatty acid synthase reaction this term defines. The IBA
      descends from the PAINT IBD on the PTHR43605 root node PTN001944787, whose only seed is an
      RGD IDA on rat Acsm4 from PMID:12709059, a paper that reports acyl-CoA synthetase (ligase)
      activity. The node placement is not in question for the ligase function, which the same
      node carries as GO:0015645; the term chosen for this IBD is the wrong reaction. Same defect
      as in the P. putida PP_2213 and M. sedula Msed_0406 reviews.
