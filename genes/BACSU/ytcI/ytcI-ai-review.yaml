proposed_new_terms: []
knowledge_gaps:
- gap_statement: >-
    The physiological substrate and role of YtcI are unknown. Homology to S. aureus MbcS
    predicts activation of 2-methylbutyrate and isobutyrate for branched-chain fatty acid
    priming, but this has not been tested in B. subtilis.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
suggested_questions:
- question: >-
    Is YtcI the B. subtilis counterpart of S. aureus MbcS, responsible for incorporating
    exogenous 2-methylbutyrate and isobutyrate into branched-chain fatty acids?
- question: >-
    Should the PAINT IBD for GO:0004321 fatty-acyl-CoA synthase activity on PTHR43605 root node
    PTN001944787 be retracted, and should GO:0006633 be moved from the root to a node covering
    MbcS-like bacterial members if MbcS orthologs are confirmed?
suggested_experiments:
- description: >-
    Purify recombinant YtcI and assay ATP- and CoA-dependent activation of short straight- and
    branched-chain acids (acetate, propionate, butyrate, isobutyrate, 2-methylbutyrate,
    isovalerate). In parallel, test whether a ytcI deletion in a bkd-deficient B. subtilis strain
    loses the ability to grow on, and incorporate into membrane lipids, supplemented
    2-methylbutyrate or isobutyrate.
