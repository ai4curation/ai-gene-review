- description: >-
    ATP-dependent fatty acid ligase (acyl-CoA synthetase) activity, activating a carboxylic acid
    to its CoA thioester. The substrate is unknown; homology to S. aureus MbcS suggests short
    branched-chain acids such as 2-methylbutyrate and isobutyrate.
