references:
  - id: PMID:8289242
    title: "The Bacillus subtilis spoVD gene encodes a mother-cell-specific penicillin-binding
      protein required for spore morphogenesis."
    findings:
      - statement: Original characterization of spoVD gene encoding a 
          sporulation-specific PBP
        supporting_text: "The Bacillus subtilis spoVD gene has been cloned and sequenced.
          It encodes a 71,262 Da protein with extensive sequence similarity to penicillin-binding
          proteins from various organisms"
      - statement: Demonstrated mother-cell-specific expression during 
          sporulation
        supporting_text: "SpoVD synthesis probably occurs only in the mother cell
          since both sigma E and SpoIIID are thought to be specific to this cell type"
      - statement: Showed penicillin-binding activity
        supporting_text: "Expression of spoVD in E. coli leads to the synthesis of
          a membrane-associated protein of the size expected for SpoVD, which can
          bind labelled penicillin"
      - statement: Established disruption phenotype (asporogenous, cortex-less 
          spores)
        supporting_text: "insertional disruption of the spoVD gene has no effect on
          vegetative growth or division"
      - statement: Determined specialized role in spore cortex morphogenesis
        supporting_text: "spoVD seems instead to have a specialized role in the morphogenesis
          of the spore cortex, which is a modified form of peptidoglycan"
  - id: PMID:20417640
    title: "Interactions between late-acting proteins required for peptidoglycan synthesis
      during sporulation"
    findings:
      - statement: SpoVD is a D,D-transpeptidase for cortex peptidoglycan 
          crosslinking
        supporting_text: "SpoVD, a nonessential class B penicillin binding protein"
      - statement: Forms cognate pair with SpoVE (SEDS glycosyltransferase)
        supporting_text: "we have taken advantage of the peptidoglycan synthesis that
          occurs during sporulation in Bacillus subtilis to examine the interactions
          between SpoVE, a nonessential, sporulation-specific homolog of the well-conserved
          and essential SEDS (shape elongation, division, and sporulation) proteins,
          and SpoVD, a nonessential class B penicillin binding protein"
      - statement: Localizes to outer forespore membrane with quantified 
          enrichment
        supporting_text: "localization of SpoVD is dependent on SpoVE"
      - statement: Catalytic mutants abolish heat-resistant spore formation
        supporting_text: "a loss-of-function point mutation in either part of the
          fusion resulted in loss of function of the entire fusion"
      - statement: FRET demonstrates direct SpoVE-SpoVD interaction
        supporting_text: "fluorescence resonance energy transfer experiments indicated
          that SpoVE and SpoVD interact, and co-affinity purification in Escherichia
          coli demonstrated that this interaction is direct"
  - id: PMID:38042849
    title: "Diversification of division mechanisms in endospore-forming bacteria revealed
      by analyses of peptidoglycan synthesis in Clostridioides difficile"
    findings:
      - statement: SpoVE-SpoVD pairs specialized in endospore-formers
        supporting_text: "In B. subtilis, SpoVE forms a complex with the sporulation-specific
          bPBP SpoVD to synthesize a thick protective PG layer known as the cortex
          during sporulation"
      - statement: Comparative phylogenomics shows dedicated sporulation 
          function
        supporting_text: "the genes present in the dcw cluster of sporulating Firmicutes
          likely code for SpoVE and SpoVD, respectively, rather than the canonical
          cell division proteins FtsW and FtsI"
      - statement: SpoVD homologs form divisome-like subcomplex with FtsL/Q/B
        supporting_text: "we observed that C. difficile SpoVD interacts with FtsL
          and FtsQ, suggesting that the ternary sub-complex likely directly regulates
