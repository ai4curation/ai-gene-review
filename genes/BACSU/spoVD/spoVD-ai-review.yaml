suggested_experiments:
  - hypothesis: >-
      The PASTA domain of SpoVD is required for proper localization to the outer forespore
      membrane or for substrate recognition during cortex synthesis.
    description: >-
      Generate PASTA domain deletion mutants of SpoVD and assess localization using
      GFP fusions
      and cortex formation by electron microscopy and heat resistance assays.
    experiment_type: genetic/microscopy
  - hypothesis: >-
      SpoVD has D,D-transpeptidase activity that can be demonstrated biochemically.
    description: >-
