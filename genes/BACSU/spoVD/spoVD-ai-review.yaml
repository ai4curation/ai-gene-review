  - term:
      id: GO:0071555
      label: cell wall organization
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN000771406
      - UniProtKB:P0AD65
    review:
      summary: >-
        SpoVD crosslinks peptidoglycan during spore cortex assembly. While spore
        cortex peptidoglycan synthesis is a form of cell wall assembly, the parent
        term GO:0071555 (cell wall organization) is overly broad and does not
        distinguish sporulation-specific spore wall assembly and peptidoglycan
        biosynthesis from vegetative cell wall organization.
      action: MODIFY
      reason: >-
        SpoVD does not participate in vegetative cell wall organization; it functions
        exclusively in mother-cell-directed synthesis and crosslinking of the modified
        peptidoglycan layer (cortex) of the developing endospore. Per GO review
        guidelines, this overly broad parent term is refined with MODIFY to the
        specific supported terms GO:0042244 (spore wall assembly, a direct descendant
        of GO:0071555) and GO:0009252 (peptidoglycan biosynthetic process, already
        accepted on this gene).
      proposed_replacement_terms:
        - id: GO:0042244
          label: spore wall assembly
        - id: GO:0009252
          label: peptidoglycan biosynthetic process
      supported_by:
        - reference_id: PMID:8289242
          supporting_text: "spoVD seems instead to have a specialized role in the
            morphogenesis of the spore cortex, which is a modified form of peptidoglycan"
        - reference_id: file:BACSU/spoVD/spoVD-deep-research-falcon.md
          supporting_text: "SpoVD is a D,D‑transpeptidase that cross-links peptide
            stems in the nascent cortex PG"
