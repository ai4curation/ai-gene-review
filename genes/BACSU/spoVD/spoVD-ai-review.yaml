            source_status: SUPPORTS_TRANSFER
            comment: >-
              Ancestral class B PBP node PTN000771406 propagates the broad parent
              term GO:0071555 across both vegetative PBPs (MrdA/FtsI) and the
              sporulation-specific cortex synthase SpoVD.
          - source_id: UniProtKB:P0AD65
            source_label: mrdA
            source_status: SUPPORTS_TRANSFER
            comment: >-
              E. coli MrdA (PBP2) is a vegetative elongasome peptidoglycan transpeptidase,
