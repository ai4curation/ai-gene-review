core_functions:
  - description: >-
      SpoVD functions as a D,D-transpeptidase (serine-type D-Ala-D-Ala carboxypeptidase)
      that
      crosslinks peptidoglycan peptide stems during spore cortex assembly. It binds
      penicillin
      and localizes to the outer forespore membrane where it works with SpoVE to synthesize
      cortex peptidoglycan essential for heat-resistant endospore formation.
