  - term:
      id: GO:0006508
      label: proteolysis
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    qualifier: involved_in
    review:
      summary: >-
        This annotation derives from the "Protease" keyword in UniProt. While SpoVD
        has peptidase-like
        activity (cleaving D-Ala-D-Ala bonds), calling it "proteolysis" is misleading.
        SpoVD is a
        transpeptidase that crosslinks peptidoglycan peptide stems - its primary function
        is
        transpeptidation, not protein degradation. The substrate is peptidoglycan
        precursors, not proteins.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        Proteolysis implies protein degradation, which is not SpoVD's function. SpoVD
        cleaves
        D-Ala-D-Ala bonds in peptidoglycan precursors as part of transpeptidation,
        not to degrade
        proteins. This annotation is technically derived from the EC 3.4.16.4 classification
        but
        creates a misleading impression of the biological function. The term is too
        general and
        potentially misleading for a peptidoglycan transpeptidase.
      supported_by:
        - reference_id: file:BACSU/spoVD/spoVD-deep-research-falcon.md
          supporting_text: "SpoVD is a D,D‑transpeptidase that cross-links peptide
            stems in the nascent cortex PG"
