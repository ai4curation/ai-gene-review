  - term:
      id: GO:0008360
      label: regulation of cell shape
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    qualifier: involved_in
    review:
      summary: >-
        This annotation derives from the "Cell shape" keyword in UniProt. However,
        this annotation
        is INCORRECT for SpoVD. SpoVD is a sporulation-specific PBP that functions
        ONLY during
        spore cortex assembly. It does NOT participate in vegetative cell shape determination.
        Unlike MrdA (elongasome, determines rod shape) or FtsI (divisome, determines
        septum shape),
        SpoVD is dedicated exclusively to sporulation and has no role in vegetative
        cell morphology.
      action: REMOVE
      reason: >-
        SpoVD does not regulate vegetative cell shape. The "Cell shape" keyword in
        UniProt is
        erroneously applied based on homology to other PBPs (like MrdA/PBP2 and FtsI/PBP3)
        that
        do regulate cell shape. However, SpoVD is sporulation-specific and is expressed
        only in
        the mother cell during Stage V sporulation. It synthesizes spore cortex peptidoglycan,
        not vegetative cell wall. The disruption phenotype is asporogenous (no cortex,
        heat-sensitive
        spores), not cell shape defects. This represents an over-generalization from
        the PBP family.
      supported_by:
        - reference_id: PMID:8289242
          supporting_text: "insertional disruption of the spoVD gene has no effect
            on vegetative growth or division"
        - reference_id: PMID:8289242
          supporting_text: "spoVD seems instead to have a specialized role in the
            morphogenesis of the spore cortex"
        - reference_id: UniProt:Q03524
          supporting_text: "Asporogeneous; spore development starts but does not develop
            the spore cortex"
