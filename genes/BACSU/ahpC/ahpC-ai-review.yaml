taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: Bacillus subtilis AhpC is a typical 2-Cys peroxiredoxin that reduces hydrogen peroxide and
  organic hydroperoxides to water and alcohols. Its peroxidatic cysteine is regenerated through a resolving
  disulfide and the AhpF reductase. In B. subtilis, ahpC and ahpF form a stress-responsive operon; loss
  of AhpC increases sensitivity to cumene hydroperoxide during exponential growth but can increase hydrogen
  peroxide resistance through compensatory induction of other peroxide defenses. The catalytic donor assignment
  is supported by conserved AhpC architecture and comparison with the characterized Salmonella system.
