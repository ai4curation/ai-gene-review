    supporting_text: Although AhpF can use either NADH or NADPH as the electron donor for these activities,
      NADH is the preferred reductant
- id: PMID:8555199
  title: Flavin-dependent alkyl hydroperoxide reductase from Salmonella typhimurium. 2. Cystine disulfides
    involved in catalysis of peroxide reduction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected for redox titration and truncation findings; exact cysteine
      numbering belongs to the Salmonella proteins. No purified Bacillus kinetics inferred.
  findings:
  - statement: AhpF regenerates the intersubunit AhpC disulfide during peroxide turnover.
    supporting_text: The AhpC cystine disulfide center, shown to exist as an intersubunit disulfide bond,
      is stoichiometrically reducible by NADH in the presence of a catalytic amount of AhpF and can be
      reoxidized by ethyl hydroperoxide.
- id: PMID:2643600
  title: An alkyl hydroperoxide reductase from Salmonella typhimurium involved in the defense of DNA against
    oxidative damage. Purification and properties.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected. Protein purified from an oxyR1 regulatory mutant, not silently
      relabeled as an unmodified LT2 culture. The accession identity is supported by the curated sequence
      record and later biochemical studies.
  findings:
  - statement: Native Salmonella purified activity requires two components and the larger contains FAD.
    supporting_text: The 57-kDa protein contains a bound FAD cofactor and can use either NADH or NADPH
      as an electron donor for the direct reduction of redox dyes, or of alkyl hydroperoxides when combined
      with the 22-kDa protein.
