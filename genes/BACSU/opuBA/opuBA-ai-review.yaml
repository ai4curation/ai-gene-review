- id: PMID:10216873
  title: Two evolutionarily closely related ABC transporters mediate the uptake of choline for synthesis
    of the osmoprotectant glycine betaine in Bacillus subtilis.
  findings:
  - statement: Full author-hosted article inspected. OpuB transport was measured in JH642-derived
      mutants. The study reports OpuB protein identity with the strain168 genome sequence and distinguishes
      native OpuB choline specificity from OpuC glycine-betaine import. ATPase/permease role assignment
      uses architecture; lipoprotein modification was directly tested.
    supporting_text: 'Molecular analysis allowed us to demonstrate that the opuB and opuC operons
      each

      encode a binding protein-dependent ABC transport system that consists of four

      components.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted article inspected. OpuB transport was measured in JH642-derived
      mutants. The study reports OpuB protein identity with the strain168 genome sequence and distinguishes
      native OpuB choline specificity from OpuC glycine-betaine import. ATPase/permease role assignment
      uses architecture; lipoprotein modification was directly tested.
- id: PMID:21658392
  title: The crystal structure of the substrate-binding protein OpuBC from Bacillus subtilis in complex
    with choline.
  findings:
  - statement: Full author-hosted article inspected. The OpuBC construct uses JH642 DNA and a signal-peptide/lipid-anchor
      modification, not an unmodified native protein. PDB3R6U deposited entity sequence maps to canonical
      Q45462 residues23-306; methods describe a Cys-to-Gly replacement at the engineered mature terminus
      that the deposited entity sequence does not encode. Binding-domain evidence remains applicable,
      with this construct discrepancy preserved. Quoted residue numbers are not silently mapped to
      native precursor numbering.
    supporting_text: 'The crystal structure of the OpuBC/choline complex provides a rational

      for the observed choline specificity of the OpuB ABC importer in vivo and

      explains its inability to catalyze the import of glycine betaine into

      osmotically stressed B. subtilis cells.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted article inspected. The OpuBC construct uses JH642 DNA and a
      signal-peptide/lipid-anchor modification, not an unmodified native protein. PDB3R6U deposited
      entity sequence maps to canonical Q45462 residues23-306; methods describe a Cys-to-Gly replacement
      at the engineered mature terminus that the deposited entity sequence does not encode. Binding-domain
      evidence remains applicable, with this construct discrepancy preserved. Quoted residue numbers
      are not silently mapped to native precursor numbering.
