- term:
    id: GO:0043937
    label: regulation of sporulation
  evidence_type: IDA
  original_reference_id: PMID:9830105
  qualifier: involved_in
  review:
    summary: >-
      The paper shows that Pgm activity is extremely pH sensitive and proposes that forespore
      acidification inhibits the enzyme during sporulation. That is regulation of the enzyme by
      sporulation, not regulation of sporulation by the enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The abstract states a model in which the enzyme is the regulated party: forespore
      acidification inhibits Pgm so that 3-phosphoglycerate accumulates in the dormant spore.
      Nothing reported shows Pgm controlling the rate, timing or extent of sporulation. The
      asporogeny of pgm eno mutants (PMID:8021172) shows that glycolytic flux is needed for
      sporulation, which is necessity, not regulation. The curator may have read data in the
      full text that the cached abstract lacks, so the row is marked as over-annotated rather
      than removed.
    supported_by:
    - reference_id: PMID:9830105
      supporting_text: >-
        The extreme pH sensitivity of the Mn(2+)-dependent Pgms supports a model in which this
        enzyme is inhibited during sporulation by acidification of the forespore, thus allowing
        accumulation of the spore's large depot of 3-phosphoglyceric acid.
    - reference_id: PMID:8021172
      supporting_text: >-
        these mutants were asporogenous with or without malate supplementation
- term:
    id: GO:0043937
    label: regulation of sporulation
  evidence_type: IEA
