- id: PMID:9830105
  title: The enzymatic activity of phosphoglycerate mutase from gram-positive endospore-forming
    bacteria requires Mn2+ and is pH sensitive.
  full_text_unavailable: true
  findings:
  - statement: >-
      Pgm activity of B. subtilis requires Mn2+ and drops more than 30- to 200-fold between pH 8
      and pH 6; the authors propose that forespore acidification inhibits Pgm during sporulation.
    supporting_text: >-
      at low concentrations of Mn2+, a pH change from 8 to 6 resulted in greater than 30- to
      200-fold decreases in the activity of these Pgms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract checked; B. subtilis Pgm is one of the three enzymes assayed. Supports the
      activity and Mn2+ dependence; the sporulation link is a proposed model of enzyme
      inhibition.
- id: PMID:8021172
  title: Cloning and nucleotide sequences of the genes encoding triose phosphate isomerase,
    phosphoglycerate mutase, and enolase from Bacillus subtilis.
  full_text_unavailable: true
  findings:
  - statement: >-
      B. subtilis pgm lies in the pgk-tpi-pgm-eno glycolytic operon and encodes a DPG-independent,
      Mn2+-requiring PGM; pgm eno mutants grow extremely slowly and fail to sporulate.
    supporting_text: >-
      B. subtilis PGM, which is DPG independent, is very similar to a DPG-independent PGM from a
      plant species
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract checked; cloning and characterization of the B. subtilis gene (UniProt reference 1).
