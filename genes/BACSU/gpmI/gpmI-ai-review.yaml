id: P39773
gene_symbol: gpmI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  gpmI (pgm, BSU33910) encodes the cofactor-independent phosphoglycerate mutase (iPGM) of
  Bacillus subtilis, a monomeric cytosolic enzyme of the alkaline phosphatase superfamily that
  needs no 2,3-bisphosphoglycerate. It reversibly interconverts 3-phosphoglycerate and
  2-phosphoglycerate in lower glycolysis, between phosphoglycerate kinase and enolase, and is
  encoded in the pgk-tpi-pgm-eno glycolytic operon. Catalysis depends on two bound manganese
  ions and proceeds through a phosphoserine intermediate at Ser62. Apoenzyme is inactive until
  Mn2+ binds, and activity falls steeply as pH drops from 8 to 6. Inactivation of pgm together
  with eno causes very slow growth and blocks sporulation. Acidification of the forespore is
  thought to inhibit the enzyme, letting the developing spore accumulate its large store of
  3-phosphoglycerate.
