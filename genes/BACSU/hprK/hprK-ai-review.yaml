  review:
    summary: HPrK/P is the sensor enzyme of carbon catabolite control.
    action: ACCEPT
    reason: >-
      By setting the phosphorylation state of HPr and Crh in response to glycolytic intermediates and Pi, HPrK/P controls carbon catabolite repression and PTS sugar uptake; a kinase- and phosphorylase-dead mutant abolishes catabolite repression. HPrK/P performs the regulatory phosphorylation step itself, so it participates in this regulation. A more specific transcriptional term (carbon catabolite repression of transcription) is deliberately not proposed. P-Ser-HPr together with CcpA performs the repression, and HPrK/P acts upstream of that step, so it would fail the participation test.
