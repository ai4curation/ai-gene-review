- term:
    id: GO:0016776
    label: phosphotransferase activity, phosphate group as acceptor
  evidence_type: IDA
  original_reference_id: PMID:12779331
  qualifier: enables
  review:
    summary: Core phosphorylase activity, Pi-dependent phosphorolysis of P-Ser-HPr producing pyrophosphate (RHEA:46604).
    action: NEW
    reason: >-
      HPrK/P dephosphorylates P-Ser-HPr by phospho-phosphorolysis: inorganic
      phosphate attacks the phosphoryl group, yielding HPr and pyrophosphate,
      and the reaction is reversible (PPi-dependent HPr kinase). No water is
      consumed, so this is not phosphoprotein phosphatase (hydrolase) activity
      but a phosphoryl transfer to a phosphate acceptor (EC 2.7.4.-), the
      definition of GO:0016776. The B. subtilis enzyme was assayed for all
      three activities (ATP-kinase, PPi-kinase, phosphorylase). GO has no
      HPr-specific phosphorylase term, so GO:0016776 is the most specific
      existing term; a specific term is proposed below. GOA carries no row
      for this second core activity.
    supported_by:
    - reference_id: PMID:12779331
      supporting_text: participate in the three enzymatic activities of HprK/Ps (ATP-kinase, PP(i)-kinase, and phosphorylase)
    - reference_id: PMID:12359880
      supporting_text: We demonstrate here that P-Ser-HPr dephosphorylation leads to the formation of HPr and pyrophosphate.
