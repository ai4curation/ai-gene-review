proposed_new_terms:
- proposed_name: '[HPr protein]-phosphoserine phosphorylase activity'
  proposed_definition: >-
    Catalysis of the reaction: [HPr protein]-O-phospho-L-serine + phosphate +
    H+ = [HPr protein]-L-serine + diphosphate.
  justification: >-
    RHEA:46604 describes the phospho-phosphorolysis step of HPr
    kinase/phosphorylase, a phosphoryl transfer to inorganic phosphate (EC
    2.7.4.-) with no water consumed. It can currently be expressed only by the
    broad GO:0016776; phosphoprotein phosphatase terms are hydrolases and do not
    fit.
  proposed_parent:
    id: GO:0016776
    label: phosphotransferase activity, phosphate group as acceptor
  supported_by:
  - reference_id: PMID:12359880
    supporting_text: We demonstrate here that P-Ser-HPr dephosphorylation leads to the formation of HPr and pyrophosphate.
suggested_questions:
- question: >-
    Does the HPrK/P serine kinase have physiological protein substrates beyond
    HPr and Crh? In vitro it phosphorylates the Hanks-type kinase PrkD on Ser148
    in its activation loop (PMID:25278935); is this modification made in vivo,
    and does it regulate PrkD?
- question: >-
    Should the InterPro2GO mappings of the HPr kinase/phosphorylase signatures
    (IPR003755, IPR011104, IPR011126) to two-component phosphorelay terms be
    replaced by protein serine kinase and phosphate-acceptor phosphotransferase
    terms?
