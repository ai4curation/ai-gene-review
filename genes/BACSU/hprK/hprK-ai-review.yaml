- id: PMID:25278935
  title: Cross-phosphorylation of bacterial serine/threonine and tyrosine protein
    kinases on key regulatory residues.
  findings:
  - statement: In vitro, HPrK/P phosphorylates the Hanks-type kinase PrkD on Ser148 in its activation loop, a protein substrate beyond HPr and Crh; PrkD in turn phosphorylates HPrK/P on Ser160 and Ser296.
    reference_section_type: RESULTS
    supporting_text: HprK/P phosphorylated PrkD on the residue S148 (Figure 5A) in the activation loop, with a very probable consequence of stimulating the PrkD kinase activity (Figure 5B)
  - statement: In vitro, the presence of PrkD in the HPr phosphorylation assay reduced HPrK/P's phosphorylation of HPr; whether this reflects PrkD phosphorylation of HPrK/P or substrate competition, and its in vivo relevance, are not established.
    reference_section_type: RESULTS
    supporting_text: The presence of PrkD in the phosphorylation assay significantly diminished the capacity of HprK/P to phosphorylate HPr
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. In vitro cross-phosphorylation of B. subtilis kinases with mass-spectrometric site mapping; source of the three protein binding rows. HPrK/P did not interact with other kinases in the two-hybrid assay, but it phosphorylated PrkD on Ser148. For HPrK/P as recipient, Figure 9 shows that the presence of PrkD reduced HPrK/P's phosphorylation of HPr; the His-tag autophosphorylation artifact only made the added phosphate on HPrK/P itself hard to visualise.
- id: PMID:9570401
  title: A novel protein kinase that controls carbon catabolite repression in bacteria.
  findings:
  - statement: >-
      B. subtilis PtsK (HPrK/P) is a novel-family Ser/Thr kinase of HPr,
      activated by FBP and inhibited by Pi; the mutant loses catabolite repression.
    supporting_text: the ptsK mutant is insensitive to transcriptional regulation by catabolite repression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; founding identification of the B. subtilis gene and kinase.
- id: PMID:12009882
  title: 'Insights into the functioning of Bacillus subtilis HPr kinase/phosphatase:
    affinity for its protein substrates and role of cations and phosphate.'
  findings:
  - statement: HPrK/P phosphorylates and dephosphorylates Ser46 of HPr or Crh; Mg2+ needed for substrate binding.
    supporting_text: catalyzes both an ATP-dependent phosphorylation and a dephosphorylation on Ser-46 of either HPr
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; B. subtilis enzyme.
- id: PMID:12055300
  title: 'HPr kinase/phosphatase of Bacillus subtilis: expression of the gene and effects
    of mutations on enzyme activity, growth and carbon catabolite repression.'
  findings:
  - statement: Walker A and signature-motif mutants; a kinase- and phosphatase-dead mutant abolishes CCR.
    supporting_text: Carbon catabolite repression was abolished in a B. subtilis strain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; B. subtilis in vivo and in vitro mutant analysis.
- id: PMID:12359880
  title: 'Pyrophosphate-producing protein dephosphorylation by HPr kinase/phosphorylase:
    a relic of early life?'
  findings:
  - statement: P-Ser-HPr dephosphorylation by HprK/P is a reversible phosphorolysis producing pyrophosphate.
    supporting_text: HprK/P is the first enzyme known to catalyze P-protein dephosphorylation via this phospho-phosphorolysis mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache (PMC129692 exists); defines the phosphorylase chemistry; includes B. subtilis in vivo PPi measurements.
