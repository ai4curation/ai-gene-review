- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25278935
  qualifier: enables
  supporting_entities:
  - UniProtKB:O31435
  review:
    summary: Bare protein binding (YbdM/PrkD); uninformative as a term, but the paper shows HPrK/P phosphorylates PrkD.
    action: REMOVE
    reason: >-
      Bare protein binding identifies no function. YbdM is PrkD, a Hanks-type serine/threonine kinase. In this paper's in vitro cross-phosphorylation assays (not the two-hybrid screen, in which HPrK/P did not interact with other kinases), HPrK/P phosphorylated PrkD on Ser148 in its activation loop, so PrkD is a protein substrate of HPrK/P's serine kinase activity. That informative content is carried by the accepted GO:0106310 protein serine kinase activity row. In the reverse direction PrkD phosphorylated HPrK/P on Ser160 (next to the catalytic Lys159) and Ser296, and the presence of PrkD in the assay reduced HPrK/P's phosphorylation of HPr in vitro (the paper does not separate this from PrkD competing as a substrate); its in vivo relevance is open. That is regulation of HPrK/P, not an activity of it, so it is not annotated here. Removal under the protein-binding policy does not dispute the interaction.
    supported_by:
    - reference_id: PMID:25278935
      supporting_text: HprK/P phosphorylated PrkD on the residue S148 (Figure 5A) in the activation loop, with a very probable consequence of stimulating the PrkD kinase activity (Figure 5B)
    - reference_id: PMID:25278935
      supporting_text: The presence of PrkD in the phosphorylation assay significantly diminished the capacity of HprK/P to phosphorylate HPr
