gene_symbol: hprK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  HPrK/P is the bifunctional HPr kinase/phosphorylase of Bacillus subtilis, the
  sensor enzyme of carbon catabolite control in low-GC Gram-positive bacteria.
  This hexameric P-loop (Walker A) enzyme, unrelated to eukaryotic protein
  kinases, phosphorylates Ser46 of the PTS phosphocarrier HPr (and of its
  paralogue Crh) using ATP, or pyrophosphate at high PPi. It reverses the
  modification by an unusual phosphorolysis in which inorganic phosphate
  attacks the phosphoserine to release HPr and pyrophosphate. Glycolytic
  intermediates such as fructose 1,6-bisphosphate activate the kinase, while
  inorganic phosphate inhibits it and favours phosphorolysis, so the
  P-Ser-HPr level tracks the availability of rapidly metabolised sugars.
  P-Ser-HPr and P-Ser-Crh act as corepressors with CcpA in carbon catabolite
  repression and regulate PTS sugar uptake and inducer exclusion.
