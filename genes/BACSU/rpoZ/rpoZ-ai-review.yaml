- term:
    id: GO:0006352
    label: DNA-templated transcription initiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002157784
  - UniProtKB:P0A800
  review:
    summary: >-
      Omega is present in initiating holoenzymes but is not required for initiation
      chemistry.
    action: KEEP_AS_NON_CORE
    reason: >-
      Omega is part of the holoenzymes used in these initiation studies and PAINT
      places the term on the bacterial omega node from E. coli evidence, so the claim
      is retained. Omega's own role is assembly and stability, and its loss mainly
      shifts holoenzyme balance rather than abolishing initiation, so the term is
      peripheral to its core function.
    supported_by:
    - reference_id: file:BACSU/rpoZ/rpoZ-uniprot.txt
      supporting_text: >-
        When a sigma factor is associated with the core the holoenzyme is formed,
        which can initiate transcription
      record_section:
      - CC:SUBUNIT
    - reference_id: PMID:21810966
      supporting_text: >-
        Here we show that in an exponentially growing Escherichia coli rpoZ mutant
        lacking the polymerase ω subunit, the impact of the Eσ(38) holoenzyme on transcription
        is enhanced
