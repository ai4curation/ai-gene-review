id: O35011
gene_symbol: rpoZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  rpoZ (yloH, BSU15690) encodes the omega subunit of Bacillus subtilis DNA-directed
  RNA polymerase. By similarity to E. coli omega it binds and latches beta-prime to
  promote core assembly, but it is dispensable for in vitro reconstitution and activity;
  in B. subtilis the core carries at least one of omega or the Firmicutes-specific
  epsilon subunit.
existing_annotations:
- term:
    id: GO:0000345
    label: cytosolic DNA-directed RNA polymerase complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002157784
  - UniProtKB:P0A800
  review:
    summary: >-
      The omega subunit is a component of the eubacterial DNA-directed RNA polymerase
      (alpha2 beta beta' omega core plus sigma).
    action: ACCEPT
    reason: >-
      GO:0000345 is defined as the eubacterial multisubunit RNA polymerase with an
      alpha2 beta beta' omega core. Subunit membership is established structurally
      in E. coli holoenzyme structures and by UniProt-curated subunit composition.
    supported_by:
    - reference_id: file:BACSU/rpoZ/rpoZ-uniprot.txt
      supporting_text: RNAP is composed of a core of 2 alpha, a beta and a beta' subunit.
      record_section:
      - CC:SUBUNIT
    - reference_id: PMID:33339820
      supporting_text: >-
        we have determined the structures of Bacillus subtilis RNA polymerase (RNAP)
        elongation and HelD complexes
- term:
    id: GO:0001000
    label: bacterial-type RNA polymerase core enzyme binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002157784
  - UniProtKB:P0A800
  review:
    summary: Omega binds the beta-prime subunit within the bacterial core enzyme.
    action: ACCEPT
    reason: >-
      Omega binds intact beta-prime and latches it into the alpha2 beta subassembly;
      PAINT places the term at the bacterial omega node and rpoZ mutants alter holoenzyme
      composition. Core function.
    supported_by:
    - reference_id: file:BACSU/rpoZ/rpoZ-uniprot.txt
      supporting_text: >-
        Promotes RNA polymerase assembly. Latches the N- and C-terminal regions of
        the beta' subunit thereby facilitating its interaction with the beta and alpha
        subunits
      record_section:
      - CC:FUNCTION
    - reference_id: PMID:11531998
      supporting_text: >-
        We show here that omega binds only the intact beta' subunit and not the beta'
        N-terminal domain or beta' C-terminal domain
