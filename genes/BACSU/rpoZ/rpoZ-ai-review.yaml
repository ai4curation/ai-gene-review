- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003716
  - InterPro:IPR006110
  - InterPro:IPR036161
  - EC:2.7.7.6
  - UniRule:UR000036419
  review:
    summary: >-
      Polymerase activity (DNA-directed RNA polymerase activity) projected onto the
      non-catalytic omega subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Over-annotation from transferring a complex-level activity to every subunit.
      The omega subunit does not contribute active-site residues: omega latches beta-prime
      and promotes assembly, and omega-less RNAP remains active. Its informative functions
      are captured by assembly and subunit-specific terms in this review (see projects/PROTEIN_COMPLEX_FUNCTIONS.md).
    supported_by:
    - reference_id: file:BACSU/rpoZ/rpoZ-uniprot.txt
      supporting_text: >-
        Promotes RNA polymerase assembly. Latches the N- and C-terminal regions of
        the beta' subunit thereby facilitating its interaction with the beta and alpha
        subunits
      record_section:
      - CC:FUNCTION
    - reference_id: file:BACSU/rpoZ/rpoZ-uniprot.txt
      supporting_text: In vitro reconstitution experiments this subunit is dispensible
      record_section:
      - CC:FUNCTION
    - reference_id: PMID:18289874
      supporting_text: >-
        In transcription time-course assays all of the recombinant enzymes exhibited
        identical activity to native RNAP.
