id: P37573
gene_symbol: disA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DisA is a cytoplasmic DNA integrity sensor and diadenylate cyclase in Bacillus subtilis. Its oligomeric
  DAC domains synthesize cyclic di-AMP, while a C-terminal DNA-binding region scans chromosomes and recognizes
  branched DNA structures. Binding to stalled or reversed replication forks suppresses cyclic di-AMP synthesis
  and limits RecG-dependent fork remodeling. This couples DNA integrity to signaling and the progression of
  sporulation, without making DisA a DNA-unwinding enzyme.
