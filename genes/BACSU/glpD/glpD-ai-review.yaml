  review:
    summary: GlpD oxidizes G3P during glycerol utilization; acceptor and location evidence have different
      strengths.
    action: UNDECIDED
    reason: The source is an ARBA membrane prediction. A 1985 primary abstract reports G3PDH activity
      in BD474 membrane preparations, but its full methods were inaccessible and it does not identify
      strain 168 P18158 molecularly. Reviewed UniProt instead says cytoplasm, which does not exclude peripheral
      membrane association. The 1974 low-speed supernatant is not a resolved soluble fraction, and E.
      coli GlpD topology cannot be transferred from the SF35 name. Preserve the row pending target localization
      evidence; neither REMOVE nor a membrane refinement is justified.
