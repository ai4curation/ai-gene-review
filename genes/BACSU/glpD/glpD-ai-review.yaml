  title: 'UniProt P18158: Bacillus subtilis GlpD'
  findings:
  - statement: The reviewed reaction assigns quinone as acceptor; the reviewed cellular location is cytoplasm.
      Neither assertion is converted into an experimental assay claim.
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: Reaction=a quinone + sn-glycerol 3-phosphate = dihydroxyacetone phosphate + a quinol;
  - statement: The protein belongs to the FAD-dependent G3P dehydrogenase family, which supports enzyme-family
      membership but does not alone determine terminal acceptor.
    record_section:
    - CC:SIMILARITY
    supporting_text: Belongs to the FAD-dependent glycerol-3-phosphate dehydrogenase family.
