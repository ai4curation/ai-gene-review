  title: Primary-source readings for Bacillus GlpD physiology and localization limits
  findings:
  - statement: The 1974 study assays a crude low-speed supernatant rather than resolving membrane versus
      cytosol.
    supporting_text: Enzymatic activities in the supernatant were measured.
core_functions:
- description: Oxidizes sn-glycerol 3-phosphate to dihydroxyacetone phosphate in glycerol catabolism.
    Quinone specificity is retained from reviewed target reaction and PAINT synthesis; native mutant/extract
    evidence establishes the step without directly measuring quinone reduction. Membrane association and
    complex architecture remain unresolved.
