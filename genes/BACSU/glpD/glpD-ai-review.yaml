id: P18158
gene_symbol: glpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GlpD is the FAD-dependent, NAD-independent glycerol-3-phosphate dehydrogenase used in Bacillus
  subtilis glycerol catabolism. It oxidizes sn-glycerol 3-phosphate to dihydroxyacetone phosphate, connecting
  glycerol uptake and phosphorylation to central carbon metabolism. The curated reaction assigns quinone
  as electron acceptor. Native mutant and extract studies establish the catabolic step, while the precise
  electron-transfer interface and membrane association remain less directly characterized.
