knowledge_gaps:
- gap_statement: Whether EgsA supplies the sn-glycerol 1-phosphate used natively by PcrB or in G1P-backbone
    phosphatidylglycerol remains unresolved in the evidence inspected. EgsA is a characterized candidate,
    but precursor synthesis in vitro does not establish those fluxes.
  boundary: Recombinant AraM reduces glycerone phosphate to G1P and catalyzes the reverse reaction. B.
    subtilis contains G1P-derived lipids and PcrB uses G1P, but precursor identity alone does not establish
    enzyme-to-lipid flux. The author thesis reports an araM-disruption LTA ELISA and later G1P-fed lipid
    labeling; the latter bypasses the step in question. The 2026 PlsY/PlsC paper cites prior engineered
    E. coli lipid synthesis without AraM, suggesting an unidentified alternative G1P source in that host,
    not proving an alternative mechanism in B. subtilis.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: This is the join between the archaeal-type backbone chemistry and the lipids that use
    it, and it is the point at which any process annotation on a bacterial G1P dehydrogenase stops being
    a statement about a measured reaction and becomes an inference from pathway logic. It also bears on
    whether G1P supply or acyltransferase specificity is what limits heterochiral lipid production in
    bacteria.
  resolution: Chiral lipidomics of an egsA deletion and of a complemented strain, measuring heptaprenylglycerol,
    its acetylated form and the backbone chirality of phosphatidylglycerol; isotopic tracing from glycerone
    phosphate into those pools; and a search for the second G1P route, for example by selecting for restored
    archaeal-lipid synthesis in an AraM-free host.
  provenance:
  - reference_id: PMID:42286214
    supporting_text: other mechanism(s) of G1P biosynthesis must exist in E. coli and possibly other bacteria,
      as archaeal lipids with the correct chiral structure could be produced even in the absence of AraM
    reference_section_type: RESULTS
