      lipid-anchor or cell-wall-sorting feature; the only sequence feature spanning the protein is
      the full-length chain. The recombinant protein purifies as a soluble homodimer, its
      substrates (glycerone phosphate, NADH, NAD+) are cytoplasmic metabolites, and the
