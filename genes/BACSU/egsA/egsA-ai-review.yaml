knowledge_gaps:
- gap_statement: Which enzyme supplies the sn-glycerol 1-phosphate that is actually used in vivo,
    by PcrB for the heptaprenylglyceryl ether lipid and in the glycerol-1-phosphate-backbone
    phosphatidylglycerol, is not established. EgsA is the only characterised candidate but has
    never been shown to be the source.
  boundary: What is established is that the purified enzyme reversibly reduces glycerone phosphate to sn-glycerol
    1-phosphate with NADH, with kinetics strongly favouring reduction; it is the only
    characterised bacterial G1P-forming enzyme; B. subtilis contains both glycerophosphate
    enantiomers and incorporates the S form into the backbone of some phosphatidylglycerol
    species; and PcrB uses sn-glycerol 1-phosphate to make heptaprenylglyceryl phosphate. What is not
    established is whether the G1P in either lipid pool comes from EgsA. No lipidomics of an egsA
    deletion has been reported, egsA was not among the genes recovered by a transposon screen for
    loss of lipoprotein N-acetylation (which depends on the PcrB product), and engineered E. coli
    made correctly configured archaeal-type lipids without AraM, so at least one further route to
    G1P exists in bacteria and is unidentified.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: This is the join between the archaeal-type backbone chemistry and the lipids that
    use it, and it is the point at which any process annotation on a bacterial G1P dehydrogenase
    stops being a statement about a measured reaction and becomes an inference from pathway logic.
    It also bears on whether G1P supply or acyltransferase specificity is what limits heterochiral
    lipid production in bacteria.
  resolution: Chiral lipidomics of an egsA deletion and of a complemented strain, measuring
    heptaprenylglycerol, its acetylated form and the backbone chirality of phosphatidylglycerol;
    isotopic tracing from glycerone phosphate into those pools; and a search for the second G1P
    route, for example by selecting for restored archaeal-lipid synthesis in an AraM-free host.
  provenance:
  - reference_id: PMID:42286214
    supporting_text: other mechanism(s) of G1P biosynthesis must exist in E. coli and possibly
      other bacteria, as archaeal lipids with the correct chiral structure could be produced even
      in the absence of AraM
    reference_section_type: RESULTS
