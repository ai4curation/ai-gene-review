      screen in rich medium, so it is not evidence against EgsA supplying the G1P, but it leaves the source
      open.
    supporting_text: Only pcrB, yvoF, and ypjA fully suppressed TLR2 activity, indicating these genes
      are strictly required for Ac-LP synthesis.
    reference_section_type: RESULTS
  - statement: The downstream fate of the G1P-derived lipid is defined. PcrB condenses sn-glycerol 1-phosphate
      with heptaprenyl pyrophosphate, and the processed, acetylated product serves as the acetyl donor
      for lipoprotein N-acetylation.
    supporting_text: PcrB condenses sn-glycerol 1-phosphate (G1P) with heptaprenyl pyrophosphate (HepPP)
    reference_section_type: DISCUSSION
