id: P94527
gene_symbol: egsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: EgsA (also called AraM) is the sn-glycerol-1-phosphate dehydrogenase of Bacillus
  subtilis and the first enzyme of this class to be identified outside the Archaea. It is a
  soluble, homodimeric, nickel-dependent oxidoreductase (EC 1.1.1.261) of the
  glycerol-1-phosphate dehydrogenase family that interconverts glycerone phosphate
  (dihydroxyacetone phosphate, DHAP) and sn-glycerol 1-phosphate (G1P), the S-configured
  enantiomer of glycerophosphate on which archaeal membrane lipids are built. Its kinetics are
  strongly asymmetric, with a KM of 8.1 uM for glycerone phosphate against 1370 uM for
  sn-glycerol 1-phosphate, so in the cell it runs in the reductive direction and generates G1P.
  NADH is the preferred coenzyme and NADPH is also used; catalysis requires Ni2+ and is not
  supported by the other divalent cations tested; and the enzyme is strictly specific for the
  1-phosphate enantiomer, oxidising sn-glycerol 1-phosphate but not sn-glycerol 3-phosphate, with
  no glycerol dehydrogenase activity. It is the only characterised bacterial route to sn-glycerol
  1-phosphate. B. subtilis uses that enantiomer in two known places. The prenyltransferase PcrB
  condenses G1P with all-trans-heptaprenyl diphosphate to form the archaeal-type ether lipid
  heptaprenylglyceryl phosphate, which is dephosphorylated and acetylated to a low-abundance
  lipophilic acetyl donor used for lipoprotein N-acetylation, and a minor fraction of the
  organism's phosphatidylglycerol carries a glycerol-1-phosphate backbone. The gene is the fifth
  cistron of the araABDLMNPQ-abfA operon and is induced by L-arabinose and repressed by glucose
  through the regulator AraR, yet it is not required for L-arabinose utilisation and no chemical
  connection between its reaction and arabinose catabolism is known.
