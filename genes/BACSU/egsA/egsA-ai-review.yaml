    id: GO:0006650
    label: glycerophospholipid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000103182
  review:
    summary: Correct but unspecific as to direction. The enzyme's own kinetics establish that it
      runs reductively, towards glycerophosphate rather than away from it, so the biosynthetic
      child is the supported refinement.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0046474
      label: glycerophospholipid biosynthetic process
    reason: 'What this row decides is direction, not pathway membership. The claim that EgsA acts
      in glycerophospholipid metabolism at all is carried by the existing term, inherited from the
      UniRule mapping, and a refinement to an is_a child neither adds to that claim nor depends on
      it; the parent would assert exactly the same lipid involvement, only more vaguely. The
      direction, by contrast, is settled by direct enzymology on the purified B. subtilis protein,
      with no assumption about which lipid consumes the product: the KM is 8.1 uM for glycerone
      phosphate and 16 uM for NADH but 1370 uM for sn-glycerol 1-phosphate, roughly 170-fold
      higher on the oxidative side, so the enzyme operates as a reductase forming glycerophosphate
      from a glycolytic intermediate, not as a dehydrogenase consuming it. A glycerophosphate
      dehydrogenase running towards glycerophosphate sits on the biosynthetic, not the catabolic,
      side of glycerophospholipid metabolism, which makes GO:0046474 the specific supported term
      under the rule that a correct but unspecific term is MODIFY rather than kept. The comparator
      check confirms this is GO''s established convention for the reaction type rather than an
      over-reach on our part: E. coli GpsA, the stereochemical mirror of EgsA and likewise a
      NAD(P)-dependent glycerophosphate dehydrogenase that supplies a precursor rather than
      acylating anything, carries GO:0046474 by IMP from three papers and by IBA, alongside its
      own precursor term GO:0046167. This decision deliberately does not rest on EgsA being the
      in vivo source of the G1P used by PcrB or of the G1P-backbone phosphatidylglycerol of
      B. subtilis. That flux is unproven: no egsA-deletion lipidomics has been reported, egsA was
      not among the genes recovered by a transposon screen for loss of lipoprotein N-acetylation,
      and at least one further bacterial route to G1P exists. It is recorded below as an open
      knowledge gap. Had that link been the basis of the row, the correct action would have been
      MARK_AS_OVER_ANNOTATED on the lipid wording itself rather than a refinement of it, and the
      refinement is chosen precisely because it leaves the lipid wording exactly as strong as GOA
      already had it. What is independently established, and keeps the inherited framing from
      being empty, is that the S-configured glycerophosphate this enzyme makes does occur in the
      backbone of B. subtilis phosphatidylglycerol and of its heptaprenylglyceryl ether lipid, so
      glycerophospholipids with this backbone exist in the organism whatever supplies them.
      GO:0008611 ether lipid biosynthetic process is not proposed instead: the ether bond is
      formed by PcrB and not by EgsA, and the same G1P pool may also feed the ester-linked
      G1P-backbone phosphatidylglycerol. The term that would describe the demonstrated reaction''s
      process directly, sn-glycerol 1-phosphate biosynthetic process, does not exist in GO and is
      requested in proposed_new_terms; its absence is an ontology gap and is not a reason to leave
      this row at the less specific of the two terms that do exist.'
