suggested_questions:
- question: Should GO have a process term for the formation of sn-glycerol 1-phosphate, mirroring GO:0046167
    for the 3-phosphate enantiomer, or a stereochemistry-neutral glycerophosphate biosynthetic parent
    with the two enantiomer-specific processes as children?
  experts:
  - GO ontology editors
  - lipid metabolism curators
- question: When an enzyme is the only characterised source of a precursor but the flux to the downstream
    product has never been demonstrated, how far down the pathway should a process annotation reach? Here
    the choice is between a precursor-level term that does not exist and a lipid-level term that reaches
    past what was measured.
  experts:
  - GO Consortium biocurators
- question: Is the physiological role of bacterial G1P dehydrogenase the supply of the heptaprenylglyceryl
    ether-lipid backbone, the supply of the minor glycerol-1-phosphate-backbone phosphatidylglycerol,
    both, or something not yet connected to lipids at all?
  experts:
  - Bacterial membrane lipid biochemists
- question: What is the second, unidentified bacterial route to sn-glycerol 1-phosphate implied by archaeal-lipid
    synthesis in AraM-free engineered E. coli, and does B. subtilis also have it?
  experts:
  - Bacterial lipid biochemists
  - Synthetic biologists working on archaeal lipid engineering
suggested_experiments:
- hypothesis: EgsA is the source of the sn-glycerol 1-phosphate used by PcrB and of the glycerol-1-phosphate
    backbone found in B. subtilis phosphatidylglycerol.
  description: Construct a clean markerless egsA deletion and a complemented derivative, and quantify
    heptaprenylglycerol and acetyl-heptaprenylglycerol, free glycerophosphate enantiomer pools and the
    backbone chirality of phosphatidylglycerol by chiral chromatography coupled to mass spectrometry.
    Loss of the S-backbone species and of the ether lipid in the deletion, with restoration on complementation,
    would establish the flux; their persistence would show the second G1P route operates in B. subtilis
    as well.
  experiment_type: targeted deletion with chiral lipidomics
- hypothesis: Flux through EgsA, rather than the specificity of the downstream enzymes, sets how much
    glycerol-1-phosphate-backbone lipid the cell makes.
  description: Titrate egsA expression from an inducible promoter across a range spanning the native level,
    and measure free G1P, G1P-backbone phosphatidylglycerol and heptaprenylglycerol at each level. A monotonic
    response of the lipid pools to egsA dosage would identify the dehydrogenase as the controlling step;
    a flat response would place control downstream.
  experiment_type: expression titration with metabolite and lipid quantification
- hypothesis: The reductive direction observed in vitro is the direction the enzyme runs in the cell.
  description: Determine the full set of steady-state kinetic constants and the apparent equilibrium position
    for both directions at physiological pH and nickel occupancy, and measure the intracellular glycerone
    phosphate, G1P, NADH and NAD+ concentrations in growing cells, so that the thermodynamic driving force
    in vivo can be computed rather than inferred from KM values alone.
  experiment_type: enzyme kinetics combined with intracellular metabolite quantification
- hypothesis: Arabinose induction of egsA is physiologically meaningful, and the archaeal-type ether lipid
    matters under a condition the operon reports.
  description: Compare wild type, an egsA deletion and an araR mutant for growth, lipoprotein N-acetylation
    state and envelope stress sensitivity on L-arabinose and on plant arabinan-containing substrates versus
    glucose, and measure ether-lipid levels in each condition. A deletion phenotype confined to arabinose
    growth would give the enzyme a physiological setting; its absence would indicate the operon placement
    is not functionally informative.
  experiment_type: conditional phenotyping with lipid and lipoprotein analysis
