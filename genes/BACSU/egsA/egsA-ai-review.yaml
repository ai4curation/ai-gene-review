    supporting_text: Only pcrB, yvoF, and ypjA fully suppressed TLR2 activity, indicating these genes
      are strictly required for Ac-LP synthesis.
    reference_section_type: RESULTS
  - reference_id: file:BACSU/egsA/egsA-source-analysis/guldan-2010-assay-scope.md
    supporting_text: External G1P bypasses its endogenous formation.
- gap_statement: Why a glycerophosphate dehydrogenase that produces a candidate lipid precursor is transcribed
    as part of an L-arabinose catabolic operon, and under what physiological condition that coupling matters,
    is unknown. No metabolic connection between the enzyme's reaction and arabinose catabolism has been
    identified.
  boundary: What is established is that egsA (araM) is the fifth cistron of the araABDLMNPQ-abfA operon,
    the operon is induced by L-arabinose and repressed by glucose through the repressor AraR, and araM
    is not required for L-arabinose utilisation. The enzyme's substrates are glycerone phosphate and NAD(H),
    neither of which is specific to pentose catabolism. What is not established is any condition under
    which arabinose-induced G1P production is advantageous, and whether the arrangement is functional
    at all rather than a relic of genome organisation.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Regulation is often the only clue to the physiological setting of an enzyme whose product
    has no obvious bulk role, and this enzyme's product is a minor lipid backbone and a carrier cofactor
    rather than a bulk membrane component. If arabinose-induced G1P synthesis is functional, it would
    point to the condition in which the archaeal-type lipid matters; if it is not, it is a caution against
    reading the operon's name into the gene's role, which the gene symbol araM has already encouraged.
  resolution: Measure heptaprenylglycerol, its acetylated form and glycerophosphate enantiomer pools in
    wild type, an egsA deletion and an araR mutant, with and without arabinose, on plant polysaccharide
    and on glucose; and test whether an egsA deletion has a growth, lipoprotein acetylation or envelope-stress
    phenotype specifically under arabinose induction.
