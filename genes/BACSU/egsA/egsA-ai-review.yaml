core_functions:
- description: Nickel-dependent, homodimeric reduction of the glycolytic intermediate glycerone
    phosphate to sn-glycerol 1-phosphate, using NADH in preference to NADPH. The reaction is
    freely reversible in vitro but is strongly biased towards reduction (KM 8.1 uM for glycerone
    phosphate against 1370 uM for sn-glycerol 1-phosphate), so in the cell the enzyme is a
    producer of the S-configured glycerophosphate enantiomer. It is strictly specific for that
    enantiomer, acting on sn-glycerol 1-phosphate and not on sn-glycerol 3-phosphate, and has no
    glycerol dehydrogenase activity. This is the only characterised bacterial route to sn-glycerol
    1-phosphate, the backbone that the archaeal-type ether lipid of B. subtilis and a minor
    fraction of its phosphatidylglycerol are built on. The process placement follows GO's
    convention for precursor-supplying glycerophosphate dehydrogenases, under which the mirror
    enzyme E. coli GpsA carries glycerophospholipid biosynthetic process by IMP; it is not a claim
    that flux from this enzyme into any particular glycerophospholipid has been demonstrated,
    which remains an open question recorded in the knowledge gaps.
