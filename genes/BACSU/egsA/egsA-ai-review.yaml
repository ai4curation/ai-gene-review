  label: Bacillus subtilis subsp. subtilis str. 168
description: EgsA (AraM) is a soluble, homodimeric, nickel-dependent glycerol-1-phosphate dehydrogenase
  of Bacillus subtilis. The purified enzyme reversibly interconverts glycerone phosphate and sn-glycerol
  1-phosphate, preferentially using NAD(H), with lower catalytic efficiency using NADP(H). Its stereospecific
  reaction produces the glycerophosphate enantiomer used by the PcrB ether-lipid synthase. EgsA is therefore
  a candidate source of that precursor, but its contribution to native heptaprenylglyceryl-lipid or phosphatidylglycerol
  synthesis has not been established. The gene lies in the L-arabinose-inducible ara operon and is regulated
  by AraR and glucose, yet it is dispensable for L-arabinose utilization and no chemical role in arabinose
  catabolism has been demonstrated.
