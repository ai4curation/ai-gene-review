    glycerol-phosphate.
  findings:
  - statement: AraM is the only known mechanism of G1P biosynthesis, yet engineered E. coli made
      archaeal lipids with the correct chiral backbone without it, so at least one further
      bacterial route to G1P exists and has not been identified.
    supporting_text: other mechanism(s) of G1P biosynthesis must exist in E. coli and possibly
      other bacteria, as archaeal lipids with the correct chiral structure could be produced even
      in the absence of AraM
    reference_section_type: RESULTS
  - statement: G1P dehydrogenase was thought to be exclusive to Archaea; the bacterial equivalent
      AraM occurs in some bacteria, notably Bacillus, but is not ubiquitous.
    supporting_text: previously thought to be exclusive to Archaea
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available and read; both quotes located verbatim in the results. The
      statement about a second G1P route is the authors' reading of an earlier engineering result
      (Caforio et al. 2018) rather than new data in this paper, which is why it is recorded as the
      boundary of a knowledge gap rather than as a finding about B. subtilis. The paper's own data
      concern PlsY and PlsC specificity.
