- proposed_name: sn-glycerol 1-phosphate biosynthetic process
  proposed_definition: The chemical reactions and pathways resulting in the formation of sn-glycerol 1-phosphate,
    the S-configured enantiomer of glycerol phosphate.
  justification: A stereospecific G1P biosynthesis process would describe precursor formation separately
    from downstream lipid synthesis. Free G1P is not itself a glycerophospholipid, so absence of the specific
    process term does not justify assigning lipid participation without evidence. This retained proposal
    is a terminology suggestion, not a new annotation or a claim of measured native flux.
