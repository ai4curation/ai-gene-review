proposed_new_terms:
- proposed_name: sn-glycerol 1-phosphate biosynthetic process
  proposed_definition: 'The chemical reactions and pathways resulting in the formation of
    sn-glycerol 1-phosphate, the S-configured enantiomer of glycerol phosphate.'
  justification: GO describes the formation of the other glycerophosphate enantiomer with
    GO:0046167 glycerol-3-phosphate biosynthetic process, under GO:0006072 glycerol-3-phosphate
    metabolic process, but a search of the whole ontology for glycerol-1-phosphate returns only
    molecular-function terms (GO:0050492, GO:0106357, GO:0106358, GO:0000121 sn-glycerol
    1-phosphatase activity and GO:0120536 heptaprenylglyceryl phosphate synthase activity) and no
    process term at any level. The asymmetry has a practical consequence. The process that a G1P
    dehydrogenase is actually shown to carry out is the formation of sn-glycerol 1-phosphate,
    whereas the only process terms available to it describe the downstream lipid instead, since sn-glycerol
    1-phosphate is not itself a glycerophospholipid, since it bears none of the O-acyl, O-alkyl or
    O-alkenyl groups that GO:0006650 and GO:0046474 require. E. coli GpsA can hold both its
    precursor term and the lipid term; the bacterial and archaeal G1P dehydrogenases can hold only
    the lipid term, which forces every annotation of them to reach past what was measured. The
    requested term would let the demonstrated reaction be stated on its own, and would also give a
    stereochemically explicit place for the archaeal G1P dehydrogenases and for whatever second
    bacterial route to G1P is eventually identified. A stereochemistry-neutral parent spanning
    both enantiomers would be an acceptable alternative shape, and is raised as a question for GO
    below.
  proposed_parent:
    id: GO:0090407
    label: organophosphate biosynthetic process
