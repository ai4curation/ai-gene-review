- id: PMID:40626731
  title: 'Lipoprotein N-terminal modification in Bacillus: a new paradigm for extracellular
    acetylation and species-dependent Toll-like receptor 2 immunomodulation.'
  findings:
  - statement: A transposon screen plus targeted deletions identified pcrB, yvoF and ypjA as
      strictly required for lipoprotein N-acetylation; egsA was not among the genes reported. This
      is a non-saturating screen in rich medium, so it is not evidence against EgsA supplying the
      G1P, but it leaves the source open.
    supporting_text: Only pcrB, yvoF, and ypjA fully suppressed TLR2 activity, indicating these
      genes are strictly required for Ac-LP synthesis.
    reference_section_type: RESULTS
  - statement: The downstream fate of the G1P-derived lipid is defined. PcrB condenses sn-glycerol
      1-phosphate with heptaprenyl pyrophosphate, and the processed, acetylated product serves as
      the acetyl donor for lipoprotein N-acetylation.
    supporting_text: PcrB condenses sn-glycerol 1-phosphate (G1P) with heptaprenyl pyrophosphate
      (HepPP)
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available and read. Verified by direct search of the full text that
      neither egsA nor araM is mentioned anywhere in the paper, which is the basis for treating
      the absence of egsA from the screen hits as uninformative rather than as counter-evidence.
      Highly relevant to what the G1P-derived lipid is for; it does not address G1P supply.
