suggested_questions:
- question: A verified bacterial helicase-loader molecular-function term capturing this protein’s precise
    loading contribution was not identified. A bacterial helicase-loading term with appropriate accessory/ATPase
    contribution semantics would express the established mechanism without using MCM-specific terminology.
    DnaI ATPase/loading and the DNA-binding accessory roles of DnaD/DnaB are supported. GO:7770122 MCM
    loader activity names the MCM2–7 complex and is not an appropriate substitute.
