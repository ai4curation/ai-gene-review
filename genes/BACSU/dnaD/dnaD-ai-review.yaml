  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaD is a DNA-binding and DNA-remodeling protein that helps assemble the Bacillus subtilis
  replication-initiation machinery. It recognizes a single-stranded DnaD recognition element at oriC and
  links DnaA-dependent origin assembly to DnaB and subsequent DnaI-mediated loading of DnaC helicase.
  DnaD also participates in replication restart and can form DNA-remodeling scaffolds without nicking
  DNA.
