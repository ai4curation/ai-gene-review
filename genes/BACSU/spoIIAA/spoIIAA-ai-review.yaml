      function assigns positive regulation of DNA-templated transcription (indirect,
      via sigma F release).
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Consensus of multiple IEA pipelines supports the sporulation role and
      anti-anti-sigma factor function of SpoIIAA, in agreement with the manually
      curated UniProt entry.
    supporting_text: "KW   3D-structure; Direct protein sequencing; Phosphoprotein;"
core_functions:
- description: >-
    Acts as an anti-anti-sigma factor: unphosphorylated SpoIIAA binds SpoIIAB and
    displaces sigma F, releasing sigma F to form active holoenzyme; the SpoIIE
    phosphatase regenerates dephosphorylated SpoIIAA in the forespore to
    asymmetrically activate sigma F.
  molecular_function:
    id: GO:0043856
    label: anti-sigma factor antagonist activity
  directly_involved_in:
  - id: GO:0030435
    label: sporulation resulting in formation of a cellular spore
  supported_by:
  - reference_id: file:BACSU/spoIIAA/spoIIAA-uniprot.txt
    supporting_text: "In the phosphorylated form it could act as an anti-anti-sigma factor that counteracts SpoIIAB and thus releases sigma f from inhibition."
- description: >-
    Physically binds the anti-sigma factor SpoIIAB, competing with sigma F for
    SpoIIAB and driving partner switching. SpoIIAB then phosphorylates SpoIIAA on
    a serine residue, inactivating it in the mother cell.
  molecular_function:
    id: GO:0045152
    label: antisigma factor binding
  directly_involved_in:
  - id: GO:0030435
    label: sporulation resulting in formation of a cellular spore
  supported_by:
  - reference_id: file:BACSU/spoIIAA/spoIIAA-uniprot.txt
    supporting_text: "Phosphorylated by SpoIIAB on a serine residue."
suggested_questions:
- question: >-
    What is the precise cellular concentration and phosphorylation state of SpoIIAA
    on either side of the polar septum immediately before and after sigma F activation,
    and how quantitatively does SpoIIE phosphatase activity account for the observed
    asymmetric release of sigma F in the forespore?
- question: >-
    Does SpoIIAA participate in any regulatory circuits beyond the SpoIIAB/sigma F
    partner switch (for example, through phosphorylation by non-SpoIIAB kinases such
    as PrkC, or through interaction with paralogous anti-sigma-factor antagonists
    like RsbV during vegetative stress responses)?
suggested_experiments:
- hypothesis: >-
    Compartment-specific dephosphorylation of SpoIIAA by SpoIIE is both necessary
    and sufficient to explain the timing and asymmetry of sigma F activation in the
    forespore.
  description: >-
    Combine live-cell FRET or bimolecular fluorescence complementation to monitor
    SpoIIAA-SpoIIAB and SpoIIAA-SpoIIE interactions in individual sporulating cells
    with quantitative Western/Phos-tag blotting of phospho-SpoIIAA in isolated
    mother-cell and forespore compartments. Test SpoIIE catalytic (phosphatase-dead)
    mutants and SpoIIAA phospho-mimetic/null substitutions at the Ser-58 target
    residue.
  experiment_type: Live-cell fluorescence imaging + compartment fractionation + phospho-blotting
- hypothesis: >-
    SpoIIAA function is modulated by other B. subtilis kinases or by paralogous
    anti-anti-sigma factors under specific physiological conditions.
  description: >-
    Screen for in vivo phosphorylation of SpoIIAA in wild-type and kinase-deletion
    backgrounds (e.g. prkC, prkD, yabT, rsbW) using targeted MS/MS phosphoproteomics
    on sporulating and vegetatively stressed cultures, and test SpoIIAA/RsbV cross-
    complementation by expressing each from its counterpart's promoter in the
    reciprocal deletion background.
  experiment_type: Phosphoproteomics + genetic complementation
