references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: The InterPro anti-sigma-factor antagonist family record (STAS/anti-anti-sigma
      fold) maps to antisigma factor binding and anti-sigma factor antagonist activity.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: Phylogenetic-tree propagation supports SpoIIAA as an anti-anti-sigma
      factor, consistent with conserved orthologs (e.g. RsbV in the general stress
      response) in Bacillus and related Firmicutes.
