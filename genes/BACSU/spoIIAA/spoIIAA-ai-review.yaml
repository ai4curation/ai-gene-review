id: P10727
gene_symbol: spoIIAA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
description: >-
  SpoIIAA is the anti-sigma-F factor antagonist (anti-anti-sigma factor) in the
  partner-switching module that gates activation of the forespore-specific sigma
  factor sigma F during Bacillus subtilis sporulation. In its unphosphorylated
  form SpoIIAA binds SpoIIAB and displaces sigma F from the SpoIIAB-sigma F
  complex, freeing sigma F to associate with core RNA polymerase; SpoIIAB then
  phosphorylates SpoIIAA on a serine residue, inactivating it and allowing
  SpoIIAB to re-bind sigma F. Dephosphorylation of phospho-SpoIIAA by the
  forespore-localized phosphatase SpoIIE regenerates active SpoIIAA and drives
  the asymmetric release of sigma F in the forespore compartment.
existing_annotations:
- term:
    id: GO:0043856
    label: anti-sigma factor antagonist activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      SpoIIAA is the anti-sigma factor antagonist for sigma F. In its unphosphorylated
      form SpoIIAA counteracts the anti-sigma factor SpoIIAB, releasing sigma F from
      inhibition; SpoIIAB-mediated phosphorylation on Ser-58 inactivates SpoIIAA.
    action: ACCEPT
    reason: >-
      This is the core molecular function of SpoIIAA. UniProt describes SpoIIAA as an
      anti-anti-sigma factor that counteracts SpoIIAB to release sigma F. Note that the
      UniProt free-text hedge attributing the activity to "the phosphorylated form"
      predates the established partner-switch model, in which the unphosphorylated
      species is the active anti-anti-sigma factor and phosphorylation is the
      inactivating step; the term assignment itself is unaffected and aligns with the
      curated IBA annotation.
    supported_by:
      - reference_id: file:BACSU/spoIIAA/spoIIAA-uniprot.txt
        supporting_text: "In the phosphorylated form it could act as an anti-anti-sigma factor that counteracts SpoIIAB and thus releases sigma f from inhibition."
- term:
    id: GO:0045893
    label: positive regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  review:
    summary: >-
      SpoIIAA indirectly promotes transcription by activating sigma F through
      antagonism of the anti-sigma factor SpoIIAB.
    action: KEEP_AS_NON_CORE
    reason: >-
      SpoIIAA does not bind DNA or the RNA polymerase directly, but it positively
      regulates sigma F activity by counteracting SpoIIAB. The transcriptional effects
      are indirect, so this term is kept as a non-core downstream process.
    supported_by:
      - reference_id: file:BACSU/spoIIAA/spoIIAA-uniprot.txt
        supporting_text: "In the phosphorylated form it could act as an anti-anti-sigma factor that counteracts SpoIIAB and thus releases sigma f from inhibition."
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      SpoIIAA regulates transcription indirectly by controlling sigma F availability
      through SpoIIAB antagonism.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This term is too general and redundant with the more specific positive regulation
      of transcription. SpoIIAA acts via sigma-factor control rather than serving as a
      direct transcriptional regulator, so this generic term overstates its role.
    supported_by:
      - reference_id: file:BACSU/spoIIAA/spoIIAA-uniprot.txt
        supporting_text: "In the phosphorylated form it could act as an anti-anti-sigma factor that counteracts SpoIIAB and thus releases sigma f from inhibition."
- term:
