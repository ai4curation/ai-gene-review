suggested_questions:
- question: >-
    How is CoA synthesis regulated in B. subtilis if its type III PanK is not feedback-inhibited by CoA,
    and does the type I PanK paralog contribute?
suggested_experiments:
- description: >-
    Delete coaX and the type I coaA paralog of B. subtilis singly and together and measure growth, CoA
    pools and pantothenamide sensitivity.
  experiment_type: genetic analysis with metabolomics
