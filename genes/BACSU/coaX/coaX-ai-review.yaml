  review:
    summary: Pantothenate kinase is the core activity of B. subtilis CoaX, shown on the recombinant enzyme.
    action: ACCEPT
    reason: >-
      Brand and Strauss cloned, expressed and characterized B. subtilis CoaX and showed ATP-dependent
      pantothenate phosphorylation, defining the type III isoform. The IEA (InterPro/HAMAP UniRule) row
      describes the same activity.
