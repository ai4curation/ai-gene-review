  review:
    summary: >-
      Type III pantothenate kinases require a monovalent cation; the generic cation binding term is correct
      but broad.
    action: KEEP_AS_NON_CORE
    reason: >-
      UniProt records NH4+ or K+ as an experimentally determined cofactor of B. subtilis CoaX. Cation
      binding is a cofactor property of the kinase rather than a separate role, and the generic term is
      as precise as the UniRule assignment.
    supported_by:
