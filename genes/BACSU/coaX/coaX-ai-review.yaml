gene_symbol: coaX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  coaX (yacB, BSU00700) of Bacillus subtilis encodes a type III pantothenate kinase, a member of the acetate
  and sugar kinase/Hsc70/actin (ASKHA) superfamily unrelated to the P-loop type I enzyme. It phosphorylates
  (R)-pantothenate with ATP to 4'-phosphopantothenate, the first step of CoA biosynthesis from pantothenate.
  Unlike type I and type II kinases it is not feedback-inhibited by CoA or acetyl-CoA and neither accepts
  nor is inhibited by the antimetabolite N-pentylpantothenamide. Activity requires a monovalent cation,
  NH4+ or K+, and only ATP serves as the phosphoryl donor. B. subtilis CoaX was one of the two enzymes
  whose characterization defined the type III pantothenate kinase isoform.
