  - term:
      id: GO:0009002
      label: serine-type D-Ala-D-Ala carboxypeptidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000003
    qualifier: enables
    supporting_entities:
      - EC:3.4.16.4
    review:
      summary: The class-B PBP role is peptide crosslink transfer, not a generic carboxypeptidase
        proxy.
      action: MODIFY
      reason: The EC-derived hydrolysis term does not adequately describe the supported
        physiological transpeptidase role. D,D-transpeptidation transfers the donor D-Ala4 acyl
        group to an amino acceptor after release of D-Ala5; simply hydrolyzing the terminal D-Ala is
        a different endpoint. This refinement does not assert that all incidental hydrolysis is
        impossible. Catalyzes class-B-PBP serine-dependent D,D peptide crosslinking in Bacillus
        peptidoglycan. PBP3 provides conditional catalytic backup when PBP2B is inactive and
        contributes to beta-lactam tolerance. The D,D assignment is a mechanistic inference from its
        enzyme class and active-site-dependent rescue, not a product-resolved PBP3 linkage assay;
        physical PBP2B remains required.
      supported_by:
        - reference_id: PMID:28792086
          supporting_text: the essential function of PBP 3, in the absence of biochemically active
            PBP 2B, lies in its TPase activity
      proposed_replacement_terms:
        - id: NTR
          label: serine-type peptidoglycan D,D-transpeptidase activity
