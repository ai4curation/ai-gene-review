      label: penicillin binding
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN000771406
      - UniProtKB:P0AD65
      - UniProtKB:P0AD68
      - UniProtKB:P9WKD1
    review:
      summary: Beta-lactam binding reports the PBP active site but is not its native catalytic
        function.
      action: KEEP_AS_NON_CORE
      reason: The penicillin-binding claim is appropriate for this class-B PBP and is retained as an
        experimentally useful drug-binding property. Native function is peptide crosslinking and,
        for the cognate divisomal PBPs, a separable physical role in synthase assembly. Drug binding
        alone is not proof of net transpeptidation. PBP3 binds the fluorescent beta-lactam probe in
        membrane profiles but has lower susceptibility to selected beta-lactams; reduced affinity is
        not absence of all penicillin binding.
      supported_by:
        - reference_id: PMID:28792086
          supporting_text: the essential function of PBP 3, in the absence of biochemically active
            PBP 2B, lies in its TPase activity
