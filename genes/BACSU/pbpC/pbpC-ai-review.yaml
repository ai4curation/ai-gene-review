proposed_new_terms:
  - proposed_name: serine-type peptidoglycan D,D-transpeptidase activity
    proposed_definition: 'Catalysis of peptide crosslink formation in peptidoglycan by a serine-dependent
      D,D-transpeptidase: transfer of the donor D-Ala4 acyl group from a pentapeptide stem to an amino
      acceptor on another stem or its peptide bridge, with release of terminal D-Ala5. This forms a D,D
      (4-to-3) crosslink rather than an L,D (3-to-3) crosslink; the acceptor amino group and bridge depend
      on the organism.'
    justification: The reviewed enzyme performs the class-B PBP crosslink reaction; neither a
      carboxypeptidase hydrolysis term nor an L,D-transpeptidase term accurately represents this
      endpoint. Reaction and physiological-scope limits are stated in the core description. Round-1
      QuickGO search found no exact D,D-specific peptidoglycan transpeptidase term; GO:0016755 is
      the verified aminoacyl-transfer parent. The shared definition does not standardize the
      organism-specific acceptor chemistry or upgrade inferential linkage evidence.
    supported_by:
      - reference_id: PMID:28792086
        supporting_text: the essential function of PBP 3, in the absence of biochemically active PBP
          2B, lies in its TPase activity
    proposed_parent:
      id: GO:0016755
      label: aminoacyltransferase activity
