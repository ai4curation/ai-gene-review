id: P42971
gene_symbol: pbpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: PBP3, encoded by pbpC, is a membrane-anchored class-B penicillin-binding protein of
  Bacillus subtilis. Its serine-dependent transpeptidase activity contributes to peptidoglycan
  construction and beta-lactam tolerance. PBP3 is dispensable in an otherwise wild-type strain 168
  background but becomes necessary when the catalytic activity of divisomal PBP2B is disabled. This
  compensation retains the physical PBP2B protein and does not make PBP3 an obligatory component of
  normal division.
