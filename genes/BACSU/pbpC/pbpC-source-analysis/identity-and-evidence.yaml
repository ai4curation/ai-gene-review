identity_and_construct_scope: P42971, pbpC/ycsM/yzsA/BSU04140, 668 residues, strain
  168. PMID28792086 examines168/168CA-derived mutants, PBP3 S410A, and PBP2B S309A.
  It establishes active-site-dependent compensation and antibiotic tolerance, not
  direct mass-spectrometric identification of PBP3-generated 4→3 versus3→3 products.
interpretation_limits: Neither ordinary essentiality nor replacement of FtsW-bound
  physical PBP2B follows from the bypass. The precise physiological contribution of
  PBP3 outside these conditions remains less resolved. Microdomain claims rely on
  fractionation studies whose PBP3-specific supplementary evidence could not be independently
  recovered in this audit.
