taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: AsnS is the class II asparaginyl-tRNA synthetase of Bacillus subtilis. It uses ATP to attach
  free L-asparagine to tRNA(Asn), supplying Asn-tRNA(Asn) for cytoplasmic translation. Its direct charging
  route coexists with a non-discriminating AspRS–GatCAB pathway; the presence of AsnS therefore does not
  imply that the indirect route is absent.
