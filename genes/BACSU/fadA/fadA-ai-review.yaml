taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: FadA (YusK) is the 3-ketoacyl-CoA thiolase of the Bacillus subtilis 168 fatty-acid degradation
  system. It is assigned the reversible acetyl-CoA C-acyltransferase reaction, operating in beta-oxidation
  as thiolytic chain shortening. Native genetic evidence supports palmitate utilization, and its expression
  is controlled by FadR.
