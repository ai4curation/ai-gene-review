  - PANTHER:PTN001823071
  - UniProtKB:P0C7L2
  review:
    summary: The propagated phenylacetate role of FadA is unresolved.
    action: UNDECIDED
    reason: The IBA is a phylogenetic claim at PTN001823071, not a pairwise transfer judged by donor count.
      Native palmitate genetics and thiolase chemistry support beta-oxidation but do not demonstrate or
      exclude an additional phenylacetate role. No target-specific phenylacetate assay was found; the
      loss check found no IRD/IKR. Retain the payload without inventing a loss or an exclusion based on
      another thiolase pathway.
    supported_by:
    - reference_id: file:BACSU/fadA/fadA-uniprot.txt
      supporting_text: Reaction=an acyl-CoA + acetyl-CoA = a 3-oxoacyl-CoA + CoA;
    - reference_id: file:BACSU/fadE/fadE-source-analysis/primary-scope.md
      supporting_text: IPTG induces downstream genes to mitigate insertion polarity.
    propagation_review:
      root_cause: UNRESOLVED
