suggested_questions:
- question: Does this protein bind RNA under physiological conditions, and if so is the PUA domain responsible?
    The E. coli biochemical result does not settle this target.
- question: How is ProJ kinase flux and feedback controlled during osmotic adaptation in strain 168? The
    JH642 proHJ induction and disruption phenotypes establish an osmoadaptive branch, but do not directly
    quantify purified strain-168 ProJ feedback kinetics.
