  - InterPro:IPR036974
  review:
    summary: RNA binding by B. subtilis 168 ProJ (O07509) remains unresolved; the E. coli binding result
      does not establish conservation.
    action: UNDECIDED
    reason: This InterPro IEA derives from PUA signatures IPR002478/IPR036974, not a PAINT RNA-binding assertion.
      The signatures identify a compatible domain but do not establish RNA binding by B. subtilis 168 ProJ
      (O07509). PMID:37511294 assayed ASKA-derived E. coli K-12 ProB recloned with a C-terminal His tag
      and expressed in BL21-Gold (DE3). Genomic SELEX and competition EMSA support specific in-vitro binding,
      with estimated KD >>10 micromolar; ProB was not among the proteins tested by iCLIP. The binding site
      was not mapped and the primary study did not test conservation in this target. Neither weak affinity
      nor an unresolved physiological role negates a molecular binding activity. Conversely, the positive
      E. coli result cannot establish a whole-family function. UNDECIDED therefore records unresolved target-level
      transfer, not inaccessible literature or a conclusion that this target lacks binding. No target-specific
      positive or negative RNA assay, or mapped loss of an RNA-binding site, was identified.
    supported_by:
    - reference_id: file:BACSU/proJ/proJ-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: Belongs to the glutamate 5-kinase family.
    - reference_id: PMID:37511294
      supporting_text: The specificity of the interaction was further confirmed by competition experiments
        involving a 50-fold excess of unlabeled control RNAs (Figure 7B).
