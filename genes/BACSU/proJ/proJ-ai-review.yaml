taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: Bacillus subtilis ProJ is a soluble cytoplasmic glutamate 5-kinase that transfers phosphate
  from ATP to L-glutamate, producing L-glutamyl 5-phosphate for the first step of proline biosynthesis.
  ProJ supplies the kinase step of the osmotically induced branch, using the same ProA reductase as the
  anabolic ProB branch.
