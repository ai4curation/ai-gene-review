- term:
    id: GO:0047473
    label: D-alanine [D-alanyl carrier protein] ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010072
  - RHEA:55132
  - EC:6.2.1.54
  - UniRule:UR000031302
  review:
    summary: Core molecular function (RHEA:55132), supported by biochemistry, structure and genetics on B. subtilis DltA itself.
    action: ACCEPT
    reason: >-
      The IEA rests on HAMAP MF_00593 / RHEA:55132, and the claim is borne out on the
      target. Recombinant B. subtilis DltA was characterized with B. subtilis DltC as
      its carrier substrate and its D-Ala adenylation half-reaction is inhibited by a
      D-alanyl-adenylate mimic (PMID:15955059). The B. subtilis DltA structures show
      the D-Ala specificity determinants and a thiolation conformation that presents
      the adenylate to the phosphopantetheine arm (PMID:18784082). Insertional
      inactivation of dltA abolishes D-alanyl esters on LTA and WTA (PMID:7797557).
      The two-protein ligase/carrier reaction was established biochemically for the
      L. casei orthologs (PMID:8682792). The activity is the protein's evolved
      function, not a promiscuous one.
    supported_by:
    - reference_id: PMID:15955059
      supporting_text: The incorporation of D-Ala into lipoteichoic acid requires the D-alanine:D-alanyl carrier protein ligase (DltA) and the carrier protein (DltC).
    - reference_id: PMID:15955059
      supporting_text: we designed an inhibitor (D-alanylacyl-sulfamoyl-adenosine), which is able to block the D-Ala adenylation by DltA at a K(i) value of 232 nM vitro
    - reference_id: PMID:18784082
      supporting_text: The structures of DltA reported here reveal the determinants for D-Ala substrate specificity and confirm that the peptidyl carrier protein-activating domains are able to adopt multiple conformational states, in this case corresponding to the thiolation reaction.
    - reference_id: PMID:7797557
      supporting_text: Insertional inactivation of dltA-dltD results in complete absence of D-alanine from both LTA and WTA.
- term:
    id: GO:0070395
    label: lipoteichoic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010072
  - UniRule:UR000031302
  - UniPathway:UPA00556
  review:
    summary: True; D-alanylation is the last modification step of mature LTA. In B. subtilis the same pathway also D-alanylates WTA.
    action: ACCEPT
    reason: >-
      dltA inactivation removes D-alanine esters from LTA, and DltA performs the first
      catalytic step of that modification, so it takes part in making D-alanyl-LTA.
      The term is incomplete rather than wrong: in B. subtilis the dlt pathway also
      D-alanylates WTA, which is why GO:0070400 teichoic acid D-alanylation is added
      as a NEW row alongside it.
    supported_by:
    - reference_id: PMID:7797557
      supporting_text: The Bacillus subtilis dlt operon (D-alanyl-lipoteichoic acid) is responsible for D-alanine esterification of both lipoteichoic acid (LTA) and wall teichoic acid (WTA).
- term:
    id: GO:0070400
    label: teichoic acid D-alanylation
  evidence_type: IMP
  original_reference_id: PMID:7797557
  qualifier: involved_in
  review:
    summary: NEW. The precise process for DltA; covers D-alanylation of both LTA and WTA in B. subtilis.
    action: NEW
    reason: >-
      GO:0070400 "the formation of a D-alanyl ester of teichoic acid" is exactly what
      the dlt pathway does, and in B. subtilis it acts on both LTA and WTA, which the
      existing LTA-only term does not capture. Participation test: DltA itself
      performs a step of the process (D-alanine activation and loading onto DltC),
      so this is not a substrate or necessity-only inference. Evidence: dltA
      insertion abolishes D-alanine esters on both polymers (IMP), and the ligase
      activity was shown on the purified B. subtilis protein.
    supported_by:
    - reference_id: PMID:7797557
      supporting_text: Insertional inactivation of dltA-dltD results in complete absence of D-alanine from both LTA and WTA.
    - reference_id: PMID:15955059
      supporting_text: The incorporation of D-Ala into lipoteichoic acid requires the D-alanine:D-alanyl carrier protein ligase (DltA) and the carrier protein (DltC).
