  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  DltA of Bacillus subtilis is the D-alanine--D-alanyl carrier protein ligase (Dcl),
  the first enzyme of the dltABCD pathway that esterifies lipoteichoic acid (LTA) and
  wall teichoic acid (WTA) with D-alanine. It is a soluble, cytoplasmic member of the
  ANL (adenylate-forming) superfamily, related to non-ribosomal peptide synthetase
  adenylation domains. In an ATP-dependent two-step reaction it adenylates D-alanine
  to D-alanyl-AMP and then transfers the D-alanyl group as a thioester to the
  4'-phosphopantetheine arm of the D-alanyl carrier protein DltC. DltB and DltD then
  move the D-alanyl group across the membrane to teichoic acids. The resulting
  D-alanyl esters reduce the net negative charge of the cell envelope; dlt mutants
  lack D-alanine on both LTA and WTA, grow normally, and are more sensitive to
  cationic antimicrobial peptides such as nisin.
