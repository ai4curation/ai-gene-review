suggested_questions:
- question: >-
    Does B. subtilis DltA load D-alanine only onto DltC in vivo, or also onto other
    carrier proteins (ACP) whose phosphopantetheine arm it accepts in vitro, and does
    that matter for flux into teichoic acids?
suggested_experiments:
- description: >-
    Measure DltA kinetics with holo-DltC versus holo-ACP from B. subtilis, and test
    whether ACP can support D-alanylation of LTA in a dltC deletion strain.
  experiment_type: enzyme kinetics and genetic complementation
