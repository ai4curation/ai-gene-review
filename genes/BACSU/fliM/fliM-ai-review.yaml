- id: PMID:1898932
  title: Nucleotide sequence and characterization of a Bacillus subtilis gene encoding a flagellar switch
    protein.
  findings:
  - statement: FliM overproduction alters motility and switching; a chromosomal frameshift causes an aflagellate
      phenotype. These data support a switch role but do not alone map physical ring architecture.
    supporting_text: In B. subtilis, overproduction of FliM generates mostly nonmotile cells. Those cells
      that are motile switch less frequently.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache remains abstract-only after normal acquisition and force retry where attempted;
      full access was also sought at the publisher. Explicit abstract findings are used without inventing
      methods. UniProt links the cloned fliM sequence M37691/AAA22446.1 to P23453. Its perturbation effects
      on SigD-dependent expression are downstream consequences of switch/assembly defects, not direct
      transcription-factor activity.
