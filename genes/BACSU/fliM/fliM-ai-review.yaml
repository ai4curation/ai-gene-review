      FliM, is the identified phosphatase.
- id: PMID:25313396
  title: FlgM is secreted by the flagellar export apparatus in Bacillus subtilis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Publisher full text inspected at https://journals.asm.org/doi/10.1128/jb.02324-14 despite
      the abstract-only cache. Figure 4 assays FliM swarming; FliM is in the structural set for hook-basal-body
      completion. These strains are predominantly 3610 after constructions in PY79/DS2569. Minimal FlgM
