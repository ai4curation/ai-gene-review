taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: FliM is a structural and regulatory component of the Bacillus subtilis flagellar switch at
  the basal-body C-ring. It binds phosphorylated CheY and helps convert the chemotactic signal into a
  change in motor rotation; loss of its N-terminal CheY-P binding region gives the clockwise phenotype
  of a cheY mutant. Its contribution to switch structure and flagellar assembly is distinct from the CheY-P
  phosphatase activity of the neighboring switch protein FliY and from torque generation by the motor.
