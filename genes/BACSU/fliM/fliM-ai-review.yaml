- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IC
  original_reference_id: PMID:1898932
  review:
    summary: FliM forms a ring scaffold supporting FliG and contacting FliY.
    action: NEW
    reason: PMID30455280 tests assembly contacts using bacterial two-hybrid assays and targeted cross-linking,
      including multimer formation and controls for switch assembly. The resulting evidence places FliM
      middle domains in a ring scaffold supporting FliG and identifies FliM/FliY C-terminal contacts.
      This supports physical structural activity, not just CheY-P binding or a protein-name inference.
      The genes were cloned from strain3610 and tested in constructed backgrounds including PY79; the
      role is inferred for the168 reference without asserting an identical unmodified assay construct.
    supported_by:
    - *id001
    - *id002
