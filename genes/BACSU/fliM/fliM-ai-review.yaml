  title: Bacillus subtilis hydrolyzes CheY-P at the location of its action, the flagellar switch.
  findings:
  - statement: FliM binds CheY-P and its N-terminal binding region is required for the normal
      motor response.
    supporting_text: 'We were able to show that both of these proteins are

      capable of binding CheY-P in vitro.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache remains abstract-only after normal acquisition and force retry where
      attempted; full access was also sought at the publisher. Explicit abstract findings are
      used without inventing methods. UniProt records strain 168 / OI1085 for the FliM-CheY
      interaction experiments; FliY, not FliM, is the identified phosphatase.
- id: PMID:25313396
  title: FlgM is secreted by the flagellar export apparatus in Bacillus subtilis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Publisher full text inspected at https://journals.asm.org/doi/10.1128/jb.02324-14
      despite the abstract-only cache. Figure 4 assays FliM swarming; FliM is in the structural
      set for hook-basal-body completion. These strains are predominantly 3610 after constructions
      in PY79/DS2569. Minimal FlgM secretion requirements must not be equated with assembly
      requirements.
- id: PMID:1898932
  title: Nucleotide sequence and characterization of a Bacillus subtilis gene encoding a flagellar
    switch protein.
  findings:
  - statement: The cloned fliM gene encodes a flagellar switch component.
    supporting_text: The nucleotide sequence of the Bacillus subtilis fliM gene has been determined.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache remains abstract-only after normal acquisition and force retry where
      attempted; full access was also sought at the publisher. Explicit abstract findings are
      used without inventing methods. UniProt links the cloned fliM sequence M37691/AAA22446.1
      to P23453. Its perturbation effects on SigD-dependent expression are downstream consequences
      of switch/assembly defects, not direct transcription-factor activity.
