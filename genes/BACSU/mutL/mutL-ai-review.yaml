- term:
    id: GO:0030983
    label: mismatched DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002099
  - InterPro:IPR013507
  review:
    summary: Mismatched DNA binding propagated from InterPro MutL signatures.
    action: REMOVE
    reason: Mismatch recognition belongs to MutS. MutL is a sequence-unspecific endonuclease recruited
      after recognition, so the InterPro mapping conflates recruitment with mismatch sensing. Same decision
      as for the PSEPK and P. aeruginosa MutL reviews.
    supported_by:
    - reference_id: PMID:30391220
      supporting_text: In most prokaryotes and all eukaryotes, the mismatch repair protein MutL is a sequence-unspecific
        endonuclease that nicks the newly synthesized strand and marks it for repair.
