id: P49850
gene_symbol: mutL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: Bacillus subtilis MutL is the homodimeric GHKL-ATPase coordinator and strand-incision endonuclease
  of a mismatch repair system that has no MutH or Dam methylation. Its C-terminal domain holds the DQHA(X)2E(X)4E
  endonuclease motif and a Zn2+-binding site, organized in dimerization and regulatory subdomains, and
  nicks DNA in a metal-dependent reaction that is stimulated by ATP binding to the N-terminal domain.
  A conserved beta-clamp-binding motif in the C-terminal domain tethers MutL to the replicative sliding
  clamp, and the clamp interaction is needed for nicking and for mismatch repair in vivo. mutS-mutL operon
  deletion and single mutL loss raise the spontaneous mutation rate several tens of fold.
