suggested_questions:
- question: How does the beta-clamp orientation on nascent DNA direct BsMutL nicking to the newly synthesized
    strand, and do ribonucleotides or Okazaki-fragment ends contribute?
suggested_experiments:
- description: Map MutL-dependent nicks genome-wide in B. subtilis cells carrying a defined mismatch to
    test whether incision is restricted to the nascent strand and positioned by the clamp.
