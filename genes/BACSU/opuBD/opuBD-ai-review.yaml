  label: Bacillus subtilis subsp. subtilis str. 168
description: OpuBD is the integral membrane translocation subunit of the Bacillus subtilis OpuB ABC
  importer. OpuB transports choline across the plasma membrane, supplying a precursor that the separate
  GbsB and GbsA enzymes oxidize to the compatible solute glycine betaine. Its choline specificity
  differs from the broader substrate range of the related OpuC system. The assembled importer contains
  OpuBA, OpuBB, OpuBC and OpuBD; individual subunits contribute distinct ATP-coupling, translocation
  or substrate-capture roles.
