  label: Bacillus subtilis subsp. subtilis str. 168
description: PBP2B is a membrane-anchored class-B penicillin-binding protein of the Bacillus
  subtilis divisome. Its serine transpeptidase domain forms peptide crosslinks in septal
  peptidoglycan, while the protein also supplies an essential physical role in the division
  machinery. In strain 168 derivatives, catalytic inactivation at Ser309 can be tolerated when PBP3
  supplies compensating transpeptidase activity; loss of the PBP2B protein remains lethal.
