  - id: PMID:28792086
    title: Functional redundancy of division specific penicillin-binding proteins in Bacillus
      subtilis.
    findings:
      - statement: Strain168-derived PBP2B S309A retains the physical protein requirement while
          losing Bocillin binding; PBP3 active-site function supplies conditional compensation. Loss
          of the PBP2B protein remains lethal.
    reference_review:
      review_notes: Q07868, pbpB/BSU15160, current 713 residues, strain 168. PMID28792086 amplified
        pbpB from 168 and tested native 168/168CA derivatives plus E. coli membrane expression. The
        paper discusses a historical translation start offset; current sequence version 3 already
        has the assayed serine at 309, so no additional +3 offset is applied. PMID38480901 is
        PY79-derived HaloTag-PBP2B imaging and is explicitly comparative. PBP3 catalytic rescue
        applies to the tested strain 168 backgrounds and conditions. It does not establish
        replacement of the physical PBP2B component. The structural association with FtsW must not
        be represented as PBP2B independently catalyzing glycan polymerization.
  - id: PMID:38480901
    title: Peptidoglycan synthesis drives a single population of septal cell wall synthases during
      division in Bacillus subtilis.
    findings:
      - statement: PY79-derived HaloTag-PBP2B displays a processive population whose movement
          depends on peptidoglycan synthesis; FtsZ dynamics modulate this behavior. It does not
          directly reconstitute purified strain168 PBP2B/FtsW chemistry.
    reference_review:
      review_notes: Q07868, pbpB/BSU15160, current 713 residues, strain 168. PMID28792086 amplified
        pbpB from 168 and tested native 168/168CA derivatives plus E. coli membrane expression. The
        paper discusses a historical translation start offset; current sequence version 3 already
        has the assayed serine at 309, so no additional +3 offset is applied. PMID38480901 is
        PY79-derived HaloTag-PBP2B imaging and is explicitly comparative. PBP3 catalytic rescue
        applies to the tested strain 168 backgrounds and conditions. It does not establish
        replacement of the physical PBP2B component. The structural association with FtsW must not
        be represented as PBP2B independently catalyzing glycan polymerization.
  - id: PMID:30692671
    title: FtsW is a peptidoglycan polymerase that is functional only in complex with its cognate
      penicillin-binding protein.
    findings:
      - statement: Comparative purified Streptococcus/Staphylococcus experiments separate activation
