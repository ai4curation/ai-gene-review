target: Q07868
organism: BACSU
gene: pbpB
identity_and_construct_scope: Q07868, pbpB/BSU15160, current 713 residues, strain
  168. PMID28792086 amplified pbpB from 168 and tested native 168/168CA derivatives
  plus E. coli membrane expression. The paper discusses a historical translation start
  offset; current sequence version 3 already has the assayed serine at 309, so no
  additional +3 offset is applied. PMID38480901 is PY79-derived HaloTag-PBP2B imaging
  and is explicitly comparative.
interpretation_limits: PBP3 catalytic rescue applies to the tested strain 168 backgrounds
  and conditions. It does not establish replacement of the physical PBP2B component.
  The structural association with FtsW must not be represented as PBP2B independently
  catalyzing glycan polymerization.
