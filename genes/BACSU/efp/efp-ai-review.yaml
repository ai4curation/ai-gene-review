- term:
    id: GO:0010468
    label: regulation of gene expression
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028334
  review:
    summary: ARBA regulation of gene expression; EF-P's effect on gene expression is at the translational
      level.
    action: MODIFY
    reason: EF-P changes how much of certain proteins is made, so the broad term is not wrong. In B. subtilis
      the clearest case is flagellar proteins, where an EF-P-relieved pause in FliY limits flagellar number.
      That effect is entirely at the level of translation, so the general term is refined to its descendant
      regulation of translation (GO:0006417). That term is kept as non-core in the E. coli and P. putida
      EF-P reviews, because EF-P is a general elongation factor rather than a dedicated regulator. The core
      process terms remain translational elongation and rescue of stalled cytosolic ribosome.
    proposed_replacement_terms:
    - id: GO:0006417
      label: regulation of translation
    supported_by:
    - reference_id: PMID:31237868
      supporting_text: One mutation abolished a translational pause site within the flagellar C-ring component
        FliY to increase flagellar number and restore swarming motility in the absence of EF-P
    - reference_id: PMID:31237868
      supporting_text: EF-P-alleviation of ribosome pausing may be particularly important for macromolecular
        assemblies like the flagellum that require precise protein stoichiometries
