core_functions:
- description: Cytoplasmic EF-P that stimulates peptide-bond formation during translational elongation,
    relieving ribosome pausing at consecutive-proline motifs. In B. subtilis this activity matters most
    for making flagellar proteins in the right amounts. The protein carries a 5-aminopentanol group on Lys32,
    but this modification is not strictly needed for its activity.
