id: P49778
gene_symbol: efp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: efp encodes elongation factor P (EF-P), a cytoplasmic tRNA-mimicking translation factor
  that binds the ribosome between the P and E sites and stimulates peptide-bond formation, relieving ribosome
  pausing at consecutive-proline motifs during translational elongation. In B. subtilis EF-P is post-translationally
  modified on Lys32 with a 5-aminopentanol group, assembled on the protein by a pathway that includes the
  ketoreductase YmfI, which reduces a 5-aminopentanone intermediate. Unusually among bacteria, B. subtilis
  efp is not needed for growth even though EF-P relieves pauses in essential genes; its loss instead impairs
  flagellar biosynthesis, and with it swarming motility, and abolishes sporulation. The B. subtilis protein
  also keeps much of its activity without the modification.
