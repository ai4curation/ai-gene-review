- id: PMID:14586115
  title: Expression profiling of translation-associated genes in sporulating Bacillus subtilis and consequence
    of sporulation by gene inactivation.
  findings:
  - statement: Disrupting B. subtilis efp entirely abolishes sporulation without affecting growth.
    supporting_text: The effect was especially pronounced in the efp mutant, sporulation of which was entirely
      abolished without affecting growth.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache, cited by UniProt for the sporulation and disruption-phenotype statements.
      The sporulation defect is an indirect consequence of the translation-factor activity, so no sporulation
      process term is proposed.
- id: PMID:23239624
  title: EF-P is essential for rapid synthesis of proteins containing consecutive proline residues.
  findings:
  - statement: In vitro, EF-P promotes peptide-bond formation and stabilizes peptidyl-tRNA when consecutive
      prolines stall the ribosome.
    supporting_text: EF-P promotes peptide-bond formation and stabilizes the peptidyl-transfer RNA in the
      catalytic center of the ribosome.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Mechanistic reconstitution with E. coli EF-P; family-level support
      for the elongation factor activity.
- id: PMID:27002156
  title: Translation Control of Swarming Proficiency in Bacillus subtilis by 5-Amino-pentanolylated Elongation
    Factor P.
  findings:
  - statement: B. subtilis EF-P carries a 5-aminopentanol group on Lys32, which is needed for swarming motility.
    supporting_text: We identified a 5-aminopentanol moiety attached to Lys(32) of B. subtilis EF-P that is
      required for swarming motility.
  - statement: An in vivo reporter shows which diprolyl motifs need modified EF-P for efficient synthesis,
      and these motifs are found in flagellar genes.
    supporting_text: identified peptide motifs whose efficient synthesis was most dependent on 5-aminopentanol
      EF-P
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache (PMC4900249). Primary identification of the 5-aminopentanol modification
      on B. subtilis EF-P.
- id: PMID:28787546
  title: Carbonyl reduction by YmfI in Bacillus subtilis prevents accumulation of an inhibitory EF-P modification
    state.
  findings:
  - statement: YmfI reduces EF-P-5-aminopentanone to EF-P-5-aminopentanol.
    supporting_text: Here we determine that the protein YmfI catalyzes the reduction of EF-P-5 aminopentanone
      to EF-P-5 aminopentanol.
  - statement: B. subtilis EF-P keeps its function without the modification. The unmodifiable K32R allele
      bypasses the need for YmfI in swarming.
    supporting_text: B. subtilis encodes the first EF-P ortholog that retains function in the absence of
      modification.
  - statement: efp is not needed for growth in B. subtilis, but is needed for swarming motility.
    supporting_text: Bacillus subtilis where EF-P is not required for growth and is instead specifically
      required for swarming motility
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC5630506). Identifies YmfI as the reductase in the B. subtilis EF-P
      modification pathway.
- id: PMID:29615499
  title: EF-P Posttranslational Modification Has Variable Impact on Polyproline Translation in Bacillus subtilis.
  findings:
  - statement: A forward genetic screen and MS/MS identify ynbB, gsaB and ymfI as needed for EF-P 5-aminopentanolylation.
      The moiety appears to be built directly on EF-P.
    supporting_text: 5-aminopentanol is likely directly assembled on EF-P through a novel modification pathway
  - statement: Mutants in the modification pathway have polyproline-reporter defects that are milder than
      in the efp deletion.
    supporting_text: this defect was not as significant as the defect seen in an efp mutant
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC5885033). Defines the B. subtilis EF-P modification pathway and
      shows that the modification affects polyproline translation in a variable, context-dependent way.
- id: PMID:31237868
  title: Suppressor mutations in ribosomal proteins and FliY restore Bacillus subtilis swarming motility in
    the absence of EF-P.
  findings:
  - statement: Ribosome profiling shows that B. subtilis EF-P relieves pausing at tandem-proline motifs
      across the genome, including in essential genes, yet efp mutants grow normally.
    supporting_text: Bacillus subtilis EF-P also alleviates ribosome pausing at sequences encoding tandem
      prolines
  - statement: The swarming defect of efp mutants comes from impaired flagellar biosynthesis. A pause at
      an SPP motif in FliY limits flagellar number.
    supporting_text: One mutation abolished a translational pause site within the flagellar C-ring component
      FliY to increase flagellar number and restore swarming motility in the absence of EF-P
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC6613710). Direct in vivo genome-wide evidence for B. subtilis EF-P
      polyproline pause relief.
