    id: GO:0072344
    label: rescue of stalled cytosolic ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00043322
  review:
    summary: EF-P relieves ribosomes stalled at polyproline motifs in B. subtilis.
    action: ACCEPT
    reason: B. subtilis-specific evidence confirms the ARBA prediction independently. Ribosome profiling
      shows EF-P-relieved pauses at tandem-proline motifs across the genome, including in essential genes
      and flagellar genes. A fluorescent reporter screen shows that efficient synthesis of diprolyl motifs
      depends on modified EF-P. Core process, consistent with the sibling EF-P reviews. The B. subtilis
      protein differs from its E. coli and P. putida counterparts in two ways. Its Lys32 5-aminopentanol
      modification is not strictly required for activity. And loss of rescue is tolerated for growth.
    supported_by:
