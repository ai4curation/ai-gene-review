      supporting_text: Bacillus subtilis EF-P also alleviates ribosome pausing at sequences encoding tandem
        prolines
    - reference_id: PMID:27002156
      supporting_text: identified peptide motifs whose efficient synthesis was most dependent on 5-aminopentanol
        EF-P
