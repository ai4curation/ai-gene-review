proposed_new_terms: []
suggested_questions:
- question: Why can B. subtilis tolerate the loss of EF-P, given that EF-P relieves ribosome pauses in
    essential genes, while EF-P is essential or growth-limiting in most other bacteria?
- question: Which enzymes, beyond the ketoreductase YmfI, build and attach the 5-aminopentanol group to
    EF-P Lys32, and what is the first substrate of the pathway?
- question: GO:0072344 is defined as freeing the ribosome from a stalled complex, but EF-P resolves the
    stall by stimulating peptide-bond formation, so elongation resumes and the complex is not disassembled.
    Is a dedicated term for pause relief during elongation needed for EF-P and eIF5A?
suggested_experiments:
- description: Reconstitute the B. subtilis EF-P modification pathway in vitro with candidate enzymes
    (GsaB, YnbB, YmfI) and identify the intermediates at each step by mass spectrometry.
  experiment_type: in vitro reconstitution with mass spectrometry
- description: Measure polyproline pausing genome-wide by ribosome profiling in strains carrying EF-P
    K32R and K32A and in modification-pathway mutants. This would show which pause sites need the modification
    and which are relieved by unmodified EF-P.
  experiment_type: ribosome profiling
