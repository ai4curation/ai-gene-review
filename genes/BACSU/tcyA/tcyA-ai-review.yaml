- id: PMID:15262924
  title: Three different systems participate in L-cystine uptake in Bacillus subtilis.
  findings:
  - statement: Disrupting tcyA (yckK) abolishes the residual L-cystine uptake and
      growth on L-cystine of a strain lacking the TcyP and TcyJKLMN importers.
    supporting_text: "In the presence of a low or high l -cystine concentration, the
      growth of strain BSIP1582 (Δ ytmJKLMN :: aphA3 Δ yhcL :: spc ) was completely
      abolished by introduction of a yckK gene disruption"
  - statement: A transposon insertion in tcyA confers selenocystine resistance.
    supporting_text: Mutants were selected for growth in the presence of 10 μM seleno-
      dl -cystine on plates containing l -methionine as the sole sulfur source.
  - statement: TcyABC is a lower-affinity L-cystine importer, and tcyA expression
      is low under all sulfur conditions tested.
    supporting_text: The expression of the yckK ′ -lacZ fusion was low in all the
      conditions tested.
  - statement: TcyA (with TcyP and YxeMNO) probably also contributes to S-methylcysteine
      import, a secondary substrate.
    supporting_text: This indicates that YhcL, YckK, and YxeMNO are probably involved
      to the import of S -methylcysteine together with YtmJKLMN.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterisation of tcyA (yckK). PubMed metadata and PMC
      full text checked. The evidence is genetic and whole-cell uptake; there is no
      purified-protein binding assay.
- id: PMID:29995990
  title: Aspartate deficiency limits peptidoglycan synthesis and sensitizes cells
    to antibiotics targeting cell wall synthesis in Bacillus subtilis.
  findings:
  - statement: The TcyABC and TcyP systems are the major routes of 2,6-diaminopimelate
      import in B. subtilis. The result is at system level, and the cached text does
      not identify which tcyABC gene was deleted.
    supporting_text: The results suggest that TcyABC and TcyP are the two major DAP
      uptake systems, with TcyJKLMN playing little if any role.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PMC full text. DAP import is inferred from suppression of aspB-mutant
      lysis by DAP in transporter mutants (indirect, system-level), so no GO annotation
      is proposed from it.
- id: PMID:22138345
  title: Crystal structures of two solute receptors for L-cystine and L-cysteine,
    respectively, of the human pathogen Neisseria gonorrhoeae.
  findings:
  - statement: The N. gonorrhoeae homologue Ngo0372 (cd13711, PANTHER SF35) binds
      L-cystine with nanomolar affinity, and its pocket Tyr59 is crucial for binding.
    supporting_text: Mutational analysis of two residues from the binding pocket,
      Trp97 and Tyr59, revealed that the latter is crucial for L-cystine binding.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Gives the biochemical and structural basis for inferring
      L-cystine binding in the cd13711 group. Ngo0372 is in a different PANTHER subfamily
      (SF35) from TcyA (SF34), so it is used only as supporting family context.
