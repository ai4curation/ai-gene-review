        the solute-binding component of the system
- term:
    id: GO:0015811
    label: L-cystine transport
  evidence_type: IMP
  original_reference_id: PMID:15262924
  review:
    summary: >-
      Disrupting tcyA (yckK) in a tcyP tcyJKLMN double mutant completely
      abolished growth on L-cystine and the residual uptake of L-[14C]cystine.
      A transposon insertion in tcyA was isolated as a selenocystine-resistant
      mutant. TcyA is the substrate-binding subunit of the TcyABC importer.
    action: NEW
    reason: >-
      There is no process annotation for TcyA in GOA, but the 2004 genetic and
      uptake study supports it. Participation test: as the solute-binding
      subunit of the ABC importer, TcyA does part of the work of transport by
      capturing the substrate and delivering it to the TcyB permease. It is
      not a substrate of the process or merely required for it. Comparator
      check: solute-binding subunits of ABC importers are routinely annotated
      to the transport process of their ligand (for example E. coli PstS with
      phosphate ion transmembrane transport in this repository). GO:0015811 is
      used because GO has no more specific L-cystine import term. The evidence
      is genetic, from mutant growth and whole-cell uptake, so IMP is the
      appropriate code.
    supported_by:
    - reference_id: PMID:15262924
      supporting_text: This indicates that YckK was involved in the residual l -cystine
        transport observed in a Δ yhcL Δ ytmJKLMN mutant.
    - reference_id: PMID:15262924
      supporting_text: Sequence analysis revealed that the transposon had been inserted
        into codon 182 of the yckK gene, which encodes the solute binding protein
        of a polar amino acid ABC transporter
    - reference_id: file:BACSU/tcyA/tcyA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'CC   -!- FUNCTION: Part of the ABC transporter complex TcyABC
        involved in L-'
- term:
    id: GO:0015184
    label: L-cystine transmembrane transporter activity
  evidence_type: IMP
  original_reference_id: PMID:15262924
  qualifier: contributes_to
  review:
    summary: >-
      TcyA is the extracellular solute-binding subunit of the TcyABC
      ATP-binding cassette importer. The transporter activity belongs to the
      TcyABC complex, so TcyA contributes to it rather than having it alone.
    action: NEW
    reason: >-
      The usual GO treatment of a solute-binding subunit is to say it
      contributes_to the complex's transmembrane transporter activity, because
      the subunit captures the substrate but does not move it across the
      membrane. The uptake data show that the TcyABC system imports L-cystine
      and that tcyA is needed for that import. The weaker contributes_to claim
      is used on purpose. No experiment has shown that purified TcyA binds
      L-cystine, so no binding molecular function is asserted here. The
      ligand-binding claim rests on family and structural inference from
      Ngo0372 (see core_functions and the bioinformatics RESULTS).
    supported_by:
    - reference_id: PMID:15262924
      supporting_text: These results strongly suggest that YckK participates in
        l -cystine transport.
    - reference_id: PMID:15262924
      supporting_text: For the YckKJI ABC transporter, the three different proteins
        also probably participate in l -cystine uptake.
    - reference_id: PMID:15262924
      supporting_text: In contrast, several elements strongly suggest that TcyABC
        is a lower-affinity l -cystine transporter.
- term:
    id: GO:0055052
    label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
  evidence_type: IC
  original_reference_id: PMID:15262924
  review:
    summary: >-
      TcyA is encoded in the tcyABC operon with the permease TcyB (YckJ) and
      the ATP-binding protein TcyC (YckI). It is the solute-binding subunit of
      this canonical three-component ABC importer.
    action: NEW
    reason: >-
      The complex term is a curator inference. It rests on the operon
      organisation and component identities reported in the primary papers,
      together with the genetic evidence that TcyA acts in uptake by this
      system. The TcyABC complex has not been isolated biochemically, hence IC
      rather than IDA or IPI. The GO:0055052 definition covers organisms with
      one membrane, in which the substrate-binding protein is tethered to the
      cytoplasmic membrane, as TcyA is.
    supported_by:
    - reference_id: PMID:15262924
      supporting_text: Interestingly, the yckK gene seems to form an operon with the
        yckJ and the yckI downstream genes. YckJ corresponds to the permease, and
        YckI corresponds to the ATP binding protein of an ABC transporter.
    - reference_id: PMID:7551042
      supporting_text: The 268 amino acid protein, the product of orf1, represents
        the solute-binding component of the system
