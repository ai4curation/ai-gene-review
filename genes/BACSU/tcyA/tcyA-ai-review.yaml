  review:
    summary: >-
      Plasma membrane location from the UniProt subcellular-location mapping.
      TcyA has a prokaryotic lipoprotein signal (lipobox) with a predicted
      lipidated Cys20. In a Gram-positive bacterium with a single membrane,
      this tethers the mature binding protein to the outer leaflet of the
      cytoplasmic membrane, where it works with the TcyBC membrane module.
    action: ACCEPT
    reason: >-
      Lipoprotein solute-binding proteins of monoderm bacteria are anchored to
      the cytoplasmic (plasma) membrane, and TcyA has the lipobox and a
      predicted lipid-modified cysteine. This is the location where the core
      function happens. The anchor is predicted (ProRule) rather than shown
      experimentally, so a more specific term such as external side of plasma
      membrane is not proposed. Plasma membrane is as precise as the evidence
      allows.
