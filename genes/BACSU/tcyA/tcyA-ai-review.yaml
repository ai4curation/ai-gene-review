- id: file:BACSU/tcyA/tcyA-bioinformatics/RESULTS.md
  title: TcyA family placement and comparator identity
  findings:
  - statement: TcyA is in PANTHER PTHR35936:SF34 with D3VIU4 and the uncharacterized
      B. subtilis paralog YckB. The biochemically characterised cystine SBPs E. coli
      TcyJ and Ngo0372 are in SF35. The Ngo0372 binding-pocket Tyr and Trp are conserved
      in TcyA (Y55, W94).
    supporting_text: Both are conserved in TcyA, at Y55 and W94.
core_functions:
- description: >-
    Lipid-anchored extracellular substrate-binding subunit of the TcyABC
    ATP-binding cassette importer, which takes up L-cystine. It is genetically
    required for the low-affinity TcyABC branch of L-cystine import in B.
    subtilis. L-cystine binding by TcyA itself is inferred from the Ngo0372
    homologue (conserved binding-pocket Tyr) and has not been measured
    directly. The TcyABC system also imports 2,6-diaminopimelate (system-level
    genetic evidence), and probably S-methylcysteine.
  contributes_to_molecular_function:
    id: GO:0015184
    label: L-cystine transmembrane transporter activity
  directly_involved_in:
