id: P42199
gene_symbol: tcyA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  TcyA (formerly YckK; BSU03610) is the lipid-anchored extracellular
  solute-binding protein of TcyABC, one of three L-cystine uptake systems in
  Bacillus subtilis. It is a 268-residue precursor with a lipoprotein signal
  peptide and a predicted N-terminal diacylglyceryl-cysteine anchor (Cys20),
  so the mature protein faces outward on the cytoplasmic membrane. It belongs
  to bacterial solute-binding protein family 3 (polar amino acid-binding,
  PBP2 fold). tcyA is the first gene of the tcyABC operon, which also encodes
  the permease TcyB and the ATP-binding subunit TcyC. Genetic evidence places
  TcyA in L-cystine import: a transposon insertion in tcyA confers resistance
  to the toxic analogue selenocystine, and disrupting tcyA abolishes the
  residual L-cystine uptake and growth on L-cystine of a strain lacking the
  other two cystine importers (TcyP and TcyJKLMN). TcyABC behaves as a
  lower-affinity system than TcyP or TcyJKLMN, and tcyA is weakly expressed
  under all sulfur conditions tested. Later genetic work assigned TcyABC,
  together with TcyP, as a major importer of 2,6-diaminopimelate. Direct
  binding of L-cystine by TcyA has not been measured. The Neisseria
  gonorrhoeae homologue Ngo0372 binds L-cystine with nanomolar affinity, and
  its pocket tyrosine required for binding is conserved in TcyA.
