proposed_new_terms: []
suggested_questions:
- question: >-
    What are the ligand specificity and affinity of purified TcyA? In
    particular, does it bind L-cystine, 2,6-diaminopimelate and
    S-methylcysteine directly, and with what Kd compared with Ngo0372 (21 nM
    for L-cystine)?
- question: >-
    PANTHER subfamily SF34 contains TcyA and the uncharacterized paralog YckB
    and excludes the characterised cystine-binding proteins of SF35. Does
    L-cystine specificity hold across SF34, or is it a TcyA-lineage property
    that should not be propagated to the whole subfamily?
- question: >-
    Under what conditions is tcyABC expressed above the low basal level
    reported, and what regulator controls it?
suggested_experiments:
- description: >-
    Isothermal titration calorimetry or intrinsic tryptophan fluorescence with
    purified mature TcyA (residues 20-268, non-lipidated) against L-cystine,
    L-selenocystine, meso- and LL-diaminopimelate, S-methylcysteine and
    L-cysteine, together with a Y55A mutant, to establish direct binding.
  experiment_type: ligand binding assay
- description: >-
    Clean in-frame tcyA deletion in a tcyP tcyJKLMN background, complemented in
    trans, to confirm that tcyA by itself accounts for the residual L-cystine
    and diaminopimelate import (excluding polar effects on tcyBC).
  experiment_type: genetic complementation
