  review:
    summary: >-
      Phylogenetic assignment of CH-OH-donor oxidoreductase activity from a deep SDR node, contradicted
      by FabL's directly assayed C=C (enoyl) reduction chemistry.
    action: REMOVE
    reason: >-
      This IBA descends from PANTHER node PTN002449287, whose seeds are 3-oxoacyl-ACP- and hydroxysteroid-reductase-like
      SDRs (E. coli FabG P0AEK2, human HSD17B8 Q92506) that reduce or oxidise a CH-OH group. FabL belongs
