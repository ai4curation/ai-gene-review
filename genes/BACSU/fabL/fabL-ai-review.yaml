suggested_questions:
- question: >-
    Do FabI and FabL carry different shares of the enoyl reduction flux in B. subtilis under different
    growth and redox conditions, given their opposite NADH/NADPH preferences?
suggested_experiments:
- description: >-
    Measure acyl-ACP and membrane fatty-acid profiles, and NADH/NADPH pools, in fabI and fabL single deletions
    during exponential and stationary growth, to test whether the two reductases are interchangeable in
    vivo or partition by cofactor availability.
