      corrected_label: enoyl-[acyl-carrier-protein] reductase (NADPH) activity
      cause: PRACTICE_CHANGE
      confidence: PROBABLE
      explanation: >-
        This 2011 IDA row on P71079 (B. subtilis FabL) cites PMID:11007778, which reports NADPH-dependent
