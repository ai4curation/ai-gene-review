      double bond of an enoyl-ACP thioester (EC 1.3.1.104), so the donor group named by this term is wrong
      for this protein; no alcohol dehydrogenase or ketoreductase activity has been reported for it. The
      PTHR43639 family review reaches the same conclusion independently, excepting P71079 by name from
      its GO:0016616 term assessment, so this removal agrees with the family-level judgment rather than
      overruling it.
