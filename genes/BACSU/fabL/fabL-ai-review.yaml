id: P71079
gene_symbol: fabL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  FabL is a short-chain dehydrogenase/reductase (SDR)-fold enoyl-[acyl-carrier-protein] reductase of Bacillus
  subtilis and related Firmicutes. It catalyses the NADPH-dependent reduction of the carbon-carbon double
  bond of trans-2-enoyl-ACP to give saturated acyl-ACP, the last reaction of each elongation cycle of
  type II (dissociated) fatty-acid synthesis, using the Tyr-(Xaa)6-Lys catalytic architecture shared with
  FabI. It is a homotetramer. In B. subtilis it acts alongside the NADH-preferring FabI: single knockouts
  of either gene are viable while the double knockout is not, so the two provide the same essential step.
  Unlike FabI, FabL is only reversibly inhibited by triclosan and does not form a stable ternary complex
  with the drug, so its presence confers triclosan resistance.
