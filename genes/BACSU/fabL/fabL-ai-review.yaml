  review:
    summary: >-
      Enoyl-ACP reductase activity with the wrong cofactor: FabL is NADPH-dependent, and the cited study
      reports NADPH, not NADH.
    action: MODIFY
    reason: >-
      The claim that FabL is an enoyl-ACP reductase is right and rests on direct assays, but the cofactor
      in this term is wrong. The cited paper assayed NADPH-dependent reduction, and UniProt's curated
      reaction for P71079 from the same paper (ECO:0000269) is written with NADP(+)/NADPH and EC 1.3.1.104;
      its NADH-preferring counterpart in B. subtilis is the separate FabI protein. The replacement is
      the NADPH sibling term, which the review already accepts on two other rows, so this is a cofactor
      correction rather than a refinement to a descendant.
    proposed_replacement_terms:
    - id: GO:0141148
      label: enoyl-[acyl-carrier-protein] reductase (NADPH) activity
    source_defects:
