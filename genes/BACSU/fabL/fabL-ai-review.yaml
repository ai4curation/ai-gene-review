- id: PMID:11007778
  title: The enoyl-[acyl-carrier-protein] reductases FabI and FabL from Bacillus subtilis.
  findings:
  - statement: >-
      Purified YgaA/FabL catalyses NADPH-dependent reduction of trans-2-enoyl thioesters of N-acetylcysteamine
      and of ACP, and was renamed FabL as a new enoyl-ACP reductase family.
    supporting_text: >-
      The purified YgaA protein catalyzed the NADPH-dependent reduction of trans-2-enoyl thioesters of
      both N-acetylcysteamine and ACP.
    reference_section_type: ABSTRACT
  - statement: >-
      FabL and FabI are functionally redundant for the essential enoyl reduction step in B. subtilis.
    supporting_text: >-
      Single knockouts of the ygaA or fabI gene in B. subtilis were viable, but double knockouts were
      not obtained.
    reference_section_type: ABSTRACT
  - statement: FabL confers triclosan resistance and is only reversibly inhibited by the drug.
    supporting_text: >-
      YgaA was reversibly inhibited by triclosan, but did not form the stable ternary complex characteristic
      of the FabI proteins.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary characterization of B. subtilis FabI and FabL (Heath, Su, Murphy and Rock,
      J Biol Chem 2000); the cached entry is abstract-only, and all quotes used here are from that abstract.
- id: PMID:21185310
  title: Crystal structures of Enoyl-ACP reductases I (FabI) and III (FabL) from B. subtilis.
  findings:
  - statement: >-
      B. subtilis FabL is a homotetramer whose ternary-complex structure shows the FabI-like Tyr-(Xaa)6-Lys
      dyad on an SDR scaffold.
    supporting_text: >-
      The positions of the catalytic dyad of Tyr-(Xaa)(6)-Lys in FabL are almost identical to that of
      FabI, but a detailed structural analysis shows that FabL shares more structural similarities with
      FabG and other members of the SDR (short-chain alcohol dehydrogenase/reductase) family.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified structural study of the B. subtilis FabI and FabL ternary complexes (J Mol Biol
      2011); cached abstract-only, quotes taken from the abstract.
