- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IDA
  original_reference_id: PMID:21185310
  qualifier: enables
  review:
    summary: >-
      NADP binding, demonstrated by the FabL ternary-complex crystal structure; a real but ancillary property
      of the reductase.
    action: KEEP_AS_NON_CORE
    reason: >-
      The crystal structures of B. subtilis FabL were solved as ternary complexes and show the cofactor-binding
      region, and the kinetics give a KM of 16 uM for NADPH, so NADP(H) binding is well supported. It
      is the cofactor half of the catalytic cycle rather than an independent function, so it is kept as
      non-core beside the enoyl-ACP reductase activity.
    supported_by:
    - reference_id: PMID:21185310
      supporting_text: >-
        The crystal structures of the ternary complexes of BsFaBI and BsFabL are found as a homotetramer
        showing the same overall structure despite a sequence identity of only 24%.
