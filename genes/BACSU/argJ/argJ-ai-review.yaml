id: P36843
gene_symbol: argJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: ArgJ is a cytoplasmic bifunctional acetyltransferase of Bacillus subtilis arginine biosynthesis.
  It recycles the acetyl group from N-acetylornithine to glutamate, releasing ornithine and regenerating
  N-acetylglutamate, and can initiate the pathway by acetylating glutamate with acetyl-CoA. The ArgJ precursor
  undergoes self-cleavage into alpha and beta chains that assemble as an alpha2beta2 enzyme.
