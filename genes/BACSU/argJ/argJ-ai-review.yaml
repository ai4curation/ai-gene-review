      record_section: ["CC:FUNCTION"]
      supporting_text: 'Catalyzes two activities which are involved in the cyclic version of arginine
        biosynthesis: the synthesis of N-acetylglutamate from glutamate and acetyl-CoA as the acetyl donor,
        and of ornithine by transacetylation between N(2)-acetylornithine and glutamate. {ECO:0000255|HAMAP-Rule:MF_01106}.'
