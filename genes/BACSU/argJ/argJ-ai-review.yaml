  review:
    summary: B.
    action: ACCEPT
    reason: B. subtilis ArgJ is the bifunctional form capable of initiating N-acetylglutamate synthesis
      with acetyl-CoA as well as recycling acetylornithine. Curated HAMAP MF_01106 and the organism-specific
      complementation synthesis in PMID:17347518 support this; PMID:8025667 alone is operon/homology evidence.
    supported_by:
