- id: PMID:10368162
  title: Biochemical and molecular characterization of the Bacillus subtilis acetoin catabolic
    pathway.
  findings:
  - statement: Native strain168 acoA disruption eliminates detectable E1 activity and acetoin-supported
      stationary-cell growth; E2/E3 roles additionally use comparative sequence evidence.
    supporting_text: 'These experiments clearly demonstrated that an aco -encoded

      AoDH ES is present in B. subtilis and that it is the major

      enzyme system responsible for the catabolism of acetoin.'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected.
- id: PMID:1898934
  title: Purification and characterization of acetoin:2,6-dichlorophenolindophenol oxidoreductase,
    dihydrolipoamide dehydrogenase, and dihydrolipoamide acetyltransferase of the Pelobacter
    carbinolicus acetoin dehydrogenase enzyme system.
  findings:
  - statement: Purified native E1, E2 and E3 reconstitute acetoin-dependent CoA-linked NAD reduction;
      artificial DCPIP assays are a separate measurement.
    supporting_text: 'The combination of purified Ao:DCPIP OR, DHLTA, and

      DHLDH in the presence of thiamine pyrophosphate and the substrate acetoin or

      methylacetoin resulted in a coenzyme A-dependent reduction of NAD.'
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract inspected; normal forced retrieval and full-text provider chain did
      not recover the scanned full article. Only explicit abstract results are used. Comparative
      Pelobacter biochemistry is not represented as a direct target-species assay. E1 lipoyl-transfer
      interpretation is also explained in the independent 2010 review.
