    summary: Pyruvate-specific assignment overextends the characterized acetoin-system role.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0004739 specifically oxidatively decarboxylates pyruvate with release of CO2;
      acetoin cleavage releases acetaldehyde instead. The native acoA disruption abolishes acetoin
      utilization and E1 activity, and the acoABCL locus identifies a distinct acetoin system.
