id: O31404
gene_symbol: acoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: AcoA is the alpha subunit of the thiamine-diphosphate-dependent acetoin-cleaving
  E1 enzyme in Bacillus subtilis strain 168. Together with the complementary E1 subunit it contributes
  to acetoin cleavage, releasing acetaldehyde and supplying an acetyl equivalent to the lipoyl-bearing
  E2 acetyltransferase. Disruption of acoA abolishes detectable E1 activity and acetoin-supported
  growth of stationary cells. The acoABCL locus and conserved component architecture support
  the lipoyl-linked pathway; purified Bacillus subunit reconstitution has not been established
  by these experiments.
