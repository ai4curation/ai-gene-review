taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: FadB (YsiB) is an enoyl-CoA hydratase in the FadR-regulated fatty-acid degradation system
  of Bacillus subtilis 168. Recombinant FadB hydrates crotonyl-CoA. Its modest palmitate-growth phenotype
  is compatible with other hydratase activities, including the hydratase-like domain in FadN; it is not
  the multifunctional enterobacterial FadB architecture.
