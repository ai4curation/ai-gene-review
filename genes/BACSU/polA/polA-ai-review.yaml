knowledge_gaps:
- gap_statement: Which DNA polymerase performs most native gap filling after Okazaki primer removal, and
    how does this change when PolA is absent?
  gap_kind:
  - BIOLOGY
  boundary: PolA synthesis and RnhC-supported repair are directly reconstituted in vitro. The 2023 study
    proposes PolA resynthesis, whereas the 2026 comparative review calls the native assignment unresolved
    and proposes PolC. Neither proposal establishes exclusive native flux.
  provenance:
  - reference_id: PMID:30670546
  - reference_id: PMID:37146086
  - reference_id: PMID:42133467
suggested_questions:
- question: How are the FenA-dominant and RnhC/PolA-assisted routes partitioned in vivo across temperature,
    growth state and replication stress?
