gene_symbol: polA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: PolA is Bacillus subtilis DNA polymerase I, combining template-directed DNA synthesis with
  N-terminal 5-prime nuclease activities. It contributes to DNA repair and Okazaki fragment maturation
  through polymerization and partially overlapping primer-removal activity with FenA and RnhC. Unlike
  Escherichia coli Pol I, the Bacillus enzyme lacks active 3-prime-to-5-prime proofreading. Its ability
  to synthesize DNA during reconstituted Okazaki repair is established, while the polymerase responsible
  for most native gap filling after primer removal remains unresolved.
