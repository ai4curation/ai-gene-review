gene_symbol: glnA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: 'GlnA is the cytoplasmic type I-alpha glutamine synthetase of Bacillus subtilis 168. It uses
  ATP and magnesium to incorporate ammonium into L-glutamate, supplying L-glutamine and the first reaction
  of the GS–GOGAT assimilation cycle. Glutamine feedback inhibition couples nitrogen sufficiency to transcription:
  GlnA binds and inhibits TnrA DNA binding, whereas its interaction with GlnR activates the repressor
  by stabilizing DNA-binding-competent GlnR. The apo enzyme is dodecameric, while GlnR- or TnrA-associated
  tetradecamers have been observed in structural experiments.'
