- id: PMID:11719184
  title: Bacillus subtilis glutamine synthetase controls gene expression through a protein-protein interaction
    with transcription factor TnrA.
  findings:
  - statement: Feedback-inhibited GS directly blocks TnrA DNA binding.
    supporting_text: 'form of glutamine synthetase directly interacts with TnrA and blocks the DNA

      binding activity of TnrA.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract explicitly describes direct interaction and mutant DNA-binding assays;
      later native full texts independently corroborate the mechanism.
- id: PMID:12139611
  title: Mutations in Bacillus subtilis glutamine synthetase that block its interaction with transcription
    factor TnrA.
  findings:
  - statement: Native GS mutagenesis separates catalytic and regulatory properties.
    supporting_text: 'Two of

      the mutant proteins exhibited enzymatic properties similar to those of wild-type

      glutamine synthetase.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; accessible full-text recovery was attempted. The actual quoted
      experiment, not a title-based inference, supports this finding.
- id: PMID:17001076
  title: Interaction of the membrane-bound GlnK-AmtB complex with the master regulator of nitrogen metabolism
    TnrA in Bacillus subtilis.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract read; publisher403 prevents full assay verification. Curated UniProt experimentally
      attributes GlnA cytoplasm to this paper. No wrong-gene accusation follows from the abstract focusing
      on GlnK/TnrA.
- id: PMID:18195355
  title: Bacillus subtilis glutamine synthetase regulates its own synthesis by acting as a chaperone to
    stabilize GlnR-DNA complexes.
  findings:
  - statement: Feedback-inhibited GS stabilizes GlnR–DNA complexes.
    supporting_text: Because FBI-GS significantly reduced the dissociation rate of the GlnR–DNA complexes,
      the stability of these complexes is enhanced by FBI-GS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Weak/transient regulator interaction enhances DNA-complex stability;
      this is specific regulator activation, not general protein folding.
- id: PMID:18331450
  title: Bacillus subtilis GlnR contains an autoinhibitory C-terminal domain required for the interaction
    with glutamine synthetase.
  findings:
  - statement: Native GS activates GlnR by direct transient interaction.
    supporting_text: 'The DNA-binding activity of GlnR is

      activated by a transient protein-protein interaction with feedback-inhibited

      glutamine synthetase that stabilizes GlnR-DNA complexes.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; accessible full-text recovery was attempted. The actual quoted
      experiment, not a title-based inference, supports this finding.
- id: PMID:21435182
  title: Interaction of the general transcription factor TnrA with the PII-like protein GlnK and glutamine
    synthetase in Bacillus subtilis.
  findings:
  - statement: TnrA binds GS in native regulatory complexes.
    supporting_text: 'Here, we show that TnrA forms either a stable soluble complex with GlnK in the

      absence of AmtB, or constitutively binds to GS in the absence of GlnK.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; accessible full-text recovery was attempted. The actual quoted
      experiment, not a title-based inference, supports this finding.
- id: PMID:23535029
  title: Transcription factor TnrA inhibits the biosynthetic activity of glutamine synthetase in Bacillus
    subtilis.
