  review:
    summary: NasC supplies the catalytic nitrate-reducing component of NasBC.
    action: MODIFY
    reason: The molybdenum-containing catalytic component performs the nitrate-to-nitrite step, with NasB
      supplying electron transfer. Nitrate reductase activity is the supported specific replacement for
      generic oxidoreductase activity; donor-specific kinetics were not established by the native methyl-viologen
      assay.
    supported_by:
    - reference_id: PMID:9765565
      supporting_text: Our previous results showed that nitrate reductase encoded by nasB and nasC located
        upstream of the nasD gene functions only in nitrate assimilation during aerobic growth (3, 17).
    - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC94119/
      supporting_text: 'In B. subtilis, the nasBC genes code for the NADH-nitrate reductase: NasB is a
        diaphorase with NADH- and FAD-binding domains, and NasC is the catalytic subunit.'
    proposed_replacement_terms:
    - id: GO:0008940
      label: nitrate reductase activity
