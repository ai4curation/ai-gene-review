- id: PMID:9765565
  title: Nitrogen and oxygen regulation of Bacillus subtilis nasDEF encoding NADH-dependent nitrite reductase
    by TnrA and ResDE.
  findings:
  - statement: NasBC is the assimilatory nitrate reductase rather than the respiratory nitrate reductase.
    supporting_text: Our previous results showed that nitrate reductase encoded by nasB and nasC located
      upstream of the nasD gene functions only in nitrate assimilation during aerobic growth (3, 17).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article read. Native JH642/168-lineage activity, subunit-deletion controls
      and cytosolic fractionation support NasDE. The abstract reverses the narGHI/nasBC anabolic/catabolic
      pairing; the body correctly distinguishes respiratory NarGHJI from assimilatory NasBC.
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC94119/
  title: 'Prokaryotic Nitrate Reduction: Molecular Properties and Functional Distinction among Bacterial
    Nitrate Reductases'
  findings:
  - statement: The mechanistic review assigns NasB the NADH/FAD diaphorase role and NasC the nitrate-reducing
      catalytic role.
    supporting_text: 'In B. subtilis, the nasBC genes code for the NADH-nitrate reductase: NasB is a diaphorase
      with NADH- and FAD-binding domains, and NasC is the catalytic subunit.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review; same paper as PMID:10542156. This URL is the fulltext manifestation retained
      for exact quote provenance. It supplies mechanistic synthesis, not an additional independent native
      experiment.
