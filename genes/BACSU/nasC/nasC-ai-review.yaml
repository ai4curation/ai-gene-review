id: P42434
gene_symbol: nasC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: NasC is the molybdenum-containing catalytic component of the Bacillus subtilis 168 assimilatory
  nitrate reductase NasBC. It uses a bis-molybdopterin guanine dinucleotide cofactor and an iron-sulfur
  center to reduce nitrate to nitrite, receiving reducing equivalents through NasB. The nitrite can then
  be reduced to ammonium by NasDE for nitrogen assimilation.
