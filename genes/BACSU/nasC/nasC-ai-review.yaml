  review:
    summary: NasC acts in nitrate assimilation, not nitrate-to-dinitrogen denitrification.
    action: MODIFY
    reason: GO:0019333 requires the denitrification pathway ending in dinitrogen. Native NasBC supplies
      nitrite for assimilatory reduction to ammonium. The UniPathway denitrification mapping confuses
      a shared nitrate-reduction reaction with its physiological pathway; nitrate assimilation is the
      supported process.
    supported_by:
