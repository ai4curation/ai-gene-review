suggested_questions:
- question: Does ThiO hand glycine imine directly to ThiG in a transient complex, or does the imine
    diffuse, given its rapid hydrolysis to glyoxylate in water?
suggested_experiments:
- hypothesis: ThiO and ThiG associate to channel glycine imine.
  description: Test ThiO-ThiG interaction by pull-down or SEC-MALS and compare thiazole phosphate
    yield in coupled ThiO/ThiG/ThiS assays with and without excess free glycine imine trap
    (e.g. cyanide or semicarbazide).
