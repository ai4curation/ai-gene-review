  review:
    summary: ThiO catalyses the glycine-oxidation step of thiazole synthesis.
    action: NEW
    reason: >-
      Participation: ThiO itself catalyses a step of thiazole formation, oxidising glycine to the
      glycine imine that ThiG incorporates as the thiazole C2-N3 unit; disruption gives thiazole
      auxotrophy. Comparator check: other enzymes performing steps of the thiazole branch carry
      the term, e.g. E. coli ThiF (GO:0052837 by IMP) and B. subtilis ThiI (by IBA), so this is a
      gap in coverage for ThiO rather than a convention against it. The term is not an ancestor or
      descendant of the thiamine process terms already carried.
