- term:
    id: GO:0006520
    label: amino acid metabolic process
  evidence_type: IDA
  original_reference_id: PMID:11744710
  qualifier: involved_in
  review:
    summary: In vitro characterization of the oxidative deamination of glycine, sarcosine and
      D-amino acids by purified ThiO.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper measures the substrate range of the purified enzyme, which is real, but that does
      not show a role for ThiO in amino acid metabolism in the cell. The only physiological role
      established for ThiO is supplying glycine imine for thiazole synthesis: disruption mutants
      need the thiazole and no other growth requirement or amino-acid catabolic phenotype is
      reported. D-amino acids and sarcosine are poor or non-physiological substrates (Km 46-81 mM
      for D-proline and D-alanine). Glycine consumption in thiamine synthesis is captured by the
      thiamine process terms. Same action as genes/PSEPK/thiO.
    supported_by:
    - reference_id: PMID:11744710
      supporting_text: GO can be distinguished from d-amino acid
        oxidase by its low catalytic efficiency and high apparent K(m) value for
        d-alanine.
    - reference_id: file:BACSU/thiO/thiO-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: 'DISRUPTION PHENOTYPE: Cells lacking this gene have an absolute
        requirement for the thiazole alcohol for growth.'
