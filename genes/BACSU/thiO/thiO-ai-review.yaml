id: O31616
gene_symbol: thiO
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  ThiO (formerly yjbR/goxB) is the FAD-dependent glycine oxidase (EC 1.4.3.19) of Bacillus subtilis,
  a homotetrameric flavoenzyme of the D-amino acid oxidase (DAO) fold, ThiO subfamily, with one
  non-covalently bound FAD per subunit. It oxidatively deaminates glycine to glycine imine
  (dehydroglycine) with reduction of O2 to hydrogen peroxide; the free imine hydrolyses to
  glyoxylate and ammonia. In B. subtilis and other aerobic bacteria this glycine imine supplies the
  C2-N3 unit that thiazole synthase ThiG condenses with 1-deoxy-D-xylulose 5-phosphate and the ThiS
  thiocarboxylate to form the thiazole moiety of thiamine, the role filled by the radical SAM enzyme
  ThiH in E. coli. thiO disruption mutants require the thiazole for growth. In vitro the enzyme also
  oxidises sarcosine, N-ethylglycine and, with low efficiency, D-alanine, D-proline and the herbicide
  glyphosate; it does not act on L-amino acids. ThiO is a soluble cytoplasmic protein.
