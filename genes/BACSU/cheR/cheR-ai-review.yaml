  label: Bacillus subtilis subsp. subtilis str. 168
description: CheR is the S-adenosylmethionine-dependent receptor methyltransferase of Bacillus
  subtilis chemotaxis. It methylates glutamate carboxyl groups on methyl-accepting chemotaxis
  receptors and participates in the receptor-modification arm of sensory adaptation. CheR mutants
  are impaired in adaptation to repellents. Bacillus receptor modification has site-dependent
  effects on kinase output, so receptor methylation cannot be assigned a uniform activating
  sign from the Escherichia coli model.
