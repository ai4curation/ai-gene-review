  review:
    summary: This subunit contributes to coupled NADPH-dependent glutamate synthesis.
    action: ACCEPT
    reason: Native B. subtilis GltAB biochemical assays and cryo-EM establish the two-subunit reaction.
      GltB carries NADPH-linked electron entry and the iron-sulfur relay; glutamine hydrolysis and glutamate-forming
      chemistry occur in GltA. The immutable original enables qualifier is retained as provenance; core_functions
      explicitly represents contribution to the complex activity. The modern structural study uses NCIB3610,
      and exact strain168 domain/sequence classification supports transfer of the conserved catalytic
      assignment.
    supported_by: &id001
