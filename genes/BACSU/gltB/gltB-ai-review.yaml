- id: PMID:34931064
  title: A counter-enzyme complex regulates glutamate metabolism in Bacillus subtilis.
  findings:
  - statement: Native GltAB structures localize the small- and large-chain redox cofactors.
    supporting_text: The higher resolution did permit unambiguous assignment of two 4Fe-4S clusters in
      GltB, and a 3Fe-4S clusters and FMN in GltA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Biochemistry and cryo-EM use NCIB3610, not strain168. GltAB is a heterodimer;
      GudB6–GltA6B6 is a regulated counter-enzyme assembly, not a constitutive GltAB oligomer. GltA inhibits
      active GudB in that strain, but168 GudB is cryptic, so no168 physiological inhibitory-function annotation
      is proposed.
- id: PMID:18326565
  title: 'Glutamate metabolism in Bacillus subtilis: gene expression and enzyme activities evolved to
    avoid futile cycles and to allow rapid responses to perturbations of the system.'
  findings:
  - statement: Native glutamate dehydrogenases cannot replace anabolic GOGAT under the studied conditions.
    supporting_text: 'Both RocG and GudB1 were unable to catalyze the anabolic reaction, most probably

      because of their very high K(m) values for ammonium.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Primary abstract read; normal PMC/publisher full-text recovery attempted. The physiological
      limitation is not chemical irreversibility: high-ammonium reverse assays and heterologous E. coli
      GDH differ from native anabolic capacity.'
