id: O34399
gene_symbol: gltB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GltB is the small electron-transfer subunit of the Bacillus subtilis NADPH-dependent glutamate
  synthase. Its FAD/NADPH module and two [4Fe–4S] clusters deliver reducing equivalents to the FMN-associated
  glutamate-forming center of the GltA large subunit. The coupled GltAB enzyme converts glutamine and
  2-oxoglutarate to glutamate and supports GS–GOGAT nitrogen assimilation; the small chain does not perform
  the complete reaction independently.
