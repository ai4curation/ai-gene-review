id: P05648
gene_symbol: dnaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaA is the ATP-binding initiator of chromosome replication in Bacillus subtilis. It recognizes
  double-stranded DnaA boxes and single-stranded DnaA-trio sequences at oriC, assembling an oligomer that
  opens and stabilizes the origin before recruitment of DnaD, DnaB and the DnaI–DnaC helicase-loading
  machinery. DnaA also regulates transcription and is controlled by proteins including Soj, YabA and SirA.
