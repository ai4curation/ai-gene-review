id: P28366
gene_symbol: secA
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SecA, the ATP-driven motor of the bacterial Sec translocase.
  Rank 1 is the exact core molecular function of this review, and ranks 3 to 5 are further exact GOA
  matches. Rank 2 is the interesting case: protein import is also an exact GOA match, arriving through
  InterPro2GO, but SecA exports proteins out of the cytoplasm - so the model is faithfully reproducing
  a directional error already present in the annotation record rather than making one of its own.
  Assessment: 2 correct not novel (CNN), 1 nonparalog incorrect (NPI).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/BACSU/secA/secA-uniprot.txt
- genes/BACSU/secA/secA-goa.tsv
