  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0008564
    label: protein-exporting ATPase activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 16.36), an exact GOA match (EC-derived) and this review's core molecular
      function. Correct and maximally specific: it names the ATP-coupled export motor activity (EC
      7.4.2.8) rather than generic ATPase or transport terms. Already annotated. GO-GPT returned no
      non-UNC call for this gene and BioReason-SFT reached only the translocation process, so ProTrek
      is the only one of the three to name the enzyme activity.
    supported_by:
    - reference_id: GO_REF:0000003
      supporting_text: >-
        Gene Ontology annotation based on Enzyme Commission mapping
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0017038
    label: protein import
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 15.96) and mechanically an exact GOA match - the term is present via InterPro2GO
      (GO_REF:0000002). It is nonetheless the wrong direction: SecA drives post-translational translocation
      of preproteins out of the cytoplasm across the SecYEG channel, and protein import denotes movement
      into a cell or organelle. Scored NPI rather than CNN because agreeing with an existing automatic
      annotation is not evidence of correctness; this is the second case in the ProTrek evaluation
      where a GOA-matching call is substantively wrong, and it is a caution against scoring predictions
      against GOA alone.
    supported_by:
    - reference_id: file:BACSU/secA/secA-uniprot.txt
      supporting_text: >-
        Protein translocase subunit SecA
