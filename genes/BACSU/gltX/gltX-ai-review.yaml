taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GltX is the non-discriminating glutamyl-tRNA synthetase of Bacillus subtilis. It uses ATP
  to charge tRNA(Glu) with glutamate and also glutamylates tRNA(Gln), supplying the intermediate that
  GatCAB converts to Gln-tRNA(Gln). The enzyme is a zinc-containing class I synthetase and supports both
  direct glutamylation and the first step of indirect glutaminylation.
