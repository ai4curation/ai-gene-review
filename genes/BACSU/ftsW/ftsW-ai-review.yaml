  - term:
      id: GO:0008360
      label: regulation of cell shape
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN000767103
      - UniProtKB:P0ABG4
      - UniProtKB:P0ABG7
    review:
      summary: Septal glycan synthesis contributes directly to cellular shape.
      action: ACCEPT
      reason: The FtsW synthase builds the septal envelope and thereby determines new cell-pole
        geometry. This inherited shape role is inferred from the Bacillus FtsW-containing synthesis
        complex, not an independent strain 168 morphometry assay or a PBP2B-only observation.
      supported_by:
        - reference_id: PMID:38480901
          supporting_text: We repeated these measurements with a strain expressing a HT fusion of
            the transglycosylase FtsW (HT–FtsW; Supplementary Table 1) that together with PBP2B
            forms the core of the synthesis complex.
        - reference_id: PMID:38480901
          supporting_text: HT–FtsW displayed similar fluorescence drops and jumps as HT–PBP2B
            (Extended Data Fig. 10), suggesting that the divisome synthesis complex is multimeric.
  - term:
      id: GO:0008955
      label: peptidoglycan glycosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - RHEA:23708
      - EC:2.4.99.28
    review:
      summary: FtsW catalyzes glycan polymerization rather than peptide crosslinking.
      action: ACCEPT
      reason: The reference sequence belongs specifically to the FtsW PANTHER subfamily, not merely
        the broad SEDS family. B. subtilis PY79 FtsW was directly tracked in the septal synthesis
        complex, while purified cognate-bPBP-dependent polymerization was measured on S.
        thermophilus and S. aureus orthologs. Together these support a conserved polymerase
        assignment to strain 168 O07639 by inference; they are not a purified O07639 assay.
      supported_by:
        - reference_id: file:BACSU/ftsW/ftsW-uniprot.txt
          supporting_text: DR   PANTHER; PTHR30474:SF2; PEPTIDOGLYCAN GLYCOSYLTRANSFERASE
            FTSW-RELATED; 1.
        - reference_id: PMID:38480901
          supporting_text: We repeated these measurements with a strain expressing a HT fusion of
            the transglycosylase FtsW (HT–FtsW; Supplementary Table 1) that together with PBP2B
            forms the core of the synthesis complex.
        - reference_id: PMID:30692671
          supporting_text: The observed polymerase activity was abolished when an invariant
            aspartate in or near the presumed FtsW active site was mutated to alanine, but not when
            the TP active site of the bPBP was inactivated (Fig. 1d, Supplementary Figs. 1, 3).
