  - id: PMID:38480901
    title: Peptidoglycan synthesis drives a single population of septal cell wall synthases during
      division in Bacillus subtilis.
    findings:
      - statement: PY79-derived HaloTag-FtsW participates in processive septal synthase motion. The
          study uses O07639 for modeling, but native experiments were not performed on an untagged
          strain168 protein.
    reference_review:
      review_notes: O07639, ftsW/ylaO/BSU14850, 403 residues, strain 168. PMID38480901 used
        PY79-derived HaloTag-FtsW strains (including bAB350), not an untagged 168 enzyme. Its
        modeling explicitly used O07639; this supports reference mapping, not complete identity of
        every engineered construct. Purified FtsW polymerase evidence from PMID30692671 concerns S.
        thermophilus and S. aureus orthologs, not O07639. The native contribution of strain 168 FtsW
        to lipid-II flipping is unresolved here. Polymerization does not logically exclude a
        secondary transport activity, and an E. coli proteoliposome result is not a direct O07639
        assay.
  - id: PMID:30692671
    title: FtsW is a peptidoglycan polymerase that is functional only in complex with its cognate
      penicillin-binding protein.
    findings:
      - statement: Purified S. thermophilus and NCTC8325-derived S. aureus FtsW polymerize lipid II
          with compatible class-B PBP partners. FtsW catalytic mutation abolishes activity, whereas
          PBP transpeptidase mutation does not. Direct construct and donor boundaries are recorded
          separately; Bacillus assignment is ortholog inference.
    reference_review:
      review_notes: O07639, ftsW/ylaO/BSU14850, 403 residues, strain 168. PMID38480901 used
        PY79-derived HaloTag-FtsW strains (including bAB350), not an untagged 168 enzyme. Its
