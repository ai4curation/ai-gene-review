id: O07639
gene_symbol: ftsW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: FtsW is the membrane-integrated SEDS peptidoglycan polymerase of the Bacillus subtilis
  divisome. It extends septal glycan chains in association with the class-B penicillin-binding
  protein PBP2B. Its catalytic role is distinct from peptide crosslinking by PBPs and from
  transbilayer delivery of lipid II. The strain 168 protein is the reference ortholog of FtsW
  studied by live-cell imaging in PY79-derived strains.
