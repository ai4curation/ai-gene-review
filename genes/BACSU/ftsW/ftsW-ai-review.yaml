    label: lipid-linked peptidoglycan transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000767103
  - UniProtKB:P0ABG4
  review:
    summary: A target-specific physiological lipid-II transport activity is unresolved.
    action: UNDECIDED
    reason: The inherited transport claim is distinct from directly supported glycan polymerization.
      PMID30692671 explicitly does not exclude FtsW flipping, while pointing to MurJ as the principal
      physiological flippase. An ortholog proteoliposome assay cannot establish this target's native
      transport contribution, and polymerase discovery does not by itself falsify it. The PAINT/TreeGrafter
      claim is not rejected on donor count; no IRD or IKR loss was found on this target lineage.
      No transport activity is included in the core.
