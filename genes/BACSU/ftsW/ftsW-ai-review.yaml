core_functions:
  - description: Polymerizes septal peptidoglycan glycan strands as the FtsW catalytic component
      associated with PBP2B. This strain 168 assignment combines the curated FtsW subfamily with
      PY79 live-cell synthase dynamics and purified ortholog biochemistry; the latter does not
      establish an independent purified O07639 assay. The current GO reaction uses a
      lysine-containing lipid-II template; native Bacillus mDAP-containing stem chemistry is a
      substrate-specificity caveat to that generic polymerase annotation.
    supported_by:
      - reference_id: file:BACSU/ftsW/ftsW-uniprot.txt
        supporting_text: DR   PANTHER; PTHR30474:SF2; PEPTIDOGLYCAN GLYCOSYLTRANSFERASE
          FTSW-RELATED; 1.
      - reference_id: PMID:38480901
        supporting_text: We repeated these measurements with a strain expressing a HT fusion of the
          transglycosylase FtsW (HT–FtsW; Supplementary Table 1) that together with PBP2B forms the
          core of the synthesis complex.
      - reference_id: PMID:30692671
        supporting_text: The observed polymerase activity was abolished when an invariant aspartate
          in or near the presumed FtsW active site was mutated to alanine, but not when the TP
          active site of the bPBP was inactivated (Fig. 1d, Supplementary Figs. 1, 3).
