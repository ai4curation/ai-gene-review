core_functions:
- description: Polymerizes septal peptidoglycan glycan strands as the FtsW catalytic component associated
    with PBP2B. This strain 168 assignment combines the curated FtsW subfamily with PY79 live-cell
    synthase dynamics and purified ortholog biochemistry; the latter does not establish an independent
    purified O07639 assay. The current GO reaction uses a lysine-containing lipid-II template; native
    Bacillus mDAP-containing stem chemistry is a substrate-specificity caveat to that generic polymerase
    annotation.
  supported_by:
  - reference_id: PMID:38480901
    supporting_text: a single population of processively moving PBP2B
  - reference_id: PMID:30692671
    supporting_text: when we added the cognate divisome bPBP to the FtsW reactions, peptidoglycan
      polymers were produced
