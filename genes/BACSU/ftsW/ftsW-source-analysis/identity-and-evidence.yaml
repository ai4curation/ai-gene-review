target: O07639
organism: BACSU
gene: ftsW
identity_and_construct_scope: O07639, ftsW/ylaO/BSU14850, 403 residues, strain 168.
  PMID38480901 used PY79-derived HaloTag-FtsW strains (including bAB350), not an untagged
  168 enzyme. Its modeling explicitly used O07639; this supports reference mapping,
  not complete identity of every engineered construct. Purified FtsW polymerase evidence
  from PMID30692671 concerns S. thermophilus and S. aureus orthologs, not O07639.
interpretation_limits: The native contribution of strain 168 FtsW to lipid-II flipping
  is unresolved here. Polymerization does not logically exclude a secondary transport
  activity, and an E. coli proteoliposome result is not a direct O07639 assay.
