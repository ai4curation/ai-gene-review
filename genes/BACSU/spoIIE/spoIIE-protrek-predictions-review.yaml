    id: GO:0043595
    label: endospore cortex
  predicted_term_type: GO_CC
  review:
    assessment: NPI
    confidence_score: 0
    error_type: LOCALIZATION_DEFAULT
    summary: >-
      Top-ranked hit (score 17.11). The endospore cortex is the thick peptidoglycan layer laid down
      between the forespore membranes late in sporulation. SpoIIE is an integral membrane phosphatase
      with ten transmembrane helices that localises to the polar septum at stage II, well before cortex
      synthesis, and GOA places it at the endospore-forming forespore by IDA. Wrong structure and
      wrong stage.
    supported_by:
