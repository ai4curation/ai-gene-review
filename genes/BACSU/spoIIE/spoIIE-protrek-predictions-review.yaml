id: P37475
gene_symbol: spoIIE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SpoIIE, the PP2C-family phosphatase that dephosphorylates
  SpoIIAA-P to activate sigma-F at the polar septum. The GO channel returns only spore structures
  and generic sporulation process terms; the phosphatase activity, manganese binding and asymmetric-division
  roles that make up all three of this review's core functions are absent from the top five. The free-text
  channel scores 22.07 and states the mechanism outright ('Activates SpoIIAA by dephosphorylation'),
  so the information is in the model and not in the GO index. Assessment: 1 correct not novel (CNN),
  1 less precise (LSP), 1 nonparalog incorrect (NPI).
