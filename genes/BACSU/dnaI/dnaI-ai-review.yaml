taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: DnaI is the AAA+ helicase-loading protein of Bacillus subtilis. Its N-terminal zinc-binding
  region interacts with the replicative helicase DnaC, while its C-terminal region binds nucleotide and
  contains a regulated DNA-binding site. DnaI supports helicase assembly on DNA, assisted by DnaB in the
  native loading pathway. It is distinct from the DnaA origin-recognition initiator.
