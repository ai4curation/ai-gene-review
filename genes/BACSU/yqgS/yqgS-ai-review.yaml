- term:
    id: GO:0070395
    label: lipoteichoic acid biosynthetic process
  evidence_type: IC
  original_reference_id: PMID:21255105
  qualifier: involved_in
  review:
    summary: >-
      YqgS is a bona-fide polyglycerolphosphate LTA synthase that catalyses the
      polymerisation step and acts redundantly with LtaS2 in LTA synthesis during
      sporulation. The GOA set for YqgS lacks the LTA biosynthetic process row
      that LtaS1 and LtaS2 carry; this NEW row completes the family.
    action: NEW
    reason: >-
      YqgS performs the work of the process (it polymerises polyglycerolphosphate
      LTA when highly expressed, and any one of LtaS2/LtaS1/YqgS is sufficient
      for LTA polymer production in B. subtilis). Its redundant role with LtaS2
      during sporulation is experimentally established. This is not propagating a
      substrate or necessity argument: the enzyme catalyses the step itself, and
      the two polymer-forming paralogues (LtaS1, LtaS2) already carry this term.
    supported_by:
    - reference_id: PMID:21255105
      supporting_text: Complementation studies using an S. aureus ltaS depletion strain
        revealed that YqgS can produce polyglycerolphosphate polymers, when expressed
        at sufficiently high levels, suggesting that this protein is also a bona-fide
        LTA synthase.
    - reference_id: PMID:19229300
      supporting_text: Two paralogues have a redundant role in LTA synthesis during
        sporulation and their absence gives a novel absolute block in sporulation.
