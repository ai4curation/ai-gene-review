gene_symbol: yqgS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  YqgS (locus BSU24840) is one of four LtaS-type lipoteichoic acid (LTA)
  synthases of Bacillus subtilis. It is a 638-residue polytopic membrane protein
  with five N-terminal transmembrane helices and a large extracytoplasmic
  catalytic domain of the alkaline phosphatase/sulfatase fold (LTA synthase
  family, PANTHER PTHR47371), carrying the conserved Mn2+-binding and
  active-site residues of the family. Like the other paralogues it hydrolyses
  phosphatidylglycerol in a Mn2+-dependent manner in vitro, and it is a
  bona-fide polyglycerolphosphate LTA synthase: expressed at high level it
  produces polyglycerolphosphate polymers and, in B. subtilis, any one of
  LtaS2, LtaS1 or YqgS is sufficient for LTA polymer production. YqgS and the
  major synthase LtaS2 act redundantly in LTA synthesis during sporulation, and
  their combined loss gives an absolute sporulation block. YqgS could not
  restore growth or LTA synthesis of an S. aureus ltaS depletion strain, which
  led to its being classed as "minor"/synthase-like. The full-length protein is
  predicted to be cleaved after an AXA motif and the catalytic domain secreted.
