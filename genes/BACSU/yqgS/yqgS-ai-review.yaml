- term:
    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN005342890
  - UniProtKB:P39401
  review:
    summary: >-
      Phylogenetic propagation of membrane location across the LTA synthase /
      OpgB family (PANTHER PTHR47371).
    action: MODIFY
    reason: >-
      The claim is correct but general. Gram type does not explain the
      granularity: GO:0005886 plasma membrane is "the membrane surrounding a
      cell that separates the cell from its external environment", which is the
      cytoplasmic (inner) membrane in diderms and monoderms alike, so the
      OpgB-type donors sit in a plasma membrane too. The stop at GO:0016020
      reads as a conservative PAINT choice. For YqgS the specific compartment is
      supported directly - five transmembrane helices, with the substrate
      phosphatidylglycerol and the glycolipid anchor in that same membrane - and
      the gene already carries GO:0005886 from the UniProt mapping.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN005342890
        source_label: LTA synthase / OpgB family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Cross-subfamily transfer: the IBD donor E. coli MdoB/OpgB (P39401) is
          PTHR47371:SF3 PHOSPHOGLYCEROL TRANSFERASE I while YqgS is
          PTHR47371:SF1 LIPOTEICHOIC ACID SYNTHASE-LIKE YQGS
          (interpro/panther/PTHR47371/PTHR47371-entries.csv), so the assertion is
          inherited from a node above the subfamily split rather than from a
          close relative. That is appropriate for a location claim: polytopic
          membrane topology with a cleaved extracytoplasmic catalytic domain is
          shared across the whole family, and YqgS carries it. The stop at
          generic membrane is a conservative PAINT choice rather than a
          consequence of Gram type; the specific compartment here is the plasma
          membrane.
    supported_by:
    - reference_id: PMID:21255105
      supporting_text: All four proteins have the same predicted membrane topology
        and domain structure as S. aureus LtaS.
- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN005342890
  - UniProtKB:P39401
  - UniProtKB:P43975
  review:
    summary: >-
      Phylogenetic propagation of transferase activity across the LTA synthase /
      OpgB family. YqgS is a bona-fide LTA synthase when highly expressed.
    action: MODIFY
    reason: >-
      The activity is correct but very general. YqgS transfers the
      glycerolphosphate head group of phosphatidylglycerol onto the growing LTA
      chain (EC 2.7.8.-), a transfer of a substituted phosphate group, so
      GO:0016780 phosphotransferase activity, for other substituted phosphate
      groups is the most specific existing term. GO has no specific
      polyglycerolphosphate LTA synthase term. Mn2+-dependent PG hydrolysis was
      shown in vitro for all four orthologues, and YqgS produces polymer when
      expressed at sufficiently high levels.
    proposed_replacement_terms:
    - id: GO:0016780
      label: phosphotransferase activity, for other substituted phosphate groups
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN005342890
        source_label: LTA synthase / OpgB family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Cross-subfamily transfer: both IBD donors, E. coli MdoB/OpgB (P39401)
          and H. influenzae HI_0275 (P43975), are PTHR47371:SF3 PHOSPHOGLYCEROL
          TRANSFERASE I while YqgS is PTHR47371:SF1 LIPOTEICHOIC ACID
          SYNTHASE-LIKE YQGS (interpro/panther/PTHR47371/PTHR47371-entries.csv).
          The node is therefore above the subfamily split, which is exactly why
          it can only assert top-level transferase activity: the donors' own
          specific term, GO:0008960 phosphatidylglycerol-membrane-oligosaccharide
          glycerophosphotransferase activity, is the OpgB reaction on
          membrane-derived oligosaccharides and is not what YqgS does. The
          phosphoglycerol-transfer chemistry is shared, and YqgS has direct
          experimental evidence of its own, so the transfer holds at this
          granularity; the nearest term covering the LtaS reaction is the shared
          parent GO:0016780.
    supported_by:
    - reference_id: PMID:21255105
      supporting_text: Complementation studies using an S. aureus ltaS depletion strain
        revealed that YqgS can produce polyglycerolphosphate polymers, when expressed
        at sufficiently high levels, suggesting that this protein is also a bona-fide
        LTA synthase.
    - reference_id: PMID:21255105
      supporting_text: We show that all four orthologues are able to hydrolyse fluorescently
        labelled PG in a Mn2+-dependent manner.
- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IDA
  original_reference_id: PMID:21255105
  qualifier: enables
  review:
    summary: >-
      Mn2+ is the catalytic metal of the LtaS-type active site. The purified YqgS
      catalytic domain gives its highest phosphatidylglycerol-hydrolysing activity
      with MnCl2 and only weak activity with Mg2+ or Ca2+, and UniProt records
      four Mn(2+)-coordinating residues (Glu253, Thr295, Asp469, His470) in the
      sulfatase-fold active site, Thr295 also being the catalytic nucleophile.
    action: NEW
    reason: >-
      The protein itself binds the metal, so there is no participation question
      to answer: the metal is a cofactor of the reaction YqgS catalyses, not
      something another gene product supplies to it. Wörmann et al. tested Mg2+,
      Mn2+, Ca2+ and Zn2+ side by side on the purified enzymatic domains of all
      four B. subtilis LtaS-type proteins and found Mn2+ dependence in every
      case. The metal-binding residues are curated on the UniProt entry
      (ECO:0000250, from the S. aureus LtaS Mn(2+) cocrystal). GOA has no
      metal-binding row for any of the four paralogues, so this is added as NEW
      rather than refined from an existing annotation.
    supported_by:
    - reference_id: PMID:21255105
      supporting_text: As presented in Fig. 3A and Fig. S2, all four proteins showed
        the highest activity in the presence of MnCl2.
    - reference_id: PMID:21255105
      supporting_text: Addition of MgCl2 and CaCl2 in place of MnCl2 resulted only
        in weak enzyme activity and no activity above background was seen in the
        presence of ZnCl2.
    - reference_id: file:BACSU/yqgS/yqgS-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: |-
        BINDING         253
        FT                   /ligand="Mn(2+)"
        FT                   /ligand_id="ChEBI:CHEBI:29035"
        FT                   /evidence="ECO:0000250"
- term:
    id: GO:0070395
    label: lipoteichoic acid biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:21255105
  qualifier: involved_in
  review:
    summary: >-
      YqgS is a bona-fide polyglycerolphosphate LTA synthase that catalyses the
      polymerisation step and acts redundantly with LtaS2 in LTA synthesis during
      sporulation. The GOA set for YqgS lacks the LTA biosynthetic process row
      that LtaS1 and LtaS2 carry; this NEW row completes the family.
    action: NEW
    reason: >-
      YqgS performs the work of the process (it polymerises polyglycerolphosphate
      LTA when highly expressed, and any one of LtaS2/LtaS1/YqgS is sufficient
      for LTA polymer production in B. subtilis). Its redundant role with LtaS2
      during sporulation is experimentally established. This is not propagating a
      substrate or necessity argument: the enzyme catalyses the step itself, and
      the two polymer-forming paralogues (LtaS1, LtaS2) already carry this term.
      Schirner et al. additionally report a redundant sporulation role for two
      paralogues, identified in their full text as ltaS and yqgS; that abstract
      does not name the pair, so it is not quoted here and the polymer-production
      evidence carries the row on its own. The evidence is direct detection of
      the polyglycerolphosphate product made by YqgS expressed in an S. aureus
      ltaS depletion strain, so the row is IDA rather than IC: nothing is being
      inferred from another annotation.
    supported_by:
    - reference_id: PMID:21255105
      supporting_text: Complementation studies using an S. aureus ltaS depletion strain
        revealed that YqgS can produce polyglycerolphosphate polymers, when expressed
        at sufficiently high levels, suggesting that this protein is also a bona-fide
        LTA synthase.
