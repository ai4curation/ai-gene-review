  review:
    summary: >-
      Extracellular location of the processed catalytic domain, mapped by the
      UniProt subcellular-location vocabulary from the "Processed uncharacterized
      protein YqgS" chain (inferred by similarity to the characterised
      paralogues).
    action: KEEP_AS_NON_CORE
    reason: >-
      By analogy with LtaS2 and LtaS1, whose processed domains were directly
      sequenced in the culture medium, YqgS is predicted to be cleaved at an AXA
      motif and its domain secreted (ECO:0000250 in UniProt). This location is
      for the shed domain; the LTA-polymerising activity acts at the plasma
      membrane. Non-core and, for this entry, inferred rather than observed: the
      B. subtilis extracellular-proteome study that found the YfnI and YflE
      cleavage products (PMID:10658653) identified only those two of the four
      paralogues, and Wörmann et al. note that although YqgS and YvgJ carry an
      AXA motif it is not clear whether they are processed in B. subtilis. The
      non-detection is weak evidence either way at that study's sensitivity, so
      the row is kept rather than marked over-annotated, but it rests on
      similarity, not observation.
