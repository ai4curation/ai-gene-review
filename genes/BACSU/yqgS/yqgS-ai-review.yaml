core_functions:
- description: >-
    Polyglycerolphosphate lipoteichoic acid synthase. Using phosphatidylglycerol
    as the glycerolphosphate donor, it polymerises the polyglycerolphosphate LTA
    backbone at the outer face of the cytoplasmic membrane in a Mn2+-dependent
    manner. It is a minor synthase under vegetative conditions but acts
    redundantly with the major synthase LtaS2 in LTA synthesis during
    sporulation.
  molecular_function:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  directly_involved_in:
  - id: GO:0070395
    label: lipoteichoic acid biosynthetic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:21255105
    supporting_text: Complementation studies using an S. aureus ltaS depletion strain
      revealed that YqgS can produce polyglycerolphosphate polymers, when expressed
      at sufficiently high levels, suggesting that this protein is also a bona-fide
      LTA synthase.
  - reference_id: PMID:19229300
    supporting_text: Two paralogues have a redundant role in LTA synthesis during
      sporulation and their absence gives a novel absolute block in sporulation.
proposed_new_terms:
- proposed_name: polyglycerophosphate lipoteichoic acid synthase activity
  proposed_definition: >-
    Catalysis of the transfer of the sn-glycerol-1-phosphate head group of
    phosphatidylglycerol onto the terminal glycerophosphate of a growing
    polyglycerophosphate lipoteichoic acid chain (or, in the priming step, onto
    the glycolipid anchor), producing 1,2-diacyl-sn-glycerol and extending the
    polyglycerophosphate backbone by one unit.
  justification: >-
    GO has no molecular function term for the polyglycerolphosphate LTA synthase
    reaction (EC 2.7.8.-); the nearest term, GO:0016780, is a genus several
    levels too general for the four B. subtilis LtaS-type synthases.
  proposed_parent:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
suggested_questions:
- question: >-
    What restricts YqgS LTA synthesis to high expression levels or to
    sporulation, and does it have a distinct substrate preference or chain-length
    output compared with LtaS2 and LtaS1?
suggested_experiments:
- description: >-
    Compare LTA produced in B. subtilis strains expressing YqgS alone, under
    vegetative and sporulation conditions, with strains expressing LtaS2 or LtaS1
    alone, to define YqgS's contribution to LTA structure and its role during
    sporulation.
  experiment_type: comparative LTA analysis
