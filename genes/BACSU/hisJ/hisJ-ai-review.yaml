  review:
    summary: PAINT inference of the family-defining HolPase activity at PTN000471366; directly
      demonstrated for the purified B. subtilis enzyme.
    action: ACCEPT
    reason: >-
      hisJ is a PTHR21039:SF0 member inheriting from the HIS2-seeded node, with no PAINT loss on its
      lineage. The activity is confirmed on the gene itself: extracts of the ytvP mutant have no
      detectable HolPase activity and a purified GST-YtvP fusion has strong HolPase activity
      (PMID:10322033). This is the core molecular function.
    supported_by:
