id: O34411
gene_symbol: hisJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  hisJ (ytvP; UniProt name hisK) encodes the histidinol-phosphate phosphatase (HolPase, EC 3.1.3.15)
  of Bacillus subtilis, which hydrolyses L-histidinol phosphate to L-histidinol and phosphate, the
  penultimate (eighth) step of L-histidine biosynthesis. The 268-residue protein is a PHP-domain
  (polymerase and histidinol phosphatase) metallohydrolase of the HisK/HisJ subfamily, related to the
  HolPases of Saccharomyces cerevisiae (HIS2), Schizosaccharomyces pombe and Lactococcus lactis and
  not homologous to the HAD-type HolPase domain of enterobacterial HisB. A ytvP mutant is a histidine
  auxotroph whose extracts lack detectable HolPase activity, and the purified recombinant protein has
  strong HolPase activity.
