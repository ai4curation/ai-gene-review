  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000471366
  - SGD:S000001921
  review:
    summary: PAINT node PTN000471366 places L-histidine biosynthesis at the root of the PHP-type
      HolPase family; B. subtilis HisJ is inside that clade (PTHR21039:SF0) and has its own genetic
      evidence for the process.
    action: ACCEPT
    reason: >-
      The IBD at PTN000471366 is seeded by S. cerevisiae HIS2; hisJ is classified in the same
      subfamily (PTHR21039:SF0, HISTIDINOL-PHOSPHATASE) and no PAINT loss lies on its lineage. The
      inherited claim is independently confirmed for this gene: a ytvP mutant is a histidine auxotroph
      lacking HolPase activity, and the enzyme catalyses step 8 of the pathway (PMID:10322033).
    supported_by:
    - reference_id: PMID:10322033
      supporting_text: A B. subtilis ytvP mutant was auxotrophic for histidine.
    - reference_id: PMID:10322033
      supporting_text: These observations demonstrated that HolPase is encoded by ytvP in B. subtilis
        and led us to rename this gene hisJ.
