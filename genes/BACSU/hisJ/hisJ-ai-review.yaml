suggested_questions:
- question: Which metal ions occupy the PHP-domain active site of B. subtilis HisJ in vivo, and do they
    determine its selectivity for histidinol phosphate over other phosphomonoesters?
suggested_experiments:
- description: Determine steady-state kinetics and metal dependence of purified untagged HisJ against
    histidinol phosphate and other phosphomonoesters, and solve its structure with bound metals.
  experiment_type: enzyme kinetics and structural biology
