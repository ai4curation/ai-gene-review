  evidence_type: IDA
  original_reference_id: PMID:25355514
  qualifier: enables
  review:
    action: NEW
    summary: Propose the directly measured substrate-dependent lyase activity.
    reason: Catalyzes beta-lyase cleavage at abasic DNA sites, with substrate-position dependence. This
      measured substrate-dependent chemistry is not assigned a general native NHEJ or base-excision-repair
      role. This MF proposal records the chemical reaction measured with the purified target protein on
      defined substrates. It does not propose a general physiological BER process or transfer the chemistry
      to untested Ku/LigD homologs. The native breadth of this ancillary activity remains unresolved.
    supported_by:
    - reference_id: PMID:25355514
      supporting_text: 'B. subtilis Ku

        (BsuKu), along with its pivotal role in allowing joining of two broken ends by

        B. subtilis LigD (BsuLigD), is endowed with an AP/deoxyribose 5''-phosphate

        (5''-dRP)-lyase activity'
