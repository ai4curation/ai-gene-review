      and coordinated LigD repair are directly demonstrated with recombinant proteins; native spore genetics
      independently supports repair relevance. The exact target leaf is present below the cited PAINT
      IBD node in the official tree; a self-seed is valid experimental grounding, and the cached slice
      supplies no negative loss assertion. The dsDNA-probe mobility shift establishes duplex binding;
