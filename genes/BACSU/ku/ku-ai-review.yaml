taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: Ku is a homodimeric bacterial DNA-end-binding protein that organizes broken double-stranded
  DNA ends and promotes LigD-dependent repair. The Bacillus subtilis protein helps protect spore DNA and
  supports end synapsis and coordinated LigD repair. Recombinant Ku also catalyzes AP-site incision and
  removal of 5′-deoxyribose-phosphate groups; these activities do not by themselves establish a general
  cellular base-excision-repair role.
