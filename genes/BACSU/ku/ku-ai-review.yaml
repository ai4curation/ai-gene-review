- id: PMID:17293412
  title: Role of DNA repair by nonhomologous-end joining in Bacillus subtilis spore resistance to extreme
    dryness, mono- and polychromatic UV, and ionizing radiation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The identifier and abstract support sensitization of ykoU/ykoV mutant spores to specified
      treatments. The accessible cache is abstract-only and does not establish the strain-168 derivation
      or full experimental design; those details are not asserted from this reference. VERIFIED applies
      only to the cited abstract-level phenotype, not unseen full text.
  full_text_unavailable: true
  findings:
  - statement: 'The product performs end-joining work: Ku binds and organizes broken ends and LigD extends/processes/seals
      compatible substrates. The canonical biochemical route does not imply that every chromosomal break
      is repaired by Ku/LigD or that alternative LigD-independent routes are absent.'
    supporting_text: 'NHEJ-defective spores with mutations in ykoU, ykoV, and ykoU ykoV were

      significantly more sensitive to UV, ionizing radiation, and ultrahigh vacuum'
- id: PMID:25355514
  title: Efficient processing of abasic sites by bacterial nonhomologous end-joining Ku proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary biochemistry demonstrates Bacillus Ku AP/5′-dRP lyase and P. aeruginosa
      Ku AP lyase. PAO1 genomic cloning is explicit. Substrate specificity and covalent-intermediate controls
      support catalysis. Proposed participation in cellular BER remains a hypothesis, not a new process
      annotation.
  full_text_unavailable: false
  findings:
  - statement: Removes terminal 5′-deoxyribose-phosphate groups from preincised substrates, permitting
      subsequent end sealing; native BER participation remains unresolved.
    supporting_text: 'B. subtilis Ku

      (BsuKu), along with its pivotal role in allowing joining of two broken ends by

      B. subtilis LigD (BsuLigD), is endowed with an AP/deoxyribose 5''-phosphate

      (5''-dRP)-lyase activity'
- id: PMID:41957403
  title: Insights into the functional coordination of LigD and Ku in bacterial nonhomologous end joining.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full primary text: recombinant B. subtilis LigD/Ku coordinates AP incision, ribonucleotide
      insertion and joining. KuBs corresponds to strain168 NP_389224.1 beginning at annotated position18;
      proteins/truncations/chimeras were expressed in E. coli. No native exact occupancy or universal
      cross-species interaction is inferred. The primary places LigDom N-terminal and PolDom C-terminal,
      contrary to reversed UniProt similarity-section prose.'
  full_text_unavailable: false
  findings:
  - statement: Binds broken duplex DNA ends, supports synapsis and promotes LigD-mediated end joining;
      Ku does not catalyze ATP-dependent strand ligation.
    supporting_text: 'LigDBs

      catalyzes these steps without dissociating from DNA, being this processive

      catalysis dependent on KuBs-mediated synapsis'
