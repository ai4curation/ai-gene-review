suggested_questions:
- question: >-
    A B. subtilis pssA null mutant lacks phosphatidylethanolamine yet its
    cells appear normal (PMID:27362352 lists the deletion among the strains
    examined); how does B. subtilis maintain phosphatidylethanolamine-dependent
    membrane functions without PssA?
suggested_experiments:
- description: >-
    Quantify phosphatidylserine and phosphatidylethanolamine in a clean
    B. subtilis pssA deletion and purify the native enzyme to determine its
    metal dependence and kinetics directly.
