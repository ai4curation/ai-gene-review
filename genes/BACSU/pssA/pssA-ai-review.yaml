- term:
    id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  evidence_type: IC
  original_reference_id: PMID:8002567
  qualifier: involved_in
  review:
    summary: >-
      The enzyme makes phosphatidylserine, the precursor of
      phosphatidylethanolamine, and its overproduction raises PE to 93% of
      phospholipid.
    action: NEW
    reason: >-
      PssA catalyzes the first step of phosphatidylethanolamine synthesis
      (comparator: E. coli PssA and yeast CHO1 carry GO:0006646). In B.
      subtilis itself, a pssA null mutant lacks phosphatidylethanolamine, as
      does a null mutant of the downstream decarboxylase psd; the gene also
      complements an E. coli pss mutant.
    supported_by:
    - reference_id: PMID:15743965
      supporting_text: >-
        When the mutant cells of the strains SDB01 (psd1::neo) and SDB02
        (pssA10::spc), which both lack PE, were examined under the same
        conditions, no fluorescence was observed.
    - reference_id: PMID:8002567
      supporting_text: >-
        Overproduction of the B. subtilis synthase in E. coli cells by a lac
        promoter system resulted in an unusual increase of
        phosphatidylethanolamine (up to 93% of the total phospholipids)
    - reference_id: PMID:8002567
      supporting_text: >-
        The Bacillus subtilis pss gene encoding phosphatidylserine synthase was
        cloned by its complementation of the temperature sensitivity of an
        Escherichia coli pssA1 mutant.
