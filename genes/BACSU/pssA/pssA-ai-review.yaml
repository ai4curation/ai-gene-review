suggested_questions:
- question: >-
    UniProt records no phenotype for a B. subtilis pssA disruption beyond
    normal cell appearance; how does B. subtilis maintain
    phosphatidylethanolamine-dependent membrane functions without PssA?
suggested_experiments:
- description: >-
    Quantify phosphatidylserine and phosphatidylethanolamine in a clean
    B. subtilis pssA deletion and purify the native enzyme to determine its
    metal dependence and kinetics directly.
