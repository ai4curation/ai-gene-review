id: P39823
gene_symbol: pssA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  pssA (pss) encodes the phosphatidylserine synthase of Bacillus subtilis, a
  177-residue integral membrane CDP-alcohol phosphatidyltransferase (type-II
  phosphatidylserine synthase) with several transmembrane helices. It
  transfers the phosphatidyl group of CDP-diacylglycerol to L-serine,
  forming phosphatidylserine, in a manganese-dependent reaction. The enzyme is
  unrelated in sequence to the peripheral-membrane, PLD-superfamily
  phosphatidylserine synthase of E. coli but complements an E. coli pssA
  mutant, and phosphatidylserine it makes is decarboxylated to
  phosphatidylethanolamine.
