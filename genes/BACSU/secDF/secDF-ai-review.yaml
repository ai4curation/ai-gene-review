suggested_questions:
- question: Does B. subtilis SecDF conduct protons (or another cation) in the same way as the
    T. thermophilus single-chain SecDF, and is its activity limited at low temperature, explaining the
    cold-sensitive secretion defect of secDF mutants?
- question: Which native B. subtilis secretory proteins depend most strongly on SecDF for efficient
    translocation, and does this dependence differ between exponential growth and the post-exponential
    phase when secDF expression peaks?
suggested_experiments:
- description: Measure SecDF-dependent proton conduction for purified B. subtilis SecDF in
    proteoliposomes or patch-clamped spheroplasts, including variants of the conserved transmembrane
    Asp and Arg residues, at permissive and low temperatures.
  hypothesis: B. subtilis SecDF is a proton-conducting PMF-coupled translocation motor, and reduced
    proton-coupled turnover at low temperature underlies the cold sensitivity of secDF mutants.
  experiment_type: electrophysiology and proteoliposome proton flux assay
- description: Compare the secretome and precursor accumulation of wild-type and secDF-deleted strains
    by quantitative proteomics and pulse-chase at 37 C and 15 C, with and without overproduction of a
    heterologous secretory protein.
  hypothesis: SecDF dependence is substrate-specific and becomes limiting under high secretion load.
  experiment_type: quantitative secretome proteomics and pulse-chase
