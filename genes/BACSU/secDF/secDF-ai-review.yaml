  review:
    summary: SecDF acts during translocation through SecYEG, after precursor proteins have been
      targeted to the translocon; it is not a targeting factor.
    action: MARK_AS_OVER_ANNOTATED
    reason: Protein targeting in bacteria is carried out by SRP/FtsY, SecA and chaperones that deliver
      preproteins to SecYEG. SecDF acts at a later stage - B. subtilis SecDF is needed for efficient
      translocation, and the homologous T. thermophilus/E. coli SecDF drives the PMF-dependent
      completion of translocation after SecA-dependent initiation. The UniRule-transferred targeting
      term therefore over-states SecDF's role. It cannot be refined by MODIFY to GO:0043952 protein
      transport by the Sec complex because that term is not a descendant of protein targeting; the Sec
      transport role is captured by the accepted GO:0043952 row instead.
    supported_by:
    - reference_id: PMID:21562494
      supporting_text: we have shown that SecDF is a component of the Sec machinery that utilizes the
        PMF to complete protein translocation after the ATP-dependent SecA function
    - reference_id: PMID:9694879
      supporting_text: SecDF is involved in earlier translocation steps
