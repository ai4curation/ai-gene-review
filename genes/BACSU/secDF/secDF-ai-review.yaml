- term:
    id: GO:0009977
    label: proton motive force dependent protein transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:21562494
  qualifier: contributes_to
  review:
    summary: SecDF contributes the proton-motive-force-coupled motor activity of the Sec translocase.
    action: NEW
    reason: No existing row describes SecDF's molecular function correctly (the only MF row, an ATPase,
      is removed). The single-chain SecDF of T. thermophilus, which shares the fused SecD-SecF
      architecture and 12-TM RND fold of B. subtilis SecDF, conducts protons and uses the PMF to drive
      ATP-independent protein translocation; the conserved transmembrane Asp/Arg residues required for
      proton conduction are a family feature. B. subtilis SecDF is required for efficient translocation
      in vivo. The contributes_to qualifier is used, as for E. coli SecD and SecF, because the
      polypeptide channel is SecYEG and SecDF supplies the PMF-coupled driving step rather than
      transporting proteins on its own. Proton conduction has not been measured for the B. subtilis
      protein itself, hence ISS.
    supported_by:
    - reference_id: PMID:21562494
      supporting_text: Electrophysiological analyses revealed that SecDF conducts protons in a manner
        dependent on pH and the presence of an unfolded protein, with conserved Asp and Arg residues at
        the transmembrane interface between SecD and SecF playing essential roles in the movements of
        protons and preproteins.
    - reference_id: PMID:21562494
      supporting_text: SecDF from Thermus thermophilus HB817 is composed of a single polypeptide chain
    - reference_id: PMID:9694879
      supporting_text: Thus, SecDF does not only show sequence similarity but also structural similarity
        to secondary solute transporters.
    - reference_id: PMID:29718185
      supporting_text: SecDF is a protein-translocation factor, which is different from the ATP-driven
        SecA motor
