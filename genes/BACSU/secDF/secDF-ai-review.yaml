- term:
    id: GO:0015450
    label: protein-transporting ATPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005665
  - InterPro:IPR005791
  review:
    summary: SecDF is not an ATPase; it couples the proton motive force, not ATP hydrolysis, to protein
      translocation.
    action: REMOVE
    reason: The InterPro2GO mapping from the SecD/SecF signatures to an ATPase activity is mechanistically
      wrong. SecDF has no nucleotide-binding domain; it is an RND-fold, proton-conducting membrane
      protein, and the step it drives is ATP-independent. ATP-driven translocation in the Sec system is
      performed by SecA (annotated separately in B. subtilis). The correct activity, a contribution to
      proton-motive-force-dependent protein transmembrane transporter activity, is added as a NEW row
      (GO:0009977 is not a descendant of GO:0015450, so this is recorded as removal plus a new
      annotation rather than a MODIFY).
