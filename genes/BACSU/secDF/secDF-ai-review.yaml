gene_symbol: secDF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: SecDF of Bacillus subtilis is a single 737-residue polytopic membrane protein in which
  the SecD and SecF modules, separate subunits in Escherichia coli, are fused into one chain with 12
  transmembrane segments and two large extracytoplasmic domains. It is an accessory component of the
  Sec protein translocase in the cytoplasmic membrane. By homology with the structurally and
  functionally characterized single-chain SecDF of Thermus thermophilus, it conducts protons and uses
  the proton motive force to drive the late, ATP-independent stage of preprotein translocation through
  SecYEG that follows the ATP-dependent action of SecA. Cells lacking SecDF are viable but have a
  reduced capacity for protein secretion, a cold-sensitive phenotype that worsens with hypersecretion,
  and filamentous morphology.
