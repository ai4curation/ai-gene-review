core_functions:
- description: SecDF contributes proton-motive-force-coupled driving force to the late, ATP-independent
    stage of Sec-dependent preprotein translocation across the B. subtilis cytoplasmic membrane, acting
    as an accessory component of the SecA-SecYEG translocase that maintains high-capacity secretion.
  supported_by:
  - reference_id: PMID:9694879
    supporting_text: the SecD and SecF equivalents of the Gram-positive bacterium Bacillus subtilis are
      jointly present in one polypeptide, denoted SecDF, that is required to maintain a high capacity
      for protein secretion
  - reference_id: PMID:21562494
    supporting_text: we have shown that SecDF is a component of the Sec machinery that utilizes the PMF
      to complete protein translocation after the ATP-dependent SecA function
