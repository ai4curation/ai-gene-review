  label: Bacillus subtilis subsp. subtilis str. 168
description: GbsB is a soluble type III alcohol-dehydrogenase-family enzyme assigned to oxidation
  of choline to betaine aldehyde in Bacillus subtilis. Together with the aldehyde dehydrogenase GbsA
  it produces the osmoprotectant glycine betaine. GbsB belongs to a different protein family from
  membrane-associated flavin-dependent BetA enzymes. NAD-linked catalysis is inferred from its family
  and curated reaction assignment, while purified-enzyme cofactor preference and metal requirements
  remain unresolved. Two translation starts were observed during heterologous expression.
