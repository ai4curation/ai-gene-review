  review:
    action: NEW
    summary: GbsB performs the first oxidation in choline-derived betaine synthesis.
    reason: 'The JBB4 gbsB deletion retains intact gbsA: it takes up choline but cannot convert radiolabeled
      choline to glycine betaine, while supplied betaine aldehyde still supports osmoprotection. This
      differential precursor phenotype, the dehydrogenase architecture and heterologous pathway complementation
      assign GbsB the first choline-oxidation step rather than only an unspecified requirement. Purified
      GbsA establishes the separate downstream reaction, not GbsB catalysis. Same-role choline-dehydrogenase
      comparator BetA and the biosynthetic-process parents support catalytic participation; no redundant
      ancestor process is added.'
    supported_by:
    - reference_id: file:BACSU/gbsB/gbsB-source-analysis/round1-primary-excerpts.txt
      supporting_text: "Mutations\nin the gbsAB and gbsB genes confer different growth pheno-\ntypes in
