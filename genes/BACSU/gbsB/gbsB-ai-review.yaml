  label: Bacillus subtilis subsp. subtilis str. 168
description: GbsB is a soluble type III alcohol-dehydrogenase-family enzyme that oxidizes choline to
  betaine aldehyde in Bacillus subtilis. Together with the aldehyde dehydrogenase GbsA, it produces
  the osmoprotectant glycine betaine. GbsB belongs to a different protein family from
  membrane-associated flavin-dependent BetA enzymes. Two translation starts produce long and short
  forms during heterologous expression.
