- id: PMID:8752328
  title: 'Synthesis of the osmoprotectant glycine betaine in Bacillus subtilis: characterization
    of the gbsAB genes.'
  findings:
  - statement: Full author-hosted article inspected. Native experiments use JH642 derivatives and
      heterologous complementation uses E. coli. U47861 GbsA matches frozen P71016 exactly; its deposited
      GbsB protein is the short alternative start, while translation from the experimentally observed
      upstream start matches the complete P71017 sequence. The paper supports pathway roles and typeIII
      family assignment, not purified GbsB NAD preference or metal-specific kinetics.
    supporting_text: 'The deduced gbsB gene product shows significant similarity to the

      family of type III alcohol dehydrogenases.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted article inspected. Native experiments use JH642 derivatives
      and heterologous complementation uses E. coli. U47861 GbsA matches frozen P71016 exactly; its
      deposited GbsB protein is the short alternative start, while translation from the experimentally
      observed upstream start matches the complete P71017 sequence. The paper supports pathway roles
      and typeIII family assignment, not purified GbsB NAD preference or metal-specific kinetics.
- id: PMID:9297465
  title: 'Glycine betaine aldehyde dehydrogenase from Bacillus subtilis: characterization of an enzyme
    required for the synthesis of the osmoprotectant glycine betaine.'
  findings:
  - statement: Full author-hosted article inspected. Recombinant GbsA was purified from E. coli using
      pJB009, the JH642-derived clone established in8752328. NAD+ is strongly preferred over NADP+.
      The negative substrate list is propionaldehyde, pivalaldehyde, isovaleraldehyde, acetaldehyde
      and benzaldehyde; it does not test the three aminoaldehydes in the additional PAINT rows. Salt
      stimulation does not itself establish a metal-binding site.
    supporting_text: 'The enzyme was specific for

      glycine betaine aldehyde and could use both NAD+ and NADP+ as cofactors, but

      NAD+ was strongly preferred.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted article inspected. Recombinant GbsA was purified from E. coli
      using pJB009, the JH642-derived clone established in8752328. NAD+ is strongly preferred over
      NADP+. The negative substrate list is propionaldehyde, pivalaldehyde, isovaleraldehyde, acetaldehyde
      and benzaldehyde; it does not test the three aminoaldehydes in the additional PAINT rows. Salt
      stimulation does not itself establish a metal-binding site.
