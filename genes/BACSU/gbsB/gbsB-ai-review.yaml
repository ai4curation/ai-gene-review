  review:
    action: UNDECIDED
    summary: GbsB metal requirement remains uncharacterized.
    reason: The primary sequence comparison found that GbsB lacks one of three histidines implicated
      in metal binding in related type III alcohol dehydrogenases and explicitly left its metal
      cofactor unresolved. This supports uncertainty about the target metal requirement; neither
      family membership nor that substitution alone establishes a particular metal or absence of
      metal binding.
    supported_by:
