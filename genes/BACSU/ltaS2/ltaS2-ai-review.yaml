    summary: >-
      Extracellular location of the processed catalytic domain, mapped from the
      UniProt subcellular location of the "Processed glycerol phosphate
      lipoteichoic acid synthase 2" chain.
    action: KEEP_AS_NON_CORE
    reason: >-
      Extracellular-proteome N-terminal sequencing found YflE cleaved after its
      Ala-Leu-Ala motif, and its product appeared to be released into the
      culture medium. The location is real for the shed catalytic domain.
      However, LTA polymerisation uses phosphatidylglycerol in the outer leaflet
      and acts on the membrane-anchored glycolipid, so the activity is located
      at the plasma membrane. Whether the released domain retains a physiological
      role is not known. The row is kept as non-core.
