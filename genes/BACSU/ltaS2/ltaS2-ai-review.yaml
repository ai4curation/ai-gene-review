- term:
    id: GO:0016740
    label: transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN005342890
  - UniProtKB:P39401
  - UniProtKB:P43975
  review:
    summary: >-
      Phylogenetic propagation of transferase activity across the LTA synthase /
      OpgB family.
    action: MODIFY
    reason: >-
      The activity is correct but very general. LtaS transfers the
      sn-glycerol-1-phosphate head group of phosphatidylglycerol onto the
      growing LTA chain, releasing diacylglycerol. This is a transfer of a
      substituted phosphate group (EC 2.7.8.-, as UniProt records), so
      GO:0016780 phosphotransferase activity, for other substituted phosphate
      groups is the most specific existing term. GO has no specific
      polyglycerolphosphate LTA synthase activity term. Mn2+-dependent hydrolysis
      of phosphatidylglycerol was shown in vitro for all four B. subtilis LtaS
      orthologues, and yflE restores polyglycerolphosphate LTA in an S. aureus
      ltaS depletion strain.
    proposed_replacement_terms:
    - id: GO:0016780
      label: phosphotransferase activity, for other substituted phosphate groups
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN005342890
        source_label: LTA synthase / OpgB family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node groups several distinct phosphoglycerol transferases, so the
          inherited activity stops at the top-level transferase activity. The
          activity claim is sound; the specific reaction is a phosphate-group
          transfer (EC 2.7.8.-), captured by GO:0016780.
    supported_by:
