gene_symbol: ltaS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  LtaS2 (UniProt name; locus yflE, BSU07710; called LtaS or LtaS(BS) in the
  primary literature) is the major, housekeeping polyglycerolphosphate
  lipoteichoic acid (LTA) synthase of Bacillus subtilis. It is a 649-residue
  polytopic membrane protein with five N-terminal transmembrane helices and a
  large extracytoplasmic catalytic domain of the alkaline phosphatase/sulfatase
  fold (LTA synthase family, PANTHER PTHR47371). The enzyme uses the head group
  of the membrane lipid phosphatidylglycerol as the glycerolphosphate donor,
  releasing diacylglycerol, and polymerises 1,3-linked polyglycerolphosphate
  chains on the diglucosyl-diacylglycerol glycolipid anchor. Activity is
  Mn2+-dependent and proceeds through an active-site threonine nucleophile, as
  shown for its S. aureus orthologue. The catalytic domain (residues 216-649)
  is cleaved off after an AXA motif and released into the culture medium; its
  crystal structure has been solved (PDB 2W8D). Expressed in an S. aureus ltaS
  depletion strain, yflE restores both LTA synthesis and growth. In B. subtilis,
  loss of LtaS causes slower growth, defects in divalent cation homeostasis,
  aberrant septation and cell bending, and LtaS acts redundantly with YqgS in
  LTA synthesis during sporulation. It is one of four LtaS-type paralogues in
  B. subtilis, with LtaS1 (YfnI), YqgS and the LTA primase YvgJ.
