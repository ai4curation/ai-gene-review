      For LtaS2 the specific compartment is supported directly - five
      transmembrane helices, and the substrate phosphatidylglycerol and the
      glycolipid anchor are both in that membrane - and the gene already carries
      GO:0005886 from the UniProt mapping. The term is refined to GO:0005886
      plasma membrane.
