core_functions:
- description: >-
    Major polyglycerolphosphate lipoteichoic acid synthase. Using the membrane
    lipid phosphatidylglycerol as the glycerolphosphate donor, it polymerises
    the 1,3-linked polyglycerolphosphate backbone of LTA on the
    diglucosyl-diacylglycerol glycolipid anchor at the outer face of the
    cytoplasmic membrane. Activity is Mn2+-dependent. It is the housekeeping LTA
    synthase whose loss causes the main morphological and division defects, and
    it acts redundantly with YqgS during sporulation.
  molecular_function:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  directly_involved_in:
  - id: GO:0070395
    label: lipoteichoic acid biosynthetic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:21255105
    supporting_text: show that LtaSBS, YfnI and YqgS are bona-fide LTA synthases
      that can synthesize polyglycerolphosphate polymers (Figs 4C and 7)
  - reference_id: PMID:17483484
    supporting_text: Anhydrotetracycline-inducible expression of staphylococcal
      ltaS or B. subtilis yflE restored both LTA glycerol phosphate synthesis and
      bacterial growth in medium lacking IPTG
proposed_new_terms:
- proposed_name: polyglycerophosphate lipoteichoic acid synthase activity
  proposed_definition: >-
    Catalysis of the transfer of the sn-glycerol-1-phosphate head group of
    phosphatidylglycerol onto the terminal glycerophosphate of a growing
    polyglycerophosphate lipoteichoic acid chain, producing 1,2-diacyl-sn-glycerol
    and extending the polyglycerophosphate backbone by one unit. This term covers
    chain elongation only; transfer of the first glycerophosphate unit onto the
    diglucosyl-diacylglycerol anchor is the separate lipoteichoic acid primase
    activity.
  justification: >-
    GO has no molecular function term for the polyglycerolphosphate LTA synthase
    reaction (EC 2.7.8.-); an OLS search for lipoteichoic acid synthase or
    primase activity returns nothing. The nearest existing term, GO:0016780
    phosphotransferase activity for other substituted phosphate groups, is a
    genus several levels too general; its one relevant existing child,
    GO:0008960 phosphatidylglycerol-membrane-oligosaccharide
    glycerophosphotransferase activity, is the Gram-negative OpgB reaction, which
    is why the PTHR47371 PAINT node can only assert the top-level transferase
    activity. The proposed term is defined to be disjoint from the proposed
    lipoteichoic acid primase activity (elongation versus the first transfer onto
    the glycolipid anchor); an enzyme shown to do both would carry both terms,
    and neither term entails the other.
  proposed_parent:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  supported_by:
  - reference_id: PMID:21255105
    supporting_text: We show that all four orthologues are able to hydrolyse fluorescently
      labelled PG in a Mn2+-dependent manner.
suggested_questions:
- question: >-
    Why does B. subtilis maintain four LtaS-type paralogues (LtaS2/YflE,
    LtaS1/YfnI, YqgS, YvgJ) with partly overlapping activities, and what
    distinguishes the LTA each one produces?
suggested_experiments:
- description: >-
    Determine the kinetic parameters (Km, kcat) of the purified LtaS2/YflE
    catalytic domain for phosphatidylglycerol in the Mn2+-dependent in vitro
    NBD-PG assay, alongside the YfnI and YqgS domains, to quantify the relative
    polymerase activities of the three bona-fide synthases.
  experiment_type: enzyme kinetics assay
