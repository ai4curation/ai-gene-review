id: P39802
gene_symbol: cheW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CheW is a noncatalytic coupling protein that coordinates methyl-accepting chemotaxis receptors
  with the CheA histidine kinase in Bacillus subtilis. It acts on the cytoplasmic side of receptor signaling
  complexes. CheV can compensate for part of its coupling function, but the phosphorylatable receiver
  domain of CheV supplies a separate adaptation mechanism.
