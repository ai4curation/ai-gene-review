  review:
    summary: CheW couples receptor status to the CheA pathway during chemotaxis.
    action: ACCEPT
    reason: CheW links receptor status to CheA activation. The cheV cheW double mutant fails to respond
      to attractant and accumulates poorly in capillary assays, while the CheW-like domain of CheV can
      compensate for coupling. CheW contributes a noncatalytic signaling interface; it is not the phosphorylated
      receiver in the CheV adaptation experiment.
    supported_by:
    - &id001
      reference_id: PMID:11553614
      supporting_text: the chemoreceptors are coupled to the central two-component kinase CheA via two
        proteins, CheW and CheV.
    - &id002
      reference_id: PMID:8169224
      supporting_text: a double mutant lacking both CheV and CheW has a strong tumble bias, does not respond
        to addition of attractant, and shows essentially no accumulation in capillary assays.
    - &id003
      reference_id: file:BACSU/cheW/cheW-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: CheV and CheW are involved in the coupling of the methyl-accepting chemoreceptors
        to the central two- component kinase CheA; they are both necessary for efficient chemotaxis.
