      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Chemotaxis is substantially impaired, with a 30- fold reduction in the efficiency
        of chemotaxis with aspartate and 11- fold reduction with 2-deoxyglucose.
- term:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  evidence_type: IC
  original_reference_id: PMID:8169224
  review:
    summary: CheW supplies noncatalytic adaptor function in chemoreceptor–CheA complexes.
    action: NEW
    reason: The IC proposal integrates CheW/CheV genetic complementation with the experimentally linked
      UniProt account of receptor-to-CheA coupling and the explicit coupling statement in PMID11553614.
      These support the noncatalytic adaptor role within the receptor signaling complex. PMID8169224 alone
      presents the detailed coupling model as a hypothesis, not a purified physical-bridge assay; CheV
      phosphorylation is not evidence for CheW adaptor activity.
    supported_by:
    - *id001
    - *id002
    - *id003
