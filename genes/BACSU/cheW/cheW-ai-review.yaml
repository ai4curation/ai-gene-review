- term:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  evidence_type: IC
  original_reference_id: PMID:8169224
  review:
    summary: Add the experimentally grounded molecular activity.
    action: NEW
    reason: CheW is the noncatalytic receptor-CheA coupling component. Complementation, CheV/CheW
      genetic redundancy and the characterized signaling complex support an adaptor activity;
      it is not merely generic binding. The primary studies explicitly place this coupling activity
      in the receptor-CheA complex, supporting GO:0030159 physical support for assembly of a
      multiprotein receptor signaling complex rather than only generic signaling adaptor activity.
      No adaptor MF existed among the machine-seeded annotations.
    supported_by:
    - reference_id: PMID:8169224
      supporting_text: Thus, CheV and CheW appear in part to be functionally redundant.
    - reference_id: PMID:11553614
