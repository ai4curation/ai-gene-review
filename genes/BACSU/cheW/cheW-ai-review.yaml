  review:
    summary: CheW supports chemotactic accumulation toward tested substrates, including aspartate.
    action: ACCEPT
    reason: The curated target-specific account of PMID1601874 identifies aspartate and 2-deoxyglucose
      assays and complementation, supplementing the abstract’s generic capillary result. Retain the existing
