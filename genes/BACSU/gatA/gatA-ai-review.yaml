id: O06491
gene_symbol: gatA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: GatA is the glutaminase subunit of the GatCAB tRNA-dependent amidotransferase in Bacillus
  subtilis; it hydrolyzes glutamine to supply ammonia for transamidation. Both glutamyl-tRNA(Gln) and
  aspartyl-tRNA(Asn) can feed the indirect pathways in this organism, which also retains a direct AsnS
  route.
