    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000120
  review:
    summary: Refine broad catalytic activity to the glutaminase chemistry supplied by GatA.
    action: MODIFY
    reason: GatA supplies the glutamine-hydrolysis step; Bacillus subunit assays distinguish this chemistry
      from ATP-dependent transamidation by the assembled GatCAB complex. Refine the generic catalytic
      term to glutaminase activity, supported by the target GatA-family assignment and comparative subunit
      biochemistry. Existing complete-complex activity rows and core-function contributions retain the
      supported role in transamidation; this refinement does not reject those contributions.
    supported_by:
    - &id001
      reference_id: file:BACSU/gatA/gatA-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: Belongs to the amidase family. GatA subfamily.
    - reference_id: PMID:9342321
      supporting_text: The holoenzyme and the A subunit (coexpressed A+C) carry out the Gln → Glu conversion;
        ATP is not required for this reaction.
    proposed_replacement_terms:
    - id: GO:0004359
      label: glutaminase activity
- term:
    id: GO:0004359
    label: glutaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:15889
  - EC:3.5.1.2
  - UniRule:UR000001462
  review:
    summary: GatA hydrolyzes glutamine to provide the amide nitrogen for transamidation.
    action: ACCEPT
    reason: GatA is the glutaminase component; this is different from the overall ATP-dependent tRNA synthetase
      reaction. Bacillus experiments localize glutamine hydrolysis to GatA coexpressed with GatC, while
      the PAO1 assignment is additionally supported by its conserved GatA active-site architecture.
    supported_by:
    - &id002
      reference_id: file:BACSU/gatA/gatA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalytic subunit of the Asp/Glu-tRNA(Asn/Gln) amidotransferase complex GatCAB
        (Probable). GatCAB allows the formation of correctly charged Asn-tRNA(Asn) or Gln-tRNA(Gln) through
        the multi- step transamidation of misacylated Asp-tRNA(Asn) or Glu-tRNA(Gln) in organisms which
        lack either or both of asparaginyl-tRNA or glutaminyl- tRNA synthetases (PubMed:9789001). The
        reaction takes place in the presence of glutamine and ATP through an activated phospho-Asp- tRNA(Asn)
        or phospho-Glu-tRNA(Gln). This subunit catalyzes the hydrolysis of the amido donor Gln, releasing
        ammonia that is sequestered within a channel in the GatCAB complex and made available to subunit
        B for downstream aminolysis of Glu-tRNA(Gln); may also be able to use Asn as the amido donor (By
        similarity). {ECO:0000255|HAMAP- Rule:MF_00120, ECO:0000269|PubMed:9789001, ECO:0000305|PubMed:9789001}.
    - reference_id: PMID:9342321
      supporting_text: The holoenzyme and the A subunit (coexpressed A+C) carry out the Gln → Glu conversion;
        ATP is not required for this reaction.
