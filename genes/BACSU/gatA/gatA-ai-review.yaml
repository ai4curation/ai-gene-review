  supporting_entities:
  - ARBA:ARBA00026971
  review:
    summary: Native Bacillus soluble-fraction evidence supports the broad cytoplasmic location of GatA/GatCAB.
    action: ACCEPT
    reason: PMID:9342321 detects native B. subtilis GatCAB activity and immunoreactive subunits in S100
      cell extracts. Together with the intracellular tRNA-transamidation role, this supports cytoplasm
      as the broad compartment. The wild-type Bacillus lane is distinct from recombinant E. coli lanes;
      recombinant purification is not claimed as a native localization assay. This does not establish
      exclusive localization or a finer compartment.
    supported_by:
    - reference_id: PMID:9342321
      supporting_text: The antibodies were able to neutralize the activity of the pure heterotrimeric
        Glu-AdT and also destroy all enzyme activity in crude B. subtilis S100 extracts (data not shown).
    - reference_id: PMID:9342321
      supporting_text: All other lanes contain proteins of S100 cell extracts from wild-type B. subtilis
        (lane 3), E. coli BL21(DE3) containing the empty expression vector (lane 2), and E. coli cells
        containing pCAB (lane 4), pB (lane 7), or pC (lane 8).
