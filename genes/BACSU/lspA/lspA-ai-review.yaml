    record_section:
    - CC:FUNCTION
    supporting_text: This protein specifically catalyzes the removal of signal peptides from prolipoproteins.
  - *id007
suggested_questions:
- question: Why is SPase II dispensable in B. subtilis but essential in E. coli; is it only the absence
    of an Lol-dependent outer-membrane sorting requirement?
suggested_experiments:
- description: Compare lipoprotein processing and membrane retention in lspA-null versus lgt-null B. subtilis
    to separate the effects of uncleaved diacylglyceryl precursors from non-lipidated ones.
  experiment_type: pulse-chase and fractionation
