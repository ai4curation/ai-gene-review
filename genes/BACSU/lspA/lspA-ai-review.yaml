- id: PMID:10497172
  title: The potential active site of the lipoprotein-specific (type II) signal peptidase of Bacillus
    subtilis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; mutagenesis identifies activity-important residues and proposes
      Asp102/Asp129 as catalytic. This is not a complete mechanistic demonstration or an unreported purified
      strain168 turnover measurement.
  findings:
  - statement: Asp-102 and Asp-129 are the proposed catalytic residues, placing SPase II among aspartic
      proteases.
    supporting_text: As Asp-102 and Asp-129 are the only residues invoked in the known catalytic mechanisms
      of proteases, we hypothesize that these two residues are directly involved in SPase II-mediated
      catalysis.
