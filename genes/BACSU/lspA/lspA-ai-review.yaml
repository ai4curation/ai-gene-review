  review:
    summary: Aspartic-type endopeptidase activity is the best current GO term for SPase II.
    action: ACCEPT
    reason: Retain the supported aspartic catalytic-mechanism class. Signal-peptide substrate specificity
      is separately captured by GO:0009003; that term is not an is_a descendant of this mechanistic class.
