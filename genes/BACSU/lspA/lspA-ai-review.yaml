- id: PMID:9880550
  title: The role of lipoprotein processing by signal peptidase II in the Gram-positive eubacterium bacillus
    subtilis. Signal peptidase II is required for the efficient secretion of alpha-amylase, a non-lipoprotein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID resolved by PubMed esearch/esummary (Tjalsma et al., J Biol Chem 1999;274:1698-707).
      Abstract-only cache. Characterizes an lspA-null B. subtilis strain.
  findings:
  - statement: Cells lacking SPase II are viable but temperature-sensitive and accumulate lipid-modified
      PrsA precursor, so SPase II processing is not strictly required for lipoprotein function in B. subtilis.
    supporting_text: Cells lacking SPase II accumulated lipid-modified precursor and mature-like forms
      of PrsA, a folding catalyst for secreted proteins.
  - statement: Lipoprotein processing by SPase II is needed for viability at temperature extremes.
    supporting_text: lipoprotein processing is important for cell viability at low and high temperatures
