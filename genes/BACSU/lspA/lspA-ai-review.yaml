  review:
    summary: Proteolysis is true but uninformative for the dedicated prolipoprotein signal peptidase.
    action: MODIFY
    reason: LspA cleaves a single class of substrate, the signal peptide of diacylglyceryl-prolipoproteins,
      as the second step of lipoprotein maturation. That cleavage is a processing proteolysis, so the
      proteolytic claim is kept at GO:0016485 protein processing (is_a GO:0006508 proteolysis); GO:0042158
      lipoprotein biosynthetic process, which is not a descendant of proteolysis, is added for the pathway
