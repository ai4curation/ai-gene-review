id: Q45589
gene_symbol: cdaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CdaA is a membrane-anchored diadenylate cyclase that synthesizes cyclic di-AMP from two ATP molecules.
  It supplies a major vegetative c-di-AMP pool in Bacillus subtilis, linking nucleotide signaling to potassium,
  osmotic and cell-envelope homeostasis. Its cytoplasmic catalytic domain is attached to three transmembrane
  helices, and its activity is stimulated by the membrane-associated regulator CdaR.
