- id: PMID:42286214
  title: Bacterial lipid synthesizing enzymes PlsY and PlsC utilize both stereo-forms of
    glycerol-phosphate.
  findings:
  - statement: In a coupled liposome assay, B. subtilis and E. coli PlsC convert both the (R) and the
      (S) enantiomer of lysophosphatidic acid into phosphatidic acid, with significantly more of the
      (R) product.
    supporting_text: Interestingly, both PlsC proteins appear to synthesize more (R)-configurated PA
      than the other stereoform, suggesting that LPA containing the G3P backbone is the preferred
      substrate.
    reference_section_type: RESULTS
  - statement: The apparent (R) preference of PlsC is confounded by the lower availability of
      (S)-lysophosphatidic acid, which had to be generated in situ by PlsY, and the coupled system
      cannot support kinetic analysis.
    supporting_text: Although this seems to indicate that BsPlsC prefers (R)-LPA as substrate, we
      cannot rule out this result is partially impacted by the lower availability of (S)-LPA.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read; PubMed confirms EMBO Rep 2026, DOI
      10.1038/s44319-026-00827-z. The authors' own caveats about substrate availability and the
      absence of kinetics are the reason this review treats the (S)-LPA activity as a knowledge gap
