id: O07584
gene_symbol: plsC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: PlsC (formerly YhdO) catalyses the second acylation of membrane phospholipid synthesis
  in Bacillus subtilis, transferring a fatty acyl group from acyl-ACP to the sn-2 position of
  1-acyl-sn-glycerol 3-phosphate (lysophosphatidic acid) to give phosphatidic acid, the precursor
  of phosphatidylethanolamine, phosphatidylglycerol and cardiolipin. It is a peripheral enzyme of
  the cytoplasmic membrane, concentrated with the other lipid synthases in the septal membrane, and
  it carries the HXXXXD acyltransferase motif of the PlsC/AGPAT family. It is the only
  PlsC/AGPAT-family protein encoded in the genome and is indispensable, since when it is inactivated
  its substrate accumulates and phospholipid synthesis stops. Unlike eukaryotic AGPATs it uses acyl-ACP
  rather than acyl-CoA as the acyl donor. In a coupled in vitro system the enzyme acylates both the
  (R)- and the (S)-enantiomer of lysophosphatidic acid, with more of the (R) product formed.
