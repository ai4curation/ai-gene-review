    group from acyl-ACP to the sn-2 position of 1-acyl-sn-glycerol 3-phosphate to form phosphatidic
    acid at the cytoplasmic membrane. It is the only PlsC/AGPAT-family enzyme of B. subtilis and is
    indispensable, so it is the sole route from lysophosphatidic acid to the phosphatidic acid that
    feeds all three major membrane phospholipids.
