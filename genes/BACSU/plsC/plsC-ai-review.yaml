proposed_new_terms:
- proposed_name: acyl-[acyl-carrier-protein] 1-acyl-sn-glycerol-3-phosphate acyltransferase activity
  proposed_definition: 'Catalysis of the reaction: a fatty acyl-[ACP] + a 1-acyl-sn-glycero-3-phosphate
    = a 1,2-diacyl-sn-glycero-3-phosphate + holo-[ACP].'
  justification: GO:0003841, the term used for every bacterial PlsC, is defined with acyl-CoA as
    donor, yet B. subtilis PlsC uses acyl-ACP and not acyl-CoA, and its UniProt catalytic activity
    is written with fatty acyl-[ACP] (Rhea:42296; it has no official EC number, only EC 2.3.1.n4).
    Both parents of GO:0003841, lysophosphatidic acid acyltransferase activity and lysophospholipid
    acyltransferase activity, are also written with acyl-CoA, so the whole sub-branch assumes the
    eukaryotic donor. GO already makes exactly this donor distinction one step earlier in the same
    pathway, between GO:0004366 acyl-CoA glycerol-3-phosphate O-acyltransferase activity and
    GO:0043772 acyl-phosphate glycerol-3-phosphate acyltransferase activity, so the proposal follows
    an established pattern rather than introducing one. The existing annotations are left in place
    because the term name is donor-neutral and the assignment is right about the reaction; the
    request is for a term that also matches the donor, as part of a broader question for GO about
    donor- and stereo-specific terms in this pathway.
  proposed_parent:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  supported_by:
  - reference_id: PMID:17557823
    supporting_text: whereas PlsC used only acyl-ACP as an acyl donor
    reference_section_type: ABSTRACT
  - reference_id: file:BACSU/plsC/plsC-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: This enzyme utilizes acyl-ACP as fatty acyl donor, but not acyl-CoA.
knowledge_gaps:
- gap_statement: Whether PlsC acylates (S)-lysophosphatidic acid, the glycerol 1-phosphate-backbone
    intermediate, at a physiologically meaningful rate is unknown, so it is unknown whether the
    heterochiral phospholipid of B. subtilis is completed by PlsC.
  boundary: What is established is that in a coupled liposome system containing PlsY, B. subtilis
    PlsC converts both enantiomers of lysophosphatidic acid into phosphatidic acid, with
    significantly more of the (R) product. What is not established is any rate on a defined (S)
    substrate, because (S)-lysophosphatidic acid is not commercially available and had to be
    generated in situ, so its lower concentration and the enzyme's preference are confounded, as the
    authors state. No kinetic constants exist for either enantiomer.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: PlsC is the only PlsC/AGPAT-family enzyme in B. subtilis, so if heterochiral
    phospholipid is made at all, PlsC must act on the (S) intermediate; that inference is what
    currently stands in for a measurement. The result decides whether a stereo-alternative molecular
    function should be annotated to the bacterial LPAAT step, for which GO has no term, the paired
    request being the glycerol 1-phosphate term proposed in the plsY review.
  resolution: Assay reconstituted PlsC on chemically synthesised (R)- and (S)-lysophosphatidic acid
    supplied at equal, known concentrations, uncoupled from PlsY, and determine kinetic constants for
    both; then test in vivo whether (S)-backbone phosphatidic acid and phosphatidylglycerol depend on
    PlsC levels.
  provenance:
  - reference_id: PMID:42286214
    supporting_text: Interestingly, both PlsC proteins appear to synthesize more (R)-configurated PA
      than the other stereoform, suggesting that LPA containing the G3P backbone is the preferred
      substrate.
  - reference_id: PMID:42286214
    supporting_text: Although this seems to indicate that BsPlsC prefers (R)-LPA as substrate, we
      cannot rule out this result is partially impacted by the lower availability of (S)-LPA.
  - reference_id: PMID:42286214
    supporting_text: The current in vitro system is, however, unsuitable for such analysis, due to
      the coupling of enzymes.
suggested_questions:
- question: Should GO's lysophosphatidic acid acyltransferase sub-branch be rewritten to be
    donor-neutral, or given acyl-ACP children, given that every bacterial PlsC uses acyl-ACP while
    GO:0003841 and both its parents are defined with acyl-CoA?
  experts:
  - GO molecular function curators
  - lipid metabolism curators
- question: Does GO want stereochemistry-aware terms for the bacterial acyltransferase steps, so
    that acylation of (S)-lysophosphatidic acid can be distinguished from the canonical (R)
    reaction, or should stereochemistry be left to the reaction cross-reference?
  experts:
  - GO Consortium biocurators
  - Rhea and ChEBI curators
- question: Is the septal-membrane concentration of the lipid synthases, including PlsC, best
    captured as a cell division site location, or does it need a bacterial septal membrane term?
  experts:
  - GO cellular component curators
  - bacterial cell biologists
suggested_experiments:
- hypothesis: PlsC acylates (S)-lysophosphatidic acid at a rate sufficient to account for the
    heterochiral phospholipid of B. subtilis.
  description: Synthesise both lysophosphatidic acid enantiomers chemically, reconstitute purified
    PlsC into liposomes containing each at equal known concentration, and measure steady-state
    kinetics with acyl-ACP as donor, so that the enzyme's preference is separated from substrate
    supply in the published coupled assay.
  experiment_type: enzyme kinetics on reconstituted protein with defined substrates
- hypothesis: The acyl donor of B. subtilis PlsC is strictly acyl-ACP, as required for the proposed
    donor-specific GO term.
  description: Compare initial rates of purified PlsC with fatty acyl-ACP and with acyl-CoA over a
    donor concentration range, and test whether acyl-CoA inhibits the acyl-ACP-dependent reaction, as
    is the case for PlsY.
  experiment_type: donor specificity assay
- hypothesis: PlsC function is localised to the division septum, where phosphatidic acid is made.
  description: Image a functional PlsC fluorescent fusion in dividing and sporulating cells together
    with a division-site marker such as FtsZ or DivIVA, and ask whether phosphatidic acid synthesis,
    measured by pulse labelling of isolated septal and lateral membrane fractions, follows the
    protein.
  experiment_type: fluorescence co-localization with metabolic labelling
