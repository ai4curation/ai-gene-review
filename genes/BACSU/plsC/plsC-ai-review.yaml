      glycerol backbone of some phosphatidylglycerol species, which is the in vivo observation that
      the stereo-alternative activity of PlsY and PlsC is invoked to explain.
    supporting_text: By using chiral chromatography, the presence of both enantiomers in the glycerol
      backbone of some molecular species of PG was revealed.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PubMed-verified identifier and title (J Chromatogr A 1676:463267, 2022); this is
