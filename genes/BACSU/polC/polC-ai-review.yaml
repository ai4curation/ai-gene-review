id: P13267
gene_symbol: polC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: PolC is the major processive replicative DNA polymerase of Bacillus subtilis, synthesizing
  the leading strand and most of the lagging strand with the beta sliding clamp and clamp-loader machinery.
  A proofreading 3′–5′ exonuclease is integrated into the same polypeptide. DnaE efficiently extends RNA
  primers before transfer to PolC; PolC can also proofread errors made by DnaE.
