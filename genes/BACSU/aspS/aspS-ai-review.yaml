taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: AspS is a non-discriminating class II aspartyl-tRNA synthetase in Bacillus subtilis. It attaches
  L-aspartate to tRNA(Asp) for translation and also to tRNA(Asn), providing the substrate for GatCAB-dependent
  formation of Asn-tRNA(Asn). This dual tRNA recognition persists despite the organism also possessing
  AsnS and free-asparagine biosynthetic enzymes.
