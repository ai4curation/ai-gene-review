suggested_questions:
- question: What is the physiological substrate of this SDR? Benzil is a synthetic diketone 
    (GO:0102306 was obsoleted for that reason), so the native carbonyl substrate(s) remain to be 
    found.
- question: Should RHEA:25968 ((S)-benzoin + NADP+ = benzil + NADPH) be re-pointed from the EC 
    1.1.1.- grouping class GO:0016616 to GO:0004090 carbonyl reductase (NADPH) activity as a 
    narrowMatch, matching the sister EC 1.1.1.320 reaction RHEA:31891?
suggested_experiments:
- description: Untargeted substrate screen (metabolite library or activity-based metabolomics of 
    deletion vs. wild-type extracts) to identify native carbonyl substrates of the benzil reductase 
    clade.
  experiment_type: biochemical substrate profiling
  hypothesis: The enzyme reduces an endogenous aromatic or quinone carbonyl compound; benzil is a 
    surrogate substrate.
