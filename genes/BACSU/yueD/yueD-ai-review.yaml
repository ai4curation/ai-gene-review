- term:
    id: GO:0006729
    label: tetrahydrobiopterin biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:103078
  - PANTHER:PTN002387926
  - RGD:3753
  - dictyBase:DDB_G0290009
  review:
    summary: IBA to tetrahydrobiopterin biosynthetic process.
    action: REMOVE
    reason: Bacillus subtilis is not known to synthesize tetrahydrobiopterin, and there is no 
      evidence it has the dedicated animal BH4 pathway. A process cannot be inherited into an 
      organism that lacks the pathway, even if the enzyme could reduce sepiapterin in vitro 
      (PATHWAY_CONTEXT_IGNORED).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002387926
        source_label: PTN002387926
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: BH4 biosynthesis is valid for animal SPRs but the pathway is absent from Bacillus.
