id: O32099
gene_symbol: yueD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: B. subtilis YueD (BSU31840) is an uncharacterized classical short-chain 
  dehydrogenase/reductase (SDR) in the PANTHER sepiapterin reductase family (PTHR44085). It is 41% 
  identical to B. cereus YueD, an NADPH-dependent benzil reductase with broad aromatic carbonyl 
  specificity. By homology it is probably a cytoplasmic NADPH-dependent carbonyl reductase, but its 
  activity has not been measured and its physiological substrate is unknown.
