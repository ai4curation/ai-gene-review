id: O34653
gene_symbol: des
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: >-
  Des is the membrane-bound Delta5 acyl-lipid desaturase of Bacillus subtilis. It introduces a cis double
  bond at the Delta5 position of saturated acyl chains, chiefly palmitate, that are already esterified
  in membrane phospholipids, forming cis-5-hexadecenoyl and related unsaturated chains. Des is an oxygen-dependent
  di-iron desaturase with the three histidine-box motifs and multiple transmembrane segments of the membrane
  desaturase family. Its expression is low at 37 C and is induced on a shift to low temperature by the
  DesK/DesR two-component system, so Des supplies the unsaturated fatty acids that B. subtilis uses to
  restore membrane fluidity in the cold; a des null mutant cannot make unsaturated fatty acids after a
  cold shift.
