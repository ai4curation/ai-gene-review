suggested_questions:
- question: >-
    GO has no term for Delta5 acyl-lipid (phospholipid) desaturase activity; should one be requested so
    that Des can be annotated more specifically than the desaturase oxidoreductase class GO:0016717?
- question: >-
    Which electron donor (ferredoxin or flavodoxin and their reductase) supplies Des in vivo?
suggested_experiments:
- description: >-
    Reconstitute purified Des in liposomes containing dipalmitoyl phospholipids with candidate ferredoxin/flavodoxin
    electron-transfer partners and measure Delta5 desaturation.
