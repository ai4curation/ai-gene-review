id: Q04789
gene_symbol: alsS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: AlsS is a catabolic acetolactate synthase of Bacillus subtilis that condenses two pyruvate
  molecules to acetolactate using thiamine diphosphate and magnesium. Together with AlsD it supplies acetoin,
  which can be reduced by BdhA to 2,3-butanediol during oxygen-limited fermentation. AlsS is FAD-independent
  and forms an oligomer of a single polypeptide type, distinct from heteromeric anabolic acetohydroxyacid
  synthases. Its 2-ketoisovalerate decarboxylase side activity can also be used in engineered isobutanol
  pathways.
