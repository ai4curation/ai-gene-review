taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: CheC is a Bacillus subtilis chemotaxis adaptation protein with CheY-P phosphatase
  activity. Binding of CheY-P enhances its interaction with CheD, providing feedback that redistributes
  the receptor activator CheD away from chemoreceptors. Mutant analysis indicates that CheY-P
  and CheD binding are more important for this adaptation role than CheC phosphatase turnover,
  although the hydrolytic activity is directly demonstrated and is enhanced by CheD.
