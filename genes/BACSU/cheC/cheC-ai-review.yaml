  review:
    summary: CheC–CheD feedback supports directed movement toward proline.
    action: ACCEPT
    reason: The full text of PMID23226535 reports proline capillary assays (Figure5B) comparing OI1085,
      a cheC-null strain and complementation, with impaired taxis and restoration by cheC. A CheD-binding-defective
      CheC mutant is also impaired. This is behavioral evidence for movement toward an attractant, combined
      with CheC’s direct adaptation role. The original PMID14749334 row is preserved; its biochemical
      quotes alone were insufficient. These OI1085-derived assays are not relabeled as literal strain168
      experiments.
    supported_by:
    - *id002
    - reference_id: PMID:23226535
      supporting_text: good chemotaxis depends on the mutual affinity of CheC and CheD and impairing this
        interaction either by a mutation in CheC or CheD impairs chemotaxis.
