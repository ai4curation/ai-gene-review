    summary: OpuCC contributes substrate capture to OpuC-mediated ABC transport.
    reason: The evidence supports OpuCC participation in the assembled glycine-betaine and choline importer.
      OpuCC binds the extracellular substrate; the other subunits supply ATP hydrolysis and the transmembrane
      pathway. Refinement to GO:0031459 and GO:0033266 therefore requires contributes_to, recorded explicitly
