  title: Structures of the substrate-binding protein provide insights into the multiple compatible
    solute binding specificities of the Bacillus subtilis ABC transporter OpuC.
  findings:
  - statement: Full author-hosted article inspected. Recombinant OpuCC binds carnitine, glycine betaine,
      choline and ectoine; 3PPQ maps exactly to O32243 plus a purification tag. Choline-O-sulfate
      is cited as a known transport substrate, not assayed as a ligand here. Previously published
      whole-cell transport affinities must not be treated as newly measured isolated-protein dissociation
      constants.
