description: >-
  ProTrek sequence-to-text retrieval for Bacillus subtilis alpha-amylase AmyE. Rank 1 is the correct
  EC-level activity and an exact GOA match; ranks 2, 3 and 5 then work through the glycoside hydrolase
  family 13 product-specificity menu - maltotriohydrolase, neopullulanase, maltotetraohydrolase -
  none of which applies to this endo-acting enzyme, and rank 4 is the parent term. All five sit within
  0.85 score units, so the ranking does not distinguish the right activity from four family neighbours.
  Assessment: 1 correct not novel (CNN), 2 paralog incorrect (PLI).
