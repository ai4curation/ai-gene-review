id: P39215
gene_symbol: mcpB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: McpB is a plasma-membrane methyl-accepting chemotaxis receptor of Bacillus subtilis
  that directly senses asparagine through its extracellular sensing domain. Attractant-bound
  McpB stimulates the CheA kinase through coupling proteins, increasing CheY phosphorylation
  and smooth swimming. Receptor modification and interactions with CheD participate in sensory
  adaptation; CheD activates McpB through binding rather than by deamidating it.
