- id: PMID:19901023
  title: YybT is a signaling protein that contains a cyclic dinucleotide phosphodiesterase domain and
    a GGDEF domain with ATPase activity.
  findings:
  - statement: The DHH/DHHA1 domains hydrolyze cyclic dinucleotides, with c-di-AMP favored as the physiological
      substrate.
    supporting_text: The DHH/DHHA1 domain hydrolyzes c-di-AMP and c-di-GMP to generate the linear dinucleotides
      5'-pApA and 5'-pGpG.
  - statement: ppGpp competitively inhibits the phosphodiesterase.
    supporting_text: The bacterial regulator ppGpp was found to be a strong competitive inhibitor of the
      DHH/DHHA1 domain, suggesting that YybT is under tight control during stringent response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity verified; cached abstract explicitly reports B. subtilis YybT enzymology.
      Detailed kinetic and localization statements are also available in curated UniProt.
- id: PMID:21566650
  title: c-di-AMP reports DNA integrity during sporulation in Bacillus subtilis.
  findings:
  - statement: Increased YybT abundance accompanies reduced c-di-AMP after DNA damage during sporulation.
    supporting_text: This drop was associated with stalled DisA complexes that halt c-di-AMP production
      and with increased levels of the c-di-AMP-degrading enzyme YybT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cached PubMed abstract and curated UniProt connect YybT to c-di-AMP turnover during
      sporulation. The cache is abstract-only; the curated localization account tied to this PMID supports
      retaining the experimental membrane annotation.
- id: PMID:21257773
  title: Unusual heme-binding PAS domain from YybT family proteins.
  findings:
  - statement: Heme binding suppresses the catalytic domains in the characterized Bacillus/Geobacillus
      proteins.
    supporting_text: Heme binding suppresses the catalytic activity of the DHH/DHHA1 phosphodiesterase
      domain and the degenerate GGDEF domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract verified. The tested proteins are BsYybT and GtYybT; this
      does not establish universal heme sensing by every GdpP ortholog.
