  label: Bacillus subtilis subsp. subtilis str. 168
description: GdpP (YybT) is a membrane-associated c-di-AMP phosphodiesterase in Bacillus subtilis. Its
  cytoplasmic DHH/DHHA1 catalytic domains open c-di-AMP to pApA, contributing to control of intracellular
  second-messenger levels. An atypical GGDEF domain has weak ATPase activity, and the PAS-like domain
  binds heme; heme and ppGpp inhibit phosphodiesterase activity in biochemical assays. These regulatory
  properties connect messenger turnover with stress adaptation, while the physiological signals acting
  through the heme sensor remain incompletely established.
