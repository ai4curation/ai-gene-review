- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:1990586
    label: divisome complex
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 2 (score 15.85) and absent from GOA. DivIVA is certainly division-site associated - it
      localises to both faces of the septum and is required for correct septum placement - but whether
      it is a constituent of the divisome complex or acts on it from outside is a real distinction:
      its characterised route is recruiting MinJ, which positions MinCD to inhibit aberrant FtsZ assembly,
      which is regulation of the divisome rather than membership of it. Plausible placement, not established;
      recorded as uncertain.
    supported_by:
    - reference_id: GO_REF:0000033
      supporting_text: >-
        Annotation inferences using phylogenetic trees
