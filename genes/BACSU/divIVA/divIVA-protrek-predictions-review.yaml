  predicted_term_type: GO_CC
  review:
    assessment: NPI
    confidence_score: 0
    error_type: TAXON_CONSTRAINT_VIOLATION
    summary: >-
      Top-ranked hit (score 16.29). The polarisome is the fungal Spa2/Bni1/Pea2/Bud6 complex that
      organises actin cables at the bud tip. It is functionally analogous to DivIVA - both are polar
      landmarks - but it is a eukaryotic complex that cannot exist in a bacterium, and DivIVA works
      through MinJ/MinCD and membrane curvature rather than actin. An analogy retrieved as an identity.
