id: P71021
gene_symbol: divIVA
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for DivIVA, the B. subtilis polar landmark protein that senses
  negative membrane curvature and positions the Min system. The model reads the coiled-coil polar-scaffold
  character of the protein and returns cell-polarity and division machinery terms, but attaches them
  to the wrong organisms and complexes: rank 1 is the fungal polarisome. The free-text channel is
  right at rank 1 ('Important for maintaining cell shape and cell wall integrity by localizing peptidoglycan
  synthesis to the cell poles'). Neither channel reaches this review's core molecular function, membrane
  curvature sensor activity. Assessment: 1 uncertain (UNC), 2 nonparalog incorrect (NPI).
