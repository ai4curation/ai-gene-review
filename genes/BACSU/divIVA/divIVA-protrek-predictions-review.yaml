  predicted_term:
    id: GO:0045152
    label: antisigma factor binding
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 3 (score 15.58). DivIVA's characterised partners are MinJ, RacA and SpoIIE; none is an
      anti-sigma factor. The nearest real connection is that DivIVA's association with the SpoIIE
      phosphatase contributes to compartment-specific sigma-F activation, but SpoIIE acts on the anti-anti-sigma
      factor SpoIIAA and is not itself an anti-sigma factor. The retrieval has picked up the sporulation-signalling
      neighbourhood and named the wrong binding partner class within it.
    supported_by:
    - reference_id: file:BACSU/divIVA/divIVA-uniprot.txt
