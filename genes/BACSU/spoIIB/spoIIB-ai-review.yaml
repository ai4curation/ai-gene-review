suggested_questions:
- question: >-
    What is the direct enzymatic partner of SpoIIB at the polar septum — does
    the SPOR domain recruit a specific peptidoglycan hydrolase (e.g. SpoIID,
    SpoIIP, SpoIIM) to septal peptidoglycan, or does SpoIIB itself position and
    activate the hydrolase complex?
- question: >-
    What accounts for the functional redundancy between SpoIIB and SpoVG at the
    sporulation septum, and does the block observed in a spoIIB spoVG double
    mutant reflect a shared step in septal peptidoglycan remodeling or the
    convergence of two parallel pathways?
suggested_experiments:
- hypothesis: >-
    SpoIIB's SPOR domain preferentially binds denuded septal peptidoglycan and
    recruits septal hydrolases required for engulfment.
  description: >-
    Purify the isolated SPOR domain (aa ~175-250) and full-length SpoIIB and
    test binding to purified peptidoglycan sacculi with and without stem
    peptides (denuded PG) using pull-down and surface plasmon resonance. Test
    whether SPOR-domain point mutants that abolish PG binding also disrupt
    SpoIIB localization to the polar septum and delay engulfment in vivo.
  experiment_type: In vitro peptidoglycan binding + structure-guided mutagenesis + live-cell imaging
- hypothesis: >-
    SpoIIB and SpoVG define parallel but converging inputs to septal remodeling.
  description: >-
    Perform quantitative time-lapse fluorescence microscopy of engulfment in
    wild-type, ΔspoIIB, ΔspoVG, and ΔspoIIB ΔspoVG cells expressing membrane
    (mNeonGreen-PlsX) and peptidoglycan (HADA) reporters. Complement the double
    mutant with alleles expressing only the SpoIIB TM helix or only the SPOR
    domain to define which activity is redundant with SpoVG.
  experiment_type: Genetic epistasis + time-lapse fluorescence microscopy
