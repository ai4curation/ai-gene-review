id: P37575
gene_symbol: spoIIB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
description: >-
  SpoIIB is a single-pass membrane protein that co-localizes with FtsZ at sites
  of polar septation during the early stages of Bacillus subtilis sporulation
  and facilitates the rapid, spatially-regulated dissolution of septal
  peptidoglycan required for forespore engulfment. Its C-terminal SPOR domain
  is characteristic of proteins that bind denuded (septal) peptidoglycan, and
  SpoIIB itself is degraded early in engulfment coincident with its loss from
  polar septa. spoIIB single mutants show only a transient engulfment defect,
  but a spoIIB spoVG double mutant is blocked at sporulation septum formation
  with severely impaired engulfment, indicating that SpoIIB acts redundantly
  with SpoVG to shape the sporulation septum.
