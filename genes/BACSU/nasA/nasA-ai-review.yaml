- id: PMID:9765565
  title: Nitrogen and oxygen regulation of Bacillus subtilis nasDEF encoding NADH-dependent nitrite reductase
    by TnrA and ResDE.
  findings:
  - statement: The primary study identifies NasA as the candidate nitrate transporter upstream of the
      assimilatory reductases.
    supporting_text: The nasA gene, which is divergently transcribed from the nas operon, is thought to
      encode a nitrate transporter (Fig. 1) (17).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article read. Native JH642/168-lineage activity, subunit-deletion controls
      and cytosolic fractionation support NasDE. The abstract reverses the narGHI/nasBC anabolic/catabolic
      pairing; the body correctly distinguishes respiratory NarGHJI from assimilatory NasBC.
