  label: Bacillus subtilis subsp. subtilis str. 168
description: NasA is a multipass plasma-membrane nitrate transporter of Bacillus subtilis 168. It supplies
  nitrate to the assimilatory NasBC nitrate-reductase system. Native mutant physiology supports nitrate
  uptake, while an additional nitrite-transport activity and the coupling mechanism remain unresolved.
