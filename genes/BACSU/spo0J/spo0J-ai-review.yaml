taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
description: Spo0J is the Bacillus subtilis ParB chromosome-partitioning protein, a CTP-binding DNA
  clamp and CTP hydrolase. It recognizes origin-proximal parS sites and spreads onto neighboring
  DNA, organizing a nucleoprotein platform that recruits the Smc-ScpAB chromosome-condensation machinery
  for efficient segregation. CTP binding supports clamp engagement and loading; hydrolysis is dispensable
  for the loading steps tested in vitro and has been proposed to promote turnover or recycling. Spo0J
  also regulates the Soj/ParA control system for DnaA-dependent replication initiation. Through antagonism
  of Soj and the replication checkpoint, it contributes positively to the initiation of sporulation.
