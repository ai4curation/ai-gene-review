      label: CTPase activity
    evidence_type: IDA
    original_reference_id: PMID:31649139
    review:
      summary: Purified B. subtilis Spo0J directly hydrolyzes CTP.
      action: NEW
      reason: Retain this old authored proposal with direct target IDA evidence instead of an unsubstantiated
        authored IBA designation. PMID:31649139 measures phosphate production, with parS stimulation
        and nucleotide-site mutants. Hydrolysis is distinct from ATPase activities of partner Soj/Smc
