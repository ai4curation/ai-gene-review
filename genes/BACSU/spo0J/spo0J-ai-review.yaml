- id: PMID:18854156
  title: Dynamic control of the DNA replication initiation protein DnaA by Soj/ParA.
  findings:
  - statement: Spo0J regulates DNA replication initiation via Soj/ParA
    supporting_text: the ParA ortholog in B. subtilis (Soj) controls the activity of the DNA replication
      initiator protein DnaA. Subcellular localization of several Soj mutants indicates that Soj
      acts as a spatially regulated molecular switch, capable of either inhibiting or activating
      DnaA.
  - statement: spo0J disruption leads to increased chromosome origins
    supporting_text: These results suggest that the pleiotropy manifested by chromosomal parABS mutations
      could be the indirect effects of a primary activity regulating DNA replication initiation.
  - statement: Spo0J localizes to the nucleoid
    supporting_text: Subcellular localization of several Soj mutants indicates that Soj acts as a
      spatially regulated molecular switch
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only primary study establishes Soj-DnaA regulation and the Sda-checkpoint
      explanation for sporulation effects; complemented by explicit Spo0J functional separation in
      PMID:19450516.
  full_text_unavailable: true
