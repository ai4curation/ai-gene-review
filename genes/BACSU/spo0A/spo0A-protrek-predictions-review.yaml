id: P06534
gene_symbol: spo0A
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis (strain 168)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Spo0A, the master response regulator controlling entry into
  sporulation. Rank 1 arrives with an unusually wide margin (19.93, 3.3 units clear of rank 2) but
  is the near-contentless InterPro2GO term detection of stimulus; the informative calls are at ranks
  2 and 3, and the DNA-binding transcription factor activity that this review names as the core molecular
  function is absent from the top five. Both BioReason-SFT and ProTrek's own free-text channel do
  reach the response-regulator and transcription-factor biology. Assessment: 1 correct not novel (CNN),
  2 less precise (LSP).
