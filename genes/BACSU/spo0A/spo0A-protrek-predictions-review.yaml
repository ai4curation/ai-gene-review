- genes/BACSU/spo0A/spo0A-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0051606
    label: detection of stimulus
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 19.93), an exact GOA match arriving through InterPro2GO (GO_REF:0000002).
      Spo0A is the terminal receiver of the KinA/KinB phosphorelay, so it does sit at the end of a
      stimulus-detection chain, but the term is about as uninformative as a biological process term
      can be and carries none of what makes Spo0A distinctive. Scored LSP: correct, already annotated,
      and far less precise than the sporulation-regulation calls immediately below it. That it wins
      by the largest rank1-to-rank2 margin of any gene in the cohort is a caution against reading
      ProTrek's score gap as a confidence signal about biological content.
    supported_by:
    - reference_id: GO_REF:0000002
      supporting_text: >-
        Gene Ontology annotation through InterPro
