  review:
    summary: YvoF catalyzes O-acetylation of the glyceryl headgroup of an ether-lipid acetyl carrier.
    action: MODIFY
    reason: The inherited acetyltransferase claim is supported by target-gene deletion/complementation
      and recombinant enzyme chemistry. The acceptor atoms are glyceryl oxygens, so refine GO:0016407
      to its O-acetyltransferase descendant GO:0016413. This is increased chemical specificity, not rejection
      of PAINT ancestry or inference from donor count. The required PAINT lineage check found no IRD or
      IKR loss. The 2016 primary identifies the acetyl-CoA-dependent YvoF reaction, and the 2025 reconstitution
      uses YvoF to generate an acetylated geranylgeranyl analogue of native HepG. Similarity to maltose
      O-acetyltransferase does not establish maltose as a physiological substrate; the 2016 study reports
      that MAT fails to complement the yvoF deletion.
    proposed_replacement_terms:
    - id: GO:0016413
      label: O-acetyltransferase activity
