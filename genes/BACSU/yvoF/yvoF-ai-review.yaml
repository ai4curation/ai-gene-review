status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: YvoF is a membrane-associated, acetyl-CoA-dependent O-acetyltransferase that acetylates the
  free glyceryl hydroxyl groups of heptaprenylglycerol in Bacillus subtilis. It produces acetylated ether
  lipids that supply acetyl groups to the lipoprotein N-acetyltransferase LhaT. YvoF loads the lipid carrier
  on the cytoplasmic side of the membrane; it does not itself acetylate the lipoprotein amino terminus.
  Its attachment to the membrane and the mechanism by which the carrier crosses the bilayer remain unresolved.
