  review:
    action: ACCEPT
    summary: opuBC contributes to choline passage across the plasma membrane.
    reason: The characterized OpuB complex imports choline across the plasma membrane, and opuBC
      directly supplies substrate capture for this transport cycle. GO:0055085 records membrane
      crossing; GO:0015871 records choline cargo. Current is_a/part_of ancestry does not make
      GO:0015871 a descendant of GO:0055085, and no suitable choline-specific
      transmembrane-transport BP was found. Retain both supported process views rather than
      replacing one laterally. The choline-specific MF is independently refined to ABC-type choline
      transporter activity with complex contribution.
    supported_by:
