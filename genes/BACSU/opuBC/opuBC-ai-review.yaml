  findings:
  - statement: Full author-hosted article inspected. OpuB transport was measured in JH642-derived
      mutants. The study reports OpuB protein identity with the strain168 genome sequence and
      distinguishes native OpuB choline specificity from OpuC glycine-betaine import.
      ATPase/permease role assignment uses architecture; lipoprotein modification was directly
      tested.
    supporting_text: 'Molecular analysis allowed us to demonstrate that the opuB and opuC operons each

      encode a binding protein-dependent ABC transport system that consists of four

      components.'
