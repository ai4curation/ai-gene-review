- id: PMID:21658392
  title: The crystal structure of the substrate-binding protein OpuBC from Bacillus subtilis in
    complex with choline.
  findings:
  - statement: Full author-hosted article inspected. The OpuBC construct uses JH642 DNA and a
      signal-peptide/lipid-anchor modification, not an unmodified native protein. PDB3R6U deposited
      entity sequence maps to canonical Q45462 residues23-306; methods describe a Cys-to-Gly
      replacement at the engineered mature terminus that the deposited entity sequence does not
      encode. Binding-domain evidence remains applicable, with this construct discrepancy preserved.
      Quoted residue numbers are not silently mapped to native precursor numbering.
    supporting_text: 'The crystal structure of the OpuBC/choline complex provides a rational

      for the observed choline specificity of the OpuB ABC importer in vivo and

      explains its inability to catalyze the import of glycine betaine into

      osmotically stressed B. subtilis cells.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-hosted article inspected. The OpuBC construct uses JH642 DNA and a
