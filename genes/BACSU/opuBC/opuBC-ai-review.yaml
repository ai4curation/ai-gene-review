- term: &id003
    id: GO:0033265
    label: choline binding
  evidence_type: IDA
  original_reference_id: PMID:21658392
  qualifier: enables
  review:
    action: NEW
    summary: OpuBC directly captures choline in its ligand-binding pocket.
    reason: OpuBC directly binds choline in fluorescence measurements and the ligand-bound
      structure. The recombinant soluble construct was amplified from JH642, lacks the signal
      peptide and replaces the lipidated terminal cysteine; it tests the binding domain rather than
      an unmodified membrane-tethered protein.
    supported_by:
    - reference_id: PMID:21658392
      supporting_text: 'OpuBC is the substrate-binding protein of the OpuB

        transporter, and we have analyzed the affinity of the OpuBC/choline complex by

        intrinsic tryptophan fluorescence and determined a K(d) value of about 30 μM.'
- term:
    id: GO:0015871
    label: choline transport
  evidence_type: IC
  original_reference_id: PMID:10216873
  qualifier: involved_in
  review:
    action: NEW
    summary: Captures choline for uptake by the OpuB importer.
    reason: 'OpuBC performs extracellular substrate capture: purified-domain fluorescence binding and
      the choline-bound structure identify the ligand pocket, while native radiolabeled uptake establishes
      choline transport by OpuB. It is the binding component of the transporter, not the transported choline
      substrate. Same-role comparators MalE/P0AEX9 and RbsB/P02925 carry experimental cargo-specific transport
      BP annotations (maltose GO0015768 and ribose GO0015752); this checks that substrate-binding proteins
      can perform transport work. The comparator annotations establish a convention, not evidence for
      OpuB. This IC proposal combines component-specific substrate capture or translocation with the demonstrated
      choline cargo. GO0015871 belongs to organic-substance transport and localization; it is neither
      an ancestor nor a descendant of the retained GO0055085 membrane-crossing process. None of the current
      rows or replacements already asserts this cargo BP or its ancestor/descendant. The evidence supports
      participation in transport, rather than necessity alone, downstream osmoprotection or an inferred
      omission because another OpuB subunit carries the term. JH642 assay backgrounds and the documented
      correspondence to the168 proteins remain as described in the reference review.'
    supported_by:
    - reference_id: PMID:10216873
      supporting_text: 'Kinetic analysis of [14C]-choline uptake via OpuB (K(m) = 1

        microM; Vmax = 21 nmol min-1 mg-1 protein) and OpuC (K(m) = 38 microM; Vmax = 75

        nmol min-1 mg-1 protein) revealed that each of these ABC transporters exhibits

        high affinity and substantial transport capacity.'
    - reference_id: PMID:21658392
      supporting_text: 'OpuBC is the substrate-binding protein of the OpuB


        transporter, and we have analyzed the affinity of the OpuBC/choline complex by


        intrinsic tryptophan fluorescence and determined a K(d) value of about 30 μM.'
