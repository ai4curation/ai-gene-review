- id: PMID:27226549
  title: Identification and Characterization of Heptaprenylglyceryl Phosphate Processing Enzymes
    in Bacillus subtilis.
  findings:
  - statement: In Bacillales the PcrB product is not elaborated into an archaeal-type membrane lipid
      by addition of a second polyprenyl chain; it is dephosphorylated and acetylated instead, which
      is why the pathway output is a neutral ether lipid rather than a bulk phospholipid.
    supporting_text: In Bacillales, heptaprenylglyceryl phosphate does not become linked to a second
      polyprenyl moiety like ether lipids in Archaea but is dephosphorylated and acetylated.
    reference_section_type: ABSTRACT
  - statement: The dephosphorylating enzyme was enriched but never assigned to a gene; the acetyltransferase
