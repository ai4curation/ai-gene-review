- id: PMID:27226549
  title: Identification and Characterization of Heptaprenylglyceryl Phosphate Processing Enzymes in
    Bacillus subtilis.
  findings:
  - statement: In Bacillales the PcrB product is not elaborated into an archaeal-type membrane
      lipid by addition of a second polyprenyl chain; it is dephosphorylated and acetylated
      instead, which is why the pathway output is a neutral ether lipid rather than a bulk
      phospholipid.
    supporting_text: In Bacillales, heptaprenylglyceryl phosphate does not become linked to a
      second polyprenyl moiety like ether lipids in Archaea but is dephosphorylated and acetylated.
    reference_section_type: ABSTRACT
  - statement: The dephosphorylating enzyme was enriched but never assigned to a gene; the
      acetyltransferase is YvoF, identified by screening a knock-out library.
    supporting_text: We enriched the phosphatase activity from a B. subtilis cell extract and
      suppose that dephosphorylation is catalyzed by the phosphatase PhoB or by any other
      phosphatase in an unspecific manner.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record checked and matches the cached title. Abstract-only cache, but both
      quoted claims are in the abstract. Establishes the fate of the PcrB product, which is what
      decides whether the pathway is membrane-lipid biosynthesis or carrier biosynthesis.
- id: PMID:40626731
  title: 'Lipoprotein N-terminal modification in Bacillus: a new paradigm for extracellular
    acetylation and species-dependent Toll-like receptor 2 immunomodulation.'
  findings:
  - statement: The purpose of the PcrB pathway is to build a lipophilic acetyl carrier. PcrB
      condenses glycerol 1-phosphate with heptaprenyl diphosphate, a non-specific phosphatase
      removes the phosphate, and YvoF acetylates the product from acetyl-CoA to give Ac-HepG.
    supporting_text: PcrB condenses sn-glycerol 1-phosphate (G1P) with heptaprenyl pyrophosphate
      (HepPP) to form heptaprenylglyceryl phosphate (28, 29), which is subsequently dephosphorylated
      by a non-specific phosphatase prior to acetylation by YvoF to form acetylated
      heptaprenylglyceryl (Ac-HepG) with acetyl-coenzyme A (Ac-CoA) as donor (27).
    reference_section_type: DISCUSSION
  - statement: Disruption of pcrB, yvoF or ypjA each abolishes lipoprotein N-acetylation, so all
      three are strictly required for the modification; back complementation restored it and the
      pathway was reconstituted in vitro from the four purified activities.
    supporting_text: Only pcrB, yvoF, and ypjA fully suppressed TLR2 activity, indicating these
      genes are strictly required for Ac-LP synthesis.
    reference_section_type: RESULTS
  - statement: The acetyl group is transferred to the lipoprotein by LhaT (YpjA), an integral
      membrane protein acting on an extracytoplasmic acceptor, after Ac-HepG is shuttled across the
      membrane by an unidentified route.
    supporting_text: The Ac-HepG extracellular acetyl donor is then shuttled across the membrane by
      an unidentified process where it is utilized by LhaT (YpjA)
    reference_section_type: DISCUSSION
  - statement: The authors read the low abundance of HepG and Ac-HepG as evidence for a catalytic
      carrier role rather than a structural membrane-lipid role.
    supporting_text: A catalytic role as a transient carrier for acetyl groups, as opposed to being
      a structural membrane building block for an archeal-type lipid with ether-linked isoprenoid
      chains, is more consistent with the low overall abundance of HepG/Ac-HepG observed in B.
      subtilis membranes (28).
    reference_section_type: DISCUSSION
  - statement: PcrB is more widely distributed among Bacillales than LhaT, and some species that
      encode both do not make acetylated lipoprotein, so Ac-HepG may have uses beyond lipoprotein
      acetylation.
    supporting_text: The co-occurrence of PcrB with YpjA is not absolute, however, with PcrB
      enjoying a broader strain distribution than LhaT.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. PubMed record checked; its stored title has the
      italicized genus and the N-terminal prefixes stripped, so it reads differently from the
      cached title, which is the readable form used here. This is the only source for the
      physiological purpose of the pathway and is the reference behind the lipoprotein-acetylation
      argument that was examined and rejected for a process annotation on PcrB.
- id: PMID:18558723
  title: 'Identification and characterization of a bacterial glycerol-1-phosphate dehydrogenase:
    Ni(2+)-dependent AraM from Bacillus subtilis.'
  findings:
  - statement: AraM (EgsA) is a bacterial glycerol-1-phosphate dehydrogenase that reduces
      dihydroxyacetone phosphate to glycerol 1-phosphate, and was proposed to supply the glycerol
      1-phosphate used for glycerolipid synthesis in Gram-positive bacteria. The proposal was not
      tested against heptaprenylglyceryl phosphate levels.
    supporting_text: we propose that AraM generates G1P for the synthesis of phosphoglycerolipids
      in Gram-positive bacterial species
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
