- id: PMID:21761520
  title: Functional assignment of an enzyme that catalyzes the synthesis of an archaea-type ether
    lipid in bacteria.
  findings:
  - statement: PcrB is the heptaprenylglyceryl phosphate synthase of Bacillales, and its product
      is dephosphorylated and acetylated in the cell.
    supporting_text: PcrB, the bacterial homologue of the archaea-specific geranylgeranylglyceryl
      phosphate synthase, produces heptaprenylglyceryl phosphate in bacillales.
    reference_section_type: ABSTRACT
  - statement: The two processing steps that follow the PcrB reaction occur in vivo, so the ether
      lipid is a real cellular metabolite rather than an in vitro product.
    supporting_text: The product becomes dephosphorylated and acetylated in vivo.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record checked and matches the cached title, authors and journal, and the
      paper is the reference UniProt cites for FUNCTION, CATALYTIC ACTIVITY, SUBSTRATE SPECIFICITY
      and DISRUPTION PHENOTYPE with experimental evidence codes. The cached entry is abstract-only,
      so only abstract-level claims are quoted; the deletion phenotype is taken from the UniProt
      record instead.
- id: PMID:24684232
  title: A comprehensive analysis of the geranylgeranylglyceryl phosphate synthase enzyme family
    identifies novel members and reveals mechanisms of substrate specificity and quaternary structure
    organization.
  findings:
  - statement: Across seventeen characterized family members, the bacterial group I enzymes such
      as B. subtilis PcrB are heptaprenylglyceryl phosphate synthases, whereas the bacterial group
      II enzymes have archaeal-type geranylgeranylglyceryl phosphate synthase activity.
    supporting_text: differ from the bacterial group I enzymes that are heptaprenylglyceryl phosphate
      synthases
    reference_section_type: ABSTRACT
  - statement: The reaction catalysed by the whole family is the formation of an ether bond between
      glycerol 1-phosphate and a polyprenyl diphosphate.
    supporting_text: family enzymes catalyse the formation of an ether bond between glycerol-1-phosphate
      and polyprenyl diphosphates
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record checked and matches the cached title. This is the source of the EXP
      row and the reference UniProt cites for FUNCTION, CATALYTIC ACTIVITY and SUBUNIT. Cached entry
      is abstract-only, but the group I assignment and the ether-bond chemistry are both stated in
      the abstract. The publisher full article was also accessible online; quotations retained here
      are the frozen abstract text. Target PcrB chemistry is independently supported by the full
      cached biochemical studies, not by a blanket clade label.
- id: PMID:21214173
  title: Two distinct mechanisms for TIM barrel prenyltransferases in bacteria.
  findings:
  - statement: PcrB uses sn-glycerol 1-phosphate as its only acceptor, making it the first bacterial
      enzyme shown to use that enantiomer, and it transfers the prenyl group without isomerization
      so the trans-allylic geometry of the donor is retained.
    supporting_text: PcrB uses G1P (1) exclusively as an acceptor
    reference_section_type: RESULTS
  - statement: The acceptor finding was framed as the first bacterial use of glycerol 1-phosphate
      as a substrate.
    supporting_text: making it the first known bacterial enzyme to use G1P as a substrate
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. The paper is mainly about MoeO5, with PcrB as the contrasting
      enzyme, and the PcrB acceptor and stereochemistry results quoted here are in its own sections;
      UniProt cites it for FUNCTION AS A PRENYLTRANSFERASE, STEREOCHEMISTRY AND SUBSTRATE SPECIFICITY.
- id: PMID:23322418
  title: 'Insights into TIM-barrel prenyl transferase mechanisms: crystal structures of PcrB from
    Bacillus subtilis and Staphylococcus aureus.'
  findings:
  - statement: Mg2+ is required for catalysis, since no product forms in the presence of EDTA or
      in the absence of added magnesium.
    supporting_text: No product was found, indicating that Mg2+ is likely essential for catalysis.
