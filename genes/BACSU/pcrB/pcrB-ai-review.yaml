    reference_section_type: DISCUSSION
suggested_questions:
- question: Should an enzyme that builds a small-molecule carrier or cofactor carry the process term
    for the modification that consumes it? This review declined to add lipoprotein biosynthetic
    process (GO:0042158) to PcrB, because LhaT performs the acetyl transfer, the acetyl group comes
    from acetyl-CoA via YvoF, and the carrier is regenerated rather than incorporated, so PcrB
    contributes no atom to the modified protein. A QuickGO comparator check supports that reading.
    The enzymes that make the farnesyl and geranylgeranyl donors (FDPS, GGPS1), the methyl donor
    (MAT2A, metK), the acetyl donor (ACLY, ACSS2) and the biotin that is ligated onto proteins
    (bioB, bioF) all stop at donor or cofactor biosynthesis and none carries the corresponding
    protein-modification process. The closest counterexamples, Lgt and Lnt, modify the lipoprotein
    themselves. The matched-role comparison is with the enzymes that build a carrier backbone
    rather than charge it, namely DHDDS and NUS1 for dolichol, HepS and HepT for the C35 donor
    PcrB itself consumes, and UppS for undecaprenyl phosphate, which this repository models in
    bacterial_undecaprenyl_phosphate_carrier_supply with polyprenol biosynthetic process
    (GO:0016094) alone and no downstream glycan process. DPM1 is not a counterexample in this
    role, since it charges the carrier with the mannose it donates, which makes it the analogue
    of YvoF rather than of PcrB. UppS does carry GO:0009252 in GOA, and is the one genuine
    counterexample. Is the carrier-backbone-synthase exclusion deliberate consortium practice,
    and if so should it be written down?
  experts:
  - GO Consortium biocurators
  - GO biological process ontology editors
- question: Does GO:0008611 ether lipid biosynthetic process cover isoprenoid ethers on an
    sn-glycerol 1-phosphate backbone? Its definition says the lipid alcohol is in ether linkage to
    one of the carbon atoms, normally C-1, of glycerol, and in heptaprenylglyceryl phosphate the
    ether is on C-3 because sn numbering is fixed by the opposite backbone stereochemistry, even
    though it is the same physical position relative to the phosphate. The term currently has no
    archaeal or bacterial annotations at all, and every reviewed archaeal geranylgeranylglyceryl
    phosphate synthase carries only the generic glycerophospholipid term, which appears to be an
    artefact of a single UniProt rule rather than a decision. Would the consortium clarify the
    definition and, if so, is a child term for isoprenoid or archaeal-type ether lipid biosynthesis
    wanted to collect the GGGPS family?
  experts:
  - GO biological process ontology editors
  - archaeal and bacterial lipid biochemists
- question: Does GO want a way to describe a lipophilic group-carrier cycle, in which a lipid is
    built, charged, discharged and reused? The heptaprenylglycerol pathway makes a carrier rather
    than a membrane component, and nothing in the lipid biosynthesis branch distinguishes the two,
    which is why the purpose of this pathway is invisible in the gene's annotations.
  experts:
  - GO Consortium biocurators
  - lipid metabolism curators
- question: Is the in vitro use of C10 and C20 prenyl donors by PcrB of any physiological
    consequence in Bacillales, or purely substrate range for an enzyme built around the C35 donor?
    The 2025 reconstitution used the shorter geranylgeranyl donor for convenience, so the shorter
    products are known to be usable by the downstream enzymes.
  experts:
  - Bacterial prenyltransferase biochemists
suggested_experiments:
- hypothesis: EgsA (AraM) is the physiological source of the sn-glycerol 1-phosphate that PcrB uses.
  description: Delete or conditionally deplete araM and measure heptaprenylglycerol, acetylated
    heptaprenylglycerol and acetylated lipoprotein by mass spectrometry, alongside chiral analysis
    of the glycerol-phosphate pool. Loss of the lipid would establish the flux from EgsA to PcrB;
    its persistence would show that a second, unidentified route to the sn-1 enantiomer operates in
    B. subtilis.
  experiment_type: targeted deletion with lipidomics and chiral metabolite analysis
- hypothesis: The ether lipid is a genuine carrier that is regenerated and reused, rather than a
    lipid consumed once per acetyl group delivered.
  description: Feed cells or proteoliposomes isotopically labelled heptaprenylglycerol and follow
    the label through the acetylated and free forms while lipoprotein acetylation proceeds, then
    compare the number of acetyl groups transferred per molecule of carrier. A ratio well above one
    would establish a catalytic cycle and place a regeneration step in the pathway.
  experiment_type: isotope tracing with in vitro reconstitution
- hypothesis: PcrB is retained in strains lacking a functional LhaT because its product has another
    acceptor or another membrane role.
  description: In a Bacillus species that encodes PcrB but a pseudogenized LhaT, compare wild type
    with pcrB and yvoF deletions by untargeted lipidomics and by acetyl-proteomics of the
    extracytoplasmic and membrane fractions, and test the deletions for membrane-stress phenotypes.
    Any acetylated species or lipid lost with the carrier would identify the alternative use.
  experiment_type: comparative lipidomics and acetyl-proteomics in a non-model Bacillus
- hypothesis: The chain length of the prenyl donor matters for the carrier function, not just for
    the enzyme active site.
  description: Compare lipoprotein N-acetylation efficiency and carrier partitioning in
    reconstituted membranes using heptaprenyl (C35) and geranylgeranyl (C20) versions of the
    carrier, since the shorter form is known to be accepted by PcrB, YvoF and LhaT. A strong
    chain-length dependence in the transfer or flipping step would show that the C35 preference of
    PcrB is selected by the carrier cycle rather than by catalysis alone.
  experiment_type: in vitro reconstitution with defined carrier chain lengths
