- id: PMID:24684232
  title: A comprehensive analysis of the geranylgeranylglyceryl phosphate synthase
    enzyme family identifies novel members and reveals mechanisms of substrate specificity
    and quaternary structure organization.
  findings:
  - statement: Across seventeen characterized family members, the bacterial group I enzymes such as
      B. subtilis PcrB are heptaprenylglyceryl phosphate synthases, whereas the bacterial group II
      enzymes have archaeal-type geranylgeranylglyceryl phosphate synthase activity.
    supporting_text: differ from the bacterial group I enzymes that are heptaprenylglyceryl
      phosphate synthases
    reference_section_type: ABSTRACT
  - statement: The reaction catalysed by the whole family is the formation of an ether bond between
      glycerol 1-phosphate and a polyprenyl diphosphate.
    supporting_text: family enzymes catalyse the formation of an ether bond between
