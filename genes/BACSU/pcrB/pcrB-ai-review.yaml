- id: PMID:40626731
  title: 'Lipoprotein N-terminal modification in Bacillus: a new paradigm for extracellular acetylation
    and species-dependent Toll-like receptor 2 immunomodulation.'
  findings:
  - statement: In B. subtilis, PcrB initiates synthesis of the lipophilic acetyl-carrier precursor;
      YvoF loads acetyl groups and LhaT performs transfer onto lipoprotein. This does not establish
      the same downstream use in every PcrB-containing lineage.
    supporting_text: PcrB condenses sn-glycerol 1-phosphate (G1P) with heptaprenyl pyrophosphate
      (HepPP) to form heptaprenylglyceryl phosphate (28, 29), which is subsequently dephosphorylated
      by a non-specific phosphatase prior to acetylation by YvoF to form acetylated heptaprenylglyceryl
      (Ac-HepG) with acetyl-coenzyme A (Ac-CoA) as donor (27).
    reference_section_type: DISCUSSION
  - statement: Disruption of pcrB, yvoF or ypjA each abolishes lipoprotein N-acetylation, so all
      three are strictly required for the modification; back complementation restored it and the
      pathway was reconstituted in vitro from the four purified activities.
    supporting_text: Only pcrB, yvoF, and ypjA fully suppressed TLR2 activity, indicating these genes
      are strictly required for Ac-LP synthesis.
    reference_section_type: RESULTS
  - statement: The authors propose translocation of Ac-HepG to the extracytoplasmic lipoprotein acceptor
      used by LhaT; the transport mechanism is unidentified.
    supporting_text: The Ac-HepG extracellular acetyl donor is then shuttled across the membrane
      by an unidentified process where it is utilized by LhaT (YpjA)
    reference_section_type: DISCUSSION
  - statement: The authors read the low abundance of HepG and Ac-HepG as evidence for a catalytic
      carrier role rather than a structural membrane-lipid role.
    supporting_text: A catalytic role as a transient carrier for acetyl groups, as opposed to being
      a structural membrane building block for an archeal-type lipid with ether-linked isoprenoid
      chains, is more consistent with the low overall abundance of HepG/Ac-HepG observed in B. subtilis
      membranes (28).
    reference_section_type: DISCUSSION
  - statement: PcrB has a broader strain distribution than LhaT, leaving possible carrier functions
      outside the demonstrated Bacillus lipoprotein-acetylation pathway unresolved.
    supporting_text: The co-occurrence of PcrB with YpjA is not absolute, however, with PcrB enjoying
      a broader strain distribution than LhaT.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. PubMed record checked; its stored title has the italicized
