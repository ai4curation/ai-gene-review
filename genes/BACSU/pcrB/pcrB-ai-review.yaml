- id: PMID:21214173
  title: Two distinct mechanisms for TIM barrel prenyltransferases in bacteria.
  findings:
  - statement: PcrB uses sn-glycerol 1-phosphate as its only acceptor, making it the first
      bacterial enzyme shown to use that enantiomer, and it transfers the prenyl group without
      isomerization so the trans-allylic geometry of the donor is retained.
    supporting_text: PcrB uses G1P (1) exclusively as an acceptor
    reference_section_type: RESULTS
  - statement: The acceptor finding was framed as the first bacterial use of glycerol 1-phosphate
