id: O34790
gene_symbol: pcrB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224308
  label: Bacillus subtilis subsp. subtilis str. 168
description: PcrB is the heptaprenylglyceryl phosphate (HepGP) synthase of Bacillus subtilis, a
  homodimeric Mg2+-dependent TIM-barrel prenyltransferase of the GGGPS family (group I subfamily).
  It transfers the C35 heptaprenyl moiety of all-trans-heptaprenyl diphosphate to the C3 hydroxyl
  of sn-glycerol 1-phosphate, forming an ether bond and releasing diphosphate. Both features of
  the reaction are archaeal rather than bacterial. The acceptor is the sn-1 glycerophosphate
  enantiomer used by archaeal membrane lipids, and the product carries an isoprenoid chain in
  ether rather than ester linkage. The acceptor specificity is strict, since glycerol 3-phosphate
  and 3-phosphoglycerate are not used, while shorter C10 and C20 prenyl donors are accepted in
  vitro with much lower efficiency, and dimerization is what allows the long native donor to be
  bound. Unlike the archaeal pathway, the Bacillales product is not elaborated into a bulk
  membrane lipid by addition of a second prenyl chain. HepGP is instead dephosphorylated by a
  non-specific phosphatase and O-acetylated by YvoF, giving acetylated heptaprenylglycerol
  (Ac-HepG), a low-abundance lipophilic acetyl carrier. Ac-HepG delivers acetyl groups to the
  extracytoplasmic face of the membrane, where LhaT (YpjA) transfers them to the N-terminal
  cysteine of mature diacylglyceryl lipoproteins, and loss of pcrB abolishes that lipoprotein
  N-acetylation. PcrB is therefore the committed, ether-bond-forming step of a prenyl-lipid
  acetyl-carrier pathway, and is distributed more widely among Bacillales than the LhaT consumer
  of its product.
