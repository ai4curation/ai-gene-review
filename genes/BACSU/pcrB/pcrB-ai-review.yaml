  evidence_type: EXP
  original_reference_id: PMID:24684232
  qualifier: enables
  review:
    summary: The core molecular function, measured as part of a systematic biochemical survey of
      the GGGPS family that separates the bacterial group I HepGP synthases from the group II GGGP
      synthases.
    action: ACCEPT
    reason: Peterhoff et al. characterized seventeen representative family members side by side and
      found that bacterial group I enzymes, of which B. subtilis PcrB is the exemplar, are
      heptaprenylglyceryl phosphate synthases, distinct from the group II bacterial enzymes that
      have archaeal-type GGGP synthase activity. That comparison is what makes the chain-length
      assignment to the C35 donor specific rather than generic prenyltransferase chemistry. The
      cached record is abstract-only, but the abstract states the group I assignment, and UniProt
      cites this reference for CATALYTIC ACTIVITY with experimental evidence. Core.
    supported_by:
    - reference_id: PMID:24684232
      supporting_text: differ from the bacterial group I enzymes that are heptaprenylglyceryl
        phosphate synthases
      reference_section_type: ABSTRACT
    - reference_id: PMID:24684232
      supporting_text: family enzymes catalyse the formation of an ether bond between
        glycerol-1-phosphate and polyprenyl diphosphates
      reference_section_type: ABSTRACT
- term:
    id: GO:0120536
    label: heptaprenylglyceryl phosphate synthase activity
  evidence_type: IDA
  original_reference_id: PMID:21761520
  qualifier: enables
  review:
    summary: Direct assay of the purified enzyme with its native substrates, with the acceptor and
      donor specificity established in the accompanying work.
    action: ACCEPT
    reason: This is the annotation the whole review turns on, and it is well grounded. The purified
      protein transfers the C35 heptaprenyl group from heptaprenyl diphosphate to the C3 hydroxyl of
      sn-glycerol 1-phosphate, the acceptor is strictly the sn-1 enantiomer, crystal structures with
      bound glycerol 1-phosphate show how it is held, and the native chain length depends on the
      homodimer. In vitro use of the shorter C10 and C20 donors is substrate range rather than a
      second physiological reaction, since the C35 donor is the one the enzyme is built for and the
      C35 product is what accumulates in the cell, so no additional activity is annotated for it.
      Core.
