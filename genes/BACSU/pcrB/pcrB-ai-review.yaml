- id: PMID:22614947
  title: Dimerization determines substrate specificity of a bacterial prenyltransferase.
  findings:
  - statement: Monomerized PcrB accepts only polyprenyl diphosphates of up to three isoprene
      units, so the homodimer is what allows the native seven-isoprene donor to be used, and
      quaternary structure is part of the chain-length specificity of the enzyme.
    supporting_text: activity assays showed that monomerization limits the length of accepted
      polyprenyl pyrophosphates to three isoprene units, whereas the native PcrB substrate
      contains seven isoprene entities
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
