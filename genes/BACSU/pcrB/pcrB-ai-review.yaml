core_functions:
- description: Forms the committed ether linkage of the Bacillales prenyl-glycerol pathway,
    transferring the C35 heptaprenyl group of all-trans-heptaprenyl diphosphate to the C3 hydroxyl
    of sn-glycerol 1-phosphate to give 3-heptaprenyl-sn-glycero-1-phosphate and diphosphate. The
    acceptor is strictly the archaeal-type sn-1 glycerophosphate enantiomer, the reaction requires
    Mg2+, and the homodimer is what permits the long native donor to be bound. This is the only
    step of the pathway that creates the ether bond, and the lipid it makes is the precursor of
    heptaprenylglycerol and its acetylated form, the lipophilic acetyl carrier that supplies
    lipoprotein N-acetylation; the acetyl group itself comes from acetyl-CoA via YvoF, and the
    transfer onto protein is carried out by LhaT, not by PcrB.
