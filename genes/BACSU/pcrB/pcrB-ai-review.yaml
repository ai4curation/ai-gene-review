knowledge_gaps:
- gap_statement: How the ether lipid PcrB makes reaches the outer face of the membrane, and whether
    the discharged carrier returns to the cytoplasmic face to be reloaded, is unknown. No
    transporter or flippase has been identified, and whether the movement is protein-mediated at
    all has not been determined.
  boundary: What is established is that PcrB and YvoF build Ac-HepG on the cytoplasmic side from
    cytoplasmic substrates, that LhaT is an integral membrane protein acting on an acceptor on the
    outer leaflet, and that the whole pathway can be reconstituted in vitro from four purified
    activities with no transporter. What is unknown is whether a dedicated transporter exists,
    whether spontaneous flipping of the neutral lipid suffices, and whether HepG is recycled rather
    than discarded after the acetyl group is handed over.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Whether the pathway is a true carrier cycle or a one-way lipid flux decides how the
    PcrB reaction should be modelled, and in particular whether the product is consumed
    stoichiometrically or regenerated. It also determines whether a transport step belongs in the
    pathway at all.
  resolution: Identify the translocation step, by screening for mutants that accumulate cytoplasmic
    Ac-HepG while losing acetylated lipoprotein, and by measuring flipping of Ac-HepG and HepG in
    proteoliposomes with and without candidate transporters; then test recycling with isotopically
    labelled HepG.
  provenance:
  - reference_id: PMID:40626731
    supporting_text: How high-energy acetyl donors are shuttled to the cell surface for trasnfer is
      unknown.
    reference_section_type: ABSTRACT
  - reference_id: PMID:40626731
    supporting_text: The Ac-HepG extracellular acetyl donor is then shuttled across the membrane by
      an unidentified process where it is utilized by LhaT (YpjA)
    reference_section_type: DISCUSSION
- gap_statement: Whether the sn-glycerol 1-phosphate that PcrB uses in the living cell is supplied
    by the glycerol-1-phosphate dehydrogenase EgsA (AraM) is not established, and whether any other
    route to that enantiomer operates in B. subtilis is unknown.
  boundary: What is established is that PcrB accepts sn-glycerol 1-phosphate and not sn-glycerol
    3-phosphate or 3-phosphoglycerate, and that AraM is a bacterial glycerol-1-phosphate
    dehydrogenase that reduces dihydroxyacetone phosphate to that enantiomer. What is unknown is
    whether the AraM product is in fact the acceptor pool PcrB draws on, since no measurement of
    heptaprenylglyceryl lipid levels in an araM deletion has been reported, and the AraM paper
    itself frames the connection as a proposal.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Flux through PcrB is set by the availability of an enantiomer that bacteria are not
    supposed to make, so identifying its source determines whether the ether-lipid route is a
    dedicated pathway with its own precursor supply or an opportunistic use of a side pool. It also
    decides whether EgsA and PcrB should be modelled as a connected pathway.
  resolution: Measure heptaprenylglycerol, its acetylated form and acetylated lipoprotein in an
    araM deletion and in a strain where araM is conditionally depleted, and quantify the glycerol
    1-phosphate pool by chiral analysis; a strain lacking araM that still makes the lipid would
    point to an unidentified second route.
  provenance:
  - reference_id: PMID:18558723
    supporting_text: we propose that AraM generates G1P for the synthesis of phosphoglycerolipids
      in Gram-positive bacterial species
    reference_section_type: ABSTRACT
  - reference_id: file:BACSU/pcrB/pcrB-uniprot.txt
    supporting_text: Cannot use glycerol-3-phosphate (G3P) or 3-phosphoglycerate (3PG) as an
      acceptor.
- gap_statement: Whether the PcrB product has roles beyond supplying acetyl groups to lipoproteins
    is unknown. PcrB is present in Bacillales strains that lack a functional LhaT, and some species
    encoding both do not make acetylated lipoprotein, so the lipid may serve other extracellular
    acyl-transfer reactions or another function altogether.
  boundary: What is established is that pcrB, yvoF and ypjA are each strictly required for
    lipoprotein N-acetylation in B. subtilis, and that the pathway reconstitutes in vitro. What is
    unknown is why PcrB is retained where the known consumer of its product is absent or
    pseudogenized, and whether any other acceptor of the carried acetyl group exists.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: If Ac-HepG has other acceptors, PcrB participates in more than one process and the
    current single-pathway reading of the gene is incomplete; if it does not, the retention of pcrB
    without lhaT needs another explanation, such as a membrane-biophysical role for the neutral
    ether lipid.
  resolution: Compare the extracellular and membrane acetyl-proteome and lipidome of wild type with
    pcrB and yvoF deletions in a species that encodes PcrB but no functional LhaT, looking for
    acetylated macromolecules or lipid species lost with the carrier.
  provenance:
