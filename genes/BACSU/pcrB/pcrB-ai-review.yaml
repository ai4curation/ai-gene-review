- term:
    id: GO:0008611
    label: ether lipid biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:21761520
  qualifier: involved_in
  review:
    summary: 'Retain the historical ether-lipid biosynthesis proposal: PcrB directly forms the ether
      linkage of HepGP.'
    action: NEW
    reason: This historical NEW assertion is retained with its exact payload. PcrB performs ether-bond
      formation between glycerol phosphate and an isoprenoid chain, rather than merely supplying a
      substrate to another catalyst. The GO definition allows an ether linkage to one glycerol carbon,
      normally C-1; it does not exclude the opposite sn-glycerophosphate stereochemistry. This claim
      concerns the directly synthesized ether lipid, not bulk membrane assembly or downstream protein
      modification. The historical comparator concern about sparse prokaryotic usage remains a convention
      question; it does not justify categorical claims that no curator reviewed these enzymes or that
      a single rule explains all absence.
