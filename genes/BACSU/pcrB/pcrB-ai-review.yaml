- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000076516
  review:
    summary: Mg2+ is the catalytic cofactor of the prenyl-transfer reaction; the binding claim is
      correct but peripheral to what PcrB does.
    action: KEEP_AS_NON_CORE
    reason: The UniRule claim is confirmed functionally rather than only by rule. Activity is
      abolished by EDTA and by omission of MgCl2, so the divalent metal is required for catalysis,
      and the HAMAP rule places two Mg2+ ligands in the TIM-barrel active site. Cofactor binding is
      a real molecular function of the protein but is a mechanistic accessory to the transferase
      activity, not the function PcrB is selected for, so it is retained as non-core rather than as
      a core function. The whole GGGPS family carries the same term, which is consistent with a
      shared catalytic requirement.
    supported_by:
    - reference_id: PMID:23322418
      supporting_text: No product was found, indicating that Mg2+ is likely essential for catalysis.
      reference_section_type: RESULTS
