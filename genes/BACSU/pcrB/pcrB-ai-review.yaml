- term:
    id: GO:0008611
    label: ether lipid biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:21761520
  qualifier: involved_in
  review:
    summary: Proposed new annotation. PcrB itself forms the ether linkage between the isoprenoid
      chain and glycerol, which is the one thing the glycerophospholipid terms do not say.
    action: NEW
    reason: Added beside the glycerophospholipid rows rather than replacing them, because the two
      terms are independent and both true; GO:0008611 is not an ancestor or descendant of
      GO:0046474, its parents being lipid biosynthetic process, ether lipid metabolic process and
      glycerol ether biosynthetic process. Three checks were made before proposing it. First, which
      entity performs the step. PcrB catalyses the ether-bond formation itself, so it does the work
      the term names rather than supplying a substrate for it. Second, the definition, which reads
      that the lipid contains normally one lipid alcohol in ether linkage to one of the carbon
      atoms, normally C-1, of glycerol. In HepGP the ether is on C-3 of sn-glycerol 1-phosphate,
      but that carbon is the one distal to the phosphate, which is the same physical position as
      C-1 in the mirror-image sn-glycerol 3-phosphate numbering used for plasmanyl lipids; the
      number differs only because sn numbering is fixed by backbone stereochemistry. The two hedged
      "normally" clauses are there for exactly this variation, so the definition fits, and no new
      term is needed for ether-bond formation as such. Third, a comparator check in QuickGO, which
      is the one point of caution and is recorded honestly. GO:0008611 has about five thousand
      annotations and all are eukaryotic plasmalogen enzymes; it has none in Archaea or Bacteria,
      and every reviewed archaeal GGGPS, which forms the same ether bond on the same acceptor,
      carries only GO:0046474. That absence is explained rather than conventional, since those
      archaeal rows all come from the single HAMAP rule MF_00112, whose GO mapping offers no ether
      term, and no curator has yet reviewed a prokaryotic ether-lipid enzyme. This would therefore
      be the first prokaryotic use of the term, which is the annotation pattern this gene was
      selected to test.
    supported_by:
    - reference_id: PMID:24684232
      supporting_text: family enzymes catalyse the formation of an ether bond between
        glycerol-1-phosphate and polyprenyl diphosphates
      reference_section_type: ABSTRACT
    - reference_id: PMID:21761520
      supporting_text: An archaea-type ether lipid in bacteria
      reference_section_type: ABSTRACT
    - reference_id: file:BACSU/pcrB/pcrB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: step in the biosynthesis of archaea-type G1P-based membrane lipids found in
        Bacillales.
    - reference_id: file:BACSU/pcrB/pcrB-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: ether lipid being identified within the phylogenetic domain of the bacteria,
        was found to be subsequently dephosphorylated and acetylated in vivo.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:40626731
  qualifier: located_in
  review:
    summary: Proposed new annotation. The gene currently has no cellular component row at all,
      although the enzyme is soluble and its reaction runs in the cytoplasm.
    action: NEW
    reason: Inferred by the curator from three agreeing lines rather than from a localization assay.
      PcrB has no transmembrane segment or signal peptide and was crystallized as a soluble
      homodimer; both of its substrates are cytoplasmic metabolites, sn-glycerol 1-phosphate from
      the soluble dehydrogenase EgsA and heptaprenyl diphosphate from cytoplasmic isoprenoid
      synthesis; and the 2025 reconstitution paper places the carrier-synthesizing half of the
      pathway in the cytosol, with only the terminal acetyl transfer at the membrane. Every
      reviewed member of the GGGPS family carries the same term, so this is also the family
      convention. Cytoplasm rather than cytosol is used because B. subtilis is a monoderm with no
      measured sub-compartment resolution here.
    supported_by:
    - reference_id: PMID:40626731
      supporting_text: an acetylated heptaprenylglyceryl (Ac-HepG) carrier synthesized by PcrB/YvoF
        in the cytosol that is required for lipoprotein acetylation
      reference_section_type: ABSTRACT
    - reference_id: PMID:40626731
      supporting_text: which is subsequently loaded with acetyl units using acetyl-CoA (Ac-CoA) on
        the cytoplasmic side of the membrane
      reference_section_type: DISCUSSION
