    CC   -!- FUNCTION: Catalyzes hydrolytic cleavage of carbon-halogen bonds in
    CC       halogenated aliphatic compounds, leading to the formation of the
    CC       corresponding primary alcohols, halide ions and protons. Has a
    CC       broad substrate specificity, which includes terminally mono- and
    CC       di- chlorinated and brominated alkanes (up to C4 only). The
    CC       highest activity was found with 1,2-dichloroethane, 1,3-
    CC       dichloropropane, and 1,2-dibromoethane.
    CC   -!- CATALYTIC ACTIVITY: 1-haloalkane + H(2)O = a primary alcohol +
    CC       halide.
    CC   -!- CATALYTIC ACTIVITY: 1,2-dichloroethane + H(2)O = 2-chloroethanol +
    CC       hydrogen chloride.
    CC   -!- ENZYME REGULATION: Inhibited by thiol reagents such as p-
    CC       chloromercuribenzoate and iodoacetamide.
    CC   -!- BIOPHYSICOCHEMICAL PROPERTIES:
    CC       pH dependence:
    CC         Optimum pH is 8.2.;
    CC       Temperature dependence:
    CC         Optimum temperature is 37 degrees Celsius.;
    CC   -!- PATHWAY: Xenobiotic degradation; 1,2-dichloroethane degradation;
    CC       glycolate from 1,2-dichloroethane: step 1/4.
    CC   -!- SUBUNIT: Monomer.
    CC   -!- SIMILARITY: Belongs to the haloalkane dehalogenase family. Type 1
    CC       subfamily. {ECO:0000305}.
