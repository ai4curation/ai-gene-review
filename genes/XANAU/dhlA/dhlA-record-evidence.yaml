  comments:
  - texts:
    - value: Catalyzes hydrolytic cleavage of carbon-halogen bonds in halogenated aliphatic compounds, leading to
        the formation of the corresponding primary alcohols, halide ions and protons. Has a broad substrate specificity,
        which includes terminally mono- and di- chlorinated and brominated alkanes (up to C4 only). The highest
        activity was found with 1,2-dichloroethane, 1,3-dichloropropane, and 1,2-dibromoethane
    commentType: FUNCTION
  - commentType: CATALYTIC ACTIVITY
    reaction:
      name: 1-haloalkane + H2O = a halide anion + a primary alcohol + H(+)
      reactionCrossReferences:
