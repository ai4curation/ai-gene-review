id: Q9KZ33
gene_symbol: SCO7099
taxon:
  id: NCBITaxon:100226
  label: Streptomyces coelicolor A3(2)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SCO7099, an uncharacterised ECF sigma factor of
  Streptomyces coelicolor. The model identifies the protein class confidently and from
  two directions: the GO channel returns DNA-templated transcription initiation, sigma
  factor activity and bacterial-type RNA polymerase core enzyme binding in its top three,
  and the free-text Function channel returns SwissProt ECF sigma-factor descriptions
  including the anti-sigma-factor sequestration mechanism. ProtNLM2 predicted a single
  term for this protein (DNA-templated transcription initiation), which the ARGO-ProtNLM-50
  evaluation flagged as an artefact of closure-based scoring rather than a model error -
  the same caveat applies to ProTrek's rank-1 call here. Nothing retrieved addresses the
  open questions for this entry (regulon, inducing signal, anti-sigma partner).
  Assessment: 1 correct novel (COR), 2 correct not novel (CNN).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/STRCO/Q9KZ33/Q9KZ33-uniprot.txt
  - genes/STRCO/Q9KZ33/Q9KZ33-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0006352
      label: DNA-templated transcription initiation
    predicted_term_type: GO_BP
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 12.76) and the same term ProtNLM2 predicted. It is
        biologically correct for a sigma factor and is scored NO_OVERLAP only because there
        is no is_a/part_of path between GOA's regulation of DNA-templated transcription
        initiation (which sits under regulation of biological process) and this term; the
        two are biologically coupled but ontologically disjoint. Treated as correct but not
        novel, since GOA already asserts the coupled regulatory term. This is a limitation
        of closure-based scoring, not a ProTrek error.
      supported_by:
        - reference_id: file:STRCO/Q9KZ33/Q9KZ33-deep-research-falcon.md
          supporting_text: >-
            sigma factors serve as dissociable regulatory subunits of bacterial RNA polymerase...the
            sigma factor binds specifically to promoter elements
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0016987
      label: sigma factor activity
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 2 (score 12.69), an exact match to the GO_Central IBA annotation and to this
        review's core molecular function. Correct but already annotated. Worth noting that
        the molecular function is recovered at rank 2 rather than rank 1: the process term
        outranks it, which is the general pattern seen across this benchmark.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0001000
      label: bacterial-type RNA polymerase core enzyme binding
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 3 (score 11.99) and absent from GOA. Binding the RNA polymerase core enzyme is
        the defining physical interaction of a sigma factor and follows directly from the
        sigma2/sigma4 domain architecture this entry carries; it is a reasonable, specific
        addition that the existing IEA/IBA pipeline did not emit. Scored COR as a correct
        novel call, with the caveat that it is an inference from family membership rather
        than evidence about SCO7099 itself, which has no experimental characterisation.
      supported_by:
        - reference_id: file:STRCO/Q9KZ33/Q9KZ33-deep-research-falcon.md
          supporting_text: >-
            sigma factors serve as dissociable regulatory subunits of bacterial RNA polymerase...the
            sigma factor binds specifically to promoter elements
