suggested_questions:
  - question: >-
      Does SCO7099 belong to group ECF41 (or a subgroup of it) in the current
      ECF classification, and which ECF41-specific promoter motif would it
      recognise?
    experts: []
  - question: >-
      Is the failure to recover SCO7099 overexpression transformants due to
      toxicity from unregulated sigma activity, or a technical artifact?
    experts: []
suggested_experiments:
  - description: >-
      Express SCO7099 from a tightly inducible promoter (e.g. tipA) at
      titrated levels, with and without its C-terminal extension, and profile
      transcription by RNA-seq; map transcription start sites of induced
      genes.
    hypothesis: >-
      SCO7099 directs RNA polymerase to a small set of promoters sharing an
      ECF41-type motif, and truncating the C-terminal extension changes its
      activity as for other ECF41 sigma factors.
  - description: >-
      ChIP-seq of epitope-tagged SCO7099 expressed from its native locus
      under a range of stress and developmental conditions.
    hypothesis: >-
      SCO7099 binds a defined set of promoters with a characteristic ECF
      -35/-10 motif.
