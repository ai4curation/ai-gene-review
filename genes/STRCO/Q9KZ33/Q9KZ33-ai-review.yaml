product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:100226
  label: Streptomyces coelicolor A3(2)
description: >-
  SCO7099 (Q9KZ33) is a 300-residue extracytoplasmic function (ECF, group 4)
  RNA polymerase sigma factor of Streptomyces coelicolor A3(2). Its N-terminal
  half carries the sigma2 and sigma4 regions that, in ECF sigma factors, bind
  the -10 and -35 promoter elements and recruit core RNA polymerase to start
  transcription; its C-terminal ~130 residues form an NTF2-like (SnoaL-type)
  extension. This architecture, and its PANTHER subfamily placement together
  with Mycobacterium tuberculosis SigI (an ECF41 sigma factor), mark it as a
  probable member of group ECF41, whose members have no separate anti-sigma
  factor and instead use the fused C-terminal extension to regulate sigma
  activity. The protein is expected to act in the cytoplasm as the
  promoter-specificity subunit of RNA polymerase holoenzyme. Its promoter
  motif, target genes, activating signal and physiological role are unknown;
  the only direct experimental observation is that a constitutive
  overexpression construct could not be introduced into S. coelicolor.
