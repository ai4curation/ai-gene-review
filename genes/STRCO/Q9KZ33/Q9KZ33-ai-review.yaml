- id: PMID:22950025
  title: Extracytoplasmic function σ factors of the widely distributed group ECF41 contain
    a fused regulatory domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defines group ECF41 (sigma2/sigma4 plus a large C-terminal extension,
      no separate anti-sigma factor), shows the extension is needed for
      activity in B. licheniformis and R. sphaeroides members, and notes that
      Streptomyces genomes carry multiple ECF41 copies. Does not name SCO7099
      in the main text; group assignment of Q9KZ33 is inferred from its
      architecture and PANTHER placement.
  findings:
    - statement: >-
        ECF41 sigma factors carry a C-terminal extension required for sigma
        activity and lack separate anti-sigma factors.
      supporting_text: >-
        They lack obvious anti-σ factors that typically control activity of
        other ECF σ factors
    - statement: Streptomyces genomes encode several ECF41 sigma factors.
      supporting_text: >-
        Especially the genus Streptomyces contains large numbers of ECF41 σ
        factors with at least four copies per genome
- id: PMID:26249679
  title: Crystallographic studies of the extracytoplasmic function σ factor σ(J) from
    Mycobacterium tuberculosis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Crystallisation of M. tuberculosis SigJ (the PAINT seed, subfamily
      SF36) and description of the conserved C-terminal SnoaL_2 extension in
      SigG, SigI and SigJ. Context for the family, not evidence about
      Q9KZ33's targets.
  findings:
    - statement: >-
        M. tuberculosis SigI and SigJ are ECF sigma factors without an
        associated anti-sigma factor, carrying a conserved C-terminal
        extension.
      supporting_text: >-
        Among ECF σ factors, σ C , σ G , σ I and σ J are not associated with
        an anti-σ factor.
