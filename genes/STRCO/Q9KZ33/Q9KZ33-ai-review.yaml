- term:
    id: GO:2000142
    label: regulation of DNA-templated transcription initiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      Inter-ontology inference (GO_REF:0000108) from sigma factor activity. A
      sigma factor determines which promoters core RNA polymerase initiates
      from, so it directly takes part in regulating DNA-templated
      transcription initiation; this is the process-level counterpart of the
      core molecular function, not a downstream effect.
    action: ACCEPT
    reason: >-
      Follows directly from the accepted sigma factor activity. The term is
      as specific as the evidence allows: no regulon, inducing signal or
      physiological process is known for SCO7099, so no more specific process
      term (e.g. a particular stress response) can be justified.
    supported_by:
      - reference_id: PMID:26249679
        supporting_text: >-
          σ factors play a prominent role in transcription initiation as they
          govern both promoter recognition and promoter melting.
