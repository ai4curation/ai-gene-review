    label: sigma factor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Sigma factor activity propagated by PAINT from node PTN001249270 of
      PANTHER family PTHR30173 (ECF sigma factors), seeded by M. tuberculosis
      SigJ (L0TCG5). The seed sits in subfamily SF36 while Q9KZ33 sits in
      SF43 (with M. tuberculosis SigI), so the IBD node lies above both
      subfamilies; sigma factor activity is the family-wide function of
      intact ECF sigma factors and is not a subfamily-specific trait, so the
      different subfamily does not weaken the transfer. Q9KZ33 retains the
      ECF sigma2/sigma4 architecture (IPR052704, IPR013324, SSF88659) and a
      full-length ECF41-type C-terminal extension shared with both SigI and
      SigJ.
    action: ACCEPT
    reason: >-
      The target is inside the clade that inherited the function at
      PTN001249270, and its domain architecture is intact over the regions
      required for promoter recognition and RNA polymerase binding. There is
      no evidence of loss or divergence of sigma activity. For ECF41 sigma
      factors the C-terminal extension is itself required for activity
      (Wecke et al. 2012), and Q9KZ33 has this extension. No experimental
      data exist for Q9KZ33 itself, but the phylogenetic and structural case
      is strong; this is the core molecular function.
