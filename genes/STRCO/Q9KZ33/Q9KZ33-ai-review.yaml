core_functions:
  - description: >-
      ECF (probable group ECF41) sigma factor: the promoter-specificity
      subunit that binds core RNA polymerase and directs transcription
      initiation at a currently unidentified set of promoters, with activity
      presumably controlled by its fused C-terminal NTF2-like extension
      rather than by a separate anti-sigma factor.
