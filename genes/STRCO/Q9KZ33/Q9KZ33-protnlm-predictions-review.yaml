id: Q9KZ33
gene_symbol: Q9KZ33
taxon:
  id: NCBITaxon:100226
  label: Streptomyces coelicolor A3(2)
status: COMPLETE
description: >-
  SCO7099 (Q9KZ33) is an ECF (probable group ECF41) RNA polymerase sigma factor whose sigma factor
  activity is supported by a PAINT IBA and an intact sigma2/sigma4 plus C-terminal-extension
  architecture. The single ProtNLM2 GO prediction, DNA-templated transcription initiation, is a correct
  process inference from that function and is not already carried by the gene in GOA.
source_documents:
  - genes/STRCO/Q9KZ33/Q9KZ33-uniprot.txt
  - genes/STRCO/Q9KZ33/Q9KZ33-goa.tsv
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006352
      label: DNA-templated transcription initiation
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Q9KZ33 carries the ECF sigma-70 domain signature (IPR052704) and the sigma3/sigma4 superfamily, and
        its gene review accepts the PAINT IBA for sigma factor activity (node PTN001249270 of PTHR30173,
        with the target in subfamily SF43 alongside M. tuberculosis ECF41 SigI). Sigma factors do part of
        the work of initiation itself: they recognise the promoter and melt it as the initiating subunit of
        RNA polymerase holoenzyme, so participation in DNA-templated transcription initiation follows from
        the supported activity by family-wide transfer; the PTHR30173 family review grants this term
        family-wide. The gene's GOA set has sigma factor activity and regulation of DNA-templated
        transcription initiation (GO:2000142); OLS4 shows GO:2000142 is not an is_a/part_of descendant of
        GO:0006352, so the prediction is neither present nor less specific than an existing annotation. No
        experiment on SCO7099 addresses its transcriptional role (a PubMed search for SCO7099 returns no
        dedicated study), so this rests on the phylogenetic and domain inference rather than direct
        observation.
      supported_by:
        - reference_id: file:STRCO/Q9KZ33/Q9KZ33-uniprot.txt
          supporting_text: >-
            DR   InterPro; IPR052704; ECF_Sigma-70_Domain.
        - reference_id: file:STRCO/Q9KZ33/Q9KZ33-uniprot.txt
          supporting_text: >-
            DR   PANTHER; PTHR30173:SF43; ECF RNA POLYMERASE SIGMA FACTOR SIGI-RELATED; 1.
        - reference_id: PMID:26249679
          supporting_text: >-
            σ factors play a prominent role in transcription initiation as they govern both promoter
            recognition and promoter melting.
        - reference_id: PMID:32180013
          supporting_text: Mtb-SigI belongs to the ECF41 family of sigma factor
