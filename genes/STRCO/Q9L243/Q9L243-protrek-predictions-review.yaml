id: Q9L243
gene_symbol: SCO2678
taxon:
  id: NCBITaxon:100226
  label: Streptomyces coelicolor A3(2)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SCO2678, an uncharacterised HAD-superfamily
  protein of Streptomyces coelicolor predicted to be a secreted phosphatase with
  5'-nucleotidase activity. The protein has no GOA annotations, so every call is novel by
  construction. ProTrek recovers the review's core molecular function exactly at rank 2
  (5'-nucleotidase activity), and its whole top five stays inside HAD phosphatase
  chemistry, which is the correct fold-level assignment. The weakness is over-commitment
  at rank 1: it names one specific HAD substrate (the riboflavin-biosynthesis
  intermediate 5-amino-6-(5-phosphoribitylamino)uracil) where the evidence supports only
  a promiscuous phosphomonoesterase. ProtNLM2 made no GO prediction for this protein, so
  ProTrek adds annotation coverage a name-only model does not.
  Assessment: 1 correct novel (COR), 1 less precise (LSP), 1 uncertain (UNC).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/STRCO/Q9L243/Q9L243-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0043726
      label: 5-amino-6-(5-phosphoribitylamino)uracil phosphatase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Top-ranked hit (score 14.93). This is a real HAD-family activity in riboflavin
        biosynthesis, so the fold-level inference is right, but naming this particular
        substrate for SCO2678 goes far beyond what is known: no biochemical assay exists for
        this protein, its eggNOG assignment (COG1877) points to 5'-nucleotidase/phosphodiesterase
        chemistry, and HAD enzymes are notoriously promiscuous. Cannot be refuted either -
        S. coelicolor does make riboflavin - so it is recorded as uncertain. It illustrates
        a systematic property of retrieval-based prediction: the index contains substrate-specific
        GO terms and no generic hedge, so the model must commit to a substrate even when the
        evidence only supports a family.
      supported_by:
        - reference_id: file:STRCO/Q9L243/Q9L243-deep-research-falcon.md
          supporting_text: >-
            SCO2678 most likely functions as a phosphatase or phosphomonoesterase, catalyzing
            the hydrolysis of phosphate ester bonds
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0008253
      label: 5'-nucleotidase activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 14.73) and an exact match to this review's core molecular function,
        which was reached independently from the HAD_SAK_2 domain (PF18143), COG1877
        membership and the precedent of the characterised S. coelicolor extracellular
        5'-nucleotidase SCO4152. The protein has no GOA annotations at all, so this is a
        genuinely novel and correct call - the best single result ProTrek produces on an
        unannotated protein in this benchmark.
      supported_by:
        - reference_id: file:STRCO/Q9L243/Q9L243-deep-research-falcon.md
          supporting_text: >-
            SCO2678 most likely functions as a phosphatase or phosphomonoesterase, catalyzing
            the hydrolysis of phosphate ester bonds
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047405
      label: pyrimidine-5'-nucleotide nucleosidase activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Rank 3 (score 13.78). A nucleosidase cleaves the N-glycosidic bond rather than the
        phosphoester bond, so strictly this names the wrong chemistry for a HAD enzyme.
        It is scored LSP rather than NPI because it lands on the right substrate class
        (pyrimidine 5'-nucleotides) and the right pathway role - nucleotide salvage /
        phosphate scavenging - as the rank-2 call, and so points a curator to the same
        biology at lower precision. Ranks 4 and 5 (pseudouridine 5'-phosphatase, acid
        phosphatase) continue the same theme.
      supported_by:
        - reference_id: PMID:12000953
          supporting_text: >-
            The 7,825 predicted genes include more than 20 clusters coding for known or predicted
            secondary metabolites
