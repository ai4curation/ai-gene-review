  title: OpenScientist deoxyribonucleotide-catabolism audit for SCO2678
  publication_type: DEEP_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Focused audit of the ProtNLM 5-prime-nucleotidase/deoxyribonucleotide-catabolism
      chain. Supports generic HAD phosphatase activity, rejects deoxyribonucleotide
      catabolism as unsupported, treats 5-prime-nucleotidase specificity as too narrow,
      and refutes the secreted-protein localization.
suggested_questions:
- question: What is the precise physiological substrate of SCO2678, and does it prefer
    phosphorylated RNA repair intermediates, free nucleotides, sugar phosphates, or another
    phosphomonoester class?
- question: Is SCO2678 expressed with RNA-repair genes or under stresses that generate
    damaged RNA termini, consistent with its PF18143/HAD_SAK_2 assignment?
- question: Does any biochemical or genetic evidence connect SCO2678 to deoxyribonucleotide
    catabolism, or was the ProtNLM2 pathway prediction an over-specific transfer from a
    generic HAD phosphatase label?
suggested_experiments:
- hypothesis: SCO2678 is a HAD-family phosphatase whose preferred substrate is not yet
    known.
  description: >-
    Heterologously express and purify SCO2678, then perform substrate profiling using
    a panel of 5'-nucleotides (AMP, GMP, CMP, UMP, dAMP, etc.), sugar phosphates
    (glucose-6-phosphate, fructose-6-phosphate), phosphorylated oligonucleotide ends,
    and generic phosphatase substrates (pNPP). Determine kinetic parameters (Km, kcat)
    for preferred substrates and test divalent metal ion dependence (Mg2+, Mn2+, Co2+)
    consistent with the HAD mechanism.
  experiment_type: biochemical assay
- hypothesis: SCO2678 is a soluble cytoplasmic HAD phosphatase rather than a secreted
    phosphatase.
  description: >-
    Epitope-tag SCO2678 at its native locus and fractionate S. coelicolor cells and
    culture supernatants under phosphate-replete and phosphate-limited conditions.
    Immunoblot or targeted mass spectrometry should detect whether the protein remains
    cytoplasmic, as predicted by its missing signal peptide and N-terminal catalytic
    Asp13.
  experiment_type: localization
