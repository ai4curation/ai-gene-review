  review:
    summary: >-
      SCO2678 has a HAD_SAK_2 domain and the conserved HAD catalytic motifs needed
      for Mg2+-dependent phosphomonoester hydrolysis, but substrate specificity is
      not established.
    action: NEW
    reason: >-
      The focused deoxyribonucleotide-catabolism audit found all four canonical
      HAD motifs in SCO2678 and supported a low-specificity phosphatase molecular
      function. It also found that the PF18143/HAD_SAK_2 assignment does not establish
      5-prime-nucleotidase activity or dNMP catabolism. The older Falcon report's
      broad HAD-superfamily call is retained as corroborating context, but its
      secreted 5-prime-nucleotidase model has been superseded; this new generic
      phosphatase row therefore cites the focused audit as its originating evidence.
    supported_by:
    - reference_id: file:STRCO/Q9L243/Q9L243-hypotheses/prediction-deoxyribonucleotide-catabolism/openscientist.md
      supporting_text: >-
        All four canonical HAD catalytic motifs are present and correctly spaced
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: ISM
  original_reference_id: file:STRCO/Q9L243/Q9L243-hypotheses/prediction-deoxyribonucleotide-catabolism/openscientist.md
  review:
    summary: >-
      SCO2678 lacks a signal peptide or transmembrane segment and retains catalytic
      HAD Motif I at Asp13 near the N-terminus, arguing against a cleaved signal
      peptide and supporting a soluble cytoplasmic enzyme.
    action: NEW
    reason: >-
      The focused localization analysis refutes the "Secreted protein" name as
      a generic TrEMBL label: the 171-residue enzyme has no hydrophobic signal
      peptide, no transmembrane segment, and an N-terminal catalytic aspartate
      incompatible with signal-peptide cleavage.
      This replaces the Falcon report's extracellular-region proposal because the
      focused sequence audit directly evaluated the full 171-aa target sequence
      and found no export signal.
    supported_by:
    - reference_id: file:STRCO/Q9L243/Q9L243-hypotheses/prediction-deoxyribonucleotide-catabolism/openscientist.md
      supporting_text: >-
        SCO2678 is therefore a **soluble cytoplasmic HAD hydrolase**, not a secreted
        or membrane ecto-nucleotidase.
