    Mg2+-dependent catalytic motifs. Its PF18143/HAD_SAK_2 assignment is associated
    with RNA-repair phosphoesterases and does not resolve the true physiological
    substrate. No direct assay establishes whether SCO2678 acts on free nucleotides,
    sugar phosphates, phosphorylated nucleic acid ends, or another phosphomonoester.
