  label: Streptomyces coelicolor (strain ATCC BAA-471 / A3(2) / M145)
description: >-
  SCO2678 (Q9L243) is a 171-amino-acid protein from Streptomyces coelicolor A3(2)
  containing a HAD_SAK_2 domain (PF18143), placing it in the haloacid dehalogenase
  (HAD) superfamily. The conserved DxD, Thr/Ser, Lys, and DD motifs support a
  generic Mg2+-dependent phosphatase/phosphomonoesterase function. The inspected
  evidence does not establish the physiological substrate, 5-prime-nucleotidase
  specificity, deoxyribonucleotide catabolism, or secretion. The cached UniProt
  record still assigns eggNOG COG1877, but no COG1877 family gloss was verified
  from that cross-reference; the PF18143 assignment is a better fit to an
  RNA-repair-associated HAD lineage than to characterized dNMP-acting
  nucleotidases. SCO2678 has no direct biochemical characterization or genetic
  study, and its cellular role remains unresolved.
