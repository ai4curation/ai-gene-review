  label: Streptomyces coelicolor A3(2)
description: >-
  SCO2678 (Q9L243) is a 171-amino-acid protein of Streptomyces coelicolor A3(2)
  consisting almost entirely of a haloacid dehalogenase (HAD)-superfamily domain of
  the HAD_SAK_2 family (Pfam PF18143), a family first described in large eukaryotic
  multidomain proteins predicted to act in RNA repair. It retains all four HAD core
  catalytic motifs (Asp13/Asp15, Thr67, Lys106, Asp123/Asp124), so it is predicted to
  be a Mg2+-dependent phosphatase that hydrolyses a phosphomonoester through an
  aspartyl-phosphate intermediate. It has no signal peptide, Tat signal or lipobox and
  is predicted to be a soluble cytoplasmic protein. Its substrate, pathway and
  physiological role are unknown; no member of the HAD_SAK_2 family has been
  characterized experimentally and SCO2678 is not encoded next to RNA-repair genes.
existing_annotations:
- term:
    id: GO:0016791
    label: phosphatase activity
  evidence_type: ISM
  original_reference_id: file:STRCO/Q9L243/Q9L243-bioinformatics/RESULTS-rereview.md
  review:
    summary: >-
      Proposed from sequence: the HAD_SAK_2 domain spans residues 9-155 and all four
      HAD catalytic motifs are conserved, supporting a generic Mg2+-dependent
      phosphomonoesterase activity of unknown substrate.
    action: NEW
    reason: >-
      GOA has no annotations for this protein. Re-reviewed independently: the
      PF18143 family is described as HAD-domain phosphoesterases removing phosphate
      groups, and the target keeps the motif I nucleophile/acid pair, motif II Thr,
      motif III Lys and motif IV Asp-Asp metal ligands. The generic term is as specific
      as the evidence allows. No characterized PF18143 member, PANTHER family or PAINT
      node exists, so no substrate-specific activity (5'-nucleotidase, RNA 3'-phosphatase
      or 2',3'-cyclic phosphatase, trehalose-6-phosphate phosphatase from the eggNOG
      COG1877 grouping) is transferred.
    supported_by:
    - reference_id: file:STRCO/Q9L243/Q9L243-bioinformatics/RESULTS-rereview.md
      supporting_text: All four core HAD motifs are present in the expected N-to-C order
        with typical spacing
    - reference_id: file:STRCO/Q9L243/Q9L243-bioinformatics/RESULTS-rereview.md
      supporting_text: Family of HAD domain phophoesterases observed in large eukaryotic
        proteins with predicted role in RNA repair
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: ISM
  original_reference_id: file:STRCO/Q9L243/Q9L243-bioinformatics/RESULTS-rereview.md
  review:
    summary: >-
      No signal peptide, twin-arginine signal, lipobox or transmembrane segment; the
      catalytic motif I lies within the N-terminal region a signal peptide would occupy.
    action: NEW
    reason: >-
      A sequence-based localization inference for a small soluble enzyme. It contradicts
      the machine-generated UniProt name "Secreted protein" (ProtNLM, ECO:0008006), which
      is not evidence. The inference rests on absence of export signals and is not
      experimentally verified.
    supported_by:
    - reference_id: file:STRCO/Q9L243/Q9L243-bioinformatics/RESULTS-rereview.md
      supporting_text: 'Conclusion: no evidence for export; the "Secreted protein" name
        in UniProt is a machine-generated label (ECO:0008006) and is not supported by
        the sequence.'
