            GO:0008253 (5′-nucleotidase activity, MF): treat as unproven / too specific.
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0009264
      label: deoxyribonucleotide catabolic process
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      error_type: FREQUENCY_BIAS
      confidence_score: 0
      summary: >-
        A HAD-family domain can motivate a phosphatase hypothesis but does not identify deoxyribonucleotides
        as physiological substrates. The focused report found that SCO2678 belongs to the PF18143 RNA-repair-associated
        HAD family rather than characterized dNMP-acting nucleotidase subfamilies, has no nucleotide-catabolism
        genomic context, and lacks target biochemical or pathway evidence. ProtNLM2 overextended a generic
        HAD phosphatase signal to a 5-prime-nucleotidase label and then to a pathway-level deoxyribonucleotide
        catabolic-process term. The predicted process is absent from the cached annotations and is too specific
        for the inspected evidence.
      supported_by:
        - reference_id: file:STRCO/Q9L243/Q9L243-uniprot.txt
          supporting_text: >-
            ID   Q9L243_STRCO            Unreviewed;       171 AA. ... DR   Pfam; PF18143; HAD_SAK_2;
            1.
