id: Q9L243
gene_symbol: SCO2678
taxon:
  id: NCBITaxon:100226
  label: Streptomyces coelicolor A3(2)
status: COMPLETE
description: >-
  ProtNLM2 emitted two GO predictions for SCO2678, a 171-residue stand-alone HAD_SAK_2 (Pfam PF18143)
  protein with no GOA annotations. The intact HAD catalytic motifs support only a generic phosphatase
  activity of unknown substrate; no characterized PF18143 member, PANTHER family or PAINT node exists,
  and no publication on SCO2678 was found in PubMed. Both the 5'-nucleotidase activity and the
  deoxyribonucleotide catabolic process predictions are therefore unsupported but not refuted (UNC).
source_documents:
  - genes/STRCO/Q9L243/Q9L243-uniprot.txt
  - genes/STRCO/Q9L243/Q9L243-goa.tsv
  - genes/STRCO/Q9L243/Q9L243-bioinformatics/RESULTS-rereview.md
  - genes/STRCO/Q9L243/Q9L243-hypotheses/prediction-deoxyribonucleotide-catabolism/openscientist.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0008253
      label: 5'-nucleotidase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        GOA has no annotations for SCO2678, so the term is novel. The sole family signature is Pfam
        PF18143 (HAD_SAK_2), and a reproducible motif scan finds all four HAD catalytic motifs, which
        supports a generic Mg2+-dependent phosphatase activity (the gene review's only core function).
        PF18143 was defined from eukaryotic RNA-repair-associated proteins, no member has been
        characterized, and the family is not one of the HAD subfamilies containing experimentally
        characterized 5'-nucleotidases, so there is no justified phylogenetic transfer of nucleotide
        substrate specificity. No PubMed record describes SCO2678 or a characterized ortholog. The
        prediction is a plausible refinement of the supported phosphatase activity, but no evidence
        establishes or excludes nucleotides as substrates, so it remains uncertain.
      supported_by:
        - reference_id: file:STRCO/Q9L243/Q9L243-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            InterPro returns a single signature for Q9L243: Pfam PF18143 (HAD_SAK_2, "HAD domain in
            Swiss Army Knife RNA repair proteins"), residues 9-155. ... no member is experimentally
            characterized. ... All four core HAD motifs are present in the expected N-to-C order with
            typical spacing
        - reference_id: file:STRCO/Q9L243/Q9L243-hypotheses/prediction-deoxyribonucleotide-catabolism/openscientist.md
          supporting_text: >-
            PF18143 is the RNA-repair "Swiss Army Knife" HAD family, not a characterized 5′-nucleotidase
            subfamily; no nucleotidase signature
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0009264
      label: deoxyribonucleotide catabolic process
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        GOA has no annotations for SCO2678, so the term is novel. Participation in deoxyribonucleotide
        catabolism would require dNMP hydrolysis, which is itself unsupported: the protein is a
        stand-alone HAD_SAK_2 (PF18143) domain with no characterized family member and shares no Pfam
        family with HAD enzymes shown to dephosphorylate dNMPs. Its KEGG neighbourhood contains no
        nucleotide-catabolism genes (and no RNA-repair genes either), and PubMed has no study of
        SCO2678. The OpenScientist analysis reaches the same evidential picture. Absence of supporting
        evidence does not refute the process, because the substrate of this HAD phosphatase is unknown,
        so the prediction is uncertain rather than incorrect.
      supported_by:
        - reference_id: file:STRCO/Q9L243/Q9L243-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            no member is experimentally characterized. ... or other RNA-repair gene is adjacent
        - reference_id: file:STRCO/Q9L243/Q9L243-hypotheses/prediction-deoxyribonucleotide-catabolism/openscientist.md
          supporting_text: >-
            SCO2678 shares **no Pfam family** with any enzyme experimentally shown to dephosphorylate
            dNMPs ... There is **no experimental characterization** of SCO2678 at all, and its genomic
            neighborhood contains no nucleotide-catabolism cluster.
