    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0008253
      label: 5'-nucleotidase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The 171-residue target has a Pfam HAD_SAK_2 assignment and intact HAD-family phosphohydrolase
        motifs, but the focused report found no specific nucleotidase signature or characterized dNMP-acting
        subfamily relationship. The fold supports a low-specificity phosphatase hypothesis; it does not
        establish that the substrate is a nucleotide or that phosphate is removed at its 5-prime position.
        The inspected sources contain no target substrate assay or well-resolved experimentally characterized
        ortholog establishing that specificity. The predicted activity is absent from the cached annotations
        and remains uncertain.
