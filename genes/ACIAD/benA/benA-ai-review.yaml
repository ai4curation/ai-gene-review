      - InterPro:IPR015881
    review:
      summary: >-
        InterPro-based iron ion binding reflects the mononuclear non-heme
        Fe(II) of the catalytic domain, where O2 is activated for
        cis-dihydroxylation. Purified ADP1 oxygenase contains a full complement
        of mononuclear iron.
      action: ACCEPT
      reason: >-
        The catalytic mononuclear iron is intrinsic to the alpha subunit's
        dioxygenase chemistry and is measured directly in the purified ADP1
        oxygenase; the cofactor-binding term is correct and appropriately
        specific for a mononuclear iron site.
      supported_by:
