suggested_questions:
  - question: >-
      Which alpha-subunit residues lining the substrate pocket account for the
      narrower benzoate specificity of ADP1 BenAB compared with the TOL-plasmid
      toluate dioxygenase XylXY?
suggested_experiments:
  - description: >-
      Determine a crystal structure of ADP1 BenAB with benzoate bound and test
      pocket-residue swaps with XylX to map specificity determinants.
    experiment_type: structural biology and site-directed mutagenesis
