  - term:
      id: GO:0043639
      label: benzoate catabolic process
    evidence_type: IDA
    original_reference_id: PMID:2824437
    qualifier: involved_in
    review:
      summary: >-
        Proposed process annotation. BenABC performs the first committed step
        of benzoate degradation in ADP1 (benzoate to the cis-diol, then BenD to
        catechol), and the process term is absent from GOA for this entry.
      action: NEW
      reason: >-
        BenA catalyses a step of benzoate catabolism itself, so it does part of
        the work of the process rather than being merely required for it. The
        cloned benABCD genes reconstitute benzoate-to-catechol conversion in
        E. coli (direct assay of the conversion by the heterologously
        expressed ADP1 enzymes).
      supported_by:
        - reference_id: PMID:2824437
          supporting_text: >-
            The catabolic genes necessary for the conversion of benzoate to
            catechol have been cloned from Acinetobacter calcoaceticus into
            Escherichia coli.
