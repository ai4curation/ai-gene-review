taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  benA encodes the alpha (large) subunit of the oxygenase component of
  benzoate 1,2-dioxygenase in Acinetobacter baylyi ADP1. BenA carries an
  N-terminal Rieske [2Fe-2S] domain and a C-terminal catalytic domain with a
  mononuclear non-heme iron site; together with the BenB beta subunit it forms
  the (alpha-beta)n oxygenase, which receives electrons from the BenC reductase
  and dihydroxylates benzoate to the cis-dihydrodiol
  1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate. BenD then converts this diol
  to catechol, which is degraded by the beta-ketoadipate pathway. The purified,
  reconstituted ADP1 enzyme prefers benzoate over substituted benzoates, and
  subunit-swap experiments place the principal substrate-specificity
  determinants in the alpha subunit.
existing_annotations:
