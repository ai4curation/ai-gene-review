          supporting_text: >-
            The values indicate that each ISP contained full complements of FeS
            and mononuclear iron prosthetic groups
        - reference_id: PMID:1885518
          supporting_text: >-
            Conserved histidines and tyrosines may coordinate a mononuclear
            Fe(II) ion.
  - term:
      id: GO:0018623
      label: benzoate 1,2-dioxygenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - RHEA:12633
      - EC:1.14.12.10
    review:
      summary: >-
        Core catalytic activity. BenA is the catalytic subunit of benzoate
        1,2-dioxygenase; benABC expressed in E. coli converts benzoate to the
        cis-diol, and the purified, reconstituted ADP1 enzyme dihydroxylates
        benzoate with highest apparent specificity among tested benzoates.
      action: ACCEPT
      reason: >-
        The alpha subunit holds the Rieske cluster, the active-site iron and the
        substrate pocket, so it is the subunit that enables the dioxygenase
        reaction (with BenB and BenC contributing). Experimental work on the
        ADP1 enzyme supports the EC-derived assignment.
      supported_by:
        - reference_id: PMID:2824437
          supporting_text: >-
            enabling the conversion of benzoate to a cis-diol,
            2-hydro-1,2-dihydroxybenzoate, at a rate comparable to that of fully
            induced A. calcoaceticus cultures
        - reference_id: PMID:12949084
          supporting_text: >-
            Reconstituted BADO ADP1 utilized four of the seven tested benzoates
            in the following order of apparent specificity: benzoate >
            3-methylbenzoate > 3-chlorobenzoate > 2-methylbenzoate.
        - reference_id: PMID:12949084
          supporting_text: >-
            these results support the notion that the α subunit harbors the
            principal determinants of specificity in ring-hydroxylating
            dioxygenases
