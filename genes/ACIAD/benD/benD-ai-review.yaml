suggested_questions:
  - question: >-
      Which residues distinguish BenD from its closest SDR relatives and
      confer specificity for the carboxylated cis-diol rather than
      non-carboxylated arene cis-dihydrodiols?
suggested_experiments:
  - description: >-
      Purify BenD to homogeneity and determine steady-state kinetics with the
      benzoate cis-diol and methyl-substituted analogues, alongside a crystal
      structure with NAD+.
    experiment_type: enzymology and structural biology
