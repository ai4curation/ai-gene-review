id: P07772
gene_symbol: benD
product_type: PROTEIN
aliases:
  - ACIAD1439
status: COMPLETE
taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  benD encodes the NAD+-dependent cis-diol dehydrogenase of the benzoate
  degradation pathway in Acinetobacter baylyi ADP1. BenD, a homodimeric
  member of the short-chain dehydrogenase/reductase (SDR) superfamily,
  oxidatively decarboxylates the BenABC product
  1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate (2-hydro-1,2-dihydroxybenzoate)
  to catechol, CO2 and NADH. Catechol then enters the beta-ketoadipate
  pathway. Expression of benD in Escherichia coli is sufficient for
  conversion of the cis-diol to catechol.
existing_annotations:
  - term:
      id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or
        NADP as acceptor
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN002460465
    review:
      summary: >-
        Generic SDR oxidoreductase activity inherited from the broad PANTHER
        node. Correct, but BenD's specific activity is known and already
        annotated.
      action: MODIFY
      reason: >-
        Correct but general; the supported, more specific descendant is
        1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate dehydrogenase activity
        (GO:0047116), which this entry already carries.
      proposed_replacement_terms:
        - id: GO:0047116
          label: 1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate dehydrogenase activity
      supported_by:
        - reference_id: PMID:2824437
          supporting_text: >-
            A cis-diol dehydrogenase, the product of the A. calcoaceticus benD
            gene, when present in E. coli enables this organism to convert the
            cis-diol intermediate to catechol.
  - term:
      id: GO:0030497
      label: fatty acid elongation
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN002460465
    review:
      summary: >-
        TreeGrafter propagation from the large SDR family that includes FabG
        3-oxoacyl-ACP reductases. BenD is a dedicated aromatic cis-diol
        dehydrogenase with no known role in fatty acid synthesis.
      action: REMOVE
      reason: >-
        Over-propagation across a functionally diverse SDR superfamily; BenD's
        substrate and pathway are established experimentally and include no
        acyl-ACP intermediate.
      supported_by:
        - reference_id: PMID:1740120
          supporting_text: >-
            They are also similar to other proteins of at least 20 different
            functions, which are members of the short-chain alcohol
            dehydrogenase family.
        - reference_id: PMID:2824437
          supporting_text: >-
            A cis-diol dehydrogenase, the product of the A. calcoaceticus benD
            gene, when present in E. coli enables this organism to convert the
            cis-diol intermediate to catechol.
  - term:
      id: GO:0047116
      label: 1,6-dihydroxycyclohexa-2,4-diene-1-carboxylate dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - RHEA:11560
      - EC:1.3.1.25
    review:
      summary: >-
        Core activity. BenD converts the benzoate cis-diol to catechol in an
        NAD+-dependent reaction; the partially purified enzyme is a dimer of
        identical subunits.
      action: ACCEPT
      reason: >-
        Directly supported by expression of ADP1 benD in E. coli and partial
        purification of the enzyme.
      supported_by:
        - reference_id: PMID:2824437
          supporting_text: >-
            A cis-diol dehydrogenase, the product of the A. calcoaceticus benD
            gene, when present in E. coli enables this organism to convert the
            cis-diol intermediate to catechol.
        - reference_id: PMID:1740120
          supporting_text: >-
            is subsequently transformed to a catechol by an NAD(+)-dependent
            cis-diol dehydrogenase
  - term:
      id: GO:0043639
      label: benzoate catabolic process
    evidence_type: IDA
    original_reference_id: PMID:2824437
    qualifier: involved_in
    review:
      summary: >-
        Proposed process annotation. BenD catalyses the second step of
        benzoate-to-catechol conversion; the process term is absent from GOA
        for this entry.
      action: NEW
      reason: >-
        BenD catalyses a step of benzoate catabolism itself, shown by the
        heterologous reconstitution of the benABCD route in E. coli.
      supported_by:
        - reference_id: PMID:2824437
          supporting_text: >-
            The catabolic genes necessary for the conversion of benzoate to
            catechol have been cloned from Acinetobacter calcoaceticus into
            Escherichia coli.
