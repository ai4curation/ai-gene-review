taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  CatC of Acinetobacter baylyi ADP1 is muconolactone Delta-isomerase (EC
  5.3.3.4), a small (96-residue) cytoplasmic enzyme of the dimeric
  alpha/beta-barrel fold that forms a homodecamer. It isomerizes
  (4S)-muconolactone, the product of CatB, to beta-ketoadipate enol-lactone,
  the third and last reaction of the catechol branch of the beta-ketoadipate
  pathway before the branch converges with the protocatechuate branch at the
  enol-lactone hydrolase step. catC is the second gene of the
  muconate-inducible catBCIJFD operon of the ADP1 ben-cat cluster.
