suggested_questions:
- question: >-
    Does ADP1 CatC turn over substituted (methyl- or fluoro-) muconolactones
    produced by CatB from substituted catechols, or do these accumulate as
    dead-end products?
  experts:
  - beta-ketoadipate pathway enzymologists
suggested_experiments:
- experiment_type: in vitro enzyme assay
  description: >-
    Purify recombinant ADP1 CatC and measure kinetics with (4S)-muconolactone
    and with the methyl- and fluoro-muconolactones formed by CatB.
