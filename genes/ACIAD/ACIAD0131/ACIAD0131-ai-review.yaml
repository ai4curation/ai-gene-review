        ChEBI:CHEBI:16810, ChEBI:CHEBI:57783, ChEBI:CHEBI:58136,
        ChEBI:CHEBI:58349; EC=1.2.1.26;
        Evidence={ECO:0000269|PubMed:18364348};
    - reference_id: PMID:18364348
      supporting_text: >-
        We describe here the kinetic characterization of D-glucarate
        dehydratase, d-5-keto-4-deoxyglucarate dehydratase, and of cooperative
        alpha-ketoglutarate semialdehyde dehydrogenase.
- term:
    id: GO:0042838
    label: D-glucarate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: KgsD catalyses the terminal step of D-glucarate degradation in ADP1.
    action: ACCEPT
    reason: >-
      The UniPathway mapping agrees with the experimental work. A genome-wide
      deletion screen for growth on D-glucarate found the pathway genes, and
      the pathway was then reconstituted in vitro with the purified enzymes,
      including this dehydrogenase. KgsD carries out the last chemical step,
      so it participates in the process.
    supported_by:
    - reference_id: PMID:18364348
      supporting_text: >-
        High
        throughput profiling for growth on a minimal medium containing D-glucarate as
        the only carbon source for approximately 2450 mutants led to the identification
        of the genes involved in D-glucarate degradation.
    - reference_id: PMID:18364348
      supporting_text: >-
        Protein purification after
        recombinant production in E. coli allowed us to reconstitute the enzymatic
        pathway in vitro.
    - reference_id: file:ACIAD/ACIAD0131/ACIAD0131-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        PATHWAY: Carbohydrate acid metabolism; D-glucarate degradation.
        {ECO:0000269|PubMed:18364348}.
