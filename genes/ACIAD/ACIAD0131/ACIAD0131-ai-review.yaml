suggested_questions:
- question: >-
    Does ADP1 KgsD use NAD+ and NADP+ comparably in vivo? This decides whether
    the NADP+-specific GO:0047533 or a cofactor-neutral term best describes
    it.
- question: >-
    Does KgsD also serve hydroxyproline or L-arabinose catabolism in
    A. baylyi, whose routes converge on the same 2,5-dioxopentanoate
    intermediate?
suggested_experiments:
- description: >-
    Measure kcat/Km of purified KgsD with NAD+ and NADP+, and test whether a
    kgsD deletion strain grows on trans-4-hydroxy-L-proline, to check that
    the enzyme can stand in for the hydroxyproline-pathway terminal
    dehydrogenase.
  experiment_type: enzyme kinetics and deletion-strain growth phenotyping
