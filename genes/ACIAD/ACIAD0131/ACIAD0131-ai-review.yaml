    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The NADP+-coupled 2,5-dioxovalerate dehydrogenase reaction is the curated, experimentally supported activity.
    action: ACCEPT
    reason: >-
      Electronic row, but it matches the UniProt catalytic activity that cites
      the biochemical characterization of the purified ADP1 enzyme
      (ECO:0000269, PMID:18364348). UniProt's FUNCTION text says NAD(P)+, so
      NAD+ may also be used; GO has no cofactor-neutral term for this
      substrate (see proposed_new_terms in the PP_1256 review). The NADP+
      term is kept as the most specific supported activity.
    supported_by:
    - reference_id: file:ACIAD/ACIAD0131/ACIAD0131-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
