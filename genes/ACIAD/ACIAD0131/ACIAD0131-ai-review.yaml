taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  ACIAD0131 is the alpha-ketoglutaric semialdehyde dehydrogenase (KGSADH, 2,5-dioxovalerate dehydrogenase,
  EC 1.2.1.26) of Acinetobacter baylyi ADP1, a member of the aldehyde dehydrogenase superfamily (KGSADH
  subgroup, InterPro IPR044151). It oxidizes 2,5-dioxopentanoate, formed by KDG dehydratase ACIAD0130,
  to 2-oxoglutarate with NAD(P)+, the terminal step of the oxidative D-glucarate degradation route that
  delivers aldarate carbon to the tricarboxylic acid cycle. The enzyme was purified and kinetically characterized
  during in vitro reconstitution of the ADP1 pathway, which described it as a cooperative enzyme.
