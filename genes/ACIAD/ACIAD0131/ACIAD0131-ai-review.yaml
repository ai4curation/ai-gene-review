gene_symbol: ACIAD0131
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  ACIAD0131 (KgsD) is the alpha-ketoglutaric semialdehyde dehydrogenase of
  Acinetobacter baylyi ADP1. It is an aldehyde dehydrogenase-family enzyme of
  the KGSADH subgroup that oxidizes 2,5-dioxopentanoate (alpha-ketoglutaric
  semialdehyde) to 2-oxoglutarate with NAD(P)+. This is the last step of the
  alternative D-glucarate degradation pathway, which ADP1 needs to grow on
  D-glucarate. The same reaction is the last step of bacterial
  hydroxyproline catabolism in other species. The purified recombinant enzyme
  was characterized kinetically and behaves cooperatively.
