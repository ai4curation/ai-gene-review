suggested_questions:
- question: >-
    Does ADP1 rely solely on pcaF for 3-oxoadipyl-CoA thiolysis during growth
    on benzoate, or does the catechol-branch catF copy carry the flux?
suggested_experiments:
- description: >-
    Purify recombinant ADP1 PcaF and measure kinetic parameters with
    3-oxoadipyl-CoA versus acetoacetyl-CoA and longer 3-oxoacyl-CoAs.
  hypothesis: >-
    PcaF shows strong preference for 3-oxoadipyl-CoA, consistent with a
    pathway-specialized degradative thiolase.
