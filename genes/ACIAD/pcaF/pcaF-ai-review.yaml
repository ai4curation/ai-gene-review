- term:
    id: GO:0019619
    label: 3,4-dihydroxybenzoate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Correct. pcaF lies in the pca operon that encodes the six enzymes
      converting protocatechuate (3,4-dihydroxybenzoate) to succinate and
      acetyl-CoA, and PcaF catalyzes the last of these reactions.
    action: ACCEPT
    reason: >-
      PcaF directly performs the final step of protocatechuate catabolism in
      ADP1. The term is not exclusive (the same enzyme chemistry also serves
      the catechol branch), but it is accurate for the pca-encoded enzyme.
    supported_by:
    - reference_id: PMID:8063101
      supporting_text: >-
        The six enzymes required for catabolism of protocatechuate to succinate
        and acetylCoA are encoded by the pca genes in the Gram-bacterium,
        Acinetobacter calcoaceticus.
    - reference_id: PMID:8063101
      supporting_text: >-
        all of the pca structural genes are tightly grouped in the order
        pcaIJFBDKCHG within a single operon
- term:
    id: GO:0033812
    label: 3-oxoadipyl-CoA thiolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Correct core activity. Swiss-Prot records curated thiolytic cleavage of
      beta-ketoadipyl-CoA for this protein-level (N-terminally sequenced)
      entry, and the orthologous CatF of Pseudomonas sp. B13 shows
      3-oxoadipyl-CoA thiolase activity when the gene is expressed.
    action: ACCEPT
    reason: >-
      The pathway-specific thiolase activity is the defining function of PcaF
      and is consistent with the operon context and with experimental
      characterization of close orthologs.
    supported_by:
    - reference_id: file:ACIAD/pcaF/pcaF-uniprot.txt
