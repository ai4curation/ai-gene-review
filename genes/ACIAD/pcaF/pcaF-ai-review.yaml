taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  pcaF encodes beta-ketoadipyl-CoA (3-oxoadipyl-CoA) thiolase (EC 2.3.1.174)
  of Acinetobacter baylyi ADP1, a degradative thiolase of the thiolase family
  that cleaves 3-oxoadipyl-CoA with CoA to succinyl-CoA and acetyl-CoA. This is
  the final reaction of the beta-ketoadipate pathway, which funnels carbon from
  protocatechuate- and catechol-derived aromatic compounds into the
  tricarboxylic acid cycle. pcaF is the third gene of the pcaIJFBDKCHG operon,
  directly downstream of the pcaIJ transferase genes that make its substrate.
