id: O24840
gene_symbol: vanB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  VanB (ACIAD0979) is the reductase component of the two-component vanillate
  O-demethylase VanAB of Acinetobacter baylyi ADP1. It belongs to the
  phthalate dioxygenase reductase (PDR/VanB) family, with an N-terminal
  flavin-binding domain, an NAD-binding region and a C-terminal plant-type
  [2Fe-2S] ferredoxin domain, and passes electrons from NADH to the Rieske
  oxygenase VanA, which converts vanillate to protocatechuate and
  formaldehyde. Mutants blocked in vanAB cannot catabolize vanillate or
  ferulate.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017927
  - PANTHER:PTN000783574
  review:
    summary: VanB is an NADH-dependent oxidoreductase, but this parent term hides its specific reductase chemistry.
    action: MODIFY
    reason: >-
      Correct but general. VanB has the PDR-type flavin and NAD domains plus a
      C-terminal [2Fe-2S] ferredoxin domain, the architecture of reductases that
      pass electrons from NADH through flavin and their [2Fe-2S] centre to the
      Rieske cluster of the oxygenase. GO represents this reaction class as
      ferredoxin-NAD+ reductase activity (GO:0008860), an is_a descendant, used
      here as for KT2440 VanB and for BenC in the same PANTHER family, whose
      family review includes the VanB subfamily SF1 in the scope of GO:0008860
      (excluding only the SF7 flavin reductases).
    proposed_replacement_terms:
    - id: GO:0008860
      label: ferredoxin-NAD+ reductase activity
    supported_by:
    - reference_id: file:ACIAD/vanB/vanB-uniprot.txt
