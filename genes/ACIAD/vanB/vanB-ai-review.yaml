      supporting_text: 'FT   BINDING         107..220 FT                   /ligand="NAD(+)"'
    - reference_id: file:ACIAD/vanB/vanB-uniprot.txt
      record_section: ["DR:PRINTS"]
      supporting_text: 'DR   PRINTS; PR00409; PHDIOXRDTASE.'
