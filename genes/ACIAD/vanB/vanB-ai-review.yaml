- term:
    id: GO:0018489
    label: vanillate monooxygenase activity
  evidence_type: IC
  original_reference_id: PMID:10348863
  qualifier: contributes_to
  review:
    summary: VanB is the reductase half of the two-component vanillate O-demethylase.
    action: NEW
    reason: >-
      The demethylase is a VanA-VanB pair, and VanB supplies the electrons the
      oxygenase needs, so VanB contributes to, rather than enables on its own,
      vanillate monooxygenase activity. Mirrors the KT2440 VanB annotation.
    supported_by:
    - reference_id: PMID:10348863
      supporting_text: >-
        VanA and VanB form an oxygenative demethylase that converts vanillate to
        protocatechuate in microorganisms.
    - reference_id: file:ACIAD/vanB/vanB-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        SUBUNIT: This demethylase system consists of two proteins: an oxygenase
        and an oxygenase reductase.
- term:
    id: GO:0046191
    label: aerobic phenol-containing compound catabolic process
  evidence_type: IMP
  original_reference_id: PMID:10348863
  qualifier: involved_in
  review:
    summary: VanB supplies electrons for the O-demethylation step of aerobic vanillate catabolism in ADP1.
    action: NEW
    reason: >-
      As the electron-donating half of VanAB, VanB does part of the work of the
      O-demethylation step, and vanAB mutants fail to catabolize vanillate and
      ferulate. Same term as KT2440 VanB and ADP1 VanA. GO has no vanillate
      catabolic process term; the KT2440 VanB review proposes one
      (proposed_new_terms), which would replace this broader term.
    supported_by:
    - reference_id: PMID:10348863
      supporting_text: >-
        Genetic evidence supporting this conclusion was obtained by
        characterization of mutant Acinetobacter strains blocked in catabolism
        of both ferulate and vanillate.
