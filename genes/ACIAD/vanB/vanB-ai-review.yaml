suggested_questions:
- question: Does ADP1 VanB use FMN or FAD as its flavin cofactor, as the PDR family assignment by similarity predicts?
suggested_experiments:
- description: Purify VanB and identify its flavin by HPLC after release, and measure NADH-dependent reduction of VanA.
