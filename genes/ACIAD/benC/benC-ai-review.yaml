      label: ferredoxin-NAD+ reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - RHEA:16521
      - EC:1.18.1.3
    review:
      summary: >-
        BenC catalyses NADH-dependent reduction of [2Fe-2S] centres, the
        reductase chemistry represented by EC 1.18.1.3. The crystal structure
        shows FAD, NADH and iron-sulfur binding domains, and the purified
        enzyme is reduced by NADH.
      action: ACCEPT
      reason: >-
        Ferredoxin-NAD+ reductase activity is the closest available GO MF for
        the NADH-to-[2Fe-2S] electron transfer that BenC performs; the
        ferredoxin acceptor here is BenC's own fused ferredoxin domain and,
        downstream, the oxygenase Rieske cluster. The term is used consistently
        across reviewed BenC orthologs.
      supported_by:
        - reference_id: PMID:12051836
          supporting_text: >-
            Benzoate dioxygenase contains a reductase component, BenC, that is
            responsible for the two-electron transfer from NADH via FAD and an
            iron-sulfur cluster to the terminal oxygenase component.
        - reference_id: PMID:12949084
          supporting_text: >-
            Oxidized samples of RED could be reduced with a small molar excess
            of NADH
