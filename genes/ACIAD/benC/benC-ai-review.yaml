        label: benzoate catabolic process
    supported_by:
      - reference_id: PMID:12051836
        supporting_text: >-
          Benzoate dioxygenase contains a reductase component, BenC, that is
          responsible for the two-electron transfer from NADH via FAD and an
          iron-sulfur cluster to the terminal oxygenase component.
      - reference_id: PMID:9721284
        supporting_text: >-
          In Acinetobacter mutants, benC substituted for antC during growth on
          anthranilate, suggesting relatively broad substrate specificity of
          the BenC reductase, which transfers electrons from NADH to the
          terminal oxygenase.
suggested_questions:
  - question: >-
      Is GO:0008860 ferredoxin-NAD+ reductase activity the best GO
      representation for a fused ferredoxin-reductase that donates electrons
      directly to a Rieske oxygenase, or would a dedicated
      "Rieske-oxygenase reductase" activity term be more accurate?
suggested_experiments:
  - description: >-
      Measure BenC electron-transfer kinetics to BenAB versus AntAB by
      stopped-flow spectroscopy to quantify the in vivo partner promiscuity
      observed genetically.
    experiment_type: pre-steady-state kinetics
