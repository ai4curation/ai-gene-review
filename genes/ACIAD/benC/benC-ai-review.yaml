  - term:
      id: GO:0042203
      label: toluene catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000041
    qualifier: involved_in
    supporting_entities:
      - UniPathway:UPA00273
    review:
      summary: >-
        UniPathway mapping of the entry to toluene degradation, derived from the
        curated Swiss-Prot PATHWAY line on P07771. ADP1 BenC serves benzoate
        dioxygenase (and, in mutants, anthranilate dioxygenase); nothing links
        it to toluene catabolism.
      action: REMOVE
      reason: >-
        This review overrules a curated Swiss-Prot PATHWAY line: P07771 carries
        "PATHWAY: Xenobiotic degradation; toluene degradation.", which is the
        source of the UniPathway UPA00273 cross-reference in this row's
        supporting entities. The assignment is wrong for ADP1. BenC is the
        reductase of benzoate 1,2-dioxygenase, encoded in the benABCD locus,
        and the ADP1 benzoate dioxygenase it serves has a narrow substrate
        range with no detectable activity on 4-methylbenzoate. ADP1 does not
        degrade toluene; the label most likely reaches this entry by
        similarity to the TOL-plasmid XylZ reductase, whose toluate
        dioxygenase acts on methylbenzoates formed from toluene and xylenes by
        other enzymes. Removing an electronic pathway mapping that is
        demonstrably wrong for the organism is sanctioned; the underlying
        Swiss-Prot line is recorded as a source defect below.
      supported_by:
        - reference_id: PMID:12051836
          supporting_text: >-
            Benzoate dioxygenase contains a reductase component, BenC, that is
            responsible for the two-electron transfer from NADH via FAD and an
            iron-sulfur cluster to the terminal oxygenase component.
        - reference_id: PMID:12949084
          supporting_text: >-
            BADO displayed no detectable activity in the presence of either
            4-methylbenzoate, 2-chlorobenzoate, or 4-chlorobenzoate.
        - reference_id: file:ACIAD/benC/benC-uniprot.txt
          supporting_text: "PATHWAY: Xenobiotic degradation; toluene degradation."
      source_defects:
        - defect_type: WRONG_TERM
          resource: UNIPROT
          record: P07771
          slot: CC -!- PATHWAY
          requested_change: DELETE_VALUE
          asserted_value: "UniPathway:UPA00273"
          cause: OTHER
          confidence: PROBABLE
          explanation: >-
            P07771 carries the curated line "PATHWAY: Xenobiotic degradation;
            toluene degradation." BenC is the electron-transfer component of
            benzoate 1,2-dioxygenase, encoded in the ADP1 benABCD locus, and
            Acinetobacter baylyi ADP1 is not a toluene degrader; the benzoate
            dioxygenase BenC serves does not act on 4-methylbenzoate. The
            pathway line (and the UniPathway UPA00273 cross-reference and
            GO:0042203 annotation that follow from it) should be removed or
            replaced with benzoate degradation via hydroxylation, the pathway
            the sibling entries P07769, P07770 and P07772 already carry.
            Confidence is PROBABLE rather than CONFIRMED because the line's
            own evidence is not stated in the flat file, so the curator's
            original basis for it cannot be inspected here.
