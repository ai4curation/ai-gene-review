taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  benC encodes the reductase (electron-transfer) component of benzoate
  1,2-dioxygenase in Acinetobacter baylyi ADP1. BenC is a single polypeptide
  with three domains, each binding a redox cofactor: an N-terminal plant-type
  [2Fe-2S] ferredoxin domain, an FAD-binding domain and an NADH-binding domain.
  It transfers two electrons from NADH via FAD and the [2Fe-2S] cluster
  directly to the Rieske cluster of the BenAB terminal oxygenase, enabling
  dihydroxylation of benzoate to the cis-dihydrodiol on the route to catechol.
  BenC is relatively permissive in partner choice: it can substitute for the
  anthranilate dioxygenase reductase AntC in vivo, and it is interchangeable
  in vitro with the reductase of the TOL-plasmid toluate dioxygenase.
