      NADH-dependent reductase of benzoate 1,2-dioxygenase that transfers two
      electrons via FAD and a plant-type [2Fe-2S] cluster to the Rieske
      cluster of the BenAB oxygenase, contributing to benzoate
      dihydroxylation.
    molecular_function:
      id: GO:0008860
      label: ferredoxin-NAD+ reductase activity
    contributes_to_molecular_function:
      id: GO:0018623
      label: benzoate 1,2-dioxygenase activity
    directly_involved_in:
