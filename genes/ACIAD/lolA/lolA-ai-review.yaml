description: Periplasmic lipoprotein carrier of Acinetobacter baylyi ADP1. LolA binds the periplasmic
  domain of the homodimeric LolDF release machinery and accepts lipidated cargo for transport toward the
  outer membrane. One LolA molecule is bound to the LolDF dimer in the resolved complex.
