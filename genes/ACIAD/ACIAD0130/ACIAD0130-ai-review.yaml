  supporting_entities:
  - PANTHER:PTN001740851
  review:
    summary: TreeGrafter DapA activity is wrong for this KDGDH-subfamily member.
    action: REMOVE
    reason: >-
      GO:0008840 is the aldol condensation of pyruvate with L-aspartate-4-semialdehyde in lysine/diaminopimelate
      biosynthesis. This protein is a characterized KDGDH whose experimentally supported reaction dehydrates
      and decarboxylates an aldarate catabolite. The TreeGrafter transfer from the DapA-family node over-propagates
      the ancestral activity into the divergent KDGDH subfamily (PTHR12128:SF19, HAMAP MF_00694). Removal
      is consistent with the KT2440 ortholog PP_3599.
    supported_by:
    - reference_id: file:ACIAD/ACIAD0130/ACIAD0130-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00694; KDGDH; 1.
    - reference_id: file:ACIAD/ACIAD0130/ACIAD0130-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=5-dehydro-4-deoxy-D-glucarate + H(+) = 2,5-dioxopentanoate +
    source_defects:
    - defect_type: WRONG_TERM
      resource: PANTHER
      requested_change: CHECK
      asserted_value: GO:0008840
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        TreeGrafter propagates 4-hydroxy-tetrahydrodipicolinate synthase activity (GO:0008840) from a
        PTHR12128 ancestral node (PTN001740851) to KDGDH-subfamily members (PTHR12128:SF19), including
        experimentally characterized A. baylyi ACIAD0130 (Q6FFQ1, PMID:18364348). The KDGDH clade should
        be excluded from the DapA activity, as PAINT already does with a NOT at PTN001740926.
