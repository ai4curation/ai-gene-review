taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  ACIAD0130 is the 5-dehydro-4-deoxyglucarate dehydratase (KDGDH, EC 4.2.1.41) of Acinetobacter baylyi
  ADP1. It belongs to the DapA (dihydrodipicolinate synthase) family of class I aldolase-fold enzymes
  but has diverged from 4-hydroxy-tetrahydrodipicolinate synthase chemistry. It dehydrates and decarboxylates
  5-dehydro-4-deoxy-D-glucarate to 2,5-dioxopentanoate (alpha-ketoglutarate semialdehyde), the second
  step of the oxidative D-glucarate degradation route. Its product is oxidized to 2-oxoglutarate by ACIAD0131.
  The enzyme was kinetically characterized after recombinant production, during reconstitution of the
  ADP1 pathway.
