proposed_new_terms:
- proposed_name: outer-membrane lipoprotein insertion activity
  proposed_definition: Accepting a mature lipoprotein from a periplasmic carrier and promoting incorporation
    of its lipid anchor into the bacterial outer membrane.
  justification: The terminal membrane-insertion step is distinct from soluble carriage and inner-membrane
    release. Use the existing LolB insertion concept rather than an ill-fitting carrier or release molecular
    function; target activity is a LolB-specific ortholog inference.
  proposed_parent:
    id: GO:0140318
    label: protein transporter activity
  supported_by: *id001
core_functions:
- description: Inferred acceptance of lipoproteins from LolA and insertion into the outer membrane, supported
    by LolB-specific domain membership and E. coli positive transfer experiments.
  proposed_molecular_function: outer-membrane lipoprotein insertion activity
  directly_involved_in:
  - id: GO:0042953
    label: lipoprotein transport
  locations:
