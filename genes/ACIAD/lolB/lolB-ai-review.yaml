    label: cell outer membrane
  supported_by: *id001
suggested_questions:
- question: Does purified ADP1 LolB accept cargo from its cognate LolA and promote insertion into outer-membrane-like
    vesicles?
suggested_experiments:
- description: Reconstitute matched ADP1 LolDF, LolA and LolB with a chemically defined panel of lipoprotein
    substrates and membrane compartments to separate release, carrier handover and terminal insertion.
  experiment_type: defined-substrate lipoprotein transfer and membrane insertion
