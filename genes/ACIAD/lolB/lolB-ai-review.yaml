  label: Acinetobacter baylyi ADP1
description: Predicted lipid-anchored outer-membrane LolB receptor of Acinetobacter baylyi ADP1. Its LolB-specific
  family assignment supports acceptance of lipoprotein cargo from LolA and insertion of the lipid anchor
  into the outer membrane. This terminal delivery role is inferred from ortholog experiments.
