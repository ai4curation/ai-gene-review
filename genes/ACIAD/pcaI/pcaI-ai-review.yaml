suggested_questions:
- question: >-
    Do the near-identical pcaI and catI loci contribute equally to transferase
    levels during growth on benzoate versus 4-hydroxybenzoate, given that they
    sit in differently regulated cat and pca operons?
suggested_experiments:
- description: >-
    Delete pcaI and catI singly and together in ADP1 and measure
    beta-ketoadipate:succinyl-CoA transferase activity and growth on benzoate
    and 4-hydroxybenzoate.
  hypothesis: >-
    Either locus suffices for growth on its cognate aromatic substrate, and the
    double mutant cannot grow on either.
