      The catechol-branch catIJF genes encode isofunctional
      beta-ketoadipate-pathway proteins and exchange sequence with pcaIJF,
      explaining why catI and pcaI share one UniProt entry.
    supporting_text: >-
      the catIJF region, known to exchange genetic information with the pcaIJF
