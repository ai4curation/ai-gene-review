status: COMPLETE
taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  pcaI encodes subunit A of the heteromeric beta-ketoadipate:succinyl-CoA
  transferase (3-oxoadipate CoA-transferase, EC 2.8.3.6) of Acinetobacter
  baylyi ADP1. With subunit B (PcaJ) it forms an alpha2beta2 enzyme that
  transfers CoA from succinyl-CoA to 3-oxoadipate, giving 3-oxoadipyl-CoA and
  succinate, the first of the two reactions of the shared lower
  beta-ketoadipate pathway that converts aromatic-derived 3-oxoadipate to
  acetyl-CoA and succinyl-CoA. pcaI is the first gene of the pcaIJFBDKCHG
  operon of the protocatechuate branch; the catechol-branch catI gene in the
  ben-cat cluster encodes a near-identical, isofunctional protein, and UniProt
  merges both loci (pcaI/ACIAD1704 and catI/ACIAD1448) into this entry.
