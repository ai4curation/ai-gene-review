suggested_questions:
  - question: >-
      Does ADP1 BenB influence the regioselectivity of benzoate analogue
      dihydroxylation in the same way that it altered 2-methylbenzoate
      regioselectivity when paired with the toluate dioxygenase alpha subunit?
suggested_experiments:
  - description: >-
      Map the BenA-BenB interface by targeted mutagenesis of BenB and measure
      kcat, Km and O2 coupling of the reconstituted enzyme with benzoate and
      substituted benzoates.
    experiment_type: site-directed mutagenesis and enzyme kinetics
