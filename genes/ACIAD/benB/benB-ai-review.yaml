core_functions:
  - description: >-
      Non-catalytic beta subunit of the BenAB oxygenase of benzoate
      1,2-dioxygenase; contributes to the structural integrity of the active
      site and modulates substrate specificity and coupling of benzoate
      dihydroxylation.
    contributes_to_molecular_function:
      id: GO:0018623
      label: benzoate 1,2-dioxygenase activity
    directly_involved_in:
