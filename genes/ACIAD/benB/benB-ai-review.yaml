status: COMPLETE
taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  benB encodes the beta (small) subunit of the oxygenase component of
  benzoate 1,2-dioxygenase in Acinetobacter baylyi ADP1. BenB carries no
  redox centre; it pairs with the catalytic BenA alpha subunit to form the
  (alpha-beta)n oxygenase that, supplied with electrons by the BenC
  reductase, dihydroxylates benzoate to the cis-dihydrodiol that BenD converts
  to catechol. Subunit-swap experiments with the related toluate dioxygenase
  show that the beta subunit modulates the apparent specificity, regioselectivity
  and O2 coupling of the oxygenase, although the alpha subunit carries the
  principal specificity determinants.
existing_annotations:
  - term:
      id: GO:0018623
      label: benzoate 1,2-dioxygenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - RHEA:12633
      - EC:1.14.12.10
    review:
      summary: >-
        BenB is a structural/modulatory subunit of the benzoate 1,2-dioxygenase
        oxygenase. The activity term is correct for the complex BenB belongs
        to, but the subunit contributes to rather than independently enables
        it: the active-site iron and substrate pocket are in BenA.
      action: ACCEPT
      reason: >-
        The term is the right activity, and hybrid-oxygenase experiments show
        that the beta subunit contributes significantly to the enzyme's
        reactivity. The EC-mapping pipeline assigns enables to every subunit
        that carries the EC number; for a non-catalytic subunit the GO relation
        should be contributes_to, which is how the core function is recorded
        below.
      supported_by:
        - reference_id: PMID:12949084
          supporting_text: >-
            However, they also demonstrate that the β subunit contributes
            significantly to the enzyme's function.
        - reference_id: PMID:12949084
          supporting_text: >-
            the β subunit probably contributes to the structural integrity and
            function of the active site
      source_defects:
        - defect_type: WRONG_QUALIFIER
          resource: GOA_EBI
          slot: Qualifier
          requested_change: REPOINT
          asserted_value: enables
          corrected_value: contributes_to
          cause: OTHER
          confidence: CONFIRMED
          explanation: >-
            The row is generated by EC-number mapping, which assigns the
            holoenzyme's EC 1.14.12.10 to every subunit that carries it and so
            emits enables for each. BenB is a non-catalytic subunit: it has no
            Rieske cluster and no mononuclear iron, and the active site lies in
            the BenA alpha subunit. GO's contributes_to relation exists for
            exactly this case, a subunit of a complex that carries the complex's
            activity without enabling it alone.
  - term:
      id: GO:0019380
      label: 3-phenylpropionate catabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN002447682
    review:
      summary: >-
        TreeGrafter propagation of 3-phenylpropionate catabolism from the
        HcaF-type beta subunits that share the broad PANTHER ring-hydroxylating
        dioxygenase beta-subunit lineage. ADP1 BenB belongs to the
        benzoate-specific BenB family and its oxygenase acts on benzoates.
      action: REMOVE
      reason: >-
        No evidence links ADP1 BenB to 3-phenylpropionate or cinnamate
        degradation. The reconstituted ADP1 oxygenase was characterized with
        benzoates, and BenB is classified in the benzoate-specific family
        TIGR03232, which is narrower than the PANTHER node carrying the
        3-phenylpropionate term.
      supported_by:
        - reference_id: PMID:12949084
          supporting_text: >-
            Reconstituted BADO ADP1 utilized four of the seven tested benzoates
            in the following order of apparent specificity
        - reference_id: file:ACIAD/benB/benB-uniprot.txt
          supporting_text: NCBIfam; TIGR03232; benzo_1_2_benB; 1.
  - term:
      id: GO:0043639
      label: benzoate catabolic process
    evidence_type: IC
    original_reference_id: PMID:2824437
    qualifier: involved_in
    review:
      summary: >-
        Proposed process annotation. As a subunit of the oxygenase that
        catalyses the first step of benzoate degradation, BenB participates in
        benzoate catabolism; the term is absent from GOA for this entry.
      action: NEW
      reason: >-
        The cloned benABC genes reconstitute benzoate dihydroxylation in E.
        coli and BenB is a required, structurally integral part of the
        oxygenase that performs the step.
      supported_by:
        - reference_id: PMID:2824437
          supporting_text: >-
            The catabolic genes necessary for the conversion of benzoate to
            catechol have been cloned from Acinetobacter calcoaceticus into
            Escherichia coli.
        - reference_id: PMID:1885518
          supporting_text: >-
            The enzyme, benzoate 1,2-dioxygenase, is composed of a hydroxylase
            component, encoded by benAB, and an electron transfer component,
            encoded by benC.
