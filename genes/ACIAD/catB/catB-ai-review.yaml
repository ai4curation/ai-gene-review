  label: Acinetobacter baylyi ADP1
description: >-
  CatB of Acinetobacter baylyi ADP1 is cis,cis-muconate lactonizing enzyme I
  (muconate cycloisomerase, EC 5.5.1.1), a cytoplasmic member of the mandelate
  racemase/muconate lactonizing enzyme branch of the enolase superfamily. It
  cycloisomerizes cis,cis-muconate, the product of CatA ring cleavage, to
  (4S)-muconolactone in the catechol branch of the beta-ketoadipate pathway,
  and is encoded first in the muconate-inducible catBCIJFD operon of the ADP1
  ben-cat gene cluster. The purified enzyme accepts cis,cis-muconate and some
  fluoro- and methyl-substituted analogues but not chlorinated muconates, which
  distinguishes it from the chloromuconate cycloisomerases of chloroaromatic
  degradation pathways. Like other muconate cycloisomerases it is expected to
  use a divalent metal, Mn(2+), at the active site.
