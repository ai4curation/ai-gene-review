core_functions:
- description: >-
    Mn(2+)-dependent muconate cycloisomerase that converts cis,cis-muconate to
    (4S)-muconolactone in the catechol ortho-cleavage branch of the
    beta-ketoadipate pathway of Acinetobacter baylyi ADP1; it does not act on
    chlorinated muconates.
