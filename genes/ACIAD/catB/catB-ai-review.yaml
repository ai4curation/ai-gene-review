- term:
    id: GO:0018850
    label: chloromuconate cycloisomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013370
  review:
    summary: >-
      InterPro IPR013370 groups muconate and chloromuconate cycloisomerases,
      and its GO mapping assigns the chloro-specific activity to both. The ADP1
      enzyme was tested and does not transform chlorinated muconates with
      appreciable specificity; ADP1 also lacks a chlorocatechol pathway.
    action: REMOVE
    reason: >-
      Contradicted by direct substrate-specificity measurements on this
      enzyme. Chloromuconate cycloisomerase is a separate specialisation of
      modified ortho-cleavage pathways.
    supported_by:
    - reference_id: PMID:9726873
      supporting_text: >-
