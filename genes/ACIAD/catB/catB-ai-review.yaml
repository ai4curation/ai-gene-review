    label: manganese ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013370
  review:
    summary: >-
      Muconate cycloisomerases are divalent-metal enzymes; the P. putida
      ortholog has a single Mn(2+) site per subunit, and ADP1 CatB carries the
      mandelate racemase/muconate lactonizing enzyme signatures that include
      the metal-binding residues.
    action: ACCEPT
    reason: >-
      The metal is a catalytic cofactor of the cycloisomerization; support is
      by close homology to the experimentally characterised P. putida enzyme
      and by family signatures.
    supported_by:
    - reference_id: PMID:6652062
      supporting_text: >-
        The titration of enzyme freed of divalent metal ion with manganous ion,
        monitored by electron paramagnetic resonance spectroscopy and
        steady-state kinetic measurements, indicates a single binding site per
        subunit
    - reference_id: file:ACIAD/catB/catB-uniprot.txt
      supporting_text: >-
        DR   PROSITE; PS00909; MR_MLE_2; 1.
