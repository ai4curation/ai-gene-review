suggested_questions:
- question: >-
    Which active-site positions keep ADP1 CatB from the dehalogenating
    chloromuconate cycloisomerase chemistry, given that single substitutions in
    the P. putida enzyme raise 3-chloromuconate turnover?
  experts:
  - enolase-superfamily enzymologists
suggested_experiments:
- experiment_type: site-directed mutagenesis and kinetics
  description: >-
    Introduce the chloromuconate-cycloisomerase-type substitutions tested in P.
    putida CatB (e.g. the A271S and I54V equivalents) into ADP1 CatB and measure
    3-chloro- and 2,4-dichloromuconate turnover and product identity.
