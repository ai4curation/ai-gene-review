taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  CatA of Acinetobacter baylyi ADP1 (formerly Acinetobacter calcoaceticus
  ADP1/BD413) is catechol 1,2-dioxygenase I, a cytoplasmic non-heme Fe(III)
  intradiol ring-cleavage dioxygenase that opens the catechol ring between the
  two hydroxylated carbons to give cis,cis-muconate. This is the first reaction
  of the catechol branch of the beta-ketoadipate pathway, which ADP1 uses to
  grow on benzoate and other aromatics that are funnelled to catechol by the
  ben genes; the products of the downstream catBCIJFD operon then carry
  cis,cis-muconate to TCA-cycle intermediates. The enzyme is a homodimer with
  one Fe(III) per subunit; its crystal structure, alone and with catechol or
  4-methylcatechol bound, defined the 1,2-CTD fold, including an N-terminal
  helical-zipper dimerization domain that binds phospholipids. catA expression
  is induced by cis,cis-muconate through the LysR-type activators CatM and
  BenM.
