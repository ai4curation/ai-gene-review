- id: PMID:10801478
  title: The 1.8 A crystal structure of catechol 1,2-dioxygenase reveals a novel hydrophobic
    helical zipper as a subunit linker.
  findings:
  - statement: >-
      ADP1 catechol 1,2-dioxygenase is a homodimer with one catalytic non-heme
      Fe(III) per subunit; structures with catechol and 4-methylcatechol bound
      were solved.
    supporting_text: >-
      Catechol 1,2-dioxygenases (1, 2-CTDs) have a rudimentary design
      structure - a homodimer with one catalytic non-heme ferric ion per
      monomer
  - statement: >-
      An N-terminal helical-zipper domain forms the dimer axis and binds
      phospholipids in a hydrophobic tunnel.
    supporting_text: >-
      a novel 'helical zipper', consisting of five N-terminal helices from each
      subunit, forms the molecular dimer axis. Two phospholipids were
      unexpectedly found to bind within an 8 x 35 A hydrophobic tunnel along
      this axis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; PubMed abstract names Acinetobacter sp. ADP1 1,2-CTD
      and matches UniProt P07773 PDB entries 1DLM/1DLQ/1DLT/1DMH.
