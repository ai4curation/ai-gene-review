  - InterPro:IPR002629
  - EC:2.1.1.14
  review:
    summary: MesD supports homocysteine methylation, but the canonical folate-triglutamate donor is not
      supported.
    action: MODIFY
    reason: Native ADP1 methionine auxotrophy and the exact MesD identity support the final homocysteine-methylation
      role. The single catalytic barrel lacks the folate-binding domain, and MesD/MesX comparative genetics
      establishes MetF-independent activity. The original electronic EC/family mapping incorrectly fixes
      the methyl donor. S-methyltransferase activity retains the supported chemistry without inventing
      the physiological donor or treating S. koreensis complementation as a purified ADP1 assay.
    proposed_replacement_terms:
