taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: ACIAD3523 encodes MesD, a compact catalytic-barrel methionine synthase associated with the
  neighboring MesX protein. Native Acinetobacter baylyi ADP1 genetics supports methionine synthesis without
  added cobalamin. The protein lacks the N-terminal folate-binding barrel of canonical MetE. MesD-family
  evidence supports sulfur methyl transfer to homocysteine, with conserved catalytic zinc coordination;
  the physiological methyl donor and purified ADP1 reaction remain unidentified. Aerobic dependence was
  established in comparative MesD/MesX complementation rather than in an isolated ADP1 enzyme assay.
