- id: PMID:18319726
  title: A complete collection of single-gene deletion mutants of Acinetobacter baylyi ADP1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Native ADP1 deletion phenotypes are direct target evidence; the historical
      metE label does not establish a folate donor. No purified MesD activity is claimed.
  findings:
  - statement: Native ADP1 genetics distinguishes the methionine requirement of the gene then called metE
      from the dispensability of metH without coenzyme B12.
    supporting_text: the metE mutant, obtained in presence of coenzyme-B12, is auxotrophic for methionine.
- id: PMID:18840283
  title: Iterative reconstruction of a global metabolic model of Acinetobacter baylyi ADP1 using high-throughput
    growth phenotype and gene essentiality data.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. This confirms target locus and growth-condition scope, not purified
      substrate chemistry. The older canonical metE name is revised by the later MesD analysis.
  findings:
  - statement: The native model/phenotype study identifies ACIAD3523 as the B12-independent methionine-synthesis
      route and notes that B12 availability gates MetH rescue.
    supporting_text: Since coenzyme-B12 is neither synthesized by A. baylyi nor provided in the experimental
      media, the ΔACIAD3523 mutant was unable to use the MetH enzyme to synthesize methionine.
- id: PMID:33534785
  title: Four families of folate-independent methionine synthases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read, including ADP1 genetics discussion, S. koreensis fitness and heterologous
      complementation methods, functional-residue analysis and the speculative MesX discussion. Aerobic
      dependence and donor independence are comparative system evidence; the ADP1 physiological donor
      is not identified.
  findings:
  - statement: The exact ADP1 protein is designated MesD, a catalytic barrel lacking the canonical folate-binding
      domain; comparative S. koreensis assays establish aerobic MesD/MesX function without MetF.
    supporting_text: We will call these proteins MesD and MesX.
- id: file:ACIAD/ACIAD3523/ACIAD3523-uniprot.txt
  title: UniProtKB record for ACIAD3523
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Used for sequence/locus/domain identity. Submitter or ProtNLM protein names and ARBA-only
      cofactor predictions are not independent functional evidence.
  findings:
  - statement: The record maps the 344-residue ACIAD3523 protein to the MetE-like catalytic barrel PF01717
      and PTHR30519; that broad family assignment does not establish folate-dependent MetE chemistry.
core_functions:
- description: MesD-family sulfur methyl transfer to homocysteine during methionine synthesis, with MesX
    required physiologically; ADP1 chemistry is inferred from native genetics and catalytic architecture,
    and its methyl donor remains unknown.
