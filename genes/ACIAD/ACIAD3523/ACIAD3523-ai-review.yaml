- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002629
  review:
    summary: Conserved zinc coordination supports the MesD catalytic homocysteine-activation site.
    action: ACCEPT
    reason: The target is the experimentally identified MesD-family prototype, and the primary comparative
      analysis identifies conserved zinc-binding residues and a zinc-containing homolog structure. This
      supports a catalytic-site inference for ADP1, not a measurement of native metal occupancy. Zinc
      is integral to the inferred reaction, so uncertainty about direct occupancy is stated explicitly
      rather than encoded as a peripheral-function decision. The ARBA-only UniProt cofactor note is not
      the evidence used.
    supported_by:
    - &id004
      reference_id: PMID:33534785
      supporting_text: The zinc-binding residues are highly conserved in the MesA, MesB, and MesD families
        (Fig 4).
