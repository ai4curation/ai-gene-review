  label: Acinetobacter baylyi ADP1
description: ATPase subunit of the homodimeric LolDF lipoprotein-releasing complex in Acinetobacter baylyi
  ADP1. Two cytoplasmic LolD nucleotide-binding domains associate with the membrane LolF dimer and couple
  ATP binding and hydrolysis to lipoprotein release for transfer to LolA.
