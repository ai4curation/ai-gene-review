- id: file:ACIAD/lolD/lolD-uniprot.txt
  title: UniProt record for Acinetobacter baylyi ADP1 lolD (Q9EYM2)
  findings:
  - statement: The reviewed target LolD record belongs to PTHR42798, with SF2 recorded in the source;
      this differs from the PTHR24220 assignment of E. coli and KT2440 LolD.
    supporting_text: PANTHER; PTHR42798; LIPOPROTEIN-RELEASING SYSTEM ATP-BINDING PROTEIN LOLD; 1.
    record_section:
    - DR:PANTHER
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Target identity, LolD ATPase classification and peripheral membrane location are supported.
      The inherited HAMAP subunit sentence incorrectly describes separate LolC/LolE partners for this
      directly characterized homodimeric LolF assembly; the specific source defect is recorded below.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9EYM2
      slot: CC:SUBUNIT
      requested_change: CHECK
      asserted_value: The complex is composed of two ATP-binding proteins (LolD) and two transmembrane
        proteins (LolC and LolE).
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: PMID:42736309 directly isolates the native A. baylyi ADP1 transporter and resolves
        a LolD dimer associated with a LolF homodimer. The current genomic lolC/ACIAD2641 record A0ACM8PZZ0
        is sequence-identical to the structural Q9EYM3 LolF record. Replace the E. coli-like heteromeric
        partner description with the target-specific homodimeric LolDF architecture; preserve the correct
        ATPase assignment.
      supported_by:
      - reference_id: PMID:42736309
        supporting_text: To isolate the endogenous transporter in its native state, we engineered the
          A. baylyi ADP1 strain to carry a C-terminal 8×His-Flag tag on the chromosomal lolD gene together
          with a chloramphenicol-resistance cassette
      - reference_id: PMID:42736309
        supporting_text: The LolDF complex forms a homodimer that adopts a characteristic type VII ABC
          transporter architecture
      report_status: NOT_REPORTED
- id: PMID:42736309
  title: Mechanistic basis of LolDF-mediated lipoprotein transport in Acinetobacter.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: Purified target-derived LolDF transfers the defined lipoprotein BamE to target-derived
      LolA in detergent with ATP/Mg; this is a single-cycle carrier-handover assay.
    supporting_text: To verify ATP-driven lipoprotein transfer to LolA, we performed an in vitro single-cycle
      transport assay using detergent-purified A baylyi LolDF co-expressed with BamE and purified A baylyi
      LolA in the presence or absence of ATP and MgCl2.
  - statement: The native ADP1 release complex has homodimeric LolF membrane architecture.
    supporting_text: The LolDF complex forms a homodimer that adopts a characteristic type VII ABC transporter
      architecture
  - statement: ATPase-site mutations in ADP1 LolD impair hydrolysis and viability; reported positions
      have been checked against Q9EYM2.
    supporting_text: Alanine substitutions of catalytic residues (K48, S148, E172, H205) abolished ATPase
      activity and cell viability without affecting expression
  - statement: The charge-dependent sorting results are restricted to the tested BamE variants and do
      not define every ADP1 lipoprotein.
    supporting_text: However, the broader lipoprotein sorting rules governing the LolDF pathway in A.
      baylyi remain incompletely defined and will require investigation across additional substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached methods/results inspected. Chromosomally tagged native ADP1 LolDF isolation,
      native-host conditional silencing/complementation and detergent-purified BamE transfer are distinguished.
      A. baylyi LolA is produced recombinantly in E. coli. The deposited sequences resolve the LolF/lolC
      alias and LolD identity; LolA methods 29-231 versus deposited/native 29-230 is documented. Neither
      universal acyl-state tolerance nor a native full outer-membrane flux measurement is claimed.
