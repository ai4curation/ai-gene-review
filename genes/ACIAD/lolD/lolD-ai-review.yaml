  - InterPro:IPR017871
  review:
    action: ACCEPT
    summary: ATP binding is central to the LolD nucleotide-binding dimer.
    reason: The target AMP-PNP-bound structure resolves the nucleotide between LolD subunits; active-site
      mutations disrupt ATPase activity and function. ATP binding is a core substrate-binding activity,
      distinct in GO from the hydrolysis reaction.
    supported_by:
    - reference_id: PMID:42736309
      supporting_text: LolD exhibits the conserved ABC transporter nucleotide-binding domain (NBD) fold,
        consisting of a RecA-like and a helical subdomain for ATP binding
    - reference_id: PMID:42736309
      supporting_text: Alanine substitutions of catalytic residues (K48, S148, E172, H205) abolished ATPase
