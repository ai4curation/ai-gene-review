    summary: The target contributes to directly measured LolDF lipoprotein release.
    reason: 'Native complex isolation, structures and defined BamE transfer establish the target subunit
      contribution to recognition and release from the inner membrane. This reaction has the same functional
      scope as GO:0140306 despite the definition naming the canonical LolCDE architecture: the complete
      ADP1 machinery uses a LolF homodimer and LolD ATPase dimer. Contribution is grounded in positive
      subunit architecture and functional assays, not merely necessity or lack of an isolated-subunit
      assay. No existing seeded molecular function entails this specific release activity.'
