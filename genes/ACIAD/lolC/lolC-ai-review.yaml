- id: PMID:42736309
  title: Mechanistic basis of LolDF-mediated lipoprotein transport in Acinetobacter.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: Purified target-derived LolDF transfers the defined lipoprotein BamE to target-derived
      LolA in detergent with ATP/Mg; this is a single-cycle carrier-handover assay.
    supporting_text: To verify ATP-driven lipoprotein transfer to LolA, we performed an in vitro single-cycle
      transport assay using detergent-purified A baylyi LolDF co-expressed with BamE and purified A baylyi
      LolA in the presence or absence of ATP and MgCl2.
  - statement: The native ADP1 release complex has homodimeric LolF membrane architecture.
    supporting_text: The LolDF complex forms a homodimer that adopts a characteristic type VII ABC transporter
      architecture
  - statement: ATPase-site mutations in ADP1 LolD impair hydrolysis and viability; reported positions
      have been checked against Q9EYM2.
    supporting_text: Alanine substitutions of catalytic residues (K48, S148, E172, H205) abolished ATPase
      activity and cell viability without affecting expression
  - statement: The charge-dependent sorting results are restricted to the tested BamE variants and do
      not define every ADP1 lipoprotein.
    supporting_text: However, the broader lipoprotein sorting rules governing the LolDF pathway in A.
      baylyi remain incompletely defined and will require investigation across additional substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached methods/results inspected. Chromosomally tagged native ADP1 LolDF isolation,
      native-host conditional silencing/complementation and detergent-purified BamE transfer are distinguished.
      A. baylyi LolA is produced recombinantly in E. coli. The deposited sequences resolve the LolF/lolC
      alias and LolD identity; LolA methods 29-231 versus deposited/native 29-230 is documented. Neither
      universal acyl-state tolerance nor a native full outer-membrane flux measurement is claimed.
- id: file:analysis/module_audits/bacterial_lol_lipoprotein_trafficking/aciad-consultation/identity-notes.md
