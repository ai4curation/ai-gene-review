  label: Acinetobacter baylyi ADP1
description: Homodimeric membrane component of the lipoprotein-releasing LolDF complex of Acinetobacter
  baylyi ADP1, called LolF in biochemical studies and encoded by the genome locus named lolC. LolF binds
  lipidated cargo, recruits LolA and couples conformational changes driven by the LolD ATPase to cargo
  release from the inner membrane.
