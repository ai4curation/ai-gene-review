- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000497575
  review:
    summary: QueH binds an active-site [4Fe-4S] cluster through four mapped cysteines.
    action: ACCEPT
    reason: >-
      The cluster itself is well supported: the crystal structure of the
      Thermotoga maritima family member resolves it in the active site, and the
      six conserved cysteines of that structure are present here. The UniProt
      BINDING positions are misassigned, though. Q6FAK7 carries Cys22, Cys23,
      Cys101, Cys104, Cys184 and Cys186, reproducing the Thermotoga spacing
      (Cys9-Cys10, Cys87-X2-Cys90, Cys169-X-Cys171), so the cluster ligands
      here are Cys101, Cys104, Cys184 and Cys186, not the 22, 23, 101, 104 that
      the rule asserts; Cys22 and Cys23 correspond to the separate mononuclear
      metal site, whose Asp13 is replaced by a cysteine in some species, as
      Cys26 is here. Both misassignments are recorded as source defects below.
    supported_by:
    - reference_id: file:ACIAD/queH/queH-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: "/ligand=\"[4Fe-4S] cluster\""
    - reference_id: PMID:34652139
      supporting_text: >-
        The structure reveals an unusual active site architecture with a
        [4Fe-4S] metallocluster along with an adjacent coordinated iron metal.
    - reference_id: PMID:34652139
      supporting_text: >-
        Sequence analysis shows conservation of the six cysteine residues among
        QueH family members; corresponding to four cysteines coordinating to
        the [4Fe-4S] cluster, along with two others.
    - reference_id: PMID:34652139
      supporting_text: >-
        Sequence alignment shows that Asp13 is commonly replaced in some
        bacteria species by a cysteine residue, suggesting possible alternative
        bonding modes and/or coordinating metals.
    source_defects:
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q6FAK7
      slot: "FT:BINDING"
      requested_change: REPOINT
      asserted_value: "FT BINDING 22, 23, 101, 104 /ligand=\"[4Fe-4S] cluster\" (HAMAP-Rule:MF_02089)"
      corrected_value: "FT BINDING 101, 104, 184, 186 /ligand=\"[4Fe-4S] cluster\""
      confidence: PROBABLE
      explanation: >-
        In the structurally characterized Thermotoga maritima QueH the cluster
        is coordinated by Cys87-X2-Cys90 and Cys169-X-Cys171, while Cys9 and
        Cys10 bind a separate mononuclear metal. Q6FAK7 has the same six
        conserved cysteines with the same spacing (22-23, 101-X2-104,
        184-X-186), so its cluster ligands are Cys101, Cys104, Cys184 and
        Cys186, and Cys22/Cys23 belong to the mononuclear site. Filed as a
        query rather than a correction because no structure of this protein
        exists; the assignment rests on the family alignment.
      supported_by:
      - reference_id: PMID:34652139
        supporting_text: >-
          A canonical [4Fe-4S] cluster is coordinated with a four cysteine
          motif: Cys87-X2-Cys90 (α4) and Cys169-X-Cys171 (located in a loop
          between α7, α8)
      - reference_id: PMID:34652139
        supporting_text: >-
          Sequence analysis shows conservation of the six cysteine residues
          among QueH family members; corresponding to four cysteines
          coordinating to the [4Fe-4S] cluster, along with two others.
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q6FAK7
      slot: "FT:DISULFID"
      requested_change: CHECK
      asserted_value: "FT DISULFID 184..186 /note=\"Redox-active\" (HAMAP-Rule:MF_02089)"
      corrected_value: "FT BINDING 184, 186 /ligand=\"[4Fe-4S] cluster\""
      confidence: PROBABLE
      explanation: >-
        The redox-active disulfide is the vitamin-K-epoxide-reductase analogy
        that the Thermotoga structure refutes; the equivalent cysteines there
        (Cys169, Cys171) are cluster ligands. Cys184 and Cys186 of Q6FAK7 align
        with them, so this feature is likely wrong for the whole QueH family
        rather than for this entry alone, and the rule MF_02089 is where it
        should be reviewed.
      supported_by:
      - reference_id: PMID:34652139
        supporting_text: >-
          In contrast to this prediction, a single metal ion was found
          coordinated with the two cysteines (Cys9, Cys10) along with Asp13 and
          a non-proteinogenic ligand
      - reference_id: PMID:34652139
        supporting_text: >-
          four iron atoms coordinated by sulfhydryls of four conserved cysteine
          residues from Cys87-X2-Cys90 and Cys169-X-Cys171
