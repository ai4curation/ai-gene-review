taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  QueH (ACIAD2098) is one of two epoxyqueuosine reductases of Acinetobacter
  baylyi ADP1. It belongs to the QueH family (formerly DUF208, InterPro
  IPR003828), which is unrelated in sequence to QueG and works without
  cobalamin, using an iron-sulfur cluster. QueH reduces epoxyqueuosine at
  wobble position 34 of tRNA(Asp), tRNA(Asn), tRNA(His) and tRNA(Tyr) to
  queuosine, the final step of queuosine biosynthesis. A. baylyi is one of the
  few organisms encoding both QueG and QueH: either single mutant still makes
  queuosine, and only the double mutant accumulates epoxyqueuosine and loses
  queuosine, so the two enzymes are functionally redundant in this organism.
