core_functions:
- description: >-
    Cobalamin-independent, iron-sulfur-dependent reduction of
    epoxyqueuosine(34) in tRNA to queuosine(34), redundant with QueG in this
    organism.
  molecular_function:
    id: GO:0052693
    label: epoxyqueuosine reductase activity
  directly_involved_in:
  - id: GO:0008616
    label: tRNA queuosine(34) biosynthetic process
  supported_by:
  - reference_id: PMID:28128549
    supporting_text: >-
      deletion of both corresponding  genes was required to observe the
      absence of Q and the accumulation of oQ in  tRNA
  - reference_id: file:ACIAD/queH/queH-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Catalyzes the conversion of epoxyqueuosine (oQ) to queuosine
      (Q), which is a hypermodified base found in the wobble positions of
      tRNA(Asp), tRNA(Asn), tRNA(His) and tRNA(Tyr).
  knowledge_gaps:
  - gap_statement: >-
      No QueH family member has been shown to produce queuosine in vitro, and
      the physiological electron donor is unknown.
    significance: >-
      The step is established genetically, but the chemistry and the reductant
      remain to be demonstrated with purified protein.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Why do some organisms, such as A. baylyi, keep both QueG and QueH when
    either alone suffices for queuosine formation?
suggested_experiments:
- hypothesis: QueG and QueH differ in oxygen sensitivity or cofactor availability, explaining their retention together.
  description: >-
    Measure queuosine levels in A. baylyi queG and queH single mutants under
    aerobic and anaerobic growth and under cobalamin limitation.
