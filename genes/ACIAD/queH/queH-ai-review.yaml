  review:
    summary: Supported by deletion analysis in this organism and family-wide complementation.
    action: ACCEPT
    reason: >-
      The A. baylyi double-deletion phenotype places QueH on the oQ-to-Q step,
      and genes from eight distant members of this family, including the
      structurally characterized Thermotoga protein, each restore queuosine in
      an E. coli queG mutant. HAMAP MF_02089 assigns the RHEA:32159 reaction.
      In vitro turnover to queuosine has not yet been demonstrated for any
      family member, which is recorded as a knowledge gap.
    supported_by:
