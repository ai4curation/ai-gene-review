gene_symbol: ACIAD3524
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: ACIAD3524 encodes MesX, a member of the former DUF1852 family required for the MesD-associated,
  cobalamin-independent methionine-synthesis route in Acinetobacter baylyi ADP1. Native deletion causes
  methionine auxotrophy and expression of ACIAD3524 restores prototrophy. Related MesD/MesX pairs support
  aerobic methionine synthesis in heterologous complementation, but the molecular action of MesX remains
  unresolved. Methyl-donor generation or transfer is a hypothesis; independent oxidase activity, a bound
  methyl carrier, and a stable MesD–MesX catalytic complex have not been established.
references:
- id: PMID:18319726
  title: A complete collection of single-gene deletion mutants of Acinetobacter baylyi ADP1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and complementation methods read. The construct uses the ADP1 coding sequence.
      Necessity and rescue do not identify the molecular work performed by MesX or prove autonomous methyltransferase
      activity.
  findings:
  - statement: Native ADP1 loss and complementation directly establish a requirement for ACIAD3524 in
      methionine synthesis under the tested growth conditions.
    supporting_text: We have shown that the ACIAD3524 mutant is auxotrophic for methionine, whereas prototrophy
      is restored by complementation with ACIAD3524.
- id: PMID:33534785
  title: Four families of folate-independent methionine synthases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. The aerobic complementation experiments use S. koreensis genes in E.
      coli. The section on MesX molecular function is explicitly predictive; it does not justify an oxidase
      or methyl-carrier GO assertion for ADP1.
  findings:
  - statement: ACIAD3524 is MesX/DUF1852; proposed methyl provision and oxidative chemistry are mechanistic
      hypotheses, not demonstrated activities.
    supporting_text: Instead, we predict that MesX provides methyl groups to MesD, either by covalently
      binding the methyl group, or by forming a methylated substrate that MesD can act on.
