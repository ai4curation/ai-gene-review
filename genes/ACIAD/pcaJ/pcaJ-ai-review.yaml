suggested_questions:
- question: >-
    Which subunit of the PcaIJ heteromer carries the catalytic glutamate that
    forms the enzyme-CoA thioester intermediate in this family, and which
    determines 3-oxoadipate specificity?
suggested_experiments:
- description: >-
    Express PcaI and PcaJ separately and together, and assay
    3-oxoadipate:succinyl-CoA transferase activity and complex formation.
  hypothesis: >-
    Activity requires both subunits, confirming a contributes_to relationship
    for each.
