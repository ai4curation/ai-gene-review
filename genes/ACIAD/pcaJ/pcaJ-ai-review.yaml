- term:
    id: GO:0042952
    label: beta-ketoadipate pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: >-
      Correct core process. The PcaIJ transferase performs the penultimate
      reaction of the beta-ketoadipate pathway, and pcaJ lies in the single
      pca operon that encodes all six protocatechuate-to-central-metabolite
      enzymes in A. baylyi.
    action: ACCEPT
    reason: >-
      PcaJ is a catalytic subunit of a pathway enzyme, so it directly carries
      out a step of the process.
    supported_by:
    - reference_id: PMID:8063101
      supporting_text: >-
        The six enzymes required for catabolism of protocatechuate to succinate
        and acetylCoA are encoded by the pca genes in the Gram-bacterium,
        Acinetobacter calcoaceticus.
    - reference_id: PMID:8063101
      supporting_text: >-
        all of the pca structural genes are tightly grouped in the order
        pcaIJFBDKCHG within a single operon
    - reference_id: PMID:8125318
      supporting_text: >-
        the catIJF region, known to exchange genetic information with the pcaIJF
        region in the same chromosome directing isofunctional proteins
        associated with the beta-ketoadipate pathway
- term:
    id: GO:0047569
    label: 3-oxoadipate CoA-transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Correct specific activity. The enzyme was purified to homogeneity from
      A. calcoaceticus as an alpha2beta2 oligomer of two nonidentical
      subunits, and the PcaJ N-terminus was determined by protein sequencing.
      The activity is a property of the PcaIJ heteromer, so PcaJ contributes
      to rather than independently enables it.
    action: MODIFY
    reason: >-
      Keep GO:0047569 but change the relation from enables to contributes_to,
      matching the treatment of PcaI here and of the Pseudomonas putida KT2440
      PcaI and PcaJ reviews.
    proposed_replacement_terms:
    - id: GO:0047569
      label: 3-oxoadipate CoA-transferase activity
    supported_by:
    - reference_id: PMID:6780551
      supporting_text: >-
        each transferase appears to have an alpha 2 beta 2 oligomeric structure
        formed by association of nonidentical subunits with a molecular weight
        of about 25,000
    - reference_id: file:ACIAD/pcaJ/pcaJ-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=3-oxoadipate + succinyl-CoA = 3-oxoadipyl-CoA + succinate;
