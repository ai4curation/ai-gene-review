status: COMPLETE
taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  pcaJ encodes subunit B of the heteromeric beta-ketoadipate:succinyl-CoA
  transferase (3-oxoadipate CoA-transferase, EC 2.8.3.6) of Acinetobacter
  baylyi ADP1. With subunit A (PcaI) it forms an alpha2beta2 enzyme that
  transfers CoA from succinyl-CoA to 3-oxoadipate, giving 3-oxoadipyl-CoA and
  succinate in the shared lower beta-ketoadipate pathway. pcaJ is the second
  gene of the pcaIJFBDKCHG operon; the catechol-branch catJ gene encodes a
  near-identical, isofunctional protein, and UniProt merges both loci
  (pcaJ/ACIAD1705 and catJ/ACIAD1449) into this entry.
