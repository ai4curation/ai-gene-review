- term:
    id: GO:0046191
    label: aerobic phenol-containing compound catabolic process
  evidence_type: IMP
  original_reference_id: PMID:10348863
  qualifier: involved_in
  review:
    summary: VanA catalyses the O-demethylation step of aerobic vanillate catabolism in ADP1.
    action: NEW
    reason: >-
      VanAB performs the oxygen-dependent conversion of vanillate (a phenol) to
      protocatechuate, so VanA does part of the work of the process, and mutants
      blocked in vanA/vanB fail to catabolize vanillate and ferulate. The same
      term is used for the KT2440 ortholog; no vanillate-specific catabolic
      process term exists in GO, and the KT2440 VanB review proposes one
      (vanillate catabolic process) that would replace this broader term.
    supported_by:
    - reference_id: PMID:10348863
      supporting_text: >-
        Genetic evidence supporting this conclusion was obtained by
        characterization of mutant Acinetobacter strains blocked in catabolism
        of both ferulate and vanillate.
    - reference_id: PMID:10671462
      supporting_text: >-
        PCR mutagenesis of vanAB, followed by selection for strains unable to
        metabolize vanillate, yielded mutant organisms in which vanillate
        metabolism is more strongly inhibited by the vanillate analogs.
