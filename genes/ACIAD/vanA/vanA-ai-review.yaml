- term:
    id: GO:0018489
    label: vanillate monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.14.13.82
  review:
    summary: Core activity of the VanA oxygenase subunit, consistent with ADP1 vanAB genetics.
    action: ACCEPT
    reason: >-
      The EC number on this unreviewed entry is submitter-imported and is not
      cited. The activity rests on ADP1 genetics (mutants blocked in vanAB
      cannot use vanillate), on the description of vanillate demethylase as a
      two-component monooxygenase whose substrates include vanillate analogs,
      and on the Rieske plus VanA_C catalytic-domain architecture of VanA. As for
      the KT2440 ortholog, the reaction is performed by the VanAB pair, with
      VanA carrying the oxygenase active site.
    supported_by:
    - reference_id: PMID:10348863
      supporting_text: >-
        VanA and VanB form an oxygenative demethylase that converts vanillate to
        protocatechuate in microorganisms.
    - reference_id: PMID:10671462
      supporting_text: >-
        The vanillate analogs m-anisate, m-toluate, and
        4-hydroxy-3,5-dimethylbenzoate are substrates of the enzyme and weakly
        inhibit the metabolism of vanillate by wild-type Acinetobacter bacteria.
