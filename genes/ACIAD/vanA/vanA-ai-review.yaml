status: COMPLETE
taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  VanA (ACIAD0980) is the Rieske oxygenase subunit of the two-component
  vanillate O-demethylase VanAB of Acinetobacter baylyi ADP1. It carries an
  N-terminal Rieske [2Fe-2S] domain and a C-terminal VanA_C catalytic domain of
  the aromatic-ring-hydroxylating oxygenase alpha-subunit type, and with the
  reductase VanB converts vanillate to protocatechuate and formaldehyde.
  Mutants blocked in vanAB cannot catabolize vanillate or ferulate, which is
  degraded through vanillate in this organism. The enzyme also accepts the
  vanillate analogs m-anisate, m-toluate and 4-hydroxy-3,5-dimethylbenzoate.
alternative_records:
- id: O24841
  relationship: REFERENCE_PROTEOME_LOCUS_COUNTERPART
  reference_proteome: UP000000430
  reviewed_on: '2026-11-04'
  reason: >-
    O24841 is the unreviewed record of the vanA sequence submitted with the 1999
    ADP1 genetic study (EMBL AAC27107.1, PMID:10348863); Q6FDI6 is the genome-project
    record of the same locus (ACIAD0980) and is the member of the ADP1 reference
    proteome UP000000430. O24841 itself belongs to no reference proteome, so the
    proteome named here is the one holding the locus and the primary record, not
    the alternative record. The two 358-residue sequences differ at 12 positions:
    an 11-position block at 247-258, a pattern consistent with a pair of
    compensating frameshifts in one of the two sequencing projects, and a single
    substitution at 310; which sequence is correct has not been checked against
    the genome reads. Q6FDI6 stays the primary accession because it carries the
    GOA rows. The partner VanB is reviewed on the Swiss-Prot entry O24840 because
    UniProt merged the 1999 submission and the genome entry into that reviewed
    record, whereas for VanA the two remain separate unreviewed records. GO
    annotations are not transferred between O24841 and Q6FDI6.
  evidence:
  - type: PROTEOME_MEMBERSHIP
    description: The primary record Q6FDI6 is on the chromosome of the ADP1 reference proteome UP000000430; O24841 has no Proteomes cross-reference.
    supported_by:
    - reference_id: file:ACIAD/vanA/vanA-uniprot.txt
      record_section: ["DR:Proteomes"]
      supporting_text: Proteomes; UP000000430; Chromosome.
    - reference_id: file:ACIAD/vanA/vanA-bioinformatics/RESULTS.md
      supporting_text: 'O24841: 358 aa, UniParc UPI00000BA041, reference proteomes: none'
  - type: SEQUENCE_COMPARISON
    description: Ungapped position-by-position comparison of the two 358-residue sequences fetched from UniProt by compare_records.py; the UniParc identifiers differ, so the sequences are not identical.
    supported_by:
    - reference_id: file:ACIAD/vanA/vanA-bioinformatics/RESULTS.md
      supporting_text: 'Ungapped comparison: 12 differing positions, 96.6% identity.'
  - type: LOCUS_MAPPING
    description: Both records are vanA of A. baylyi ADP1 (Q6FDI6 is the genome-project locus ACIAD0980), and O24841 is the sequence submitted with the study that cloned vanA from this strain; the 358-residue sequences align without gaps.
    supported_by:
    - reference_id: PMID:10348863
      supporting_text: >-
        Cloned Acinetobacter vanA and vanB were shown to be members of a
        chromosomal segment remote from a supraoperonic cluster
