taxon:
  id: NCBITaxon:62977
  label: Acinetobacter baylyi ADP1
description: >-
  GudD (ACIAD0128) is the glucarate dehydratase of Acinetobacter baylyi ADP1, an enolase-superfamily (mandelate
  racemase subgroup) enzyme orthologous to E. coli GudD. It dehydrates D-glucarate to 5-dehydro-4-deoxy-D-glucarate,
  the first step of the oxidative D-glucarate degradation route that ADP1 uses for growth on D-glucarate.
  In this route the intermediate is converted by KDG dehydratase (ACIAD0130) and alpha-ketoglutarate semialdehyde
  dehydrogenase (ACIAD0131) to 2-oxoglutarate. Single-gene deletion profiling and in vitro reconstitution
  of the purified enzymes identified these genes.
