- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IC
  original_reference_id: PMID:11191224
  qualifier: enables
  review:
    summary: >-
      Besides nickel, this chain coordinates the iron of the bimetallic active site;
      the entry annotates Fe-cation ligands through the curated PIRSR site rule and
      lists the iron cofactor explicitly. GOA carries nickel binding for this entry
      but not iron binding, leaving half of the Ni-Fe centre unannotated.
    action: NEW
    reason: >-
      The iron is a cofactor of the catalytic centre this subunit builds, not an
      adventitious metal: the curated cofactor and ligand-binding annotations name it,
      and the structure of this enzyme resolves the active site including its
      partially occupied bridging sulfur, which caps the Ni-Fe pair. The inference
      that this chain binds iron is therefore drawn from the same evidence that
      supports the accepted nickel-binding annotation, hence IC.
    supported_by:
    - reference_id: file:DESDE/Q9L868/Q9L868-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="Fe cation"
    - reference_id: file:DESDE/Q9L868/Q9L868-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Name=Fe cation; Xref=ChEBI:CHEBI:24875;
    - reference_id: PMID:11191224
      supporting_text: >-
        the bridging sulfur atom that caps the active site was found to have
        partial occupancy
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IC
  original_reference_id: PMID:11191224
  qualifier: enables
  review:
    summary: >-
      The crystal structure of this enzyme (PDB 1E3D, solved from this strain)
      contains a magnesium ion bound by the large subunit; the entry annotates three
      Mg(2+) ligand positions (53, 489, 543) whose evidence includes the structure
      itself (ECO:0007829, PDB:1E3D) as well as the curated PIRSR site rule, and the
      structure reference is recorded as solved in complex with Mg(2+). GOA carries
      no magnesium-binding term for this entry.
    action: NEW
    reason: >-
      The structural magnesium of [NiFe] hydrogenase large subunits is a bound
      cofactor near the C-terminus, not an adventitious crystallisation ion, and here
      its ligands are assigned from the structure of this very protein rather than
      by family transfer alone, which makes this binding claim better grounded than
      the iron-binding row above. The cached structure paper is abstract-only and
      does not itself discuss the magnesium, so the annotation is recorded as IC,
      drawn from the structure-derived ligand features in the entry. The term is
      not an ancestor or descendant of any other term proposed here.
    supported_by:
    - reference_id: file:DESDE/Q9L868/Q9L868-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="Mg(2+)"
    - reference_id: file:DESDE/Q9L868/Q9L868-uniprot.txt
      record_section: ["REF"]
      supporting_text: >-
        X-RAY CRYSTALLOGRAPHY (1.80 ANGSTROMS) OF 2-543 IN COMPLEX WITH MG(2+)
