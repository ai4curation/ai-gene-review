taxon:
  id: NCBITaxon:876
  label: Desulfovibrio desulfuricans
description: >-
  Catalytic large (alpha) subunit of the periplasmic [NiFe] hydrogenase of
  Desulfovibrio desulfuricans ATCC 27774 (genome locus Ddes_1038; this entry is a
  543-residue sequence fragment of the 558-residue protein). It builds the
  bimetallic Ni-Fe active site at which molecular hydrogen is heterolytically
  cleaved, coordinating the nickel and the iron through conserved cysteine pairs
  together with a structural magnesium ion. The subunit forms a soluble periplasmic
  heterodimer with the iron-sulfur small subunit (hydA, Ddes_1039), which relays the
  electrons released by H2 oxidation to the tetrahaem cytochrome c3; the pair
  therefore feeds hydrogen-derived electrons into the periplasmic cytochrome network
  of this sulfate-reducing bacterium. The heterodimeric enzyme has been solved
  crystallographically at 1.8 A.
existing_annotations:
- term:
    id: GO:0008901
    label: ferredoxin hydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018194
  review:
    summary: >-
      An InterPro2GO transfer from IPR018194 (Nickel-dependent hydrogenase, large
      subunit, nickel binding site). GO:0008901 is "Catalysis of the reaction: 2
      reduced ferredoxin + 2 H+ = 2 oxidized ferredoxin + H2", the ferredoxin-linked
      chemistry of EC 1.12.7.2. This enzyme reduces cytochrome c3, not ferredoxin,
      and runs in the H2-oxidising direction.
    action: REMOVE
    reason: >-
      The signature correctly identifies the nickel site of a [NiFe] hydrogenase
      large subunit, but the GO term it is mapped to names the wrong electron
      acceptor and reaction; this is a demonstrably wrong electronic mapping rather
      than a term that is merely too broad. The acceptor-correct term GO:0047806 is
      already present on this entry from the EC mapping and is accepted in this
      review, so nothing true is lost. The mapping itself is recorded as a source
      defect, with the acceptor-agnostic GO:0033748 hydrogenase (acceptor) activity
      proposed in its place.
    supported_by:
    - reference_id: file:DESDA/hydA/hydA-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=2 Fe(III)-[cytochrome c3] + H2 = 2 Fe(II)-[cytochrome c3] + 2
    - reference_id: PMID:11191224
      supporting_text: >-
        its physiological partner, the tetrahaem cytochrome c3
        from the same organism
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: interpro2go
      requested_change: REPOINT
      asserted_value: GO:0008901
      corrected_value: GO:0033748
      corrected_label: hydrogenase (acceptor) activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        In InterPro's interpro2go file, IPR018194 (Nickel-dependent hydrogenase,
        large subunit, nickel binding site) is mapped to GO:0008901 ferredoxin
        hydrogenase activity alongside the correct GO:0016151 nickel cation binding.
        GO:0008901 describes the ferredoxin-linked reaction (EC 1.12.7.2) typical of
        [FeFe] hydrogenases, whereas proteins matching IPR018194 are [NiFe]
        hydrogenase large subunits whose physiological acceptors vary by enzyme
        (cytochrome c3 here, EC 1.12.2.1). The mapping should be repointed to the
        acceptor-agnostic GO:0033748 hydrogenase (acceptor) activity, or dropped.
        The companion signature IPR001821 ([NiFe]-hydrogenase, small subunit)
        carries the same erroneous mapping. The resource is InterPro (interpro2go),
        consumed here via GO_REF:0000002.
- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001501
  - InterPro:IPR018194
  review:
    summary: >-
      Nickel binding transferred from the two large-subunit InterPro signatures. The
      nickel of the bimetallic active site is coordinated by this chain: the entry
      annotates Ni(2+) ligands through the curated PIRSR site rule, and the crystal
      structure of this very enzyme resolves the nickel-binding cysteine in three
      rotamers.
    action: ACCEPT
    reason: >-
      This is a defining, target-verified property of the chain rather than a
      family-level guess: the structure paper for this strain's enzyme describes the
      cysteine ligand to the nickel atom directly, and the entry carries matching
      curated ligand-binding positions. Nickel coordination is part of the core
      catalytic function, so the term is retained as core.
    supported_by:
    - reference_id: file:DESDE/Q9L868/Q9L868-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="Ni(2+)"
    - reference_id: PMID:11191224
      supporting_text: >-
        a three-fold disorder was observed for Cys536 which binds to the nickel atom
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0200
  review:
    summary: >-
      Periplasmic localisation mapped from the UniProt subcellular location, which in
      this unreviewed entry rests only on an automatic association rule. Independent
      support comes from the partner subunit: the small subunit (UniProtKB:P13061,
      Ddes_1039) carries a twin-arginine (Tat) signal peptide whose cleavage position
      was established by direct protein sequencing of the purified mature protein,
      and the Tat system exports the folded heterodimer, carrying this subunit with
      it. Desulfovibrio periplasmic hydrogenases are the classical periplasmic
      H2-oxidising enzymes of sulfate reducers.
    action: ACCEPT
    reason: >-
      The claim holds on evidence other than the automatic rule that generated the
      row. The catalytic subunit has no signal peptide of its own, which is the
      expected arrangement for a Tat-exported hydrogenase heterodimer, and its
      obligate partner's export has experimental grounding. The location is also
      where the function must act: the acceptor, tetrahaem cytochrome c3, is a
      periplasmic protein.
    supported_by:
    - reference_id: file:DESDA/hydA/hydA-uniprot.txt
      record_section: ["CC:PTM"]
      supporting_text: >-
        Predicted to be exported by the Tat system. The position of the
    - reference_id: file:DESDA/hydA/hydA-uniprot.txt
