- term:
    id: GO:0047806
    label: cytochrome-c3 hydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.12.2.1
  review:
    summary: >-
      The EC mapping assigns the enzyme reaction 2 Fe(III)-[cytochrome c3] + H2 = 2
      Fe(II)-[cytochrome c3] + 2 H+ (EC 1.12.2.1). Unlike the small subunit, this
      chain genuinely enables the activity: the Ni-Fe centre where H2 is cleaved is
      built from its residues, and the modelled electron path runs from that centre
      through the small subunit's cluster chain to the tetrahaem cytochrome c3.
    action: ACCEPT
    reason: >-
      The reaction and its acceptor are both correct for this enzyme and the
      catalytic machinery sits on this chain, so this is the core molecular function.
      The structure determination and the docking analysis of the cytochrome c3
      interaction were carried out on the enzyme from this strain.
    supported_by:
    - reference_id: file:DESDA/hydA/hydA-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=2 Fe(III)-[cytochrome c3] + H2 = 2 Fe(II)-[cytochrome c3] + 2
    - reference_id: PMID:11191224
      supporting_text: >-
        its physiological partner, the tetrahaem cytochrome c3
        from the same organism
- term:
    id: GO:0044569
    label: '[Ni-Fe] hydrogenase complex'
  evidence_type: IC
  original_reference_id: PMID:11191224
  qualifier: part_of
  review:
    summary: >-
      The enzyme is a heterodimer of this catalytic subunit with the iron-sulfur
      small subunit (UniProtKB:P13061, Ddes_1039); the two genes are adjacent in the
      ATCC 27774 genome (Ddes_1038, Ddes_1039) and the heterodimer was crystallised
      from this strain, with this entry mapping to PDB 1E3D chains B/D. The partner
      subunit already carries this complex term; the catalytic subunit does not.
    action: NEW
    reason: >-
      The complex membership is inferred from the structural and genomic evidence
      above rather than asserted from family membership, which is why it is recorded
      as IC. The claim is about this chain specifically: the published structure
      contains both the Ni-Fe centre contributed by this subunit and the iron-sulfur
      cluster chain contributed by the small subunit, in one molecule. The term is
      not an ancestor or descendant of any other term proposed here.
    supported_by:
    - reference_id: PMID:11191224
      supporting_text: >-
        has been modified [4Fe-3S-3O]
        by loss of one sulfur atom and inclusion of three oxygen atoms
    - reference_id: file:DESDA/hydA/hydA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Heterodimer of a large and a small subunit.
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IC
  original_reference_id: PMID:11191224
  qualifier: enables
  review:
    summary: >-
      Besides nickel, this chain coordinates the iron of the bimetallic active site;
      the entry annotates Fe-cation ligands through the curated PIRSR site rule and
      lists the iron cofactor explicitly. GOA carries nickel binding for this entry
      but not iron binding, leaving half of the Ni-Fe centre unannotated.
    action: NEW
    reason: >-
      The iron is a cofactor of the catalytic centre this subunit builds, not an
      adventitious metal: the curated cofactor and ligand-binding annotations name it,
      and the structure of this enzyme resolves the active site including its
      partially occupied bridging sulfur, which caps the Ni-Fe pair. The inference
      that this chain binds iron is therefore drawn from the same evidence that
      supports the accepted nickel-binding annotation, hence IC.
    supported_by:
    - reference_id: file:DESDE/Q9L868/Q9L868-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="Fe cation"
    - reference_id: file:DESDE/Q9L868/Q9L868-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Name=Fe cation; Xref=ChEBI:CHEBI:24875;
    - reference_id: PMID:11191224
      supporting_text: >-
        the bridging sulfur atom that caps the active site was found to have
        partial occupancy
