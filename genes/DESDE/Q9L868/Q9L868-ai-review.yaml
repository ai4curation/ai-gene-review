- id: PMID:11191224
  title: '[NiFe] hydrogenase from Desulfovibrio desulfuricans ATCC 27774: gene sequencing,
    three-dimensional structure determination and refinement at 1.8 A and modelling
    studies of its interaction with the tetrahaem cytochrome c3.'
  findings:
  - statement: The enzyme of this strain was sequenced and its structure refined at
      1.8 A; the nickel-binding cysteine of the active site shows three rotamers and
      the bridging sulfur is only partly occupied.
    supporting_text: >-
      a three-fold disorder was observed for Cys536 which binds to the nickel atom
    residue_mappings:
    - as_reported:
        accession: PDB:1E3D_B
        position: 536
        residue: C
      canonical:
        accession: UniProtKB:Q9L868
        position: 537
        residue: C
        sequence_version: 1
      note: >-
        The paper numbers residues on the author numbering of the deposited model,
        not on this entry: PDBe SIFTS maps chains B and D of 1E3D, residues 1-542,
        onto Q9L868 residues 2-543, so PDB residue n is Q9L868 residue n+1. The
        deposited chain does also lack the initiator methionine, but that alone does
        not imply the renumbering (a deposition can drop a residue and keep the
        parent numbering), and the DR PDB B/D=2-543 range is itself in UniProt
        numbering, so the offset is established by the SIFTS correspondence rather
        than inferred from the missing residue. PDB residue 536 is CYS in the 1E3D
        residue listing, and Q9L868 position 537 is Cys and is one of this entry's
        annotated Ni(2+) ligands, while position 536 of Q9L868 is Pro. The two
        numbers are therefore the same residue, not two different cysteines. The
        entry's annotated active-site ligands are Ni(2+) at 72, 75 and 537 and Fe
        cation at 75 and 540: 540 is a nickel ligand in the canonical [NiFe]
        architecture and in the reviewed homologues P12944 and P21852, but it is not
        annotated as one here, so it is not quoted as an annotated Ni(2+) ligand of
        this entry. as_reported is a PDB chain (1E3D chains B and D carry this
        subunit; A and C are the small subunit) rather than a UniProtKB sequence, so
        the validator reports that side as unresolved rather than checking it.
  - statement: The physiological electron acceptor is the tetrahaem cytochrome c3 of
      the same organism, which docks at the distal iron-sulfur cluster of the small
      subunit.
    supporting_text: >-
      an interaction between the haem IV region in tetrahaem cytochrome c3 with
      the distal [4Fe-4S] cluster
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; this is the structure paper for the enzyme encoded by the
      sequence in this entry (EMBL AF216303 / PDB 1E3D, where this accession maps to
      chains B/D, residues 2-543). The published abstract misspells the species as
      "D. desulfitricans" but states strain ATCC 27774. Cached record is
      abstract-only, so only abstract statements are quoted.
- id: PMID:9797331
  title: Enzymatic recovery of elemental palladium by using sulfate-reducing bacteria.
  findings:
  - statement: H2-dependent reduction of Pd(II) to cell-surface Pd(0) by resting
      Desulfovibrio desulfuricans cells was attributed to hydrogenase activity on the
      basis of H2 dependence and Cu2+ sensitivity, without genetic confirmation, and
      the site of metal deposition is the periplasm.
    supporting_text: >-
      the lack of molecular genetic studies on D. desulfuricans makes confirmation
      with specific deletion mutants difficult, but the involvement of hydrogenase
      activity is strongly implicated
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified via DOI 10.1128/AEM.64.11.4607-4609.1998; full text cached.
      Used here only for the periplasmic siting of metal reduction in this species;
      the study used strain ATCC 29577 and implicates hydrogenase activity
      generically, so it supports no activity annotation on this entry.
