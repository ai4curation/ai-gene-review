id: Q9L868
gene_symbol: Q9L868
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:876
  label: Desulfovibrio desulfuricans
description: >-
  Catalytic large (alpha) subunit of the periplasmic [NiFe] hydrogenase of
  Desulfovibrio desulfuricans ATCC 27774 (genome locus Ddes_1038). It builds the
  bimetallic Ni-Fe active site at which molecular hydrogen is heterolytically
  cleaved, coordinating the nickel and the iron through conserved cysteine pairs
  together with a structural magnesium ion. The subunit forms a soluble periplasmic
  heterodimer with the iron-sulfur small subunit (hydA, Ddes_1039), which relays the
  electrons released by H2 oxidation to the tetrahaem cytochrome c3; the pair
  therefore feeds hydrogen-derived electrons into the periplasmic cytochrome network
  of this sulfate-reducing bacterium. The heterodimeric enzyme has been solved
  crystallographically at 1.8 A.
