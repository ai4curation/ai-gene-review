  review:
    summary: >-
      The EC mapping assigns the enzyme reaction 2 Fe(III)-[cytochrome c3] + H2 = 2
      Fe(II)-[cytochrome c3] + 2 H+ (EC 1.12.2.1). Unlike the small subunit, this
      chain genuinely enables the activity: the Ni-Fe centre where H2 is cleaved is
      built from its residues, and the modelled electron path runs from that centre
      through the small subunit's cluster chain to the tetrahaem cytochrome c3.
    action: ACCEPT
    reason: >-
      The reaction and its acceptor are both correct for this enzyme and the
      catalytic machinery sits on this chain, so this is the core molecular function.
      The structure determination and the docking analysis of the cytochrome c3
      interaction were carried out on the enzyme from this strain. The reaction is
      quoted from the partner subunit's record (hydA, P13061) deliberately: this
      entry's own CATALYTIC ACTIVITY block rests only on an ARBA association rule
      (ECO:0000256|ARBA:ARBA00029307), an unvetted prediction that is not used as
      support. That the Ni-Fe centre sits on this chain is anchored by the entry's
      own active-site ligand features, which annotate Ni(2+) at 72, 75 and 537 and
      Fe cation at 75 and 540 in this entry's numbering. All four of these cysteines
      coordinate the nickel, with 75 and 540 the bridging pair shared between the
      nickel and the iron: that is the canonical [NiFe] large-subunit architecture,
      and the deposited coordinates of this enzyme show it directly, every one of the
      four sulfurs lying 2.17-2.62 A from the cluster nickel in both large-subunit
      chains of 1E3D and only those two also close to the iron. The reviewed
      Desulfovibrio-lineage homologues P12944 and P21852 annotate Ni(2+) at all four
      equivalent positions, whereas this entry's PIRSR-derived set omits Ni(2+) at
      540 (filed as a source defect on the GO:0016151 row; see the notes file). The structure adds a nickel-ligating
      cysteine that the paper calls Cys536; that is the author numbering of the
      deposited model, under which, as PDBe SIFTS reports the correspondence, PDB
      residue n is residue n+1 of this entry, so the paper's Cys536 is this entry's
      Cys537. The residue_mappings on the PMID:11191224 finding record that
      correspondence and its basis.
