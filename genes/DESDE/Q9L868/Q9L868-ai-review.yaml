proposed_new_terms: []
suggested_questions:
- question: >-
    Does the partly occupied bridging sulfur and the three-rotamer nickel cysteine
    seen in this structure represent a genuine activation intermediate of the
    catalytic cycle, or a radiation or preparation artefact?
- question: >-
    Should a UniProtKB entry exist for the complete Ddes_1038 large subunit (GenBank
    ACL48945.1, 558 aa) from the ATCC 27774 genome, with this fragment entry merged
    into it or cross-referenced to it?
suggested_experiments:
- description: >-
    Spectroscopically and crystallographically follow the Ni-Fe site of the purified
    ATCC 27774 enzyme through reductive activation, comparing bridging-ligand
    occupancy and cysteine rotamer populations between as-isolated and activated
    states.
  hypothesis: >-
    The minor Cys536 rotamers and the partly occupied bridging sulfur are states of
    the activation process rather than preparation artefacts.
- description: >-
    Reconstitute H2 oxidation in vitro with the purified heterodimer and tetrahaem
    cytochrome c3, and compare it with the isolated large subunit and with mutants of
    the nickel-coordinating cysteines.
  hypothesis: >-
    Catalysis requires the Ni-Fe centre of this subunit, while electron delivery to
    cytochrome c3 requires the partner subunit's cluster chain.
