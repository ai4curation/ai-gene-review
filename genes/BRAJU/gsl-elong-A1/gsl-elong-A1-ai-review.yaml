taxon:
  id: NCBITaxon:3707
  label: Brassica juncea
description: Brassica juncea gsl-elong-A1 encodes BjMAM1-A (also called BjMAMS1A), a methylthioalkylmalate
  synthase that condenses acetyl-CoA with methionine-derived 2-oxo acids during aliphatic glucosinolate
  chain elongation. The enzyme accepts 4-methylthio-2-oxobutanoate and favors longer substrates, particularly
  the C4-glucosinolate precursor 5-methylthio-2-oxopentanoate, relative to the BjMAM2 paralogs. It requires
  a divalent metal and forms a homodimer with a substrate-binding catalytic barrel and a C-terminal region
  contributing to the adjacent subunit CoA site. Chloroplast targeting is inferred from its predicted
  targeting sequence and characterized plant MAM homologs. Enzymology, heterologous complementation and
  native antisense experiments support a contribution to the abundant C4-glucosinolate pool in Indian
  mustard.
