  title: Molecular Basis of the Evolution of Methylthioalkylmalate Synthase and the Diversity of Methionine-Derived
    Glucosinolates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Exact BjMAM1-A accession FM161920 matches current UniProt C5J4P1
      and PDB6E1J. Native antisense affects both MAM1-A/B; biochemical assays and Arabidopsis complementation
      are individually resolved.
  findings:
  - statement: BjMAM1-A is an assayed MAM with preference for longer methylthio-2-oxo substrates relative
      to BjMAM2 proteins.
    supporting_text: BjMAM1-A and BjMAM1-B were less than threefold more efficient than AtMAM1 with 5MTOP
      but were 85- to 1,140-fold more efficient with 5MTOP compared with BjMAM2-A and BjMAM2-B.
  - statement: Target-specific expression rescues C4-glucosinolate production in an Arabidopsis mam1 background.
    supporting_text: The expression of BjMAM1-A elevated C4-glucosinolate content to levels comparable
      to those of wild-type and AtMAM1 -expressing Arabidopsis
  - statement: Native antisense is not specific to only the A-homeolog.
    supporting_text: The BjMAM1-A(as) lines showed pronounced silencing of both BjMAM1-A and BjMAM1-B
      homologs.
  - statement: The experimental protein is explicitly linked to the sequence accession.
    supporting_text: BjMAM1-A ( FM161920 )
