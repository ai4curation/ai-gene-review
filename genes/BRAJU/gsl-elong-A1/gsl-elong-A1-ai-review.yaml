- id: PMID:39322014
  title: Kinetic and catalytic mechanisms of the methionine-derived glucosinolate biosynthesis enzyme
    methylthioalkylmalate synthase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Full text inspected: kinetic ordering and catalytic substitutions concern BjMAMS2A,
      whereas the comparative structure is BjMAMS1A. These assays are not claimed as direct MAM1-A measurements.'
  findings:
  - statement: The target isoform for the 2024 kinetic assays is BjMAMS2A, distinguishing this work from
      direct 2019 BjMAM1-A experiments.
    supporting_text: BjMAMS2A was selected for the present studies because it only catalyzes one round
      of condensation, which simplifies the enzyme assays.
