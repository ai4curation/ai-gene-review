  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Ribosome is correct but less specific than large ribosomal subunit.
    action: MODIFY
    reason: Correct but general. The uL16 family signatures behind this InterPro2GO row identify a 
      large-subunit protein, and the curated HAMAP rule MF_01342 places it in the 50S subunit, so the row's 
      own family evidence supports GO:0015934 large ribosomal subunit (part_of ribosome), the term this 
      review already proposes for the mitochondrial-subunit IBA row. Changed from KEEP_AS_NON_CORE, which 
      the guidelines reserve for terms that are as precise as warranted.
    supported_by:
