- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Structural constituent of ribosome is the core molecular function for rpl16.
    action: ACCEPT
    reason: Family-membership evidence, no Populus experiment. The curated HAMAP rule MF_01342 places 
      rpl16 in the universal ribosomal protein uL16 family and assigns it to the 50S ribosomal subunit, 
      and the bacterial-type uL16 InterPro signature matches; uL16 is a structural ribosomal protein 
      throughout the family.
    supported_by:
    - reference_id: file:POPTR/rpl16/rpl16-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uL16 family.'
    - reference_id: file:POPTR/rpl16/rpl16-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 50S ribosomal subunit.'
    - reference_id: file:POPTR/rpl16/rpl16-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR000114; Ribosomal_uL16_bact-type'
- term:
    id: GO:0019843
    label: rRNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: rRNA binding is appropriate for this chloroplast large-subunit ribosomal protein.
    action: ACCEPT
    reason: Family-membership evidence only, no Populus experiment. rpl16 matches the HAMAP uL16 rule 
      MF_01342 and the uL16 family signatures; uL16 is an rRNA-contacting large-subunit protein across the 
      family, which is what the IBA node and the InterPro2GO mapping assert. The record carries no curated 
      FUNCTION text that states rRNA binding for this protein, so the support is the family assignment.
    supported_by:
    - reference_id: file:POPTR/rpl16/rpl16-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uL16 family.'
