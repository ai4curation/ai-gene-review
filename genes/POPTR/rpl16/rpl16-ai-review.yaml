      supporting_text: 'HAMAP; MF_01342; Ribosomal_uL16'
    - reference_id: file:POPTR/rpl16/rpl16-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR000114; Ribosomal_uL16_bact-type'
- term:
    id: GO:0032543
    label: mitochondrial translation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Mitochondrial translation is the wrong organelle context for rpl16.
    action: MODIFY
    reason: The protein is chloroplast-localized; use the non-organelle-specific translation term already 
      present in GOA rather than mitochondrial translation.
    supported_by:
    - reference_id: file:POPTR/rpl16/rpl16-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
    - reference_id: file:POPTR/rpl16/rpl16-uniprot.txt
      record_section: [DE]
      supporting_text: 'RecName: Full=Large ribosomal subunit protein uL16c'
    proposed_replacement_terms:
