    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: NADH dehydrogenase (ubiquinone) activity is too mitochondrial/bacterial for the chloroplast NDH
      reaction.
    action: MODIFY
    reason: The UniProt-curated reaction uses plastoquinone and NAD(P)H, so the broader quinone-acceptor
      oxidoreductase term is safer.
    supported_by:
    - reference_id: file:POPTR/ndhK/ndhK-uniprot.txt
      supporting_text: 'CATALYTIC ACTIVITY: a plastoquinone + NADH/NADPH + protons = a plastoquinol + NAD/NADP.'
    proposed_replacement_terms:
