taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: NdhK iron-sulfur subunit in Populus trichocarpa. It forms part of the thylakoid NADH dehydrogenase-like
  complex, which transfers electrons from reduced ferredoxin to plastoquinone and couples this reaction to
  proton translocation during cyclic electron flow around photosystem I. NdhK contributes a 4Fe–4S center and
  lines the plastoquinone-binding pocket. The resulting proton gradient supports ATP synthesis and photosynthetic
  energy balance.
