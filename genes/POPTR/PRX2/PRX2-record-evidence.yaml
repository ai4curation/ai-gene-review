      - evidenceCode: ECO:0000269
        source: PubMed
        id: '16916801'
      value: Monomer (PubMed:11706208, PubMed:15697201). Homodimer (PubMed:15697201, PubMed:16916801). Glutathionylation
        of C(P) causes the dimer to dissociate. Subsequent reduction of the mixed disulfide bond leads again to
        dimerization (PubMed:16916801)
    commentType: SUBUNIT
  - texts:
    - evidences:
      - evidenceCode: ECO:0000305
        source: PubMed
        id: '11832487'
      - evidenceCode: ECO:0000305
        source: PubMed
        id: '18230180'
      value: The active site is a conserved redox-active cysteine residue, the peroxidatic cysteine (C(P)), which
        makes the nucleophilic attack on the peroxide substrate. The peroxide oxidizes the C(P)-SH to cysteine sulfenic
        acid (C(P)-SOH), which then reacts with another cysteine residue, the resolving cysteine (C(R)), to form
        a disulfide bridge. The disulfide is subsequently reduced by an appropriate electron donor to complete the
        catalytic cycle. In this 1-Cys peroxiredoxin, no C(R) is present and C(P) instead forms a disulfide with
        a cysteine from another protein or with a small thiol molecule. C(P) is reactivated by glutathionylation
        and subsequent reduction by glutaredoxin (Grx), or by thioredoxin (Trx). Preferentially uses glutaredoxin
    commentType: MISCELLANEOUS
  - texts:
    - evidences:
      - evidenceCode: ECO:0000305
      value: Belongs to the peroxiredoxin family. Prx5 subfamily
    commentType: SIMILARITY
