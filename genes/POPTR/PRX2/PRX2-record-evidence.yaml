        source: PubMed
        id: '15032877'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '18230180'
      value: Thiol-specific peroxidase that catalyzes the reduction of hydrogen peroxide and organic hydroperoxides
        to water and alcohols, respectively. Can reduce H(2)O(2) and short chain organic, fatty acid, and phospholipid
        hydroperoxides. Plays a role in cell protection against oxidative stress by detoxifying peroxides
    commentType: FUNCTION
  - commentType: CATALYTIC ACTIVITY
    reaction:
      name: '[glutaredoxin]-dithiol + a hydroperoxide = [glutaredoxin]-disulfide + an alcohol + H2O'
