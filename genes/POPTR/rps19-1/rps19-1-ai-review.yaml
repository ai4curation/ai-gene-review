id: A4GYV1
gene_symbol: rps19-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: Chloroplast small ribosomal subunit protein uS19c, encoded by duplicated plastid rps19 copies, that
  supports plastid translation and 16S rRNA binding as part of the small ribosomal subunit.
existing_annotations:
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic RNA binding is better represented as small-subunit rRNA binding for rps19; this converges
      with the separate rRNA binding source annotation on one replacement term.
    action: MODIFY
    reason: UniProt states that S19 forms a complex with S13 that binds 16S rRNA; the ribosomal context is more
      specific than generic RNA binding, so this row and the rRNA binding row should yield a single
      GO:0070181 replacement annotation rather than duplicate downstream annotations.
    supported_by:
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Protein S19 forms a complex with S13 that binds strongly to the 16S ribosomal RNA.
    proposed_replacement_terms:
    - id: GO:0070181
      label: small ribosomal subunit rRNA binding
- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Structural constituent of ribosome is the core molecular function for rps19.
    action: ACCEPT
    reason: Family evidence (HAMAP rule MF_00531), no Populus experiment. rps19 belongs to the universal 
      uS19 family and matches the bacterial-type uS19 signature behind this row; the HAMAP-derived FUNCTION 
      text places it with S13 on 16S rRNA, a structural small-subunit role.
    supported_by:
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS19 family.'
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR005732; Ribosomal_uS19_bac-type'
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Protein S19 forms a complex with S13 that binds strongly to the 16S ribosomal RNA.'
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: Cytoplasm is the wrong compartment for this plastid-encoded ribosomal protein.
    action: MODIFY
    reason: The reviewed UniProt entry places rps19 in the chloroplast, not the cytoplasm.
    supported_by:
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
    proposed_replacement_terms:
    - id: GO:0009507
      label: chloroplast
- term:
    id: GO:0005840
    label: ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Ribosome is true but less specific than the small ribosomal subunit.
    action: MODIFY
    reason: Correct but general. The uS19 family signatures behind this InterPro2GO row identify a 
      small-subunit protein that binds 16S rRNA (HAMAP-derived FUNCTION text), so the row's own family 
      evidence supports GO:0015935 small ribosomal subunit (part_of ribosome), which this review accepts 
      on its own IEA row. Changed from KEEP_AS_NON_CORE, which the guidelines reserve for terms that are 
      as precise as warranted.
    supported_by:
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Protein S19 forms a complex with S13 that binds strongly to the 16S ribosomal RNA.'
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS19 family.'
    proposed_replacement_terms:
    - id: GO:0015935
      label: small ribosomal subunit
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Translation is the core biological process for a chloroplast small-subunit ribosomal protein.
    action: ACCEPT
    reason: Family evidence (HAMAP rule MF_00531), no Populus experiment. As a uS19-family 16S 
      rRNA-binding component of the chloroplast ribosome, rps19 takes part in plastid translation.
    supported_by:
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS19 family.'
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Protein S19 forms a complex with S13 that binds strongly to the 16S ribosomal RNA.'
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
- term:
    id: GO:0009507
    label: chloroplast
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Chloroplast localization is directly supported.
    action: ACCEPT
    reason: UniProt annotates rps19 as plastid/chloroplast localized.
    supported_by:
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
- term:
    id: GO:0015935
    label: small ribosomal subunit
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  review:
    summary: Small ribosomal subunit is the correct complex term.
    action: ACCEPT
    reason: Family evidence (HAMAP rule MF_00531), no Populus experiment. The HAMAP-derived FUNCTION text 
      places S19 with S13 on 16S rRNA, and the universal uS19 family is a small-subunit protein family.
    supported_by:
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Protein S19 forms a complex with S13 that binds strongly to the 16S ribosomal RNA.'
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS19 family.'
- term:
    id: GO:0019843
    label: rRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: rRNA binding is correct but can be made small-subunit-specific; this converges with the generic
      RNA binding source annotation on one replacement term.
    action: MODIFY
    reason: UniProt specifically links S19 to 16S rRNA binding in the small subunit, so this row and the
      generic RNA binding row should yield a single GO:0070181 replacement annotation rather than duplicate
      downstream annotations.
    supported_by:
    - reference_id: file:POPTR/rps19-1/rps19-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Protein S19 forms a complex with S13 that binds strongly to the 16S ribosomal RNA.
    proposed_replacement_terms:
    - id: GO:0070181
      label: small ribosomal subunit rRNA binding
