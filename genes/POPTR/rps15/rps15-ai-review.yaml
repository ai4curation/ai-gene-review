description: Chloroplast small ribosomal subunit protein uS15c that supports plastid translation.
existing_annotations:
- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Structural constituent of ribosome is the core molecular function for rps15.
    action: ACCEPT
    reason: rps15 belongs to the universal ribosomal protein uS15 family (HAMAP MF_01343_B; SIMILARITY line)
      and is part of the 30S ribosomal subunit by similarity (ECO:0000250). Support is family membership,
      not a Populus experiment.
    supported_by:
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS15 family.'
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_01343_B; Ribosomal_uS15_B; 1.
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: Cytoplasm is the wrong compartment for this plastid ribosomal protein.
    action: MODIFY
    reason: The reviewed UniProt entry places rps15 in the chloroplast.
    supported_by:
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
    proposed_replacement_terms:
    - id: GO:0009507
      label: chloroplast
- term:
    id: GO:0005840
    label: ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Ribosome is correct for rps15 but less specific than the small ribosomal subunit term this review carries.
    action: MODIFY
    reason: >-
      Correct but general. The uS15 family membership behind this row (HAMAP MF_01343_B) identifies a 30S-subunit protein, so the row's own
      family evidence supports GO:0015935 small ribosomal subunit (part_of ribosome), which this review already
      carries. Changed from KEEP_AS_NON_CORE, as for the other POPTR
      ribosomal-protein reviews.
    proposed_replacement_terms:
    - id: GO:0015935
      label: small ribosomal subunit
    supported_by:
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Translation is the core biological process for rps15.
    action: ACCEPT
    reason: As a uS15 family member (HAMAP MF_01343_B) that is part of the 30S subunit of the chloroplast
      ribosome by similarity, rps15 takes part in plastid translation. Support is family membership, not a
      Populus experiment.
    supported_by:
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_01343_B; Ribosomal_uS15_B; 1.
- term:
    id: GO:0009507
    label: chloroplast
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Chloroplast localization is directly supported.
    action: ACCEPT
    reason: UniProt annotates rps15 as plastid/chloroplast localized.
    supported_by:
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
- term:
    id: GO:0015935
    label: small ribosomal subunit
  evidence_type: IEA
  review:
    summary: Small ribosomal subunit is supported by the curated subunit statement but absent from the fetched
      GOA rows.
    action: NEW
    reason: By similarity (ECO:0000250 SUBUNIT text) rps15 is part of the 30S ribosomal subunit, and it
      belongs to the universal ribosomal protein uS15 family; this more specific complex term should
      accompany the generic ribosome annotation.
    supported_by:
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
    - reference_id: file:POPTR/rps15/rps15-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS15 family.'
