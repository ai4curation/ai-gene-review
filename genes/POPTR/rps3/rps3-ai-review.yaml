description: Chloroplast small ribosomal subunit protein uS3c, a plastid ribosome component supporting 
  chloroplast translation.
existing_annotations:
- term:
    id: GO:0022627
    label: cytosolic small ribosomal subunit
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: cytosolic small ribosomal subunit is incorrect for this chloroplast-encoded plastid ribosomal 
      protein.
    action: MODIFY
    reason: Use the compartment-neutral small ribosomal subunit term while noting the chloroplast location 
      separately.
    supported_by:
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: [DE]
      supporting_text: 'RecName: Full=Small ribosomal subunit protein uS3c'
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
    proposed_replacement_terms:
    - id: GO:0015935
      label: small ribosomal subunit
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: MGI:MGI:1350917
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: PANTHER:PTN000205057
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Donors include cytosolic ribosomal S3-family members; this plastid-encoded protein is part of
          the chloroplast ribosome, so the cytosolic subunit component should not transfer.
      - source_id: PomBase:SPBC16G5.14c
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: RGD:619888
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: SGD:S000005122
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P0A7V3
        source_label: E. coli 30S ribosomal protein S3 (RpsC)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P23396
        source_label: human RPS3
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:Q0Z8U2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:Q8IKH8
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: RNA binding is true of rps3 but says nothing about which RNA; the small ribosomal subunit rRNA
      binding term carried in this review entails it.
    action: TOO_GENERAL
    reason: This InterPro2GO row comes from the KH type-2 domain signatures (IPR004044, IPR009019), which
      support only generic RNA binding, so it does not by itself justify a MODIFY to rRNA binding (maintainer
      ruling on MODIFY). The review carries rRNA binding (UniRule row, refined to GO:0070181 small
      ribosomal subunit rRNA binding in the core functions), which entails this term; rps3 is a uS3 family
      (HAMAP MF_01309_B) member of the 30S subunit by similarity. Changed from MODIFY to TOO_GENERAL.
    supported_by:
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: DR   PROSITE; PS50823; KH_TYPE_2; 1.
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_01309_B; Ribosomal_uS3_B; 1.
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Structural constituent of ribosome is supported for this chloroplast ribosomal protein.
    action: ACCEPT
    reason: rps3 belongs to the universal ribosomal protein uS3 family (HAMAP MF_01309_B; SIMILARITY line)
      and is part of the 30S ribosomal subunit by similarity (ECO:0000250). Support is family membership,
      not a Populus experiment.
    supported_by:
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS3 family.'
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_01309_B; Ribosomal_uS3_B; 1.
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Translation is the core biological process for this plastid ribosomal protein.
    action: ACCEPT
    reason: As a uS3 family member (HAMAP MF_01309_B) that is part of the 30S subunit of the chloroplast
      ribosome by similarity, rps3 takes part in plastid translation. Support is family membership, not a
      Populus experiment.
    supported_by:
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_01309_B; Ribosomal_uS3_B; 1.
- term:
    id: GO:0009507
    label: chloroplast
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Chloroplast localization is correct for rps3.
    action: ACCEPT
    reason: UniProt places this ribosomal protein in the chloroplast.
    supported_by:
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
- term:
    id: GO:0019843
    label: rRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Generic rRNA binding is correct but less specific than small ribosomal subunit rRNA binding.
    action: MODIFY
    reason: The UniRule row derives from the uS3 family rule (HAMAP MF_01309_B), which applies only to
      30S-subunit proteins; by similarity rps3 is part of the 30S subunit, so the rRNA it binds is
      small-subunit rRNA and small ribosomal subunit rRNA binding is the precise term.
    supported_by:
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_01309_B; Ribosomal_uS3_B; 1.
    - reference_id: file:POPTR/rps3/rps3-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
    proposed_replacement_terms:
    - id: GO:0070181
      label: small ribosomal subunit rRNA binding
