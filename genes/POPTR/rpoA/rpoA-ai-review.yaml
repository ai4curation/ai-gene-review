id: A4GYU3
gene_symbol: rpoA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: >-
  Chloroplast plastid-encoded RNA polymerase alpha subunit that contributes to the
  PEP catalytic core for DNA-templated transcription in plastids.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Alpha binds promoter DNA through its C-terminal domain (UP elements).
    action: MODIFY
    reason: >-
      Correct but general. The alpha C-terminal domain binds UP elements, AT-rich
      promoter DNA upstream of the -35 hexamer, which is transcription cis-regulatory
      region binding (GO:0000976, an is_a descendant of DNA binding). The specific
      term is proposed as the replacement; it remains non-core to alpha's assembly
      role.
    proposed_replacement_terms:
    - id: GO:0000976
      label: transcription cis-regulatory region binding
    supported_by:
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      supporting_text: >-
        the C-terminal domain is involved in interaction with transcriptional regulators
        and with upstream promoter elements.
      record_section:
      - CC:DOMAIN
- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      Complex-level polymerase activity assigned to the non-catalytic plastid alpha
      subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Over-annotation from transferring the activity of the PEP core to every subunit.
      Alpha contributes no active-site residues: its N-terminal domain dimerizes and
      scaffolds core assembly, and the catalytic Mg(2+) site is in beta-prime. Applied
      identically to the bacterial alpha reviews (E. coli, B. subtilis, P. putida)
      and to the PTHR32108 family review (projects/PROTEIN_COMPLEX_FUNCTIONS.md).
    supported_by:
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      supporting_text: The N-terminal domain is essential for RNAP assembly and basal
      record_section:
      - CC:DOMAIN
  qualifier: contributes_to
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: >-
      Cytoplasm is a misleading ARBA localization for a plastid-encoded chloroplast
      RNA polymerase subunit.
    action: MODIFY
    reason: Use chloroplast localization from the reviewed entry.
    supported_by:
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
    proposed_replacement_terms:
    - id: GO:0009507
      label: chloroplast
- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: >-
      DNA-templated transcription is the direct biological process for plastid RNA
      polymerase rpoA.
    action: ACCEPT
    reason: >-
      The reviewed entry describes DNA-dependent RNA polymerase activity producing
      RNA from a DNA template.
    supported_by:
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        DNA-dependent RNA polymerase catalyzes the transcription of DNA into RNA using
        the four ribonucleoside triphosphates as substrates.
- term:
    id: GO:0009507
    label: chloroplast
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      Chloroplast localization is correct for this plastid-encoded RNA polymerase
      subunit.
    action: ACCEPT
    reason: The reviewed entry places rpoA in the chloroplast.
    supported_by:
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
- term:
    id: GO:0034062
    label: 5'-3' RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      5'-3' RNA polymerase activity reflects the RNA polymerase reaction but overstates
      the isolated subunit as the whole enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The catalytic reaction belongs to the plastid RNA polymerase complex, with rpoA
      contributing as one core subunit.
    supported_by:
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        DNA-dependent RNA polymerase catalyzes the transcription of DNA into RNA using
        the four ribonucleoside triphosphates as substrates.
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: >-
        In plastids the minimal PEP RNA polymerase catalytic core is composed of four
        subunits: alpha, beta, beta', and beta''.
- term:
    id: GO:0046983
    label: protein dimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Alpha homodimerizes through its N-terminal domain to nucleate PEP core assembly.
    action: ACCEPT
    reason: >-
      Subunit-specific function that explains alpha's role as the assembly platform
      of the plastid-encoded polymerase core; this is the core molecular function
      of the subunit.
    supported_by:
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      supporting_text: The N-terminal domain is essential for RNAP assembly and basal
      record_section:
      - CC:DOMAIN
- term:
    id: GO:0000428
    label: DNA-directed RNA polymerase complex
  evidence_type: IEA
  original_reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
  review:
    summary: rpoA is part of the plastid DNA-directed RNA polymerase complex.
    action: NEW
    reason: >-
      The existing GOA rows include chloroplast localization and polymerase activity
      but lack the complex annotation stated by UniProt.
    supported_by:
    - reference_id: file:POPTR/rpoA/rpoA-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: >-
        In plastids the minimal PEP RNA polymerase catalytic core is composed of four
        subunits: alpha, beta, beta', and beta''.
  qualifier: part_of
