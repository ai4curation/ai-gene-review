suggested_questions:
- question: >-
    Which chloroplast promoter classes in Populus depend most strongly on rpoA-containing
    PEP holoenzyme activity?
suggested_experiments:
- description: >-
    Perturb rpoA expression or editing and quantify chloroplast transcript initiation
    and accumulation by plastid RNA-seq.
  experiment_type: targeted functional assay
