id: A4GYR0
gene_symbol: psaA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: Photosystem I P700 chlorophyll a apoprotein A1, a chloroplast thylakoid membrane reaction-center
  subunit that binds PSI cofactors and supports light-driven electron transfer to ferredoxin.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  review:
    summary: Magnesium binding is a cofactor-related feature of PSI pigments but not the core annotation.
    action: KEEP_AS_NON_CORE
    reason: The core function is light-driven electron transfer in photosystem I.
    supported_by:
    - reference_id: file:POPTR/psaA/psaA-uniprot.txt
      supporting_text: P700 is a chlorophyll a/chlorophyll a prime dimer.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  review:
    summary: Electron transfer activity captures the reaction-center role of PsaA.
    action: ACCEPT
    reason: PsaA binds P700 and the early PSI electron acceptors that execute charge separation and electron
      transfer.
    supported_by:
    - reference_id: file:POPTR/psaA/psaA-uniprot.txt
      supporting_text: PsaA and PsaB bind P700 and the electron acceptors A0, A1 and FX.
- term:
    id: GO:0009535
    label: chloroplast thylakoid membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Chloroplast thylakoid membrane is the correct localization for PsaA.
    action: ACCEPT
    reason: The UniProt entry places PsaA in the chloroplast thylakoid membrane.
    supported_by:
    - reference_id: file:POPTR/psaA/psaA-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast thylakoid membrane.'
- term:
    id: GO:0009579
    label: thylakoid
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Thylakoid is correct but less precise than chloroplast thylakoid membrane.
    action: MODIFY
    reason: The reviewed protein is a multi-pass chloroplast thylakoid membrane protein.
    supported_by:
    - reference_id: file:POPTR/psaA/psaA-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast thylakoid membrane.'
    proposed_replacement_terms:
    - id: GO:0009535
      label: chloroplast thylakoid membrane
- term:
    id: GO:0015979
    label: photosynthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Photosynthesis is an appropriate biological process for a photosystem I reaction-center subunit.
    action: ACCEPT
    reason: PsaA is part of the photosynthetic electron transfer chain.
    supported_by:
    - reference_id: file:POPTR/psaA/psaA-uniprot.txt
      supporting_text: PSI is a plastocyanin-ferredoxin oxidoreductase.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Generic membrane is correct but too broad for a chloroplast thylakoid membrane PSI core protein.
    action: MODIFY
    reason: Use the specific chloroplast thylakoid membrane term.
    supported_by:
    - reference_id: file:POPTR/psaA/psaA-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast thylakoid membrane.'
    proposed_replacement_terms:
    - id: GO:0009535
      label: chloroplast thylakoid membrane
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: Generic metal ion binding is less informative than the specific PSI 4Fe-4S cofactor context.
    action: MODIFY
    reason: The UniProt entry describes the FX 4Fe-4S iron-sulfur center bound by the PSI reaction center.
    supported_by:
    - reference_id: file:POPTR/psaA/psaA-uniprot.txt
      supporting_text: FX is a shared 4Fe-4S iron-sulfur center.
    proposed_replacement_terms:
    - id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: mRNA binding is an experimentally supported but functionally uncharacterized moonlighting
      association for the Arabidopsis ortholog; retain as non-core rather than as a core function of the
      photosystem I reaction center.
    action: KEEP_AS_NON_CORE
    reason: The GO_REF:0000107 projection traces to Arabidopsis plastid psaA (UniProtKB:P56766), whose
      GO:0003729 IDA comes from the PMID:32344669 leaf RNA-interactome capture. That study controls for
      abundance with paired crosslinked/non-crosslinked samples and devotes section 3.8 to defending
      photosynthetic-apparatus hits as bona fide RNA associations, so the donor evidence cannot be dismissed
      as an artifact. The functional significance of the association is nevertheless unknown (the paper itself
      presents these proteins as moonlighting RNA binders), and because the assay captures poly(A) RNA with
      oligo(dT) while plastid-encoded transcripts are not stably polyadenylated, the physiological RNA partner
      of this plastid-encoded protein remains unresolved. Section 3.8 reports thirteen PSI proteins among the
      leaf RBPs. Retained as non-core, consistently with the atpI and rps4 rows that derive from this same screen.
    supported_by:
    - reference_id: file:POPTR/psaA/psaA-uniprot.txt
      supporting_text: 'RecName: Full=Photosystem I P700 chlorophyll a apoprotein A1.'
    - reference_id: PMID:32344669
      supporting_text: we identified 18 proteins from PSII, 13 from PSI, 3 from the cytochrome b6f complex and
        6 from the F-ATPase complex to be associating with RNA
      reference_section_type: OTHER
    - reference_id: PMID:32344669
      supporting_text: the intensity of most of these photosynthetic proteins in ptRIC was relatively high,
        suggesting that these were bona fide RBPs
      reference_section_type: OTHER
    - reference_id: PMID:32344669
      supporting_text: RIC employs ultraviolet (UV) irradiation of cells to promote RNA-to-protein
        crosslinking, followed by capture of poly(A) RNAs with oligo(dT) under denaturing conditions
      reference_section_type: OTHER
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:P56766
        source_label: Arabidopsis photosystem I P700 apoprotein A1 (psaA)
        source_status: SUPPORTS_TRANSFER
        comment: Donor IDA is defended by the paper's paired CL/NoCL abundance controls and its section 3.8 on
          photosynthetic-apparatus RBPs; the functional significance and the physiological RNA partner
          (oligo(dT) poly(A) capture vs non-polyadenylated plastid transcripts) remain open, so the annotation
          transfers as a non-core association, not a core function.
      - source_id: araport11:ATCG00350.1
        source_status: SUPPORTS_TRANSFER
