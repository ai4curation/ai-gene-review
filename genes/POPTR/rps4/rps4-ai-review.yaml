- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: mRNA binding is an experimentally supported but functionally uncharacterized moonlighting
      association for the Arabidopsis ortholog; retain as non-core rather than as a core function of the small
      ribosomal subunit.
    action: KEEP_AS_NON_CORE
    reason: The GO_REF:0000107 projection traces to Arabidopsis plastid rps4 (UniProtKB:P56799), whose
      GO:0003729 IDA comes from the PMID:32344669 leaf RNA-interactome capture. That study controls for
      abundance with paired crosslinked/non-crosslinked samples and devotes section 3.8 to defending
      photosynthetic-apparatus hits as bona fide RNA associations, so the donor evidence cannot be dismissed
      as an artifact. The functional significance of the association is nevertheless unknown (the paper itself
      presents these proteins as moonlighting RNA binders), and because the assay captures poly(A) RNA with
      oligo(dT) while plastid-encoded transcripts are not stably polyadenylated, the physiological RNA partner
      of this plastid-encoded protein remains unresolved. For a small-subunit ribosomal protein the
      association is additionally supported by intrinsic rRNA/mRNA contacts during translation. Retained as
      non-core, consistently with the psaA and atpI rows that derive from this same screen.
    supported_by:
    - reference_id: file:POPTR/rps4/rps4-uniprot.txt
      supporting_text: DR   GO; GO:0003729; F:mRNA binding; IEA:EnsemblPlants.
    - reference_id: file:POPTR/rps4/rps4-goa.tsv
      supporting_text: "enables\tGO:0003729\tmRNA binding"
    - reference_id: PMID:32344669
      supporting_text: we identified 18 proteins from PSII, 13 from PSI, 3 from the cytochrome b6f complex and
        6 from the F-ATPase complex to be associating with RNA
      reference_section_type: OTHER
    - reference_id: PMID:32344669
      supporting_text: the intensity of most of these photosynthetic proteins in ptRIC was relatively high,
        suggesting that these were bona fide RBPs
      reference_section_type: OTHER
    - reference_id: PMID:32344669
      supporting_text: RIC employs ultraviolet (UV) irradiation of cells to promote RNA-to-protein
        crosslinking, followed by capture of poly(A) RNAs with oligo(dT) under denaturing conditions
      reference_section_type: OTHER
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:P56799
        source_label: Arabidopsis chloroplast 30S ribosomal protein S4 (rps4)
        source_status: SUPPORTS_TRANSFER
        comment: Donor IDA is defended by the paper's paired CL/NoCL abundance controls and its section 3.8 on
          photosynthetic-apparatus RBPs; the functional significance and the physiological RNA partner
          (oligo(dT) poly(A) capture vs non-polyadenylated plastid transcripts) remain open, so the annotation
          transfers as a non-core association, not a core function.
      - source_id: araport11:ATCG00380.1
        source_status: SUPPORTS_TRANSFER
