taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: POPTR_001G068100 (Potri.001G068100) is the poplar ortholog of Arabidopsis IRREGULAR
  XYLEM 10 (IRX10), a glycosyltransferase family 47 (GT47) beta-1,4-xylan synthase. It shares
  PANTHER subfamily SF370 with AtIRX10 and is about 91% identical to it, with an N-terminal
  signal/anchor segment and a GT47 catalytic domain. By orthology it elongates the xylan backbone
  of glucuronoxylan in the Golgi, the main hemicellulose of poplar wood. Poplar has a duplicated
  IRX10 pair (POPTR_001G068100 and POPTR_003G162000). No experimental study of this gene was
  found; the functional statements rest on the conserved activity of the IRX10 clade across
  land plants and a charophyte alga.
