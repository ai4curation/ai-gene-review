  review:
    summary: Glycoprotein biosynthesis mapped from the exostosin (GT47) InterPro signature.
    action: REMOVE
    reason: InterPro2GO maps the exostosin signature (IPR004263) to glycoprotein biosynthesis
      because animal exostosins make heparan sulfate on proteoglycan core proteins. IRX10-clade
      enzymes polymerise free xylan onto xylooligosaccharide acceptors; no protein acceptor
      is involved. Removed as in the Arabidopsis and rice IRX10 reviews.
    supported_by:
