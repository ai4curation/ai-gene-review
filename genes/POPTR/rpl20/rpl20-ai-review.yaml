- term:
    id: GO:0019843
    label: rRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: Generic rRNA binding is correct but less specific than large ribosomal subunit rRNA
      binding.
    action: MODIFY
    reason: UniProt states that L20 binds directly to 23S rRNA during 50S/large-subunit assembly,
      so the large-ribosomal-subunit rRNA binding term is more precise.
    supported_by:
    - reference_id: file:POPTR/rpl20/rpl20-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Binds directly to 23S ribosomal RNA and is necessary for the in vitro 
        assembly process of the 50S ribosomal subunit.
    proposed_replacement_terms:
    - id: GO:0070180
      label: large ribosomal subunit rRNA binding
