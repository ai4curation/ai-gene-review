description: 'Chloroplast large ribosomal subunit protein bL20c that binds 23S rRNA and supports 50S/large-ribosomal-subunit
  assembly.'
existing_annotations:
- term:
    id: GO:0015934
    label: large ribosomal subunit
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: rpl20 is part of the chloroplast large ribosomal subunit.
    action: ACCEPT
    reason: Family evidence (HAMAP rule MF_00382), no Populus experiment. The curated HAMAP-derived 
      FUNCTION text says bL20 binds 23S rRNA and is needed to assemble the 50S subunit, and the record 
      places it in the bacterial bL20 family, a large-subunit protein family; the IBA node agrees.
    supported_by:
    - reference_id: file:POPTR/rpl20/rpl20-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Binds directly to 23S ribosomal RNA and is necessary for the in vitro assembly process of the 50S ribosomal subunit.'
    - reference_id: file:POPTR/rpl20/rpl20-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the bacterial ribosomal protein bL20 family.'
  qualifier: part_of
- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Structural constituent of ribosome is supported for this chloroplast large-subunit 
      protein.
    action: ACCEPT
    reason: Family evidence (HAMAP rule MF_00382), no Populus experiment. rpl20 belongs to the 
      bacterial bL20 family, whose members bind 23S rRNA directly and are built into the 50S subunit, 
      as the HAMAP-derived FUNCTION text states.
    supported_by:
    - reference_id: file:POPTR/rpl20/rpl20-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the bacterial ribosomal protein bL20 family.'
