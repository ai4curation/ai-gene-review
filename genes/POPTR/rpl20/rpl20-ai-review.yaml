- term:
    id: GO:0005840
    label: ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Ribosome is correct but less specific than large ribosomal subunit.
    action: MODIFY
    reason: Correct but general. The bL20 family signatures behind this InterPro2GO row identify a 
      large-subunit protein, and the HAMAP-derived FUNCTION text ties it to the 50S subunit, so the row's 
      own family evidence supports GO:0015934 large ribosomal subunit (part_of ribosome), which this 
      review accepts on the IBA row. Changed from KEEP_AS_NON_CORE, which the guidelines reserve for 
      terms that are as precise as warranted.
    supported_by:
    - reference_id: file:POPTR/rpl20/rpl20-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'Binds directly to 23S ribosomal RNA and is necessary for the in vitro assembly process of the 50S ribosomal subunit.'
    - reference_id: file:POPTR/rpl20/rpl20-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the bacterial ribosomal protein bL20 family.'
    proposed_replacement_terms:
    - id: GO:0015934
      label: large ribosomal subunit
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Translation is broad for rpl20 because its directly described role is 50S subunit 
      assembly.
    action: KEEP_AS_NON_CORE
    reason: Retain translation as broad ribosomal context, but do not make it core because UniProt 
      explicitly says L20 is not involved in the protein-synthesizing functions of the subunit; the
      Populus entry is homology-inferred, so future Populus-specific data could refine this.
    supported_by:
    - reference_id: file:POPTR/rpl20/rpl20-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: It is not involved in the protein synthesizing functions of that subunit.
    - reference_id: file:POPTR/rpl20/rpl20-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Binds directly to 23S ribosomal RNA and is necessary for the in vitro 
        assembly process of the 50S ribosomal subunit.
- term:
    id: GO:0009507
    label: chloroplast
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Chloroplast localization is correct for rpl20.
    action: ACCEPT
    reason: UniProt places rpl20 in the chloroplast.
    supported_by:
