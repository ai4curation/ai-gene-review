core_functions:
- description: Catalyzes the chloroplast lipoyl synthase reaction, converting octanoylated protein
    domains into lipoylated derivatives during lipoate biosynthesis and protein lipoylation.
  molecular_function:
    id: GO:0016992
    label: lipoate synthase activity
  directly_involved_in:
  - id: GO:0009249
    label: protein lipoylation
  locations:
  - id: GO:0009507
    label: chloroplast
  supported_by:
  - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
    supporting_text: 'FUNCTION: Catalyzes the radical-mediated insertion of two sulfur atoms into the
      octanoyl moiety bound to lipoyl domains.'
  - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
    supporting_text: 'CATALYTIC ACTIVITY: EC=2.8.1.8.'
  - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
- description: >-
    Binds the catalytic radical SAM [4Fe-4S] cluster through the CxxxCxxC motif; its unique iron coordinates
    the S-adenosyl-L-methionine that is reductively cleaved to the 5'-deoxyadenosyl radical starting every
    turnover of lipoate synthase activity. A second [4Fe-4S] cluster is the sacrificial source of the
    two sulfur atoms inserted into the octanoyl chain.
  molecular_function:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  supported_by:
  - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
    record_section: ["CC:COFACTOR"]
    supporting_text: Note=Binds 2 [4Fe-4S] clusters per subunit. One cluster is coordinated
  - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
    record_section: ["CC:COFACTOR"]
    supporting_text: cysteines and an exchangeable S-adenosyl-L-methionine
- description: >-
    Binds S-adenosyl-L-methionine as the radical-generating cosubstrate at the unique iron of the [4Fe-4S]
    cluster: two SAM are consumed per lipoyl group formed.
  molecular_function:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  supported_by:
  - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
    record_section: ["CC:COFACTOR"]
    supporting_text: cysteines and an exchangeable S-adenosyl-L-methionine
  - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
    record_section: ["FT:BINDING"]
    supporting_text: /ligand_note="4Fe-4S-S-AdoMet"
