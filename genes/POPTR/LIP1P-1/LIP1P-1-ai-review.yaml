- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IC
  original_reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      LIP1P-1 binds S-adenosyl-L-methionine at the unique iron of its radical SAM [4Fe-4S] cluster and
      cleaves it to the 5'-deoxyadenosyl radical; two SAM are consumed per lipoyl group formed.
    action: NEW
    reason: >-
      Not in GOA. Added under the RADICAL_SAM treatment rule, which treats GO:1904047 as a core cosubstrate-binding
      function of every radical SAM enzyme whose catalysis is established. This is a molecular function
      the protein itself performs, so the participation test is met directly: LIP1P-1 binds SAM and cleaves
      it, rather than merely being required for a process that consumes it. UniProt's curated cofactor
      note records the exchangeable S-adenosyl-L-methionine on the radical SAM cluster and the entry's
      binding features name the 4Fe-4S-S-AdoMet ligand, so the claim rests on curated record content rather
      than on an electronic GO line. Coded IC because the inference is the reviewer's, drawn from that
      curated content and the established lipoate synthase activity rather than from a SAM-binding assay
      on this protein. Comparator check: the same NEW row was added to human LIAS and to 17 other active
      members in this project, and 18 of the 20 members with established catalysis were found to be missing
      it in GOA.
    supported_by:
    - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 2 [4Fe-4S] clusters per subunit. One cluster is coordinated
    - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: cysteines and an exchangeable S-adenosyl-L-methionine
    - reference_id: file:POPTR/LIP1P-1/LIP1P-1-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand_note="4Fe-4S-S-AdoMet"
