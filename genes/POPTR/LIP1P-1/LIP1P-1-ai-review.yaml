    summary: Lipoate biosynthetic process described the core process for LIP1P-1, but GO:0009107 was
      obsoleted (2026-08-22) in favor of protein lipoylation.
    action: MODIFY
    reason: LIP1P-1 catalyzes the sulfur-insertion step of endogenous protein lipoylation;
