reference_proteome_record:
  id: UP000006729
  description: "Populus trichocarpa (Black cottonwood) is a fast growing deciduous tree belonging to the willow\
    \ family (Salicaceae) which is grown for its timber and for fiber products, mainly in North America. \n\nThe\
    \ genus Populus is widely distributed over the northern hemisphere with many species that are economically important.\
    \ Populus trichocarpa was chosen as the first tree to be sequenced because of the relatively small size of its\
    \ genome. \n\nThe Populus trichocarpa genome has a haploid chromosome number of 19, and with over 400 Mb is\
    \ nearly four times larger than the genome of Arabidopsis. There are 44,000 protein-coding genes. About 8,000\
    \ pairs of duplicated genes are present due to an early genome duplication event."
