- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: mRNA binding is not a supported core or accessory function for the atpI proton-channel subunit of
      chloroplast ATP synthase.
    action: REMOVE
    reason: The GO_REF:0000107 projection traces to Arabidopsis plastid atpI (UniProtKB:P56758), whose
      GO:0003729 IDA comes from a single proteome-wide leaf RNA-interactome capture screen (PMID:32344669);
      such UV-crosslinking screens flag many abundant membrane proteins and do not establish a per-protein
      mRNA-binding function. No RNA-binding role is known for this integral-membrane proton-channel subunit,
      so the transferred annotation is removed, consistent with the psaA review of the same projection. rps4
      retains its equivalent row as non-core because ribosomal proteins have intrinsic rRNA/mRNA contacts that
      make retention defensible there.
    supported_by:
    - reference_id: file:POPTR/atpI/atpI-goa.tsv
      supporting_text: "enables\tGO:0003729\tmRNA binding"
    - reference_id: PMID:32344669
      supporting_text: the full complement of RBPs has only recently begun to be uncovered through
        proteome-wide approaches such as RNA interactome capture (RIC)
      reference_section_type: OTHER
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:P56758
        source_label: Arabidopsis chloroplast ATP synthase subunit a (atpI)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Donor IDA is a single high-throughput RNA-interactome capture screen (PMID:32344669), weak
          evidence for transferring a per-protein mRNA-binding function to an integral thylakoid membrane
          protein.
      - source_id: araport11:ATCG00150.1
        source_status: SOURCE_WEAK_OR_INFERRED
