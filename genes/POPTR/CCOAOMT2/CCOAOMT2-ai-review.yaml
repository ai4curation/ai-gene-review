id: O65922
gene_symbol: CCOAOMT2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: Caffeoyl-CoA O-methyltransferase that methylates caffeoyl-CoA and 5-hydroxyferuloyl-CoA in phenylpropanoid/lignin
  metabolism.
alternative_records:
- id: A0A2K2C664
  relationship: REFERENCE_PROTEOME_EQUIVALENT
  reference_proteome: UP000006729
  reviewed_on: '2026-10-19'
  reason: Retain O65922 as the preferred Swiss-Prot accession. A0A2K2C664 represents the same protein
    sequence at the corresponding reference-proteome locus, supported by exact sequence identity and a
    shared Gramene identifier. The source cultivars differ; this relationship does not assert that all
    GO annotations can be transferred automatically.
  evidence:
  - type: SEQUENCE_COMPARISON
    description: The current Swiss-Prot and TrEMBL records have identical full-length 247-residue sequences
      and share UniParc UPI00000ACED6.
    supported_by:
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-record-evidence.yaml
      supporting_text: |-
        sequence_identical: true
          primary_sequence_length: 247
          alternative_sequence_length: 247
          shared_uniparc_id: UPI00000ACED6
  - type: LOCUS_MAPPING
    description: Both current records cross-reference Gramene Potri.001G304800.1.v4.1; the Swiss-Prot
      record also has this EnsemblPlants identifier, and the reference-proteome entry names locus POPTR_001G304800.
      This independently supports the counterpart assignment.
    supported_by:
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-record-evidence.yaml
      supporting_text: |-
        database: Gramene
            id: Potri.001G304800.1.v4.1
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-record-evidence.yaml
      supporting_text: 'value: POPTR_001G304800'
  - type: PROTEOME_MEMBERSHIP
    description: The live UniProt records and proteome metadata place A0A2K2C664, but not O65922, in reference
      proteome UP000006729 for the same taxon (NCBITaxon:3694).
    supported_by:
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-record-evidence.yaml
      supporting_text: |-
        reference_proteome: UP000006729
          proteome_is_reference: true
          proteome_taxon_matches: true
          primary_in_reference_proteome: false
          alternative_in_reference_proteome: true
  - type: RECORD_HISTORY
    description: UniSave entry versions 90 (2015), 119 (2020), and 130 (2024) have no Proteomes cross-reference.
      These samples establish longstanding absence at those dates, not a recent dropout or uninterrupted
      absence between samples; they do not explain why UniProt omitted the association.
    supported_by:
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-record-evidence.yaml
      supporting_text: |-
        sampled_history_versions:
          - 90
          - 119
          - 130
          sampled_versions_with_proteome_links: []
  - type: CURATION_CONTEXT
    description: The Swiss-Prot source material is cultivar Trichobel, whereas the reference proteome
      represents cultivar Nisqually. This provides context for separate records but does not establish
      UniProt's reason for keeping the Swiss-Prot accession outside the proteome.
    supported_by:
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-record-evidence.yaml
      supporting_text: RC   STRAIN=cv. Trichobel; TISSUE=Xylem;
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-record-evidence.yaml
      supporting_text: 'strain: cv. Nisqually'
existing_annotations:
- term:
    id: GO:0008171
    label: O-methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: O-methyltransferase activity is correct but too broad for a characterized caffeoyl-CoA O-methyltransferase.
    action: MODIFY
    reason: Use the specific EC/Rhea-supported caffeoyl-CoA O-methyltransferase term.
    supported_by:
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-uniprot.txt
      supporting_text: 'RecName: Full=Caffeoyl-CoA O-methyltransferase; EC=2.1.1.104.'
    proposed_replacement_terms:
    - id: GO:0042409
      label: caffeoyl-CoA O-methyltransferase activity
- term:
    id: GO:0042409
    label: caffeoyl-CoA O-methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: Caffeoyl-CoA O-methyltransferase activity is the core molecular function.
    action: ACCEPT
    reason: The UniProt entry and EC assignment match this term directly.
    supported_by:
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-uniprot.txt
      supporting_text: Reaction=(E)-caffeoyl-CoA + S-adenosyl-L-methionine = (E)-feruloyl-CoA + S-adenosyl-L-homocysteine
        + H(+).
- term:
    id: GO:0009699
    label: phenylpropanoid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  review:
    summary: Phenylpropanoid biosynthesis is correct but less specific than the experimentally supported lignin-biosynthesis
      role of Populus CCoAOMT.
    action: MODIFY
    reason: The Populus xylem down-regulation study directly links CCoAOMT to lignin amount, while the reviewed
      entry also supports feruloylated-polysaccharide/cell-wall reinforcement roles.
    supported_by:
    - reference_id: PMID:10934215
      supporting_text: To clarify the in vivo role of CCoAOMT in lignin biosynthesis, transgenic poplars with 10%
        residual CCoAOMT protein levels in the stem xylem were generated.
      reference_section_type: ABSTRACT
    - reference_id: PMID:10934215
      supporting_text: the affected transgenic lines had a 12% reduced Klason lignin content
      reference_section_type: ABSTRACT
    - reference_id: file:POPTR/CCOAOMT2/CCOAOMT2-uniprot.txt
      supporting_text: DR   GO; GO:0009809; P:lignin biosynthetic process; IEA:UniProtKB-KW.
    proposed_replacement_terms:
    - id: GO:0009809
      label: lignin biosynthetic process
