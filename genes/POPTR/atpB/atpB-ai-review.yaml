- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Proton transport is a core process of the coupled ATP synthase complex.
    action: ACCEPT
    reason: The beta subunit performs the catalytic work coupled to rotor movement and proton flow through
      CF0. A biological-process annotation can cover participating catalytic subunits without requiring each
      subunit to constitute the proton channel. Its direct contribution to energy transduction makes this core.
    supported_by:
    - reference_id: file:POPTR/atpB/atpB-uniprot.txt
      supporting_text: F-type ATPases have 2 components, CF(1) - the catalytic core - and CF(0) - the membrane
        proton channel.
    - reference_id: file:POPTR/atpB/atpB-uniprot.txt
      supporting_text: Produces ATP from ADP in the presence of a proton gradient across the membrane. The
        catalytic sites are hosted primarily by the beta subunits.
- term:
    id: GO:0046961
    label: proton-transporting ATPase activity, rotational mechanism
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Retain reversible ATP-hydrolysis capacity as a regulated secondary activity.
    action: KEEP_AS_NON_CORE
    reason: Chloroplast F1 is hydrolytically active when released from inhibition in the primary spinach study;
      redox regulation of the gamma subunit controls reversal. ATP synthesis is the predominant physiological
      activity, but replacing a demonstrated reverse reaction by the synthesis term is not a granularity correction.
      Retain the ancestral capability at complex level; this is not an assay of isolated Populus beta or proof
      of vacuolar localization.
    supported_by:
    - reference_id: PMID:29748256
      supporting_text: When detached from Fo by detergent, F1 was hydrolytically active (Fig. S1B-D).
    - reference_id: PMID:32879423
      supporting_text: synthase in both reduced and oxidized states.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: MGI:MGI:1201780
        source_status: SUPPORTS_TRANSFER
      - source_id: PANTHER:PTN000389800
        source_status: SUPPORTS_TRANSFER
        comment: Chloroplast F1 is hydrolytically active when released from inhibition in the primary spinach
