          physiological activity, but replacing a demonstrated reverse reaction by the synthesis term is not
          a granularity correction. Retain the ancestral capability at complex level; this is not an assay
          of isolated Populus beta or proof of vacuolar localization.
      - source_id: SGD:S000002344
