    label: vacuolar membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Vacuolar membrane is a misleading IBA transfer from non-chloroplast ATPase biology.
    action: REMOVE
    reason: The reviewed atpB entry places this plastid-encoded ATP synthase beta subunit at the chloroplast
      thylakoid membrane, not the vacuolar membrane.
    supported_by:
    - reference_id: file:POPTR/atpB/atpB-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast thylakoid membrane'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: CGD:CAL0000187512
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: PANTHER:PTN000389801
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'Donors are V-type ATPase catalytic subunit A paralogs (the V1 counterpart of F1 beta) annotated
          to the tonoplast/vacuole; the plastid-encoded F-ATP synthase beta subunit resides in the chloroplast thylakoid
          membrane, so vacuolar localization must not transfer across the F1/V1 paralog split. Family-level context:
          interpro/panther/PTHR15184/PTHR15184-review.yaml -- its notes record that PTN000389801 is absent from
          the cached PAINT slice (the vacuolar assertions appear re-curated onto PTN000389802/PTN000389877) and
          deliberately leave this node unassessed; the PTN000389877 plant-type-vacuole assessment adjudicates the
          equivalent leak.'
      - source_id: SGD:S000002344
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P31404
        source_label: bovine V-type proton ATPase catalytic subunit A
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P31405
        source_label: cotton V-type proton ATPase catalytic subunit A
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P38606
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      residue_claims_not_applicable: 'The failure is a paralog-boundary question (F1-beta versus V1-A direction
        and localization), not a point-residue one: both branches conserve the Walker nucleotide-binding machinery.
        See interpro/panther/PTHR15184/PTHR15184-review.yaml.'
- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Proton transmembrane transport is part of ATP synthase complex function but is not the isolated
      beta subunit's most direct role.
    action: KEEP_AS_NON_CORE
    reason: The beta subunit is in the CF1 catalytic core; ATP synthesis is coupled to proton movement through
      CF0.
    supported_by:
    - reference_id: file:POPTR/atpB/atpB-uniprot.txt
      supporting_text: F-type ATPases have 2 components, CF(1) - the catalytic core - and CF(0) - the membrane
        proton channel.
    - reference_id: file:POPTR/atpB/atpB-uniprot.txt
      supporting_text: Produces ATP from ADP in the presence of a proton gradient across the membrane. The
        catalytic sites are hosted primarily by the beta subunits.
- term:
    id: GO:0046961
    label: proton-transporting ATPase activity, rotational mechanism
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The ATPase term is directionally related but less appropriate than ATP synthase activity for
      chloroplast atpB.
    action: MODIFY
    reason: Rotational ATPase (hydrolysis-direction) capability is real for F1-beta subunits (the human
      ortholog carries direct experimental evidence for it), but for the chloroplast enzyme the physiological
      and better primary annotation is the synthesis-direction term GO:0046933; narrow rather than remove.
    supported_by:
    - reference_id: file:POPTR/atpB/atpB-uniprot.txt
      supporting_text: Produces ATP from ADP in the presence of a proton gradient across the membrane. The
        catalytic sites are hosted primarily by the beta subunits.
    proposed_replacement_terms:
    - &id001
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:1201780
        source_status: SUPPORTS_TRANSFER
      - source_id: PANTHER:PTN000389800
        source_status: SUPPORTS_TRANSFER
        comment: 'Rotational ATPase capability is genuinely shared across the family -- the human SF71 member ATP5F1B
          carries a direct IMP annotation for this term (cell-surface ecto-ATP synthase hydrolysis) and chloroplast
          CF1 has a latent redox-regulated ATPase activity -- so the node placement is sound; for a chloroplast
          F-ATP synthase beta subunit the synthesis-direction term GO:0046933 is the better primary annotation,
          which is a term-granularity preference, not a bad propagation. Family-level adjudication: interpro/panther/PTHR15184/PTHR15184-review.yaml
          (PTN000389800 node assessment).'
      - source_id: SGD:S000002344
        source_status: SUPPORTS_TRANSFER
      residue_claims_not_applicable: 'The failure is a paralog-boundary question (F1-beta versus V1-A direction
        and localization), not a point-residue one: both branches conserve the Walker nucleotide-binding machinery.
        See interpro/panther/PTHR15184/PTHR15184-review.yaml.'
