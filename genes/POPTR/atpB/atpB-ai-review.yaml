id: A4GYR7
gene_symbol: atpB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: Chloroplast-encoded catalytic beta subunit of the thylakoid F-type ATP synthase. Its nucleotide-binding
  catalytic sites couple rotary motion to ATP synthesis from ADP and phosphate. The chloroplast enzyme is reversible,
  with ATP hydrolysis subject to redox-dependent inhibition.
existing_annotations:
- term:
    id: GO:0005774
    label: vacuolar membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The vacuolar membrane IBA is a V-type ATPase localization propagated
      onto a chloroplast F1-beta subunit.
    action: REMOVE
    reason: atpB is chloroplast-genome encoded and UniProt places the peripheral CF1
      beta subunit at the chloroplast thylakoid membrane. The focused report traced
      the related vacuolar V1-domain IBA on live A4GYR7 to V-type ATPase catalytic
      subunit A donors, including P38606 and P31404; no F-type ATP synthase donor
      supports a functional vacuolar pool. Treat the historical vacuolar membrane
      row as a compartment overpropagation from shared F1/V1/A1 catalytic-subunit
      ancestry.
    supported_by:
    - reference_id: file:POPTR/atpB/atpB-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast thylakoid membrane'
    - reference_id: file:POPTR/atpB/atpB-hypotheses/f1-beta-vacuolar-localization-and-ancestral-scope/openscientist.md
      supporting_text: The vacuolar term was therefore transferred onto the chloroplast
        beta subunit **directly from V1-A donor annotations**
      reference_section_type: RESULTS
    propagation_review:
