description: Chloroplast-encoded catalytic beta subunit of the thylakoid F-type ATP synthase. Its nucleotide-binding
  catalytic sites couple rotary motion to ATP synthesis from ADP and phosphate. The chloroplast enzyme is reversible,
  with ATP hydrolysis subject to redox-dependent inhibition.
