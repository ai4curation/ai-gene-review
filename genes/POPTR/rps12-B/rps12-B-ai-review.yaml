  label: Populus trichocarpa
description: Chloroplast small ribosomal subunit protein uS12cy that contributes to plastid ribosome
  structure, rRNA binding, and translation.
existing_annotations:
- term:
    id: GO:0006412
    label: translation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review: &id002
    summary: Translation is the correct biological process for a chloroplast ribosomal protein.
    action: ACCEPT
    reason: The protein functions in the chloroplast ribosome and supports plastid translation.
    supported_by:
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: With S4 and S5 plays an important role in translational accuracy.
- term:
    id: GO:0005840
    label: ribosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review: &id001
    summary: Ribosome is correct for rps12-B but less specific than the small ribosomal subunit term this review carries.
    action: MODIFY
    reason: >-
      Correct but general. The uS12 family membership behind this row (HAMAP MF_00403_B) identifies a 30S-subunit protein, so the row's own
      family evidence supports GO:0015935 small ribosomal subunit (part_of ribosome), which this review already
      carries. Changed from KEEP_AS_NON_CORE, as for the other POPTR
      ribosomal-protein reviews.
    proposed_replacement_terms:
    - id: GO:0015935
      label: small ribosomal subunit
    supported_by:
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Part of the 30S ribosomal subunit.
- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Structural constituent of ribosome is the core molecular function for a chloroplast 
      ribosomal protein.
    action: ACCEPT
    reason: 'Family and by-similarity evidence: rps12-B belongs to the universal ribosomal protein uS12 family and, by similarity, is part of the 30S subunit; no Populus-specific experiment.'
    supported_by:
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS12 family.'
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
- term:
    id: GO:0005840
    label: ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review: *id001
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review: *id002
- term:
    id: GO:0009507
    label: chloroplast
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Chloroplast localization is correct for this plastid-encoded ribosomal protein.
    action: ACCEPT
    reason: The UniProt entry places the protein in the chloroplast.
    supported_by:
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast'
- term:
    id: GO:0015935
    label: small ribosomal subunit
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: rps12-B is part of the chloroplast small ribosomal subunit.
    action: ACCEPT
    reason: By similarity, UniProt records rps12-B as part of the 30S ribosomal subunit, consistent with uS12-family (HAMAP MF_00403_B) membership; no Populus-specific experiment.
    supported_by:
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: 'DR   HAMAP; MF_00403_B; Ribosomal_uS12_B; 1.'
  qualifier: part_of
- term:
    id: GO:0019843
    label: rRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: rRNA binding is accepted as a UniProtKB-UniRule family annotation for chloroplast 
      uS12/rps12 proteins.
    action: ACCEPT
    reason: 'The rps12-B entry lacks a protein-specific rRNA-contact statement, so this ACCEPT rests on family membership: the uS12-family rule (HAMAP MF_00403_B) transfers rRNA binding to members. Not experimental for Populus.'
    supported_by:
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: 'DR   HAMAP; MF_00403_B; Ribosomal_uS12_B; 1.'
    - reference_id: file:POPTR/rps12-B/rps12-B-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS12 family.'
