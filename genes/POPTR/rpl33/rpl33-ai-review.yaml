      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
- term:
    id: GO:0015934
    label: large ribosomal subunit
  evidence_type: IEA
  original_reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
  review:
    summary: rpl33 is part of the chloroplast large ribosomal subunit.
    action: NEW
    reason: rpl33 belongs to the bacterial ribosomal protein bL33 family (HAMAP MF_00294) and the PANTHER
      large-subunit bL33c subfamily (PTHR43168:SF2); bL33 is a 50S/large-subunit protein, while the source
      GOA rows include only the generic ribosome term. Support is family classification; the record has no
      curated SUBUNIT line.
    supported_by:
    - reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the bacterial ribosomal protein bL33 family.'
    - reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00294; Ribosomal_bL33; 1.
    - reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR43168:SF2; LARGE RIBOSOMAL SUBUNIT PROTEIN BL33C; 1.
