existing_annotations:
- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Structural constituent of ribosome is the core molecular function for rpl33.
    action: ACCEPT
    reason: rpl33 belongs to the bacterial ribosomal protein bL33 family (HAMAP MF_00294; SIMILARITY line),
      whose members are structural proteins of the 50S ribosomal subunit. Support is family membership,
      not a Populus experiment.
    supported_by:
    - reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the bacterial ribosomal protein bL33 family.'
    - reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00294; Ribosomal_bL33; 1.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: Cytoplasm is too broad and misleading for this plastid-encoded ribosomal protein.
    action: MODIFY
    reason: Use the chloroplast location supported by UniProt.
    supported_by:
    - reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
    proposed_replacement_terms:
    - id: GO:0009507
      label: chloroplast
- term:
    id: GO:0005840
    label: ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Ribosome is true of rpl33 but does not say which ribosome or subunit; the large ribosomal
      subunit term added in this review entails it.
    action: TOO_GENERAL
    reason: rpl33 is a bL33 family member (HAMAP MF_00294) classified with the large-subunit bL33c
      subfamily (PANTHER PTHR43168:SF2), so the large ribosomal subunit term added here (GO:0015934, part_of
      ribosome) entails this generic ribosome term. The claim is correct, but imprecise on its own.
    supported_by:
    - reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the bacterial ribosomal protein bL33 family.'
    - reference_id: file:POPTR/rpl33/rpl33-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR43168:SF2; LARGE RIBOSOMAL SUBUNIT PROTEIN BL33C; 1.
