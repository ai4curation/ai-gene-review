      supporting_text: pumps approximately two protons
- term:
    id: GO:0048039
    label: ubiquinone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Ubiquinone binding is wrong for plastid NdhD by subunit topology and
      quinone chemistry.
    action: REMOVE
    reason: NdhD is the plastid NuoM/ND4 antiporter-like membrane-arm subunit. The
      spinach NDH-PSI-LHCI structure places the plastoquinone pocket in NdhA/H/K,
      and plants use plastoquinone rather than ubiquinone as the physiological
      acceptor. Whole-complex quinone reduction should not be propagated as intrinsic
      ubiquinone binding by this distal proton-translocation subunit.
    supported_by:
    - reference_id: PMID:39856350
      supporting_text: The PQ-binding pocket is formed by subunits NdhA, NdhH and NdhK
    - reference_id: file:POPTR/ndhD/ndhD-hypotheses/chlororespiratory-capacity-and-subunit-quinone-binding/openscientist.md
      supporting_text: The GO:0048039 "ubiquinone binding" annotation on NdhD is
        therefore refuted twice over
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000511780
