  title: UniProtKB reviewed entry for ndhD
  findings:
  - statement: The immutable UniProt record establishes plastid NDH identity and thylakoid localization. Its
      historical NAD(P)H/FMN reaction model is superseded for the chloroplast complex by ferredoxin-dependent
      primary biochemical and structural evidence.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Localization and family identity are useful; the NAD(P)H electron-donor description is not
      accepted as current mechanistic evidence. See PMID:21505067, PMID:28559282 and PMID:39856350.
