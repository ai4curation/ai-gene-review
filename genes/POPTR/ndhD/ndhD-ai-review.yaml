        comment: Current exact target leaf descends from PTN000511780, but plastid
          NdhD has diverged to a ferredoxin/plastoquinone, PTOX-dependent chlororespiratory
          context rather than mitochondrial aerobic respiration.
      - source_id: UniProtKB:P03905
