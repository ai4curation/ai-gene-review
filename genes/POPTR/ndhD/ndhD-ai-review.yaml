    id: GO:0048039
    label: ubiquinone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Ubiquinone binding is wrong for the NdhD antiporter-like membrane subunit.
    action: REMOVE
    reason: The spinach plastid NDH structure places the plastoquinone pocket in
      the NdhA/NdhH/NdhK module. NdhD is the ND4/NuoM antiporter-like subunit in
      the membrane arm, not the quinone-binding subunit, and the chloroplast complex
      reduces plastoquinone rather than ubiquinone. Remove the subunit-level ligand
      overpropagation instead of retargeting NdhD to generic quinone binding.
    supported_by:
    - reference_id: PMID:39856350
      supporting_text: The PQ-binding pocket is formed by subunits NdhA, NdhH and NdhK
