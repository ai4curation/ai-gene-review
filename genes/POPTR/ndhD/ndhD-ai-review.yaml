- term:
    id: GO:0015990
    label: electron transport coupled proton transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Coupled electron transfer and proton transport are core NDH functions.
    action: ACCEPT
    reason: Higher-plant NDH conserves ferredoxin-to-plastoquinone redox energy by proton pumping. This subunit
      contributes to the electron-transfer/proton-pumping complex and therefore directly participates in the
      process.
    supported_by:
    - reference_id: PMID:28559282
      supporting_text: pumps approximately two protons
- term:
    id: GO:0048039
    label: ubiquinone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Direct quinone binding by NdhD cannot be inferred from the substrate of the whole complex.
    action: UNDECIDED
    reason: The spinach structure places the plastoquinone pocket in NdhA/H/K; NdhD is an antiporter-like subunit
      elsewhere in the membrane arm. This warrants examination of the ancestral binding assertion, but the
      present structure alone does not test all possible NdhD binding. Withdraw the unsubstantiated generic
      quinone-binding replacement and seek subunit-specific adjudication.
    supported_by:
    - reference_id: PMID:39856350
      supporting_text: The PQ-binding pocket is formed by subunits NdhA, NdhH and NdhK
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000511780
        source_status: UNRESOLVED
        comment: The exact A4GYW6 leaf descends from PTN000511780. Whole-complex quinone reduction does not
          establish intrinsic ligand binding by NdhD; neither changed quinone preference nor distance from
          the known catalytic pocket alone proves complete loss.
      - source_id: UniProtKB:P0AFE8
        source_status: UNRESOLVED
