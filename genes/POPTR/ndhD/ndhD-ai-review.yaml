      source_entities:
      - source_id: PANTHER:PTN000511780
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The exact target leaf lies beneath PTN000511780 in the retrieved tree. Challenge the retained
          NADH-donor assertion on demonstrated chloroplast complex architecture and donor chemistry, not donor
          count or absence of target assays. Ferredoxin-dependent activity is retained.
