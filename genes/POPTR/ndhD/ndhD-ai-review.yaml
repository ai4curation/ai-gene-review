- id: file:POPTR/ndhD/ndhD-uniprot.txt
  title: UniProtKB reviewed entry for ndhD
  findings:
  - statement: The immutable UniProt record establishes plastid NDH identity and thylakoid localization. Its
      historical NAD(P)H/FMN reaction model is superseded for the chloroplast complex by ferredoxin-dependent
      primary biochemical and structural evidence.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Localization and family identity are useful; the NAD(P)H electron-donor description is not
      accepted as current mechanistic evidence. See PMID:21505067, PMID:28559282 and PMID:39856350.
- id: file:POPTR/ndhD/ndhD-goa.tsv
  title: QuickGO GOA annotations for ndhD
  findings:
  - statement: GOA rows supplied the existing_annotations reviewed in this file.
- id: file:POPTR/ndhD/ndhD-hypotheses/chlororespiratory-capacity-and-subunit-quinone-binding/openscientist.md
  title: OpenScientist focused report on ndhD chlororespiration and quinone binding
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read the focused report. It supports the plastid NdhD
      antiporter/proton-translocation role but argues that GO:0048039 ubiquinone
      binding is a wrong-subunit/wrong-quinone transfer and that GO:0009060
      aerobic respiration overstates NDH participation in PTOX-terminated
      chlororespiration.
  findings:
  - statement: NdhD is not the plastid NDH quinone-binding subunit.
    supporting_text: The GO:0048039 "ubiquinone binding" annotation on NdhD is
      therefore refuted twice over
  - statement: NdhD contributes to plastid NDH proton pumping but should not inherit
      a mitochondrial-style aerobic respiration process term.
    supporting_text: '**GO:0009060 "aerobic respiration" (IBA) is an over-annotation**'
