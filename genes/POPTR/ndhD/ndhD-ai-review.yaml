- term:
    id: GO:0009060
    label: aerobic respiration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Plastid NDH contributes to cyclic electron flow and chlororespiration,
      not mitochondrial-style aerobic respiration.
    action: REMOVE
    reason: The focused report checked the term scope and separated NDH-mediated
      plastoquinone reduction from the separate PTOX oxygen-consuming step of
      chlororespiration. Higher-plant NDH transfers electrons from ferredoxin to
      plastoquinone and pumps protons in the thylakoid during cyclic electron flow;
      it does not perform an aerobic-respiration process with oxygen as the terminal
      electron acceptor. Remove this mitochondrial/bacterial process propagation
      while retaining the accepted electron transport coupled proton transport row.
    supported_by:
    - reference_id: PMID:27066014
      supporting_text: chlororespiratory pathway was suppressed when NDH was inactivated.
    - reference_id: PMID:28559282
      supporting_text: pumps approximately two protons
    - reference_id: file:POPTR/ndhD/ndhD-hypotheses/chlororespiratory-capacity-and-subunit-quinone-binding/openscientist.md
      supporting_text: Definitional mismatch; NDH does CEF/chlororespiration
        (ferredoxin→PQ), O2 step is PTOX.
      reference_section_type: RESULTS
    propagation_review:
      root_cause: PROPAGATION_BAD
