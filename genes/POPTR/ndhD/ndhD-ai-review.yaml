- id: file:POPTR/ndhD/ndhD-hypotheses/chlororespiratory-capacity-and-subunit-quinone-binding/openscientist.md
  title: OpenScientist focused report on ndhD chlororespiration and quinone binding
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The focused report found the GO:0048039 ubiquinone-binding IBA to
      be wrong for NdhD because quinone binding belongs to a different subunit module
      and to plastoquinone in the chloroplast complex.
    supporting_text: Wrong subunit (NdhD = NuoM antiporter, not Q-pocket) and wrong
      quinone (plants use plastoquinone).
    reference_section_type: RESULTS
  - statement: The focused report found aerobic respiration definitionally inapplicable
      to plastid NdhD because the oxygen-consuming chlororespiration step is mediated
      by PTOX, not by NDH.
    supporting_text: Definitional mismatch; NDH does CEF/chlororespiration
      (ferredoxin→PQ), O2 step is PTOX.
    reference_section_type: RESULTS
  - statement: The focused report found that ndhD lacks the photosynthesis light-reaction
      process term carried by sibling plastid NDH subunits.
    supporting_text: Present on ndhB1/B2 and ndhK; matches NDH's CEF role; NdhD
      is anomalously missing it.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Focused report read. Its subunit-level quinone-binding analysis,
      chlororespiration boundary, and missing photosynthesis-process curation lead
      were cross-checked against local GOA plus PMID:28559282, PMID:27066014, and
      PMID:39856350; the remaining LLM report citations were not exhaustively verified.
