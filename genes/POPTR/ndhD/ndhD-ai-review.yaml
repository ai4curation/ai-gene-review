suggested_questions:
- question: Which stress conditions most require Populus chloroplast NDH chain 4 for cyclic electron flow or
    chlororespiration?
- question: Can the PTN000511780 aerobic-respiration PAINT assertion be constrained so
    mitochondrial and bacterial aerobic-respiration terms no longer propagate onto
    chloroplast NDH antiporter-like descendants?
- question: Is quinone binding confined to the NdhA/H/K catalytic pocket in plastid
    NDH, or can antiporter-like NdhD physically bind plastoquinone at an additional
    site?
