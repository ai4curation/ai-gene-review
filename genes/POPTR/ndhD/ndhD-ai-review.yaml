- term:
    id: GO:0015990
    label: electron transport coupled proton transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Coupled electron transfer and proton transport are core NDH functions.
    action: ACCEPT
    reason: Higher-plant NDH conserves ferredoxin-to-plastoquinone redox energy by proton pumping. This subunit
      contributes to the electron-transfer/proton-pumping complex and therefore directly participates in the
      process.
