taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: NdhD antiporter-like membrane subunit in Populus trichocarpa. It forms part of the thylakoid NADH
  dehydrogenase-like complex, which transfers electrons from reduced ferredoxin to plastoquinone and couples
  this reaction to proton translocation during cyclic electron flow around photosystem I. The membrane subunit
  contributes to the proton-translocation machinery. The resulting proton gradient supports ATP synthesis and
  photosynthetic energy balance.
existing_annotations:
- term:
    id: GO:0009060
    label: aerobic respiration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Chloroplast NDH feeds chlororespiration, but aerobic respiration
      overstates the process performed by the NdhD subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: The focused OpenScientist report separates authentic NDH-dependent
      plastoquinone reduction from the PTOX-catalyzed oxygen-consuming step. NdhD
      belongs to the plastid antiporter-like membrane arm of a ferredoxin-to-plastoquinone
      proton-pumping NDH complex; it does not oxidize NADH or catalyze the terminal
      oxygen-reduction step required by the aerobic-respiration term. Retain
      electron transport coupled proton transport, but treat this inherited
      respiratory process as a mitochondrial/Complex-I scope transfer.
    supported_by:
    - reference_id: PMID:27066014
      supporting_text: chlororespiratory pathway was suppressed when NDH was inactivated.
    - reference_id: PMID:28559282
      supporting_text: pumps approximately two protons
    - reference_id: file:POPTR/ndhD/ndhD-hypotheses/chlororespiratory-capacity-and-subunit-quinone-binding/openscientist.md
      supporting_text: '**GO:0009060 "aerobic respiration" (IBA) is an over-annotation**'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
