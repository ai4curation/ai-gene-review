suggested_questions:
- question: Which stress conditions most require Populus chloroplast NDH chain 4 for cyclic electron flow or
    chlororespiration?
- question: Does conserved NDH-dependent chlororespiration support the inherited respiratory process term in
    Populus? The shared ndhD OpenScientist request distinguishes demonstrated electron flow and proton pumping
    from proposed oxygen-coupled ATP production.
- question: Does NdhD itself bind ubiquinone or another quinone independently of the NdhA/H/K catalytic pocket?
    A complex-level substrate assignment is insufficient to answer this.
suggested_experiments:
- description: Measure chlorophyll fluorescence and P700 redox kinetics in ndhD perturbation lines under fluctuating
    light.
  experiment_type: targeted functional assay
