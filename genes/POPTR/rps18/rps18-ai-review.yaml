  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Generic rRNA binding is correct but less specific than small ribosomal subunit rRNA binding.
    action: MODIFY
    reason: For this chloroplast small-subunit ribosomal protein, the small-ribosomal-subunit rRNA binding 
