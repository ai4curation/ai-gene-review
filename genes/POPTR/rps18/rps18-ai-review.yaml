- term:
    id: GO:0070181
    label: small ribosomal subunit rRNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Small ribosomal subunit rRNA binding is a supported molecular feature of this protein.
    action: ACCEPT
    reason: The IBA follows from the PAINT node for the bS18 family; rps18 carries the bS18 family
      signatures (HAMAP MF_00270, Pfam PF01084) and is part of the 30S subunit by the HAMAP rule. The record
      has no curated statement of rRNA binding itself, so support is family membership only.
    supported_by:
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00270; Ribosomal_bS18; 1.
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: DR   Pfam; PF01084; Ribosomal_S18; 1.
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
