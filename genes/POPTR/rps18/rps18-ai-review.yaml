      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00270; Ribosomal_bS18; 1.
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
- term:
    id: GO:0005763
    label: mitochondrial small ribosomal subunit
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: mitochondrial small ribosomal subunit is incorrect for this chloroplast-encoded plastid ribosomal
      protein.
    action: MODIFY
    reason: Use the compartment-neutral small ribosomal subunit term while noting the chloroplast location 
      separately.
    supported_by:
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: [DE]
      supporting_text: 'RecName: Full=Small ribosomal subunit protein bS18c'
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Plastid, chloroplast.'
    proposed_replacement_terms:
    - id: GO:0015935
      label: small ribosomal subunit
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000336667
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Donors are mitochondrial ribosomal S18-family members; this plastid-encoded protein is part 
          of the chloroplast ribosome, so the mitochondrial subunit component should not transfer.
      - source_id: SGD:S000000852
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P82917
