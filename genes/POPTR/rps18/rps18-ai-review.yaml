existing_annotations:
- term:
    id: GO:0003735
    label: structural constituent of ribosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Structural constituent of ribosome is supported for this chloroplast ribosomal protein.
    action: ACCEPT
    reason: rps18 belongs to the bacterial ribosomal protein bS18 family (HAMAP MF_00270), and the HAMAP rule
      places it in the 30S ribosomal subunit. Support is family membership, not a Populus experiment.
    supported_by:
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the bacterial ribosomal protein bS18 family.'
