- term:
    id: GO:0005840
    label: ribosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: Ribosome is true of rps18 but does not say which ribosome or subunit; the small ribosomal
      subunit term carried in this review entails it.
    action: TOO_GENERAL
    reason: By the HAMAP rule (MF_00270) rps18 is part of the 30S ribosomal subunit, so the small ribosomal
      subunit term this review carries (GO:0015935, as the MODIFY replacement and core-function complex)
      entails this generic ribosome term. The claim is correct, but imprecise on its own.
    supported_by:
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Translation is the core biological process for this plastid ribosomal protein.
    action: ACCEPT
    reason: As a bS18 family member (HAMAP MF_00270) that the HAMAP rule places in the 30S ribosomal
      subunit of the chloroplast ribosome, rps18 takes part in plastid translation. Support is family
      membership, not a Populus experiment.
    supported_by:
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
    - reference_id: file:POPTR/rps18/rps18-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00270; Ribosomal_bS18; 1.
