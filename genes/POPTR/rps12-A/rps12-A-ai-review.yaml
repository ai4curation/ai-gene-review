description: Chloroplast small ribosomal subunit protein uS12cz, a plastid ribosome component supporting chloroplast translation.
existing_annotations:
- term:
    id: GO:0006412
    label: translation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Translation is the core biological process for this plastid ribosomal protein.
    action: ACCEPT
    reason: By similarity to characterized uS12 proteins (ECO:0000250 FUNCTION text), rps12-A helps set
      translational accuracy at the 30S/50S interface; it belongs to the universal ribosomal protein uS12
      family (HAMAP MF_00403_B). This is family- and similarity-based support, with no Populus experiment.
    supported_by:
    - reference_id: file:POPTR/rps12-A/rps12-A-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: With S4 and S5 plays an important role in translational accuracy.
    - reference_id: file:POPTR/rps12-A/rps12-A-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the universal ribosomal protein uS12 family.'
- term:
    id: GO:0005840
    label: ribosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Ribosome is true of rps12-A but does not say which ribosome or subunit; the small ribosomal
      subunit term asserted in this review entails it.
    action: TOO_GENERAL
    reason: By similarity (ECO:0000250 SUBUNIT text) rps12-A is part of the 30S ribosomal subunit, so the
      small ribosomal subunit annotation (GO:0015935, part_of ribosome) carried here entails this generic
      ribosome term. The claim is correct, but imprecise on its own.
    supported_by:
    - reference_id: file:POPTR/rps12-A/rps12-A-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Part of the 30S ribosomal subunit.'
