- term:
    id: GO:0019843
    label: rRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: Generic rRNA binding is correct but less specific than small ribosomal subunit rRNA binding.
    action: MODIFY
    reason: The UniRule row derives from the uS12 family rule (HAMAP MF_00403_B), which applies only to
      30S-subunit proteins; by similarity rps12-A is part of the 30S subunit, so the rRNA it binds is
      small-subunit rRNA and small ribosomal subunit rRNA binding is the precise term.
    supported_by:
    - reference_id: file:POPTR/rps12-A/rps12-A-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: DR   HAMAP; MF_00403_B; Ribosomal_uS12_B; 1.
