- term:
    id: GO:0022904
    label: respiratory electron transport chain
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Chlororespiration prevents categorical rejection from chloroplast localization alone.
    action: UNDECIDED
    reason: The GO definition does not restrict this process to mitochondria. Tobacco ndhJK/ndhCJK mutants
      and PTOX inhibition support NDH participation in chlororespiratory electron flow, while independent work
      demonstrates energy-conserving proton pumping. Whether the full GO process is sufficiently supported
      for this inherited Populus assertion, including oxygen-coupled energy conservation where required, is
      under shared adjudication. Current target descent from the positive ancestral node is verified; photosynthetic
      specialization alone is not evidence of loss.
    supported_by:
