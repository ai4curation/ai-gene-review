    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  review:
    summary: Replace NAD(P)H-donor activity with contribution to ferredoxin-dependent oxidoreduction.
    action: MODIFY
    reason: Modern chloroplast NDH biochemistry identifies reduced ferredoxin as the immediate electron donor
      and plastoquinone as acceptor; the complex lacks the NADH-oxidizing module. GO:0016655 still explicitly
      requires NAD(P)H, so the previous broader replacement does not correct the donor mismatch. GO:0016730
      accommodates an iron-sulfur protein donor. Apply the replacement with contributes_to for this subunit
      of the enzyme; original source qualifiers are preserved here.
    supported_by:
    - reference_id: PMID:21505067
      supporting_text: CRR31 was essential for the efficient operation of Fd-dependent plastoquinone reduction
        in vitro.
    - reference_id: PMID:28559282
      supporting_text: pumps approximately two protons
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
