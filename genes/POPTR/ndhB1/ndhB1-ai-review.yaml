  review:
    summary: Use the chloroplast NDH complex rather than NADH-oxidizing respiratory complex I.
    action: MODIFY
    reason: The chloroplast complex has a ferredoxin-input architecture and a plastoquinone-reduction site,
      distinct from the NADH-entry complex specified by GO:0045271. GO:0010598 explicitly allows ferredoxin
      as the possible donor despite its historical NAD(P)H label. This structural and reaction-level distinction
      does not rule out chlororespiration.
    supported_by:
