taxon:
  id: NCBITaxon:3694
  label: Populus trichocarpa
description: NdhB subunit encoded by one copy of the chloroplast inverted repeat in Populus trichocarpa. It
  forms part of the thylakoid NADH dehydrogenase-like complex, which transfers electrons from reduced ferredoxin
  to plastoquinone and couples this reaction to proton translocation during cyclic electron flow around photosystem
  I. The membrane subunit contributes to the proton-translocation machinery. The resulting proton gradient
  supports ATP synthesis and photosynthetic energy balance.
existing_annotations:
