- term:
    id: GO:0015986
    label: proton motive force-driven ATP synthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0046933
  review:
    summary: >-
      This is a GOC logical inference over the TreeGrafter GO:0046933 ATP
      synthase row, so it stands or falls with that row. Spa47 hydrolyzes ATP;
      no ATP synthesis by any T3SS ATPase has ever been reported, and the
      protein has no Fo-type partner or proton channel. The Shigella T3SS does
      use the proton motive force, but it uses it to translocate substrate
      through the MxiA/SctV export gate, not to make ATP.
    action: REMOVE
    reason: >-
      The source molecular function annotation is wrong, so the inferred
      process is wrong too. Spa47 consumes ATP rather than producing it, and
      UniProt's own catalytic activity for this entry is the hydrolytic export
      reaction EC 7.4.2.8.
    supported_by:
