- id: PMID:31162724
  title: Interfacial amino acids support Spa47 oligomerization and shigella type three
    secretion system activation.
  findings:
  - statement: >-
      A model of the activated Spa47 homohexamer identified two protomer
      interfaces; mutants at these positions fail to oligomerize and to
      hydrolyze ATP, and lose effector secretion, membrane disruption and
      invasion in vivo.
    supporting_text: we developed a model of an activated Spa47 homo-hexamer
  reference_review:
