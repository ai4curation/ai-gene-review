- id: file:SHIFL/sctN/sctN-notes.md
  title: Curation notes for Shigella flexneri sctN (Spa47)
  findings:
  - statement: >-
      Trace of the PANTHER PTHR15184 node placement for the TreeGrafter
      GO:0046933 row, showing the IBD sits at the duplication node PTN008558586
      ancestral to both the F1-beta clade and the type III export ATPase clade
      that contains P0A1C1 (PTHR15184:SF9, graft node PTN001807734).
    supporting_text: the IBD was placed one node too deep, at the duplication that
      separates F1-beta from the T3SS/flagellar export ATPases
core_functions:
- description: >-
    Oligomerization-activated ATPase at the hub of the injectisome cytoplasmic
    sorting platform. It hydrolyzes ATP to recognize type III secretion
    substrates, release their chaperones, unfold them and hand them to the
    MxiA/SctV export gate, which is required to build a complete secretion
    apparatus and to secrete needle subunits, translocators and effectors.
  molecular_function:
    id: GO:0008564
    label: protein-exporting ATPase activity
  directly_involved_in:
  - id: GO:0030254
    label: protein secretion by the type III secretion system
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0030257
    label: type III protein secretion system complex
  supported_by:
  - reference_id: PMID:26947936
    supporting_text: providing the first direct evidence that Spa47 is a bona fide
      ATPase
  - reference_id: PMID:27770024
    supporting_text: Spa47 oligomerization and ATP hydrolysis are needed for complete
      T3SS apparatus formation, a proper translocator secretion profile, and Shigella
      virulence
  - reference_id: PMID:25583506
    supporting_text: the hub consists mainly of a hexamer of the Spa47 ATPase
proposed_new_terms: []
suggested_questions:
- question: >-
    In PANTHER PTHR15184, the GO:0046933 IBD is asserted at PTN008558586, whose
    event type is DUPLICATION and whose children are the ATP synthase beta
    clade (PTN008558588, holding all the experimental seeds) and the eubacterial
    type III export ATPase clade (PTN000390097, subfamilies SF9, SF62, SF81).
    P0A1C1 is in SF9 and was grafted at PTN001807734 inside that second clade.
    Should the IBD be moved down to PTN008558588 so that ATP synthase activity
    and proton-transporting ATP synthase complex stop propagating into the
    flagellar and injectisome export ATPases, and should an IRD or NOT be placed
    at the root of PTN000390097 as well?
- question: >-
    The InterPro2GO mapping for IPR004100 (F1/V1/A1 alpha/beta N-terminal
    domain) contributes GO:0046034 and GO:1902600 to every T3SS and flagellar
    export ATPase that carries the domain. Since that domain is shared by
    descent with the rotary ATPases but the export ATPases neither synthesize
    ATP nor conduct protons, should the IPR004100 mapping be narrowed, or the
    mapping moved to the rotary-specific InterPro entries?
- question: >-
    Would GO benefit from a cellular component term for the type III secretion
    cytoplasmic sorting platform (the SctN hub, SctL spokes, SctQ pods and SctK
    linker resolved by cryo-electron tomography)? At present GO:0030257 is the
    only available term, and it cannot distinguish the sorting platform from
    the membrane-embedded basal body and export apparatus.
- question: >-
    Spa47 hexamerization is required for activity and occurs both free in the
    cytoplasm and at the injectisome. Should a protein-complex term or a
    homo-oligomerization process term be used in addition to GO:0042802
    identical protein binding to capture the functional hexamer?
suggested_experiments:
- description: >-
    Test directly whether Spa47 can run in reverse: assay purified oligomeric
    Spa47 for ATP synthesis from ADP and phosphate, alone and reconstituted
    into proteoliposomes with an imposed proton gradient, and test the ATPase
    for sensitivity to F-, V- and P-type ATPase inhibitors as was done for
    Salmonella FliI. A negative result on this protein would give a
    citable, organism-specific refutation of the ATP synthase and proton
    transport propagations rather than relying on the flagellar ortholog.
  experiment_type: enzymology and reconstitution
- description: >-
    Measure Shigella type III secretion rates in strains carrying ATPase-dead
    Spa47 while independently collapsing the membrane potential and the pH
    gradient with ionophores, to quantify how much of the export work is done
    by Spa47 hydrolysis versus the MxiA/SctV proton motive force in this
    injectisome.
  experiment_type: bacterial physiology and secretion assay
- description: >-
    Determine a cryo-EM structure of the Spa47 hexamer in complex with
    MxiN/SctL and Spa13/SctO to test whether the SctO stalk occupies the
    central channel in a gamma-subunit-like manner, and whether there is any
    rotational coupling, which would settle how far the F1 architectural
    analogy extends without implying ATP synthase chemistry.
  experiment_type: structural biology
