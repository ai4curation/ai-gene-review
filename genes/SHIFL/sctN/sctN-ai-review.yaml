  review:
    summary: >-
      This is the core molecular function of Spa47 and the one the UniProt
      record itself asserts, via EC 7.4.2.8 (ATP + H2O + protein(side 1) = ADP
      + phosphate + protein(side 2)). The GO definition covers ATP-driven
      transfer of a protein across a membrane with concomitant secretion,
      which is what the T3SS ATPase energizes. Purified Spa47 is a genuine
      ATPase, and its hydrolytic activity is required for apparatus assembly
      and for secretion of translocators and effectors.
    action: ACCEPT
    reason: >-
      The most specific and informative molecular function available for this
      protein, and correctly sourced: the EC mapped here is the export ATPase
      EC 7.4.2.8, not the ATP synthase EC 7.1.2.2 that mislabels several
      flagellar FliI orthologs.
