- id: PMID:30107569
  title: 'Bacterial type III secretion systems: a complex device for the delivery of
    bacterial effector proteins into eukaryotic host cells.'
  findings:
  - statement: >-
      In injectisomes, substrate translocation is mainly fueled by the proton
      motive force across the inner membrane, and the conserved charged
      residues implicated in using it lie in the transmembrane domain of SctV.
      The ATPase contributes dechaperoning, unfolding and efficient coupling to
      the export gate.
    supporting_text: Substrate translocation itself is mainly fueled by the PMF across
      the bacterial inner membrane
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Authoritative review, full text cached. Used only for the
      division-of-labor point about where protons are handled.
- id: PMID:30460850
  title: 'Shutting Down Shigella Secretion: Characterizing Small Molecule Type Three
    Secretion System ATPase Inhibitors.'
  findings:
  - statement: >-
      Active oligomeric Spa47 was purified and used for kinetic analysis of
      three noncompetitive inhibitors, which reduce secretion in vivo without
