- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:30460850
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0A1C1
  review:
    summary: >-
      Spa47 self-association is not incidental: homo-oligomerization is the
      activation mechanism of the enzyme, because catalytic sites are shared
      between adjacent protomers. This study purified the active oligomeric
