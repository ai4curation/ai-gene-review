- term:
    id: GO:0046034
    label: ATP metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  review:
    summary: >-
      This InterPro2GO mapping comes from IPR004100, the F1/V1/A1 alpha/beta
      N-terminal domain, which Spa47 shares with the rotary ATP synthases by
      descent. The mapping carries rotary ATP synthase meaning across to an
      export ATPase. Spa47 hydrolyzes ATP only as the energy source for protein
      export; it plays no part in cellular ATP synthesis or in ATP turnover as
      a metabolic pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Literally true in that Spa47 consumes ATP, but uninformative and
      misleading here. GO captures energy-coupled ATP hydrolysis through the
      molecular function (GO:0016887, GO:0008564), not as participation in ATP
      metabolism, and the term's presence alongside the ATP synthase rows
      reinforces the false impression of ATP synthase biology.
    supported_by:
    - reference_id: PMID:26947936
      supporting_text: providing the first direct evidence that Spa47 is a bona fide
        ATPase
    - reference_id: PMID:31162724
      supporting_text: Protein secretion through the needle-like type three secretion
        apparatus (T3SA) requires ATP hydrolysis by the T3SS ATPase Spa47
- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001807734
  review:
    summary: >-
      TreeGrafter grafted P0A1C1 onto PTHR15184 at node PTN001807734 and
      propagated the F1-beta ATP synthase molecular function. Tracing the tree
      (projects/TREEGRAFTER/rotary_atpase/node_placement.tsv) shows where this
      goes wrong. The GO:0046933 IBD sits at PTN008558586, whose event type is
      DUPLICATION. Its two children are PTN008558588, which holds the ATP
      synthase beta subfamilies (SF51, SF74, SF75, SF76, SF80, SF82, SF83,
      SF85) and contains every experimental seed for the term, and
      PTN000390097, a eubacterial node holding the type III export ATPase
      subfamilies SF9, SF62 and SF81. P0A1C1 is classified in PTHR15184:SF9
      (SPI-1 type 3 secretion system ATPase) and its graft node PTN001807734
      lies inside PTN000390097. So the assertion was placed one node too deep,
      at the duplication that created the two paralog lineages, and leaks the
      ATP synthase function from the F1-beta child into the export ATPase
      sister clade.
    action: REMOVE
    reason: >-
      Contradicted by the biology of this protein. Spa47 is a soluble
      cytoplasmic ATP hydrolase with no transmembrane segment, no Fo-type
      proton channel and no reported synthetic activity; UniProt assigns it EC
      7.4.2.8, the protein-translocating export reaction. Where the Shigella
      T3SS uses the proton motive force, the protons are handled by the
      inner-membrane export gate MxiA/SctV, not by the ATPase. The right fix in
      PAINT is to move the IBD from the duplication node PTN008558586 down to
      the F1-beta child PTN008558588, which keeps every seeded annotation.
    supported_by:
    - reference_id: PMID:26947936
      supporting_text: providing the first direct evidence that Spa47 is a bona fide
        ATPase
    - reference_id: PMID:27171191
      supporting_text: MxiA family proteins and their regulators are implicated in
        utilization of the PMF for protein export
    - reference_id: file:SHIFL/sctN/sctN-notes.md
      supporting_text: the IBD was placed one node too deep, at the duplication that
        separates F1-beta from the T3SS/flagellar export ATPases
- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  review:
    summary: >-
      Another InterPro2GO mapping from IPR004100, the F1/V1/A1 alpha/beta
      N-terminal domain. Spa47 is a soluble cytoplasmic protein with no
      transmembrane segment; cryo-ET places its hexamer in the sorting platform
      below the membrane, not in it. Efficient type III secretion in Shigella
      requires the cytoplasmic ATPase and the proton motive force as two
      separate contributions, and the conserved charged residues implicated in
      using the proton motive force are in the transmembrane domain of the
      export gate MxiA/SctV.
    action: REMOVE
    reason: >-
      The domain-based mapping transfers rotary ATP synthase proton chemistry
      to an export ATPase that has none. Depending on a proton motive force
      generated and used elsewhere in the machine is not the same as
      transporting protons, and no protons cross a membrane through Spa47.
    supported_by:
    - reference_id: PMID:27171191
      supporting_text: Efficient T3S requires a cytoplasmic ATPase and the proton motive
        force (PMF)
    - reference_id: PMID:30107569
      supporting_text: Several conserved charged residues reside within the predicted
        TMD of SctV that seem to be implicated in utilization of the PMF
    - reference_id: PMID:25583506
      supporting_text: the hub consists mainly of a hexamer of the Spa47 ATPase
    - reference_id: file:SHIFL/sctN/sctN-deep-research-falcon.md
      supporting_text: hydrolysis supports substrate recognition, chaperone release
        and substrate unfolding/presentation to the export gate rather than acting
        as a membrane transporter itself
