- id: PMID:12864857
  title: 'MxiK and MxiN interact with the Spa47 ATPase and are required for transit
    of the needle components MxiH and MxiI, but not of Ipa proteins, through the type
    III secretion apparatus of Shigella flexneri.'
  findings:
  - statement: >-
      A spa47 mutant of S. flexneri is secretion defective and the needle
      components MxiH and MxiI are drastically reduced. Two-hybrid and
      immunoprecipitation identify Spa47 interactions with MxiK/SctK and
      MxiN/SctL.
    supporting_text: we identified interactions between MxiK and Spa33 and Spa47 and
      between MxiN and Spa33 and Spa47
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary Shigella genetics for the sorting-platform interactions. Abstract
      only in the cache.
- id: PMID:18657109
