- id: PMID:31978132
  title: Dominant negative effects by inactive Spa47 mutants inhibit T3SS function
    and Shigella virulence.
  findings:
  - statement: >-
      Injectisome incorporation of Spa47 is determined by its N-terminus rather
      than by ATPase activity, so catalytically inactive mutants still dock and
