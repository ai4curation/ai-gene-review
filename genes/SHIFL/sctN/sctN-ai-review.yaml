- id: PMID:25583506
  title: Visualization of the type III secretion sorting platform of Shigella flexneri.
  findings:
  - statement: >-
      Cryo-electron tomography and subtomogram averaging of intact S. flexneri
      injectisomes resolve the cytoplasmic sorting platform as a central hub
      with six spokes and terminal pods. The hub is a Spa47 hexamer, MxiN forms
      the spokes and Spa33 the pods, and the hub is aligned with the MxiA
      export gate channel.
    supporting_text: the hub consists mainly of a hexamer of the Spa47 ATPase, whereas
      the MxiN protein comprises the spokes and the Spa33 protein forms the pods
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      In situ structure of the Shigella machine; supports both the cytoplasm
      and the T3SS complex annotations, and the hexameric state.
- id: PMID:26947936
  title: Spa47 is an oligomerization-activated type three secretion system (T3SS) ATPase
    from Shigella flexneri.
  findings:
  - statement: >-
      First purification of active Spa47 and first direct demonstration that it
      is an ATPase. Multiple oligomeric species were resolved, the largest more
      than eight-fold more active than the monomer. A Walker A lysine mutant
      (Lys165) retains oligomerization but is catalytically dead and fails to
      restore invasion in a spa47 null strain.
    supporting_text: providing the first direct evidence that Spa47 is a bona fide
      ATPase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The key enzymology paper for this protein; establishes
      hydrolysis, not synthesis.
- id: PMID:27171191
  title: MxiA, MxiC and IpaD Regulate Substrate Selection and Secretion Mode in the
    T3SS of Shigella flexneri.
  findings:
  - statement: >-
      Efficient type III secretion in S. flexneri requires both a cytoplasmic
      ATPase and the proton motive force, and it is the MxiA/SctV family
      inner-membrane export apparatus protein and its regulators that are
      implicated in using the proton motive force for export.
    supporting_text: MxiA family proteins and their regulators are implicated in utilization
      of the PMF for protein export
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shigella-specific energetics. Cited to separate the ATPase contribution
      from proton handling, which is what removes GO:1902600 and GO:0015986
      from Spa47.
- id: PMID:27770024
  title: Structural and biochemical characterization of Spa47 provides mechanistic
    insight into type III secretion system ATPase activation and Shigella virulence
    regulation.
  findings:
  - statement: >-
      High-resolution crystal structures of Spa47 support an activated oligomer
      in which ATP hydrolysis depends on side chains contributed by adjacent
      protomers. The tested active-site residues are each essential for ATPase
      activity without being required for stable oligomer formation. A
      monomeric N-terminally truncated construct cannot hydrolyze ATP despite
      an intact catalytic core.
    supporting_text: Spa47 oligomerization and ATP hydrolysis are needed for complete
      T3SS apparatus formation, a proper translocator secretion profile, and Shigella
      virulence
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Structure-function basis for the EC 7.4.2.8 assignment
      in UniProt.
