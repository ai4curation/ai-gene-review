id: P0A1C1
gene_symbol: sctN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:623
  label: Shigella flexneri
description: >-
  SctN (Spa47, SpaL, MxiB) is the ATPase of the Shigella flexneri type III
  secretion system (injectisome), encoded in the spa operon of the large
  virulence plasmid. It is a soluble cytoplasmic enzyme that assembles into a
  homohexamer forming the central hub of the cytoplasmic sorting platform at
  the base of the injectisome, where MxiN/SctL forms the radial spokes,
  Spa33/SctQ the pods and MxiK/SctK links the platform to the basal body. The
  hexamer sits directly beneath and is aligned with the central channel of the
  MxiA/SctV export gate. Purified Spa47 is a Mg2+-dependent ATP hydrolase whose
  activity is switched on by oligomerization: catalytic sites are shared
  between adjacent protomers, so monomers are only weakly active and the
  oligomer is roughly eight-fold more active. Catalysis requires a Walker A
  lysine (Lys165) together with Glu188 and Arg350 and a set of interfacial
  residues; MxiN/SctL tunes activity in opposite directions on the monomer and
  the oligomer. ATP hydrolysis by Spa47 is used to recognize secretion
  substrates, strip their chaperones, unfold them and feed them to the export
  gate, and is required for building a complete secretion apparatus, for
  secreting the needle subunits MxiH/MxiI and the translocators IpaB/IpaC, and
  for epithelial cell invasion. Localization to the injectisome is a property
  of the N-terminal domain rather than of catalysis, so catalytically dead
  variants still dock and act as dominant negatives. Spa47 is an evolutionary
  paralog of the F1-ATP synthase beta subunit and retains the F1 alpha/beta
  N-terminal domain fold, but it neither synthesizes ATP nor conducts protons;
  in the injectisome the proton motive force is used by the membrane export
  gate MxiA/SctV. Its EC number, 7.4.2.8, is the protein-translocating export
  ATPase reaction.
