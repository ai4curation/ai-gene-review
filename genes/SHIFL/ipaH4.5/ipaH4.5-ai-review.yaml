    label: ubiquitin-dependent protein catabolic process
  evidence_type: IMP
  original_reference_id: PMID:26700764
  qualifier: involved_in
  review:
    summary: >-
      IpaH4.5 attaches K48 polyubiquitin chains to TBK1 and the modified
      kinase is then destroyed by the proteasome, with loss of downstream IRF3
      phosphorylation and nuclear translocation. A second, independent paper
      reports the same route for the proteasome subunit RPN13, degraded via
      the ubiquitin-proteasome system.
    action: MODIFY
    reason: >-
      CACAO row (ASSIGNED BY = CACAO, IMP, PMID:26700764). What the paper
      shows for this gene is right for the term but more specific than the
      term states: the degradation is explicitly proteasome-dependent, and
      K48 chains are the canonical proteasomal targeting signal. The claim is
      about the ligase doing the tagging step of the pathway, so IpaH4.5 does
      participate in the process rather than merely being required for it.
      Modified to the is_a descendant GO:0043161, supported twice over by
      different substrates (TBK1, RPN13). Not a phenotype-as-process error and
      not a wrong-paper error; only the granularity is off.
