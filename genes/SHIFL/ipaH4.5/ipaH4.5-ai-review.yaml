core_functions:
- description: >-
    Cysteine-dependent NEL-domain E3 ubiquitin ligase. Delivered into the host
    cell cytoplasm by the Mxi-Spa type III secretion system, it uses its
    N-terminal leucine-rich-repeat solenoid to select host substrates and its
    C-terminal NEL domain, via a thioester on the Cys379 active site, to build
    polyubiquitin chains on them. Chain linkage is substrate-dependent: K48 on
    TBK1, which routes the kinase to the proteasome, and K63 on NLRP3, which
    stabilizes it.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0000209
    label: protein polyubiquitination
  - id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  locations:
  - id: GO:0030430
    label: host cell cytoplasm
  supported_by:
  - reference_id: PMID:26700764
    supporting_text: IpaH4.5 interacts with TBK1 and promotes its K48-linked polyubiquitylation.
  - reference_id: PMID:33117724
    supporting_text: the ubiquitination of NLRP3 was catalyzed by IpaH4.5 mainly at
      position K63 (Figure 2B)
  - reference_id: PMID:30414351
    supporting_text: targets the proteasome regulatory particle non-ATPase 13 (RPN13)
      and induces its degradation via the ubiquitin-proteasome system (UPS)
- description: >-
    Suppression of host innate immune signalling by ubiquitinating its
    components. Polyubiquitination of the NF-kappaB subunit p65 shuts down
    NF-kappaB-dependent transcription, so an ipaH4.5 deletion mutant provokes
    stronger pro-inflammatory cytokine responses and colonizes worse; K48
    polyubiquitination and proteasomal destruction of TBK1 prevents IRF3
    phosphorylation, nuclear import and activation, blunting the type I
    interferon arm; and degradation of the 19S subunit RPN13 impairs
    proteasome-dependent MHC class I antigen cross-presentation. This is the
    virulence output of the ligase activity.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  - id: GO:0085034
    label: symbiont-mediated suppression of host NF-kappaB cascade
  locations:
  - id: GO:0030430
    label: host cell cytoplasm
  supported_by:
  - reference_id: PMID:23083102
    supporting_text: the IpaH4.5 protein is an E3 ubiquitin ligase capable of directly
      regulating the host inflammatory response by inhibiting the NF-κB signalling
      pathway
  - reference_id: PMID:26700764
    supporting_text: Because IRF3 and TBK1 are required for restricting Shigella growth,
      we propose that the polyubiquitylation and degradation of TBK1 during Shigella
      infection are new bacterial strategies to modulate the host antibacterial responses.
  - reference_id: PMID:23083102
    supporting_text: the Shigella ΔipaH4.5 mutant strain caused more severe inflammatory
      responses and significantly induced higher pro-inflammatory cytokine levels (MIP-2
      and TNF-α)
