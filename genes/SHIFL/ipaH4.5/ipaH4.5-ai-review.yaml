knowledge_gaps:
- gap_statement: >-
    It is not known how IpaH4.5 produces opposite-signed outcomes on host
    innate immunity in the same infection: it suppresses NF-kappaB and IRF3
    signalling by destroying p65 and TBK1, yet stabilizes NLRP3 with K63
    chains and thereby increases caspase-1 activation and pyroptosis. Whether
    these arms are separated by cell type, by time after invasion, by effector
    dose, or by competition between substrates for the LRR surface is
    undetermined, and so is what decides the chain linkage (K48 versus K63) on
    a given substrate.
  boundary: >-
    Firmly established: the substrates (p65, TBK1, RPN13, NLRP3), the linkage
    on TBK1 (K48) and on NLRP3 (K63), the requirement for Cys379 in every
    case, and that each arm is demonstrable on its own with deletion and
    complementation strains.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    Which way IpaH4.5 shifts the balance decides whether it is a net
    anti-inflammatory or pro-inflammatory effector, and bears on why Shigella
    infection is simultaneously immunosuppressive and intensely inflammatory.
- gap_statement: >-
    Whether IpaH4.5 has a second catalytic activity as a Rab31
    GTPase-activating protein is unresolved. One report describes TBC-like
    dual-finger motifs and potent RabGAP activity towards Rab31 with
    consequences for CD-MPR trafficking and lysosomal function, but no
    TBC-like module is detectable in P18009 by UniProt, Pfam or PROSITE, and
    the finding has not been reproduced independently.
  boundary: >-
    Firmly established: the only recognized catalytic module in IpaH4.5 is the
    NEL domain at residues 295-574 with its Cys379 active site, and all
    reproduced activities of the protein are ubiquitin ligase activities.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    A genuine second activity would make IpaH4.5 a bifunctional effector and
    would need a separate molecular function annotation; a spurious one would
    otherwise propagate across the IpaH family by similarity.
suggested_questions:
- question: >-
    The CACAO annotation GO:0039604 symbiont-mediated suppression of host
    translation (IDA, PMID:23083102) is keyed to a paper whose only
    gene-expression readout is an NF-kappaB-response-element luciferase
    reporter. Can the CACAO or GOA curators confirm from the full text, or
    from the GONUTS evidence record, that no host protein-synthesis assay was
    performed, so that the row can be re-pointed to GO:0085034
    symbiont-mediated suppression of host NF-kappaB cascade?
- question: >-
    UniProt P18009 carries the alternative name "Probable RING-type E3
    ubiquitin transferase ipaH4.5" while the same record annotates a NEL
    domain and a Cys379 glycyl-thioester active site, and PMID:33117724 shows
    C379A is catalytically dead. Should the alternative name be corrected to
    the NEL/HECT-like class, and should the same check be run across the other
    IpaH and SspH entries?
- question: >-
    Does the reported Rab31 GAP activity of IpaH4.5 use the NEL catalytic
    cysteine, a distinct TBC-like surface, or neither? A C379A variant
    retaining full GAP activity would establish bifunctionality; one losing it
    would suggest the GAP readout is downstream of ubiquitination.
- question: >-
    What determines the ubiquitin chain linkage IpaH4.5 builds, given that it
    makes K48 chains on TBK1 but K63 chains on NLRP3 with the same catalytic
    cysteine? Is linkage set by the host E2 recruited, by the substrate's
    presentation on the LRR surface, or by the local lysine environment?
- question: >-
    Each IpaH paralog has a distinct N-terminal LRR region and a distinct
    substrate set, while the molecular function term is identical across the
    family. Would these effector annotations be better served by recording the
    substrate explicitly, for example as has_input in a GO-CAM, so that the
    paralog-specific information is not lost?
suggested_experiments:
- description: >-
    Settle the GO:0039604 question directly by measuring host translation
    during Shigella infection: polysome profiling or ribosome profiling, plus
    puromycin or O-propargyl-puromycin incorporation, in cells infected with
    wild type, an ipaH4.5 deletion strain, and the deletion strain
    complemented with wild-type or C379A ipaH4.5. A negative result would
    confirm that IpaH4.5 suppresses NF-kappaB-driven transcription rather than
    translation; a positive one would rehabilitate the existing annotation.
  experiment_type: translational profiling in infection
- description: >-
    Resolve the opposite-signed arms by single-cell time-course analysis of
    infected macrophages and epithelial cells: track p65, TBK1, RPN13 and
    NLRP3 levels, IRF3 and NF-kappaB reporter output, and caspase-1 activation
    in the same cells over the course of invasion, comparing wild type with
    the ipaH4.5 deletion and C379A complement strains, and titrating effector
    dose with an inducible promoter.
  experiment_type: single-cell infection time course
- description: >-
    Test the bifunctionality claim with purified protein: assay recombinant
    IpaH4.5 and IpaH4.5 C379A side by side for ubiquitin ligase activity
    (E1/E2/ubiquitin with NLRP3 or TBK1 as acceptor) and for GTP hydrolysis
    stimulation on Rab31 using a single-turnover GAP assay, and attempt to
    localize any GAP activity to a defined fragment by limited proteolysis or
    deletion mapping. Solve a structure of the putative GAP region if activity
    is confirmed.
  experiment_type: enzymology and structural biology
- description: >-
    Map the determinants of paralog-specific substrate choice by swapping the
    N-terminal LRR regions between IpaH4.5 and IpaH7.8 or IpaH9.8 (the
    boundary is well defined: residues 1-284 of IpaH4.5) and assaying each
    chimera for ubiquitination of p65, TBK1, RPN13, NLRP3, glomulin and NEMO.
    This would test whether the LRR solenoid alone encodes the substrate set
    and would provide the evidence needed to annotate substrates per paralog
    rather than per family.
  experiment_type: chimeric protein substrate mapping
