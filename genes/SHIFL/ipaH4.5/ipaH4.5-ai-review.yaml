- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:11418613
  qualifier: located_in
  review:
    summary: >-
      Congo-red-induced secretion of IpaH into the culture medium, detected by
      immunoblot. The paper's title and its nuclear-import experiments concern
      the paralog IpaH9.8, but the secretion experiments are explicitly framed
      as a survey of the IpaH proteins, and the UniProt curator cites this
      paper on the P18009 entry under SUBCELLULAR LOCATION AND SECRETION VIA
      TYPE III SECRETION SYSTEM.
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim is sound: IpaH4.5 is a confirmed member of the pWR100 T3SS
      secretome and the cited paper assays secretion of IpaH proteins as a
      group, so this is not a wrong-gene annotation and is not removed. It is
      non-core because the extracellular medium is where a T3SS effector is
      caught in transit under artificial secretion induction, not where it
      acts. Every characterized IpaH4.5 substrate (p65, TBK1, RPN13, NLRP3) is
      a host cytosolic protein, so GO:0030430 host cell cytoplasm is the
      functionally relevant compartment. Note also that the nuclear
      localization reported in this paper is specific to IpaH9.8 and must not
      be propagated to IpaH4.5.
    supported_by:
    - reference_id: PMID:11418613
      supporting_text: we investigated the IpaH proteins for their ability to be secreted
        via the type III secretion system and their fate in mammalian cells
    - reference_id: PMID:11418613
      supporting_text: the bacteria secrete IpaH into the medium, but secretion of
        IpaH occurs later than that of IpaBCD
