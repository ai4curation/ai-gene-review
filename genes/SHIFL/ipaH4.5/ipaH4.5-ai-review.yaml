- id: PMID:23083102
  title: Shigella flexneri T3SS effector IpaH4.5 modulates the host inflammatory response
    via interaction with NF-κB p65 protein.
  full_text_unavailable: true
  findings:
  - statement: >-
      IpaH4.5 binds the p65 subunit of NF-kappaB through its N-terminal region
      and ubiquitinates it, and it suppresses NF-kappaB-dependent
      transcription.
    supporting_text: In vitro, IpaH4.5 displayed ubiquitin ligase activity towards
      ubiquitin and p65.
  - statement: >-
      Deletion of ipaH4.5 increases host inflammation and reduces bacterial
      colonization in a murine lung infection model and the Sereny test.
    supporting_text: the Shigella ΔipaH4.5 mutant strain caused more severe inflammatory
      responses and significantly induced higher pro-inflammatory cytokine levels (MIP-2
      and TNF-α)
  - statement: >-
      The suppression this paper measures is of NF-kappaB-driven
      transcription; it reports no assay of host mRNA translation, which is
      why the CACAO GO:0039604 annotation keyed to it names the wrong
      molecular step.
    supporting_text: the transcriptional activity of NF-κB was shown to be inhibited
      by IpaH4.5 utilizing a dual-luciferase reporter gene detection system containing
      NF-κB promoter response elements
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the paper is about IpaH4.5 itself, not a paralog, and
      establishes the p65 substrate and the NF-kappaB suppression phenotype.
      Abstract-only in our cache, so the three CACAO rows keyed to it
      (GO:0000209, GO:0051865, GO:0039604) cannot be checked against their
      figures. The citation is sound; the GO:0039604 row misreads it as a
      translation effect.
- id: PMID:26700764
  title: Bacterial E3 Ubiquitin Ligase IpaH4.5 of Shigella flexneri Targets TBK1 To
    Dampen the Host Antibacterial Response.
  full_text_unavailable: true
  findings:
  - statement: >-
      IpaH4.5 binds TBK1 and attaches K48-linked polyubiquitin chains to it,
      targeting the kinase for proteasomal degradation.
    supporting_text: IpaH4.5 interacts with TBK1 and promotes its K48-linked polyubiquitylation.
  - statement: >-
      Loss of TBK1 prevents IRF3 phosphorylation, nuclear translocation and
      activation, dampening the host antibacterial response.
    supporting_text: polyubiquitylated TBK1 undergoes proteasome-dependent degradation,
      which perturbs the phosphorylation, nuclear translocation, and activation of
      IRF3
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the paper is specifically about IpaH4.5 and supports
      both CACAO rows keyed to it (GO:0006511, GO:0052170). Abstract-only in
