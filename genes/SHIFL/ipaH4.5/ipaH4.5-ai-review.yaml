  qualifier: involved_in
  review:
    summary: >-
      GO:0039604 is defined as a symbiont inhibiting or disrupting the
      translation of host mRNA into protein, for example by cleavage of the
      host mRNAs. The cited paper contains no assay of host protein synthesis.
      What it reports is that IpaH4.5 binds the NF-kappaB subunit p65,
