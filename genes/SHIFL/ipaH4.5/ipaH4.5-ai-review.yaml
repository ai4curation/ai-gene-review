  evidence_type: IDA
  original_reference_id: PMID:23083102
  qualifier: involved_in
  review:
    summary: >-
      Self-ubiquitination is a general property of the IpaH/SspH NEL ligases
      and UniProt records it for P18009 as a PTM. The cited abstract reports
      in vitro ligase activity towards ubiquitin and p65 but does not mention
      the enzyme itself as an acceptor, and the figure that would settle it is
      not accessible.
    action: KEEP_AS_NON_CORE
    reason: >-
      CACAO row (ASSIGNED BY = CACAO, IDA, PMID:23083102). The underlying
      claim is credible: an in vitro E1/E2/E3/ubiquitin reaction of the kind
      the abstract describes is where IpaH autoubiquitination is normally
      observed, and UniProt independently annotates P18009 as being
