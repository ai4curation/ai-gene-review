- term:
    id: GO:0141087
    label: positive regulation of inflammasome-mediated signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:33117724
  qualifier: involved_in
  review:
    summary: >-
      IpaH4.5 binds NLRP3 and attaches K63-linked polyubiquitin chains to it.
      NLRP3 protein rises without any change in NLRP3 mRNA, so the effect is
      post-transcriptional stabilization, and caspase-1 activation, IL-1 beta
      secretion and LDH release all increase. A C379A catalytic-dead IpaH4.5
      fails to do any of this, and macrophages infected with an ipaH4.5
      deletion strain release less LDH than those infected with wild type or
      with the complemented strain, while the C379A complement does not
      restore it.
    action: NEW
    reason: >-
      No row in the existing GOA set covers this arm of IpaH4.5 biology, and
      it is opposite in sign to the suppression terms: the same ligase blunts
      NF-kappaB and IRF3 signalling but increases inflammasome output.
      Participation test: IpaH4.5 itself catalyses the K63 modification that
      stabilizes NLRP3, so it performs the regulatory step rather than merely
      being required for the outcome, and the catalytic-dead C379A control
      separates the two. Comparator test: host E3 ligases that ubiquitinate
      NLRP3 (for example TRIM31, ARIH2, PELI2) carry inflammasome regulation
      terms, so an E3 acting on NLRP3 taking such a term follows the
      established convention rather than inventing a use for it. GO:0141087 is
      preferred over GO:1900227 positive regulation of NLRP3 inflammasome
      complex assembly because complex assembly as such was not assayed; what
      was measured was signalling output (caspase-1, IL-1 beta, pyroptosis).
      This paper is the only one on this gene with full text available, and
      all the key panels are visible.
    supported_by:
    - reference_id: PMID:33117724
      supporting_text: the ubiquitination of NLRP3 was catalyzed by IpaH4.5 mainly
        at position K63 (Figure 2B)
    - reference_id: PMID:33117724
      supporting_text: Quantitative RT-PCR showed that NLRP3 mRNA levels were not affected
