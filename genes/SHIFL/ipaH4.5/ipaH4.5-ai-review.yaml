      the abstract is readable and the GONUTS record of the student's evidence
      could not be retrieved, the row is not removed or second-guessed, per
      the curator-deference rule. It is marked non-core rather than accepted
      because autoubiquitination is a self-directed side reaction of the
      catalytic cycle, not one of the gene's evolved functions; the
      biologically meaningful activity is the modification of host substrates.
