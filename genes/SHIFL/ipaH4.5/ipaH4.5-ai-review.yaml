- id: PMID:11418613
  title: Shigella protein IpaH(9.8) is secreted from bacteria within mammalian cells
    and transported to the nucleus.
  full_text_unavailable: true
  findings:
  - statement: >-
      IpaH proteins are secreted by Shigella into the extracellular medium via
      the type III secretion system, later in the secretion hierarchy than the
      IpaBCD translocators.
    supporting_text: Upon incubation in a medium containing Congo red, the bacteria
      secrete IpaH into the medium, but secretion of IpaH occurs later than that of
      IpaBCD.
  - statement: >-
      The nuclear import described in this paper is a property of the paralog
      IpaH9.8 and is not reported for IpaH4.5.
    supporting_text: Immunofluorescence microscopy indicated that IpaH(9.8) is secreted
      from intracellular bacteria and transported into the nucleus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the title and the nuclear-transport experiments concern
      the paralog IpaH9.8, but the Congo-red secretion survey is explicitly
      about the IpaH proteins as a group, which is what the GO:0005576
      annotation rests on, and the UniProt curator cites this paper on the
      P18009 entry under SUBCELLULAR LOCATION AND SECRETION VIA TYPE III
      SECRETION SYSTEM. Correctly cited for secretion; it would be a
