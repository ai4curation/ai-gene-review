- id: PMID:33117724
  title: The Shigella Type III Secretion Effector IpaH4.5 Targets NLRP3 to Activate
    Inflammasome Signaling.
  findings:
  - statement: >-
      IpaH4.5 catalyses mainly K63-linked ubiquitination of NLRP3, and the
      catalytically dead C379A variant does not, identifying Cys379 as the
      active-site cysteine of the NEL domain in this protein.
    supporting_text: mutation of the IpaH4.5 E3 ligase motif (C379A mutant) did not
      upregulate NLRP3 ubiquitination to the same intensity as wildtype IpaH4.5 (Figure
      2A)
  - statement: >-
      IpaH4.5 raises NLRP3 protein without changing NLRP3 mRNA, so it
      stabilizes the protein post-transcriptionally, and it does not affect
      NLRC4.
    supporting_text: Quantitative RT-PCR showed that NLRP3 mRNA levels were not affected
      by IpaH4.5 overexpression (Figure 3D), suggesting that IpaH4.5 stabilized NLRP3
      protein by posttranscriptional modification.
  - statement: >-
      IpaH4.5 increases caspase-1 activation, IL-1 beta production and
      pyroptosis in Shigella-infected macrophages, and this requires its E3
      ligase activity.
    supporting_text: Mutation of the IpaH4.5 E3 ligase motif not only abolishes NLRP3
      inflammasome signaling but also dramatically reduces the ability of Shigella
      to induce cell pyroptosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified and the only paper on this gene with full text in our
      cache. Mechanistically the strongest: substrate interaction, chain
      linkage mapping, a C379A catalytic-dead control, and a deletion strain
      complemented with both wild-type and C379A alleles. Basis for the
      proposed NEW GO:0141087 row.
- id: PMID:34296983
  title: Shigella escapes lysosomal degradation through inactivation of Rab31 by IpaH4.5.
  full_text_unavailable: true
  findings:
  - statement: >-
      This paper reports that IpaH4.5 carries TBC-like dual-finger motifs and
      acts as a Rab31 GTPase-activating protein, disrupting CD-MPR trafficking
      from Golgi to endosome and attenuating lysosomal function. The claim is
      recorded here but is not annotated, because a GAP activity would be a
      second catalytic function in a protein whose only recognized catalytic
      module is the NEL domain, and no TBC-like motif is annotated in P18009.
    supporting_text: IpaH4.5 harbours TBC-like dual-finger motifs and exhibits potent
      RabGAP activities towards Rab31.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified as an identifier and as being about IpaH4.5, but the
      scientific claim is not independently corroborated: a single
      abstract-only paper from one group, asserting a TBC-like RabGAP module
      that UniProt, Pfam and PROSITE do not detect in P18009 (which matches
      only LRR_TTSS and NEL). Carried as an open question and a suggested
      experiment rather than as an annotation.
- id: PMID:1791758
  title: Sequence variation in two ipaH genes of Shigella flexneri 5 and homology to
    the LRG-like family of proteins.
