- id: PMID:30414351
  title: Shigella effector IpaH4.5 targets 19S regulatory particle subunit RPN13 in
    the 26S proteasome to dampen cytotoxic T lymphocyte activation.
  full_text_unavailable: true
  findings:
  - statement: >-
      IpaH4.5 ubiquitinates the 19S regulatory particle subunit RPN13 and
      drives its degradation through the ubiquitin-proteasome system,
      disorganizing the 26S proteasome and reducing MHC class I antigen
      cross-presentation to CD8+ T cells.
    supporting_text: targets the proteasome regulatory particle non-ATPase 13 (RPN13)
      and induces its degradation via the ubiquitin-proteasome system (UPS)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
