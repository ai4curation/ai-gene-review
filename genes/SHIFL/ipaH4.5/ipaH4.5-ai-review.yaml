id: P18009
gene_symbol: ipaH4.5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:623
  label: Shigella flexneri
description: >-
  IpaH4.5 is a plasmid-encoded type III secretion system effector of Shigella
  flexneri and a member of the IpaH/SspH family of bacterial E3 ubiquitin
  ligases. Its 574-residue sequence has two modules: an N-terminal
  leucine-rich-repeat solenoid (ten LRRs, residues 63-270) that selects host
  substrates, and a C-terminal NEL (Novel E3 Ligase) catalytic domain
  (residues 295-574) whose active-site cysteine, Cys379, forms a thioester
  with the C-terminal glycine of ubiquitin before transferring it to a
  substrate lysine. This is a HECT-like, cysteine-dependent mechanism rather
  than a RING scaffold, and a C379A substitution abolishes activity. The
  protein is exported by the Mxi-Spa injectisome and acts in the cytoplasm of
  the infected host cell, where it hijacks the host ubiquitin-proteasome
  system to remodel innate immune signalling. Characterized substrates are all
  host cytosolic signalling proteins, and the N-terminal LRR region, which
  differs between IpaH paralogs, is what makes the choice of substrate
  paralog-specific. IpaH4.5 polyubiquitinates the NF-kappaB subunit p65 and
  suppresses NF-kappaB-dependent transcription, so cells and mice infected
  with an ipaH4.5 deletion mutant mount a stronger pro-inflammatory cytokine
  response; it attaches K48 chains to the kinase TBK1, driving its proteasomal
  degradation and preventing IRF3 phosphorylation, nuclear import and
  activation; and it degrades the 19S proteasome subunit RPN13, which
  disorganizes the 26S proteasome and reduces MHC class I antigen
  cross-presentation to CD8+ T cells. Not all of its effects are suppressive:
  IpaH4.5 also attaches K63 chains to NLRP3, stabilizing the protein without
  changing its mRNA level and thereby increasing caspase-1 activation,
  interleukin-1 beta release and pyroptosis in infected macrophages. Together
  these activities make IpaH4.5 a virulence factor that both blunts the
  interferon and NF-kappaB arms of innate immunity and reshapes inflammasome
  output in favour of bacterial colonization.
