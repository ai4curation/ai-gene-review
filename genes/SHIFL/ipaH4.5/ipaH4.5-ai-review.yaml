      measured with an NF-kappaB-response-element dual-luciferase reporter,
      with reduced MIP-2 and TNF-alpha in vivo as the downstream consequence.
    action: MODIFY
    reason: >-
      CACAO row (ASSIGNED BY = CACAO, IDA, PMID:23083102). The assay behind
      the row is the NF-kappaB promoter-response-element luciferase reporter
      plus the in vitro p65 ubiquitination; the gene product does the work of
      that step (it is the ligase that modifies p65), so the aspect is right
      and the evidence code fits. The term, however, names the wrong
      molecular step: suppression of host translation, not of host
      transcription or signalling. This is a wrong-step substitution within
      the correct region of the ontology, not a false claim and not a
      downstream phenotype, so it is modified rather than removed, in keeping
      with the curator-deference rule (the full text and the GONUTS evidence
      notes could not be read: gowiki.tamu.edu is offline and no archived
