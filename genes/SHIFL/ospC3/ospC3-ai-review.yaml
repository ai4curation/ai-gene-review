  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. The source of the calmodulin-binding,
      calcium-signalling and signal-transduction rows, and of the four GO-CAM
      models of this mechanism. Its figures distinguish the paralogs explicitly,
      including the OspC2 negative control.
- id: PMID:36624349
  title: Structural mechanisms of calmodulin activation of Shigella effector OspC3
    to ADP-riboxanate caspase-4/11 and block pyroptosis.
  findings:
  - statement: >-
      Ca2+-free calmodulin binds OspC3 and stimulates its ADP-riboxanase activity,
      making a host protein an obligatory cofactor of the effector enzyme.
    supporting_text: Here, we identify Ca2+-free calmodulin (CaM) that binds and stimulates
      OspC3 ADP-riboxanase activity.
  - statement: >-
      Calmodulin binds the N-terminal ADP-ribosyltransferase-like domain while
      caspase-4 is recognized by the ankyrin-repeat domain, so cofactor binding
      and substrate selection use different modules.
    supporting_text: Crystal structures of OspC3-CaM and OspC3-caspase-4 binary complexes
      reveal unique CaM binding to an OspC3 N-terminal domain featuring an ADP-ribosyltransferase-like
      fold and specific recognition of caspase-4 by an OspC3 ankryin repeat domain,
      respectively.
  - statement: >-
      NAD+ binding reorganizes the catalytic pocket, and Asp231 and Asp177 drive
      the ADP-ribosylation and the deamination half-reactions respectively.
    supporting_text: CaM-OspC3-caspase-4 ternary complex structures show that NAD+ binding
      reorganizes the catalytic pocket, in which D231 and D177 activate the substrate
      arginine for initial ADP-ribosylation and ribosyl 2'-OH in the ADP-ribosylated
      arginine, respectively, for subsequent deamination.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache, but the abstract alone states the cofactor role,
      the domain assignment and the catalytic residues, and UniProt's active-site,
      NAD+-binding and mutagenesis features for A0A0H2US87 are attributed to it.
      The strongest evidence on this entry.
- id: PMID:37014865
  title: Shigella IpaH9.8 limits GBP1-dependent LPS release from intracytosolic bacteria
    to suppress caspase-4 activation.
  findings:
  - statement: >-
      IpaH9.8-mediated degradation of guanylate-binding proteins acts upstream of
      OspC3, and the two effectors cooperate to suppress caspase-4-dependent
      pyroptosis of interferon-gamma-primed epithelial cells.
    supporting_text: We, and others, previously reported that Shigella OspC3 suppresses
      cell death via pyroptosis of infected naive untreated epithelial cells via inhibition
      of CASP4
  - statement: >-
      The paper treats OspC3's post-translational modification of CASP4 as
      established from the earlier literature rather than assaying it; its own
      OspC3 evidence is genetic.
    supporting_text: Shigella secrete ~30 unique effectors, including OspC3, an effector
      that directly posttranslationally modifies CASP4 to inhibit pyroptosis
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      Correctly identified paper and genuinely about OspC3, but used as the IDA
      evidence for the molecular function GO:0140740, which it does not assay: the
      full text is a genetic and cell-biological study of ΔospC3 and
      ΔospC3ΔipaH9.8 strains and cites the ADP-riboxanase activity from earlier
      work. Recorded as a WRONG_EVIDENCE_CODE source defect with SUSPECTED
      confidence, since supplementary material is not visible to us.
