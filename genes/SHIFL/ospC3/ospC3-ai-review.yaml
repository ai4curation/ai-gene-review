- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IDA
  original_reference_id: PMID:35568036
  qualifier: enables
  review:
    summary: >-
      Direct assay: OspC3 recovered calmodulin from a yeast two-hybrid screen of
      a human macrophage library, and calmodulin-bead pulldowns in EDTA with
      CaCl2 elution show that it is the Ca2+-free form that is bound. In this
      paper the biological reading of the binding is sabotage of the host sensor:
      calmodulin held in the apo state cannot activate CaMKII.
    action: ACCEPT
    reason: >-
      A directly assayed, informative molecular function naming a specific host
      partner, and the entry point of the interferon-suppression mechanism. Not
      bare GO:0005515, so the protein-binding policy does not apply. The term is
      kept as the binding claim; the consequence the authors draw from it,
      sequestration of the apo form, is added below as a separate GO:0140311 row
      rather than replacing this one.
    supported_by:
    - reference_id: PMID:35568036
      supporting_text: However, all three OspC effectors interacted with Apo-CaM
    - reference_id: file:SHIFL/ospC3/ospC3-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with host calmodulin (CALM1, CALM2 and/or CALM3);
        specifically interacts with the apo form of calmodulin, preventing calcium-binding.
- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IDA
  original_reference_id: PMID:36624349
  qualifier: enables
  review:
    summary: >-
      The same interaction seen from the opposite side. Here calmodulin is the
      enzyme's cofactor: apo-calmodulin binds the N-terminal
      ADP-ribosyltransferase-like domain, reorganizes the catalytic pocket so
      that NAD+ can bind, and stabilizes the ternary complex with caspase-4.
      Crystal structures of the OspC3-calmodulin binary complex and of the
      calmodulin-OspC3-caspase-4 ternary complex were solved, and UniProt records
      the dependence as ACTIVITY REGULATION: the interaction is required for
      arginine ADP-riboxanation of host caspases.
    action: ACCEPT
    reason: >-
      Structurally and biochemically established binding to a named host partner,
      with the strongest possible evidence for this gene product. It is not a
      duplicate of the row above even though the term is the same: that row reads
      the binding as inhibition of the host sensor, this one as activation of the
      effector enzyme, and both are true of the same complex. Core molecular
      function, since without this interaction the ADP-riboxanase does not work.
    supported_by:
    - reference_id: PMID:36624349
      supporting_text: Here, we identify Ca2+-free calmodulin (CaM) that binds and
        stimulates OspC3 ADP-riboxanase activity.
    - reference_id: PMID:36624349
      supporting_text: Crystal structures of OspC3-CaM and OspC3-caspase-4 binary complexes
        reveal unique CaM binding to an OspC3 N-terminal domain featuring an ADP-ribosyltransferase-like
        fold and specific recognition of caspase-4 by an OspC3 ankryin repeat domain,
        respectively.
    - reference_id: file:SHIFL/ospC3/ospC3-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: Interaction with host calmodulin (CALM1, CALM2 and/or CALM3)
        is required to mediate arginine ADP-riboxanation of host caspases.
- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:35568036
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation for what the calmodulin binding does to the host.
      OspC3 holds calmodulin in its Ca2+-free state, so calmodulin cannot load
      Ca2+ and cannot bind or activate CaMKII: T286 autophosphorylation of CaMKII
      is lost on OspC3 expression and is restored during infection with strains
      lacking ospC3, and constitutively active CaMKII bypasses the block, which
      places the lesion at calmodulin itself.
    action: NEW
    reason: >-
      GO:0140311 is defined as binding a protein to prevent it from interacting
      with other partners, which is the authors' stated model, and OspC3 performs
      that step itself. The claim is separable from plain calmodulin binding:
      OspC2 binds apo-calmodulin as well as OspC3 does but does not block the
      calmodulin-CaMKII interaction, so sequestration carries information that
      GO:0005516 does not. This is a lateral re-typing rather than a refinement,
      so it is added beside the binding rows instead of replacing them.
    supported_by:
    - reference_id: PMID:35568036
      supporting_text: This suggests a model whereby OspC recruits and sequesters CaM
        in the absence of Ca2+, thus preventing its downstream activation of CaMKII.
    - reference_id: PMID:35568036
      supporting_text: pCaMKII binding to CaM was similarly inhibited by OspC1 or OspC3
        but not OspC2
    - reference_id: PMID:35568036
      supporting_text: However, in the presence of active GFP-CaMKII, OspC1 and OspC3
        were no longer able to significantly block ISRE activation (Figure 4K, black
        bars).
