    label: symbiont-mediated suppression of host programmed cell death
  evidence_type: IDA
  original_reference_id: PMID:23684308
  qualifier: involved_in
  review:
    summary: >-
      The paper that discovered the function. Shigella infection induces acute
      caspase-4-dependent inflammatory epithelial cell death, OspC3 counteracts
      it, and a ΔospC3 mutant causes more inflammatory cell death in guinea pigs
      with lower bacterial burdens. The mechanism proposed here (insertion of a
      conserved motif into the caspase-4 catalytic pocket to block p19-p10
