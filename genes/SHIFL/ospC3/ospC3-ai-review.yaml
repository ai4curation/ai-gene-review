core_functions:
- description: >-
    Calmodulin-activated arginine ADP-riboxanase acting on the LPS-sensing
    caspases. Using NAD+, OspC3 transfers ADP-ribose onto the guanidinium
    nitrogen of a single arginine in the caspase catalytic centre (Arg314 of
    human caspase-4, Arg310 of mouse caspase-11) and then deaminates and cyclizes
    it to an oxazolidine ring. The modified caspase cannot autoprocess and cannot
    recognize or cleave gasdermin D, so cytosolic LPS no longer triggers
    pyroptosis and the infected epithelial cell survives as a replicative niche.
    Substrate choice rests on the C-terminal ankyrin-repeat domain, which in
    OspC3 but not in its paralogs recognizes caspase-4/11; catalysis rests on
    Asp231 and Asp177 for the two half-reactions.
  molecular_function:
    id: GO:0140740
    label: ADP-riboxanase-[protein] activity
  directly_involved_in:
