    summary: >-
      Reactome's compartment assignment for the OspC3-calmodulin binding event,
      which it models in the human cell. Since Reactome's pathway is a human
      pathway, the compartment it means is the cytosol of the infected host cell,
      where apo-calmodulin is and where the complex forms.
