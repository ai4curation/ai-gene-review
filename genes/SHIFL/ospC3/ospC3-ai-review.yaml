proposed_new_terms: []
knowledge_gaps:
- gap_statement: >-
    How OspC3 reconciles its two opposite uses of calmodulin in the same infected
    cell is unknown. Catalysis requires calmodulin to be bound, yet the
    interferon block works by denying calmodulin to the host, and the two
    activities place different demands on the complex: the enzyme needs turnover
    with caspase-4, the sequestration needs the calmodulin to stay occupied.
    Whether one pool of OspC3-calmodulin serves both, whether local calmodulin
    concentration or Ca2+ flux partitions them, and what the stoichiometry is at
    the effector doses delivered during infection are all open.
  boundary: >-
    Firmly established: apo-calmodulin binds the N-terminal domain, is required
    for ADP-riboxanation of caspase-4/11, and is held in the Ca2+-free state so
    that CaMKII is not activated; the catalytic residues and the ankyrin domain
    are dispensable for the interferon block, and active CaMKII bypasses it.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    The answer decides whether the interferon block is a side effect of
    recruiting a cofactor or an independently selected activity, and it bears on
    whether a calmodulin-interface inhibitor could disable both arms at once.
- gap_statement: >-
    Why OspC3 inhibits human caspase-4 but, in the mouse study of cytosolic LPS
    sensing, not caspase-11 is unresolved, even though the biochemical work maps
    ADP-riboxanation to Arg310 of caspase-11 and shows that it paralyses
    pyroptotic defence in infected mice. Whether the discrepancy is a matter of
    recognition by the ankyrin domain, of effector dose or timing in the mouse
    cell, or of which cell types were compared has not been settled.
  boundary: >-
    Firmly established: Arg314 of human caspase-4 and Arg310 of mouse caspase-11
    are both ADP-riboxanated in vitro, the modification blocks autoprocessing and
    gasdermin D cleavage, and ospC3 mutation stimulates caspase-11- and
    gasdermin-D-dependent immunity in mice.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    Shigella is a human-restricted pathogen and mouse models underpin much of the
    work on this axis; whether OspC3 engages caspase-11 in vivo determines how far
    those models report on human infection.
suggested_questions:
- question: >-
    The three Reactome-derived rows place OspC3 in GO:0005829 cytosol. Reactome
    models the human pathway, so the compartment meant is the infected host cell's
    cytosol, but read on a Shigella gene product the bare term asserts the
    bacterial cytosol. Should these rows use GO:0044164 host cell cytosol, and
    should the same substitution be made for other secreted bacterial effectors
    that Reactome places in human compartments?
- question: >-
    GO:0140740 ADP-riboxanase-[protein] activity is annotated to OspC3 with
    evidence IDA from PMID:37014865, a genetic study of IpaH9.8 and GBP1 that
    reports no enzyme assay and cites the activity from earlier work. Can the
    UniProt curators confirm whether an assay in supplementary material supports
    the IDA, or re-code the row?
- question: >-
    Calmodulin is simultaneously OspC3's required catalytic cofactor and the host
    protein it sequesters to block interferon signalling. GO:0005516 calmodulin
    binding cannot distinguish the two, and the GO-CAM models type the effector
    with it alone. Is there a representation that keeps both readings, for example
    the cofactor role on the catalytic activity and GO:0140311 protein
    sequestering activity as a second activity of the same protein?
suggested_experiments:
- description: >-
    Separate the cofactor and the sequestration functions genetically. UniProt
    records calmodulin-interface substitutions for OspC3 (the 59-63 VKSFL to
    DKSDD change decreases binding; the I117A/L131A/I135A/L283A combination
    abolishes it). Test a graded series of such mutants, delivered from the
    bacterium in a ΔospC3 background, for ADP-riboxanation of caspase-4, for
    pyroptosis suppression, and for CaMKII T286 phosphorylation and ISG
    expression, to find whether any binding level supports catalysis without
    blocking the host sensor.
- description: >-
    Measure the stoichiometry and fate of the OspC3-calmodulin complex during
    infection. Quantify translocated OspC3 and free versus OspC3-bound calmodulin
    in infected epithelial cells by quantitative proteomics or a calmodulin
    biosensor, with and without a Ca2+ stimulus, to test whether a single complex
    pool can account for both the catalytic and the inhibitory phenotypes.
- description: >-
    Resolve the caspase-11 question in a single cell system. Reconstitute mouse
    caspase-11 and human caspase-4, and their arginine-to-lysine variants at
    Arg310 and Arg314, in caspase-deficient cells, infect with wild-type and
    ΔospC3 Shigella at matched effector doses, and compare ADP-riboxanation,
    gasdermin D cleavage and pyroptosis side by side.
