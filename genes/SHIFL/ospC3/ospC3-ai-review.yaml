    reason: >-
      Read on a Shigella gene product, the bare term GO:0005829 cytosol asserts
      the bacterial cytosol, which is wrong: OspC3 is exported by the type III
      secretion system and acts after delivery. GO:0044164 host cell cytosol is
      the host-perspective term for exactly what Reactome depicts (definition
      checked against the local GO build, 2026-11-04) and keeps the granularity
      of the original. This is a perspective correction, not a refinement, which
      is the long-standing lateral use of MODIFY.
