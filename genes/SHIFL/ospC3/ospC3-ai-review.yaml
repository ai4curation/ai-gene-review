- id: Reactome:R-HSA-9956602
  title: CALM binds bacterial OspC3
  findings:
  - statement: >-
      Calcium-free calmodulin binding reconfigures the OspC3 catalytic pocket to
      allow NAD+ binding and stabilizes the ternary complex with caspase-4.
    supporting_text: The catalytic activity of OspC3 is stimulated by its interaction
      with calcium-free calmodulin (CALM), which reconfigures the OspC3 catalytic pocket
      to facilitate NAD⁺ binding and promote stable ternary complex formation with CASP4
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Accurate summary of the structural work, consistent with PMID:36624349 and
      with UniProt's ACTIVITY REGULATION statement. Its compartment assignment is
      the human cytosol, which is why the cytosol rows derived from it are modified
      to GO:0044164 host cell cytosol for a bacterial gene product.
- id: Reactome:R-HSA-9956624
  title: OspC3 ADP-riboxanates CASP4
  findings:
  - statement: >-
      OspC3 ADP-riboxanates Arg314 in the caspase-4 catalytic centre in two steps,
      NAD+-dependent ADP-ribosylation followed by deamination to an oxazolidine
      ring.
    supporting_text: OspC3 catalyzes ADP-riboxanation of CASP4 at arginine residue
      314 (R314) in the caspase catalytic center by transferring ADP-ribose from NAD⁺
      to the Nδ atom of the arginine side chain, followed by deamination of an Nω group
      to generate an oxazolidine ring structure
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Accurate curated description of the catalytic event, matching PMID:34671164
      and PMID:36624349. Same compartment caveat as the other Reactome entries.
- id: Reactome:R-HSA-9956667
  title: CASP4 binds CALM:OspC3
  findings:
  - statement: >-
      Substrate recognition is by the OspC3 ankyrin-repeat domain, and OspC3 binds
      both the procaspase and the processed forms of caspase-4.
    supporting_text: Structural and biochemical analyses have shown that OspC3 recognizes
      CASP4 via its ankyrin repeat domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Accurate curated description of substrate recognition, consistent with the
      crystallographic work. Same compartment caveat as the other Reactome entries.
