      domain and ADP-riboxanase activity of OspC3, which are essential for Caspase
      4 inhibition, are dispensable for its inhibition of IFN signaling and ISG expression.
  - statement: >-
      Constitutively active CaMKII bypasses the effectors, placing their target
      upstream of the kinase.
    supporting_text: However, in the presence of active GFP-CaMKII, OspC1 and OspC3
