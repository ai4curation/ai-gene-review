id: A0A0H2US87
gene_symbol: ospC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:623
  label: Shigella flexneri
description: >-
  OspC3 is a 484-residue effector protein encoded on the large virulence plasmid
  of Shigella flexneri and injected into the cytosol of infected epithelial cells
  by the type III secretion system. It is the best characterized of the three
  paralogous OspC-family effectors and has two modules: an N-terminal catalytic
  domain with an ADP-ribosyltransferase-like fold that binds NAD+, and a
  C-terminal ankyrin-repeat domain that selects the substrate. OspC3 is an
  arginine ADP-riboxanase (EC 4.3.99.-). It modifies a single arginine in the
  catalytic centre of the LPS-sensing caspases, Arg314 of human caspase-4 and
  Arg310 of mouse caspase-11, in two steps: NAD+-dependent ADP-ribosylation of
  the guanidinium nitrogen, then deamination and cyclization to an oxazolidine
  ring. The modified caspase can no longer autoprocess or cleave gasdermin D, so
  cytosolic LPS no longer triggers pyroptosis and the infected cell survives as a
  replicative niche; a ΔospC3 mutant provokes caspase-4-dependent epithelial cell
  death and is cleared better in animal infection. Catalysis depends on an
  unusual eukaryotic cofactor: Ca2+-free calmodulin binds the N-terminal domain,
  reorganizes the catalytic pocket so NAD+ can bind, and stabilizes the ternary
  complex with caspase-4. The same binding event has a second consequence that
  needs no catalysis: it holds host calmodulin in the Ca2+-free state so that it
  cannot activate Ca2+/calmodulin-dependent protein kinase II;
  interferon-induced STAT1 phosphorylation and interferon-stimulated gene
  expression are then lost, for interferons of all three families. OspC3
  therefore makes the infected cell both pyroptosis-resistant and
  interferon-blind, through one host-protein interaction read two ways and one
  catalytic activity aimed at a single caspase arginine.
