  - reference_id: PMID:36624349
    supporting_text: CaM-OspC3-caspase-4 ternary complex structures show that NAD+ binding
      reorganizes the catalytic pocket, in which D231 and D177 activate the substrate
      arginine for initial ADP-ribosylation and ribosyl 2'-OH in the ADP-ribosylated
      arginine, respectively, for subsequent deamination.
- description: >-
    Binding of host apo-calmodulin as an obligatory cofactor of catalysis.
    Ca2+-free calmodulin binds the N-terminal ADP-ribosyltransferase-like domain
    of OspC3, reorganizes the catalytic pocket so that NAD+ can bind, and
    stabilizes the ternary complex with caspase-4. This is not a regulatory
    nicety but a requirement: without the interaction OspC3 does not
    ADP-riboxanate its substrate, which makes a eukaryotic protein part of the
    effector's own active enzyme.
