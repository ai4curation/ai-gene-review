    label: symbiont-mediated suppression of host signal transduction pathway
  evidence_type: IDA
  original_reference_id: PMID:35568036
  qualifier: involved_in
  review:
    summary: >-
      The paper shows that OspC1 suppresses interferon signalling specifically:
      it blocks signalling downstream of type I, type II and type III
      interferons, abolishes IFN-beta-induced STAT1 phosphorylation, and
      suppresses interferon-stimulated gene expression genome-wide by RNA-seq and
      at the level of individual ISGs such as Tetherin.
    action: MODIFY
    reason: >-
      The claim is right but the term is less specific than the evidence
      supports. GO:0140886 symbiont-mediated suppression of host
      interferon-mediated signaling pathway is an is_a descendant of GO:0052029
      (checked against the local GO build, 2026-11-04) and names the pathway the
      paper actually assays. The type-generic child is chosen rather than
      GO:0039502, which is restricted to type I interferon, because the
      inhibition covers all three interferon families. The sibling row GO:0075135
      covers the calcium-signalling arm of the same mechanism, so this row is
      refined to the interferon arm rather than left at the uninformative parent
      of both.
    proposed_replacement_terms:
    - id: GO:0140886
      label: symbiont-mediated suppression of host interferon-mediated signaling pathway
    supported_by:
    - reference_id: PMID:35568036
      supporting_text: We found that OspC1 and OspC3 blocked signaling downstream of
