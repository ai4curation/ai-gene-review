- term:
    id: GO:0052041
    label: symbiont-mediated suppression of host programmed cell death
  evidence_type: IDA
  original_reference_id: PMID:32657447
  qualifier: involved_in
  review:
    summary: >-
      OspC1 prevents caspase-8 activation in infected human epithelial cells and
      thereby blocks apoptosis; the phenotype is lost in a ΔospC1 mutant and
      restored by complementation with ospC1. UniProt's curated FUNCTION ties the
      mechanism to ADP-riboxanation of the apoptotic caspases CASP3, CASP8 and
      CASP9, and the disruption phenotype recorded on the entry is apoptosis
      driven by increased CASP8 activation.
    action: ACCEPT
    reason: >-
      The gene product does the work of this process: it is the enzyme that
      modifies the caspases whose activation is prevented. Mutant and
      complementation evidence from the same infection model supports it, and the
      term is at the right granularity, since the paper's readouts span caspase-8
      activity, apoptotic death and the resulting switch to necroptosis, so a
      narrower apoptosis-only child would understate what is shown. Core
      biological process.
    supported_by:
    - reference_id: PMID:32657447
      supporting_text: We identified a dual inhibitory mechanism in which apoptosis is
        prevented by the Shigella T3SS effector OspC1 and necroptosis by the OspD3 effector.
    - reference_id: PMID:32657447
