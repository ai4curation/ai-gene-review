- term:
    id: GO:0075135
    label: symbiont-mediated suppression of host calcium-mediated signal transduction
  evidence_type: IDA
  original_reference_id: PMID:35568036
  qualifier: involved_in
  review:
    summary: >-
      OspC1 holds the host Ca2+ sensor calmodulin in its Ca2+-free state, so the
      calcium signal is not transduced: CaMKII T286 autophosphorylation is lost
      on effector expression, is restored in cells and in mouse colon infected
      with strains lacking ospC1, and constitutively active CaMKII bypasses the
      block, confirming that the interruption is at the calmodulin step.
    action: ACCEPT
    reason: >-
      The term matches the mechanism exactly and at the right granularity, and
      OspC1 performs the step itself, being the entity that occupies calmodulin.
      The evidence is a direct assay of this gene product in both transfection
      and infection, with an in vivo confirmation. This is one of the two core
      biological processes of the protein.
    supported_by:
    - reference_id: PMID:35568036
      supporting_text: This suggests a model whereby OspC recruits and sequesters CaM
        in the absence of Ca2+, thus preventing its downstream activation of CaMKII.
    - reference_id: PMID:35568036
      supporting_text: T286 phosphorylation was reduced upon expression of OspC1 or
        OspC3 but not OspC2 (Figure 3F).
    - reference_id: PMID:35568036
      supporting_text: At 24 h postinfection, comparable phosphorylation of CaMKII was
        found in the colons of uninfected and WT Shigella-infected mice, whereas those
