    supporting_text: We identified a dual inhibitory mechanism in which apoptosis is
      prevented by the Shigella T3SS effector OspC1 and necroptosis by the OspD3 effector.
- description: >-
    Sequestration of Ca2+-free calmodulin. The N-terminal region of OspC1 binds
    apo-calmodulin and holds it in that state, so calmodulin cannot load Ca2+
    and cannot bind or activate CaMKII. The downstream consequence is loss of
    CaMKII T286 autophosphorylation, loss of STAT1 phosphorylation and loss of
    interferon-stimulated gene expression in response to interferons of all
    three families. The activity needs neither the catalytic residues nor the
    ankyrin repeats that mediate caspase modification, and constitutively active
    CaMKII bypasses it, which places the target at calmodulin itself.
