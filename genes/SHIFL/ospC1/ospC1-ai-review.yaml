- id: PMID:16988276
  title: OspF and OspC1 are Shigella flexneri type III secretion system effectors
    that are required for postinvasion aspects of virulence.
  findings:
  - statement: >-
      OspC1 is secreted by S. flexneri in a type-III-secretion-system-dependent
      manner, shown with a double-hemagglutinin-tagged construct.
    supporting_text: verified that these proteins are secreted in a T3SS-dependent
      manner
  - statement: >-
      Delivered OspC1 is found in both the cytoplasm and the nucleus of infected
      HeLa cells.
    supporting_text: both proteins localize in the nucleus and cytoplasm of host cells
  - statement: >-
      A ΔospC1 mutant invades and forms plaques normally but is defective in
      neutrophil transepithelial migration, a phenotype that has never been
      attributed to either characterized biochemical activity of the protein.
    supporting_text: in the polymorphonuclear (PMN) cell migration assay, a decrease
      in neutrophil migration was observed for both mutants in comparison to the migration
      of wild-type bacteria
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title, authors and content match the record cited by UniProt for the
      secretion and host-nucleus locations of Q8VSJ7. Abstract-only in the cache,
      but the localization and secretion claims are stated in the abstract itself.
      This is the paper that should carry the host-cell-cytoplasm annotation.
- id: PMID:23684308
  title: The Shigella OspC3 effector inhibits caspase-4, antagonizes inflammatory
    cell death, and promotes epithelial infection.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, but it is a study of the paralog OspC3; its relevance to
      OspC1 is limited to the secretion data that UniProt cites from it with
      experimental evidence for the Secreted location of Q8VSJ7. Cached
      abstract-only, so the OspC1-specific content could not be read directly;
      the claim is not second-guessed on that basis.
- id: PMID:32657447
  title: A unique bacterial tactic to circumvent the cell death crosstalk induced
    by blockade of caspase-8.
  findings:
  - statement: >-
      OspC1 prevents caspase-8 activation and apoptosis in infected human
      epithelial cells, and the blockade is itself sensed by the host, which
      switches to necroptosis unless OspD3 is also present.
    supporting_text: We identified a dual inhibitory mechanism in which apoptosis is
      prevented by the Shigella T3SS effector OspC1 and necroptosis by the OspD3 effector.
  - statement: >-
      The requirement is specific to ospC1: complementation of the deletion
      restores the phenotype.
    supporting_text: Intriguingly, the reduction in the levels of MLKL phosphorylation
      and cytotoxicity in cells infected with ΔospC1ΔospD3 was rescued by ospC1 gene
      complementation
  - statement: >-
      The three cell-death blocks are ordered during infection, with OspC3
      preventing pyroptosis first and OspC1 then preventing apoptosis.
    supporting_text: Taken together, these data reveal the order of sequential cell
      death inhibition by Shigella; OspC3 acts first to prevent pyroptosis, followed
      by OspC1‐mediated inhibition of apoptosis and OspD3‐mediated inhibition of necroptosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Deletion and complementation evidence for
      OspC1's anti-apoptotic role is explicit and is the basis of the GO:0052041
      annotation and of UniProt's disruption phenotype for Q8VSJ7.
- id: PMID:34409271
  title: Shigella OspC3 suppresses murine cytosolic LPS sensing.
  findings:
  - statement: >-
      The paper is a study of OspC3 and cytosolic LPS sensing; its cached full
      text does not mention OspC1 at all, so it cannot be the direct assay behind
      an OspC1 localization annotation.
    supporting_text: The Shigella T3SS effector OspC3 reportedly suppresses cytosolic
      LPS sensing by inhibiting caspase-4 but not caspase-11 activity.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Correctly identified paper, wrongly used: it is cited as the IDA evidence
      for GO:0030430 host cell cytoplasm on OspC1, but the full text is about the
      paralog OspC3 and never mentions OspC1. Recorded as a WRONG_REFERENCE source
      defect on that row, with PMID:16988276 as the correct citation. The same
      mis-keying appears in GO-CAM gomodel:62b4ffe300005467.
- id: PMID:34671164
  title: Shigella evades pyroptosis by arginine ADP-riboxanation of caspase-11.
  findings:
  - statement: >-
      Arginine ADP-riboxanation is the chemistry of the whole OspC family: OspC1
      and OspC2 share the enzymatic activity, and only OspC3's ankyrin-repeat
      domain recognizes caspase-4/11 as substrate.
    supporting_text: The enzymatic activity was shared by OspC1 and 2, whose ankyrin-repeat
      domains, unlike that of OspC3, could not recognize caspase-11/4.
  - statement: >-
      The modification is not ADP-ribosylation, although it consumes NAD+, and on
      caspase-4/11 it blocks autoprocessing and GSDMD cleavage.
    supporting_text: OspC3, but not its paralogues OspC1 and 2, covalently modified
      caspase-11/4
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache, but the abstract itself states the two facts
      used here: that OspC1 has the enzymatic activity, and that it does not
      recognize caspase-4/11. UniProt cites it with experimental evidence for the
      catalytic activity of Q8VSJ7.
- id: PMID:35338844
  title: Pathogen hijacks programmed cell death signaling by arginine ADPR-deacylization
    of caspases.
  findings:
  - statement: >-
      The family's arginine ADPR-deacylization (ADP-riboxanation) modifies
      caspase-3/-7/-8/-9 and so dysregulates apoptosis, necroptosis and
      pyroptosis; for caspase-3 the reaction requires host calmodulin as a
      cofactor.
    supporting_text: This modification involves ADP-ribosylation- and deamination-mediated
      cyclization on Arg207 of caspase-3 by a mechanism that requires the eukaryote-specific
      protein calmodulin (CaM), leading to inhibition of caspase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited. The abstract foregrounds the Chromobacterium violaceum
      homolog CopC rather than OspC1, and the cache is abstract-only, so the
      OspC1-specific experiments could not be read; UniProt nonetheless attributes
      the catalytic activity of Q8VSJ7 and the D172A/D226A mutagenesis to this
      paper with experimental evidence, and the row is accepted on that basis
      rather than second-guessed.
- id: PMID:35568036
  title: A family of conserved bacterial virulence factors dampens interferon responses
    by blocking calcium signaling.
  findings:
  - statement: >-
      OspC1 binds Ca2+-free calmodulin and sequesters it in that state, so
      calmodulin cannot activate CaMKII.
    supporting_text: This suggests a model whereby OspC recruits and sequesters CaM
      in the absence of Ca2+, thus preventing its downstream activation of CaMKII.
  - statement: >-
      Binding alone is not sufficient for inhibition: all three paralogs bind
      apo-calmodulin, but only OspC1 and OspC3 block the calmodulin-CaMKII
      interaction.
    supporting_text: pCaMKII binding to CaM was similarly inhibited by OspC1 or OspC3
      but not OspC2
  - statement: >-
      The interferon block covers all three interferon families and runs through
      STAT1 phosphorylation and interferon-stimulated gene expression.
    supporting_text: We found that OspC1 and OspC3 blocked signaling downstream of increasing
      concentrations of IFNs from all 3 families (Figure 1E).
  - statement: >-
      Constitutively active CaMKII bypasses the effectors, placing their target
      upstream of the kinase.
    supporting_text: However, in the presence of active GFP-CaMKII, OspC1 and OspC3
      were no longer able to significantly block ISRE activation (Figure 4K, black bars).
  - statement: >-
      The interferon-inhibitory and cell-death-inhibitory activities of the OspC
      effectors are mechanistically distinct, and OspC1's anti-apoptotic target is
      unidentified.
    supporting_text: OspC1 targets an unknown host factor to inhibit Caspase 3/7-mediated
      apoptosis
  - statement: >-
      Loss of both inhibitory paralogs attenuates Shigella in epithelial cells and
      in the mouse gut.
    supporting_text: The growth of Shigella lacking OspC1 and OspC3 was attenuated
      in epithelial cells and in a murine model of infection.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. This is the paper behind the calmodulin
      binding, calcium-signalling and signal-transduction rows, and its figures are
      explicit about which paralog does what. It is also the source cited by the
      four GO-CAM models of this mechanism.
