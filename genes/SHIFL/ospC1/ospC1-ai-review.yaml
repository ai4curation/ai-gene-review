proposed_new_terms: []
knowledge_gaps:
- gap_statement: >-
    The host protein whose ADP-riboxanation accounts for OspC1's anti-apoptotic
    effect in infected cells has not been identified. UniProt's curated function
    names CASP3, CASP8 and CASP9 as substrates, but the infection study that
    established the phenotype could not say whether OspC1 acts on caspase-8
    directly or on an upstream component, and the calmodulin study describes the
    target as unknown. Since the ankyrin-repeat domain is what selects substrates
    in this family and the OspC1 domain does not recognize caspase-4/11, which
    protein it does recognize in the apoptotic branch is an open biochemical
    question.
  boundary: >-
    Firmly established: OspC1 is an arginine ADP-riboxanase with a defined
    reaction and two active-site aspartates whose substitution abolishes
    activity; a ΔospC1 mutant fails to block caspase-8 activation and apoptosis
    and the defect is complemented by ospC1; OspC1 does not modify caspase-4 or
    caspase-11.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Substrate identity decides whether the apoptosis block is a direct caspase
    modification, as for OspC3 and caspase-4, or an indirect effect through an
    upstream regulator, and it determines what the correct molecular-level GO
    representation of the anti-apoptotic arm should be.
- gap_statement: >-
    What OspC1 does in the host nucleus is unknown. The protein is reproducibly
    seen in the nuclei of infected cells, yet both characterized activities,
    calmodulin sequestration and caspase ADP-riboxanation, operate on cytosolic
    substrates, and no nuclear substrate, partner or import signal has been
    described. Related to this, the oldest reported ΔospC1 phenotypes, reduced
    neutrophil transepithelial migration and reduced ERK1/2 phosphorylation in
    infected polarized intestinal cells, have never been connected to either
    known activity.
  boundary: >-
    Firmly established: OspC1-2HA delivered by infecting bacteria is detectable
    in both the cytoplasm and the nucleus of HeLa cells, and a ΔospC1 mutant is
    defective in PMN transepithelial migration and in ERK1/2 phosphorylation
    while invading and forming plaques normally.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    A nuclear activity would make OspC1 a trifunctional effector and could
    explain the migration and MAPK phenotypes that neither the cell-death nor
    the interferon mechanism accounts for.
suggested_questions:
- question: >-
    The IDA annotation of GO:0030430 host cell cytoplasm to OspC1 is keyed to
    PMID:34409271, a study of the paralog OspC3 whose full text does not mention
    OspC1, and the same reference carries the occurs_in evidence in GO-CAM
    gomodel:62b4ffe300005467. Can UniProt and the GO-CAM authors re-point both to
    PMID:16988276, which localizes OspC1-2HA directly, and check whether other
    assertions were carried over when the OspC1 records were cloned from the
    OspC3 ones?
- question: >-
    All four GO-CAM models from PMID:35568036 type the OspC effectors with
    GO:0005516 calmodulin binding, which names the partner but not the
    consequence and makes the inhibitory causal edge read as one binding activity
    regulating another. Should the effector activity be re-typed to GO:0140311
    protein sequestering activity, as the paper's own model statement and the
    OspC2 negative control both suggest?
- question: >-
    OspC2 binds apo-calmodulin as well as OspC1 and OspC3 do but does not block
    the calmodulin-CaMKII interaction, is much weaker against type I interferon
    and is inactive against interferon-gamma. Would a NOT annotation to
    GO:0075135 on OspC2 (UniProtKB:Q8VSL8) be the right way to record the
    family's informative negative?
suggested_experiments:
- description: >-
    Identify the host substrate of OspC1's ADP-riboxanase activity in infected
    cells. Express catalytically active OspC1 and the D172A/D226A dead mutants in
    epithelial cells, enrich ADP-riboxanated proteins and compare them by mass
    spectrometry, looking for the modified arginine on caspase-8 and caspase-3
    and for other modified proteins. Confirm with an arginine-to-lysine
    substitution at the mapped site, which should make the caspase refractory to
    OspC1 and restore apoptosis during infection.
- description: >-
    Test whether the nuclear pool of OspC1 has a function. Fuse OspC1 to a
    nuclear export signal and to a nuclear localization signal, deliver both from
    the bacterium in a ΔospC1 background, and ask which construct complements
    which phenotype: caspase-8 inhibition and apoptosis, interferon-stimulated
    gene suppression, and the older neutrophil transepithelial migration and
    ERK1/2 phosphorylation defects.
- description: >-
    Determine the structural basis of calmodulin inhibition and of OspC2's
    divergence. Solve the structure of the apo-calmodulin complex with the OspC1
    N-terminal domain, which AlphaFold models as the two calmodulin lobes
    wrapped around a single N-terminal helix, and swap that helix between OspC1
    and OspC2 to test whether it alone converts the non-inhibitory paralog into
    an inhibitor.
