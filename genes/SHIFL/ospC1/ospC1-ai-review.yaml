- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:34409271
  qualifier: is_active_in
  review:
    summary: >-
      The host cytoplasm is where OspC1 does its work: calmodulin is a cytosolic
      Ca2+ sensor, CaMKII activation is measured in the cytosol of infected
      cells, and the apoptotic caspases that OspC1 ADP-riboxanates are cytosolic.
      Immunofluorescence of HeLa cells infected with S. flexneri expressing
      OspC1-2HA shows the protein in the host cytoplasm directly. The cited
      reference, however, is a study of the paralog OspC3.
    action: ACCEPT
    reason: >-
      The location claim and the is_active_in qualifier are right, and this is
      the location named for the core activities in this review. The row is
      accepted on the strength of the direct localization in PMID:16988276 and of
      the cytosolic mechanism in PMID:35568036, with the mis-keyed reference
      recorded as a source defect rather than used as grounds for rejecting a
      true annotation.
    supported_by:
    - reference_id: PMID:16988276
      supporting_text: both proteins localize in the nucleus and cytoplasm of host
        cells
    - reference_id: PMID:35568036
      supporting_text: Moreover, although HeLa cells infected with WT Shigella exhibited
        little to no CaMKII phosphorylation, those infected with strains lacking either
        OspC1 or OspC3 demonstrated evidence of T286 phosphorylation that was further
        increased within cells infected with ΔospC1/C3 Shigella (Figure 3H, quantification
