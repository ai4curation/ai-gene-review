id: Q8VSJ7
gene_symbol: ospC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:623
  label: Shigella flexneri
description: >-
  OspC1 is a 470-residue effector protein encoded on the large virulence plasmid
  of Shigella flexneri and delivered into the cytoplasm of infected epithelial
  cells through the type III secretion system. It is one of three paralogous
  OspC-family effectors (OspC1, OspC2, OspC3) and is built of two functional
  modules: an N-terminal catalytic region that binds NAD+ and carries the
  arginine ADP-riboxanase active site, and a C-terminal ankyrin-repeat region
  that selects the host substrate. The two modules support two biochemically
  distinct and genetically separable activities. As an arginine ADP-riboxanase
  (EC 4.3.99.-) it consumes NAD+ to convert an arginine side chain of a target
  protein into a cyclized ADP-riboxanated arginine, releasing nicotinamide and
  ammonia; in the host cell this modification is placed on the apoptotic
  caspases CASP3, CASP8 and CASP9 and blocks their activation, so OspC1 prevents
  caspase-8-dependent apoptosis of the infected cell. Unlike its paralog OspC3,
  whose ankyrin repeats recognize caspase-4/11, OspC1 does not modify the
  LPS-sensing caspases and so does not block pyroptosis. Independently of
  catalysis, the N-terminal region binds Ca2+-free calmodulin and holds it in
  that state, so calmodulin cannot load Ca2+ and cannot activate
  Ca2+/calmodulin-dependent protein kinase II; the consequence is loss of STAT1
  phosphorylation and of interferon-stimulated gene expression downstream of
  type I, type II and type III interferons. OspC1 is also found in the nucleus
  of infected cells, where no activity has yet been assigned to it, and a
  deletion mutant shows reduced neutrophil transepithelial migration and reduced
  ERK1/2 phosphorylation by an unknown mechanism. Together the two activities
  keep the infected epithelial cell alive and interferon-blind, and loss of
  OspC1 together with OspC3 attenuates Shigella growth in epithelial cells and
  in the mouse gut.
existing_annotations:
- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IDA
  original_reference_id: PMID:35568036
  qualifier: enables
  review:
    summary: >-
      Direct assay of the interaction: full-length OspC1 was a bait in a yeast
      two-hybrid screen against a human macrophage cDNA library and recovered
      calmodulin, and calmodulin-bead pulldowns from lysates of cells expressing
      GFP-OspC1 captured the protein in EDTA buffer with CaCl2 elution, so it is
      the Ca2+-free (apo) form of calmodulin that is bound. UniProt records the
      same interaction as a curated SUBUNIT statement.
    action: ACCEPT
    reason: >-
      Calmodulin binding is a directly assayed, informative molecular function
      for this effector: it names a specific host partner and is the first step
      of the mechanism by which OspC1 blocks interferon signalling. It is not
      bare GO:0005515 protein binding, so the protein-binding policy does not
      apply. The term is kept at this granularity because the binding itself is
      what the assays measure; the functional consequence of the binding, which
      the authors state as sequestration of the apo form, is added as a separate
      GO:0140311 row below rather than replacing this one.
    supported_by:
    - reference_id: PMID:35568036
      supporting_text: However, all three OspC effectors interacted with Apo-CaM
    - reference_id: PMID:35568036
      supporting_text: OspC1 and OspC3 bind and inhibit calmodulin (CaM)
    - reference_id: file:SHIFL/ospC1/ospC1-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with host calmodulin (CALM1, CALM2 and/or CALM3);
        specifically interacts with the apo form of calmodulin, preventing calcium-binding.
- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:35568036
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation capturing what the calmodulin binding accomplishes.
      OspC1 binds the Ca2+-free form of calmodulin and holds it there, so
      calmodulin cannot load Ca2+ and cannot bind or activate its downstream
      partner CaMKII: CaMKII T286 autophosphorylation is lost on OspC1
      expression and during infection, and the block is bypassed by
      constitutively active CaMKII, placing the lesion on calmodulin itself
      rather than downstream.
    action: NEW
    reason: >-
      GO:0140311 is defined as binding a protein to prevent it from interacting
      with other partners, which is exactly the authors' stated model. OspC1
      performs this step itself: it is the entity that occupies apo-calmodulin.
      The informative negative in the same family, OspC2, binds apo-calmodulin
      but does not prevent the CaMKII interaction, which shows that binding and
      sequestration are separable claims, so the sequestering activity adds
      information that GO:0005516 does not carry. This is a lateral re-typing
      rather than a refinement of GO:0005516, which is why it is added beside
      that row instead of replacing it.
    supported_by:
    - reference_id: PMID:35568036
      supporting_text: This suggests a model whereby OspC recruits and sequesters CaM
        in the absence of Ca2+, thus preventing its downstream activation of CaMKII.
    - reference_id: PMID:35568036
      supporting_text: pCaMKII binding to CaM was similarly inhibited by OspC1 or OspC3
        but not OspC2
    - reference_id: PMID:35568036
      supporting_text: However, in the presence of active GFP-CaMKII, OspC1 and OspC3
        were no longer able to significantly block ISRE activation (Figure 4K, black
        bars).
