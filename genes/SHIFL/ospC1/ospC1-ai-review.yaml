  evidence_type: EXP
  original_reference_id: PMID:16988276
  qualifier: located_in
  review:
    summary: >-
      OspC1 tagged with a double hemagglutinin epitope was shown to be secreted
      by S. flexneri in a type-III-secretion-system-dependent manner, which is
      what puts the protein transiently outside the bacterium.
    action: KEEP_AS_NON_CORE
    reason: >-
      The observation is sound and is the direct assay behind the EXP code. It is
      non-core because the extracellular compartment is a transit state on the
      way into the host cell, not where OspC1 acts: both of its activities,
      apo-calmodulin sequestration and caspase ADP-riboxanation, require host
      cytosolic substrates. The annotation is kept rather than removed because
      T3SS-dependent export is a real, demonstrated property of the protein.
    supported_by:
