core_functions:
- description: >-
    Arginine ADP-riboxanase. Using NAD+ as donor, OspC1 converts an arginine
    side chain of a host target protein into a cyclized ADP-riboxanated
    arginine, releasing nicotinamide and ammonia. Its substrates in the infected
    cell are the apoptotic caspases CASP3, CASP8 and CASP9; the modification
    blocks their activation, so caspase-8-dependent apoptosis of the infected
    epithelial cell is prevented and the bacterium keeps its replicative niche.
    The chemistry is shared with the paralogs, while substrate choice rests on
    the C-terminal ankyrin repeats, which in OspC1 do not recognize the
    LPS-sensing caspases 4 and 11.
