  label: Cucumis melo
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a melon mitogen-activated protein kinase (Group
  D, TDY activation motif). ProTrek's top call is MAP kinase activity at a score of 18.92
  - an exact match to GOA and to this review's core molecular function, retrieved with a
  4-point margin over rank 2, the widest top-1 separation in the benchmark. The second
  call is the characteristic failure: JUN kinase activity, an animal-specific MAPK
  subfamily (JNK) that has no plant counterpart, offered for a plant protein. ProtNLM2
  made no GO prediction for this protein at all, so ProTrek adds coverage here.
  Assessment: 1 correct not novel (CNN), 1 correct not novel (CNN), 1 incorrect (PLI).
