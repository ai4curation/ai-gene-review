      label: protein serine kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 3 (score 13.94), another exact match to GOA. Correct but strictly less
        informative than rank 1; its presence at rank 3 shows the list mixing ontology depths
