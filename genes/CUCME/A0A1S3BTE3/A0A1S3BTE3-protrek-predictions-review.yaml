    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004705
      label: JUN kinase activity
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: TAXON_CONSTRAINT_VIOLATION
      summary: >-
        Rank 2 (score 14.87). JNK is a metazoan MAPK subfamily defined by its substrate,
        c-Jun; plants have no JNK orthologs and no c-Jun. This protein is a Group D
        (TDY-motif) plant MAPK. The call is simultaneously a within-family paralog error and
        a taxon-constraint violation, and it is the kind of error ProtNLM2's Evidencer
        explicitly filters for - a difference in pipeline design rather than in underlying
        model quality.
      supported_by:
        - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-uniprot.txt
          supporting_text: Belongs to the protein kinase superfamily. CMGC Ser/Thr protein kinase family
