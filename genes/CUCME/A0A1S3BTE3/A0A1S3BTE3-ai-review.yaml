- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology
    links
  findings:
    - statement: Correctly infers MAPK cascade involvement from the MAP kinase activity annotation via inter-ontology logical links.
- id: GO_REF:0000116
  title: Automatic Gene Ontology annotation based on Rhea mapping
  findings:
    - statement: Maps the ARBA-attached Rhea serine phosphorylation reaction to protein serine kinase activity.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
    - statement: ARBA assigns the broad signal transduction term, which is entailed by the more specific MAPK cascade annotation.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
