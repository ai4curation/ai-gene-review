- id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-uniprot.txt
  title: UniProt entry A0A1S3BTE3
  findings:
    - statement: Unreviewed TrEMBL entry (PE 3), 492 aa; protein name, EC number, catalytic activities and family note are all ARBA-derived.
    - statement: Matches MAPK-specific signatures (PROSITE PS01351, InterPro IPR003527, CDD STKc_TDY_MAPK) and the protein-kinase ATP-binding signature with binding site K54.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The signature cross-references and the PROSITE-ProRule ATP binding site are used as
      support. ARBA-derived statements (name, EC, Rhea reactions, family note) are not used
      as support.
- id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-bioinformatics/RESULTS.md
  title: A0A1S3BTE3 phylogenetic placement and catalytic-motif check
  findings:
    - statement: Catalytic residues and the TDY activation-loop motif are intact; the protein is a group D MAPK.
    - statement: In an NJ tree with all 20 Arabidopsis MPKs, it falls in the MPK18/MPK19/MPK20 clade, sister to MPK18+MPK19. The PANTHER subfamily of the target could not be determined.
- id: PMID:32407323
  title: Genome-wide identification of mitogen-activated protein kinase (MAPK) cascade and
    expression profiling of CmMAPKs in melon (Cucumis melo L.).
  findings:
    - statement: Identifies 14 melon MAPKs. CmMAPK19 (MELO3C016139, 492 aa, 56.6 kDa) is placed in group D, and its 492-aa length and MW match A0A1S3BTE3.
      supporting_text: "the remaining 7 members were assigned to group D (CmMAPK9-1, CmMAPK9-2, CmMAPK9-4, CmMAPK16, CmMAPK19, CmMAPK20-1 and CmMAPK20-2)"
    - statement: CmMAPK19 transcripts decreased under drought and after Podosphaera xanthii inoculation (qRT-PCR only).
      supporting_text: "Under drought stress, except that the transcription levels of CmMAPK19, CmMAPK20-1 and CmMAPK20-2 decreased"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only gene-specific publication. It establishes the identity of the gene as
      CmMAPK19 and its group D placement; the expression data are not functional evidence.
- id: PMID:25976104
  title: Genome-wide identification of MAPK, MAPKK, and MAPKKK gene families and transcriptional
    profiling analysis during development and stress response in cucumber.
  findings:
    - statement: In cucumber, group D MAPKs carry the TDY motif and lack the CD docking domain found in groups A-C.
      supporting_text: "the members of group D contain a TDY (Thr-Asp-Tyr) motif and form a more distant clade"
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cucurbit family survey that corroborates the group D classification criteria.
- id: PMID:19392697
  title: Arabidopsis mitogen-activated protein kinase MPK18 mediates cortical microtubule
    functions in plant cells.
  findings:
    - statement: Arabidopsis MPK18 (group D, same clade as the target) interacts with the MAPK phosphatase PHS1 in the cytoplasm and is required for normal microtubule-related functions.
      supporting_text: "Mutant mpk18 seedlings show defects in microtubule-related functions, and have moderately stabilized microtubules."
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Characterises the closest experimentally studied relative. The microtubule role is
      clade-specific and is NOT transferred, because the target's subfamily relative to
      MPK18 is unresolved. Abstract only.
- id: PMID:28848569
  title: The Arabidopsis Mitogen-Activated Protein Kinase Kinase Kinase 20 (MKKK20) Acts Upstream
    of MKK3 and MPK18 in Two Separate Signaling Pathways Involved in Root Microtubule Functions.
  findings:
    - statement: MKKK20 phosphorylates MPK18 directly, a non-canonical module that bypasses a MAP2K.
      supporting_text: "In vitro phosphorylation assays showed that MKKK20 phosphorylates both MKK3 and MPK18."
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Relative-level context for group D upstream wiring; not transferred as a gene-specific claim.
