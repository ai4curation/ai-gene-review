suggested_questions:
  - question: >-
      Which PANTHER subfamily does A0A1S3BTE3 score into (the MPK18 SF420, the MPK19 SF200 or
      another), and does a bootstrapped tree that includes cucurbit and other rosid group D
      MPKs resolve it as an ortholog of MPK18 or of MPK19?
  - question: >-
      Is this kinase activated by a MAP2K or, like Arabidopsis MPK18 with MKKK20, directly by
      a MAP3K?
  - question: >-
      Does the C-terminal extension that is typical of group D MPKs control localisation
      (for example to cortical microtubules) or substrate recognition?
suggested_experiments:
  - hypothesis: The recombinant protein has TDY-dependent MAP kinase activity.
    description: >-
      Express wild-type protein and T187A/Y189F and K54R mutants. Test autophosphorylation
      and myelin basic protein phosphorylation, with and without candidate melon MAP2Ks or
      MKKK20 orthologs as upstream activators.
    experiment_type: in vitro kinase assay
  - hypothesis: Like Arabidopsis MPK18, this kinase modulates cortical microtubule stability.
    description: >-
      Knock out the gene in melon (CRISPR) or silence it (VIGS). Score root growth on
      propyzamide/oryzalin, and test whether the protein interacts with melon PHS1 in BiFC.
    experiment_type: reverse genetics with microtubule-drug sensitivity assay
