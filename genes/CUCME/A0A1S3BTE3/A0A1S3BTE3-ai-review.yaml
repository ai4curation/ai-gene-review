id: A0A1S3BTE3
gene_symbol: A0A1S3BTE3
aliases:
  - LOC103492960
  - CmMAPK19
  - MELO3C016139
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3656
  label: Cucumis melo
description: >-
  A0A1S3BTE3 (LOC103492960; CmMAPK19 in the melon genome-wide MAPK survey) is a
  492-residue group D mitogen-activated protein kinase of muskmelon in the PTHR24055 MAPK
  family. It has a complete Ser/Thr protein kinase domain (residues 25-316) with the
  conserved catalytic residues: the VAIK lysine K54 that binds ATP, catalytic-loop HRD
  D151 and DFG D169. Its activation loop carries the TDY dual-phosphorylation motif
  (T187-D-Y189), which is diagnostic of plant group D MAPKs, and it has a C-terminal
  extension beyond the kinase domain. Group A-C MAPKs carry TEY instead. Like other MAPKs,
  it is expected to be activated by phosphorylation of the Thr and Tyr of this motif. Once
  active, it would phosphorylate Ser/Thr residues of substrate proteins with ATP as the
  phosphate donor, acting as the terminal kinase of a MAP kinase signalling module.
  Phylogenetically it falls in the Arabidopsis MPK18/MPK19/MPK20 clade of group D, as the
  sister of the MPK18 + MPK19 pair. Its specific upstream activators, substrates and
  physiological roles have not been studied. The only gene-specific data are qRT-PCR
  measurements: transcript levels fell in seedlings under drought and after inoculation
  with the powdery mildew fungus Podosphaera xanthii.
existing_annotations:
- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      Inferred by logical inference from the MAP kinase activity annotation. As a TDY-type
      MAPK with an intact kinase domain, this protein is a MAPK-tier kinase, and acting
      within a MAPK cascade is the defining process for that activity. Group D upstream
      wiring is poorly known. One characterised clade member, Arabidopsis MPK18, can be
      phosphorylated directly by the MAP3K MKKK20 without an intervening MAP2K. That
      qualifies the canonical three-tier topology for this clade but does not take the
      kinase out of MAPK signalling.
    action: ACCEPT
    reason: >-
      MAPK-cascade participation follows from the MAP kinase activity, which is well
      supported by the family signatures and the intact catalytic and TDY motifs. No more
      specific cascade can be assigned without gene-specific data.
    supported_by:
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-bioinformatics/RESULTS.md
        supporting_text: "TDY places the protein in plant MAPK group D (groups A-C carry TEY)."
      - reference_id: PMID:28848569
        supporting_text: "In vitro phosphorylation assays showed that MKKK20 phosphorylates both MKK3 and MPK18."
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      True, since the kinase binds ATP, but uninformative. ATP binding (GO:0005524), which is
      also annotated, is a more specific descendant and entails it.
    action: TOO_GENERAL
    reason: >-
      The more specific term ATP binding, supported by the PROSITE ATP-binding signature and
      the K54 binding site, is asserted elsewhere in this review.
    supported_by:
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-uniprot.txt
        supporting_text: "BINDING 54"
- term:
    id: GO:0004707
    label: MAP kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      The core molecular function. The protein belongs to the PTHR24055 MAPK family and
      matches the MAPK-specific PROSITE PS01351 and InterPro MAP_kinase_CS signatures and the
      CDD STKc_TDY_MAPK model. Every catalytic residue is retained (K54, HRD D151, DFG D169),
      along with the TDY activation-loop motif that is the dual-phosphorylation site of group
      D MAPKs. No melon biochemistry exists, but MAP kinase activity is the family-wide
      chemistry of PTHR24055 and does not depend on subfamily.
    action: ACCEPT
    reason: >-
      Family-level signature evidence and intact catalytic motifs support MAP kinase activity.
      This is the most specific MF term warranted.
    supported_by:
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-uniprot.txt
        supporting_text: "PROSITE; PS01351; MAPK; 1."
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-uniprot.txt
        supporting_text: "CDD; cd07859; STKc_TDY_MAPK; 1."
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-bioinformatics/RESULTS.md
        supporting_text: "Catalytic motifs are intact: glycine-rich loop GRGSYGVV (32-39), VAIK lysine K54, catalytic"
      - reference_id: PMID:32407323
        supporting_text: "the remaining 7 members were assigned to group D (CmMAPK9-1, CmMAPK9-2, CmMAPK9-4, CmMAPK16, CmMAPK19, CmMAPK20-1 and CmMAPK20-2)"
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      ATP is the phosphate donor for the kinase reaction. The protein matches the PROSITE
      protein-kinase ATP-binding signature, and the invariant VAIK lysine (K54) is retained.
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine property that is mechanistically required for the core kinase activity, but
      not itself the distinguishing function. It is kept as non-core.
    supported_by:
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-uniprot.txt
        supporting_text: "PROSITE; PS00107; PROTEIN_KINASE_ATP; 1."
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-uniprot.txt
        supporting_text: "BINDING 54"
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      True but uninformative. MAPK cascade (GO:0000165), which is also annotated here, is a
      descendant of signal transduction (via intracellular signaling cassette) and entails
