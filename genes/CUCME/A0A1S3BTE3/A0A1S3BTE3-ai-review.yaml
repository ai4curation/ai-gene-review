- term:
    id: GO:0106310
    label: protein serine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: >-
      Derived from the Rhea serine-phosphorylation reaction attached by ARBA. MAPKs are
      Pro-directed Ser/Thr kinases, so phosphorylation of seryl residues is genuine.
      GO:0106310 is not an ancestor of GO:0004707 MAP kinase activity (checked with OLS
      hierarchicalAncestors), so the two terms are not redundant.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct for a MAP kinase, but it describes only one residue specificity of an activity
      that MAP kinase activity already captures more informatively. It is kept as non-core.
    supported_by:
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-uniprot.txt
        supporting_text: "PROSITE; PS50011; PROTEIN_KINASE_DOM; 1."
      - reference_id: file:CUCME/A0A1S3BTE3/A0A1S3BTE3-bioinformatics/RESULTS.md
        supporting_text: "Catalytic motifs are intact: glycine-rich loop GRGSYGVV (32-39), VAIK lysine K54, catalytic"
references:
- id: GO_REF:0000104
  title: Electronic Gene Ontology annotations created by transferring manual GO annotations
    between related proteins based on shared sequence features
  findings:
