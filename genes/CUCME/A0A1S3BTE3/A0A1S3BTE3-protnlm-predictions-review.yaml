description: >-
  ProtNLM2 made no GO or subcellular-location predictions for this protein and
  returned only the name "Mitogen-activated protein kinase 15". The re-reviewed gene
  is a group D (TDY-motif) plant MAPK in the PTHR24055 family, placed in the
  Arabidopsis MPK18/MPK19/MPK20 clade, with an intact kinase domain; its existing
  annotations (MAP kinase activity, protein serine kinase activity, ATP binding, MAPK
  cascade and their general parents) rest on family signatures, and no gene-specific
  functional study exists. The absence of predictions is recorded as assessed: there
  is no ProtNLM2 GO term to score, and nothing the model omitted conflicts with the
  gene review. The name is a generic group D MAPK label; the MPK15 numbering is not
  supported by the clade placement, but names are outside the scope of this GO
  prediction review.
