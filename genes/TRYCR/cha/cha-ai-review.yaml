id: Q966X9
gene_symbol: cha
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5693
  label: Trypanosoma cruzi
description: >-
  Chagasin is a small (110-residue), heat-stable, secreted-pathway protein of
  Trypanosoma cruzi and the signature member of the I42 family of natural cysteine
  peptidase inhibitors. It adopts an immunoglobulin-like fold unrelated to the
  cystatins, and presents three loops (BC/L2, DE/L4 and FG/L6) on one face as a
  tripartite wedge that occludes the substrate-binding cleft of papain-family (clan
  CA, family C1) cysteine peptidases; the central BC loop inserts into the catalytic
  centre and contacts the catalytic cysteine and histidine. Binding is 1:1, reversible
  and picomolar, and it is broad across the C1 family: chagasin inactivates papain,
  human cathepsins L and B, the Plasmodium protease falcipain-2, and, above all,
  cruzipain, the parasite's own major lysosomal cysteine peptidase. Inside the parasite,
  chagasin and cruzipain traffic through overlapping compartments, and inhibitory
  complexes between them are recovered from living cells; raising chagasin levels
  genetically collapses parasite peptidase activity, which in turn slows metacyclogenesis
  and lowers infectivity for mammalian cells. Its demonstrated biological role is
  therefore the endogenous rheostat of the parasite's own proteolysis. Immunogold
  electron microscopy places chagasin in the flagellar (ciliary) pocket and cytoplasmic
  vesicles of trypomastigotes, on the cell surface of amastigotes, and, together with
  cruzipain, in the Golgi complex and in reservosomes. Its tight inhibition of host
  cathepsins L and B is well characterised structurally but has so far been shown only
  with purified enzymes.
