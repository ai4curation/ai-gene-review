suggested_questions:
- question: >-
    Does chagasin ever reach a compartment in which it can inhibit a host cathepsin
    during infection? The structural and kinetic case for inhibition of human cathepsins
    L and B is strong but entirely in vitro, and the only hint of an extracellular pool is
    the upregulated secretion of cruzipain-chagasin complexes seen in transfectants. Until
    this is answered, no symbiont-mediated process term can be justified for this gene,
    and the distinction between inhibiting the parasite's own cruzipain and inhibiting host
    proteases remains the single most consequential open question for its annotation.
- question: >-
    What is the loss-of-function phenotype? Every genetic result for chagasin is
    gain-of-function (overexpression transfectants). A null or conditional knockdown would
    settle whether chagasin is required to keep cruzipain activity within bounds or merely
    able to suppress it when supplied in excess, which is the difference between a
    constitutive regulator and a buffer.
- question: >-
    Is the regulatory event the formation of complexes inside a compartment, or the
    intersection of two trafficking itineraries, as the discovery paper proposed? Chagasin
    and cruzipain were found together in the Golgi complex and reservosomes while free
    chagasin sits in unidentified small vesicles, so the inhibitory encounter may be
    confined to a specific waypoint rather than occurring throughout the pathway.
- question: >-
    Should GO acquire a term for inhibition of a cysteine-type endopeptidase as a
    biological process? GO:2000117 negative regulation of cysteine-type endopeptidase
    activity is obsolete, so a highly selective C1-family inhibitor such as chagasin can
    only be annotated at the class-agnostic GO:0010951, which loses the information that
    the regulated enzymes are specifically papain-family cysteine peptidases.
suggested_experiments:
- hypothesis: >-
    Chagasin inhibits host cathepsin L or B in infected host cells, not only as purified
    enzymes.
  description: >-
    Infect mammalian cells with wild-type and chagasin-overexpressing T. cruzi and measure
    host cathepsin L and B activity in situ with cell-permeable activity-based probes
    (for example biotinylated or fluorescent DCG-04) on host lysosomal fractions separated
    from parasite compartments, combined with proximity labelling from a tagged chagasin to
    identify host proteases it actually contacts. A positive result would license a
    symbiont-mediated modulation-of-host-protease process term; a negative result would
    confirm that the host-cathepsin affinity is a cross-reactivity of a broad-spectrum C1
    inhibitor and should stay confined to the molecular function.
  experiment_type: activity-based protein profiling and proximity labelling in infection
- hypothesis: >-
    Chagasin is required, not merely sufficient, to restrain endogenous cruzipain activity.
  description: >-
    Generate CRISPR-Cas9 chagasin-null and tetracycline-regulated knockdown T. cruzi lines
    and quantify active cysteine peptidase by active-site titration and activity-based
    probe labelling across epimastigote, metacyclic trypomastigote and amastigote stages,
    scoring metacyclogenesis rate and mammalian cell infectivity. This supplies the
    loss-of-function arm that the entire chagasin literature currently lacks and tests
    whether the GO:0010951 process annotation reflects a constitutive requirement.
  experiment_type: reverse genetics with activity-based protein profiling
- hypothesis: >-
    The inhibitory chagasin-cruzipain complex forms at a defined waypoint in the secretory
    and endocytic pathway rather than throughout it.
  description: >-
    Apply correlative light and electron microscopy, or immuno-EM with dual gold labelling,
    to epimastigotes and trypomastigotes expressing a tagged chagasin, quantifying
    chagasin-cruzipain co-labelling per compartment (Golgi cisternae, reservosome, flagellar
    pocket, cytoplasmic vesicles, cell surface) and combining this with compartment-resolved
    fractionation and SDS-resistant complex assays. This would turn the current list of
    co-localisation compartments into an ordered itinerary and establish which location
    should be named as the site of the core activity.
  experiment_type: correlative immuno-electron microscopy with subcellular fractionation
