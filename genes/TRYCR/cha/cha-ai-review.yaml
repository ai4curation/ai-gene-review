- term:
    id: GO:0010951
    label: negative regulation of endopeptidase activity
  evidence_type: IMP
  original_reference_id: PMID:15713748
  qualifier: involved_in
  review:
    summary: >-
      GOA carries no biological-process annotation for chagasin at all, yet the one
      process claim the literature does establish is squarely about this gene product,
      namely that chagasin sets the level of active cysteine peptidase inside the living
      parasite. T. cruzi lines transfected to overexpress chagasin show a fourfold rise in
      cysteine peptidase inhibitory activity, a drastic fall in soluble cruzipain activity
      (about 80% loss of active peptidase) and increased resistance to a synthetic
      peptidase inhibitor, and chagasin-cruzipain complexes are recovered directly from
      epimastigotes.
    action: NEW
    reason: >-
      Participation test, chagasin itself performs the inhibitory step. It binds the
      peptidase 1:1 through its three-loop wedge and occludes the catalytic centre, so it
      is the entity that does the work of the regulation, not merely something required
      for or consumed by it. Comparator check, GO:0010951 is used in exactly this way for
      protein protease inhibitors, by IDA, on TIMP1 (PMID:3903517), SERPINB1
      (PMID:30692621), SERPINB8 (PMID:8530382) and SERPINB13 (PMID:12504904), so this is
      the established convention for an inhibitor rather than a gap being invented. The
      term is also the most specific one available, because GO:2000117 negative regulation
      of cysteine-type endopeptidase activity is obsolete (verified in QuickGO), so no
      descendant is being skipped. The row is deliberately restricted to the parasite's own
      peptidases and makes no interspecies claim. No symbiont-mediated or host-directed
      process term is proposed, because inhibition of host cathepsins L and B has only ever
      been shown with purified enzymes and never inside an infected host cell. Also
      deliberately not proposed are metacyclogenesis or host-cell invasion process terms,
      since the authors state the modulation of those is indirect, mediated by the
      peptidase, and chagasin performs no step of either.
    additional_reference_ids:
    - PMID:18201565
    - PMID:11719560
    supported_by:
    - reference_id: PMID:15713748
      supporting_text: "These phenotypic changes were accompanied by a drastic reduction of soluble cruzipain activity and by upregulated secretion of cruzipain-chagasin molecular complexes."
    - reference_id: PMID:15713748
      supporting_text: "we obtained direct evidence that chagasin-cruzipain complexes are indeed formed in epimastigotes"
    - reference_id: PMID:18201565
      supporting_text: "T. cruzi lines that overexpress chagasin have an 80% decrease in active CPs, are less capable to differentiate and are less infective to mammalian cells in vitro"
- term:
    id: GO:0106123
    label: reservosome
  evidence_type: IDA
  original_reference_id: PMID:15713748
  qualifier: located_in
  review:
    summary: >-
      Ultrastructural immunolocalisation placed chagasin, together with cruzipain, in
      reservosomes, the lysosome-like endocytic storage organelles of epimastigote-stage
      T. cruzi. GOA has no row for this compartment, which is the one place where the
      inhibitor and its physiological target were shown to be co-resident.
    action: NEW
    reason: >-
      GO:0106123 was created specifically for this organelle, defined as present only in
      members of the Schizotrypanum subgenus of the Trypanosoma genus and as the site of
      storage of endocytosed macromolecules and lysosomal enzymes, so the term fits the
      paper's wording precisely and nothing more general has to be used. The claim is a
      direct ultrastructural observation on the gene product itself, hence IDA, and it is
      not a mechanism paper being read as a localization, since the localisation is its own
      reported result. It complements rather than replaces the GO:0031410 rows, which
      describe the separate free-chagasin vesicle pool. The cached source is abstract-only,
      but the abstract states the localisation result explicitly.
    supported_by:
    - reference_id: PMID:15713748
      supporting_text: "Ultrastructural studies showed that chagasin and cruzipain both localize to the Golgi complex and reservosomes (lysosome-like organelles), whereas free chagasin was found in small intracellular vesicles"
- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: IDA
  original_reference_id: PMID:15713748
  qualifier: located_in
  review:
    summary: >-
      The same ultrastructural study placed chagasin and cruzipain together in the Golgi
      complex, the point in the secretory pathway where the two trafficking routes first
      intersect. GOA carries no Golgi row for this gene.
    action: NEW
    reason: >-
      A direct ultrastructural localisation of the gene product, so IDA. Under the
      root-organelle policy the Golgi term is informative in its own right and is added
      at the root rather than pushed down to a sub-compartment. The EM identified the
      organelle but there is no second independent line (no cleavable targeting signal,
      no sub-organelle assay, no membrane topology, and chagasin has neither a
      transmembrane segment nor an annotated signal peptide) that would fix it to a
      cisternal membrane or lumen, so a GO:0000139 Golgi membrane row would overreach.
      This is kept as a location annotation only and is not advanced as the site of the
      core activity, since the complexes were recovered from whole epimastigotes rather
      than from a resolved compartment.
    additional_reference_ids:
