- id: PMID:11719560
  title: Identification, characterization and localization of chagasin, a tight-binding
    cysteine protease inhibitor in Trypanosoma cruzi.
  findings:
  - statement: Chagasin is a heat-stable, 12 kDa cruzipain-binding protein isolated from
      T. cruzi epimastigote lysates and characterised kinetically as a tight-binding,
      reversible inhibitor of papain-like cysteine proteases.
    supporting_text: "This protein was subsequently characterized as a tight-binding and reversible inhibitor of papain-like cysteine proteases."
  - statement: Immunogold electron microscopy localised chagasin to the flagellar pocket
      and cytoplasmic vesicles of trypomastigotes and to the cell surface of amastigotes.
    supporting_text: "Gold-labeled antibodies localized chagasin to the flagellar pocket and cytoplasmic vesicles of trypomastigotes and to the cell surface of amastigotes."
  - statement: Binding assays on living parasites with FITC-labelled probes independently
      placed both chagasin and cruzipain at the amastigote cell surface.
    supporting_text: "Binding assays performed by probing living parasites with fluorescein (FITC)-cruzipain or FITC-chagasin revealed the presence of both inhibitor and protease at the cell surface of amastigotes."
  - statement: Chagasin expression is developmentally regulated and inversely correlated
      with that of cruzipain.
    supporting_text: "Immunoblotting indicated that the expression of chagasin is developmentally regulated and inversely correlated with that of cruzipain."
  - statement: The authors propose that the intersection of the chagasin and cruzipain
      trafficking pathways is the regulatory checkpoint, which frames the localisation
      annotations as mechanism rather than incidental.
    supporting_text: "The intersection of chagasin and cruzipain trafficking pathways may represent a checkpoint for downstream regulation of proteolysis in trypanosomatid protozoa."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; this is the gene's discovery paper and the source of all four CACAO
      rows. The cache is abstract-only (full_text_available false) and the full text is
      paywalled at journals.biologists.com, so figure-level detail could not be inspected.
      The GONUTS wiki page for this PMID, which would record the student's own evidence,
      returns only an offline notice. This did not block the review because the abstract
      states each annotated claim and names the assay behind it. UniProt curates the
      function and all three subcellular locations from this paper with ECO:0000269.
- id: PMID:15713748
  title: Chagasin, the endogenous cysteine-protease inhibitor of Trypanosoma cruzi,
    modulates parasite differentiation and invasion of mammalian cells.
  findings:
  - statement: Ultrastructural immunolocalisation placed chagasin and cruzipain together
      in the Golgi complex and in reservosomes, with free chagasin in unidentified small
      intracellular vesicles.
    supporting_text: "Ultrastructural studies showed that chagasin and cruzipain both localize to the Golgi complex and reservosomes (lysosome-like organelles), whereas free chagasin was found in small intracellular vesicles"
  - statement: Inhibitory chagasin-cruzipain complexes were recovered directly from living
      epimastigotes using the differential detergent sensitivity of preformed complexes.
    supporting_text: "we obtained direct evidence that chagasin-cruzipain complexes are indeed formed in epimastigotes"
  - statement: Chagasin overexpression raised cysteine peptidase inhibitory activity
      fourfold, slowed metacyclogenesis and conferred resistance to a synthetic peptidase
      inhibitor.
    supporting_text: "Chagasin transfectants (fourfold increase in CP inhibitory activity) displayed low rates of differentiation (metacyclogenesis) and exhibited increased resistance to a synthetic CP inhibitor."
  - statement: The transfectant phenotypes were accompanied by a drastic loss of soluble
      cruzipain activity and increased secretion of cruzipain-chagasin complexes, which is
      the direct in vivo evidence that chagasin negatively regulates endogenous peptidase
      activity.
    supporting_text: "These phenotypic changes were accompanied by a drastic reduction of soluble cruzipain activity and by upregulated secretion of cruzipain-chagasin molecular complexes."
  - statement: Reduced infectivity of chagasin overexpressers was traced to lower
      membrane-associated peptidase activity and rescued by wild-type membranes in an
      E-64-sensitive manner, locating the effect on the parasite's own enzyme.
    supporting_text: "The deficiency of chagasin overexpressers is caused by lower activity of membrane-associated CPs, because membranes recovered from wild-type trypomastigotes restored infectivity and this effect was nullified by the CP inhibitor E-64."
  - statement: The authors state that the effects on differentiation and invasion are
      indirect, mediated through the endogenous peptidase, which is why no process term
      for metacyclogenesis or invasion is proposed in this review.
    supporting_text: "our studies suggest that chagasin regulates the endogenous activity of CP, thus indirectly modulating proteolytic functions that are essential for parasite differentiation and invasion of mammalian cells."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Cell Sci 118, 901-915). The key in vivo functional paper for this
      gene and the source of the three NEW rows proposed here. Cache is abstract-only, but
      the abstract reports each result with its assay. Its own wording that the effects on
      differentiation and invasion are indirect is what keeps those phenotypes out of the
      annotation set, so the paper is cited here as much for what it rules out as for what
      it supports.
- id: PMID:17502099
  title: The structure of chagasin in complex with a cysteine protease clarifies the
    binding mode and evolution of an inhibitor family.
  findings:
  - statement: The 2.2 A crystal structure of chagasin in complex with a cysteine protease
      (falcipain-2 of Plasmodium falciparum, UniProtKB:Q9NBD4) is the structural basis of
      the IntAct protein-binding row.
    supporting_text: "We report the 2.2 A crystal structure of the signature member of the I42 family, chagasin, in complex with a cysteine protease."
  - statement: Chagasin has an immunoglobulin-like fold with homology to human CD8alpha and
      is structurally unrelated to the cystatins, although the two converge on a similar
      mode of protease engagement.
    supporting_text: "Chagasin has a unique variant of the immunoglobulin fold with homology to human CD8alpha."
  - statement: Chagasin engages its target protease in a manner reminiscent of the
      cystatins, which is the informative function the bare protein-binding row should be
      replaced by.
    supporting_text: "Interactions of chagasin with a target protease are reminiscent of the cystatin family inhibitors."
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. The paper behind the GO:0005515 IntAct row. Cache is abstract-only.
      Important interpretive caveat confirmed against UniProt, the interacting partner
      Q9NBD4 is falcipain-2 of Plasmodium falciparum (UniProt entry Q9NBD4_PLAFA,
      submission name "Cysteine protease falcipain-2"), used as a crystallographic
      surrogate rather than as a physiological partner, so the row supports broad C1-family
      inhibitor activity and not any host- or co-infection-directed role.
- id: PMID:17561110
  title: Crystal structure of the parasite protease inhibitor chagasin in complex with a
    host target cysteine protease.
  findings:
  - statement: The chagasin-human cathepsin L complex was solved at 1.75 A, establishing
      that chagasin inhibits a host cysteine protease with 39 pM affinity.
    supporting_text: "We have crystallized and solved the structure of chagasin in complex with the host cysteine protease, cathepsin L, at 1.75 A resolution."
  - statement: Three loops (L2, L4, L6) form an inhibitory wedge whose contacts account for
      the high-affinity binding.
    supporting_text: "An inhibitory wedge composed of three loops (L2, L4, and L6) forms a number of contacts responsible for high-affinity binding (K(i), 39 pM) to the enzyme."
  - statement: The central loop L2 inserts directly into the catalytic centre, which is the
      mechanism underlying the cysteine-type endopeptidase inhibitor activity.
    supporting_text: "All three loops interact with the catalytic groove, with the central loop L2 inserted directly into the catalytic center."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cited for the inhibition mechanism underpinning GO:0004869 and, in
      the notes, as the strongest structural evidence for host cathepsin L inhibition. That
      evidence is in vitro with purified enzyme, which is precisely why it supports the
      molecular function but not any interspecies process term.
- id: PMID:18515357
  title: Displacement of the occluding loop by the parasite protein, chagasin, results in
    efficient inhibition of human cathepsin B.
  findings:
  - statement: Chagasin inhibits human cathepsin B with sub-nanomolar affinity by
      displacing the occluding loop that normally restricts access to its active site.
    supporting_text: "Kinetic analysis revealed that substitution of His-110e, which anchors the loop in occluding position, results in 3-fold increased chagasin affinity (Ki for H110A cathepsin B, 0.35 nm) due to an improved association rate"
  - statement: All three chagasin loops span the entire active-site cleft of cathepsin B,
      confirming the shared wedge mechanism across targets.
    supporting_text: "demonstrating that the occluding loop is displaced to allow chagasin binding with its three loops, L4, L2, and L6, spanning the entire active site cleft"
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Establishes the breadth of chagasin's C1-family inhibition, including
      a cathepsin whose occluding loop normally excludes protein inhibitors. In vitro with
      purified enzyme, so it contributes to the molecular function, not to a host-directed
      process claim.
- id: PMID:19143838
  title: Crystal structure of the parasite inhibitor chagasin in complex with papain allows
    identification of structural requirements for broad reactivity and specificity
    determinants for target proteases.
  findings:
  - statement: Chagasin inactivates papain with near-diffusion-limited kinetics to form a
      very tight, reversible complex, quantifying the tight-binding and reversible
      characterisation.
    supporting_text: "Kinetic studies revealed that inactivation of papain by chagasin is very fast (k(on) = 1.5 x 10(6) M(-1) x s(-1)), and results in the formation of a very tight, reversible complex (K(i) = 36 pM)"
  - statement: Papain is structurally close to the cruzipain catalytic domain, so this
      complex is a reliable model of the physiological chagasin-cruzipain interaction.
    supporting_text: "As papain exhibits high structural similarity to the catalytic domain of the T. cruzi enzyme cruzipain, the present chagasin-papain complex provides a reliable model of chagasin-cruzipain interactions."
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cited for the kinetic characterisation of the inhibitor activity and
      for the authors' own statement that the papain complex models the chagasin-cruzipain
      interaction, which links the in vitro structural work back to the physiological target.
- id: PMID:18201565
  title: The role of conserved residues of chagasin in the inhibition of cysteine
    peptidases.
  findings:
  - statement: Chagasin is a single 110-residue chain that inactivates papain-like enzymes
      by forming 1:1 tight-binding complexes, with no sequence similarity to other
      inhibitor groups.
    supporting_text: "It is a single 110-residue polypeptide chain with no sequence similarity to other known groups of CP inhibitors and potently inactivates papain-like enzymes through the formation of 1:1 tight–binding complexes."
  - statement: Genetic evidence shows that chagasin regulates endogenous cruzipain
      activity, in that overexpressing lines lose about 80% of active cysteine peptidase
      and are impaired in differentiation and infectivity.
    supporting_text: "T. cruzi lines that overexpress chagasin have an 80% decrease in active CPs, are less capable to differentiate and are less infective to mammalian cells in vitro"
  - statement: Mutational dissection separates the parasite and host targets, since W93A
      costs 100-fold affinity for human cathepsin L while T31 substitutions cost 10-100-fold
      for cruzipain, and the difference is traced to contacts with cathepsin L helix 8 that
      do not occur with cruzipain.
    supporting_text: "These differential effects reflect the occurrence of direct interactions between chagasin and helix 8 of cathepsin L, interactions that do not occur with cruzipain."
  - statement: Wild-type chagasin inhibits papain with a dissociation constant of about
      5 pM.
    supporting_text: "WT Ki = 5 ± 0.7 pM"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, and the only cited paper with full text cached (PMC2607524). Used for
      the quantitative inhibition constants, for the introduction's summary of the genetic
      evidence that chagasin regulates endogenous cruzipain, and for the mutational evidence
      that the cruzipain and cathepsin L interfaces are separable, which is the structural
      basis for treating parasite-directed and host-directed inhibition as distinct claims.
- id: PMID:26546840
  title: 'Natural cysteine protease inhibitors in protozoa: Fifteen years of the chagasin
    family.'
  findings:
  - statement: Chagasin is an approximately 11 kDa, highly thermostable, tight-binding
      inhibitor of papain, cysteine cathepsins and endogenous parasite cysteine proteases,
      and is the signature member of inhibitor family I42.
    supporting_text: "Chagasin was identified in the pathogenic protozoa Trypanosoma cruzi as an approximately 11 kDa protein that is a tight-binding and highly thermostable inhibitor of papain, cysteine cathepsins and endogenous parasite cysteine proteases."
  - statement: The inhibitory mechanism differs from that of the cystatins, in that loop 2
      enters the active-site cleft and contacts the catalytic residues while loops 4 and 6
      embrace the enzyme from the sides.
    supporting_text: "Differently from cystatins, the loop 2 of chagasin enters the active-site cleft, making direct contact with the catalytic residues, while loops 4 and 6 embrace the enzyme from the sides."
  - statement: Biological roles of chagasin-family inhibitors have been studied in few
      species, mostly by transgenesis, and the conclusions vary, which bounds how far any
      process annotation can be taken.
    supporting_text: "Studies on their biological roles were carried out in a few species, mainly using transgenic protozoa, and the conclusions vary."
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified review by the group that discovered chagasin, used for family-level
      context (the I42, I71 and I81 organisation, and the cystatin-contrasting mechanism)
      and for its explicit caution that functional conclusions across the family rest largely
      on transgenic work. Cited as synthesis, not as primary evidence for any annotation.
