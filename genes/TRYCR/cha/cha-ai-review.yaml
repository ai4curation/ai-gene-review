- term:
    id: GO:0004869
    label: cysteine-type endopeptidase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:11719560
  qualifier: enables
  review:
    summary: >-
      This is the defining activity of the protein and of its whole inhibitor family.
      The discovery paper isolated a heat-stable cruzipain-binding protein from
      epimastigote lysates and characterised it kinetically as a tight-binding,
      reversible inhibitor of papain-like cysteine proteases; later kinetics put the
      dissociation constants in the picomolar range against papain, cruzipain, human
      cathepsin L and human cathepsin B, and five crystal or NMR structures show the
      three-loop wedge blocking the catalytic cleft. Core function.
    action: ACCEPT
    reason: >-
      CACAO row (ASSIGNED BY CACAO, 2013-02-10). What the cited paper shows for this
      gene: enzyme-inhibition kinetics on the purified 12 kDa protein isolated from
      epimastigotes, reported in the abstract as characterisation as a "tight-binding
      and reversible inhibitor of papain-like cysteine proteases". The CACAO term matches
      that assay exactly: GO:0004869 is defined as binding to and reducing the activity
      of a cysteine-type endopeptidase, which is what was measured, and IDA fits a
      direct kinetic assay on the purified protein. The term is also correctly
      target-agnostic, which matters for this gene, because chagasin inhibits both the
      parasite's own cruzipain and host cathepsins L and B, and a molecular-function term
      should not be forced to choose. It is neither too downstream (no phenotype is being
      read as an activity here) nor the wrong granularity, since the only child of
      GO:0004869 is the apoptosis-context term GO:0010859, which does not apply. UniProt
      curates the same function from the same paper with ECO:0000269. The full text is not
      in the cache, but the abstract states the assayed claim outright, so no deference
      problem arises.
    additional_reference_ids:
    - PMID:18201565
    - PMID:19143838
    - PMID:17561110
    - file:genes/TRYCR/cha/cha-uniprot.txt
    supported_by:
