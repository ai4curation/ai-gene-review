core_functions:
- description: >-
    Tight-binding, reversible, 1:1 inhibition of papain-family (clan CA, family C1)
    cysteine peptidases, achieved by inserting a tripartite loop wedge (BC/L2, DE/L4,
    FG/L6) into the substrate-binding cleft so that the central BC loop contacts the
    catalytic cysteine and histidine. Within the parasite this activity is directed at
    cruzipain, the organism's own major lysosomal cysteine peptidase, and sets the level
    of active peptidase in the secretory and endocytic pathway and at the cell surface.
  molecular_function:
    id: GO:0004869
