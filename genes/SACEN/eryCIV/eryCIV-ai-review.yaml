id: A4F7N3
gene_symbol: eryCIV
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:405948
  label: Saccharopolyspora erythraea NRRL 2338
description: >-
  EryCIV is a pyridoxal-5'-phosphate (PLP)-dependent sugar aminotransferase of the
  DegT/DnrJ/EryC1 family that acts in TDP-D-desosamine biosynthesis for erythromycin in
  Saccharopolyspora erythraea; eryCIV mutants accumulate the desosamine-deficient
  intermediate 3-alpha-mycarosyl erythronolide B. EryCIV is about 60% identical to DesI of
  Streptomyces venezuelae, the structurally characterized PLP-dependent aminotransferase of
  the desosamine pathway that forms dTDP-4-amino-4,6-dideoxy-D-glucose, and it retains the
  catalytic PLP Schiff-base lysine that the related PLP-dependent sugar dehydratases (ColD,
  AscC) replace with histidine. It is therefore inferred to catalyse C-4 transamination of
  dTDP-4-dehydro-6-deoxy-D-glucose, although the reaction has not been assayed for EryCIV
  itself. Its database name, NDP-6-deoxyhexose 3,4-dehydratase, derives from early sequence
  similarity to the AscC 3,4-dehydratase.
