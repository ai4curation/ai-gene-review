core_functions:
- description: >-
    PLP-dependent DegT/DnrJ/EryC1-family sugar aminotransferase that, as the ortholog of DesI,
    is inferred to aminate C-4 of dTDP-4-dehydro-6-deoxy-D-glucose to give
    dTDP-4-amino-4,6-dideoxy-D-glucose in TDP-D-desosamine biosynthesis, supplying the
    aminodeoxysugar attached to erythromycin. The reaction is inferred from orthology and
    active-site conservation and has not been assayed for EryCIV itself.
