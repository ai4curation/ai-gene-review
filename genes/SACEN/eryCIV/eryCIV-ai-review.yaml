suggested_questions:
- question: >-
    Does EryCIV catalyse C-4 transamination of dTDP-4-dehydro-6-deoxy-D-glucose like its
    ortholog DesI, and which amino donor does it use? Sequence and active-site evidence
    (conserved catalytic lysine, about 60% identity to DesI) favour transamination over the
    3,4-dehydration implied by its database name, but no EryCIV assay exists.
    Tracked in projects/FUNCTION_KNOWLEDGE_GAPS.md.
suggested_experiments:
- description: >-
    Purify EryCIV, reconstitute with PLP and assay transamination of
    dTDP-4-dehydro-6-deoxy-D-glucose with L-glutamate (and other amino donors), detecting
    dTDP-4-amino-4,6-dideoxy-D-glucose by LC-MS, with a K200A mutant as a loss-of-function
    control; test cross-complementation of an S. venezuelae desI mutant.
