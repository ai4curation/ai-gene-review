    id: GO:0008483
    label: transaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      EryCIV is a PLP-dependent sugar aminotransferase, so transaminase activity is correct
      but too general; the specific activity inferred from its DesI ortholog is the C-4
      transamination of dTDP-4-dehydro-6-deoxy-D-glucose (GO:0019179, EC:2.6.1.33).
    action: MODIFY
    reason: >-
      Re-reviewed after a blinded OpenScientist control run (file:SACEN/eryCIV/eryCIV-hypotheses/function-hypothesis-go-0008483/openscientist.md). The earlier UNDECIDED rested
      on a conflict between the dehydratase name and the transaminase term. That conflict is
      resolved in favour of transamination: EryCIV retains the catalytic PLP Schiff-base lysine
      (K200) that the DegT/DnrJ/EryC1-family dehydratases replace with histidine, and it is
      about 61% identical to DesI (Q9ZGH0), the desosamine-pathway enzyme that Burgie and
      Holden (PMID:17630700) describe as a PLP-dependent
      aminotransferase crystallized with its product dTDP-4-amino-4,6-dideoxyglucose. The
      dehydratase name derives from the 1997 sequence similarity to AscC (PMID:9353926,
      abstract). Both the sequence identity and the active-site residue were reproduced
      locally. GO:0019179 (dTDP-4-amino-4,6-dideoxy-D-glucose:2-oxoglutarate transaminase
      activity; EC:2.6.1.33, RHEA:19085) is the existing child of GO:0008483 whose product
      matches DesI, so no new term is needed. Caveats: the amino donor (glutamate/2-oxoglutarate
      in the GO definition) and the sugar substrate have not been assayed for EryCIV itself,
      and the inference is orthology-based.
