id: A4F7N4
gene_symbol: eryBVI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:405948
  label: Saccharopolyspora erythraea NRRL 2338
description: >-
  EryBVI is a lyase (dehydratase) of the TDP-L-mycarose biosynthetic branch of erythromycin
  biosynthesis in Saccharopolyspora erythraea (UniProt/EMBL/MIBiG name: NDP-4-keto-6-deoxyglucose
  2,3-dehydratase). It catalyzes a 2,3-dehydration of the TDP-keto-deoxysugar intermediate during
  assembly of the L-mycarose donor.
references:
- id: file:SACEN/eryBVI/eryBVI-uniprot.txt
  title: UniProtKB A4F7N4 (eryBVI) record - NDP-4-keto-6-deoxyglucose 2,3-dehydratase
  findings:
  - statement: >-
      EryBVI is an NDP-4-keto-6-deoxyglucose 2,3-dehydratase (a lyase) of the mycarose pathway.
    record_section: [DE]
    supporting_text: >-
      NDP-4-keto-6-deoxy-glucose 2,3-dehydratase
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: TrEMBL entry; name indicates a 2,3-dehydratase (lyase) of the mycarose pathway.
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
existing_annotations:
- term:
    id: GO:0016829
    label: lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      General lyase activity; true for EryBVI's 2,3-dehydratase reaction, but the row's own family
      evidence supports the more specific hydro-lyase (dehydratase) class.
    action: MODIFY
    reason: >-
      Correct but general. The InterPro2GO evidence behind this row is the EvaA-like hexose
      2,3-dehydratase family (InterPro IPR005212 EvaA-like; Pfam PF03559 Hexose_dehydrat, two
      copies), which supports a dehydratase, i.e. GO:0016836 hydro-lyase activity (an is_a child of
      lyase activity). No GO term exists for the dTDP-4-keto-6-deoxyglucose 2,3-dehydratase
      reaction itself. Family membership only; no assay of EryBVI is cited.
    proposed_replacement_terms:
    - id: GO:0016836
      label: hydro-lyase activity
    supported_by:
    - reference_id: file:SACEN/eryBVI/eryBVI-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "InterPro; IPR005212; EvaA-like."
    - reference_id: file:SACEN/eryBVI/eryBVI-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: "Pfam; PF03559; Hexose_dehydrat; 2."
