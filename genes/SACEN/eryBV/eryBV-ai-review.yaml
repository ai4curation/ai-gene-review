- id: file:SACEN/eryBV/eryBV-notes.md
  title: eryBV review notes (erythromycin pathway concept)
- id: PMID:9563840
  title: Targeted gene inactivation for the elucidation of deoxysugar biosynthesis in the erythromycin producer Saccharopolyspora erythraea.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. Chromosomal deletions of ORF7 (eryBII), ORF13 (eryBIV) and ORF17
      (eryCIV) give the eryB/eryC accumulation phenotypes, placing these genes in mycarose or
      desosamine supply for erythromycin.
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
- id: GO_REF:0000117
  title: Gene Ontology annotation based on Ensembl/EnsemblGenomes orthology
existing_annotations:
- term:
    id: GO:0008194
    label: UDP-glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro-based (IEA) UDP-glycosyltransferase activity. EryBV uses TDP-L-mycarose, a
      dTDP-sugar, as its donor (PMID:9563840), not a UDP-sugar, so the UDP-specific term is
      incorrect - the same donor-specificity error seen for the paralog EryCIII.
    action: REMOVE
    reason: >-
      Wrong donor specificity (the donor is TDP-L-mycarose, a dTDP-sugar, not a UDP-sugar). The
      accurate term GO:0016758 (hexosyltransferase activity) is already present as a separate IEA
      annotation, so this incorrect UDP-specific term should simply be removed rather than modified
      into a duplicate. The donor identity rests on Salah-Bey et al. (PMID:9563840), who state
      that the two sugars transferred onto the erythromycin macrolactone are supplied as
      dTDP-D-desosamine and dTDP-L-mycarose; EryBV belongs to the EryCIII-like macrolide
      glycosyltransferase family (InterPro IPR010610), whose characterized member uses a
      dTDP-sugar. No assay of EryBV itself is cited.
    supported_by:
    - reference_id: PMID:9563840
      supporting_text: >-
        The production of erythromycin A by Saccharopolyspora erythraea requires the synthesis of dTDP-D-desosamine and dTDP-L-mycarose, which serve as substrates for the transfer of the two sugar residues onto the macrolactone ring.
    - reference_id: file:SACEN/eryBV/eryBV-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: "InterPro; IPR010610; EryCIII-like_C."
