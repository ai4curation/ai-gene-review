id: A4F7N2
gene_symbol: eryCV
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:405948
  label: Saccharopolyspora erythraea NRRL 2338
description: >-
  EryCV is an iron-sulfur, S-adenosyl-L-methionine-dependent (radical-SAM-type) enzyme of the
  TDP-D-desosamine biosynthetic pathway in Saccharopolyspora erythraea (UniProt/EMBL/MIBiG name:
  NDP-4,6-dideoxyhexose 3,4-enoyl reductase; the DesII-type member of the cluster's deoxysugar
  enzymes). It carries a [4Fe-4S] cluster and uses SAM, consistent with a radical-SAM mechanism;
  the precise catalytic outcome on the TDP-deoxysugar intermediate is not experimentally resolved
  in the records available.
references:
- id: file:SACEN/eryCV/eryCV-uniprot.txt
  title: UniProtKB A4F7N2 (eryCV) record - "NDP-4,6-dideoxyhexose 3,4-enoyl reductase"; Fe-S + SAM
  findings:
  - statement: >-
      EryCV binds iron-sulfur and uses SAM (radical-SAM-type), acting in deoxysugar biosynthesis.
    record_section: [DE]
    supporting_text: >-
      EryCV NDP-4,6-dideoxyhexose 3,4-enoyl reductase
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      TrEMBL entry; iron / iron-sulfur / metal-binding / SAM keywords are consistent with a
      radical-SAM enzyme. The exact reaction (named 3,4-enoyl reductase vs the GOA ammonia-lyase
      term) is not adjudicable from the available records.
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Root-level "catalytic activity" - uninformative; EryCV is a specific iron-sulfur/SAM enzyme.
    action: KEEP_AS_NON_CORE
    reason: >-
      Under the project rule GO:0003824 is KEEP_AS_NON_CORE where no reaction is known, not MARK_AS_OVER_ANNOTATED:
      the row is true and is as precise as the evidence allows. EryCV is Predicted (UniProt PE 4), its
      only name is an unreviewed submitter annotation, and the ammonia-lyase row in this review is UNDECIDED,
      so there is no specific reaction term to refine to.
- term:
    id: GO:0016841
    label: ammonia-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Ammonia-lyase activity from an InterPro signature. This conflicts with the enzyme's name
      (3,4-enoyl reductase) and its radical-SAM (Fe-S/SAM) cofactor profile; DesII-type radical-SAM
      enzymes can catalyze dehydration/deamination, but the precise reaction here is unverified.
    action: UNDECIDED
    reason: >-
      Conflicting electronic assignments (ammonia-lyase vs 3,4-enoyl reductase) with no accessible
      experimental characterization; the radical-SAM cofactor binding is, however, well supported.
- term:
    id: GO:0033068
    label: macrolide biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Involvement in macrolide deoxysugar biosynthesis, at the level the family signatures support:
      the entry matches three independent DesII-family signatures, and DesII-family radical SAM
      enzymes act on the TDP-deoxysugar intermediates of macrolide amino-sugar (desosamine)
      pathways. True and as precise as the evidence allows, but not a core function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept, and grounded on family membership rather than on the gene name, but non-core. The
      action follows the reason: this review asserts no core molecular function and no core
      process, so a pathway term with no established activity behind it cannot be the core
      function the ACCEPT it previously carried would claim. CLAUDE.md puts the disjunction
      directly -- where a term is already as precise as the evidence allows, keep it, ACCEPT if
      core and otherwise KEEP_AS_NON_CORE -- and GO:0003824 in this same review is kept non-core
      on exactly this argument, as are every retained row in PSEPK/PP_1969 and PSEPK/PP_2482, the
      members eryCV now matches. On the evidence: GO:0033068 is an InterPro2GO mapping
      (GO_REF:0000002) whose WITH/FROM names InterPro:IPR016863, so the first quote below is not
      merely consistent with the mapping, it is the signature the mapping fired on. Three further
      signatures agree, two of them naming the family (NCBIfam TIGR04426 rSAM_desII, SFLD
      SFLDG01116 DesII-like) and one naming the substrate itself (SFLD SFLDF00425
      dTDP-4-amino-4,6-dideoxy-D-glucose, the desosamine precursor). The repository policy treats
      family and domain classification as good support for membership, and membership as an
      argument for function, so these place the protein in macrolide deoxysugar biosynthesis
      independently of the unreviewed submitter gene name. Note what this does and does not
      support: the genus term GO:0033068 follows from the family, while the erythromycin-specific
      child GO:1901115 would need this particular cluster to be the erythromycin one, which rests
      only on that submitter name -- which is why GO:1901115 is neither asserted nor proposed. The
      reaction itself remains unestablished, so this row says where the protein acts, not what it
      does.
    supported_by:
    - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR016863; DesII.
    - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR04426; rSAM_desII; 1.
    - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
      record_section: ["DR:SFLD"]
      supporting_text: SFLD; SFLDG01116; DesII-like; 1.
    - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
      record_section: ["DR:SFLD"]
      supporting_text: SFLD; SFLDF00425; dTDP-4-amino-4_6-dideoxy-D-glu; 1.
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Iron-sulfur cluster binding, from the Pfam PF04055 and NCBIfam TIGR04426 radical SAM
      signature matches. Correct but general: the cluster the family defines is [4Fe-4S].
    action: MODIFY
    reason: >-
      Following the RADICAL_SAM project rule for the generic domain-derived rows (projects/RADICAL_SAM.md):
      correct but general. The entry has no COFACTOR block, but the radical SAM signatures it matches
      define the [4Fe-4S] cluster that reductively cleaves SAM, so GO:0051539, already carried by this
      entry, is the descendant the family always satisfies.
    supported_by:
    - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF04055; Radical_SAM; 1.
    - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR04426; rSAM_desII; 1.
    proposed_replacement_terms:
    - id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      [4Fe-4S] cluster binding - the hallmark cofactor of a radical SAM enzyme, inferred here from
      the Pfam PF04055 radical SAM signature match rather than measured.
    action: KEEP_AS_NON_CORE
    reason: >-
      The project rule ACCEPTs GO:0051539 for active members and keeps it non-core where catalysis is
      not established. Nothing is established for EryCV: the protein is Predicted (PE 4), no reaction
      has been assayed, and the cluster itself is inferred from family signatures rather than measured.
      Treated as the project treats the other uncharacterised members (PSEPK/PP_1969, PSEPK/PP_2482, TYW1B,
      aslB, ydeM), which assert no core molecular function.
    supported_by:
    - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF04055; Radical_SAM; 1.
core_functions:
- description: >-
    Radical SAM protein of the DesII-like subfamily, by the Pfam PF04055, InterPro IPR016863,
    NCBIfam TIGR04426 and SFLD DesII-like signature matches. No molecular function and no
    biological process is asserted as core. No reaction has been assayed for this protein and the
    [4Fe-4S] cluster itself is inferred from those signatures rather than measured, so there is no
    activity to name. The family does place it in macrolide deoxysugar biosynthesis, which is why
    the GO:0033068 row is kept on that basis, but kept as non-core: a pathway with no established
    activity behind it is not a core function. The erythromycin-specific child GO:1901115 would
    need this cluster to be the erythromycin one, which rests only on the unreviewed submitter
    gene name, so it is neither asserted nor proposed. The reasoning is in review.reason on the
    GO:0003824, GO:0033068 and GO:0051539 rows.
  supported_by:
  - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
    record_section: ["DR:Pfam"]
    supporting_text: Pfam; PF04055; Radical_SAM; 1.
  - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: InterPro; IPR016863; DesII.
  - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
    record_section: ["DR:NCBIfam"]
    supporting_text: NCBIfam; TIGR04426; rSAM_desII; 1.
  - reference_id: file:SACEN/eryCV/eryCV-uniprot.txt
    record_section: ["DR:SFLD"]
    supporting_text: SFLD; SFLDG01116; DesII-like; 1.
suggested_questions:
- question: >-
    EVIDENCE GAP: what radical-SAM reaction does EryCV catalyze? It binds a [4Fe-4S] cluster and
    SAM (radical-SAM/DesII-type), but its UniProt/EMBL name ("3,4-enoyl reductase") and the GOA
    term ("ammonia-lyase activity") are conflicting electronic (IEA) assignments, with no
    experimental annotation. Tracked in projects/FUNCTION_KNOWLEDGE_GAPS.md.
suggested_experiments:
- description: >-
    Reconstitute EryCV with its [4Fe-4S] cluster and SAM to determine the actual radical-SAM
    reaction on the TDP-deoxysugar intermediate (e.g. dehydration/deamination vs reduction),
    resolving the ammonia-lyase-vs-reductase annotation conflict.
