  - reference_id: PMID:9563840
    supporting_text: >-
      The ORF13 (eryBIV), ORF17 (eryCIV) and ORF7 (eryBII) mutants also synthesised small amounts of macrolide shunt metabolites
suggested_experiments:
- description: >-
    Reconstitute EryBII with the TDP-keto-deoxysugar substrate and NAD(P)H to confirm the
    2,3-reductase activity and replace the mis-mapped aryl-alcohol dehydrogenase annotation.
