  review:
    summary: >-
      DNA binding is correct but is the least informative statement available for
      this protein: its binding is structure-selective, detectable on 5' overhangs,
      flaps and pseudo-Y junctions and undetectable on blunt duplexes or free
      single strands.
    action: MODIFY
    reason: >-
      The UniRule/keyword mapping lands on the root DNA-binding term, while the
      primary literature establishes which DNA structures are bound. EMSA across a
      panel of defined substrates shows binding to 5'-overhanging, flap and pseudo-Y
      duplexes and no detectable binding to blunt-ended duplexes or single-stranded
      oligonucleotides (PMID:9380501), and the crystal structures resolve the
      flap/overhang substrate in pre-threading and fully threaded complexes
      (PMID:27273516). GO:0000403 Y-form DNA binding and GO:0070338 5'-flap-structured
      DNA binding are is_a descendants of GO:0003677 that state exactly this, so the
      row is refined rather than removed; the metal-free EMSA conditions of
      PMID:9380501 separate binding from catalysis.
    proposed_replacement_terms:
    - id: GO:0000403
      label: Y-form DNA binding
    - id: GO:0070338
      label: 5'-flap-structured DNA binding
    supported_by:
    - reference_id: PMID:9380501
      supporting_text: >-
        However, duplexes with 5'-overhangs, flaps and pseudo-Y structures showed decreased mobility with added T5 exonuclease.
    - reference_id: PMID:9380501
      supporting_text: >-
        Binding of T5 exonuclease to either blunt-ended duplexes or single-stranded oligonucleotides could not be detected by EMSA.
    - reference_id: file:BPT5/D15/D15-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: >-
        K->A: No exonuclease activity, retains full endonuclease activity on a flap structure. Binds DNA pseudo-Y substrates with a dissociation constant of 200 nM.
