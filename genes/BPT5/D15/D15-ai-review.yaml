core_functions:
- description: >-
    Structure-specific 5' flap endonuclease: cleaves branched DNA bearing a free
    single-stranded 5' end (5' flaps, 5' overhangs, pseudo-Y junctions) at the junction
    between single- and double-stranded DNA, after threading the single-stranded arm
    through the hole formed by its helical arch. One divalent metal ion in the
    high-affinity site suffices for this reaction. In the infected cell this activity acts
    on branched and interrupted intermediates of T5 genome replication and maturation.
  molecular_function:
    id: GO:0017108
    label: 5'-flap endonuclease activity
  directly_involved_in:
  - id: GO:0039693
    label: viral DNA genome replication
  substrates:
  - id: CHEBI:16991
    label: DNA
  supported_by:
  - reference_id: PMID:15077103
    supporting_text: >-
      Mutation of crucial aspartates in site II abolished exonuclease action, but caused enzymes to retain structure-specific (flap endonuclease) activity.
  - reference_id: PMID:27273516
    supporting_text: >-
      They reveal single-stranded DNA threading through a hole in the enzyme, which is enclosed by an inverted V-shaped helical arch straddling the active site.
  - reference_id: file:BPT5/D15/D15-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      The substrates require a free, single-stranded 5' end, with endonucleolytic hydrolysis occurring at the junction of double- and single-stranded DNA
- description: >-
    Processive 5'-3' DNA exonuclease (EC 3.1.11.3) that degrades duplex and
    single-stranded DNA from a free 5' terminus to nucleoside 5'-phosphates, requiring
    occupancy of both divalent metal sites and favoured at alkaline pH. Lys-83 is
    essential for this reaction and dispensable for flap endonucleolysis, so the two
    activities of the same active site are separable. The exonuclease is required for T5
    genome replication and for converting replicated concatemers into the
    single-stranded-interruption-containing DNA of mature virions.
  molecular_function:
    id: GO:0035312
    label: 5'-3' DNA exonuclease activity
  directly_involved_in:
  - id: GO:0039693
    label: viral DNA genome replication
  substrates:
  - id: CHEBI:16991
    label: DNA
  supported_by:
  - reference_id: PMID:9874768
    supporting_text: >-
      Biochemical analysis demonstrated that K83 is absolutely required for exonucleolytic activity on single-stranded DNA but is not required for endonucleolytic cleavage of flap structures.
  - reference_id: PMID:2211703
    supporting_text: >-
      The purified enzyme is active on both native and heat-denatured DNA and shows no endonuclease activity on either double-stranded closed-circular or nicked DNA.
  - reference_id: PMID:904023
    supporting_text: >-
      the subsequent formation of the single-stranded fragments does require that the D15 nuclease be functional
knowledge_gaps:
- gap_statement: >-
    Which DNA structures D15 actually encounters and cleaves during T5 infection is
    unknown. The substrate preferences are defined entirely on synthetic
    oligonucleotides, and the one in vivo step attributed to the enzyme, the conversion
    of replicated concatemers into the single-stranded fragments of mature virion DNA,
    has never been reconstituted or shown to be a direct cleavage by D15.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Determines whether the phage enzyme performs the lagging-strand flap trimming its
    family is named for, a concatemer-resolution or interruption-generating step peculiar
    to T5, or both; the GO process annotations on this protein currently rest on the
    assumption, not on T5 data.
  resolution: >-
    Isolate replication intermediates from wild-type and D15-amber infections and map
    their branch structures and 5' ends at nucleotide resolution, then test purified D15
    on the recovered intermediates.
- gap_statement: >-
    How loss of D15 activity abolishes late gene expression is unresolved. The 1973
    proposal is that the nuclease introduces gaps or nicks that make the T5 genome a
    competent template for late transcription, but no direct link between a D15-generated
    DNA structure and late promoter activity has been demonstrated, and the alternative,
    that the block is an indirect consequence of failed replication, has not been
    excluded.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Decides whether D15 has any regulatory role in transcription at all, which is exactly
    what the CACAO GO:0019086 row asserts and what this review flags as unsupported.
  resolution: >-
    Separate replication from transcription experimentally, for example by supplying
    nicked or gapped T5 templates in a D15-amber infection or in vitro, and measuring
    late transcript initiation directly rather than late protein accumulation.
- gap_statement: >-
    Whether D15 works as part of a defined phage/host transcription-replication assembly
    is unsettled: a single 1980 fractionation reported a putative complex containing host
    RNA polymerase, gpC2, gpD9, gpD5 and gpD15, and nothing since has established its
    composition, stoichiometry or whether the association is functional.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    The only cellular-component annotation on this protein depends on it, and a defined
    partner set would also say whether the enzyme's two activities are selected by
    partners rather than only by local metal concentration and pH.
  resolution: >-
    Repeat the isolation with modern affinity tagging of D15 in infected cells followed by
    quantitative proteomics and crosslinking mass spectrometry, and test reconstituted
    subcomplexes for coupled replication and late transcription.
