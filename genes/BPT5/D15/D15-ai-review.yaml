  review:
    summary: >-
      CACAO row. The cited paper shows that T5 amber mutants in gene D15 make early
      proteins normally but virtually no late proteins, and proposes that late
      transcription requires gaps or nicks introduced into T5 DNA. The term asserts that
      D15 participates in late viral transcription itself, which is one step further than
      the data or the authors' own model support.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      What the paper shows for this gene: SDS-PAGE of proteins induced in a
      nonpermissive host by a D15 amber mutant shows a virtual absence of late proteins
      while the early enzyme deoxyribonucleoside monophosphokinase is made at wild-type
      levels, and lysozyme and serum-blocking power are very low. That establishes that
      D15 activity is necessary for late gene expression. It does not establish
      participation: GO:0019086 is the transcription of the final group of viral genes,
      carried out by host RNA polymerase under the control of the phage gpC2 element,
      whereas the authors attribute the requirement to a DNA-processing step performed by
      the nuclease ("the introduction of gaps or nicks in the T5 DNA so that late
      transcription can occur"). This is the project's phenotype-read-as-process shape: a
      downstream genetic requirement annotated as the process, where the gene product
      performs none of its steps. Kept and flagged rather than removed, per the
      curator-deference rule: the row is experimental, the cached record is abstract-only
      (PMC427268 holds page scans and returns no text), and GONUTS was offline on
      2026-10-29, so the full text may contain transcription assays the abstract does not
      mention. The faithful representation is the nuclease activity plus a causal link
      upstream of late transcription in a GO-CAM, or at most a regulation term
      (GO:0046782 or GO:0050434) if a direct effect on transcription were demonstrated;
      a bare involved_in on the transcription term asserts the wrong participant.
    supported_by:
    - reference_id: PMID:4357874
      supporting_text: >-
        Amber mutants of bacteriophage T5 defective in gene D15, which codes for a 5'-exonuclease, do not express late genes.
    - reference_id: PMID:4357874
