suggested_questions:
- question: >-
    Should GO:0048256 flap endonuclease activity keep the clause "but not other DNA
    structures" in its definition? Every characterised FEN, including this one, also cleaves
    5' overhangs and pseudo-Y junctions and degrades DNA exonucleolytically, so the clause
    makes the term unusable for the proteins it was created for and pushes curators onto the
    5'-flap child or onto unrelated branches.
- question: >-
    How should a nuclease whose activity is a prerequisite for transcription, without
    performing any step of it, be represented? The CACAO GO:0019086 row on this gene asserts
    participation in late viral transcription from an amber-mutant protein profile, where the
    authors' model is template nicking. A GO-CAM causal edge from the nuclease activity to
    late transcription says this correctly, but there is no annotation-level way to state it
    short of a regulation term that the data do not support either.
- question: >-
    Is GO:1990238 double-stranded DNA endonuclease activity appropriate for structure-specific
    5'-nucleases? It sits under DNA endonuclease activity with no structural requirement, so
    it reads as general duplex cleavage; for FENs the nicking of duplex DNA happens only at a
    pre-existing single-stranded interruption. A cross-link or a definitional caveat would
    stop the term being used where GO:0017108 is meant.
- question: >-
    Should HAMAP-Rule MF_04140 propagate GO:0033567 DNA replication, Okazaki fragment
    processing to phage and bacterial FENs? UniProt's own free text hedges the Okazaki role
    for T5 D15 ("may be used for example to trim such branched molecules"), yet the rule
    asserts the process term outright, and no T5 experiment addresses lagging-strand flap
    trimming.
- question: >-
    Does D15 generate the single-strand interruptions that are a hallmark of mature T5 virion
    DNA, or does it act downstream of nicks made by something else? PMID:904023 shows the
    nuclease is needed for the fragments to appear but also that its in vitro endonuclease
    reaction requires interruptions to be there already, which leaves the origin of the first
    nick unexplained.
suggested_experiments:
- description: >-
    Map replication and maturation intermediates from wild-type and D15-amber T5 infections
    by denaturing and native strand-specific sequencing, locating 5' ends, flaps and
    single-strand interruptions at nucleotide resolution, then incubate purified D15 with the
    recovered intermediates and re-map.
  hypothesis: >-
    The intermediates that accumulate in a D15-amber infection carry 5' flaps and overhangs at
    defined positions that purified D15 cleaves, identifying the enzyme's physiological
    substrate and distinguishing lagging-strand flap trimming from concatemer processing.
- description: >-
    Separate the replication and transcription requirements by complementing a D15-amber
    infection with catalytically dead D153K or K83A protein, and by supplying pre-nicked or
    gapped T5 templates, measuring late transcript initiation by nascent RNA sequencing rather
    than late protein accumulation.
  hypothesis: >-
    Late transcription needs only the DNA structures D15 produces, so nicked templates restore
    late transcript initiation without restoring nuclease activity; if they do not, D15 has a
    role in late transcription beyond template processing.
- description: >-
    Affinity-purify tagged D15 from T5-infected E. coli at successive times after infection
    and analyse the eluate by quantitative proteomics and crosslinking mass spectrometry,
    testing for stoichiometric association with host RNA polymerase, gpD5, gpD9 and gpC2, and
    reconstitute any recovered subcomplex for coupled replication and transcription in vitro.
  hypothesis: >-
    The 1980 putative transcription/replication complex reflects a real, substoichiometric
    association of D15 with the replisome rather than a co-sedimenting aggregate, and partner
    binding, not only local metal concentration and pH, selects which of the enzyme's two
    activities operates.
- description: >-
    Measure the endo/exo activity ratio of purified D15 across the free Mg2+ concentration and
    pH range measured inside infected E. coli, and in parallel test the same substrates in a
    reconstituted T5 replication reaction, to establish whether the in vitro metal-dependent
    switch between the two reactions occurs under physiological conditions.
  hypothesis: >-
    At intracellular free magnesium and pH the enzyme operates predominantly in one mode, so
    the metal-dependent switch described in vitro is a property of the assay rather than a
    regulatory mechanism of the infection.
