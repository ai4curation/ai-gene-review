  original_reference_id: PMID:904023
  qualifier: enables
  review:
    summary: >-
      CACAO row. The cited paper re-examines purified D15 nuclease and reports that,
      besides acting as a 5'-3' exonuclease, it introduces endonucleolytic scissions into
      mature T5 DNA in a reaction requiring duplex DNA and pre-existing single-stranded
