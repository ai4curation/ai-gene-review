- term:
    id: GO:0017108
    label: 5'-flap endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:15077103
  qualifier: enables
  review:
    summary: >-
      Metal-site mutants (site II aspartates) lose exonuclease action but retain
      structure-specific flap endonuclease activity, which also establishes that one
      metal ion suffices for the endonucleolytic reaction.
    action: ACCEPT
    reason: >-
      Direct and decisive for this term. The site-II mutants are catalytically
      competent flap endonucleases, so the activity is not a contaminant or an artefact
      of the exonuclease, and isothermal titration calorimetry ties it to occupancy of
      the single high-affinity metal site.
    supported_by:
    - reference_id: PMID:15077103
      supporting_text: >-
        Mutation of crucial aspartates in site II abolished exonuclease action, but caused enzymes to retain structure-specific (flap endonuclease) activity.
    - reference_id: PMID:15077103
      supporting_text: >-
        Structure-specific endonuclease activity requires binding of a single metal ion in the high-affinity site, whereas exonuclease activity requires that both the high- and low-affinity sites be occupied by divalent cofactor.
