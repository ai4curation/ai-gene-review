id: P06229
gene_symbol: D15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2695836
  label: Escherichia phage T5
description: >-
  Gene D15 product of bacteriophage T5, the founding member of the FEN
  (5'-nuclease) family and the structural and mechanistic prototype for the
  5'-3' exonuclease domain of bacterial DNA polymerase I and for eukaryotic
  FEN1. It is a 291-residue, magnesium-dependent DNA nuclease expressed early in
  infection that carries two reactions in one active site: processive 5'-3'
  exonucleolytic degradation of duplex and single-stranded DNA to mononucleotides
  (EC 3.1.11.3), and structure-specific endonucleolytic cleavage at the junction
  between single- and double-stranded DNA in substrates possessing a free
  single-stranded 5' end, such as 5' flaps, 5' overhangs and pseudo-Y junctions.
  Substrate selection is structural rather than sequence-based: the enzyme does
  not bind blunt duplexes or free single strands, and the single-stranded 5' arm
  of a branched substrate threads through a hole formed by an inverted V-shaped
  helical arch over the active site, where a potassium-stabilised
  helix-three-turn-helix motif grips the duplex and two or three magnesium ions
  position the scissile phosphate. Which of the two reactions predominates
  depends on metal occupancy (one ion for endonucleolysis, two for exonucleolysis)
  and on pH. In the phage, the enzyme is required for replication of the T5
  genome and for the maturation of replicated concatemers into the
  single-stranded-interruption-containing DNA found in virions; loss of its
  activity also abolishes late gene expression, which is attributed to the
  template nicking it provides rather than to any transcriptional activity of
  its own. The protein is a widely used laboratory reagent (T5 exonuclease) and,
  with the Taq polymerase 5'-nuclease domain, is one of the best-characterised
  members of its family.
