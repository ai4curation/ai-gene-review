product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:69014
  label: Thermococcus kodakarensis KOD1
description: >-
  TK2141 of the hyperthermophilic archaeon Thermococcus kodakarensis encodes pantoate kinase (PoK), a
  GHMP-family kinase that phosphorylates (R)-pantoate to (R)-4-phosphopantoate in the archaeal route to
  CoA. In this route PoK acts before beta-alanine is added, and phosphopantothenate synthetase (PPS, TK1686)
  then condenses 4-phosphopantoate with beta-alanine to give 4'-phosphopantothenate, so free pantothenate
  is not an intermediate and no bacterial/eukaryotic-type pantothenate kinase is needed. PoK has a seven-fold
  higher Vmax toward pantoate than toward pantothenate, uses ATP, GTP, UTP and CTP with similar efficiency,
  is a dimer, shows substrate inhibition by pantoate and product inhibition by 4-phosphopantoate, and
  is not feedback-inhibited by CoA or acetyl-CoA.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006204
  review:
    summary: >-
      PoK uses ATP (or other NTPs) as phosphoryl donor; nucleotide binding is subsidiary to the kinase
      activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kinetics show Michaelis-Menten behaviour toward ATP and comparable use of GTP, UTP and CTP, so the
      protein binds ATP, but this is part of the pantoate kinase reaction rather than a separate role.
      The InterPro2GO GHMP N-terminal domain mapping agrees.
    supported_by:
    - reference_id: PMID:22865846
      supporting_text: >-
        PoK displayed broad nucleotide specificity and utilized ATP, GTP, UTP, and CTP with comparable
        k(cat)/K(m) values.
- term:
    id: GO:0015937
    label: coenzyme A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR001275018
  - UniPathway:UPA00241
  review:
    summary: PoK carries out the first archaea-specific step of CoA biosynthesis from pantoate.
    action: ACCEPT
    reason: >-
      T. kodakarensis extracts lack pantothenate kinase activity, and PoK plus PPS convert pantoate to
      4'-phosphopantothenate, the intermediate shared with the bacterial/eukaryotic CoA pathway.
    supported_by:
    - reference_id: PMID:22865846
      supporting_text: >-
        the hyperthermophilic archaeon Thermococcus kodakarensis utilizes two novel enzymes: pantoate
        kinase (PoK) and phosphopantothenate synthetase (PPS)
    - reference_id: PMID:19666462
      supporting_text: >-
        When we examined the cell-free extracts of the hyperthermophilic archaeon Thermococcus kodakaraensis,
        PanK activity could not be detected.
- term:
    id: GO:0016301
    label: kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR001275018
  review:
    summary: >-
      Generic kinase activity is correct but less specific than the demonstrated pantoate kinase activity,
      for which GO has no term.
    action: MODIFY
    reason: >-
      Recombinant TK2141 phosphorylates pantoate with a seven-fold higher Vmax than pantothenate, defining
      it as pantoate kinase (EC 2.7.1.169, Rhea RHEA:28246). No GO molecular-function term exists for
      this reaction (an OLS search for pantoate returns only pantoate--beta-alanine ligase, pantoate 4-dehydrogenase,
      2-dehydropantoate 2-reductase and pantothenase), so the specific replacement is proposed as a new
      term. GO:0016301 remains the closest existing term.
    proposed_replacement_terms:
    - id: NTR
      label: pantoate kinase activity
    supported_by:
    - reference_id: PMID:19666462
      supporting_text: >-
        V(max) values were 7-fold higher toward pantoate, indicating that TK2141 encoded a novel enzyme,
        pantoate kinase (PoK).
