proposed_new_terms:
- proposed_name: pantoate kinase activity
  proposed_definition: 'Catalysis of the reaction: (R)-pantoate + ATP = (R)-4-phosphopantoate + ADP +
    H+.'
  justification: >-
    Most archaea phosphorylate pantoate before condensation with beta-alanine, using the GHMP-family pantoate
    kinase (EC 2.7.1.169, RHEA:28246) instead of a pantothenate kinase. GO has no term for this reaction,
    so these enzymes can only be annotated to the uninformative GO:0016301 kinase activity.
  proposed_parent:
    id: GO:0016301
    label: kinase activity
  supported_by:
  - reference_id: PMID:19666462
    supporting_text: >-
      V(max) values were 7-fold higher toward pantoate, indicating that TK2141 encoded a novel enzyme,
      pantoate kinase (PoK).
suggested_questions:
- question: >-
    Is PoK product inhibition by 4-phosphopantoate the main control point of archaeal CoA biosynthesis,
    given that neither PoK nor PPS is feedback-inhibited by CoA?
suggested_experiments:
- description: >-
    Measure intracellular pantoate, 4-phosphopantoate and CoA in T. kodakarensis strains overexpressing
    wild-type or product-insensitive PoK.
  experiment_type: genetic manipulation with metabolomics
