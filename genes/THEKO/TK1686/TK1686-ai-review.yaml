product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:69014
  label: Thermococcus kodakarensis KOD1
description: >-
  TK1686 of Thermococcus kodakarensis encodes phosphopantothenate synthetase (PPS, 4-phosphopantoate--beta-alanine
  ligase), which condenses (R)-4-phosphopantoate with beta-alanine in an ATP-dependent reaction to form
  (R)-4'-phosphopantothenate, the second step of the archaeal route from pantoate to CoA. PPS cannot use
  unphosphorylated pantoate and so has no pantothenate synthetase activity; it is strictly specific for
  ATP and beta-alanine, is an asymmetric homodimer that likely acts through a phosphopantoyl-adenylate
  intermediate, and is not inhibited by CoA, acetyl-CoA or its product. PPS is unrelated in sequence to
  bacterial and eukaryotic PanC.
