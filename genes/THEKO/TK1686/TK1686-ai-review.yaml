      supporting_text: >-
        two novel enzymes specific to the archaea, pantoate kinase and phosphopantothenate synthetase,
        are responsible for this conversion
- term:
    id: GO:0016881
    label: acid-amino acid ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR001275019
  review:
    summary: >-
      Generic acid-amino acid ligase activity is correct but less specific than the demonstrated 4-phosphopantoate--beta-alanine
      ligase activity, for which GO has no term.
    action: MODIFY
    reason: >-
      Recombinant TK1686 condenses 4-phosphopantoate with beta-alanine (EC 6.3.2.36, RHEA:27930) and does
      not act on pantoate. GO has no term for this reaction (pantoate-beta-alanine ligase activity, GO:0004592,
      uses unphosphorylated pantoate and is the PanC reaction PPS lacks), so the specific replacement
      is proposed as a new term; GO:0016881 remains the closest existing term.
    proposed_replacement_terms:
    - id: NTR
      label: 4-phosphopantoate--beta-alanine ligase activity
    supported_by:
    - reference_id: PMID:22940806
      supporting_text: which catalyzes the ATP-dependent condensation of 4-phosphopantoate and β-alanine
    - reference_id: file:THEKO/TK1686/TK1686-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Cannot use (R)- pantoate as substrate and thus does not display pantothenate synthetase (PS) activity
