core_functions:
- description: >-
    ATP-dependent 4-phosphopantoate--beta-alanine ligase that condenses (R)-4-phosphopantoate with beta-alanine
    to form (R)-4'-phosphopantothenate in the archaeal route of CoA biosynthesis.
  proposed_molecular_function: 4-phosphopantoate--beta-alanine ligase activity
  directly_involved_in:
  - id: GO:0015937
    label: coenzyme A biosynthetic process
  supported_by:
  - reference_id: PMID:19666462
    supporting_text: >-
      The protein product catalyzed the ATP-dependent conversion of phosphopantoate and beta-alanine to
      produce 4'-phosphopantothenate and did not exhibit PS activity
  - reference_id: PMID:22940806
    supporting_text: >-
      Among several amine substrates, activity was detected with β-alanine, but not with γ-aminobutyrate,
      glycine nor aspartate.
proposed_new_terms:
- proposed_name: 4-phosphopantoate--beta-alanine ligase activity
  proposed_definition: >-
    Catalysis of the reaction: (R)-4-phosphopantoate + beta-alanine + ATP = (R)-4'-phosphopantothenate
    + AMP + diphosphate + H+.
  justification: >-
    The archaeal phosphopantothenate synthetase (EC 6.3.2.36, RHEA:27930) condenses 4-phosphopantoate
    rather than pantoate with beta-alanine and is unrelated to PanC. GO has only the PanC reaction (GO:0004592),
    so these enzymes can only be annotated to the broad GO:0016881 acid-amino acid ligase activity.
  proposed_parent:
    id: GO:0016881
    label: acid-amino acid ligase activity
  supported_by:
  - reference_id: PMID:19666462
    supporting_text: >-
      The protein product catalyzed the ATP-dependent conversion of phosphopantoate and beta-alanine to
      produce 4'-phosphopantothenate and did not exhibit PS activity
suggested_questions:
- question: >-
    Does substrate inhibition of PPS by 4-phosphopantoate and ATP contribute to flux control in vivo,
    given the absence of CoA feedback?
suggested_experiments:
- description: >-
    Trap the proposed phosphopantoyl-adenylate intermediate in PPS crystals or by rapid-quench mass spectrometry
    to confirm the two-step mechanism.
  experiment_type: structural enzymology
