    summary: PPS carries out the second archaea-specific step of CoA biosynthesis from pantoate.
    action: ACCEPT
    reason: >-
      PPS converts the PoK product 4-phosphopantoate and beta-alanine to 4'-phosphopantothenate, the intermediate
      shared with the bacterial/eukaryotic CoA pathway; the UniRule assignment agrees with the biochemistry.
