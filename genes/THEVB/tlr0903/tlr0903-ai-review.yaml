  review:
    summary: Retain the general envelope localization supported by membrane-adaptor architecture.
    action: ACCEPT
    reason: The target has an N-terminal hydrophobic membrane anchor and an extended adaptor-like architecture;
      IPR050465/PTHR32347 support membrane-associated transport-protein membership independently of the
      ARBA location label. The RKN homolog was modeled as an HlyD/EmrA-like adaptor, consistent with an
      envelope location, but that study does not directly localize the BP-1 protein. Cell envelope is
      retained at the resolution justified by the evidence; no specific transported substrate or transport
      activity is inferred from the localization.
