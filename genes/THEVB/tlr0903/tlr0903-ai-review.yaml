  label: Thermosynechococcus vestitus BP-1
description: Tlr0903 is a predicted membrane-associated transport adaptor in Thermosynechococcus vestitus
  strain BP-1, formerly called Thermosynechococcus elongatus. Its N-terminal membrane anchor and extended
  coiled-coil architecture are consistent with an envelope adaptor. The homolog called XcsB in Thermostichus
  vulcanus RKN is genetically implicated in extracellular cellulose accumulation and has been proposed
  to connect cellulose synthase to TolC. This cellulose-export role has not been demonstrated for the
  BP-1 protein.
