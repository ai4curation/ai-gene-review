knowledge_gaps:
- gap_statement: What molecular role does the BP-1 Tlr0903 adaptor execute, and does it physically participate
    in cellulose export?
  boundary: The exact BP-1 protein is a homologous comparator, not the RKN XcsB perturbed in PMID29688612.
    HlyD-like architecture and native genetic necessity in RKN do not identify a substrate-specific export
    function or prove the proposed tripartite complex.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Prevents presenting a reference homolog as a verified alternative cellulose exporter.
  resolution: Test the exact BP-1 protein and independently sequence RKN XcsB; establish physical partners
    and polymer translocation in a reconstituted system.
