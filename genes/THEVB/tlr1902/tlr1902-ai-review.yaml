references:
- id: file:THEVB/tlr1902/tlr1902-hypotheses/kgap-tlr1902-glycan-specificity/openscientist.md
  title: OpenScientist analysis of Tlr1902 GH10 catalytic architecture and substrate specificity
  findings:
  - statement: >-
      Tlr1902 is a retaining GH10 enzyme with a complete, undecayed active site, but cleft geometry
      cannot assign its substrate class because the discriminating step is induced fit; the strain
      also lacks almost all of a xylan-utilisation pathway, so plant xylan is an unlikely substrate.
    supporting_text: >-
      The apparent exclusion of the glucose C6 hydroxymethyl is induced fit, not a fixed steric
      filter.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The PROSITE GH10 domain boundaries, both catalytic glutamates at the annotated active-site
      positions and all thirteen minus-one subsite residues were confirmed in the local Q8DHP3
      record. The carboxylate distance measurements, the nine-enzyme superposition and its failed
      negative control, the genome pathway census, the transcriptome check and the claimed
      27-residue N-terminal truncation were not independently checked; the truncation cannot be
      checked from the local record at all and is recorded as a suspected gene model issue.
