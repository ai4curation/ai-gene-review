  review:
    summary: Substrate-specific xylanase and xylan-catabolism claims remain unresolved.
    action: UNDECIDED
    reason: 'The proximate UniRule UR000414746 (PRU01096) was inspected: a GH10 profile match and conserved
      catalytic-feature group trigger EC:3.2.1.8 and xylan-catabolism annotations. These support the enzymatic
      family but do not provide a target-specific substrate assay. The RKN homolog is called a putative
      endoglucanase in PMID29688612, yet its chemistry is explicitly speculative and only genetic/phenotypic
      evidence is reported. That alternative hypothesis is insufficient to REMOVE a potentially correct
      xylanase prediction or to replace it with cellulase activity. Direct BP-1/RKN substrate comparison
      is required.'
