knowledge_gaps:
- gap_statement: Does BP-1 Tlr1902 hydrolyze xylan, cellulose, another glucan, or multiple substrates,
    and what is its native role?
  boundary: GH10 membership supports glycoside hydrolysis. Xylan specificity is a rule-based prediction;
    the RKN XcsC cellulose-associated role comes from genetics and remains mechanistically speculative.
    Neither can be silently promoted to direct target enzymology.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Resolves competing annotations and prevents unsupported transfer of an accessory cellulose-processing
    reaction.
  resolution: Assay purified exact-strain proteins on defined xylan/cellulose substrates with product
    analysis, catalytic controls and native pathway experiments.
  provenance:
  - reference_id: PMID:29688612
  - reference_id: file:THEVB/tlr1902/tlr1902-uniprot.txt
suggested_questions:
- question: Does BP-1 Tlr1902 hydrolyze xylan, cellulose, another glucan, or multiple substrates, and
