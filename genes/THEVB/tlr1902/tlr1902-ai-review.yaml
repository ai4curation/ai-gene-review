taxon:
  id: NCBITaxon:197221
  label: Thermosynechococcus vestitus BP-1
description: Tlr1902 is a predicted family-10 glycoside hydrolase in Thermosynechococcus vestitus strain
  BP-1, formerly Thermosynechococcus elongatus. Its GH10 domain supports carbohydrate hydrolysis, but
  its physiological polysaccharide substrate is unresolved. Sequence rules assign xylanase activity; the
  homolog termed XcsC in Thermostichus vulcanus RKN is genetically required for efficient cellulose accumulation
  and has been proposed to act as an accessory endoglucanase. That proposal does not establish cellulose
  hydrolysis, xylan turnover or cellulose-pathway participation by the BP-1 protein.
