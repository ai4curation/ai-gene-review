gene_model_issues:
- issue_type: WRONG_START_SITE
  status: SUSPECTED
  description: >-
    An OpenScientist run reports that UniProt Q8DHP3 is truncated by 27 residues at the N
    terminus and that the missing extension carries a canonical lipoprotein signal peptide with
    a lipobox. If so, the entry's sequence omits the targeting information that places the
    protein outside the cytoplasm, and any localisation inference drawn from the deposited
    sequence, including the AlphaFold model built on it, lacks the anchor entirely. This bears
    directly on whether the enzyme can reach an extracytoplasmic glycan. Recorded as SUSPECTED
    because it could not be checked from the local record, which contains only the truncated
    sequence; confirming it needs the genomic sequence upstream of the annotated start.
  evidence_types:
  - GENOMIC_SEQUENCE
  supported_by:
  - reference_id: file:THEVB/tlr1902/tlr1902-hypotheses/kgap-tlr1902-glycan-specificity/openscientist.md
    supporting_text: >-
      UniProt Q8DHP3 is truncated by 27 residues at the N terminus, and the missing extension is
      a lipoprotein signal peptide with a canonical lipobox
knowledge_gaps:
- gap_statement: Does BP-1 Tlr1902 hydrolyze xylan, cellulose, another glucan, or multiple substrates,
    and what is its native role?
  boundary: >-
    GH10 membership supports glycoside hydrolysis. Xylan specificity is a rule-based prediction;
    the RKN XcsC cellulose-associated role comes from genetics and remains mechanistically
    speculative. Neither can be silently promoted to direct target enzymology. An OpenScientist
    run (kgap-tlr1902-glycan-specificity) confirms the catalytic chemistry, refutes the idea that
    cleft geometry can assign the substrate, and leaves the substrate itself unknown, so this gap
    stays OPEN. Confirmed and checked against the local Q8DHP3 record: the PROSITE GH10 domain at
    60-329, both catalytic glutamates at the annotated active-site positions 166 and 264 in their
    canonical motif contexts, and all thirteen residues of the canonical GH10 minus-one subsite.
    The run adds a rotation-invariant geometric check, the carboxylate separation of 6.96 and 5.37
    Angstrom falling inside the range set by two crystallised retaining GH10 enzymes, so the enzyme
    is a retaining glycosidase with an undecayed active site. The refutation is the useful part.
    The run built the requested comparison across nine structurally characterised GH10 enzymes and
    the assay failed its own negative control: Cellulomonas fimi Cex, a GH10 that hydrolyses
    glucose-configured substrates, is statistically indistinguishable from six strict xylanases.
    The mechanistic reason is visible in the data, since one enzyme, Streptomyces lividans Xyn10A,
    shows 3.70 Angstrom clearance when glucosyl-bound against 2.43-2.50 when xylose-configured,
    with a different tryptophan contacting the sugar, so the apparent exclusion of the glucose
    hydroxymethyl is induced fit rather than a fixed steric filter. The run also notes its own
    assay is underpowered independently of that, the superposition error exceeding the entire
    between-enzyme spread it would need to resolve. What survives is a genomic and physiological
    argument that the substrate is unlikely to be plant xylan: the strain encodes one of the seven
    steps needed to use xylan as a carbon source, has no xylose catabolism or transport, the gene
    is not clustered with carbohydrate-utilisation genes, and it is not induced in the one usable
    public transcriptome. Two further points matter for reading this entry. No cyanobacterial GH10
    has ever been assayed, with zero of 136 cyanobacterial family members in Swiss-Prot, so every
    activity statement here is inference from distant bacterial and fungal homologues. And the run
    withdraws its own earlier objection that the protein is cytoplasmic, reporting instead that the
    UniProt sequence is truncated at the N terminus and that the missing extension is a lipoprotein
    signal peptide, which would make the protein lipid-anchored and extracytoplasmic and able to
    reach an external or envelope-associated glycan; that claim is recorded under gene_model_issues
    and was not verifiable from the local record, which contains only the truncated sequence.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Resolves competing annotations and prevents unsupported transfer of an accessory cellulose-processing
    reaction.
  resolution: Assay purified exact-strain proteins on defined xylan/cellulose substrates with product
    analysis, catalytic controls and native pathway experiments.
  provenance:
  - reference_id: PMID:29688612
  - reference_id: file:THEVB/tlr1902/tlr1902-uniprot.txt
  - reference_id: file:THEVB/tlr1902/tlr1902-hypotheses/kgap-tlr1902-glycan-specificity/openscientist.md
    supporting_text: >-
      No static comparison of a GH10 cleft can assign the substrate class.
suggested_questions:
- question: Does BP-1 Tlr1902 hydrolyze xylan, cellulose, another glucan, or multiple substrates, and
    what is its native role?
