  review:
    summary: Native BP-1 zinc-binding capacity is not settled by the zinc-free crystal or a domain-swap
      chimera.
    action: UNDECIDED
    reason: The Q8DLI5 record states no zinc requirement, and PMID:25686371 notes no bound zinc in native
      Te-GluRS structure 2CFO. However, its E. coli GluRS chimera carrying the Te putative zinc-binding
      domain binds about one zinc per molecule, with faster release; the authors discuss possible loss
      during crystallization. These are different constructs. Neither absence of a cofactor requirement
      nor a zinc-free crystal disproves binding, while the chimera does not directly establish native
      full-length BP-1 occupancy. Retain uncertainty rather than a false negative or an unconditional
      core zinc claim.
    supported_by:
