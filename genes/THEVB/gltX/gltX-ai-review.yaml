- id: PMID:16876193
  title: Crystal structure of a non-discriminating glutamyl-tRNA synthetase.
  findings:
  - statement: The historically named T. elongatus BP-1 enzyme directly glutamylates both tRNA substrates.
    supporting_text: We confirm experimentally that GluRS(Tel) is non-discriminating and present kinetic
      parameters for synthesis of Glu-tRNA(Glu) and of Glu-tRNA(Gln).
  - statement: The structure is a 2.45-A glutamate-bound non-discriminating GluRS, not the Thermus discriminating
      comparator.
    supporting_text: non-discriminating GluRS from Thermosynechococcus elongatus (ND-GluRS(Tel)) in complex
      with glutamate at a resolution of 2.45 A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact BP-1 target, linked by Q8DLI5/PDB2CFO. The cached abstract directly reports both
      kinetic assays. Full publisher access was unavailable; detailed mutant mechanisms are not claimed
      from the abstract.
- id: PMID:25686371
  title: Dispensability of zinc and the putative zinc-binding domain in bacterial glutamyl-tRNA synthetase.
  findings:
  - statement: Native Te-GluRS lacks resolved zinc in its crystal structure.
    supporting_text: The crystal structure of Te-GluRS does not contain zinc despite having a modified
      ZB-motif
  - statement: The Te-domain E. coli chimera binds zinc with different release kinetics; this is not a
      native BP-1 protein occupancy assay.
    supporting_text: Although it contains one equivalent of zinc, the kinetics of zinc-release by Ec(Te)-GluRS
      was different from others
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Distinguish the native Te structure from E. coli pZBD chimeras. The
      weak-binding/crystallization explanation is the authors' interpretation, not direct native solution
      quantitation. The study does not establish that all bacterial GluRS proteins lack zinc binding.
