taxon:
  id: NCBITaxon:197221
  label: Thermosynechococcus vestitus BP-1
description: GltX is the non-discriminating class I glutamyl-tRNA synthetase of the cyanobacterium Thermosynechococcus
  vestitus BP-1, historically named Thermosynechococcus elongatus BP-1. It uses ATP to glutamylate both
  tRNA(Glu) and tRNA(Gln), with higher catalytic efficiency for tRNA(Glu). Glu-tRNA(Gln) supplies the
  intermediate for subsequent GatCAB-dependent glutamine formation on tRNA. Zinc is absent from its reported
  crystal structure, but whether the native enzyme binds zinc weakly in solution remains unresolved.
