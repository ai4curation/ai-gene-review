  supported_by: *id001
- description: Non-discriminating glutamylation of tRNA(Gln), directly measured in PMID:16876193. This
    supplies Glu-tRNA(Gln) for subsequent GatCAB amidation; GltX does not itself perform the glutamate-to-glutamine
    conversion.
  molecular_function: *id005
  directly_involved_in:
