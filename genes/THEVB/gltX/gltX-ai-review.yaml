  supported_by: *id001
suggested_questions:
- question: Does purified native BP-1 GluRS bind zinc under nonchelating solution conditions, and does
    that binding affect activity despite the absence of a zinc requirement?
- question: Does altering Gly366 causally switch tRNA(Gln) discrimination in the BP-1 enzyme, beyond the
    structural comparison reported in PMID:16876193?
suggested_experiments:
- hypothesis: The native BP-1 enzyme can bind zinc weakly without requiring it for catalysis.
  description: Measure zinc occupancy and release of the full-length native protein under defined chelator-free
    conditions, alongside charging kinetics and the published E. coli Te-domain chimera.
