    Periplasmic dimanganese thiosulfohydrolase of the Sox system. It hydrolyses the
    terminal sulfone group from the SoxY carrier cysteine, releasing sulfate
    (EC 3.1.6.20). Inferred by homology for this T. thioparus fragment.
  molecular_function:
