proposed_new_terms:
- proposed_name: S-sulfosulfanyl-L-cysteine sulfohydrolase activity
  proposed_definition: >-
    Catalysis of the reactions: S-sulfosulfanyl-L-cysteinyl-[SoxY protein] + H2O =
    S-sulfanyl-L-cysteinyl-[SoxY protein] + sulfate + H+, and
    S-(2-sulfodisulfanyl)-L-cysteinyl-[SoxY protein] + H2O =
    S-disulfanyl-L-cysteinyl-[SoxY protein] + sulfate + H+.
  justification: >-
    This is the SoxB reaction of the bacterial Sox thiosulfate-oxidation pathway
    (ENZYME EC 3.1.6.20). GO has no corresponding molecular function term. The only
    child of GO:0016828 is trithionate hydrolase activity. As a result, SoxB proteins,
    including the structurally characterised T. thermophilus SoxB, carry only generic
    InterPro2GO hydrolase rows plus a mis-propagated nucleotide catabolic process.
  proposed_parent:
    id: GO:0016828
    label: hydrolase activity, acting on sulfur-sulfur bonds
suggested_questions:
- question: >-
    Which GO process term should Sox-system components (SoxAX, SoxYZ, SoxB, SoxCD)
    carry? GO:0019416 thiosulfate oxidation is defined as conversion to tetrathionate
    (the Tsd/TQO reaction), not the Sox route to sulfate. No gene product is annotated
    to GO:0019414 aerobic respiration, using sulfur or sulfate as electron donor.
- question: >-
    In soxCD-lacking T. thioparus, how is the SoxY-bound sulfane sulfur released or
    oxidised so that SoxB can act on further thiosulfate?
suggested_experiments:
- description: >-
    Obtain the full-length T. thioparus soxB sequence (for example from the DSM 505T
    genome). Confirm the Tat signal peptide and the three N-terminal Mn ligands not
    covered by the U5TVQ7 fragment. Then assay recombinant SoxB for sulfate release
    from SoxYZ-bound S-thiosulfonate, using the direct assay of Sauvé et al. (2009).
