id: U5TVQ7
gene_symbol: soxB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:931
  label: Thiobacillus thioparus
description: >-
  SoxB of the chemolithoautotrophic betaproteobacterium Thiobacillus thioparus,
  represented here by a 325-residue internal fragment translated from a soxB PCR
  amplicon (strain NZ). SoxB is the periplasmic thiosulfohydrolase of the Sox
  thiosulfate-oxidizing enzyme system. It is a dimanganese enzyme of the
  5'-nucleotidase/metallophosphatase fold. It hydrolyses the terminal sulfone
  (sulfonate) group from the SoxY carrier-protein cysteine (S-sulfosulfanyl- or
  S-sulfodisulfanyl-cysteinyl-SoxY), releasing sulfate and regenerating the
  sulfane-bound or free carrier for the next round of thiosulfate oxidation
  (EC 3.1.6.20). The fragment covers about residues 150-470 of full-length SoxB.
  It is 50% identical to Paracoccus pantotrophus SoxB and keeps the four histidine
  Mn ligands that fall within it. Its function is inferred by homology: no
  biochemistry has been reported for the T. thioparus protein. T. thioparus carries
  soxXYZAB but lacks soxCD.
existing_annotations:
- term:
    id: GO:0009166
    label: nucleotide catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006179
  - InterPro:IPR036907
  review:
    summary: >-
      InterPro2GO assigns nucleotide catabolism from the 5'-nucleotidase/apyrase family
      signature (IPR006179) and the 5'-nucleotidase C-terminal domain superfamily
      (IPR036907). Both signatures also match SoxB, which is a homolog of 5'-nucleotidase
      but acts on a protein-bound sulfur substrate, not on nucleotides.
    action: REMOVE
    reason: >-
      SoxB shares the 5'-nucleotidase fold. P. pantotrophus SoxB is only ~21% identical to
      E. coli 5'-nucleotidase (PMID:10940005). Its characterised activity is the release of
      sulfate from the SoxY carrier cysteine, and crystal structures show it bound to the
      substrate analogue thiosulfate and to the product sulfate (PMID:19535341). No
      nucleotide hydrolysis has been reported for any SoxB. A nucleotide catabolic role is
      inconsistent with its place in periplasmic Sox thiosulfate oxidation. The annotation
      is a family-level InterPro2GO over-propagation onto the SoxB subfamily
      (PTHR11575:SF42 "SULFUR OXIDATION PROTEIN SOXB").
    supported_by:
    - reference_id: PMID:10940005
      supporting_text: The soxB gene product predicts a protein of a molecular mass of
        61,897 Da which is 20.7% identical to 5′-nucleotidase of Escherichia coli
    - reference_id: PMID:19535341
      supporting_text: SoxB contains a di-manganese(II) site and is proposed to catalyze
        the release of sulfate from a protein-bound cysteine S-thiosulfonate.
    - reference_id: PMID:28127420
      supporting_text: Finally soxB encodes a hydrolase that removes the terminal sulfone
        group as sulfate.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR006179
      slot: interpro2go
      requested_change: CHECK
      asserted_value: GO:0009166
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        InterPro's interpro2go maps IPR006179 (5'-nucleotidase/apyrase) to GO:0009166
        nucleotide catabolic process, and GOA applies it (GO_REF:0000002) to every
        member. The signature also covers the Sox-system thiosulfohydrolase SoxB
        (PANTHER PTHR11575:SF42), which hydrolyses sulfate from the SoxY carrier cysteine
        and has no reported nucleotidase activity. Either restrict the mapping or exclude
        SoxB-subfamily members, for example by making the mapping conditional on the
        absence of a SoxB-specific signature.
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR036907
      slot: interpro2go
      requested_change: CHECK
      asserted_value: GO:0009166
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        IPR036907 is a structural superfamily (5'-nucleotidase C-terminal domain). Mapping
        it to the process GO:0009166 nucleotide catabolic process propagates nucleotide
        catabolism to fold homologs with other substrates. SoxB thiosulfohydrolases of
        the Sox sulfur-oxidation system are one example: they release sulfate from the
        SoxY carrier cysteine. A superfamily-level mapping to a specific catabolic
        process seems too broad.
- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006179
  - InterPro:IPR036907
  review:
    summary: >-
      Correct but very general. SoxB is a hydrolase that cleaves the S-S bond between the
      sulfane and sulfone sulfur atoms of the SoxY-bound cysteine S-thiosulfonate,
      releasing sulfate.
    action: MODIFY
    reason: >-
      The hydrolase claim is right, and the evidence supports the more specific
      GO:0016828 hydrolase activity, acting on sulfur-sulfur bonds. The SoxB reaction
      (ENZYME EC 3.1.6.20, S-sulfosulfanyl-L-cysteine sulfohydrolase) hydrolyses the
      S-SO3- bond of a protein-bound S-thiosulfonate, releasing sulfate (PMID:19535341,
      PMID:28127420). GO has no term for this specific reaction, so a new term is proposed
      under proposed_new_terms. For U5TVQ7 the inference rests on homology: the fragment
      is 50% identical to P. pantotrophus SoxB and conserves all four in-fragment Mn
      ligands of T. thermophilus SoxB (file:THITI/soxB/soxB-bioinformatics/RESULTS.md).
    proposed_replacement_terms:
    - id: GO:0016828
      label: hydrolase activity, acting on sulfur-sulfur bonds
    supported_by:
    - reference_id: PMID:19535341
      supporting_text: SoxB contains a di-manganese(II) site and is proposed to catalyze
        the release of sulfate from a protein-bound cysteine S-thiosulfonate.
    - reference_id: PMID:28127420
      supporting_text: Finally soxB encodes a hydrolase that removes the terminal sulfone
        group as sulfate.
    - reference_id: file:THITI/soxB/soxB-bioinformatics/RESULTS.md
      supporting_text: All four Mn(2+) ligands of the structural reference that fall inside
        the fragment are conserved histidines (U5TVQ7 H27, H131, H154, H156).
- term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002611976
  review:
    summary: >-
      SoxB is a Tat-exported periplasmic component of the Sox thiosulfate-oxidizing
      system. T. thioparus is a Gram-negative betaproteobacterium, so the outer
      membrane-bounded periplasm is the correct compartment.
    action: ACCEPT
    reason: >-
      The TreeGrafter row descends from the PAINT IBD at PTN008520763 (periplasm),
      seeded by E. coli UshA and CpdB, which are periplasmic 5'-nucleotidase family
      members. For SoxB the claim also holds on its own evidence. P. pantotrophus SoxB has
      a twin-arginine signal peptide characteristic of periplasmic proteins
      (PMID:10940005), and the Sox complex is described as periplasmic (PMID:17991026).
      The fragment lacks the N-terminus, so its signal peptide cannot be checked
      directly. The location therefore rests on homology, consistent with the subfamily
      placement.
    supported_by:
    - reference_id: PMID:10940005
      supporting_text: The putative signal peptide contained a twin arginine motif (see
        Fig. 7 ) characteristic of periplasmic proteins
    - reference_id: PMID:17991026
      supporting_text: The soxB gene encodes the SoxB component of the periplasmic thiosulfate-oxidizing
        Sox enzyme complex
- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IC
  original_reference_id: PMID:19535341
  qualifier: enables
  review:
    summary: >-
      SoxB proteins carry a catalytic dimanganese(II) site. The four Mn ligands of
      the T. thermophilus SoxB structure that fall within the U5TVQ7 fragment are all
      conserved histidines.
    action: NEW
    reason: >-
      Two independent lines agree. (1) The crystal structure of T. thermophilus SoxB shows
      a dimanganese(II) site (PMID:19535341). (2) The PDB-derived Mn ligands H174, H274,
      H297 and H299 of Q72IT0 align to conserved His residues H27, H131, H154 and H156 of
      U5TVQ7 (file:THITI/soxB/soxB-bioinformatics/RESULTS.md). Three further ligands lie
      N-terminal to the fragment and cannot be assessed. Mn binding is the cofactor
      requirement of the core hydrolase activity.
    supported_by:
    - reference_id: PMID:19535341
      supporting_text: SoxB contains a di-manganese(II) site
    - reference_id: file:THITI/soxB/soxB-bioinformatics/RESULTS.md
      supporting_text: All four Mn(2+) ligands of the structural reference that fall inside
        the fragment are conserved histidines (U5TVQ7 H27, H131, H154, H156).
