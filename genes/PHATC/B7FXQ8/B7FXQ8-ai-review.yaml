id: B7FXQ8
gene_symbol: HSP20A
product_type: PROTEIN
aliases:
  - PHATRDRAFT_35158
status: COMPLETE
taxon:
  id: NCBITaxon:556484
  label: Phaeodactylum tricornutum CCAP 1055/1
description: >-
  HSP20A (PHATRDRAFT_35158) is a 163-residue small heat shock protein (sHSP) of the
  marine diatom Phaeodactylum tricornutum. It belongs to the HSP20/alpha-crystallin family
  (PANTHER PTHR11527) and has the canonical sHSP architecture: an N-terminal region rich in
  aromatic residues, a complete alpha-crystallin domain (residues 47-155) and a short
  C-terminal extension carrying the I-X-I oligomerization motif (IAI, residues 150-152).
  By homology with characterised sHSPs it is expected to form dynamic oligomers and act as
  an ATP-independent holdase. In this role it would bind non-native proteins during heat and
  other proteotoxic stress and keep them from aggregating, so that ATP-dependent chaperones
  can later refold them. It is not expected to refold clients itself. In an
  alpha-crystallin-domain tree it groups with a Thalassiosira pseudonana sHSP of PANTHER
  subfamily SF175, inside a diatom lineage that contains no experimentally characterised
  protein. Its activity, expression, oligomeric state and subcellular location have not been
  measured. No signal peptide or targeting presequence is annotated, which points to a
  cytosolic protein, but this has not been tested.
existing_annotations:
  - term:
      id: GO:0009408
      label: response to heat
    evidence_type: ISS
    original_reference_id: file:PHATC/B7FXQ8/B7FXQ8-bioinformatics/RESULTS.md
    review:
      summary: >-
        Proposed from the PTHR11527 family-root PAINT IBD. B7FXQ8 has no GO annotations
        because P. tricornutum is not a PANTHER genome.
      action: NEW
      reason: >-
        PAINT placed response to heat at PTN000163021, the root of PTHR11527 (species LUCA),
        so every placed family member inherits it. That includes the diatom PTHR11527:SF175
        sHSPs that group with B7FXQ8 in the ACD tree. B7FXQ8 is a full-length family member
        with a complete alpha-crystallin domain. sHSPs take part in the heat response by
        holding heat-denatured proteins, so the gene product does part of the work rather
        than only being induced. No heat-induction or heat-protection data exist for B7FXQ8
        itself.
      supported_by:
        - reference_id: file:PHATC/B7FXQ8/B7FXQ8-bioinformatics/RESULTS.md
          supporting_text: >-
            The PTHR11527 tree root is PTN000163021 (species LUCA). Its PAINT IBDs are
            protein folding (GO:0006457), response to heat (GO:0009408), response to salt
            stress (GO:0009651), response to hydrogen peroxide (GO:0042542) and protein
            complex oligomerization (GO:0051259).
        - reference_id: file:PHATC/B7FXQ8/B7FXQ8-bioinformatics/RESULTS.md
          supporting_text: >-
            In the NJ tree, B7FXQ8 groups with the T. pseudonana SF175 protein B8CD87.
  - term:
      id: GO:0051259
      label: protein complex oligomerization
    evidence_type: ISS
    original_reference_id: file:PHATC/B7FXQ8/B7FXQ8-bioinformatics/RESULTS.md
    review:
      summary: >-
        Proposed from the PTHR11527 family-root PAINT IBD and the conserved C-terminal I-X-I
        assembly motif of B7FXQ8.
      action: NEW
      reason: >-
        Oligomer assembly is a conserved property of sHSPs. It was placed by PAINT at the
        PTHR11527 root and is directly demonstrated for archaeal Hsp16.5 (PMID:29983375).
        B7FXQ8 keeps the I-X-I motif (IAI 150-152) that cross-links neighbouring
        alpha-crystallin dimers. The protein assembles itself, so it carries out the process.
      supported_by:
        - reference_id: file:PHATC/B7FXQ8/B7FXQ8-bioinformatics/RESULTS.md
          supporting_text: >-
            The C-terminal I-X-I motif, which sHSPs use for oligomer assembly, is present
            in the target as IAI at residues 150-152.
        - reference_id: PMID:29983375
          supporting_text: >-
            Small heat-shock proteins (sHSPs) are molecular chaperones that bind partially
            and globally unfolded states of their client proteins.
core_functions:
  - description: >-
      Predicted ATP-independent holdase chaperone activity. The family-level evidence is
      that sHSPs bind partially or globally unfolded client proteins and prevent their
      aggregation. The activity is carried by oligomeric assemblies built from
      alpha-crystallin-domain dimers that the I-X-I motif cross-links, and B7FXQ8 has both
      the complete domain and the motif. GO has no suitable term. Obsolete GO:0051082 covered
      binding only. GO:0044183 protein folding chaperone requires assisting folding. GO:0140309
      keeps a carrier definition that requires escort to an acceptor. The activity is
      therefore recorded as a proposed term, following the repository convention for sHSPs
      such as Arabidopsis HSP17.7 and yeast HSP26. The only process terms linked here are the
      ones PAINT placed at the PTHR11527 root node PTN000163021, from which every member
      descends: response to heat and protein complex oligomerization. No location is
      asserted because none has been measured.
    proposed_molecular_function: holdase chaperone activity
    directly_involved_in:
      - id: GO:0009408
        label: response to heat
      - id: GO:0051259
        label: protein complex oligomerization
