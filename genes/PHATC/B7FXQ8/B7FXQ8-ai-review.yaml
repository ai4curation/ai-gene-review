proposed_new_terms:
  - proposed_name: holdase chaperone activity
    proposed_definition: >-
      Binding to an unfolded or misfolded protein to prevent its aggregation without actively
      catalyzing refolding. The holdase maintains the client protein in a soluble,
      folding-competent state.
    justification: >-
      sHSPs, including PTHR11527 members, act as ATP-independent holdases. They bind
      non-native clients and prevent aggregation but do not refold them. Obsolete GO:0051082
      captured binding only. GO:0044183 requires assisting folding. GO:0140309 (relabelled
      'unfolded protein holdase activity') keeps a carrier definition requiring escort to an
      acceptor molecule or location. Same proposal as for Arabidopsis HSP17.7 and yeast HSP26;
      see go-ontology#30552.
    proposed_parent:
      id: GO:0003674
      label: molecular_function
    supported_by:
      - reference_id: PMID:29983375
        supporting_text: >-
          Small heat-shock proteins (sHSPs) are molecular chaperones that bind partially
          and globally unfolded states of their client proteins.
references:
  - id: PMID:18923393
    title: The Phaeodactylum genome reveals the evolutionary history of diatom genomes.
    findings:
      - statement: >-
          The genome sequence of P. tricornutum strain CCAP 1055/1, from which
          HSP20A (PHATRDRAFT_35158) was predicted.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >-
        Genome paper cited in the UniProt entry as the source of the gene model. It provides
        no functional data on HSP20A.
  - id: PMID:29983375
    title: Engineering of a Polydisperse Small Heat-Shock Protein Reveals Conserved Motifs
      of Oligomer Plasticity.
    findings:
      - statement: >-
          sHSPs bind partially and globally unfolded client proteins. The archaeal Hsp16.5
          forms ordered 24-subunit oligomers, and engineering it showed conserved motifs that
          govern oligomer plasticity.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Family-level evidence for sHSP client binding and oligomerization. Hsp16.5 is
        archaeal and has no PANTHER assignment, so this paper supports general sHSP biology
        only, not a B7FXQ8-specific transfer.
  - id: PMID:11576425
    title: At-HSP17.6A, encoding a small heat-shock protein in Arabidopsis, can enhance
      osmotolerance upon overexpression.
    findings:
      - statement: >-
          In vitro chaperone activity of a PTHR11527 member, Arabidopsis cytosolic class II
          sHSP HSP17.6A.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Shows chaperone activity in a characterised PTHR11527 member that shares the family
        root node with B7FXQ8. It is a family-level relative, not an ortholog, so the
        osmotolerance phenotype is not transferred.
  - id: file:PHATC/B7FXQ8/B7FXQ8-deep-research-falcon.md
    title: Deep research report on HSP20A (B7FXQ8) in P. tricornutum
    findings:
      - statement: >-
          Comprehensive literature synthesis on sHSP family biology and
          P. tricornutum thermal stress response systems.
    reference_review:
      relevance: LOW
      correctness: UNVERIFIED
      review_notes: >-
        Retained as background. In the 2026-10-21 re-review it is no longer used as support.
        It states that no direct experimental data exist for HSP20A, and its chaperone claims
        are generic family biology attributed to secondary reviews. Its P. tricornutum HSF
        statements concern transcription factors, not this protein.
  - id: file:PHATC/B7FXQ8/B7FXQ8-hypotheses/core-function-1-go-0051082/openscientist.md
    title: OpenScientist hypothesis investigation - unfolded protein binding as core function of HSP20A
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        The sidecar confirms the protein-folding chaperone interpretation of
        the sHSP/alpha-crystallin architecture and correctly flags GO:0051082 as
        obsolete; it should support a non-obsolete chaperone or holdase framing
        rather than the obsolete binding term.
    findings:
      - statement: >-
          GO:0051082 (unfolded protein binding) is officially obsolete. Recommended
          replacement is GO:0044183 (protein folding chaperone), following precedent
          of 25 reviewed sHSPs in Swiss-Prot. B7FXQ8 has zero GO annotations in any
          database; only one of seven P. tricornutum sHSPs has any GO annotation.
      - statement: >-
          All seven independent domain databases (CDD, InterPro, Pfam, PROSITE,
          PANTHER, SMART, Gene3D) classify B7FXQ8 as an sHSP. The IXI motif (IAI at
          position 150) is present, supporting oligomeric assembly capability.
    reference_review:
      relevance: LOW
      correctness: DISPUTED
      review_notes: >-
        Retained. The IXI motif finding was re-checked (IAI at 150-152, see
        B7FXQ8-bioinformatics/RESULTS.md). Its recommendation to use GO:0044183 is not
        followed. GO:0044183 requires assisting folding, while sHSPs are holdases that do
        not refold clients, so the repository's proposed holdase term is used instead.
  - id: file:PHATC/B7FXQ8/B7FXQ8-bioinformatics/RESULTS.md
    title: B7FXQ8 (HSP20A) phylogenetic placement among small heat shock proteins
    findings:
      - statement: >-
          B7FXQ8 is in PTHR11527 at family level only, and P. tricornutum is not a PANTHER
          genome. In an ACD neighbour-joining tree it groups with T. pseudonana B8CD87
          (PTHR11527:SF175). No characterised protein falls inside that diatom lineage. The
          PAINT family root PTN000163021 carries protein folding, response to heat,
          response to salt stress, response to H2O2 and protein complex oligomerization.
suggested_questions:
  - question: >-
      Is HSP20A induced by heat or other proteotoxic stress in P. tricornutum, and is its
      promoter bound by any of the expanded set of P. tricornutum HSF transcription factors?
  - question: >-
      Is HSP20A cytosolic, or is any fraction targeted to the plastid or mitochondrion
      despite lacking a recognisable presequence?
  - question: >-
      Should the PAINT root IBDs for PTHR11527 (response to salt stress, response to
      hydrogen peroxide) be considered family-wide, given that they rest on plant
      phenotypes? B7FXQ8 would inherit them if P. tricornutum were added to PANTHER.
  - question: >-
      What oligomeric state does HSP20A adopt, and does heat shift it toward the smaller
      species that are typically the active holdase form?
suggested_experiments:
  - hypothesis: HSP20A transcript and protein levels rise after heat shock in P. tricornutum.
    description: >-
      Time-course RT-qPCR and immunoblot (or tagged-line) measurements after a temperature
      shift (e.g. 20 to 30 degrees C), compared with the other P. tricornutum sHSP paralogs.
  - hypothesis: Recombinant HSP20A suppresses thermal aggregation of model clients.
    description: >-
      Light-scattering aggregation assays with citrate synthase or luciferase. Follow with
      refolding assays in the presence of HSP70/HSP40 to test holdase-to-foldase handoff.
      Include an IXI-motif mutant (IAI150-152 to GAG).
  - hypothesis: HSP20A forms heat-responsive oligomers.
    description: >-
      Size-exclusion chromatography with multi-angle light scattering and native mass
      spectrometry at permissive and heat-shock temperatures.
  - hypothesis: Loss of HSP20A reduces thermotolerance.
    description: >-
      CRISPR-Cas9 knockout of HSP20A, alone and combined with its closest paralogs, followed
      by growth and survival measurements after acute and chronic heat stress.
