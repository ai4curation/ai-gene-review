  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006457
      label: protein folding
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Protein folding is among the PAINT IBDs at the PTHR11527 family root, and characterised sHSPs bind
        non-native clients and suppress their aggregation (PMID:29983375), which can feed into ATP-dependent
        refolding by other chaperones. The re-reviewed gene and its bioinformatic analysis limit transfer to
        holdase client binding, oligomerization and response to heat, and treat sHSPs as holdases that do
        not themselves assist folding; the PTHR11527 family review leaves the protein-folding process
        unresolved. No folding, refolding or aggregation assay exists for B7FXQ8 or any protein in its
        diatom lineage. The term is absent from GOA for this gene. Whether holdase activity amounts to
        participation in protein folding for this protein is not settled by the available evidence.
      supported_by:
        - reference_id: file:PHATC/B7FXQ8/B7FXQ8-uniprot.txt
          supporting_text: >-
            ID   B7FXQ8_PHATC            Unreviewed;       163 AA. ... DR   InterPro; IPR002068; A-crystallin/Hsp20_dom.
            ... DR   InterPro; IPR008978; HSP20-like_chaperone. ... DR   InterPro; IPR031107; Small_HSP.
