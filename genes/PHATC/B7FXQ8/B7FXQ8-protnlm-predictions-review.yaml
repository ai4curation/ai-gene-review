  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0051259
      label: protein complex oligomerization
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        B7FXQ8 is a full-length sHSP with a complete alpha-crystallin domain and retains the C-terminal
        I-X-I oligomer-assembly motif (IAI, residues 150-152). Protein complex oligomerization is a PAINT
        IBD at the PTHR11527 family root PTN000163021, from which the diatom SF175 sHSPs that group with
        B7FXQ8 descend, and oligomer assembly is demonstrated experimentally for sHSPs such as archaeal
        Hsp16.5 (PMID:29983375). This is a justified family-level inference, not an observation on the
        target, and it does not fix an oligomer size. The gene review proposes this process as a new
        annotation. B7FXQ8 has no GOA annotations, so the prediction is novel.
      supported_by:
