id: B7FXQ8
gene_symbol: B7FXQ8
taxon:
  id: NCBITaxon:556484
  label: Phaeodactylum tricornutum CCAP 1055/1
status: COMPLETE
description: >-
  HSP20A (B7FXQ8) of Phaeodactylum tricornutum is a full-length small heat-shock protein of PANTHER
  family PTHR11527 with no GOA annotations. Protein complex oligomerization, response to heat and
  unfolded protein binding (an obsolete term) are supported by transfer from the family-root PAINT
  node and characterised sHSP biology. Protein folding, response to salt stress and response to
  hydrogen peroxide remain uncertain.
