      label: protein folding
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The alpha-crystallin/Hsp20 domain and small-HSP family assignment support a holdase chaperone
        role. Characterized sHSPs bind nonnative clients and protect them from aggregation (PMID:29983375),
        allowing subsequent recovery of folding with other chaperones. The broad protein-folding process
        can encompass this assistance; it does not imply that the protein itself catalyzes ATP-dependent
        refolding. There is no more specific existing GOA/UniProt annotation against which to call this
        prediction less precise.
