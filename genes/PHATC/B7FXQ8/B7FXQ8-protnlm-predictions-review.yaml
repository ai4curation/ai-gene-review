predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0009651
      label: response to salt stress
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The target is a full-length small heat-shock protein with an alpha-crystallin domain. The PTHR11527
        family-root PAINT node PTN000163021 carries response to salt stress, and the closest placed relative
        of B7FXQ8 is a Thalassiosira pseudonana PTHR11527:SF175 sHSP. The family-root salt IBD rests on
        stimulus-specific plant phenotypes, and no salt induction, protection or loss-of-function data exist
        for B7FXQ8 or any characterised protein in its diatom lineage. The gene review treats this IBD as an
        open question rather than transferring it, and the OpenScientist analysis flags the salt prediction
        as an outlier relative to the family's InterPro2GO mapping. Characterised sHSP client binding
        (PMID:29983375) does not establish a salt-triggered response. The term is absent from GOA for this
        gene, and the prediction can neither be supported nor refuted.
      supported_by:
        - reference_id: file:PHATC/B7FXQ8/B7FXQ8-uniprot.txt
          supporting_text: >-
            ID   B7FXQ8_PHATC            Unreviewed;       163 AA. ... DR   InterPro; IPR002068; A-crystallin/Hsp20_dom.
            ... DR   InterPro; IPR008978; HSP20-like_chaperone. ... DR   InterPro; IPR031107; Small_HSP.
            ... FT   DOMAIN          47..155 ... FT                   /note="SHSP"
        - reference_id: file:PHATC/B7FXQ8/B7FXQ8-bioinformatics/RESULTS.md
          supporting_text: >-
            The PTHR11527 tree root is PTN000163021 (species LUCA). Its PAINT IBDs are
            protein folding (GO:0006457), response to heat (GO:0009408), response to salt
            stress (GO:0009651), response to hydrogen peroxide (GO:0042542) and protein
            complex oligomerization (GO:0051259). ... In the NJ tree, B7FXQ8 groups with the T. pseudonana SF175 protein B8CD87.
