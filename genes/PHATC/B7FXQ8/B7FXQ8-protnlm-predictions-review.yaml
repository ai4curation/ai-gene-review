    predicted_term:
      id: GO:0051082
      label: unfolded protein binding
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        B7FXQ8 has the complete alpha-crystallin domain and I-X-I motif of small heat-shock proteins.
        Client-binding experiments on characterised sHSPs show recognition of partially or globally unfolded
        proteins (PMID:29983375), and the gene review's core function is an ATP-independent holdase that
        binds non-native clients. This supports the binding claim as a family-level inference. GO:0051082 is
        obsolete in the current ontology without a replacement; the gene review records the activity under a
        proposed holdase chaperone term. The biological claim is correct, but the term is unusable for a
        live annotation. B7FXQ8 has no GOA annotations, so the claim is novel.
