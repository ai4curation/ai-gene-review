predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0042542
      label: response to hydrogen peroxide
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Top-ranked hit (score 15.00). Small heat shock proteins are induced by oxidative as
        well as thermal stress in many organisms, so this is not unreasonable, but there is
        no expression or phenotype evidence for this diatom protein under any stressor and
        the family's defining property is heat induction. Ranking peroxide above heat for an
        HSP20 is the sort of ordering a user should not read as a claim about relative
        importance. Recorded as uncertain.
      supported_by:
        - reference_id: file:PHATC/B7FXQ8/B7FXQ8-uniprot.txt
          supporting_text: Belongs to the small heat shock protein (HSP20) family
