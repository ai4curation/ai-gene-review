    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0009651
      label: response to salt stress
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 2 (score 14.43). Same reasoning as rank 1: plausible for an sHSP in a marine
        organism, unevidenced for this protein. Ranks 1-4 offer four different stressors at
        scores within 0.7 of each other, so the list expresses "stress-responsive" without
        resolving which stress - a case where a general term (response to stress) would have
        been more useful than four specific ones.
      supported_by:
