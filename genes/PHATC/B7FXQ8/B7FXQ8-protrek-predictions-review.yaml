          supporting_text: Belongs to the small heat shock protein (HSP20) family
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1903935
      label: response to sodium arsenite
    predicted_term_type: GO_BP
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Rank 3 (score 14.32). Arsenite is a classical proteotoxic-stress inducer used to
        trigger sHSP and heat-shock responses experimentally, so the term is a legitimate
        descendant of the response-to-stress biology this review assigns; but naming this
        specific chemical for a diatom protein with no toxicological data is over-committed.
        Scored LSP because the parent concept a curator would climb to - cellular response to
        unfolded protein - is one of this review's core processes.
      supported_by:
        - reference_id: file:PHATC/B7FXQ8/B7FXQ8-uniprot.txt
          supporting_text: Belongs to the small heat shock protein (HSP20) family
