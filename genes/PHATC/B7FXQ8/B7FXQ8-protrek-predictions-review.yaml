id: B7FXQ8
gene_symbol: HSP20A
taxon:
  id: NCBITaxon:556484
  label: Phaeodactylum tricornutum CCAP 1055/1
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a small heat shock protein (alpha-crystallin
  domain) from the marine diatom Phaeodactylum tricornutum. The protein has no GOA
  annotations. ProTrek's top five are all abiotic-stress response processes - hydrogen
  peroxide, salt, sodium arsenite, anoxia and heat - which is the correct biological
  neighbourhood for an sHSP and includes, at rank 5, an exact match to one of this
  review's core processes. But the list is a menu of stressors rather than a statement
  about the protein: the ordering puts hydrogen peroxide above heat for a heat shock
  protein, and the chaperone molecular function that defines the family is absent from
  the top 25 entirely. ProtNLM2 on the same protein returned six terms covering both the
  processes and the molecular function (unfolded protein binding, protein folding), a
  more complete answer.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 1 less precise (LSP),
  2 uncertain (UNC).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
