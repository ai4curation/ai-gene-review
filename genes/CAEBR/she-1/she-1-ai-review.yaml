  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Sole primary characterization of she-1 (Guo, Lang & Ellis, Curr. Biol. 2009),
      verified against PubMed (title, authors, DOI 10.1016/j.cub.2009.09.042) and
      the reference cited by UniProt A8XDR5 for FUNCTION, DEVELOPMENTAL STAGE,
      DISRUPTION PHENOTYPE and mutagenesis of Arg-49/Gly-111. The paper has no PMC
      record, so the local cache is abstract-only (the cache was refreshed to
      include the abstract, which the previous copy lacked). The abstract supports
      the genetic role (hermaphrodite regulator acting upstream of tra-2), the F-box
      identity, and the absence of GLD-1 binding. It does not report SCF complex
      membership or a ubiquitylation substrate, so the SCF substrate-adaptor core
      function below remains a provisional, domain-based inference. Phenotype
      details not in the abstract (FOG-3 loss, RNAi brood bias) are taken from the
      UniProt curated (ECO:0000269) annotations of this paper.
