  knowledge_gaps:
  - gap_statement: >-
      Whether SHE-1 assembles into an SCF complex at all, which Skp1/Cullin partners
      it uses, and which substrate(s) it presents for ubiquitylation are undetermined.
    boundary: >-
      SHE-1 carries two canonical F-box domains and is genetically required for XX
      spermatogenesis upstream of tra-2, and is known not to bind GLD-1, but no
      biochemical partner, substrate or complex composition has been reported.
    gap_kind:
    - BIOLOGY
- description: >-
    Germline sex-determination factor that promotes the male (sperm) germ-cell fate
    in XX hermaphrodites of C. briggsae. she-1 acts genetically upstream of tra-2 and
    is required for the transient burst of hermaphrodite spermatogenesis: loss of
    function transforms XX animals into oocyte-only, self-sterile females, and mutants
    fail to produce the downstream FOG-3 protein that specifies the sperm fate. It is
    a lineage-specific factor independently recruited into the sex-determination
    pathway during the evolution of self-fertile hermaphroditism, occupying the
    pathway position of C. elegans fog-2 (which carries the same process term).
  directly_involved_in:
