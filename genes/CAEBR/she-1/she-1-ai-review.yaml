    label: hermaphrodite germ-line sex determination
  supported_by:
  - reference_id: PMID:19836240
    supporting_text: >-
      Analysis of double mutants indicates that she-1 acts upstream of tra-2 in C.
      briggsae, just as fog-2 does in C. elegans.
