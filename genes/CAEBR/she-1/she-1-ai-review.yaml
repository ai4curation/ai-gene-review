core_functions:
- description: >-
    PROVISIONAL. Candidate substrate-recognition subunit of an SCF (Skp1/Cullin/F-box)
    E3 ubiquitin-ligase complex. This is inferred only from SHE-1's two canonical
    F-box domains and the canonical biology of F-box proteins: the primary paper
    establishes that she-1 encodes an F-box protein but reports no SCF partner,
    ubiquitin-ligase activity or substrate, and shows that SHE-1, unlike C. elegans
    FOG-2, does not bind GLD-1. The term should be confirmed or withdrawn once SHE-1
    partners are identified biochemically.
  molecular_function:
