id: H6UM09
gene_symbol: LHS1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:62337
  label: Miscanthus sinensis
description: Fragment of a leafy hull sterile 1-like MADS-box/K-box transcription factor, predicted to function as a nuclear DNA-binding transcriptional regulator.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: DNA binding is true but uninformative beside the DNA-binding transcription factor activity row accepted in this review, which entails it.
    action: TOO_GENERAL
    reason: Family/domain evidence only, no Miscanthus experiment. The fragment carries a MADS-box DNA-binding domain (InterPro IPR002100, PROSITE PS50066 match), so DNA binding is true, but the accepted GO:0003700 DNA-binding transcription factor activity has_part transcription cis-regulatory region binding (a DNA binding descendant) and so already entails it. The earlier MARK_AS_OVER_ANNOTATED conceded the claim was true and redundant, which is the TOO_GENERAL case.
    supported_by:
    - reference_id: file:MISSI/LHS1/LHS1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR002100; TF_MADSbox'
    - reference_id: file:MISSI/LHS1/LHS1-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: 'PROSITE; PS50066; MADS_BOX_2'
- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: DNA-binding transcription factor activity is the core molecular function.
    action: ACCEPT
    reason: The protein is a MADS-box/K-box transcription factor fragment, and InterPro supports the DNA-binding transcription factor annotation.
    supported_by:
    - reference_id: file:MISSI/LHS1/LHS1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR002487; TF_Kbox'
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Nuclear localization is supported.
    action: ACCEPT
    reason: No Miscanthus localization experiment, and UniProt's nucleus statement rests only on an ARBA rule. The location rests on family membership; the fragment carries MADS-box and K-box domains of the MADS-box/MEF2 transcription factor family, whose members act on DNA in the nucleus.
    supported_by:
    - reference_id: file:MISSI/LHS1/LHS1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR050142; MADS-box/MEF2_TF'
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Regulation of transcription is an appropriate biological process for a MADS-box transcription factor.
    action: ACCEPT
    reason: Family/domain evidence only, no Miscanthus experiment. The fragment belongs to the MADS-box/MEF2 transcription factor family (InterPro IPR050142) and carries a K-box domain (PROSITE PS51297 match), so regulation of transcription follows from family membership.
    supported_by:
    - reference_id: file:MISSI/LHS1/LHS1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR050142; MADS-box/MEF2_TF'
    - reference_id: file:MISSI/LHS1/LHS1-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: 'PROSITE; PS51297; K_BOX'
- term:
    id: GO:0046983
    label: protein dimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Protein dimerization is plausible for a MADS-box/K-box protein but is not the main curated function.
    action: KEEP_AS_NON_CORE
    reason: MADS/K-box transcription factors commonly dimerize, and InterPro supports this annotation, but the core function is transcriptional regulation.
    supported_by:
    - reference_id: file:MISSI/LHS1/LHS1-uniprot.txt
      record_section: ["DR:GO"]
      supporting_text: 'GO; GO:0046983; F:protein dimerization activity'
    - reference_id: file:MISSI/LHS1/LHS1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'InterPro; IPR002100; TF_MADSbox'
references:
