suggested_questions:
- question: Is Miscanthus LHS1 orthologous to grass floral MADS-box genes controlling spikelet or floral organ development?
suggested_experiments:
- description: Determine LHS1 expression in developing inflorescences and test effects of LHS1 perturbation on floral organ identity and target-gene expression.
  experiment_type: expression and developmental assay
