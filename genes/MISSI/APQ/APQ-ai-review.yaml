id: S5E2M2
gene_symbol: APQ
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:62337
  label: Miscanthus sinensis
description: Putative PIP-type aquaporin, a multi-pass plasma membrane water channel in the major intrinsic protein family.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Plasma membrane localization is supported.
    action: ACCEPT
    reason: No Miscanthus localization experiment, and UniProt's cell membrane statement and PIP subfamily note rest only on ARBA. The location rests on family membership plus sequence features. The protein matches the MIP family (NCBIfam TIGR00861) and a FunFam family whose representative is a PIP (plasma membrane intrinsic protein) aquaporin, and Phobius predicts six transmembrane helices, consistent with a multi-pass plasma membrane channel.
    supported_by:
    - reference_id: file:MISSI/APQ/APQ-uniprot.txt
      record_section: ["DR:FunFam"]
      supporting_text: 'FunFam; 1.20.1080.10:FF:000001; Probable aquaporin PIP1-2'
    - reference_id: file:MISSI/APQ/APQ-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: 'NCBIfam; TIGR00861; MIP'
    - reference_id: file:MISSI/APQ/APQ-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: 'TRANSMEM        57..77'
- term:
    id: GO:0015267
    label: channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Channel activity is true but too broad for a PIP-type aquaporin.
    action: MODIFY
    reason: Use the substrate-specific water channel activity term for this aquaporin-family membrane channel.
    supported_by:
    - reference_id: file:MISSI/APQ/APQ-uniprot.txt
      record_section: [DE]
      supporting_text: 'SubName: Full=Putative PIP-type aquaporin'
    - reference_id: file:interpro/panther/PTHR45687/PTHR45687-entries.csv
      supporting_text: P30302,Aquaporin PIP2-3
    proposed_replacement_terms:
    - id: GO:0015250
      label: water channel activity
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Membrane localization is true but uninformative beside the plasma membrane row accepted in this review.
    action: TOO_GENERAL
    reason: Sequence features and family membership, no Miscanthus experiment. Phobius predicts six transmembrane helices, so the protein is a membrane protein, but the generic term is imprecise on its own and is entailed by the accepted GO:0005886 plasma membrane (is_a membrane). The earlier MARK_AS_OVER_ANNOTATED conceded the claim was true and redundant, which is the TOO_GENERAL case.
    supported_by:
    - reference_id: file:MISSI/APQ/APQ-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: 'TRANSMEM        57..77'
    - reference_id: file:MISSI/APQ/APQ-uniprot.txt
      record_section: ["DR:FunFam"]
      supporting_text: 'FunFam; 1.20.1080.10:FF:000001; Probable aquaporin PIP1-2'
- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Transmembrane transport is true but too broad for a PIP-type aquaporin.
    action: MODIFY
    reason: The aquaporin family assignment supports water transport as the more informative process.
    supported_by:
    - reference_id: file:MISSI/APQ/APQ-uniprot.txt
      record_section: [DE]
      supporting_text: 'SubName: Full=Putative PIP-type aquaporin'
    - reference_id: file:interpro/panther/PTHR45687/PTHR45687-entries.csv
      supporting_text: Q6EU94,Aquaporin PIP1-1
    proposed_replacement_terms:
    - id: GO:0006833
      label: water transport
