id: A0A7G1DRS6
gene_symbol: DHS
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:62337
  label: Miscanthus sinensis
description: Deoxyhypusine synthase that catalyzes the deoxyhypusine-forming step of peptidyl-hypusine biosynthesis.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Cytoplasm localization is supported for Miscanthus DHS.
    action: ACCEPT
    reason: >-
      No Miscanthus localization experiment exists and the UniProt record carries no
      SUBCELLULAR LOCATION comment. The TreeGrafter row rests on family membership: the
      protein is in the PANTHER deoxyhypusine synthase subfamily, whose members are soluble
      cytosolic enzymes that modify eIF5A, and the sequence has no signal peptide,
      transit peptide or transmembrane segment annotated.
    supported_by:
    - reference_id: file:MISSI/DHS/DHS-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR11703:SF0; DEOXYHYPUSINE SYNTHASE'
- term:
    id: GO:0008612
    label: peptidyl-hypusine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Peptidyl-hypusine biosynthesis is the correct biological process for DHS.
    action: ACCEPT
    reason: Deoxyhypusine synthase catalyzes the committed modification step in hypusine biosynthesis, and the annotation is supported by InterPro/PANTHER methods in GOA.
    supported_by:
    - reference_id: file:MISSI/DHS/DHS-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: 'PANTHER; PTHR11703:SF0; DEOXYHYPUSINE SYNTHASE'
- term:
    id: GO:0034038
    label: deoxyhypusine synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Deoxyhypusine synthase activity is the core molecular function.
    action: ACCEPT
    reason: >-
      Family membership: the protein matches the deoxyhypusine synthase family across
      independent classifiers (InterPro IPR002773, the NCBIfam TIGR00321 equivalog model
      and the PANTHER deoxyhypusine synthase subfamily). There is no Miscanthus enzyme assay.
    supported_by:
    - reference_id: file:MISSI/DHS/DHS-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR002773; Deoxyhypusine_synthase.
    - reference_id: file:MISSI/DHS/DHS-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; TIGR00321; dhys; 1.
