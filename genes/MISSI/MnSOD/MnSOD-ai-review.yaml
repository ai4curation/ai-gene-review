  findings:
  - statement: The Miscanthus MnSOD entry is supported by transcript-level nucleotide sequence evidence from Zeng et al. 2015.
    supporting_text: >-
      MnSOD genes from M. × giganteus (MgMnSOD1, MgMnSOD2), M. lutarioriparia
      (MlMnSOD), M. sacchariflora (MsaMnSOD), M. sinensis (MsiMnSOD), and M.
      floridulus (MfMnSOD) were cloned and sequenced.
