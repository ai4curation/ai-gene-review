id: A0A088MDT8
gene_symbol: MnSOD
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:62337
  label: Miscanthus sinensis
description: Mitochondrial manganese superoxide dismutase that detoxifies superoxide radicals in the mitochondrial matrix by converting superoxide to hydrogen peroxide and oxygen.
existing_annotations:
- term:
    id: GO:0004784
    label: superoxide dismutase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: The EC/RHEA-supported UniProt annotation matches the protein name, catalytic reaction, and MnSOD family assignment.
    action: ACCEPT
    reason: Superoxide dismutase activity is the defining catalytic activity of MnSOD and is directly supported by the UniProt EC 1.15.1.1 reaction.
    supported_by:
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=2 superoxide + 2 H(+) = H2O2 + O2
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Mitochondrial localization is supported by family membership and by the characterized Miscanthus MnSOD homeolog; the root organelle term is informative and is kept alongside the matrix row.
    action: ACCEPT
    reason: >-
      Root organelle term, kept per the organelle policy. The IEA (TreeGrafter) claim holds:
      the protein falls in the PANTHER mitochondrial Mn-SOD subfamily (family membership),
      and Zeng et al. 2015 (PMID:26334392) report that the closely related Miscanthus x
      giganteus MgMnSOD1 functions in mitochondria (by similarity; the M. sinensis MsiMnSOD
      itself was only cloned and sequenced). The UniProt SUBCELLULAR LOCATION line is ARBA-only
      and is not used. MnSOD activity is a mitochondrial function, so the row is accepted.
    supported_by:
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR11404:SF6; SUPEROXIDE DISMUTASE [MN], MITOCHONDRIAL
    - reference_id: PMID:26334392
      supporting_text: MgMnSOD1 functions in mitochondria
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Matrix localization rests on membership in the mitochondrial Mn-SOD subfamily and on the predicted mitochondrial targeting of the Miscanthus homeolog, whose role is removal of respiration-derived superoxide.
    action: ACCEPT
    reason: >-
      No Miscanthus experiment resolves the sub-compartment; the UniProt SUBCELLULAR
      LOCATION line is ARBA-only. The matrix call rests on family membership (PANTHER
      mitochondrial Mn-SOD subfamily, whose members are soluble matrix enzymes) together
      with the N-terminal targeting and respiratory role reported by similarity for the
      Miscanthus x giganteus homeolog MgMnSOD1 (Zeng et al. 2015, PMID:26334392):
      removing superoxide generated by respiration only makes sense on the matrix side.
    supported_by:
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR11404:SF6; SUPEROXIDE DISMUTASE [MN], MITOCHONDRIAL
    - reference_id: PMID:26334392
      supporting_text: MgMnSOD1 is predicted to be targeted to mitochondria and involved in removing the superoxide radical generated by respiration.
- term:
    id: GO:0006801
    label: superoxide metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: Superoxide metabolism is correct but general; the Fe/Mn SOD family evidence behind this row supports the more specific removal of superoxide radicals, which the review already carries.
    action: MODIFY
    reason: >-
      Correct but general. This row's own evidence is Mn/Fe SOD family membership
      (InterPro), and the RuleBase-supported function and reaction for that family is
      destruction of superoxide radicals by dismutation, i.e. GO:0019430 removal of
      superoxide radicals (an is_a descendant of GO:0006801, already accepted in this
      review). The ARBA-only FUNCTION line previously quoted is not used.
    proposed_replacement_terms:
    - id: GO:0019430
      label: removal of superoxide radicals
    supported_by:
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR001189; Mn/Fe_SOD.
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Destroys radicals which are normally produced within the cells and which are toxic to biological systems.
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=2 superoxide + 2 H(+) = H2O2 + O2
- term:
    id: GO:0006950
    label: response to stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: Oxidative radical detoxification contributes to stress response, but this term is broad and not the core biochemical function.
    action: KEEP_AS_NON_CORE
    reason: Stress response is a downstream biological context for MnSOD activity rather than its defining molecular role.
    supported_by:
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Destroys radicals which are normally produced within the cells and which are toxic to biological systems.
- term:
    id: GO:0019430
    label: removal of superoxide radicals
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: The GO term matches the catalytic SOD reaction converting superoxide radicals to hydrogen peroxide and oxygen.
    action: ACCEPT
    reason: Removal of superoxide radicals is the direct biological process accomplished by MnSOD activity.
    supported_by:
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=2 superoxide + 2 H(+) = H2O2 + O2
- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Mn(2+) cofactor binding is explicitly recorded in UniProt and is consistent with a manganese superoxide dismutase.
    action: ACCEPT
    reason: >-
      Manganese binding is the specific metal cofactor association for MnSOD catalysis. It
      rests on family evidence: PIRSR-annotated Mn(2+)-binding residues (positions 57, 105,
      194, 198) and a match to the PROSITE Mn-SOD signature. The UniProt COFACTOR line is
      ARBA-only and is not used.
    supported_by:
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: 'FT   BINDING         57 FT                   /ligand="Mn(2+)"'
    - reference_id: file:MISSI/MnSOD/MnSOD-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: PROSITE; PS00088; SOD_MN; 1.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Generic metal ion binding is true through the manganese cofactor but less specific than GO:0030145.
    action: KEEP_AS_NON_CORE
    reason: The specific manganese ion binding annotation should represent the core cofactor-binding aspect; the parent metal-binding term is non-core.
