  review:
    summary: Generic oxidoreductase activity should be refined to CAD activity.
    action: MODIFY
    reason: Family membership supports the specific activity. Besides the generic medium-chain ADH signatures, the protein matches the InterPro CAD-like family and the CDD CAD1 subfamily (cd05283), whose members are cinnamyl alcohol dehydrogenases, so the generic oxidoreductase term is refined to GO:0045551, already carried in this review. No Miscanthus enzyme assay exists; the EC number and reaction lines on the record rest only on ARBA.
