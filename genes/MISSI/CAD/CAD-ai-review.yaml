  review:
    summary: Lignin biosynthesis is the expected process context for CAD.
    action: ACCEPT
    reason: Rests on family membership, not a Miscanthus experiment. The protein matches the InterPro CAD-like family and the CDD CAD1 subfamily (cd05283), the bona fide cinnamyl alcohol dehydrogenases that catalyse the final monolignol reduction step of lignin biosynthesis. The record's pathway and catalytic-activity lines rest only on ARBA, so they are not cited.
