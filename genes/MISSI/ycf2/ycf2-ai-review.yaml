core_functions:
- description: Plastid-encoded Ycf2 family protein. This entry is a 263-residue partial sequence that matches only the Ycf2 PANTHER family and carries no signature of the AAA-ATPase region, so its molecular activity is not asserted here.
  directly_involved_in: []
  locations:
