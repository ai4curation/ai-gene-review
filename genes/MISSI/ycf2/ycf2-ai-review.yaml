    record_section: ["DR:PANTHER"]
    supporting_text: PANTHER; PTHR33078:SF102; YCF2; 1.
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of this Miscanthus Ycf2 sequence is unknown. Full-length Ycf2
      proteins carry an AAA-ATPase-like region and act with FtsHi proteins in a
      chloroplast-import AAA-ATPase complex, but this 263-residue entry has no ATPase
      domain signature, and the import study measured ATP binding on FtsHi1, not Ycf2.
    boundary: >-
      Established only that the sequence belongs to the plastid Ycf2 family (PANTHER
      PTHR33078:SF102). Whether the full-length Miscanthus ycf2 gene product binds or
      hydrolyses ATP, and what part of it this entry covers, is open.
    gap_kind:
