taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: 'ERG3 encodes the Candida glabrata Delta7-sterol 5(6)-desaturase, the predicted multi-pass ER-membrane
  Erg3 enzyme that introduces the C5=C6 double bond in the late ergosterol pathway. ERG3 deletion perturbs the C.
  glabrata sterol profile and antifungal responses, including fluconazole phenotypes that depend on the genetic
  background used for Erg3 loss-of-function assays.'
