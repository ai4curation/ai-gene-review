      record_section:
      - DR:PANTHER
      supporting_text: "DR   PANTHER; PTHR28298:SF1; EISOSOME PROTEIN 1; 1."
    - reference_id: PMID:20526336
      supporting_text: >-
        Collectively, these data show that Ymr031c is physically associated
        with eisosomes and is required for their normal formation.
    - reference_id: file:CANGA/EIS1/EIS1-notes.md
      supporting_text: >-
        No direct `CAGL0L12914g`, `Q6FKB4`, `Candida glabrata EIS1`, or
        `Nakaseomyces glabratus EIS1` experimental paper was found in the cached
        publications or in newer-paper searches.
