id: Q6FKB4
gene_symbol: EIS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  EIS1 is a predicted peripheral eisosome protein in Nakaseomyces glabratus.
  It belongs to the conserved fungal EIS1 branch that acts with
  Pil1/Lsp1-containing eisosomes at specialized plasma-membrane domains, but
  no direct N. glabratus EIS1 experiment has been reported.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      ACCEPT: the eisosome assembly role is inferable, but the direct EIS1
      molecular activity is unknown.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      Q6FKB4 is a PTHR28298:SF1 EIS1-family protein in the fungal PAINT node
      that carries eisosome localization and eisosome assembly. The
      well-characterized S. cerevisiae ortholog is needed for normal eisosome
      formation, but neither the N. glabratus protein nor its relatives have a
      defined molecular_function term beyond broad protein binding.
    additional_reference_ids:
    - file:CANGA/EIS1/EIS1-uniprot.txt
    - file:interpro/panther/PTHR28298/PTHR28298-paint.tsv
    - file:CANGA/EIS1/EIS1-notes.md
