  review:
    summary: >-
      This CGD molecular-function root row is an ND placeholder; no direct
      molecular activity has been established for C. glabrata TVP18.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      ACCEPT under the ND acceptance rule (projects/NO_DATA.md). The evidence
      this review cites for Golgi localization and vesicle-mediated transport
      is inferred from family membership and sequence features; none of it is
      literature on this gene product in this species. The gene's notes record
      PubMed and web searches that found no direct C. glabrata TVP18 functional
      paper, and the fungal TVP18 branch has no established molecular activity.
