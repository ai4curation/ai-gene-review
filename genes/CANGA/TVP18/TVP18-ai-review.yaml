knowledge_gaps:
- gap_statement: >-
    The molecular activity of fungal TVP18-family Golgi proteins is unknown.
  boundary: >-
    PAINT and UniProt support a conserved Golgi-membrane localization and broad
    vesicle-mediated transport role for ascomycete TVP18 proteins, while
    calcium-channel activity is only supported in metazoan Flower/CACFD1
    descendants.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving the activity will distinguish whether fungal TVP18 proteins use
    an ion-channel mechanism, a different transport activity, or a non-channel
    membrane-organizing mechanism at the Golgi.
  resolution: >-
    Direct ion-transport, electrophysiology, or purified-protein assays of
    fungal TVP18-family proteins, coupled to separation-of-function mutants
    tested for rescue of fungal Golgi or vesicle-trafficking phenotypes.
suggested_questions:
- question: >-
    What molecular activity, if any, do C. glabrata TVP18 and other fungal
    TVP18-family proteins perform at the Golgi membrane?
  experts: []
- question: >-
    Should the PTHR13314 GO:0005262 calcium channel activity IBD remain at
    opisthokont node PTN001779219, or should it be moved to a metazoan calcium
    channel node so it does not propagate to fungal TVP18 proteins?
  experts: []
suggested_experiments:
- experiment_type: Ion-transport and Golgi-rescue assays
  hypothesis: >-
    Fungal TVP18 proteins have a conserved membrane activity that is required
    for their Golgi trafficking role but is distinct from metazoan Flower
    calcium-channel activity.
  description: >-
    Express C. glabrata TVP18, S. cerevisiae Tvp18, and Drosophila Flower in a
    channel-deficient heterologous system or proteoliposomes, assay calcium and
    other ion flux directly, and test candidate pore or charged-residue mutants
    for rescue of fungal tvp18 Golgi morphology or vesicle-trafficking
    phenotypes.
