description: >-
  TVP18 encodes a conserved TVP18/calcium-channel Flower family multipass
  membrane protein of the fungal TVP18 branch. The Candida glabrata protein is
  inferred to act at the Golgi membrane in vesicle-mediated transport, but its
  direct molecular activity has not been determined.
