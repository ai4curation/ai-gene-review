  review:
    summary: >-
      Vesicle-mediated transport is a broad but defensible inherited process
      for C. glabrata TVP18.
    action: ACCEPT
    reason: >-
      Accept. The UniProt combined IEA mirrors the broad PTHR13314
      vesicle-mediated-transport PAINT placement at the opisthokont ancestor,
      seeded by Drosophila flower and by S. cerevisiae TVP18. S. cerevisiae
      Tvp18 is a Tlg2-containing Golgi/endosome membrane protein with
      Tvp/Yip-family interaction evidence, Q6FN38 is in the same
      PTHR13314:SF2 family, and no C. glabrata-specific evidence indicates
      loss of the fungal Golgi-trafficking role.
