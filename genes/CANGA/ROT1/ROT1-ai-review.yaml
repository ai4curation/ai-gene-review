id: Q6FKL3
gene_symbol: ROT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  ROT1 encodes the Candida glabrata ortholog of the fungal Rot1 ER membrane
  protein. Current GOA annotates this gene only by electronic transfer from
  the characterized S. cerevisiae protein and Rot1-family signatures. Those
  transfers are consistent with C. glabrata ROT1 being a conserved
  ER-associated chaperone or glycoprotein-maturation factor; the wall,
  glycosylation, actin-polarity, and bud-growth biological-process rows are
  plausible but downstream of that ER proteostasis role.
