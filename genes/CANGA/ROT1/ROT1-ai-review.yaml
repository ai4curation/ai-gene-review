      rather than this species. The C. glabrata biological-process aspect is
      therefore still experimentally dark.
    supported_by:
    - reference_id: file:CANGA/ROT1/ROT1-notes.md
      supporting_text: >-
        Newer-paper search: PMID:42042339 directly characterizes C. albicans
