  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  - InterPro:IPR019623
  - PANTHER:PTN001999060
  review:
    summary: The combined de novo protein-folding transfer is correct for C. glabrata ROT1.
    action: ACCEPT
    reason: >-
      The transfer agrees with the current InterPro Rot1 mapping and the
      conserved PTHR28090 PTN001999053 de novo folding IBD below Dikarya.
      Q6FKL3 is the C. glabrata Rot1 ortholog.
    additional_reference_ids:
    - PMID:18508919
    supported_by:
