        glabrata-specific Rot1 experimental paper was found.
- term:
    id: GO:0009272
    label: fungal-type cell wall biogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: Cell-wall biogenesis is a valid non-core Rot1 process transfer.
    action: KEEP_AS_NON_CORE
    reason: >-
      S. cerevisiae rot1 mutants have cell-wall defects, and reduced
      C. albicans ROT1 expression remodels the wall. Keep this as a
      downstream consequence of defective ER client maturation and
      glycosylation rather than as the primary Rot1 role.
    additional_reference_ids:
    - PMID:9545237
    - PMID:42042339
    supported_by:
    - reference_id: PMID:9545237
      supporting_text: >-
        rot1, rot2, big1, cwh41, gas1 and fks1 mutations all confer cell wall
        defects and suppress tor2(ts).
    - reference_id: PMID:42042339
      supporting_text: >-
        These results indicate that Rot1 depletion causes dramatic remodeling
        of the cell wall, with strong induction of chitin and β-glucan
        compensatory mechanisms and a reduction in mannose content.
- term:
    id: GO:0030950
    label: establishment or maintenance of actin cytoskeleton polarity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: Actin-polarity involvement is retained as a secondary SGD orthology transfer.
    action: KEEP_AS_NON_CORE
    reason: >-
      The S. cerevisiae source has a direct actin-polarity phenotype, but this
      is downstream of Rot1-dependent cell-wall and ER glycoprotein maturation.
      Keep the transfer for this close budding-yeast ortholog as non-core.
    additional_reference_ids:
    - PMID:17606994
    supported_by:
    - reference_id: PMID:17606994
      supporting_text: >-
        Rot1 is necessary to polarize actin cytoskeleton to the neck region at
        the end of mitosis.
- term:
    id: GO:0034975
    label: protein folding in endoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: ER protein folding is the best inherited biological process for C. glabrata ROT1.
    action: ACCEPT
    reason: >-
      The term combines the conserved ER membrane location with the conserved
