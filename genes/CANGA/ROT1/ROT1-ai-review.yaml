  title: C. glabrata ROT1 curation notes
core_functions:
- molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0034975
    label: protein folding in endoplasmic reticulum
  - id: GO:0006458
    label: '''de novo'' protein folding'
  - id: GO:0006487
    label: protein N-linked glycosylation
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  description: >-
    C. glabrata ROT1 is inferred to encode a conserved Rot1-family ER membrane
    protein folding chaperone or glycoprotein-maturation factor. The inference
    is based on the characterized S. cerevisiae Rot1 source, the functional
    C. albicans ROT1 ortholog, and membership in PTHR28090:SF1.
  supported_by:
  - reference_id: PMID:18508919
    supporting_text: >-
      Recombinant Rot1 exhibited antiaggregation activity in vitro, which was
      partly impaired by a temperature-sensitive rot1-2 mutation.
  - reference_id: PMID:42042339
    supporting_text: >-
      These results confirm that orf19.6029 encodes a functional homolog of
      Rot1 and that correct decoding of the CTG codon is essential for CaRot1
      activity in S. cerevisiae.
knowledge_gaps:
- gap_statement: >-
    C. glabrata ROT1 has no direct molecular-function assay; the
    protein-folding chaperone assignment is inferred from S. cerevisiae and
    C. albicans Rot1.
  boundary: >-
    Q6FKL3 is in the compact fungal Rot1 subfamily and the S. cerevisiae donor
    has antiaggregation and ER client-stability evidence, but C. glabrata ROT1
    itself has not been perturbed or purified.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    A direct assay would test whether the inferred chaperone activity is
    conserved in C. glabrata.
  resolution: >-
    Deplete ROT1 in C. glabrata and measure ER stress, client stability, and
    glycoprotein maturation, or purify Rot1 for antiaggregation assays.
  provenance:
  - reference_id: file:CANGA/ROT1/ROT1-notes.md
    supporting_text: >-
      Newer-paper search: PMID:42042339 directly characterizes C. albicans ROT1
      and supports conservation in the Candida branch; no C. glabrata-specific
      Rot1 experimental paper was found.
- gap_statement: >-
    No C. glabrata-specific biological-process evidence has established which
    ER folding, glycosylation, wall-assembly, polarity, or budding processes
    require ROT1 in this species.
  boundary: >-
    Existing C. glabrata process rows are inferred from the characterized
    S. cerevisiae ROT1 ortholog and are biologically plausible, especially
    after the C. albicans ROT1 study, but the target species remains untested.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    A direct perturbation would determine which inherited Rot1-family processes
    are conserved in C. glabrata.
  resolution: >-
    Construct a conditional ROT1 allele and assay ER-stress sensitivity,
    N-glycosylation, O-mannosylation, cell-wall composition, and bud growth.
  provenance:
  - reference_id: file:CANGA/ROT1/ROT1-notes.md
    supporting_text: >-
      Newer-paper search: PMID:42042339 directly characterizes C. albicans ROT1
      and supports conservation in the Candida branch; no C. glabrata-specific
      Rot1 experimental paper was found.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which C. glabrata glycoproteins or wall proteins are most sensitive to ROT1
    loss of function?
suggested_experiments:
- experiment_type: conditional repression and ER client profiling
  hypothesis: >-
    C. glabrata Rot1 supports maturation of a conserved subset of ER
    glycoprotein clients.
  description: >-
    Construct a repressible ROT1 allele and measure ER-stress sensitivity,
    N-glycan occupancy, cell-wall glycan composition, and secretory-pathway
    client stability after ROT1 depletion.
