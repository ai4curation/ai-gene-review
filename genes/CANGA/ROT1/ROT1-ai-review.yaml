    - PMID:18508919
    supported_by:
    - reference_id: PMID:16567426
      supporting_text: >-
        Rot1p was found to be an essential, ER-localized membrane protein facing
        the lumen.
    - reference_id: PMID:18508919
      supporting_text: >-
        Rot1 functions as a chaperone in vivo supporting the folding of those
        proteins.
- term:
    id: GO:0035269
    label: protein O-linked glycosylation via mannose
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: O-mannosylation is kept as a supported but secondary Rot1 transfer.
    action: KEEP_AS_NON_CORE
    reason: >-
      S. cerevisiae Rot1 perturbation affects O-mannosylation of selected
      glycoproteins. This process is plausible for the C. glabrata ortholog
      but likely secondary to the conserved ER chaperone or assembly-factor
      role.
    additional_reference_ids:
    - PMID:22492205
    supported_by:
    - reference_id: PMID:22492205
      supporting_text: >-
        Rot1 was found to be involved also in the O-mannosylation process, as
        the glycosylation of distinct glycoproteins of this type were affected.
