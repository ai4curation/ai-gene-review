- term:
    id: GO:0009272
    label: fungal-type cell wall biogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: Cell-wall biogenesis is a valid non-core Rot1 process transfer.
    action: KEEP_AS_NON_CORE
    reason: >-
      S. cerevisiae rot1 mutants have cell-wall defects, and reduced
      C. albicans ROT1 expression remodels the wall. Keep this as a
      downstream consequence of defective ER client maturation and
      glycosylation rather than as the primary Rot1 role.
    additional_reference_ids:
    - PMID:9545237
    - PMID:42042339
    supported_by:
    - reference_id: PMID:9545237
      supporting_text: >-
        rot1, rot2, big1, cwh41, gas1 and fks1 mutations all confer cell wall
        defects and suppress tor2(ts).
    - reference_id: PMID:42042339
      supporting_text: >-
        These results indicate that Rot1 depletion causes dramatic remodeling
        of the cell wall, with strong induction of chitin and β-glucan
        compensatory mechanisms and a reduction in mannose content.
