suggested_questions:
- question: >-
    Which C. glabrata glycoproteins or wall proteins are most sensitive to ROT1
    loss of function?
suggested_experiments:
- experiment_type: conditional repression and ER client profiling
  hypothesis: >-
    C. glabrata Rot1 supports maturation of a conserved subset of ER
    glycoprotein clients.
  description: >-
    Construct a repressible ROT1 allele and measure ER-stress sensitivity,
    N-glycan occupancy, cell-wall glycan composition, and secretory-pathway
    client stability after ROT1 depletion.
