- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: The SGD orthology transfer to protein folding is appropriate.
    action: ACCEPT
    reason: >-
      Protein folding is the broad parent of the de novo ER protein-folding
      role propagated by PTHR28090 and InterPro, and it is supported by the
      direct S. cerevisiae Rot1 antiaggregation and ERAD client-stability data.
    additional_reference_ids:
