    reason: >-
      The reviewed record now carries an EnsemblFungi electronic transfer to
      protein folding chaperone from the characterized S. cerevisiae Rot1
      ortholog. Q6FKL3 is a single PTHR28090:SF1 Rot1 member, so a no-data
      molecular-function placeholder no longer represents the state of GOA.
    additional_reference_ids:
