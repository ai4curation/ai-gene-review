id: Q6FKL3
gene_symbol: ROT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  ROT1 encodes the Candida glabrata ortholog of the fungal Rot1 ER membrane
  protein, a conserved Rot1-family factor inferred from the characterized
  S. cerevisiae and C. albicans orthologs to support ER protein folding and
  glycoprotein maturation.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      The CGD no-data molecular-function placeholder still reflects the lack
      of C. glabrata-specific molecular-function assays for ROT1.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      GOA infers a protein-folding chaperone molecular function from
      S. cerevisiae ROT1, but no C. glabrata ROT1 paper was found. The
      molecular-function aspect is therefore still experimentally dark for
      this gene.
    supported_by:
    - reference_id: file:CANGA/ROT1/ROT1-notes.md
      supporting_text: >-
        Newer-paper search: PMID:42042339 directly characterizes C. albicans
        ROT1 and supports conservation in the Candida branch; no C.
        glabrata-specific Rot1 experimental paper was found.
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR019623
  review:
    summary: The InterPro ER transfer is consistent with Rot1-family biology.
    action: ACCEPT
    reason: >-
      IPR019623 is the Rot1 family entry, and the generic ER term is consistent
      with the more specific ER membrane location of characterized
      S. cerevisiae Rot1.
    additional_reference_ids:
    - PMID:16567426
    supported_by:
    - reference_id: PMID:16567426
      supporting_text: >-
        Rot1p was found to be an essential, ER-localized membrane protein facing
        the lumen.
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  - UniProtKB-SubCell:SL-0097
  - PANTHER:PTN001999060
  review:
    summary: The UniProt combined electronic ER-membrane call is sound.
    action: ACCEPT
    reason: >-
      The Q03691/S. cerevisiae ROT1 source has direct ER membrane evidence, and
      C. glabrata ROT1 is the corresponding PTHR28090:SF1 ortholog with no
      evidence of target-specific relocalization.
    additional_reference_ids:
    - PMID:16567426
    supported_by:
    - reference_id: PMID:16567426
      supporting_text: >-
        Rot1p was found to be an essential, ER-localized membrane protein facing
        the lumen.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: The SGD orthology transfer to protein folding is appropriate.
    action: MODIFY
    reason: >-
      Protein folding is the broad parent of the more informative
      GO:0034975 ER protein-folding role already transferred from the same
      S. cerevisiae source, and the Rot1-family evidence specifically places
      the process at the ER.
    proposed_replacement_terms:
    - id: GO:0034975
      label: protein folding in endoplasmic reticulum
    additional_reference_ids:
    - PMID:18508919
    supported_by:
    - reference_id: PMID:18508919
      supporting_text: >-
        Recombinant Rot1 exhibited antiaggregation activity in vitro, which was
        partly impaired by a temperature-sensitive rot1-2 mutation.
- term:
    id: GO:0006458
    label: '''de novo'' protein folding'
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  - InterPro:IPR019623
  - PANTHER:PTN001999060
  review:
    summary: The combined de novo protein-folding transfer is correct for C. glabrata ROT1.
    action: ACCEPT
    reason: >-
      The transfer agrees with the current InterPro Rot1 mapping and the
      conserved PTHR28090 PTN001999053 de novo folding IBD below Dikarya.
      Q6FKL3 is the C. glabrata Rot1 ortholog.
    additional_reference_ids:
    - PMID:18508919
    supported_by:
    - reference_id: PMID:18508919
      supporting_text: >-
        Rot1 functions as a chaperone in vivo supporting the folding of those
        proteins.
- term:
    id: GO:0006487
    label: protein N-linked glycosylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: >-
      The S. cerevisiae orthology transfer to N-glycosylation is plausible for
      this Saccharomycetales Rot1 ortholog.
    action: ACCEPT
    reason: >-
      S. cerevisiae Rot1 physically interacts with Ost3 and supports N-linked
      glycosylation, and the C. albicans ortholog now has direct conditional
      evidence for N-glycosylation defects. This transfer is therefore a
      plausible core ER maturation process for C. glabrata ROT1.
    additional_reference_ids:
    - PMID:22492205
    - PMID:42042339
    supported_by:
    - reference_id: PMID:22492205
      supporting_text: >-
        OST activity in vitro determined in membranes from rot1-1ost3Δ cells
        was found to be decreased to 45% compared with wild-type membranes.
    - reference_id: PMID:42042339
      supporting_text: >-
        These results indicate that limited Rot1 expression impairs
        N-glycosylation in C. albicans.
- term:
    id: GO:0007118
    label: budding cell apical bud growth
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  - PANTHER:PTN001999060
  review:
    summary: >-
      Budding-cell apical growth is retained as a Saccharomycetales-specific
      downstream Rot1 process.
    action: KEEP_AS_NON_CORE
    reason: >-
      C. glabrata is within the budding-yeast clade covered by the
      PTN001999057 PTHR28090 IBD. The term reflects morphogenesis downstream
      of Rot1-dependent ER folding and wall assembly rather than Rot1's core
      molecular role.
    additional_reference_ids:
    - PMID:17606994
    supported_by:
    - reference_id: PMID:17606994
      supporting_text: >-
        First, it is required for the maintenance of apical growth during bud
        growth.
- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: The CGD no-data biological-process placeholder is stale.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: >-
      C. glabrata ROT1 has only inferred biological-process rows transferred
