- term:
    id: GO:0006487
    label: protein N-linked glycosylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  review:
    summary: >-
      The S. cerevisiae orthology transfer to N-glycosylation is plausible for
      this Saccharomycetales Rot1 ortholog.
    action: ACCEPT
    reason: >-
      S. cerevisiae Rot1 physically interacts with Ost3 and supports N-linked
      glycosylation, and the C. albicans ortholog now has direct conditional
      evidence for N-glycosylation defects. This transfer is therefore a
      plausible core ER maturation process for C. glabrata ROT1.
    additional_reference_ids:
    - PMID:22492205
    - PMID:42042339
    supported_by:
    - reference_id: PMID:22492205
      supporting_text: >-
        OST activity in vitro determined in membranes from rot1-1ost3Delta cells
        was found to be decreased to 45% compared with wild-type membranes.
    - reference_id: PMID:42042339
      supporting_text: >-
        These results indicate that limited Rot1 expression impairs
        N-glycosylation in C. albicans.
- term:
    id: GO:0007118
    label: budding cell apical bud growth
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03691
  - sgd:YMR200W
  - PANTHER:PTN001999060
  review:
    summary: >-
      Budding-cell apical growth is retained as a Saccharomycetales-specific
      downstream Rot1 process.
    action: KEEP_AS_NON_CORE
    reason: >-
      C. glabrata is within the budding-yeast clade covered by the
      PTN001999057 PTHR28090 IBD. The term reflects morphogenesis downstream
      of Rot1-dependent ER folding and wall assembly rather than Rot1's core
      molecular role.
    additional_reference_ids:
    - PMID:17606994
    supported_by:
    - reference_id: PMID:17606994
      supporting_text: >-
        First, it is required for the maintenance of apical growth during bud
        growth.
