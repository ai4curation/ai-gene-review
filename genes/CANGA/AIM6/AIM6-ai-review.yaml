suggested_questions:
- question: >-
    Should the GO:0008081 phosphoric diester hydrolase row stay MARK_AS_OVER_ANNOTATED? A structural
    analysis finds the metal-binding carboxylates Glu147, Asp149 and Asp232 geometrically competent against
    two unrelated reference enzymes, the axial pocket matching glycerophosphodiester phosphodiesterase
    sites rather than inositol-phosphate ones, and the catalytic positions the most conserved part of the
    domain across 150 fungal and 150 bacterial genera, and argues the term is better supported than its
    IEA provenance suggests, with GO:0008889 as a more specific candidate at prediction level. No activity
    has ever been assayed for this protein, which is what the current action reflects.
- question: Does C. glabrata AIM6 have phosphodiesterase activity, and if so what
    substrate and compartment does it use?
- question: Is the predicted N-terminal signal peptide cleaved, and does AIM6 enter
    the ER, Golgi, vacuole or cell surface?
suggested_experiments:
- hypothesis: C. glabrata AIM6 is a secretory-pathway phosphodiesterase with a substrate
    distinct from fungal Rtt109-family histone acetyltransferases.
  description: Tag the endogenous protein to determine localization and signal-peptide
    processing, purify the predicted mature domain, and assay candidate phosphodiesters
    including glycerophosphodiesters and phosphoinositide-like substrates with catalytic-site
    mutants as controls.
  experiment_type: localization / in vitro enzyme assay
knowledge_gaps:
- gap_statement: C. glabrata AIM6 has no established molecular function or biological
    role.
  boundary: >-
    An OpenScientist run (kgap-aim6-fold-competence) answers the question in this gap's significance
    clause, whether the apparent PLC-like fold is active or whether the subfamily has diverged into
    something non-catalytic, and the answer is competent. It also excludes the degenerate-relic reading
    outright. Targeted superposition of the predicted structure gives TM-scores of 0.618 against a
    Thermus thermophilus glycerophosphodiester phosphodiesterase, 0.559 against the rat PLC-delta1
    catalytic barrel, 0.433 and 0.400 against two bacterial phosphodiesterases, and 0.327 against a
    generic barrel control, but only 0.247 against Candida albicans Rtt109, which is the score two
    unrelated proteins give each other. So AIM6 is not a decayed version of the acetyltransferase fold
    at any level structure can detect, despite sharing PANTHER family PTHR31571 with Rtt109 on sequence
    grounds, and the local record carries that family assignment together with the AIM6-specific Pfam
    domain. The active site survives three independent tests. Carrying the crystallographic calcium from
    two unrelated reference structures into the AIM6 frame puts the same three carboxylates on the
    metal, Asp149 at 1.65 to 1.93 Angstrom, Asp232 at 2.49 to 2.95 and Glu147 at 2.60 to 3.91,
    reproducing the i, i+2 Glu/Asp spacing that both reference enzymes use; all three residues are
    confirmed in the local Q6FWH9 record, which is 411 residues. An enclosed cavity of 89 cubic Angstrom
    sits at the barrel axis, lined by 23 residues with five acidic against two basic and a Coulomb
    potential of -6.16, which under one protocol applied to six structures places AIM6 with the
    glycerophosphodiester phosphodiesterase sites and away from the electropositive inositol-phosphate
    sites of the eukaryotic and bacterial phospholipases. And the catalytic positions are the most
    conserved part of the domain across the whole family, at 79.1 per cent identity against a 31.8 per
    cent background in 150 fungal genera and 49.3 against 21.0 in 150 bacterial genera, both at
    permutation p = 2.0e-4. What the run does not settle is where the protein acts, and it is explicit
    about why: every signal-peptide call across AIM6 orthologs carries sequence-analysis evidence only,
    an independent topology run was refused by the server, and no AIM6 protein in any organism has a
    measured subcellular location, while SGD assigns no-biological-data to the S. cerevisiae ortholog in
    all three aspects. The local record's own signal annotation at 1..29 is a prediction on the same
    footing. One disagreement with this review needs recording rather than resolving here. The run holds
    that phosphoric diester hydrolase activity should be retained and is better supported than its IEA
    provenance suggests, and it offers glycerophosphodiester phosphodiesterase activity as a more
    specific candidate at prediction level; this review marks the diester hydrolase row as
    over-annotated. The two positions rest on different things: the review's action reflects that no
    activity has ever been assayed for this protein, while the run's rests on an intact and selected
    site. Nothing was changed here, because flipping an action on the strength of one computational
    analysis is a curator's call and the underlying measurement still does not exist; the conflict is
    recorded as a suggested question so it is visible at the point of decision. The run agrees with this
    review that the lipid metabolic process row is the weaker of the two and that no cellular-component
    term should be asserted.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: NARROWING
  significance: AIM6 is conserved in the PTHR31571 family but lies outside the fungal
    RTT109 HAT node; resolving its substrate would test whether the apparent PLC-like
    fold is active or whether this subfamily has diverged into a non-catalytic secretory
    protein.
  resolution: Localize the protein and test purified AIM6 against a panel of candidate
    phosphodiester substrates with active-site mutants.
  provenance:
