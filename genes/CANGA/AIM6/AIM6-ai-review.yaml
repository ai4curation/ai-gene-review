gene_symbol: AIM6
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: Candida glabrata AIM6 is a predicted secretory-pathway precursor in the
  fungal AIM6 subfamily of PTHR31571. Unlike the RTT109 subfamily in the same PANTHER
  family, AIM6 proteins lack the Rtt109/KAT11 histone acetyltransferase domain and
  instead contain a divergent PLC-like phosphodiesterase TIM-barrel fold. No molecular
  activity, substrate, subcellular location or physiological role has been demonstrated
  for the C. glabrata protein.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Standard InterPro2GO reference. UniProt maps C. glabrata AIM6 to
      phosphoric diester hydrolase activity and lipid metabolic process through the
      broad PLC-like phosphodiesterase superfamily; by analogy to the S. cerevisiae
      AIM6 review, those are plausible but unproven fold-level predictions rather
      than demonstrated functions.
