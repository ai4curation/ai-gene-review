status: IN_PROGRESS
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: Candida glabrata AIM6 is a predicted secretory-pathway precursor in the
  fungal AIM6 subfamily of PTHR31571. Unlike the RTT109 subfamily in the same PANTHER
  family, AIM6 proteins lack the Rtt109/KAT11 histone acetyltransferase domain and
  instead contain a divergent PLC-like phosphodiesterase TIM-barrel fold. No molecular
  activity, substrate, subcellular location or physiological role has been demonstrated
  for the C. glabrata protein.
references:
- id: file:CANGA/AIM6/AIM6-hypotheses/kgap-aim6-fold-competence/openscientist.md
  title: OpenScientist test of whether the AIM6 PLC-like barrel is a competent active site or a decayed fold
  findings:
  - statement: >-
      AIM6 is a genuine glycerophosphodiester-phosphodiesterase-subtype TIM barrel with an intact,
      geometrically competent metal site at its axis, and it has no detectable structural relationship
      to Rtt109, so the degenerate-relic reading is excluded rather than merely unsupported; the
      subcellular location remains unmeasured in any organism.
    supporting_text: >-
      The same model scores **0.247 against *Candida albicans* Rtt109 (7BX0)**, which is the score two
      unrelated proteins give each other.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified. Verified
      locally against Q6FWH9: 411 residues with Glu147, Asp149 and Asp232 as stated, the PTHR31571 family
      and AIM6 Pfam cross-references the fold argument uses, protein-existence level 3, and a SIGNAL
      annotation at 1..29 that is itself a prediction, consistent with the run's point that every
      signal-peptide call rests on sequence analysis. Not verified: the TM-scores and superpositions, the
      metal-transfer distances, the cavity volume and electrostatics, the six-structure protocol, and the
      150-genus conservation statistics. The run disagrees with this review about the GO:0008081 action;
      that disagreement is recorded in the boundary and as a suggested question rather than acted on,
      since no activity has been assayed and flipping an action on one computational analysis is a
      curator's call. No annotation action was changed.
