id: Q6FVF9
gene_symbol: ERF4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  ERF4 encodes the Candida glabrata ortholog of S. cerevisiae Shr5/Erf4, the
  inferred accessory subunit of a conserved Saccharomycotina
  ER-associated Erf2 Ras palmitoyltransferase complex.
existing_annotations:
- term:
    id: GO:0002178
    label: palmitoyltransferase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN001777141
  review:
    summary: The generic TreeGrafter palmitoyltransferase-complex row should use the ER-specific child.
    action: MODIFY
    reason: >-
      Q6FVF9 is the C. glabrata member of the PTHR13254:SF0 fungal
      Erf4/GOLGA7 subfamily, and the row is biologically sound as a parent
      term. The same TreeGrafter node already assigns the more specific
      ER-palmitoyltransferase complex term, so this generic parent should be
      refined to that child. Nakaseomyces glabratus sits in the close
      Saccharomycotina scope where the family review treats the ER-specific
      term as likely sound, unlike the unresolved fission-yeast recipient.
    proposed_replacement_terms:
    - id: GO:0031211
      label: endoplasmic reticulum palmitoyltransferase complex
    additional_reference_ids:
    - PMID:12193598
    supported_by:
    - reference_id: PMID:12193598
      supporting_text: >-
        Erf2p co-purifies with Erf4p (26 kDa) when it is expressed in yeast or
        in Escherichia coli.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN001777141
        source_status: SUPPORTS_TRANSFER
        comment: >-
          TreeGrafter placed this row on an Erf4/GOLGA7 branch absent from the
          local PAINT slice; that placement supports the child
          ER-palmitoyltransferase complex term as the specific
          Saccharomycotina complex.
- term:
    id: GO:0005789
