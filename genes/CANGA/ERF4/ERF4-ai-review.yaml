suggested_questions:
- question: >-
    Is C. glabrata ERF4 ER-localized with the catalytic Erf2 ortholog under the
    growth conditions where Ras palmitoylation occurs?
suggested_experiments:
- experiment_type: localization and Ras acylation assay
  hypothesis: C. glabrata Erf4 forms an ER Ras palmitoyltransferase with Erf2.
  description: >-
    Tag endogenous ERF4 and the DHHC partner, monitor their localization, and
    compare Ras palmitoylation in wild-type and erf4 mutant cells.
