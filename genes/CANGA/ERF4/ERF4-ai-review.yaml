  review:
    summary: UniProtKB-SubCell places ERF4 at the ER membrane.
    action: ACCEPT
    reason: >-
      The electronic row agrees with close S. cerevisiae orthology and with
      the ER-specific complex propagated to the fungal Erf4 branch.
    additional_reference_ids:
    - PMID:12379641
    supported_by:
    - reference_id: PMID:12379641
      supporting_text: >-
        In this report, we show that Erf4p is localized on the endoplasmic
        reticulum as a peripheral membrane protein in a complex with Erf2p, an
        integral membrane protein that was identified from the same genetic
        screen.
