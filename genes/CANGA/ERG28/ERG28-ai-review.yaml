id: Q6FPM3
gene_symbol: ERG28
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: ERG28 encodes the Nakaseomyces glabratus member of the conserved Erg28 family of
  small multi-pass ER membrane proteins. It is the ortholog of budding-yeast Erg28, which
  scaffolds sterol C-4 demethylation enzymes in the ergosterol pathway.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: The CGD no-data molecular-function placeholder marks a true C. glabrata ERG28 literature
      gap.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: Combined automated annotation and S. cerevisiae orthology support a conserved Erg28
      protein-scaffold activity, but no C. glabrata-specific publication was found that directly tests
      ERG28 molecular function.
    supported_by:
    - reference_id: file:genes/CANGA/ERG28/ERG28-notes.md
      supporting_text: Searches for `"Candida glabrata" ERG28`, `Q6FPM3`, and `CAGL0J02684g`
        found no direct C. glabrata ERG28 experiments.
    knowledge_gaps:
    - gap_statement: The molecular function of C. glabrata ERG28 has not been experimentally
        tested in C. glabrata.
      boundary: Orthology to S. cerevisiae ERG28 and PTHR15451/SF19 membership support a
        likely conserved protein-scaffold activity, but current molecular-function assertions
        are transfers from other organisms.
      gap_kind:
      - BIOLOGY
      dark_aspect: MF_DARK
