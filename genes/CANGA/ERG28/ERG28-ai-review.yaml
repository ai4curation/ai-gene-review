suggested_questions:
- question: Does C. glabrata Erg28 physically bridge Erg25, Erg26 and Erg27, and is it required for
    efficient C-4 demethylation in vivo?
suggested_experiments:
- hypothesis: C. glabrata ERG28 is the ER scaffold of the sterol C-4 demethylation complex.
  description: Pair Erg28 co-immunoprecipitation against Erg25/Erg26/Erg27 with sterol profiling after
    ERG28 deletion or depletion.
  experiment_type: protein interaction / sterol profiling
