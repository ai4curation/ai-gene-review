  label: Nakaseomyces glabratus CBS 138
description: ERG28 encodes the Candida glabrata member of the conserved Erg28 family of small multi-pass
  ER membrane proteins. It is the ortholog of budding-yeast Erg28, which scaffolds sterol C-4 demethylation
  enzymes in the ergosterol pathway, and carries the same PTHR15451:SF19 family assignment.
