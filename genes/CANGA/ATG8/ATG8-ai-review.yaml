id: Q6FXR8
gene_symbol: ATG8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: Candida glabrata ATG8 encodes a conserved ATG8-family ubiquitin-like modifier
  that is proteolytically processed to expose a C-terminal glycine and conjugated to phosphatidylethanolamine
  on autophagic membranes. CgAtg8 supports macroautophagy and iron-starvation mitophagy through
  the conserved fungal Atg8 lipidation cycle, localizing with phagophore, autophagosome and
  vacuolar membranes during autophagic delivery to the vacuole.
