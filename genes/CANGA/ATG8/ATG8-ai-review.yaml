- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P38182
  - sgd:YBL078C
  review:
    summary: The mitochondrial autophagy transfer is supported by direct C. glabrata mitophagy
      work.
    action: ACCEPT
    reason: Accept. Iron depletion induces selective mitochondrial autophagy in C. glabrata
      and induces CgATG8 expression alongside the mitophagy receptor gene CgATG32. The evidence
      is strongest for mitophagy as a conserved Atg8-dependent selective autophagy route rather
      than for a C. glabrata-specific regulatory role of Atg8.
