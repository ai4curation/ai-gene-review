id: Q6FXR8
gene_symbol: ATG8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: Candida glabrata ATG8 encodes a conserved ATG8-family ubiquitin-like modifier
  that is proteolytically processed to expose a C-terminal glycine and conjugated to phosphatidylethanolamine
  on autophagic membranes. CgAtg8-PE formation has been observed during nutrient stress,
  and the protein is inferred from conserved fungal Atg8 biology to support macroautophagy
  and selective routes such as mitophagy by localizing to phagophore, autophagosome and
  vacuolar membranes during delivery to the vacuole.
