- id: file:CANGA/ACH1/ACH1-uniprot.txt
  title: UniProt flat file for C. glabrata ACH1
  findings:
  - statement: Q6FPF3 is C. glabrata ACH1 and belongs to PTHR43609.
    supporting_text: 'DR   PANTHER; PTHR43609; ACETYL-COA HYDROLASE; 1.'
  - statement: UniProt propagates a mammalian-style function statement to fungal C. glabrata ACH1.
    supporting_text: fatty acid and cholesterol synthesis
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      The PANTHER cross-reference and GO cross-references identify Q6FPF3 as
      C. glabrata ACH1, but the electronically inferred function and cytoplasm
      comments include the same historical hydrolase/cholesterol carryover
      caveats seen on sibling fungal ACH1 records.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q6FPF3
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: >-
        Presumably involved in regulating the intracellular acetyl-CoA pool for
        fatty acid and cholesterol synthesis and fatty acid oxidation.
      confidence: CONFIRMED
      explanation: >-
        The FUNCTION text says C. glabrata Ach1 is presumably involved in
        fatty acid and cholesterol synthesis. C. glabrata is an
        ergosterol-producing fungus, and S. cerevisiae Ach1 was recharacterized
        as a CoA-transferase that moves CoA from succinyl-CoA to acetate, with
        only minor acetyl-CoA hydrolase activity, acting in mitochondrial
        acetate detoxification rather than cholesterol synthesis.
      supported_by:
      - reference_id: PMID:19298859
        supporting_text: >-
          Ach1p showed highest specific activity for the CoASH transfer from
          succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase
          activity.
      - reference_id: PMID:19298859
        supporting_text: >-
          Thereby, Ach1p does not perform the energy wasting hydrolysis of
          acetyl-CoA but conserves energy by the detoxification of
          mitochondrial acetate.
