- id: PMID:19298859
  title: 'Re-characterisation of Saccharomyces cerevisiae Ach1p: fungal CoA-transferases
    are involved in acetic acid detoxification.'
  findings:
  - statement: S. cerevisiae Ach1 is primarily a succinyl-CoA:acetate CoA-transferase, not an acetyl-CoA hydrolase.
    supporting_text: Ach1p showed highest specific activity for the CoASH transfer from succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
  - statement: S. cerevisiae Ach1p acts in mitochondrial acetate detoxification by CoA transfer.
    supporting_text: Our results imply that Ach1p is involved in mitochondrial acetate detoxification by a CoASH transfer from succinyl-CoA to acetate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; the abstract directly reports re-characterization of
      S. cerevisiae Ach1 enzymatic activity and mitochondrial acetate
      detoxification.
