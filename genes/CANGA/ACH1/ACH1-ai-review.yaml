  title: Role of acetyl coenzyme A synthesis and breakdown in alternative carbon source utilization in Candida albicans.
  findings:
  - statement: Candida albicans ACH1 is functionally conserved with S. cerevisiae ACH1 in a heterologous complementation assay.
    supporting_text: Expression of Ca ACH1 or Sc ACH1 restored growth to a comparable level in the Sc ach1Δ strain
    reference_section_type: RESULTS
  reference_review:
