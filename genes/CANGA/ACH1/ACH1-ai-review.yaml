  label: Nakaseomyces glabratus CBS 138
description: ACH1 encodes a fungal Ach1/CoaT-family acyl-CoA:carboxylate CoA-transferase. By orthology to experimentally characterized Saccharomyces cerevisiae Ach1, Candida albicans Ach1, and Aspergillus nidulans CoaT, the enzyme is predicted to transfer CoASH between succinyl-, propionyl-, and acetyl-CoA donors and acetate or related carboxylates, supporting compartmentalized acetate and acyl-CoA metabolism.
