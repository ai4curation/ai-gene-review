id: Q6FPF3
gene_symbol: ACH1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  ACH1 encodes a conserved fungal acetyl-CoA hydrolase/transferase-family
  enzyme inferred to act mainly in mitochondrial acetate metabolism. By
  orthology to experimentally characterized Saccharomyces cerevisiae Ach1 and
  Aspergillus nidulans CoaT, the dominant activity is expected to be
  succinyl-CoA:acetate CoA transfer, with acetyl-CoA hydrolysis retained as a
  minor side activity.
existing_annotations:
- term:
    id: GO:0003986
    label: acetyl-CoA hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00088767
  - UniProtKB:P32316
  - sgd:YBL015W
  - RHEA:20289
  - EC:3.1.2.1
  - PANTHER:PTN000484605
  review:
    summary: >-
      The automated EC/Rhea/ARBA/PANTHER hydrolase call captures the historical
      EC 3.1.2.1 assignment, but fungal Ach1 proteins are now best described as
      succinyl-CoA:acetate CoA-transferases with minor hydrolase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The EC:3.1.2.1/RHEA:20289 inference is consistent with the older
      acetyl-CoA hydrolase description and with the residual hydrolase activity
      measured for S. cerevisiae Ach1p. Fleck and Brock nevertheless showed
      that the highest S. cerevisiae Ach1p activity is CoASH transfer from
      succinyl-CoA to acetate, so the hydrolase term should be retained as
      secondary rather than treated as the core ACH1 activity.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >-
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
- term:
    id: GO:0008410
    label: CoA-transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003702
  review:
    summary: >-
      Correct but broad InterPro2GO parent activity for the fungal Ach1-family
      acetate CoA-transferase.
    action: TOO_GENERAL
    reason: >-
      IPR003702 marks the shared acetyl-CoA hydrolase/transferase N-terminal
      domain, and later enzymology supports fungal Ach1 proteins as
      CoA-transferases. GO:0008775 acetate CoA-transferase activity is the more
      specific molecular function for C. glabrata ACH1.
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: >-
        Complementation of an ach1 mutant with the coaT gene reversed the growth
        defect on acetate confirming the in vivo function of Ach1p as a
        CoA-transferase.
    - reference_id: file:CANGA/ACH1/ACH1-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: Belongs to the acetyl-CoA hydrolase/transferase family.
- term:
    id: GO:0008775
    label: acetate CoA-transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P32316
  - sgd:YBL015W
  - InterPro:IPR046433
  - PANTHER:PTN000484605
  review:
    summary: >-
      The combined UniProt/InterPro/PANTHER inference of acetate
      CoA-transferase activity is the best molecular-function assignment for
      C. glabrata ACH1.
    action: ACCEPT
    reason: >-
      Q6FPF3 is annotated as the C. glabrata ACH1 ortholog and inherits this
      activity electronically from the characterized S. cerevisiae Ach1p
      protein. The transferase term is appropriate despite the record's
      historical EC:3.1.2.1 hydrolase assignment because Fleck and Brock
      re-characterized fungal Ach1 as predominantly a
      succinyl-CoA:acetate CoA-transferase.
    additional_reference_ids:
    - GO_REF:0000033
    - PMID:19298859
    supported_by:
    - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
      supporting_text: "PTHR43609\tPTN000484586\tGO:0008775\tF\tIBD\tfalse\tSGD:S000000111|UniProtKB:Q5BD33\ttaxon:\t20220925"
    - reference_id: PMID:19298859
      supporting_text: >-
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
- term:
    id: GO:0006083
    label: acetate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00084769
  - UniProtKB:P32316
  - sgd:YBL015W
  - InterPro:IPR046433
  - PANTHER:PTN000484605
  review:
    summary: >-
      The automated acetate-metabolism annotation is consistent with ACH1
      catalyzing CoASH transfer to acetate in the conserved fungal pathway.
    action: ACCEPT
    reason: >-
      Fungal Ach1 proteins catalyze a direct CoA-transfer step using acetate as
      the carboxylate acceptor, and S. cerevisiae Ach1p was re-characterized as
      a mitochondrial acetate-detoxification enzyme. The C. glabrata row is an
      automated orthology transfer, but it agrees with the PAINT placement of
      acetate metabolic process on the Ach1 node seeded by S. cerevisiae and
      C. albicans.
    additional_reference_ids:
    - GO_REF:0000033
    - PMID:19298859
    supported_by:
    - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
      supporting_text: "PTHR43609\tPTN000484586\tGO:0006083\tP\tIBD\tfalse\tCGD:CAL0000189008|SGD:S000000111\ttaxon:\t20170228"
    - reference_id: PMID:19298859
      supporting_text: >-
        Our results imply that Ach1p is involved in mitochondrial acetate
        detoxification by a CoASH transfer from succinyl-CoA to acetate.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >-
      UniProt propagates a broad cytoplasm statement to C. glabrata ACH1, but
      the physiologically central fungal Ach1 pool is expected to be
      mitochondrial.
    action: TOO_GENERAL
    reason: >-
      The Q6FPF3 UniProt record's electronically inferred cytoplasm statement
      maps to a cellular-component parent that is broader than the accepted
      mitochondrial site and the retained secondary cytosol row. Buu et al.
      found that S. cerevisiae Ach1p is predominantly mitochondrial with only a
      small cytoplasmic pool, so this high-level UniProtKB-SubCell mapping adds
      no useful location specificity.
    additional_reference_ids:
    - PMID:12606555
    supported_by:
    - reference_id: file:CANGA/ACH1/ACH1-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250}.'
    - reference_id: PMID:12606555
      supporting_text: >-
        By subcellular fractionation, most of the Ach1p in yeast was
        distributed with mitochondria and little Ach1p in the cytoplasm.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026962
  - UniProtKB:P32316
  - sgd:YBL015W
  - PANTHER:PTN000484605
  review:
    summary: >-
      The combined IEA mitochondrial assignment agrees with the Ascomycota
      PAINT mitochondrion node and the fungal Ach1 acetate-detoxification
      model.
    action: ACCEPT
    reason: >-
      Q6FPF3 inherits mitochondrion electronically from S. cerevisiae Ach1, and
      PAINT places mitochondrion on the Ascomycota PTN000484602 node supported
      by fungal Ach1/CoaT descendants. This matches the biochemical
      interpretation that fungal Ach1 detoxifies mitochondrial acetate by CoA
      transfer.
    additional_reference_ids:
    - GO_REF:0000033
    - PMID:19298859
    supported_by:
    - reference_id: file:interpro/panther/PTHR43609/PTHR43609-paint.tsv
      supporting_text: "PTHR43609\tPTN000484602\tGO:0005739\tC\tIBD\tfalse\tCGD:CAL0000189008|SGD:S000000111|UniProtKB:Q5BD33\ttaxon:4890\t20260130"
    - reference_id: PMID:19298859
      supporting_text: >-
        Our results imply that Ach1p is involved in mitochondrial acetate
        detoxification by a CoASH transfer from succinyl-CoA to acetate.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P32316
  - sgd:YBL015W
  review:
    summary: >-
      EnsemblFungi transfers a cytosol row from S. cerevisiae Ach1 to
      C. glabrata ACH1; this is plausible as a secondary location rather than
      the main fungal Ach1 site.
    action: KEEP_AS_NON_CORE
    reason: >-
      The GO_REF:0000107 row transfers cytosol from the experimentally grounded
      S. cerevisiae ACH1 donor P32316/YBL015W. Buu et al. found that most
      S. cerevisiae Ach1p cofractionates with mitochondria but a small fraction
      remains in the cytoplasm, so cytosol is plausible as a secondary
      C. glabrata ACH1 location while mitochondrion remains the main inferred
      site.
    additional_reference_ids:
    - PMID:12606555
    supported_by:
    - reference_id: PMID:12606555
      supporting_text: >-
        By subcellular fractionation, most of the Ach1p in yeast was
        distributed with mitochondria and little Ach1p in the cytoplasm.
- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: >-
      CGD no-data root cellular-component placeholder recording the absence of
      C. glabrata-specific manual localization.
    action: ACCEPT
    nd_case: INFERABLE
    reason: >-
      No direct C. glabrata ACH1 localization paper was found, so the CGD ND
      placeholder correctly records the lack of manual species-specific
      evidence. Mitochondrion is still inferable by electronic orthology and
      fungal PAINT.
    supported_by:
    - reference_id: file:CANGA/ACH1/ACH1-notes.md
      supporting_text: >-
        I searched PubMed/web for `"Q6FPF3" ACH1 "Candida glabrata"` and
        `"CAGL0J04268g" ACH1` on 2026-11-17. I found product pages and
        Swiss-Prot/EnsemblFungi-derived records but no newer primary C.
        glabrata ACH1 biochemical or localization paper.
