  review:
    summary: ACH1 is a member of the fungal PTHR43609/SF1 Ach1/CoaT family, and PAINT places acetate CoA-transferase activity on the ancestral node that contains the C. glabrata protein.
    action: NEW
    reason: The inherited acetate CoA-transferase assertion is better aligned with the experimentally re-characterized yeast enzyme than the older acetyl-CoA hydrolase name; Q6FPF3 is in the same PANTHER subfamily as S. cerevisiae Ach1 and A. nidulans CoaT.
    supported_by:
