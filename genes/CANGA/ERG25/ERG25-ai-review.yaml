id: Q6FMX4
gene_symbol: ERG25
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  Nakaseomyces glabratus ERG25 encodes a PTHR11863 C-4 sterol methyl oxidase
  of the fungal ergosterol pathway. C. glabrata ERG25 is required for normal
  sterol composition and for host-serum cholesterol uptake through
  Aus1-associated sterol-rich plasma-membrane domains, and CRISPR deletion
  experiments identify ERG25 as important for survival of pathogenic Candida
  yeasts in the host.
