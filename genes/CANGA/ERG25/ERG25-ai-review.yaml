  review:
    summary: >-
      Ensembl Compara transfer from S. cerevisiae Erg25. C. glabrata Erg25 is
      a PTHR11863 sterol-desaturase-family member, and direct C. glabrata
      knockdown/deletion studies support the C-4 methylsterol oxidase role.
    action: ACCEPT
