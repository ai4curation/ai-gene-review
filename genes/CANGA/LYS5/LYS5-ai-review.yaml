- term:
    id: GO:0009085
    label: L-lysine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Proposed new annotation. The fungal PTN000954835 PAINT node places
      L-lysine biosynthesis on the LYS5/PptA clade, and Q6FV34 is in the
      corresponding SF10 subfamily.
    action: NEW
    reason: C. glabrata Lys5 participates in lysine biosynthesis by installing
      the phosphopantetheine prosthetic group required for the
      alpha-aminoadipate reductase step. This is the same cofactor-contribution
      role annotated to S. cerevisiae LYS5, S. pombe lys7, C. albicans LYS5 and
      A. fumigatus PptA.
    supported_by:
    - *paint_lysine
    - *panther_entry
    - reference_id: PMID:11717270
      supporting_text: The PPTase in the CLD2 extract was required only for the
        activation of Lys2p and not for AAR reaction.
    - reference_id: PMID:12892891
      supporting_text: The LYS2 and LYS5 genes of the pathogenic yeast Candida
        albicans are required for the alpha-aminoadipate reductase (AAR) reaction
        in the lysine biosynthetic pathway.
- term:
    id: GO:0018215
    label: protein phosphopantetheinylation
  evidence_type: ISO
  original_reference_id: PMID:12892891
  qualifier: involved_in
  review:
    summary: Proposed new annotation. Fungal Lys5-family proteins execute this
      reaction by transferring the 4'-phosphopantetheine arm of CoA onto the
      alpha-aminoadipate reductase carrier domain.
    action: NEW
    reason: Lys5 is the enzyme that performs the protein-modification step, so
      the term passes the participation test rather than resting only on mutant
      auxotrophy. GO:0018215 names the chemistry more directly than generic
      GO:0051604 protein maturation.
    supported_by:
    - *activity_support
    - reference_id: PMID:11717270
      supporting_text: The phosphopantetheinylation reaction is catalyzed by a
        phosphopantetheinyl transferase which transfers a 4′-phosphopantetheine
        group from CoA to a specific serine residue of the posttranslational
        activation domain
    - reference_id: PMID:12892891
      supporting_text: The LYS2 encodes an apo-AAR (Lys2p) and the LYS5 encodes
        a phosphopantetheinyl transferase (PPTase) for the post-translational
        activation of AAR.
