- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008278
  - InterPro:IPR037143
  review:
    summary: InterPro ACPS-domain inference of Mg2+ binding. Q6FV34 has the
      conserved 4'-phosphopantetheinyl transferase domain, whose homologs use
      Mg2+ in the CoA-dependent transferase reaction, but metal binding is a
      cofactor property rather than the core function itself.
    action: KEEP_AS_NON_CORE
    reason: The domain evidence supports the conserved PPTase cofactor-binding
      site; the central activity of Lys5 is transfer of a CoA-derived
      phosphopantetheine moiety to carrier proteins.
    supported_by:
    - reference_id: file:CANGA/LYS5/LYS5-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: 'DR   InterPro; IPR008278; 4-PPantetheinyl_Trfase_dom.'
