  label: Nakaseomyces glabratus CBS 138
description: 'Lys5 is the Candida glabrata Sfp/AcpS-family 4''-phosphopantetheinyl
  transferase. It transfers the 4''-phosphopantetheine moiety of coenzyme A to
  carrier-domain serines, a modification needed to activate alpha-aminoadipate
  reductase for fungal lysine biosynthesis.'
