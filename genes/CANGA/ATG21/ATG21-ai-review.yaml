- term:
    id: GO:0034727
    label: piecemeal microautophagy of the nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q02887
  - sgd:YPL100W
  review:
    summary: Atg21 contributes to piecemeal microautophagy of the nucleus in S. cerevisiae.
    action: KEEP_AS_NON_CORE
    reason: Keep as non-core. PMN is a cargo-specific selective-autophagy role supported directly in
      budding yeast, but it is not the conserved PROPPIN core.
    supported_by:
