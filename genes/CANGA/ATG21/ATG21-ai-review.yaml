gene_symbol: ATG21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: 'Atg21 is a fungal PROPPIN beta-propeller phosphoinositide-binding protein in the Atg18 family.
  It binds PI3P-rich membranes, helps recruit and organize the Atg8 lipidation machinery at the phagophore
  assembly site for Cvt cargo delivery, and in budding yeast also forms a retromer-associated complex
  with vacuole-fission activity.'
