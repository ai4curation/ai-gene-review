- term:
    id: GO:0016050
    label: vesicle organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q02887
  - sgd:YPL100W
  review:
    summary: Atg21 affects Cvt vesicle formation and retromer-associated vacuole fission.
    action: KEEP_AS_NON_CORE
    reason: Keep as non-core. Vesicle organization is broad, but direct Atg21 experiments support
      Cvt vesicle formation and the newer Atg21-retromer vacuole-fission role.
    supported_by:
    - reference_id: PMID:42135947
      supporting_text: The Atg21-retromer shows vacuole fission activity, which requires both
        retromer binding residues and the membrane-bending activity of its loop 6 C/D.
      reference_section_type: ABSTRACT
- term:
    id: GO:0016236
    label: macroautophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q02887
  - sgd:YPL100W
  review:
    summary: Atg21 contributes to efficient starvation autophagy in budding yeast but is not a core
      macroautophagy factor.
    action: MARK_AS_OVER_ANNOTATED
    reason: Budding-yeast Atg21 is essential for Cvt vesicle formation and enhances
      starvation-induced autophagic flux, but the macroautophagy phenotype is partial and
      cargo-contextual compared with the Cvt/PAS Atg8-lipidation core.
    supported_by:
    - reference_id: PMID:15194695
      supporting_text: Quantitative measurement of autophagy in starving atg21Delta cells showed
        only 35% of the wild-type rate.
      reference_section_type: ABSTRACT
- term:
    id: GO:0032258
    label: cytoplasm to vacuole targeting by the Cvt pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q02887
  - sgd:YPL100W
  review:
    summary: Atg21 is required for efficient Cvt vesicle formation.
    action: ACCEPT
    reason: Accept. Atg21 is required for efficient Cvt cargo delivery and for PI3P-dependent
      organization of Atg8 lipidation at the PAS.
    supported_by:
    - reference_id: PMID:15155809
      supporting_text: The activity of Atg18 is vital for all forms of autophagy, whereas Atg21 is
        required for the Cvt pathway but not for nitrogen starvation-induced autophagy.
      reference_section_type: ABSTRACT
