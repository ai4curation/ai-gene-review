- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q02887
  - sgd:YPL100W
  review:
    summary: Atg21 has direct, non-core mitophagy evidence in S. cerevisiae.
    action: KEEP_AS_NON_CORE
    reason: Keep as non-core. Budding-yeast Atg21 was implicated in a genome-wide mitophagy screen,
      but mitophagy is a cargo-specific Atg21 role rather than the conserved PROPPIN lipid-adaptor
      core.
    supported_by:
    - reference_id: PMID:19793921
      supporting_text: A genome-wide yeast mutant screen for mitophagy-defective strains identified
        32 mutants with a block in mitophagy
      reference_section_type: ABSTRACT
