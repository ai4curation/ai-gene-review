description: Candida glabrata ERG7 is the Saccharomycetales lanosterol synthase ortholog in
  PANTHER:PTHR11764:SF20. Its sequence classification, conserved EC/RHEA mapping, and transfer
  from the characterized S. cerevisiae and C. albicans ERG7 enzymes support the same cyclization
  of (S)-2,3-epoxysqualene to lanosterol in ergosterol biosynthesis.
