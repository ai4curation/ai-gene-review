  review:
    summary: >-
      Phosphatidylserine binding is a plausible transferred lipid-binding
      property of Mon1-Ccz1.
    action: KEEP_AS_NON_CORE
    reason: >-
      The yeast Mon1-Ccz1 complex binds acidic membranes, and lipid-strip assays
      detected phosphatidylserine binding by isolated Mon1. That supports
      membrane recruitment of the Rab7/Ypt7 GEF complex rather than a separate
      core activity for the C. glabrata protein.
    additional_reference_ids:
    - PMID:24413168
    supported_by:
    - reference_id: PMID:24413168
      supporting_text: >-
        When blots were probed for Mon1 or Ccz1, we observed strong
        interactions with PI3P, PI5P and phosphatidylserine (PS).
