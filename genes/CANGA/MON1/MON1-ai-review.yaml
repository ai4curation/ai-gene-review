- id: PMID:12364329
  title: The Ccz1-Mon1 protein complex is required for the late step of multiple
    vacuole delivery pathways.
  findings:
  - statement: >-
      S. cerevisiae Mon1 and Ccz1 form a stable complex that acts in multiple
      routes delivering cargo to the vacuole.
    supporting_text: >-
      Subcellular fractionation and co-immunoprecipitation experiments confirm
      that Mon1 and Ccz1 physically interact as a stable protein complex termed
      the Ccz1-Mon1 complex.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; direct S. cerevisiae seed behind the fungal PTN000989606
      PAINT placements.
- id: PMID:12387888
  title: Yeast Mon1p/Aut12p functions in vacuolar fusion of autophagosomes and
    cvt-vesicles.
  findings:
  - statement: >-
      S. cerevisiae Mon1 is required for Cvt and autophagy vesicle fusion with
      the vacuole and can localize to the cytosol.
    supporting_text: >-
      Our data demonstrate that mon1Delta cells are defective in the fusion of
      cvt-vesicles and autophagosomes with the vacuole.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; useful route-level and cytosol source evidence for
      S. cerevisiae MON1 transfers.
- id: PMID:20797862
  title: The Mon1-Ccz1 complex is the GEF of the late endosomal Rab7 homolog Ypt7.
  findings:
  - statement: Yeast Mon1-Ccz1 is the dimeric GEF for Rab7/Ypt7.
    supporting_text: >-
      We now provide evidence that the dimeric Mon1-Ccz1 complex is the
      Rab7/Ypt7 GEF.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; establishes the complex-level Rab7/Ypt7 GEF activity
      transferred to fungal Mon1 members.
- id: PMID:24413168
  title: The Mon1-Ccz1 GEF activates the Rab7 GTPase Ypt7 via a longin-fold-Rab
    interface and association with PI3P-positive membranes.
  findings:
  - statement: >-
      S. cerevisiae Mon1 and Ccz1 both contribute longin-domain surfaces to Ypt7
      nucleotide exchange.
    supporting_text: >-
      Mon1-Ccz1 activity requires residues within the predicted longin domains
      of both subunits
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; direct biochemical support for the contributes_to GEF
      activity and lipid-binding interpretation.
- id: PMID:37463208
  title: Regulatory sites in the Mon1-Ccz1 complex control Rab5 to Rab7 transition
    and endosome maturation.
  findings:
  - statement: >-
      The Mon1 N-terminus intramolecularly autoinhibits Rab5-dependent
      Mon1-Ccz1 activity on membranes.
    supporting_text: >-
      We show that the intrinsically disordered N-terminal domain of Mon1
      autoinhibits Rab5-dependent GEF activity on membranes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached; explains why the inherited GO:1990624 row is
      over-annotated.
- id: PMID:40864718
  title: Mechanistic adaptation of the metazoan RabGEFs Mon1-Ccz1 and
    Fuzzy-Inturned.
  findings:
  - statement: >-
      The fungal Mon1-Ccz1 dimer binds acidic membranes through the Mon1 side of
      the complex, whereas metazoan complexes use an auxiliary subunit.
    supporting_text: >-
      we quantitatively show that fungal Mon1-Ccz1 robustly interacts with
      lipids, whereas metazoan Mon1-Ccz1 and Inturned-Fuzzy complexes do not.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text cached; newer mechanistic context for the Mon1-Ccz1
      membrane-recruitment model but not a direct C. glabrata assay.
