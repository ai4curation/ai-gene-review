id: Q6FU19
gene_symbol: MON1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  Candida glabrata MON1 encodes a conserved Mon1/SAND-family longin-domain
  protein in the fungal PTHR13027:SF7 Mon1 subfamily. By descent from
  characterized fungal Mon1 proteins, it is expected to act with Ccz1 on
  endosomal and fungal-type vacuole membranes as part of the Mon1-Ccz1 complex,
  a Rab7/Ypt7-directed guanyl-nucleotide exchange factor that promotes
  endosome-to-vacuole and autophagy-related delivery to the vacuole.
existing_annotations:
- term:
    id: GO:0000329
    label: fungal-type vacuole membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P53129
  - sgd:YGL124C
  - PANTHER:PTN000315090
  review:
    summary: >-
      UniProt's combined automated row places C. glabrata MON1 at the
      fungal-type vacuole membrane.
    action: ACCEPT
    reason: >-
      This is the organism-appropriate vacuolar membrane term for a fungal Mon1
      protein. Q6FU19 is a PTHR13027:SF7 Mon1-family member, and the PAINT
      cache places the same fungal-type vacuole membrane assertion on the
      fungal Mon1 node PTN000989606 from the S. cerevisiae MON1 seed.
    additional_reference_ids:
    - PMID:12364329
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: >-
        Microscopy of Ccz1 and Mon1 tagged with a fluorescent marker indicated
        that the Ccz1-Mon1 complex peripherally associated with a perivacuolar
        compartment and may attach to the vacuole membrane in agreement with
        their proposed function in fusion.
