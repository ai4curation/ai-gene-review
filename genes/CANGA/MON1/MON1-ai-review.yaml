- term:
    id: GO:1990624
    label: guanyl nucleotide exchange factor inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P53129
  - sgd:YGL124C
