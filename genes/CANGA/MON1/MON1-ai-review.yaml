    supported_by:
    - reference_id: PMID:20797862
      supporting_text: >-
        The Mon1-Ccz1 complex, but neither protein alone, counteracts GAP
        function in vivo, rescues in vitro fusion of vacuoles carrying Ypt7-GDP,
        and promotes nucleotide exchange on Ypt7 independently of Vps39/HOPS.
