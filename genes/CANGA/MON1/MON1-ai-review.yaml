  - sgd:YGL124C
  review:
    summary: >-
      MON1 is inferred to contribute to Mon1-Ccz1 Rab7/Ypt7 GEF activity.
    action: ACCEPT
    reason: >-
      The contributes_to qualifier is correct because the exchange activity
      resides in the Mon1-Ccz1 heterodimer rather than in isolated Mon1. Yeast
      Mon1-Ccz1 promotes Ypt7 nucleotide exchange, both subunits' longin domains
      contribute to activity, and Q6FU19 is in the conserved fungal Mon1
      subfamily.
    additional_reference_ids:
    - PMID:20797862
