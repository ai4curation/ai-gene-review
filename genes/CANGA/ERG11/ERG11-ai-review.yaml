taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: ERG11 encodes the Candida glabrata lanosterol 14-alpha-demethylase, a heme-thiolate cytochrome
  P450 of the fungal ergosterol pathway. The enzyme removes the 14alpha-methyl group from lanosterol in an
  ER-membrane-associated NADPH-cytochrome P450 reductase reaction; ERG11 depletion or deletion lowers ergosterol
  production, causes lanosterol and methylated-sterol accumulation, and changes azole susceptibility.
