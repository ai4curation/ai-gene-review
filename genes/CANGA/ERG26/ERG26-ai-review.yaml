knowledge_gaps:
- gap_statement: C. glabrata Erg26 has not been directly localized or tested for C-4 demethylation complex membership.
  boundary: >-
    C. glabrata ERG26 belongs to the fungal Erg26/NSDHL PANTHER branch and has electronic ER-membrane and
    catalytic-complex transfers from S. cerevisiae, but the cached literature does not tag, fractionate, image or
    co-purify C. glabrata Erg26 itself.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Direct localization or pulldown evidence would distinguish C. glabrata-specific Erg26 placement from conserved
    S. cerevisiae inference.
