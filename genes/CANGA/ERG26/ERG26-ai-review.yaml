taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: ERG26 encodes the Candida glabrata ortholog of sterol-4-alpha-carboxylate 3-dehydrogenase/C-4
  decarboxylase, an NAD(P)-dependent 3-beta-HSD-family enzyme inferred to catalyze oxidative decarboxylation
  of 4-alpha-carboxysterols to 3-keto sterols during C-4 demethylation in ergosterol biosynthesis. The protein
  belongs to PTHR43245:SF51 and is predicted to act at the ER membrane with the Erg25-Erg26-Erg27-Erg28
  demethylation complex.
