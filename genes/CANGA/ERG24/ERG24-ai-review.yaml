description: ERG24 encodes the Candida glabrata Delta14-sterol reductase, a predicted multi-pass ERG4/ERG24-family membrane
  enzyme that is orthologous to C. albicans and S. cerevisiae Erg24 and is inferred to reduce the C14=C15 double bond of a
  demethylated sterol intermediate in the ergosterol pathway.
