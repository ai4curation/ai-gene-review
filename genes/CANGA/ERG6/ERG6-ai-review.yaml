- term:
    id: GO:0044858
    label: plasma membrane raft polarization
  evidence_type: IMP
  original_reference_id: PMID:39477913
  qualifier: involved_in
  review:
    summary: >-
      The 2025 erg6 deletion study measured C. glabrata sterol and
      phospholipid composition, transmembrane potential, and sensitivity to
      sphingolipid-biosynthesis inhibitors. These phenotypes show that ERG6
      affects membrane lipid composition, but the enzyme itself performs a
      zymosterol methylation step upstream of plasma-membrane raft organization.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Erg6 supplies the ergosterol precursor pool; the cached paper measured
      transmembrane potential rather than raft polarization, and the term is
      downstream of the core biosynthetic activity.
    supported_by:
    - reference_id: PMID:39477913
      supporting_text: >-
        Our findings revealed a depletion of ergosterol, increased zymosterol
        and eburicol content
