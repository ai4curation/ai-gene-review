id: Q6FRZ7
gene_symbol: ERG6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  ERG6 (CAGL0H04653g) encodes the Candida glabrata sterol 24-C-methyltransferase,
  a class I-like SAM-dependent Erg6/SMT-family enzyme in the late ergosterol
  pathway. The enzyme is inferred to transfer a methyl group from
  S-adenosyl-L-methionine to C-24 of zymosterol to form fecosterol. Clinical
  ERG6 loss-of-function alleles and engineered erg6 deletion reduce ergosterol
  and alter membrane composition, drug tolerance, cell-wall stress resistance,
  weak-acid resistance, oxidative-stress tolerance, iron homeostasis, and
  virulence phenotypes.
