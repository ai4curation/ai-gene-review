suggested_questions:
- question: >-
    Does C. glabrata Erg6 localize to lipid droplets as well as the ER, or is
    the lipid-droplet pool inferred from S. cerevisiae absent in this yeast?
- question: >-
    Which pathway or residual methyltransferase activity accounts for the low
    ergosterol and elevated eburicol observed after ERG6 deletion?
suggested_experiments:
- hypothesis: C. glabrata Erg6 partitions between the ER and lipid droplets.
  description: >-
    Tag ERG6 at the native locus and compare Erg6 localization with ER and
    lipid-droplet markers in untreated cells and after azole or polyene stress.
  experiment_type: fluorescence microscopy
- hypothesis: C. glabrata produces trace ergosterol in an erg6 deletion strain through an alternative eburicol route.
  description: >-
    Use isotope-labelled lanosterol, zymosterol, and eburicol feeding with
    GC-MS or LC-MS/MS sterol profiling, plus candidate methyltransferase
    knockouts, to test which intermediates bypass the canonical Erg6 step.
  experiment_type: sterol flux analysis
