description: Candida glabrata Atg18 is the predicted fungal Atg18 PROPPIN phosphoinositide
  effector. By orthology to characterized fungal Atg18 proteins, it is expected to bind PI3P
  and PI(3,5)P2 and to act as a peripheral membrane adaptor at phagophore, vacuolar and endosomal
  membranes.
