id: Q6FMQ0
gene_symbol: PPN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  PPN1 encodes the Candida glabrata Ppn1 endopolyphosphatase-family enzyme, a
  predicted type-II vacuolar membrane protein whose luminal catalytic domain is
  inferred to hydrolyze inorganic polyphosphate. By orthology to the
  experimentally characterized Saccharomyces cerevisiae Ppn1 and by placement in
  the fungal PANTHER Ppn1 clade, the protein is expected to perform both
  internal and chain-end cleavage of vacuolar polyphosphate as part of
  polyphosphate catabolism.
