suggested_questions:
- question: >-
    Does C. glabrata Ppn1 generate a cytosolic high-molecular-mass
    exopolyphosphatase form analogous to the S. cerevisiae protein, or is it
    restricted to the vacuolar membrane and vacuolar lumen?
- question: >-
    Does C. glabrata Ppn1 enter nuclei or affect nuclear polyphosphatase
    activity, or is the inferred nuclear row an S. cerevisiae-specific or
    unresolved transfer?
suggested_experiments:
- hypothesis: >-
    C. glabrata Ppn1 hydrolyzes long-chain vacuolar polyphosphate by both endo-
    and exopolyphosphatase modes.
  description: >-
    Delete or epitope-tag PPN1 in C. glabrata, measure vacuolar polyphosphate
    chain length by polyacrylamide gel electrophoresis, and assay purified
    full-length or proteolytically processed Ppn1 with long-chain polyphosphate
    substrates and divalent cations.
  experiment_type: biochemical genetics
