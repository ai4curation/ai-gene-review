- term:
    id: GO:0030437
    label: ascospore formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q04734
  - sgd:YMR063W
  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: the meiotic yeast RIM9 output should not be
      transferred as a core N. glabratus process.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This EnsemblFungi row transfers the S. cerevisiae RIM9 sporulation
      phenotype to N. glabratus. Ambient-pH Rim101 signaling is the conserved
      PalI/Rim9-family theme, but ascospore formation is a yeast meiotic
      output; there is no N. glabratus-specific evidence that Q6FU42 executes
      or is required for this developmental process.
