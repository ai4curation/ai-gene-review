proposed_new_terms: []
suggested_questions:
- question: >-
    Does N. glabratus RIM9 occupy the plasma membrane uniformly, or does it
    enrich at division or polarized growth sites under alkaline pH or stress
    conditions?
- question: >-
    Is Q6FU42 required for Rim101 cleavage and alkaline-pH transcriptional
    responses in N. glabratus, and does that requirement mirror the short Rim9
    proteins of S. cerevisiae and C. albicans?
suggested_experiments:
- description: >-
    Endogenously tag N. glabratus RIM9 and image it with plasma-membrane,
    bud-neck, and growing-tip markers before and after alkaline shift.
  experiment_type: live-cell fluorescence microscopy
- description: >-
    Delete or deplete RIM9 in N. glabratus and assay Rim101 proteolytic
    processing, pH-responsive transcription, alkaline-pH growth, and
    signal-induced internalization of the upstream sensor module.
  experiment_type: pH-response mutant assay
knowledge_gaps:
- gap_statement: >-
    The direct molecular activity, pathway requirement, and polarized
    localization of N. glabratus RIM9 are unknown.
  boundary: >-
    Cross-species and UniProt evidence place Q6FU42 in the PalI/Rim9 family
    and infer an ambient-pH signaling role, but CGD currently has only ND
    manual rows for the gene and no experiment has directly localized or
    depleted N. glabratus RIM9.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
