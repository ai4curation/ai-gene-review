    RIM9 is inferred to be a PalI/Rim9-family multipass plasma-membrane protein
    associated with fungal Rim101 ambient-pH signaling; no N. glabratus
    experiment has resolved its direct molecular activity or tested whether it
    occupies polarized cortical subdomains.
