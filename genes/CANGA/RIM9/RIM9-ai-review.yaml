id: Q6FU42
gene_symbol: RIM9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  RIM9 is a predicted PalI/Rim9-family multipass cell-membrane protein in
  Nakaseomyces glabratus. By homology to the S. cerevisiae Rim9 and
  C. albicans RIM9 proteins it is likely an upstream accessory component of
  the fungal Rim101 ambient-pH signaling machinery, but its direct molecular
  activity and polarized localization have not been tested in N. glabratus.
existing_annotations:
- term:
    id: GO:0000328
    label: fungal-type vacuole lumen
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q04734
  - sgd:YMR063W
  review:
    summary: >-
      KEEP_AS_NON_CORE: this S. cerevisiae transfer is plausible after alkaline
      internalization, but vacuole delivery is not the core Rim9 site.
    action: KEEP_AS_NON_CORE
    reason: >-
      The EnsemblFungi row is transferred from the close S. cerevisiae
      ortholog. Yeast Rim9-GFP can move from the plasma membrane to the
      vacuolar lumen after alkaline treatment, so the location is plausible for
      N. glabratus RIM9, but it represents signal-induced turnover rather than
      the primary plasma-membrane site of the Rim101 sensor module.
    additional_reference_ids:
    - PMID:23019326
    supported_by:
    - reference_id: PMID:23019326
      supporting_text: >-
        After 20 min of alkaline treatment, significant fractions of
        Rim21–2×GFP and Dfg16/Rim9-GFP moved to the vacuolar lumen and
        intracellular punctuates reminiscent of the endosome
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      ACCEPT: the PalI/Rim9 family role is inferable, but no direct elemental
      molecular activity is known for N. glabratus RIM9.
    action: ACCEPT
    reason: >-
      UniProt and PANTHER place Q6FU42 in the fungal PalI/Rim9 family, and
      close S. cerevisiae, C. albicans, and Aspergillus relatives function in
      ambient-pH signaling, but the direct activity of this multipass accessory
      protein remains unknown. CGD's root molecular_function ND row is
      therefore still accurate.
    additional_reference_ids:
    - file:CANGA/RIM9/RIM9-uniprot.txt
    - PMID:22381911
    supported_by:
