    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The broader PTN001997363 growing-cell-tip row is seeded by S. pombe
      proteins, not by a short budding-yeast Rim9 protein. PMID:36601911
      directly tested the closest budding-yeast polarized-growth state and
      found that the SF3 protein Dcv1 sits away from the pheromone-response
      growth front, while C. glabrata has a haploid budding-yeast morphology
      and is unable to produce filaments under normal culture conditions. The
      row is therefore an over-specific cortical sublocalization transfer for
      N. glabratus RIM9.
