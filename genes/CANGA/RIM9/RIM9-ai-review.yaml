      supporting_text: "DR   PANTHER; PTHR28013:SF3; PROTEIN DCV1-RELATED; 1."
    - reference_id: PMID:22381911
      supporting_text: >-
        The Rim9/PalI groups of proteins are members of the Sur7 family, all of
        which contain a signal sequence and a block of three potential
        trans-membrane helices.
