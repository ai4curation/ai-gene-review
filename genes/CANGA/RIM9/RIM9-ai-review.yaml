- term:
    id: GO:0030437
    label: ascospore formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q04734
  - sgd:YMR063W
  review:
    summary: >-
      REMOVE: EnsemblFungi should not transfer yeast ascospore formation to
      the asexual N. glabratus RIM9 protein.
    action: REMOVE
    reason: >-
      This EnsemblFungi row transfers the S. cerevisiae RIM9 sporulation
      phenotype to N. glabratus. Ambient-pH Rim101 signaling is the conserved
      PalI/Rim9-family theme, but ascospore formation is a yeast meiotic output
      and C. glabrata has only been observed as haploid cells with no
      documented sexual cycle. The orthology transfer is therefore inapplicable
      rather than merely untested.
    additional_reference_ids:
    - PMID:18375614
    supported_by:
    - reference_id: PMID:18375614
      supporting_text: >-
        Only haploid cells are ever isolated, but C. glabrata strains of both
        mating types are commonly found, the type strain being MAT alpha and
        most other strains, such as BG2, being MATa. No sexual cycle has been
        documented for this species.
    source_defects:
    - defect_type: WRONG_TERM
      resource: ENSEMBL
      slot: GO_term
      requested_change: DELETE_ROW
      asserted_value: GO:0030437
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        The EnsemblFungi IEA transfers S. cerevisiae RIM9 ascospore formation
        to N. glabratus RIM9, but the target species has only been observed as
        haploid cells and has no documented sexual cycle; the row should be
        deleted unless EnsemblFungi has target-species evidence for ascospore
        formation in N. glabratus.
      supported_by:
      - reference_id: PMID:18375614
        supporting_text: >-
          Only haploid cells are ever isolated, but C. glabrata strains of both
          mating types are commonly found, the type strain being MAT alpha and
          most other strains, such as BG2, being MATa. No sexual cycle has been
          documented for this species.
