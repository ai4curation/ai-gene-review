id: Q6FN68
gene_symbol: EAF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: Eaf3 is a nuclear MRG-family chromatin protein in Nakaseomyces
  glabratus, historically Candida glabrata. It has an N-terminal
  Tudor-knot/chromo-like module and a C-terminal MRG interaction domain and is
  inferred to act in the conserved fungal Eaf3 branch of the NuA4 histone
  acetyltransferase, Rpd3S histone deacetylase, and Eaf5/7/3/TINTIN chromatin
  complexes that couple RNA polymerase II-associated chromatin to histone H3K36
  methylation-dependent acetylation control.
