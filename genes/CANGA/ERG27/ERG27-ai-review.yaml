description: ERG27 encodes the Candida glabrata Erg27 3-keto-steroid reductase, a predicted NADPH-dependent short-chain dehydrogenase/reductase in the fungal Erg27 subfamily. By orthology to characterized budding-yeast and C. albicans Erg27 enzymes, it is expected to reduce 3-keto sterol intermediates during the C-4 demethylation reactions of ergosterol biosynthesis.
