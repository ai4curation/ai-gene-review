description: ERG27 encodes a predicted Nakaseomyces glabratus Erg27 3-keto-steroid reductase in the fungal Erg27 subfamily of short-chain dehydrogenases/reductases. Its curated EC/Rhea activity and orthology to budding-yeast and Candida albicans Erg27 support a role in reducing 3-keto sterol intermediates during the sterol C-4 demethylation steps of ergosterol biosynthesis.
