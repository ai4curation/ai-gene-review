  title: Protein-protein interactions among C-4 demethylation enzymes involved in yeast sterol biosynthesis.
  findings:
  - statement: Budding-yeast Erg27 is membrane-associated and located in the endoplasmic reticulum.
    supporting_text: Green fluorescent protein-fusion protein localization studies showed that Erg26p, Erg27p, and Erg28p are all located in the endoplasmic reticulum.
  - statement: Budding-yeast Erg27 is a component of the Erg25-Erg26-Erg27-Erg28 sterol C-4 demethylation complex.
    supporting_text: a complex containing Erg25p/Erg26p/Erg27p/Erg28p was identified
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; budding-yeast donor-side evidence supports the ER and catalytic-complex rows transferred to Q6FIV3 by EnsemblFungi and UniProt.
- id: PMID:12842197
  title: In yeast sterol biosynthesis the 3-keto reductase protein (Erg27p) is required for oxidosqualene cyclase (Erg7p) activity.
  findings:
  - statement: Budding-yeast Erg27 is mainly an ER component with a detectable lipid-particle pool.
    supporting_text: While Erg27p is essentially a component of the ER, it can also be detected in LPs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; the budding-yeast lipid-particle result supports the inherited fungal Erg27 lipid-droplet annotation and argues against mitochondrial-outer-membrane over-propagation.
- id: PMID:15552648
  title: Isolation, characterization, and regulation of the Candida albicans ERG27 gene encoding the sterol 3-keto reductase.
  findings:
  - statement: C. albicans ERG27 encodes the sterol 3-keto reductase required for sterol C-4 demethylation.
    supporting_text: required for sterol C-4 demethylation
  - statement: Repressing C. albicans ERG27 caused loss of both Erg27 and Erg7 sterol-biosynthesis activities.
    supporting_text: complete loss of both 3-keto reductase and oxidosqualene cyclase
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; direct C. albicans ERG27 evidence supports the Candida/Nakaseomyces Erg27 orthology call but is not direct N. glabratus evidence.
