    label: cellular response to xenobiotic stimulus
  evidence_type: IMP
  original_reference_id: PMID:15215098
  qualifier: involved_in
  review:
    summary: >-
      The Cgerg1 mutant was azole- and terbinafine-sensitive, and
      complementation restored wild-type drug susceptibility, but these
      phenotypes follow sterol-pathway perturbation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Erg1 is a squalene epoxidase in ergosterol biosynthesis; the mutation's
      altered antifungal susceptibility does not show that the enzyme executes a
      xenobiotic-response program.
