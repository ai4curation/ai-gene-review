id: O13306
gene_symbol: ERG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  ERG1 (CAGL0D05940g) encodes the Candida glabrata squalene epoxidase, a
  conserved FAD-dependent squalene monooxygenase in the PTHR10835:SF0 family.
  This ER-membrane enzyme oxidizes squalene to 2,3-epoxysqualene, the
  lanosterol synthase substrate in the ergosterol biosynthetic pathway.
  Disrupting the 3-prime end of CgERG1 reduces ergosterol, accumulates
  squalene, changes antifungal susceptibility, and makes growth under low
  oxygen dependent on exogenous sterol uptake.
