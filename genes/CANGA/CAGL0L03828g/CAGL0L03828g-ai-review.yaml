id: Q6FLF4
gene_symbol: CAGL0L03828g
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  CAGL0L03828g encodes the Nakaseomyces glabratus microsomal cytochrome b5, a
  small predicted endoplasmic-reticulum membrane hemoprotein. It is the ortholog
  of S. cerevisiae CYB5 and C. albicans CYB5 and carries the conserved
  cytochrome-b5 heme-binding domain and a hydrophobic C terminus consistent
  with a membrane anchor. Direct deletion work in an azole-resistant clinical
  background showed that CYB5 promotes ergosterol biosynthesis, limits
  methylated-sterol accumulation under fluconazole stress, and helps sustain
  resistance to fluconazole and voriconazole.
