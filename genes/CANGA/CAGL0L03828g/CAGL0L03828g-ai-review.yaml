knowledge_gaps:
- gap_statement: >-
    The subcellular localization and membrane topology of N. glabratus Cyb5 have
    not been directly measured.
  boundary: >-
    PTHR19359:SF150 membership, conserved cytochrome-b5 architecture, and
    orthology to S. cerevisiae Cyb5 support an ER/microsomal membrane
    assignment, while the 2026 deletion study establishes the ergosterol
    phenotype without localizing the protein.
  gap_kind:
  - BIOLOGY
