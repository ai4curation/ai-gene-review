  status: OPEN
suggested_questions:
- question: >-
    What are the relative electron-donor contributions of Ncp1 and Cyb5 to
    Erg11 and Erg5 in N. glabratus during basal growth and azole stress?
suggested_experiments:
- description: >-
    Reconstitute N. glabratus Cyb5 with Cbr1, Ncp1, Erg11 and Erg5 in vitro and
    combine the assay with cyb5/ncp1 conditional perturbations plus GC-MS sterol
    profiling under fluconazole stress.
