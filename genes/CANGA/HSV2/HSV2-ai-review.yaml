description: 'Hsv2 is a fungal PROPPIN beta-propeller phosphoinositide-binding protein in the Atg18 family.
  It belongs to the Saccharomycotina Hsv2 branch and is inferred by orthology to bind PI3P/PI(3,5)P2-family
  phosphoinositides at phagophore and endosomal membranes.'
