- term:
    id: GO:0009277
    label: fungal-type cell wall
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P36051
  - sgd:YKL165C
  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: the donor phenotype is downstream cell-wall
      assembly, not Mcd4 localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The S. cerevisiae donor paper reports that an ssu21/mcd4 mutation affects
      transport and incorporation of the Bgl2p cell-wall protein. That is a
      downstream consequence of defective GPI-anchor synthesis rather than
      evidence for conserved localization of MCD4 itself to the fungal cell wall.
    additional_reference_ids:
    - PMID:12023081
    supported_by:
    - reference_id: PMID:12023081
      supporting_text: "ssu21 mutation affected the transport and the incorporation into the cell wall"
- term:
    id: GO:0015867
    label: ATP transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P36051
  - sgd:YKL165C
  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: a reported S. cerevisiae ATP-release phenotype is
      not the conserved MCD4 core process.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The yeast donor row comes from an ATP-release screen that identified Mcd4p
      as a participant in glucose-dependent ATP release. That phenotype is
      secondary to ER/Golgi function and should not be transferred as a
      conserved N. glabratus biological process.
    additional_reference_ids:
    - PMID:12807869
    supported_by:
    - reference_id: PMID:12807869
      supporting_text: "identified Mcd4p, a 919-amino acid membrane protein with 14 putative transmembrane domains, as a participant"
