  label: Nakaseomyces glabratus CBS 138
description: ERG4 encodes the Candida glabrata Delta24(24-1)-sterol reductase, a predicted ER-membrane ERG4/ERG24-family enzyme
  that performs the final C-24(28) reduction of ergosterol biosynthesis. Perturbing CgERG4 affects tolerance to antifungal
  drugs, consistent with late-ergosterol-pathway roles in membrane stress responses.
