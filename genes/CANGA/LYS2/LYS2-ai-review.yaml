id: Q6FMI5
gene_symbol: LYS2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:284593
  label: Nakaseomyces glabratus CBS 138
description: >-
  Candida glabrata LYS2 encodes the conserved L-2-aminoadipate reductase of the
  fungal alpha-aminoadipate lysine-biosynthesis pathway. Like the characterized
  Saccharomyces, Schizosaccharomyces, and C. albicans enzymes, it belongs to the
  PANTHER PTHR44845:SF1 LYS2/lys1 subfamily and carries the adenylation,
  phosphopantetheine-dependent carrier, and reductase features used to convert
  alpha-aminoadipate to alpha-aminoadipate semialdehyde.
