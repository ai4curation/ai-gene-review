- term:
    id: GO:0005080
    label: protein kinase C binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002705681
  - UniProtKB:P61981
  review:
    summary: 14-3-3 gamma binds several PKC isoforms; a real but non-core interaction.
    action: KEEP_AS_NON_CORE
    reason: 14-3-3 proteins were first described as PKC regulators, and human 14-3-3gamma co-immunoprecipitates with PKC alpha,
      beta, gamma, theta and delta and is phosphorylated by PKC in VSMC (PMID:10433554). The PAINT IBA places this at a 14-3-3
      node with human YWHAG itself among the evidence, which is expected. PKC is one client among many and also acts on 14-3-3gamma
      as a kinase; this binding is real but peripheral to the general phospho-motif reader function.
    supported_by:
    - &id001
      reference_id: PMID:10433554
      supporting_text: We also demonstrated interaction between 14-3-3gamma and several PKC isoforms (alpha, beta, gamma,
        theta, and delta)
    - &id002
      reference_id: PMID:8381897
      supporting_text: a putative regulatory protein for protein kinase C
