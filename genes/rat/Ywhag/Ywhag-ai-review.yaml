suggested_questions:
- question: Which AS160 phosphosites (e.g. Thr642 equivalent) mediate insulin-dependent 14-3-3 gamma binding in rat adipocytes,
    and is gamma (rather than other isoforms) required for GLUT4 vesicle fusion?
- question: Is the reported exclusively nuclear localization of 14-3-3 gamma in COS-7 cells reconcilable with its predominantly
    cytosolic localization and cytoplasmic sequestration of clients such as PKP1?
- question: Should the human YWHAG rows to positive regulation of cell-cell adhesion (PMID:29678907) be corrected to negative
    regulation, and the IMP rows from the Down syndrome proteomics study (PMID:11824616) be withdrawn?
suggested_experiments:
- hypothesis: 14-3-3 gamma specifically, not other 14-3-3 isoforms, is required for insulin-stimulated GLUT4 vesicle fusion
    in rat adipocytes.
  description: Isoform-selective knockdown or knockout of Ywhag in primary rat adipocytes with rescue by wild-type versus
    phospho-groove mutant (K50E/R57E-equivalent) 14-3-3 gamma, measuring AS160 binding, GLUT4 vesicle fusion (TIRF) and glucose
    uptake.
  experiment_type: genetic perturbation with live-cell imaging
