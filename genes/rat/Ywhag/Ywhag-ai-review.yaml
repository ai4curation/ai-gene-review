  - ensembl:ENSP00000306330
  review:
    summary: Propagated from human YWHAG; tumour-immunity T-cell process from a single UFL1/PD-1 study not readable here.
    action: UNDECIDED
    reason: The human YWHAG source annotation (UniProt IDA, PMID:38377992) comes from a study of UFL1-mediated PD-1 UFMylation
      in T cells whose abstract does not mention 14-3-3; the role of 14-3-3 gamma (presumably binding AMPK-phosphorylated
      UFL1) could not be inspected (abstract only). The function is not independently established for rat Ywhag, and a tumour-immunity
      process is at best an indirect downstream consequence of a phospho-client-binding adaptor.
    supported_by:
    - reference_id: PMID:38377992
      supporting_text: AMPK phosphorylates UFL1 at Thr536, disrupting PD-1 UFMylation to trigger its degradation
