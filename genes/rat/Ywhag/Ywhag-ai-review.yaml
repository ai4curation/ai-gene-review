id: P61983
gene_symbol: Ywhag
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Ywhag encodes 14-3-3 protein gamma, a member of the highly conserved 14-3-3 family of dimeric phosphoserine/phosphothreonine-binding
  adaptor proteins. It forms homodimers and heterodimers whose paired amphipathic grooves recognize phosphorylated motifs
  in a large number of client proteins, modulating their activity, conformation, interactions or subcellular location. Clients
  include PKC isoforms, the GLUT4-trafficking Rab GAP AS160 (TBC1D4), LRRK2, the CaV2.2 alpha1B subunit, MuSK, IGF-1R, the
  GATOR2 subunit WDR24 and the desmosomal protein PKP1. It is abundant in neurons, is axonally transported to nerve terminals
  and is found in synaptic membrane fractions. In rat adipocytes, insulin increases 14-3-3 gamma binding to phosphorylated
  AS160 and its association with GLUT4 vesicles, linking it to insulin-stimulated GLUT4 vesicle fusion. It is mainly cytosolic,
  with nuclear and stress-induced mitochondrial matrix pools.
