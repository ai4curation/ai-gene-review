id: P01150
gene_symbol: Trh
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Trh encodes pro-thyrotropin-releasing hormone (pro-TRH), a 255-residue secretory precursor
  that carries five copies of the TRH progenitor sequence Gln-His-Pro-Gly flanked by paired basic residues.
  Processing in the regulated secretory pathway of neurons releases the amidated tripeptide TRH (pGlu-His-Pro-NH2)
  together with connecting peptides, and region-specific processing (for example in the olfactory bulb)
  yields N- or C-terminally extended TRH-related peptides. TRH made by parvocellular neurons of the hypothalamic
  paraventricular nucleus is released into the hypophyseal portal circulation, where it acts on Gq/11-coupled
  TRH receptors of anterior pituitary thyrotropes to drive thyrotropin (TSH) synthesis and secretion, and
  so sets the activity of the hypothalamus-pituitary-thyroid axis; it also stimulates prolactin release.
  Outside the hypophysiotropic system TRH is a widely distributed neuropeptide and neuromodulator, with
  reported effects on feeding (suppression via hypothalamic histamine neurons, stimulation via brainstem
  vagal-ghrelin circuits), hippocampal GABA and glutamate release, pancreatic islet function and neurohypophysial
  hormone release.
