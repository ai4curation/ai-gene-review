  review:
    summary: Neuropeptide precursors are packaged and processed in dense-core secretory granules before regulated
      release.
    action: KEEP_AS_NON_CORE
    reason: Pro-TRH is processed at paired basic sites by prohormone convertases, which act in the regulated
