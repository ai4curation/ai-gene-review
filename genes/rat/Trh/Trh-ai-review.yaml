  review:
    summary: Propagated from a human TRH IDA that cites a cryo-EM study of the TSH receptor activated by TSH
      and the M22 autoantibody; TRH is not studied there.
    action: REMOVE
    reason: 'The only experimental donor for this term on human TRH (UniProt IDA, PMID:35940204) is a TSHR
      structure paper: the adenylate cyclase-activating pathway it describes is TSH acting on TSHR, downstream
      of the pituitary, not TRH signalling. TRH receptors couple through Gq/11 (PMID:16990402), so the
