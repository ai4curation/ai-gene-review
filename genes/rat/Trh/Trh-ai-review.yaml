- term:
    id: GO:2000614
    label: positive regulation of thyroid-stimulating hormone secretion
  evidence_type: TAS
  original_reference_id: PMID:27515033
  qualifier: involved_in
  review:
    summary: Proposed. Hypophysiotropic TRH released from PVN neurons stimulates TSH synthesis and release
      by pituitary thyrotropes; the defining physiological role of the gene.
    action: NEW
    reason: TRH is the signal itself, so the gene product does the work of this regulation rather than being
      consumed by it. Comparator check passes, since the analogous hypothalamic releasing hormones carry the
