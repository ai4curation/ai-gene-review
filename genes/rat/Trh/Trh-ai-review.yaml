- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IEP
  original_reference_id: PMID:15726019
  qualifier: involved_in
  review:
    summary: Hypoxia lowers TRH release from the median eminence and PVN; this is a change in the hormone's
      secretion, measured by radioimmunoassay of peptide content.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IEP records that Trh output changes under hypoxia. It does not show that pro-TRH performs
      any part of a cellular or organismal response to hypoxia; expression-response terms of this kind
      describe regulation of the gene, not its function.
    supported_by:
    - reference_id: PMID:15726019
      supporting_text: We conclude that acute and chronic hypoxia exposure produces an inhibition of hypothalamic
        TRH secretion from the ME and PVN.
- term:
    id: GO:0001692
    label: histamine metabolic process
  evidence_type: IDA
  original_reference_id: PMID:17760865
  qualifier: involved_in
  review:
    summary: Full text read. Third-ventricle or TMN infusion of TRH increases histamine turnover (t-MH accumulation),
      HDC activity and HDC mRNA in rat hypothalamus, via TRH-R2 on histaminergic neurons.
    action: MARK_AS_OVER_ANNOTATED
    reason: TRH does not catalyse or take part in any step of histamine synthesis or degradation; it signals
      to histaminergic neurons, which then raise HDC expression and histamine turnover. The finding is regulation
      of histamine metabolism (and release) by an extracellular hormone, an indirect upstream effect. GO has
      no regulation-of-histamine-metabolism term to move the row to, so it is retained only as an over-annotation
      and the term choice is flagged upstream.
    supported_by:
    - reference_id: PMID:17760865
      supporting_text: Microinfusion of TRH into the TMN increased t-MH content, histidine decarboxylase (HDC)
        activity and expression of HDC mRNA in the TMN.
    - reference_id: PMID:17760865
      supporting_text: Immunohistochemical analysis revealed that TRH-R2, but not TRH-R1, was expressed within
        the cell bodies of histaminergic neurons in the TMN of rats.
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0001692
      confidence: PROBABLE
      explanation: 'RGD IDA from PMID:17760865 annotates rat Trh to histamine metabolic process (involved_in).
        The paper shows that exogenous TRH, acting through TRH-R2 on tuberomammillary histamine neurons,
        increases histamine turnover and HDC activity/mRNA; TRH itself does not participate in histamine
        metabolism. A regulation term (a positive regulation of histamine biosynthesis/metabolism term, which
        would need to be requested from GO) or the existing GO:2000252 row alone would represent the finding.'
      supported_by:
      - reference_id: PMID:17760865
        supporting_text: Infusion of TRH into the 3vt increased histamine turnover as assessed by pargyline-induced
          accumulation of tele-methylhistamine
