core_functions:
- description: Secreted prohormone processed to the tripeptide TRH, which acts as the hypothalamic releasing
    hormone on pituitary TRH receptors to drive TSH synthesis and secretion and so the HPT axis.
  molecular_function:
    id: GO:0008437
    label: thyrotropin-releasing hormone activity
  directly_involved_in:
  - id: GO:2000614
    label: positive regulation of thyroid-stimulating hormone secretion
  - id: GO:0009755
    label: hormone-mediated signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:27515033
    supporting_text: TRH controls the synthesis and release of thyrotropin, which activates the synthesis
      and secretion of thyroid hormones
  - reference_id: PMID:10628753
    supporting_text: TRH is essential only for the postnatal maintenance of the normal function of pituitary
      thyrotrophs
  - reference_id: PMID:3079917
    supporting_text: This protein contained five copies of the sequence Gln-His-Pro-Gly flanked by paired
      basic amino acids and could therefore generate five TRH molecules.
suggested_questions:
- question: Should GO provide a regulation-of-histamine biosynthesis/metabolism term so that hormone effects
    on histaminergic neurons (e.g. TRH via TRH-R2, PMID:17760865) can be captured without asserting participation
    in histamine metabolism?
- question: Do the non-TRH pro-TRH connecting peptides (e.g. prepro-TRH 160-169) have their own receptor-ligand
    activity that should be annotated to the precursor?
- question: Should the human TRH GO:0007189 IDA (PMID:35940204, a TSHR/TSH structure paper) be moved to
    TSHB/CGA, and the ISO transfers to rodent Trh withdrawn?
suggested_experiments:
- description: Conditional deletion of Trh in brainstem raphe versus PVN neurons, with measurement of fasting-induced
    refeeding and TSH, to separate the endogenous orexigenic brainstem role from the hypophysiotropic role.
  experiment_type: conditional knockout
