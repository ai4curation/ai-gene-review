        receptor (TSHR), controls the synthesis of thyroid hormone
    - reference_id: PMID:16990402
      supporting_text: Because the effects of TRH were mediated via Galphaq/11
    - reference_id: file:rat/Trh/Trh-deep-research-manual.md
      supporting_text: a cryo-EM study of the TSH receptor activated by TSH
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P20396
        source_status: SOURCE_BAD
        comment: Human TRH GO:0007189 IDA (UniProt, 2025-07-07) cites PMID:35940204, which reports TSH/M22-activated
          TSHR structures; TRH is not assayed. The evidence belongs to the TSH subunits (TSHB/CGA) or TSHR.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: UNIPROT
      record: UniProtKB:P20396
      slot: DB_Object_ID
      requested_change: CHECK
      asserted_value: UniProtKB:P20396
      cause: OTHER
      confidence: PROBABLE
      explanation: Human TRH (P20396) carries GO:0007189 adenylate cyclase-activating G protein-coupled receptor
        signaling pathway, IDA, PMID:35940204 (assigned by UniProt). That paper is a cryo-EM study of the
        thyrotropin receptor activated by TSH and the autoantibody M22; TRH is not studied. The annotation
        appears to belong to TSHB/CGA (the TSH ligand) or TSHR, and propagates by ISO to rat Trh (P01150)
