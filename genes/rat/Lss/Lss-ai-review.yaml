    label: lipid droplet
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Phylogenetically inferred lipid-droplet localization for Lss, from a PAINT node
      whose descendants include yeast Erg7 and human LSS with experimental lipid-droplet evidence.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBA node (PANTHER:PTN000792579) is grounded in yeast ERG7 (SGD:S000001114) and
      human LSS (UniProtKB:P48449), whose lipid-droplet annotations come from lipid-droplet
      fraction proteomics such as the HuH7 hepatocyte study. Rat Lss lies inside the
      vertebrate clade with no evidence of divergence, so the placement is not contested.
      Lipid droplets are contiguous with the ER and co-purify many ER lipid enzymes; the
      established site of lanosterol synthesis in mammals is the ER membrane, so lipid
      droplet is kept as a non-core location.
    supported_by:
