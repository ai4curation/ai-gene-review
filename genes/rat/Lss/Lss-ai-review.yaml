- term:
    id: GO:0031647
    label: regulation of protein stability
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  review:
    summary: Regulation of protein stability, transferred from human LSS (UniProtKB:P48449),
      where wild-type but not catalytically impaired LSS prevented aggregation of
      cataract-causing mutant crystallins.
    action: KEEP_AS_NON_CORE
    reason: >-
      The effect on crystallin aggregation is mediated by the enzyme's product, lanosterol,
      acting on lens proteins; Lss does not itself bind or stabilize the crystallins. It is a
      disease-relevant downstream consequence of the catalytic activity, not a core function,
      so it is kept as non-core.
    supported_by:
    - reference_id: UniProtKB:P48450
      supporting_text: Through the production of lanosterol may regulate lens protein
        aggregation and increase transparency
    - reference_id: PMID:26200341
      supporting_text: Engineered expression of wild-type, but not mutant, LSS prevents
        intracellular protein aggregation of various cataract-causing mutant crystallins.
  qualifier: involved_in
  supporting_entities:
