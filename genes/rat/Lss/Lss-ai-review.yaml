- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: Endoplasmic reticulum membrane localization of Lss, mapped from the UniProt
      subcellular-location annotation.
    action: ACCEPT
    reason: >-
      Rat Lss is a microsomal, membrane-associated (monotopic) enzyme; the ER membrane is
      where it acts on its hydrophobic substrate 2,3-oxidosqualene, which is produced by the
      ER enzyme squalene monooxygenase. This is the principal functional location and is
      retained as core. Earlier reviews kept it as non-core; it is now accepted because the
      ER membrane is the compartment in which the core catalytic step occurs.
    supported_by:
    - reference_id: UniProtKB:P48450
      supporting_text: 'SUBCELLULAR LOCATION: Endoplasmic reticulum membrane'
    - reference_id: PMID:7568116
      supporting_text: Unexpectedly, this microsomal membrane-associated enzyme showed no
        clearly delineated transmembrane domain.
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0097
