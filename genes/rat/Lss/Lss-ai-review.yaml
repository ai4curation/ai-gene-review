- id: file:rat/Lss/Lss-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: rat Lss (lanosterol synthase
    / oxidosqualene cyclase; UniProt P48450)'
  findings:
  - statement: Falcon confirms the core catalytic function of rat Lss as the oxidosqualene
      cyclase that forms lanosterol, the gateway reaction of the cyclic sterol pathway.
    supporting_text: '**Lanosterol synthase (LSS/OSC; EC 5.4.99.7)** catalyzes the
      cyclization of **(S)-2,3-oxidosqualene → lanosterol**, which is described as
      a key step in the cholesterol biosynthesis pathway.'
    reference_section_type: OTHER
  - statement: Falcon's conclusion restates the primary biochemical function and ER-associated,
      membrane-interacting localization of rat Lss.
    supporting_text: encodes an ER-associated, membrane-interacting sterol cyclase
      (OSC/LSS) whose primary biochemical function is the **conversion of 2,3-oxidosqualene
      to lanosterol**, a central gateway reaction into the cyclic sterol pathway leading
      to cholesterol.
    reference_section_type: OTHER
  - statement: Falcon places Lss in the cholesterol/sterol biosynthesis pathway downstream
      of squalene epoxidase and upstream of post-lanosterol remodeling enzymes.
    supporting_text: LSS sits downstream of **squalene epoxidase (SQLE)** (which generates
      oxidosqualene) and upstream of multiple “post-lanosterol” enzymes that remodel
      lanosterol toward cholesterol.
    reference_section_type: OTHER
  - statement: Falcon supports endoplasmic reticulum localization of the cholesterol
      biosynthesis machinery and a monotopic (peripheral) membrane topology for OSC/LSS.
    supporting_text: the enzyme is described in the clinical genetics review context
      as a **monotopic membrane protein**, i.e., a membrane-associated enzyme rather
      than a multi-pass transmembrane protein.
    reference_section_type: OTHER
  - statement: Falcon notes that loss of Lss disrupts lens development and downregulates
      the cholesterol-pathway gene program, supporting the core sterol-synthesis function.
    supporting_text: Lss loss-of-function disrupts lens development and cholesterol-pathway
      gene expression; homozygous mutant mice develop embryonic cataract and neonatal
      lethality, supporting core sterol-synthesis function
    reference_section_type: OTHER
  - statement: Falcon notes the substrate is 2,3-oxidosqualene and product is lanosterol,
      with no alternative mammalian substrate/product specificity reported.
    supporting_text: the substrate is explicitly stated as **2,3-oxidosqualene** and
      the product as **lanosterol**; no alternative mammalian substrate/product specificity
      parameters (e.g., kinetic constants or alternate cyclization products) were
      provided in these sources.
    reference_section_type: OTHER
