id: P48450
gene_symbol: Lss
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Lss encodes lanosterol synthase (2,3-oxidosqualene cyclase, EC 5.4.99.7),
  a monotopic enzyme associated with the cytosolic face of the endoplasmic reticulum membrane.
  It cyclizes (S)-2,3-epoxysqualene to lanosterol, forming the four-ring sterol nucleus in the
  first committed step of sterol synthesis downstream of squalene epoxidation, and so supplies
  the precursor for cholesterol. Lss is also found in lipid-droplet fractions. Hypomorphic Lss
  alleles, combined with Fdft1 mutation, lower lens cholesterol and cause cataract in the
  Shumiya cataract rat, and the human ortholog's product lanosterol can reduce aggregation of
  cataract-associated crystallin mutants.
