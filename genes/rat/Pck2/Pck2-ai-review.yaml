- term:
    id: GO:0042866
    label: pyruvate biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:19635791
  qualifier: involved_in
  review:
    summary: Knockdown of PEPCK-M lowers PEP in rat INS-1 cells (IMP to pyruvate biosynthetic process).
    action: MARK_AS_OVER_ANNOTATED
    reason: PEPCK-M produces phosphoenolpyruvate, not pyruvate; in the PEP cycle described in the paper, pyruvate
      kinase converts PEPCK-M-derived PEP to pyruvate. The knockdown result shown is reduced PEP. PCK2 is upstream
      of, rather than a catalyst of, pyruvate formation; GO has no phosphoenolpyruvate biosynthetic process term,
      so the existing gluconeogenesis/OAA metabolism rows plus the core MF capture the activity. Recorded as a WRONG_TERM
      query to RGD.
    supported_by:
    - reference_id: PMID:19635791
      supporting_text: PEPCK-M will then consume oxaloacetate and GTP to produce PEP, GDP, and CO2.
    - reference_id: PMID:19635791
      supporting_text: both total and 13C-labeled PEP concentrations were significantly reduced, confirming the
        impact of silencing on metabolism
    source_defects:
    - defect_type: WRONG_TERM
      resource: RGD
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0042866
      confidence: PROBABLE
      explanation: RGD IMP (PMID:19635791) to GO:0042866 pyruvate biosynthetic process for rat Pck2. PEPCK-M makes
        phosphoenolpyruvate from oxaloacetate and GTP; pyruvate is made from that PEP by pyruvate kinase. The paper
        shows PEP falls on knockdown. A PEP-forming term (none exists in GO; consider a new term or GO:0006107 oxaloacetate
        metabolic process) would fit better.
      supported_by:
      - reference_id: PMID:19635791
        supporting_text: PEPCK-M will then consume oxaloacetate and GTP to produce PEP, GDP, and CO2.
