suggested_questions:
- question: Did the whole-liver PEPCK activity measurements in PMID:11440903 and PMID:4353083 distinguish the mitochondrial
    isoform, or should those IDA rows move to Pck1?
- question: Is the protein kinase activity reported for human PCK2 on ACSL4 (PMID:38720107) conserved in rodent
    Pck2, and does it occur in the mitochondrial matrix or on a cytosolic pool?
- question: Should GO add a phosphoenolpyruvate biosynthetic process term so that PEP-forming enzymes are not annotated
    to pyruvate biosynthesis?
- question: The Ensembl-derived F1LQJ7 model begins without an initiator methionine (TLLPSPP...); is the correct
    start Met28, as in human and mouse PCK2?
suggested_experiments:
- description: Isoform-specific (Pck1 vs Pck2 knockdown or fractionated) PEPCK activity assays in rat liver under
    the dietary conditions of PMID:11440903 to apportion activity to each isoform.
- description: In vitro kinase assay of recombinant rat Pck2 on ACSL4 with catalytic-site mutants to test whether
    the protein kinase activity uses the PEPCK active site.
