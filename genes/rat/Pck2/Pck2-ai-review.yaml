id: F1LQJ7
gene_symbol: Pck2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Pck2 encodes the mitochondrial isoform of GTP-dependent phosphoenolpyruvate carboxykinase (PEPCK-M),
  a manganese-activated enzyme of the mitochondrial matrix that converts oxaloacetate and GTP into phosphoenolpyruvate
  (PEP), GDP and CO2. Unlike the cytosolic isoform (Pck1), it is expressed in many tissues, including liver, kidney
  and pancreatic beta cells, where it is the only PEPCK. In liver it supplies PEP for gluconeogenesis from lactate,
  alanine and glutamine; in beta cells it couples mitochondrial GTP made by succinyl-CoA synthetase to an anaplerotic
  PEP cycle required for glucose-stimulated insulin secretion. Human PCK2 has also been reported to act as a protein
  kinase that phosphorylates ACSL4 and promotes ferroptosis.
