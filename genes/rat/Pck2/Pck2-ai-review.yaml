  review:
    summary: Mitochondrial PEPCK activity measured in fractionated foetal, newborn and adult rat liver.
    action: ACCEPT
    reason: Ballard and Hanson assayed PEPCK in rat liver mitochondrial fractions and showed the mitochondrial enzyme
      is kinetically indistinguishable from the cytosolic one; the mitochondrial activity is the Pck2 product. Core
      catalytic activity, also confirmed in rat islets and INS-1 cells (PMID:19635791).
