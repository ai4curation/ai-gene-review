    - reference_id: PMID:6049928
      supporting_text: 'This same enzyme in the

        mitochondria has considerable activity in the foetal and adult liver and is

        lower in the newborn.'
    - reference_id: PMID:6049928
      supporting_text: 'Kinetic and other studies on the properties of

        phosphoenolpyruvate carboxykinase have shown no differences between the soluble

        and mitochondrial enzymes.'
    - reference_id: PMID:19635791
      supporting_text: Virtually all of the PEPCK activity from cells and islets was localized to the mitochondrial
        fraction when adjusted for leakage of mitochondrial contents into the cytosol fraction by parallel measurements
        of glutamate dehydrogenase activity from the same samples
