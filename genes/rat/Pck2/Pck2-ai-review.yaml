- term:
    id: GO:0032024
    label: positive regulation of insulin secretion
  evidence_type: IMP
  original_reference_id: PMID:19635791
  qualifier: involved_in
  review:
    summary: siRNA knockdown of PEPCK-M in rat INS-1 832/13 cells abolishes glucose-stimulated insulin secretion.
    action: ACCEPT
    reason: 'Full text read. Two independent siRNAs that reduced PEPCK-M activity by 75% lowered PEP and completely
      blocked GSIS. PEPCK-M does work in this process: it is the enzyme of the beta-cell PEP cycle that hydrolyses
      mtGTP and exports anaplerotic carbon as PEP, the proposed metabolic coupling signal (it is the only PEPCK
      in these cells). This is the best-characterised rat-specific role and is recorded as a core function alongside
      gluconeogenesis.'
    supported_by:
    - reference_id: PMID:19635791
      supporting_text: Silencing the PEPCK-M gene completely inhibited GSIS underscoring its central role in mitochondrial
        metabolism-mediated insulin secretion.
    - reference_id: PMID:19635791
      supporting_text: 'As high as 30% of PEP in INS-1

        832/13 cells and 41% of PEP in rat islets came from PEPCK-M.'
