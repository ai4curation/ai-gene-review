  review:
    summary: Hepatic gluconeogenesis measured in rats (abstract only).
    action: ACCEPT
    reason: 'Gluconeogenesis is a core process of Pck2: PEPCK-M catalyses the OAA to PEP step, and ASO knockdown
      of PEPCK-M in rat liver and hepatocytes reduces gluconeogenesis from lactate, alanine and glutamine (PMID:24497630).
      This abstract-only paper measured whole-animal gluconeogenesis and total enzyme activities, so it is weak
      support for Pck2 specifically, but the process is independently established and the curator read the full
      text; accepted with the same suspected gene-product caveat as the companion MF row.'
    supported_by:
    - reference_id: PMID:24497630
      supporting_text: Consistent with its predicted role, gluconeogenesis rates from hepatocytes lacking PEPCK-M
        are severely reduced for lactate, alanine, and glutamine, but not for pyruvate and glycerol.
    - reference_id: PMID:24497630
      supporting_text: 'Synthesis of phosphoenolpyruvate (PEP) from oxaloacetate is an absolute

        requirement for gluconeogenesis from mitochondrial substrates.'
