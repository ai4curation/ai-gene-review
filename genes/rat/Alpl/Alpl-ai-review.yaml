  review:
    summary: Alkaline phosphatase activity; directly measured for purified rat bone/osteosarcoma enzyme
      and supported by phylogeny and orthology.
    action: ACCEPT
    reason: Rat osteosarcoma TNAP was purified and characterized (pH optimum 10.5, Km 0.8 mM for pNPP),
      and heterologous expression of the rat cDNA in CHO cells confers ALP activity. The IBA node (PTHR11596)
      correctly places this activity across the alkaline phosphatase family. This is the generic phosphomonoesterase
      activity underlying all of TNAP's physiological reactions.
    supported_by:
    - reference_id: PMID:3472490
      supporting_text: The purified enzyme had a specific activity of 759 units/mg protein at its optimal
        pH (10.5), and a Km of 0.8 mM for p-nitrophenylphosphate.
    - reference_id: PMID:3472490
      supporting_text: The heat-inactivation profile and homoarginine inhibition were characteristic of
        the bone-liver-kidney AP isoenzyme.
    - reference_id: PMID:3422431
      supporting_text: ALP negative CHO cells transfected with an expression vector containing the ALP
        coding sequences express ALP.
    - reference_id: UniProtKB:P08289
      supporting_text: Belongs to the alkaline phosphatase family.
