- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:13065
  review:
    summary: ATP hydrolysis activity (ATP to ADP + Pi).
    action: KEEP_AS_NON_CORE
    reason: 'TNAP hydrolyses ATP as a substrate: rat bone-marrow TNAP in proteoliposomes (PMID:32710882)
      and human TNAP (PMID:20048161). This is a substrate-level hydrolysis by a broad phosphatase, not
      energy-coupled ATPase work; it contributes to extracellular Pi generation and purinergic signalling
      termination but is secondary to PPi hydrolysis.'
    supported_by:
    - reference_id: PMID:32710882
      supporting_text: TNAP is an ATP phosphohydrolase bound to cell and MV membranes via a glycosylphosphatidylinositol
        (GPI) anchor.
    - reference_id: PMID:20048161
      supporting_text: NPP1 plus TNAP additively hydrolyzed ATP, but TNAP appeared more active in AMP
        formation than NPP1.
