- term:
    id: GO:0001958
    label: endochondral ossification
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:87983
  review:
    summary: Endochondral ossification, transferred from the mouse Alpl/Phospho1 compound-knockout phenotype.
    action: KEEP_AS_NON_CORE
    reason: 'The mouse source (IMP, PMID:20684022) shows that simultaneous ablation of PHOSPHO1 and TNAP
      abolishes skeletal mineralization, which affects endochondral bone. The qualifier is acts_upstream_of_or_within,
      which fits: TNAP acts in the mineralization step of endochondral bone formation, captured more precisely
      by bone mineralization (accepted as core). Kept as non-core developmental context.'
    supported_by:
    - reference_id: PMID:20684022
      supporting_text: Here we show that PHOSPHO1, a phosphatase with specificity for phosphoethanolamine
        and phosphocholine, plays a functional role in the initiation of calcification and that ablation
        of PHOSPHO1 and TNAP function prevents skeletal mineralization.
    - reference_id: UniProtKB:P08289
      supporting_text: while PHOSPHO1 mediates the initiation of hydroxyapatite crystallization in the
        matrix vesicles (MVs), ALPL/TNAP catalyzes the spread of hydroxyapatite crystallization in the
        extracellular matrix
- term:
    id: GO:0003006
    label: developmental process involved in reproduction
  evidence_type: ISO
  original_reference_id: GO_REF:0000121
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - MGI:MGI:87983
  review:
    summary: Developmental process involved in reproduction, transferred from a mouse IGI annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse donor is an IGI from a Dmrt1 germ-cell study (PMID:17540358) in which alkaline phosphatase
      is used as a germ-cell marker; nothing connects TNAP catalysis to a reproductive process. The term
      is extremely broad and the enzyme's established roles (mineralization, B6 and creatine metabolism)
      do not include reproduction. Over-annotation for rat.
    supported_by:
    - reference_id: UniProtKB:P08289
      supporting_text: Plays an essential role in skeletal and dental mineralization via its ability to
        hydrolyze extracellular diphosphate, a potent mineralization inhibitor, to phosphate
    propagation_review:
