- term:
    id: GO:0004427
    label: inorganic diphosphate phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:24576
  review:
    summary: Inorganic diphosphate (pyrophosphate) phosphatase activity, the physiologically central activity
      of TNAP in mineralization.
    action: ACCEPT
    reason: TNAP hydrolyses extracellular PPi, the endogenous inhibitor of hydroxyapatite propagation;
      shown kinetically for TNAP in proteoliposomes (human enzyme, PMID:20048161) and in matrix vesicles
      from knockout mice (PMID:19874193). The rat enzyme is ~90% identical and conserves all catalytic
      residues; the Rhea-based IEA and the ISO/ISS transfers are sound. Core molecular function.
    supported_by:
    - reference_id: PMID:20048161
      supporting_text: Hydrolysis of PP(i) by TNAP-, and TNAP plus NPP1-containing proteoliposomes occurred
        with catalytic efficiencies and mild cooperativity
    - reference_id: PMID:19874193
      supporting_text: We conclude that TNAP is the enzyme that hydrolyzes both ATP and PP(i) in the MV
        compartment.
    - reference_id: UniProtKB:P08289
      supporting_text: Plays an essential role in skeletal and dental mineralization via its ability to
        hydrolyze extracellular diphosphate, a potent mineralization inhibitor, to phosphate
