      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:87983
        source_label: mouse Alpl
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Donor IGI (PMID:17540358) is a Dmrt1 germ-cell study using alkaline phosphatase as a
