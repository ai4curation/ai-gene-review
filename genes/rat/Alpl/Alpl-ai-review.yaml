id: P08289
gene_symbol: Alpl
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Alpl encodes rat tissue-nonspecific alkaline phosphatase (TNAP; the bone/liver/kidney isozyme),
  a 524-residue, N-glycosylated, homodimeric Zn2+/Mg2+-dependent phosphomonoesterase of the alkaline phosphatase
  family that is attached by a C-terminal GPI anchor to the outer face of the plasma membrane and to matrix
  vesicles released by osteoblasts and chondrocytes. Its key physiological reaction is hydrolysis of extracellular
  inorganic pyrophosphate, the endogenous inhibitor of hydroxyapatite growth, which together with the
  generation of inorganic phosphate allows mineral formed in matrix vesicles to propagate into the collagenous
  matrix of bone, dentin and cementum; loss of the orthologous enzyme causes hypophosphatasia. The same
  active site dephosphorylates pyridoxal 5'-phosphate to pyridoxal, the membrane-permeant form of vitamin
  B6, and degrades ATP stepwise to adenosine, and also acts on phosphocholine and phosphoethanolamine.
  In thermogenic adipocytes the enzyme is tethered within mitochondria, where it hydrolyses N-phosphocreatine
  to drive the futile creatine cycle of heat-producing energy dissipation. The rat enzyme was cloned and
  purified from ROS 17/2.8 osteosarcoma cells, and its expression in osteoblastic cells is driven by an
  upstream, glucocorticoid-inducible promoter.
