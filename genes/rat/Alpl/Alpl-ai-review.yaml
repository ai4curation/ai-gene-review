suggested_questions:
- question: Should GO represent the pro-calcification role of TNAP (it degrades the PPi that inhibits
    ectopic mineralization) with a positive-regulation term, so that the inverted GO:0140928 mouse annotation
    can be replaced rather than only deleted?
- question: Is the mitochondrial localization and phosphocreatine phosphatase role of TNAP in thermogenic
    fat conserved in rat brown/beige adipocytes?
suggested_experiments:
- description: Fractionate rat brown adipose tissue mitochondria (with ER-marker controls) and measure
    SBI-425-sensitive phosphocreatine phosphatase activity to test conservation of the mitochondrial TNAP
    creatine-cycle function in rat.
