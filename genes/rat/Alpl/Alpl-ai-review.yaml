- term:
    id: GO:0030282
    label: bone mineralization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:87983
  - PANTHER:PTN002613308
  - ZFIN:ZDB-GENE-040420-1
  review:
    summary: Bone mineralization; the principal physiological process in which TNAP acts.
    action: ACCEPT
    reason: TNAP hydrolyses extracellular PPi at the mineralization front and in matrix vesicles, permitting
      hydroxyapatite propagation; loss causes hypophosphatasia in human and mouse, and compound ablation
      with Phospho1 prevents skeletal mineralization. In rat, TNAP activity localizes to osteoblast membranes
      and matrix vesicles at appositional mineralization sites. The IBA, ISO, ISS and IEA rows agree.
    supported_by:
    - reference_id: PMID:20684022
      supporting_text: Here we show that PHOSPHO1, a phosphatase with specificity for phosphoethanolamine
        and phosphocholine, plays a functional role in the initiation of calcification and that ablation
        of PHOSPHO1 and TNAP function prevents skeletal mineralization.
    - reference_id: PMID:19874193
      supporting_text: We conclude that TNAP is the enzyme that hydrolyzes both ATP and PP(i) in the MV
        compartment.
    - reference_id: PMID:19697513
      supporting_text: Intense TNSALP and ATPase reactions were confirmed along the limited portions of
        osteoblast membranes where intimate cell-cell contacts were maintained.
    - reference_id: UniProtKB:P08289
      supporting_text: while PHOSPHO1 mediates the initiation of hydroxyapatite crystallization in the
        matrix vesicles (MVs), ALPL/TNAP catalyzes the spread of hydroxyapatite crystallization in the
        extracellular matrix
