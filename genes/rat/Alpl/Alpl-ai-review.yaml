  review:
    summary: Plasma membrane; TNAP is a GPI-anchored ectoenzyme.
    action: ACCEPT
    reason: TNAP is GPI-anchored on the outer leaflet of the plasma membrane; rat histochemistry shows
      intense activity on osteoblast membranes, and rat bone-marrow TNAP is described as bound to cell
      and MV membranes via a GPI anchor. IBA, ISO, ISS and IEA rows are consistent.
    supported_by:
    - reference_id: PMID:19697513
      supporting_text: Intense TNSALP and ATPase reactions were confirmed along the limited portions of
        osteoblast membranes where intimate cell-cell contacts were maintained.
    - reference_id: PMID:32710882
      supporting_text: TNAP is an ATP phosphohydrolase bound to cell and MV membranes via a glycosylphosphatidylinositol
        (GPI) anchor.
