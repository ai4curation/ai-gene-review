- term:
    id: GO:0140928
    label: inhibition of non-skeletal tissue mineralization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P09242
  - ensembl:ENSMUSP00000030551
  review:
    summary: Inhibition of non-skeletal tissue mineralization; sign-inverted for TNAP.
    action: REMOVE
    reason: 'TNAP degrades extracellular PPi, the endogenous inhibitor of hydroxyapatite deposition, so
      it promotes rather than prevents ectopic mineralization: TNAP overexpression increases calcification
      of cultured aortas (PMID:21490328). The mouse source annotation is a misreading of that paper, which
      credits the inhibitory role to locally produced PPi (made by ENPP1). The mouse and human reviews
      remove the same term. The rat ISO and Ensembl-compara IEA rows simply propagate the inverted source
      and should be removed.'
    supported_by:
    - reference_id: PMID:21490328
      supporting_text: Overexpression of TNAP increased calcification of cultured aortas.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      source_entities:
      - source_id: MGI:MGI:87983
        source_label: mouse Alpl
        source_status: SOURCE_BAD
        comment: Mouse IDA/IMP rows from PMID:21490328 assert the inverted sign; TNAP promotes ectopic
          calcification.
    source_defects:
    - defect_type: WRONG_TERM
      resource: MGI
      record: MGI:MGI:87983
      requested_change: DELETE_ROW
      asserted_value: GO:0140928
      cause: OTHER
      confidence: PROBABLE
      explanation: 'Mouse Alpl (MGI:87983) is annotated by IDA/IMP from PMID:21490328 to GO:0140928 inhibition
        of non-skeletal tissue mineralization, and the rat ISO (GO_REF:0000121) and Ensembl-compara IEA
        (GO_REF:0000107) rows descend from it. TNAP hydrolyses extracellular pyrophosphate, the inhibitor
        of ectopic calcification, so it promotes vascular calcification: the same paper reports that overexpression
        of TNAP increased calcification of cultured aortas. The inhibitory role in that paper belongs
        to pyrophosphate produced by ENPP1. The mouse rows should be deleted (or replaced by a NOT annotation),
        which would remove the propagated rat rows.'
      supported_by: &id002
      - reference_id: PMID:21490328
        supporting_text: Overexpression of TNAP increased calcification of cultured aortas.
