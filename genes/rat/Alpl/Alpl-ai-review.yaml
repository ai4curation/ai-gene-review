  - ensembl:ENSP00000363973
  review:
    summary: Calcium ion binding, transferred from human ALPL structural data.
    action: KEEP_AS_NON_CORE
    reason: TNAP has a structural calcium site conserved in mammalian alkaline phosphatases, but calcium
      binding does not influence catalytic activity. True, but peripheral to function.
    supported_by:
    - reference_id: UniProtKB:P08289
      supporting_text: Calcium-binding is structural and does not influence the alkaline phosphatase activity.
