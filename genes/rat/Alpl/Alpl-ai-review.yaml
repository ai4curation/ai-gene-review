- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:19697513
  qualifier: located_in
  review:
    summary: Extracellular region, from histochemistry of rat bone showing TNAP activity throughout the
      osteoid.
    action: KEEP_AS_NON_CORE
    reason: Enzyme histochemistry in bisphosphonate-treated rat bone detected TNSALP activity diffusely
      in osteoid as well as on osteoblast membranes and matrix vesicles. The finding is from an abstract-only
      paper and the protein is principally GPI-anchored on plasma and matrix-vesicle membranes; the extracellular
      region assertion is true but less precise. Kept as non-core.
    supported_by:
    - reference_id: PMID:19697513
      supporting_text: Diffuse reactions of these enzymes were throughout the osteoid implicating efflux
        of TNSALP and ATPase molecules into extracellular matrix from the osteoblast membranes.
- term:
    id: GO:0005758
    label: mitochondrial intermembrane space
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P09242
  - ensembl:ENSMUSP00000030551
  - UniProtKB-SubCell:SL-0169
  review:
    summary: Mitochondrial intermembrane space, transferred from the mouse thermogenic-adipocyte study.
    action: ACCEPT
    reason: In thermogenic fat cells mouse TNAP localizes to mitochondria, tethered by its GPI anchor
      and probably facing the intermembrane space, where it hydrolyses phosphocreatine in the futile creatine
      cycle (PMID:33981039). Rat Alpl is a 1:1 ortholog; the location is where the creatine-cycle activity
      acts, so it is accepted as a core location for that function.
    supported_by:
    - reference_id: PMID:33981039
      supporting_text: Unlike in other cells, TNAP in thermogenic fat cells is localized to the mitochondria,
        where futile creatine cycling occurs.
    - reference_id: UniProtKB:P08289
      supporting_text: 'Localizes to the mitochondria of thermogenic fat cells: tethered to mitochondrial
        membranes via a GPI-anchor and probably resides in the mitochondrion intermembrane space'
