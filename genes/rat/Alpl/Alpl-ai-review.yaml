  - ensembl:ENSMUSP00000030551
  review:
    summary: Pyrophosphatase activity; correct but general.
    action: MODIFY
    reason: Pyrophosphatase activity (hydrolysis of a phosphoanhydride bond) is true but general. The
      specific supported descendants are inorganic diphosphate phosphatase activity (GO:0004427, the core
      activity, already carried by the gene) and the nucleotide pyrophosphatase steps ATP hydrolysis (GO:0016887)
      and ADP phosphatase (GO:0043262), all present elsewhere in this review.
    supported_by:
    - reference_id: PMID:20048161
      supporting_text: Hydrolysis of PP(i) by TNAP-, and TNAP plus NPP1-containing proteoliposomes occurred
        with catalytic efficiencies and mild cooperativity
    - reference_id: PMID:20048161
      supporting_text: NPP1 plus TNAP additively hydrolyzed ATP, but TNAP appeared more active in AMP
        formation than NPP1.
    proposed_replacement_terms: &id001
    - id: GO:0004427
      label: inorganic diphosphate phosphatase activity
    - id: GO:0016887
      label: ATP hydrolysis activity
    - id: GO:0043262
      label: ADP phosphatase activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
