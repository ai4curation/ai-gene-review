        and phosphocholine, plays a functional role in the initiation of calcification and that ablation
        of PHOSPHO1 and TNAP function prevents skeletal mineralization.
    - reference_id: PMID:19874193
      supporting_text: We conclude that TNAP is the enzyme that hydrolyzes both ATP and PP(i) in the MV
        compartment.
    - reference_id: PMID:19697513
      supporting_text: Intense TNSALP and ATPase reactions were confirmed along the limited portions of
        osteoblast membranes where intimate cell-cell contacts were maintained.
    - reference_id: UniProtKB:P08289
      supporting_text: while PHOSPHO1 mediates the initiation of hydroxyapatite crystallization in the
        matrix vesicles (MVs), ALPL/TNAP catalyzes the spread of hydroxyapatite crystallization in the
        extracellular matrix
