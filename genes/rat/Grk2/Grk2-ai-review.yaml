      GRK2 process, shown for rat receptors in neurons (M1 mAChR), chromaffin cells (alpha2AR), arterial
      smooth muscle (P2Y2, beta2AR) and oligodendrocyte precursors (GPR17).
    supported_by:
    - reference_id: file:rat/Grk2/Grk2-uniprot.txt
