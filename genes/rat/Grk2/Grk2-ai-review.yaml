        of exercise-enhanced vascular insulin sensitivity.
    - reference_id: PMID:23913704
      supporting_text: In addition, exercise downregulated vascular GRK2 expression and activity, which further
        increased insulin-stimulated vascular Akt/eNOS activation in exercised SHRs.
    - reference_id: PMID:23913704
      supporting_text: Taken together, our results suggest that exercise training improved vascular relaxation
        to insulin mediated by endothelial insulin signaling.
