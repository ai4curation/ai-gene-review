  original_reference_id: PMID:23913704
  qualifier: involved_in
  review:
    summary: Vasodilation, from a study of exercise and vascular insulin sensitivity in SHR rats.
    action: MODIFY
    reason: The paper shows Grk2 opposes insulin-induced vasodilation (knockdown enhances insulin sensitivity);
      involvement in vasodilation itself has the wrong sign. Negative regulation of vasodilation (GO:0045908)
      is obsolete in the current GO release, and its replaced_by target, vasoconstriction (GO:0042310), does
      not describe this result. As with the positive regulation of vasoconstriction row (PMID:28882814), the
      row is modified to negative regulation of relaxation of smooth muscle, which the gene already carries,
      since lower GRK2 enhances insulin-induced relaxation of resistance arteries. The insulin-signaling part of the
      result is already recorded by the GO:1900077 row from this paper.
