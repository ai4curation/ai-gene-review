      supporting_text: Phosphorylates the agonist-occupied form of the beta-adrenergic and closely related
        receptors, probably inducing a desensitization of them
    - reference_id: PMID:1403099
      supporting_text: The beta-adrenergic receptor kinase (beta ARK) phosphorylates the agonist-occupied
        beta-adrenergic receptor to promote rapid receptor uncoupling from Gs, thereby attenuating adenylyl
        cyclase activity.
    - reference_id: PMID:17908240
      supporting_text: Inhibition of endogenous G protein-coupled receptor kinase 2 by transfection with
        the non-G(q/11)alpha-binding, catalytically-inactive (D110A,K220R)G protein-coupled receptor kinase
        2 mutant, decreased the extent of M1 mACh receptor desensitization under all conditions.
