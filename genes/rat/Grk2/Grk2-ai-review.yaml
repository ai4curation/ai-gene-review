core_functions:
- description: ATP-dependent phosphorylation of agonist-activated GPCRs at the plasma membrane, which
    promotes arrestin binding and uncoupling from G proteins, desensitizing receptor signaling (beta-adrenergic,
    muscarinic M1, alpha2-adrenergic, P2Y2, GPR17 and other receptors).
  molecular_function:
    id: GO:0004703
    label: G protein-coupled receptor kinase activity
  directly_involved_in:
  - id: GO:0002029
    label: desensitization of G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1403099
    supporting_text: The beta-adrenergic receptor kinase (beta ARK) phosphorylates the agonist-occupied
      beta-adrenergic receptor to promote rapid receptor uncoupling from Gs, thereby attenuating adenylyl
      cyclase activity.
  - reference_id: PMID:17908240
    supporting_text: Our current data also emphasize that the role of GRK2 in this regulation is dependent
      on its kinase activity.
  - reference_id: PMID:30075183
    supporting_text: GRK2 or GRK5 depletion enhanced and prolonged β2AR/AC signalling, while combined
      deletion of GRK2/5 has an additive effect.
  - reference_id: PMID:16899567
    supporting_text: FSH induces the recruitment of the endogenous GRK 2 and beta-arrestin 1/2 from the
      cytoplasm to the plasma membrane of rat primary Sertoli cells
  - reference_id: PMID:8798423
    supporting_text: charged phospholipids are required for agonist-dependent phosphorylation of receptors
      by GRK2
- description: Phosphorylation of the agonist-occupied beta-adrenergic receptor, the founding activity
    of betaARK1, limiting beta-adrenergic/cAMP signaling in heart and vascular smooth muscle.
  molecular_function:
    id: GO:0047696
    label: beta-adrenergic receptor kinase activity
  directly_involved_in:
  - id: GO:0106072
    label: negative regulation of adenylate cyclase-activating G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:1403099
    supporting_text: The beta-adrenergic receptor kinase (beta ARK) phosphorylates the agonist-occupied
      beta-adrenergic receptor to promote rapid receptor uncoupling from Gs, thereby attenuating adenylyl
      cyclase activity.
  - reference_id: PMID:30075183
    supporting_text: GRK2 or GRK5 depletion enhanced and prolonged β2AR/AC signalling, while combined
      deletion of GRK2/5 has an additive effect.
suggested_questions:
- question: Should the rat apical and basolateral plasma membrane IDA rows from Sertoli cells (PMID:16899567)
    be retained, given that the abstract reports only cytoplasm-to-plasma-membrane recruitment?
- question: The IEA nucleus row is inferred from "maintenance of protein location in nucleus" (PMID:28759639),
    where the nuclear protein is NFAT. Should the IMP row be re-curated as an upstream regulatory effect
    so the nucleus inference no longer fires?
- question: Which rat receptors does Grk2 desensitize through phosphorylation, and which through RH-domain
    sequestration of Galpha q/11 independent of phosphorylation?
suggested_experiments:
- description: Express kinase-dead (K220R) versus RH-domain-dead (D110A) Grk2 separately in rat hippocampal
    neurons and smooth muscle cells. This would show, receptor by receptor, how much desensitization needs
    catalytic activity and how much needs Gq/11 binding.
  experiment_type: site-directed mutagenesis with functional assay
- description: Use phosphosite-specific antibodies or mass spectrometry to map Grk2-dependent phosphorylation
    of endogenous rat P2Y2 and GPR17 receptors after agonist stimulation.
  experiment_type: phosphoproteomics
