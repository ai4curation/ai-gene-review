id: P26817
gene_symbol: Grk2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Grk2 (G protein-coupled receptor kinase 2; beta-adrenergic receptor kinase 1, betaARK1) is
  a cytosolic AGC-family serine/threonine kinase with an N-terminal RGS-homology domain, a central kinase
  domain and a C-terminal pleckstrin-homology domain that binds anionic phospholipids and G protein beta/gamma
  subunits. On agonist stimulation it is recruited from the cytoplasm to the plasma membrane, where it
  phosphorylates agonist-occupied G protein-coupled receptors (beta-adrenergic, muscarinic M1, alpha2-adrenergic,
  P2Y2, GPR17, opioid and others). Receptor phosphorylation promotes arrestin binding, uncoupling from
  G proteins and internalization, terminating (desensitizing) receptor signaling. Its RH domain can also
  blunt Gq/11 signaling without phosphorylation. Grk2 is widely expressed, abundant in neurons where it
  sits at pre- and postsynaptic sites, and important in heart, vascular smooth muscle and adrenal chromaffin
  cells. It also phosphorylates non-receptor substrates, acts as a Rho-activated scaffold for the ERK
  cascade, and, in orthologs, localizes to the mitochondrial outer membrane and to the primary cilium,
  where it phosphorylates Smoothened and GPR161 to promote Hedgehog signaling.
