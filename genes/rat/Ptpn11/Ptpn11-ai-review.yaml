id: P41499
gene_symbol: Ptpn11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:10116
  label: Rattus norvegicus
description: Ptpn11 encodes SHP2 (PTP1D, SH-PTP2, Syp), a widely expressed cytoplasmic non-receptor protein tyrosine
  phosphatase with two N-terminal SH2 domains, a classical PTP catalytic domain (catalytic Cys459) and a C-terminal
  tail carrying Tyr542/Tyr580 phosphorylation sites. In the basal state the N-SH2 domain blocks the active site;
  binding of the SH2 domains to tyrosine-phosphorylated receptors, ITIM/ITSM-bearing adhesion and immune receptors
  (PECAM-1, SIRPA/BIT, TLT1, PD-1) and docking proteins (IRS-1, Gab2) both recruits SHP2 and activates it. Activated
  SHP2 dephosphorylates selected phosphotyrosine sites on substrates such as receptor tyrosine kinases, IRS-1, FAK
  and STAT3, and its phosphorylated tail and SH2 domains also give it adaptor functions (for example linking JAK2
  to IRS proteins). Its best-established cellular output is promotion of RAS-ERK1/2 signalling downstream of receptor
  tyrosine kinases, cytokine receptors and some G-protein-coupled receptors (angiotensin AT1, dopamine D1), while
  in other contexts it restrains signalling (IRS-1 Tyr895 dephosphorylation in differentiated vascular smooth muscle,
  FAK dephosphorylation in cardiomyocytes, PD-1-mediated T-cell inhibition). Rat Ptpn11 is expressed in brain, muscle
  and lung, and alternative splicing produces a less active PTP1Di isoform with a four-residue insertion in the
  catalytic domain. SHP2 is mainly cytosolic, with stimulus-dependent pools at focal adhesions, lipid rafts, mitochondria
  and the nucleus.
