suggested_questions:
- question: Does the PTP1Di splice isoform (ALLQ insertion in the catalytic domain), which has lower Vmax but higher
    substrate affinity, have a distinct physiological role in rat brain, and is it conserved in other mammals?
- question: Is the mitochondrial Shp-2 pool in rat brain (intermembrane space/outer membrane) catalytically engaged
    with specific mitochondrial substrates, and should a mitochondrial location be annotated?
- question: The rat IDA row for insulin receptor binding (PMID:7711057) appears to rest on use of an insulin receptor
    kinase domain as a substrate; can the curator confirm whether binding was shown?
suggested_experiments:
- description: Substrate-trapping (D425A/C459S) SHP2 mutants in rat VSMCs and cardiomyocytes, followed by phosphoproteomics,
    to define direct substrates in the contexts where SHP2 restrains rather than promotes signalling.
- description: Compare PTP1D and PTP1Di isoforms in rat neurons by isoform-specific knockdown/rescue with Erk1/2
    activation and SH2-ligand activation assays.
