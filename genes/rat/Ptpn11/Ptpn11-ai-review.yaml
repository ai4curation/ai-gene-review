  review:
    summary: IDA for insulin receptor binding from a paper purifying muscle PTPases.
    action: KEEP_AS_NON_CORE
    reason: The cached abstract (full text unavailable) reports that muscle PTPases were assayed by dephosphorylation
      of a rat insulin receptor kinase domain; it does not describe binding of SH-PTP2 to the insulin receptor.
      An insulin receptor fragment used as substrate is not evidence of a binding function. The claim itself (SHP2
      binds the activated insulin receptor) is supported for the ortholog and consistent with the adaptor role,
      so the row is kept as non-core, deferring to the curator on the full text, with this caveat recorded.
    supported_by:
    - reference_id: PMID:7711057
