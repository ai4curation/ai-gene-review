      protein whose intracellular domain binds beta-catenin (full text, PMID:16682528), so the informative
      activity is cadherin binding, which the gene already carries.
    proposed_replacement_terms:
    - id: GO:0045296
      label: cadherin binding
    supported_by:
    - reference_id: PMID:16682528
      supporting_text: Both this assay and reciprocal coimmunoprecipitations of β-catenin followed by
        immunoblotting for Fat1 demonstrated interaction of the two proteins
    - reference_id: UniProtKB:Q9WU82
      supporting_text: Interacts with FAT1 (via the cytoplasmic domain)
